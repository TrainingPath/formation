<script>
var DAY = {
  num: 1,
  title: "L'alphabet et la prononciation",
  subtitle: "Les lettres espagnoles et les sons qui piègent les francophones.",
  theory: `
<h3>1. L'alphabet espagnol</h3>
<p>L'espagnol s'écrit avec le même alphabet latin que le français, mais il possède une lettre en plus : la <strong>ñ</strong> (« ene »). Voici les 27 lettres et le nom de chacune en espagnol :</p>
<pre class="pseudo">a (a)    b (be)    c (ce)    d (de)    e (e)
f (efe)  g (ge)    h (hache) i (i)     j (jota)
k (ka)   l (ele)   m (eme)   n (ene)   ñ (eñe)
o (o)    p (pe)    q (cu)    r (erre)  s (ese)
t (te)   u (u)     v (uve)   w (uve doble)
x (equis) y (ye)   z (zeta)</pre>
<p>Exemple : pour épeler le mot <strong>casa</strong> (maison), on dit « ce, a, ese, a ».</p>
<h3>2. Les voyelles : toujours pures</h3>
<p>Bonne nouvelle : les voyelles espagnoles se prononcent toujours de la même façon, clairement, sans les nasales du français.</p>
<pre class="pseudo">a  se dit « a »  ->  casa (maison)
e  se dit « é »  ->  mesa (table)
i  se dit « i »  ->  sí (oui)
o  se dit « o »  ->  loco (fou)
u  se dit « ou » ->  luna (lune)</pre>
<div class="warn">Il n'y a PAS de sons nasaux en espagnol. Le mot <strong>pan</strong> (pain) se prononce « pane » avec le n bien détaché, jamais « pan » à la française.</div>
<h3>3. Les consonnes qui piègent</h3>
<p>Certaines lettres ne se lisent pas comme en français. Ce sont les plus importantes à retenir :</p>
<pre class="pseudo">j        son « rr » raclé du fond de la gorge  ->  jamón (jambon) = « rramon »
g + e,i  même son que j                        ->  gente (gens) = « rrenté »
h        toujours MUETTE                        ->  hola (bonjour) = « ola »
ñ        son « gn » du français                 ->  España (Espagne) = « éspagna »
ll       son « y » (comme yaourt)               ->  llave (clé) = « yavé »
z        se dit « s » (ou « th » en Espagne)    ->  zapato (chaussure)
v        se prononce comme un b doux            ->  vino (vin) = « bino »</pre>
<div class="tip">La lettre <strong>r</strong> en début de mot ou écrite <strong>rr</strong> se roule fortement : <em>perro</em> (chien) roule le r, alors que <em>pero</em> (mais) a un r simple. La différence change le sens du mot !</div>
<h3>4. L'accent tonique</h3>
<p>Dans chaque mot, une syllabe est prononcée plus fort : c'est l'<strong>accent tonique</strong>. Deux règles suffisent au début :</p>
<pre class="pseudo">Mot finissant par voyelle, n ou s  ->  on accentue l'AVANT-DERNIÈRE syllabe
   casa -> CA-sa      hablan -> HA-blan
Mot finissant par une autre consonne -> on accentue la DERNIÈRE syllabe
   hospital -> hospi-TAL     reloj -> re-LOJ</pre>
<p>Quand un mot fait exception, un <strong>accent écrit</strong> (á, é, í, ó, ú) indique la syllabe forte : <em>café</em> se dit « ca-FÉ », <em>música</em> se dit « MU-si-ca ».</p>
<div class="warn">L'accent écrit espagnol penche toujours à droite (´). Il n'existe ni accent grave (è) ni circonflexe (ê) comme en français.</div>
<h3>5. Les points d'interrogation et d'exclamation inversés</h3>
<p>L'espagnol ouvre les questions et exclamations par un signe retourné, et les ferme par le signe normal :</p>
<pre class="pseudo">¿Cómo estás?      (Comment vas-tu ?)
¡Hola!            (Salut !)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle lettre existe en espagnol mais PAS en français ?", opts: ["ç", "ñ", "ù", "ß"], a: 1, exp: "La ñ (eñe) se prononce comme le « gn » de montagne." },
    { type: "qcm", q: "Comment se prononce le h dans <em>hola</em> ?", opts: ["Comme un « r »", "Comme un « ch »", "Il est muet : « ola »", "Comme un « k »"], a: 2, exp: "Le h espagnol ne se prononce jamais." },
    { type: "qcm", q: "Le mot <em>jamón</em> (jambon) commence par un son proche de…", opts: ["« j » français doux", "« rr » raclé de la gorge", "« ch »", "« y »"], a: 1, exp: "Le j espagnol est un son guttural, comme la jota." },
    { type: "vf", q: "En espagnol, la lettre v se prononce souvent comme un « b » doux.", a: true, exp: "vino se dit « bino » : b et v ont presque le même son." },
    { type: "vf", q: "Les voyelles espagnoles peuvent être nasales, comme en français.", a: false, exp: "Aucune nasale : pan se dit « pane », le n reste audible." },
    { type: "vf", q: "L'accent écrit espagnol peut pencher à gauche, comme le è français.", a: false, exp: "Il n'existe qu'un accent aigu (´) : á, é, í, ó, ú." },
    { type: "qcm", q: "Le groupe <em>ll</em> dans <em>llave</em> (clé) se prononce…", opts: ["« l » double appuyé", "« y » comme dans yaourt", "« ch »", "« gl »"], a: 1, exp: "ll se dit « y » dans la majeure partie du monde hispanophone." },
    { type: "qcm", q: "Où tombe l'accent tonique de <em>casa</em> (finissant par une voyelle) ?", opts: ["Sur la dernière syllabe", "Sur l'avant-dernière syllabe : CA-sa", "Sur la première toujours", "Nulle part"], a: 1, exp: "Mot en voyelle, n ou s : avant-dernière syllabe." },
    { type: "input", q: "Écris le mot espagnol qui signifie « oui » (deux lettres).", a: ["si", "sí"], ph: "un mot", exp: "sí = oui. L'accent le distingue de si (= si conditionnel)." },
    { type: "input", q: "Comment dit-on « bonjour / salut » en espagnol ? (le h est muet)", a: ["hola"], ph: "un mot", exp: "hola se prononce « ola »." },
    { type: "input", q: "Complète le signe qui OUVRE une question : ___Cómo estás?", a: ["¿"], ph: "un signe", exp: "Le point d'interrogation inversé ¿ ouvre toute question." },
    { type: "input", q: "Écris le nom de la lettre ñ en espagnol.", a: ["eñe", "ene", "eñe (n tilde)"], ph: "un mot", exp: "La ñ se nomme « eñe »." },
    { type: "input", q: "Le mot <em>España</em> contient un son « gn ». Écris ce mot correctement avec sa lettre spéciale.", a: ["españa"], ph: "un mot", exp: "España (Espagne) s'écrit avec ñ." },
    { type: "qcm", q: "Quelle paire de mots change de sens selon que le r est roulé ou non ?", opts: ["casa / cosa", "pero / perro", "mesa / masa", "vino / fino"], a: 1, exp: "pero (mais) vs perro (chien) : le rr roulé est distinctif." },
    { type: "qcm", q: "Le mot <em>café</em> porte un accent écrit sur le e final. Où est la syllabe forte ?", opts: ["CA-fe", "ca-FÉ", "les deux également", "aucune"], a: 1, exp: "L'accent écrit marque toujours la syllabe accentuée : ca-FÉ." }
  ],
  final: {
    title: "Exercice final — Lire à voix haute",
    intro: `<p>Voici cinq mots espagnols très courants. Pour chacun, repère le piège de prononciation vu aujourd'hui (h muet, j guttural, ll = y, ñ = gn, v = b, r roulé).</p>
<pre class="pseudo">hola      (bonjour)
jamón     (jambon)
llave     (clé)
mañana    (demain / matin)
perro     (chien)</pre>`,
    questions: [
      { type: "qcm", q: "Dans <em>hola</em>, la première lettre…", opts: ["se prononce « r »", "est muette", "se roule", "est nasale"], a: 1, exp: "Le h est toujours muet : « ola »." },
      { type: "qcm", q: "Dans <em>jamón</em>, le j se prononce…", opts: ["« j » doux français", "« rr » guttural", "« y »", "« ch »"], a: 1, exp: "Son racle de gorge, comme la jota." },
      { type: "qcm", q: "Dans <em>llave</em>, le groupe ll se dit…", opts: ["« y »", "« l » long", "« gl »", "« r »"], a: 0, exp: "ll = « y », donc « yavé »." },
      { type: "qcm", q: "Dans <em>mañana</em>, la ñ apporte le son…", opts: ["« na » simple", "« gn » de montagne", "« nia »", "« m »"], a: 1, exp: "ñ = « gn » : « magnana »." },
      { type: "input", q: "Dans <em>perro</em>, que faut-il faire avec le rr ? Réponds en un mot (verbe à l'infinitif).", a: ["rouler", "le rouler"], ph: "un mot", exp: "On roule fortement le rr : « pérro »." }
    ],
    solution: `<p>Prononciation attendue :</p>
<pre class="pseudo">hola   -> « ola »      (h muet)
jamón  -> « rramone »  (j guttural, accent sur MON)
llave  -> « yavé »     (ll = y)
mañana -> « magnana »  (ñ = gn)
perro  -> « pérro »    (rr roulé, distinct de « pero »)</pre>
<p>Répète ces mots à voix haute chaque jour : la prononciation est une habitude physique qui s'installe par la répétition.</p>`
  }
};
</script>
