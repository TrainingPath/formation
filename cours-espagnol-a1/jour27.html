  title: "Ir a + infinitif : le futur proche",
  subtitle: "Parler de ses projets et de ce qui va bientôt arriver.",
  theory: `
<h3>1. Le verbe « ir » (aller)</h3>
<p>Le futur proche s'appuie sur le verbe <code>ir</code> (aller), qui est irrégulier. Il faut le connaître par cœur.</p>
<pre class="pseudo">yo         voy      → je vais
tú         vas      → tu vas
él/ella    va       → il/elle va
nosotros   vamos    → nous allons
vosotros   vais     → vous allez
ellos      van      → ils/elles vont</pre>
<h3>2. La structure : ir + a + infinitif</h3>
<p>Pour dire ce qu'on VA faire (un projet, un futur proche), on utilise : <code>ir</code> conjugué + <code>a</code> + <strong>verbe à l'infinitif</strong>. C'est exactement comme le français « je vais manger ».</p>
<pre class="pseudo">Voy a comer.          → Je vais manger.
Vas a estudiar.       → Tu vas étudier.
Va a llover.          → Il va pleuvoir.
Vamos a viajar.       → Nous allons voyager.
Van a llegar tarde.   → Ils vont arriver en retard.</pre>
<div class="warn">Le petit <code>a</code> est OBLIGATOIRE entre « ir » et l'infinitif. On ne dit jamais « voy comer » : il faut <strong>voy a comer</strong>.</div>
<h3>3. Les mots du futur</h3>
<pre class="pseudo">mañana        → demain          esta tarde   → cet après-midi
esta noche    → ce soir         la próxima semana → la semaine prochaine
el próximo mes → le mois prochain   pronto     → bientôt
después       → après / ensuite</pre>
<pre class="pseudo">Mañana voy a trabajar.        → Demain je vais travailler.
Esta noche vamos a cenar fuera. → Ce soir nous allons dîner dehors.
La próxima semana voy a viajar. → La semaine prochaine je vais voyager.</pre>
<div class="tip">« ir » sert AUSSI à dire où l'on va : <code>Voy a Madrid</code> (« Je vais à Madrid »). Ne confonds pas : ici « a » introduit un LIEU, pas un infinitif. Le futur proche, lui, est toujours suivi d'un VERBE.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie le verbe « ir » ?", opts: ["avoir", "être", "aller", "faire"], a: 2, exp: "ir = aller." },
    { type: "input", q: "ir, yo : « ___ » (je vais)", a: ["voy"], ph: "…", exp: "yo voy." },
    { type: "qcm", q: "Comment dit-on « tu vas » ?", opts: ["vas", "va", "voy", "van"], a: 0, exp: "tú vas." },
    { type: "input", q: "ir, nosotros : « ___ » (nous allons)", a: ["vamos"], ph: "…", exp: "nosotros vamos." },
    { type: "qcm", q: "La structure du futur proche est…", opts: ["ir + infinitif", "ir + a + infinitif", "ir + gerundio", "ir + que"], a: 1, exp: "ir + a + infinitif (voy a comer)." },
    { type: "input", q: "Complète : « Voy ___ comer. » (le petit mot obligatoire)", a: ["a"], ph: "…", exp: "voy A comer : le « a » est obligatoire." },
    { type: "vf", q: "On ne dit jamais « voy comer » : il faut « voy a comer ».", a: true, exp: "Le « a » est obligatoire." },
    { type: "qcm", q: "« Va a llover » signifie…", opts: ["Il pleut", "Il va pleuvoir", "Il a plu", "Il pleuvait"], a: 1, exp: "va a + infinitif = futur proche." },
    { type: "input", q: "Complète : « Mañana ___ a trabajar. » (yo, ir)", a: ["voy"], ph: "…", exp: "Mañana voy a trabajar." },
    { type: "qcm", q: "Comment dit-on « Nous allons voyager » ?", opts: ["Vamos viajar", "Vamos a viajar", "Van a viajar", "Voy a viajar"], a: 1, exp: "vamos a viajar (nosotros)." },
    { type: "input", q: "Traduis « demain » : ___", a: ["mañana", "manana"], ph: "…", exp: "mañana = demain." },
    { type: "qcm", q: "« Esta noche » signifie…", opts: ["cet après-midi", "ce soir", "hier soir", "demain matin"], a: 1, exp: "esta noche = ce soir." },
    { type: "input", q: "Complète : « Ellos ___ a llegar tarde. » (ir, ils)", a: ["van"], ph: "…", exp: "van a llegar = ils vont arriver." },
    { type: "vf", q: "Dans « Voy a Madrid », le « a » introduit un lieu, pas un infinitif.", a: true, exp: "Ici ir exprime un déplacement vers un lieu." },
    { type: "input", q: "Complète : « ¿Qué ___ a hacer mañana? » (tú, ir : Que vas-tu faire ?)", a: ["vas"], ph: "…", exp: "¿Qué vas a hacer? = Que vas-tu faire ?" }
  ],
  final: {
    title: "Exercice final — Les projets du week-end",
    intro: `<p>Elena raconte ses projets :</p>
<pre class="pseudo">Este fin de semana voy a descansar. → Ce week-end je vais me reposer.
El sábado vamos a ir al cine.       → Samedi nous allons aller au cinéma.
Mi hermano va a estudiar.           → Mon frère va étudier.
El domingo van a venir mis abuelos. → Dimanche mes grands-parents vont venir.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Voy ___ descansar. » (le mot obligatoire)", a: ["a"], ph: "…", exp: "voy a descansar." },

      { type: "input", q: "Complète : « Mi hermano ___ a estudiar. » (ir, il)", a: ["va"], ph: "…", exp: "va a estudiar = il va étudier." },

      { type: "vf", q: "Toutes ces phrases parlent d'actions futures avec « ir a + infinitif ».", a: true, exp: "C'est le futur proche." }
    ],
    solution: `<p>Le futur proche = <code>ir</code> conjugué (<em>voy, vas, va, vamos, vais, van</em>) + <code>a</code> + infinitif. Le <code>a</code> est obligatoire (<em>voy a comer</em>, jamais « voy comer »). On l'accompagne de mots comme <code>mañana, esta noche, la próxima semana, pronto</code>. Attention à ne pas confondre avec <code>ir a</code> + lieu (<em>voy a Madrid</em>), qui exprime un déplacement.</p>`
  }
