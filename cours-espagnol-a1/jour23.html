var DAY = {
  num: 23,
  title: "Le présent continu (estar + gerundio)",
  subtitle: "Dire ce qu'on est en train de faire à l'instant présent.",
  theory: `
<h3>1. À quoi sert le présent continu ?</h3>
<p>Le présent continu décrit une action <strong>en cours au moment où l'on parle</strong> : « je suis en train de… ». Il se forme avec le verbe <code>estar</code> conjugué + le <strong>gérondif</strong> (en espagnol : <em>gerundio</em>).</p>
<pre class="pseudo">estar (conjugué)  +  gerundio
Estoy comiendo.   → Je suis en train de manger.</pre>
<h3>2. Former le gérondif</h3>
<p>On part de l'infinitif et on remplace la terminaison :</p>
<pre class="pseudo">verbes en -ar → -ando    (hablar → hablando)
verbes en -er → -iendo   (comer  → comiendo)
verbes en -ir → -iendo   (vivir  → viviendo)</pre>
<pre class="pseudo">hablar   → hablando   (en train de parler)
trabajar → trabajando (en train de travailler)
comer    → comiendo   (en train de manger)
beber    → bebiendo   (en train de boire)
escribir → escribiendo (en train d'écrire)</pre>
<div class="warn">Le gérondif est INVARIABLE : il ne change ni en genre ni en nombre. Seul <code>estar</code> se conjugue (estoy, estás, está…).</div>
<h3>3. estar conjugué + gerundio</h3>
<pre class="pseudo">Yo estoy hablando.       → Je suis en train de parler.
Tú estás comiendo.       → Tu es en train de manger.
Él está trabajando.      → Il est en train de travailler.
Nosotros estamos viviendo aquí. → Nous sommes en train de vivre ici.
Ellos están escribiendo. → Ils sont en train d'écrire.</pre>
<h3>4. Ne pas confondre avec le présent simple</h3>
<div class="tip">Le présent simple (<code>como</code> = « je mange » / « je mange habituellement ») décrit une habitude ou un fait général. Le présent continu (<code>estoy comiendo</code> = « je suis en train de manger ») insiste sur l'action qui se déroule MAINTENANT.</div>
<pre class="pseudo">Como a la una.         → Je mange à une heure. (habitude)
Estoy comiendo ahora.  → Je suis en train de manger maintenant. (en cours)</pre>`,
  exercises: [
    { type: "qcm", q: "Le présent continu se forme avec…", opts: ["ser + participe", "estar + gerundio", "tener + infinitif", "haber + gerundio"], a: 1, exp: "estar (conjugué) + gerundio." },
    { type: "qcm", q: "Le gérondif d'un verbe en -ar se termine par…", opts: ["-iendo", "-ando", "-endo", "-ado"], a: 1, exp: "hablar → hablando." },
    { type: "input", q: "Gérondif de « comer » : ___", a: ["comiendo"], ph: "…", exp: "comer (-er) → comiendo." },
    { type: "qcm", q: "Le gérondif des verbes en -er et -ir se termine par…", opts: ["-ando", "-iendo", "-endo", "-iando"], a: 1, exp: "comer → comiendo ; vivir → viviendo." },
    { type: "input", q: "Gérondif de « hablar » : ___", a: ["hablando"], ph: "…", exp: "hablar (-ar) → hablando." },
    { type: "vf", q: "Le gérondif est invariable : il ne change ni en genre ni en nombre.", a: true, exp: "Seul estar se conjugue." },
    { type: "input", q: "Complète : « Yo ___ comiendo. » (estar, je)", a: ["estoy"], ph: "…", exp: "estoy comiendo = je suis en train de manger." },
    { type: "qcm", q: "Comment dit-on « Il est en train de travailler » ?", opts: ["Él trabaja", "Él está trabajando", "Él es trabajando", "Él estar trabajar"], a: 1, exp: "está + trabajando." },
    { type: "input", q: "Gérondif de « escribir » : ___", a: ["escribiendo"], ph: "…", exp: "escribir (-ir) → escribiendo." },
    { type: "qcm", q: "« Estoy comiendo ahora » insiste sur…", opts: ["une habitude", "une action en cours maintenant", "le futur", "le passé"], a: 1, exp: "présent continu = action en cours." },
    { type: "input", q: "Complète : « Tú ___ hablando. » (estar, tu)", a: ["estás", "estas"], ph: "…", exp: "estás hablando." },
    { type: "vf", q: "« Como a la una » (habitude) et « Estoy comiendo » (en cours) n'expriment pas la même chose.", a: true, exp: "présent simple vs présent continu." },
    { type: "qcm", q: "Quel est le gérondif de « beber » ?", opts: ["bebando", "bebiendo", "bebendo", "bebido"], a: 1, exp: "beber (-er) → bebiendo." },
    { type: "input", q: "Complète : « Ellos ___ escribiendo. » (estar, ils)", a: ["están", "estan"], ph: "…", exp: "están escribiendo." },
    { type: "qcm", q: "Comment dit-on « Nous sommes en train de vivre ici » ?", opts: ["Vivimos aquí", "Estamos viviendo aquí", "Somos viviendo aquí", "Estar vivir aquí"], a: 1, exp: "estamos + viviendo." }
  ],
  final: {
    title: "Exercice final — Que font-ils maintenant ?",
    intro: `<p>Une scène de famille, en cet instant :</p>
<pre class="pseudo">Mamá está cocinando.        → Maman est en train de cuisiner.
Papá está leyendo.          → Papa est en train de lire.
Los niños están jugando.    → Les enfants sont en train de jouer.
Yo estoy estudiando español. → Moi, je suis en train d'étudier l'espagnol.</pre>`,
    questions: [

      { type: "qcm", q: "« Los niños están jugando » signifie…", opts: ["Les enfants jouent tous les jours", "Les enfants sont en train de jouer", "Les enfants vont jouer", "Les enfants ont joué"], a: 1, exp: "présent continu = action en cours." },
      { type: "input", q: "Complète : « Yo ___ estudiando. » (estar, je)", a: ["estoy"], ph: "…", exp: "estoy estudiando." },
      { type: "qcm", q: "Dans « está leyendo », qu'est-ce qui se conjugue ?", opts: ["leyendo", "está (le verbe estar)", "les deux", "aucun"], a: 1, exp: "Seul estar se conjugue ; le gérondif est fixe." },
      { type: "vf", q: "Toutes ces phrases décrivent des actions en cours en ce moment.", a: true, exp: "C'est justement le rôle du présent continu." }
    ],
    solution: `<p>Formule : <code>estar</code> conjugué + <strong>gerundio</strong>. Le gérondif se forme en remplaçant la terminaison : -ar → <em>-ando</em>, -er / -ir → <em>-iendo</em>. Il reste invariable ; seul estar bouge (estoy/estás/está/estamos/estáis/están). On l'emploie pour ce qui se passe MAINTENANT : <code>Estoy estudiando español</code> = « Je suis en train d'étudier l'espagnol ».</p>`
  }
