var DAY = {

  title: "Les verbes à diphtongue (querer, poder)",
  subtitle: "Des verbes très courants où la voyelle change dans le radical.",
  theory: `
<h3>1. Qu'est-ce qu'un verbe à diphtongue ?</h3>
<p>Certains verbes espagnols très fréquents changent la voyelle de leur <strong>radical</strong> (la partie avant la terminaison) quand elle est accentuée. On parle de <strong>diphtongue</strong> : une seule voyelle devient deux. Les terminaisons, elles, restent normales.</p>
<pre class="pseudo">e → ie   (querer → quiero)
o → ue   (poder → puedo)</pre>
<h3>2. querer (vouloir / aimer) : e → ie</h3>
<pre class="pseudo">yo            quiero      → je veux
tú            quieres     → tu veux
él / ella     quiere      → il / elle veut
nosotros      queremos    → nous voulons
vosotros      queréis     → vous voulez
ellos / ellas quieren     → ils / elles veulent</pre>
<div class="warn">Remarque capitale : la diphtongue disparaît à <strong>nosotros</strong> et <strong>vosotros</strong> (queremos, queréis) : là, le radical n'est pas accentué, donc il reste « quer- ».</div>
<h3>3. poder (pouvoir) : o → ue</h3>
<pre class="pseudo">yo            puedo       → je peux
tú            puedes      → tu peux
él / ella     puede       → il / elle peut
nosotros      podemos     → nous pouvons
vosotros      podéis      → vous pouvez
ellos / ellas pueden      → ils / elles peuvent</pre>
<p>Même schéma : <code>podemos</code> et <code>podéis</code> ne diphtonguent pas.</p>
<h3>4. À quoi ça sert ?</h3>
<p>On les suit souvent d'un verbe à l'infinitif.</p>
<pre class="pseudo">Quiero comer.        → Je veux manger.
¿Quieres un café?    → Veux-tu un café ?
No puedo venir hoy.  → Je ne peux pas venir aujourd'hui.
¿Puedes ayudarme?    → Peux-tu m'aider ?</pre>
<div class="tip">D'autres verbes suivent ces schémas : <code>pensar</code> (penser → pienso), <code>empezar</code> (commencer → empiezo) en e→ie ; <code>dormir</code> (dormir → duermo), <code>volver</code> (revenir → vuelvo) en o→ue.</div>`,
  exercises: [
    { type: "qcm", q: "Dans un verbe à diphtongue e→ie, la voyelle change quand elle est…", opts: ["à la fin", "accentuée (dans le radical)", "au pluriel seulement", "jamais"], a: 1, exp: "La diphtongue apparaît sur la voyelle accentuée du radical." },
    { type: "input", q: "querer, yo : « ___ » (je veux)", a: ["quiero"], ph: "…", exp: "yo quiero (e→ie)." },
    { type: "qcm", q: "Comment dit-on « tu veux » ?", opts: ["queres", "quieres", "quiero", "querés"], a: 1, exp: "tú quieres." },
    { type: "input", q: "querer, nosotros : « ___ » (nous voulons)", a: ["queremos"], ph: "…", exp: "queremos : pas de diphtongue ici." },
    { type: "vf", q: "À « nosotros » et « vosotros », querer ne diphtongue pas (queremos, queréis).", a: true, exp: "Le radical n'y est pas accentué." },
    { type: "qcm", q: "poder suit le schéma…", opts: ["e → ie", "o → ue", "a → ae", "i → ei"], a: 1, exp: "poder : o → ue (puedo)." },
    { type: "input", q: "poder, yo : « ___ » (je peux)", a: ["puedo"], ph: "…", exp: "yo puedo (o→ue)." },
    { type: "qcm", q: "Comment dit-on « il peut » ?", opts: ["pode", "puede", "puedo", "podes"], a: 1, exp: "él puede." },
    { type: "input", q: "poder, nosotros : « ___ » (nous pouvons)", a: ["podemos"], ph: "…", exp: "podemos : pas de diphtongue." },
    { type: "vf", q: "« Quiero comer » signifie « Je veux manger ».", a: true, exp: "querer + infinitif = vouloir faire qqch." },
    { type: "qcm", q: "« No puedo venir hoy » veut dire…", opts: ["Je veux venir aujourd'hui", "Je ne peux pas venir aujourd'hui", "Je peux venir demain", "Il ne peut pas venir"], a: 1, exp: "No puedo = je ne peux pas." },
    { type: "input", q: "Complète : « ¿___ un café? » (Veux-tu un café ?)", a: ["quieres"], ph: "…", exp: "tú quieres." },
    { type: "qcm", q: "Comment dit-on « ils veulent » ?", opts: ["quieren", "queren", "quieres", "queremos"], a: 0, exp: "ellos quieren." },
    { type: "input", q: "Complète : « ¿___ ayudarme? » (Peux-tu m'aider ?)", a: ["puedes"], ph: "…", exp: "tú puedes ayudarme." },
    { type: "vf", q: "Le verbe « dormir » suit le schéma o→ue : yo duermo.", a: true, exp: "dormir → duermo, comme poder." }
  ],
  final: {
    title: "Exercice final — Une invitation",
    intro: `<p>Une petite conversation :</p>
<pre class="pseudo">— ¿Quieres ir al cine?        → Veux-tu aller au cinéma ?
— No puedo, tengo que estudiar. → Je ne peux pas, je dois étudier.
— ¿Y mañana? ¿Puedes?          → Et demain ? Tu peux ?
— Sí, mañana quiero ir.        → Oui, demain je veux y aller.</pre>`,
    questions: [
      { type: "input", q: "Complète : « ¿___ ir al cine? » (Veux-tu…, tú)", a: ["quieres"], ph: "…", exp: "tú quieres." },
      { type: "qcm", q: "« No puedo » signifie…", opts: ["Je veux", "Je ne peux pas", "Je peux", "Il peut"], a: 1, exp: "No puedo = je ne peux pas." },
      { type: "input", q: "Complète : « ¿___? » à propos de demain : « Tu peux ? » (tú, poder)", a: ["puedes"], ph: "…", exp: "¿Puedes? = Tu peux ?" },
      { type: "qcm", q: "« mañana quiero ir » signifie…", opts: ["demain je peux venir", "demain je veux y aller", "hier je voulais aller", "je ne veux pas"], a: 1, exp: "quiero ir = je veux aller." },
      { type: "vf", q: "querer et poder sont des verbes à diphtongue : la voyelle du radical change (quiero, puedo).", a: true, exp: "e→ie et o→ue." }
    ],
    solution: `<p>Les verbes à diphtongue changent la voyelle accentuée du radical : <code>querer</code> (e→ie) donne <em>quiero, quieres, quiere, quieren</em> mais <em>queremos, queréis</em> ; <code>poder</code> (o→ue) donne <em>puedo, puedes, puede, pueden</em> mais <em>podemos, podéis</em>. On les emploie très souvent suivis d'un infinitif : <code>quiero comer</code>, <code>no puedo venir</code>.</p>`
  }
};
