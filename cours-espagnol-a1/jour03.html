<script>
var DAY = {
  num: 3,
  title: "Les pronoms personnels sujets",
  subtitle: "Yo, tú, él… qui fait l'action ?",
  theory: `
<h3>1. Qu'est-ce qu'un pronom sujet ?</h3>
<p>Un <strong>pronom personnel sujet</strong> désigne celui qui fait l'action : « je », « tu », « il »… En espagnol, voici la liste complète :</p>
<pre class="pseudo">yo            je
tú            tu
él            il
ella          elle
usted         vous (de politesse, une personne)
nosotros      nous (groupe masculin ou mixte)
nosotras      nous (groupe uniquement féminin)
vosotros      vous (tutoiement pluriel, masculin/mixte)
vosotras      vous (tutoiement pluriel, féminin)
ellos         ils
ellas         elles
ustedes       vous (politesse, plusieurs personnes)</pre>
<h3>2. Le grand piège : le « vous »</h3>
<p>Le français a un seul « vous ». L'espagnol en a plusieurs selon le respect et le nombre :</p>
<pre class="pseudo">tú        tutoiement, UNE personne          (un ami)
usted     vouvoiement poli, UNE personne     (un inconnu, un supérieur)
vosotros  tutoiement, PLUSIEURS personnes    (un groupe d'amis, en Espagne)
ustedes   vouvoiement, PLUSIEURS personnes   (poli ; seul pluriel en Amérique latine)</pre>
<div class="warn">Fait surprenant : <strong>usted</strong> et <strong>ustedes</strong> se conjuguent comme « il/elle » et « ils/elles » (3e personne), pas comme « tu ». On dit <em>usted es</em> (« vous êtes ») avec la même forme que <em>él es</em>.</div>
<h3>3. Le masculin et le féminin des groupes</h3>
<p>« Nous », « vous » (pluriel familier) et « ils » ont une forme masculine et une forme féminine :</p>
<pre class="pseudo">nosotros / nosotras     nous (hommes+mixte / femmes seules)
vosotros / vosotras     vous (hommes+mixte / femmes seules)
ellos / ellas           ils / elles</pre>
<div class="tip">Règle d'or : dès qu'il y a UN seul homme dans le groupe, on utilise la forme masculine (nosotros, ellos). La forme en -as est réservée aux groupes 100 % féminins.</div>
<h3>4. Le pronom que l'on ne dit pas</h3>
<p>Comme vu au jour 2, le pronom sujet est souvent <strong>omis</strong> car la terminaison du verbe suffit à savoir qui parle :</p>
<pre class="pseudo">(Yo) soy español.       Je suis espagnol.
(Tú) eres amable.       Tu es aimable.
(Nosotros) somos amigos. Nous sommes amis.</pre>
<p>On ajoute le pronom seulement pour <strong>insister</strong> ou <strong>opposer</strong> : <em>Yo soy Ana, tú eres Luis</em> (Moi je suis Ana, toi tu es Luis).</p>
<div class="warn">Le pronom « il » impersonnel (« il pleut », « il faut ») n'existe pas en espagnol : on dit simplement <em>Llueve</em> (il pleut), sans pronom.</div>`,
  exercises: [
    { type: "qcm", q: "Quel pronom signifie « je » ?", opts: ["tú", "yo", "él", "ella"], a: 1, exp: "yo = je." },
    { type: "qcm", q: "Pour vouvoyer poliment UNE personne, on emploie…", opts: ["tú", "vosotros", "usted", "ellos"], a: 2, exp: "usted = vous de politesse (singulier)." },
    { type: "qcm", q: "Un groupe de trois femmes se désigne par…", opts: ["nosotros", "nosotras", "vosotros", "ellos"], a: 1, exp: "Groupe 100 % féminin : nosotras." },
    { type: "vf", q: "En Amérique latine, on utilise « vosotros » pour tutoyer un groupe.", a: false, exp: "En Amérique latine, on emploie ustedes pour tout pluriel. Vosotros est surtout espagnol." },
    { type: "vf", q: "« usted » se conjugue comme la 3e personne (comme él/ella).", a: true, exp: "usted es, comme él es : c'est un piège classique." },
    { type: "vf", q: "Un groupe formé d'hommes et de femmes se dit « nosotras ».", a: false, exp: "Dès qu'il y a un homme, on utilise nosotros (masculin)." },
    { type: "qcm", q: "Quelle est la forme féminine de « ellos » ?", opts: ["ellas", "ellos", "ustedes", "vosotras"], a: 0, exp: "ellas = elles." },
    { type: "qcm", q: "Pourquoi peut-on dire « Soy Ana » sans « yo » ?", opts: ["Parce que c'est incorrect", "Parce que la terminaison du verbe indique déjà la personne", "Parce que yo n'existe pas", "Parce qu'on parle à un ami"], a: 1, exp: "La conjugaison porte l'information : le pronom est facultatif." },
    { type: "input", q: "Écris le pronom espagnol qui signifie « tu ».", a: ["tú", "tu"], ph: "un mot", exp: "tú = tu (avec accent pour le distinguer de tu possessif)." },
    { type: "input", q: "Écris le pronom pour « nous » (groupe d'hommes ou mixte).", a: ["nosotros"], ph: "un mot", exp: "nosotros = nous (masculin/mixte)." },
    { type: "input", q: "Complète : Para saludar con respeto a una persona mayor, uso ___. (le pronom de politesse)", a: ["usted"], ph: "un mot", exp: "usted, le vouvoiement singulier." },
    { type: "input", q: "Écris le pronom « elles ».", a: ["ellas"], ph: "un mot", exp: "ellas = elles (groupe féminin)." },
    { type: "input", q: "Traduis le pronom « vous » pour vouvoyer PLUSIEURS personnes.", a: ["ustedes"], ph: "un mot", exp: "ustedes = vous (pluriel, poli ; seul pluriel en Amérique latine)." },
    { type: "qcm", q: "« Vosotras » désigne…", opts: ["un groupe d'hommes qu'on tutoie", "un groupe de femmes qu'on tutoie", "une personne qu'on vouvoie", "nous, les femmes"], a: 1, exp: "vosotras = vous (tutoiement, femmes)." },
    { type: "qcm", q: "Comment traduit-on « il pleut » (pronom impersonnel) ?", opts: ["Él llueve", "Llueve", "Ello llueve", "Eso llueve"], a: 1, exp: "Pas de « il » impersonnel en espagnol : simplement Llueve." }
  ],
  final: {
    title: "Exercice final — Choisir le bon pronom",
    intro: `<p>Pour chaque situation, choisis le pronom sujet adapté. Pense au nombre (une ou plusieurs personnes), au respect (tutoiement ou vouvoiement) et au genre du groupe.</p>
<pre class="pseudo">Situations :
A. Tu parles à ton meilleur ami.
B. Tu t'adresses poliment à ton médecin.
C. Tu parles d'un groupe de trois amies.
D. Tu désignes ton frère et toi.</pre>`,
    questions: [
      { type: "qcm", q: "A. Ton meilleur ami : quel pronom ?", opts: ["usted", "tú", "vosotros", "él"], a: 1, exp: "Ami proche, singulier : tú." },
      { type: "qcm", q: "B. Ton médecin, poliment : quel pronom ?", opts: ["tú", "usted", "ustedes", "vosotros"], a: 1, exp: "Vouvoiement singulier : usted." },
      { type: "qcm", q: "C. Trois amies : quel pronom ?", opts: ["ellos", "ellas", "nosotras", "vosotras"], a: 1, exp: "Groupe féminin dont on parle : ellas." },
      { type: "input", q: "D. Ton frère et toi (« nous », groupe mixte) : écris le pronom.", a: ["nosotros"], ph: "un mot", exp: "Un homme dans le groupe : nosotros." },
      { type: "vf", q: "Dans tous ces cas, il serait obligatoire d'écrire le pronom devant le verbe.", a: false, exp: "Le pronom reste facultatif : il sert surtout à clarifier ou insister." }
    ],
    solution: `<p>Réponses :</p>
<pre class="pseudo">A. tú          (ami proche, singulier)
B. usted       (respect, singulier ; se conjugue comme él)
C. ellas       (groupe féminin)
D. nosotros    (groupe mixte -> masculin)</pre>
<p>Maîtriser le système des « vous » espagnols (tú, usted, vosotros, ustedes) est l'une des clés pour parler avec le bon niveau de politesse.</p>`
  }
};
</script>
