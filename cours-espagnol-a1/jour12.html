  theory: `
<h3>1. L'accord de l'adjectif</h3>
<p>Un <strong>adjectif</strong> décrit un nom (grand, rouge, sympathique). En espagnol, il s'accorde en <strong>genre</strong> et en <strong>nombre</strong> avec le nom.</p>
<pre class="pseudo">          masculin        féminin
singulier alto            alta
pluriel   altos           altas</pre>
<pre class="pseudo">el niño alto      le garçon grand
la niña alta      la fille grande
los niños altos   les garçons grands
las niñas altas   les filles grandes</pre>
<h3>2. Les adjectifs en -e ou en consonne</h3>
<p>Certains adjectifs ne changent PAS au féminin : ceux qui finissent par -e ou par une consonne. Ils varient seulement en nombre.</p>
<pre class="pseudo">grande -> grande / grandes        (identique masc./fém.)
   un coche grande, una casa grande
inteligente -> inteligente / inteligentes
   un niño inteligente, una niña inteligente
azul -> azul / azules             (bleu, même forme)
   un coche azul, una casa azul</pre>
<div class="tip">Résumé : adjectif en -o -> 4 formes (o/a/os/as). Adjectif en -e ou en consonne -> 2 formes (sing./pl.), pas de féminin distinct.</div>
<h3>3. La place de l'adjectif : APRÈS le nom</h3>
<p>Contrairement au français qui hésite, l'espagnol place presque toujours l'adjectif <strong>après</strong> le nom :</p>
<pre class="pseudo">une voiture rouge   ->  un coche rojo      (rojo APRÈS coche)
une grande maison   ->  una casa grande    (grande APRÈS casa)
un livre intéressant -> un libro interesante</pre>
<div class="warn">Attention : là où le français dit « une grande maison » (adjectif avant), l'espagnol dit <em>una casa grande</em> (adjectif après). Ne calque pas l'ordre français !</div>
<h3>4. Les nationalités s'accordent aussi</h3>
<pre class="pseudo">español / española / españoles / españolas
francés / francesa / franceses / francesas
   un chico español, una chica española</pre>
<div class="warn">Les adjectifs de nationalité s'écrivent avec une MINUSCULE en espagnol : <em>español</em>, <em>francés</em>, pas « Español ». (Différent de l'anglais.)</div>
<h3>5. Quelques adjectifs qui se placent avant</h3>
<p>Un petit groupe se met devant le nom, notamment <strong>bueno</strong> (bon) et <strong>malo</strong> (mauvais), qui se raccourcissent alors :</p>
<pre class="pseudo">un buen amigo      un bon ami   (bueno -> buen devant nom masc. sing.)
un mal día         un mauvais jour  (malo -> mal)
una buena idea     une bonne idée   (buena, féminin, ne se raccourcit pas)</pre>`,

    { type: "qcm", q: "Traduis l'ordre français « une petite maison » en respectant l'espagnol :", opts: ["una pequeña casa", "una casa pequeña", "pequeña una casa", "casa una pequeña"], a: 1, exp: "Adjectif après le nom : una casa pequeña." }
  ],

    ],
    solution: `<p>Règles à retenir :</p>
<pre class="pseudo">Adjectif en -o : 4 formes (rojo/roja/rojos/rojas)
Adjectif en -e ou consonne : 2 formes (grande/grandes, azul/azules)

Nationalités : minuscule + accord (español/española)</pre>
<p>Accorder et bien placer l'adjectif rend ton espagnol immédiatement plus naturel.</p>`
