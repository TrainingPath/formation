  title: "La nourriture ; me gusta",
  subtitle: "Le vocabulaire des aliments et la construction « me gusta / me gustan ».",
  theory: `
<h3>1. Le vocabulaire de la nourriture</h3>
<p>Quelques aliments courants (<code>la comida</code> = la nourriture / le repas).</p>
<pre class="pseudo">el pan      → le pain        la fruta   → le fruit / les fruits
la carne    → la viande      el pescado → le poisson
la verdura  → les légumes    el queso   → le fromage
el agua     → l'eau          la leche   → le lait
el café     → le café        el huevo   → l'œuf
la manzana  → la pomme       el pollo   → le poulet</pre>
<h3>2. La construction de « gustar » : attention !</h3>
<p>Le verbe <code>gustar</code> ne fonctionne PAS comme « aimer » en français. Littéralement, il signifie « plaire ». On ne dit pas « je aime la pizza » mais « la pizza ME plaît ». C'est la chose aimée qui est le <strong>sujet</strong> du verbe, pas la personne.</p>
<pre class="pseudo">Me gusta la pizza.   → littéralement : « La pizza me plaît »
                       traduction : « J'aime la pizza ».</pre>
<div class="warn">Conséquence essentielle : le verbe s'accorde avec la CHOSE aimée, pas avec « je ». Il n'y a donc que deux formes à retenir au présent : <strong>gusta</strong> (chose au singulier) et <strong>gustan</strong> (choses au pluriel).</div>
<h3>3. gusta ou gustan ?</h3>
<pre class="pseudo">Me gusta el café.       → J'aime le café.        (café = singulier → gusta)
Me gusta la fruta.      → J'aime les fruits.     (fruta = singulier → gusta)
Me gustan las manzanas. → J'aime les pommes.     (manzanas = pluriel → gustan)
Me gustan los huevos.   → J'aime les œufs.       (huevos = pluriel → gustan)
Me gusta comer.         → J'aime manger.         (un verbe = gusta)</pre>
<div class="tip">Devant un VERBE à l'infinitif (comer, beber, cantar…), on emploie toujours <strong>gusta</strong> : « Me gusta bailar » = « J'aime danser ».</div>
<h3>4. Qui aime ? Les pronoms</h3>
<p>Le petit mot devant (<code>me</code>, <code>te</code>, <code>le</code>…) indique QUI aime.</p>
<pre class="pseudo">me gusta   → j'aime          nos gusta  → nous aimons
te gusta   → tu aimes        os gusta   → vous aimez
le gusta   → il/elle aime    les gusta  → ils/elles aiment</pre>
<pre class="pseudo">¿Te gusta el pescado?   → Aimes-tu le poisson ?
No me gusta la carne.   → Je n'aime pas la viande.
Nos gustan las verduras. → Nous aimons les légumes.</pre>`,

    { type: "qcm", q: "Avec « gustar », le verbe s'accorde avec…", opts: ["la personne qui aime", "la chose aimée", "toujours au pluriel", "toujours au singulier"], a: 1, exp: "C'est la chose aimée qui est le sujet." },
    { type: "input", q: "Complète : « Me ___ el café. » (chose au singulier)", a: ["gusta"], ph: "gusta / gustan", exp: "café est singulier → gusta." },
    { type: "input", q: "Complète : « Me ___ las manzanas. » (chose au pluriel)", a: ["gustan"], ph: "gusta / gustan", exp: "manzanas est pluriel → gustan." },

    { type: "vf", q: "Devant un verbe à l'infinitif (comer, bailar), on utilise toujours « gusta ».", a: true, exp: "Me gusta bailar = J'aime danser." },
    { type: "input", q: "Complète : « Me gusta ___. » (J'aime manger, verbe manger)", a: ["comer"], ph: "…", exp: "comer = manger ; devant un infinitif → gusta." },
    { type: "qcm", q: "Le mot « te » dans « te gusta » indique…", opts: ["qu'il aime", "que tu aimes", "que nous aimons", "que j'aime"], a: 1, exp: "te = tu (tu aimes)." },
    { type: "input", q: "Complète : « No ___ gusta la carne. » (Je n'aime pas)", a: ["me"], ph: "…", exp: "me = je : No me gusta = je n'aime pas." },
    { type: "vf", q: "« Me gustan » se traduit par « j'aime » quand la chose aimée est au pluriel.", a: true, exp: "gustan pour un objet pluriel." },
    { type: "qcm", q: "« Nos gustan las verduras » signifie…", opts: ["J'aime les légumes", "Tu aimes les légumes", "Nous aimons les légumes", "Ils aiment les légumes"], a: 2, exp: "nos = nous ; verduras pluriel → gustan." },
    { type: "input", q: "Traduis « la viande » : « la ___ »", a: ["carne"], ph: "…", exp: "la carne = la viande." },
    { type: "qcm", q: "Pourquoi dit-on « Me gusta la fruta » (et non gustan) ?", opts: ["C'est une erreur", "fruta est un singulier en espagnol", "fruta est un verbe", "On utilise toujours gusta"], a: 1, exp: "la fruta est grammaticalement singulier → gusta." }
  ],
  final: {
    title: "Exercice final — Les goûts de Ana",
    intro: `<p>Ana parle de ce qu'elle aime manger :</p>
<pre class="pseudo">Me gusta el pescado.          → J'aime le poisson.
Me gustan las frutas.         → J'aime les fruits.

      { type: "qcm", q: "« ¿Te gusta el queso? » veut dire…", opts: ["J'aime le fromage", "Aimes-tu le fromage ?", "Il aime le fromage", "Nous aimons le fromage"], a: 1, exp: "te gusta = tu aimes ; question." },
      { type: "vf", q: "Dans « Me gustan las frutas », « gustan » est au pluriel car « frutas » est au pluriel.", a: true, exp: "Le verbe s'accorde avec la chose aimée." }
    ],
    solution: `<p>À retenir absolument : avec <code>gustar</code>, on tourne la phrase à l'envers. Ce n'est pas la personne mais la CHOSE aimée qui commande le verbe. D'où seulement deux formes : <code>gusta</code> (chose singulière ou verbe) et <code>gustan</code> (chose plurielle). Le pronom en tête (<code>me / te / le / nos / os / les</code>) indique qui aime. Exemple complet : <code>Me gustan los huevos pero no me gusta la carne</code> = « J'aime les œufs mais je n'aime pas la viande ».</p>`
  }
