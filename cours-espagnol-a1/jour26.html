<h3>1. Demander son chemin</h3>
<pre class="pseudo">¿Dónde está el banco?          → Où est la banque ?
¿Hay una farmacia por aquí?    → Y a-t-il une pharmacie par ici ?
¿Cómo llego a la estación?     → Comment j'arrive à la gare ?
Perdone, ¿la plaza mayor?      → Pardon, la grand-place ?</pre>
<div class="tip">On commence poliment par <code>Perdone</code> (« pardon », vouvoiement) ou <code>Perdona</code> (tutoiement), puis on pose la question avec <code>¿Dónde está…?</code> (jour 21).</div>
<h3>2. Indiquer une direction</h3>
<p>Pour donner une direction, on utilise souvent l'<strong>impératif</strong> (l'ordre) à la forme polie, ou le verbe <code>seguir</code> / <code>girar</code>.</p>
<pre class="pseudo">Siga todo recto.        → Continuez tout droit.
Gire a la derecha.      → Tournez à droite.
Gire a la izquierda.    → Tournez à gauche.
Cruce la calle.         → Traversez la rue.
Tome la primera calle.  → Prenez la première rue.</pre>
<h3>3. Les mots de direction et de lieu</h3>
<pre class="pseudo">a la derecha    → à droite       a la izquierda → à gauche
todo recto      → tout droit     la calle       → la rue
la esquina      → le coin        la plaza       → la place
el semáforo     → le feu tricolore   la parada    → l'arrêt
cerca / lejos   → près / loin    aquí / allí    → ici / là-bas</pre>
<h3>4. Un échange complet</h3>
<pre class="pseudo">— Perdone, ¿dónde está la estación?     → Pardon, où est la gare ?
— Siga todo recto y gire a la derecha.  → Continuez tout droit et tournez à droite.
— Está cerca del semáforo.              → C'est près du feu.
— ¡Muchas gracias!                      → Merci beaucoup !</pre>
<div class="warn">Ne confonds pas <code>a la derecha</code> (à droite) et <code>a la izquierda</code> (à gauche). Astuce : « izquierda » ressemble à rien de français, « derecha » rappelle « direct / droit ».</div>`,
