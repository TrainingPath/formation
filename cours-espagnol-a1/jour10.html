<h3>1. Rappel : tener = avoir</h3>
<p>Tu connais déjà la conjugaison de <strong>tener</strong> (jour 9). Rappel rapide :</p>
<pre class="pseudo">yo tengo    tú tienes    él/ella/usted tiene
nosotros tenemos    vosotros tenéis    ellos/ustedes tienen</pre>
<p>Emploi de base : la possession.</p>
<pre class="pseudo">Tengo un coche.        J'ai une voiture.
Tenemos dos hijos.     Nous avons deux enfants.
¿Tienes hermanos?      As-tu des frères et sœurs ?</pre>
<h3>2. Les expressions idiomatiques avec tener</h3>
<p>Là où le français dit « ÊTRE + adjectif », l'espagnol dit très souvent « AVOIR + nom ». Ces expressions sont à mémoriser :</p>
<pre class="pseudo">tener hambre       avoir faim        (littéralement « avoir de la faim »)
tener sed          avoir soif
tener frío         avoir froid
tener calor        avoir chaud
tener sueño        avoir sommeil
tener miedo        avoir peur
tener prisa        être pressé
tener razón        avoir raison
tener suerte       avoir de la chance</pre>
<div class="warn">Piège majeur : on dit <em>tengo frío</em> (« j'ai froid »), PAS « estoy frío » ni « soy frío ». Pour ces sensations, l'espagnol emploie TENER, comme le français « avoir faim/froid ».</div>
<h3>3. Renforcer avec « mucho / mucha »</h3>
<p>Pour dire « très faim », « très froid », on utilise <strong>mucho</strong> (beaucoup), accordé au nom :</p>
<pre class="pseudo">Tengo mucha hambre.    J'ai très faim. (hambre est féminin -> mucha)
Tengo mucho frío.      J'ai très froid. (frío est masculin -> mucho)
Tienen mucha prisa.    Ils sont très pressés.</pre>
<div class="tip">Comme « faim/froid » sont ici des NOMS (et non des adjectifs), on les renforce avec mucho/mucha (beaucoup de), pas avec muy (très). On dit tengo mucha hambre, jamais « muy hambre ».</div>
<h3>4. tener que + infinitif : l'obligation</h3>
<p>La structure <strong>tener que</strong> + verbe à l'infinitif exprime l'obligation (« devoir faire ») :</p>
<pre class="pseudo">Tengo que estudiar.       Je dois étudier.
Tienes que comer.         Tu dois manger.
Tenemos que trabajar.     Nous devons travailler.</pre>
<div class="warn">N'oublie pas le petit mot <em>que</em> : « tengo estudiar » est incorrect ; il faut <em>tengo que estudiar</em>.</div>`,
