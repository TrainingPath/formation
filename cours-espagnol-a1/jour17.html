<script>
var DAY = {
  num: 17,
  title: "Les jours, les mois, les dates",
  subtitle: "Nommer les jours et les mois, écrire et dire une date.",
  theory: `
<h3>1. Les jours de la semaine</h3>
<p>Les jours de la semaine (<code>los días de la semana</code>) sont masculins et s'écrivent <strong>sans majuscule</strong> en espagnol.</p>
<pre class="pseudo">lunes      → lundi
martes     → mardi
miércoles  → mercredi
jueves     → jeudi
viernes    → vendredi
sábado     → samedi
domingo    → dimanche</pre>
<div class="tip">« Le lundi » (habituel) se dit <code>el lunes</code>. « Les lundis » (tous les lundis) se dit <code>los lunes</code> : la plupart des jours ne changent pas au pluriel (sauf sábados / domingos).</div>
<h3>2. Les mois de l'année</h3>
<p>Les mois (<code>los meses</code>) sont aussi masculins et sans majuscule.</p>
<pre class="pseudo">enero  febrero  marzo     abril   mayo      junio
julio  agosto   septiembre  octubre  noviembre  diciembre</pre>
<pre class="pseudo">enero      → janvier      julio       → juillet
febrero    → février      agosto      → août
marzo      → mars         septiembre  → septembre
abril      → avril        octubre     → octobre
mayo       → mai          noviembre   → novembre
junio      → juin         diciembre   → décembre</pre>
<h3>3. Dire et écrire la date</h3>
<p>Pour demander la date : <code>¿Qué día es hoy?</code> (« Quel jour sommes-nous ? »). La date se construit avec <code>el</code> + <strong>nombre</strong> + <code>de</code> + <strong>mois</strong> (+ <code>de</code> + année).</p>
<pre class="pseudo">Hoy es el 5 de mayo.            → Aujourd'hui, c'est le 5 mai.
Es el 12 de octubre de 2026.    → C'est le 12 octobre 2026.
Mi cumpleaños es el 3 de junio. → Mon anniversaire est le 3 juin.</pre>
<div class="warn">Contrairement au français, on n'utilise PAS « premier » : on dit <code>el uno de mayo</code> (« le un mai ») et non « el primero ». On emploie les nombres normaux (uno, dos, tres…).</div>
<h3>4. Quelques mots utiles du temps</h3>
<pre class="pseudo">hoy       → aujourd'hui       ayer   → hier
mañana    → demain            la semana → la semaine
el mes    → le mois           el año → l'année</pre>`,
  exercises: [
    { type: "qcm", q: "Comment s'écrit « lundi » en espagnol ?", opts: ["Lunes", "lunes", "Lundi", "lundes"], a: 1, exp: "lunes, sans majuscule." },
    { type: "input", q: "Traduis « mercredi » : ___", a: ["miércoles", "miercoles"], ph: "…", exp: "miércoles." },
    { type: "qcm", q: "Les jours de la semaine en espagnol prennent-ils une majuscule ?", opts: ["Oui, toujours", "Non, jamais (sauf début de phrase)", "Seulement le dimanche", "Seulement les week-ends"], a: 1, exp: "Jours et mois s'écrivent en minuscule." },
    { type: "input", q: "Traduis « samedi » : ___", a: ["sábado", "sabado"], ph: "…", exp: "sábado." },
    { type: "vf", q: "« el domingo » signifie « le dimanche ».", a: true, exp: "domingo = dimanche." },
    { type: "qcm", q: "Quel mois correspond à « agosto » ?", opts: ["avril", "août", "octobre", "avril"], a: 1, exp: "agosto = août." },
    { type: "input", q: "Traduis « janvier » : ___", a: ["enero"], ph: "…", exp: "enero = janvier." },
    { type: "qcm", q: "Comment demande-t-on « Quel jour sommes-nous ? »", opts: ["¿Qué hora es?", "¿Qué día es hoy?", "¿Cómo te llamas?", "¿Dónde vives?"], a: 1, exp: "¿Qué día es hoy? = Quel jour sommes-nous ?" },
    { type: "input", q: "Complète : « Hoy es el 5 ___ mayo. » (le 5 mai)", a: ["de"], ph: "…", exp: "el + nombre + de + mois." },
    { type: "vf", q: "Pour « le 1er mai », l'espagnol dit « el uno de mayo » (et non « el primero »).", a: true, exp: "On utilise les nombres normaux, pas les ordinaux." },
    { type: "qcm", q: "Que signifie « ayer » ?", opts: ["aujourd'hui", "demain", "hier", "la semaine"], a: 2, exp: "ayer = hier." },
    { type: "input", q: "Traduis « décembre » : ___", a: ["diciembre"], ph: "…", exp: "diciembre = décembre." },
    { type: "qcm", q: "« Mi cumpleaños es el 3 de junio » signifie…", opts: ["Mon anniversaire est le 3 juillet", "Mon anniversaire est le 3 juin", "Mon anniversaire est le 6 mars", "Ma fête est le 3 janvier"], a: 1, exp: "junio = juin ; cumpleaños = anniversaire." },
    { type: "vf", q: "« mañana » peut vouloir dire « demain » (mais aussi « le matin »).", a: true, exp: "mañana = demain / le matin, selon le contexte." },
    { type: "input", q: "Traduis « la semaine » : « la ___ »", a: ["semana"], ph: "…", exp: "la semana = la semaine." }
  ],
  final: {
    title: "Exercice final — Le calendrier de Pablo",
    intro: `<p>Pablo parle de ses dates importantes :</p>
<pre class="pseudo">Hoy es lunes, 6 de abril.          → Aujourd'hui, c'est lundi 6 avril.
Mi cumpleaños es el 20 de julio.   → Mon anniversaire est le 20 juillet.
El examen es el jueves.            → L'examen est jeudi.
Las vacaciones empiezan en agosto. → Les vacances commencent en août.</pre>`,
    questions: [
      { type: "qcm", q: "Quel jour est-on aujourd'hui d'après le texte ?", opts: ["martes", "lunes", "domingo", "viernes"], a: 1, exp: "Hoy es lunes = aujourd'hui c'est lundi." },
      { type: "input", q: "Quel est le mois de l'anniversaire de Pablo ? ___", a: ["julio"], ph: "…", exp: "el 20 de julio = 20 juillet." },
      { type: "qcm", q: "Quand a lieu l'examen ?", opts: ["lundi", "mercredi", "jeudi", "vendredi"], a: 2, exp: "El examen es el jueves = jeudi." },
      { type: "input", q: "En quel mois commencent les vacances ? ___", a: ["agosto"], ph: "…", exp: "empiezan en agosto = commencent en août." },
      { type: "vf", q: "Dans « el 6 de abril », le mot « de » relie le nombre au mois.", a: true, exp: "Structure : el + nombre + de + mois." }
    ],
    solution: `<p>Retiens la structure de la date : <code>el</code> + nombre + <code>de</code> + mois (+ <code>de</code> + année). Jours et mois s'écrivent sans majuscule, et on emploie les nombres normaux (pas « premier »). Pour situer un événement : <code>el jueves</code> (jeudi), <code>en agosto</code> (en août).</p>`
  }
};
</script>
