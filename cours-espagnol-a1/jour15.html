var DAY = {

  title: "Les mots interrogatifs (qué, dónde...)",
  subtitle: "Poser des questions précises : quoi, où, quand, pourquoi, combien.",
  theory: `
<h3>1. À quoi servent les mots interrogatifs ?</h3>
<p>Un <strong>mot interrogatif</strong> ouvre une question qui attend une information précise (et non un simple oui/non). En français : « où ? », « quand ? », « pourquoi ? ». En espagnol, tous portent un <strong>accent écrit</strong>.</p>
<h3>2. La liste des mots interrogatifs</h3>
<pre class="pseudo">qué          quoi / que / quel      ¿Qué es esto?        Qu'est-ce que c'est ?
quién        qui                    ¿Quién es?           Qui est-ce ?
dónde        où                     ¿Dónde vives?        Où vis-tu ?
cuándo       quand                  ¿Cuándo llegas?      Quand arrives-tu ?
cómo         comment                ¿Cómo estás?         Comment vas-tu ?
por qué      pourquoi               ¿Por qué estudias?   Pourquoi étudies-tu ?
cuánto       combien                ¿Cuánto cuesta?      Combien ça coûte ?
cuál         lequel / quel          ¿Cuál prefieres?     Lequel préfères-tu ?</pre>
<div class="tip">Tous ces mots portent un accent écrit (á, é, ó, ú) quand ils posent une question. C'est cet accent qui les distingue des mots normaux : <em>que</em> (que, sans accent) devient <em>qué</em> (quoi ?) dans une question.</div>
<h3>3. La question complète : ¿mot interrogatif + verbe + sujet?</h3>
<pre class="pseudo">¿Dónde vives (tú)?        Où vis-tu ?
¿Qué comes?               Que manges-tu ?
¿Cuándo llega el tren?    Quand arrive le train ?
¿Por qué no comes?        Pourquoi ne manges-tu pas ?</pre>
<h3>4. Deux pièges à connaître</h3>
<p>D'abord, <strong>por qué</strong> (pourquoi, en deux mots avec accent) répond avec <strong>porque</strong> (parce que, en un mot sans accent) :</p>
<pre class="pseudo">¿Por qué estudias español?   Pourquoi étudies-tu l'espagnol ?
Porque me gusta.             Parce que ça me plaît.</pre>
<div class="warn">Ne confonds pas : <em>por qué</em> (deux mots, accent) = pourquoi (question) ; <em>porque</em> (un mot, sans accent) = parce que (réponse).</div>
<p>Ensuite, <strong>cuánto</strong> s'accorde comme un adjectif quand il précède un nom :</p>
<pre class="pseudo">¿Cuánto dinero tienes?    Combien d'argent as-tu ? (dinero masc. sing.)
¿Cuántos años tienes?     Quel âge as-tu ? (años masc. pl. -> cuántos)
¿Cuántas casas hay?       Combien de maisons y a-t-il ? (fém. pl. -> cuántas)</pre>
<div class="warn">Rappel du jour 9 : « quel âge as-tu ? » se dit <em>¿Cuántos años tienes?</em> (combien d'années as-tu), avec cuántos accordé au pluriel.</div>`,
  exercises: [
    { type: "qcm", q: "« Où vis-tu ? » se dit…", opts: ["¿Qué vives?", "¿Dónde vives?", "¿Cuándo vives?", "¿Cómo vives?"], a: 1, exp: "dónde = où." },
    { type: "qcm", q: "Quel mot signifie « pourquoi » (dans une question) ?", opts: ["porque", "por qué", "por que", "porqué"], a: 1, exp: "por qué (deux mots, accent) pour la question." },
    { type: "qcm", q: "« Qui est-ce ? » se dit…", opts: ["¿Qué es?", "¿Quién es?", "¿Cuál es?", "¿Dónde es?"], a: 1, exp: "quién = qui." },
    { type: "vf", q: "Les mots interrogatifs portent un accent écrit quand ils posent une question.", a: true, exp: "qué, dónde, cuándo… : accent obligatoire." },
    { type: "vf", q: "« porque » (un mot) veut dire « pourquoi ».", a: false, exp: "porque (un mot) = parce que ; por qué (deux mots) = pourquoi." },
    { type: "vf", q: "« cuánto » peut s'accorder en genre et en nombre.", a: true, exp: "cuántos años, cuántas casas : accord avec le nom." },
    { type: "qcm", q: "« Comment vas-tu ? » se dit…", opts: ["¿Qué estás?", "¿Cómo estás?", "¿Cuándo estás?", "¿Dónde estás?"], a: 1, exp: "cómo = comment." },
    { type: "qcm", q: "« Combien ça coûte ? » se dit…", opts: ["¿Cuál cuesta?", "¿Cuánto cuesta?", "¿Qué cuesta?", "¿Cómo cuesta?"], a: 1, exp: "cuánto = combien." },
    { type: "input", q: "Complète : ¿___ comes? (Que manges-tu ?)", a: ["qué", "que"], ph: "un mot", exp: "¿Qué comes?" },
    { type: "input", q: "Complète : ¿___ llegas? (Quand arrives-tu ?)", a: ["cuándo", "cuando"], ph: "un mot", exp: "¿Cuándo llegas?" },
    { type: "input", q: "Complète la réponse : Estudio español ___ me gusta. (parce que, un mot)", a: ["porque"], ph: "un mot", exp: "porque = parce que." },
    { type: "input", q: "Complète : ¿___ años tienes? (Quel âge as-tu ? -> combien d'années)", a: ["cuántos", "cuantos"], ph: "un mot", exp: "¿Cuántos años tienes?" },
    { type: "input", q: "Complète : ¿___ vives? (Où vis-tu ?)", a: ["dónde", "donde"], ph: "un mot", exp: "¿Dónde vives?" },
    { type: "qcm", q: "Pourquoi « ¿Cuántas casas? » et non « ¿Cuánto casas? »", opts: ["Erreur", "casas est féminin pluriel, cuánto s'accorde -> cuántas", "casas est masculin", "Par politesse"], a: 1, exp: "Accord : féminin pluriel -> cuántas." },
    { type: "qcm", q: "Quelle paire question/réponse est correcte ?", opts: ["¿Porque estudias? / Por qué me gusta", "¿Por qué estudias? / Porque me gusta", "¿Porqué estudias? / Porque me gusta", "¿Por que estudias? / Por qué me gusta"], a: 1, exp: "Question por qué (2 mots) / réponse porque (1 mot)." }
  ],
  final: {
    title: "Exercice final — Poser les bonnes questions",
    intro: `<p>Lis ce court dialogue, puis choisis le bon mot interrogatif pour chaque question.</p>
<pre class="pseudo">— ¿Dónde vives? — Vivo en Madrid. — ¿Por qué? — Porque trabajo aquí.
— Où vis-tu ? — Je vis à Madrid. — Pourquoi ? — Parce que je travaille ici.</pre>`,
    questions: [
      { type: "input", q: "« Où » -> ¿___ vives?", a: ["dónde", "donde"], ph: "un mot", exp: "¿Dónde vives?" },
      { type: "qcm", q: "« Pourquoi ? » (question) s'écrit…", opts: ["porque", "por qué", "porqué", "por que"], a: 1, exp: "por qué (deux mots, accent)." },
      { type: "input", q: "Réponse « Parce que je travaille ici » : ___ trabajo aquí.", a: ["porque"], ph: "un mot", exp: "porque (un mot)." },
      { type: "input", q: "« Que fais-tu ? » -> ¿___ haces?", a: ["qué", "que"], ph: "un mot", exp: "¿Qué haces?" },
      { type: "qcm", q: "« Quel âge as-tu ? » se dit…", opts: ["¿Cuánto años tienes?", "¿Cuántos años tienes?", "¿Cómo años tienes?", "¿Qué años eres?"], a: 1, exp: "cuántos accordé + tener : ¿Cuántos años tienes?" }
    ],
    solution: `<p>Les mots interrogatifs essentiels :</p>
<pre class="pseudo">qué (quoi)     quién (qui)      dónde (où)      cuándo (quand)
cómo (comment) por qué (pourquoi) cuánto (combien) cuál (lequel)</pre>
<p>Retiens les deux pièges : l'accent écrit sur tous les interrogatifs, et la différence por qué (question) / porque (réponse). Tu as maintenant les clés pour poser toutes les questions de base en espagnol. ¡Felicidades!</p>`
  }
};
