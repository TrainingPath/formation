  theory: `
<h3>1. Deux verbes pour « être »</h3>
<p>Surprise pour un francophone : l'espagnol a DEUX verbes qui se traduisent par « être » : <strong>ser</strong> et <strong>estar</strong>. Aujourd'hui, on étudie <strong>ser</strong>, qui exprime ce qui est <strong>permanent</strong> et <strong>définit</strong> une personne ou une chose : identité, origine, nationalité, métier, caractère.</p>
<h3>2. La conjugaison de ser au présent</h3>
<p>C'est un verbe irrégulier : il faut l'apprendre par cœur. Voici toutes les personnes :</p>
<pre class="pseudo">yo              soy       je suis
tú              eres      tu es
él / ella       es        il / elle est
usted           es        vous êtes (poli, sing.)
nosotros/as     somos     nous sommes
vosotros/as     sois      vous êtes (tutoiement pluriel)
ellos / ellas   son       ils / elles sont
ustedes         son       vous êtes (poli, pluriel)</pre>
<div class="tip">Prononciation : <em>soy</em> se dit « soï », <em>eres</em> « érès » (les deux e comme é), <em>somos</em> « somoss ».</div>
<h3>3. Quand utiliser ser ?</h3>
<p>On emploie <strong>ser</strong> pour tout ce qui définit durablement. Retiens ces grands emplois avec des exemples :</p>
<pre class="pseudo">Identité   ->  Soy Ana.            Je suis Ana.
Origine    ->  Somos de Francia.   Nous sommes de France.
Nationalité -> Eres español.       Tu es espagnol.
Métier     ->  Es médico.          Il est médecin.
Caractère  ->  Sois simpáticos.    Vous êtes sympathiques.
Heure      ->  Son las tres.       Il est trois heures.</pre>
<div class="warn">Devant un métier ou une nationalité, l'espagnol NE met PAS d'article : on dit <em>Soy profesor</em> (littéralement « je suis professeur »), jamais « soy un profesor ».</div>
<h3>4. L'accord avec le sujet</h3>
<p>L'adjectif ou le nom qui suit ser s'accorde en genre et en nombre avec le sujet :</p>
<pre class="pseudo">Él es alto.        Il est grand.
Ella es alta.      Elle est grande.
Ellos son altos.   Ils sont grands.
Ellas son altas.   Elles sont grandes.</pre>
<div class="warn">Piège franco-espagnol : pour dire l'heure, l'espagnol utilise SER, pas « avoir » ni « faire » : <em>Son las dos</em> (Il est deux heures), <em>Es la una</em> (Il est une heure).</div>`,

    { type: "qcm", q: "Quelle est la forme de ser pour « nous » ?", opts: ["son", "somos", "sois", "eres"], a: 1, exp: "nosotros somos." },
