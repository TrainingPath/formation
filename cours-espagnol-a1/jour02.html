var DAY = {
  num: 2,
  title: "Se présenter : me llamo, soy",
  subtitle: "Dire son nom, saluer et demander le nom de l'autre.",
  theory: `
<h3>1. Saluer</h3>
<p>Avant de se présenter, on salue. Voici les formules de base et leur traduction :</p>
<pre class="pseudo">Hola            Bonjour / Salut
Buenos días     Bonjour (le matin)
Buenas tardes   Bonjour (l'après-midi)
Buenas noches   Bonsoir / Bonne nuit
Adiós           Au revoir
Hasta luego     À plus tard</pre>
<h3>2. Dire son nom : me llamo</h3>
<p>La façon la plus courante de se présenter est le verbe <strong>llamarse</strong> (« s'appeler »). Retiens la forme toute faite <strong>me llamo</strong> = « je m'appelle » :</p>
<pre class="pseudo">Me llamo Ana.        Je m'appelle Ana.
¿Cómo te llamas?     Comment t'appelles-tu ?
Se llama Pedro.      Il s'appelle Pedro.</pre>
<div class="tip">Rappelle-toi le jour 1 : le double <strong>ll</strong> de <em>llamo</em> se prononce « y ». On dit donc « mé yamo ».</div>
<h3>3. Dire qui l'on est : soy</h3>
<p>Le verbe <strong>ser</strong> (« être ») sert aussi à se présenter. La forme <strong>soy</strong> signifie « je suis ». On l'emploie pour donner son prénom, sa nationalité ou son métier :</p>
<pre class="pseudo">Soy Ana.            Je suis Ana.
Soy francés.        Je suis français.
Soy profesora.      Je suis professeure.</pre>
<p>Ainsi « Je m'appelle Ana » et « Je suis Ana » sont deux façons correctes de se présenter.</p>
<h3>4. Demander à l'autre</h3>
<p>Pour engager la conversation, ces questions sont indispensables :</p>
<pre class="pseudo">¿Cómo te llamas?     Comment t'appelles-tu ?
¿Cómo estás?         Comment vas-tu ?
¿De dónde eres?      D'où viens-tu ?
Mucho gusto.         Enchanté(e).
Encantado.           Enchanté. (dit par un homme)
Encantada.           Enchantée. (dit par une femme)</pre>
<div class="warn">En espagnol, on ne met PAS de pronom « je » obligatoire devant le verbe. On dit <em>Soy Ana</em>, pas « yo soy Ana » (sauf pour insister). La terminaison du verbe indique déjà la personne.</div>
<h3>5. Un mini-dialogue</h3>
<pre class="pseudo">— ¡Hola! ¿Cómo te llamas?      Salut ! Comment t'appelles-tu ?
— Me llamo Luis. ¿Y tú?         Je m'appelle Luis. Et toi ?
— Soy Marta. Mucho gusto.       Je suis Marta. Enchantée.
— Encantado.                    Enchanté.</pre>
<div class="warn">Attention à <em>encantado</em> / <em>encantada</em> : la terminaison change selon que l'on est un homme (-o) ou une femme (-a). Nous verrons cet accord en détail plus tard.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « je m'appelle » en espagnol ?", opts: ["me llamas", "me llamo", "te llamo", "se llama"], a: 1, exp: "me llamo = je m'appelle ; me llamas n'existe pas." },
    { type: "qcm", q: "Quelle phrase signifie « comment t'appelles-tu ? »", opts: ["¿Cómo te llamas?", "¿Cómo me llamo?", "¿Cómo se llama?", "¿Cómo estás?"], a: 0, exp: "te llamas s'adresse à « tú » (toi)." },
    { type: "qcm", q: "Le verbe <em>ser</em> à la première personne (« je suis ») donne…", opts: ["eres", "es", "soy", "somos"], a: 2, exp: "soy = je suis." },
    { type: "vf", q: "En espagnol, « je suis Ana » se dit obligatoirement « yo soy Ana ».", a: false, exp: "Le pronom yo est facultatif : on dit simplement Soy Ana." },
    { type: "vf", q: "« Buenas noches » veut dire « bonjour » le matin.", a: false, exp: "Buenas noches = bonsoir / bonne nuit. Le matin, c'est buenos días." },
    { type: "vf", q: "Un homme qui vient d'être présenté dit « encantada ».", a: false, exp: "Un homme dit encantado ; encantada est la forme féminine." },
    { type: "qcm", q: "Que répond-on poliment quand on rencontre quelqu'un ?", opts: ["Adiós", "Mucho gusto", "Buenas noches", "Hasta luego"], a: 1, exp: "Mucho gusto = enchanté(e), littéralement « grand plaisir »." },
    { type: "qcm", q: "Comment demander « d'où viens-tu ? »", opts: ["¿Cómo te llamas?", "¿De dónde eres?", "¿Cómo estás?", "¿Y tú?"], a: 1, exp: "¿De dónde eres? utilise le verbe ser (eres = tu es)." },
    { type: "input", q: "Complète : Hola, me ___ Ana. (verbe llamarse, forme « je »)", a: ["llamo"], ph: "un mot", exp: "me llamo Ana = je m'appelle Ana." },
    { type: "input", q: "Complète avec le verbe ser : ___ profesora. (je suis)", a: ["soy"], ph: "un mot", exp: "soy = je suis." },
    { type: "input", q: "Traduis « Comment t'appelles-tu ? » (n'oublie pas le signe ouvrant)", a: ["¿cómo te llamas?", "¿como te llamas?", "cómo te llamas", "como te llamas"], ph: "une phrase", exp: "¿Cómo te llamas?" },
    { type: "input", q: "Une femme se présente et veut dire « Enchantée ». Elle écrit :", a: ["encantada"], ph: "un mot", exp: "Forme féminine en -a : encantada." },
    { type: "input", q: "Complète la salutation du matin : Buenos ___.", a: ["días", "dias"], ph: "un mot", exp: "Buenos días = bonjour (le matin)." },
    { type: "qcm", q: "« Se llama Pedro » signifie…", opts: ["Je m'appelle Pedro", "Tu t'appelles Pedro", "Il s'appelle Pedro", "Nous nous appelons Pedro"], a: 2, exp: "se llama = il/elle s'appelle." },
    { type: "qcm", q: "Pour dire « au revoir », on utilise…", opts: ["Hola", "Mucho gusto", "Adiós", "Buenos días"], a: 2, exp: "Adiós = au revoir ; hasta luego = à plus tard." }
  ],
  final: {
    title: "Exercice final — Ta première présentation",
    intro: `<p>Reconstitue un petit dialogue de rencontre. Chaque question porte sur une réplique manquante.</p>
<pre class="pseudo">— ¡Hola! ¿Cómo te llamas?
— ________ Carlos.
— Yo ____ Elena. Mucho gusto.
— ________.</pre>`,
    questions: [
      { type: "input", q: "Réplique 1 : « Je m'appelle Carlos » = ___ Carlos. (deux mots)", a: ["me llamo"], ph: "deux mots", exp: "Me llamo Carlos." },
      { type: "input", q: "Réplique 2 : « Je suis Elena » = Yo ___ Elena. (verbe ser)", a: ["soy"], ph: "un mot", exp: "Yo soy Elena (yo est ici emphatique)." },
      { type: "qcm", q: "Que répond Carlos, poliment, en tant qu'homme ?", opts: ["Encantada", "Encantado", "Buenos días", "Adiós"], a: 1, exp: "Un homme dit encantado." },
      { type: "qcm", q: "Quelle formule NE convient PAS pour saluer en arrivant ?", opts: ["Hola", "Buenos días", "Adiós", "Buenas tardes"], a: 2, exp: "Adiós sert à partir, pas à arriver." },
      { type: "input", q: "Traduis « Comment vas-tu ? »", a: ["¿cómo estás?", "¿como estas?", "cómo estás", "como estas"], ph: "une phrase", exp: "¿Cómo estás?" }
    ],
    solution: `<p>Dialogue complet :</p>
<pre class="pseudo">— ¡Hola! ¿Cómo te llamas?      Salut ! Comment t'appelles-tu ?
— Me llamo Carlos.              Je m'appelle Carlos.
— Yo soy Elena. Mucho gusto.    Moi, je suis Elena. Enchantée.
— Encantado.                    Enchanté.</pre>
<p>Tu sais maintenant saluer, donner ton nom et répondre poliment. Réutilise ces briques dans chaque nouvelle rencontre.</p>`
  }
