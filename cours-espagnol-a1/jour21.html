var DAY = {
  num: 21,
  title: "Hay et estar : il y a / se trouver",
  subtitle: "Signaler l'existence de quelque chose ou situer un lieu précis.",
  theory: `
<h3>1. hay : il y a</h3>
<p><code>hay</code> est une forme unique et invariable (du verbe haber). Elle signifie « il y a » et sert à dire qu'une chose <strong>existe</strong> ou est présente quelque part. Elle ne change jamais, au singulier comme au pluriel.</p>
<pre class="pseudo">Hay un libro en la mesa.     → Il y a un livre sur la table.
Hay dos coches.              → Il y a deux voitures.
¿Hay un baño aquí?          → Y a-t-il des toilettes ici ?
No hay leche.               → Il n'y a pas de lait.</pre>
<div class="tip"><code>hay</code> introduit du NOUVEAU, de l'indéfini : on l'emploie avec <code>un / una / dos…</code>, des nombres, ou rien du tout (No hay pan). Jamais avec « le / la » défini.</div>
<h3>2. estar : se trouver (situer)</h3>
<p><code>estar</code> sert à dire OÙ SE TROUVE une chose ou une personne déjà connue. On l'a déjà croisé pour l'état (« estoy bien »). Ici, il localise. Il se conjugue normalement.</p>
<pre class="pseudo">yo estoy      tú estás      él/ella está
nosotros estamos   vosotros estáis   ellos/ellas están</pre>
<pre class="pseudo">El libro está en la mesa.    → Le livre est (se trouve) sur la table.
María está en casa.          → María est à la maison.
Los coches están fuera.      → Les voitures sont dehors.
¿Dónde estás?               → Où es-tu ?</pre>
<h3>3. La différence essentielle</h3>
<div class="warn">On utilise <strong>hay</strong> pour signaler qu'une chose EXISTE (indéfini : un, une, des). On utilise <strong>estar</strong> pour situer une chose PRÉCISE, déjà connue (défini : le, la, un nom propre).</div>
<pre class="pseudo">Hay un restaurante en la calle. → Il y a un restaurant dans la rue. (existence)
El restaurante está en la calle. → Le restaurant est dans la rue.  (localisation)</pre>
<pre class="pseudo">Hay una farmacia aquí.   → Il y a une pharmacie ici.   (on découvre)
La farmacia está aquí.   → La pharmacie est ici.        (on la situe)</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « hay » ?", opts: ["il est", "il y a", "il va", "il fait"], a: 1, exp: "hay = il y a." },
    { type: "vf", q: "« hay » ne change jamais : c'est la même forme au singulier et au pluriel.", a: true, exp: "Hay un libro / Hay dos libros : hay reste hay." },
    { type: "input", q: "Complète : « ___ un libro en la mesa. » (il y a)", a: ["hay"], ph: "…", exp: "Hay un libro = il y a un livre." },
    { type: "qcm", q: "« No hay leche » signifie…", opts: ["Le lait est là", "Il n'y a pas de lait", "Je veux du lait", "Il y a du lait"], a: 1, exp: "No hay = il n'y a pas." },
    { type: "qcm", q: "On emploie « hay » avec…", opts: ["un article défini (el/la)", "un article indéfini ou un nombre (un, dos…)", "un nom propre", "un verbe"], a: 1, exp: "hay introduit de l'indéfini / du nouveau." },
    { type: "input", q: "Complète : « ¿___ un baño aquí? » (Y a-t-il des toilettes ?)", a: ["hay"], ph: "…", exp: "¿Hay…? = Y a-t-il… ?" },
    { type: "qcm", q: "Pour dire OÙ se trouve une chose précise, on utilise…", opts: ["hay", "estar", "ser", "tener"], a: 1, exp: "estar localise ce qui est connu." },
    { type: "input", q: "Complète : « El libro ___ en la mesa. » (estar, il/elle)", a: ["está", "esta"], ph: "…", exp: "está = se trouve (3e pers.)." },
    { type: "qcm", q: "Comment dit-on « Où es-tu ? »", opts: ["¿Dónde hay?", "¿Dónde estás?", "¿Dónde eres?", "¿Dónde vas?"], a: 1, exp: "¿Dónde estás? = Où es-tu ?" },
    { type: "input", q: "Complète : « María ___ en casa. » (estar, elle)", a: ["está", "esta"], ph: "…", exp: "María está = María se trouve." },
    { type: "vf", q: "On dit « El restaurante está en la calle » car le restaurant est déjà connu (défini).", a: true, exp: "estar situe une chose précise." },
    { type: "qcm", q: "Quelle phrase signale l'EXISTENCE d'un restaurant (nouveau) ?", opts: ["El restaurante está en la calle", "Hay un restaurante en la calle", "El restaurante es grande", "Quiero un restaurante"], a: 1, exp: "Hay un… = il y a un… (nouveau)." },
    { type: "input", q: "Complète : « Los coches ___ fuera. » (estar, ils)", a: ["están", "estan"], ph: "…", exp: "están = se trouvent (pluriel)." },
    { type: "vf", q: "« Hay una farmacia aquí » et « La farmacia está aquí » veulent dire exactement la même chose grammaticalement.", a: false, exp: "hay signale l'existence ; está situe une pharmacie déjà connue." },
    { type: "input", q: "Complète avec hay ou estar : « ___ dos coches. » (il y a deux voitures)", a: ["hay"], ph: "…", exp: "Existence + nombre → hay." }
  ],
  final: {
    title: "Exercice final — Dans la chambre",
    intro: `<p>Description d'une chambre :</p>
<pre class="pseudo">En mi habitación hay una cama y una mesa. → Dans ma chambre il y a un lit et une table.
El libro está en la mesa.                 → Le livre est sur la table.
No hay ventana.                           → Il n'y a pas de fenêtre.
¿Dónde está la silla?                     → Où est la chaise ?</pre>`,
    questions: [

      { type: "qcm", q: "« No hay ventana » signifie…", opts: ["La fenêtre est ouverte", "Il n'y a pas de fenêtre", "La fenêtre est là", "Il y a une fenêtre"], a: 1, exp: "No hay = il n'y a pas." },
      { type: "input", q: "Complète : « ¿Dónde ___ la silla? » (estar)", a: ["está", "esta"], ph: "…", exp: "¿Dónde está…? = Où se trouve… ?" },
      { type: "vf", q: "« hay » sert à l'existence, « estar » sert à la localisation d'une chose précise.", a: true, exp: "C'est la distinction clé du jour." }
    ],
    solution: `<p>La règle d'or : <code>hay</code> (invariable) annonce qu'une chose EXISTE, avec un article indéfini ou un nombre (<em>hay un/una/dos…</em>, ou rien : <em>no hay pan</em>). <code>estar</code> (estoy, estás, está, estamos, estáis, están) SITUE une chose ou personne déjà connue (article défini, nom propre). Test rapide : « il y a » → hay ; « se trouve / est quelque part » → estar.</p>`
  }
