<script>
var DAY = {
  num: 28,
  title: "Révisions de grammaire A1",
  subtitle: "On rassemble et on consolide les points clés du niveau A1.",
  theory: `
<h3>1. ser ou estar ?</h3>
<p>Deux verbes traduisent « être ». <code>ser</code> pour l'identité, l'origine, les caractéristiques permanentes ; <code>estar</code> pour l'état, l'humeur et la localisation.</p>
<pre class="pseudo">Soy español. Soy alto.   → Je suis espagnol. Je suis grand. (ser)
Estoy cansado. Estoy en casa. → Je suis fatigué. Je suis à la maison. (estar)</pre>
<h3>2. Les articles et le genre</h3>
<pre class="pseudo">el / los   → masculin (le / les)     un / unos  → un / des (masc.)
la / las   → féminin (la / les)      una / unas → une / des (fém.)</pre>
<p>L'adjectif s'accorde en genre et en nombre : <code>un coche rojo</code> / <code>una casa roja</code> / <code>unos coches rojos</code>.</p>
<h3>3. Le présent des verbes réguliers</h3>
<pre class="pseudo">-ar (hablar) : hablo, hablas, habla, hablamos, habláis, hablan
-er (comer)  : como, comes, come, comemos, coméis, comen
-ir (vivir)  : vivo, vives, vive, vivimos, vivís, viven</pre>
<h3>4. Verbes à diphtongue et gustar</h3>
<pre class="pseudo">querer (e→ie) : quiero, quieres, quiere… queremos, queréis
poder  (o→ue) : puedo, puedes, puede… podemos, podéis
me gusta + singulier / me gustan + pluriel</pre>
<h3>5. hay / estar, prépositions, futur proche, présent continu</h3>
<pre class="pseudo">Hay un libro. / El libro está en la mesa.   (existence / localisation)
al lado de, cerca de, debajo de… (+ de + el → del)
Voy a comer. (ir + a + infinitif = futur proche)
Estoy comiendo. (estar + gerundio = en cours)</pre>
<div class="tip">Ce jour ne présente rien de neuf : relis chaque petit bloc, puis teste-toi avec les 15 exercices. Reviens à la théorie du jour correspondant si un point résiste.</div>
<div class="warn">Pièges fréquents : <em>ser vs estar</em>, accord de <em>gusta / gustan</em>, le <em>a</em> obligatoire de <em>voy a comer</em>, la fusion <em>de + el = del</em>.</div>`,
  exercises: [
    { type: "qcm", q: "« Je suis espagnol » (nationalité, permanent) :", opts: ["Estoy español", "Soy español", "Voy español", "Tengo español"], a: 1, exp: "Nationalité → ser : Soy español." },
    { type: "input", q: "« Je suis fatigué » (état) : « ___ cansado. » (verbe estar)", a: ["estoy"], ph: "…", exp: "État passager → estar : estoy cansado." },
    { type: "qcm", q: "Quel est l'article féminin singulier défini ?", opts: ["el", "la", "un", "los"], a: 1, exp: "la = la (féminin singulier)." },
    { type: "input", q: "Accorde : « una casa ___ » (rouge, féminin)", a: ["roja"], ph: "…", exp: "L'adjectif s'accorde : casa roja." },
    { type: "qcm", q: "hablar, nosotros :", opts: ["hablo", "hablamos", "habláis", "hablan"], a: 1, exp: "nosotros hablamos." },
    { type: "input", q: "comer, yo : « ___ »", a: ["como"], ph: "…", exp: "yo como." },
    { type: "qcm", q: "querer, yo (e→ie) :", opts: ["quero", "quiero", "quere", "queo"], a: 1, exp: "yo quiero." },
    { type: "input", q: "poder, yo (o→ue) : « ___ »", a: ["puedo"], ph: "…", exp: "yo puedo." },
    { type: "qcm", q: "« J'aime les pommes » :", opts: ["Me gusta las manzanas", "Me gustan las manzanas", "Yo gusto manzanas", "Me gustar manzanas"], a: 1, exp: "Chose au pluriel → gustan." },
    { type: "input", q: "Existence : « ___ un libro en la mesa. » (il y a)", a: ["hay"], ph: "…", exp: "Hay = il y a." },
    { type: "qcm", q: "Localisation d'une chose connue :", opts: ["Hay el libro en la mesa", "El libro está en la mesa", "El libro hay en la mesa", "El libro es en la mesa"], a: 1, exp: "estar situe une chose définie." },
    { type: "input", q: "Fusion : « cerca ___ parque » (de + el)", a: ["del"], ph: "…", exp: "de + el = del." },
    { type: "qcm", q: "Futur proche « Je vais manger » :", opts: ["Voy comer", "Voy a comer", "Voy comiendo", "Voy a comiendo"], a: 1, exp: "ir + a + infinitif." },
    { type: "input", q: "Présent continu : « Estoy ___. » (en train de manger, gérondif de comer)", a: ["comiendo"], ph: "…", exp: "estar + gerundio : comiendo." },
    { type: "vf", q: "« de + el » se contracte toujours en « del ».", a: true, exp: "Contraction obligatoire." }
  ],
  final: {
    title: "Exercice final — Repérer la bonne règle",
    intro: `<p>On teste les distinctions clés du A1 sur des phrases mélangées :</p>
<pre class="pseudo">1. Soy / Estoy de Francia.       (origine)
2. Me gusta / gustan el café.    (accord)
3. Voy a / Voy comer.            (futur proche)
4. Hay / Está un problema.       (existence)</pre>`,
    questions: [
      { type: "qcm", q: "1. « ___ de Francia » (origine) :", opts: ["Estoy", "Soy", "Voy", "Hay"], a: 1, exp: "Origine → ser : Soy de Francia." },
      { type: "qcm", q: "2. « Me ___ el café » (café, singulier) :", opts: ["gustan", "gusta", "gusto", "gustar"], a: 1, exp: "Singulier → gusta." },
      { type: "input", q: "3. Complète le futur proche : « Voy ___ comer. »", a: ["a"], ph: "…", exp: "Le « a » est obligatoire." },
      { type: "qcm", q: "4. « ___ un problema » (existence) :", opts: ["Está", "Hay", "Es", "Va"], a: 1, exp: "Existence → hay." },
      { type: "vf", q: "Pour situer une chose déjà connue, on utilise « estar » et non « hay ».", a: true, exp: "hay = existence ; estar = localisation." }
    ],
    solution: `<p>Les grands réflexes du A1 : <code>ser</code> (identité/origine) vs <code>estar</code> (état/lieu) ; accord de <code>gusta / gustan</code> avec la chose aimée ; le <code>a</code> obligatoire du futur proche <code>ir a + infinitif</code> ; <code>hay</code> (existence) vs <code>estar</code> (localisation) ; la contraction <code>de + el = del</code> ; les diphtongues <code>quiero / puedo</code>. Si un point cloche, retourne au jour concerné.</p>`
  }
};
</script>
