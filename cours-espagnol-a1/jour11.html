  title: "Les adjectifs possessifs",
  subtitle: "Mi, tu, su… dire à qui appartient une chose.",
  theory: `
<h3>1. Qu'est-ce qu'un adjectif possessif ?</h3>
<p>Un <strong>adjectif possessif</strong> indique à qui appartient quelque chose : « mon » livre, « ta » maison, « nos » amis. Il se place devant le nom.</p>
<h3>2. Les possessifs de base</h3>
<pre class="pseudo">mi / mis           mon, ma / mes
tu / tus           ton, ta / tes
su / sus           son, sa, ses ; votre, vos ; leur, leurs
nuestro/a/os/as    notre / nos
vuestro/a/os/as    votre / vos (tutoiement pluriel)
su / sus           leur, leurs</pre>
<h3>3. La règle d'accord : avec l'OBJET, pas le possesseur</h3>
<p>Point capital : le possessif s'accorde avec la chose possédée (en nombre), PAS avec la personne qui possède.</p>
<pre class="pseudo">mi libro     mon livre       mis libros    mes livres
tu casa      ta maison       tus casas     tes maisons</pre>
<div class="warn">Différence avec le français : <em>mi</em>, <em>tu</em>, <em>su</em> ne changent PAS selon masculin/féminin, seulement selon singulier/pluriel. On dit <em>mi libro</em> (mon livre) ET <em>mi casa</em> (ma maison) : la même forme mi.</div>
<h3>4. Nuestro et vuestro s'accordent en genre ET nombre</h3>
<p>Seuls <strong>nuestro</strong> (notre) et <strong>vuestro</strong> (votre) ont quatre formes, comme un adjectif normal :</p>
<pre class="pseudo">nuestro coche     notre voiture (masc. sing.)
nuestra casa      notre maison (fém. sing.)
nuestros coches   nos voitures (masc. pl.)
nuestras casas    nos maisons (fém. pl.)</pre>
<h3>5. Le cas ambigu de « su »</h3>
<p><strong>su</strong> est très polyvalent : il peut signifier « son/sa », « votre » (de usted) ou « leur ». Le contexte tranche :</p>
<pre class="pseudo">su libro     son livre / votre livre / leur livre
sus libros   ses livres / vos livres / leurs livres</pre>
<div class="tip">Pour lever l'ambiguïté, l'espagnol peut préciser : <em>el libro de él</em> (le livre à lui), <em>el libro de ella</em> (le livre à elle), <em>el libro de usted</em> (votre livre). Mais au niveau A1, retiens simplement su/sus.</div>
<div class="warn">Ne confonds pas <em>tu</em> possessif (ton/ta, sans accent) et <em>tú</em> pronom (toi, avec accent) : <em>tú tienes tu libro</em> = toi, tu as ton livre.</div>`,
  exercises: [
    { type: "qcm", q: "« mon livre » se dit…", opts: ["mío libro", "mi libro", "mis libro", "me libro"], a: 1, exp: "mi libro (mi ne varie pas en genre)." },
    { type: "qcm", q: "Le possessif s'accorde avec…", opts: ["la personne qui possède", "la chose possédée", "le verbe", "l'article"], a: 1, exp: "Il s'accorde avec l'objet possédé, pas le possesseur." },
    { type: "qcm", q: "« mes maisons » se dit…", opts: ["mi casas", "mis casas", "mías casas", "mi casa"], a: 1, exp: "Pluriel de l'objet -> mis casas." },
    { type: "vf", q: "« mi » change de forme selon masculin/féminin.", a: false, exp: "mi est identique au masculin et au féminin : mi libro, mi casa." },
    { type: "vf", q: "« nuestra casa » est correct pour « notre maison ».", a: true, exp: "nuestro/a s'accorde en genre : casa féminin -> nuestra." },
    { type: "vf", q: "« su » peut vouloir dire « son », « votre » ou « leur ».", a: true, exp: "su est ambigu ; le contexte précise." },
    { type: "qcm", q: "Comment dit-on « nos voitures » (coche est masculin) ?", opts: ["nuestra coches", "nuestros coches", "nuestro coches", "nuestras coches"], a: 1, exp: "Masc. pluriel -> nuestros coches." },
    { type: "qcm", q: "Quelle phrase distingue le pronom et le possessif ?", opts: ["Tú tienes tu libro", "Tu tienes tú libro", "Tú tienes tú libro", "Tu tienes tu libro"], a: 0, exp: "tú (toi, accent) + tu libro (ton, sans accent)." },
    { type: "input", q: "Complète : ___ casa (ta maison ; possessif « tu »).", a: ["tu"], ph: "un mot", exp: "tu casa = ta maison." },
    { type: "input", q: "Complète : ___ amigos (mes amis).", a: ["mis"], ph: "un mot", exp: "Pluriel -> mis amigos." },
    { type: "input", q: "Complète : ___ casa (notre maison ; casa est féminin).", a: ["nuestra"], ph: "un mot", exp: "nuestra casa (accord féminin)." },
    { type: "input", q: "Complète : ___ libros (ses livres / leurs livres).", a: ["sus"], ph: "un mot", exp: "Pluriel -> sus libros." },
    { type: "input", q: "Complète : ___ coche (votre voiture, tutoiement pluriel ; coche masculin).", a: ["vuestro"], ph: "un mot", exp: "vuestro coche (masc. sing.)." },
    { type: "qcm", q: "Pourquoi « mi casa » et non « mia casa » ?", opts: ["Erreur", "Parce que mi ne s'accorde pas en genre, seulement en nombre", "Parce que casa est masculin", "Parce que c'est du pluriel"], a: 1, exp: "mi est invariable en genre : mi casa, mi libro." },
    { type: "qcm", q: "« nuestras hijas » signifie…", opts: ["nos fils", "nos filles", "vos filles", "leurs filles"], a: 1, exp: "nuestras (fém. pl.) hijas = nos filles." }
  ],
  final: {

<pre class="pseudo">Esta es mi familia. Mis padres son profesores. Nuestra casa es grande. ¿Y tu familia?
Voici ma famille. Mes parents sont professeurs. Notre maison est grande. Et ta famille ?</pre>`,
    questions: [

      { type: "qcm", q: "« notre maison » (casa fém.) ->", opts: ["nuestro casa", "nuestra casa", "nuestros casa", "nuestras casa"], a: 1, exp: "nuestra casa (accord féminin)." },
      { type: "input", q: "« ta famille » -> ___ familia.", a: ["tu"], ph: "un mot", exp: "tu familia (sans accent)." },
      { type: "qcm", q: "Pourquoi « mis padres » et non « mi padres » ?", opts: ["Hasard", "padres est pluriel, donc le possessif prend -s", "padres est féminin", "Erreur, il faut mi"], a: 1, exp: "Accord en nombre avec l'objet possédé." }
    ],
    solution: `<p>Récapitulatif :</p>
<pre class="pseudo">mi / mis        (mon,ma / mes)      -> varie seulement en NOMBRE
tu / tus        (ton,ta / tes)      -> idem
su / sus        (son/votre/leur)    -> ambigu, contexte
nuestro/a/os/as (notre / nos)       -> varie en GENRE et NOMBRE</pre>
<p>La clé : accorder avec la chose possédée. Une fois ce réflexe acquis, les possessifs deviennent très simples.</p>`
  }
