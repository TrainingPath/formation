  title: "L'heure et les moments de la journée",
  subtitle: "Demander et dire l'heure, situer un moment dans la journée.",
  theory: `
<h3>1. Demander et dire l'heure</h3>
<p>Pour demander l'heure, on dit <code>¿Qué hora es?</code> (« Quelle heure est-il ? »). Pour répondre, on emploie le verbe <strong>ser</strong> (être). Attention : l'espagnol distingue une heure des autres.</p>
<pre class="pseudo">¿Qué hora es?        → Quelle heure est-il ?
Es la una.           → Il est une heure.        (SINGULIER : es la)
Son las dos.         → Il est deux heures.       (PLURIEL : son las)
Son las diez.        → Il est dix heures.
Son las doce.        → Il est douze heures.</pre>
<div class="warn">On dit <strong>Es la una</strong> (singulier) uniquement pour 1 h. Pour toutes les autres heures, on dit <strong>Son las…</strong> (pluriel), car deux, trois, dix… sont pluriels.</div>
<h3>2. Les minutes</h3>
<p>Pour les minutes après l'heure, on utilise <code>y</code> (« et ») ; pour les minutes avant l'heure suivante, on utilise <code>menos</code> (« moins »).</p>
<pre class="pseudo">y cuarto        → et quart   (+ 15 min)
y media         → et demie   (+ 30 min)
menos cuarto    → moins le quart (- 15 min)
Son las tres y cuarto.        → 3 h 15
Son las tres y media.         → 3 h 30
Son las cuatro menos cuarto.  → 3 h 45
Son las cinco y diez.         → 5 h 10</pre>
<h3>3. Les moments de la journée</h3>
<p>Pour préciser matin, après-midi ou soir, on ajoute <code>de la mañana</code>, <code>de la tarde</code> ou <code>de la noche</code>.</p>
<pre class="pseudo">la mañana      → le matin
el mediodía    → midi
la tarde       → l'après-midi
la noche       → le soir / la nuit
la medianoche  → minuit
Son las ocho de la mañana.  → 8 h du matin
Son las siete de la tarde.  → 7 h du soir (19 h)</pre>
<div class="tip">« de la mañana / de la tarde / de la noche » joue le rôle de « du matin / de l'après-midi / du soir » et sert à lever l'ambiguïté (l'espagnol usuel n'utilise pas 13 h, 14 h…).</div>
<h3>4. À quelle heure ?</h3>
<p>Pour demander à quel moment se passe une action, on dit <code>¿A qué hora…?</code> et on répond avec <code>a la</code> / <code>a las</code>.</p>
<pre class="pseudo">¿A qué hora comes?   → À quelle heure manges-tu ?
A la una.            → À une heure.
A las dos y media.   → À deux heures et demie.</pre>`,

    { type: "input", q: "Il est 1 h : « ___ la una. » (verbe ser)", a: ["es"], ph: "es / son", exp: "Es la una : singulier pour 1 h." },
    { type: "qcm", q: "Pourquoi dit-on « Son las dos » et non « Es la dos » ?", opts: ["Erreur, on dit Es la dos", "Parce que dos est pluriel : Son las…", "Parce que dos est féminin", "Par politesse"], a: 1, exp: "À partir de 2 h, on utilise le pluriel : Son las…" },
    { type: "input", q: "Il est 3 h 30 : « Son las tres y ___. »", a: ["media"], ph: "…", exp: "y media = et demie." },
    { type: "vf", q: "Pour 1 h, on dit « Es la una » et non « Son las una ».", a: true, exp: "1 h est la seule heure au singulier." },
    { type: "qcm", q: "Que signifie « y cuarto » ?", opts: ["moins le quart", "et quart (+ 15 min)", "et demie", "midi"], a: 1, exp: "cuarto = quart ; y cuarto = + 15 min." },
    { type: "input", q: "Il est 4 h 15 : « Son las cuatro y ___. »", a: ["cuarto"], ph: "…", exp: "y cuarto = et quart." },
    { type: "qcm", q: "« Son las cuatro menos cuarto » correspond à…", opts: ["4 h 15", "3 h 45", "4 h 30", "4 h 45"], a: 1, exp: "menos cuarto = moins le quart : 3 h 45." },
    { type: "input", q: "Le matin se dit « la ___ » en espagnol.", a: ["mañana", "manana"], ph: "…", exp: "la mañana = le matin (et aussi « demain »)." },
    { type: "vf", q: "« de la noche » sert à préciser qu'il s'agit du soir ou de la nuit.", a: true, exp: "Son las nueve de la noche = 9 h du soir." },
    { type: "qcm", q: "Comment dit-on « midi » ?", opts: ["la medianoche", "la tarde", "el mediodía", "la mañana"], a: 2, exp: "el mediodía = midi ; la medianoche = minuit." },
    { type: "input", q: "« ¿___ qué hora comes? » (À quelle heure manges-tu ?)", a: ["a"], ph: "…", exp: "¿A qué hora…? = À quelle heure… ?" },
    { type: "qcm", q: "Réponse à « ¿A qué hora? » pour 1 h :", opts: ["Es la una", "A la una", "Son la una", "La una es"], a: 1, exp: "On répond avec « A la una »." },
    { type: "vf", q: "« Son las siete de la tarde » désigne 7 h du soir (19 h).", a: true, exp: "de la tarde précise l'après-midi / début de soirée." },
    { type: "input", q: "Il est 5 h 10 : « Son las cinco ___ diez. »", a: ["y"], ph: "…", exp: "y = et, pour les minutes après l'heure." }
  ],
  final: {
    title: "Exercice final — La journée de Marta",
    intro: `<p>Lis l'emploi du temps de Marta :</p>
<pre class="pseudo">Marta se levanta a las siete de la mañana.   → Marta se lève à 7 h du matin.
Come a la una y media.                        → Elle mange à 1 h et demie.
Trabaja hasta las seis de la tarde.           → Elle travaille jusqu'à 6 h du soir.
Cena a las nueve de la noche.                 → Elle dîne à 9 h du soir.</pre>`,
    questions: [
      { type: "input", q: "À quelle heure Marta se lève-t-elle ? « A las ___ de la mañana. »", a: ["siete"], ph: "…", exp: "siete = sept." },
      { type: "qcm", q: "« Come a la una y media » signifie…", opts: ["Elle mange à 1 h 15", "Elle mange à 1 h 30", "Elle mange à 2 h", "Elle mange à midi"], a: 1, exp: "una y media = 1 h 30." },
      { type: "qcm", q: "Pourquoi « a la una » et non « a las una » ?", opts: ["Erreur du texte", "1 h est au singulier", "una est masculin", "Par habitude"], a: 1, exp: "1 h reste au singulier : la una." },
      { type: "input", q: "Jusqu'à quelle heure travaille-t-elle ? « Hasta las ___ de la tarde. »", a: ["seis"], ph: "…", exp: "seis = six ; 6 h du soir." },
      { type: "vf", q: "Marta dîne (« cena ») à 9 h du soir.", a: true, exp: "Cena a las nueve de la noche = dîne à 21 h." }
    ],
    solution: `<p>Récapitulatif : <code>Es la una</code> (1 h) mais <code>Son las…</code> pour le reste ; <code>y</code> pour les minutes après, <code>menos</code> avant ; on précise le moment avec <code>de la mañana / tarde / noche</code>. Pour situer une action : <code>¿A qué hora?</code> → <code>A la una / A las dos</code>.</p>`
  }
};
