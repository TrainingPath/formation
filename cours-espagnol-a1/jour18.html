<script>
var DAY = {

  title: "La famille",
  subtitle: "Nommer les membres de la famille et dire à qui ils appartiennent.",
  theory: `
<h3>1. Les membres de la famille</h3>
<p>Voici le vocabulaire de base de la famille (<code>la familia</code>). Beaucoup de mots vont par paire masculin / féminin.</p>
<pre class="pseudo">el padre    → le père        la madre    → la mère
el hijo     → le fils        la hija     → la fille
el hermano  → le frère       la hermana  → la sœur
el abuelo   → le grand-père  la abuela   → la grand-mère
el tío      → l'oncle        la tía      → la tante
el primo    → le cousin      la prima    → la cousine
el marido   → le mari        la mujer    → la femme (épouse)</pre>
<div class="tip">Le mot « parents » se dit <code>los padres</code> (« les pères » au pluriel englobe le père ET la mère). De même, <code>los hijos</code> peut désigner « les enfants » (fils et filles).</div>
<h3>2. Les adjectifs possessifs</h3>
<p>Pour dire à qui appartient quelqu'un, on utilise les <strong>adjectifs possessifs</strong>. Ils s'accordent en nombre avec la chose possédée (singulier / pluriel).</p>
<pre class="pseudo">mi / mis     → mon, ma / mes
tu / tus     → ton, ta / tes
su / sus     → son, sa, leur / ses, leurs
nuestro(a)/nuestros(as) → notre / nos</pre>
<pre class="pseudo">mi padre       → mon père
mis hermanos   → mes frères
tu madre       → ta mère
su tía         → sa tante / leur tante
nuestra familia → notre famille</pre>
<div class="warn">Attention : <code>mi</code>, <code>tu</code>, <code>su</code> ne changent PAS selon le genre. On dit <code>mi padre</code> ET <code>mi madre</code>. Ils changent seulement au pluriel : <code>mis padres</code>.</div>
<h3>3. Parler de sa famille</h3>
<pre class="pseudo">Tengo un hermano y una hermana.  → J'ai un frère et une sœur.
Mi madre se llama Ana.           → Ma mère s'appelle Ana.
¿Cuántos hermanos tienes?        → Combien de frères et sœurs as-tu ?
Somos cinco en mi familia.       → Nous sommes cinq dans ma famille.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « la mère » ?", opts: ["el padre", "la madre", "la hija", "la hermana"], a: 1, exp: "la madre = la mère." },
    { type: "input", q: "Traduis « le frère » : « el ___ »", a: ["hermano"], ph: "…", exp: "el hermano = le frère." },
    { type: "qcm", q: "« la abuela » signifie…", opts: ["la tante", "la grand-mère", "la cousine", "la sœur"], a: 1, exp: "la abuela = la grand-mère." },
    { type: "input", q: "Traduis « la fille » (de ses parents) : « la ___ »", a: ["hija"], ph: "…", exp: "la hija = la fille ; el hijo = le fils." },
    { type: "vf", q: "« los padres » peut désigner « les parents » (le père et la mère).", a: true, exp: "Le masculin pluriel englobe les deux." },
    { type: "qcm", q: "Comment dit-on « mon père » ?", opts: ["mi padre", "mis padre", "tu padre", "su padre"], a: 0, exp: "mi padre = mon père." },
    { type: "input", q: "Complète : « ___ madre » (ma mère)", a: ["mi"], ph: "…", exp: "mi ne change pas selon le genre : mi madre." },
    { type: "qcm", q: "Comment dit-on « mes frères » ?", opts: ["mi hermanos", "mis hermanos", "mi hermano", "tus hermanos"], a: 1, exp: "Au pluriel : mis hermanos." },
    { type: "vf", q: "On dit « mi madre » et « mi padre » : mi ne change pas au masculin/féminin.", a: true, exp: "mi/tu/su sont invariables en genre." },
    { type: "qcm", q: "« su tía » peut signifier…", opts: ["ma tante", "ta tante", "sa tante / leur tante", "notre tante"], a: 2, exp: "su = son/sa/leur." },
    { type: "input", q: "Traduis « la tante » : « la ___ »", a: ["tía", "tia"], ph: "…", exp: "la tía = la tante ; el tío = l'oncle." },
    { type: "qcm", q: "« Tengo un hermano y una hermana » signifie…", opts: ["J'ai deux frères", "J'ai un frère et une sœur", "J'ai une tante", "Je suis fils unique"], a: 1, exp: "un hermano = un frère ; una hermana = une sœur." },
    { type: "input", q: "Complète : « ___ familia » (notre famille, féminin)", a: ["nuestra"], ph: "…", exp: "nuestra s'accorde au féminin : nuestra familia." },
    { type: "vf", q: "« el primo » signifie « le cousin ».", a: true, exp: "el primo = le cousin ; la prima = la cousine." },
    { type: "input", q: "Complète : « Mi madre se ___ Ana. » (s'appelle)", a: ["llama"], ph: "…", exp: "se llama = s'appelle (verbe llamarse)." }
  ],
  final: {
    title: "Exercice final — La famille de Lucía",
    intro: `<p>Lucía présente sa famille :</p>
<pre class="pseudo">Somos cuatro en mi familia.        → Nous sommes quatre dans ma famille.
Mi padre se llama Juan.            → Mon père s'appelle Juan.
Tengo un hermano, se llama Diego.  → J'ai un frère, il s'appelle Diego.
Mis abuelos viven en Madrid.       → Mes grands-parents vivent à Madrid.</pre>`,
    questions: [
      { type: "input", q: "Combien sont-ils dans la famille ? « Somos ___. »", a: ["cuatro"], ph: "…", exp: "cuatro = quatre." },
      { type: "qcm", q: "Comment s'appelle le père de Lucía ?", opts: ["Diego", "Juan", "Ana", "Madrid"], a: 1, exp: "Mi padre se llama Juan." },
      { type: "qcm", q: "Diego est…", opts: ["son père", "son frère", "son grand-père", "son oncle"], a: 1, exp: "Tengo un hermano, se llama Diego." },
      { type: "input", q: "Complète : « ___ abuelos viven en Madrid. » (mes)", a: ["mis"], ph: "…", exp: "Pluriel : mis abuelos." },
      { type: "vf", q: "« Mis abuelos » désigne les grands-parents de Lucía.", a: true, exp: "los abuelos = les grands-parents." }
    ],
    solution: `<p>Points clés : le masculin pluriel englobe les deux genres (<code>los padres</code> = les parents, <code>los abuelos</code> = les grands-parents). Les possessifs <code>mi / tu / su</code> ne changent pas selon le genre mais prennent un <code>-s</code> au pluriel (<code>mis / tus / sus</code>). Pour présenter : <code>se llama…</code>, <code>tengo…</code>, <code>somos… en mi familia</code>.</p>`
  }
};
</script>
