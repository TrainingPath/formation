<body>
<script>
var ATELIER = {
  prefix: "at-es-a1",
  titre: "🇪🇸 Atelier — Espagnol A1",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour ancrer le niveau A1.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Presentarse — Se présenter", perso:"Ana · Bruno", lignes:[
      {qui:"Ana", txt:"¡Hola! Buenos días. Me llamo Ana. ¿Y tú?", fr:"Salut ! Bonjour. Je m'appelle Ana. Et toi ?"},
      {qui:"Bruno", txt:"Hola, Ana. Yo soy Bruno. Mucho gusto.", fr:"Salut, Ana. Moi, je suis Bruno. Enchanté."},
      {qui:"Ana", txt:"Encantada. ¿De dónde eres, Bruno?", fr:"Enchantée. D'où viens-tu, Bruno ?"},
      {qui:"Bruno", txt:"Soy belga, de Lieja, pero vivo en Madrid.", fr:"Je suis belge, de Liège, mais j'habite à Madrid."},
      {qui:"Ana", txt:"¡Qué bien! ¿Cuántos años tienes?", fr:"Super ! Quel âge as-tu ?"},
      {qui:"Bruno", txt:"Tengo veintidós años. ¿Y tú?", fr:"J'ai vingt-deux ans. Et toi ?"},
      {qui:"Ana", txt:"Yo tengo veinte. Soy estudiante de medicina.", fr:"Moi, j'ai vingt ans. Je suis étudiante en médecine."},
      {qui:"Bruno", txt:"Yo trabajo en una tienda. Estoy muy cansado hoy.", fr:"Moi, je travaille dans un magasin. Je suis très fatigué aujourd'hui."},
      {qui:"Ana", txt:"Lo siento. ¿Cuál es tu número de teléfono?", fr:"Je suis désolée. Quel est ton numéro de téléphone ?"},
      {qui:"Bruno", txt:"Es el seis, uno, cuatro... Hasta luego, Ana.", fr:"C'est le six, un, quatre... À plus tard, Ana."}
    ]},
    { num:"2", titre:"En el café — Au café", perso:"Lucía · Camarero", lignes:[
      {qui:"Camarero", txt:"Buenas tardes, señora. ¿Qué desea tomar?", fr:"Bonjour (l'après-midi), madame. Que désirez-vous prendre ?"},
      {qui:"Lucía", txt:"Un café con leche, por favor. Tengo mucha sed.", fr:"Un café au lait, s'il vous plaît. J'ai très soif."},
      {qui:"Camarero", txt:"Muy bien. ¿Quiere algo de comer?", fr:"Très bien. Voulez-vous quelque chose à manger ?"},
      {qui:"Lucía", txt:"Sí, quiero una tortilla. ¿Hay bocadillos?", fr:"Oui, je veux une omelette. Est-ce qu'il y a des sandwichs ?"},
      {qui:"Camarero", txt:"Sí, hay bocadillos de jamón y de queso.", fr:"Oui, il y a des sandwichs au jambon et au fromage."},
      {qui:"Lucía", txt:"No, gracias. No quiero nada más.", fr:"Non, merci. Je ne veux rien de plus."},
      {qui:"Camarero", txt:"Aquí tiene. El café está muy caliente.", fr:"Voilà. Le café est très chaud."},
      {qui:"Lucía", txt:"Gracias. Me gusta mucho este café.", fr:"Merci. J'aime beaucoup ce café."},
      {qui:"Lucía", txt:"La cuenta, por favor. ¿Cuánto es?", fr:"L'addition, s'il vous plaît. Ça fait combien ?"},
      {qui:"Camarero", txt:"Son siete euros con cincuenta. ¡Hasta pronto!", fr:"Ça fait sept euros cinquante. À bientôt !"}
    ]},
    { num:"3", titre:"¿Dónde está la estación? — Demander son chemin et l'heure", perso:"Turista · Señora", lignes:[
      {qui:"Turista", txt:"Perdone, señora. ¿Dónde está la estación?", fr:"Excusez-moi, madame. Où est la gare ?"},
      {qui:"Señora", txt:"Está muy cerca. Siga todo recto por esta calle.", fr:"Elle est tout près. Continuez tout droit dans cette rue."},
      {qui:"Turista", txt:"¿Y hay un banco por aquí?", fr:"Et est-ce qu'il y a une banque par ici ?"},
      {qui:"Señora", txt:"Sí, hay un banco al lado de la farmacia.", fr:"Oui, il y a une banque à côté de la pharmacie."},
      {qui:"Turista", txt:"Muchas gracias. ¿Qué hora es, por favor?", fr:"Merci beaucoup. Quelle heure est-il, s'il vous plaît ?"},
      {qui:"Señora", txt:"Son las cuatro y media de la tarde.", fr:"Il est quatre heures et demie de l'après-midi."},
      {qui:"Turista", txt:"¡Uy! Mi tren sale a las cinco menos cuarto.", fr:"Oh là ! Mon train part à cinq heures moins le quart."},
      {qui:"Señora", txt:"Entonces tiene que ir rápido. ¿Va usted a Sevilla?", fr:"Alors vous devez aller vite. Vous allez à Séville ?"},
      {qui:"Turista", txt:"No, no voy a Sevilla. Voy a Valencia.", fr:"Non, je ne vais pas à Séville. Je vais à Valence."},
      {qui:"Señora", txt:"¡Buen viaje! La estación está a la derecha.", fr:"Bon voyage ! La gare est sur la droite."}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Lisez les trois dialogues, puis dites si l'affirmation est vraie ou fausse.", exercices:[
      {type:"vf", q:"Ana se llama Ana y es estudiante de medicina.", a:true, exp:"Elle dit : Soy estudiante de medicina."},
      {type:"vf", q:"Bruno es español y vive en Lieja.", a:false, exp:"Il est belge (soy belga) et il habite à Madrid."},
      {type:"vf", q:"Bruno tiene veintidós años.", a:true, exp:"Tengo veintidós años — on exprime l'âge avec TENER, pas avec ser."},
      {type:"vf", q:"Bruno está cansado.", a:true, exp:"Estoy muy cansado : un état passager, donc ESTAR."},
      {type:"vf", q:"Lucía pide un té con limón.", a:false, exp:"Elle demande un café con leche."},
      {type:"vf", q:"En el café hay bocadillos de jamón y de queso.", a:true, exp:"HAY sert à dire l'existence : il y a."},
      {type:"vf", q:"Lucía paga siete euros con cincuenta.", a:true, exp:"Son siete euros con cincuenta."},
      {type:"vf", q:"La estación está lejos del turista.", a:false, exp:"Está muy cerca : elle est tout près."},
      {type:"vf", q:"Son las cuatro y media de la tarde.", a:true, exp:"L'heure se dit avec SER : son las cuatro y media."},
      {type:"vf", q:"El turista va a Sevilla.", a:false, exp:"No voy a Sevilla. Voy a Valencia."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la bonne réponse d'après les dialogues.", exercices:[
      {type:"qcm", q:"¿De dónde es Bruno?", opts:["De Madrid","De Bélgica","De Sevilla","De Valencia"], a:1, exp:"Soy belga, de Lieja."},
      {type:"qcm", q:"¿Qué estudia Ana?", opts:["Derecho","Medicina","Historia","Español"], a:1, exp:"Soy estudiante de medicina."},
      {type:"qcm", q:"¿Dónde trabaja Bruno?", opts:["En un café","En una tienda","En un banco","En la estación"], a:1, exp:"Yo trabajo en una tienda."},
      {type:"qcm", q:"¿Qué toma Lucía?", opts:["Un café con leche","Un zumo","Una cerveza","Un té"], a:0, exp:"Un café con leche, por favor."},
      {type:"qcm", q:"¿Cómo está el café?", opts:["Frío","Caliente","Malo","Dulce"], a:1, exp:"El café está muy caliente : état, donc estar."},
      {type:"qcm", q:"¿Qué quiere comer Lucía?", opts:["Un bocadillo","Una tortilla","Una ensalada","Nada"], a:1, exp:"Quiero una tortilla."},
      {type:"qcm", q:"¿Qué hay al lado de la farmacia?", opts:["Un café","Un banco","La estación","Un hotel"], a:1, exp:"Hay un banco al lado de la farmacia."},
      {type:"qcm", q:"¿A qué hora sale el tren?", opts:["A las cuatro y media","A las cinco menos cuarto","A las cinco y cuarto","A las cuatro"], a:1, exp:"Mi tren sale a las cinco menos cuarto."},
      {type:"qcm", q:"¿Dónde está la estación?", opts:["A la izquierda","A la derecha","Detrás del banco","Lejos"], a:1, exp:"La estación está a la derecha."},
      {type:"qcm", q:"¿Qué dice Bruno cuando conoce a Ana?", opts:["Hasta luego","Mucho gusto","Lo siento","Por favor"], a:1, exp:"Mucho gusto = enchanté, formule de présentation."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase est fausse : écrivez le mot correct.", exercices:[
      {type:"input", q:"Bruno tiene treinta años. → Bruno tiene ______ años.", a:["veintidós","veintidos","22"], ph:"le bon âge", exp:"Tengo veintidós años."},
      {type:"input", q:"Ana es profesora. → Ana es ______.", a:["estudiante"], ph:"un métier", exp:"Soy estudiante de medicina."},
      {type:"input", q:"Bruno vive en Lieja. → Bruno vive en ______.", a:["madrid"], ph:"une ville", exp:"Vivo en Madrid."},
      {type:"input", q:"Lucía toma un té. → Lucía toma un ______.", a:["café","cafe"], ph:"une boisson", exp:"Un café con leche, por favor."},
      {type:"input", q:"En el café hay pizzas. → Hay ______ de jamón.", a:["bocadillos"], ph:"pluriel", exp:"Hay bocadillos de jamón y de queso."},
      {type:"input", q:"El café está frío. → El café está muy ______.", a:["caliente"], ph:"adjectif", exp:"El café está muy caliente."},
      {type:"input", q:"La cuenta es de diez euros. → Son ______ euros con cincuenta.", a:["siete","7"], ph:"un nombre", exp:"Son siete euros con cincuenta."},
      {type:"input", q:"La estación está lejos. → La estación está muy ______.", a:["cerca"], ph:"contraire de lejos", exp:"Está muy cerca."},
      {type:"input", q:"Son las tres y media. → Son las ______ y media.", a:["cuatro","4"], ph:"un nombre", exp:"Son las cuatro y media de la tarde."},
      {type:"input", q:"El turista va a Sevilla. → El turista va a ______.", a:["valencia"], ph:"une ville", exp:"Voy a Valencia."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lisez le texte, puis répondez. TEXTE : Me llamo Carmen. Tengo treinta años y soy de Granada, pero ahora vivo en Barcelona con mi hermano. Soy enfermera y trabajo en un hospital grande. Por la mañana tomo un café y un zumo de naranja. No me gusta el té. Mi hermano se llama Pablo; es alto y muy simpático. Los fines de semana vamos a la playa porque nos gusta el mar. Hoy estoy contenta: no trabajo.", exercices:[
      {type:"qcm", q:"¿Cómo se llama la mujer?", opts:["Pablo","Carmen","Granada","Ana"], a:1, exp:"Me llamo Carmen."},
      {type:"qcm", q:"¿Cuántos años tiene?", opts:["13","30","20","40"], a:1, exp:"Tengo treinta años."},
      {type:"vf", q:"Carmen es de Barcelona.", a:false, exp:"Soy de Granada ; elle vit à Barcelone."},
      {type:"input", q:"¿Cuál es su profesión? Es ______.", a:["enfermera"], ph:"profession", exp:"Soy enfermera : le féminin de enfermero."},
      {type:"qcm", q:"¿Dónde trabaja?", opts:["En una tienda","En un hospital","En un café","En la playa"], a:1, exp:"Trabajo en un hospital grande."},
      {type:"vf", q:"A Carmen le gusta el té.", a:false, exp:"No me gusta el té."},
      {type:"input", q:"¿Cómo se llama su hermano? Se llama ______.", a:["pablo"], ph:"prénom", exp:"Mi hermano se llama Pablo."},
      {type:"qcm", q:"¿Cómo es Pablo?", opts:["Bajo y serio","Alto y simpático","Gordo y triste","Viejo"], a:1, exp:"Es alto y muy simpático : SER pour décrire."},
      {type:"vf", q:"Los fines de semana van a la playa.", a:true, exp:"Vamos a la playa porque nos gusta el mar."},
      {type:"qcm", q:"¿Por qué está contenta hoy?", opts:["Porque trabaja","Porque no trabaja","Porque es de Granada","Porque toma té"], a:1, exp:"Hoy estoy contenta: no trabajo. ESTAR pour l'humeur."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Observez le document, puis répondez. CARTA DEL BAR LA PLAZA — Bebidas: café 1,50 € · café con leche 1,80 € · zumo de naranja 2,50 € · agua 1,20 €. Comidas: bocadillo de jamón 3,50 € · tortilla 4,00 € · ensalada 5,00 €. Horario: de lunes a viernes, de 8:00 a 22:00. Cerrado los domingos. Dirección: calle Mayor, 12 — Teléfono: 915 34 78 90.", exercices:[
      {type:"input", q:"¿Cuánto cuesta un café con leche? ______ euros con ochenta.", a:["uno","un","1"], ph:"nombre", exp:"Café con leche : 1,80 €."},
      {type:"qcm", q:"¿Cuál es la bebida más cara?", opts:["El café","El agua","El zumo de naranja","El café con leche"], a:2, exp:"Le jus d'orange coûte 2,50 €."},
      {type:"vf", q:"El bar está abierto los domingos.", a:false, exp:"Cerrado los domingos."},
      {type:"input", q:"¿A qué hora abre el bar? A las ______.", a:["ocho","8"], ph:"heure", exp:"De 8:00 a 22:00."},
      {type:"qcm", q:"¿Dónde está el bar?", opts:["En la calle Mayor","En la plaza Mayor","En la calle Real","En la estación"], a:0, exp:"Dirección: calle Mayor, 12."},
      {type:"vf", q:"Una ensalada cuesta cinco euros.", a:true, exp:"Ensalada 5,00 €."},
      {type:"qcm", q:"¿Qué NO hay en la carta?", opts:["Tortilla","Ensalada","Pizza","Agua"], a:2, exp:"La pizza n'apparaît pas dans la carte."},
      {type:"input", q:"El bar abre de lunes a ______.", a:["viernes"], ph:"jour", exp:"De lunes a viernes."},
      {type:"qcm", q:"Si tomo un agua y una tortilla, pago:", opts:["4,20 €","5,20 €","6,00 €","3,50 €"], a:1, exp:"1,20 + 4,00 = 5,20 €."},
      {type:"vf", q:"El teléfono del bar es el 915 34 78 90.", a:true, exp:"Teléfono: 915 34 78 90."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Choisissez le mot ou l'expression de sens équivalent.", exercices:[
      {type:"qcm", q:"bonito", opts:["feo","guapo","alto","pequeño"], a:1, exp:"Bonito et guapo veulent tous deux dire beau, joli."},
      {type:"qcm", q:"empezar", opts:["terminar","comenzar","comprar","llegar"], a:1, exp:"Empezar = comenzar (commencer)."},
      {type:"qcm", q:"colegio", opts:["escuela","tienda","calle","cama"], a:0, exp:"Colegio = escuela (école)."},
      {type:"qcm", q:"contento", opts:["triste","feliz","cansado","enfadado"], a:1, exp:"Contento = feliz (content, heureux)."},
      {type:"qcm", q:"rápido", opts:["lento","veloz","tarde","fácil"], a:1, exp:"Rápido = veloz (rapide)."},
      {type:"qcm", q:"hablar", opts:["charlar","escuchar","leer","callar"], a:0, exp:"Hablar = charlar (parler, bavarder)."},
      {type:"input", q:"Synonyme de coche (deux lettres possibles) : au______", a:["automóvil","automovil","auto"], ph:"auto...", exp:"Coche = automóvil (voiture)."},
      {type:"qcm", q:"barato", opts:["caro","económico","nuevo","grande"], a:1, exp:"Barato = económico (bon marché)."},
      {type:"qcm", q:"trabajo (nom)", opts:["empleo","viaje","dinero","tiempo"], a:0, exp:"Trabajo = empleo (emploi)."},
      {type:"input", q:"Synonyme de ¡Hola! au téléphone en Espagne : ¿______?", a:["dígame","digame","diga"], ph:"formule", exp:"En Espagne on répond au téléphone : ¿Dígame?"}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Choisissez ou écrivez le contraire.", exercices:[
      {type:"qcm", q:"grande", opts:["alto","pequeño","largo","ancho"], a:1, exp:"Grande / pequeño."},
      {type:"qcm", q:"caro", opts:["barato","nuevo","rico","bueno"], a:0, exp:"Caro / barato."},
      {type:"input", q:"Contraire de cerca : ______", a:["lejos"], ph:"adverbe", exp:"Cerca / lejos (près / loin)."},
      {type:"qcm", q:"abierto", opts:["cerrado","libre","lleno","claro"], a:0, exp:"Abierto / cerrado."},
      {type:"input", q:"Contraire de frío : ______", a:["caliente","calor"], ph:"adjectif", exp:"Frío / caliente."},
      {type:"qcm", q:"siempre", opts:["a veces","nunca","también","ya"], a:1, exp:"Siempre / nunca (toujours / jamais)."},
      {type:"qcm", q:"entrar", opts:["salir","subir","venir","quedarse"], a:0, exp:"Entrar / salir."},
      {type:"input", q:"Contraire de joven : ______", a:["viejo","mayor"], ph:"adjectif", exp:"Joven / viejo (ou mayor, plus poli)."},
      {type:"qcm", q:"antes", opts:["después","pronto","hoy","ahora"], a:0, exp:"Antes / después."},
      {type:"qcm", q:"difícil", opts:["fácil","duro","raro","largo"], a:0, exp:"Difícil / fácil."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complétez avec le mot exact du vocabulaire A1.", exercices:[
      {type:"input", q:"Por la mañana desayuno pan y bebo un ______ con leche.", a:["café","cafe"], ph:"boisson", exp:"Café con leche : boisson du petit-déjeuner."},
      {type:"qcm", q:"Compro el pan en la ______.", opts:["farmacia","panadería","librería","carnicería"], a:1, exp:"Panadería = boulangerie (pan = pain)."},
      {type:"input", q:"Escribo con un ______ en mi cuaderno.", a:["bolígrafo","boligrafo","lápiz","lapiz"], ph:"objet", exp:"Bolígrafo (stylo) ou lápiz (crayon)."},
      {type:"qcm", q:"En la ______ compro medicamentos.", opts:["panadería","farmacia","estación","biblioteca"], a:1, exp:"Farmacia = pharmacie."},
      {type:"input", q:"Duermo en la ______ de mi habitación.", a:["cama"], ph:"meuble", exp:"La cama = le lit."},
      {type:"qcm", q:"El hermano de mi madre es mi ______.", opts:["primo","tío","abuelo","sobrino"], a:1, exp:"Tío = oncle."},
      {type:"input", q:"Hoy hace mucho ______: treinta y cinco grados.", a:["calor"], ph:"météo", exp:"Hace calor : il fait chaud (avec HACER)."},
      {type:"qcm", q:"Voy al trabajo en ______ porque no tengo coche.", opts:["autobús","cocina","zapato","reloj"], a:0, exp:"Autobús = bus."},
      {type:"input", q:"Miro la hora en mi ______.", a:["reloj"], ph:"objet", exp:"El reloj = la montre, l'horloge."},
      {type:"qcm", q:"Después de comer, tomo un ______ de chocolate.", opts:["postre","primero","plato","menú"], a:0, exp:"El postre = le dessert."}
    ]},
    { id:"familles", nom:"Familles de mots", consigne:"Trouvez le mot de la même famille.", exercices:[
      {type:"input", q:"trabajar → la persona que trabaja es el/la ______", a:["trabajador","trabajadora"], ph:"nom", exp:"Trabajar → trabajador(a)."},
      {type:"qcm", q:"cocinar → la habitación es la...", opts:["cocina","comida","cocinero","cuchara"], a:0, exp:"Cocinar (cuisiner) → la cocina (la cuisine)."},
      {type:"input", q:"pan → la tienda es la ______", a:["panadería","panaderia"], ph:"lieu", exp:"Pan → panadería."},
      {type:"qcm", q:"enseñar → la persona es el...", opts:["estudiante","profesor","alumno","director"], a:1, exp:"Enseñar (enseigner) → profesor."},
      {type:"input", q:"estudiar → la persona es el/la ______", a:["estudiante"], ph:"nom", exp:"Estudiar → estudiante."},
      {type:"qcm", q:"libro → la tienda es la...", opts:["biblioteca","librería","papelería","lectura"], a:1, exp:"Librería = librairie ; biblioteca = bibliothèque."},
      {type:"input", q:"cantar → la persona es el/la ______", a:["cantante"], ph:"nom", exp:"Cantar → cantante."},
      {type:"qcm", q:"zapato → la tienda es la...", opts:["zapatería","zapatilla","zapatero","calzada"], a:0, exp:"Zapato → zapatería (magasin de chaussures)."},
      {type:"input", q:"vender → la persona es el/la ______", a:["vendedor","vendedora"], ph:"nom", exp:"Vender → vendedor(a)."},
      {type:"qcm", q:"amigo → el sentimiento es la...", opts:["amabilidad","amistad","amor","alegría"], a:1, exp:"Amigo → amistad (amitié)."}
    ]},
    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux mots qui ressemblent au français mais n'ont pas le même sens.", exercices:[
      {type:"qcm", q:"Que signifie SALIR ?", opts:["salir (sale)","sortir","saluer","sauter"], a:1, exp:"Salir = sortir. Le français salir se dit ensuciar."},
      {type:"qcm", q:"Que signifie EMBARAZADA ?", opts:["embarrassée","enceinte","énervée","embarquée"], a:1, exp:"Estar embarazada = être enceinte. Piège classique !"},
      {type:"qcm", q:"Que signifie LARGO ?", opts:["large","long","lourd","lent"], a:1, exp:"Largo = long. Large se dit ancho."},
      {type:"vf", q:"CONSTIPADO veut dire enrhumé.", a:true, exp:"Estoy constipado = je suis enrhumé."},
      {type:"qcm", q:"Que signifie el SUCESO ?", opts:["le succès","l'événement","le successeur","la suite"], a:1, exp:"Suceso = événement. Le succès = el éxito."},
      {type:"qcm", q:"Que signifie QUITAR ?", opts:["quitter","enlever, retirer","être quitte","éviter"], a:1, exp:"Quitar = enlever. Quitter = dejar / irse."},
      {type:"vf", q:"El pastel veut dire le gâteau.", a:true, exp:"El pastel = le gâteau (pas le pastel, la couleur)."},
      {type:"qcm", q:"Que signifie DEBIL ?", opts:["débile","faible","doux","douteux"], a:1, exp:"Débil = faible."},
      {type:"input", q:"Comment dit-on ENTENDRE (avec l'oreille) en espagnol ? ______ (attention : entender = comprendre)", a:["oír","oir","escuchar"], ph:"verbe", exp:"Oír = entendre ; entender = comprendre."},
      {type:"qcm", q:"Que signifie NUDO ?", opts:["nu","nœud","nuage","numéro"], a:1, exp:"Nudo = nœud. Nu se dit desnudo."}
    ]},
    { id:"qr", nom:"Question ↔ réponse", consigne:"Associez chaque question à la réponse correcte.", exercices:[
      {type:"qcm", q:"¿Cómo te llamas?", opts:["Tengo 20 años","Me llamo Pedro","Soy de Perú","Estoy bien"], a:1, exp:"Llamarse répond à ¿Cómo te llamas?"},
      {type:"qcm", q:"¿De dónde eres?", opts:["Soy de México","Son las dos","Me gusta","Está aquí"], a:0, exp:"SER de + lieu d'origine."},
      {type:"qcm", q:"¿Cuántos años tienes?", opts:["Soy joven","Tengo dieciocho años","Es mi edad","Hace calor"], a:1, exp:"L'âge se dit avec TENER."},
      {type:"qcm", q:"¿Qué hora es?", opts:["Es lunes","Son las tres y cuarto","A las tres","Tengo tiempo"], a:1, exp:"Son las + heure."},
      {type:"qcm", q:"¿Dónde está el baño?", opts:["Hay un baño","Está al fondo a la derecha","Es grande","Son dos"], a:1, exp:"Localiser un lieu précis → ESTAR."},
      {type:"qcm", q:"¿Cómo estás?", opts:["Soy profesor","Estoy muy bien, gracias","Tengo frío","Es tarde"], a:1, exp:"ESTAR pour l'état / la santé."},
      {type:"qcm", q:"¿Te gusta el chocolate?", opts:["Sí, me gusta mucho","Sí, gusto","Sí, lo gusto","Sí, me gustan"], a:0, exp:"Gustar : me gusta + nom singulier."},
      {type:"qcm", q:"¿Cuánto cuesta?", opts:["Cuesta diez euros","Cuesta mañana","Está bien","Son las diez"], a:0, exp:"Costar + prix."},

    { id:"poserq", nom:"Poser la question", consigne:"Écrivez le mot interrogatif qui convient (avec accent écrit).", exercices:[
      {type:"input", q:"¿______ te llamas? — Me llamo Laura.", a:["cómo","como"], ph:"mot interrogatif", exp:"¿Cómo te llamas? Accent écrit sur les interrogatifs."},

    { id:"replique", nom:"La réplique manquante", consigne:"Choisissez la réponse qui convient dans la conversation.", exercices:[
      {type:"qcm", q:"— ¡Muchas gracias! — ______", opts:["De nada","Por favor","Lo siento","Adiós"], a:0, exp:"De nada = de rien."},
      {type:"qcm", q:"— Perdón, ¿tiene hora? — ______", opts:["No hay","Sí, son las diez","Está bien","Soy las diez"], a:1, exp:"L'heure : son las diez."},
      {type:"qcm", q:"— Encantado. — ______", opts:["Encantada, igualmente","Buen viaje","Nada","Está aquí"], a:0, exp:"On répond en accordant : encantada si on est une femme."},
      {type:"qcm", q:"— ¿Qué tal? — ______", opts:["Soy Ana","Muy bien, ¿y tú?","Hay dos","A las cinco"], a:1, exp:"¿Qué tal? = comment ça va ?"},
      {type:"qcm", q:"— Lo siento, llego tarde. — ______", opts:["No pasa nada","De acuerdo, adiós","No tengo","Es verdad que no"], a:0, exp:"No pasa nada = ce n'est pas grave."},
      {type:"qcm", q:"— ¿Me pone un café, por favor? — ______", opts:["Ahora mismo","Yo también","No sé nada","Es mío"], a:0, exp:"Ahora mismo = tout de suite."},
      {type:"qcm", q:"— ¡Hasta mañana! — ______", opts:["¡Hasta mañana!","¡Buenos días!","¡Mucho gusto!","¡Perdón!"], a:0, exp:"On rend la formule d'adieu."},
      {type:"qcm", q:"— ¿Puedo pagar con tarjeta? — ______", opts:["Sí, claro, sin problema","Sí, tengo hambre","No hay de qué","Está lejos"], a:0, exp:"Réponse logique à une demande de permission."},
      {type:"qcm", q:"— No me gusta el pescado. — ______", opts:["A mí tampoco","A mí también me gusta","Yo tampoco lo soy","Sí, me gustan"], a:0, exp:"Après une phrase négative on répond : a mí tampoco."},
      {type:"qcm", q:"— ¿Está libre esta mesa? — ______", opts:["Sí, siéntese","Sí, es libre","No, es ocupada","Hay una mesa"], a:0, exp:"Libre / ocupada s'emploient avec estar."}
    ]},
    { id:"ordredial", nom:"Remettre le dialogue dans l'ordre", consigne:"Indiquez la bonne suite ou la place de chaque réplique.", exercices:[
      {type:"qcm", q:"Quelle réplique ouvre le dialogue au café ?", opts:["La cuenta, por favor","Buenas tardes, ¿qué desea?","Aquí tiene","Gracias, hasta luego"], a:1, exp:"On commence par saluer et prendre la commande."},
      {type:"qcm", q:"Après ¿Qué desea tomar? vient logiquement :", opts:["Son siete euros","Un café con leche, por favor","Hasta pronto","La estación está cerca"], a:1, exp:"La commande suit la question du serveur."},
      {type:"qcm", q:"Après Aquí tiene su café vient :", opts:["Gracias","¿Qué desea?","Buenos días","¿De dónde eres?"], a:0, exp:"On remercie quand on est servi."},
      {type:"qcm", q:"Quelle réplique clôt le dialogue ?", opts:["¡Hasta pronto!","¿Hay bocadillos?","Quiero una tortilla","¿Cuánto es?"], a:0, exp:"La formule d'adieu ferme l'échange."},
      {type:"qcm", q:"Ordre correct : 1 ¿Cómo te llamas? / 2 ... / 3 Encantada.", opts:["Me llamo Luis","Tengo 20 años","Adiós","Está bien"], a:0, exp:"La présentation précède Encantada."},
      {type:"qcm", q:"Après Perdone, ¿dónde está la estación? vient :", opts:["Siga todo recto","Son las cuatro","Un café, por favor","Me llamo Ana"], a:0, exp:"On donne l'indication demandée."},
      {type:"qcm", q:"Après ¿Qué hora es? vient :", opts:["Son las cuatro y media","Está a la derecha","Voy a Valencia","Hay un banco"], a:0, exp:"On répond à la question de l'heure."},
      {type:"qcm", q:"Après Mi tren sale a las cinco menos cuarto vient :", opts:["Entonces tiene que ir rápido","¿Cuántos años tienes?","No me gusta","Un zumo, por favor"], a:0, exp:"Réaction logique à l'urgence."},
      {type:"qcm", q:"Quelle réplique NE peut PAS suivre ¿De dónde eres?", opts:["Soy de Italia","Soy italiano","Son las dos","De Roma"], a:2, exp:"Son las dos répond à une question sur l'heure."},
      {type:"qcm", q:"Ordre correct de la commande :", opts:["Pedir – saludar – pagar","Saludar – pedir – pagar","Pagar – pedir – saludar","Saludar – pagar – pedir"], a:1, exp:"On salue, on commande, puis on paie."}
    ]},
    { id:"substitution", nom:"Substitution", consigne:"Refaites la phrase en remplaçant l'élément indiqué.", exercices:[
      {type:"input", q:"Yo hablo español. → Nosotros ______ español.", a:["hablamos"], ph:"verbe", exp:"Hablar, 1re pers. pluriel : hablamos."},
      {type:"input", q:"Ella come pan. → Ellas ______ pan.", a:["comen"], ph:"verbe", exp:"Comer, 3e pers. pluriel : comen."},
      {type:"input", q:"Tú vives en Madrid. → Vosotros ______ en Madrid.", a:["vivís","vivis"], ph:"verbe", exp:"Vivir, 2e pers. pluriel : vivís."},
      {type:"input", q:"Yo soy profesor. → Ellos ______ profesores.", a:["son"], ph:"verbe", exp:"Ser : yo soy / ellos son."},
      {type:"input", q:"Él está cansado. → Nosotras ______ cansadas.", a:["estamos"], ph:"verbe", exp:"Estar : nosotras estamos."},
      {type:"input", q:"Tengo hambre. → Mis hermanos ______ hambre.", a:["tienen"], ph:"verbe", exp:"Tener : ellos tienen."},
      {type:"input", q:"Me gusta el café. → Me ______ los cafés.", a:["gustan"], ph:"verbe", exp:"Gustar s'accorde avec la chose aimée : los cafés → gustan."},
      {type:"input", q:"Me gusta bailar. → A nosotros ______ gusta bailar.", a:["nos"], ph:"pronom", exp:"Gustar : a nosotros nos gusta."},
      {type:"input", q:"El niño es alto. → Las niñas ______ altas.", a:["son"], ph:"verbe", exp:"Pluriel de es : son."},
      {type:"input", q:"Voy al cine. → Vosotros ______ al cine.", a:["vais"], ph:"verbe", exp:"Ir : vosotros vais."}
    ]},
    { id:"conj", nom:"Conjugaison (présent)", consigne:"Conjuguez le verbe au présent de l'indicatif.", exercices:[
      {type:"input", q:"Yo (hablar) ______ francés y español.", a:["hablo"], ph:"verbe", exp:"Verbes en -ar : -o, -as, -a, -amos, -áis, -an."},
      {type:"input", q:"Nosotros (comer) ______ a las dos.", a:["comemos"], ph:"verbe", exp:"Verbes en -er : -o, -es, -e, -emos, -éis, -en."},
      {type:"input", q:"Ellos (vivir) ______ en Barcelona.", a:["viven"], ph:"verbe", exp:"Verbes en -ir : -o, -es, -e, -imos, -ís, -en."},
      {type:"input", q:"Tú (estudiar) ______ mucho.", a:["estudias"], ph:"verbe", exp:"Estudiar → estudias."},
      {type:"input", q:"Vosotros (beber) ______ agua.", a:["bebéis","bebeis"], ph:"verbe", exp:"Beber → bebéis (accent sur le é)."},
      {type:"qcm", q:"Yo (querer) ______ un café.", opts:["quero","quiero","quiere","querio"], a:1, exp:"Querer diphtongue : e → ie (quiero)."},
      {type:"qcm", q:"¿(Poder) ______ tú ayudarme?", opts:["Podes","Puedes","Podés","Puedas"], a:1, exp:"Poder diphtongue : o → ue (puedo, puedes...)."},
      {type:"input", q:"Nosotros (escribir) ______ una carta.", a:["escribimos"], ph:"verbe", exp:"Escribir → escribimos."},
      {type:"qcm", q:"Ella (empezar) ______ a trabajar a las ocho.", opts:["empeza","empieza","empiezo","empezan"], a:1, exp:"Empezar : e → ie, sauf nosotros/vosotros."},
      {type:"input", q:"Nosotros (querer) ______ ir al cine. (attention : pas de diphtongue !)", a:["queremos"], ph:"verbe", exp:"La diphtongue disparaît à nosotros/vosotros : queremos, queréis."}
    ]},
    { id:"irreg", nom:"Verbes irréguliers (ser, estar, tener, ir)", consigne:"Complétez avec la forme correcte. Attention à SER / ESTAR !", exercices:[
      {type:"qcm", q:"Madrid ______ la capital de España.", opts:["está","es","tiene","hay"], a:1, exp:"Identité, définition permanente → SER."},
      {type:"qcm", q:"Madrid ______ en el centro de España.", opts:["es","está","hay","tiene"], a:1, exp:"Localisation d'un lieu précis → ESTAR."},
      {type:"input", q:"Yo ______ (tener) mucha sed.", a:["tengo"], ph:"verbe", exp:"Sensations : tener sed, hambre, frío, calor."},
      {type:"qcm", q:"Mi hermana ______ enferma hoy.", opts:["es","está","tiene","hay"], a:1, exp:"État passager (santé) → ESTAR."},
      {type:"qcm", q:"Nosotros ______ belgas.", opts:["estamos","somos","tenemos","vamos"], a:1, exp:"Nationalité → SER."},
      {type:"input", q:"Ellos ______ (ir) al mercado los sábados.", a:["van"], ph:"verbe", exp:"Ir : voy, vas, va, vamos, vais, van."},
      {type:"qcm", q:"La sopa ______ muy caliente.", opts:["es","está","tiene","hay"], a:1, exp:"Température perçue à cet instant → ESTAR."},
      {type:"input", q:"Vosotros ______ (ser) muy simpáticos.", a:["sois"], ph:"verbe", exp:"Ser : soy, eres, es, somos, sois, son."},
      {type:"qcm", q:"¿Cuántos años ______ tu padre?", opts:["es","está","tiene","hay"], a:2, exp:"L'âge se dit avec TENER, jamais avec ser."},
      {type:"input", q:"Yo ______ (estar) en la oficina y ______ (ser) contable. (deux mots séparés par un espace)", a:["estoy soy"], ph:"deux verbes", exp:"Estoy (lieu) / soy (profession) : la double logique estar-ser."}
    ]},
    { id:"interro", nom:"Mots interrogatifs", consigne:"Choisissez le mot interrogatif correct (avec accent écrit).", exercices:[
      {type:"qcm", q:"¿______ vas de vacaciones? — A Portugal.", opts:["Cuándo","Adónde","Cómo","Quién"], a:1, exp:"Adónde : destination avec un verbe de mouvement."},

      {type:"qcm", q:"¿______ hermanos tienes? — Dos.", opts:["Cuánto","Cuántos","Cuántas","Cuál"], a:1, exp:"Cuántos s'accorde : hermanos masculin pluriel."},
      {type:"qcm", q:"¿______ chicas hay en clase? — Doce.", opts:["Cuántos","Cuántas","Cuánto","Cuánta"], a:1, exp:"Chicas est féminin pluriel → cuántas."},
      {type:"qcm", q:"¿______ se escribe tu apellido?", opts:["Qué","Cómo","Cuál","Dónde"], a:1, exp:"Cómo : la manière (comment)."},

      {type:"qcm", q:"¿______ llegas? — Mañana por la tarde.", opts:["Cuándo","Cuánto","Dónde","Cómo"], a:0, exp:"Cuándo : le moment."},
      {type:"input", q:"Complétez : ¿______ está el hotel? — Enfrente del parque.", a:["dónde","donde"], ph:"mot interrogatif", exp:"Dónde + estar pour la localisation."},
      {type:"vf", q:"Toute question espagnole commence par le signe ¿ et finit par ?", a:true, exp:"Les signes inversés ¿ ¡ sont obligatoires en espagnol."}
    ]},
    { id:"prep", nom:"Prépositions", consigne:"Complétez avec la préposition correcte.", exercices:[
      {type:"qcm", q:"Voy ______ cine con mis amigos.", opts:["a el","al","el","a la"], a:1, exp:"a + el = al (contraction obligatoire)."},
      {type:"qcm", q:"La casa ______ mi tío es grande.", opts:["de","del","a","en"], a:0, exp:"De + nom propre ou possesseur, sans contraction ici."},
      {type:"qcm", q:"El libro ______ profesor está aquí.", opts:["de el","del","de la","al"], a:1, exp:"de + el = del."},
      {type:"input", q:"Vivo ______ Bruselas.", a:["en"], ph:"préposition", exp:"EN pour situer où l'on habite."},
      {type:"qcm", q:"Salgo ______ casa a las siete.", opts:["de","a","en","por"], a:0, exp:"Salir DE : sortir d'un endroit."},
      {type:"qcm", q:"El banco está ______ la farmacia.", opts:["al lado de","al lado","de lado","en lado"], a:0, exp:"Al lado de = à côté de."},
      {type:"input", q:"Estudio español ______ la mañana.", a:["por"], ph:"préposition", exp:"Por la mañana / por la tarde / por la noche."},
      {type:"qcm", q:"Este regalo es ______ ti.", opts:["por","para","a","de"], a:1, exp:"Para = destinataire, but."},
      {type:"qcm", q:"Vengo ______ Bélgica.", opts:["de","a","en","con"], a:0, exp:"Venir DE : provenance."},
      {type:"input", q:"El tren sale ______ las ocho.", a:["a"], ph:"préposition", exp:"A + heure pour un horaire précis."}
    ]},
    { id:"det", nom:"Articles et déterminants", consigne:"Choisissez l'article ou le déterminant correct.", exercices:[
      {type:"qcm", q:"______ problema es difícil.", opts:["La","El","Los","Un"], a:1, exp:"Problema est masculin malgré le -a (mot grec)."},
      {type:"qcm", q:"______ mano derecha.", opts:["El","La","Un","Los"], a:1, exp:"Mano est féminin malgré le -o : la mano."},
      {type:"input", q:"Écrivez l'article défini : ______ agua está fría.", a:["el"], ph:"article", exp:"El agua : on met el devant un féminin commençant par a tonique, mais l'adjectif reste féminin (fría)."},
      {type:"qcm", q:"Tengo ______ hermana y dos hermanos.", opts:["un","una","la","unas"], a:1, exp:"Una hermana : féminin singulier."},
      {type:"qcm", q:"Me gusta ______ música española.", opts:["une","la","el","una"], a:1, exp:"Avec gustar, on met l'article défini devant le nom général."},
      {type:"input", q:"Article défini pluriel : ______ ciudades son bonitas.", a:["las"], ph:"article", exp:"Ciudad est féminin → las ciudades."},
      {type:"qcm", q:"______ día es muy largo.", opts:["La","El","Los","Un a"], a:1, exp:"Día est masculin : el día."},
      {type:"qcm", q:"Voy a comprar ______ pan.", opts:["du","de le","el","un poco de"], a:2, exp:"L'espagnol n'a pas de partitif : compro pan / el pan."},
      {type:"input", q:"Possessif : ______ padres viven en Sevilla. (à moi)", a:["mis"], ph:"possessif", exp:"Mis + nom pluriel (mi/mis s'accorde en nombre)."},
      {type:"qcm", q:"______ chico es mi primo.", opts:["Este","Esta","Estos","Esto"], a:0, exp:"Este + masculin singulier ; esto est neutre et ne précède pas un nom."}
    ]},
    { id:"pluriels", nom:"Genre et pluriel des noms", consigne:"Écrivez ou choisissez la forme correcte.", exercices:[
      {type:"input", q:"Pluriel de la ciudad : las ______", a:["ciudades"], ph:"pluriel", exp:"Mots en consonne : + es."},
      {type:"input", q:"Pluriel de el lápiz : los ______", a:["lápices","lapices"], ph:"pluriel", exp:"Le z devient c devant es : lápiz → lápices."},
      {type:"input", q:"Pluriel de la mujer : las ______", a:["mujeres"], ph:"pluriel", exp:"Mujer + es = mujeres."},
      {type:"qcm", q:"Pluriel de el autobús :", opts:["los autobúses","los autobuses","los autobús","las autobuses"], a:1, exp:"L'accent disparaît au pluriel : autobús → autobuses."},
      {type:"qcm", q:"Quel nom est FÉMININ ?", opts:["el mapa","la foto","el día","el sofá"], a:1, exp:"La foto (abréviation de fotografía) est féminin."},
      {type:"qcm", q:"Quel nom est MASCULIN ?", opts:["la clase","el tema","la noche","la calle"], a:1, exp:"Les mots en -ema sont masculins : el tema, el problema."},
      {type:"input", q:"Féminin de el profesor : la ______", a:["profesora"], ph:"féminin", exp:"On ajoute -a aux noms en consonne."},
      {type:"input", q:"Féminin de el actor : la ______", a:["actriz"], ph:"féminin", exp:"Forme irrégulière : actor → actriz."},
      {type:"qcm", q:"Pluriel de el café :", opts:["los cafés","los cafes","los cafees","las cafés"], a:0, exp:"Voyelle accentuée -é : on ajoute simplement -s."},
      {type:"qcm", q:"Le pluriel de el lunes est :", opts:["los luneses","los lunes","los luneces","las lunes"], a:1, exp:"Les mots invariables au pluriel : el lunes → los lunes."}
    ]},
    { id:"adj", nom:"Adjectifs (accord et place)", consigne:"Accordez et placez correctement l'adjectif.", exercices:[
      {type:"input", q:"Las chicas son (simpático) ______.", a:["simpáticas","simpaticas"], ph:"adjectif", exp:"Accord en genre et en nombre : simpáticas."},
      {type:"input", q:"Un coche (verde) y dos casas ______.", a:["verdes"], ph:"adjectif", exp:"Adjectifs en -e : un seul féminin, pluriel en -s."},
      {type:"qcm", q:"Ordre correct :", opts:["una roja casa","una casa roja","roja una casa","casa una roja"], a:1, exp:"En espagnol l'adjectif se place normalement APRÈS le nom."},
      {type:"input", q:"Mi madre es (español) ______.", a:["española"], ph:"adjectif", exp:"Nationalités en consonne : on ajoute -a au féminin."},
      {type:"qcm", q:"Es un ______ chico. (grand par la taille)", opts:["gran","grande","granda","grandes"], a:1, exp:"Grande après le nom = grand par la taille ; gran devant = important."},
      {type:"qcm", q:"Madrid es una ______ ciudad. (importante)", opts:["gran","grande","grandes","grana"], a:0, exp:"Grande s'apocope en gran devant un nom singulier."},
      {type:"input", q:"Los libros son (interesante) ______.", a:["interesantes"], ph:"adjectif", exp:"Interesante → interesantes."},
      {type:"qcm", q:"Es un ______ día. (bon)", opts:["bueno","buen","buena","bien"], a:1, exp:"Bueno devient buen devant un nom masculin singulier."},
      {type:"input", q:"Las flores son (blanco) ______.", a:["blancas"], ph:"adjectif", exp:"Flores est féminin pluriel → blancas."},
      {type:"qcm", q:"¿Quelle phrase est correcte ?", opts:["Una gran mujer trabajadora","Una grande mujer trabajadora","Una mujer gran trabajadora","Una trabajadora gran mujer"], a:0, exp:"Gran devant le nom, l'adjectif descriptif après."}
    ]},
    { id:"pronoms", nom:"Pronoms", consigne:"Complétez avec le pronom correct.", exercices:[
      {type:"qcm", q:"A mí ______ gusta el cine.", opts:["me","mi","yo","te"], a:0, exp:"Gustar demande un pronom COI : me, te, le, nos, os, les."},
      {type:"qcm", q:"A ellos ______ gustan los deportes.", opts:["le","les","se","los"], a:1, exp:"Pluriel : a ellos les gustan."},
      {type:"input", q:"¿El libro? ______ leo esta noche. (pronom COD masculin)", a:["lo"], ph:"pronom", exp:"Lo remplace un COD masculin singulier."},
      {type:"input", q:"¿Las llaves? ______ tengo aquí.", a:["las"], ph:"pronom", exp:"Las remplace un COD féminin pluriel."},
      {type:"qcm", q:"______ llamo Marta.", opts:["Yo","Me","Mi","Se"], a:1, exp:"Llamarse est pronominal : me llamo."},
      {type:"qcm", q:"Nosotros ______ levantamos a las siete.", opts:["nos","os","se","les"], a:0, exp:"Verbe pronominal : nos levantamos."},
      {type:"qcm", q:"Ce voyage est pour moi : Este viaje es para ______.", opts:["yo","me","mí","mi"], a:2, exp:"Après une préposition : mí (avec accent), ti, él..."},
      {type:"qcm", q:"¿Vienes con ______? (avec moi)", opts:["mí","conmigo","con mí","me"], a:1, exp:"Forme spéciale : conmigo, contigo."},
      {type:"qcm", q:"______ sois franceses, ¿verdad?", opts:["Ustedes","Vosotros","Nosotros","Ellos"], a:1, exp:"Sois est la forme de vosotros."},
      {type:"vf", q:"En espagnol, on peut souvent omettre le pronom sujet (yo, tú...).", a:true, exp:"La terminaison du verbe suffit : hablo = je parle."}

    { id:"negation", nom:"Négation", consigne:"Mettez à la forme négative ou complétez la double négation.", exercices:[
      {type:"input", q:"Hablo inglés. → ______ hablo inglés.", a:["no"], ph:"négation", exp:"On place simplement NO devant le verbe."},
      {type:"qcm", q:"¿Quieres algo? — No quiero ______.", opts:["algo","nada","nadie","ningún"], a:1, exp:"Double négation obligatoire : no ... nada."},
      {type:"qcm", q:"______ hay nadie en casa.", opts:["No","Nada","Nunca no","Sí"], a:0, exp:"No hay nadie : le NO reste devant le verbe."},
      {type:"input", q:"Yo ______ voy nunca al gimnasio.", a:["no"], ph:"négation", exp:"Quand nunca suit le verbe, il faut NO devant."},
      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["Nunca no como carne","No como nunca carne","Nunca como carne","No nunca como carne"], a:2, exp:"Nunca placé avant le verbe : pas de no. (No como nunca carne est aussi possible mais ici la meilleure forme est Nunca como carne.)"},
      {type:"qcm", q:"No tengo ______ amigo aquí.", opts:["ninguno","ningún","ninguna","nada"], a:1, exp:"Ninguno s'apocope en ningún devant un nom masculin singulier."},
      {type:"input", q:"— Yo no fumo. — Yo ______. (moi non plus)", a:["tampoco"], ph:"adverbe", exp:"Tampoco = non plus (négatif de también)."},
      {type:"qcm", q:"No me gusta ______ el pescado ______ la carne.", opts:["o / o","ni / ni","y / y","no / no"], a:1, exp:"Ni ... ni = ni ... ni."},
      {type:"vf", q:"En espagnol, deux mots négatifs dans la même phrase sont corrects.", a:true, exp:"No veo nada, no viene nadie : la double négation est la règle."},
      {type:"input", q:"¿Vas al cine? — No, no voy ______. (jamais)", a:["nunca","jamás","jamas"], ph:"adverbe", exp:"No voy nunca / no voy jamás."}
    ]},
    { id:"ordremots", nom:"Ordre des mots", consigne:"Choisissez la phrase correctement construite.", exercices:[
      {type:"qcm", q:"Remettez : (vivo / en / yo / Madrid)", opts:["Yo vivo en Madrid","Vivo yo en Madrid","En Madrid yo vivo","Yo en Madrid vivo"], a:0, exp:"Sujet + verbe + complément."},
      {type:"qcm", q:"Remettez : (te / cómo / llamas / ¿ / ?)", opts:["¿Cómo llamas te?","¿Cómo te llamas?","¿Te cómo llamas?","¿Llamas cómo te?"], a:1, exp:"Le pronom réfléchi précède le verbe conjugué."},
      {type:"qcm", q:"Remettez : (no / nada / quiero)", opts:["Nada no quiero","No quiero nada","Quiero no nada","No nada quiero"], a:1, exp:"No + verbe + nada."},
      {type:"qcm", q:"Remettez : (gusta / me / el / chocolate)", opts:["Me gusta el chocolate","El chocolate gusta me","Gusta me el chocolate","Me el chocolate gusta"], a:0, exp:"Structure de gustar : pronom + verbe + sujet réel."},
      {type:"qcm", q:"Remettez : (hay / en / la / un / banco / calle)", opts:["Un banco hay en la calle","Hay un banco en la calle","En la calle un banco hay","Hay en la calle un banco"], a:1, exp:"Hay + article indéfini + nom + lieu."},
      {type:"qcm", q:"Remettez : (española / una / es / película)", opts:["Es una película española","Es una española película","Una película española es","Es española una película"], a:0, exp:"L'adjectif de nationalité suit le nom."},
      {type:"qcm", q:"Remettez : (años / tengo / veinte)", opts:["Veinte años tengo","Tengo años veinte","Tengo veinte años","Años tengo veinte"], a:2, exp:"Tener + nombre + años."},
      {type:"qcm", q:"Remettez : (mañana / por / estudio / la)", opts:["Estudio por la mañana","Por estudio la mañana","La mañana por estudio","Estudio la por mañana"], a:0, exp:"Por la mañana est un bloc figé."},
      {type:"qcm", q:"Remettez : (¿ / es / hora / qué / ?)", opts:["¿Qué hora es?","¿Es qué hora?","¿Hora qué es?","¿Qué es hora?"], a:0, exp:"Interrogatif + nom + verbe."},
      {type:"qcm", q:"Remettez : (a / voy / mañana / cine / al)", opts:["Mañana voy al cine","Voy mañana al a cine","Al cine mañana voy a","Voy al mañana cine"], a:0, exp:"Le complément de temps peut ouvrir la phrase."}
    ]},
    { id:"transfo", nom:"Transformation", consigne:"Transformez la phrase comme demandé.", exercices:[
      {type:"input", q:"Au pluriel : El niño es alto. → Los niños ______ altos.", a:["son"], ph:"verbe", exp:"Es → son."},
      {type:"input", q:"Au féminin : Mi hermano es profesor. → Mi hermana es ______.", a:["profesora"], ph:"nom", exp:"Profesor → profesora."},
      {type:"input", q:"À la forme négative : Tengo dinero. → ______ tengo dinero.", a:["no"], ph:"négation", exp:"No devant le verbe."},
      {type:"input", q:"À la question : Vives en Bruselas. → ¿______ vives?", a:["dónde","donde"], ph:"interrogatif", exp:"On interroge sur le lieu : ¿Dónde vives?"},
      {type:"input", q:"De tú à usted : ¿Cómo te llamas? → ¿Cómo ______ llama usted?", a:["se"], ph:"pronom", exp:"Usted prend les formes de la 3e personne : se llama."},
      {type:"input", q:"De yo à nosotros : Voy al mercado. → ______ al mercado.", a:["vamos"], ph:"verbe", exp:"Ir : voy → vamos."},
      {type:"input", q:"Avec gustar au pluriel : Me gusta la manzana. → Me ______ las manzanas.", a:["gustan"], ph:"verbe", exp:"Le sujet est las manzanas → gustan."},
      {type:"input", q:"Avec hay : La farmacia está en la calle Real. → ______ una farmacia en la calle Real.", a:["hay"], ph:"verbe", exp:"Hay + indéfini (existence) ; está + défini (localisation)."},
      {type:"input", q:"Avec tener : Yo soy veinte años. (incorrect) → Yo ______ veinte años.", a:["tengo"], ph:"verbe", exp:"L'âge se dit toujours avec tener."},
      {type:"input", q:"Au pluriel : Esta ciudad es bonita. → Estas ______ son bonitas.", a:["ciudades"], ph:"nom", exp:"Ciudad → ciudades."}
    ]},
    { id:"tradfr", nom:"Traduction FR → ES", consigne:"Traduisez en espagnol (accents et signes ¿ ¡ obligatoires).", exercices:[
      {type:"input", q:"Je m'appelle Pierre.", a:["me llamo pierre"], ph:"phrase espagnole", exp:"Llamarse : me llamo."},
      {type:"input", q:"J'ai vingt ans.", a:["tengo veinte años","tengo veinte anos","tengo 20 años"], ph:"phrase espagnole", exp:"Tener + años."},
      {type:"input", q:"Je suis belge.", a:["soy belga"], ph:"phrase espagnole", exp:"Nationalité → ser. Belga est identique au masculin et au féminin."},
      {type:"input", q:"Je suis fatigué.", a:["estoy cansado","estoy cansada"], ph:"phrase espagnole", exp:"État passager → estar."},
      {type:"input", q:"Où est la gare ?", a:["¿dónde está la estación?","donde esta la estacion","¿dónde está la estación","dónde está la estación"], ph:"phrase espagnole", exp:"Dónde + estar pour un lieu précis."},
      {type:"input", q:"Il y a une pharmacie ici.", a:["hay una farmacia aquí","hay una farmacia aqui"], ph:"phrase espagnole", exp:"Hay pour l'existence, avec un article indéfini."},
      {type:"input", q:"J'aime le café. (au sens : le café me plaît)", a:["me gusta el café","me gusta el cafe"], ph:"phrase espagnole", exp:"Gustar : construction inversée."},
      {type:"input", q:"Je ne veux rien.", a:["no quiero nada"], ph:"phrase espagnole", exp:"Double négation : no ... nada."},
      {type:"input", q:"Quelle heure est-il ?", a:["¿qué hora es?","que hora es","¿qué hora es","qué hora es"], ph:"phrase espagnole", exp:"L'heure se demande avec ser."},
      {type:"input", q:"Nous habitons à Madrid.", a:["vivimos en madrid","nosotros vivimos en madrid"], ph:"phrase espagnole", exp:"Vivir → vivimos ; EN pour la ville."}
    ]},
    { id:"traden", nom:"Traduction ES → FR", consigne:"Traduisez en français.", exercices:[
      {type:"input", q:"Tengo hambre.", a:["j'ai faim","jai faim"], ph:"phrase française", exp:"Tener hambre = avoir faim."},
      {type:"input", q:"Estoy en casa.", a:["je suis à la maison","je suis a la maison","je suis chez moi"], ph:"phrase française", exp:"Estar + lieu."},
      {type:"input", q:"¿De dónde eres?", a:["d'où viens-tu ?","d'ou viens-tu","d'où es-tu","tu viens d'où"], ph:"phrase française", exp:"Ser de + origine."},
      {type:"input", q:"No me gustan las verduras.", a:["je n'aime pas les légumes","je naime pas les legumes"], ph:"phrase française", exp:"Gustan car le sujet est pluriel."},
      {type:"input", q:"Hay mucha gente.", a:["il y a beaucoup de monde","il y a beaucoup de gens"], ph:"phrase française", exp:"Hay = il y a ; gente est singulier en espagnol."},
      {type:"input", q:"El café está frío.", a:["le café est froid","le cafe est froid"], ph:"phrase française", exp:"Estar : état du moment."},
      {type:"input", q:"Mi hermana es muy simpática.", a:["ma sœur est très sympathique","ma soeur est tres sympathique","ma sœur est très sympa"], ph:"phrase française", exp:"Ser + caractère."},
      {type:"input", q:"Voy al mercado los sábados.", a:["je vais au marché le samedi","je vais au marche le samedi","je vais au marché les samedis"], ph:"phrase française", exp:"Los sábados = le samedi (habitude)."},
      {type:"input", q:"¿Cuánto cuesta?", a:["combien ça coûte ?","combien ca coute","combien cela coûte","c'est combien"], ph:"phrase française", exp:"Costar = coûter."},
      {type:"input", q:"Son las tres y media.", a:["il est trois heures et demie","il est trois heures et demi","il est 3h30"], ph:"phrase française", exp:"Son las + heure au pluriel."}
    ]},
    { id:"dictee", nom:"Dictée à trous", consigne:"Complétez le texte avec le mot manquant. TEXTE : Hola, me llamo Javier. Soy de Bogotá pero vivo en Valencia. Tengo veintiocho años y trabajo en un restaurante. Por la mañana voy al mercado; hay frutas y verduras muy buenas. Me gusta mucho cocinar. Los domingos estoy cansado porque trabajo mucho, pero estoy contento.", exercices:[
      {type:"input", q:"Hola, me ______ Javier.", a:["llamo"], ph:"verbe", exp:"Me llamo : verbe pronominal llamarse."},
      {type:"input", q:"______ de Bogotá pero vivo en Valencia.", a:["soy"], ph:"verbe", exp:"Ser de + origine."},
      {type:"input", q:"______ veintiocho años.", a:["tengo"], ph:"verbe", exp:"L'âge avec tener."},
      {type:"input", q:"Trabajo ______ un restaurante.", a:["en"], ph:"préposition", exp:"Trabajar EN + lieu."},
      {type:"input", q:"Por la ______ voy al mercado.", a:["mañana","manana"], ph:"nom", exp:"Por la mañana = le matin."},
      {type:"input", q:"______ frutas y verduras muy buenas.", a:["hay"], ph:"verbe", exp:"Hay pour l'existence."},
      {type:"input", q:"Me ______ mucho cocinar.", a:["gusta"], ph:"verbe", exp:"Devant un infinitif, gustar reste au singulier."},
      {type:"input", q:"Los domingos ______ cansado.", a:["estoy"], ph:"verbe", exp:"Estar + état passager."},
      {type:"input", q:"______ trabajo mucho. (parce que)", a:["porque"], ph:"connecteur", exp:"Porque en un mot, sans accent."},
      {type:"input", q:"Voy ______ mercado. (a + el)", a:["al"], ph:"contraction", exp:"a + el = al."}
    ]},
    { id:"prononciation", nom:"Prononciation et accent tonique", consigne:"Répondez sur les sons et l'accent tonique de l'espagnol.", exercices:[
      {type:"qcm", q:"Le mot CANCIÓN est :", opts:["aguda","llana","esdrújula","sobresdrújula"], a:0, exp:"Aguda : accent sur la dernière syllabe (can-CIÓN)."},
      {type:"qcm", q:"Le mot MÉDICO est :", opts:["aguda","llana","esdrújula","invariable"], a:2, exp:"Esdrújula : accent sur l'avant-avant-dernière syllabe ; toujours écrit."},
      {type:"qcm", q:"Le mot CASA est :", opts:["aguda","llana","esdrújula","aiguë écrite"], a:1, exp:"Llana : accent sur l'avant-dernière syllabe, sans accent écrit."},
      {type:"vf", q:"En espagnol, le H de HOLA ne se prononce pas.", a:true, exp:"Le h est toujours muet : hola, hombre, hay."},
      {type:"qcm", q:"Le J de JAMÓN se prononce :", opts:["comme le j français","comme un r raclé de gorge","comme un y","muet"], a:1, exp:"La jota est un son guttural, comme la ch allemande de Bach."},
      {type:"qcm", q:"Dans GENTE, le G se prononce :", opts:["comme dans gato","comme la jota","comme un k","muet"], a:1, exp:"G + e/i se prononce comme la jota : gente, gitano."},
      {type:"qcm", q:"Le Ñ de ESPAÑA correspond au français :", opts:["n","gn","ny simple","nh muet"], a:1, exp:"Ñ = gn de montagne."},
      {type:"qcm", q:"PERRO et PERO se distinguent par :", opts:["l'accent tonique","le r roulé (rr) contre le r simple","le genre","rien"], a:1, exp:"Perro (chien) a un r fortement roulé ; pero (mais) un r simple."},
      {type:"qcm", q:"Le LL de LLAMAR se prononce en général :", opts:["comme un l double","comme un y","comme un j français","muet"], a:1, exp:"Le yeísmo : ll se prononce comme y (yamar)."},
      {type:"vf", q:"Les mots esdrújulas portent TOUJOURS un accent écrit.", a:true, exp:"Ex. : médico, música, teléfono, sábado."}
    ]}
  ]
};
