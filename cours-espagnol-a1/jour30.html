<body>
<script>
var DAY = {
  num: 30,
  title: "Bilan A1 : se présenter et échanger",
  subtitle: "Le grand récapitulatif : tout ce qu'il faut pour tenir une conversation A1.",
  theory: `
<h3>1. Se présenter en cinq phrases</h3>
<p>Voici le socle d'une présentation complète. Si tu sais dire cela, tu as atteint l'objectif du A1 !</p>
<pre class="pseudo">Me llamo Ana.            → Je m'appelle Ana.
Tengo treinta años.      → J'ai trente ans.
Soy de México.           → Je suis du Mexique.
Vivo en Barcelona.       → Je vis à Barcelone.
Me gusta viajar.         → J'aime voyager.</pre>
<h3>2. Poser des questions</h3>
<pre class="pseudo">¿Cómo te llamas?     → Comment t'appelles-tu ?
¿Cuántos años tienes? → Quel âge as-tu ?
¿De dónde eres?      → D'où viens-tu ?
¿Dónde vives?        → Où habites-tu ?
¿Qué te gusta hacer? → Qu'aimes-tu faire ?
¿A qué hora…?        → À quelle heure… ?</pre>
<h3>3. Les formules d'échange courantes</h3>
<pre class="pseudo">Hola / Buenos días / Buenas tardes → Salut / Bonjour / Bonsoir
¿Qué tal? / ¿Cómo estás?           → Comment ça va ?
Muy bien, gracias. ¿Y tú?          → Très bien, merci. Et toi ?
Por favor / Gracias / De nada      → S'il te plaît / Merci / De rien
Adiós / Hasta luego                → Au revoir / À bientôt</pre>
<h3>4. La boîte à outils du A1</h3>
<pre class="pseudo">ÊTRE      : ser (identité) / estar (état, lieu)
AVOIR     : tener (tengo, tienes, tiene…)
GOÛTS     : me gusta + sing. / me gustan + plur.
FUTUR     : ir a + infinitif (voy a…)
EN COURS  : estar + gerundio (estoy…-ando/-iendo)
IL Y A    : hay / LOCALISER : estar
NOMBRES, HEURE, DATES, FAMILLE, NOURRITURE, VILLE…</pre>
<div class="tip">Bravo : tu as parcouru 30 jours ! Le A1 n'est pas la fin, c'est la base solide qui te permet désormais de comprendre et de te faire comprendre dans les situations du quotidien.</div>
<div class="warn">Pour progresser : parle même en faisant des fautes, réécoute, relis les jours qui t'ont posé problème. La régularité vaut mieux que la perfection.</div>`,
  exercises: [
    { type: "input", q: "Demande le prénom : « ¿Cómo te ___? »", a: ["llamas"], ph: "…", exp: "¿Cómo te llamas? = Comment t'appelles-tu ?" },
    { type: "qcm", q: "« ¿Cuántos años tienes? » demande…", opts: ["le nom", "l'âge", "la ville", "l'heure"], a: 1, exp: "años = ans : on demande l'âge." },
    { type: "input", q: "Réponds : « ___ treinta años. » (verbe tener, je)", a: ["tengo"], ph: "…", exp: "Tengo treinta años = j'ai 30 ans." },
    { type: "qcm", q: "« ¿De dónde eres? » signifie…", opts: ["Où habites-tu ?", "D'où viens-tu ?", "Comment vas-tu ?", "Quel âge as-tu ?"], a: 1, exp: "D'où es-tu / d'où viens-tu (origine, ser)." },
    { type: "input", q: "Origine : « ___ de México. » (verbe ser, je)", a: ["soy"], ph: "…", exp: "Soy de México = je suis du Mexique." },
    { type: "qcm", q: "Pour dire où on habite : « ___ en Barcelona. »", opts: ["Soy", "Vivo", "Tengo", "Voy"], a: 1, exp: "vivir : vivo en Barcelona." },
    { type: "input", q: "Complète : « Me ___ viajar. » (J'aime voyager)", a: ["gusta"], ph: "…", exp: "Devant un infinitif → gusta." },
    { type: "qcm", q: "Comment demande-t-on « Comment ça va ? »", opts: ["¿Qué hora es?", "¿Qué tal?", "¿Cuánto es?", "¿Dónde está?"], a: 1, exp: "¿Qué tal? / ¿Cómo estás? = Comment ça va ?" },
    { type: "input", q: "Réponds poliment : « Muy bien, ___. ¿Y tú? »", a: ["gracias"], ph: "…", exp: "gracias = merci." },
    { type: "vf", q: "« Hasta luego » veut dire « À bientôt ».", a: true, exp: "Formule pour prendre congé." },
    { type: "qcm", q: "« De nada » est la réponse à…", opts: ["Hola", "Gracias", "Adiós", "Perdone"], a: 1, exp: "Gracias → De nada (merci → de rien)." },
    { type: "input", q: "Futur proche : « ___ a viajar mañana. » (yo, ir)", a: ["voy"], ph: "…", exp: "Voy a viajar = je vais voyager." },
    { type: "qcm", q: "Pour LOCALISER une chose connue, on utilise…", opts: ["hay", "estar", "ser", "tener"], a: 1, exp: "estar situe : El libro está en la mesa." },
    { type: "input", q: "Présent continu : « Estoy ___ español. » (en train d'étudier)", a: ["estudiando"], ph: "…", exp: "estar + gerundio : estudiando." },
    { type: "vf", q: "Savoir dire son nom, son âge, son origine, où l'on vit et ce qu'on aime suffit pour une présentation A1.", a: true, exp: "C'est exactement l'objectif du niveau A1." }
  ],
  final: {
    title: "Exercice final — Une conversation complète",
    intro: `<p>Deux personnes font connaissance. Complète mentalement, puis réponds :</p>
<pre class="pseudo">— ¡Hola! ¿Cómo te llamas?      → Salut ! Comment t'appelles-tu ?
— Me llamo Diego. ¿Y tú?       → Je m'appelle Diego. Et toi ?
— Soy Marta. ¿De dónde eres?   → Je suis Marta. D'où viens-tu ?
— Soy de Chile, pero vivo aquí. → Je suis du Chili, mais je vis ici.
— ¿Qué te gusta hacer?         → Qu'aimes-tu faire ?
— Me gusta leer y voy a viajar pronto. → J'aime lire et je vais bientôt voyager.</pre>`,
    questions: [
      { type: "input", q: "Complète la question du prénom : « ¿Cómo te ___? »", a: ["llamas"], ph: "…", exp: "¿Cómo te llamas?" },
      { type: "qcm", q: "D'où vient Diego ?", opts: ["d'Espagne", "du Chili", "du Mexique", "de France"], a: 1, exp: "Soy de Chile." },
      { type: "input", q: "Complète : « ___ de Chile. » (verbe ser)", a: ["soy"], ph: "…", exp: "Soy de Chile = origine avec ser." },
      { type: "qcm", q: "« Me gusta leer » signifie…", opts: ["J'aime lire", "Je vais lire", "Je lis maintenant", "Je n'aime pas lire"], a: 0, exp: "gusta + infinitif = aimer faire qqch." },
      { type: "vf", q: "« Voy a viajar pronto » est un futur proche : « Je vais bientôt voyager ».", a: true, exp: "ir a + infinitif = futur proche." }
    ],
    solution: `<p>Félicitations, tu boucles les 30 jours ! Pour toute présentation A1 : <code>Me llamo…</code>, <code>Tengo… años</code>, <code>Soy de…</code>, <code>Vivo en…</code>, <code>Me gusta / gustan…</code>, plus un projet <code>Voy a…</code>. Pour échanger : les questions (<code>¿Cómo te llamas? ¿De dónde eres? ¿Qué te gusta hacer?</code>) et les formules de politesse (<code>Hola, ¿Qué tal?, gracias, de nada, hasta luego</code>). Tu as désormais tous les outils du niveau débutant. ¡Enhorabuena!</p>`
  }
};
</script>

};
</script>
