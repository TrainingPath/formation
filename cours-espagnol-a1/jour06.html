<script>
var DAY = {
  num: 6,
  title: "Ser ou estar ?",
  subtitle: "Le grand choix : durable ou passager, définition ou situation.",
  theory: `
<h3>1. Le rappel des deux verbes</h3>
<p>Tu connais désormais les deux « être ». Le vrai défi, c'est de choisir le bon. Voici la règle générale :</p>
<pre class="pseudo">SER   ->  ce qui DÉFINIT, ce qui est permanent
          identité, origine, nationalité, métier, caractère, heure
ESTAR ->  ce qui est un ÉTAT du moment ou un LIEU
          humeur, santé, position, localisation</pre>
<h3>2. Comparons côte à côte</h3>
<p>Le même adjectif peut aller avec l'un ou l'autre, mais le sens change :</p>
<pre class="pseudo">Es aburrido.     Il est ennuyeux. (caractère, avec ser)
Está aburrido.   Il s'ennuie. (état du moment, avec estar)

Es rico.         Il est riche. (ser : sa fortune)
Está rico.       C'est délicieux. (estar : goût d'un plat)

Es guapo.        Il est beau. (ser : trait durable)
Está guapo.      Il est beau aujourd'hui. (estar : ce moment)</pre>
<div class="warn">C'est LE piège franco-espagnol par excellence : le français n'a qu'un « être », donc il faut à chaque fois se demander « permanent ou passager ? » avant de choisir.</div>
<h3>3. Les cas toujours avec SER</h3>
<pre class="pseudo">Soy médico.          Je suis médecin. (métier)
Eres alemán.         Tu es allemand. (nationalité)
Somos amigos.        Nous sommes amis. (identité)
Es inteligente.      Il est intelligent. (caractère)
Son las cinco.       Il est cinq heures. (heure)</pre>
<h3>4. Les cas toujours avec ESTAR</h3>
<pre class="pseudo">Estoy en Madrid.     Je suis à Madrid. (lieu)
Estás triste.        Tu es triste. (émotion)
Está cerrado.        C'est fermé. (état résultant)
Estamos listos.      Nous sommes prêts. (état du moment)
El agua está fría.   L'eau est froide. (état)</pre>
<div class="tip">Astuce de tri : demande-toi « est-ce que ça peut changer ce soir ? ». Si oui (fatigué, à la maison, content) -> estar. Si c'est une définition stable (médecin, espagnol, grand) -> ser.</div>
<h3>5. Un exemple qui combine les deux</h3>
<pre class="pseudo">Ana es española y hoy está cansada.
Ana est espagnole (ser : nationalité, permanent)
et aujourd'hui elle est fatiguée (estar : état du moment).</pre>`,
  exercises: [
    { type: "qcm", q: "Pour la nationalité, on utilise…", opts: ["estar", "ser", "les deux au choix", "aucun"], a: 1, exp: "Nationalité = trait permanent = ser." },
    { type: "qcm", q: "Pour dire où l'on se trouve, on utilise…", opts: ["ser", "estar", "tener", "haber"], a: 1, exp: "Le lieu prend toujours estar." },
    { type: "qcm", q: "« Está aburrido » signifie…", opts: ["Il est ennuyeux (caractère)", "Il s'ennuie (état du moment)", "Il est fatigué", "Il est absent"], a: 1, exp: "Avec estar, aburrido = « qui s'ennuie »." },
    { type: "vf", q: "« Es rico » et « está rico » ont exactement le même sens.", a: false, exp: "Es rico = il est riche ; está rico = c'est délicieux." },
    { type: "vf", q: "Le métier se dit avec ser : « soy médico ».", a: true, exp: "Métier = identité durable = ser." },
    { type: "vf", q: "« Estoy en Madrid » est correct pour dire « je suis à Madrid ».", a: true, exp: "Localisation = estar." },
    { type: "qcm", q: "Quelle phrase décrit un ÉTAT passager ?", opts: ["Soy alto", "Estoy cansado", "Es médico", "Somos españoles"], a: 1, exp: "Estoy cansado = état du moment, avec estar." },
    { type: "qcm", q: "« Son las cinco » (il est cinq heures) utilise…", opts: ["estar", "ser", "tener", "hacer"], a: 1, exp: "L'heure se dit avec ser." },
    { type: "input", q: "Choisis ser ou estar, forme « je » : ___ profesor. (métier)", a: ["soy"], ph: "un mot", exp: "Métier -> ser -> soy." },
    { type: "input", q: "Choisis ser ou estar, forme « je » : ___ en casa. (lieu)", a: ["estoy"], ph: "un mot", exp: "Lieu -> estar -> estoy." },
    { type: "input", q: "Complète : Hoy Ana ___ cansada. (état du moment)", a: ["está", "esta"], ph: "un mot", exp: "État passager -> estar -> está." },
    { type: "input", q: "Complète : Ana ___ española. (nationalité)", a: ["es"], ph: "un mot", exp: "Nationalité -> ser -> es." },
    { type: "input", q: "Complète : El agua ___ fría. (état)", a: ["está", "esta"], ph: "un mot", exp: "État -> estar -> está." },
    { type: "input", q: "Complète : Nosotros ___ amigos. (identité)", a: ["somos"], ph: "un mot", exp: "Identité -> ser -> somos." },
    { type: "qcm", q: "« Ana es española y hoy está cansada » : pourquoi deux verbes différents ?", opts: ["Erreur", "es (nationalité, permanent) et está (état du jour, passager)", "Pour faire joli", "estar est plus poli"], a: 1, exp: "ser pour la nationalité, estar pour l'état du moment." }
  ],
  final: {
    title: "Exercice final — Le bon choix",
    intro: `<p>Pour chaque phrase, choisis <strong>ser</strong> ou <strong>estar</strong> et donne la forme correcte. Demande-toi toujours : définition durable, ou état/lieu du moment ?</p>
<pre class="pseudo">1. Yo ___ francés.            (nationalité)
2. La puerta ___ cerrada.     (état résultant)
3. Vosotros ___ estudiantes.  (identité)
4. Los niños ___ en el colegio. (lieu)
5. Este plato ___ delicioso.  (goût du moment : está rico)</pre>`,
    questions: [
      { type: "input", q: "1. Yo ___ francés. (nationalité)", a: ["soy"], ph: "un mot", exp: "ser -> soy." },
      { type: "input", q: "2. La puerta ___ cerrada. (état)", a: ["está", "esta"], ph: "un mot", exp: "estar -> está." },
      { type: "input", q: "3. Vosotros ___ estudiantes. (identité)", a: ["sois"], ph: "un mot", exp: "ser -> sois." },
      { type: "input", q: "4. Los niños ___ en el colegio. (lieu)", a: ["están", "estan"], ph: "un mot", exp: "estar -> están." },
      { type: "qcm", q: "5. Este plato ___ delicioso. (goût du moment)", opts: ["es", "está", "son", "estoy"], a: 1, exp: "Le goût d'un plat qu'on savoure : está." }
    ],
    solution: `<p>Phrases complètes :</p>
<pre class="pseudo">1. Yo soy francés.              Je suis français. (ser)
2. La puerta está cerrada.      La porte est fermée. (estar)
3. Vosotros sois estudiantes.   Vous êtes étudiants. (ser)
4. Los niños están en el colegio. Les enfants sont à l'école. (estar)
5. Este plato está delicioso.   Ce plat est délicieux. (estar)</pre>
<p>Le réflexe « permanent = ser / passager ou lieu = estar » devient automatique avec la pratique. C'est un des piliers de l'espagnol.</p>`
  }
};
