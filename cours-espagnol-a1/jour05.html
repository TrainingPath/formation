  title: "Le verbe estar (état et lieu)",
  subtitle: "Comment on se sent, où l'on se trouve : ce qui peut changer.",
  theory: `
<h3>1. Le second « être »</h3>
<p>Hier tu as vu <strong>ser</strong> pour ce qui est permanent. Aujourd'hui voici <strong>estar</strong>, l'autre « être », qui exprime deux idées principales : <strong>l'état passager</strong> (comment on se sent) et <strong>le lieu</strong> (où l'on se trouve).</p>
<h3>2. La conjugaison de estar au présent</h3>
<p>Verbe irrégulier lui aussi : remarque les accents écrits sur plusieurs formes.</p>
<pre class="pseudo">yo              estoy      je suis
tú              estás      tu es
él / ella       está       il / elle est
usted           está       vous êtes (poli, sing.)
nosotros/as     estamos    nous sommes
vosotros/as     estáis     vous êtes (tutoiement pluriel)
ellos / ellas   están      ils / elles sont
ustedes         están      vous êtes (poli, pluriel)</pre>
<div class="tip">Attention aux accents : <em>estás, está, estáis, están</em> portent un accent écrit sur le a. Sans lui, la prononciation et parfois le sens changent.</div>
<h3>3. estar pour l'état passager</h3>
<p>On l'emploie pour les émotions, la santé, l'humeur : des choses qui peuvent changer d'un moment à l'autre.</p>
<pre class="pseudo">Estoy cansado.        Je suis fatigué.
¿Cómo estás?          Comment vas-tu ?
Estamos contentos.    Nous sommes contents.
Ella está enferma.    Elle est malade.
El café está frío.    Le café est froid.</pre>
<h3>4. estar pour le lieu</h3>
<p>Pour dire OÙ se trouve une personne ou une chose, on utilise TOUJOURS estar (jamais ser) :</p>
<pre class="pseudo">Estoy en casa.            Je suis à la maison.
Madrid está en España.    Madrid est en Espagne.
¿Dónde está el baño?      Où sont les toilettes ?
Los libros están aquí.    Les livres sont ici.</pre>
<div class="warn">Piège majeur : même un lieu PERMANENT (une ville, une montagne) se dit avec estar, car c'est une localisation : <em>España está en Europa</em> (l'Espagne EST en Europe), pas « es en Europa ».</div>
<div class="tip">Petit moyen mnémotechnique : estar = « état » et « emplacement » (les deux commencent par un son proche). ser = tout le reste, l'identité durable.</div>`,

    { type: "qcm", q: "Quelle est la forme de estar pour « je » ?", opts: ["soy", "estoy", "estás", "está"], a: 1, exp: "yo estoy." },

    { type: "vf", q: "Pour situer une ville ou un pays, on utilise estar.", a: true, exp: "Madrid está en España : la localisation, même permanente, prend estar." },

    { type: "input", q: "Complète : Nosotros ___ contentos. (verbe estar)", a: ["estamos"], ph: "un mot", exp: "nosotros estamos contentos." },
    { type: "input", q: "Complète la question : ¿Cómo ___? (comment vas-tu ?)", a: ["estás", "estas"], ph: "un mot", exp: "¿Cómo estás?" },

  ],

<p>Tu connais maintenant les deux « être ». Demain, on apprend à choisir entre ser et estar sans hésiter.</p>`
