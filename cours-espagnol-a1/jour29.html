<script>
var DAY = {
  num: 29,
  title: "Compréhension : un petit texte simple",
  subtitle: "Lire un court texte en espagnol et en comprendre les informations.",
  theory: `
<h3>1. Le texte à lire</h3>
<p>Voici un petit texte de présentation. Lis-le lentement, plusieurs fois. Tu connais déjà presque tous les mots grâce aux jours précédents.</p>
<pre class="pseudo">¡Hola! Me llamo Lucía y tengo veinticinco años.
Soy de Sevilla, en España, pero vivo en Madrid.
Trabajo en una tienda de ropa por la mañana.
Me gusta mucho el café y me gustan los libros.
Tengo un hermano; se llama Pablo y es profesor.
Por la tarde estudio inglés en una academia.
Mañana voy a visitar a mis abuelos.</pre>
<h3>2. La traduction</h3>
<pre class="pseudo">Salut ! Je m'appelle Lucía et j'ai vingt-cinq ans.
Je suis de Séville, en Espagne, mais je vis à Madrid.
Je travaille dans un magasin de vêtements le matin.
J'aime beaucoup le café et j'aime les livres.
J'ai un frère ; il s'appelle Pablo et il est professeur.
L'après-midi, j'étudie l'anglais dans une école.
Demain, je vais rendre visite à mes grands-parents.</pre>
<h3>3. Une méthode de lecture</h3>
<div class="tip">Pour comprendre un texte : 1) repère les mots que tu connais (noms, verbes) ; 2) devine les mots proches du français (<em>profesor, academia, visitar</em>) ; 3) cherche QUI fait QUOI, OÙ et QUAND. Tu n'as pas besoin de comprendre chaque mot pour saisir le sens général.</div>
<h3>4. Les mots utiles du texte</h3>
<pre class="pseudo">la ropa      → les vêtements     la academia → l'école (de langue)
visitar      → rendre visite     el inglés   → l'anglais
mucho        → beaucoup          pero        → mais</pre>
<div class="warn">Repère les structures déjà vues : <em>me llamo, tengo… años, soy de…, me gusta / gustan, voy a + infinitif</em>. Le texte n'est qu'un assemblage de tes briques du A1.</div>`,
  exercises: [
    { type: "input", q: "Comment s'appelle la personne du texte ? ___", a: ["lucía", "lucia"], ph: "…", exp: "Me llamo Lucía." },
    { type: "qcm", q: "Quel âge a-t-elle ?", opts: ["15 ans", "25 ans", "35 ans", "20 ans"], a: 1, exp: "tengo veinticinco años = 25 ans." },
    { type: "input", q: "De quelle ville est-elle originaire ? ___", a: ["sevilla", "séville", "seville"], ph: "…", exp: "Soy de Sevilla." },
    { type: "qcm", q: "Où vit-elle maintenant ?", opts: ["à Séville", "à Madrid", "en France", "à Barcelone"], a: 1, exp: "pero vivo en Madrid." },
    { type: "vf", q: "Lucía travaille dans un magasin de vêtements.", a: true, exp: "Trabajo en una tienda de ropa." },
    { type: "qcm", q: "Quand travaille-t-elle ?", opts: ["le soir", "le matin", "l'après-midi", "la nuit"], a: 1, exp: "por la mañana = le matin." },
    { type: "input", q: "Que boit-elle avec plaisir ? « Me gusta el ___. »", a: ["café", "cafe"], ph: "…", exp: "Me gusta mucho el café." },
    { type: "vf", q: "Lucía dit qu'elle aime les livres (« me gustan los libros »).", a: true, exp: "gustan car libros est au pluriel." },
    { type: "input", q: "Comment s'appelle son frère ? ___", a: ["pablo"], ph: "…", exp: "Tengo un hermano; se llama Pablo." },
    { type: "qcm", q: "Quel est le métier de Pablo ?", opts: ["vendeur", "professeur", "médecin", "étudiant"], a: 1, exp: "es profesor = il est professeur." },
    { type: "input", q: "Quelle langue étudie-t-elle l'après-midi ? « Estudio ___. »", a: ["inglés", "ingles"], ph: "…", exp: "Por la tarde estudio inglés." },
    { type: "qcm", q: "« Mañana voy a visitar a mis abuelos » signifie…", opts: ["Hier j'ai visité mes grands-parents", "Demain je vais rendre visite à mes grands-parents", "J'aime mes grands-parents", "Mes grands-parents travaillent"], a: 1, exp: "Futur proche : voy a visitar." },
    { type: "vf", q: "Le mot « ropa » signifie « les vêtements ».", a: true, exp: "una tienda de ropa = un magasin de vêtements." },
    { type: "qcm", q: "Le mot « pero » signifie…", opts: ["et", "mais", "aussi", "parce que"], a: 1, exp: "pero = mais." },
    { type: "input", q: "Que va faire Lucía demain ? Elle va ___ ses grands-parents. (verbe français)", a: ["visiter", "rendre visite à", "voir"], ph: "…", exp: "visitar = rendre visite / visiter." }
  ],
  final: {
    title: "Exercice final — As-tu bien compris ?",
    intro: `<p>Relis le texte de Lucía une dernière fois, puis réponds sans regarder :</p>
<pre class="pseudo">Lucía · 25 años · de Sevilla · vive en Madrid ·
tienda de ropa (mañana) · café + libros ·
hermano Pablo (profesor) · inglés (tarde) · mañana: abuelos</pre>`,
    questions: [
      { type: "qcm", q: "Lucía est née à Séville mais vit à…", opts: ["Séville", "Madrid", "Barcelone", "Valence"], a: 1, exp: "vivo en Madrid." },
      { type: "input", q: "Combien de frère(s) a-t-elle ? (en chiffre)", a: ["1", "un", "uno"], ph: "…", exp: "Tengo un hermano = un frère." },
      { type: "qcm", q: "À quel moment étudie-t-elle l'anglais ?", opts: ["le matin", "l'après-midi", "le soir", "la nuit"], a: 1, exp: "Por la tarde estudio inglés." },
      { type: "vf", q: "Demain, Lucía va rendre visite à ses grands-parents.", a: true, exp: "Mañana voy a visitar a mis abuelos." },
      { type: "input", q: "Cite une chose qu'elle aime (en espagnol, un mot) : ___", a: ["café", "cafe", "libros", "los libros", "el café"], ph: "…", exp: "Elle aime le café et les livres." }
    ],
    solution: `<p>Comprendre un texte A1, c'est reconnaître les structures apprises : <code>me llamo</code>, <code>tengo… años</code>, <code>soy de…</code>, <code>vivo en…</code>, <code>me gusta / gustan</code>, <code>por la mañana / tarde</code>, <code>voy a + infinitif</code>. Pas besoin de tout traduire mot à mot : repère QUI, QUOI, OÙ, QUAND, et appuie-toi sur les mots proches du français (<em>profesor, academia, visitar</em>).</p>`
  }
};
</script>
