<script>
var DAY = {

  title: "Les prépositions de lieu",
  subtitle: "Dire où se trouvent les choses : sur, sous, devant, entre…",
  theory: `
<h3>1. Les prépositions et locutions de lieu</h3>
<p>Ces petits mots précisent la position d'une chose par rapport à une autre. On les emploie très souvent avec <code>estar</code> (jour 21).</p>
<pre class="pseudo">en          → dans / sur / à
sobre       → sur (au-dessus, en contact)
debajo de   → sous
encima de   → au-dessus de
delante de  → devant
detrás de   → derrière
al lado de  → à côté de
cerca de    → près de
lejos de    → loin de
entre       → entre
enfrente de → en face de
dentro de   → à l'intérieur de
fuera de    → à l'extérieur de</pre>
<h3>2. La construction avec « de »</h3>
<p>Beaucoup de ces locutions se terminent par <code>de</code> (« de »). Quand <code>de</code> rencontre l'article <code>el</code>, ils fusionnent obligatoirement en <code>del</code>.</p>
<pre class="pseudo">de + el → del      (delante de el coche → delante DEL coche)
de + la → de la    (delante de la casa)  → pas de fusion
de + los / las     → pas de fusion (cerca de los árboles)</pre>
<div class="warn">La fusion <code>del</code> est OBLIGATOIRE, jamais « de el ». Seul « él » avec accent (le pronom « lui ») ne fusionne pas.</div>
<h3>3. Exemples en situation</h3>
<pre class="pseudo">El gato está debajo de la mesa.   → Le chat est sous la table.
El libro está sobre la mesa.      → Le livre est sur la table.
El banco está al lado del cine.   → La banque est à côté du cinéma.
La tienda está cerca de aquí.     → Le magasin est près d'ici.
El perro está entre las sillas.   → Le chien est entre les chaises.
Vivo lejos del centro.            → J'habite loin du centre.</pre>
<div class="tip">Pour demander où se trouve une chose : <code>¿Dónde está…?</code>. La réponse commence souvent par <code>Está…</code> + préposition de lieu.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « debajo de » ?", opts: ["sur", "sous", "devant", "à côté de"], a: 1, exp: "debajo de = sous." },
    { type: "input", q: "Traduis « à côté de » : « al ___ de »", a: ["lado"], ph: "…", exp: "al lado de = à côté de." },
    { type: "qcm", q: "« cerca de » signifie…", opts: ["loin de", "près de", "derrière", "entre"], a: 1, exp: "cerca de = près de ; lejos de = loin de." },
    { type: "input", q: "Traduis « derrière » : « ___ de »", a: ["detrás", "detras"], ph: "…", exp: "detrás de = derrière." },
    { type: "vf", q: "« entre » signifie « entre ».", a: true, exp: "entre las sillas = entre les chaises." },
    { type: "qcm", q: "Quand « de » rencontre « el », ils fusionnent en…", opts: ["de el", "del", "dal", "de lo"], a: 1, exp: "de + el = del (obligatoire)." },
    { type: "input", q: "Complète la fusion : « al lado ___ cine » (de + el)", a: ["del"], ph: "…", exp: "de + el cine = del cine." },
    { type: "qcm", q: "Laquelle est correcte ?", opts: ["cerca de el parque", "cerca del parque", "cerca dal parque", "cerca de lo parque"], a: 1, exp: "de + el → del : cerca del parque." },
    { type: "vf", q: "« de » et « la » NE fusionnent PAS : on écrit « delante de la casa ».", a: true, exp: "Seul de + el fusionne en del." },
    { type: "qcm", q: "« El libro está sobre la mesa » signifie…", opts: ["sous la table", "sur la table", "à côté de la table", "loin de la table"], a: 1, exp: "sobre = sur (dessus)." },
    { type: "input", q: "Complète : « El gato está ___ de la mesa. » (sous)", a: ["debajo"], ph: "…", exp: "debajo de la mesa = sous la table." },
    { type: "qcm", q: "Comment dit-on « en face de » ?", opts: ["al lado de", "enfrente de", "dentro de", "encima de"], a: 1, exp: "enfrente de = en face de." },
    { type: "input", q: "Complète : « Vivo lejos ___ centro. » (loin du : de + el)", a: ["del"], ph: "…", exp: "lejos del centro." },
    { type: "vf", q: "Pour demander où se trouve une chose, on dit « ¿Dónde está…? ».", a: true, exp: "¿Dónde está…? = Où se trouve… ?" },
    { type: "input", q: "Traduis « devant » : « ___ de »", a: ["delante"], ph: "…", exp: "delante de = devant." }
  ],
  final: {
    title: "Exercice final — Où est le chat ?",
    intro: `<p>On cherche un chat espiègle :</p>
<pre class="pseudo">El gato no está sobre la cama.       → Le chat n'est pas sur le lit.
Está debajo de la mesa.              → Il est sous la table.
La mesa está al lado del sofá.       → La table est à côté du canapé.
El sofá está cerca de la ventana.    → Le canapé est près de la fenêtre.</pre>`,
    questions: [
      { type: "qcm", q: "Où N'EST PAS le chat ?", opts: ["sous la table", "sur le lit", "à côté du canapé", "près de la fenêtre"], a: 1, exp: "No está sobre la cama = pas sur le lit." },
      { type: "input", q: "Complète : « Está ___ de la mesa. » (sous)", a: ["debajo"], ph: "…", exp: "debajo de la mesa." },
      { type: "input", q: "Complète la fusion : « al lado ___ sofá » (de + el)", a: ["del"], ph: "…", exp: "de + el sofá = del sofá." },
      { type: "qcm", q: "Où se trouve le canapé ?", opts: ["loin de la fenêtre", "près de la fenêtre", "sur la table", "sous le lit"], a: 1, exp: "cerca de la ventana = près de la fenêtre." },
      { type: "vf", q: "Le chat est finalement sous la table.", a: true, exp: "Está debajo de la mesa." }
    ],
    solution: `<p>Retiens la liste des prépositions de lieu (<code>sobre, debajo de, delante de, detrás de, al lado de, cerca de, lejos de, entre, enfrente de</code>) et surtout la fusion obligatoire <code>de + el → del</code> (jamais « de el »). On les combine avec <code>estar</code> pour situer : <code>El gato está debajo de la mesa</code>.</p>`
  }
};
