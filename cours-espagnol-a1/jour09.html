  title: "Les nombres et l'âge (tener)",
  subtitle: "Compter de 0 à 100 et dire son âge à l'espagnole.",
  theory: `
<h3>1. Les nombres de 0 à 15</h3>
<p>Ces premiers nombres s'écrivent en un seul mot et doivent s'apprendre par cœur :</p>
<pre class="pseudo">0 cero    1 uno     2 dos     3 tres    4 cuatro
5 cinco   6 seis    7 siete   8 ocho    9 nueve
10 diez   11 once   12 doce   13 trece  14 catorce   15 quince</pre>
<h3>2. De 16 à 29</h3>
<p>De 16 à 29, les nombres se soudent en un seul mot :</p>
<pre class="pseudo">16 dieciséis   17 diecisiete   18 dieciocho   19 diecinueve
20 veinte      21 veintiuno    22 veintidós   23 veintitrés
24 veinticuatro  25 veinticinco  ...  29 veintinueve</pre>
<h3>3. Les dizaines et la conjonction « y »</h3>
<p>À partir de 30, on écrit dizaine + <strong>y</strong> (« et ») + unité, en trois mots :</p>
<pre class="pseudo">30 treinta    40 cuarenta   50 cincuenta   60 sesenta
70 setenta    80 ochenta    90 noventa     100 cien
31 treinta y uno       42 cuarenta y dos
55 cincuenta y cinco   68 sesenta y ocho</pre>
<div class="warn">La conjonction « y » n'apparaît QU'entre la dizaine et l'unité (treinta y uno). On ne dit jamais « ciento y… ». Et 20-29 s'écrivent soudés (veintiuno), pas « veinte y uno ».</div>
<h3>4. Le verbe tener (avoir)</h3>
<p><strong>tener</strong> signifie « avoir ». Il est irrégulier ; voici sa conjugaison :</p>
<pre class="pseudo">yo              tengo      j'ai
tú              tienes     tu as
él / ella / usted   tiene  il / elle a, vous avez
nosotros/as     tenemos    nous avons
vosotros/as     tenéis     vous avez
ellos / ustedes tienen     ils ont, vous avez</pre>
<h3>5. Dire son âge : le grand piège</h3>
<p>En espagnol, on n'est PAS « X ans », on <strong>A</strong> X ans, avec tener :</p>
<pre class="pseudo">Tengo veinte años.        J'ai vingt ans. (littéralement « j'ai vingt années »)
¿Cuántos años tienes?     Quel âge as-tu ?
Ella tiene treinta años.  Elle a trente ans.</pre>
<div class="warn">Erreur franco-espagnole typique : ne dis JAMAIS « soy veinte años » (avec ser). L'âge se dit avec TENER : <em>tengo… años</em>. Et n'oublie pas le mot <em>años</em> !</div>
<div class="tip">Attention à la prononciation : <em>años</em> (années) s'écrit avec ñ ; sans le tilde, <em>anos</em> voudrait dire tout autre chose. La ñ est indispensable !</div>`,

    { type: "input", q: "Complète : ¿Cuántos años ___? (tu, verbe tener)", a: ["tienes"], ph: "un mot", exp: "¿Cuántos años tienes?" },

    { type: "input", q: "Quel mot signifie « années » (indispensable pour l'âge) ?", a: ["años", "anos"], ph: "un mot", exp: "años, avec ñ." },
    { type: "qcm", q: "« Ella tiene treinta años » signifie…", opts: ["Elle est trentième", "Elle a trente ans", "Il y a trente années", "Elles ont trente ans"], a: 1, exp: "tiene = elle a ; treinta años = trente ans." }
  ],
  final: {

<pre class="pseudo">tengo   -> yo (j'ai)
tiene   -> él/ella (a)
tienen  -> ellos (ont)

<p>Souviens-toi de la règle d'or : l'âge se dit avec TENER (avoir), suivi du nombre et du mot años. « Tengo … años », jamais « soy … años ».</p>`
