<script>
var DAY = {
  num: 8,
  title: "Le genre et le nombre des noms",
  subtitle: "Masculin ou féminin, singulier ou pluriel : les règles et les pièges.",
  theory: `
<h3>1. Le genre des noms</h3>
<p>Chaque nom espagnol est soit <strong>masculin</strong>, soit <strong>féminin</strong>. La terminaison donne un bon indice :</p>
<pre class="pseudo">Finissent souvent en -o  ->  MASCULIN
   el libro (le livre)   el niño (le garçon)   el coche (voiture, exception fréquente)
Finissent souvent en -a  ->  FÉMININ
   la casa (la maison)   la niña (la fille)    la mesa (la table)</pre>
<h3>2. Les exceptions à connaître</h3>
<p>Quelques mots trompent l'oreille francophone et hispanophone. Les plus courants :</p>
<pre class="pseudo">el día        le jour        (en -a mais MASCULIN)
el problema   le problème    (masculin)
el mapa       la carte       (masculin)
la mano       la main        (en -o mais FÉMININ)
la foto       la photo       (féminin)</pre>
<div class="warn">Les noms terminés en -ma d'origine grecque (problema, tema, programa, idioma) sont presque tous MASCULINS : el problema, el tema, el programa.</div>
<h3>3. Le pluriel : règles</h3>
<p>Pour mettre un nom au pluriel, deux règles simples selon la fin du mot :</p>
<pre class="pseudo">Mot finissant par une VOYELLE  ->  on ajoute -s
   casa -> casas      libro -> libros      coche -> coches
Mot finissant par une CONSONNE ->  on ajoute -es
   profesor -> profesores    ciudad -> ciudades    color -> colores</pre>
<h3>4. Le cas du -z</h3>
<p>Les mots finissant par -z changent le z en c avant d'ajouter -es :</p>
<pre class="pseudo">luz    -> luces     (lumière -> lumières)
lápiz  -> lápices   (crayon -> crayons)
vez    -> veces     (fois -> fois, au pluriel)</pre>
<div class="tip">L'article suit toujours le nom en genre et nombre : el problema -> los problemas ; la mano -> las manos. Apprends le nom, son article ET son pluriel.</div>
<h3>5. Le masculin pluriel « qui englobe »</h3>
<p>Comme pour les pronoms (jour 3), un groupe mixte prend le masculin pluriel :</p>
<pre class="pseudo">los niños     les enfants (garçons, ou garçons + filles)
los padres    les parents (le père + la mère)
los reyes     les rois (le roi + la reine)</pre>`,
  exercises: [
    { type: "qcm", q: "Un nom finissant par -o est en général…", opts: ["féminin", "masculin", "toujours pluriel", "invariable"], a: 1, exp: "-o -> masculin (avec des exceptions comme la mano)." },
    { type: "qcm", q: "Quel mot est MASCULIN malgré sa terminaison en -a ?", opts: ["casa", "problema", "mesa", "niña"], a: 1, exp: "el problema est masculin (mot en -ma d'origine grecque)." },
    { type: "qcm", q: "Le pluriel de « profesor » est…", opts: ["profesors", "profesores", "profesoras", "profesor"], a: 1, exp: "Consonne finale -> on ajoute -es : profesores." },
    { type: "vf", q: "« la mano » (la main) est féminin bien qu'il finisse par -o.", a: true, exp: "Exception classique : la mano, féminin." },
    { type: "vf", q: "Le pluriel de « casa » est « casaes ».", a: false, exp: "Voyelle finale -> on ajoute juste -s : casas." },
    { type: "vf", q: "« el día » est féminin.", a: false, exp: "el día est masculin, malgré le -a." },
    { type: "qcm", q: "Le pluriel de « luz » (lumière) est…", opts: ["luzs", "luzes", "luces", "luz"], a: 2, exp: "-z devient -c : luces." },
    { type: "qcm", q: "Le pluriel de « ciudad » (ville) est…", opts: ["ciudads", "ciudades", "ciudad", "ciudaces"], a: 1, exp: "Consonne finale -> -es : ciudades." },
    { type: "input", q: "Écris le pluriel de « libro ».", a: ["libros"], ph: "un mot", exp: "Voyelle -> +s : libros." },
    { type: "input", q: "Écris le pluriel de « color ».", a: ["colores"], ph: "un mot", exp: "Consonne -> +es : colores." },
    { type: "input", q: "Écris l'article défini de « problema » (attention au genre).", a: ["el"], ph: "un mot", exp: "el problema, masculin." },
    { type: "input", q: "Écris le pluriel de « lápiz ».", a: ["lápices", "lapices"], ph: "un mot", exp: "-z -> -c + es : lápices." },
    { type: "input", q: "Écris l'article défini de « mano » (attention au genre).", a: ["la"], ph: "un mot", exp: "la mano, féminin." },
    { type: "qcm", q: "« los padres » peut désigner…", opts: ["seulement des pères", "le père et la mère (les parents)", "seulement des enfants", "les grands-parents"], a: 1, exp: "Le masculin pluriel englobe : los padres = les parents." },
    { type: "qcm", q: "Le pluriel de « el mapa » (masculin) est…", opts: ["las mapas", "los mapas", "los mapes", "el mapas"], a: 1, exp: "el mapa -> los mapas (masculin, +s)." }
  ],
  final: {
    title: "Exercice final — Du singulier au pluriel",
    intro: `<p>Lis ce court texte, puis mets les noms au pluriel.</p>
<pre class="pseudo">La casa tiene una luz. El profesor tiene un lápiz. El día es bonito.
La maison a une lumière. Le professeur a un crayon. Le jour est beau.</pre>`,
    questions: [
      { type: "input", q: "Pluriel de « la casa » (avec l'article) : ___ casas.", a: ["las"], ph: "un mot", exp: "la -> las : las casas." },
      { type: "input", q: "Pluriel de « luz » : una luz -> unas ___.", a: ["luces"], ph: "un mot", exp: "-z -> luces." },
      { type: "input", q: "Pluriel de « profesor » : los ___.", a: ["profesores"], ph: "un mot", exp: "Consonne -> profesores." },
      { type: "input", q: "Pluriel de « lápiz » : unos ___.", a: ["lápices", "lapices"], ph: "un mot", exp: "-z -> lápices." },
      { type: "qcm", q: "Pluriel de « el día » :", opts: ["las días", "los días", "los díes", "el días"], a: 1, exp: "el día est masculin -> los días." }
    ],
    solution: `<p>Texte au pluriel :</p>
<pre class="pseudo">Las casas tienen unas luces. Los profesores tienen unos lápices. Los días son bonitos.
Les maisons ont des lumières. Les professeurs ont des crayons. Les jours sont beaux.</pre>
<p>Note comment l'article, le nom ET l'adjectif s'accordent tous au pluriel. Le genre, lui, reste attaché à chaque mot : à mémoriser un par un.</p>`
  }
};
