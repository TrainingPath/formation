<script>
var DAY = {
  num: 13,
  title: "Le présent des verbes réguliers",
  subtitle: "Les trois groupes -ar, -er, -ir et leurs terminaisons.",
  theory: `
<h3>1. Trois groupes de verbes</h3>
<p>À l'infinitif, tout verbe espagnol se termine par <strong>-ar</strong>, <strong>-er</strong> ou <strong>-ir</strong>. Ces terminaisons définissent trois groupes :</p>
<pre class="pseudo">-ar   hablar (parler)   trabajar (travailler)   estudiar (étudier)
-er   comer (manger)    beber (boire)           aprender (apprendre)
-ir   vivir (vivre)     escribir (écrire)       abrir (ouvrir)</pre>
<h3>2. Conjuguer : radical + terminaison</h3>
<p>On enlève -ar/-er/-ir pour obtenir le <strong>radical</strong> (habl-, com-, viv-), puis on ajoute la terminaison de la personne.</p>
<pre class="pseudo">Verbes en -AR : hablar (parler)
yo hablo        tú hablas       él/ella habla
nosotros hablamos   vosotros habláis   ellos hablan</pre>
<pre class="pseudo">Verbes en -ER : comer (manger)
yo como         tú comes        él/ella come
nosotros comemos    vosotros coméis    ellos comen</pre>
<pre class="pseudo">Verbes en -IR : vivir (vivre)
yo vivo         tú vives        él/ella vive
nosotros vivimos    vosotros vivís     ellos viven</pre>
<h3>3. Le tableau des terminaisons</h3>
<pre class="pseudo">personne     -ar      -er      -ir
yo           -o       -o       -o
tú           -as      -es      -es
él/ella      -a       -e       -e
nosotros     -amos    -emos    -imos
vosotros     -áis     -éis     -ís
ellos        -an      -en      -en</pre>
<div class="tip">Bonne nouvelle : -er et -ir sont presque identiques ! Ils ne diffèrent qu'à « nous » (comemos / vivimos) et « vous » (coméis / vivís). Toutes les autres personnes sont pareilles.</div>
<h3>4. Le présent traduit plusieurs temps français</h3>
<p>Le présent espagnol couvre le présent simple ET le présent progressif du français :</p>
<pre class="pseudo">Hablo español.     Je parle espagnol. / Je suis en train de parler espagnol.
¿Comes carne?      Manges-tu de la viande ? / Est-ce que tu manges de la viande ?</pre>
<div class="warn">Rappel : pas besoin de pronom sujet. <em>Hablo</em> suffit pour « je parle ». La terminaison -o indique déjà « yo ».</div>
<div class="warn">Ne mélange pas les groupes : on dit <em>tú comes</em> (-er), pas « tú comas ». La voyelle de la terminaison dépend du groupe du verbe.</div>`,
  exercises: [
    { type: "qcm", q: "À quel groupe appartient « hablar » ?", opts: ["-ar", "-er", "-ir", "irrégulier"], a: 0, exp: "hablar finit par -ar." },
    { type: "qcm", q: "« yo » + comer donne…", opts: ["como", "comas", "comes", "come"], a: 0, exp: "yo como." },
    { type: "qcm", q: "Quelle personne correspond à « hablan » ?", opts: ["yo", "tú", "nosotros", "ellos"], a: 3, exp: "-an -> ellos/ellas/ustedes." },
    { type: "vf", q: "Les terminaisons -er et -ir sont identiques sauf à « nous » et « vous ».", a: true, exp: "comemos/vivimos et coméis/vivís diffèrent ; le reste est pareil." },
    { type: "vf", q: "« tú comas » est la bonne forme de comer.", a: false, exp: "comer est en -er : tú comes." },
    { type: "vf", q: "Le présent espagnol peut traduire « je suis en train de parler ».", a: true, exp: "Hablo = je parle / je suis en train de parler." },
    { type: "qcm", q: "« nosotros » + vivir donne…", opts: ["vivemos", "vivimos", "vivamos", "vivís"], a: 1, exp: "-ir à nous -> -imos : vivimos." },
    { type: "qcm", q: "« vosotros » + hablar donne…", opts: ["hablan", "habláis", "habléis", "hablamos"], a: 1, exp: "-ar à vous -> -áis : habláis." },
    { type: "input", q: "Conjugue : Yo ___ (hablar) español.", a: ["hablo"], ph: "un mot", exp: "yo hablo." },
    { type: "input", q: "Conjugue : Tú ___ (comer) pan.", a: ["comes"], ph: "un mot", exp: "tú comes." },
    { type: "input", q: "Conjugue : Ella ___ (vivir) en Madrid.", a: ["vive"], ph: "un mot", exp: "ella vive." },
    { type: "input", q: "Conjugue : Nosotros ___ (trabajar) mucho.", a: ["trabajamos"], ph: "un mot", exp: "nosotros trabajamos." },
    { type: "input", q: "Conjugue : Ellos ___ (aprender) inglés.", a: ["aprenden"], ph: "un mot", exp: "ellos aprenden." },
    { type: "input", q: "Conjugue : Yo ___ (escribir) una carta.", a: ["escribo"], ph: "un mot", exp: "yo escribo." },
    { type: "qcm", q: "Pourquoi « vivimos » et non « vivemos » ?", opts: ["Erreur", "Parce que vivir est en -ir : à nous, terminaison -imos", "Parce que vivir est irrégulier", "Par hasard"], a: 1, exp: "-ir à nous -> -imos, à la différence de -er (-emos)." }
  ],
  final: {
    title: "Exercice final — Conjuguer au présent",
    intro: `<p>Lis ce court texte, puis complète les verbes réguliers au présent.</p>
<pre class="pseudo">Yo estudio español. Mi hermano trabaja en Madrid y vive allí. Nosotros aprendemos rápido.
J'étudie l'espagnol. Mon frère travaille à Madrid et y vit. Nous apprenons vite.</pre>`,
    questions: [
      { type: "input", q: "Yo ___ (estudiar) español.", a: ["estudio"], ph: "un mot", exp: "yo estudio (-ar)." },
      { type: "input", q: "Mi hermano ___ (trabajar) en Madrid.", a: ["trabaja"], ph: "un mot", exp: "él trabaja." },
      { type: "input", q: "Mi hermano ___ (vivir) allí.", a: ["vive"], ph: "un mot", exp: "él vive (-ir)." },
      { type: "input", q: "Nosotros ___ (aprender) rápido.", a: ["aprendemos"], ph: "un mot", exp: "nosotros aprendemos (-er)." },
      { type: "qcm", q: "Quel groupe suit la même terminaison que -er à « yo » ?", opts: ["seulement -ar", "-ir aussi : tous font -o à yo", "aucun", "seulement les irréguliers"], a: 1, exp: "À yo, les trois groupes font -o : hablo, como, vivo." }
    ],
    solution: `<p>Récapitulatif des terminaisons :</p>
<pre class="pseudo">        -ar            -er            -ir
yo      hablo          como           vivo
tú      hablas         comes          vives
él      habla          come           vive
nos.    hablamos       comemos        vivimos
vos.    habláis        coméis          vivís
ellos   hablan         comen          viven</pre>
<p>Avec ces trois modèles, tu peux conjuguer des centaines de verbes réguliers. C'est la base du présent espagnol.</p>`
  }
};
