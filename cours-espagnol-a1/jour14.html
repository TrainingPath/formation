var DAY = {

  title: "La négation et les questions",
  subtitle: "Dire non, poser des questions et la double négation.",
  theory: `
<h3>1. La négation : un seul mot, no</h3>
<p>Pour rendre une phrase négative, il suffit de placer <strong>no</strong> devant le verbe. C'est beaucoup plus simple qu'en français (pas de « ne… pas ») :</p>
<pre class="pseudo">Hablo español.      Je parle espagnol.
No hablo español.   Je ne parle pas espagnol.
Ella no come carne. Elle ne mange pas de viande.</pre>
<div class="warn">Une seule différence à retenir : là où le français encadre le verbe (ne… pas), l'espagnol met un seul <em>no</em> AVANT le verbe. Rien après.</div>
<h3>2. Répondre « oui » ou « non »</h3>
<pre class="pseudo">¿Hablas español?   Sí, hablo español.   Oui, je parle espagnol.
                    No, no hablo español. Non, je ne parle pas espagnol.</pre>
<div class="tip">Remarque le double « no » dans la réponse négative : le premier veut dire « non » (la réponse), le second est la négation du verbe. « No, no hablo » = « Non, je ne parle pas ».</div>
<h3>3. La double négation avec nada, nadie, nunca</h3>
<p>Contrairement au français scolaire, l'espagnol garde le <strong>no</strong> devant le verbe même avec un autre mot négatif :</p>
<pre class="pseudo">No tengo nada.      Je n'ai rien.       (nada = rien)
No veo a nadie.     Je ne vois personne. (nadie = personne)
No voy nunca.       Je ne vais jamais.  (nunca = jamais)</pre>
<div class="warn">La double négation est OBLIGATOIRE et correcte en espagnol : <em>no… nada</em>, <em>no… nadie</em>, <em>no… nunca</em>. Ce n'est pas une faute, contrairement à ce qu'on croirait en français.</div>
<h3>4. Poser une question : l'intonation</h3>
<p>La façon la plus simple de poser une question : garder l'ordre de la phrase et monter la voix, en encadrant de ¿ ?</p>
<pre class="pseudo">Tú hablas español.    Tu parles espagnol. (affirmation)
¿Tú hablas español?   Est-ce que tu parles espagnol ? (question)</pre>
<h3>5. Poser une question : l'inversion</h3>
<p>On peut aussi placer le verbe avant le sujet, comme en français soutenu :</p>
<pre class="pseudo">¿Hablas (tú) español?     Parles-tu espagnol ?
¿Vive Ana en Madrid?      Ana vit-elle à Madrid ?
¿Tienen ustedes hijos?    Avez-vous des enfants ?</pre>
<div class="warn">N'oublie jamais le point d'interrogation inversé ¿ au DÉBUT et le ? à la fin. En espagnol écrit, les deux sont obligatoires : ¿Cómo estás?</div>`,

    { type: "qcm", q: "« Je ne mange pas de viande » se dit…", opts: ["Como no carne", "No como carne", "Ne como pas carne", "Como carne no"], a: 1, exp: "no devant le verbe : No como carne." },
    { type: "qcm", q: "« Je n'ai rien » se dit…", opts: ["Tengo nada", "No tengo nada", "Nada tengo no", "No tengo no nada"], a: 1, exp: "Double négation : No tengo nada." },
    { type: "vf", q: "En espagnol, « No tengo nada » (double négation) est correct.", a: true, exp: "La double négation est la norme : no… nada." },
    { type: "vf", q: "Il faut un point d'interrogation inversé au début d'une question écrite.", a: true, exp: "¿…? : les deux signes sont obligatoires." },
    { type: "vf", q: "Pour poser une question, on peut simplement changer l'intonation.", a: true, exp: "¿Tú hablas español? garde l'ordre, seul le ton monte." },
    { type: "qcm", q: "« nadie » signifie…", opts: ["rien", "personne", "jamais", "nulle part"], a: 1, exp: "nadie = personne." },
    { type: "qcm", q: "Question par inversion : « Ana vit-elle à Madrid ? »", opts: ["¿Ana vive Madrid?", "¿Vive Ana en Madrid?", "Vive Ana en Madrid.", "¿En Madrid Ana vive?"], a: 1, exp: "Verbe avant sujet : ¿Vive Ana en Madrid?" },
    { type: "input", q: "Mets à la forme négative : Hablo español. -> ___ hablo español.", a: ["no"], ph: "un mot", exp: "No hablo español." },
    { type: "input", q: "Complète : No veo a ___ (personne).", a: ["nadie"], ph: "un mot", exp: "No veo a nadie." },
    { type: "input", q: "Complète : No voy ___ (jamais).", a: ["nunca"], ph: "un mot", exp: "No voy nunca = je ne vais jamais." },
    { type: "input", q: "Ajoute le signe qui ouvre la question : ___Hablas español?", a: ["¿"], ph: "un signe", exp: "¿Hablas español?" },
    { type: "input", q: "Réponds négativement : ¿Comes carne? -> ___, no como carne. (le mot « non »)", a: ["no"], ph: "un mot", exp: "No, no como carne." },
    { type: "qcm", q: "Pourquoi deux « no » dans « No, no hablo » ?", opts: ["Erreur", "Le premier est la réponse « non », le second nie le verbe", "Pour insister seulement", "C'est du pluriel"], a: 1, exp: "no (réponse) + no (négation du verbe)." },
    { type: "qcm", q: "« No tengo nada » se traduit…", opts: ["J'ai quelque chose", "Je n'ai rien", "Je n'ai pas beaucoup", "Je n'ai personne"], a: 1, exp: "no… nada = ne… rien." }
  ],
  final: {

      { type: "input", q: "« Je ne vois personne » : No veo a ___.", a: ["nadie"], ph: "un mot", exp: "No veo a nadie." },

<pre class="pseudo">Négation : no + verbe            No hablo francés.
Double négation : no… nada/nadie/nunca (obligatoire)
Question : ¿ … ?  (intonation ou inversion)
Réponse : Sí / No, + phrase</pre>
<p>La négation espagnole est plus simple que la française (un seul no), mais attention à la double négation, qui surprend souvent les francophones.</p>`
  }
