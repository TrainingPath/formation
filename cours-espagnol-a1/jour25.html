<script>
var DAY = {
  num: 25,
  title: "Faire des courses, les prix",
  subtitle: "Acheter, demander un prix et comprendre la réponse dans un magasin.",
  theory: `
<h3>1. Dans le magasin : le vocabulaire</h3>
<pre class="pseudo">la tienda    → le magasin        el supermercado → le supermarché
el mercado   → le marché         la panadería    → la boulangerie
comprar      → acheter           vender          → vendre
el dinero    → l'argent          el precio       → le prix
caro / cara  → cher              barato / barata → bon marché
el euro      → l'euro            los céntimos    → les centimes</pre>
<h3>2. Demander le prix</h3>
<p>Deux questions essentielles selon qu'on parle d'UNE chose ou de PLUSIEURS.</p>
<pre class="pseudo">¿Cuánto cuesta?     → Combien ça coûte ? (un objet)
¿Cuánto cuestan?    → Combien coûtent-ils ? (plusieurs objets)
¿Cuánto es?         → Ça fait combien ? (le total)</pre>
<pre class="pseudo">Cuesta tres euros.        → Ça coûte trois euros.
Cuestan cinco euros.      → Ils coûtent cinq euros.
Son diez euros con cincuenta. → Ça fait 10 euros 50.</pre>
<div class="warn">Comme pour l'heure, on accorde le verbe : <strong>cuesta</strong> (une chose) / <strong>cuestan</strong> (plusieurs choses). C'est le verbe <em>costar</em>, à diphtongue o→ue.</div>
<h3>3. Acheter : les phrases utiles</h3>
<pre class="pseudo">¿Qué desea?              → Que désirez-vous ? (le vendeur)
Quiero un kilo de manzanas. → Je veux un kilo de pommes.
Quería una barra de pan. → Je voudrais une baguette de pain.
¿Algo más?               → Autre chose ?
Nada más, gracias.       → Rien de plus, merci.
¿Puedo pagar con tarjeta? → Je peux payer par carte ?</pre>
<div class="tip">Les quantités : <code>un kilo de</code>, <code>medio kilo de</code> (un demi-kilo), <code>una botella de</code> (une bouteille de), <code>un paquete de</code> (un paquet de). Toujours suivies de <code>de</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « comprar » ?", opts: ["vendre", "acheter", "payer", "coûter"], a: 1, exp: "comprar = acheter ; vender = vendre." },
    { type: "input", q: "Traduis « le prix » : « el ___ »", a: ["precio"], ph: "…", exp: "el precio = le prix." },
    { type: "qcm", q: "« barato » signifie…", opts: ["cher", "bon marché", "gratuit", "grand"], a: 1, exp: "barato = bon marché ; caro = cher." },
    { type: "input", q: "Demande le prix d'UN objet : « ¿Cuánto ___? »", a: ["cuesta"], ph: "…", exp: "¿Cuánto cuesta? = Combien ça coûte ?" },
    { type: "qcm", q: "Pour PLUSIEURS objets, on demande…", opts: ["¿Cuánto cuesta?", "¿Cuánto cuestan?", "¿Cuánto es uno?", "¿Qué precio?"], a: 1, exp: "cuestan pour un pluriel." },
    { type: "input", q: "Complète : « ¿Cuánto ___? » (Ça fait combien, le total)", a: ["es"], ph: "…", exp: "¿Cuánto es? = Ça fait combien ?" },
    { type: "vf", q: "Le verbe « costar » s'accorde : cuesta (une chose) / cuestan (plusieurs).", a: true, exp: "Comme l'heure : singulier / pluriel." },
    { type: "qcm", q: "Le vendeur demande souvent…", opts: ["¿Cómo estás?", "¿Qué desea?", "¿Dónde vives?", "¿Qué hora es?"], a: 1, exp: "¿Qué desea? = Que désirez-vous ?" },
    { type: "input", q: "Complète : « Quiero un ___ de manzanas. » (un kilo)", a: ["kilo"], ph: "…", exp: "un kilo de manzanas." },
    { type: "qcm", q: "« ¿Algo más? » signifie…", opts: ["Combien ça coûte ?", "Autre chose ?", "C'est trop cher", "Où est la caisse ?"], a: 1, exp: "¿Algo más? = Autre chose ?" },
    { type: "input", q: "Réponds « Rien de plus, merci » : « Nada ___, gracias. »", a: ["más", "mas"], ph: "…", exp: "Nada más = rien de plus." },
    { type: "qcm", q: "Comment demande-t-on à payer par carte ?", opts: ["¿Puedo pagar con tarjeta?", "¿Cuánto cuesta?", "¿Qué desea?", "¿Algo más?"], a: 0, exp: "pagar con tarjeta = payer par carte." },
    { type: "input", q: "Complète : « Cuesta tres ___. » (euros)", a: ["euros"], ph: "…", exp: "Cuesta tres euros." },
    { type: "vf", q: "Les quantités comme « un kilo » sont suivies de « de » : un kilo DE manzanas.", a: true, exp: "un kilo de, una botella de, un paquete de." },
    { type: "input", q: "Traduis « le marché » : « el ___ »", a: ["mercado"], ph: "…", exp: "el mercado = le marché." }
  ],
  final: {
    title: "Exercice final — À la boulangerie",
    intro: `<p>Un dialogue au magasin :</p>
<pre class="pseudo">— ¿Qué desea?                 → Que désirez-vous ?
— Quiero dos barras de pan.   → Je veux deux baguettes de pain.
— ¿Algo más?                  → Autre chose ?
— No, ¿cuánto es?             → Non, ça fait combien ?

      { type: "input", q: "Le client veut deux ___ de pain. (baguettes)", a: ["barras"], ph: "…", exp: "dos barras de pan = deux baguettes." },
      { type: "qcm", q: "« ¿Cuánto es? » sert à demander…", opts: ["le prix d'un seul objet", "le total à payer", "l'heure", "où est le magasin"], a: 1, exp: "¿Cuánto es? = le total." },
      { type: "input", q: "Complète la réponse : « ___ dos euros con veinte. » (verbe ser)", a: ["son"], ph: "…", exp: "Son dos euros = ça fait deux euros (pluriel)." },
      { type: "vf", q: "« Son dos euros con veinte » veut dire 2 euros 20.", a: true, exp: "con veinte = et 20 (centimes)." }

    solution: `<p>Pour faire ses courses : le vendeur demande <code>¿Qué desea?</code> ; on répond <code>Quiero…</code> ou <code>Quería…</code> + quantité (<em>un kilo de, dos barras de</em>). On demande le prix avec <code>¿Cuánto cuesta?</code> (un objet), <code>¿Cuánto cuestan?</code> (plusieurs) ou <code>¿Cuánto es?</code> (le total). Utile : <code>¿Algo más?</code>, <code>Nada más</code>, <code>¿Puedo pagar con tarjeta?</code>.</p>`
  }
