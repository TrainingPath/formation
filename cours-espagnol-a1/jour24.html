  subtitle: "Raconter sa journée avec les verbes en « se » (se lever, se laver…).",
  theory: `
<h3>1. Qu'est-ce qu'un verbe pronominal ?</h3>
<p>Un <strong>verbe pronominal</strong> se construit avec un petit pronom (« se ») qui renvoie à la personne elle-même : l'action se fait sur soi. À l'infinitif, ce pronom est collé à la fin : <code>levantarse</code> (se lever), <code>ducharse</code> (se doucher).</p>
<pre class="pseudo">levantarse   → se lever
ducharse     → se doucher
lavarse      → se laver
vestirse     → s'habiller
llamarse     → s'appeler
acostarse    → se coucher
despertarse  → se réveiller</pre>
<h3>2. Le pronom change avec la personne</h3>
<p>Quand on conjugue, le pronom « se » se déplace DEVANT le verbe et change selon la personne :</p>
<pre class="pseudo">yo         me levanto     → je me lève
tú         te levantas    → tu te lèves
él/ella    se levanta     → il/elle se lève
nosotros   nos levantamos → nous nous levons
vosotros   os levantáis   → vous vous levez
ellos      se levantan    → ils/elles se lèvent</pre>
<div class="warn">Le pronom (me, te, se, nos, os, se) se place AVANT le verbe conjugué : « me levanto », jamais « levanto me ». Il s'accorde toujours avec le sujet.</div>
<h3>3. Le vocabulaire de la routine</h3>
<pre class="pseudo">Me despierto a las siete.   → Je me réveille à 7 h.
Me levanto.                 → Je me lève.
Me ducho.                   → Je me douche.
Me visto.                   → Je m'habille.
Desayuno.                   → Je prends le petit-déjeuner. (non pronominal)
Voy al trabajo.             → Je vais au travail.
Me acuesto a las once.      → Je me couche à 11 h.</pre>
<div class="tip">Des mots pour ordonner la journée : <code>primero</code> (d'abord), <code>después</code> / <code>luego</code> (ensuite), <code>por la mañana</code> (le matin), <code>por la tarde</code> (l'après-midi), <code>por la noche</code> (le soir).</div>`,

    { type: "input", q: "Traduis l'infinitif « se lever » : ___", a: ["levantarse"], ph: "…", exp: "levantarse ; le « se » est collé à l'infinitif." },
    { type: "qcm", q: "« ducharse » signifie…", opts: ["se coucher", "se doucher", "se réveiller", "s'habiller"], a: 1, exp: "ducharse = se doucher." },
    { type: "input", q: "Complète : « Yo ___ levanto a las siete. » (pronom)", a: ["me"], ph: "…", exp: "me levanto = je me lève." },
    { type: "qcm", q: "Où se place le pronom avec un verbe conjugué ?", opts: ["après le verbe", "avant le verbe (me levanto)", "à la fin de la phrase", "il disparaît"], a: 1, exp: "Le pronom précède le verbe conjugué." },
    { type: "input", q: "Complète : « Tú ___ levantas. » (pronom)", a: ["te"], ph: "…", exp: "te levantas = tu te lèves." },
    { type: "vf", q: "On dit « me levanto » et non « levanto me ».", a: true, exp: "Le pronom se place avant le verbe conjugué." },
    { type: "qcm", q: "Comment dit-on « il se lève » ?", opts: ["me levanta", "se levanta", "te levanta", "nos levanta"], a: 1, exp: "él se levanta." },
    { type: "input", q: "Complète : « Nosotros ___ levantamos. » (pronom)", a: ["nos"], ph: "…", exp: "nos levantamos = nous nous levons." },
    { type: "qcm", q: "« Me acuesto a las once » signifie…", opts: ["Je me réveille à 11 h", "Je me couche à 11 h", "Je me douche à 11 h", "Je m'habille à 11 h"], a: 1, exp: "acostarse = se coucher." },
    { type: "input", q: "Complète : « ___ visto por la mañana. » (Je m'habille : pronom)", a: ["me"], ph: "…", exp: "me visto = je m'habille." },
    { type: "qcm", q: "Que signifie « primero » ?", opts: ["ensuite", "d'abord", "le soir", "jamais"], a: 1, exp: "primero = d'abord ; después/luego = ensuite." },
    { type: "vf", q: "« Desayuno » (je prends le petit-déjeuner) n'est pas pronominal : il n'y a pas de « me ».", a: true, exp: "desayunar est un verbe normal." },
    { type: "input", q: "Complète : « ___ despierto a las siete. » (Je me réveille : pronom)", a: ["me"], ph: "…", exp: "me despierto = je me réveille." },
    { type: "qcm", q: "« por la noche » signifie…", opts: ["le matin", "l'après-midi", "le soir / la nuit", "à midi"], a: 2, exp: "por la noche = le soir / la nuit." }
  ],
  final: {
    title: "Exercice final — La routine de Carlos",
    intro: `<p>Carlos raconte sa journée :</p>
<pre class="pseudo">Me despierto a las siete y me levanto. → Je me réveille à 7 h et je me lève.
Primero me ducho, después desayuno.    → D'abord je me douche, ensuite je déjeune.

Por la noche me acuesto a las once.    → Le soir, je me couche à 11 h.</pre>`,

      { type: "qcm", q: "« me visto » signifie…", opts: ["je me réveille", "je m'habille", "je me douche", "je me couche"], a: 1, exp: "vestirse = s'habiller." },
      { type: "input", q: "Complète : « ___ acuesto a las once. » (Je me couche : pronom)", a: ["me"], ph: "…", exp: "me acuesto = je me couche." },

    ],
    solution: `<p>Les verbes pronominaux portent « se » à l'infinitif (<code>levantarse, ducharse, acostarse…</code>). Conjugués, le pronom passe DEVANT et s'accorde : <em>me, te, se, nos, os, se</em> (« me levanto, te levantas, se levanta… »). Pour organiser le récit : <code>primero</code> (d'abord), <code>después / luego</code> (ensuite), <code>por la mañana / tarde / noche</code>.</p>`
  }
};
