  title: "Les articles (el, la, un, una)",
  subtitle: "Le, la, un, une : reconnaître et accorder les petits mots.",
  theory: `
<h3>1. À quoi sert un article ?</h3>
<p>Un <strong>article</strong> est un petit mot placé devant un nom. Il en existe deux familles, comme en français :</p>
<pre class="pseudo">Article DÉFINI    ->  le, la, les      (une chose connue, précise)
Article INDÉFINI  ->  un, une, des     (une chose quelconque)</pre>
<h3>2. Les articles définis</h3>
<p>Ils s'accordent en genre (masculin/féminin) et en nombre (singulier/pluriel) :</p>
<pre class="pseudo">          masculin        féminin
singulier el (le)         la (la)
pluriel   los (les)       las (les)</pre>
<pre class="pseudo">el libro     le livre        la casa     la maison
los libros   les livres      las casas   les maisons</pre>
<h3>3. Les articles indéfinis</h3>
<pre class="pseudo">          masculin        féminin
singulier un (un)         una (une)
pluriel   unos (des)      unas (des)</pre>
<pre class="pseudo">un libro     un livre        una casa    une maison
unos libros  des livres      unas casas  des maisons</pre>
<div class="tip">Truc de mémoire : le masculin finit souvent par -o (el, un, los, unos) et le féminin par -a (la, una, las, unas). Ça t'aide à deviner le genre !</div>
<h3>4. Le genre n'est pas le même qu'en français</h3>
<p>Beaucoup de mots ont un genre différent de leur équivalent français. Il faut apprendre chaque nom AVEC son article :</p>
<pre class="pseudo">la leche     le lait (féminin en espagnol !)
el problema  le problème (masculin, malgré le -a)
la sal       le sel (féminin)
el color     la couleur (masculin)</pre>
<div class="warn">Ne traduis jamais le genre mot à mot depuis le français : « le lait » est masculin en français mais <em>la leche</em> est féminin en espagnol. Apprends toujours <em>el</em> ou <em>la</em> collé au mot.</div>
<h3>5. L'article contracté</h3>
<p>Deux contractions obligatoires existent, avec les prépositions <em>a</em> (à) et <em>de</em> (de) devant <strong>el</strong> :</p>
<pre class="pseudo">a + el   = al      Voy al cine.        Je vais au cinéma.
de + el  = del     Vengo del banco.   Je viens de la banque.</pre>
<div class="warn">Ces contractions ne se font QU'avec <em>el</em> (masculin singulier). On ne contracte pas avec la, los, las : <em>Voy a la playa</em> (je vais à la plage), pas « a-la ».</div>`,

    { type: "qcm", q: "Le pluriel de « el libro » est…", opts: ["las libros", "los libros", "unos libro", "el libros"], a: 1, exp: "el -> los : los libros." },
    { type: "vf", q: "« la leche » (le lait) est féminin en espagnol.", a: true, exp: "Oui, malgré le masculin français : la leche." },

    { type: "vf", q: "« a + el » se contracte en « al ».", a: true, exp: "Voy al cine = je vais au cinéma." },
    { type: "qcm", q: "Quelle forme est l'article indéfini pluriel féminin ?", opts: ["unos", "unas", "las", "una"], a: 1, exp: "unas casas = des maisons." },
    { type: "qcm", q: "« de + el » donne…", opts: ["del", "dela", "de el (inchangé)", "al"], a: 0, exp: "de + el = del : Vengo del banco." },
    { type: "input", q: "Complète : ___ casa (article défini féminin singulier).", a: ["la"], ph: "un mot", exp: "la casa = la maison." },
    { type: "input", q: "Complète : ___ libros (article défini masculin pluriel).", a: ["los"], ph: "un mot", exp: "los libros = les livres." },
    { type: "input", q: "Complète : ___ problema (article défini ; attention, ce mot est masculin).", a: ["el"], ph: "un mot", exp: "el problema, masculin malgré le -a final." },
    { type: "input", q: "Contracte : Voy ___ cine. (a + el)", a: ["al"], ph: "un mot", exp: "a + el = al." },
    { type: "input", q: "Complète : ___ casa (article indéfini féminin : « une »).", a: ["una"], ph: "un mot", exp: "una casa = une maison." },
    { type: "qcm", q: "Pourquoi « Voy a la playa » ne se contracte pas ?", opts: ["Erreur, ça devrait", "Parce que la contraction ne se fait qu'avec el, pas avec la", "Parce que playa est masculin", "Parce que a ne se contracte jamais"], a: 1, exp: "Seul a + el = al ; a + la reste a la." },
    { type: "qcm", q: "« des livres » (indéfini pluriel masculin) se dit…", opts: ["los libros", "unos libros", "unas libros", "un libros"], a: 1, exp: "unos libros = des livres." }
  ],
  final: {

    intro: `<p>Complète chaque nom avec l'article demandé. Fais attention au genre espagnol, parfois différent du français.</p>

2. ___ coche     (indéfini : une voiture, coche est masculin)
3. ___ niños     (défini pluriel : les enfants)

      { type: "input", q: "2. ___ coche (indéfini masc. sing. ; « une voiture »)", a: ["un"], ph: "un mot", exp: "coche est masculin : un coche." },
      { type: "input", q: "3. ___ niños (défini masc. pluriel)", a: ["los"], ph: "un mot", exp: "los niños." },
      { type: "input", q: "4. Vengo ___ mercado. (de + el)", a: ["del"], ph: "un mot", exp: "de + el = del." },

    ],

<pre class="pseudo">1. la mesa         la table

<p>Les articles portent le genre et le nombre : c'est en les apprenant collés au nom que tu retiendras le genre correct. Demain, on approfondit ce genre et ce nombre des noms.</p>`
