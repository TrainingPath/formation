<script>
var DAY = {
  num: 29,
  title: "Projet final (3) : l'entretien d'embauche complet",
  subtitle: "Un dialogue modèle candidat/recruteur, la méthode STAR, la banque de questions et les expressions clés.",
  theory: `
<h3>Projet final — L'entretien d'embauche (entrevista de trabajo)</h3>
<p>Troisième projet : maîtriser un <strong>entretien d'embauche complet</strong> en espagnol. Tu vas étudier un dialogue modèle, apprendre la méthode <strong>STAR</strong> pour structurer tes réponses, mémoriser une banque de questions fréquentes et les expressions qui font bonne impression.</p>
<h3>1. Le dialogue modèle</h3>
<p>Lis cet entretien entre un recruteur (R) et une candidate (C) pour un poste de responsable marketing.</p>
<pre class="pseudo">R: Buenos días, gracias por venir. Cuénteme, ¿por qué le
   interesa este puesto?
C: Buenos días. Me interesa porque llevo cinco años en
   marketing digital y su empresa es líder en el sector. Creo
   que podría aportar mi experiencia en redes sociales.
R: Muy bien. Hábleme de una dificultad que haya superado en
   su trabajo.
C: Claro. En mi anterior empresa, las ventas online habían
   caído un 20%. Me encargaron mejorar los resultados.
   Diseñé una nueva campaña en redes y, en tres meses,
   conseguimos aumentar las ventas un 35%.
R: Impresionante. ¿Cuáles diría que son sus puntos fuertes?
C: Soy organizada, resolutiva y trabajo bien en equipo.
   Reconozco que a veces soy demasiado perfeccionista, pero
   estoy aprendiendo a delegar.
R: ¿Dónde se ve dentro de cinco años?
C: Me gustaría haber crecido dentro de la empresa y dirigir
   mi propio equipo de marketing.
R: Perfecto. ¿Tiene alguna pregunta para nosotros?
C: Sí, me gustaría saber cómo es un día típico en este puesto
   y cómo miden ustedes el éxito de un empleado.
R: Excelente pregunta. Se lo explico…</pre>
<h3>2. La méthode STAR (pour raconter une expérience)</h3>
<p>Pour répondre à « racontez une situation difficile », structure ta réponse en quatre temps. C'est la méthode <strong>STAR</strong> (Situación, Tarea, Acción, Resultado).</p>
<pre class="pseudo">S · Situación : le contexte    → «Las ventas habían caído un 20%.»
T · Tarea     : ta mission     → «Me encargaron mejorar los resultados.»
A · Acción    : ce que TU as fait → «Diseñé una campaña en redes.»
R · Resultado : le résultat chiffré → «Aumentamos las ventas un 35%.»</pre>
<div class="tip">La clé du STAR : insiste sur l'ACTION (ce que TOI tu as fait, avec « yo ») et termine toujours par un RÉSULTAT concret, si possible chiffré. Un recruteur retient les résultats.</div>
<h3>3. Banque de questions fréquentes</h3>
<pre class="pseudo">¿Por qué quiere trabajar con nosotros?   Pourquoi chez nous ?
Hábleme de usted.                        Parlez-moi de vous.
¿Cuáles son sus puntos fuertes/débiles?  Vos qualités/défauts ?
¿Por qué dejó su anterior empleo?        Pourquoi ce départ ?
Cuénteme un logro del que esté orgulloso. Une réussite dont vous êtes fier ?
¿Cómo trabaja bajo presión?              Sous pression ?
¿Cuáles son sus pretensiones salariales? Vos prétentions salariales ?
¿Dónde se ve dentro de cinco años?       Dans cinq ans ?</pre>
<h3>4. Expressions qui font bonne impression</h3>
<pre class="pseudo">Me apasiona…                        Je suis passionné(e) par…
Tengo experiencia en…               J'ai de l'expérience en…
Se me da bien…                      Je suis doué(e) pour…
Estoy dispuesto/a a…                Je suis prêt(e) à…
Aporto… al equipo.                  J'apporte… à l'équipe.
Considero que mi mayor logro es…    Ma plus grande réussite est…
Me gustaría desarrollarme en…       J'aimerais évoluer dans…</pre>
<div class="warn">Le piège du « défaut » : ne jamais répondre « no tengo defectos » (arrogant) ni citer un défaut rédhibitoire. La bonne technique : un vrai défaut mineur + ce que tu fais pour t'améliorer (« Soy perfeccionista, pero estoy aprendiendo a delegar »).</div>
<h3>5. Le registre et la politesse</h3>
<p>L'entretien se déroule en <strong>usted</strong> (vouvoiement) et à un registre soutenu. On soigne les formules d'ouverture (« Gracias por recibirme »), de transition (« En cuanto a… ») et de clôture (« Quedo a su disposición », « Ha sido un placer »).</p>`,
  exercises: [
    { type: "qcm", q: "Dans un entretien formel en Espagne, on s'adresse au recruteur avec :", opts: ["tú", "usted", "vosotros", "le prénom"], a: 1, exp: "L'entretien se déroule en usted (vouvoiement, registre soutenu)." },
    { type: "input", q: "Complète la méthode STAR : S = Situación, T = Tarea, A = Acción, R = ___.", a: ["Resultado", "resultado"], ph: "mot", exp: "STAR : Situación, Tarea, Acción, Resultado." },
    { type: "qcm", q: "Quelle partie du STAR faut-il le plus mettre en avant ?", opts: ["La situation", "L'action (ce que TOI tu as fait)", "Le contexte général", "Rien de précis"], a: 1, exp: "L'action personnelle (yo) et le résultat chiffré marquent le recruteur." },
    { type: "input", q: "Complète : « Me ___ el marketing digital. » (je suis passionné(e) par ; verbe apasionar)", a: ["apasiona"], ph: "verbe", exp: "Me apasiona = je suis passionné par (construction comme gustar)." },
    { type: "qcm", q: "« ¿Cuáles son sus puntos débiles? » demande :", opts: ["Vos qualités", "Vos défauts", "Vos horaires", "Votre salaire"], a: 1, exp: "Los puntos débiles = les points faibles / défauts." },
    { type: "vf", q: "Face à la question sur les défauts, il vaut mieux répondre « no tengo defectos ».", a: false, exp: "Faux : c'est arrogant. Cite un défaut mineur + comment tu t'améliores." },
    { type: "qcm", q: "« Se me da bien trabajar en equipo » signifie :", opts: ["Je déteste le travail d'équipe", "Je suis doué(e) pour le travail d'équipe", "Je dois travailler seul", "Je ne sais pas travailler"], a: 1, exp: "Se me da bien = je suis doué(e) pour / je réussis bien à." },
    { type: "input", q: "Complète la question classique : « ¿Dónde se ___ dentro de cinco años? » (verbe verse : verse)", a: ["ve"], ph: "verbe", exp: "¿Dónde se ve dentro de cinco años? = où vous voyez-vous dans cinq ans ?" },
    { type: "qcm", q: "« ¿Cuáles son sus pretensiones salariales? » porte sur :", opts: ["Vos horaires", "Vos attentes de salaire", "Vos diplômes", "Vos vacances"], a: 1, exp: "Las pretensiones salariales = les prétentions salariales." },
    { type: "input", q: "Complète une formule de clôture : « Quedo a su ___. » (je reste à votre disposition)", a: ["disposición"], ph: "mot", exp: "Quedo a su disposición = je reste à votre disposition." },
    { type: "vf", q: "Terminer une réponse STAR par un résultat chiffré renforce l'impact.", a: true, exp: "Vrai : « aumentamos las ventas un 35% » est concret et mémorable." },
    { type: "qcm", q: "Dans le dialogue, quel résultat la candidate met-elle en avant ?", opts: ["Une baisse des ventes de 20%", "Une hausse des ventes de 35% en trois mois", "Un licenciement", "Une formation"], a: 1, exp: "Conseguimos aumentar las ventas un 35% en tres meses (le R du STAR)." },
    { type: "qcm", q: "Pourquoi est-il bon que la candidate pose une question à la fin ?", opts: ["Pour gagner du temps", "Pour montrer son intérêt et son implication", "Pour changer de sujet", "Ce n'est pas conseillé"], a: 1, exp: "Poser une bonne question (jour typique, mesure du succès) montre l'intérêt et le sérieux." },
    { type: "qcm", q: "Compréhension : « Reconozco que a veces soy demasiado perfeccionista, pero estoy aprendiendo a delegar. » Cette réponse est habile parce qu'elle :", opts: ["Nie tout défaut", "Admet un défaut mineur et montre une progression", "Attaque le recruteur", "Change de sujet"], a: 1, exp: "Défaut mineur (perfectionnisme) + effort d'amélioration (déléguer) : réponse idéale." },
    { type: "qcm", q: "Compréhension : quelle formule ouvre poliment l'entretien du côté du candidat ?", opts: ["¡Hola, qué tal!", "Gracias por recibirme / por venir", "Venga, empecemos", "¿Cuánto pagan?"], a: 1, exp: "Gracias por recibirme = merci de me recevoir : ouverture polie et formelle." }
  ],
  final: {
    title: "Exercice final — Prepara tu entrevista",
    intro: `<p>Mets-toi en situation. Voici cinq questions d'un entretien réel. Pour chacune, choisis la meilleure stratégie de réponse :</p>
<pre class="pseudo">1. «Hábleme de usted.»
2. «¿Por qué quiere trabajar con nosotros?»
3. «Cuénteme una dificultad que haya superado.» (→ STAR)
4. «¿Cuál es su mayor defecto?»
5. «¿Tiene preguntas para nosotros?»</pre>`,
    questions: [
      { type: "qcm", q: "Question 1 « Hábleme de usted » : la meilleure réponse est :", opts: ["Toute votre vie personnelle en détail", "Un résumé pro concis : parcours, compétences, motivation", "Vos loisirs uniquement", "Vos prétentions salariales"], a: 1, exp: "On attend une présentation professionnelle synthétique, pas votre biographie privée." },
      { type: "qcm", q: "Question 2 : que doit montrer votre réponse ?", opts: ["Que vous cherchez n'importe quel emploi", "Que vous connaissez l'entreprise et ce que vous pouvez lui apporter", "Que vous voulez juste un salaire", "Que vous êtes pressé"], a: 1, exp: "Reliez vos compétences aux besoins/valeurs de CETTE entreprise." },
      { type: "input", q: "Question 3 : quelle méthode structure une bonne réponse à une difficulté surmontée ? (un mot)", a: ["STAR", "el método STAR", "star"], ph: "méthode", exp: "La méthode STAR : Situación, Tarea, Acción, Resultado." },
      { type: "qcm", q: "Question 4 « su mayor defecto » : la meilleure approche est :", opts: ["Dire qu'on n'a aucun défaut", "Citer un défaut mineur réel et l'effort pour progresser", "Citer un défaut grave", "Refuser de répondre"], a: 1, exp: "Un vrai défaut mineur + amélioration : honnête et rassurant." },
      { type: "vf", q: "Question 5 : poser une question pertinente à la fin est recommandé.", a: true, exp: "Vrai : cela démontre votre intérêt et votre préparation." }
    ],
    solution: `<p>Stratégies gagnantes pour chaque question :</p>
<pre class="pseudo">1. Hábleme de usted   → « pitch » pro de 60 s : quién soy,
   qué sé hacer, por qué encajo.
2. ¿Por qué nosotros? → conocer la empresa + qué aporto YO.
3. Una dificultad     → STAR : Situación → Tarea → Acción →
   Resultado (chiffré).
4. Mayor defecto      → defecto menor + cómo lo trabajo.
5. ¿Preguntas?        → sí : día típico, cómo miden el éxito,
   evolución posible. (Nunca «no tengo preguntas».)</pre>
<p>Un bon entretien, ce n'est pas improviser : c'est préparer des réponses structurées (STAR), montrer des résultats concrets, rester poli (usted) et manifester un vrai intérêt pour l'entreprise.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes réponses en espagnol…",
  items: [
  { id: "es-b2-j29", title: "Rédige TES réponses d'entretien", level: 3,
    statement: "Prépare TON entretien : rédige en espagnol tes réponses personnelles à quatre questions : (1) Hábleme de usted, (2) ¿Por qué quiere este puesto?, (3) Cuénteme una dificultad superada (méthode STAR), (4) ¿Cuál es su mayor defecto? Utilise le vouvoiement et les expressions du jour.",
    hints: [
      "Pour la difficulté, suis STAR : Situación, Tarea, Acción, Resultado (avec un résultat concret).",
      "Emploie les expressions : me apasiona, se me da bien, aporto…, considero que mi mayor logro es…",

    ],
    solution: "1. Hábleme de usted: Me llamo Laura y soy diseñadora gráfica con seis años de experiencia. Me apasiona crear identidades visuales y se me da bien trabajar en equipos multidisciplinares. He colaborado con varias agencias y ahora busco un proyecto más estable donde poder crecer.\n\n2. ¿Por qué quiere este puesto?: Me interesa este puesto porque su empresa es referente en diseño sostenible, un tema que me apasiona. Creo que puedo aportar mi experiencia en branding y mi capacidad para cumplir plazos ajustados.\n\n3. Una dificultad (STAR): En mi anterior trabajo, un cliente importante rechazó todo el proyecto a una semana de la entrega (Situación). Me encargaron rediseñarlo desde cero en muy poco tiempo (Tarea). Reuní al equipo, repartí las tareas y trabajé codo con codo con ellos día y noche (Acción). Al final entregamos a tiempo y el cliente quedó tan satisfecho que renovó el contrato (Resultado).\n\n4. ¿Cuál es su mayor defecto?: Reconozco que soy bastante exigente conmigo misma y a veces me cuesta delegar. Sin embargo, estoy aprendiendo a confiar más en mi equipo y a repartir mejor el trabajo.\n\nTraduction : 1. Parlez-moi de vous : Je m'appelle Laura, je suis graphiste avec six ans d'expérience. Je suis passionnée par la création d'identités visuelles et je suis douée pour le travail en équipes pluridisciplinaires. J'ai collaboré avec plusieurs agences et je cherche maintenant un projet plus stable où évoluer. — 2. Pourquoi ce poste : Ce poste m'intéresse car votre entreprise est une référence en design durable, un sujet qui me passionne. Je pense pouvoir apporter mon expérience en branding et ma capacité à respecter des délais serrés. — 3. Une difficulté (STAR) : Dans mon précédent emploi, un client important a rejeté tout le projet à une semaine de la livraison (Situation). On m'a chargée de le refaire de zéro en très peu de temps (Tâche). J'ai réuni l'équipe, réparti les tâches et travaillé avec eux jour et nuit (Action). Finalement, nous avons livré à temps et le client, très satisfait, a renouvelé le contrat (Résultat). — 4. Votre plus grand défaut : Je reconnais que je suis assez exigeante envers moi-même et que j'ai parfois du mal à déléguer. Cependant, j'apprends à faire davantage confiance à mon équipe et à mieux répartir le travail.",
    note: "Un entretien réussi se prépare par écrit avant de se jouer à l'oral. Structure la difficulté avec STAR, chiffre tes résultats, transforme ton défaut en piste d'amélioration, et garde le registre soutenu (usted). Relis à voix haute jusqu'à ce que ça sonne naturel." }
  ]
};
