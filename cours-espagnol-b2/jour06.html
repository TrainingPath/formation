<script>
var DAY = {
  num: 6,
  title: "Les périphrases verbales",
  subtitle: "Nuancer l'action avec les perífrasis : début, durée, répétition, obligation, imminence.",
  theory: `
<h3>1. Qu'est-ce qu'une périphrase verbale ?</h3>
<p>Une <strong>perífrasis verbal</strong> associe un verbe conjugué (auxiliaire, qui perd son sens propre) et une forme non personnelle : <strong>infinitif, gérondif ou participe</strong>. Elle ajoute une nuance d'aspect (début, durée, fin) ou de modalité (obligation, probabilité) que le verbe seul ne rend pas.</p>
<pre class="pseudo">Estructura : AUXILIAIRE + (nexo) + infinitif / gérondif / participe
Ejemplo :    Voy a comer.  (auxiliaire ir + a + infinitif = futur proche)</pre>
<h3>2. Périphrases d'infinitif</h3>
<pre class="pseudo">ir a + inf.        futur proche, intention   Voy a estudiar. (Je vais étudier.)
tener que + inf.   obligation forte          Tengo que salir. (Je dois sortir.)
haber que + inf.   obligation impersonnelle  Hay que trabajar. (Il faut travailler.)
deber + inf.       devoir (obligation)       Debes descansar. (Tu dois te reposer.)
deber de + inf.    probabilité               Debe de ser tarde. (Il doit être tard.)
volver a + inf.    répétition                Volví a llamar. (J'ai rappelé.)
acabar de + inf.   passé très récent         Acabo de llegar. (Je viens d'arriver.)
empezar/ponerse a  début d'action           Se puso a llover. (Il se mit à pleuvoir.)
estar a punto de   imminence                 Estoy a punto de terminar. (Je suis sur le point de finir.)
dejar de + inf.    cessation                 Dejé de fumar. (J'ai arrêté de fumer.)</pre>
<div class="warn">Distingue bien <em>deber</em> (obligation : « tu dois ») de <em>deber de</em> (probabilité : « il doit sûrement »). <em>Debes de conocerlo</em> = tu le connais probablement ; <em>Debes conocerlo</em> = tu es obligé de le connaître.</div>
<h3>3. Périphrases de gérondif (l'action en cours ou progressive)</h3>
<pre class="pseudo">estar + gér.       action en cours          Estoy leyendo. (Je suis en train de lire.)
seguir + gér.      continuité               Sigo estudiando. (Je continue d'étudier.)
llevar + gér.      durée accumulée          Llevo dos horas esperando. (J'attends depuis deux heures.)
ir + gér.          progression graduelle    Va mejorando poco a poco. (Il s'améliore peu à peu.)
andar + gér.       action habituelle/diffuse Anda diciendo tonterías. (Il raconte des bêtises.)</pre>
<div class="tip">La périphrase <em>llevar + gérondif</em> traduit élégamment le « depuis » français : <em>Llevo tres años viviendo aquí</em> (Ça fait trois ans que je vis ici / Je vis ici depuis trois ans). Notez qu'on n'emploie pas « desde » avec cette tournure.</div>
<h3>4. Périphrases de participe (résultat, accomplissement)</h3>
<pre class="pseudo">llevar + part.     bilan cumulé           Llevo escritas diez páginas. (J'ai déjà écrit dix pages.)
tener + part.      résultat accumulé      Tengo hechos los deberes. (J'ai fait mes devoirs — résultat.)
dejar + part.      état laissé            Dejó preparada la cena. (Il laissa le dîner préparé.)
quedar + part.     état résultant         La cuestión quedó resuelta. (La question fut résolue.)</pre>
<div class="warn">Avec les périphrases de participe (llevar, tener, dejar), le participe s'<strong>accorde</strong> en genre et en nombre avec l'objet : <em>Llevo escritas diez páginas</em> (escritas, féminin pluriel car páginas).</div>`,
  exercises: [
    { type: "qcm", q: "Que exprime la périphrase « ir a + infinitif » ?", opts: ["Une obligation", "Un futur proche / une intention", "Une répétition", "Une cessation"], a: 1, exp: "Voy a estudiar = je vais étudier (futur proche)." },
    { type: "input", q: "Traduis « je viens d'arriver » avec la périphrase adéquate : « ___ de llegar. » (yo)", a: ["acabo"], ph: "verbe", exp: "Acabar de + infinitif = passé très récent : acabo de llegar." },
    { type: "qcm", q: "Quelle périphrase exprime la répétition ?", opts: ["dejar de", "volver a", "estar a punto de", "acabar de"], a: 1, exp: "Volver a + infinitif = refaire : volví a llamar (j'ai rappelé)." },
    { type: "input", q: "Complète : « Llevo dos horas ___ (esperar). » (gérondif)", a: ["esperando"], ph: "gérondif", exp: "Llevar + gérondif exprime la durée : esperando." },
    { type: "vf", q: "« Deber de + infinitif » exprime la probabilité, pas l'obligation.", a: true, exp: "Vrai : Debe de ser tarde = il doit sûrement être tard (probabilité)." },
    { type: "qcm", q: "« Hay que trabajar » exprime :", opts: ["Une obligation personnelle", "Une obligation impersonnelle (il faut)", "Une probabilité", "Un futur proche"], a: 1, exp: "Haber que + infinitif = obligation impersonnelle : il faut travailler." },
    { type: "input", q: "Traduis « il se mit à pleuvoir » : « Se ___ a llover. » (ponerse, passé)", a: ["puso"], ph: "verbe", exp: "Ponerse a + infinitif = début brusque : se puso a llover." },
    { type: "qcm", q: "« Sigo estudiando español » signifie :", opts: ["J'ai arrêté d'étudier", "Je continue d'étudier", "Je vais étudier", "Je viens d'étudier"], a: 1, exp: "Seguir + gérondif = continuité : je continue d'étudier." },
    { type: "input", q: "Complète (durée) : « ___ tres años viviendo aquí. » (llevar, yo)", a: ["llevo"], ph: "verbe", exp: "Llevo tres años viviendo aquí = je vis ici depuis trois ans." },
    { type: "qcm", q: "Dans « Llevo escritas diez páginas », pourquoi « escritas » (et non escrito) ?", opts: ["C'est une faute", "Le participe s'accorde avec « páginas » (fém. plur.)", "C'est un gérondif", "Par euphonie"], a: 1, exp: "Périphrase de participe : accord en genre et nombre avec l'objet." },
    { type: "vf", q: "« Dejé de fumar » signifie « je continue de fumer ».", a: false, exp: "Faux : dejar de + infinitif = cesser : j'ai arrêté de fumer." },
    { type: "input", q: "Traduis « je suis sur le point de finir » : « Estoy a punto de ___ (terminar). »", a: ["terminar"], ph: "infinitif", exp: "Estar a punto de + infinitif = imminence." },
    { type: "qcm", q: "Compréhension : « Debes de conocerlo, es muy famoso. » Que veut dire le locuteur ?", opts: ["Tu es obligé de le connaître", "Tu le connais probablement", "Tu dois le rencontrer", "Tu ne le connais pas"], a: 1, exp: "Deber de = probabilité : tu le connais sans doute." },
    { type: "qcm", q: "Compréhension : « Va mejorando poco a poco. » Quelle nuance apporte « ir + gérondif » ?", opts: ["Une action terminée", "Une progression graduelle", "Une obligation", "Une imminence"], a: 1, exp: "Ir + gérondif = amélioration progressive, étape par étape." },
    { type: "vf", q: "« Tengo hechos los deberes » met l'accent sur le résultat accumulé (devoirs faits).", a: true, exp: "Vrai : tener + participe accordé souligne le résultat : hechos (masc. plur. avec deberes)." }
  ],
  final: {
    title: "Exercice final — La rutina de un escritor",
    intro: `<p>Un escritor describe su método de trabajo. Localiza las perífrasis verbales :</p>
<pre class="pseudo">Llevo veinte años escribiendo novelas y aún no me canso.
Cada mañana me pongo a trabajar en cuanto amanece.
Tengo que redactar al menos tres páginas antes de comer.
Cuando termino un capítulo, vuelvo a leerlo en voz alta.
A veces sigo corrigiendo el mismo párrafo durante horas.
Ahora mismo estoy acabando mi décimo libro.
Ya llevo escritas más de trescientas páginas.
Debe de ser la constancia lo que me mantiene en pie.
Nunca dejaré de contar historias mientras me quede aliento.</pre>`,
    questions: [
      { type: "qcm", q: "« Llevo veinte años escribiendo » expresa:", opts: ["Un futuro próximo", "Una duración acumulada (desde hace 20 años)", "Una obligación", "Una repetición"], a: 1, exp: "Llevar + gerundio = duración : escribe desde hace veinte años." },
      { type: "input", q: "« me ___ a trabajar en cuanto amanece » : verbe de PONERSE (yo, présent)", a: ["pongo"], ph: "verbe", exp: "Ponerse a + infinitif = début : me pongo a trabajar." },
      { type: "vf", q: "« vuelvo a leerlo » significa que lee el capítulo por segunda vez (repetición).", a: true, exp: "Verdadero : volver a + infinitivo = repetir la acción." },
      { type: "input", q: "« Ya llevo ___ más de trescientas páginas » : participe accordé d'ESCRIBIR", a: ["escritas"], ph: "participe", exp: "Llevar + participe : accord fém. plur. avec páginas → escritas." },
      { type: "qcm", q: "« Debe de ser la constancia… » ¿qué expresa « debe de »?", opts: ["Una obligación", "Una probabilidad / suposición", "Un futuro", "Una prohibición"], a: 1, exp: "Deber de + infinitivo = suposición : es probablemente la constancia." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Cela fait vingt ans que j'écris des romans et je ne m'en lasse toujours pas.
Chaque matin je me mets au travail dès qu'il fait jour.
Je dois rédiger au moins trois pages avant de déjeuner.
Quand je termine un chapitre, je le relis à voix haute.
Parfois je continue de corriger le même paragraphe pendant des heures.
En ce moment même je suis en train de finir mon dixième livre.
J'ai déjà écrit plus de trois cents pages.
Ce doit être la constance qui me maintient debout.
Jamais je ne cesserai de raconter des histoires tant qu'il me restera un souffle.</pre>
<p>Chaque périphrase colore l'action : <em>llevar + gérondif</em> (durée), <em>ponerse a</em> (début), <em>tener que</em> (obligation), <em>volver a</em> (répétition), <em>seguir + gérondif</em> (continuité), <em>estar + gérondif</em> (action en cours), <em>llevar + participe</em> (bilan), <em>deber de</em> (probabilité), <em>dejar de</em> (cessation). Elles sont indispensables pour écrire un espagnol vivant et précis.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b2-j06", title: "Décrire une routine avec des périphrases", level: 3,
    statement: "Décris ta journée ou une habitude en 8 à 10 phrases, en employant au moins six périphrases verbales différentes (ir a, tener que, ponerse a, volver a, seguir/estar/llevar + gérondif, acabar de, dejar de…). Varie les nuances : début, durée, obligation, répétition, cessation.",
    hints: [
      "Durée : Llevo dos horas estudiando.",
      "Obligation + futur proche : Tengo que salir, voy a comprar pan.",
      "Cessation / répétition : Dejé de ver la tele, pero volví a hacerlo."
    ],
    solution: "Cada mañana me pongo a trabajar en cuanto me despierto. Acabo de cambiar de horario, así que ahora empiezo más temprano. Tengo que responder muchos correos antes de las diez. Llevo tres años trabajando desde casa y me he acostumbrado por completo. A mediodía suelo dejar de mirar la pantalla y salgo a caminar. Por la tarde sigo avanzando en mis proyectos, aunque a veces vuelvo a distraerme con el móvil. Voy a intentar concentrarme mejor a partir de ahora. Estoy convencido de que, poco a poco, iré mejorando mis hábitos.\n\nTraduction : Chaque matin je me mets au travail dès que je me réveille. Je viens de changer d'horaire, donc maintenant je commence plus tôt. Je dois répondre à beaucoup de courriels avant dix heures. Cela fait trois ans que je travaille depuis chez moi et je m'y suis complètement habitué. À midi j'ai l'habitude d'arrêter de regarder l'écran et je sors marcher. L'après-midi je continue d'avancer dans mes projets, même si parfois je me remets à me distraire avec le téléphone. Je vais essayer de mieux me concentrer à partir de maintenant. Je suis convaincu que, peu à peu, je vais améliorer mes habitudes.",
    note: "Les périphrases sont l'un des marqueurs les plus nets d'un espagnol naturel et idiomatique. Un francophone tend à traduire mot à mot (« ça fait trois ans que ») alors que l'espagnol préfère une périphrase compacte (llevar + gérondif). Enrichir son répertoire de périphrases, c'est gagner en fluidité." }
  ]
};
</script>
