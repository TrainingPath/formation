<script>
var DAY = {
  num: 24,
  title: "Exprimer hypothèses et probabilités",
  subtitle: "Deviner, supposer, parier : dire ce qui est possible, probable ou improbable en espagnol.",
  theory: `
<h3>1. Le langage de la supposition</h3>
<p>Souvent, on ne SAIT pas : on <strong>suppose</strong>. « Il doit être malade », « il aura oublié », « peut-être qu'il viendra ». L'espagnol dispose d'outils précis pour exprimer ces degrés de certitude : du presque sûr au très douteux.</p>
<h3>2. Deviner avec le futur et le conditionnel</h3>
<p>Astuce typiquement espagnole : le <strong>futuro</strong> sert à supposer sur le PRÉSENT, et le <strong>condicional</strong> à supposer sur le PASSÉ.</p>
<pre class="pseudo">Serán las diez.            Il doit être dix heures (maintenant).
Estará durmiendo.          Il est probablement en train de dormir.
Tendrá unos cuarenta años. Il doit avoir la quarantaine.
Serían las diez cuando llegó. Il devait être dix heures quand il est arrivé.
Estaría cansado, por eso   Il devait être fatigué, c'est pour ça
 no vino.                    qu'il n'est pas venu.</pre>
<div class="tip">Comparaison : « Son las diez » = j'affirme (il est dix heures). « Serán las diez » = je suppose (il doit être dix heures). Le futur, ici, ne parle pas de l'avenir : il exprime la conjecture sur le présent.</div>
<h3>3. Les adverbes et locutions de probabilité</h3>
<pre class="pseudo">quizá(s) / tal vez / acaso  peut-être (+ subjonctif souvent)
probablemente               probablement
seguramente                 sûrement / probablement
a lo mejor                  peut-être (+ indicatif !)
puede que…                  il se peut que… (+ subjonctif)
es probable que…            il est probable que… (+ subjonctif)
lo más seguro es que…       le plus sûr est que… (+ subjonctif)</pre>
<div class="warn">Point de grammaire clé : <strong>a lo mejor</strong> se construit avec l'INDICATIF (A lo mejor viene = il vient peut-être), alors que <strong>quizá, tal vez, puede que, es probable que</strong> demandent le plus souvent le SUBJONCTIF (Quizá venga, Puede que venga). Ne les confonds pas !</div>
<h3>4. Verbes et périphrases de conjecture</h3>
<pre class="pseudo">deber de + infinitivo    Debe de estar enfermo = il doit être malade.
tener que + infinitivo   Tiene que ser una broma = ça doit être une blague.
me imagino que…          j'imagine que…
supongo que…             je suppose que…
no creo que… (+ subj.)   je ne crois pas que…</pre>
<div class="warn">Ne confonds pas <em>deber</em> et <em>deber de</em> : <strong>deber + inf.</strong> = obligation (Debo estudiar = je dois étudier) ; <strong>deber de + inf.</strong> = probabilité (Debe de estar en casa = il doit être chez lui). À l'oral, on entend souvent « debe estar » pour la probabilité, mais la forme soignée est « debe de estar ».</div>
<h3>5. Échelle de certitude</h3>
<pre class="pseudo">Seguro que viene.           quasi certain (+ indicatif)
Probablemente venga.        probable
Puede que venga.            possible (+ subjonctif)
Quizá venga.                incertain (+ subjonctif)
Dudo que venga.             improbable (+ subjonctif)</pre>`,
  exercises: [
    { type: "qcm", q: "« Serán las diez » (avec le futur) exprime :", opts: ["Une certitude sur l'avenir", "Une supposition sur le présent (il doit être 10h)", "Un ordre", "Une habitude"], a: 1, exp: "Le futur de conjecture suppose sur le présent : il doit être dix heures." },
    { type: "qcm", q: "Pour supposer sur le PASSÉ, on emploie :", opts: ["le présent", "le conditionnel (serían las diez)", "l'impératif", "le gérondif"], a: 1, exp: "Le conditionnel exprime la conjecture sur le passé : il devait être dix heures." },
    { type: "input", q: "Complète avec « a lo mejor » + indicatif : « A lo mejor ___ mañana. » (venir, él : présent indicatif)", a: ["viene"], ph: "verbe", exp: "A lo mejor se construit avec l'INDICATIF : a lo mejor viene." },
    { type: "qcm", q: "Quelle construction demande le SUBJONCTIF ?", opts: ["a lo mejor", "seguro que", "puede que", "seguramente"], a: 2, exp: "Puede que + subjonctif (puede que venga). A lo mejor et seguro que → indicatif." },
    { type: "input", q: "Complète : « Quizá ___ razón. » (avoir, él : subjonctif présent de tener)", a: ["tenga"], ph: "verbe", exp: "Quizá + subjonctif : quizá tenga razón." },
    { type: "vf", q: "« Deber de + infinitif » exprime une probabilité, pas une obligation.", a: true, exp: "Vrai : Debe de estar enfermo = il doit (probablement) être malade." },
    { type: "qcm", q: "« Debo estudiar » signifie :", opts: ["Je dois (probablement) étudier", "Je dois étudier (obligation)", "J'ai étudié", "J'étudierais"], a: 1, exp: "Deber + inf. (sans « de ») = obligation : je dois étudier." },
    { type: "input", q: "Complète : « ___ que estar de broma. » (ça doit être une blague ; tener, ello : présent)", a: ["Tiene"], ph: "verbe", exp: "Tiene que ser una broma = ça doit être une blague (forte probabilité)." },
    { type: "qcm", q: "Classe du plus certain au moins certain : « Seguro que viene / Puede que venga / Dudo que venga ». Lequel est le PLUS certain ?", opts: ["Dudo que venga", "Puede que venga", "Seguro que viene", "Les trois sont égaux"], a: 2, exp: "Seguro que viene = quasi certain ; dudo que venga = très improbable." },
    { type: "input", q: "Complète : « Estará ___ » (il est probablement en train de dormir ; gérondif de dormir).", a: ["durmiendo"], ph: "gérondif", exp: "Estará durmiendo = il doit être en train de dormir (conjecture présente)." },
    { type: "vf", q: "« Es probable que » se construit avec le subjonctif.", a: true, exp: "Vrai : es probable que venga (subjonctif)." },
    { type: "qcm", q: "« Estaría cansado, por eso no vino » exprime :", opts: ["Une certitude présente", "Une supposition sur le passé (il devait être fatigué)", "Un futur", "Un ordre"], a: 1, exp: "Conditionnel de conjecture sur le passé : il devait être fatigué." },
    { type: "input", q: "Complète : « Supongo que ya ___ terminado. » (haber, él : présent → temps composé de probabilité)", a: ["ha", "habrá"], ph: "verbe", exp: "Supongo que ya ha terminado, ou avec conjecture : ya habrá terminado." },
    { type: "qcm", q: "Compréhension : « Tendrá unos cuarenta años. » Que veut dire le locuteur ?", opts: ["Il aura quarante ans l'an prochain", "Il doit avoir environ quarante ans (supposition)", "Il a exactement quarante ans", "Il a eu quarante ans"], a: 1, exp: "Futur de conjecture : il doit avoir la quarantaine (estimation)." },
    { type: "qcm", q: "Compréhension : « No creo que sea verdad. » Le locuteur pense que c'est :", opts: ["Certainement vrai", "Probablement faux (il en doute)", "Sans importance", "Une question"], a: 1, exp: "No creo que + subjonctif = doute : il ne pense pas que ce soit vrai." }
  ],
  final: {
    title: "Exercice final — ¿Dónde estará Marta?",
    intro: `<p>Marta n'est pas venue au rendez-vous. Ses amis font des suppositions. Repère le degré de certitude de chacune :</p>
<pre class="pseudo">— No contesta al teléfono. Estará sin batería.
— O a lo mejor se ha quedado dormida.
— Puede que haya perdido el autobús.
— Serán ya las nueve, ¿no? Llega tardísimo.
— Yo creo que no viene. Dudo que aparezca ya.</pre>`,
    questions: [
      { type: "qcm", q: "« Estará sin batería » signifie :", opts: ["Elle est sûrement sans batterie (supposition)", "Elle sera sans batterie demain", "Elle n'a jamais de batterie", "Sa batterie est neuve"], a: 0, exp: "Futur de conjecture : elle doit être à court de batterie." },
      { type: "qcm", q: "Dans « a lo mejor se ha quedado dormida », quel mode est utilisé ?", opts: ["Le subjonctif", "L'indicatif (se ha quedado)", "L'impératif", "Le conditionnel"], a: 1, exp: "A lo mejor + INDICATIF : se ha quedado dormida." },
      { type: "input", q: "Dans « Puede que haya perdido el autobús », le verbe « haya » est au : ___ (mode).", a: ["subjuntivo", "subjonctif"], ph: "mode", exp: "Puede que + subjonctif : haya perdido (subjonctif passé)." },
      { type: "qcm", q: "« Serán ya las nueve » veut dire :", opts: ["Il est exactement neuf heures", "Il doit déjà être neuf heures (supposition)", "Il sera neuf heures", "Il était neuf heures"], a: 1, exp: "Futur de conjecture sur l'heure présente : il doit être neuf heures." },
      { type: "vf", q: "« Dudo que aparezca ya » exprime que le locuteur pense qu'elle ne viendra probablement plus.", a: true, exp: "Dudar que + subjonctif = forte improbabilité : je doute qu'elle vienne encore." }
    ],
    solution: `<p>Analyse des degrés de certitude :</p>
<pre class="pseudo">«Estará sin batería»          → futur de conjecture (présent) : probable.
«A lo mejor se ha quedado…»   → a lo mejor + INDICATIF : possible.
«Puede que haya perdido…»     → puede que + SUBJONCTIF : possible.
«Serán ya las nueve»          → futur de conjecture sur l'heure.
«Dudo que aparezca»           → dudar + SUBJONCTIF : improbable.</pre>
<p>Retiens la double règle : le <strong>futur/conditionnel</strong> devine (présent/passé) ; les tournures de possibilité (<em>puede que, quizá, es probable que, dudo que</em>) déclenchent le <strong>subjonctif</strong>, sauf <em>a lo mejor</em> et <em>seguro que</em> qui gardent l'indicatif.</p>`
  }
};
</script>
