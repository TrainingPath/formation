<script>
var DAY = {
  num: 8,
  title: "Les modaux au passé (debería haber...)",
  subtitle: "Exprimer le reproche, le regret et la probabilité passée avec les verbes modaux composés.",
  theory: `
<h3>1. Les modaux et leurs nuances</h3>
<p>Les verbes <strong>modaux</strong> (poder, deber, tener que, saber…) expriment la possibilité, l'obligation ou la capacité. Au passé, combinés avec un infinitif composé (<em>haber + participe</em>), ils permettent de formuler des <strong>regrets, des reproches et des hypothèses rétrospectives</strong>. C'est un registre indispensable pour nuancer un discours au B2.</p>
<pre class="pseudo">Structure du reproche/regret : MODAL au conditionnel + HABER + participe
Ejemplo :  Deberías haber estudiado. (Tu aurais dû étudier.)</pre>
<h3>2. Le reproche : deber (conditionnel) + haber + participe</h3>
<p><em>Deber</em> au conditionnel suivi de l'infinitif passé exprime le reproche ou le regret : « j'aurais dû, tu aurais dû ». On trouve deux formes équivalentes : <em>debería haber</em> et <em>debería de haber</em> ; la forme sans « de » est préférée pour le reproche.</p>
<pre class="pseudo">Debería haber llamado antes.        (J'aurais dû appeler plus tôt.)
No deberías haber dicho eso.        (Tu n'aurais pas dû dire cela.)
Deberíamos haber salido temprano.   (Nous aurions dû partir tôt.)</pre>
<div class="tip">Variante fréquente à l'oral : <em>tenía que haber + participe</em> ou <em>tendría que haber + participe</em>, de sens très proche : <em>Tenía que haber avisado</em> (J'aurais dû prévenir).</div>
<h3>3. L'occasion manquée : poder (conditionnel) + haber + participe</h3>
<p><em>Podría haber + participe</em> exprime une possibilité passée non réalisée : « j'aurais pu ». Il souligne l'occasion perdue, souvent avec une nuance de reproche adouci.</p>
<pre class="pseudo">Podrías haberme ayudado.        (Tu aurais pu m'aider.)
Podría haber sido peor.         (Cela aurait pu être pire.)
Pudiste haberlo evitado.        (Tu aurais pu l'éviter.)</pre>
<h3>4. La probabilité passée : deber de / poder + haber + participe</h3>
<p>Pour formuler une <strong>hypothèse sur le passé</strong> (« il a dû, il a sans doute »), on emploie <em>deber de haber + participe</em> ou <em>debe de haber + participe</em>, ainsi que le futur antérieur et le conditionnel composé à valeur de conjecture.</p>
<pre class="pseudo">Debe de haber salido.           (Il a dû sortir. / Il est sans doute sorti.)
Debió de perder el tren.        (Il a dû rater le train.)
Habría unas cien personas.      (Il devait y avoir une centaine de personnes.)
Serían las diez cuando llegó.   (Il devait être dix heures quand il arriva.)</pre>
<div class="warn">Ne confonds pas le reproche et la probabilité : <em>Debería haber comido</em> = j'aurais dû manger (regret) ; <em>Debe de haber comido</em> = il a probablement mangé (conjecture). Le premier utilise le conditionnel, le second le présent + « de ».</div>
<h3>5. Récapitulatif des valeurs rétrospectives</h3>
<pre class="pseudo">Forme                       Valeur                    Exemple traduit
debería haber + part.       reproche/regret           Aurais dû
podría haber + part.        occasion manquée          Aurais pu
debe de haber + part.       probabilité passée        A sans doute
tendría que haber + part.   obligation non remplie    Aurait fallu que
querría/hubiera querido      souhait non réalisé       Aurais voulu</pre>
<div class="tip">Le subjonctif plus-que-parfait peut aussi exprimer le regret : <em>Ojalá hubiera estudiado</em> (Si seulement j'avais étudié). C'est une variante très expressive du reproche adressé à soi-même.</div>`,
  exercises: [
    { type: "qcm", q: "Comment exprime-t-on le reproche « tu aurais dû étudier » ?", opts: ["Debes estudiar", "Deberías haber estudiado", "Debiste estudiar", "Estudiarás"], a: 1, exp: "Conditionnel de deber + haber + participe : deberías haber estudiado." },
    { type: "input", q: "Complète (regret) : « ___ haber llamado antes. » (deber, yo, conditionnel)", a: ["debería"], ph: "modal", exp: "Debería haber llamado = j'aurais dû appeler." },
    { type: "qcm", q: "« Podrías haberme ayudado » exprime :", opts: ["Une obligation présente", "Une possibilité passée non réalisée (tu aurais pu)", "Une probabilité", "Un ordre"], a: 1, exp: "Poder au conditionnel + infinitif passé = occasion manquée." },
    { type: "input", q: "Complète (probabilité passée) : « Debe ___ haber salido, no contesta. » (particule)", a: ["de"], ph: "particule", exp: "Deber DE haber + participe = probabilité : il a sans doute sorti." },
    { type: "vf", q: "« Debería haber comido » exprime un reproche/regret, pas une probabilité.", a: true, exp: "Vrai : conditionnel de deber = regret (j'aurais dû manger)." },
    { type: "qcm", q: "Quelle phrase exprime une PROBABILITÉ sur le passé ?", opts: ["Deberías haber venido", "Debe de haber llovido, el suelo está mojado", "Tendrías que haber estudiado", "Podrías haber ganado"], a: 1, exp: "Debe de haber + participe = conjecture : il a sans doute plu." },
    { type: "input", q: "Complète (occasion manquée) : « ___ haber sido peor. » (poder, conditionnel, 3e sing.)", a: ["podría"], ph: "modal", exp: "Podría haber sido peor = cela aurait pu être pire." },
    { type: "qcm", q: "« No deberías haber dicho eso » signifie :", opts: ["Tu dois dire cela", "Tu n'aurais pas dû dire cela", "Tu vas dire cela", "Tu ne diras pas cela"], a: 1, exp: "Reproche négatif : tu n'aurais pas dû." },
    { type: "input", q: "Complète (souhait/regret) : « Ojalá ___ estudiado más. » (haber, subj. imparfait, yo)", a: ["hubiera", "hubiese"], ph: "auxiliaire", exp: "Ojalá hubiera estudiado = si seulement j'avais étudié." },
    { type: "qcm", q: "« Serían las diez cuando llegó. » Quelle nuance apporte le conditionnel ?", opts: ["Une certitude", "Une conjecture (il devait être environ dix heures)", "Un futur", "Un ordre"], a: 1, exp: "Le conditionnel exprime une probabilité passée approximative." },
    { type: "vf", q: "« Debió de perder el tren » exprime une conjecture sur le passé.", a: true, exp: "Vrai : debió de + infinitif = il a dû (probablement) rater le train." },
    { type: "input", q: "Complète (obligation non remplie) : « Tendrías que ___ avisado. » (haber)", a: ["haber"], ph: "verbe", exp: "Tendrías que haber avisado = tu aurais dû prévenir." },
    { type: "qcm", q: "Compréhension : « Podría haber ido, pero preferí quedarme. » Cette personne est-elle allée ?", opts: ["Oui", "Non, elle a préféré rester", "Elle ira", "On ne sait pas"], a: 1, exp: "Podría haber ido = possibilité non réalisée : elle n'y est pas allée." },
    { type: "qcm", q: "Compréhension : « Habría unas cien personas en la sala. » Que veut dire le locuteur ?", opts: ["Il y avait exactement cent personnes", "Il devait y avoir environ cent personnes (estimation)", "Il y aura cent personnes", "Il n'y avait personne"], a: 1, exp: "Conditionnel de conjecture : estimation approximative du passé." },
    { type: "vf", q: "« Deberías haber venido » et « Debes venir » ont le même sens.", a: false, exp: "Faux : le premier est un reproche sur le passé (tu aurais dû venir), le second une obligation présente (tu dois venir)." }
  ],
  final: {
    title: "Exercice final — Después del examen",
    intro: `<p>Un estudiante reflexiona tras un examen que salió mal. Fíjate en los modales del pasado :</p>
<pre class="pseudo">Debería haber empezado a estudiar mucho antes.
No tendría que haber dejado todo para el último día.
Podría haber pedido ayuda a mis compañeros, pero me dio vergüenza.
El profesor debió de notar que no había preparado bien el tema.
Ojalá hubiera repasado los ejercicios una vez más.
Serían las tres de la madrugada cuando por fin me dormí.
Habría unas veinte preguntas y apenas contesté la mitad.
La próxima vez debería organizarme mejor: la lección está aprendida.</pre>`,
    questions: [
      { type: "input", q: "« ___ haber empezado a estudiar antes » : deber au conditionnel (yo)", a: ["debería"], ph: "modal", exp: "Debería haber empezado = j'aurais dû commencer." },
      { type: "qcm", q: "« El profesor debió de notar… » ¿qué expresa « debió de »?", opts: ["Una orden", "Una probabilidad sobre el pasado", "Un reproche al profesor", "Un futuro"], a: 1, exp: "Debió de + infinitivo = conjetura : el profesor probablemente lo notó." },
      { type: "vf", q: "« Ojalá hubiera repasado los ejercicios » expresa un lamento (algo que no se hizo).", a: true, exp: "Verdadero : ojalá + pluscuamperfecto de subjuntivo = lamento retrospectivo." },
      { type: "input", q: "« Podría ___ pedido ayuda » : infinitif de HABER dans la périphrase modale", a: ["haber"], ph: "verbe", exp: "Podría haber pedido = j'aurais pu demander." },
      { type: "qcm", q: "« Habría unas veinte preguntas » usa el condicional para:", opts: ["Dar una orden", "Expresar una estimación aproximada del pasado", "Hablar del futuro", "Expresar una obligación"], a: 1, exp: "Condicional de conjetura : había probablemente unas veinte preguntas." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">J'aurais dû commencer à étudier bien plus tôt.
Je n'aurais pas dû tout laisser pour le dernier jour.
J'aurais pu demander de l'aide à mes camarades, mais j'ai eu honte.
Le professeur a dû remarquer que je n'avais pas bien préparé le sujet.
Si seulement j'avais révisé les exercices une fois de plus.
Il devait être trois heures du matin quand je me suis enfin endormi.
Il devait y avoir une vingtaine de questions et j'en ai à peine répondu la moitié.
La prochaine fois je devrais mieux m'organiser : la leçon est retenue.</pre>
<p>Distingue bien les deux grandes valeurs : le <strong>reproche/regret</strong> (debería/tendría que/podría haber + participe, ojalá hubiera + participe) et la <strong>conjecture</strong> sur le passé (debió de, debe de haber, conditionnel et futur antérieur de probabilité). Ces tournures donnent au discours toute sa finesse rétrospective.</p>`
  }
};
</script>

    hints: [
      "Regret : Debería haber escuchado sus consejos.",
      "Occasion manquée : Podría haber reaccionado de otra forma.",

    ],
    solution: "Mirando atrás, reconozco que cometí varios errores aquel día. Debería haber escuchado los consejos de mi amiga en lugar de ignorarlos. No tendría que haber respondido con tanta dureza en aquella discusión. Podría haber pedido perdón a tiempo, pero mi orgullo me lo impidió. Ella debió de sentirse muy dolida, aunque no me lo dijo. Ojalá hubiera sabido entonces lo importante que era esa amistad. Habría bastado una llamada para arreglarlo todo. La próxima vez actuaré con más calma: al menos, de este error he aprendido algo.\n\nTraduction : Avec le recul, je reconnais que j'ai commis plusieurs erreurs ce jour-là. J'aurais dû écouter les conseils de mon amie au lieu de les ignorer. Je n'aurais pas dû répondre avec autant de dureté dans cette dispute. J'aurais pu demander pardon à temps, mais mon orgueil m'en a empêché. Elle a dû se sentir très blessée, même si elle ne me l'a pas dit. Si seulement j'avais su alors combien cette amitié était importante. Il aurait suffi d'un appel pour tout arranger. La prochaine fois j'agirai avec plus de calme : au moins, de cette erreur j'ai appris quelque chose.",

  ]
};
