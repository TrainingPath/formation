  dialogues: [
    {
      num: "1",
      titre: "La entrevista de trabajo",
      perso: "Marina Delcourt (candidata francófona) y Rafael Ibáñez (director de Recursos Humanos)",
      lignes: [
        { qui: "Rafael", txt: "Buenos días, señora Delcourt. Siéntese, por favor. Antes de nada, me gustaría que me contara qué la llevó a solicitar este puesto.", fr: "Bonjour, madame Delcourt. Asseyez-vous, je vous en prie. Avant tout, j'aimerais que vous me racontiez ce qui vous a amenée à postuler à ce poste." },
        { qui: "Marina", txt: "Llevo seis años trabajando en el sector logístico y he llegado a un punto en el que necesito un reto de mayor envergadura. Su empresa me parece el lugar idóneo.", fr: "Cela fait six ans que je travaille dans le secteur logistique et je suis arrivée à un point où j'ai besoin d'un défi de plus grande envergure. Votre entreprise me semble l'endroit idéal." },
        { qui: "Rafael", txt: "Entiendo. Si le ofreciéramos el puesto, ¿estaría dispuesta a trasladarse a Valencia de forma permanente?", fr: "Je comprends. Si nous vous proposions le poste, seriez-vous disposée à déménager à Valence de façon permanente ?" },
        { qui: "Marina", txt: "Sin ningún inconveniente. De hecho, ya lo había contemplado antes de enviar la candidatura, aunque reconozco que supondría un cambio importante.", fr: "Sans aucun inconvénient. En fait, je l'avais déjà envisagé avant d'envoyer ma candidature, même si je reconnais que cela représenterait un changement important." },
        { qui: "Rafael", txt: "Hábleme de un conflicto profesional que haya tenido que gestionar. No busco un relato heroico, sino saber cómo reacciona usted bajo presión.", fr: "Parlez-moi d'un conflit professionnel que vous avez eu à gérer. Je ne cherche pas un récit héroïque, mais à savoir comment vous réagissez sous pression." },
        { qui: "Marina", txt: "Hace dos años, un proveedor nos dejó plantados a tres días de una entrega crítica. En lugar de buscar culpables, reuní al equipo y repartimos el pedido entre cuatro proveedores locales.", fr: "Il y a deux ans, un fournisseur nous a laissés tomber à trois jours d'une livraison critique. Au lieu de chercher des coupables, j'ai réuni l'équipe et nous avons réparti la commande entre quatre fournisseurs locaux." },
        { qui: "Rafael", txt: "¿Y qué haría de otra manera si volviera a ocurrir?", fr: "Et que feriez-vous autrement si cela se reproduisait ?" },
        { qui: "Marina", txt: "Debería haber avisado antes a la dirección. Lo resolvimos, sí, pero me guardé el problema demasiado tiempo por orgullo, y eso fue un error.", fr: "J'aurais dû prévenir la direction plus tôt. Nous l'avons résolu, certes, mais j'ai gardé le problème pour moi trop longtemps par orgueil, et cela a été une erreur." },
        { qui: "Rafael", txt: "Aprecio la franqueza. Le advierto que aquí el ritmo es exigente: no es raro que los proyectos se solapen y que haya que priorizar sobre la marcha.", fr: "J'apprécie la franchise. Je vous préviens qu'ici le rythme est exigeant : il n'est pas rare que les projets se chevauchent et qu'il faille établir des priorités au fur et à mesure." },
        { qui: "Marina", txt: "Es precisamente lo que echo en falta en mi puesto actual. Ahora bien, quisiera saber con qué margen de autonomía contaría.", fr: "C'est précisément ce qui me manque dans mon poste actuel. Cela dit, j'aimerais savoir de quelle marge d'autonomie je disposerais." },
        { qui: "Rafael", txt: "Amplia, siempre que los resultados acompañen. No le pediremos que consulte cada decisión, sino que rinda cuentas cada trimestre.", fr: "Large, pourvu que les résultats suivent. Nous ne vous demanderons pas de consulter pour chaque décision, mais de rendre des comptes chaque trimestre." },
        { qui: "Marina", txt: "Me parece razonable. Le agradezco la claridad; no siempre se habla con tanta transparencia en una primera entrevista.", fr: "Cela me paraît raisonnable. Je vous remercie de votre clarté ; on ne parle pas toujours avec autant de transparence lors d'un premier entretien." }
      ]
    },
    {
      num: "2",
      titre: "Defender un proyecto en la reunión",
      perso: "Marina, Rafael y Clara Ortuño (directora financiera)",
      lignes: [
        { qui: "Marina", txt: "Antes de entrar en cifras, permítanme resumir la idea: se trata de digitalizar el seguimiento de pedidos para que el cliente sepa en todo momento dónde está su mercancía.", fr: "Avant d'entrer dans les chiffres, permettez-moi de résumer l'idée : il s'agit de numériser le suivi des commandes pour que le client sache à tout moment où se trouve sa marchandise." },
        { qui: "Clara", txt: "Suena bien sobre el papel. No obstante, la inversión inicial ronda los ochenta mil euros. ¿Cómo justifica semejante desembolso?", fr: "Cela sonne bien sur le papier. Néanmoins, l'investissement initial avoisine les quatre-vingt mille euros. Comment justifiez-vous une telle dépense ?" },
        { qui: "Marina", txt: "Por un lado, reduciríamos en un treinta por ciento las llamadas de reclamación; por otro, evitaríamos las penalizaciones por retraso, que el año pasado ascendieron a cuarenta mil.", fr: "D'une part, nous réduirions de trente pour cent les appels de réclamation ; d'autre part, nous éviterions les pénalités de retard, qui l'an dernier se sont élevées à quarante mille." },
        { qui: "Rafael", txt: "Es un argumento sólido, aunque me temo que el equipo comercial se resista. Llevan años trabajando con hojas de cálculo.", fr: "C'est un argument solide, même si je crains que l'équipe commerciale ne résiste. Cela fait des années qu'ils travaillent avec des tableurs." },
        { qui: "Marina", txt: "Cuento con ello. Por eso propongo una fase piloto de tres meses con dos delegaciones, sin que nadie tenga que abandonar sus herramientas actuales de golpe.", fr: "Je m'y attends. C'est pourquoi je propose une phase pilote de trois mois avec deux agences, sans que personne n'ait à abandonner ses outils actuels d'un coup." },
        { qui: "Clara", txt: "¿Y si el piloto fracasara? Necesito saber qué haríamos con el dinero ya comprometido.", fr: "Et si le pilote échouait ? J'ai besoin de savoir ce que nous ferions de l'argent déjà engagé." },
        { qui: "Marina", txt: "La licencia es anual y rescindible. Si al cabo de tres meses los indicadores no mejoraran, perderíamos unos doce mil euros, no ochenta.", fr: "La licence est annuelle et résiliable. Si au bout de trois mois les indicateurs ne s'amélioraient pas, nous perdrions environ douze mille euros, pas quatre-vingt." },
        { qui: "Rafael", txt: "Ahí está el matiz que faltaba. Fue entonces cuando el proyecto empezó a parecerme viable, sinceramente.", fr: "Voilà la nuance qui manquait. C'est alors que le projet a commencé à me sembler viable, sincèrement." },
        { qui: "Clara", txt: "Sigo teniendo reservas, pero admito que el riesgo está acotado. ¿Quién se encargaría de formar al personal?", fr: "J'ai toujours des réserves, mais j'admets que le risque est circonscrit. Qui se chargerait de former le personnel ?" },
        { qui: "Marina", txt: "El proveedor incluye veinte horas de formación. A partir de ahí, me comprometo a acompañar yo misma a los equipos durante el primer mes.", fr: "Le fournisseur inclut vingt heures de formation. À partir de là, je m'engage à accompagner moi-même les équipes pendant le premier mois." },
        { qui: "Clara", txt: "Por consiguiente, no habría coste oculto de consultoría. Eso cambia bastante las cosas.", fr: "Par conséquent, il n'y aurait pas de coût caché de conseil. Cela change pas mal les choses." },
        { qui: "Rafael", txt: "Propongo que lo sometamos a votación en el comité del jueves. Marina, prepare una nota de dos páginas, ni una más.", fr: "Je propose que nous le soumettions au vote au comité de jeudi. Marina, préparez une note de deux pages, pas une de plus." }
      ]
    },
    {
      num: "3",
      titre: "Una negociación delicada",
      perso: "Marina y Damián Rueda (proveedor informático)",

        { qui: "Damián", txt: "Marina, he revisado su petición y, con toda franqueza, lo que nos piden no encaja en el presupuesto que firmamos.", fr: "Marina, j'ai examiné votre demande et, en toute franchise, ce que vous nous demandez n'entre pas dans le budget que nous avons signé." },
        { qui: "Marina", txt: "Le entiendo perfectamente, y no pretendo que asuman ustedes un sobrecoste. Ahora bien, el módulo de alertas figuraba en la propuesta inicial.", fr: "Je vous comprends parfaitement, et je ne prétends pas que vous assumiez un surcoût. Cela dit, le module d'alertes figurait dans la proposition initiale." },
        { qui: "Damián", txt: "Figuraba como opción, no como entregable. Si lo hubiéramos incluido, el precio habría subido un quince por ciento.", fr: "Il y figurait comme option, pas comme livrable. Si nous l'avions inclus, le prix aurait augmenté de quinze pour cent." },
        { qui: "Marina", txt: "Es posible que hubiera un malentendido por ambas partes. En lugar de discutir quién tiene razón, ¿por qué no buscamos una salida intermedia?", fr: "Il est possible qu'il y ait eu un malentendu des deux côtés. Au lieu de discuter de qui a raison, pourquoi ne cherchons-nous pas une issue intermédiaire ?" },
        { qui: "Damián", txt: "Le escucho, aunque le adelanto que no puedo bajar más el precio sin que mi dirección ponga el grito en el cielo.", fr: "Je vous écoute, même si je vous préviens que je ne peux pas baisser davantage le prix sans que ma direction ne pousse les hauts cris." },
        { qui: "Marina", txt: "No le pido un descuento. Le propongo que nos entreguen el módulo ahora y que nosotros lo paguemos en la renovación del año que viene.", fr: "Je ne vous demande pas de remise. Je vous propose que vous nous livriez le module maintenant et que nous le payions au renouvellement de l'an prochain." },
        { qui: "Damián", txt: "Es decir, un aplazamiento. Tendría que consultarlo, pero a menos que haya algún obstáculo contable, no lo veo descabellado.", fr: "C'est-à-dire un report. Il faudrait que je le consulte, mais à moins qu'il n'y ait un obstacle comptable, je ne trouve pas cela farfelu." },
        { qui: "Marina", txt: "Y por nuestra parte, nos comprometeríamos a firmar dos años en vez de uno. Ustedes ganan estabilidad y nosotros ganamos tiempo.", fr: "Et de notre côté, nous nous engagerions à signer deux ans au lieu d'un. Vous gagnez en stabilité et nous gagnons du temps." },
        { qui: "Damián", txt: "Reconozco que así la cosa cambia. Debería haberme planteado esa fórmula antes, en vez de ponerme a la defensiva.", fr: "Je reconnais qu'ainsi la chose change. J'aurais dû envisager cette formule plus tôt, au lieu de me mettre sur la défensive." },
        { qui: "Marina", txt: "No hay nada que reprochar; estas conversaciones sirven precisamente para eso. ¿Le parece bien que le envíe un correo con los puntos acordados?", fr: "Il n'y a rien à reprocher ; ces conversations servent précisément à cela. Cela vous convient-il que je vous envoie un courriel avec les points convenus ?" },
        { qui: "Damián", txt: "Perfecto. Y disculpe el tono del principio: acabo de salir de otra reunión bastante tensa.", fr: "Parfait. Et excusez le ton du début : je viens de sortir d'une autre réunion assez tendue." },
        { qui: "Marina", txt: "No se preocupe en absoluto. Volvamos a hablar el viernes, cuando ambos tengamos las cifras delante.", fr: "Ne vous inquiétez pas du tout. Reparlons-en vendredi, quand nous aurons tous les deux les chiffres sous les yeux." }
      ]
    }

        { type: "vf", q: "Marina admite que debería haber avisado antes a la dirección.", a: true, exp: "Vrai. DEBERÍA HABER + participe est le modal du regret au passé : « j'aurais dû ». Avec DEBÍA HABER, la nuance serait plus factuelle et moins auto-critique." },
        { type: "vf", q: "La inversión inicial del proyecto es de ochenta mil euros.", a: true, exp: "Vrai : Clara parle de « ronda los ochenta mil euros ». RONDAR signifie « avoisiner », c'est plus élégant que « más o menos »." },
        { type: "vf", q: "Clara aprueba el proyecto de inmediato y sin ninguna reserva.", a: false, exp: "Faux : elle dit « sigo teniendo reservas ». SEGUIR + gérondif marque la persistance d'un état, donc l'inverse d'une adhésion immédiate." },
        { type: "vf", q: "Marina propone una fase piloto de tres meses en dos delegaciones.", a: true, exp: "Vrai. Remarquez « sin que nadie tenga que abandonar » : SIN QUE impose toujours le subjonctif, quel que soit le contexte." },
        { type: "vf", q: "Damián acepta bajar el precio del contrato.", a: false, exp: "Faux : il dit ne pas pouvoir baisser davantage. C'est Marina qui propose un aplazamiento (report de paiement), pas une remise (descuento)." },
        { type: "vf", q: "Marina ofrece firmar un contrato de dos años en lugar de uno.", a: true, exp: "Vrai : c'est sa contrepartie. En négociation, EN VEZ DE et EN LUGAR DE sont interchangeables devant infinitif." },
        { type: "vf", q: "El proveedor incluye veinte horas de formación en su oferta.", a: true, exp: "Vrai. Attention au faux ami : FORMACIÓN = formation professionnelle ; « formation » au sens de constitution se dirait plutôt CONSTITUCIÓN." },
        { type: "vf", q: "Rafael pide a Marina una nota de diez páginas para el comité.", a: false, exp: "Faux : « dos páginas, ni una más ». La tournure NI UNA MÁS renforce la restriction, comme « pas une de plus » en français." }

    {

        { type: "qcm", q: "¿Por qué quiere cambiar de empresa Marina?", opts: ["Porque la han despedido", "Porque necesita un reto de mayor envergadura", "Porque le pagan poco", "Porque su jefe la trata mal"], a: 1, exp: "Elle invoque un besoin de défi, pas un motif négatif. ENVERGADURA (ampleur) appartient au registre soutenu attendu en entretien." },
        { type: "qcm", q: "¿Qué le pide Rafael cuando dice « hábleme de un conflicto »?", opts: ["Un relato heroico", "Una anécdota divertida", "Saber cómo reacciona bajo presión", "Una lista de sus defectos"], a: 2, exp: "Il précise « no busco un relato heroico, sino saber… ». La structure NO… SINO corrige une attente, alors que PERO opposerait simplement deux faits." },
        { type: "qcm", q: "¿Cómo resolvió Marina el problema del proveedor?", opts: ["Buscando culpables", "Repartiendo el pedido entre cuatro proveedores locales", "Cancelando la entrega", "Pagando una penalización"], a: 1, exp: "Le gérondif REPARTIENDO exprime ici le moyen : « en répartissant ». C'est une des valeurs les plus fréquentes du gérondif espagnol." },
        { type: "qcm", q: "Según Clara, ¿cuál es el principal obstáculo del proyecto?", opts: ["La falta de personal", "La inversión inicial", "La competencia", "El calendario"], a: 1, exp: "Elle attaque directement sur le coût. NO OBSTANTE, qu'elle emploie, est un connecteur d'opposition formel, équivalent de « néanmoins »." },
        { type: "qcm", q: "¿Qué teme Rafael respecto al equipo comercial?", opts: ["Que dimita", "Que se resista al cambio", "Que exija un aumento", "Que no entienda las cifras"], a: 1, exp: "« Me temo que el equipo comercial se resista » : après TEMERSE QUE, le subjonctif souligne l'éventualité redoutée." },
        { type: "qcm", q: "Si el piloto fracasara, ¿cuánto perdería la empresa?", opts: ["Ochenta mil euros", "Cuarenta mil euros", "Unos doce mil euros", "Nada en absoluto"], a: 2, exp: "Marina chiffre la perte maximale à douze mille. La conditionnelle « si fracasara… perderíamos » est le schéma type de l'hypothèse peu probable." },
        { type: "qcm", q: "¿Qué reprocha Damián a la petición de Marina?", opts: ["Que llegue tarde", "Que no encaje en el presupuesto firmado", "Que sea poco clara", "Que venga de un competidor"], a: 1, exp: "ENCAJAR EN = « cadrer avec, entrer dans ». Le verbe suggère un ajustement matériel, plus concret que « corresponder »." },
        { type: "qcm", q: "¿Qué solución propone finalmente Marina al proveedor?", opts: ["Un descuento del quince por ciento", "Cambiar de proveedor", "Entregar ahora y pagar en la renovación", "Anular el módulo de alertas"], a: 2, exp: "Elle dissocie livraison et paiement. Notez « le propongo que nos entreguen » : PROPONER QUE entraîne le subjonctif car il s'agit d'une influence sur autrui." },
        { type: "qcm", q: "¿Por qué se disculpa Damián al final?", opts: ["Por llegar tarde", "Por el tono del principio", "Por haber mentido", "Por no traer el contrato"], a: 1, exp: "Il explique : « acabo de salir de otra reunión tensa ». ACABAR DE + infinitif exprime le passé tout récent." },
        { type: "qcm", q: "¿Cuándo volverán a hablar Marina y Damián?", opts: ["El lunes", "El jueves", "El viernes", "Dentro de un mes"], a: 2, exp: "« Volvamos a hablar el viernes » : VOLVER A + infinitif est la périphrase de la répétition, équivalente du préfixe « re- » français." }

        { type: "input", q: "Marina lleva DIEZ años en el sector logístico. Corrija la cifra:", a: ["seis", "6"], ph: "cifra correcta", exp: "Elle dit « seis años ». Avec LLEVAR + durée + gérondif, la durée se place entre le verbe et le gérondif." },
        { type: "input", q: "Marina se trasladaría a SEVILLA. Corrija la ciudad:", a: ["Valencia", "valencia"], ph: "ciudad", exp: "Le poste est à Valence. TRASLADARSE est le verbe standard pour une mutation professionnelle ; MUDARSE renvoie plutôt au déménagement domestique." },
        { type: "input", q: "El proveedor los dejó plantados a TRES SEMANAS de la entrega. Corrija:", a: ["tres días", "a tres días", "días"], ph: "plazo correcto", exp: "« a tres días de una entrega crítica ». DEJAR PLANTADO est une expression idiomatique : « poser un lapin, laisser tomber »." },

        { type: "input", q: "La fase piloto duraría SEIS meses. Corrija:", a: ["tres", "3", "tres meses"], ph: "duración", exp: "Trois mois. Le conditionnel DURARÍA situe le fait dans l'hypothèse, non dans le réel." },
        { type: "input", q: "El equipo comercial trabaja con BASES DE DATOS desde hace años. Corrija:", a: ["hojas de cálculo", "hojas de calculo"], ph: "herramienta", exp: "HOJA DE CÁLCULO = tableur. Le calque « tabla de cálculo » n'existe pas en espagnol." },
        { type: "input", q: "El proveedor incluye CINCUENTA horas de formación. Corrija:", a: ["veinte", "20", "veinte horas"], ph: "número", exp: "Vingt heures. Attention : VEINTE s'écrit sans accent, contrairement à VEINTIDÓS." },
        { type: "input", q: "Marina pide a Damián un DESCUENTO. Corrija lo que pide realmente:", a: ["un aplazamiento", "aplazamiento", "un aplazamiento del pago"], ph: "sustantivo", exp: "APLAZAMIENTO = report d'échéance. Le verbe correspondant, APLAZAR, sert aussi pour reporter une réunion." },

        { type: "input", q: "Rafael propone someter el proyecto a votación el MARTES. Corrija:", a: ["jueves", "el jueves"], ph: "día", exp: "Jeudi. On dit EL JUEVES sans préposition : « en jueves » serait fautif dans ce sens." }

        { type: "qcm", q: "TEXTE — El teletrabajo, diez años después. (1) Cuando en 2015 las primeras grandes empresas españolas empezaron a ofrecer días de teletrabajo, muchos directivos temían que la productividad se desplomara. (2) Una década más tarde, los estudios apuntan en otra dirección. (3) El informe del Instituto Cervera, publicado el mes pasado, sostiene que el rendimiento individual ha subido un ocho por ciento. (4) No obstante, sus autores advierten de que la cifra esconde realidades muy dispares. (5) Los trabajadores con vivienda amplia y conexión estable rinden más; los demás, no siempre. (6) Por un lado, se ahorran desplazamientos; por otro, sus jornadas se han alargado de forma silenciosa. (7) Casi la mitad de los encuestados reconoce que responde correos después de las diez de la noche. (8) Lo que empezó como una conquista social corre el riesgo de convertirse en una servidumbre. (9) Además, los jóvenes recién incorporados se quejan de que nadie les enseña el oficio. (10) Antes bastaba con girar la silla para preguntar; ahora hay que escribir un mensaje y esperar. (11) Las empresas más lúcidas han reaccionado imponiendo franjas de desconexión. (12) Otras, en cambio, se han limitado a publicar una circular y a lavarse las manos. (13) Los sindicatos reclaman que se regule el derecho a la desconexión con sanciones reales. (14) La patronal responde que legislar en exceso ahuyentaría la flexibilidad conquistada. (15) Si se hubiera abordado el debate hace cinco años, quizá hoy no estaríamos discutiendo lo evidente. (16) Porque nadie discute ya que el teletrabajo haya venido para quedarse. — Según la frase (1), ¿qué temían los directivos?", opts: ["Que aumentaran los costes", "Que la productividad se desplomara", "Que los empleados dimitieran", "Que fallara la tecnología"], a: 1, exp: "DESPLOMARSE = s'effondrer brutalement. Après TEMER QUE, le subjonctif imparfait s'impose par concordance avec « temían »." },
        { type: "qcm", q: "¿Qué dato aporta el informe del Instituto Cervera?", opts: ["Una bajada del ocho por ciento", "Una subida del ocho por ciento del rendimiento individual", "Un estancamiento total", "Una subida del dieciocho por ciento"], a: 1, exp: "Phrase (3). Notez SOSTENER QUE + indicatif : le verbe rapporte une affirmation assumée, donc pas de subjonctif." },
        { type: "vf", q: "Según el texto, todos los teletrabajadores rinden más.", a: false, exp: "Faux : la phrase (5) oppose ceux qui ont un logement spacieux aux autres. DISPARES (phrase 4) annonce déjà cette disparité." },
        { type: "qcm", q: "¿Qué implica la frase (6) « sus jornadas se han alargado de forma silenciosa »?", opts: ["Que trabajan menos horas", "Que el alargamiento ha pasado desapercibido", "Que hacen ruido al trabajar", "Que han cambiado de horario oficial"], a: 1, exp: "SILENCIOSA est employé au figuré : le phénomène s'est produit sans être remarqué ni négocié. C'est un implicite critique." },
        { type: "qcm", q: "La frase (8) sugiere que el teletrabajo…", opts: ["Sigue siendo una conquista intacta", "Podría volverse una carga para el trabajador", "Ha sido prohibido", "Solo beneficia a las empresas jóvenes"], a: 1, exp: "SERVIDUMBRE s'oppose ici à CONQUISTA SOCIAL : l'auteur suggère un renversement. CORRER EL RIESGO DE = risquer de." },
        { type: "vf", q: "Los jóvenes recién incorporados se sienten bien acompañados en su aprendizaje.", a: false, exp: "Faux : phrase (9), ils se plaignent que personne ne leur enseigne le métier. RECIÉN + participe est une tournure figée qui reste invariable." },
        { type: "qcm", q: "¿Qué contrasta la frase (10)?", opts: ["Dos países", "La facilidad de antes y la lentitud de ahora", "Dos generaciones de directivos", "El coste de dos herramientas"], a: 1, exp: "« Antes bastaba con girar la silla… ahora hay que escribir » : l'imparfait d'habitude s'oppose au présent. BASTAR CON = il suffisait de." },
        { type: "qcm", q: "¿Qué significa « lavarse las manos » en la frase (12)?", opts: ["Cuidar la higiene", "Desentenderse del problema", "Invertir mucho dinero", "Consultar a los sindicatos"], a: 1, exp: "Expression idiomatique d'origine biblique : se laver les mains, donc se décharger de toute responsabilité." },
        { type: "qcm", q: "¿Cuál es la postura de la patronal?", opts: ["Pide sanciones reales", "Teme que el exceso de leyes elimine la flexibilidad", "Quiere prohibir el teletrabajo", "No se pronuncia"], a: 1, exp: "Phrase (14) : AHUYENTAR = faire fuir. Le conditionnel « ahuyentaría » exprime la conséquence hypothétique d'une loi trop stricte." },
        { type: "qcm", q: "¿Qué expresa la frase (15) « Si se hubiera abordado el debate hace cinco años… »?", opts: ["Un hecho real del pasado", "Un reproche sobre una ocasión perdida", "Una promesa futura", "Una orden"], a: 1, exp: "Si + plus-que-parfait du subjonctif = hypothèse irréelle du passé. L'auteur regrette que le débat n'ait pas eu lieu à temps." }
      ]
    },
    {
      id: "doc",
      nom: "Document authentique",
      consigne: "Étudiez cette lettre de motivation et répondez aux questions.",
      exercices: [
        { type: "qcm", q: "DOCUMENT — CARTA DE MOTIVACIÓN. Estimado señor Ibáñez: Le escribo en respuesta al anuncio publicado en su página web el pasado 12 de marzo, referencia LOG-482, para el puesto de responsable de operaciones. Tras seis años coordinando la cadena de suministro de una empresa francesa de tamaño medio, considero haber adquirido la solidez necesaria para asumir un puesto de mayor responsabilidad. Durante ese periodo me encargué de reorganizar el almacén central, lo que permitió reducir en un veintidós por ciento los plazos de preparación de pedidos. Asimismo, coordiné un equipo de once personas, tarea que me enseñó tanto sobre gestión humana como sobre logística. Me interesa especialmente su empresa porque han apostado por la digitalización sin renunciar al trato personal con el cliente, algo poco frecuente en el sector. Quedo a su entera disposición para ampliar cualquier punto en una entrevista. Atentamente, Marina Delcourt. — ¿A qué anuncio responde la carta?", opts: ["A uno publicado en prensa", "Al anuncio LOG-482 de la página web", "A una oferta recibida por correo", "A una recomendación interna"], a: 1, exp: "La référence et la date sont précisées d'emblée : c'est la norme dans une carta de motivación espagnole formelle." },
        { type: "qcm", q: "¿Qué fórmula de encabezamiento se emplea?", opts: ["Querido Rafael", "Hola", "Estimado señor Ibáñez", "A quien corresponda"], a: 2, exp: "ESTIMADO + señor + nom est le registre formel standard. QUERIDO serait affectif et donc inapproprié dans une candidature." },
        { type: "vf", q: "La candidata cuantifica sus resultados con una cifra concreta.", a: true, exp: "Vrai : une réduction de vingt-deux pour cent des délais. Chiffrer ses résultats est attendu à ce niveau de poste." },
        { type: "qcm", q: "¿Cuántas personas coordinó Marina?", opts: ["Seis", "Once", "Veintidós", "Cuatro"], a: 1, exp: "« un equipo de once personas ». Ne pas confondre avec les six années d'expérience ni avec les 22 pour cent." },
        { type: "qcm", q: "¿Qué conector introduce el segundo logro profesional?", opts: ["Sin embargo", "Asimismo", "Por lo tanto", "En cambio"], a: 1, exp: "ASIMISMO ajoute un élément de même nature, dans un registre soutenu. SIN EMBARGO ou EN CAMBIO marqueraient une opposition, contresens ici." },
        { type: "qcm", q: "¿Por qué le interesa esa empresa en concreto?", opts: ["Por el salario", "Porque digitaliza sin renunciar al trato personal", "Por la ubicación", "Por el horario flexible"], a: 1, exp: "Personnaliser la motivation par une valeur de l'entreprise est bien plus convaincant que d'invoquer un avantage matériel." },
        { type: "qcm", q: "¿Qué matiz aporta « considero haber adquirido » frente a « he adquirido »?", opts: ["Es más brusco", "Es más modesto y matizado", "Es incorrecto", "Indica duda total"], a: 1, exp: "CONSIDERAR + infinitif composé présente l'affirmation comme une appréciation personnelle : c'est une atténuation typique du registre formel." },
        { type: "qcm", q: "¿Cómo se despide la candidata?", opts: ["Un abrazo", "Saludos", "Atentamente", "Hasta pronto"], a: 2, exp: "ATENTAMENTE est la clôture neutre et formelle. UN ABRAZO est réservé aux proches et serait ici une faute de registre." },
        { type: "vf", q: "La expresión « quedo a su entera disposición » pertenece al registro coloquial.", a: false, exp: "Faux : c'est une formule figée du registre administratif et commercial, équivalente de « je reste à votre entière disposition »." },
        { type: "input", q: "Escriba el conector formal que emplea la carta para AÑADIR un segundo argumento:", a: ["asimismo", "Asimismo"], ph: "un conector", exp: "ASIMISMO (en un seul mot) ; « así mismo » en deux mots signifie plutôt « de la même façon » et n'est pas équivalent." }
      ]
    },
    {
      id: "syn",
      nom: "Synonymes et nuances",
      consigne: "Choisissez le synonyme le plus proche dans le contexte donné.",
      exercices: [
        { type: "qcm", q: "« Un reto de mayor ENVERGADURA » equivale a…", opts: ["dificultad", "amplitud", "rapidez", "sencillez"], a: 1, exp: "ENVERGADURA désigne l'ampleur, la portée d'un projet. DIFICULTAD insisterait sur l'obstacle, pas sur la dimension." },
        { type: "qcm", q: "« La inversión RONDA los ochenta mil » equivale a…", opts: ["supera con creces", "se aproxima a", "es exactamente", "es inferior a la mitad de"], a: 1, exp: "RONDAR = tourner autour de, avoisiner. L'approximation est légère, contrairement à « supera con creces » (dépasse largement)." },
        { type: "qcm", q: "« Me temo que se RESISTA » equivale a…", opts: ["colabore", "se oponga", "se marche", "se alegre"], a: 1, exp: "RESISTIRSE A = opposer une résistance. Le pronominal est indispensable : « resistir » seul signifie « supporter, tenir bon »." },
        { type: "qcm", q: "« El riesgo está ACOTADO » equivale a…", opts: ["delimitado", "aumentado", "olvidado", "compartido"], a: 0, exp: "ACOTAR, c'est borner, circonscrire. Le terme vient du vocabulaire du terrain délimité et s'emploie beaucoup en gestion." },
        { type: "qcm", q: "« Rendir CUENTAS » equivale a…", opts: ["contar dinero", "justificar los resultados", "pagar deudas", "hacer cálculos"], a: 1, exp: "RENDIR CUENTAS = rendre des comptes. Attention au faux ami avec CONTAR (raconter, compter)." },
        { type: "qcm", q: "« Un DESEMBOLSO importante » equivale a…", opts: ["gasto", "ingreso", "ahorro", "préstamo"], a: 0, exp: "DESEMBOLSO est un décaissement, donc une dépense effective. INGRESO serait l'inverse (une recette)." },
        { type: "qcm", q: "« Lo veo DESCABELLADO » equivale a…", opts: ["razonable", "disparatado", "urgente", "barato"], a: 1, exp: "DESCABELLADO = insensé, farfelu. Dans le dialogue, la négation « no lo veo descabellado » atténue l'accord : litote très fréquente en négociation." },
        { type: "qcm", q: "« ADELANTAR una información » equivale a…", opts: ["ocultarla", "anticiparla", "repetirla", "negarla"], a: 1, exp: "ADELANTAR, c'est communiquer par avance. Le sens « dépasser un véhicule » existe aussi, d'où l'importance du contexte." },
        { type: "qcm", q: "« Echar EN FALTA algo » equivale a…", opts: ["encontrarlo", "añorarlo", "rechazarlo", "romperlo"], a: 1, exp: "ECHAR EN FALTA = regretter l'absence de. Ne pas confondre avec ECHAR A PERDER (gâcher) ; ECHAR DE MENOS en est le synonyme le plus courant." },
        { type: "qcm", q: "« La cifra ASCENDIÓ a cuarenta mil » equivale a…", opts: ["se elevó a", "bajó hasta", "se dividió en", "se anuló en"], a: 0, exp: "ASCENDER A appartient au registre économique. Avec un sujet de personne, il signifie en revanche « obtenir une promotion »." }
      ]
    },
    {
      id: "ant",
      nom: "Antonymes",
      consigne: "Indiquez le contraire du mot ou de l'expression proposé.",
      exercices: [
        { type: "qcm", q: "Antónimo de EXIGENTE (un ritmo exigente):", opts: ["llevadero", "duro", "estricto", "riguroso"], a: 0, exp: "LLEVADERO = supportable, facile à vivre. Les trois autres options sont au contraire des synonymes d'exigeant." },
        { type: "qcm", q: "Antónimo de AMPLIA (autonomía amplia):", opts: ["extensa", "limitada", "generosa", "considerable"], a: 1, exp: "LIMITADA s'oppose bien à AMPLIA. Notez que RESTRINGIDA conviendrait aussi, avec une nuance plus administrative." },
        { type: "qcm", q: "Antónimo de FRACASAR:", opts: ["hundirse", "triunfar", "arruinarse", "caer"], a: 1, exp: "TRIUNFAR ou TENER ÉXITO. Attention au faux ami : ÉXITO = succès, jamais « sortie » (SALIDA)." },
        { type: "qcm", q: "Antónimo de OCULTO (coste oculto):", opts: ["escondido", "transparente", "secreto", "disimulado"], a: 1, exp: "TRANSPARENTE, ou plus littéralement PATENTE. Les autres options répètent l'idée de dissimulation." },
        { type: "qcm", q: "Antónimo de APLAZAR:", opts: ["retrasar", "posponer", "adelantar", "suspender"], a: 2, exp: "ADELANTAR = avancer une échéance. RETRASAR et POSPONER sont des synonymes d'APLAZAR." },
        { type: "qcm", q: "Antónimo de RESCINDIBLE (un contrato rescindible):", opts: ["anulable", "vinculante e irrevocable", "temporal", "flexible"], a: 1, exp: "Un contrat non résiliable est VINCULANTE (contraignant) et IRREVOCABLE. RESCINDIR, c'est rompre un engagement." },
        { type: "qcm", q: "Antónimo de FRANQUEZA:", opts: ["sinceridad", "hipocresía", "claridad", "honestidad"], a: 1, exp: "HIPOCRESÍA. Le mot FRANQUEZA n'a rien à voir avec « franchise commerciale », qui se dit FRANQUICIA : faux ami classique." },
        { type: "qcm", q: "Antónimo de PONERSE A LA DEFENSIVA:", opts: ["atrincherarse", "abrirse al diálogo", "callarse", "protestar"], a: 1, exp: "ABRIRSE AL DIÁLOGO. ATRINCHERARSE renforcerait au contraire l'idée de repli défensif." },
        { type: "qcm", q: "Antónimo de RECIÉN INCORPORADO (un empleado):", opts: ["novato", "veterano", "principiante", "aprendiz"], a: 1, exp: "VETERANO. Rappel : RECIÉN devant participe est invariable, on ne dit jamais « recientes incorporados »." },
        { type: "qcm", q: "Antónimo de AHUYENTAR (la flexibilidad):", opts: ["espantar", "atraer", "expulsar", "alejar"], a: 1, exp: "ATRAER. AHUYENTAR contient l'idée de faire fuir (de HUIR), comme les trois autres propositions." }
      ]
    },
    {
      id: "motjuste",
      nom: "Le mot juste",
      consigne: "Complétez avec le terme exact du monde professionnel.",
      exercices: [
        { type: "input", q: "Envié mi candidatura con el currículum y la ______ de motivación.", a: ["carta"], ph: "sustantivo", exp: "CARTA DE MOTIVACIÓN. « Letra » désigne une lettre de l'alphabet ou une traite bancaire : c'est un faux ami redoutable." },
        { type: "input", q: "Antes de contratarme, tuve que pasar tres ______ de trabajo.", a: ["entrevistas", "entrevistas de trabajo"], ph: "sustantivo plural", exp: "ENTREVISTA = entretien. Le mot ENTREVISTA sert aussi pour l'interview journalistique." },
        { type: "input", q: "El director de Recursos ______ me recibió el lunes.", a: ["Humanos", "humanos"], ph: "adjetivo", exp: "RECURSOS HUMANOS, souvent abrégé RR. HH. avec doublement des lettres pour marquer le pluriel." },
        { type: "input", q: "Firmé un contrato indefinido con un periodo de ______ de seis meses.", a: ["prueba"], ph: "sustantivo", exp: "PERIODO DE PRUEBA = période d'essai. « Ensayo » désignerait une répétition théâtrale ou un essai littéraire." },
        { type: "input", q: "Cada mes recibo mi ______ con el detalle de las retenciones.", a: ["nómina", "nomina"], ph: "sustantivo", exp: "NÓMINA = bulletin de salaire (et, par extension, la masse salariale). Le mot est un incontournable du vocabulaire du travail." },
        { type: "input", q: "El proyecto no salió adelante por falta de ______ presupuestaria.", a: ["partida", "dotación", "dotacion"], ph: "sustantivo", exp: "PARTIDA PRESUPUESTARIA = ligne budgétaire. DOTACIÓN est également accepté dans ce contexte administratif." },
        { type: "input", q: "Presentamos el informe con los principales ______ de rendimiento (KPI).", a: ["indicadores"], ph: "sustantivo plural", exp: "INDICADORES est le terme consacré. MÉTRICAS existe aussi, calqué de l'anglais, mais reste plus technique." },
        { type: "input", q: "Hay que ______ cuentas ante el consejo cada trimestre.", a: ["rendir"], ph: "verbo", exp: "RENDIR CUENTAS. Le verbe RENDIR signifie aussi « produire, être rentable » : el trabajo rinde poco." },
        { type: "input", q: "El cliente presentó una ______ por el retraso de la entrega.", a: ["reclamación", "reclamacion", "queja"], ph: "sustantivo", exp: "RECLAMACIÓN est le terme formel et écrit ; QUEJA est plus général et souvent oral." },
        { type: "input", q: "Firmamos un acuerdo ______ que obliga a ambas partes durante dos años.", a: ["vinculante"], ph: "adjetivo", exp: "VINCULANTE = contraignant, juridiquement liant. Le calque « obligatorio » ne rend pas la même nuance juridique." }
      ]
    },
    {

      nom: "Familles de mots et dérivation",
      consigne: "Formez le mot dérivé demandé à partir de la base indiquée.",
      exercices: [

        { type: "input", q: "De NEGOCIAR, el sustantivo de la acción: la ______", a: ["negociación", "negociacion"], ph: "sustantivo", exp: "NEGOCIACIÓN. Le suffixe -CIÓN nominalise l'action ; NEGOCIO désigne le commerce ou l'affaire, pas le processus." },
        { type: "input", q: "De CONTRATAR, el sustantivo de la acción: la ______", a: ["contratación", "contratacion"], ph: "sustantivo", exp: "CONTRATACIÓN (l'embauche). CONTRATO est le document, CONTRATACIÓN le processus : distinction très utile en RH." },
        { type: "input", q: "De RESPONSABLE, el sustantivo abstracto: la ______", a: ["responsabilidad"], ph: "sustantivo", exp: "RESPONSABILIDAD. Le suffixe -DAD nominalise les adjectifs et donne toujours un féminin." },
        { type: "input", q: "De PRESUPUESTO, el adjetivo: una partida ______", a: ["presupuestaria"], ph: "adjetivo femenino", exp: "PRESUPUESTARIA. Le suffixe -ARIO/-ARIA forme des adjectifs de relation, comme en français « budgétaire »." },
        { type: "input", q: "De EXIGIR, el adjetivo: un ritmo ______", a: ["exigente"], ph: "adjetivo", exp: "EXIGENTE. Le suffixe -ENTE vient du participe présent latin ; il donne des adjectifs invariables en genre." },
        { type: "input", q: "De ACUERDO, el verbo pronominal que significa ponerse de acuerdo: ______", a: ["acordar", "acordarse", "acordar algo"], ph: "verbo", exp: "ACORDAR (convenir). Attention : ACORDARSE DE signifie « se souvenir de », sens tout à fait différent." },
        { type: "input", q: "De VENDER, el sustantivo de la persona: el ______", a: ["vendedor", "vendedora"], ph: "sustantivo", exp: "VENDEDOR. Le suffixe -DOR forme le nom d'agent ; VENTA désigne l'opération commerciale." },
        { type: "input", q: "De FLEXIBLE, el sustantivo abstracto: la ______", a: ["flexibilidad"], ph: "sustantivo", exp: "FLEXIBILIDAD. Les adjectifs en -BLE donnent régulièrement des noms en -BILIDAD." },
        { type: "input", q: "De DIGITAL, el verbo: ______ el seguimiento de pedidos", a: ["digitalizar"], ph: "verbo", exp: "DIGITALIZAR. Le suffixe -IZAR fabrique des verbes à partir d'adjectifs, très productif dans la langue technique." }
      ]
    },
    {
      id: "fauxamis",
      nom: "Faux amis et pièges",
      consigne: "Attention aux mots qui ressemblent au français mais ne veulent pas dire la même chose.",
      exercices: [
        { type: "qcm", q: "« Tuvo mucho ÉXITO en la reunión » significa que…", opts: ["salió de la reunión", "triunfó", "se enfadó", "llegó tarde"], a: 1, exp: "ÉXITO = succès. « Sortie » se dit SALIDA. C'est l'un des faux amis les plus fréquents chez les francophones." },
        { type: "qcm", q: "« Un contrato con una FRANQUICIA » se refiere a…", opts: ["la sinceridad", "una concesión comercial", "un descuento", "un despido"], a: 1, exp: "FRANQUICIA = franchise commerciale (ou d'assurance). La franchise au sens de sincérité, c'est FRANQUEZA." },
        { type: "qcm", q: "« Debo ASISTIR a la reunión » significa…", opts: ["ayudar a alguien", "estar presente", "dirigir la sesión", "cancelarla"], a: 1, exp: "ASISTIR A = assister à, être présent. Pour « assister » au sens d'aider, on dira AYUDAR." },
        { type: "qcm", q: "« Es una empresa muy LARGA » sería incorrecto para decir…", opts: ["que es antigua", "que es grande", "que es lenta", "que es rentable"], a: 1, exp: "LARGO = long, jamais « large ». Pour dire grande, on emploie GRANDE ; pour large, ANCHO." },
        { type: "qcm", q: "« El director está muy ENFADADO » significa que está…", opts: ["cansado", "enfermo", "enojado", "aburrido"], a: 2, exp: "ENFADADO = fâché, en colère. Rien à voir avec le français « fade » ; EMBARAZADA, autre piège célèbre, signifie enceinte." },
        { type: "qcm", q: "« Le ruego que me DISCULPE » equivale a…", opts: ["que me despida", "que me perdone", "que me pague", "que me escuche"], a: 1, exp: "DISCULPAR = excuser, pardonner. À ne pas confondre avec DESPEDIR, qui signifie licencier ou prendre congé." },
        { type: "qcm", q: "« Firmó el contrato » quiere decir que lo…", opts: ["firmó con su nombre", "rompió", "leyó en voz alta", "envió por correo"], a: 0, exp: "FIRMAR = signer. Le faux ami joue avec l'anglais « firm » ; l'entreprise se dit EMPRESA ou FIRMA (nom, pas verbe)." },
        { type: "qcm", q: "« Este puesto exige mucha DISPONIBILIDAD » significa…", opts: ["mucho dinero", "estar disponible con frecuencia", "muchos diplomas", "mucha discreción"], a: 1, exp: "DISPONIBILIDAD = disponibilité. Ne pas le confondre avec DISPOSICIÓN, qui renvoie à l'agencement ou à l'état d'esprit." },
        { type: "qcm", q: "« Trabajo en una empresa de SUMINISTRO » se refiere a…", opts: ["el resumen", "el abastecimiento", "el sumario judicial", "el seguro"], a: 1, exp: "SUMINISTRO = approvisionnement, fourniture. Le résumé, c'est RESUMEN ; encore un piège pour les francophones." },
        { type: "qcm", q: "« Hemos DEMANDADO al proveedor » significa que…", opts: ["le hemos pedido algo", "le hemos llevado a juicio", "le hemos felicitado", "le hemos contratado"], a: 1, exp: "DEMANDAR = poursuivre en justice. « Demander » au sens ordinaire se traduit par PEDIR ou PREGUNTAR." }
      ]
    },
    {
      id: "qr",
      nom: "Question ↔ réponse",
      consigne: "Associez chaque question à la réponse qui lui convient.",
      exercices: [
        { type: "qcm", q: "¿Qué le llevó a solicitar este puesto?", opts: ["Desde hace tres años.", "Busco un reto de mayor envergadura.", "En Valencia, creo.", "Sí, por supuesto."], a: 1, exp: "QUÉ LE LLEVÓ A… demande une motivation : seule une réponse causale convient. Les autres répondent à cuándo, dónde et à une question fermée." },
        { type: "qcm", q: "¿Estaría dispuesta a trasladarse?", opts: ["Sin ningún inconveniente.", "Hace dos años.", "Unos ochenta mil.", "Con hojas de cálculo."], a: 0, exp: "Question fermée au conditionnel : la réponse porte sur l'acceptation. SIN NINGÚN INCONVENIENTE est plus nuancé qu'un simple « sí »." },
        { type: "qcm", q: "¿Cuánto ronda la inversión inicial?", opts: ["Tres meses.", "Los ochenta mil euros.", "Once personas.", "El jueves."], a: 1, exp: "CUÁNTO interroge sur une quantité chiffrée ; les autres réponses relèvent de cuánto tiempo, cuántos et cuándo." },
        { type: "qcm", q: "¿Quién se encargaría de formar al personal?", opts: ["En dos delegaciones.", "El proveedor y yo misma.", "Un quince por ciento.", "Porque es urgente."], a: 1, exp: "QUIÉN attend une personne. Notez le conditionnel dans la question : la réponse reste dans le même cadre hypothétique." },
