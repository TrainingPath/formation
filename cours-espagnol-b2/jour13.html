<script>
var DAY = {
  num: 13,
  title: "Rédiger un texte argumentatif",
  subtitle: "Construire un essai clair : thèse, arguments, contre-arguments et conclusion.",
  theory: `
<h3>1. Qu'est-ce qu'un texte argumentatif ?</h3>
<p>Un <strong>texto argumentativo</strong> défend une <strong>thèse</strong> (une position) à l'aide d'arguments organisés, dans le but de convaincre le lecteur. Contrairement à un texte purement descriptif ou narratif, il prend parti et le justifie. C'est un exercice-clé du niveau B2, très présent aux examens (DELE).</p>
<h3>2. La structure canonique en quatre temps</h3>
<pre class="pseudo">1. INTRODUCTION       - présenter le thème et sa pertinence
   (introducción)     - annoncer clairement la thèse
2. DÉVELOPPEMENT      - un argument par paragraphe, du plus fort au plus faible
   (desarrollo)       - chaque argument étayé par un exemple ou une donnée
3. CONTRE-ARGUMENT    - reconnaître l'objection adverse (concession)
   (contraargumento)  - la réfuter ou la relativiser
4. CONCLUSION         - synthétiser, réaffirmer la thèse
   (conclusión)       - éventuellement ouvrir sur une perspective</pre>
<div class="tip">Longueur type d'un essai B2 : 200 à 250 mots, soit environ quatre à cinq paragraphes. Un paragraphe = une idée. La clarté prime toujours sur la longueur.</div>
<h3>3. L'introduction : accrocher et annoncer</h3>
<p>Elle situe le sujet (une question de société, un débat) et énonce sans ambiguïté la position défendue. On évite d'entrer trop vite dans le détail.</p>
<pre class="pseudo">Modèles d'ouverture :
- En la actualidad, se debate mucho sobre...      (De nos jours, on débat beaucoup de...)
- Uno de los temas más controvertidos es...       (L'un des sujets les plus controversés...)
- ¿Es realmente...? Esta pregunta divide opiniones.
Annonce de thèse :
- En mi opinión, ... / Considero que ... / Sostengo que ...
- A lo largo de este texto defenderé que ...</pre>
<h3>4. Le développement : un argument, un paragraphe</h3>
<p>Chaque paragraphe présente <strong>un</strong> argument, introduit par un connecteur d'ordre, développé et illustré. On progresse de l'argument le plus solide au plus secondaire.</p>
<pre class="pseudo">En primer lugar, [argument 1]. Por ejemplo, [exemple concret].
Además, [argument 2], lo cual demuestra que [conséquence].
Cabe añadir que [argument 3], como muestran [données, études].</pre>
<div class="warn">Un argument sans exemple reste une simple affirmation. Étaie systématiquement : une donnée chiffrée, un cas concret, une expérience personnelle, une référence. C'est l'exemple qui rend l'argument convaincant.</div>
<h3>5. Le contre-argument et la conclusion</h3>
<p>Un bon essai <strong>anticipe l'objection</strong> : le concéder puis le réfuter renforce la crédibilité (on montre qu'on a envisagé l'autre point de vue). La conclusion, elle, ne doit apporter aucun argument nouveau : elle synthétise et réaffirme.</p>
<pre class="pseudo">Concession + réfutation :
- Es cierto que [objection], sin embargo [réfutation].
- Aunque algunos sostienen que ..., lo cierto es que ...
- Si bien [objection], no debemos olvidar que ...
Conclusion :
- En conclusión, / En definitiva, / Para concluir, ...
- Por todo lo expuesto, considero que ...
- En resumen, los argumentos presentados confirman que ...</pre>
<pre class="pseudo">Squelette complet d'un essai B2 :
Párrafo 1  Introducción + tesis
Párrafo 2  Argumento principal + ejemplo
Párrafo 3  Segundo argumento + ejemplo
Párrafo 4  Contraargumento concedido + refutación
Párrafo 5  Conclusión (síntesis + reafirmación)</pre>
<div class="tip">Soigne les <strong>transitions</strong> entre paragraphes : chaque nouveau paragraphe doit s'enchaîner logiquement au précédent grâce à un connecteur (además, por otra parte, sin embargo, en cambio, por lo tanto). C'est le fil des connecteurs qui donne au texte sa cohésion.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le but d'un texte argumentatif ?", opts: ["Décrire un lieu", "Raconter une histoire", "Défendre une thèse et convaincre", "Résumer un livre"], a: 2, exp: "L'argumentatif prend position et la justifie pour convaincre." },
    { type: "input", q: "Complète la structure : après l'introduction vient le ___ (partie où l'on expose les arguments).", a: ["desarrollo", "développement", "developpement"], ph: "partie", exp: "Le desarrollo (développement) contient les arguments." },
    { type: "qcm", q: "Où doit-on annoncer clairement sa thèse ?", opts: ["Dans la conclusion seulement", "Dans l'introduction", "Nulle part", "Dans le contre-argument"], a: 1, exp: "La thèse s'annonce dès l'introduction pour orienter le lecteur." },
    { type: "input", q: "Complète (annonce de thèse) : « En mi ___, la tecnología mejora la educación. »", a: ["opinión", "opinion"], ph: "mot", exp: "En mi opinión = à mon avis, formule d'annonce de la thèse." },
    { type: "vf", q: "Chaque paragraphe du développement doit contenir un seul argument principal.", a: true, exp: "Vrai : un paragraphe = une idée, pour la clarté." },
    { type: "qcm", q: "Pourquoi ajouter un exemple à chaque argument ?", opts: ["Pour allonger le texte", "Pour étayer et rendre l'argument convaincant", "Ce n'est pas nécessaire", "Pour changer de sujet"], a: 1, exp: "L'exemple concret transforme une affirmation en argument crédible." },
    { type: "input", q: "Complète (concession) : « Es ___ que la tecnología distrae, sin embargo bien usada es útil. » (adjectif = vrai)", a: ["cierto"], ph: "adjectif", exp: "Es cierto que... sin embargo... : structure de concession-réfutation." },
    { type: "qcm", q: "Que doit-on éviter dans la conclusion ?", opts: ["Réaffirmer la thèse", "Synthétiser", "Introduire un argument entièrement nouveau", "Utiliser un connecteur de conclusion"], a: 2, exp: "La conclusion synthétise ; elle n'introduit pas d'argument neuf." },
    { type: "input", q: "Complète (connecteur de conclusion) : « En ___, los datos confirman mi postura. » (mot signifiant en définitive)", a: ["definitiva"], ph: "mot", exp: "En definitiva = en définitive, connecteur conclusif." },
    { type: "qcm", q: "À quoi sert le contre-argument (contraargumento) ?", opts: ["À contredire sa propre thèse", "À anticiper l'objection adverse et la réfuter", "À conclure", "À décrire le sujet"], a: 1, exp: "Concéder puis réfuter l'objection renforce la crédibilité de la thèse." },
    { type: "vf", q: "On progresse en général de l'argument le plus fort vers le plus secondaire.", a: true, exp: "Vrai : commencer par l'argument le plus solide capte l'adhésion." },
    { type: "input", q: "Complète (ouverture) : « En la ___, se debate mucho sobre el medio ambiente. » (mot = actualité/l'époque actuelle)", a: ["actualidad"], ph: "mot", exp: "En la actualidad = de nos jours, formule d'ouverture." },
    { type: "qcm", q: "Compréhension : « Aunque algunos sostienen que es caro, lo cierto es que ahorra a largo plazo. » Quelle est la fonction de cette phrase ?", opts: ["Une introduction", "Une concession suivie d'une réfutation", "Une conclusion", "Un simple exemple"], a: 1, exp: "Aunque... lo cierto es que... = on concède l'objection puis on la réfute." },
    { type: "qcm", q: "Compréhension : « Por todo lo expuesto, considero que... » Dans quelle partie trouve-t-on cette formule ?", opts: ["L'introduction", "Le premier argument", "La conclusion", "Le contre-argument"], a: 2, exp: "Por todo lo expuesto (au vu de tout ce qui a été exposé) ouvre la conclusion." },
    { type: "vf", q: "Les connecteurs assurent les transitions entre paragraphes et la cohésion du texte.", a: true, exp: "Vrai : además, sin embargo, por lo tanto lient logiquement les paragraphes." }
  ],
  final: {
    title: "Exercice final — ¿Deberían prohibirse los móviles en las aulas?",
    intro: `<p>Ejemplo de texto argumentativo estructurado. Identifica cada parte (introducción, argumentos, contraargumento, conclusión) :</p>
<pre class="pseudo">En la actualidad, el uso del móvil en las aulas genera un intenso debate.
En mi opinión, deberían restringirse durante las clases.

En primer lugar, el teléfono es una fuente constante de distracción.
Por ejemplo, numerosos estudios muestran que los alumnos que lo usan
en clase obtienen peores resultados. Además, su presencia dificulta
la concentración y la interacción directa entre compañeros.

Es cierto que el móvil puede ser una herramienta educativa útil,
pues permite consultar información al instante. Sin embargo, este uso
puede reservarse a momentos concretos y supervisados por el profesor.

En conclusión, aunque la tecnología tiene ventajas, restringir el móvil
en el aula favorece un aprendizaje más profundo. Por todo lo expuesto,
considero que la escuela debe recuperar el espacio de la atención.</pre>`,
    questions: [
      { type: "input", q: "¿Con qué fórmula se anuncia la tesis en la introducción? « En mi ___, deberían restringirse. »", a: ["opinión", "opinion"], ph: "mot", exp: "En mi opinión anuncia la postura del autor." },
      { type: "qcm", q: "« En primer lugar, el teléfono es una fuente de distracción » corresponde a:", opts: ["La conclusión", "El primer argumento", "El contraargumento", "La introducción"], a: 1, exp: "En primer lugar introduce el argumento principal del desarrollo." },
      { type: "vf", q: "« Es cierto que el móvil puede ser útil... Sin embargo... » es un contraargumento concedido y luego rebatido.", a: true, exp: "Verdadero : se concede la objeción (es cierto que) y se refuta (sin embargo)." },
      { type: "input", q: "¿Qué conector abre la conclusión? « En ___, aunque la tecnología tiene ventajas... »", a: ["conclusión", "conclusion"], ph: "mot", exp: "En conclusión abre el párrafo final de síntesis." },
      { type: "qcm", q: "¿Qué NO debe hacer la conclusión de este texto?", opts: ["Reafirmar la tesis", "Sintetizar los argumentos", "Introducir un argumento totalmente nuevo", "Cerrar con una perspectiva"], a: 2, exp: "La conclusión sintetiza y reafirma, sin añadir argumentos nuevos." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">De nos jours, l'usage du portable en classe suscite un débat intense.
À mon avis, il devrait être restreint pendant les cours.

En premier lieu, le téléphone est une source constante de distraction.
Par exemple, de nombreuses études montrent que les élèves qui l'utilisent
en classe obtiennent de moins bons résultats. De plus, sa présence gêne
la concentration et l'interaction directe entre camarades.

Il est vrai que le portable peut être un outil éducatif utile,
car il permet de consulter des informations instantanément. Cependant, cet usage
peut être réservé à des moments précis et supervisés par le professeur.

En conclusion, bien que la technologie ait des avantages, restreindre le portable
en classe favorise un apprentissage plus profond. Au vu de tout ce qui précède,
j'estime que l'école doit reconquérir l'espace de l'attention.</pre>
<p>Observe le plan : introduction + thèse, deux arguments étayés d'exemples, un contre-argument concédé puis réfuté, une conclusion qui synthétise sans rien ajouter de neuf. Ce squelette, articulé par des connecteurs, est le modèle à reproduire pour tout essai argumentatif au B2.</p>`
  }
};
</script>
