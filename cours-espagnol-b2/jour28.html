<script>

  title: "Projet final (2) : comprendre le fait divers en profondeur",
  subtitle: "La résolution de l'affaire, puis compréhension approfondie : sens global, implicite, chronologie, opinion.",
  theory: `
<h3>Projet final — Le grand fait divers (partie 2 sur 2)</h3>
<p>Hier, tu as lu la première moitié de l'affaire de l'huile primée. Voici la <strong>résolution</strong>. Après l'avoir lue, tu travailleras la compréhension approfondie : le sens global, l'implicite, la chronologie complète et ton opinion. Rappelle-toi les indices : l'absence d'effraction, les traces de bottes qui s'arrêtent net, le billet de loterie daté, et les caméras en panne connues des seuls employés.</p>
<h3>El ladrón al que delató un décimo de lotería (Parte 2)</h3>
<p>El sargento sabía por dónde empezar. Un décimo de lotería no cae del cielo: se compra en un lugar concreto, a una hora concreta. En la parte inferior del papel figuraba el número de la administración que lo había vendido: la número 4 de Baeza, un pueblo situado a apenas quince kilómetros de Villanueva.</p>
<p>A la mañana siguiente, dos agentes se presentaron en aquella administración de lotería. La dueña, acostumbrada a vender cientos de décimos al día, no recordaba ningún comprador en particular. Sin embargo, tenía algo mucho más útil: una cámara de seguridad que, esta vez, sí funcionaba perfectamente.</p>
<p>Cruzando la fecha impresa en el décimo con las grabaciones, los agentes localizaron el momento exacto de la venta. En la pantalla apareció un hombre joven, con gorra y, sobre todo, con unas llamativas botas de suela ancha, idénticas a las huellas del almacén. Pagó, guardó el décimo en el bolsillo y salió. La imagen no dejaba lugar a dudas.</p>
<p>El sargento reconoció al instante aquel rostro. Era Tomás, el trabajador más joven de la cooperativa, contratado apenas seis meses antes. Un chico amable, siempre puntual, del que nadie habría sospechado. «Y sin embargo», pensó el sargento, «es precisamente el que mejor conocía los horarios y el que sabía que las cámaras estaban averiadas.»</p>
<p>Antes de detenerlo, la Guardia Civil quiso reunir más pruebas. Investigaron discretamente y descubrieron un detalle revelador: Tomás arrastraba desde hacía meses una deuda de juego. Gastaba en loterías y apuestas mucho más de lo que ganaba. La ironía era evidente: un adicto a la lotería iba a ser delatado, precisamente, por un décimo de lotería.</p>
<p>Cuando los agentes se presentaron en su casa, Tomás no pudo disimular su nerviosismo. En el garaje, apenas tapadas con una lona vieja, estaban las doce garrafas de aceite premiado, intactas. El joven pensaba venderlas a un comprador de otra provincia durante una feria gastronómica que se celebraba aquel fin de semana.</p>
<p>Al verse descubierto, Tomás terminó por confesar. Explicó, con la voz temblorosa, que aquella noche había entrado con su propia llave, había cargado las garrafas y se disponía a marcharse cuando, a mitad del pasillo, le sonó el teléfono. Del susto, se le cayó el décimo del bolsillo sin que se diera cuenta. Se detuvo un instante, miró alrededor y, al no ver nada, siguió su camino. Aquel segundo de distracción fue su perdición.</p>
<p>«Nunca imaginé que un papelito pudiera hundirme», declaró Tomás cuando lo detuvieron. El sargento, sin rencor, le respondió una frase que en el pueblo aún se repite: «El delito perfecto no existe, muchacho. Siempre se olvida algo.»</p>
<p>El aceite fue devuelto a la cooperativa a tiempo para la feria. Doña Remedios, aliviada, insistió en regalar una botella a cada agente. «Que conste», dijo con retranca, «que esta la pueden aceptar sin remordimientos.» La medalla de oro siguió luciendo en la entrada del almacén, y el pueblo entero tardó semanas en dejar de hablar del ladrón al que delató un décimo de lotería.</p>
<h3>Rappel de lexique utile</h3>
<pre class="pseudo">la administración de lotería   le point de vente de loterie
el/la comprador/a              l'acheteur / l'acheteuse
la grabación                   l'enregistrement
llamativo/a                    voyant(e), qui attire l'œil
la deuda de juego              la dette de jeu
las apuestas                   les paris
la lona                        la bâche
disimular                      dissimuler, cacher
confesar                       avouer
la perdición                   la perte, la chute
el delito                      le délit
la retranca                    l'ironie fine (registre)
lucir                          briller, être exposé</pre>
<div class="tip">Compréhension approfondie : va au-delà des faits. Repère l'IRONIE centrale (un joueur de loterie trahi par un billet de loterie), l'IMPLICITE (« la que pueden aceptar sin remordimientos » sous-entend que Tomás, lui, ne pouvait pas accepter honnêtement) et la MORALE explicite du sergent (« el delito perfecto no existe »).</div>
<div class="warn">Note la structure « le sonó el teléfono » et « se le cayó el décimo » : c'est le « se » de l'événement involontaire, très espagnol. Il présente l'action comme non voulue, subie par la personne (le complément indirect « le »). On le traduit par « son téléphone sonna », « il laissa tomber le billet (malgré lui) ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment le sergent commence-t-il son enquête à partir du billet ?", opts: ["En interrogeant doña Remedios", "En repérant l'administration de loterie qui l'a vendu", "En analysant l'ADN", "En fouillant la coopérative"], a: 1, exp: "Le numéro de l'administration figurait sur le décimo : celle de Baeza." },
    { type: "input", q: "Dans quel village se trouvait l'administration de loterie ? Complète : « la número 4 de ___ ».", a: ["Baeza"], ph: "lieu", exp: "La administración número 4 de Baeza, à 15 km de Villanueva." },
    { type: "qcm", q: "Qu'est-ce qui, cette fois, a permis d'identifier l'acheteur ?", opts: ["La mémoire de la vendeuse", "Une caméra de sécurité qui fonctionnait", "Un témoin", "Une empreinte digitale"], a: 1, exp: "La caméra de l'administration fonctionnait parfaitement, contrairement à celles de la coopérative." },
    { type: "qcm", q: "Quel détail vestimentaire relie l'homme de la vidéo aux traces de l'entrepôt ?", opts: ["Sa casquette", "Ses bottes voyantes à semelle large", "Son manteau", "Ses gants"], a: 1, exp: "Unas llamativas botas de suela ancha, idénticas a las huellas del almacén." },
    { type: "input", q: "Comment s'appelle le coupable ? (un prénom)", a: ["Tomás", "Tomas"], ph: "prénom", exp: "Era Tomás, el trabajador más joven de la cooperativa." },
    { type: "vf", q: "Tomás travaillait à la coopérative depuis de nombreuses années.", a: false, exp: "Faux : « contratado apenas seis meses antes » : embauché six mois plus tôt." },
    { type: "qcm", q: "Quel était le mobile de Tomás ?", opts: ["La vengeance", "Une dette de jeu (loteries et paris)", "La jalousie", "Un pari stupide"], a: 1, exp: "Arrastraba una deuda de juego : il dépensait trop en loteries et paris." },
    { type: "qcm", q: "En quoi consiste l'ironie centrale du récit ?", opts: ["Un policier arrête un policier", "Un accro à la loterie est trahi par un billet de loterie", "L'huile n'avait aucune valeur", "Le voleur était innocent"], a: 1, exp: "Un adicto a la lotería iba a ser delatado por un décimo de lotería : ironie parfaite." },
    { type: "input", q: "Où les garrafas ont-elles été retrouvées ? Complète : « en el ___, tapadas con una lona ». (lieu)", a: ["garaje", "el garaje"], ph: "lieu", exp: "En el garaje, apenas tapadas con una lona vieja." },
    { type: "qcm", q: "Que comptait faire Tomás avec l'huile ?", opts: ["La garder pour lui", "La vendre à un acheteur d'une autre province pendant une foire", "L'offrir", "La détruire"], a: 1, exp: "Pensaba venderlas a un comprador de otra provincia durante una feria gastronómica." },
    { type: "qcm", q: "Pourquoi Tomás s'est-il arrêté au milieu du couloir (expliquant les traces) ?", opts: ["Il avait peur", "Son téléphone a sonné et le billet est tombé de sa poche", "Il a vu la police", "Il a changé d'avis"], a: 1, exp: "Le sonó el teléfono ; del susto, se le cayó el décimo sin darse cuenta." },
    { type: "vf", q: "La phrase « se le cayó el décimo » présente l'action comme volontaire.", a: false, exp: "Faux : le « se » involontaire indique une action subie, non voulue (le billet lui est tombé)." },
    { type: "qcm", q: "Quelle « morale » le sergent formule-t-il ?", opts: ["Le crime paie parfois", "Le délit parfait n'existe pas : on oublie toujours quelque chose", "Il faut acheter des caméras", "La loterie porte malheur"], a: 1, exp: "El delito perfecto no existe, muchacho. Siempre se olvida algo." },
    { type: "qcm", q: "Implicite : que sous-entend doña Remedios avec « esta la pueden aceptar sin remordimientos » ?", opts: ["Que l'huile est mauvaise", "Que, contrairement à Tomás, les agents peuvent accepter l'huile honnêtement", "Qu'elle est fâchée", "Que la police a volé l'huile"], a: 1, exp: "Sous-entendu par contraste : Tomás a pris l'huile malhonnêtement ; eux la reçoivent en cadeau, sans remords." },
    { type: "qcm", q: "Sens global : quel est le message de fond du fait divers ?", opts: ["La loterie est dangereuse", "Un détail minuscule peut faire échouer le crime le mieux préparé", "Il ne faut pas embaucher de jeunes", "Les coopératives sont mal protégées"], a: 1, exp: "Comme au jour 19, le ressort est l'insolite : un détail trivial (un billet) démasque le voleur." }
  ],
  final: {
    title: "Exercice final — Compréhension approfondie",
    intro: `<p>Maintenant que tu connais toute l'histoire, réponds à ces questions d'analyse globale, de chronologie et d'opinion :</p>
<pre class="pseudo">Piensa en el conjunto de las dos partes: los indicios, el

cronología y forma tu propia opinión sobre el desenlace.</pre>`,
    questions: [
      { type: "qcm", q: "Chronologie : quel événement s'est produit EN PREMIER ?", opts: ["On retrouve l'huile dans le garage", "Tomás entre de nuit avec sa clé et charge les garrafas", "La vendeuse montre la vidéo", "Le sergent trouve le billet"], a: 1, exp: "Le vol lui-même (nuit du samedi) précède la découverte et l'enquête." },
      { type: "qcm", q: "Quel enchaînement logique relie le billet au coupable ?", opts: ["Billet → ADN → suspect", "Billet daté → administration de Baeza → vidéo → bottes → Tomás", "Billet → témoin → aveu", "Billet → empreinte → prison"], a: 1, exp: "Le numéro et la date du décimo mènent au kiosque, puis à la vidéo, aux bottes et à Tomás." },
      { type: "input", q: "Quel mot résume l'ironie de l'histoire : un joueur trahi par un billet de… ? (un mot)", a: ["lotería", "loteria", "lotería"], ph: "mot", exp: "Un adicto a la lotería delatado por un décimo de lotería : ironie parfaite." },
      { type: "qcm", q: "Implicite : pourquoi personne ne soupçonnait Tomás au départ ?", opts: ["Il était très vieux", "C'était un jeune amable et ponctuel : l'apparence trompe", "Il n'avait pas de clé", "Il était en vacances"], a: 1, exp: "Un chico amable, del que nadie habría sospechado : le texte joue sur les apparences." },
      { type: "vf", q: "Opinion : la phrase du sergent « el delito perfecto no existe » résume bien la leçon du récit.", a: true, exp: "Vrai : c'est la morale explicite ; un détail oublié suffit à faire tomber le coupable." }
    ],
    solution: `<p>Synthèse de la compréhension approfondie :</p>
<pre class="pseudo">CHRONOLOGIE : (1) Tomás entre de nuit avec sa clé et vole les
  12 garrafas ; (2) son tél sonne, le décimo tombe ; (3) lundi,
  découverte du vol ; (4) enquête : pas d'effraction, huellas,
  décimo ; (5) le billet mène à l'administration de Baeza ;
  (6) la vidéo révèle les bottes → Tomás ; (7) mobile : dette
  de jeu ; (8) huile retrouvée au garage ; (9) aveux ; (10)
  restitution à temps pour la foire.
SENS GLOBAL : le crime le mieux préparé échoue sur un détail.
IRONIE      : un joueur trahi par un billet de loterie.
IMPLICITE   : l'apparence (« chico amable ») trompe ;
              la pique de doña Remedios oppose vol et cadeau.
MORALE      : « el delito perfecto no existe ».</pre>
<p>Tu viens de lire, comprendre et analyser un fait divers de deux pages : c'est exactement le niveau de lecture attendu en B2. Félicitations !</p>`
  }
};

    hints: [

    solution: "El fait divers trata del robo de doce garrafas de aceite premiado en una cooperativa de Jaén. Al principio, el caso parecía imposible de resolver, porque no había señales de robo forzado. Sin embargo, un pequeño décimo de lotería, que el ladrón perdió al sonarle el teléfono, terminó por delatarlo. Lo más irónico de toda la historia es que Tomás, un adicto al juego, fue descubierto precisamente por un billete de lotería. El texto también sugiere algo interesante: nadie sospechaba de él porque era joven y amable, lo que demuestra que las apariencias engañan. En mi opinión, el desenlace es justo, aunque también me da un poco de pena Tomás, porque su verdadero problema era la adicción al juego. Sin embargo, eso no justifica el robo. Creo que merecería una condena, pero también ayuda para superar su adicción. En definitiva, la historia confirma la frase del sargento: el delito perfecto no existe.\n\nTraduction : Le fait divers traite du vol de douze bidons d'huile primée dans une coopérative de Jaén. Au début, l'affaire semblait impossible à résoudre, car il n'y avait aucun signe d'effraction. Cependant, un petit billet de loterie, que le voleur a perdu quand son téléphone a sonné, a fini par le trahir. Le plus ironique de toute l'histoire est que Tomás, un accro au jeu, a été découvert précisément par un billet de loterie. Le texte suggère aussi quelque chose d'intéressant : personne ne le soupçonnait parce qu'il était jeune et aimable, ce qui montre que les apparences sont trompeuses. À mon avis, le dénouement est juste, même si Tomás me fait aussi un peu de peine, car son vrai problème était l'addiction au jeu. Cependant, cela ne justifie pas le vol. Je pense qu'il mériterait une condamnation, mais aussi une aide pour surmonter son addiction. En définitive, l'histoire confirme la phrase du sergent : le délit parfait n'existe pas.",
    note: "Cet exercice réunit tout le B2 : résumer (jour 23), analyser l'implicite et l'ironie (jours 20 et 22), et donner une opinion nuancée en concédant (jour 17). Une analyse complète articule les faits, le sens caché et un jugement personnel argumenté." }
