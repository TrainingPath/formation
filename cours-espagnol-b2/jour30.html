<script>
var DAY = {
  num: 30,
  title: "Projet final (4) : conversation fluide de 15 minutes",
  subtitle: "Tenir une conversation de A à Z : trame, relances, gap-fillers et auto-bilan du niveau B2.",
  theory: `
<h3>Projet final — La conversation fluide (15 minutes)</h3>
<p>Dernier projet, et couronnement du niveau B2 : soutenir une <strong>conversation fluide de quinze minutes</strong> en espagnol. Fluide ne veut pas dire parfait : cela veut dire enchaîner, relancer, gagner du temps quand on cherche ses mots, et rebondir sur l'autre. Ce jour te donne la trame, les outils et un auto-bilan final.</p>
<h3>1. La trame d'une conversation (les 4 phases)</h3>
<pre class="pseudo">1. SMALL TALK (romper el hielo)   ~2 min : saludos, el tiempo, cómo estás.
2. TEMAS (entrar en materia)      ~8 min : trabajo, viajes, aficiones, actualidad.
3. OPINIONES (profundizar)        ~4 min : dar opinión, debatir con matices.
4. CIERRE (despedirse)            ~1 min : resumir, agradecer, despedirse.</pre>
<div class="tip">Le secret de la fluidité : ne jamais laisser la conversation « tomber ». Après avoir répondu, RELANCE toujours par une question (« ¿Y tú? », « ¿Qué opinas?»). La conversation est un match de ping-pong : renvoie toujours la balle.</div>
<h3>2. Ouvrir et briser la glace</h3>
<pre class="pseudo">¿Qué tal? ¿Cómo te va?              Comment ça va ?
¡Cuánto tiempo sin vernos!          Ça fait longtemps !
¿Qué te cuentas?                    Quoi de neuf ?
Oye, ¿te has enterado de…?          Dis, tu es au courant de… ?
Por cierto, …                       Au fait, …</pre>
<h3>3. Les relances (mantener la conversación)</h3>
<pre class="pseudo">¿Y tú, qué opinas?                  Et toi, qu'en penses-tu ?
¿En serio? ¡No me digas!            Sans blague ! Non, tu rigoles !
¿Y eso por qué?                     Et pourquoi ça ?
Cuéntame más.                       Raconte-moi.
¿Cómo así? / ¿Y qué pasó?           Comment ça ? / Et alors ?
Anda, qué interesante.              Ah, comme c'est intéressant.</pre>
<h3>4. Les gap-fillers (muletillas : gagner du temps)</h3>
<p>Quand tu cherches tes mots, ne reste pas silencieux : utilise une <strong>muletilla</strong>. Ces petits mots donnent le temps de réfléchir et sonnent très naturels.</p>
<pre class="pseudo">bueno…              eh bien… / bon…
o sea…              c'est-à-dire… / enfin…
es que…             c'est que… (introduire une explication/excuse)
la verdad es que…   à vrai dire…
pues…               eh bien… / ben…
a ver…              voyons… / attends…
digamos que…        disons que…
en plan…            genre… (familier, jeune)</pre>
<div class="warn">Attention au dosage : les muletillas rendent le discours naturel, mais trop de « o sea » ou de « en plan » à la suite alourdit. Elles servent à respirer et à relier, pas à remplir chaque phrase. Écoute des natifs pour sentir le bon rythme.</div>
<h3>5. Nuancer, gagner du temps, reformuler</h3>
<pre class="pseudo">No sé cómo explicarlo, pero…        Je ne sais pas comment le dire, mais…
Lo que quiero decir es que…         Ce que je veux dire, c'est que…
¿Cómo se dice…?                     Comment on dit… ?
Perdona, me he liado.               Pardon, je me suis embrouillé(e).
Vamos, que…                         Bref, … / en gros…</pre>
<h3>6. Clôturer élégamment</h3>
<pre class="pseudo">Bueno, pues nada, …                 Bon, eh bien voilà, …
Oye, que me tengo que ir.           Dis, je dois y aller.
Ha sido un placer charlar contigo.  Ça a été un plaisir de discuter.
A ver si nos vemos pronto.          On se voit bientôt, j'espère.
¡Cuídate! / ¡Un abrazo!             Prends soin de toi ! / Je t'embrasse !</pre>
<h3>7. Auto-bilan B2 — Es-tu prêt(e) ?</h3>
<pre class="pseudo">Puedo…                                          ¿Sí / A veces / Todavía no?
… mantener una conversación de 15 min sin bloquearme.
… dar mi opinión y matizarla (aunque, sin embargo…).
… narrar en pasado (indefinido / imperfecto / pluscuamperfecto).
… usar el subjuntivo tras deseo, duda, emoción.
… entender un artículo o un fait divers de dos páginas.
… reaccionar y relanzar con naturalidad (muletillas incluidas).</pre>
<div class="tip">Objectif B2 atteint quand tu réponds « Sí » ou « A veces » à la plupart des lignes. Les « Todavía no » te montrent quoi réviser. La fluidité vient de la PRATIQUE : parle à voix haute, même seul(e), quinze minutes par jour.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la première phase d'une conversation ?", opts: ["Le débat d'opinions", "Le small talk (briser la glace)", "La clôture", "Les prétentions salariales"], a: 1, exp: "On commence par le small talk : saluer, briser la glace." },
    { type: "input", q: "Complète une ouverture : « ¡Cuánto ___ sin vernos! » (ça fait longtemps)", a: ["tiempo"], ph: "mot", exp: "¡Cuánto tiempo sin vernos! = ça fait longtemps qu'on ne s'est pas vus !" },
    { type: "qcm", q: "À quoi sert une « muletilla » (comme « bueno », « o sea ») ?", opts: ["À insulter", "À gagner du temps et relier ses idées", "À conclure définitivement", "À poser une question"], a: 1, exp: "Les muletillas comblent les silences et donnent le temps de réfléchir." },
    { type: "input", q: "Complète le gap-filler : « ___ que es un poco complicado. » (c'est que… ; introduit une explication)", a: ["Es"], ph: "mot", exp: "Es que… introduit une explication ou une excuse." },
    { type: "qcm", q: "« ¿Y tú, qué opinas? » est un exemple de :", opts: ["Clôture", "Relance (on renvoie la balle)", "Insulte", "Muletilla"], a: 1, exp: "C'est une relance : on redonne la parole à l'autre." },
    { type: "vf", q: "Pour rester fluide, il vaut mieux relancer par une question après avoir répondu.", a: true, exp: "Vrai : la conversation est un ping-pong ; on renvoie la balle." },
    { type: "qcm", q: "« ¿En serio? ¡No me digas! » exprime :", opts: ["L'ennui", "La surprise / l'intérêt", "Le refus", "L'au revoir"], a: 1, exp: "Marque la surprise et relance l'échange." },
    { type: "input", q: "Complète une muletilla : « La ___ es que no lo sabía. » (à vrai dire)", a: ["verdad"], ph: "mot", exp: "La verdad es que… = à vrai dire…" },
    { type: "qcm", q: "Que signifie « me he liado » ?", opts: ["J'ai fini", "Je me suis embrouillé(e)", "J'ai gagné", "J'ai compris"], a: 1, exp: "Liarse = s'embrouiller ; « perdona, me he liado » = pardon, je m'emmêle." },
    { type: "input", q: "Complète une clôture : « Ha sido un ___ charlar contigo. » (plaisir)", a: ["placer"], ph: "mot", exp: "Ha sido un placer = ça a été un plaisir." },
    { type: "vf", q: "Abuser des muletillas à chaque phrase rend le discours plus clair.", a: false, exp: "Faux : trop de « o sea / en plan » alourdit. Elles servent à respirer, pas à remplir." },
    { type: "qcm", q: "« Vamos, que al final no fui » veut dire :", opts: ["Allons-y", "Bref, finalement je n'y suis pas allé", "Je viens d'arriver", "Je pars maintenant"], a: 1, exp: "« Vamos, que… » = bref, en gros… : on résume/reformule." },
    { type: "input", q: "Complète : « ___ se dice ‘brouillon' en español? » (comment ; pour demander un mot)", a: ["Cómo", "Como"], ph: "mot", exp: "¿Cómo se dice…? = comment on dit… ? (stratégie pour combler un manque de vocabulaire)." },
    { type: "qcm", q: "Compréhension : dans « Bueno, pues nada, que me tengo que ir », le locuteur :", opts: ["Commence la conversation", "Est en train de clore la conversation", "Pose une question", "Se met en colère"], a: 1, exp: "« Bueno, pues nada… me tengo que ir » = formule de clôture : il prend congé." },
    { type: "qcm", q: "Compréhension : quel signe montre qu'on a atteint le B2 à l'oral ?", opts: ["Parler sans jamais faire d'erreur", "Enchaîner 15 min, relancer, nuancer et se rattraper avec des muletillas", "Traduire chaque mot du français", "Parler très vite sans écouter"], a: 1, exp: "Le B2, c'est la fluidité et la stratégie (relancer, reformuler), pas la perfection absolue." }
  ],
  final: {
    title: "Exercice final — Simula la conversación",
    intro: `<p>Voici des extraits d'une conversation de quinze minutes. Identifie la fonction de chaque réplique (ouverture, relance, muletilla, clôture) :</p>
<pre class="pseudo">A: ¡Hombre, cuánto tiempo! ¿Qué te cuentas?
B: Pues… la verdad es que muy liado con el trabajo. ¿Y tú?
A: Bien, bien. Oye, ¿te has enterado de lo del nuevo jefe?
B: ¿En serio? ¡No me digas! Cuéntame más.
A: Bueno, es que dicen que va a cambiarlo todo…
B: Vaya. Pues mira, que me tengo que ir, pero a ver si
   quedamos y me lo cuentas con calma.
A: ¡Claro! Ha sido un placer. ¡Un abrazo!</pre>`,
    questions: [
      { type: "qcm", q: "« ¡Hombre, cuánto tiempo! ¿Qué te cuentas? » sert à :", opts: ["Clôturer", "Ouvrir / briser la glace", "Débattre", "Négocier"], a: 1, exp: "C'est une ouverture chaleureuse : on brise la glace." },
      { type: "qcm", q: "Dans « Pues… la verdad es que muy liado », quels sont les gap-fillers ?", opts: ["muy / liado", "Pues… / la verdad es que", "trabajo / tú", "aucun"], a: 1, exp: "« Pues… » et « la verdad es que… » sont des muletillas qui font gagner du temps." },
      { type: "input", q: "Quelle réplique de B exprime la surprise et relance ? (recopie les trois mots après ¿En serio?)", a: ["¡No me digas!", "No me digas", "no me digas"], ph: "expression", exp: "« ¿En serio? ¡No me digas! » : surprise + relance (Cuéntame más)." },
      { type: "qcm", q: "« Pues mira, que me tengo que ir » marque :", opts: ["Le début", "Le début de la clôture (prendre congé)", "Une question", "Un désaccord"], a: 1, exp: "Le locuteur amorce la clôture : il doit partir." },
      { type: "vf", q: "Toute la conversation illustre les quatre phases : ouverture, sujet, réactions, clôture.", a: true, exp: "Vrai : small talk → sujet (nuevo jefe) → réactions/relances → clôture (un abrazo)." }
    ],
    solution: `<p>Fonction de chaque réplique :</p>
<pre class="pseudo">«¡Hombre, cuánto tiempo!»          → OUVERTURE (romper el hielo).
«Pues… la verdad es que…»          → MULETILLAS + réponse + relance (¿Y tú?).
«¿Te has enterado de lo del jefe?» → introduire un SUJET.
«¿En serio? ¡No me digas!»         → RELANCE (surprise, intérêt).
«Bueno, es que dicen que…»         → MULETILLAS + développement.
«que me tengo que ir…»             → amorce de CLÔTURE.
«Ha sido un placer. ¡Un abrazo!»   → CLÔTURE (despedida).</pre>
<p>Voilà une conversation fluide de A à Z : elle ouvre, enchaîne un sujet, réagit avec naturel, comble les silences par des muletillas et se referme poliment. Si tu sais faire cela quinze minutes durant, tu parles espagnol au niveau B2. ¡Enhorabuena!</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b2-j30", title: "Prépare ton monologue de présentation", level: 3,
    statement: "Prépare le monologue d'ouverture d'une conversation : présente-toi en 8 à 10 phrases (qui tu es, ce que tu fais, tes goûts, un projet), de façon fluide et naturelle. Intègre au moins trois muletillas (bueno, o sea, la verdad es que…) et termine par une relance qui donne la parole à l'autre.",
    hints: [
      "Commence naturellement : Bueno, pues… me llamo…",
      "Glisse des muletillas pour respirer : o sea, la verdad es que, digamos que…",
      "Termine par une relance : ¿Y tú, a qué te dedicas? / ¿Y tú, qué me cuentas?"
    ],
    solution: "Bueno, pues… me llamo Diego y tengo veintiocho años. La verdad es que soy de un pueblo pequeño del norte, pero ahora vivo en Madrid. Trabajo como programador, o sea, me paso el día delante del ordenador, aunque me encanta lo que hago. En mi tiempo libre, digamos que soy bastante activo: hago senderismo, toco la guitarra y, siempre que puedo, viajo. La verdad es que aprender idiomas es una de mis pasiones; ahora mismo estoy mejorando mi español y, o sea, me está costando pero disfruto mucho. Este año, si todo va bien, me gustaría hacer el Camino de Santiago. Bueno, ya he hablado bastante de mí… ¿Y tú, a qué te dedicas?\n\nTraduction : Bon, eh bien… je m'appelle Diego et j'ai vingt-huit ans. À vrai dire, je viens d'un petit village du nord, mais maintenant je vis à Madrid. Je travaille comme programmeur, enfin, je passe mes journées devant l'ordinateur, même si j'adore ce que je fais. Pendant mon temps libre, disons que je suis assez actif : je fais de la randonnée, je joue de la guitare et, dès que je peux, je voyage. À vrai dire, apprendre des langues est l'une de mes passions ; en ce moment je perfectionne mon espagnol et, enfin, j'ai du mal mais je prends beaucoup de plaisir. Cette année, si tout va bien, j'aimerais faire le Chemin de Saint-Jacques. Bon, j'ai déjà pas mal parlé de moi… Et toi, que fais-tu dans la vie ?",
    note: "Un bon monologue de présentation n'est pas récité comme une liste : il respire grâce aux muletillas (bueno, o sea, la verdad es que), varie les temps (présent, subjonctif après siempre que, conditionnel de projet), et se termine TOUJOURS par une relance pour lancer le dialogue. Entraîne-toi à voix haute et chronomètre-toi : c'est ta porte d'entrée vers une vraie conversation B2. ¡Enhorabuena por completar el curso!" }
  ]
};
</script>
