<script>
var DAY = {
  num: 3,
  title: "Les conditionnelles (si + subjonctif)",
  subtitle: "Maîtriser les trois types de phrases hypothétiques et le mode qu'elles imposent.",
  theory: `
<h3>1. Trois degrés de probabilité</h3>
<p>Une phrase conditionnelle articule une <strong>condition</strong> (la proposition en <em>si</em>) et une <strong>conséquence</strong> (la principale). En espagnol, tout dépend du degré de réalité : réel, irréel du présent, irréel du passé. Chaque type impose un couple de temps précis.</p>
<pre class="pseudo">Type              Condition (si...)          Conséquence
1. Réel/probable  si + PRÉSENT indicatif      présent / futur / impératif
2. Irréel présent si + SUBJ. IMPARFAIT        conditionnel simple
3. Irréel passé   si + SUBJ. PLUSCUAMPERFECTO condicional compuesto</pre>
<h3>2. Type 1 : la condition réelle</h3>
<p>La réalisation est possible, voire probable. On emploie l'<strong>indicatif présent</strong> après <em>si</em> et le présent, le futur ou l'impératif dans la principale.</p>
<pre class="pseudo">Si estudias, apruebas.           (Si tu étudies, tu réussis.)
Si llueve, no saldremos.         (S'il pleut, nous ne sortirons pas.)
Si tienes tiempo, llámame.       (Si tu as le temps, appelle-moi.)</pre>
<div class="warn">Après <em>si</em> de condition réelle, jamais de futur ni de conditionnel : on ne dit pas « si lloverá » ni « si llovería », mais <em>si llueve</em>. C'est une faute fréquente chez les francophones.</div>
<h3>3. Type 2 : l'irréel ou l'improbable du présent</h3>
<p>La condition est contraire à la réalité présente, ou jugée peu probable. On emploie le <strong>subjonctif imparfait</strong> après <em>si</em> et le <strong>conditionnel simple</strong> dans la principale.</p>
<pre class="pseudo">Si tuviera dinero, viajaría por el mundo.
(Si j'avais de l'argent, je voyagerais à travers le monde.) — mais je n'en ai pas
Si fueras más paciente, todo sería más fácil.
(Si tu étais plus patient, tout serait plus facile.)</pre>
<h3>4. Type 3 : l'irréel du passé (le regret)</h3>
<p>La condition ne s'est pas réalisée dans le passé : c'est le temps des regrets et des reproches. On emploie le <strong>subjonctif plus-que-parfait</strong> (hubiera/hubiese + participe) et le <strong>conditionnel passé</strong> (habría + participe).</p>
<pre class="pseudo">Si hubiera estudiado, habría aprobado.
(Si j'avais étudié, j'aurais réussi.) — mais je n'ai pas étudié
Si me lo hubieras dicho, te habría ayudado.
(Si tu me l'avais dit, je t'aurais aidé.)</pre>
<div class="tip">Mélange possible des types 2 et 3 : une cause passée peut avoir une conséquence présente. <em>Si hubiera ahorrado antes, ahora tendría una casa</em> (Si j'avais économisé avant, j'aurais maintenant une maison). Condition au type 3, conséquence au conditionnel simple.</div>
<h3>5. Autres conjonctions conditionnelles</h3>
<p>D'autres locutions introduisent une condition et exigent le <strong>subjonctif</strong> : <em>como</em> (menace), <em>siempre que, con tal de que, a menos que, en caso de que, a no ser que</em>.</p>
<pre class="pseudo">Como llegues tarde, me voy.        (Si jamais tu arrives en retard, je m'en vais.)
Te ayudo, siempre que me escuches. (Je t'aide, à condition que tu m'écoutes.)
No iré, a menos que me invites.    (Je n'irai pas, à moins que tu m'invites.)</pre>`,
  exercises: [
    { type: "qcm", q: "Après « si » de condition RÉELLE, quel mode/temps emploie-t-on ?", opts: ["Le futur", "Le conditionnel", "L'indicatif présent", "Le subjonctif présent"], a: 2, exp: "Condition réelle : si + présent de l'indicatif (si llueve, no salgo)." },
    { type: "input", q: "Complète (type 1) : « Si ___ (tener, tú) tiempo, llámame. »", a: ["tienes"], ph: "verbe", exp: "Condition réelle → présent : si tienes tiempo." },
    { type: "qcm", q: "« Si tuviera dinero, viajaría. » De quel type de conditionnelle s'agit-il ?", opts: ["Réelle", "Irréelle du présent", "Irréelle du passé", "Impérative"], a: 1, exp: "Subj. imparfait + conditionnel simple = irréel du présent." },
    { type: "input", q: "Complète (type 2) : « Si ___ (ser, tú) más paciente, todo sería más fácil. »", a: ["fueras", "fueses"], ph: "verbe", exp: "Irréel du présent : subjonctif imparfait fueras/fueses." },
    { type: "vf", q: "On peut dire « si lloverá, no saldré ».", a: false, exp: "Faux : jamais de futur après « si » de condition. Il faut : si llueve, no saldré." },
    { type: "qcm", q: "Quelle combinaison exprime l'irréel du PASSÉ (le regret) ?", opts: ["si + présent / futur", "si + subj. imparfait / conditionnel", "si + subj. pluscuamperfecto / conditionnel passé", "si + futur / impératif"], a: 2, exp: "Si hubiera... , habría... : irréel du passé." },
    { type: "input", q: "Complète (type 3) : « Si hubiera estudiado, ___ aprobado. » (auxiliaire du conditionnel passé)", a: ["habría"], ph: "auxiliaire", exp: "Conditionnel passé : habría + participe." },
    { type: "qcm", q: "« Si me lo hubieras dicho, te habría ayudado. » Quelle idée exprime cette phrase ?", opts: ["Un conseil pour l'avenir", "Un regret : tu ne me l'as pas dit", "Une condition réalisable", "Un ordre"], a: 1, exp: "Irréel du passé = reproche/regret sur ce qui n'a pas eu lieu." },
    { type: "input", q: "Complète : « No iré, a menos que me ___ (invitar, tú). »", a: ["invites"], ph: "verbe", exp: "A menos que + subjonctif présent : invites." },
    { type: "qcm", q: "« Como llegues tarde, me voy. » Que exprime « como » ici ?", opts: ["Une comparaison", "Une cause", "Une condition menaçante", "Une manière"], a: 2, exp: "Como + subjonctif = condition avec nuance d'avertissement." },
    { type: "vf", q: "« Siempre que » (à condition que) est suivi du subjonctif.", a: true, exp: "Vrai : siempre que me escuches, con tal de que vengas, etc." },
    { type: "input", q: "Complète (mixte 3+2) : « Si hubiera ahorrado, ahora ___ (tener) una casa. »", a: ["tendría"], ph: "verbe", exp: "Cause au passé (hubiera ahorrado), conséquence présente au conditionnel simple : tendría." },
    { type: "qcm", q: "Compréhension : « Si vienes, te enseño la ciudad. » Ce plan est :", opts: ["Impossible", "Un regret", "Réel et probable", "Passé"], a: 2, exp: "Type 1 : si + présent / présent → condition réelle et réalisable." },
    { type: "qcm", q: "Compréhension : « Si hubieras venido, lo habrías pasado bien. » Es-tu venu ?", opts: ["Oui", "Non, tu n'es pas venu", "On ne sait pas encore", "Tu viendras demain"], a: 1, exp: "Irréel du passé : la condition ne s'est PAS réalisée." },
    { type: "vf", q: "Dans « Si fuera rico, compraría un barco », la personne est effectivement riche.", a: false, exp: "Faux : irréel du présent → la personne n'est PAS riche." }
  ],
  final: {
    title: "Exercice final — Reflexiones sobre las decisiones",
    intro: `<p>Una persona reflexiona sobre su vida. Observa los tres tipos de condicionales :</p>
<pre class="pseudo">Si tengo un día libre, siempre lo dedico a leer o a caminar.
Si pudiera cambiar algo de mi rutina, dormiría un poco más.
Reconozco que, si hubiera viajado más de joven, hoy tendría otra visión del mundo.
No me arrepiento de nada, aunque si me lo hubieran preguntado antes, habría dudado.
Siempre que alguien me pide consejo, le digo lo mismo.
Como no cuides tu tiempo, la vida se te escapa sin darte cuenta.
Si volviera a nacer, elegiría el mismo camino, con más calma.
A menos que ocurra algo inesperado, seguiré viviendo así.</pre>`,
    questions: [
      { type: "qcm", q: "« Si tengo un día libre, lo dedico a leer » es una condicional:", opts: ["Real", "Irreal del presente", "Irreal del pasado", "Imposible"], a: 0, exp: "Si + presente / presente = condición real y habitual." },
      { type: "input", q: "« Si ___ cambiar algo, dormiría más » : subjonctif imparfait de PODER (yo)", a: ["pudiera", "pudiese"], ph: "verbe", exp: "Irreal del presente : subj. imperfecto + condicional." },
      { type: "vf", q: "« Si hubiera viajado más, hoy tendría otra visión » mezcla una causa pasada con una consecuencia presente.", a: true, exp: "Verdadero : condición tipo 3 (hubiera viajado) + consecuencia en condicional simple (tendría)." },
      { type: "input", q: "« si me lo ___ preguntado antes » : auxiliar del subjuntivo pluscuamperfecto (ellos)", a: ["hubieran", "hubiesen"], ph: "auxiliaire", exp: "Si me lo hubieran preguntado : irreal del pasado." },
      { type: "qcm", q: "« Como no cuides tu tiempo, la vida se te escapa. » ¿Qué matiz aporta « como »?", opts: ["Comparación", "Advertencia condicional", "Causa terminada", "Deseo"], a: 1, exp: "Como + subjuntivo introduce una condición con tono de advertencia." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Si j'ai une journée libre, je la consacre toujours à lire ou à marcher.
Si je pouvais changer quelque chose à ma routine, je dormirais un peu plus.
Je reconnais que, si j'avais voyagé davantage jeune, j'aurais aujourd'hui une autre vision du monde.
Je ne regrette rien, même si, si on me l'avait demandé avant, j'aurais hésité.
Chaque fois que quelqu'un me demande conseil, je lui dis la même chose.
Si tu ne prends pas soin de ton temps, la vie t'échappe sans que tu t'en aperçoives.
Si je renaissais, je choisirais le même chemin, avec plus de sérénité.
À moins qu'il n'arrive quelque chose d'inattendu, je continuerai à vivre ainsi.</pre>
<p>Retiens les trois couples : réel (si + présent / présent-futur), irréel présent (si + subj. imparfait / conditionnel), irréel passé (si + subj. plus-que-parfait / conditionnel passé). Les conjonctions comme <em>a menos que, siempre que, como</em> entraînent toujours le subjonctif.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "es-b2-j03", title: "Et si les choses avaient été différentes ?", level: 3,
    statement: "Rédige un paragraphe de 8 à 10 phrases mêlant les trois types de conditionnelles : au moins une condition réelle, deux irréelles du présent et deux irréelles du passé (regrets). Sujet libre : tes choix de vie, un voyage, une décision importante.",
    hints: [
      "Réel : Si tengo tiempo, aprendo idiomas.",
      "Irréel présent : Si viviera en España, hablaría mejor.",
      "Irréel passé : Si hubiera empezado antes, ahora sería bilingüe."
    ],
    solution: "Si tengo un rato libre por las tardes, siempre practico español. Sé que, si estudiara en el extranjero, aprendería mucho más rápido. A veces pienso que, si hubiera empezado de niño, hoy hablaría con total fluidez. No me arrepiento, pero si me lo hubieran explicado bien en el colegio, habría amado los idiomas mucho antes. Si pudiera, dedicaría una hora diaria solo a conversar. Como no sea constante, sé que olvidaré lo aprendido. Si viviera un año en Madrid, mi acento cambiaría por completo. Y si algún día tengo la oportunidad, no la dejaré escapar.\n\nTraduction : Si j'ai un moment libre l'après-midi, je pratique toujours l'espagnol. Je sais que, si j'étudiais à l'étranger, j'apprendrais beaucoup plus vite. Parfois je pense que, si j'avais commencé enfant, je parlerais aujourd'hui avec une aisance totale. Je ne regrette rien, mais si on me l'avait bien expliqué à l'école, j'aurais aimé les langues bien plus tôt. Si je pouvais, je consacrerais une heure par jour rien qu'à converser. Si je ne suis pas régulier, je sais que j'oublierai ce que j'ai appris. Si je vivais un an à Madrid, mon accent changerait complètement. Et si un jour j'en ai l'occasion, je ne la laisserai pas s'échapper.",
    note: "L'erreur classique du francophone est de mettre un conditionnel après « si ». Rappelle-toi : après « si », jamais de futur ni de conditionnel. Le conditionnel se place dans la principale ; c'est la subordonnée qui reçoit le subjonctif (imparfait ou plus-que-parfait)." }
  ]
};
