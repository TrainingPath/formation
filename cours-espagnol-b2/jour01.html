<script>
var DAY = {
  num: 1,
  title: "Réviser les temps du passé",
  subtitle: "Coordonner indefinido, imperfecto, pretérito perfecto et pluscuamperfecto dans un récit nuancé.",
  theory: `
<h3>1. Quatre temps, quatre fonctions</h3>
<p>Au niveau B2, on ne se contente plus d'opposer passé simple et imparfait : un récit soigné jongle avec <strong>quatre</strong> temps du passé, chacun avec un rôle précis. Les maîtriser ensemble, c'est donner du relief et de la profondeur temporelle à un texte.</p>
<pre class="pseudo">Temps espagnol           Rôle principal                     Exemple traduit
pretérito indefinido     action ponctuelle, achevée         Llegó a las ocho. (Il arriva à huit heures.)
pretérito imperfecto     décor, habitude, action en cours   Llovía sin parar. (Il pleuvait sans arrêt.)
pretérito perfecto       passé lié au présent               Hoy he trabajado mucho. (Aujourd'hui j'ai beaucoup travaillé.)
pluscuamperfecto         action antérieure à une autre      Cuando llegué, ya se había ido. (Quand j'arrivai, il était déjà parti.)</pre>
<h3>2. Indefinido contre imperfecto : la question du regard</h3>
<p>La différence n'est pas dans le fait lui-même mais dans la <strong>manière de le regarder</strong>. L'indefinido saisit l'action comme un bloc fermé ; l'imperfecto l'ouvre de l'intérieur, sans en marquer la fin.</p>
<pre class="pseudo">Aquel verano trabajé en un bar.   → j'y ai travaillé (période délimitée, terminée)
Aquel verano trabajaba en un bar. → j'y travaillais (toile de fond, habitude)</pre>
<div class="tip">Un même verbe peut changer de sens selon le temps : <em>conocí a María</em> (je fis la connaissance de María, événement) contre <em>conocía a María</em> (je connaissais María, état). De même : <em>supe la verdad</em> = j'appris la vérité ; <em>sabía la verdad</em> = je savais la vérité.</div>
<h3>3. Le pretérito perfecto : le passé qui touche le présent</h3>
<p>Formé avec <strong>haber au présent + participe</strong> (he, has, ha, hemos, habéis, han + hablado/comido/vivido), il relie l'action à un espace de temps encore ouvert : <em>hoy, esta semana, este año, ya, todavía no, alguna vez</em>.</p>
<pre class="pseudo">Este año he viajado a tres países.  (Cette année j'ai voyagé dans trois pays.)
¿Alguna vez has probado el ceviche? (As-tu déjà goûté le ceviche ?)</pre>
<div class="warn">Attention aux variations régionales : en Amérique latine et dans le nord-ouest de l'Espagne, on préfère souvent l'indefinido là où l'Espagne centrale emploie le perfecto (<em>hoy comí</em> plutôt que <em>hoy he comido</em>). Les deux sont corrects ; il faut surtout rester cohérent dans un même texte.</div>
<h3>4. Le pluscuamperfecto : un passé dans le passé</h3>
<p>Formé avec <strong>haber à l'imperfecto + participe</strong> (había, habías, había, habíamos, habíais, habían + participe), il exprime une action déjà accomplie <em>avant</em> un autre moment du passé. C'est l'outil de l'antériorité.</p>
<pre class="pseudo">Cuando encendí la tele, el partido ya había terminado.
(Quand j'allumai la télé, le match était déjà terminé.)
No reconocí la ciudad: la habían transformado por completo.
(Je ne reconnus pas la ville : on l'avait entièrement transformée.)</pre>
<h3>5. Orchestrer le récit</h3>
<p>Dans un récit écrit à la troisième personne, l'ossature est en général : <strong>imperfecto</strong> pour planter le décor, <strong>indefinido</strong> pour la chaîne des événements, <strong>pluscuamperfecto</strong> pour les retours en arrière. Le <strong>perfecto</strong>, lui, apparaît surtout dans les dialogues ou les bilans rattachés au présent du narrateur.</p>
<div class="tip">Repères lexicaux utiles : <em>de repente, entonces, al día siguiente</em> appellent l'indefinido ; <em>mientras, cada día, siempre</em> appellent l'imperfecto ; <em>ya, antes de eso, hasta entonces</em> appellent le pluscuamperfecto.</div>`,
  exercises: [
    { type: "qcm", q: "Quel temps exprime une action antérieure à un autre moment passé ?", opts: ["el imperfecto", "el pretérito perfecto", "el pluscuamperfecto", "el indefinido"], a: 2, exp: "Le pluscuamperfecto (había + participe) marque l'antériorité." },
    { type: "input", q: "Complète au pluscuamperfecto : « Cuando llegué, la reunión ya ___ empezado. » (empezar)", a: ["había"], ph: "auxiliaire", exp: "Ya había empezado : haber à l'imperfecto + participe." },
    { type: "qcm", q: "« Conocí a mi mejor amiga en 2010. » Que signifie « conocí » ici ?", opts: ["Je connaissais depuis longtemps", "Je fis sa connaissance (événement)", "Je reconnaissais", "Je savais"], a: 1, exp: "Conocer au indefinido = faire la connaissance, événement ponctuel." },
    { type: "input", q: "Mets au pretérito perfecto : « Este año (yo) ___ mucho. » (trabajar → forme complète he + participe)", a: ["he trabajado"], ph: "he + participe", exp: "Este año he trabajado mucho : passé rattaché au présent." },
    { type: "vf", q: "Le pretérito perfecto se forme avec « haber » à l'imparfait + participe.", a: false, exp: "Faux : le perfecto emploie haber au PRÉSENT (he, has, ha…). C'est le pluscuamperfecto qui utilise l'imparfait." },
    { type: "qcm", q: "Quelle phrase décrit une toile de fond (imperfecto) ?", opts: ["De repente sonó la alarma", "Era tarde y todos dormían", "Al día siguiente volvimos", "Ya había cenado"], a: 1, exp: "Era tarde y todos dormían : décor et action en cours → imperfecto." },
    { type: "input", q: "Complète : « Mientras yo ___ (cocinar), sonó el teléfono. » (imperfecto)", a: ["cocinaba"], ph: "verbe", exp: "Mientras + imperfecto pour l'action en cours ; sonó (indefinido) pour l'interruption." },
    { type: "qcm", q: "« Supe la noticia por la radio. » Sens de « supe » ?", opts: ["Je savais (état)", "J'appris (moment précis)", "Je saurai", "Je devais savoir"], a: 1, exp: "Saber au indefinido = apprendre, découvrir à un instant donné." },
    { type: "input", q: "Traduis « je savais la vérité » (état durable) : « Yo ___ la verdad. »", a: ["sabía"], ph: "verbe", exp: "Sabía = état durable → imperfecto (contre supe = j'appris)." },
    { type: "qcm", q: "« Cuando volví, alguien había entrado en casa. » L'entrée a eu lieu :", opts: ["Après mon retour", "Avant mon retour", "En même temps", "Dans le futur"], a: 1, exp: "El pluscuamperfecto (había entrado) situe l'action avant « volví »." },
    { type: "vf", q: "« Hoy he desayunado tarde » est cohérent car « hoy » ouvre un espace de temps rattaché au présent.", a: true, exp: "Vrai : hoy, esta semana, este año appellent le pretérito perfecto." },
    { type: "input", q: "Au pluscuamperfecto, 3e pers. sing. : « Él ya ___ salido. » (auxiliaire seul)", a: ["había"], ph: "auxiliaire", exp: "Había salido : haber imperfecto + participe." },
    { type: "qcm", q: "Compréhension : « Aquel verano trabajaba en un bar. » Quelle nuance ?", opts: ["Un job unique et bref", "Une occupation habituelle, en toile de fond", "Une action future", "Un événement soudain"], a: 1, exp: "L'imperfecto présente le travail comme une habitude, un décor de l'époque." },
    { type: "qcm", q: "Compréhension : « He roto el vaso, lo siento. » Pourquoi le perfecto ?", opts: ["L'action est très ancienne", "La conséquence est présente et actuelle", "C'est une habitude", "C'est une description"], a: 1, exp: "Le perfecto souligne le résultat encore présent : le verre est cassé maintenant." },
    { type: "vf", q: "Dans un récit, le pluscuamperfecto sert typiquement à insérer un retour en arrière.", a: true, exp: "Vrai : había + participe raconte ce qui s'était passé avant le fil principal." }
  ],
  final: {
    title: "Exercice final — Un regreso inesperado",
    intro: `<p>Lee este relato y fíjate en la coordinación de los tiempos del pasado :</p>
<pre class="pseudo">Cuando Marta llegó al pueblo, apenas lo reconoció.
Habían pasado quince años desde su marcha y todo había cambiado.
La plaza donde antes jugaba de niña ahora estaba llena de terrazas.
Mientras caminaba, recordaba las tardes de verano que había vivido allí.
De repente, una mujer la saludó: era su antigua vecina.
—No has cambiado nada —le dijo sonriendo.
Marta pensó que, en el fondo, ella tampoco había olvidado aquel lugar.
Aquella noche durmió en la casa de sus abuelos, que seguía en pie.
Antes de dormirse, comprendió que nunca se había ido del todo.
Esta mañana ha decidido quedarse una semana más.</pre>`,
    questions: [
      { type: "qcm", q: "¿Por qué se usa « había cambiado » al principio?", opts: ["Es una habitud pasada", "Marca lo ocurrido ANTES de la llegada de Marta", "Es una acción futura", "Describe el presente"], a: 1, exp: "El pluscuamperfecto sitúa el cambio antes del momento de la llegada." },
      { type: "input", q: "« La plaza donde antes ___ de niña » : ¿qué forma del imperfecto de JUGAR falta?", a: ["jugaba"], ph: "verbe", exp: "Jugaba : habitude passée en toile de fond." },
      { type: "vf", q: "« De repente, una mujer la saludó » está en indefinido porque es una acción puntual del relato.", a: true, exp: "Verdadero : de repente + acción puntual → indefinido." },
      { type: "qcm", q: "« Esta mañana ha decidido quedarse » usa el pretérito perfecto porque:", opts: ["Es un pasado muy lejano", "« Esta mañana » abre un tiempo ligado al presente", "Es una descripción", "Es una acción anterior a otra"], a: 1, exp: "Esta mañana pertenece al presente ampliado → pretérito perfecto." },
      { type: "input", q: "« nunca se ___ ido del todo » : auxiliar del pluscuamperfecto (3.ª pers.)", a: ["había"], ph: "auxiliaire", exp: "Se había ido : antériorité par rapport a la comprensión de Marta." }
    ],
    solution: `<p>Traduction du récit :</p>
<pre class="pseudo">Quand Marta arriva au village, elle le reconnut à peine.
Quinze ans s'étaient écoulés depuis son départ et tout avait changé.
La place où, enfant, elle jouait autrefois était maintenant pleine de terrasses.
Tandis qu'elle marchait, elle se souvenait des soirées d'été qu'elle avait vécues là.
Soudain, une femme la salua : c'était son ancienne voisine.
—Tu n'as pas changé du tout —lui dit-elle en souriant.
Marta pensa qu'au fond, elle non plus n'avait pas oublié cet endroit.
Cette nuit-là elle dormit dans la maison de ses grands-parents, toujours debout.
Avant de s'endormir, elle comprit qu'elle n'était jamais vraiment partie.
Ce matin, elle a décidé de rester une semaine de plus.</pre>
<p>Observe l'architecture : <strong>indefinido</strong> pour la trame (llegó, saludó, dijo, durmió, comprendió), <strong>imperfecto</strong> pour le décor et les habitudes (jugaba, caminaba, recordaba, estaba), <strong>pluscuamperfecto</strong> pour les retours en arrière (había cambiado, había vivido, se había ido) et <strong>pretérito perfecto</strong> pour le lien au présent du narrateur (ha decidido).</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b2-j01", title: "Un souvenir marquant", level: 3,
    statement: "Rédige un paragraphe de 8 à 10 phrases racontant un souvenir marquant, en coordonnant les quatre temps du passé : imperfecto (décor), indefinido (événements), pluscuamperfecto (retour en arrière) et au moins un pretérito perfecto rattaché à ton présent.",
    hints: [
      "Ouvre avec le décor à l'imperfecto : Era…, hacía…, había mucha gente…",
      "Enchaîne les événements au indefinido, puis glisse un pluscuamperfecto (ya había…).",
      "Termine par un bilan au pretérito perfecto : Desde entonces, he…"
    ],
    solution: "Era una tarde de otoño y el cielo estaba gris. Yo tenía dieciocho años y acababa de mudarme a una ciudad que no conocía. Aquel día salí a caminar sin rumbo porque me sentía sola. De repente, encontré una pequeña librería que no había visto antes. Entré y el dueño me recomendó una novela que cambió mi manera de leer. Cuando volví a casa, ya había decidido que aquel lugar sería mi refugio. Durante meses, cada semana regresaba a comprar un libro. Desde entonces, he vuelto muchas veces y siempre recuerdo aquella tarde gris con cariño.\n\nTraduction : C'était un après-midi d'automne et le ciel était gris. J'avais dix-huit ans et je venais de déménager dans une ville que je ne connaissais pas. Ce jour-là je sortis marcher sans but parce que je me sentais seule. Soudain, je trouvai une petite librairie que je n'avais pas vue auparavant. J'entrai et le patron me recommanda un roman qui changea ma façon de lire. Quand je rentrai chez moi, j'avais déjà décidé que cet endroit serait mon refuge. Pendant des mois, chaque semaine je retournais acheter un livre. Depuis, j'y suis retournée bien des fois et je me souviens toujours avec tendresse de cet après-midi gris.",
    note: "La richesse d'un récit B2 tient à la superposition des plans temporels : le pluscuamperfecto crée de la profondeur (ce qui précède), et le pretérito perfecto relie l'histoire à ton présent de narrateur. Varie aussi les connecteurs (de repente, durante meses, desde entonces)." }
  ]
};
</script>
