<script>
var DAY = {
  num: 12,
  title: "Le registre : formel ou informel",
  subtitle: "Adapter le ton, le vouvoiement et le lexique à la situation et à l'interlocuteur.",
  theory: `
<h3>1. Deux mondes : tú et usted</h3>
<p>Le choix du <strong>registre</strong> commence par la personne : <em>tú</em> (tutoiement, informel) contre <em>usted</em> (vouvoiement, formel). <em>Usted</em> se conjugue à la <strong>3e personne</strong>, ce qui déroute souvent les francophones. Le pluriel formel est <em>ustedes</em> (en Amérique latine, <em>ustedes</em> sert aussi de pluriel informel).</p>
<pre class="pseudo">Informel (tú)              Formel (usted)
¿Cómo estás?               ¿Cómo está (usted)?
¿Qué quieres?              ¿Qué desea?
Dame tu opinión.           ¿Podría darme su opinión?
Tu correo                  Su correo</pre>
<div class="warn">Erreur fréquente : mélanger les deux registres dans une même phrase. Ne dis pas « ¿Cómo está, puedes ayudarme? » mais reste cohérent : soit <em>¿Cómo estás? ¿Puedes ayudarme?</em> (tú), soit <em>¿Cómo está? ¿Podría ayudarme?</em> (usted).</div>
<h3>2. Le registre formel : marques principales</h3>
<pre class="pseudo">- Vouvoiement systématique (usted / ustedes)
- Conditionnel de politesse : ¿Podría...? ¿Sería tan amable de...? Me gustaría...
- Subjonctif de courtoisie : Quisiera pedirle un favor.
- Formules d'ouverture/clôture : Estimado señor, Le saludo atentamente.
- Lexique soutenu : solicitar (au lieu de pedir), disculpar (au lieu de perdonar),
  agradecer (au lieu de dar las gracias), comunicar (au lieu de decir).</pre>
<pre class="pseudo">Formel :   Le agradecería que me enviara la información a la mayor brevedad.
           (Je vous saurais gré de m'envoyer l'information dans les meilleurs délais.)
Informel : ¿Me mandas la info cuando puedas? Gracias.</pre>
<h3>3. Le registre informel : marques principales</h3>
<pre class="pseudo">- Tutoiement (tú / vosotros)
- Impératif direct : Dime, oye, mira, venga
- Interjections et fillers : bueno, o sea, en plan, ¿sabes?, vale
- Apócopes et mots courts : profe (professeur), cole (école), finde (fin de semana)
- Expressions familières et diminutifs : un ratito, ahorita, un poquito</pre>
<div class="tip">Le registre familier abonde en <strong>muletillas</strong> (mots béquilles) : <em>o sea, en plan, ¿no?, pues, bueno, vamos</em>. Naturelles à l'oral entre amis, elles sont à bannir d'un écrit formel où elles font négligé.</div>
<h3>4. Adoucir et rester courtois</h3>
<p>Le formel privilégie l'<strong>indirection</strong> : on formule les demandes de façon détournée pour ne pas paraître brusque. Le conditionnel, le subjonctif et les tournures impersonnelles servent cet adoucissement.</p>
<pre class="pseudo">Direct (informel) :   Cierra la ventana.        (Ferme la fenêtre.)
Atténué (formel) :    ¿Le importaría cerrar la ventana? (Cela vous dérangerait-il de...?)
Direct :              Quiero hablar con el director.
Atténué :             Quisiera hablar con el director, si es posible.
Direct :              Estás equivocado.
Atténué :             Quizá haya habido un malentendido.</pre>
<h3>5. Choisir selon la situation</h3>
<pre class="pseudo">Situation                         Registre conseillé
Entretien d'embauche, courrier    formel (usted)
administratif, client inconnu
Collègue proche, ami, famille     informel (tú)
E-mail professionnel neutre       formel modéré (usted, ton cordial)
Réseaux sociaux, chat entre amis  très informel (abréviations, emojis)</pre>
<div class="warn">Dans le monde hispanophone, le passage du <em>usted</em> au <em>tú</em> peut être proposé explicitement : <em>Podemos tutearnos</em> (On peut se tutoyer). Attendre ce signal évite les impairs, surtout avec une personne plus âgée ou hiérarchiquement supérieure.</div>`,
  exercises: [
    { type: "qcm", q: "À quelle personne grammaticale se conjugue « usted » ?", opts: ["2e personne du singulier", "1re personne", "3e personne du singulier", "2e personne du pluriel"], a: 2, exp: "Usted se conjugue à la 3e personne : usted está, usted quiere." },
    { type: "input", q: "Passe au formel : « ¿Cómo estás? » → « ¿Cómo ___ usted? » (verbe estar)", a: ["está"], ph: "verbe", exp: "Usted → 3e personne : ¿Cómo está usted?" },
    { type: "qcm", q: "Quelle formule appartient au registre FORMEL ?", opts: ["Oye, dame eso", "¿Podría darme su opinión?", "¿Me lo pasas?", "Venga, dime"], a: 1, exp: "Le conditionnel de politesse (¿Podría...?) marque le registre formel." },
    { type: "input", q: "Complète (formel, verbe soutenu = demander/solliciter) : « Le escribo para ___ información sobre el puesto. »", a: ["solicitar"], ph: "verbe", exp: "Solicitar (formel) au lieu de pedir." },
    { type: "vf", q: "« Quisiera hablar con usted » est plus courtois que « Quiero hablar con usted ».", a: true, exp: "Vrai : le subjonctif imparfait « quisiera » adoucit la demande." },
    { type: "qcm", q: "Quel mot est une « muletilla » du registre familier ?", opts: ["Atentamente", "O sea", "Estimado", "Agradecería"], a: 1, exp: "O sea est un mot béquille typiquement oral et informel." },
    { type: "input", q: "Passe au formel : « Dame tu correo » → « ¿Podría darme ___ correo? » (possessif formel)", a: ["su"], ph: "possessif", exp: "Tu (informel) → su (formel, correspond à usted)." },
    { type: "qcm", q: "« Le saludo atentamente » est une formule :", opts: ["De salutation orale entre amis", "De clôture d'un courrier formel", "D'insulte", "De question"], a: 1, exp: "Formule de clôture soutenue d'une lettre/e-mail formel." },
    { type: "input", q: "Complète (formel, atténuation) : « ¿Le ___ cerrar la ventana? » (verbe importar)", a: ["importaría"], ph: "verbe", exp: "¿Le importaría...? = cela vous dérangerait-il de...? (courtoisie)." },
    { type: "qcm", q: "« Profe », « cole », « finde » relèvent de quel registre ?", opts: ["Formel", "Familier (apócopes)", "Administratif", "Littéraire"], a: 1, exp: "Ce sont des mots raccourcis familiers : profesor, colegio, fin de semana." },
    { type: "vf", q: "Il est correct de mélanger « tú » et « usted » dans une même phrase adressée à la même personne.", a: false, exp: "Faux : il faut rester cohérent tout au long de l'échange." },
    { type: "input", q: "Complète (formel, verbe = remercier) : « Le ___ su atención. » (agradecer, yo, présent)", a: ["agradezco"], ph: "verbe", exp: "Le agradezco su atención (formel, au lieu de « gracias »)." },
    { type: "qcm", q: "Compréhension : « Podemos tutearnos. » Que propose cette personne ?", opts: ["De se vouvoyer", "De se tutoyer", "De se taire", "De partir"], a: 1, exp: "Tutearnos = passer au tutoiement (tú)." },
    { type: "qcm", q: "Compréhension : « Le agradecería que me enviara los datos a la mayor brevedad. » Quel registre ?", opts: ["Familier", "Formel et courtois", "Vulgaire", "Neutre oral"], a: 1, exp: "Conditionnel + subjonctif + lexique soutenu = registre formel." },
    { type: "vf", q: "Sur les réseaux sociaux entre amis, le registre très informel (abréviations, emojis) est approprié.", a: true, exp: "Vrai : chaque situation appelle son registre ; l'informel domine entre amis en ligne." }
  ],
  final: {
    title: "Exercice final — El mismo mensaje, dos registros",
    intro: `<p>Compara cómo una misma petición cambia según el registro. Primero, versión formal ; después, informal :</p>
<pre class="pseudo">FORMAL (a un profesor):
Estimado profesor Martínez:
Le escribo para solicitar una tutoría, pues me gustaría que me aclarara algunas dudas.
¿Sería tan amable de indicarme cuándo dispondría de un momento?
Le agradezco de antemano su atención y quedo a la espera de su respuesta.
Atentamente, Laura Gómez.

INFORMAL (a un compañero):
¡Hola, Dani!
Oye, ¿me echas una mano con lo del examen? Es que hay cosas que no pillo.
¿Cuándo te viene bien quedar? Cuando puedas, vamos.
¡Gracias, crack! Un abrazo, Laura.</pre>`,
    questions: [
      { type: "qcm", q: "« ¿Sería tan amable de indicarme...? » pertenece al registro:", opts: ["Informal", "Formal y cortés", "Vulgar", "Juvenil"], a: 1, exp: "Sería tan amable de... es una fórmula de cortesía formal." },
      { type: "input", q: "En la versión formal, ¿qué verbo soutenu sustituye a « pedir »? « Le escribo para ___ una tutoría. »", a: ["solicitar"], ph: "verbe", exp: "Solicitar es el equivalente formal de pedir." },
      { type: "vf", q: "« ¿me echas una mano...? » y « Oye » corresponden al registro informal.", a: true, exp: "Verdadero : tutoiement, expresión idiomática y muletilla « oye » son informales." },
      { type: "qcm", q: "« Atentamente » y « Un abrazo » son:", opts: ["Dos fórmulas informales", "Dos fórmulas formales", "Dos cierres: uno formal, otro informal", "Dos saludos de apertura"], a: 2, exp: "Atentamente cierra un texto formal ; Un abrazo, uno informal." },
      { type: "input", q: "« ¿Cuándo te ___ bien quedar? » : verbe VENIR (usté informel, 3e pers.) dans l'expression « te viene bien »", a: ["viene"], ph: "verbe", exp: "Venirle bien a alguien = arranger quelqu'un : ¿cuándo te viene bien?" }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">FORMEL (à un professeur) :
Cher professeur Martínez,
Je vous écris pour solliciter un rendez-vous, car j'aimerais que vous m'éclaircissiez quelques points.
Auriez-vous l'amabilité de m'indiquer quand vous auriez un moment ?
Je vous remercie par avance de votre attention et reste dans l'attente de votre réponse.
Cordialement, Laura Gómez.

INFORMEL (à un camarade) :
Salut Dani !
Dis, tu me donnes un coup de main pour l'examen ? Il y a des trucs que je ne capte pas.
Quand est-ce que ça t'arrange de se voir ? Dès que tu peux, allez.
Merci, t'es un chef ! Je t'embrasse, Laura.</pre>
<p>Le même besoin se dit de deux manières radicalement différentes. Retiens les marqueurs du formel (usted, conditionnel de politesse, verbes soutenus, formules d'ouverture et de clôture) et ceux de l'informel (tú, impératifs directs, muletillas, expressions familières). La compétence B2, c'est de savoir passer de l'un à l'autre à volonté.</p>`
  }
};
</script>
