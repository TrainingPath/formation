<script>
var DAY = {

  title: "Projet final (1) : lire un fait divers de 2 pages",
  subtitle: "Première moitié d'un vrai fait divers espagnol : le vol de l'huile primée. Lis, comprends, retiens.",
  theory: `
<h3>Projet final — Le grand fait divers (partie 1 sur 2)</h3>
<p>Voici le premier des quatre projets finaux. Pendant deux jours, tu vas lire un <strong>fait divers original de deux pages</strong>, écrit spécialement pour ce cours. Aujourd'hui, tu lis la <strong>première moitié</strong> et tu réponds aux questions. Demain (jour 28), tu liras la fin et tu travailleras la compréhension approfondie. Lis lentement, deux fois si besoin. Le lexique d'aide est en dessous.</p>
<h3>El ladrón al que delató un décimo de lotería (Parte 1)</h3>
<p>La pequeña cooperativa de aceite de Villanueva de los Olivares, un pueblo tranquilo de la provincia de Jaén, vivió el pasado otoño el suceso más comentado de su historia. Todo empezó un lunes de octubre, cuando los trabajadores llegaron al almacén y descubrieron que la puerta trasera estaba abierta de par en par.</p>
<p>Al principio pensaron en un simple descuido. Sin embargo, al entrar, comprendieron que algo grave había ocurrido: faltaban las doce garrafas del aceite más valioso de la cooperativa, un aceite de oliva virgen extra que acababa de ganar una medalla de oro en un concurso internacional. Aquel aceite, embotellado en ediciones limitadas, estaba valorado en varios miles de euros y representaba el orgullo de todo el pueblo.</p>
<p>La cooperativa avisó de inmediato a la Guardia Civil. Los agentes llegaron una hora después y comenzaron a inspeccionar el almacén con lupa. La escena, sin embargo, resultaba desconcertante. No había ninguna ventana rota, ninguna cerradura forzada, ningún signo de violencia. Parecía que el ladrón hubiera entrado y salido como un fantasma.</p>
<p>La encargada, doña Remedios, una mujer menuda de setenta años que conocía cada rincón del almacén, no salía de su asombro. «Yo misma cerré la puerta el sábado por la noche», repetía, «y le juro que eché la llave dos veces». Los agentes, pacientes, tomaban notas y fotografiaban cada detalle.</p>
<p>Pronto surgió la primera pista. En el polvo del suelo, junto a las estanterías vacías, había huellas de unas botas de suela ancha. Las huellas se dirigían hacia la salida, pero se detenían de golpe a mitad del pasillo, como si el ladrón se hubiera parado a pensar. «Aquí ocurrió algo», murmuró el sargento. «Nadie se detiene en medio de un robo sin motivo.»</p>
<p>Efectivamente, en aquel punto exacto los investigadores encontraron un objeto que no encajaba en un almacén de aceite: un décimo de lotería arrugado, tirado en el suelo, medio escondido bajo una estantería. El papel estaba fechado apenas tres días antes del robo.</p>
<p>El sargento lo recogió con cuidado, usando unas pinzas y una bolsa de pruebas. «Puede que no signifique nada», comentó uno de los agentes jóvenes. «O puede que lo signifique todo», respondió el sargento, guardando el décimo con una media sonrisa.</p>
<p>Mientras tanto, doña Remedios seguía dándole vueltas a un detalle que la inquietaba. El ladrón conocía perfectamente el almacén: había ido directo a las garrafas más caras, sin tocar las demás. «Esto no es obra de un desconocido», pensó. «Quien hizo esto sabía muy bien lo que buscaba.»</p>
<p>Aquella misma tarde, la Guardia Civil pidió las grabaciones de las cámaras de seguridad. Pero surgió un nuevo problema: las cámaras del almacén llevaban dos semanas averiadas, algo que, curiosamente, solo sabían los propios trabajadores de la cooperativa. La sospecha empezó a planear, silenciosa, sobre el pequeño equipo del pueblo.</p>
<p>El sargento reunió a todos en la oficina. Los miró uno a uno, sin acusar a nadie, y dijo con calma: «No se preocupen. A veces, el error más pequeño delata al culpable. Y creo que ese error ya lo tenemos en una bolsa de pruebas.» Nadie dijo nada. Fuera, empezaba a anochecer sobre los olivos.</p>
<h3>Lexique d'aide</h3>
<pre class="pseudo">la cooperativa           la coopérative
el aceite (de oliva)     l'huile (d'olive)
la garrafa               le bidon / la bonbonne
el almacén               l'entrepôt
de par en par            grand(e) ouvert(e)
el descuido              l'étourderie, l'oubli
la cerradura forzada     la serrure forcée
el/la encargado/a        le/la responsable
echar la llave           fermer à clé
la pista                 la piste / l'indice
las huellas (de botas)   les traces (de bottes)
la suela                 la semelle
el décimo de lotería     le billet de loterie (dixième)
arrugado/a               froissé(e)
las pinzas               la pince
la bolsa de pruebas      le sachet de scellés
dar vueltas a algo       ressasser / se creuser la tête
averiado/a               en panne / hors service
planear (la sospecha)    planer (le soupçon)
el/la culpable           le/la coupable</pre>
<div class="tip">Stratégie de lecture longue : à la fin de chaque paragraphe, résume-le mentalement en une phrase. Note les personnages (doña Remedios, el sargento), les lieux (el almacén) et les indices (las huellas, el décimo). Demain, tu auras besoin de te souvenir de tout cela pour comprendre la résolution.</div>
<div class="warn">Repère les temps du récit : indefinido pour l'action (empezó, descubrieron, encontraron), imperfecto pour le décor (conocía, repetía), et le pretérito pluscuamperfecto de subjonctif dans les comparaisons hypothétiques (« como si el ladrón hubiera entrado como un fantasma »). Cette dernière structure, très B2, exprime une comparaison imaginaire.</div>`,
  exercises: [
    { type: "qcm", q: "Où se déroule le fait divers ?", opts: ["Dans une bijouterie de Madrid", "Dans une coopérative d'huile d'olive de Jaén", "Dans une banque de Séville", "Dans un musée de Tolède"], a: 1, exp: "La cooperativa de aceite de Villanueva de los Olivares, provincia de Jaén." },
    { type: "qcm", q: "Qu'a-t-on volé exactement ?", opts: ["De l'argent liquide", "Douze bidons d'huile d'olive primée", "Une médaille d'or", "Des oliviers"], a: 1, exp: "Faltaban las doce garrafas del aceite más valioso, primé d'une médaille d'or." },
    { type: "input", q: "Comment les employés ont-ils trouvé la porte de derrière ? Complète : « abierta de ___ en par ». (grand ouverte)", a: ["par"], ph: "mot", exp: "Abierta de par en par = grande ouverte." },
    { type: "vf", q: "Il y avait une fenêtre cassée et une serrure forcée.", a: false, exp: "Faux : « No había ninguna ventana rota, ninguna cerradura forzada » : aucune effraction visible." },
    { type: "qcm", q: "Pourquoi la scène était-elle « desconcertante » (déconcertante) ?", opts: ["Il y avait trop d'indices", "Aucun signe d'effraction : le voleur semblait entré comme un fantôme", "L'huile était encore là", "La police était en retard"], a: 1, exp: "Ni fenêtre cassée, ni serrure forcée : comme si le voleur était entré comme un fantôme." },
    { type: "input", q: "Qui est doña Remedios ? Complète : « la ___ del almacén ». (fonction : la responsable)", a: ["encargada", "la encargada"], ph: "fonction", exp: "Doña Remedios, la encargada (responsable) du dépôt." },
    { type: "qcm", q: "Quel indice a-t-on trouvé dans la poussière du sol ?", opts: ["Des empreintes digitales", "Des traces de bottes à semelle large", "Une clé", "Une bouteille cassée"], a: 1, exp: "Huellas de unas botas de suela ancha." },
    { type: "qcm", q: "Où les traces de bottes s'arrêtent-elles ?", opts: ["À la porte d'entrée", "Brusquement au milieu du couloir", "Sur le parking", "Devant les caméras"], a: 1, exp: "Se detenían de golpe a mitad del pasillo, comme si le voleur s'était arrêté." },
    { type: "input", q: "Quel objet insolite a-t-on trouvé au sol, à moitié caché sous une étagère ? Complète : « un ___ de lotería ». (billet)", a: ["décimo"], ph: "mot", exp: "Un décimo de lotería arrugado : le billet de loterie froissé." },
    { type: "qcm", q: "Quelle particularité avait ce billet de loterie ?", opts: ["Il était gagnant", "Il était daté trois jours avant le vol", "Il était déchiré en deux", "Il appartenait à doña Remedios"], a: 1, exp: "El papel estaba fechado apenas tres días antes del robo." },
    { type: "vf", q: "Le voleur a pris toutes les garrafas, y compris les moins chères.", a: false, exp: "Faux : « había ido directo a las garrafas más caras, sin tocar las demás »." },
    { type: "qcm", q: "Pourquoi doña Remedios pense-t-elle que ce n'est pas l'œuvre d'un inconnu ?", opts: ["Parce que la porte était ouverte", "Parce que le voleur connaissait parfaitement l'entrepôt et savait quoi chercher", "Parce qu'il a laissé le billet", "Parce que la police l'a dit"], a: 1, exp: "Quien hizo esto sabía muy bien lo que buscaba : le voleur connaissait les lieux." },
    { type: "qcm", q: "Quel détail rend les employés suspects ?", opts: ["Ils étaient absents", "Seuls eux savaient que les caméras étaient en panne depuis deux semaines", "Ils avaient les clés", "Ils détestaient doña Remedios"], a: 1, exp: "Las cámaras llevaban dos semanas averiadas, algo que solo sabían los trabajadores." },
    { type: "qcm", q: "Que sous-entend le sergent en disant « ese error ya lo tenemos en una bolsa de pruebas » ?", opts: ["Qu'il abandonne l'enquête", "Que le billet de loterie pourrait confondre le coupable", "Que les caméras marchent", "Qu'il accuse doña Remedios"], a: 1, exp: "Il suggère que le décimo (dans le sachet de scellés) est l'erreur qui trahira le voleur." },
    { type: "qcm", q: "Compréhension globale : à la fin de cette première partie, le suspect est plutôt :", opts: ["Un inconnu de passage", "Quelqu'un qui connaît la coopérative de l'intérieur", "Un touriste", "Un client mécontent"], a: 1, exp: "Tout converge vers quelqu'un de l'intérieur : lieux connus, caméras HS, garrafas ciblées." }
  ],
  final: {
    title: "Exercice final — Reconstituer les indices",
    intro: `<p>Avant de découvrir la suite demain, fais le point sur ce que l'on sait. Réponds à ces questions de synthèse sur la première moitié :</p>
<pre class="pseudo">Recuerda los tres indicios clave: (1) no hay señales de
robo forzado; (2) unas huellas que se detienen de golpe;
(3) un décimo de lotería fechado tres días antes. Además,
las cámaras estaban averiadas y solo los trabajadores lo
sabían. Piensa como un detective.</pre>`,
    questions: [
      { type: "qcm", q: "Quel indice sera probablement décisif pour identifier le voleur ?", opts: ["Les traces de bottes", "Le billet de loterie daté", "La porte ouverte", "La médaille d'or"], a: 1, exp: "Le décimo, daté et probablement acheté quelque part, peut mener à son propriétaire." },
      { type: "qcm", q: "Que suggère l'absence totale d'effraction ?", opts: ["Le voleur avait une clé ou connaissait l'accès", "Le voleur était très fort", "Il n'y a pas eu de vol", "La police s'est trompée"], a: 0, exp: "Pas d'effraction → accès facile → probablement quelqu'un ayant clé ou connaissance des lieux." },
      { type: "input", q: "Quel détail rend les employés de la coopérative suspects ? (un mot : les caméras étaient…)", a: ["averiadas", "averiada", "en panne"], ph: "état", exp: "Seuls les employés savaient que les cámaras estaban averiadas." },
      { type: "qcm", q: "Le ton de cette première partie est celui d'un :", opts: ["Article scientifique", "Récit policier à suspense", "Texte publicitaire", "Poème"], a: 1, exp: "Suspense, indices, sergent perspicace : c'est un récit policier (fait divers criminel)." },
      { type: "vf", q: "À ce stade, on ne connaît pas encore l'identité du voleur.", a: true, exp: "Vrai : la première partie pose l'énigme ; la résolution vient au jour 28." }
    ],
    solution: `<p>Bilan des indices à la fin de la partie 1 :</p>
<pre class="pseudo">INDICE 1 : aucune effraction → accès sans forcer (clé/lieux connus).
INDICE 2 : huellas de botas qui s'arrêtent net → le voleur s'est
           arrêté, sans doute là où il a perdu quelque chose.
INDICE 3 : un décimo de lotería daté 3 jours avant le vol → objet
           traçable qui peut mener à son acheteur.
CONTEXTE : cámaras averiadas, su seul les employés le savaient
           → soupçon d'un coup monté « de l'intérieur ».</pre>
<p>La mécanique du fait divers policier est en place : une énigme apparemment parfaite (aucune trace), fissurée par un détail insignifiant (un billet froissé). Demain, tu découvriras comment ce petit papier va tout révéler.</p>`
  }
};
</script>

  items: [
  { id: "es-b2-j27", title: "Formule ton hypothèse", level: 3,
    statement: "Tu es l'enquêteur. À partir des indices de la première moitié, rédige en espagnol (6 à 8 phrases) TON hypothèse sur l'identité du voleur et sa méthode. Emploie le langage de la probabilité (puede que + subj., el ladrón habrá…, seguramente, es probable que…).",
    hints: [
      "Rappelle les indices : no hubo robo forzado, las huellas, el décimo…",
      "Suppose avec le futur/conditionnel de conjecture : El ladrón conocería el almacén…",
      "Emploie puede que + subjonctif et es probable que + subjonctif."
    ],
    solution: "En mi opinión, el ladrón no era un desconocido, sino alguien relacionado con la cooperativa. Como no hubo ninguna cerradura forzada, es probable que tuviera una llave o que conociera bien el acceso. Además, fue directo a las garrafas más caras, así que seguramente sabía exactamente lo que buscaba. El detalle de las cámaras averiadas me hace pensar que puede que fuera uno de los propios trabajadores, porque solo ellos lo sabían. En cuanto al décimo de lotería, el ladrón lo habrá perdido sin darse cuenta cuando se detuvo en el pasillo. Sospecho que ese papel lo delatará, porque la Guardia Civil podrá averiguar dónde y cuándo lo compró.\n\nTraduction : À mon avis, le voleur n'était pas un inconnu, mais quelqu'un lié à la coopérative. Comme aucune serrure n'a été forcée, il est probable qu'il avait une clé ou qu'il connaissait bien l'accès. De plus, il est allé droit aux bidons les plus chers, donc il savait sûrement exactement ce qu'il cherchait. Le détail des caméras en panne me fait penser qu'il se peut que ce soit l'un des employés eux-mêmes, car eux seuls le savaient. Quant au billet de loterie, le voleur a dû le perdre sans s'en rendre compte quand il s'est arrêté dans le couloir. Je soupçonne que ce papier le trahira, car la Guardia Civil pourra découvrir où et quand il l'a acheté.",
    note: "Cet exercice combine deux compétences du B2 : la compréhension d'un texte long et le langage de la conjecture (jour 24). Appuie chaque hypothèse sur un indice précis du texte : c'est ce qui rend un raisonnement convaincant." }
  ]
};
