<script>
var DAY = {
  num: 20,
  title: "Analyser un fait divers en détail",
  subtitle: "Aller au-delà des faits : style, chronologie fine, sous-entendus et point de vue du journaliste.",
  theory: `
<h3>1. Comprendre, puis analyser</h3>
<p>Au jour 19, tu as appris à <strong>comprendre</strong> un fait divers (qui, quoi, quand). Aujourd'hui tu vas plus loin : tu vas l'<strong>analyser</strong>. Analyser, c'est observer <em>comment</em> le texte est écrit et <em>ce qu'il suggère</em> sans le dire : le choix des mots, l'ordre du récit, le ton, le point de vue.</p>
<h3>2. Les cinq niveaux d'analyse</h3>
<pre class="pseudo">1. Los hechos     : que s'est-il passé exactement ?
2. La cronología  : dans quel ordre ? (avec pluscuamperfecto)
3. El léxico      : quels mots forts, quelles connotations ?
4. El punto de vista : le journaliste est-il neutre ou pas ?
5. Lo implícito   : que suggère le texte sans le dire ?</pre>
<h3>3. Le fait divers du jour</h3>
<p>Perro héroe: un labrador salva a una familia de un incendio</p>
<p>Un perro llamado Toby se ha convertido en el héroe de un pequeño pueblo de Asturias tras salvar a toda una familia de un incendio que se declaró de madrugada. El fuego, provocado por un cortocircuito, comenzó en la cocina mientras los cuatro miembros de la familia dormían profundamente.</p>
<p>Según los vecinos, Toby empezó a ladrar con insistencia y a arañar la puerta del dormitorio de los padres. Al principio, el matrimonio pensó que el animal simplemente quería salir. Sin embargo, el perro no se rendía: tiraba de las mantas y no dejaba de gemir. Cuando el padre por fin se levantó, el pasillo ya estaba lleno de humo.</p>
<p>Gracias a la alerta del perro, la familia logró despertar a los dos niños y salir de la casa apenas unos minutos antes de que el techo de la cocina se derrumbara. Los bomberos, que llegaron media hora después, confirmaron que, de no ser por el animal, el desenlace habría sido trágico.</p>
<p>«Toby es uno más de la familia, pero desde aquella noche lo tratamos como a un rey», bromeó la madre, todavía emocionada. El ayuntamiento del pueblo ha anunciado que entregará al perro una medalla simbólica durante las próximas fiestas.</p>
<h3>4. Analyse guidée du texte</h3>
<div class="tip">Lexique connotatif : le mot <strong>héroe</strong> dès le titre oriente le lecteur (le chien est valorisé). Des verbes forts (<em>arañar</em> = griffer, <em>gemir</em> = gémir, <em>derrumbarse</em> = s'effondrer) rendent la scène dramatique et vivante.</div>
<pre class="pseudo">Implicite du texte              Ce qui n'est pas dit mais suggéré
«pensó que quería salir»        les parents ont failli ignorer l'alerte
«no se rendía»                  l'insistance du chien fut décisive
«de no ser por el animal»       sans lui, la famille serait morte
«lo tratamos como a un rey»     gratitude + humour tendre</pre>
<h3>5. Le point de vue et le ton</h3>
<p>Le journaliste n'est pas totalement neutre : le mot <em>héroe</em>, la citation attendrie de la mère et l'annonce de la médaille donnent au récit un <strong>ton positif et émouvant</strong>. Ce fait divers appartient à la catégorie « bonne nouvelle », par opposition au fait divers criminel du jour 19.</p>
<div class="warn">Le conditionnel composé du récit : <strong>«el desenlace habría sido trágico»</strong> (l'issue AURAIT été tragique) exprime une conséquence hypothétique qui ne s'est PAS produite grâce au chien. C'est une structure clé pour analyser ce qui « aurait pu arriver ».</div>`,
  exercises: [
    { type: "qcm", q: "Quel animal est le héros de ce fait divers ?", opts: ["Un chat", "Un chien labrador nommé Toby", "Un cheval", "Un perroquet"], a: 1, exp: "Un perro llamado Toby, un labrador." },
    { type: "input", q: "Quelle est la cause de l'incendie ? Complète : « provocado por un ___ ». (court-circuit)", a: ["cortocircuito", "un cortocircuito"], ph: "cause", exp: "Provocado por un cortocircuito = provoqué par un court-circuit." },
    { type: "qcm", q: "Comment le chien a-t-il donné l'alerte ?", opts: ["En ouvrant la porte", "En aboyant et en griffant la porte de la chambre", "En appelant les pompiers", "En sortant de la maison"], a: 1, exp: "Empezó a ladrar y a arañar la puerta del dormitorio." },
    { type: "vf", q: "Les parents ont tout de suite compris le danger.", a: false, exp: "Faux : « Al principio pensó que el animal quería salir » : ils ont failli l'ignorer." },
    { type: "qcm", q: "Le verbe « derrumbarse » (le toit s'est écroulé) sert à :", opts: ["Rassurer le lecteur", "Rendre la scène dramatique", "Décrire un objet", "Faire de l'humour"], a: 1, exp: "Verbe fort qui dramatise : le toit s'est effondré juste après leur sortie." },
    { type: "input", q: "Que signifie « arañar » ? (un verbe français)", a: ["griffer", "gratter"], ph: "verbe", exp: "Arañar = griffer (avec les griffes)." },
    { type: "qcm", q: "« de no ser por el animal, el desenlace habría sido trágico » suggère que :", opts: ["Le chien a aggravé la situation", "Sans le chien, la famille serait morte", "Personne n'était en danger", "Les pompiers ont tout fait"], a: 1, exp: "Conditionnel hypothétique : sans le chien, l'issue aurait été tragique." },
    { type: "qcm", q: "« habría sido trágico » est :", opts: ["Un futur simple", "Un conditionnel composé (aurait été)", "Un passé simple", "Un présent"], a: 1, exp: "Habría + participe = conditionnel composé : conséquence hypothétique non réalisée." },
    { type: "input", q: "Complète : « el perro no se ___ » (il ne se rendait pas / n'abandonnait pas ; verbe rendirse, él).", a: ["rendía"], ph: "verbe", exp: "No se rendía = il n'abandonnait pas (imperfecto de rendirse)." },
    { type: "vf", q: "Le mot « héroe » dans le titre montre que le texte valorise le chien.", a: true, exp: "Vrai : c'est un mot connotatif qui oriente positivement la lecture." },
    { type: "qcm", q: "Quel est le TON général de ce fait divers ?", opts: ["Sombre et accusateur", "Positif et émouvant (bonne nouvelle)", "Neutre et technique", "Ironique et critique"], a: 1, exp: "Héroe, émotion de la mère, médaille : ton positif, catégorie « bonne nouvelle »." },
    { type: "input", q: "Combien de temps après les pompiers sont-ils arrivés ? Complète : « media ___ después ». (temps)", a: ["hora"], ph: "temps", exp: "Media hora después = une demi-heure plus tard." },
    { type: "qcm", q: "« lo tratamos como a un rey » (on le traite comme un roi) exprime :", opts: ["De la colère", "De la gratitude teintée d'humour", "De l'indifférence", "De la peur"], a: 1, exp: "C'est une hyperbole affectueuse : gratitude et tendresse humoristique." },
    { type: "qcm", q: "Analyse : pourquoi le journaliste précise-t-il « mientras los cuatro dormían profundamente » ?", opts: ["Pour remplir le texte", "Pour souligner le danger : personne ne pouvait s'apercevoir du feu", "Pour critiquer la famille", "Pour parler du chien"], a: 1, exp: "Ce détail accentue le péril : sans le chien, personne ne se serait réveillé à temps." },
    { type: "qcm", q: "À quelle catégorie ce fait divers s'oppose-t-il ?", opts: ["Au fait divers sportif", "Au fait divers criminel (comme le vol du jour 19)", "À l'article scientifique", "À la publicité"], a: 1, exp: "C'est une bonne nouvelle, à l'inverse du suceso criminel (le vol du tableau)." }
  ],
  final: {
    title: "Exercice final — Análisis en profundidad",
    intro: `<p>Analyse ce fait divers au-delà des simples faits. Concentre-toi sur le style, l'implicite et le point de vue :</p>
<pre class="pseudo">Fíjate en las palabras que elige el periodista (héroe,
arañar, derrumbarse), en lo que el texto sugiere sin decirlo
(la familia estuvo a punto de morir) y en el tono (positivo,
emotivo). Recuerda: analizar no es solo entender qué pasó,
sino cómo se cuenta y qué se insinúa.</pre>`,
    questions: [
      { type: "qcm", q: "Quel effet produit le mot « héroe » dès le titre ?", opts: ["Il rend le texte neutre", "Il oriente le lecteur à admirer le chien", "Il annonce un crime", "Il crée du suspense négatif"], a: 1, exp: "Mot connotatif positif : il valorise le chien avant même le récit." },
      { type: "qcm", q: "Que suggère « el techo se derrumbó apenas unos minutos después de salir » ?", opts: ["Que la maison était solide", "Que la famille l'a échappé belle, de très peu", "Que personne n'était en danger", "Que les pompiers étaient là"], a: 1, exp: "L'implicite : ils sont sortis juste à temps ; le danger était extrême." },
      { type: "input", q: "Quel temps verbal exprime « ce qui serait arrivé sans le chien » ? Complète : « el desenlace ___ sido trágico ». (auxiliaire)", a: ["habría"], ph: "auxiliaire", exp: "Habría sido = conditionnel composé : conséquence hypothétique évitée." },
      { type: "qcm", q: "Le point de vue du journaliste est plutôt :", opts: ["Critique envers la famille", "Bienveillant et admiratif envers le chien", "Totalement neutre et froid", "Sarcastique"], a: 1, exp: "Le vocabulaire et les citations montrent une posture bienveillante." },
      { type: "vf", q: "Analyser un texte, c'est aussi observer ce qu'il suggère sans le dire (l'implicite).", a: true, exp: "Vrai : l'analyse dépasse les faits pour interroger le style, le ton et les sous-entendus." }
    ],
    solution: `<p>Grille d'analyse appliquée au texte :</p>
<pre class="pseudo">HECHOS       : un incendie, un chien alerte, la famille se sauve.
CRONOLOGÍA   : feu en cuisine → aboiements → réveil → sortie →
               effondrement du toit → arrivée des pompiers.
LÉXICO       : héroe, arañar, gemir, derrumbarse = dramatisation.
PUNTO DE VISTA : bienveillant, admiratif (pas neutre).
IMPLÍCITO    : la famille a frôlé la mort ; sans Toby, tragédie.
TONO         : positif, émouvant, « bonne nouvelle ».</pre>
<p>Le fait divers n'est jamais un simple compte rendu : par le choix des mots et la conduite du récit, le journaliste construit une émotion et un jugement. Savoir le repérer, c'est lire en B2.</p>`
  }
};
</script>

var ECRITURE = {

  items: [
  { id: "es-b2-j20", title: "Analyse un fait divers", level: 3,
    statement: "Rédige une courte analyse (6 à 8 phrases) du fait divers du chien Toby, en espagnol. Ne te contente pas de résumer : commente le vocabulaire choisi, l'implicite et le ton du journaliste.",
    hints: [
      "Distingue les faits (los hechos) et l'analyse (el análisis).",
      "Cite des mots forts : héroe, arañar, derrumbarse, et explique leur effet.",
      "Termine par le ton et l'implicite : sin el perro, el desenlace habría sido trágico."
    ],
    solution: "El texto cuenta cómo un perro llamado Toby salvó a una familia de un incendio en Asturias. Más allá de los hechos, el periodista elige un vocabulario muy expresivo: desde el título, la palabra «héroe» orienta al lector a admirar al animal. Verbos como «arañar», «gemir» y «derrumbarse» dramatizan la escena y transmiten tensión. El texto también sugiere algo sin decirlo directamente: cuando afirma que el techo se derrumbó pocos minutos después de que salieran, entendemos que la familia estuvo a punto de morir. La frase «de no ser por el animal, el desenlace habría sido trágico» confirma ese peligro con un condicional. En cuanto al tono, no es neutro: es positivo y emotivo, propio de una «buena noticia». En definitiva, el periodista no solo informa, sino que construye la emoción del lector.\n\nTraduction : Le texte raconte comment un chien nommé Toby a sauvé une famille d'un incendie en Asturies. Au-delà des faits, le journaliste choisit un vocabulaire très expressif : dès le titre, le mot « héros » pousse le lecteur à admirer l'animal. Des verbes comme « griffer », « gémir » et « s'effondrer » dramatisent la scène et transmettent la tension. Le texte suggère aussi quelque chose sans le dire directement : quand il affirme que le toit s'est effondré peu de minutes après leur sortie, on comprend que la famille a frôlé la mort. La phrase « sans l'animal, l'issue aurait été tragique » confirme ce danger avec un conditionnel. Quant au ton, il n'est pas neutre : il est positif et émouvant, propre à une « bonne nouvelle ». En définitive, le journaliste ne se contente pas d'informer : il construit l'émotion du lecteur.",
    note: "Analyser, c'est répondre à « comment est-ce écrit ? » et « qu'est-ce que cela suggère ? ». Appuie chaque affirmation sur un mot précis du texte (héroe, habría sido) : c'est ce qui distingue une analyse d'un simple résumé." }
  ]
};
</script>
