<script>
var DAY = {
  num: 15,
  title: "L'entretien d'embauche approfondi (méthode STAR)",
  subtitle: "Répondre aux questions de comportement avec structure : Situación, Tarea, Acción, Resultado.",
  theory: `
<h3>1. L'entretien de comportement</h3>
<p>Lors d'un <strong>entretien d'embauche</strong> (entrevista de trabajo), les recruteurs posent souvent des questions dites <em>de comportement</em> : « Racontez-moi une fois où… ». Elles cherchent à vérifier, par des exemples concrets du passé, comment vous agissez réellement. Pour y répondre clairement, on utilise la <strong>méthode STAR</strong>.</p>
<h3>2. La méthode STAR</h3>
<pre class="pseudo">S - Situación   Le contexte : où, quand, quel était le cadre ?
T - Tarea       Ta mission, l'objectif ou le problème à résoudre.
A - Acción      Les actions concrètes que TU as menées (« yo », pas « nosotros »).
R - Resultado   Le résultat obtenu, si possible chiffré et positif.</pre>
<div class="tip">STAR se traduit en espagnol par <strong>SITUACIÓN, TAREA, ACCIÓN, RESULTADO</strong>. La structure est identique : elle transforme une réponse vague en une histoire concrète et convaincante, avec un début, un milieu et une fin.</div>
<h3>3. Le vocabulaire de chaque étape</h3>
<pre class="pseudo">SITUACIÓN :  En mi anterior empleo... / Hace dos años, cuando trabajaba en...
             Nos encontrábamos ante... / El contexto era el siguiente...
TAREA :      Mi responsabilidad era... / El objetivo consistía en...
             Se me encargó... / Tenía que resolver...
ACCIÓN :     Lo primero que hice fue... / Decidí... / Propuse... / Me encargué de...
             Para ello, organicé / coordiné / analicé / implementé...
RESULTADO :  Como resultado, ... / Gracias a ello, logramos... / Conseguimos...
             El proyecto se completó... / Aumentamos las ventas en un 15%.</pre>
<div class="warn">À l'étape ACCIÓN, parle à la <strong>première personne du singulier</strong> (« yo hice, yo propuse »). Le recruteur veut connaître TA contribution, pas seulement celle de l'équipe. Trop de « nosotros » dilue ta responsabilité personnelle.</div>
<h3>4. Exemples de questions et réponses STAR</h3>
<p><strong>Pregunta :</strong> <em>Hábleme de un momento en el que tuvo que resolver un conflicto.</em></p>
<pre class="pseudo">SITUACIÓN: En mi anterior trabajo, dos compañeros de mi equipo
           discutían constantemente y eso afectaba al proyecto.
TAREA:     Como coordinadora, mi tarea era restablecer un buen
           ambiente y cumplir con los plazos.
ACCIÓN:    Organicé una reunión individual con cada uno, escuché
           sus quejas y propuse repartir las tareas de otra forma.
RESULTADO: Gracias a ello, la tensión desapareció y entregamos
           el proyecto a tiempo, incluso antes de lo previsto.</pre>
<p><strong>Pregunta :</strong> <em>Cuénteme una vez en la que cometió un error.</em></p>
<pre class="pseudo">SITUACIÓN: Durante mis prácticas, envié un informe con datos
           desactualizados a un cliente importante.
TAREA:     Debía corregir el error rápidamente y mantener la
           confianza del cliente.
ACCIÓN:    Avisé de inmediato a mi supervisor, preparé una versión
           corregida y llamé personalmente para disculparme.
RESULTADO: El cliente valoró mi honestidad y seguimos trabajando
           juntos. Aprendí a revisar siempre los datos antes de enviarlos.</pre>
<h3>5. Questions fréquentes et conseils</h3>
<pre class="pseudo">Preguntas típicas :
- Hábleme de usted. / ¿Por qué quiere trabajar con nosotros?
- ¿Cuáles son sus puntos fuertes y débiles?
- Cuénteme un logro del que se sienta orgulloso/a.
- ¿Dónde se ve dentro de cinco años?
- ¿Cómo trabaja bajo presión?</pre>
<div class="tip">Pour la question des points faibles, choisis un défaut réel mais présente les mesures prises pour t'améliorer : <em>A veces soy demasiado perfeccionista, pero he aprendido a priorizar y a delegar</em>. Ne jamais répondre « No tengo defectos » : cela sonne arrogant et peu sincère.</div>
<div class="warn">Prépare deux ou trois anecdotes STAR polyvalentes (un conflit, un succès, un échec surmonté) : bien rodées, elles peuvent servir à répondre à de nombreuses questions différentes. La préparation est la clé d'un entretien réussi.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme STAR en espagnol ?", opts: ["Sueño, Trabajo, Acción, Reto", "Situación, Tarea, Acción, Resultado", "Salario, Turno, Ambiente, Riesgo", "Sí, Total, Ahora, Rápido"], a: 1, exp: "STAR = Situación, Tarea, Acción, Resultado." },
    { type: "input", q: "Complète l'étape S : « En mi anterior ___, dos compañeros discutían. » (mot = emploi/travail)", a: ["empleo", "trabajo"], ph: "mot", exp: "En mi anterior empleo/trabajo... introduit la Situación." },
    { type: "qcm", q: "À quelle personne doit-on parler à l'étape ACCIÓN ?", opts: ["À la 1re personne du pluriel (nosotros)", "À la 1re personne du singulier (yo)", "À la 3e personne", "Peu importe"], a: 1, exp: "L'étape Acción met en valeur TA contribution : yo hice, yo propuse." },
    { type: "input", q: "Complète l'étape T : « Mi ___ era restablecer un buen ambiente. » (mot = responsabilité/tâche)", a: ["tarea", "responsabilidad"], ph: "mot", exp: "Mi tarea / responsabilidad era... = étape Tarea." },
    { type: "vf", q: "Un bon résultat (Resultado) gagne à être concret, voire chiffré.", a: true, exp: "Vrai : « aumentamos las ventas en un 15% » est plus convaincant qu'un résultat vague." },
    { type: "qcm", q: "Quelle formule introduit l'étape RESULTADO ?", opts: ["El contexto era...", "Mi responsabilidad era...", "Gracias a ello, logramos...", "Lo primero que hice fue..."], a: 2, exp: "Gracias a ello / Como resultado introduisent le Resultado." },
    { type: "input", q: "Complète l'étape A : « Lo primero que ___ fue organizar una reunión. » (verbe hacer, yo, indefinido)", a: ["hice"], ph: "verbe", exp: "Lo primero que hice fue... = amorce de l'Acción." },
    { type: "qcm", q: "Face à la question des points faibles, quelle réponse est la meilleure ?", opts: ["No tengo defectos", "A veces soy perfeccionista, pero he aprendido a delegar", "Soy muy vago", "Nunca llego puntual"], a: 1, exp: "Un défaut réel + les mesures prises pour progresser : honnête et positif." },
    { type: "input", q: "Complète (question typique) : « ¿Por qué quiere ___ con nosotros? » (verbe = travailler)", a: ["trabajar"], ph: "verbe", exp: "¿Por qué quiere trabajar con nosotros? = question fréquente en entretien." },
    { type: "qcm", q: "Pourquoi éviter les « nosotros » à l'étape Acción ?", opts: ["C'est grammaticalement faux", "Cela dilue ta responsabilité personnelle", "C'est trop long", "Le recruteur ne comprend pas"], a: 1, exp: "Le recruteur veut connaître TA contribution, pas seulement celle du groupe." },
    { type: "vf", q: "La méthode STAR structure une réponse en un récit avec début, milieu et fin.", a: true, exp: "Vrai : Situación (début) → Tarea/Acción (milieu) → Resultado (fin)." },
    { type: "input", q: "Complète (étape S) : « Hace dos años, cuando ___ en una agencia... » (verbe trabajar, imperfecto, yo)", a: ["trabajaba"], ph: "verbe", exp: "Cuando trabajaba en... plante le décor (Situación)." },
    { type: "qcm", q: "Compréhension : « Como resultado, entregamos el proyecto antes de lo previsto. » À quelle étape STAR correspond cette phrase ?", opts: ["Situación", "Tarea", "Acción", "Resultado"], a: 3, exp: "Como resultado... annonce le Resultado (bilan positif)." },
    { type: "qcm", q: "Compréhension : « Se me encargó coordinar el equipo de ventas. » À quelle étape ?", opts: ["Situación", "Tarea (la mission confiée)", "Acción", "Resultado"], a: 1, exp: "Se me encargó... décrit la Tarea, la mission assignée." },
    { type: "vf", q: "Préparer à l'avance deux ou trois anecdotes STAR polyvalentes est un bon conseil.", a: true, exp: "Vrai : des exemples bien rodés (conflit, succès, échec) servent à de nombreuses questions." }
  ],
  final: {
    title: "Exercice final — Una respuesta STAR completa",
    intro: `<p>Un candidato responde a la pregunta « Cuénteme un logro del que se sienta orgulloso ». Analiza la estructura STAR :</p>
<pre class="pseudo">— Cuénteme un logro del que se sienta orgulloso.

— Con mucho gusto. Hace un año, cuando trabajaba como responsable
de atención al cliente, la empresa recibía muchas quejas por los
tiempos de espera. (SITUACIÓN)

Mi tarea consistía en reducir esas esperas y mejorar la satisfacción
de los clientes en un plazo de tres meses. (TAREA)

Para lograrlo, analicé los datos de llamadas, reorganicé los turnos
del equipo y propuse un nuevo sistema de citas previas. Además,
formé a mis compañeros en el uso de la nueva herramienta. (ACCIÓN)

Como resultado, el tiempo de espera se redujo a la mitad y la
satisfacción del cliente aumentó en un 30%. Me siento orgulloso
porque logré un cambio real trabajando en equipo. (RESULTADO)</pre>`,
    questions: [
      { type: "qcm", q: "« la empresa recibía muchas quejas por los tiempos de espera » corresponde a:", opts: ["La tarea", "La situación (contexto)", "La acción", "El resultado"], a: 1, exp: "Describe el contexto inicial : es la Situación." },
      { type: "input", q: "« Mi ___ consistía en reducir esas esperas » : mot qui nomme l'étape (la mission)", a: ["tarea"], ph: "mot", exp: "Mi tarea consistía en... = étape Tarea." },
      { type: "vf", q: "En la parte de ACCIÓN, el candidato usa verbos en primera persona (analicé, reorganicé, propuse).", a: true, exp: "Verdadero : la Acción se cuenta en primera persona para destacar la contribución propia." },
      { type: "input", q: "« Como ___, el tiempo de espera se redujo a la mitad » : mot qui introduit le bilan", a: ["resultado"], ph: "mot", exp: "Como resultado... introduit le Resultado." },
      { type: "qcm", q: "¿Por qué la respuesta es eficaz?", opts: ["Es muy larga", "Sigue la estructura STAR y aporta un resultado concreto y medible", "No da ningún dato", "Habla solo del equipo"], a: 1, exp: "Estructura clara + resultado cuantificado (30%) = respuesta convincente." }
    ],
    solution: `<p>Traduction du dialogue :</p>
<pre class="pseudo">— Parlez-moi d'une réussite dont vous êtes fier.

— Avec plaisir. Il y a un an, lorsque je travaillais comme responsable
du service client, l'entreprise recevait beaucoup de plaintes à cause des
temps d'attente. (SITUATION)

Ma mission consistait à réduire ces attentes et à améliorer la satisfaction
des clients dans un délai de trois mois. (TÂCHE)

Pour y parvenir, j'ai analysé les données d'appels, réorganisé les horaires
de l'équipe et proposé un nouveau système de rendez-vous. De plus,
j'ai formé mes collègues à l'usage du nouvel outil. (ACTION)

Résultat, le temps d'attente a été réduit de moitié et la
satisfaction client a augmenté de 30%. Je suis fier
parce que j'ai obtenu un changement réel en travaillant en équipe. (RÉSULTAT)</pre>
<p>Cette réponse coche toutes les cases : un contexte clair, une mission précise, des actions à la première personne (analicé, reorganicé, propuse, formé) et un résultat chiffré (30%). C'est exactement ce que recherche un recruteur. Prépare tes propres anecdotes STAR et entraîne-toi à les raconter à voix haute : c'est la meilleure façon d'aborder un entretien avec confiance.</p>`
  }
};
</script>

<script>

  { id: "es-b2-j15", title: "Ta réponse STAR", level: 3,

    hints: [

    ],
    solution: "Pregunta: Cuénteme una vez en la que tuvo que trabajar bajo presión.\n\n(Situación) Hace un año, durante mi último empleo, un compañero clave se puso enfermo justo antes de la entrega de un proyecto importante. (Tarea) Mi responsabilidad era asegurar que el trabajo se completara a tiempo, a pesar de que faltaba una persona esencial del equipo. (Acción) Lo primero que hice fue reorganizar las tareas y asumir personalmente la parte más urgente. Coordiné al resto del equipo, establecí prioridades claras y me quedé algunas horas extra para revisar cada detalle. Además, mantuve informado al cliente en todo momento para evitar sorpresas. (Resultado) Como resultado, entregamos el proyecto en la fecha prevista y con una calidad excelente. El cliente quedó muy satisfecho y mi jefe reconoció públicamente mi capacidad de gestión. Aprendí que, bajo presión, la organización y la comunicación son las mejores herramientas.\n\nTraduction :\nQuestion : Racontez-moi une fois où vous avez dû travailler sous pression.\n(Situation) Il y a un an, lors de mon dernier emploi, un collègue clé est tombé malade juste avant la remise d'un projet important. (Tâche) Ma responsabilité était de garantir que le travail soit achevé à temps, malgré l'absence d'une personne essentielle de l'équipe. (Action) La première chose que j'ai faite a été de réorganiser les tâches et d'assumer personnellement la partie la plus urgente. J'ai coordonné le reste de l'équipe, établi des priorités claires et je suis resté quelques heures supplémentaires pour vérifier chaque détail. De plus, j'ai tenu le client informé à tout moment pour éviter les surprises. (Résultat) Résultat, nous avons livré le projet à la date prévue et avec une excellente qualité. Le client a été très satisfait et mon patron a reconnu publiquement ma capacité de gestion. J'ai appris que, sous pression, l'organisation et la communication sont les meilleurs outils.",
    note: "La méthode STAR est un réflexe à acquérir : dès qu'une question commence par « Racontez-moi une fois où… », déroule mentalement Situación-Tarea-Acción-Resultado. Le secret d'un bon entretien n'est pas d'improviser mais de préparer et de répéter à l'avance quelques anecdotes solides, à la première personne et avec un résultat concret. Félicitations : tu as terminé les quinze jours du niveau B2 !" }
