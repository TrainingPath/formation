<script>
var DAY = {
  num: 5,
  title: "Le subjonctif : connecteurs (aunque, para que...)",
  subtitle: "Savoir quand un connecteur impose l'indicatif, le subjonctif, ou les deux avec un sens différent.",
  theory: `
<h3>1. Des connecteurs qui commandent le mode</h3>
<p>Certaines conjonctions déclenchent automatiquement le subjonctif ; d'autres l'indicatif ; d'autres encore acceptent les <strong>deux modes</strong>, mais avec un changement de sens. Les distinguer est essentiel au B2.</p>
<h3>2. Toujours le subjonctif : le but et la condition</h3>
<p>Les conjonctions de <strong>but</strong> et certaines de <strong>condition</strong> exigent toujours le subjonctif, car elles renvoient à un fait non réalisé.</p>
<pre class="pseudo">para que        Te lo explico para que lo entiendas. (…pour que tu comprennes.)
a fin de que    Trabaja a fin de que no le falte nada.
sin que         Salió sin que nadie lo viera. (…sans que personne le voie.)
antes de que    Llámame antes de que sea tarde.
a menos que     No iré a menos que me acompañes.
con tal de que  Haré lo que sea con tal de que estés bien.</pre>
<h3>3. Aunque : concession réelle ou hypothétique</h3>
<p><em>Aunque</em> (« bien que / même si ») accepte les deux modes. Avec l'<strong>indicatif</strong>, le fait est réel et admis ; avec le <strong>subjonctif</strong>, il est hypothétique ou présenté comme peu important.</p>
<pre class="pseudo">Aunque llueve, salgo.       (Bien qu'il pleuve — et il pleut — je sors.)    → fait réel
Aunque llueva, saldré.      (Même s'il pleut — hypothèse — je sortirai.)   → hypothèse
Aunque lloviera, saldría.   (Même s'il pleuvait — irréel — je sortirais.)</pre>
<div class="tip">Le même jeu vaut pour <em>a pesar de que, por más que, por mucho que</em> : indicatif pour un fait avéré, subjonctif pour l'hypothèse ou la concession minimisée.</div>
<h3>4. Les conjonctions temporelles : présent contre futur</h3>
<p><em>Cuando, en cuanto, mientras, hasta que, tan pronto como, después de que</em> prennent l'<strong>indicatif</strong> pour une habitude ou un fait passé, mais le <strong>subjonctif</strong> quand l'action se projette dans l'avenir.</p>
<pre class="pseudo">Cuando llego a casa, ceno.       (Habitude → indicatif présent.)
Cuando llegue a casa, cenaré.    (Projet futur → subjonctif présent.)
Cuando llegué, cené.             (Passé → indicatif.)
Espera hasta que termine.        (Futur → subjonctif : jusqu'à ce que je finisse.)</pre>
<div class="warn">Ne confonds pas : après « cuando » à valeur future, jamais le futur de l'indicatif. On ne dit pas « cuando llegaré » mais <em>cuando llegue</em> (subjonctif présent).</div>
<h3>5. La cause et la conséquence : plutôt l'indicatif</h3>
<p>Les conjonctions de <strong>cause</strong> (<em>porque, ya que, puesto que, como</em>) et de <strong>conséquence</strong> (<em>así que, de modo que</em> au sens résultatif) prennent l'<strong>indicatif</strong>, car elles énoncent des faits réels.</p>
<pre class="pseudo">No salí porque estaba cansado.     (…parce que j'étais fatigué.)
Como no había nadie, me fui.       (Comme il n'y avait personne, je suis parti.)
Llegó tarde, así que perdió el tren. (…de sorte qu'il rata le train.)</pre>
<div class="tip">Attention à <em>de modo que / de manera que</em> : + indicatif = conséquence réelle (« de sorte que »), + subjonctif = but (« de manière à ce que »). <em>Habla claro, de modo que todos te entiendan</em> (but) contre <em>Habló claro, de modo que todos lo entendieron</em> (résultat).</div>`,
  exercises: [
    { type: "qcm", q: "Quelle conjonction exige TOUJOURS le subjonctif ?", opts: ["porque", "para que", "ya que", "así que"], a: 1, exp: "Para que (but) → toujours subjonctif : para que lo entiendas." },
    { type: "input", q: "Complète : « Te lo explico para que lo ___ (entender, tú). »", a: ["entiendas"], ph: "verbe", exp: "Para que + subjonctif présent : entiendas." },
    { type: "qcm", q: "« Aunque llueve, salgo. » Que signifie l'emploi de l'indicatif ici ?", opts: ["Il ne pleut pas", "Il pleut réellement (fait admis)", "Il pleuvra peut-être", "C'est un ordre"], a: 1, exp: "Aunque + indicatif = concession sur un fait réel : il pleut vraiment." },
    { type: "input", q: "Complète (hypothèse future) : « Aunque ___ (llover), saldré. » (subjonctif présent)", a: ["llueva"], ph: "verbe", exp: "Aunque + subjonctif = même s'il pleut (hypothèse) : llueva." },
    { type: "vf", q: "« Cuando llegue a casa, cenaré » est correct pour un projet futur.", a: true, exp: "Vrai : cuando à valeur future → subjonctif présent (llegue)." },
    { type: "qcm", q: "« Cuando llego a casa, ceno. » Quelle valeur ?", opts: ["Un projet futur", "Une habitude (indicatif)", "Une hypothèse", "Un ordre"], a: 1, exp: "Habitude → indicatif présent : cuando llego." },
    { type: "input", q: "Complète : « Salió sin que nadie lo ___ (ver). » (subjonctif imparfait)", a: ["viera", "viese"], ph: "verbe", exp: "Sin que + subjonctif ; passé (salió) → imparfait : viera." },
    { type: "qcm", q: "Après « porque » (cause réelle), quel mode ?", opts: ["Subjonctif", "Indicatif", "Conditionnel", "Impératif"], a: 1, exp: "Porque énonce un fait réel → indicatif : porque estaba cansado." },
    { type: "input", q: "Complète (futur) : « Espera hasta que ___ (terminar, yo). » (subjonctif présent)", a: ["termine"], ph: "verbe", exp: "Hasta que à valeur future → subjonctif : termine." },
    { type: "qcm", q: "« Habla claro, de modo que todos te entiendan. » Le subjonctif indique :", opts: ["Une conséquence réelle", "Un but (de manière à ce que)", "Une cause", "Une comparaison"], a: 1, exp: "De modo que + subjonctif = finalité : pour que tous te comprennent." },
    { type: "vf", q: "« No iré a menos que me acompañes » emploie correctement le subjonctif.", a: true, exp: "Vrai : a menos que + subjonctif : acompañes." },
    { type: "input", q: "Complète : « Llámame antes de que ___ (ser) demasiado tarde. »", a: ["sea"], ph: "verbe", exp: "Antes de que + subjonctif : sea." },
    { type: "qcm", q: "Compréhension : « Aunque estudió mucho, no aprobó. » Cette personne a-t-elle étudié ?", opts: ["Non", "Oui, réellement (indicatif)", "Peut-être", "On l'ignore"], a: 1, exp: "Aunque + indicatif (estudió) = fait réel : elle a bel et bien étudié." },
    { type: "qcm", q: "Compréhension : « Por mucho que insistas, no cambiaré de opinión. » Le subjonctif « insistas » signale :", opts: ["Une cause", "Une concession hypothétique (aussi fort que tu insistes)", "Une habitude", "Un ordre"], a: 1, exp: "Por mucho que + subjonctif = concession portant sur une hypothèse." },
    { type: "vf", q: "« Como no había nadie, me fui » emploie l'indicatif car « como » exprime ici une cause réelle.", a: true, exp: "Vrai : como causal + indicatif = comme il n'y avait personne." }
  ],
  final: {
    title: "Exercice final — Instrucciones para un proyecto",
    intro: `<p>Un responsable de proyecto da instrucciones a su equipo. Observa el modo tras cada conector :</p>
<pre class="pseudo">Os explico el plan para que todos entendáis los objetivos.
Aunque el plazo es ajustado, creo que lo lograremos.
En cuanto reciba los datos, os los enviaré de inmediato.
No empecéis a programar hasta que el diseño esté aprobado.
Trabajaremos así, de modo que nadie se quede atrás.
Como ya tenemos experiencia, avanzaremos más rápido.
Por mucho que surjan imprevistos, mantendremos la calma.
Avisadme antes de que toméis cualquier decisión importante.</pre>`,
    questions: [
      { type: "input", q: "« para que todos ___ los objetivos » : subjonctif présent d'ENTENDER (vosotros)", a: ["entendáis"], ph: "verbe", exp: "Para que + subjonctif présent : entendáis." },
      { type: "qcm", q: "« Aunque el plazo es ajustado » usa el indicativo porque:", opts: ["Es una hipótesis", "Es un hecho real y admitido", "Es una orden", "Es un deseo"], a: 1, exp: "Aunque + indicativo = concesión sobre un hecho verificado." },
      { type: "input", q: "« En cuanto ___ los datos, os los enviaré » : subj. présent de RECIBIR (yo)", a: ["reciba"], ph: "verbe", exp: "En cuanto à valor futuro → subjuntivo : reciba." },
      { type: "vf", q: "« No empecéis hasta que el diseño esté aprobado » usa el subjuntivo porque la acción se proyecta al futuro.", a: true, exp: "Verdadero : hasta que futuro → subjuntivo (esté)." },
      { type: "qcm", q: "« Por mucho que surjan imprevistos » : ¿qué expresa el subjuntivo « surjan »?", opts: ["Una causa real", "Una concesión hipotética", "Una consecuencia", "Un hábito"], a: 1, exp: "Por mucho que + subjuntivo = concesión sobre algo eventual." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je vous explique le plan pour que vous compreniez tous les objectifs.
Bien que le délai soit serré, je pense que nous y arriverons.
Dès que je recevrai les données, je vous les enverrai aussitôt.
Ne commencez pas à programmer tant que la conception n'est pas validée.
Nous travaillerons ainsi, de sorte que personne ne reste à la traîne.
Comme nous avons déjà de l'expérience, nous avancerons plus vite.
Aussi nombreux que soient les imprévus, nous garderons notre calme.
Prévenez-moi avant de prendre toute décision importante.</pre>
<p>Retiens la logique : but et condition non réalisée (para que, sin que, a menos que, antes de que) → subjonctif ; cause et conséquence réelle (porque, como, así que) → indicatif ; concession (aunque) et temporelles (cuando, en cuanto, hasta que) → indicatif pour le réel/habituel, subjonctif pour l'hypothétique ou le futur.</p>`
  }
};
</script>

    solution: "Estoy organizando un viaje a Perú para que toda la familia descubra los Andes. Aunque el presupuesto es limitado, creo que podremos arreglárnoslas. Estoy ahorrando desde ahora, de modo que no nos falte nada durante el trayecto. En cuanto tengamos las fechas confirmadas, reservaremos los vuelos. No compraremos las entradas a Machu Picchu hasta que el itinerario esté cerrado. Como ya conozco un poco el país, me encargaré yo de la logística. Por mucho que surjan imprevistos, mantendremos la ilusión intacta. Avisaré a todos antes de que sea demasiado tarde para pedir vacaciones.\n\nTraduction : J'organise un voyage au Pérou pour que toute la famille découvre les Andes. Bien que le budget soit limité, je pense que nous nous débrouillerons. J'économise dès maintenant, de sorte que rien ne nous manque pendant le trajet. Dès que nous aurons les dates confirmées, nous réserverons les vols. Nous n'achèterons pas les billets pour le Machu Picchu tant que l'itinéraire ne sera pas bouclé. Comme je connais déjà un peu le pays, je m'occuperai moi-même de la logistique. Aussi nombreux que soient les imprévus, nous garderons l'enthousiasme intact. Je préviendrai tout le monde avant qu'il ne soit trop tard pour demander des congés.",

  ]
};
