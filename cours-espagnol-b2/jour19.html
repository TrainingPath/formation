<script>
var DAY = {
  num: 19,
  title: "Compréhension : un fait divers d'une page",
  subtitle: "Lire un vrai fait divers espagnol : suivre la chronologie, les acteurs et les faits.",
  theory: `
<h3>1. Le genre du fait divers</h3>
<p>Un <strong>fait divers</strong> (en espagnol, un <em>suceso</em>) est un court récit journalistique qui rapporte un événement réel : un vol, un accident, un sauvetage, une disparition… Il répond aux questions essentielles : <strong>qui, quoi, quand, où, comment, pourquoi</strong> (en espagnol, on parle des <em>«qué, quién, cuándo, dónde, cómo, por qué»</em>). Le lire, c'est reconstituer l'histoire dans l'ordre.</p>
<div class="tip">Le style du suceso : verbes au passé (indefinido), voix passive ou pronominale (<em>fue detenido</em>, <em>se produjo</em>), vocabulaire de la police et de la justice. Repère toujours les marqueurs de temps (a las tres de la madrugada, minutos después) pour reconstruire la chronologie.</div>
<h3>2. Le fait divers du jour (lis-le en entier)</h3>
<p>El robo del cuadro que delató una miga de pan</p>
<p>La policía de Granada detuvo el pasado martes a un hombre de cuarenta y dos años acusado de robar un valioso cuadro del siglo XVIII en una galería de arte del centro. El robo se produjo durante la noche del sábado, cuando la galería estaba cerrada al público.</p>
<p>Según la investigación, el ladrón entró por una ventana del sótano que había forzado horas antes. Una vez dentro, desactivó parte del sistema de alarma y descolgó el cuadro, valorado en más de doscientos mil euros. Después salió tranquilamente por la puerta trasera, sin dejar aparentemente ningún rastro.</p>
<p>A la mañana siguiente, la directora de la galería descubrió el hueco vacío en la pared y avisó de inmediato a la policía. Los agentes registraron la sala con cuidado, pero no encontraron huellas ni imágenes útiles: el ladrón había tapado las cámaras con un spray.</p>
<p>Sin embargo, cometió un pequeño error. En el suelo, junto a la ventana, los investigadores hallaron unas migas de pan y el envoltorio de un bocadillo. Al parecer, el ladrón había comido algo mientras esperaba el momento adecuado. El análisis del envoltorio permitió recuperar una huella dactilar parcial.</p>
<p>Gracias a esa huella, la policía identificó al sospechoso, que ya tenía antecedentes por otros robos. Cuando los agentes registraron su vivienda, encontraron el cuadro escondido detrás de un armario, envuelto en una manta. El hombre fue detenido sin oponer resistencia.</p>
<p>«Nunca imaginé que un bocadillo pudiera delatar a un ladrón», declaró con ironía uno de los agentes. El cuadro, en perfecto estado, será devuelto a la galería en los próximos días.</p>
<h3>3. Lexique d'aide</h3>
<pre class="pseudo">el robo               le vol
el ladrón             le voleur
detener               arrêter (police)
el cuadro             le tableau
forzar (una ventana)  forcer (une fenêtre)
descolgar             décrocher
el sótano             le sous-sol
el rastro             la trace
las huellas           les empreintes
la huella dactilar    l'empreinte digitale
delatar               dénoncer, trahir
las migas de pan      les miettes de pain
el envoltorio         l'emballage
el bocadillo          le sandwich
los antecedentes      le casier judiciaire
la vivienda           le logement
envuelto/a            enveloppé(e)
devolver              rendre, restituer</pre>
<h3>4. Reconstituer la chronologie</h3>
<pre class="pseudo">Sábado noche   : le voleur entre, décroche le tableau, part.
Dimanche matin : la directrice découvre le vol, appelle la police.
Enquête        : caméras masquées, mais des miettes trahissent le voleur.
Analyse        : empreinte partielle sur l'emballage.
Mardi          : le suspect est identifié et arrêté ; tableau retrouvé.</pre>
<div class="warn">Attention aux temps composés du récit : le <strong>pretérito pluscuamperfecto</strong> (había forzado, había comido, había tapado) sert à raconter ce qui s'était passé AVANT le moment principal du récit. C'est le « plus-que-parfait » espagnol.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'a volé le malfaiteur ?", opts: ["Un bijou", "Un tableau du XVIIIe siècle", "Une voiture", "De l'argent liquide"], a: 1, exp: "Un valioso cuadro del siglo XVIII = un précieux tableau du XVIIIe siècle." },
    { type: "input", q: "Par où le voleur est-il entré ? Complète : « por una ventana del ___ ». (le sous-sol)", a: ["sótano", "el sótano"], ph: "lieu", exp: "Entró por una ventana del sótano." },
    { type: "qcm", q: "Comment a-t-il neutralisé les caméras ?", opts: ["Il les a débranchées", "Il les a couvertes avec un spray", "Il les a cassées", "Il les a volées"], a: 1, exp: "Había tapado las cámaras con un spray." },
    { type: "vf", q: "La directrice a découvert le vol le dimanche matin.", a: true, exp: "A la mañana siguiente (dimanche), la directora descubrió el hueco vacío." },
    { type: "qcm", q: "Quel indice a trahi le voleur ?", opts: ["Une empreinte de chaussure", "Des miettes de pain et l'emballage d'un sandwich", "Une caméra oubliée", "Un témoin"], a: 1, exp: "Unas migas de pan y el envoltorio de un bocadillo." },
    { type: "input", q: "Que signifie « delatar » ? (un verbe français)", a: ["dénoncer", "trahir", "dénoncer, trahir"], ph: "verbe", exp: "Delatar = dénoncer, trahir (révéler l'identité de quelqu'un)." },
    { type: "qcm", q: "Qu'ont permis de récupérer les analyses de l'emballage ?", opts: ["De l'ADN salivaire", "Une empreinte digitale partielle", "Un cheveu", "Un numéro de téléphone"], a: 1, exp: "Permitió recuperar una huella dactilar parcial." },
    { type: "vf", q: "Le suspect n'avait aucun antécédent judiciaire.", a: false, exp: "Faux : « ya tenía antecedentes por otros robos »." },
    { type: "qcm", q: "Où le tableau a-t-il été retrouvé ?", opts: ["Dans une voiture", "Caché derrière une armoire, enveloppé dans une couverture", "Dans une autre galerie", "Chez un antiquaire"], a: 1, exp: "Escondido detrás de un armario, envuelto en una manta." },
    { type: "input", q: "Complète : « El hombre fue ___ sin oponer resistencia. » (verbe : arrêté, passif)", a: ["detenido"], ph: "participe", exp: "Fue detenido = il a été arrêté (voix passive)." },
    { type: "qcm", q: "« El ladrón había forzado la ventana horas antes. » Ce temps (había forzado) indique :", opts: ["Une action postérieure", "Une action antérieure au reste du récit", "Le présent", "Un ordre"], a: 1, exp: "Pluscuamperfecto = ce qui s'était passé AVANT le moment principal." },
    { type: "qcm", q: "Quand le suspect a-t-il été arrêté ?", opts: ["Samedi soir", "Dimanche matin", "Mardi", "Le mois suivant"], a: 2, exp: "La policía detuvo el pasado martes a un hombre." },
    { type: "input", q: "Complète le lexique : « el ___ » = l'empreinte digitale (huella ___).", a: ["dactilar"], ph: "mot", exp: "La huella dactilar = l'empreinte digitale." },
    { type: "qcm", q: "Compréhension globale : quelle est la « morale » ironique du fait divers ?", opts: ["Les tableaux sont mal protégés", "Un détail insignifiant (un sandwich) a suffi à confondre le voleur", "La police est inefficace", "Les galeries doivent fermer"], a: 1, exp: "Nunca imaginé que un bocadillo pudiera delatar a un ladrón : un petit détail trahit tout." },
    { type: "qcm", q: "Compréhension : « salió tranquilamente por la puerta trasera » veut dire :", opts: ["Il est sorti en courant par la fenêtre", "Il est sorti calmement par la porte de derrière", "Il a été surpris à la sortie", "Il n'a pas pu sortir"], a: 1, exp: "Tranquilamente = calmement ; la puerta trasera = la porte arrière." }
  ],
  final: {
    title: "Exercice final — La cronología del suceso",
    intro: `<p>Reconstitue l'ordre des événements du fait divers en répondant aux questions :</p>
<pre class="pseudo">Recuerda las etapas: el robo (sábado noche), el
descubrimiento (domingo por la mañana), la investigación
(las cámaras tapadas, las migas), el análisis (la huella)
y la detención (el martes).</pre>`,
    questions: [
      { type: "qcm", q: "Quel événement se produit EN PREMIER ?", opts: ["L'arrestation du suspect", "Le vol du tableau samedi soir", "La découverte des miettes", "La restitution du tableau"], a: 1, exp: "Le récit commence par le vol pendant la nuit du samedi." },
      { type: "qcm", q: "Qui découvre le vol et prévient la police ?", opts: ["Un agent de sécurité", "La directrice de la galerie", "Un voisin", "Un touriste"], a: 1, exp: "La directora de la galería descubrió el hueco y avisó a la policía." },
      { type: "input", q: "Quel objet, laissé au sol, a fourni l'empreinte ? (un mot)", a: ["el envoltorio", "envoltorio", "el bocadillo", "bocadillo"], ph: "objet", exp: "El análisis del envoltorio del bocadillo permitió recuperar la huella." },
      { type: "qcm", q: "Grâce à quoi la police identifie-t-elle le suspect ?", opts: ["Un témoin oculaire", "L'empreinte digitale et le casier judiciaire", "Les caméras de la rue", "Un appel anonyme"], a: 1, exp: "Gracias a la huella, y como ya tenía antecedentes, fue identificado." },
      { type: "vf", q: "À la fin, le tableau est retrouvé intact et sera rendu à la galerie.", a: true, exp: "El cuadro, en perfecto estado, será devuelto a la galería." }
    ],
    solution: `<p>Chronologie complète du suceso :</p>
<pre class="pseudo">1. Sábado noche : el ladrón fuerza la ventana, tapa las
   cámaras, descuelga el cuadro y sale por la puerta trasera.
2. Domingo por la mañana : la directora descubre el robo y
   avisa a la policía.
3. La policía no halla huellas útiles… salvo unas migas de
   pan y el envoltorio de un bocadillo.
4. El análisis del envoltorio da una huella dactilar parcial.
5. Con la huella y los antecedentes, identifican al sospechoso.
6. El martes lo detienen y recuperan el cuadro intacto.</pre>
<p>Le ressort du récit : le voleur, très professionnel, échoue à cause d'un détail trivial. C'est le schéma classique du fait divers « insolite ».</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "es-b2-j19", title: "Raconte le fait divers", level: 3,
    statement: "Résume le fait divers du vol du tableau en 6 phrases, en espagnol, en respectant la chronologie. Emploie le pretérito indefinido pour les actions et au moins un pluscuamperfecto (había…) pour un fait antérieur.",
    hints: [
      "Commence par le vol : Durante la noche del sábado, un ladrón robó…",
      "Explique comment : había forzado la ventana, tapó las cámaras…",
      "Termine par l'indice décisif et l'arrestation : gracias a una huella… fue detenido."
    ],
    solution: "Durante la noche del sábado, un ladrón robó un valioso cuadro de una galería de Granada. Había forzado una ventana del sótano, tapó las cámaras con un spray y salió por la puerta trasera sin dejar rastro. A la mañana siguiente, la directora descubrió el robo y avisó a la policía. Los agentes no encontraron huellas útiles, pero hallaron unas migas de pan y el envoltorio de un bocadillo que el ladrón había dejado en el suelo. El análisis del envoltorio dio una huella dactilar, y como el sospechoso ya tenía antecedentes, la policía lo identificó. Finalmente, el hombre fue detenido y el cuadro, intacto, será devuelto a la galería.\n\nTraduction : Pendant la nuit du samedi, un voleur a dérobé un précieux tableau d'une galerie de Grenade. Il avait forcé une fenêtre du sous-sol, a couvert les caméras avec un spray et est sorti par la porte de derrière sans laisser de trace. Le lendemain matin, la directrice a découvert le vol et a prévenu la police. Les agents n'ont pas trouvé d'empreintes utiles, mais ils ont trouvé des miettes de pain et l'emballage d'un sandwich que le voleur avait laissés au sol. L'analyse de l'emballage a donné une empreinte digitale, et comme le suspect avait déjà un casier, la police l'a identifié. Finalement, l'homme a été arrêté et le tableau, intact, sera rendu à la galerie.",
    note: "Pour raconter un fait divers : l'indefinido fait avancer l'action (robó, descubrió, detuvieron), le pluscuamperfecto (había forzado) rappelle ce qui s'était passé avant. Cette alternance donne du relief à la chronologie." }
  ]
};
</script>
