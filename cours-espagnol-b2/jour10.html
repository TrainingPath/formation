<script>
var DAY = {
  num: 10,
  title: "Collocations et nuances de vocabulaire",
  subtitle: "Choisir le mot juste : associations naturelles et faux amis avec le français.",
  theory: `
<h3>1. Qu'est-ce qu'une collocation ?</h3>
<p>Une <strong>colocación</strong> est une association de mots qui « vont ensemble » naturellement dans une langue. On ne dit pas « faire une décision » mais <em>prendre une décision</em>. En espagnol, ces alliances ne coïncident pas toujours avec le français : les connaître est ce qui distingue une langue scolaire d'une langue idiomatique.</p>
<pre class="pseudo">tomar una decisión     (prendre une décision)   — pas « hacer una decisión »
cometer un error       (commettre une erreur)
prestar atención       (prêter attention)
correr un riesgo       (courir un risque)
poner un ejemplo       (donner un exemple)</pre>
<h3>2. Le bon verbe selon le nom</h3>
<p>Beaucoup de noms exigent un verbe précis. Voici des collocations très fréquentes à mémoriser en bloc.</p>
<pre class="pseudo">dar un paseo           (faire une promenade)     — dar, pas « hacer »
hacer una pregunta     (poser une question)
guardar un secreto     (garder un secret)
cumplir un sueño       (réaliser un rêve)
sacar una conclusión   (tirer une conclusion)
echar de menos         (regretter, manquer à qqn)
tener en cuenta        (tenir compte de)
llevar a cabo          (mener à bien, réaliser)</pre>
<div class="tip">Les verbes support <em>dar, hacer, tener, poner, echar</em> forment une multitude de collocations : <em>dar las gracias</em> (remercier), <em>hacer caso</em> (tenir compte, obéir), <em>tener ganas de</em> (avoir envie de), <em>poner en marcha</em> (mettre en route), <em>echar una mano</em> (donner un coup de main).</div>
<h3>3. Les faux amis à surveiller</h3>
<p>Certains mots espagnols ressemblent à un mot français mais ont un sens différent : les <strong>faux amis</strong> (falsos amigos). Ils sont une source d'erreurs fréquentes.</p>
<pre class="pseudo">Espagnol       Sens réel                 À ne pas confondre avec
embarazada     enceinte                  (pas « embarrassée » = avergonzada)
constipado     enrhumé                   (pas « constipé » = estreñido)
sensible       sensible (émotif) OK      mais « razonable » = raisonnable
éxito          succès                    (pas « sortie » = salida)
largo          long                      (pas « large » = ancho)
contestar      répondre                  (pas « contester » = discutir)
asistir a      assister à                (pas « aider » = ayudar)
realizar       effectuer/réaliser        (attention : « se rendre compte » = darse cuenta)</pre>
<div class="warn">Deux pièges classiques : <em>realizar</em> signifie « accomplir/effectuer », jamais « se rendre compte » (qui se dit <em>darse cuenta de</em>) ; et <em>actualmente</em> signifie « en ce moment / de nos jours », pas « en fait » (qui se dit <em>en realidad / de hecho</em>).</div>
<h3>4. Nuances entre synonymes proches</h3>
<pre class="pseudo">saber / conocer     saber = savoir (une info) ; conocer = connaître (qqn, un lieu)
pedir / preguntar   pedir = demander (qqch) ; preguntar = poser une question
llevar / traer      llevar = emporter (loin) ; traer = apporter (vers moi)
quedar / quedarse   quedar = avoir rendez-vous ; quedarse = rester
oír / escuchar      oír = entendre ; escuchar = écouter (volontairement)</pre>
<div class="tip">Pour progresser, note les nouveaux mots avec leur <strong>collocation</strong> et un exemple, jamais isolés : au lieu de « decisión = décision », note « tomar una decisión difícil ». Le mot se retient alors dans son contexte naturel.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « prendre une décision » ?", opts: ["hacer una decisión", "tomar una decisión", "coger una decisión", "dar una decisión"], a: 1, exp: "La collocation correcte est tomar una decisión." },
    { type: "input", q: "Complète : « Hay que ___ atención en clase. » (verbe = prêter)", a: ["prestar"], ph: "verbe", exp: "Prestar atención = prêter attention." },
    { type: "qcm", q: "Que signifie « embarazada » ?", opts: ["Embarrassée", "Enceinte", "Fatiguée", "Occupée"], a: 1, exp: "Faux ami : embarazada = enceinte. Embarrassée = avergonzada." },
    { type: "input", q: "Complète : « Vamos a ___ un paseo por el parque. » (verbe support)", a: ["dar"], ph: "verbe", exp: "Dar un paseo = faire une promenade." },
    { type: "vf", q: "« Realizar » signifie « se rendre compte ».", a: false, exp: "Faux : realizar = effectuer/accomplir. Se rendre compte = darse cuenta de." },
    { type: "qcm", q: "« Estoy constipado » veut dire :", opts: ["Je suis constipé", "Je suis enrhumé", "Je suis fatigué", "Je suis inquiet"], a: 1, exp: "Faux ami : constipado = enrhumé. Constipé = estreñido." },
    { type: "input", q: "Complète : « Cometí un ___ grave en el examen. » (nom = erreur)", a: ["error"], ph: "nom", exp: "Cometer un error = commettre une erreur." },
    { type: "qcm", q: "Quelle est la différence entre « saber » et « conocer » ?", opts: ["Aucune", "Saber = savoir un fait ; conocer = connaître qqn/un lieu", "Saber = connaître ; conocer = savoir", "Les deux veulent dire pouvoir"], a: 1, exp: "Saber une information/un savoir-faire ; conocer une personne, un lieu." },
    { type: "input", q: "Complète : « Te ___ mucho de menos. » (verbe = manquer, tu me manques)", a: ["echo"], ph: "verbe", exp: "Echar de menos = manquer (à quelqu'un) : te echo de menos." },
    { type: "qcm", q: "« Asistir a una reunión » signifie :", opts: ["Aider à une réunion", "Assister à une réunion", "Éviter une réunion", "Organiser une réunion"], a: 1, exp: "Asistir a = assister à. Aider = ayudar." },
    { type: "vf", q: "« Llevar a cabo un proyecto » signifie « mener à bien un projet ».", a: true, exp: "Vrai : llevar a cabo = réaliser, mener à bien." },
    { type: "input", q: "Complète : « ¿Puedes ___ me una pregunta? » (verbe : poser une question)", a: ["hacer"], ph: "verbe", exp: "Hacer una pregunta = poser une question." },
    { type: "qcm", q: "Compréhension : « Actualmente vivo en Madrid. » Que signifie « actualmente » ?", opts: ["En fait", "Actuellement / en ce moment", "Récemment", "Autrefois"], a: 1, exp: "Faux ami : actualmente = actuellement. En fait = en realidad / de hecho." },
    { type: "qcm", q: "Compréhension : « Prefiero escuchar música mientras trabajo. » Nuance entre oír et escuchar ?", opts: ["Aucune différence", "Escuchar = écouter volontairement ; oír = entendre", "Escuchar = entendre ; oír = écouter", "Les deux veulent dire comprendre"], a: 1, exp: "Escuchar implique l'attention volontaire ; oír, la simple perception." },
    { type: "vf", q: "« Tener en cuenta » signifie « tenir compte de ».", a: true, exp: "Vrai : tener en cuenta = tenir compte de, prendre en considération." }
  ],
  final: {
    title: "Exercice final — Consejos para aprender vocabulario",
    intro: `<p>Un profesor de idiomas da consejos. Fíjate en las colocaciones y matices :</p>
<pre class="pseudo">Aprender un idioma exige tomar buenas decisiones desde el principio.
En primer lugar, conviene prestar atención a las palabras que van juntas.
No memorices términos sueltos: es mejor tener en cuenta su contexto.
Muchos estudiantes cometen el error de traducir todo literalmente.
Por eso hay que darse cuenta de los falsos amigos y evitarlos.
Te aconsejo llevar a cabo repasos frecuentes y hacer preguntas en clase.
Si echas de menos oportunidades de practicar, busca un intercambio.
Al final, cumplirás el sueño de hablar con soltura si eres constante.</pre>`,
    questions: [
      { type: "input", q: "« conviene ___ atención a las palabras » : verbe de la collocation (prêter attention)", a: ["prestar"], ph: "verbe", exp: "Prestar atención = prêter attention." },
      { type: "qcm", q: "« cometen el error de traducir todo » usa la colocación correcta con:", opts: ["hacer un error", "cometer un error", "dar un error", "tomar un error"], a: 1, exp: "Cometer un error es la colocación natural." },
      { type: "vf", q: "« darse cuenta de los falsos amigos » significa « se rendre compte des faux amis ».", a: true, exp: "Verdadero : darse cuenta de = se rendre compte de (no « realizar »)." },
      { type: "input", q: "« ___ a cabo repasos frecuentes » : verbe qui complète la locution (mener à bien)", a: ["llevar"], ph: "verbe", exp: "Llevar a cabo = mener à bien, réaliser." },
      { type: "qcm", q: "« cumplirás el sueño de hablar con soltura » : ¿qué significa « con soltura »?", opts: ["Con dificultad", "Con fluidez / naturalidad", "Con miedo", "Con lentitud"], a: 1, exp: "Hablar con soltura = parler avec aisance, couramment." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Apprendre une langue exige de prendre de bonnes décisions dès le début.
En premier lieu, il convient de prêter attention aux mots qui vont ensemble.
Ne mémorise pas des termes isolés : mieux vaut tenir compte de leur contexte.
Beaucoup d'étudiants commettent l'erreur de tout traduire littéralement.
C'est pourquoi il faut se rendre compte des faux amis et les éviter.
Je te conseille d'effectuer des révisions fréquentes et de poser des questions en classe.
Si les occasions de pratiquer te manquent, cherche un échange linguistique.
Au bout du compte, tu réaliseras le rêve de parler couramment si tu es constant.</pre>
<p>La leçon centrale : apprends le vocabulaire par <strong>collocations</strong> (tomar una decisión, cometer un error, llevar a cabo) et méfie-toi des <strong>faux amis</strong> (realizar, actualmente, constipado, embarazada). Le mot juste dans son alliance naturelle vaut mieux que dix synonymes mal employés.</p>`
  }
};
</script>
