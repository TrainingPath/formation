<body>
<script>
var DAY = {
  num: 21,
  title: "Le vocabulaire de l'actualité et de la société",
  subtitle: "Le lexique des journaux : politique, économie, environnement, société.",
  theory: `
<h3>1. Pourquoi ce lexique ?</h3>
<p>Au niveau B2, on lit et on écoute les <strong>informations</strong> (las noticias) : un journal télévisé, un article, un podcast. Il faut donc maîtriser le vocabulaire de l'actualité (la <em>actualidad</em>) et des grands thèmes de société. Ce jour est un jour de <strong>vocabulaire organisé par domaines</strong>.</p>
<h3>2. La politique et les institutions</h3>
<pre class="pseudo">el gobierno            le gouvernement
el/la presidente/a     le président / la présidente
las elecciones         les élections
votar / el voto        voter / le vote
el partido             le parti
la ley                 la loi
aprobar una ley        adopter une loi
la manifestación       la manifestation
la huelga              la grève
la ciudadanía          la citoyenneté / les citoyens</pre>
<h3>3. L'économie et le travail</h3>
<pre class="pseudo">el paro / el desempleo   le chômage
la crisis                la crise
la inflación             l'inflation
el sueldo mínimo         le salaire minimum
la empresa               l'entreprise
los impuestos            les impôts
el poder adquisitivo     le pouvoir d'achat
la deuda                 la dette
recortar / los recortes  réduire / les coupes budgétaires</pre>
<h3>4. L'environnement</h3>
<pre class="pseudo">el cambio climático      le changement climatique
el calentamiento global  le réchauffement climatique
la contaminación         la pollution
los residuos             les déchets
las energías renovables  les énergies renouvelables
la sequía                la sécheresse
sostenible               durable
reciclar                 recycler</pre>
<h3>5. La société</h3>
<pre class="pseudo">la igualdad              l'égalité
la desigualdad           l'inégalité
la inmigración           l'immigration
la sanidad               le système de santé
la educación             l'éducation / le système éducatif
la vivienda              le logement
los derechos             les droits
la brecha (de género)    l'écart / le fossé (des genres)</pre>
<div class="tip">Verbes utiles pour commenter l'actualité : <strong>aumentar / disminuir</strong> (augmenter / diminuer), <strong>afectar a</strong> (toucher, concerner), <strong>denunciar</strong> (dénoncer), <strong>reclamar / exigir</strong> (réclamer / exiger), <strong>debatir</strong> (débattre), <strong>proponer</strong> (proposer).</div>
<div class="warn">Faux amis fréquents dans la presse : <em>actual</em> = actuel (pas « réel ») ; <em>actualmente</em> = en ce moment (pas « en fait » → eso es <em>en realidad</em>) ; <em>el debate</em> = le débat ; <em>la manifestación</em> = la manifestation (une <em>demostración</em> serait une démonstration/preuve).</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le chômage » ?", opts: ["el sueldo", "el paro", "la huelga", "el partido"], a: 1, exp: "El paro (ou el desempleo) = le chômage ; la huelga = la grève." },
    { type: "input", q: "Complète : « El gobierno va a ___ una nueva ley. » (verbe : adopter)", a: ["aprobar"], ph: "verbe", exp: "Aprobar una ley = adopter / voter une loi." },
    { type: "qcm", q: "« El cambio climático » se traduit par :", opts: ["Le changement de climat vestimentaire", "Le changement climatique", "La météo du jour", "Le climat social"], a: 1, exp: "El cambio climático = le changement climatique." },
    { type: "input", q: "Complète : « la ___ de género » = l'écart / le fossé entre les genres.", a: ["brecha"], ph: "mot", exp: "La brecha de género = l'écart entre hommes et femmes (salaires, etc.)." },
    { type: "qcm", q: "« La huelga » signifie :", opts: ["La manifestation", "La grève", "L'élection", "La loi"], a: 1, exp: "La huelga = la grève ; la manifestación = la manifestation." },
    { type: "vf", q: "« Actual » en espagnol veut dire « réel ».", a: false, exp: "Faux : actual = actuel. « Réel » se dit real." },
    { type: "qcm", q: "Les « energías renovables » sont :", opts: ["Les énergies polluantes", "Les énergies renouvelables", "Les factures d'électricité", "Les centrales nucléaires"], a: 1, exp: "Las energías renovables = solaire, éolien… (durables)." },
    { type: "input", q: "Complète : « La inflación hace subir los precios y reduce el poder ___. » (achat)", a: ["adquisitivo"], ph: "mot", exp: "El poder adquisitivo = le pouvoir d'achat." },
    { type: "qcm", q: "« Los recortes » désigne :", opts: ["Les augmentations de salaire", "Les coupes budgétaires", "Les recettes", "Les vacances"], a: 1, exp: "Los recortes = les coupes / réductions budgétaires ; recortar = réduire." },
    { type: "input", q: "Complète : « Miles de personas salieron a la calle en una ___ contra la reforma. » (rassemblement)", a: ["manifestación"], ph: "mot", exp: "Una manifestación = une manifestation dans la rue." },
    { type: "vf", q: "« La sanidad » désigne le système de santé.", a: true, exp: "La sanidad = la santé publique / le système de santé." },
    { type: "qcm", q: "Quel verbe signifie « dénoncer » (une injustice) ?", opts: ["proponer", "denunciar", "aumentar", "reciclar"], a: 1, exp: "Denunciar = dénoncer publiquement." },
    { type: "input", q: "Complète : « La crisis de ___ afecta sobre todo a los jóvenes. » (mot pour « logement »)", a: ["vivienda", "la vivienda"], ph: "mot", exp: "La vivienda = le logement ; ici « la crise du logement »." },
    { type: "qcm", q: "Compréhension : « El paro juvenil aumentó un 3% el año pasado. » Que dit cette phrase ?", opts: ["Les jeunes ont plus voté", "Le chômage des jeunes a augmenté de 3%", "Les salaires ont baissé de 3%", "Trois lois ont été votées"], a: 1, exp: "El paro juvenil aumentó = le chômage des jeunes a augmenté (de 3%)." },
    { type: "qcm", q: "Compréhension : « Los ecologistas reclaman más medidas contra la contaminación. » Que veulent-ils ?", opts: ["Moins d'énergies renouvelables", "Plus de mesures contre la pollution", "Fermer les écoles", "Baisser les impôts"], a: 1, exp: "Reclamar = réclamer ; ils exigent plus de mesures contre la pollution." }
  ],
  final: {
    title: "Exercice final — Titulares de prensa",
    intro: `<p>Voici cinq titres de presse (titulares). Comprends chacun grâce au vocabulaire du jour :</p>
<pre class="pseudo">1. «El gobierno aprueba una subida del salario mínimo.»
2. «Miles de personas se manifiestan contra los recortes en sanidad.»
3. «La sequía obliga a limitar el consumo de agua en el sur.»
4. «El paro juvenil baja por tercer mes consecutivo.»
5. «Los expertos alertan del aumento de la desigualdad.»</pre>`,
    questions: [
      { type: "qcm", q: "Titre 1 : que fait le gouvernement ?", opts: ["Il baisse les impôts", "Il adopte une hausse du salaire minimum", "Il ferme des entreprises", "Il organise des élections"], a: 1, exp: "Aprueba una subida del salario mínimo = adopte une augmentation du SMIC." },
      { type: "qcm", q: "Titre 2 : contre quoi manifestent les gens ?", opts: ["Les impôts", "Les coupes budgétaires dans la santé", "Le changement climatique", "Les élections"], a: 1, exp: "Contra los recortes en sanidad = contre les coupes dans la santé." },
      { type: "input", q: "Titre 3 : quel phénomène naturel oblige à limiter l'eau ? (un mot)", a: ["la sequía", "sequía"], ph: "phénomène", exp: "La sequía = la sécheresse." },
      { type: "qcm", q: "Titre 4 : que fait le chômage des jeunes ?", opts: ["Il augmente", "Il baisse pour le 3e mois de suite", "Il reste stable", "Il double"], a: 1, exp: "Baja por tercer mes consecutivo = baisse pour le 3e mois consécutif." },
      { type: "vf", q: "Titre 5 : les experts alertent sur l'augmentation des inégalités.", a: true, exp: "Alertan del aumento de la desigualdad = ils alertent sur la hausse des inégalités." }
    ],
    solution: `<p>Traduction des titres :</p>
<pre class="pseudo">1. Le gouvernement adopte une hausse du salaire minimum.
2. Des milliers de personnes manifestent contre les coupes
   budgétaires dans la santé.
3. La sécheresse oblige à limiter la consommation d'eau au sud.
4. Le chômage des jeunes baisse pour le 3e mois consécutif.
5. Les experts alertent sur l'augmentation des inégalités.</pre>
<p>Un titre de presse est dense : un verbe fort (aprueba, alertan), un thème de société (salario, sanidad, sequía, paro, desigualdad) et parfois un chiffre. Maîtriser ce lexique, c'est pouvoir lire n'importe quel journal en diagonale.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b2-j21", title: "Commente une actualité", level: 3,
    statement: "Choisis un sujet d'actualité (chômage, environnement, logement, égalité…) et rédige 6 à 8 phrases en espagnol pour le présenter et donner ton avis. Emploie au moins six mots du vocabulaire du jour.",
    hints: [
      "Présente le thème : Uno de los temas más debatidos hoy es…",
      "Décris la situation avec le lexique : el paro, los recortes, la desigualdad…",
      "Donne ton opinion : En mi opinión, el gobierno debería… / Habría que…"
    ],
    solution: "Uno de los temas más debatidos hoy es la crisis de la vivienda. En muchas ciudades, los precios de los alquileres han subido tanto que los jóvenes no pueden independizarse. Este problema afecta sobre todo a las personas con sueldos bajos y aumenta la desigualdad social. Los ciudadanos reclaman medidas y varios colectivos se han manifestado para exigir viviendas más asequibles. En mi opinión, el gobierno debería construir más vivienda pública y controlar los precios abusivos. Aunque no existe una solución sencilla, creo que es urgente actuar, porque el derecho a una vivienda digna es fundamental.\n\nTraduction : L'un des sujets les plus débattus aujourd'hui est la crise du logement. Dans beaucoup de villes, les prix des loyers ont tellement augmenté que les jeunes ne peuvent pas quitter le domicile parental. Ce problème touche surtout les personnes aux bas salaires et accroît les inégalités sociales. Les citoyens réclament des mesures et plusieurs collectifs ont manifesté pour exiger des logements plus abordables. À mon avis, le gouvernement devrait construire davantage de logements publics et contrôler les prix abusifs. Bien qu'il n'existe pas de solution simple, je pense qu'il est urgent d'agir, car le droit à un logement décent est fondamental.",
    note: "Commenter l'actualité en B2, c'est combiner un lexique précis (vivienda, alquiler, desigualdad) et une opinion argumentée (En mi opinión…, debería…). Relie toujours le vocabulaire technique à un point de vue personnel nuancé." }
  ]
};
</script>
