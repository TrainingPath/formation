  title: "L'implicite, l'humour, l'ironie",
  subtitle: "Comprendre ce qui n'est pas dit : sous-entendus, second degré et humour espagnol.",
  theory: `
<h3>1. Dire sans dire</h3>
<p>Comprendre l'espagnol au niveau B2, ce n'est plus seulement décoder les mots : c'est saisir <strong>ce qui est suggéré</strong>. L'<strong>implicite</strong> (lo implícito) est le sens caché derrière une phrase ; l'<strong>ironie</strong> (la ironía) dit le contraire de ce que l'on pense, pour se moquer ; l'<strong>humour</strong> (el humor) joue avec les mots et les situations.</p>
<h3>2. L'implicite : le sous-entendu</h3>
<p>Une phrase peut vouloir dire plus que ce qu'elle affirme. Le contexte et le ton révèlent le vrai message.</p>
<pre class="pseudo">Phrase                         Sens implicite
«Hace frío aquí, ¿no?»         → Ferme la fenêtre, s'il te plaît.
«Ya son las tres…»             → On est en retard / il faut partir.
«Qué interesante tu historia»  → (ton plat) Tu m'ennuies.
«No está mal para ser tu       → C'est plutôt réussi (compliment
 primera vez.»                    déguisé en réserve).</pre>
<div class="tip">Repérer l'implicite : demande-toi toujours « pourquoi dit-il CELA, ICI, MAINTENANT ? ». Si la réponse littérale ne suffit pas, cherche l'intention cachée (une demande, un reproche, une gêne).</div>
<h3>3. L'ironie : dire le contraire</h3>
<p>L'ironie consiste à affirmer le contraire de ce que l'on pense, avec un ton particulier. Le contexte trahit le vrai sens.</p>
<pre class="pseudo">«¡Qué puntual eres!»    → (à quelqu'un en retard) : tu es toujours en retard.
«Genial, otra reunión.» → (soupir) : encore une réunion, quelle plaie.
«Sí, claro, y yo soy    → Bien sûr que non, c'est absurde.
 astronauta.»
«Menudo genio…»         → (sarcasme) : quel idiot / quel maladroit.</pre>
<div class="warn">Attention : sans le <strong>ton</strong> ou le <strong>contexte</strong>, une phrase ironique peut être prise au premier degré. À l'écrit, on repère l'ironie grâce à l'exagération, au décalage avec la situation, ou à des marqueurs comme <em>«sí, claro»</em>, <em>«¡cómo no!»</em>, <em>«menudo/vaya…»</em>.</div>
<h3>4. L'humour et les jeux de mots</h3>
<p>L'humour espagnol aime les <strong>doubles sens</strong> et les expressions détournées. Exemple classique : <em>«Se ha quedado más ancho que largo»</em> (il est resté plus large que long → il est resté très satisfait de lui). Ou la réponse blagueuse : <em>«¿Qué haces?» — «Ni caso»</em> (jeu sur « je ne fais rien / je ne fais pas attention »).</p>
<h3>5. Marqueurs utiles</h3>
<pre class="pseudo">vaya / menudo + nom      exclamation (souvent ironique) : vaya día…
o sea                    c'est-à-dire (reformuler)
en plan…                 genre… (registre familier, jeune)
por así decirlo          pour ainsi dire
literalmente             littéralement (souvent exagéré/ironique)
tomar el pelo a alguien  se moquer de qqn / faire marcher qqn</pre>`,
  exercises: [
    { type: "qcm", q: "« Hace frío aquí, ¿no? » signifie souvent, de façon implicite :", opts: ["Il fait chaud", "Ferme la fenêtre / le radiateur, s'il te plaît", "J'aime l'hiver", "Sortons dehors"], a: 1, exp: "Sous-entendu poli : une demande indirecte de fermer/chauffer." },
    { type: "qcm", q: "L'ironie consiste à :", opts: ["Dire exactement ce qu'on pense", "Dire le contraire de ce qu'on pense pour se moquer", "Parler très fort", "Répéter une phrase"], a: 1, exp: "L'ironie affirme le contraire de la pensée réelle, avec un ton particulier." },

    { type: "qcm", q: "« No está mal para ser tu primera vez » est :", opts: ["Une critique franche", "Un compliment déguisé en réserve", "Une insulte", "Une question"], a: 1, exp: "Litote : « pas mal » = plutôt réussi ; compliment atténué." },
    { type: "qcm", q: "Quel marqueur signale souvent l'ironie à l'écrit ?", opts: ["por favor", "sí, claro", "gracias", "buenos días"], a: 1, exp: "« Sí, claro » (bien sûr) sur un ton sceptique marque l'incrédulité ironique." },
    { type: "vf", q: "Sans le ton ni le contexte, une phrase ironique peut être comprise au premier degré.", a: true, exp: "Vrai : l'ironie dépend du ton et du contexte ; à l'écrit, on cherche des indices." },
    { type: "input", q: "Complète : « Me estás tomando el pelo, ¿___? » (n'est-ce pas ; particule interro-négative)", a: ["no", "verdad"], ph: "mot", exp: "¿No? / ¿verdad? = tag interrogatif : tu te moques de moi, non ?" },
    { type: "qcm", q: "« Genial, otra reunión. » (en soupirant) veut dire :", opts: ["J'adore les réunions", "Encore une réunion, quelle corvée (ironie)", "La réunion est annulée", "Il faut préparer la réunion"], a: 1, exp: "« Genial » sur un ton las = l'inverse : lassitude ironique." },
    { type: "qcm", q: "Compréhension : à table, « Ya son las tres… » peut sous-entendre :", opts: ["Il est tôt", "Il est temps de partir / on est en retard", "Il faut manger plus", "Quelle heure est-il ?"], a: 1, exp: "Le sous-entendu dépend du contexte : rappel qu'il se fait tard." },
    { type: "qcm", q: "Compréhension : « Menudo genio está hecho tu jefe… » (avec sarcasme) suggère que le chef :", opts: ["Est très intelligent", "A mauvais caractère / n'est pas si génial", "Est absent", "Est nouveau"], a: 1, exp: "Sarcasme : « menudo genio » (quel génie) dit ironiquement le contraire, souvent sur le caractère." }
  ],

    title: "Exercice final — Diálogo con doble sentido",
    intro: `<p>Lis ce dialogue et repère l'implicite et l'ironie :</p>
<pre class="pseudo">— Llego un poco tarde, lo siento.

— Bueno, es que había mucho tráfico.
— Sí, claro, siempre hay mucho tráfico contigo.
— Oye, no te enfades…
— ¿Enfadarme yo? Qué va, estoy encantado de esperar bajo la lluvia.</pre>`,
    questions: [
      { type: "qcm", q: "« ¿Un poco? Solo llevo aquí una hora » exprime :", opts: ["Que l'attente a été courte", "Un reproche ironique : le retard est énorme", "Que tout va bien", "Une question sincère"], a: 1, exp: "Ironie : « seulement une heure » souligne un long retard." },
      { type: "qcm", q: "« Sí, claro, siempre hay mucho tráfico contigo » sous-entend :", opts: ["Qu'il croit l'excuse", "Qu'il doute de l'excuse (elle revient toujours)", "Qu'il aime la circulation", "Qu'il veut conduire"], a: 1, exp: "« Sí, claro » ironique : il ne croit pas à l'excuse habituelle." },
      { type: "input", q: "Quelle expression du texte marque le scepticisme ironique ? (deux mots)", a: ["sí claro", "sí, claro", "qué va"], ph: "expression", exp: "« Sí, claro » (et « qué va ») signalent l'ironie et le refus déguisé." },
      { type: "qcm", q: "« estoy encantado de esperar bajo la lluvia » veut dire, en réalité :", opts: ["Il adore attendre sous la pluie", "Il est agacé d'avoir attendu sous la pluie (ironie)", "Il pleut à peine", "Il est parti"], a: 1, exp: "Ironie évidente : personne n'est ravi d'attendre sous la pluie." },
      { type: "vf", q: "Tout le passage repose sur l'ironie : la personne qui attend dit le contraire de ce qu'elle ressent.", a: true, exp: "Vrai : chaque réplique dit l'inverse (pas fâché, ravi d'attendre) pour exprimer l'agacement." }
    ],
    solution: `<p>Décryptage du dialogue :</p>
<pre class="pseudo">Réplique                          Sens réel (ironie/implicite)
«Solo llevo aquí una hora»        → tu m'as fait attendre trop longtemps.
«Sí, claro… tráfico contigo»      → je ne crois pas à ton excuse.
«¿Enfadarme yo? Qué va»           → si, je suis très fâché.
«encantado de esperar bajo la lluvia» → j'étais furieux de poireauter.</pre>
<p>Toute la scène fonctionne au <strong>second degré</strong> : la personne dit le contraire de ce qu'elle ressent pour exprimer son agacement de façon plus mordante (et plus drôle) qu'un reproche direct. Reconnaître ce décalage, c'est comprendre l'espagnol comme un natif.</p>`
  }
