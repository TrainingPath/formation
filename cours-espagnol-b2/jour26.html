  title: "Révisions de grammaire B2",
  subtitle: "Faire le point : subjonctif, conditionnelles, concordance et périphrases avant les projets.",
  theory: `
<h3>1. Une révision avant la ligne d'arrivée</h3>
<p>Avant d'attaquer les quatre projets finaux (jours 27 à 30), faisons le point sur les <strong>piliers grammaticaux du B2</strong>. Ce jour rassemble et consolide ce que tu as étudié : subjonctif, conditionnelles, concordance des temps et périphrases.</p>
<h3>2. L'indicatif face au subjonctif</h3>
<p>Le <strong>subjonctif</strong> exprime ce qui n'est pas présenté comme un fait réel : souhait, doute, émotion, but, jugement de valeur.</p>
<pre class="pseudo">Indicatif (fait réel)          Subjonctif (non factuel)
Sé que viene.                  Espero que venga.  (souhait)
Es verdad que estudia.         No creo que estudie. (doute)
Cuando llega, comemos.         Cuando llegue, comeremos. (futur)
Aunque llueve, salgo.          Aunque llueva, saldré. (hypothèse)</pre>
<div class="tip">Déclencheurs de subjonctif à mémoriser : verbes de volonté (querer que, pedir que), d'émotion (alegrarse de que, temer que), de doute (dudar que, no creer que), et les conjonctions de but/condition (para que, sin que, a menos que, siempre que).</div>
<h3>3. Les conditionnelles (si)</h3>
<pre class="pseudo">Type                Structure                       Exemple
Réelle (probable)   Si + présent, futur/présent     Si estudias, aprobarás.
Irréelle présent    Si + imperf. subj., condicional Si estudiaras, aprobarías.
Irréelle passé      Si + plusc. subj., condic. comp. Si hubieras estudiado, habrías aprobado.</pre>
<div class="warn">Erreur très fréquente : après <strong>si</strong> hypothétique, JAMAIS de conditionnel ni de futur ! On dit « Si tuviera dinero… » (et non « si tendría ») et « Si vienes mañana… » (et non « si vendrás »). Le conditionnel va dans l'AUTRE moitié de la phrase.</div>
<h3>4. La concordance des temps</h3>
<p>Quand le verbe principal est au passé, le subjonctif de la subordonnée passe à l'<strong>imparfait du subjonctif</strong>.</p>
<pre class="pseudo">Présent : Quiero que vengas.        (je veux que tu viennes)
Passé   : Quería que vinieras.      (je voulais que tu viennes)
Présent : Es raro que lo diga.
Passé   : Era raro que lo dijera.</pre>
<h3>5. Les périphrases verbales à réviser</h3>
<pre class="pseudo">ir a + inf.        futur proche : Voy a salir.
acabar de + inf.   venir de : Acabo de llegar.
volver a + inf.    refaire : Vuelve a intentarlo.
seguir + gérondif  continuer à : Sigue lloviendo.
soler + inf.       avoir l'habitude : Suelo desayunar café.
llevar + gérondif  ça fait… que : Llevo dos horas esperando.
ponerse a + inf.   se mettre à : Se puso a llorar.</pre>
<div class="tip">Ces sept périphrases reviennent constamment à l'oral. Les maîtriser rend ton espagnol beaucoup plus naturel et idiomatique que de traduire mot à mot depuis le français.</div>`,
  exercises: [
    { type: "qcm", q: "Après « Espero que… », on emploie :", opts: ["l'indicatif", "le subjonctif", "le conditionnel", "l'infinitif"], a: 1, exp: "Verbe de souhait → subjonctif : Espero que venga." },
    { type: "input", q: "Complète : « No creo que ___ verdad. » (ser, ello : subjonctif présent)", a: ["sea"], ph: "verbe", exp: "No creer que + subjonctif : no creo que sea verdad." },
    { type: "qcm", q: "« Cuando llegue, comeremos. » Pourquoi « llegue » (subjonctif) ?", opts: ["C'est une habitude", "C'est une action future non encore réalisée", "C'est un fait passé", "C'est un ordre"], a: 1, exp: "Cuando + subjonctif pour une action future : quand il arrivera (pas encore fait)." },
    { type: "input", q: "Conditionnelle irréelle : « Si ___ dinero, viajaría. » (tener, yo : imparfait du subjonctif)", a: ["tuviera", "tuviese"], ph: "verbe", exp: "Si + imparfait subj. : si tuviera/tuviese dinero, viajaría." },
    { type: "vf", q: "Après « si » hypothétique, on peut mettre le conditionnel (si tendría…).", a: false, exp: "Faux ! Jamais de conditionnel après si : on dit « si tuviera », pas « si tendría »." },
    { type: "qcm", q: "« Si hubieras estudiado, habrías aprobado. » Ce type de conditionnelle est :", opts: ["Réelle (probable)", "Irréelle du présent", "Irréelle du passé (regret)", "Un ordre"], a: 2, exp: "Plus-que-parfait subj. + conditionnel composé = irréel du passé (ce qui ne s'est pas produit)." },
    { type: "input", q: "Concordance : « Quería que ___ conmigo. » (venir, tú : imparfait du subjonctif)", a: ["vinieras", "vinieses"], ph: "verbe", exp: "Verbe principal au passé → subjonctif imparfait : quería que vinieras." },
    { type: "qcm", q: "« Acabo de llegar » signifie :", opts: ["Je vais arriver", "Je viens d'arriver", "J'arrive toujours", "Je continue d'arriver"], a: 1, exp: "Acabar de + inf. = venir de : je viens d'arriver." },
    { type: "input", q: "Complète la périphrase : « Llevo dos horas ___. » (esperar : gérondif)", a: ["esperando"], ph: "gérondif", exp: "Llevar + gérondif = ça fait… que : j'attends depuis deux heures." },
    { type: "qcm", q: "« Sigue lloviendo » veut dire :", opts: ["Il va pleuvoir", "Il vient de pleuvoir", "Il continue de pleuvoir", "Il ne pleut plus"], a: 2, exp: "Seguir + gérondif = continuer à : il continue de pleuvoir." },
    { type: "vf", q: "« Soler + infinitif » exprime une habitude (Suelo desayunar café).", a: true, exp: "Vrai : soler = avoir l'habitude de." },
    { type: "input", q: "Complète : « Se ___ a llorar de repente. » (ponerse, él : indefinido = il se mit à)", a: ["puso"], ph: "verbe", exp: "Ponerse a + inf. = se mettre à : se puso a llorar." },
    { type: "qcm", q: "« Para que » (afin que) se construit avec :", opts: ["l'indicatif", "le subjonctif", "l'infinitif toujours", "le conditionnel"], a: 1, exp: "Para que + subjonctif : te lo digo para que lo sepas." },
    { type: "qcm", q: "Compréhension : « Si tuviera tiempo, te ayudaría. » Le locuteur a-t-il le temps ?", opts: ["Oui, il a le temps", "Non, c'est hypothétique/irréel (il n'en a pas)", "Il en aura demain", "On ne peut pas savoir"], a: 1, exp: "Irréel du présent : en réalité il n'a pas le temps, donc il n'aide pas." },
    { type: "qcm", q: "Compréhension : « Era raro que lo dijera. » Ce temps montre que la phrase principale est :", opts: ["Au présent", "Au passé (era → dijera)", "Au futur", "À l'impératif"], a: 1, exp: "Concordance : era (passé) entraîne dijera (subjonctif imparfait)." }
  ],

    title: "Exercice final — Repaso general",
    intro: `<p>Un dernier tour d'horizon avant les projets. Choisis la forme correcte dans chaque cas :</p>
<pre class="pseudo">1. Ojalá (viene / venga) mañana a la fiesta.
2. Si (tendría / tuviera) más tiempo, aprendería italiano.
3. Cuando (llego / llegue) a casa, te llamaré.
4. Le pedí que me (ayuda / ayudara) con el informe.
5. Acabo (de / que) terminar el proyecto.</pre>`,
    questions: [
      { type: "qcm", q: "Phrase 1 : « Ojalá ___ mañana. » Forme correcte ?", opts: ["viene", "venga", "vendría", "vino"], a: 1, exp: "Ojalá + subjonctif : ojalá venga (pourvu qu'il vienne)." },
      { type: "qcm", q: "Phrase 2 : « Si ___ más tiempo, aprendería italiano. »", opts: ["tendría", "tuviera", "tengo", "tendré"], a: 1, exp: "Après si hypothétique : imparfait du subjonctif (tuviera), jamais tendría." },
      { type: "input", q: "Phrase 3 : « Cuando ___ a casa, te llamaré. » (llegar, yo : forme correcte)", a: ["llegue"], ph: "verbe", exp: "Action future → cuando + subjonctif : cuando llegue." },
      { type: "input", q: "Phrase 4 : « Le pedí que me ___ con el informe. » (ayudar : forme correcte)", a: ["ayudara", "ayudase"], ph: "verbe", exp: "Pedí (passé) que + subjonctif imparfait : ayudara/ayudase." },
      { type: "qcm", q: "Phrase 5 : « Acabo ___ terminar el proyecto. » Préposition correcte ?", opts: ["que", "de", "a", "en"], a: 1, exp: "Acabar DE + infinitif = venir de : acabo de terminar." }
    ],
    solution: `<p>Corrigé du repaso :</p>
<pre class="pseudo">1. Ojalá VENGA mañana.           (ojalá + subjonctif)
2. Si TUVIERA más tiempo…        (si + imparfait subj.)
3. Cuando LLEGUE a casa…         (futur → subjonctif)
4. Le pedí que me AYUDARA…       (concordance : passé → subj. imparfait)
5. Acabo DE terminar…            (périphrase acabar de + inf.)</pre>
<p>Ces cinq points — ojalá + subjonctif, conditionnelles en si, cuando futur, concordance des temps et périphrases — sont le socle du B2. Si tu les maîtdrises, tu es prêt(e) pour les projets finaux !</p>`
  }
};
