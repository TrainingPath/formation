  title: "Les expressions idiomatiques",
  subtitle: "Comprendre et employer les modismos : ces images figées qui font la saveur de l'espagnol.",
  theory: `
<h3>1. Le sens caché des expressions</h3>
<p>Une <strong>expression idiomatique</strong> (modismo, expresión idiomática) a un sens global qui ne se déduit pas des mots pris un à un. <em>Estar en las nubes</em> ne parle pas de météo mais signifie « être dans la lune ». Ces images sont essentielles pour comprendre les natifs et donner du relief à son expression.</p>
<div class="warn">Ne traduis jamais une expression mot à mot d'une langue à l'autre : « il pleut des cordes » ne se dit pas « llueve cuerdas » mais <em>llueve a cántaros</em> (litt. « il pleut à brocs »). Chaque langue a ses propres images.</div>
<h3>2. Expressions avec des parties du corps</h3>
<pre class="pseudo">tomar el pelo a alguien   se moquer de qqn, faire marcher   (litt. prendre les cheveux)
no tener pelos en la lengua  ne pas mâcher ses mots
echar una mano            donner un coup de main
costar un ojo de la cara  coûter les yeux de la tête
meter la pata             faire une gaffe                   (litt. mettre la patte)
hablar por los codos      être un moulin à paroles          (litt. parler par les coudes)
estar hasta las narices   en avoir ras-le-bol</pre>
<h3>3. Expressions avec des animaux et la nature</h3>
<pre class="pseudo">ser pan comido            être un jeu d'enfant             (litt. être du pain mangé)
buscarle tres pies al gato chercher midi à quatorze heures
estar como pez en el agua  être comme un poisson dans l'eau
llover a cántaros          pleuvoir des cordes
ponerse las pilas          se mettre au boulot, se secouer  (litt. se mettre les piles)
no hay color               il n'y a pas photo (aucune comparaison)
matar dos pájaros de un tiro faire d'une pierre deux coups</pre>
<h3>4. Expressions du quotidien et des émotions</h3>
<pre class="pseudo">estar en las nubes         être dans la lune
dar en el clavo            mettre dans le mille, taper juste
tirar la toalla            jeter l'éponge, abandonner
quedarse de piedra         rester bouche bée, sidéré
irse por las ramas         tourner autour du pot           (litt. partir par les branches)
hacer la vista gorda       fermer les yeux (sur qqch)
a lo hecho, pecho          ce qui est fait est fait
más vale tarde que nunca   mieux vaut tard que jamais</pre>
<div class="tip">Beaucoup de proverbes (refranes) ont un équivalent français : <em>No hay mal que por bien no venga</em> (À quelque chose malheur est bon), <em>Quien mucho abarca, poco aprieta</em> (Qui trop embrasse mal étreint), <em>A quien madruga, Dios le ayuda</em> (L'avenir appartient à ceux qui se lèvent tôt).</div>
<h3>5. Employer les expressions à bon escient</h3>
<p>Les expressions idiomatiques appartiennent surtout au registre <strong>familier ou courant</strong>. Elles sont parfaites dans une conversation, un récit vivant ou un échange informel, mais à doser dans un écrit très formel. L'important est de les employer <strong>au bon moment</strong> et sans les déformer : une expression mal placée ou tronquée trahit immédiatement le non-natif.</p>
<pre class="pseudo">— El examen fue pan comido, pero mi amigo se puso nervioso.
  (L'examen était un jeu d'enfant, mais mon ami s'est affolé.)
— No te preocupes, más vale tarde que nunca.
  (Ne t'inquiète pas, mieux vaut tard que jamais.)</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « estar en las nubes » ?", opts: ["Être très heureux", "Être dans la lune, distrait", "Être en avion", "Être malade"], a: 1, exp: "Estar en las nubes = être dans la lune, rêvasser." },
    { type: "input", q: "Complète : « ¿Me estás tomando el ___? No te creo. » (expression : se moquer de qqn)", a: ["pelo"], ph: "mot", exp: "Tomar el pelo a alguien = se moquer, faire marcher quelqu'un." },

    { type: "qcm", q: "Compréhension : « Cuando me lo dijo, me quedé de piedra. » Quelle réaction ?", opts: ["De la joie", "De la stupéfaction (bouche bée)", "De la colère", "De l'indifférence"], a: 1, exp: "Quedarse de piedra = rester sidéré, bouche bée." },

    { type: "vf", q: "« Más vale tarde que nunca » équivaut au français « mieux vaut tard que jamais ».", a: true, exp: "Vrai : proverbe équivalent presque mot pour mot." }

  final: {
    title: "Exercice final — Una conversación entre amigos",
    intro: `<p>Dos amigos charlan. Localiza las expresiones idiomáticas :</p>
<pre class="pseudo">—¿Al final aprobaste el examen de conducir?
—¡Sí! Fue pan comido, aunque al principio estaba en las nubes.
—No me lo creo, ¿me estás tomando el pelo?
—Que no, te lo juro. Me puse las pilas la última semana y di en el clavo.
—Me alegro. Yo suspendí el mío y casi tiro la toalla.
—No seas así, más vale tarde que nunca. La próxima lo consigues.
—Tienes razón. Oye, ¿me echas una mano para estudiar?
—Claro, así matamos dos pájaros de un tiro: repaso yo también.</pre>`,
    questions: [
      { type: "qcm", q: "« Fue pan comido » significa que el examen fue:", opts: ["Muy difícil", "Muy fácil", "Muy largo", "Muy caro"], a: 1, exp: "Ser pan comido = ser muy fácil." },
      { type: "input", q: "« ¿me estás tomando el ___? » : complète l'expression signifiant « se moquer »", a: ["pelo"], ph: "mot", exp: "Tomar el pelo = se moquer / faire marcher." },
      { type: "vf", q: "« Me puse las pilas » significa que la persona se esforzó y se motivó.", a: true, exp: "Verdadero : ponerse las pilas = espabilarse, ponerse a trabajar en serio." },
      { type: "input", q: "« casi ___ la toalla » : verbe qui complète l'expression signifiant « abandonner »", a: ["tiro"], ph: "verbe", exp: "Tirar la toalla = rendirse, abandonar." },
      { type: "qcm", q: "« matamos dos pájaros de un tiro » significa:", opts: ["Hacer daño a alguien", "Resolver dos cosas a la vez", "Perder el tiempo", "Discutir"], a: 1, exp: "Matar dos pájaros de un tiro = lograr dos objetivos con una sola acción." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">—Tu as fini par réussir ton permis de conduire ?
—Oui ! C'était un jeu d'enfant, même si au début j'étais dans la lune.
—Je n'y crois pas, tu te moques de moi ?
—Mais non, je te jure. Je m'y suis mis sérieusement la dernière semaine et j'ai visé juste.
—Je suis content. Moi j'ai raté le mien et j'ai failli jeter l'éponge.
—Ne sois pas comme ça, mieux vaut tard que jamais. La prochaine fois tu l'auras.
—Tu as raison. Dis, tu me donnes un coup de main pour réviser ?
—Bien sûr, comme ça on fait d'une pierre deux coups : je révise moi aussi.</pre>
<p>Les expressions idiomatiques donnent à un dialogue tout son naturel et sa chaleur. Retiens-les comme des blocs (jamais mot à mot), repère leur registre (surtout familier) et emploie-les à bon escient : bien placées, elles sont la signature d'un locuteur à l'aise.</p>`
  }
