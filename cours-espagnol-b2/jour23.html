<script>
var DAY = {
  num: 23,
  title: "Synthétiser un texte",
  subtitle: "Réduire un texte à l'essentiel : dégager la thèse, hiérarchiser et reformuler.",
  theory: `
<h3>1. Résumer, ce n'est pas recopier</h3>
<p><strong>Synthétiser</strong> (sintetizar), c'est reformuler un texte en gardant uniquement ses idées principales, avec ses propres mots et en beaucoup moins de place. C'est une compétence clé du B2 : à l'examen, à l'université, au travail, on doit sans cesse résumer.</p>
<h3>2. La méthode en quatre étapes</h3>
<pre class="pseudo">1. LEER   : lire le texte en entier, sans écrire.
2. SUBRAYAR : souligner l'idée principale de chaque paragraphe.
3. JERARQUIZAR : distinguer idées principales / secondaires / exemples.
4. REFORMULAR : réécrire avec ses propres mots, en reliant les idées.</pre>
<div class="tip">Règle d'or : dans une synthèse, on supprime les <strong>exemples</strong>, les <strong>répétitions</strong> et les <strong>détails chiffrés secondaires</strong>. On garde la thèse, les grands arguments et la conclusion. Une bonne synthèse fait environ un quart ou un tiers du texte de départ.</div>
<h3>3. Le verbes de reformulation</h3>
<p>Pour ne pas recopier, on emploie des verbes qui rapportent l'idée de l'auteur.</p>
<pre class="pseudo">el autor afirma que…      l'auteur affirme que…
el texto sostiene que…    le texte soutient que…
el artículo explica…      l'article explique…
según el autor, …         selon l'auteur, …
el texto destaca…         le texte souligne…
en conclusión, el autor…  en conclusion, l'auteur…</pre>
<h3>4. Les connecteurs de synthèse</h3>
<pre class="pseudo">en primer lugar          en premier lieu
por un lado… por otro    d'une part… d'autre part
asimismo                 de même
en cuanto a…             quant à…
en resumen / en síntesis en résumé / en synthèse
por lo tanto             par conséquent</pre>
<h3>5. Le texte à synthétiser</h3>
<p>Lee este texto y observa cómo se reduce a lo esencial.</p>
<p><em>El texto:</em> «Cada vez más jóvenes eligen viajar solos. Antes, viajar sin compañía se veía como algo raro o incluso triste; hoy, en cambio, se ha convertido en una tendencia. Los expertos señalan varias razones. En primer lugar, las redes sociales y las aplicaciones facilitan encontrar alojamiento y conocer gente por el camino, de modo que uno nunca está realmente aislado. En segundo lugar, viajar solo permite una libertad total: decidir el ritmo, cambiar de planes y salir de la zona de confort. Muchos viajeros afirman que esta experiencia les ha ayudado a ganar confianza en sí mismos. No obstante, también existen inconvenientes, como la soledad en algunos momentos o los riesgos de seguridad. Aun así, la mayoría coincide en que las ventajas superan a las desventajas.»</p>
<p><em>La síntesis (un tercio del texto):</em> «Según el texto, viajar solo se ha convertido en una tendencia entre los jóvenes. El autor destaca dos razones principales: la tecnología, que evita el aislamiento, y la libertad que ofrece esta forma de viajar, la cual aumenta la confianza personal. Aunque reconoce algunos inconvenientes, como la soledad o la seguridad, concluye que las ventajas son mayores.»</p>
<div class="warn">Piège : ne jamais donner son opinion dans une synthèse ! On rapporte fidèlement les idées de l'auteur, sans les juger ni les commenter. L'opinion personnelle, c'est pour un autre type de texte (l'essai argumentatif).</div>`,
  exercises: [
    { type: "qcm", q: "Synthétiser un texte, c'est :", opts: ["Le recopier fidèlement", "Le réduire à ses idées principales avec ses propres mots", "Le traduire", "Le critiquer"], a: 1, exp: "La synthèse garde l'essentiel, reformulé, en moins de place." },
    { type: "qcm", q: "Que supprime-t-on dans une synthèse ?", opts: ["La thèse", "Les exemples et répétitions", "La conclusion", "Les grands arguments"], a: 1, exp: "On enlève exemples, répétitions et détails secondaires ; on garde l'ossature." },
    { type: "input", q: "Complète un verbe de reformulation : « El autor ___ que la tecnología ayuda. » (affirme)", a: ["afirma"], ph: "verbe", exp: "El autor afirma que… = l'auteur affirme que…" },
    { type: "vf", q: "Dans une synthèse, on peut ajouter son opinion personnelle.", a: false, exp: "Faux : la synthèse rapporte fidèlement l'auteur, sans jugement personnel." },
    { type: "qcm", q: "Quelle est la bonne LONGUEUR d'une synthèse ?", opts: ["Aussi longue que le texte", "Environ un quart ou un tiers du texte", "Une seule phrase toujours", "Le double du texte"], a: 1, exp: "Une synthèse fait environ le tiers (ou le quart) de l'original." },
    { type: "input", q: "Complète le connecteur : « En ___ lugar, las redes sociales facilitan el viaje. » (premier)", a: ["primer"], ph: "mot", exp: "En primer lugar = en premier lieu." },
    { type: "qcm", q: "Quel est le sujet central du texte à synthétiser ?", opts: ["Les dangers d'Internet", "La tendance des jeunes à voyager seuls", "Le prix des voyages", "Les applications mobiles"], a: 1, exp: "Cada vez más jóvenes eligen viajar solos : c'est la thèse." },
    { type: "qcm", q: "Selon le texte, pourquoi voyager seul n'isole-t-il pas vraiment ?", opts: ["Parce qu'on voyage en groupe", "Grâce aux réseaux sociaux et aux applications", "Parce que c'est interdit", "Parce que c'est cher"], a: 1, exp: "Las redes sociales y las apps facilitan conocer gente : on n'est jamais isolé." },
    { type: "input", q: "Complète : « Viajar solo aumenta la ___ en sí mismo. » (confiance)", a: ["confianza"], ph: "mot", exp: "Ganar confianza en sí mismo = gagner confiance en soi." },
    { type: "qcm", q: "Quels inconvénients le texte reconnaît-il ?", opts: ["Le prix et le bruit", "La solitude et les risques de sécurité", "La langue et la nourriture", "Aucun"], a: 1, exp: "La soledad en algunos momentos y los riesgos de seguridad." },
    { type: "vf", q: "La conclusion du texte est que les avantages l'emportent sur les inconvénients.", a: true, exp: "La mayoría coincide en que las ventajas superan a las desventajas." },
    { type: "input", q: "Complète : « En ___, viajar solo tiene más ventajas que inconvenientes. » (résumé — un mot)", a: ["resumen", "síntesis"], ph: "connecteur", exp: "En resumen / en síntesis = en résumé." },
    { type: "qcm", q: "Dans la synthèse modèle, qu'a-t-on ENLEVÉ du texte original ?", opts: ["La thèse principale", "Les détails et la formulation « antes se veía como algo raro »", "Les deux raisons", "La conclusion"], a: 1, exp: "On supprime les détails et les répétitions ; on garde thèse + 2 raisons + conclusion." },
    { type: "qcm", q: "Compréhension : « las ventajas superan a las desventajas » veut dire :", opts: ["Les inconvénients l'emportent", "Les avantages dépassent les inconvénients", "Il n'y a pas d'avantages", "C'est équilibré"], a: 1, exp: "Superar = dépasser : les avantages sont plus nombreux/forts." },
    { type: "qcm", q: "Quel verbe convient pour rapporter une idée sans la juger ?", opts: ["criticar", "destacar / señalar", "inventar", "exagerar"], a: 1, exp: "Destacar / señalar = souligner / signaler : on rapporte fidèlement." }
  ],
  final: {
    title: "Exercice final — Sintetiza un texto",
    intro: `<p>Lis ce texte, puis réponds aux questions qui t'aident à repérer ce qu'une bonne synthèse doit garder :</p>
<pre class="pseudo">«El voluntariado atrae cada vez a más personas. Colaborar
sin recibir dinero puede parecer poco atractivo, pero ofrece
grandes recompensas. Por un lado, ayudar a los demás produce
una satisfacción personal enorme. Por otro, el voluntariado
permite adquirir experiencia, aprender idiomas y ampliar la
red de contactos. Algunas empresas incluso valoran esta
experiencia en el currículum. Es cierto que exige tiempo y
compromiso, pero la mayoría de los voluntarios asegura que
volvería a hacerlo.»</pre>`,
    questions: [
      { type: "qcm", q: "Quelle est la thèse à conserver ?", opts: ["Le bénévolat ne sert à rien", "Le bénévolat attire de plus en plus de personnes et offre de grandes récompenses", "Le bénévolat est mal payé", "Les entreprises détestent le bénévolat"], a: 1, exp: "C'est l'idée centrale : de plus en plus de gens, pour de grandes récompenses." },
      { type: "qcm", q: "Quels sont les deux grands avantages (à garder) ?", opts: ["Le salaire et les vacances", "La satisfaction personnelle et l'expérience/contacts", "La gloire et le pouvoir", "Le sport et la nourriture"], a: 1, exp: "Por un lado la satisfacción ; por otro la experiencia, idiomas y contactos." },
      { type: "input", q: "Quel détail secondaire peut-on SUPPRIMER dans la synthèse ? (indice : ce que font certaines…)", a: ["las empresas", "empresas", "el currículum"], ph: "détail", exp: "Le détail « algunas empresas lo valoran en el currículum » est un exemple secondaire." },
      { type: "qcm", q: "Quel inconvénient le texte reconnaît-il ?", opts: ["Le danger physique", "Le temps et l'engagement exigés", "Le coût financier", "La solitude"], a: 1, exp: "Exige tiempo y compromiso = demande du temps et de l'engagement." },
      { type: "vf", q: "Dans la synthèse, on doit garder l'opinion « moi je pense que le bénévolat est génial ».", a: false, exp: "Faux : aucune opinion personnelle dans une synthèse ; on rapporte seulement l'auteur." }
    ],
    solution: `<p>Exemple de synthèse (environ un tiers) :</p>
<pre class="pseudo">Según el texto, el voluntariado atrae a cada vez más gente
porque, aunque no está remunerado, ofrece grandes
recompensas: por un lado, la satisfacción de ayudar a los
demás; por otro, la posibilidad de ganar experiencia y
ampliar contactos. El autor reconoce que exige tiempo y
compromiso, pero concluye que la mayoría lo repetiría.</pre>
<p>On a gardé la thèse, les deux avantages majeurs et la conclusion nuancée. On a supprimé le détail des entreprises et du CV. Aucun jugement personnel : c'est une synthèse fidèle et concise.</p>`
  }
};
</script>
