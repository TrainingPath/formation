<script>
var DAY = {
  num: 7,
  title: "La mise en relief et l'ordre des mots",
  subtitle: "Déplacer, dédoubler et encadrer pour mettre l'accent sur ce qui compte.",
  theory: `
<h3>1. Un ordre des mots plus souple qu'en français</h3>
<p>L'espagnol jouit d'une grande <strong>liberté syntaxique</strong> grâce à ses terminaisons verbales : le sujet peut se placer après le verbe, et l'élément qu'on veut souligner se déplace en tête ou en fin de phrase. Cette souplesse est un outil stylistique majeur au B2.</p>
<pre class="pseudo">Neutre :   Juan compró el coche ayer.
Relief :   Ayer compró Juan el coche.   (accent sur le moment)
Relief :   El coche lo compró Juan.      (accent sur l'objet, repris par « lo »)</pre>
<h3>2. La reprise pronominale de l'objet antéposé</h3>
<p>Quand on place le <strong>complément d'objet direct</strong> en tête de phrase, on le <strong>reprend</strong> obligatoirement par le pronom correspondant (lo, la, los, las). C'est la <em>dislocation</em>.</p>
<pre class="pseudo">A María la vi ayer.          (María, je l'ai vue hier.)
Ese libro ya lo he leído.    (Ce livre, je l'ai déjà lu.)
El dinero se lo di a él.     (L'argent, je le lui ai donné.)</pre>
<div class="warn">La reprise est obligatoire avec un objet direct défini antéposé : on dit <em>A tus padres los respeto</em>, pas « A tus padres respeto ». Le pronom « los » est indispensable.</div>
<h3>3. Les structures emphatiques avec « ser »</h3>
<p>Pour insister fortement sur un élément, l'espagnol emploie des tournures avec le verbe <strong>ser</strong>, équivalentes du français « c'est… que / c'est… qui ». Le verbe <em>ser</em> s'accorde en temps avec la phrase.</p>
<pre class="pseudo">Fue Juan quien compró el coche.        (C'est Juan qui acheta la voiture.)
Es aquí donde nos conocimos.           (C'est ici que nous nous sommes connus.)
Fue por eso por lo que me marché.      (C'est pour cela que je suis parti.)
Lo que quiero es descansar.            (Ce que je veux, c'est me reposer.)</pre>
<div class="tip">Le relatif s'accorde avec la nature de l'élément souligné : personne → <em>quien / el que</em> ; lieu → <em>donde</em> ; temps → <em>cuando</em> ; cause → <em>por lo que</em> ; manière → <em>como</em>. Pour une chose neutre, on emploie <em>lo que</em> : <em>Lo que me gusta es leer</em>.</p></div>
<h3>4. L'antéposition pour l'emphase et le contraste</h3>
<p>On peut avancer un adjectif, un adverbe ou un complément pour créer un effet d'insistance ou de contraste, très fréquent dans la langue soignée et littéraire.</p>
<pre class="pseudo">Mucho has tardado.            (Tu as mis bien du temps.) — emphase
Difícil lo tienes.           (Tu n'as pas la tâche facile.)
A ti no te lo voy a permitir. (À toi, je ne vais pas le permettre.) — contraste</pre>
<h3>5. Le sujet après le verbe</h3>
<p>Avec certains verbes (apparition, existence, événement) et dans les questions, le sujet suit naturellement le verbe. Cet ordre <strong>Verbe-Sujet</strong> est neutre, pas emphatique.</p>
<pre class="pseudo">Llegó el tren.               (Le train est arrivé.)
Me gustan los idiomas.       (J'aime les langues — sujet = los idiomas.)
¿Qué dijo tu jefe?           (Qu'a dit ton patron ?)
Falta una silla.             (Il manque une chaise.)</pre>
<div class="warn">Ne calque pas l'ordre français rigide sujet-verbe-objet. En espagnol, « Me gustan los idiomas » est correct et naturel : le vrai sujet grammatical (los idiomas) suit le verbe.</div>`,
  exercises: [
    { type: "qcm", q: "Quand on antépose un objet direct défini, que doit-on faire ?", opts: ["Rien de spécial", "Le reprendre par un pronom (lo, la, los, las)", "Ajouter « que »", "Le mettre au pluriel"], a: 1, exp: "Dislocation : A María la vi ayer. La reprise pronominale est obligatoire." },
    { type: "input", q: "Complète la reprise : « Ese libro ya ___ he leído. » (pronom COD)", a: ["lo"], ph: "pronom", exp: "El libro (masc. sing.) → lo : ya lo he leído." },
    { type: "qcm", q: "« Fue Juan quien compró el coche. » Que met en relief cette structure ?", opts: ["Le moment", "L'objet", "Le sujet (Juan)", "Le lieu"], a: 2, exp: "Fue... quien souligne le sujet : c'est Juan qui a acheté." },
    { type: "input", q: "Complète (relief de lieu) : « Es aquí ___ nos conocimos. »", a: ["donde"], ph: "relatif", exp: "Lieu → donde : c'est ici que nous nous sommes connus." },
    { type: "vf", q: "« A tus padres respeto » est correct sans pronom.", a: false, exp: "Faux : objet direct antéposé défini → reprise obligatoire : A tus padres los respeto." },
    { type: "qcm", q: "Dans « Me gustan los idiomas », quel est le sujet grammatical ?", opts: ["Me", "gustan", "los idiomas", "il n'y en a pas"], a: 2, exp: "Le sujet est « los idiomas » (ce qui plaît), placé après le verbe." },
    { type: "input", q: "Complète (relief neutre) : « ___ que quiero es descansar. »", a: ["lo"], ph: "mot", exp: "Lo que quiero es descansar : structure emphatique neutre." },
    { type: "qcm", q: "« Ayer compró Juan el coche. » Quel effet produit l'antéposition de « ayer » ?", opts: ["Aucun", "Elle met l'accent sur le moment", "Elle rend la phrase fausse", "Elle change le sujet"], a: 1, exp: "Placer « ayer » en tête souligne le repère temporel." },
    { type: "input", q: "Complète (relief de personne) : « Fue mi hermana ___ me lo dijo. »", a: ["quien", "la que"], ph: "relatif", exp: "Personne → quien / la que : c'est ma soeur qui me l'a dit." },
    { type: "qcm", q: "« El coche lo compró Juan. » Pourquoi « lo » ?", opts: ["C'est une faute", "Reprise de l'objet direct antéposé (el coche)", "C'est le sujet", "Pour la rime"], a: 1, exp: "Objet direct en tête → repris par le pronom lo." },
    { type: "vf", q: "En espagnol, le sujet peut se placer après le verbe sans que ce soit une faute.", a: true, exp: "Vrai : Llegó el tren, Me gustan los idiomas — ordre V-S naturel." },
    { type: "input", q: "Complète (relief de cause) : « Fue por eso por ___ que me marché. »", a: ["lo"], ph: "mot", exp: "Cause → por lo que : c'est pour cela que je suis parti." },
    { type: "qcm", q: "Compréhension : « A ti no te lo voy a permitir. » Quel effet crée l'antéposition de « a ti » ?", opts: ["Une question", "Un contraste emphatique (à toi en particulier)", "Une hypothèse", "Une négation double fautive"], a: 1, exp: "A ti antéposé + reprise « te » = insistance/contraste sur le destinataire." },
    { type: "qcm", q: "Compréhension : « Lo que me molesta es su actitud. » Que souligne cette phrase ?", opts: ["Le sujet parlant", "Ce qui dérange précisément (son attitude)", "Le lieu", "Le moment"], a: 1, exp: "Lo que... es... isole et met en relief l'élément « su actitud »." },
    { type: "vf", q: "« Es aquí donde vivo » et « Aquí vivo » ont exactement la même force expressive.", a: false, exp: "Faux : la structure « Es aquí donde… » insiste bien davantage sur le lieu que le simple « Aquí vivo »." }
  ],
  final: {
    title: "Exercice final — Un discurso con énfasis",
    intro: `<p>Fragmento de un discurso. Observa las estructuras de énfasis y el orden de las palabras :</p>
<pre class="pseudo">Muchas cosas hemos logrado juntos este año.
A vosotros os debo cada uno de esos éxitos.
Fue vuestro esfuerzo lo que hizo posible el proyecto.
El primer premio lo ganamos gracias a la constancia.
Lo que de verdad importa no son los trofeos, sino el equipo.
Es aquí, en esta sala, donde empezó todo.
Difícil lo teníamos al principio, y sin embargo lo conseguimos.
Por eso quiero daros las gracias: sin vosotros, nada de esto existiría.</pre>`,
    questions: [
      { type: "qcm", q: "« A vosotros os debo cada éxito. » ¿Por qué aparece « os »?", opts: ["Es un error", "Reprise pronominale del complemento antepuesto « a vosotros »", "Es el sujeto", "Marca el futuro"], a: 1, exp: "El objeto indirecto antepuesto (a vosotros) se retoma con « os »." },
      { type: "input", q: "« Fue vuestro esfuerzo ___ hizo posible el proyecto » : relatif neutre de mise en relief", a: ["lo que"], ph: "relatif", exp: "Cosa/neutro → lo que : fue vuestro esfuerzo lo que…" },
      { type: "vf", q: "« El primer premio lo ganamos » retoma con « lo » el objeto directo antepuesto.", a: true, exp: "Verdadero : el primer premio (objeto directo) se retoma con « lo »." },
      { type: "qcm", q: "« Es aquí, en esta sala, donde empezó todo. » ¿Qué se pone de relieve?", opts: ["El tiempo", "El sujeto", "El lugar", "La causa"], a: 2, exp: "Es aquí… donde… realza el lugar." },
      { type: "input", q: "« ___ lo teníamos al principio » : antéposition emphatique d'un adjectif signifiant « difficile »", a: ["difícil"], ph: "adjectif", exp: "Difícil lo teníamos : l'adjectif antéposé crée l'emphase." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Nous avons accompli beaucoup de choses ensemble cette année.
C'est à vous que je dois chacun de ces succès.
C'est votre effort qui a rendu le projet possible.
Le premier prix, nous l'avons gagné grâce à la constance.
Ce qui compte vraiment, ce ne sont pas les trophées, mais l'équipe.
C'est ici, dans cette salle, que tout a commencé.
La tâche n'était pas facile au début, et pourtant nous y sommes parvenus.
C'est pourquoi je veux vous remercier : sans vous, rien de tout cela n'existerait.</pre>
<p>Retiens les trois leviers : la <strong>dislocation</strong> (objet antéposé repris par un pronom), les <strong>structures avec ser</strong> (fue… quien / es… donde / lo que… es), et l'<strong>ordre libre</strong> qui permet d'avancer l'élément clé. Ce sont des marqueurs d'un espagnol expressif et maîtrisé.</p>`
  }
};
</script>
