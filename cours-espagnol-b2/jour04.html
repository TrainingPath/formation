  title: "La concordance des temps",
  subtitle: "Accorder le temps de la subordonnée au subjonctif avec celui de la principale.",
  theory: `
<h3>1. Qu'est-ce que la concordance des temps ?</h3>
<p>Quand une principale déclenche le subjonctif dans une subordonnée (volonté, émotion, doute, but…), le <strong>temps du subjonctif</strong> dépend du temps du verbe principal. C'est la <em>concordancia de tiempos</em>. On distingue deux grands ensembles : les temps « du présent » et les temps « du passé ».</p>
<pre class="pseudo">Verbe principal            Subjonctif dans la subordonnée
présent / futur / impératif  → subjonctif présent (ou passé composé)
passé / conditionnel         → subjonctif imparfait (ou plus-que-parfait)</pre>
<h3>2. Principale au présent : subjonctif présent</h3>
<p>Si le verbe principal est au présent, au futur ou à l'impératif, la subordonnée est au <strong>subjonctif présent</strong> (simultanéité ou postériorité) ou au <strong>subjonctif passé composé</strong> (antériorité).</p>
<pre class="pseudo">Quiero que vengas.              (Je veux que tu viennes.)      — simultané/futur
Me alegro de que hayas venido.  (Je me réjouis que tu sois venu.) — antérieur
Te llamaré cuando llegue.       (Je t'appellerai quand j'arriverai.)</pre>
<h3>3. Principale au passé : subjonctif imparfait</h3>
<p>Si le verbe principal est à un temps du passé (indefinido, imperfecto, pluscuamperfecto) ou au conditionnel, la subordonnée passe au <strong>subjonctif imparfait</strong> (simultanéité/postériorité) ou au <strong>subjonctif plus-que-parfait</strong> (antériorité).</p>
<pre class="pseudo">Quería que vinieras.               (Je voulais que tu viennes.)     — simultané
Me alegré de que hubieras venido.  (Je me réjouis que tu sois venu.) — antérieur
Me pidió que la llamara al llegar. (Il me demanda de l'appeler à mon arrivée.)</pre>
<div class="warn">Erreur fréquente : garder le subjonctif présent après un passé. On ne dit pas « Quería que vengas » mais <em>Quería que vinieras</em>. Le passé de la principale « tire » la subordonnée vers l'imparfait du subjonctif.</div>
<h3>4. Tableau récapitulatif</h3>
<pre class="pseudo">PRINCIPALE            SUBORDONNÉE (subjonctif)
                      simultané/postérieur     antérieur
presente/futuro   →   presente                 pretérito perfecto
                      (que venga)              (que haya venido)
pasado/condicional →  imperfecto               pluscuamperfecto
                      (que viniera)            (que hubiera venido)</pre>
<h3>5. Le style indirect au passé</h3>
<p>La concordance gouverne aussi le <strong>discours rapporté</strong>. En passant au passé, les temps « reculent » d'un cran.</p>
<pre class="pseudo">Style direct                     Style indirect (au passé)
« Vengo mañana. »          →     Dijo que venía al día siguiente.
« Lo he hecho. »           →     Dijo que lo había hecho.
« Vendré. »                →     Dijo que vendría.
« Ven aquí. » (impératif)  →     Me pidió que fuera allí.</pre>
<div class="tip">Récapitule les glissements du discours rapporté : présent → imparfait ; pretérito perfecto → pluscuamperfecto ; futur → conditionnel ; impératif → subjonctif imparfait. Les repères de temps et de lieu changent aussi : <em>hoy → aquel día, mañana → al día siguiente, aquí → allí</em>.</div>`,
  exercises: [
    { type: "qcm", q: "Après une principale au présent (« Quiero que… »), quel subjonctif emploie-t-on pour une action simultanée ?", opts: ["Subjonctif imparfait", "Subjonctif présent", "Indicatif présent", "Conditionnel"], a: 1, exp: "Présent → subjonctif présent : Quiero que vengas." },
    { type: "input", q: "Complète : « Quería que ___ (venir, tú) a la fiesta. » (subjonctif imparfait)", a: ["vinieras", "vinieses"], ph: "verbe", exp: "Passé (quería) → subjonctif imparfait : vinieras." },
    { type: "qcm", q: "« Me alegro de que hayas venido. » Le subjonctif passé composé marque :", opts: ["La postériorité", "La simultanéité", "L'antériorité par rapport au présent", "Une hypothèse"], a: 2, exp: "Haya venido = action antérieure au « me alegro » présent." },

    { type: "input", q: "Discours indirect : « Vengo mañana » → « Dijo que ___ (venir) al día siguiente. » (imparfait indicatif)", a: ["venía"], ph: "verbe", exp: "Présent → imparfait dans le style rapporté au passé." },
    { type: "qcm", q: "« Dijo que lo había hecho. » Le style direct était :", opts: ["« Lo haré »", "« Lo he hecho »", "« Lo hago »", "« Hazlo »"], a: 1, exp: "Pretérito perfecto → pluscuamperfecto : « Lo he hecho » → había hecho." },
    { type: "input", q: "Discours indirect : « Vendré » → « Dijo que ___. » (conditionnel de venir)", a: ["vendría"], ph: "verbe", exp: "Futur → conditionnel : vendré → vendría." },
    { type: "qcm", q: "« Ven aquí » (impératif) devient au style indirect passé :", opts: ["Me dijo que venga aquí", "Me pidió que fuera allí", "Me dice que vaya", "Me pidió que vengo"], a: 1, exp: "Impératif → subjonctif imparfait ; aquí → allí." },
    { type: "vf", q: "Dans le discours rapporté au passé, « hoy » devient « aquel día ».", a: true, exp: "Vrai : les repères temporels glissent (hoy → aquel día, mañana → al día siguiente)." },
    { type: "input", q: "Complète (antériorité au passé) : « Me alegré de que ___ (haber, tú) venido. » (subj. imparfait de haber)", a: ["hubieras", "hubieses"], ph: "auxiliaire", exp: "Passé + antériorité → subjonctif plus-que-parfait : hubieras venido." },
    { type: "qcm", q: "Compréhension : « Espero que apruebes » puis rapporté au passé donne :", opts: ["Esperaba que aprobaras", "Esperaba que apruebes", "Espero que aprobaras", "Esperé que apruebas"], a: 0, exp: "Present → passé fait passer le subjonctif présent au subjonctif imparfait." },
    { type: "qcm", q: "Compréhension : « Te llamaré cuando llegue. » Pourquoi « llegue » au subjonctif ?", opts: ["C'est une habitude", "« cuando » + futur emploie le subjonctif présent", "C'est un ordre", "C'est une hypothèse irréelle"], a: 1, exp: "Cuando à valeur future entraîne le subjonctif présent : cuando llegue." },
    { type: "vf", q: "Une principale au futur (« Le diré que… ») demande le subjonctif présent dans la subordonnée.", a: true, exp: "Vrai : le futur appartient à la sphère du présent → subjonctif présent." }
  ],
  final: {
    title: "Exercice final — Del deseo al recuerdo",
    intro: `<p>Observa cómo cambia el subjuntivo según el tiempo de la principal y cómo funciona el estilo indirecto :</p>
<pre class="pseudo">Mi entrenador siempre quiere que entrenemos con disciplina.
El año pasado, en cambio, quería que descansáramos más.
Me alegro de que hayamos ganado la última competición.
Entonces me alegré de que hubiéramos aguantado hasta el final.

Más tarde comprendí que me había pedido que confiara en mí mismo.
Espero que el próximo año lleguemos aún más lejos.
Él prometió que nos acompañaría pasara lo que pasara.</pre>`,

      { type: "qcm", q: "« Me alegro de que hayamos ganado » usa el subjuntivo perfecto porque:", opts: ["La principal está en pasado", "La principal está en presente y la acción es anterior", "Es una hipótesis", "Es una orden"], a: 1, exp: "Presente + anterioridad → pretérito perfecto de subjuntivo." },
      { type: "input", q: "« me había pedido que ___ en mí mismo » : subj. imparfait de CONFIAR (yo)", a: ["confiara", "confiase"], ph: "verbe", exp: "Había pedido (pasado) → subjuntivo imperfecto : confiara." },
      { type: "vf", q: "« Confía en ti mismo » (imperativo) se convierte en estilo indirecto pasado en « que confiara en mí mismo ».", a: true, exp: "Verdadero : imperativo → subjuntivo imperfecto en el discurso referido al pasado." },
      { type: "qcm", q: "« prometió que nos acompañaría » : ¿por qué « acompañaría »?", opts: ["Es un presente", "El futuro del estilo directo pasa a condicional", "Es un subjuntivo", "Es una orden"], a: 1, exp: "Estilo directo « acompañaré » → condicional « acompañaría » en pasado." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Mon entraîneur veut toujours que nous nous entraînions avec discipline.
L'an dernier, en revanche, il voulait que nous nous reposions davantage.
Je me réjouis que nous ayons gagné la dernière compétition.
À l'époque, je fus content que nous ayons tenu jusqu'au bout.
Avant la course il m'a dit : « Aie confiance en toi. »
Plus tard je compris qu'il m'avait demandé d'avoir confiance en moi.
J'espère que l'an prochain nous irons encore plus loin.
Il promit qu'il nous accompagnerait quoi qu'il arrive.</pre>
<p>Le principe est constant : une principale au présent/futur appelle le subjonctif présent (ou passé composé) ; une principale au passé ou au conditionnel appelle le subjonctif imparfait (ou plus-que-parfait). Le discours rapporté suit la même logique de recul temporel.</p>`
  }
};
