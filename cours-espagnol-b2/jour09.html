<script>
var DAY = {
  num: 9,
  title: "Articuler un argumentaire",
  subtitle: "Les connecteurs logiques pour structurer une opinion : ordre, cause, opposition, conclusion.",
  theory: `
<h3>1. Pourquoi les connecteurs sont décisifs</h3>
<p>Au B2, la différence entre un discours confus et un discours convaincant tient souvent aux <strong>connecteurs</strong> (conectores del discurso). Ils balisent le raisonnement, signalent les transitions et guident l'auditeur ou le lecteur. Les maîtriser, c'est passer d'une juxtaposition d'idées à une véritable argumentation.</p>
<h3>2. Introduire et ordonner ses idées</h3>
<pre class="pseudo">Empezar :      En primer lugar, para empezar, ante todo
Continuar :    En segundo lugar, además, asimismo, por otra parte
Añadir :       Es más, incluso, no solo... sino también
Ejemplos :     por ejemplo, como muestra, en concreto, a saber
Terminar :     por último, finalmente, en definitiva</pre>
<pre class="pseudo">En primer lugar, el teletrabajo ahorra tiempo. Además, reduce el estrés.
(D'abord, le télétravail fait gagner du temps. De plus, il réduit le stress.)</pre>
<h3>3. Exprimer la cause et la conséquence</h3>
<pre class="pseudo">Causa :        porque, ya que, puesto que, debido a, dado que, a causa de
Consecuencia : por lo tanto, por consiguiente, así pues, de ahí que, por eso</pre>
<pre class="pseudo">La empresa creció; por lo tanto, contrató a más personal.
(L'entreprise a grandi ; par conséquent, elle a embauché davantage.)</pre>
<div class="warn">Attention : <em>de ahí que</em> (« d'où le fait que ») est suivi du <strong>subjonctif</strong> : <em>No estudió; de ahí que suspendiera</em> (Il n'a pas étudié ; d'où son échec). C'est un connecteur soutenu très apprécié à l'écrit.</div>
<h3>4. Opposer, nuancer, concéder</h3>
<pre class="pseudo">Oposición :    pero, sin embargo, no obstante, en cambio, por el contrario
Concesión :    aunque, a pesar de (que), si bien, aun así, con todo
Restricción :  ahora bien, salvo que, excepto</pre>
<pre class="pseudo">El proyecto es ambicioso; sin embargo, carece de presupuesto.
(Le projet est ambitieux ; cependant, il manque de budget.)
Si bien reconozco sus méritos, no comparto sus métodos.
(Bien que je reconnaisse ses mérites, je ne partage pas ses méthodes.)</pre>
<div class="tip">Nuances d'opposition : <em>pero</em> est neutre et courant ; <em>sin embargo</em> et <em>no obstante</em> sont plus formels ; <em>en cambio</em> et <em>por el contrario</em> marquent un contraste entre deux éléments. Varier ces connecteurs enrichit nettement un texte.</div>
<h3>5. Structurer l'opinion et conclure</h3>
<pre class="pseudo">Opinar :       en mi opinión, a mi juicio, desde mi punto de vista, considero que
Certeza :      es evidente que, sin duda, cabe destacar que
Reformular :   es decir, o sea, en otras palabras, dicho de otro modo
Concluir :     en conclusión, en resumen, en definitiva, para concluir</pre>
<div class="tip">Structure type d'un paragraphe argumenté : <strong>introduction</strong> de la thèse (Considero que…), <strong>arguments</strong> ordonnés (En primer lugar… Además…), <strong>contre-argument concédé</strong> (Si bien… sin embargo…), <strong>conclusion</strong> (En definitiva…). Ce squelette structure aussi bien un essai qu'une intervention orale.</div>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur sert à INTRODUIRE la première idée ?", opts: ["por último", "en primer lugar", "sin embargo", "por lo tanto"], a: 1, exp: "En primer lugar = d'abord, ouvre l'énumération." },
    { type: "input", q: "Complète (conséquence formelle) : « La demanda subió; por lo ___, subieron los precios. »", a: ["tanto"], ph: "mot", exp: "Por lo tanto = par conséquent." },
    { type: "qcm", q: "« De ahí que » est suivi de quel mode ?", opts: ["Indicatif", "Subjonctif", "Conditionnel", "Impératif"], a: 1, exp: "De ahí que + subjonctif : de ahí que suspendiera." },
    { type: "input", q: "Complète (opposition formelle) : « Es un buen plan; sin ___, es caro. »", a: ["embargo"], ph: "mot", exp: "Sin embargo = cependant, connecteur d'opposition soutenu." },
    { type: "vf", q: "« Sin embargo » et « no obstante » sont plus formels que « pero ».", a: true, exp: "Vrai : pero est neutre ; sin embargo / no obstante appartiennent au registre soigné." },
    { type: "qcm", q: "Quel connecteur sert à REFORMULER une idée ?", opts: ["es decir", "por ejemplo", "en primer lugar", "a pesar de"], a: 0, exp: "Es decir / o sea = c'est-à-dire, reformulation." },
    { type: "input", q: "Complète (cause soutenue) : « No pudo asistir, ___ que estaba enfermo. » (connecteur causal en un mot commençant par « ya »)", a: ["ya"], ph: "mot", exp: "Ya que = puisque, connecteur de cause." },
    { type: "qcm", q: "« Si bien reconozco sus méritos, no lo apoyo. » Que exprime « si bien » ?", opts: ["Une cause", "Une concession (bien que)", "Une conséquence", "Un exemple"], a: 1, exp: "Si bien = bien que, concession en registre soutenu." },
    { type: "input", q: "Complète (conclusion) : « En ___, el balance es positivo. » (mot signifiant « en définitive »)", a: ["definitiva"], ph: "mot", exp: "En definitiva = en définitive, connecteur de conclusion." },
    { type: "qcm", q: "Quelle paire exprime un CONTRASTE entre deux éléments ?", opts: ["además / asimismo", "en cambio / por el contrario", "porque / ya que", "es decir / o sea"], a: 1, exp: "En cambio / por el contrario opposent deux réalités distinctes." },
    { type: "vf", q: "« Por consiguiente » est un connecteur de conséquence.", a: true, exp: "Vrai : por consiguiente = par conséquent (registre formel)." },
    { type: "input", q: "Complète (ajout) : « No solo es rápido, ___ también es barato. »", a: ["sino"], ph: "mot", exp: "No solo... sino también = non seulement... mais aussi." },
    { type: "qcm", q: "Compréhension : « El plan es viable; ahora bien, requiere tiempo. » Que introduit « ahora bien » ?", opts: ["Une conclusion", "Une restriction / nuance", "Une cause", "Un exemple"], a: 1, exp: "Ahora bien introduit une réserve ou une nuance à ce qui précède." },
    { type: "qcm", q: "Compréhension : « Debido a la crisis, muchos cerraron. » Quelle relation logique ?", opts: ["Opposition", "Cause", "Conclusion", "Reformulation"], a: 1, exp: "Debido a = à cause de : relation de cause." },
    { type: "vf", q: "Un bon paragraphe argumenté concède souvent un contre-argument avant de le réfuter (si bien… sin embargo…).", a: true, exp: "Vrai : concéder puis nuancer renforce la crédibilité de l'argumentation." }
  ],
  final: {
    title: "Exercice final — ¿Es beneficioso el teletrabajo?",
    intro: `<p>Texto argumentativo. Observa cómo los conectores organizan el razonamiento :</p>
<pre class="pseudo">En los últimos años, el teletrabajo se ha extendido enormemente.
En primer lugar, permite ahorrar tiempo y dinero en desplazamientos.
Además, ofrece una mayor flexibilidad para conciliar vida laboral y familiar.
Es más, numerosos estudios muestran que la productividad no disminuye.
Sin embargo, no todo son ventajas: puede provocar aislamiento.
Si bien reconozco este riesgo, considero que se puede combatir con reuniones periódicas.
Por lo tanto, dado que los beneficios superan a los inconvenientes, defiendo este modelo.
En definitiva, el teletrabajo, bien organizado, representa el futuro del empleo.</pre>`,
    questions: [
      { type: "input", q: "« En primer ___, permite ahorrar tiempo » : mot qui complète le connecteur d'ouverture", a: ["lugar"], ph: "mot", exp: "En primer lugar = d'abord." },
      { type: "qcm", q: "« Sin embargo, no todo son ventajas » introduce:", opts: ["Un ejemplo", "Una oposición / matiz", "Una causa", "Una conclusión"], a: 1, exp: "Sin embargo marca la oposición con lo dicho antes." },
      { type: "vf", q: "« Si bien reconozco este riesgo » es una concesión antes de matizar.", a: true, exp: "Verdadero : si bien concede el argumento contrario para luego rebatirlo." },
      { type: "input", q: "« Por lo ___, dado que los beneficios superan… » : connecteur de conséquence", a: ["tanto"], ph: "mot", exp: "Por lo tanto = por consiguiente, conclusión lógica." },
      { type: "qcm", q: "« En definitiva » sirve para:", opts: ["Introducir la tesis", "Dar un ejemplo", "Concluir el razonamiento", "Expresar una causa"], a: 2, exp: "En definitiva cierra y resume la argumentación." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Ces dernières années, le télétravail s'est énormément répandu.
En premier lieu, il permet d'économiser temps et argent en déplacements.
De plus, il offre une plus grande flexibilité pour concilier vie professionnelle et familiale.
Qui plus est, de nombreuses études montrent que la productivité ne diminue pas.
Cependant, tout n'est pas avantage : il peut provoquer de l'isolement.
Bien que je reconnaisse ce risque, j'estime qu'on peut le combattre par des réunions régulières.
Par conséquent, étant donné que les bénéfices l'emportent sur les inconvénients, je défends ce modèle.
En définitive, le télétravail, bien organisé, représente l'avenir de l'emploi.</pre>
<p>Repère la mécanique argumentative : ouverture (en primer lugar), addition graduée (además, es más), objection concédée (sin embargo, si bien), puis conclusion logique (por lo tanto, en definitiva). C'est ce fil de connecteurs qui rend un texte cohérent et persuasif.</p>`
  }
};
</script>
