<script>
var DAY = {
  num: 17,
  title: "Débattre : nuancer et concéder",
  subtitle: "Défendre une opinion sans être catégorique : concéder, opposer et relativiser en espagnol.",
  theory: `
<h3>1. Débattre au niveau B2</h3>
<p>Débattre, ce n'est pas asséner des certitudes : c'est <strong>argumenter avec nuance</strong>. Un locuteur B2 sait reconnaître une part de vérité chez l'autre (concéder), puis marquer son désaccord (opposer), tout en relativisant ses propres affirmations. Ces trois gestes rendent le discours crédible et poli.</p>
<h3>2. Concéder : donner raison en partie</h3>
<p>Concéder, c'est admettre un point avant de le nuancer. Le connecteur roi est <strong>aunque</strong> (bien que), qui déclenche souvent le <strong>subjonctif</strong> quand l'objection est présentée comme une hypothèse ou une réserve.</p>
<pre class="pseudo">Es cierto que… pero…            Il est vrai que… mais…
Aunque tengas razón, …          Bien que tu aies raison, …
Si bien es verdad que…          S'il est vrai que…
Reconozco que…, sin embargo…    Je reconnais que…, cependant…
Por supuesto, pero hay que…     Bien sûr, mais il faut…</pre>
<div class="tip">Avec <strong>aunque</strong> : indicatif = fait réel admis (« Aunque llueve, salgo » = bien qu'il pleuve — et il pleut vraiment — je sors) ; subjonctif = concession hypothétique ou minimisée (« Aunque llueva, saldré » = même s'il pleut, je sortirai).</div>
<h3>3. Opposer : marquer le désaccord</h3>
<pre class="pseudo">sin embargo            cependant
no obstante            néanmoins
por el contrario       au contraire
en cambio              en revanche
mientras que           tandis que
ahora bien             ceci dit / cela étant</pre>
<h3>4. Nuancer et relativiser</h3>
<p>Pour ne pas paraître catégorique, on emploie des <strong>atténuateurs</strong> : ils adoucissent l'affirmation.</p>
<pre class="pseudo">en cierto modo         d'une certaine manière
hasta cierto punto     jusqu'à un certain point
depende de…            cela dépend de…
todo depende           tout dépend
no del todo            pas tout à fait
más bien               plutôt
en general             en général
suele ocurrir que…     il arrive souvent que…</pre>
<h3>5. Structurer une prise de parole</h3>
<pre class="pseudo">1. Poser sa thèse   : Desde mi punto de vista, …
2. Concéder         : Es verdad que…, pero…
3. Argumenter       : Además…, por un lado… por otro…
4. Nuancer          : Aunque…, hasta cierto punto…
5. Conclure         : En definitiva, …</pre>
<div class="warn">Piège fréquent : <em>sin embargo</em> et <em>sino</em> ne sont pas synonymes. <strong>Sin embargo</strong> = cependant (opposition entre deux idées). <strong>Sino</strong> = mais (au sens de « au contraire », après une négation) : « No es caro, sino baratísimo » = ce n'est pas cher, mais très bon marché.</div>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur sert à CONCÉDER (bien que) ?", opts: ["sin embargo", "aunque", "por el contrario", "en cambio"], a: 1, exp: "Aunque = bien que / même si : il introduit une concession." },
    { type: "input", q: "Complète : « Es cierto que trabaja mucho, ___ no siempre es eficaz. » (mais)", a: ["pero"], ph: "connecteur", exp: "Es cierto que… pero… : concéder puis nuancer." },
    { type: "qcm", q: "« Aunque llueva, saldré. » Pourquoi le subjonctif (llueva) ?", opts: ["C'est un fait certain et actuel", "C'est une concession hypothétique (même s'il pleut)", "C'est une question", "C'est une habitude"], a: 1, exp: "Subjonctif = concession présentée comme hypothèse : même s'il pleut." },
    { type: "qcm", q: "Quel mot signifie « au contraire » ?", opts: ["en general", "por el contrario", "hasta cierto punto", "además"], a: 1, exp: "Por el contrario = au contraire (opposition forte)." },
    { type: "input", q: "Complète : « No es caro, ___ baratísimo. » (mais, après une négation)", a: ["sino"], ph: "connecteur", exp: "Sino s'emploie après une négation pour rectifier : non pas X, mais Y." },
    { type: "vf", q: "« Sin embargo » et « sino » sont interchangeables.", a: false, exp: "Faux : sin embargo = cependant ; sino = mais (rectification après négation)." },
    { type: "qcm", q: "Quelle expression sert à RELATIVISER ?", opts: ["por supuesto", "hasta cierto punto", "en definitiva", "por un lado"], a: 1, exp: "Hasta cierto punto = jusqu'à un certain point : on relativise." },
    { type: "input", q: "Complète : « Todo ___ de la situación. » (cela dépend)", a: ["depende"], ph: "verbe", exp: "Todo depende de la situación = tout dépend de la situation." },
    { type: "qcm", q: "« Reconozco que es difícil, no obstante… » Que fait le locuteur ?", opts: ["Il change de sujet", "Il concède puis va opposer une objection", "Il approuve totalement", "Il pose une question"], a: 1, exp: "Reconozco que = concession ; no obstante = néanmoins → objection." },
    { type: "input", q: "Complète : « En cierto ___, tienes razón. » (d'une certaine manière)", a: ["modo"], ph: "mot", exp: "En cierto modo = d'une certaine manière (atténuateur)." },
    { type: "vf", q: "« Aunque tienes razón » (indicatif) présente le fait comme réel et admis.", a: true, exp: "Vrai : aunque + indicatif = on reconnaît un fait réel." },
    { type: "qcm", q: "Quel connecteur oppose deux réalités simultanées (tandis que) ?", opts: ["mientras que", "por supuesto", "además", "en general"], a: 0, exp: "Mientras que = tandis que : contraste entre deux situations." },
    { type: "input", q: "Complète la structure d'ouverture : « Desde mi punto de ___, la tecnología nos aísla. » (mot manquant)", a: ["vista"], ph: "mot", exp: "Desde mi punto de vista = de mon point de vue." },
    { type: "qcm", q: "Compréhension : « Si bien la medida es útil, hasta cierto punto resulta injusta. » Quelle est la position ?", opts: ["Approbation totale de la mesure", "Reconnaissance de l'utilité, mais réserve nuancée", "Rejet catégorique", "Indifférence"], a: 1, exp: "Si bien = concession ; hasta cierto punto = nuance → position mesurée." },
    { type: "qcm", q: "Compréhension : « No creo que sea imposible, más bien complicado. » Que veut dire le locuteur ?", opts: ["C'est totalement impossible", "Ce n'est pas impossible, plutôt compliqué", "Il ne sait pas", "C'est très facile"], a: 1, exp: "Más bien = plutôt : il rectifie et nuance (compliqué, pas impossible)." }
  ],
  final: {
    title: "Exercice final — Un debate sobre el teletrabajo",
    intro: `<p>Lis cette intervention nuancée dans un débat sur le télétravail :</p>
<pre class="pseudo">Desde mi punto de vista, el teletrabajo tiene muchas
ventajas. Es cierto que ahorra tiempo de transporte y que
mejora la conciliación familiar; sin embargo, no todo son
beneficios. Aunque muchos empleados sean más productivos en
casa, otros se sienten aislados. En cierto modo, el modelo
ideal sería mixto: unos días en la oficina y otros en casa.
No obstante, todo depende del sector y del tipo de tarea. En
definitiva, más que una solución única, necesitamos
flexibilidad.</pre>`,
    questions: [
      { type: "qcm", q: "Quel avantage du télétravail le locuteur reconnaît-il ?", opts: ["Un meilleur salaire", "Le gain de temps de transport", "Plus de réunions", "Moins de compétences"], a: 1, exp: "Ahorra tiempo de transporte = il économise du temps de trajet." },
      { type: "qcm", q: "« sin embargo, no todo son beneficios » marque :", opts: ["Une concession totale", "Une opposition : tout n'est pas positif", "Une question", "Un accord complet"], a: 1, exp: "Sin embargo = cependant : le locuteur nuance." },
      { type: "input", q: "Quel modèle le locuteur juge-t-il idéal ? (un mot)", a: ["mixto", "el mixto", "un modelo mixto"], ph: "modèle", exp: "El modelo ideal sería mixto : quelques jours au bureau, d'autres à la maison." },
      { type: "qcm", q: "« todo depende del sector » exprime :", opts: ["Une certitude absolue", "Une relativisation : cela dépend", "Un refus", "Une promesse"], a: 1, exp: "Todo depende = tout dépend : le locuteur relativise." },
      { type: "vf", q: "La conclusion du locuteur est qu'il faut de la flexibilité plutôt qu'une solution unique.", a: true, exp: "En definitiva, más que una solución única, necesitamos flexibilidad." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">De mon point de vue, le télétravail a beaucoup d'avantages.
Il est vrai qu'il fait gagner du temps de transport et qu'il
améliore l'équilibre familial ; cependant, tout n'est pas
positif. Bien que beaucoup d'employés soient plus productifs
chez eux, d'autres se sentent isolés. D'une certaine manière,
le modèle idéal serait mixte : quelques jours au bureau et
d'autres à la maison. Néanmoins, tout dépend du secteur et
du type de tâche. En définitive, plus qu'une solution unique,
il nous faut de la flexibilité.</pre>
<p>Repère la mécanique du débat nuancé : thèse (Desde mi punto de vista) → concession (Es cierto que) → opposition (sin embargo, no obstante) → relativisation (en cierto modo, todo depende) → conclusion mesurée (En definitiva). C'est le squelette d'une argumentation B2.</p>`
  }
};
</script>

    solution: "En mi opinión, las redes sociales tienen más inconvenientes que ventajas para los adolescentes. Es cierto que permiten mantener el contacto con los amigos y acceder a mucha información; sin embargo, también generan ansiedad y comparación constante. Aunque cada familia decida sus propias normas, creo que un uso sin límites resulta peligroso. No obstante, no todo es negativo: hasta cierto punto, estas plataformas también educan y conectan. En definitiva, más que prohibirlas, deberíamos enseñar a usarlas con criterio.\n\nTraduction : À mon avis, les réseaux sociaux ont plus d'inconvénients que d'avantages pour les adolescents. Il est vrai qu'ils permettent de garder le contact avec les amis et d'accéder à beaucoup d'informations ; cependant, ils génèrent aussi de l'anxiété et une comparaison permanente. Bien que chaque famille décide de ses propres règles, je pense qu'un usage sans limites est dangereux. Néanmoins, tout n'est pas négatif : jusqu'à un certain point, ces plateformes éduquent aussi et connectent. En définitive, plutôt que de les interdire, nous devrions apprendre à les utiliser avec discernement.",
    note: "Le secret d'un débat crédible : ne jamais nier la part de vérité de l'adversaire. Concéder d'abord (Es cierto que…) désarme l'objection et rend ton opposition (sin embargo…) beaucoup plus convaincante." }
  ]
};
