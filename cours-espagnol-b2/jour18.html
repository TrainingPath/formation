<script>
var DAY = {
  num: 18,
  title: "Comprendre un article de fond",
  subtitle: "Lire un texte d'idées : repérer la thèse, les arguments et le vocabulaire abstrait.",
  theory: `
<h3>1. Qu'est-ce qu'un article de fond ?</h3>
<p>Un <strong>article de fond</strong> (en espagnol, un <em>artículo de fondo</em> ou <em>reportaje en profundidad</em>) ne se contente pas de rapporter des faits : il analyse un phénomène, avance une <strong>thèse</strong> et l'appuie sur des <strong>arguments</strong>, des <strong>données</strong> (datos) et des exemples. Pour le comprendre, il faut lire activement : repérer l'idée principale de chaque paragraphe.</p>
<div class="tip">Méthode de lecture active : (1) lis le titre et le premier paragraphe pour deviner la thèse ; (2) souligne UN mot-clé par paragraphe ; (3) repère les connecteurs (por tanto, sin embargo) qui montrent la logique du raisonnement ; (4) devine le vocabulaire inconnu grâce au contexte avant de traduire.</div>
<h3>2. L'article du jour (lis-le deux fois)</h3>
<p>El siguiente artículo trata de un tema de sociedad. Léelo con calma : las palabras difíciles están explicadas después.</p>
<p><em>La soledad no deseada: un mal silencioso de las ciudades modernas</em></p>
<p>En las grandes ciudades vive más gente que nunca, y sin embargo cada vez más personas se sienten solas. Este fenómeno, que los expertos llaman «soledad no deseada», se ha convertido en un problema de salud pública. Según un estudio reciente, uno de cada cuatro europeos afirma sentirse solo con frecuencia, y las cifras aumentan entre los jóvenes y los mayores de setenta años.</p>
<p>La paradoja es evidente: nunca hemos estado tan conectados y, a la vez, tan aislados. Las redes sociales prometían acercarnos, pero muchos investigadores sostienen que, en realidad, han sustituido las relaciones profundas por contactos superficiales. Un «me gusta» no equivale a una conversación, ni un mensaje a un abrazo.</p>
<p>Las consecuencias van más allá del estado de ánimo. Diversos estudios demuestran que la soledad prolongada perjudica la salud tanto como fumar: aumenta el riesgo de enfermedades cardíacas, debilita el sistema inmunitario y acelera el deterioro cognitivo. Por tanto, no se trata de un simple malestar pasajero, sino de una amenaza real para el bienestar.</p>
<p>Ante esta situación, algunos países han empezado a actuar. El Reino Unido, por ejemplo, creó en 2018 un ministerio dedicado precisamente a combatir la soledad. En España, varios ayuntamientos han puesto en marcha programas para acompañar a los ancianos que viven solos. No obstante, los expertos advierten de que las soluciones no pueden depender únicamente de los gobiernos: la comunidad, los vecinos y las familias también deben implicarse.</p>
<p>En definitiva, la soledad no deseada nos obliga a repensar cómo vivimos juntos. Quizá el verdadero reto de nuestras ciudades no sea construir más edificios, sino reconstruir los lazos humanos que las prisas y las pantallas han ido debilitando.</p>
<h3>3. Lexique d'aide</h3>
<pre class="pseudo">la soledad no deseada     la solitude subie
un mal silencioso         un mal silencieux
la salud pública          la santé publique
las cifras                les chiffres
aislado/a                 isolé(e)
sostener que              soutenir que (affirmer)
equivaler a               équivaloir à
perjudicar                nuire à
el deterioro cognitivo    le déclin cognitif
una amenaza               une menace
el bienestar              le bien-être
poner en marcha           mettre en place
implicarse                s'impliquer
el reto                   le défi
los lazos                 les liens</pre>
<div class="warn">Faux ami : <em>los ancianos</em> = les personnes âgées (pas « les anciens » d'une entreprise). Et <em>advertir de que</em> = avertir / prévenir que, pas « avertir » au sens de remarquer.</div>
<h3>4. La structure de l'argumentation</h3>
<pre class="pseudo">1. Constat + donnée   : 1 de cada 4 europeos se siente solo.
2. Paradoxe           : conectados pero aislados.
3. Conséquences       : perjudica la salud (por tanto…).
4. Réponses possibles : ministerios, programas (no obstante…).
5. Conclusion/thèse   : reconstruir los lazos humanos.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet central de l'article ?", opts: ["Le prix du logement", "La solitude subie dans les villes", "Les transports urbains", "Les réseaux sociaux et la publicité"], a: 1, exp: "Le titre l'annonce : la soledad no deseada, un mal des villes modernes." },
    { type: "input", q: "Selon l'étude citée, combien d'Européens sur quatre se sentent souvent seuls ? (un chiffre)", a: ["uno", "1", "uno de cada cuatro"], ph: "chiffre", exp: "Uno de cada cuatro europeos = un Européen sur quatre." },
    { type: "qcm", q: "Quelle est la « paradoxe » soulignée dans l'article ?", opts: ["On vit plus vieux mais plus mal", "On n'a jamais été aussi connectés et pourtant aussi isolés", "Les villes grandissent mais se vident", "On travaille plus mais on gagne moins"], a: 1, exp: "Nunca hemos estado tan conectados y, a la vez, tan aislados." },
    { type: "vf", q: "Selon l'article, un « me gusta » équivaut à une vraie conversation.", a: false, exp: "Faux : « Un me gusta no equivale a una conversación » : les contacts sont superficiels." },
    { type: "qcm", q: "À quoi l'article compare-t-il les effets de la solitude prolongée sur la santé ?", opts: ["À une mauvaise alimentation", "Au tabac (fumer)", "Au manque de sommeil", "À la sédentarité"], a: 1, exp: "Perjudica la salud tanto como fumar = nuit autant que fumer." },
    { type: "input", q: "Que signifie « perjudicar » ? (un verbe français)", a: ["nuire", "nuire à", "endommager"], ph: "verbe", exp: "Perjudicar = nuire à, porter préjudice." },
    { type: "qcm", q: "Quel pays a créé en 2018 un ministère contre la solitude ?", opts: ["L'Espagne", "La France", "Le Royaume-Uni", "L'Italie"], a: 2, exp: "El Reino Unido creó en 2018 un ministerio dedicado a combatir la soledad." },
    { type: "qcm", q: "Le connecteur « Por tanto » introduit :", opts: ["Une opposition", "Une conséquence", "Un exemple", "Une concession"], a: 1, exp: "Por tanto = par conséquent : il annonce une conclusion logique." },
    { type: "input", q: "Complète le lexique : « poner en ___ » = mettre en place (des programmes).", a: ["marcha"], ph: "mot", exp: "Poner en marcha = mettre en place, lancer." },
    { type: "vf", q: "Selon les experts cités, les solutions doivent dépendre uniquement des gouvernements.", a: false, exp: "Faux : « las soluciones no pueden depender únicamente de los gobiernos » ; la communauté doit s'impliquer." },
    { type: "qcm", q: "Que signifie « los ancianos » ?", opts: ["Les anciens employés", "Les personnes âgées", "Les habitants", "Les experts"], a: 1, exp: "Los ancianos = les personnes âgées." },
    { type: "input", q: "Complète : « No obstante, los expertos ___ de que… » (avertissent / préviennent, ellos)", a: ["advierten"], ph: "verbe", exp: "Advertir de que = avertir que ; ellos advierten." },
    { type: "qcm", q: "Quelle est la thèse finale de l'article ?", opts: ["Il faut construire plus d'immeubles", "Il faut reconstruire les liens humains", "Il faut interdire les réseaux sociaux", "Il faut quitter les villes"], a: 1, exp: "El verdadero reto es reconstruir los lazos humanos." },
    { type: "qcm", q: "Compréhension globale : quel est le TON de l'article ?", opts: ["Humoristique et léger", "Analytique et préoccupé", "Publicitaire", "Purement narratif (une histoire)"], a: 1, exp: "C'est un article de fond : il analyse un problème de société avec inquiétude." },
    { type: "qcm", q: "Compréhension : « ni un mensaje a un abrazo » veut dire :", opts: ["Un message vaut mieux qu'une étreinte", "Un message n'équivaut pas à une étreinte", "Il faut envoyer plus de messages", "Les étreintes sont dépassées"], a: 1, exp: "Prolonge « no equivale » : un message n'équivaut pas à un câlin (contact humain réel)." }
  ],
  final: {
    title: "Exercice final — Synthèse de l'article",
    intro: `<p>Voici un résumé partiel de l'article que tu viens de lire. Réponds aux questions de compréhension globale :</p>
<pre class="pseudo">La soledad no deseada afecta a millones de personas en las
ciudades. Aunque estamos más conectados que nunca, muchos se
sienten aislados. La ciencia demuestra que este aislamiento
daña la salud física y mental. Algunos gobiernos actúan, pero
los expertos insisten en que la sociedad entera debe
implicarse para reconstruir los lazos humanos.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle idée résume le mieux l'article ?", opts: ["Les villes sont trop bruyantes", "La solitude est un problème de santé collectif qui exige une réponse de toute la société", "Les réseaux sociaux devraient être payants", "Les personnes âgées doivent déménager"], a: 1, exp: "L'article traite la solitude comme un enjeu de santé publique et de lien social." },
      { type: "qcm", q: "« daña la salud física y mental » signifie :", opts: ["Améliore la santé", "Nuit à la santé physique et mentale", "N'a aucun effet", "Concerne seulement le mental"], a: 1, exp: "Dañar = abîmer, nuire ; ici à la santé physique ET mentale." },
      { type: "input", q: "Selon le texte, qui doit s'impliquer pour reconstruire les liens ? (un mot du texte)", a: ["la sociedad", "sociedad", "toda la sociedad"], ph: "réponse", exp: "La sociedad entera debe implicarse." },
      { type: "vf", q: "L'article affirme que la connexion numérique a suffi à supprimer la solitude.", a: false, exp: "Faux : malgré la connexion, beaucoup se sentent isolés." },
      { type: "qcm", q: "L'objectif final évoqué est de :", opts: ["Construire plus d'édifices", "Reconstruire les liens humains", "Fermer les réseaux sociaux", "Augmenter les impôts"], a: 1, exp: "Reconstruir los lazos humanos = reconstruire les liens humains." }
    ],
    solution: `<p>Idées clés à retenir pour synthétiser un article de fond :</p>
<pre class="pseudo">THÈSE      : la solitude subie est un mal des villes modernes.
DONNÉE     : 1 Européen sur 4 se sent souvent seul.
PARADOXE   : plus connectés, pourtant plus isolés.
PREUVE     : nuit à la santé autant que le tabac.
RÉPONSES   : ministères, programmes municipaux.
LIMITE     : les gouvernements ne suffisent pas.
CONCLUSION : reconstruire les liens humains.</pre>
<p>Un bon lecteur B2 ne retient pas chaque phrase, mais la <strong>colonne vertébrale</strong> de l'argumentation : une thèse, des preuves, des nuances (sin embargo, no obstante), une conclusion.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b2-j18", title: "Résume l'article", level: 3,
    statement: "Rédige en 5 ou 6 phrases un résumé personnel de l'article sur la solitude, en espagnol. Reprends la thèse, une donnée, une conséquence et la conclusion, avec tes propres mots (n'copie pas des phrases entières).",
    hints: [
      "Commence par la thèse : El artículo trata de… / El texto afirma que…",
      "Cite la donnée : uno de cada cuatro europeos…",
      "Ajoute une conséquence (perjudica la salud) et la conclusion (reconstruir los lazos)."
    ],
    solution: "El artículo trata de la soledad no deseada en las ciudades modernas. Explica una paradoja: aunque estamos más conectados que nunca, cada vez más personas se sienten aisladas; de hecho, uno de cada cuatro europeos afirma sentirse solo con frecuencia. El texto advierte de que esta soledad prolongada perjudica la salud tanto como fumar. Algunos gobiernos ya han puesto en marcha programas, pero los expertos insisten en que toda la sociedad debe implicarse. En definitiva, el autor concluye que el verdadero reto de nuestras ciudades es reconstruir los lazos humanos.\n\nTraduction : L'article traite de la solitude subie dans les villes modernes. Il explique un paradoxe : bien que nous soyons plus connectés que jamais, de plus en plus de personnes se sentent isolées ; de fait, un Européen sur quatre affirme se sentir souvent seul. Le texte prévient que cette solitude prolongée nuit à la santé autant que fumer. Certains gouvernements ont déjà mis en place des programmes, mais les experts insistent sur le fait que toute la société doit s'impliquer. En définitive, l'auteur conclut que le véritable défi de nos villes est de reconstruire les liens humains.",
    note: "Résumer, c'est reformuler avec ses propres mots l'essentiel : thèse + preuves + conclusion. Évite de recopier des phrases entières ; utilise des verbes de reformulation (el texto explica / advierte / concluye)." }
  ]
};
</script>
