<script>
var DAY = {
  num: 16,
  title: "Parler de son parcours professionnel",
  subtitle: "Raconter ses études, ses expériences et ses compétences avec les bons temps et le bon lexique.",
  theory: `
<h3>1. De quoi parle-t-on ?</h3>
<p>Parler de son <strong>parcours professionnel</strong> (en espagnol, la <em>trayectoria profesional</em>) revient à raconter une histoire : les études, les premiers emplois, les évolutions, les compétences acquises. Au niveau B2, on attend de toi que tu enchaînes ces étapes clairement, en variant les temps du passé et en employant un vocabulaire précis.</p>
<h3>2. Le lexique de base du parcours</h3>
<pre class="pseudo">Español                     Français
la formación                la formation
la carrera / los estudios   le cursus / les études
la licenciatura             la licence (diplôme)
el máster                   le master
las prácticas               le stage
el/la becario/a             le/la stagiaire
la empresa                  l'entreprise
el puesto (de trabajo)      le poste
el ascenso                  la promotion
el/la jefe/a                le/la chef(fe)
el sueldo / el salario      le salaire
las competencias            les compétences
la experiencia laboral      l'expérience professionnelle
el sector                   le secteur</pre>
<h3>3. Les verbes qui structurent le récit</h3>
<p>On raconte le passé avec le <strong>pretérito indefinido</strong> (actions terminées : étapes précises) et le <strong>pretérito imperfecto</strong> (contexte, habitudes). Pour le présent de la situation actuelle, on emploie le <strong>presente</strong>, et pour les projets, le <strong>futuro</strong> ou <em>ir a + infinitivo</em>.</p>
<pre class="pseudo">Estudié Derecho en la Universidad de Sevilla.   = J'ai étudié le Droit à l'université de Séville.
Cuando era estudiante, trabajaba de camarero.   = Quand j'étais étudiant, je travaillais comme serveur.
He trabajado en tres empresas distintas.        = J'ai travaillé dans trois entreprises différentes.
Actualmente soy responsable de ventas.          = Actuellement je suis responsable des ventes.
El año que viene voy a cambiar de sector.        = L'an prochain je vais changer de secteur.</pre>
<div class="tip">Astuce B2 : varie les verbes de progression. Au lieu de répéter <em>trabajar</em>, utilise <strong>desempeñar un puesto</strong> (occuper un poste), <strong>encargarse de</strong> (être chargé de), <strong>especializarse en</strong> (se spécialiser en), <strong>ascender a</strong> (être promu à).</p></div>
<h3>4. Les connecteurs chronologiques</h3>
<pre class="pseudo">al principio          au début
más tarde / luego     plus tard / ensuite
tras + inf./sust.     après (avoir)...
posteriormente        par la suite
durante X años        pendant X ans
desde entonces        depuis lors
hoy en día            de nos jours / aujourd'hui</pre>
<h3>5. Parler de ses compétences</h3>
<p>Pour décrire ce que l'on sait faire, on emploie <em>saber + infinitivo</em>, <em>ser capaz de</em>, ou des adjectifs de qualités : <strong>resolutivo/a</strong> (efficace, qui résout), <strong>polivalente</strong> (polyvalent), <strong>organizado/a</strong>, <strong>trabajador/a</strong> (travailleur).</p>
<div class="warn">Attention au faux ami : <em>una carrera</em> ne signifie pas seulement une « carrière », mais surtout <strong>un cursus universitaire / une filière</strong> (Estudié la carrera de Medicina = J'ai fait des études de médecine). Pour « carrière » au sens de parcours, on dit <strong>trayectoria</strong> ou <strong>vida profesional</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le stage » en espagnol ?", opts: ["el sueldo", "las prácticas", "el ascenso", "la carrera"], a: 1, exp: "Las prácticas = le stage ; un stagiaire est un becario." },
    { type: "input", q: "Complète : « Estudié Derecho ___ la Universidad de Sevilla. » (préposition de lieu)", a: ["en"], ph: "préposition", exp: "Estudiar en un lugar : estudié en la universidad." },
    { type: "qcm", q: "« Cuando era estudiante, trabajaba de camarero. » Pourquoi l'imperfecto ?", opts: ["Action unique et terminée", "Contexte et habitude passés", "Projet futur", "Présent actuel"], a: 1, exp: "Era + trabajaba décrivent une situation habituelle → imperfecto." },
    { type: "input", q: "Conjugue TRABAJAR au pretérito indefinido, yo : ___ (je travaillai).", a: ["trabajé"], ph: "verbe", exp: "Yo trabajé." },
    { type: "qcm", q: "Quel mot signifie « la promotion » (montée en grade) ?", opts: ["el sueldo", "el ascenso", "el puesto", "el sector"], a: 1, exp: "El ascenso = la promotion ; ascender = être promu." },
    { type: "vf", q: "En espagnol, « una carrera » désigne d'abord un cursus universitaire.", a: true, exp: "La carrera de Medicina = les études de médecine. Pour « carrière », on dit trayectoria." },
    { type: "input", q: "Complète avec un verbe : « ___ de ventas » signifie « je suis chargé des ventes ». (verbe pronominal, yo)", a: ["me encargo"], ph: "yo…", exp: "Encargarse de = être chargé de ; yo me encargo de las ventas." },
    { type: "qcm", q: "« El año que viene voy a cambiar de sector. » Ce temps exprime :", opts: ["Une habitude passée", "Un projet futur", "Une action terminée", "Une description"], a: 1, exp: "Ir a + infinitivo exprime un projet, un futur proche." },
    { type: "qcm", q: "Quel connecteur veut dire « par la suite » ?", opts: ["al principio", "posteriormente", "hoy en día", "durante"], a: 1, exp: "Posteriormente = par la suite ; al principio = au début." },
    { type: "input", q: "Complète : « He trabajado en tres empresas ___. » (adjectif : différentes)", a: ["distintas", "diferentes"], ph: "adjectif", exp: "Empresas distintas / diferentes = entreprises différentes (accord au féminin pluriel)." },
    { type: "vf", q: "« Desempeñar un puesto » signifie « occuper un poste ».", a: true, exp: "Desempeñar un puesto / cargo = exercer, occuper un poste." },
    { type: "qcm", q: "Un profil « polivalente » est une personne :", opts: ["Peu fiable", "Capable de faire des tâches variées", "Toujours en retard", "Débutante"], a: 1, exp: "Polivalente = polyvalent, qui sait tout faire." },
    { type: "input", q: "Complète : « ___ entonces, trabajo en el mismo sector. » (depuis lors)", a: ["Desde"], ph: "connecteur", exp: "Desde entonces = depuis lors." },
    { type: "qcm", q: "Compréhension : « Tras terminar el máster, me especialicé en marketing digital. » Que s'est-il passé APRÈS le master ?", opts: ["Il a commencé le master", "Il s'est spécialisé en marketing digital", "Il a quitté le secteur", "Il est parti en stage"], a: 1, exp: "Tras terminar = après avoir terminé ; puis especialicé = spécialisation." },
    { type: "qcm", q: "Compréhension : « Actualmente soy responsable de un equipo de diez personas. » Cette phrase parle :", opts: ["Du passé lointain", "De la situation professionnelle actuelle", "D'un projet abandonné", "D'un stage terminé"], a: 1, exp: "Actualmente + presente = la situation d'aujourd'hui." }
  ],
  final: {
    title: "Exercice final — La trayectoria de Marisa",
    intro: `<p>Lis ce court parcours professionnel :</p>
<pre class="pseudo">Me llamo Marisa y soy ingeniera. Estudié la carrera de
Ingeniería Industrial en Valencia y, tras licenciarme, hice
unas prácticas en una fábrica de coches. Al principio era
becaria, pero un año después me contrataron como técnica.
Durante cinco años me encargué del control de calidad.
En 2022 ascendí a jefa de producción. Hoy en día dirijo un
equipo de veinte personas y el año que viene voy a abrir una
nueva planta en Portugal.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle filière Marisa a-t-elle étudiée ?", opts: ["Le Droit", "L'Ingénierie industrielle", "La Médecine", "Le Marketing"], a: 1, exp: "Estudié la carrera de Ingeniería Industrial." },
      { type: "qcm", q: "Quel poste occupait-elle au tout début ?", opts: ["Cheffe de production", "Stagiaire (becaria)", "Directrice", "Technicienne"], a: 1, exp: "Al principio era becaria = au début elle était stagiaire." },
      { type: "input", q: "Pendant combien d'années s'est-elle occupée du contrôle qualité ? (un chiffre)", a: ["cinco", "5", "cinco años"], ph: "durée", exp: "Durante cinco años me encargué del control de calidad." },
      { type: "qcm", q: "Que fait-elle « hoy en día » (aujourd'hui) ?", opts: ["Elle est stagiaire", "Elle dirige une équipe de vingt personnes", "Elle étudie encore", "Elle cherche du travail"], a: 1, exp: "Hoy en día dirijo un equipo de veinte personas." },
      { type: "vf", q: "Marisa a un projet pour l'an prochain : ouvrir une usine au Portugal.", a: true, exp: "El año que viene voy a abrir una nueva planta en Portugal." }
    ],
    solution: `<p>Traduction du parcours :</p>
<pre class="pseudo">Je m'appelle Marisa et je suis ingénieure. J'ai étudié
l'Ingénierie industrielle à Valence et, après avoir obtenu
mon diplôme, j'ai fait un stage dans une usine automobile.
Au début j'étais stagiaire, mais un an plus tard on m'a
embauchée comme technicienne. Pendant cinq ans je me suis
occupée du contrôle qualité. En 2022 j'ai été promue cheffe
de production. Aujourd'hui je dirige une équipe de vingt
personnes et l'an prochain je vais ouvrir une nouvelle usine
au Portugal.</pre>
<p>Observe l'alternance des temps : <strong>indefinido</strong> pour les étapes (estudié, hice, ascendí), <strong>imperfecto</strong> pour le contexte (era becaria), <strong>presente</strong> pour la situation actuelle (dirijo) et <strong>ir a + infinitivo</strong> pour le projet (voy a abrir).</p>`
  }
};
</script>
