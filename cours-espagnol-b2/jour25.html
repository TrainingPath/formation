  theory: `
<h3>1. Négocier, un art du dialogue</h3>
<p><strong>Négocier</strong> (negociar), c'est chercher un accord quand deux parties ont des intérêts différents : un prix, un délai, une condition de travail. <strong>Convaincre</strong> (convencer), c'est amener l'autre à changer d'avis grâce à des arguments. Ces deux compétences supposent un langage poli, ferme et stratégique.</p>
<h3>2. Faire une proposition</h3>
<pre class="pseudo">Le propongo que… (+ subj.)   Je vous propose de…
¿Qué le parece si…?          Que diriez-vous de… ?
¿Y si + indic./imperf.?      Et si… ?
Podríamos + inf.             Nous pourrions…
Una posibilidad sería…       Une possibilité serait…</pre>
<h3>3. Convaincre : argumenter avec force</h3>
<pre class="pseudo">Le aseguro que…              Je vous assure que…
Piense que…                  Songez que…
Le conviene porque…          Cela vous arrange parce que…
No solo…, sino que además…   Non seulement…, mais en plus…
La ventaja es que…           L'avantage, c'est que…
Si lo hace, conseguirá…      Si vous le faites, vous obtiendrez…</pre>
<div class="tip">Technique de persuasion : montre le BÉNÉFICE pour l'autre, pas seulement pour toi. « Le conviene porque ahorrará tiempo » (cela vous arrange car vous gagnerez du temps) est bien plus efficace que « yo quiero… » (moi je veux…).</div>
<h3>4. Contre-proposer et poser des conditions</h3>
<pre class="pseudo">Estoy de acuerdo, pero…      Je suis d'accord, mais…
Lo acepto siempre que… (+subj) J'accepte à condition que…
Podríamos llegar a un        Nous pourrions trouver un
 acuerdo si…                   accord si…
En ese caso, yo necesitaría… Dans ce cas, j'aurais besoin de…
¿Y si nos encontramos a      Et si on se retrouvait à
 medio camino?                 mi-chemin (un compromis) ?</pre>
<h3>5. Conclure : accord ou désaccord</h3>
<pre class="pseudo">Trato hecho.                 Marché conclu.
Me parece justo.             Cela me paraît juste.
De acuerdo, cerramos el trato. D'accord, on conclut l'affaire.
Lo siento, pero no me        Désolé, mais ça ne me
 convence.                     convainc pas.
Necesito pensarlo.           J'ai besoin d'y réfléchir.</pre>
<div class="warn">Registre : la négociation est souvent formelle → vouvoiement (<em>usted</em>) et conditionnel de politesse (<em>podríamos, necesitaría, sería</em>). Le conditionnel adoucit la demande et rend la négociation plus courtoise et efficace.</div>`,

    { type: "input", q: "Complète : « Le propongo que ___ el precio. » (baisser, usted : subjonctif présent de bajar)", a: ["baje"], ph: "verbe", exp: "Proponer que + subjonctif : le propongo que baje el precio." },

    { type: "input", q: "Complète la formule polie : « ___ llegar a un acuerdo si baja el precio. » (pouvoir, nosotros : conditionnel de poder)", a: ["Podríamos"], ph: "verbe", exp: "Podríamos llegar a un acuerdo = nous pourrions trouver un accord." },

      { type: "qcm", q: "À quelle CONDITION le recruteur accepte-t-il ?", opts: ["Qu'elle commence demain", "Qu'elle réussisse la période d'essai", "Qu'elle déménage", "Qu'elle renonce aux congés"], a: 1, exp: "Siempre que supere el periodo de prueba = à condition qu'elle passe la période d'essai." },
      { type: "vf", q: "La négociation se termine par un accord (Trato hecho).", a: true, exp: "Trato hecho = marché conclu : ils tombent d'accord à 30.000." }
    ],
    solution: `<p>Anatomie de cette négociation réussie :</p>
<pre class="pseudo">1. Offre initiale     : 28.000 (le recruteur).
2. Contre-proposition : remercier + demander 32.000 (poli mais ferme).
3. Blocage            : « es nuestro máximo ».
4. Compromis          : 30.000 + révision à 6 mois (a medio camino).
5. Condition          : « siempre que supere el periodo de prueba ».
6. Accord             : « Trato hecho ».</pre>
<p>Les clés : remercier avant de contester, justifier sa demande (« teniendo en cuenta mi experiencia »), proposer un compromis chiffré, et conclure clairement. Chacun cède un peu : c'est une négociation gagnant-gagnant.</p>`
  }
