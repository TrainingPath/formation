<script>
var DAY = {
  num: 2,
  title: "Le subjonctif imparfait",
  subtitle: "Former et employer le subjuntivo imperfecto : la clé du passé au subjonctif et des hypothèses.",
  theory: `
<h3>1. À quoi sert-il ?</h3>
<p>Le <strong>subjuntivo imperfecto</strong> (imparfait du subjonctif) est le subjonctif du passé. On l'emploie quand le verbe principal est au passé (ou au conditionnel) et impose le subjonctif : volonté, émotion, doute, but, hypothèse. C'est aussi le temps des phrases hypothétiques irréelles (<em>si tuviera dinero…</em>).</p>
<pre class="pseudo">Quiero que vengas.      → Quería que vinieras.
(Je veux que tu viennes)  (Je voulais que tu viennes)</pre>
<h3>2. La formation : partir de la 3e personne du pluriel de l'indefinido</h3>
<p>La règle est mécanique et vaut pour <strong>tous</strong> les verbes, réguliers comme irréguliers. On prend la 3e personne du pluriel du pretérito indefinido, on retire la terminaison <strong>-ron</strong>, et on ajoute les terminaisons du subjonctif imparfait.</p>
<pre class="pseudo">Verbe   3e pl. indefinido   radical    subjuntivo imperfecto (yo)
hablar  hablaron            habla-     hablara / hablase
comer   comieron            comie-     comiera / comiese
vivir   vivieron            vivie-     viviera / viviese
tener   tuvieron            tuvie-     tuviera / tuviese
ser/ir  fueron              fue-       fuera / fuese
hacer   hicieron            hicie-     hiciera / hiciese
poder   pudieron            pudie-     pudiera / pudiese</pre>
<div class="tip">Deux séries de terminaisons coexistent et sont interchangeables : la forme en <strong>-ra</strong> (hablara, hablaras, hablara, habláramos, hablarais, hablaran) et la forme en <strong>-se</strong> (hablase, hablases…). La forme en -ra est la plus fréquente à l'oral ; la forme en -se sonne plus littéraire.</div>
<h3>3. Les terminaisons complètes</h3>
<pre class="pseudo">-AR / -ER / -IR (mêmes terminaisons pour tous)
FORME -RA              FORME -SE
yo      hablara        hablase
tú      hablaras       hablases
él      hablara        hablase
nos.    habláramos     hablásemos     (accent sur l'antépénultième)
vos.    hablarais      hablaseis
ellos   hablaran       hablasen</pre>
<div class="warn">N'oublie pas l'accent écrit à la 1re personne du pluriel : <em>habláramos, comiéramos, tuviéramos</em>. Sans lui, l'accentuation orale tombe au mauvais endroit.</div>
<h3>4. Emplois principaux</h3>
<pre class="pseudo">Volonté/ordre passé : Me pidió que la ayudara.   (Il me demanda de l'aider.)
Émotion passée :      Me alegró que vinieras.     (Cela me réjouit que tu viennes.)
Doute passé :         No creía que fuera verdad.  (Je ne croyais pas que ce fût vrai.)
But passé :           Lo hizo para que aprendiéramos. (Il le fit pour que nous apprenions.)
Hypothèse irréelle :  Si tuviera tiempo, viajaría. (Si j'avais le temps, je voyagerais.)
Politesse (querer):   Quisiera pedirle un favor.   (Je voudrais vous demander un service.)</pre>
<div class="tip">Emploi élégant : <em>quisiera, pudiera, debiera</em> servent à formuler une demande très polie, plus courtoise encore que le conditionnel : <em>Quisiera reservar una mesa</em> (Je voudrais réserver une table).</div>`,
  exercises: [
    { type: "qcm", q: "Sur quelle forme verbale construit-on le subjonctif imparfait ?", opts: ["L'infinitif", "La 1re pers. du présent", "La 3e pers. du pluriel de l'indefinido", "Le participe passé"], a: 2, exp: "On retire -ron à la 3e personne du pluriel de l'indefinido puis on ajoute les terminaisons." },
    { type: "input", q: "Forme le subjonctif imparfait (yo, forme -ra) de HABLAR : ___", a: ["hablara"], ph: "verbe", exp: "hablaron → habla- → hablara." },
    { type: "input", q: "Subjonctif imparfait de TENER (yo, forme -ra) : ___", a: ["tuviera"], ph: "verbe", exp: "tuvieron → tuvie- → tuviera." },
    { type: "qcm", q: "Quelle est la forme -se correspondant à « comiera » ?", opts: ["comese", "comiese", "comiara", "comiría"], a: 1, exp: "Forme -se : comiese, interchangeable avec comiera." },
    { type: "input", q: "Subjonctif imparfait de SER/IR (yo) : ___", a: ["fuera", "fuese"], ph: "verbe", exp: "fueron → fue- → fuera / fuese." },
    { type: "vf", q: "Les formes « hablara » et « hablase » sont interchangeables.", a: true, exp: "Vrai : mêmes valeurs ; -se est plus littéraire, -ra plus courante." },
    { type: "input", q: "Complète : « Me pidió que le ___ (ayudar, tú, forme -ra) con la mudanza. »", a: ["ayudaras"], ph: "verbe", exp: "Verbe principal au passé (pidió) → subjonctif imparfait : ayudaras." },
    { type: "qcm", q: "« Si tuviera dinero, viajaría más. » Que exprime cette phrase ?", opts: ["Une certitude", "Une hypothèse irréelle sur le présent", "Une action passée réelle", "Un ordre"], a: 1, exp: "Hypothèse irréelle : subjonctif imparfait + conditionnel." },
    { type: "input", q: "Écris la 1re personne du pluriel de HACER au subjonctif imparfait (forme -ra), avec l'accent : ___", a: ["hiciéramos"], ph: "verbe", exp: "hicieron → hicie- → hiciéramos (accent obligatoire)." },
    { type: "qcm", q: "« Quisiera pedirle un favor. » Quel est le ton de « quisiera » ?", opts: ["Un ordre sec", "Une demande très polie", "Un reproche", "Une hypothèse impossible"], a: 1, exp: "Quisiera exprime une politesse raffinée : « je voudrais »." },
    { type: "vf", q: "À la 1re personne du pluriel, le subjonctif imparfait porte un accent écrit (habláramos).", a: true, exp: "Vrai : habláramos, tuviéramos, fuéramos." },
    { type: "input", q: "Complète : « No creía que eso ___ (ser) verdad. » (forme -ra)", a: ["fuera"], ph: "verbe", exp: "Doute au passé → subjonctif imparfait : fuera." },
    { type: "qcm", q: "Compréhension : « Lo hizo para que aprendiéramos. » Que exprime « para que » ici ?", opts: ["Une cause", "Un but au passé", "Une condition", "Une comparaison"], a: 1, exp: "Para que + subjonctif imparfait = but dans un contexte passé." },
    { type: "qcm", q: "Compréhension : « Ojalá pudiera ir contigo. » Quelle nuance ?", opts: ["Un souhait réalisable et sûr", "Un souhait difficile ou irréel dans le présent", "Un ordre", "Un fait passé"], a: 1, exp: "Ojalá + subjonctif imparfait exprime un souhait perçu comme peu probable." },
    { type: "vf", q: "« Me alegró que vinieras » est correct car le verbe principal est au passé.", a: true, exp: "Vrai : alegró (passé) impose le subjonctif imparfait vinieras." }
  ],
  final: {
    title: "Exercice final — Consejos de un antiguo profesor",
    intro: `<p>Un profesor jubilado recuerda lo que pedía a sus alumnos. Fíjate en el uso del subjuntivo imperfecto :</p>
<pre class="pseudo">Cuando yo daba clase, siempre les pedía a mis alumnos que leyeran cada día.
No exigía que fueran genios, solo que trabajaran con constancia.
Me habría gustado que todos comprendieran el valor del esfuerzo.
A veces soñaba con que la escuela dispusiera de más recursos.
Si yo tuviera hoy su edad, estudiaría idiomas sin dudarlo.
Ojalá pudiera volver a empezar con lo que sé ahora.
Les repetía que, aunque el camino fuera difícil, valdría la pena.
Quisiera que estas palabras les sirvieran a los jóvenes de hoy.</pre>`,
    questions: [
      { type: "input", q: "« les pedía que ___ cada día » : subjonctif imparfait de LEER (ellos, forme -ra)", a: ["leyeran"], ph: "verbe", exp: "leyeron → leye- → leyeran." },
      { type: "qcm", q: "« Si yo tuviera hoy su edad, estudiaría… » ¿Qué tipo de frase es?", opts: ["Una condición real", "Una hipótesis irreal sobre el presente", "Una orden", "Un pasado real"], a: 1, exp: "Si + subjuntivo imperfecto + condicional = hipótesis irreal." },
      { type: "input", q: "« Ojalá ___ volver a empezar » : subjonctif imparfait de PODER (yo)", a: ["pudiera", "pudiese"], ph: "verbe", exp: "pudieron → pudie- → pudiera/pudiese." },
      { type: "vf", q: "« aunque el camino fuera difícil » usa el subjuntivo imperfecto para expresar una concesión hipotética.", a: true, exp: "Verdadero : aunque + subjuntivo imperfecto plantea una concesión no verificada." },
      { type: "qcm", q: "« Quisiera que estas palabras les sirvieran… » ¿Qué aporta « quisiera »?", opts: ["Una orden autoritaria", "Un deseo formulado con cortesía", "Un reproche", "Una certeza"], a: 1, exp: "Quisiera suaviza el deseo y lo hace cortés." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Quand j'enseignais, je demandais toujours à mes élèves de lire chaque jour.
Je n'exigeais pas qu'ils soient des génies, seulement qu'ils travaillent avec constance.
J'aurais aimé qu'ils comprennent tous la valeur de l'effort.
Parfois je rêvais que l'école dispose de plus de moyens.
Si j'avais aujourd'hui leur âge, j'étudierais les langues sans hésiter.
Si seulement je pouvais tout recommencer avec ce que je sais maintenant.
Je leur répétais que, même si le chemin était difficile, cela vaudrait la peine.
Je voudrais que ces mots servent aux jeunes d'aujourd'hui.</pre>
<p>Remarque comment le verbe principal au passé ou au conditionnel (pedía, exigía, me habría gustado, quisiera) déclenche systématiquement le subjonctif imparfait dans la subordonnée (leyeran, fueran, comprendieran, sirvieran). Les hypothèses irréelles (si tuviera… estudiaría) suivent le même schéma.</p>`
  }
};
</script>

    hints: [

      "Forme le subjonctif à partir de la 3e pers. pluriel de l'indefinido : estudiaron → estudiara.",
      "Ajoute une hypothèse irréelle : Si pudiera, …"
    ],
    solution: "Mis padres querían que yo estudiara una carrera segura, pero yo esperaba que ellos entendieran mi pasión por el arte. Mi profesor me pedía que practicara todos los días, aunque a veces me pareciera imposible. A mí me alegraba que mis amigos me apoyaran en aquellos momentos. No creía que aquel sueño fuera realista, y sin embargo insistí. Ojalá hubiera tenido entonces la confianza que tengo hoy. Si pudiera hablar con aquel joven que fui, le diría que no tuviera miedo. Al final, todos deseábamos que las cosas salieran bien, y así fue.\n\nTraduction : Mes parents voulaient que j'étudie une filière sûre, mais moi j'espérais qu'ils comprennent ma passion pour l'art. Mon professeur me demandait de m'entraîner tous les jours, même si parfois cela me paraissait impossible. Cela me réjouissait que mes amis me soutiennent dans ces moments-là. Je ne croyais pas que ce rêve fût réaliste, et pourtant j'insistai. Si seulement j'avais eu alors la confiance que j'ai aujourd'hui. Si je pouvais parler à ce jeune que j'étais, je lui dirais de ne pas avoir peur. Finalement, nous souhaitions tous que les choses se passent bien, et ce fut le cas.",

  ]
};
