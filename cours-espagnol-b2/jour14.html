  title: "Rédiger une lettre de motivation",
  subtitle: "Structurer et rédiger une carta de motivación efficace et dans le bon registre.",
  theory: `
<h3>1. Qu'est-ce qu'une carta de motivación ?</h3>
<p>La <strong>carta de motivación</strong> (ou <em>carta de presentación</em>) accompagne le CV pour postuler à un emploi, un stage ou une formation. Elle répond à une question simple : <em>pourquoi vous, pour ce poste précis ?</em> Elle doit être <strong>concise</strong> (une page), <strong>formelle</strong> (usted) et parfaitement <strong>adaptée</strong> à l'offre.</p>
<div class="warn">Une lettre générique envoyée partout se repère immédiatement. Personnalise toujours : nomme l'entreprise, le poste, et relie tes compétences aux besoins exprimés dans l'annonce.</div>
<h3>2. La structure type</h3>
<pre class="pseudo">1. Encabezado    tes coordonnées, la date, le destinataire
2. Saludo        Estimado/a Sr./Sra. [apellido] : (deux points, pas virgule)
3. Introducción  quel poste, comment tu l'as connu
4. Cuerpo 1      ton parcours et tes compétences clés
5. Cuerpo 2      pourquoi CETTE entreprise, ta valeur ajoutée
6. Cierre        disponibilité, appel à un entretien
7. Despedida     formule de politesse + signature</pre>
<div class="tip">En espagnol, après la formule d'appel (Estimado señor García), on met traditionnellement <strong>deux points</strong> (:) et non une virgule, puis on passe à la ligne. C'est une différence notable avec le français et l'anglais.</div>
<h3>3. Formules d'ouverture et de présentation</h3>
<pre class="pseudo">Estimado/a Sr./Sra. [apellido]:
Estimados señores:                    (si le destinataire est inconnu)
Me dirijo a usted en respuesta a la oferta de... publicada en...
Me complace presentar mi candidatura al puesto de...
Con gran interés he leído su anuncio para el puesto de...
Tras conocer la vacante de..., le escribo para expresar mi interés.</pre>
<h3>4. Le corps : valoriser son profil</h3>
<p>On y présente son parcours de façon <strong>ciblée</strong> (pas une redite du CV) et on montre l'adéquation avec le poste. Emploie des verbes d'action et un vocabulaire professionnel.</p>
<pre class="pseudo">Vocabulaire utile :
- Cuento con [X] años de experiencia en...   (Je dispose de X ans d'expérience...)
- Poseo sólidos conocimientos de...
- Me considero una persona [responsable, proactiva, resolutiva].
- He desarrollado competencias en...
- Domino [idiomas, herramientas]...
- Estoy convencido/a de que mi perfil se ajusta a sus necesidades.
- Me atrae especialmente su empresa por...</pre>
<div class="tip">Adjectifs valorisants fréquents : <em>responsable, comprometido, proactivo, resolutivo, dinámico, meticuloso, adaptable, orientado a resultados</em>. Illustre-les toujours par un fait concret plutôt que de les empiler.</div>
<h3>5. Clôture et formules de politesse</h3>
<pre class="pseudo">Appel à l'action :
- Quedo a su disposición para una entrevista personal.
- Estaré encantado/a de ampliar esta información en una entrevista.
- Agradezco de antemano el tiempo dedicado a mi candidatura.
Despedidas formelles :
- Atentamente,
- Reciba un cordial saludo,
- Le saluda atentamente,
[Firma / Nombre y apellidos]</pre>
<pre class="pseudo">MODÈLE COMPLET DE CARTA DE MOTIVACIÓN :
                                             Laura Fernández Gómez
                                             laura.fernandez@correo.es
                                             Madrid, 12 de marzo de 2026

Estimada Sra. Ruiz:

Me dirijo a usted en respuesta a la oferta de gestor de proyectos
publicada en su página web. Me complace presentar mi candidatura,
pues considero que mi perfil se ajusta a lo que su empresa busca.

Cuento con cinco años de experiencia en la coordinación de equipos
en el sector tecnológico. Durante este tiempo he desarrollado
sólidas competencias en planificación y liderazgo, y he llevado a cabo
proyectos que mejoraron la productividad de mi departamento en un 20%.

Me atrae especialmente su empresa por su compromiso con la innovación
y la sostenibilidad, valores con los que me identifico plenamente.
Estoy convencida de que podría aportar dinamismo y rigor a su equipo.

Quedo a su disposición para una entrevista personal en la que poder
ampliar esta información. Agradezco de antemano su atención.

Atentamente,
Laura Fernández Gómez</pre>`,
  exercises: [

    { type: "input", q: "Complète : « Estoy convencida de que mi perfil se ___ a sus necesidades. » (verbe ajustarse, 3e pers.)", a: ["ajusta"], ph: "verbe", exp: "Mi perfil se ajusta a sus necesidades = mon profil correspond à vos besoins." },
    { type: "qcm", q: "Compréhension : « Me atrae especialmente su empresa por su compromiso con la innovación. » Que montre cette phrase ?", opts: ["Le candidat parle de son salaire", "Le candidat explique pourquoi il vise CETTE entreprise", "Le candidat critique l'entreprise", "Le candidat décrit ses loisirs"], a: 1, exp: "Elle justifie l'intérêt spécifique pour l'entreprise (valeur ajoutée du candidat)." },
    { type: "qcm", q: "Compréhension : « Agradezco de antemano el tiempo dedicado a mi candidatura. » Quel est le ton ?", opts: ["Exigeant", "Courtois et formel", "Familier", "Ironique"], a: 1, exp: "Formule de remerciement courtoise typique de la clôture formelle." },
    { type: "vf", q: "« Estimados señores: » est une formule d'appel appropriée quand on ignore le nom du destinataire.", a: true, exp: "Vrai : Estimados señores s'emploie quand le destinataire précis est inconnu." }

    intro: `<p>Lee esta carta de motivación y analiza su estructura :</p>
<pre class="pseudo">Estimado Sr. Molina:

Marta Sánchez Ríos</pre>`,
    questions: [

      { type: "input", q: "¿Qué verbo indica la experiencia? « ___ con tres años de experiencia. » (contar, yo)", a: ["cuento"], ph: "verbe", exp: "Cuento con tres años de experiencia = je dispose de trois ans d'expérience." },

    solution: `<p>Traduction de la lettre :</p>
<pre class="pseudo">Cher Monsieur Molina,

C'est avec grand intérêt que j'ai lu votre annonce pour le poste de traducteur
publiée sur LinkedIn. J'ai le plaisir de présenter ma candidature, car
ma formation et mon expérience correspondent au profil recherché.

Je suis titulaire d'une licence en Traduction et Interprétation et je dispose de trois ans
d'expérience dans la traduction de textes techniques de l'espagnol vers le français.
Je maîtrise les deux langues à un niveau professionnel et je me considère comme une personne
méticuleuse et soucieuse de la qualité.

Votre agence m'attire particulièrement par son prestige international et
par son orientation vers la traduction spécialisée. Je suis convaincue
de pouvoir contribuer avec rigueur et dévouement à vos projets.

Je reste à votre disposition pour un entretien au cours duquel je pourrai développer

Marta Sánchez Ríos</pre>
<p>Retiens la structure : appel formel (Estimado Sr. + deux points), introduction (poste et source de l'offre), corps (profil ciblé + intérêt pour l'entreprise), clôture (disponibilité + remerciement) et despedida (Atentamente). Concision, personnalisation et registre formel sont les trois clés.</p>`
