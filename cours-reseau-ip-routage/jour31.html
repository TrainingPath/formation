<script>
var DAY = {
  num: 31,
  title: "Projet final : plan d'adressage d'une PME",
  subtitle: "Synthèse : découper un réseau en sous-réseaux propres et cohérents.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Une PME dispose du réseau privé <strong>192.168.10.0/24</strong> (soit 256 adresses, de .0 à .255). Elle veut séparer ses usages en <strong>sous-réseaux</strong> distincts pour la clarté et la sécurité : les <strong>postes</strong> (bureaux), les <strong>serveurs</strong>, le <strong>Wi-Fi invités</strong> et l'<strong>administration</strong> (management). Concevoir le plan d'adressage, c'est découper proprement ce /24 et attribuer à chaque service sa plage, son masque et sa passerelle.</p>
<h3>2. Rappel express : masque, réseau, hôtes</h3>
<p>Le <strong>masque</strong> sépare la partie « réseau » (fixe) de la partie « hôte » (variable). Chaque bit ajouté au masque coupe le nombre d'adresses en deux mais crée deux fois plus de sous-réseaux. Formule clé : un préfixe /n laisse <strong>32 − n</strong> bits d'hôte, donc <strong>2^(32−n)</strong> adresses, dont on retire 2 (adresse réseau + broadcast) pour obtenir les <strong>hôtes utilisables</strong>.</p>
<pre class="pseudo"># Reperes utiles (a partir d'un /24) :
/24 = 255.255.255.0     -> 256 adr.  254 hotes   (1 seul reseau)
/25 = 255.255.255.128   -> 128 adr.  126 hotes   (2 sous-reseaux)
/26 = 255.255.255.192   ->  64 adr.   62 hotes   (4 sous-reseaux)
/27 = 255.255.255.224   ->  32 adr.   30 hotes   (8 sous-reseaux)
/28 = 255.255.255.240   ->  16 adr.   14 hotes   (16 sous-reseaux)</pre>
<h3>3. Le choix : quatre sous-réseaux en /26</h3>
<p>Quatre services → quatre sous-réseaux. Découper le /24 en <strong>/26</strong> donne pile <strong>4 blocs de 64 adresses</strong> (62 hôtes chacun), largement suffisant pour une PME. Les blocs avancent de 64 en 64 : 0, 64, 128, 192.</p>
<pre class="pseudo"># Decoupage de 192.168.10.0/24 en 4 x /26 (masque 255.255.255.192) :
Service       Reseau              Plage utilisable       Broadcast        Passerelle
Postes        192.168.10.0/26     .1   -&gt; .62            192.168.10.63    192.168.10.1
Serveurs      192.168.10.64/26    .65  -&gt; .126           192.168.10.127   192.168.10.65
Wi-Fi invites 192.168.10.128/26   .129 -&gt; .190           192.168.10.191   192.168.10.129
Admin/manag.  192.168.10.192/26   .193 -&gt; .254           192.168.10.255   192.168.10.193</pre>
<div class="tip">Convention pratique : la passerelle de chaque sous-réseau est sa <strong>première adresse utilisable</strong> (.1, .65, .129, .193). Simple à retenir et à documenter.</div>
<h3>4. Vérifier la cohérence</h3>
<p>Un bon plan respecte trois règles. (1) Les plages ne se <strong>chevauchent pas</strong>. (2) Dans chaque sous-réseau, l'<strong>adresse réseau</strong> (la première, ex. .0, .64…) et le <strong>broadcast</strong> (la dernière, ex. .63, .127…) ne sont <strong>jamais</strong> attribués à une machine. (3) La <strong>passerelle</strong> de chaque poste appartient bien à son propre sous-réseau. Un serveur en .70 avec passerelle .1 ne fonctionnerait pas : .1 n'est pas dans le sous-réseau .64/26.</p>
<div class="warn">Erreur classique : donner à toutes les machines la même passerelle 192.168.10.1. Dès qu'on découpe en /26, chaque sous-réseau a SA passerelle. Un hôte du bloc serveurs (.64/26) doit pointer vers .65, pas vers .1.</div>
<h3>5. Faire dialoguer les sous-réseaux</h3>
<p>Découper isole les services : par défaut, un sous-réseau ne parle pas à l'autre. Pour qu'ils communiquent (ex. les postes vers les serveurs), il faut un <strong>routeur</strong> (ou routage inter-VLAN) qui possède une passerelle dans chaque bloc et relaie les paquets — exactement le mécanisme vu au jour 30. On peut alors filtrer : autoriser postes → serveurs, mais isoler le Wi-Fi invités.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Plan d'adressage = decouper un /24 en sous-reseaux par service
# /26 = 255.255.255.192 = 4 blocs de 64 adr. (62 hotes), pas de 64
# Chaque bloc : 1re adr = reseau, derniere = broadcast (jamais pour un hote)
# Passerelle = 1re adr utilisable de CHAQUE sous-reseau (.1, .65, .129, .193)
# Sous-reseaux separes -&gt; un routeur les relie (jour 30)</pre>`,
  exercises: [
    { type: "qcm", q: "Combien d'adresses contient un réseau en /24 ?", opts: ["64", "128", "256", "512"], a: 2, exp: "/24 = 8 bits d'hôte = 2^8 = 256 adresses (254 hôtes utilisables)." },
    { type: "input", q: "Quel masque décimal correspond à /26 ?", a: ["255.255.255.192", "255 255 255 192"], ph: "255.255.255.___", exp: "/26 = 255.255.255.192." },
    { type: "qcm", q: "En découpant un /24 en /26, combien de sous-réseaux obtient-on ?", opts: ["2", "4", "8", "16"], a: 1, exp: "/24 → /26 ajoute 2 bits de réseau : 2^2 = 4 sous-réseaux." },
    { type: "input", q: "Combien d'hôtes utilisables par sous-réseau en /26 ?", a: ["62", "soixante-deux"], ph: "un nombre", exp: "64 adresses − 2 (réseau + broadcast) = 62 hôtes." },
    { type: "vf", q: "Dans 192.168.10.0/26, l'adresse 192.168.10.63 est le broadcast et n'est pas attribuable à un poste.", a: true, exp: ".63 est la dernière du bloc .0/26 : c'est le broadcast." },
    { type: "qcm", q: "Quelle est l'adresse réseau du 2e bloc /26 de 192.168.10.0 ?", opts: ["192.168.10.32", "192.168.10.64", "192.168.10.100", "192.168.10.128"], a: 1, exp: "Les blocs /26 avancent de 64 : 0, 64, 128, 192." },
    { type: "qcm", q: "Avec la convention « passerelle = 1re utilisable », quelle passerelle pour le bloc 192.168.10.64/26 ?", opts: ["192.168.10.1", "192.168.10.64", "192.168.10.65", "192.168.10.127"], a: 2, exp: ".64 est l'adresse réseau ; la 1re utilisable est .65." },
    { type: "vf", q: "Un serveur en 192.168.10.70/26 peut utiliser 192.168.10.1 comme passerelle.", a: false, exp: "Non : .70 est dans le bloc .64/26 ; sa passerelle doit être dans ce bloc (.65), pas .1." },
    { type: "input", q: "Quelle est la dernière adresse utilisable du bloc 192.168.10.128/26 ?", a: ["192.168.10.190", ".190", "190"], ph: "192.168.10.___", exp: "Le bloc va de .128 à .191 ; broadcast .191, donc dernière utilisable .190." },
    { type: "qcm", q: "Pourquoi retire-t-on 2 adresses par sous-réseau ?", opts: ["Pour le DNS et le DHCP", "Pour l'adresse réseau et l'adresse de broadcast", "Pour la box et le routeur", "Pour la passerelle et le serveur DHCP"], a: 1, exp: "La 1re (réseau) et la dernière (broadcast) ne sont pas attribuables à des hôtes." },
    { type: "vf", q: "Découper en sous-réseaux améliore la clarté et la sécurité (services isolés).", a: true, exp: "Segmenter limite la diffusion et facilite le filtrage entre services." },
    { type: "qcm", q: "Pour que deux sous-réseaux communiquent, il faut…", opts: ["un câble croisé", "un routeur (ou routage inter-VLAN)", "le même masque partout", "un commutateur (switch) commun aux deux"], a: 1, exp: "Un routeur avec une patte dans chaque sous-réseau relaie les paquets." },
    { type: "input", q: "Combien de bits d'hôte reste-t-il avec un préfixe /26 ?", a: ["6", "six"], ph: "un nombre", exp: "32 − 26 = 6 bits d'hôte (2^6 = 64 adresses)." },
    { type: "qcm", q: "Si un service avait besoin de seulement 10 postes, quel préfixe serait le plus économe (≥ 10 hôtes) ?", opts: ["/24", "/26", "/28 (14 hôtes)", "/30 (2 hôtes)"], a: 2, exp: "/28 = 14 hôtes utilisables, suffisant pour 10 et le plus serré des choix proposés." },
    { type: "vf", q: "Dans un plan cohérent, les plages des sous-réseaux ne doivent jamais se chevaucher.", a: true, exp: "Le chevauchement crée des ambiguïtés et des conflits d'adressage." }
  ],
  final: {
    title: "Exercice final — Valider le plan d'adressage",
    intro: `<p>On te soumet ce plan pour 192.168.10.0/24 découpé en /26. À toi de le valider service par service.<br><code>Postes 192.168.10.0/26 · Serveurs 192.168.10.64/26 · Wi-Fi 192.168.10.128/26 · Admin 192.168.10.192/26</code></p>`,
    questions: [
      { type: "input", q: "Quel masque décimal s'applique à tous ces sous-réseaux ?", a: ["255.255.255.192", "255 255 255 192"], ph: "255.255.255.___", exp: "Tous sont en /26 = 255.255.255.192." },
      { type: "qcm", q: "Passerelle recommandée pour le sous-réseau Serveurs (192.168.10.64/26) ?", opts: ["192.168.10.1", "192.168.10.65", "192.168.10.64", "192.168.10.127"], a: 1, exp: ".65 = première utilisable du bloc .64/26." },
      { type: "vf", q: "Un poste peut recevoir l'adresse 192.168.10.63.", a: false, exp: "Non : .63 est le broadcast du bloc Postes (.0/26), non attribuable." },
      { type: "input", q: "Combien de postes utilisables au maximum dans le bloc Postes ?", a: ["62", "soixante-deux"], ph: "un nombre", exp: "62 hôtes utilisables par /26." },
      { type: "qcm", q: "Pour que les Postes atteignent les Serveurs, il faut…", opts: ["rien, c'est automatique", "un routeur reliant les deux sous-réseaux", "le même broadcast", "supprimer le masque"], a: 1, exp: "Deux sous-réseaux distincts ne dialoguent que via un routeur." }
    ],
    solution: `<pre class="pseudo"># Plan valide : 192.168.10.0/24  ->  4 x /26 (255.255.255.192)
Service    Reseau            Utilisables        Broadcast      Passerelle
Postes     192.168.10.0/26   .1  -&gt; .62         10.63          192.168.10.1
Serveurs   192.168.10.64/26  .65 -&gt; .126        10.127         192.168.10.65
Wi-Fi      192.168.10.128/26 .129-&gt; .190        10.191         192.168.10.129
Admin      192.168.10.192/26 .193-&gt; .254        10.255         192.168.10.193
# Regles : reseau et broadcast jamais attribues ; passerelle = 1re utilisable ;
# communication entre services = via un routeur (une patte par sous-reseau).</pre>
<p>Bravo : tu sais concevoir, calculer et valider un plan d'adressage complet. C'est la synthèse de tout le parcours IP et routage.</p>`
  }
};
</script>
