<script>
var DAY = {
  num: 13,
  title: "Le subnetting : découper une plage",
  subtitle: "Prendre un grand réseau et le partager en morceaux plus petits, comme on cloisonne un open space.",
  theory: `
<h3>1. Qu'est-ce que le subnetting ?</h3>
<p>Le <strong>subnetting</strong> (« découpage en sous-réseaux ») consiste à prendre un bloc d'adresses et à le <strong>diviser en plusieurs réseaux plus petits</strong>, appelés <strong>sous-réseaux</strong> (subnets). On part par exemple d'un 192.168.1.0/24 (254 hôtes possibles) et on le coupe en deux, quatre ou huit tranches indépendantes.</p>
<p>Analogie : imagine un grand plateau de bureaux ouvert (l'open space). Un seul grand espace, c'est le /24 : tout le monde s'entend, tout le monde se dérange. Le subnetting, c'est monter des cloisons pour créer plusieurs salles séparées : le service compta d'un côté, l'atelier de l'autre, la salle serveur à part. Chaque salle est un sous-réseau.</p>
<h3>2. Pourquoi découper ? Trois bonnes raisons</h3>
<p>- <strong>Organisation</strong> : regrouper les machines par service (compta, production, invités) rend le réseau lisible et plus facile à gérer.</p>
<p>- <strong>Sécurité</strong> : on peut placer un pare-feu ou des règles entre sous-réseaux. Les invités du Wi-Fi n'atteignent pas les serveurs comptables si ce sont deux sous-réseaux distincts.</p>
<p>- <strong>Performance</strong> : la <strong>diffusion</strong> (broadcast) reste confinée dans son sous-réseau. Un message broadcast dans un /24 dérange 254 machines ; découpé en /26, il ne dérange plus que 62 machines à la fois. Moins de bruit, plus de fluidité.</p>
<div class="tip">Un routeur (ou un commutateur de niveau 3) est nécessaire pour faire communiquer deux sous-réseaux entre eux. À l'intérieur d'un même sous-réseau, les machines se parlent directement.</div>
<h3>3. Le principe : emprunter des bits aux hôtes</h3>
<p>Rappel : une adresse a une partie <strong>réseau</strong> (à gauche) et une partie <strong>hôte</strong> (à droite). Découper, c'est <strong>agrandir la partie réseau en prenant des bits à la partie hôte</strong>. Chaque bit emprunté <strong>double</strong> le nombre de sous-réseaux, mais divise par deux le nombre d'hôtes de chacun. C'est un compromis : plus de sous-réseaux = moins de machines par sous-réseau.</p>
<pre class="pseudo"># Depart : 192.168.1.0/24  -> 1 reseau de 254 hotes
# Emprunter 1 bit  -> /25  -> 2 sous-reseaux de 126 hotes
# Emprunter 2 bits -> /26  -> 4 sous-reseaux de 62 hotes
# Emprunter 3 bits -> /27  -> 8 sous-reseaux de 30 hotes
# Regle : bits empruntes = b  ->  2^b sous-reseaux</pre>
<h3>4. Ce que le préfixe devient</h3>
<p>Emprunter des bits, c'est simplement <strong>augmenter le préfixe</strong>. Partir de /24 et emprunter 2 bits donne /26. Le masque s'allonge en conséquence : /24 = 255.255.255.0 devient /26 = 255.255.255.192. Le découpage ne change pas les adresses de départ ; il change seulement la <strong>frontière</strong> entre réseau et hôte.</p>
<div class="warn">Ne confonds pas « sous-réseaux » et « hôtes ». Emprunter des bits crée des sous-réseaux mais réduit les hôtes disponibles dans chacun. Découper trop finement peut manquer d'adresses : il faut viser juste selon le besoin réel.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Subnetting = decouper un reseau en sous-reseaux plus petits
# On EMPRUNTE des bits a la partie hote -> le prefixe AUGMENTE
# b bits empruntes  ->  2^b sous-reseaux
# Buts : organisation, securite, moins de broadcast (performance)
# Il faut un routeur pour relier deux sous-reseaux differents
# Compromis : + de sous-reseaux  =  - d'hotes par sous-reseau</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « faire du subnetting » ?", opts: ["Fusionner plusieurs réseaux", "Découper un réseau en sous-réseaux plus petits", "Changer d'adresse IP publique", "Désactiver le DHCP"], a: 1, exp: "Subnetting = diviser un bloc d'adresses en plusieurs sous-réseaux." },
    { type: "qcm", q: "Pour découper, on emprunte des bits à quelle partie de l'adresse ?", opts: ["À la partie réseau", "À la partie hôte", "Au masque uniquement", "À la passerelle"], a: 1, exp: "On prend des bits à la partie hôte pour agrandir la partie réseau." },
    { type: "input", q: "Si on emprunte 2 bits, combien de sous-réseaux obtient-on ? (formule 2^b)", a: ["4", "2^2", "quatre"], ph: "un nombre", exp: "2^2 = 4 sous-réseaux." },
    { type: "vf", q: "Chaque bit emprunté double le nombre de sous-réseaux.", a: true, exp: "Vrai : +1 bit = 2 fois plus de sous-réseaux (2^b)." },
    { type: "qcm", q: "En découpant un /24 en /26, on emprunte…", opts: ["1 bit", "2 bits", "3 bits", "4 bits"], a: 1, exp: "De 24 à 26 = 2 bits empruntés, soit 4 sous-réseaux." },
    { type: "vf", q: "Plus on crée de sous-réseaux, plus chaque sous-réseau contient d'hôtes.", a: false, exp: "Faux : c'est l'inverse. Plus de sous-réseaux = moins d'hôtes dans chacun." },
    { type: "qcm", q: "Quel équipement fait communiquer deux sous-réseaux différents ?", opts: ["Un hub", "Un routeur (ou switch de niveau 3)", "Un simple câble", "Un répéteur Wi-Fi"], a: 1, exp: "Le passage d'un sous-réseau à un autre nécessite un routage : routeur ou switch L3." },
    { type: "input", q: "Quel bénéfice du subnetting confine la diffusion (broadcast) à un plus petit groupe de machines ? (un mot: performance ou sécurité ?)", a: ["performance", "la performance"], ph: "un mot", exp: "Confiner le broadcast améliore la performance (moins de bruit réseau)." },
    { type: "qcm", q: "Un /24 découpé en /27 donne combien de sous-réseaux ?", opts: ["2", "4", "8", "16"], a: 2, exp: "De 24 à 27 = 3 bits empruntés = 2^3 = 8 sous-réseaux." },
    { type: "vf", q: "Séparer le Wi-Fi invité des serseurs comptables dans deux sous-réseaux distincts améliore la sécurité.", a: true, exp: "Vrai : on peut filtrer entre sous-réseaux, isolant les invités des serveurs." },
    { type: "qcm", q: "Emprunter des bits revient concrètement à…", opts: ["Diminuer le préfixe", "Augmenter le préfixe", "Supprimer le masque", "Changer la classe"], a: 1, exp: "Emprunter des bits = allonger la partie réseau = augmenter le préfixe." },
    { type: "input", q: "Un /24 devient quel préfixe si on emprunte 3 bits ? (notation /xx)", a: ["/27", "27"], ph: "ex: /25", exp: "24 + 3 = /27." },
    { type: "qcm", q: "Quelle analogie décrit le mieux le subnetting ?", opts: ["Ajouter des étages à un immeuble", "Poser des cloisons dans un grand open space", "Changer la couleur des câbles", "Éteindre la moitié des PC"], a: 1, exp: "Cloisonner un open space en salles = créer des sous-réseaux." },
    { type: "vf", q: "Le subnetting change les adresses de départ du bloc.", a: false, exp: "Faux : il déplace seulement la frontière réseau/hôte (le préfixe), pas le bloc de départ." },
    { type: "qcm", q: "Découper trop finement un réseau risque surtout de…", opts: ["Augmenter le nombre d'hôtes par sous-réseau", "Manquer d'adresses d'hôtes dans chaque sous-réseau", "Supprimer le broadcast définitivement", "Rendre le routeur inutile"], a: 1, exp: "Trop de découpage = trop peu d'hôtes par sous-réseau. Il faut viser le besoin réel." }
  ],
  final: {
    title: "Exercice final — Décider d'un découpage",
    intro: `<p>Une PME dispose du réseau <code>192.168.1.0/24</code>. Elle veut séparer trois populations : bureaux, atelier, et Wi-Fi invités. On réfléchit au principe du découpage (les calculs précis viendront les jours suivants).</p>`,
    questions: [
      { type: "qcm", q: "Combien de sous-réseaux au minimum faut-il pour ces trois populations ?", opts: ["1", "2", "3", "0"], a: 2, exp: "Trois groupes distincts = au moins 3 sous-réseaux." },
      { type: "input", q: "Pour obtenir au moins 3 (donc 4) sous-réseaux, combien de bits faut-il emprunter ? (2^b >= 4)", a: ["2", "2 bits", "deux"], ph: "un nombre", exp: "2^2 = 4 >= 3 : il faut emprunter 2 bits." },
      { type: "qcm", q: "En empruntant 2 bits au /24, on obtient un préfixe…", opts: ["/22", "/25", "/26", "/28"], a: 2, exp: "24 + 2 = /26, soit 4 sous-réseaux." },
      { type: "vf", q: "Isoler le Wi-Fi invités dans son propre sous-réseau améliore la sécurité.", a: true, exp: "Vrai : on peut empêcher les invités d'atteindre les ressources internes." },
      { type: "qcm", q: "Pour que l'atelier joigne un serveur situé dans le sous-réseau bureaux, il faut…", opts: ["Rien, c'est automatique", "Un routeur entre les deux sous-réseaux", "Débrancher le Wi-Fi", "Fusionner les deux sous-réseaux"], a: 1, exp: "Deux sous-réseaux différents communiquent via un routeur." }
    ],
    solution: `<pre class="pseudo"># Besoin : 3 groupes -> au moins 3 sous-reseaux
# 2^b >= 3  ->  b = 2 bits (donne 4 sous-reseaux, 1 en reserve)
# 192.168.1.0/24 + 2 bits  ->  /26  (4 sous-reseaux de 62 hotes)
# Communication entre sous-reseaux -> routeur
# Wi-Fi invites isole -> gain de securite
# Calcul precis des plages : voir jours 14 et 15.</pre>
<p>Tu comprends le pourquoi et le principe. Demain : la méthode complète pour calculer concrètement les plages de chaque sous-réseau.</p>`
  }
};
