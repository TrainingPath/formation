  title: "Ping et traceroute",
  subtitle: "Deux commandes, un seul secret : ICMP et le compteur TTL.",
  theory: `
<h3>1. Ping : « es-tu là ? »</h3>
<p><strong>ping</strong> est l'outil de test le plus simple. Il envoie à une cible un <strong>echo request</strong> ICMP (type 8) et attend un <strong>echo reply</strong> (type 0). Chaque aller-retour réussi affiche une ligne avec le temps mesuré. C'est le premier réflexe pour savoir « est-ce que la machine répond, et à quelle vitesse ? ».</p>
<pre class="pseudo"># Windows : envoie 4 pings par defaut
ping 8.8.8.8
# Linux/macOS : ping en continu, on arrete avec Ctrl+C
ping 8.8.8.8
# Sortie typique :
Reponse de 8.8.8.8 : octets=32 temps=12 ms TTL=118</pre>
<h3>2. Lire un résultat de ping</h3>
<p>Trois indices comptent. Le <strong>temps</strong> (ex. 12 ms) mesure la latence : plus il est petit, plus c'est réactif. Le <strong>TTL</strong> affiché dans la réponse indique combien de « sauts » il restait au paquet : il diminue à chaque routeur traversé. Les <strong>pertes</strong> (paquets perdus) révèlent une liaison instable. À la fin, un résumé donne min/moyenne/max.</p>
<pre class="pseudo">--- Statistiques ---
4 paquets transmis, 4 recus, 0% de perte
temps min/moy/max = 11/12/14 ms</pre>
<div class="tip">Le TTL de départ dépend du système (souvent 64 sous Linux, 128 sous Windows). Si tu reçois TTL=118, la cible a probablement démarré à 128 et le paquet a traversé environ 10 routeurs (128 − 118).</div>
<h3>3. Le TTL, un compte à rebours anti-boucle</h3>
<p>Le <strong>TTL</strong> (<em>Time To Live</em>, « durée de vie ») est un compteur placé dans chaque paquet IP. À <strong>chaque routeur traversé, il diminue de 1</strong>. S'il atteint <strong>0</strong>, le routeur jette le paquet et renvoie un message ICMP <strong>Time Exceeded</strong> (type 11) à l'expéditeur. Ce mécanisme empêche un paquet égaré de tourner à l'infini. C'est aussi la clé de traceroute.</p>
<h3>4. Traceroute : cartographier le chemin</h3>
<p><strong>traceroute</strong> (sous Windows : <strong>tracert</strong>) révèle la liste des routeurs entre toi et une destination. Son astuce est géniale : il envoie des paquets avec un <strong>TTL croissant</strong>. Le premier part avec TTL=1 : le premier routeur le décrémente à 0, le jette et se signale (Time Exceeded) — on apprend son adresse. Le deuxième part avec TTL=2 et « meurt » au deuxième routeur, qui se dévoile à son tour, et ainsi de suite jusqu'à la destination.</p>
<pre class="pseudo"># Windows :
tracert 8.8.8.8
# Linux/macOS :
traceroute 8.8.8.8
# Chaque ligne = un saut (un routeur) :
 1    2 ms   192.168.1.1        (ta box)
 2   14 ms   10.0.0.1           (routeur du FAI)
 3   15 ms   ...                (routeur suivant)
 ...
 9   18 ms   8.8.8.8            (destination atteinte)</pre>
<div class="warn">Certains routeurs ne renvoient pas de Time Exceeded (ICMP filtré) : traceroute affiche alors des étoiles « * * * » pour ce saut. Ce n'est pas forcément une panne — juste un routeur discret.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ping  = teste si un hote repond (echo request 8 / echo reply 0)
#         indices : temps (latence), TTL, pertes
# TTL   = compteur dans le paquet IP, -1 a chaque routeur ; a 0 -&gt; Time Exceeded (11)
# traceroute / tracert = liste les routeurs du chemin
#         methode : TTL croissant (1, 2, 3, ...) pour reveler chaque saut
# "* * *" = routeur qui ne repond pas (ICMP filtre), pas forcement une panne</pre>`,

    { type: "qcm", q: "Quelle est l'astuce centrale de traceroute ?", opts: ["Envoyer des paquets avec un TTL croissant (1,2,3…)", "Utiliser TCP au lieu d'ICMP", "Interroger le DNS", "Vider le cache ARP"], a: 0, exp: "Le TTL croissant fait « mourir » chaque paquet un saut plus loin, révélant chaque routeur." },

    { type: "input", q: "Dans une réponse ping, quel champ (3 lettres) indique combien de sauts il restait au paquet ?", a: ["ttl", "le ttl"], ph: "3 lettres", exp: "Le TTL affiché dans la réponse renseigne sur le nombre de sauts restants." },
    { type: "qcm", q: "Que signifie « * * * » sur une ligne de traceroute ?", opts: ["La destination est atteinte", "Un routeur qui ne répond pas (ICMP filtré)", "Une erreur DNS", "Le TTL est négatif"], a: 1, exp: "Des étoiles = ce saut n'a pas renvoyé de Time Exceeded (filtrage), pas forcément une panne." },
    { type: "qcm", q: "Le « temps = 12 ms » d'un ping mesure…", opts: ["la taille du paquet", "la latence (temps aller-retour)", "le nombre de routeurs", "la vitesse du disque"], a: 1, exp: "C'est la latence : durée de l'aller-retour ICMP." },
    { type: "vf", q: "Un TTL de départ vaut souvent 64 sous Linux et 128 sous Windows.", a: true, exp: "Ces valeurs par défaut aident à estimer le nombre de sauts traversés." },
    { type: "qcm", q: "Le premier paquet envoyé par traceroute part avec quel TTL ?", opts: ["0", "1", "64", "255"], a: 1, exp: "TTL=1 : il meurt au premier routeur, qui se révèle." },
    { type: "input", q: "Quel message ICMP (nom en 2 mots anglais) permet à traceroute d'identifier chaque routeur ?", a: ["time exceeded", "time-exceeded"], ph: "2 mots", exp: "Time Exceeded (type 11) renvoyé quand le TTL atteint 0." },
    { type: "vf", q: "Un ping réussi mais lent (temps élevé) peut indiquer une latence importante.", a: true, exp: "Un temps élevé signale une latence importante, même si l'hôte répond." }
  ],
  final: {
    title: "Exercice final — Diagnostic d'une connexion lente",
    intro: `<p>Le site interne répond mal. Léa lance <code>ping</code> puis <code>tracert</code> pour localiser le problème. Elle voit : ping OK mais temps de 210 ms, et au 3e saut de tracert « * * * ».</p>`,
    questions: [
      { type: "qcm", q: "Le ping répond : sur quels messages ICMP repose-t-il ?", opts: ["Type 3 et 11", "Echo request (8) et echo reply (0)", "Type 5 seulement", "Aucun"], a: 1, exp: "Ping = echo request (8) / echo reply (0)." },
      { type: "qcm", q: "Un temps de 210 ms indique surtout…", opts: ["une perte de paquets", "une latence élevée", "un TTL nul", "un problème ARP"], a: 1, exp: "210 ms traduit une latence importante sur le trajet." },
      { type: "input", q: "Sous Windows, quelle commande a affiché les sauts du chemin ?", a: ["tracert", "tracert 8.8.8.8"], ph: "commande", exp: "tracert sous Windows." },
      { type: "qcm", q: "Le « * * * » au 3e saut signifie probablement…", opts: ["que le réseau est coupé à coup sûr", "qu'un routeur ne renvoie pas de Time Exceeded (filtrage ICMP)", "que le DNS est cassé", "que la destination est atteinte"], a: 1, exp: "Un routeur discret qui ne répond pas ; le trajet peut continuer ensuite." },
      { type: "vf", q: "traceroute a fonctionné en envoyant des paquets à TTL croissant.", a: true, exp: "TTL 1, 2, 3… révèle chaque routeur successif." }
    ],
    solution: `<pre class="pseudo"># Methode de diagnostic :
1) ping  -&gt; l'hote repond-il ? a quelle latence ? (echo request/reply)
   Ici : repond, mais temps=210 ms  =&gt; latence elevee
2) tracert / traceroute -&gt; ou se situe le ralentissement ?
   TTL croissant (1,2,3...) revele chaque routeur (Time Exceeded, type 11)
   "* * *" au saut 3 = routeur qui ne repond pas (ICMP filtre), pas une panne
# Conclusion : chercher le saut ou le temps grimpe pour localiser le point lent.</pre>
<p>Ping et traceroute n'ont plus de secret. Demain : place à la pratique, configurer soi-même une adresse IP fixe.</p>`
  }
};
