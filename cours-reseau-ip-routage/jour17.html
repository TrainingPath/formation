<script>
var DAY = {
  num: 17,
  title: "Le VLSM : masques de longueur variable",
  subtitle: "Découper un réseau sur mesure, en donnant à chaque sous-réseau juste ce dont il a besoin.",
  theory: `
<h3>1. Le gaspillage des masques uniformes</h3>
<p>Jusqu'ici, quand on découpait un réseau en sous-réseaux, on utilisait souvent le <strong>même masque partout</strong>. Simple, mais très gourmand. Imagine que ton entreprise reçoive le bloc <strong>192.168.1.0/24</strong> (256 adresses) et doive équiper : un site A de 100 machines, un site B de 50 machines, un site C de 20 machines, et deux liaisons entre routeurs (2 machines chacune). Si tu appliques partout un /26 (64 adresses), tu n'as que 4 sous-réseaux : impossible de tout loger, et chaque liaison de 2 machines gâche 62 adresses.</p>
<p>Le <strong>VLSM</strong> (en anglais <em>Variable Length Subnet Mask</em>, « masque de sous-réseau de longueur variable ») résout ce problème : on autorise <strong>un masque différent pour chaque sous-réseau</strong>. Un gros bloc pour les gros besoins, un tout petit bloc pour les liaisons point à point.</p>
<div class="tip">L'idée clé du VLSM : on <strong>sous-découpe un sous-réseau</strong>. On prend un bloc, on en détache un morceau adapté, puis on redécoupe le reste plus finement. C'est le même principe qu'une pizza : on ne coupe pas huit parts égales si un invité a très faim et un autre veut juste une bouchée.</div>
<h3>2. La règle d'or : du plus grand au plus petit</h3>
<p>Pour éviter les chevauchements, on traite toujours les besoins <strong>par ordre décroissant</strong>. On sert d'abord le sous-réseau qui réclame le plus d'adresses, puis on descend. Ainsi chaque bloc s'aligne proprement sur le suivant.</p>
<p>Rappel du calcul : un sous-réseau avec un préfixe /n contient 2^(32-n) adresses au total, dont <strong>2 réservées</strong> (l'adresse réseau et l'adresse de diffusion / broadcast). Le nombre de machines utilisables est donc 2^(32-n) − 2.</p>
<pre class="pseudo"># Combien de bits d'hotes faut-il pour N machines ?
/25  = 128 adresses = 126 hotes utilisables
/26  =  64 adresses =  62 hotes
/27  =  32 adresses =  30 hotes
/28  =  16 adresses =  14 hotes
/29  =   8 adresses =   6 hotes
/30  =   4 adresses =   2 hotes   (parfait pour une liaison entre 2 routeurs)</pre>
<h3>3. Un découpage complet, pas à pas</h3>
<p>Reprenons 192.168.1.0/24 avec les besoins : A=100, B=50, C=20, liaison1=2, liaison2=2. On trie : 100, 50, 20, 2, 2.</p>
<pre class="pseudo"># A (100 hotes) -> /25 (126 hotes)
192.168.1.0/25    -> .0 a .127
# B (50 hotes) -> /26 (62 hotes), on prend dans ce qui reste
192.168.1.128/26  -> .128 a .191
# C (20 hotes) -> /27 (30 hotes)
192.168.1.192/27  -> .192 a .223
# Liaison 1 (2 hotes) -> /30 (2 hotes)
192.168.1.224/30  -> .224 a .227
# Liaison 2 (2 hotes) -> /30
192.168.1.228/30  -> .228 a .231
# Il reste meme de la place libre a partir de .232 !</pre>
<p>Chaque bloc commence exactement là où le précédent finit : aucune adresse ne se chevauche, et le gaspillage est minimal. C'est tout l'intérêt du VLSM par rapport à un masque unique.</p>
<div class="warn">Piège classique : ne PAS trier du plus grand au plus petit. Si tu commences par une petite liaison /30 puis veux caser un /25, tu te retrouves avec des blocs mal alignés qui se chevauchent. Toujours du plus grand besoin au plus petit.</div>
<h3>4. Prérequis : le routage sans classe (CIDR)</h3>
<p>Le VLSM n'est possible que parce que les protocoles modernes transportent le masque avec l'adresse. On parle de routage <strong>sans classe</strong> (en anglais <em>classless</em>), la base du <strong>CIDR</strong> (Classless Inter-Domain Routing). Les vieux protocoles « avec classe » supposaient un masque implicite selon la classe A/B/C et ne pouvaient pas gérer des masques variables. Aujourd'hui, on écrit toujours l'adresse ET son préfixe, par exemple 10.0.5.0/28.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLSM = un masque different par sous-reseau (sur mesure)
# Objectif : coller au besoin, gaspiller le moins d'adresses possible
# Methode : 1) lister les besoins  2) trier du + grand au + petit
#           3) choisir le prefixe juste suffisant (2^h - 2 >= besoin)
#           4) placer les blocs a la suite, sans chevauchement
# /30 = 2 hotes : ideal pour une liaison entre deux routeurs</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme VLSM ?", opts: ["Very Large Subnet Mask", "Variable Length Subnet Mask", "Virtual LAN Subnet Model", "Verified Local Subnet Map"], a: 1, exp: "VLSM = Variable Length Subnet Mask : un masque de longueur variable selon chaque sous-réseau." },
    { type: "qcm", q: "Quel est le principal avantage du VLSM par rapport à un masque unique ?", opts: ["Il regroupe tous les sous-réseaux sous un masque unique", "Il évite le gaspillage en adaptant chaque bloc au besoin", "Il augmente le nombre total d'adresses disponibles", "Il supprime le broadcast"], a: 1, exp: "Le VLSM donne à chaque sous-réseau juste la taille nécessaire, ce qui économise les adresses." },
    { type: "vf", q: "Avec le VLSM, tous les sous-réseaux doivent avoir le même masque.", a: false, exp: "Au contraire : le VLSM autorise un masque différent pour chaque sous-réseau." },
    { type: "input", q: "Combien d'hôtes utilisables offre un sous-réseau /30 ? (réponds par un chiffre)", a: ["2", "deux"], ph: "un nombre", exp: "/30 = 4 adresses, moins 2 réservées = 2 hôtes. Idéal pour une liaison entre 2 routeurs." },
    { type: "qcm", q: "Pour un sous-réseau, combien d'adresses sont toujours réservées ?", opts: ["0", "1", "2", "4"], a: 2, exp: "2 adresses : celle du réseau et celle de diffusion (broadcast)." },
    { type: "input", q: "Combien d'hôtes utilisables dans un /26 ? (chiffre)", a: ["62", "soixante-deux"], ph: "un nombre", exp: "/26 = 64 adresses − 2 = 62 hôtes utilisables." },
    { type: "vf", q: "En VLSM, on traite les besoins du plus petit au plus grand.", a: false, exp: "Non : on trie du PLUS GRAND au plus petit pour aligner les blocs sans chevauchement." },
    { type: "qcm", q: "Un site a besoin de 20 machines. Quel préfixe est le plus adapté ?", opts: ["/28 (14 hôtes)", "/27 (30 hôtes)", "/26 (62 hôtes)", "/30 (2 hôtes)"], a: 1, exp: "/27 offre 30 hôtes : c'est le plus petit bloc qui couvre 20 machines sans gaspiller." },
    { type: "qcm", q: "Quel prérequis rend le VLSM possible ?", opts: ["Le routage avec classe", "Le routage sans classe (CIDR)", "Le protocole DHCP", "Le protocole ARP"], a: 1, exp: "Le VLSM repose sur le routage sans classe (classless / CIDR), où le masque accompagne l'adresse." },
    { type: "input", q: "Dans 192.168.1.0/25, quelle est la dernière adresse du bloc ? (format x.x.x.x)", a: ["192.168.1.127"], ph: "192.168.1.x", exp: "/25 = 128 adresses : de .0 à .127. La dernière est 192.168.1.127 (broadcast)." },
    { type: "vf", q: "Un /29 fournit 6 hôtes utilisables.", a: true, exp: "Oui : /29 = 8 adresses − 2 = 6 hôtes." },
    { type: "qcm", q: "Pourquoi utilise-t-on souvent un /30 entre deux routeurs ?", opts: ["Parce qu'il offre 62 hôtes", "Parce qu'une liaison point à point n'a besoin que de 2 adresses", "Parce qu'il fournit 4 adresses utilisables", "Parce qu'il ne réserve aucune adresse réseau ni broadcast"], a: 1, exp: "Une liaison relie exactement 2 interfaces : /30 (2 hôtes) suffit et gaspille très peu." },
    { type: "input", q: "Un site de 50 machines : quel préfixe minimal convient ? (format /n)", a: ["/26", "26"], ph: "/n", exp: "/26 = 62 hôtes, le plus petit bloc couvrant 50 machines." },
    { type: "qcm", q: "Que se passe-t-il si on ne trie pas les besoins par ordre décroissant ?", opts: ["Rien de grave", "Les blocs risquent de se chevaucher ou de mal s'aligner", "On obtient toujours un découpage optimal quand même", "Le masque devient automatiquement uniforme"], a: 1, exp: "Sans tri décroissant, l'alignement des blocs casse et des chevauchements apparaissent." },
    { type: "input", q: "En notation CIDR, comment écrit-on une adresse avec son masque, par exemple le premier sous-réseau de 10.0.5.0 en /28 ?", a: ["10.0.5.0/28", "10.0.5.0 /28"], ph: "x.x.x.x/n", exp: "On écrit l'adresse suivie du préfixe : 10.0.5.0/28." }
  ],
  final: {
    title: "Exercice final — Découper 172.16.0.0/24 pour une PME",
    intro: `<p>La société « Bureautique+ » dispose du bloc <code>172.16.0.0/24</code>. Elle doit équiper : un service Ventes de 60 postes, un service Support de 28 postes, un service Direction de 10 postes, et une liaison /30 entre deux routeurs. Découpe en VLSM, du plus grand au plus petit.</p>`,
    questions: [
      { type: "qcm", q: "Quel service traite-t-on en premier ?", opts: ["La liaison entre routeurs", "La Direction (10)", "Le Support (28)", "Les Ventes (60)"], a: 3, exp: "On commence par le plus gros besoin : Ventes (60 postes)." },
      { type: "input", q: "Quel préfixe attribuer aux Ventes (60 postes) ? (format /n)", a: ["/26", "26"], ph: "/n", exp: "/26 = 62 hôtes, le plus petit bloc couvrant 60 postes. Bloc : 172.16.0.0/26 (.0 à .63)." },
      { type: "qcm", q: "Le Support (28 postes) reçoit alors quel bloc ?", opts: ["172.16.0.64/27", "172.16.0.0/27", "172.16.0.128/26", "172.16.0.64/26"], a: 0, exp: "Après les Ventes (.0–.63), le Support prend 172.16.0.64/27 (30 hôtes, .64 à .95)." },
      { type: "input", q: "Quel préfixe pour la Direction (10 postes) ? (format /n)", a: ["/28", "28"], ph: "/n", exp: "/28 = 14 hôtes, suffisant pour 10 postes. Bloc suivant : 172.16.0.96/28 (.96 à .111)." },
      { type: "vf", q: "La liaison entre routeurs peut prendre un /30 juste après la Direction, par exemple 172.16.0.112/30.", a: true, exp: "Oui : après la Direction (jusqu'à .111), la liaison /30 commence à .112 (.112 à .115). Aucun chevauchement." }
    ],
    solution: `<pre class="pseudo"># Besoins tries du + grand au + petit : 60, 28, 10, 2
Ventes    (60) -> 172.16.0.0/26    (.0   a .63)   62 hotes
Support   (28) -> 172.16.0.64/27   (.64  a .95)   30 hotes
Direction (10) -> 172.16.0.96/28   (.96  a .111)  14 hotes
Liaison    (2) -> 172.16.0.112/30  (.112 a .115)   2 hotes
# Il reste encore de la place a partir de .116 : le VLSM a economise les adresses.</pre>
<p>Chaque bloc s'aligne sur le précédent sans chevauchement : c'est la puissance du VLSM, un masque sur mesure pour chaque besoin.</p>`
  }
};
</script>
