<!DOCTYPE html><html lang="fr"><head>

<title>Jour 16</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 16,
  title: "Exercices de subnetting guidés",
  subtitle: "On calcule, on recalcule : préfixes, masques, plages, hôtes et broadcasts jusqu'à l'automatisme.",
  theory: `
<h3>1. La check-list de calcul</h3>
<p>Cette leçon est un atelier. Avant de foncer dans les exercices, garde sous les yeux la même méthode que les jours précédents, condensée :</p>
<pre class="pseudo"># Pour CHAQUE probleme de subnetting :
# 1. Prefixe -> bits d'hote h = 32 - prefixe
# 2. Hotes utilisables = 2^h - 2
# 3. Nombre magique = 256 - (valeur du masque dans l'octet interessant) = le PAS
# 4. Sous-reseaux : 0, pas, 2xpas, 3xpas, ... dans l'octet interessant
# 5. Broadcast d'un bloc = (bloc suivant) - 1 ; 1er hote = bloc + 1 ; dernier = broadcast - 1</pre>
<h3>2. Table de référence à mémoriser</h3>
<pre class="pseudo"># Prefixe   Masque (dernier octet)   Magique/pas   Hotes utilisables
#  /25       255.255.255.128          128           126
#  /26       255.255.255.192          64            62
#  /27       255.255.255.224          32            30
#  /28       255.255.255.240          16            14
#  /29       255.255.255.248          8             6
#  /30       255.255.255.252          4             2</pre>
<h3>3. Exemple entièrement résolu</h3>
<p>Problème : à quel sous-réseau appartient <strong>192.168.1.155/27</strong>, et quels sont ses hôtes ?</p>
<pre class="pseudo"># /27 -> masque 255.255.255.224 -> magique 256-224 = 32
# Bornes (dernier octet) : 0, 32, 64, 96, 128, 160, 192, 224
# 155 est entre 128 et 160  ->  sous-reseau 192.168.1.128
# Broadcast = 160 - 1 = 192.168.1.159
# Hotes utilisables : 192.168.1.129  a  192.168.1.158  (30 hotes)
# Verdict : 155 est un hote valide de 192.168.1.128/27</pre>
<div class="tip">Réflexe rapide : pour situer une adresse, cherche le plus grand multiple du nombre magique qui ne dépasse pas l'octet. Pour 155 avec magique 32 : 32x4 = 128, 32x5 = 160 (trop). Donc 128.</div>
<h3>4. Le cas VLSM en un mot</h3>
<p>Parfois les sous-réseaux n'ont pas tous la même taille : on parle de <strong>VLSM</strong> (Variable Length Subnet Mask, « masque de longueur variable »). On sert d'abord le plus gros besoin avec un préfixe adapté, puis on découpe la suite pour les besoins plus petits. Le principe de calcul reste identique, appliqué bloc par bloc.</p>
<div class="warn">Deux erreurs à traquer dans tous les exercices : (1) oublier le -2 sur les hôtes, (2) se tromper d'octet intéressant quand le préfixe est inférieur à /24 (le découpage se fait alors dans le 3e octet, voire le 2e).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># h = 32 - prefixe ; hotes = 2^h - 2 ; magique = 256 - masque = pas
# Situer une adresse : plus grand multiple du magique <= octet
# Broadcast = bloc suivant - 1
# VLSM : tailles differentes, servir le plus gros besoin d'abord
# S'entrainer jusqu'a repondre sans papier</pre>`,
  exercises: [
    { type: "input", q: "192.168.1.50/26 : quelle est l'adresse de son sous-réseau ? (magique 64)", a: ["192.168.1.0", "192.168.1.0/26"], ph: "une adresse", exp: "Magique 64 : blocs 0,64,128,192. 50 < 64 donc bloc 192.168.1.0." },
    { type: "input", q: "Combien d'hôtes utilisables dans un /28 ? (2^4 - 2)", a: ["14", "14 hotes"], ph: "un nombre", exp: "h = 4, 2^4 - 2 = 14." },
    { type: "qcm", q: "192.168.1.130/26 : quel est son sous-réseau ?", opts: ["192.168.1.0", "192.168.1.64", "192.168.1.128", "192.168.1.192"], a: 2, exp: "Magique 64 : 130 est entre 128 et 192, bloc 192.168.1.128." },
    { type: "input", q: "Nombre magique pour un /29 ? (256 - 248)", a: ["8"], ph: "un nombre", exp: "/29 = 255.255.255.248 ; 256 - 248 = 8." },
    { type: "qcm", q: "192.168.1.200/27 : quel est son broadcast ? (magique 32)", opts: ["192.168.1.207", "192.168.1.223", "192.168.1.224", "192.168.1.255"], a: 1, exp: "200 est dans le bloc 192 (192-223) ; broadcast = 223." },
    { type: "vf", q: "Dans un /30, il n'y a que 2 hôtes utilisables.", a: true, exp: "Vrai : 2^2 - 2 = 2. Idéal pour un lien entre deux routeurs." },
    { type: "input", q: "10.0.0.100/27 : adresse de son sous-réseau ? (magique 32)", a: ["10.0.0.96", "10.0.0.96/27"], ph: "une adresse", exp: "Blocs de 32 : 96 est le plus grand multiple <= 100. Bloc 10.0.0.96." },
    { type: "qcm", q: "Quel masque correspond à 62 hôtes utilisables par sous-réseau ?", opts: ["255.255.255.128 (/25)", "255.255.255.192 (/26)", "255.255.255.224 (/27)", "255.255.255.240 (/28)"], a: 1, exp: "62 hôtes = 2^6 - 2, donc 6 bits d'hôte, /26 = 255.255.255.192." },
    { type: "input", q: "Combien de sous-réseaux obtient-on en découpant un /24 en /28 ? (2^b, b=4)", a: ["16"], ph: "un nombre", exp: "De 24 à 28 = 4 bits, 2^4 = 16 sous-réseaux." },
    { type: "qcm", q: "172.16.5.20/28 : quel est son sous-réseau ? (magique 16)", opts: ["172.16.5.0", "172.16.5.16", "172.16.5.32", "172.16.5.20"], a: 1, exp: "Blocs de 16 : 20 est entre 16 et 32, bloc 172.16.5.16." },
    { type: "input", q: "Broadcast du sous-réseau 172.16.5.16/28 ? (bloc suivant .32, moins 1)", a: ["172.16.5.31", "31"], ph: "une adresse", exp: "Bloc suivant .32 ; broadcast = 172.16.5.31." },
    { type: "vf", q: "192.168.1.64/26 a pour premier hôte utilisable 192.168.1.65.", a: true, exp: "Vrai : 1er hôte = adresse du sous-réseau + 1 = .65." },
    { type: "qcm", q: "Un lien point à point entre deux routeurs utilise idéalement quel préfixe ?", opts: ["/24", "/26", "/28", "/30"], a: 3, exp: "/30 offre exactement 2 hôtes, parfait pour relier 2 routeurs." },
    { type: "input", q: "10.0.0.0/24 découpé en 4 : combien d'hôtes par sous-réseau ? (/26)", a: ["62", "62 hotes"], ph: "un nombre", exp: "4 sous-réseaux = /26 = 2^6 - 2 = 62 hôtes." },
    { type: "qcm", q: "192.168.1.159/27 est…", opts: ["Le sous-réseau 192.168.1.128 comme premier hôte", "Le broadcast du sous-réseau 192.168.1.128", "Un hôte utilisable", "L'adresse réseau 192.168.1.160"], a: 1, exp: "Magique 32 : bloc .128 va de 128 à 159 ; 159 est le broadcast." }
  ],
  final: {
    title: "Exercice final — Plan d'adressage complet",
    intro: `<p>Une école dispose de <code>192.168.10.0/24</code> et veut <strong>4 sous-réseaux égaux</strong> : salle A, salle B, administration, Wi-Fi. Établis le plan complet.</p>`,
    questions: [
      { type: "qcm", q: "Quel préfixe et masque pour 4 sous-réseaux égaux ?", opts: ["/25 - 255.255.255.128", "/26 - 255.255.255.192", "/27 - 255.255.255.224", "/28 - 255.255.255.240"], a: 1, exp: "4 sous-réseaux = 2 bits empruntés = /26 = 255.255.255.192." },
      { type: "input", q: "Quel est le nombre magique (le pas) ? (256 - 192)", a: ["64"], ph: "un nombre", exp: "256 - 192 = 64." },
      { type: "input", q: "Combien d'hôtes utilisables par salle ? (2^6 - 2)", a: ["62", "62 hotes"], ph: "un nombre", exp: "h = 6, 2^6 - 2 = 62." },
      { type: "qcm", q: "Adresse réseau du 3e sous-réseau (administration) ?", opts: ["192.168.10.64", "192.168.10.96", "192.168.10.128", "192.168.10.192"], a: 2, exp: "Blocs 0,64,128,192 : le 3e est 192.168.10.128." },
      { type: "qcm", q: "Broadcast du 4e sous-réseau (Wi-Fi, bloc .192) ?", opts: ["192.168.10.223", "192.168.10.240", "192.168.10.254", "192.168.10.255"], a: 3, exp: "Dernier bloc .192 à .255 : broadcast = 192.168.10.255." }
    ],
    solution: `<pre class="pseudo"># 192.168.10.0/24  ->  4 sous-reseaux egaux
# 2 bits empruntes -> /26 (255.255.255.192) -> magique 64 -> 62 hotes chacun
# Salle A        : 192.168.10.0    hotes .1   a .62    broadcast .63
# Salle B        : 192.168.10.64   hotes .65  a .126   broadcast .127
# Administration : 192.168.10.128  hotes .129 a .190   broadcast .191
# Wi-Fi          : 192.168.10.192  hotes .193 a .254   broadcast .255
# Un routeur relie les 4 sous-reseaux ; le Wi-Fi peut etre filtre a part.</pre>
<p>Bravo : tu sais désormais bâtir un plan d'adressage complet, du préfixe au dernier broadcast. C'est le coeur du métier réseau.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "netip-j16", title: "Résoudre trois cas d'un coup", level: 3,
    statement: "Résous ces trois cas. Pour chacun, donne le <strong>sous-réseau</strong>, le <strong>broadcast</strong> et la <strong>plage d'hôtes utilisables</strong> : (1) <code>192.168.1.90/26</code>, (2) <code>10.0.0.45/27</code>, (3) <code>172.16.5.200/28</code>.",

    note: "Pour le cas 3 : 16 x 12 = 192 est le plus grand multiple de 16 sous 200 ; broadcast 192 + 16 - 1 = 207." }
  ]
};
</script>
