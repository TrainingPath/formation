var DAY = {
  num: 19,
  title: "La fragmentation et le TTL",
  subtitle: "Découper un paquet trop grand, et empêcher qu'il erre éternellement sur le réseau.",
  theory: `
<h3>1. La MTU : la taille maximale d'un paquet</h3>
<p>Chaque type de réseau impose une taille maximale aux paquets qu'il transporte. On l'appelle la <strong>MTU</strong> (en anglais <em>Maximum Transmission Unit</em>, « unité de transmission maximale »). Sur un réseau <strong>Ethernet</strong> classique, la MTU vaut <strong>1500 octets</strong>. Autrement dit, un paquet IP ne peut pas dépasser 1500 octets sur ce lien.</p>
<p>Compare cela à un tunnel routier avec une hauteur limite. Un camion trop haut ne passe pas tel quel : il faut soit un autre chemin, soit décharger et répartir la cargaison sur plusieurs véhicules plus bas. En réseau, cette « répartition » s'appelle la <strong>fragmentation</strong>.</p>
<h3>2. La fragmentation : découper pour faire passer</h3>
<p>Quand un paquet IP est plus grand que la MTU du prochain lien, il doit être <strong>fragmenté</strong> : découpé en plusieurs morceaux plus petits, chacun devenant un paquet IP à part entière avec sa propre en-tête. Trois champs de l'en-tête servent à ce puzzle :</p>
<pre class="pseudo"># Champs de fragmentation dans l'en-tete IPv4
Identifiant (ID)    -> meme valeur pour tous les fragments d'un paquet
Flags (drapeaux)    -> dont le bit MF "More Fragments" (encore des morceaux ?)
Fragment Offset     -> position du morceau dans le paquet d'origine</pre>
<p>Grâce à ces champs, la machine de <strong>destination</strong> peut remettre les fragments dans l'ordre et reconstituer le paquet original. Point important : le <strong>réassemblage</strong> se fait uniquement à l'arrivée, jamais par les routeurs intermédiaires.</p>
<div class="tip">Le bit <strong>DF</strong> (en anglais <em>Don't Fragment</em>, « ne pas fragmenter ») permet d'interdire la fragmentation. Si un paquet marqué DF est trop grand pour un lien, le routeur le jette et renvoie une erreur ICMP. C'est la base de la « découverte de la MTU du chemin » (Path MTU Discovery), qui trouve la plus petite MTU du trajet pour éviter de fragmenter.</div>
<h3>3. Le TTL : un compteur anti-boucle</h3>
<p>Nous l'avons croisé dans l'en-tête : le <strong>TTL</strong> (en anglais <em>Time To Live</em>, « durée de vie ») est un champ de <strong>8 bits</strong> (valeur de 0 à 255). Ce n'est pas une durée en secondes mais un <strong>nombre de sauts</strong> restants. À chaque routeur traversé, le TTL est <strong>décrémenté de 1</strong>.</p>
<p>Quand le TTL tombe à <strong>0</strong>, le routeur <strong>détruit le paquet</strong> et renvoie à l'expéditeur un message ICMP « <em>temps dépassé</em> » (Time Exceeded). Sans ce mécanisme, une erreur de routage pourrait faire tourner un paquet en <strong>boucle</strong> entre deux routeurs indéfiniment, saturant le réseau.</p>
<pre class="pseudo"># Voyage d'un paquet, TTL de depart = 64
PC -> routeur R1 : TTL 64 -> 63
   -> routeur R2 : TTL 63 -> 62
   -> routeur R3 : TTL 62 -> 61
   -> ... arrive a destination avec TTL = 61
# Si une boucle existait : R1 -> R2 -> R1 -> R2 ...
# le TTL descendrait a 0 et le paquet serait detruit : la boucle est cassee.</pre>
<div class="warn">Ne confonds pas fragmentation et TTL : la fragmentation concerne la TAILLE du paquet (le découper pour passer), le TTL concerne sa DURÉE DE VIE (l'empêcher de tourner en rond). Deux mécanismes indépendants, tous deux gérés par l'en-tête IP.</div>
<h3>4. Pourquoi on préfère éviter la fragmentation</h3>
<p>Fragmenter coûte cher : plus d'en-têtes à traiter, et si un seul fragment se perd, tout le paquet est perdu (il faut le retransmettre entier). C'est pourquoi les protocoles modernes essaient de connaître la MTU du chemin à l'avance et d'envoyer des paquets qui passent partout sans découpe. En IPv6, d'ailleurs, les routeurs ne fragmentent plus du tout : c'est la source qui adapte la taille.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># MTU = taille max d'un paquet sur un lien (Ethernet : 1500 octets)
# Fragmentation = decouper un paquet trop grand en morceaux
#   -> reassemble UNIQUEMENT a la destination
#   -> champs : Identifiant, Flags (MF/DF), Fragment Offset
# TTL = 8 bits (0-255), -1 par routeur, detruit a 0
#   -> role : empecher les boucles infinies (anti-boucle)</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie MTU ?", opts: ["Maximum Transmission Unit", "Multiple Transfer Utility", "Main Transport Unit", "Modular Transmission Unit"], a: 0, exp: "MTU = Maximum Transmission Unit : la taille maximale d'un paquet sur un lien." },
    { type: "input", q: "Quelle est la MTU classique d'un réseau Ethernet ? (en octets)", a: ["1500", "1500 octets"], ph: "un nombre", exp: "La MTU d'Ethernet standard est de 1500 octets." },
    { type: "qcm", q: "Que fait-on d'un paquet plus grand que la MTU du prochain lien ?", opts: ["On l'accélère", "On le fragmente (découpe en morceaux)", "On le chiffre", "On le supprime toujours"], a: 1, exp: "Un paquet trop grand est fragmenté : découpé en plusieurs paquets plus petits." },
    { type: "vf", q: "Le réassemblage des fragments se fait à chaque routeur intermédiaire.", a: false, exp: "Non : le réassemblage se fait uniquement à la machine de destination." },
    { type: "input", q: "Sur combien de bits est codé le champ TTL ?", a: ["8", "8 bits", "huit"], ph: "un nombre", exp: "Le TTL fait 8 bits (valeur de 0 à 255)." },
    { type: "qcm", q: "Que fait chaque routeur au TTL d'un paquet ?", opts: ["Il l'augmente de 1", "Il le décrémente de 1", "Il le double", "Il le remet à 255"], a: 1, exp: "Chaque routeur retire 1 au TTL. À 0, le paquet est détruit." },
    { type: "qcm", q: "À quoi sert principalement le TTL ?", opts: ["À chiffrer le paquet", "À empêcher un paquet de tourner en boucle à l'infini", "À fragmenter le paquet", "À choisir le port"], a: 1, exp: "Le TTL est une sécurité anti-boucle : il tombe à 0 si le paquet erre." },
    { type: "vf", q: "Le TTL est une durée exprimée en secondes.", a: false, exp: "Non : c'est un compteur de sauts (nombre de routeurs), pas un temps réel." },
    { type: "qcm", q: "Quel champ de l'en-tête identifie tous les fragments d'un même paquet ?", opts: ["Le TTL", "L'Identifiant (ID)", "Le checksum", "La version"], a: 1, exp: "L'Identifiant est identique pour tous les fragments d'un paquet d'origine." },
    { type: "input", q: "Un paquet part avec TTL=64 et traverse 4 routeurs. Quel TTL a-t-il à l'arrivée ? (chiffre)", a: ["60", "soixante"], ph: "un nombre", exp: "64 − 4 = 60. Chaque routeur retire 1." },
    { type: "qcm", q: "Que signifie le bit DF dans l'en-tête ?", opts: ["Data First", "Don't Fragment (ne pas fragmenter)", "Double Frame", "Default Flag"], a: 1, exp: "DF = Don't Fragment : interdit de fragmenter ce paquet." },
    { type: "vf", q: "Si un fragment se perd, il faut souvent retransmettre le paquet entier.", a: true, exp: "Oui : perdre un seul fragment invalide tout le paquet, d'où le coût de la fragmentation." },
    { type: "qcm", q: "Que renvoie un routeur quand le TTL atteint 0 ?", opts: ["Un paquet dupliqué", "Un message ICMP « temps dépassé »", "Rien", "Une adresse MAC"], a: 1, exp: "Le routeur détruit le paquet et renvoie un ICMP Time Exceeded à l'expéditeur." },
    { type: "input", q: "Quel bit indique « il reste encore des fragments après celui-ci » ? (sigle)", a: ["mf", "more fragments"], ph: "un sigle", exp: "MF = More Fragments : à 1, d'autres fragments suivent." },
    { type: "qcm", q: "Pourquoi cherche-t-on à éviter la fragmentation ?", opts: ["Elle est illégale", "Elle coûte cher et un fragment perdu perd tout le paquet", "Elle chiffre les données", "Elle augmente la MTU"], a: 1, exp: "Fragmenter multiplie les en-têtes et fragilise la livraison : un fragment perdu = paquet perdu." }
  ],
  final: {
    title: "Exercice final — Un gros paquet sur un lien limité",
    intro: `<p>Une machine veut envoyer un paquet IP de 4000 octets. Le premier lien est un Ethernet de MTU 1500 octets. Le paquet doit ensuite traverser 5 routeurs avant d'arriver, avec un TTL de départ de 64. Analysons son voyage.</p>`,
    questions: [
      { type: "qcm", q: "Le paquet de 4000 octets peut-il passer tel quel sur l'Ethernet (MTU 1500) ?", opts: ["Oui, sans problème", "Non, il dépasse la MTU et doit être fragmenté", "Oui, si le TTL est élevé", "Non, il est détruit définitivement"], a: 1, exp: "4000 > 1500 : le paquet dépasse la MTU et doit être fragmenté." },
      { type: "input", q: "Où les fragments seront-ils réassemblés ? (à la source ou à la destination)", a: ["destination", "a la destination", "à la destination", "la destination"], ph: "un mot", exp: "Le réassemblage se fait uniquement à la machine de destination." },
      { type: "qcm", q: "Quel champ de l'en-tete garde la meme valeur pour tous les fragments du paquet ?", opts: ["Le TTL", "L'Identifiant (ID)", "Le checksum", "L'IP destination"], a: 1, exp: "L'Identifiant est commun a tous les fragments d'un meme paquet, ce qui permet de les regrouper." },
      { type: "input", q: "Avec un TTL de départ de 64 et 5 routeurs traversés, quel TTL à l'arrivée ? (chiffre)", a: ["59", "cinquante-neuf"], ph: "un nombre", exp: "64 − 5 = 59." },
      { type: "vf", q: "Si une boucle de routage renvoyait sans cesse le paquet, le TTL finirait par atteindre 0 et le paquet serait détruit.", a: true, exp: "Oui : c'est précisément le rôle anti-boucle du TTL." }
    ],
    solution: `<pre class="pseudo"># 1) Taille : 4000 octets > MTU 1500 -> fragmentation en plusieurs morceaux
#    Chaque fragment porte le meme Identifiant ; le bit MF vaut 1 sauf pour le dernier.
# 2) Reassemblage : UNIQUEMENT a la destination.
# 3) TTL : 64 au depart, -1 par routeur.
#    Apres 5 routeurs : 64 - 5 = 59.
# 4) Une eventuelle boucle ferait tomber le TTL a 0 -> paquet detruit (anti-boucle).</pre>
<p>Taille (MTU/fragmentation) et durée de vie (TTL) sont deux garde-fous distincts de l'en-tête IP : l'un fait passer les gros paquets, l'autre empêche les paquets de tourner en rond.</p>`
  }
};
