<script>
var DAY = {
  num: 3,
  title: "IPv4 : la notation décimale pointée",
  subtitle: "Quatre nombres de 0 à 255 séparés par des points : comment lire et vérifier une adresse.",
  theory: `
<h3>1. IPv4 : 32 bits présentés en quatre morceaux</h3>
<p>La version d'adressage la plus répandue s'appelle <strong>IPv4</strong> (en anglais <em>Internet Protocol version 4</em>). Une adresse IPv4 tient sur <strong>32 bits</strong>, c'est-à-dire 32 chiffres binaires (des 0 et des 1). Écrire trente-deux 0 et 1 à la suite serait illisible : on découpe donc ces 32 bits en <strong>quatre groupes de 8 bits</strong>. Un groupe de 8 bits porte un nom : un <strong>octet</strong> (en anglais <em>byte</em>, ou plus précisément <em>octet</em>).</p>
<pre class="pseudo"># Une adresse IPv4 = 32 bits = 4 octets de 8 bits chacun
11000000 . 10101000 . 00000001 . 00001010
[octet 1] [octet 2] [octet 3] [octet 4]
4 x 8 = 32 bits au total.</pre>
<h3>2. La notation décimale pointée</h3>
<p>Pour rendre l'adresse lisible par un humain, on convertit chaque octet en <strong>nombre décimal</strong> (base 10, nos chiffres habituels) et on sépare les quatre nombres par des points. C'est la <strong>notation décimale pointée</strong> (en anglais <em>dotted-decimal notation</em>).</p>
<pre class="pseudo"># Le meme exemple, converti en decimal :
11000000 = 192
10101000 = 168
00000001 = 1
00001010 = 10
-> notation decimale pointee : 192.168.1.10</pre>
<p>Chaque nombre entre les points s'appelle aussi un octet. On parle du « premier octet », du « deuxième octet », etc. Dans <strong>192.168.1.10</strong>, le premier octet vaut 192, le dernier vaut 10.</p>
<div class="tip">Une adresse IPv4 comporte toujours exactement quatre octets, donc trois points. Si tu comptes deux points ou cinq nombres, ce n'est pas une IPv4 valide.</div>
<h3>3. Pourquoi chaque octet va de 0 à 255</h3>
<p>Un octet, c'est 8 bits. Avec 8 bits, on peut représenter 2 puissance 8 = <strong>256</strong> combinaisons différentes. Comme on commence à compter à zéro, ces 256 valeurs vont de <strong>0 à 255</strong>. Voilà la règle d'or de l'IPv4 : <strong>chaque octet est un nombre entier compris entre 0 et 255 inclus</strong>.</p>
<pre class="pseudo"># Bornes d'un octet :
00000000 = 0     (tous les bits a 0 : la plus petite valeur)
11111111 = 255   (tous les bits a 1 : la plus grande valeur)
Donc 0 <= octet <= 255. Il n'existe pas d'octet a 256 ou 300.</pre>
<h3>4. Reconnaître une adresse valide ou non</h3>
<p>Pour vérifier qu'une écriture est une IPv4 correcte, deux conditions simples : il faut <strong>quatre octets séparés par des points</strong>, et <strong>chaque octet doit être entre 0 et 255</strong>. Entraînons-nous :</p>
<pre class="pseudo"># Valides :
0.0.0.0            (le minimum absolu)
192.168.1.10       (adresse privee tres courante)
255.255.255.255    (le maximum absolu)
10.0.0.1

# INVALIDES :
192.168.1.256      -> 256 depasse 255 (interdit)
10.0.0             -> seulement 3 octets (il en faut 4)
192.168.1.1.5      -> 5 octets (il en faut 4)
300.1.1.1          -> 300 depasse 255</pre>
<div class="warn">Erreur fréquente : croire qu'un octet peut aller jusqu'à 256. Non : la valeur maximale est 255. On compte 256 valeurs, mais de 0 à 255.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># IPv4 = 32 bits = 4 octets (4 groupes de 8 bits).
# Notation decimale pointee : 4 nombres separes par 3 points.
# Chaque octet (8 bits) : 2^8 = 256 valeurs -> de 0 a 255 inclus.
# Valide = 4 octets, chacun entre 0 et 255.
# Ex : 192.168.1.10 (valide)  |  192.168.1.256 (INVALIDE).</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits tient une adresse IPv4 ?", opts: ["8 bits", "16 bits", "32 bits", "64 bits"], a: 2, exp: "Une adresse IPv4 tient sur 32 bits, découpés en 4 octets de 8 bits." },
    { type: "qcm", q: "Combien d'octets compose une adresse IPv4 ?", opts: ["2", "3", "4", "8"], a: 2, exp: "Quatre octets, séparés par trois points en notation décimale pointée." },
    { type: "input", q: "Comment appelle-t-on un groupe de 8 bits ?", a: ["octet", "un octet", "byte"], ph: "un mot", exp: "Un groupe de 8 bits est un octet (en anglais byte)." },
    { type: "qcm", q: "Quelle est la valeur maximale d'un octet dans une adresse IPv4 ?", opts: ["127", "255", "256", "999"], a: 1, exp: "Un octet va de 0 à 255. La valeur 256 est interdite." },
    { type: "vf", q: "L'adresse 192.168.1.256 est une adresse IPv4 valide.", a: false, exp: "Non : 256 dépasse 255. Chaque octet doit rester entre 0 et 255." },
    { type: "input", q: "Combien de valeurs différentes peut prendre un octet (8 bits) ? (donne le nombre)", a: ["256", "2^8", "2 puissance 8"], ph: "un nombre", exp: "2 puissance 8 = 256 combinaisons, soit les valeurs de 0 à 255." },
    { type: "qcm", q: "Combien de points sépare les octets d'une adresse IPv4 ?", opts: ["2", "3", "4", "5"], a: 1, exp: "Quatre octets sont séparés par trois points." },
    { type: "vf", q: "L'adresse 10.0.0 est une adresse IPv4 correcte.", a: false, exp: "Non : il n'y a que trois octets. Une IPv4 en compte quatre." },
    { type: "input", q: "Quel est le premier octet de l'adresse 172.16.254.1 ?", a: ["172"], ph: "un nombre", exp: "Le premier octet est 172, le dernier est 1." },
    { type: "qcm", q: "Comment s'appelle la façon d'écrire une IPv4 avec quatre nombres décimaux et des points ?", opts: ["Notation binaire", "Notation hexadécimale", "Notation décimale pointée", "Notation scientifique"], a: 2, exp: "C'est la notation décimale pointée (dotted-decimal notation)." },
    { type: "vf", q: "L'adresse 255.255.255.255 respecte la règle des octets entre 0 et 255.", a: true, exp: "Oui : chaque octet vaut 255, la valeur maximale autorisée." },
    { type: "input", q: "Quelle est la plus petite valeur possible pour un octet ?", a: ["0", "zero", "zéro"], ph: "un nombre", exp: "La plus petite valeur d'un octet est 0 (les 8 bits à 0)." },
    { type: "qcm", q: "Laquelle de ces adresses est INVALIDE ?", opts: ["0.0.0.0", "192.168.0.1", "300.1.1.1", "255.255.255.0"], a: 2, exp: "300 dépasse 255 : cet octet est interdit. Les trois autres sont valides." },
    { type: "qcm", q: "Pourquoi un octet s'arrête-t-il à 255 et pas à 256 ?", opts: ["Par choix arbitraire", "Parce qu'on compte 256 valeurs à partir de 0, donc jusqu'à 255", "Parce que 256 est un nombre porte-malheur", "Parce que les points l'interdisent"], a: 1, exp: "8 bits donnent 256 valeurs, mais numérotées de 0 à 255." },
    { type: "input", q: "Combien de bits contient chaque octet ?", a: ["8", "huit"], ph: "un nombre", exp: "Chaque octet contient 8 bits. Quatre octets font 32 bits." }
  ],
  final: {
    title: "Exercice final — Le tri des adresses",
    intro: `<p>Sur un cahier, un stagiaire a noté cinq écritures censées être des adresses IPv4 : <code>192.168.1.10</code>, <code>10.0.0.256</code>, <code>172.16.5</code>, <code>0.0.0.0</code>, <code>255.255.255.255</code>. Aidons-le à séparer le bon grain de l'ivraie.</p>`,
    questions: [
      { type: "qcm", q: "Combien d'octets doit contenir chaque adresse IPv4 valide ?", opts: ["2", "3", "4", "6"], a: 2, exp: "Toujours quatre octets, séparés par trois points." },
      { type: "vf", q: "10.0.0.256 est une adresse valide.", a: false, exp: "Non : 256 dépasse la valeur maximale 255 d'un octet." },
      { type: "vf", q: "172.16.5 est une adresse valide.", a: false, exp: "Non : il n'y a que trois octets, il en faut quatre." },
      { type: "input", q: "Parmi les cinq, cite une adresse parfaitement valide (une seule suffit).", a: ["192.168.1.10", "0.0.0.0", "255.255.255.255"], ph: "une adresse", exp: "192.168.1.10, 0.0.0.0 et 255.255.255.255 sont toutes valides." },
      { type: "qcm", q: "Quelle est la bonne borne pour chaque octet ?", opts: ["De 1 à 256", "De 0 à 255", "De 0 à 256", "De 1 à 255"], a: 1, exp: "Chaque octet va de 0 à 255 inclus." }
    ],
    solution: `<pre class="pseudo"># Verdict du tri :
192.168.1.10      -> VALIDE  (4 octets, tous entre 0 et 255)
10.0.0.256        -> INVALIDE (256 > 255)
172.16.5          -> INVALIDE (3 octets seulement)
0.0.0.0           -> VALIDE  (minimum absolu)
255.255.255.255   -> VALIDE  (maximum absolu)

# Regle : 4 octets separes par 3 points, chacun de 0 a 255.</pre>
<p>Tu sais désormais lire et vérifier une IPv4. Mais d'où viennent ces nombres ? Demain, on plonge dans le binaire pour comprendre comment 11000000 devient 192.</p>`
  }
};
</script>
