<title>Jour 10</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 10,
  title: "La notation CIDR (/24)",
  subtitle: "Le petit slash qui a sauvé Internet : compter les bits de réseau soi-même.",
  theory: `
<h3>1. Le problème que le CIDR résout</h3>
<p>Les classes A, B, C imposaient des frontières figées : 8, 16 ou 24 bits. Trop rigide, trop de gaspillage. En 1993, on invente le <strong>CIDR</strong> (Classless Inter-Domain Routing, « routage inter-domaines sans classe »). Son idée est simple : au lieu de deviner la taille du réseau d'après le premier octet, on l'<strong>écrit noir sur blanc</strong> juste après l'adresse, avec un slash et un nombre.</p>
<p>Exemple : <strong>192.168.1.0/24</strong>. Le <strong>/24</strong> se lit « slash vingt-quatre » et signifie : « les <strong>24 premiers bits</strong> sont la partie réseau ; le reste, ici 8 bits, est pour les machines ». Ce nombre après le slash s'appelle le <strong>préfixe</strong> (prefix length).</p>
<h3>2. Préfixe = nombre de bits réseau</h3>
<p>Rappel : une adresse fait 32 bits. Le préfixe dit combien de ces bits, en partant de la gauche, sont fixés pour le réseau. Ce qui reste sert aux hôtes.</p>
<pre class="pseudo"># 192.168.1.42 /24
# 11000000.10101000.00000001 . 00101010
# |------- 24 bits reseau ------| 8 bits hote
#
# Prefixe /24  -> 32 - 24 = 8 bits pour les hotes
# Prefixe /16  -> 32 - 16 = 16 bits pour les hotes
# Prefixe /8   -> 32 - 8  = 24 bits pour les hotes</pre>
<div class="tip">Formule d'or : <strong>bits d'hôte = 32 - préfixe</strong>. Et le nombre d'hôtes utilisables = <strong>2^(bits d'hôte) - 2</strong> (on retire l'adresse de réseau et celle de diffusion, vues plus tard).</div>
<h3>3. Le masque, autre visage du même nombre</h3>
<p>Le préfixe CIDR et le <strong>masque de sous-réseau</strong> (subnet mask) disent exactement la même chose de deux façons. Le masque écrit en toutes lettres les bits réseau (des 1) puis les bits hôte (des 0). Correspondances à connaître par coeur :</p>
<pre class="pseudo"># /8   = 255.0.0.0
# /16  = 255.255.0.0
# /24  = 255.255.255.0
# /25  = 255.255.255.128
# /26  = 255.255.255.192
# /30  = 255.255.255.252
# /32  = 255.255.255.255  (une seule machine, l'adresse elle-meme)</pre>
<p>Le grand avantage : le CIDR permet <strong>n'importe quel préfixe de 0 à 32</strong>, pas seulement 8, 16, 24. On peut donc tailler un réseau sur mesure : /26 pour 62 hôtes, /30 pour un lien entre deux routeurs (2 hôtes). Fini le gaspillage des classes.</p>
<h3>4. Lire et comparer des préfixes</h3>
<p>Attention à l'intuition : un <strong>grand</strong> préfixe fait un <strong>petit</strong> réseau. Un /30 a plus de bits réseau, donc très peu de bits hôte, donc peu de machines. Un /8 a peu de bits réseau, donc beaucoup de bits hôte, donc un réseau immense. Plus le nombre après le slash est grand, plus le réseau est petit.</p>
<div class="warn">Erreur classique : croire que /24 c'est « la classe C ». Non ! /24 est juste « 24 bits réseau ». On peut avoir un /24 sur des adresses commençant par 10 (donc « classe A » historiquement). Le CIDR ignore complètement le premier octet.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CIDR : adresse/prefixe  ->  192.168.1.0/24
# Prefixe = nombre de bits RESEAU (a gauche)
# Bits d'hote = 32 - prefixe
# Hotes utilisables = 2^(bits hote) - 2
# Grand prefixe = PETIT reseau  |  petit prefixe = GRAND reseau
# /24 = 255.255.255.0 (memoriser aussi /25, /26, /30)</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie le /24 dans 192.168.1.0/24 ?", opts: ["24 machines maximum", "Les 24 premiers bits sont la partie réseau", "L'adresse se termine par 24", "24 réseaux"], a: 1, exp: "Le préfixe /24 = 24 bits réseau (à gauche). Restent 8 bits pour les hôtes." },
    { type: "input", q: "Combien de bits restent pour les hôtes avec un préfixe /24 ? (formule 32 - préfixe)", a: ["8", "8 bits"], ph: "un nombre", exp: "32 - 24 = 8 bits pour les hôtes." },
    { type: "qcm", q: "Comment appelle-t-on le nombre écrit après le slash ?", opts: ["Le masque", "Le préfixe (prefix length)", "L'octet", "La passerelle"], a: 1, exp: "C'est le préfixe, ou longueur de préfixe (prefix length)." },
    { type: "qcm", q: "Quel masque correspond à /16 ?", opts: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.192"], a: 1, exp: "/16 = 16 bits réseau = 255.255.0.0." },
    { type: "vf", q: "Un préfixe /30 correspond à un réseau plus petit qu'un /24.", a: true, exp: "Vrai : plus le préfixe est grand, plus il reste peu de bits d'hôte, donc réseau plus petit." },
    { type: "input", q: "Quel masque (255.x) correspond au préfixe /8 ?", a: ["255.0.0.0"], ph: "255.x.x.x", exp: "/8 = 8 bits réseau = 255.0.0.0." },
    { type: "qcm", q: "En quelle année le CIDR a-t-il commencé à remplacer les classes ?", opts: ["1983", "1993", "2003", "2013"], a: 1, exp: "Le CIDR est introduit en 1993 pour freiner l'épuisement des adresses IPv4." },
    { type: "vf", q: "Le CIDR permet seulement les préfixes /8, /16 et /24.", a: false, exp: "Faux : le CIDR autorise tout préfixe de 0 à 32 (ex: /26, /30). C'est justement son intérêt." },
    { type: "input", q: "Quel préfixe (notation /xx) correspond au masque 255.255.255.0 ?", a: ["/24", "24"], ph: "ex: /16", exp: "255.255.255.0 = 24 bits à 1 = /24." },
    { type: "qcm", q: "Que veut dire l'acronyme CIDR ?", opts: ["Classless Inter-Domain Routing", "Class Identifier Data Range", "Computer Internet Domain Router", "Central IP Directory Record"], a: 0, exp: "CIDR = Classless Inter-Domain Routing (routage inter-domaines sans classe)." },
    { type: "vf", q: "Un préfixe /32 désigne une seule adresse (une machine précise).", a: true, exp: "Vrai : /32 = les 32 bits fixés, il ne reste aucun bit d'hôte : une seule adresse." },
    { type: "qcm", q: "10.0.0.0/24 : est-ce possible ?", opts: ["Non, 10 est de classe A donc obligatoirement /8", "Oui, le CIDR ignore le premier octet et autorise /24", "Non, /24 est réservé aux 192", "Oui mais seulement sur IPv6"], a: 1, exp: "Le CIDR est classless : on peut mettre /24 sur des adresses en 10.x. Le premier octet n'impose plus rien." },
    { type: "input", q: "Combien de bits réseau a le préfixe /26 ? (écris le nombre)", a: ["26", "26 bits"], ph: "un nombre", exp: "Le préfixe indique directement le nombre de bits réseau : 26." },
    { type: "qcm", q: "Formule pour trouver le nombre d'hôtes utilisables ?", opts: ["2^préfixe", "2^(32-préfixe) - 2", "préfixe - 2", "256 - préfixe"], a: 1, exp: "Hôtes utilisables = 2^(bits d'hôte) - 2, avec bits d'hôte = 32 - préfixe." },
    { type: "qcm", q: "Lequel de ces réseaux est le PLUS GRAND (le plus de machines) ?", opts: ["/30", "/26", "/24", "/16"], a: 3, exp: "Petit préfixe = grand réseau. /16 laisse 16 bits d'hôte, de loin le plus grand." }
  ],
  final: {
    title: "Exercice final — Traduire entre CIDR et masque",
    intro: `<p>Un administrateur reçoit ce plan d'adressage : le réseau du service compta est <code>192.168.10.0/26</code>. Il doit en déduire les caractéristiques avant de configurer les postes.</p>`,
    questions: [
      { type: "input", q: "Combien de bits sont réservés aux hôtes dans un /26 ? (32 - préfixe)", a: ["6", "6 bits"], ph: "un nombre", exp: "32 - 26 = 6 bits d'hôte." },
      { type: "qcm", q: "Combien d'hôtes utilisables dans un /26 ?", opts: ["30", "62", "126", "254"], a: 1, exp: "2^6 - 2 = 64 - 2 = 62 hôtes utilisables." },
      { type: "input", q: "Quel masque (255.x) correspond au préfixe /24 (pour comparaison) ?", a: ["255.255.255.0"], ph: "255.x.x.x", exp: "/24 = 255.255.255.0. Le /26 sera 255.255.255.192." },
      { type: "vf", q: "Le /26 fournit plus d'adresses d'hôtes que le /24.", a: false, exp: "Faux : /26 (62 hôtes) est plus petit que /24 (254 hôtes). Grand préfixe = petit réseau." },
      { type: "qcm", q: "Le fait de pouvoir choisir /26 au lieu d'un /24 imposé illustre surtout…", opts: ["La rigidité des classes", "La souplesse du CIDR (taille sur mesure)", "Un bug de configuration", "L'obligation d'utiliser IPv6"], a: 1, exp: "Le CIDR permet de tailler le réseau au plus juste, ce qui évite le gaspillage des classes." }
    ],
    solution: `<pre class="pseudo"># 192.168.10.0/26
# Prefixe = 26 bits reseau  ->  bits d'hote = 32 - 26 = 6
# Hotes utilisables = 2^6 - 2 = 62
# Masque = 255.255.255.192
# Comparaison : /24 = 254 hotes, /26 = 62 hotes (plus petit)
# CIDR = on choisit la taille exacte au lieu de subir une classe.</pre>
<p>Tu sais lire un préfixe et le convertir en masque. Demain : les adresses privées, celles que tu utilises chez toi sans le savoir.</p>`
  }
};
</script>
