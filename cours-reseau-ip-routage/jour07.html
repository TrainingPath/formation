<script>
var DAY = {
  num: 7,
  title: "Calculer l'adresse de réseau",
  subtitle: "Le ET logique bit à bit : combiner l'adresse et le masque pour trouver le réseau.",
  theory: `
<h3>1. L'objectif du jour</h3>
<p>Nous savons qu'une adresse a une partie réseau et une partie machine, et que le masque indique la coupure. Maintenant, calculons concrètement l'<strong>adresse de réseau</strong> (en anglais <em>network address</em>) : l'adresse qui identifie le réseau lui-même, obtenue en mettant tous les bits machine à 0. La méthode officielle pour l'obtenir est une opération entre l'adresse et le masque, appelée le <strong>ET logique</strong> (en anglais <em>bitwise AND</em>).</p>
<h3>2. La règle du ET logique</h3>
<p>Le ET logique compare deux bits et n'en garde le résultat 1 que si les <strong>deux</strong> bits valent 1. Dans tous les autres cas, le résultat est 0. C'est un « et » exigeant : il faut l'un ET l'autre.</p>
<pre class="pseudo"># Table du ET logique (bit a bit)
0 ET 0 = 0
0 ET 1 = 0
1 ET 0 = 0
1 ET 1 = 1     <- seul cas ou le resultat vaut 1</pre>
<div class="tip">Moyen mnémotechnique : le ET logique agit comme un videur très strict. Il ne laisse passer un 1 que si l'adresse ET le masque disent tous les deux « 1 ». Un seul 0 suffit à mettre le résultat à 0.</div>
<h3>3. Pourquoi ça donne l'adresse de réseau</h3>
<p>Souviens-toi du masque : ses bits réseau valent 1, ses bits machine valent 0. Faisons le ET logique entre l'adresse et le masque :</p>
<pre class="pseudo"># Sur les bits RESEAU, le masque vaut 1 :
bit_adresse ET 1 = bit_adresse    -> le bit de l'adresse est CONSERVE.

# Sur les bits MACHINE, le masque vaut 0 :
bit_adresse ET 0 = 0              -> le bit de l'adresse est REMIS A ZERO.</pre>
<p>Résultat : le ET logique <strong>garde intacte la partie réseau</strong> et <strong>met à zéro toute la partie machine</strong>. Or « partie machine à zéro » est exactement la définition de l'adresse de réseau. Le ET logique fait donc automatiquement le travail.</p>
<h3>4. Un calcul complet, étape par étape</h3>
<p>Calculons l'adresse de réseau pour <strong>192.168.1.10</strong> avec le masque <strong>255.255.255.0</strong>. On convertit tout en binaire, on aligne, on applique le ET colonne par colonne, puis on reconvertit en décimal.</p>
<pre class="pseudo"># Etape 1 : convertir en binaire
Adresse : 11000000.10101000.00000001.00001010   (192.168.1.10)
Masque  : 11111111.11111111.11111111.00000000   (255.255.255.0)

# Etape 2 : ET logique colonne par colonne
Reseau  : 11000000.10101000.00000001.00000000

# Etape 3 : reconvertir en decimal
11000000=192  10101000=168  00000001=1  00000000=0
-> Adresse de reseau : 192.168.1.0</pre>
<p>Astuce pratique : quand le masque est aligné sur l'octet (255 ou 0), pas besoin de binaire ! Là où le masque vaut <strong>255</strong>, on recopie l'octet de l'adresse ; là où il vaut <strong>0</strong>, on met 0. Ainsi 192.168.1.10 avec 255.255.255.0 donne directement 192.168.1.0.</p>
<pre class="pseudo"># Raccourci pour masques 255/0 :
Adresse : 192 . 168 . 1 . 10
Masque  : 255 . 255 .255. 0
Reseau  : 192 . 168 . 1 . 0     (recopie si 255, met 0 si 0)</pre>
<div class="warn">Le ET logique se fait bit à bit, colonne par colonne. Ne fais pas un « ET » sur les nombres décimaux entiers (192 ET 255 n'a pas de sens en décimal). Convertis d'abord en binaire, ou utilise le raccourci 255/0.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Adresse de reseau = adresse ET masque (bit a bit).
# Table du ET : 1 ET 1 = 1 ; tout le reste = 0.
# Effet : garde la partie reseau, met la partie machine a 0.
# Ex : 192.168.1.10 ET 255.255.255.0 = 192.168.1.0.
# Raccourci masque aligne : recopie l'octet si 255, mets 0 si 0.</pre>`,

    { type: "qcm", q: "Que calcule le ET logique entre une adresse et son masque ?", opts: ["L'adresse de diffusion", "L'adresse de réseau", "L'adresse MAC", "Le nombre d'octets"], a: 1, exp: "Le ET logique entre adresse et masque donne l'adresse de réseau." },
    { type: "qcm", q: "Combien vaut 1 ET 1 ?", opts: ["0", "1", "2", "11"], a: 1, exp: "1 ET 1 = 1, le seul cas où le ET logique donne 1." },
    { type: "input", q: "Combien vaut 1 ET 0 ?", a: ["0", "zero", "zéro"], ph: "0 ou 1", exp: "1 ET 0 = 0 : il faut deux 1 pour obtenir 1." },
    { type: "vf", q: "Le ET logique donne 1 seulement si les deux bits valent 1.", a: true, exp: "Oui : c'est la règle. Tout autre cas donne 0." },
    { type: "qcm", q: "Sur les bits machine, le masque vaut 0. Quel est l'effet du ET logique ?", opts: ["Il conserve les bits machine", "Il met les bits machine à 0", "Il les met tous à 1", "Il les inverse"], a: 1, exp: "bit ET 0 = 0 : la partie machine est remise à zéro." },
    { type: "input", q: "Quelle est l'adresse de réseau de 192.168.1.10 avec le masque 255.255.255.0 ?", a: ["192.168.1.0"], ph: "une adresse", exp: "Le ET logique met le dernier octet à 0 : 192.168.1.0." },
    { type: "vf", q: "Sur les bits réseau (masque à 1), le ET logique conserve la valeur de l'adresse.", a: true, exp: "Oui : bit ET 1 = bit. La partie réseau est conservée intacte." },
    { type: "qcm", q: "Pour un masque aligné sur l'octet, le raccourci consiste à…", opts: ["Recopier l'octet quand le masque vaut 255, mettre 0 quand il vaut 0", "Toujours mettre 255", "Inverser tous les octets", "Additionner adresse et masque"], a: 0, exp: "255 -> on recopie l'octet ; 0 -> on met 0. Pas besoin de binaire." },
    { type: "input", q: "Quelle est l'adresse de réseau de 10.20.30.40 avec le masque 255.255.255.0 ?", a: ["10.20.30.0"], ph: "une adresse", exp: "Les trois premiers octets recopiés, le dernier à 0 : 10.20.30.0." },
    { type: "qcm", q: "Combien vaut 0 ET 1 ?", opts: ["1", "0", "2", "impossible"], a: 1, exp: "0 ET 1 = 0 : un seul 0 suffit à donner 0." },
    { type: "input", q: "Quelle est l'adresse de réseau de 172.16.5.100 avec le masque 255.255.0.0 ?", a: ["172.16.0.0"], ph: "une adresse", exp: "255.255.0.0 : on garde 172.16, on met 0 aux deux derniers octets : 172.16.0.0." },
    { type: "vf", q: "On peut faire le ET logique directement sur les nombres décimaux, sans passer par le binaire.", a: false, exp: "Non : le ET est bit à bit. On convertit en binaire, ou on utilise le raccourci 255/0 pour les masques alignés." },
    { type: "qcm", q: "L'adresse de réseau se caractérise par…", opts: ["Tous les bits machine à 1", "Tous les bits machine à 0", "Tous les bits réseau à 0", "Une partie machine aléatoire"], a: 1, exp: "L'adresse de réseau a tous ses bits machine à 0." },
    { type: "input", q: "Quelle est l'adresse de réseau de 50.60.70.80 avec le masque 255.0.0.0 ?", a: ["50.0.0.0"], ph: "une adresse", exp: "255.0.0.0 : on garde le premier octet, 0 aux trois autres : 50.0.0.0." },
    { type: "qcm", q: "Pourquoi le ET logique met-il la partie machine à 0 ?", opts: ["Parce que le masque a des 1 sur la partie machine", "Parce que le masque a des 0 sur la partie machine, et bit ET 0 = 0", "Parce qu'il additionne les octets", "Par hasard"], a: 1, exp: "Les bits machine du masque valent 0, et n'importe quel bit ET 0 donne 0." }
  ],
  final: {
    title: "Exercice final — Trouver le réseau d'un poste",
    intro: `<p>Un poste porte l'adresse <code>192.168.10.130</code> avec le masque <code>255.255.255.0</code>. L'administrateur veut connaître l'adresse de réseau exacte de ce poste pour vérifier sa configuration.</p>`,
    questions: [
      { type: "qcm", q: "Quelle opération donne l'adresse de réseau ?", opts: ["Adresse OU masque", "Adresse ET masque", "Adresse + masque", "Adresse - masque"], a: 1, exp: "C'est le ET logique bit à bit entre l'adresse et le masque." },
      { type: "input", q: "Avec le raccourci 255/0, que devient le dernier octet (130) après le ET avec 0 ?", a: ["0", "zero", "zéro"], ph: "un nombre", exp: "Masque 0 sur cet octet : bit ET 0 = 0, donc l'octet devient 0." },
      { type: "input", q: "Quelle est l'adresse de réseau complète de 192.168.10.130 / 255.255.255.0 ?", a: ["192.168.10.0"], ph: "une adresse", exp: "On recopie 192.168.10 et on met 0 : 192.168.10.0." },
      { type: "vf", q: "Le poste 192.168.10.200 (même masque) appartient au même réseau que 192.168.10.130.", a: true, exp: "Oui : les deux ont pour adresse de réseau 192.168.10.0." },
      { type: "qcm", q: "Que vaut la partie machine dans l'adresse de réseau obtenue ?", opts: ["255", "130", "0", "1"], a: 2, exp: "L'adresse de réseau a toujours sa partie machine à 0." }
    ],
    solution: `<pre class="pseudo"># 192.168.10.130 ET 255.255.255.0
Adresse : 11000000.10101000.00001010.10000010   (192.168.10.130)
Masque  : 11111111.11111111.11111111.00000000   (255.255.255.0)
ET       ------------------------------------
Reseau  : 11000000.10101000.00001010.00000000
        = 192.168.10.0

# Raccourci : recopier 192.168.10 (masque 255), mettre 0 (masque 0).</pre>
<p>Tu sais trouver le réseau. Il reste à connaître ses adresses spéciales et sa plage utilisable : c'est le programme du jour 8.</p>`
  }
};
