var DAY = {

  title: "Le masque de sous-réseau",
  subtitle: "L'outil qui indique où finit le réseau et où commence la machine.",
  theory: `
<h3>1. Le problème que résout le masque</h3>
<p>Hier, on a vu qu'une adresse se coupe en partie réseau et partie machine, mais qu'on ne savait pas <em>où</em> tombe la coupure. C'est précisément le rôle du <strong>masque de sous-réseau</strong> (en anglais <em>subnet mask</em>). Le masque est une seconde valeur, de la même forme qu'une adresse IPv4 (32 bits, quatre octets), qui accompagne toujours une adresse. Son seul travail : dire quels bits appartiennent au réseau et quels bits appartiennent à la machine.</p>
<div class="tip">Une adresse IP ne veut rien dire toute seule : elle vient toujours en couple avec un masque. Sans le masque, impossible de savoir où s'arrête le réseau. C'est comme un numéro sans savoir de quelle rue il s'agit.</div>
<h3>2. Comment le masque désigne les bits</h3>
<p>Le principe est limpide en binaire. Dans le masque, un <strong>bit à 1 signifie « ce bit appartient au réseau »</strong>, et un <strong>bit à 0 signifie « ce bit appartient à la machine »</strong>. Les 1 sont toujours groupés à gauche, les 0 à droite : on ne mélange jamais.</p>
<pre class="pseudo"># Masque en binaire : des 1 (reseau) puis des 0 (machine)
11111111.11111111.11111111.00000000
[------- reseau (1) ------][machine (0)]
Ici : 24 bits a 1 (reseau) et 8 bits a 0 (machine).</pre>
<h3>3. La notation 255.255.255.0</h3>
<p>Comme tout octet plein de 1 vaut 255, le masque le plus courant s'écrit <strong>255.255.255.0</strong> en décimal. Il signifie : les trois premiers octets sont le réseau, le dernier octet est la machine. C'est le masque des petits réseaux classiques (bureau, maison).</p>
<pre class="pseudo"># Conversion du masque 255.255.255.0
11111111 = 255   -> octet reseau
11111111 = 255   -> octet reseau
11111111 = 255   -> octet reseau
00000000 =   0   -> octet machine
Donc 255.255.255.0 : 3 octets reseau, 1 octet machine.</pre>
<p>D'autres masques existent. Voici les plus simples, dits « alignés sur l'octet » :</p>
<pre class="pseudo"># Masques les plus lisibles :
255.0.0.0        -> 1 octet reseau , 3 octets machine  (8 bits reseau)
255.255.0.0      -> 2 octets reseau, 2 octets machine  (16 bits reseau)
255.255.255.0    -> 3 octets reseau, 1 octet machine   (24 bits reseau)
Plus il y a de 255, plus la partie reseau est grande (et la partie machine petite).</pre>
<h3>4. Lire une paire adresse + masque</h3>
<p>Avec le couple <strong>192.168.1.10</strong> et masque <strong>255.255.255.0</strong>, on lit immédiatement : partie réseau = 192.168.1, partie machine = 10. Le masque agit comme un pochoir posé sur l'adresse : là où le masque est « plein » (255), on garde le réseau ; là où il est « vide » (0), c'est la machine.</p>
<pre class="pseudo"># Le masque comme pochoir sur l'adresse
Adresse : 192.168.1.10
Masque  : 255.255.255.0
           ^^^ ^^^ ^^^  ^   -> 255,255,255 = reseau ; 0 = machine
Lecture : reseau = 192.168.1 , machine = 10</pre>
<div class="warn">Un masque valide a toujours ses 1 groupés à gauche sans interruption : 255.255.255.0 est valide, mais 255.0.255.0 ne l'est pas (les 1 et 0 sont mélangés). Retiens : que des 1, puis que des 0.</div>
<h3>5. À quoi ça va servir (aperçu)</h3>
<p>Le masque n'est pas décoratif : il permet à chaque machine de calculer l'<strong>adresse de réseau</strong> et donc de savoir si un correspondant est « dans le même réseau » (livraison directe) ou « ailleurs » (passer par le routeur). Ce calcul, une opération bit à bit appelée <strong>ET logique</strong>, est l'objet du jour 7.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Masque = 32 bits qui disent : bit reseau (1) ou bit machine (0).
# Les 1 sont groupes a gauche, les 0 a droite. Jamais melanges.
# 255.255.255.0 = 3 octets reseau + 1 octet machine (le plus courant).
# 255.0.0.0 (8 bits) | 255.255.0.0 (16 bits) | 255.255.255.0 (24 bits).
# Une adresse va TOUJOURS avec un masque : sans lui, on ignore la coupure.</pre>`,

    { type: "qcm", q: "Combien d'octets réseau donne le masque 255.0.0.0 ?", opts: ["1", "2", "3", "4"], a: 0, exp: "Un seul octet à 255 = 1 octet réseau, les trois autres pour la machine." },
    { type: "qcm", q: "Plus un masque contient de 255…", opts: ["Plus la partie machine est grande", "Plus la partie réseau est grande", "Moins il y a de réseau", "Rien ne change"], a: 1, exp: "Chaque 255 ajoute des bits réseau, donc agrandit la partie réseau (et réduit la partie machine)." },
    { type: "input", q: "Quelle image décrit bien le masque : un « ______ » posé sur l'adresse pour garder le réseau ?", a: ["pochoir", "un pochoir"], ph: "un mot", exp: "Le masque agit comme un pochoir : là où il est plein (255), on garde le réseau." },
    { type: "vf", q: "Le masque 255.255.255.0 est le plus courant pour les petits réseaux de bureau ou de maison.", a: true, exp: "Oui : trois octets réseau, un octet machine, c'est le masque classique des petits réseaux." },
    { type: "input", q: "Écris en binaire l'octet du masque 255.255.255.0 qui vaut 0 (8 chiffres).", a: ["00000000"], ph: "8 chiffres", exp: "L'octet machine du masque est 00000000 (tous les bits à 0)." }
  ],
  final: {
    title: "Exercice final — Lire un couple adresse/masque",
    intro: `<p>Un technicien configure un poste avec l'adresse <code>10.20.30.40</code> et le masque <code>255.255.255.0</code>. Il doit décrire précisément ce que ce masque signifie pour cette adresse.</p>`,
    questions: [
      { type: "qcm", q: "Combien de bits réseau impose le masque 255.255.255.0 ?", opts: ["8", "16", "24", "32"], a: 2, exp: "Trois octets à 255 = 24 bits réseau." },

    ],
    solution: `<pre class="pseudo"># Adresse 10.20.30.40 avec masque 255.255.255.0
Masque en binaire : 11111111.11111111.11111111.00000000  (24 bits reseau)
Partie reseau  : 10.20.30   (la ou le masque vaut 255)
Partie machine : 40         (la ou le masque vaut 0)

# Consequence : 10.20.30.41, .42 ... sont dans le MEME reseau (10.20.30).</pre>
<p>Le masque nous dit où couper. Reste à s'en servir pour calculer concrètement l'adresse de réseau : c'est le ET logique du jour 7.</p>`
