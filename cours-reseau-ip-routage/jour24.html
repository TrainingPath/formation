var DAY = {
  num: 24,
  title: "Le protocole ARP",
  subtitle: "Faire le pont entre l'adresse IP (logique) et l'adresse MAC (physique) sur le réseau local.",
  theory: `
<h3>1. Deux adresses pour une même machine</h3>
<p>Sur un réseau local, chaque machine possède <strong>deux adresses</strong> de natures différentes. L'<strong>adresse IP</strong> est logique : elle sert au routage à travers Internet et peut changer. L'<strong>adresse MAC</strong> (en anglais <em>Media Access Control</em>) est physique : gravée dans la carte réseau, elle identifie la machine sur le lien local (Ethernet, Wi-Fi). Pour livrer réellement une trame à un voisin sur le réseau local, on a besoin de son adresse <strong>MAC</strong>, pas seulement de son IP.</p>
<p>Le problème : quand ta machine veut parler à 192.168.1.20 (une IP), elle ne connaît pas encore la carte réseau (la MAC) qui se cache derrière. Il faut donc <strong>traduire l'IP en MAC</strong>. C'est exactement le rôle du protocole <strong>ARP</strong> (en anglais <em>Address Resolution Protocol</em>, « protocole de résolution d'adresse »).</p>
<div class="tip">Retiens la direction : ARP résout une adresse <strong>IP → MAC</strong>. On connaît l'IP du voisin, on cherche sa MAC. (Le mécanisme inverse, retrouver une IP à partir d'infos de plus haut niveau, relève du DNS ou d'autres services, pas d'ARP.)</div>
<h3>2. Requête broadcast, réponse unicast</h3>
<p>Le fonctionnement d'ARP tient en deux temps, comme une question posée à voix haute puis une réponse discrète :</p>
<pre class="pseudo"># 1) REQUETE ARP -> envoyee en BROADCAST (a TOUT le reseau local)
"Qui a l'IP 192.168.1.20 ? Reponds-moi (je suis 192.168.1.10, MAC aa:bb:...)."
# La trame est adressee a la MAC de diffusion : ff:ff:ff:ff:ff:ff
# TOUTES les machines du reseau local la recoivent.

# 2) REPONSE ARP -> envoyee en UNICAST (a l'expediteur uniquement)
"C'est moi ! 192.168.1.20 = MAC 11:22:33:44:55:66."
# Seule la machine concernee repond, directement au demandeur.</pre>
<p>La <strong>requête</strong> part donc en <strong>broadcast</strong> (diffusion à tous, car on ignore à qui s'adresser), et la <strong>réponse</strong> revient en <strong>unicast</strong> (à un seul destinataire, celui qui a demandé). Toutes les machines reçoivent la question, mais une seule — celle qui possède l'IP demandée — répond.</p>
<h3>3. Le cache ARP : ne pas redemander sans cesse</h3>
<p>Poser la question à tout le réseau à chaque paquet serait un gaspillage énorme. Chaque machine garde donc un <strong>cache ARP</strong> (une petite table) où elle mémorise les correspondances IP → MAC déjà apprises, pendant quelques minutes.</p>
<pre class="pseudo"># Voir le cache ARP
# Windows :        arp -a
# Linux / macOS :  ip neigh    (ou l'ancien : arp -a)

# Exemple de contenu du cache
Adresse IP        Adresse MAC          Type
192.168.1.20      11:22:33:44:55:66    dynamique
192.168.1.1       00:1a:2b:3c:4d:5e    dynamique</pre>
<p>Tant que la correspondance est dans le cache, aucune requête ARP n'est nécessaire : on réutilise la MAC connue. L'entrée expire après un délai, ce qui permet de suivre les changements (nouvelle carte réseau, etc.).</p>
<div class="warn">ARP ne fonctionne que sur le RÉSEAU LOCAL. Pour joindre une machine d'un autre réseau, on ne résout PAS la MAC de la machine distante (impossible, elle est ailleurs) : on résout la MAC de la PASSERELLE. C'est le routeur qui prendra le relais. ARP s'arrête à la frontière du réseau local.</div>
<h3>4. Un exemple complet</h3>
<pre class="pseudo"># PC A (192.168.1.10) veut envoyer a PC B (192.168.1.20), meme reseau local.
1) A regarde son cache ARP : pas d'entree pour 192.168.1.20.
2) A diffuse une REQUETE ARP en broadcast : "Qui a 192.168.1.20 ?"
3) Toutes les machines recoivent ; seule B se reconnait.
4) B repond en UNICAST : "192.168.1.20 = ma MAC 11:22:33:44:55:66".
5) A memorise la correspondance dans son cache ARP.
6) A envoie enfin sa trame directement a la MAC de B. Les paquets suivants
   n'ont plus besoin d'ARP tant que le cache est valide.</pre>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ARP = Address Resolution Protocol : traduit une IP en MAC (IP -> MAC)
# Requete ARP  : BROADCAST  ("qui a l'IP X ?") -> recue par tous
# Reponse ARP  : UNICAST    ("c'est moi, voici ma MAC") -> au demandeur
# Cache ARP    : memorise les correspondances pour eviter de redemander
# Portee       : reseau LOCAL uniquement ; hors du reseau, on resout la MAC
#                de la PASSERELLE (le routeur prend le relais)</pre>`,
  exercises: [
    { type: "qcm", q: "Que traduit le protocole ARP ?", opts: ["Une MAC en IP", "Une IP en adresse MAC", "Un nom de domaine en IP", "Un port en protocole"], a: 1, exp: "ARP résout une adresse IP en adresse MAC (IP → MAC) sur le réseau local." },
    { type: "input", q: "Que signifie le sigle ARP ? (développement anglais)", a: ["address resolution protocol"], ph: "3 mots", exp: "ARP = Address Resolution Protocol." },
    { type: "qcm", q: "Comment est envoyée une requête ARP ?", opts: ["En unicast", "En broadcast (à tout le réseau local)", "En chiffré", "Par le routeur seulement"], a: 1, exp: "La requête part en broadcast : on ignore la MAC cible, donc on demande à tout le monde." },
    { type: "qcm", q: "Comment est envoyée la réponse ARP ?", opts: ["En broadcast", "En unicast (au seul demandeur)", "En multicast obligatoire", "Elle n'existe pas"], a: 1, exp: "La réponse revient en unicast, directement à la machine qui a posé la question." },
    { type: "vf", q: "Toutes les machines du réseau local reçoivent la requête ARP, mais une seule répond.", a: true, exp: "Oui : le broadcast touche tout le monde ; seule la machine ayant l'IP demandée répond." },
    { type: "input", q: "Quelle adresse MAC de destination porte une trame de requête ARP (adresse de diffusion) ?", a: ["ff:ff:ff:ff:ff:ff", "ffffffffffff", "ff-ff-ff-ff-ff-ff"], ph: "ff:ff:...", exp: "La requête est adressée à la MAC de broadcast ff:ff:ff:ff:ff:ff." },
    { type: "qcm", q: "À quoi sert le cache ARP ?", opts: ["À chiffrer les IP", "À mémoriser les correspondances IP → MAC pour ne pas redemander", "À stocker des fichiers", "À compter les sauts"], a: 1, exp: "Le cache ARP garde les correspondances apprises, évitant de rediffuser une requête à chaque paquet." },
    { type: "input", q: "Quelle commande affiche le cache ARP sous Windows ?", a: ["arp -a", "arp-a"], ph: "une commande", exp: "Sous Windows : arp -a." },
    { type: "vf", q: "ARP fonctionne aussi pour résoudre directement la MAC d'une machine située sur un autre réseau.", a: false, exp: "Non : ARP est limité au réseau local. Pour l'extérieur, on résout la MAC de la passerelle." },
    { type: "qcm", q: "Pour joindre une machine d'un AUTRE réseau, quelle MAC la source résout-elle par ARP ?", opts: ["La MAC de la machine distante", "La MAC de sa passerelle (le routeur)", "La MAC de broadcast définitivement", "Aucune, ARP est inutile"], a: 1, exp: "On résout la MAC de la passerelle : le routeur prendra ensuite le relais vers l'autre réseau." },
    { type: "qcm", q: "Pourquoi a-t-on besoin d'ARP alors qu'on connaît déjà l'IP du voisin ?", opts: ["Pour chiffrer la trame", "Parce que la livraison locale se fait avec la MAC, pas l'IP", "Pour augmenter le TTL", "Pour choisir le port"], a: 1, exp: "Sur le lien local, la trame est livrée à une MAC : il faut donc traduire l'IP connue en MAC." },
    { type: "input", q: "Quelle est la nature de l'adresse MAC (par opposition à l'IP dite « logique ») ? (un mot)", a: ["physique", "materielle", "matérielle"], ph: "un mot", exp: "La MAC est une adresse physique, gravée dans la carte réseau ; l'IP est logique." },
    { type: "vf", q: "Une entrée du cache ARP finit par expirer après un certain délai.", a: true, exp: "Oui : les entrées expirent, ce qui permet de suivre les changements (nouvelle carte, etc.)." },
    { type: "qcm", q: "Contenu typique d'une requête ARP ?", opts: ["« Voici mon mot de passe »", "« Qui a l'IP 192.168.1.20 ? »", "« Quel est le TTL ? »", "« Quel port utiliser ? »"], a: 1, exp: "La requête demande : qui possède telle IP ? Réponds-moi avec ta MAC." },
    { type: "input", q: "Quelle commande moderne affiche les voisins ARP sous Linux ?", a: ["ip neigh", "ip n"], ph: "une commande", exp: "Sous Linux : ip neigh (l'ancien arp -a fonctionne aussi)." }
  ],
  final: {
    title: "Exercice final — Suivre une résolution ARP",
    intro: `<p>PC A (192.168.1.10) veut envoyer des données à PC B (192.168.1.20), sur le même réseau local. Le cache ARP de A est vide pour cette IP. Décris et comprends chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "A et B étant sur le même réseau, que doit d'abord obtenir A pour livrer la trame à B ?", opts: ["Le TTL de B", "L'adresse MAC de B", "Le mot de passe de B", "Le port de B"], a: 1, exp: "La livraison locale se fait par MAC : A a besoin de la MAC de B, qu'il ne connaît pas encore." },
      { type: "input", q: "Sous quel mode (broadcast ou unicast) A envoie-t-il sa requête ARP ?", a: ["broadcast", "en broadcast", "diffusion"], ph: "un mot", exp: "La requête ARP part en broadcast, vers toutes les machines du réseau local." },
      { type: "qcm", q: "Qui répond à la requête « Qui a l'IP 192.168.1.20 ? »", opts: ["Toutes les machines", "Seulement PC B", "Le routeur", "Personne"], a: 1, exp: "Seule B, qui possède l'IP 192.168.1.20, répond." },
      { type: "vf", q: "La réponse de B revient en unicast directement à A, qui la mémorise dans son cache ARP.", a: true, exp: "Oui : réponse unicast, puis A stocke la correspondance IP → MAC pour la réutiliser." },
      { type: "qcm", q: "Si A voulait maintenant joindre 8.8.8.8 (hors du réseau local), quelle MAC résoudrait-il par ARP ?", opts: ["La MAC de 8.8.8.8", "La MAC de sa passerelle par défaut", "La MAC de broadcast", "Aucune, c'est impossible"], a: 1, exp: "8.8.8.8 est hors du réseau local : A résout la MAC de sa passerelle, qui routera ensuite." }
    ],
    solution: `<pre class="pseudo"># Resolution ARP de A (192.168.1.10) vers B (192.168.1.20), meme reseau :
1) Cache ARP de A : vide pour 192.168.1.20.
2) A -> REQUETE ARP en BROADCAST (MAC dest ff:ff:ff:ff:ff:ff) :
   "Qui a 192.168.1.20 ?"
3) Toutes les machines recoivent ; seule B se reconnait.
4) B -> REPONSE ARP en UNICAST a A : "192.168.1.20 = 11:22:33:44:55:66".
5) A memorise IP->MAC dans son cache ARP.
6) A envoie enfin la trame a la MAC de B. Paquets suivants : plus besoin d'ARP.
#
# Pour 8.8.8.8 (autre reseau) : A resout la MAC de sa PASSERELLE, pas celle de 8.8.8.8.</pre>
<p>ARP est le petit traducteur invisible du réseau local : il transforme une IP connue en MAC joignable, et met le résultat en cache pour aller plus vite ensuite.</p>`
  }
};
</script>
