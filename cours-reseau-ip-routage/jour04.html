<script>
var DAY = {
  num: 4,
  title: "Le binaire au service des réseaux",
  subtitle: "Convertir entre binaire et décimal grâce aux puissances de 2.",
  theory: `
<h3>1. Pourquoi le binaire en réseau ?</h3>
<p>Les machines ne connaissent que deux états : le courant passe ou ne passe pas, 1 ou 0. C'est le <strong>binaire</strong> (en anglais <em>binary</em>), un système de numération à base 2. Une adresse IPv4 est en réalité une suite de 32 bits binaires ; la notation décimale pointée n'est qu'un habillage pour nos yeux d'humains. Pour comprendre les masques, l'adresse de réseau et le ET logique (que nous verrons bientôt), il faut savoir passer du binaire au décimal et inversement.</p>
<p>Bonne nouvelle : en réseau, tu ne manipules jamais 32 bits d'un coup. Tu travailles octet par octet, donc toujours sur <strong>8 bits</strong>. Maîtriser un octet suffit pour tout le reste.</p>
<h3>2. Les puissances de 2, la clé de tout</h3>
<p>Dans un octet, chaque position a un <strong>poids</strong>, qui est une puissance de 2. La position la plus à droite pèse 1, puis on double à chaque pas vers la gauche : 1, 2, 4, 8, 16, 32, 64, 128. Ce sont les huit poids d'un octet.</p>
<pre class="pseudo"># Les 8 poids d'un octet (de gauche a droite) :
Position :   b8  b7  b6  b5  b4  b3  b2  b1
Poids    :  128  64  32  16   8   4   2   1
(chaque poids est le double du precedent : 2^7 ... 2^0)</pre>
<div class="tip">Apprends par coeur la suite 128, 64, 32, 16, 8, 4, 2, 1. Avec elle, tu convertis n'importe quel octet à la main, sans calculette.</div>
<h3>3. Du binaire vers le décimal</h3>
<p>Pour convertir un octet binaire en décimal, additionne les poids des positions qui contiennent un 1. Les positions à 0 ne comptent pas. Exemple avec <strong>11000000</strong> :</p>
<pre class="pseudo"># 11000000 -> on aligne sous les poids
 1   1   0   0   0   0   0   0
128 64  32  16   8   4   2   1
128 + 64 = 192      (les deux 1 pesent 128 et 64)
Donc 11000000 = 192.

# Autre exemple : 10101000
 1   0   1   0   1   0   0   0
128 64  32  16   8   4   2   1
128 + 32 + 8 = 168     Donc 10101000 = 168.</pre>
<h3>4. Du décimal vers le binaire</h3>
<p>Pour convertir un nombre décimal (0 à 255) en octet binaire, on procède par soustractions successives, de gauche à droite : « le poids rentre-t-il dans ce qui reste ? ». Si oui, on écrit 1 et on soustrait ; sinon on écrit 0. Convertissons <strong>168</strong> :</p>
<pre class="pseudo"># Convertir 168 en binaire (poids : 128 64 32 16 8 4 2 1)
128 rentre dans 168 ? oui -> 1, reste 168-128 = 40
 64 rentre dans  40 ? non -> 0
 32 rentre dans  40 ? oui -> 1, reste 40-32 = 8
 16 rentre dans   8 ? non -> 0
  8 rentre dans   8 ? oui -> 1, reste 8-8 = 0
  4 rentre dans   0 ? non -> 0
  2 rentre dans   0 ? non -> 0
  1 rentre dans   0 ? non -> 0
Resultat : 10101000  (on retrouve bien 168)</pre>
<h3>5. Quelques valeurs à connaître</h3>
<p>Certains octets reviennent tout le temps en réseau, surtout dans les masques. Les mémoriser fait gagner un temps fou :</p>
<pre class="pseudo"># Octets "pleins par la gauche" (utiles pour les masques) :
00000000 = 0
10000000 = 128
11000000 = 192
11100000 = 224
11110000 = 240
11111000 = 248
11111100 = 252
11111110 = 254
11111111 = 255   (tous les bits a 1)</pre>
<div class="warn">Attention à l'ordre : le bit de gauche pèse 128, celui de droite pèse 1. Inverser les poids est l'erreur la plus courante. On lit toujours de gauche (128) à droite (1).</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Un octet = 8 bits ; poids : 128 64 32 16 8 4 2 1.
# Binaire -> decimal : additionner les poids des positions a 1.
# Decimal -> binaire : soustractions successives de gauche a droite.
# 11000000 = 192 | 10101000 = 168 | 11111111 = 255.
# Valeur max d'un octet : 128+64+32+16+8+4+2+1 = 255.</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de bits contient un octet ?", opts: ["4", "8", "16", "32"], a: 1, exp: "Un octet contient 8 bits. Une IPv4 en compte quatre, soit 32 bits." },
    { type: "input", q: "Quel est le poids (la valeur) du bit le plus à gauche dans un octet ?", a: ["128", "2^7"], ph: "un nombre", exp: "Le bit de gauche pèse 128 (soit 2 puissance 7)." },
    { type: "input", q: "Convertis l'octet binaire 11000000 en décimal.", a: ["192"], ph: "un nombre", exp: "128 + 64 = 192." },
    { type: "input", q: "Convertis l'octet binaire 11111111 en décimal.", a: ["255"], ph: "un nombre", exp: "128+64+32+16+8+4+2+1 = 255, la valeur maximale d'un octet." },
    { type: "qcm", q: "Quelle est la suite correcte des poids d'un octet, de gauche à droite ?", opts: ["1 2 4 8 16 32 64 128", "128 64 32 16 8 4 2 1", "256 128 64 32 16 8 4 2", "128 64 32 16 8 4 3 2"], a: 1, exp: "De gauche à droite : 128, 64, 32, 16, 8, 4, 2, 1." },
    { type: "input", q: "Convertis 10101000 en décimal.", a: ["168"], ph: "un nombre", exp: "128 + 32 + 8 = 168." },
    { type: "vf", q: "Dans un octet, le bit le plus à droite pèse 1.", a: true, exp: "Oui : les poids vont de 128 (à gauche) à 1 (à droite)." },
    { type: "input", q: "Convertis le nombre décimal 192 en octet binaire (8 chiffres).", a: ["11000000"], ph: "8 chiffres", exp: "192 = 128 + 64, donc les deux bits de gauche à 1 : 11000000." },
    { type: "qcm", q: "Combien vaut 2 puissance 8 ?", opts: ["128", "255", "256", "512"], a: 2, exp: "2^8 = 256, soit le nombre de valeurs possibles d'un octet (0 à 255)." },
    { type: "input", q: "Convertis le décimal 255 en binaire (8 chiffres).", a: ["11111111"], ph: "8 chiffres", exp: "255 = tous les bits à 1 : 11111111." },
    { type: "vf", q: "L'octet binaire 10000000 vaut 128 en décimal.", a: true, exp: "Oui : seul le bit de poids 128 est à 1." },
    { type: "input", q: "Convertis 11110000 en décimal.", a: ["240"], ph: "un nombre", exp: "128 + 64 + 32 + 16 = 240." },
    { type: "qcm", q: "Comment convertir un octet binaire en décimal ?", opts: ["Multiplier tous les bits entre eux", "Additionner les poids des positions à 1", "Compter le nombre de 0", "Additionner tous les poids sans exception"], a: 1, exp: "On additionne uniquement les poids des positions qui contiennent un 1." },
    { type: "input", q: "Convertis le décimal 10 en binaire sur 8 chiffres.", a: ["00001010"], ph: "8 chiffres", exp: "10 = 8 + 2, donc 00001010." },
    { type: "qcm", q: "Quelle est la valeur maximale que peut prendre un octet ?", opts: ["127", "128", "255", "256"], a: 2, exp: "La somme de tous les poids (128 à 1) donne 255, le maximum d'un octet." }
  ],
  final: {
    title: "Exercice final — Traduire une adresse en binaire",
    intro: `<p>Une administratrice doit vérifier à la main l'adresse <code>192.168.1.10</code>. Elle veut retrouver, octet par octet, l'écriture binaire de cette adresse. Guidons-la avec les poids 128 64 32 16 8 4 2 1.</p>`,
    questions: [
      { type: "input", q: "Écris l'octet 192 en binaire (8 chiffres).", a: ["11000000"], ph: "8 chiffres", exp: "192 = 128 + 64 : 11000000." },
      { type: "input", q: "Écris l'octet 168 en binaire (8 chiffres).", a: ["10101000"], ph: "8 chiffres", exp: "168 = 128 + 32 + 8 : 10101000." },
      { type: "input", q: "Écris l'octet 1 en binaire (8 chiffres).", a: ["00000001"], ph: "8 chiffres", exp: "1 = seul le bit de poids 1 : 00000001." },
      { type: "input", q: "Écris l'octet 10 en binaire (8 chiffres).", a: ["00001010"], ph: "8 chiffres", exp: "10 = 8 + 2 : 00001010." },
      { type: "qcm", q: "En rassemblant les quatre octets, combien de bits obtient-on au total ?", opts: ["8", "16", "24", "32"], a: 3, exp: "4 octets de 8 bits = 32 bits, la taille d'une adresse IPv4." }
    ],
    solution: `<pre class="pseudo"># 192.168.1.10 en binaire, octet par octet :
192 = 11000000   (128 + 64)
168 = 10101000   (128 + 32 + 8)
  1 = 00000001   (1)
 10 = 00001010   (8 + 2)

# Adresse complete (32 bits) :
11000000.10101000.00000001.00001010</pre>
<p>Tu sais maintenant traduire dans les deux sens. Cette compétence est la fondation du jour suivant : distinguer, dans ces bits, la partie réseau de la partie machine.</p>`
  }
};
