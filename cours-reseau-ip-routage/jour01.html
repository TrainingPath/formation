<script>
var DAY = {
  num: 1,
  title: "La couche 3 : pourquoi router ?",
  subtitle: "Quand un réseau local ne suffit plus, il faut relier les réseaux entre eux.",
  theory: `
<h3>1. Un réseau local, c'est un quartier fermé</h3>
<p>Un <strong>réseau local</strong> (en anglais <em>LAN</em>, « Local Area Network ») relie des machines proches : les ordinateurs d'une salle, d'un étage, d'une maison. À l'intérieur, tout le monde se parle directement grâce à un <strong>commutateur</strong> (en anglais <em>switch</em>) et à des adresses matérielles gravées dans chaque carte réseau, les adresses <strong>MAC</strong>. C'est efficace, mais fermé : un LAN, c'est un quartier sans routes vers l'extérieur. Tant que tu restes entre voisins, tout va bien. Dès que tu veux joindre une machine « ailleurs », tu es bloqué.</p>
<p>Imagine un grand immeuble où chaque personne a un numéro d'appartement. Crier le numéro dans le couloir suffit pour être entendu de tous les voisins de l'étage. Mais si ton correspondant habite dans une autre ville, crier ne sert plus à rien : il faut une adresse postale et un service qui achemine la lettre de proche en proche. C'est exactement le problème que résout la couche 3.</p>
<h3>2. Les limites concrètes du LAN</h3>
<p>Pourquoi ne pas mettre toutes les machines du monde dans un seul grand réseau local ? Parce que ça ne passe pas à l'échelle. Trois murs se dressent :</p>
<pre class="pseudo"># 1. La diffusion (broadcast) sature tout
Sur un LAN, certains messages sont envoyes a TOUT le monde a la fois.
10 machines : supportable.   100 000 machines : le reseau s'effondre.

# 2. Les adresses MAC ne sont pas organisees
Une MAC (ex: 00:1A:2B:3C:4D:5E) identifie une carte, pas un lieu.
Impossible de dire "par ou aller" : elles ne suivent aucune geographie.

# 3. La distance physique est limitee
Un LAN couvre une salle, un batiment. Pas une ville, ni un pays.</pre>
<p>Il faut donc découper le monde en <strong>plusieurs réseaux distincts</strong> et inventer un moyen de passer de l'un à l'autre. Ce moyen, c'est le <strong>routage</strong>.</p>
<h3>3. La couche 3 et l'adresse logique</h3>
<p>Le modèle en couches range les fonctions du réseau par étages. La <strong>couche 2</strong> (liaison de données) gère les échanges à l'intérieur d'un même LAN avec les adresses MAC. La <strong>couche 3</strong> (réseau) gère les échanges <em>entre</em> réseaux différents. Pour cela elle n'utilise pas la MAC, mais une <strong>adresse logique</strong> : l'<strong>adresse IP</strong> (en anglais <em>Internet Protocol</em>).</p>
<p>La différence est essentielle. La MAC est une <strong>adresse physique</strong>, fixe, attribuée à l'usine : elle dit « qui » tu es. L'IP est une <strong>adresse logique</strong>, attribuée par le réseau : elle dit « où » tu es. On peut réorganiser les IP comme un plan de ville, avec des quartiers (les réseaux) et des rues. C'est cette organisation qui rend le routage possible.</p>
<div class="tip">Retiens l'image : la MAC est comme ton numéro de carte d'identité (il te suit partout, mais n'indique pas où tu habites) ; l'IP est comme ton adresse postale (elle change si tu déménages, mais elle permet de te localiser et de t'écrire).</div>
<h3>4. Le routeur : le carrefour entre les réseaux</h3>
<p>Un <strong>routeur</strong> (en anglais <em>router</em>) est un appareil branché sur plusieurs réseaux à la fois. Son travail : recevoir un paquet, lire l'<strong>adresse IP de destination</strong>, et décider par quelle sortie l'envoyer pour le rapprocher du but. De routeur en routeur, le paquet traverse la planète. C'est le principe d'Internet : un immense réseau de réseaux reliés par des routeurs.</p>
<pre class="pseudo"># Sans routeur : deux LAN isoles, aucune communication possible
[ PC-A ]---[ switch 1 ]        [ switch 2 ]---[ PC-B ]
      Reseau 1                        Reseau 2

# Avec un routeur : le carrefour relie les deux mondes
[ PC-A ]---[ switch 1 ]---[ ROUTEUR ]---[ switch 2 ]---[ PC-B ]
      Reseau 1                                  Reseau 2
Le routeur lit l'IP de destination et fait passer le paquet d'un reseau a l'autre.</pre>
<div class="warn">Un switch (couche 2) ne route pas : il distribue à l'intérieur d'un seul réseau. Un routeur (couche 3) fait passer d'un réseau à un autre. Confondre les deux est l'erreur classique du débutant.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># LAN = reseau local ferme : rapide entre voisins, mais isole.
# Limites du LAN : broadcast qui sature, MAC non organisees, distance courte.
# Couche 2 = a l'INTERIEUR d'un reseau (adresse MAC, physique).
# Couche 3 = ENTRE les reseaux (adresse IP, logique).
# MAC = qui tu es (fixe).   IP = ou tu es (organisee, routable).
# Routeur = carrefour qui relie les reseaux en lisant l'IP de destination.</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle LAN ?", opts: ["Large Area Network", "Local Area Network", "Logical Address Node", "Link Access Network"], a: 1, exp: "LAN = Local Area Network, un réseau local qui relie des machines proches." },
    { type: "qcm", q: "À quelle couche du modèle réseau se fait le routage entre réseaux ?", opts: ["Couche 1 (physique)", "Couche 2 (liaison)", "Couche 3 (réseau)", "Couche 7 (application)"], a: 2, exp: "Le routage entre réseaux est la fonction de la couche 3 (réseau), qui utilise l'adresse IP." },
    { type: "vf", q: "Un switch permet de faire passer un paquet d'un réseau à un autre.", a: false, exp: "Non : le switch (couche 2) distribue à l'intérieur d'un seul réseau. C'est le routeur (couche 3) qui relie les réseaux." },
    { type: "qcm", q: "Quelle adresse est « physique », gravée dans la carte réseau ?", opts: ["L'adresse IP", "L'adresse MAC", "L'adresse de diffusion", "L'adresse de passerelle"], a: 1, exp: "La MAC est l'adresse physique attribuée en usine. L'IP est une adresse logique attribuée par le réseau." },
    { type: "input", q: "Comment appelle-t-on l'appareil qui relie plusieurs réseaux et lit l'IP de destination pour acheminer les paquets ?", a: ["routeur", "un routeur", "le routeur", "router"], ph: "un mot", exp: "Le routeur est le carrefour entre réseaux : il lit l'IP de destination et choisit la sortie." },
    { type: "vf", q: "L'adresse IP est une adresse logique qui indique « où » se trouve une machine dans le réseau.", a: true, exp: "Oui : l'IP est logique et organisée comme un plan de ville, ce qui rend le routage possible." },
    { type: "qcm", q: "Pourquoi ne peut-on pas mettre toutes les machines du monde dans un seul LAN ?", opts: ["Parce que les câbles seraient trop courts uniquement", "Parce que la diffusion (broadcast) saturerait tout et que les MAC ne sont pas organisées", "Parce que les IP n'existeraient plus", "Parce que les switchs coûtent trop cher"], a: 1, exp: "Le broadcast sature à grande échelle et les MAC ne suivent aucune géographie : impossible de router." },
    { type: "input", q: "Comment nomme-t-on (en anglais, un mot) le message envoyé à TOUTES les machines d'un réseau local à la fois ?", a: ["broadcast", "le broadcast", "diffusion"], ph: "un mot", exp: "Le broadcast (diffusion) est envoyé à tout le LAN : il devient ingérable sur un très grand réseau." },
    { type: "qcm", q: "Que dit l'adresse MAC à propos d'une machine ?", opts: ["Où elle se trouve", "Qui elle est (son identité matérielle)", "Vers quel routeur envoyer", "Sa vitesse de connexion"], a: 1, exp: "La MAC dit « qui » : c'est une carte d'identité matérielle. L'IP dit « où »." },
    { type: "vf", q: "Internet peut être décrit comme un réseau de réseaux reliés par des routeurs.", a: true, exp: "Exactement : de nombreux réseaux distincts sont interconnectés par des routeurs de couche 3." },
    { type: "input", q: "Quelle couche du modèle réseau utilise l'adresse MAC pour les échanges à l'intérieur d'un même LAN ? (donne le numéro)", a: ["2", "couche 2", "la couche 2"], ph: "un numéro", exp: "La couche 2 (liaison de données) gère les échanges internes au LAN via les adresses MAC." },
    { type: "qcm", q: "Une bonne analogie pour l'adresse IP est…", opts: ["Un numéro de carte d'identité qui te suit partout", "Une adresse postale qui te localise", "Un mot de passe secret", "Une couleur de câble"], a: 1, exp: "L'IP est comme une adresse postale : elle localise et peut changer si tu « déménages » de réseau." },
    { type: "qcm", q: "Le rôle principal d'un routeur est de…", opts: ["Recopier tous les paquets à toutes les machines", "Lire l'IP de destination et choisir par où envoyer le paquet", "Attribuer les adresses MAC", "Accélérer le câble"], a: 1, exp: "Le routeur examine l'IP de destination et achemine le paquet vers le réseau suivant." },
    { type: "vf", q: "Sur un très grand réseau unique, le broadcast resterait aussi efficace que sur dix machines.", a: false, exp: "Non : plus il y a de machines, plus la diffusion sature le réseau. C'est une des limites majeures du LAN." },
    { type: "input", q: "En un mot, la MAC est une adresse ______ (opposée à « logique »).", a: ["physique", "matérielle", "materielle"], ph: "un adjectif", exp: "La MAC est physique (matérielle) ; l'IP est logique." }
  ],
  final: {
    title: "Exercice final — Relier deux salles de classe",
    intro: `<p>Une école a deux salles informatique. La salle A forme le réseau 1, la salle B le réseau 2. Chaque salle a son switch. Aujourd'hui, un élève de la salle A ne peut joindre aucun ordinateur de la salle B. Aidons l'administrateur à comprendre pourquoi et comment y remédier.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi la salle A ne peut-elle pas joindre la salle B ?", opts: ["Les switchs sont éteints", "Ce sont deux réseaux distincts et rien ne les relie au niveau couche 3", "Les MAC sont identiques", "Le câble est trop long"], a: 1, exp: "Deux réseaux séparés ne communiquent pas sans un routeur pour faire le lien." },
      { type: "input", q: "Quel appareil faut-il ajouter pour relier les deux réseaux ?", a: ["routeur", "un routeur", "le routeur", "router"], ph: "un mot", exp: "Un routeur, branché sur les deux réseaux, permettra le passage des paquets." },
      { type: "qcm", q: "Sur quelle information le routeur va-t-il s'appuyer pour acheminer les paquets ?", opts: ["L'adresse MAC de destination", "L'adresse IP de destination", "La couleur du câble", "Le nom de l'élève"], a: 1, exp: "Le routeur lit l'adresse IP de destination pour choisir la sortie." },
      { type: "vf", q: "Un simple switch supplémentaire entre les deux salles suffirait à faire communiquer les réseaux.", a: false, exp: "Non : un switch ne route pas entre réseaux. Il faut un routeur (couche 3)." },
      { type: "qcm", q: "Quelle adresse est propre à la couche 3 et permet le routage ?", opts: ["L'adresse MAC", "L'adresse IP", "L'adresse du switch", "L'adresse du câble"], a: 1, exp: "L'adresse IP (logique) est l'adresse de couche 3 utilisée pour router." }
    ],
    solution: `<pre class="pseudo"># Diagnostic : deux reseaux distincts, aucun lien de couche 3.
[ Salle A / Reseau 1 ]---[ switch A ]     [ switch B ]---[ Salle B / Reseau 2 ]

# Solution : ajouter un ROUTEUR entre les deux switchs.
[ switch A ]---[ ROUTEUR ]---[ switch B ]
Le routeur lit l'IP de destination et fait passer le paquet du Reseau 1 au Reseau 2.</pre>
<p>Le switch distribue à l'intérieur d'un réseau ; le routeur relie les réseaux. Demain, on regarde de près cette fameuse adresse IP : sa structure et son rôle.</p>`
  }
};
</script>
