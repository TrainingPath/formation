<script>
var DAY = {
  num: 12,
  title: "Les adresses particulières",
  subtitle: "Loopback, APIPA, 0.0.0.0, multicast : les adresses qui ne désignent pas une machine comme les autres.",
  theory: `
<h3>1. Le loopback : 127.0.0.1, se parler à soi-même</h3>
<p>Le bloc <strong>127.0.0.0/8</strong> est réservé au <strong>loopback</strong> (« boucle locale »). L'adresse vedette est <strong>127.0.0.1</strong>, surnommée <em>localhost</em>. Quand une machine envoie des données à 127.0.0.1, elles ne quittent jamais la carte réseau : elles reviennent directement à la machine elle-même. C'est un miroir. On l'utilise pour tester qu'un logiciel réseau fonctionne (« est-ce que mon serveur web répond sur ma propre machine ? ») sans dépendre d'aucun câble ni d'aucun autre ordinateur.</p>
<div class="tip">Tout le bloc 127.x.x.x est loopback, mais en pratique on écrit presque toujours <strong>127.0.0.1</strong>. Le nom <strong>localhost</strong> pointe vers cette adresse.</div>
<h3>2. APIPA : 169.254.x.x, l'adresse « de secours »</h3>
<p>Le bloc <strong>169.254.0.0/16</strong> est réservé à l'<strong>APIPA</strong> (Automatic Private IP Addressing), aussi appelé <em>link-local</em>. Une machine s'y attribue une adresse toute seule <strong>quand elle n'a pas réussi à obtenir d'adresse par le DHCP</strong> (le serveur qui distribue les adresses est absent ou en panne). Si tu vois une adresse commençant par <strong>169.254</strong>, c'est presque toujours le signe d'un problème : le DHCP n'a pas répondu.</p>
<div class="warn">Une adresse 169.254.x.x ne permet de parler qu'aux voisins directs du même segment. Elle n'a pas de passerelle : pas d'Internet. C'est un symptôme, pas une configuration voulue.</div>
<h3>3. 0.0.0.0 : « aucune » ou « toutes »</h3>
<p>L'adresse <strong>0.0.0.0</strong> a deux usages selon le contexte. Sur une machine qui démarre, elle signifie « <strong>je n'ai pas encore d'adresse</strong> » (adresse indéterminée). Pour un serveur, « écouter sur 0.0.0.0 » signifie « <strong>accepter les connexions sur toutes mes interfaces réseau</strong> ». Enfin, dans une table de routage, <strong>0.0.0.0/0</strong> représente la <strong>route par défaut</strong> : « tout le reste passe par ici » (vers la passerelle).</p>
<h3>4. Adresse de réseau, adresse de diffusion</h3>
<p>Dans chaque réseau, deux adresses ne sont jamais attribuées à une machine. La première (tous les bits d'hôte à 0) est l'<strong>adresse du réseau</strong> lui-même, son « nom ». La dernière (tous les bits d'hôte à 1) est l'<strong>adresse de diffusion</strong> (broadcast) : un message envoyé à cette adresse est reçu par toutes les machines du réseau. C'est pour cela qu'on retire 2 du compte des hôtes utilisables.</p>
<pre class="pseudo"># Reseau 192.168.1.0/24
# 192.168.1.0     -> adresse du RESEAU        (jamais attribuee)
# 192.168.1.1     -> premiere machine utilisable
# 192.168.1.254   -> derniere machine utilisable
# 192.168.1.255   -> adresse de DIFFUSION (broadcast)
# 255.255.255.255 -> broadcast limite (tout le segment local)</pre>
<h3>5. Multicast et adresses réservées</h3>
<p>Le bloc <strong>224.0.0.0 à 239.255.255.255</strong> (l'ancienne classe D) est le <strong>multicast</strong> : un flux envoyé à un groupe d'abonnés (télévision sur IP, découverte de services). Au-delà, <strong>240.0.0.0 à 255.255.255.254</strong> (ancienne classe E) est <strong>réservé/expérimental</strong>. Ces adresses ne désignent jamais un poste de travail ordinaire.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 127.0.0.0/8      -> loopback (127.0.0.1 = localhost, se parler a soi-meme)
# 169.254.0.0/16   -> APIPA / link-local (echec DHCP, pas d'Internet)
# 0.0.0.0          -> adresse indeterminee / toutes interfaces ; 0.0.0.0/0 = route par defaut
# .0 du reseau     -> adresse reseau  |  .255 (bits hote a 1) -> broadcast
# 224-239          -> multicast (classe D)   |   240-255 -> reserve (classe E)</pre>`,
  exercises: [
    { type: "qcm", q: "Que représente 127.0.0.1 ?", opts: ["La passerelle par défaut", "Le loopback (la machine elle-même)", "Le serveur DNS", "L'adresse de diffusion"], a: 1, exp: "127.0.0.1 = loopback = localhost : la machine se parle à elle-même." },
    { type: "input", q: "Quel nom (un mot) désigne habituellement l'hôte 127.0.0.1 ?", a: ["localhost"], ph: "un mot", exp: "127.0.0.1 est nommée localhost." },
    { type: "qcm", q: "Une machine affiche 169.254.10.20. Que s'est-il probablement passé ?", opts: ["Tout fonctionne parfaitement", "Le DHCP n'a pas répondu (adresse APIPA auto-attribuée)", "Elle est sur Internet en public", "Elle est en loopback"], a: 1, exp: "169.254.x.x = APIPA : la machine n'a pas obtenu d'adresse du DHCP." },
    { type: "input", q: "Quel bloc CIDR (ex: 10.0.0.0/8) correspond à l'APIPA / link-local ?", a: ["169.254.0.0/16", "169.254.0.0 /16"], ph: "x.x.x.x/xx", exp: "APIPA = 169.254.0.0/16." },
    { type: "vf", q: "Une adresse 169.254.x.x permet normalement d'accéder à Internet.", a: false, exp: "Faux : link-local, sans passerelle. Elle ne parle qu'aux voisins directs, pas d'Internet." },
    { type: "qcm", q: "Dans le réseau 192.168.1.0/24, quelle est l'adresse de diffusion (broadcast) ?", opts: ["192.168.1.0", "192.168.1.1", "192.168.1.254", "192.168.1.255"], a: 3, exp: "Bits d'hôte tous à 1 : 192.168.1.255 = broadcast." },
    { type: "qcm", q: "Dans 192.168.1.0/24, quelle adresse désigne le réseau lui-même ?", opts: ["192.168.1.0", "192.168.1.1", "192.168.1.255", "192.168.1.100"], a: 0, exp: "Bits d'hôte tous à 0 : 192.168.1.0 = adresse du réseau." },
    { type: "input", q: "Quel bloc CIDR est réservé au loopback ? (ex: 10.0.0.0/8)", a: ["127.0.0.0/8", "127.0.0.0 /8"], ph: "x.x.x.x/xx", exp: "Tout le bloc 127.0.0.0/8 est loopback." },
    { type: "qcm", q: "Que signifie « un serveur écoute sur 0.0.0.0 » ?", opts: ["Il est éteint", "Il accepte les connexions sur toutes ses interfaces réseau", "Il n'accepte que le loopback", "Il fait du multicast"], a: 1, exp: "0.0.0.0 côté serveur = toutes les interfaces." },
    { type: "vf", q: "Dans une table de routage, 0.0.0.0/0 représente la route par défaut (tout le reste).", a: true, exp: "Vrai : 0.0.0.0/0 capte tout le trafic non couvert par une route plus précise." },
    { type: "qcm", q: "Quelle plage correspond au multicast ?", opts: ["127.0.0.0 à 127.255.255.255", "169.254.0.0 à 169.254.255.255", "224.0.0.0 à 239.255.255.255", "240.0.0.0 à 255.255.255.255"], a: 2, exp: "Multicast = 224.0.0.0 à 239.255.255.255 (ancienne classe D)." },
    { type: "input", q: " APIPA veut dire Automatic Private IP … ? (le dernier mot, en anglais)", a: ["addressing", "adressing"], ph: "un mot anglais", exp: "APIPA = Automatic Private IP Addressing." },
    { type: "qcm", q: "Pourquoi retire-t-on 2 au nombre d'hôtes utilisables d'un réseau ?", opts: ["Pour le routeur et le switch", "Pour l'adresse de réseau et l'adresse de diffusion", "Pour le DNS et le DHCP", "Pour deux réserves aléatoires"], a: 1, exp: "L'adresse de réseau (.0) et le broadcast (.255) ne sont pas attribuables : d'où le -2." },
    { type: "vf", q: "Envoyer des données à 127.0.0.1 fait sortir ces données sur le câble réseau.", a: false, exp: "Faux : le loopback boucle en interne, rien ne sort de la machine." },
    { type: "qcm", q: "La plage 240.0.0.0 à 255.255.255.254 (ancienne classe E) est…", opts: ["Le loopback", "Le multicast", "Réservée / expérimentale", "Des adresses privées RFC 1918"], a: 2, exp: "Ancienne classe E : réservée, non utilisée pour des hôtes ordinaires." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer une adresse étrange",
    intro: `<p>Un utilisateur se plaint : « Je n'ai plus Internet. » Le technicien lance la commande d'affichage IP et lit <code>169.254.45.12</code>. Analysons ce que révèle cette adresse.</p>`,
    questions: [
      { type: "qcm", q: "Cette adresse 169.254.45.12 est une adresse…", opts: ["Publique normale", "APIPA (link-local) auto-attribuée", "De loopback", "De multicast"], a: 1, exp: "169.254.x.x = APIPA, attribuée automatiquement." },
      { type: "qcm", q: "Quelle est la cause la plus probable ?", opts: ["Le câble est trop long", "Le DHCP n'a pas répondu (pas d'adresse obtenue)", "Le pare-feu est trop faible", "L'IPv6 est activé"], a: 1, exp: "APIPA apparaît quand le DHCP ne fournit pas d'adresse." },
      { type: "vf", q: "Avec cette adresse, la machine peut joindre un site web sur Internet.", a: false, exp: "Faux : pas de passerelle en link-local, donc pas d'Internet." },
      { type: "input", q: "Pour tester que la pile réseau locale de la machine fonctionne, quelle adresse peut-on « pinger » ? (l'adresse de loopback)", a: ["127.0.0.1", "localhost"], ph: "une adresse", exp: "On teste la pile locale avec 127.0.0.1 (localhost)." },
      { type: "qcm", q: "Une fois le DHCP réparé, la machine devrait recevoir…", opts: ["Une autre adresse 169.254", "Une adresse du réseau local (ex: 192.168.x.x) avec passerelle", "127.0.0.1", "0.0.0.0 définitivement"], a: 1, exp: "Le DHCP fournira une vraie adresse locale routable avec passerelle." }
    ],
    solution: `<pre class="pseudo"># Diagnostic : adresse 169.254.45.12 = APIPA
# -> le DHCP n'a pas repondu (serveur absent, cable, switch...)
# Consequence : pas de passerelle, donc pas d'Internet.
# Test utile : ping 127.0.0.1 (loopback) verifie la pile locale.
# Reparer le DHCP -> la machine recoit une vraie IP (ex: 192.168.1.x).</pre>
<p>Tu sais lire les adresses spéciales et t'en servir pour diagnostiquer. À partir de demain : découper un réseau en sous-réseaux, le fameux subnetting.</p>`
  }
};
</script>
