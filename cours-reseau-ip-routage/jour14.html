<script>
var DAY = {
  num: 14,
  title: "La méthode de base du découpage",
  subtitle: "Emprunter des bits, puis compter les sous-réseaux et les hôtes, étape par étape.",
  theory: `
<h3>1. Les deux formules qui gouvernent tout</h3>
<p>Tout le subnetting « à la main » repose sur deux formules et une adresse de 32 bits. On appelle <strong>b</strong> le nombre de bits <strong>empruntés</strong> aux hôtes, et <strong>h</strong> le nombre de bits <strong>restants</strong> pour les hôtes.</p>
<pre class="pseudo"># Nombre de sous-reseaux  = 2^b        (b = bits empruntes)
# Nombre d'hotes UTILISABLES = 2^h - 2 (h = bits d'hote restants)
# Toujours vrai : (bits reseau) + (bits hote) = 32
# Nouveau prefixe = ancien prefixe + b</pre>
<p>Le <strong>-2</strong> vient de deux adresses non attribuables dans chaque sous-réseau : la première (adresse du réseau) et la dernière (adresse de diffusion / broadcast).</p>
<h3>2. Méthode en 5 étapes</h3>
<p>Prenons un exemple fil rouge : découper <strong>192.168.1.0/24</strong> pour obtenir <strong>4 sous-réseaux</strong>.</p>
<p><strong>Étape 1 - Combien de bits emprunter ?</strong> On cherche b tel que 2^b soit au moins égal au nombre de sous-réseaux voulus. Ici 2^2 = 4, donc <strong>b = 2</strong>.</p>
<p><strong>Étape 2 - Nouveau préfixe.</strong> 24 + 2 = <strong>/26</strong>. Le masque passe de 255.255.255.0 à 255.255.255.192.</p>
<p><strong>Étape 3 - Bits d'hôte restants et hôtes.</strong> h = 32 - 26 = <strong>6</strong>. Hôtes utilisables = 2^6 - 2 = <strong>62</strong> par sous-réseau.</p>
<p><strong>Étape 4 - Le pas entre sous-réseaux.</strong> C'est la taille d'un bloc = 2^h = 2^6 = <strong>64</strong>. Les sous-réseaux commencent donc de 64 en 64 dans le dernier octet.</p>
<p><strong>Étape 5 - Lister les sous-réseaux.</strong></p>
<pre class="pseudo"># 192.168.1.0/26 decoupe (pas de 64) :
# Sous-reseau   Adresse reseau    1er hote        Dernier hote     Broadcast
#   1           192.168.1.0       192.168.1.1     192.168.1.62     192.168.1.63
#   2           192.168.1.64      192.168.1.65    192.168.1.126    192.168.1.127
#   3           192.168.1.128     192.168.1.129   192.168.1.190    192.168.1.191
#   4           192.168.1.192     192.168.1.193   192.168.1.254    192.168.1.255</pre>
<div class="tip">Le premier hôte = adresse de réseau + 1. Le broadcast = adresse du sous-réseau suivant - 1. Le dernier hôte = broadcast - 1. Une fois qu'on a le pas (ici 64), tout s'enchaîne mécaniquement.</div>
<h3>3. Retrouver le masque à partir des bits empruntés</h3>
<p>Chaque bit emprunté « allume » un bit de plus dans le dernier octet du masque, de gauche à droite. Les valeurs des bits sont 128, 64, 32, 16, 8, 4, 2, 1.</p>
<pre class="pseudo"># bits empruntes -> dernier octet du masque
# 1 bit  -> 128            -> /25 = 255.255.255.128
# 2 bits -> 128+64=192     -> /26 = 255.255.255.192
# 3 bits -> +32 = 224      -> /27 = 255.255.255.224
# 4 bits -> +16 = 240      -> /28 = 255.255.255.240
# 5 bits -> +8  = 248      -> /29 = 255.255.255.248
# 6 bits -> +4  = 252      -> /30 = 255.255.255.252</pre>
<div class="warn">Piège fréquent : oublier le -2 sur les hôtes. Un /30 a 2^2 = 4 adresses mais seulement 2 hôtes utilisables. Compte toujours l'adresse de réseau et le broadcast comme perdus.</div>
<h3>4. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 1) b = bits empruntes tel que 2^b >= nb de sous-reseaux voulus
# 2) nouveau prefixe = ancien + b
# 3) h = 32 - prefixe ; hotes = 2^h - 2
# 4) pas = 2^h  (taille d'un bloc dans l'octet decoupe)
# 5) lister : reseau / 1er hote / dernier hote / broadcast, de pas en pas</pre>`,
  exercises: [
    { type: "qcm", q: "Formule du nombre de sous-réseaux à partir de b bits empruntés ?", opts: ["2^b - 2", "2^b", "b^2", "2 x b"], a: 1, exp: "Nombre de sous-réseaux = 2^b." },
    { type: "qcm", q: "Formule du nombre d'hôtes utilisables avec h bits d'hôte ?", opts: ["2^h", "2^h - 2", "2^h + 2", "h - 2"], a: 1, exp: "Hôtes utilisables = 2^h - 2 (on retire réseau et broadcast)." },
    { type: "input", q: "Pour obtenir 8 sous-réseaux, combien de bits emprunter ? (2^b = 8)", a: ["3", "3 bits", "trois"], ph: "un nombre", exp: "2^3 = 8, donc b = 3." },
    { type: "qcm", q: "On découpe un /24 en empruntant 3 bits. Nouveau préfixe ?", opts: ["/21", "/26", "/27", "/28"], a: 2, exp: "24 + 3 = /27." },
    { type: "input", q: "Avec un /26, combien d'hôtes utilisables par sous-réseau ? (h = 32-26)", a: ["62", "62 hotes"], ph: "un nombre", exp: "h = 6, 2^6 - 2 = 62." },
    { type: "vf", q: "Le -2 dans la formule des hôtes correspond à l'adresse de réseau et à l'adresse de broadcast.", a: true, exp: "Vrai : ces deux adresses ne sont pas attribuables à une machine." },
    { type: "qcm", q: "Dans 192.168.1.0/26, quel est le pas entre sous-réseaux (dans le dernier octet) ?", opts: ["32", "64", "128", "192"], a: 1, exp: "Pas = 2^h = 2^6 = 64." },
    { type: "input", q: "Quel masque correspond à /27 ? (255.x.x.x)", a: ["255.255.255.224"], ph: "255.x.x.x", exp: "3 bits empruntés : 128+64+32 = 224. /27 = 255.255.255.224." },
    { type: "qcm", q: "Dans le découpage 192.168.1.0/26, quelle est l'adresse du 3e sous-réseau ?", opts: ["192.168.1.32", "192.168.1.64", "192.168.1.128", "192.168.1.192"], a: 2, exp: "Pas de 64 : 0, 64, 128, 192. Le 3e est 192.168.1.128." },
    { type: "vf", q: "Un /30 offre 4 adresses mais seulement 2 hôtes utilisables.", a: true, exp: "Vrai : 2^2 = 4 adresses, moins réseau et broadcast = 2 hôtes." },
    { type: "input", q: "Combien de bits d'hôte restent dans un /28 ? (32 - préfixe)", a: ["4", "4 bits"], ph: "un nombre", exp: "32 - 28 = 4 bits d'hôte." },
    { type: "qcm", q: "Dans 192.168.1.0/26, quel est le broadcast du 2e sous-réseau (192.168.1.64) ?", opts: ["192.168.1.95", "192.168.1.126", "192.168.1.127", "192.168.1.128"], a: 2, exp: "Sous-réseau suivant = .128 ; broadcast = 128-1 = 192.168.1.127." },
    { type: "qcm", q: "Combien de sous-réseaux crée l'emprunt de 4 bits ?", opts: ["4", "8", "16", "32"], a: 2, exp: "2^4 = 16 sous-réseaux." },
    { type: "input", q: "Quel masque correspond à l'emprunt donnant /29 ? (255.x.x.x)", a: ["255.255.255.248"], ph: "255.x.x.x", exp: "5 bits : 128+64+32+16+8 = 248. /29 = 255.255.255.248." },
    { type: "qcm", q: "Dans un sous-réseau, le premier hôte utilisable est…", opts: ["L'adresse de réseau elle-même", "L'adresse de réseau + 1", "L'adresse de broadcast", "L'adresse de broadcast - 2"], a: 1, exp: "1er hôte = adresse du réseau + 1." }
  ],
  final: {
    title: "Exercice final — Découper un /24 en 4",
    intro: `<p>On te confie <code>172.16.5.0/24</code>. On veut <strong>4 sous-réseaux</strong> de taille égale pour quatre services. Applique la méthode en 5 étapes.</p>`,
    questions: [
      { type: "input", q: "Combien de bits emprunter pour 4 sous-réseaux ? (2^b = 4)", a: ["2", "2 bits", "deux"], ph: "un nombre", exp: "2^2 = 4, donc 2 bits." },
      { type: "qcm", q: "Nouveau préfixe et masque ?", opts: ["/25 - 255.255.255.128", "/26 - 255.255.255.192", "/27 - 255.255.255.224", "/28 - 255.255.255.240"], a: 1, exp: "24 + 2 = /26 = 255.255.255.192." },
      { type: "input", q: "Combien d'hôtes utilisables par sous-réseau ? (2^6 - 2)", a: ["62", "62 hotes"], ph: "un nombre", exp: "h = 6, 2^6 - 2 = 62." },
      { type: "qcm", q: "Quelle est l'adresse réseau du 2e sous-réseau (pas de 64) ?", opts: ["172.16.5.32", "172.16.5.64", "172.16.5.96", "172.16.5.128"], a: 1, exp: "Blocs de 64 : .0, .64, .128, .192. Le 2e est 172.16.5.64." },
      { type: "qcm", q: "Quel est le broadcast du dernier sous-réseau (172.16.5.192) ?", opts: ["172.16.5.223", "172.16.5.240", "172.16.5.254", "172.16.5.255"], a: 3, exp: "Dernier bloc .192 à .255 : broadcast = 172.16.5.255." }
    ],
    solution: `<pre class="pseudo"># 172.16.5.0/24  ->  4 sous-reseaux
# b = 2 bits  ->  /26  (255.255.255.192)  ->  h = 6  ->  62 hotes  ->  pas = 64
# SR1 : 172.16.5.0    hotes .1  a .62     broadcast .63
# SR2 : 172.16.5.64   hotes .65 a .126    broadcast .127
# SR3 : 172.16.5.128  hotes .129 a .190   broadcast .191
# SR4 : 172.16.5.192  hotes .193 a .254   broadcast .255</pre>
<p>Tu maîtrises la méthode complète. Demain : un raccourci puissant pour trouver les plages en une seconde, la méthode du nombre magique.</p>`
  }
};
</script>
