<script>
var DAY = {
  num: 9,
  title: "Les classes historiques (A, B, C)",
  subtitle: "Comment on rangeait les adresses IP avant le CIDR, et pourquoi ce système a vieilli.",
  theory: `
<h3>1. Rappel : une adresse IPv4, c'est 32 bits</h3>
<p>Une adresse IPv4 comme <strong>192.168.1.10</strong> est un nombre de <strong>32 bits</strong> écrit en quatre morceaux de 8 bits, appelés <em>octets</em> (en anglais <em>octets/bytes</em>). Chaque octet va de 0 à 255. Une partie de l'adresse identifie le <strong>réseau</strong> (network), l'autre identifie la <strong>machine</strong> (host) à l'intérieur de ce réseau. La grande question a toujours été : où s'arrête la partie réseau et où commence la partie hôte ? Dans les années 1980, la réponse tenait dans un système simple : les <strong>classes</strong>.</p>
<h3>2. L'idée des classes : la frontière fixée par le premier octet</h3>
<p>On regardait la valeur du <strong>premier octet</strong> pour deviner la taille du réseau. Trois classes servaient aux machines ordinaires :</p>
<pre class="pseudo"># Classe   Premier octet   Partie reseau   Masque par defaut   Reseaux / Hotes par reseau
# A        1   a 126        8 bits          255.0.0.0   (/8)    peu de reseaux, ENORMES (16 millions d'hotes)
# B        128 a 191        16 bits         255.255.0.0 (/16)   moyens (65 000 hotes)
# C        192 a 223        24 bits         255.255.255.0 (/24) beaucoup, PETITS (254 hotes)</pre>
<p>La logique : en classe <strong>A</strong>, seul le premier octet est « réseau », donc il reste 24 bits pour les machines, soit des réseaux gigantesques. En classe <strong>C</strong>, trois octets sont « réseau », il ne reste que 8 bits pour les machines, donc de tout petits réseaux. La classe <strong>B</strong> coupe l'adresse en deux moitiés égales.</p>
<div class="tip">Astuce mnémotechnique : plus la lettre avance (A, B, C), plus la partie réseau grandit (8, 16, 24 bits) et plus les réseaux sont petits. A = géant, C = nain.</div>
<h3>3. Les classes D et E, à part</h3>
<p>Deux autres classes existent mais ne servent pas à adresser des machines classiques. La classe <strong>D</strong> (premier octet de <strong>224 à 239</strong>) est réservée au <strong>multicast</strong> (envoi à un groupe). La classe <strong>E</strong> (premier octet de <strong>240 à 255</strong>) est <strong>expérimentale/réservée</strong>. On y reviendra plus tard ; retiens surtout qu'au-delà de 223, on quitte les adresses d'hôtes ordinaires.</p>
<h3>4. Pourquoi le système des classes est devenu obsolète</h3>
<p>Le problème est le <strong>gaspillage</strong>. Imagine une entreprise qui a besoin de 300 machines. Un réseau de classe C (254 hôtes) est trop petit ; on lui donnait alors une classe B (65 000 hôtes) dont elle utilisait moins de 1 %. Des millions d'adresses dormaient ainsi, inutilisées, alors que la réserve mondiale d'adresses IPv4 s'épuisait. Les classes imposaient des tailles rigides (8, 16 ou 24 bits) sans intermédiaire.</p>
<div class="warn">Depuis 1993, on n'attribue plus les adresses par classe : le système est dit <strong>classless</strong> (sans classe). On le remplace par le <strong>CIDR</strong> (leçon suivante), qui permet des frontières réseau à n'importe quel nombre de bits. Les « classes » restent utiles à connaître pour le vocabulaire et les examens, mais ne décrivent plus la réalité d'Internet.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Classe A : 1-126    /8    255.0.0.0       reseaux enormes
# Classe B : 128-191  /16   255.255.0.0     reseaux moyens
# Classe C : 192-223  /24   255.255.255.0   petits reseaux
# Classe D : 224-239  multicast
# Classe E : 240-255  reservee/experimentale
# 127.x.x.x = loopback (reserve, hors classes utilisables)
# Systeme des classes = OBSOLETE, remplace par le CIDR</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits est codée une adresse IPv4 ?", opts: ["16 bits", "32 bits", "64 bits", "128 bits"], a: 1, exp: "IPv4 = 32 bits, écrits en quatre octets de 8 bits." },
    { type: "qcm", q: "À quelle classe appartient une adresse dont le premier octet est 10 ?", opts: ["Classe A", "Classe B", "Classe C", "Classe D"], a: 0, exp: "10 est entre 1 et 126 : classe A, masque par défaut /8." },
    { type: "qcm", q: "Quel est le masque par défaut d'une adresse de classe C ?", opts: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"], a: 2, exp: "Classe C = 24 bits réseau = 255.255.255.0 = /24." },
    { type: "input", q: "Quelle est la plage du premier octet pour la classe B ? (écris sous la forme 128-191)", a: ["128-191", "128 191", "128 a 191", "de 128 a 191"], ph: "ex: 128-191", exp: "Classe B : premier octet de 128 à 191, masque par défaut /16." },
    { type: "vf", q: "En classe A, la partie réseau occupe 8 bits.", a: true, exp: "Vrai : classe A = /8, un seul octet réseau, 24 bits pour les hôtes." },
    { type: "qcm", q: "À quoi sert la classe D (224 à 239) ?", opts: ["À l'adressage privé local (RFC 1918)", "Au multicast (envoi à un groupe)", "À la diffusion broadcast d'un réseau", "Au loopback"], a: 1, exp: "La classe D est réservée au multicast." },
    { type: "input", q: "Quel masque par défaut (notation CIDR, ex: /24) correspond à la classe A ?", a: ["/8", "8"], ph: "ex: /24", exp: "Classe A = 8 bits réseau = /8 = 255.0.0.0." },
    { type: "qcm", q: "Une entreprise a besoin de 300 machines. Que reprochait-on au système des classes ici ?", opts: ["La classe C (254 hôtes) suffit largement", "On devait donner une classe B énorme et gaspiller des milliers d'adresses", "Il n'existait aucun réseau assez grand", "Il fallait deux classes A"], a: 1, exp: "254 hôtes trop peu, donc une classe B (65000) : énorme gaspillage. D'où le CIDR." },
    { type: "vf", q: "Le système des classes est toujours la méthode officielle d'attribution des adresses sur Internet.", a: false, exp: "Faux : depuis 1993, Internet est classless (CIDR). Les classes ne servent plus qu'au vocabulaire." },
    { type: "qcm", q: "Classe d'une adresse commençant par 200 ?", opts: ["Classe A", "Classe B", "Classe C", "Classe D"], a: 2, exp: "200 est entre 192 et 223 : classe C." },
    { type: "input", q: "Quel terme anglais désigne le système « sans classe » qui a remplacé les classes ?", a: ["classless", "cidr", "sans classe"], ph: "un mot", exp: "On parle d'adressage classless, mis en oeuvre par le CIDR." },
    { type: "vf", q: "Plus la lettre de classe avance (A vers C), plus la partie réseau est grande.", a: true, exp: "Vrai : A=/8, B=/16, C=/24. La partie réseau grandit, les réseaux rétrécissent." },
    { type: "qcm", q: "Combien d'octets forment la partie réseau d'une adresse de classe B ?", opts: ["1 octet", "2 octets", "3 octets", "4 octets"], a: 1, exp: "Classe B = /16 = 2 octets réseau (255.255.0.0)." },
    { type: "input", q: "À quelle classe appartient 172.16.0.1 ? (réponds par une lettre)", a: ["b", "classe b"], ph: "une lettre", exp: "Premier octet 172, entre 128 et 191 : classe B." },
    { type: "qcm", q: "La classe E (240 à 255) est…", opts: ["Une plage d'adresses privées supplémentaire", "Réservée / expérimentale", "Le multicast", "Réservée au loopback (127.x.x.x)"], a: 1, exp: "La classe E est réservée à l'expérimentation, non utilisée pour des hôtes ordinaires." }
  ],
  final: {
    title: "Exercice final — Classer trois adresses",
    intro: `<p>Un stagiaire découvre trois adresses notées sur un tableau : <code>10.1.2.3</code>, <code>172.20.5.4</code> et <code>192.168.0.7</code>. On lui demande d'appliquer (pour réviser) l'ancien système des classes.</p>`,
    questions: [
      { type: "qcm", q: "10.1.2.3 appartient à la classe…", opts: ["A", "B", "C", "D"], a: 0, exp: "Premier octet 10 (1-126) : classe A, /8." },
      { type: "input", q: "Quel est le masque par défaut (notation 255.x) de 172.20.5.4 ?", a: ["255.255.0.0"], ph: "255.x.x.x", exp: "172 est en classe B : masque par défaut 255.255.0.0 (/16)." },
      { type: "qcm", q: "192.168.0.7 appartient à la classe…", opts: ["A", "B", "C", "E"], a: 2, exp: "Premier octet 192 (192-223) : classe C, /24." },
      { type: "vf", q: "Aujourd'hui, un fournisseur d'accès attribuerait vraiment ces réseaux selon leur classe.", a: false, exp: "Non : l'attribution moderne est classless (CIDR). Les classes ne servent qu'à réviser." },
      { type: "input", q: "Combien de bits réseau a, par défaut, une adresse de classe A ? (écris le nombre)", a: ["8", "/8", "8 bits"], ph: "un nombre", exp: "Classe A = 8 bits réseau = /8." }
    ],
    solution: `<pre class="pseudo"># 10.1.2.3      -> Classe A -> /8  -> 255.0.0.0
# 172.20.5.4    -> Classe B -> /16 -> 255.255.0.0
# 192.168.0.7   -> Classe C -> /24 -> 255.255.255.0
# Rappel : ces classes sont HISTORIQUES. Internet moderne = CIDR (classless).</pre>
<p>Tu sais reconnaître A, B et C au premier octet. Demain, on remplace ce vieux système par la notation CIDR, bien plus souple.</p>`
  }
};
</script>
