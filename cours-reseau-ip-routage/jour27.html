  theory: `
<h3>1. À quoi sert ICMP ?</h3>
<p>IP transporte les paquets, mais il ne dit jamais si quelque chose s'est mal passé : c'est un service « au mieux », sans garantie. Il fallait donc un moyen de <strong>signaler les problèmes</strong> et de <strong>tester la connectivité</strong>. C'est le rôle d'<strong>ICMP</strong> (<em>Internet Control Message Protocol</em>), le « service après-vente » d'IP. ICMP ne transporte pas tes données ; il transporte des <em>messages sur l'état du réseau</em>.</p>
<div class="tip">ICMP voyage à l'intérieur de paquets IP, mais ce n'est ni TCP ni UDP : c'est un protocole à part entière, identifié par le numéro de protocole <strong>1</strong> dans l'en-tête IP.</div>
<h3>2. Deux grandes familles : erreur et contrôle</h3>
<p>Les messages ICMP se rangent en deux catégories. Les <strong>messages d'erreur</strong> préviennent qu'un paquet n'a pas pu être livré : destination injoignable, durée de vie épuisée, etc. Les <strong>messages de contrôle</strong> (ou d'information) servent à sonder et diagnostiquer, comme le fameux couple echo request / echo reply utilisé par ping.</p>
<h3>3. Le type ICMP : une étiquette qui dit tout</h3>
<p>Chaque message ICMP porte un <strong>type</strong> (un numéro) et parfois un <strong>code</strong> (une précision). Le type indique la nature du message. Voici les plus courants à connaître :</p>
<pre class="pseudo"># Messages de CONTROLE (diagnostic)
Type 8  = Echo Request   (la question du ping : "es-tu la ?")
Type 0  = Echo Reply     (la reponse du ping : "oui, je suis la")
# Messages d'ERREUR
Type 3  = Destination Unreachable   (destination injoignable)
Type 11 = Time Exceeded             (duree de vie TTL epuisee)
Type 5  = Redirect                  (utilise une meilleure route)</pre>
<h3>4. Le duo echo request / echo reply</h3>
<p>C'est le mécanisme le plus utilisé. La commande <strong>ping</strong> envoie un <strong>echo request</strong> (type 8) : « es-tu joignable ? ». Si la machine cible est là et accepte de répondre, elle renvoie un <strong>echo reply</strong> (type 0) : « oui ». Le temps entre l'envoi et la réponse mesure la latence (le fameux « temps = 12 ms »). Retiens bien : <strong>type 8 = requête</strong>, <strong>type 0 = réponse</strong>.</p>
<pre class="pseudo">PC ----- Echo Request (type 8) -----&gt; Serveur
PC &lt;----- Echo Reply  (type 0) ------- Serveur
# Aller-retour reussi = l'hote est joignable</pre>
<h3>5. Quand ICMP signale une panne</h3>
<p>Si un routeur ne trouve pas de chemin vers la destination, il renvoie à l'expéditeur un <strong>Destination Unreachable</strong> (type 3). Si un paquet tourne trop longtemps et que sa durée de vie tombe à zéro, le routeur le jette et prévient avec un <strong>Time Exceeded</strong> (type 11) — un mécanisme qu'exploite traceroute, comme on le verra demain.</p>
<div class="warn">Beaucoup de pare-feux bloquent l'ICMP entrant. Un ping sans réponse ne prouve donc pas toujours que la machine est éteinte : elle peut simplement refuser de répondre aux echo request. « Pas de réponse » ≠ « hôte mort ».</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ICMP = messages de controle et d'erreur d'IP (protocole numero 1)
# Chaque message a un TYPE :
#   Type 8  = Echo Request  (question du ping)

#   Type 3  = Destination Unreachable  (erreur : injoignable)
#   Type 11 = Time Exceeded            (erreur : TTL a zero)
# ICMP ne transporte pas de donnees : il renseigne sur l'etat du reseau</pre>`,

    { type: "qcm", q: "Quel type ICMP suggère à l'expéditeur d'utiliser une meilleure route ?", opts: ["Type 5 (Redirect)", "Type 0", "Type 8", "Type 3"], a: 0, exp: "Redirect = type 5." },
    { type: "vf", q: "ICMP voyage à l'intérieur de paquets IP.", a: true, exp: "Les messages ICMP sont encapsulés dans des paquets IP (protocole 1)." }
  ],
