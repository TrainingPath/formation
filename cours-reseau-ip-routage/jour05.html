<script>
var DAY = {
  num: 5,
  title: "Partie réseau et partie machine",
  subtitle: "Une adresse IP se lit en deux morceaux : le quartier et le numéro dans la rue.",
  theory: `
<h3>1. Le rappel qui change tout</h3>
<p>Nous l'avons entrevu : une adresse IP n'est pas un numéro isolé, elle se découpe en <strong>deux parties</strong>. La <strong>partie réseau</strong> (en anglais <em>network part</em>) désigne le réseau auquel la machine appartient. La <strong>partie machine</strong> (en anglais <em>host part</em>) désigne la machine précise à l'intérieur de ce réseau. Aujourd'hui, on approfondit cette découpe, car c'est elle qui gouverne tout le routage.</p>
<div class="tip">Analogie postale : dans « 12 rue des Lilas », la « rue des Lilas » est la partie réseau (le quartier commun à tous les voisins) et le « 12 » est la partie machine (ton numéro à toi). Tes voisins partagent la même rue mais ont des numéros différents.</div>
<h3>2. Ce que partagent les machines d'un même réseau</h3>
<p>Règle fondamentale : <strong>toutes les machines d'un même réseau ont la même partie réseau</strong>, et se distinguent uniquement par leur partie machine. C'est ce qui permet à un routeur de raisonner simplement : il regarde la partie réseau de la destination, et si elle diffère de la sienne, il transmet le paquet vers un autre réseau.</p>
<pre class="pseudo"># Exemple : trois machines du reseau 192.168.1
192.168.1 . 10     <- meme partie reseau (192.168.1)
192.168.1 . 11     <- meme partie reseau
192.168.1 . 254    <- meme partie reseau
[--reseau--][machine]
Elles se parlent directement : meme quartier, numeros differents.</pre>
<h3>3. Où se coupe l'adresse ?</h3>
<p>La grande question est : jusqu'où va la partie réseau, et où commence la partie machine ? Sur nos exemples, la coupure tombe pile entre deux octets, mais ce n'est pas une obligation : la frontière peut se situer n'importe où dans les 32 bits. Ce qui décide de l'emplacement de la coupure, c'est un autre élément, le <strong>masque de sous-réseau</strong>, que nous étudierons demain. Pour aujourd'hui, retiens que la coupure existe et qu'elle sépare des <strong>bits réseau</strong> (à gauche) des <strong>bits machine</strong> (à droite).</p>
<pre class="pseudo"># En binaire, la coupure separe la gauche (reseau) de la droite (machine)
11000000.10101000.00000001 . 00001010
[------- bits reseau -------][bits machine]
Ici la partie reseau occupe 24 bits, la partie machine 8 bits.
Les bits de gauche fixent le reseau ; ceux de droite numerotent la machine.</pre>
<h3>4. Pourquoi cette découpe est-elle si utile ?</h3>
<p>Sans découpe, un routeur devrait mémoriser l'emplacement de chaque machine de la planète : impossible. Grâce à la découpe, il lui suffit de connaître les <strong>réseaux</strong>. Toutes les machines d'un même réseau sont atteintes par le même chemin, exactement comme le facteur trie d'abord par ville et par rue avant de s'occuper des numéros. La partie réseau sert à <strong>acheminer jusqu'au bon réseau</strong> ; la partie machine sert à <strong>livrer à la bonne machine</strong> une fois sur place.</p>
<h3>5. Deux valeurs de la partie machine sont spéciales</h3>
<p>À l'intérieur d'un réseau, deux combinaisons de la partie machine sont réservées et ne peuvent pas être données à une machine ordinaire. Quand <strong>tous les bits machine valent 0</strong>, l'adresse désigne le réseau lui-même (l'adresse de réseau). Quand <strong>tous les bits machine valent 1</strong>, l'adresse est celle de diffusion (broadcast). Nous y reviendrons en détail au jour 8 ; sache dès maintenant qu'elles sont mises de côté.</p>
<pre class="pseudo"># Cas particuliers de la partie machine (sur l'exemple 192.168.1)
192.168.1.0    -> bits machine tout a 0  -> adresse du RESEAU
192.168.1.255  -> bits machine tout a 1  -> adresse de DIFFUSION
192.168.1.1 a 192.168.1.254 -> machines ordinaires utilisables</pre>
<div class="warn">Ne confonds pas partie réseau et adresse de réseau. La « partie réseau » est un morceau de bits commun à tout le monde ; l'« adresse de réseau » est l'adresse complète obtenue en mettant tous les bits machine à 0. On construira cette dernière au jour 7.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Une IP = partie RESEAU (gauche) + partie MACHINE (droite).
# Meme reseau -> meme partie reseau ; les machines different par la partie machine.
# La partie reseau achemine vers le bon reseau ; la partie machine livre a la bonne machine.
# La position de la coupure est fixee par le MASQUE (jour 6).
# Bits machine tout a 0 = adresse reseau ; tout a 1 = diffusion (jour 8).</pre>`,
  exercises: [
    { type: "qcm", q: "En combien de parties se découpe une adresse IP ?", opts: ["Une seule", "Deux : partie réseau et partie machine", "Trois parties égales", "Quatre parties indépendantes"], a: 1, exp: "Deux parties : la partie réseau (à gauche) et la partie machine (à droite)." },
    { type: "vf", q: "Toutes les machines d'un même réseau partagent la même partie réseau.", a: true, exp: "Oui : c'est la partie machine qui les distingue les unes des autres." },
    { type: "input", q: "Comment appelle-t-on (en anglais) la partie de l'adresse qui désigne la machine précise ?", a: ["host part", "host", "hote", "hôte"], ph: "en anglais", exp: "C'est la host part (partie machine ou partie hôte)." },
    { type: "qcm", q: "Dans 192.168.1.10 (partie réseau = 192.168.1), quelle valeur est la partie machine ?", opts: ["192", "168", "1", "10"], a: 3, exp: "La partie réseau est 192.168.1 ; la partie machine est 10." },
    { type: "qcm", q: "À quoi sert la partie réseau d'une adresse ?", opts: ["À livrer à la bonne machine", "À acheminer le paquet jusqu'au bon réseau", "À définir le masque de sous-réseau", "À chiffrer les données"], a: 1, exp: "La partie réseau permet d'atteindre le bon réseau ; la partie machine livre ensuite à la bonne machine." },
    { type: "vf", q: "La position de la coupure entre partie réseau et partie machine tombe forcément entre deux octets.", a: false, exp: "Non : la coupure peut se situer n'importe où dans les 32 bits. C'est le masque qui la fixe." },
    { type: "input", q: "Quel élément décide de l'endroit où se coupe l'adresse entre réseau et machine ?", a: ["le masque", "masque", "le masque de sous-réseau", "masque de sous-reseau", "masque de sous-réseau"], ph: "un mot", exp: "Le masque de sous-réseau fixe la frontière entre bits réseau et bits machine." },
    { type: "qcm", q: "Deux machines 192.168.1.10 et 192.168.1.11 (partie réseau 192.168.1)…", opts: ["Sont dans deux réseaux différents", "Sont dans le même réseau", "Ne peuvent pas exister", "Ont la même partie machine"], a: 1, exp: "Elles ont la même partie réseau (192.168.1), donc le même réseau." },
    { type: "vf", q: "Quand tous les bits de la partie machine valent 0, l'adresse désigne le réseau lui-même.", a: true, exp: "Oui : bits machine tout à 0 = adresse de réseau (détaillée au jour 8)." },
    { type: "qcm", q: "Que représente une adresse dont tous les bits machine valent 1 ?", opts: ["Une machine ordinaire", "L'adresse de diffusion (broadcast)", "L'adresse du routeur toujours", "Une adresse invalide"], a: 1, exp: "Bits machine tout à 1 = adresse de diffusion (broadcast)." },
    { type: "input", q: "Dans l'exemple 192.168.1, quelle adresse correspond aux bits machine tout à 0 ?", a: ["192.168.1.0"], ph: "une adresse", exp: "192.168.1.0 : c'est l'adresse de réseau (bits machine à 0)." },
    { type: "qcm", q: "Pourquoi la découpe réseau/machine aide-t-elle les routeurs ?", opts: ["Ils mémorisent chaque machine du monde", "Ils raisonnent par réseau, pas machine par machine", "Elle supprime les adresses IP", "Elle attribue les masques automatiquement"], a: 1, exp: "Le routeur n'a qu'à connaître les réseaux : toutes les machines d'un réseau suivent le même chemin." },
    { type: "vf", q: "« Partie réseau » et « adresse de réseau » sont deux expressions strictement identiques.", a: false, exp: "Non : la partie réseau est un morceau de bits ; l'adresse de réseau est l'adresse complète avec bits machine à 0." },
    { type: "input", q: "Dans la découpe 11000000.10101000.00000001.00001010 avec 24 bits de réseau, combien de bits restent pour la partie machine ?", a: ["8", "huit"], ph: "un nombre", exp: "32 - 24 = 8 bits pour la partie machine." },
    { type: "qcm", q: "Dans l'analogie postale, la partie machine correspond à…", opts: ["Le nom de la rue", "Le nom de la ville", "Le numéro dans la rue", "Le code postal seul"], a: 2, exp: "Le numéro dans la rue distingue les voisins : c'est la partie machine." }
  ],
  final: {
    title: "Exercice final — Lire la découpe d'une adresse",
    intro: `<p>Dans une petite entreprise, trois postes portent les adresses <code>192.168.1.5</code>, <code>192.168.1.6</code> et <code>192.168.2.5</code>. La partie réseau s'étend sur les trois premiers octets. Analysons qui appartient au même réseau.</p>`,
    questions: [
      { type: "qcm", q: "Quelle est la partie réseau de 192.168.1.5 ?", opts: ["192", "192.168", "192.168.1", "5"], a: 2, exp: "La partie réseau s'étend sur les trois premiers octets : 192.168.1." },
      { type: "vf", q: "192.168.1.5 et 192.168.1.6 sont dans le même réseau.", a: true, exp: "Oui : même partie réseau (192.168.1), seule la partie machine diffère." },
      { type: "vf", q: "192.168.1.5 et 192.168.2.5 sont dans le même réseau.", a: false, exp: "Non : leurs parties réseau diffèrent (192.168.1 contre 192.168.2)." },
      { type: "input", q: "Quelle est la partie machine de 192.168.2.5 ?", a: ["5"], ph: "un nombre", exp: "La partie réseau est 192.168.2 ; la partie machine est 5." },
      { type: "qcm", q: "Pour que 192.168.2.5 parle à 192.168.1.6, il faut…", opts: ["Rien, elles se parlent déjà directement", "Passer par un routeur car ce sont deux réseaux différents", "Désactiver le masque de sous-réseau", "Ajouter une adresse de diffusion commune"], a: 1, exp: "Réseaux différents = passage obligé par un routeur (couche 3)." }
    ],
    solution: `<pre class="pseudo"># Partie reseau sur 3 octets :
192.168.1.5   -> reseau 192.168.1 , machine 5
192.168.1.6   -> reseau 192.168.1 , machine 6   (MEME reseau que 192.168.1.5)
192.168.2.5   -> reseau 192.168.2 , machine 5   (AUTRE reseau)

# Consequence :
.5 et .6 du reseau 192.168.1 se parlent directement.
Pour joindre 192.168.2.5, il faut traverser un ROUTEUR.</pre>
<p>La découpe est claire, mais qui décide qu'elle s'arrête au troisième octet ? Réponse demain : le masque de sous-réseau.</p>`
  }
};
</script>
