<script>
var DAY = {
  num: 30,
  title: "Pratique : router entre deux réseaux",
  subtitle: "Construire le pont qui laisse dialoguer deux réseaux séparés.",
  theory: `
<h3>1. Le problème : deux réseaux qui s'ignorent</h3>
<p>Deux machines sur des réseaux différents ne peuvent pas se parler directement. Un poste en <strong>192.168.1.0/24</strong> et un autre en <strong>192.168.2.0/24</strong> sont comme deux quartiers séparés : il faut un <strong>routeur</strong> pour faire le pont. Ce routeur possède une patte (interface) dans chaque réseau et transfère les paquets de l'un vers l'autre.</p>
<pre class="pseudo"># Le routeur a un pied dans chaque reseau :
Reseau A 192.168.1.0/24 ---[ 192.168.1.1 | ROUTEUR | 192.168.2.1 ]--- Reseau B 192.168.2.0/24
        PC-A 192.168.1.10                                   PC-B 192.168.2.10</pre>
<h3>2. Étape 1 : activer le routage (IP forwarding)</h3>
<p>Par défaut, un PC Linux ne transfère PAS les paquets qui ne lui sont pas destinés : il faut l'y autoriser. On active le <strong>routage IP</strong> (<em>IP forwarding</em>).</p>
<pre class="pseudo"># Linux, activer temporairement le routage :
sudo sysctl -w net.ipv4.ip_forward=1
# Verifier (doit afficher 1) :
cat /proc/sys/net/ipv4/ip_forward
# Rendre permanent : mettre  net.ipv4.ip_forward=1  dans /etc/sysctl.conf</pre>
<div class="tip">Sans forwarding activé, la machine reçoit bien le paquet destiné à l'autre réseau… puis le jette, car elle n'a pas le droit de le relayer. C'est l'oubli classique.</div>
<h3>3. Étape 2 : la passerelle de chaque poste</h3>
<p>Chaque PC doit savoir « pour sortir de mon réseau, j'envoie au routeur ». C'est sa <strong>passerelle par défaut</strong> (<em>default gateway</em>). PC-A doit avoir 192.168.1.1 comme passerelle ; PC-B doit avoir 192.168.2.1. Sinon, un PC ne saura pas vers qui envoyer un paquet destiné à l'autre réseau.</p>
<pre class="pseudo"># Sur PC-A (Linux) :
sudo ip route add default via 192.168.1.1
# Sur PC-B (Linux) :
sudo ip route add default via 192.168.2.1</pre>
<h3>4. Étape 3 : ajouter une route si nécessaire</h3>
<p>Le routeur, lui, connaît ses deux réseaux directement (une interface dans chacun). Mais si un chemin passe par un réseau plus lointain, on ajoute une <strong>route statique</strong> : « pour atteindre tel réseau, passe par tel routeur voisin ».</p>
<pre class="pseudo"># Ajouter une route vers un reseau distant (Linux) :
sudo ip route add 192.168.3.0/24 via 192.168.2.254
# Lire la table de routage :
ip route          # (Linux)
route print       # (Windows)</pre>
<h3>5. Étape 4 : tester avec ping</h3>
<p>On vérifie de proche en proche. Depuis PC-A : d'abord pinguer sa passerelle 192.168.1.1 (le routeur répond ?), puis l'autre patte du routeur 192.168.2.1, enfin PC-B en 192.168.2.10. Si le ping bloque à une étape, le problème est juste avant. Un traceroute confirme que le paquet passe bien <em>par</em> le routeur.</p>
<pre class="pseudo"># Depuis PC-A, tests progressifs :
ping 192.168.1.1     # ma passerelle (le routeur, cote A)
ping 192.168.2.1     # l'autre patte du routeur (cote B)
ping 192.168.2.10    # PC-B, sur l'autre reseau
traceroute 192.168.2.10   # doit montrer 192.168.1.1 en 1er saut</pre>
<div class="warn">Le routage doit être réciproque : PC-B doit AUSSI savoir revenir vers le réseau A (via sa passerelle 192.168.2.1). Un ping qui part mais ne revient pas trahit souvent une route de retour manquante.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Router entre 2 reseaux = 4 etapes :
# 1) Activer le forwarding : sysctl -w net.ipv4.ip_forward=1
# 2) Passerelle par defaut sur chaque PC : ip route add default via ROUTEUR
# 3) Ajouter les routes manquantes : ip route add RESEAU via VOISIN
# 4) Tester de proche en proche : ping passerelle -&gt; autre patte -&gt; PC distant
# Toujours verifier le chemin RETOUR (routage reciproque)</pre>`,
  exercises: [
    { type: "qcm", q: "Que faut-il pour faire communiquer deux réseaux IP différents ?", opts: ["Un switch simple", "Un routeur (une patte dans chaque réseau)", "Un concentrateur (hub)", "Rien, c'est automatique"], a: 1, exp: "Un routeur relie les réseaux ; il a une interface dans chacun." },
    { type: "input", q: "Sous Linux, quelle commande sysctl active le routage IPv4 (forwarding) ?", a: ["sudo sysctl -w net.ipv4.ip_forward=1", "sysctl -w net.ipv4.ip_forward=1", "net.ipv4.ip_forward=1"], ph: "sysctl ...", exp: "sysctl -w net.ipv4.ip_forward=1 active le forwarding." },
    { type: "vf", q: "Par défaut, un PC Linux transfère automatiquement les paquets destinés à un autre réseau.", a: false, exp: "Non : le forwarding est désactivé par défaut ; il faut l'activer." },
    { type: "qcm", q: "Comment appelle-t-on l'adresse « par où sortir de mon réseau » ?", opts: ["Le broadcast", "La passerelle par défaut (default gateway)", "Le masque", "Le DNS"], a: 1, exp: "La passerelle par défaut est la sortie vers les autres réseaux." },
    { type: "input", q: "Sous Linux, quelle commande définit 192.168.1.1 comme passerelle par défaut ?", a: ["sudo ip route add default via 192.168.1.1", "ip route add default via 192.168.1.1"], ph: "ip route add ...", exp: "ip route add default via 192.168.1.1 fixe la passerelle." },
    { type: "input", q: "Sous Linux, quelle commande affiche la table de routage ?", a: ["ip route", "ip route show", "ip r"], ph: "ip ...", exp: "ip route (ou ip route show) affiche les routes." },
    { type: "qcm", q: "Sous Windows, quelle commande affiche la table de routage ?", opts: ["route print", "ip route", "netplan", "arp -a"], a: 0, exp: "route print affiche la table de routage sous Windows." },
    { type: "qcm", q: "Une « route statique » ajoutée à la main sert à…", opts: ["annoncer automatiquement les routes aux routeurs voisins", "indiquer par quel routeur atteindre un réseau donné", "chiffrer le trafic", "vider le cache ARP"], a: 1, exp: "Elle dit : pour tel réseau, passe par tel routeur voisin." },
    { type: "vf", q: "Le routeur connaît directement les deux réseaux dans lesquels il a une interface.", a: true, exp: "Une interface par réseau = réseaux directement connectés, sans route à ajouter." },
    { type: "qcm", q: "Depuis PC-A, quel ping teste en premier ?", opts: ["Une IP publique", "Sa passerelle (le routeur, côté A)", "Un site web", "PC-B directement, sans étape"], a: 1, exp: "On teste d'abord la passerelle locale, puis on progresse vers la cible." },
    { type: "vf", q: "Le routage doit fonctionner dans les deux sens (aller ET retour).", a: true, exp: "Sans route de retour, la réponse ne revient pas : le ping échoue." },
    { type: "input", q: "Quel fichier lit-on (cat) pour vérifier que le forwarding vaut 1 ? (chemin sous /proc)", a: ["/proc/sys/net/ipv4/ip_forward", "cat /proc/sys/net/ipv4/ip_forward"], ph: "/proc/...", exp: "cat /proc/sys/net/ipv4/ip_forward doit afficher 1." },
    { type: "qcm", q: "Un ping qui « part mais ne revient pas » indique souvent…", opts: ["un masque de sous-réseau trop grand", "une route de retour manquante", "une adresse MAC en double sur le réseau", "un cache ARP expiré"], a: 1, exp: "La destination reçoit mais ne sait pas répondre : route de retour absente." },
    { type: "qcm", q: "Quel outil confirme que le paquet passe bien PAR le routeur (1er saut) ?", opts: ["traceroute", "arp -a", "ipconfig", "netplan"], a: 0, exp: "traceroute montre le routeur comme premier saut du chemin." },
    { type: "vf", q: "Rendre le forwarding permanent se fait en l'inscrivant dans /etc/sysctl.conf.", a: true, exp: "net.ipv4.ip_forward=1 dans /etc/sysctl.conf survit au redémarrage." }
  ],
  final: {
    title: "Exercice final — Relier le réseau bureaux et le réseau serveurs",
    intro: `<p>Un routeur Linux relie le réseau <strong>bureaux 192.168.1.0/24</strong> (patte 192.168.1.1) et le réseau <strong>serveurs 192.168.2.0/24</strong> (patte 192.168.2.1). PC-A (192.168.1.10) doit atteindre le serveur SRV-B (192.168.2.10).</p>`,
    questions: [
      { type: "input", q: "Sur le routeur, quelle commande active le transfert de paquets ?", a: ["sudo sysctl -w net.ipv4.ip_forward=1", "sysctl -w net.ipv4.ip_forward=1"], ph: "sysctl ...", exp: "Sans forwarding, le routeur ne relaie rien." },
      { type: "input", q: "Sur PC-A, quelle passerelle par défaut faut-il définir ? (commande ip route)", a: ["sudo ip route add default via 192.168.1.1", "ip route add default via 192.168.1.1"], ph: "ip route add default via ...", exp: "PC-A sort via la patte 192.168.1.1 du routeur." },
      { type: "qcm", q: "Sur SRV-B, quelle passerelle par défaut ?", opts: ["192.168.1.1", "192.168.2.1", "8.8.8.8", "aucune"], a: 1, exp: "SRV-B revient vers A via la patte 192.168.2.1 : routage réciproque." },
      { type: "qcm", q: "Depuis PC-A, dans quel ordre tester ?", opts: ["ping 192.168.2.10 directement", "ping 192.168.1.1, puis 192.168.2.1, puis 192.168.2.10", "ping 8.8.8.8 uniquement", "aucun test"], a: 1, exp: "De proche en proche : passerelle, autre patte, puis SRV-B." },
      { type: "vf", q: "Si PC-A n'a pas de passerelle et SRV-B non plus, le ping échouera malgré le forwarding activé.", a: true, exp: "Le forwarding ne suffit pas : chaque poste doit connaître sa passerelle." }
    ],
    solution: `<pre class="pseudo"># 1) Sur le ROUTEUR : activer le forwarding
sudo sysctl -w net.ipv4.ip_forward=1
cat /proc/sys/net/ipv4/ip_forward     # doit afficher 1
# 2) Passerelles des postes (routage reciproque) :
#    PC-A :  sudo ip route add default via 192.168.1.1
#    SRV-B:  sudo ip route add default via 192.168.2.1
# 3) (routes distantes si besoin) : ip route add RESEAU via VOISIN
# 4) Tests depuis PC-A :
ping 192.168.1.1     # passerelle cote A  (OK)
ping 192.168.2.1     # autre patte du routeur (OK)
ping 192.168.2.10    # SRV-B atteint !
traceroute 192.168.2.10   # 1er saut = 192.168.1.1</pre>
<p>Deux réseaux dialoguent enfin. Demain, projet final : concevoir de A à Z le plan d'adressage d'une PME.</p>`
  }
};
