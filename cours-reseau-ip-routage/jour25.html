var DAY = {

  title: "La table ARP et le cache",
  subtitle: "Comment ta machine traduit une adresse IP en adresse matérielle.",
  theory: `
<h3>1. Deux adresses pour une même carte</h3>
<p>Sur un réseau local, chaque carte réseau possède <strong>deux</strong> identités. La première est l'<strong>adresse IP</strong> (ex. 192.168.1.10) : logique, modifiable, utilisée pour router les paquets à travers Internet. La seconde est l'<strong>adresse MAC</strong> (en anglais <em>Media Access Control</em>, ex. a4:5e:60:1c:22:9f) : physique, gravée à la fabrication, utilisée pour livrer les trames <em>dans</em> le réseau local (le segment Ethernet ou Wi-Fi).</p>
<p>Le problème : quand ton PC veut parler à 192.168.1.20, la carte réseau ne sait pas envoyer « à l'IP ». Une trame Ethernet s'adresse à une <strong>MAC</strong>. Il faut donc traduire l'IP en MAC. C'est exactement le rôle d'<strong>ARP</strong> (<em>Address Resolution Protocol</em>).</p>
<h3>2. La table ARP : un carnet d'adresses</h3>
<p>Pour ne pas redemander la MAC à chaque paquet, le système garde les traductions dans une petite mémoire : la <strong>table ARP</strong>, aussi appelée <strong>cache ARP</strong>. C'est un carnet qui associe « telle IP → telle MAC → sur telle interface ». Tant qu'une entrée y figure, la machine envoie directement, sans rien redemander.</p>
<pre class="pseudo"># Idee : le cache ARP = un carnet local
Adresse IP        Adresse MAC          Type
192.168.1.1       00:1a:2b:3c:4d:5e    dynamique   (la box/passerelle)
192.168.1.20      a4:5e:60:1c:22:9f    dynamique   (un autre PC)</pre>
<h3>3. La commande arp -a</h3>
<p>Pour lire ce carnet, la commande est la même sur les trois systèmes : <strong>arp -a</strong> (« affiche toutes les entrées »). Elle liste, par interface, les IP connues et leur MAC.</p>
<pre class="pseudo"># Windows, Linux et macOS :
arp -a
# Exemple de sortie (Windows) :
Interface : 192.168.1.10 --- 0xb
  Adresse Internet      Adresse physique      Type
  192.168.1.1           00-1a-2b-3c-4d-5e     dynamique
  192.168.1.255         ff-ff-ff-ff-ff-ff     statique</pre>
<div class="tip">Sur Windows la MAC est écrite avec des tirets (00-1a-2b…), sous Linux/macOS avec des deux-points (00:1a:2b…). C'est la même adresse, juste un séparateur différent.</div>
<h3>4. Entrées dynamiques et entrées statiques</h3>
<p>Une entrée <strong>dynamique</strong> a été apprise automatiquement par ARP quand la machine a eu besoin de joindre cette IP. C'est le cas normal. Une entrée <strong>statique</strong> a été ajoutée à la main (ou correspond à une adresse spéciale comme le broadcast ff-ff-ff-ff-ff-ff) : elle ne s'apprend ni ne s'oublie toute seule. On crée une entrée statique pour figer une correspondance IP↔MAC, par exemple pour un test ou une sécurité.</p>
<h3>5. L'expiration du cache</h3>
<p>Un carnet ne doit pas rester faux éternellement : si un appareil change de carte réseau ou d'IP, l'ancienne correspondance devient invalide. C'est pourquoi les entrées <strong>dynamiques expirent</strong> après un délai (typiquement quelques minutes d'inactivité). Une fois expirée, l'entrée disparaît ; au prochain besoin, ARP refait une demande et réapprend la MAC à jour. Les entrées statiques, elles, n'expirent pas.</p>
<div class="warn">Ne confonds pas « dynamique » et « faux ». Une entrée dynamique est fiable ; elle est juste temporaire. L'expiration est une sécurité qui garde le carnet à jour, pas un défaut.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ARP = traduit une adresse IP en adresse MAC (sur le reseau local)
# Table / cache ARP = carnet IP -&gt; MAC, consultable avec :  arp -a
# Entree DYNAMIQUE = apprise automatiquement, EXPIRE apres un delai
# Entree STATIQUE  = ajoutee a la main, n'expire pas
# But du cache : eviter de redemander la MAC a chaque paquet</pre>`,

    { type: "qcm", q: "Pourquoi les entrées dynamiques expirent-elles ?", opts: ["Pour économiser la batterie", "Pour garder le carnet à jour si un appareil change d'IP ou de carte", "Pour ralentir le réseau", "Elles n'expirent jamais"], a: 1, exp: "L'expiration évite de conserver une correspondance IP↔MAC devenue fausse." },
    { type: "input", q: "Quel type d'entrée ARP est ajouté manuellement et ne s'oublie pas tout seul ?", a: ["statique", "statiques", "static"], ph: "un mot", exp: "Une entrée statique est ajoutée à la main et n'expire pas." },
    { type: "qcm", q: "Quelle adresse MAC correspond au broadcast (souvent listée comme statique) ?", opts: ["00-00-00-00-00-00", "ff-ff-ff-ff-ff-ff", "127-0-0-1-00-01", "aa-bb-cc-dd-ee-ff"], a: 1, exp: "ff-ff-ff-ff-ff-ff est l'adresse MAC de diffusion (broadcast)." },
    { type: "vf", q: "Le cache ARP évite de redemander la MAC pour chaque paquet envoyé à une même IP.", a: true, exp: "C'est tout l'intérêt du cache : garder les correspondances déjà apprises." },
    { type: "qcm", q: "Une adresse MAC est…", opts: ["logique et facilement modifiable", "physique, associée à la carte réseau", "attribuée par le fournisseur d'accès", "identique à l'adresse IP"], a: 1, exp: "La MAC est une adresse matérielle propre à la carte réseau." },
    { type: "input", q: "Complète : ARP traduit une adresse IP en adresse _____ .", a: ["mac", "physique", "matérielle", "materielle"], ph: "type d'adresse", exp: "ARP fournit l'adresse MAC (physique) correspondant à une IP." },
    { type: "qcm", q: "Que se passe-t-il après l'expiration d'une entrée dynamique, au prochain besoin de cette IP ?", opts: ["Le paquet est perdu définitivement", "ARP refait une demande et réapprend la MAC", "La machine redémarre", "L'entrée statique la remplace"], a: 1, exp: "ARP relance une résolution et met à jour le cache." },
    { type: "vf", q: "arp -a peut afficher des entrées classées par interface réseau.", a: true, exp: "La sortie regroupe les correspondances par interface (ex. 192.168.1.10)." }
  ],
  final: {
    title: "Exercice final — Lire le cache ARP d'un poste",
    intro: `<p>Sur son PC Windows en 192.168.1.10, Sami tape <code>arp -a</code> et lit :<br><code>192.168.1.1&nbsp;&nbsp;00-1a-2b-3c-4d-5e&nbsp;&nbsp;dynamique</code><br><code>192.168.1.255&nbsp;&nbsp;ff-ff-ff-ff-ff-ff&nbsp;&nbsp;statique</code></p>`,

    ],
