var DAY = {
  num: 20,
  title: "Le routeur : rôle et fonctionnement",
  subtitle: "La machine qui relie les réseaux entre eux et choisit par où faire passer chaque paquet.",
  theory: `
<h3>1. À quoi sert un routeur ?</h3>
<p>Un <strong>routeur</strong> (en anglais <em>router</em>) est un appareil qui <strong>interconnecte des réseaux différents</strong> et fait passer les paquets de l'un à l'autre. Sans routeur, chaque réseau serait une île isolée : les machines d'un réseau A ne pourraient jamais parler à celles d'un réseau B. Le routeur est le pont entre les îles.</p>
<p>Compare-le à un <strong>carrefour avec un agent de circulation</strong>. Chaque route qui arrive au carrefour est un réseau ; l'agent regarde la destination inscrite sur chaque véhicule (paquet) et l'oriente vers la bonne sortie. C'est exactement ce que fait un routeur : il <strong>aiguille</strong> les paquets vers le bon réseau suivant.</p>
<div class="tip">Un <strong>commutateur</strong> (switch) relie des machines à l'INTÉRIEUR d'un même réseau (il travaille avec les adresses MAC). Un <strong>routeur</strong> relie des réseaux DIFFÉRENTS entre eux (il travaille avec les adresses IP). Ce sont deux rôles distincts, souvent réunis dans une même box internet.</div>
<h3>2. Plusieurs interfaces, plusieurs réseaux</h3>
<p>Un routeur possède <strong>plusieurs interfaces</strong> (ports réseau), et chacune est branchée sur un réseau différent. Chaque interface a sa <strong>propre adresse IP</strong>, appartenant au réseau qu'elle dessert. Le routeur est donc, par nature, membre de plusieurs réseaux à la fois : c'est ce qui lui permet de faire le lien.</p>
<pre class="pseudo"># Un routeur R avec deux interfaces
Reseau A : 192.168.1.0/24
Reseau B : 10.0.0.0/24

       [Reseau A]                 [Reseau B]
   PC1 ---+                            +--- PC2
          |                            |
    192.168.1.1  <== Routeur R ==>  10.0.0.1
       (interface A)             (interface B)
# L'interface A porte une IP du reseau A, l'interface B une IP du reseau B.</pre>
<h3>3. La décision de routage</h3>
<p>Quand un paquet arrive, le routeur suit toujours la même logique :</p>
<pre class="pseudo"># Etapes d'un routeur pour chaque paquet recu
1) Lire l'adresse IP DESTINATION dans l'en-tete du paquet.
2) Chercher, dans sa TABLE DE ROUTAGE, le reseau qui correspond.
3) En deduire par quelle INTERFACE sortir et vers quel PROCHAIN routeur.
4) Decrementer le TTL de 1 (et jeter le paquet si TTL = 0).
5) Reconstruire la trame et l'envoyer sur l'interface de sortie.</pre>
<p>Le routeur ne s'intéresse qu'à la <strong>partie réseau</strong> de l'adresse de destination : il ne cherche pas la machine exacte tant que le paquet n'est pas arrivé sur le bon réseau final. Il agit saut par saut (en anglais <em>hop by hop</em>) : chaque routeur ne connaît que l'étape suivante, pas tout le chemin.</p>
<div class="warn">Un routeur ne modifie normalement PAS les données (le payload) du paquet. Il touche à l'en-tête (il décrémente le TTL, recalcule le checksum) et change l'enveloppe de niveau liaison (adresses MAC), mais le contenu transporté reste intact de bout en bout.</div>
<h3>4. La passerelle par défaut, vue de la machine</h3>
<p>Du point de vue d'un simple ordinateur, le routeur de son réseau s'appelle la <strong>passerelle par défaut</strong> (en anglais <em>default gateway</em>). Quand ta machine veut joindre une adresse qui n'est pas sur son propre réseau, elle ne sait pas router : elle confie simplement le paquet à sa passerelle, et lui fait confiance pour le faire suivre. Nous détaillerons ce mécanisme et la table de routage dans les prochains cours.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Routeur = interconnecte des reseaux DIFFERENTS (travaille en IP)
# Switch  = relie des machines d'un MEME reseau (travaille en MAC)
# Chaque interface du routeur = une IP dans un reseau different
# Decision de routage :
#   lire IP destination -> consulter la table -> choisir l'interface de sortie
#   -> decrementer le TTL -> reexpedier
# La machine simple envoie a sa "passerelle par defaut" ce qui sort du reseau local.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le rôle principal d'un routeur ?", opts: ["Relier des machines d'un même réseau", "Interconnecter des réseaux différents", "Stocker des fichiers", "Chiffrer les mots de passe"], a: 1, exp: "Le routeur interconnecte des réseaux différents et fait passer les paquets de l'un à l'autre." },
    { type: "qcm", q: "Sur quelle adresse un routeur fonde-t-il sa décision d'aiguillage ?", opts: ["L'adresse MAC source", "L'adresse IP de destination", "Le numéro de port", "La couleur du câble"], a: 1, exp: "Le routeur lit l'IP de destination pour chercher le bon réseau dans sa table." },
    { type: "vf", q: "Un routeur et un commutateur (switch) font exactement le même travail.", a: false, exp: "Non : le switch relie des machines d'un même réseau (MAC) ; le routeur relie des réseaux différents (IP)." },

    { type: "qcm", q: "Combien d'interfaces réseau possède typiquement un routeur ?", opts: ["Une seule", "Plusieurs, une par réseau relié", "Toujours exactement 256", "Aucune"], a: 1, exp: "Un routeur a plusieurs interfaces, chacune branchée sur un réseau différent." },
    { type: "vf", q: "Chaque interface d'un routeur possède sa propre adresse IP dans le réseau qu'elle dessert.", a: true, exp: "Oui : c'est ce qui fait du routeur un membre de plusieurs réseaux à la fois." },
    { type: "qcm", q: "Que consulte le routeur pour savoir où envoyer un paquet ?", opts: ["Sa table de routage", "Son écran", "Le fichier hosts", "La MTU"], a: 0, exp: "Le routeur consulte sa table de routage pour trouver l'interface de sortie." },
    { type: "vf", q: "Un routeur décrémente le TTL de chaque paquet qu'il fait suivre.", a: true, exp: "Oui : à chaque saut, le routeur retire 1 au TTL (et jette le paquet si TTL=0)." },
    { type: "qcm", q: "Que signifie « routage saut par saut » (hop by hop) ?", opts: ["Le routeur connaît tout le chemin d'avance", "Chaque routeur ne connaît que l'étape suivante", "Le paquet saute des réseaux", "Le TTL double à chaque saut"], a: 1, exp: "Chaque routeur ne décide que du prochain saut, sans connaître l'itinéraire complet." },
    { type: "qcm", q: "Un routeur touche-t-il aux données (payload) transportées ?", opts: ["Oui, il les modifie toujours", "Non, il ne modifie normalement pas le contenu", "Oui, il les chiffre", "Oui, il les compresse"], a: 1, exp: "Le routeur modifie l'en-tête (TTL, checksum) mais pas les données transportées." },
    { type: "input", q: "Quel appareil relie les machines à l'intérieur d'un même réseau en utilisant les adresses MAC ?", a: ["commutateur", "switch", "le switch", "le commutateur"], ph: "un mot", exp: "Le commutateur (switch) relie les machines d'un même réseau via les adresses MAC." },
    { type: "vf", q: "Le routeur cherche la machine exacte de destination dès le premier saut.", a: false, exp: "Non : il s'occupe d'abord de la partie réseau ; la machine exacte est trouvée sur le réseau final." },
    { type: "qcm", q: "Une box internet domestique…", opts: ["Ne peut être qu'un switch", "Ne peut être qu'un routeur", "Réunit souvent les rôles de routeur et de switch", "N'a aucune fonction réseau"], a: 2, exp: "Une box grand public combine généralement routeur, switch et point d'accès Wi-Fi." },
    { type: "input", q: "Dans un schéma, l'interface d'un routeur reliée au réseau 10.0.0.0/24 a l'adresse 10.0.0.1. À quel réseau appartient cette interface ? (format x.x.x.x/n)", a: ["10.0.0.0/24"], ph: "x.x.x.x/n", exp: "L'IP 10.0.0.1 appartient au réseau 10.0.0.0/24 desservi par cette interface." },
    { type: "qcm", q: "Analogie correcte du routeur ?", opts: ["Un disque dur", "Un agent de circulation à un carrefour", "Un antivirus", "Un clavier"], a: 1, exp: "Le routeur aiguille les paquets comme un agent oriente les véhicules à un carrefour." }
  ],
  final: {
    title: "Exercice final — Deux réseaux, un routeur",
    intro: `<p>Le routeur R relie le réseau A (<code>192.168.1.0/24</code>, interface 192.168.1.1) et le réseau B (<code>10.0.0.0/24</code>, interface 10.0.0.1). PC1 (192.168.1.50) veut envoyer un paquet à PC2 (10.0.0.80). Suivons le trajet.</p>`,
    questions: [
      { type: "vf", q: "PC1 et PC2 sont sur le même réseau IP.", a: false, exp: "Non : 192.168.1.0/24 et 10.0.0.0/24 sont deux réseaux différents, d'où le besoin d'un routeur." },
      { type: "qcm", q: "À qui PC1 remet-il le paquet en premier ?", opts: ["Directement à PC2", "À sa passerelle par défaut, l'interface 192.168.1.1 du routeur", "À aucun, c'est impossible", "Au serveur DNS"], a: 1, exp: "PC2 étant hors du réseau local, PC1 confie le paquet à sa passerelle (192.168.1.1)." },
      { type: "input", q: "Le routeur lit l'IP destination 10.0.0.80. Par quelle interface va-t-il ressortir le paquet ? (format x.x.x.x)", a: ["10.0.0.1"], ph: "x.x.x.x", exp: "10.0.0.80 est sur le réseau B : le routeur sort par son interface 10.0.0.1." },
      { type: "vf", q: "En traversant le routeur, le TTL du paquet est décrémenté de 1.", a: true, exp: "Oui : chaque routeur traversé retire 1 au TTL." },
      { type: "qcm", q: "Le contenu (payload) du paquet, en traversant R…", opts: ["Est chiffré par R", "Reste inchangé", "Est supprimé", "Est doublé"], a: 1, exp: "Le routeur modifie l'en-tête (TTL) mais laisse les données intactes." }
    ],
    solution: `<pre class="pseudo"># Trajet PC1 (192.168.1.50) -> PC2 (10.0.0.80)
1) PC1 voit que 10.0.0.80 n'est PAS sur son reseau (192.168.1.0/24).
2) Il envoie le paquet a sa passerelle : 192.168.1.1 (interface A du routeur).
3) R lit l'IP dest 10.0.0.80 -> reseau B (10.0.0.0/24) -> sortie interface B (10.0.0.1).
4) R decremente le TTL de 1, recalcule le checksum de l'en-tete.
5) R livre le paquet a PC2 sur le reseau B. Les donnees restent intactes.</pre>
<p>Le routeur a fait son travail : relier deux réseaux distincts et aiguiller le paquet vers la bonne sortie. Reste à comprendre comment il « sait » tout cela : c'est la table de routage, au prochain cours.</p>`
  }
};
