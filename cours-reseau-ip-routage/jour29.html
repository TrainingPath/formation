var DAY = {
  num: 29,
  title: "Pratique : configurer une IP fixe",
  subtitle: "Donner à une machine une adresse qui ne change jamais.",
  theory: `
<h3>1. Pourquoi une IP fixe ?</h3>
<p>Par défaut, la plupart des machines reçoivent leur adresse automatiquement du <strong>DHCP</strong> (le serveur qui distribue les IP, souvent la box). Pratique, mais l'adresse peut changer. Pour un serveur, une imprimante ou un appareil qu'on veut toujours joindre à la même adresse, on fixe l'IP manuellement : c'est une <strong>IP fixe</strong> (ou statique).</p>
<h3>2. Les quatre paramètres indispensables</h3>
<p>Configurer une IP fixe, c'est renseigner quatre valeurs cohérentes. Oublier la passerelle ou le DNS est la cause n°1 des « ça ne marche pas ».</p>
<pre class="pseudo"># Les 4 reglages :
Adresse IP    : 192.168.1.50      (unique dans le reseau)
Masque        : 255.255.255.0     (ou /24)  -&gt; definit le reseau
Passerelle    : 192.168.1.1       (la sortie vers les autres reseaux)
DNS           : 192.168.1.1 ou 8.8.8.8  (pour resoudre les noms)</pre>
<div class="warn">L'IP fixe choisie doit être dans le bon réseau, libre, et de préférence hors de la plage distribuée par le DHCP, sinon deux machines pourraient recevoir la même adresse (conflit d'IP).</div>
<h3>3. Windows : par les paramètres ou en ligne de commande</h3>
<p>En graphique : Paramètres → Réseau et Internet → Propriétés de la connexion → Modifier l'attribution IP → Manuel, puis on saisit les quatre valeurs. En ligne de commande, on utilise <strong>netsh</strong> (invite en administrateur).</p>
<pre class="pseudo"># Windows, invite Admin, netsh :
netsh interface ip set address name="Ethernet" static 192.168.1.50 255.255.255.0 192.168.1.1
netsh interface ip set dns name="Ethernet" static 8.8.8.8
# Verifier :
ipconfig /all</pre>
<h3>4. Linux : ip addr (temporaire) ou netplan (permanent)</h3>
<p>Pour un réglage <strong>immédiat mais temporaire</strong> (perdu au redémarrage), on utilise <strong>ip addr</strong>. Pour un réglage <strong>permanent</strong> sur les distributions modernes type Ubuntu, on édite un fichier <strong>netplan</strong> (en YAML) puis on l'applique.</p>
<pre class="pseudo"># Temporaire (Linux) :
sudo ip addr add 192.168.1.50/24 dev eth0
sudo ip route add default via 192.168.1.1
# Verifier :
ip addr show
# Permanent (Ubuntu, /etc/netplan/01-netcfg.yaml) :
network:
  version: 2
  ethernets:
    eth0:
      addresses: [192.168.1.50/24]
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [8.8.8.8]
# Appliquer :
sudo netplan apply</pre>
<div class="tip">Sous Linux, le masque s'écrit souvent en notation CIDR : /24 équivaut à 255.255.255.0. C'est plus court et sans ambiguïté.</div>
<h3>5. Vérifier que ça marche</h3>
<p>Après configuration, trois tests s'enchaînent : lire l'adresse obtenue (<strong>ipconfig</strong> sous Windows, <strong>ip addr</strong> sous Linux), pinguer la <strong>passerelle</strong> (réseau local OK ?), puis pinguer une IP publique comme <strong>8.8.8.8</strong> (sortie Internet OK ?). Si le ping vers 8.8.8.8 marche mais pas vers un nom de site, c'est le <strong>DNS</strong> qui est mal réglé.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IP fixe = 4 reglages : adresse + masque + passerelle + DNS
# Windows : Parametres (manuel) ou  netsh interface ip set address ...
# Linux   : ip addr add ... (temporaire) | netplan + netplan apply (permanent)
# Verifier : ipconfig /all  (Win)  |  ip addr show  (Linux)
# Tester : ping passerelle -&gt; ping 8.8.8.8 -&gt; ping un nom (teste le DNS)</pre>`,

    { type: "qcm", q: "Par défaut, comment une machine reçoit-elle généralement son IP ?", opts: ["À la main", "Automatiquement via DHCP", "Par ARP", "Par ICMP"], a: 1, exp: "Le DHCP distribue automatiquement les adresses IP." },

    { type: "qcm", q: "Sur Ubuntu, quel fichier (format YAML) sert à une config IP permanente ?", opts: ["hosts", "un fichier netplan", "resolv.conf uniquement", "arp.conf"], a: 1, exp: "Netplan (YAML dans /etc/netplan/) définit la config permanente." },

    { type: "vf", q: "« sudo ip addr add 192.168.1.50/24 dev eth0 » donne une adresse permanente qui survit au redémarrage.", a: false, exp: "Non : ip addr add est temporaire ; c'est perdu au redémarrage. Pour du permanent, utiliser netplan." },
    { type: "qcm", q: "En notation CIDR, /24 correspond à quel masque ?", opts: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"], a: 2, exp: "/24 = 255.255.255.0." },
    { type: "qcm", q: "Après config, quel test vérifie d'abord le réseau local ?", opts: ["Pinguer 8.8.8.8", "Pinguer la passerelle", "Ouvrir un navigateur", "Redémarrer"], a: 1, exp: "Pinguer la passerelle confirme que le local est bon avant de tester Internet." },
    { type: "vf", q: "Si ping 8.8.8.8 fonctionne mais pas ping vers un nom de site, c'est probablement le DNS.", a: true, exp: "L'IP marche mais la résolution de noms échoue → problème DNS." },
    { type: "input", q: "Quelle IP publique de Google est souvent utilisée pour tester la sortie Internet ?", a: ["8.8.8.8"], ph: "une IP", exp: "8.8.8.8 est le résolveur public de Google, pratique pour tester." },
    { type: "qcm", q: "Pourquoi choisir une IP fixe hors de la plage DHCP ?", opts: ["Parce que le DHCP interdit les adresses hors de sa plage", "Pour éviter qu'elle soit aussi attribuée à une autre machine (conflit d'IP)", "Pour obtenir automatiquement le bon masque de sous-réseau", "Ce n'est pas nécessaire"], a: 1, exp: "Hors plage DHCP, on évite qu'une même adresse soit distribuée en double." },
    { type: "vf", q: "Oublier la passerelle empêche la machine de joindre d'autres réseaux (Internet).", a: true, exp: "Sans passerelle, le trafic sortant ne trouve pas la sortie du réseau." }
  ],

    intro: `<p>On doit donner au serveur de fichiers une IP fixe : <strong>192.168.1.50</strong>, masque <strong>/24</strong>, passerelle <strong>192.168.1.1</strong>, DNS <strong>8.8.8.8</strong>. Le réseau existe déjà et la plage DHCP va de .100 à .200.</p>`,
    questions: [
      { type: "vf", q: "L'adresse .50 est bien hors de la plage DHCP (.100 à .200).", a: true, exp: ".50 est en dehors de 100-200 : pas de risque de conflit avec le DHCP." },
      { type: "input", q: "Sous Linux, quelle commande fixe l'adresse de façon temporaire sur eth0 ? (avec /24)", a: ["sudo ip addr add 192.168.1.50/24 dev eth0", "ip addr add 192.168.1.50/24 dev eth0"], ph: "ip addr add ...", exp: "sudo ip addr add 192.168.1.50/24 dev eth0 pose l'IP temporairement." },
      { type: "input", q: "Toujours sous Linux, quelle commande ajoute la passerelle par défaut ?", a: ["sudo ip route add default via 192.168.1.1", "ip route add default via 192.168.1.1"], ph: "ip route add ...", exp: "ip route add default via 192.168.1.1 définit la sortie." },
      { type: "qcm", q: "Pour rendre la config permanente sur Ubuntu, on…", opts: ["retape ip addr à chaque démarrage", "édite un fichier netplan puis « sudo netplan apply »", "supprime la carte réseau", "utilise tracert"], a: 1, exp: "Netplan + netplan apply rend le réglage durable." },
      { type: "qcm", q: "Dernier test recommandé après config ?", opts: ["ping passerelle, puis ping 8.8.8.8, puis ping un nom", "rien", "vider le cache ARP", "changer le masque"], a: 0, exp: "On teste le local, puis Internet, puis le DNS (via un nom)." }
    ],
    solution: `<pre class="pseudo"># Config Linux du serveur (temporaire pour tester) :
sudo ip addr add 192.168.1.50/24 dev eth0
sudo ip route add default via 192.168.1.1
# Verifier :
ip addr show ; ip route
# Rendre permanent (Ubuntu, /etc/netplan/01-netcfg.yaml) :
#   addresses: [192.168.1.50/24]
#   routes: [{ to: default, via: 192.168.1.1 }]
#   nameservers: { addresses: [8.8.8.8] }
sudo netplan apply
# Tests : ping 192.168.1.1  ->  ping 8.8.8.8  ->  ping un.nom.de.site
# (Equivalent Windows : netsh interface ip set address ... / ipconfig /all)</pre>
<p>Une machine a maintenant une adresse stable. Demain : faire communiquer deux réseaux différents grâce au routage.</p>`
  }
};
