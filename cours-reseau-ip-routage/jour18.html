<script>
var DAY = {
  num: 18,
  title: "Le protocole IP : l'en-tête",
  subtitle: "Ouvrir l'enveloppe d'un paquet et lire les informations qui le guident sur le réseau.",
  theory: `
<h3>1. Un paquet, c'est une lettre avec une en-tête</h3>
<p>Le protocole <strong>IP</strong> (en anglais <em>Internet Protocol</em>) transporte les données de bout en bout à travers Internet. Chaque unité transportée s'appelle un <strong>paquet</strong> (en anglais <em>packet</em>). Comme une lettre postale, un paquet a deux parties : l'<strong>en-tête</strong> (en anglais <em>header</em>), qui contient les informations de livraison, et les <strong>données</strong> (en anglais <em>payload</em>, la charge utile). L'en-tête, c'est l'enveloppe : elle dit d'où vient le paquet, où il va, et comment le traiter.</p>
<p>Nous étudions ici l'en-tête d'<strong>IPv4</strong>, la version historique et encore très répandue. Elle mesure au minimum 20 octets. Chaque champ a un rôle précis. Voyons les plus importants.</p>
<h3>2. Version, source et destination</h3>
<p>Le champ <strong>Version</strong> (4 bits) indique la version du protocole : la valeur <strong>4</strong> pour IPv4, la valeur <strong>6</strong> pour IPv6. Un routeur lit ce champ pour savoir comment interpréter le reste.</p>
<p>Les deux champs les plus essentiels sont l'<strong>adresse IP source</strong> (32 bits) et l'<strong>adresse IP destination</strong> (32 bits). La source dit « qui envoie », la destination dit « à qui livrer ». Ce sont ces deux adresses que les routeurs regardent, à chaque étape, pour décider où faire suivre le paquet.</p>
<pre class="pseudo"># Vue simplifiee de l'en-tete IPv4 (champs cles)
+-----------+------+---------------------+
| Version=4 | ...  | Longueur totale     |
+-----------+------+---------------------+
| Identifiant  | Flags | Decalage fragment |
+-----------+------+---------------------+
| TTL = 64  | Protocole = 6 | Checksum   |
+-----------+------+---------------------+
| Adresse IP SOURCE        (32 bits)     |
+----------------------------------------+
| Adresse IP DESTINATION   (32 bits)     |
+----------------------------------------+
| ... donnees (payload) ...              |</pre>
<h3>3. Le TTL : la durée de vie</h3>
<p>Le champ <strong>TTL</strong> (en anglais <em>Time To Live</em>, « durée de vie ») fait <strong>8 bits</strong> : il peut donc aller de 0 à 255. Ce n'est pas vraiment un temps, mais un <strong>compteur de sauts</strong> : chaque routeur traversé le <strong>décrémente de 1</strong>. Quand le TTL atteint 0, le paquet est détruit et un message d'erreur (ICMP « temps dépassé ») revient à l'expéditeur.</p>
<div class="tip">Le TTL est une sécurité anti-boucle : si une erreur de routage faisait tourner un paquet en rond, il finirait par atteindre 0 et disparaître, au lieu de saturer le réseau pour toujours. C'est exactement ce mécanisme qu'exploite la commande <code>traceroute</code> pour cartographier les routeurs d'un chemin.</p></div>
<h3>4. Le champ Protocole : que transporte le paquet ?</h3>
<p>Le champ <strong>Protocole</strong> indique ce que contient la charge utile, c'est-à-dire quel protocole de niveau supérieur est encapsulé. Trois valeurs à connaître par cœur :</p>
<pre class="pseudo"># Champ "Protocole" de l'en-tete IPv4 : valeurs frequentes
1   -> ICMP  (messages de controle : ping, erreurs)
6   -> TCP   (transport fiable : web, mail, fichiers)
17  -> UDP   (transport rapide sans garantie : DNS, streaming)</pre>
<p>Grâce à ce champ, la machine réceptrice sait à quel module remettre les données : au module TCP si c'est 6, au module UDP si c'est 17, etc. Il y a aussi une <strong>somme de contrôle</strong> (en anglais <em>checksum</em>) qui vérifie que l'en-tête n'a pas été corrompue en chemin.</p>
<div class="warn">Attention : le champ Protocole décrit ce que transporte IP, pas un numéro de port. TCP=6 et UDP=17 sont des numéros de PROTOCOLE dans l'en-tête IP, à ne pas confondre avec les numéros de port (comme 80 ou 443) qui, eux, se trouvent dans l'en-tête TCP/UDP.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># En-tete IPv4 : l'enveloppe du paquet (min. 20 octets)
Version   = 4 (IPv4) ou 6 (IPv6)
IP source / IP destination = qui envoie / a qui livrer (32 bits chacune)
TTL       = 8 bits (0 a 255), -1 a chaque routeur, detruit a 0 (anti-boucle)
Protocole = contenu : 1=ICMP, 6=TCP, 17=UDP
Checksum  = verifie l'integrite de l'en-tete</pre>`,
  exercises: [
    { type: "qcm", q: "Que contient l'en-tête (header) d'un paquet IP ?", opts: ["Uniquement les données", "Les informations de livraison (source, destination, etc.)", "Uniquement les numéros de port source et destination", "L'adresse MAC de la carte réseau"], a: 1, exp: "L'en-tête est l'enveloppe : elle porte les infos de livraison. Les données sont dans le payload." },
    { type: "qcm", q: "Quelle valeur du champ Version correspond à IPv4 ?", opts: ["1", "4", "6", "8"], a: 1, exp: "Le champ Version vaut 4 pour IPv4 (et 6 pour IPv6)." },
    { type: "input", q: "Sur combien de bits est codé le champ TTL ?", a: ["8", "8 bits", "huit"], ph: "un nombre", exp: "Le TTL fait 8 bits, donc une valeur de 0 à 255." },
    { type: "qcm", q: "Que fait chaque routeur au champ TTL d'un paquet qu'il fait suivre ?", opts: ["Il l'augmente de 1", "Il le décrémente de 1", "Il le met à 255", "Il ne le touche pas"], a: 1, exp: "Chaque routeur décrémente le TTL de 1. À 0, le paquet est détruit." },
    { type: "input", q: "Quelle valeur du champ Protocole désigne TCP ?", a: ["6", "six"], ph: "un nombre", exp: "TCP = 6 dans le champ Protocole de l'en-tête IPv4." },
    { type: "input", q: "Quelle valeur du champ Protocole désigne UDP ?", a: ["17", "dix-sept"], ph: "un nombre", exp: "UDP = 17 dans le champ Protocole de l'en-tête IPv4." },
    { type: "qcm", q: "Quelle valeur du champ Protocole désigne ICMP ?", opts: ["1", "6", "17", "80"], a: 0, exp: "ICMP = 1. C'est le protocole des messages de contrôle (ping, erreurs)." },
    { type: "vf", q: "Le TTL peut atteindre au maximum la valeur 255.", a: true, exp: "Oui : 8 bits permettent une valeur de 0 à 255." },
    { type: "qcm", q: "Que se passe-t-il quand le TTL atteint 0 ?", opts: ["Le paquet accélère", "Le paquet est détruit et une erreur ICMP revient", "Le paquet est dupliqué", "Rien"], a: 1, exp: "À TTL=0, le routeur jette le paquet et renvoie un message ICMP « temps dépassé »." },
    { type: "vf", q: "Les champs IP source et IP destination font chacun 32 bits en IPv4.", a: true, exp: "Oui : une adresse IPv4 fait 32 bits ; source et destination en font donc 32 chacune." },
    { type: "qcm", q: "À quoi sert le champ Protocole de l'en-tête IP ?", opts: ["À indiquer la vitesse", "À dire quel protocole est transporté (TCP, UDP, ICMP…)", "À chiffrer les données", "À donner le numéro de port"], a: 1, exp: "Il indique le contenu : la machine sait ainsi à quel module remettre les données." },
    { type: "vf", q: "TCP=6 est un numéro de port.", a: false, exp: "Non : 6 est un numéro de PROTOCOLE dans l'en-tête IP, pas un numéro de port." },
    { type: "input", q: "Comment appelle-t-on le champ qui vérifie l'intégrité de l'en-tête ? (mot anglais courant)", a: ["checksum", "somme de controle", "somme de contrôle"], ph: "un mot", exp: "Le checksum (somme de contrôle) détecte une en-tête corrompue." },
    { type: "qcm", q: "Le champ TTL sert principalement à…", opts: ["Mesurer le temps de trajet en secondes", "Empêcher qu'un paquet tourne en boucle à l'infini", "Indiquer le protocole de transport (TCP/UDP)", "Fragmenter le paquet si nécessaire"], a: 1, exp: "Le TTL est une sécurité anti-boucle : il finit par tomber à 0 si le paquet tourne en rond." },
    { type: "input", q: "Quelle commande exploite le TTL pour lister les routeurs d'un chemin ?", a: ["traceroute", "tracert"], ph: "une commande", exp: "traceroute (tracert sous Windows) fait varier le TTL pour révéler chaque routeur du trajet." }
  ],
  final: {
    title: "Exercice final — Décoder un paquet capturé",
    intro: `<p>Un analyseur réseau capture un paquet IPv4. On lit dans son en-tête : Version = 4, IP source = 10.0.0.5, IP destination = 8.8.8.8, TTL = 64, Protocole = 17. Interprète cette en-tête.</p>`,
    questions: [
      { type: "qcm", q: "Quelle version d'IP est utilisée ?", opts: ["IPv6", "IPv4", "IPv2", "Impossible à dire"], a: 1, exp: "Version = 4 signifie IPv4." },
      { type: "input", q: "Quel protocole transporte ce paquet (nom) d'après le champ Protocole = 17 ?", a: ["udp", "l'udp"], ph: "un nom", exp: "17 correspond à UDP." },
      { type: "qcm", q: "Qui est l'expéditeur du paquet ?", opts: ["8.8.8.8", "10.0.0.5", "64", "17"], a: 1, exp: "L'IP source (10.0.0.5) est l'expéditeur ; 8.8.8.8 est la destination." },
      { type: "vf", q: "Si ce paquet traverse 3 routeurs, son TTL passera de 64 à 61.", a: true, exp: "Chaque routeur retire 1 : 64 − 3 = 61." },
      { type: "qcm", q: "Combien de routeurs, au maximum, ce paquet pourrait-il traverser avant destruction ?", opts: ["17", "64", "255", "8"], a: 1, exp: "Le TTL de départ (64) fixe le nombre maximal de sauts : il atteindrait 0 après 64 routeurs." }
    ],
    solution: `<pre class="pseudo"># Lecture de l'en-tete :
Version   = 4        -> IPv4
IP source = 10.0.0.5 -> l'expediteur
IP dest.  = 8.8.8.8  -> le destinataire (serveur DNS de Google)
TTL       = 64       -> 64 sauts max ; -1 par routeur
Protocole = 17       -> UDP (typique d'une requete DNS)</pre>
<p>En quelques champs, on sait tout du voyage prévu du paquet : sa version, ses deux extrémités, sa durée de vie et son contenu. C'est le rôle de l'en-tête IP.</p>`
  }
};
</script>
