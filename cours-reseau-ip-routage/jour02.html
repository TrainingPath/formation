var DAY = {
  num: 2,
  title: "L'adresse IP : structure et rôle",
  subtitle: "Une adresse logique pour localiser et joindre n'importe quelle machine.",
  theory: `
<h3>1. Deux adresses pour une même carte réseau</h3>
<p>Chaque machine connectée possède en réalité <strong>deux adresses</strong> qui coexistent. La première est l'<strong>adresse MAC</strong> (en anglais <em>Media Access Control</em>) : elle est gravée dans la carte réseau à l'usine, ne change pas, et sert aux échanges à l'intérieur d'un même réseau local. La seconde est l'<strong>adresse IP</strong> (en anglais <em>Internet Protocol address</em>) : elle est attribuée par le réseau, peut changer, et sert à localiser la machine à travers l'ensemble d'Internet.</p>
<p>Pourquoi deux adresses ? Parce qu'elles répondent à deux questions différentes. La MAC répond à « <strong>qui</strong> es-tu ? » : c'est une identité fixe. L'IP répond à « <strong>où</strong> es-tu ? » : c'est une position dans le grand plan du réseau. On a besoin des deux, comme on a besoin à la fois d'un nom (qui) et d'une adresse postale (où) pour recevoir du courrier.</p>
<h3>2. Adresse physique contre adresse logique</h3>
<pre class="pseudo"># Adresse MAC (physique, couche 2)
Exemple : 00:1A:2B:3C:4D:5E   -> 48 bits, en usine, ne change pas.
Role : identifier une carte reseau DANS un reseau local.

# Adresse IP (logique, couche 3)
Exemple : 192.168.1.10        -> attribuee par le reseau, peut changer.
Role : localiser une machine A TRAVERS les reseaux (routage).</pre>
<p>La MAC est dite <strong>physique</strong> car liée au matériel. L'IP est dite <strong>logique</strong> car décidée par configuration, indépendamment du matériel. Si tu débranches ton ordinateur du réseau de l'école pour le brancher chez toi, sa MAC reste identique, mais son IP change : il a « déménagé » dans un autre réseau.</p>
<div class="tip">Analogie : la MAC est le numéro de série imprimé sur ton téléphone (fixe, unique). L'IP est le numéro de téléphone qu'on t'attribue (il peut changer d'opérateur en opérateur, mais c'est lui qui permet de t'appeler d'où que ce soit).</div>
<h3>3. À quoi sert précisément l'adresse IP</h3>
<p>L'adresse IP remplit deux rôles indissociables. D'abord <strong>identifier</strong> : dans un réseau donné, chaque machine a une IP unique, sinon les paquets ne sauraient plus à qui aller. Ensuite <strong>localiser</strong> : l'IP est construite de façon organisée, ce qui permet aux routeurs de savoir dans quelle direction envoyer un paquet. C'est cette organisation qui distingue radicalement l'IP de la MAC.</p>
<p>Concrètement, quand tu tapes une adresse de site, ton ordinateur finit toujours par obtenir une adresse IP, puis il construit un <strong>paquet</strong> (en anglais <em>packet</em>) dans lequel figurent l'IP de départ (source) et l'IP d'arrivée (destination). Ce paquet voyage de routeur en routeur jusqu'à destination.</p>
<h3>4. La structure : deux parties dans une même adresse</h3>
<p>Voici l'idée-clé de tout l'adressage : une adresse IP n'est pas un simple numéro isolé. Elle se découpe en <strong>deux parties</strong>. La première désigne le <strong>réseau</strong> (le « quartier »), la seconde désigne la <strong>machine</strong> (le « numéro dans la rue », en anglais on parle d'<em>host</em>, l'hôte).</p>
<pre class="pseudo"># Une adresse IP = partie RESEAU + partie MACHINE
192.168.1 . 10
[--reseau--] [machine]
Toutes les machines d'un meme reseau partagent la meme partie reseau.
Seule la partie machine les distingue les unes des autres.</pre>
<p>Cette découpe est ce qui rend le routage efficace : un routeur n'a pas besoin de connaître chaque machine du monde, il lui suffit de savoir vers quel <strong>réseau</strong> envoyer le paquet. Nous détaillerons cette découpe dans les jours suivants ; aujourd'hui, retiens seulement qu'elle existe.</p>
<div class="warn">Deux machines du même réseau ne doivent JAMAIS avoir la même IP : c'est un « conflit d'adresses » qui empêche les échanges. Chaque IP doit être unique dans son réseau.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># MAC = adresse PHYSIQUE (usine, fixe) -> "qui" -> couche 2, dans le LAN.
# IP  = adresse LOGIQUE (config, mobile) -> "ou" -> couche 3, entre reseaux.
# L'IP sert a IDENTIFIER (unique) et a LOCALISER (routage).
# Une IP se decoupe en 2 parties : RESEAU + MACHINE (host).
# Une IP doit etre unique dans son reseau (sinon conflit d'adresses).</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle adresse est gravée en usine dans la carte réseau ?", opts: ["L'adresse IP", "L'adresse MAC", "L'adresse de réseau", "L'adresse de passerelle"], a: 1, exp: "La MAC est physique et fixe, inscrite en usine. L'IP est logique et attribuée par le réseau." },
    { type: "qcm", q: "L'adresse IP répond surtout à quelle question ?", opts: ["Qui es-tu ?", "Où es-tu ?", "Quel constructeur t'a fabriqué ?", "Quel est ton numéro de série ?"], a: 1, exp: "L'IP localise (« où »). La MAC identifie (« qui »)." },
    { type: "vf", q: "L'adresse MAC change quand on branche l'ordinateur sur un autre réseau.", a: false, exp: "Non : la MAC reste identique. C'est l'IP qui change quand on « déménage » de réseau." },
    { type: "input", q: "Comment qualifie-t-on l'adresse IP par opposition à l'adresse MAC dite « physique » ?", a: ["logique", "adresse logique"], ph: "un adjectif", exp: "L'IP est logique : décidée par configuration, indépendamment du matériel." },

    { type: "vf", q: "Toutes les machines d'un même réseau partagent la même partie « réseau » de l'adresse IP.", a: true, exp: "Oui : elles partagent la partie réseau et se distinguent par la partie machine." },
    { type: "qcm", q: "Que se passe-t-il si deux machines du même réseau ont la même IP ?", opts: ["Rien, c'est autorisé", "Un conflit d'adresses qui empêche les échanges", "Le routeur leur attribue automatiquement une passerelle", "Le masque de sous-réseau s'ajuste tout seul"], a: 1, exp: "Deux IP identiques dans un réseau créent un conflit : chaque IP doit être unique." },
    { type: "input", q: "Comment appelle-t-on (en anglais) la machine désignée par la partie « machine » de l'adresse ?", a: ["host", "hote", "hôte", "un host"], ph: "un mot anglais", exp: "En anglais, la machine est l'host (hôte)." },
    { type: "qcm", q: "Une adresse MAC ressemble à…", opts: ["192.168.1.10", "00:1A:2B:3C:4D:5E", "www.exemple.fr", "255.255.255.0"], a: 1, exp: "La MAC s'écrit en hexadécimal (ex: 00:1A:2B:3C:4D:5E). 192.168.1.10 est une IP." },
    { type: "vf", q: "L'adresse IP sert à la fois à identifier une machine et à la localiser pour le routage.", a: true, exp: "Oui : ces deux rôles sont indissociables. L'organisation de l'IP permet le routage." },
    { type: "input", q: "Comment nomme-t-on (en anglais, un mot) l'unité de données qui contient l'IP source et l'IP destination et qui voyage de routeur en routeur ?", a: ["packet", "paquet", "le paquet"], ph: "un mot", exp: "C'est le paquet (packet), qui transporte les adresses IP source et destination." },
    { type: "qcm", q: "Pourquoi la découpe réseau/machine rend-elle le routage efficace ?", opts: ["Parce que le routeur doit mémoriser chaque machine du monde", "Parce qu'un routeur a seulement besoin de savoir vers quel réseau envoyer", "Parce qu'elle supprime les adresses MAC", "Parce qu'elle rend les IP identiques"], a: 1, exp: "Le routeur raisonne par réseau, pas machine par machine : bien plus économe." },
    { type: "qcm", q: "Laquelle de ces phrases est correcte ?", opts: ["La MAC localise, l'IP identifie seulement", "La MAC identifie (qui), l'IP localise (où)", "MAC et IP sont exactement identiques", "L'IP est gravée en usine"], a: 1, exp: "La MAC dit « qui » (identité fixe), l'IP dit « où » (position routable)." },
    { type: "vf", q: "Une machine possède à la fois une adresse MAC et une adresse IP.", a: true, exp: "Oui : les deux coexistent, chacune avec son rôle (couche 2 et couche 3)." },
    { type: "input", q: "Dans l'adresse 192.168.1.10, quelle partie identifie précisément une machine parmi ses voisines : la partie ______ ?", a: ["machine", "hote", "hôte", "host", "partie machine"], ph: "un mot", exp: "La partie machine (host) distingue les machines qui partagent la même partie réseau." }
  ],
  final: {
    title: "Exercice final — Deux adresses, deux rôles",
    intro: `<p>Sur son ordinateur, Karim relève deux informations : une suite hexadécimale <code>3C:5A:B4:11:0F:22</code> et un numéro <code>192.168.10.25</code>. Il ne sait pas laquelle est quoi. Aidons-le à faire le tri et à comprendre le rôle de chacune.</p>`,
    questions: [
      { type: "qcm", q: "La suite 3C:5A:B4:11:0F:22 est…", opts: ["Une adresse IP", "Une adresse MAC", "Un masque de sous-réseau", "Un nom de domaine"], a: 1, exp: "L'écriture hexadécimale par groupes de deux est caractéristique d'une adresse MAC." },
      { type: "qcm", q: "Le numéro 192.168.10.25 est…", opts: ["Une adresse MAC", "Une adresse IP", "Une adresse physique gravée en usine", "Un port"], a: 1, exp: "La notation décimale pointée en quatre nombres est celle d'une adresse IP." },
      { type: "vf", q: "S'il emporte son ordinateur ailleurs, la valeur 3C:5A:B4:11:0F:22 changera.", a: false, exp: "Non : c'est la MAC, physique et fixe. C'est l'IP (192.168.10.25) qui pourra changer." },
      { type: "qcm", q: "Laquelle permet aux routeurs de localiser sa machine à travers Internet ?", opts: ["La MAC", "L'IP", "Aucune des deux", "Les deux à égalité"], a: 1, exp: "L'IP est logique et organisée : c'est elle qui rend le routage possible." },
      { type: "input", q: "Dans 192.168.10.25, la valeur 25 fait partie de la partie ______ (qui distingue la machine de ses voisines).", a: ["machine", "hote", "hôte", "host", "partie machine"], ph: "un mot", exp: "La partie machine (host) identifie cette machine parmi celles du même réseau." }
    ],
    solution: `<pre class="pseudo"># Tri des deux informations de Karim :
3C:5A:B4:11:0F:22  -> adresse MAC  (physique, usine, fixe)   -> "qui"
192.168.10.25      -> adresse IP   (logique, config, mobile)  -> "ou"

# Roles :
MAC -> echanges DANS le reseau local (couche 2).
IP  -> localiser + router ENTRE les reseaux (couche 3).
Dans 192.168.10.25 : 192.168.10 = partie reseau, 25 = partie machine.</pre>
<p>Deux adresses, deux missions complémentaires. Demain, on regarde comment s'écrit précisément une adresse IPv4 : la notation décimale pointée.</p>`
  }
};
