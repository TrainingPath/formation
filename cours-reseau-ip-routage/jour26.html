var DAY = {

  title: "ARP en pratique : observer les échanges",
  subtitle: "Voir le dialogue « Qui a cette IP ? » se dérouler sous tes yeux.",
  theory: `
<h3>1. Le dialogue ARP en deux temps</h3>
<p>Quand ta machine ne connaît pas encore la MAC d'une IP locale, elle lance un échange en deux messages. D'abord une <strong>requête ARP</strong> (<em>ARP request</em>) envoyée à tout le réseau (en diffusion / broadcast) : « Qui a l'adresse 192.168.1.20 ? Réponds à 192.168.1.10 ». Ensuite, seul l'appareil concerné renvoie une <strong>réponse ARP</strong> (<em>ARP reply</em>) en unicast : « C'est moi, ma MAC est a4:5e:60:1c:22:9f ». La correspondance est alors rangée dans le cache.</p>
<pre class="pseudo"># Requete (broadcast, pour tout le monde)
Qui a 192.168.1.20 ? Dites-le a 192.168.1.10
# Reponse (unicast, juste pour le demandeur)
192.168.1.20 est a l'adresse a4:5e:60:1c:22:9f</pre>
<h3>2. Observer le cache : arp -a</h3>
<p>La façon la plus simple de constater le résultat d'un échange ARP est de regarder le cache <strong>avant</strong> et <strong>après</strong> avoir contacté une machine. Sur Windows comme sous Linux/macOS, la commande est <strong>arp -a</strong>. Si tu ne vois pas encore une IP, fais un ping vers elle (ce qui force une résolution ARP), puis relis le cache : l'entrée apparaît.</p>
<pre class="pseudo"># 1) Etat de depart
arp -a
# 2) On force la resolution en contactant l'hote
ping 192.168.1.20
# 3) L'entree est maintenant apprise
arp -a
  192.168.1.20   a4-5e-60-1c-22-9f   dynamique</pre>
<h3>3. Vider le cache pour tout revoir</h3>
<p>Pour observer un apprentissage « à neuf », on peut vider le cache. Cela oblige la machine à refaire des requêtes ARP.</p>
<pre class="pseudo"># Windows (invite en administrateur) :
arp -d *          # supprime toutes les entrees
# Linux :
ip neigh flush all    # vide la table des voisins (ARP moderne)
# macOS :
sudo arp -d -a</pre>
<div class="tip">Sous Linux, ARP est intégré à la « table des voisins ». La commande moderne <strong>ip neigh</strong> (ou <em>ip neighbour</em>) affiche l'équivalent de arp -a, avec des états comme REACHABLE (joignable) ou STALE (à revérifier).</div>
<h3>4. Capturer une vraie requête ARP</h3>
<p>Pour voir les trames elles-mêmes, on utilise un analyseur réseau. En interface graphique, <strong>Wireshark</strong> est la référence : on applique le filtre <strong>arp</strong> et on voit défiler les « Who has… / is at… ». En ligne de commande, <strong>tcpdump</strong> fait la même chose.</p>
<pre class="pseudo"># Capturer uniquement l'ARP avec tcpdump (Linux/macOS) :
sudo tcpdump -i eth0 arp
# Lecture typique :
ARP, Request who-has 192.168.1.20 tell 192.168.1.10
ARP, Reply 192.168.1.20 is-at a4:5e:60:1c:22:9f
# Dans Wireshark : barre de filtre  ->  arp</pre>
<div class="warn">Vider le cache ou capturer du trafic demande souvent les droits administrateur (Windows) ou sudo (Linux/macOS). Sans ces droits, la commande échoue ou n'affiche rien.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Echange ARP = REQUEST (broadcast) puis REPLY (unicast)
# Lire le cache          : arp -a   (Windows / Linux / macOS)
# Forcer une resolution  : ping vers l'IP, puis relire arp -a
# Vider le cache         : arp -d *  (Win) | ip neigh flush all (Linux)
# Capturer les trames    : Wireshark (filtre arp) ou tcpdump -i IFACE arp</pre>`,

    { type: "qcm", q: "Quel outil graphique de référence permet de capturer et filtrer les trames ARP ?", opts: ["PuTTY", "Wireshark", "Nmap", "Cisco Packet Tracer"], a: 1, exp: "Wireshark est l'analyseur réseau standard ; on filtre avec le mot-clé arp." },

    { type: "input", q: "Quel outil en ligne de commande (Linux/macOS) capture le trafic, ici avec « ... -i eth0 arp » ?", a: ["tcpdump", "tcp dump"], ph: "un outil", exp: "tcpdump -i eth0 arp capture uniquement les trames ARP sur eth0." },
    { type: "qcm", q: "Dans une capture, « who-has 192.168.1.20 tell 192.168.1.10 » est…", opts: ["une réponse ARP", "une requête ARP", "un paquet DNS", "un accusé TCP"], a: 1, exp: "« who-has … tell … » est le format d'une requête ARP (qui a cette IP)." },
    { type: "qcm", q: "Dans une capture, « 192.168.1.20 is-at a4:5e:60:1c:22:9f » est…", opts: ["une requête ARP", "une réponse ARP", "un ping", "une route"], a: 1, exp: "« is-at » indique la réponse ARP donnant la MAC." },
    { type: "vf", q: "Vider le cache ARP ou capturer du trafic nécessite souvent des droits administrateur/sudo.", a: true, exp: "Ces opérations touchent à l'interface réseau et exigent des privilèges élevés." },
    { type: "input", q: "Sous Linux, quelle commande vide la table des voisins (cache ARP) ? (indice : commence par « ip neigh »)", a: ["ip neigh flush all", "ip neighbour flush all", "ip neigh flush"], ph: "ip neigh ...", exp: "ip neigh flush all vide la table des voisins." },
    { type: "qcm", q: "Après avoir vidé le cache puis contacté un hôte, que se passe-t-il ?", opts: ["Rien : la machine attend l'expiration du cache", "La machine refait une requête ARP et réapprend la MAC", "La passerelle répond à la place de l'hôte", "Une résolution DNS remplace la requête ARP"], a: 1, exp: "Le cache vide force une nouvelle résolution ARP." },
    { type: "vf", q: "L'échange ARP complet comprend une requête (request) puis une réponse (reply).", a: true, exp: "Deux temps : la question en broadcast, la réponse en unicast." }
  ],
  final: {
    title: "Exercice final — Provoquer et observer un échange ARP",
    intro: `<p>Nora veut prouver qu'un ping déclenche bien ARP. Son PC Linux est en 192.168.1.10 ; elle vise l'imprimante 192.168.1.30, absente de son cache.</p>`,
    questions: [
      { type: "input", q: "Étape 1 : quelle commande vide d'abord sa table des voisins pour repartir à neuf ?", a: ["ip neigh flush all", "ip neighbour flush all"], ph: "ip neigh ...", exp: "ip neigh flush all repart d'un cache vide." },
      { type: "qcm", q: "Étape 2 : quel type de message ARP part alors quand elle ping l'imprimante ?", opts: ["Une réponse ARP en unicast", "Une requête ARP en broadcast : « who-has 192.168.1.30 »", "Un paquet DNS", "Rien"], a: 1, exp: "N'ayant pas la MAC, elle diffuse une requête ARP." },
      { type: "qcm", q: "Étape 3 : que répond l'imprimante ?", opts: ["Un broadcast à tous", "Une réponse ARP unicast : « 192.168.1.30 is-at … »", "Un ping", "Une route statique"], a: 1, exp: "L'imprimante répond directement avec sa MAC (unicast)." },
      { type: "input", q: "Étape 4 : quelle commande confirme que l'entrée 192.168.1.30 est maintenant apprise ?", a: ["arp -a", "ip neigh", "arp-a"], ph: "commande", exp: "arp -a (ou ip neigh) montre la nouvelle entrée dynamique." },
      { type: "vf", q: "Pour capturer précisément ces deux trames, elle peut lancer « tcpdump -i eth0 arp » avec sudo.", a: true, exp: "tcpdump filtré sur arp montre la request puis la reply." }
    ],
    solution: `<pre class="pseudo"># Scenario complet observe :
1) ip neigh flush all            # cache vide
2) ping 192.168.1.30             # declenche ARP
     -&gt; ARP Request (broadcast) : who-has 192.168.1.30 tell 192.168.1.10
     -&gt; ARP Reply  (unicast)   : 192.168.1.30 is-at aa:bb:cc:dd:ee:ff
3) arp -a  (ou ip neigh)         # l'entree 192.168.1.30 apparait
# Capture des trames : sudo tcpdump -i eth0 arp   (ou Wireshark, filtre arp)</pre>
<p>Tu sais désormais provoquer, lire et capturer un échange ARP. Demain : on monte d'un cran avec ICMP, le protocole des messages de contrôle.</p>`
  }
