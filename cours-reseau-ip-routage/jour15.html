<script>
var DAY = {
  num: 15,
  title: "La méthode magique",
  subtitle: "Un seul calcul, 256 moins le masque, et toutes les plages tombent d'elles-mêmes.",
  theory: `
<h3>1. Le nombre magique en une ligne</h3>
<p>La <strong>méthode du nombre magique</strong> (magic number) est un raccourci pour trouver instantanément les plages de sous-réseaux, sans écrire de binaire. Le principe tient en une formule :</p>
<pre class="pseudo"># NOMBRE MAGIQUE = 256 - (valeur du masque dans l'octet interessant)</pre>
<p>L'« octet intéressant » (interesting octet) est celui où le masque n'est ni 255 ni 0 : c'est là que se joue le découpage. Le nombre magique est le <strong>pas</strong> : la distance entre deux adresses de sous-réseau consécutives dans cet octet. Les sous-réseaux commencent à 0, puis au nombre magique, puis à 2 fois, 3 fois, etc.</p>
<h3>2. Exemple pas à pas</h3>
<p>Soit <strong>192.168.1.0</strong> avec le masque <strong>255.255.255.192</strong> (/26). L'octet intéressant est le 4e (valeur 192).</p>
<pre class="pseudo"># Nombre magique = 256 - 192 = 64
# Les sous-reseaux commencent donc de 64 en 64 :
# 0, 64, 128, 192
# SR1 : 192.168.1.0    (broadcast .63)
# SR2 : 192.168.1.64   (broadcast .127)
# SR3 : 192.168.1.128  (broadcast .191)
# SR4 : 192.168.1.192  (broadcast .255)</pre>
<div class="tip">Le broadcast d'un sous-réseau = (adresse du sous-réseau suivant) - 1. Le premier hôte = adresse du sous-réseau + 1. Le dernier hôte = broadcast - 1. Trois additions/soustractions, c'est tout.</div>
<h3>3. Trouver dans quel sous-réseau tombe une adresse</h3>
<p>C'est là que la méthode brille. Pour savoir à quel sous-réseau appartient une adresse, on descend de nombre magique en nombre magique jusqu'à ne pas dépasser l'octet de l'adresse.</p>
<pre class="pseudo"># Question : 192.168.1.200 avec /26 (magique = 64) appartient a quel sous-reseau ?
# Bornes : 0, 64, 128, 192, 256
# 200 est entre 192 et 256  ->  sous-reseau 192.168.1.192
# Broadcast = 255, hotes utilisables .193 a .254  ->  200 est un hote valide.</pre>
<h3>4. Table de correspondance à garder en tête</h3>
<pre class="pseudo"># Masque (dernier octet)   Prefixe   Nombre magique   Hotes utilisables
#   255.255.255.128        /25       256-128 = 128     126
#   255.255.255.192        /26       256-192 = 64      62
#   255.255.255.224        /27       256-224 = 32      30
#   255.255.255.240        /28       256-240 = 16      14
#   255.255.255.248        /29       256-248 = 8       6
#   255.255.255.252        /30       256-252 = 4       2</pre>
<div class="warn">La méthode magique s'applique dans l'octet où le masque n'est ni 0 ni 255. Pour un /20 (255.255.240.0), l'octet intéressant est le 3e : magique = 256 - 240 = 16, et les sous-réseaux avancent de 16 en 16 dans le TROISIÈME octet, pas le quatrième.</p></div>
<h3>5. Pourquoi ça marche</h3>
<p>Le nombre magique n'est rien d'autre que la taille d'un bloc, 2^(bits d'hôte de cet octet). Pour /26, il reste 6 bits d'hôte : 2^6 = 64. Et 256 - 192 = 64. Les deux façons de calculer donnent le même pas ; la soustraction est juste plus rapide de tête.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Nombre magique = 256 - valeur du masque (dans l'octet interessant)
# = le PAS entre sous-reseaux dans cet octet
# Sous-reseaux : 0, magique, 2xmagique, 3xmagique, ...
# Broadcast = (sous-reseau suivant) - 1
# Pour situer une adresse : trouver le plus grand multiple du magique <= l'octet</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la formule du nombre magique ?", opts: ["256 + valeur du masque", "256 - valeur du masque", "masque - 256", "512 / masque"], a: 1, exp: "Nombre magique = 256 - valeur du masque dans l'octet intéressant." },
    { type: "input", q: "Nombre magique pour le masque 255.255.255.192 ? (256 - 192)", a: ["64"], ph: "un nombre", exp: "256 - 192 = 64." },

    { type: "qcm", q: "192.168.1.100 avec /26 (magique 64) est dans quel sous-réseau ?", opts: ["192.168.1.0", "192.168.1.64", "192.168.1.128", "192.168.1.192"], a: 1, exp: "100 est entre 64 et 128 : sous-réseau 192.168.1.64." },
    { type: "input", q: "Nombre magique pour 255.255.255.240 (/28) ? (256 - 240)", a: ["16"], ph: "un nombre", exp: "256 - 240 = 16." },
    { type: "qcm", q: "Le broadcast d'un sous-réseau se calcule comme…", opts: ["Adresse du sous-réseau + magique", "(Adresse du sous-réseau suivant) - 1", "Adresse du sous-réseau - 1", "256 - magique"], a: 1, exp: "Broadcast = adresse du sous-réseau suivant, moins 1." },
    { type: "vf", q: "Pour un /20 (255.255.240.0), l'octet intéressant est le troisième.", a: true, exp: "Vrai : le 3e octet vaut 240 (ni 0 ni 255). Magique = 16 dans cet octet." },
    { type: "input", q: "Nombre magique pour 255.255.255.252 (/30) ? (256 - 252)", a: ["4"], ph: "un nombre", exp: "256 - 252 = 4." },
    { type: "qcm", q: "192.168.1.200 avec /26 (magique 64) : broadcast de son sous-réseau ?", opts: ["192.168.1.191", "192.168.1.223", "192.168.1.255", "192.168.1.254"], a: 2, exp: "200 est dans le bloc .192 ; suivant serait .256 : broadcast = 192.168.1.255." },
    { type: "qcm", q: "Pourquoi 256 - masque donne-t-il le pas ?", opts: ["Par hasard", "Car il vaut 2^(bits d'hôte de l'octet), donc la taille d'un bloc", "Car 256 est le nombre de sous-réseaux", "Car le masque est toujours 192"], a: 1, exp: "256 - masque = 2^(bits d'hôte restants dans l'octet) = taille du bloc." },
    { type: "input", q: "Avec un magique de 32, quelle est l'adresse du 3e sous-réseau (bloc démarrant à .0) dans le dernier octet ? (écris le nombre de l'octet)", a: ["64"], ph: "un nombre", exp: "Blocs : 0, 32, 64. Le 3e commence à 64." },
    { type: "vf", q: "Le nombre magique et la méthode des bits empruntés donnent des plages différentes.", a: false, exp: "Faux : elles donnent exactement les mêmes plages. La magique est juste plus rapide." }
  ],
  final: {
    title: "Exercice final — Tout en magique",
    intro: `<p>On te donne <code>10.0.0.0</code> avec le masque <code>255.255.255.224</code> (/27). Utilise uniquement le nombre magique pour répondre.</p>`,
    questions: [
      { type: "input", q: "Quel est le nombre magique ? (256 - 224)", a: ["32"], ph: "un nombre", exp: "256 - 224 = 32." },
      { type: "qcm", q: "Quelles sont les premières adresses de sous-réseau (dernier octet) ?", opts: ["0, 16, 32, 48", "0, 32, 64, 96", "0, 64, 128, 192", "0, 8, 16, 24"], a: 1, exp: "Pas de 32 : 0, 32, 64, 96, 128..." },
      { type: "qcm", q: "10.0.0.70 appartient à quel sous-réseau ?", opts: ["10.0.0.32", "10.0.0.64", "10.0.0.96", "10.0.0.128"], a: 1, exp: "70 est entre 64 et 96 : sous-réseau 10.0.0.64." },
      { type: "input", q: "Quel est le broadcast du sous-réseau contenant 10.0.0.70 ?", a: ["10.0.0.95", "95"], ph: "une adresse", exp: "Bloc .64, suivant .96 : broadcast = 10.0.0.95." },
      { type: "qcm", q: "Combien d'hôtes utilisables par sous-réseau en /27 ?", opts: ["14", "30", "62", "126"], a: 1, exp: "h = 5, 2^5 - 2 = 30 hôtes." }
    ],
    solution: `<pre class="pseudo"># Masque 255.255.255.224 (/27)  ->  magique = 256 - 224 = 32
# Sous-reseaux (dernier octet) : 0, 32, 64, 96, 128, 160, 192, 224
# 10.0.0.70  ->  entre 64 et 96  ->  sous-reseau 10.0.0.64
#   1er hote 10.0.0.65 , dernier hote 10.0.0.94 , broadcast 10.0.0.95
# Hotes utilisables : 2^5 - 2 = 30 par sous-reseau</pre>
<p>Tu as l'arme la plus rapide du subnetting. Demain, dernière étape : une grosse série d'exercices guidés pour tout automatiser.</p>`
  }
};
</script>
