  theory: `
<h3>1. L'idée : des réseaux dans le réseau</h3>
<p>Hier, on a vu la limite du switch : il forme un seul grand domaine de diffusion. La solution élégante s'appelle le <strong>VLAN</strong> (<em>Virtual Local Area Network</em>, « réseau local virtuel »). Un VLAN permet de découper un même switch physique en plusieurs <strong>réseaux logiques séparés</strong>, comme si on avait plusieurs switches distincts alors qu'il n'y en a qu'un.</p>
<p>Imagine un immeuble de bureaux avec des cloisons amovibles. Le bâtiment est unique (le switch), mais on peut créer des salles indépendantes (les VLAN) : les gens d'une salle ne dérangent pas ceux d'à côté, même s'ils partagent les mêmes murs.</p>
<h3>2. Comment ça marche : affecter les ports</h3>
<p>Concrètement, on <strong>affecte chaque port du switch à un VLAN</strong>, désigné par un numéro (le <em>VLAN ID</em>, de 1 à 4094). Par exemple : les ports 1 à 8 dans le VLAN 10 (comptabilité), les ports 9 à 16 dans le VLAN 20 (production). Deux machines dans le même VLAN se parlent normalement ; deux machines dans des VLAN différents sont isolées, même branchées sur le même switch.</p>
<pre class="pseudo"># Affectation des ports (exemple type Cisco)
switch(config)# vlan 10
switch(config-vlan)# name Comptabilite
switch(config)# vlan 20
switch(config-vlan)# name Production
switch(config)# interface fa0/1
switch(config-if)# switchport access vlan 10   # le port 1 -&gt; VLAN 10
switch(config)# interface fa0/9
switch(config-if)# switchport access vlan 20   # le port 9 -&gt; VLAN 20</pre>
<h3>3. Le port d'accès (access port)</h3>
<p>Un port relié à une seule machine (un PC, une imprimante) et rattaché à un unique VLAN s'appelle un <strong>port d'accès</strong> (<em>access port</em>). La machine branchée dessus ne sait même pas qu'un VLAN existe : elle envoie des trames Ethernet normales, et c'est le switch qui les range dans le bon VLAN. C'est transparent pour l'utilisateur.</p>
<h3>4. Faire circuler plusieurs VLAN entre switches : le trunk</h3>
<p>Problème : si deux switches doivent partager les VLAN 10 et 20, on ne va pas tirer un câble par VLAN. On utilise un seul lien spécial, le <strong>port trunk</strong> (<em>trunk</em>, « tronc commun »), qui transporte plusieurs VLAN à la fois. Pour que le switch d'en face sache à quel VLAN appartient chaque trame, on ajoute une petite <strong>étiquette</strong> (<em>tag</em>) : c'est la norme <strong>802.1Q</strong>, qui insère un champ de 4 octets dans la trame Ethernet contenant le VLAN ID.</p>
<div class="tip">Deux types de ports à retenir : le <strong>port d'accès</strong> (une seule machine, un seul VLAN, trames non étiquetées) et le <strong>port trunk</strong> (entre équipements, plusieurs VLAN, trames étiquetées 802.1Q).</div>
<h3>5. Un détail important : le VLAN natif et le VLAN par défaut</h3>
<p>Par défaut, tous les ports d'un switch neuf sont dans le <strong>VLAN 1</strong>. C'est pratique mais peu sûr : par bonne pratique, on évite d'y laisser les machines sensibles. Sur un trunk, un VLAN dit <strong>natif</strong> (<em>native VLAN</em>) transporte les trames sans étiquette ; c'est le VLAN 1 par défaut, souvent changé pour des raisons de sécurité.</p>
<div class="warn">Un VLAN n'est PAS qu'un réglage de confort : mal configuré (par exemple un mauvais VLAN natif, ou le VLAN 1 laissé partout), il peut ouvrir des failles. On y reviendra demain avec l'aspect sécurité.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLAN = reseau local virtuel : plusieurs LAN logiques dans 1 switch

# Port TRUNK  : plusieurs VLAN sur un lien, trames etiquetees 802.1Q

  ],
