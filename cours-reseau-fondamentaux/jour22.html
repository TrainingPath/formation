<script>
var DAY = {
  num: 22,
  title: "Le format d'une trame Ethernet (préambule, MAC dest/source, EtherType, données, FCS)",
  subtitle: "Ouvrons l'enveloppe : chaque champ d'une trame a un rôle précis.",
  theory: `
<h3>1. Vue d'ensemble : une enveloppe bien structurée</h3>
<p>Quand la couche 2 doit envoyer des données, elle les emballe dans une <strong>trame</strong> (frame). Une trame Ethernet II, ce n'est pas un tas d'octets en vrac : c'est une <strong>suite de champs</strong> dans un ordre précis, comme une enveloppe postale bien remplie (adresse du destinataire, adresse de l'expéditeur, contenu, cachet de contrôle). Voici l'ordre des champs :</p>
<pre class="pseudo"># Format d'une trame Ethernet II (dans l'ordre)
+-----------+-----+----------+----------+-----------+-------------+-----+
| Preambule | SFD | MAC dest | MAC src  | EtherType |   Donnees   | FCS |
+-----------+-----+----------+----------+-----------+-------------+-----+
|  7 octets | 1 o | 6 octets | 6 octets |  2 octets | 46-1500 oct | 4 o |
+-----------+-----+----------+----------+-----------+-------------+-----+</pre>
<h3>2. Le préambule (et le SFD) : « attention, ça commence »</h3>
<p>La trame débute par un <strong>préambule</strong> de 7 octets, suivi d'un octet appelé <strong>SFD</strong> (<em>Start Frame Delimiter</em>, « délimiteur de début de trame »). Leur rôle : <strong>synchroniser</strong> la carte réceptrice, comme un « 3, 2, 1, partez ! » qui prévient qu'une trame arrive et cale l'horloge de lecture. Le SFD marque précisément où commencent les vraies données de la trame. Ces octets ne font pas partie de l'information utile : ce sont des signaux de calage.</p>
<h3>3. Les adresses MAC : destinataire, puis expéditeur</h3>
<p>Viennent ensuite deux champs de 6 octets chacun (rappel : une adresse MAC fait 48 bits = 6 octets) :</p>
<p><strong>MAC destination</strong> (6 octets) : à qui la trame est adressée. C'est le <strong>premier</strong> des deux, car chaque équipement doit pouvoir décider très vite si la trame le concerne. Si elle vaut FF:FF:FF:FF:FF:FF, c'est une diffusion (broadcast) pour tout le monde.</p>
<p><strong>MAC source</strong> (6 octets) : l'adresse de la carte qui a émis la trame, pour que le destinataire sache à qui répondre.</p>
<div class="tip">Ordre à retenir : d'abord le <strong>destinataire</strong>, ensuite la <strong>source</strong>. C'est logique : un équipement lit d'abord « c'est pour qui ? » pour savoir s'il doit traiter ou ignorer la trame.</div>
<h3>4. EtherType, données et FCS</h3>
<p><strong>EtherType</strong> (2 octets) : indique le <strong>type de protocole transporté</strong> dans les données, pour que le destinataire sache à qui remettre le contenu. Par exemple <strong>0x0800</strong> signifie « à l'intérieur, il y a un paquet IPv4 » ; <strong>0x0806</strong> désigne ARP.</p>
<p><strong>Données</strong> (<em>payload</em>) : le contenu utile transporté, de <strong>46 à 1500 octets</strong>. Le maximum de 1500 octets, c'est le <strong>MTU</strong>. Le minimum de 46 octets existe pour garantir une taille de trame minimale ; si les données sont plus courtes, on ajoute un <strong>remplissage</strong> (padding).</p>
<p><strong>FCS</strong> (<em>Frame Check Sequence</em>, 4 octets) : la <strong>séquence de contrôle</strong>, calculée par un <strong>CRC</strong> (contrôle de redondance cyclique) sur le reste de la trame. À la réception, la carte refait le calcul : si le résultat ne correspond pas au FCS reçu, la trame est considérée comme <strong>abîmée</strong> et elle est jetée.</p>
<div class="warn">Le FCS <strong>détecte</strong> les erreurs, il ne les <strong>corrige</strong> pas. Une trame dont le FCS est faux est simplement supprimée ; c'est aux couches supérieures (comme TCP) de redemander l'information si nécessaire.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Ordre des champs d'une trame Ethernet II :
Preambule (7 o) + SFD (1 o) -&gt; synchronisation / debut de trame
MAC destination (6 o)       -&gt; a qui ? (FF:FF... = diffusion)
MAC source (6 o)            -&gt; de qui ?
EtherType (2 o)             -&gt; quel protocole dedans ? (0x0800 = IPv4)
Donnees (46 a 1500 o)       -&gt; le contenu utile (MTU = 1500)
FCS (4 o)                   -&gt; controle d'erreur (CRC) : detecte une trame abimee</pre>`,
  exercises: [
    { type: "qcm", q: "Quel champ ouvre une trame Ethernet ?", opts: ["Le FCS", "Le préambule", "L'EtherType", "La MAC source"], a: 1, exp: "La trame commence par le préambule (7 octets) suivi du SFD." },
    { type: "input", q: "Combien d'octets fait le champ « MAC destination » ?", a: ["6", "six", "6 octets"], ph: "un nombre", exp: "Chaque adresse MAC fait 6 octets (48 bits)." },
    { type: "qcm", q: "Dans une trame Ethernet II, quel champ vient EN PREMIER parmi les adresses ?", opts: ["La MAC source", "La MAC destination", "L'EtherType", "Le FCS"], a: 1, exp: "La MAC destination précède la MAC source : on lit d'abord « pour qui ? »." },
    { type: "qcm", q: "À quoi sert le champ EtherType ?", opts: ["À corriger les erreurs", "À indiquer le protocole transporté (ex. IPv4)", "À synchroniser l'horloge", "À donner l'adresse du routeur"], a: 1, exp: "L'EtherType indique le type de protocole des données (0x0800 = IPv4)." },
    { type: "input", q: "Quel champ de 4 octets, en fin de trame, sert au contrôle d'erreur ? (sigle)", a: ["fcs", "le fcs"], ph: "3 lettres", exp: "Le FCS (Frame Check Sequence), calculé par CRC." },
    { type: "vf", q: "Le champ de données d'une trame Ethernet peut aller jusqu'à 1500 octets (le MTU).", a: true, exp: "Oui : le payload va de 46 à 1500 octets ; 1500 est le MTU standard." },
    { type: "qcm", q: "Sur quel principe repose le calcul du FCS ?", opts: ["Un chiffrement AES", "Un CRC (contrôle de redondance cyclique)", "Une adresse IP", "Une compression"], a: 1, exp: "Le FCS est un CRC calculé sur la trame pour détecter les altérations." },
    { type: "input", q: "Quel rôle joue le préambule (un mot) ?", a: ["synchronisation", "la synchronisation", "synchroniser", "syncronisation"], ph: "un rôle", exp: "Le préambule sert à synchroniser la carte réceptrice (calage de l'horloge)." },
    { type: "qcm", q: "Que signifie le sigle SFD ?", opts: ["Secure File Delivery", "Start Frame Delimiter (délimiteur de début de trame)", "Source Frame Data", "System Fault Detector"], a: 1, exp: "SFD = Start Frame Delimiter : il marque le début des vraies données de la trame." },
    { type: "qcm", q: "Quelle valeur d'EtherType correspond à IPv4 ?", opts: ["0x0806", "0x0800", "0x8100", "0x86DD"], a: 1, exp: "0x0800 = IPv4. (0x0806 = ARP, 0x86DD = IPv6.)" },
    { type: "vf", q: "Le FCS permet de corriger automatiquement une trame abîmée.", a: false, exp: "Non : le FCS détecte l'erreur et la trame est jetée ; il ne corrige pas." },
    { type: "input", q: "Quelle est la taille maximale (en octets) du champ de données ?", a: ["1500", "1500 octets"], ph: "un nombre", exp: "Le payload maximal est de 1500 octets (le MTU)." },
    { type: "qcm", q: "Que contient le champ MAC source ?", opts: ["L'adresse du destinataire", "L'adresse de la carte qui a émis la trame", "Le type de protocole", "Le contrôle d'erreur"], a: 1, exp: "La MAC source est l'adresse de l'émetteur, pour savoir à qui répondre." },
    { type: "vf", q: "Si les données sont plus courtes que le minimum, on ajoute un remplissage (padding).", a: true, exp: "Oui : le padding complète pour atteindre la taille minimale de trame (données = 46 octets minimum)." },
    { type: "qcm", q: "Quel est le bon ordre (simplifié) des champs d'une trame Ethernet II ?", opts: ["FCS, données, MAC source, MAC dest, préambule", "Préambule/SFD, MAC dest, MAC source, EtherType, données, FCS", "MAC source, MAC dest, données, préambule, FCS", "EtherType, préambule, données, MAC dest, FCS"], a: 1, exp: "Ordre : préambule/SFD, MAC destination, MAC source, EtherType, données, FCS." }
  ],
  final: {
    title: "Exercice final — Disséquer une trame",
    intro: `<p>Une trame Ethernet II part du PC <code>00:1A:2B:3C:4D:5E</code> vers le PC <code>00:AA:BB:CC:DD:EE</code>. Elle transporte un paquet IPv4 de 1000 octets. Analysons ses champs.</p>`,
    questions: [
      { type: "qcm", q: "Quelle adresse figure dans le champ MAC destination ?", opts: ["00:1A:2B:3C:4D:5E", "00:AA:BB:CC:DD:EE", "FF:FF:FF:FF:FF:FF", "Aucune"], a: 1, exp: "La destination est le PC visé : 00:AA:BB:CC:DD:EE." },
      { type: "qcm", q: "Quelle valeur prend l'EtherType pour ce contenu ?", opts: ["0x0806 (ARP)", "0x0800 (IPv4)", "0x86DD (IPv6)", "0x8100"], a: 1, exp: "Le contenu est un paquet IPv4 : EtherType = 0x0800." },
      { type: "input", q: "Les 1000 octets tiennent-ils dans le champ de données sans découpage ? (oui/non)", a: ["oui", "oui car 1000 est inferieur a 1500", "oui, 1000 < 1500"], ph: "oui ou non", exp: "Oui : 1000 octets est inférieur au MTU de 1500 octets, aucune fragmentation nécessaire." },
      { type: "vf", q: "Le champ FCS de cette trame permettra au destinataire de vérifier qu'elle n'est pas abîmée.", a: true, exp: "Oui : le FCS (CRC) détecte une éventuelle altération de la trame." },
      { type: "qcm", q: "Si la MAC destination avait été FF:FF:FF:FF:FF:FF, la trame aurait été…", opts: ["Ignorée par tous", "Une diffusion (broadcast) reçue par toutes les machines", "Chiffrée", "Renvoyée à la source"], a: 1, exp: "FF:FF:FF:FF:FF:FF = diffusion : toutes les machines du réseau local la reçoivent." }
    ],
    solution: `<pre class="pseudo"># Disection de la trame :
Preambule + SFD : synchronisation (calage)
MAC dest        : 00:AA:BB:CC:DD:EE  (le destinataire)
MAC source      : 00:1A:2B:3C:4D:5E  (l'emetteur)
EtherType       : 0x0800  -&gt; IPv4 a l'interieur
Donnees         : 1000 octets  (&lt; 1500 = MTU, donc pas de decoupage)
FCS             : CRC -&gt; le destinataire verifie l'integrite
# FF:FF:FF:FF:FF:FF en destination = diffusion (broadcast)</pre>
<p>Tu sais lire une trame champ par champ. Demain, l'équipement le plus simple pour relier des machines : le <strong>concentrateur (hub)</strong> et ses limites.</p>`
  }
};
