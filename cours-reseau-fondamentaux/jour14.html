<script>
var DAY = {
  num: 14,
  title: "La fibre optique",
  subtitle: "Transporter l'information à la vitesse de la lumière, sur des kilomètres.",
  theory: `
<h3>1. De l'électricité à la lumière</h3>
<p>Jusqu'ici, nos câbles étaient en cuivre et transportaient un signal <strong>électrique</strong>. La <strong>fibre optique</strong> (en anglais <em>optical fiber</em>) change de principe : elle transporte l'information sous forme de <strong>lumière</strong>. Un fil de verre extrêmement fin guide des impulsions lumineuses émises par une <strong>diode laser ou LED</strong> ; à l'autre bout, un <strong>photodétecteur</strong> les retransforme en bits.</p>
<h3>2. Comment la lumière reste-t-elle dans le fil ?</h3>
<p>La fibre est composée d'un <strong>cœur</strong> (en anglais <em>core</em>) en verre entouré d'une <strong>gaine optique</strong> (en anglais <em>cladding</em>). Grâce au phénomène de <strong>réflexion totale interne</strong>, la lumière rebondit sur les parois du cœur sans en sortir : elle « ricoche » le long du fil, même dans les courbes.</p>
<pre class="pseudo"># Structure d'une fibre
Coeur (core)      : verre tres fin, guide la lumiere
Gaine optique     : renvoie la lumiere vers le coeur (reflexion)
Revetement/gaine  : protection mecanique
# La lumiere ricoche dans le coeur = reflexion totale interne</pre>
<h3>3. Monomode et multimode</h3>
<p>Il existe deux grandes familles de fibre :</p>
<pre class="pseudo"># Multimode (MMF)
- Coeur LARGE (~50 a 62,5 microns)
- Plusieurs "chemins" (modes) pour la lumiere
- Source : LED/laser bon marche
- Distances COURTES : quelques centaines de metres
- Usage : LAN, batiments, data centers
# Monomode (SMF)
- Coeur TRES FIN (~9 microns)
- Un seul chemin pour la lumiere
- Source : laser precis
- Distances LONGUES : plusieurs km a dizaines de km
- Usage : liaisons longue distance, operateurs, entre villes</pre>
<div class="tip">Moyen mnémotechnique : <strong>Mono = un</strong> seul chemin, cœur fin, va <strong>loin</strong>. <strong>Multi = plusieurs</strong> chemins, cœur large, portée plus <strong>courte</strong>. Le monomode est la fibre des grandes distances.</div>
<h3>4. Les avantages de la fibre</h3>
<pre class="pseudo"># Atouts majeurs de la fibre optique
+ Tres haut debit (bien au-dela du cuivre)
+ Tres longues distances (km) sans repeteur
+ IMMUNISEE aux interferences electromagnetiques (lumiere)
+ Pas de rayonnement, difficile a espionner
+ Legere et fine</pre>
<p>Comme la fibre transporte de la lumière et non de l'électricité, elle est <strong>totalement insensible aux interférences électromagnétiques</strong> : ni les moteurs, ni la foudre, ni les autres câbles ne la perturbent. C'est un avantage décisif face au cuivre.</p>
<h3>5. Les limites</h3>
<div class="warn">La fibre a un coût : elle est plus <strong>chère</strong> à produire, plus <strong>fragile</strong> (le verre casse si on la plie trop), et son installation exige des <strong>outils spécialisés</strong> (soudure, connecteurs précis type SC, LC, ST). On ne la sertit pas aussi simplement qu'un RJ45.</p></div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Fibre = LUMIERE dans du verre (coeur + gaine optique)
Principe : reflexion totale interne (la lumiere ricoche)
Monomode : coeur fin, 1 chemin, LONGUES distances (km)
Multimode: coeur large, plusieurs chemins, courtes distances
Atouts   : tres haut debit, longue portee, immunise aux interferences
Limites  : plus chere, fragile, pose specialisee</pre>`,
  exercises: [
    { type: "qcm", q: "Sous quelle forme la fibre optique transporte-t-elle l'information ?", opts: ["Un signal électrique", "De la lumière", "Des ondes radio", "Des impulsions magnétiques"], a: 1, exp: "La fibre transporte des impulsions lumineuses dans du verre." },
    { type: "input", q: "Comment appelle-t-on la partie centrale en verre qui guide la lumière ? (un mot)", a: ["coeur", "cœur", "le coeur", "core"], ph: "un mot", exp: "Le cœur (core) guide la lumière ; la gaine optique la renvoie vers lui." },
    { type: "qcm", q: "Quel phénomène maintient la lumière à l'intérieur du cœur ?", opts: ["La réfraction dans la gaine", "La réflexion totale interne", "L'effet du blindage métallique", "Le torsadage"], a: 1, exp: "La réflexion totale interne fait « ricocher » la lumière dans le cœur." },
    { type: "vf", q: "La fibre optique est immunisée contre les interférences électromagnétiques.", a: true, exp: "Oui : elle transporte de la lumière, insensible aux perturbations électriques." },
    { type: "qcm", q: "Quelle fibre est faite pour les longues distances (plusieurs km) ?", opts: ["Multimode", "Monomode", "Coaxiale", "UTP"], a: 1, exp: "Le monomode, à cœur fin et un seul chemin, va le plus loin." },
    { type: "input", q: "Quelle fibre a le cœur le plus large et sert sur de courtes distances ? (un mot)", a: ["multimode", "la multimode", "mmf"], ph: "un mot", exp: "La multimode (cœur large) est utilisée sur de courtes distances (LAN, data centers)." },
    { type: "vf", q: "Le monomode a un cœur plus large que le multimode.", a: false, exp: "Non : le monomode a un cœur TRÈS FIN (~9 µm), plus fin que le multimode." },
    { type: "qcm", q: "Un avantage décisif de la fibre face au cuivre ?", opts: ["Elle est moins chère", "Elle va plus loin et à plus haut débit, sans interférences", "Elle se plie sans limite", "Elle n'a pas besoin de connecteurs"], a: 1, exp: "Très haut débit, longue portée et immunité aux interférences." },
    { type: "input", q: "Comment appelle-t-on la couche qui entoure le cœur et renvoie la lumière vers lui ? (deux mots)", a: ["gaine optique", "la gaine optique", "cladding", "gaine"], ph: "deux mots", exp: "La gaine optique (cladding) réfléchit la lumière vers le cœur." },
    { type: "qcm", q: "Une limite de la fibre optique ?", opts: ["Elle est sensible aux moteurs électriques", "Elle est plus chère et plus fragile", "Elle a un débit très faible", "Elle ne dépasse pas 10 m"], a: 1, exp: "La fibre coûte plus cher, est fragile et demande une pose spécialisée." },
    { type: "vf", q: "La fibre nécessite des outils et connecteurs spécialisés (SC, LC, ST).", a: true, exp: "Oui : contrairement au RJ45, la fibre demande des connecteurs précis et parfois une soudure." },
    { type: "input", q: "« Mono » signifie qu'il y a combien de chemins pour la lumière dans le cœur ? (un nombre ou un mot)", a: ["1", "un", "un seul", "seul"], ph: "un nombre", exp: "Monomode = un seul chemin (mode) pour la lumière." },
    { type: "qcm", q: "Où utilise-t-on surtout la fibre multimode ?", opts: ["Entre deux villes distantes", "Dans les bâtiments et data centers (courtes distances)", "Dans les prises téléphoniques", "Pour les liaisons sous-marines"], a: 1, exp: "Le multimode sert sur de courtes distances : LAN, bâtiments, data centers." },
    { type: "qcm", q: "Quel composant émet la lumière à l'entrée de la fibre ?", opts: ["Un photodétecteur", "Une diode laser ou LED", "Un répéteur électrique", "Une antenne d'émission"], a: 1, exp: "Une diode laser/LED émet ; un photodétecteur reçoit à l'autre bout." },
    { type: "input", q: "La fibre est-elle sensible ou insensible aux interférences électromagnétiques ? (un mot)", a: ["insensible", "immunisee", "immunisée", "insensible aux interferences"], ph: "un mot", exp: "Insensible (immunisée) : elle transporte de la lumière, pas de l'électricité." }
  ],
  final: {
    title: "Exercice final — Relier deux bâtiments distants",
    intro: `<p>Une université veut relier deux bâtiments distants de 3 km, à très haut débit, en traversant une zone remplie de câbles électriques et de transformateurs. On choisit la technologie.</p>`,
    questions: [
      { type: "qcm", q: "Le cuivre (paire torsadée) est-il envisageable pour ces 3 km ?", opts: ["Oui, sans problème", "Non : la limite du cuivre est 100 m", "Oui, avec un RJ45 renforcé", "Oui, en Cat7"], a: 1, exp: "3 km dépasse largement la limite de 100 m du cuivre : il faut de la fibre." },
      { type: "qcm", q: "Quelle fibre convient pour 3 km à haut débit ?", opts: ["Multimode", "Monomode", "Coaxiale", "Cat6a"], a: 1, exp: "Le monomode est adapté aux longues distances (plusieurs km)." },
      { type: "input", q: "Pourquoi la fibre est-elle idéale face aux transformateurs électriques ? (un mot)", a: ["insensible", "immunisee", "immunisée", "immunite", "immunité"], ph: "un mot", exp: "Elle est insensible/immunisée aux interférences électromagnétiques." },
      { type: "vf", q: "La lumière reste dans la fibre grâce à la réflexion totale interne.", a: true, exp: "Oui : la lumière ricoche dans le cœur sans en sortir." },
      { type: "qcm", q: "Un inconvénient à prévoir dans le budget et la pose ?", opts: ["La fibre est très bon marché", "La fibre est fragile et demande des connecteurs/outils spécialisés", "La fibre rouille", "La fibre capte les interférences"], a: 1, exp: "La fibre coûte plus cher, est fragile et exige une pose spécialisée." }
    ],
    solution: `<pre class="pseudo"># Choix pour 3 km, haut debit, zone electrique bruyante
Cuivre  : exclu (limite 100 m)
Solution: FIBRE OPTIQUE
Type    : MONOMODE (longues distances, plusieurs km)
Atout   : immunisee aux interferences des transformateurs
A prevoir: cout + connecteurs specialises (SC/LC/ST), fragilite</pre>
<p>Quand la distance ou le débit explosent, la fibre s'impose. Demain : comment on organise physiquement tous ces câbles, avec les topologies.</p>`
  }
};
