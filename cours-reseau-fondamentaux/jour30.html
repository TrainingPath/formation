<script>
var DAY = {
  num: 30,
  title: "Pratique : un simulateur réseau",
  subtitle: "Monter un petit LAN virtuel avec Packet Tracer ou GNS3, sans acheter un seul câble.",
  theory: `
<h3>1. Pourquoi simuler un réseau ?</h3>
<p>Acheter des switches, des routeurs et tirer des câbles pour s'entraîner coûte cher et prend de la place. Les <strong>simulateurs de réseau</strong> permettent de construire une maquette entièrement virtuelle sur ton ordinateur : tu poses des équipements, tu les relies, tu les configures, et tu observes les trames circuler. C'est l'outil idéal pour pratiquer tout ce qu'on a vu ce mois-ci sans risque et sans matériel.</p>
<h3>2. Deux outils de référence : Packet Tracer et GNS3</h3>
<p><strong>Cisco Packet Tracer</strong> est un logiciel gratuit édité par Cisco, très utilisé pour l'apprentissage (notamment dans le cursus CCNA). Il <em>simule</em> le comportement des équipements : simple, léger, parfait pour débuter et voir les paquets se déplacer en mode animation.</p>
<p><strong>GNS3</strong> (<em>Graphical Network Simulator</em>) va plus loin : il fait tourner de <em>vrais</em> systèmes d'exploitation d'équipements (des images réelles), ce qui le rapproche de la réalité, mais il est plus lourd et plus complexe. Pour un débutant, on commence par Packet Tracer.</p>
<div class="tip">Résumé : <strong>Packet Tracer</strong> = simulation pédagogique, léger, idéal pour apprendre. <strong>GNS3</strong> = émulation réaliste avec de vraies images système, plus exigeant. Les deux permettent de bâtir un LAN virtuel.</div>
<h3>3. Les briques de base dans le simulateur</h3>
<p>Dans l'interface, tu disposes d'une bibliothèque d'objets à glisser sur le plan de travail :</p>
<pre class="pseudo"># Ce que tu poses pour un petit LAN :
- des PC (End Devices)          -&gt; les postes de travail
- un switch (Switches)          -&gt; le point central en etoile
- des cables (Connections)      -&gt; le "cuivre droit" relie PC &lt;-&gt; switch
# Puis on configure chaque PC : adresse IP + masque</pre>
<p>Le câble le plus courant entre un PC et un switch est le <strong>câble droit</strong> (<em>straight-through</em>). Dans Packet Tracer, l'icône éclair (« automatique ») choisit le bon câble pour toi si tu débutes.</p>
<h3>4. Construire un LAN simple, étape par étape</h3>
<pre class="pseudo"># Objectif : 3 PC qui se pinguent via un switch
1. Glisser 1 switch et 3 PC sur le plan
2. Relier chaque PC a un port du switch (cable droit)
3. Configurer les IP (meme reseau 192.168.1.0/24) :
   PC0 -&gt; 192.168.1.10   masque 255.255.255.0
   PC1 -&gt; 192.168.1.11   masque 255.255.255.0
   PC2 -&gt; 192.168.1.12   masque 255.255.255.0
4. Tester : depuis PC0, ouvrir l'invite et taper :
   ping 192.168.1.11</pre>
<p>Si la configuration est bonne, le <strong>ping</strong> répond (« Reply from … »). Tu viens de vérifier, en virtuel, qu'un switch relie des machines d'un même réseau IP. Les liens passent du rouge (down) au vert (up) quand tout fonctionne.</p>
<h3>5. Observer ce qu'on a appris tout le mois</h3>
<p>Le simulateur possède un <strong>mode simulation</strong> qui fige le temps et montre chaque trame se déplacer, avec le détail des en-têtes. Tu peux littéralement voir : la requête <strong>ARP</strong> partir en broadcast, le switch <strong>apprendre</strong> les MAC dans sa table CAM, puis le <strong>ping</strong> (protocole ICMP) atteindre sa cible. C'est la théorie qui prend vie. Tu peux aussi créer des <strong>VLAN</strong> sur le switch et constater l'isolation de tes propres yeux.</p>
<div class="warn">Un simulateur reste un modèle : il ne reproduit pas tous les défauts du monde réel (interférences, câbles abîmés, bugs de firmware). C'est un excellent terrain d'apprentissage, mais rien ne remplace totalement la manipulation de vrai matériel.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Simulateur = maquette reseau virtuelle, gratuite, sans risque
# Packet Tracer (Cisco) : simple, pedagogique -&gt; pour debuter
# GNS3 : emulation realiste (vraies images) -&gt; plus avance
# LAN de base : PC + switch + cables droits + IP du meme reseau
# Tester avec : ping (ICMP) ; observer en mode simulation
# On y (re)voit : ARP, table CAM, broadcast, VLAN</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un simulateur réseau comme Packet Tracer ?", opts: ["À capturer et analyser le trafic d'un vrai réseau", "À construire et tester un réseau virtuel sans matériel", "À configurer à distance un routeur physique", "À attribuer les adresses IP d'un réseau réel"], a: 1, exp: "Il permet de bâtir et tester une maquette réseau virtuelle sur son PC." },
    { type: "qcm", q: "Quel simulateur, édité par Cisco, est le plus adapté pour débuter ?", opts: ["GNS3", "Packet Tracer", "Wireshark", "VirtualBox"], a: 1, exp: "Cisco Packet Tracer est léger et pédagogique, idéal pour débuter." },
    { type: "qcm", q: "Qu'est-ce qui distingue GNS3 de Packet Tracer ?", opts: ["GNS3 est payant uniquement", "GNS3 émule de vraies images système, plus réaliste mais plus lourd", "GNS3 ne gère pas les switches", "GNS3 se limite aux réseaux sans fil"], a: 1, exp: "GNS3 fait tourner de vraies images système : plus réaliste, plus exigeant." },
    { type: "qcm", q: "Quel type de câble relie classiquement un PC à un switch ?", opts: ["Câble croisé", "Câble droit (straight-through)", "Câble console", "Câble à fibre optique"], a: 1, exp: "Un câble droit (straight-through) relie un PC à un switch." },
    { type: "qcm", q: "Quelle commande teste, depuis un PC, s'il joint un autre PC du LAN ?", opts: ["ping", "ipconfig", "tracert", "nslookup"], a: 0, exp: "ping envoie des paquets ICMP pour vérifier la connectivité." },
    { type: "qcm", q: "Quel mode du simulateur permet de voir chaque trame se déplacer pas à pas ?", opts: ["Le mode temps réel", "Le mode simulation", "Le mode configuration", "Le mode capture"], a: 1, exp: "Le mode simulation fige le temps et anime chaque trame." },
    { type: "vf", q: "Un simulateur permet de s'entraîner sans acheter de vrai matériel réseau.", a: true, exp: "Vrai : tout est virtuel, gratuit et sans risque." },
    { type: "vf", q: "Packet Tracer est plus lourd et plus complexe que GNS3.", a: false, exp: "Faux : c'est l'inverse. Packet Tracer est plus léger ; GNS3 est plus lourd." },
    { type: "vf", q: "Dans le simulateur, on peut voir une requête ARP partir en broadcast et le switch remplir sa table CAM.", a: true, exp: "Vrai : le mode simulation montre ARP, l'apprentissage CAM, le ping, etc." },
    { type: "vf", q: "Un simulateur reproduit parfaitement tous les défauts du matériel réel (interférences, câbles abîmés).", a: false, exp: "Faux : c'est un modèle ; il ne reproduit pas tous les défauts physiques du réel." },
    { type: "input", q: "Quel protocole (test de connectivité) utilise la commande ping ? (sigle de 4 lettres)", a: ["icmp"], ph: "4 lettres", exp: "ping s'appuie sur le protocole ICMP." },
    { type: "input", q: "Que signifie le sigle GNS3 (2 premiers mots) ? Donne « Graphical … Simulator » en un mot manquant.", a: ["network", "reseau"], ph: "un mot", exp: "GNS = Graphical Network Simulator." },
    { type: "input", q: "Pour que 3 PC se pinguent via un switch, ils doivent être dans le même réseau IP. Écris le masque en /24 sous forme décimale.", a: ["255.255.255.0"], ph: "255.255.…", exp: "/24 correspond au masque 255.255.255.0." },
    { type: "input", q: "Quel élément central, en topologie étoile, relie tous les PC du LAN virtuel ?", a: ["switch", "un switch", "le switch", "commutateur"], ph: "un mot", exp: "Le switch est le point central de l'étoile." },
    { type: "input", q: "De quelle couleur deviennent typiquement les liens quand la connexion fonctionne dans Packet Tracer ?", a: ["vert", "verte", "en vert", "vertes"], ph: "une couleur", exp: "Les liens passent au vert quand le lien est actif (up)." }
  ],
  final: {
    title: "Exercice final — Ta première maquette",
    intro: `<p>Dans Packet Tracer, tu poses 1 switch et 2 PC. Tu relies chaque PC à un port du switch avec un câble droit. Tu configures PC0 en 192.168.1.10 /24 et PC1 en 192.168.1.20 /24. Tu veux vérifier que ça marche.</p>`,
    questions: [
      { type: "qcm", q: "Quelle topologie physique as-tu réalisée ?", opts: ["Un bus", "Une étoile (switch au centre)", "Un anneau", "Un maillage complet"], a: 1, exp: "Des PC reliés à un switch central forment une topologie en étoile." },
      { type: "qcm", q: "Depuis PC0, quelle commande vérifie l'accès à PC1 ?", opts: ["ping 192.168.1.20", "tracert 192.168.1.20", "ipconfig /release", "netstat -an"], a: 0, exp: "ping 192.168.1.20 teste la connectivité vers PC1." },
      { type: "vf", q: "PC0 et PC1 étant dans le même réseau 192.168.1.0/24, le switch suffit à les faire communiquer (pas besoin de routeur).", a: true, exp: "Vrai : même réseau IP + switch = communication directe, sans routeur." },
      { type: "qcm", q: "En mode simulation, avant le premier ping, que fait d'abord PC0 pour connaître la MAC de PC1 ?", opts: ["Un DHCP", "Une requête ARP en broadcast", "Une résolution DNS", "Rien"], a: 1, exp: "PC0 envoie une requête ARP en broadcast pour obtenir la MAC de PC1." },
      { type: "input", q: "Après ces échanges, qu'a rempli le switch avec les adresses MAC de PC0 et PC1 ? (nom de la table)", a: ["table cam", "cam", "table mac", "table d'adresses mac", "table de commutation"], ph: "table …", exp: "Le switch a rempli sa table CAM (table d'adresses MAC)." }
    ],
    solution: `<pre class="pseudo"># Maquette (topologie etoile) :
   PC0 (192.168.1.10/24)        PC1 (192.168.1.20/24)
        \\                          /
         \\___ cable droit ___[ SWITCH ]___ cable droit ___/

# Test :  PC0>  ping 192.168.1.20   -&gt; Reply (succes)
# En mode simulation on observe :
#   1) ARP broadcast (PC0 cherche la MAC de PC1)
#   2) le switch APPREND les MAC -> table CAM
#   3) l'echo ICMP (ping) atteint PC1 et revient</pre>
<p>Un switch, deux PC, le même réseau : ta première maquette fonctionne. Tu as vu, en direct, ARP, la table CAM et le ping — toute la théorie du mois réunie.</p>`
  }
};
</script>
