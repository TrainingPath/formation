var DAY = {
  num: 9,
  title: "Le modèle TCP/IP face au modèle OSI",
  subtitle: "Deux cartes du même territoire : quatre couches contre sept.",
  theory: `
<h3>1. Pourquoi deux modèles ?</h3>
<p>Un réseau est une machine complexe. Pour la comprendre, on la découpe en <strong>couches</strong> (en anglais <em>layers</em>) : chaque couche rend un service à celle du dessus et s'appuie sur celle du dessous. Il existe deux « cartes » de ce découpage. Le modèle <strong>OSI</strong> (« Open Systems Interconnection »), théorique, compte <strong>7 couches</strong>. Le modèle <strong>TCP/IP</strong>, plus ancien et surtout <em>réellement utilisé</em> sur Internet, en compte <strong>4</strong>. OSI est la règle de grammaire idéale ; TCP/IP est la langue parlée tous les jours.</p>
<h3>2. Les 4 couches de TCP/IP</h3>
<p>De la plus haute (proche de l'utilisateur) à la plus basse (proche du câble) :</p>
<pre class="pseudo"># Modele TCP/IP (4 couches)
4. Application  -> les logiciels (web, mail, DNS...)
3. Transport    -> bout-a-bout, fiabilite (TCP, UDP)
2. Internet     -> l'adressage et le routage (IP)
1. Acces reseau -> la carte, le cable, le Wi-Fi</pre>
<p>La couche <strong>Application</strong> regroupe tout ce que voit l'utilisateur : navigateur, messagerie, transfert de fichiers. La couche <strong>Transport</strong> gère la conversation de bout en bout entre deux programmes. La couche <strong>Internet</strong> s'occupe des adresses IP et choisit le chemin. La couche <strong>Accès réseau</strong> (parfois appelée « Liaison » ou « Hôte-à-réseau ») envoie enfin les bits sur le support physique.</p>
<h3>3. La correspondance avec OSI</h3>
<p>Les 4 couches TCP/IP « recouvrent » les 7 couches OSI. La grande différence : TCP/IP <strong>fusionne</strong> plusieurs couches OSI en une seule.</p>
<pre class="pseudo"># OSI (7)                    # TCP/IP (4)
7. Application       \\
6. Presentation       >----> Application
5. Session          /
4. Transport         ------> Transport
3. Reseau            ------> Internet
2. Liaison           \\
1. Physique           >----> Acces reseau</pre>
<p>Autrement dit : les couches OSI 7-6-5 (Application, Présentation, Session) forment l'unique couche <strong>Application</strong> de TCP/IP ; la couche OSI 4 (Transport) reste la couche <strong>Transport</strong> ; la couche OSI 3 (Réseau) devient <strong>Internet</strong> ; et les couches OSI 2-1 (Liaison, Physique) fusionnent en <strong>Accès réseau</strong>.</p>
<div class="tip">Un moyen mnémotechnique pour OSI, de 7 à 1 : <strong>« Après Plusieurs Semaines Tout Respire Le Printemps »</strong> (Application, Présentation, Session, Transport, Réseau, Liaison, Physique).</div>
<h3>4. Encapsulation : chaque couche ajoute son enveloppe</h3>
<p>Quand une donnée descend les couches, chaque couche ajoute son <strong>en-tête</strong> (en anglais <em>header</em>). On appelle cela l'<strong>encapsulation</strong>. À la réception, on retire les enveloppes une à une (dés-encapsulation). Le nom de l'unité de données change à chaque niveau :</p>
<pre class="pseudo"># En descendant l'emetteur (encapsulation)
Application : donnee (data)
Transport   : segment (TCP) ou datagramme (UDP)
Internet    : paquet (packet)
Acces reseau: trame (frame) -> bits sur le cable</pre>
<div class="warn">Ne confonds pas « couche » et « protocole ». Une couche est un rôle ; un protocole est un outil qui remplit ce rôle. IP remplit le rôle de la couche Internet, TCP celui de la couche Transport, mais ce sont des choses distinctes.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># OSI = 7 couches (theorie)  |  TCP/IP = 4 couches (reel)
Application (TCP/IP) = OSI 7+6+5
Transport            = OSI 4
Internet             = OSI 3
Acces reseau         = OSI 2+1
# Encapsulation : data -> segment -> paquet -> trame -> bits</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de couches compte le modèle TCP/IP ?", opts: ["7", "5", "4", "3"], a: 2, exp: "TCP/IP compte 4 couches ; c'est OSI qui en compte 7." },

    { type: "qcm", q: "Quelle est la couche la plus basse de TCP/IP ?", opts: ["Application", "Transport", "Internet", "Accès réseau"], a: 3, exp: "La couche Accès réseau touche le support physique (câble, Wi-Fi)." },
    { type: "vf", q: "Le modèle TCP/IP est celui réellement utilisé sur Internet.", a: true, exp: "Oui : OSI reste surtout une référence théorique, TCP/IP est opérationnel." },
    { type: "qcm", q: "Les couches OSI 7, 6 et 5 correspondent à quelle couche TCP/IP ?", opts: ["Transport", "Internet", "Application", "Accès réseau"], a: 2, exp: "Application, Présentation et Session (OSI) forment l'Application TCP/IP." },
    { type: "input", q: "Quelle couche TCP/IP correspond à la couche 3 (Réseau) d'OSI ? (un mot)", a: ["internet", "couche internet"], ph: "un mot", exp: "La couche Internet de TCP/IP correspond à la couche Réseau d'OSI." },
    { type: "vf", q: "La couche Transport existe dans les deux modèles avec le même nom.", a: true, exp: "Oui, elle porte le nom Transport dans OSI (couche 4) comme dans TCP/IP." },
    { type: "qcm", q: "Les couches Physique et Liaison d'OSI fusionnent en quelle couche TCP/IP ?", opts: ["Application", "Transport", "Internet", "Accès réseau"], a: 3, exp: "OSI 1 (Physique) + OSI 2 (Liaison) = Accès réseau (TCP/IP)." },
    { type: "input", q: "Comment appelle-t-on le fait que chaque couche ajoute son en-tête aux données ? (un mot)", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation : chaque couche enveloppe la donnée avec son en-tête." },
    { type: "qcm", q: "À la couche Internet, l'unité de données s'appelle…", opts: ["Une trame", "Un paquet", "Un segment", "Un bit"], a: 1, exp: "Couche Internet = paquet (packet). La trame, c'est la couche Accès réseau." },
    { type: "vf", q: "Une couche et un protocole sont exactement la même chose.", a: false, exp: "Non : la couche est un rôle ; le protocole (IP, TCP…) est un outil qui le remplit." },
    { type: "input", q: "À la couche Accès réseau, comment appelle-t-on l'unité de données envoyée sur le câble ? (un mot)", a: ["trame", "la trame", "frame"], ph: "un mot", exp: "C'est la trame (frame), juste avant l'émission des bits." },
    { type: "qcm", q: "Quel protocole occupe le rôle de la couche Internet ?", opts: ["TCP", "IP", "HTTP", "Ethernet"], a: 1, exp: "IP (Internet Protocol) remplit le rôle d'adressage/routage de la couche Internet." },
    { type: "qcm", q: "Dans quel ordre les données descendent-elles chez l'émetteur ?", opts: ["Physique → Application", "Application → Transport → Internet → Accès réseau", "Transport → Application → Internet", "Internet → Application → Transport"], a: 1, exp: "On descend depuis l'Application (haut) vers l'Accès réseau (bas)." },
    { type: "input", q: "Cite un des deux protocoles typiques de la couche Transport. (un sigle)", a: ["tcp", "udp"], ph: "un sigle", exp: "TCP (fiable) et UDP (rapide) sont les protocoles de Transport." }
  ],
  final: {
    title: "Exercice final — Cartographier une connexion web",
    intro: `<p>Sofia ouvre son navigateur et charge une page web. On veut suivre sa requête à travers les couches, et savoir à quoi chaque étape correspond dans OSI et TCP/IP.</p>`,
    questions: [
      { type: "qcm", q: "Le navigateur de Sofia (logiciel) agit à quelle couche TCP/IP ?", opts: ["Accès réseau", "Internet", "Transport", "Application"], a: 3, exp: "Un logiciel visible par l'utilisateur relève de la couche Application." },
      { type: "qcm", q: "La couche Application de TCP/IP recouvre quelles couches OSI ?", opts: ["1 et 2", "3 seule", "4 seule", "5, 6 et 7"], a: 3, exp: "Application TCP/IP = Session + Présentation + Application (OSI 5-6-7)." },
      { type: "input", q: "L'adresse IP de destination est traitée à quelle couche TCP/IP ? (un mot)", a: ["internet", "couche internet"], ph: "un mot", exp: "L'adressage IP relève de la couche Internet." },
      { type: "vf", q: "Avant de partir sur le câble, la donnée devient une trame à la couche Accès réseau.", a: true, exp: "Oui : la dernière encapsulation produit une trame, puis des bits." },
      { type: "qcm", q: "En résumé, TCP/IP et OSI décrivent…", opts: ["Deux réseaux différents et incompatibles", "Le même fonctionnement avec un découpage différent (4 vs 7)", "Uniquement le Wi-Fi", "Deux marques de matériel"], a: 1, exp: "Ce sont deux modèles du même fonctionnement, l'un en 4 couches, l'autre en 7." }
    ],
    solution: `<pre class="pseudo"># Le trajet d'une requete web
Application (navigateur)  = OSI 7+6+5
Transport (TCP, port 443) = OSI 4
Internet (adresse IP)     = OSI 3
Acces reseau (trame/bits) = OSI 2+1
# data -> segment -> paquet -> trame -> bits</pre>
<p>Sofia a suivi sa requête de haut en bas. Demain : on plonge tout en bas, dans la couche physique.</p>`
  }
};
