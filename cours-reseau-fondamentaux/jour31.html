<script>
var DAY = {
  num: 31,
  title: "Projet final : concevoir et câbler un petit LAN",
  subtitle: "La synthèse du mois : de la topologie au plan d'adressage, tu montes un vrai réseau local.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Voici l'aboutissement du parcours. On te confie une petite structure : une association de 10 postes répartis dans deux salles, plus une imprimante réseau et un accès Internet. Objectif : <strong>concevoir de A à Z</strong> son réseau local (<em>LAN</em>), en réutilisant tout ce que tu as appris. On va décider de la <strong>topologie</strong>, choisir le <strong>matériel</strong>, les <strong>câbles</strong>, et écrire un <strong>plan d'adressage</strong>.</p>
<h3>2. Étape 1 : choisir la topologie</h3>
<p>Parmi les topologies physiques vues (bus, anneau, étoile), on retient sans hésiter l'<strong>étoile</strong> (<em>star</em>) : chaque poste possède son propre câble vers un point central, le <strong>switch</strong>. C'est la topologie standard des réseaux modernes. Son gros avantage : si un câble ou un poste tombe en panne, <strong>seul ce poste</strong> est coupé, les autres continuent. À l'inverse du bus, où une coupure paralysait tout le monde.</p>
<pre class="pseudo"># Topologie en etoile
     PC   PC   PC
       \\  |  /
   PC --[ SWITCH ]-- PC
       /  |  \\
     PC   PC  Imprimante
              |
          [ ROUTEUR ] -- Internet</pre>
<h3>3. Étape 2 : choisir le matériel</h3>
<p>Il faut un <strong>switch</strong> avec assez de ports : 10 PC + 1 imprimante + 1 lien vers le routeur = 12 ports minimum, on prend donc un switch <strong>16 ou 24 ports</strong> (on prévoit toujours de la marge). Le <strong>routeur</strong> assure la sortie vers Internet (la passerelle). Si les deux salles sont éloignées, on peut mettre un switch par salle et les relier par un lien (trunk si on utilise des VLAN).</p>
<div class="tip">Règle de dimensionnement : compte tes appareils, ajoute l'imprimante et le lien routeur, puis prends la taille de switch juste au-dessus (8, 16, 24, 48 ports). Garder des ports libres évite de tout remplacer au premier ajout.</div>
<h3>4. Étape 3 : choisir les câbles</h3>
<p>Entre chaque PC et le switch : de la <strong>paire torsadée</strong> avec connecteurs <strong>RJ45</strong>, en câble <strong>droit</strong> (<em>straight-through</em>). Une catégorie <strong>Cat 5e</strong> ou <strong>Cat 6</strong> suffit largement pour du Gigabit (1 Gbit/s). Rappelle-toi la limite : <strong>100 mètres maximum</strong> par segment de cuivre. Au-delà, il faudrait de la <strong>fibre optique</strong> (utile aussi entre deux bâtiments, car insensible aux perturbations électriques).</p>
<h3>5. Étape 4 : le plan d'adressage et les VLAN</h3>
<p>On choisit un réseau privé, par exemple <strong>192.168.1.0/24</strong> (masque 255.255.255.0), qui offre 254 adresses utilisables — largement assez. La passerelle (le routeur) prend souvent <strong>192.168.1.1</strong>. On réserve une plage fixe pour l'imprimante et les serveurs, et on laisse le <strong>DHCP</strong> distribuer le reste aux PC. Si l'on veut séparer deux services (par exemple bureau et invités), on crée deux <strong>VLAN</strong> : chacun devient un domaine de diffusion isolé, et le routeur assure le passage contrôlé entre eux.</p>
<pre class="pseudo"># Plan d'adressage (exemple)
Reseau        : 192.168.1.0 / 24  (masque 255.255.255.0)
Passerelle    : 192.168.1.1        (le routeur)
Imprimante    : 192.168.1.10       (adresse fixe)
PC (DHCP)     : 192.168.1.100 -&gt; 192.168.1.200
# Option VLAN : VLAN 10 Bureau | VLAN 20 Invites</pre>
<div class="warn">Ne mélange pas les rôles : le <strong>switch</strong> relie les machines d'un même réseau (couche 2) ; le <strong>routeur</strong> relie ton réseau au monde extérieur et route entre VLAN (couche 3). Deux équipements, deux missions.</div>
<h3>6. Ce qu'il faut retenir (synthèse du cours)</h3>
<pre class="pseudo"># Concevoir un LAN, la methode :
1) Topologie   -&gt; ETOILE (robuste, standard) autour d'un switch
2) Materiel    -&gt; switch (assez de ports) + routeur (Internet/inter-VLAN)
3) Cablage     -&gt; paire torsadee RJ45, cable DROIT, Cat 5e/6, &lt;= 100 m
                  (fibre si longue distance / entre batiments)
4) Adressage   -&gt; reseau prive /24, passerelle .1, DHCP pour les PC
5) Segmentation-&gt; VLAN si besoin d'isoler (1 VLAN = 1 domaine de diffusion)
# Switch = couche 2 (MAC, table CAM) ; Routeur = couche 3 (IP)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle topologie physique choisit-on pour un LAN moderne robuste ?", opts: ["Le bus", "L'anneau", "L'étoile (autour d'un switch)", "Le maillage total"], a: 2, exp: "L'étoile est le standard : chaque poste a son câble vers le switch central." },
    { type: "qcm", q: "Principal avantage de l'étoile face au bus ?", opts: ["Elle utilise moins de câble", "La panne d'un câble ne coupe que le poste concerné", "Elle n'a pas besoin de switch", "Elle est plus lente"], a: 1, exp: "En étoile, une coupure isole un seul poste ; en bus, tout tombait." },
    { type: "qcm", q: "Pour 10 PC + 1 imprimante + 1 lien routeur, quelle taille de switch est raisonnable ?", opts: ["4 ports", "16 ou 24 ports", "1 port", "Aucun switch nécessaire"], a: 1, exp: "12 appareils minimum : on prend 16 ou 24 ports pour garder de la marge." },
    { type: "qcm", q: "Quel équipement assure la sortie vers Internet (la passerelle) ?", opts: ["Le switch", "Le routeur", "Le hub", "L'imprimante"], a: 1, exp: "Le routeur relie le LAN à Internet et sert de passerelle par défaut." },
    { type: "qcm", q: "Quel câble relie un PC à un switch ?", opts: ["Paire torsadée RJ45, câble droit", "Câble croisé", "Câble coaxial", "Câble d'alimentation"], a: 0, exp: "Un câble droit (straight-through) en paire torsadée RJ45." },
    { type: "qcm", q: "Quelle longueur maximale ne faut-il pas dépasser sur un segment de cuivre (paire torsadée) ?", opts: ["10 mètres", "100 mètres", "1 kilomètre", "500 mètres"], a: 1, exp: "La limite est de 100 mètres par segment de cuivre ; au-delà, fibre optique." },
    { type: "vf", q: "Le switch travaille en couche 2 (adresses MAC), le routeur en couche 3 (adresses IP).", a: true, exp: "Vrai : switch = commutation MAC (couche 2), routeur = routage IP (couche 3)." },
    { type: "vf", q: "Dans une topologie en étoile, une coupure de câble met tout le réseau à l'arrêt.", a: false, exp: "Faux : seul le poste dont le câble est coupé perd la connexion." },
    { type: "vf", q: "Le DHCP peut distribuer automatiquement les adresses IP aux PC du LAN.", a: true, exp: "Vrai : on laisse souvent le DHCP attribuer les IP aux postes." },
    { type: "vf", q: "Pour relier deux bâtiments distants de 300 mètres, la paire torsadée en cuivre convient.", a: false, exp: "Faux : au-delà de 100 m, il faut de la fibre optique." },
    { type: "input", q: "Écris le masque de sous-réseau correspondant à un réseau /24.", a: ["255.255.255.0"], ph: "255.255.…", exp: "/24 = 255.255.255.0, soit 254 adresses utilisables." },
    { type: "input", q: "Quelle adresse IP prend le plus souvent la passerelle (le routeur) dans 192.168.1.0/24 ?", a: ["192.168.1.1", "1", ".1"], ph: "192.168.1.…", exp: "Par convention, la passerelle prend souvent 192.168.1.1." },
    { type: "input", q: "Quelle technologie de câblage utiliser entre deux bâtiments, insensible aux perturbations électriques ?", a: ["fibre", "fibre optique", "la fibre", "la fibre optique"], ph: "un mot", exp: "La fibre optique : longue distance et immunité aux interférences." },
    { type: "input", q: "Pour isoler deux services sur les mêmes switches, on crée des… ? (rappel : 1 = 1 domaine de diffusion)", a: ["vlan", "des vlan", "les vlan"], ph: "un sigle", exp: "Des VLAN : chacun est un domaine de diffusion isolé." },
    { type: "input", q: "Quel service, cité au jour 29, indique par ipconfig /all s'il a attribué l'IP automatiquement ?", a: ["dhcp", "le dhcp"], ph: "un sigle", exp: "Le DHCP attribue automatiquement les adresses IP." }
  ],
  final: {
    title: "Exercice final — Le réseau de l'association",
    intro: `<p>Récapitulons le projet. Association : 10 PC (2 salles), 1 imprimante réseau, 1 accès Internet. Budget serré, réseau fiable et simple. On te demande de valider les grands choix de conception.</p>`,
    questions: [
      { type: "qcm", q: "Quelle topologie et quel équipement central choisis-tu ?", opts: ["Un bus avec un hub", "Une étoile avec un switch", "Un anneau sans équipement", "Un maillage de routeurs"], a: 1, exp: "Étoile + switch : robuste, standard, simple à câbler et à dépanner." },
      { type: "qcm", q: "Combien de ports au minimum le switch doit-il offrir ?", opts: ["4", "12 (10 PC + imprimante + routeur), donc 16 en pratique", "2", "48 obligatoirement"], a: 1, exp: "12 appareils à brancher : un switch 16 ports laisse de la marge." },
      { type: "qcm", q: "Quel plan d'adressage privé convient pour ces machines ?", opts: ["10.0.0.0/30", "192.168.1.0/24 (254 adresses)", "1.1.1.1/32", "255.255.255.255"], a: 1, exp: "192.168.1.0/24 offre 254 adresses : largement suffisant ici." },
      { type: "vf", q: "L'imprimante partagée gagne à recevoir une adresse IP fixe plutôt que de changer via DHCP.", a: true, exp: "Vrai : une adresse fixe garantit que les postes la retrouvent toujours." },
      { type: "input", q: "Quel équipement (couche 3) relie ce LAN à Internet et sert de passerelle par défaut ?", a: ["routeur", "le routeur", "un routeur"], ph: "un mot", exp: "Le routeur : passerelle vers Internet et routage inter-réseaux." }
    ],
    solution: `<pre class="pseudo"># Conception finale du LAN de l'association :
1) Topologie : ETOILE autour d'un SWITCH (16 ports)
2) Materiel  : 1 switch 16 ports + 1 routeur (Internet/passerelle)
3) Cablage   : paire torsadee RJ45, cable DROIT, Cat 5e/6, &lt;= 100 m
4) Adressage : 192.168.1.0/24  (masque 255.255.255.0)
     Passerelle (routeur) : 192.168.1.1
     Imprimante (fixe)    : 192.168.1.10
     PC via DHCP          : 192.168.1.100 -&gt; .200
5) Option    : VLAN Bureau / VLAN Invites si isolation souhaitee

# Rappel des couches :
   SWITCH  -> couche 2 (MAC, table CAM, memes reseau)
   ROUTEUR -> couche 3 (IP, sortie Internet, routage inter-VLAN)</pre>
<p>Bravo : tu viens de concevoir un réseau local complet, du câble au plan d'adressage. C'est la synthèse de tout le cours — topologie, couche physique, adresses MAC, commutation et VLAN réunis dans un projet concret.</p>`
  }
};
</script>

    statement: "En quelques phrases, explique la <strong>différence de rôle</strong> entre le <strong>switch</strong> et le <strong>routeur</strong> de ton projet. Précise la couche OSI de chacun et ce qu'il utilise pour prendre ses décisions (adresse MAC ou adresse IP). Termine en disant lequel sépare les domaines de diffusion.",
    hints: [

    solution: "# SWITCH vs ROUTEUR :\n#\n# Le SWITCH travaille en COUCHE 2 (liaison). Il relie les machines\n# d'un MEME reseau local et decide ou envoyer une trame grace aux\n# adresses MAC, qu'il memorise dans sa table CAM. Seul, il forme\n# un unique domaine de diffusion (il n'arrete pas les broadcasts).\n#\n# Le ROUTEUR travaille en COUCHE 3 (reseau). Il relie des reseaux\n# DIFFERENTS (par ex. le LAN et Internet) et decide avec les\n# adresses IP. Il sert de passerelle par defaut.\n#\n# Qui separe les domaines de diffusion ? Le ROUTEUR (couche 3),\n# ou l'usage de VLAN sur le switch (1 VLAN = 1 domaine de diffusion).",
