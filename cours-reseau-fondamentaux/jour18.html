  title: "Le domaine de collision",
  subtitle: "La zone où deux machines peuvent se marcher dessus : plus elle est grande, plus ça bouchonne.",
  theory: `
<h3>1. Définition : où les collisions sont possibles</h3>
<p>Un <strong>domaine de collision</strong> (en anglais <em>collision domain</em>) est l'ensemble des appareils qui partagent le même média et peuvent donc <strong>entrer en collision</strong> entre eux. Autrement dit : si deux machines émettent en même temps et que leurs signaux peuvent se rencontrer et se mélanger, c'est qu'elles sont dans le <strong>même</strong> domaine de collision.</p>
<p>Reprenons l'image de la salle de réunion du jour précédent : un domaine de collision, c'est <strong>une pièce</strong>. Toutes les personnes dans la même pièce doivent parler chacune leur tour. Deux personnes dans deux pièces séparées peuvent parler en même temps sans se gêner : elles sont dans deux domaines de collision différents.</p>
<h3>2. Plus il y a de monde, plus ça collisionne</h3>
<p>Sur un réseau partagé (half-duplex), toutes les machines se disputent le même câble. Tant qu'il y a peu de trafic, tout va bien. Mais dès qu'on ajoute des machines actives, la probabilité que deux d'entre elles parlent en même temps augmente. Résultat : <strong>plus de collisions</strong>, donc plus de retransmissions, donc un réseau qui ralentit alors même qu'on lui demande d'aller plus vite.</p>
<div class="warn">La bande passante d'un domaine de collision est <strong>partagée</strong> entre tous ses membres. Dix machines sur un même hub à 10 Mbit/s ne disposent pas de 10 Mbit/s chacune : elles se partagent ces 10 Mbit/s, et les collisions rognent encore ce débit utile.</div>
<h3>3. Segmenter pour réduire les collisions</h3>
<p>La solution est de <strong>découper</strong> le réseau en plusieurs domaines de collision plus petits, pour que moins de machines se disputent le même média. C'est là que le type d'équipement compte, car chaque équipement traite les collisions différemment :</p>
<pre class="pseudo"># Combien de domaines de collision selon l'equipement :
Concentrateur (hub) : 1 SEUL domaine pour tous ses ports
                      -&gt; il repete le signal partout, collisions partagees.
Commutateur (switch): 1 domaine de collision PAR PORT
                      -&gt; il isole chaque machine, tres peu de collisions.
Routeur             : separe aussi les domaines (et les domaines de diffusion).</pre>
<p>Un <strong>hub</strong> ne segmente rien : tout ce qui est branché dessus reste dans un seul et même domaine de collision. Un <strong>commutateur</strong> (switch), lui, crée un domaine de collision <strong>par port</strong> : chaque machine a son propre segment, et deux machines reliées à deux ports différents peuvent émettre en même temps sans collision.</p>
<h3>4. Half-duplex, full-duplex et disparition des collisions</h3>
<p>En <strong>half-duplex</strong>, une liaison ne permet d'émettre que dans un sens à la fois (comme un talkie-walkie). Les collisions y sont possibles. En <strong>full-duplex</strong>, une liaison permet d'émettre et de recevoir <strong>en même temps</strong> (comme le téléphone) sur des paires de fils séparées. Sur une liaison full-duplex entre une machine et un port de commutateur, il n'y a plus de partage : <strong>le domaine de collision se réduit à deux appareils</strong> qui ne peuvent plus se gêner. Les collisions disparaissent, et CSMA/CD n'a plus rien à faire.</p>
<div class="tip">À ne pas confondre : le <strong>domaine de collision</strong> concerne les collisions (couche liaison, half-duplex). Le <strong>domaine de diffusion</strong> (broadcast domain) concerne la portée des messages envoyés « à tous ». Un commutateur découpe les domaines de collision, mais laisse passer la diffusion : tous ses ports restent dans le même domaine de diffusion. C'est le routeur qui sépare les domaines de diffusion.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Domaine de collision = zone ou 2 emissions peuvent se percuter
# Plus il y a de machines dans le domaine -&gt; plus de collisions -&gt; plus lent
# La bande passante d'un domaine est PARTAGEE entre ses membres
# Hub    : 1 seul domaine de collision (n'isole rien)
# Switch : 1 domaine de collision PAR PORT (il segmente)
# Full-duplex -&gt; plus de collision du tout</pre>`,

    { type: "vf", q: "Plus il y a de machines actives dans un même domaine de collision, plus il y a de collisions.", a: true, exp: "Oui : la probabilité que deux machines émettent en même temps augmente avec le nombre de participants." },

    { type: "vf", q: "Un hub segmente le réseau en plusieurs domaines de collision.", a: false, exp: "Non : un hub ne segmente rien, tout reste dans un seul domaine de collision." },
    { type: "qcm", q: "Pourquoi un réseau sur hub ralentit-il quand on ajoute des machines ?", opts: ["La bande passante augmente avec chaque machine ajoutée", "Plus de machines = plus de collisions = plus de retransmissions", "Le hub doit recalculer sa table d'adresses MAC", "Chaque nouvelle machine réduit le débit du routeur"], a: 1, exp: "Le média partagé subit davantage de collisions à mesure que le trafic augmente." },
    { type: "input", q: "Comment appelle-t-on l'opération qui consiste à découper le réseau en domaines de collision plus petits ?", a: ["segmentation", "segmenter", "la segmentation", "segmenter le reseau"], ph: "un nom d'action", exp: "La segmentation réduit le nombre de machines par domaine de collision." },
    { type: "qcm", q: "Quel équipement sépare aussi les domaines de diffusion (broadcast) ?", opts: ["Le hub", "Le routeur", "Le commutateur (switch)", "Le point d'accès Wi-Fi"], a: 1, exp: "Le routeur sépare les domaines de diffusion ; le switch ne sépare que les domaines de collision." },
    { type: "vf", q: "Un commutateur laisse tous ses ports dans le même domaine de diffusion.", a: true, exp: "Oui : le switch découpe les domaines de collision mais laisse passer la diffusion (même domaine de diffusion)." },
    { type: "qcm", q: "Dix PC sur un hub à 10 Mbit/s : de combien dispose chaque PC en moyenne ?", opts: ["10 Mbit/s chacun", "Ils se partagent les 10 Mbit/s", "100 Mbit/s chacun", "1 Gbit/s chacun"], a: 1, exp: "La bande passante d'un hub est partagée entre toutes les machines du domaine." }
  ],
  final: {

    intro: `<p>Un petit bureau relie huit ordinateurs à un vieux hub à 10 Mbit/s. Aux heures de pointe, tout devient très lent. Le technicien envisage de remplacer le hub par un commutateur. Analysons la situation.</p>`,
    questions: [
      { type: "qcm", q: "Avec le hub, combien de domaines de collision existe-t-il pour les huit PC ?", opts: ["Huit", "Un seul", "Quatre", "Zéro"], a: 1, exp: "Un hub = un seul domaine de collision partagé par les huit machines." },
      { type: "input", q: "Quelle est la cause principale de la lenteur aux heures de pointe (un mot) ?", a: ["les collisions", "collisions", "collision", "la collision"], ph: "un phénomène", exp: "Plus de trafic dans un seul domaine de collision = beaucoup de collisions et de retransmissions." },
      { type: "vf", q: "Chaque PC dispose réellement de 10 Mbit/s pour lui seul avec le hub.", a: false, exp: "Non : les 10 Mbit/s sont partagés entre tous les PC du domaine de collision." },

      { type: "qcm", q: "Bénéfice principal du commutateur en full-duplex ici ?", opts: ["Il regroupe tous les ports dans un seul domaine de collision", "Il supprime les collisions et rend la bande passante dédiée par port", "Il partage un seul débit entre tous les ports", "Il ralentit le réseau"], a: 1, exp: "Full-duplex par port = plus de collision, bande passante dédiée à chaque machine." }
    ],
    solution: `<pre class="pseudo"># Avant (hub) : 8 PC dans 1 SEUL domaine de collision
