<script>
var DAY = {
  num: 16,
  title: "Choisir une topologie",
  subtitle: "Pourquoi l'étoile a gagné, et comment décider en pratique.",
  theory: `
<h3>1. Décider selon des critères concrets</h3>
<p>Choisir une topologie, c'est faire un compromis entre plusieurs critères : la <strong>fiabilité</strong> (résiste-t-elle aux pannes ?), le <strong>coût</strong> (combien de câble, quel matériel ?), la <strong>facilité de dépannage</strong> et d'<strong>extension</strong> (ajouter une machine), et les <strong>performances</strong> (collisions, débit disponible). Aucune topologie n'est parfaite : on choisit celle dont les défauts sont les plus supportables pour le besoin.</p>
<h3>2. Bus : avantages et inconvénients</h3>
<pre class="pseudo"># TOPOLOGIE EN BUS
+ Tres peu de cable, simple a poser
+ Bon marche pour de petits reseaux
- Une coupure du cable = TOUT le reseau tombe
- Cable partage : collisions, debit qui s'effondre avec le trafic
- Difficile a diagnostiquer (ou est la coupure ?)</pre>
<h3>3. Anneau : avantages et inconvénients</h3>
<pre class="pseudo"># TOPOLOGIE EN ANNEAU
+ Pas de collision (jeton qui donne la parole a tour de role)
+ Performances previsibles meme en charge
- Une machine ou un lien en panne peut couper la boucle
- Ajouter/retirer une machine perturbe l'anneau
- Materiel specifique, aujourd'hui obsolete</pre>
<h3>4. Étoile : avantages et inconvénients</h3>
<pre class="pseudo"># TOPOLOGIE EN ETOILE
+ Panne d'un cable/poste = seule cette machine isolee
+ Tres facile a depanner (on teste cable par cable)
+ Facile a etendre (brancher un port de plus)
+ Avec un switch : full-duplex, pas de collision
- Depend de l'equipement central (point unique de defaillance)
- Consomme plus de cable (un par machine)</pre>
<h3>5. Pourquoi l'étoile domine aujourd'hui</h3>
<p>La topologie en <strong>étoile</strong> s'est imposée comme le standard des réseaux locaux modernes. Ses avantages l'emportent largement : une panne reste <strong>localisée</strong> (les autres postes fonctionnent), le <strong>dépannage</strong> est simple, et surtout le remplacement du vieux hub par le <strong>switch</strong> a supprimé les collisions en offrant à chaque machine un lien dédié en <strong>full-duplex</strong>. Le seul vrai risque, le central, se gère par de la redondance (un second switch).</p>
<div class="tip">On combine souvent plusieurs étoiles : chaque étage a son switch, et les switchs sont reliés entre eux vers un switch principal. Cela forme une <strong>étoile hiérarchique</strong> (ou « arbre »), qui est la structure réelle de la plupart des entreprises.</div>
<div class="warn">Le point unique de défaillance de l'étoile (le switch central) n'est pas une fatalité : on le double (redondance) sur les réseaux critiques. En revanche, le défaut du bus (câble unique) et de l'anneau (boucle fragile) est bien plus difficile à contourner.</div>
<h3>6. Une méthode de choix simple</h3>
<pre class="pseudo"># Comment choisir (en pratique)
Besoin de fiabilite + facilite ?  -> ETOILE (switch)
Reseau local moderne, quel qu'il soit ? -> ETOILE
Tres petit budget, provisoire ?   -> le bus a existe, mais evite
Compatibilite Token Ring ancienne ? -> anneau (rare, obsolete)
# Dans 99% des cas actuels : ETOILE autour d'un switch.</pre>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Choisir = compromis fiabilite / cout / depannage / perfs
BUS    : econome mais fragile (cable unique, collisions)
ANNEAU : sans collision mais boucle fragile, obsolete
ETOILE : robuste, extensible, sans collision (switch) -> STANDARD
Central redondant -> on supprime le point unique de defaillance</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle topologie est le standard des réseaux locaux modernes ?", opts: ["Le bus", "L'anneau", "L'étoile", "Aucune"], a: 2, exp: "L'étoile autour d'un switch domine largement aujourd'hui." },
    { type: "qcm", q: "Principal inconvénient de la topologie en étoile ?", opts: ["Elle provoque des collisions", "Elle dépend de l'équipement central (point unique de défaillance)", "Elle utilise très peu de câble", "Elle est impossible à étendre"], a: 1, exp: "Si le switch central tombe, tout s'arrête : c'est le point unique de défaillance." },
    { type: "vf", q: "En étoile, la panne d'un câble de poste n'isole que la machine concernée.", a: true, exp: "Oui : les autres postes continuent de fonctionner, gros avantage de l'étoile." },
    { type: "input", q: "Quel équipement central moderne supprime les collisions en étoile ? (un mot)", a: ["switch", "commutateur", "le switch", "un switch"], ph: "un mot", exp: "Le switch offre un lien dédié full-duplex à chaque machine : pas de collision." },
    { type: "qcm", q: "Un défaut majeur de la topologie en bus ?", opts: ["Trop de câble", "Une coupure du câble fait tomber tout le réseau", "Elle est trop chère", "Elle nécessite un switch"], a: 1, exp: "Le câble unique partagé est fragile : sa coupure paralyse tout." },
    { type: "input", q: "Comment appelle-t-on le défaut de l'étoile où la panne du central arrête tout ? (expression)", a: ["point unique de defaillance", "point de defaillance unique", "spof", "point unique de défaillance"], ph: "une expression", exp: "C'est le point unique de défaillance (SPOF)." },
    { type: "vf", q: "L'anneau évite les collisions grâce à un jeton.", a: true, exp: "Oui : le jeton donne la parole à tour de rôle, évitant les collisions." },
    { type: "qcm", q: "Comment supprime-t-on le point unique de défaillance d'une étoile critique ?", opts: ["En ajoutant des bouchons", "En doublant l'équipement central (redondance)", "En passant en bus", "En retirant le switch"], a: 1, exp: "La redondance (second switch) élimine le point unique de défaillance." },
    { type: "input", q: "Quand on relie plusieurs switchs (un par étage) à un switch principal, on obtient une étoile… (un mot)", a: ["hierarchique", "hiérarchique", "en arbre", "arbre"], ph: "un mot", exp: "C'est l'étoile hiérarchique (ou arbre), structure réelle des entreprises." },
    { type: "qcm", q: "Pourquoi l'étoile est-elle facile à dépanner ?", opts: ["Il n'y a qu'un câble", "On peut tester chaque lien indépendamment", "Le switch localise la panne tout seul", "Le jeton signale la panne"], a: 1, exp: "Chaque machine a son propre lien : on isole et teste cable par câble." },
    { type: "vf", q: "La topologie en anneau est aujourd'hui la plus utilisée en entreprise.", a: false, exp: "Non : l'anneau est obsolète ; c'est l'étoile qui domine." },
    { type: "qcm", q: "Un avantage du bus, malgré ses défauts ?", opts: ["Ultra fiable", "Peu de câble et simple à poser", "Aucune collision", "Extensible à l'infini"], a: 1, exp: "Le bus est économe en câble et simple, mais fragile." },
    { type: "input", q: "Pour un réseau local moderne quelconque, quelle topologie choisir dans la quasi-totalité des cas ? (un mot)", a: ["etoile", "étoile", "en etoile", "l'etoile"], ph: "un mot", exp: "Dans ~99 % des cas actuels : l'étoile autour d'un switch." },
    { type: "qcm", q: "Ajouter une machine est le plus simple dans quelle topologie ?", opts: ["Le bus", "L'anneau", "L'étoile (brancher un port de plus)", "Aucune"], a: 2, exp: "En étoile, il suffit de brancher un port libre du switch." },
    { type: "input", q: "Le switch offre à chaque machine un lien dédié dans quel mode (émission et réception simultanées) ?", a: ["full-duplex", "full duplex", "fullduplex", "duplex integral"], ph: "un terme", exp: "Le full-duplex : chaque lien émet et reçoit en même temps, sans collision." }
  ],
  final: {
    title: "Exercice final — Concevoir le réseau d'une PME",
    intro: `<p>Une PME de trois étages veut un réseau fiable, facile à dépanner et à étendre. Le directeur informatique doit justifier son choix de topologie et anticiper la panne de l'équipement central.</p>`,
    questions: [
      { type: "input", q: "Quelle topologie recommander pour ce réseau moderne fiable et extensible ? (un mot)", a: ["etoile", "étoile", "en etoile", "l'etoile"], ph: "un mot", exp: "L'étoile : fiable, extensible et facile à dépanner." },
      { type: "qcm", q: "Quel équipement placer au centre de chaque étage ?", opts: ["Un hub", "Un switch", "Un bouchon", "Un répéteur"], a: 1, exp: "Le switch, qui supprime les collisions et offre du full-duplex." },
      { type: "input", q: "En reliant les switchs d'étage à un switch principal, quelle structure obtient-on ? (un mot)", a: ["hierarchique", "hiérarchique", "etoile hierarchique", "arbre", "en arbre"], ph: "un mot", exp: "Une étoile hiérarchique (arbre) : plusieurs étoiles reliées entre elles." },
      { type: "qcm", q: "Comment éviter que la panne du switch principal ne coupe tout ?", opts: ["Ajouter des bouchons", "Mettre un second switch (redondance)", "Passer en anneau", "Réduire le nombre de postes"], a: 1, exp: "La redondance du central élimine le point unique de défaillance." },
      { type: "vf", q: "Choisir l'étoile signifie utiliser un peu plus de câble qu'un bus, mais gagner en fiabilité.", a: true, exp: "Oui : c'est le compromis gagnant : plus de câble, mais bien plus robuste et pratique." }
    ],
    solution: `<pre class="pseudo"># Conception du reseau de la PME
Topologie : ETOILE (standard moderne)
Materiel  : un SWITCH par etage (full-duplex, pas de collision)
Structure : etoile HIERARCHIQUE (switchs d'etage -> switch principal)
Risque    : panne du central -> REDONDANCE (second switch)
Compromis : +un peu de cable, mais +fiabilite, +depannage, +extension</pre>
<p>Tu sais maintenant choisir et justifier une topologie. C'est la fin de ce module sur la couche physique : des signaux jusqu'à l'architecture des câbles, tu as posé les fondations de tout réseau.</p>`
  }
};
</script>
