var DAY = {

  title: "Signaux, bits et débit",
  subtitle: "Du 0 et du 1 jusqu'aux mégabits par seconde.",
  theory: `
<h3>1. Signal numérique et signal analogique</h3>
<p>Un <strong>signal analogique</strong> (en anglais <em>analog</em>) varie de façon continue, comme une vague : la voix dans un ancien téléphone, une aiguille qui glisse. Un <strong>signal numérique</strong> (en anglais <em>digital</em>) ne prend que des valeurs distinctes, typiquement deux niveaux : <strong>0 ou 1</strong>, absence ou présence de tension. L'informatique est numérique : tout se ramène à des suites de 0 et de 1.</p>
<pre class="pseudo"># Analogique : ~~~~~~~  (continu, infinite de valeurs)
# Numerique  : _--__-_  (par paliers : 0 ou 1)</pre>
<div class="tip">Le grand avantage du numérique : il résiste au bruit. Un signal légèrement déformé reste lisible tant qu'on distingue « plutôt 0 » de « plutôt 1 ». On peut le régénérer parfaitement, ce qui est impossible avec de l'analogique.</div>
<h3>2. Le bit, unité de base de l'information</h3>
<p>Le <strong>bit</strong> (contraction de l'anglais <em>binary digit</em>) est la plus petite unité d'information : il vaut 0 ou 1. On regroupe les bits par paquets de 8 pour former un <strong>octet</strong> (en anglais <em>byte</em>). Un octet peut représenter 256 valeurs (de 0 à 255), assez pour coder une lettre.</p>
<pre class="pseudo"># 1 octet = 8 bits
01000001  = 65  = la lettre A (code ASCII)
# 1 octet peut prendre 2^8 = 256 valeurs (0 a 255)</pre>
<h3>3. Débit : bits par seconde</h3>
<p>Le <strong>débit</strong> (en anglais <em>bit rate</em> ou <em>throughput</em>) mesure la quantité de données transmise par seconde. Son unité est le <strong>bit par seconde (bit/s)</strong>. On utilise surtout ses multiples :</p>
<pre class="pseudo"># Multiples du bit/s (base 1000)
1 kbit/s = 1 000 bit/s
1 Mbit/s = 1 000 kbit/s = 1 000 000 bit/s
1 Gbit/s = 1 000 Mbit/s
# Exemples courants
Wi-Fi domestique   : dizaines a centaines de Mbit/s
Ethernet classique : 100 Mbit/s, 1 Gbit/s (Gigabit)
Fibre optique      : 1 Gbit/s et bien plus</pre>
<h3>4. Le piège n° 1 : bit/s contre octet/s</h3>
<p>Attention à ne pas confondre le <strong>bit</strong> (petit b) et l'<strong>octet</strong> (grand B, <em>byte</em>). Les <strong>débits</strong> réseau s'expriment en <strong>bits par seconde</strong> (Mbit/s), mais les <strong>tailles de fichiers</strong> et la vitesse affichée par un navigateur sont souvent en <strong>octets par seconde</strong> (Mo/s). Comme 1 octet = 8 bits :</p>
<pre class="pseudo"># Conversion : diviser par 8
Une ligne a 100 Mbit/s  ->  100 / 8 = 12,5 Mo/s au maximum
# Donc un abonnement "100 megas" telecharge au mieux ~12,5 Mo/s.</pre>
<div class="warn">C'est LA confusion classique. « 8 Mbit/s » ne fait que « 1 Mo/s ». Un fournisseur d'accès annonce des <strong>mégabits</strong> (Mbit/s) ; ton logiciel de téléchargement affiche des <strong>mégaoctets</strong> (Mo/s). Divise toujours par 8 pour passer des bits aux octets.</div>
<h3>5. Bande passante et débit réel</h3>
<p>La <strong>bande passante</strong> (en anglais <em>bandwidth</em>) est le débit <em>maximal théorique</em> d'un lien : sa capacité, comme le diamètre d'un tuyau. Le <strong>débit réel</strong> (le <em>débit utile</em>) est ce qu'on obtient vraiment : toujours inférieur, à cause du bruit, des en-têtes, du partage de la ligne. Une route à 4 voies (bande passante) ne garantit pas 4 voitures de front en permanence (débit réel).</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Numerique = 0/1 (paliers) ; Analogique = continu
1 octet (Byte, o) = 8 bits (b)
Debit = bit/s (kbit/s, Mbit/s, Gbit/s)
DEBITS reseau -> en bits/s  |  FICHIERS -> en octets/s
Passer des bits aux octets : DIVISER par 8
Bande passante = capacite max ; Debit reel = ce qu'on obtient</pre>`,

    { type: "input", q: "Pour convertir un débit de bits/s en octets/s, par quel nombre faut-il diviser ?", a: ["8", "par 8", "huit"], ph: "un nombre", exp: "1 octet = 8 bits, donc on divise par 8." },
    { type: "qcm", q: "Un abonnement annoncé « 100 Mbit/s » télécharge au mieux…", opts: ["100 Mo/s", "12,5 Mo/s", "800 Mo/s", "1 Mo/s"], a: 1, exp: "100 ÷ 8 = 12,5 Mo/s au maximum." },
    { type: "vf", q: "Le bit (b) et l'octet (o) désignent la même quantité.", a: false, exp: "Non : 1 octet = 8 bits. C'est le piège classique bit/s vs octet/s." },
    { type: "input", q: "Comment appelle-t-on la plus petite unité d'information, valant 0 ou 1 ? (un mot)", a: ["bit", "le bit", "un bit"], ph: "un mot", exp: "Le bit (binary digit) est l'unité de base : 0 ou 1." },
    { type: "qcm", q: "Un avantage majeur du signal numérique face à l'analogique ?", opts: ["Il occupe moins de bande passante", "Il résiste mieux au bruit et se régénère", "Il atteint un débit illimité", "Il est plus lent"], a: 1, exp: "Le numérique se régénère parfaitement tant qu'on distingue 0 et 1." },
    { type: "qcm", q: "Combien de valeurs différentes un octet peut-il représenter ?", opts: ["8", "64", "128", "256"], a: 3, exp: "2^8 = 256 valeurs (de 0 à 255)." },
    { type: "input", q: "Un fichier fait 24 Mo. Sur une ligne à 8 Mbit/s (soit 1 Mo/s), combien de secondes au minimum pour le télécharger ?", a: ["24", "24 s", "24s", "24 secondes"], ph: "un nombre", exp: "24 Mo ÷ 1 Mo/s = 24 s. (8 Mbit/s = 1 Mo/s.)" }
  ],
  final: {
    title: "Exercice final — Comprendre sa facture Internet",
    intro: `<p>Marc souscrit à une offre « 200 Mbit/s ». Il télécharge un jeu de 30 Go et s'étonne que son logiciel affiche « 25 Mo/s ». On l'aide à démêler bits et octets.</p>`,
    questions: [
      { type: "qcm", q: "Les 200 Mbit/s annoncés désignent…", opts: ["Une taille de fichier", "Un débit maximal (bande passante) en bits par seconde", "Une quantité de données déjà téléchargée", "Une durée"], a: 1, exp: "200 Mbit/s est la bande passante : un débit max en bits par seconde." },

      { type: "vf", q: "Le « 25 Mo/s » affiché est incohérent avec l'offre 200 Mbit/s.", a: false, exp: "Faux : 200 Mbit/s ÷ 8 = 25 Mo/s, c'est parfaitement cohérent." },
      { type: "qcm", q: "Pourquoi le débit réel est-il souvent un peu sous le maximum ?", opts: ["La bande passante augmente avec la distance", "Bruit, en-têtes et partage de la ligne réduisent le débit utile", "Le débit se mesure en octets, pas en bits", "Le protocole TCP double la taille des données"], a: 1, exp: "Le débit réel reste sous la bande passante à cause du bruit, des en-têtes, du partage." },
      { type: "input", q: "30 Go = 30 000 Mo environ. À 25 Mo/s, combien de secondes au minimum ? (un nombre)", a: ["1200", "1200 s", "1 200"], ph: "un nombre", exp: "30 000 ÷ 25 = 1200 s (soit 20 minutes) au mieux." }
    ],
    solution: `<pre class="pseudo"># Demeler bits et octets
Offre : 200 Mbit/s (bande passante, en BITS)
Debit max en octets : 200 / 8 = 25 Mo/s
Fichier : 30 Go = 30 000 Mo
Temps min : 30 000 / 25 = 1200 s = 20 min
# Rappel : DIVISER par 8 pour passer des bits aux octets.</pre>
<p>Marc ne se fera plus avoir. Demain : on descend dans les câbles, en commençant par le coaxial.</p>`

};
