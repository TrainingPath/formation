<script>
var DAY = {
  num: 8,
  title: "Les règles d'or de l'encapsulation",
  subtitle: "Comment chaque couche emballe et déballe les données, en-tête après en-tête.",
  theory: `
<h3>1. L'idée : emballer comme des poupées russes</h3>
<p>Quand tu envoies des données, elles <strong>descendent</strong> les couches, de l'Application (7) vers la Physique (1). À chaque étage, la couche ajoute ses propres informations de contrôle autour des données reçues du dessus. Ce processus s'appelle l'<strong>encapsulation</strong> (en anglais <em>encapsulation</em>). C'est comme glisser une poupée russe dans une plus grande, encore et encore : à la fin, tout est emboîté et prêt à circuler.</p>
<h3>2. L'en-tête : l'étiquette de chaque couche</h3>
<p>Les informations ajoutées par une couche sont placées surtout au début, dans un <strong>en-tête</strong> (en anglais <em>header</em>). Certaines couches ajoutent aussi une partie à la fin, une <strong>queue</strong> ou remorque (<em>trailer</em>) : c'est le cas de la couche 2 Liaison, qui ajoute un contrôle d'erreur en fin de trame. L'en-tête contient ce dont la couche homologue d'en face aura besoin : adresses, numéros de port, numéros d'ordre, codes de vérification.</p>
<pre class="pseudo"># Descente (emission) : chaque couche AJOUTE son en-tete
7 Application  : [ Donnees ]
4 Transport    : [ enT-T | Donnees ]                 -> SEGMENT
3 Reseau       : [ enT-IP | enT-T | Donnees ]        -> PAQUET
2 Liaison      : [ enT-MAC | enT-IP | enT-T | Donnees | queue ] -> TRAME
1 Physique     : 0101110101...  -> BITS sur le support</pre>
<h3>3. La règle d'or de la désencapsulation</h3>
<p>Chez le destinataire, tout se passe <strong>en sens inverse</strong>. Les bits remontent de la couche 1 vers la couche 7. À chaque étage, la couche <strong>lit puis retire son propre en-tête</strong> (celui que sa jumelle avait ajouté), puis transmet le reste à la couche du dessus. Ce déballage s'appelle la <strong>désencapsulation</strong>. Règle d'or : <strong>chaque couche ne lit et n'enlève que l'en-tête qui la concerne</strong> ; elle ignore les autres.</p>
<pre class="pseudo"># Montee (reception) : chaque couche RETIRE son en-tete
1 Physique  : recoit les bits, reconstitue la trame
2 Liaison   : lit + retire enT-MAC (verifie la queue) -> donne le paquet
3 Reseau    : lit + retire enT-IP                     -> donne le segment
4 Transport : lit + retire enT-T                       -> donne les donnees
7 Application : recoit les Donnees d'origine, intactes</pre>
<h3>4. La symétrie parfaite : couche à couche</h3>
<p>C'est ici que tout le modèle prend son sens. L'en-tête ajouté par la couche 3 de l'émetteur est <strong>exactement</strong> celui que lit la couche 3 du destinataire. Chaque couche « parle » à son homologue à travers son en-tête, sans jamais toucher aux en-têtes des autres couches. Les données de l'utilisateur, elles, traversent tout ce voyage <strong>sans être modifiées</strong> : elles sont seulement emballées à l'aller et déballées à l'arrivée.</p>
<div class="tip">Retiens la symétrie : ce qu'une couche <strong>ajoute</strong> à la descente, sa jumelle le <strong>retire</strong> à la montée. En-tête posé par la couche N à l'émission = en-tête lu par la couche N à la réception.</div>
<div class="warn">Une couche ne doit jamais toucher à l'en-tête d'une autre couche. Le routeur (couche 3) lit l'en-tête IP, pas le contenu applicatif. C'est ce respect des frontières qui rend le réseau modulaire et fiable.</div>
<h3>5. Un exemple concret de bout en bout</h3>
<p>Tu envoies un message de chat. La couche Application le remet à Transport, qui ajoute un en-tête avec le port et un numéro d'ordre (segment). La couche Réseau ajoute l'en-tête IP avec l'adresse de destination (paquet). La couche Liaison ajoute l'en-tête MAC et une queue de contrôle (trame). La couche Physique transforme le tout en bits. À l'arrivée, chaque couche retire son étiquette et ton ami reçoit le message exact que tu avais tapé.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Encapsulation (emission)  : on DESCEND 7->1, chaque couche AJOUTE un en-tete
# Desencapsulation (reception): on MONTE 1->7, chaque couche RETIRE son en-tete
# En-tete (header) au debut ; parfois une queue (trailer) en fin (couche 2)
# Regle d'or : chaque couche ne lit/retire QUE son propre en-tete
# Symetrie : ce que la couche N ajoute a l'aller, la couche N le retire a l'arrivee
# Les donnees utilisateur ne sont pas modifiees : juste emballees puis deballees</pre>`,
  exercises: [
    { type: "input", q: "Comment appelle-t-on le fait, à l'émission, d'ajouter à chaque couche des informations de contrôle autour des données ? (un mot)", a: ["encapsulation", "l'encapsulation", "encapsuler"], ph: "un mot", exp: "C'est l'encapsulation : chaque couche emballe les données du dessus." },
    { type: "input", q: "Comment appelle-t-on le processus inverse, à la réception, où chaque couche retire son en-tête ? (un mot)", a: ["desencapsulation", "la desencapsulation", "desencapsuler"], ph: "un mot", exp: "C'est la désencapsulation : on déballe couche par couche." },
    { type: "qcm", q: "Dans quel sens circulent les données à l'émission ?", opts: ["De la couche 1 vers la couche 7", "De la couche 7 vers la couche 1", "Elles ne bougent pas", "En cercle"], a: 1, exp: "À l'émission, on descend de la couche 7 (Application) vers la couche 1 (Physique)." },
    { type: "qcm", q: "Comment appelle-t-on les informations qu'une couche ajoute, généralement au début des données ?", opts: ["Un en-tête (header)", "Un pixel", "Un port USB", "Un fichier"], a: 0, exp: "L'en-tête (header) contient les infos de contrôle de la couche." },
    { type: "input", q: "Comment appelle-t-on la partie parfois ajoutée à la FIN d'une trame (ex: contrôle d'erreur en couche 2) ? (un mot)", a: ["queue", "la queue", "trailer", "remorque"], ph: "un mot", exp: "La queue (trailer) est ajoutée en fin de trame, notamment pour le contrôle d'erreur." },
    { type: "vf", q: "À la réception, chaque couche lit et retire uniquement l'en-tête qui la concerne.", a: true, exp: "Oui : c'est la règle d'or. Chaque couche ignore les en-têtes des autres." },
    { type: "qcm", q: "L'en-tête ajouté par la couche 3 de l'émetteur est lu par…", opts: ["La couche 7 du destinataire", "La couche 3 du destinataire (sa jumelle)", "N'importe quelle couche", "Le câble"], a: 1, exp: "La symétrie : couche N à l'émission parle à couche N à la réception." },
    { type: "vf", q: "Les données de l'utilisateur sont modifiées à chaque couche traversée.", a: false, exp: "Non : elles sont seulement emballées puis déballées, pas modifiées." },
    { type: "qcm", q: "Quelle couche ajoute une queue (trailer) en plus de l'en-tête ?", opts: ["La couche 2 Liaison", "La couche 7 Application", "La couche 5 Session", "La couche 6 Présentation"], a: 0, exp: "La couche 2 Liaison ajoute une queue de contrôle d'erreur à la trame." },
    { type: "qcm", q: "À l'émission, dans quel ordre les en-têtes sont-ils ajoutés ?", opts: ["Physique, puis Transport, puis Application", "Transport, puis Réseau, puis Liaison (de haut en bas)", "Tous en même temps par une seule couche", "Aucun en-tête n'est ajouté"], a: 1, exp: "On descend : Transport, puis Réseau (IP), puis Liaison (MAC)." },
    { type: "input", q: "Quel mot désigne l'analogie des « poupées russes » emboîtées appliquée aux données ? (le concept, un mot)", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation emboîte les données comme des poupées russes." },
    { type: "vf", q: "Un routeur (couche 3) doit lire l'en-tête IP mais pas le contenu applicatif.", a: true, exp: "Oui : chaque équipement respecte les frontières et ne lit que ce qui le concerne." },
    { type: "qcm", q: "Après que la couche Transport a ajouté son en-tête, l'unité obtenue s'appelle…", opts: ["Un bit", "Un segment", "Une trame", "Une image"], a: 1, exp: "Transport + en-tête = segment (couche 4)." },
    { type: "qcm", q: "Après que la couche Liaison a ajouté son en-tête MAC et sa queue, l'unité s'appelle…", opts: ["Un paquet", "Une trame", "Un segment", "Un octet"], a: 1, exp: "Liaison + en-tête MAC + queue = trame (couche 2)." },
    { type: "vf", q: "Ce qu'une couche ajoute à la descente, sa couche homologue le retire à la montée.", a: true, exp: "Oui : c'est la symétrie parfaite de l'encapsulation/désencapsulation." }
  ],
  final: {
    title: "Exercice final — Le voyage complet d'un message de chat",
    intro: `<p>Tu tapes « Salut ! » dans une messagerie et l'envoies à un ami. Suivons le message qui descend les couches chez toi, traverse le réseau, puis remonte chez lui. Nomme correctement chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "La couche Transport reçoit « Salut ! » et y ajoute un en-tête (port, numéro d'ordre). On obtient…", opts: ["Un bit", "Un segment", "Une trame", "Un paquet"], a: 1, exp: "Transport + en-tête = segment (couche 4)." },
      { type: "input", q: "La couche Réseau ajoute l'en-tête IP. Comment s'appelle l'unité obtenue ? (un mot)", a: ["paquet", "un paquet", "le paquet", "packet"], ph: "un mot", exp: "Réseau + en-tête IP = paquet (couche 3)." },
      { type: "qcm", q: "La couche Liaison ajoute en-tête MAC et queue. On obtient une trame, puis la couche Physique l'envoie sous forme de…", opts: ["Paquets", "Bits (signaux)", "Segments", "Fichiers"], a: 1, exp: "La couche Physique transmet des bits sous forme de signaux." },
      { type: "vf", q: "Chez ton ami, les couches retirent les en-têtes une à une (désencapsulation) jusqu'à retrouver « Salut ! » intact.", a: true, exp: "Oui : la désencapsulation restitue le message d'origine sans modification." },
      { type: "qcm", q: "Quelle règle d'or résume tout le processus ?", opts: ["Chaque couche lit tous les en-têtes", "Ce qu'une couche ajoute à l'aller, sa jumelle le retire à l'arrivée", "Les données changent à chaque couche", "Une seule couche fait tout"], a: 1, exp: "La symétrie couche à couche est la règle d'or de l'encapsulation." }
    ],
    solution: `<pre class="pseudo"># Le voyage de "Salut !", de bout en bout :
# EMISSION (on descend, on emballe) :
7 Application : "Salut !"                       (donnees)
4 Transport   : + en-tete (port, no ordre)      -> SEGMENT
3 Reseau      : + en-tete IP (adresse dest.)     -> PAQUET
2 Liaison     : + en-tete MAC + queue            -> TRAME
1 Physique    : trame convertie en BITS -> reseau
# RECEPTION (on monte, on deballe) : chaque couche retire SON en-tete
# -> l'ami recoit "Salut !" intact.
# Regle d'or : ajoute a l'aller par la couche N, retire a l'arrivee par la couche N.</pre>
<p>Bravo : tu as bouclé les fondamentaux. Tu sais ce qu'est un réseau, d'où vient Internet, pourquoi il faut des protocoles, comment on les organise en couches (OSI), et comment l'encapsulation emballe les données de bout en bout.</p>`
  }
};
</script>
