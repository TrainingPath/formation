var DAY = {

  title: "Cartes d'identité des 7 couches",
  subtitle: "Nom, rôle et unité de données de chaque couche OSI.",
  theory: `
<h3>1. Le concept de PDU : l'unité de données</h3>
<p>À chaque couche, les données portent un nom précis. On parle d'<strong>unité de données de protocole</strong> (en anglais <em>PDU</em>, « Protocol Data Unit »). Au fil de la descente dans les couches, la même information change de nom : bit, trame, paquet, segment… Connaître le bon mot pour chaque couche est essentiel pour se comprendre entre professionnels.</p>
<h3>2. Couches basses (1 à 4) : acheminer les données</h3>
<p><strong>Couche 1 — Physique.</strong> Rôle : transmettre des <strong>bits</strong> bruts sous forme de signaux (tension électrique, lumière dans une fibre, ondes radio). PDU : le <strong>bit</strong>. Exemples : le câble Ethernet, la fibre, les connecteurs.</p>
<p><strong>Couche 2 — Liaison de données.</strong> Rôle : acheminer les données entre deux machines <strong>directement reliées</strong> sur un même réseau local, à l'aide de l'<strong>adresse physique MAC</strong>. PDU : la <strong>trame</strong> (en anglais <em>frame</em>). Exemple : Ethernet, le Wi-Fi ; le switch travaille ici.</p>
<p><strong>Couche 3 — Réseau.</strong> Rôle : acheminer les données de bout en bout à travers plusieurs réseaux, grâce à l'<strong>adresse logique IP</strong> et au <strong>routage</strong>. PDU : le <strong>paquet</strong> (en anglais <em>packet</em>). Exemple : le protocole IP ; le routeur travaille ici.</p>
<p><strong>Couche 4 — Transport.</strong> Rôle : découper les données en morceaux, gérer la <strong>fiabilité</strong> et diriger vers la bonne application via les <strong>ports</strong>. PDU : le <strong>segment</strong> (avec TCP) ou le <strong>datagramme</strong> (avec UDP). Exemples : TCP (fiable) et UDP (rapide).</p>
<pre class="pseudo"># Couches basses : nom -> role -> PDU
1 Physique   -> transmet des signaux bruts       -> BIT
2 Liaison    -> livraison locale via adresse MAC  -> TRAME  (frame)
3 Reseau     -> routage entre reseaux via IP       -> PAQUET (packet)
4 Transport  -> fiabilite + ports (TCP/UDP)        -> SEGMENT (ou datagramme UDP)</pre>
<h3>3. Couches hautes (5 à 7) : servir l'application</h3>
<p><strong>Couche 5 — Session.</strong> Rôle : ouvrir, maintenir et fermer proprement le <strong>dialogue</strong> entre deux applications ; synchroniser les échanges. PDU : on parle simplement de <strong>données</strong> (message).</p>
<p><strong>Couche 6 — Présentation.</strong> Rôle : mettre les données dans un format compréhensible : <strong>encodage</strong> des caractères, <strong>compression</strong>, <strong>chiffrement</strong>. PDU : <strong>données</strong>. Exemple : le chiffrement TLS, l'encodage des caractères.</p>
<p><strong>Couche 7 — Application.</strong> Rôle : fournir le <strong>service directement utilisé</strong> par l'utilisateur ou son logiciel. PDU : <strong>données</strong> (message). Exemples : HTTP (Web), SMTP (courriel), DNS (noms de domaine).</p>
<pre class="pseudo"># Couches hautes : nom -> role -> PDU
5 Session      -> ouvre/maintient/ferme le dialogue -> DONNEES (message)
6 Presentation -> encodage, compression, chiffrement -> DONNEES
7 Application   -> service pour l'utilisateur (HTTP...) -> DONNEES (message)</pre>
<div class="tip">Retiens les 4 PDU des couches basses, les plus utilisées au quotidien : <strong>bit</strong> (1), <strong>trame</strong> (2), <strong>paquet</strong> (3), <strong>segment</strong> (4). Un moyen mnémo : « <strong>B</strong>elle <strong>T</strong>rame <strong>P</strong>orte <strong>S</strong>egment ».</div>
<div class="warn">Attention au langage courant : on dit souvent « paquet » pour tout et n'importe quoi. En toute rigueur, « paquet » désigne la couche 3, « trame » la couche 2 et « segment » la couche 4. Un professionnel précis distingue ces trois mots.</div>
<h3>4. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Carte d'identite : couche -> role -> PDU -> exemple

2 Liaison     MAC, local              TRAME     Ethernet, switch
3 Reseau      IP, routage             PAQUET    IP, routeur
4 Transport   ports, fiabilite        SEGMENT   TCP, UDP
5 Session     dialogue                DONNEES   ouverture/fermeture de session
6 Presentation encodage/chiffrement   DONNEES   TLS, encodage
7 Application  service utilisateur     DONNEES   HTTP, SMTP, DNS</pre>`,
  exercises: [
    { type: "input", q: "Quel est le terme général (sigle) pour « unité de données » à une couche donnée ?", a: ["pdu"], ph: "3 lettres", exp: "PDU = Protocol Data Unit, l'unité de données d'une couche." },
    { type: "qcm", q: "Quelle est l'unité de données (PDU) de la couche 1 Physique ?", opts: ["Le paquet", "La trame", "Le bit", "Le segment"], a: 2, exp: "La couche Physique transmet des bits bruts sous forme de signaux." },
    { type: "input", q: "Quelle est l'unité de données de la couche 2 Liaison ? (un mot)", a: ["trame", "la trame", "frame"], ph: "un mot", exp: "La couche Liaison manipule des trames (frames)." },
    { type: "qcm", q: "Quelle est l'unité de données de la couche 3 Réseau ?", opts: ["Le bit", "Le paquet", "La trame", "Le segment"], a: 1, exp: "La couche Réseau manipule des paquets (packets)." },
    { type: "input", q: "Quelle est l'unité de données de la couche 4 Transport avec TCP ? (un mot)", a: ["segment", "le segment"], ph: "un mot", exp: "Avec TCP, la couche Transport manipule des segments." },

    { type: "qcm", q: "Quelle couche utilise l'adresse IP et le routage ?", opts: ["Couche 2 Liaison", "Couche 3 Réseau", "Couche 4 Transport", "Couche 7 Application"], a: 1, exp: "La couche 3 Réseau gère l'adressage IP et le routage." },
    { type: "input", q: "Quel équipement travaille principalement à la couche 2 (Liaison) pour relier un réseau local ? (un mot)", a: ["switch", "commutateur", "le switch"], ph: "un mot", exp: "Le switch (commutateur) travaille à la couche 2 Liaison." },
    { type: "qcm", q: "Quel équipement travaille principalement à la couche 3 (Réseau) ?", opts: ["Le switch", "Le routeur", "Le câble", "Le point d'accès Wi-Fi"], a: 1, exp: "Le routeur travaille à la couche 3 : il route selon les adresses IP." },
    { type: "vf", q: "La couche 4 Transport utilise les numéros de port pour diriger vers la bonne application.", a: true, exp: "Oui : les ports identifient l'application destinataire sur la machine." },
    { type: "qcm", q: "Quel est le rôle de la couche 6 Présentation ?", opts: ["Router les paquets", "Encoder, compresser et chiffrer les données", "Transmettre des bits", "Attribuer des adresses MAC"], a: 1, exp: "La couche Présentation gère encodage, compression et chiffrement." },
    { type: "qcm", q: "Quel protocole est un exemple typique de la couche 7 Application ?", opts: ["HTTP", "MAC", "Le câble Ethernet", "La tension électrique"], a: 0, exp: "HTTP (comme SMTP, DNS) est un protocole de la couche Application." },
    { type: "vf", q: "Aux couches 5, 6 et 7, on parle simplement de « données » (message) comme unité.", a: true, exp: "Oui : les couches hautes manipulent des données/messages, pas des trames ou paquets." },
    { type: "input", q: "Donne le PDU de la couche 3 en un mot (langage rigoureux, pas « trame »).", a: ["paquet", "le paquet", "packet"], ph: "un mot", exp: "La couche 3 Réseau manipule des paquets." },
    { type: "qcm", q: "Quel est le rôle principal de la couche 5 Session ?", opts: ["Transmettre des signaux", "Ouvrir, maintenir et fermer le dialogue entre applications", "Attribuer des adresses IP", "Compresser des images"], a: 1, exp: "La couche Session gère l'établissement et la fin du dialogue." }
  ],
  final: {

    intro: `<p>On te donne un tableau à trous : pour chaque couche, il faut retrouver son unité de données (PDU) et un mot-clé de son rôle. Vérifions que tu maîtrises les cartes d'identité.</p>`,
    questions: [

      { type: "vf", q: "Aux couches 5 à 7, l'unité de données s'appelle simplement « données » (message).", a: true, exp: "Oui : les couches hautes manipulent des données/messages." }
    ],
    solution: `<pre class="pseudo"># Les cartes d'identite completees :

# Mnemo des PDU basses : Bit, Trame, Paquet, Segment.</pre>

};
