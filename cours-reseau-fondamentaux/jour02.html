  theory: `
<h3>1. Avant Internet : le problème de la guerre froide</h3>
<p>Dans les années 1960, aux États-Unis, une agence de recherche du ministère de la Défense, l'<strong>ARPA</strong> (« Advanced Research Projects Agency »), finance des travaux sur les réseaux d'ordinateurs. L'idée : relier des centres de recherche distants pour partager de coûteuses machines de calcul. En 1969, le premier réseau expérimental, <strong>ARPANET</strong>, relie quatre universités américaines. Le tout premier message envoyé entre deux machines devait être le mot « LOGIN », mais le système planta après les deux lettres « LO » : le tout premier message d'Internet fut donc « LO ».</p>
<h3>2. La commutation de paquets : l'idée qui change tout</h3>
<p>ARPANET repose sur une idée révolutionnaire : la <strong>commutation de paquets</strong> (en anglais <em>packet switching</em>). Au lieu d'établir une ligne réservée d'un bout à l'autre (comme le téléphone de l'époque), on découpe le message en petits morceaux appelés <strong>paquets</strong>, envoyés indépendamment et réassemblés à l'arrivée. Si un chemin est coupé, les paquets prennent un autre itinéraire. Ce principe rend le réseau <strong>robuste</strong> et efficace, et il est encore le cœur d'Internet aujourd'hui.</p>
<pre class="pseudo"># Deux facons de transmettre
Commutation de circuits : une ligne reservee de bout en bout (telephone classique)
Commutation de paquets   : le message est decoupe en paquets independants
                           chaque paquet peut suivre un chemin different
                           -> plus robuste, plus efficace</pre>
<h3>3. TCP/IP : la langue commune (1983)</h3>
<p>Pour que des réseaux différents se comprennent, il fallait une langue commune. Deux chercheurs, <strong>Vint Cerf</strong> et <strong>Bob Kahn</strong>, conçoivent dans les années 1970 la suite de protocoles <strong>TCP/IP</strong>. Le <strong>1er janvier 1983</strong>, ARPANET bascule officiellement sur TCP/IP : c'est la date de naissance technique d'<strong>Internet</strong> au sens moderne, un « réseau de réseaux » qui parlent tous la même langue. Le mot <strong>Internet</strong> vient de <em>inter-networking</em>, « interconnexion de réseaux ».</p>
<div class="tip">Retiens deux dates repères : <strong>1969</strong> = premier lien ARPANET ; <strong>1983</strong> = passage à TCP/IP, naissance d'Internet moderne.</div>
<h3>4. Le Web, ce n'est pas Internet (1989-1991)</h3>
<p>Beaucoup confondent « le Web » et « Internet ». En <strong>1989</strong>, <strong>Tim Berners-Lee</strong>, au <strong>CERN</strong> (près de Genève), invente le <strong>World Wide Web</strong> : un système de pages reliées par des liens hypertextes, utilisant les adresses <strong>URL</strong>, le protocole <strong>HTTP</strong> et le langage <strong>HTML</strong>. Le premier site web est mis en ligne en 1991. Le Web est donc une <em>application</em> qui fonctionne <strong>sur</strong> Internet, comme le courriel ou la messagerie. Internet est la route ; le Web est l'un des véhicules qui roulent dessus.</p>
<div class="warn">Internet ≠ Web. Internet est l'infrastructure (les tuyaux, TCP/IP). Le Web (les sites, HTTP/HTML) n'est qu'un des services qui l'utilisent. Le courriel, lui, est plus ancien que le Web.</div>
<h3>5. Ce qu'il faut retenir</h3>

# 1989 : Tim Berners-Lee invente le Web au CERN (HTTP/HTML/URL)

    { type: "vf", q: "Le courriel (e-mail) est apparu après l'invention du Web.", a: false, exp: "Non : le courriel est plus ancien que le Web ; il existait déjà sur ARPANET." }
  ],
