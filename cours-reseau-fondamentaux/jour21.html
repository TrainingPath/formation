  theory: `
<h3>1. Qu'est-ce qu'Ethernet ?</h3>
<p><strong>Ethernet</strong> est le <strong>protocole</strong> le plus répandu pour les réseaux locaux (LAN) filaires. Un protocole, c'est un <strong>ensemble de règles communes</strong> qui permet à des machines de se comprendre : format des messages, adressage, façon d'accéder au câble. Ethernet définit tout cela pour les couches basses du modèle OSI : la <strong>couche 1</strong> (physique : câbles, signaux) et la <strong>couche 2</strong> (liaison : trames, adresses MAC).</p>
<p>Ethernet est né dans les années 1970 (au centre de recherche Xerox PARC). Il a été normalisé par l'organisme <strong>IEEE</strong> sous la référence <strong>IEEE 802.3</strong>. Aujourd'hui, quand tu branches un câble réseau (RJ45) sur ton ordinateur, tu utilises Ethernet.</p>
<div class="tip">Astuce mémoire : « Ethernet » et « IEEE 802.3 » désignent en pratique la même famille de technologies. 802.3 est le nom officiel de la norme ; Ethernet est le nom courant.</div>
<h3>2. Une famille de débits</h3>
<p>Ethernet n'est pas une vitesse unique, mais une <strong>famille de normes</strong> qui a évolué avec le temps. Chaque version augmente le débit :</p>
<pre class="pseudo"># Quelques jalons d'Ethernet
Ethernet          : 10 Mbit/s   (les debuts)
Fast Ethernet     : 100 Mbit/s  (802.3u)
Gigabit Ethernet  : 1 Gbit/s = 1000 Mbit/s   (802.3ab sur cuivre)
10 Gigabit Ethernet : 10 Gbit/s
# Mbit/s = megabits par seconde ; 1 Gbit/s = 1000 Mbit/s</pre>
<p>Toutes ces versions restent compatibles dans leurs grands principes : mêmes adresses MAC, même format de trame de base. C'est ce qui a fait le succès d'Ethernet : on a pu accélérer les débits sans tout réinventer.</p>
<h3>3. Support et topologie</h3>
<p>À ses débuts, Ethernet utilisait un <strong>câble coaxial</strong> partagé par toutes les machines (topologie en bus), d'où l'importance de CSMA/CD pour gérer les collisions. Aujourd'hui, on utilise surtout des <strong>câbles à paires torsadées</strong> (avec des connecteurs <strong>RJ45</strong>) ou de la <strong>fibre optique</strong>, reliés à un <strong>commutateur</strong> central (topologie en étoile). Ce passage à l'étoile commutée, en full-duplex, a fait disparaître les collisions sur les réseaux modernes.</p>
<h3>4. Ethernet II et le format de trame</h3>
<p>Il existe deux formats de trame très proches : <strong>Ethernet II</strong> (le plus courant aujourd'hui) et <strong>IEEE 802.3</strong>. Ils diffèrent surtout par un champ : dans Ethernet II, ce champ indique le <strong>type de protocole transporté</strong> (c'est l'<strong>EtherType</strong>, par exemple 0x0800 pour IPv4). La grande majorité du trafic actuel utilise le format Ethernet II. Nous détaillerons la trame complète au prochain jour.</p>
<p>Ethernet impose aussi une taille maximale de données par trame : le <strong>MTU</strong> (<em>Maximum Transmission Unit</em>) standard est de <strong>1500 octets</strong> de données utiles. Au-delà, les données doivent être découpées par les couches supérieures.</p>
<div class="warn">Ne confonds pas Ethernet et Wi-Fi. Ethernet (IEEE 802.3) est <strong>filaire</strong>. Le Wi-Fi (IEEE 802.11) est <strong>sans fil</strong> : même famille d'organisme (IEEE 802), mais un autre protocole, avec ses propres règles d'accès au média.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Ethernet = protocole dominant des reseaux LOCAUX filaires (LAN)
# Normalise par l'IEEE sous le nom 802.3

# MTU standard = 1500 octets de donnees utiles
# Filaire (802.3) ; a ne pas confondre avec le Wi-Fi (802.11, sans fil)</pre>`,

    { type: "vf", q: "Les différentes versions d'Ethernet conservent les mêmes adresses MAC et un format de trame de base commun.", a: true, exp: "Oui : c'est la clé de la compatibilité entre versions et du succès d'Ethernet." },
    { type: "qcm", q: "Quelle topologie utilise-t-on aujourd'hui pour Ethernet ?", opts: ["Un bus coaxial partagé", "Une étoile autour d'un commutateur", "Un anneau", "Aucune, c'est sans fil"], a: 1, exp: "La topologie moderne est l'étoile commutée (autour d'un switch), en full-duplex." },
    { type: "input", q: "Quel organisme a normalisé Ethernet (sigle de 4 lettres) ?", a: ["ieee", "l'ieee"], ph: "4 lettres", exp: "L'IEEE (Institute of Electrical and Electronics Engineers)." },
    { type: "qcm", q: "Pourquoi CSMA/CD était-il indispensable aux débuts d'Ethernet ?", opts: ["Parce que le câble coaxial était partagé (bus)", "Parce que le Wi-Fi n'existait pas", "Parce que les adresses IP manquaient", "Parce que la fibre était trop rapide"], a: 0, exp: "Le média partagé en bus imposait de gérer les collisions via CSMA/CD." }
  ],

    questions: [

      { type: "qcm", q: "Le poste envoie des données de 4000 octets. Que se passe-t-il vis-à-vis du MTU de 1500 ?", opts: ["Tout passe dans une seule trame", "Les données doivent être découpées (MTU = 1500 octets)", "Le réseau plante", "L'adresse MAC change"], a: 1, exp: "Le MTU standard est 1500 octets : au-delà, les couches supérieures découpent les données." },

    ],
