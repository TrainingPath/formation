var DAY = {
  num: 19,
  title: "La couche 2 : le rôle de la liaison de données",
  subtitle: "Acheminer les données d'une carte réseau à sa voisine, sans erreur, sur le réseau local.",
  theory: `
<h3>1. Où se situe la couche 2 dans le modèle OSI</h3>
<p>Le modèle <strong>OSI</strong> (en anglais <em>Open Systems Interconnection</em>) découpe la communication réseau en <strong>7 couches</strong>, numérotées de 1 (en bas, le câble) à 7 (en haut, l'application). La <strong>couche 2</strong> s'appelle la couche <strong>liaison de données</strong> (en anglais <em>Data Link</em>). Elle est posée juste au-dessus de la couche 1 (physique, les signaux et les câbles) et juste en dessous de la couche 3 (réseau, l'adressage IP et le routage).</p>
<pre class="pseudo"># Les couches basses du modele OSI
Couche 3 : Reseau   (IP, routage entre reseaux distants)
Couche 2 : Liaison  (trames, adresses MAC, reseau LOCAL)   &lt;-- ici
Couche 1 : Physique (signaux electriques/optiques, cables)</pre>
<h3>2. Son rôle principal : la livraison locale</h3>
<p>La couche 2 s'occupe de faire voyager les données <strong>d'un équipement à son voisin direct</strong> sur le <strong>même réseau local</strong> : d'une carte réseau à une autre carte réseau reliée au même segment. Elle ne sait pas traverser Internet (c'est le travail de la couche 3), mais elle est experte du « dernier saut » : livrer la donnée à la bonne machine sur le réseau local.</p>
<p>Pour cela, elle emballe les données dans une unité appelée <strong>trame</strong> (en anglais <em>frame</em>). Une trame contient l'adresse de l'expéditeur, celle du destinataire, les données à transporter et un contrôle d'erreur. C'est l'unité de données de la couche 2 (on parle de <em>PDU</em> : Protocol Data Unit).</p>
<div class="tip">Vocabulaire des unités : à la couche 2 on parle de <strong>trame</strong>, à la couche 3 de <strong>paquet</strong>, à la couche 4 de <strong>segment</strong>. Chaque couche emballe l'unité de la couche du dessus, un peu comme des poupées russes.</div>
<h3>3. Deux sous-couches : LLC et MAC</h3>
<p>La couche liaison est souvent divisée en deux <strong>sous-couches</strong> :</p>
<p><strong>LLC</strong> (<em>Logical Link Control</em>, « contrôle de liaison logique ») : la partie haute, qui fait le lien avec la couche 3 et gère le dialogue logique.</p>
<p><strong>MAC</strong> (<em>Media Access Control</em>, « contrôle d'accès au média ») : la partie basse, qui décide <strong>quand</strong> et <strong>comment</strong> émettre sur le support partagé (c'est elle qui met en œuvre des mécanismes comme CSMA/CD) et qui gère l'<strong>adresse physique</strong> de la carte, appelée justement <strong>adresse MAC</strong>.</p>
<h3>4. Adressage physique et détection d'erreurs</h3>
<p>La couche 2 identifie chaque carte réseau par une <strong>adresse physique</strong> (l'adresse MAC), gravée dans le matériel. Contrairement à l'adresse IP (couche 3) qui peut changer selon le réseau, l'adresse MAC est en principe fixe et propre à la carte.</p>
<p>La couche 2 assure aussi un <strong>contrôle d'erreur</strong> : à la fin de chaque trame, un champ de vérification (le <strong>FCS</strong>, basé sur un calcul de <strong>CRC</strong>) permet au destinataire de vérifier que la trame n'a pas été abîmée pendant le trajet. Si le calcul ne correspond pas, la trame est jetée.</p>
<div class="warn">La couche 2 <em>détecte</em> les erreurs (elle repère une trame corrompue et la jette) mais, en Ethernet, elle ne les <em>corrige</em> pas et ne redemande pas la trame : ce sont les couches supérieures (comme TCP) qui, si besoin, s'occupent de la retransmission.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Couche 2 = Liaison de donnees (Data Link), entre physique (1) et reseau (3)
# Role : livraison LOCALE, d'une carte reseau a sa voisine
# Unite de donnees : la TRAME (frame)
# Deux sous-couches : LLC (lien logique) + MAC (acces au media)
# Adressage : adresse MAC (physique, materielle)
# Controle d'erreur : FCS/CRC -&gt; detecte une trame abimee et la jette</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le nom de la couche 2 du modèle OSI ?", opts: ["Couche physique", "Couche liaison de données", "Couche réseau", "Couche transport"], a: 1, exp: "La couche 2 est la couche liaison de données (Data Link)." },
    { type: "qcm", q: "Comment s'appelle l'unité de données de la couche 2 ?", opts: ["Le paquet", "Le segment", "La trame", "Le bit"], a: 2, exp: "À la couche 2, l'unité de données est la trame (frame)." },
    { type: "input", q: "Quel est le nom anglais de la couche liaison de données ?", a: ["data link", "datalink", "data link layer"], ph: "deux mots anglais", exp: "En anglais : Data Link (layer)." },
    { type: "vf", q: "La couche 2 s'occupe surtout de la livraison sur le réseau local, pas de traverser Internet.", a: true, exp: "Oui : la livraison entre réseaux distants relève de la couche 3 (réseau)." },
    { type: "qcm", q: "Quelles sont les deux sous-couches de la couche liaison ?", opts: ["IP et TCP", "LLC et MAC", "HTTP et DNS", "FCS et CRC"], a: 1, exp: "La couche liaison se divise en LLC (haut) et MAC (bas)." },
    { type: "input", q: "Que signifie le sigle MAC dans « sous-couche MAC » ?", a: ["media access control", "medium access control", "controle d'acces au media", "controle d acces au media"], ph: "3 mots anglais", exp: "MAC = Media Access Control : contrôle d'accès au média." },
    { type: "qcm", q: "Quel équipement/identifiant la couche 2 utilise-t-elle pour désigner une carte réseau ?", opts: ["L'adresse IP", "L'adresse MAC (physique)", "Le nom de domaine", "Le numéro de port"], a: 1, exp: "La couche 2 utilise l'adresse physique, l'adresse MAC." },
    { type: "vf", q: "L'adresse MAC est en principe fixe et propre à la carte réseau.", a: true, exp: "Oui : elle est gravée dans le matériel, contrairement à l'IP qui dépend du réseau." },
    { type: "qcm", q: "À quoi sert le champ FCS (basé sur un CRC) en fin de trame ?", opts: ["À chiffrer les données", "À vérifier que la trame n'a pas été abîmée", "À indiquer l'adresse IP", "À compresser les données"], a: 1, exp: "Le FCS/CRC permet de détecter une trame corrompue." },
    { type: "input", q: "Comment appelle-t-on l'unité de données de la couche 3 (réseau) ?", a: ["paquet", "le paquet", "packet"], ph: "un mot", exp: "À la couche 3, l'unité est le paquet." },
    { type: "vf", q: "En Ethernet, la couche 2 corrige les erreurs et redemande automatiquement la trame perdue.", a: false, exp: "Non : elle détecte et jette la trame abîmée, mais la retransmission relève des couches supérieures (ex. TCP)." },
    { type: "qcm", q: "Quelle sous-couche met en œuvre CSMA/CD et gère l'accès au média ?", opts: ["LLC", "MAC", "IP", "DNS"], a: 1, exp: "La sous-couche MAC gère l'accès au média (dont CSMA/CD)." },
    { type: "qcm", q: "Entre quelles couches la couche 2 est-elle placée ?", opts: ["Entre la couche 1 (physique) et la couche 3 (réseau)", "Entre la couche 6 et la couche 7", "Au-dessus de la couche transport", "Toute seule au sommet"], a: 0, exp: "La couche liaison est entre la physique (1) et la réseau (3)." },
    { type: "input", q: "Comment nomme-t-on l'unité de données générique d'une couche (sigle de 3 lettres) ?", a: ["pdu", "la pdu"], ph: "3 lettres", exp: "PDU = Protocol Data Unit. Celle de la couche 2 est la trame." },
    { type: "vf", q: "L'adresse IP est gérée par la couche 2.", a: false, exp: "Non : l'adresse IP relève de la couche 3 (réseau). La couche 2 gère l'adresse MAC." }
  ],
  final: {
    title: "Exercice final — Ranger les rôles au bon étage",
    intro: `<p>Karim débute en réseau et confond les couches. On lui donne une trame Ethernet qui circule entre deux PC d'un même bureau. Aidons-le à situer chaque notion à la bonne couche.</p>`,
    questions: [
      { type: "qcm", q: "La trame qui circule entre les deux PC appartient à quelle couche ?", opts: ["Couche 1", "Couche 2 (liaison)", "Couche 3", "Couche 7"], a: 1, exp: "La trame est l'unité de la couche 2." },
      { type: "input", q: "Quel type d'adresse la couche 2 utilise-t-elle pour désigner chaque carte (sigle) ?", a: ["mac", "adresse mac", "l'adresse mac", "adresse physique"], ph: "3 lettres", exp: "L'adresse MAC (physique)." },
      { type: "vf", q: "Pour vérifier que la trame n'est pas abîmée, la carte réceptrice contrôle le champ FCS.", a: true, exp: "Oui : le FCS/CRC sert à détecter une trame corrompue." },
      { type: "qcm", q: "Si les deux PC étaient sur des réseaux distants, qui prendrait le relais pour router ?", opts: ["La couche 1", "La couche 2", "La couche 3 (réseau, IP)", "Personne"], a: 2, exp: "Le routage entre réseaux distants relève de la couche 3." },
      { type: "qcm", q: "Quelle sous-couche décide QUAND émettre sur le média partagé ?", opts: ["La sous-couche LLC", "La sous-couche MAC", "La couche transport", "La couche application"], a: 1, exp: "La sous-couche MAC gère l'accès au média." }
    ],
    solution: `<pre class="pseudo"># A ranger au bon etage :
Trame            -&gt; couche 2 (liaison de donnees)
Adresse MAC      -&gt; couche 2 (adressage physique)
FCS / CRC        -&gt; couche 2 (detection d'erreur)
Sous-couche MAC  -&gt; decide QUAND emettre (acces au media)
Adresse IP / routage -&gt; couche 3 (reseau)
Signaux, cable   -&gt; couche 1 (physique)</pre>
<p>La couche 2 est la spécialiste du réseau local. Demain, nous zoomons sur l'identifiant qu'elle utilise : l'<strong>adresse MAC</strong> et sa notation.</p>`
  }
};
