<script>
var DAY = {
  num: 28,
  title: "Intérêt et fonctionnement des VLAN",
  subtitle: "Isolation, sécurité, organisation : pourquoi un VLAN vaut un domaine de diffusion à lui seul.",
  theory: `
<h3>1. La règle d'or : un VLAN = un domaine de diffusion</h3>
<p>Hier, on a créé des VLAN. Aujourd'hui, on comprend leur vraie force. Le principe à graver : <strong>un VLAN = un domaine de diffusion</strong> (<em>broadcast domain</em>). Quand une machine émet un broadcast, celui-ci reste <strong>confiné à son VLAN</strong> ; les autres VLAN ne le reçoivent jamais. Le switch, qui ne savait pas séparer les broadcasts, sait le faire dès qu'on utilise des VLAN.</p>
<pre class="pseudo">Broadcast d'un PC du VLAN 10
       |
   [ SWITCH ]
   VLAN 10 : PC-A  PC-B   &lt;- recoivent
   VLAN 20 : PC-C  PC-D   &lt;- NE recoivent PAS
# Chaque VLAN a sa propre "bulle" de diffusion</pre>
<h3>2. Bénéfice 1 : l'isolation et la maîtrise des broadcasts</h3>
<p>En découpant un grand réseau en plusieurs VLAN, on réduit la taille de chaque domaine de diffusion. Moins de machines par bulle = moins de trafic broadcast inutile pour chacune, donc de meilleures performances. Sur un réseau de centaines de postes, c'est décisif : on évite qu'un seul broadcast dérange tout le monde.</p>
<h3>3. Bénéfice 2 : la sécurité</h3>
<p>Deux VLAN sont <strong>étanches en couche 2</strong> : une machine du VLAN Invités ne peut pas voir, ni écouter (par exemple avec ARP), les machines du VLAN Comptabilité. On sépare ainsi les populations : invités, employés, caméras de surveillance, serveurs. Même branchés sur le même switch, ces groupes ne se croisent pas. C'est une barrière simple et efficace, très utilisée en entreprise.</p>
<div class="tip">Séparer par VLAN, c'est comme donner à chaque service son propre couloir. Un intrus dans le couloir « Invités » ne peut pas ouvrir les portes du couloir « Serveurs » : il n'y a même pas de passage entre les deux au niveau du switch.</div>
<h3>4. Bénéfice 3 : la souplesse d'organisation</h3>
<p>Un VLAN est <strong>logique, pas géographique</strong>. Deux collègues à deux étages différents peuvent être dans le même VLAN ; deux voisins de bureau peuvent être dans des VLAN différents. On regroupe par fonction (comptabilité, R&amp;D, téléphonie…) plutôt que par emplacement physique. Déplacer un employé, c'est juste changer l'affectation de son port, sans retirer un seul câble.</p>
<h3>5. Comment deux VLAN peuvent-ils quand même communiquer ?</h3>
<p>Si l'isolation est totale en couche 2, comment un PC du VLAN 10 joint-il un serveur du VLAN 20 quand c'est légitime ? Il faut <strong>monter d'une couche</strong> : passer par un <strong>routeur</strong> (ou un switch de couche 3). Chaque VLAN correspond alors à un sous-réseau IP différent, et le routeur fait le lien entre eux. C'est le <strong>routage inter-VLAN</strong> (<em>inter-VLAN routing</em>), souvent réalisé par un routeur reliant tous les VLAN via un trunk (montage « router-on-a-stick »).</p>
<div class="warn">Sans routeur, deux VLAN ne communiquent jamais. C'est voulu : l'isolation est le but. La communication entre VLAN est une décision explicite, contrôlée en couche 3, où l'on peut appliquer des règles de filtrage (pare-feu, listes d'accès).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 1 VLAN = 1 domaine de diffusion (broadcast confine)
# Benefices : ISOLATION, SECURITE, ORGANISATION logique
# VLAN = groupe logique, pas geographique (par fonction)
# Deux VLAN sont etanches en couche 2
# Pour les faire communiquer : un ROUTEUR (routage inter-VLAN)
#   -> 1 VLAN = 1 sous-reseau IP</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi correspond exactement un VLAN, côté diffusion ?", opts: ["À un domaine de collision", "À un domaine de diffusion", "À un seul câble", "À une adresse MAC"], a: 1, exp: "Règle d'or : un VLAN = un domaine de diffusion." },
    { type: "qcm", q: "Que devient un broadcast émis dans le VLAN 10 ?", opts: ["Il atteint tous les VLAN", "Il reste confiné au VLAN 10", "Il est bloqué et jeté", "Il passe automatiquement au VLAN 20"], a: 1, exp: "Le broadcast reste dans son VLAN : les autres VLAN ne le reçoivent pas." },
    { type: "qcm", q: "Quel équipement permet à deux VLAN de communiquer entre eux ?", opts: ["Un hub", "Un routeur (ou switch de couche 3)", "Un répéteur", "Un câble croisé"], a: 1, exp: "Le routage inter-VLAN passe par un routeur ou un switch de couche 3." },
    { type: "qcm", q: "Un VLAN regroupe les machines selon…", opts: ["Leur emplacement physique uniquement", "Une logique de fonction (service, rôle)", "La longueur du câble", "La marque de la carte réseau"], a: 1, exp: "Un VLAN est logique : on regroupe par fonction, pas par position." },
    { type: "qcm", q: "En termes de sécurité, que garantit la séparation par VLAN en couche 2 ?", opts: ["Un chiffrement des données", "L'étanchéité : un VLAN ne voit pas l'autre", "Un antivirus intégré", "Une sauvegarde automatique"], a: 1, exp: "Les VLAN sont étanches en couche 2 : ils ne se voient pas sans routeur." },
    { type: "qcm", q: "Comment nomme-t-on le fait de faire communiquer des VLAN via un routeur ?", opts: ["Le NAT", "Le routage inter-VLAN", "Le trunking", "Le flooding"], a: 1, exp: "C'est le routage inter-VLAN (inter-VLAN routing)." },
    { type: "vf", q: "Un broadcast d'un VLAN atteint aussi les autres VLAN du même switch.", a: false, exp: "Faux : chaque VLAN est un domaine de diffusion séparé, le broadcast reste confiné." },
    { type: "vf", q: "Deux machines dans deux VLAN différents ne peuvent pas communiquer sans un routeur.", a: true, exp: "Vrai : l'isolation est totale en couche 2 ; il faut monter en couche 3." },
    { type: "vf", q: "Séparer les invités et les serveurs dans deux VLAN améliore la sécurité.", a: true, exp: "Vrai : les invités ne peuvent pas atteindre les serveurs, VLAN étanches obligent." },
    { type: "vf", q: "Deux collègues situés à des étages différents ne peuvent jamais être dans le même VLAN.", a: false, exp: "Faux : un VLAN est logique, pas géographique. La distance n'a pas d'importance." },
    { type: "input", q: "Complète la règle d'or : « 1 VLAN = 1 domaine de … ».", a: ["diffusion", "broadcast", "de diffusion"], ph: "un mot", exp: "1 VLAN = 1 domaine de diffusion." },
    { type: "input", q: "À quelle couche du modèle OSI se fait la communication entre deux VLAN (donne le numéro) ?", a: ["3", "couche 3", "la couche 3", "troisieme"], ph: "un numéro", exp: "Couche 3 (réseau) : c'est le rôle du routeur." },
    { type: "input", q: "À un VLAN correspond en général un… quoi, côté adressage IP ?", a: ["sous-reseau", "sous reseau", "un sous-reseau", "subnet", "sous-reseau ip"], ph: "un terme", exp: "Un VLAN = un sous-réseau IP différent." },
    { type: "input", q: "Nomme un bénéfice des VLAN commençant par « iso… ».", a: ["isolation", "l'isolation", "isolement"], ph: "un mot", exp: "L'isolation : les VLAN sont étanches entre eux." },
    { type: "input", q: "Comment appelle-t-on familièrement le montage où un routeur relie tous les VLAN par un seul trunk ?", a: ["router-on-a-stick", "router on a stick", "routeur sur un baton"], ph: "expression anglaise", exp: "Le montage router-on-a-stick : un routeur, un trunk, tous les VLAN." }
  ],
  final: {
    title: "Exercice final — Un campus, quatre populations",
    intro: `<p>Une école configure son réseau en 4 VLAN : VLAN 10 Élèves, VLAN 20 Profs, VLAN 30 Administration, VLAN 40 Wi-Fi Invités. Tout ce beau monde partage les mêmes switches. On veut comprendre qui parle à qui.</p>`,
    questions: [
      { type: "qcm", q: "Un élève (VLAN 10) peut-il, en couche 2, accéder directement au VLAN Administration ?", opts: ["Oui, même switch", "Non, les VLAN sont étanches en couche 2", "Oui, via broadcast", "Seulement en Wi-Fi"], a: 1, exp: "Les VLAN sont isolés : aucun accès direct sans passer par un routeur." },
      { type: "qcm", q: "Un broadcast DHCP émis par un poste Élève est reçu par…", opts: ["Tous les VLAN", "Uniquement les machines du VLAN 10", "Le VLAN 40 seulement", "Personne"], a: 1, exp: "Le broadcast reste confiné au VLAN 10, son domaine de diffusion." },
      { type: "vf", q: "Isoler le Wi-Fi Invités dans son propre VLAN protège les autres populations.", a: true, exp: "Vrai : les invités ne peuvent pas atteindre élèves, profs ni administration." },
      { type: "qcm", q: "L'administration doit accéder à un serveur situé dans un autre VLAN. Que faut-il ?", opts: ["Rien, c'est automatique", "Un routeur (routage inter-VLAN) avec des règles de filtrage", "Supprimer les VLAN", "Un câble croisé"], a: 1, exp: "Il faut un routeur pour relier les VLAN, avec un contrôle des accès." },
      { type: "input", q: "Combien de domaines de diffusion distincts ce campus compte-t-il avec ses 4 VLAN ?", a: ["4", "quatre"], ph: "un nombre", exp: "4 VLAN = 4 domaines de diffusion séparés." }
    ],
    solution: `<pre class="pseudo"># 4 VLAN = 4 domaines de diffusion etanches :
VLAN 10 Eleves    | VLAN 20 Profs
VLAN 30 Admin     | VLAN 40 Invites
-> aucun ne voit l'autre en couche 2 (isolation, securite)
-> un broadcast reste dans SON VLAN

# Communication legitime entre VLAN :
[ ROUTEUR ] relie les VLAN (routage inter-VLAN)
  1 VLAN = 1 sous-reseau IP ; on filtre qui a le droit d'aller ou.</pre>
<p>Un seul jeu de switches, quatre mondes séparés, et une communication contrôlée uniquement là où on le décide. Voilà l'intérêt complet des VLAN.</p>`
  }
};
