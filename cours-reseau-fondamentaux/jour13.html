  subtitle: "Le câble RJ45 qui relie presque tous les réseaux d'aujourd'hui.",
  theory: `
<h3>1. Le câble réseau le plus répandu</h3>
<p>La <strong>paire torsadée</strong> (en anglais <em>twisted pair</em>) est le câble roi des réseaux locaux modernes. C'est ce câble bleu, gris ou jaune que tu branches entre un ordinateur et une box ou un switch. Il contient <strong>4 paires de fils de cuivre</strong>, soit 8 fils, terminés par un connecteur <strong>RJ45</strong>.</p>
<h3>2. Pourquoi torsader les fils ?</h3>
<p>Chaque paire est composée de deux fils <strong>torsadés ensemble</strong>, entrelacés en spirale. Ce n'est pas décoratif : le torsadage <strong>annule les interférences</strong>. Les deux fils captent le même bruit électromagnétique, mais en sens opposés, si bien que la perturbation s'annule à la réception. Plus les torsades sont serrées, meilleure est la protection.</p>
<div class="tip">Plus le nombre de torsades par mètre est élevé, plus le câble supporte de hautes fréquences et donc de hauts débits. C'est l'une des raisons pour lesquelles les catégories supérieures sont plus performantes.</div>
<h3>3. UTP et STP : blindé ou non</h3>
<p>Deux grandes familles selon la présence d'un blindage :</p>
<pre class="pseudo"># UTP (Unshielded Twisted Pair)
- Paires torsadees SANS blindage
- Le plus courant : souple, economique
# STP (Shielded Twisted Pair)
- Paires torsadees AVEC blindage (feuille ou tresse)
- Meilleure protection anti-interferences, plus rigide et cher
- Utile en milieu industriel (moteurs, machines electriques)</pre>
<h3>4. Le connecteur RJ45</h3>
<p>Le connecteur <strong>RJ45</strong> est la petite prise plastique transparente à 8 contacts (8 broches) qui termine le câble. Il « clique » dans la prise réseau grâce à un ergot. C'est le connecteur standard de l'Ethernet sur paire torsadée.</p>
<pre class="pseudo"># RJ45 : 8 contacts pour 4 paires
Ergot de verrouillage -> "clic" quand on branche
Norme de cablage des fils : T568A ou T568B</pre>
<h3>5. Les catégories : Cat5e, Cat6, Cat6a, Cat7</h3>
<p>Les <strong>catégories</strong> classent les câbles selon leur qualité, la fréquence supportée et donc le débit. Voici les faits exacts pour une longueur standard de <strong>100 mètres</strong> (la limite de l'Ethernet sur cuivre) :</p>
<pre class="pseudo"># Categories de paire torsadee (longueur de reference : 100 m)
Cat5e : jusqu'a 1 Gbit/s   sur 100 m   (100 MHz)
Cat6  : jusqu'a 1 Gbit/s   sur 100 m ; 10 Gbit/s sur ~55 m (250 MHz)
Cat6a : jusqu'a 10 Gbit/s  sur 100 m   (500 MHz)
Cat7  : jusqu'a 10 Gbit/s  sur 100 m ; blinde (600 MHz)</pre>
<p>En clair : le <strong>Cat5e</strong> et le <strong>Cat6</strong> conviennent au Gigabit courant. Pour du <strong>10 Gigabit sur 100 m</strong>, il faut du <strong>Cat6a</strong> (ou du Cat7, toujours blindé). Le Cat6 permet aussi le 10 Gbit/s, mais seulement sur une distance réduite (environ 55 m).</p>
<div class="warn">Retiens la limite universelle : sur cuivre, un lien Ethernet ne doit pas dépasser <strong>100 mètres</strong>. Au-delà, le signal s'affaiblit trop. Pour aller plus loin, il faut de la fibre optique.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Paire torsadee = cuivre, 4 paires (8 fils), connecteur RJ45
Torsadage -> annule les interferences
UTP (non blinde, courant)  |  STP (blinde, industriel)
Cat5e/Cat6 : 1 Gbit/s sur 100 m
Cat6a/Cat7 : 10 Gbit/s sur 100 m
Limite cuivre : 100 m maximum par lien</pre>`,

    { type: "vf", q: "Le câble Cat6 permet le 10 Gbit/s, mais seulement sur une distance réduite (~55 m).", a: true, exp: "Oui : le Cat6 fait 1 Gbit/s sur 100 m et 10 Gbit/s sur environ 55 m." },
    { type: "input", q: "Quel type de paire torsadée (sigle) est le plus courant car non blindé et économique ?", a: ["utp", "l'utp"], ph: "un sigle", exp: "L'UTP (non blindé) est le plus répandu." },
    { type: "qcm", q: "Le STP est particulièrement utile…", opts: ["À la maison uniquement", "En milieu industriel avec beaucoup d'interférences", "Pour dépasser la limite des 100 m", "Pour atteindre plus de 10 Gbit/s"], a: 1, exp: "Le blindage du STP protège dans les environnements bruités (usines, moteurs)." },
    { type: "qcm", q: "Que se passe-t-il si l'on dépasse 100 m de cuivre sur un lien Ethernet ?", opts: ["Le débit double", "Le signal s'affaiblit trop et la liaison devient peu fiable", "Le débit reste garanti au maximum", "Le signal se renforce avec la distance"], a: 1, exp: "Au-delà de 100 m, l'atténuation dégrade le signal : il faut de la fibre." },
    { type: "input", q: "Le Cat7 est toujours de quel type (blindé ou non) ?", a: ["blinde", "blindé", "stp", "blinde (stp)"], ph: "un mot", exp: "Le Cat7 est un câble blindé (STP)." }
  ],

    intro: `<p>Une entreprise recâble un plateau. Certains postes sont à 40 m du local technique, un serveur de sauvegarde a besoin de 10 Gbit/s, et un atelier voisin est plein de machines électriques bruyantes. On choisit les câbles.</p>`,
    questions: [

      { type: "input", q: "Dans l'atelier bruyant, quel type de paire (sigle) apporte un blindage ?", a: ["stp", "le stp", "stp (cat7)"], ph: "un sigle", exp: "Le STP (blindé) résiste mieux aux interférences des machines." },

      { type: "qcm", q: "Le connecteur au bout de tous ces câbles cuivre sera…", opts: ["Un RJ45", "Une prise SC de fibre", "Un connecteur coaxial", "Une prise USB"], a: 0, exp: "L'Ethernet sur paire torsadée se termine par un RJ45." }
    ],
    solution: `<pre class="pseudo"># Choix de cablage
Poste bureautique 40 m, 1 Gbit/s  -> Cat5e (ou Cat6), RJ45
Lien serveur 100 m, 10 Gbit/s     -> Cat6a, RJ45
Atelier bruyant                   -> paire BLINDEE (STP, ex. Cat7)
Poste a 130 m                     -> impossible en cuivre (>100 m) -> FIBRE
# Rappel : limite cuivre = 100 m par lien.</pre>
<p>Le bon câble, c'est le bon compromis débit/distance/environnement. Demain : quand le cuivre ne suffit plus, place à la fibre optique.</p>`
