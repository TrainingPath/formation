var DAY = {

  title: "Internet aujourd'hui : FAI, dorsales, maillage",
  subtitle: "Comment des milliards de machines forment un seul réseau mondial.",
  theory: `
<h3>1. Internet n'appartient à personne</h3>
<p>Contrairement à une idée reçue, Internet n'a pas de propriétaire ni de centre unique. C'est un <strong>« réseau de réseaux »</strong> : des dizaines de milliers de réseaux indépendants qui acceptent de s'interconnecter et de se transmettre le trafic les uns des autres. Chaque grand réseau porte un numéro d'identification appelé <strong>système autonome</strong> (en anglais <em>AS</em>, « Autonomous System »). Personne ne commande à l'ensemble ; tout repose sur des accords entre opérateurs.</p>
<h3>2. Le FAI : ta porte d'entrée</h3>
<p>Pour accéder à Internet, tu passes par un <strong>fournisseur d'accès à Internet</strong> (en anglais <em>ISP</em>, « Internet Service Provider »), qu'on appelle aussi <strong>opérateur</strong>. Chez toi, une <strong>box</strong> reliée à la ligne (fibre, câble ou cuivre) te connecte au réseau du FAI. Ton FAI est lui-même relié à de plus gros opérateurs, qui sont reliés à d'autres encore. On parle d'une <strong>hiérarchie</strong> : les FAI locaux se raccordent à des opérateurs régionaux, eux-mêmes raccordés aux plus grands acteurs mondiaux.</p>
<pre class="pseudo"># Le chemin d'un clic, en simplifie
Toi (LAN maison) -> Box -> FAI local -> operateur regional
                 -> grand operateur mondial -> ... -> serveur du site
# et retour en sens inverse, en paquets</pre>
<h3>3. Les dorsales : les autoroutes d'Internet</h3>
<p>Les données à longue distance circulent sur des liaisons à très haut débit appelées <strong>dorsales</strong> (en anglais <em>backbone</em>, « colonne vertébrale »). Ce sont surtout des câbles de <strong>fibre optique</strong>, y compris de gigantesques <strong>câbles sous-marins</strong> qui traversent les océans et acheminent l'immense majorité du trafic intercontinental. Quand tu ouvres un site hébergé sur un autre continent, tes paquets voyagent très probablement au fond d'un océan à travers une fibre.</p>
<div class="tip">Plus de 95 % du trafic Internet international passe par des câbles sous-marins en fibre optique, pas par les satellites. Les satellites servent surtout les zones isolées.</div>
<h3>4. Les points d'échange : là où les réseaux se rencontrent</h3>
<p>Pour éviter que chaque opérateur ne loue des liaisons vers tous les autres, les réseaux se retrouvent dans des lieux physiques appelés <strong>points d'échange Internet</strong> (en anglais <em>IXP</em>, « Internet Exchange Point »). Là, ils échangent directement leur trafic, souvent gratuitement : c'est le <strong>peering</strong> (« appairage »). Cela raccourcit les chemins et réduit les coûts. Grâce à ces multiples interconnexions, le réseau forme un <strong>maillage</strong> : entre deux points, il existe presque toujours plusieurs routes possibles.</p>
<pre class="pseudo"># Deux facons pour les operateurs de s'interconnecter
Peering  : deux reseaux echangent DIRECTEMENT leur trafic (souvent gratuit, via IXP)
Transit  : un reseau PAIE un plus gros operateur pour joindre tout le reste d'Internet</pre>
<h3>5. Un réseau maillé, donc résistant</h3>
<p>Ce maillage donne à Internet sa <strong>résilience</strong> : si une liaison tombe ou si un câble sous-marin est coupé, les paquets sont automatiquement réacheminés par d'autres routes. C'est l'héritage direct de la commutation de paquets vue hier : aucun point n'est indispensable, le trafic contourne les pannes.</p>
<div class="warn">« Le nuage » (le cloud) n'a rien d'immatériel. Derrière le mot se cachent des <strong>centres de données</strong> (en anglais <em>data centers</em>) bien réels : des bâtiments remplis de serveurs, reliés par de la fibre et consommant beaucoup d'électricité.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Internet = reseau de reseaux, sans proprietaire ni centre unique
# FAI (ISP) = ton fournisseur d'acces ; on s'y connecte via une box
# Dorsales (backbone) = fibres a haut debit, dont cables sous-marins
# IXP = points d'echange ; peering (gratuit) vs transit (payant)
# Maillage -> plusieurs routes possibles -> reseau resilient</pre>`,

    { type: "input", q: "Comment appelle-t-on l'accord par lequel deux réseaux échangent directement leur trafic, souvent gratuitement ?", a: ["peering", "le peering", "appairage"], ph: "un mot", exp: "Le peering est un appairage direct entre deux réseaux, souvent gratuit." },
    { type: "qcm", q: "Quelle est la différence entre peering et transit ?", opts: ["Le peering est payant, le transit gratuit", "Le peering échange directement (souvent gratuit), le transit est payé à un gros opérateur pour joindre tout Internet", "Ce sont des synonymes", "Le transit ne concerne que le Wi-Fi"], a: 1, exp: "Peering = échange direct souvent gratuit ; transit = accès payant au reste d'Internet." },
    { type: "qcm", q: "Pourquoi dit-on qu'Internet est « maillé » ?", opts: ["Parce qu'il est fait de laine", "Parce qu'il existe généralement plusieurs routes entre deux points", "Parce qu'il n'a qu'un seul chemin possible", "Parce qu'il est très lent"], a: 1, exp: "Le maillage offre plusieurs routes, ce qui rend le réseau résilient." },
    { type: "vf", q: "Grâce au maillage, si une liaison tombe, les paquets peuvent être réacheminés par une autre route.", a: true, exp: "Oui : c'est la résilience héritée de la commutation de paquets." },
    { type: "qcm", q: "Que se cache-t-il réellement derrière le mot « cloud » (le nuage) ?", opts: ["Rien de matériel", "Des centres de données bien réels remplis de serveurs", "Uniquement des satellites", "Des nuages dans le ciel"], a: 1, exp: "Le cloud repose sur des data centers physiques, remplis de serveurs." },
    { type: "input", q: "Comment appelle-t-on l'appareil, chez toi, qui te relie au réseau de ton FAI ?", a: ["box", "la box", "une box", "modem"], ph: "un mot", exp: "La box (ou modem-routeur) relie ton logement au réseau du FAI." },
    { type: "qcm", q: "Quel numéro identifie un grand réseau indépendant sur Internet ?", opts: ["Le numéro de série", "Le système autonome (AS)", "Le code postal", "Le numéro IMEI"], a: 1, exp: "Chaque grand réseau est un système autonome (AS) identifié par un numéro." },
    { type: "vf", q: "Les satellites transportent la majorité du trafic Internet mondial.", a: false, exp: "Non : ce sont les câbles sous-marins en fibre ; les satellites servent surtout les zones isolées." }
  ],

    ],
    solution: `<pre class="pseudo"># Le trajet Bruxelles -> Japon, etape par etape :
Toi -> Box -> FAI (operateur) -> IXP / peering
