  theory: `
<h3>1. Le successeur intelligent du hub</h3>
<p>Le <strong>commutateur</strong> (en anglais <em>switch</em>) est l'équipement central des réseaux locaux modernes. Contrairement au hub, qui répète aveuglément chaque signal partout (couche 1), le switch est un équipement de <strong>couche 2</strong> : il <strong>lit les adresses MAC</strong> des trames et n'envoie chaque trame qu'<strong>au port du bon destinataire</strong>. Là où le hub crie dans toute la pièce, le switch chuchote à la bonne personne.</p>
<h3>2. La table d'adresses MAC (l'apprentissage)</h3>
<p>Pour savoir derrière quel port se trouve chaque machine, le switch construit et tient à jour une <strong>table d'adresses MAC</strong> (aussi appelée table de commutation, ou table CAM). Le mécanisme est astucieux : il <strong>apprend en observant</strong> l'adresse MAC <em>source</em> de chaque trame qui entre.</p>
<pre class="pseudo"># Apprentissage du switch
Quand une trame arrive sur un port :
1. Le switch note : "adresse MAC SOURCE = X est derriere ce port"
   -&gt; il l'ajoute (ou la rafraichit) dans sa table.
2. Il regarde la MAC DESTINATION de la trame :
   - Destination connue dans la table ? -&gt; il envoie SEULEMENT au bon port.
   - Destination inconnue ?             -&gt; il envoie sur tous les ports
                                          (inondation / flooding) pour la trouver.
   - Destination = FF:FF:FF:FF:FF:FF ?  -&gt; diffusion : envoi a tous les ports.

# Exemple de table MAC :
Adresse MAC          Port
00:1A:2B:3C:4D:5E    1
00:AA:BB:CC:DD:EE    3</pre>
<p>Au démarrage, la table est vide, donc le switch inonde beaucoup. Très vite, en écoutant les sources, il apprend la place de chaque machine et n'envoie plus les trames qu'au bon endroit.</p>
<h3>3. Un domaine de collision par port</h3>
<p>Parce qu'il aiguille chaque trame vers un seul port, le switch crée <strong>un domaine de collision par port</strong>. Deux machines reliées à deux ports différents peuvent émettre <strong>en même temps</strong> sans collision. En reliant chaque machine par une liaison dédiée en <strong>full-duplex</strong> (émission et réception simultanées), les collisions <strong>disparaissent</strong> : CSMA/CD n'est plus nécessaire.</p>
<div class="tip">Bande passante <strong>dédiée</strong> : sur un switch, chaque port dispose de son propre débit. Un switch gigabit offre 1 Gbit/s à <em>chaque</em> port, alors qu'un hub partageait un seul débit entre tous. C'est un gain énorme d'efficacité.</div>
<h3>4. Ce que le switch ne fait pas</h3>
<p>Le switch travaille avec les adresses <strong>MAC</strong> (couche 2), pas avec les adresses <strong>IP</strong> (couche 3). Il aiguille à l'intérieur d'un réseau local, mais il ne <strong>route pas</strong> entre réseaux distants : traverser Internet reste le travail du <strong>routeur</strong>. De plus, un switch classique <strong>laisse passer la diffusion</strong> (broadcast) sur tous ses ports : tous ses ports restent dans le <strong>même domaine de diffusion</strong>. C'est le routeur qui sépare les domaines de diffusion.</p>
<div class="warn">Résumé des équipements : le <strong>hub</strong> répète tout (couche 1) ; le <strong>switch</strong> aiguille selon la MAC (couche 2) ; le <strong>routeur</strong> route selon l'IP entre réseaux (couche 3). Ne confonds pas leurs rôles.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Commutateur (switch) = equipement de couche 2 (lit les adresses MAC)
# Envoie chaque trame UNIQUEMENT au port du destinataire
# Table d'adresses MAC : apprise en observant la MAC SOURCE des trames
#   - destination connue   -&gt; envoi cible sur le bon port
#   - destination inconnue -&gt; inondation (flooding) sur tous les ports
#   - broadcast (FF:FF...)  -&gt; envoi a tous les ports
# 1 domaine de collision PAR PORT + full-duplex -&gt; plus de collision
# Ne route pas entre reseaux (c'est le routeur) ; laisse passer le broadcast</pre>`,

    { type: "qcm", q: "Avantage du switch en matière de bande passante ?", opts: ["Elle est partagée entre tous les ports", "Chaque port dispose de sa propre bande passante dédiée", "Elle est divisée par deux", "Elle est nulle"], a: 1, exp: "Chaque port a un débit dédié (ex. 1 Gbit/s par port), contrairement au hub." },
    { type: "qcm", q: "Pourquoi le switch inonde-t-il beaucoup juste après son démarrage ?", opts: ["Parce qu'il est en panne", "Parce que sa table MAC est encore vide", "Parce qu'il chiffre tout", "Parce qu'il manque d'IP"], a: 1, exp: "Table vide = destinations inconnues = inondation, le temps d'apprendre les adresses." },
    { type: "vf", q: "Le switch améliore aussi la sécurité par rapport au hub, car il n'envoie pas chaque trame à tout le monde.", a: true, exp: "Oui : en aiguillant vers le seul bon port, il limite l'écoute passive du trafic des autres." }
  ],

      { type: "input", q: "Quelle information le switch retient-il de cette première trame de PC-A ?", a: ["la mac source", "que pc-a est sur le port 1", "l'adresse mac de pc-a", "la mac source de pc-a", "mac source"], ph: "que retient-il ?", exp: "Il note que la MAC source de PC-A est derrière le port 1." },

      { type: "qcm", q: "Une fois la table remplie, PC-A renvoie une trame à PC-C. Que fait le switch ?", opts: ["Il inonde encore tous les ports", "Il envoie la trame uniquement au port 3", "Il envoie au port 2", "Il jette la trame"], a: 1, exp: "Destination connue (PC-C = port 3) : envoi ciblé sur le seul port 3." },
      { type: "qcm", q: "PC-B et PC-C peuvent-ils s'échanger des trames en même temps que PC-A émet, sans collision ?", opts: ["Non, un seul à la fois comme sur un hub", "Oui : chaque port est un domaine de collision distinct, en full-duplex", "Non, il faut un routeur", "Oui, mais seulement en half-duplex"], a: 1, exp: "Chaque port = un domaine de collision ; en full-duplex, pas de collision entre communications simultanées." }
    ],
    solution: `<pre class="pseudo"># Le switch apprend puis aiguille :
1. Trame PC-A -&gt; PC-C, PC-C inconnu :
   - le switch NOTE : MAC de PC-A = port 1 (apprentissage via la SOURCE)
   - destination inconnue -&gt; INONDATION sur les ports 2 et 3
2. PC-C repond : le switch NOTE MAC de PC-C = port 3
3. Table remplie -&gt; PC-A -&gt; PC-C : envoi CIBLE sur le port 3 uniquement
# 1 domaine de collision PAR PORT + full-duplex :
#   PC-A/PC-C et d'autres ports peuvent communiquer en meme temps sans collision.
# Le switch ne route PAS entre reseaux (routeur) et laisse passer le broadcast.</pre>
<p>Tu maîtrises désormais la couche 2 : du partage du média (CSMA/CD) jusqu'au commutateur moderne. Le hub criait à tous ; le switch, lui, écoute, apprend et aiguille avec précision.</p>`
