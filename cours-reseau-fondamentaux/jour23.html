var DAY = {
  num: 23,
  title: "Le concentrateur (hub) et ses limites (répétiteur, un seul domaine de collision)",
  subtitle: "L'ancêtre simple qui répète tout à tout le monde, et pourquoi on l'a abandonné.",
  theory: `
<h3>1. Le répétiteur : rallonger le signal</h3>
<p>Un signal électrique qui parcourt un câble <strong>s'affaiblit</strong> avec la distance (on parle d'atténuation). Le <strong>répéteur</strong> (en anglais <em>repeater</em>) est un petit appareil de <strong>couche 1</strong> (physique) dont le rôle est simple : il <strong>régénère</strong> et <strong>réémet</strong> le signal reçu, pour lui permettre d'aller plus loin. Il ne comprend rien au contenu : il ne lit ni les adresses MAC, ni les données. Il ne fait que <strong>recopier des signaux</strong>.</p>
<h3>2. Le concentrateur (hub) : un répétiteur multi-ports</h3>
<p>Le <strong>concentrateur</strong> (en anglais <em>hub</em>) est essentiellement un <strong>répéteur à plusieurs ports</strong>. On y branche plusieurs machines. Son principe est brutalement simple : quand un signal arrive sur un port, le hub le <strong>recopie sur TOUS les autres ports</strong>, sans distinction. Il ne regarde pas à qui la trame est destinée : il diffuse tout à tout le monde.</p>
<pre class="pseudo"># Comportement d'un hub (4 ports)
PC-A envoie une trame vers PC-C :
   [PC-A] --&gt; (port 1) HUB
                 |-- recopie sur port 2 -&gt; PC-B  (recoit, mais jette : pas pour lui)
                 |-- recopie sur port 3 -&gt; PC-C  (c'est pour lui : garde)
                 |-- recopie sur port 4 -&gt; PC-D  (recoit, mais jette : pas pour lui)
# Le hub ne LIT pas les adresses MAC : il repete, point.</pre>
<p>Ce sont les cartes réseau des machines qui, en lisant l'adresse MAC destination, décident si la trame les concerne ou non. Le hub, lui, travaille aveuglément à la couche 1.</p>
<h3>3. Un seul domaine de collision</h3>
<p>Puisque le hub répète chaque signal partout, <strong>toutes</strong> les machines branchées dessus partagent le même média : elles forment <strong>un seul et même domaine de collision</strong>. Si deux machines émettent en même temps, leurs signaux se percutent : collision. Le mécanisme CSMA/CD reste donc nécessaire, et le fonctionnement est en <strong>half-duplex</strong>.</p>
<div class="warn">Conséquence directe : plus on branche de machines actives sur un hub, plus il y a de collisions, et plus le réseau ralentit. La bande passante est <strong>partagée</strong> entre toutes les machines : un hub 100 Mbit/s avec dix machines, ce n'est pas 100 Mbit/s pour chacune.</div>
<h3>4. Les autres limites du hub</h3>
<p><strong>Sécurité faible</strong> : comme le hub envoie chaque trame à tous les ports, n'importe quelle machine peut « écouter » le trafic des autres (mode espion). <strong>Efficacité faible</strong> : la bande passante partagée et les collisions gaspillent le débit. <strong>Pas d'intelligence</strong> : le hub ne mémorise rien, ne filtre rien, ne connaît aucune adresse.</p>
<p>Pour toutes ces raisons, le hub a été <strong>remplacé par le commutateur (switch)</strong>, qui lit les adresses MAC et n'envoie chaque trame qu'au bon port. Les hubs ont aujourd'hui pratiquement disparu des réseaux, mais les comprendre éclaire tout l'intérêt du switch, que nous verrons demain.</p>
<div class="tip">Résumé de la hiérarchie : <strong>répéteur</strong> = 2 ports (couche 1) ; <strong>hub</strong> = répéteur multi-ports (couche 1) ; <strong>switch</strong> = équipement de couche 2 qui lit les adresses MAC. Le hub et le répéteur sont « aveugles » ; le switch « comprend » les adresses.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Repeteur : regenere le signal pour aller plus loin (couche 1)
# Hub / concentrateur : repeteur MULTI-PORTS (couche 1)
#   -&gt; recopie chaque signal sur TOUS les autres ports (aveugle)
#   -&gt; ne lit pas les adresses MAC
#   -&gt; UN SEUL domaine de collision pour tous les ports
#   -&gt; half-duplex, bande passante PARTAGEE, securite faible
# Remplace par le commutateur (switch), qui lit les adresses MAC</pre>`,
  exercises: [
    { type: "qcm", q: "À quelle couche OSI travaille un hub ?", opts: ["Couche 1 (physique)", "Couche 2 (liaison)", "Couche 3 (réseau)", "Couche 4 (transport)"], a: 0, exp: "Le hub (comme le répéteur) travaille à la couche 1 : il recopie des signaux, sans lire les adresses." },
    { type: "qcm", q: "Que fait un hub quand un signal arrive sur un de ses ports ?", opts: ["Il l'envoie uniquement au bon destinataire", "Il le recopie sur tous les autres ports", "Il le supprime", "Il le chiffre"], a: 1, exp: "Le hub répète le signal sur tous les autres ports, sans distinction." },
    { type: "vf", q: "Un hub lit l'adresse MAC destination pour n'envoyer la trame qu'au bon port.", a: false, exp: "Non : le hub est aveugle, il ne lit pas les adresses. C'est le switch qui fait cela." },

    { type: "qcm", q: "Un hub est essentiellement…", opts: ["Un routeur", "Un répéteur à plusieurs ports", "Un serveur", "Un pare-feu"], a: 1, exp: "Le hub est un répéteur multi-ports, de couche 1." },
    { type: "qcm", q: "Combien de domaines de collision crée un hub ?", opts: ["Un par port", "Un seul pour tous les ports", "Aucun", "Deux"], a: 1, exp: "Un hub = un seul domaine de collision partagé par toutes les machines." },
    { type: "vf", q: "La bande passante d'un hub est partagée entre toutes les machines branchées.", a: true, exp: "Oui : dix machines sur un hub 100 Mbit/s se partagent ces 100 Mbit/s." },
    { type: "input", q: "En quel mode duplex fonctionne un réseau sur hub ?", a: ["half-duplex", "half duplex", "half", "halfduplex"], ph: "half ou full", exp: "Un hub impose le half-duplex, avec des collisions gérées par CSMA/CD." },
    { type: "qcm", q: "Pourquoi la sécurité est-elle faible avec un hub ?", opts: ["Il chiffre mal les données", "Chaque machine peut écouter le trafic des autres (tout est diffusé)", "Il ne demande aucune authentification aux machines", "Il conserve une copie de chaque trame en mémoire"], a: 1, exp: "Comme tout est répété sur tous les ports, une machine peut espionner le trafic des autres." },
    { type: "vf", q: "Plus on branche de machines actives sur un hub, plus il y a de collisions.", a: true, exp: "Oui : un seul domaine de collision partagé = davantage de collisions quand le trafic augmente." },
    { type: "qcm", q: "Quel équipement a remplacé le hub dans les réseaux modernes ?", opts: ["Le répéteur", "Le commutateur (switch)", "Le modem", "Le câble coaxial"], a: 1, exp: "Le switch, qui lit les adresses MAC, a remplacé le hub." },
    { type: "input", q: "Qui, dans le réseau, décide finalement si une trame reçue via le hub la concerne ?", a: ["la carte reseau", "la carte reseau du destinataire", "la machine", "le pc destinataire", "la carte"], ph: "un composant", exp: "La carte réseau de chaque machine lit l'adresse MAC destination et garde ou jette la trame." },
    { type: "qcm", q: "Le hub mémorise-t-il les adresses des machines branchées ?", opts: ["Oui, dans une table", "Non, il ne mémorise rien", "Oui, mais seulement les IP", "Oui, temporairement, le temps d'une trame"], a: 1, exp: "Le hub ne mémorise rien : il n'a aucune table d'adresses, contrairement au switch." },
    { type: "vf", q: "Un répéteur classique relie généralement deux segments (deux ports) alors qu'un hub en a plusieurs.", a: true, exp: "Oui : le répéteur est souvent à 2 ports ; le hub est un répéteur multi-ports." },
    { type: "qcm", q: "Pourquoi étudier le hub aujourd'hui alors qu'il a disparu ?", opts: ["Pour l'installer partout", "Pour comprendre l'intérêt du commutateur qui l'a remplacé", "Parce qu'il est plus rapide", "Parce qu'il chiffre les données"], a: 1, exp: "Comprendre les limites du hub fait ressortir tout l'apport du switch." }
  ],
  final: {
    title: "Exercice final — Le hub qui espionne malgré lui",
    intro: `<p>Quatre PC (A, B, C, D) sont branchés sur un hub à 100 Mbit/s. PC-A envoie une trame destinée uniquement à PC-C. Analysons ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "Que fait le hub de la trame envoyée par PC-A ?", opts: ["Il l'envoie seulement à PC-C", "Il la recopie sur tous les autres ports (B, C, D)", "Il la supprime", "Il la renvoie à PC-A"], a: 1, exp: "Le hub répète la trame sur tous les ports, sans lire l'adresse." },
      { type: "input", q: "Qui décide, chez PC-B, que cette trame ne le concerne pas ?", a: ["la carte reseau", "sa carte reseau", "la carte reseau de pc-b", "la carte"], ph: "un composant", exp: "La carte réseau de PC-B lit la MAC destination et jette la trame." },
      { type: "vf", q: "PC-D pourrait, avec un logiciel espion, lire cette trame pourtant destinée à PC-C.", a: true, exp: "Oui : le hub ayant tout diffusé, PC-D reçoit la trame et pourrait l'écouter. C'est la faille du hub." },
      { type: "qcm", q: "Combien de domaines de collision pour ces quatre PC sur le hub ?", opts: ["Quatre", "Un seul", "Deux", "Zéro"], a: 1, exp: "Un hub = un seul domaine de collision partagé par A, B, C et D." },
      { type: "qcm", q: "En remplaçant le hub par un switch, qu'obtient-on principalement ?", opts: ["Rien de neuf", "La trame n'est envoyée qu'à PC-C, et chaque port a son domaine de collision", "Plus de collisions", "Une IP unique"], a: 1, exp: "Le switch lit la MAC destination : il n'envoie la trame qu'au bon port, et isole chaque port." }
    ],
    solution: `<pre class="pseudo"># Hub, 4 PC, trame A -&gt; C :
- Le hub RECOPIE la trame sur B, C et D (aveugle, couche 1)
- Chaque carte reseau lit la MAC dest :
    B et D -&gt; pas pour moi -&gt; jettent (mais ont RECU la trame -&gt; espionnage possible)
    C      -&gt; c'est pour moi -&gt; garde
- 1 SEUL domaine de collision pour A, B, C, D (half-duplex)
# Avec un switch : trame envoyee UNIQUEMENT a C + 1 domaine de collision par port</pre>
<p>Le hub est simple mais aveugle et gaspilleur. Demain, son remplaçant intelligent : le <strong>commutateur (switch)</strong>.</p>`
  }
};
