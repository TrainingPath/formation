var DAY = {
  num: 26,
  title: "Le domaine de diffusion (broadcast)",
  subtitle: "Pourquoi un switch, aussi malin soit-il, laisse passer les messages « à tout le monde ».",
  theory: `
<h3>1. Qu'est-ce qu'un broadcast ?</h3>
<p>Certaines trames ne visent pas une machine précise mais <strong>toutes les machines</strong> du réseau local en même temps. On parle de <strong>diffusion</strong> (en anglais <em>broadcast</em>). L'adresse MAC de destination est alors spéciale : <strong>FF:FF:FF:FF:FF:FF</strong>, tous les bits à 1. C'est l'équivalent d'un haut-parleur dans un open space : « Y a-t-il quelqu'un qui possède l'adresse IP 192.168.1.10 ? ». Tout le monde entend, une seule machine répond.</p>
<h3>2. À quoi sert le broadcast ?</h3>
<p>Il est indispensable au fonctionnement du réseau. L'exemple le plus courant est le protocole <strong>ARP</strong> (<em>Address Resolution Protocol</em>) : pour trouver l'adresse MAC associée à une adresse IP, une machine crie en broadcast « qui a cette IP ? ». Le <strong>DHCP</strong>, qui distribue les adresses IP automatiquement, commence lui aussi par un broadcast (le client ne connaît encore aucun serveur). Sans diffusion, les machines ne pourraient pas se découvrir.</p>
<h3>3. Le domaine de diffusion (broadcast domain)</h3>
<p>On appelle <strong>domaine de diffusion</strong> (en anglais <em>broadcast domain</em>) l'ensemble des machines qui reçoivent le broadcast d'une seule d'entre elles. Autrement dit : la zone que couvre un cri « à tout le monde ». Plus ce domaine est grand, plus il y a de machines dérangées à chaque diffusion.</p>
<div class="tip">Ne confonds pas avec le <strong>domaine de collision</strong> vu plus tôt. Le domaine de <em>collision</em> concerne les signaux qui s'entrechoquent (couche 1). Le domaine de <em>diffusion</em> concerne les trames broadcast qui se propagent (couche 2). Ce sont deux notions différentes.</div>
<h3>4. Le switch NE sépare PAS les broadcasts</h3>
<p>Voici le point clé du jour. Le switch a résolu le problème des collisions : <strong>chaque port est son propre domaine de collision</strong>. Mais il n'a rien changé pour la diffusion. Quand une trame broadcast (destination FF:FF:FF:FF:FF:FF) arrive, le switch l'<strong>inonde sur tous ses ports</strong>, exactement comme un hub. Il ne peut pas décider de la retenir : par définition, un broadcast s'adresse à tous.</p>
<pre class="pseudo">Trame destination = FF:FF:FF:FF:FF:FF
       |
    [ SWITCH ]  --&gt; recopie sur TOUS les ports (sauf l'arrivee)
    /    |    \\
 PC-A  PC-B  PC-C   (tous la recoivent)</pre>
<p>Conclusion capitale : <strong>un switch, seul, forme un unique grand domaine de diffusion</strong>. Ajouter des switches en cascade agrandit le domaine, sans jamais le découper.</p>
<h3>5. Pourquoi c'est un problème à grande échelle</h3>
<p>Dans un réseau de quelques postes, aucun souci. Mais avec des centaines de machines, les broadcasts s'accumulent : chaque poste doit lire et traiter chaque diffusion, même si elle ne le concerne pas. Cela consomme de la bande passante et du temps processeur. Dans le pire des cas, une boucle mal gérée provoque une <strong>tempête de broadcast</strong> (<em>broadcast storm</em>) qui sature le réseau. On a donc besoin d'un moyen de <strong>découper</strong> un grand réseau en plusieurs domaines de diffusion plus petits.</p>
<div class="warn">Retiens la limite du switch : il segmente les collisions mais PAS les broadcasts. Pour couper un domaine de diffusion, il faudra soit un <strong>routeur</strong> (couche 3), soit des <strong>VLAN</strong> (le sujet des prochains jours).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Broadcast = trame pour TOUS ; MAC dest = FF:FF:FF:FF:FF:FF
# Utile pour ARP, DHCP (decouverte sur le LAN)
# Domaine de diffusion = zone atteinte par un broadcast
# Le SWITCH inonde les broadcasts partout : il ne les separe PAS
# 1 switch (ou une cascade) = 1 seul domaine de diffusion
# Pour decouper : routeur (couche 3) ou VLAN</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle adresse MAC de destination désigne un broadcast (tout le monde) ?", opts: ["00:00:00:00:00:00", "FF:FF:FF:FF:FF:FF", "AA:BB:CC:DD:EE:FF", "FF:00:FF:00:FF:00"], a: 1, exp: "Le broadcast utilise FF:FF:FF:FF:FF:FF, tous les bits à 1." },
    { type: "qcm", q: "Que fait un switch d'une trame broadcast ?", opts: ["Il la jette", "Il l'inonde sur tous les ports sauf celui d'arrivée", "Il la garde en mémoire", "Il la renvoie à l'expéditeur seul"], a: 1, exp: "Un broadcast s'adresse à tous : le switch le recopie sur tous les autres ports." },
    { type: "qcm", q: "Quel protocole utilise un broadcast pour trouver la MAC associée à une IP ?", opts: ["HTTP", "ARP", "FTP", "SSH"], a: 1, exp: "ARP diffuse « qui a cette IP ? » en broadcast pour obtenir la MAC." },
    { type: "qcm", q: "Comment appelle-t-on l'ensemble des machines qui reçoivent un même broadcast ?", opts: ["Le domaine de collision", "Le domaine de diffusion", "La table CAM", "Le sous-réseau physique"], a: 1, exp: "C'est le domaine de diffusion (broadcast domain)." },
    { type: "qcm", q: "Combien de domaines de diffusion forme un switch seul ?", opts: ["Un par port", "Un seul pour tout le switch", "Deux", "Aucun"], a: 1, exp: "Le switch ne sépare pas les broadcasts : tout le switch est un unique domaine de diffusion." },
    { type: "qcm", q: "Quel équipement peut découper un réseau en plusieurs domaines de diffusion ?", opts: ["Un hub", "Un routeur (ou des VLAN)", "Un câble plus long", "Un répéteur"], a: 1, exp: "Un routeur (couche 3), ou des VLAN, séparent les domaines de diffusion." },
    { type: "vf", q: "Le switch sépare les domaines de collision mais pas les domaines de diffusion.", a: true, exp: "Exact : chaque port est un domaine de collision, mais tout le switch reste un seul domaine de diffusion." },
    { type: "vf", q: "Un broadcast ne concerne qu'une seule machine précise.", a: false, exp: "Non : un broadcast s'adresse à TOUTES les machines du domaine de diffusion." },
    { type: "vf", q: "Le DHCP commence par un échange en broadcast car le client ne connaît pas encore de serveur.", a: true, exp: "Vrai : sans adresse ni serveur connu, le client DHCP diffuse d'abord à tous." },
    { type: "vf", q: "Ajouter des switches en cascade découpe le domaine de diffusion en plusieurs morceaux.", a: false, exp: "Faux : les switches en cascade agrandissent le même domaine de diffusion, ils ne le coupent pas." },
    { type: "input", q: "Quel est le terme anglais pour « diffusion » (message à tout le monde) ?", a: ["broadcast", "le broadcast"], ph: "un mot", exp: "Broadcast signifie diffusion à tous." },
    { type: "input", q: "Écris l'adresse MAC de broadcast (six octets en hexadécimal séparés par des deux-points).", a: ["ff:ff:ff:ff:ff:ff", "ffffffffffff", "ff-ff-ff-ff-ff-ff"], ph: "FF:FF:...", exp: "FF:FF:FF:FF:FF:FF : tous les bits à 1." },
    { type: "input", q: "Comment nomme-t-on une saturation du réseau provoquée par un excès de broadcasts (terme, français ou anglais) ?", a: ["tempete de broadcast", "broadcast storm", "tempete", "storm"], ph: "un terme", exp: "Une tempête de broadcast (broadcast storm) sature le réseau." },
    { type: "input", q: "Ne pas confondre : quel autre domaine, lié aux signaux qui s'entrechoquent, le switch sépare-t-il bien port par port ?", a: ["collision", "domaine de collision", "le domaine de collision"], ph: "domaine de …", exp: "Le domaine de collision : chaque port du switch en est un." },
    { type: "input", q: "Pour isoler des groupes de machines dans le même switch (prochain sujet), on utilisera des… ?", a: ["vlan", "des vlan", "les vlan"], ph: "un sigle", exp: "Les VLAN permettront de découper les domaines de diffusion dans un même switch." }
  ],
  final: {
    title: "Exercice final — Une diffusion dans l'open space",
    intro: `<p>Un petit bureau compte 20 PC branchés sur deux switches reliés entre eux (en cascade). Un PC lance une requête ARP « qui a l'IP 192.168.1.50 ? » en broadcast. Analysons la portée de ce cri.</p>`,
    questions: [
      { type: "qcm", q: "Quelle adresse MAC de destination porte cette requête ARP ?", opts: ["Celle du PC cible", "FF:FF:FF:FF:FF:FF", "00:00:00:00:00:00", "Celle du switch"], a: 1, exp: "Une requête ARP est diffusée : destination FF:FF:FF:FF:FF:FF." },
      { type: "qcm", q: "Combien de PC reçoivent la trame ?", opts: ["Seulement le PC cible", "Les 19 autres PC (tout le domaine de diffusion)", "Un seul par switch", "Aucun"], a: 1, exp: "Les deux switches en cascade forment un seul domaine : tous les autres PC la reçoivent." },
      { type: "vf", q: "Les deux switches, étant reliés, forment un seul et même domaine de diffusion.", a: true, exp: "Vrai : des switches en cascade ne séparent pas les broadcasts, le domaine est commun." },
      { type: "qcm", q: "Combien de PC répondent réellement à cette requête ARP ?", opts: ["Tous", "Un seul : celui qui possède l'IP 192.168.1.50", "Deux", "Aucun"], a: 1, exp: "Tous entendent, mais seul le propriétaire de l'IP répond." },
      { type: "input", q: "Quel type d'équipement (couche 3) faudrait-il ajouter pour couper ce réseau en deux domaines de diffusion distincts ?", a: ["routeur", "un routeur", "le routeur"], ph: "un mot", exp: "Un routeur (ou des VLAN) séparerait le réseau en plusieurs domaines de diffusion." }
    ],
    solution: `<pre class="pseudo"># La requete ARP en broadcast :
Destination MAC = FF:FF:FF:FF:FF:FF
       |
  [Switch 1] === cascade === [Switch 2]
   \\ tous les ports /        \\ tous les ports /
  -&gt; les 19 autres PC la recoivent (1 seul domaine de diffusion)
  -&gt; 1 seul PC repond (celui qui a l'IP 192.168.1.50)

# Pour couper en 2 domaines : un ROUTEUR (couche 3) ou des VLAN.</pre>
<p>Un switch, même en cascade, ne borne pas la diffusion. C'est précisément ce que les VLAN vont corriger dans les prochains jours.</p>`
  }
};
