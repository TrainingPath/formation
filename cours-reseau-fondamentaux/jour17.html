<script>
var DAY = {
  num: 17,
  title: "Le partage du média : CSMA/CD (écouter, parler, gérer les collisions)",
  subtitle: "Un seul câble, plusieurs machines : comment parler chacun son tour sans se marcher dessus.",
  theory: `
<h3>1. Le problème : un seul fil pour tout le monde</h3>
<p>Aux débuts d'Ethernet, toutes les machines d'un réseau partageaient un <strong>même support physique</strong> (en anglais <em>media</em>, le « média ») : un unique câble sur lequel chacune envoyait ses signaux électriques. C'est comme une <strong>salle de réunion sans animateur</strong> : une seule personne peut parler à la fois pour être comprise. Si deux personnes parlent en même temps, leurs voix se mélangent et personne ne comprend rien. En réseau, ce mélange de deux signaux s'appelle une <strong>collision</strong>.</p>
<p>Il fallait donc une règle de politesse partagée, appliquée par chaque carte réseau, pour décider quand parler. Cette règle s'appelle <strong>CSMA/CD</strong>.</p>
<h3>2. CSMA : écouter avant de parler</h3>
<p>Le sigle <strong>CSMA</strong> signifie <em>Carrier Sense Multiple Access</em>, « accès multiple avec écoute de la porteuse ». Décortiquons :</p>
<p><strong>Multiple Access</strong> : plusieurs machines se partagent le même média. <strong>Carrier Sense</strong> (« écoute de la porteuse ») : avant d'émettre, une machine <strong>écoute</strong> le câble pour savoir s'il est libre ou occupé. Si quelqu'un parle déjà, elle attend. Si le câble est silencieux, elle peut commencer à émettre. Comme dans une conversation polie : on écoute avant de prendre la parole.</p>
<div class="tip">L'écoute avant émission évite <em>beaucoup</em> de collisions, mais pas toutes : deux machines qui trouvent le câble libre au même instant vont émettre ensemble. D'où la deuxième partie du mécanisme.</div>
<h3>3. CD : détecter la collision</h3>
<p><strong>CD</strong> signifie <em>Collision Detection</em>, « détection de collision ». Pendant qu'elle émet, la machine continue d'<strong>écouter le câble</strong>. Si elle constate que le signal présent ne correspond pas à ce qu'elle a envoyé, c'est qu'une autre machine émettait en même temps : il y a collision. Détecter tôt permet d'arrêter tout de suite et de ne pas gaspiller le câble avec un message déjà perdu.</p>
<pre class="pseudo"># Algorithme simplifie de CSMA/CD (cote d'une carte reseau)
1. J'ai une trame a envoyer.
2. J'ecoute le cable (Carrier Sense).
   - Occupe ? -&gt; j'attends qu'il se libere.
   - Libre  ? -&gt; j'emets.
3. Pendant l'emission, je continue d'ecouter (Collision Detection).
   - Collision detectee ? -&gt; voir etape 4.
   - Aucune collision jusqu'a la fin ? -&gt; envoi reussi.
4. J'envoie un signal de brouillage (JAM) puis j'attends
   un delai ALEATOIRE, et je recommence a l'etape 2.</pre>
<h3>4. Le signal JAM et l'attente aléatoire (backoff)</h3>
<p>Quand une collision est détectée, la machine envoie un court <strong>signal de brouillage</strong> (en anglais <em>JAM</em>) pour être sûre que toutes les autres ont bien compris qu'il y a eu collision. Ensuite, chaque machine impliquée attend un <strong>délai aléatoire</strong> avant de réessayer : c'est le <strong>backoff</strong> (« repli »). Pourquoi aléatoire ? Pour éviter que les deux ne réessaient exactement au même moment et ne collisionnent à nouveau. Si les collisions se répètent, le délai possible s'agrandit à chaque tentative : on parle de <strong>backoff exponentiel</strong>.</p>
<div class="warn">CSMA/CD ne fonctionne qu'en <strong>half-duplex</strong> (on parle OU on écoute, pas les deux en même temps). Sur les réseaux modernes en <strong>full-duplex</strong> avec des commutateurs, il n'y a plus de collision possible : CSMA/CD devient inutile. C'est un mécanisme historique, essentiel pour comprendre pourquoi les réseaux ont évolué.</p></div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CSMA/CD = regle de politesse pour un cable partage
# CS  = Carrier Sense    : j'ecoute avant de parler
# MA  = Multiple Access  : plusieurs machines, un seul media
# CD  = Collision Detect : j'ecoute pendant que je parle
# Collision -&gt; signal JAM -&gt; attente ALEATOIRE (backoff) -&gt; on recommence
# Fonctionne en half-duplex uniquement (obsolete en full-duplex)</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle CSMA/CD (en français, l'idée générale) ?", opts: ["Chiffrer les messages avant l'envoi", "Écouter avant de parler et détecter les collisions", "Compresser les données", "Router les paquets entre réseaux"], a: 1, exp: "CSMA = écoute avant émission ; CD = détection de collision pendant l'émission." },
    { type: "qcm", q: "Que désigne le mot « collision » sur un média partagé ?", opts: ["Deux câbles qui se touchent", "Deux signaux émis en même temps qui se mélangent", "Une panne de la carte réseau", "Une erreur détectée par le contrôle CRC de la trame"], a: 1, exp: "Une collision, c'est le chevauchement de deux émissions simultanées qui rend les signaux illisibles." },
    { type: "input", q: "Que fait une machine JUSTE avant d'émettre, selon CSMA (un verbe) ?", a: ["elle ecoute", "ecouter", "ecoute", "elle ecoute le cable", "elle ecoute le media"], ph: "un verbe", exp: "Carrier Sense : la machine écoute le câble pour vérifier qu'il est libre." },
    { type: "vf", q: "Écouter le câble avant d'émettre suffit à empêcher toute collision.", a: false, exp: "Non : deux machines peuvent trouver le câble libre au même instant et émettre ensemble. D'où la détection de collision." },
    { type: "qcm", q: "Que fait la machine PENDANT qu'elle émet, selon la partie « CD » ?", opts: ["Elle arrête d'écouter jusqu'à la fin de l'émission", "Elle continue d'écouter pour détecter une collision", "Elle attend une confirmation du routeur", "Elle chiffre les données"], a: 1, exp: "Collision Detection : on écoute pendant l'émission pour repérer un signal anormal." },
    { type: "input", q: "Comment appelle-t-on le court signal envoyé pour prévenir toutes les machines d'une collision ?", a: ["jam", "signal jam", "le jam", "signal de brouillage", "brouillage"], ph: "un mot anglais", exp: "Le signal JAM (brouillage) s'assure que toutes les stations savent qu'il y a eu collision." },
    { type: "qcm", q: "Après une collision, combien de temps la machine attend-elle avant de réessayer ?", opts: ["Toujours 1 seconde exactement", "Un délai aléatoire (backoff)", "Elle n'attend jamais, elle réémet aussitôt", "Un délai fixe imposé par le constructeur de la carte"], a: 1, exp: "Un délai aléatoire (backoff) réduit le risque que les deux machines réémettent ensemble." },
    { type: "vf", q: "Le délai d'attente après collision est volontairement aléatoire.", a: true, exp: "Oui : si le délai était fixe, les deux machines réémettraient au même instant et collisionneraient encore." },
    { type: "qcm", q: "Que signifie « MA » dans CSMA ?", opts: ["Message Authentication", "Multiple Access (accès partagé par plusieurs machines)", "Maximum Address", "Media Adapter"], a: 1, exp: "Multiple Access : plusieurs machines se partagent le même support." },
    { type: "input", q: "Comment nomme-t-on l'attente aléatoire après une collision (terme anglais) ?", a: ["backoff", "le backoff", "backoff exponentiel"], ph: "un mot anglais", exp: "Le backoff (repli) ; il devient exponentiel si les collisions se répètent." },
    { type: "vf", q: "CSMA/CD est utile en mode full-duplex avec un commutateur moderne.", a: false, exp: "Non : en full-duplex il n'y a plus de collision possible, CSMA/CD devient inutile. Il n'a de sens qu'en half-duplex." },
    { type: "qcm", q: "Pourquoi le backoff devient-il « exponentiel » ?", opts: ["Pour raccourcir l'attente à chaque nouvelle tentative", "Pour agrandir la plage d'attente à chaque nouvelle collision", "Pour imposer un ordre de passage fixe aux machines", "Pour compenser la longueur du câble partagé"], a: 1, exp: "À chaque échec, la plage de délais possibles s'agrandit, diminuant la probabilité de re-collision." },
    { type: "qcm", q: "Dans l'analogie de la salle de réunion, la collision correspond à…", opts: ["Une pause café", "Deux personnes qui parlent en même temps", "Le silence total", "Quelqu'un qui lève la main"], a: 1, exp: "Deux voix simultanées se mélangent : personne ne comprend, c'est la collision." },
    { type: "input", q: "En quel mode de communication CSMA/CD est-il nécessaire : half-duplex ou full-duplex ?", a: ["half-duplex", "half duplex", "halfduplex", "half"], ph: "half ou full", exp: "CSMA/CD ne concerne que le half-duplex (on parle OU on écoute), pas le full-duplex." },
    { type: "vf", q: "Quand une machine détecte une collision, elle continue simplement d'émettre sa trame jusqu'au bout.", a: false, exp: "Non : elle arrête, envoie un signal JAM puis attend un délai aléatoire avant de recommencer." }
  ],
  final: {
    title: "Exercice final — Deux PC sur un vieux câble partagé",
    intro: `<p>Dans une petite salle, deux ordinateurs, PC-A et PC-B, sont branchés sur un même câble partagé (réseau half-duplex). Tous deux ont une trame à envoyer au même moment. Suivons ce qui se passe grâce à CSMA/CD.</p>`,
    questions: [
      { type: "qcm", q: "Avant d'émettre, que font PC-A et PC-B ?", opts: ["Ils émettent aussitôt sans vérifier", "Ils écoutent le câble pour voir s'il est libre", "Ils envoient d'abord un signal de réservation du câble", "Ils changent d'adresse MAC"], a: 1, exp: "Carrier Sense : chacun écoute avant d'émettre." },
      { type: "qcm", q: "Le câble est silencieux : les deux émettent en même temps. Que se produit-il ?", opts: ["Rien d'anormal", "Une collision : les signaux se mélangent", "Les deux trames arrivent intactes à destination", "La carte réseau corrige automatiquement le mélange"], a: 1, exp: "Deux émissions simultanées provoquent une collision." },
      { type: "input", q: "Quel signal chaque PC envoie-t-il après avoir détecté la collision ?", a: ["jam", "le jam", "signal jam", "signal de brouillage", "brouillage"], ph: "un mot", exp: "Le signal JAM prévient toutes les stations qu'il y a eu collision." },
      { type: "vf", q: "PC-A et PC-B vont attendre exactement le même délai avant de réessayer.", a: false, exp: "Non : chacun tire un délai aléatoire (backoff), justement pour ne pas re-collisionner." },
      { type: "qcm", q: "Comment éviter définitivement ces collisions entre PC-A et PC-B ?", opts: ["Augmenter le débit du câble à 100 Mbit/s", "Passer en full-duplex via un commutateur (un domaine de collision par port)", "Attribuer une adresse IP fixe à chaque PC", "Utiliser des câbles plus longs"], a: 1, exp: "Un commutateur en full-duplex supprime les collisions : CSMA/CD n'est plus nécessaire." }
    ],
    solution: `<pre class="pseudo"># Deroulement CSMA/CD pour PC-A et PC-B :
1. Ecoute du cable            -&gt; libre
2. Emission simultanee        -&gt; COLLISION
3. Detection de la collision  -&gt; chacun envoie un signal JAM
4. Attente ALEATOIRE (backoff) differente pour A et B
5. Reemission -&gt; cette fois, l'un passe avant l'autre : OK
# Solution durable : commutateur + full-duplex = plus de collision</pre>
<p>CSMA/CD explique pourquoi les vieux réseaux partagés devenaient lents quand on ajoutait des machines : plus de monde sur le câble, plus de collisions. Demain, nous verrons ce qu'est précisément un <strong>domaine de collision</strong>.</p>`
  }
};
