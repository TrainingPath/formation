  title: "La couche 1 : le rôle de la couche physique",
  subtitle: "Tout en bas, là où les données deviennent des signaux réels.",
  theory: `
<h3>1. La fondation de tout le réseau</h3>
<p>La <strong>couche physique</strong> (en anglais <em>physical layer</em>) est la <strong>couche 1</strong> du modèle OSI, la plus basse. Son rôle est simple à énoncer mais essentiel : <strong>transporter les bits d'un point à un autre sous forme de signaux réels</strong> sur un support (un câble, une fibre, des ondes). Sans elle, aucune donnée ne circule : c'est le sol sur lequel reposent toutes les autres couches.</p>
<p>Analogie : les couches hautes écrivent une lettre, l'adressent, la mettent sous enveloppe. La couche physique, c'est le facteur et la route : peu importe le contenu de la lettre, il faut bien que quelque chose parcoure la distance physique.</p>
<h3>2. Ce que gère (et ne gère pas) la couche 1</h3>
<p>La couche physique se moque totalement du <em>sens</em> des données. Elle ne sait pas ce qu'est une adresse, un fichier ou une page web. Elle s'occupe uniquement de « quel signal représente un 1, quel signal représente un 0, et comment l'envoyer proprement ».</p>
<pre class="pseudo"># La couche physique s'occupe de :
- le support   : cuivre, fibre optique, air (ondes radio)
- le signal    : electrique, lumineux, radio
- le codage    : quel signal = 0, quel signal = 1
- les connecteurs et brochages (RJ45, prises...)
- le debit binaire, le sens de transmission
# Elle NE s'occupe PAS de :
- adresses, routage, fiabilite, applications</pre>
<h3>3. Les trois grands types de support</h3>
<p>On distingue les supports <strong>guidés</strong> (le signal suit un chemin matériel) et <strong>non guidés</strong> (le signal se propage librement) :</p>
<pre class="pseudo"># Supports guides (le signal suit un fil)
- Cable coaxial          : cuivre, un conducteur central
- Paire torsadee (RJ45)  : cuivre, le plus repandu en LAN
- Fibre optique          : verre/plastique, signal lumineux
# Support non guide
- Ondes radio (Wi-Fi, 4G/5G, Bluetooth)</pre>
<div class="tip">« Guidé » ne veut pas dire « meilleur ». Chaque support a ses forces : le cuivre est bon marché, la fibre va très loin très vite, la radio libère du câble. On choisit selon la distance, le débit et le budget.</div>
<h3>4. Sens de transmission et équipements de couche 1</h3>
<p>La couche 1 définit aussi le <strong>sens</strong> de circulation : <strong>simplex</strong> (un seul sens, comme la radio FM), <strong>half-duplex</strong> (les deux sens mais pas en même temps, comme un talkie-walkie) et <strong>full-duplex</strong> (les deux sens simultanément, comme le téléphone).</p>
<p>Certains équipements travaillent uniquement à ce niveau : le <strong>répéteur</strong> (en anglais <em>repeater</em>) régénère un signal affaibli pour aller plus loin ; le <strong>concentrateur</strong> (en anglais <em>hub</em>) recopie bêtement le signal reçu sur tous ses ports. Ils ne lisent aucune adresse : ce sont de purs équipements de couche 1.</p>
<div class="warn">Le hub étant « aveugle » (il répète tout partout), il partage la bande passante et provoque des collisions. Il a été remplacé par le commutateur (switch), qui, lui, travaille à la couche 2. Ne confonds pas hub (couche 1) et switch (couche 2).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Couche 1 = physique = transporter les BITS en SIGNAUX
Supports : cuivre (coaxial, paire torsadee), fibre, radio
Roles    : codage 0/1, connecteurs, debit, sens
Sens     : simplex / half-duplex / full-duplex
Materiel : repeteur, hub (aveugles, couche 1)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le numéro de la couche physique dans le modèle OSI ?", opts: ["1", "2", "3", "7"], a: 0, exp: "La couche physique est la couche 1, la plus basse d'OSI." },
    { type: "qcm", q: "Quel est le rôle principal de la couche physique ?", opts: ["Router les paquets", "Transporter les bits sous forme de signaux", "Gérer les adresses IP", "Afficher les pages web"], a: 1, exp: "Elle transforme les bits en signaux réels et les envoie sur le support." },
    { type: "vf", q: "La couche physique comprend le contenu (le sens) des données qu'elle transmet.", a: false, exp: "Non : elle ignore le sens ; elle ne gère que le signal 0/1." },

    { type: "input", q: "Comment appelle-t-on le support non guidé qui propage le signal dans l'air ? (deux mots)", a: ["ondes radio", "les ondes radio", "onde radio", "radio"], ph: "deux mots", exp: "Les ondes radio (Wi-Fi, 4G/5G, Bluetooth) sont non guidées." },
    { type: "qcm", q: "Quel équipement régénère un signal affaibli pour aller plus loin ?", opts: ["Le routeur", "Le répéteur", "Le pare-feu", "Le serveur"], a: 1, exp: "Le répéteur (repeater) amplifie/régénère le signal : pur couche 1." },
    { type: "vf", q: "Le hub (concentrateur) recopie le signal reçu sur tous ses ports.", a: true, exp: "Oui : le hub est « aveugle » et répète partout, c'est un équipement de couche 1." },
    { type: "qcm", q: "Un talkie-walkie (deux sens mais pas simultanément) illustre quel mode ?", opts: ["Simplex", "Half-duplex", "Full-duplex", "Multiplex"], a: 1, exp: "Half-duplex : les deux sens, mais à tour de rôle." },
    { type: "input", q: "Quel mode permet d'émettre et de recevoir en même temps (comme le téléphone) ? (un mot composé)", a: ["full-duplex", "full duplex", "fullduplex", "duplex integral"], ph: "un terme", exp: "Full-duplex : émission et réception simultanées." },
    { type: "qcm", q: "Lequel de ces éléments ne relève PAS de la couche physique ?", opts: ["Le connecteur RJ45", "Le codage 0/1 du signal", "L'adresse IP de destination", "Le type de câble"], a: 2, exp: "L'adressage IP relève de la couche 3 (Internet), pas de la couche 1." },
    { type: "vf", q: "La fibre optique transporte le signal sous forme de lumière.", a: true, exp: "Oui : la fibre utilise un signal lumineux, contrairement au cuivre (électrique)." },
    { type: "input", q: "Comment appelle-t-on le mode de transmission à sens unique (ex. radio FM) ? (un mot)", a: ["simplex", "le simplex"], ph: "un mot", exp: "Simplex : un seul sens de transmission." },
    { type: "qcm", q: "Pourquoi le hub a-t-il été remplacé par le switch ?", opts: ["Le hub était trop cher", "Le hub répète tout partout, ce qui gaspille la bande passante et crée des collisions", "Le hub ne fonctionnait qu'en fibre", "Le hub n'existait pas sous Windows"], a: 1, exp: "Le switch (couche 2) dirige intelligemment, le hub inondait tous les ports." },
    { type: "qcm", q: "La couche physique s'occupe notamment…", opts: ["Du routage entre réseaux", "Des connecteurs et du brochage des câbles", "Des noms de domaine", "Du chiffrement des mots de passe"], a: 1, exp: "Connecteurs, brochage, signal et débit sont du ressort de la couche 1." },
    { type: "input", q: "Le cuivre transporte un signal de quelle nature ? (un adjectif)", a: ["electrique", "electricité", "un signal electrique"], ph: "un adjectif", exp: "Le cuivre transporte un signal électrique ; la fibre, lumineux." }
  ],

    intro: `<p>Dans un petit local, deux ordinateurs distants de 120 mètres sont reliés par un long câble cuivre. Le signal arrive trop faible et la liaison est instable. On raisonne au niveau de la couche physique.</p>`,
    questions: [
      { type: "qcm", q: "À quelle couche OSI se situe ce problème de signal affaibli ?", opts: ["Couche 1 (physique)", "Couche 3 (réseau)", "Couche 4 (transport)", "Couche 7 (application)"], a: 0, exp: "Un problème de signal sur le support relève de la couche physique." },
      { type: "input", q: "Quel équipement de couche 1 pourrait régénérer le signal en cours de route ? (un mot)", a: ["repeteur", "un repeteur", "le repeteur", "repeater"], ph: "un mot", exp: "Le répéteur régénère le signal pour prolonger la portée." },
      { type: "qcm", q: "Pour une liaison longue et rapide, quel support serait le plus adapté ?", opts: ["Un câble coaxial court", "La fibre optique", "Un hub supplémentaire", "Une adresse IP fixe"], a: 1, exp: "La fibre porte le signal loin et vite, bien mieux que le cuivre sur 120 m." },
      { type: "vf", q: "Changer l'adresse IP des ordinateurs corrigerait ce problème de signal.", a: false, exp: "Non : l'adresse IP (couche 3) n'a aucun effet sur un signal physique affaibli." },
      { type: "qcm", q: "Le codage « quel signal = 0, quel signal = 1 » est du ressort de…", opts: ["La couche application", "La couche physique", "La couche transport", "La couche internet"], a: 1, exp: "La représentation des bits en signaux est le cœur de la couche physique." }
    ],
    solution: `<pre class="pseudo"># Raisonnement couche 1
Symptome : signal trop faible sur 120 m de cuivre
Cause    : attenuation (le signal s'affaiblit avec la distance)
Solutions:
  - inserer un REPETEUR pour regenerer le signal
  - ou remplacer le cuivre par de la FIBRE (longue portee)
# L'adresse IP (couche 3) n'a aucun role ici.</pre>
<p>La couche physique fixe les limites de distance et de débit. Demain : comment les bits deviennent réellement des signaux.</p>`
  }
};
