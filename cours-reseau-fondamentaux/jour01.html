var DAY = {
  num: 1,
  title: "Qu'est-ce qu'un réseau informatique ?",
  subtitle: "Relier des machines pour qu'elles se parlent et partagent.",
  theory: `
<h3>1. Une définition simple</h3>
<p>Un <strong>réseau informatique</strong> (en anglais <em>computer network</em>) est un ensemble d'appareils reliés entre eux afin de <strong>communiquer</strong> et de <strong>partager des ressources</strong> : des fichiers, une imprimante, une connexion Internet, un service. Le plus petit réseau possible, c'est deux ordinateurs reliés par un câble. Le plus grand, c'est Internet lui-même, qui interconnecte des milliards de machines.</p>
<p>Pense à un réseau routier. Les villes sont les ordinateurs, les routes sont les liaisons, et les voitures sont les données qui circulent. Sans routes, chaque ville resterait isolée ; sans réseau, chaque machine travaillerait seule dans son coin.</p>
<h3>2. Les briques de base</h3>
<p>Chaque appareil relié à un réseau s'appelle un <strong>hôte</strong> (en anglais <em>host</em>) ou un <strong>nœud</strong> (<em>node</em>). Pour se connecter, une machine utilise une <strong>carte réseau</strong> (en anglais <em>NIC</em>, « Network Interface Card »). Les machines ne se relient pas au hasard : elles passent par des équipements d'interconnexion comme le <strong>commutateur</strong> (en anglais <em>switch</em>), qui relie les appareils d'un même réseau local, et le <strong>routeur</strong> (<em>router</em>), qui relie des réseaux différents entre eux.</p>
<pre class="pseudo"># Vocabulaire de base
Hote / noeud   -> un appareil du reseau (PC, telephone, imprimante, serveur)
Carte reseau   -> le composant qui branche l'hote au reseau (NIC)
Switch         -> relie les machines d'UN meme reseau local
Routeur        -> relie DES reseaux differents entre eux
Support         -> le cable (cuivre, fibre) ou les ondes (Wi-Fi)</pre>
<h3>3. Client et serveur</h3>
<p>Sur un réseau, deux rôles reviennent sans cesse. Le <strong>client</strong> est la machine qui <em>demande</em> un service (ton navigateur qui réclame une page web). Le <strong>serveur</strong> (en anglais <em>server</em>) est la machine qui <em>fournit</em> ce service (l'ordinateur qui héberge le site et renvoie la page). Une même machine peut être cliente pour un service et serveuse pour un autre. Ce modèle « je demande, tu réponds » s'appelle le modèle <strong>client-serveur</strong>.</p>
<h3>4. Classer les réseaux par taille : LAN, MAN, WAN</h3>
<p>On classe souvent les réseaux selon leur <strong>étendue géographique</strong>. Le <strong>LAN</strong> (« Local Area Network », réseau local) couvre une petite zone : une maison, un bureau, un bâtiment. Le <strong>MAN</strong> (« Metropolitan Area Network ») couvre une ville ou une agglomération. Le <strong>WAN</strong> (« Wide Area Network », réseau étendu) couvre un pays ou la planète entière : Internet est le plus grand des WAN.</p>
<pre class="pseudo"># Du plus petit au plus grand
LAN  -> une piece, une maison, un bureau        (quelques metres a ~1 km)
MAN  -> une ville, un campus, une agglomeration  (quelques km a des dizaines de km)
WAN  -> un pays, un continent, le monde          (des centaines a des milliers de km)</pre>
<div class="tip">Ton Wi-Fi domestique est un <strong>LAN</strong>. Quand tu ouvres un site hébergé à l'étranger, tes données voyagent sur un <strong>WAN</strong> : elles sortent de ton LAN, traversent le réseau de ton opérateur, puis Internet.</div>
<div class="warn">Ne confonds pas « réseau » et « Internet ». Internet est UN réseau (le plus grand), mais il existe des millions de réseaux privés qui ne sont pas reliés à Internet, par exemple le réseau interne d'une usine coupé du monde extérieur pour des raisons de sécurité.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Un reseau = des appareils relies pour communiquer et partager
# Hote/noeud = un appareil ; Switch = relie un LAN ; Routeur = relie des reseaux
# Client demande, Serveur repond (modele client-serveur)
# Taille : LAN (local) < MAN (ville) < WAN (monde). Internet = le plus grand WAN</pre>`,

    { type: "vf", q: "Internet est le plus grand réseau étendu (WAN) du monde.", a: true, exp: "Oui : Internet interconnecte des milliards de machines à l'échelle mondiale." },
    { type: "qcm", q: "Comment appelle-t-on le composant matériel qui branche une machine au réseau ?", opts: ["La carte réseau (NIC)", "Le disque dur", "Le connecteur RJ45", "Le modem"], a: 0, exp: "La carte réseau (NIC, Network Interface Card) connecte l'hôte au réseau." },
    { type: "vf", q: "Une même machine peut être cliente pour un service et serveuse pour un autre.", a: true, exp: "Oui : les rôles client et serveur dépendent du service, pas de la machine." },

    { type: "qcm", q: "Le plus petit réseau possible, c'est…", opts: ["Un million d'ordinateurs", "Deux ordinateurs reliés entre eux", "Un seul ordinateur", "Une box seule, sans aucun appareil relié"], a: 1, exp: "Il faut au moins deux appareils reliés pour parler de réseau." },
    { type: "qcm", q: "Ton Wi-Fi domestique correspond à quel type de réseau ?", opts: ["Un WAN", "Un MAN", "Un LAN", "Aucun réseau"], a: 2, exp: "Le Wi-Fi de la maison couvre une petite zone : c'est un LAN." },
    { type: "vf", q: "Tous les réseaux informatiques sont forcément connectés à Internet.", a: false, exp: "Non : beaucoup de réseaux privés sont volontairement isolés d'Internet." }
  ],
  final: {
    title: "Exercice final — Le réseau de la petite entreprise",
    intro: `<p>Dans les bureaux de « Bois &amp; Co », dix ordinateurs et une imprimante sont reliés par des câbles à un même boîtier, et ce boîtier est branché à une box qui donne accès à Internet. Analysons cette installation.</p>`,
    questions: [
      { type: "qcm", q: "Les dix ordinateurs et l'imprimante d'un même bureau forment quel type de réseau ?", opts: ["Un WAN", "Un LAN", "Un MAN", "Aucun"], a: 1, exp: "Une seule zone (le bureau) reliée localement : c'est un LAN." },
      { type: "input", q: "Le boîtier qui relie entre eux les appareils du bureau s'appelle un… (un mot)", a: ["switch", "commutateur", "un switch", "un commutateur"], ph: "un mot", exp: "Le switch (commutateur) relie les machines d'un même LAN." },
      { type: "qcm", q: "Pour sortir du bureau et atteindre Internet, les données passent par…", opts: ["Un simple câble sans équipement", "Un routeur (dans la box) qui relie le LAN à Internet", "Le switch du bureau", "La carte réseau du PC"], a: 1, exp: "La box contient un routeur qui relie le LAN au WAN qu'est Internet." },
      { type: "vf", q: "L'imprimante partagée est une ressource commune du réseau.", a: true, exp: "Oui : partager une imprimante est un usage typique d'un réseau." },
      { type: "qcm", q: "Quand un PC réclame une page web, il joue le rôle de…", opts: ["Serveur", "Client", "Routeur", "Switch"], a: 1, exp: "La machine qui demande le service est le client." }
    ],
    solution: `<pre class="pseudo"># L'installation de Bois &amp; Co, nommee correctement :
Les 10 PC + imprimante           -> un LAN (reseau local du bureau)
Le boitier qui les relie         -> un switch (commutateur)
La box qui ouvre vers Internet   -> contient un routeur (LAN vers WAN)
Un PC qui demande une page web   -> joue le role de CLIENT</pre>
<p>Tu sais désormais décrire un réseau réel avec les bons mots. Demain : d'où vient Internet, et comment il est né.</p>`
  }
};
