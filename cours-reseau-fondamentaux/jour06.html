var DAY = {
  num: 6,
  title: "Le modèle OSI et ses 7 couches",
  subtitle: "La carte de référence universelle pour comprendre un réseau.",
  theory: `
<h3>1. D'où vient le modèle OSI</h3>
<p>À la fin des années 1970, chaque constructeur avait son propre réseau incompatible avec les autres. Pour mettre de l'ordre, une organisation internationale de normalisation, l'<strong>ISO</strong> (« International Organization for Standardization »), publie en <strong>1984</strong> le modèle <strong>OSI</strong> (« Open Systems Interconnection », interconnexion de systèmes ouverts). Ce n'est pas un logiciel : c'est un <strong>modèle de référence théorique</strong> en <strong>7 couches</strong>, une carte commune pour décrire et comparer tous les réseaux.</p>
<h3>2. Les 7 couches, de bas en haut</h3>
<p>Le modèle empile 7 couches. On les numérote de 1 (en bas, le plus proche du matériel) à 7 (en haut, le plus proche de l'utilisateur).</p>
<pre class="pseudo"># Le modele OSI, de la couche 7 (haut) a la couche 1 (bas)
7  Application   -> le service vu par l'utilisateur (Web, mail...)
6  Presentation  -> mise en forme, encodage, chiffrement
5  Session       -> ouvre, maintient et ferme le dialogue
4  Transport     -> decoupe en segments, fiabilite, ports
3  Reseau        -> adressage logique (IP) et routage
2  Liaison       -> adressage physique local (MAC), trames
1  Physique      -> signaux, cables, ondes, tension, bits</pre>
<h3>3. Un moyen mnémotechnique</h3>
<p>Pour retenir l'ordre, du bas vers le haut, on peut mémoriser les initiales <strong>P-L-R-T-S-P-A</strong> : <strong>P</strong>hysique, <strong>L</strong>iaison, <strong>R</strong>éseau, <strong>T</strong>ransport, <strong>S</strong>ession, <strong>P</strong>résentation, <strong>A</strong>pplication. Beaucoup découpent le modèle en deux groupes : les couches <strong>1 à 4</strong> (dites « basses » ou couches de transport des données) et les couches <strong>5 à 7</strong> (dites « hautes » ou couches applicatives, plus proches de l'utilisateur).</p>
<div class="tip">Astuce : les couches <strong>basses (1-4)</strong> s'occupent d'<em>acheminer</em> les données correctement ; les couches <strong>hautes (5-7)</strong> s'occupent de ce que l'<em>application</em> en fait. Retiens l'ordre P-L-R-T-S-P-A.</div>
<h3>4. À quoi sert vraiment ce modèle ?</h3>
<p>Le modèle OSI est avant tout un <strong>outil pédagogique et de diagnostic</strong>. Dans la réalité, Internet utilise plutôt le modèle <strong>TCP/IP</strong>, plus simple (4 couches), que nous verrons plus tard. Mais OSI reste la référence universelle pour <strong>situer un problème</strong> : « c'est un souci de couche 1 » (câble débranché) est très différent de « c'est un souci de couche 7 » (bug de l'application). Parler en numéros de couche est un langage commun à tous les professionnels du réseau.</p>
<div class="warn">Le modèle OSI décrit une organisation <strong>idéale</strong>. Les protocoles réels ne collent pas toujours parfaitement à une seule couche. OSI sert à comprendre et à discuter, pas à décrire au millimètre chaque logiciel.</div>
<h3>5. Le sens de circulation</h3>
<p>Quand tu envoies des données, elles <strong>descendent</strong> de la couche 7 vers la couche 1 sur ta machine, traversent le réseau, puis <strong>remontent</strong> de la couche 1 vers la couche 7 chez le destinataire. À la descente, chaque couche ajoute ses informations ; à la montée, chaque couche les retire. Ce mécanisme — l'encapsulation — fera l'objet du dernier cours. Pour aujourd'hui, retiens la carte : 7 couches, dans l'ordre, avec leur grand rôle.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># OSI : modele de reference de l'ISO (1984), 7 couches
# De 1 (bas, materiel) a 7 (haut, utilisateur) :

# Moyen mnemo (bas->haut) : P-L-R-T-S-P-A
# Couches basses 1-4 = acheminer ; couches hautes 5-7 = applicatif
# OSI = outil pedagogique et de diagnostic (Internet reel utilise TCP/IP)</pre>`,

    { type: "vf", q: "Dans OSI, la couche Réseau est juste au-dessus de la couche Liaison.", a: true, exp: "Oui : ordre 1 Physique, 2 Liaison, 3 Réseau, 4 Transport." },

    { type: "vf", q: "Le modèle OSI est un logiciel qu'on installe sur les ordinateurs.", a: false, exp: "Non : c'est un modèle de référence théorique, pas un logiciel." },
    { type: "qcm", q: "En pratique, quel modèle plus simple Internet utilise-t-il réellement ?", opts: ["Le modèle OSI à 7 couches", "Le modèle TCP/IP (plus simple)", "Le modèle USB", "Aucun modèle"], a: 1, exp: "Internet repose surtout sur TCP/IP ; OSI reste la référence pédagogique." },
    { type: "input", q: "Donne le moyen mnémotechnique des initiales des 7 couches, de bas en haut (7 lettres séparées ou collées).", a: ["plrtspa", "p-l-r-t-s-p-a", "p l r t s p a"], ph: "7 initiales", exp: "P-L-R-T-S-P-A : Physique, Liaison, Réseau, Transport, Session, Présentation, Application." },
    { type: "qcm", q: "« C'est un problème de couche 1 » signifie le plus probablement…", opts: ["Un bug de l'application", "Un souci physique (câble débranché, signal absent)", "Une erreur de mot de passe", "Un problème de mise en forme"], a: 1, exp: "La couche 1 Physique concerne câbles, signaux et connexions matérielles." },
    { type: "qcm", q: "Quelle couche gère l'ouverture, le maintien et la fermeture du dialogue entre deux applications ?", opts: ["Session (5)", "Physique (1)", "Liaison (2)", "Réseau (3)"], a: 0, exp: "La couche 5 Session gère l'établissement et la fin du dialogue." },
    { type: "vf", q: "À l'envoi, les données descendent de la couche 7 vers la couche 1, puis remontent de 1 vers 7 chez le destinataire.", a: true, exp: "Oui : descente à l'émission, montée à la réception." }
  ],

    intro: `<p>Un technicien réseau reçoit plusieurs plaintes. Pour chacune, il veut dire « c'est plutôt une couche basse ou haute » et nommer la couche concernée. Aide-le à raisonner avec le modèle OSI.</p>`,

      { type: "vf", q: "Un problème de câble (couche 1) et un bug d'application (couche 7) sont des problèmes de nature très différente.", a: true, exp: "Oui : parler en numéros de couche aide à séparer les causes." },
      { type: "qcm", q: "Pourquoi le modèle OSI est-il utile au technicien ?", opts: ["Parce qu'il chiffre automatiquement les données", "Parce qu'il fournit un langage commun pour situer et discuter un problème", "Parce qu'il attribue lui-même les adresses IP", "Parce qu'il n'a qu'une seule couche"], a: 1, exp: "OSI est un outil de diagnostic et un langage commun entre professionnels." }
