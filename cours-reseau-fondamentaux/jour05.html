<script>
var DAY = {
  num: 5,
  title: "Le modèle en couches : l'idée fondatrice",
  subtitle: "Diviser un problème énorme en étages simples et indépendants.",
  theory: `
<h3>1. Diviser pour régner</h3>
<p>Faire communiquer deux ordinateurs implique de résoudre des dizaines de problèmes très différents : produire des signaux électriques, trouver la bonne machine, découper les données, afficher une page… Tout traiter d'un bloc serait ingérable. La solution, adoptée par tous les réseaux modernes, est le <strong>modèle en couches</strong> (en anglais <em>layered model</em>) : on empile des <strong>couches</strong> (<em>layers</em>), chacune responsable d'<strong>un seul type de tâche</strong>. C'est la stratégie « diviser pour régner ».</p>
<h3>2. L'analogie de la lettre postale</h3>
<p>Pour envoyer une lettre, plusieurs acteurs se succèdent, chacun avec un rôle précis. Toi, tu écris le contenu. L'enveloppe et l'adresse, c'est une autre étape. Le facteur qui relève la boîte, le centre de tri, le camion, l'avion : chacun ne connaît que sa tâche. Le camionneur n'a pas besoin de lire ta lettre ; il transporte juste des sacs. À l'arrivée, tout se déroule en sens inverse. Un réseau fonctionne pareil : chaque couche accomplit sa mission sans se soucier du contenu des autres.</p>
<pre class="pseudo"># Analogie postale
Toi (contenu)        <-> couche haute : le message a transmettre
Enveloppe + adresse  <-> couche du milieu : comment router
Camion / avion       <-> couche basse : le transport physique
# Chaque acteur ignore le detail du travail des autres.</pre>
<h3>3. La règle d'or : chaque couche parle à sa jumelle</h3>
<p>Le principe clé : la couche N d'une machine <strong>dialogue logiquement avec la couche N de l'autre machine</strong>, comme si elles étaient reliées en direct. C'est ce qu'on appelle une <strong>communication de pair à pair entre couches</strong> (<em>peer layers</em>). En réalité, les données descendent toutes les couches de l'émetteur, traversent le câble, puis remontent toutes les couches du récepteur ; mais chaque couche a l'<em>illusion</em> de parler directement à son homologue. L'enveloppe écrite par l'expéditeur n'est ouverte que par le service courrier du destinataire, pas par les camionneurs.</p>
<h3>4. Interfaces et services : le contrat entre couches</h3>
<p>Deux couches voisines communiquent par une <strong>interface</strong> bien définie : la couche du dessous rend un <strong>service</strong> à celle du dessus. La couche du dessus n'a pas besoin de savoir <em>comment</em> le service est réalisé, seulement <em>ce qu'</em>il fait. On dit que les détails sont <strong>encapsulés</strong>, c'est-à-dire cachés. Ainsi, on peut changer complètement une couche (passer du câble à la fibre, du Wi-Fi à la 5G) sans toucher aux couches du dessus : c'est le grand avantage du modèle.</p>
<div class="tip">Grâce aux couches indépendantes, remplacer le Wi-Fi par un câble ne change rien pour ton navigateur. La couche haute (le Web) ignore tout de la couche basse (le support physique). C'est la <strong>modularité</strong>.</div>
<h3>5. Pourquoi c'est si puissant</h3>
<p>Le découpage en couches apporte trois bénéfices majeurs. La <strong>simplicité</strong> : chaque couche est un petit problème indépendant. La <strong>modularité</strong> : on remplace une couche sans casser les autres. L'<strong>interopérabilité</strong> : des équipements de fabricants différents coopèrent, du moment qu'ils respectent les mêmes interfaces. C'est cette idée, formalisée dans les années 1970-1980, qui a permis à Internet de grandir à l'échelle mondiale.</p>
<div class="warn">Une couche ne doit pas « sauter » par-dessus ses voisines. La couche 4 parle à la couche 3, qui parle à la couche 2… On ne saute pas d'étage : chaque niveau s'appuie uniquement sur celui juste en dessous.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Modele en couches = diviser un gros probleme en etages specialises
# Chaque couche N parle logiquement a la couche N d'en face (pair a pair)
# Couche du dessous rend un SERVICE a celle du dessus via une INTERFACE
# Details caches (encapsules) -> on change une couche sans toucher aux autres
# Benefices : simplicite, modularite, interoperabilite</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est l'idée centrale du modèle en couches ?", opts: ["Tout traiter d'un seul bloc", "Diviser un gros problème en couches spécialisées empilées", "Supprimer les protocoles", "Utiliser un seul câble"], a: 1, exp: "On divise pour régner : chaque couche gère un seul type de tâche." },
    { type: "input", q: "Comment appelle-t-on chaque étage d'un modèle en couches ? (un mot au singulier)", a: ["couche", "une couche", "layer"], ph: "un mot", exp: "Chaque étage est une couche (layer)." },
    { type: "vf", q: "Dans le modèle en couches, la couche N d'une machine dialogue logiquement avec la couche N de l'autre machine.", a: true, exp: "Oui : c'est la communication de pair à pair entre couches homologues." },
    { type: "qcm", q: "Dans l'analogie postale, le camionneur qui transporte les sacs correspond à…", opts: ["La couche haute (le contenu)", "Une couche basse (le transport physique)", "L'adresse sur l'enveloppe", "La signature"], a: 1, exp: "Le camion assure le transport physique, comme la couche basse." },
    { type: "qcm", q: "Comment deux couches voisines communiquent-elles ?", opts: ["Par une interface, où la couche du dessous rend un service à celle du dessus", "En se court-circuitant", "Sans aucune règle", "En sautant directement deux couches plus bas"], a: 0, exp: "Une interface définit le service rendu d'une couche à sa voisine du dessus." },
    { type: "vf", q: "La couche du dessus doit connaître en détail comment la couche du dessous réalise son travail.", a: false, exp: "Non : les détails sont cachés (encapsulés) ; elle connaît seulement le service rendu." },
    { type: "qcm", q: "Quel avantage permet de remplacer le Wi-Fi par un câble sans toucher au navigateur ?", opts: ["L'encapsulation des données", "La modularité des couches indépendantes", "L'absence de protocole", "L'interopérabilité des fabricants"], a: 1, exp: "Les couches indépendantes rendent le système modulaire." },
    { type: "input", q: "Comment appelle-t-on le fait de cacher les détails internes d'une couche aux autres couches ? (un mot)", a: ["encapsulation", "l'encapsulation", "encapsuler"], ph: "un mot", exp: "Cacher les détails, c'est les encapsuler." },
    { type: "qcm", q: "Lequel de ces trois bénéfices n'est PAS un avantage du modèle en couches ?", opts: ["La simplicité", "La modularité", "L'interopérabilité", "La lenteur volontaire"], a: 3, exp: "Simplicité, modularité et interopérabilité sont les trois vrais avantages." },
    { type: "vf", q: "Une couche peut sauter par-dessus sa voisine et parler directement à une couche deux étages plus bas.", a: false, exp: "Non : chaque couche s'appuie uniquement sur celle juste en dessous." },
    { type: "qcm", q: "Que signifie « interopérabilité » ?", opts: ["Des équipements de fabricants différents coopèrent s'ils respectent les mêmes interfaces", "Tout doit venir du même fabricant", "Les couches ne communiquent pas", "Le réseau est plus lent"], a: 0, exp: "L'interopérabilité permet à des matériels différents de coopérer via des interfaces communes." },
    { type: "input", q: "Comment appelle-t-on la communication logique entre deux couches de même niveau sur deux machines ? (deux mots, ex: « pair à … »)", a: ["pair a pair", "pair-a-pair", "de pair a pair", "peer to peer", "pair a pair entre couches"], ph: "quelques mots", exp: "Chaque couche dialogue avec son homologue de pair à pair." },
    { type: "qcm", q: "Pourquoi ne pas concevoir un seul protocole géant qui ferait tout ?", opts: ["Parce que ce serait ingérable et impossible à maintenir", "Parce qu'il consommerait trop de mémoire vive", "Parce qu'il ne pourrait relier que deux machines", "Parce qu'il n'accepterait pas la fibre optique"], a: 0, exp: "Un bloc unique serait ingérable ; le découpage en couches simplifie tout." },
    { type: "vf", q: "Le modèle en couches a été formalisé dans les années 1970-1980.", a: true, exp: "Oui : c'est à cette époque qu'ont été définis les grands modèles en couches." },
    { type: "qcm", q: "Dans l'analogie postale, qui « ouvre l'enveloppe » écrite par l'expéditeur ?", opts: ["Chaque camionneur en route", "Seulement le service courrier du destinataire (couche homologue)", "Tout le monde", "Personne"], a: 1, exp: "Seule la couche homologue du destinataire traite l'enveloppe : les couches de transport l'ignorent." }
  ],
  final: {
    title: "Exercice final — L'entreprise de livraison comme modèle en couches",
    intro: `<p>Une entreprise expédie un colis : le vendeur emballe l'objet, le service expédition met l'étiquette d'adresse, le transporteur charge le camion. À l'arrivée, tout se déroule à l'envers. Voyons ce que cela nous apprend sur les couches.</p>`,
    questions: [
      { type: "qcm", q: "Chaque service (vendeur, expédition, transport) illustre…", opts: ["Une couche spécialisée qui ignore le détail des autres", "Un seul acteur qui fait tout", "Une couche qui connaît le détail de toutes les autres", "Un acteur qui supervise l'ensemble de la chaîne"], a: 0, exp: "Chaque service = une couche avec une tâche précise et indépendante." },
      { type: "vf", q: "Le service expédition (étiquette d'adresse) dialogue logiquement avec le service réception d'en face, sa couche homologue.", a: true, exp: "Oui : couche N parle à couche N, de pair à pair." },
      { type: "qcm", q: "Si l'entreprise change de transporteur (camion → train), que doivent faire les autres services ?", opts: ["Tout refaire", "Rien : la modularité isole la couche transport", "Adapter aussi le service expédition", "Réécrire l'étiquette de chaque colis"], a: 1, exp: "Grâce à la modularité, changer la couche basse n'affecte pas les autres." },
      { type: "input", q: "Comment appelle-t-on le fait que le transporteur n'ait pas à connaître le contenu du colis ? (un mot)", a: ["encapsulation", "l'encapsulation", "encapsuler"], ph: "un mot", exp: "Le contenu est encapsulé : caché aux couches de transport." },
      { type: "qcm", q: "Le principal enseignement de cette analogie est que…", opts: ["Les couches doivent tout partager", "Chaque couche gère une tâche et coopère via des interfaces claires", "Un seul acteur suffit", "Les protocoles sont inutiles"], a: 1, exp: "Couches spécialisées + interfaces claires = système simple, modulaire, interopérable." }
    ],
    solution: `<pre class="pseudo"># L'entreprise de livraison, vue en couches :
Vendeur (contenu)     -> couche haute : l'objet a livrer
Expedition (adresse)  -> couche du milieu : ou et comment router
Transporteur (camion) -> couche basse : le deplacement physique
# Regles retenues :
# - chaque service = une couche specialisee
# - couche N dialogue avec couche N d'en face (pair a pair)
# - details caches (encapsulation) -> on change une couche sans casser les autres</pre>
<p>Tu maîtrises l'idée fondatrice. Demain, on applique ce principe au modèle de référence le plus célèbre : le modèle OSI et ses 7 couches.</p>`
  }
};
