var DAY = {

  title: "Le problème de la communication : pourquoi des règles ?",
  subtitle: "Sans conventions communes, deux machines ne peuvent pas se comprendre.",
  theory: `
<h3>1. Communiquer, c'est se mettre d'accord</h3>
<p>Imagine deux personnes qui veulent parler mais qui ne partagent aucune langue commune. Elles ont beau crier, rien ne passe. Pour deux ordinateurs, c'est pareil : envoyer des signaux ne suffit pas, encore faut-il que l'émetteur et le récepteur soient <strong>d'accord sur des règles</strong> : quelle langue, dans quel ordre parler, comment vérifier qu'on a bien compris, comment signaler une erreur. L'ensemble de ces règles s'appelle un <strong>protocole</strong>.</p>
<h3>2. La définition d'un protocole</h3>
<p>Un <strong>protocole</strong> (en anglais <em>protocol</em>) est un <strong>ensemble de règles précises qui définissent comment deux machines échangent des informations</strong>. Un protocole fixe notamment : le <strong>format</strong> des messages (leur structure), la <strong>syntaxe</strong> (l'ordre et le sens des éléments), la <strong>chronologie</strong> (qui parle quand), et la <strong>gestion des erreurs</strong> (que faire si un message est perdu ou abîmé). Le mot « protocole » existait déjà en diplomatie : c'est le code de bonne conduite d'une rencontre officielle. En réseau, c'est le code de bonne conduite d'un échange de données.</p>
<pre class="pseudo"># Un protocole definit AU MOINS :
Format / syntaxe  -> a quoi ressemble un message, ordre des champs
Semantique        -> ce que signifie chaque partie du message
Chronologie       -> qui parle en premier, qui attend, delais
Gestion d'erreurs -> detecter, signaler et corriger les problemes</pre>
<h3>3. Une analogie : la conversation téléphonique</h3>
<p>Quand tu appelles quelqu'un, vous suivez un protocole implicite. Tu attends la tonalité (le canal est prêt), la personne décroche et dit « Allô ? » (établissement du contact), vous parlez à tour de rôle (chacun son tour), si tu n'entends pas tu dis « Peux-tu répéter ? » (correction d'erreur), puis vous dites « au revoir » avant de raccrocher (fin propre). Un protocole réseau formalise exactement ce genre d'étapes, mais entre machines et sans ambiguïté.</p>
<div class="tip">Un bon protocole ne laisse aucune place à l'interprétation. Là où deux humains « devinent » le sens, deux machines exigent des règles écrites au bit près, identiques des deux côtés.</div>
<h3>4. Pourquoi PLUSIEURS protocoles ?</h3>
<p>Une communication réseau doit résoudre beaucoup de problèmes très différents : transformer des données en signaux électriques, trouver la bonne machine parmi des milliards, découper et réordonner les paquets, présenter une page web… Un seul énorme protocole qui ferait tout serait ingérable. On préfère donc <strong>plusieurs protocoles spécialisés</strong>, chacun résolvant un problème précis, et qui coopèrent. Par exemple, sur le Web, <strong>HTTP</strong> transporte les pages, <strong>IP</strong> gère l'adressage, <strong>TCP</strong> garantit la livraison. Chacun a son rôle.</p>
<div class="warn">Deux machines qui ne « parlent » pas le même protocole ne peuvent pas communiquer, même si le câble est parfait. Le matériel ne suffit jamais : il faut aussi l'accord sur les règles.</div>
<h3>5. Vers l'idée des couches</h3>
<p>Comme les problèmes sont nombreux et empilés (du signal électrique jusqu'à l'application), on organise les protocoles en <strong>niveaux</strong> qui se superposent. Chaque niveau s'appuie sur celui du dessous et rend service à celui du dessus. Cette idée d'empilement — que nous verrons demain — s'appelle le <strong>modèle en couches</strong>. Retiens aujourd'hui l'essentiel : sans règles communes, pas de communication ; ces règles, ce sont les protocoles.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Communiquer = se mettre d'accord sur des regles communes
# Protocole = ensemble de regles : format, sens, chronologie, erreurs
# Un seul protocole geant serait ingerable -> plusieurs protocoles specialises
# Meme cable parfait : sans protocole commun, aucune communication
# Les protocoles s'empilent en niveaux -> le modele en couches (demain)</pre>`,

    { type: "vf", q: "Un bon protocole laisse une grande place à l'interprétation par chaque machine.", a: false, exp: "Non : un bon protocole est précis et ne laisse aucune ambiguïté." },
    { type: "qcm", q: "Comment appelle-t-on l'organisation des protocoles en niveaux superposés ?", opts: ["Le modèle en couches", "Le modèle en cercle", "Le modèle en étoile", "Le modèle plat"], a: 0, exp: "Les protocoles s'empilent en niveaux : c'est le modèle en couches." },
    { type: "input", q: "Vrai synonyme : quel autre mot désigne « l'ordre et le sens des éléments » d'un message dans un protocole ? (commence par S)", a: ["syntaxe", "la syntaxe"], ph: "un mot", exp: "La syntaxe décrit la structure et l'ordre des éléments d'un message." }
  ],

    intro: `<p>On relie par un câble parfait deux robots, Alpha et Beta. Alpha envoie ses messages en commençant par la fin, Beta les lit en commençant par le début, et aucun ne confirme la réception. Rien ne fonctionne. Diagnostiquons.</p>`,

      { type: "vf", q: "« Aucun ne confirme la réception » révèle un problème de gestion des erreurs.", a: true, exp: "Oui : sans accusé de réception, on ne peut pas détecter ni corriger les pertes." },

    solution: `<pre class="pseudo"># Diagnostic : le cable est parfait, le probleme est ailleurs.

Format / syntaxe  -> lire les messages dans le meme sens
Chronologie       -> qui parle, qui attend, dans quel ordre

<p>Tu tiens l'idée centrale du réseau : communiquer, c'est d'abord s'accorder sur des règles. Demain : comment on organise intelligemment ces règles en couches.</p>`
