<script>
var DAY = {
  num: 15,
  title: "Les topologies physiques",
  subtitle: "Bus, étoile, anneau : trois façons de relier les machines.",
  theory: `
<h3>1. Qu'est-ce qu'une topologie ?</h3>
<p>La <strong>topologie physique</strong> (en anglais <em>physical topology</em>) décrit la <strong>façon dont les câbles relient physiquement les machines</strong> d'un réseau : le plan de câblage, le dessin des liaisons. C'est le squelette du réseau. Trois formes historiques dominent : le <strong>bus</strong>, l'<strong>étoile</strong> et l'<strong>anneau</strong>.</p>
<div class="tip">Attention à distinguer topologie <strong>physique</strong> (comment les câbles sont posés) et topologie <strong>logique</strong> (comment les données circulent). Les deux peuvent différer : un réseau câblé en étoile peut fonctionner logiquement comme un bus.</div>
<h3>2. La topologie en bus</h3>
<p>Toutes les machines sont branchées sur un <strong>seul câble principal</strong> (le « bus »), comme des maisons le long d'une même route. Chaque extrémité du câble porte un <strong>bouchon de terminaison</strong> pour éviter que le signal ne rebondisse.</p>
<pre class="pseudo"># Topologie en BUS
[PC]---[PC]---[PC]---[PC]
 |______un seul cable partage______|
(un bouchon a chaque extremite)</pre>
<p><strong>Avantage :</strong> simple, peu de câble. <strong>Défaut majeur :</strong> si le câble central est coupé, <strong>tout le réseau tombe</strong>. De plus, les machines se partagent le câble : plus il y a de trafic, plus il y a de collisions.</p>
<h3>3. La topologie en étoile</h3>
<p>Chaque machine possède <strong>son propre câble</strong> qui la relie à un <strong>équipement central</strong> (aujourd'hui un <strong>switch</strong>, autrefois un hub). C'est la forme dominante des réseaux actuels.</p>
<pre class="pseudo"># Topologie en ETOILE
        [Switch central]
        /    |    |    \\
     [PC]  [PC]  [PC]  [PC]
(chaque machine a son propre cable)</pre>
<p><strong>Avantage :</strong> si un câble ou une machine tombe, <strong>les autres continuent</strong> ; facile à dépanner et à étendre. <strong>Défaut :</strong> si l'équipement central tombe, tout le réseau s'arrête (point unique de défaillance), et il faut plus de câble.</p>
<h3>4. La topologie en anneau</h3>
<p>Les machines sont reliées <strong>en boucle fermée</strong> : chacune est connectée à la suivante, la dernière revenant à la première. Les données circulent de proche en proche, souvent dans un seul sens, en passant par un « jeton » (technologie <em>Token Ring</em>).</p>
<pre class="pseudo"># Topologie en ANNEAU
   [PC]---[PC]
    |         |
   [PC]---[PC]
(boucle fermee : le signal circule de machine en machine)</pre>
<p><strong>Avantage :</strong> pas de collisions grâce au jeton qui donne la parole à tour de rôle. <strong>Défaut :</strong> une machine ou un lien défaillant peut couper la boucle et paralyser le réseau.</p>
<h3>5. Comparaison rapide</h3>
<pre class="pseudo"># Resume
BUS    : un cable partage | peu de cable | rupture = tout tombe
ETOILE : cables vers un central (switch) | robuste | central = point critique
ANNEAU : boucle fermee | jeton, pas de collision | rupture = panne</pre>
<div class="warn">Le bus et l'anneau sont surtout <strong>historiques</strong>. Les réseaux modernes utilisent quasi exclusivement l'<strong>étoile</strong> autour d'un switch. On les étudie pour comprendre l'évolution et parce qu'ils reviennent sous forme de schémas.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Topologie physique = plan de cablage du reseau
BUS    : un seul cable, bouchons aux extremites
ETOILE : un equipement central (switch), un cable par machine
ANNEAU : boucle fermee, circulation avec jeton
Physique (cables) != logique (circulation des donnees)</pre>`,
  exercises: [
    { type: "qcm", q: "Que décrit une topologie physique ?", opts: ["La façon dont les données circulent logiquement", "La façon dont les câbles relient les machines", "Le débit maximal", "Le protocole de routage utilisé"], a: 1, exp: "La topologie physique est le plan de câblage, la forme des liaisons." },
    { type: "qcm", q: "Dans une topologie en bus, les machines sont reliées…", opts: ["À un switch central", "Sur un seul câble partagé", "En boucle fermée", "Sans aucun câble"], a: 1, exp: "Le bus relie tout le monde sur un unique câble commun." },
    { type: "vf", q: "En topologie en bus, couper le câble principal fait tomber tout le réseau.", a: true, exp: "Oui : le câble unique est un point de faiblesse majeur du bus." },
    { type: "input", q: "Comment appelle-t-on l'équipement central d'une topologie en étoile aujourd'hui ? (un mot)", a: ["switch", "commutateur", "un switch", "le switch"], ph: "un mot", exp: "Le switch (commutateur) est au centre de l'étoile moderne." },
    { type: "qcm", q: "Quel avantage a l'étoile si un câble de poste se coupe ?", opts: ["Tout le réseau tombe", "Seule cette machine est isolée, les autres continuent", "Le débit double", "Les bouchons sautent"], a: 1, exp: "En étoile, une panne de câble n'isole que la machine concernée." },
    { type: "input", q: "Quelle topologie relie les machines en boucle fermée ? (un mot)", a: ["anneau", "l'anneau", "en anneau", "ring"], ph: "un mot", exp: "L'anneau (ring) forme une boucle : chaque machine reliée à la suivante." },
    { type: "qcm", q: "Qu'y a-t-il à chaque extrémité d'une topologie en bus ?", opts: ["Un switch", "Un bouchon de terminaison", "Une antenne", "Un serveur"], a: 1, exp: "Un bouchon de terminaison évite que le signal ne rebondisse aux extrémités." },
    { type: "vf", q: "La topologie en étoile est la forme dominante des réseaux modernes.", a: true, exp: "Oui : quasi tous les réseaux actuels sont câblés en étoile autour d'un switch." },
    { type: "qcm", q: "Dans l'anneau Token Ring, comment évite-t-on les collisions ?", opts: ["Avec des bouchons", "Grâce à un jeton qui donne la parole à tour de rôle", "En doublant les câbles", "On ne les évite pas"], a: 1, exp: "Le jeton circule et donne le droit d'émettre : pas de collision." },
    { type: "input", q: "En topologie en étoile, quel élément est un point unique de défaillance ? (un mot)", a: ["switch", "le switch", "l'equipement central", "central", "commutateur", "equipement central"], ph: "un mot", exp: "Si l'équipement central (switch) tombe, tout le réseau s'arrête." },
    { type: "vf", q: "Le bus et l'anneau sont les topologies les plus utilisées dans les réseaux d'aujourd'hui.", a: false, exp: "Non : ce sont surtout des topologies historiques ; l'étoile domine aujourd'hui." },
    { type: "qcm", q: "Un inconvénient de la topologie en étoile ?", opts: ["Impossible à dépanner", "Elle demande plus de câble et dépend de l'équipement central", "Elle provoque toujours des collisions", "Elle ne supporte qu'une machine"], a: 1, exp: "L'étoile consomme plus de câble et dépend du switch central." },
    { type: "input", q: "Comment distingue-t-on la topologie « physique » de la topologie « … » (celle de la circulation des données) ?", a: ["logique", "topologie logique", "la logique"], ph: "un mot", exp: "La topologie logique décrit comment les données circulent, indépendamment du câblage." },
    { type: "qcm", q: "Quel est l'atout principal de la topologie en bus ?", opts: ["Ultra robuste", "Simple et économe en câble", "Aucune limite de machines", "Immunisée aux pannes"], a: 1, exp: "Le bus est simple et utilise peu de câble, mais reste fragile." },
    { type: "qcm", q: "Dans une topologie en anneau, une rupture de la boucle…", opts: ["N'a aucun effet", "Peut paralyser le réseau", "Augmente le débit", "Ajoute un bouchon"], a: 1, exp: "Une coupure de la boucle interrompt la circulation et peut tout arrêter." }
  ],
  final: {
    title: "Exercice final — Lire trois schémas de réseau",
    intro: `<p>Un formateur montre trois plans de câblage à ses stagiaires : (A) toutes les machines sur un même câble avec un bouchon à chaque bout ; (B) chaque machine reliée à un boîtier central ; (C) les machines formant une boucle fermée. On les identifie.</p>`,
    questions: [
      { type: "input", q: "Le schéma A (un seul câble partagé, bouchons aux extrémités) est une topologie en… (un mot)", a: ["bus", "en bus", "le bus"], ph: "un mot", exp: "Un câble unique partagé avec bouchons = topologie en bus." },
      { type: "input", q: "Le schéma B (chaque machine vers un boîtier central) est une topologie en… (un mot)", a: ["etoile", "étoile", "en etoile", "star"], ph: "un mot", exp: "Machines reliées à un central = topologie en étoile." },
      { type: "input", q: "Le schéma C (boucle fermée) est une topologie en… (un mot)", a: ["anneau", "en anneau", "ring"], ph: "un mot", exp: "Boucle fermée = topologie en anneau." },
      { type: "qcm", q: "Dans le schéma A, que se passe-t-il si on coupe le câble au milieu ?", opts: ["Rien", "Tout le réseau tombe", "Seule une machine tombe", "Le débit double"], a: 1, exp: "En bus, couper le câble central fait tomber tout le réseau." },
      { type: "qcm", q: "Lequel de ces trois schémas correspond aux réseaux modernes ?", opts: ["A (bus)", "B (étoile)", "C (anneau)", "Aucun"], a: 1, exp: "L'étoile (B) autour d'un switch est la norme actuelle." }
    ],
    solution: `<pre class="pseudo"># Identification des schemas
A : un cable partage + bouchons -> BUS   (rupture = tout tombe)
B : chaque machine -> central   -> ETOILE (forme moderne, switch)
C : boucle fermee               -> ANNEAU (jeton, Token Ring)
# Physique = cablage ; a distinguer de la topologie logique.</pre>
<p>Tu sais désormais reconnaître les trois topologies. Demain : comment CHOISIR la bonne, et pourquoi l'étoile a gagné.</p>`
  }
};
