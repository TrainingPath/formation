  subtitle: "Le vétéran du réseau, toujours dans ta box TV.",
  theory: `
<h3>1. Qu'est-ce qu'un câble coaxial ?</h3>
<p>Le <strong>câble coaxial</strong> (en anglais <em>coaxial cable</em>, souvent « coax ») est un câble en cuivre construit en couches concentriques, d'où son nom : tout tourne autour d'un même axe. C'est l'un des plus anciens supports de réseau, longtemps utilisé pour l'Ethernet, et toujours présent aujourd'hui pour la télévision et l'accès Internet par le câble.</p>
<h3>2. Sa structure en couches</h3>
<p>De l'intérieur vers l'extérieur, on trouve quatre éléments :</p>
<pre class="pseudo"># Coupe d'un cable coaxial (de l'axe vers l'exterieur)
1. Ame centrale  : un conducteur en cuivre (transporte le signal)
2. Isolant       : dielectrique qui separe l'ame du blindage
3. Blindage      : tresse metallique (protege du bruit)
4. Gaine         : enveloppe plastique de protection</pre>
<p>Le <strong>blindage</strong> (en anglais <em>shielding</em>) est la clé : cette tresse métallique entoure le signal et le protège des <strong>interférences électromagnétiques</strong> (en anglais <em>EMI</em>) venues de l'extérieur. C'est ce qui distingue le coaxial d'un simple fil.</p>
<div class="tip">Le mot « coaxial » vient de « co-axial » : l'âme centrale et le blindage partagent le même axe. Cette géométrie régulière est ce qui donne au câble ses bonnes propriétés de transmission.</div>
<h3>3. Ses usages, hier et aujourd'hui</h3>
<p>Dans les années 1980-90, le coaxial servait à câbler les réseaux locaux Ethernet en topologie en bus : deux variantes célèbres, le <strong>10BASE5</strong> (« Thicknet », câble épais et rigide) et le <strong>10BASE2</strong> (« Thinnet », câble fin), tous deux à 10 Mbit/s. Ces réseaux ont été abandonnés au profit de la paire torsadée, plus souple et moins chère.</p>
<pre class="pseudo"># Ethernet coaxial (historique)
10BASE5 "Thicknet" : cable epais, ~500 m par segment
10BASE2 "Thinnet"  : cable fin,   ~185 m par segment
# Debit : 10 Mbit/s dans les deux cas</pre>
<p>Aujourd'hui, on ne câble plus un réseau local en coaxial. Mais on le rencontre partout ailleurs : la <strong>télévision</strong> (prise d'antenne, câble), et surtout l'accès à <strong>Internet par le câble</strong> (technologie DOCSIS des câblo-opérateurs), qui atteint des débits élevés.</p>
<h3>4. Avantages et limites</h3>
<pre class="pseudo"># Avantages
+ Bon blindage : resiste bien aux interferences
+ Porte le signal plus loin qu'une simple paire non blindee
+ Robuste
# Inconvenients
- Rigide et encombrant, difficile a plier/tirer
- Plus cher et moins pratique que la paire torsadee
- Abandonne pour les LAN modernes</pre>
<div class="warn">Ne confonds pas « coaxial » et « fibre optique ». Le coaxial reste un câble en cuivre à signal électrique. La fibre, elle, transporte de la lumière dans du verre : c'est une technologie différente, vue plus loin dans le cours.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Coaxial = cuivre, structure concentrique (co-axiale)
Couches : ame + isolant + blindage (tresse) + gaine
Force   : blindage -> resiste aux interferences (EMI)
Passe   : Ethernet historique (10BASE5, 10BASE2, 10 Mbit/s)
Present : TV et Internet par le cable (DOCSIS)
Limite  : rigide, abandonne pour les LAN modernes</pre>`,

    { type: "qcm", q: "De quel matériau est fait le conducteur d'un câble coaxial ?", opts: ["Verre", "Cuivre", "Plastique", "Aluminium pur"], a: 1, exp: "Le coaxial est un câble cuivre à signal électrique." },
    { type: "input", q: "Comment appelle-t-on la tresse métallique qui protège le signal des interférences ? (un mot)", a: ["blindage", "le blindage", "shielding"], ph: "un mot", exp: "Le blindage (tresse métallique) protège contre les interférences (EMI)." },
    { type: "qcm", q: "Pourquoi dit-on « coaxial » ?", opts: ["Il est très cher", "L'âme et le blindage partagent le même axe", "Il contient deux fibres", "Il change de couleur"], a: 1, exp: "Co-axial : les éléments sont concentriques, autour d'un même axe." },
    { type: "vf", q: "Le câble coaxial transporte un signal électrique, pas de la lumière.", a: true, exp: "Oui : c'est du cuivre. La lumière, c'est la fibre optique." },

    { type: "qcm", q: "Où rencontre-t-on encore couramment du coaxial aujourd'hui ?", opts: ["Dans les LAN d'entreprise modernes", "Pour la TV et l'Internet par câble", "Dans les fibres transatlantiques", "Nulle part"], a: 1, exp: "TV et accès Internet par le câble (DOCSIS) utilisent encore le coaxial." },
    { type: "input", q: "Quel débit offraient les Ethernet coaxiaux historiques 10BASE5 et 10BASE2 ? (avec l'unité)", a: ["10 mbit/s", "10mbit/s", "10 mbps", "10 megabits/s", "10 mb/s"], ph: "ex. … Mbit/s", exp: "Les deux fonctionnaient à 10 Mbit/s." },
    { type: "vf", q: "Le coaxial est plus souple et plus facile à tirer que la paire torsadée.", a: false, exp: "Non : le coaxial est rigide et encombrant ; la paire torsadée est plus souple." },
    { type: "qcm", q: "Le blindage sert principalement à…", opts: ["Augmenter le débit à l'infini", "Protéger le signal des interférences électromagnétiques", "Colorer le câble", "Alimenter les appareils"], a: 1, exp: "Le blindage réduit l'effet des interférences (EMI) sur le signal." },
    { type: "input", q: "Comment surnomme-t-on le câble coaxial épais 10BASE5 ? (un mot anglais)", a: ["thicknet", "thick net"], ph: "un mot", exp: "10BASE5 = « Thicknet » (câble épais)." },
    { type: "vf", q: "On câble encore les réseaux locaux d'entreprise en coaxial de nos jours.", a: false, exp: "Non : les LAN modernes utilisent la paire torsadée ou la fibre." },
    { type: "qcm", q: "Quel est un inconvénient du câble coaxial ?", opts: ["Il n'a aucun blindage", "Il est rigide et encombrant", "Il transporte de la lumière", "Il ne coûte rien"], a: 1, exp: "Sa rigidité et son encombrement l'ont fait délaisser pour les LAN." },
    { type: "input", q: "Quelle couche externe en plastique protège l'ensemble du câble ? (un mot)", a: ["gaine", "la gaine", "gaine plastique"], ph: "un mot", exp: "La gaine est l'enveloppe plastique de protection extérieure." },
    { type: "qcm", q: "Le sigle EMI désigne…", opts: ["Un connecteur", "Les interférences électromagnétiques", "Un débit", "Un système d'exploitation"], a: 1, exp: "EMI = interférences électromagnétiques, contre lesquelles le blindage protège." },
    { type: "qcm", q: "Par quoi le coaxial a-t-il été remplacé pour les réseaux locaux ?", opts: ["Par le hub", "Par la paire torsadée", "Par le signal analogique", "Par le simplex"], a: 1, exp: "La paire torsadée, plus souple et économique, a remplacé le coaxial en LAN." }
  ],
  final: {
    title: "Exercice final — Que faire de cette vieille installation ?",
    intro: `<p>En rénovant un local, une équipe découvre un ancien réseau câblé en coaxial 10BASE2. Elle doit décider quoi en faire et comprendre pourquoi ce câble était là.</p>`,
    questions: [
      { type: "qcm", q: "Ce câble coaxial transporte un signal de quelle nature ?", opts: ["Lumineux", "Électrique", "Radio", "Sonore"], a: 1, exp: "Le coaxial est en cuivre : signal électrique." },
      { type: "input", q: "Quel élément du câble le protégeait des interférences ? (un mot)", a: ["blindage", "le blindage", "la tresse", "tresse"], ph: "un mot", exp: "Le blindage (tresse métallique) filtre les interférences." },
      { type: "qcm", q: "Quel débit offrait ce 10BASE2 ?", opts: ["10 Mbit/s", "100 Mbit/s", "1 Gbit/s", "10 Gbit/s"], a: 0, exp: "10BASE2 fonctionnait à 10 Mbit/s." },
      { type: "vf", q: "Pour un réseau local moderne, mieux vaut recâbler en paire torsadée ou en fibre.", a: true, exp: "Oui : le coaxial est dépassé pour les LAN ; on préfère la paire torsadée ou la fibre." },
      { type: "qcm", q: "Aujourd'hui, ce type de câble reste utile surtout pour…", opts: ["Rien du tout", "La TV et l'accès Internet par le câble", "Les fibres sous-marines", "Les réseaux Wi-Fi"], a: 1, exp: "Le coaxial sert encore à la TV et à l'Internet par câble (DOCSIS)." }
    ],
    solution: `<pre class="pseudo"># Diagnostic de l'installation
Cable  : coaxial 10BASE2 (Thinnet), cuivre, 10 Mbit/s
