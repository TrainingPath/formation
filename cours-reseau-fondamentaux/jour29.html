<script>
var DAY = {
  num: 29,
  title: "Pratique : lire sa configuration réseau",
  subtitle: "Ouvrir un terminal et retrouver, en vrai, son adresse IP, son adresse MAC et sa passerelle.",
  theory: `
<h3>1. Passer de la théorie à ta propre machine</h3>
<p>Tu connais maintenant l'adresse MAC, le domaine de diffusion, les VLAN. Il est temps de <strong>voir tout cela sur ton ordinateur</strong>. Chaque système offre des commandes pour afficher la configuration réseau des cartes (interfaces). C'est le premier réflexe de tout technicien : « qui suis-je sur le réseau ? ».</p>
<h3>2. Sur Windows : ipconfig</h3>
<p>Ouvre l'invite de commandes (<em>cmd</em>) ou PowerShell, puis tape <strong>ipconfig</strong>. La version courte montre l'IP, le masque et la passerelle. Pour TOUT voir, dont l'adresse MAC, ajoute l'option <strong>/all</strong> :</p>
<pre class="pseudo">C:\\Users\\Alex&gt; ipconfig /all

Carte Ethernet Ethernet :
   Description . . . . . . . : Realtek PCIe GbE Family Controller
   Adresse physique . . . . : 00-1A-2B-3C-4D-5E     &lt;- c'est ta MAC !
   DHCP active . . . . . . . : Oui
   Adresse IPv4 . . . . . . : 192.168.1.42
   Masque de sous-reseau . . : 255.255.255.0
   Passerelle par defaut . . : 192.168.1.1
   Serveurs DNS . . . . . . : 192.168.1.1</pre>
<p>Sur Windows, l'adresse MAC s'appelle <strong>Adresse physique</strong> (<em>Physical Address</em>) et s'écrit avec des tirets (00-1A-2B-…). La « Passerelle par défaut » est la porte de sortie vers les autres réseaux (le routeur).</p>
<h3>3. Sur Linux : ip a et ip link</h3>
<p>Sur Linux, la commande moderne est <strong>ip</strong>. Pour voir les adresses IP : <strong>ip a</strong> (raccourci de <em>ip address</em>). Pour se concentrer sur les cartes et leurs adresses MAC : <strong>ip link</strong> (ou <em>ip link show</em>).</p>
<pre class="pseudo">$ ip a
2: eth0: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1500 ...
    link/ether 00:1a:2b:3c:4d:5e brd ff:ff:ff:ff:ff:ff
    inet 192.168.1.42/24 brd 192.168.1.255 scope global eth0

$ ip link
2: eth0: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1500 ...
    link/ether 00:1a:2b:3c:4d:5e brd ff:ff:ff:ff:ff:ff</pre>
<p>Sur Linux, la MAC apparaît après <strong>link/ether</strong> et s'écrit avec des deux-points (00:1a:2b:…). Le <strong>/24</strong> après l'IP est le masque en notation CIDR (équivalent de 255.255.255.0). L'ancienne commande <strong>ifconfig</strong> existe encore mais est dépréciée : préfère <em>ip</em>.</p>
<div class="tip">La même MAC, deux écritures : Windows met des tirets (00-1A-2B-3C-4D-5E), Linux met des deux-points (00:1a:2b:3c:4d:5e). C'est la même adresse, seule la ponctuation change.</div>
<h3>4. Repérer les bonnes informations</h3>
<p>Dans toute cette sortie, apprends à retrouver quatre choses : l'<strong>adresse IP</strong> (qui tu es), le <strong>masque</strong> (la taille de ton réseau), la <strong>passerelle</strong> (par où sortir) et l'<strong>adresse MAC</strong> (l'identité physique de la carte). Repère aussi si <strong>DHCP</strong> est actif : si oui, ta configuration IP t'a été attribuée automatiquement.</p>
<div class="warn">Ne confonds pas les interfaces. Une machine a souvent plusieurs cartes : filaire (Ethernet / eth0), Wi-Fi (Wi-Fi / wlan0) et une interface de bouclage <strong>loopback</strong> (127.0.0.1 / lo) qui pointe vers la machine elle-même. Chacune a sa propre configuration.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WINDOWS :
#   ipconfig         -&gt; IP, masque, passerelle
#   ipconfig /all    -&gt; tout, dont "Adresse physique" (MAC)
# LINUX :
#   ip a             -&gt; adresses IP des interfaces
#   ip link          -&gt; interfaces + MAC (link/ether)
#   (ifconfig = ancien, deprecie)
# MAC : Windows 00-1A-...  |  Linux 00:1a:...  (meme adresse)
# A repErer : IP, masque, passerelle, MAC, DHCP</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle commande Windows affiche la configuration réseau, adresse MAC comprise ?", opts: ["ipconfig", "ipconfig /all", "ping", "netstat"], a: 1, exp: "ipconfig /all montre tout, y compris l'adresse physique (MAC)." },
    { type: "qcm", q: "Sous quel nom l'adresse MAC apparaît-elle dans ipconfig /all ?", opts: ["Adresse logique", "Adresse physique", "Adresse virtuelle", "Adresse de diffusion"], a: 1, exp: "Windows nomme la MAC « Adresse physique » (Physical Address)." },
    { type: "qcm", q: "Quelle commande Linux affiche les adresses IP des interfaces ?", opts: ["ip a", "dir", "ls -l", "cd /net"], a: 0, exp: "ip a (ip address) liste les interfaces et leurs adresses IP." },
    { type: "qcm", q: "Sur Linux, après quel mot-clé lit-on l'adresse MAC dans la sortie de ip link ?", opts: ["inet", "link/ether", "scope", "mtu"], a: 1, exp: "La MAC suit link/ether dans la sortie de ip a / ip link." },
    { type: "qcm", q: "Que représente la « passerelle par défaut » ?", opts: ["Le serveur DNS", "La porte de sortie vers les autres réseaux (le routeur)", "L'adresse MAC", "Le nom de la machine"], a: 1, exp: "La passerelle par défaut est le routeur qui mène hors du réseau local." },
    { type: "qcm", q: "Que signifie « /24 » écrit après une adresse IP sur Linux (ip a) ?", opts: ["Le numéro de port", "Le masque de sous-réseau en notation CIDR (255.255.255.0)", "Le VLAN", "Le nombre de cartes"], a: 1, exp: "/24 est la notation CIDR du masque 255.255.255.0." },
    { type: "vf", q: "L'adresse MAC 00-1A-2B-3C-4D-5E (Windows) et 00:1a:2b:3c:4d:5e (Linux) désignent la même adresse.", a: true, exp: "Vrai : même adresse, seule la ponctuation (tirets vs deux-points) diffère." },
    { type: "vf", q: "La commande ifconfig est la commande moderne recommandée sur Linux.", a: false, exp: "Faux : ifconfig est dépréciée. La commande moderne est ip (ip a, ip link)." },
    { type: "vf", q: "Si DHCP est actif, l'adresse IP a été attribuée automatiquement à la machine.", a: true, exp: "Vrai : le DHCP distribue automatiquement IP, masque, passerelle et DNS." },
    { type: "vf", q: "L'interface loopback (lo / 127.0.0.1) permet de contacter une autre machine du réseau.", a: false, exp: "Faux : le loopback pointe vers la machine elle-même, pas vers une autre." },
    { type: "input", q: "Quelle option ajoute-t-on à ipconfig pour afficher toute la configuration, MAC comprise ?", a: ["/all", "all", "-all"], ph: "/…", exp: "L'option /all : ipconfig /all." },
    { type: "input", q: "Écris la commande Linux courte qui affiche les adresses IP des interfaces.", a: ["ip a", "ip address", "ip addr", "ip a s", "ip addr show"], ph: "ip …", exp: "ip a (abréviation de ip address)." },
    { type: "input", q: "Écris la commande Linux qui liste les interfaces et leur adresse MAC (link/ether).", a: ["ip link", "ip link show", "ip l"], ph: "ip …", exp: "ip link (ou ip link show)." },
    { type: "input", q: "Sous Linux, quel nom porte typiquement l'interface Wi-Fi (commence par w) ?", a: ["wlan0", "wlan", "wlp", "wlan 0"], ph: "wl…", exp: "L'interface Wi-Fi s'appelle souvent wlan0 (ou wlpXsY selon la nomenclature)." },
    { type: "input", q: "Quelle adresse IP désigne toujours la machine locale (interface loopback) ?", a: ["127.0.0.1", "127001", "localhost"], ph: "127…", exp: "127.0.0.1 (localhost) est l'adresse de bouclage locale." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer sa propre machine",
    intro: `<p>Sur son PC Windows, Yasmine tape <code>ipconfig /all</code> et lit : Adresse physique 00-AB-CD-11-22-33 ; Adresse IPv4 192.168.0.25 ; Masque 255.255.255.0 ; Passerelle par défaut 192.168.0.1 ; DHCP activé : Oui. Aidons-la à interpréter.</p>`,
    questions: [
      { type: "qcm", q: "Quelle ligne donne son adresse MAC ?", opts: ["Adresse IPv4", "Adresse physique 00-AB-CD-11-22-33", "Passerelle par défaut", "Masque de sous-réseau"], a: 1, exp: "L'adresse physique EST l'adresse MAC sous Windows." },
      { type: "qcm", q: "Quelle est l'adresse du routeur qui la relie aux autres réseaux ?", opts: ["192.168.0.25", "255.255.255.0", "192.168.0.1 (passerelle)", "00-AB-CD-11-22-33"], a: 2, exp: "La passerelle par défaut 192.168.0.1 est le routeur de sortie." },
      { type: "vf", q: "Comme DHCP est activé, sa configuration IP lui a été attribuée automatiquement.", a: true, exp: "Vrai : DHCP à Oui signifie une attribution automatique de l'IP." },
      { type: "qcm", q: "Sur un PC Linux, quelle commande retrouverait la même adresse MAC ?", opts: ["ipconfig /all", "ip link (ligne link/ether)", "ping 192.168.0.1", "cd /mac"], a: 1, exp: "Sous Linux, ip link (ou ip a) affiche la MAC après link/ether." },
      { type: "input", q: "En notation CIDR, comment s'écrit le masque 255.255.255.0 (ce qu'on verrait sur Linux) ?", a: ["/24", "24", "cidr 24"], ph: "/…", exp: "255.255.255.0 correspond à /24 en notation CIDR." }
    ],
    solution: `<pre class="pseudo"># Lecture de la config de Yasmine :
Adresse physique  00-AB-CD-11-22-33  -&gt; son adresse MAC
Adresse IPv4      192.168.0.25       -&gt; qui elle est
Masque            255.255.255.0      -&gt; /24 en CIDR
Passerelle        192.168.0.1        -&gt; le routeur (sortie)
DHCP              Oui                -&gt; config automatique

# Meme info sous Linux :
$ ip a        # IP + masque (/24)
$ ip link     # link/ether 00:ab:cd:11:22:33  (meme MAC)</pre>
<p>Windows ou Linux, ce sont les mêmes informations : IP, masque, passerelle, MAC. Savoir les lire, c'est savoir se situer sur le réseau.</p>`
  }
};
</script>
