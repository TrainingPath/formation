<script>
var DAY = {
  num: 20,
  title: "L'adresse MAC et sa notation (48 bits, OUI, notation hexadécimale)",
  subtitle: "La carte d'identité gravée dans chaque carte réseau, écrite en hexadécimal.",
  theory: `
<h3>1. Pourquoi une adresse physique ?</h3>
<p>Sur un réseau local, il faut pouvoir désigner précisément <strong>quelle carte réseau</strong> doit recevoir une trame. Cet identifiant est l'<strong>adresse MAC</strong> (en anglais <em>Media Access Control address</em>). On l'appelle aussi <strong>adresse physique</strong> ou <strong>adresse matérielle</strong>, car elle est en principe <strong>gravée dans la carte réseau</strong> à la fabrication. C'est un peu le <strong>numéro de série unique</strong> de la carte, sa carte d'identité au niveau de la couche 2.</p>
<div class="tip">Ne confonds pas adresse MAC et adresse IP. L'<strong>adresse MAC</strong> (couche 2) est fixe, propre à la carte, et sert sur le réseau <em>local</em>. L'<strong>adresse IP</strong> (couche 3) dépend du réseau où la machine est branchée et sert à voyager entre réseaux distants.</div>
<h3>2. 48 bits, soit 6 octets</h3>
<p>Une adresse MAC classique fait <strong>48 bits</strong>, c'est-à-dire <strong>6 octets</strong> (1 octet = 8 bits ; 6 × 8 = 48). Pour l'écrire de façon lisible par un humain, on la note en <strong>hexadécimal</strong> : chaque octet devient <strong>deux chiffres hexadécimaux</strong> (de 00 à FF), et on sépare les six octets par des deux-points (parfois par des tirets).</p>
<pre class="pseudo"># Une adresse MAC : 6 octets = 48 bits
Notation courante :  00:1A:2B:3C:4D:5E
                     |  |  |  |  |  +-- octet 6
                     |  |  |  |  +----- octet 5
                     |  |  |  +-------- octet 4
                     |  |  +----------- octet 3
                     |  +-------------- octet 2
                     +----------------- octet 1
# Chaque paire (ex: 1A) = 1 octet = 8 bits, ecrit en hexadecimal.
# Autres notations vues : 00-1A-2B-3C-4D-5E  ou  001A.2B3C.4D5E</pre>
<p>L'<strong>hexadécimal</strong> (base 16) utilise les chiffres 0 à 9 puis les lettres A à F (A=10, B=11, C=12, D=13, E=14, F=15). C'est pratique car chaque groupe de 4 bits tient exactement dans un chiffre hexadécimal, donc un octet (8 bits) tient dans deux chiffres.</p>
<h3>3. Deux parties : OUI (constructeur) + numéro de série</h3>
<p>Les 6 octets se répartissent en deux moitiés de 3 octets :</p>
<p>Les <strong>3 premiers octets</strong> forment l'<strong>OUI</strong> (<em>Organizationally Unique Identifier</em>, « identifiant unique d'organisation »). Il est attribué au <strong>fabricant</strong> de la carte par l'IEEE. À partir de l'OUI, on peut souvent retrouver le constructeur (Intel, Cisco, etc.).</p>
<p>Les <strong>3 derniers octets</strong> sont attribués par le fabricant lui-même : c'est un <strong>numéro de série</strong> unique pour chaque carte qu'il produit. La combinaison OUI + numéro de série rend l'adresse <strong>unique au monde</strong> (en théorie).</p>
<pre class="pseudo"># Structure d'une adresse MAC (48 bits)
00:1A:2B  :  3C:4D:5E
[--OUI--]    [-- numero de serie --]
constructeur      fabricant
(IEEE)            (unique par carte)</pre>
<h3>4. Adresses particulières</h3>
<p>Certaines adresses ont un rôle spécial. L'adresse de <strong>diffusion</strong> (broadcast) vaut <strong>FF:FF:FF:FF:FF:FF</strong> : une trame envoyée à cette adresse est destinée à <strong>toutes</strong> les machines du réseau local. Une adresse normale, destinée à <strong>une seule</strong> carte, est dite <strong>unicast</strong>. Il existe aussi des adresses <strong>multicast</strong>, destinées à un groupe de machines.</p>
<div class="warn">L'adresse MAC est censée être unique et fixe, mais sur les systèmes modernes elle peut être <strong>modifiée logiciellement</strong> (« MAC spoofing », ou randomisation de l'adresse Wi-Fi pour la vie privée). Retiens quand même le principe : l'adresse MAC identifie la carte au niveau de la couche 2.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Adresse MAC = adresse physique de la carte reseau (couche 2)
# Taille : 48 bits = 6 octets
# Notation : hexadecimal, ex. 00:1A:2B:3C:4D:5E (2 chiffres hexa par octet)
# 3 premiers octets = OUI (constructeur, attribue par l'IEEE)
# 3 derniers octets = numero de serie (choisi par le fabricant)
# FF:FF:FF:FF:FF:FF = adresse de diffusion (broadcast, pour toutes les machines)</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de bits contient une adresse MAC classique ?", opts: ["32 bits", "48 bits", "64 bits", "128 bits"], a: 1, exp: "Une adresse MAC fait 48 bits, soit 6 octets." },
    { type: "input", q: "Combien d'octets fait une adresse MAC ?", a: ["6", "six", "6 octets"], ph: "un nombre", exp: "48 bits / 8 = 6 octets." },
    { type: "qcm", q: "Dans quelle base numérique note-t-on habituellement une adresse MAC ?", opts: ["Binaire", "Décimale", "Hexadécimale", "Octale"], a: 2, exp: "On la note en hexadécimal (deux chiffres hexa par octet)." },
    { type: "qcm", q: "Laquelle est une adresse MAC correctement notée ?", opts: ["192.168.1.10", "00:1A:2B:3C:4D:5E", "www.exemple.fr", "255.255.255.0"], a: 1, exp: "00:1A:2B:3C:4D:5E : 6 octets en hexadécimal séparés par des deux-points." },
    { type: "input", q: "Comment appelle-t-on les 3 premiers octets d'une adresse MAC (sigle de 3 lettres) ?", a: ["oui", "l'oui", "organizationally unique identifier"], ph: "3 lettres", exp: "OUI = Organizationally Unique Identifier, la partie constructeur." },
    { type: "qcm", q: "Que représentent les 3 premiers octets (l'OUI) ?", opts: ["Le numéro de série de la carte", "Le fabricant de la carte (attribué par l'IEEE)", "L'adresse IP", "Le numéro de port"], a: 1, exp: "L'OUI identifie le constructeur, attribué par l'IEEE." },
    { type: "vf", q: "Les 3 derniers octets d'une adresse MAC sont attribués par le fabricant comme un numéro de série.", a: true, exp: "Oui : le fabricant les choisit pour rendre chaque carte unique." },
    { type: "input", q: "Quelle est l'adresse MAC de diffusion (broadcast) ? (notation avec deux-points)", a: ["ff:ff:ff:ff:ff:ff", "ffffffffffff", "ff-ff-ff-ff-ff-ff"], ph: "6 octets identiques", exp: "FF:FF:FF:FF:FF:FF vise toutes les machines du réseau local." },
    { type: "qcm", q: "Une trame envoyée à FF:FF:FF:FF:FF:FF est destinée à…", opts: ["Une seule machine", "Toutes les machines du réseau local (diffusion)", "Aucune machine", "Le routeur uniquement"], a: 1, exp: "C'est l'adresse de diffusion (broadcast) : toutes les machines la reçoivent." },
    { type: "qcm", q: "Combien de chiffres hexadécimaux faut-il pour écrire un octet ?", opts: ["Un", "Deux", "Quatre", "Huit"], a: 1, exp: "Un octet (8 bits) s'écrit avec deux chiffres hexadécimaux (00 à FF)." },
    { type: "vf", q: "En hexadécimal, la lettre F représente la valeur 15.", a: true, exp: "Oui : en base 16, A=10, B=11, C=12, D=13, E=14, F=15." },
    { type: "input", q: "Comment qualifie-t-on une adresse MAC destinée à UNE SEULE carte (terme anglais) ?", a: ["unicast", "l'unicast"], ph: "un mot anglais", exp: "Unicast = destination unique. Broadcast = toutes, multicast = un groupe." },
    { type: "qcm", q: "Quelle affirmation est correcte ?", opts: ["L'adresse MAC change à chaque redémarrage par défaut", "L'adresse MAC est en principe fixe et propre à la carte", "L'adresse MAC dépend du réseau où l'on se branche", "L'adresse MAC fait 128 bits"], a: 1, exp: "Elle est gravée dans la carte, en principe fixe (contrairement à l'IP)." },
    { type: "vf", q: "L'adresse MAC et l'adresse IP sont la même chose.", a: false, exp: "Non : MAC = couche 2 (physique, locale) ; IP = couche 3 (logique, entre réseaux)." },
    { type: "qcm", q: "Pourquoi l'hexadécimal est-il pratique pour écrire une adresse MAC ?", opts: ["Parce qu'il n'utilise que des lettres", "Parce que 4 bits tiennent exactement dans 1 chiffre hexa", "Parce qu'il est plus long que le binaire", "Parce qu'il utilise la base 10"], a: 1, exp: "4 bits = 1 chiffre hexa, donc 1 octet (8 bits) = 2 chiffres. Compact et lisible." }
  ],
  final: {
    title: "Exercice final — Lire une adresse MAC",
    intro: `<p>Une carte réseau affiche l'adresse <code>00:1A:2B:3C:4D:5E</code>. Analysons-la morceau par morceau.</p>`,
    questions: [
      { type: "input", q: "Combien d'octets compte cette adresse ?", a: ["6", "six"], ph: "un nombre", exp: "Six paires hexadécimales = 6 octets = 48 bits." },
      { type: "qcm", q: "Quelle partie correspond à l'OUI (le constructeur) ?", opts: ["3C:4D:5E", "00:1A:2B", "00:1A:2B:3C:4D:5E en entier", "5E seulement"], a: 1, exp: "Les 3 premiers octets (00:1A:2B) forment l'OUI." },
      { type: "qcm", q: "Quelle partie est le numéro de série attribué par le fabricant ?", opts: ["00:1A:2B", "3C:4D:5E", "Aucune", "1A seulement"], a: 1, exp: "Les 3 derniers octets (3C:4D:5E) sont le numéro de série." },
      { type: "vf", q: "Cette adresse (00:1A:2B:3C:4D:5E) est une adresse de diffusion.", a: false, exp: "Non : la diffusion, c'est FF:FF:FF:FF:FF:FF. Ici c'est une adresse unicast normale." },
      { type: "qcm", q: "En hexadécimal, que vaut le chiffre A présent dans 1A ?", opts: ["1", "10", "11", "15"], a: 1, exp: "A = 10 en base 16 (A=10, B=11 … F=15)." }
    ],
    solution: `<pre class="pseudo"># Analyse de 00:1A:2B:3C:4D:5E
Taille        : 6 octets = 48 bits
Notation      : hexadecimale (2 chiffres par octet)
OUI (3 octets): 00:1A:2B  -&gt; identifie le constructeur (IEEE)
Serie (3 oct.): 3C:4D:5E  -&gt; numero unique choisi par le fabricant
Type          : unicast (une seule carte)
# Diffusion (broadcast) = FF:FF:FF:FF:FF:FF (toutes les machines)</pre>
<p>Tu sais maintenant lire une adresse MAC. Demain, le protocole qui utilise ces adresses sur le câble : <strong>Ethernet</strong>.</p>`
  }
};
</script>
