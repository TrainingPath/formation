<script>
var DAY = {
  num: 25,
  title: "La table CAM et l'apprentissage des adresses",
  subtitle: "Comment un commutateur apprend qui est branché où, et n'envoie qu'au bon port.",
  theory: `
<h3>1. Le problème que résout le switch</h3>
<p>Un <strong>commutateur</strong> (en anglais <em>switch</em>) possède beaucoup de ports, un par machine ou presque. Contrairement au vieux <strong>concentrateur</strong> (<em>hub</em>) qui recopiait bêtement tout signal sur tous les ports, le switch veut être malin : quand une trame arrive pour la machine A, il aimerait l'envoyer <em>uniquement</em> sur le port où A est branchée. Mais au démarrage, il ne sait rien : quel appareil est derrière quel port ? Il doit l'<strong>apprendre</strong> tout seul, en observant le trafic.</p>
<h3>2. La table CAM : le carnet d'adresses du switch</h3>
<p>Pour retenir ce qu'il apprend, le switch tient un tableau en mémoire appelé <strong>table CAM</strong> (<em>Content Addressable Memory</em>), aussi nommée <strong>table d'adresses MAC</strong> ou <strong>table de commutation</strong>. Chaque ligne associe une <strong>adresse MAC</strong> à un <strong>numéro de port</strong> (et au VLAN, qu'on verra plus tard).</p>
<pre class="pseudo">Adresse MAC          Port    VLAN
------------------------------------
00:11:22:AA:BB:01    Fa0/1   1
00:11:22:AA:BB:02    Fa0/2   1
00:11:22:AA:BB:03    Fa0/3   1</pre>
<p>C'est un simple annuaire : « telle carte réseau se trouve derrière tel port ». Le switch le construit et le met à jour en permanence.</p>
<h3>3. L'apprentissage par l'adresse SOURCE</h3>
<p>Voici l'astuce centrale. Quand une trame entre par un port, le switch regarde son <strong>adresse MAC source</strong> (l'expéditeur). Il se dit : « cette machine m'a écrit par le port Fa0/2, donc elle est derrière Fa0/2 ». Il inscrit alors le couple MAC source + port d'arrivée dans la table CAM. Le switch <strong>apprend toujours à partir de la source</strong>, jamais de la destination.</p>
<div class="tip">Retiens la règle : on <strong>apprend</strong> avec l'adresse <strong>source</strong> (d'où vient la trame) et on <strong>décide où envoyer</strong> avec l'adresse <strong>destination</strong> (où elle va). Deux adresses, deux rôles.</div>
<h3>4. La décision d'aiguillage : filtrer, transmettre ou inonder</h3>
<p>Une fois la trame reçue, le switch lit l'adresse MAC <strong>destination</strong> et cherche dans la table CAM :</p>
<pre class="pseudo">Destination connue et sur un AUTRE port  -&gt; on transmet sur CE port (unicast dirige)
Destination connue sur le MEME port      -&gt; on jette la trame (filtrage : inutile)
Destination INCONNUE (pas dans la table) -&gt; on INONDE tous les ports sauf celui d'arrivee
Destination broadcast / multicast        -&gt; on inonde aussi (envoi a tous)</pre>
<p>L'inondation d'une destination inconnue s'appelle <strong>unknown unicast flooding</strong>. Ce n'est pas un bug : c'est ainsi que la réponse reviendra, permettant au switch d'apprendre la MAC manquante. Dès que la machine ciblée répond, sa MAC source est enregistrée, et les échanges suivants seront dirigés vers le seul bon port.</p>
<h3>5. Le vieillissement des entrées (aging)</h3>
<p>Une machine peut être débranchée ou déplacée. Pour ne pas garder d'informations périmées, chaque entrée a un <strong>minuteur de vieillissement</strong> (<em>aging timer</em>), souvent <strong>300 secondes</strong> (5 minutes) par défaut. À chaque trame reçue d'une MAC, son minuteur repart à zéro. Si une MAC reste silencieuse trop longtemps, son entrée est <strong>effacée</strong> et devra être réapprise. La table CAM est donc vivante : elle se remplit, se rafraîchit et se vide toute seule.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Table CAM = annuaire : MAC  ->  Port (+ VLAN)
# APPREND avec l'adresse SOURCE (port d'arrivee)
# DECIDE avec l'adresse DESTINATION :
#   connue autre port -> transmet | meme port -> filtre
#   inconnue / broadcast -> inonde (flood)
# Aging ~300 s : les entres inactives sont oubliees
# Resultat : le switch envoie au bon port, pas a tout le monde</pre>`,
  exercises: [
    { type: "qcm", q: "Comment s'appelle la table où le switch associe adresses MAC et ports ?", opts: ["Table de routage", "Table CAM (table d'adresses MAC)", "Table ARP", "Table DNS"], a: 1, exp: "La table CAM (Content Addressable Memory), ou table d'adresses MAC, associe MAC et port." },
    { type: "qcm", q: "À partir de quelle adresse le switch APPREND-il l'emplacement d'une machine ?", opts: ["L'adresse destination", "L'adresse source de la trame reçue", "L'adresse IP", "L'adresse de broadcast"], a: 1, exp: "Il apprend avec la MAC source : la trame arrive par le port où se trouve l'expéditeur." },
    { type: "qcm", q: "Avec quelle adresse le switch DÉCIDE-t-il sur quel port envoyer la trame ?", opts: ["L'adresse source", "L'adresse destination", "L'adresse IP de destination", "Le numéro de VLAN uniquement"], a: 1, exp: "La décision d'aiguillage se prend en lisant la MAC destination." },
    { type: "qcm", q: "Que fait le switch si l'adresse MAC destination est INCONNUE dans la table CAM ?", opts: ["Il jette la trame", "Il l'inonde sur tous les ports sauf celui d'arrivée", "Il met la trame en attente jusqu'à connaître le bon port", "Il renvoie la trame à l'expéditeur"], a: 1, exp: "Destination inconnue = unknown unicast flooding : on inonde pour que la réponse revienne." },
    { type: "qcm", q: "Que fait le switch si la destination est connue sur le MÊME port que l'arrivée ?", opts: ["Il transmet quand même", "Il filtre : il jette la trame car inutile de la renvoyer", "Il l'inonde", "Il duplique l'entrée MAC vers un autre port"], a: 1, exp: "Source et destination du même côté : inutile de retransmettre, la trame est filtrée." },
    { type: "qcm", q: "Quelle est la durée typique du minuteur de vieillissement (aging) d'une entrée CAM ?", opts: ["1 seconde", "30 secondes", "300 secondes (5 minutes)", "24 heures"], a: 2, exp: "Le défaut classique est de 300 secondes, soit 5 minutes." },
    { type: "vf", q: "Un switch envoie chaque trame sur tous ses ports, exactement comme un hub.", a: false, exp: "Non : une fois la table CAM apprise, il dirige la trame vers le seul bon port." },
    { type: "vf", q: "Le switch apprend les adresses en observant l'adresse MAC destination des trames.", a: false, exp: "Il apprend avec la SOURCE. La destination sert seulement à décider où envoyer." },
    { type: "vf", q: "Une trame de broadcast est envoyée sur tous les ports (sauf le port d'arrivée).", a: true, exp: "Le broadcast s'adresse à tous : le switch l'inonde sur tous les autres ports." },
    { type: "vf", q: "Si une machine reste silencieuse plus longtemps que l'aging, son entrée CAM est supprimée.", a: true, exp: "Oui : sans trafic, le minuteur expire et l'entrée est oubliée, puis réapprise plus tard." },
    { type: "input", q: "Quel type de mémoire donne son nom à la table (sigle de trois lettres) ?", a: ["cam"], ph: "3 lettres", exp: "CAM = Content Addressable Memory." },
    { type: "input", q: "Comment nomme-t-on l'action d'envoyer une trame sur tous les ports quand la destination est inconnue ?", a: ["inondation", "flood", "flooding", "unknown unicast flooding"], ph: "un mot", exp: "C'est l'inondation (flooding), plus précisément unknown unicast flooding." },
    { type: "input", q: "Un switch reçoit une trame de MAC source 00:AA sur le port 5. Quel numéro de port va-t-il associer à 00:AA ?", a: ["5", "port 5", "le port 5"], ph: "un numéro", exp: "La trame est entrée par le port 5, donc 00:AA est apprise sur le port 5." },
    { type: "input", q: "Comment appelle-t-on le minuteur qui efface une entrée MAC restée inactive ?", a: ["aging", "vieillissement", "aging timer", "minuteur de vieillissement"], ph: "un terme", exp: "L'aging timer (minuteur de vieillissement) supprime les entrées inactives." },
    { type: "input", q: "Vrai nom de l'appareil moderne, plus intelligent que le hub, qui aiguille grâce à la table CAM ?", a: ["switch", "commutateur", "le commutateur", "le switch"], ph: "un mot", exp: "C'est le commutateur (switch)." }
  ],
  final: {
    title: "Exercice final — Le switch apprend en direct",
    intro: `<p>Un switch tout neuf a une table CAM VIDE. Trois PC y sont branchés : PC-A (MAC 00:0A) sur le port Fa0/1, PC-B (MAC 00:0B) sur Fa0/2, PC-C (MAC 00:0C) sur Fa0/3. PC-A envoie une première trame à PC-B. Suivons ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "À la réception de la trame de PC-A, qu'inscrit d'abord le switch dans sa table ?", opts: ["00:0B sur Fa0/2", "00:0A sur Fa0/1", "Rien, la table reste vide", "00:0C sur Fa0/3"], a: 1, exp: "Il apprend la source : 00:0A est arrivée par Fa0/1." },
      { type: "qcm", q: "La destination 00:0B n'est pas encore connue. Que fait le switch de cette trame ?", opts: ["Il la jette", "Il l'inonde sur Fa0/2 et Fa0/3 (tous sauf Fa0/1)", "Il l'envoie seulement à PC-A", "Il attend 5 minutes"], a: 1, exp: "Destination inconnue : inondation sur tous les ports sauf le port d'arrivée." },
      { type: "vf", q: "Quand PC-B répond à PC-A, le switch apprend alors 00:0B sur le port Fa0/2.", a: true, exp: "La réponse de PC-B entre par Fa0/2 : sa MAC source y est apprise." },
      { type: "qcm", q: "Après ces deux échanges, PC-A réécrit à PC-B. Que fait le switch ?", opts: ["Il inonde encore", "Il transmet directement sur Fa0/2, car 00:0B est désormais connue", "Il jette la trame", "Il l'envoie à PC-C"], a: 1, exp: "00:0B est dans la table sur Fa0/2 : envoi dirigé, plus d'inondation." },
      { type: "input", q: "Combien d'entrées la table CAM contient-elle maintenant (PC-A a parlé, PC-B a répondu) ?", a: ["2", "deux"], ph: "un nombre", exp: "Deux : 00:0A sur Fa0/1 et 00:0B sur Fa0/2. PC-C n'a rien émis." }
    ],
    solution: `<pre class="pseudo"># Deroule de l'apprentissage :
1. PC-A -&gt; PC-B : switch apprend 00:0A / Fa0/1 (source)
   Destination 00:0B inconnue -&gt; INONDATION (Fa0/2, Fa0/3)
2. PC-B repond : switch apprend 00:0B / Fa0/2 (source)
3. Table CAM :
     00:0A  Fa0/1
     00:0B  Fa0/2
4. PC-A -&gt; PC-B suivant : envoi DIRECT sur Fa0/2 (plus d'inondation)</pre>
<p>Le switch part de zéro, apprend par les adresses source, inonde une seule fois, puis aiguille proprement. C'est tout le principe de la commutation.</p>`
  }
};
