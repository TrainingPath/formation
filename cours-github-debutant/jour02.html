<script>
var DAY = {
  num: 2,
  title: "Créer et configurer son compte GitHub",
  subtitle: "Ta première présence sur la plateforme : un compte bien réglé.",
  theory: `
<h3>1. Créer un compte</h3>
<p>Aujourd'hui, tout se passe sur le <strong>site web</strong> de GitHub (pas de commande Git). Un <strong>compte</strong> est ton identité sur la plateforme : un nom d'utilisateur, une adresse e-mail et un mot de passe. Rends-toi sur <code>github.com</code> et clique sur <strong>« Sign up »</strong> (« s'inscrire » en anglais). GitHub te demande alors trois choses.</p>
<pre class="pseudo">github.com  ▸  bouton "Sign up"          # page d'inscription
  1) Email     : ton adresse e-mail       # servira aussi a Git plus tard
  2) Password  : un mot de passe solide    # long, unique a GitHub
  3) Username  : ton nom d'utilisateur     # visible par tous, choisis-le bien</pre>
<div class="tip">Le <strong>username</strong> (nom d'utilisateur) apparaît dans l'adresse de tes projets : github.com/<em>ton-username</em>/<em>ton-projet</em>. Choisis-le simple, professionnel et durable, car le changer plus tard casse tes anciens liens.</div>

<h3>2. Vérifier son adresse e-mail</h3>
<p>Après l'inscription, GitHub envoie un <strong>e-mail de vérification</strong> avec un code ou un lien. C'est une étape de sécurité qui prouve que l'adresse est bien la tienne. Ouvre ta boîte mail, clique sur le lien (ou saisis le code) : ton compte est activé.</p>
<div class="warn">Tant que l'e-mail n'est pas vérifié, certaines actions (créer un dépôt public, par exemple) restent bloquées. Ne saute pas cette étape.</div>

<h3>3. Activer la double authentification (2FA)</h3>
<p>La <strong>double authentification</strong> (en anglais <em>two-factor authentication</em>, abrégé <strong>2FA</strong>) ajoute une seconde preuve d'identité en plus du mot de passe : un code temporaire généré par une application sur ton téléphone. Même si quelqu'un vole ton mot de passe, il ne peut pas entrer sans ce second code. C'est comme une porte avec deux serrures différentes.</p>
<pre class="pseudo">Photo de profil (en haut a droite) ▸ Settings ▸ Password and authentication
  ▸ "Enable two-factor authentication"    # active la 2FA
  ▸ scanne le QR code avec une app (Google Authenticator, etc.)
  ▸ note bien les "recovery codes"          # codes de secours si tu perds le telephone</pre>
<div class="warn">GitHub rend la 2FA obligatoire pour les personnes qui publient du code. Garde tes codes de secours (recovery codes) en lieu sûr : ils te sauvent si tu perds ton téléphone.</div>

<h3>4. Compléter son profil</h3>
<p>Ton <strong>profil</strong> est ta page publique (github.com/<em>ton-username</em>). Un profil soigné inspire confiance. Depuis le menu <code>Photo de profil ▸ Settings ▸ Public profile</code>, tu peux ajouter une photo (avatar), ton nom, une courte biographie (bio) et un lien.</p>
<pre class="pseudo">Settings ▸ Public profile
  ▸ Name    : ton nom affiche          # peut differer du username
  ▸ Bio     : une phrase de presentation
  ▸ Photo   : un avatar reconnaissable</pre>

<h3>5. Comprendre public et privé</h3>
<p>Sur GitHub, un projet peut être <strong>public</strong> (visible par tout le monde sur Internet) ou <strong>privé</strong> (visible seulement par toi et les personnes que tu invites). Ce choix se fait à la création de chaque projet ; on y reviendra au jour 4. Retiens dès maintenant la distinction : public = ouvert à tous ; privé = réservé.</p>
<div class="tip">Un compte GitHub gratuit permet de créer autant de projets publics ET privés que tu veux. Parfait pour apprendre.</div>`,
  exercises: [
    { type: "qcm", q: "Pour créer un compte GitHub, on utilise…", opts: ["Le site web github.com et le bouton « Sign up »", "Une commande git signup", "Le terminal", "Un SMS"], a: 0, exp: "La création de compte se fait sur le site." },
    { type: "input", q: "Complète : le nom d'utilisateur visible par tous s'appelle le ______.", a: ["username", "nom d'utilisateur", "nom d utilisateur"], ph: "un mot", exp: "Le username apparaît dans l'adresse de tes projets." },
    { type: "vf", q: "Après l'inscription, il faut vérifier son adresse e-mail.", a: true, exp: "GitHub envoie un lien/code de vérification à activer." },
    { type: "qcm", q: "La 2FA (double authentification) sert à…", opts: ["Ajouter une seconde preuve d'identité en plus du mot de passe", "Accélérer le site", "Supprimer les publicités", "Traduire l'interface"], a: 0, exp: "Un second code protège ton compte même si le mot de passe fuit." },
    { type: "input", q: "Complète l'abréviation de la double authentification : ______.", a: ["2fa", "2 fa"], ph: "une abréviation", exp: "2FA = two-factor authentication." },
    { type: "qcm", q: "Les « recovery codes » servent à…", opts: ["Récupérer l'accès si tu perds ton téléphone 2FA", "Changer de langue", "Effacer ton compte", "Gagner des points"], a: 0, exp: "Codes de secours à garder précieusement." },
    { type: "qcm", q: "Où règle-t-on son compte sur GitHub ?", opts: ["Photo de profil (en haut à droite) ▸ Settings", "Dans le terminal", "Sur github.com/help uniquement", "Nulle part"], a: 0, exp: "Le menu Settings regroupe les réglages du compte." },
    { type: "vf", q: "Un projet public sur GitHub est visible par tout le monde.", a: true, exp: "Public = ouvert à tous ; privé = réservé aux invités." },
    { type: "qcm", q: "Un projet privé est visible par…", opts: ["Toi et les personnes que tu invites", "Tous les internautes", "Personne, jamais", "Seulement Google"], a: 0, exp: "Privé = accès restreint." },
    { type: "input", q: "Complète : ta page publique sur GitHub s'appelle ton ______.", a: ["profil", "profile"], ph: "un mot", exp: "Le profil : github.com/ton-username." },
    { type: "vf", q: "Un compte GitHub gratuit interdit les projets privés.", a: false, exp: "Le compte gratuit permet des projets publics ET privés." },
    { type: "qcm", q: "Pourquoi bien choisir son username dès le départ ?", opts: ["Le changer plus tard casse tes anciens liens", "Il est impossible à changer", "Il coûte de l'argent", "Il est secret"], a: 0, exp: "Le username figure dans les adresses de tes projets." },
    { type: "qcm", q: "Quelle info NE fait PAS partie du profil public ?", opts: ["Ton mot de passe", "Ton avatar", "Ta bio", "Ton nom affiché"], a: 0, exp: "Le mot de passe reste privé ; le reste est public." },
    { type: "input", q: "Complète : le menu qui regroupe les réglages du compte s'appelle ______.", a: ["settings", "paramètres", "parametres"], ph: "un mot", exp: "Settings = réglages/paramètres." },
    { type: "vf", q: "La 2FA se scanne souvent via un QR code dans une application du téléphone.", a: true, exp: "Une app d'authentification génère les codes temporaires." }
  ],
  final: {
    title: "Exercice final — Ton compte prêt à l'emploi",
    intro: `<p>Tu viens de créer ton compte. Vérifions que tu as bien les réflexes de configuration pour un compte sûr et professionnel.</p>`,
    questions: [
      { type: "qcm", q: "La toute première étape pour avoir un compte, c'est…", opts: ["Aller sur github.com et cliquer « Sign up »", "Installer Git", "Créer un dépôt", "Activer la 2FA"], a: 0, exp: "On s'inscrit d'abord sur le site." },
      { type: "vf", q: "Vérifier son adresse e-mail est indispensable pour débloquer certaines actions.", a: true, exp: "Sans e-mail vérifié, des actions restent bloquées." },
      { type: "input", q: "Complète : pour sécuriser le compte, on active la ______ (abréviation).", a: ["2fa"], ph: "une abréviation", exp: "La 2FA (double authentification)." },
      { type: "qcm", q: "Le chemin pour activer la 2FA est…", opts: ["Settings ▸ Password and authentication", "Terminal ▸ git 2fa", "Home ▸ Explore", "Settings ▸ Repositories"], a: 0, exp: "Réglages de sécurité du compte." },
      { type: "vf", q: "Il est prudent de conserver ses recovery codes en lieu sûr.", a: true, exp: "Ils sauvent l'accès si tu perds ton téléphone." }
    ],
    solution: `<pre class="pseudo"># Parcours de creation et configuration (tout sur le SITE web) :
1) github.com ▸ "Sign up"                 # email, mot de passe, username
2) Verifier l'email                        # clic sur le lien recu
3) Settings ▸ Password and authentication  # activer la 2FA + garder les recovery codes
4) Settings ▸ Public profile               # photo, nom, bio

# Rappel : public = visible par tous ; prive = reserve aux invites.</pre>
<p>Compte prêt. Demain : on installe et on configure Git sur ta propre machine.</p>`
  }
};
</script>
