var DAY = {
  num: 3,
  title: "Installer et configurer Git en local",
  subtitle: "On quitte le site web : Git s'installe sur ta machine.",
  theory: `
<h3>1. Installer Git</h3>
<p>Hier, tout se passait sur le site GitHub. Aujourd'hui, on installe <strong>Git</strong>, le logiciel, directement sur ton ordinateur. C'est lui qui te donnera les fameuses commandes. L'installation dépend de ton système :</p>
<pre class="pseudo">Windows : telecharge "Git for Windows" sur git-scm.com puis installe   # fournit aussi "Git Bash", un terminal
macOS   : installe via Homebrew  ->  brew install git                  # ou telecharge sur git-scm.com
Linux   : via le gestionnaire de paquets  ->  sudo apt install git      # Debian/Ubuntu</pre>
<div class="tip">Le <strong>terminal</strong> (ou « invite de commandes ») est la fenêtre où tu tapes des commandes. Sur Windows, l'installateur de Git fournit « Git Bash », un terminal tout prêt pour Git.</div>

<h3>2. Vérifier que Git est là</h3>
<p>Une fois installé, ouvre un terminal et demande à Git sa version. Si un numéro s'affiche, l'installation a réussi.</p>
<pre class="pseudo">git --version              # affiche le numero de version installe
git version 2.43.0         # exemple de reponse : Git est bien la</pre>
<div class="warn">Si le terminal répond « command not found » (commande introuvable), Git n'est pas installé ou pas encore reconnu : ferme et rouvre le terminal, ou reprends l'installation.</div>

<h3>3. Se présenter à Git : nom et e-mail</h3>
<p>Git a besoin de savoir <strong>qui</strong> tu es, pour signer chaque enregistrement (chaque « commit »). On le lui dit une seule fois, avec la commande <strong>git config</strong> (config = « configuration », les réglages). L'option <strong>--global</strong> signifie « pour tous mes projets sur cette machine », par opposition à un réglage limité à un seul projet.</p>
<pre class="pseudo">git config --global user.name "Ton Nom"          # ton nom, qui signera tes commits
git config --global user.email "toi@exemple.com"  # ton e-mail (idealement celui de GitHub)</pre>
<div class="tip">Utilise le même e-mail que ton compte GitHub : ainsi tes contributions seront reliées à ton profil sur le site.</div>

<h3>4. Relire et vérifier ses réglages</h3>
<p>Tu peux à tout moment relire ce que Git a enregistré.</p>
<pre class="pseudo">git config --global --list        # affiche tous tes reglages globaux
git config user.name              # affiche uniquement le nom enregistre
git config user.email             # affiche uniquement l'e-mail enregistre</pre>

<h3>5. Quelques réglages de confort</h3>
<p>Deux réglages fréquents. Le premier fixe le nom de la branche de départ (on verra les branches au jour 12) à <strong>main</strong>, la convention moderne. Le second demande à Git de colorer ses messages pour mieux les lire.</p>
<pre class="pseudo">git config --global init.defaultBranch main   # la branche de depart s'appellera "main"
git config --global color.ui auto             # active la couleur dans les messages de Git</pre>
<div class="warn">Ces commandes ne créent aucun projet : elles règlent seulement Git. Créer un dépôt sera l'affaire de demain (jour 4).</div>
<div class="tip">À retenir : on installe Git une fois, on se présente une fois (nom + e-mail en --global), et Git est prêt pour tous tes futurs projets sur cette machine.</div>`,
  exercises: [
    { type: "qcm", q: "Git s'installe…", opts: ["Sur ton ordinateur (logiciel local)", "Sur le site github.com", "Dans ta boîte mail", "Sur ton téléphone uniquement"], a: 0, exp: "Git est le logiciel local ; GitHub est le site." },
    { type: "input", q: "Complète la commande qui affiche la version installée : git ______", a: ["--version", "version"], ph: "une option", exp: "git --version confirme l'installation." },
    { type: "input", q: "Complète : la commande des réglages de Git est git ______", a: ["config"], ph: "une commande", exp: "git config gère la configuration." },
    { type: "qcm", q: "Que signifie l'option --global dans git config ?", opts: ["Pour tous les projets de cette machine", "Pour le monde entier", "Pour un seul fichier", "Pour GitHub uniquement"], a: 0, exp: "--global = réglage valable sur toute la machine." },
    { type: "input", q: "Complète : la clé de config pour ton nom est user.______", a: ["name", "name \"ton nom\""], ph: "un mot", exp: "user.name définit qui signe les commits." },
    { type: "qcm", q: "Pourquoi utiliser le même e-mail que sur GitHub ?", opts: ["Pour relier tes contributions à ton profil", "Pour aller plus vite", "C'est obligatoire", "Pour cacher ton nom"], a: 0, exp: "L'e-mail relie tes commits à ton compte GitHub." },
    { type: "vf", q: "On doit refaire git config user.name pour chaque nouveau projet quand on utilise --global.", a: false, exp: "--global vaut pour tous les projets : une seule fois suffit." },
    { type: "input", q: "Complète la clé de config pour ton adresse : user.______", a: ["email", "email \"toi@exemple.com\""], ph: "un mot", exp: "user.email enregistre ton adresse." },
    { type: "qcm", q: "Pour relire tous tes réglages globaux, tu tapes…", opts: ["git config --global --list", "git list", "git show config", "git settings"], a: 0, exp: "--list affiche la configuration enregistrée." },
    { type: "vf", q: "git --version sert à vérifier que Git est bien installé.", a: true, exp: "Si un numéro s'affiche, l'installation est réussie." },
    { type: "qcm", q: "« command not found » lors de git --version signifie…", opts: ["Git n'est pas installé ou pas reconnu", "Git est à jour", "Le projet est vide", "GitHub est en panne"], a: 0, exp: "Le terminal ne trouve pas Git : réinstalle ou rouvre le terminal." },
    { type: "input", q: "Complète : pour que la branche de départ s'appelle main : git config --global init.defaultBranch ______", a: ["main"], ph: "un nom", exp: "main est la convention moderne." },
    { type: "qcm", q: "Le « terminal » est…", opts: ["La fenêtre où l'on tape des commandes", "Un site web", "Un fichier texte", "Une extension de navigateur"], a: 0, exp: "C'est l'endroit où l'on écrit les commandes Git." },
    { type: "vf", q: "Configurer Git (nom, e-mail) crée automatiquement un projet.", a: false, exp: "La config règle seulement Git ; créer un dépôt viendra au jour 4." },
    { type: "qcm", q: "Sur Windows, l'installateur de Git fournit souvent…", opts: ["Git Bash, un terminal prêt pour Git", "Un antivirus", "Un navigateur", "Une imprimante"], a: 0, exp: "Git Bash est un terminal livré avec Git for Windows." }
  ],
  final: {
    title: "Exercice final — Première mise en route",
    intro: `<p>Tu viens d'installer Git. Avant de créer ton premier projet, il faut vérifier l'installation et te présenter à Git. Voici les gestes attendus.</p>`,
    questions: [
      { type: "input", q: "Commande pour vérifier que Git est installé :", a: ["git --version", "git version"], ph: "git …", exp: "git --version affiche le numéro." },
      { type: "input", q: "Complète : git config --global user.______ \"Ton Nom\"", a: ["name"], ph: "un mot", exp: "user.name enregistre ton nom." },
      { type: "input", q: "Complète : git config --global user.______ \"toi@exemple.com\"", a: ["email"], ph: "un mot", exp: "user.email enregistre ton adresse." },
      { type: "vf", q: "L'option --global évite de reconfigurer nom et e-mail à chaque projet.", a: true, exp: "Le réglage vaut pour toute la machine." },
      { type: "qcm", q: "Pour relire ce que Git a enregistré, on tape…", opts: ["git config --global --list", "git read", "git profile", "git me"], a: 0, exp: "--list affiche tous les réglages." }
    ],
    solution: `<pre class="pseudo">git --version                                    # verifier que Git est bien installe
git config --global user.name "Ada Lovelace"      # se presenter : le nom qui signera les commits
git config --global user.email "ada@exemple.com"   # l'e-mail (le meme que sur GitHub, idealement)
git config --global init.defaultBranch main        # confort : branche de depart nommee "main"
git config --global --list                         # relire tous les reglages pour verifier</pre>
<p>Git est installé et te connaît. Demain : ton tout premier dépôt.</p>`
  }
};
