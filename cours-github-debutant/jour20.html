  title: "Forker un projet et contribuer",
  subtitle: "Comment aider un projet dont on n'est pas propriétaire.",
  theory: `
<h3>1. Le problème : je n'ai pas le droit d'écrire</h3>
<p>Sur un dépôt qui ne t'appartient pas, tu ne peux pas <code>push</code> directement : tu n'en as pas la permission. Comment proposer une amélioration alors ? Réponse : le <strong>fork</strong>.</p>

<h3>2. Le fork : ta copie personnelle</h3>
<p><strong>Forker</strong> (« bifurquer, faire une fourche »), c'est demander à GitHub de créer une <strong>copie complète</strong> d'un dépôt sur <em>ton</em> compte. Cette copie t'appartient : tu peux y pousser tout ce que tu veux. Le dépôt d'origine, lui, n'est pas touché.</p>
<div class="tip">Chemin dans l'interface : ouvre le dépôt visé ▸ bouton <strong>Fork</strong> en haut à droite ▸ le dépôt apparaît maintenant sous <em>ton</em> compte, avec la mention « forked from … ».</div>

<h3>3. Le vocabulaire : origin et upstream</h3>
<p>Une fois ton fork cloné sur ta machine, tu manipules deux dépôts distants :</p>
<pre class="pseudo">origin     # TON fork sur GitHub (celui que tu as clone) : tu peux y pousser
upstream   # le depot D'ORIGINE (celui que tu as forke) : la source, en lecture

git clone https://github.com/toi/projet.git    # clone TON fork → cree le distant « origin »
cd projet
git remote add upstream https://github.com/original/projet.git   # ajoute la source sous le nom « upstream »
git remote -v                                  # verifie : origin (le tien) + upstream (l'original)</pre>
<p><strong>origin</strong> = « l'origine » de ce que tu as cloné, donc ton fork. <strong>upstream</strong> = « en amont », le projet-source d'où tout descend.</p>

<h3>4. Le cycle complet d'une contribution</h3>
<pre class="pseudo">1. Fork          # copie du projet sur ton compte (via le bouton du site)
2. git clone     # tu recuperes TON fork en local
3. git checkout -b ma-correction    # une branche dediee a ta modification
4. ... tu modifies, git add, git commit ...
5. git push origin ma-correction    # tu pousses la branche sur TON fork
6. Pull Request  # depuis GitHub, tu proposes ta branche au projet upstream</pre>
<p>La Pull Request va de <em>ta</em> branche (sur ton fork) vers le dépôt d'origine. Le propriétaire d'upstream la relit et décide de l'intégrer ou non.</p>

<h3>5. Garder son fork à jour</h3>
<p>Pendant que tu travailles, le projet d'origine continue d'avancer. Pour récupérer ses derniers changements dans ton fork :</p>
<pre class="pseudo">git fetch upstream          # telecharge les nouveautes du projet d'origine
git checkout main
git merge upstream/main     # fusionne ces nouveautes dans ta branche main locale
git push origin main        # remet ton fork a jour sur GitHub</pre>
<div class="tip">GitHub propose aussi un bouton <strong>Sync fork</strong> sur la page de ton fork : il fait la mise à jour en un clic, sans commande.</div>
<div class="warn">Ne travaille jamais directement sur ta branche main : crée toujours une branche dédiée (<code>ma-correction</code>). Ta main doit rester le miroir propre d'upstream, prêt à être resynchronisé.</div>`,

    { type: "qcm", q: "La Pull Request d'une contribution va…", opts: ["De ta branche (fork) vers le dépôt d'origine", "Du dépôt d'origine vers ton fork", "De ta machine vers ta machine", "De GitHub vers Git"], a: 0, exp: "Tu proposes tes changements au projet upstream." },

    { type: "input", q: "Commande pour pousser ta branche « ma-correction » sur ton fork :", a: ["git push origin ma-correction"], ph: "git push …", exp: "On pousse vers origin (ton fork)." },
    { type: "vf", q: "Forker un dépôt modifie le dépôt d'origine.", a: false, exp: "Le fork est une copie indépendante ; l'original n'est pas touché." },

    { type: "qcm", q: "« git merge upstream/main » sert à…", opts: ["Intégrer les derniers changements de la source dans ta main", "Supprimer ton fork", "Créer une Issue", "Pousser sur upstream"], a: 0, exp: "On resynchronise sa main avec la source." },
    { type: "qcm", q: "Le bouton « Sync fork » de GitHub permet…", opts: ["De mettre son fork à jour en un clic", "De supprimer le projet d'origine", "De forker à nouveau", "De fermer une PR"], a: 0, exp: "La mise à jour sans ligne de commande." },
    { type: "vf", q: "Il vaut mieux travailler directement sur la branche main de son fork.", a: false, exp: "On crée une branche dédiée ; main reste le miroir propre d'upstream." },
    { type: "input", q: "La commande qui liste tes distants pour vérifier origin et upstream :", a: ["git remote -v", "git remote"], ph: "git remote …", exp: "git remote -v affiche les URL de origin et upstream." }
  ],
  final: {
    title: "Exercice final — Ta première contribution open source",
    intro: `<p>Tu repères une faute d'orthographe dans le README d'un projet open source populaire. Tu n'es pas collaborateur : tu vas la corriger proprement grâce au fork. Remets les étapes dans le bon ordre.</p>`,
    questions: [
      { type: "qcm", q: "Toute première étape, sur la page du projet :", opts: ["Cliquer sur Fork pour copier le dépôt sur ton compte", "Demander un accès en écriture au propriétaire", "Cliquer sur Fusionner", "Cloner directement le dépôt d'origine"], a: 0, exp: "Le fork crée ta copie modifiable." },
      { type: "input", q: "Après le fork, quelle commande récupère TON fork sur ta machine ?", a: ["git clone", "git clone https://github.com/toi/projet.git"], ph: "git …", exp: "git clone de l'URL de ton fork." },
      { type: "input", q: "Tu crées une branche dédiée nommée « fix-typo ». Écris la commande :", a: ["git checkout -b fix-typo", "git switch -c fix-typo"], ph: "git checkout -b …", exp: "Une branche pour ne pas toucher main." },
      { type: "input", q: "Après add et commit, la commande qui envoie la branche sur ton fork :", a: ["git push origin fix-typo"], ph: "git push …", exp: "push vers origin (ton fork)." },
      { type: "qcm", q: "Dernière étape pour proposer ta correction au projet d'origine :", opts: ["Ouvrir une Pull Request de ta branche vers le dépôt d'origine", "Supprimer ton fork", "Pousser directement sur upstream", "Fermer l'Issue"], a: 0, exp: "La PR va de ton fork vers upstream ; le propriétaire décide." }
    ],
    solution: `<pre class="pseudo">1. Bouton Fork sur le projet          # copie sur ton compte
2. git clone https://github.com/toi/projet.git   # ton fork en local
3. cd projet
4. git remote add upstream https://github.com/original/projet.git  # la source
5. git checkout -b fix-typo           # branche dediee
6. ... corriger la faute dans le README ...
7. git add README.md
8. git commit -m "Corrige une faute dans le README"
9. git push origin fix-typo           # pousse sur TON fork
10. Sur GitHub : bouton Compare & pull request  # PR vers upstream
    → le proprietaire relit et fusionne (ou pas)</pre>
<p>Tu viens de vivre le cycle exact de toute contribution open source. Demain : le workflow qui organise ce va-et-vient, le GitHub Flow.</p>`
  }
};
