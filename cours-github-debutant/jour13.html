  title: "Fusionner des branches (merge)",
  subtitle: "Réunir le travail d'une branche dans une autre.",
  theory: `
<h3>1. Qu'est-ce que fusionner ?</h3>
<p><strong>Fusionner</strong> (en anglais <em>merge</em>), c'est intégrer les commits d'une branche dans une autre. Après avoir développé une fonctionnalité sur la branche « contact », tu veux la ramener dans « main » : tu fusionnes contact <em>dans</em> main. Les deux pousses de l'arbre se rejoignent en un tronc commun.</p>
<pre class="pseudo">main --------o--------o------------M      # M = commit de fusion : contact rejoint main
              \\                   /
   contact      o----o----o------/         # les commits de contact sont integres dans main</pre>

<h3>2. La règle : on fusionne DANS la branche courante</h3>
<p>Point essentiel : <strong>git merge</strong> intègre une autre branche <strong>dans celle où tu te trouves</strong>. Donc, pour ramener « contact » dans « main », tu dois d'abord te placer sur main, puis fusionner contact.</p>
<pre class="pseudo">git switch main            # 1) se placer sur la branche qui va RECEVOIR (la destination)
git merge contact          # 2) integrer la branche "contact" dans "main"
git branch -d contact      # 3) (optionnel) supprimer contact, devenue inutile apres fusion</pre>
<div class="warn">Erreur classique : lancer <code>git merge</code> depuis la mauvaise branche. Vérifie toujours avec <code>git branch</code> où tu es AVANT de fusionner : tu dois être sur la destination.</div>

<h3>3. Le fast-forward : la fusion la plus simple</h3>
<p>Si main n'a pas bougé depuis que tu as créé contact, Git n'a qu'à « avancer » le repère de main jusqu'au bout de contact : c'est une fusion <strong>fast-forward</strong> (« avance rapide »). Pas de commit de fusion : main glisse simplement en avant.</p>
<pre class="pseudo">avant :  main -> A        contact -> A - B - C
apres :  main -> A - B - C   # main "rattrape" contact : fast-forward, sans commit supplementaire</pre>

<h3>4. La fusion à trois branches (avec commit de fusion)</h3>
<p>Si main a AUSSI évolué de son côté pendant que tu travaillais sur contact, Git combine les deux histoires et crée un <strong>commit de fusion</strong> (merge commit) spécial, qui a deux parents. Git te propose alors un message par défaut du type « Merge branch contact ». C'est normal et sain.</p>
<pre class="pseudo">git switch main
git merge contact          # main a evolue de son cote -> Git cree un commit de fusion (2 parents)
# un editeur peut s'ouvrir pour le message : accepte le message propose, ou modifie-le</pre>
<div class="tip">Un commit de fusion n'est pas un problème : il enregistre proprement la rencontre des deux branches. Il rend l'histoire lisible dans <code>git log --oneline --graph</code>.</div>

<h3>5. Quand ça coince : le conflit</h3>
<p>Parfois, les deux branches ont modifié <strong>la même ligne du même fichier</strong> différemment. Git ne peut pas choisir seul : c'est un <strong>conflit de fusion</strong>. La fusion s'interrompt et te demande de trancher à la main. Pas de panique : c'est le sujet complet de demain (jour 14). Aujourd'hui, retiens seulement que le conflit existe et qu'il se résout.</p>
<pre class="pseudo">git merge contact
CONFLICT (content): Merge conflict in index.html   # Git signale un conflit et met la fusion en pause
# -> il faudra ouvrir le fichier, choisir la bonne version, puis finaliser (jour 14)</pre>
<div class="tip">Sur GitHub (le site), la fusion se fait le plus souvent via une <strong>Pull Request</strong> et son bouton vert « Merge pull request » (jour 16). En local, c'est <code>git merge</code>. Les deux réalisent la même idée : réunir des branches.</div>`,
  exercises: [
    { type: "input", q: "Complète : la commande qui fusionne une branche est git ______", a: ["merge"], ph: "une commande", exp: "git merge <branche>." },
    { type: "qcm", q: "git merge intègre l'autre branche…", opts: ["Dans la branche où tu te trouves", "Toujours dans main", "Sur GitHub directement", "Dans une nouvelle branche"], a: 0, exp: "On fusionne dans la branche courante." },
    { type: "qcm", q: "Pour ramener contact dans main, tu dois d'abord…", opts: ["Te placer sur main (git switch main)", "Te placer sur contact", "Supprimer la branche contact", "Pousser contact sur GitHub"], a: 0, exp: "On se met sur la destination avant de merger." },
    { type: "vf", q: "Il faut toujours vérifier sur quelle branche on est avant de fusionner.", a: true, exp: "git branch évite de fusionner depuis la mauvaise branche." },
    { type: "qcm", q: "Une fusion « fast-forward » se produit quand…", opts: ["La branche destination n'a pas évolué depuis la création de l'autre", "Les deux branches ont changé la même ligne", "Les deux branches ont évolué en parallèle", "On fusionne depuis GitHub"], a: 0, exp: "main avance simplement, sans commit de fusion." },
    { type: "qcm", q: "Un « commit de fusion » (merge commit) …", opts: ["A deux parents et enregistre la rencontre des branches", "Réécrit les commits des deux branches", "Remplace les deux branches par une seule", "N'a qu'un seul parent"], a: 0, exp: "Il combine deux histoires proprement." },
    { type: "input", q: "Complète : supprimer une branche fusionnée devenue inutile : git branch ______ contact", a: ["-d", "d"], ph: "une option", exp: "git branch -d contact." },
    { type: "qcm", q: "Un « conflit de fusion » arrive quand…", opts: ["Les deux branches ont modifié la même ligne différemment", "Une branche a supprimé un fichier", "Les deux branches modifient des fichiers différents", "La destination n'a pas évolué"], a: 0, exp: "Git ne peut pas choisir seul : il faut trancher." },
    { type: "vf", q: "Un conflit de fusion bloque définitivement le dépôt.", a: false, exp: "Il se résout à la main (jour 14) puis la fusion se termine." },
    { type: "input", q: "Complète : pour te placer sur la destination avant merge : git ______ main", a: ["switch", "checkout"], ph: "une commande", exp: "git switch main." },
    { type: "qcm", q: "Après un fast-forward, y a-t-il un commit de fusion ?", opts: ["Non, main avance simplement", "Oui, toujours", "Oui, deux commits", "Oui, avec deux parents"], a: 0, exp: "Le fast-forward ne crée pas de commit de fusion." },
    { type: "vf", q: "Un commit de fusion est un signe de problème à éviter.", a: false, exp: "C'est normal et sain : il enregistre la rencontre des branches." },
    { type: "qcm", q: "Sur GitHub (le site), la fusion se fait souvent via…", opts: ["Une Pull Request et le bouton « Merge pull request »", "L'onglet Branches", "Le bouton Fork", "L'onglet Commits"], a: 0, exp: "La PR est la fusion « web » (jour 16)." },
    { type: "input", q: "Complète : la vue qui dessine les branches fusionnées : git log --oneline ______", a: ["--graph", "graph"], ph: "une option", exp: "--graph dessine l'arbre." },
    { type: "qcm", q: "git merge en local et « Merge pull request » sur GitHub…", opts: ["Réalisent la même idée : réunir des branches", "N'ont aucun rapport", "Créent toujours un conflit", "Fonctionnent sur des dépôts différents"], a: 0, exp: "Deux façons de fusionner." }
  ],
  final: {
    title: "Exercice final — Réunir le travail",
    intro: `<p>Tu as terminé la page contact sur la branche « contact ». La branche main n'a pas bougé entre-temps. Tu veux intégrer contact dans main, puis faire le ménage.</p>`,
    questions: [
      { type: "input", q: "Première commande : se placer sur la branche destination :", a: ["git switch main", "git checkout main"], ph: "git switch …", exp: "On fusionne dans la branche courante." },
      { type: "input", q: "Deuxième commande : fusionner contact dans main :", a: ["git merge contact"], ph: "git merge …", exp: "git merge contact." },
      { type: "qcm", q: "Comme main n'a pas bougé, la fusion sera…", opts: ["Un fast-forward (main avance simplement)", "Un conflit garanti", "Un commit de fusion à deux parents", "Une nouvelle branche"], a: 0, exp: "Rien n'a divergé : avance rapide." },
      { type: "input", q: "Troisième commande : supprimer la branche contact devenue inutile :", a: ["git branch -d contact"], ph: "git branch …", exp: "git branch -d contact." },
      { type: "vf", q: "Si main et contact avaient touché la même ligne, un conflit aurait pu apparaître.", a: true, exp: "Ce cas se résout au jour 14." }
    ],
    solution: `<pre class="pseudo">git branch                 # verifier ou l'on est avant de fusionner
git switch main            # se placer sur la DESTINATION (main recevra contact)
git merge contact          # integrer contact dans main (ici : fast-forward, main avance)
git log --oneline --graph  # verifier que les commits de contact sont bien dans main
git branch -d contact      # menage : supprimer la branche fusionnee, devenue inutile

# Si les deux branches avaient modifie la meme ligne : CONFLICT -> a resoudre (jour 14).</pre>
<p>Tu sais réunir des branches. Demain : que faire quand la fusion coince — résoudre un conflit.</p>`
  }
};
