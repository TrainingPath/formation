var DAY = {
  num: 25,
  title: "Le profil GitHub et son README",
  subtitle: "Ta vitrine publique : ce que les gens voient de toi.",
  theory: `
<h3>1. Le profil, ta carte de visite</h3>
<p>Ton <strong>profil GitHub</strong> est la page publique à l'adresse <code>github.com/ton-pseudo</code>. On y voit ta photo, ta bio, tes dépôts publics, et ton activité. Pour beaucoup de recruteurs et de collègues, c'est la première image qu'ils ont de ton travail. Autant la soigner.</p>
<div class="tip">Modifier son profil : clique sur ta photo en haut à droite ▸ <strong>Your profile</strong> ▸ <strong>Edit profile</strong>. Tu peux régler le nom affiché, la bio, la localisation, un lien vers ton site.</div>

<h3>2. Le graphe de contributions</h3>
<p>Sur ton profil, un damier vert appelé <strong>contribution graph</strong> (« graphe de contributions ») montre ton activité de l'année : chaque jour où tu commits, ouvres une PR ou une Issue, une case verdit. Ce n'est pas un concours, mais il illustre la régularité.</p>

<h3>3. Le README de profil : la fonctionnalité secrète</h3>
<p>GitHub a une astuce peu connue : si tu crées un dépôt <strong>public</strong> dont le nom est <strong>exactement ton pseudo</strong>, et que tu y mets un fichier <code>README.md</code>, ce README s'affiche <strong>en haut de ton profil</strong>, comme une page de présentation.</p>
<pre class="pseudo">Depot nomme  ton-pseudo        # exactement ton pseudo, ni plus ni moins
    + fichier README.md         # son contenu apparait en haut du profil
= une belle presentation personnelle en Markdown</pre>
<div class="tip">GitHub facilite les choses : quand tu crées un dépôt portant ton pseudo, un bandeau apparaît : « You found a secret! …ce dépôt est spécial ». Il te propose même un README de départ.</div>

<h3>4. Que mettre dans son README de profil ?</h3>
<p>Écrit en <strong>Markdown</strong> (le langage de mise en forme vu au jour 8), un bon README de profil contient en général :</p>
<pre class="pseudo"># Bonjour, je suis ...            # un titre d'accueil
- Ce que j'apprends / ce que je fais   # quelques puces claires
- Mes projets phares (avec liens)      # tes meilleurs depots
- Comment me contacter                 # email, reseaux, site</pre>
<p>Reste simple et sincère. Quelques lignes bien écrites valent mieux qu'une page surchargée.</p>

<h3>5. Épingler ses meilleurs dépôts</h3>
<p>Par défaut, GitHub affiche tes dépôts par date. Tu peux choisir de mettre en avant tes préférés avec <strong>Pin</strong> (« épingler ») : jusqu'à six dépôts restent alors affichés en haut, quels que soient leur âge.</p>
<div class="tip">Sur ton profil ▸ section Popular repositories ▸ <strong>Customize your pins</strong> ▸ coche jusqu'à 6 dépôts ▸ Save. Choisis ceux qui te représentent le mieux.</div>
<div class="warn">Ton profil est public : n'y mets aucune donnée que tu ne veux pas voir lue par un inconnu (adresse personnelle, numéro de téléphone privé…). Une adresse e-mail de contact professionnelle suffit.</div>`,
  exercises: [
    { type: "input", q: "Complète l'adresse d'un profil GitHub : « github.com/… »", a: ["ton-pseudo", "pseudo", "nom-utilisateur", "ton pseudo"], ph: "…", exp: "github.com/ton-pseudo est ta page publique." },
    { type: "qcm", q: "Le profil GitHub sert surtout de…", opts: ["Carte de visite publique de ton travail", "Coffre-fort de mots de passe", "Messagerie privée", "Éditeur de code"], a: 0, exp: "C'est la première image que les gens ont de toi." },
    { type: "input", q: "Le bouton pour modifier sa bio et ses infos (deux mots anglais) :", a: ["Edit profile", "edit profile"], ph: "…", exp: "Your profile ▸ Edit profile." },
    { type: "qcm", q: "Le « contribution graph » (damier vert) montre…", opts: ["Ton activité jour par jour sur l'année", "Ton solde bancaire", "Tes mots de passe", "La météo"], a: 0, exp: "Chaque jour d'activité fait verdir une case." },
    { type: "qcm", q: "Pour afficher un README en haut de ton profil, tu crées un dépôt nommé…", opts: ["Exactement ton pseudo", "profil", "readme", "github"], a: 0, exp: "Un dépôt public au nom exact de ton pseudo." },
    { type: "input", q: "Le nom exact du fichier à mettre dans ce dépôt spécial :", a: ["README.md", "readme.md", "README"], ph: "…", exp: "README.md s'affiche en haut du profil." },
    { type: "qcm", q: "Le README de profil doit être dans un dépôt…", opts: ["Public", "Privé", "Supprimé", "Forké"], a: 0, exp: "Privé, il ne s'afficherait pas publiquement." },
    { type: "input", q: "Le langage de mise en forme dans lequel s'écrit un README :", a: ["Markdown", "markdown"], ph: "…", exp: "Le Markdown, vu au jour 8." },
    { type: "qcm", q: "Un bon README de profil contient plutôt…", opts: ["Une présentation simple et sincère avec quelques puces", "Mille lignes de texte serré", "Ton mot de passe", "Le code source complet"], a: 0, exp: "Quelques lignes claires valent mieux qu'une page surchargée." },
    { type: "input", q: "Le verbe anglais (bouton) pour épingler un dépôt en haut de son profil :", a: ["Pin", "pin"], ph: "…", exp: "Pin met en avant tes meilleurs dépôts." },
    { type: "qcm", q: "Combien de dépôts peut-on épingler au maximum ?", opts: ["Six", "Un seul", "Cent", "Zéro"], a: 0, exp: "Jusqu'à six dépôts épinglés." },
    { type: "vf", q: "Par défaut, un profil affiche les dépôts par date, pas par importance.", a: true, exp: "C'est pourquoi on épingle ses préférés pour les mettre en avant." },
    { type: "vf", q: "On peut mettre son numéro de téléphone privé dans son profil sans risque.", a: false, exp: "Le profil est public : évite les données personnelles sensibles." },
    { type: "qcm", q: "Épingler ses dépôts sert à…", opts: ["Mettre en avant ses meilleurs projets, quel que soit leur âge", "Supprimer les vieux dépôts", "Cacher son profil", "Changer de pseudo"], a: 0, exp: "Tu choisis ce que les visiteurs voient en premier." },
    { type: "input", q: "Dans « Customize your pins », combien de dépôts au maximum peux-tu cocher ?", a: ["6", "six"], ph: "…", exp: "Six dépôts épinglés au maximum." }
  ],
  final: {
    title: "Exercice final — Soigner sa vitrine",
    intro: `<p>Tu veux transformer ton profil GitHub tout nu en une vraie vitrine : une présentation en haut, et tes trois meilleurs projets bien visibles.</p>`,
    questions: [
      { type: "input", q: "Pour la présentation en haut du profil, quel doit être le nom EXACT du dépôt à créer ?", a: ["ton-pseudo", "pseudo", "mon pseudo", "ton pseudo"], ph: "…", exp: "Un dépôt public au nom exact de ton pseudo." },
      { type: "input", q: "Quel fichier y ajoutes-tu pour qu'il s'affiche sur le profil ?", a: ["README.md", "readme.md", "README"], ph: "…", exp: "README.md, écrit en Markdown." },
      { type: "qcm", q: "Ce dépôt doit être…", opts: ["Public", "Privé", "Archivé", "Forké d'un autre"], a: 0, exp: "Sinon le README ne s'afficherait pas." },
      { type: "input", q: "Pour mettre tes trois projets en avant en haut du profil, quel bouton utilises-tu ? (mot anglais)", a: ["Pin", "pin", "Customize your pins"], ph: "…", exp: "Pin / Customize your pins." },
      { type: "vf", q: "Tu peux épingler tes trois projets même s'ils ne sont pas les plus récents.", a: true, exp: "L'épinglage ignore la date : tu choisis librement." }
    ],
    solution: `<pre class="pseudo">1. Nouveau depot PUBLIC nomme exactement : ton-pseudo
   ▸ bandeau « You found a secret! »
2. Ajouter README.md (Markdown) :
     # Bonjour, je suis ...
     - J'apprends le developpement web
     - Mes projets : [portfolio](lien), [appli-meteo](lien)
     - Me contacter : email pro
   commit + push ▸ il apparait en haut du profil

3. Profil ▸ Customize your pins ▸ cocher les 3 meilleurs depots ▸ Save
   → ils restent affiches en avant, quel que soit leur age.

4. Edit profile : photo, bio courte, lien vers ton site.</pre>
<p>Ton profil raconte maintenant qui tu es et ce que tu sais faire. Demain : partager de petits bouts de code avec les Gists.</p>`
  }
};
