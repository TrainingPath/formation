<script>
var DAY = {
  num: 31,
  title: "Projet final : publier et documenter un projet",
  subtitle: "Le grand jour : rassembler tout ce que tu sais en un dépôt exemplaire.",
  theory: `
<h3>1. L'objectif du projet final</h3>
<p>Aujourd'hui, tu réunis tout le cours en une seule réalisation : un <strong>dépôt propre, documenté et publié en ligne</strong>. Prends un petit projet (une page web, un mini-outil, un jeu simple) et transforme-le en une vitrine dont tu seras fier. Un dépôt exemplaire se reconnaît à cinq éléments : un <strong>README</strong>, une <strong>licence</strong>, un <strong>.gitignore</strong>, un historique propre, et une <strong>publication</strong> (release + site).</p>

<h3>2. Le README : la porte d'entrée</h3>
<p>Le <strong>README.md</strong> est la première chose que voit un visiteur. Écrit en Markdown, il répond aux questions essentielles :</p>
<pre class="pseudo"># Nom du projet          # le titre
Une phrase qui dit ce que fait le projet et a qui il sert.

## Installation          # comment le recuperer et le lancer
## Utilisation           # comment s'en servir, avec un exemple
## Capture / demo        # une image ou un lien vers le site en ligne
## Licence               # sous quelle licence il est distribue</pre>

<h3>3. La licence : donner le droit d'utiliser</h3>
<p>Sans <strong>licence</strong>, un projet public est visible mais légalement « tous droits réservés » : personne n'a le droit de le réutiliser. Ajouter une licence, c'est préciser ce que les autres peuvent faire. Les plus courantes :</p>
<pre class="pseudo">MIT          # tres permissive : fais-en ce que tu veux, garde juste le copyright
Apache-2.0   # permissive, avec des clauses sur les brevets
GPL-3.0      # « copyleft » : les versions derivees doivent rester libres aussi</pre>
<div class="tip">GitHub facilite l'ajout : bouton <strong>Add file</strong> ▸ <strong>Create new file</strong> ▸ nomme-le <code>LICENSE</code> ▸ un bouton <strong>Choose a license template</strong> apparaît pour insérer le texte officiel. Ou coche « Add a license » à la création du dépôt.</div>

<h3>4. Le .gitignore : ne versionner que l'utile</h3>
<p>Le fichier <strong>.gitignore</strong> (vu au jour 9) liste ce que Git doit <strong>ignorer</strong> : fichiers temporaires, dossiers de dépendances, et surtout <strong>secrets</strong>. C'est ta dernière barrière contre le commit accidentel d'un mot de passe.</p>
<pre class="pseudo">node_modules/     # dependances : lourdes et reconstituables, on ne les versionne pas
.env              # variables et secrets locaux : JAMAIS dans le depot (rappel jour 27)
*.log             # fichiers journaux
.DS_Store         # fichiers systeme inutiles</pre>

<h3>5. Publier : release + GitHub Pages</h3>
<p>Enfin, on rend le projet vivant et accessible :</p>
<pre class="pseudo">1. git tag -a v1.0 -m "Premiere version" && git push origin v1.0   # marquer la version (jour 23)
2. Releases ▸ Draft a new release ▸ notes + fichiers ▸ Publish     # la version officielle
3. Settings ▸ Pages ▸ Deploy from a branch ▸ main /(root) ▸ Save   # le site en ligne (jour 24)</pre>
<p>Le lien du site publié se met joliment dans le README et dans la section <strong>About</strong> (la petite description à droite du dépôt). Ton projet est alors consultable, cloneable, réutilisable — et présentable à un recruteur.</p>
<div class="warn">Avant la publication finale, fais un dernier <code>git status</code> et parcours l'historique : aucun secret, aucun fichier inutile, des messages de commit clairs. Un dépôt public est lu par tous, pour toujours.</div>
<div class="tip">Récapitulatif du dépôt exemplaire : <strong>README</strong> clair · <strong>LICENSE</strong> · <strong>.gitignore</strong> · historique propre (GitHub Flow) · <strong>release</strong> taguée · <strong>Pages</strong> en ligne. Coche ces six cases et tu tiens un projet dont tu peux être fier. Bravo pour ces 31 jours !</div>`,
  exercises: [
    { type: "qcm", q: "Un dépôt « exemplaire » se reconnaît notamment à…", opts: ["Un README, une licence, un .gitignore, un historique propre et une publication", "Un seul commit géant", "L'absence de documentation", "Le dossier node_modules versionné"], a: 0, exp: "Les cinq marques d'un dépôt soigné." },
    { type: "input", q: "Le nom du fichier qui sert de porte d'entrée et de documentation principale :", a: ["README.md", "readme.md", "README"], ph: "…", exp: "README.md, écrit en Markdown." },
    { type: "qcm", q: "Le README répond surtout à…", opts: ["Ce que fait le projet, comment l'installer et l'utiliser", "La liste complète de tes commits", "La configuration de ton éditeur de code", "L'historique détaillé des branches"], a: 0, exp: "Présentation, installation, utilisation, licence." },
    { type: "qcm", q: "Sans licence, un projet public est…", opts: ["Légalement « tous droits réservés » : non réutilisable", "Libre pour tout le monde", "Placé automatiquement sous licence MIT", "Rendu privé sans ton accord"], a: 0, exp: "La licence donne le droit d'utiliser ; sans elle, rien n'est permis." },
    { type: "input", q: "Le nom de la licence très permissive, la plus courante (trois lettres) :", a: ["MIT", "mit"], ph: "…", exp: "La licence MIT : fais-en ce que tu veux, garde le copyright." },
    { type: "qcm", q: "Une licence « copyleft » comme la GPL impose que…", opts: ["Les versions dérivées restent libres aussi", "Tu conserves seul tous les droits", "Le copyright disparaisse totalement", "Toute réutilisation soit interdite"], a: 0, exp: "Le copyleft propage la liberté aux dérivés." },
    { type: "input", q: "Le nom exact du fichier de licence (sans extension) qu'on ajoute à la racine :", a: ["LICENSE", "license"], ph: "…", exp: "Le fichier LICENSE ; GitHub propose des modèles." },
    { type: "input", q: "Le fichier qui liste ce que Git doit ignorer (commence par un point) :", a: [".gitignore", "gitignore"], ph: "…", exp: "Le .gitignore, vu au jour 9." },
    { type: "qcm", q: "Que doit-on absolument mettre dans le .gitignore ?", opts: ["Les secrets et fichiers comme .env", "Le README", "La licence", "Le code source principal"], a: 0, exp: "Le .env et les secrets : dernière barrière avant l'accident." },
    { type: "vf", q: "On devrait versionner le dossier node_modules (les dépendances) dans le dépôt.", a: false, exp: "Non : lourd et reconstituable, on l'ignore via le .gitignore." },
    { type: "input", q: "Commande pour taguer la première version en v1.0 (tag annoté avec message) :", a: ["git tag -a v1.0 -m \"Premiere version\"", "git tag -a v1.0 -m \"...\""], ph: "git tag -a v1.0 -m \"…\"", exp: "Un tag annoté marque la version (jour 23)." },
    { type: "qcm", q: "Pour mettre le projet en ligne comme site, on utilise…", opts: ["Settings ▸ Pages ▸ Deploy from a branch", "L'onglet Issues", "Un Gist secret", "Une release taguée"], a: 0, exp: "GitHub Pages publie le site (jour 24)." },
    { type: "qcm", q: "La section « About » d'un dépôt sert à…", opts: ["Donner une courte description et le lien du site", "Lister tous les contributeurs", "Configurer les branches protégées", "Afficher l'historique des commits"], a: 0, exp: "La petite fiche à droite : description + lien du site." },
    { type: "vf", q: "Avant de publier, on fait un dernier contrôle pour s'assurer qu'aucun secret ni fichier inutile n'est présent.", a: true, exp: "Un dépôt public est lu par tous, pour toujours." },
    { type: "vf", q: "Le lien du site publié a sa place dans le README et dans la section About.", a: true, exp: "On met le projet en avant là où les visiteurs regardent." }
  ],
  final: {
    title: "Exercice final — La check-list de publication",
    intro: `<p>Ton petit projet (une page web « Convertisseur d'unités ») est codé et fonctionne en local. Tu vas le transformer en dépôt exemplaire, publié et documenté. Voici ta check-list.</p>`,
    questions: [
      { type: "input", q: "Premier fichier de documentation à rédiger à la racine :", a: ["README.md", "readme.md", "README"], ph: "…", exp: "Le README présente et documente le projet." },
      { type: "input", q: "Fichier à ajouter pour autoriser la réutilisation (licence permissive MIT). Donne le nom du fichier :", a: ["LICENSE", "license"], ph: "…", exp: "Le fichier LICENSE, ici avec le modèle MIT." },
      { type: "input", q: "Fichier qui empêche de versionner .env et les fichiers inutiles :", a: [".gitignore", "gitignore"], ph: "…", exp: "Le .gitignore, ta barrière anti-secret." },
      { type: "qcm", q: "Pour publier la version officielle 1.0 avec des notes…", opts: ["Créer un tag v1.0 puis une release (Draft a new release)", "Activer GitHub Pages", "Ouvrir une Issue", "Créer une nouvelle branche"], a: 0, exp: "Tag + release : la version officielle (jour 23)." },
      { type: "qcm", q: "Pour rendre le convertisseur consultable en ligne…", opts: ["Activer GitHub Pages (Settings ▸ Pages)", "Le mettre dans un Gist secret", "Le laisser en local", "Le forker"], a: 0, exp: "GitHub Pages met le site en ligne (jour 24)." }
    ],
    solution: `<pre class="pseudo">CHECK-LIST DU DEPOT EXEMPLAIRE

[ ] README.md      titre, description, installation, utilisation,
                   capture/demo, lien du site, licence
[ ] LICENSE        ex. MIT (Add file ▸ Choose a license template)
[ ] .gitignore     .env, node_modules/, *.log, .DS_Store ...
[ ] Historique     GitHub Flow : branches + PR, messages clairs
                   (dernier git status : aucun secret, rien d'inutile)
[ ] Release        git tag -a v1.0 -m "Premiere version"
                   git push origin v1.0
                   Releases ▸ Draft a new release ▸ notes ▸ Publish
[ ] GitHub Pages   Settings ▸ Pages ▸ Deploy from a branch
                   main /(root) ▸ Save
[ ] About          courte description + lien du site en ligne

Resultat : un projet consultable, cloneable, reutilisable,
et presentable a un recruteur. Les 6 cases cochees = mission reussie.</pre>
<p>Félicitations : 31 jours, et te voilà capable de versionner, collaborer, sécuriser et publier sur GitHub. Ce dépôt exemplaire est le premier d'une longue série. Continue de brancher, de committer proprement et de partager. Bravo !</p>`
  }
};
</script>
