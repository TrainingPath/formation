var DAY = {
  num: 4,
  title: "Créer un premier dépôt (repository)",
  subtitle: "Le dépôt : la boîte qui contient ton projet et son histoire.",
  theory: `
<h3>1. Qu'est-ce qu'un dépôt ?</h3>
<p>Un <strong>dépôt</strong> (en anglais <em>repository</em>, souvent abrégé <strong>repo</strong>) est le dossier de ton projet suivi par Git : il contient tes fichiers ET tout leur historique. Imagine un classeur qui range non seulement les feuilles actuelles, mais aussi toutes les versions passées de chaque feuille. Ce classeur, c'est le dépôt.</p>
<p>Il existe deux façons de créer un dépôt, et il faut bien les distinguer : en <strong>local</strong> avec une commande Git, ou sur <strong>GitHub</strong> avec des clics dans le site.</p>

<h3>2. Créer un dépôt en local : git init</h3>
<p>La commande <strong>git init</strong> (init = « initialiser ») transforme un dossier ordinaire en dépôt Git. Elle crée un sous-dossier caché nommé <code>.git</code> : c'est là que Git range tout l'historique. Tu n'as jamais à toucher ce dossier, mais sache qu'il est le cœur du dépôt.</p>
<pre class="pseudo">mkdir mon-projet          # cree un dossier vide nomme mon-projet (commande systeme, pas Git)
cd mon-projet             # entre dans ce dossier
git init                  # transforme le dossier en depot Git (cree le sous-dossier cache .git)
git status                # verifie : Git repond qu'il suit desormais ce dossier</pre>
<div class="tip">Le dossier caché <strong>.git</strong> est la « mémoire » du dépôt. Si tu le supprimais, le dossier redeviendrait un dossier ordinaire, sans historique.</div>

<h3>3. Créer un dépôt sur GitHub : le site web</h3>
<p>Sur la plateforme, on ne tape pas de commande : on clique. Voici le chemin :</p>
<pre class="pseudo">github.com ▸ bouton "+" (en haut a droite) ▸ "New repository"
  ▸ Repository name : le nom du projet          # ex : mon-projet
  ▸ Description      : une phrase (facultatif)
  ▸ Public / Private : qui peut le voir          # public = tous ; prive = invites
  ▸ "Add a README"   : case a cocher              # cree un fichier de presentation (jour 8)
  ▸ bouton "Create repository"                    # le depot distant est cree</pre>
<div class="warn">Cocher « Add a README » sur GitHub crée déjà un premier fichier (et un premier commit) dans le dépôt distant. Utile pour démarrer, mais bon à savoir quand tu voudras le relier à un dépôt local.</div>

<h3>4. Public ou privé ?</h3>
<p>À la création sur GitHub, tu choisis la <strong>visibilité</strong>. Un dépôt <strong>public</strong> est lisible par tout le monde sur Internet (idéal pour partager, montrer, apprendre). Un dépôt <strong>privé</strong> n'est visible que par toi et les collaborateurs que tu invites (idéal pour un travail personnel ou confidentiel).</p>

<h3>5. Local puis distant : l'ordre habituel</h3>
<p>Deux scénarios existent. Soit tu crées d'abord le dépôt sur GitHub puis tu le récupères (on verra « cloner » au jour 5). Soit tu crées d'abord en local avec <code>git init</code>, puis tu le relies plus tard à GitHub (on verra « push » au jour 7). Aujourd'hui, retiens surtout la naissance du dépôt : <code>git init</code> en local, ou « New repository » sur GitHub.</p>
<pre class="pseudo"># Deux points de depart possibles :
git init                  # A) je commence sur ma machine (local), je relierai GitHub plus tard
# ou
New repository (sur GitHub)  # B) je commence sur le site, je recupererai en local plus tard</pre>
<div class="tip">Un même projet finit souvent avec les deux : un dépôt local (chez toi) ET un dépôt distant (sur GitHub), reliés ensemble. Les jours suivants montreront comment.</div>`,
  exercises: [
    { type: "input", q: "Complète : le mot anglais pour « dépôt » est ______.", a: ["repository", "repo"], ph: "un mot anglais", exp: "Repository (repo) = dépôt." },
    { type: "input", q: "Complète la commande qui crée un dépôt en local : git ______", a: ["init"], ph: "une commande", exp: "git init initialise un dépôt." },
    { type: "qcm", q: "git init crée un sous-dossier caché nommé…", opts: [".git", ".github", "repo", "history"], a: 0, exp: "Le dossier .git contient tout l'historique." },
    { type: "qcm", q: "Le dossier .git contient…", opts: ["Tout l'historique du dépôt", "Seulement la dernière version des fichiers", "Une copie du dépôt distant origin", "Les fichiers que tu as ignorés"], a: 0, exp: "C'est la mémoire du dépôt." },
    { type: "vf", q: "Supprimer le dossier .git fait perdre l'historique du dépôt.", a: true, exp: "Sans .git, le dossier redevient ordinaire." },
    { type: "qcm", q: "Pour créer un dépôt sur GitHub, on…", opts: ["Clique sur « + » ▸ New repository", "Tape git init", "Tape git clone dans le terminal", "Utilise la commande git remote add"], a: 0, exp: "Sur le site, tout se fait par clics." },
    { type: "input", q: "Complète : sur GitHub, le bouton pour créer un dépôt s'appelle « New ______ ».", a: ["repository", "repo"], ph: "un mot", exp: "New repository." },
    { type: "qcm", q: "Un dépôt public est…", opts: ["Visible par tout le monde sur Internet", "Visible par toi seul", "Impossible à créer gratuitement", "Modifiable par n'importe quel internaute"], a: 0, exp: "Public = ouvert à tous." },
    { type: "qcm", q: "Un dépôt privé est visible par…", opts: ["Toi et les collaborateurs invités", "Tout Internet", "Personne", "Tous les utilisateurs de GitHub"], a: 0, exp: "Privé = accès restreint." },
    { type: "vf", q: "Cocher « Add a README » sur GitHub crée déjà un premier fichier dans le dépôt.", a: true, exp: "Cela ajoute un README et un premier commit." },
    { type: "input", q: "Complète la commande système qui crée un dossier : ______ mon-projet", a: ["mkdir"], ph: "une commande", exp: "mkdir crée un dossier (commande système, pas Git)." },
    { type: "qcm", q: "Après git init, quelle commande vérifie que Git suit le dossier ?", opts: ["git status", "git version", "git help", "git list"], a: 0, exp: "git status montre l'état du dépôt." },
    { type: "vf", q: "git init s'utilise sur le site GitHub, dans le navigateur.", a: false, exp: "git init est une commande locale ; sur GitHub on clique." },
    { type: "qcm", q: "Un même projet peut finir avec…", opts: ["Un dépôt local ET un dépôt distant reliés", "Uniquement un dépôt local, jamais distant", "Un dépôt local qu'on ne peut jamais relier à GitHub", "Deux comptes GitHub obligatoires"], a: 0, exp: "Local + distant reliés, c'est le cas courant." },
    { type: "input", q: "Complète : entrer dans un dossier en ligne de commande se fait avec ______ mon-projet", a: ["cd"], ph: "une commande", exp: "cd (change directory) entre dans le dossier." }
  ],
  final: {
    title: "Exercice final — Naissance d'un dépôt",
    intro: `<p>Tu veux démarrer un projet « carnet » sur ta machine, en local, avec Git. Réfléchis aux gestes et commandes de création.</p>`,
    questions: [
      { type: "input", q: "Commande qui transforme le dossier courant en dépôt Git :", a: ["git init"], ph: "git …", exp: "git init crée le dépôt local." },
      { type: "qcm", q: "Juste après git init, un sous-dossier apparaît :", opts: [".git (caché, l'historique)", ".exe", ".zip", "images"], a: 0, exp: "Le fameux dossier .git." },
      { type: "input", q: "Commande pour vérifier l'état du nouveau dépôt :", a: ["git status"], ph: "git …", exp: "git status confirme le suivi." },
      { type: "vf", q: "Créer le dépôt sur GitHub se fait par le bouton « New repository », sans commande.", a: true, exp: "Sur le site : clics uniquement." },
      { type: "qcm", q: "Choisir « Private » à la création signifie…", opts: ["Seuls toi et tes invités verront le dépôt", "Tout le monde le verra", "Le dépôt ne pourra pas recevoir de commits", "Le dépôt sera visible par les moteurs de recherche"], a: 0, exp: "Privé = restreint." }
    ],
    solution: `<pre class="pseudo"># Creation en LOCAL avec Git :
mkdir carnet              # cree le dossier du projet
cd carnet                # on entre dedans
git init                 # devient un depot Git (cree le dossier cache .git)
git status               # verifie : Git suit desormais ce dossier

# Creation sur GITHUB (site web, par clics) :
# github.com ▸ "+" ▸ New repository ▸ nom "carnet" ▸ Public/Private ▸ Create repository</pre>
<p>Ton dépôt existe. Demain : récupérer un dépôt distant sur ta machine, c'est le clonage.</p>`
  }
};
