<script>
var DAY = {
  num: 17,
  title: "Relire et commenter une Pull Request",
  subtitle: "Proposer du code, c'est bien. Le relire ensemble, c'est mieux.",
  theory: `
<h3>1. Qu'est-ce que la relecture d'une Pull Request ?</h3>
<p>Une <strong>Pull Request</strong> (souvent abrégée <strong>PR</strong>, « demande de tirage ») est une proposition : « voici mes changements, acceptez-vous de les intégrer ? ». La <strong>relecture</strong> (en anglais <em>code review</em>, « revue de code ») est le moment où une autre personne lit ces changements, pose des questions et donne son avis <strong>avant</strong> la fusion.</p>
<p>Le but n'est pas de juger la personne, mais d'améliorer le code ensemble : repérer un bug, clarifier un nom, suggérer plus simple. C'est un des gestes les plus utiles du travail en équipe.</p>

<h3>2. L'onglet « Files changed »</h3>
<p>Sur la page d'une PR, l'onglet <strong>Files changed</strong> (« fichiers modifiés ») montre le <strong>diff</strong> : les lignes ajoutées apparaissent en vert avec un <code>+</code>, les lignes supprimées en rouge avec un <code>-</code>. C'est là que se fait l'essentiel de la relecture.</p>
<div class="tip">Chemin dans l'interface : ouvre la PR ▸ onglet <strong>Files changed</strong>. Passe la souris sur une ligne : un petit <strong>+</strong> bleu apparaît à gauche pour commenter cette ligne précise.</div>

<h3>3. Trois façons de commenter</h3>
<p>GitHub propose trois niveaux de commentaire :</p>
<pre class="pseudo">Commentaire de ligne   # clic sur le + bleu d'une ligne : remarque attachée à cette ligne
Commentaire général    # onglet Conversation, en bas : un message pour toute la PR
Revue groupée          # bouton Review changes : plusieurs remarques envoyées d'un coup</pre>
<p>Le bouton <strong>Review changes</strong> (« relire les changements », en haut à droite de « Files changed ») regroupe tes remarques et te fait choisir une conclusion.</p>

<h3>4. Les trois verdicts d'une revue</h3>
<p>Quand tu termines une revue, tu choisis une option :</p>
<pre class="pseudo">Comment   # simple remarque, ni approbation ni blocage
Approve   # « c'est bon pour moi » : tu approuves la fusion
Request changes   # « changements demandes » : tu bloques tant que ce n'est pas corrige</pre>
<p><strong>Approve</strong> = feu vert. <strong>Request changes</strong> = feu rouge : l'auteur doit corriger avant de pouvoir fusionner. <strong>Comment</strong> = feu orange, un avis sans décision.</p>

<h3>5. Les suggestions de code</h3>
<p>GitHub permet de proposer une correction directement applicable : dans un commentaire de ligne, clique sur l'icône <strong>Suggestion</strong> (les deux petits documents) et écris le code corrigé. L'auteur pourra l'accepter en un clic avec <strong>Commit suggestion</strong>.</p>
<div class="warn">Une revue n'est pas un ordre : reste courtois, explique le pourquoi. « On pourrait renommer ceci pour plus de clarté ? » vaut mieux que « c'est faux ». Un bon commentaire aide, il n'humilie pas.</div>
<div class="tip">Répondre à une remarque et cliquer sur <strong>Resolve conversation</strong> (« marquer la discussion comme résolue ») garde la PR lisible : on voit d'un coup d'œil ce qui reste à traiter.</div>`,
  exercises: [
    { type: "input", q: "Le sigle de trois lettres qui désigne une Pull Request :", a: ["PR"], ph: "…", exp: "PR = Pull Request." },
    { type: "input", q: "Le nom de l'onglet d'une PR où l'on voit le diff des fichiers :", a: ["Files changed", "files changed"], ph: "…", exp: "L'onglet Files changed montre les lignes ajoutées et supprimées." },
    { type: "qcm", q: "Dans un diff, une ligne verte précédée d'un + signifie…", opts: ["Une ligne ajoutée", "Une ligne supprimée", "Une ligne inchangée", "Une ligne de contexte"], a: 0, exp: "Vert et + = ajout ; rouge et - = suppression." },
    { type: "qcm", q: "Le terme anglais pour « relecture de code » est…", opts: ["Code review", "Code merge", "Code push", "Code clone"], a: 0, exp: "Code review = revue de code." },
    { type: "input", q: "Le bouton qui regroupe plusieurs remarques et propose un verdict :", a: ["Review changes", "review changes"], ph: "…", exp: "Review changes envoie toutes tes remarques d'un coup." },
    { type: "qcm", q: "Le verdict « Approve » signifie…", opts: ["C'est bon pour moi, on peut fusionner", "Je bloque la PR", "Je supprime la PR", "Je ferme la PR sans la fusionner"], a: 0, exp: "Approve = feu vert." },
    { type: "qcm", q: "Le verdict « Request changes » a pour effet…", opts: ["De demander des corrections avant fusion", "De fusionner tout de suite", "De supprimer la branche", "De créer une Issue"], a: 0, exp: "Il bloque la fusion tant que l'auteur n'a pas corrigé." },
    { type: "input", q: "Le verdict qui donne un avis sans approuver ni bloquer :", a: ["Comment", "comment"], ph: "…", exp: "Comment = une simple remarque, feu orange." },
    { type: "qcm", q: "Une « suggestion » de code dans un commentaire permet…", opts: ["À l'auteur d'appliquer la correction en un clic", "De supprimer le fichier", "De fermer la PR", "De fusionner la PR automatiquement"], a: 0, exp: "L'auteur clique sur Commit suggestion." },
    { type: "vf", q: "Pour commenter une ligne précise, on clique sur le petit + bleu qui apparaît à gauche de cette ligne.", a: true, exp: "C'est le commentaire de ligne, attaché à un endroit précis du code." },
    { type: "vf", q: "Approuver une PR supprime automatiquement le dépôt.", a: false, exp: "Approuver ne fait que donner un feu vert ; rien n'est supprimé." },
    { type: "input", q: "L'action « Resolve … » qui marque une discussion comme réglée (un mot anglais) :", a: ["conversation", "Resolve conversation"], ph: "Resolve …", exp: "Resolve conversation range les remarques traitées." },
    { type: "qcm", q: "Le but principal d'une relecture de code est…", opts: ["Améliorer le code ensemble et repérer les problèmes", "Juger la valeur de la personne", "Ralentir le projet", "Augmenter le nombre de commits"], a: 0, exp: "On relit le code, pas la personne." },
    { type: "vf", q: "Un bon commentaire de revue explique le pourquoi et reste courtois.", a: true, exp: "« On pourrait clarifier ceci ? » aide plus que « c'est faux »." },
    { type: "qcm", q: "Un commentaire général sur toute la PR se laisse…", opts: ["Dans l'onglet Conversation", "Dans les Settings du dépôt", "Dans le fichier README", "Dans les Releases"], a: 0, exp: "L'onglet Conversation reçoit les messages qui concernent la PR entière." }
  ],
  final: {
    title: "Exercice final — Relire la PR d'un collègue",
    intro: `<p>Ton collègue ouvre une PR nommée « Ajout de la page de contact ». Tu ouvres l'onglet Files changed et tu vois :</p><pre class="pseudo">+ &lt;h1&gt;Contactez-nous&lt;/h1&gt;      # ligne verte : ajoutee
+ &lt;p&gt;Email : contct@site.fr&lt;/p&gt;  # verte, mais « contct » semble mal orthographie
- &lt;p&gt;Ancienne adresse&lt;/p&gt;        # ligne rouge : supprimee</pre><p>Tu remarques la faute de frappe dans l'adresse e-mail.</p>`,
    questions: [
      { type: "input", q: "Sur quel onglet de la PR es-tu pour voir ces lignes ?", a: ["Files changed", "files changed"], ph: "…", exp: "Files changed affiche le diff." },
      { type: "qcm", q: "Que signifie la ligne rouge précédée d'un - ?", opts: ["Elle a été supprimée", "Elle a été ajoutée", "Elle contient un bug", "Elle est approuvée"], a: 0, exp: "Rouge et - = suppression." },
      { type: "qcm", q: "Le meilleur moyen de signaler la faute « contct » est…", opts: ["Un commentaire de ligne, avec une suggestion de correction", "Fermer la PR sans explication", "Ouvrir une Issue à part sans pointer la ligne", "Approuver la PR telle quelle"], a: 0, exp: "Un commentaire de ligne pointe l'endroit exact ; la suggestion propose « contact »." },
      { type: "input", q: "Quel verdict choisis-tu tant que la faute n'est pas corrigée ? (deux mots anglais)", a: ["Request changes", "request changes"], ph: "…", exp: "Request changes bloque la fusion jusqu'à correction." },
      { type: "vf", q: "Une fois la suggestion appliquée par l'auteur, tu peux repasser en revue et choisir Approve.", a: true, exp: "Après correction, tu approuves et la PR peut être fusionnée." }
    ],
    solution: `<pre class="pseudo">1. Ouvrir la PR ▸ onglet Files changed         # on lit le diff
2. Survoler la ligne de l'email ▸ cliquer le + bleu   # commentaire de ligne
3. Ecrire une Suggestion : contact@site.fr     # correction applicable en un clic
4. Bouton Review changes ▸ choisir Request changes    # on bloque poliment
5. L'auteur clique Commit suggestion ▸ corrige # la faute est reparee
6. Nouvelle revue ▸ Approve                     # feu vert, la PR peut fusionner</pre>
<p>Relire, c'est collaborer : on pointe l'endroit exact, on propose la solution, on reste courtois. Demain : organiser le travail avec les Issues.</p>`
  }
};
</script>
