  num: 21,
  title: "Le workflow collaboratif (GitHub Flow)",
  subtitle: "Une méthode simple pour travailler à plusieurs sans se marcher dessus.",
  theory: `
<h3>1. Qu'est-ce qu'un workflow ?</h3>
<p>Un <strong>workflow</strong> (« flux de travail ») est une méthode convenue : une suite d'étapes que toute l'équipe suit dans le même ordre. Sans règle commune, chacun pousse n'importe où et le projet devient vite un chaos. Le <strong>GitHub Flow</strong> est le workflow le plus simple et le plus répandu.</p>

<h3>2. La règle d'or : main est toujours sain</h3>
<p>La branche <strong>main</strong> (autrefois <em>master</em>) est sacrée : elle contient toujours une version <strong>qui fonctionne</strong>, prête à être déployée. On ne modifie <strong>jamais</strong> main directement. Toute nouveauté passe d'abord par une autre branche.</p>
<div class="warn">Ne pousse jamais un travail en cours directement sur main. Si main est cassé, c'est tout le monde qui est bloqué.</div>

<h3>3. Les cinq étapes du GitHub Flow</h3>
<pre class="pseudo">1. BRANCHE   git checkout -b ajout-recherche   # une branche par fonctionnalite, au nom parlant
2. COMMITS   git add . && git commit -m "..."  # de petits commits clairs au fil du travail
3. PUSH      git push origin ajout-recherche   # on envoie la branche sur GitHub
4. PULL REQUEST   # on ouvre une PR : l'equipe relit et discute
5. MERGE     # apres relecture et approbation, on fusionne dans main, puis on supprime la branche</pre>
<p>À chaque tour de ce cycle, une petite amélioration entre dans main, déjà relue et testée. Le projet avance par petits pas sûrs.</p>

<h3>4. Nommer ses branches</h3>
<p>Un bon nom de branche décrit ce qu'elle contient. Beaucoup d'équipes utilisent un préfixe :</p>
<pre class="pseudo">feature/panier-achat   # feature = nouvelle fonctionnalite
fix/bug-connexion      # fix = correction d'un bug
docs/guide-install     # docs = documentation</pre>
<p>Le nom <code>ma-branche</code> ne dit rien ; <code>fix/bug-connexion</code> se comprend d'un coup d'œil.</p>

<h3>5. Après la fusion : on nettoie</h3>
<p>Une fois la PR fusionnée, la branche a fini son travail. On la supprime pour garder le dépôt propre. GitHub propose un bouton <strong>Delete branch</strong> juste après le merge.</p>
<pre class="pseudo">git checkout main            # on revient sur main
git pull origin main         # on recupere la version fusionnee, a jour
git branch -d ajout-recherche  # on efface la branche locale devenue inutile</pre>
<div class="tip">Le GitHub Flow tient en une phrase : <strong>une branche par idée, une Pull Request pour la relire, un merge dans main quand c'est prêt</strong>. Simple, sûr, et utilisé partout.</div>
<div class="tip">Ce flux fonctionne aussi bien seul qu'à plusieurs : même pour tes projets perso, brancher et faire une PR t'oblige à relire ton propre travail.</div>`,

    { type: "qcm", q: "Avant de fusionner une branche dans main, on passe par…", opts: ["Une Pull Request relue par l'équipe", "Un tag de version obligatoire", "Un fork obligatoire", "Rien du tout"], a: 0, exp: "La PR permet la relecture avant le merge." },
    { type: "input", q: "Un bon nom de branche pour corriger un bug de connexion, avec un préfixe usuel :", a: ["fix/bug-connexion", "fix/connexion"], ph: "fix/…", exp: "Le préfixe fix/ annonce une correction." },
    { type: "qcm", q: "Le préfixe « feature/ » dans un nom de branche indique…", opts: ["Une nouvelle fonctionnalité", "Une suppression", "Une mise à jour de documentation", "Une correction de bug"], a: 0, exp: "feature = fonctionnalité ; fix = correction ; docs = doc." },
    { type: "qcm", q: "Après la fusion d'une PR, la bonne pratique est de…", opts: ["Supprimer la branche devenue inutile", "Supprimer main", "Rouvrir la Pull Request fusionnée", "Forker le dépôt"], a: 0, exp: "On nettoie avec Delete branch." },
    { type: "input", q: "Commande pour supprimer la branche locale « ajout-recherche » après fusion :", a: ["git branch -d ajout-recherche"], ph: "git branch -d …", exp: "-d supprime une branche déjà fusionnée." },
    { type: "vf", q: "Le GitHub Flow ne sert que pour les grandes équipes et jamais en solo.", a: false, exp: "Même seul, brancher + PR t'oblige à relire ton travail." },
    { type: "qcm", q: "L'avantage principal de brancher pour chaque idée est…", opts: ["main reste toujours stable pendant qu'on travaille ailleurs", "Les conflits de fusion deviennent impossibles", "On peut se passer de Pull Request", "main n'a plus besoin d'être testée"], a: 0, exp: "Le travail en cours n'affecte pas la version stable." },
    { type: "input", q: "Après le merge, commande pour mettre à jour ta main locale :", a: ["git pull origin main", "git pull"], ph: "git pull …", exp: "On récupère la version fusionnée." },
    { type: "vf", q: "Le nom « ma-branche » est un meilleur choix que « fix/bug-connexion ».", a: false, exp: "Un nom parlant se comprend d'un coup d'œil ; « ma-branche » ne dit rien." }
  ],
  final: {

      { type: "input", q: "Commande pour envoyer ta branche sur GitHub :", a: ["git push origin feature/barre-recherche", "git push -u origin feature/barre-recherche"], ph: "git push …", exp: "On pousse la branche sur origin." },
      { type: "qcm", q: "Sur GitHub, l'étape suivante est…", opts: ["Ouvrir une Pull Request pour faire relire ton travail", "Fusionner ta branche dans main sans relecture", "Renommer main", "Créer un fork"], a: 0, exp: "La PR déclenche la relecture." },
      { type: "vf", q: "Après approbation et merge dans main, tu supprimes la branche feature/barre-recherche.", a: true, exp: "On nettoie ; le travail de la branche est terminé." }
    ],
    solution: `<pre class="pseudo">1. git checkout main
   git pull origin main                       # partir d'une main a jour
2. git checkout -b feature/barre-recherche    # branche dediee, nom parlant
3. ... coder la barre de recherche ...
   git add .
   git commit -m "Ajoute une barre de recherche dans l'en-tete"
4. git push origin feature/barre-recherche    # sur GitHub
5. Ouvrir la Pull Request ▸ l'equipe relit et approuve
6. Merge dans main ▸ bouton Delete branch     # fusion + nettoyage
7. git checkout main
   git pull origin main                        # recuperer la version fusionnee
   git branch -d feature/barre-recherche       # effacer la branche locale</pre>
<p>Une idée, une branche, une PR, un merge : le cycle du GitHub Flow. Demain : gérer qui a le droit de faire quoi avec les collaborateurs et les permissions.</p>`
  }
