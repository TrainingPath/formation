  title: "Cloner un dépôt",
  subtitle: "Récupérer sur ta machine une copie complète d'un dépôt distant.",
  theory: `
<h3>1. Qu'est-ce que cloner ?</h3>
<p><strong>Cloner</strong> (en anglais <em>clone</em>), c'est télécharger sur ta machine une copie complète d'un dépôt qui vit sur GitHub. « Complète » veut dire : les fichiers, mais aussi tout l'historique et le lien vers le dépôt distant. C'est comme photocopier un classeur entier, avec toutes ses versions passées, pas seulement la dernière page.</p>
<p>La commande est <strong>git clone</strong>, suivie de l'<strong>adresse</strong> du dépôt (son URL). Contrairement à <code>git init</code> (qui part d'un dossier vide), <code>git clone</code> part d'un dépôt qui existe déjà en ligne.</p>
<pre class="pseudo">git clone https://github.com/utilisateur/projet.git   # copie tout le depot dans un nouveau dossier "projet"
cd projet                                              # on entre dans le dossier cree
git status                                             # le depot est deja pret : Git le suit</pre>

<h3>2. Où trouver l'adresse ?</h3>
<p>Sur GitHub (le site), ouvre la page du dépôt, clique sur le bouton vert <strong>« Code »</strong>, et copie l'adresse affichée. Deux formats existent :</p>
<pre class="pseudo">Depot GitHub ▸ bouton vert "Code" ▸ copier l'URL
  HTTPS : https://github.com/utilisateur/projet.git   # le plus simple pour debuter
  SSH   : git@github.com:utilisateur/projet.git       # necessite une cle SSH (plus avance)</pre>
<div class="tip">Pour débuter, choisis l'adresse <strong>HTTPS</strong> : elle fonctionne partout sans configuration supplémentaire. Le format SSH est plus confortable ensuite, mais demande d'installer une clé.</div>

<h3>3. Ce que clone crée automatiquement</h3>
<p>Après un clone, tu obtiens un dossier prêt à l'emploi, déjà relié au dépôt distant. Ce lien porte un nom : <strong>origin</strong>. C'est le surnom que Git donne par défaut au dépôt distant d'origine (celui que tu as cloné). Tu n'as rien à configurer : envoyer et récupérer des changements fonctionnera tout de suite (jour 7).</p>
<pre class="pseudo">git remote -v            # affiche les depots distants connus ; "origin" pointe vers l'adresse clonee
origin  https://github.com/utilisateur/projet.git (fetch)   # d'ou l'on recupere
origin  https://github.com/utilisateur/projet.git (push)    # ou l'on envoie</pre>
<div class="warn">Ne confonds pas <strong>cloner</strong> et <strong>télécharger en ZIP</strong>. Le bouton « Download ZIP » de GitHub donne seulement les fichiers, SANS l'historique ni le lien distant. Un clone, lui, donne un vrai dépôt Git complet.</div>

<h3>4. Cloner dans un dossier au nom choisi</h3>
<p>Par défaut, le dossier prend le nom du projet. Tu peux en imposer un autre en l'ajoutant à la fin de la commande.</p>
<pre class="pseudo">git clone https://github.com/utilisateur/projet.git mon-dossier   # clone dans un dossier nomme "mon-dossier"</pre>

<h3>5. Quand cloner ?</h3>
<p>On clone dans deux situations très courantes : pour <strong>récupérer un projet existant</strong> sur lequel on va travailler, ou pour <strong>repartir d'un projet d'autrui</strong> (open source) afin de l'étudier ou d'y contribuer. Cloner est souvent le tout premier geste quand on rejoint un projet déjà en ligne.</p>
<div class="tip">Résumé : git init = créer un dépôt neuf en local. git clone = copier un dépôt existant depuis GitHub, historique et lien « origin » compris.</div>`,
  exercises: [
    { type: "input", q: "Complète la commande qui copie un dépôt distant : git ______ <url>", a: ["clone"], ph: "une commande", exp: "git clone télécharge une copie complète." },
    { type: "qcm", q: "Cloner récupère…", opts: ["Les fichiers ET tout l'historique et le lien distant", "Seulement le dernier fichier", "Uniquement le README", "Seulement les fichiers, sans l'historique"], a: 0, exp: "Un clone est une copie complète du dépôt." },
    { type: "qcm", q: "Où trouve-t-on l'adresse à cloner sur GitHub ?", opts: ["Le bouton vert « Code » du dépôt", "Dans l'onglet Issues du dépôt", "Dans Settings du compte", "Dans le terminal"], a: 0, exp: "Le bouton « Code » affiche l'URL HTTPS/SSH." },
    { type: "qcm", q: "Pour débuter, quel format d'adresse est le plus simple ?", opts: ["HTTPS", "SSH", "FTP", "GPG"], a: 0, exp: "HTTPS marche sans configuration de clé." },
    { type: "input", q: "Complète : le surnom par défaut du dépôt distant cloné est ______.", a: ["origin"], ph: "un nom", exp: "origin désigne le distant d'origine." },
    { type: "qcm", q: "git remote -v sert à…", opts: ["Afficher les dépôts distants connus (dont origin)", "Supprimer le dépôt", "Créer une nouvelle branche", "Renommer le dépôt distant"], a: 0, exp: "-v (verbose) montre les URL distantes." },
    { type: "vf", q: "Le bouton « Download ZIP » donne un vrai dépôt Git avec l'historique.", a: false, exp: "Le ZIP ne contient que les fichiers, sans historique ni lien distant." },
    { type: "qcm", q: "Différence entre git init et git clone :", opts: ["init crée un dépôt neuf vide ; clone copie un dépôt existant", "Ils font exactement la même chose", "clone efface l'historique", "init a besoin d'Internet"], a: 0, exp: "init part de zéro ; clone part d'un dépôt en ligne." },
    { type: "input", q: "Complète pour cloner dans un dossier nommé « travail » : git clone <url> ______", a: ["travail"], ph: "un nom de dossier", exp: "Le nom ajouté à la fin impose le dossier de destination." },
    { type: "vf", q: "Après un clone, le dépôt est déjà relié au distant (origin), sans réglage.", a: true, exp: "Le lien origin est créé automatiquement." },
    { type: "qcm", q: "Le format SSH (git@github.com:…) …", opts: ["Est plus avancé et demande une clé SSH", "Est le plus simple pour débuter", "Ne marche qu'avec les dépôts privés", "Sert à télécharger un ZIP"], a: 0, exp: "SSH est confortable mais nécessite une configuration." },
    { type: "qcm", q: "Par défaut, le dossier créé par le clone porte…", opts: ["Le nom du projet", "Ton nom d'utilisateur GitHub", "Le nom origin", "Le nom .git"], a: 0, exp: "Sauf si tu précises un autre nom à la fin." },
    { type: "vf", q: "On clone souvent pour rejoindre un projet déjà présent sur GitHub.", a: true, exp: "C'est le premier geste quand on récupère un projet existant." },
    { type: "input", q: "Complète : après le clone, on entre dans le dossier avec ______ projet", a: ["cd"], ph: "une commande", exp: "cd projet entre dans le dossier cloné." },
    { type: "qcm", q: "Une adresse HTTPS de dépôt ressemble à…", opts: ["https://github.com/utilisateur/projet.git", "C:/Users/moi", "github://clone", "ftp://projet"], a: 0, exp: "URL HTTPS finissant souvent par .git." }
  ],
  final: {
    title: "Exercice final — Récupérer un projet",
    intro: `<p>Un collègue t'envoie l'adresse de son dépôt GitHub : <code>https://github.com/collegue/appli.git</code>. Tu veux le récupérer sur ta machine pour commencer à travailler.</p>`,
    questions: [
      { type: "input", q: "Commande pour copier ce dépôt sur ta machine :", a: ["git clone https://github.com/collegue/appli.git"], ph: "git clone …", exp: "git clone suivi de l'URL." },
      { type: "qcm", q: "Après le clone, un dossier apparaît. Son nom par défaut est…", opts: ["appli", "clone", "origin", "collegue"], a: 0, exp: "Le nom du projet." },
      { type: "input", q: "Commande pour vérifier vers quel distant pointe origin :", a: ["git remote -v", "git remote"], ph: "git remote …", exp: "git remote -v affiche les URL." },
      { type: "vf", q: "Le clone a aussi récupéré tout l'historique du projet, pas seulement les fichiers.", a: true, exp: "Un clone est complet, historique compris." },
      { type: "qcm", q: "Où as-tu trouvé cette adresse à cloner ?", opts: ["Sur le bouton vert « Code » du dépôt GitHub", "Dans Settings du compte", "Dans un ZIP", "Dans l'onglet Insights du dépôt"], a: 0, exp: "Le bouton Code fournit l'URL." }
    ],
    solution: `<pre class="pseudo">git clone https://github.com/collegue/appli.git   # copie complete du depot dans un dossier "appli"
cd appli                                          # on entre dans le dossier clone
git remote -v                                     # verifie : "origin" pointe vers l'URL du collegue
git status                                        # le depot est deja pret et suivi par Git</pre>
<p>Tu sais récupérer un projet existant. Demain : le cycle de base pour enregistrer tes propres changements.</p>`
  }
};
