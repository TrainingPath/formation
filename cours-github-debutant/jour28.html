<script>
var DAY = {
  num: 28,
  title: "Rechercher du code et des dépôts",
  subtitle: "GitHub est la plus grande bibliothèque de code du monde : sache la fouiller.",
  theory: `
<h3>1. La barre de recherche globale</h3>
<p>Tout en haut de GitHub, la <strong>barre de recherche</strong> cherche partout : dépôts, code, utilisateurs, Issues, Pull Requests. Taper un mot simple donne beaucoup de résultats ; l'art consiste à <strong>filtrer</strong> pour trouver l'aiguille dans la botte de foin.</p>
<div class="tip">Après une recherche, la colonne de gauche propose des catégories : <strong>Repositories</strong>, <strong>Code</strong>, <strong>Issues</strong>, <strong>Users</strong>, etc. On clique pour ne garder qu'un type de résultat.</div>

<h3>2. Les qualificateurs (filtres) essentiels</h3>
<p>Un <strong>qualificateur</strong> est un mot-clé de la forme <code>clé:valeur</code> qu'on ajoute à la recherche pour la préciser. On les combine librement :</p>
<pre class="pseudo">langage:      language:python        # ne garder que les depots/code en Python
etoiles:      stars:&gt;1000            # depots ayant plus de 1000 etoiles (populaires)
proprietaire: user:torvalds         # limite a ce qu'un utilisateur possede
depot precis: repo:facebook/react   # cherche uniquement DANS ce depot
dans le nom:  in:name todo          # « todo » doit etre dans le NOM du depot
licence:      license:mit           # depots sous licence MIT</pre>
<p>Exemple concret : <code>gestion de tâches language:javascript stars:&gt;500</code> cherche des projets de gestion de tâches, écrits en JavaScript, populaires.</p>

<h3>3. Les étoiles : le « j'aime » de GitHub</h3>
<p>Une <strong>étoile</strong> (<em>star</em>) marque un dépôt qu'on trouve intéressant, un peu comme un marque-page public. Le nombre d'étoiles donne une idée grossière de la popularité et de la confiance de la communauté. On filtre avec <code>stars:&gt;1000</code>.</p>
<div class="tip">Clique sur <strong>Star</strong> en haut d'un dépôt pour le garder sous la main : tu retrouveras tous tes dépôts étoilés dans <em>Your stars</em>, une bibliothèque de veille personnelle.</div>

<h3>4. Trier et affiner les résultats</h3>
<pre class="pseudo">Sort: Best match / Most stars / Recently updated   # menu de tri des resultats
created:&gt;2023-01-01     # depots crees apres cette date
pushed:&gt;2024-01-01      # depots dont le dernier push est recent (projet vivant)</pre>
<p>Un projet avec beaucoup d'étoiles <em>mais</em> plus aucune activité depuis des années est peut-être abandonné : croise toujours popularité (<code>stars</code>) et fraîcheur (<code>pushed</code>).</p>

<h3>5. Chercher DANS un dépôt</h3>
<p>Ouvre un dépôt et appuie sur la touche <code>t</code> : GitHub ouvre le <strong>file finder</strong> (« chercheur de fichiers »), qui trouve un fichier par son nom en quelques lettres. Pour chercher une portion de code précise, la <strong>recherche de code</strong> permet même des expressions entre guillemets.</p>
<pre class="pseudo">repo:mon-org/mon-projet "function calculerTotal"   # trouver cette ligne exacte dans un depot
path:*.css color                                     # le mot color dans les fichiers .css</pre>
<div class="warn">La recherche de code ne couvre pas tout instantanément : les très gros dépôts ou le code très récent peuvent ne pas apparaître tout de suite. Et souviens-toi : le code public est lisible par tous — d'où l'importance de ne jamais y laisser de secret (vu au jour 27).</div>`,
  exercises: [
    { type: "qcm", q: "La barre de recherche globale de GitHub cherche…", opts: ["Dépôts, code, utilisateurs, Issues et PR", "Uniquement tes propres fichiers", "Seulement les images", "Rien du tout"], a: 0, exp: "Elle cherche partout ; on filtre ensuite par catégorie." },
    { type: "input", q: "Le qualificateur pour limiter la recherche au langage Python (clé:valeur) :", a: ["language:python", "langage:python"], ph: "…:python", exp: "language:python filtre par langage." },
    { type: "input", q: "Le qualificateur pour ne garder que les dépôts de plus de 1000 étoiles :", a: ["stars:>1000", "stars: >1000"], ph: "stars:…", exp: "stars:>1000 filtre par popularité." },
    { type: "qcm", q: "Un qualificateur a la forme…", opts: ["clé:valeur (par ex. language:python)", "clé=valeur", "clé;valeur", "clé/valeur"], a: 0, exp: "Deux points entre la clé et la valeur." },
    { type: "input", q: "Le qualificateur pour chercher uniquement DANS le dépôt facebook/react :", a: ["repo:facebook/react"], ph: "repo:…", exp: "repo:proprietaire/nom limite à un dépôt." },
    { type: "qcm", q: "Une « étoile » sur GitHub sert surtout à…", opts: ["Marquer un dépôt intéressant, comme un marque-page public", "Supprimer un dépôt", "Envoyer de l'argent", "Bloquer un utilisateur"], a: 0, exp: "C'est le marque-page / « j'aime » de GitHub." },
    { type: "input", q: "Le bouton (mot anglais) pour ajouter un dépôt à ses favoris en haut de sa page :", a: ["Star", "star"], ph: "…", exp: "Star ajoute le dépôt à Your stars." },
    { type: "qcm", q: "Le qualificateur « user:torvalds » limite la recherche…", opts: ["À ce que possède cet utilisateur", "Aux dépôts de plus de 1000 étoiles", "Au langage Python", "Aux Issues fermées"], a: 0, exp: "user: limite à un propriétaire." },
    { type: "qcm", q: "Pour repérer un projet vivant plutôt qu'abandonné, on regarde…", opts: ["La date du dernier push (pushed:)", "La couleur du logo", "Le nombre de lettres du nom", "Rien"], a: 0, exp: "On croise étoiles (popularité) et pushed (fraîcheur)." },
    { type: "input", q: "Le qualificateur pour les dépôts dont le dernier push est postérieur au 1er janvier 2024 :", a: ["pushed:>2024-01-01"], ph: "pushed:…", exp: "pushed:>2024-01-01 = activité récente." },
    { type: "qcm", q: "Un dépôt à 20 000 étoiles mais sans activité depuis 5 ans est probablement…", opts: ["Abandonné, malgré sa popularité passée", "Le meilleur choix possible", "Impossible à cloner", "Un dépôt privé"], a: 0, exp: "Popularité passée ne veut pas dire projet vivant." },
    { type: "input", q: "La touche du clavier qui ouvre le « file finder » dans un dépôt ouvert :", a: ["t", "T"], ph: "…", exp: "La touche t ouvre la recherche de fichiers." },
    { type: "qcm", q: "« in:name todo » cherche « todo »…", opts: ["Dans le nom du dépôt", "Dans le code uniquement", "Dans les mots de passe", "Dans les images"], a: 0, exp: "in:name restreint au nom du dépôt." },
    { type: "vf", q: "On peut combiner plusieurs qualificateurs dans une même recherche.", a: true, exp: "Ex : gestion language:javascript stars:>500." },
    { type: "vf", q: "Le code public de GitHub étant lisible par tous, on peut y laisser des mots de passe sans souci.", a: false, exp: "Au contraire : jamais de secret dans du code public (rappel du jour 27)." }
  ],
  final: {
    title: "Exercice final — Trouver la bonne bibliothèque",
    intro: `<p>Tu cherches une bibliothèque JavaScript populaire et bien entretenue pour afficher des graphiques (charts). Tu veux du sérieux : beaucoup d'étoiles, mais surtout un projet encore vivant.</p>`,
    questions: [
      { type: "input", q: "Écris le qualificateur pour restreindre au langage JavaScript :", a: ["language:javascript", "langage:javascript"], ph: "…:javascript", exp: "language:javascript." },
      { type: "input", q: "Écris le qualificateur pour ne garder que les dépôts de plus de 5000 étoiles :", a: ["stars:>5000", "stars: >5000"], ph: "stars:…", exp: "stars:>5000 pour la popularité." },
      { type: "qcm", q: "Pour t'assurer que le projet est encore vivant, tu ajoutes…", opts: ["pushed:>2024-01-01 (activité récente)", "created:<2010", "un mot de passe", "in:name secret"], a: 0, exp: "pushed: vérifie la fraîcheur du projet." },
      { type: "qcm", q: "Ta requête complète ressemble à…", opts: ["charts language:javascript stars:>5000 pushed:>2024-01-01", "supprime tout", "language=python", "star!!!"], a: 0, exp: "On combine le sujet et les trois filtres." },
      { type: "vf", q: "Une fois la bonne bibliothèque trouvée, cliquer sur Star te permettra de la retrouver facilement plus tard.", a: true, exp: "Le dépôt rejoint Your stars, ta veille personnelle." }
    ],
    solution: `<pre class="pseudo">1. Barre de recherche :
   charts language:javascript stars:&gt;5000 pushed:&gt;2024-01-01
     - charts            → le sujet
     - language:javascript → le bon langage
     - stars:&gt;5000       → populaire (confiance de la communaute)
     - pushed:&gt;2024-01-01 → encore maintenu (projet vivant)

2. Colonne de gauche ▸ Repositories, tri : Most stars
3. Ouvrir un candidat ▸ verifier :
     - date du dernier commit / des Issues recentes
     - un README clair, une licence
4. Star ▸ le depot rejoint « Your stars » pour plus tard.</pre>
<p>Bien chercher, c'est ne pas réinventer la roue. Demain : organiser tout un projet avec les GitHub Projects.</p>`
  }
};
</script>
