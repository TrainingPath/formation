  num: 6,
  title: "Le cycle de base : modifier, add, commit",
  subtitle: "Le geste que tu répéteras des milliers de fois avec Git.",
  theory: `
<h3>1. Les trois zones de Git</h3>
<p>Pour comprendre le cycle, imagine trois zones. Le <strong>répertoire de travail</strong> (working directory) : tes fichiers tels que tu les modifies. La <strong>zone de préparation</strong> (en anglais <em>staging area</em>, aussi appelée « index ») : une antichambre où tu déposes ce que tu veux enregistrer. Le <strong>dépôt</strong> : là où les enregistrements définitifs (les commits) sont gardés pour toujours.</p>
<pre class="pseudo">Repertoire de travail  --( git add )-->  Zone de preparation  --( git commit )-->  Depot (historique)
  # tu modifies ici        # tu choisis ce            # antichambre               # enregistrement fige
                           # qui sera enregistre</pre>
<div class="tip">Analogie : tu prépares un colis. Le répertoire de travail = ton bureau en désordre. La zone de préparation = le carton où tu mets seulement ce que tu veux envoyer. Le commit = le colis fermé et étiqueté, prêt à partir.</div>

<h3>2. git add : préparer</h3>
<p>La commande <strong>git add</strong> place un fichier (ou ses modifications) dans la zone de préparation. Tu choisis ainsi précisément ce qui entrera dans le prochain enregistrement. On dit qu'on « stage » un fichier.</p>
<pre class="pseudo">git add recettes.txt      # met CE fichier dans la zone de preparation
git add .                 # met TOUS les fichiers modifies du dossier (le "." = ici)
git status                # montre en vert ce qui est prepare, en rouge ce qui ne l'est pas</pre>
<div class="warn">Modifier un fichier ne suffit pas : tant que tu n'as pas fait <code>git add</code>, la modification reste hors du prochain commit. add est l'étape « je choisis ce que j'enregistre ».</div>

<h3>3. git commit : enregistrer</h3>
<p>Un <strong>commit</strong> est un enregistrement définitif de l'état préparé : une « photo » de ton projet à cet instant, avec un message qui explique le changement. La commande <strong>git commit</strong> avec l'option <strong>-m</strong> (m = « message ») fige ce qui était dans la zone de préparation.</p>
<pre class="pseudo">git commit -m "Ajout du gratin dauphinois"   # enregistre le contenu prepare avec un message clair
git log --oneline                            # verifie : le commit apparait dans l'historique</pre>
<div class="tip">Un bon message de commit dit ce que le changement APPORTE, au présent : « Ajout de la page contact », « Correction du calcul TVA ». Il aide ton futur toi (et ton équipe) à relire l'histoire.</div>

<h3>4. Le cycle complet</h3>
<p>Voici la boucle que tu répéteras sans cesse : modifier des fichiers, préparer (add), enregistrer (commit). Puis recommencer.</p>
<pre class="pseudo"># 1) tu modifies un ou plusieurs fichiers dans ton editeur
git status                          # 2) voir ce qui a change (en rouge : non prepare)
git add recettes.txt               # 3) preparer ce que tu veux enregistrer
git commit -m "Ajout d'une recette" # 4) enregistrer, avec un message
#    -> et on recommence au point 1 pour la suite</pre>

<h3>5. Voir l'état et l'historique</h3>
<p>Deux commandes t'accompagnent en permanence. <strong>git status</strong> répond à « où en suis-je ? » (quels fichiers modifiés, préparés ou non). <strong>git log</strong> répond à « qu'ai-je déjà enregistré ? » (la liste des commits).</p>
<pre class="pseudo">git status                # etat courant : modifie ? prepare ? propre ?
git log --oneline         # liste compacte des commits deja enregistres</pre>
<div class="warn">Attention : ce cycle add/commit est 100 % LOCAL. Rien n'est encore envoyé sur GitHub. Pour partager tes commits sur le web, il faudra « push » : ce sera le jour 7.</div>`,
  exercises: [
    { type: "input", q: "Complète : la commande qui prépare un fichier est git ______", a: ["add"], ph: "une commande", exp: "git add place le fichier dans la zone de préparation." },
    { type: "input", q: "Complète : la commande qui enregistre est git ______ -m \"msg\"", a: ["commit"], ph: "une commande", exp: "git commit fige ce qui est préparé." },
    { type: "qcm", q: "La « zone de préparation » s'appelle aussi…", opts: ["Staging area (ou index)", "Le dépôt distant", "La corbeille", "Le terminal"], a: 0, exp: "Staging area = antichambre du commit." },
    { type: "qcm", q: "À quoi sert l'option -m de git commit ?", opts: ["À donner le message du commit", "À multiplier les fichiers", "À effacer le commit", "À changer de branche"], a: 0, exp: "-m = message décrivant le changement." },
    { type: "vf", q: "Modifier un fichier suffit à l'inclure dans le prochain commit.", a: false, exp: "Il faut d'abord git add : sinon la modif reste hors du commit." },
    { type: "input", q: "Complète : pour préparer TOUS les fichiers modifiés du dossier : git add ______", a: [".", "point"], ph: "un caractère", exp: "git add . prépare tout ce qui est modifié ici." },
    { type: "qcm", q: "Un commit est…", opts: ["Un enregistrement définitif (une photo) du projet à un instant", "Un dossier temporaire", "Un e-mail", "Un fichier ZIP"], a: 0, exp: "Le commit fige un état avec un message." },
    { type: "qcm", q: "git status répond surtout à la question…", opts: ["« Où en suis-je ? » (fichiers modifiés/préparés)", "« Quel temps fait-il ? »", "« Qui est connecté ? »", "« Quelle heure est-il ? »"], a: 0, exp: "Il montre l'état courant du dépôt." },
    { type: "qcm", q: "git log --oneline affiche…", opts: ["La liste compacte des commits enregistrés", "Les fichiers non modifiés", "Les réglages de Git", "Les branches distantes"], a: 0, exp: "Une ligne par commit." },
    { type: "vf", q: "Le cycle add/commit est entièrement local : rien n'est envoyé sur GitHub.", a: true, exp: "Pour partager, il faudra push (jour 7)." },
    { type: "input", q: "Complète la commande qui montre l'état courant : git ______", a: ["status"], ph: "une commande", exp: "git status affiche l'état." },
    { type: "qcm", q: "Un bon message de commit…", opts: ["Explique ce que le changement apporte", "Est toujours vide", "Contient ton mot de passe", "Doit faire 500 mots"], a: 0, exp: "Un message clair et court aide à relire l'histoire." },
    { type: "qcm", q: "Ordre correct du cycle de base :", opts: ["Modifier ▸ add ▸ commit", "commit ▸ add ▸ modifier", "add ▸ modifier ▸ commit", "push ▸ add ▸ modifier"], a: 0, exp: "On modifie, on prépare, on enregistre." },
    { type: "vf", q: "git add . prépare tous les fichiers modifiés du dossier courant.", a: true, exp: "Le point désigne « ici » (le dossier courant)." },
    { type: "qcm", q: "Après git commit, où se trouve l'enregistrement ?", opts: ["Dans l'historique local du dépôt", "Directement sur GitHub", "Dans la corbeille", "Nulle part"], a: 0, exp: "Le commit est local tant qu'on n'a pas push." }
  ],
  final: {
    title: "Exercice final — Un premier changement enregistré",
    intro: `<p>Tu as un dépôt avec un fichier <code>recettes.txt</code>. Tu viens d'y ajouter une nouvelle recette dans ton éditeur. Enregistre proprement ce changement avec Git.</p>`,
    questions: [
      { type: "input", q: "Commande pour voir ce qui a changé :", a: ["git status"], ph: "git …", exp: "git status montre le fichier modifié (en rouge)." },
      { type: "input", q: "Commande pour préparer recettes.txt :", a: ["git add recettes.txt"], ph: "git add …", exp: "git add place le fichier en zone de préparation." },
      { type: "input", q: "Commande pour enregistrer avec un message :", a: ["git commit -m \"ajout d'une recette\"", "git commit -m ajout d'une recette", "git commit"], ph: "git commit …", exp: "git commit -m \"message\"." },
      { type: "vf", q: "Après ce commit, le changement est enregistré localement mais pas encore sur GitHub.", a: true, exp: "Il faudra push pour partager." },
      { type: "input", q: "Commande pour vérifier que le commit est bien dans l'historique :", a: ["git log --oneline", "git log"], ph: "git log …", exp: "git log liste les commits." }
    ],
    solution: `<pre class="pseudo"># Tu viens de modifier recettes.txt dans ton editeur, puis :
git status                              # voir l'etat : recettes.txt apparait en rouge (modifie, non prepare)
git add recettes.txt                    # preparer : le fichier passe en zone de preparation (vert)
git commit -m "Ajout d'une recette"     # enregistrer definitivement, avec un message clair
git log --oneline                       # verifier : le nouveau commit figure dans l'historique

# Tout ceci est LOCAL. Pour l'envoyer sur GitHub : git push (jour 7).</pre>
<p>Tu maîtrises le geste central de Git. Demain : faire voyager tes commits entre local et distant.</p>`
  }
};
