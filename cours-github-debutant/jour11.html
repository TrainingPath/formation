  title: "Annuler : restore, revert, reset",
  subtitle: "Se tromper n'est pas grave : Git offre plusieurs marches arrière.",
  theory: `
<h3>1. Trois annulations pour trois situations</h3>
<p>« Annuler » ne veut pas dire la même chose selon le moment. Git propose trois outils, à ne pas confondre. <strong>restore</strong> annule des modifications non encore enregistrées. <strong>revert</strong> annule un commit déjà fait, en créant un nouveau commit inverse. <strong>reset</strong> déplace la position de l'historique. Choisir le bon dépend de « où en est » ta modification.</p>
<pre class="pseudo">Situation                                  Outil
  J'ai modifie mais pas encore commite  →  git restore
  J'ai deja fait un commit (peut-etre partage) et je veux l'annuler proprement  →  git revert
  Je veux reculer HEAD (usage local, prudent)  →  git reset</pre>

<h3>2. git restore : jeter des modifications non enregistrées</h3>
<p><strong>git restore</strong> (restore = « restaurer ») remet un fichier tel qu'il était au dernier commit, effaçant tes modifications non enregistrées. Utile quand un essai a mal tourné.</p>
<pre class="pseudo">git restore index.html      # annule les modifs NON preparees de index.html (retour au dernier commit)
git restore --staged index.html   # retire index.html de la zone de preparation (annule un "git add")</pre>
<div class="warn">git restore d'un fichier <strong>détruit</strong> tes modifications non enregistrées de ce fichier : elles ne sont pas récupérables. À n'utiliser que si tu es sûr de vouloir les jeter.</div>

<h3>3. git revert : annuler un commit sans réécrire l'histoire</h3>
<p><strong>git revert</strong> crée un <strong>nouveau commit</strong> qui défait exactement les changements d'un commit précédent. L'ancien commit reste dans l'historique : on ne réécrit rien, on ajoute une correction. C'est la méthode <strong>sûre</strong>, y compris pour un commit déjà poussé sur GitHub.</p>
<pre class="pseudo">git revert f4e5d6           # cree un nouveau commit qui ANNULE les changements de f4e5d6
# l'histoire reste intacte : f4e5d6 existe toujours, suivi d'un commit "Revert..."</pre>
<div class="tip">revert est idéal en équipe : comme il n'efface rien, il ne casse pas le travail des autres. C'est l'annulation « publique » recommandée.</div>

<h3>4. git reset : reculer la position (à manier avec soin)</h3>
<p><strong>git reset</strong> déplace HEAD vers un commit antérieur, « oubliant » les commits suivants. Selon l'option, il touche plus ou moins tes fichiers. Deux formes fréquentes :</p>
<pre class="pseudo">git reset --soft HEAD~1    # annule le DERNIER commit mais GARDE les modifs (elles redeviennent "preparees")
git reset --hard HEAD~1    # annule le dernier commit ET jette les modifs : etat propre du commit precedent</pre>
<div class="warn">git reset --hard est <strong>dangereux</strong> : il supprime des modifications sans filet. Ne l'utilise que sur des commits <strong>locaux non partagés</strong>. Sur un historique déjà poussé, préfère revert.</div>

<h3>5. La règle d'or de l'annulation</h3>
<p>Résumé pratique. Modifs pas encore commitées ? → <strong>restore</strong>. Commit déjà fait et/ou partagé ? → <strong>revert</strong> (sûr, il ajoute un commit inverse). reset ? → réservé au nettoyage local avant partage, avec prudence.</p>
<pre class="pseudo">Pas encore commite   →  git restore <fichier>
Commit deja partage  →  git revert <hash>          # SANS reecrire l'histoire (sur)
Nettoyage local seul →  git reset --soft/--hard    # attention, surtout --hard</pre>
<div class="tip">GitHub (le site) propose aussi un bouton « Revert » sur une Pull Request fusionnée : il crée automatiquement une PR d'annulation. C'est l'équivalent web de git revert.</div>`,
  exercises: [
    { type: "qcm", q: "Pour annuler des modifications PAS encore commitées, on utilise…", opts: ["git restore", "git revert", "git reset --hard", "git clone"], a: 0, exp: "restore remet le fichier au dernier commit." },
    { type: "qcm", q: "git revert fait quoi ?", opts: ["Crée un nouveau commit qui annule un commit précédent", "Efface le commit de l'historique", "Supprime le dépôt", "Change de branche"], a: 0, exp: "revert ajoute un commit inverse, sans réécrire l'histoire." },
    { type: "vf", q: "git revert est sûr même pour un commit déjà poussé sur GitHub.", a: true, exp: "Il n'efface rien : il ajoute une correction." },
    { type: "input", q: "Complète : pour retirer un fichier de la zone de préparation : git restore ______ index.html", a: ["--staged", "staged", "--cached", "cached"], ph: "une option", exp: "git restore --staged annule un git add." },
    { type: "qcm", q: "git reset --hard HEAD~1 …", opts: ["Annule le dernier commit ET jette les modifications", "Garde tout intact", "Crée un commit inverse", "Envoie sur GitHub"], a: 0, exp: "--hard supprime sans filet : dangereux." },
    { type: "qcm", q: "git reset --soft HEAD~1 …", opts: ["Annule le dernier commit mais garde les modifs (préparées)", "Efface tout le dépôt", "Pousse sur GitHub", "Crée une branche"], a: 0, exp: "--soft conserve les changements en zone de préparation." },
    { type: "vf", q: "git reset --hard est recommandé sur un historique déjà partagé.", a: false, exp: "Sur du partagé, on préfère revert : reset --hard réécrit l'histoire." },
    { type: "input", q: "Complète : la commande sûre qui annule un commit partagé est git ______ <hash>", a: ["revert"], ph: "une commande", exp: "git revert crée un commit d'annulation." },
    { type: "qcm", q: "Différence clé entre revert et reset :", opts: ["revert ajoute un commit inverse ; reset recule la position et peut réécrire l'histoire", "Ils sont identiques", "revert efface, reset ajoute", "revert est local, reset est distant"], a: 0, exp: "revert préserve l'histoire ; reset la modifie." },
    { type: "vf", q: "git restore d'un fichier détruit ses modifications non enregistrées.", a: true, exp: "À n'utiliser que si tu veux vraiment les jeter." },
    { type: "input", q: "Complète : pour annuler les modifs non préparées de style.css : git ______ style.css", a: ["restore"], ph: "une commande", exp: "git restore style.css." },
    { type: "qcm", q: "En équipe, quelle annulation ne casse pas le travail des autres ?", opts: ["git revert (n'efface rien)", "git reset --hard", "Supprimer le dépôt", "git restore --staged"], a: 0, exp: "revert est l'annulation publique sûre." },
    { type: "qcm", q: "Sur GitHub (le site), le bouton « Revert » d'une PR fusionnée…", opts: ["Crée automatiquement une PR d'annulation", "Supprime le dépôt", "Change ton mot de passe", "Ferme ton compte"], a: 0, exp: "C'est l'équivalent web de git revert." },
    { type: "vf", q: "reset --hard est à réserver aux commits locaux non partagés.", a: true, exp: "Il supprime des données sans filet." },
    { type: "qcm", q: "J'ai fait git add par erreur sur un fichier. Que faire ?", opts: ["git restore --staged <fichier>", "git revert HEAD", "git clone", "reset --hard"], a: 0, exp: "restore --staged retire de la préparation, sans perdre le contenu." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne marche arrière",
    intro: `<p>Trois situations te tombent dessus. Pour chacune, choisis l'outil d'annulation adapté et sûr.</p>`,
    questions: [
      { type: "qcm", q: "Tu as modifié brouillon.txt sans committer et tu veux tout jeter :", opts: ["git restore brouillon.txt", "git revert HEAD", "git reset --hard origin", "git push"], a: 0, exp: "Modifs non commitées → restore." },
      { type: "qcm", q: "Un commit déjà poussé sur GitHub a introduit un bug. Solution sûre :", opts: ["git revert <hash> (commit inverse)", "git reset --hard (réécrit l'histoire partagée)", "Supprimer le dépôt", "Ne rien faire"], a: 0, exp: "revert ne casse pas le travail des autres." },
      { type: "input", q: "Tu as fait « git add secret.txt » par erreur. Commande pour le retirer de la préparation :", a: ["git restore --staged secret.txt"], ph: "git restore …", exp: "restore --staged annule le add." },
      { type: "vf", q: "git reset --hard est un bon choix pour annuler un commit déjà partagé.", a: false, exp: "Sur du partagé, on utilise revert." },
      { type: "qcm", q: "Le point commun de restore et reset --hard, à retenir :", opts: ["Ils peuvent détruire des modifications non sauvegardées", "Ils envoient sur GitHub", "Ils créent une branche", "Ils sont sans risque"], a: 0, exp: "Prudence : ces deux-là peuvent faire perdre du travail." }
    ],
    solution: `<pre class="pseudo"># Cas 1 : modifs non commitees a jeter
git restore brouillon.txt         # retour au dernier commit (les modifs sont perdues : sois sur)

# Cas 2 : commit deja pousse, bug -> annulation SURE
git revert a1b2c3                 # cree un commit qui defait a1b2c3 ; l'histoire reste intacte
git push                          # on partage l'annulation

# Cas 3 : "git add" fait par erreur
git restore --staged secret.txt   # sort le fichier de la zone de preparation (contenu conserve)

# Regle : non commite -> restore ; deja partage -> revert ;
#         reset (surtout --hard) -> nettoyage LOCAL uniquement, avec prudence.</pre>
<p>Tu sais annuler sans casse. Demain : ouvrir des chemins parallèles avec les branches.</p>`
  }
};
