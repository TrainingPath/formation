<script>
var DAY = {
  num: 26,
  title: "Les Gists et les extraits de code",
  subtitle: "Partager un bout de code sans créer tout un dépôt.",
  theory: `
<h3>1. Qu'est-ce qu'un Gist ?</h3>
<p>Un <strong>Gist</strong> (mot anglais signifiant « l'essentiel ») est un mini-dépôt fait pour partager rapidement un ou quelques fichiers : un script, une astuce, un exemple, une note. Pas besoin de créer un vrai dépôt : un Gist se crée en quelques secondes et donne une adresse partageable.</p>
<div class="tip">Chemin dans l'interface : rends-toi sur <strong>gist.github.com</strong> (ou clique sur le + en haut à droite ▸ <strong>New gist</strong>). Tu écris un nom de fichier, colles ton code, et cliques sur le bouton de création.</div>

<h3>2. Public ou secret</h3>
<p>Au moment de créer un Gist, tu choisis :</p>
<pre class="pseudo">Public gist   # visible de tous, apparait dans la recherche des Gists
Secret gist   # non liste, accessible seulement a qui a le lien (pas indexe)</pre>
<div class="warn">Un Gist « secret » n'est pas vraiment privé : il est simplement <strong>non répertorié</strong>. Toute personne qui reçoit le lien peut l'ouvrir. Ne mets donc jamais un mot de passe ou une clé secrète dans un Gist, même « secret ».</div>

<h3>3. Ce qu'un Gist sait faire (comme un vrai dépôt)</h3>
<p>Sous le capot, chaque Gist <strong>est un dépôt Git</strong>. Il en a les super-pouvoirs :</p>
<pre class="pseudo">Historique   # chaque modification cree une revision : on voit l'evolution
Commentaires # on peut discuter sous un Gist
Fork         # quelqu'un peut copier ton Gist pour l'adapter
Clone        # git clone d'un Gist fonctionne, comme un depot classique
Coloration   # le code est colore selon le langage (deduit de l'extension du fichier)</pre>
<p>La <strong>coloration syntaxique</strong> (les couleurs qui distinguent mots-clés, chaînes, nombres) rend le code bien plus lisible. GitHub la déduit de l'extension : nomme ton fichier <code>script.py</code> pour du Python, <code>style.css</code> pour du CSS, etc.</p>

<h3>4. Gist ou dépôt : lequel choisir ?</h3>
<pre class="pseudo">GIST    # 1 a quelques fichiers, une astuce, un exemple a partager vite
DEPOT   # un vrai projet : plusieurs dossiers, une vie longue, des collaborateurs</pre>
<p>Règle simple : si c'est un <strong>projet</strong>, fais un dépôt. Si c'est juste un <strong>extrait</strong> à montrer ou à garder sous la main, un Gist suffit.</p>

<h3>5. Embarquer un Gist ailleurs</h3>
<p>Un Gist peut s'<strong>intégrer</strong> (« embed ») dans un article de blog ou une page web : GitHub fournit un petit bout de code <code>&lt;script&gt;</code> qui affiche le Gist, coloré, directement dans la page. Pratique pour un tutoriel.</p>
<div class="tip">Tes Gists sont regroupés sur <code>gist.github.com/ton-pseudo</code> : une petite bibliothèque personnelle de bouts de code réutilisables, toujours à portée de main.</div>`,
  exercises: [
    { type: "qcm", q: "Un Gist sert à…", opts: ["Partager rapidement un ou quelques fichiers de code", "Héberger une base de données", "Supprimer un dépôt", "Créer un compte"], a: 0, exp: "Un mini-dépôt pour un extrait, sans cérémonie." },
    { type: "input", q: "L'adresse du site des Gists (sans https://) :", a: ["gist.github.com", "gist.github.com/"], ph: "…", exp: "gist.github.com, ou le + ▸ New gist." },
    { type: "input", q: "Les deux types de Gist sont : Public et … (complète le second)", a: ["Secret", "secret"], ph: "…", exp: "Public (visible de tous) ou Secret (non listé)." },
    { type: "qcm", q: "Un Gist « secret » est en réalité…", opts: ["Non répertorié, mais accessible à qui a le lien", "Totalement privé et chiffré", "Impossible à ouvrir", "Supprimé après lecture"], a: 0, exp: "Non listé ≠ vraiment privé." },
    { type: "vf", q: "On peut mettre un mot de passe dans un Gist secret sans aucun risque.", a: false, exp: "Non : qui a le lien y accède. Jamais de secret dans un Gist." },
    { type: "vf", q: "Chaque Gist est en réalité un petit dépôt Git.", a: true, exp: "Il a un historique, se clone et se fork comme un dépôt." },
    { type: "input", q: "Le verbe anglais désignant l'action de copier le Gist de quelqu'un pour l'adapter :", a: ["fork", "forker", "Fork"], ph: "…", exp: "On peut forker un Gist comme un dépôt." },
    { type: "qcm", q: "La coloration syntaxique d'un Gist est déduite…", opts: ["De l'extension du fichier (.py, .css…)", "De la couleur de ton écran", "De ton mot de passe", "Du hasard"], a: 0, exp: "Nomme ton fichier script.py pour du Python coloré." },
    { type: "input", q: "Pour du code Python coloré, quelle extension donner au fichier du Gist ?", a: [".py", "py"], ph: "…", exp: "L'extension .py déclenche la coloration Python." },
    { type: "qcm", q: "Pour un vrai projet avec plusieurs dossiers et des collaborateurs, on préfère…", opts: ["Un dépôt", "Un Gist", "Une Issue", "Un tag"], a: 0, exp: "Le Gist est pour les extraits ; le projet mérite un dépôt." },
    { type: "vf", q: "On peut cloner un Gist avec git clone, comme un dépôt classique.", a: true, exp: "Un Gist étant un dépôt Git, git clone fonctionne." },
    { type: "input", q: "Le mot anglais désignant le fait d'intégrer un Gist dans une page web ou un blog :", a: ["embed", "Embed"], ph: "…", exp: "L'embed insère le Gist coloré dans la page." },
    { type: "qcm", q: "L'historique d'un Gist permet de…", opts: ["Voir les révisions successives du contenu", "Supprimer GitHub", "Changer de pseudo", "Créer une release"], a: 0, exp: "Chaque modification crée une révision consultable." },
    { type: "qcm", q: "Où retrouve-t-on tous ses Gists ?", opts: ["gist.github.com/ton-pseudo", "github.com/settings", "Dans l'onglet Issues", "Dans une release"], a: 0, exp: "Une bibliothèque personnelle d'extraits." },
    { type: "vf", q: "Créer un Gist est plus rapide que créer un dépôt complet.", a: true, exp: "C'est justement l'intérêt : partager un bout de code en quelques secondes." }
  ],
  final: {
    title: "Exercice final — Partager une astuce de code",
    intro: `<p>Un collègue te demande souvent la même petite fonction JavaScript qui formate une date. Plutôt que de la lui renvoyer par message à chaque fois, tu décides de la mettre dans un Gist réutilisable.</p>`,
    questions: [
      { type: "input", q: "Sur quel site (ou via quel menu) crées-tu ton extrait de code ?", a: ["gist.github.com", "gist.github.com/", "New gist"], ph: "…", exp: "gist.github.com ou + ▸ New gist." },
      { type: "input", q: "Pour que la fonction soit colorée en JavaScript, quelle extension donnes-tu au fichier ?", a: [".js", "js"], ph: "…", exp: "L'extension .js déclenche la coloration JavaScript." },
      { type: "qcm", q: "Tu veux que seuls les gens à qui tu envoies le lien le trouvent facilement, sans qu'il apparaisse dans la recherche. Tu choisis…", opts: ["Secret gist (non répertorié)", "Un dépôt privé payant", "De ne rien partager", "Un tag"], a: 0, exp: "Le Gist secret n'est pas listé, mais reste accessible par lien." },
      { type: "vf", q: "Même en Gist secret, tu évites d'y coller une clé d'API personnelle.", a: true, exp: "Secret = non listé, pas chiffré : jamais de vrai secret dedans." },
      { type: "qcm", q: "Pour insérer ce Gist dans un article de blog, tu utilises…", opts: ["Le code d'embed fourni par GitHub", "Une capture d'écran floue", "Un mot de passe", "Une release"], a: 0, exp: "L'embed affiche le Gist coloré dans la page." }
    ],
    solution: `<pre class="pseudo">1. Aller sur gist.github.com (ou + ▸ New gist)
2. Nom du fichier : formatDate.js         # extension .js → coloration JS
3. Coller la fonction JavaScript
4. Choisir : Create secret gist           # non repertorie, partage par lien
5. Copier l'adresse du Gist ▸ l'envoyer au collegue
   (il pourra le forker pour l'adapter, ou le cloner)
6. Pour un blog : bouton Embed ▸ coller le petit &lt;script&gt; dans l'article

Regle d'or : aucune cle ni mot de passe dans un Gist, meme secret.</pre>
<p>Le Gist, c'est le carnet d'astuces du développeur. Demain, un sujet crucial : sécuriser son compte avec la 2FA et les jetons d'accès.</p>`
  }
};
</script>
