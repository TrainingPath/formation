  theory: `
<h3>1. Qu'est-ce qu'une Pull Request ?</h3>
<p>Une <strong>Pull Request</strong> (souvent abrégée <strong>PR</strong> ; littéralement « demande de tirage ») est une fonctionnalité de <strong>GitHub</strong> (pas de Git en local) : c'est une <strong>proposition</strong> d'intégrer les commits d'une branche dans une autre, ouverte à la discussion et à la relecture avant la fusion. Au lieu de fusionner toi-même en cachette, tu dis à l'équipe : « voici mes changements, regardez-les, et si tout va bien, intégrez-les ».</p>
<p>Analogie : la PR est comme un article que tu soumets à un comité de lecture. Tu proposes ton texte (la branche), des relecteurs commentent, tu ajustes, et une fois validé, l'article est publié (la fusion dans main).</p>
<div class="tip">La PR est le cœur de la collaboration sur GitHub. C'est là que se font la relecture de code (« code review »), les discussions et les validations. Git seul ne connaît pas la notion de PR : elle appartient à la plateforme.</div>

<h3>2. Le point de départ : une branche poussée</h3>
<p>Une PR compare deux branches : une branche <strong>source</strong> (ton travail) et une branche <strong>cible</strong> (souvent main). Il faut donc d'abord avoir créé une branche, commité dessus, et l'avoir poussée sur GitHub.</p>
<pre class="pseudo"># En LOCAL (Git), on prepare la branche :
git switch -c ajout-contact     # branche de travail
# ... git add / git commit ...
git push -u origin ajout-contact # on la publie sur GitHub -> une PR devient possible</pre>

<h3>3. Ouvrir la PR sur GitHub (le site)</h3>
<p>Tout le reste se passe dans le navigateur. Après le push, GitHub affiche souvent un bandeau « Compare & pull request ». Sinon, va dans l'onglet <strong>« Pull requests »</strong> et clique <strong>« New pull request »</strong>. Tu choisis la branche cible (base) et la branche source (compare), tu écris un titre et une description claire, puis « Create pull request ».</p>
<pre class="pseudo">Depot GitHub ▸ onglet "Pull requests" ▸ bouton "New pull request"
  ▸ base: main   compare: ajout-contact     # dans QUELLE branche fusionner, et DEPUIS laquelle
  ▸ titre + description (en Markdown)         # explique le POURQUOI du changement
  ▸ bouton "Create pull request"             # la PR est ouverte, la discussion commence</pre>

<h3>4. Relire, discuter, valider</h3>
<p>Une fois la PR ouverte, l'équipe voit le <strong>diff</strong> (les changements ligne par ligne), peut laisser des <strong>commentaires</strong>, demander des modifications ou <strong>approuver</strong> (« Approve »). Tu peux continuer à pousser des commits sur la même branche : la PR se met à jour toute seule. C'est un échange, pas un simple bouton.</p>
<pre class="pseudo">Onglet "Files changed"   # le diff complet de la PR
  ▸ commentaire sur une ligne precise         # la relecture (code review)
  ▸ "Request changes" ou "Approve"            # demander des corrections, ou valider
# tu peux repousser des commits : la PR se met a jour automatiquement</pre>
<div class="tip">Bonne PR : petite, ciblée, avec un titre clair et une description qui explique le POURQUOI. Plus elle est lisible, plus la relecture est rapide.</div>

<h3>5. Fusionner et nettoyer</h3>
<p>Quand la PR est approuvée, on clique le bouton vert <strong>« Merge pull request »</strong> : GitHub fusionne la branche source dans la cible (comme un <code>git merge</code>, mais côté serveur). GitHub propose ensuite <strong>« Delete branch »</strong> pour supprimer la branche devenue inutile. Enfin, sur ta machine, tu récupères le résultat avec un <code>git pull</code> sur main.</p>
<pre class="pseudo">Bouton vert "Merge pull request" ▸ "Confirm merge"   # fusion cote GitHub
  ▸ "Delete branch"                                  # menage de la branche distante
# puis en LOCAL :
git switch main
git pull                 # recuperer la version fusionnee (main a jour chez toi)</pre>
<div class="warn">Si un conflit empêche la fusion, GitHub affiche « Resolve conflicts » : c'est exactement la résolution vue au jour 14, en version web. Une PR ne se fusionne que lorsque les conflits sont réglés et (souvent) la relecture approuvée.</div>
<div class="tip">Pour contribuer à un projet dont tu n'es PAS membre, tu commences par le « forker » (en faire une copie sur ton compte), tu travailles sur ta copie, puis tu ouvres une PR vers le projet d'origine. C'est ainsi que fonctionne tout l'open source.</div>`,

      { type: "input", q: "Enfin, en local sur main, commande pour récupérer le résultat fusionné :", a: ["git pull", "git pull origin main"], ph: "git …", exp: "git pull met main à jour." }

    solution: `<pre class="pseudo"># 1) En LOCAL (Git) : preparer et publier la branche
git switch -c about              # branche de travail

<p>Bravo : tu maîtrises le cycle complet de collaboration sur GitHub, du commit local à la Pull Request fusionnée. Tu as tous les gestes essentiels pour travailler seul et en équipe.</p>`
