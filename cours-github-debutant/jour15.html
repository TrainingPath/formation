<script>
var DAY = {
  num: 15,
  title: "Travailler avec les branches distantes",
  subtitle: "Les branches n'existent pas que chez toi : GitHub a les siennes.",
  theory: `
<h3>1. Branches locales et branches distantes</h3>
<p>Jusqu'ici tes branches vivaient en local. Mais GitHub héberge <strong>ses propres branches</strong>, celles poussées par toi ou tes collègues. Une <strong>branche distante</strong> est une branche qui existe sur le dépôt distant (origin). Git les nomme avec le préfixe du remote : <code>origin/main</code>, <code>origin/contact</code>. Ce sont des repères en lecture qui reflètent l'état de GitHub la dernière fois que tu as communiqué avec lui.</p>
<pre class="pseudo">main               # ta branche LOCALE (chez toi)
origin/main        # la branche main telle qu'elle est sur GitHub (distante)
origin/contact     # une branche "contact" presente sur GitHub</pre>
<div class="tip">Analogie : <code>main</code> est ton exemplaire de travail ; <code>origin/main</code> est la photo du même chapitre telle qu'elle est à la bibliothèque (GitHub) lors de ta dernière visite.</div>

<h3>2. Voir toutes les branches</h3>
<p>L'option <strong>-a</strong> (a = « all », toutes) de git branch affiche les branches locales ET distantes. L'option <strong>-r</strong> (r = « remote ») ne montre que les distantes.</p>
<pre class="pseudo">git branch            # branches locales seulement
git branch -r         # branches DISTANTES seulement (origin/...)
git branch -a         # TOUTES : locales + distantes</pre>

<h3>3. Mettre à jour sa vue du distant : fetch</h3>
<p>Les repères <code>origin/...</code> ne se rafraîchissent pas tout seuls. <strong>git fetch</strong> télécharge l'état à jour de toutes les branches distantes, sans toucher à ton travail local. C'est le geste pour « voir ce qui est apparu sur GitHub ».</p>
<pre class="pseudo">git fetch origin      # met a jour tes reperes origin/... (nouvelles branches, nouveaux commits)
git branch -r         # tu vois maintenant les branches distantes a jour</pre>

<h3>4. Récupérer une branche distante en local</h3>
<p>Pour travailler sur une branche qui existe sur GitHub mais pas encore chez toi, tu crées une branche locale qui la <strong>suit</strong>. La façon simple : <code>git switch</code> avec le nom de la branche distante ; Git crée automatiquement la branche locale liée.</p>
<pre class="pseudo">git fetch origin           # d'abord connaitre les branches distantes
git switch contact         # cree une branche locale "contact" qui suit origin/contact
# (forme explicite equivalente : git switch -c contact origin/contact)</pre>
<div class="tip">Une branche locale qui « suit » une branche distante est dite <strong>de suivi</strong> (tracking). Grâce à ce lien, un simple <code>git pull</code> ou <code>git push</code> sait automatiquement de/vers où aller.</div>

<h3>5. Publier et supprimer des branches distantes</h3>
<p>Pour envoyer une branche locale sur GitHub la première fois, on pousse avec <strong>-u</strong> (établit le suivi). Pour supprimer une branche distante, on pousse une suppression avec <code>--delete</code>.</p>
<pre class="pseudo">git push -u origin contact       # publie la branche locale "contact" sur GitHub + etablit le suivi
git push origin --delete contact # supprime la branche "contact" SUR GitHub (le distant)
git branch -d contact            # supprime la branche LOCALE (les deux sont independantes)</pre>
<div class="warn">Supprimer une branche locale (<code>git branch -d</code>) ne la supprime PAS sur GitHub, et inversement. Local et distant sont deux mondes : pense à faire le ménage des deux côtés.</div>
<div class="tip">Sur GitHub (le site), l'onglet « Branches » du dépôt liste toutes les branches distantes, avec une corbeille pour les supprimer d'un clic. Après une Pull Request fusionnée, un bouton « Delete branch » apparaît.</div>`,
  exercises: [
    { type: "qcm", q: "Une « branche distante » est…", opts: ["Une branche qui existe sur le dépôt distant (origin)", "Une branche jamais fusionnée", "Une copie de sauvegarde locale", "Une branche protégée en écriture"], a: 0, exp: "Ex : origin/main, origin/contact." },
    { type: "input", q: "Complète : la branche main telle qu'elle est sur GitHub se note origin/______", a: ["main"], ph: "un nom", exp: "origin/main = la main distante." },
    { type: "input", q: "Complète : voir TOUTES les branches (locales et distantes) : git branch ______", a: ["-a", "a"], ph: "une option", exp: "git branch -a." },
    { type: "qcm", q: "git branch -r affiche…", opts: ["Les branches distantes seulement", "Les branches locales seulement", "Toutes les branches, locales et distantes", "Les branches déjà fusionnées"], a: 0, exp: "-r = remote (distantes)." },
    { type: "qcm", q: "git fetch origin sert à…", opts: ["Mettre à jour tes repères origin/... sans toucher au travail local", "Envoyer tes commits", "Supprimer une branche", "Cloner le dépôt"], a: 0, exp: "fetch rafraîchit la vue du distant." },
    { type: "vf", q: "Les repères origin/... se mettent à jour tout seuls en permanence.", a: false, exp: "Il faut un git fetch (ou pull) pour les rafraîchir." },
    { type: "qcm", q: "git switch contact (quand contact existe sur origin) …", opts: ["Crée une branche locale contact qui suit origin/contact", "Renomme origin/contact", "Copie contact sans lien de suivi", "Fusionne contact dans main"], a: 0, exp: "Git crée automatiquement la branche de suivi." },
    { type: "input", q: "Complète : publier une branche locale la 1re fois avec suivi : git push ______ origin contact", a: ["-u", "u"], ph: "une option", exp: "-u établit le suivi." },
    { type: "qcm", q: "Une branche locale « de suivi » (tracking) …", opts: ["Est liée à une branche distante ; pull/push savent où aller", "Ne peut plus être supprimée", "Se met à jour toute seule sans fetch", "Existe uniquement sur GitHub"], a: 0, exp: "Le lien de suivi simplifie pull et push." },
    { type: "qcm", q: "git push origin --delete contact …", opts: ["Supprime la branche contact sur GitHub", "Supprime la branche locale", "Renomme la branche distante", "Pousse tous tes commits"], a: 0, exp: "--delete pousse une suppression sur le distant." },
    { type: "vf", q: "Supprimer une branche locale la supprime aussi sur GitHub.", a: false, exp: "Local et distant sont indépendants : ménage des deux côtés." },
    { type: "input", q: "Complète : supprimer la branche LOCALE contact : git branch ______ contact", a: ["-d", "d"], ph: "une option", exp: "git branch -d contact (local)." },
    { type: "qcm", q: "Sur GitHub (le site), où voit-on toutes les branches ?", opts: ["Onglet « Branches » du dépôt", "Settings du compte", "L'onglet Commits", "Uniquement dans une Pull Request"], a: 0, exp: "L'onglet Branches liste et permet de supprimer." },
    { type: "input", q: "Complète : rafraîchir la liste des branches distantes : git ______ origin", a: ["fetch"], ph: "une commande", exp: "git fetch origin." },
    { type: "vf", q: "origin/main reflète l'état de GitHub tel qu'il était lors de ton dernier fetch/pull.", a: true, exp: "C'est une « photo » qui date de la dernière communication." }
  ],
  final: {
    title: "Exercice final — Rejoindre une branche d'équipe",
    intro: `<p>Une collègue t'annonce : « J'ai poussé une branche <code>promo</code> sur GitHub, va voir. » Tu veux la récupérer en local pour travailler dessus, puis publier tes propres changements.</p>`,
    questions: [
      { type: "input", q: "Commande pour rafraîchir ta vue des branches distantes :", a: ["git fetch origin", "git fetch"], ph: "git fetch …", exp: "fetch met à jour les origin/..." },
      { type: "input", q: "Commande pour voir les branches distantes disponibles :", a: ["git branch -r"], ph: "git branch …", exp: "git branch -r liste les distantes." },
      { type: "input", q: "Commande pour créer une branche locale « promo » qui suit origin/promo :", a: ["git switch promo", "git switch -c promo origin/promo", "git checkout promo"], ph: "git switch …", exp: "git switch promo crée la branche de suivi." },
      { type: "input", q: "Après tes commits, commande pour renvoyer promo sur GitHub :", a: ["git push", "git push origin promo"], ph: "git push …", exp: "git push (le suivi est déjà en place)." },
      { type: "vf", q: "Si tu supprimes promo en local, elle reste présente sur GitHub.", a: true, exp: "Local et distant sont indépendants." }
    ],
    solution: `<pre class="pseudo">git fetch origin          # rafraichir la vue du distant (nouvelles branches, commits)
git branch -r             # voir les branches distantes : origin/promo apparait
git switch promo          # creer une branche locale "promo" qui SUIT origin/promo
# ... git add / git commit de ton travail ...
git push                  # renvoyer sur GitHub (le suivi sait deja ou aller)

# Menage eventuel :
git push origin --delete promo   # supprimer promo SUR GitHub
git branch -d promo              # supprimer promo en LOCAL (independant du distant)</pre>
<p>Tu sais jongler entre branches locales et distantes. Demain : la Pull Request, pour proposer tes changements proprement.</p>`
  }
};
</script>
