<script>
var DAY = {
  num: 1,
  title: "Git et GitHub : quelle différence ?",
  subtitle: "Deux mots qui se ressemblent, deux outils très différents.",
  theory: `
<h3>1. Le problème que Git résout</h3>
<p>Imagine que tu écris un mémoire. Tu enregistres « memoire.doc », puis « memoire_v2.doc », puis « memoire_final.doc », puis « memoire_final_VRAI.doc »… Le lendemain tu ne sais plus lequel est le bon. Cette galère porte un nom : le manque de <strong>gestion de versions</strong>. Git est né pour la régler.</p>
<p><strong>Git</strong> est un <strong>logiciel de gestion de versions</strong> (en anglais <em>version control system</em>). Installé sur ton ordinateur, il photographie ton projet à chaque étape importante et garde tout l'historique. Tu peux revenir en arrière, comparer, retrouver qui a écrit quoi. C'est comme un appareil photo qui garde toutes les photos de ton projet, dans l'ordre, pour toujours.</p>
<div class="tip">Git a été créé en 2005 par Linus Torvalds (le créateur de Linux) pour gérer d'énormes projets à plusieurs. C'est aujourd'hui l'outil de versions le plus utilisé au monde.</div>

<h3>2. Ce qu'est GitHub</h3>
<p><strong>GitHub</strong> est un <strong>site web</strong> (une plateforme en ligne) qui héberge des projets Git. C'est un espace sur Internet où tu déposes une copie de ton projet pour la sauvegarder, la partager et travailler à plusieurs. Pense à GitHub comme au « cloud » (Google Drive, Dropbox…) mais spécialisé pour les projets Git.</p>
<p>Analogie utile : <strong>Git est l'outil</strong> (comme un traitement de texte installé sur ta machine) ; <strong>GitHub est le service en ligne</strong> (comme un Google Drive où tu ranges et partages tes documents). L'un ne remplace pas l'autre : on utilise souvent les deux ensemble.</p>
<div class="warn">Git peut fonctionner tout seul, sans Internet et sans GitHub. GitHub, lui, a besoin de Git : c'est un hébergeur de projets Git. Il existe d'ailleurs des concurrents à GitHub : GitLab, Bitbucket…</div>

<h3>3. Local et distant</h3>
<p>Deux mots reviendront sans cesse. Le <strong>local</strong>, c'est ton ordinateur : les fichiers et l'historique Git qui vivent chez toi. Le <strong>distant</strong> (en anglais <em>remote</em>), c'est la copie hébergée ailleurs, sur GitHub. Travailler avec Git et GitHub, c'est faire voyager ton travail entre le local (chez toi) et le distant (sur le web).</p>
<pre class="pseudo">Ton ordinateur (LOCAL)              GitHub (DISTANT / remote)
  ├─ tes fichiers                      ├─ une copie de tes fichiers
  └─ Git : tout l'historique   <--->   └─ l'historique partagé, visible en ligne
  #  tu travailles ici               #  tu partages et sauvegardes ici</pre>

<h3>4. Ligne de commande ou site web ?</h3>
<p>Il est essentiel de distinguer les deux façons d'agir. Avec <strong>Git</strong>, tu tapes des <strong>commandes</strong> dans un terminal (une fenêtre où l'on écrit des instructions), par exemple :</p>
<pre class="pseudo">git status     # Git (local) : demande l'etat actuel du projet, en ligne de commande
git commit     # Git (local) : enregistre une nouvelle version</pre>
<p>Avec <strong>GitHub</strong>, tu cliques dans une <strong>interface web</strong> : des boutons, des menus, des pages. Par exemple, pour changer un réglage d'un projet sur GitHub, tu suis un chemin dans le site : <code>Dépôt ▸ Settings ▸ Options</code>. Tout au long du cours, on écrira les commandes Git dans des blocs gris, et on décrira les chemins de clic GitHub avec des flèches (▸).</p>

<h3>5. Pourquoi apprendre les deux ?</h3>
<p>Aujourd'hui, savoir utiliser Git et GitHub est une compétence de base pour tout développeur, mais aussi pour beaucoup d'autres métiers (rédaction, data, design). Git te protège des pertes et des « versions finales VRAIES ». GitHub te permet de collaborer, de montrer ton travail (un profil GitHub est une vitrine) et de contribuer à des projets du monde entier.</p>
<div class="tip">Résumé à retenir : Git = le logiciel de versions sur ta machine (commandes). GitHub = le site web qui héberge et partage les projets Git (clics).</div>`,
  exercises: [
    { type: "qcm", q: "Git est avant tout…", opts: ["Un logiciel de gestion de versions installé sur ton ordinateur", "Un site web", "Un éditeur de code (un IDE)", "Un langage de programmation"], a: 0, exp: "Git est le logiciel local qui gère l'historique des versions." },
    { type: "qcm", q: "GitHub est avant tout…", opts: ["Une plateforme web qui héberge des projets Git", "Un logiciel installé sur ta machine", "Un système de gestion de versions local", "Un terminal de commandes"], a: 0, exp: "GitHub est le service en ligne d'hébergement et de partage." },
    { type: "vf", q: "Git peut fonctionner sans Internet ni GitHub.", a: true, exp: "Git est local : il marche seul sur ta machine, hors ligne." },
    { type: "vf", q: "GitHub est le seul hébergeur de projets Git au monde.", a: false, exp: "Il existe des concurrents comme GitLab ou Bitbucket." },
    { type: "input", q: "Complète : le logiciel de versions qui vit sur ton ordinateur s'appelle ______.", a: ["git"], ph: "un nom", exp: "Git, le logiciel local." },
    { type: "input", q: "Complète : la plateforme web qui héberge les projets s'appelle ______.", a: ["github"], ph: "un nom", exp: "GitHub, le site web." },
    { type: "qcm", q: "Comment agit-on avec Git le plus souvent ?", opts: ["En tapant des commandes dans un terminal", "En cliquant sur des boutons d'un site", "Avec la souris uniquement", "Depuis le gestionnaire de fichiers du système"], a: 0, exp: "Git s'utilise en ligne de commande." },
    { type: "qcm", q: "Comment agit-on avec GitHub ?", opts: ["Via une interface web (boutons, menus, pages)", "Uniquement en ligne de commande", "En connectant un dépôt local avec git init", "En installant l'application GitHub Desktop"], a: 0, exp: "GitHub est un site : on clique." },
    { type: "input", q: "Complète : le mot anglais pour « distant » (la copie hébergée sur GitHub) est ______.", a: ["remote"], ph: "un mot anglais", exp: "Remote = distant." },
    { type: "qcm", q: "Dans le vocabulaire Git, le « local » désigne…", opts: ["Ton ordinateur et l'historique qui y vit", "Le serveur de GitHub", "La branche principale du projet", "Le dossier caché .git uniquement"], a: 0, exp: "Local = chez toi, sur ta machine." },
    { type: "vf", q: "Git a été créé pour éviter les fichiers du type « memoire_final_VRAI.doc ».", a: true, exp: "Git gère les versions à ta place : plus besoin de copies manuelles." },
    { type: "qcm", q: "Quelle affirmation est correcte ?", opts: ["GitHub a besoin de Git pour fonctionner", "Git a besoin de GitHub pour fonctionner", "Les deux sont le même logiciel", "Aucun des deux ne gère les versions"], a: 0, exp: "GitHub héberge des projets Git : c'est Git qui est au cœur." },
    { type: "qcm", q: "Un profil GitHub sert aussi de…", opts: ["Vitrine de ton travail visible en ligne", "Sauvegarde automatique de ton disque dur", "Espace de stockage de fichiers personnels", "Messagerie entre développeurs"], a: 0, exp: "Beaucoup d'employeurs regardent le GitHub d'un candidat." },
    { type: "input", q: "Complète la commande qui demande l'état du projet : git ______", a: ["status"], ph: "une commande", exp: "git status affiche l'état local." },
    { type: "vf", q: "Le mot « distant » (remote) désigne la copie de ton projet hébergée sur GitHub.", a: true, exp: "Local = chez toi ; distant = sur le web." }
  ],
  final: {
    title: "Exercice final — Ranger les idées",
    intro: `<p>Une amie débutante te dit : « Git, GitHub, c'est pareil non ? » Tu veux lui répondre clairement. Réfléchis aux 5 questions ci-dessous pour bien distinguer l'outil local du service en ligne.</p>`,
    questions: [
      { type: "qcm", q: "Le logiciel installé sur la machine, qui gère l'historique, c'est…", opts: ["Git", "GitHub", "GitLab", "Bitbucket"], a: 0, exp: "Git = logiciel local." },
      { type: "qcm", q: "Le site web qui héberge et partage les projets, c'est…", opts: ["GitHub", "Git", "Le dépôt local", "Git Bash"], a: 0, exp: "GitHub = plateforme web." },
      { type: "vf", q: "On peut faire des versions avec Git même sans compte GitHub.", a: true, exp: "Git est indépendant : GitHub n'est qu'un hébergeur." },
      { type: "input", q: "Complète : avec Git on tape des ______ dans un terminal.", a: ["commandes", "commande"], ph: "un mot", exp: "Des commandes en ligne de commande." },
      { type: "vf", q: "Avec GitHub, on agit surtout en cliquant dans une interface web.", a: true, exp: "GitHub est un site : boutons et menus." }
    ],
    solution: `<pre class="pseudo"># Ce qu'il faut retenir de ce premier jour :
Git    = logiciel de gestion de versions, LOCAL, sur ta machine   # on tape des commandes (git status, git commit...)
GitHub = plateforme WEB qui heberge et partage des projets Git    # on clique dans le site (Depot > Settings...)

local   = ton ordinateur (les fichiers + l'historique Git chez toi)
distant = remote = la copie hebergee en ligne, sur GitHub

# Les deux travaillent ensemble : tu versionnes en local avec Git,
# puis tu envoies (partages) sur GitHub.</pre>
<p>Demain : on crée ton compte GitHub, ta première étape sur la plateforme.</p>`
  }
};
</script>

    checklist: ["As-tu bien distingué Git (logiciel local, commandes) de GitHub (site web, clics) ?", "As-tu précisé que Git fonctionne sans Internet alors que GitHub en a besoin ?", "As-tu indiqué où vit chacun (local sur ta machine / en ligne sur le web) ?", "As-tu terminé par une phrase qui résume la distinction en une ligne ?"],

    solution: "# Réponse type (à formuler avec tes mots) :\nGit est un LOGICIEL installé sur mon ordinateur.        # il gère l'historique des versions, en local\n  On l'utilise en tapant des commandes (ex : git status). # ligne de commande, marche sans Internet\n\nGitHub est un SITE WEB qui héberge des projets Git.     # une plateforme en ligne\n  On l'utilise en cliquant dans son interface web.        # boutons, menus, pages ; besoin d'Internet\n\nEn résumé : Git = l'outil de versions sur ma machine ;   # local, commandes\n            GitHub = le service en ligne pour sauvegarder et partager. # distant, clics",
