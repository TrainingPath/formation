  title: "Publier un site avec GitHub Pages",
  subtitle: "Transformer un dépôt en site web visible par le monde entier, gratuitement.",
  theory: `
<h3>1. Qu'est-ce que GitHub Pages ?</h3>
<p><strong>GitHub Pages</strong> est un service gratuit qui transforme un dépôt en <strong>site web public</strong>. GitHub prend les fichiers de ton dépôt (HTML, CSS, JavaScript, images) et les sert à une adresse web réelle. C'est parfait pour un portfolio, la documentation d'un projet, ou une petite page de présentation.</p>
<div class="warn">GitHub Pages ne publie que des <strong>sites statiques</strong> : des fichiers déjà prêts (HTML, CSS, JS, images). Pas de base de données, pas de code serveur (PHP, Python côté serveur…). Pour un blog ou un portfolio, c'est amplement suffisant.</div>

<h3>2. Un site statique, c'est quoi ?</h3>
<p>Un site <strong>statique</strong> est fait de fichiers livrés tels quels au navigateur, sans traitement sur un serveur. Le point d'entrée est presque toujours un fichier nommé <strong>index.html</strong> : c'est la page d'accueil, celle qui s'ouvre quand on arrive à la racine du site.</p>

<h3>3. Activer Pages : le chemin exact</h3>
<div class="tip">Dépôt ▸ <strong>Settings</strong> ▸ menu de gauche <strong>Pages</strong> ▸ section <strong>Build and deployment</strong> ▸ <strong>Source : Deploy from a branch</strong> ▸ choisir la branche <strong>main</strong> et le dossier <strong>/ (root)</strong> ▸ <strong>Save</strong>.</div>
<p>Après quelques instants, GitHub affiche en haut de cette même page : « Your site is live at… » avec l'adresse. Le déploiement n'est pas instantané : compte parfois une à deux minutes.</p>

<h3>4. L'adresse de ton site</h3>
<pre class="pseudo">https://TON-PSEUDO.github.io/NOM-DU-DEPOT/     # adresse d'un site de projet classique
https://TON-PSEUDO.github.io/                  # cas special : depot nomme TON-PSEUDO.github.io</pre>
<p>Si tu nommes ton dépôt exactement <code>ton-pseudo.github.io</code>, le site s'ouvre à la racine, sans le nom du dépôt à la fin. C'est le dépôt idéal pour un portfolio personnel.</p>

<h3>5. Mettre à jour et publier des changements</h3>
<p>Une fois Pages activé, publier une nouvelle version est aussi simple qu'un push : chaque envoi sur la branche choisie relance automatiquement le déploiement.</p>
<pre class="pseudo">git add index.html style.css    # tes fichiers de site
git commit -m "Met a jour la page d'accueil"
git push origin main            # GitHub Pages redeploie tout seul apres le push</pre>
<div class="tip">Astuce liens : sur un site publié, écris tes chemins en <strong>relatif</strong> (<code>style.css</code>, <code>images/logo.png</code>) et non en absolu (<code>/style.css</code>). Sur un site de projet, l'absolu casserait les liens à cause du <code>/NOM-DU-DEPOT/</code> dans l'adresse.</div>
<div class="tip">GitHub Pages sert un fichier <strong>404.html</strong> automatiquement si un visiteur demande une page qui n'existe pas : pratique pour une page « introuvable » soignée.</div>`,

    { type: "qcm", q: "GitHub Pages publie…", opts: ["Des sites statiques (HTML, CSS, JS, images)", "N'importe quel code serveur", "Des bases de données", "Des applications PHP"], a: 0, exp: "Uniquement des fichiers statiques déjà prêts." },
    { type: "input", q: "Le nom du fichier qui sert de page d'accueil d'un site :", a: ["index.html", "index"], ph: "…", exp: "index.html s'ouvre à la racine du site." },

    { type: "qcm", q: "Après activation, GitHub affiche…", opts: ["« Your site is live at… » avec l'adresse", "Un message d'erreur", "Rien du tout", "Le mot de passe du site"], a: 0, exp: "L'adresse du site en ligne apparaît en haut de la page Pages." },
    { type: "input", q: "Complète l'adresse d'un site de projet : « https://pseudo.github.io/… » (que met-on après le slash ?)", a: ["nom-du-depot", "le nom du depot", "nom du depot", "NOM-DU-DEPOT"], ph: "…", exp: "Le nom du dépôt vient après le slash." },
    { type: "qcm", q: "Pour qu'un site s'ouvre à la racine (sans nom de dépôt dans l'URL), il faut nommer le dépôt…", opts: ["ton-pseudo.github.io", "site.html", "main", "index"], a: 0, exp: "Le dépôt pseudo.github.io se sert à la racine." },
    { type: "vf", q: "Le déploiement d'un site GitHub Pages peut prendre une à deux minutes.", a: true, exp: "Ce n'est pas instantané : patiente un peu après le Save ou le push." },
    { type: "qcm", q: "Pour publier une nouvelle version du site, il suffit de…", opts: ["Faire un push sur la branche configurée", "Recréer le dépôt", "Refaire un fork", "Supprimer index.html"], a: 0, exp: "Chaque push relance le déploiement automatiquement." },
    { type: "input", q: "Commande pour envoyer tes changements et déclencher le redéploiement (branche main) :", a: ["git push origin main", "git push"], ph: "git push …", exp: "GitHub Pages redéploie après le push." },
    { type: "qcm", q: "Sur un site de projet, les liens vers tes fichiers doivent être…", opts: ["Relatifs (style.css)", "Absolus (/style.css)", "En majuscules", "Cryptés"], a: 0, exp: "L'absolu casse à cause du /nom-du-depot/ dans l'adresse." },
    { type: "vf", q: "GitHub Pages peut exécuter du code serveur comme du PHP ou une base de données.", a: false, exp: "Non : sites statiques uniquement." },
    { type: "qcm", q: "Un fichier nommé 404.html dans le dépôt sert à…", opts: ["Afficher une page « introuvable » personnalisée", "Supprimer le site", "Accélérer le code", "Stocker un mot de passe"], a: 0, exp: "GitHub Pages l'utilise pour les pages inexistantes." }
  ],
  final: {
    title: "Exercice final — Mettre son portfolio en ligne",
    intro: `<p>Tu as un dossier avec index.html, style.css et un dossier images/. Tu veux publier ce portfolio en ligne avec GitHub Pages, sur un nouveau dépôt.</p>`,
    questions: [
      { type: "input", q: "Quel fichier doit absolument se trouver à la racine pour servir de page d'accueil ?", a: ["index.html", "index"], ph: "…", exp: "index.html est le point d'entrée." },
      { type: "input", q: "Après avoir poussé tes fichiers, dans quel onglet vas-tu pour activer la publication ?", a: ["Settings", "settings"], ph: "…", exp: "Settings ▸ Pages." },
      { type: "qcm", q: "Quelle source et quelle branche choisis-tu ?", opts: ["Deploy from a branch ▸ main ▸ /(root)", "Deploy from a fork", "Une release", "L'onglet Issues"], a: 0, exp: "On sert la racine de main." },
      { type: "qcm", q: "Quelle sera l'adresse de ton site (dépôt nommé « portfolio ») ?", opts: ["https://ton-pseudo.github.io/portfolio/", "https://portfolio.com", "https://github.com/portfolio", "https://ton-pseudo.fr"], a: 0, exp: "pseudo.github.io/nom-du-depot/." },
      { type: "vf", q: "Pour publier une correction plus tard, il te suffira de refaire un git push sur main.", a: true, exp: "Chaque push redéploie le site automatiquement." }
    ],
    solution: `<pre class="pseudo">1. S'assurer que index.html est A LA RACINE du depot
   (avec style.css et le dossier images/, liens en RELATIF)
2. git add index.html style.css images/
   git commit -m "Mon portfolio"
   git push origin main

3. Settings ▸ Pages ▸ Build and deployment
     Source : Deploy from a branch
     Branch : main   Folder : / (root)
     Save
4. Attendre 1-2 min ▸ « Your site is live at
   https://ton-pseudo.github.io/portfolio/ »

5. Mise a jour future :
   ... modifier les fichiers ...
   git commit -am "Ajoute un projet au portfolio"
   git push origin main            # redeploiement automatique</pre>
<p>Ton travail est en ligne, accessible au monde entier. Demain : soigner ton profil GitHub et son README de présentation.</p>`
  }
};
