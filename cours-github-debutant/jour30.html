<script>
var DAY = {
  num: 30,
  title: "Bonnes pratiques de commits et de collaboration",
  subtitle: "La différence entre un dépôt qu'on subit et un dépôt qu'on aime.",
  theory: `
<h3>1. Un commit = une idée</h3>
<p>Un bon commit regroupe <strong>un seul changement cohérent</strong>. On évite le commit fourre-tout qui mélange une correction de bug, une nouvelle fonctionnalité et un renommage de fichiers. Plus tard, si un problème surgit, un historique de petits commits clairs permet de retrouver le coupable en quelques secondes.</p>
<pre class="pseudo">MAUVAIS   git commit -m "des trucs"        # ne dit rien ; melange tout
BON       git commit -m "Corrige le calcul de la TVA"   # une idee, un message clair</pre>

<h3>2. Écrire un bon message de commit</h3>
<p>La convention la plus répandue : une <strong>première ligne courte</strong> (environ 50 caractères), à l'<strong>impératif présent</strong> (« Ajoute… », « Corrige… », « Supprime… »), qui décrit ce que fait le commit. Si besoin, une ligne vide puis un paragraphe explique le <em>pourquoi</em>.</p>
<pre class="pseudo">Ajoute la validation de l'adresse e-mail       # ligne 1 : courte, imperatif, le QUOI

Sans validation, un e-mail invalide provoquait  # ligne vide puis le POURQUOI
une erreur au moment de l'inscription.</pre>
<div class="tip">Truc mnémotechnique : un bon message complète la phrase « Si je l'applique, ce commit va… <em>Ajouter la validation de l'e-mail</em> ». D'où l'impératif présent.</div>

<h3>3. Le style « Conventional Commits »</h3>
<p>Beaucoup d'équipes préfixent le message par un <strong>type</strong>, ce qui rend l'historique lisible et automatisable :</p>
<pre class="pseudo">feat:     une nouvelle fonctionnalite     # feat = feature
fix:      une correction de bug
docs:     de la documentation
refactor: du code reorganise sans changer le comportement
test:     des tests ajoutes ou corriges

exemple :  fix: empeche le double envoi du formulaire</pre>

<h3>4. Committer souvent, pousser propre</h3>
<pre class="pseudo">git status     # AVANT de commiter : que vais-je enregistrer, au juste ?
git diff       # relire ses propres changements : la meilleure auto-relecture
git add -p     # ajouter par MORCEAUX pour separer proprement deux idees</pre>
<p>Commite <strong>souvent</strong> (petits pas sûrs), mais ne pousse que du travail propre. Avant chaque commit, un <code>git status</code> + <code>git diff</code> évite d'enregistrer un fichier par erreur… ou un secret (rappel du jour 27).</p>

<h3>5. Bien collaborer : les règles humaines</h3>
<p>La technique ne fait pas tout. Une équipe qui fonctionne suit quelques principes simples :</p>
<pre class="pseudo">- Petites Pull Requests    # une PR courte se relit vite et bien ; une PR geante decourage
- Descriptions claires     # dire ce que fait la PR et pourquoi ; lier l'Issue (closes #42)
- Relire avec bienveillance  # critiquer le code, jamais la personne (rappel du jour 17)
- Repondre aux revues      # traiter chaque remarque, resoudre les discussions
- Garder main stable       # brancher, PR, merge (le GitHub Flow du jour 21)</pre>
<div class="warn">Ne réécris jamais l'historique d'une branche partagée (par exemple avec un rebase ou un push forcé) : tu casserais le travail des autres qui l'ont déjà récupérée. Réserve ces gestes à tes branches privées non encore poussées.</div>
<div class="tip">Un fichier <strong>CONTRIBUTING.md</strong> à la racine du dépôt écrit ces règles noir sur blanc : format des commits, façon d'ouvrir une PR, style de code. C'est le mode d'emploi de la collaboration.</div>`,
  exercises: [
    { type: "qcm", q: "Un bon commit regroupe…", opts: ["Un seul changement cohérent", "Tout le travail de la semaine", "Trois idées sans rapport", "Uniquement des fichiers supprimés"], a: 0, exp: "Un commit = une idée : plus facile à relire et à annuler." },
    { type: "qcm", q: "La première ligne d'un message de commit doit être…", opts: ["Courte et à l'impératif présent", "Un roman de dix lignes", "Vide", "En majuscules criardes"], a: 0, exp: "Environ 50 caractères, « Ajoute… », « Corrige… »." },
    { type: "input", q: "Réécris ce message à l'impératif présent : le commit ajoute un bouton de connexion. « … un bouton de connexion »", a: ["Ajoute un bouton de connexion", "ajoute un bouton de connexion"], ph: "…", exp: "L'impératif présent : « Ajoute… »." },
    { type: "qcm", q: "Après la première ligne, le paragraphe optionnel sert à expliquer…", opts: ["Le pourquoi du changement", "Ton adresse", "La météo", "Le mot de passe"], a: 0, exp: "Le quoi en ligne 1, le pourquoi en dessous." },
    { type: "input", q: "Dans les Conventional Commits, le préfixe pour une nouvelle fonctionnalité :", a: ["feat", "feat:"], ph: "…:", exp: "feat: pour une feature ; fix: pour un bug." },
    { type: "input", q: "Le préfixe Conventional Commits pour une correction de bug :", a: ["fix", "fix:"], ph: "…:", exp: "fix: annonce une correction." },
    { type: "input", q: "La commande à lancer AVANT de commiter pour voir ce qui sera enregistré :", a: ["git status"], ph: "git …", exp: "git status montre l'état de la copie de travail." },
    { type: "qcm", q: "« git add -p » sert à…", opts: ["Ajouter les changements par morceaux, pour séparer deux idées", "Supprimer le dépôt", "Pousser sur main", "Créer une branche"], a: 0, exp: "-p (patch) ajoute morceau par morceau." },
    { type: "vf", q: "Il vaut mieux committer souvent, par petits pas, que faire un seul commit géant en fin de semaine.", a: true, exp: "Les petits commits racontent mieux le travail et s'annulent plus facilement." },
    { type: "qcm", q: "Une bonne Pull Request est plutôt…", opts: ["Courte et facile à relire", "Énorme, pour tout envoyer d'un coup", "Sans aucune description", "Faite directement sur main"], a: 0, exp: "Une petite PR se relit vite et bien." },
    { type: "input", q: "Dans une description de PR, comment relier automatiquement l'Issue 42 pour la fermer ? (deux mots + numéro)", a: ["closes #42", "fixes #42", "resolves #42"], ph: "… #42", exp: "closes #42 (ou fixes/resolves) ferme l'Issue à la fusion." },
    { type: "vf", q: "En revue, on critique la personne plutôt que le code.", a: false, exp: "L'inverse : on critique le code, jamais la personne (jour 17)." },
    { type: "qcm", q: "Réécrire l'historique d'une branche PARTAGÉE (rebase, push forcé)…", opts: ["Casse le travail des autres qui l'ont récupérée", "Est toujours recommandé", "Accélère le code", "N'a aucun effet"], a: 0, exp: "À réserver à ses branches privées non poussées." },
    { type: "input", q: "Le fichier qui écrit noir sur blanc les règles de contribution d'un dépôt :", a: ["CONTRIBUTING.md", "contributing.md", "CONTRIBUTING"], ph: "…", exp: "CONTRIBUTING.md : le mode d'emploi de la collaboration." },
    { type: "vf", q: "Un git status + git diff avant de commiter aide à éviter d'enregistrer un fichier ou un secret par erreur.", a: true, exp: "C'est la meilleure auto-relecture avant d'enregistrer." }
  ],
  final: {
    title: "Exercice final — Transformer de mauvaises habitudes",
    intro: `<p>Un coéquipier travaille ainsi : il code toute la semaine, fait un seul commit « maj » le vendredi, le pousse directement sur main, et ses PR (quand il en fait) contiennent 60 fichiers sans description. Tu veux l'aider à s'améliorer.</p>`,
    questions: [
      { type: "qcm", q: "Le premier conseil sur ses commits :", opts: ["Committer souvent, un changement cohérent par commit", "Committer encore moins souvent", "Ne plus jamais committer", "Committer sans message"], a: 0, exp: "Un commit = une idée, au fil du travail." },
      { type: "input", q: "Réécris son message « maj » façon impératif présent pour un commit qui corrige l'affichage mobile :", a: ["Corrige l'affichage mobile", "corrige l'affichage mobile", "Corrige l'affichage sur mobile"], ph: "…", exp: "Un message clair et à l'impératif." },
      { type: "qcm", q: "À propos de son push direct sur main, tu recommandes…", opts: ["De brancher, ouvrir une PR, puis fusionner (GitHub Flow)", "De continuer à pousser sur main", "De supprimer main", "De forker à chaque fois"], a: 0, exp: "main reste stable ; tout passe par une branche et une PR." },
      { type: "qcm", q: "Pour ses PR de 60 fichiers sans description, tu suggères…", opts: ["Des PR plus petites, avec une description claire", "Des PR encore plus grosses", "De supprimer les descriptions", "De ne plus relire"], a: 0, exp: "Petites PR + description : relecture rapide et utile." },
      { type: "vf", q: "Écrire ces règles dans un CONTRIBUTING.md aide toute l'équipe à les suivre.", a: true, exp: "Le mode d'emploi partagé aligne tout le monde." }
    ],
    solution: `<pre class="pseudo">Avant                          Apres (bonnes pratiques)
------------------------------ --------------------------------------
1 commit « maj » / semaine   → commits frequents, 1 idee chacun
                               git commit -m "Corrige l'affichage mobile"
                               (impératif, ou fix: si Conventional Commits)

push direct sur main          → GitHub Flow : branche → PR → merge
                               main reste toujours stable

PR de 60 fichiers, sans texte → petites PR ciblees + description :
                               « Ce que ca fait / pourquoi », closes #42

Rituel avant chaque commit    → git status && git diff
                               (aucun fichier ni secret par erreur)

Ecrire les regles             → un CONTRIBUTING.md a la racine</pre>
<p>De bonnes habitudes rendent un dépôt agréable à vivre pour toute l'équipe. Demain, le grand jour : le projet final, où tu publies et documentes un projet complet.</p>`
  }
};
</script>
