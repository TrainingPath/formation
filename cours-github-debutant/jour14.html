<script>
var DAY = {
  num: 14,
  title: "Résoudre un conflit de fusion",
  subtitle: "Quand deux versions se disputent la même ligne, c'est toi qui tranches.",
  theory: `
<h3>1. Pourquoi un conflit ?</h3>
<p>Un <strong>conflit de fusion</strong> survient quand deux branches ont modifié <strong>la même ligne du même fichier</strong> de façons différentes. Git sait fusionner des changements qui ne se chevauchent pas, mais là, il ne peut pas deviner laquelle des deux versions garder. Il s'arrête et te passe la main. Ce n'est ni un bug ni une catastrophe : c'est une décision humaine à prendre.</p>
<pre class="pseudo">git merge contact
Auto-merging index.html
CONFLICT (content): Merge conflict in index.html   # Git met la fusion en PAUSE et te previent
Automatic merge failed; fix conflicts and then commit the result.</pre>

<h3>2. Reconnaître les marqueurs de conflit</h3>
<p>Git modifie le fichier en litige en y insérant des <strong>marqueurs</strong>. Ils encadrent les deux versions pour que tu voies clairement ce qui s'oppose.</p>
<pre class="pseudo">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD                 # debut : ta version (branche courante, ex. main)
Bienvenue sur notre site !
=======                       # separateur entre les deux versions
Bienvenue sur le site officiel.
&gt;&gt;&gt;&gt;&gt;&gt;&gt; contact             # fin : la version venant de l'autre branche (contact)</pre>
<div class="tip">Lecture des marqueurs : entre <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> et <code>=======</code> se trouve TA version (HEAD) ; entre <code>=======</code> et <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> se trouve celle de l'autre branche.</div>

<h3>3. Résoudre : choisir, puis nettoyer</h3>
<p>Résoudre un conflit, c'est <strong>éditer le fichier à la main</strong> pour obtenir la version finale voulue, PUIS <strong>supprimer les trois marqueurs</strong>. Tu peux garder l'une des versions, l'autre, ou un mélange des deux. Le fichier doit finir propre, sans aucun <code>&lt;&lt;&lt;</code>, <code>===</code> ni <code>&gt;&gt;&gt;</code>.</p>
<pre class="pseudo"># Fichier APRES resolution (marqueurs enleves, version choisie) :
Bienvenue sur le site officiel !     # on a garde/combine ce qu'on voulait, plus aucun marqueur</pre>
<div class="warn">Oublier d'enlever un marqueur (<code>=======</code> par exemple) laisse un texte parasite dans le fichier. Relis toujours : plus aucun <code>&lt;</code>&lt;&lt; ni <code>&gt;</code>&gt;&gt; ne doit subsister.</div>

<h3>4. Finaliser la fusion</h3>
<p>Une fois le fichier corrigé, tu indiques à Git que le conflit est réglé en l'<strong>ajoutant</strong> (git add), puis tu <strong>termines la fusion</strong> avec un commit. Git propose un message de fusion tout prêt : tu peux l'accepter.</p>
<pre class="pseudo">git add index.html         # marque le fichier comme "conflit resolu"
git commit                 # termine la fusion (Git propose deja un message "Merge branch...")
git status                 # verifie : plus de conflit, l'arbre est propre</pre>
<div class="tip">Si tu paniques en plein conflit, tu peux tout annuler et revenir à l'état d'avant la fusion avec <code>git merge --abort</code>. Rien n'est cassé, tu recommences quand tu veux.</div>

<h3>5. Résoudre un conflit sur GitHub (le site)</h3>
<p>Lors d'une Pull Request (jour 16), si un conflit empêche la fusion, GitHub affiche un bouton <strong>« Resolve conflicts »</strong>. Il ouvre un éditeur web montrant les mêmes marqueurs : tu choisis la bonne version, tu enlèves les marqueurs, puis « Mark as resolved » et « Commit merge ». C'est la version cliquable de ce que tu viens d'apprendre.</p>
<pre class="pseudo">Pull Request avec conflit ▸ bouton "Resolve conflicts"
  ▸ editer le fichier (memes marqueurs, choisir la bonne version, enlever les marqueurs)
  ▸ "Mark as resolved" ▸ "Commit merge"     # la fusion peut alors se faire</pre>
<div class="warn">Un conflit n'est jamais résolu automatiquement « au hasard » : c'est toujours un humain qui choisit. Prends le temps de comprendre les deux versions avant de trancher.</div>`,
  exercises: [
    { type: "qcm", q: "Un conflit de fusion survient quand…", opts: ["Deux branches ont modifié la même ligne différemment", "Une seule branche a été modifiée", "Les deux branches modifient des fichiers différents", "La branche destination n'a pas changé"], a: 0, exp: "Git ne peut pas choisir seul : à toi de trancher." },
    { type: "vf", q: "Un conflit est un bug grave qui casse le dépôt.", a: false, exp: "C'est une décision humaine normale, qui se résout." },
    { type: "qcm", q: "Entre <<<<<<< HEAD et ======= se trouve…", opts: ["Ta version (branche courante)", "La version de l'autre branche", "La version fusionnée finale", "La version commune d'origine"], a: 0, exp: "HEAD = ta version courante." },
    { type: "qcm", q: "Entre ======= et >>>>>>> contact se trouve…", opts: ["La version venant de l'autre branche (contact)", "Ta version", "La version d'origine commune", "Le résultat final de la fusion"], a: 0, exp: "C'est la version de la branche fusionnée." },
    { type: "qcm", q: "Résoudre un conflit, c'est…", opts: ["Éditer le fichier pour la version finale ET enlever les marqueurs", "Laisser Git choisir automatiquement", "Garder les deux versions avec les marqueurs", "Relancer git merge une seconde fois"], a: 0, exp: "On choisit, on nettoie, on finalise." },
    { type: "vf", q: "Après résolution, il ne doit rester aucun marqueur (<<<, ===, >>>) dans le fichier.", a: true, exp: "Sinon il reste du texte parasite." },
    { type: "input", q: "Complète : après avoir corrigé le fichier, on le marque résolu avec git ______ index.html", a: ["add"], ph: "une commande", exp: "git add signale « conflit résolu »." },
    { type: "input", q: "Complète : pour terminer la fusion après résolution : git ______", a: ["commit"], ph: "une commande", exp: "git commit clôt la fusion." },
    { type: "qcm", q: "git merge --abort sert à…", opts: ["Annuler la fusion et revenir à l'état d'avant", "Forcer la fusion malgré le conflit", "Valider la fusion sans committer", "Garder automatiquement ta version"], a: 0, exp: "En cas de panique, on repart de zéro sans casse." },
    { type: "qcm", q: "Peut-on combiner un morceau des deux versions lors d'une résolution ?", opts: ["Oui, tu écris la version finale que tu veux", "Non, il faut choisir une seule version entière", "Non, Git l'interdit", "Seulement sur GitHub"], a: 0, exp: "Tu es libre du résultat final." },
    { type: "vf", q: "Sur GitHub, un bouton « Resolve conflicts » permet de régler un conflit de PR dans le navigateur.", a: true, exp: "C'est la version web de la résolution." },
    { type: "qcm", q: "Après git add du fichier résolu, git status devrait montrer…", opts: ["Plus de conflit, prêt à committer", "Encore un conflit", "La fusion annulée", "Les marqueurs encore présents"], a: 0, exp: "Le conflit est marqué comme réglé." },
    { type: "qcm", q: "Qui décide quelle version garder lors d'un conflit ?", opts: ["Un humain (toi)", "Git, au hasard", "GitHub automatiquement", "L'ordinateur seul"], a: 0, exp: "La résolution est toujours un choix humain." },
    { type: "input", q: "Complète le marqueur de DÉBUT d'un conflit : <<<<<<< ______", a: ["head", "HEAD"], ph: "un mot", exp: "<<<<<<< HEAD marque le début (ta version)." },
    { type: "vf", q: "Il faut relire le fichier pour être sûr qu'aucun marqueur ne reste avant de committer.", a: true, exp: "Un marqueur oublié laisse du texte parasite." }
  ],
  final: {
    title: "Exercice final — Trancher un conflit",
    intro: `<p>Tu fusionnes « contact » dans « main » et Git signale : <code>CONFLICT (content): Merge conflict in index.html</code>. En ouvrant le fichier, tu vois :</p>
<pre class="pseudo">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
&lt;h1&gt;Bienvenue !&lt;/h1&gt;
=======
&lt;h1&gt;Bienvenue sur notre site&lt;/h1&gt;
&gt;&gt;&gt;&gt;&gt;&gt;&gt; contact</pre>
<p>Tu décides de garder le titre de la branche contact.</p>`,
    questions: [
      { type: "qcm", q: "La version « Bienvenue sur notre site » vient de…", opts: ["La branche contact (après =======)", "main (après <<<<<<<)", "La version d'origine commune", "Le commit de fusion"], a: 0, exp: "Après ======= = la branche fusionnée." },
      { type: "qcm", q: "Que dois-tu obtenir dans le fichier final ?", opts: ["Le titre choisi, SANS aucun marqueur", "Les deux titres et les marqueurs", "Un fichier vide", "Seulement le séparateur ======="], a: 0, exp: "Version voulue + zéro marqueur." },
      { type: "input", q: "Après avoir nettoyé le fichier, commande pour le marquer résolu :", a: ["git add index.html"], ph: "git add …", exp: "git add index.html." },
      { type: "input", q: "Commande pour terminer la fusion :", a: ["git commit"], ph: "git …", exp: "git commit clôt la fusion." },
      { type: "vf", q: "Si tu changes d'avis avant de finir, git merge --abort te ramène à l'état d'avant.", a: true, exp: "Annulation sans casse." }
    ],
    solution: `<pre class="pseudo"># 1) Ouvrir index.html et remplacer TOUT le bloc en conflit par la version voulue :
#    <h1>Bienvenue sur notre site</h1>      (celle de contact, marqueurs enleves)
#    -> plus aucun <<<<<<<, =======, >>>>>>> ne doit rester.

git add index.html         # 2) marquer le conflit comme resolu
git commit                 # 3) terminer la fusion (accepter le message "Merge branch...")
git status                 # 4) verifier : arbre propre, plus de conflit

# En cas de doute a tout moment : git merge --abort (retour a l'etat d'avant la fusion).
# Sur GitHub : bouton "Resolve conflicts" ▸ editer ▸ "Mark as resolved" ▸ "Commit merge".</pre>
<p>Tu sais trancher un conflit. Demain : travailler avec les branches distantes (celles de GitHub).</p>`
  }
};
</script>
