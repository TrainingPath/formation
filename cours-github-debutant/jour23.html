var DAY = {

  title: "Les releases et les tags",
  subtitle: "Marquer les versions officielles de ton projet.",
  theory: `
<h3>1. Le tag : une étiquette sur un commit</h3>
<p>Un <strong>tag</strong> (« étiquette ») est un nom fixe posé sur un commit précis pour dire « ici, c'est une version importante ». Contrairement à une branche qui avance, un tag ne bouge jamais : il pointe pour toujours sur le même commit.</p>
<pre class="pseudo">git tag v1.0                 # pose un tag leger nomme v1.0 sur le commit courant
git tag -a v1.0 -m "Premiere version stable"   # tag ANNOTE : porte un message, un auteur, une date
git tag                       # liste tous les tags du depot
git show v1.0                 # affiche le commit designe par le tag</pre>
<p>Un <strong>tag annoté</strong> (option <code>-a</code>) est préférable pour une version : il enregistre qui l'a créé, quand, et un message. Le tag léger est juste un raccourci sans détails.</p>

<h3>2. Envoyer les tags sur GitHub</h3>
<p>Attention : <code>git push</code> n'envoie <strong>pas</strong> les tags automatiquement. Il faut les pousser exprès :</p>
<pre class="pseudo">git push origin v1.0         # envoie le tag v1.0 sur GitHub
git push origin --tags       # envoie TOUS les tags locaux d'un coup</pre>

<h3>3. Le versionnage sémantique (SemVer)</h3>
<p>La convention la plus répandue pour numéroter les versions s'appelle le <strong>versionnage sémantique</strong> : trois nombres <code>MAJEUR.MINEUR.CORRECTIF</code>, par exemple <code>2.4.1</code>.</p>
<pre class="pseudo">MAJEUR   # +1 quand un changement CASSE la compatibilite (ex : 1.x.x → 2.0.0)
MINEUR   # +1 quand on AJOUTE une fonctionnalite compatible (ex : 2.3.x → 2.4.0)
CORRECTIF  # +1 quand on corrige juste un bug (ex : 2.4.0 → 2.4.1)</pre>
<p>On préfixe souvent d'un <code>v</code> : <code>v2.4.1</code>. Ainsi, rien qu'au numéro, on devine l'ampleur du changement.</p>

<h3>4. La release : une version publiée pour les utilisateurs</h3>
<p>Une <strong>release</strong> (« publication, sortie ») est une version officielle mise en avant sur GitHub, construite <em>autour</em> d'un tag. Elle ajoute au tag : un <strong>titre</strong>, une <strong>description</strong> (les nouveautés, souvent appelées <em>release notes</em>) et la possibilité de joindre des <strong>fichiers</strong> téléchargeables (une application compilée, un PDF…).</p>
<div class="tip">Chemin dans l'interface : dépôt ▸ à droite, section <strong>Releases</strong> ▸ <strong>Draft a new release</strong> ▸ choisir un tag (ou en créer un) ▸ titre + notes ▸ éventuellement joindre des fichiers ▸ <strong>Publish release</strong>.</div>

<h3>5. Tag ou release : lequel pour quoi ?</h3>
<pre class="pseudo">TAG      # un repere technique dans l'historique Git (cote developpeur)
RELEASE  # une page publique, lisible, avec notes et fichiers (cote utilisateur)</pre>
<p>Toute release repose sur un tag, mais tous les tags ne deviennent pas des releases. GitHub génère aussi automatiquement une archive <code>.zip</code> et <code>.tar.gz</code> du code pour chaque release.</p>
<div class="warn">Un tag pointe sur un commit figé : ne réécris jamais un tag déjà publié. Si tu t'es trompé, publie plutôt une nouvelle version corrective (par ex. v1.0.1) au lieu de modifier v1.0.</div>`,
  exercises: [
    { type: "qcm", q: "Un tag sert à…", opts: ["Marquer un commit précis comme version importante", "Supprimer un commit", "Créer une branche", "Cacher l'historique"], a: 0, exp: "Une étiquette fixe posée sur un commit." },
    { type: "input", q: "Commande pour créer un tag simple nommé v1.0 sur le commit courant :", a: ["git tag v1.0"], ph: "git tag …", exp: "git tag v1.0 pose l'étiquette." },
    { type: "input", q: "L'option de git tag qui crée un tag ANNOTÉ (avec message, auteur, date) :", a: ["-a", "git tag -a"], ph: "…", exp: "git tag -a v1.0 -m \"...\" crée un tag annoté." },
    { type: "qcm", q: "Contrairement à une branche, un tag…", opts: ["Ne bouge jamais : il reste sur le même commit", "Avance à chaque commit", "Se supprime tout seul", "Change de nom chaque jour"], a: 0, exp: "Le tag est un repère fixe." },
    { type: "vf", q: "git push envoie automatiquement les tags sur GitHub.", a: false, exp: "Il faut les pousser exprès : git push origin --tags." },
    { type: "input", q: "Commande pour envoyer TOUS les tags locaux sur GitHub :", a: ["git push origin --tags", "git push --tags"], ph: "git push origin …", exp: "--tags pousse tous les tags d'un coup." },
    { type: "qcm", q: "Le versionnage sémantique s'écrit sous la forme…", opts: ["MAJEUR.MINEUR.CORRECTIF", "JOUR-MOIS-AN", "A.B.C.D.E", "Un seul grand nombre"], a: 0, exp: "Trois nombres, par ex. 2.4.1." },
    { type: "input", q: "Dans la version 2.4.1, quel nombre augmente si l'on corrige simplement un bug ? (donne la nouvelle version)", a: ["2.4.2"], ph: "2.4.…", exp: "Le correctif passe de 1 à 2 : 2.4.2." },
    { type: "qcm", q: "On passe de 1.9.0 à 2.0.0 quand…", opts: ["Un changement casse la compatibilité", "On corrige une faute de frappe", "On ne fait rien", "On ajoute un commentaire"], a: 0, exp: "Le nombre MAJEUR marque une rupture de compatibilité." },
    { type: "qcm", q: "Une release, par rapport à un tag, ajoute…", opts: ["Un titre, des notes et des fichiers téléchargeables", "Rien du tout", "Une suppression du dépôt", "Un mot de passe"], a: 0, exp: "La release est la version publique lisible construite autour d'un tag." },
    { type: "input", q: "Dans l'interface, le bouton pour commencer une nouvelle release (trois mots anglais) :", a: ["Draft a new release", "draft a new release"], ph: "…", exp: "Releases ▸ Draft a new release." },
    { type: "qcm", q: "Les « release notes » sont…", opts: ["La description des nouveautés de la version", "Le mot de passe du dépôt", "La liste des collaborateurs", "Un fichier caché"], a: 0, exp: "Elles expliquent aux utilisateurs ce qui change." },
    { type: "vf", q: "Toute release repose sur un tag, mais tous les tags ne deviennent pas des releases.", a: true, exp: "Le tag est technique ; la release est publique et facultative." },
    { type: "input", q: "Le préfixe d'une lettre qu'on met souvent devant un numéro de version (ex : _2.4.1) :", a: ["v"], ph: "…", exp: "On écrit v2.4.1." },
    { type: "vf", q: "Il est recommandé de réécrire un tag déjà publié quand on trouve une erreur.", a: false, exp: "On publie plutôt une version corrective (v1.0.1) ; un tag figé ne se réécrit pas." }
  ],
  final: {
    title: "Exercice final — Publier la version 1.0",
    intro: `<p>Ton application est prête pour sa première sortie officielle. Tu es sur la branche main, à jour, et tu veux publier une version 1.0 avec des notes et l'application compilée en pièce jointe.</p>`,
    questions: [
      { type: "input", q: "Tu crées un tag annoté nommé v1.0 avec un message. Écris la commande :", a: ["git tag -a v1.0 -m \"Premiere version stable\"", "git tag -a v1.0 -m \"...\""], ph: "git tag -a v1.0 -m \"…\"", exp: "Un tag annoté enregistre message, auteur et date." },
      { type: "input", q: "Commande pour envoyer ce tag sur GitHub :", a: ["git push origin v1.0"], ph: "git push origin …", exp: "Sans ça, le tag reste local." },
      { type: "qcm", q: "Sur GitHub, où crées-tu la release ?", opts: ["Section Releases ▸ Draft a new release", "Settings ▸ Danger Zone", "Onglet Issues", "Le fichier README"], a: 0, exp: "La release se construit dans la section Releases." },
      { type: "qcm", q: "Que mets-tu dans la description de la release ?", opts: ["Les nouveautés de la version (release notes)", "Ton mot de passe", "La liste de tes amis", "Rien, c'est interdit"], a: 0, exp: "Les release notes informent les utilisateurs." },
      { type: "vf", q: "Tu peux joindre à la release un fichier téléchargeable, comme l'application compilée.", a: true, exp: "Les releases acceptent des fichiers attachés, en plus du code archivé." }
    ],
    solution: `<pre class="pseudo">1. git checkout main && git pull origin main   # partir d'une main a jour
2. git tag -a v1.0 -m "Premiere version stable" # tag annote sur le commit
3. git push origin v1.0                         # envoyer le tag sur GitHub

4. GitHub ▸ Releases ▸ Draft a new release
     - Choose a tag : v1.0
     - Release title : Version 1.0
     - Description (release notes) :
         * Ajout de la barre de recherche
         * Correction du formulaire de contact
     - Attach binaries : appli.zip            # fichier telechargeable
5. Publish release

Resultat : une page publique v1.0, avec notes, code archive (.zip / .tar.gz)
et l'application jointe, prete a etre partagee.</pre>
<p>Tag pour figer, release pour publier : ton projet a maintenant des versions officielles. Demain : mettre ton travail en ligne avec GitHub Pages.</p>`
  }
};
