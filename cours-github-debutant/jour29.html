  theory: `
<h3>1. Qu'est-ce que GitHub Projects ?</h3>
<p><strong>GitHub Projects</strong> est un outil de gestion de tâches intégré à GitHub. Il rassemble tes Issues et Pull Requests dans un <strong>tableau</strong> visuel où l'on voit d'un coup d'œil ce qui est à faire, en cours, et terminé. C'est le tableau de bord de l'équipe, au même endroit que le code.</p>

<h3>2. Le tableau kanban : des colonnes et des cartes</h3>
<p>La vue la plus connue est le <strong>kanban</strong> (mot japonais signifiant « panneau »). Chaque tâche est une <strong>carte</strong> qu'on fait glisser d'une <strong>colonne</strong> à l'autre au fil de son avancement :</p>
<pre class="pseudo">Todo          # a faire : les taches pas encore commencees
In progress   # en cours : quelqu'un travaille dessus
Done          # termine : la tache est finie</pre>
<p>Déplacer une carte de <em>In progress</em> vers <em>Done</em> raconte visuellement la vie du projet. Tout le monde voit l'avancement sans avoir à demander.</p>
<div class="tip">Créer un projet : sur ton profil ou une organisation ▸ onglet <strong>Projects</strong> ▸ <strong>New project</strong> ▸ choisir un modèle (Table, Board/kanban…) ▸ lui donner un nom.</div>

<h3>3. Cartes liées et notes libres</h3>
<p>Une carte peut être <strong>reliée</strong> à une Issue ou une PR existante (elle en reprend le titre et l'état), ou être une simple <strong>note</strong> libre (une idée, un rappel). Quand l'Issue reliée se ferme, la carte peut passer automatiquement en <em>Done</em>.</p>

<h3>4. Plusieurs vues des mêmes données</h3>
<p>La force de Projects : les mêmes tâches, affichées de plusieurs façons selon le besoin.</p>
<pre class="pseudo">Board (kanban)   # colonnes a glisser : ideal pour le suivi au quotidien
Table            # un tableau facon tableur : trier, filtrer, editer en masse
Roadmap          # une frise temporelle : voir les echeances dans le temps</pre>
<p>On peut ajouter des <strong>champs personnalisés</strong> : une priorité (Haute / Moyenne / Basse), une estimation, une date. On <strong>groupe</strong> et on <strong>filtre</strong> ensuite dessus, exactement comme dans un tableur.</p>

<h3>5. Automatisations et différence avec les milestones</h3>
<p>Projects offre des <strong>automatisations</strong> simples (les « workflows ») : par exemple, « quand une Issue est fermée, déplace sa carte dans Done ». Cela évite le rangement manuel.</p>
<div class="warn">Ne confonds pas : un <strong>milestone</strong> (jour 19) est un objectif daté <em>à l'intérieur d'un dépôt</em> ; un <strong>Project</strong> est un tableau de pilotage qui peut regrouper les tâches de <em>plusieurs dépôts</em> à la fois, avec des vues et des automatisations. Le milestone dit « pour quand » ; le Project montre « où en est-on ».</div>
<div class="tip">Pour un petit projet perso, un simple tableau à trois colonnes (Todo / In progress / Done) suffit déjà à y voir clair. Commence simple, tu enrichiras ensuite.</div>`,

      { type: "vf", q: "Tu peux automatiser le tableau pour qu'une carte passe en Done dès que son Issue est fermée.", a: true, exp: "Un workflow relie l'état de l'Issue à la colonne." }
    ],
    solution: `<pre class="pseudo">1. Projects ▸ New project ▸ modele Board (kanban)
2. Colonnes : Todo · In progress · Done
3. Repartir les cartes :
     Done        : Choisir le logo
     In progress : Ecrire la page d'accueil
     Todo        : Corriger le bug du menu · Publier le site
4. Relier chaque carte a son Issue (etat synchronise)
5. Champ personnalise « Priorite » (Haute/Moyenne/Basse)
     → Corriger le bug du menu = Haute
6. Automatisation : « Issue fermee → carte dans Done »
7. Vue Table pour trier par priorite, vue Roadmap pour les echeances.</pre>
<p>Un tableau clair et tout le monde sait où en est le projet. Demain : les bonnes pratiques de commits et de collaboration.</p>`
  }
