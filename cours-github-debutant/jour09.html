var DAY = {
  num: 9,
  title: "Ignorer des fichiers : le .gitignore",
  subtitle: "Dire à Git : « ces fichiers-là, ne les suis jamais. »",
  theory: `
<h3>1. Pourquoi ignorer des fichiers ?</h3>
<p>Tous les fichiers d'un dossier ne méritent pas d'entrer dans l'historique. Certains sont <strong>temporaires</strong>, <strong>volumineux</strong>, <strong>secrets</strong> ou <strong>recréés automatiquement</strong>. Les enregistrer polluerait le dépôt, alourdirait GitHub, voire divulguerait des mots de passe. On veut donc dire à Git de les <strong>ignorer</strong> : ne jamais les suivre, ni les proposer au commit.</p>
<pre class="pseudo">Exemples typiques a IGNORER :
  mots de passe / cles secretes   → danger si publie (ex : .env)
  fichiers generes automatiquement → recrees a chaque fois (ex : dossier node_modules, build/)
  fichiers systeme               → sans interet (ex : .DS_Store sur Mac, Thumbs.db sur Windows)
  fichiers temporaires           → *.log, *.tmp</pre>
<div class="warn">Un mot de passe poussé sur GitHub, même effacé ensuite, reste dans l'historique. Mieux vaut l'ignorer AVANT le premier commit.</div>

<h3>2. Le fichier .gitignore</h3>
<p>La solution est un fichier spécial nommé <strong>.gitignore</strong> (avec un point au début), placé à la racine du dépôt. Chaque ligne y décrit un fichier ou un motif de fichiers à ignorer. Git lit ce fichier et cesse de proposer les éléments correspondants.</p>
<pre class="pseudo"># Exemple de contenu d'un fichier .gitignore :
secret.txt          # ignore CE fichier precis
.env                # ignore le fichier de configuration secrete
node_modules/       # ignore TOUT un dossier (la barre / a la fin)
*.log               # ignore tous les fichiers finissant par .log (l'etoile = "n'importe quoi")
build/              # ignore le dossier des fichiers generes</pre>
<div class="tip">Le point au début du nom (<code>.gitignore</code>) en fait un fichier « caché » sur la plupart des systèmes. C'est normal : Git le lit quand même.</div>

<h3>3. Les motifs (patterns)</h3>
<p>On peut viser un fichier précis, ou toute une famille grâce à des <strong>motifs</strong>. L'étoile <code>*</code> remplace « n'importe quelle suite de caractères ». La barre <code>/</code> à la fin désigne un dossier. Un <code>#</code> en début de ligne est un commentaire (ignoré par Git lui-même).</p>
<pre class="pseudo"># commentaire (cette ligne est ignoree)
*.tmp               # tous les fichiers .tmp, ou qu'ils soient
photos/             # tout le contenu du dossier photos
!important.log      # le "!" fait une EXCEPTION : ne PAS ignorer ce fichier precis</pre>

<h3>4. Attention aux fichiers déjà suivis</h3>
<p>Point crucial : <strong>.gitignore n'agit que sur les fichiers pas encore suivis</strong>. Si un fichier a déjà été commité, l'ajouter au .gitignore ne le retire pas de l'historique. Il faut d'abord le retirer du suivi avec <strong>git rm --cached</strong> (rm = « remove », supprimer ; --cached = « seulement du suivi, pas du disque »).</p>
<pre class="pseudo">git rm --cached secret.txt   # cesse de suivre secret.txt SANS l'effacer de ton disque
# ... puis ajoute "secret.txt" dans .gitignore ...
git add .gitignore
git commit -m "Ignore secret.txt"</pre>
<div class="warn">Sans <code>--cached</code>, <code>git rm</code> supprimerait aussi le fichier de ton ordinateur. L'option --cached ne touche qu'au suivi Git.</div>

<h3>5. Le .gitignore fait partie du dépôt</h3>
<p>Contrairement aux fichiers qu'il liste, le <strong>.gitignore lui-même doit être commité</strong> et partagé : ainsi toute l'équipe ignore les mêmes fichiers. C'est un fichier de projet à part entière.</p>
<pre class="pseudo">git add .gitignore                 # on suit le .gitignore (lui, on le garde !)
git commit -m "Ajout du .gitignore"
git push                           # partage avec l'equipe sur GitHub</pre>
<div class="tip">GitHub propose des modèles de .gitignore tout prêts par langage (Node, Python, Java…) au moment de créer un dépôt : pratique pour ne rien oublier.</div>`,
  exercises: [
    { type: "input", q: "Complète : le fichier qui liste ce qu'il faut ignorer s'appelle ______", a: [".gitignore", "gitignore"], ph: "un nom de fichier", exp: "Le .gitignore, à la racine du dépôt." },

    { type: "qcm", q: "Dans un .gitignore, *.log signifie…", opts: ["Tous les fichiers finissant par .log", "Un seul fichier nommé log", "Les dossiers log", "Rien"], a: 0, exp: "L'étoile remplace n'importe quelle suite de caractères." },
    { type: "qcm", q: "node_modules/ dans un .gitignore ignore…", opts: ["Tout le dossier node_modules", "Un fichier nommé node_modules", "Les .log", "Le README"], a: 0, exp: "La barre / à la fin désigne un dossier." },
    { type: "vf", q: "Le .gitignore se place à la racine du dépôt.", a: true, exp: "C'est l'emplacement standard." },
    { type: "qcm", q: "Une ligne commençant par # dans un .gitignore est…", opts: ["Un commentaire ignoré par Git", "Un titre", "Un fichier caché", "Une erreur"], a: 0, exp: "# = commentaire." },

    { type: "qcm", q: "Que fait git rm sans --cached ?", opts: ["Supprime le fichier du suivi ET du disque", "Ne fait rien", "Crée un fichier", "Ignore le fichier"], a: 0, exp: "--cached est indispensable pour garder le fichier local." },
    { type: "qcm", q: "Le .gitignore lui-même doit-il être commité ?", opts: ["Oui, pour que toute l'équipe ignore les mêmes fichiers", "Non, jamais", "Seulement le vendredi", "Il est interdit de le committer"], a: 0, exp: "C'est un fichier de projet partagé." },
    { type: "qcm", q: "Le « ! » devant un motif (!important.log) signifie…", opts: ["Exception : NE PAS ignorer ce fichier", "Ignorer deux fois", "Supprimer", "Commenter"], a: 0, exp: "Le ! crée une exception à une règle plus large." },
    { type: "vf", q: "Le point au début de .gitignore en fait un fichier caché, mais Git le lit quand même.", a: true, exp: "Caché à l'affichage, actif pour Git." },
    { type: "qcm", q: "Quel fichier est un bon candidat à ignorer ?", opts: ["Un dossier build/ recréé automatiquement", "Le README.md", "Le code source principal", "Le .gitignore"], a: 0, exp: "Les fichiers générés se recréent : inutile de les suivre." },
    { type: "input", q: "Complète : dans un .gitignore, pour ignorer tout le dossier « photos », on écrit photos______", a: ["/", "/ "], ph: "un caractère", exp: "La barre / désigne un dossier." },
    { type: "vf", q: "Il vaut mieux ignorer un secret AVANT son premier commit.", a: true, exp: "Un secret déjà poussé reste dans l'historique même effacé." }
  ],
  final: {
    title: "Exercice final — Nettoyer un dépôt",
    intro: `<p>Ton dépôt contient : du code utile, un dossier <code>node_modules/</code> (généré, énorme), des fichiers <code>*.log</code>, et un <code>config.env</code> avec un mot de passe qui a déjà été commité par erreur. Mets en place un .gitignore correct.</p>`,
    questions: [
      { type: "input", q: "Écris la ligne du .gitignore qui ignore tout le dossier node_modules :", a: ["node_modules/", "node_modules"], ph: "…", exp: "node_modules/ (la barre = dossier)." },
      { type: "input", q: "Écris la ligne qui ignore tous les fichiers .log :", a: ["*.log"], ph: "…", exp: "*.log grâce à l'étoile." },
      { type: "input", q: "config.env a DÉJÀ été commité. Commande pour cesser de le suivre sans l'effacer :", a: ["git rm --cached config.env"], ph: "git rm …", exp: "git rm --cached config.env." },
      { type: "vf", q: "Après avoir écrit le .gitignore, il faut aussi le committer pour le partager.", a: true, exp: "Le .gitignore est un fichier de projet partagé." },
      { type: "qcm", q: "Pourquoi le simple ajout de config.env au .gitignore ne suffit pas ici ?", opts: ["Parce qu'il était déjà suivi : il faut d'abord git rm --cached", "Parce que .gitignore ne marche pas", "Parce qu'il est trop gros", "Parce qu'il est caché"], a: 0, exp: ".gitignore n'agit que sur les fichiers non encore suivis." }
    ],
    solution: `<pre class="pseudo"># 1) Retirer du suivi le secret deja commite (sans l'effacer du disque) :
git rm --cached config.env

# 2) Ecrire le fichier .gitignore (a la racine) :
#    node_modules/     # dossier genere, enorme
#    *.log             # tous les journaux
#    config.env        # le fichier secret

# 3) Enregistrer et partager le .gitignore :
git add .gitignore
git commit -m "Ajout du .gitignore et retrait de config.env du suivi"
git push

# Retenir : .gitignore n'agit que sur les fichiers PAS encore suivis ;
# pour les autres, git rm --cached d'abord.</pre>
<p>Ton dépôt est propre. Demain : explorer l'historique avec log, diff et show.</p>`
  }
};
