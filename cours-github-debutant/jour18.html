  title: "Les Issues : suivre tâches et bugs",
  subtitle: "Un projet vivant se raconte dans ses Issues.",
  theory: `
<h3>1. Qu'est-ce qu'une Issue ?</h3>
<p>Une <strong>Issue</strong> (mot anglais pour « question, problème, sujet ») est une fiche de discussion attachée à un dépôt. On y note un <strong>bug</strong> (un défaut à corriger), une <strong>idée</strong> de nouvelle fonctionnalité, une <strong>tâche</strong> à faire ou une simple question. C'est le carnet de bord partagé du projet.</p>
<p>Chaque Issue a un <strong>titre</strong>, une <strong>description</strong> (en Markdown), un <strong>numéro</strong> unique (comme <code>#42</code>) et un état : <strong>Open</strong> (ouverte) ou <strong>Closed</strong> (fermée, donc réglée).</p>

<h3>2. Où les trouver et comment en créer une</h3>
<div class="tip">Chemin dans l'interface : page du dépôt ▸ onglet <strong>Issues</strong> ▸ bouton vert <strong>New issue</strong>. Tu remplis le titre, la description, puis <strong>Submit new issue</strong>.</div>
<p>Une bonne Issue de bug répond à trois questions : <strong>ce qui devait se passer</strong>, <strong>ce qui se passe vraiment</strong>, et <strong>comment reproduire</strong> le problème. Plus c'est clair, plus vite ce sera corrigé.</p>

<h3>3. Discuter dans une Issue</h3>
<p>Sous la description, chacun peut ajouter des <strong>commentaires</strong> pour discuter, poser des questions ou proposer une solution. On peut <strong>mentionner</strong> une personne avec <code>@pseudo</code> pour la prévenir, et renvoyer vers une autre Issue en écrivant son numéro, par exemple <code>#42</code>.</p>

<h3>4. Fermer une Issue</h3>
<p>Quand le problème est réglé, on la <strong>ferme</strong> avec le bouton <strong>Close issue</strong>. Mieux : dans le message d'un commit ou d'une Pull Request, un mot-clé ferme l'Issue automatiquement au moment de la fusion.</p>
<pre class="pseudo">git commit -m "Corrige le bouton d'envoi, closes #42"   # closes #42 fermera l'Issue 42 a la fusion
# mots-cles reconnus : close / closes / closed / fix / fixes / fixed / resolve / resolves / resolved</pre>
<p>Ce lien automatique relie proprement le code (le commit) au problème (l'Issue) : on sait toujours <em>quel</em> changement a réglé <em>quel</em> souci.</p>

<h3>5. Modèles d'Issues</h3>
<p>Un dépôt peut proposer des <strong>templates</strong> (« modèles ») d'Issue : un formulaire pré-rempli pour un rapport de bug, un autre pour une demande de fonctionnalité. Cela guide la personne et garantit qu'aucune information importante n'est oubliée.</p>
<div class="warn">Une Issue n'est pas un chat privé : tout est public sur un dépôt public. N'y colle jamais un mot de passe, une clé ou une donnée personnelle sensible.</div>
<div class="tip">Ferme une Issue dès qu'elle est réglée, mais garde-la (ne la supprime pas) : l'historique des Issues fermées raconte tout ce qui a été corrigé.</div>`,

    { type: "input", q: "Le nom de l'onglet du dépôt où l'on gère les Issues :", a: ["Issues", "issues"], ph: "…", exp: "L'onglet Issues, entre Code et Pull requests." },

    { type: "input", q: "Écris comment on référence l'Issue numéro 42 dans un texte GitHub :", a: ["#42"], ph: "…", exp: "Le # suivi du numéro crée un lien cliquable." },

    { type: "input", q: "Un mot-clé anglais (commençant par f) qui ferme une Issue depuis un commit :", a: ["fixes", "fix", "fixed", "fixe"], ph: "…", exp: "fix / fixes / fixed, comme close ou resolve." },
    { type: "qcm", q: "Écrire « closes #42 » dans le message d'une PR…", opts: ["Fermera l'Issue 42 quand la PR sera fusionnée", "Supprimera l'Issue 42 définitivement", "Créera une branche", "N'a aucun effet"], a: 0, exp: "Le lien code ↔ Issue se fait tout seul à la fusion." },
    { type: "vf", q: "Fermer une Issue la supprime définitivement du dépôt.", a: false, exp: "Fermer ≠ supprimer : l'Issue fermée reste dans l'historique." },
    { type: "qcm", q: "Une bonne Issue de bug décrit surtout…", opts: ["Le résultat attendu, le résultat obtenu et comment reproduire", "Le pseudo de tous les collaborateurs", "La date de création du dépôt", "Le nombre d'étoiles du dépôt"], a: 0, exp: "Attendu, obtenu, reproduction : le trio qui accélère la correction." },
    { type: "input", q: "Le mot anglais désignant un modèle d'Issue pré-rempli :", a: ["template", "templates", "modele", "modèle"], ph: "…", exp: "Un template guide la rédaction (rapport de bug, demande, etc.)." },
    { type: "vf", q: "On peut coller son mot de passe dans une Issue d'un dépôt public sans risque.", a: false, exp: "Tout est public : jamais de secret dans une Issue." },
    { type: "qcm", q: "La description d'une Issue se rédige en…", opts: ["Markdown", "HTML pur", "PDF", "Texte brut sans mise en forme"], a: 0, exp: "Comme les README, les Issues acceptent le Markdown." },
    { type: "vf", q: "On peut discuter d'une Issue en ajoutant des commentaires sous sa description.", a: true, exp: "Les commentaires font vivre la discussion." },
    { type: "qcm", q: "Le numéro d'une Issue (par ex. #42) est…", opts: ["Unique dans le dépôt", "Le nombre total de commits", "Réutilisé pour chaque nouveau dépôt", "Recalculé à chaque commit"], a: 0, exp: "Chaque Issue reçoit un numéro unique et incrémenté." }
  ],
  final: {

    questions: [

      { type: "qcm", q: "Le meilleur titre pour cette Issue est…", opts: ["Le bouton Envoyer du formulaire de contact ne fait rien", "Bug", "Problème", "aaa"], a: 0, exp: "Un titre précis fait gagner du temps à tout le monde." },
      { type: "qcm", q: "Dans la description, tu dois surtout indiquer…", opts: ["Ce qui devait se passer, ce qui se passe, comment reproduire", "Ton pseudo GitHub complet", "La liste de tous tes commits", "Le nombre d'étoiles du projet"], a: 0, exp: "Attendu / obtenu / reproduction." },

      { type: "vf", q: "Une fois la PR fusionnée avec « fixes #7 », l'Issue passe automatiquement à l'état Closed.", a: true, exp: "Le mot-clé relie le code au problème et ferme l'Issue tout seul." }
    ],
    solution: `<pre class="pseudo">1. Depot ▸ onglet Issues ▸ New issue                # ouvrir la fiche
2. Titre : « Le bouton Envoyer du formulaire ne fait rien »
3. Description (Markdown) :
     Attendu : le message part et un merci s'affiche
     Obtenu  : rien ne se passe au clic
     Reproduire : aller sur /contact, remplir, cliquer Envoyer
4. Submit new issue ▸ l'Issue recoit le numero #7
5. Discussion : @dev peux-tu regarder ?           # mention pour prevenir
6. Le correctif : git commit -m "Repare l'envoi, fixes #7"
7. A la fusion de la PR ▸ l'Issue #7 passe Closed # lien automatique</pre>
<p>Une Issue claire, c'est un bug à moitié réglé. Demain : ranger tout ça avec les labels, les milestones et l'assignation.</p>`
  }
