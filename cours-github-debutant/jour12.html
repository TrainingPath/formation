  title: "Les branches : créer et basculer",
  subtitle: "Travailler sur une idée à part, sans toucher au projet principal.",
  theory: `
<h3>1. Qu'est-ce qu'une branche ?</h3>
<p>Une <strong>branche</strong> (en anglais <em>branch</em>) est une ligne de travail indépendante dans ton dépôt. Imagine l'histoire de ton projet comme un tronc d'arbre : une branche, c'est une nouvelle pousse qui part du tronc et grandit de son côté. Tu peux y faire des commits sans déranger le tronc principal ; si l'idée est bonne, tu la rattaches plus tard ; sinon, tu la coupes sans dégât.</p>
<p>La branche principale s'appelle généralement <strong>main</strong> (autrefois « master »). Par convention, elle contient la version stable du projet. Les nouvelles idées se développent sur d'autres branches.</p>
<div class="tip">Analogie : main est le manuscrit « propre » de ton roman. Une branche est un brouillon parallèle où tu tentes une autre fin, sans risquer d'abîmer le manuscrit.</div>

<h3>2. Voir et créer des branches</h3>
<p>La commande <strong>git branch</strong> liste les branches ; suivie d'un nom, elle en crée une nouvelle (mais ne t'y déplace pas encore).</p>
<pre class="pseudo">git branch                 # liste les branches ; l'etoile * marque celle ou tu te trouves
git branch contact         # cree une nouvelle branche nommee "contact" (tu restes sur main)
git branch                 # verifie : "contact" apparait maintenant dans la liste</pre>
<div class="tip">Créer une branche est instantané et gratuit : Git ne copie pas les fichiers, il pose juste un nouveau repère. N'hésite jamais à en créer.</div>

<h3>3. Basculer d'une branche à l'autre</h3>
<p>Pour te déplacer sur une branche, on utilise <strong>git switch</strong> (switch = « basculer »), la commande moderne. Tes fichiers changent alors pour refléter l'état de cette branche.</p>
<pre class="pseudo">git switch contact         # bascule sur la branche "contact" (tes fichiers refletent cette branche)
git switch main            # revient sur la branche principale</pre>
<div class="warn">Ancienne méthode encore très répandue : <code>git checkout contact</code> fait la même chose que <code>git switch contact</code>. checkout est plus vieux et sert à d'autres usages ; switch est plus clair pour changer de branche.</div>

<h3>4. Créer et basculer en une commande</h3>
<p>Le geste le plus fréquent : créer une branche ET s'y installer aussitôt. L'option <strong>-c</strong> (c = « create ») de switch le fait d'un coup.</p>
<pre class="pseudo">git switch -c contact      # cree la branche "contact" ET bascule dessus immediatement
# equivalent ancien : git checkout -b contact</pre>
<p>À partir de là, tes commits vont sur « contact ». La branche main reste figée à son dernier état tant que tu ne la modifies pas.</p>

<h3>5. Pourquoi les branches sont essentielles</h3>
<p>Les branches permettent de développer une fonctionnalité, corriger un bug ou tester une idée <strong>en isolation</strong>, sans risquer la version stable. Toute l'équipe peut travailler en parallèle, chacun sur sa branche. On les réunit ensuite (le « merge », demain). Sur GitHub, les branches apparaissent dans un menu déroulant en haut du dépôt, et sont au cœur des Pull Requests (jour 16).</p>
<pre class="pseudo">main --------o--------o          # la branche stable
              \\
   contact      o----o           # une branche partie de main, avec ses propres commits
# on developpe sur "contact", puis on rattachera a "main" plus tard (merge)</pre>
<div class="tip">Bonne pratique : une branche = une tâche. Nomme-la clairement : « ajout-page-contact », « fix-bug-login ». On garde main toujours stable.</div>`,

    { type: "qcm", q: "Sur GitHub (le site), les branches apparaissent…", opts: ["Dans un menu déroulant en haut du dépôt", "Dans Settings du compte", "Uniquement dans les Pull Requests", "Seulement dans l'historique des commits"], a: 0, exp: "Un sélecteur de branche en haut du dépôt." },
    { type: "vf", q: "Tant que tu travailles sur « contact », la branche main reste figée à son dernier état.", a: true, exp: "Chaque branche évolue indépendamment." }
  ],
  final: {
    title: "Exercice final — Ouvrir un chantier isolé",

    ],
    solution: `<pre class="pseudo">git branch                 # verifier qu'on est bien sur main (l'etoile *)
git switch -c contact      # creer la branche "contact" ET basculer dessus
# ... on cree la page, git add / git commit sur la branche contact ...
git branch                 # * contact : on travaille bien en isolation ; main reste figee
git switch main            # revenir sur la branche principale quand on veut

# La page vit sur "contact" ; main n'a pas bouge. On la reunira au prochain jour (merge).</pre>
<p>Tu sais ouvrir un chantier isolé. Demain : réunir deux branches avec le merge.</p>`
  }
