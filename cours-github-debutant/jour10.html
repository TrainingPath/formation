<script>
var DAY = {
  num: 10,
  title: "Explorer l'historique : log, diff, show",
  subtitle: "Lire l'histoire du projet : qui, quand, quoi.",
  theory: `
<h3>1. git log : la liste des commits</h3>
<p><strong>git log</strong> (log = « journal ») affiche l'<strong>historique</strong> : la liste de tous les commits, du plus récent au plus ancien. Chaque commit y montre son identifiant, son auteur, sa date et son message.</p>
<pre class="pseudo">git log                    # affiche la liste complete des commits (lecture seule)
commit f4e5d6...           # chaque commit commence par "commit" suivi de son identifiant (le "hash")
Author: Ada Lovelace       # qui a fait ce commit
Date:   ...                # quand
    Ajout de la page contact   # (indente) le MESSAGE ecrit par l'auteur</pre>
<div class="tip">Le <strong>hash</strong> est l'empreinte unique d'un commit (une longue suite de lettres et chiffres, ex : f4e5d6a8…). Les 7 premiers caractères suffisent pour le désigner.</div>

<h3>2. Les variantes utiles de log</h3>
<pre class="pseudo">git log --oneline        # une ligne par commit : hash court + message (la vue de tous les jours)
git log -3               # ne montrer que les 3 commits les plus recents
git log index.html       # ne montrer que les commits qui ont TOUCHE ce fichier
git log --oneline --graph  # dessine aussi les branches en ASCII (utile plus tard)</pre>
<div class="warn">git log liste du plus RÉCENT au plus ancien : le premier bloc affiché est le dernier commit, pas le premier de l'histoire.</div>

<h3>3. git diff : voir les différences</h3>
<p><strong>git diff</strong> (diff = « différence ») montre ce qui a changé, ligne par ligne. Sans argument, il compare ton travail actuel (non encore préparé) à la dernière version enregistrée. Les lignes ajoutées apparaissent avec un <code>+</code>, les supprimées avec un <code>-</code>.</p>
<pre class="pseudo">git diff                 # differences entre ton travail actuel et le dernier commit (avant git add)
git diff --staged        # differences de ce qui est DEJA prepare (apres git add), avant le commit
git diff HEAD~1 HEAD     # differences entre l'avant-dernier commit et le dernier</pre>
<div class="tip">Rappel : <strong>HEAD</strong> désigne le commit où tu te trouves (le dernier, en général) ; <strong>HEAD~1</strong> son parent, <strong>HEAD~2</strong> le grand-parent. Le « ~ » suivi d'un nombre recule de N commits.</div>

<h3>4. git show : le détail d'un commit</h3>
<p><strong>git show</strong> affiche tout un commit précis : ses métadonnées (auteur, date, message) ET le diff qu'il a introduit. On lui donne le hash du commit voulu.</p>
<pre class="pseudo">git show f4e5d6          # tout ce que le commit f4e5d6 contient : infos + changements ligne par ligne
git show f4e5d6:index.html   # le fichier index.html TEL QU'IL ETAIT a ce commit (syntaxe hash:chemin)</pre>

<h3>5. Explorer sur GitHub (le site)</h3>
<p>La plateforme offre les mêmes informations, en version cliquable. L'onglet <strong>« Commits »</strong> liste l'historique ; cliquer sur un commit montre son diff coloré ; le bouton <strong>« History »</strong> d'un fichier montre ses versions successives ; et <strong>« Blame »</strong> indique, ligne par ligne, quel commit l'a écrite.</p>
<pre class="pseudo">Depot GitHub ▸ onglet "Commits"           # l'historique, comme git log
  ▸ clic sur un commit                     # le diff, comme git show
Un fichier ▸ bouton "History"              # les versions du fichier, comme git log <fichier>
Un fichier ▸ bouton "Blame"                # qui a ecrit chaque ligne</pre>
<div class="warn">Toutes ces commandes (log, diff, show) sont en LECTURE SEULE : elles n'écrivent rien et ne risquent jamais d'abîmer ton projet. Explore sans crainte.</div>`,
  exercises: [
    { type: "input", q: "Complète : la commande qui liste les commits est git ______", a: ["log"], ph: "une commande", exp: "git log affiche l'historique." },
    { type: "qcm", q: "git log affiche les commits…", opts: ["Du plus récent au plus ancien", "Du plus ancien au plus récent", "Par ordre alphabétique des messages", "Regroupés par branche"], a: 0, exp: "Le dernier commit apparaît en premier." },
    { type: "input", q: "Complète : la vue compacte, une ligne par commit : git log ______", a: ["--oneline", "oneline"], ph: "une option", exp: "git log --oneline." },
    { type: "qcm", q: "git diff (sans argument) compare…", opts: ["Ton travail actuel au dernier commit", "Deux branches distantes", "Le dernier commit à l'avant-dernier", "La zone de préparation au dernier commit"], a: 0, exp: "Les modifications non encore préparées." },
    { type: "qcm", q: "Dans un diff, une ligne précédée d'un « + » est…", opts: ["Une ligne ajoutée", "Une ligne supprimée", "Une ligne inchangée", "Une ligne déplacée"], a: 0, exp: "+ = ajout, - = suppression." },
    { type: "input", q: "Complète : voir les différences de ce qui est déjà préparé : git diff ______", a: ["--staged", "staged", "--cached", "cached"], ph: "une option", exp: "git diff --staged (ou --cached)." },
    { type: "qcm", q: "git show f4e5d6 affiche…", opts: ["Les infos ET le diff de ce commit précis", "Seulement le message du commit", "La liste de tous les commits", "Le fichier actuel, non modifié"], a: 0, exp: "show détaille un commit." },
    { type: "qcm", q: "La syntaxe git show f4e5d6:index.html montre…", opts: ["Le fichier tel qu'il était à ce commit", "Le fichier actuel", "Les différences depuis ce commit", "Le fichier tel qu'il sera au prochain commit"], a: 0, exp: "hash:chemin = voyage dans le temps en lecture." },
    { type: "qcm", q: "HEAD désigne…", opts: ["Le commit où tu te trouves (le dernier, en général)", "Le premier commit", "Le dépôt distant origin", "Une branche distante"], a: 0, exp: "HEAD = ta position dans l'histoire." },
    { type: "input", q: "Complète : le parent du commit courant se note HEAD______", a: ["~1", "~", "^"], ph: "des symboles", exp: "HEAD~1 = l'avant-dernier commit." },
    { type: "vf", q: "log, diff et show sont en lecture seule : ils ne modifient rien.", a: true, exp: "On peut explorer sans risque." },
    { type: "qcm", q: "Le « hash » d'un commit est…", opts: ["Son empreinte unique (lettres/chiffres)", "Son message", "Sa date", "Son auteur"], a: 0, exp: "Les 7 premiers caractères suffisent." },
    { type: "qcm", q: "Sur GitHub, où voit-on l'historique des commits ?", opts: ["Onglet « Commits » du dépôt", "Onglet Settings", "La page du profil", "L'onglet Branches"], a: 0, exp: "L'onglet Commits, équivalent de git log." },
    { type: "input", q: "Complète : pour ne voir que les commits d'un fichier : git log ______", a: ["index.html", "<fichier>", "nomdufichier", "fichier"], ph: "un fichier", exp: "git log <fichier>." },
    { type: "vf", q: "Sur GitHub, « Blame » indique quel commit a écrit chaque ligne d'un fichier.", a: true, exp: "Blame = attribution ligne par ligne." }
  ],
  final: {
    title: "Exercice final — L'enquête dans l'historique",
    intro: `<p>Un fichier <code>prix.txt</code> affiche un mauvais tarif. Tu veux savoir quand et par qui il a été modifié, et voir exactement le changement fautif. L'historique compte 4 commits (le plus récent en haut) :</p>
<pre class="pseudo">e9f0a1 Mise a jour du pied de page     # HEAD (le plus recent)
d5e6f7 Correction du prix de l'article  # HEAD~1  (suspect ?)
c7d8e9 Ajout de la page prix            # HEAD~2
a1b2c3 Creation du site                 # HEAD~3  (le plus ancien)</pre>`,
    questions: [
      { type: "input", q: "Commande pour ne lister que les commits ayant touché prix.txt :", a: ["git log prix.txt", "git log --oneline prix.txt"], ph: "git log …", exp: "git log <fichier> filtre l'historique." },
      { type: "input", q: "Commande pour voir exactement ce que le commit d5e6f7 a changé :", a: ["git show d5e6f7"], ph: "git show …", exp: "git show + hash." },
      { type: "qcm", q: "HEAD~1 désigne ici…", opts: ["d5e6f7 (la correction du prix)", "e9f0a1", "a1b2c3", "c7d8e9"], a: 0, exp: "Un cran en arrière depuis HEAD." },
      { type: "input", q: "Commande pour voir prix.txt tel qu'il était à la création du site :", a: ["git show a1b2c3:prix.txt"], ph: "git show …", exp: "hash:chemin." },
      { type: "vf", q: "Toutes ces commandes sont sûres : elles ne modifient pas le fichier.", a: true, exp: "log, show, diff sont en lecture seule." }
    ],
    solution: `<pre class="pseudo">git log --oneline prix.txt     # tous les commits qui ont touche le fichier (le "quand" et le "qui")
git show d5e6f7                # le diff exact du commit suspect : la ligne changee apparait en +/-
git show a1b2c3:prix.txt       # le fichier a sa naissance (syntaxe hash:chemin)
git diff a1b2c3 HEAD -- prix.txt   # tout ce qui a change sur ce fichier entre le debut et maintenant

# Sur GitHub : onglet "Commits", ou bouton "History"/"Blame" du fichier prix.txt.
# Tout est en LECTURE : aucune modification, aucun risque.</pre>
<p>Tu sais lire l'histoire. Demain : la corriger, avec restore, revert et reset.</p>`
  }
};
</script>
