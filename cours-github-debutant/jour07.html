var DAY = {
  num: 7,
  title: "Envoyer et récupérer : push, pull, fetch",
  subtitle: "Faire voyager tes commits entre ta machine et GitHub.",
  theory: `
<h3>1. Le voyage local ↔ distant</h3>
<p>Jusqu'ici, tes commits vivaient uniquement en <strong>local</strong> (sur ta machine). Pour les mettre sur <strong>GitHub</strong> (le distant), il faut les <strong>envoyer</strong>. Et pour récupérer ce que d'autres ont ajouté sur GitHub, il faut les <strong>télécharger</strong>. Trois commandes gèrent ce voyage : push, pull et fetch.</p>
<pre class="pseudo">Ta machine (LOCAL)  --( git push )-->  GitHub (DISTANT / origin)
Ta machine (LOCAL)  <--( git pull )--  GitHub (DISTANT / origin)
  # push = j'envoie mes commits          # pull = je recupere et j'integre les leurs</pre>
<div class="tip">Rappel : <strong>origin</strong> est le surnom du dépôt distant (vu au jour 5). <strong>main</strong> est le nom de la branche principale (vu au jour 3).</div>

<h3>2. git push : envoyer</h3>
<p><strong>git push</strong> (push = « pousser ») envoie tes commits locaux vers le dépôt distant. C'est le geste qui rend ton travail visible sur GitHub.</p>
<pre class="pseudo">git push origin main      # envoie les commits de la branche main vers le distant "origin"
git push                  # forme courte, si le lien de suivi est deja etabli</pre>
<div class="warn">La toute première fois sur un dépôt local créé avec git init, on établit le lien avec l'option <strong>-u</strong> (u = « upstream », le distant de suivi) : <code>git push -u origin main</code>. Ensuite, un simple <code>git push</code> suffit.</div>

<h3>3. git pull : récupérer et intégrer</h3>
<p><strong>git pull</strong> (pull = « tirer ») fait deux choses d'un coup : il télécharge les nouveaux commits du distant ET les intègre à ton travail local. À faire avant de commencer à travailler, pour partir de la version la plus à jour.</p>
<pre class="pseudo">git pull origin main      # recupere les commits distants de main ET les fusionne dans ton local
git pull                  # forme courte si le suivi est etabli</pre>
<div class="tip">Règle d'or du travail à plusieurs : <strong>pull avant de commencer, push après avoir fini</strong>. On récupère d'abord, on envoie ensuite.</div>

<h3>4. git fetch : récupérer sans intégrer</h3>
<p><strong>git fetch</strong> télécharge les nouveautés du distant MAIS ne les intègre pas tout de suite à ton travail. Il te laisse d'abord regarder ce qui a changé. C'est la version « prudente » de pull. En fait, <em>pull = fetch + intégration automatique</em>.</p>
<pre class="pseudo">git fetch origin          # telecharge les nouveautes du distant, SANS toucher a ton travail
git log origin/main       # tu peux inspecter ce qui est arrive avant de decider
# puis, si tout va bien, tu integres avec un merge (jour 13) ou simplement :
git pull                  # equivaut a fetch + integration en une commande</pre>

<h3>5. Relier un dépôt local existant à GitHub</h3>
<p>Si tu as créé ton dépôt avec <code>git init</code> (donc sans origin), tu dois d'abord le relier à un dépôt distant créé sur GitHub, avec <strong>git remote add</strong>. Ensuite tu pousses.</p>
<pre class="pseudo">git remote add origin https://github.com/toi/projet.git   # relie ton depot local au distant "origin"
git branch -M main                                        # s'assure que la branche s'appelle "main"
git push -u origin main                                   # premier envoi + etablit le suivi</pre>
<div class="warn">Ne confonds pas les trois : <strong>push</strong> = j'envoie ; <strong>pull</strong> = je récupère ET j'intègre ; <strong>fetch</strong> = je récupère sans intégrer. Push et pull vont dans des sens opposés.</div>`,
  exercises: [
    { type: "input", q: "Complète : la commande qui envoie tes commits sur GitHub est git ______", a: ["push"], ph: "une commande", exp: "git push pousse tes commits vers le distant." },
    { type: "input", q: "Complète : la commande qui récupère ET intègre les commits distants est git ______", a: ["pull"], ph: "une commande", exp: "git pull = récupérer + intégrer." },
    { type: "qcm", q: "git fetch fait…", opts: ["Récupérer les nouveautés SANS les intégrer", "Envoyer tes commits", "Supprimer le dépôt", "Créer un fichier"], a: 0, exp: "fetch télécharge sans toucher à ton travail." },
    { type: "qcm", q: "La relation entre pull et fetch :", opts: ["pull = fetch + intégration automatique", "pull et fetch sont opposés", "fetch = pull + push", "Ils n'ont aucun rapport"], a: 0, exp: "pull récupère et intègre en une fois." },
    { type: "qcm", q: "push et pull vont…", opts: ["Dans des sens opposés (envoyer vs récupérer)", "Dans le même sens", "Toujours ensemble", "Seulement en local"], a: 0, exp: "push envoie, pull récupère." },
    { type: "input", q: "Complète : pour envoyer la branche main vers le distant origin : git push origin ______", a: ["main"], ph: "un nom de branche", exp: "git push origin main." },
    { type: "qcm", q: "Que fait l'option -u dans git push -u origin main ?", opts: ["Établit le lien de suivi (upstream) pour simplifier les push suivants", "Supprime la branche", "Force l'envoi", "Change le mot de passe"], a: 0, exp: "-u mémorise le distant de suivi." },
    { type: "vf", q: "La règle d'or est : pull avant de commencer, push après avoir fini.", a: true, exp: "On récupère d'abord, on envoie ensuite." },
    { type: "qcm", q: "git remote add origin <url> sert à…", opts: ["Relier un dépôt local à un distant", "Faire un commit", "Supprimer origin", "Cloner"], a: 0, exp: "On ajoute le distant nommé origin." },
    { type: "vf", q: "Après git commit, ton travail est déjà visible sur GitHub.", a: false, exp: "Il faut push : le commit est d'abord local." },
    { type: "qcm", q: "Pourquoi faire git pull avant de travailler ?", opts: ["Pour partir de la version la plus à jour", "Pour effacer ton travail", "Pour changer de compte", "Ce n'est jamais utile"], a: 0, exp: "On évite de travailler sur une version périmée." },
    { type: "input", q: "Complète : la version prudente qui récupère sans intégrer est git ______", a: ["fetch"], ph: "une commande", exp: "git fetch télécharge sans fusionner." },
    { type: "qcm", q: "origin désigne…", opts: ["Le dépôt distant (sur GitHub)", "Ta branche locale", "Ton mot de passe", "Ton éditeur"], a: 0, exp: "origin = surnom du distant." },
    { type: "vf", q: "git push rend ton travail local visible sur GitHub.", a: true, exp: "push envoie les commits vers le distant." },
    { type: "input", q: "Complète : relier local et distant se fait avec git remote ______ origin <url>", a: ["add"], ph: "un mot", exp: "git remote add origin <url>." }
  ],
  final: {
    title: "Exercice final — Aller-retour avec GitHub",
    intro: `<p>Tu travailles à deux sur un dépôt cloné (origin déjà en place). Ton binôme a poussé des changements ce matin. Toi, tu viens de committer un nouveau fichier en local. Gère l'aller-retour proprement.</p>`,
    questions: [
      { type: "input", q: "Commande pour d'abord récupérer et intégrer les changements du binôme :", a: ["git pull", "git pull origin main"], ph: "git …", exp: "pull avant de pousser." },
      { type: "input", q: "Commande pour ensuite envoyer ton commit sur GitHub :", a: ["git push", "git push origin main"], ph: "git …", exp: "git push envoie ton travail." },
      { type: "qcm", q: "Pourquoi pull AVANT push ici ?", opts: ["Pour intégrer le travail du binôme et éviter les conflits", "Pour supprimer son travail", "Pour aller plus vite", "Ce n'est pas nécessaire"], a: 0, exp: "On part à jour avant d'envoyer." },
      { type: "vf", q: "git fetch aurait récupéré les changements sans les intégrer tout de suite.", a: true, exp: "fetch télécharge sans fusionner." },
      { type: "input", q: "Sur un dépôt local créé par git init, complète le tout premier envoi : git push ______ origin main", a: ["-u", "u"], ph: "une option", exp: "-u établit le suivi la première fois." }
    ],
    solution: `<pre class="pseudo"># Regle d'or : pull avant de commencer, push apres avoir fini.
git pull                 # 1) recuperer ET integrer les commits du binome (partir a jour)
# ... tu committes ton travail en local (git add / git commit) ...
git push                 # 2) envoyer tes commits sur GitHub (origin)

# Variante prudente : inspecter avant d'integrer
git fetch origin         # telecharge sans toucher a ton travail
git log origin/main      # regarder ce qui est arrive
git pull                 # puis integrer

# Premier envoi d'un depot cree par git init :
git remote add origin https://github.com/toi/projet.git
git push -u origin main  # etablit le suivi ; ensuite un simple "git push" suffit</pre>
<p>Tes commits voyagent entre local et distant. Demain : soigner la vitrine du projet avec le README et le Markdown.</p>`
  }
};
