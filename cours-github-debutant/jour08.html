  title: "Le README et la mise en forme Markdown",
  subtitle: "La vitrine de ton projet, écrite dans un langage simple.",
  theory: `
<h3>1. Qu'est-ce qu'un README ?</h3>
<p>Le <strong>README</strong> (« lis-moi » en anglais) est le fichier de présentation d'un projet. C'est la première chose qu'un visiteur lit. Sur GitHub, si un fichier nommé <code>README.md</code> existe à la racine du dépôt, la plateforme l'affiche automatiquement, joliment mis en forme, sous la liste des fichiers. C'est la vitrine de ton travail.</p>
<p>L'extension <strong>.md</strong> signifie <strong>Markdown</strong> : un langage de mise en forme très simple, écrit en texte ordinaire, que GitHub transforme en page élégante (titres, listes, liens, gras…).</p>
<div class="tip">Un bon README répond à trois questions : de quoi parle le projet ? Comment l'installer/l'utiliser ? Comment contribuer ou te contacter ?</div>

<h3>2. Le Markdown : titres et texte</h3>
<p><strong>Markdown</strong> utilise quelques signes simples. Le dièse <code>#</code> crée des titres (un seul pour le titre principal, plus on en met, plus le titre est petit). Les étoiles servent au gras et à l'italique.</p>
<pre class="pseudo"># Titre principal          → grand titre (comme un H1)
## Sous-titre              → titre de section (H2)
### Sous-sous-titre        → plus petit (H3)

texte normal
**texte en gras**          → texte en gras
*texte en italique*        → texte en italique</pre>

<h3>3. Le Markdown : listes et liens</h3>
<p>Les listes à puces commencent par un tiret ; les listes numérotées par un chiffre suivi d'un point. Les liens et les images ont une syntaxe entre crochets et parenthèses.</p>
<pre class="pseudo">- premier point           → puce
- deuxieme point          → puce
1. premiere etape         → liste numerotee
2. deuxieme etape

[texte du lien](https://exemple.com)      → un lien cliquable
![texte alternatif](image.png)            → une image (le ! au debut)</pre>
<div class="tip">La puce peut aussi s'écrire avec <code>*</code> ou <code>+</code>, mais le tiret <code>-</code> est le plus courant. Laisse toujours un espace après le signe.</div>

<h3>4. Le Markdown : code et citations</h3>
<p>Pour afficher du code sans qu'il soit interprété, on l'entoure d'<strong>accents graves</strong> (le caractère &#96;). Un seul accent grave pour un bout de code au fil du texte ; trois pour un bloc entier. Le chevron <code>&gt;</code> crée une citation.</p>
<pre class="pseudo">Utilise la commande &#96;git status&#96; pour voir l'etat.    → code en ligne (entoure d'accents graves)

Bloc de code (trois accents graves avant et apres) :
&#96;&#96;&#96;
git add .
git commit -m "message"
&#96;&#96;&#96;

&gt; Ceci est une citation.                             → texte en citation (barre a gauche)</pre>

<h3>5. Créer et modifier le README</h3>
<p>Deux façons, encore une fois. En <strong>local</strong>, tu crées un fichier <code>README.md</code> dans ton éditeur, puis tu l'ajoutes à l'historique comme n'importe quel fichier (add + commit + push). Sur <strong>GitHub</strong> (le site), tu peux l'éditer directement en ligne : ouvre le fichier, clique sur l'icône crayon, écris, puis « Commit changes ».</p>
<pre class="pseudo"># En LOCAL (Git) :
# 1) creer README.md dans ton editeur
git add README.md
git commit -m "Ajout du README"
git push

# Sur GITHUB (site web) :
# Depot ▸ ouvrir README.md ▸ icone crayon (Edit) ▸ ecrire ▸ bouton "Commit changes"</pre>
<div class="warn">Le fichier doit s'appeler exactement <strong>README.md</strong> (en majuscules par convention) et se trouver à la racine du dépôt pour que GitHub l'affiche automatiquement en page d'accueil.</div>`,
  exercises: [
    { type: "input", q: "Complète : le fichier de présentation d'un projet s'appelle le ______.", a: ["readme", "readme.md"], ph: "un mot", exp: "Le README, affiché en page d'accueil du dépôt." },
    { type: "input", q: "Complète : l'extension du Markdown est .______", a: ["md", ".md"], ph: "des lettres", exp: ".md pour Markdown." },
    { type: "qcm", q: "Quel signe crée un titre en Markdown ?", opts: ["Le dièse #", "L'étoile *", "Le tiret -", "Le dollar $"], a: 0, exp: "# pour les titres ; plus il y en a, plus le titre est petit." },
    { type: "qcm", q: "**texte** en Markdown donne…", opts: ["Du texte en gras", "Du texte en italique", "Un titre", "Un lien"], a: 0, exp: "Deux étoiles = gras." },
    { type: "input", q: "Complète : *texte* donne du texte en ______.", a: ["italique", "italic"], ph: "un style", exp: "Une étoile = italique." },
    { type: "qcm", q: "Comment commence une puce de liste ?", opts: ["Par un tiret suivi d'un espace : « - »", "Par un dièse #", "Par deux étoiles", "Par un dollar $"], a: 0, exp: "- puce (avec un espace après)." },
    { type: "qcm", q: "La syntaxe [texte](https://…) crée…", opts: ["Un lien cliquable", "Une image", "Un titre", "Un bloc de code"], a: 0, exp: "Crochets = texte, parenthèses = adresse." },
    { type: "qcm", q: "Qu'est-ce qui différencie une image d'un lien en Markdown ?", opts: ["L'image commence par un point d'exclamation !", "L'image utilise des accolades", "Rien, c'est identique", "L'image utilise des dièses"], a: 0, exp: "![alt](image.png) : le ! au début." },
    { type: "qcm", q: "Comment afficher du code au fil du texte ?", opts: ["En l'entourant d'accents graves", "En le mettant en gras", "En le soulignant", "Avec des dièses"], a: 0, exp: "Un accent grave de chaque côté." },
    { type: "vf", q: "GitHub affiche automatiquement le README.md placé à la racine du dépôt.", a: true, exp: "C'est la page d'accueil du dépôt." },
    { type: "qcm", q: "Un bloc de code entier s'entoure de…", opts: ["Trois accents graves avant et après", "Trois dièses", "Deux étoiles", "Un tiret"], a: 0, exp: "Triple accent grave pour un bloc." },
    { type: "input", q: "Complète : pour une citation, on commence la ligne par le chevron ______", a: [">", "chevron"], ph: "un signe", exp: "> crée une citation." },
    { type: "vf", q: "Le README peut s'éditer directement sur le site GitHub, avec l'icône crayon.", a: true, exp: "Ouvre le fichier ▸ crayon ▸ Commit changes." },
    { type: "qcm", q: "En local, comment enregistre-t-on un nouveau README dans l'historique ?", opts: ["git add README.md puis git commit", "git status seulement", "git clone", "On ne peut pas"], a: 0, exp: "Comme tout fichier : add + commit (+ push)." },
    { type: "vf", q: "## crée un titre plus petit que #.", a: true, exp: "Plus il y a de dièses, plus le titre est petit." }
  ],
  final: {

    intro: `<p>Tu veux présenter ton projet « MonBlog » avec un README clair : un titre, une phrase de description, une petite liste de fonctionnalités, et une commande d'installation en code. Réfléchis à la syntaxe Markdown.</p>`,
    questions: [
      { type: "input", q: "Écris la ligne Markdown pour le grand titre « MonBlog » :", a: ["# monblog", "#monblog"], ph: "# …", exp: "# MonBlog crée le titre principal." },
      { type: "input", q: "Complète : pour mettre « facile » en gras : ______facile______", a: ["**", "** **"], ph: "un signe", exp: "**facile** = gras." },
      { type: "qcm", q: "Pour lister trois fonctionnalités, tu utilises…", opts: ["Des lignes commençant par « - »", "Des lignes commençant par « # »", "Des étoiles autour du mot", "Des chevrons >"], a: 0, exp: "Le tiret crée une puce." },
      { type: "input", q: "Complète : pour afficher du code au fil du texte, on l'entoure d'______.", a: ["accents graves", "accent grave", "backticks", "backtick"], ph: "un mot", exp: "Accents graves = code en ligne." },
      { type: "vf", q: "Le fichier doit s'appeler README.md et être à la racine pour s'afficher tout seul.", a: true, exp: "Nom exact + racine du dépôt." }
    ],
    solution: `<pre class="pseudo"># Exemple de README.md (en Markdown) :
# MonBlog                                  → grand titre
Un blog personnel **simple** a installer.   → description, "simple" en gras

## Fonctionnalites                          → sous-titre de section
- Articles en Markdown                      → puces
- Commentaires
- Theme clair/sombre

## Installation                             → sous-titre
Cloner le depot (commande git clone entouree d'accents graves).

# Enregistrer le README en local :
git add README.md
git commit -m "Ajout du README"
git push                                    → visible en page d'accueil sur GitHub</pre>
<p>Ta vitrine est prête. Demain : empêcher certains fichiers d'entrer dans le dépôt, avec le .gitignore.</p>`
  }
};
