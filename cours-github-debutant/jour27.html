  theory: `
<h3>1. Pourquoi sécuriser son compte GitHub ?</h3>
<p>Ton compte donne accès à tout ton code, à celui de tes équipes, et parfois à des serveurs. Un compte piraté peut voir son code volé, modifié en douce, ou effacé. GitHub prend le sujet au sérieux : la double authentification est <strong>désormais obligatoire</strong> pour qui contribue du code.</p>

<h3>2. La double authentification (2FA)</h3>
<p>La <strong>2FA</strong> (« two-factor authentication », authentification à deux facteurs) exige <strong>deux preuves</strong> pour se connecter : quelque chose que tu <em>sais</em> (ton mot de passe) et quelque chose que tu <em>possèdes</em> (ton téléphone). Même si un voleur a ton mot de passe, il lui manque le second facteur.</p>
<pre class="pseudo">Facteur 1 : le mot de passe        # ce que tu SAIS
Facteur 2 : un code a usage unique  # ce que tu POSSEDES (ton telephone)
   → genere par une appli d'authentification (TOTP), qui change toutes les 30 s</pre>
<div class="tip">Activer la 2FA : clique sur ta photo ▸ <strong>Settings</strong> ▸ <strong>Password and authentication</strong> ▸ <strong>Enable two-factor authentication</strong>. Le plus sûr est une <strong>appli d'authentification</strong> (TOTP) plutôt que le SMS, plus vulnérable.</div>

<h3>3. Les codes de secours</h3>
<p>Quand tu actives la 2FA, GitHub te donne une liste de <strong>recovery codes</strong> (« codes de récupération »). Ils te permettent de te reconnecter si tu perds ton téléphone. Note-les dans un endroit sûr, hors ligne. Sans eux, un téléphone perdu peut te bloquer hors de ton propre compte.</p>
<div class="warn">Ne stocke jamais tes codes de secours dans un dépôt, un Gist ou un e-mail. Un endroit hors ligne (papier, gestionnaire de mots de passe) est le bon choix.</div>

<h3>4. Les jetons d'accès personnels (tokens)</h3>
<p>Un <strong>token</strong> (« jeton d'accès personnel », en anglais <em>personal access token</em> ou PAT) est un mot de passe spécial, long et généré par GitHub, utilisé par les <strong>programmes</strong> et la ligne de commande à la place de ton vrai mot de passe. D'ailleurs, GitHub n'accepte plus le mot de passe pour <code>git push</code> en HTTPS : il faut un token.</p>
<pre class="pseudo">Settings ▸ Developer settings ▸ Personal access tokens   # la ou on cree un jeton
On choisit :
   - une EXPIRATION (ex : 90 jours)      # le jeton meurt tout seul : plus sur
   - des DROITS precis (scopes)          # ex : lire/ecrire les depots, rien de plus
On copie le jeton UNE SEULE FOIS         # GitHub ne le remontrera jamais</pre>
<p>Le token remplace le mot de passe quand un outil te le demande (par exemple lors d'un <code>git push</code> en HTTPS). On lui donne le <strong>minimum de droits</strong> nécessaires (principe du moindre privilège) et une <strong>date d'expiration</strong>.</p>

<h3>5. La règle d'or : ne jamais commiter un secret</h3>
<p>Un <strong>secret</strong> est toute donnée sensible : mot de passe, token, clé d'API, certificat. La faute la plus courante — et la plus grave — est de la coller dans le code puis de la commiter.</p>
<div class="warn">Une fois poussé, un secret est dans l'historique Git <strong>pour toujours</strong>, même si tu le supprimes au commit suivant : on peut le retrouver dans les anciens commits. Considère un secret commité comme <strong>compromis</strong> : il faut le <strong>révoquer</strong> (le désactiver) et en générer un nouveau, immédiatement.</div>
<pre class="pseudo">JAMAIS de secret dans le code    # ni mot de passe, ni token, ni cle d'API
Utilise plutot :
   - un fichier .env             # variables locales... AJOUTE au .gitignore !
   - les « Secrets » de GitHub    # pour l'automatisation (Settings ▸ Secrets)
Si un secret a fuite → REVOQUE-le tout de suite, puis regenere-en un neuf.</pre>
<div class="tip">GitHub veille : son « secret scanning » détecte automatiquement certains formats de clés poussés par erreur et t'alerte. Mais ne compte pas dessus : la meilleure protection reste de ne jamais les commiter.</div>`,

    { type: "vf", q: "Un secret commité puis supprimé au commit suivant est totalement effacé du dépôt.", a: false, exp: "Il reste dans l'historique : on peut le retrouver dans les anciens commits." },
    { type: "input", q: "Le fichier où l'on met ses variables locales sensibles, et qu'il faut AJOUTER au .gitignore :", a: [".env", "env"], ph: "…", exp: "Le .env ne doit jamais être commité." },
    { type: "input", q: "Le verbe qui désigne « désactiver définitivement » un secret compromis :", a: ["révoquer", "revoquer", "le révoquer", "révoquer le token"], ph: "…", exp: "On révoque un secret exposé, puis on en génère un neuf." },
    { type: "vf", q: "Le « secret scanning » de GitHub remplace totalement la vigilance du développeur.", a: false, exp: "C'est un filet de sécurité, pas une excuse : ne commite jamais de secret." }
  ],

    intro: `<p>Tu prépares ton compte pour un vrai travail d'équipe. Tu veux la 2FA, un token pour pousser en HTTPS depuis ton terminal, et tu réfléchis à ce que tu ferais si tu commitais une clé d'API par erreur.</p>`,
    questions: [

      { type: "qcm", q: "Pour pousser en HTTPS depuis ton terminal, GitHub te demande…", opts: ["Un personal access token, à la place du mot de passe", "Ton numéro de carte bancaire", "Le nom de la branche", "Rien du tout"], a: 0, exp: "Le token remplace le mot de passe." },
      { type: "qcm", q: "En créant ce token, tu règles…", opts: ["Une expiration et des droits limités", "Tous les droits pour toujours", "Aucun réglage", "Sa couleur"], a: 0, exp: "Moindre privilège + expiration." },
      { type: "vf", q: "Si tu commets une clé d'API par erreur et que tu la pousses, tu dois la révoquer et en générer une nouvelle, même après l'avoir supprimée du code.", a: true, exp: "Elle reste dans l'historique : considère-la compromise." }
    ],
    solution: `<pre class="pseudo">1. Settings ▸ Password and authentication ▸ Enable two-factor
   → choisir une appli d'authentification (TOTP)
   → noter les recovery codes HORS LIGNE (papier / gestionnaire)

2. Settings ▸ Developer settings ▸ Personal access tokens
   → Generate new token
     - Expiration : 90 jours
     - Scopes : seulement ce qui est necessaire (ex : repo)
   → copier le token UNE SEULE FOIS, le coller quand git le demande
     lors d'un git push en HTTPS.

3. Ne JAMAIS commiter un secret :
   - variables locales dans .env  → AJOUTE au .gitignore
   - verifier avant chaque commit (git diff) qu'aucune cle ne passe

4. En cas de fuite d'une cle poussee :
   a) REVOQUER la cle immediatement (chez le fournisseur)
   b) en generer une nouvelle
   c) elle reste dans l'historique → la considerer compromise
      (la supprimer du code ne suffit pas)</pre>
<p>Un compte blindé et zéro secret dans le code : les deux réflexes qui protègent tout ton travail. Demain : retrouver n'importe quoi grâce à la recherche GitHub.</p>`
