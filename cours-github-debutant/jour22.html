var DAY = {
  num: 22,
  title: "Collaborateurs et permissions",
  subtitle: "Qui a le droit de faire quoi sur ton dépôt.",
  theory: `
<h3>1. Dépôt public ou privé</h3>
<p>Un dépôt <strong>public</strong> est visible par tout le monde ; n'importe qui peut le lire, le cloner, le forker. Un dépôt <strong>privé</strong> n'est visible que par toi et les personnes que tu invites. Dans les deux cas, <strong>seules les personnes autorisées peuvent y écrire</strong> (pousser du code).</p>
<div class="tip">Changer la visibilité : dépôt ▸ <strong>Settings</strong> ▸ section <strong>Danger Zone</strong> ▸ <strong>Change visibility</strong>.</div>

<h3>2. Le collaborateur : quelqu'un qui peut pousser</h3>
<p>Un <strong>collaborateur</strong> est une personne à qui tu donnes le droit d'écrire directement dans <em>ton</em> dépôt, sans passer par un fork. Tu l'invites par son pseudo GitHub ; elle reçoit une invitation à accepter.</p>
<div class="tip">Chemin dans l'interface : dépôt ▸ <strong>Settings</strong> ▸ <strong>Collaborators</strong> ▸ <strong>Add people</strong> ▸ tu tapes le pseudo ▸ la personne reçoit une invitation.</div>

<h3>3. Fork ou collaborateur : deux façons de contribuer</h3>
<pre class="pseudo">SANS permission d'ecriture   →  fork + Pull Request   # la voie de l'open source, pour les inconnus
AVEC permission (collaborateur)  →  branche + Pull Request dans le meme depot   # pour une equipe de confiance</pre>
<p>Un collaborateur peut créer une branche <em>dans le dépôt lui-même</em> et ouvrir une PR sans forker. On réserve ce rôle aux personnes de confiance.</p>

<h3>4. Les niveaux de permission</h3>
<p>Sur GitHub, un rôle définit ce qu'une personne peut faire. Les principaux, du moins au plus puissant :</p>
<pre class="pseudo">Read (lecture)     # voir et cloner le depot ; ne peut pas pousser
Triage            # gerer les Issues et PR (labels, fermeture) sans pousser de code
Write (ecriture)   # pousser du code, creer des branches : le role du collaborateur classique
Maintain          # + certains reglages du depot, sans les plus sensibles
Admin             # tout : reglages, suppression, gestion des autres collaborateurs</pre>
<p><strong>Read</strong> = regarder. <strong>Write</strong> = contribuer. <strong>Admin</strong> = commander. On donne toujours le rôle <strong>le plus faible qui suffit</strong> à la tâche.</p>

<h3>5. Organisations, teams et branches protégées</h3>
<p>Une <strong>organisation</strong> est un compte partagé pour un groupe (une entreprise, une association). Elle contient des <strong>teams</strong> (« équipes ») auxquelles on attribue des permissions d'un coup, plutôt que personne par personne.</p>
<p>Pour verrouiller main, on active une <strong>branch protection rule</strong> (« règle de protection de branche ») : on peut alors exiger qu'une PR soit approuvée avant tout merge, et interdire le push direct sur main.</p>
<div class="warn">Ne donne pas le rôle Admin à la légère : un admin peut supprimer le dépôt et retirer les autres. Accorde toujours le minimum de droits nécessaire — c'est le principe du moindre privilège.</div>`,

    { type: "qcm", q: "Un collaborateur est une personne qui…", opts: ["A le droit d'écrire dans ton dépôt sans forker", "Ne peut que lire", "A supprimé ton dépôt", "Possède un autre projet"], a: 0, exp: "Il pousse directement, sur invitation." },
    { type: "input", q: "L'onglet du dépôt où l'on gère la visibilité et les collaborateurs :", a: ["Settings", "settings", "Paramètres", "Parametres"], ph: "…", exp: "Settings ▸ Collaborators, Settings ▸ Change visibility." },
    { type: "input", q: "Dans Settings, le sous-menu où l'on invite des collaborateurs :", a: ["Collaborators", "collaborators"], ph: "…", exp: "Settings ▸ Collaborators ▸ Add people." },

    { type: "qcm", q: "Le rôle « Read » permet…", opts: ["De voir et cloner, mais pas de pousser", "De tout supprimer", "De pousser du code", "De gérer les autres membres"], a: 0, exp: "Read = lecture seule." },
    { type: "input", q: "Le nom anglais du rôle qui permet de pousser du code et créer des branches :", a: ["Write", "write"], ph: "…", exp: "Write = le rôle du collaborateur classique." },
    { type: "qcm", q: "Le rôle le plus puissant, qui peut supprimer le dépôt, est…", opts: ["Admin", "Read", "Triage", "Guest"], a: 0, exp: "Admin peut tout, y compris supprimer et gérer les membres." },
    { type: "vf", q: "Il faut toujours donner le rôle Admin à chaque collaborateur.", a: false, exp: "On donne le rôle le plus faible qui suffit : le moindre privilège." },
    { type: "input", q: "Le mot anglais désignant un compte partagé pour un groupe ou une entreprise :", a: ["organisation", "organization", "organizations"], ph: "…", exp: "Une organisation regroupe des membres et des teams." },
    { type: "qcm", q: "Une « team » dans une organisation sert à…", opts: ["Attribuer des permissions à un groupe d'un coup", "Supprimer des dépôts", "Cacher les Issues", "Créer des mots de passe"], a: 0, exp: "On gère les droits par équipe plutôt qu'un par un." },
    { type: "input", q: "Le mot anglais désignant une règle qui verrouille une branche (« … protection rule ») :", a: ["branch", "Branch"], ph: "…", exp: "Une branch protection rule protège main." },
    { type: "qcm", q: "Une règle de protection de branche peut…", opts: ["Exiger une PR approuvée avant tout merge sur main", "Rendre le code plus rapide", "Supprimer les branches automatiquement", "Changer la couleur du dépôt"], a: 0, exp: "Elle interdit le push direct et impose la relecture." },
    { type: "vf", q: "Un collaborateur avec le rôle Write peut créer une branche dans le dépôt sans forker.", a: true, exp: "Ayant l'écriture, il travaille directement dans le dépôt." },
    { type: "qcm", q: "Le principe du « moindre privilège » recommande de…", opts: ["Donner à chacun le minimum de droits nécessaire", "Donner Admin à tout le monde", "Rendre tous les dépôts publics", "Supprimer les permissions"], a: 0, exp: "Moins de droits = moins de risques." }
  ],
  final: {
    title: "Exercice final — Ouvrir son projet à une petite équipe",
    intro: `<p>Tu diriges un projet dans un dépôt privé. Trois personnes rejoignent : Léa doit pouvoir coder, Tom doit seulement relire et trier les Issues, et une stagiaire ne doit que consulter le code. Tu veux aussi empêcher tout push direct sur main.</p>`,
    questions: [
      { type: "input", q: "Par quel onglet du dépôt passes-tu pour inviter ces personnes ?", a: ["Settings", "settings"], ph: "…", exp: "Settings ▸ Collaborators." },
      { type: "input", q: "Quel rôle donnes-tu à Léa, qui doit coder ? (mot anglais)", a: ["Write", "write"], ph: "…", exp: "Write permet de pousser du code." },
      { type: "qcm", q: "Quel rôle convient à Tom, qui trie les Issues sans coder ?", opts: ["Triage", "Admin", "Write", "Maintain"], a: 0, exp: "Triage gère Issues et PR sans droit de push." },
      { type: "qcm", q: "Quel rôle donnes-tu à la stagiaire qui doit seulement consulter ?", opts: ["Read", "Admin", "Write", "Maintain"], a: 0, exp: "Read = lecture seule, le minimum nécessaire." },
      { type: "vf", q: "Pour empêcher le push direct sur main et imposer une PR approuvée, tu ajoutes une branch protection rule.", a: true, exp: "La règle de protection verrouille main." }
    ],
    solution: `<pre class="pseudo">1. Settings ▸ Collaborators ▸ Add people
     Lea       ▸ role Write     # elle peut coder et pousser
     Tom       ▸ role Triage    # il gere Issues et PR, sans push
     Stagiaire ▸ role Read      # elle consulte seulement
   (principe du moindre privilege : le minimum qui suffit)

2. Settings ▸ Branches ▸ Add branch protection rule (main) :
     - Require a pull request before merging   # pas de push direct
     - Require approvals                        # une PR doit etre approuvee

Resultat : chacun a juste ce qu'il lui faut, et main est protegee :
toute modification passe par une PR relue.</pre>
<p>Bien répartir les droits protège le projet sans freiner l'équipe. Demain : marquer les versions officielles avec les tags et les releases.</p>`
  }
