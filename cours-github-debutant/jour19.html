  title: "Labels, milestones et assignation",
  subtitle: "Trier, regrouper, attribuer : le rangement des Issues.",
  theory: `
<h3>1. Les labels : des étiquettes de couleur</h3>
<p>Un <strong>label</strong> (« étiquette ») est une pastille de couleur qu'on colle sur une Issue ou une Pull Request pour la classer. GitHub en fournit quelques-uns par défaut : <code>bug</code>, <code>enhancement</code> (« amélioration »), <code>documentation</code>, <code>question</code>, <code>good first issue</code> (« bonne première tâche », idéale pour un débutant).</p>
<p>Une même Issue peut porter <strong>plusieurs</strong> labels. On filtre ensuite la liste : « montre-moi toutes les Issues étiquetées <code>bug</code> ». C'est le tri par couleur du projet.</p>
<div class="tip">Gérer les labels : dépôt ▸ onglet <strong>Issues</strong> ▸ bouton <strong>Labels</strong>. Tu peux en créer, changer leur nom et leur couleur.</div>

<h3>2. Le milestone : un jalon, un objectif daté</h3>
<p>Un <strong>milestone</strong> (« jalon, borne kilométrique ») regroupe plusieurs Issues sous un même objectif, souvent avec une <strong>date d'échéance</strong>. Par exemple le milestone « Version 1.0 » rassemble tout ce qui doit être fini avant de sortir la première version.</p>
<p>Le milestone affiche une <strong>barre de progression</strong> : « 7 tâches sur 10 terminées, 70 % ». C'est le tableau de bord d'un objectif.</p>
<pre class="pseudo">Milestone « Version 1.0 »      # un objectif date
  #12 Corriger le formulaire   (fermee)   # tache terminee
  #15 Ajouter le mode sombre   (ouverte)  # reste a faire
  Progression : 1 / 2 = 50 %              # barre calculee automatiquement</pre>

<h3>3. L'assignation : à qui de jouer ?</h3>
<p><strong>Assigner</strong> une Issue, c'est désigner la ou les personnes <strong>responsables</strong> de la traiter. Leur avatar apparaît sur la fiche. On sait ainsi qui s'en occupe et on évite que deux personnes fassent la même chose, ou que personne ne s'en charge.</p>
<div class="tip">Sur une Issue, colonne de droite : <strong>Assignees</strong> (« responsables »), <strong>Labels</strong>, <strong>Milestone</strong>. Trois réglages côte à côte. Clique sur <strong>assign yourself</strong> pour te désigner toi-même.</div>

<h3>4. Filtrer pour s'y retrouver</h3>
<p>La barre de recherche des Issues comprend des filtres simples. On les combine pour trouver exactement ce qu'on cherche :</p>
<pre class="pseudo">is:issue is:open label:bug       # toutes les Issues OUVERTES etiquetees bug
assignee:@me                      # les Issues qui me sont assignees
milestone:"Version 1.0"           # tout ce qui appartient a ce jalon
is:issue is:closed label:bug      # les bugs deja regles</pre>
<div class="warn">Ne confonds pas les trois : le <strong>label</strong> dit <em>de quoi</em> il s'agit (un bug, une idée), le <strong>milestone</strong> dit <em>pour quand</em> (l'objectif visé), l'<strong>assignation</strong> dit <em>qui</em> s'en occupe.</div>
<div class="tip">Le label <code>good first issue</code> est une tradition open source : il signale aux nouveaux venus une tâche simple pour débuter. Cherche-le pour ta première contribution !</div>`,
  exercises: [
    { type: "qcm", q: "Un label est…", opts: ["Une étiquette de couleur qui classe une Issue", "Un jalon daté du projet", "Une branche distante", "Un commit"], a: 0, exp: "Le tri par couleur des Issues et PR." },
    { type: "input", q: "Le label anglais qui signale une tâche facile pour un débutant (trois mots) :", a: ["good first issue"], ph: "…", exp: "good first issue : la porte d'entrée de l'open source." },

    { type: "qcm", q: "Assigner une Issue à quelqu'un sert à…", opts: ["Indiquer qui est responsable de la traiter", "Supprimer l'Issue", "La fermer", "Créer un label"], a: 0, exp: "On évite les doublons et les oublis." },
    { type: "vf", q: "Le label dit de quoi il s'agit, le milestone dit pour quand, l'assignation dit qui.", a: true, exp: "Trois rôles complémentaires à ne pas confondre." },
    { type: "input", q: "Complète le filtre pour ne voir que les Issues OUVERTES étiquetées bug : « is:issue is:open … »", a: ["label:bug"], ph: "label:…", exp: "label:bug filtre par étiquette." },
    { type: "qcm", q: "Le filtre « assignee:@me » montre…", opts: ["Les Issues qui me sont assignées", "Tous les dépôts publics", "Les Issues que j'ai créées", "Les commits de main"], a: 0, exp: "@me = l'utilisateur connecté." },
    { type: "input", q: "L'onglet du dépôt depuis lequel on gère les Issues (et le sous-bouton Labels) :", a: ["Issues", "issues"], ph: "…", exp: "Issues ▸ Labels pour créer ou modifier les étiquettes." },
    { type: "vf", q: "Un milestone peut avoir une date d'échéance.", a: true, exp: "C'est ce qui en fait un objectif daté." },
    { type: "qcm", q: "Le label « enhancement » désigne…", opts: ["Une amélioration ou nouvelle fonctionnalité", "Un bug critique", "Une tâche de documentation", "Une question ouverte"], a: 0, exp: "enhancement = amélioration ; bug = défaut." },
    { type: "vf", q: "On peut se désigner soi-même responsable d'une Issue avec « assign yourself ».", a: true, exp: "Pratique pour dire « je m'en occupe »." },
    { type: "qcm", q: "Filtrer les Issues par label sert surtout à…", opts: ["Retrouver rapidement une catégorie de tâches", "Effacer l'historique Git", "Changer de branche", "Cloner le dépôt"], a: 0, exp: "Le tri rend un long projet lisible." }
  ],
  final: {
    title: "Exercice final — Organiser le sprint",
    intro: `<p>Ton équipe prépare la sortie « Version 1.0 » du site. Tu disposes de trois Issues :</p><pre class="pseudo">#21 Le menu déborde sur mobile        (un défaut visuel)
#22 Ajouter un mode sombre            (une nouvelle idée)
#23 Écrire le guide d'installation    (de la doc)</pre><p>Tu veux tout ranger proprement.</p>`,

      { type: "qcm", q: "Le label le plus adapté à l'Issue #22 (mode sombre) est…", opts: ["enhancement", "bug", "documentation", "question"], a: 0, exp: "Une nouvelle fonctionnalité = enhancement." },
      { type: "input", q: "Pour relier ces trois Issues au même objectif daté, tu leur ajoutes le même…", a: ["milestone", "Milestone"], ph: "…", exp: "Le milestone « Version 1.0 » les regroupe." },
      { type: "input", q: "Tu décides de t'occuper de #23 toi-même : dans la colonne de droite, quel réglage utilises-tu ? (mot anglais)", a: ["Assignees", "assignees", "assignee"], ph: "…", exp: "Assignees ▸ assign yourself." },
      { type: "vf", q: "Une fois #21, #22 et #23 rangées dans le milestone « Version 1.0 », sa barre de progression suivra l'avancement automatiquement.", a: true, exp: "Chaque Issue fermée fait monter le pourcentage." }
    ],
    solution: `<pre class="pseudo">1. #21 ▸ Labels : bug            # de quoi il s'agit
   #22 ▸ Labels : enhancement    # une nouvelle idee
   #23 ▸ Labels : documentation  # de la doc

2. Milestone « Version 1.0 » (avec date) applique aux trois # pour quand

3. Assignation :
   #21 ▸ Assignees : Sofia
   #22 ▸ Assignees : Karim
   #23 ▸ assign yourself         # je m'en occupe

4. Suivi : milestone « Version 1.0 » ▸ barre 0 / 3
   Chaque Issue fermee fait monter le pourcentage jusqu'a 100 %.</pre>
<p>Labels pour trier, milestone pour viser, assignation pour agir : un projet bien rangé avance tout seul. Demain : contribuer à un projet qui n'est pas le tien avec le fork.</p>`
  }
