<script>
var DAY = {
  num: 9,
  title: "Graphiques de données efficaces",
  subtitle: "Montrer un chiffre, pas décorer : le graphique au service du message.",
  theory: `
<h3>1. Un graphique répond à une question</h3>
<p>Un <strong>graphique</strong> traduit des données en visuel. La première question n'est pas « lequel est joli ? » mais « quel message dois-je faire passer ? ». Comparaison, évolution, répartition, corrélation : à chaque intention son type de graphique.</p>
<pre class="pseudo">Insertion ▸ Illustrations ▸ Graphique ▸ choisir un type
(un mini-classeur Excel s'ouvre pour saisir les données)</pre>
<ul>
<li><strong>Comparer des catégories</strong> → barres/colonnes.</li>
<li><strong>Évolution dans le temps</strong> → courbes.</li>
<li><strong>Répartition d'un tout</strong> → secteurs (camembert), avec parcimonie.</li>
<li><strong>Relation entre deux variables</strong> → nuage de points.</li>
</ul>
<h3>2. Le camembert : à manier avec prudence</h3>
<div class="warn">Le secteur (camembert) n'est lisible qu'avec 2-4 parts très contrastées. Au-delà, l'oeil ne compare plus les angles : une barre est presque toujours plus claire.</div>
<h3>3. Data-ink : effacer le superflu</h3>
<p>Le principe du <strong>data-ink</strong> (Edward Tufte) : chaque pixel doit porter de l'information. On supprime tout ce qui n'aide pas à lire : quadrillage lourd, contours d'axes inutiles, effets 3D, dégradés, ombres. Un graphique épuré se lit plus vite.</p>
<pre class="pseudo">Création de graphique ▸ Ajouter un élément graphique   // titres, étiquettes, axes
Clic sur un élément ▸ Suppr                             // retirer quadrillage, légende superflue
Bouton + à droite du graphique                          // afficher/masquer les éléments</pre>
<h3>4. Étiquettes plutôt que légende lointaine</h3>
<p>Les <strong>étiquettes de données</strong> affichent la valeur directement sur la barre ou le point. Elles évitent l'aller-retour vers une légende ou une échelle. Mieux vaut nommer chaque série près d'elle qu'un renvoi éloigné.</p>
<pre class="pseudo">Ajouter un élément graphique ▸ Étiquettes de données</pre>
<h3>5. Couleur au service du message</h3>
<p>Colorer TOUTES les barres différemment brouille le propos. Mets en <strong>couleur d'accent</strong> la seule barre importante et laisse les autres en gris neutre : l'oeil va droit au message.</p>
<div class="tip">Trie les catégories (décroissant) sauf ordre naturel (mois, tailles). Un classement rend la comparaison immédiate.</div>
<h3>6. Données liées et nouveautés</h3>
<p>Un graphique PowerPoint stocke ses données dans un mini-classeur intégré ; on peut aussi le <strong>coller lié</strong> à un fichier Excel pour qu'il se mette à jour. Microsoft 365 propose des types récents (par ex. <strong>graphiques en cascade</strong>, <strong>compartimentage</strong>, <strong>entonnoir</strong>) apparus autour de 2016-2019 ; ils sont présents en 2021, partiellement en 2019.</p>
<pre class="pseudo">Copier un graphique Excel ▸ Coller ▸ (options) Conserver le lien vers les données</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la première question avant de choisir un graphique ?", opts: ["Lequel est le plus joli ?", "Quel message dois-je faire passer ?", "Combien de couleurs ?", "Quelle animation ?"], a: 1, exp: "Le type découle de l'intention (comparer, évoluer, répartir…)." },
    { type: "qcm", q: "Pour montrer une évolution dans le temps, quel type ?", opts: ["Camembert", "Courbe", "Nuage de points", "Anneau"], a: 1, exp: "La courbe illustre une évolution temporelle." },
    { type: "qcm", q: "Pour comparer des catégories, quel type privilégier ?", opts: ["Barres/colonnes", "Camembert 3D", "Radar", "Bulle"], a: 0, exp: "Les barres permettent une comparaison précise des longueurs." },
    { type: "vf", q: "Un camembert reste lisible avec dix parts.", a: false, exp: "Au-delà de 2-4 parts contrastées, l'oeil ne compare plus les angles." },
    { type: "qcm", q: "Que dit le principe du data-ink ?", opts: ["Ajouter le plus d'effets possible", "Chaque pixel doit porter de l'information ; on supprime le superflu", "Toujours en 3D", "Colorer chaque barre"], a: 1, exp: "On épure : moins d'encre décorative, plus de lisibilité." },
    { type: "qcm", q: "À quoi servent les étiquettes de données ?", opts: ["À décorer", "À afficher la valeur directement sur la barre/le point", "À animer", "À changer le thème"], a: 1, exp: "Elles évitent l'aller-retour vers l'échelle ou la légende." },
    { type: "vf", q: "Colorer chaque barre d'une couleur différente clarifie le message.", a: false, exp: "Cela brouille : mieux vaut accentuer une seule barre, le reste en gris." },
    { type: "qcm", q: "Comment attirer l'oeil sur la barre importante ?", opts: ["La cacher", "Lui donner la couleur d'accent, les autres en gris neutre", "Toutes en couleur", "En 3D"], a: 1, exp: "Le contraste isole la donnée clé." },
    { type: "qcm", q: "Pourquoi trier les catégories en décroissant (sauf ordre naturel) ?", opts: ["Pour décorer", "Pour rendre la comparaison immédiate", "Pour réduire le fichier", "Aucune raison"], a: 1, exp: "Un classement facilite la lecture des écarts." },
    { type: "qcm", q: "Où saisit-on les données d'un graphique PowerPoint ?", opts: ["Dans les notes", "Dans un mini-classeur Excel intégré", "Dans le masque", "Dans les Transitions"], a: 1, exp: "Un tableau de données s'ouvre à la création du graphique." },
    { type: "vf", q: "On peut coller un graphique Excel en conservant un lien vers les données source.", a: true, exp: "Le collage lié met à jour le graphique quand Excel change." },
    { type: "qcm", q: "Quel élément supprimer en priorité pour épurer ?", opts: ["Les données", "Le quadrillage lourd et les effets 3D inutiles", "Le titre", "Les axes nécessaires"], a: 1, exp: "Quadrillage et 3D décoratifs nuisent à la lisibilité." },
    { type: "qcm", q: "Les graphiques en cascade, entonnoir, compartimentage sont apparus…", opts: ["Depuis les années 2000", "Autour de 2016-2019 (présents en 2021, partiels en 2019)", "En 2023 seulement", "Ils n'existent pas"], a: 1, exp: "Ces types récents sont pleinement en 365/2021, partiels en 2019." },
    { type: "vf", q: "Un nuage de points sert à montrer la relation entre deux variables.", a: true, exp: "Le nuage révèle une corrélation éventuelle." },
    { type: "qcm", q: "Comment afficher/masquer rapidement les éléments d'un graphique ?", opts: ["Le bouton + à droite du graphique", "F5", "Ctrl + M", "Transitions"], a: 0, exp: "Le bouton + coche/décoche titres, étiquettes, quadrillage, légende." }
  ],
  final: {
    title: "Exercice final — Un graphique qui clame le message",
    intro: `<p>Ventes par région : Nord 120, Sud 90, Est 60, Ouest 210, Centre 80 (en milliers d'euros). Ton message : l'Ouest écrase toutes les autres régions. Objectif : un graphique qui rend ce message évident.</p>`,
    questions: [
      { type: "qcm", q: "Quel type pour comparer ces régions ?", opts: ["Camembert 3D", "Colonnes ou barres", "Courbe", "Radar"], a: 1, exp: "Des catégories à comparer appellent des barres/colonnes." },
      { type: "qcm", q: "Comment faire ressortir l'Ouest ?", opts: ["Tout colorer pareil", "Mettre l'Ouest en couleur d'accent, les autres en gris", "Le cacher", "L'animer en 3D"], a: 1, exp: "L'accent isole la barre clé ; le gris efface le reste." },
      { type: "vf", q: "Trier les régions en décroissant (Ouest en tête) renforce le message.", a: true, exp: "Le tri rend l'écart immédiatement visible." },
      { type: "qcm", q: "Pour éviter d'aller lire l'échelle, on ajoute…", opts: ["Une légende lointaine", "Les étiquettes de données sur les barres", "Un quadrillage dense", "Un effet 3D"], a: 1, exp: "Les étiquettes affichent la valeur directement." },
      { type: "qcm", q: "Quel élément supprimer pour épurer ?", opts: ["Les étiquettes", "Le quadrillage lourd et l'axe redondant", "Le titre du message", "Les barres"], a: 1, exp: "On retire l'encre non informative (data-ink)." }
    ],
    solution: `<p>Construction du graphique :</p>
<pre class="pseudo">1  Insertion ▸ Graphique ▸ Histogramme (colonnes) ▸ saisir les 5 valeurs
2  Trier les données en décroissant : Ouest 210, Nord 120, Sud 90, Centre 80, Est 60
3  Cliquer la barre Ouest ▸ Remplissage = couleur d'accent ; les autres barres en gris neutre
4  Bouton + ▸ Étiquettes de données (afficher les valeurs), retirer le quadrillage et la légende
5  Titre du graphique = le message ("L'Ouest domine les ventes")
6  Vérifier la lisibilité et la sobriété (pas de 3D, pas d'ombre)</pre>
<p>En un coup d'oeil, le public voit que l'Ouest écrase les autres régions.</p>`
  }
};
</script>
