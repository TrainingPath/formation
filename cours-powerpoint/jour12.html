  title: "Les animations et le volet Animation",
  subtitle: "Faire apparaître, disparaître et bouger les objets, à bon escient.",
  theory: `
<h3>1. Quatre familles d'animations</h3>
<p>Une <strong>animation</strong> fait bouger un objet À L'INTÉRIEUR d'une diapo. PowerPoint en distingue quatre familles :</p>
<ul>
<li><strong>Ouverture (entrée)</strong> : l'objet apparaît (Apparition, Fondu, Zoom…).</li>
<li><strong>Accentuation (emphase)</strong> : l'objet déjà visible se met en avant (Pulsation, Rotation…).</li>
<li><strong>Fermeture (sortie)</strong> : l'objet disparaît.</li>
<li><strong>Trajectoires</strong> : l'objet suit un chemin (jour 14).</li>
</ul>
<pre class="pseudo">Animations ▸ (galerie) ▸ Ajouter une animation
Animations ▸ Options d'effet          // direction, par mot/lettre, par élément…</pre>
<h3>2. Déclenchement et minutage</h3>
<p>Chaque animation démarre selon un mode : <strong>Au clic</strong> (le présentateur déclenche), <strong>Avec la précédente</strong> (en même temps) ou <strong>Après la précédente</strong> (à la suite, automatiquement). On règle aussi la <strong>durée</strong> et le <strong>délai</strong>.</p>
<pre class="pseudo">Animations ▸ Minutage ▸ Début : Au clic / Avec la précédente / Après la précédente
Animations ▸ Minutage ▸ Durée / Délai</pre>
<h3>3. Le volet Animation, tour de contrôle</h3>
<p>Le <strong>volet Animation</strong> liste toutes les animations d'une diapo dans l'ordre, avec leur déclenchement. C'est là qu'on réordonne (glisser-déposer), qu'on affine le minutage et qu'on regroupe des effets.</p>
<pre class="pseudo">Animations ▸ Animations avancées ▸ Volet Animation
Chaque ligne : icône de déclenchement + barre de durée (glisser pour caler)</pre>
<div class="tip">Le numéro affiché à gauche d'un objet en mode édition indique son ordre d'animation. Zéro numéro = pas d'animation.</div>
<h3>4. Reproduire une animation</h3>
<p>La <strong>reproduction de l'animation</strong> copie tous les réglages d'animation d'un objet vers un autre, d'un clic, comme le pinceau de mise en forme.</p>
<pre class="pseudo">Animations ▸ Animation avancée ▸ Reproduire l'animation   // clic sur l'objet cible</pre>
<h3>5. Design : l'animation au service du sens</h3>
<div class="warn">Une animation ne s'ajoute jamais « pour faire joli ». Elle doit avoir une FONCTION : révéler progressivement (une idée à la fois), attirer l'attention sur un point, ou montrer un mouvement/processus.</div>
<p>Bonnes pratiques : préfère les entrées sobres (Fondu, Apparition), évite les effets tape-à-l'oeil (Rebond, Rotation folle), reste cohérent (même effet d'entrée sur tout le deck). Anime une liste <strong>par paragraphe</strong> pour dérouler les points un à un.</p>
<h3>6. Versions</h3>
<p>Les animations de base sont identiques en 365 et 2021/2019. Certaines nouveautés d'interface (aperçu, options) diffèrent légèrement, mais le fonctionnement du volet Animation est stable depuis longtemps. Pour un mouvement fluide d'objet entre deux diapos, la Morphose (jour 13) remplace souvent avantageusement une animation manuelle.</p>`,

    { type: "qcm", q: "Quelle famille fait APPARAÎTRE un objet ?", opts: ["Accentuation", "Ouverture (entrée)", "Fermeture (sortie)", "Trajectoire"], a: 1, exp: "L'ouverture gère l'apparition d'un objet." },

    { type: "qcm", q: "Que signifie Après la précédente ?", opts: ["Au clic", "L'animation démarre automatiquement à la suite de la précédente", "En même temps", "Jamais"], a: 1, exp: "Elle s'enchaîne sans clic après l'effet précédent." },

    { type: "qcm", q: "Comment réordonner les animations ?", opts: ["Impossible", "Glisser-déposer les lignes dans le volet Animation", "Changer de police", "F5"], a: 1, exp: "On réorganise l'ordre par glisser-déposer dans le volet." },
    { type: "qcm", q: "Que fait Reproduire l'animation ?", opts: ["Supprime l'animation", "Copie les réglages d'animation d'un objet vers un autre", "Ajoute un son", "Change la durée"], a: 1, exp: "Comme le pinceau, mais pour les animations." },
    { type: "vf", q: "Une animation doit avoir une fonction (révéler, attirer, montrer un mouvement).", a: true, exp: "Jamais d'animation gratuite : elle sert le sens." },

    { type: "qcm", q: "Que révèle le numéro affiché à gauche d'un objet en édition ?", opts: ["Sa taille", "Son ordre d'animation", "Sa couleur", "Rien"], a: 1, exp: "Le numéro indique la place de l'objet dans la séquence d'animation." },
    { type: "vf", q: "Les effets tape-à-l'oeil (Rebond, Rotation folle) sont recommandés en contexte pro.", a: false, exp: "On préfère des entrées sobres (Fondu, Apparition)." },
    { type: "qcm", q: "Où règle-t-on durée et délai d'une animation ?", opts: ["Transitions", "Animations ▸ Minutage", "Fichier ▸ Options", "Création"], a: 1, exp: "Le groupe Minutage contient début, durée et délai." },
    { type: "qcm", q: "Pour un objet qui doit se déplacer fluidement entre deux diapos, on peut préférer…", opts: ["Une sortie brutale", "La Morphose (jour 13)", "Un son", "Rien"], a: 1, exp: "Morph gère élégamment le déplacement d'objets communs." },
    { type: "vf", q: "Garder le même effet d'entrée sur tout le deck renforce la cohérence.", a: true, exp: "La cohérence des animations donne un rendu professionnel." }
  ],

    questions: [

      { type: "qcm", q: "Quel effet d'entrée privilégier ?", opts: ["Rebond", "Fondu ou Apparition (sobre)", "Rotation folle", "Damier"], a: 1, exp: "Un effet sobre reste professionnel." },
      { type: "vf", q: "Une accentuation (ex. Pulsation) convient pour faire ressortir le cadre de conclusion.", a: true, exp: "L'accentuation met en avant un objet déjà visible." },
      { type: "qcm", q: "Où vérifier et réordonner la séquence ?", opts: ["Le masque", "Le volet Animation", "Les Transitions", "Fichier ▸ Options"], a: 1, exp: "Le volet Animation liste et réorganise les effets." },
      { type: "qcm", q: "Pour appliquer les mêmes réglages à une autre diapo similaire, on utilise…", opts: ["Reproduire l'animation", "Un nouveau thème", "Une transition", "Rien"], a: 0, exp: "Reproduire l'animation copie les réglages d'un objet à l'autre." }
    ],
    solution: `<p>Mise en animation :</p>
<pre class="pseudo">1  Sélectionner la liste ▸ Animations ▸ Fondu (entrée)
2  Animations ▸ Options d'effet ▸ Par paragraphe
3  Minutage ▸ Début : Au clic (chaque point apparaît à un clic)
4  Sélectionner le cadre de conclusion ▸ Ajouter une animation ▸ Accentuation ▸ Pulsation
5  Minutage : Après la précédente, durée courte
6  Volet Animation : vérifier l'ordre, ajuster les délais
7  (option) Reproduire l'animation vers une diapo similaire</pre>
<p>Le public suit les arguments un à un, puis l'oeil est guidé vers la conclusion.</p>`
  }
