<script>
var DAY = {
  num: 16,
  title: "Navigation non linéaire : liens, boutons, sections",
  subtitle: "Concevoir un deck qu'on parcourt dans l'ordre qu'on veut.",
  theory: `
<h3>1. Sortir du déroulé linéaire</h3>
<p>Par défaut, un diaporama avance diapo après diapo. La <strong>navigation non linéaire</strong> permet de sauter directement où l'on veut (menu, retour, exploration) : utile pour une borne interactive, une FAQ, un tableau de bord, une présentation qu'on adapte en direct aux questions.</p>
<h3>2. Les sections : organiser le deck</h3>
<p>Une <strong>section</strong> regroupe des diapos sous un intitulé, comme des chapitres. Cela facilite la réorganisation, l'affichage et sert de base au Zoom résumé (jour 18).</p>
<pre class="pseudo">Clic droit entre deux diapos (volet miniatures) ▸ Ajouter une section
Accueil ▸ Section ▸ Réduire tout / Développer tout</pre>
<h3>3. Les liens hypertexte</h3>
<p>Un <strong>lien hypertexte</strong> attaché à un texte ou un objet renvoie vers : une autre diapo, un fichier, une adresse web ou une adresse e-mail. C'est la brique de base de la navigation.</p>
<pre class="pseudo">Insertion ▸ Liens ▸ Lien (Ctrl + K) ▸ Emplacement dans ce document ▸ (choisir la diapo)
Clic droit sur le lien ▸ Modifier / Supprimer le lien</pre>
<div class="tip">Lier vers un TITRE de diapo (via l'emplacement dans ce document) est plus robuste que lier vers un numéro : si l'ordre change, le lien suit la bonne diapo.</div>
<h3>4. Les boutons d'action</h3>
<p>Un <strong>bouton d'action</strong> est une forme prédéfinie (Accueil, Suivant, Précédent, Retour…) associée à une action au clic ou au survol. Idéal pour un menu ou une borne.</p>
<pre class="pseudo">Insertion ▸ Illustrations ▸ Formes ▸ Boutons d'action (en bas de la galerie)
Insertion ▸ Liens ▸ Action ▸ Cliquer avec la souris : Créer un lien hypertexte vers…</pre>
<h3>5. Verrouiller le parcours (kiosque)</h3>
<div class="warn">Pour une borne, empêche l'avancement accidentel : configure le diaporama en mode borne (jour 18) et désactive l'avancement au clic, pour ne laisser que tes boutons de navigation.</div>
<pre class="pseudo">Transitions ▸ Minutage ▸ décocher Au clic de la souris
Diaporama ▸ Configurer le diaporama ▸ Visité sur une borne (plein écran)</pre>
<h3>6. Design d'une navigation claire</h3>
<p>Une navigation utile est <strong>cohérente</strong> (mêmes boutons au même endroit sur chaque diapo, idéalement placés dans le masque) et <strong>lisible</strong> (on comprend où mène chaque bouton). Prévois toujours un retour au menu. Sections, liens et boutons existent à l'identique en 365 et 2021/2019.</p>
<div class="tip">Place les boutons de navigation dans le masque ou la disposition : ils apparaîtront automatiquement et resteront alignés sur toutes les diapos.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que la navigation non linéaire ?", opts: ["Avancer diapo après diapo", "Sauter directement à la diapo voulue (menu, retour, exploration)", "Supprimer des diapos", "Changer de thème"], a: 1, exp: "Elle permet de parcourir le deck dans un ordre libre." },
    { type: "qcm", q: "Qu'est-ce qu'une section ?", opts: ["Un thème", "Un regroupement de diapos sous un intitulé (chapitre)", "Une animation", "Un lien"], a: 1, exp: "La section organise le deck en chapitres." },
    { type: "qcm", q: "Comment ajouter une section ?", opts: ["Insertion ▸ Objet", "Clic droit entre deux diapos ▸ Ajouter une section", "Transitions", "Fichier ▸ Options"], a: 1, exp: "On ajoute une section depuis le volet des miniatures." },
    { type: "qcm", q: "Quel raccourci ouvre la boîte de lien hypertexte ?", opts: ["Ctrl + L", "Ctrl + K", "Ctrl + H", "Ctrl + J"], a: 1, exp: "Ctrl + K insère ou modifie un lien." },
    { type: "vf", q: "Lier vers un titre de diapo est plus robuste que lier vers un numéro.", a: true, exp: "Si l'ordre change, un lien vers le titre suit la bonne diapo." },
    { type: "qcm", q: "Qu'est-ce qu'un bouton d'action ?", opts: ["Une transition", "Une forme prédéfinie associée à une action au clic/survol", "Un thème", "Un graphique"], a: 1, exp: "Les boutons d'action (Accueil, Suivant…) déclenchent une navigation." },
    { type: "qcm", q: "Où trouve-t-on les boutons d'action ?", opts: ["Transitions", "Insertion ▸ Formes ▸ Boutons d'action (bas de la galerie)", "Révision", "Création"], a: 1, exp: "Ils figurent en bas de la galerie des formes." },
    { type: "vf", q: "Une action peut se déclencher au survol (pas seulement au clic).", a: true, exp: "La boîte Action propose clic ET survol de la souris." },
    { type: "qcm", q: "Vers quoi un lien hypertexte peut-il renvoyer ?", opts: ["Uniquement une autre diapo", "Une diapo, un fichier, une adresse web ou e-mail", "Uniquement le web", "Rien"], a: 1, exp: "Le lien couvre diapo, fichier, URL et e-mail." },
    { type: "qcm", q: "Pour une borne, comment éviter l'avancement accidentel ?", opts: ["Rien", "Décocher Au clic + configurer en mode borne", "Ajouter des sons", "Supprimer les liens"], a: 1, exp: "Le mode borne et la désactivation du clic verrouillent le parcours." },
    { type: "vf", q: "Placer les boutons de navigation dans le masque les fait apparaître sur toutes les diapos.", a: true, exp: "Le masque diffuse les boutons de façon cohérente et alignée." },
    { type: "qcm", q: "Pourquoi prévoir un bouton de retour au menu ?", opts: ["Pour décorer", "Pour que l'utilisateur puisse toujours revenir au point central", "Pour compresser", "Pour masquer les autres diapos"], a: 1, exp: "Un retour au menu évite de bloquer l'utilisateur." },
    { type: "qcm", q: "À quoi servent aussi les sections ?", opts: ["À chiffrer", "De base au Zoom résumé (jour 18) et à la réorganisation", "À animer", "À imprimer"], a: 1, exp: "Les sections structurent le deck et alimentent le Zoom résumé." },
    { type: "vf", q: "Sections, liens et boutons diffèrent fortement entre 365 et 2019.", a: false, exp: "Ces fonctions sont identiques d'une version à l'autre." },
    { type: "qcm", q: "Qu'est-ce qui rend une navigation professionnelle ?", opts: ["Des boutons différents partout", "Cohérence (mêmes boutons, même place) et lisibilité", "Beaucoup de couleurs", "Des sons"], a: 1, exp: "Cohérence et clarté guident l'utilisateur sans effort." }
  ],
  final: {
    title: "Exercice final — Un menu interactif de borne",
    intro: `<p>Tu conçois une borne : une diapo Menu avec quatre rubriques cliquables (Produits, Tarifs, Contact, À propos). Chaque rubrique mène à sa section, et chaque diapo de contenu a un bouton Retour au menu. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Comment organiser les diapos par rubrique ?", opts: ["En une seule section", "En sections (une par rubrique)", "Sans structure", "En thèmes"], a: 1, exp: "Une section par rubrique clarifie l'organisation." },
      { type: "qcm", q: "Comment rendre les rubriques du menu cliquables ?", opts: ["Un thème", "Un lien hypertexte (Ctrl + K) vers la diapo/section", "Une transition", "Une animation"], a: 1, exp: "Chaque libellé reçoit un lien vers sa diapo." },
      { type: "vf", q: "Un bouton d'action Accueil peut servir de Retour au menu.", a: true, exp: "Le bouton Accueil se lie à la diapo Menu." },
      { type: "qcm", q: "Où placer le bouton Retour pour qu'il apparaisse partout ?", opts: ["Sur chaque diapo à la main", "Dans le masque / la disposition", "Dans les notes", "Dans un fichier séparé"], a: 1, exp: "Le masque diffuse le bouton de façon cohérente." },
      { type: "qcm", q: "Pour verrouiller la borne, on…", opts: ["Ajoute des sons", "Décoche Au clic et configure en mode borne", "Supprime les liens", "Change le thème"], a: 1, exp: "Le mode borne empêche l'avancement accidentel." }
    ],
    solution: `<p>Construction de la borne :</p>
<pre class="pseudo">1  Créer une section par rubrique (clic droit entre diapos ▸ Ajouter une section)
2  Diapo Menu : 4 formes/libellés ▸ chacun Ctrl + K ▸ Emplacement dans ce document ▸ diapo de la rubrique
3  Masque/disposition : ajouter un Bouton d'action Accueil ▸ lien vers la diapo Menu
4  Transitions ▸ Minutage ▸ décocher Au clic de la souris (sur les diapos de contenu)
5  Diaporama ▸ Configurer le diaporama ▸ Visité sur une borne (plein écran)
6  Maj + F5 : tester chaque rubrique et le retour au menu</pre>
<p>La borne se parcourt librement et revient toujours au menu, sans dérapage.</p>`
  }
};
</script>
