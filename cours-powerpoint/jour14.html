<script>
var DAY = {
  num: 14,
  title: "Trajectoires et déclencheurs",
  subtitle: "Faire suivre un chemin à un objet et déclencher au clic ciblé.",
  theory: `
<h3>1. Les trajectoires de mouvement</h3>
<p>Une <strong>trajectoire</strong> (motion path) est une animation où l'objet suit un <strong>chemin</strong> dessiné : ligne, arc, boucle, ou tracé libre. Contrairement à une entrée/sortie, l'objet reste visible et se déplace le long du parcours.</p>
<pre class="pseudo">Animations ▸ Ajouter une animation ▸ Trajectoires ▸ (Lignes, Arcs, Personnalisée…)
Trajectoire personnalisée : cliquer les points, double-clic pour terminer</pre>
<div class="tip">Le point vert marque le départ, le point rouge l'arrivée. Une trajectoire fantôme (grisée) montre la position finale de l'objet en édition.</div>
<h3>2. Régler et lisser la trajectoire</h3>
<pre class="pseudo">Clic sur le chemin ▸ poignées pour déplacer départ/arrivée
Clic droit sur le chemin ▸ Modifier les points        // courber le tracé
Animations ▸ Options d'effet ▸ Chemin inversé / Verrouillé</pre>
<p>On peut combiner une trajectoire avec un léger fondu d'entrée pour un rendu plus doux. La <strong>durée</strong> et le lissage (accélération/décélération, via les options d'effet) évitent un mouvement mécanique.</p>
<h3>3. Qu'est-ce qu'un déclencheur ?</h3>
<p>Un <strong>déclencheur</strong> (trigger) fait démarrer une animation quand on clique sur un <strong>objet précis</strong> (et non au clic général de progression). Cela rend une diapo <strong>interactive</strong> : cliquer telle image révèle telle explication.</p>
<pre class="pseudo">Animations ▸ Animation avancée ▸ Déclencheur ▸ Au clic sur ▸ (choisir l'objet)</pre>
<h3>4. Construire une interaction simple</h3>
<p>Exemple : trois boutons révèlent chacun un bloc de texte différent. Chaque bloc reçoit une entrée déclenchée par le clic sur son bouton. On peut aussi ajouter une sortie déclenchée pour masquer.</p>
<div class="tip">Les déclencheurs permettent des quiz, des FAQ dépliables, des schémas explorables au clic, sans quitter le mode diaporama.</div>
<h3>5. Ordonner avec le volet Animation</h3>
<p>Le <strong>volet Animation</strong> regroupe les effets par déclencheur : chaque bloc déclenché apparaît sous une barre « Déclencheur : nom de l'objet ». On y vérifie et réordonne finement.</p>
<pre class="pseudo">Animations ▸ Volet Animation ▸ (groupes Déclencheur : …)</pre>
<h3>6. Design et versions</h3>
<div class="warn">Trajectoires et déclencheurs sont puissants mais risqués : trop d'objets en mouvement distraient. Réserve-les à un objectif clair (montrer un flux, un parcours, une interaction utile).</div>
<p>Trajectoires et déclencheurs existent depuis longtemps, à l'identique en 365 et 2021/2019. Pour un simple déplacement d'objet entre deux vues, la Morphose (jour 13) est souvent plus simple et plus fluide qu'une trajectoire manuelle.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une trajectoire (motion path) ?", opts: ["Une entrée d'objet", "Une animation où l'objet suit un chemin dessiné", "Une transition", "Un thème"], a: 1, exp: "L'objet se déplace le long d'un parcours tout en restant visible." },
    { type: "qcm", q: "Que marque le point vert d'une trajectoire ?", opts: ["L'arrivée", "Le départ", "La couleur", "La durée"], a: 1, exp: "Vert = départ, rouge = arrivée." },
    { type: "vf", q: "On peut dessiner une trajectoire personnalisée en cliquant des points.", a: true, exp: "La trajectoire Personnalisée se trace point par point." },
    { type: "qcm", q: "Comment courber un tracé de trajectoire ?", opts: ["Impossible", "Clic droit sur le chemin ▸ Modifier les points", "Changer de thème", "Ajouter un son"], a: 1, exp: "Modifier les points permet de courber le parcours." },
    { type: "qcm", q: "Qu'est-ce qu'un déclencheur (trigger) ?", opts: ["Une transition", "Un mécanisme qui lance une animation au clic sur un objet précis", "Un thème", "Une police"], a: 1, exp: "Le déclencheur rend la diapo interactive : clic sur X anime Y." },
    { type: "qcm", q: "Où définit-on un déclencheur ?", opts: ["Transitions", "Animations ▸ Animation avancée ▸ Déclencheur", "Fichier ▸ Options", "Création"], a: 1, exp: "La commande Déclencheur est dans Animation avancée." },
    { type: "vf", q: "Les déclencheurs permettent des quiz ou des FAQ dépliables en mode diaporama.", a: true, exp: "Cliquer un objet révèle une réponse : interaction sans quitter le diaporama." },
    { type: "qcm", q: "Comment le volet Animation présente-t-il les effets déclenchés ?", opts: ["Mélangés", "Regroupés sous une barre Déclencheur : nom de l'objet", "Cachés", "Supprimés"], a: 1, exp: "Chaque déclencheur forme un groupe dans le volet." },
    { type: "qcm", q: "Comment adoucir un mouvement mécanique ?", opts: ["Le rendre plus rapide", "Régler l'accélération/décélération (lissage) et la durée", "Ajouter un son", "Le supprimer"], a: 1, exp: "Le lissage évite un déplacement robotique." },
    { type: "vf", q: "Trop d'objets en mouvement peuvent distraire le public.", a: true, exp: "On réserve trajectoires et déclencheurs à un objectif clair." },
    { type: "qcm", q: "Pour un simple déplacement entre deux vues, quelle alternative souvent plus simple ?", opts: ["Un tableau", "La Morphose (jour 13)", "Un graphique", "Une transition sonore"], a: 1, exp: "Morph gère élégamment un déplacement d'objet commun." },
    { type: "qcm", q: "Que fait l'option Chemin inversé ?", opts: ["Change la couleur", "Inverse le sens de parcours de la trajectoire", "Supprime le chemin", "Ajoute un point"], a: 1, exp: "L'objet parcourt le chemin dans l'autre sens." },
    { type: "vf", q: "Une trajectoire fait disparaître l'objet une fois arrivé.", a: false, exp: "L'objet reste visible ; il s'est seulement déplacé (sauf sortie ajoutée)." },
    { type: "qcm", q: "Trajectoires et déclencheurs sont-ils disponibles en 2019 ?", opts: ["Non, 365 seulement", "Oui, à l'identique en 365 et 2021/2019", "Uniquement en 2013", "Jamais"], a: 1, exp: "Ces fonctions existent depuis longtemps dans toutes ces versions." },
    { type: "qcm", q: "Comment terminer le tracé d'une trajectoire personnalisée ?", opts: ["Échap seulement", "Double-clic pour terminer", "F5", "Ctrl + S"], a: 1, exp: "Un double-clic clôt le tracé point par point." }
  ],
  final: {
    title: "Exercice final — Une diapo interactive à déclencheurs",
    intro: `<p>Tu conçois une diapo « Quiz » : une question et trois boutons de réponse (A, B, C). Un clic sur la bonne réponse (B) affiche « Correct ! » ; un clic sur A ou C affiche « Réessaie ». Objectif : rendre la diapo interactive avec des déclencheurs.</p>`,
    questions: [
      { type: "qcm", q: "Quel mécanisme relie le clic sur un bouton à l'affichage d'un message ?", opts: ["Une transition", "Un déclencheur (Au clic sur ce bouton)", "Un thème", "Une trajectoire"], a: 1, exp: "Le déclencheur lie le clic sur l'objet à une animation." },
      { type: "qcm", q: "Quelle animation donner au message Correct ?", opts: ["Une sortie", "Une entrée (ex. Fondu) déclenchée par le clic sur B", "Un thème", "Rien"], a: 1, exp: "Une entrée déclenchée révèle le message au bon clic." },
      { type: "vf", q: "Le volet Animation regroupera les effets sous chaque déclencheur.", a: true, exp: "Chaque bouton forme un groupe Déclencheur dans le volet." },
      { type: "qcm", q: "Comment vérifier l'interaction ?", opts: ["À l'impression", "En mode diaporama (Maj + F5) en cliquant les boutons", "Dans le masque", "En PDF"], a: 1, exp: "Seul le diaporama exécute les déclencheurs." },
      { type: "qcm", q: "Si le mouvement d'un objet suffisait au lieu d'un clic ciblé, on pourrait préférer…", opts: ["Un tableau", "La Morphose", "Une transition sonore", "Un graphique"], a: 1, exp: "Morph simplifie un simple déplacement d'objet." }
    ],
    solution: `<p>Construction du quiz :</p>
<pre class="pseudo">1  Créer la question + 3 boutons (formes A, B, C) + 2 messages ("Correct !", "Réessaie") masqués
2  Message "Correct !" ▸ Animations ▸ entrée Fondu ▸ Déclencheur ▸ Au clic sur ▸ Bouton B
3  Message "Réessaie" ▸ entrée Fondu ▸ Déclencheur ▸ Au clic sur ▸ Bouton A (répéter pour C)
4  Volet Animation : vérifier les groupes Déclencheur : Bouton B / A / C
5  (option) ajouter une sortie déclenchée pour masquer un message avant d'en montrer un autre
6  Maj + F5 : cliquer A, B, C pour tester les réactions</pre>
<p>La diapo réagit au clic ciblé : un vrai mini-quiz sans quitter le diaporama.</p>`
  }
};
