  title: "Dispositions et espaces réservés personnalisés",
  subtitle: "Concevoir des mises en page sur mesure pour chaque type de contenu.",
  theory: `
<h3>1. La disposition, ossature d'une diapo</h3>
<p>Une <strong>disposition</strong> (layout) est un agencement d'espaces réservés hérité du masque. PowerPoint en fournit onze par défaut (Diapositive de titre, Titre et contenu, Comparaison, Vide…). Au lieu de bricoler chaque diapo, on prépare des dispositions adaptées à ses contenus récurrents (une fiche produit, une citation, une diapo de section).</p>
<div class="tip">Bien conçues, les dispositions rendent la saisie rapide : l'utilisateur clique dans les zones prévues, tout est déjà positionné et stylé. C'est le secret d'un deck homogène produit à plusieurs mains.</div>
<h3>2. Les types d'espaces réservés</h3>
<p>Dans le masque, on insère des placeholders typés. Chaque type contraint le contenu accepté :</p>
<pre class="pseudo">Masque des diapositives ▸ Insérer un espace réservé ▸
   Contenu | Texte | Image | Graphique | Tableau | SmartArt | Multimédia | En ligne (365)</pre>
<p>Un espace réservé <strong>Contenu</strong> est polyvalent (il affiche les icônes texte/tableau/graphique/image/SmartArt/vidéo). Un placeholder <strong>Image</strong> n'accepte qu'une image et la recadre automatiquement dans son cadre : idéal pour aligner des visuels au format identique.</p>
<h3>3. Créer une disposition personnalisée</h3>
<pre class="pseudo">Affichage ▸ Modes Masque ▸ Masque des diapositives
Masque ▸ Insérer une disposition                       // ajoute un layout enfant
Masque ▸ Insérer un espace réservé ▸ choisir le type   // placer les zones
Masque ▸ Renommer                                       // nommer la disposition</pre>
<p>Nomme tes dispositions clairement (« Fiche produit », « Citation », « Section ») : ces noms apparaissent dans Accueil ▸ Disposition, ce qui guide la saisie.</p>
<h3>4. Positionner au pixel près</h3>
<p>Pour un alignement rigoureux, saisis les coordonnées exactes plutôt que de glisser à la souris.</p>
<pre class="pseudo">Format de la forme ▸ Taille et propriétés ▸ Position (H/V) et Taille
Alt + glisser        = déplacement fin (ignore l'accrochage)
Ctrl + glisser       = dupliquer                    // Ctrl + D duplique aussi</pre>
<h3>5. Cacher les graphiques d'arrière-plan</h3>
<p>Chaque disposition peut masquer les éléments décoratifs venus du parent, utile pour une diapo de section épurée.</p>
<pre class="pseudo">Masque ▸ Arrière-plan ▸ (cocher) Masquer les graphiques d'arrière-plan</pre>
<h3>6. Design : la règle du réseau (grille) et de l'espace</h3>
<p>Un bon layout respecte une <strong>grille</strong> implicite : marges régulières, colonnes alignées, espaces de respiration (le <em>blanc</em>). Le blanc n'est pas du vide perdu : il hiérarchise et repose l'oeil. Évite d'entasser les zones bord à bord.</p>
<div class="warn">Ne confonds pas une zone de texte libre (Insertion ▸ Zone de texte) et un espace réservé : seul le placeholder est piloté par le masque et repris dans le mode Plan et l'accessibilité.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une disposition (layout) ?", opts: ["Un thème de couleurs", "Un agencement d'espaces réservés hérité du masque", "Une animation", "Un fichier vidéo"], a: 1, exp: "La disposition organise les placeholders d'un type de diapo." },
    { type: "qcm", q: "Que fait un espace réservé de type Image ?", opts: ["Il accepte tout contenu", "Il n'accepte qu'une image et la recadre dans son cadre", "Il insère une vidéo", "Il crée un graphique"], a: 1, exp: "Le placeholder Image contraint et cadre automatiquement le visuel." },
    { type: "vf", q: "Un espace réservé Contenu peut accueillir texte, tableau, graphique, image, SmartArt ou vidéo.", a: true, exp: "Le placeholder Contenu est polyvalent grâce à ses icônes." },
    { type: "qcm", q: "Où insère-t-on une nouvelle disposition ?", opts: ["Insertion ▸ Objet", "Mode Masque ▸ Insérer une disposition", "Transitions", "Fichier ▸ Nouveau"], a: 1, exp: "On ajoute des dispositions dans le mode Masque." },
    { type: "qcm", q: "Pourquoi nommer clairement ses dispositions ?", opts: ["Pour réduire le fichier", "Parce que ces noms guident la saisie dans Accueil ▸ Disposition", "C'est obligatoire", "Pour accélérer le diaporama"], a: 1, exp: "Des noms explicites aident quiconque saisit du contenu." },
    { type: "vf", q: "Une zone de texte libre est pilotée par le masque comme un espace réservé.", a: false, exp: "Seul le placeholder est géré par le masque, le Plan et l'accessibilité." },
    { type: "qcm", q: "Comment saisir une position exacte pour un objet ?", opts: ["À la souris uniquement", "Format de la forme ▸ Taille et propriétés ▸ Position", "Dans les Transitions", "Impossible"], a: 1, exp: "Les champs Position H/V permettent un placement au pixel près." },
    { type: "qcm", q: "Que fait Alt + glisser ?", opts: ["Duplique l'objet", "Déplace finement en ignorant l'accrochage à la grille", "Supprime l'objet", "Ouvre le masque"], a: 1, exp: "Alt désactive l'accrochage pour un positionnement libre." },
    { type: "vf", q: "Ctrl + D duplique l'objet sélectionné.", a: true, exp: "Ctrl + D (ou Ctrl + glisser) crée une copie." },
    { type: "qcm", q: "Comment masquer les décorations d'arrière-plan sur une disposition précise ?", opts: ["Supprimer le masque", "Masque ▸ Arrière-plan ▸ Masquer les graphiques d'arrière-plan", "Changer de thème", "Transitions"], a: 1, exp: "L'option masque les graphiques hérités du parent sur cette disposition." },
    { type: "qcm", q: "À quoi sert le blanc (espace vide) dans une mise en page ?", opts: ["À rien, c'est du gaspillage", "À hiérarchiser et reposer l'oeil", "À réduire le fichier", "À accélérer l'animation"], a: 1, exp: "Le blanc structure la lecture : c'est un outil de design, pas un vide." },
    { type: "vf", q: "Un espace réservé Image aligne facilement des visuels au même format.", a: true, exp: "Il impose un cadre identique et recadre chaque image dedans." },
    { type: "qcm", q: "Combien de dispositions par défaut PowerPoint fournit-il environ ?", opts: ["3", "Onze", "50", "Une seule"], a: 1, exp: "Onze dispositions standard (Titre, Titre et contenu, Comparaison…)." },
    { type: "qcm", q: "Quel est l'avantage des dispositions bien conçues en travail collaboratif ?", opts: ["Elles chiffrent le fichier", "Elles garantissent un deck homogène produit à plusieurs mains", "Elles suppriment les animations", "Elles réduisent le nombre de diapos"], a: 1, exp: "Chacun saisit dans des zones prévues : homogénéité assurée." },
    { type: "vf", q: "Le mode Plan et les lecteurs d'écran s'appuient sur les espaces réservés, pas sur les zones de texte libres.", a: true, exp: "D'où l'importance d'utiliser de vrais placeholders." }
  ],
  final: {
    title: "Exercice final — La disposition Fiche produit",
    intro: `<p>Un catalogue exige une diapo répétée : à gauche une grande image du produit, à droite un titre, un sous-titre de prix et une zone de description à puces. Tu veux une disposition sur mesure réutilisable pour trente produits.</p>`,
    questions: [
      { type: "qcm", q: "Pour garantir que chaque photo soit cadrée pareil, quel type d'espace réservé à gauche ?", opts: ["Texte", "Image", "Graphique", "Tableau"], a: 1, exp: "Le placeholder Image cadre chaque photo à l'identique." },
      { type: "qcm", q: "Où crée-t-on cette disposition ?", opts: ["Sur une diapo normale", "Dans le mode Masque via Insérer une disposition", "Dans les Transitions", "Fichier ▸ Options"], a: 1, exp: "Les dispositions se créent dans le masque." },
      { type: "vf", q: "Nommer la disposition Fiche produit la rendra sélectionnable dans Accueil ▸ Disposition.", a: true, exp: "Le nom apparaît dans la galerie des dispositions." },
      { type: "qcm", q: "Pour aligner titre, prix et description au pixel près, on utilise…", opts: ["La souris à l'oeil", "Format de la forme ▸ Position (H/V)", "Le hasard", "Les Transitions"], a: 1, exp: "Les coordonnées exactes assurent un alignement rigoureux." },
      { type: "qcm", q: "Sur trente diapos, l'intérêt principal de cette disposition est…", opts: ["De chiffrer le fichier", "Une saisie rapide et un rendu parfaitement homogène", "De supprimer les images", "D'ajouter des transitions"], a: 1, exp: "Homogénéité + rapidité : le but d'une disposition dédiée." }
    ],
    solution: `<p>Création de la disposition Fiche produit :</p>
<pre class="pseudo">1  Affichage ▸ Modes Masque ▸ Masque des diapositives
2  Masque ▸ Insérer une disposition
3  Masque ▸ Insérer un espace réservé ▸ Image : tracer la grande zone à gauche
4  Insérer un placeholder Texte (titre), un autre (prix), un espace réservé Contenu (description à puces) à droite
5  Format de la forme ▸ Position : caler les coordonnées pour un alignement net + marges régulières
6  Masque ▸ Renommer ▸ Fiche produit
7  Fermer le mode Masque
8  Accueil ▸ Nouvelle diapositive ▸ Fiche produit ▸ remplir ▸ dupliquer pour chaque produit</pre>
<p>Trente fiches cohérentes se saisissent alors sans jamais repositionner un élément.</p>`
  }
};
