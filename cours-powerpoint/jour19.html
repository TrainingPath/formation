<script>
var DAY = {
  num: 19,
  title: "Collaboration et co-édition",
  subtitle: "Travailler à plusieurs sur un deck sans se marcher dessus.",
  theory: `
<h3>1. Le prérequis : le cloud</h3>
<p>La <strong>co-édition</strong> (plusieurs personnes qui modifient le même fichier en même temps) exige que la présentation soit stockée sur <strong>OneDrive</strong> ou <strong>SharePoint</strong>. Chacun voit les curseurs et modifications des autres en quasi temps réel.</p>
<pre class="pseudo">Fichier ▸ Enregistrer sous ▸ OneDrive / SharePoint
Partager (en haut à droite) ▸ inviter par e-mail ▸ droits Modifier / Lecture</pre>
<div class="tip">La co-édition en temps réel est pleinement disponible en Microsoft 365 (bureau et web). En 2021/2019 non connectés à un compte 365/SharePoint, la co-édition simultanée est limitée voire absente : on retombe sur un partage plus classique.</div>
<h3>2. Partager et gérer les droits</h3>
<p>Le bouton <strong>Partager</strong> envoie un lien avec un niveau d'accès : <strong>Modifier</strong> (co-éditer) ou <strong>Lecture</strong> (consulter). On peut restreindre à des personnes précises ou à l'organisation.</p>
<pre class="pseudo">Partager ▸ Gérer l'accès ▸ (modifier/retirer des droits)
Partager ▸ Obtenir un lien</pre>
<h3>3. Les commentaires</h3>
<p>Un <strong>commentaire</strong> est une note attachée à une diapo ou un objet, pour donner un avis sans modifier le contenu. Les commentaires modernes sont <strong>fils de discussion</strong> (on répond, on résout).</p>
<pre class="pseudo">Révision ▸ Commentaires ▸ Nouveau commentaire
Insertion ▸ Commentaire         // sur l'objet sélectionné
Résoudre / Répondre dans le volet Commentaires ; @mention pour notifier</pre>
<div class="tip">L'<strong>@mention</strong> (taper @ puis le nom) notifie un collègue par e-mail avec un lien direct vers le commentaire. Fonction 365, absente hors ligne.</div>
<h3>4. Suivi des modifications et versions</h3>
<p>Sur le cloud, l'<strong>historique des versions</strong> conserve les états antérieurs du fichier : on peut comparer et restaurer. Hors ligne, la commande <strong>Comparer</strong> confronte deux fichiers et fusionne les différences.</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Historique des versions        // cloud
Révision ▸ Comparer                                     // fusion de deux .pptx</pre>
<h3>5. Bonnes pratiques de co-édition</h3>
<div class="warn">Pour éviter les conflits : convenez d'un découpage (chacun ses sections), communiquez via les commentaires, et laissez l'AutoSave activé. Deux personnes sur la même zone au même instant peuvent créer des versions concurrentes.</div>
<ul>
<li>Un <strong>masque/thème verrouillé</strong> (jours 2-3) évite que chacun casse la charte.</li>
<li>Des <strong>dispositions</strong> claires (jour 4) guident les contributeurs.</li>
<li>Nommer les sections et se répartir le travail.</li>
</ul>
<h3>6. Protéger et finaliser</h3>
<p>Avant diffusion, on peut <strong>protéger</strong> (mot de passe, marquer comme final) et vérifier qu'aucune donnée sensible ne traîne (Inspecteur de document, jour 20).</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Protéger la présentation ▸ Marquer comme final / Chiffrer avec mot de passe</pre>`,
  exercises: [
    { type: "qcm", q: "Que faut-il pour co-éditer en temps réel ?", opts: ["Rien", "Un fichier stocké sur OneDrive ou SharePoint", "Une imprimante", "Un thème récent"], a: 1, exp: "La co-édition simultanée passe par le cloud (OneDrive/SharePoint)." },
    { type: "vf", q: "La co-édition en temps réel est pleinement disponible en Microsoft 365.", a: true, exp: "En 2021/2019 hors 365/SharePoint, elle est limitée voire absente." },
    { type: "qcm", q: "Quels niveaux d'accès propose le partage ?", opts: ["Imprimer / Scanner", "Modifier / Lecture", "Rapide / Lent", "Public / Privé uniquement"], a: 1, exp: "On accorde le droit de modifier (co-éditer) ou de lire." },
    { type: "qcm", q: "Qu'est-ce qu'un commentaire ?", opts: ["Une animation", "Une note attachée à une diapo/objet pour donner un avis", "Un thème", "Un lien"], a: 1, exp: "Le commentaire annote sans modifier le contenu." },
    { type: "vf", q: "Les commentaires modernes sont des fils de discussion (réponse, résolution).", a: true, exp: "On répond et on résout les commentaires en fil." },
    { type: "qcm", q: "Que fait une @mention dans un commentaire ?", opts: ["Rien", "Notifie un collègue par e-mail avec un lien direct", "Supprime le commentaire", "Change le thème"], a: 1, exp: "L'@mention alerte la personne citée (fonction 365)." },
    { type: "qcm", q: "Où retrouver les états antérieurs d'un fichier cloud ?", opts: ["Transitions", "Fichier ▸ Informations ▸ Historique des versions", "Insertion", "Création"], a: 1, exp: "L'historique des versions permet comparaison et restauration." },
    { type: "qcm", q: "Que fait Révision ▸ Comparer ?", opts: ["Compresse", "Confronte deux fichiers .pptx et fusionne les différences", "Change la police", "Anime"], a: 1, exp: "Comparer fusionne les écarts entre deux versions hors ligne." },
    { type: "vf", q: "Deux personnes éditant la même zone au même instant peuvent créer des versions concurrentes.", a: true, exp: "D'où l'intérêt de se répartir les sections." },
    { type: "qcm", q: "Comment éviter que chacun casse la charte en co-édition ?", opts: ["Interdire les commentaires", "S'appuyer sur un masque/thème et des dispositions verrouillant le style", "Travailler hors ligne", "Ne rien partager"], a: 1, exp: "Masque, thème et dispositions cadrent les contributions." },
    { type: "qcm", q: "Comment marquer un fichier comme terminé pour dissuader les modifs ?", opts: ["Le supprimer", "Fichier ▸ Informations ▸ Protéger ▸ Marquer comme final", "Transitions", "Compresser"], a: 1, exp: "Marquer comme final signale que le document est abouti." },
    { type: "vf", q: "L'AutoSave doit être désactivé pendant la co-édition.", a: false, exp: "Au contraire, on le laisse actif pour synchroniser en continu." },
    { type: "qcm", q: "Où saisir un commentaire sur un objet précis ?", opts: ["Transitions", "Insertion ▸ Commentaire (objet sélectionné) ou Révision ▸ Nouveau commentaire", "Fichier ▸ Options", "Création"], a: 1, exp: "On commente une diapo ou un objet sélectionné." },
    { type: "qcm", q: "Comment protéger l'accès par mot de passe ?", opts: ["Impossible", "Fichier ▸ Informations ▸ Protéger ▸ Chiffrer avec mot de passe", "Transitions", "Révision ▸ Comparer"], a: 1, exp: "Le chiffrement par mot de passe restreint l'ouverture." },
    { type: "vf", q: "Se répartir les sections réduit les risques de conflit en co-édition.", a: true, exp: "Un découpage clair évite que deux personnes touchent la même zone." }
  ],
  final: {
    title: "Exercice final — Organiser un projet à trois",
    intro: `<p>Trois collègues doivent produire un deck commun de 30 diapos en deux jours, à distance. Objectif : co-éditer efficacement, se répartir le travail, échanger des retours et sécuriser la version finale.</p>`,
    questions: [
      { type: "qcm", q: "Où stocker le fichier pour co-éditer en temps réel ?", opts: ["Sur une clé USB", "Sur OneDrive ou SharePoint", "Par e-mail à chaque modif", "En local"], a: 1, exp: "Le cloud est la condition de la co-édition simultanée." },
      { type: "qcm", q: "Comment donner accès aux deux collègues ?", opts: ["Imprimer", "Partager ▸ inviter ▸ droit Modifier", "Un PDF", "Rien"], a: 1, exp: "Le partage avec droit Modifier autorise la co-édition." },
      { type: "vf", q: "Se répartir les sections limite les conflits d'édition.", a: true, exp: "Chacun sa zone : moins de collisions." },
      { type: "qcm", q: "Comment demander une correction à un collègue précis ?", opts: ["Un commentaire avec @mention", "Une transition", "Un thème", "Une animation"], a: 0, exp: "L'@mention notifie la personne visée." },
      { type: "qcm", q: "Comment sécuriser la version finale ?", opts: ["La supprimer", "Marquer comme final (et vérifier l'historique des versions)", "Ajouter des sons", "Compresser seulement"], a: 1, exp: "Marquer comme final + historique protègent le résultat." }
    ],
    solution: `<p>Organisation du projet :</p>
<pre class="pseudo">1  Enregistrer le deck sur OneDrive/SharePoint ▸ AutoSave activé
2  Partager ▸ inviter les 2 collègues ▸ droit Modifier
3  Créer des sections et se les répartir (une par personne)
4  Verrouiller la charte via masque/thème/dispositions
5  Échanger via commentaires + @mention (Révision ▸ Commentaires)
6  Suivre l'avancement dans Fichier ▸ Informations ▸ Historique des versions
7  À la fin : Protéger ▸ Marquer comme final ; inspecter le document (jour 20)</pre>
<p>Trois personnes produisent un deck cohérent, sans écraser le travail des autres.</p>`
  }
};
</script>
