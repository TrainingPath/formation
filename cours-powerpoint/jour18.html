<script>
var DAY = {
  num: 18,
  title: "Diaporama automatique, kiosque et Zoom",
  subtitle: "Une présentation qui tourne seule et un sommaire cliquable.",
  theory: `
<h3>1. Configurer le diaporama</h3>
<p>La boîte <strong>Configurer le diaporama</strong> définit COMMENT le diaporama se joue : présenté par un intervenant, visualisé par une personne (fenêtre), ou <strong>visité sur une borne</strong> (kiosque plein écran, en boucle, sans contrôle clavier ordinaire).</p>
<pre class="pseudo">Diaporama ▸ Configurer le diaporama ▸
   Type : Présenté par un intervenant / Visité par une personne / Visité sur une borne
   Options : En continu jusqu'à Échap ; Utiliser les minutages</pre>
<h3>2. Avancement automatique</h3>
<p>Pour qu'un diaporama tourne seul, chaque diapo doit avancer <strong>après un délai</strong> (transition automatique) ou selon des <strong>minutages</strong> enregistrés (répétition minutée, jour 17).</p>
<pre class="pseudo">Transitions ▸ Minutage ▸ Après : 00:05,00 ▸ Appliquer partout
Diaporama ▸ (case) Utiliser les minutages</pre>
<div class="warn">Mode borne + boucle + minutages = présentation autonome. Sans minutage, une borne resterait figée sur la première diapo.</div>
<h3>3. Le mode kiosque (borne)</h3>
<p>En mode <strong>Visité sur une borne</strong>, le diaporama s'affiche en plein écran, se répète en boucle et ignore les clics/touches d'avancement classiques : seuls les liens et boutons d'action (jour 16) permettent de naviguer. Idéal pour un hall d'accueil ou un salon.</p>
<h3>4. Le Zoom : un sommaire vivant</h3>
<p>Le <strong>Zoom</strong> insère une vignette cliquable qui, en diaporama, effectue un <strong>zoom animé</strong> vers une diapo, une section ou une sélection de diapos. Trois variantes :</p>
<pre class="pseudo">Insertion ▸ Liens ▸ Zoom ▸
   Zoom de résumé   = crée une diapo sommaire à partir des sections
   Zoom de section  = vignette vers une section
   Zoom de diapositive = vignette vers une diapo précise</pre>
<div class="tip">Le Zoom résumé est apparu dans PowerPoint 2019 et Microsoft 365. Il est ABSENT de 2016 et antérieurs. En 2019/365, il construit automatiquement un menu visuel à partir de tes sections.</div>
<h3>5. Zoom résumé et navigation</h3>
<p>Le <strong>Zoom de résumé</strong> génère une diapo-menu : chaque vignette lance sa section, puis on revient automatiquement au sommaire à la fin de la section. C'est une navigation non linéaire élégante, sans construire de liens à la main.</p>
<pre class="pseudo">Outils Zoom ▸ Revenir à la diapositive de zoom (cocher)     // retour auto au sommaire
Outils Zoom ▸ Transition Morphose (option de zoom fluide)</pre>
<h3>6. Design et versions</h3>
<p>Un diaporama autonome doit être lisible sans commentateur : peu de texte par diapo, un rythme adapté (assez de temps pour lire), une boucle propre. Le Zoom rend un long deck navigable d'un coup d'oeil. Rappel des versions : Zoom résumé/section/diapositive = 2019 et 365 ; le mode borne et l'avancement automatique existent partout.</p>`,
  exercises: [
    { type: "qcm", q: "Que définit Configurer le diaporama ?", opts: ["Le thème", "Comment le diaporama se joue (intervenant, personne, borne)", "La police", "Le nombre de diapos"], a: 1, exp: "On y choisit le type de diffusion et les options de boucle/minutage." },
    { type: "qcm", q: "Que fait le mode Visité sur une borne ?", opts: ["Ouvre en fenêtre", "Plein écran en boucle, ignore l'avancement clavier classique", "Imprime", "Compresse"], a: 1, exp: "Le kiosque tourne seul ; seuls liens/boutons naviguent." },
    { type: "vf", q: "Sans minutage, une borne resterait figée sur la première diapo.", a: true, exp: "Il faut des minutages (ou transitions auto) pour avancer seul." },
    { type: "qcm", q: "Comment faire avancer les diapos automatiquement ?", opts: ["Au clic", "Transitions ▸ Minutage ▸ Après : délai ▸ Appliquer partout", "Insertion ▸ Objet", "Changer le thème"], a: 1, exp: "Le délai Après avance sans clic ; Appliquer partout le diffuse." },
    { type: "qcm", q: "Qu'est-ce que le Zoom dans PowerPoint ?", opts: ["Un agrandissement d'image", "Une vignette cliquable qui zoome vers une diapo/section/sélection", "Une transition sonore", "Un thème"], a: 1, exp: "Le Zoom crée une navigation animée par vignettes." },
    { type: "qcm", q: "Que fait le Zoom de résumé ?", opts: ["Compresse", "Crée une diapo-sommaire à partir des sections", "Supprime des diapos", "Ajoute un son"], a: 1, exp: "Il génère un menu visuel automatique depuis les sections." },
    { type: "vf", q: "Le Zoom résumé existe depuis PowerPoint 2019 et 365 (absent de 2016).", a: true, exp: "C'est une fonction récente, non disponible avant 2019." },
    { type: "qcm", q: "Où se trouve la commande Zoom ?", opts: ["Transitions", "Insertion ▸ Liens ▸ Zoom", "Révision", "Création"], a: 1, exp: "Le Zoom est dans le groupe Liens de l'onglet Insertion." },
    { type: "qcm", q: "Que fait Revenir à la diapositive de zoom ?", opts: ["Rien", "Ramène automatiquement au sommaire à la fin d'une section", "Supprime la section", "Compresse"], a: 1, exp: "Le retour auto au sommaire fluidifie la navigation." },
    { type: "vf", q: "Le Zoom peut utiliser la Morphose pour un effet fluide.", a: true, exp: "Une option de zoom fluide s'appuie sur Morph." },
    { type: "qcm", q: "Pour une borne autonome, quelle combinaison ?", opts: ["Au clic seulement", "Mode borne + boucle + minutages", "Un PDF", "Sans minutage"], a: 1, exp: "Kiosque + boucle + minutages = présentation autonome." },
    { type: "qcm", q: "Sur quoi s'appuie le Zoom de résumé pour bâtir son menu ?", opts: ["Les couleurs", "Les sections du deck", "Les notes", "Les animations"], a: 1, exp: "Il construit le sommaire à partir des sections." },
    { type: "vf", q: "Un diaporama autonome peut contenir des paragraphes denses sans problème.", a: false, exp: "Sans commentateur, il faut peu de texte et un rythme lisible." },
    { type: "qcm", q: "Comment naviguer dans un diaporama en mode borne ?", opts: ["Avec les flèches classiques", "Via les liens et boutons d'action (jour 16)", "Impossible", "Avec la souris seulement pour quitter"], a: 1, exp: "Le kiosque ignore l'avancement clavier ; on utilise liens/boutons." },
    { type: "qcm", q: "Le mode borne et l'avancement automatique sont-ils disponibles en 2019 ?", opts: ["Non", "Oui, ils existent dans toutes ces versions", "365 seulement", "2013 seulement"], a: 1, exp: "Contrairement au Zoom résumé, ces fonctions sont anciennes." }
  ],
  final: {
    title: "Exercice final — Un hall d'accueil en autonomie + sommaire",
    intro: `<p>Tu prépares un écran d'accueil qui tourne seul en boucle (5 s par diapo) et, en complément, un sommaire cliquable (Zoom résumé) construit à partir des sections pour une version pilotée par un hôte. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Pour l'avancement seul à 5 s, on règle…", opts: ["Au clic", "Transitions ▸ Après 00:05 ▸ Appliquer partout", "Un PDF", "Rien"], a: 1, exp: "Le délai Après avance automatiquement chaque diapo." },
      { type: "qcm", q: "Pour la boucle plein écran sans dérapage, on choisit…", opts: ["Présenté par un intervenant", "Visité sur une borne + En continu jusqu'à Échap", "Visité par une personne", "Impression"], a: 1, exp: "Le mode borne en boucle convient à un hall d'accueil." },
      { type: "vf", q: "Le Zoom résumé se construit à partir des sections du deck.", a: true, exp: "Il génère un menu visuel depuis les sections." },
      { type: "qcm", q: "Pour revenir au sommaire à la fin de chaque section, on coche…", opts: ["Compresser", "Revenir à la diapositive de zoom", "Au clic", "Boucle"], a: 1, exp: "Cette option ramène automatiquement au menu." },
      { type: "qcm", q: "Le Zoom résumé n'est pas disponible en…", opts: ["365", "2019", "2016 et antérieurs", "2021"], a: 2, exp: "Il est apparu en 2019 ; absent de 2016 et avant." }
    ],
    solution: `<p>Mise en place :</p>
<pre class="pseudo">1  Créer des sections (clic droit entre diapos ▸ Ajouter une section)
2  Version autonome : Transitions ▸ Après 00:05 ▸ Appliquer partout
3  Diaporama ▸ Configurer ▸ Visité sur une borne + En continu jusqu'à Échap + Utiliser les minutages
4  Version pilotée : Insertion ▸ Liens ▸ Zoom ▸ Zoom de résumé ▸ cocher les sections
5  Outils Zoom ▸ cocher Revenir à la diapositive de zoom (retour auto au menu)
6  (option) activer l'effet de zoom fluide (Morphose)
7  Maj + F5 : vérifier la boucle autonome et la navigation par le sommaire</pre>
<p>L'accueil tourne seul en boucle, et un hôte peut aussi naviguer via le sommaire cliquable.</p>`
  }
};
</script>
