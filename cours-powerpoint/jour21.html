var DAY = {

  title: "Projet final : un pitch deck complet",
  subtitle: "Assembler tout le cours en une présentation professionnelle.",
  theory: `
<h3>1. Qu'est-ce qu'un pitch deck ?</h3>
<p>Un <strong>pitch deck</strong> est une présentation courte (10-15 diapos) conçue pour convaincre : investisseurs, clients, direction. Il raconte une histoire claire — un problème, une solution, une preuve, une demande — avec un design impeccable. C'est le terrain idéal pour mobiliser TOUT ce que le cours a couvert.</p>
<h3>2. La structure narrative classique</h3>
<pre class="pseudo">1  Couverture (titre + accroche)
2  Problème (la douleur du client)
3  Solution (ta réponse)
4  Produit / démo
5  Marché (taille, cible)
6  Modèle économique
7  Traction / preuves (chiffres)
8  Concurrence (positionnement)
9  Équipe
10 Demande / appel à l'action</pre>
<div class="tip">Une diapo = une idée. Le pitch se raconte : le design soutient le récit, il ne le remplace pas. Chaque diapo doit répondre à « et alors ? ».</div>
<h3>3. Le socle : masque, thème, dispositions</h3>
<p>Avant de composer, pose les fondations (jours 2-4) : un <strong>masque</strong> propre, un <strong>thème</strong> de marque (2-3 couleurs, 2 polices), des <strong>dispositions</strong> réutilisables (couverture, section, contenu, chiffre clé). Ainsi tout le deck est cohérent et modifiable d'un point.</p>
<h3>4. La couche design</h3>
<ul>
<li><strong>Hiérarchie visuelle</strong> (jour 5) : un message dominant par diapo.</li>
<li><strong>Images pro</strong> (jour 6) et <strong>formes/icônes</strong> (jour 7) cohérentes.</li>
<li><strong>Données</strong> : SmartArt (jour 8), graphiques épurés (jour 9), tableaux élégants (jour 10) — la traction en un coup d'oeil.</li>
</ul>
<h3>5. La couche mouvement, avec retenue</h3>
<p><strong>Transitions</strong> sobres et cohérentes (jour 11), <strong>animations</strong> fonctionnelles (jour 12), <strong>Morphose</strong> pour un zoom ou un avant/après marquant (jour 13). Jamais d'effet gratuit : le mouvement sert le récit.</p>
<div class="warn">Un pitch surchargé d'animations paraît amateur. La sobriété inspire confiance. En cas de doute, retire.</div>
<h3>6. Livraison et versions</h3>
<p>Répète en <strong>mode Présentateur</strong> (jour 17), prépare une navigation par <strong>Zoom résumé</strong> si tu adaptes en direct (jour 18), et livre les bons formats (jour 20) : PDF pour l'envoi, vidéo pour l'autonome. Vérifie l'<strong>accessibilité</strong> et nettoie avec l'Inspecteur de document. Rappel : Morph et Zoom résumé exigent 2019/365 ; prévois un repli (Fondu, sommaire par liens) si tu diffuses vers d'anciens postes.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un pitch deck ?", opts: ["Un long rapport", "Une présentation courte conçue pour convaincre", "Un tableur", "Un modèle de couleurs"], a: 1, exp: "Le pitch deck raconte une histoire pour convaincre en peu de diapos." },
    { type: "qcm", q: "Quel est le bon principe par diapo ?", opts: ["Le plus d'infos possible", "Une diapo = une idée", "Aucun texte", "Toujours un graphique"], a: 1, exp: "Une idée dominante par diapo garde le récit clair." },
    { type: "vf", q: "Le design d'un pitch doit soutenir le récit, pas le remplacer.", a: true, exp: "Le pitch se raconte ; le design appuie l'histoire." },
    { type: "qcm", q: "Que pose-t-on AVANT de composer le contenu ?", opts: ["Les animations", "Le socle : masque, thème, dispositions", "La vidéo d'export", "Les commentaires"], a: 1, exp: "Les fondations (jours 2-4) garantissent cohérence et modifiabilité." },
    { type: "qcm", q: "Combien de couleurs et polices pour un thème pro ?", opts: ["10 couleurs, 5 polices", "2-3 couleurs et 2 polices", "1 couleur, 1 police obligatoire", "Autant qu'on veut"], a: 1, exp: "Une palette et une typo limitées font le rendu professionnel." },
    { type: "qcm", q: "Pour montrer la traction (chiffres clés), on privilégie…", opts: ["Un paragraphe dense", "Un graphique épuré qui clame le message", "Une animation clignotante", "Rien"], a: 1, exp: "Un graphique sobre rend la preuve immédiate (jour 9)." },
    { type: "vf", q: "Un pitch surchargé d'animations inspire davantage confiance.", a: false, exp: "La sobriété inspire confiance ; l'excès paraît amateur." },
    { type: "qcm", q: "Quand la Morphose est-elle pertinente dans un pitch ?", opts: ["Sur chaque diapo", "Pour un zoom ou un avant/après marquant", "Jamais", "Pour imprimer"], a: 1, exp: "Morph sert un moment narratif précis, pas la décoration." },
    { type: "qcm", q: "Quelle diapo répond au problème du client ?", opts: ["L'équipe", "La diapo Problème (la douleur)", "La couverture", "La demande"], a: 1, exp: "La diapo Problème pose la douleur à résoudre." },
    { type: "vf", q: "Répéter en mode Présentateur aide à caler le récit et le temps.", a: true, exp: "Notes et chrono facilitent une prestation maîtrisée (jour 17)." },
    { type: "qcm", q: "Pour envoyer le pitch par mail, quel format ?", opts: ["PPSX uniquement", "PDF", "PNG par diapo", "Aucun"], a: 1, exp: "Le PDF est universel et léger pour l'envoi (jour 20)." },
    { type: "qcm", q: "Pour ceux qui n'ont pas assisté, quel format autonome ?", opts: ["Vidéo MP4 avec narration", "Un tableau", "Un thème", "Un lien"], a: 0, exp: "La vidéo autonome rejoue animations et voix." },
    { type: "vf", q: "Morph et Zoom résumé exigent PowerPoint 2019 ou 365.", a: true, exp: "Sur des postes plus anciens, prévoir un repli (Fondu, liens)." },

    { type: "qcm", q: "Que doit satisfaire chaque diapo du pitch ?", opts: ["Contenir un graphique", "Répondre à la question et alors ?", "Être animée", "Avoir un fond coloré"], a: 1, exp: "Chaque diapo doit justifier sa présence dans le récit." }
  ],

    questions: [

      { type: "qcm", q: "Pour la diapo Traction (croissance du chiffre d'affaires), quel visuel ?", opts: ["Un camembert à 10 parts", "Une courbe épurée montrant la hausse", "Un paragraphe", "Une image décorative"], a: 1, exp: "Une courbe sobre montre l'évolution en un coup d'oeil." },

      { type: "qcm", q: "Comment garantir une hiérarchie claire sur chaque diapo ?", opts: ["Tout en gras", "Un message dominant + tailles/couleur cohérentes (thème)", "Beaucoup de couleurs", "Aucun titre"], a: 1, exp: "La hiérarchie visuelle guide l'oeil (jour 5)." },
      { type: "qcm", q: "Pour livrer à la fois un envoi et une version autonome, on exporte en…", opts: ["PDF et vidéo MP4", "PNG seulement", "PPSX seulement", "Rien"], a: 0, exp: "PDF pour l'envoi, MP4 pour l'autonome (jour 20)." }
    ],
    solution: `<p>Démarche complète :</p>
<pre class="pseudo">1  Socle : masque propre + thème (2-3 couleurs, 2 polices) + dispositions (couverture, section, chiffre clé)
2  Structure narrative : couverture, problème, solution, produit, marché, modèle, traction, concurrence, équipe, demande
3  Design : une idée par diapo, hiérarchie visuelle, images pro, icônes cohérentes
4  Données : graphique de traction épuré, tableau comparatif sobre, éventuel SmartArt de processus
5  Mouvement : Fondu cohérent partout, une Morphose (zoom produit), animations fonctionnelles
6  Répétition : mode Présentateur + minutage ; option Zoom résumé pour adapter en direct
7  Livraison : Vérifier l'accessibilité ▸ Inspecter le document ▸ Export PDF + Export vidéo MP4
8  Prévoir un repli pour postes anciens (Fondu au lieu de Morph, sommaire par liens)</pre>
<p>Le pitch raconte une histoire claire, avec un design cohérent et des livrables prêts pour chaque usage.</p>`
  }
};
</script>
