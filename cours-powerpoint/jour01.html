var DAY = {
  num: 1,
  title: "Personnaliser l'espace de travail",
  subtitle: "Régler PowerPoint pour travailler vite et bien avant de créer.",
  theory: `
<h3>1. Pourquoi régler son environnement d'abord</h3>
<p>Tu connais déjà les bases. Ce cours vise le <strong>design</strong> et l'<strong>efficacité</strong> : un présentateur qui maîtrise son outil passe plus de temps sur le message et moins à chercher un bouton. On appelle <strong>espace de travail</strong> l'ensemble des zones de l'écran : le <strong>ruban</strong> (la grande barre d'onglets en haut), le <strong>volet des miniatures</strong> (à gauche), la <strong>zone de diapositive</strong> (au centre) et la <strong>barre d'état</strong> (en bas).</p>
<div class="tip">Le meilleur réglage est celui qui rend tes gestes les plus fréquents accessibles en un clic ou un raccourci. Investis 15 minutes une fois, gagne des heures ensuite.</div>
<h3>2. La barre d'outils Accès rapide (BAR)</h3>
<p>La <strong>barre d'outils Accès rapide</strong> (BAR, en anglais QAT) est la mini-barre de boutons toujours visible, indépendante de l'onglet ouvert. On y épingle ses commandes favorites (Aligner, Répéter, Reproduire la mise en forme…).</p>
<pre class="pseudo">Fichier ▸ Options ▸ Barre d'outils Accès rapide     // ajouter/retirer/ordonner des commandes
Clic droit sur un bouton du ruban ▸ Ajouter à la barre d'outils Accès rapide
Alt + 1, Alt + 2 …                                   // déclenche le 1er, le 2e bouton de la BAR</pre>
<p>Dans Microsoft 365, la BAR est parfois masquée par défaut : clique sur la petite flèche en bout de ruban puis <em>Afficher la barre d'outils Accès rapide</em>. En 2021/2019 elle est visible d'origine au-dessus (ou sous) le ruban.</p>
<h3>3. Personnaliser le ruban</h3>
<p>Le <strong>ruban</strong> regroupe les commandes par <strong>onglets</strong> (Accueil, Insertion, Création…) et par <strong>groupes</strong>. Tu peux créer un onglet maison qui rassemble tes outils de mise en forme.</p>
<pre class="pseudo">Fichier ▸ Options ▸ Personnaliser le ruban ▸ Nouvel onglet
Ctrl + F1                                            // réduire / afficher le ruban</pre>
<h3>4. Les repères qui structurent l'oeil</h3>
<p>Un design propre repose sur un <strong>alignement</strong> rigoureux. Active les <strong>repères</strong> : le <strong>quadrillage</strong> (grille de fond), les <strong>repères de dessin</strong> (deux lignes déplaçables) et les <strong>repères actifs</strong> (lignes qui apparaissent quand un objet s'aligne sur un autre).</p>
<pre class="pseudo">Affichage ▸ Afficher ▸ (cocher) Règle, Quadrillage, Repères
Maj + F9   = quadrillage        Alt + F9  = repères de dessin</pre>
<div class="warn">Le quadrillage et les repères ne s'impriment jamais et n'apparaissent pas au diaporama : ce sont de simples aides visuelles.</div>
<h3>5. Options utiles à connaître</h3>
<ul>
<li><strong>Enregistrement automatique</strong> : dans 365 avec un fichier sur OneDrive/SharePoint, l'interrupteur AutoSave sauvegarde en continu. En 2021/2019, règle la récupération auto (Fichier ▸ Options ▸ Enregistrement, toutes les 5 min).</li>
<li><strong>Unités</strong> : centimètres ou pouces se changent dans les réglages régionaux de Windows, pas dans PowerPoint.</li>
<li><strong>Thème de l'interface</strong> : clair, sombre, noir (Fichier ▸ Compte ▸ Thème Office) — confort visuel, sans effet sur les diapos.</li>
</ul>
<h3>6. Trois raccourcis à mémoriser dès aujourd'hui</h3>
<pre class="pseudo">F5           = lancer le diaporama depuis le début
Maj + F5     = lancer depuis la diapositive courante
Ctrl + M     = nouvelle diapositive</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert la barre d'outils Accès rapide (BAR) ?", opts: ["À changer de thème de diapositive", "À garder ses commandes favorites accessibles quel que soit l'onglet ouvert", "À lancer le diaporama uniquement", "À imprimer plus vite"], a: 1, exp: "La BAR reste visible en permanence, indépendamment de l'onglet actif." },
    { type: "qcm", q: "Quel raccourci lance le diaporama DEPUIS LA DIAPOSITIVE COURANTE ?", opts: ["F5", "Maj + F5", "Ctrl + F5", "Alt + F5"], a: 1, exp: "F5 démarre au début ; Maj + F5 démarre à la diapo affichée." },
    { type: "vf", q: "Le quadrillage et les repères apparaissent pendant le diaporama projeté au public.", a: false, exp: "Ce sont des aides d'édition : jamais visibles au diaporama ni à l'impression." },
    { type: "qcm", q: "Comment ajouter rapidement un bouton du ruban à la BAR ?", opts: ["Double-clic sur le bouton", "Clic droit sur le bouton ▸ Ajouter à la barre d'outils Accès rapide", "Glisser le bouton hors de la fenêtre", "Impossible sans coder"], a: 1, exp: "Le clic droit sur n'importe quelle commande propose de l'épingler à la BAR." },
    { type: "qcm", q: "Quel raccourci réduit ou réaffiche le ruban ?", opts: ["Ctrl + F1", "Ctrl + R", "F11", "Alt + F1"], a: 0, exp: "Ctrl + F1 bascule l'affichage du ruban pour gagner de la place." },
    { type: "vf", q: "Les repères actifs apparaissent quand on déplace un objet et qu'il s'aligne avec un autre.", a: true, exp: "Ces lignes rouges/pointillées facilitent un alignement pixel-parfait." },
    { type: "qcm", q: "Où change-t-on l'unité de mesure (cm ou pouces) ?", opts: ["Dans les Options de PowerPoint", "Dans les réglages régionaux de Windows", "Dans le menu Création", "Dans la barre d'état"], a: 1, exp: "PowerPoint suit les paramètres régionaux du système d'exploitation." },
    { type: "qcm", q: "Que fait Alt + 1 dans PowerPoint ?", opts: ["Ouvre l'onglet Insertion", "Déclenche le premier bouton de la barre d'outils Accès rapide", "Change de diapositive", "Insère un titre"], a: 1, exp: "Alt + chiffre active la commande correspondante de la BAR, dans l'ordre." },
    { type: "vf", q: "Dans Microsoft 365 sur un fichier OneDrive, l'enregistrement automatique (AutoSave) est disponible en continu.", a: true, exp: "AutoSave nécessite un fichier stocké sur OneDrive ou SharePoint." },
    { type: "qcm", q: "Quel raccourci crée une nouvelle diapositive ?", opts: ["Ctrl + N", "Ctrl + M", "Ctrl + D", "Ctrl + T"], a: 1, exp: "Ctrl + M ajoute une diapositive ; Ctrl + N ouvre une nouvelle présentation." },
    { type: "qcm", q: "Pourquoi régler son espace de travail avant de concevoir ?", opts: ["Pour changer la police par défaut", "Pour concentrer son temps sur le message plutôt que sur la recherche de boutons", "Parce que c'est obligatoire", "Pour réduire la taille du fichier"], a: 1, exp: "Un environnement optimisé = plus de temps pour le design et le contenu." },
    { type: "vf", q: "En Office 2021/2019, la barre d'outils Accès rapide est visible par défaut.", a: true, exp: "En 365 elle peut être masquée d'origine ; en 2021/2019 elle est affichée." },
    { type: "qcm", q: "Quel menu permet de créer un onglet de ruban personnalisé ?", opts: ["Affichage ▸ Masque", "Fichier ▸ Options ▸ Personnaliser le ruban", "Création ▸ Variantes", "Insertion ▸ Compléments"], a: 1, exp: "Personnaliser le ruban permet d'ajouter onglets, groupes et commandes." },
    { type: "qcm", q: "Que fait Maj + F9 ?", opts: ["Affiche/masque le quadrillage", "Lance le diaporama", "Enregistre le fichier", "Ouvre le masque"], a: 0, exp: "Maj + F9 bascule le quadrillage ; Alt + F9 bascule les repères de dessin." },
    { type: "vf", q: "Changer le thème de l'interface (clair/sombre) modifie l'apparence des diapositives projetées.", a: false, exp: "Le thème Office ne touche que l'interface d'édition, pas le rendu des diapos." }
  ],
  final: {
    title: "Exercice final — Configurer un poste de travail efficace",
    intro: `<p>Tu arrives sur un poste PowerPoint neuf, réglé par défaut. Tu veux préparer un environnement propice à un travail de design rapide et précis. On raisonne sur les cinq réglages clés vus aujourd'hui.</p>`,
    questions: [
      { type: "qcm", q: "Premier réflexe pour aligner proprement les objets : que faut-il activer ?", opts: ["Le mode Lecture", "Les repères et le quadrillage (Affichage ▸ Afficher)", "L'AutoSave", "Le mode Présentateur"], a: 1, exp: "Les repères garantissent des alignements cohérents dès le départ." },
      { type: "qcm", q: "Tu utilises souvent Aligner et Reproduire la mise en forme. Où les placer ?", opts: ["Dans un dossier Windows", "Dans la barre d'outils Accès rapide", "Dans les notes", "Dans le masque"], a: 1, exp: "La BAR rend ces commandes fréquentes disponibles en un clic partout." },
      { type: "vf", q: "Sur un fichier OneDrive en 365, activer AutoSave évite les pertes en cas de plantage.", a: true, exp: "L'enregistrement continu sécurise le travail sans intervention." },
      { type: "qcm", q: "Tu veux plus d'espace vertical pour la diapositive. Que fais-tu ?", opts: ["Ctrl + F1 pour réduire le ruban", "F5", "Supprimer le volet des miniatures", "Fermer le fichier"], a: 0, exp: "Réduire le ruban libère de la hauteur d'écran pour la zone de travail." },
      { type: "qcm", q: "Tu répètes le test du diaporama sur la diapo en cours de conception. Quel raccourci ?", opts: ["F5", "Maj + F5", "Ctrl + M", "Échap"], a: 1, exp: "Maj + F5 démarre le diaporama sur la diapositive courante." }
    ],
    solution: `<p>Marche à suivre recommandée sur un poste neuf :</p>
<pre class="pseudo">1  Affichage ▸ Afficher ▸ cocher Règle + Repères (+ Quadrillage au besoin)
2  Clic droit sur Aligner, Reproduire la mise en forme… ▸ Ajouter à la BAR
3  Fichier ▸ Options ▸ Enregistrement ▸ récupération auto à 5 min (365 : AutoSave ON sur OneDrive)
4  Ctrl + F1 pour un ruban réduit si l'écran est petit
5  Mémoriser F5 / Maj + F5 / Ctrl + M</pre>
<p>Un environnement bien réglé se remarque à ceci : tu ne cherches plus tes outils, tu penses ton message.</p>`
  }
};
</script>
