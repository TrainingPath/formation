<script>
var DAY = {
  num: 15,
  title: "Multimédia : audio, vidéo, enregistrement",
  subtitle: "Intégrer son et image animée sans alourdir ni faire planter.",
  theory: `
<h3>1. Insérer une vidéo</h3>
<p>Une <strong>vidéo</strong> peut être <strong>incorporée</strong> (le fichier vit dans le .pptx, plus lourd mais autonome) ou <strong>liée</strong> (le .pptx pointe vers un fichier externe, léger mais fragile si on déplace le fichier). On peut aussi insérer une vidéo <strong>en ligne</strong> (YouTube…), qui exige une connexion Internet à la lecture.</p>
<pre class="pseudo">Insertion ▸ Média ▸ Vidéo ▸ Cet appareil… / Vidéos en ligne
Lecture (vidéo) ▸ Démarrer : Au clic / Automatiquement / En séquence de clics</pre>
<div class="warn">La vidéo LIÉE casse si tu envoies le .pptx sans le fichier vidéo. Pour une présentation nomade, incorpore la vidéo (ou utilise Fichier ▸ Informations ▸ Compresser les médias).</div>
<h3>2. Régler la lecture vidéo</h3>
<pre class="pseudo">Lecture ▸ Découper la vidéo         // garder un extrait (début/fin)
Lecture ▸ En boucle jusqu'à l'arrêt / Rembobiner après lecture
Lecture ▸ Volume ; Format vidéo ▸ image d'affiche (poster)</pre>
<p>L'<strong>image d'affiche</strong> (poster frame) est la vignette figée montrée avant la lecture : choisis une image parlante plutôt qu'un écran noir.</p>
<h3>3. Insérer et gérer l'audio</h3>
<pre class="pseudo">Insertion ▸ Média ▸ Audio ▸ Audio sur mon PC… / Enregistrer l'audio
Lecture (audio) ▸ Démarrer : Automatiquement / Au clic
Lecture ▸ Lire sur l'ensemble des diapositives ; Masquer pendant la présentation</pre>
<p>Pour une musique de fond, coche <strong>Lire sur l'ensemble des diapositives</strong> et <strong>Masquer pendant la présentation</strong> (l'icône haut-parleur disparaît).</p>
<h3>4. Compresser les médias</h3>
<p>Les médias gonflent vite le fichier. La <strong>compression des médias</strong> réduit le poids tout en conservant une qualité acceptable pour la projection.</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Compresser les médias ▸ Full HD / HD / Standard</pre>
<h3>5. Enregistrer un diaporama (narration + minutage)</h3>
<p>L'<strong>enregistrement du diaporama</strong> capture ta narration audio, tes minutages et tes annotations, diapo par diapo. Le résultat peut être exporté en vidéo (jour 20) : idéal pour une présentation autonome à distribuer.</p>
<pre class="pseudo">Diaporama ▸ Enregistrer le diaporama ▸ À partir du début / de la diapo courante</pre>
<div class="tip">En Microsoft 365, l'enregistreur intègre webcam, pointeur laser, encre et surligneur, avec un studio d'enregistrement modernisé. En 2021/2019, l'enregistrement existe aussi mais avec une interface plus simple.</div>
<h3>6. Sous-titres et accessibilité</h3>
<p>Les <strong>sous-titres codés</strong> rendent une vidéo accessible ; on peut aussi insérer un fichier de sous-titres. Microsoft 365 propose en plus des <strong>sous-titres en direct</strong> (Live Captions) générés à la volée pendant la présentation, absents de 2021/2019.</p>
<pre class="pseudo">Lecture (vidéo) ▸ Insérer des sous-titres codés
Diaporama ▸ (365) Toujours utiliser les sous-titres         // sous-titres en direct</pre>`,
  exercises: [
    { type: "qcm", q: "Différence entre vidéo incorporée et liée ?", opts: ["Aucune", "Incorporée = dans le .pptx (lourd, autonome) ; liée = pointe un fichier externe (léger, fragile)", "La liée est plus lourde", "L'incorporée exige Internet"], a: 1, exp: "Incorporée = autonome mais lourde ; liée = légère mais casse si le fichier bouge." },
    { type: "vf", q: "Une vidéo liée casse si on envoie le .pptx sans le fichier vidéo.", a: true, exp: "Le lien pointe vers un fichier absent : pour du nomade, on incorpore." },
    { type: "qcm", q: "Qu'exige une vidéo en ligne (YouTube) à la lecture ?", opts: ["Rien", "Une connexion Internet", "Un thème récent", "Un abonnement PowerPoint"], a: 1, exp: "La vidéo en ligne se lit en streaming : Internet requis." },
    { type: "qcm", q: "À quoi sert l'image d'affiche (poster frame) ?", opts: ["À compresser", "À montrer une vignette parlante avant la lecture", "À couper le son", "À changer le thème"], a: 1, exp: "Elle remplace l'écran noir par une image d'attente pertinente." },
    { type: "qcm", q: "Comment garder seulement un extrait d'une vidéo ?", opts: ["La supprimer", "Lecture ▸ Découper la vidéo", "Compresser", "Changer de format"], a: 1, exp: "Découper la vidéo fixe un début et une fin." },
    { type: "vf", q: "Pour une musique de fond, on coche Lire sur l'ensemble des diapositives et Masquer pendant la présentation.", a: true, exp: "La musique continue et l'icône haut-parleur disparaît." },
    { type: "qcm", q: "Où compresser les médias d'une présentation ?", opts: ["Transitions", "Fichier ▸ Informations ▸ Compresser les médias", "Insertion ▸ Objet", "Révision"], a: 1, exp: "La compression des médias réduit le poids du fichier." },
    { type: "qcm", q: "Que capture l'enregistrement du diaporama ?", opts: ["Seulement le son", "Narration audio, minutages et annotations diapo par diapo", "Uniquement la vidéo", "Le thème"], a: 1, exp: "Il enregistre voix, timing et encre pour une version autonome." },
    { type: "vf", q: "Un diaporama enregistré peut être exporté en vidéo.", a: true, exp: "On produit ainsi une présentation autonome à distribuer (jour 20)." },
    { type: "qcm", q: "À quoi servent les sous-titres codés d'une vidéo ?", opts: ["À la compresser", "À la rendre accessible", "À l'accélérer", "À la colorer"], a: 1, exp: "Les sous-titres améliorent l'accessibilité." },
    { type: "qcm", q: "Les sous-titres EN DIRECT (Live Captions) pendant la présentation sont…", opts: ["Dans toutes les versions", "Propres à Microsoft 365 (absents de 2021/2019)", "Impossibles", "Réservés à 2019"], a: 1, exp: "Les Live Captions sont une nouveauté 365." },
    { type: "vf", q: "Compresser les médias est utile car ils gonflent vite le fichier.", a: true, exp: "Audio et vidéo alourdissent rapidement le .pptx." },
    { type: "qcm", q: "Comment démarrer une vidéo sans clic ?", opts: ["Impossible", "Lecture ▸ Démarrer : Automatiquement", "Transitions", "F5"], a: 1, exp: "Le réglage Automatiquement lance la lecture à l'arrivée sur la diapo." },
    { type: "qcm", q: "En 365, l'enregistreur de diaporama intègre en plus…", opts: ["Rien de neuf", "Webcam, pointeur laser, encre, studio modernisé", "Un tableur", "Un thème"], a: 1, exp: "Le studio 365 est plus riche que l'enregistreur de 2021/2019." },
    { type: "vf", q: "Insérer une vidéo en boucle est impossible dans PowerPoint.", a: false, exp: "Lecture ▸ En boucle jusqu'à l'arrêt fait tourner la vidéo en continu." }
  ],
  final: {
    title: "Exercice final — Un stand en lecture autonome",
    intro: `<p>Tu prépares une présentation pour un stand : une vidéo de démonstration doit se lancer automatiquement en boucle, une musique douce doit couvrir tout le diaporama, et le fichier doit rester transportable sur une clé USB. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Pour que la vidéo tourne en continu, on règle…", opts: ["Démarrer au clic", "En boucle jusqu'à l'arrêt + Démarrer automatiquement", "Découper", "Compresser seulement"], a: 1, exp: "Boucle + démarrage auto assurent une lecture continue." },
      { type: "qcm", q: "Pour une musique sur tout le diaporama, on coche…", opts: ["Au clic", "Lire sur l'ensemble des diapositives + Masquer", "Découper", "En ligne"], a: 1, exp: "La musique couvre toutes les diapos, icône masquée." },
      { type: "vf", q: "Pour la clé USB, mieux vaut incorporer la vidéo que la lier.", a: true, exp: "Une vidéo liée casserait sur un autre poste ; on incorpore." },
      { type: "qcm", q: "Pour éviter un fichier énorme sur la clé, on…", opts: ["Ajoute des animations", "Compresse les médias (Fichier ▸ Informations)", "Change le thème", "Supprime la musique"], a: 1, exp: "La compression des médias allège le fichier transportable." },
      { type: "qcm", q: "Pour qu'aucune intervention ne soit nécessaire au stand, on prépare aussi…", opts: ["Une impression", "Un avancement automatique des diapos (jour 18)", "Un mot de passe", "Un graphique"], a: 1, exp: "Le diaporama automatique complète le dispositif autonome." }
    ],
    solution: `<p>Préparation du stand autonome :</p>
<pre class="pseudo">1  Insertion ▸ Média ▸ Vidéo ▸ Cet appareil (incorporée, pas liée)
2  Lecture ▸ Démarrer : Automatiquement + En boucle jusqu'à l'arrêt
3  Insertion ▸ Média ▸ Audio ▸ musique ▸ Lecture ▸ Lire sur l'ensemble des diapositives + Masquer + En boucle
4  Fichier ▸ Informations ▸ Compresser les médias ▸ HD (ou Standard)
5  (jour 18) Diaporama ▸ Configurer ▸ Visité sur une borne + minutages auto
6  Tester sur un autre poste que celui de création
7  Copier le .pptx (avec médias incorporés) sur la clé USB</pre>
<p>Le stand tourne seul, son et vidéo compris, sur n'importe quel poste.</p>`
  }
};
</script>
