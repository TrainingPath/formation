<script>
var DAY = {
  num: 20,
  title: "Exporter : PDF, vidéo, images, accessibilité",
  subtitle: "Livrer le bon format pour le bon usage, et rendre accessible.",
  theory: `
<h3>1. Choisir le format selon l'usage</h3>
<p>Une présentation peut se livrer sous plusieurs formes. Le bon format dépend de l'usage : diffusion papier, envoi par mail, publication autonome, réutilisation d'un visuel.</p>
<ul>
<li><strong>PDF</strong> : lecture universelle, mise en page figée, léger. Idéal pour envoyer ou imprimer.</li>
<li><strong>Vidéo (MP4)</strong> : présentation autonome qui se lit partout, avec animations, transitions et narration.</li>
<li><strong>Images (PNG/JPG)</strong> : extraire une diapo comme visuel.</li>
<li><strong>Diaporama (.ppsx)</strong> : s'ouvre directement en plein écran.</li>
</ul>
<h3>2. Exporter en PDF</h3>
<pre class="pseudo">Fichier ▸ Exporter ▸ Créer PDF/XPS         // ou Enregistrer sous ▸ PDF
Options : diapos / documents (2-6 par page) / plan ; inclure les commentaires</pre>
<div class="tip">Pour un support à distribuer, exporte en mode Documents (plusieurs diapos + lignes de notes par page). Les animations n'existent pas en PDF : chaque diapo est figée à son état final.</div>
<h3>3. Exporter en vidéo</h3>
<p>La vidéo <strong>MP4</strong> intègre transitions, animations, minutages et narration. On choisit la résolution et si l'on utilise les minutages/narrations enregistrés.</p>
<pre class="pseudo">Fichier ▸ Exporter ▸ Créer une vidéo ▸
   Résolution : Ultra HD (4K) / Full HD / HD / Standard
   Utiliser les minutages et narrations enregistrés
   Durée par diapo (si aucun minutage)</pre>
<div class="warn">L'Ultra HD (4K) à l'export existe en 365 et 2019 ; il peut être absent des versions plus anciennes. Sans minutage, règle une durée par diapo, sinon la vidéo défilera trop vite.</div>
<h3>4. Exporter des images</h3>
<pre class="pseudo">Fichier ▸ Exporter ▸ Modifier le type de fichier ▸ PNG / JPG
(choisir : Toutes les diapos / Diapo courante)</pre>
<p>Le <strong>PNG</strong> conserve la netteté (idéal texte/formes) ; le <strong>JPG</strong> est plus léger (photos). Pour un visuel réutilisable, le PNG est souvent préférable.</p>
<h3>5. L'accessibilité</h3>
<p>Une présentation <strong>accessible</strong> est utilisable par tous, y compris avec un lecteur d'écran. Points clés : un <strong>texte de remplacement</strong> (alt text) sur les images, un <strong>ordre de lecture</strong> logique, des <strong>titres</strong> de diapo uniques, un <strong>contraste</strong> suffisant.</p>
<pre class="pseudo">Révision ▸ Vérifier l'accessibilité      // liste les problèmes et corrige
Clic droit sur une image ▸ Modifier le texte de remplacement
Accueil ▸ Organiser ▸ Volet Sélection    // vérifier/ordonner l'ordre de lecture</pre>
<div class="tip">En Microsoft 365, le texte de remplacement peut être suggéré automatiquement ; le vérificateur d'accessibilité est plus complet qu'en 2019. On peut aussi ajouter des sous-titres/live captions (jour 15).</div>
<h3>6. Nettoyer avant de livrer</h3>
<p>L'<strong>Inspecteur de document</strong> repère et retire les données cachées (commentaires, métadonnées, notes, contenu hors diapo) avant diffusion externe.</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Vérifier l'absence de problèmes ▸ Inspecter le document
Fichier ▸ Informations ▸ Compresser les médias / Vérifier la compatibilité</pre>`,
  exercises: [
    { type: "qcm", q: "Quel format pour un envoi universel à mise en page figée ?", opts: ["MP4", "PDF", "PNG", "PPSX"], a: 1, exp: "Le PDF se lit partout et fige la mise en page." },
    { type: "qcm", q: "Quel format pour une présentation autonome avec animations et narration ?", opts: ["PDF", "Vidéo MP4", "JPG", "Documents papier"], a: 1, exp: "La vidéo MP4 embarque animations, transitions et voix." },
    { type: "vf", q: "Les animations sont conservées dans un export PDF.", a: false, exp: "Le PDF fige chaque diapo à son état final : pas d'animation." },
    { type: "qcm", q: "Pour un support papier avec plusieurs diapos par page, on exporte en…", opts: ["PDF mode Documents (2-6 par page)", "MP4", "PNG", "PPSX"], a: 0, exp: "Le mode Documents dispose plusieurs diapos et des lignes par page." },
    { type: "qcm", q: "Où choisir la résolution d'une vidéo exportée ?", opts: ["Transitions", "Fichier ▸ Exporter ▸ Créer une vidéo", "Insertion ▸ Objet", "Création"], a: 1, exp: "L'export vidéo propose 4K/Full HD/HD/Standard." },
    { type: "vf", q: "Sans minutage, il faut régler une durée par diapo avant d'exporter en vidéo.", a: true, exp: "Sinon la vidéo défile trop vite, sans respecter le propos." },
    { type: "qcm", q: "Quel format d'image conserve le mieux la netteté du texte et des formes ?", opts: ["JPG", "PNG", "MP4", "PDF"], a: 1, exp: "Le PNG reste net ; le JPG compresse et peut flouter le texte." },
    { type: "qcm", q: "Qu'est-ce que le texte de remplacement (alt text) ?", opts: ["Un sous-titre vidéo", "Une description d'image pour les lecteurs d'écran", "Un thème", "Une transition"], a: 1, exp: "L'alt text rend les images accessibles aux malvoyants." },
    { type: "qcm", q: "Où lister et corriger les problèmes d'accessibilité ?", opts: ["Transitions", "Révision ▸ Vérifier l'accessibilité", "Fichier ▸ Imprimer", "Création"], a: 1, exp: "Le vérificateur signale alt text, contraste, ordre, titres." },
    { type: "vf", q: "Des titres de diapo uniques aident l'accessibilité et la navigation.", a: true, exp: "Les titres structurent la lecture par les technologies d'assistance." },
    { type: "qcm", q: "À quoi sert l'Inspecteur de document ?", opts: ["À animer", "À repérer et retirer données cachées, commentaires, métadonnées", "À changer de thème", "À compresser la vidéo"], a: 1, exp: "Il nettoie le fichier avant diffusion externe." },
    { type: "qcm", q: "Quel format s'ouvre directement en plein écran diaporama ?", opts: ["PDF", "PPSX", "PNG", "JPG"], a: 1, exp: "Le .ppsx lance le diaporama à l'ouverture." },
    { type: "vf", q: "L'export Ultra HD (4K) existe en 365 et 2019.", a: true, exp: "Il peut être absent des versions plus anciennes." },
    { type: "qcm", q: "Où vérifier la compatibilité avec d'anciennes versions ?", opts: ["Transitions", "Fichier ▸ Informations ▸ Vérifier la compatibilité", "Insertion", "Révision ▸ Comparer"], a: 1, exp: "Le vérificateur de compatibilité signale les éléments non pris en charge." },
    { type: "qcm", q: "En Microsoft 365, le texte de remplacement peut être…", opts: ["Interdit", "Suggéré automatiquement", "Impossible à modifier", "Réservé aux vidéos"], a: 1, exp: "365 propose des suggestions d'alt text, plus qu'en 2019." }
  ],
  final: {
    title: "Exercice final — Trois livrables d'une même présentation",
    intro: `<p>D'un même deck, tu dois produire : un support PDF à distribuer, une vidéo autonome pour ceux qui n'ont pas assisté, et un visuel PNG d'une diapo pour un article. Le tout doit être accessible et nettoyé avant envoi.</p>`,
    questions: [
      { type: "qcm", q: "Pour le support à distribuer, quel format et mode ?", opts: ["MP4", "PDF en mode Documents", "PNG", "PPSX"], a: 1, exp: "Le PDF Documents met plusieurs diapos par page." },
      { type: "qcm", q: "Pour la version autonome avec narration, on exporte en…", opts: ["PDF", "Vidéo MP4 (avec minutages/narration)", "JPG", "Papier"], a: 1, exp: "La vidéo MP4 conserve animations et voix." },
      { type: "vf", q: "Un PNG conserve mieux la netteté qu'un JPG pour un visuel avec texte.", a: true, exp: "Le PNG est net ; le JPG peut flouter le texte." },
      { type: "qcm", q: "Avant l'envoi externe, on nettoie avec…", opts: ["Une transition", "L'Inspecteur de document", "Un thème", "Une animation"], a: 1, exp: "L'Inspecteur retire données cachées et métadonnées." },
      { type: "qcm", q: "Pour l'accessibilité, quel réflexe sur les images ?", opts: ["Les compresser", "Ajouter un texte de remplacement (alt text)", "Les animer", "Rien"], a: 1, exp: "L'alt text rend les images compréhensibles aux lecteurs d'écran." }
    ],
    solution: `<p>Production des trois livrables :</p>
<pre class="pseudo">1  Révision ▸ Vérifier l'accessibilité ▸ corriger alt text, contraste, titres, ordre de lecture
2  Fichier ▸ Informations ▸ Inspecter le document ▸ retirer données cachées/commentaires
3  PDF : Fichier ▸ Exporter ▸ Créer PDF/XPS ▸ Options : Documents (3 diapos/page)
4  Vidéo : Fichier ▸ Exporter ▸ Créer une vidéo ▸ Full HD ▸ Utiliser minutages/narrations ▸ Créer
5  Image : Fichier ▸ Exporter ▸ Modifier le type de fichier ▸ PNG ▸ Diapo courante
6  Vérifier chaque livrable avant diffusion</pre>
<p>Un même deck décliné proprement en trois formats, accessible et nettoyé.</p>`
  }
};
</script>
