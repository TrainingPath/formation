<script>
var DAY = {
  num: 17,
  title: "Mode Présentateur, minutage et narration",
  subtitle: "Piloter sa présentation en direct, notes et chrono sous les yeux.",
  theory: `
<h3>1. Le mode Présentateur</h3>
<p>Le <strong>mode Présentateur</strong> affiche sur TON écran ce que le public ne voit pas : la diapo courante, la diapo suivante, tes <strong>notes</strong>, un <strong>minuteur</strong> et des outils. Le public, lui, ne voit que le diaporama plein écran sur le second écran.</p>
<pre class="pseudo">Diaporama ▸ Utiliser le mode Présentateur (cocher)
En diaporama : Alt + F5 lance directement le mode Présentateur (365/2019)
En diaporama : touche ...  ou clic droit ▸ Afficher le mode Présentateur</pre>
<div class="tip">Avec un seul écran, tu peux forcer le mode Présentateur (clic droit en diaporama ▸ Afficher le mode Présentateur) pour t'entraîner avec tes notes.</div>
<h3>2. Les notes du présentateur</h3>
<p>Les <strong>notes</strong> sont un texte attaché à chaque diapo, invisible pour le public. On les saisit sous la diapo (zone Notes) ou en mode Page de commentaires.</p>
<pre class="pseudo">Affichage ▸ Notes             // afficher la zone de notes sous la diapo
Affichage ▸ Modes de présentation ▸ Page de commentaires</pre>
<div class="warn">Les notes ne sont pas un script à lire mot à mot : ce sont des repères (chiffres clés, transitions, anecdotes). Lire ses notes casse le contact avec le public.</div>
<h3>3. Outils en direct</h3>
<p>Pendant le diaporama, plusieurs outils aident : le <strong>pointeur laser</strong>, le <strong>stylet/surligneur</strong> (encre), l'<strong>agrandissement</strong> d'une zone (loupe) et l'écran noir.</p>
<pre class="pseudo">Ctrl + L  = pointeur laser        Ctrl + P = stylo        Ctrl + E = gomme
Touche N ou . = écran noir        Touche B = écran blanc
Taper un numéro + Entrée = aller directement à cette diapo</pre>
<h3>4. Minutage : répéter et mesurer</h3>
<p>La fonction <strong>Vérifier le minutage</strong> (répétition minutée) lance le diaporama en chronométrant chaque diapo. À la fin, PowerPoint propose d'enregistrer ces durées, utiles pour caler un temps de parole ou un diaporama automatique.</p>
<pre class="pseudo">Diaporama ▸ Vérifier le minutage (Répétition minutée)
Diaporama ▸ (case) Utiliser les minutages</pre>
<h3>5. Enregistrer une narration</h3>
<p>On peut associer une <strong>narration audio</strong> et des minutages à chaque diapo (vu au jour 15). Combinés au mode Présentateur, ils permettent de s'entraîner puis de produire une version autonome.</p>
<pre class="pseudo">Diaporama ▸ Enregistrer le diaporama</pre>
<h3>6. Bonnes pratiques et versions</h3>
<p>Le mode Présentateur bascule automatiquement quand deux écrans sont détectés. Vérifie l'affectation des écrans (<em>Diaporama ▸ Moniteur</em>) avant de démarrer, et le <strong>Permuter</strong> si les écrans sont inversés. Le mode Présentateur existe en 365 et 2021/2019 ; l'interface 365 est légèrement modernisée (sous-titres en direct, réglages plus accessibles).</p>`,
  exercises: [
    { type: "qcm", q: "Qu'affiche le mode Présentateur sur l'écran du présentateur ?", opts: ["La même chose que le public", "Diapo courante, diapo suivante, notes et minuteur", "Uniquement les notes", "Rien"], a: 1, exp: "Le présentateur voit ses repères, le public voit le plein écran." },
    { type: "vf", q: "Les notes du présentateur sont invisibles pour le public.", a: true, exp: "Elles restent sur l'écran du présentateur." },
    { type: "qcm", q: "Où saisir les notes d'une diapo ?", opts: ["Dans le masque", "Zone Notes sous la diapo (Affichage ▸ Notes)", "Dans les Transitions", "Fichier ▸ Options"], a: 1, exp: "La zone Notes s'affiche sous la diapo en édition." },
    { type: "qcm", q: "Que fait Vérifier le minutage (répétition minutée) ?", opts: ["Ajoute des transitions", "Chronomètre chaque diapo pour enregistrer des durées", "Compresse", "Change le thème"], a: 1, exp: "La répétition minutée mesure et enregistre le temps par diapo." },
    { type: "vf", q: "On peut forcer le mode Présentateur même avec un seul écran.", a: true, exp: "Clic droit en diaporama ▸ Afficher le mode Présentateur." },
    { type: "qcm", q: "Quel raccourci active le pointeur laser en diaporama ?", opts: ["Ctrl + L", "Ctrl + P", "Ctrl + E", "Ctrl + N"], a: 0, exp: "Ctrl + L = laser ; Ctrl + P = stylo ; Ctrl + E = gomme." },
    { type: "qcm", q: "Que fait la touche N (ou point) en diaporama ?", opts: ["Note", "Écran noir", "Nouvelle diapo", "Rien"], a: 1, exp: "N ou . passe l'écran en noir ; B en blanc." },
    { type: "qcm", q: "Comment aller directement à la diapo 7 en diaporama ?", opts: ["Cliquer 7 fois", "Taper 7 puis Entrée", "Ctrl + 7", "Impossible"], a: 1, exp: "Numéro + Entrée saute directement à la diapo voulue." },
    { type: "vf", q: "Les notes doivent être lues mot à mot pour être efficaces.", a: false, exp: "Ce sont des repères ; les lire casse le contact avec le public." },
    { type: "qcm", q: "Quand le mode Présentateur bascule-t-il automatiquement ?", opts: ["Jamais", "Quand deux écrans sont détectés", "En PDF", "Au premier clic"], a: 1, exp: "Deux écrans déclenchent le mode Présentateur par défaut." },
    { type: "qcm", q: "Que faire si les écrans sont inversés (public voit tes notes) ?", opts: ["Rien", "Utiliser Permuter / régler le Moniteur", "Éteindre", "Changer de thème"], a: 1, exp: "Permuter réaffecte correctement diaporama et mode Présentateur." },
    { type: "qcm", q: "À quoi sert le stylo/surligneur en diaporama ?", opts: ["À compresser", "À annoter (encre) la diapo en direct", "À changer de diapo", "À couper le son"], a: 1, exp: "L'encre souligne un point pendant la présentation." },
    { type: "vf", q: "Le minuteur du mode Présentateur aide à tenir son temps de parole.", a: true, exp: "Le chrono affiché guide le rythme du présentateur." },
    { type: "qcm", q: "Le mode Présentateur existe-t-il en 2021/2019 ?", opts: ["Non, 365 seulement", "Oui, avec une interface un peu moins modernisée qu'en 365", "Uniquement en 2013", "Jamais"], a: 1, exp: "Présent partout ; 365 est légèrement plus riche." },
    { type: "qcm", q: "Où combiner narration audio et minutages ?", opts: ["Transitions", "Diaporama ▸ Enregistrer le diaporama", "Insertion ▸ Objet", "Révision"], a: 1, exp: "L'enregistrement du diaporama capture voix et minutages." }
  ],
  final: {
    title: "Exercice final — Préparer une prise de parole de 10 minutes",
    intro: `<p>Tu présentes 12 diapos en 10 minutes devant un public, avec un vidéoprojecteur relié à ton portable. Tu veux tes notes sous les yeux, tenir ton temps et pouvoir pointer un détail. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Comment avoir tes notes et le chrono pendant que le public voit le plein écran ?", opts: ["Imprimer", "Utiliser le mode Présentateur (deux écrans)", "Un PDF", "Rien"], a: 1, exp: "Le mode Présentateur affiche notes et minuteur côté présentateur." },
      { type: "qcm", q: "Comment estimer si tu tiens en 10 minutes avant le jour J ?", opts: ["Deviner", "Vérifier le minutage (répétition minutée)", "Compresser", "Changer de thème"], a: 1, exp: "La répétition minutée mesure la durée réelle." },
      { type: "vf", q: "Ctrl + L active le pointeur laser pour désigner un détail.", a: true, exp: "Le laser attire l'oeil sur un élément précis." },
      { type: "qcm", q: "Si le public voit tes notes au lieu du diaporama, tu…", opts: ["Recommences le fichier", "Utilises Permuter / règles le Moniteur", "Éteins tout", "Ajoutes une transition"], a: 1, exp: "Permuter réaffecte correctement les écrans." },
      { type: "qcm", q: "Que doivent contenir tes notes ?", opts: ["Le script mot à mot", "Des repères clés (chiffres, transitions, anecdotes)", "Rien", "Le thème"], a: 1, exp: "Des repères, pas un texte à lire : garder le contact." }
    ],
    solution: `<p>Préparation de la prise de parole :</p>
<pre class="pseudo">1  Affichage ▸ Notes : saisir des repères clés sous chaque diapo
2  Brancher le projecteur ▸ Diaporama ▸ cocher Utiliser le mode Présentateur ▸ régler le Moniteur
3  Diaporama ▸ Vérifier le minutage : répéter et mesurer les 10 minutes ▸ ajuster
4  Le jour J : F5 ▸ mode Présentateur (notes + suivant + chrono visibles)
5  Ctrl + L pour pointer, N pour écran noir lors d'un aparté
6  Si écrans inversés : Permuter d'affichage</pre>
<p>Tu présentes en gardant le contact, dans les temps, notes et laser à portée.</p>`
  }
};
</script>
