  title: "Le masque des diapositives (Slide Master)",
  subtitle: "La source unique qui gouverne l'apparence de toute la présentation.",
  theory: `
<h3>1. Qu'est-ce qu'un masque ?</h3>
<p>Le <strong>masque des diapositives</strong> (en anglais <em>Slide Master</em>) est un modèle invisible qui définit l'apparence par défaut de toutes les diapositives : polices, couleurs, position des titres, logos récurrents, puces. On dit que c'est la <strong>source unique de vérité</strong> : on modifie le masque une fois, et le changement se propage à toutes les diapos concernées.</p>
<div class="tip">Régle sur le masque tout ce qui se répète (logo, pied de page, style de titre). Régle sur la diapositive uniquement ce qui lui est propre. C'est la clé de la cohérence de marque.</div>
<h3>2. Masque parent et dispositions enfants</h3>
<p>Le mode Masque contient une hiérarchie : tout en haut, le <strong>masque parent</strong> (la grande miniature) ; en dessous, les <strong>dispositions</strong> (layouts) qui en héritent. Une <strong>disposition</strong> est un agencement type d'espaces réservés (Titre seul, Titre et contenu, Comparaison…).</p>
<pre class="pseudo">Affichage ▸ Modes Masque ▸ Masque des diapositives    // entrer en mode Masque
Masque des diapositives ▸ Fermer le mode Masque        // en sortir</pre>
<p>Une modification sur le <strong>parent</strong> descend sur toutes les dispositions, sauf si une disposition a été personnalisée localement (l'héritage est alors rompu pour cet élément).</p>
<h3>3. Espace réservé (placeholder)</h3>
<p>Un <strong>espace réservé</strong> est une zone prédéfinie qui accueille un type de contenu (titre, texte, image, graphique). Sur une diapo normale, il affiche un texte grisé « Cliquez pour ajouter un titre ». On modifie sa police, sa taille et sa position <strong>dans le masque</strong>, pas diapo par diapo.</p>
<div class="warn">Ne supprime pas l'espace réservé de titre du parent sans raison : de nombreux automatismes (mode Plan, Zoom résumé, accessibilité) reposent sur l'existence d'un vrai titre.</div>
<h3>4. Ce que le masque contrôle idéalement</h3>
<ul>
<li>La <strong>police des titres et du corps</strong> (via les polices de thème, jour 5).</li>
<li>Les <strong>couleurs</strong> (via les couleurs de thème).</li>
<li>Le <strong>logo</strong> et le <strong>pied de page</strong> récurrents.</li>
<li>Le <strong>style de puces</strong> et l'interligne du corps de texte.</li>
</ul>
<h3>5. Numéros, date et pied de page</h3>
<p>On active ces éléments globalement, puis on stylise leurs espaces réservés dans le masque.</p>
<pre class="pseudo">Insertion ▸ Texte ▸ En-tête et pied de page          // cocher numéro, date, pied de page
(dans le masque) déplacer/mettre en forme les zones #, date, pied de page</pre>
<h3>6. Enregistrer le travail : modèle .potx</h3>
<p>Un masque soigné se réutilise en l'enregistrant comme <strong>modèle</strong> (.potx). On approfondit ce format demain (jour 3).</p>
<pre class="pseudo">Fichier ▸ Enregistrer sous ▸ type : Modèle PowerPoint (*.potx)</pre>
<div class="tip">Le mode Masque existe depuis longtemps et fonctionne à l'identique en 365 comme en 2021/2019 : rien de spécifique à une version récente ici.</div>`,

    { type: "qcm", q: "Sous quel format enregistre-t-on un masque pour le réutiliser comme point de départ ?", opts: [".pptx", ".potx (modèle)", ".pdf", ".mp4"], a: 1, exp: "Le .potx est un modèle réutilisable ; on l'étudie au jour 3." },

    { type: "qcm", q: "La grande miniature tout en haut du volet en mode Masque est…", opts: ["Une disposition ordinaire", "Le masque parent dont héritent les dispositions", "La première diapositive", "Un modèle importé"], a: 1, exp: "C'est le parent ; les miniatures en dessous sont ses dispositions." },
    { type: "vf", q: "Le mode Masque fonctionne différemment en 365 et en 2021/2019.", a: false, exp: "Son fonctionnement est identique d'une version à l'autre." },
    { type: "qcm", q: "Quelle est la bonne répartition masque / diapo ?", opts: ["Tout sur la diapo", "Ce qui se répète sur le masque, ce qui est propre à une diapo sur la diapo", "Tout sur le masque", "Peu importe"], a: 1, exp: "Répétitif → masque ; spécifique → diapositive. C'est la règle d'or." }
