  num: 7,
  title: "Formes, fusion de formes et icônes",
  subtitle: "Dessiner ses propres visuels avec des formes vectorielles.",
  theory: `
<h3>1. Les formes, briques du design vectoriel</h3>
<p>Une <strong>forme</strong> est un objet vectoriel (rectangle, cercle, flèche…) qui reste net à toute taille et se stylise entièrement (remplissage, contour, effet). Maîtriser les formes permet de créer des schémas propres sans dépendre d'images toutes faites.</p>
<pre class="pseudo">Insertion ▸ Illustrations ▸ Formes
Maj + tracer      = cercle/carré parfait, ligne à 45°
Ctrl + tracer     = tracer depuis le centre</pre>
<h3>2. Aligner, répartir, grouper</h3>
<p>Un schéma propre repose sur l'<strong>alignement</strong> et la <strong>répartition</strong> (espacement égal). Le <strong>groupe</strong> lie plusieurs objets pour les manipuler comme un seul.</p>
<pre class="pseudo">Format de la forme ▸ Organiser ▸ Aligner (gauche, centre, distribuer…)
Ctrl + G  = grouper        Ctrl + Maj + G = dissocier
Alt + Maj + flèches ou Format ▸ Rotation</pre>
<div class="tip">Sélectionne plusieurs formes puis Aligner ▸ Distribuer horizontalement : l'espacement devient parfaitement régulier, gage de sérieux.</div>
<h3>3. La fusion de formes : créer des formes uniques</h3>
<p>La <strong>fusion de formes</strong> (Merge Shapes) combine deux formes pour en créer une nouvelle. Cinq opérations :</p>
<pre class="pseudo">Format de la forme ▸ Insérer des formes ▸ Fusionner les formes
   Union         = colle les deux en une seule
   Combiner      = garde tout sauf le chevauchement
   Fragmenter    = découpe en tous les morceaux
   Intersection  = garde uniquement le chevauchement
   Soustraction  = retire la 2e forme de la 1re</pre>
<p>L'ordre de sélection compte pour la Soustraction : la première forme sélectionnée est celle qu'on garde. Merge Shapes existe depuis 2013 ; il est présent en 365 comme en 2021/2019.</p>
<div class="warn">La fusion est destructive : les formes d'origine disparaissent. Duplique-les avant si tu veux les conserver.</div>
<h3>4. Modifier les points d'une forme</h3>
<p><strong>Modifier les points</strong> transforme une forme standard en tracé libre : on déplace, ajoute ou courbe des sommets pour dessiner une silhouette sur mesure.</p>
<pre class="pseudo">Format de la forme ▸ Insérer des formes ▸ Modifier les forme ▸ Modifier les points</pre>
<h3>5. Les icônes et le SVG</h3>
<p>PowerPoint intègre une bibliothèque d'<strong>icônes vectorielles</strong> (SVG). Une icône SVG se convertit en formes pour la recolorer partie par partie.</p>
<pre class="pseudo">Insertion ▸ Illustrations ▸ Icônes            // bibliothèque intégrée
Clic droit sur l'icône ▸ Convertir en forme   // édition partie par partie
Graphique de l'icône ▸ Remplissage graphique  // couleur de thème</pre>
<p>La bibliothèque d'icônes est vaste en Microsoft 365, plus réduite en 2021, très limitée voire absente en 2019.</p>
<h3>6. Design : cohérence des formes et des icônes</h3>
<p>Garde un style d'icône homogène (même épaisseur de trait, même famille), des coins de formes cohérents (tous arrondis ou tous droits) et des couleurs issues du thème. Un schéma cohérent se lit d'un coup d'oeil.</p>`,
  exercises: [
    { type: "qcm", q: "Pourquoi une forme reste-t-elle nette à toute taille ?", opts: ["Elle est en haute résolution", "Elle est vectorielle", "Elle est compressée", "Elle est animée"], a: 1, exp: "Le vectoriel se recalcule sans pixeliser." },
    { type: "qcm", q: "Que fait Maj pendant qu'on trace une ellipse ?", opts: ["Rien", "Force un cercle parfait", "Duplique la forme", "Ouvre le masque"], a: 1, exp: "Maj contraint les proportions : cercle, carré, angle à 45°." },
    { type: "vf", q: "Aligner ▸ Distribuer horizontalement rend l'espacement entre objets régulier.", a: true, exp: "La répartition égalise les intervalles automatiquement." },
    { type: "qcm", q: "Quel raccourci groupe des objets ?", opts: ["Ctrl + G", "Ctrl + D", "Ctrl + M", "Ctrl + U"], a: 0, exp: "Ctrl + G groupe ; Ctrl + Maj + G dissocie." },
    { type: "qcm", q: "Que fait l'opération Union de la fusion de formes ?", opts: ["Garde le chevauchement seulement", "Colle les formes en une seule", "Découpe en morceaux", "Retire une forme"], a: 1, exp: "Union fond les formes en un objet unique." },
    { type: "qcm", q: "Que fait Soustraction ?", opts: ["Additionne les formes", "Retire la 2e forme de la 1re sélectionnée", "Garde l'intersection", "Fragmente tout"], a: 1, exp: "La 1re forme sélectionnée est conservée, moins la 2e." },
    { type: "vf", q: "La fusion de formes est destructive : les formes d'origine disparaissent.", a: true, exp: "Duplique-les avant si tu veux les garder." },
    { type: "qcm", q: "Quelle opération garde UNIQUEMENT la zone commune à deux formes ?", opts: ["Union", "Intersection", "Combiner", "Fragmenter"], a: 1, exp: "Intersection ne conserve que le chevauchement." },
    { type: "qcm", q: "À quoi sert Modifier les points ?", opts: ["À compresser", "À déplacer/courber les sommets pour un tracé sur mesure", "À animer", "À grouper"], a: 1, exp: "On sculpte la silhouette en éditant ses points." },
    { type: "qcm", q: "Comment recolorer une icône SVG partie par partie ?", opts: ["Impossible", "Clic droit ▸ Convertir en forme puis recolorer chaque partie", "La compresser", "Changer de thème"], a: 1, exp: "Convertie en formes, l'icône devient éditable pièce par pièce." },
    { type: "vf", q: "La bibliothèque d'icônes est plus fournie en Microsoft 365 qu'en 2019.", a: true, exp: "365 offre une large banque ; 2019 en est quasi dépourvu." },
    { type: "qcm", q: "Où trouve-t-on la commande Fusionner les formes ?", opts: ["Transitions", "Format de la forme ▸ Insérer des formes ▸ Fusionner les formes", "Fichier ▸ Options", "Révision"], a: 1, exp: "Merge Shapes est dans l'onglet Format de la forme." },
    { type: "qcm", q: "Que fait Ctrl pendant qu'on trace une forme ?", opts: ["Trace depuis le centre", "Duplique", "Aligne", "Groupe"], a: 0, exp: "Ctrl fait partir le tracé du centre de la forme." },
    { type: "vf", q: "Mélanger des icônes de styles très différents renforce la cohérence du schéma.", a: false, exp: "Au contraire : un style d'icône homogène se lit mieux." },
    { type: "qcm", q: "Pour un schéma pro, quelle couleur donner aux formes ?", opts: ["Des couleurs standard au hasard", "Des couleurs issues du thème", "Une couleur différente par forme", "Toujours du noir"], a: 1, exp: "Les couleurs de thème assurent cohérence et mise à jour globale." }
  ],
  final: {
    title: "Exercice final — Dessiner un pictogramme sur mesure",
    intro: `<p>Tu veux un pictogramme unique : un cercle plein dans lequel est découpée une flèche (le fond du cercle laisse voir la diapo à travers la flèche). Puis tu ajoutes trois icônes alignées sous ce logo. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Quelle opération de fusion découpe la flèche dans le cercle ?", opts: ["Union", "Soustraction (cercle sélectionné en premier, flèche ensuite)", "Intersection", "Combiner"], a: 1, exp: "Soustraction retire la flèche du cercle : la forme du cercle est gardée." },
      { type: "vf", q: "L'ordre de sélection compte : la première forme sélectionnée est celle qu'on conserve.", a: true, exp: "Pour la Soustraction, la 1re forme reste, la 2e est retranchée." },
      { type: "qcm", q: "Avant de fusionner, que faire pour garder les formes d'origine ?", opts: ["Rien", "Les dupliquer (Ctrl + D)", "Les grouper", "Les animer"], a: 1, exp: "La fusion étant destructive, on duplique d'abord." },
      { type: "qcm", q: "Pour aligner parfaitement les trois icônes du dessous, on utilise…", opts: ["La souris à l'oeil", "Aligner ▸ Aligner en bas + Distribuer horizontalement", "Les Transitions", "Le hasard"], a: 1, exp: "Alignement + répartition donnent un espacement régulier et net." },
      { type: "qcm", q: "Pour que le pictogramme respecte la charte, on colore les formes en…", opts: ["Couleur standard", "Couleur de thème (Accent)", "Noir uniquement", "Blanc uniquement"], a: 1, exp: "Une couleur de thème garantit la cohérence de marque." }
    ],
    solution: `<p>Construction du pictogramme :</p>
<pre class="pseudo">1  Insertion ▸ Formes ▸ Ellipse + Maj pour un cercle parfait
2  Insertion ▸ Formes ▸ Flèche, la poser sur le cercle
3  (option) Ctrl + D pour dupliquer les formes à conserver
4  Sélectionner d'ABORD le cercle, puis la flèche (Maj + clic)
5  Format de la forme ▸ Fusionner les formes ▸ Soustraction
6  Remplissage = couleur de thème (Accent), sans contour
7  Insertion ▸ Icônes ▸ 3 icônes homogènes ▸ les colorer en couleur de thème
8  Les sélectionner ▸ Aligner en bas ▸ Distribuer horizontalement
9  Ctrl + G pour grouper l'ensemble</pre>
<p>Tu obtiens un logo vectoriel unique et une rangée d'icônes parfaitement alignées.</p>`
  }
};
