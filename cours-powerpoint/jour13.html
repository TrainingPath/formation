var DAY = {
  num: 13,
  title: "Morph (Transformer) : l'animation magique",
  subtitle: "Un mouvement fluide entre deux diapos, sans réglage d'animation.",
  theory: `
<h3>1. Qu'est-ce que Morph ?</h3>
<p><strong>Morph</strong> (en français « <strong>Transformer</strong> ») est une <strong>transition</strong> qui anime automatiquement les objets présents sur DEUX diapos successives. Si un même objet change de position, de taille, de rotation ou de couleur entre la diapo A et la diapo B, Morph interpole le mouvement : l'objet semble glisser, grandir ou tourner tout seul.</p>
<div class="tip">Le principe : on duplique une diapo, on modifie les objets sur la copie, puis on applique Transformer à la copie. PowerPoint calcule le mouvement entre les deux états.</div>
<h3>2. Recette de base en trois temps</h3>
<pre class="pseudo">1  Créer la diapo A avec les objets
2  Clic droit sur la miniature ▸ Dupliquer la diapositive   (= diapo B)
3  Sur B : déplacer / redimensionner / recolorer les objets
4  Sélectionner B ▸ Transitions ▸ Transformer (Morphose)</pre>
<h3>3. La condition : des objets communs</h3>
<p>Morph reconnaît un objet comme « le même » s'il existe sur les deux diapos. Un objet présent seulement sur B fera une simple apparition ; un objet présent seulement sur A disparaîtra. Le mouvement fluide ne concerne que les <strong>objets communs</strong>.</p>
<div class="warn">Si deux objets se ressemblent trop (deux formes identiques), Morph peut les confondre. Pour forcer l'association, on renomme les objets avec un préfixe spécial dans le volet Sélection.</div>
<h3>4. Nommer les objets pour guider Morph</h3>
<p>Le <strong>volet Sélection</strong> liste et permet de renommer les objets d'une diapo. En préfixant deux objets du même nom <code>!!nomidentique</code> sur A et B, on force Morph à les relier même s'ils sont visuellement différents.</p>
<pre class="pseudo">Accueil ▸ Organiser ▸ Volet Sélection
Renommer l'objet A et l'objet B en  !!bulle   (double point d'exclamation)</pre>
<h3>5. Options de la Morphose</h3>
<pre class="pseudo">Transitions ▸ Options d'effet ▸ Objets / Mots / Caractères
Transitions ▸ Minutage ▸ Durée      // règle la vitesse du morphing</pre>
<p>L'option <strong>Objets</strong> anime les formes entières ; <strong>Mots</strong> et <strong>Caractères</strong> permettent des effets de texte (un mot qui se recompose).</p>
<h3>6. Usages et versions</h3>
<p>Morph excelle pour : un <strong>zoom</strong> progressif sur un détail, un objet qui se <strong>déplace</strong> pour raconter, un <strong>changement d'état</strong> (avant/après), des <strong>titres animés</strong> élégants. Il remplace souvent des dizaines d'animations manuelles.</p>
<div class="warn">Morph existe depuis PowerPoint 2016/2019 et Microsoft 365. Il est ABSENT de 2013 et antérieurs, où il se dégrade en Fondu. Si tu diffuses vers d'anciens postes, prévois un rendu de repli acceptable.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que Morph (Transformer) ?", opts: ["Une animation d'objet", "Une transition qui anime les objets communs entre deux diapos", "Un thème", "Un graphique"], a: 1, exp: "Morph est une transition qui interpole les objets communs." },
    { type: "qcm", q: "Quelle est la recette de base ?", opts: ["Insérer une vidéo", "Dupliquer la diapo, modifier les objets sur la copie, appliquer Transformer", "Changer de thème", "Ajouter un son"], a: 1, exp: "Dupliquer + modifier + Transformer : la recette Morph." },

    { type: "qcm", q: "Un objet présent uniquement sur la diapo B fera…", opts: ["Un morphing complet", "Une simple apparition", "Une erreur", "Une rotation"], a: 1, exp: "Sans équivalent sur A, il apparaît sans morphing." },
    { type: "qcm", q: "Comment forcer Morph à relier deux objets différents ?", opts: ["Impossible", "Les renommer avec le préfixe !!nom identique dans le volet Sélection", "Changer leur couleur", "Les grouper"], a: 1, exp: "Le préfixe !! force l'association entre les deux objets." },
    { type: "qcm", q: "Où renomme-t-on les objets ?", opts: ["Transitions", "Accueil ▸ Organiser ▸ Volet Sélection", "Fichier ▸ Options", "Insertion"], a: 1, exp: "Le volet Sélection liste et renomme les objets." },
    { type: "vf", q: "Deux formes identiques peuvent être confondues par Morph.", a: true, exp: "D'où l'intérêt de les nommer avec le préfixe !! pour les distinguer/relier." },
    { type: "qcm", q: "Que fait l'option d'effet Caractères de la Morphose ?", opts: ["Anime les formes", "Permet des effets de texte lettre par lettre", "Change le thème", "Supprime le texte"], a: 1, exp: "Mots/Caractères animent le texte finement." },
    { type: "qcm", q: "Où règle-t-on la vitesse du morphing ?", opts: ["Animations", "Transitions ▸ Minutage ▸ Durée", "Création", "Révision"], a: 1, exp: "La durée de la transition contrôle la vitesse du mouvement." },
    { type: "vf", q: "Morph existe depuis PowerPoint 2016/2019 et 365.", a: true, exp: "Avant 2016, il n'existe pas et se dégrade en Fondu." },
    { type: "qcm", q: "Pour quel usage Morph est-il idéal ?", opts: ["Imprimer", "Zoom progressif, déplacement narratif, avant/après, titres animés", "Compresser", "Chiffrer"], a: 1, exp: "Morph excelle pour zooms, déplacements et changements d'état." },
    { type: "qcm", q: "Sur un poste 2013, une transition Transformer devient…", opts: ["Un Damier", "Un Fondu", "Une erreur", "Une rotation"], a: 1, exp: "Faute de support, Morph se dégrade en Fondu." },
    { type: "vf", q: "Morph peut remplacer des dizaines d'animations manuelles.", a: true, exp: "Un simple changement d'état suffit à générer le mouvement." },
    { type: "qcm", q: "Quel préfixe force l'association d'objets dans Morph ?", opts: ["##", "!!", "@@", "**"], a: 1, exp: "Le double point d'exclamation !! relie deux objets renommés." },
    { type: "qcm", q: "Que se passe-t-il pour un objet présent seulement sur A ?", opts: ["Il apparaît", "Il disparaît", "Il tourne", "Rien"], a: 1, exp: "Sans équivalent sur B, il disparaît à la transition." }
  ],
  final: {
    title: "Exercice final — Un zoom narratif avec Morph",
    intro: `<p>Tu veux montrer une carte entière (diapo A), puis zoomer en douceur sur une ville précise (diapo B), le tout sans animation manuelle. Objectif : un effet de zoom fluide grâce à la Morphose.</p>`,
    questions: [
      { type: "qcm", q: "Comment obtenir la diapo B pour le zoom ?", opts: ["Créer une diapo vierge", "Dupliquer la diapo A puis agrandir/déplacer la carte pour cadrer la ville", "Insérer une image", "Changer le thème"], a: 1, exp: "On duplique et on modifie l'état de l'objet sur la copie." },
      { type: "qcm", q: "Quelle transition appliquer à la diapo B ?", opts: ["Fondu", "Transformer (Morphose)", "Damier", "Poussée"], a: 1, exp: "Transformer interpole le zoom entre A et B." },
      { type: "vf", q: "La carte doit être le même objet sur A et B pour que Morph l'anime.", a: true, exp: "Le mouvement fluide exige un objet commun." },
      { type: "qcm", q: "Comment régler la vitesse du zoom ?", opts: ["Animations ▸ Durée", "Transitions ▸ Minutage ▸ Durée", "Création", "Révision"], a: 1, exp: "La durée de la transition règle la vitesse du morphing." },
      { type: "qcm", q: "Sur un vieux poste 2013, l'effet deviendra…", opts: ["Un zoom identique", "Un simple Fondu", "Une erreur", "Un Damier"], a: 1, exp: "Morph se dégrade en Fondu avant 2016." }
    ],
    solution: `<p>Réalisation du zoom Morph :</p>
<pre class="pseudo">1  Diapo A : insérer la carte entière, bien cadrée
2  Clic droit sur la miniature A ▸ Dupliquer la diapositive (= B)
3  Sur B : agrandir la carte et la déplacer pour que la ville visée remplisse l'écran
4  Sélectionner B ▸ Transitions ▸ Transformer
5  Transitions ▸ Minutage ▸ Durée : ~1 s pour un zoom doux
6  Maj + F5 depuis A : la carte zoome en douceur sur la ville
7  (option) enchaîner d'autres diapos dupliquées pour un parcours guidé</pre>
<p>Le public voit un travelling fluide, obtenu sans une seule animation manuelle.</p>`
  }
};
