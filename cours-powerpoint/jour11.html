<script>
var DAY = {
  num: 11,
  title: "Les transitions avec intention",
  subtitle: "Passer d'une diapo à l'autre sans distraire le public.",
  theory: `
<h3>1. Transition n'est pas animation</h3>
<p>Une <strong>transition</strong> est l'effet qui se joue au <strong>passage d'une diapositive à la suivante</strong> (fondu, poussée, morphose…). À ne pas confondre avec l'<strong>animation</strong>, qui fait bouger un objet À L'INTÉRIEUR d'une diapo (jour 12). Une transition concerne la diapo entière.</p>
<pre class="pseudo">Transitions ▸ (galerie d'effets)
Transitions ▸ Appliquer partout        // même transition sur tout le deck</pre>
<h3>2. Sobre par défaut</h3>
<div class="warn">Les transitions spectaculaires (Damier, Origami, Rotation…) datent et distraient. En contexte pro, on s'en tient au <strong>Fondu</strong> discret, ou à rien. La transition doit servir le propos, pas voler la vedette.</div>
<p>Le <strong>Fondu</strong> (Morphed/Fade) crée une continuité douce. La <strong>Poussée</strong> (Push) suggère une progression (avant/arrière). Réserve les effets marqués à un usage narratif précis.</p>
<h3>3. Durée et cohérence</h3>
<p>La <strong>durée</strong> règle la vitesse de l'effet. Une transition trop longue ralentit le rythme ; trop courte, elle ne se voit pas. Vise 0,3 à 0,7 s. La <strong>cohérence</strong> prime : la même transition sur tout le deck (Appliquer partout) est plus pro qu'un effet différent par diapo.</p>
<pre class="pseudo">Transitions ▸ Minutage ▸ Durée
Transitions ▸ Minutage ▸ Son          // (à éviter en général)</pre>
<h3>4. Faire avancer : au clic ou automatiquement</h3>
<p>Le groupe <strong>Minutage</strong> décide comment on change de diapo : au <strong>clic</strong> (contrôle du présentateur) ou <strong>après un délai</strong> (diaporama automatique, jour 18).</p>
<pre class="pseudo">Transitions ▸ Minutage ▸ Passer à la diapositive suivante :
   [x] Au clic de la souris       [ ] Après : 00:05,00</pre>
<h3>5. Morphose (Transformer) : la transition intelligente</h3>
<p>La <strong>Morphose</strong> (Morph, en français « Transformer ») anime en douceur les objets communs entre deux diapos : un objet qui change de position, de taille ou de couleur semble se déplacer tout seul. C'est une transition, mais qui donne un rendu d'animation sophistiquée sans effort.</p>
<div class="tip">Morph existe depuis PowerPoint 2016/2019 (et 365) ; il est ABSENT des versions antérieures. Sur un poste 2013 ou plus ancien, la Morphose est remplacée par un simple Fondu. On l'approfondit au jour 13.</div>
<h3>6. Design : le rythme d'une présentation</h3>
<p>Les transitions rythment la narration : un Fondu marque une continuité, une Poussée un chapitre, la Morphose un zoom ou un changement de perspective. Utilisées avec <strong>intention</strong> et parcimonie, elles renforcent le fil ; multipliées au hasard, elles fatiguent.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une transition ?", opts: ["Un effet sur un objet dans la diapo", "L'effet au passage d'une diapo à la suivante", "Un thème de couleurs", "Un raccourci clavier"], a: 1, exp: "La transition concerne le passage entre deux diapos entières." },
    { type: "qcm", q: "Quelle est la différence transition / animation ?", opts: ["Aucune", "Transition = entre diapos ; animation = objet dans une diapo", "L'animation est plus lente", "La transition anime le texte"], a: 1, exp: "Transition entre diapos, animation à l'intérieur d'une diapo." },
    { type: "vf", q: "En contexte pro, les effets spectaculaires (Origami, Damier) sont recommandés.", a: false, exp: "Ils datent et distraient ; on privilégie le Fondu discret." },
    { type: "qcm", q: "Quelle transition crée une continuité douce ?", opts: ["Damier", "Fondu", "Origami", "Rotation"], a: 1, exp: "Le Fondu offre une transition sobre et élégante." },
    { type: "qcm", q: "Quelle durée de transition viser ?", opts: ["3 à 5 s", "0,3 à 0,7 s", "10 s", "0,01 s"], a: 1, exp: "Assez pour se voir, assez courte pour ne pas ralentir." },
    { type: "vf", q: "Appliquer la même transition partout est plus professionnel qu'un effet différent par diapo.", a: true, exp: "La cohérence prime : Appliquer partout uniformise." },
    { type: "qcm", q: "À quoi sert Passer à la diapositive suivante Après : 00:05 ?", opts: ["À raccourcir le fondu", "À avancer automatiquement après un délai (diaporama auto)", "À ajouter un son", "À supprimer la diapo"], a: 1, exp: "Le délai automatise l'avancement sans clic." },
    { type: "qcm", q: "Que fait la Morphose (Transformer) ?", opts: ["Elle change le thème", "Elle anime en douceur les objets communs entre deux diapos", "Elle supprime les objets", "Elle ajoute un son"], a: 1, exp: "Morph interpole position, taille et couleur des objets communs." },
    { type: "vf", q: "La Morphose existe depuis PowerPoint 2016/2019 et 365, pas avant.", a: true, exp: "Sur un poste antérieur, elle est remplacée par un Fondu." },
    { type: "qcm", q: "Où règle-t-on la durée d'une transition ?", opts: ["Animations", "Transitions ▸ Minutage ▸ Durée", "Fichier ▸ Options", "Insertion"], a: 1, exp: "Le groupe Minutage contient la durée et le déclenchement." },
    { type: "qcm", q: "Que suggère une Poussée (Push) ?", opts: ["Une erreur", "Une progression (avant/arrière), un nouveau chapitre", "Un fondu", "Une répétition"], a: 1, exp: "La Poussée évoque une avancée narrative." },
    { type: "vf", q: "Ajouter un son à chaque transition renforce le professionnalisme.", a: false, exp: "Les sons de transition sont généralement à éviter." },
    { type: "qcm", q: "Sur un poste PowerPoint 2013, une transition Morphose devient…", opts: ["Une erreur", "Un simple Fondu", "Un Damier", "Rien du tout"], a: 1, exp: "Faute de support, Morph se dégrade en Fondu." },
    { type: "qcm", q: "Quel est le rôle des transitions dans la narration ?", opts: ["Décorer au hasard", "Rythmer avec intention (continuité, chapitre, zoom)", "Ralentir volontairement", "Cacher le contenu"], a: 1, exp: "Employées avec intention, elles soutiennent le fil du récit." },
    { type: "vf", q: "Une transition trop longue peut casser le rythme de la présentation.", a: true, exp: "Un effet interminable ralentit et lasse l'auditoire." }
  ],
  final: {
    title: "Exercice final — Rythmer un deck de 20 diapos",
    intro: `<p>Un deck de 20 diapos a une transition différente et clinquante sur chacune. Le rendu paraît brouillon. Objectif : homogénéiser et n'utiliser des effets marqués que là où ils ont du sens.</p>`,
    questions: [
      { type: "qcm", q: "Premier réflexe pour homogénéiser ?", opts: ["Supprimer des diapos", "Appliquer un Fondu discret partout (Appliquer partout)", "Ajouter des sons", "Passer en 3D"], a: 1, exp: "Une transition sobre uniforme donne un rendu pro." },
      { type: "vf", q: "On peut réserver la Morphose aux diapos où un objet se déplace/zoome pour un effet narratif.", a: true, exp: "Morph a du sens quand des objets communs évoluent entre deux diapos." },
      { type: "qcm", q: "Quelle durée régler pour ce Fondu ?", opts: ["5 s", "0,3 à 0,7 s", "0,01 s", "10 s"], a: 1, exp: "Une durée courte garde le rythme fluide." },
      { type: "qcm", q: "Comment marquer le passage à une nouvelle partie ?", opts: ["Un Damier", "Une Poussée sur les diapos de section", "Un son fort", "Rien n'est possible"], a: 1, exp: "La Poussée suggère un changement de chapitre." },
      { type: "qcm", q: "Faut-il ajouter un son à chaque transition ?", opts: ["Oui, toujours", "Non, à éviter en général", "Uniquement en 3D", "Obligatoire en 365"], a: 1, exp: "Les sons de transition nuisent au professionnalisme." }
    ],
    solution: `<p>Mise en cohérence :</p>
<pre class="pseudo">1  Sélectionner une diapo ▸ Transitions ▸ Fondu ▸ Durée 0,4-0,6 s
2  Transitions ▸ Appliquer partout (toutes les diapos passent en Fondu)
3  Diapos de section : appliquer une Poussée pour marquer les chapitres
4  Diapos où un objet se déplace/zoome : appliquer la Morphose (jour 13)
5  Retirer tout son de transition
6  Vérifier en F5 que le rythme est fluide et cohérent</pre>
<p>Le deck gagne en sobriété ; les rares effets marqués prennent alors du sens.</p>`
  }
};
</script>
