<script>
var DAY = {
  num: 3,
  title: "Créer un thème et un modèle de marque",
  subtitle: "Transformer un masque soigné en identité réutilisable.",
  theory: `
<h3>1. Thème et modèle : deux notions à distinguer</h3>
<p>Un <strong>thème</strong> est un jeu coordonné de <strong>couleurs</strong>, de <strong>polices</strong> et d'<strong>effets</strong> (styles d'ombres, de contours). C'est l'ADN visuel. Un <strong>modèle</strong> (fichier .potx) est un document de départ complet : il embarque un thème, mais aussi des masques, des dispositions, du contenu d'exemple et des réglages. Résumé : le thème habille, le modèle fournit toute la structure prête à l'emploi.</p>
<pre class="pseudo">.thmx  = fichier de thème (couleurs + polices + effets)
.potx  = fichier de modèle (thème + masques + dispositions + contenu type)
.pptx  = présentation ordinaire</pre>
<h3>2. Définir les couleurs de thème</h3>
<p>Un thème expose une palette de <strong>12 emplacements</strong> : 4 pour le texte/l'arrière-plan, 6 d'accentuation (Accent 1 à 6), et 2 pour les liens. L'intérêt : si tu changes « Accent 1 », tout ce qui utilise cette couleur (formes, graphiques, SmartArt) se met à jour d'un coup.</p>
<pre class="pseudo">Création ▸ Variantes ▸ (flèche) ▸ Couleurs ▸ Personnaliser les couleurs
(en mode Masque) Masque ▸ Couleurs ▸ Personnaliser les couleurs</pre>
<div class="tip">Utilise TOUJOURS les couleurs de thème (rangée du haut du sélecteur) plutôt que les couleurs standard. Ainsi un simple changement de variante recolore toute la présentation en restant cohérente.</div>
<h3>3. Définir les polices de thème</h3>
<p>Un thème fixe deux polices : une pour les <strong>titres</strong>, une pour le <strong>corps</strong>. Les espaces réservés y font référence par les entrées « +Titres » et « +Corps » : change la police de thème, tous les textes suivent.</p>
<pre class="pseudo">Création ▸ Variantes ▸ Polices ▸ Personnaliser les polices</pre>
<div class="warn">N'applique jamais une police manuellement partout : tu perds la mise à jour centralisée. Passe par les polices de thème.</div>
<h3>4. Incorporer les polices pour la portabilité</h3>
<p>Si ta marque utilise une police non standard, l'incorporation (embed) l'embarque dans le fichier pour qu'elle s'affiche sur un poste qui ne l'a pas.</p>
<pre class="pseudo">Fichier ▸ Options ▸ Enregistrement ▸ Incorporer les polices dans le fichier</pre>
<p>Cette option existe en 365 comme en 2021/2019 (sous Windows). Attention : elle ne fonctionne pas pour toutes les polices (certaines interdisent l'incorporation) et alourdit le fichier.</p>
<h3>5. Enregistrer et diffuser</h3>
<pre class="pseudo">Création ▸ Thèmes ▸ (flèche) ▸ Enregistrer le thème actif…   // crée un .thmx
Fichier ▸ Enregistrer sous ▸ Modèle PowerPoint (*.potx)      // crée le modèle</pre>
<p>Un .potx placé dans le dossier des modèles Office personnels apparaît dans <em>Fichier ▸ Nouveau ▸ Personnel</em>, prêt à démarrer chaque nouveau projet sur ta marque.</p>
<h3>6. Design : pourquoi une marque cohérente ?</h3>
<p>La cohérence visuelle crée de la <strong>reconnaissance</strong> et de la <strong>confiance</strong>. Une palette limitée (2 à 3 couleurs dominantes + neutres) et deux polices maximum donnent un rendu professionnel. Trop de couleurs ou de polices = amateurisme perçu.</p>
<div class="tip">Règle simple : une couleur d'accent forte, une ou deux couleurs de soutien, des neutres pour le reste. Deux polices au total.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence entre un thème et un modèle ?", opts: ["Aucune, ce sont des synonymes", "Le thème = couleurs/polices/effets ; le modèle (.potx) = structure complète incluant un thème", "Le modèle ne contient pas de couleurs", "Le thème est un fichier vidéo"], a: 1, exp: "Le thème habille, le modèle fournit toute la structure prête à l'emploi." },
    { type: "qcm", q: "Combien d'emplacements de couleurs compte un thème PowerPoint ?", opts: ["4", "8", "12", "24"], a: 2, exp: "4 texte/fond + 6 accents + 2 liens = 12 emplacements." },
    { type: "vf", q: "Utiliser les couleurs de thème permet de recolorer tout le deck en changeant simplement de variante.", a: true, exp: "C'est tout l'intérêt des couleurs de thème : cohérence et mise à jour globale." },
    { type: "qcm", q: "Quelle extension a un fichier de THÈME seul ?", opts: [".potx", ".thmx", ".pptx", ".mp4"], a: 1, exp: ".thmx pour un thème ; .potx pour un modèle complet." },
    { type: "qcm", q: "Combien de polices un thème définit-il ?", opts: ["Une seule", "Deux : une pour les titres, une pour le corps", "Trois", "Autant qu'on veut"], a: 1, exp: "Titres + corps : deux polices référencées par +Titres et +Corps." },
    { type: "vf", q: "Appliquer manuellement une police à chaque zone de texte est la meilleure pratique.", a: false, exp: "On perd la mise à jour centralisée : il faut passer par les polices de thème." },
    { type: "qcm", q: "À quoi sert l'incorporation des polices (embed) ?", opts: ["À réduire le fichier", "À embarquer une police non standard pour qu'elle s'affiche sur un autre poste", "À accélérer les animations", "À protéger le fichier par mot de passe"], a: 1, exp: "L'incorporation garantit la portabilité de la typographie de marque." },
    { type: "qcm", q: "Où incorpore-t-on les polices ?", opts: ["Création ▸ Thèmes", "Fichier ▸ Options ▸ Enregistrement ▸ Incorporer les polices dans le fichier", "Insertion ▸ Texte", "Transitions"], a: 1, exp: "L'option se trouve dans les Options d'enregistrement." },
    { type: "vf", q: "Toutes les polices peuvent être incorporées dans un fichier PowerPoint.", a: false, exp: "Certaines licences de police interdisent l'incorporation." },
    { type: "qcm", q: "Sous quel format enregistrer un modèle de marque réutilisable ?", opts: [".thmx", ".potx", ".pdf", ".png"], a: 1, exp: "Le .potx sert de document de départ complet." },
    { type: "qcm", q: "Combien de polices maximum pour un rendu professionnel ?", opts: ["Une par diapo", "Deux au total", "Cinq", "Le plus possible"], a: 1, exp: "Deux polices maximum : au-delà, l'ensemble paraît amateur." },
    { type: "vf", q: "Un .potx placé dans les modèles personnels apparaît dans Fichier ▸ Nouveau ▸ Personnel.", a: true, exp: "Il devient un point de départ disponible pour chaque nouveau projet." },
    { type: "qcm", q: "Pourquoi une marque visuelle cohérente est-elle importante ?", opts: ["Elle réduit la taille du fichier", "Elle crée reconnaissance et confiance", "Elle accélère l'enregistrement", "Elle est obligatoire légalement"], a: 1, exp: "La cohérence renforce l'image professionnelle et la mémorisation." },
    { type: "qcm", q: "Quelle palette privilégier ?", opts: ["Le plus de couleurs vives possible", "Une couleur d'accent forte + une ou deux de soutien + des neutres", "Uniquement du noir et blanc", "Une couleur différente par diapo"], a: 1, exp: "Une palette limitée et hiérarchisée donne un rendu pro." },
    { type: "vf", q: "Changer la couleur Accent 1 du thème met à jour toutes les formes et graphiques qui l'utilisent.", a: true, exp: "Les couleurs de thème se propagent à tous les objets qui y font référence." }
  ],
  final: {
    title: "Exercice final — Bâtir le modèle d'une entreprise",
    intro: `<p>Une société veut un modèle .potx normalisé. Charte : bleu nuit (#1B2A4A) en accent principal, orange (#F26B21) en accent secondaire, gris clair pour les fonds, police Montserrat pour les titres et Open Sans pour le corps. On raisonne étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Par où commencer pour définir bleu nuit et orange comme accents ?", opts: ["Insertion ▸ Formes", "Création ▸ Variantes ▸ Couleurs ▸ Personnaliser les couleurs", "Transitions", "Affichage ▸ Zoom"], a: 1, exp: "On règle Accent 1 (bleu nuit) et Accent 2 (orange) dans les couleurs de thème." },
      { type: "qcm", q: "Pour Montserrat/Open Sans, quelle voie ?", opts: ["Appliquer la police diapo par diapo", "Création ▸ Variantes ▸ Polices ▸ Personnaliser les polices (titres + corps)", "Insertion ▸ Objet", "Format de l'arrière-plan"], a: 1, exp: "On définit les polices de thème : titres = Montserrat, corps = Open Sans." },
      { type: "vf", q: "Il faut incorporer Montserrat et Open Sans pour qu'elles s'affichent sur des postes qui ne les ont pas.", a: true, exp: "Sans incorporation, un poste sans ces polices les remplacera." },
      { type: "qcm", q: "Comment garantir que les formes utilisent la charte et se mettent à jour ensemble ?", opts: ["Choisir des couleurs standard", "Utiliser les couleurs de thème (rangée du haut du sélecteur)", "Coller des captures d'écran", "Éviter les formes"], a: 1, exp: "Les couleurs de thème assurent cohérence et mise à jour globale." },
      { type: "qcm", q: "Format final pour diffuser ce document de départ complet ?", opts: [".pptx", ".potx", ".thmx", ".jpg"], a: 1, exp: "Le .potx embarque thème, masques et dispositions." }
    ],
    solution: `<p>Construction du modèle de marque :</p>
<pre class="pseudo">1  Création ▸ Variantes ▸ Couleurs ▸ Personnaliser : Accent 1 = 1B2A4A, Accent 2 = F26B21, fonds gris clair ▸ Enregistrer
2  Création ▸ Variantes ▸ Polices ▸ Personnaliser : Titres = Montserrat, Corps = Open Sans ▸ Enregistrer
3  Affichage ▸ Masque : styliser titres et corps avec +Titres / +Corps, insérer le logo
4  Fichier ▸ Options ▸ Enregistrement ▸ Incorporer les polices dans le fichier
5  (option) Création ▸ Thèmes ▸ Enregistrer le thème actif (.thmx) pour Word/Excel
6  Fichier ▸ Enregistrer sous ▸ Modèle PowerPoint (*.potx) dans les modèles personnels</pre>
<p>Chaque nouveau projet démarre alors sur la charte, sans réglage à refaire.</p>`
  }
};
