<script>
var DAY = {
  num: 10,
  title: "Tableaux élégants",
  subtitle: "Rendre un tableau lisible et net, loin du look tableur.",
  theory: `
<h3>1. Un tableau, quand et pourquoi</h3>
<p>Un <strong>tableau</strong> aligne des données en lignes et colonnes. Sur une diapo, il sert à comparer point par point (offres, caractéristiques). Mal traité, il ressemble à un export Excel illisible ; bien traité, il devient un support de comparaison élégant.</p>
<pre class="pseudo">Insertion ▸ Tableau ▸ (glisser la grille ou saisir lignes x colonnes)</pre>
<div class="tip">Règle d'or : un tableau de diapo n'est pas un rapport. Réduis-le à l'essentiel (peu de colonnes, peu de lignes). Le détail exhaustif va dans un document annexe.</div>
<h3>2. Styles de tableau et bandes</h3>
<p>Les <strong>styles de tableau</strong> appliquent d'un clic une mise en forme cohérente. Les <strong>options de style</strong> activent/désactivent la ligne d'en-tête, les <strong>lignes à bandes</strong> (alternance de teintes qui guide l'oeil horizontalement) et la ligne de total.</p>
<pre class="pseudo">Création de tableau ▸ Styles de tableau
Création de tableau ▸ Options de style de tableau ▸
   Ligne d'en-tête | Lignes à bandes | Première colonne | Ligne des totaux</pre>
<h3>3. Alléger les bordures</h3>
<p>Trop de bordures = look tableur. Un tableau moderne s'appuie sur des <strong>bordures minimales</strong> (souvent un simple filet horizontal sous l'en-tête) et sur le blanc pour séparer, pas sur une grille pleine.</p>
<pre class="pseudo">Création de tableau ▸ Bordures ▸ Aucune bordure / Bordure inférieure
Création de tableau ▸ Trame de fond            // couleurs de thème pour l'en-tête</pre>
<div class="warn">Évite les grilles noires épaisses sur fond blanc : elles écrasent le contenu. Préfère des filets fins et clairs, ou pas de filet du tout.</div>
<h3>4. Alignement et marges des cellules</h3>
<p>Le texte s'aligne à <strong>gauche</strong>, les nombres à <strong>droite</strong> (pour comparer les ordres de grandeur), les en-têtes selon leur colonne. On aère avec des <strong>marges internes</strong> généreuses.</p>
<pre class="pseudo">Disposition (tableau) ▸ Alignement (gauche/centre/droite, haut/milieu/bas)
Disposition (tableau) ▸ Marges de la cellule
Onglet + Tab   = passer à la cellule suivante (Tab en fin de tableau crée une ligne)</pre>
<h3>5. Fusion, taille et lisibilité</h3>
<pre class="pseudo">Disposition (tableau) ▸ Fusionner / Fractionner les cellules
Disposition (tableau) ▸ Distribuer les lignes / colonnes   // hauteurs/largeurs égales</pre>
<p>Fusionne les cellules pour un titre de section ; distribue pour des colonnes régulières. Garde une police lisible (pas en dessous de 16-18 pt en projection).</p>
<h3>6. Mettre en valeur l'essentiel</h3>
<p>Comme pour un graphique, une <strong>trame de fond d'accent</strong> sur la ligne ou la colonne clé (l'offre recommandée, le meilleur score) guide l'oeil. Le tableau existe à l'identique en 365 et 2021/2019 ; pour un tableau qui doit se mettre à jour, on peut coller un tableau Excel lié.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un tableau sur une diapo ?", opts: ["À décorer", "À comparer des données point par point", "À animer", "À réduire le fichier"], a: 1, exp: "Le tableau structure une comparaison lisible." },
    { type: "vf", q: "Un tableau de diapo doit contenir toutes les données du rapport.", a: false, exp: "On le réduit à l'essentiel ; le détail va en annexe." },
    { type: "qcm", q: "Que font les lignes à bandes ?", opts: ["Elles animent", "Elles alternent des teintes pour guider l'oeil horizontalement", "Elles suppriment l'en-tête", "Elles trient les données"], a: 1, exp: "L'alternance de teintes facilite le suivi des lignes." },
    { type: "qcm", q: "Où activer la ligne d'en-tête et les bandes ?", opts: ["Transitions", "Création de tableau ▸ Options de style de tableau", "Fichier ▸ Options", "Révision"], a: 1, exp: "Les options de style pilotent en-tête, bandes, totaux." },
    { type: "vf", q: "Un tableau moderne s'appuie sur des bordures minimales plutôt qu'une grille pleine.", a: true, exp: "Filets fins ou blanc de séparation : look plus élégant." },
    { type: "qcm", q: "Comment aligner des nombres pour comparer les ordres de grandeur ?", opts: ["À gauche", "À droite", "Au centre", "Peu importe"], a: 1, exp: "Aligner les nombres à droite aligne les unités/dizaines/centaines." },
    { type: "qcm", q: "Comment aligner du texte dans une cellule ?", opts: ["À droite", "À gauche", "En diagonale", "Jamais"], a: 1, exp: "Le texte se lit mieux aligné à gauche." },
    { type: "qcm", q: "Que fait Tab en fin de tableau ?", opts: ["Rien", "Crée une nouvelle ligne", "Supprime la ligne", "Ferme le tableau"], a: 1, exp: "Tab dans la dernière cellule ajoute une ligne." },
    { type: "vf", q: "Des marges internes généreuses aèrent et rendent le tableau plus lisible.", a: true, exp: "L'espace autour du texte évite l'effet compressé." },
    { type: "qcm", q: "Comment obtenir un titre de section sur plusieurs colonnes ?", opts: ["Distribuer", "Fusionner les cellules", "Fractionner", "Supprimer la ligne"], a: 1, exp: "La fusion réunit des cellules en une seule." },
    { type: "qcm", q: "Comment rendre les colonnes de largeur régulière ?", opts: ["À la souris à l'oeil", "Disposition ▸ Distribuer les colonnes", "Fusionner", "Changer de thème"], a: 1, exp: "Distribuer égalise largeurs (ou hauteurs) automatiquement." },
    { type: "vf", q: "Une grille noire épaisse sur fond blanc améliore la lisibilité.", a: false, exp: "Elle écrase le contenu ; préférer des filets fins ou aucun." },
    { type: "qcm", q: "Comment mettre en valeur l'offre recommandée dans un tableau comparatif ?", opts: ["La cacher", "Une trame de fond d'accent sur sa colonne", "Tout colorer", "Réduire sa police"], a: 1, exp: "Une trame d'accent guide l'oeil vers la colonne clé." },
    { type: "qcm", q: "Quelle taille de police minimale garder en projection ?", opts: ["8 pt", "16-18 pt", "6 pt", "10 pt"], a: 1, exp: "En dessous de 16-18 pt, un tableau projeté devient illisible." },
    { type: "vf", q: "On peut coller un tableau Excel lié pour qu'il se mette à jour.", a: true, exp: "Le collage lié synchronise le tableau avec la source Excel." }
  ],
  final: {
    title: "Exercice final — Un comparatif d'offres élégant",
    intro: `<p>Trois offres (Basic, Pro, Premium) et quatre critères (Prix, Utilisateurs, Support, Stockage). Tu veux un tableau propre qui met en avant l'offre Pro (recommandée), loin du look tableur.</p>`,
    questions: [
      { type: "qcm", q: "Combien de colonnes/lignes viser pour rester lisible ?", opts: ["Le plus possible", "L'essentiel : ici 4 critères x 3 offres", "Une seule colonne", "20 lignes"], a: 1, exp: "On réduit au strict nécessaire pour la comparaison." },
      { type: "qcm", q: "Comment mettre en avant l'offre Pro ?", opts: ["La cacher", "Une trame de fond d'accent sur sa colonne", "Tout colorer pareil", "Réduire sa police"], a: 1, exp: "La colonne Pro en couleur d'accent attire l'oeil." },
      { type: "vf", q: "Aligner les prix à droite facilite leur comparaison.", a: true, exp: "Les nombres alignés à droite se comparent d'un coup d'oeil." },
      { type: "qcm", q: "Pour éviter le look tableur, on…", opts: ["Ajoute une grille noire épaisse", "Allège les bordures (filet sous l'en-tête, blanc de séparation)", "Met tout en 3D", "Supprime l'en-tête"], a: 1, exp: "Des bordures minimales donnent un rendu élégant." },
      { type: "qcm", q: "Comment appliquer vite une mise en forme cohérente ?", opts: ["Cellule par cellule", "Un style de tableau du thème", "Une image", "Une transition"], a: 1, exp: "Les styles de tableau appliquent une mise en forme d'un clic." }
    ],
    solution: `<p>Construction du comparatif :</p>
<pre class="pseudo">1  Insertion ▸ Tableau ▸ 4 lignes x 4 colonnes (1 colonne critères + 3 offres)
2  Saisir en-têtes (Basic/Pro/Premium) et critères (Prix/Utilisateurs/Support/Stockage)
3  Création de tableau ▸ Style sobre ▸ Options : Ligne d'en-tête + Lignes à bandes
4  Création de tableau ▸ Bordures ▸ Aucune, puis remettre un filet sous l'en-tête
5  Colonne Pro : Trame de fond = couleur d'accent (légère) ▸ texte contrasté
6  Disposition (tableau) ▸ aligner texte à gauche, prix à droite ; augmenter les marges de cellule
7  Vérifier police >= 16-18 pt et lisibilité générale</pre>
<p>Le tableau devient un support de décision clair, l'offre Pro sautant aux yeux.</p>`
  }
};
</script>
