<script>
var DAY = {
  num: 8,
  title: "SmartArt et diagrammes",
  subtitle: "Transformer une liste en schéma clair, sans le rendre confus.",
  theory: `
<h3>1. SmartArt : du texte au diagramme</h3>
<p>Un <strong>SmartArt</strong> est un diagramme prêt à l'emploi (processus, cycle, hiérarchie, liste, relation…) qui se remplit comme une liste à puces. Son intérêt : convertir une énumération en visuel structuré en quelques clics, tout en restant modifiable comme du texte.</p>
<pre class="pseudo">Insertion ▸ Illustrations ▸ SmartArt ▸ choisir une catégorie
Accueil ▸ (clic droit sur une liste) ▸ Convertir en SmartArt</pre>
<div class="tip">Le SmartArt brille pour montrer une RELATION (étapes, hiérarchie, cycle). Pour de simples données chiffrées, préfère un graphique (jour 9).</div>
<h3>2. Le volet Texte, colonne vertébrale</h3>
<p>Le <strong>volet Texte</strong> est la petite fenêtre latérale où l'on tape le contenu du SmartArt sous forme de plan. Chaque ligne devient une forme ; la touche <strong>Tab</strong> abaisse un niveau (sous-élément), <strong>Maj + Tab</strong> le remonte.</p>
<pre class="pseudo">Création SmartArt ▸ Volet Texte (ou la flèche sur le bord gauche du cadre)
Entrée   = nouvelle forme
Tab      = descendre d'un niveau     Maj + Tab = remonter</pre>
<h3>3. Choisir la bonne catégorie</h3>
<ul>
<li><strong>Processus</strong> : étapes ordonnées (flèches).</li>
<li><strong>Cycle</strong> : étapes qui bouclent.</li>
<li><strong>Hiérarchie</strong> : organigramme, arborescence.</li>
<li><strong>Relation / Matrice</strong> : comparaisons, équilibres.</li>
<li><strong>Liste</strong> : regrouper sans ordre fort.</li>
</ul>
<div class="warn">Un SmartArt qui contient dix idées devient illisible. Limite-toi à 3-6 éléments ; répartis le reste sur plusieurs diapos.</div>
<h3>4. Couleurs et styles</h3>
<pre class="pseudo">Création SmartArt ▸ Modifier les couleurs      // récupère les couleurs de thème
Création SmartArt ▸ Styles SmartArt            // relief, plat…</pre>
<p>Choisis une variante de couleurs issue du thème et un style sobre (le plat vieillit moins que le relief 3D). Ainsi le diagramme reste dans la charte.</p>
<h3>5. Convertir en formes pour tout maîtriser</h3>
<p>Un SmartArt reste un objet contraint. Pour un contrôle total (déplacer une seule forme, l'animer individuellement), on peut le <strong>convertir en formes</strong>.</p>
<pre class="pseudo">Création SmartArt ▸ Convertir ▸ Convertir en formes
Création SmartArt ▸ Convertir ▸ Convertir en texte     // récupère la liste</pre>
<div class="warn">Convertir en formes est à sens unique : on perd la structure SmartArt (plus de volet Texte). Fais-le en dernier.</div>
<h3>6. Design : lisibilité avant décoration</h3>
<p>Un bon diagramme se comprend en trois secondes. Peu de texte par forme (des mots-clés, pas des phrases), une police de thème, un sens de lecture évident (gauche-droite, haut-bas). Le SmartArt existe à l'identique en 365 et 2021/2019.</p>`,

    { type: "qcm", q: "Qu'est-ce qu'un SmartArt ?", opts: ["Un graphique de données", "Un diagramme prêt à l'emploi rempli comme une liste", "Une image", "Une transition"], a: 1, exp: "Le SmartArt transforme une liste en schéma structuré." },
    { type: "qcm", q: "Comment transformer une liste à puces existante en SmartArt ?", opts: ["Insertion ▸ Objet", "Clic droit sur la liste ▸ Convertir en SmartArt", "Transitions", "Fichier ▸ Options"], a: 1, exp: "Le clic droit propose la conversion directe de la liste." },
    { type: "vf", q: "Le volet Texte permet de saisir le contenu du SmartArt sous forme de plan.", a: true, exp: "Chaque ligne du volet devient une forme du diagramme." },

    { type: "qcm", q: "Quelle catégorie pour des étapes qui bouclent (recommencent) ?", opts: ["Hiérarchie", "Cycle", "Liste", "Matrice"], a: 1, exp: "Le Cycle illustre un enchaînement qui revient au début." },
    { type: "qcm", q: "Quelle catégorie pour un organigramme ?", opts: ["Processus", "Hiérarchie", "Cycle", "Relation"], a: 1, exp: "La Hiérarchie représente arborescences et organigrammes." },
    { type: "vf", q: "Un SmartArt avec dix éléments détaillés reste parfaitement lisible.", a: false, exp: "Au-delà de 3-6 éléments, le schéma devient confus." },
    { type: "qcm", q: "Comment récupérer les couleurs de la marque dans un SmartArt ?", opts: ["Les peindre à la main", "Création SmartArt ▸ Modifier les couleurs (variantes de thème)", "Changer de police", "Convertir en image"], a: 1, exp: "Les variantes de couleurs s'appuient sur le thème." },
    { type: "qcm", q: "Pourquoi préférer un style plat à un relief 3D ?", opts: ["C'est plus lourd", "Le plat vieillit moins et reste plus lisible", "Le 3D est interdit", "Le relief 3D n'existe qu'en 365"], a: 1, exp: "Le plat est plus moderne et lisible que le relief marqué." },
    { type: "qcm", q: "Que permet Convertir en formes ?", opts: ["Revenir au texte", "Un contrôle total : déplacer/animer chaque forme individuellement", "Ajouter des données", "Compresser"], a: 1, exp: "On casse la contrainte SmartArt pour tout manipuler librement." },
    { type: "vf", q: "Convertir un SmartArt en formes est réversible d'un simple clic.", a: false, exp: "C'est à sens unique : on perd la structure SmartArt." },
    { type: "qcm", q: "Pour de simples données chiffrées à comparer, mieux vaut…", opts: ["Un SmartArt", "Un graphique (jour 9)", "Une image", "Une transition"], a: 1, exp: "Le SmartArt montre des relations ; le graphique montre des chiffres." },
    { type: "qcm", q: "Combien de mots par forme, idéalement ?", opts: ["Une phrase complète", "Des mots-clés, pas des phrases", "Un paragraphe", "Le plus possible"], a: 1, exp: "Peu de texte : un diagramme se lit en trois secondes." },
    { type: "vf", q: "On peut reconvertir un SmartArt en simple texte (liste).", a: true, exp: "Convertir ▸ Convertir en texte récupère le plan sous forme de liste." },
    { type: "qcm", q: "Quel sens de lecture privilégier pour un processus ?", opts: ["Aléatoire", "Un sens évident : gauche-droite ou haut-bas", "De bas en haut toujours", "En diagonale"], a: 1, exp: "Un sens de lecture clair rend le schéma immédiat." }
  ],
  final: {
    title: "Exercice final — Un processus en quatre étapes",
    intro: `<p>Tu dois présenter un processus de recrutement : Candidature, Entretien, Décision, Intégration. On veut un schéma clair aux couleurs de la marque, puis animer chaque étape séparément.</p>`,
    questions: [
      { type: "qcm", q: "Quelle catégorie SmartArt pour ces étapes ordonnées ?", opts: ["Cycle", "Processus", "Hiérarchie", "Matrice"], a: 1, exp: "Un Processus (flèches) convient à des étapes séquentielles." },
      { type: "qcm", q: "Comment saisir vite les quatre étapes ?", opts: ["Dessiner à la main", "Dans le volet Texte, une ligne + Entrée par étape", "Une image par étape", "Un tableau"], a: 1, exp: "Le volet Texte remplit le SmartArt comme une liste." },
      { type: "vf", q: "Modifier les couleurs permet de mettre le schéma aux couleurs de thème.", a: true, exp: "Les variantes de couleurs reprennent le thème." },
      { type: "qcm", q: "Pour animer chaque étape indépendamment, il faut d'abord…", opts: ["Compresser", "Éventuellement convertir en formes (ou utiliser l'animation par élément)", "Changer de thème", "Supprimer le titre"], a: 1, exp: "Convertir en formes donne un contrôle total ; sinon on anime par élément." },
      { type: "qcm", q: "Combien d'étapes maximum pour rester lisible ?", opts: ["3-6", "12", "20", "Aucune limite"], a: 0, exp: "Au-delà de 3-6, on répartit sur plusieurs diapos." }
    ],
    solution: `<p>Construction du processus :</p>
<pre class="pseudo">1  Insertion ▸ SmartArt ▸ Processus ▸ choisir un modèle à flèches horizontales
2  Ouvrir le volet Texte ▸ taper Candidature / Entretien / Décision / Intégration (Entrée entre chaque)
3  Création SmartArt ▸ Modifier les couleurs ▸ variante de thème ▸ Style plat
4  (option) Création SmartArt ▸ Convertir ▸ Convertir en formes pour animer étape par étape
5  Animations ▸ appliquer une entrée (ex. Apparition) ▸ Options d'effet : par élément / au clic
6  Vérifier le sens de lecture gauche-droite et la brièveté des libellés</pre>
<p>Le public suit le processus étape par étape, dans la charte.</p>`
  }
};
</script>
