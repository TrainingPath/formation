<script>
var DAY = {
  num: 5,
  title: "Typographie et couleurs : la hiérarchie visuelle",
  subtitle: "Guider l'oeil du public avec la taille, la graisse et la couleur.",
  theory: `
<h3>1. La hiérarchie visuelle, c'est quoi ?</h3>
<p>La <strong>hiérarchie visuelle</strong> est l'ordre dans lequel l'oeil parcourt une diapositive. On la crée en jouant sur le <strong>contraste</strong> : taille, graisse (épaisseur du trait), couleur, espacement. Un bon design dit au public « regarde ça d'abord, puis ça » sans qu'il ait à réfléchir.</p>
<div class="tip">Une diapo = une idée dominante. Si tout est gros et gras, plus rien ne ressort. Le contraste n'existe que par la retenue du reste.</div>
<h3>2. L'échelle typographique</h3>
<p>Une <strong>échelle typographique</strong> est un jeu de tailles cohérentes (par ex. 40 / 28 / 18 pt pour titre / sous-titre / corps). Utiliser trois tailles bien distinctes vaut mieux que dix tailles proches qui brouillent la lecture.</p>
<pre class="pseudo">Accueil ▸ Police ▸ Taille          // ou Ctrl + Maj + > / < pour agrandir/réduire
Titre     ~ 36-44 pt
Sous-titre ~ 24-28 pt
Corps     ~ 18-24 pt (rarement moins de 18 en projection)</pre>
<h3>3. Graisse, casse et interlettrage</h3>
<p>La <strong>graisse</strong> (regular, semibold, bold) hiérarchise sans changer la taille. Les <strong>capitales</strong> attirent l'oeil mais ralentissent la lecture : réserve-les aux titres courts. L'<strong>interligne</strong> (espace entre lignes) et l'<strong>interlettrage</strong> (espacement des caractères) aèrent le texte.</p>
<pre class="pseudo">Accueil ▸ Paragraphe ▸ Interligne
Accueil ▸ Police ▸ (flèche) ▸ Espacement des caractères / Espacement</pre>
<div class="warn">Évite le souligné pour insister : sur diapo il évoque un lien cliquable. Préfère le gras ou la couleur.</div>
<h3>4. Couleur : contraste et lisibilité</h3>
<p>La lisibilité dépend du <strong>contraste</strong> entre le texte et le fond. Une règle d'accessibilité (WCAG) demande un ratio d'au moins <strong>4,5:1</strong> pour le texte courant. Texte clair sur fond sombre ou texte sombre sur fond clair : jamais deux couleurs vives de luminosité proche.</p>
<pre class="pseudo">Création ▸ Variantes ▸ Couleurs           // s'appuyer sur les couleurs de thème
Vérificateur d'accessibilité : Révision ▸ Vérifier l'accessibilité   // signale les contrastes faibles</pre>
<h3>5. La couleur d'accent avec parcimonie</h3>
<p>Une <strong>couleur d'accent</strong> forte ne sert qu'à souligner l'essentiel (un chiffre clé, un mot). Si tout est coloré, l'accent perd son pouvoir. Le reste reste en neutres (noir doux, gris, blanc cassé).</p>
<div class="tip">Règle 60-30-10 : ~60 % de couleur dominante/neutre, ~30 % de secondaire, ~10 % d'accent. Cet équilibre paraît naturellement pro.</div>
<h3>6. Cohérence via le thème</h3>
<p>Applique toujours tailles, polices et couleurs via le <strong>masque</strong> et le <strong>thème</strong> (jours 2 et 3) plutôt qu'à la main. Ainsi la hiérarchie reste identique sur tout le deck et se modifie en un point.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que la hiérarchie visuelle ?", opts: ["La liste des diapos", "L'ordre dans lequel l'oeil parcourt une diapo, créé par le contraste", "Un type d'animation", "Le nombre de couleurs"], a: 1, exp: "Elle guide le regard grâce au contraste de taille, graisse, couleur." },
    { type: "qcm", q: "Comment renforcer un titre sans changer sa taille ?", opts: ["Le souligner", "Augmenter sa graisse (semibold/bold)", "Le mettre en italique fin", "Réduire l'interligne"], a: 1, exp: "La graisse hiérarchise sans modifier la taille." },
    { type: "vf", q: "Si tout le texte est gros et gras, l'élément important ressort mieux.", a: false, exp: "Le contraste disparaît : plus rien ne ressort quand tout est fort." },
    { type: "qcm", q: "Combien de tailles distinctes privilégier dans une échelle typo simple ?", opts: ["Une dizaine", "Trois bien distinctes (titre/sous-titre/corps)", "Deux identiques", "Autant que de mots"], a: 1, exp: "Trois niveaux clairs valent mieux que dix tailles proches." },
    { type: "qcm", q: "Quelle taille de corps est un plancher raisonnable en projection ?", opts: ["8 pt", "12 pt", "18 pt", "6 pt"], a: 2, exp: "En dessous de 18 pt, le corps devient difficile à lire de loin." },
    { type: "vf", q: "Les capitales ralentissent la lecture et conviennent surtout aux titres courts.", a: true, exp: "Le tout-capitales fatigue l'oeil sur de longs textes." },
    { type: "qcm", q: "Pourquoi éviter le souligné pour insister sur diapo ?", opts: ["Il est illisible", "Il évoque un lien cliquable", "Il est interdit", "Il ralentit le diaporama"], a: 1, exp: "Le souligné suggère un hyperlien : préfère gras ou couleur." },
    { type: "qcm", q: "Quel ratio de contraste minimal recommande l'accessibilité (WCAG) pour le texte courant ?", opts: ["1:1", "2:1", "4,5:1", "10:1"], a: 2, exp: "4,5:1 assure une lecture confortable pour la plupart des gens." },
    { type: "qcm", q: "Où vérifier les contrastes faibles dans PowerPoint ?", opts: ["Transitions", "Révision ▸ Vérifier l'accessibilité", "Insertion ▸ Objet", "Fichier ▸ Imprimer"], a: 1, exp: "Le vérificateur d'accessibilité signale les contrastes insuffisants." },
    { type: "vf", q: "Une couleur d'accent est plus efficace quand elle est utilisée partout.", a: false, exp: "Utilisée partout, elle perd son pouvoir : l'accent vit de la rareté." },
    { type: "qcm", q: "Que dit la règle 60-30-10 ?", opts: ["60 diapos, 30 titres, 10 images", "~60 % dominante/neutre, ~30 % secondaire, ~10 % accent", "60 pt titre, 30 corps, 10 notes", "Rien d'utile"], a: 1, exp: "Cet équilibre de proportions donne un rendu naturellement pro." },
    { type: "qcm", q: "L'interligne, c'est…", opts: ["L'espace entre les caractères", "L'espace entre les lignes de texte", "La taille de police", "La graisse"], a: 1, exp: "Interligne = espace vertical entre lignes ; interlettrage = entre caractères." },
    { type: "vf", q: "Appliquer tailles et couleurs via le masque/thème garantit une hiérarchie cohérente sur tout le deck.", a: true, exp: "Centraliser dans le thème assure cohérence et modifiabilité." },
    { type: "qcm", q: "Quel raccourci agrandit la police d'un cran ?", opts: ["Ctrl + G", "Ctrl + Maj + >", "Ctrl + U", "Alt + T"], a: 1, exp: "Ctrl + Maj + > agrandit, Ctrl + Maj + < réduit." },
    { type: "vf", q: "Deux couleurs vives de luminosité proche assurent un bon contraste de lecture.", a: false, exp: "Il faut un écart de luminosité : clair sur sombre ou l'inverse." }
  ],
  final: {
    title: "Exercice final — Réparer une diapo illisible",
    intro: `<p>On te montre une diapo : titre 20 pt gris clair sur fond blanc, corps 14 pt, trois couleurs vives réparties au hasard, mots-clés soulignés. Objectif : rétablir une hiérarchie claire et lisible.</p>`,
    questions: [
      { type: "qcm", q: "Premier problème du titre ?", opts: ["Trop grand", "Trop petit et trop peu contrasté (20 pt gris clair sur blanc)", "Trop coloré", "Souligné"], a: 1, exp: "Un titre doit être plus grand et bien contrasté." },
      { type: "qcm", q: "Comment traiter les mots-clés soulignés ?", opts: ["Les souligner plus", "Remplacer le souligné par du gras ou la couleur d'accent", "Les mettre en capitales", "Les supprimer"], a: 1, exp: "Gras/couleur insistent sans évoquer un lien." },
      { type: "vf", q: "Réduire les trois couleurs vives à une seule couleur d'accent + des neutres améliorera la hiérarchie.", a: true, exp: "Une palette sobre laisse l'accent guider l'oeil." },
      { type: "qcm", q: "Corps à 14 pt en projection : que faire ?", opts: ["Le laisser", "Le remonter à ~18-24 pt", "Le passer à 8 pt", "Le souligner"], a: 1, exp: "18-24 pt assure la lisibilité de loin." },
      { type: "qcm", q: "Comment vérifier objectivement le contraste ?", opts: ["À l'oeil seulement", "Révision ▸ Vérifier l'accessibilité", "F5", "Insertion ▸ Objet"], a: 1, exp: "Le vérificateur signale les ratios trop faibles." }
    ],
    solution: `<p>Plan de correction :</p>
<pre class="pseudo">1  Titre : 36-40 pt, couleur sombre bien contrastée sur le fond blanc (ratio >= 4,5:1)
2  Corps : 18-24 pt, une seule couleur neutre
3  Palette : garder UNE couleur d'accent (thème), passer le reste en neutres
4  Mots-clés : retirer le souligné, appliquer gras ou couleur d'accent
5  Appliquer la règle 60-30-10 et vérifier l'interligne (aération)
6  Révision ▸ Vérifier l'accessibilité pour valider les contrastes
7  Reporter idéalement ces réglages dans le masque pour tout le deck</pre>
<p>La diapo devient lisible et hiérarchisée : l'oeil sait où aller.</p>`
  }
};
</script>
