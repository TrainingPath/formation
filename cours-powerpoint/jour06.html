<script>
var DAY = {
  num: 6,
  title: "Images pro : recadrage, compression, arrière-plan",
  subtitle: "Traiter les visuels comme un pro : cadrage, poids, détourage.",
  theory: `
<h3>1. Une image bien cadrée raconte mieux</h3>
<p>Le <strong>recadrage</strong> (crop) consiste à masquer les bords d'une image pour ne garder que l'essentiel, sans la déformer. Il ne supprime pas les pixels par défaut : il les cache. On recadre pour cadrer un sujet, uniformiser des proportions ou remplir une zone.</p>
<pre class="pseudo">Format de l'image ▸ Taille ▸ Rogner
Rogner ▸ (flèche) ▸ Rogner à la forme        // rogne dans un cercle, une flèche…
Rogner ▸ Rapport hauteur/largeur ▸ 16:9      // proportions imposées</pre>
<div class="warn">Ne jamais étirer une photo pour la déformer : garde le rapport en tirant par un coin (pas par un bord). Une personne écrasée ou allongée trahit un amateur.</div>
<h3>2. Remplir un cadre sans déformer</h3>
<p>Deux modes pour ajuster une image à un cadre : <strong>Remplir</strong> (l'image couvre tout, on rogne le surplus) et <strong>Ajuster</strong> (l'image entière tient, avec des bandes vides éventuelles).</p>
<pre class="pseudo">Format de l'image ▸ Rogner ▸ Remplir  /  Ajuster</pre>
<h3>3. Compresser pour alléger le fichier</h3>
<p>La <strong>compression</strong> réduit la résolution des images pour diminuer le poids du fichier. Elle peut aussi <strong>supprimer les zones rognées</strong> (les pixels cachés), ce qui allège vraiment.</p>
<pre class="pseudo">Format de l'image ▸ Compresser les images
   Résolution : 96/150/220 ppp (écran/impression) ; 330 ppp = haute déf
   (cocher) Supprimer les zones de rognage des images</pre>
<div class="tip">Pour une projection, 150 ppp suffisent largement. Décoche « Appliquer à cette image uniquement » pour compresser tout le deck d'un coup.</div>
<h3>4. Supprimer l'arrière-plan (détourage)</h3>
<p>La fonction <strong>Supprimer l'arrière-plan</strong> détoure un sujet en effaçant le fond automatiquement, puis on affine à la main avec « Marquer les zones à conserver / supprimer ».</p>
<pre class="pseudo">Format de l'image ▸ Supprimer l'arrière-plan
   Marquer les zones à conserver / à supprimer ▸ Conserver les modifications</pre>
<h3>5. Corrections, couleur, effets artistiques</h3>
<pre class="pseudo">Format de l'image ▸ Corrections    // luminosité, netteté, contraste
Format de l'image ▸ Couleur        // saturation, nuance, recolorier (teinte de marque)
Format de l'image ▸ Effets artistiques   // aquarelle, flou… (à doser)</pre>
<p>Recolorier une image dans une couleur de thème l'harmonise avec la marque. Les effets artistiques s'utilisent avec parcimonie.</p>
<h3>6. Résolution, format et nouveautés</h3>
<p>Préfère des images nettes (au moins la taille d'affichage) et des formats adaptés : <strong>JPG</strong> pour les photos, <strong>PNG</strong> pour les visuels à fond transparent, <strong>SVG</strong> pour les icônes vectorielles (net à toute taille). Microsoft 365 ajoute des images de stock et icônes libres de droits (Insertion ▸ Images ▸ Images d'archive) ; en 2021 la banque est plus limitée, en 2019 elle est quasi absente.</p>
<div class="tip">Une image floue agrandie ne se rattrape pas. Pars toujours d'une source de résolution suffisante.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait le recadrage (rognage) par défaut ?", opts: ["Il supprime définitivement les pixels", "Il masque les bords sans supprimer les pixels", "Il déforme l'image", "Il change les couleurs"], a: 1, exp: "Le rognage cache les bords ; les pixels restent tant qu'on ne compresse pas." },
    { type: "vf", q: "Tirer une image par un coin conserve ses proportions.", a: true, exp: "Le coin garde le rapport ; un bord déforme l'image." },
    { type: "qcm", q: "Différence entre Remplir et Ajuster dans le rognage ?", opts: ["Aucune", "Remplir couvre tout en rognant le surplus ; Ajuster montre toute l'image avec bandes éventuelles", "Remplir déforme, Ajuster aussi", "Ajuster supprime l'image"], a: 1, exp: "Remplir = couvre et rogne ; Ajuster = image entière visible." },
    { type: "qcm", q: "Que permet la compression des images ?", opts: ["Augmenter la résolution", "Réduire le poids du fichier et supprimer les zones rognées", "Ajouter des couleurs", "Créer une animation"], a: 1, exp: "Elle baisse la résolution et peut effacer les pixels cachés." },
    { type: "vf", q: "Cocher Supprimer les zones de rognage allège réellement le fichier.", a: true, exp: "Les pixels cachés sont alors effacés définitivement." },
    { type: "qcm", q: "Quelle résolution suffit pour une simple projection ?", opts: ["50 ppp", "150 ppp", "600 ppp", "1200 ppp"], a: 1, exp: "150 ppp offrent un bon compromis netteté/poids à l'écran." },
    { type: "qcm", q: "Que fait Supprimer l'arrière-plan ?", opts: ["Efface toute l'image", "Détoure le sujet en effaçant le fond", "Change le thème", "Compresse l'image"], a: 1, exp: "Elle isole le sujet du fond, avec affinage manuel possible." },
    { type: "qcm", q: "Quel format privilégier pour une image à fond transparent ?", opts: ["JPG", "PNG", "BMP", "GIF animé"], a: 1, exp: "Le PNG gère la transparence ; le JPG non." },
    { type: "vf", q: "Le SVG est un format vectoriel net à toute taille, idéal pour les icônes.", a: true, exp: "Le vectoriel ne pixelise pas quand on l'agrandit." },
    { type: "qcm", q: "Comment harmoniser une photo avec la couleur de marque ?", opts: ["La déformer", "Format de l'image ▸ Couleur ▸ Recolorier dans une couleur de thème", "La compresser", "La faire clignoter"], a: 1, exp: "Recolorier dans une teinte de thème unifie l'ambiance visuelle." },
    { type: "qcm", q: "Où trouver des images de stock libres de droits en Microsoft 365 ?", opts: ["Transitions", "Insertion ▸ Images ▸ Images d'archive", "Fichier ▸ Imprimer", "Révision"], a: 1, exp: "Les Images d'archive (stock) sont riches en 365, limitées en 2021." },
    { type: "vf", q: "Une image floue agrandie retrouve sa netteté une fois projetée.", a: false, exp: "Une source insuffisante reste floue : impossible d'inventer des pixels." },
    { type: "qcm", q: "Comment rogner une image dans un cercle ?", opts: ["Impossible", "Rogner ▸ Rogner à la forme ▸ choisir le cercle", "Insertion ▸ Objet", "Transitions"], a: 1, exp: "Rogner à la forme applique n'importe quelle silhouette au visuel." },
    { type: "qcm", q: "Pour compresser tout le deck d'un coup, il faut…", opts: ["Compresser image par image", "Décocher Appliquer à cette image uniquement", "Supprimer les images", "Changer de thème"], a: 1, exp: "Décocher l'option applique la compression à toutes les images." },
    { type: "vf", q: "Les effets artistiques s'appliquent idéalement à toutes les images pour un look chargé.", a: false, exp: "Ils se dosent avec parcimonie, sous peine de rendu kitsch." }
  ],
  final: {
    title: "Exercice final — Nettoyer un deck lourd et déformé",
    intro: `<p>Un fichier de 80 Mo contient des photos étirées, un portrait à détourer et beaucoup de zones rognées non supprimées. Objectif : alléger et rendre les visuels propres pour une projection.</p>`,
    questions: [
      { type: "qcm", q: "Photos étirées : comment les corriger sans déformer ?", opts: ["Tirer par un bord", "Réinitialiser les proportions puis rogner/ajuster par un coin", "Les compresser", "Les recolorier"], a: 1, exp: "On rétablit le rapport et on cadre par un coin." },
      { type: "qcm", q: "Pour alléger vraiment les 80 Mo, on…", opts: ["Change de thème", "Compresse les images (150 ppp) + coche Supprimer les zones de rognage", "Supprime des diapos", "Ajoute des transitions"], a: 1, exp: "Compression + suppression des pixels cachés réduisent fortement le poids." },
      { type: "vf", q: "Supprimer l'arrière-plan permet d'isoler proprement le portrait.", a: true, exp: "Le détourage retire le fond du portrait." },
      { type: "qcm", q: "Compresser tout le deck d'un coup nécessite de…", opts: ["Compresser chaque image", "Décocher Appliquer à cette image uniquement", "Rien de spécial", "Passer en PDF"], a: 1, exp: "Décocher applique la compression à l'ensemble." },
      { type: "qcm", q: "Pour harmoniser les visuels avec la charte, on peut…", opts: ["Les déformer", "Recolorier dans une couleur de thème", "Les flouter tous", "Les agrandir au max"], a: 1, exp: "Recolorier dans une teinte de thème unifie l'ensemble." }
    ],
    solution: `<p>Assainissement du deck :</p>
<pre class="pseudo">1  Photos déformées : Format ▸ Réinitialiser l'image (proportions) puis Rogner ▸ Remplir par un coin
2  Portrait : Format ▸ Supprimer l'arrière-plan ▸ affiner ▸ Conserver les modifications
3  (option) Format ▸ Couleur ▸ Recolorier dans une couleur de thème pour l'harmonie
4  Format ▸ Compresser les images ▸ 150 ppp ▸ cocher Supprimer les zones de rognage
5  Décocher Appliquer à cette image uniquement ▸ OK (tout le deck)
6  Enregistrer et comparer le poids du fichier</pre>
<p>Les visuels deviennent nets, cadrés et le fichier fond de plusieurs dizaines de Mo.</p>`
  }
};
</script>
