var DAY = {
  num: 12,
  title: "EtherChannel (agrégation de liens)",
  subtitle: "Regrouper plusieurs câbles en un seul lien logique plus rapide.",
  theory: `
<h3>1. Le problème : un seul lien ne suffit plus</h3>
<p>Entre deux switchs qui échangent beaucoup de trafic (par exemple vers le cœur du réseau), un seul câble peut devenir un goulot d'étranglement. On pourrait en brancher plusieurs en parallèle, mais STP les verrait comme une boucle et en bloquerait tous sauf un ! Résultat : la bande passante n'augmente pas. La solution s'appelle <strong>EtherChannel</strong> (aussi nommé <em>link aggregation</em> ou <em>port-channel</em>).</p>
<p>Image : une seule caisse de supermarché sature vite. En ouvrir plusieurs et les gérer comme une file unique multiplie le débit sans créer de confusion. EtherChannel regroupe 2 à 8 liens physiques en <strong>un seul lien logique</strong> que STP considère comme un unique câble.</p>
<h3>2. Ce que EtherChannel apporte</h3>
<p>Deux bénéfices majeurs : d'abord l'<strong>agrégation de bande passante</strong> (les débits s'additionnent, ex. 4 liens 1 Gbit/s = jusqu'à 4 Gbit/s cumulés) ; ensuite la <strong>redondance</strong> : si un câble du groupe tombe, le trafic continue sur les autres sans que STP recalcule tout l'arbre. Du point de vue de STP et des VLAN, le groupe est <strong>une seule interface logique</strong> appelée <strong>port-channel</strong>.</p>
<div class="tip">Le trafic est réparti sur les liens du groupe selon un algorithme de <em>load-balancing</em> (par MAC, IP ou ports source/destination). Un même « flux » emprunte toujours le même câble physique, ce qui évite le désordre des paquets.</div>
<h3>3. Négocier le groupe : LACP et PAgP</h3>
<p>Pour former le faisceau, les deux switchs doivent se mettre d'accord. Deux protocoles de négociation existent :</p>
<pre class="pseudo"># LACP (Link Aggregation Control Protocol) - NORME OUVERTE 802.3ad
#   modes : active  (propose activement)
#           passive (attend qu'on lui propose)
# PAgP (Port Aggregation Protocol) - PROPRIETAIRE CISCO
#   modes : desirable (propose activement)
#           auto      (attend qu'on lui propose)
# Mode "on" : force le groupe SANS negociation (des deux cotes)</pre>
<p><strong>LACP</strong> est la norme ouverte (IEEE 802.3ad), interopérable entre constructeurs : à privilégier. <strong>PAgP</strong> est propriétaire Cisco. Pour que le groupe se forme, il faut une combinaison valide : <em>active/active</em>, <em>active/passive</em> (LACP) ; <em>desirable/desirable</em>, <em>desirable/auto</em> (PAgP). Deux côtés en <em>passive</em> (ou deux en <em>auto</em>) ne formeront jamais le groupe.</p>
<h3>4. Configuration avec channel-group</h3>
<p>On regroupe les interfaces physiques sous un même numéro de groupe avec la commande <strong>channel-group</strong>, puis on configure les paramètres communs (VLAN, trunk…) sur l'interface logique <strong>port-channel</strong>.</p>
<pre class="pseudo">Switch(config)# interface range gi0/1 - 2
Switch(config-if-range)# channel-group 1 mode active
! (mode active = LACP) -> cree automatiquement Port-channel 1
Switch(config)# interface port-channel 1
Switch(config-if)# switchport mode trunk
Switch(config-if)# switchport trunk allowed vlan 10,20
! Verification :
Switch# show etherchannel summary</pre>
<div class="warn">Piège : tous les ports d'un même EtherChannel doivent avoir des réglages IDENTIQUES (même vitesse, même duplex, mêmes VLAN, même mode access/trunk). La moindre différence empêche le port de rejoindre le groupe. Configure de préférence sur l'interface port-channel, pas port par port.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># EtherChannel : 2 a 8 liens -> 1 lien logique (port-channel)
# Buts : + de bande passante ET redondance ; STP voit 1 seul lien
# LACP (802.3ad, ouvert) : modes active / passive
# PAgP (Cisco) : modes desirable / auto
# on = pas de negociation
# channel-group 1 mode active   |   show etherchannel summary
# Tous les ports du groupe : reglages identiques</pre>`,
  exercises: [
    { type: "qcm", q: "Que permet EtherChannel ?", opts: ["Router entre VLAN", "Regrouper plusieurs liens en un seul lien logique", "Chiffrer le trafic", "Attribuer des IP"], a: 1, exp: "EtherChannel agrège 2 à 8 liens physiques en un port-channel unique." },
    { type: "qcm", q: "Pourquoi ne peut-on pas simplement brancher 4 câbles en parallèle sans EtherChannel ?", opts: ["Les adresses MAC entrent en conflit", "STP verrait une boucle et bloquerait les liens en trop", "Ça double la latence", "Les VLAN disparaissent"], a: 1, exp: "STP considérerait les liens parallèles comme une boucle et en bloquerait tous sauf un." },
    { type: "input", q: "Comment s'appelle l'interface logique créée par un EtherChannel ?", a: ["port-channel", "portchannel", "port channel"], ph: "port-…", exp: "L'interface logique s'appelle port-channel (ou Po)." },
    { type: "qcm", q: "Quels sont les deux bénéfices majeurs d'EtherChannel ?", opts: ["Chiffrement et compression", "Bande passante agrégée et redondance", "Routage et NAT", "DHCP et DNS"], a: 1, exp: "Les débits s'additionnent et la panne d'un câble n'interrompt pas le lien." },
    { type: "vf", q: "Du point de vue de STP, un EtherChannel apparaît comme un seul lien.", a: true, exp: "Vrai : STP ne voit qu'une interface logique, il ne bloque donc pas les liens du groupe." },
    { type: "input", q: "Quel protocole d'agrégation est la NORME OUVERTE (IEEE 802.3ad) ?", a: ["lacp"], ph: "4 lettres", exp: "LACP (Link Aggregation Control Protocol) est standardisé et interopérable." },
    { type: "qcm", q: "Quel protocole d'agrégation est propriétaire Cisco ?", opts: ["LACP", "PAgP", "STP", "OSPF"], a: 1, exp: "PAgP (Port Aggregation Protocol) est propriétaire Cisco." },
    { type: "qcm", q: "Quels modes appartiennent à LACP ?", opts: ["desirable / auto", "active / passive", "on / off", "root / designated"], a: 1, exp: "LACP utilise active et passive ; PAgP utilise desirable et auto." },
    { type: "vf", q: "Deux switchs tous les deux en mode LACP passive formeront le groupe.", a: false, exp: "Faux : passive attend une proposition ; il faut au moins un côté active." },
    { type: "input", q: "Quelle commande d'interface crée le groupe 1 en LACP actif ? (ligne exacte)", a: ["channel-group 1 mode active"], ph: "channel-group …", exp: "channel-group 1 mode active regroupe les ports en LACP et crée Port-channel 1." },
    { type: "qcm", q: "Que fait le mode « on » ?", opts: ["Active LACP", "Force le groupe sans négociation", "Désactive le port", "Active PAgP"], a: 1, exp: "Le mode on forme l'EtherChannel sans protocole de négociation, des deux côtés." },
    { type: "vf", q: "Tous les ports d'un même EtherChannel doivent avoir vitesse, duplex et VLAN identiques.", a: true, exp: "Vrai : la moindre différence empêche un port de rejoindre le groupe." },
    { type: "qcm", q: "Combien de liens physiques peut-on regrouper dans un EtherChannel ?", opts: ["2 à 4", "2 à 8", "jusqu'à 16", "illimité"], a: 1, exp: "Un EtherChannel regroupe de 2 à 8 liens physiques actifs." },
    { type: "input", q: "Quelle commande affiche un résumé de l'état des EtherChannel ?", a: ["show etherchannel summary", "show etherchannel"], ph: "show etherchannel …", exp: "show etherchannel summary liste les groupes, leurs ports et leur état." },
    { type: "qcm", q: "Sur quelle interface configure-t-on de préférence les VLAN d'un EtherChannel ?", opts: ["Sur chaque port physique", "Sur l'interface port-channel", "Sur le port console", "Sur la SVI"], a: 1, exp: "On configure l'interface port-channel : les réglages se propagent au groupe." }
  ],
  final: {
    title: "Exercice final — Doubler la liaison de cœur",
    intro: `<p>Deux switchs sont reliés par les ports Gi0/1 et Gi0/2. Tu veux les agréger en un EtherChannel LACP qui transporte les VLAN 10 et 20 en trunk.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi agréger plutôt que garder deux liens séparés ?", opts: ["Pour économiser des câbles", "Pour additionner la bande passante et éviter que STP bloque un lien", "Pour chiffrer", "Pour supprimer les VLAN"], a: 1, exp: "EtherChannel additionne les débits et présente un seul lien à STP." },
      { type: "input", q: "Quelle commande, sur la plage gi0/1-2, crée le groupe 1 en LACP actif ?", a: ["channel-group 1 mode active"], ph: "channel-group …", exp: "channel-group 1 mode active." },
      { type: "qcm", q: "Quel mode côté opposé permet aussi de former le groupe LACP ?", opts: ["auto", "desirable", "active ou passive", "on seulement"], a: 2, exp: "En LACP : active/active ou active/passive fonctionnent." },
      { type: "vf", q: "Les paramètres trunk se configurent sur l'interface port-channel 1.", a: true, exp: "Vrai : on configure le port-channel, pas chaque port physique." },
      { type: "qcm", q: "Quelle commande vérifie que le groupe est bien monté ?", opts: ["show ip route", "show etherchannel summary", "show vlan brief", "show mac address-table"], a: 1, exp: "show etherchannel summary indique l'état (P = in port-channel)." }
    ],
    solution: `<pre class="pseudo">! --- Sur CHAQUE switch ---
interface range gi0/1 - 2
 channel-group 1 mode active      ! LACP
!
interface port-channel 1
 switchport mode trunk
 switchport trunk allowed vlan 10,20
! Verification :
show etherchannel summary</pre>
<p>Les deux liens forment un seul port-channel de bande passante doublée. Si Gi0/1 tombe, le trafic continue sur Gi0/2 sans reconvergence STP.</p>`
  }
};
