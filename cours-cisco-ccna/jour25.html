  subtitle: "Menaces, contrôle des accès et tunnels chiffrés qui protègent le réseau.",
  theory: `
<h3>1. Pourquoi la sécurité ? Les grandes menaces</h3>
<p>Un réseau d'entreprise est une cible permanente. La sécurité vise à protéger trois piliers, résumés par le sigle anglais <strong>CIA</strong> : <strong>Confidentiality</strong> (confidentialité : seuls les autorisés lisent la donnée), <strong>Integrity</strong> (intégrité : la donnée n'est pas altérée) et <strong>Availability</strong> (disponibilité : le service reste accessible). On parle aussi de la triade CIA.</p>
<p>Les attaques classiques du programme CCNA sont nombreuses. Un <strong>déni de service</strong> (en anglais <em>DoS</em>) sature un service pour le rendre indisponible ; en version distribuée depuis des milliers de machines, c'est un <em>DDoS</em>. L'<strong>hameçonnage</strong> (en anglais <em>phishing</em>) piège l'utilisateur avec un faux courriel. L'attaque de <strong>l'homme du milieu</strong> (en anglais <em>man-in-the-middle</em>) intercepte le trafic entre deux parties. L'<strong>usurpation</strong> (en anglais <em>spoofing</em>) falsifie une adresse IP ou MAC. Le <strong>maliciel</strong> (en anglais <em>malware</em>) regroupe virus, vers et rançongiciels.</p>
<div class="warn">Le maillon le plus faible reste l'humain. Beaucoup d'attaques passent par l'<strong>ingénierie sociale</strong> (en anglais <em>social engineering</em>) : on manipule une personne plutôt que de casser une machine.</div>
<h3>2. Terminologie : vulnérabilité, menace, exploit, risque</h3>
<p>Quatre mots à distinguer précisément. Une <strong>vulnérabilité</strong> (en anglais <em>vulnerability</em>) est une faiblesse. Une <strong>menace</strong> (en anglais <em>threat</em>) est un danger potentiel qui pourrait exploiter cette faiblesse. Un <strong>exploit</strong> est l'outil ou la technique concrète qui profite de la vulnérabilité. Le <strong>risque</strong> (en anglais <em>risk</em>) est la probabilité qu'une menace réussisse à travers une vulnérabilité.</p>
<pre class="pseudo"># Analogie de la maison
Vulnerabilite = une fenetre laissee ouverte
Menace        = un cambrioleur qui rode dans le quartier
Exploit       = l'echelle qu'il pose sous la fenetre
Risque        = la probabilite qu'il entre reellement</pre>
<h3>3. AAA : Authentification, Autorisation, Traçabilité</h3>
<p>Le contrôle des accès repose sur trois questions, réunies dans le sigle <strong>AAA</strong> (« triple A »). <strong>Authentication</strong> (authentification) : « qui es-tu ? » On prouve son identité (mot de passe, certificat, biométrie). <strong>Authorization</strong> (autorisation) : « qu'as-tu le droit de faire ? » On accorde des permissions. <strong>Accounting</strong> (traçabilité / comptabilité) : « qu'as-tu fait ? » On journalise les actions.</p>
<p>Sur les équipements Cisco, AAA délègue souvent la décision à un serveur central. Deux protocoles dominent : <strong>RADIUS</strong> (standard ouvert, port UDP, chiffre seulement le mot de passe) et <strong>TACACS+</strong> (propriétaire Cisco, TCP port 49, chiffre tout le paquet et sépare finement les trois A). TACACS+ est préféré pour administrer les équipements réseau.</p>
<div class="tip">Un bon moyen de retenir : l'<strong>authentification factorielle multiple</strong> (en anglais <em>MFA</em>, Multi-Factor Authentication) combine « ce que tu sais » (mot de passe), « ce que tu as » (téléphone) et « ce que tu es » (empreinte).</div>
<h3>4. Les VPN : un tunnel chiffré à travers Internet</h3>
<p>Un <strong>réseau privé virtuel</strong> (en anglais <em>VPN</em>, Virtual Private Network) crée un « tunnel » chiffré à travers un réseau public non fiable comme Internet. Les données voyagent protégées, comme dans un tube étanche traversant une piscine publique. On distingue deux grandes familles :</p>
<p>Le <strong>VPN site-à-site</strong> (en anglais <em>site-to-site</em>) relie deux réseaux entiers en permanence, typiquement deux bureaux d'une entreprise, via leurs routeurs ou pare-feux. Les utilisateurs ne configurent rien : le tunnel est monté entre les passerelles.</p>
<p>Le <strong>VPN d'accès distant</strong> (en anglais <em>remote-access</em>) connecte un utilisateur isolé (télétravailleur, nomade) au réseau de l'entreprise depuis son ordinateur, via un logiciel client comme Cisco AnyConnect. Il utilise souvent <strong>SSL/TLS</strong> pour traverser facilement les pare-feux.</p>
<pre class="pseudo"># Site-a-site : deux reseaux relies en permanence
[Siege LAN]===Routeur===((tunnel IPsec))===Routeur===[Agence LAN]
# Acces distant : un utilisateur nomade vers le siege
[Portable + client]---((tunnel SSL/IPsec))---[Pare-feu siege]</pre>
<h3>5. IPsec : le cadre de sécurisation du VPN</h3>
<p><strong>IPsec</strong> (en anglais <em>IP Security</em>) est la suite de protocoles la plus utilisée pour chiffrer les VPN site-à-site. Elle assure la confidentialité, l'intégrité et l'authentification des paquets IP. Ses composants clés : <strong>IKE</strong> (Internet Key Exchange) négocie et échange les clés en sécurité ; <strong>ESP</strong> (Encapsulating Security Payload) chiffre et authentifie la charge utile ; <strong>AH</strong> (Authentication Header) authentifie mais ne chiffre pas (donc rarement utilisé seul).</p>
<p>IPsec fonctionne en deux modes : le <strong>mode transport</strong> chiffre seulement les données (charge utile) et sert entre deux hôtes ; le <strong>mode tunnel</strong> chiffre le paquet IP entier et l'encapsule dans un nouveau paquet, mode standard des VPN site-à-site.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Triade CIA : Confidentialite - Integrite - Disponibilite
# Menaces : DoS/DDoS, phishing, MITM, spoofing, malware, ingenierie sociale
# AAA : Authentication (qui) - Authorization (droits) - Accounting (journal)
#   RADIUS (UDP, ouvert)  |  TACACS+ (TCP 49, Cisco, admin equipements)
# VPN : tunnel chiffre sur reseau public
#   Site-a-site  = reseau a reseau (routeurs), souvent IPsec
#   Acces distant = utilisateur a reseau (client), souvent SSL/TLS
# IPsec : IKE (cles) + ESP (chiffre) + AH (authentifie)
#   Mode tunnel = paquet IP entier (VPN site-a-site)</pre>`,
  exercises: [

    { type: "qcm", q: "Une attaque qui sature un service pour le rendre indisponible est un…", opts: ["Phishing", "Déni de service (DoS)", "Spoofing", "Man-in-the-middle"], a: 1, exp: "Le DoS vise la disponibilité en saturant la cible ; le DDoS est sa version distribuée." },

    { type: "input", q: "Quel protocole AAA, propriétaire Cisco, utilise TCP port 49 et chiffre tout le paquet ?", a: ["tacacs+", "tacacs", "tacacs plus"], ph: "un nom", exp: "TACACS+ (TCP 49) chiffre tout le paquet et sépare finement les trois A ; préféré pour l'administration." },
    { type: "qcm", q: "Un VPN qui relie en permanence deux réseaux entiers via leurs routeurs est de type…", opts: ["Accès distant (remote-access)", "Site-à-site (site-to-site)", "SSL personnel", "Point-à-point série"], a: 1, exp: "Le VPN site-à-site relie deux LAN via les passerelles ; l'utilisateur ne configure rien." },
    { type: "qcm", q: "Quel composant d'IPsec chiffre et authentifie la charge utile des paquets ?", opts: ["AH", "IKE", "ESP", "TLS"], a: 2, exp: "ESP (Encapsulating Security Payload) chiffre et authentifie. AH authentifie sans chiffrer." },
    { type: "vf", q: "Un VPN d'accès distant connecte typiquement un télétravailleur isolé au réseau de l'entreprise via un logiciel client.", a: true, exp: "Exact : le remote-access relie un utilisateur nomade au réseau, souvent avec un client comme AnyConnect." },
    { type: "input", q: "Comment appelle-t-on l'attaque qui manipule une personne plutôt qu'une machine (terme français) ?", a: ["ingenierie sociale", "l'ingenierie sociale", "social engineering"], ph: "deux mots", exp: "L'ingénierie sociale exploite l'humain, souvent maillon le plus faible." },
    { type: "qcm", q: "Dans la terminologie sécurité, une « fenêtre laissée ouverte » correspond à…", opts: ["Une menace", "Un exploit", "Une vulnérabilité", "Un risque"], a: 2, exp: "La vulnérabilité est la faiblesse. La menace est le danger, l'exploit l'outil, le risque la probabilité." },
    { type: "qcm", q: "Quel protocole AAA est un standard ouvert utilisant UDP et ne chiffrant que le mot de passe ?", opts: ["TACACS+", "RADIUS", "IPsec", "Kerberos"], a: 1, exp: "RADIUS (UDP, standard ouvert) ne chiffre que le mot de passe, pas tout le paquet." },
    { type: "vf", q: "Le mode tunnel d'IPsec chiffre le paquet IP entier et sert de standard aux VPN site-à-site.", a: true, exp: "Oui : le mode tunnel encapsule le paquet IP complet, mode habituel du site-à-site." },
    { type: "input", q: "Quel composant d'IPsec négocie et échange les clés de chiffrement en sécurité (sigle) ?", a: ["ike", "internet key exchange"], ph: "3 lettres", exp: "IKE (Internet Key Exchange) gère la négociation et l'échange des clés." },
    { type: "qcm", q: "Une attaque MFA combine plusieurs facteurs. Lequel relève de « ce que tu es » ?", opts: ["Un mot de passe", "Un code reçu par SMS", "Une empreinte digitale", "Une carte à puce"], a: 2, exp: "La biométrie (empreinte) = « ce que tu es ». Mot de passe = « ce que tu sais », téléphone/carte = « ce que tu as »." },
    { type: "qcm", q: "Le troisième A de AAA (Accounting) sert à…", opts: ["Prouver l'identité", "Accorder des permissions", "Journaliser ce que l'utilisateur a fait", "Chiffrer le trafic"], a: 2, exp: "L'Accounting (traçabilité) journalise les actions : « qu'as-tu fait ? »." },
    { type: "vf", q: "Les VPN d'accès distant utilisent fréquemment SSL/TLS pour traverser plus facilement les pare-feux.", a: true, exp: "Exact : SSL/TLS passe par des ports web usuels, ce qui facilite la traversée des pare-feux." }
  ],
  final: {
    title: "Exercice final — Sécuriser deux bureaux et un télétravailleur",
    intro: `<p>L'entreprise Nova a un siège et une agence, plus des télétravailleurs. Elle veut chiffrer les échanges et centraliser l'authentification des administrateurs. Aide l'équipe à choisir les bonnes technologies.</p>`,
    questions: [
      { type: "qcm", q: "Pour relier en permanence les LAN du siège et de l'agence via Internet, on choisit…", opts: ["Un VPN d'accès distant par client", "Un VPN site-à-site IPsec entre les routeurs", "Un tunnel GRE simple, sans chiffrement", "Le protocole TACACS+"], a: 1, exp: "Deux réseaux reliés en permanence = VPN site-à-site, généralement IPsec en mode tunnel." },

      { type: "input", q: "Quel sigle regroupe l'Authentification, l'Autorisation et la Traçabilité centralisées ?", a: ["aaa", "triple a"], ph: "3 lettres", exp: "AAA : Authentication, Authorization, Accounting." },
      { type: "qcm", q: "Pour administrer finement les équipements réseau et chiffrer tout le paquet d'authentification, Nova préfère…", opts: ["RADIUS", "TACACS+", "AH", "Kerberos"], a: 1, exp: "TACACS+ (Cisco, TCP 49) chiffre tout le paquet et sépare les trois A ; idéal pour l'admin réseau." },
      { type: "vf", q: "En mode tunnel, IPsec chiffre le paquet IP entier avant de l'envoyer entre les deux sites.", a: true, exp: "Oui : le mode tunnel encapsule et chiffre le paquet IP complet, base du VPN site-à-site." }

    solution: `<pre class="pseudo"># Architecture de securite retenue chez Nova

<p>Confidentialité et intégrité assurées par IPsec/ESP, accès centralisé par AAA/TACACS+ : le réseau de Nova est protégé de bout en bout.</p>`
