<script>
var DAY = {
  num: 19,
  title: "Les listes de contrôle d'accès (ACL)",
  subtitle: "Le videur du réseau : décider paquet par paquet qui passe et qui est refusé.",
  theory: `
<h3>1. À quoi sert une ACL ?</h3>
<p>Une <strong>ACL</strong> (« Access Control List », liste de contrôle d'accès) est une suite de règles <strong>permit</strong> / <strong>deny</strong> qu'un routeur applique au trafic. C'est le videur à l'entrée d'une boîte : il compare chaque paquet à sa liste, de haut en bas, et applique la <strong>première règle qui correspond</strong>. Les ACL servent au filtrage de sécurité, mais aussi à désigner du trafic pour d'autres fonctions (NAT, QoS, VPN).</p>
<div class="warn">Toute ACL se termine par un <strong>deny any</strong> implicite invisible : si aucune règle ne correspond, le paquet est <strong>refusé</strong>. Il faut donc au moins une instruction <strong>permit</strong>, sinon tout est bloqué.</div>
<h3>2. Standard ou étendue ?</h3>
<p>Une ACL <strong>standard</strong> ne filtre que sur l'<strong>adresse IP source</strong>. Simple, mais grossière. Une ACL <strong>étendue</strong> (en anglais <em>extended</em>) filtre sur <strong>source ET destination</strong>, le <strong>protocole</strong> (TCP, UDP, ICMP…) et les <strong>numéros de port</strong> (ex. port 80, 22, 443). Elle est bien plus précise.</p>
<pre class="pseudo"># Plages de numeros (ACL numerotees) :
# Standard         : 1-99   (et 1300-1999)
# Etendue          : 100-199 (et 2000-2699)</pre>
<h3>3. Numérotées ou nommées ?</h3>
<p>Une ACL <strong>numérotée</strong> est identifiée par un nombre. Une ACL <strong>nommée</strong> porte un nom explicite (ex. BLOQUER_INVITES), plus lisible, et permet de supprimer une ligne précise par son numéro de séquence. Les deux font le même travail.</p>
<pre class="pseudo"># Numerotee standard
R1(config)# access-list 10 permit 192.168.1.0 0.0.0.255
R1(config)# access-list 10 deny   any

# Nommee etendue
R1(config)# ip access-list extended WEB_ONLY
R1(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 80
R1(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 443
R1(config-ext-nacl)# deny   ip any any</pre>
<h3>4. Le masque générique (wildcard) dans les ACL</h3>
<p>Comme en OSPF, les ACL utilisent un <strong>masque générique</strong> (wildcard). Bit <strong>0</strong> = « doit correspondre », bit <strong>1</strong> = « peu importe ». Deux mots-clés raccourcis existent :</p>
<pre class="pseudo"># host 10.1.1.1   equivaut a   10.1.1.1 0.0.0.0   (un seul hote)
# any             equivaut a   0.0.0.0 255.255.255.255 (tout le monde)
# 192.168.1.0 0.0.0.255  = tout le /24
# 172.16.0.0  0.0.255.255 = tout le /16</pre>
<div class="tip">Wildcard = 255.255.255.255 − masque de sous-réseau. Un /24 (255.255.255.0) donne un wildcard 0.0.0.255.</div>
<h3>5. Où et comment appliquer une ACL ?</h3>
<p>Une ACL ne filtre rien tant qu'elle n'est pas <strong>appliquée à une interface</strong> dans un sens (<strong>in</strong> = trafic entrant, <strong>out</strong> = trafic sortant) avec <code>ip access-group</code>. Règle de placement de Cisco :</p>
<pre class="pseudo"># ACL STANDARD  -> au plus PRES de la DESTINATION
#   (car elle ne connait que la source, la placer trop tot bloquerait trop)
# ACL ETENDUE   -> au plus PRES de la SOURCE
#   (on stoppe le trafic indesirable au plus tot, avant qu'il traverse le reseau)
R1(config)# interface GigabitEthernet0/1
R1(config-if)# ip access-group 10 out</pre>
<h3>6. Vérifier une ACL</h3>
<pre class="pseudo">show access-lists            # toutes les ACL + compteurs de correspondance
show ip access-lists         # seulement les ACL IP
show ip interface Gi0/1      # indique quelle ACL est appliquee, in ou out</pre>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ACL = regles permit/deny, lues de HAUT en BAS, 1re correspondance appliquee
# deny any IMPLICITE a la fin -> il faut au moins un permit
# Standard  : source seule  (num 1-99)     -> pres de la DESTINATION
# Etendue   : src+dst+proto+port (100-199) -> pres de la SOURCE
# Wildcard : 0=doit matcher, 1=ignore ; host = /32 ; any = tout
# Appliquer : ip access-group NUM {in|out} sur une interface</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quel critère une ACL standard filtre-t-elle ?", opts: ["Source et destination", "L'adresse IP source uniquement", "Le port TCP", "L'adresse MAC"], a: 1, exp: "Une ACL standard ne filtre que sur l'adresse IP source." },
    { type: "qcm", q: "Que peut filtrer une ACL étendue en plus de la source ?", opts: ["Rien de plus", "Destination, protocole et numéros de port", "Uniquement le VLAN", "La bande passante"], a: 1, exp: "Une ACL étendue filtre source, destination, protocole (TCP/UDP/ICMP) et ports." },
    { type: "qcm", q: "Quelle plage de numéros correspond aux ACL standard classiques ?", opts: ["1-99", "100-199", "200-299", "300-399"], a: 0, exp: "1-99 (et 1300-1999) pour standard ; 100-199 (et 2000-2699) pour étendue." },
    { type: "vf", q: "À la fin de toute ACL se trouve un « deny any » implicite.", a: true, exp: "Vrai : si aucune règle ne correspond, le paquet est refusé. Il faut donc au moins un permit." },
    { type: "input", q: "Dans un masque générique (wildcard), que signifie un bit à 0 ?", a: ["doit correspondre", "correspondance exacte", "doit matcher", "bit exact"], ph: "en quelques mots", exp: "Bit 0 = ce bit doit correspondre exactement ; bit 1 = peu importe." },
    { type: "qcm", q: "Quel mot-clé équivaut à « 0.0.0.0 255.255.255.255 » ?", opts: ["host", "any", "all", "no"], a: 1, exp: "any = n'importe quelle adresse (wildcard tout à 1)." },
    { type: "qcm", q: "Le mot-clé « host 10.1.1.1 » équivaut à…", opts: ["10.1.1.1 0.0.0.255", "10.1.1.1 0.0.0.0", "10.1.1.0 0.0.0.255", "any"], a: 1, exp: "host X = X 0.0.0.0 : correspondance exacte d'une seule adresse." },
    { type: "qcm", q: "Où Cisco recommande-t-il de placer une ACL étendue ?", opts: ["Au plus près de la destination", "Au plus près de la source", "N'importe où", "Sur l'interface WAN vers Internet"], a: 1, exp: "L'ACL étendue se place près de la source pour stopper tôt le trafic indésirable." },
    { type: "qcm", q: "Où placer de préférence une ACL standard ?", opts: ["Au plus près de la source", "Au plus près de la destination", "Sur toutes les interfaces", "Sur l'interface de sortie vers Internet"], a: 1, exp: "Ne connaissant que la source, la standard se place près de la destination pour ne pas trop bloquer." },
    { type: "input", q: "Quelle commande applique l'ACL 10 en sortie sur une interface ? (commande complète)", a: ["ip access-group 10 out", "ipaccess-group 10 out"], ph: "ip access-group ...", exp: "ip access-group 10 out applique l'ACL 10 au trafic sortant de l'interface." },
    { type: "vf", q: "Une ACL configurée mais non appliquée à une interface filtre déjà le trafic.", a: false, exp: "Faux : tant qu'aucun ip access-group ne la lie à une interface, elle ne filtre rien." },
    { type: "qcm", q: "Quelle commande affiche les ACL avec leurs compteurs de correspondance ?", opts: ["show vlan", "show access-lists", "show cdp neighbors", "show interfaces status"], a: 1, exp: "show access-lists affiche les règles et le nombre de paquets correspondant à chacune." },
    { type: "input", q: "Quel wildcard cible tout le réseau 192.168.1.0/24 ?", a: ["0.0.0.255", "0 0 0 255"], ph: "a.b.c.d", exp: "Un /24 correspond au wildcard 0.0.0.255." },
    { type: "vf", q: "Les règles d'une ACL sont évaluées de haut en bas, la première correspondance étant appliquée.", a: true, exp: "Vrai : dès qu'une règle correspond, elle s'applique et l'évaluation s'arrête." },
    { type: "qcm", q: "Dans « permit tcp 192.168.1.0 0.0.0.255 any eq 80 », que signifie « eq 80 » ?", opts: ["Exactement 80 hôtes", "Le port de destination TCP 80 (HTTP)", "Une distance administrative", "Le VLAN 80"], a: 1, exp: "eq 80 cible le port de destination 80 (HTTP)." }
  ],
  final: {
    title: "Exercice final — Autoriser seulement le web pour un LAN",
    intro: `<p>Le LAN 192.168.10.0/24 est branché sur Gi0/0 de R1. On veut que ce LAN puisse joindre Internet <strong>uniquement</strong> en HTTP (80) et HTTPS (443), et que tout le reste soit refusé. R1 sort vers Internet par Gi0/1.</p>`,
    questions: [
      { type: "qcm", q: "Quel type d'ACL faut-il ici ?", opts: ["Standard, car on filtre la source", "Étendue, car on filtre le protocole et les ports", "Aucune, un routage suffit", "Une ACL MAC"], a: 1, exp: "Filtrer sur les ports 80/443 exige une ACL étendue." },
      { type: "qcm", q: "Où placer cette ACL étendue de préférence ?", opts: ["Près de la destination, sur Internet", "Près de la source : en entrée de Gi0/0", "Sur la loopback", "En sortie sur l'interface WAN"], a: 1, exp: "Étendue = près de la source, donc appliquée en in sur Gi0/0." },
      { type: "input", q: "Écris la ligne permit pour le HTTP (port 80) depuis ce LAN vers n'importe quelle destination.", a: ["permit tcp 192.168.10.0 0.0.0.255 any eq 80", "permit tcp 192.168.10.0 0.0.0.255 any eq www"], ph: "permit tcp ... eq 80", exp: "permit tcp 192.168.10.0 0.0.0.255 any eq 80." },
      { type: "vf", q: "Sans aucune ligne permit, le deny any implicite bloquerait tout le trafic.", a: true, exp: "Vrai : il faut au moins un permit, sinon le deny implicite final refuse tout." },
      { type: "qcm", q: "Quelle commande applique l'ACL nommée WEB en entrée de Gi0/0 ?", opts: ["ip access-group WEB out", "ip access-group WEB in", "access-class WEB in", "ip access-list WEB"], a: 1, exp: "ip access-group WEB in applique l'ACL en entrée de l'interface." }
    ],
    solution: `<pre class="pseudo">R1(config)# ip access-list extended WEB
R1(config-ext-nacl)# permit tcp 192.168.10.0 0.0.0.255 any eq 80
R1(config-ext-nacl)# permit tcp 192.168.10.0 0.0.0.255 any eq 443
R1(config-ext-nacl)# deny   ip any any            # explicite (optionnel, deja implicite)
R1(config-ext-nacl)# exit
R1(config)# interface GigabitEthernet0/0
R1(config-if)# ip access-group WEB in             # ACL etendue pres de la SOURCE
R1# show ip access-lists WEB                       # verifier + compteurs</pre>
<p>ACL étendue, appliquée en entrée au plus près de la source : le trafic non web est stoppé immédiatement, avant de traverser R1.</p>`
  }
};
</script>
