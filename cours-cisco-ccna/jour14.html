var DAY = {

  title: "La configuration d'un WLAN",
  subtitle: "Du SSID à la sécurité WPA2, en passant par le VLAN d'atterrissage.",
  theory: `
<h3>1. Qu'est-ce qu'un WLAN, côté configuration</h3>
<p>Sur un WLC, un <strong>WLAN</strong> est un réseau sans fil que l'on crée et diffuse. Il associe trois choses : un <strong>SSID</strong> (le nom visible), une <strong>politique de sécurité</strong> (comment on s'authentifie et on chiffre), et un <strong>VLAN d'atterrissage</strong> (où va le trafic une fois sur le réseau filaire). Configurer un WLAN, c'est répondre à trois questions : <em>comment s'appelle-t-il ? comment le protège-t-on ? où mène-t-il ?</em></p>
<h3>2. Le SSID : le nom du réseau</h3>
<p>Le <strong>SSID</strong> (<em>Service Set Identifier</em>) est le nom du réseau que les utilisateurs voient dans la liste des Wi-Fi disponibles (« WiFi-Bureau », « Invites-Hotel »…). Il peut être <strong>diffusé</strong> (visible) ou <strong>masqué</strong> (non annoncé, mais toujours détectable : ce n'est pas une vraie mesure de sécurité). Un même WLC peut publier <strong>plusieurs SSID</strong> simultanément, chacun avec sa propre sécurité et son propre VLAN.</p>
<div class="tip">Bonne pratique : un SSID pour le personnel (accès complet, VLAN interne) et un SSID « Invités » isolé (VLAN séparé, accès Internet uniquement). Masquer un SSID gêne les utilisateurs sans réellement arrêter un attaquant.</div>
<h3>3. La sécurité : de WEP à WPA3</h3>
<p>Le sans-fil voyage dans l'air : sans chiffrement, n'importe qui à portée peut écouter. Les standards de sécurité ont évolué :</p>
<pre class="pseudo"># WEP  (ancien)  : OBSOLETE, cassable en minutes -> NE PLUS UTILISER
# WPA            : transitoire (TKIP), depasse
# WPA2 (802.11i) : chiffrement AES-CCMP -> le standard solide actuel
# WPA3           : le plus recent, encore plus robuste (SAE)</pre>
<p><strong>WPA2</strong> (basé sur la norme 802.11i) utilise le chiffrement <strong>AES</strong> et reste la référence largement déployée. Il existe en deux variantes :</p>
<pre class="pseudo"># WPA2-Personal (PSK) : une phrase de passe partagee (Pre-Shared Key)
#   -> maison, petite entreprise
# WPA2-Enterprise (802.1X) : chaque utilisateur a ses identifiants,
#   verifies par un serveur RADIUS
#   -> entreprise, tracabilite par utilisateur</pre>
<div class="warn">Ne déploie plus jamais WEP : il est cryptographiquement cassé. Pour un usage domestique, WPA2-Personal (PSK) suffit ; en entreprise, préfère WPA2-Enterprise avec RADIUS pour authentifier chaque utilisateur individuellement.</div>
<h3>4. Associer le WLAN à un VLAN</h3>
<p>Une fois le client authentifié, son trafic doit rejoindre le bon réseau filaire. Sur le WLC, chaque WLAN est <strong>mappé à une interface / un VLAN</strong>. Ainsi le SSID « Personnel » débouche par exemple sur le VLAN 10 et le SSID « Invités » sur le VLAN 99, totalement séparé. Le tunnel CAPWAP achemine le trafic jusqu'au WLC, qui le dépose dans le VLAN choisi.</p>
<pre class="pseudo"># Etapes typiques de creation d'un WLAN sur un WLC :
# 1. Creer le WLAN et definir le SSID (ex. "Personnel")
# 2. Choisir la securite : WPA2 + AES, mode PSK ou 802.1X
# 3. (PSK) definir la phrase de passe  /  (802.1X) pointer le RADIUS
# 4. Mapper le WLAN a l'interface/VLAN (ex. VLAN 10)
# 5. Activer (enable) le WLAN et verifier la diffusion du SSID</pre>
<p>Côté commutateur, le port qui relie le WLC au réseau est en général un <strong>trunk 802.1Q</strong> pour transporter tous les VLAN des différents SSID.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WLAN = SSID (nom) + securite + VLAN d'atterrissage
# SSID : diffuse ou masque (masquer != securite)
# Securite : WEP (obsolete) &lt; WPA &lt; WPA2 (AES) &lt; WPA3
# WPA2-Personal = PSK (phrase partagee)
# WPA2-Enterprise = 802.1X + serveur RADIUS (par utilisateur)
# Chaque SSID -> son VLAN (ex. Personnel=VLAN10, Invites=VLAN99)</pre>`,
  exercises: [
    { type: "qcm", q: "Que désigne le SSID ?", opts: ["La clé de chiffrement", "Le nom du réseau Wi-Fi visible par les clients", "L'adresse MAC de l'AP", "Le numéro de VLAN"], a: 1, exp: "Le SSID (Service Set Identifier) est le nom du réseau sans fil affiché aux utilisateurs." },
    { type: "qcm", q: "Un WLAN associe trois éléments. Lesquels ?", opts: ["IP, masque, passerelle", "SSID, sécurité, VLAN", "STP, LACP, CAPWAP", "DNS, DHCP, NAT"], a: 1, exp: "Un WLAN = un SSID (nom) + une politique de sécurité + un VLAN d'atterrissage." },

    { type: "qcm", q: "Quel standard de sécurité Wi-Fi est aujourd'hui OBSOLÈTE et cassable ?", opts: ["WPA2", "WEP", "WPA3", "AES"], a: 1, exp: "WEP est cryptographiquement cassé et ne doit plus être utilisé." },
    { type: "input", q: "Quel standard de sécurité, basé sur 802.11i et le chiffrement AES, est la référence solide très répandue ?", a: ["wpa2", "wpa-2"], ph: "WPA…", exp: "WPA2 (802.11i, AES/CCMP) est le standard solide largement déployé." },

    { type: "qcm", q: "En WPA2-Personal, l'authentification repose sur…", opts: ["un serveur RADIUS", "une phrase de passe partagée (PSK)", "un certificat par machine", "l'adresse IP"], a: 1, exp: "WPA2-Personal utilise une clé pré-partagée (PSK) commune à tous." },
    { type: "input", q: "Quel serveur authentifie chaque utilisateur en WPA2-Enterprise (802.1X) ?", a: ["radius", "serveur radius"], ph: "un nom", exp: "WPA2-Enterprise s'appuie sur un serveur RADIUS pour l'authentification 802.1X." },
    { type: "vf", q: "WPA2-Enterprise permet d'identifier chaque utilisateur individuellement.", a: true, exp: "Vrai : chaque utilisateur a ses identifiants vérifiés par RADIUS, d'où la traçabilité." },
    { type: "qcm", q: "Pourquoi mapper un WLAN à un VLAN ?", opts: ["Pour accélérer le Wi-Fi", "Pour déposer le trafic sans fil dans le bon réseau filaire", "Pour masquer le SSID", "Pour désactiver le chiffrement"], a: 1, exp: "Le VLAN d'atterrissage détermine où va le trafic une fois sur le filaire." },
    { type: "qcm", q: "Une entreprise veut séparer les invités du personnel. Comment ?", opts: ["Un seul SSID pour tous", "Deux SSID, chacun mappé à un VLAN différent", "Désactiver les VLAN", "Utiliser WEP"], a: 1, exp: "Deux SSID (Personnel/Invités) sur des VLAN distincts isolent les trafics." },
    { type: "vf", q: "Un même WLC peut diffuser plusieurs SSID simultanément.", a: true, exp: "Vrai : chaque SSID a sa propre sécurité et son propre VLAN." },
    { type: "input", q: "Quel type de port relie généralement le WLC au switch pour transporter tous les VLAN ?", a: ["trunk", "trunk 802.1q", "port trunk"], ph: "un mot", exp: "Un trunk 802.1Q transporte les VLAN des différents SSID vers le WLC." },
    { type: "qcm", q: "Pour un usage domestique simple, quelle sécurité est adaptée ?", opts: ["WEP", "WPA2-Personal (PSK)", "Aucune", "WPA2-Enterprise avec RADIUS obligatoire"], a: 1, exp: "WPA2-Personal (PSK) suffit à la maison ; RADIUS est réservé à l'entreprise." },
    { type: "qcm", q: "Quel est le standard de sécurité le plus récent, plus robuste que WPA2 ?", opts: ["WPA3", "WEP2", "WPA1", "TKIP"], a: 0, exp: "WPA3 est la génération la plus récente, avec SAE remplaçant la PSK classique." }
  ],
  final: {
    title: "Exercice final — Créer deux réseaux Wi-Fi",
    intro: `<p>Sur un WLC, tu dois publier deux réseaux : « Corp » pour le personnel (VLAN 10, authentification par utilisateur) et « Guest » pour les invités (VLAN 99, simple phrase de passe). Décris les choix de configuration.</p>`,
    questions: [
      { type: "input", q: "Comment appelle-t-on le nom d'un réseau Wi-Fi comme « Corp » ?", a: ["ssid", "le ssid"], ph: "sigle", exp: "C'est le SSID (Service Set Identifier)." },
      { type: "qcm", q: "Quelle sécurité pour « Corp » (identifiants par utilisateur) ?", opts: ["WEP", "WPA2-Personal (PSK)", "WPA2-Enterprise (802.1X + RADIUS)", "Ouvert"], a: 2, exp: "L'authentification par utilisateur relève de WPA2-Enterprise avec RADIUS." },
      { type: "qcm", q: "Quelle sécurité pour « Guest » (une phrase de passe partagée) ?", opts: ["WPA2-Personal (PSK)", "WEP", "802.1X", "Aucune"], a: 0, exp: "Une clé partagée simple correspond à WPA2-Personal (PSK)." },
      { type: "vf", q: "Le SSID « Guest » doit être mappé au VLAN 99, séparé du VLAN 10 du personnel.", a: true, exp: "Vrai : chaque SSID atterrit dans son propre VLAN pour isoler les trafics." },
      { type: "qcm", q: "Quel chiffrement retenir pour les deux WLAN ?", opts: ["WEP", "AES (WPA2)", "Aucun", "TKIP obligatoire"], a: 1, exp: "WPA2 avec AES est la base solide pour les deux réseaux." }
    ],
    solution: `<pre class="pseudo"># WLAN "Corp"
#   SSID       : Corp
#   Securite   : WPA2-Enterprise (802.1X) + AES
#   Auth       : serveur RADIUS (par utilisateur)
#   VLAN       : 10
#
# WLAN "Guest"
#   SSID       : Guest
#   Securite   : WPA2-Personal (PSK) + AES
#   Cle        : phrase de passe partagee
#   VLAN       : 99  (isole, Internet seulement)
#
# Port WLC -> switch : trunk 802.1Q (VLAN 10 et 99)</pre>
<p>Deux SSID, deux niveaux de sécurité, deux VLAN : le personnel est authentifié individuellement, les invités sont isolés.</p>`
  }
};
