<script>
var DAY = {
  num: 13,
  title: "Les réseaux sans fil (WLAN) et le WLC",
  subtitle: "Du point d'accès autonome au réseau piloté par un contrôleur.",
  theory: `
<h3>1. Le Wi-Fi : un média partagé et invisible</h3>
<p>Un réseau local sans fil, ou <strong>WLAN</strong> (<em>Wireless LAN</em>), remplace le câble par des <strong>ondes radio</strong>. Il repose sur la famille de normes <strong>IEEE 802.11</strong> (Wi-Fi). L'équipement central est le <strong>point d'accès</strong> (<em>Access Point</em>, AP) : il fait le pont entre les clients sans fil et le réseau filaire. Contrairement à un switch où chaque port est un média dédié, l'air est un <strong>média partagé</strong> : un seul appareil peut émettre à la fois sur un canal donné. Le Wi-Fi gère cela avec le mécanisme <strong>CSMA/CA</strong> (écoute avant d'émettre, évitement de collision).</p>
<p>Image : un switch, c'est une conversation en tête-à-tête par téléphone (ligne dédiée). Le Wi-Fi, c'est une salle où tout le monde parle : il faut attendre un silence avant de prendre la parole pour ne pas se couper.</p>
<h3>2. Deux architectures : autonome vs contrôleur</h3>
<p>Il existe deux façons de déployer des points d'accès :</p>
<pre class="pseudo"># AUTONOME (autonomous AP)
#   Chaque AP est configure individuellement.
#   Il gere lui-meme SSID, securite, canaux, VLAN.
#   OK pour 1 a quelques AP ; ingerable a grande echelle.
#
# BASÉ CONTROLEUR (lightweight AP + WLC)
#   Les AP "legers" (lightweight) sont pilotes par un
#   controleur central : le WLC (Wireless LAN Controller).
#   Configuration centralisee, itinerance (roaming) fluide.</pre>
<p>Dans l'approche <strong>autonome</strong>, chaque AP est une petite boîte indépendante avec sa propre configuration : pratique pour une TPE, vite ingérable dès qu'il y a des dizaines d'AP. Dans l'approche <strong>contrôleur</strong>, les AP sont <strong>légers</strong> (<em>lightweight</em>) : ils ne décident presque rien et reçoivent leur configuration d'un serveur central, le <strong>WLC</strong> (<em>Wireless LAN Controller</em>).</p>
<h3>3. Le WLC : le cerveau central</h3>
<p>Le <strong>WLC</strong> centralise tout : création des réseaux Wi-Fi (SSID), politiques de sécurité, choix des canaux et de la puissance radio, gestion de l'itinérance. On configure un seul équipement au lieu de cent AP. C'est le modèle <strong>split-MAC</strong> : les fonctions temps réel (émission radio, chiffrement) restent sur l'AP, tandis que les fonctions de gestion (authentification, mobilité, politiques) sont assurées par le WLC.</p>
<div class="tip">Avantages du WLC : configuration en un point, itinérance transparente entre AP (le client garde sa session en se déplaçant), équilibrage de charge, détection des interférences et des AP pirates (<em>rogue AP</em>).</div>
<h3>4. CAPWAP : le tunnel entre l'AP et le WLC</h3>
<p>Comment l'AP léger et le WLC communiquent-ils ? Par le protocole <strong>CAPWAP</strong> (<em>Control And Provisioning of Wireless Access Points</em>). Il établit deux tunnels entre chaque AP et le WLC :</p>
<pre class="pseudo"># CAPWAP forme 2 tunnels AP &lt;-&gt; WLC :
#   - Control (UDP 5246) : gestion, configuration, chiffre (DTLS)
#   - Data    (UDP 5247) : trafic des utilisateurs
# L'AP peut etre a un autre etage/site : le tunnel traverse le reseau L3.</pre>
<p>Grâce à CAPWAP, un AP peut se trouver n'importe où sur le réseau IP : il « appelle » le WLC, télécharge sa configuration et lui renvoie le trafic dans le tunnel. Le canal de contrôle est chiffré par <strong>DTLS</strong>.</p>
<div class="warn">Ne confonds pas SSID et VLAN. Le <strong>SSID</strong> est le nom du réseau Wi-Fi visible par les clients ; le <strong>VLAN</strong> est le réseau filaire dans lequel le WLC place ce trafic. Un même WLC diffuse plusieurs SSID, chacun pouvant être mappé à un VLAN différent (ex. Invités vs Personnel).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WLAN = reseau sans fil (normes IEEE 802.11), media partage (CSMA/CA)
# AP autonome : configure individuellement (petit reseau)
# AP leger (lightweight) + WLC : gestion CENTRALISEE
# WLC = Wireless LAN Controller (cerveau : SSID, securite, roaming)
# CAPWAP : tunnels AP-WLC (Control UDP 5246 / Data UDP 5247, DTLS)
# SSID = nom du Wi-Fi  |  VLAN = reseau filaire associe</pre>`,

    { type: "qcm", q: "Le média radio du Wi-Fi est…", opts: ["dédié à chaque client", "partagé (un seul émet à la fois par canal)", "toujours filaire", "chiffré par défaut"], a: 1, exp: "L'air est partagé ; CSMA/CA régule qui émet pour éviter les collisions." },
    { type: "vf", q: "Dans l'architecture autonome, chaque point d'accès est configuré individuellement.", a: true, exp: "Vrai : chaque AP autonome gère sa propre configuration (SSID, sécurité, canaux)." },

    { type: "qcm", q: "Un AP « lightweight » (léger)…", opts: ["décide tout seul de sa configuration", "reçoit sa configuration d'un WLC central", "n'émet aucune onde radio", "remplace le routeur"], a: 1, exp: "L'AP léger dépend du WLC qui lui fournit sa configuration." },
    { type: "input", q: "Quel protocole établit le tunnel entre un AP léger et le WLC ? (sigle)", a: ["capwap"], ph: "6 lettres", exp: "CAPWAP (Control And Provisioning of Wireless Access Points) relie AP et WLC." },
    { type: "qcm", q: "Que transporte CAPWAP entre l'AP et le WLC ?", opts: ["Uniquement l'électricité", "Un tunnel de contrôle et un tunnel de données", "Seulement du DNS", "Rien, c'est du câble"], a: 1, exp: "CAPWAP forme deux tunnels : contrôle (UDP 5246) et données (UDP 5247)." },
    { type: "vf", q: "Grâce à CAPWAP, un AP léger peut se trouver sur un autre segment IP que le WLC.", a: true, exp: "Vrai : le tunnel CAPWAP traverse le réseau de niveau 3." },
    { type: "qcm", q: "Quel est l'avantage principal du modèle basé WLC ?", opts: ["Configurer chaque AP à la main", "Configuration centralisée et itinérance fluide", "Supprimer le chiffrement", "Se passer d'AP"], a: 1, exp: "Le WLC centralise la config et gère le roaming entre AP." },
    { type: "vf", q: "Un SSID et un VLAN désignent exactement la même chose.", a: false, exp: "Faux : le SSID est le nom du Wi-Fi ; le VLAN est le réseau filaire associé." },
    { type: "qcm", q: "Le modèle où les fonctions radio restent sur l'AP et la gestion sur le WLC s'appelle…", opts: ["split-MAC", "full-mesh", "round-robin", "store-and-forward"], a: 0, exp: "Le split-MAC répartit les fonctions temps réel (AP) et de gestion (WLC)." },
    { type: "qcm", q: "Quel mécanisme le Wi-Fi utilise-t-il pour éviter les collisions ?", opts: ["CSMA/CD", "CSMA/CA", "STP", "LACP"], a: 1, exp: "Le Wi-Fi utilise CSMA/CA (Collision Avoidance) : écouter avant d'émettre." },
    { type: "input", q: "Quel type d'AP indésirable le WLC aide-t-il à détecter ? (terme anglais courant)", a: ["rogue ap", "rogue", "rogue access point"], ph: "rogue …", exp: "Un rogue AP est un point d'accès pirate ou non autorisé, détecté par le WLC." }
  ],
  final: {
    title: "Exercice final — Choisir une architecture Wi-Fi",
    intro: `<p>Une entreprise passe de 3 à 60 points d'accès répartis sur plusieurs étages. On te demande de conseiller l'architecture et d'expliquer le rôle des composants.</p>`,
    questions: [
      { type: "qcm", q: "Quelle architecture recommander pour 60 AP ?", opts: ["Autonome (chaque AP à la main)", "Basée contrôleur (AP légers + WLC)", "Un hub central", "Aucune, du câble partout"], a: 1, exp: "À grande échelle, le modèle WLC centralise la gestion : indispensable pour 60 AP." },
      { type: "input", q: "Quel équipement central va piloter tous les AP ?", a: ["wlc", "le wlc", "wireless lan controller"], ph: "sigle", exp: "Le WLC (Wireless LAN Controller)." },
      { type: "qcm", q: "Comment les AP légers dialoguent-ils avec le WLC ?", opts: ["Par un tunnel CAPWAP", "Par STP", "Par des câbles console", "Par DHCP uniquement"], a: 0, exp: "CAPWAP forme les tunnels de contrôle et de données entre AP et WLC." },
      { type: "vf", q: "Le roaming (itinérance) d'un employé entre deux AP est mieux géré par un WLC.", a: true, exp: "Vrai : le WLC assure une itinérance transparente entre les AP qu'il pilote." },
      { type: "qcm", q: "Un SSID « Invités » et un SSID « Personnel » sur le même WLC peuvent être…", opts: ["obligatoirement dans le même VLAN", "mappés à des VLAN différents", "sans aucun VLAN", "gérés par STP"], a: 1, exp: "Chaque SSID peut être associé à un VLAN distinct pour séparer les trafics." }
    ],
    solution: `<pre class="pseudo"># Recommandation : architecture basee CONTROLEUR
#   - 60 AP legers (lightweight)
#   - 1 (ou 2 pour la redondance) WLC central
#   - tunnels CAPWAP AP &lt;-&gt; WLC (Control 5246 / Data 5247)
#   - SSID "Personnel" -> VLAN 10 ; SSID "Invites" -> VLAN 99
# Avantages : config en 1 point, roaming fluide, detection rogue AP.</pre>
<p>L'approche autonome serait ingérable à 60 AP : chaque changement devrait être répété partout. Le WLC résout ce problème.</p>`
  }
};
