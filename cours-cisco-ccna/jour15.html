<script>
var DAY = {
  num: 15,
  title: "Le routage IP : les concepts",
  subtitle: "Comment un routeur choisit le chemin d'un paquet.",
  theory: `
<h3>1. Le rôle du routeur</h3>
<p>Un switch travaille à l'intérieur d'un réseau (niveau 2). Un <strong>routeur</strong> relie des réseaux <em>différents</em> et décide, pour chaque paquet, vers quelle sortie l'envoyer. C'est le travail de <strong>routage</strong> (niveau 3). À chaque paquet reçu, le routeur regarde l'<strong>adresse IP de destination</strong>, la compare à sa <strong>table de routage</strong> et transmet le paquet vers le prochain saut (<em>next hop</em>) ou l'interface adéquate.</p>
<p>Image : un centre de tri postal. Il ne connaît pas chaque maison, mais sait « tout ce qui va vers cette région part par ce camion ». Le routeur fait pareil : il raisonne par réseaux, pas par machines individuelles.</p>
<h3>2. La table de routage</h3>
<p>La <strong>table de routage</strong> (<em>routing table</em>) est la liste des réseaux connus et du moyen de les atteindre. Chaque entrée indique : le réseau de destination et son masque, la façon de l'atteindre (interface de sortie et/ou adresse du prochain saut), et la source de l'information. On la consulte avec <strong>show ip route</strong>.</p>
<pre class="pseudo">Router# show ip route
C   192.168.1.0/24 is directly connected, Gi0/0     ! C = Connected
L   192.168.1.1/32 is directly connected, Gi0/0     ! L = adresse Locale
S   10.0.0.0/8 [1/0] via 192.168.1.254              ! S = Statique
O   172.16.0.0/16 [110/2] via 192.168.1.253         ! O = OSPF
S*  0.0.0.0/0 [1/0] via 192.168.1.254               ! route par defaut</pre>
<p>Les lettres en début de ligne sont les <strong>codes de source</strong> : <strong>C</strong> (Connected, réseau directement branché), <strong>L</strong> (Local, l'adresse même de l'interface), <strong>S</strong> (Static, route entrée à la main), <strong>O</strong> (OSPF), <strong>D</strong> (EIGRP), <strong>R</strong> (RIP)…</p>
<div class="tip">Un routeur ne route QUE vers des réseaux qu'il connaît. Si la destination n'apparaît nulle part dans la table et qu'il n'y a pas de route par défaut, le paquet est jeté (drop).</div>
<h3>3. Le longest prefix match : la règle du plus précis</h3>
<p>Que se passe-t-il si plusieurs entrées correspondent à la même destination ? Le routeur applique la règle du <strong>longest prefix match</strong> (correspondance du préfixe le plus long) : il choisit la route dont le <strong>masque est le plus long</strong>, c'est-à-dire la plus <strong>précise</strong>. Une route /24 l'emporte sur une /16, qui l'emporte sur la route par défaut /0.</p>
<pre class="pseudo"># Destination du paquet : 10.1.1.5
# Routes candidates dans la table :
#   10.1.1.0/24   -> CHOISIE (prefixe le plus long, la plus precise)
#   10.1.0.0/16   -> ignoree (moins precise)
#   10.0.0.0/8    -> ignoree
#   0.0.0.0/0     -> ignoree (route par defaut, dernier recours)</pre>
<p>Cette règle prime sur tout le reste : peu importe la source ou la « distance », c'est d'abord le masque le plus long qui décide.</p>
<h3>4. La distance administrative (AD)</h3>
<p>Si <strong>deux sources différentes</strong> proposent une route vers <strong>le même réseau avec le même masque</strong>, le routeur départage avec la <strong>distance administrative</strong> (<em>Administrative Distance</em>, AD) : un indice de <strong>fiabilité</strong> de la source. Plus l'AD est <strong>basse</strong>, plus la source est jugée fiable et préférée.</p>
<pre class="pseudo"># Distances administratives par defaut (a connaitre) :
#   Connected (C)   : 0
#   Static    (S)   : 1
#   EIGRP           : 90
#   OSPF      (O)   : 110
#   RIP       (R)   : 120
#   Inconnu/inutilisable : 255</pre>
<p>Exemple : une route statique (AD 1) et une route OSPF (AD 110) vers le même réseau ? Le routeur retient la statique, car 1 &lt; 110. La distance administrative n'intervient <strong>qu'à masque égal</strong> ; sinon c'est le longest prefix match qui tranche d'abord.</p>
<div class="warn">Ordre de décision à retenir : (1) longest prefix match d'abord (le masque le plus long gagne), (2) puis, à masque égal, la distance administrative la plus basse, (3) puis, à AD égale, la métrique du protocole. Ne mélange pas ces critères.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Routeur = relie des reseaux, choisit une sortie par paquet (L3)
# Table de routage = reseaux connus + comment les atteindre (show ip route)
# Codes : C=connecte  L=local  S=statique  O=OSPF  D=EIGRP  R=RIP
# 1) LONGEST PREFIX MATCH : le masque le plus long (le + precis) gagne
# 2) a masque egal : Distance Administrative la plus BASSE
#    Connected 0 | Static 1 | EIGRP 90 | OSPF 110 | RIP 120
# Pas de route + pas de defaut -> paquet jete</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le rôle d'un routeur ?", opts: ["Commuter à l'intérieur d'un réseau", "Relier des réseaux différents et choisir la sortie d'un paquet", "Attribuer des adresses MAC", "Amplifier le signal pour prolonger un câble"], a: 1, exp: "Le routeur travaille au niveau 3 : il relie des réseaux et route selon l'IP de destination." },
    { type: "qcm", q: "Sur quoi le routeur se base-t-il pour router un paquet ?", opts: ["L'adresse MAC source", "L'adresse IP de destination", "Le numéro de port TCP", "L'adresse IP source"], a: 1, exp: "Il compare l'IP de destination à sa table de routage." },
    { type: "input", q: "Quelle commande affiche la table de routage IPv4 d'un routeur Cisco ?", a: ["show ip route", "sh ip route"], ph: "show ip …", exp: "show ip route liste les réseaux connus et la façon de les atteindre." },
    { type: "qcm", q: "Dans show ip route, que signifie le code C ?", opts: ["Statique", "Connected (réseau directement branché)", "OSPF", "Par défaut"], a: 1, exp: "C = Connected : le réseau est directement relié à une interface du routeur." },
    { type: "qcm", q: "Quelle règle choisit la route la plus PRÉCISE quand plusieurs correspondent ?", opts: ["La distance administrative", "Le longest prefix match", "Le round-robin", "La métrique la plus basse"], a: 1, exp: "Le longest prefix match retient la route au masque le plus long (la plus précise)." },
    { type: "qcm", q: "Pour la destination 10.1.1.5, quelle route est choisie ?", opts: ["10.0.0.0/8", "10.1.0.0/16", "10.1.1.0/24", "0.0.0.0/0"], a: 2, exp: "La /24 est le préfixe le plus long qui correspond : elle est la plus précise." },
    { type: "vf", q: "Le longest prefix match est évalué AVANT la distance administrative.", a: true, exp: "Vrai : on choisit d'abord le masque le plus long ; l'AD ne départage qu'à masque égal." },
    { type: "input", q: "Comment appelle-t-on l'indice de fiabilité qui départage deux sources à masque égal ? (sigle)", a: ["ad", "distance administrative", "administrative distance"], ph: "sigle ou nom", exp: "La distance administrative (AD) mesure la fiabilité d'une source de route." },
    { type: "qcm", q: "Une AD plus BASSE signifie…", opts: ["une source moins fiable", "une source plus fiable et préférée", "un masque plus long", "une route désactivée"], a: 1, exp: "Plus l'AD est basse, plus la source est jugée fiable et donc préférée." },
    { type: "input", q: "Quelle est la distance administrative d'une route statique ?", a: ["1"], ph: "un nombre", exp: "Une route statique a une AD de 1 (très fiable, juste après connected = 0)." },
    { type: "input", q: "Quelle est la distance administrative d'OSPF ?", a: ["110"], ph: "un nombre", exp: "OSPF a une AD de 110 par défaut." },
    { type: "qcm", q: "Statique (AD 1) et OSPF (AD 110) vers le MÊME réseau /24 : que choisit le routeur ?", opts: ["OSPF", "La statique", "Les deux", "Aucune"], a: 1, exp: "À masque égal, l'AD la plus basse gagne : 1 < 110, donc la statique." },
    { type: "vf", q: "Un paquet sans route correspondante et sans route par défaut est jeté.", a: true, exp: "Vrai : sans entrée ni route par défaut, le routeur ne peut pas le transmettre." },
    { type: "qcm", q: "Quelle AD a un réseau directement connecté (Connected) ?", opts: ["0", "1", "110", "255"], a: 0, exp: "Un réseau connecté a l'AD la plus basse possible : 0." },
    { type: "qcm", q: "Que représente une entrée 0.0.0.0/0 dans la table ?", opts: ["Un réseau connecté", "La route par défaut (dernier recours)", "Une adresse locale", "L'adresse de broadcast du réseau"], a: 1, exp: "0.0.0.0/0 est la route par défaut, utilisée quand rien de plus précis ne correspond." }
  ],
  final: {
    title: "Exercice final — Décider du chemin",
    intro: `<p>Un routeur possède ces routes : 0.0.0.0/0 via A (S, AD 1), 172.16.0.0/16 via B (O, AD 110), 172.16.5.0/24 via C (S, AD 1). Un paquet arrive pour 172.16.5.20.</p>`,
    questions: [
      { type: "qcm", q: "Quelle route correspond le plus précisément à 172.16.5.20 ?", opts: ["0.0.0.0/0", "172.16.0.0/16", "172.16.5.0/24", "aucune"], a: 2, exp: "La /24 est le préfixe le plus long qui englobe 172.16.5.20." },
      { type: "vf", q: "Le routeur choisit d'abord selon le masque le plus long, pas selon l'AD.", a: true, exp: "Vrai : le longest prefix match prime ; ici la /24 gagne directement." },
      { type: "input", q: "Vers quelle destination (A, B ou C) le paquet part-il ?", a: ["c", "via c", "c."], ph: "une lettre", exp: "La route 172.16.5.0/24 pointe via C : c'est la plus précise." },
      { type: "qcm", q: "Si seules 172.16.0.0/16 (OSPF) et 172.16.0.0/16 (statique) existaient, laquelle gagnerait ?", opts: ["OSPF (110)", "La statique (AD 1)", "Les deux", "Aucune"], a: 1, exp: "À masque égal, l'AD la plus basse gagne : statique AD 1 < OSPF 110." },
      { type: "qcm", q: "Pour une destination inconnue (ex. 8.8.8.8), quelle route sert ?", opts: ["172.16.0.0/16", "172.16.5.0/24", "0.0.0.0/0 (par défaut)", "aucune, paquet jeté"], a: 2, exp: "Faute de correspondance précise, la route par défaut 0.0.0.0/0 est utilisée." }
    ],
    solution: `<pre class="pseudo"># Destination 172.16.5.20
# Candidates :  0.0.0.0/0 (/0) | 172.16.0.0/16 (/16) | 172.16.5.0/24 (/24)
# 1) LONGEST PREFIX MATCH -> /24 est le plus long -> route via C choisie
#    (l'AD ne sert pas ici : une seule route /24 correspond)
#
# Rappel de l'ordre de decision :
#   (1) masque le plus long   (2) AD la plus basse   (3) metrique</pre>
<p>Le longest prefix match tranche en premier ; la distance administrative n'intervient qu'entre routes de même masque.</p>`
  }
};
