  title: "La certification CCNA 200-301 : présentation",
  subtitle: "Un examen unique pour valider les fondations des réseaux.",
  theory: `
<h3>1. À quoi sert la CCNA ?</h3>
<p>La <strong>CCNA</strong> (« Cisco Certified Network Associate ») est la certification <em>associate</em> de Cisco, c'est-à-dire le premier vrai palier professionnel du monde des réseaux. Elle atteste que tu sais installer, configurer et dépanner un réseau d'entreprise de taille moyenne : commutateurs, routeurs, adressage IP, sécurité de base et automatisation. C'est le sésame le plus reconnu pour débuter comme technicien ou administrateur réseau.</p>
<p>Depuis 2020, Cisco a <strong>fusionné toutes les anciennes pistes</strong> (CCNA Routing &amp; Switching, Security, Wireless...) en une seule certification généraliste. Fini le parcours en deux examens ICND1 + ICND2 : aujourd'hui, tout tient dans <strong>un examen unique</strong>.</p>
<h3>2. L'examen 200-301 en chiffres</h3>
<p>Le code officiel de l'examen est <strong>200-301</strong>, dans sa version <strong>v1.1</strong> (le programme, ou <em>blueprint</em>, est révisé régulièrement). Voici l'essentiel à connaître :</p>
<pre class="pseudo"># Carte d'identité de l'examen
Code            : 200-301 (CCNA)
Version         : v1.1
Niveau          : Associate (debutant professionnel)
Duree           : ~120 minutes
Tarif           : 300 USD (hors taxes)
Questions       : QCM, glisser-deposer, simulations
Prerequis       : aucun officiellement exige
Validite        : 3 ans</pre>
<p>Aucun diplôme préalable n'est imposé, mais Cisco recommande environ un an d'expérience avec les solutions réseau. L'examen se passe dans un centre <strong>Pearson VUE</strong> ou en ligne surveillé.</p>
<h3>3. Les 6 domaines du programme</h3>
<p>Le blueprint 200-301 se découpe en <strong>six domaines</strong>, chacun pesant un pourcentage de la note. Les connaître aide à répartir ton temps de révision :</p>
<pre class="pseudo"># Les 6 domaines et leur poids indicatif
1. Network Fundamentals ............... 20%
2. Network Access ..................... 20%
3. IP Connectivity .................... 25%
4. IP Services ........................ 10%
5. Security Fundamentals .............. 15%
6. Automation and Programmability ..... 10%</pre>
<p>« IP Connectivity » (routage) est le plus lourd, tandis que l'automatisation, plus récente, reflète l'évolution du métier vers le réseau programmable (Python, REST, contrôleurs).</p>
<div class="tip">Retiens le nom EXACT des domaines en anglais : ce sont les intitulés officiels que tu retrouveras dans le blueprint PDF de Cisco. « IP Connectivity » concerne le routage, pas le câblage.</div>
<h3>4. Comment se préparer efficacement</h3>
<p>La CCNA est autant théorique que pratique. Il ne suffit pas de lire : il faut <strong>configurer</strong>. Entraîne-toi sur un simulateur (Cisco <strong>Packet Tracer</strong>) ou un émulateur, et prends l'habitude de taper les commandes IOS toi-même. L'examen contient des <strong>simulations</strong> où l'on te demande de configurer réellement un équipement.</p>
<div class="warn">Ne néglige pas l'automatisation et la sécurité sous prétexte qu'elles pèsent « seulement » 10 à 15 %. Une poignée de points peut faire la différence entre l'échec et la réussite.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CCNA = certification associate de Cisco (fondations reseau)
# Examen UNIQUE : 200-301, version v1.1
# ~120 minutes, 300 USD, validite 3 ans, aucun prerequis exige
# 6 domaines : Network Fundamentals, Network Access, IP Connectivity,
#              IP Services, Security Fundamentals, Automation &amp; Programmability
# Se preparer = lire ET configurer (Packet Tracer, commandes IOS)</pre>`,

    { type: "qcm", q: "Quel est le code officiel de l'examen CCNA actuel ?", opts: ["100-101", "200-301", "300-401", "640-802"], a: 1, exp: "L'examen CCNA porte le code 200-301." },

    { type: "qcm", q: "À quel niveau Cisco se situe la CCNA ?", opts: ["Entry", "Associate", "Professional", "Expert"], a: 1, exp: "CCNA = Cisco Certified Network Associate, le niveau associate." },
    { type: "qcm", q: "Combien de domaines compte le programme du 200-301 ?", opts: ["4", "5", "6", "8"], a: 2, exp: "Le blueprint est découpé en 6 domaines." },
    { type: "qcm", q: "Quel domaine concerne le routage et pèse le plus lourd (~25 %) ?", opts: ["Network Access", "IP Connectivity", "IP Services", "Security Fundamentals"], a: 1, exp: "IP Connectivity (le routage) est le domaine le plus important, environ 25 %." },

    { type: "input", q: "Quelle est la durée approximative de l'examen, en minutes ?", a: ["120", "environ 120", "~120", "120 minutes"], ph: "un nombre", exp: "L'examen dure environ 120 minutes." },
    { type: "input", q: "Quel est le tarif de l'examen, en dollars US (USD) ?", a: ["300", "300 usd", "300 dollars", "300usd"], ph: "un montant", exp: "Le tarif est de 300 USD (hors taxes)." },
    { type: "input", q: "Combien de temps (en années) la certification reste-t-elle valable ?", a: ["3", "3 ans", "trois", "trois ans"], ph: "un nombre", exp: "La CCNA est valable 3 ans." },
    { type: "input", q: "Cite le domaine qui traite de la sécurité (nom anglais officiel).", a: ["security fundamentals", "security", "securite fundamentals"], ph: "en anglais", exp: "Le domaine s'appelle « Security Fundamentals »." }
  ],

    intro: `<p>Karim vise la CCNA pour décrocher un poste de technicien réseau. Il n'a aucune certification et se demande par où commencer. Aide-le à clarifier les faits sur l'examen.</p>`,

      { type: "qcm", q: "Quel domaine devrait-il le plus travailler vu son poids (~25 %) ?", opts: ["IP Services", "IP Connectivity", "Automation and Programmability", "Network Access"], a: 1, exp: "IP Connectivity (routage) est le domaine le plus lourd." },

    ],
    solution: `<pre class="pseudo"># Plan de Karim :
Examen        : 200-301 (unique), version v1.1
Cout          : 300 USD  |  Duree : ~120 min  |  Validite : 3 ans

Methode       : lire ET pratiquer (Packet Tracer, commandes IOS)
Prerequis     : aucun exige officiellement</pre>
<p>Karim a maintenant une feuille de route claire. Demain : les modèles OSI et TCP/IP, socle de tout le programme.</p>`
