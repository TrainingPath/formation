  subtitle: "Les modes, la navigation et l'aide contextuelle du système Cisco.",
  theory: `
<h3>1. Qu'est-ce que Cisco IOS ?</h3>
<p><strong>Cisco IOS</strong> (« Internetwork Operating System ») est le système d'exploitation qui anime la plupart des commutateurs et routeurs Cisco. On le pilote non pas à la souris, mais au clavier, via une <strong>interface en ligne de commande</strong> (CLI). On y accède par le port <strong>console</strong> (câble physique) ou à distance par <strong>SSH</strong>/Telnet.</p>
<h3>2. Les modes de la CLI</h3>
<p>IOS fonctionne par <strong>modes</strong>, chacun donnant accès à un jeu de commandes différent. L'invite (le prompt) change de symbole selon le mode où tu te trouves :</p>
<pre class="pseudo"># Les grands modes IOS (regarde le symbole du prompt)
Switch&gt;              mode utilisateur (user EXEC) : consultation limitee
Switch#              mode privilegie (privileged EXEC) : diagnostic complet
Switch(config)#      mode de configuration globale : on modifie l'equipement
Switch(config-if)#   mode de configuration d'interface</pre>
<p>Le symbole <strong>&gt;</strong> signale le mode utilisateur (droits réduits) ; le symbole <strong>#</strong> signale le mode privilégié (droits complets). La mention entre parenthèses (config) indique qu'on est en train de configurer.</p>
<h3>3. Naviguer entre les modes</h3>
<p>On passe d'un mode à l'autre avec quelques commandes clés. Voici le chemin classique du démarrage jusqu'à la configuration d'une interface :</p>
<pre class="pseudo"># Monter en droits puis descendre dans la configuration
Switch&gt; enable                 # passe en mode privilegie (#)
Switch# configure terminal     # entre en configuration globale
Switch(config)# interface fa0/1  # entre dans la configuration de fa0/1
Switch(config-if)# exit        # remonte d'un niveau
Switch(config)# end            # retour direct au mode privilegie
Switch#</pre>
<div class="tip">Trois repères : <strong>enable</strong> monte du mode utilisateur au mode privilégié ; <strong>configure terminal</strong> (souvent abrégé « conf t ») entre en configuration ; <strong>exit</strong> remonte d'un niveau et <strong>end</strong> (ou Ctrl+Z) revient directement au mode privilégié.</p></div>
<h3>4. L'aide contextuelle et l'auto-complétion</h3>
<p>La CLI IOS est bavarde et t'assiste en permanence. Deux outils sont indispensables :</p>
<pre class="pseudo"># Le point d'interrogation ? = aide contextuelle
Switch# co?              # liste les commandes commencant par 'co'
Switch# clock ?          # liste les arguments possibles apres 'clock'
# La touche Tab = auto-completion
Switch# conf&lt;Tab&gt;        # complete automatiquement en 'configure'</pre>
<p>Tu peux aussi <strong>abréger</strong> les commandes tant qu'elles restent non ambiguës : <strong>en</strong> pour <em>enable</em>, <strong>conf t</strong> pour <em>configure terminal</em>, <strong>int</strong> pour <em>interface</em>. IOS complète le reste.</p>
<div class="warn">Attention aux messages d'erreur. « % Ambiguous command » signifie que ton abréviation correspond à plusieurs commandes. « % Incomplete command » indique qu'il manque un argument. « % Invalid input detected » pointe (avec un ^) l'endroit exact de la faute.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IOS = systeme des equipements Cisco, pilote en CLI (console ou SSH)
# Prompt &gt; = user EXEC | # = privileged EXEC | (config)# = configuration
# enable -> mode privilegie ; configure terminal -> config globale
# exit = remonter d'un niveau ; end (ou Ctrl+Z) = retour au mode #

    { type: "vf", q: "La touche Tab sert à compléter automatiquement une commande.", a: true, exp: "Vrai : Tab réalise l'auto-complétion." },
    { type: "vf", q: "On peut abréger une commande IOS tant qu'elle reste non ambiguë.", a: true, exp: "Vrai : ex. « conf t » pour configure terminal, tant que c'est unique." },

    { type: "input", q: "Quelle commande (2 mots) entre en configuration globale ?", a: ["configure terminal", "conf t", "config terminal", "conf terminal"], ph: "2 mots", exp: "configure terminal (conf t) entre en configuration globale." },
    { type: "input", q: "Quelle commande revient directement au mode privilégié depuis un mode de config ?", a: ["end", "ctrl+z", "ctrl z"], ph: "une commande", exp: "end (ou Ctrl+Z) ramène directement au mode privilégié." },
    { type: "input", q: "Quel caractère, tapé après une commande, affiche l'aide contextuelle ?", a: ["?", "point d'interrogation", "point d interrogation"], ph: "un caractère", exp: "Le ? affiche l'aide contextuelle." },
    { type: "input", q: "Quel symbole de prompt indique qu'on est en configuration globale ? Donne l'invite type d'un switch nommé Switch.", a: ["switch(config)#", "(config)#", "switch (config)#"], ph: "invite type", exp: "L'invite Switch(config)# indique la configuration globale." }
  ],
  final: {
    title: "Exercice final — Naviguer dans IOS",
    intro: `<p>Tu te connectes à un switch neuf par le port console. L'invite affiche <code>Switch&gt;</code>. Tu dois atteindre le mode qui permet de configurer l'interface fa0/1.</p>`,
    questions: [

      { type: "input", q: "Quelle commande tapes-tu pour passer en mode privilégié ?", a: ["enable", "en"], ph: "une commande", exp: "enable fait passer au mode privilégié (Switch#)." },
      { type: "input", q: "Quelle commande entre ensuite en configuration globale ?", a: ["configure terminal", "conf t"], ph: "une commande", exp: "configure terminal entre en config globale (Switch(config)#)." },
      { type: "qcm", q: "Après « interface fa0/1 », quel prompt vois-tu ?", opts: ["Switch>", "Switch#", "Switch(config)#", "Switch(config-if)#"], a: 3, exp: "En configuration d'interface, le prompt devient Switch(config-if)#." },
      { type: "vf", q: "La commande end te ramènerait directement à Switch#.", a: true, exp: "Vrai : end (ou Ctrl+Z) revient directement au mode privilégié." }
    ],
    solution: `<pre class="pseudo"># Chemin complet jusqu'a l'interface :
Switch&gt; enable
Switch# configure terminal
Switch(config)# interface fa0/1
Switch(config-if)#        # pret a configurer fa0/1
# Pour ressortir : exit (un niveau) ou end / Ctrl+Z (retour a Switch#)</pre>
<p>Tu sais te déplacer dans les modes IOS. Demain : on applique tout ça pour réaliser la configuration de base d'un switch.</p>`
  }
