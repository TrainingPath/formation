var DAY = {
  num: 6,
  title: "L'adressage IPv6",
  subtitle: "128 bits d'adresses : types, EUI-64 et bases de la SLAAC.",
  theory: `
<h3>1. Pourquoi IPv6 ?</h3>
<p>IPv4 n'offre qu'environ 4,3 milliards d'adresses (2 puissance 32), un chiffre depuis longtemps insuffisant. <strong>IPv6</strong> code les adresses sur <strong>128 bits</strong>, soit un nombre astronomique d'adresses. Fini la pénurie, et le NAT devient optionnel : chaque appareil peut avoir sa propre adresse publique.</p>
<h3>2. Écriture et règles de compression</h3>
<p>Une adresse IPv6 s'écrit en <strong>hexadécimal</strong>, en 8 groupes de 4 chiffres séparés par des deux-points (:). Deux règles permettent de la raccourcir :</p>
<pre class="pseudo"># Adresse complete
2001:0db8:0000:0000:0000:0000:0000:0001
# Regle 1 : supprimer les zeros de tete de chaque groupe
2001:db8:0:0:0:0:0:1
# Regle 2 : remplacer UNE seule suite de groupes nuls par ::
2001:db8::1</pre>
<div class="warn">Le double deux-points « :: » ne peut apparaître qu'une seule fois dans une adresse, sinon on ne saurait plus combien de groupes nuls il représente.</div>
<h3>3. Les grands types d'adresses</h3>
<p>IPv6 remplace le broadcast par d'autres mécanismes. Les types à connaître :</p>
<pre class="pseudo"># Types d'adresses IPv6
Global unicast     : 2000::/3   -> publique, routable sur Internet
Link-local         : fe80::/10  -> valable uniquement sur le lien local
Unique local (ULA) : fc00::/7   -> privee (equivalent RFC 1918)
Multicast          : ff00::/8   -> vers un groupe de destinataires
Loopback           : ::1        -> la machine locale (comme 127.0.0.1)</pre>
<p>L'adresse <strong>link-local</strong> (préfixe <strong>fe80::/10</strong>) est automatique sur chaque interface active : elle sert aux échanges sur le même lien (voisinage, découverte). Il n'existe pas d'adresse de broadcast en IPv6 ; le <strong>multicast</strong> la remplace.</p>
<h3>4. EUI-64 : fabriquer l'identifiant d'interface</h3>
<p>Une adresse IPv6 unicast se compose d'un <strong>préfixe réseau</strong> (souvent /64) et d'un <strong>identifiant d'interface</strong> de 64 bits. Le procédé <strong>EUI-64</strong> génère cet identifiant à partir de l'adresse MAC (48 bits) de la carte :</p>
<pre class="pseudo"># EUI-64 en 3 etapes (MAC 48 bits -> ID 64 bits)
1. Couper la MAC en deux et inserer FFFE au milieu
   00:1A:2B  3C:4D:5E  ->  001A:2BFF:FE3C:4D5E
2. Inverser le 7e bit du premier octet (bit U/L)
   00 (0000 0000) -> 02 (0000 0010)
3. Resultat : 021A:2BFF:FE3C:4D5E (identifiant d'interface)</pre>
<div class="tip">Le marqueur <strong>FFFE</strong> inséré au milieu est le signe visible d'un identifiant construit en EUI-64. Le 7e bit inversé s'appelle le bit U/L (Universal/Local).</div>
<h3>5. SLAAC : l'auto-configuration</h3>
<p>La <strong>SLAAC</strong> (« Stateless Address Autoconfiguration ») permet à un hôte de se donner une adresse IPv6 <strong>tout seul</strong>, sans serveur DHCP. Le principe :</p>
<pre class="pseudo"># SLAAC en bref
1. L'hote ecoute les messages Router Advertisement (RA) du routeur
2. Le RA annonce le prefixe reseau (ex : 2001:db8:acad:1::/64)
3. L'hote fabrique l'ID d'interface (EUI-64 ou aleatoire)
4. Adresse = prefixe + ID d'interface, sans serveur central</pre>
<p>SLAAC est dite <em>stateless</em> (sans état) car aucun serveur ne tient de registre des adresses attribuées, contrairement au DHCP. Le routeur diffuse le préfixe via les messages <strong>RA</strong> du protocole NDP.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IPv6 = 128 bits, hexadecimal, 8 groupes de 4
# Compression : zeros de tete + une seule fois ::
# Types : global (2000::/3), link-local (fe80::/10), ULA (fc00::/7),
#         multicast (ff00::/8), loopback ::1 (pas de broadcast)
# EUI-64 : MAC -> ID d'interface (insere FFFE + inverse bit U/L)
# SLAAC : auto-config via les RA du routeur, sans DHCP (stateless)</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits est codée une adresse IPv6 ?", opts: ["32 bits", "64 bits", "128 bits", "256 bits"], a: 2, exp: "Une adresse IPv6 fait 128 bits." },

    { type: "qcm", q: "Quel préfixe identifie une adresse link-local ?", opts: ["fe80::/10", "2000::/3", "ff00::/8", "fc00::/7"], a: 0, exp: "Les adresses link-local utilisent le préfixe fe80::/10." },
    { type: "qcm", q: "Quel type d'adresse remplace le broadcast en IPv6 ?", opts: ["L'unicast", "Le multicast", "L'anycast global", "Le loopback"], a: 1, exp: "IPv6 n'a pas de broadcast ; le multicast (ff00::/8) le remplace." },
    { type: "qcm", q: "Quelle valeur est insérée au milieu de la MAC lors du procédé EUI-64 ?", opts: ["FFFF", "FFFE", "FF00", "FEFE"], a: 1, exp: "EUI-64 insère FFFE au milieu des 48 bits de la MAC." },
    { type: "qcm", q: "Que permet la SLAAC ?", opts: ["Chiffrer les paquets IPv6", "S'auto-configurer une adresse sans serveur DHCP", "Router entre réseaux IPv4 et IPv6", "Compresser les adresses"], a: 1, exp: "La SLAAC permet à l'hôte de se configurer seul une adresse, sans DHCP." },
    { type: "vf", q: "Le double deux-points « :: » peut apparaître plusieurs fois dans une adresse IPv6.", a: false, exp: "Faux : « :: » ne peut apparaître qu'une seule fois, sinon l'adresse serait ambiguë." },
    { type: "vf", q: "En EUI-64, on inverse le 7e bit du premier octet (bit U/L).", a: true, exp: "Vrai : le 7e bit (Universal/Local) est inversé." },
    { type: "vf", q: "La SLAAC est dite « stateless » car aucun serveur ne tient de registre des adresses.", a: true, exp: "Vrai : sans état (stateless), contrairement au DHCP qui garde un registre." },
    { type: "vf", q: "L'adresse de loopback IPv6 est ::1.", a: true, exp: "Vrai : ::1 est le loopback IPv6, équivalent de 127.0.0.1 en IPv4." },
    { type: "input", q: "Compresse l'adresse 2001:0db8:0000:0000:0000:0000:0000:0001.", a: ["2001:db8::1"], ph: "adresse compressée", exp: "Zéros de tête supprimés et suite de zéros remplacée par :: donne 2001:db8::1." },
    { type: "input", q: "Quel préfixe (avec /) identifie les adresses global unicast ?", a: ["2000::/3", "2000::/3", "2000/3"], ph: "préfixe/CIDR", exp: "Les adresses global unicast appartiennent à 2000::/3." },
    { type: "input", q: "Quelle est la taille (en bits) de l'identifiant d'interface dans une adresse /64 ?", a: ["64", "64 bits"], ph: "un nombre", exp: "Avec un préfixe /64, l'identifiant d'interface fait 64 bits." },
    { type: "input", q: "Comment s'appellent les messages du routeur qui annoncent le préfixe pour la SLAAC ?", a: ["router advertisement", "ra", "router advertisements"], ph: "sigle ou terme", exp: "Ce sont les Router Advertisements (RA)." },
    { type: "input", q: "Quel préfixe (fc.../7) désigne les adresses privées IPv6 (ULA) ?", a: ["fc00::/7", "fc00/7", "fc00::/7 "], ph: "préfixe/CIDR", exp: "Les Unique Local Addresses utilisent fc00::/7." }
  ],
  final: {
    title: "Exercice final — Construire une adresse IPv6",
    intro: `<p>Un routeur annonce le préfixe <code>2001:db8:acad:1::/64</code>. Un hôte dont la MAC est <code>00:1A:2B:3C:4D:5E</code> se configure en SLAAC avec EUI-64. Reconstituons son adresse.</p>`,
    questions: [
      { type: "qcm", q: "Quelle valeur EUI-64 insère-t-il au milieu de la MAC ?", opts: ["FFFF", "FFFE", "0000", "AAAA"], a: 1, exp: "EUI-64 insère FFFE au centre des 48 bits." },
      { type: "input", q: "Après inversion du bit U/L, le premier octet 00 devient…", a: ["02", "0x02"], ph: "hexadécimal", exp: "00 (0000 0000) avec le 7e bit inversé donne 02." },
      { type: "qcm", q: "Quel est l'identifiant d'interface obtenu ?", opts: ["001A:2BFF:FE3C:4D5E", "021A:2BFF:FE3C:4D5E", "001A:2BFE:FF3C:4D5E", "021A:2BFE:FF3C:4D5E"], a: 1, exp: "FFFE inséré + bit U/L inversé : 021A:2BFF:FE3C:4D5E." },
      { type: "vf", q: "L'hôte a obtenu son adresse sans serveur DHCP.", a: true, exp: "Vrai : la SLAAC est sans état, l'hôte se configure seul grâce au RA." },
      { type: "input", q: "Quelle est l'adresse IPv6 complète (préfixe + ID) ?", a: ["2001:db8:acad:1:21a:2bff:fe3c:4d5e", "2001:db8:acad:1:021a:2bff:fe3c:4d5e"], ph: "adresse complète", exp: "Préfixe 2001:db8:acad:1:: + ID 21a:2bff:fe3c:4d5e." }
    ],
    solution: `<pre class="pseudo"># Construction EUI-64 + SLAAC :
MAC          : 00:1A:2B:3C:4D:5E
Inserer FFFE : 001A:2B FF:FE 3C:4D5E -> 001A:2BFF:FE3C:4D5E
Inverser U/L : 00 -> 02  => ID = 021A:2BFF:FE3C:4D5E
Prefixe (RA) : 2001:db8:acad:1::/64
Adresse      : 2001:db8:acad:1:21a:2bff:fe3c:4d5e</pre>
<p>Tu sais construire une adresse IPv6 de bout en bout. Demain : on quitte la théorie pour la pratique avec Cisco IOS et sa CLI.</p>`
  }
};
