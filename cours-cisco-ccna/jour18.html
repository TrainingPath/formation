<script>
var DAY = {
  num: 18,
  title: "Configurer et vérifier OSPF",
  subtitle: "De la commande router ospf aux voisins visibles : mettre OSPFv2 en route et le contrôler.",
  theory: `
<h3>1. Activer le processus : router ospf</h3>
<p>On entre dans le processus de routage avec <code>router ospf &lt;id-processus&gt;</code>. Attention : cet identifiant est <strong>local</strong> au routeur (1 à 65535) ; il n'a pas besoin d'être identique d'un routeur à l'autre pour qu'ils deviennent voisins. Deux routeurs peuvent très bien utiliser <code>router ospf 1</code> sur l'un et <code>router ospf 50</code> sur l'autre.</p>
<pre class="pseudo">R1(config)# router ospf 1
R1(config-router)# router-id 1.1.1.1        # fixer le RID (recommande)
R1(config-router)# network 10.0.0.0 0.0.0.255 area 0</pre>
<h3>2. La commande network et le masque générique (wildcard)</h3>
<p>La commande <code>network</code> ne « publie » pas un réseau : elle indique <strong>quelles interfaces</strong> participent à OSPF (et dans quelle aire). On la construit avec une <strong>adresse</strong> et un <strong>masque générique</strong> (en anglais <em>wildcard mask</em>), l'<em>inverse</em> du masque de sous-réseau. Un bit à <strong>0</strong> dans le wildcard signifie « ce bit doit correspondre exactement » ; un bit à <strong>1</strong> signifie « peu importe ».</p>
<pre class="pseudo"># Masque reseau  255.255.255.0  ->  wildcard  0.0.0.255
# Masque reseau  255.255.255.252 -> wildcard  0.0.0.3
# Astuce : wildcard = 255.255.255.255 - masque
R1(config-router)# network 192.168.1.0 0.0.0.255 area 0   # tout le /24
R1(config-router)# network 10.1.1.1 0.0.0.0 area 0        # une seule interface exacte</pre>
<div class="tip">Toute interface dont l'adresse IP « tombe » dans la plage <code>adresse / wildcard</code> est activée pour OSPF dans l'aire indiquée : OSPF envoie des Hello dessus et annonce le réseau correspondant.</div>
<h3>3. Réglages utiles sur les interfaces</h3>
<p>On peut ajuster OSPF interface par interface. Deux réglages fréquents en examen :</p>
<pre class="pseudo"># Rendre une interface passive : elle annonce son reseau
# mais n'envoie PLUS de Hello (utile cote LAN utilisateurs)
R1(config-router)# passive-interface GigabitEthernet0/1

# Forcer le cout d'une interface
R1(config-if)# ip ospf cost 10

# Regler priorite DR/BDR sur une interface
R1(config-if)# ip ospf priority 100</pre>
<div class="warn">Pour qu'une adjacence se forme, plusieurs paramètres doivent <strong>concorder</strong> entre voisins : même aire, mêmes temporisateurs <strong>Hello</strong> et <strong>Dead</strong>, sous-réseau compatible et authentification identique. Une interface <strong>passive</strong> ne forme jamais de voisin.</div>
<h3>4. Vérifier : show ip ospf neighbor</h3>
<p>La commande reine est <code>show ip ospf neighbor</code>. Elle liste les voisins et leur état. L'état attendu sur une adjacence stable est <strong>FULL</strong>. Sur un réseau broadcast, on lit aussi le rôle : FULL/DR, FULL/BDR, ou 2WAY/DROTHER entre deux DROTHER (situation normale, pas une panne).</p>
<pre class="pseudo">R1# show ip ospf neighbor
Neighbor ID   Pri   State      Dead Time   Address    Interface
2.2.2.2         1   FULL/DR    00:00:38    10.0.0.2   Gi0/0
3.3.3.3         1   FULL/  -   00:00:39    10.0.1.2   Se0/0/0</pre>
<h3>5. Les autres commandes de contrôle</h3>
<pre class="pseudo">show ip ospf                 # RID, aires, nombre d'interfaces
show ip ospf interface brief # interfaces OSPF, cout, etat, nb voisins
show ip route ospf           # routes apprises par OSPF (marquees "O")
show ip protocols            # resume : process, network, passive-interface</pre>
<p>Dans <code>show ip route</code>, une route OSPF interne est préfixée par la lettre <strong>O</strong>. On y lit aussi <code>[110/…]</code> : 110 est la distance administrative, le second nombre est le coût cumulé.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># router ospf 1            -> process LOCAL (peut differer entre routeurs)
# router-id 1.1.1.1        -> fixer l'identite (recommande)
# network ADR WILDCARD area 0 -> active les interfaces concernees
#   wildcard = inverse du masque (255.255.255.255 - masque)
# passive-interface X      -> annonce le reseau mais coupe les Hello
# VERIFIER : show ip ospf neighbor  (etat FULL attendu)
#            show ip ospf interface brief | show ip route ospf (routes "O")</pre>`,
  exercises: [
    { type: "qcm", q: "Que représente le numéro dans la commande « router ospf 1 » ?", opts: ["Le numéro de l'aire", "Un identifiant de processus local au routeur", "Le Router-ID", "Le numéro d'AS partagé obligatoirement"], a: 1, exp: "C'est un identifiant de processus local (1-65535) ; il peut différer d'un routeur à l'autre." },
    { type: "vf", q: "Deux routeurs doivent obligatoirement utiliser le même numéro de processus OSPF pour devenir voisins.", a: false, exp: "Faux : le numéro de processus est local. Ce sont l'aire et les temporisateurs qui doivent concorder." },
    { type: "qcm", q: "À quoi sert le masque générique (wildcard) dans la commande network ?", opts: ["À définir la passerelle", "À indiquer quels bits doivent correspondre (0) et lesquels sont ignorés (1)", "À fixer le coût", "À choisir le Router-ID"], a: 1, exp: "Bit 0 = doit correspondre, bit 1 = peu importe. C'est l'inverse du masque de sous-réseau." },
    { type: "input", q: "Quel wildcard correspond au masque 255.255.255.0 ?", a: ["0.0.0.255", "00.0.255", "0 0 0 255"], ph: "a.b.c.d", exp: "Wildcard = 255.255.255.255 - 255.255.255.0 = 0.0.0.255." },
    { type: "input", q: "Quel wildcard correspond au masque 255.255.255.252 (/30) ?", a: ["0.0.0.3", "0003"], ph: "a.b.c.d", exp: "255.255.255.255 - 255.255.255.252 = 0.0.0.3." },
    { type: "qcm", q: "Quelle commande liste les voisins OSPF et leur état ?", opts: ["show ip route", "show ip ospf neighbor", "show running-config", "show ip interface brief"], a: 1, exp: "show ip ospf neighbor affiche les voisins, leur état (FULL attendu) et le rôle DR/BDR." },
    { type: "qcm", q: "Quel état d'adjacence OSPF indique une relation pleinement établie ?", opts: ["INIT", "2WAY", "EXSTART", "FULL"], a: 3, exp: "FULL signifie que les bases sont synchronisées et l'adjacence complète." },
    { type: "vf", q: "Deux routeurs DROTHER restant en état 2WAY entre eux sur un segment broadcast est une situation normale.", a: true, exp: "Vrai : les DROTHER ne nouent une adjacence FULL qu'avec le DR et le BDR ; entre eux, 2WAY est normal." },
    { type: "qcm", q: "Que fait « passive-interface Gi0/1 » sous router ospf ?", opts: ["Désactive complètement l'interface", "Annonce le réseau mais n'envoie plus de Hello sur cette interface", "Force le rôle de DR", "Change la distance administrative"], a: 1, exp: "L'interface passive continue d'être annoncée mais ne forme plus de voisin (aucun Hello envoyé)." },
    { type: "input", q: "Dans « show ip route », quelle lettre préfixe une route OSPF interne ?", a: ["o", "O"], ph: "une lettre", exp: "La lettre O marque une route apprise par OSPF (intra-aire)." },
    { type: "qcm", q: "Dans une route « O 10.0.0.0/24 [110/65] », que vaut 110 ?", opts: ["Le coût du chemin", "La distance administrative d'OSPF", "Le numéro de processus", "Le Router-ID"], a: 1, exp: "Le premier nombre est l'AD (110 pour OSPF) ; le second est le coût cumulé." },
    { type: "vf", q: "La commande network 10.1.1.1 0.0.0.0 area 0 active OSPF sur l'interface portant exactement l'adresse 10.1.1.1.", a: true, exp: "Un wildcard 0.0.0.0 exige une correspondance exacte : une seule interface est ciblée." },
    { type: "qcm", q: "Parmi ces paramètres, lequel doit concorder entre deux voisins pour former une adjacence ?", opts: ["Le numéro de processus", "Les temporisateurs Hello et Dead", "Le nom d'hôte", "La version d'IOS"], a: 1, exp: "Hello/Dead, l'aire, le sous-réseau et l'authentification doivent concorder ; le numéro de processus non." },
    { type: "qcm", q: "Quelle commande donne un résumé des interfaces OSPF avec coût et nombre de voisins ?", opts: ["show ip ospf interface brief", "show version", "show cdp neighbors", "show vlan brief"], a: 0, exp: "show ip ospf interface brief liste les interfaces OSPF, leur coût, état et nombre de voisins." },
    { type: "input", q: "Quelle commande de configuration fixe manuellement l'identité du routeur OSPF à 1.1.1.1 ? (donne la commande)", a: ["router-id 1.1.1.1", "routerid 1.1.1.1"], ph: "commande + valeur", exp: "Sous router ospf : router-id 1.1.1.1 fixe le RID." }
  ],
  final: {
    title: "Exercice final — Mettre OSPF en route sur R1",
    intro: `<p>R1 possède deux interfaces : Gi0/0 en 10.0.0.1/24 (vers un autre routeur, aire 0) et Gi0/1 en 192.168.1.1/24 (LAN utilisateurs, aire 0). Tu dois activer OSPFv2, fixer le Router-ID à 1.1.1.1, faire participer les deux réseaux dans l'aire 0, et empêcher l'envoi de Hello sur le LAN utilisateurs. Ensuite tu vérifies l'adjacence.</p>`,
    questions: [
      { type: "input", q: "Quelle commande entre dans le processus OSPF numéro 1 ?", a: ["router ospf 1", "routerospf 1"], ph: "commande complète", exp: "router ospf 1 ouvre le mode config-router." },
      { type: "input", q: "Quelle commande fait participer le réseau 10.0.0.0/24 à l'aire 0 (avec wildcard) ?", a: ["network 10.0.0.0 0.0.0.255 area 0"], ph: "network ... area 0", exp: "network 10.0.0.0 0.0.0.255 area 0 : wildcard 0.0.0.255 pour un /24." },
      { type: "qcm", q: "Quelle commande empêche les Hello sur le LAN utilisateurs Gi0/1 tout en l'annonçant ?", opts: ["shutdown", "passive-interface GigabitEthernet0/1", "no network 192.168.1.0", "ip ospf cost 0"], a: 1, exp: "passive-interface coupe les Hello mais garde l'annonce du réseau." },
      { type: "input", q: "Quelle commande affiche les voisins OSPF pour confirmer l'adjacence ?", a: ["show ip ospf neighbor", "sh ip ospf neighbor"], ph: "commande show", exp: "show ip ospf neighbor : on attend l'état FULL." },
      { type: "qcm", q: "L'adjacence est bonne si le voisin apparaît dans quel état ?", opts: ["INIT", "DOWN", "FULL", "EXSTART bloqué"], a: 2, exp: "FULL indique une adjacence pleinement établie." }
    ],
    solution: `<pre class="pseudo">R1(config)# router ospf 1
R1(config-router)# router-id 1.1.1.1
R1(config-router)# network 10.0.0.0 0.0.0.255 area 0
R1(config-router)# network 192.168.1.0 0.0.0.255 area 0
R1(config-router)# passive-interface GigabitEthernet0/1
R1(config-router)# end
R1# show ip ospf neighbor      # voisin attendu en etat FULL
R1# show ip route ospf         # routes marquees "O" avec [110/cout]</pre>
<p>Le LAN utilisateurs reste annoncé mais n'envoie plus de Hello : aucun voisin ne s'y forme, ce qui est exactement le but d'une interface passive.</p>`
  }
};
</script>
