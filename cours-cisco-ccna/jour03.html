  title: "Composants réseau et architectures",
  subtitle: "Les briques matérielles et les grands plans d'un réseau d'entreprise.",
  theory: `
<h3>1. Les composants de base</h3>
<p>Un réseau se construit avec quelques équipements clés, chacun opérant à une couche précise :</p>
<pre class="pseudo"># Equipements et leur role
Switch (commutateur) : couche 2, relie les machines d'un meme reseau (MAC)
Routeur              : couche 3, relie des reseaux differents (IP, routage)
Pare-feu (firewall)  : filtre le trafic selon des regles de securite
Point d'acces (AP)   : donne l'acces Wi-Fi (sans fil)
Serveur              : fournit un service (web, DNS, fichiers)
Terminal / hote      : PC, telephone, imprimante (end device)</pre>
<p>Le <strong>switch</strong> est le cœur du réseau local (LAN) : il connecte les machines d'un même segment. Le <strong>routeur</strong> fait le pont entre réseaux distincts et choisit le meilleur chemin. Le <strong>pare-feu</strong> protège en filtrant les flux.</p>
<h3>2. L'architecture hiérarchique à 3 niveaux</h3>
<p>Pour organiser un grand réseau, Cisco recommande une architecture <strong>hiérarchique</strong>, souvent en <strong>3 niveaux</strong> (<em>3-tier</em>) :</p>
<pre class="pseudo"># Architecture 3-tier (3 couches)
Core (coeur)         : backbone tres rapide, commutation massive
Distribution         : politiques, routage inter-VLAN, agregation
Access (acces)       : branchement des utilisateurs et terminaux</pre>
<p>Chaque niveau a un rôle clair : la couche <strong>access</strong> connecte les postes, la couche <strong>distribution</strong> applique les politiques et agrège, la couche <strong>core</strong> transporte le trafic à haute vitesse. Cette séparation facilite l'évolution et le dépannage.</p>
<h3>3. Deux niveaux et « collapsed core »</h3>
<p>Dans un réseau plus petit, garder trois niveaux serait coûteux. On fusionne alors la couche core et la couche distribution : c'est le <strong>collapsed core</strong>, qui donne une architecture à <strong>2 niveaux</strong> (<em>2-tier</em>) :</p>
<pre class="pseudo"># Architecture 2-tier (collapsed core)
Core + Distribution fusionnes -> une seule couche
Access                        -> branchement des utilisateurs</pre>
<div class="tip">Règle simple : <strong>3-tier</strong> pour les grands campus, <strong>2-tier (collapsed core)</strong> pour les sites plus modestes. Le but est toujours d'équilibrer performance, coût et simplicité.</div>
<h3>4. Spine-leaf et le cloud</h3>
<p>Dans les <strong>centres de données</strong> (datacenters) modernes, le trafic circule surtout d'un serveur à l'autre (est-ouest). L'architecture hiérarchique classique convient mal ; on lui préfère le <strong>spine-leaf</strong> :</p>
<pre class="pseudo"># Architecture spine-leaf (datacenter)
Spine : commutateurs d'epine dorsale
Leaf  : commutateurs feuilles (serveurs branches ici)
-> chaque leaf est relie a CHAQUE spine (chemins egaux, faible latence)</pre>
<p>Enfin, le <strong>cloud</strong> déplace serveurs et services chez un fournisseur (AWS, Azure...). On distingue le cloud <strong>public</strong>, <strong>privé</strong> et <strong>hybride</strong>. L'entreprise loue des ressources à la demande au lieu de tout héberger elle-même.</p>
<div class="warn">Ne confonds pas les modèles : le spine-leaf est fait pour le datacenter (trafic est-ouest), tandis que le 3-tier vise le réseau de campus (trafic nord-sud, des utilisateurs vers les serveurs).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Switch = couche 2 (LAN) | Routeur = couche 3 (entre reseaux)
# 3-tier : Access + Distribution + Core (grand campus)
# 2-tier : collapsed core (Distribution+Core fusionnes, petit site)
# Spine-leaf : datacenter, chaque leaf relie a chaque spine
# Cloud : public / prive / hybride (ressources a la demande)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel équipement relie des réseaux différents et choisit le meilleur chemin ?", opts: ["Le switch", "Le routeur", "Le point d'accès", "Le pare-feu"], a: 1, exp: "Le routeur (couche 3) interconnecte des réseaux distincts et route les paquets." },
    { type: "qcm", q: "Quel équipement connecte les machines d'un même réseau local via les adresses MAC ?", opts: ["Le routeur", "Le switch", "Le modem", "Le serveur DNS"], a: 1, exp: "Le switch (commutateur), en couche 2, relie les hôtes d'un même LAN." },
    { type: "qcm", q: "Combien de niveaux compte l'architecture hiérarchique complète de Cisco ?", opts: ["2", "3", "4", "5"], a: 1, exp: "L'architecture hiérarchique complète compte 3 niveaux : access, distribution, core." },
    { type: "qcm", q: "Comment appelle-t-on la fusion des couches core et distribution ?", opts: ["Spine-leaf", "Collapsed core", "Full mesh", "Backbone"], a: 1, exp: "Fusionner core et distribution donne un « collapsed core » (architecture 2-tier)." },
    { type: "qcm", q: "Quelle architecture est privilégiée dans les datacenters modernes ?", opts: ["3-tier classique", "Spine-leaf", "Bus", "Anneau"], a: 1, exp: "Le spine-leaf convient au trafic est-ouest des datacenters." },
    { type: "qcm", q: "Dans le modèle spine-leaf, chaque commutateur leaf est relié à…", opts: ["Un seul spine", "Chaque spine", "Aucun spine", "Un seul autre leaf"], a: 1, exp: "Chaque leaf est connecté à tous les spines, offrant des chemins égaux." },
    { type: "vf", q: "Un switch classique fonctionne en couche 2 (Liaison).", a: true, exp: "Vrai : un switch de couche 2 commute selon les adresses MAC." },
    { type: "vf", q: "L'architecture collapsed core convient surtout aux très grands campus.", a: false, exp: "Non : le collapsed core (2-tier) vise les sites plus petits ; les grands campus utilisent le 3-tier." },
    { type: "vf", q: "Dans une architecture 3-tier, la couche access sert à connecter les utilisateurs.", a: true, exp: "Vrai : la couche access branche les terminaux et postes de travail." },
    { type: "vf", q: "Le cloud public appartient et est géré par un fournisseur externe.", a: true, exp: "Vrai : dans le cloud public, un fournisseur (AWS, Azure...) possède et gère l'infrastructure." },
    { type: "input", q: "Comment appelle-t-on la couche la plus haute (backbone rapide) de l'architecture 3-tier ?", a: ["core", "coeur", "la couche core", "couche core"], ph: "un mot", exp: "Le core (cœur) est le backbone à haute vitesse." },
    { type: "input", q: "Dans un datacenter spine-leaf, sur quel type de commutateur branche-t-on les serveurs ?", a: ["leaf", "les leaf", "leaves", "feuille"], ph: "un mot", exp: "Les serveurs se branchent sur les commutateurs leaf (feuilles)." },
    { type: "input", q: "Quel équipement filtre le trafic selon des règles de sécurité ?", a: ["pare-feu", "firewall", "le pare-feu", "parefeu"], ph: "un mot", exp: "Le pare-feu (firewall) filtre le trafic selon des règles." },
    { type: "input", q: "Comment nomme-t-on un cloud mêlant ressources privées et publiques ?", a: ["hybride", "cloud hybride", "hybrid"], ph: "un mot", exp: "Un cloud hybride combine cloud privé et cloud public." },
    { type: "input", q: "Quel équipement fournit l'accès Wi-Fi (sans fil) aux terminaux ?", a: ["point d'acces", "point d acces", "ap", "access point", "borne wifi"], ph: "2 mots ou sigle", exp: "Le point d'accès (AP, Access Point) donne l'accès Wi-Fi." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne architecture",
    intro: `<p>Une PME possède un petit bureau (50 postes) et un petit datacenter interne. Le DSI hésite sur les architectures à déployer. Guide ses choix.</p>`,
    questions: [
      { type: "qcm", q: "Pour le bureau de 50 postes, quelle architecture est la plus adaptée ?", opts: ["3-tier complet", "2-tier (collapsed core)", "Spine-leaf", "Full mesh de routeurs"], a: 1, exp: "Un petit site se satisfait d'un collapsed core (2-tier)." },
      { type: "qcm", q: "Pour le datacenter, quelle architecture privilégier ?", opts: ["Spine-leaf", "Bus", "Anneau", "3-tier campus"], a: 0, exp: "Le spine-leaf est conçu pour le trafic est-ouest des datacenters." },
      { type: "input", q: "Quel équipement branche les 50 postes utilisateurs sur le réseau ?", a: ["switch", "commutateur", "le switch", "switch access"], ph: "un équipement", exp: "Les postes se branchent sur des switches (couche access)." },
      { type: "vf", q: "Fusionner core et distribution donne un collapsed core.", a: true, exp: "Vrai : c'est la définition du collapsed core (2-tier)." },
      { type: "qcm", q: "S'il externalise ses serveurs chez AWS, il utilise…", opts: ["Un cloud public", "Un spine-leaf", "Un collapsed core", "Un point d'accès"], a: 0, exp: "Héberger chez AWS relève du cloud public." }
    ],
    solution: `<pre class="pseudo"># Recommandations pour la PME :
Bureau 50 postes -> 2-tier (collapsed core) : Access + (Core/Distrib fusionnes)
Datacenter       -> Spine-leaf : chaque leaf relie a chaque spine
Postes           -> branches sur des switches (couche access)
Externalisation  -> cloud public (AWS/Azure) si besoin de ressources a la demande</pre>
<p>Le choix d'architecture dépend toujours de la taille et du type de trafic. Demain : on plonge dans l'adressage IPv4 et le subnetting.</p>`
  }
};
