<h3>1. Qu'est-ce qu'une API ?</h3>
<p>Une <strong>interface de programmation applicative</strong> (en anglais <em>API</em>, Application Programming Interface) est un « contrat » qui permet à deux logiciels de dialoguer. Au lieu qu'un humain tape des commandes dans une CLI, un programme envoie des requêtes standardisées à un autre programme, qui répond de façon structurée.</p>
<div class="tip">Analogie : l'API est le serveur d'un restaurant. Tu ne vas pas en cuisine ; tu passes commande via le serveur (l'API), qui transmet et te rapporte le plat. Tu n'as pas besoin de savoir comment la cuisine fonctionne.</div>
<h3>2. Les API REST</h3>
<p><strong>REST</strong> (en anglais <em>REpresentational State Transfer</em>) est le style d'API le plus répandu pour piloter les contrôleurs réseau. Une API REST s'appuie sur <strong>HTTP/HTTPS</strong> et réutilise ses verbes (méthodes) pour agir sur des ressources identifiées par une URL :</p>
<pre class="pseudo"># Les verbes HTTP d'une API REST (CRUD)
GET    -> LIRE une ressource        (Read)
POST   -> CREER une ressource       (Create)
PUT    -> REMPLACER/METTRE A JOUR   (Update)
PATCH  -> MODIFIER partiellement    (Update partiel)
DELETE -> SUPPRIMER une ressource   (Delete)</pre>
<p>Une API REST est dite <strong>sans état</strong> (en anglais <em>stateless</em>) : chaque requête est indépendante et contient toute l'information nécessaire ; le serveur ne « se souvient » pas de la requête précédente. Les réponses portent un <strong>code de statut HTTP</strong> : 200 (OK), 201 (créé), 401 (non authentifié), 404 (non trouvé), 500 (erreur serveur).</p>
<div class="warn">Une API REST utilise HTTPS et exige presque toujours une authentification (jeton/token, clé API). Ne confonds pas le verbe et le résultat : GET lit, POST crée. Un GET ne doit jamais modifier de données.</div>
<h3>3. JSON : le format de données du web moderne</h3>
<p>Les requêtes et réponses transportent des données dans un <strong>format</strong> structuré. Le plus courant est <strong>JSON</strong> (en anglais <em>JavaScript Object Notation</em>) : lisible par l'humain et facile à traiter par la machine. JSON repose sur des <strong>paires clé/valeur</strong> entre accolades, et des listes entre crochets.</p>
<pre class="pseudo"># Un objet JSON decrivant une interface
{
  "interface": "GigabitEthernet0/1",
  "adresse_ip": "192.168.1.1",
  "masque": "255.255.255.0",
  "actif": true,
  "vlans": [10, 20, 30]
}
# Regles : cles entre guillemets, valeurs = texte / nombre / booleen /
# liste [] / objet {} ; elements separes par des virgules</pre>
<h3>4. JSON, XML, YAML : trois formats à distinguer</h3>
<p>Trois formats de structuration reviennent au CCNA. <strong>JSON</strong> : compact, dominant dans les API REST. <strong>XML</strong> (en anglais <em>eXtensible Markup Language</em>) : plus ancien, très verbeux, utilise des balises ouvrantes/fermantes comme le HTML. <strong>YAML</strong> (en anglais <em>YAML Ain't Markup Language</em>) : très lisible, basé sur l'<strong>indentation</strong> (espaces) plutôt que des accolades ; c'est le format des fichiers Ansible.</p>
<pre class="pseudo"># La meme donnee dans trois formats
# --- JSON ---
{ "vlan": 10, "nom": "VENTES" }
# --- XML ---
&lt;vlan&gt;
  &lt;id&gt;10&lt;/id&gt;
  &lt;nom&gt;VENTES&lt;/nom&gt;
&lt;/vlan&gt;
# --- YAML ---
vlan: 10
nom: VENTES</pre>
<div class="tip">Repère rapide : accolades { } = JSON ; balises &lt; &gt; = XML ; indentation avec « clé: valeur » = YAML.</div>
<h3>5. Contrôleurs et directions : northbound / southbound</h3>
<p>Un contrôleur SDN comme <strong>Cisco Catalyst Center</strong> (anciennement <strong>DNA Center</strong>) se trouve « au milieu » et expose deux types d'interfaces, désignées par leur direction :</p>
<p>Les <strong>API northbound</strong> (« vers le nord ») pointent vers le <strong>haut</strong>, vers les applications et les scripts d'automatisation. C'est par là qu'un programme (ou un administrateur via un script Python) demande au contrôleur d'agir. Ce sont typiquement des API <strong>REST</strong>.</p>
<p>Les <strong>API/interfaces southbound</strong> (« vers le sud ») pointent vers le <strong>bas</strong>, vers les équipements réseau (routeurs, switches). C'est par là que le contrôleur pousse concrètement la configuration aux appareils, via des protocoles comme NETCONF/RESTCONF ou l'historique OpenFlow.</p>
<pre class="pseudo">        [ Applications / scripts Python ]
                 ^  API NORTHBOUND (REST)  -> vers les apps
                 |
        [ CONTROLEUR : Catalyst Center / DNA Center ]
                 |
                 v  Interfaces SOUTHBOUND -> vers les equipements
        [ Routeurs et commutateurs du reseau ]</pre>
<div class="warn">Piège d'examen : northbound = vers les applications (le haut) ; southbound = vers les équipements (le bas). Inverser les deux est l'erreur classique.</div>
<h3>6. Ce qu'il faut retenir</h3>

#   NORTHBOUND = API REST vers les applications (haut)
#   SOUTHBOUND = vers les equipements reseau (bas)</pre>`,

    { type: "vf", q: "YAML utilise l'indentation (espaces) plutôt que des accolades pour structurer les données.", a: true, exp: "Oui : YAML repose sur l'indentation ; c'est le format des fichiers Ansible." },

    { type: "qcm", q: "Quel format utilise des balises ouvrantes et fermantes comme le HTML ?", opts: ["JSON", "XML", "YAML", "CSV"], a: 1, exp: "XML (eXtensible Markup Language) est verbeux et emploie des balises ouvrantes/fermantes." },
    { type: "qcm", q: "Quel verbe HTTP crée une nouvelle ressource ?", opts: ["GET", "POST", "DELETE", "HEAD"], a: 1, exp: "POST crée une ressource (Create dans le CRUD)." },
    { type: "vf", q: "Un code de statut HTTP 404 signifie que la ressource demandée est introuvable.", a: true, exp: "Oui : 404 = non trouvé. 200 = OK, 401 = non authentifié, 500 = erreur serveur." },

    { type: "qcm", q: "Quelle direction d'API un script Python utilise-t-il pour demander au contrôleur d'agir ?", opts: ["Southbound", "Northbound", "Eastbound", "Downbound"], a: 1, exp: "Le script parle au contrôleur par les API northbound (REST), du côté des applications." },
    { type: "qcm", q: "Quel repère visuel identifie du JSON ?", opts: ["Des balises &lt;tag&gt;", "Des accolades { } et des paires clé/valeur", "De l'indentation seule", "Des points-virgules en fin de ligne"], a: 1, exp: "JSON se reconnaît à ses accolades { } et ses paires \"clé\": valeur." },
    { type: "vf", q: "Southbound signifie « vers les applications » et northbound « vers les équipements ».", a: false, exp: "C'est l'inverse : northbound = vers les applications (haut), southbound = vers les équipements (bas)." }
  ],

      { type: "input", q: "Dans quel format compact, à base d'accolades, la réponse du contrôleur arrive-t-elle typiquement ?", a: ["json"], ph: "4 lettres", exp: "Les API REST renvoient le plus souvent du JSON." },
      { type: "qcm", q: "Une fois le VLAN décidé, comment le contrôleur l'applique-t-il aux switches ?", opts: ["Par ses API northbound", "Par ses interfaces southbound", "Par Telnet manuel", "Il ne peut pas"], a: 1, exp: "Le contrôleur pousse la config aux équipements via ses interfaces southbound." }
    ],
    solution: `<pre class="pseudo"># Flux complet du script
[ Script Python ] --REST northbound--> [ Catalyst Center ]
   GET  /devices        -> lit la liste (reponse JSON, code 200)
   POST /vlan {json}    -> cree le VLAN  (reponse JSON, code 201)
[ Catalyst Center ] --southbound (NETCONF/RESTCONF)--> [ Switches ]
   applique concretement la configuration du VLAN</pre>
<p>Northbound (REST/JSON) pour parler au contrôleur, southbound pour qu'il configure les équipements : c'est la chaîne complète de l'automatisation SDN.</p>`
