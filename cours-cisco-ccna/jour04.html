var DAY = {
  num: 4,
  title: "L'adressage IPv4 et le subnetting",
  subtitle: "Comprendre les adresses IP et découper un réseau en sous-réseaux.",
  theory: `
<h3>1. Anatomie d'une adresse IPv4</h3>
<p>Une adresse <strong>IPv4</strong> est un nombre de <strong>32 bits</strong>, écrit en notation décimale pointée : quatre nombres (octets) de 0 à 255 séparés par des points, par exemple <strong>192.168.1.10</strong>. Chaque octet vaut 8 bits, soit 4 × 8 = 32 bits au total.</p>
<p>Une adresse se divise en deux parties : la <strong>partie réseau</strong> (identifie le réseau) et la <strong>partie hôte</strong> (identifie la machine dans ce réseau). C'est le <strong>masque de sous-réseau</strong> qui indique où passe la frontière.</p>
<h3>2. Le masque et la notation CIDR</h3>
<p>Le <strong>masque de sous-réseau</strong> (<em>subnet mask</em>) est une suite de bits à 1 (partie réseau) suivie de bits à 0 (partie hôte). On l'écrit soit en décimal (255.255.255.0), soit en <strong>CIDR</strong> : une barre oblique suivie du nombre de bits à 1.</p>
<pre class="pseudo"># Trois masques courants
/24  = 255.255.255.0    -> 24 bits reseau, 8 bits hote
/16  = 255.255.0.0      -> 16 bits reseau, 16 bits hote
/8   = 255.0.0.0        -> 8  bits reseau, 24 bits hote</pre>
<h3>3. Compter les hôtes utilisables</h3>
<p>Le nombre d'adresses d'un sous-réseau dépend du nombre de bits d'hôte (h) : 2 puissance h. Mais deux adresses sont <strong>réservées</strong> et non attribuables à une machine : la première (adresse <strong>réseau</strong>) et la dernière (adresse de <strong>diffusion</strong>, ou <em>broadcast</em>).</p>
<pre class="pseudo"># Formule : hotes utilisables = 2^h - 2
/24 : 2^8  - 2 = 254 hotes
/26 : 2^6  - 2 = 62  hotes
/30 : 2^2  - 2 = 2   hotes (ideal pour une liaison entre 2 routeurs)</pre>
<div class="warn">On soustrait toujours 2 : la première adresse identifie le réseau, la dernière est le broadcast. Aucune des deux ne peut être donnée à un ordinateur.</div>
<h3>4. Classes et adresses privées</h3>
<p>Historiquement, les adresses se rangeaient en <strong>classes</strong> A, B et C selon leur premier octet. On retient surtout aujourd'hui les <strong>plages privées</strong> (RFC 1918), non routables sur Internet et réservées aux réseaux internes :</p>
<pre class="pseudo"># Adresses privees (RFC 1918)
10.0.0.0     a 10.255.255.255   (/8)
172.16.0.0   a 172.31.255.255   (/12)
192.168.0.0  a 192.168.255.255  (/16)
# 127.0.0.1 = loopback (la machine elle-meme)</pre>
<div class="tip">L'adresse <strong>127.0.0.1</strong> (loopback) désigne toujours la machine locale. Les plages privées permettent d'adresser un réseau interne sans consommer d'adresses publiques ; un routeur fait ensuite la traduction (NAT) vers Internet.</div>
<h3>5. Un exemple de subnetting</h3>
<p>Découpons le réseau <strong>192.168.1.0/24</strong> en sous-réseaux plus petits. En empruntant 2 bits à la partie hôte, on passe de /24 à /26 et on obtient 4 sous-réseaux de 62 hôtes chacun :</p>
<pre class="pseudo"># 192.168.1.0/24 decoupe en /26 (bloc de 64)
192.168.1.0/26    hotes .1  a .62   (broadcast .63)
192.168.1.64/26   hotes .65 a .126  (broadcast .127)
192.168.1.128/26  hotes .129 a .190 (broadcast .191)
192.168.1.192/26  hotes .193 a .254 (broadcast .255)</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IPv4 = 32 bits, notation decimale pointee (ex : 192.168.1.10)
# Masque : separe partie reseau (bits 1) et partie hote (bits 0)
# CIDR : /24 = 255.255.255.0
# Hotes utilisables = 2^h - 2 (reseau + broadcast reserves)
# Prives (RFC 1918) : 10.x, 172.16-31.x, 192.168.x  | loopback 127.0.0.1</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits est codée une adresse IPv4 ?", opts: ["16 bits", "32 bits", "64 bits", "128 bits"], a: 1, exp: "Une adresse IPv4 fait 32 bits (4 octets de 8 bits)." },
    { type: "qcm", q: "À quel masque décimal correspond la notation /24 ?", opts: ["255.255.0.0", "255.255.255.0", "255.255.255.128", "255.0.0.0"], a: 1, exp: "/24 = 255.255.255.0 (24 bits à 1)." },
    { type: "qcm", q: "Combien d'hôtes utilisables offre un réseau /24 ?", opts: ["256", "255", "254", "253"], a: 2, exp: "2^8 - 2 = 254 hôtes utilisables." },
    { type: "qcm", q: "Quelles deux adresses sont réservées dans chaque sous-réseau ?", opts: ["La première et la deuxième", "L'adresse réseau et l'adresse de broadcast", "La passerelle et le DNS", "Les deux dernières"], a: 1, exp: "La première (réseau) et la dernière (broadcast) sont réservées." },
    { type: "qcm", q: "Laquelle de ces plages est une adresse privée (RFC 1918) ?", opts: ["8.8.8.0/24", "192.168.0.0/16", "1.1.1.0/24", "200.10.10.0/24"], a: 1, exp: "192.168.0.0/16 fait partie des plages privées RFC 1918." },
    { type: "qcm", q: "Que représente l'adresse 127.0.0.1 ?", opts: ["La passerelle par défaut", "L'adresse de loopback (la machine locale)", "Le serveur DNS de Google", "Une adresse de broadcast"], a: 1, exp: "127.0.0.1 est l'adresse de loopback : la machine elle-même." },
    { type: "vf", q: "Le masque de sous-réseau sépare la partie réseau de la partie hôte.", a: true, exp: "Vrai : les bits à 1 marquent la partie réseau, les bits à 0 la partie hôte." },
    { type: "vf", q: "Un réseau /30 offre 4 hôtes utilisables.", a: false, exp: "Faux : /30 donne 2^2 - 2 = 2 hôtes utilisables (idéal pour une liaison point à point)." },
    { type: "vf", q: "Les adresses privées RFC 1918 sont routables directement sur Internet.", a: false, exp: "Faux : les adresses privées ne sont pas routées sur Internet ; il faut du NAT." },
    { type: "vf", q: "Chaque octet d'une adresse IPv4 peut aller de 0 à 255.", a: true, exp: "Vrai : un octet (8 bits) code 256 valeurs, de 0 à 255." },
    { type: "input", q: "En notation CIDR, comment s'écrit le masque 255.255.255.0 ?", a: ["/24", "24"], ph: "/XX", exp: "255.255.255.0 correspond à /24." },
    { type: "input", q: "Combien d'hôtes utilisables dans un réseau /26 ?", a: ["62", "62 hotes"], ph: "un nombre", exp: "/26 : 2^6 - 2 = 62 hôtes utilisables." },
    { type: "input", q: "Quelle est la première plage privée (celle en /8) ? Donne le réseau.", a: ["10.0.0.0", "10.0.0.0/8", "10.0.0.0 /8"], ph: "adresse réseau", exp: "La plage 10.0.0.0/8 est privée (RFC 1918)." },
    { type: "input", q: "Dans le sous-réseau 192.168.1.0/26, quelle est l'adresse de broadcast ?", a: ["192.168.1.63", "192.168.1.63/26"], ph: "adresse IP", exp: "Le bloc /26 fait 64 adresses : broadcast = 192.168.1.63." },
    { type: "input", q: "Combien de bits d'hôte reste-t-il dans un masque /24 ?", a: ["8", "8 bits", "huit"], ph: "un nombre", exp: "32 - 24 = 8 bits d'hôte." }
  ],
  final: {
    title: "Exercice final — Découper un /24 en quatre",
    intro: `<p>Une entreprise dispose du réseau <code>192.168.10.0/24</code> et veut le partager en 4 sous-réseaux égaux, un par service. Aide l'administrateur à faire les calculs.</p>`,
    questions: [
      { type: "input", q: "Quel masque CIDR crée exactement 4 sous-réseaux égaux à partir d'un /24 ?", a: ["/26", "26"], ph: "/XX", exp: "Emprunter 2 bits donne 4 sous-réseaux : /26." },
      { type: "input", q: "Combien d'hôtes utilisables par sous-réseau /26 ?", a: ["62", "62 hotes"], ph: "un nombre", exp: "2^6 - 2 = 62 hôtes utilisables." },
      { type: "input", q: "Quelle est l'adresse réseau du 2e sous-réseau ?", a: ["192.168.10.64", "192.168.10.64/26"], ph: "adresse IP", exp: "Les blocs de 64 : 0, 64, 128, 192. Le 2e est 192.168.10.64." },
      { type: "qcm", q: "Dans le sous-réseau 192.168.10.0/26, quelle adresse est un hôte valide ?", opts: ["192.168.10.0", "192.168.10.63", "192.168.10.30", "192.168.10.64"], a: 2, exp: ".0 = réseau, .63 = broadcast, .64 = autre réseau. .30 est un hôte valide." },
      { type: "vf", q: "L'adresse 192.168.10.128 est l'adresse réseau du 3e sous-réseau.", a: true, exp: "Vrai : blocs de 64 -> 0, 64, 128, 192. Le 3e commence à .128." }
    ],
    solution: `<pre class="pseudo"># 192.168.10.0/24 -> 4 sous-reseaux /26 (bloc de 64) :
Sous-reseau 1 : 192.168.10.0/26    hotes .1  -> .62   (bcast .63)
Sous-reseau 2 : 192.168.10.64/26   hotes .65 -> .126  (bcast .127)
Sous-reseau 3 : 192.168.10.128/26  hotes .129 -> .190 (bcast .191)
Sous-reseau 4 : 192.168.10.192/26  hotes .193 -> .254 (bcast .255)
# 62 hotes utilisables chacun.</pre>
<p>Tu sais découper un réseau en blocs égaux. Demain : le VLSM, pour créer des sous-réseaux de tailles différentes selon les besoins.</p>`
  }
};
