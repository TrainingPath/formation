  title: "Les VLAN et le trunking (802.1Q)",
  subtitle: "Découper un seul switch en plusieurs réseaux logiques étanches.",
  theory: `
<h3>1. Pourquoi découper : la notion de VLAN</h3>
<p>Par défaut, tous les ports d'un switch appartiennent au même réseau : c'est un seul <strong>domaine de diffusion</strong> (<em>broadcast domain</em>). Chaque trame de diffusion (ARP, DHCP…) est reçue par toutes les machines. Plus il y a d'appareils, plus ce « bruit » grandit et plus il est difficile de séparer les services. Un <strong>VLAN</strong> (<em>Virtual Local Area Network</em>, réseau local virtuel) permet de découper un même commutateur physique en plusieurs réseaux logiques indépendants.</p>
<p>Image : un immeuble de bureaux avec un seul grand plateau ouvert. Poser des cloisons crée des salles séparées : les gens d'une salle ne voient plus ceux d'à côté, même s'ils partagent le même bâtiment. Un VLAN est une cloison logique : les ports du VLAN 10 (Comptabilité) ne « parlent » pas directement à ceux du VLAN 20 (Production), même branchés sur le même switch.</p>
<h3>2. Créer un VLAN et affecter un port (mode access)</h3>
<p>Un port qui appartient à un seul VLAN et sert à brancher un poste de travail est un <strong>port d'accès</strong> (<em>access port</em>). On crée d'abord le VLAN, puis on met le port en mode access et on l'affecte au VLAN voulu.</p>
<pre class="pseudo">Switch(config)# vlan 10
Switch(config-vlan)# name COMPTA
Switch(config-vlan)# exit
Switch(config)# vlan 20
Switch(config-vlan)# name PRODUCTION
Switch(config-vlan)# exit
Switch(config)# interface fastEthernet 0/1
Switch(config-if)# switchport mode access
Switch(config-if)# switchport access vlan 10</pre>
<p>Vérification utile : <strong>show vlan brief</strong> liste les VLAN et les ports affectés ; <strong>show interfaces status</strong> montre le VLAN de chaque port.</p>
<div class="tip">Le VLAN 1 est le VLAN par défaut : tous les ports y sont au départ. Pour la sécurité, on évite de laisser des postes sensibles dans le VLAN 1 et on ne l'utilise pas comme VLAN de gestion.</div>
<h3>3. Le trunk et le tag 802.1Q</h3>
<p>Un seul switch suffit rarement. Quand deux switchs doivent transporter <em>plusieurs</em> VLAN sur un même câble, on n'utilise pas un port d'accès mais un <strong>port trunk</strong> (liaison agrégée). Sur un trunk, chaque trame reçoit une <strong>étiquette</strong> (<em>tag</em>) indiquant son VLAN : c'est le rôle de la norme <strong>IEEE 802.1Q</strong>. Le tag est un champ de 4 octets inséré dans la trame Ethernet ; il contient le <strong>VLAN ID</strong> (12 bits, soit 1 à 4094).</p>
<pre class="pseudo">Switch(config)# interface gigabitEthernet 0/1
Switch(config-if)# switchport mode trunk
Switch(config-if)# switchport trunk allowed vlan 10,20
! Verification :
Switch# show interfaces trunk</pre>
<p>Analogie : un port d'accès, c'est une lettre sans enveloppe (le facteur sait déjà à quelle salle elle va). Un trunk, c'est le sac postal commun où chaque lettre porte une étiquette de destination : à l'arrivée, le switch lit le tag et remet la trame dans le bon VLAN, puis retire l'étiquette avant de la livrer au poste.</p>
<h3>4. Le VLAN natif</h3>
<p>Sur un trunk 802.1Q, un VLAN circule <strong>sans tag</strong> : c'est le <strong>VLAN natif</strong> (<em>native VLAN</em>), par défaut le VLAN 1. Toute trame arrivant sans étiquette est rangée dans ce VLAN natif. Les deux extrémités d'un trunk doivent utiliser le même VLAN natif, sinon les trames se retrouvent dans le mauvais réseau.</p>
<pre class="pseudo">Switch(config-if)# switchport trunk native vlan 99</pre>
<div class="warn">Piège d'examen : un port d'accès transporte UN SEUL VLAN, sans tag côté poste. Un trunk transporte PLUSIEURS VLAN, chacun taggé en 802.1Q (sauf le VLAN natif). Ne confonds pas « access » et « trunk ».</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLAN = reseau logique = 1 domaine de diffusion separe
# Port ACCESS : 1 seul VLAN (poste)   -> switchport mode access
# Port TRUNK  : plusieurs VLAN (switchs) -> switchport mode trunk
# 802.1Q : ajoute un tag de 4 octets (VLAN ID 1-4094)
# VLAN natif : circule SANS tag (par defaut VLAN 1)
# vlan 10 / switchport access vlan 10 / show vlan brief</pre>`,

    { type: "qcm", q: "Combien d'octets le tag 802.1Q ajoute-t-il à la trame ?", opts: ["1 octet", "4 octets", "8 octets", "16 octets"], a: 1, exp: "Le champ 802.1Q fait 4 octets et contient notamment le VLAN ID sur 12 bits." },
    { type: "input", q: "Quelle commande met une interface en mode trunk ? (ligne exacte)", a: ["switchport mode trunk"], ph: "switchport mode …", exp: "switchport mode trunk force le port en liaison agrégée." },
    { type: "qcm", q: "Quelle commande liste rapidement les VLAN et leurs ports ?", opts: ["show ip route", "show vlan brief", "show mac address-table", "show trunk"], a: 1, exp: "show vlan brief affiche les VLAN existants et les ports affectés." },
    { type: "vf", q: "Deux extrémités d'un même trunk peuvent avoir des VLAN natifs différents sans aucun problème.", a: false, exp: "Faux : un VLAN natif incohérent range les trames non taggées dans le mauvais VLAN (et déclenche des alertes)." },
    { type: "qcm", q: "Quelle est la plage valide d'un VLAN ID en 802.1Q ?", opts: ["0 à 255", "1 à 1024", "1 à 4094", "1 à 65535"], a: 2, exp: "Le VLAN ID est codé sur 12 bits ; les valeurs utilisables vont de 1 à 4094." },
    { type: "input", q: "Quelle commande affiche l'état des trunks et les VLAN autorisés ?", a: ["show interfaces trunk", "show interface trunk", "show int trunk"], ph: "show interfaces …", exp: "show interfaces trunk montre les ports en trunk, le VLAN natif et les VLAN autorisés." },
    { type: "qcm", q: "Un poste branché sur un port access reçoit-il les trames taggées 802.1Q ?", opts: ["Oui, il lit le tag lui-même", "Non : le switch retire le tag avant de livrer la trame au poste", "Oui, mais chiffrées", "Seulement en VLAN 1"], a: 1, exp: "Le tag ne sert qu'entre switchs ; il est retiré avant la livraison sur un port access." }
  ],

    intro: `<p>Deux switchs (SW1 et SW2) relient la Comptabilité (VLAN 10) et la Production (VLAN 20). Sur SW1, le PC compta est branché sur Fa0/1 et le PC prod sur Fa0/2. Les deux switchs sont reliés par leur port Gi0/1. Configure correctement.</p>`,

    ],
    solution: `<pre class="pseudo">! Sur SW1 et SW2 : creer les VLAN
vlan 10
 name COMPTA
vlan 20
 name PRODUCTION
! Ports d'acces (SW1)
interface fa0/1
 switchport mode access
 switchport access vlan 10
interface fa0/2
 switchport mode access
 switchport access vlan 20
! Liaison inter-switchs = trunk
interface gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20</pre>
<p>Les deux VLAN sont maintenant étanches. Pour les faire communiquer, il faudra du routage inter-VLAN : c'est le sujet de demain.</p>`
