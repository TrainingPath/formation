<script>
var DAY = {
  num: 21,
  title: "Le DHCP et le DNS sur IOS",
  subtitle: "Attribuer les adresses automatiquement et traduire les noms : les deux services qui rendent le réseau utilisable.",
  theory: `
<h3>1. DHCP : l'attribution automatique d'adresses</h3>
<p>Le <strong>DHCP</strong> (« Dynamic Host Configuration Protocol ») distribue automatiquement aux postes une adresse IP, un masque, une passerelle et des serveurs DNS. Sans lui, il faudrait configurer chaque machine à la main. C'est l'hôtesse d'accueil qui remet à chaque visiteur son badge, son plan et son itinéraire.</p>
<p>L'échange se fait en quatre messages, le fameux <strong>DORA</strong> :</p>
<pre class="pseudo"># D - DISCOVER : le client cherche un serveur (broadcast)
# O - OFFER    : un serveur propose une adresse
# R - REQUEST  : le client demande officiellement cette adresse (broadcast)
# A - ACK      : le serveur confirme et fixe la duree du bail (lease)</pre>
<h3>2. Configurer un pool DHCP sur IOS</h3>
<p>Un routeur Cisco peut jouer le rôle de serveur DHCP. On exclut d'abord les adresses réservées (passerelle, serveurs), puis on crée un <strong>pool</strong>.</p>
<pre class="pseudo">R1(config)# ip dhcp excluded-address 192.168.1.1 192.168.1.10
R1(config)# ip dhcp pool LAN_BUREAU
R1(dhcp-config)# network 192.168.1.0 255.255.255.0
R1(dhcp-config)# default-router 192.168.1.1
R1(dhcp-config)# dns-server 8.8.8.8
R1(dhcp-config)# domain-name entreprise.local
R1(dhcp-config)# lease 7                     # bail de 7 jours</pre>
<div class="warn">Pense à <strong>exclure</strong> l'adresse de la passerelle et celles des serveurs, sinon le DHCP risque de les attribuer à un poste et de créer un conflit d'adresses.</div>
<h3>3. Quand le serveur DHCP est ailleurs : ip helper-address</h3>
<p>Le message DISCOVER est un <strong>broadcast</strong> : par défaut, un routeur ne le laisse pas franchir un sous-réseau. Si les clients et le serveur DHCP sont dans des réseaux différents, on configure sur l'interface côté clients un <strong>relais DHCP</strong> avec <code>ip helper-address</code>. Le routeur transforme alors le broadcast en <strong>unicast</strong> dirigé vers le serveur.</p>
<pre class="pseudo">R1(config)# interface Gi0/0                  # interface cote CLIENTS
R1(config-if)# ip helper-address 10.0.0.5    # adresse du serveur DHCP distant</pre>
<div class="tip"><code>ip helper-address</code> relaie par défaut plusieurs services UDP utiles (dont DHCP, TFTP, DNS, TACACS…), pas seulement le DHCP.</div>
<h3>4. Le client DHCP : un routeur peut aussi recevoir une adresse</h3>
<pre class="pseudo">R1(config)# interface Gi0/1
R1(config-if)# ip address dhcp              # l'interface obtient son IP par DHCP</pre>
<h3>5. DNS : traduire les noms en adresses</h3>
<p>Le <strong>DNS</strong> (« Domain Name System ») est l'annuaire d'Internet : il convertit un nom lisible (www.exemple.com) en adresse IP. Sur IOS, on active la résolution et on désigne un serveur :</p>
<pre class="pseudo">R1(config)# ip domain-lookup                 # active la resolution DNS (souvent par defaut)
R1(config)# ip name-server 8.8.8.8           # serveur DNS a interroger
R1(config)# ip domain-name entreprise.local  # domaine par defaut
# Entree statique locale (sans serveur) :
R1(config)# ip host serveur1 10.0.0.5</pre>
<div class="warn">Si <code>ip domain-lookup</code> est actif et qu'aucun serveur n'est joignable, une faute de frappe dans une commande déclenche une tentative de résolution qui fige le terminal quelques secondes. En labo, on désactive souvent avec <code>no ip domain-lookup</code>.</div>
<h3>6. Vérifier</h3>
<pre class="pseudo">show ip dhcp binding          # baux attribues (adresse, MAC/ID, expiration)
show ip dhcp pool             # etat du pool, plage, nb d'adresses utilisees
show ip dhcp conflict         # conflits detectes
show hosts                    # cache de noms DNS et serveurs configures</pre>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DHCP : attribue IP/masque/passerelle/DNS ; echange DORA (Discover/Offer/Request/Ack)
# Pool IOS : ip dhcp pool NOM -> network / default-router / dns-server / lease
# ip dhcp excluded-address : reserver passerelle et serveurs
# Serveur DHCP distant : ip helper-address SERVEUR sur l'interface CLIENTS (relais)
# DNS : traduit nom &lt;-&gt; IP ; ip name-server / ip domain-name / ip host (statique)
# Verifier : show ip dhcp binding | show ip dhcp pool | show hosts</pre>`,
  exercises: [
    { type: "qcm", q: "Que distribue un serveur DHCP à un client ?", opts: ["Uniquement une adresse MAC", "Adresse IP, masque, passerelle et serveurs DNS", "Seulement un nom de domaine", "Seulement l'adresse de la passerelle"], a: 1, exp: "Le DHCP fournit IP, masque, passerelle par défaut et adresses DNS notamment." },
    { type: "input", q: "Quel acronyme résume les quatre messages de l'échange DHCP ?", a: ["dora", "d.o.r.a"], ph: "4 lettres", exp: "DORA : Discover, Offer, Request, Ack." },
    { type: "qcm", q: "Quel est le premier message envoyé par un client DHCP ?", opts: ["OFFER", "REQUEST", "DISCOVER", "ACK"], a: 2, exp: "Le client commence par un DISCOVER en broadcast pour trouver un serveur." },
    { type: "qcm", q: "À quoi sert « ip dhcp excluded-address » ?", opts: ["À supprimer le pool", "À réserver des adresses pour qu'elles ne soient pas attribuées", "À activer le DNS", "À définir le bail"], a: 1, exp: "On exclut les adresses fixes (passerelle, serveurs) de la distribution automatique." },
    { type: "vf", q: "Par défaut, un routeur relaie les broadcasts DHCP entre sous-réseaux.", a: false, exp: "Faux : un routeur ne propage pas les broadcasts. Il faut un relais (ip helper-address)." },
    { type: "input", q: "Quelle commande d'interface transforme le routeur en relais DHCP vers un serveur distant ? (commande + exemple d'adresse 10.0.0.5)", a: ["ip helper-address 10.0.0.5", "iphelper-address 10.0.0.5"], ph: "ip helper-address ...", exp: "ip helper-address 10.0.0.5 sur l'interface côté clients." },
    { type: "qcm", q: "Sur quelle interface place-t-on la commande ip helper-address ?", opts: ["Sur l'interface côté serveur DHCP", "Sur l'interface côté clients (où arrivent les DISCOVER)", "Sur la loopback", "Sur toutes les interfaces WAN"], a: 1, exp: "Elle se place sur l'interface qui reçoit les broadcasts des clients." },
    { type: "qcm", q: "Que fait le relais avec le broadcast DHCP du client ?", opts: ["Il l'ignore", "Il le convertit en unicast vers le serveur distant", "Il le chiffre", "Il le renvoie au client"], a: 1, exp: "Le relais transforme le broadcast en unicast dirigé vers l'adresse du serveur." },
    { type: "qcm", q: "Que fait fondamentalement le DNS ?", opts: ["Attribuer des adresses IP", "Traduire un nom de domaine en adresse IP", "Filtrer les ports", "Chiffrer le trafic"], a: 1, exp: "Le DNS convertit les noms lisibles en adresses IP." },
    { type: "input", q: "Quelle commande désigne le serveur DNS 8.8.8.8 à interroger sur IOS ?", a: ["ip name-server 8.8.8.8", "ipname-server 8.8.8.8"], ph: "ip name-server ...", exp: "ip name-server 8.8.8.8 indique le serveur DNS à interroger." },
    { type: "vf", q: "« ip host serveur1 10.0.0.5 » crée une entrée de nom statique locale sans serveur DNS.", a: true, exp: "Vrai : ip host associe localement un nom à une adresse, sans requête DNS." },
    { type: "qcm", q: "Quelle commande active la résolution de noms DNS sur le routeur ?", opts: ["ip domain-lookup", "ip name-lookup", "dns enable", "ip host lookup"], a: 0, exp: "ip domain-lookup active la résolution DNS (souvent activée par défaut)." },
    { type: "qcm", q: "Quelle commande affiche les baux DHCP attribués ?", opts: ["show ip dhcp pool", "show ip dhcp binding", "show hosts", "show ip route"], a: 1, exp: "show ip dhcp binding liste les baux (adresse, identifiant client, expiration)." },
    { type: "vf", q: "En labo, on désactive parfois ip domain-lookup pour éviter que les fautes de frappe figent le terminal.", a: true, exp: "Vrai : sans serveur joignable, une commande erronée déclenche une tentative de résolution bloquante." },
    { type: "qcm", q: "Dans un pool IOS, quelle commande définit la passerelle remise aux clients ?", opts: ["network", "default-router", "dns-server", "lease"], a: 1, exp: "default-router indique la passerelle par défaut distribuée aux clients." }
  ],
  final: {
    title: "Exercice final — DHCP local puis relais",
    intro: `<p>R1 doit servir le LAN 192.168.1.0/24 (interface Gi0/0, adresse 192.168.1.1) en DHCP : réserver 192.168.1.1 à 192.168.1.9, distribuer la passerelle 192.168.1.1 et le DNS 8.8.8.8. Plus tard, l'entreprise centralise le DHCP sur un serveur en 10.0.0.5 : R1 devra alors relayer les demandes.</p>`,
    questions: [
      { type: "input", q: "Écris la commande qui exclut la plage 192.168.1.1 à 192.168.1.9.", a: ["ip dhcp excluded-address 192.168.1.1 192.168.1.9"], ph: "ip dhcp excluded-address ...", exp: "ip dhcp excluded-address 192.168.1.1 192.168.1.9." },
      { type: "input", q: "Écris la commande qui crée le pool nommé LAN_BUREAU.", a: ["ip dhcp pool lan_bureau"], ph: "ip dhcp pool ...", exp: "ip dhcp pool LAN_BUREAU ouvre le mode dhcp-config." },
      { type: "qcm", q: "Dans le pool, quelle commande définit le réseau à distribuer ?", opts: ["default-router 192.168.1.0", "network 192.168.1.0 255.255.255.0", "dns-server 192.168.1.0", "lease 192.168.1.0"], a: 1, exp: "network 192.168.1.0 255.255.255.0 définit la plage distribuée." },
      { type: "qcm", q: "Une fois le DHCP centralisé sur 10.0.0.5, que configure-t-on sur Gi0/0 de R1 ?", opts: ["ip address dhcp", "ip helper-address 10.0.0.5", "ip name-server 10.0.0.5", "ip nat inside"], a: 1, exp: "ip helper-address 10.0.0.5 fait de R1 un relais vers le serveur distant." },
      { type: "qcm", q: "Quelle commande vérifie que des clients ont bien reçu un bail ?", opts: ["show ip dhcp binding", "show version", "show vlan", "show ip ospf neighbor"], a: 0, exp: "show ip dhcp binding affiche les baux attribués." }
    ],
    solution: `<pre class="pseudo"># --- DHCP local sur R1 ---
R1(config)# ip dhcp excluded-address 192.168.1.1 192.168.1.9
R1(config)# ip dhcp pool LAN_BUREAU
R1(dhcp-config)#  network 192.168.1.0 255.255.255.0
R1(dhcp-config)#  default-router 192.168.1.1
R1(dhcp-config)#  dns-server 8.8.8.8
R1# show ip dhcp binding

# --- Plus tard : DHCP centralise en 10.0.0.5 ---
R1(config)# interface Gi0/0
R1(config-if)#  ip helper-address 10.0.0.5   # R1 relaie les DISCOVER en unicast</pre>
<p>En local, R1 est serveur DHCP ; centralisé, il devient relais. Dans les deux cas, on n'oublie pas d'exclure les adresses fixes.</p>`
  }
};
</script>
