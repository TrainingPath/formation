<script>
var DAY = {
  num: 8,
  title: "La configuration de base d'un switch",
  subtitle: "Nom, mots de passe, IP de gestion et sauvegarde : les gestes essentiels.",
  theory: `
<h3>1. Nommer l'équipement (hostname)</h3>
<p>Un switch sorti d'usine s'appelle « Switch ». Dans un vrai réseau, on lui donne un <strong>nom parlant</strong> pour le reconnaître : c'est le rôle de la commande <strong>hostname</strong>, en configuration globale. Le prompt change immédiatement.</p>
<pre class="pseudo"># Renommer le switch
Switch&gt; enable
Switch# configure terminal
Switch(config)# hostname SW-Etage1
SW-Etage1(config)#          # le prompt reflete le nouveau nom</pre>
<h3>2. Protéger l'accès par mots de passe</h3>
<p>Un switch non protégé est une porte ouverte. On sécurise deux points d'entrée : l'accès au <strong>mode privilégié</strong> et les <strong>lignes de connexion</strong> (console et VTY pour SSH/Telnet).</p>
<pre class="pseudo"># Securiser le mode privilegie (chiffre dans la config)
SW-Etage1(config)# enable secret MonMotDePasse
# Securiser la console (acces physique)
SW-Etage1(config)# line console 0
SW-Etage1(config-line)# password ConsolePass
SW-Etage1(config-line)# login
SW-Etage1(config-line)# exit
# Chiffrer les mots de passe restes en clair
SW-Etage1(config)# service password-encryption</pre>
<div class="tip">Préfère toujours <strong>enable secret</strong> (haché, sécurisé) à l'ancien <strong>enable password</strong> (faible). La commande <strong>service password-encryption</strong> masque les mots de passe encore en clair dans la configuration.</div>
<h3>3. Donner une IP de gestion (SVI)</h3>
<p>Un switch de couche 2 ne route pas, mais il a besoin d'une <strong>adresse IP de gestion</strong> pour être administré à distance (SSH). Cette adresse se pose sur une interface virtuelle, la <strong>SVI</strong> (souvent VLAN 1), accompagnée d'une passerelle par défaut :</p>
<pre class="pseudo"># Interface virtuelle de gestion + passerelle
SW-Etage1(config)# interface vlan 1
SW-Etage1(config-if)# ip address 192.168.1.2 255.255.255.0
SW-Etage1(config-if)# no shutdown          # active l'interface
SW-Etage1(config-if)# exit
SW-Etage1(config)# ip default-gateway 192.168.1.1</pre>
<div class="warn">N'oublie jamais <strong>no shutdown</strong> : par défaut une interface peut rester désactivée (« administratively down »). Sans elle, l'IP de gestion ne répondra pas.</div>
<h3>4. Enregistrer la configuration</h3>
<p>Ici se cache le piège le plus classique. IOS distingue deux fichiers : la <strong>running-config</strong> (configuration active, en mémoire vive RAM, perdue au redémarrage) et la <strong>startup-config</strong> (configuration de démarrage, en mémoire NVRAM, conservée). Tes commandes s'appliquent d'abord à la running-config seulement.</p>
<pre class="pseudo"># Sauvegarder la config active vers la config de demarrage
SW-Etage1# copy running-config startup-config
Destination filename [startup-config]?     # appuie sur Entree
# Forme abregee equivalente
SW-Etage1# wr
# Verifier ce qui tourne actuellement
SW-Etage1# show running-config</pre>
<div class="warn">Tant que tu n'as pas fait <strong>copy running-config startup-config</strong>, toutes tes modifications disparaîtront au prochain redémarrage. C'est l'erreur numéro un des débutants.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># hostname NOM              -> nommer le switch
# enable secret MDP         -> proteger le mode privilegie (hache)
# line console 0 + password + login -> proteger la console
# service password-encryption -> chiffrer les mots de passe en clair
# interface vlan 1 + ip address + no shutdown -> IP de gestion (SVI)
# ip default-gateway IP     -> passerelle du switch
# copy running-config startup-config -> SAUVEGARDER (sinon tout est perdu)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle commande donne un nom au switch ?", opts: ["name", "hostname", "set-name", "rename"], a: 1, exp: "hostname (en configuration globale) nomme l'équipement." },
    { type: "qcm", q: "Quelle commande protège au mieux le mode privilégié ?", opts: ["enable password", "enable secret", "login local", "password enable"], a: 1, exp: "enable secret stocke le mot de passe haché : plus sûr qu'enable password." },
    { type: "qcm", q: "Sur quelle interface pose-t-on l'IP de gestion d'un switch de couche 2 ?", opts: ["fa0/1", "interface vlan 1 (SVI)", "loopback 0", "serial 0/0"], a: 1, exp: "L'IP de gestion se pose sur la SVI, souvent interface vlan 1." },
    { type: "qcm", q: "Quelle commande active une interface désactivée ?", opts: ["enable", "no shutdown", "no disable", "interface enable"], a: 1, exp: "no shutdown active (relève) l'interface." },
    { type: "qcm", q: "Quelle commande sauvegarde la config active de façon permanente ?", opts: ["save config", "copy startup-config running-config", "copy running-config startup-config", "backup now"], a: 2, exp: "copy running-config startup-config enregistre la config en NVRAM." },
    { type: "qcm", q: "Que fait « service password-encryption » ?", opts: ["Chiffre le trafic réseau", "Masque les mots de passe en clair dans la config", "Supprime tous les mots de passe", "Active SSH"], a: 1, exp: "Elle chiffre (masque) les mots de passe encore en clair dans la configuration." },
    { type: "vf", q: "La running-config est stockée en RAM et perdue au redémarrage.", a: true, exp: "Vrai : la running-config est en RAM ; sans sauvegarde, elle disparaît au reboot." },
    { type: "vf", q: "La startup-config est conservée en NVRAM au redémarrage.", a: true, exp: "Vrai : la startup-config, en NVRAM, sert de config de démarrage." },
    { type: "vf", q: "Un switch de couche 2 route les paquets grâce à son IP de gestion.", a: false, exp: "Faux : l'IP de gestion sert uniquement à l'administrer ; un switch L2 ne route pas." },
    { type: "vf", q: "enable secret est préférable à enable password car il hache le mot de passe.", a: true, exp: "Vrai : enable secret utilise un hachage, bien plus sûr." },
    { type: "input", q: "Quelle commande nomme le switch « CORE1 » ? (écris la commande complète)", a: ["hostname core1", "hostname CORE1"], ph: "commande complète", exp: "hostname CORE1 (le nom est insensible à la casse ici pour l'exercice)." },
    { type: "input", q: "Quelle commande active une interface (relève un shutdown) ?", a: ["no shutdown", "no shut"], ph: "2 mots", exp: "no shutdown active l'interface." },
    { type: "input", q: "Quelle commande (forme longue) sauvegarde la running-config vers la startup-config ?", a: ["copy running-config startup-config", "copy run start"], ph: "commande complète", exp: "copy running-config startup-config sauvegarde en NVRAM." },
    { type: "input", q: "Comment s'appelle la config active stockée en RAM ?", a: ["running-config", "running config", "run"], ph: "un terme", exp: "La config active en RAM est la running-config." },
    { type: "input", q: "Quelle commande définit la passerelle par défaut du switch (192.168.1.1) ?", a: ["ip default-gateway 192.168.1.1", "ip default gateway 192.168.1.1"], ph: "commande complète", exp: "ip default-gateway 192.168.1.1 fixe la passerelle du switch." }
  ],
  final: {
    title: "Exercice final — Configurer un switch neuf",
    intro: `<p>Tu déballes un switch et dois le préparer : le nommer <code>ACCESS-1</code>, sécuriser le mode privilégié avec <code>Cisco123</code>, lui donner l'IP de gestion <code>10.0.0.5/24</code> (passerelle 10.0.0.1) et tout sauvegarder.</p>`,
    questions: [
      { type: "input", q: "Quelle commande le nomme ACCESS-1 ?", a: ["hostname access-1", "hostname ACCESS-1"], ph: "commande", exp: "hostname ACCESS-1." },
      { type: "input", q: "Quelle commande sécurise le mode privilégié avec Cisco123 ?", a: ["enable secret cisco123", "enable secret Cisco123"], ph: "commande", exp: "enable secret Cisco123." },
      { type: "qcm", q: "Sur quelle interface configures-tu l'IP 10.0.0.5 ?", opts: ["interface fa0/1", "interface vlan 1", "interface serial 0", "interface loopback"], a: 1, exp: "Sur la SVI de gestion : interface vlan 1." },
      { type: "vf", q: "Après « ip address 10.0.0.5 255.255.255.0 », il faut faire « no shutdown ».", a: true, exp: "Vrai : sans no shutdown, la SVI reste désactivée." },
      { type: "input", q: "Quelle commande enregistre définitivement la configuration ?", a: ["copy running-config startup-config", "copy run start", "wr", "write memory"], ph: "commande", exp: "copy running-config startup-config (ou wr) sauvegarde en NVRAM." }
    ],
    solution: `<pre class="pseudo"># Configuration complete du switch neuf :
Switch&gt; enable
Switch# configure terminal
Switch(config)# hostname ACCESS-1
ACCESS-1(config)# enable secret Cisco123
ACCESS-1(config)# service password-encryption
ACCESS-1(config)# interface vlan 1
ACCESS-1(config-if)# ip address 10.0.0.5 255.255.255.0
ACCESS-1(config-if)# no shutdown
ACCESS-1(config-if)# exit
ACCESS-1(config)# ip default-gateway 10.0.0.1
ACCESS-1(config)# end
ACCESS-1# copy running-config startup-config</pre>
<p>Félicitations : tu as configuré un switch de A à Z et bouclé ces 8 leçons de fondamentaux CCNA. Prochaine étape : les VLAN et le routage.</p>`
  }
};
</script>
