<script>
var DAY = {
  num: 2,
  title: "Rappels : les modèles OSI et TCP/IP",
  subtitle: "Découper la communication réseau en couches pour mieux la comprendre.",
  theory: `
<h3>1. Pourquoi des « couches » ?</h3>
<p>Faire dialoguer deux ordinateurs est un problème énorme : signaux électriques, adresses, découpage des données, applications... Pour le maîtriser, on le <strong>découpe en couches</strong> (en anglais <em>layers</em>), chacune responsable d'une seule tâche. Une couche parle à la couche du même niveau sur la machine d'en face, et s'appuie sur la couche juste en dessous.</p>
<p>Analogie : envoyer un colis. Toi tu emballes (application), le service postal met une étiquette d'adresse (réseau), le camion roule sur la route (physique). Chaque acteur ignore le détail des autres, mais l'ensemble fonctionne.</p>
<h3>2. Le modèle OSI et ses 7 couches</h3>
<p>Le modèle <strong>OSI</strong> (« Open Systems Interconnection ») est une référence théorique en <strong>7 couches</strong>. On les numérote de bas (1) en haut (7) :</p>
<pre class="pseudo"># Modele OSI (haut vers bas)
7. Application  -> les logiciels (HTTP, DNS, FTP)
6. Presentation -> format, chiffrement, encodage
5. Session      -> ouverture/maintien du dialogue
4. Transport    -> segments, TCP/UDP, ports, fiabilite
3. Reseau       -> paquets, adresses IP, routage
2. Liaison      -> trames, adresses MAC, commutation
1. Physique     -> bits, cables, signaux electriques</pre>
<div class="tip">Moyen mnémotechnique (de la 7 à la 1) : « <strong>A</strong>ll <strong>P</strong>eople <strong>S</strong>eem <strong>T</strong>o <strong>N</strong>eed <strong>D</strong>ata <strong>P</strong>rocessing ». La couche 3 utilise les adresses IP ; la couche 2, les adresses MAC.</div>
<h3>3. Le modèle TCP/IP</h3>
<p>Internet ne repose pas sur OSI mais sur le modèle <strong>TCP/IP</strong>, plus simple et réellement utilisé. Dans sa version à <strong>4 couches</strong>, il regroupe certaines couches OSI :</p>
<pre class="pseudo"># Correspondance TCP/IP (4 couches) <-> OSI
Application  = OSI 5+6+7 (HTTP, DNS, DHCP...)
Transport    = OSI 4      (TCP, UDP)
Internet     = OSI 3      (IP, routage)
Acces reseau = OSI 1+2    (Ethernet, Wi-Fi)</pre>
<p>Les deux protocoles vedettes de la couche transport sont <strong>TCP</strong> (fiable, avec accusés de réception, pour le web ou les mails) et <strong>UDP</strong> (rapide, sans garantie, pour la voix ou la vidéo en direct).</p>
<h3>4. Encapsulation et unités de données (PDU)</h3>
<p>Quand tes données descendent les couches, chaque niveau ajoute son en-tête : c'est l'<strong>encapsulation</strong>. À la réception, on retire les en-têtes un par un (désencapsulation). Le nom de l'unité de données change selon la couche :</p>
<pre class="pseudo"># PDU (Protocol Data Unit) par couche
Transport (4) -> Segment (TCP) / Datagramme (UDP)
Reseau    (3) -> Paquet  (Packet)
Liaison   (2) -> Trame   (Frame)
Physique  (1) -> Bits</pre>
<div class="warn">Ne confonds pas les adresses : la couche 2 (Liaison) utilise les adresses <strong>MAC</strong> (physiques, gravées sur la carte), la couche 3 (Réseau) utilise les adresses <strong>IP</strong> (logiques, configurables). Un routeur travaille en couche 3, un switch en couche 2.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># OSI = 7 couches (reference theorique)
# TCP/IP = 4 couches (le vrai modele d'Internet)
# Couche 4 Transport : TCP (fiable) vs UDP (rapide) + ports
# Couche 3 Reseau : IP + routage (routeur)
# Couche 2 Liaison : MAC + commutation (switch)
# PDU : segment -> paquet -> trame -> bits (encapsulation)</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de couches compte le modèle OSI ?", opts: ["4", "5", "7", "8"], a: 2, exp: "Le modèle OSI comporte 7 couches." },
    { type: "qcm", q: "Combien de couches compte la version classique du modèle TCP/IP ?", opts: ["3", "4", "5", "7"], a: 1, exp: "Le modèle TCP/IP classique compte 4 couches." },
    { type: "qcm", q: "Quelle couche OSI utilise les adresses IP et assure le routage ?", opts: ["Couche 2 (Liaison)", "Couche 3 (Réseau)", "Couche 4 (Transport)", "Couche 7 (Application)"], a: 1, exp: "La couche 3 (Réseau) manipule les adresses IP et le routage." },
    { type: "qcm", q: "Quel protocole de transport est fiable, avec accusés de réception ?", opts: ["UDP", "TCP", "IP", "ARP"], a: 1, exp: "TCP est fiable (accusés de réception, retransmission). UDP est rapide mais sans garantie." },
    { type: "qcm", q: "Comment s'appelle l'unité de données (PDU) de la couche 3 (Réseau) ?", opts: ["La trame", "Le paquet", "Le segment", "Le bit"], a: 1, exp: "En couche 3, la PDU est le paquet (packet)." },
    { type: "qcm", q: "Un switch (commutateur) travaille principalement à quelle couche ?", opts: ["Couche 1", "Couche 2", "Couche 3", "Couche 4"], a: 1, exp: "Un switch classique opère en couche 2 (Liaison), avec les adresses MAC." },
    { type: "vf", q: "Le modèle OSI est un modèle de référence théorique.", a: true, exp: "Oui : OSI sert de référence pédagogique ; Internet fonctionne réellement avec TCP/IP." },
    { type: "vf", q: "UDP garantit la réception de chaque paquet grâce à des accusés de réception.", a: false, exp: "Non : c'est TCP qui garantit. UDP est rapide mais sans garantie de livraison." },
    { type: "vf", q: "La couche Transport se situe au-dessus de la couche Réseau dans le modèle OSI.", a: true, exp: "Vrai : Transport = couche 4, Réseau = couche 3. La 4 est au-dessus de la 3." },
    { type: "vf", q: "Les adresses MAC sont manipulées par la couche Réseau (couche 3).", a: false, exp: "Non : les adresses MAC relèvent de la couche 2 (Liaison). La couche 3 utilise les IP." },
    { type: "input", q: "Comment s'appelle le processus d'ajout d'en-têtes couche après couche à l'émission ?", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation ajoute un en-tête à chaque couche traversée vers le bas." },
    { type: "input", q: "Quel protocole de transport, rapide et sans garantie, convient à la voix/vidéo en direct ?", a: ["udp"], ph: "3 lettres", exp: "UDP est privilégié pour le temps réel car il est rapide (pas de retransmission)." },
    { type: "input", q: "Comment s'appelle la PDU de la couche 2 (Liaison) ?", a: ["trame", "la trame", "frame"], ph: "un mot", exp: "En couche 2, la PDU est la trame (frame)." },
    { type: "input", q: "Que signifie le sigle OSI (le O) ? Donne le mot anglais commençant par O du sigle.", a: ["open", "open systems interconnection"], ph: "un mot anglais", exp: "OSI = Open Systems Interconnection." },
    { type: "input", q: "À quelle couche OSI (numéro) travaille un routeur ?", a: ["3", "couche 3", "3 reseau", "la 3"], ph: "un numéro", exp: "Un routeur travaille en couche 3 (Réseau)." }
  ],
  final: {
    title: "Exercice final — Suivre un message à travers les couches",
    intro: `<p>Sofia ouvre son navigateur et charge une page web (HTTP). Suivons son message qui descend les couches du modèle avant de partir sur le câble.</p>`,
    questions: [
      { type: "qcm", q: "HTTP appartient à quelle couche OSI ?", opts: ["Physique (1)", "Réseau (3)", "Transport (4)", "Application (7)"], a: 3, exp: "HTTP est un protocole d'application (couche 7)." },
      { type: "qcm", q: "Le web utilise TCP. Que garantit TCP par rapport à UDP ?", opts: ["La rapidité maximale", "La fiabilité (accusés, retransmission)", "Le chiffrement", "Le routage"], a: 1, exp: "TCP assure une livraison fiable et ordonnée." },
      { type: "input", q: "En couche 4, quelle est la PDU produite par TCP ?", a: ["segment", "le segment"], ph: "un mot", exp: "TCP produit des segments." },
      { type: "vf", q: "En descendant, chaque couche ajoute son en-tête : c'est l'encapsulation.", a: true, exp: "Vrai : l'encapsulation empile les en-têtes vers le bas." },
      { type: "qcm", q: "Sur quel modèle Internet fonctionne-t-il réellement ?", opts: ["OSI (7 couches)", "TCP/IP (4 couches)", "Le modèle hybride à 5 couches", "Un modèle propriétaire Cisco"], a: 1, exp: "Internet repose réellement sur le modèle TCP/IP." }
    ],
    solution: `<pre class="pseudo"># Le voyage du message de Sofia (haut -> bas) :
7 Application  : HTTP prepare la requete
4 Transport    : TCP -> Segment (fiabilite, port 80/443)
3 Reseau       : IP  -> Paquet  (adresses IP, routage)
2 Liaison      : Ethernet -> Trame (adresses MAC)
1 Physique     : Bits sur le cable
# A l'arrivee : desencapsulation, couche par couche, jusqu'a HTTP.</pre>
<p>Tu vois maintenant comment un simple clic déclenche tout un empilement de couches. Demain : les composants réseau et les grandes architectures.</p>`
  }
};
</script>
