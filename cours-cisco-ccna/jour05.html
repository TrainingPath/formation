var DAY = {

  title: "Le subnetting avancé (VLSM)",
  subtitle: "Tailler des sous-réseaux sur mesure pour ne gaspiller aucune adresse.",
  theory: `
<h3>1. Le problème du découpage à taille fixe</h3>
<p>Hier, nous avons découpé un réseau en sous-réseaux <strong>tous identiques</strong> (par exemple quatre /26 de 62 hôtes). C'est simple, mais souvent gaspilleur : un lien entre deux routeurs n'a besoin que de 2 adresses, or lui donner un /26 en réserve 62 ! On perd 60 adresses pour rien.</p>
<p>La solution s'appelle le <strong>VLSM</strong> (« Variable Length Subnet Mask », masque de sous-réseau de longueur variable). L'idée : appliquer un <strong>masque différent à chaque sous-réseau</strong>, selon le nombre réel d'hôtes dont il a besoin.</p>
<h3>2. Le principe : du plus grand au plus petit</h3>
<p>La méthode VLSM suit une règle d'or : on <strong>classe les besoins du plus grand au plus petit</strong>, puis on attribue les blocs dans cet ordre. Ainsi les gros sous-réseaux prennent le début de la plage, et les petits se glissent ensuite sans laisser de trou.</p>
<pre class="pseudo"># Choisir le masque selon le besoin (hotes utilisables = 2^h - 2)
Besoin <= 2   hotes -> /30 (2 hotes)
Besoin <= 6   hotes -> /29 (6 hotes)
Besoin <= 14  hotes -> /28 (14 hotes)
Besoin <= 30  hotes -> /27 (30 hotes)
Besoin <= 62  hotes -> /26 (62 hotes)
Besoin <= 126 hotes -> /25 (126 hotes)</pre>
<div class="tip">Pour chaque sous-réseau, prends le <strong>plus petit bloc qui suffit</strong>. Un service de 20 postes tient dans un /27 (30 hôtes), pas besoin d'un /26.</div>
<h3>3. Un exemple complet</h3>
<p>Partons du réseau <strong>192.168.1.0/24</strong>. Trois services et deux liaisons entre routeurs ont ces besoins : Ventes 50 hôtes, RH 25 hôtes, Info 10 hôtes, plus deux liens WAN de 2 hôtes chacun. On classe du plus grand au plus petit :</p>
<pre class="pseudo"># VLSM sur 192.168.1.0/24 (du plus grand au plus petit)
Ventes (50) -> /26 : 192.168.1.0/26    (.1  -> .62,  bcast .63)
RH     (25) -> /27 : 192.168.1.64/27   (.65 -> .94,  bcast .95)
Info   (10) -> /28 : 192.168.1.96/28   (.97 -> .110, bcast .111)
WAN1   (2)  -> /30 : 192.168.1.112/30  (.113 -> .114, bcast .115)
WAN2   (2)  -> /30 : 192.168.1.116/30  (.117 -> .118, bcast .119)</pre>
<p>Chaque sous-réseau reçoit exactement ce qu'il faut, et il reste même de la place (à partir de .120) pour de futurs besoins. C'est toute la puissance du VLSM.</p>
<div class="warn">Piège classique : les blocs ne doivent JAMAIS se chevaucher. Après avoir placé un /26 (0 à 63), le sous-réseau suivant commence à .64, pas avant. Vérifie toujours que le début du bloc suivant est aligné sur sa taille.</div>
<h3>4. Le lien /30 pour les liaisons point à point</h3>
<p>Le masque <strong>/30</strong> est le compagnon des liaisons entre deux routeurs (point à point) : il fournit exactement 2 adresses utilisables, une par extrémité. C'est le choix le plus économe. (Cisco évoque aussi le /31 pour les liens, mais le /30 reste la référence de l'examen.)</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLSM = masques de longueur variable (un masque par besoin)
# Methode : classer les besoins du PLUS GRAND au plus petit
# Choisir le plus petit bloc suffisant (2^h - 2 >= besoin)
# Blocs alignes, sans chevauchement
# /30 = liaison point a point entre 2 routeurs (2 hotes)</pre>`,

    { type: "qcm", q: "Que signifie le sigle VLSM ?", opts: ["Very Large Subnet Mask", "Variable Length Subnet Mask", "Virtual LAN Subnet Mode", "Verified Local Subnet Map"], a: 1, exp: "VLSM = Variable Length Subnet Mask (masque de longueur variable)." },
    { type: "qcm", q: "Quel est l'intérêt principal du VLSM ?", opts: ["Accélérer le réseau", "Éviter le gaspillage d'adresses IP", "Chiffrer le trafic", "Supprimer les broadcasts"], a: 1, exp: "Le VLSM adapte la taille de chaque sous-réseau au besoin réel, évitant le gaspillage." },

    { type: "qcm", q: "Quel masque convient à une liaison point à point (2 hôtes) ?", opts: ["/24", "/28", "/30", "/26"], a: 2, exp: "/30 offre exactement 2 hôtes utilisables, idéal pour un lien entre 2 routeurs." },

    { type: "vf", q: "Le VLSM permet de récupérer de la place pour de futurs besoins.", a: true, exp: "Vrai : en n'attribuant que le nécessaire, il reste des blocs libres." },
    { type: "input", q: "Quel masque CIDR offre exactement 6 hôtes utilisables ?", a: ["/29", "29"], ph: "/XX", exp: "/29 : 2^3 - 2 = 6 hôtes utilisables." },
    { type: "input", q: "Combien d'hôtes utilisables offre un /27 ?", a: ["30", "30 hotes"], ph: "un nombre", exp: "/27 : 2^5 - 2 = 30 hôtes utilisables." },
    { type: "input", q: "En VLSM, on doit classer les besoins du plus … au plus petit. Complète.", a: ["grand", "gros", "plus grand"], ph: "un mot", exp: "On classe du plus grand au plus petit besoin." },
    { type: "input", q: "Dans l'exemple, quel réseau/masque reçoit le service Ventes (50 hôtes) ?", a: ["192.168.1.0/26", "/26", "192.168.1.0 /26"], ph: "réseau/CIDR", exp: "50 hôtes tiennent dans /26 (62) : 192.168.1.0/26." },
    { type: "input", q: "Après avoir placé un bloc /26 (adresses 0 à 63), à quel numéro commence le sous-réseau suivant ?", a: ["64", ".64", "192.168.1.64"], ph: "un nombre", exp: "Le bloc suivant commence à .64, juste après le broadcast .63." }
  ],
  final: {
    title: "Exercice final — Plan d'adressage VLSM",
    intro: `<p>Le réseau <code>10.0.0.0/24</code> doit servir : Production 60 hôtes, Bureau 28 hôtes, Labo 12 hôtes, et un lien WAN de 2 hôtes. Construis le plan VLSM.</p>`,
    questions: [
      { type: "input", q: "Quel masque pour Production (60 hôtes) ?", a: ["/26", "26"], ph: "/XX", exp: "60 hôtes tiennent dans /26 (62 utilisables)." },
      { type: "input", q: "Quel masque pour Bureau (28 hôtes) ?", a: ["/27", "27"], ph: "/XX", exp: "28 hôtes tiennent dans /27 (30 utilisables)." },
      { type: "input", q: "Quel masque pour le lien WAN (2 hôtes) ?", a: ["/30", "30"], ph: "/XX", exp: "Un lien de 2 hôtes utilise /30." },
      { type: "qcm", q: "Dans quel ordre placer ces sous-réseaux ?", opts: ["WAN, Labo, Bureau, Production", "Production, Bureau, Labo, WAN", "Bureau, Production, WAN, Labo", "Peu importe"], a: 1, exp: "Toujours du plus grand (Production) au plus petit (WAN)." },
      { type: "vf", q: "Production, placé en premier, occupe 10.0.0.0/26 (adresses .0 à .63).", a: true, exp: "Vrai : le plus grand bloc commence au début de la plage." }
    ],
    solution: `<pre class="pseudo"># Plan VLSM sur 10.0.0.0/24 (du plus grand au plus petit) :
Production (60) -> /26 : 10.0.0.0/26     (.1  -> .62,  bcast .63)
Bureau     (28) -> /27 : 10.0.0.64/27    (.65 -> .94,  bcast .95)
Labo       (12) -> /28 : 10.0.0.96/28    (.97 -> .110, bcast .111)
WAN        (2)  -> /30 : 10.0.0.112/30   (.113 -> .114, bcast .115)
# Reste libre a partir de 10.0.0.116 pour l'avenir.</pre>
<p>Tu maîtrises désormais le découpage sur mesure. Demain : place à IPv6, l'adressage de nouvelle génération.</p>`
  }
