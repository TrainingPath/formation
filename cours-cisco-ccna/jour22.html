<script>
var DAY = {
  num: 22,
  title: "Les services NTP, SNMP et Syslog",
  subtitle: "Mettre les horloges à l'heure, superviser à distance et centraliser les journaux : les yeux et les oreilles de l'administrateur.",
  theory: `
<h3>1. NTP : synchroniser l'heure</h3>
<p>Le <strong>NTP</strong> (« Network Time Protocol ») aligne l'horloge de tous les équipements sur une référence commune. Une heure exacte est indispensable : sans elle, les <strong>journaux</strong> (logs) portent de mauvais horodatages, les <strong>certificats</strong> et l'<strong>authentification Kerberos</strong> échouent, et corréler un incident entre plusieurs machines devient impossible. NTP utilise le port <strong>UDP 123</strong>.</p>
<pre class="pseudo">R1(config)# ntp server 216.239.35.0            # designer une source de temps
R1(config)# clock timezone CET 1               # fuseau (Europe centrale = UTC+1)
R1# show ntp status                            # synchronise ? avec quelle source ?
R1# show ntp associations                      # sources connues et leur qualite</pre>
<div class="tip">NTP hiérarchise les sources par <strong>stratum</strong> : stratum 1 = horloge de référence (GPS, atomique), stratum 2 = serveur synchronisé sur un stratum 1, etc. Plus le stratum est bas, plus la source est proche de la référence.</div>
<h3>2. SNMP : superviser à distance</h3>
<p>Le <strong>SNMP</strong> (« Simple Network Management Protocol ») permet à une station de supervision (le <em>NMS</em>) d'interroger et de surveiller les équipements : charge CPU, état des interfaces, température… Le logiciel côté équipement est l'<strong>agent</strong>. Les données sont organisées dans une <strong>MIB</strong> (« Management Information Base »), un arbre de variables identifiées par des <strong>OID</strong>. SNMP utilise <strong>UDP 161</strong> (requêtes) et <strong>UDP 162</strong> (trap).</p>
<pre class="pseudo"># Le NMS peut LIRE (GET) et parfois ECRIRE (SET) des variables.
# L'agent peut ENVOYER spontanement une alerte : un TRAP (ou un INFORM).
#
# Versions : v1 et v2c s'authentifient par une "community" en clair (peu sur).
#            v3 ajoute authentification + chiffrement (recommande).
R1(config)# snmp-server community LECTURE ro    # communaute lecture seule (v2c)
R1(config)# snmp-server host 10.0.0.9 version 2c LECTURE  # ou envoyer les traps</pre>
<div class="warn">Les communautés v1/v2c circulent <strong>en clair</strong>. Préfère <strong>SNMPv3</strong> qui apporte authentification et chiffrement. Une communauté « public » par défaut est un risque de sécurité classique.</div>
<h3>3. Syslog : centraliser les journaux</h3>
<p>Le <strong>Syslog</strong> collecte les messages d'événements de l'équipement (interface qui tombe, config modifiée, ACL déclenchée…). On peut les afficher sur la console, en session VTY, ou les envoyer vers un <strong>serveur Syslog</strong> centralisé (<strong>UDP 514</strong>).</p>
<pre class="pseudo">R1(config)# logging host 10.0.0.20             # serveur syslog central
R1(config)# logging trap informational        # niveau minimal envoye au serveur
R1(config)# service timestamps log datetime msec   # horodater les logs (couple avec NTP)
R1# show logging                               # tampon local + reglages</pre>
<h3>4. Les huit niveaux de gravité Syslog (0 à 7)</h3>
<p>Chaque message a une <strong>sévérité</strong> de <strong>0 (le plus grave)</strong> à <strong>7 (le plus bavard)</strong>. Un moyen mnémotechnique : « Every Awesome Cisco Engineer Will Need Ice-cream Daily ».</p>
<pre class="pseudo"># 0 Emergency     (le systeme est inutilisable)
# 1 Alert         (action immediate requise)
# 2 Critical      (condition critique)
# 3 Error         (erreur)
# 4 Warning       (avertissement)
# 5 Notification  (evenement normal notable)
# 6 Informational (message d'information)
# 7 Debugging     (deboguage, tres verbeux)
#
# "logging trap 5" envoie les niveaux 0 a 5 (jusqu'a Notifications INCLUS).</pre>
<div class="tip">Régler un niveau, c'est fixer un <strong>plancher de gravité</strong> : on reçoit ce niveau <strong>et tous les plus graves</strong> (numéros inférieurs). Régler sur 7 (debugging) capture absolument tout.</div>
<h3>5. Un format de message Syslog IOS</h3>
<pre class="pseudo">*Jul 27 14:02:11.313: %LINK-3-UPDOWN: Interface Gi0/1, changed state to down
#  \_ horodatage       \_facility \_severite(3=Error) \_mnemonique \_description</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># NTP  (UDP 123)  : synchronise l'heure ; stratum bas = plus proche de la reference
#                   ntp server X ; show ntp status
# SNMP (UDP 161/162) : supervision ; agent + MIB/OID + NMS ; TRAP = alerte spontanee
#                   v2c = community en clair ; v3 = auth + chiffrement (recommande)
# Syslog (UDP 514) : journaux centralises ; logging host X ; logging trap NIVEAU
#                   Severites 0=Emergency ... 7=Debugging ; un niveau inclut les + graves</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert principalement NTP ?", opts: ["À filtrer le trafic", "À synchroniser l'horloge des équipements", "À attribuer des adresses IP", "À traduire des noms"], a: 1, exp: "NTP aligne les horloges sur une référence commune (UDP 123)." },
    { type: "qcm", q: "Pourquoi l'heure exacte est-elle importante ?", opts: ["Pour accélérer le routage", "Pour des logs correctement horodatés et l'authentification/certificats", "Pour réduire la bande passante", "Pour élire le DR"], a: 1, exp: "Sans heure juste, les logs sont trompeurs et certificats/Kerberos échouent." },
    { type: "input", q: "Quel numéro de stratum désigne une horloge de référence (GPS, atomique) ?", a: ["1", "stratum 1", "un"], ph: "un chiffre", exp: "Stratum 1 = source de référence directe ; plus le stratum est bas, plus on est proche de la référence." },
    { type: "qcm", q: "Dans SNMP, comment appelle-t-on le logiciel présent sur l'équipement supervisé ?", opts: ["Le NMS", "L'agent", "Le trap", "La MIB"], a: 1, exp: "L'agent tourne sur l'équipement ; le NMS est la station de supervision." },
    { type: "qcm", q: "Qu'est-ce qu'un TRAP SNMP ?", opts: ["Une requête du NMS vers l'agent", "Une alerte envoyée spontanément par l'agent vers le NMS", "Un journal Syslog", "Un paquet NTP"], a: 1, exp: "Un trap est une notification non sollicitée émise par l'agent (UDP 162)." },
    { type: "vf", q: "Les communautés SNMPv1/v2c circulent en clair sur le réseau.", a: true, exp: "Vrai : v1/v2c ne chiffrent pas la community. SNMPv3 ajoute auth et chiffrement." },
    { type: "qcm", q: "Quelle version de SNMP apporte authentification ET chiffrement ?", opts: ["v1", "v2c", "v3", "v2"], a: 2, exp: "SNMPv3 fournit authentification et chiffrement ; on la recommande." },
    { type: "qcm", q: "À quoi sert Syslog ?", opts: ["À synchroniser l'heure", "À collecter et centraliser les messages d'événements", "À attribuer des adresses", "À élire un DR"], a: 1, exp: "Syslog rassemble les journaux d'événements, localement ou vers un serveur central." },
    { type: "input", q: "Quel niveau de sévérité Syslog est le plus grave ?", a: ["0", "zero", "emergency", "emergencies"], ph: "un chiffre", exp: "Le niveau 0 (Emergency) est le plus grave ; 7 (Debugging) le plus verbeux." },
    { type: "qcm", q: "Que capture le niveau 7 (Debugging) ?", opts: ["Seulement les urgences", "Absolument tous les messages, y compris le débogage", "Uniquement les messages d'information (niveau 6)", "Uniquement les erreurs"], a: 1, exp: "Le niveau 7 inclut tout : c'est le plus bavard." },
    { type: "vf", q: "Configurer « logging trap 5 » envoie les niveaux 0 à 5 au serveur Syslog.", a: true, exp: "Vrai : un niveau fixe un plancher ; on reçoit ce niveau et tous les plus graves (numéros inférieurs)." },
    { type: "qcm", q: "Quelle commande désigne le serveur Syslog central 10.0.0.20 ?", opts: ["ntp server 10.0.0.20", "logging host 10.0.0.20", "snmp-server host 10.0.0.20", "ip name-server 10.0.0.20"], a: 1, exp: "logging host 10.0.0.20 envoie les journaux vers ce serveur." },
    { type: "qcm", q: "Quel port UDP les traps SNMP utilisent-ils ?", opts: ["123", "161", "162", "514"], a: 2, exp: "SNMP : 161 pour les requêtes GET/SET, 162 pour les traps." },
    { type: "input", q: "Quelle commande désigne une source de temps NTP à l'adresse 216.239.35.0 ?", a: ["ntp server 216.239.35.0", "ntpserver 216.239.35.0"], ph: "ntp server ...", exp: "ntp server 216.239.35.0 configure la source NTP." },
    { type: "qcm", q: "Dans « %LINK-3-UPDOWN », que représente le 3 ?", opts: ["Le stratum", "La sévérité (Error)", "Le numéro de VLAN", "Le port UDP"], a: 1, exp: "Le chiffre au milieu est la sévérité : 3 = Error." }
  ],
  final: {
    title: "Exercice final — Superviser R1 proprement",
    intro: `<p>Tu dois rendre R1 supervisable : le synchroniser sur le serveur de temps 10.0.0.1, envoyer ses journaux (à partir des avertissements) vers le serveur Syslog 10.0.0.20, et permettre une supervision SNMP en lecture seule depuis le NMS 10.0.0.9.</p>`,
    questions: [
      { type: "input", q: "Écris la commande qui synchronise R1 sur la source de temps 10.0.0.1.", a: ["ntp server 10.0.0.1", "ntpserver 10.0.0.1"], ph: "ntp server ...", exp: "ntp server 10.0.0.1 désigne la source NTP." },
      { type: "input", q: "Écris la commande qui envoie les journaux vers le serveur Syslog 10.0.0.20.", a: ["logging host 10.0.0.20", "logging 10.0.0.20"], ph: "logging host ...", exp: "logging host 10.0.0.20 (ou logging 10.0.0.20)." },
      { type: "qcm", q: "Pour n'envoyer qu'à partir des avertissements, quel niveau régler ?", opts: ["logging trap debugging", "logging trap warnings (niveau 4)", "logging trap emergencies", "logging trap 7"], a: 1, exp: "Niveau 4 (warnings) envoie les niveaux 0 à 4, donc à partir des avertissements." },
      { type: "vf", q: "Pour la supervision SNMP en lecture seule, on utilise une communauté « ro ».", a: true, exp: "Vrai : snmp-server community NOM ro crée un accès en lecture seule." },
      { type: "qcm", q: "Quelle version SNMP faudrait-il idéalement choisir pour la sécurité ?", opts: ["v1", "v2c", "v3", "aucune"], a: 2, exp: "SNMPv3 apporte authentification et chiffrement." }
    ],
    solution: `<pre class="pseudo">R1(config)# ntp server 10.0.0.1
R1(config)# service timestamps log datetime msec
R1(config)# logging host 10.0.0.20
R1(config)# logging trap warnings          # niveau 4 -> envoie 0..4
R1(config)# snmp-server community SUPERVISION ro
R1(config)# snmp-server host 10.0.0.9 version 2c SUPERVISION
R1# show ntp status
R1# show logging</pre>
<p>NTP donne l'heure juste, Syslog centralise les journaux horodatés, SNMP permet au NMS de surveiller. Pour la production, on privilégierait SNMPv3.</p>`
  }
};
</script>
