var DAY = {
  num: 11,
  title: "Le protocole Spanning Tree (STP)",
  subtitle: "Empêcher les boucles mortelles dans un réseau commuté redondant.",
  theory: `
<h3>1. Le danger des boucles de niveau 2</h3>
<p>Pour la fiabilité, on relie souvent les switchs par plusieurs câbles : si un lien tombe, un autre prend le relais. Mais cette redondance crée un piège. Un switch qui reçoit une trame de diffusion (<em>broadcast</em>) la renvoie sur tous ses ports ; s'il existe une boucle physique, la trame tourne indéfiniment, se multiplie et sature le réseau en quelques secondes : c'est la <strong>tempête de diffusion</strong> (<em>broadcast storm</em>). Contrairement à IP, la trame Ethernet n'a pas de TTL pour mourir toute seule.</p>
<p>Image : trois personnes se transmettent un message « répète-le à tout le monde ». Sans règle, chacun le répète à l'infini et la salle devient inaudible. Il faut un arbitre qui bloque certains passages pour couper les cercles.</p>
<h3>2. STP : construire un arbre sans boucle</h3>
<p>Le <strong>Spanning Tree Protocol</strong> (STP, norme IEEE <strong>802.1D</strong>) est cet arbitre. Il calcule un <strong>arbre couvrant</strong> (<em>spanning tree</em>) qui garde tous les switchs joignables mais <strong>bloque logiquement</strong> les liens qui créeraient une boucle. Les liens redondants ne sont pas coupés physiquement : ils sont mis en veille et se réactivent si le chemin principal tombe. Les switchs s'échangent pour cela des messages spéciaux, les <strong>BPDU</strong> (<em>Bridge Protocol Data Units</em>).</p>
<h3>3. Le root bridge et l'élection</h3>
<p>STP élit d'abord un switch central de référence : le <strong>pont racine</strong> (<em>root bridge</em>). Tous les calculs de chemin partent de lui. L'élection se fait sur le <strong>Bridge ID</strong>, composé de la <strong>priorité</strong> (par défaut 32768) suivie de l'adresse MAC. Le plus petit Bridge ID gagne : à priorité égale, c'est la plus petite MAC qui l'emporte.</p>
<pre class="pseudo">! Forcer un switch a devenir racine (priorite plus basse)
Switch(config)# spanning-tree vlan 1 root primary
! ou manuellement (multiple de 4096) :
Switch(config)# spanning-tree vlan 1 priority 4096
! Verifier qui est racine :
Switch# show spanning-tree</pre>
<p>Chaque switch non-racine choisit ensuite un <strong>port racine</strong> (<em>root port</em>), celui qui offre le meilleur chemin vers la racine (coût le plus faible). Sur chaque segment, un <strong>port désigné</strong> (<em>designated port</em>) transmet ; les ports restants passent en état <strong>bloquant</strong> (<em>blocking</em>) pour casser la boucle.</p>
<div class="tip">Le coût STP dépend du débit du lien : plus le lien est rapide, plus son coût est faible. STP additionne les coûts le long du chemin pour choisir la route vers la racine.</div>
<h3>4. Les états et l'accélération : PortFast et RSTP</h3>
<p>En 802.1D classique, un port passe par les états <strong>blocking → listening → learning → forwarding</strong>, ce qui prend jusqu'à <strong>30 à 50 secondes</strong>. Trop lent pour un simple PC. Sur un port relié à un poste (pas à un autre switch), on active <strong>PortFast</strong> : le port passe immédiatement en forwarding, sans attendre.</p>
<pre class="pseudo">Switch(config-if)# spanning-tree portfast
! Protege les ports PortFast contre un switch branche par erreur :
Switch(config-if)# spanning-tree bpduguard enable</pre>
<div class="warn">N'active JAMAIS PortFast sur un lien entre deux switchs : tu recrées le risque de boucle que STP est censé éviter. PortFast est réservé aux ports d'accès vers des postes. Le <strong>RSTP</strong> (802.1w) est la version rapide et moderne de STP, qui converge en quelques secondes.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Boucle L2 -> tempete de broadcast (pas de TTL en Ethernet)
# STP (802.1D) bloque logiquement les liens redondants
# Root bridge = plus petit Bridge ID (priorite 32768 par defaut, puis MAC)
# root port (vers la racine) / designated port / blocking
# PortFast : forwarding immediat, UNIQUEMENT vers un poste
# RSTP (802.1w) = version rapide de STP</pre>`,
  exercises: [
    { type: "qcm", q: "Que provoque une boucle de niveau 2 sans STP ?", opts: ["Une accélération du réseau", "Une tempête de diffusion qui sature le réseau", "Un chiffrement automatique", "Rien du tout"], a: 1, exp: "Sans TTL en Ethernet, les broadcasts tournent en boucle et saturent le réseau." },
    { type: "qcm", q: "Quel est le rôle principal de STP ?", opts: ["Router entre VLAN", "Bloquer logiquement les liens redondants pour éviter les boucles", "Attribuer des adresses IP", "Chiffrer les trames"], a: 1, exp: "STP construit un arbre sans boucle en mettant certains liens en veille." },
    { type: "input", q: "Quelle norme IEEE définit le Spanning Tree classique ? (numéro)", a: ["802.1d", "8021d", "ieee 802.1d"], ph: "802.1…", exp: "IEEE 802.1D est le Spanning Tree Protocol d'origine." },
    { type: "qcm", q: "Comment s'appelle le switch de référence élu par STP ?", opts: ["designated bridge", "root bridge (pont racine)", "master switch", "gateway"], a: 1, exp: "Le root bridge est le point central d'où partent tous les calculs de chemin." },
    { type: "vf", q: "À priorité égale, le switch avec la plus petite adresse MAC devient racine.", a: true, exp: "Vrai : le Bridge ID = priorité + MAC ; à priorité égale, la plus petite MAC gagne." },
    { type: "input", q: "Quelle est la priorité STP par défaut d'un switch ?", a: ["32768"], ph: "un nombre", exp: "La priorité par défaut est 32768 ; on l'abaisse par pas de 4096 pour forcer un root." },
    { type: "qcm", q: "Comment s'appellent les messages échangés par STP ?", opts: ["BPDU", "TCP", "ARP", "CDP"], a: 0, exp: "Les BPDU (Bridge Protocol Data Units) portent les infos STP entre switchs." },
    { type: "qcm", q: "Le port d'un switch qui offre le meilleur chemin vers la racine est le…", opts: ["designated port", "root port", "blocking port", "trunk port"], a: 1, exp: "Le root port est le port de moindre coût vers le root bridge." },
    { type: "vf", q: "STP coupe physiquement les câbles redondants.", a: false, exp: "Faux : il les bloque seulement logiquement ; ils se réactivent si le lien principal tombe." },
    { type: "input", q: "Quelle fonctionnalité fait passer un port d'accès directement en forwarding ?", a: ["portfast", "spanning-tree portfast", "port fast"], ph: "un mot", exp: "PortFast évite les 30-50 s d'attente sur un port relié à un poste." },
    { type: "qcm", q: "Sur quel type de port active-t-on PortFast ?", opts: ["Un trunk entre switchs", "Un port d'accès relié à un poste", "Le port racine", "Tous les ports"], a: 1, exp: "PortFast est réservé aux ports vers des postes ; jamais entre switchs." },
    { type: "vf", q: "Activer PortFast sur un lien entre deux switchs peut recréer une boucle.", a: true, exp: "Vrai : c'est pourquoi PortFast est interdit sur les liens inter-switchs." },
    { type: "qcm", q: "Quelle commande force un switch à devenir racine pour le VLAN 1 ?", opts: ["spanning-tree vlan 1 root primary", "ip routing", "switchport mode trunk", "no spanning-tree"], a: 0, exp: "spanning-tree vlan 1 root primary abaisse la priorité pour gagner l'élection." },
    { type: "input", q: "Quelle norme définit la version RAPIDE de Spanning Tree ? (numéro)", a: ["802.1w", "8021w", "ieee 802.1w"], ph: "802.1…", exp: "IEEE 802.1w (RSTP) converge en quelques secondes au lieu de 30-50 s." },
    { type: "qcm", q: "Quelle fonction protège un port PortFast contre un switch branché par erreur ?", opts: ["root guard", "BPDU guard", "portfast trunk", "storm control"], a: 1, exp: "BPDU guard désactive le port s'il reçoit une BPDU, signe qu'un switch y est branché." }
  ],
  final: {
    title: "Exercice final — Stabiliser un réseau redondant",
    intro: `<p>Trois switchs (SW1, SW2, SW3) sont reliés en triangle pour la redondance. Tu veux que SW1 soit toujours la racine et que les ports vers les PC démarrent instantanément.</p>`,
    questions: [
      { type: "qcm", q: "Que se passerait-il sans STP dans ce triangle ?", opts: ["Rien", "Une tempête de diffusion", "Un routage automatique", "Un chiffrement"], a: 1, exp: "Le triangle forme une boucle : sans STP, les broadcasts tournent à l'infini." },
      { type: "input", q: "Quelle commande sur SW1 le désigne comme racine du VLAN 1 ?", a: ["spanning-tree vlan 1 root primary"], ph: "spanning-tree …", exp: "spanning-tree vlan 1 root primary (ou priority 4096)." },
      { type: "qcm", q: "Sur quels ports activer PortFast ?", opts: ["Les liens SW1-SW2-SW3", "Les ports reliés aux PC", "Le port racine", "Aucun"], a: 1, exp: "PortFast uniquement sur les ports d'accès vers les postes." },
      { type: "vf", q: "STP va laisser un des trois liens du triangle en état bloquant.", a: true, exp: "Vrai : pour casser la boucle, un lien passe en blocking (prêt à reprendre si besoin)." },
      { type: "qcm", q: "Quelle commande protège les ports PortFast d'un switch branché par erreur ?", opts: ["spanning-tree bpduguard enable", "no shutdown", "ip routing", "switchport mode access"], a: 0, exp: "BPDU guard désactive le port s'il reçoit une BPDU." }
    ],
    solution: `<pre class="pseudo">! --- SW1 : devenir racine ---
spanning-tree vlan 1 root primary
! --- Sur chaque port vers un PC ---
interface range fa0/1 - 24
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
! Verification :
show spanning-tree</pre>
<p>SW1 est racine, les PC démarrent sans délai, un lien du triangle reste en blocking et prendra le relais si le chemin principal tombe. RSTP (802.1w) rendrait la reconvergence quasi instantanée.</p>`
  }
};
