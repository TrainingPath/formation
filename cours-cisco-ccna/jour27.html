<script>
var DAY = {
  num: 27,
  title: "L'automatisation et les réseaux programmables",
  subtitle: "Du CLI équipement par équipement au réseau piloté par un contrôleur central.",
  theory: `
<h3>1. Le problème : configurer à la main ne passe pas à l'échelle</h3>
<p>Configurer un routeur en tapant des commandes dans la CLI est parfait pour un lab. Mais dans une entreprise de 500 commutateurs, répéter la même config 500 fois à la main est lent, fatigant et surtout <strong>source d'erreurs</strong> : une faute de frappe, un oubli, et un équipement se comporte différemment des autres. On appelle cette dérive la <strong>divergence de configuration</strong> (en anglais <em>configuration drift</em>).</p>
<p>L'<strong>automatisation réseau</strong> (en anglais <em>network automation</em>) répond à ce problème : au lieu de configurer chaque appareil individuellement, on décrit l'état voulu une fois et un logiciel l'applique partout, de façon identique et reproductible.</p>
<div class="tip">Analogie : configurer 500 switches à la main, c'est écrire 500 lettres à la plume. L'automatisation, c'est une imprimante qui tire 500 copies identiques en une commande.</div>
<h3>2. Les trois plans d'un équipement réseau</h3>
<p>Pour comprendre le réseau programmable, il faut découper le fonctionnement d'un routeur/switch en trois <strong>plans</strong> (en anglais <em>planes</em>) :</p>
<p>Le <strong>plan de données</strong> (en anglais <em>data plane</em>, aussi <em>forwarding plane</em>) : c'est le muscle. Il transfère effectivement les paquets d'un port à l'autre, à très haute vitesse, selon les tables déjà construites. Il ne « réfléchit » pas, il exécute.</p>
<p>Le <strong>plan de contrôle</strong> (en anglais <em>control plane</em>) : c'est le cerveau. Il décide comment transférer : il fait tourner les protocoles de routage (OSPF, EIGRP), construit la table de routage et la table MAC, calcule les meilleurs chemins. Il indique au plan de données quoi faire.</p>
<p>Le <strong>plan de gestion</strong> (en anglais <em>management plane</em>) : c'est l'interface d'administration (SSH, SNMP, interfaces web) par laquelle l'humain configure et supervise l'appareil.</p>
<pre class="pseudo"># Les trois plans d'un routeur
Plan de gestion   : SSH / SNMP / API  -> comment on ADMINISTRE
Plan de controle  : OSPF, EIGRP, STP  -> DECIDE les chemins (le cerveau)
Plan de donnees   : commutation ASIC  -> TRANSFERE les paquets (le muscle)</pre>
<h3>3. Réseau traditionnel : intelligence distribuée</h3>
<p>Dans un réseau <strong>traditionnel</strong>, chaque équipement possède son propre plan de contrôle ET son propre plan de données. Chaque routeur calcule tout seul ses chemins et discute avec ses voisins (OSPF, BGP...). L'intelligence est <strong>distribuée</strong> : c'est robuste (pas de point unique de défaillance) mais difficile à orchestrer globalement, car il n'existe aucune vue d'ensemble et chaque appareil se configure séparément.</p>
<div class="warn">Le défaut du modèle traditionnel : pour changer une politique sur tout le réseau, il faut se connecter à chaque appareil un par un. Aucune vision centralisée de l'ensemble.</div>
<h3>4. Le modèle à contrôleur : centraliser le cerveau (SDN)</h3>
<p>Le <strong>réseau défini par logiciel</strong> (en anglais <em>SDN</em>, Software-Defined Networking) change l'approche : il <strong>sépare le plan de contrôle du plan de données</strong>. On sort le « cerveau » de chaque appareil pour le regrouper dans un <strong>contrôleur</strong> central (en anglais <em>controller</em>), logiciel qui a une vue globale du réseau.</p>
<p>Les équipements deviennent des « exécutants » qui ne gardent que le plan de données ; le contrôleur, lui, centralise le plan de contrôle et leur pousse les décisions. Résultat : on programme le réseau <strong>depuis un point unique</strong>, avec une cohérence garantie.</p>
<pre class="pseudo"># Traditionnel : chaque appareil = cerveau + muscle
[R1: controle+donnees]  [R2: controle+donnees]  [R3: controle+donnees]

# SDN : un cerveau central, des muscles distribues
          [ CONTROLEUR = plan de controle central ]
             |             |             |
     [SW1: donnees] [SW2: donnees] [SW3: donnees]</pre>
<h3>5. Ce que l'automatisation apporte</h3>
<p>Un réseau programmable, piloté par contrôleur, permet : le <strong>déploiement rapide</strong> et cohérent (une politique poussée partout en une action), la réduction des erreurs humaines, une vue centralisée pour la supervision, et l'intégration avec des outils via des <strong>API</strong>. On passe d'une gestion « boîte par boîte » à une gestion « intention globale » : on décrit ce qu'on veut, le contrôleur traduit en configuration.</p>
<div class="tip">SDN ne supprime pas les protocoles de routage : il déplace la décision. Le plan de données reste sur les équipements ; c'est le plan de contrôle qui est centralisé.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Trois plans :
#   Donnees   = transfere les paquets (muscle)
#   Controle  = decide les chemins, routage (cerveau)
#   Gestion   = administration (SSH/SNMP/API)
# Traditionnel : chaque appareil a son controle + ses donnees (intelligence distribuee)
# SDN : SEPARE controle et donnees ; controleur central = plan de controle
#   Equipements = plan de donnees seulement, pilotes par le controleur
# Automatisation : configurer 1 fois, appliquer partout => moins d'erreurs, plus rapide</pre>`,
  exercises: [
    { type: "qcm", q: "Quel plan d'un équipement transfère effectivement les paquets d'un port à l'autre ?", opts: ["Plan de contrôle", "Plan de données", "Plan de gestion", "Plan de routage"], a: 1, exp: "Le plan de données (data/forwarding plane) achemine les paquets à haute vitesse : le « muscle »." },
    { type: "qcm", q: "Quel plan fait tourner OSPF et EIGRP et calcule les meilleurs chemins ?", opts: ["Plan de données", "Plan de contrôle", "Plan de gestion", "Plan physique"], a: 1, exp: "Le plan de contrôle (control plane) prend les décisions de routage : le « cerveau »." },
    { type: "vf", q: "Le principe fondateur du SDN est de séparer le plan de contrôle du plan de données.", a: true, exp: "Exact : le SDN sort le plan de contrôle des équipements pour le centraliser dans un contrôleur." },
    { type: "input", q: "Comment appelle-t-on l'élément logiciel central qui, en SDN, regroupe le plan de contrôle et a une vue globale ?", a: ["controleur", "le controleur", "controller"], ph: "un mot", exp: "Le contrôleur (controller) centralise le plan de contrôle et pilote les équipements." },
    { type: "qcm", q: "Dans un réseau traditionnel, l'intelligence de routage est…", opts: ["Centralisée dans un contrôleur", "Distribuée : chaque appareil décide seul", "Répartie entre quelques routeurs maîtres élus", "Gérée par le plan de données uniquement"], a: 1, exp: "En traditionnel, chaque équipement possède son propre plan de contrôle : intelligence distribuée." },
    { type: "qcm", q: "Que signifie le sigle SDN ?", opts: ["Secure Data Network", "Software-Defined Networking", "System Design Node", "Static Digital Network"], a: 1, exp: "SDN = Software-Defined Networking, le réseau défini par logiciel." },
    { type: "vf", q: "L'automatisation réseau augmente le risque d'erreurs humaines par rapport à la config manuelle.", a: false, exp: "Au contraire : elle réduit les erreurs en appliquant une configuration cohérente et reproductible partout." },
    { type: "input", q: "Comment nomme-t-on la dérive où des équipements finissent avec des configurations incohérentes (terme français) ?", a: ["divergence de configuration", "la divergence de configuration", "configuration drift"], ph: "trois mots", exp: "La divergence de configuration (configuration drift) apparaît quand les configs manuelles s'écartent les unes des autres." },
    { type: "qcm", q: "Quel plan correspond à l'administration via SSH, SNMP ou une interface web ?", opts: ["Plan de données", "Plan de contrôle", "Plan de gestion", "Plan de transfert"], a: 2, exp: "Le plan de gestion (management plane) est l'interface d'administration et de supervision." },
    { type: "qcm", q: "Dans le modèle SDN, que gardent principalement les équipements réseau ?", opts: ["Le plan de contrôle", "Le plan de données", "Le contrôleur", "Le plan de gestion"], a: 1, exp: "Les équipements conservent le plan de données ; le contrôleur centralise le contrôle." },
    { type: "vf", q: "Le SDN supprime totalement les protocoles de routage du réseau.", a: false, exp: "Non : le SDN déplace la décision vers le contrôleur, il ne supprime pas le routage. Le plan de données reste sur les équipements." },
    { type: "input", q: "Quel plan est surnommé « le muscle » car il exécute le transfert sans réfléchir ?", a: ["plan de donnees", "le plan de donnees", "data plane", "donnees"], ph: "deux mots", exp: "Le plan de données exécute le transfert des paquets à grande vitesse : le muscle." },
    { type: "qcm", q: "Un avantage clé d'un réseau piloté par contrôleur est…", opts: ["Configurer chaque appareil séparément", "Pousser une politique cohérente depuis un point unique", "Supprimer le plan de données", "Laisser chaque appareil calculer ses routes indépendamment"], a: 1, exp: "Le contrôleur permet un déploiement cohérent et rapide depuis un point central." },
    { type: "qcm", q: "Pourquoi le modèle traditionnel est-il difficile à orchestrer globalement ?", opts: ["Il n'a pas de plan de données", "Il n'offre aucune vue d'ensemble et chaque appareil se configure séparément", "Il est trop centralisé", "Il ne supporte qu'un seul protocole de routage à la fois"], a: 1, exp: "Sans vue centralisée, changer une politique globale impose de se connecter à chaque appareil." },
    { type: "vf", q: "Le plan de contrôle indique au plan de données comment transférer les paquets.", a: true, exp: "Oui : le plan de contrôle construit les tables (routage, MAC) que le plan de données applique." }
  ],
  final: {
    title: "Exercice final — Du réseau traditionnel au réseau programmable",
    intro: `<p>Une entreprise gère 300 commutateurs à la main et subit des incohérences de configuration. Elle envisage un modèle SDN à contrôleur. Analysons les concepts en jeu.</p>`,
    questions: [
      { type: "qcm", q: "La cause des incohérences (chaque switch légèrement différent) s'appelle…", opts: ["Le SDN", "La divergence de configuration (drift)", "Le plan de données", "L'API"], a: 1, exp: "La divergence de configuration (drift) naît des configurations manuelles répétées." },
      { type: "input", q: "Dans le modèle traditionnel, quel plan chaque équipement possède-t-il pour décider seul ses chemins ?", a: ["plan de controle", "le plan de controle", "control plane", "controle"], ph: "deux mots", exp: "Chaque équipement a son propre plan de contrôle : intelligence distribuée." },
      { type: "qcm", q: "Le passage au SDN consiste principalement à…", opts: ["Ajouter du plan de données à chaque switch", "Centraliser le plan de contrôle dans un contrôleur", "Supprimer le plan de gestion", "Supprimer le plan de données des équipements"], a: 1, exp: "Le SDN sépare et centralise le plan de contrôle dans un contrôleur." },
      { type: "qcm", q: "Après migration, que conservent les 300 commutateurs ?", opts: ["Le plan de contrôle", "Le plan de données, piloté par le contrôleur", "Le contrôleur lui-même", "Le plan de gestion complet"], a: 1, exp: "Les switches gardent le plan de données ; le contrôleur pousse les décisions." },
      { type: "vf", q: "Grâce au contrôleur, une nouvelle politique peut être appliquée de façon cohérente à tout le réseau depuis un point unique.", a: true, exp: "Oui : c'est le bénéfice central de l'approche à contrôleur : cohérence et rapidité." }
    ],
    solution: `<pre class="pseudo"># Avant (traditionnel) : intelligence distribuee
[SW1: controle+donnees] ... [SW300: controle+donnees]
=> 300 configs a la main => divergence de configuration (drift)

# Apres (SDN) : plan de controle centralise
        [ CONTROLEUR : vue globale + plan de controle ]
           |          |               |
    [SW1: donnees] [SW2: donnees] ... [SW300: donnees]
=> une politique poussee partout, coherente, en une action</pre>
<p>En centralisant le plan de contrôle, l'entreprise supprime la divergence et gagne en rapidité et en cohérence.</p>`
  }
};
</script>
