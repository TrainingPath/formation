var DAY = {
  num: 29,
  title: "Ansible, Puppet, Chef : aperçu",
  subtitle: "Trois outils pour décrire l'état voulu d'un parc et l'appliquer automatiquement.",
  theory: `
<h3>1. La gestion de configuration</h3>
<p>La <strong>gestion de configuration</strong> (en anglais <em>configuration management</em>) consiste à décrire, dans des fichiers, l'<strong>état désiré</strong> d'un ensemble de machines ou d'équipements, puis à laisser un outil l'appliquer et le maintenir automatiquement. On ne dit plus « exécute ces 20 commandes » ; on dit « voici l'état que je veux » et l'outil se charge d'y arriver.</p>
<p>Trois outils reviennent au programme CCNA : <strong>Ansible</strong>, <strong>Puppet</strong> et <strong>Chef</strong>. Tous permettent de configurer des centaines de machines de façon cohérente, mais ils diffèrent sur deux axes essentiels : le modèle <em>agent vs sans agent</em>, et le langage utilisé.</p>
<div class="tip">Analogie : plutôt que de repeindre chaque mur toi-même (CLI manuelle), tu remets un cahier des charges (« tous les murs en bleu ») à une équipe qui vérifie et corrige en continu. C'est la gestion de configuration.</div>
<h3>2. Approche déclarative et état désiré</h3>
<p>Ces outils sont surtout <strong>déclaratifs</strong> : on décrit le <em>résultat</em> voulu (« le paquet X doit être installé », « ce VLAN doit exister »), pas la suite d'étapes. L'outil compare l'état actuel à l'état désiré et n'agit que sur ce qui diffère. C'est l'inverse de l'approche <strong>impérative</strong>, où l'on liste chaque commande à exécuter.</p>
<h3>3. L'idempotence : le concept clé</h3>
<p>La propriété centrale de ces outils est l'<strong>idempotence</strong> (en anglais <em>idempotency</em>) : appliquer la même configuration une fois ou dix fois donne <strong>toujours le même résultat</strong>. Si l'état désiré est déjà atteint, l'outil ne refait rien. On peut donc relancer une configuration en toute sécurité, sans crainte de dupliquer ou de casser quelque chose.</p>
<pre class="pseudo"># Idempotence : le resultat final est identique quel que soit
# le nombre d'executions.
Etat voulu : "VLAN 10 existe"
1re execution : le VLAN 10 n'existe pas -> l'outil le cree.
2e execution : le VLAN 10 existe deja  -> l'outil ne fait RIEN.
=> Meme etat final, aucune action inutile.</pre>
<div class="warn">Sans idempotence, relancer un script d'ajout créerait le VLAN 10 en double ou provoquerait une erreur. L'idempotence rend les exécutions répétées sûres.</div>
<h3>4. Agent contre sans-agent (agentless)</h3>
<p>Premier grand axe de comparaison : faut-il installer un logiciel sur chaque machine gérée ?</p>
<p>Le modèle <strong>avec agent</strong> (en anglais <em>agent-based</em>) impose d'installer un petit programme (l'agent) sur chaque nœud géré. L'agent contacte régulièrement un serveur central pour récupérer et appliquer la configuration. C'est le modèle historique de <strong>Puppet</strong> et de <strong>Chef</strong>.</p>
<p>Le modèle <strong>sans agent</strong> (en anglais <em>agentless</em>) n'installe rien sur les machines cibles : l'outil se connecte à distance, généralement par <strong>SSH</strong>, pour pousser la configuration. C'est le modèle d'<strong>Ansible</strong>, ce qui le rend simple à déployer, surtout sur des équipements réseau où l'on ne peut pas installer d'agent.</p>
<pre class="pseudo"># Deux modeles
AVEC AGENT (Puppet, Chef) :
  [Serveur] &lt;--- l'agent installe sur chaque noeud tire la config
  Necessite d'installer un agent partout.

SANS AGENT (Ansible) :
  [Ansible] --- SSH ---&gt; [noeud]   (rien a installer sur la cible)
  Se connecte a distance et pousse la config.</pre>
<h3>5. Les langages : YAML, Ruby et le vocabulaire propre</h3>
<p>Second axe : le langage de description. <strong>Ansible</strong> décrit ses tâches dans des <strong>playbooks</strong> écrits en <strong>YAML</strong> (lisible, basé sur l'indentation) ; il utilise un <strong>inventory</strong> (inventaire) listant les hôtes. <strong>Puppet</strong> emploie son propre langage déclaratif (les <em>manifests</em>), historiquement lié à <strong>Ruby</strong>. <strong>Chef</strong> décrit des <em>recipes</em> (recettes) regroupées en <em>cookbooks</em>, écrites en <strong>Ruby</strong>.</p>
<pre class="pseudo"># Vocabulaire par outil
Ansible : playbook (YAML) + inventory   | SANS agent (SSH)  | push
Puppet  : manifest (langage Puppet/Ruby)| AVEC agent        | pull
Chef    : recipe / cookbook (Ruby)      | AVEC agent        | pull</pre>
<div class="tip">Pour le CCNA, retiens surtout Ansible : sans agent (agentless), utilise SSH, playbooks en YAML, idempotent. C'est l'outil le plus cité pour l'automatisation réseau.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Gestion de configuration = decrire l'etat desire, l'outil l'applique
# Declaratif : on dit le RESULTAT voulu, pas les etapes
# Idempotence : appliquer 1 ou N fois => meme resultat, pas d'action inutile
# Ansible : SANS agent (agentless), SSH, playbooks en YAML, push -> reseau
# Puppet  : AVEC agent, manifests (Ruby), pull
# Chef    : AVEC agent, recipes/cookbooks (Ruby), pull</pre>`,

    { type: "qcm", q: "Ansible décrit ses tâches dans des playbooks écrits dans quel langage ?", opts: ["Ruby", "YAML", "Python", "XML"], a: 1, exp: "Les playbooks Ansible sont en YAML, lisible et basé sur l'indentation." },
    { type: "vf", q: "L'idempotence signifie qu'appliquer la même configuration plusieurs fois donne toujours le même résultat.", a: true, exp: "Exact : si l'état voulu est déjà atteint, l'outil ne refait rien." },
    { type: "input", q: "Quel protocole Ansible utilise-t-il pour se connecter aux machines et pousser la configuration ?", a: ["ssh"], ph: "3 lettres", exp: "Ansible utilise SSH, ce qui évite d'installer un agent sur les cibles." },
    { type: "qcm", q: "Puppet et Chef reposent historiquement sur quel modèle ?", opts: ["Sans agent (agentless)", "Avec agent installé sur chaque nœud", "Aucun logiciel", "Uniquement du GUI"], a: 1, exp: "Puppet et Chef installent un agent sur chaque nœud géré." },
    { type: "qcm", q: "Une approche « déclarative » consiste à…", opts: ["Lister chaque commande à exécuter dans l'ordre", "Décrire le résultat voulu et laisser l'outil l'atteindre", "Configurer à la main via la CLI", "Chiffrer les mots de passe"], a: 1, exp: "Le déclaratif décrit le résultat (l'état désiré), pas la suite d'étapes." },
    { type: "vf", q: "Ansible nécessite d'installer un agent sur chaque équipement réseau géré.", a: false, exp: "Non : Ansible est agentless ; c'est justement un avantage sur les équipements réseau." },
    { type: "input", q: "Comment appelle-t-on les fichiers de tâches d'Ansible (terme anglais) ?", a: ["playbook", "playbooks", "les playbooks"], ph: "un mot anglais", exp: "Les playbooks Ansible (en YAML) décrivent les tâches à appliquer." },
    { type: "qcm", q: "Chef organise sa configuration en…", opts: ["Playbooks", "Manifests", "Recipes regroupées en cookbooks", "Inventories"], a: 2, exp: "Chef utilise des recipes (recettes) regroupées en cookbooks, écrites en Ruby." },
    { type: "qcm", q: "Grâce à l'idempotence, relancer une configuration déjà appliquée…", opts: ["Duplique les ressources", "Provoque une erreur", "Ne change rien car l'état voulu est déjà atteint", "Supprime la configuration"], a: 2, exp: "Si l'état désiré est atteint, l'outil idempotent ne fait aucune action inutile." },
    { type: "vf", q: "Puppet et Chef utilisent le langage Ruby pour décrire les configurations.", a: true, exp: "Oui : Puppet et Chef sont historiquement liés à Ruby (manifests, recipes)." },
    { type: "input", q: "Quel terme (français) désigne la propriété où appliquer 1 ou N fois donne le même résultat ?", a: ["idempotence", "l'idempotence", "idempotent", "idempotency"], ph: "un mot", exp: "L'idempotence garantit un résultat identique quel que soit le nombre d'exécutions." },
    { type: "qcm", q: "Quel outil est le plus cité pour l'automatisation réseau grâce à sa simplicité de déploiement ?", opts: ["Chef", "Puppet", "Ansible", "Ruby"], a: 2, exp: "Ansible, agentless et en SSH, est le plus utilisé pour automatiser les équipements réseau." },
    { type: "qcm", q: "Dans Ansible, le fichier qui liste les hôtes à gérer s'appelle…", opts: ["Le manifest", "Le cookbook", "L'inventory (inventaire)", "Le recipe"], a: 2, exp: "L'inventory d'Ansible liste les hôtes ciblés par les playbooks." },
    { type: "vf", q: "La gestion de configuration vise à maintenir automatiquement un parc dans un état cohérent et désiré.", a: true, exp: "Oui : on décrit l'état désiré, l'outil l'applique et le maintient sur tout le parc." }
  ],
  final: {
    title: "Exercice final — Choisir et comprendre l'outil d'automatisation",
    intro: `<p>Une équipe veut automatiser la configuration de 200 routeurs sans installer de logiciel dessus, avec des fichiers lisibles et des exécutions répétables sans risque. Analysons ses choix.</p>`,
    questions: [
      { type: "qcm", q: "Pour ne rien installer sur les routeurs, quel outil convient le mieux ?", opts: ["Puppet", "Chef", "Ansible", "Ruby"], a: 2, exp: "Ansible est agentless : il pilote les routeurs en SSH sans agent." },
      { type: "input", q: "Quel protocole Ansible utilisera-t-il pour joindre les routeurs ?", a: ["ssh"], ph: "3 lettres", exp: "Ansible se connecte par SSH." },
      { type: "input", q: "Dans quel langage lisible, basé sur l'indentation, l'équipe écrira-t-elle ses playbooks ?", a: ["yaml"], ph: "4 lettres", exp: "Les playbooks Ansible sont en YAML." },
      { type: "qcm", q: "Pourquoi l'équipe peut-elle relancer le même playbook sans crainte ?", opts: ["Car Ansible est impératif", "Grâce à l'idempotence : même état final, pas d'action inutile", "Car il installe un agent", "Car il chiffre les mots de passe"], a: 1, exp: "L'idempotence garantit un résultat stable, quel que soit le nombre d'exécutions." },
      { type: "vf", q: "Si l'équipe avait choisi Puppet ou Chef, elle aurait dû installer un agent sur chaque routeur.", a: true, exp: "Oui : Puppet et Chef sont agent-based, contrairement à Ansible." }
    ],
    solution: `<pre class="pseudo"># Choix retenu par l'equipe
Outil        : Ansible
Modele       : SANS agent (agentless) -> rien a installer sur les routeurs
Connexion    : SSH (push de la config)
Fichiers     : playbooks en YAML + inventory listant les 200 routeurs
Surete       : idempotence -> on relance sans dupliquer ni casser

# Comparaison
Ansible : agentless, YAML, SSH   (ideal reseau)
Puppet  : agent, manifests (Ruby)
Chef    : agent, recipes/cookbooks (Ruby)</pre>
<p>Agentless, YAML et idempotent : Ansible coche toutes les cases pour automatiser un parc réseau de façon sûre et lisible.</p>`
  }
};
</script>
