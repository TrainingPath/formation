<script>
var DAY = {
  num: 10,
  title: "Créer des unités d'organisation (OU)",
  subtitle: "Structurer le domaine en dossiers logiques et les protéger contre la suppression.",
  theory: `
<h3>1. Rappel : qu'est-ce qu'une OU ?</h3>
<p>Une <strong>unité d'organisation</strong> (OU) est un conteneur que TU crées pour ranger tes objets : utilisateurs, ordinateurs, groupes. Analogie : ce sont les <strong>dossiers</strong> et sous-dossiers de ton classeur numérique. Une bonne structure d'OU rend l'administration claire et permet, plus tard, d'appliquer des règles (GPO) par service.</p>
<div class="tip">Deux raisons majeures de créer des OU : (1) <strong>ranger</strong> logiquement les objets ; (2) pouvoir <strong>appliquer une GPO</strong> à un groupe d'objets. Rappelle-toi : on ne peut pas appliquer de GPO au conteneur Users par défaut, mais on peut à une OU.</div>
<h3>2. Créer une OU</h3>
<pre class="pseudo">ADUC ▸ clic droit sur le domaine entreprise.local (ou sur une OU existante)
   ▸ Nouveau ▸ Unité d'organisation
   ▸ Nom : Comptabilite
   ▸ [x] Protéger le conteneur contre une suppression accidentelle
   ▸ OK</pre>
<div class="warn">La case <strong>« Protéger le conteneur contre une suppression accidentelle »</strong> est cochée par défaut, et c'est une excellente chose : elle empêche d'effacer l'OU (et tout son contenu !) d'un clic malheureux. Laisse-la cochée.</div>
<h3>3. Les OU imbriquées (hiérarchie)</h3>
<p>Une OU peut contenir d'autres OU : on parle d'OU <strong>imbriquées</strong>. Cela crée une hiérarchie qui reflète l'organisation de l'entreprise. Analogie : un dossier « Sièges » contenant les sous-dossiers « Paris » et « Lyon ».</p>
<pre class="pseudo">entreprise.local
   └─ OU Services
        ├─ OU Comptabilite
        │     ├─ OU Utilisateurs
        │     └─ OU Ordinateurs
        └─ OU Commercial
              ├─ OU Utilisateurs
              └─ OU Ordinateurs</pre>
<h3>4. Deux modèles de structuration courants</h3>
<pre class="pseudo">Par SERVICE :   OU Comptabilite | OU Commercial | OU Direction   (par métier)
Par TYPE :      OU Utilisateurs | OU Ordinateurs | OU Groupes     (par nature d'objet)
Mixte :         OU par service, puis à l'intérieur OU par type</pre>
<p>Il n'y a pas de modèle unique : on choisit selon la taille et les besoins de GPO. Le plus important est la <strong>cohérence</strong>.</p>
<h3>5. Renommer une OU</h3>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU ▸ Renommer ▸ taper le nouveau nom ▸ Entrée</pre>
<h3>6. Supprimer une OU protégée</h3>
<p>Si une OU est protégée (recommandé), la suppression échoue avec un message. Pour la supprimer volontairement, il faut d'abord <strong>retirer la protection</strong> :</p>
<pre class="pseudo">1. Affichage ▸ Fonctionnalités avancées   (pour voir l'onglet Objet)
2. Double-clic sur l'OU ▸ onglet « Objet »
3. Décocher « Protéger l'objet des suppressions accidentelles » ▸ OK
4. Clic droit sur l'OU ▸ Supprimer ▸ confirmer</pre>
<div class="warn">Supprimer une OU supprime TOUT ce qu'elle contient (utilisateurs, sous-OU…). La protection est là pour t'obliger à réfléchir à deux fois. Ne la retire que si tu es certain.</div>`,
  exercises: [
    { type: "qcm", q: "Quel chemin crée une nouvelle OU ?", opts: ["Clic droit ▸ Nouveau ▸ Utilisateur", "Clic droit sur le domaine/OU ▸ Nouveau ▸ Unité d'organisation", "Fichier ▸ Enregistrer", "Outils ▸ DNS"], a: 1, exp: "Nouveau ▸ Unité d'organisation crée une OU." },
    { type: "qcm", q: "À quoi sert la case « Protéger le conteneur contre une suppression accidentelle » ?", opts: ["À chiffrer l'OU", "À empêcher d'effacer l'OU par erreur", "À cacher l'OU", "À accélérer AD"], a: 1, exp: "Elle bloque la suppression accidentelle de l'OU et de son contenu." },
    { type: "qcm", q: "Qu'appelle-t-on des OU « imbriquées » ?", opts: ["Des OU vides", "Des OU contenues dans d'autres OU (hiérarchie)", "Des OU supprimées", "Des OU cachées"], a: 1, exp: "Une OU peut en contenir d'autres, formant une hiérarchie." },
    { type: "qcm", q: "Peut-on appliquer une GPO à une OU ?", opts: ["Non, jamais", "Oui, c'est justement un intérêt majeur des OU", "Seulement au conteneur Users", "Uniquement au domaine"], a: 1, exp: "Les OU peuvent recevoir des GPO, contrairement aux conteneurs par défaut." },
    { type: "qcm", q: "Que se passe-t-il si on supprime une OU contenant des utilisateurs ?", opts: ["Rien", "Tout son contenu est supprimé aussi", "Seule l'OU disparaît, les utilisateurs restent", "Windows redémarre"], a: 1, exp: "La suppression est récursive : elle emporte tout le contenu." },
    { type: "qcm", q: "Pour supprimer une OU protégée, il faut d'abord…", opts: ["Redémarrer", "Retirer la protection dans l'onglet Objet (mode Fonctionnalités avancées)", "Renommer l'OU", "Vider le domaine"], a: 1, exp: "On décoche la protection dans l'onglet Objet avant de supprimer." },
    { type: "vf", q: "La case de protection contre la suppression accidentelle est cochée par défaut.", a: true, exp: "Windows la coche automatiquement, ce qui est une bonne pratique." },
    { type: "vf", q: "Une OU ne peut jamais contenir une autre OU.", a: false, exp: "Les OU imbriquées sont possibles et fréquentes." },
    { type: "vf", q: "On peut structurer les OU par service, par type d'objet, ou selon un modèle mixte.", a: true, exp: "Plusieurs modèles existent ; la cohérence prime." },
    { type: "input", q: "Quel sigle désigne une unité d'organisation ?", a: ["OU", "ou"], ph: "un sigle", exp: "OU = Organizational Unit." },
    { type: "input", q: "Dans le menu contextuel, quel sous-menu contient « Unité d'organisation » (un mot) ?", a: ["Nouveau", "nouveau"], ph: "un mot", exp: "Clic droit ▸ Nouveau ▸ Unité d'organisation." },
    { type: "input", q: "Dans quel onglet des propriétés d'une OU retire-t-on la protection contre la suppression (un mot) ?", a: ["Objet", "objet"], ph: "un mot", exp: "L'onglet « Objet » (visible en mode Fonctionnalités avancées)." },
    { type: "input", q: "Quel mode d'affichage faut-il activer pour voir l'onglet Objet (deux mots) ?", a: ["Fonctionnalités avancées", "fonctionnalités avancées", "fonctionnalites avancees"], ph: "deux mots", exp: "Affichage ▸ Fonctionnalités avancées." },
    { type: "input", q: "Comment appelle-t-on des OU contenues les unes dans les autres (un mot) ?", a: ["imbriquées", "imbriquees", "imbriquée"], ph: "un mot", exp: "Des OU imbriquées forment une hiérarchie." },
    { type: "qcm", q: "Quel est l'intérêt principal, au-delà du rangement, de créer ses propres OU ?", opts: ["Changer la couleur", "Pouvoir appliquer des GPO à des groupes d'objets", "Accélérer le disque", "Renommer le domaine"], a: 1, exp: "Les OU sont la cible des GPO : elles permettent des règles différenciées." }
  ],
  final: {
    title: "Exercice final — Bâtir la structure d'OU de l'entreprise",
    intro: `<p>L'entreprise a deux services (Comptabilité et Commercial). On veut, dans chacun, séparer les comptes utilisateurs des comptes ordinateurs. Décris la structure d'OU à créer et comment la mettre en place.</p>`,
    questions: [
      { type: "input", q: "Quel sous-menu du clic droit lance la création d'une OU (un mot) ?", a: ["Nouveau", "nouveau"], ph: "un mot", exp: "Nouveau ▸ Unité d'organisation." },
      { type: "qcm", q: "Combien d'OU de premier niveau (par service) crées-tu ?", opts: ["Une seule", "Deux : Comptabilite et Commercial", "Zéro", "Dix"], a: 1, exp: "Une OU par service : Comptabilite et Commercial." },
      { type: "vf", q: "Tu peux créer une OU Utilisateurs et une OU Ordinateurs à l'intérieur de chaque OU de service.", a: true, exp: "Les OU imbriquées permettent cette organisation." },
      { type: "input", q: "Quelle case laisses-tu cochée à la création pour éviter les suppressions accidentelles ? (mot-clé « Protéger »)", a: ["Protéger le conteneur", "protéger", "proteger", "Protéger contre une suppression accidentelle"], ph: "quelques mots", exp: "La case de protection contre la suppression accidentelle." },
      { type: "qcm", q: "Pourquoi cette structure facilitera-t-elle les GPO plus tard ?", opts: ["Elle ne change rien aux GPO", "On pourra cibler une GPO sur Comptabilite, une autre sur Commercial", "Les GPO ignorent les OU", "Elle supprime le besoin de GPO"], a: 1, exp: "Chaque OU peut recevoir sa propre stratégie." }
    ],
    solution: `<p>Structure et mise en place :</p>
<pre class="pseudo">Cible :
entreprise.local
   ├─ OU Comptabilite
   │     ├─ OU Utilisateurs
   │     └─ OU Ordinateurs
   └─ OU Commercial
         ├─ OU Utilisateurs
         └─ OU Ordinateurs

Étapes :
1. ADUC ▸ clic droit sur entreprise.local ▸ Nouveau ▸ Unité d'organisation ▸ « Comptabilite » ▸ OK
2. Répéter pour « Commercial »
3. Clic droit sur OU Comptabilite ▸ Nouveau ▸ Unité d'organisation ▸ « Utilisateurs » ▸ OK
4. Clic droit sur OU Comptabilite ▸ Nouveau ▸ Unité d'organisation ▸ « Ordinateurs » ▸ OK
5. Répéter les étapes 3-4 dans OU Commercial
6. Laisser cochée la protection sur chaque OU</pre>
<p>La structure est prête à recevoir les comptes (jour 7/11) et des GPO ciblées par service (jour 16).</p>`
  }
};
</script>
