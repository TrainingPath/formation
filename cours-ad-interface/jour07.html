<script>
var DAY = {
  num: 7,
  title: "Créer un utilisateur (ADUC)",
  subtitle: "L'assistant Nouvel objet Utilisateur, champ par champ.",
  theory: `
<h3>1. Objectif du jour</h3>
<p>Créer un <strong>compte utilisateur</strong>, c'est ajouter dans l'annuaire une fiche qui permettra à une personne d'ouvrir une session sur le domaine. Analogie : c'est <strong>embaucher quelqu'un</strong> et lui remettre son badge d'accès. Nous le faisons avec l'assistant graphique d'ADUC.</p>
<h3>2. Lancer l'assistant de création</h3>
<p>On crée toujours l'utilisateur <strong>dans un conteneur ou une OU précis</strong> (par exemple l'OU Comptabilité). On fait un clic droit sur ce conteneur :</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU (ex. Comptabilite) ▸ Nouveau ▸ Utilisateur</pre>
<h3>3. Premier écran : identité et nom d'ouverture de session</h3>
<p>L'assistant « Nouvel objet - Utilisateur » demande :</p>
<pre class="pseudo">Prénom :                Marie
Nom :                   Durand
Nom complet :           Marie Durand        (rempli automatiquement)
Nom d'ouverture de session de l'utilisateur :  mdurand   @entreprise.local
Nom d'ouverture (antérieur à Windows 2000) :   ENTREPRISE\mdurand   (rempli automatiquement)
   ▸ Suivant</pre>
<div class="tip">Le <strong>nom d'ouverture de session</strong> (aussi appelé <strong>UPN</strong>, <em>User Principal Name</em>) est l'identifiant que Marie tapera, sous la forme <code>mdurand@entreprise.local</code>. Choisis une convention claire et constante (ici : première lettre du prénom + nom).</div>
<h3>4. Deuxième écran : mot de passe et options</h3>
<pre class="pseudo">Mot de passe :          ********
Confirmer le mot de passe : ********
[x] L'utilisateur doit changer le mot de passe à la prochaine ouverture de session
[ ] L'utilisateur ne peut pas changer de mot de passe
[ ] Le mot de passe n'expire jamais
[ ] Le compte est désactivé
   ▸ Suivant</pre>
<div class="warn">Le mot de passe doit respecter la <strong>stratégie de complexité</strong> par défaut : au moins 7 caractères, mélangeant majuscules, minuscules, chiffres ou symboles. Un mot de passe trop simple est refusé avec un message d'erreur.</div>
<div class="tip">Cocher « doit changer le mot de passe à la prochaine ouverture » est une bonne pratique : tu donnes un mot de passe provisoire, et l'utilisateur choisira le sien au premier démarrage.</div>
<h3>5. Troisième écran : confirmation</h3>
<p>L'assistant affiche un récapitulatif. On vérifie, puis on clique <strong>Terminer</strong>. Le compte apparaît aussitôt dans le volet droit de l'OU choisie, avec son icône « tête ».</p>
<pre class="pseudo">Écran récapitulatif ▸ vérifier prénom, nom, identifiant ▸ Terminer</pre>
<h3>6. Vérifier et tester</h3>
<p>Un double-clic sur le nouveau compte ouvre ses <strong>Propriétés</strong> (onglets Général, Compte, etc. — détaillés au jour 8). On peut déjà vérifier l'onglet <strong>Compte</strong> : le nom d'ouverture de session doit être correct.</p>
<div class="warn">Piège fréquent : créer l'utilisateur dans le mauvais conteneur (souvent Users par défaut au lieu de l'OU voulue). Vérifie toujours sur quel conteneur tu as fait le clic droit. On pourra le déplacer plus tard (jour 11), mais autant viser juste.</div>
<h3>7. Et dans ADAC ?</h3>
<p>La même création existe dans ADAC : sélectionner l'OU ▸ volet Tâches ▸ Nouveau ▸ Utilisateur. Les champs sont regroupés sur une seule grande fiche plutôt qu'en plusieurs écrans.</p>`,
  exercises: [
    { type: "qcm", q: "Sur quoi fait-on un clic droit pour créer un utilisateur au bon endroit ?", opts: ["Sur le Bureau", "Sur l'OU (ou le conteneur) voulu, puis Nouveau ▸ Utilisateur", "Sur le conteneur Builtin", "Sur la console DNS"], a: 1, exp: "On clique droit sur l'OU cible pour y créer directement le compte." },
    { type: "qcm", q: "Comment appelle-t-on l'identifiant de la forme mdurand@entreprise.local ?", opts: ["Le mot de passe", "Le nom d'ouverture de session (UPN)", "Le SID", "Le nom NetBIOS"], a: 1, exp: "C'est le nom d'ouverture de session, ou UPN (User Principal Name)." },
    { type: "qcm", q: "Quelle bonne pratique applique-t-on souvent au premier mot de passe ?", opts: ["Le laisser vide", "Cocher « doit changer le mot de passe à la prochaine ouverture »", "Le mot de passe n'expire jamais", "Désactiver le compte"], a: 1, exp: "L'utilisateur définira son propre mot de passe au premier démarrage." },
    { type: "qcm", q: "Que se passe-t-il si le mot de passe est trop simple ?", opts: ["Il est accepté quand même", "Il est refusé car il ne respecte pas la stratégie de complexité", "Le compte est supprimé", "Windows redémarre"], a: 1, exp: "La stratégie de complexité par défaut refuse les mots de passe faibles." },
    { type: "qcm", q: "Quel bouton crée réellement le compte à la fin de l'assistant ?", opts: ["Annuler", "Terminer", "Précédent", "Fermer"], a: 1, exp: "Le bouton « Terminer » valide la création." },
    { type: "qcm", q: "Quel est le piège fréquent lors de la création d'un compte ?", opts: ["Choisir un prénom trop long", "Créer le compte dans le mauvais conteneur (ex. Users au lieu de l'OU voulue)", "Utiliser une majuscule", "Cliquer Suivant"], a: 1, exp: "Vérifie toujours l'emplacement (le conteneur sur lequel tu as cliqué droit)." },
    { type: "vf", q: "Le champ « Nom complet » se remplit automatiquement à partir du prénom et du nom.", a: true, exp: "L'assistant compose le nom complet, qu'on peut ajuster." },
    { type: "vf", q: "On peut créer un utilisateur aussi bien dans ADUC que dans ADAC.", a: true, exp: "Les deux consoles permettent la création sur le même annuaire." },
    { type: "vf", q: "Un mot de passe de 3 caractères sans complexité sera accepté par défaut.", a: false, exp: "La stratégie exige environ 7 caractères et de la complexité." },
    { type: "input", q: "Quel sigle désigne le nom d'ouverture de session de la forme mdurand@entreprise.local ?", a: ["UPN", "upn"], ph: "un sigle", exp: "UPN = User Principal Name." },
    { type: "input", q: "Dans quel menu contextuel trouve-t-on « Utilisateur » lors de la création (un mot) ?", a: ["Nouveau", "nouveau"], ph: "un mot", exp: "Clic droit ▸ Nouveau ▸ Utilisateur." },
    { type: "input", q: "Quelle case coche-t-on pour forcer le changement de mot de passe au 1er démarrage ? (donne le mot-clé « changer »)", a: ["changer le mot de passe", "doit changer le mot de passe", "changer"], ph: "quelques mots", exp: "« L'utilisateur doit changer le mot de passe à la prochaine ouverture de session »." },
    { type: "input", q: "Dans quel onglet des Propriétés vérifie-t-on le nom d'ouverture de session (un mot) ?", a: ["Compte", "compte"], ph: "un mot", exp: "L'onglet « Compte » contient le nom d'ouverture de session." },
    { type: "input", q: "Comment appelle-t-on la règle qui refuse les mots de passe trop faibles (deux mots) ?", a: ["stratégie de complexité", "complexité", "stratégie de mot de passe"], ph: "deux mots", exp: "La stratégie de complexité des mots de passe." },
    { type: "qcm", q: "Après clic sur Terminer, où apparaît le nouveau compte ?", opts: ["Sur le Bureau", "Dans le volet droit de l'OU choisie, avec l'icône utilisateur", "Dans la corbeille", "Dans le menu Démarrer"], a: 1, exp: "Le compte s'ajoute au contenu de l'OU où on l'a créé." }
  ],
  final: {
    title: "Exercice final — Embaucher Marie Durand à la Comptabilité",
    intro: `<p>Marie Durand rejoint le service Comptabilité. Tu dois créer son compte dans l'OU Comptabilité avec l'identifiant <code>mdurand</code>, un mot de passe provisoire, et l'obligation de le changer au premier démarrage. Décris tes actions.</p>`,
    questions: [
      { type: "qcm", q: "Sur quel élément fais-tu le clic droit pour bien placer le compte ?", opts: ["Le conteneur Users", "L'OU Comptabilite", "Le domaine racine", "Domain Controllers"], a: 1, exp: "On crée le compte directement dans l'OU Comptabilite." },
      { type: "input", q: "Quel chemin de menu suit le clic droit pour lancer la création ? (Nouveau ▸ ?)", a: ["Utilisateur", "utilisateur"], ph: "un mot", exp: "Nouveau ▸ Utilisateur." },
      { type: "input", q: "Quel nom d'ouverture de session saisis-tu (avant l'arobase) ?", a: ["mdurand", "MDURAND"], ph: "un identifiant", exp: "mdurand, puis @entreprise.local." },
      { type: "vf", q: "Tu coches « L'utilisateur doit changer le mot de passe à la prochaine ouverture de session ».", a: true, exp: "Marie choisira son propre mot de passe au premier démarrage." },
      { type: "qcm", q: "Que fais-tu si le mot de passe provisoire est refusé ?", opts: ["Je laisse le mot de passe vide", "Je choisis un mot de passe respectant la complexité (majuscule, chiffre, longueur)", "Je supprime la stratégie de mot de passe du domaine", "Je redémarre le serveur"], a: 1, exp: "Il faut un mot de passe conforme à la stratégie de complexité." }
    ],
    solution: `<p>Marche à suivre pour créer Marie Durand :</p>
<pre class="pseudo">1. ADUC ▸ déplier entreprise.local ▸ clic droit sur l'OU Comptabilite ▸ Nouveau ▸ Utilisateur
2. Écran 1 :
     Prénom : Marie   |   Nom : Durand
     Nom d'ouverture de session : mdurand @entreprise.local  ▸ Suivant
3. Écran 2 :
     Mot de passe : (provisoire, conforme à la complexité)  |  Confirmer
     [x] L'utilisateur doit changer le mot de passe à la prochaine ouverture  ▸ Suivant
4. Écran 3 (récapitulatif) : vérifier Marie Durand / mdurand ▸ Terminer
5. Le compte mdurand apparaît dans l'OU Comptabilite
6. Double-clic ▸ onglet Compte : vérifier le nom d'ouverture de session</pre>
<p>Marie pourra se connecter avec mdurand@entreprise.local et devra définir son mot de passe au premier démarrage.</p>`
  }
};
</script>
