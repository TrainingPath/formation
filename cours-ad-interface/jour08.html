<script>
var DAY = {
  num: 8,
  title: "Les propriétés d'un compte utilisateur",
  subtitle: "Explorer les onglets Général, Adresse, Compte, Profil, Membre de…",
  theory: `
<h3>1. La fenêtre Propriétés</h3>
<p>Chaque compte utilisateur possède une <strong>fiche de propriétés</strong> détaillée. On l'ouvre par un double-clic (ou clic droit ▸ Propriétés). Elle est découpée en <strong>onglets</strong>, comme les intercalaires d'un classeur. Analogie : c'est le <strong>dossier RH complet</strong> de l'employé, avec une intercalaire par thème.</p>
<pre class="pseudo">ADUC ▸ double-clic sur l'utilisateur (ex. mdurand) ▸ fenêtre Propriétés à onglets</pre>
<h3>2. L'onglet Général</h3>
<p>Informations d'identité et de contact : prénom, nom, nom complet, description, bureau, numéro de téléphone, adresse de messagerie, page Web. Ces champs sont <strong>informatifs</strong> : ils remplissent l'annuaire pour que les collègues retrouvent facilement les coordonnées de la personne.</p>
<pre class="pseudo">Onglet Général :  Prénom | Nom | Description | Bureau | Téléphone | Courrier électronique</pre>
<h3>3. L'onglet Adresse</h3>
<p>Adresse postale : rue, ville, code postal, pays. Purement informatif également.</p>
<h3>4. L'onglet Compte (le plus important)</h3>
<p>C'est l'onglet <strong>technique</strong> le plus utilisé. Il contient :</p>
<pre class="pseudo">- Nom d'ouverture de session (UPN)  : mdurand@entreprise.local
- Nom antérieur à Windows 2000       : ENTREPRISE\mdurand
- Bouton « Horaires d'accès… »       : autoriser la connexion à certaines heures seulement
- Bouton « Se connecter à… »         : limiter à certains postes
- Options de compte (cases à cocher) : mot de passe n'expire jamais, compte désactivé…
- Date d'expiration du compte        : « Jamais » ou « Fin de » une date</pre>
<div class="tip">« Horaires d'accès » sert par exemple à empêcher les connexions la nuit. « Se connecter à » restreint un compte à un ou plusieurs ordinateurs précis. « Date d'expiration » est idéale pour un stagiaire ou un intérimaire : le compte se bloque tout seul à la date prévue.</div>
<h3>5. L'onglet Profil</h3>
<p>Définit le <strong>profil</strong> de l'utilisateur (l'emplacement où sont stockés son bureau et ses documents), un <strong>script d'ouverture de session</strong> éventuel, et un <strong>dossier de base</strong> (lecteur réseau personnel, par exemple H:). Utile dans les environnements avec dossiers itinérants.</p>
<h3>6. L'onglet Membre de</h3>
<p>Liste les <strong>groupes</strong> auxquels appartient l'utilisateur. On y ajoute ou retire l'appartenance à un groupe (détaillé au jour 13). C'est ici qu'on donne, indirectement, des droits à la personne.</p>
<pre class="pseudo">Onglet « Membre de » :  liste des groupes  |  bouton Ajouter…  |  bouton Supprimer</pre>
<h3>7. Les onglets Organisation, Téléphones…</h3>
<p><strong>Organisation</strong> : fonction, service, société, et surtout le <strong>Responsable</strong> (le manager), ce qui construit l'organigramme. <strong>Téléphones</strong> : numéros supplémentaires. Ces onglets enrichissent l'annuaire de l'entreprise.</p>
<div class="warn">Modifier une propriété et cliquer <strong>Appliquer</strong> enregistre sans fermer ; <strong>OK</strong> enregistre et ferme ; <strong>Annuler</strong> abandonne les changements. Prends l'habitude de cliquer Appliquer avant de changer d'onglet si tu veux être sûr.</div>`,
  exercises: [
    { type: "qcm", q: "Comment ouvre-t-on la fiche de propriétés d'un utilisateur ?", opts: ["Un simple survol", "Un double-clic (ou clic droit ▸ Propriétés)", "En le supprimant", "En redémarrant"], a: 1, exp: "Double-clic ou clic droit ▸ Propriétés ouvre la fenêtre à onglets." },
    { type: "qcm", q: "Quel onglet contient le nom d'ouverture de session et les options de compte ?", opts: ["Général", "Adresse", "Compte", "Profil"], a: 2, exp: "L'onglet Compte regroupe l'UPN, les options et l'expiration." },
    { type: "qcm", q: "Où fixe-t-on une date d'expiration pour un compte de stagiaire ?", opts: ["Onglet Général", "Onglet Compte, « Date d'expiration du compte »", "Onglet Adresse", "Onglet Profil"], a: 1, exp: "La date d'expiration se règle dans l'onglet Compte." },
    { type: "qcm", q: "À quoi sert le bouton « Horaires d'accès » de l'onglet Compte ?", opts: ["À changer le mot de passe", "À autoriser la connexion seulement à certaines heures", "À supprimer le compte", "À renommer l'utilisateur"], a: 1, exp: "Il restreint les plages horaires de connexion autorisées." },
    { type: "qcm", q: "Quel onglet liste les groupes de l'utilisateur ?", opts: ["Membre de", "Général", "Téléphones", "Profil"], a: 0, exp: "L'onglet « Membre de » gère l'appartenance aux groupes." },
    { type: "qcm", q: "Où renseigne-t-on le Responsable (manager) pour construire l'organigramme ?", opts: ["Onglet Organisation", "Onglet Adresse", "Onglet Compte", "Onglet Profil"], a: 0, exp: "L'onglet Organisation contient fonction, service et Responsable." },
    { type: "vf", q: "Les champs de l'onglet Général (téléphone, bureau) sont surtout informatifs.", a: true, exp: "Ils remplissent l'annuaire de contacts sans donner de droits." },
    { type: "vf", q: "Le bouton « Se connecter à… » permet de limiter un compte à certains ordinateurs.", a: true, exp: "Il restreint les postes autorisés pour ce compte." },
    { type: "vf", q: "Cliquer « Annuler » enregistre les modifications.", a: false, exp: "Annuler abandonne les modifications ; OK ou Appliquer enregistrent." },
    { type: "input", q: "Quel onglet est le plus important techniquement (contient l'UPN et les options) ?", a: ["Compte", "compte", "l'onglet Compte"], ph: "un mot", exp: "L'onglet Compte." },
    { type: "input", q: "Quel onglet gère l'appartenance aux groupes (deux mots) ?", a: ["Membre de", "membre de"], ph: "deux mots", exp: "L'onglet « Membre de »." },
    { type: "input", q: "Quel bouton enregistre les changements SANS fermer la fenêtre ?", a: ["Appliquer", "appliquer"], ph: "un mot", exp: "« Appliquer » enregistre sans fermer ; OK enregistre et ferme." },
    { type: "input", q: "Dans quel onglet trouve-t-on le champ « Responsable » (le manager) ?", a: ["Organisation", "organisation"], ph: "un mot", exp: "L'onglet Organisation." },
    { type: "input", q: "Quel onglet définit le dossier de base (lecteur réseau personnel) et le script de connexion ?", a: ["Profil", "profil"], ph: "un mot", exp: "L'onglet Profil." },
    { type: "qcm", q: "Un compte de stagiaire doit se bloquer automatiquement le 30 juin. Quelle option utiliser ?", opts: ["Le mot de passe n'expire jamais", "La date d'expiration du compte dans l'onglet Compte", "Horaires d'accès", "Supprimer le compte à l'avance"], a: 1, exp: "La date d'expiration bloque le compte automatiquement à l'échéance." }
  ],
  final: {
    title: "Exercice final — Compléter la fiche d'un intérimaire",
    intro: `<p>Sophie Leroy est intérimaire jusqu'au 31 août. Tu dois compléter sa fiche : coordonnées, service, responsable, et surtout une date d'expiration du compte. Décris dans quels onglets tu interviens.</p>`,
    questions: [
      { type: "input", q: "Dans quel onglet saisis-tu son téléphone et sa description ?", a: ["Général", "général", "general"], ph: "un mot", exp: "L'onglet Général regroupe les coordonnées d'identité." },
      { type: "input", q: "Dans quel onglet règles-tu la date d'expiration du compte ?", a: ["Compte", "compte"], ph: "un mot", exp: "La date d'expiration est dans l'onglet Compte." },
      { type: "input", q: "Dans quel onglet indiques-tu son Responsable (manager) ?", a: ["Organisation", "organisation"], ph: "un mot", exp: "L'onglet Organisation contient le champ Responsable." },
      { type: "qcm", q: "Quelle option choisir pour l'expiration ?", opts: ["Jamais", "Fin de : 31 août", "Le mot de passe n'expire jamais", "Compte désactivé tout de suite"], a: 1, exp: "« Fin de » suivie de la date bloque le compte à l'échéance." },
      { type: "vf", q: "Tu cliques Appliquer après chaque onglet modifié pour être sûr d'enregistrer.", a: true, exp: "Appliquer enregistre sans fermer, utile avant de changer d'onglet." }
    ],
    solution: `<p>Marche à suivre pour la fiche de Sophie Leroy :</p>
<pre class="pseudo">1. ADUC ▸ OU appropriée ▸ double-clic sur le compte de Sophie
2. Onglet Général : saisir téléphone, courrier électronique, description ▸ Appliquer
3. Onglet Adresse : saisir l'adresse postale (facultatif) ▸ Appliquer
4. Onglet Organisation : saisir Fonction, Service, puis « Responsable » ▸ Modifier ▸ choisir le manager ▸ Appliquer
5. Onglet Compte :
     - vérifier le nom d'ouverture de session
     - « Date d'expiration du compte » ▸ « Fin de » ▸ 31 août ▸ Appliquer
6. Cliquer OK pour enregistrer et fermer</pre>
<p>Le compte de Sophie est complet et se bloquera automatiquement le 31 août, sans intervention.</p>`
  }
};
</script>
