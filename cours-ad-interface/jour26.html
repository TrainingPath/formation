<script>
var DAY = {
  num: 26,
  title: "Les rôles FSMO (transfert via consoles)",
  subtitle: "Cinq rôles uniques dans la forêt, et comment les déplacer proprement.",
  theory: `
<h3>1. Pourquoi des rôles uniques ?</h3>
<p>Dans AD, tous les contrôleurs de domaine sont en principe égaux : chacun peut écrire dans l'annuaire (modèle « multimaître »). Mais certaines opérations sensibles doivent être gérées par <strong>un seul</strong> DC à la fois pour éviter les conflits. Ces opérations sont confiées à des rôles <strong>FSMO</strong>.</p>
<h3>2. Le sigle FSMO</h3>
<p><strong>FSMO</strong> signifie <em>Flexible Single Master Operations</em> (« opérations à maître unique flottant »). « Maître unique » : un seul DC détient le rôle. « Flottant » : le rôle peut être déplacé d'un DC à un autre. Il y a <strong>cinq</strong> rôles FSMO.</p>
<h3>3. Les cinq rôles</h3>
<p>Deux rôles existent au niveau de la <strong>forêt</strong> (un seul exemplaire pour toute la forêt), trois au niveau de <strong>chaque domaine</strong> (un exemplaire par domaine).</p>
<pre class="pseudo">Niveau FORET (1 par foret) :
  Schema Master              gere le schema (definition des types d'objets)
  Domain Naming Master       gere l'ajout/suppression de domaines dans la foret

Niveau DOMAINE (1 par domaine) :
  RID Master                 distribue des blocs d'identifiants (RID) pour creer des objets uniques
  PDC Emulator               reference du temps, changements de mot de passe, verrouillages
  Infrastructure Master      met a jour les references vers des objets d'autres domaines</pre>
<div class="tip">Le <strong>PDC Emulator</strong> est le plus « sensible » au quotidien : il sert de source de temps du domaine et traite en priorité les changements de mot de passe. S'il manque, on le remarque vite.</div>
<h3>4. Où voit-on quel DC détient quoi ?</h3>
<p>Trois consoles graphiques montrent et permettent de transférer les rôles :</p>
<pre class="pseudo">Utilisateurs et ordinateurs AD (ADUC)   → RID, PDC, Infrastructure
   clic droit sur le domaine ▸ Maîtres d'opérations...
Domaines et approbations AD             → Domain Naming Master
   clic droit sur la racine ▸ Maître d'opérations...
Schéma Active Directory (snap-in MMC)   → Schema Master
   (necessite d'enregistrer schmmgmt.dll puis d'ajouter le composant dans une console MMC)</pre>
<h3>5. Transfert vs saisie</h3>
<p>Déplacer un rôle a deux formes très différentes :</p>
<pre class="pseudo">Transfert (transfer)  : les deux DC sont VIVANTS et communiquent → deplacement propre, sans risque
Saisie (seize)        : le DC titulaire est MORT et ne reviendra pas → on force la reprise du role</pre>
<div class="warn">La <strong>saisie</strong> (seize) est une opération d'urgence : à ne faire que si l'ancien titulaire ne reviendra jamais. Si le DC mort revenait avec son rôle, on aurait deux titulaires du même rôle : situation dangereuse. La saisie se fait via l'outil <strong>ntdsutil</strong>.</div>
<h3>6. Transférer un rôle par l'interface</h3>
<pre class="pseudo">1. Sur le DC qui doit RECEVOIR le role : ouvrir la console concernee (ex. ADUC)
2. D'abord « cibler » ce DC : clic droit sur la racine de la console ▸ Changer de contrôleur de domaine
   → choisir le DC destinataire
3. Clic droit sur le domaine ▸ Maîtres d'opérations... ▸ onglet du role (RID / PDC / Infrastructure)
4. Cliquer « Modifier » ▸ confirmer ▸ le role est transfere vers le DC cible</pre>
<h3>7. Bonnes pratiques</h3>
<p>Avant de <strong>rétrograder</strong> (démonter) un DC qui détient des rôles FSMO, il faut d'abord <strong>transférer</strong> ces rôles vers un autre DC sain. Sinon on se retrouve sans titulaire pour ces opérations.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie FSMO ?", opts: ["Fast Server Multi Option", "Flexible Single Master Operations", "File System Master Object", "Full Security Managed Object"], a: 1, exp: "Opérations à maître unique flottant : un seul DC par rôle, déplaçable." },
    { type: "qcm", q: "Combien de rôles FSMO existe-t-il ?", opts: ["3", "5", "7", "2"], a: 1, exp: "Cinq : 2 au niveau forêt, 3 au niveau domaine." },
    { type: "qcm", q: "Quels rôles existent au niveau de la forêt ?", opts: ["RID et PDC", "Schema Master et Domain Naming Master", "PDC et Infrastructure", "RID et Infrastructure"], a: 1, exp: "Un seul exemplaire de chacun pour toute la forêt." },
    { type: "qcm", q: "Quel rôle sert de source de temps et traite en priorité les changements de mot de passe ?", opts: ["RID Master", "PDC Emulator", "Schema Master", "Infrastructure Master"], a: 1, exp: "Le PDC Emulator, le plus visible au quotidien." },
    { type: "qcm", q: "Différence entre transfert et saisie d'un rôle ?", opts: ["Aucune", "Le transfert se fait entre DC vivants ; la saisie force la reprise quand le titulaire est mort", "La saisie est plus douce", "Le transfert est une urgence"], a: 1, exp: "Transfert = propre ; saisie (seize) = urgence." },
    { type: "qcm", q: "Avant de rétrograder un DC détenant des rôles FSMO, il faut…", opts: ["Redémarrer la box", "Transférer d'abord ses rôles vers un autre DC sain", "Supprimer le DNS", "Ne rien faire"], a: 1, exp: "Sinon plus personne ne détient ces rôles." },
    { type: "vf", q: "Le rôle Domain Naming Master gère l'ajout et la suppression de domaines dans la forêt.", a: true, exp: "C'est un rôle de niveau forêt." },
    { type: "vf", q: "La saisie (seize) d'un rôle est une opération de routine à faire souvent.", a: false, exp: "Non : c'est une urgence, uniquement si le titulaire est définitivement mort." },
    { type: "vf", q: "Le RID Master distribue des blocs d'identifiants nécessaires à la création d'objets uniques.", a: true, exp: "Les RID garantissent l'unicité des identifiants de sécurité." },
    { type: "input", q: "Quel sigle désigne l'ensemble de ces cinq rôles à maître unique ?", a: ["FSMO", "fsmo"], ph: "sigle", exp: "Flexible Single Master Operations." },
    { type: "input", q: "Quel rôle FSMO est aussi la référence de temps du domaine ? (nom)", a: ["PDC Emulator", "PDC", "pdc emulator", "pdc"], ph: "rôle", exp: "Le PDC Emulator." },
    { type: "input", q: "Dans quelle console voit-on les rôles RID, PDC et Infrastructure ? (sigle)", a: ["ADUC", "aduc"], ph: "sigle", exp: "Utilisateurs et ordinateurs AD ▸ Maîtres d'opérations." },
    { type: "input", q: "Quelle console gère le rôle Domain Naming Master ? (Domaines et …)", a: ["approbations", "Domaines et approbations", "Domaines et approbations Active Directory"], ph: "console", exp: "Domaines et approbations Active Directory." },
    { type: "input", q: "Quel outil en ligne de commande sert à saisir (seize) un rôle d'urgence ?", a: ["ntdsutil", "Ntdsutil"], ph: "outil", exp: "ntdsutil réalise la saisie de rôles." },
    { type: "input", q: "Quel intitulé du clic droit sur le domaine ouvre le transfert des rôles ? (Maîtres d'…)", a: ["opérations", "Maîtres d'opérations", "maitres d'operations", "Maîtres d'opérations..."], ph: "intitulé", exp: "Maîtres d'opérations..." }
  ],
  final: {
    title: "Exercice final — Déplacer le PDC Emulator avant maintenance",
    intro: `<p>Le DC nommé <strong>DC1</strong> détient tous les rôles FSMO et doit partir en maintenance longue. On veut transférer le rôle <strong>PDC Emulator</strong> vers <strong>DC2</strong> (les deux sont vivants). Réponds sur la démarche.</p>`,
    questions: [
      { type: "qcm", q: "Comme les deux DC sont vivants, on fait un…", opts: ["Transfert (transfer)", "Saisie (seize)", "Redémarrage", "Rien"], a: 0, exp: "Transfert propre entre DC vivants." },
      { type: "input", q: "Dans quelle console transfère-t-on le PDC Emulator ? (sigle)", a: ["ADUC", "aduc"], ph: "sigle", exp: "Utilisateurs et ordinateurs AD." },
      { type: "qcm", q: "Étape préalable dans la console ?", opts: ["Supprimer DC1", "Cibler DC2 via « Changer de contrôleur de domaine »", "Ouvrir le DNS", "Créer une GPO"], a: 1, exp: "La console doit pointer vers le DC destinataire avant le transfert." },
      { type: "input", q: "Quel intitulé du clic droit sur le domaine ouvre le transfert ? (Maîtres d'…)", a: ["opérations", "Maîtres d'opérations", "maitres d'operations"], ph: "intitulé", exp: "Maîtres d'opérations..." },
      { type: "vf", q: "Si DC1 était mort sans retour possible, il faudrait plutôt saisir (seize) le rôle via ntdsutil.", a: true, exp: "La saisie est réservée au cas où le titulaire ne revient pas." }
    ],
    solution: `<p>Marche à suivre (transfert propre) :</p>
<pre class="pseudo">1. Sur DC2 (ou depuis une console d'admin) : ouvrir Utilisateurs et ordinateurs AD (ADUC)
2. Clic droit sur la racine de la console ▸ Changer de contrôleur de domaine ▸ choisir DC2
3. Clic droit sur le domaine ▸ Maîtres d'opérations...
4. Onglet PDC ▸ vérifier que « Maître d'opérations actuel » = DC1 et destinataire = DC2
5. Cliquer « Modifier » ▸ confirmer le transfert ▸ le PDC Emulator passe sur DC2
6. Répéter pour RID et Infrastructure si besoin ; pour Domain Naming et Schema, utiliser
   Domaines et approbations AD et le composant Schéma Active Directory
7. DC1 peut alors partir en maintenance sans priver le domaine de ses rôles</pre>
<p>Toujours transférer (jamais saisir) tant que l'ancien titulaire est vivant. La saisie via ntdsutil reste l'ultime recours quand un DC titulaire est définitivement perdu.</p>`
  }
};
</script>
