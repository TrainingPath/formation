var DAY = {
  num: 6,
  title: "Le Centre d'administration AD (ADAC)",
  subtitle: "La console moderne : navigation par colonnes, recherche et corbeille AD.",
  theory: `
<h3>1. Qu'est-ce qu'ADAC ?</h3>
<p><strong>ADAC</strong> signifie « <strong>Active Directory Administrative Center</strong> », en français <strong>Centre d'administration Active Directory</strong>. C'est la console <strong>moderne</strong> introduite pour remplacer progressivement ADUC. Elle fait les mêmes choses (créer/gérer utilisateurs, groupes, OU) mais avec une présentation plus récente et quelques fonctions en plus. Analogie : ADUC est la vieille voiture fiable, ADAC est le modèle récent avec écran tactile — mêmes trajets, confort différent.</p>
<div class="tip">Bonne nouvelle : ADAC et ADUC agissent sur le MÊME annuaire. Un utilisateur créé dans l'un apparaît immédiatement dans l'autre. Tu peux donc utiliser celui que tu préfères.</div>
<h3>2. Ouvrir la console</h3>
<pre class="pseudo">Gestionnaire de serveur ▸ menu « Outils » ▸ « Centre d'administration Active Directory »</pre>
<p>Commande équivalente : <code>dsac.exe</code> (mais nous restons sur le menu graphique).</p>
<h3>3. La présentation : volet de navigation et liste</h3>
<p>ADAC affiche à gauche un <strong>volet de navigation</strong> (deux modes : vue <em>arborescence</em> ou vue <em>liste</em>) et, au centre, la <strong>liste des objets</strong> du conteneur choisi. Tout en haut se trouve un fil d'Ariane et une barre de recherche.</p>
<pre class="pseudo">Volet gauche            Zone centrale
  Aperçu                  ← liste des objets (utilisateurs, groupes, OU)
  entreprise (local)
    ├─ Users
    ├─ Computers
    └─ (tes OU)</pre>
<h3>4. Le volet « Tâches » à droite</h3>
<p>À droite s'affiche le <strong>volet Tâches</strong> : selon l'objet sélectionné, il propose les actions possibles (Nouveau, Réinitialiser le mot de passe, Désactiver, Déplacer, Supprimer, Propriétés). C'est l'équivalent du clic droit d'ADUC, mais toujours visible.</p>
<pre class="pseudo">ADAC ▸ sélectionner une OU ▸ volet Tâches ▸ Nouveau ▸ Utilisateur</pre>
<h3>5. La recherche globale</h3>
<p>ADAC possède une <strong>barre de recherche</strong> puissante en haut. On tape un nom, la liste se filtre instantanément. On peut aussi construire des critères (« Ajouter un critère ») pour, par exemple, lister tous les comptes désactivés.</p>
<h3>6. La Corbeille Active Directory : l'atout majeur d'ADAC</h3>
<p>La <strong>Corbeille AD</strong> (<em>Active Directory Recycle Bin</em>) permet de <strong>restaurer un objet supprimé</strong> (un utilisateur effacé par erreur) sans restaurer toute une sauvegarde. C'est LA fonction phare d'ADAC. Analogie : c'est la corbeille du Bureau de Windows, mais pour les comptes AD.</p>
<div class="warn">La Corbeille AD n'est PAS activée par défaut. Une fois activée, l'opération est <strong>irréversible</strong> (on ne peut plus la désactiver). Elle nécessite un niveau fonctionnel suffisant.</div>
<pre class="pseudo">Activer :  ADAC ▸ sélectionner le domaine (à droite, volet Tâches)
   ▸ « Activer la Corbeille… » ▸ confirmer (OK)
Restaurer :  ADAC ▸ conteneur « Deleted Objects »
   ▸ clic droit sur l'objet ▸ « Restaurer »   (revient à son emplacement d'origine)</pre>
<h3>7. Quand utiliser ADAC plutôt qu'ADUC ?</h3>
<p>Pour la restauration d'objets supprimés et pour l'historique des mots de passe finement gérés, ADAC est plus pratique. Pour un simple ajout d'utilisateur, les deux se valent. Beaucoup d'administrateurs gardent ADUC par habitude, mais ADAC est l'avenir.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie ADAC ?", opts: ["Active Directory Administrative Center", "Advanced Domain Access Control", "Active Data Archive Console", "Automatic Directory Admin Client"], a: 0, exp: "ADAC = Active Directory Administrative Center (Centre d'administration AD)." },
    { type: "qcm", q: "ADAC et ADUC agissent-ils sur le même annuaire ?", opts: ["Non, deux annuaires séparés", "Oui, le même annuaire : un objet créé dans l'un apparaît dans l'autre", "Seulement si on synchronise", "Uniquement le week-end"], a: 1, exp: "Les deux consoles pilotent le même annuaire AD." },
    { type: "qcm", q: "Quelle est la fonction phare d'ADAC absente d'ADUC classique ?", opts: ["Créer un utilisateur", "La Corbeille Active Directory (restaurer un objet supprimé)", "Renommer une OU", "Changer un mot de passe"], a: 1, exp: "La Corbeille AD, gérée depuis ADAC, restaure les objets supprimés." },
    { type: "qcm", q: "Où trouve-t-on les actions (Nouveau, Désactiver, Supprimer…) dans ADAC ?", opts: ["Dans le menu Fichier", "Dans le volet Tâches à droite", "Nulle part", "Dans la barre d'état"], a: 1, exp: "Le volet Tâches (à droite) liste les actions de l'objet sélectionné." },
    { type: "qcm", q: "La Corbeille AD est-elle activée par défaut ?", opts: ["Oui toujours", "Non, il faut l'activer, et c'est irréversible", "Seulement sur Server Core", "Elle n'existe pas"], a: 1, exp: "Elle n'est pas activée par défaut ; une fois activée, on ne peut plus la désactiver." },
    { type: "qcm", q: "Dans quel conteneur retrouve-t-on les objets supprimés à restaurer ?", opts: ["Users", "Deleted Objects", "Builtin", "Computers"], a: 1, exp: "Le conteneur « Deleted Objects » liste les objets supprimés récupérables." },
    { type: "vf", q: "Un utilisateur créé dans ADAC est visible aussi dans ADUC.", a: true, exp: "Les deux consoles partagent le même annuaire." },
    { type: "vf", q: "Une fois la Corbeille AD activée, on peut la désactiver quand on veut.", a: false, exp: "L'activation de la Corbeille AD est irréversible." },
    { type: "vf", q: "ADAC dispose d'une barre de recherche pour filtrer rapidement les objets.", a: true, exp: "La recherche globale filtre la liste instantanément et accepte des critères." },
    { type: "input", q: "Quel sigle désigne le Centre d'administration Active Directory ?", a: ["ADAC", "adac"], ph: "un sigle", exp: "ADAC = Active Directory Administrative Center." },
    { type: "input", q: "Comment appelle-t-on la fonction d'ADAC qui restaure un objet supprimé (deux mots) ?", a: ["Corbeille AD", "corbeille ad", "Corbeille Active Directory", "la corbeille"], ph: "deux mots", exp: "La Corbeille Active Directory (AD Recycle Bin)." },
    { type: "input", q: "Comment s'appelle le volet de droite d'ADAC qui liste les actions ?", a: ["Tâches", "tâches", "volet Tâches", "taches"], ph: "un mot", exp: "Le volet « Tâches » remplace le clic droit d'ADUC." },
    { type: "input", q: "Dans quel conteneur ADAC trouve-t-on les objets à restaurer ?", a: ["Deleted Objects", "deleted objects"], ph: "deux mots en anglais", exp: "Le conteneur Deleted Objects contient les objets supprimés." },
    { type: "input", q: "Quel exécutable lance ADAC depuis Exécuter ?", a: ["dsac.exe", "dsac", "DSAC.EXE"], ph: "un exécutable", exp: "dsac.exe ouvre le Centre d'administration AD." },
    { type: "qcm", q: "Pour créer un utilisateur dans ADAC, on sélectionne l'OU puis…", opts: ["on ferme la console", "volet Tâches ▸ Nouveau ▸ Utilisateur", "on redémarre", "on tape une commande DNS"], a: 1, exp: "Le volet Tâches propose Nouveau ▸ Utilisateur sur le conteneur choisi." }
  ],
  final: {
    title: "Exercice final — Activer la Corbeille et restaurer un compte",
    intro: `<p>Un collègue a supprimé par erreur le compte de Marie. Heureusement, tu avais activé la Corbeille AD dans ADAC. Décris comment tu aurais activé la corbeille, puis comment restaurer Marie.</p>`,
    questions: [
      { type: "input", q: "Quelle console (sigle) utilises-tu pour gérer la Corbeille AD ?", a: ["ADAC", "adac"], ph: "un sigle", exp: "ADAC gère l'activation et la restauration." },
      { type: "qcm", q: "Où cliques-tu pour activer la Corbeille AD ?", opts: ["Sur un utilisateur", "Sur le domaine, puis volet Tâches ▸ Activer la Corbeille", "Sur DNS", "Dans le pare-feu"], a: 1, exp: "On sélectionne le domaine et on choisit « Activer la Corbeille » dans les Tâches." },
      { type: "vf", q: "L'activation de la Corbeille AD est irréversible.", a: true, exp: "Une fois activée, elle ne peut plus être désactivée." },
      { type: "input", q: "Dans quel conteneur retrouves-tu le compte de Marie supprimé ?", a: ["Deleted Objects", "deleted objects"], ph: "deux mots", exp: "Le conteneur Deleted Objects." },
      { type: "qcm", q: "Quelle action restaure Marie à son emplacement d'origine ?", opts: ["Supprimer définitivement", "Clic droit sur l'objet ▸ Restaurer", "Renommer", "Désactiver"], a: 1, exp: "« Restaurer » remet l'objet dans son OU d'origine." }
    ],
    solution: `<p>Activer la Corbeille (à faire AVANT tout incident) :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Centre d'administration Active Directory (ADAC)
2. Sélectionner le domaine « entreprise (local) »
3. Volet Tâches (droite) ▸ « Activer la Corbeille… » ▸ OK ▸ OK
   (opération irréversible : la corbeille reste active pour toujours)</pre>
<p>Restaurer le compte de Marie :</p>
<pre class="pseudo">4. ADAC ▸ ouvrir le conteneur « Deleted Objects »
5. Repérer le compte « Marie » dans la liste
6. Clic droit ▸ « Restaurer »
7. Le compte revient dans son OU d'origine, avec ses attributs et son appartenance aux groupes
8. Vérifier dans ADUC ou ADAC que Marie est de nouveau présente et active</pre>
<p>Sans corbeille activée au préalable, il aurait fallu restaurer une sauvegarde complète : bien plus lourd.</p>`
  }
};
