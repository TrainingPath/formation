<script>
var DAY = {
  num: 4,
  title: "Promouvoir le contrôleur de domaine (assistant)",
  subtitle: "Créer réellement le domaine avec l'assistant de configuration, écran par écran.",
  theory: `
<h3>1. Promouvoir : de quoi parle-t-on ?</h3>
<p>Hier, on a <strong>ajouté</strong> le rôle AD DS (les meubles sont posés). Aujourd'hui, on <strong>promeut</strong> le serveur en <strong>contrôleur de domaine</strong> : c'est l'action qui <strong>crée réellement le domaine</strong> et démarre l'annuaire. Analogie : on <strong>ouvre enfin la boutique au public</strong>. Après cette étape, SRV-DC1 sera un vrai DC et le domaine existera.</p>
<h3>2. Lancer l'assistant de promotion</h3>
<pre class="pseudo">Gestionnaire de serveur ▸ icône drapeau jaune (haut) ▸ « Promouvoir ce serveur en contrôleur de domaine »</pre>
<p>L'<strong>Assistant Configuration des services de domaine Active Directory</strong> s'ouvre. Comme notre réseau part de zéro, nous allons créer une <strong>nouvelle forêt</strong>.</p>
<h3>3. Les écrans de l'assistant, un par un</h3>
<pre class="pseudo">Écran « Configuration de déploiement »
   ▸ choisir « Ajouter une nouvelle forêt »
   ▸ Nom de domaine racine : entreprise.local
   ▸ Suivant

Écran « Options du contrôleur de domaine »
   ▸ Niveau fonctionnel de la forêt / du domaine : laisser par défaut
   ▸ cocher « Serveur DNS » (il s'installe automatiquement)
   ▸ Serveur de catalogue global (GC) : déjà coché, laisser
   ▸ Saisir le mot de passe DSRM (mode restauration) ▸ Suivant

Écran « Options DNS »          ▸ avertissement délégation : ignorer ▸ Suivant
Écran « Options supplémentaires » ▸ Nom NetBIOS proposé : ENTREPRISE ▸ Suivant
Écran « Chemins d'accès »      ▸ dossiers de la base NTDS/SYSVOL : laisser par défaut ▸ Suivant
Écran « Examiner les options » ▸ vérifier le récapitulatif ▸ Suivant
Écran « Vérification de la configuration requise » ▸ « Réussie » ▸ « Installer »</pre>
<div class="warn">Le <strong>mot de passe DSRM</strong> (<em>Directory Services Restore Mode</em>, mode de restauration des services d'annuaire) est un mot de passe de secours utilisé pour réparer l'annuaire en cas de gros problème. Note-le précieusement : il est différent du mot de passe Administrateur.</div>
<div class="tip">Un <strong>niveau fonctionnel</strong> définit les fonctions AD disponibles selon la version de Windows Server la plus ancienne autorisée. Pour un domaine neuf, on laisse le niveau proposé par défaut.</div>
<h3>4. DNS : l'annuaire des noms</h3>
<p><strong>DNS</strong> (<em>Domain Name System</em>) est le service qui traduit les noms en adresses réseau (par exemple <code>srv-dc1.entreprise.local</code> → une adresse IP). AD en a <strong>absolument besoin</strong> : c'est grâce au DNS que les PC trouvent le contrôleur de domaine. L'assistant coche donc « Serveur DNS » et l'installe pour toi. Analogie : le DNS est le <strong>standard téléphonique</strong> qui sait quel numéro correspond à quel nom.</p>
<h3>5. Le redémarrage automatique</h3>
<p>À la fin, le serveur <strong>redémarre tout seul</strong>. Au retour, l'écran de connexion a changé : on n'ouvre plus une session locale, mais une session <strong>du domaine</strong> : <code>ENTREPRISE\\Administrateur</code>. Le domaine <code>entreprise.local</code> existe désormais.</p>
<pre class="pseudo">Avant :  SRV-DC1\Administrateur     (compte local)
Après :  ENTREPRISE\Administrateur  (compte du domaine)</pre>
<h3>6. Vérifier que tout marche</h3>
<p>Après redémarrage, de nouveaux outils apparaissent dans le menu <strong>Outils</strong> du Gestionnaire de serveur : ADUC, ADAC, DNS, Sites et services, etc. Leur présence confirme que la promotion a réussi.</p>
<pre class="pseudo">Gestionnaire de serveur ▸ menu « Outils » ▸ « Utilisateurs et ordinateurs Active Directory »</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait précisément la « promotion » ?", opts: ["Elle installe Windows", "Elle crée réellement le domaine et démarre l'annuaire", "Elle supprime le rôle AD DS", "Elle renomme le serveur"], a: 1, exp: "Promouvoir = transformer le serveur en contrôleur de domaine et créer le domaine." },
    { type: "qcm", q: "Notre réseau partant de zéro, quelle option choisit-on ?", opts: ["Ajouter un contrôleur à un domaine existant", "Ajouter un nouveau domaine à une forêt existante", "Ajouter une nouvelle forêt", "Rejoindre un groupe de travail"], a: 2, exp: "On crée une nouvelle forêt et son premier domaine." },
    { type: "qcm", q: "Quel service, indispensable à AD, l'assistant installe-t-il en même temps ?", opts: ["Serveur Web IIS", "Serveur DNS", "Serveur DHCP", "Hyper-V"], a: 1, exp: "Le DNS permet aux clients de trouver le contrôleur de domaine." },
    { type: "qcm", q: "À quoi sert le mot de passe DSRM ?", opts: ["À ouvrir la session quotidienne", "À réparer l'annuaire en mode restauration en cas de problème", "À sauvegarder l'annuaire chaque nuit", "À chiffrer les communications réseau"], a: 1, exp: "DSRM = mode de restauration des services d'annuaire, mot de passe de secours." },
    { type: "qcm", q: "Que se passe-t-il à la fin de l'assistant de promotion ?", opts: ["Rien", "Le serveur redémarre automatiquement", "Le serveur s'éteint définitivement", "Le rôle AD DS est désinstallé"], a: 1, exp: "Un redémarrage automatique termine la promotion." },
    { type: "qcm", q: "Après promotion, comment ouvre-t-on la session administrateur ?", opts: ["SRV-DC1\\Administrateur (local)", "ENTREPRISE\\Administrateur (domaine)", "invité", "sans mot de passe"], a: 1, exp: "On se connecte désormais avec le compte du domaine ENTREPRISE." },
    { type: "vf", q: "Le DNS est facultatif pour Active Directory.", a: false, exp: "AD dépend du DNS : sans lui, les clients ne trouvent pas le contrôleur de domaine." },
    { type: "vf", q: "Le mot de passe DSRM est le même que celui de l'Administrateur.", a: false, exp: "Ce sont deux mots de passe distincts : note bien le DSRM à part." },
    { type: "vf", q: "Après la promotion réussie, de nouveaux outils (ADUC, DNS…) apparaissent dans le menu Outils.", a: true, exp: "Leur présence confirme que la promotion s'est bien déroulée." },
    { type: "input", q: "Quel service traduit les noms (srv-dc1.entreprise.local) en adresses réseau (sigle 3 lettres) ?", a: ["DNS", "dns"], ph: "un sigle", exp: "DNS = Domain Name System, indispensable à AD." },
    { type: "input", q: "Quel sigle désigne le mode de restauration dont on saisit le mot de passe pendant la promotion ?", a: ["DSRM", "dsrm"], ph: "un sigle", exp: "DSRM = Directory Services Restore Mode." },
    { type: "input", q: "Dans notre exemple, quel est le nom de domaine racine créé ?", a: ["entreprise.local", "ENTREPRISE.LOCAL", "entreprise .local"], ph: "un nom de domaine", exp: "On saisit entreprise.local comme nom de domaine racine." },
    { type: "input", q: "Quel nom court (NetBIOS) l'assistant propose-t-il pour entreprise.local ?", a: ["ENTREPRISE", "entreprise"], ph: "un mot", exp: "Le nom NetBIOS proposé est ENTREPRISE (préfixe du domaine)." },
    { type: "input", q: "Comment appelle-t-on la valeur qui fixe les fonctions AD selon la plus ancienne version autorisée (deux mots) ?", a: ["niveau fonctionnel", "le niveau fonctionnel"], ph: "deux mots", exp: "Le niveau fonctionnel de la forêt/du domaine." },
    { type: "qcm", q: "Depuis quel menu du Gestionnaire de serveur ouvre-t-on ADUC après la promotion ?", opts: ["Fichier", "Outils", "Gérer", "Affichage"], a: 1, exp: "Le menu « Outils » liste les consoles d'administration, dont ADUC." }
  ],
  final: {
    title: "Exercice final — Créer le domaine entreprise.local",
    intro: `<p>Le rôle AD DS est installé sur SRV-DC1. Tu lances la promotion pour créer une nouvelle forêt et le domaine <code>entreprise.local</code>. Décris tes choix écran par écran.</p>`,
    questions: [
      { type: "input", q: "Sur quelle icône du Gestionnaire de serveur cliques-tu pour trouver le lien de promotion ?", a: ["drapeau", "le drapeau", "drapeau jaune"], ph: "un mot", exp: "Le drapeau jaune contient « Promouvoir ce serveur en contrôleur de domaine »." },
      { type: "qcm", q: "Sur « Configuration de déploiement », tu choisis…", opts: ["Ajouter un contrôleur à un domaine existant", "Ajouter une nouvelle forêt et saisis entreprise.local", "Rejoindre un groupe de travail", "Supprimer AD"], a: 1, exp: "Nouvelle forêt car le réseau part de zéro." },
      { type: "vf", q: "Tu dois définir un mot de passe DSRM pendant l'assistant.", a: true, exp: "Il est demandé sur l'écran « Options du contrôleur de domaine »." },
      { type: "input", q: "Quel service coché s'installe automatiquement avec le DC (sigle) ?", a: ["DNS", "dns"], ph: "un sigle", exp: "Le serveur DNS est installé en même temps." },
      { type: "qcm", q: "Que se passe-t-il après avoir cliqué « Installer » ?", opts: ["Rien", "Le serveur redémarre automatiquement et le domaine existe", "Le rôle DNS est retiré", "Il faut tout recommencer"], a: 1, exp: "Redémarrage automatique, puis session ENTREPRISE\\Administrateur." }
    ],
    solution: `<p>Marche à suivre pour promouvoir SRV-DC1 :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ drapeau jaune ▸ « Promouvoir ce serveur en contrôleur de domaine »
2. Configuration de déploiement ▸ « Ajouter une nouvelle forêt »
   ▸ Nom de domaine racine : entreprise.local ▸ Suivant
3. Options du DC ▸ laisser les niveaux fonctionnels par défaut
   ▸ cocher « Serveur DNS » ▸ saisir le mot de passe DSRM ▸ Suivant
4. Options DNS ▸ ignorer l'avertissement délégation ▸ Suivant
5. Options supplémentaires ▸ nom NetBIOS ENTREPRISE ▸ Suivant
6. Chemins d'accès ▸ laisser par défaut ▸ Suivant
7. Examiner les options ▸ Suivant
8. Vérification ▸ « Réussie » ▸ « Installer »
9. Attendre le redémarrage automatique
10. Ouvrir une session : ENTREPRISE\Administrateur ▸ vérifier menu Outils ▸ ADUC présent</pre>
<p>Le domaine entreprise.local est créé, SRV-DC1 est désormais contrôleur de domaine.</p>`
  }
};
</script>

<script>

    solution: "1. Gestionnaire de serveur ▸ cliquer sur le drapeau d'alerte jaune (haut).\n2. Cliquer « Promouvoir ce serveur en controleur de domaine ». L'Assistant Configuration des services de domaine AD s'ouvre.\n3. Ecran « Configuration de deploiement » ▸ selectionner « Ajouter une nouvelle foret ».\n4. Champ « Nom de domaine racine » ▸ saisir entreprise.local ▸ Suivant.\n5. Ecran « Options du controleur de domaine » ▸ laisser les niveaux fonctionnels par defaut ; verifier que « Serveur DNS » et « Catalogue global » sont coches ; saisir et confirmer le mot de passe DSRM ▸ Suivant.\n6. Ecran « Options DNS » ▸ ignorer l'avertissement de delegation ▸ Suivant.\n7. Ecran « Options supplementaires » ▸ verifier le nom NetBIOS ENTREPRISE ▸ Suivant.\n8. Ecran « Chemins d'acces » ▸ laisser les dossiers NTDS/SYSVOL par defaut ▸ Suivant.\n9. Ecran « Examiner les options » ▸ verifier le recapitulatif ▸ Suivant.\n10. Ecran « Verification de la configuration requise » ▸ attendre « Toutes les verifications ont reussi » ▸ cliquer « Installer ».\n11. Le serveur redemarre automatiquement. Rouvrir une session avec ENTREPRISE\\Administrateur.\n12. Verifier dans le menu Outils la presence de ADUC, ADAC et DNS : la promotion a reussi.",
    checklist: ["Après redémarrage, le menu Outils propose-t-il ADUC, ADAC et DNS (preuve que la promotion a réussi) ?", "As-tu choisi « Ajouter une nouvelle forêt » avec le domaine racine entreprise.local ?", "As-tu défini le mot de passe DSRM et laissé cochés Serveur DNS et Catalogue global ?", "Peux-tu ouvrir une session avec le compte ENTREPRISE\\Administrateur ?"],
