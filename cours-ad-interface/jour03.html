<script>
var DAY = {
  num: 3,
  title: "Ajouter le rôle AD DS (assistant)",
  subtitle: "Installer les services de domaine avec l'assistant graphique, écran par écran.",
  theory: `
<h3>1. Que va-t-on faire aujourd'hui ?</h3>
<p>Installer Active Directory se déroule en <strong>deux temps</strong> distincts qu'il ne faut pas confondre :</p>
<pre class="pseudo">Étape A (JOUR 3) : AJOUTER le rôle AD DS      → on installe les fichiers du service
Étape B (JOUR 4) : PROMOUVOIR le serveur     → on crée réellement le domaine</pre>
<p>Aujourd'hui, on fait seulement l'étape A : on <strong>ajoute le rôle</strong> AD DS. C'est comme <strong>livrer et poser les meubles d'une boutique</strong> ; ouvrir la boutique au public (créer le domaine) viendra demain.</p>
<h3>2. Lancer l'assistant</h3>
<p>Un <strong>assistant</strong> (en anglais <em>wizard</em>) est une suite d'écrans qui te guident bouton « Suivant » après bouton « Suivant ». On lance celui de l'ajout de rôle depuis le tableau de bord :</p>
<pre class="pseudo">Gestionnaire de serveur ▸ menu « Gérer » (haut à droite) ▸ « Ajouter des rôles et fonctionnalités »</pre>
<h3>3. Les écrans de l'assistant, un par un</h3>
<p>Voici précisément ce que tu vois et ce que tu cliques :</p>
<pre class="pseudo">Écran « Avant de commencer »        ▸ Suivant
Écran « Type d'installation »       ▸ cocher « Installation basée sur un rôle ou une fonctionnalité » ▸ Suivant
Écran « Sélection du serveur »      ▸ choisir SRV-DC1 dans la liste ▸ Suivant
Écran « Rôles de serveurs »         ▸ COCHER « Services AD DS » (Active Directory Domain Services)
      → une fenêtre surgit : « Ajouter les fonctionnalités requises ? » ▸ cliquer « Ajouter des fonctionnalités »
      ▸ Suivant
Écran « Fonctionnalités »           ▸ ne rien changer ▸ Suivant
Écran « AD DS » (page d'info)       ▸ lire ▸ Suivant
Écran « Confirmation »              ▸ (facultatif) cocher redémarrage auto ▸ « Installer »
Écran « Résultats »                 ▸ attendre « Installation réussie » ▸ Fermer</pre>
<div class="warn">Quand tu coches « Services AD DS », Windows demande d'ajouter des <strong>fonctionnalités requises</strong> (des outils d'administration nécessaires). Accepte en cliquant « Ajouter des fonctionnalités » : sans elles, le rôle ne peut pas fonctionner.</div>
<h3>4. Le drapeau d'alerte jaune</h3>
<p>Une fois le rôle installé, un petit <strong>drapeau</strong> avec un triangle d'avertissement jaune apparaît en haut du Gestionnaire de serveur. En cliquant dessus, tu lis un message : <em>« Configuration post-déploiement — Promouvoir ce serveur en contrôleur de domaine »</em>. C'est le pont vers l'étape B (jour 4).</p>
<pre class="pseudo">Gestionnaire de serveur ▸ icône drapeau (haut) ▸ « Promouvoir ce serveur en contrôleur de domaine »</pre>
<div class="tip">Important : à la fin du jour 3, AD n'est PAS encore actif. Les fichiers du rôle sont posés, mais aucun domaine n'existe. C'est normal : on ne clique PAS encore sur « Promouvoir » aujourd'hui.</div>
<h3>5. Vérifier que le rôle est bien là</h3>
<p>Dans le volet gauche du Gestionnaire de serveur, une nouvelle entrée <strong>AD DS</strong> apparaît. Elle prouve que le rôle est installé. Tant qu'on n'a pas promu le serveur, cette page affichera surtout des avertissements : c'est attendu.</p>`,
  exercises: [
    { type: "qcm", q: "Que fait-on précisément au jour 3 ?", opts: ["On crée le domaine", "On ajoute (installe) le rôle AD DS", "On crée des utilisateurs", "On joint un PC au domaine"], a: 1, exp: "Jour 3 = ajouter le rôle. La création du domaine (promotion) est au jour 4." },
    { type: "qcm", q: "Par quel menu lance-t-on l'assistant d'ajout de rôle ?", opts: ["Fichier ▸ Nouveau", "Gérer ▸ Ajouter des rôles et fonctionnalités", "Outils ▸ Services", "Aide ▸ À propos"], a: 1, exp: "Le menu « Gérer » du Gestionnaire de serveur lance l'assistant." },
    { type: "qcm", q: "Quel type d'installation coche-t-on dans l'assistant ?", opts: ["Installation des services Bureau à distance", "Installation basée sur un rôle ou une fonctionnalité", "Installation réseau", "Installation minimale"], a: 1, exp: "On choisit l'installation basée sur un rôle ou une fonctionnalité." },
    { type: "qcm", q: "Quel rôle coche-t-on précisément ?", opts: ["Serveur DHCP", "Services AD DS", "Serveur Web (IIS)", "Hyper-V"], a: 1, exp: "Services AD DS = Active Directory Domain Services." },
    { type: "qcm", q: "Quand une fenêtre propose « Ajouter les fonctionnalités requises ? », que faut-il faire ?", opts: ["Annuler", "Cliquer « Ajouter des fonctionnalités »", "Fermer l'assistant", "Redémarrer"], a: 1, exp: "Ces fonctionnalités (outils d'administration) sont indispensables au rôle." },
    { type: "qcm", q: "Après l'installation du rôle, quel indicateur apparaît en haut du Gestionnaire de serveur ?", opts: ["Une croix rouge", "Un drapeau d'alerte jaune proposant de promouvoir le serveur", "Un cadenas vert", "Rien du tout"], a: 1, exp: "Le drapeau jaune propose la configuration post-déploiement (promotion)." },
    { type: "vf", q: "À la fin du jour 3, le domaine est déjà créé et opérationnel.", a: false, exp: "Le rôle est installé, mais le domaine n'existe qu'après la promotion (jour 4)." },
    { type: "vf", q: "Ajouter le rôle AD DS et promouvoir le contrôleur de domaine sont deux étapes distinctes.", a: true, exp: "Étape A (ajouter le rôle) puis étape B (promouvoir)." },
    { type: "vf", q: "Une entrée « AD DS » apparaît dans le volet gauche du Gestionnaire de serveur après l'installation du rôle.", a: true, exp: "Cette entrée confirme la présence du rôle." },
    { type: "input", q: "Quel sigle désigne le rôle « services de domaine Active Directory » ?", a: ["AD DS", "ADDS", "ad ds", "adds"], ph: "un sigle", exp: "AD DS = Active Directory Domain Services." },
    { type: "input", q: "Comment appelle-t-on une suite d'écrans « Suivant / Suivant » qui guide l'installation (un mot) ?", a: ["assistant", "un assistant", "wizard"], ph: "un mot", exp: "Un assistant (wizard) guide l'utilisateur écran par écran." },
    { type: "input", q: "Sur quel serveur coche-t-on l'installation, dans notre exemple (nom) ?", a: ["SRV-DC1", "srv-dc1"], ph: "un nom", exp: "On sélectionne SRV-DC1 dans la liste de l'écran « Sélection du serveur »." },
    { type: "input", q: "Quel mot désigne la petite icône d'alerte qui propose de promouvoir le serveur ?", a: ["drapeau", "le drapeau", "drapeau jaune"], ph: "un mot", exp: "Le drapeau d'alerte jaune contient le lien de promotion." },
    { type: "input", q: "Quel bouton clique-t-on sur l'écran « Confirmation » pour lancer l'installation ?", a: ["Installer", "installer"], ph: "un mot", exp: "Le bouton « Installer » démarre la pose des fichiers du rôle." },
    { type: "qcm", q: "Sur l'écran « Sélection du serveur », que choisit-on ?", opts: ["Un serveur au hasard", "Le serveur local SRV-DC1 dans le pool de serveurs", "Un serveur distant inconnu", "Aucun serveur"], a: 1, exp: "On sélectionne SRV-DC1, le serveur que l'on veut équiper du rôle." }
  ],
  final: {
    title: "Exercice final — Installer le rôle sur SRV-DC1",
    intro: `<p>SRV-DC1 est renommé et prêt. Tu ouvres le Gestionnaire de serveur pour ajouter le rôle AD DS. Décris tes choix écran par écran, sans lancer la promotion.</p>`,
    questions: [
      { type: "input", q: "Depuis quel menu (un mot) lances-tu l'assistant d'ajout de rôle ?", a: ["Gérer", "gérer", "gerer"], ph: "un mot", exp: "Menu « Gérer » ▸ « Ajouter des rôles et fonctionnalités »." },
      { type: "qcm", q: "Sur l'écran des rôles, tu coches…", opts: ["Serveur DNS uniquement", "Services AD DS (les outils requis s'ajoutent automatiquement)", "Hyper-V", "Rien"], a: 1, exp: "Cocher AD DS déclenche l'ajout des fonctionnalités requises." },
      { type: "vf", q: "Tu dois accepter d'ajouter les fonctionnalités requises pour continuer.", a: true, exp: "Sans les outils d'administration, le rôle ne fonctionne pas." },
      { type: "input", q: "Quel bouton termine l'installation sur l'écran de Confirmation ?", a: ["Installer", "installer"], ph: "un mot", exp: "« Installer » lance la copie des fichiers du rôle." },
      { type: "qcm", q: "Une fois l'installation réussie, que NE fais-tu PAS encore aujourd'hui ?", opts: ["Fermer l'assistant", "Cliquer sur « Promouvoir ce serveur en contrôleur de domaine »", "Lire le résultat", "Vérifier l'entrée AD DS"], a: 1, exp: "La promotion, c'est le jour 4. Aujourd'hui on s'arrête au rôle installé." }
    ],
    solution: `<p>Marche à suivre pour ajouter le rôle AD DS :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Gérer ▸ Ajouter des rôles et fonctionnalités
2. « Avant de commencer » ▸ Suivant
3. Type d'installation ▸ « Installation basée sur un rôle ou une fonctionnalité » ▸ Suivant
4. Sélection du serveur ▸ SRV-DC1 ▸ Suivant
5. Rôles ▸ cocher « Services AD DS »
6. Fenêtre surgissante ▸ « Ajouter des fonctionnalités » ▸ Suivant
7. Fonctionnalités ▸ Suivant   |   page AD DS ▸ Suivant
8. Confirmation ▸ « Installer »
9. Résultats ▸ attendre « Installation réussie » ▸ Fermer
10. STOP : ne pas cliquer « Promouvoir » (ce sera le jour 4)</pre>
<p>Le drapeau jaune apparaît en haut : il est là pour demain. Le rôle est posé, mais aucun domaine n'existe encore.</p>`
  }
};
</script>
