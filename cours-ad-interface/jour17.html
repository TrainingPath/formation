var DAY = {
  num: 17,
  title: "Créer et lier une GPO",
  subtitle: "Distribuer des réglages à des centaines de postes depuis une seule console.",
  theory: `
<h3>1. Qu'est-ce qu'une GPO ?</h3>
<p>Une <strong>GPO</strong> (Group Policy Object, en français « objet de stratégie de groupe ») est un ensemble de réglages que le domaine applique automatiquement à des ordinateurs ou à des utilisateurs. Au lieu de configurer chaque poste à la main, tu écris la règle <strong>une seule fois</strong> dans une GPO, et Active Directory la distribue à tous les postes concernés. Exemple : « le fond d'écran de l'entreprise partout » ou « interdire le Panneau de configuration ».</p>
<p>Une GPO contient deux parties : la partie <strong>Configuration ordinateur</strong> (réglages liés à la machine, appliqués au démarrage) et la partie <strong>Configuration utilisateur</strong> (réglages liés à la personne, appliqués à l'ouverture de session).</p>
<h3>2. La console GPMC</h3>
<p>On gère les GPO avec la console <strong>GPMC</strong> (Group Policy Management Console, « Gestion des stratégies de groupe »). C'est la fenêtre officielle pour créer, lier et modifier les GPO. On l'ouvre depuis le <strong>Gestionnaire de serveur ▸ Outils ▸ Gestion des stratégies de groupe</strong>.</p>
<pre class="pseudo">Gestionnaire de serveur ▸ menu Outils ▸ Gestion des stratégies de groupe   // ouvre la console GPMC
Forêt ▸ Domaines ▸ nom-du-domaine ▸ Objets de stratégie de groupe          // le dossier qui liste toutes les GPO</pre>
<h3>3. Créer une GPO puis la lier</h3>
<p>Créer une GPO et la <strong>lier</strong> sont deux actions distinctes. Créer, c'est fabriquer l'objet ; <strong>lier</strong> (link), c'est l'accrocher à un emplacement (le domaine, un site ou une OU) pour qu'il s'y applique. Une GPO non liée existe mais ne fait rien.</p>
<pre class="pseudo">GPMC ▸ clic droit sur « Objets de stratégie de groupe » ▸ Nouveau   // cree une GPO vide
   → saisir un nom clair, ex. « Securite-Postes »                 // le nom doit parler
GPMC ▸ clic droit sur l'OU voulue ▸ Lier un objet de stratégie de groupe existant   // rattache la GPO a l'OU
   → choisir « Securite-Postes » dans la liste ▸ OK              // le lien apparait sous l'OU</pre>
<div class="tip">Raccourci fréquent : <strong>clic droit sur l'OU ▸ Créer un objet GPO dans ce domaine et le lier ici</strong>. En une seule étape, la GPO est créée ET liée à l'OU.</div>
<h3>4. Où lier ? (domaine, site, OU)</h3>
<p>Une GPO se lie à trois types d'emplacements : un <strong>site</strong> (zone géographique du réseau), le <strong>domaine</strong> entier, ou une <strong>OU</strong> (Organizational Unit, « unité d'organisation » : un dossier qui range les objets AD). Les réglages descendent en cascade : ce qui est lié au domaine touche tout le monde, ce qui est lié à une OU ne touche que son contenu.</p>
<div class="warn">Ne modifie jamais à la légère la GPO nommée <strong>Default Domain Policy</strong> liée au domaine : elle porte des réglages critiques (dont la stratégie de mot de passe). Pour tes réglages, crée toujours une <strong>nouvelle</strong> GPO.</div>
<h3>5. Modifier le contenu d'une GPO</h3>
<p>Pour éditer les réglages, on ouvre l'<strong>Éditeur de gestion des stratégies de groupe</strong> (Group Policy Management Editor). On y navigue dans une arborescence de dossiers jusqu'au paramètre voulu.</p>
<pre class="pseudo">GPMC ▸ clic droit sur la GPO ▸ Modifier                 // ouvre l'editeur de la GPO
Editeur ▸ Configuration ordinateur ▸ Strategies         // reglages cote machine
Editeur ▸ Configuration utilisateur ▸ Strategies        // reglages cote utilisateur
   → double-clic sur un parametre ▸ Activé / Désactivé ▸ OK   // on definit la valeur</pre>
<h3>6. Quand la GPO s'applique-t-elle ?</h3>
<p>Les GPO ne s'appliquent pas instantanément : le poste les rafraîchit à intervalle régulier (environ toutes les 90 minutes) et au démarrage / à l'ouverture de session. Pour forcer tout de suite, on tape la commande <code>gpupdate /force</code> sur le poste, mais l'essentiel du travail se fait bien à la souris dans la GPMC.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle GPO ?", opts: ["Group Policy Object (objet de stratégie de groupe)", "General Public Option", "Global Partition Order", "Group Password Object"], a: 0, exp: "Une GPO est un paquet de réglages distribués par le domaine." },
    { type: "qcm", q: "Quelle console sert à gérer les GPO ?", opts: ["Utilisateurs et ordinateurs AD", "GPMC (Gestion des stratégies de groupe)", "DNS Manager", "Gestionnaire de disques"], a: 1, exp: "La GPMC est la console dédiée aux stratégies de groupe." },
    { type: "qcm", q: "Une GPO créée mais NON liée…", opts: ["S'applique à tout le domaine", "Ne s'applique à rien tant qu'elle n'est pas liée", "Supprime les autres GPO", "Provoque une erreur"], a: 1, exp: "Créer et lier sont deux actions : sans lien, la GPO reste inactive." },
    { type: "qcm", q: "À quels emplacements peut-on lier une GPO ?", opts: ["Uniquement au domaine", "Site, domaine ou OU", "Uniquement à une OU", "À un utilisateur unique"], a: 1, exp: "Les trois niveaux classiques : site, domaine, OU." },
    { type: "qcm", q: "Que ne faut-il PAS modifier à la légère ?", opts: ["Une GPO de test", "La Default Domain Policy", "Une OU vide", "Le nom du serveur"], a: 1, exp: "Elle porte des réglages critiques du domaine, dont les mots de passe." },
    { type: "qcm", q: "Le raccourci « Créer un objet GPO dans ce domaine et le lier ici » fait…", opts: ["Seulement créer la GPO", "Créer ET lier la GPO en une étape", "Supprimer la GPO", "Copier une GPO existante"], a: 1, exp: "Deux actions combinées : gain de temps sur une OU." },
    { type: "vf", q: "Une GPO contient une Configuration ordinateur et une Configuration utilisateur.", a: true, exp: "Deux volets : réglages machine (au démarrage) et réglages utilisateur (à l'ouverture de session)." },
    { type: "vf", q: "Une GPO liée au domaine ne touche qu'un seul ordinateur.", a: false, exp: "Liée au domaine, elle concerne potentiellement tous les objets du domaine." },
    { type: "vf", q: "Les GPO se rafraîchissent automatiquement à intervalle régulier sur les postes.", a: true, exp: "Environ toutes les 90 minutes, plus au démarrage et à l'ouverture de session." },
    { type: "input", q: "Quel est le sigle (3 lettres) de la console de gestion des stratégies de groupe ?", a: ["GPMC", "gpmc"], ph: "sigle", exp: "Group Policy Management Console." },
    { type: "input", q: "Quel mot anglais désigne l'action d'accrocher une GPO à une OU ? (verbe)", a: ["lier", "link", "lien"], ph: "verbe", exp: "Lier (to link) : rattacher la GPO à un emplacement." },
    { type: "input", q: "Comment s'appelle le dossier de la GPMC qui liste TOUTES les GPO du domaine ?", a: ["Objets de stratégie de groupe", "objets de strategie de groupe"], ph: "nom du dossier", exp: "C'est là qu'on crée une nouvelle GPO." },
    { type: "input", q: "Quel élément de menu du clic droit ouvre le contenu d'une GPO pour l'éditer ?", a: ["Modifier", "modifier"], ph: "action du menu", exp: "Clic droit sur la GPO ▸ Modifier ouvre l'éditeur." },
    { type: "input", q: "Quelle commande, tapée sur un poste, force le rafraîchissement immédiat des GPO ?", a: ["gpupdate /force", "gpupdate", "gpupdate/force"], ph: "commande", exp: "gpupdate /force applique les stratégies sans attendre le cycle normal." },
    { type: "input", q: "Comment nomme-t-on le type de dossier AD (sigle OU) auquel on lie souvent une GPO ?", a: ["OU", "ou", "unité d'organisation", "unite d'organisation"], ph: "sigle ou nom", exp: "OU = Organizational Unit, l'unité d'organisation." }
  ],
  final: {
    title: "Exercice final — Une GPO pour le service Comptabilité",
    intro: `<p>On veut appliquer un réglage uniquement aux postes du service <strong>Comptabilité</strong>, dont les objets sont rangés dans l'OU <code>Comptabilite</code>. Réponds aux questions sur la démarche dans la GPMC.</p>`,
    questions: [
      { type: "qcm", q: "Première étape logique dans la GPMC ?", opts: ["Ouvrir le DNS", "Créer une nouvelle GPO (ou clic droit sur l'OU ▸ Créer et lier ici)", "Redémarrer le serveur", "Supprimer la Default Domain Policy"], a: 1, exp: "On fabrique la GPO avant de la remplir." },
      { type: "qcm", q: "Pour que la GPO ne touche QUE la Comptabilité, on la lie…", opts: ["Au domaine entier", "À l'OU Comptabilite", "À un site", "À aucun endroit"], a: 1, exp: "Lier à l'OU cible limite la portée au contenu de cette OU." },
      { type: "input", q: "Quel élément du menu clic droit sur la GPO ouvre l'éditeur pour la remplir ?", a: ["Modifier", "modifier"], ph: "action", exp: "Clic droit ▸ Modifier ouvre l'Éditeur de gestion des stratégies de groupe." },
      { type: "vf", q: "Modifier la Default Domain Policy serait le bon choix ici.", a: false, exp: "Non : elle est globale et critique. On crée une GPO dédiée." },
      { type: "input", q: "Après édition, quelle commande sur un poste comptable vérifie l'application immédiate ?", a: ["gpupdate /force", "gpupdate"], ph: "commande", exp: "gpupdate /force force le rafraîchissement." }
    ],
    solution: `<p>Marche à suivre complète :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Gestion des stratégies de groupe   // ouvrir GPMC
2. Forêt ▸ Domaines ▸ mondomaine.local ▸ OU Comptabilite                // atteindre l'OU cible
3. Clic droit sur l'OU Comptabilite ▸ Créer un objet GPO dans ce domaine et le lier ici
4. Nommer la GPO, ex. « Comptabilite-Reglages » ▸ OK                     // GPO creee ET liee
5. Clic droit sur la nouvelle GPO ▸ Modifier                            // ouvrir l'editeur
6. Definir les parametres voulus ▸ fermer l'editeur                     // les reglages sont enregistres
7. Sur un poste comptable : gpupdate /force                             // appliquer sans attendre</pre>
<p>La GPO n'agit que sur les objets rangés dans l'OU Comptabilite : portée maîtrisée, domaine préservé.</p>`
  }
};
