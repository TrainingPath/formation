<script>
var DAY = {
  num: 30,
  title: "Projet guidé : monter un domaine d'entreprise",
  subtitle: "Assembler tout le cours pour bâtir un domaine complet, étape par étape.",
  theory: `
<h3>1. Le scénario</h3>
<p>La société fictive <strong>Fabritek</strong> emménage. On te confie le montage de son domaine <code>fabritek.local</code>. Objectif : une structure propre, des utilisateurs et groupes par service, et des GPO de sécurité. Ce projet réutilise tout ce qu'on a vu du jour 17 au jour 29.</p>
<div class="tip">Fil rouge : d'abord la <strong>structure</strong> (OU), puis les <strong>objets</strong> (utilisateurs, groupes), puis les <strong>règles</strong> (GPO), enfin la <strong>vérification</strong>. On construit du plus stable vers le plus mouvant.</div>
<h3>2. Étape A — La structure d'OU par service</h3>
<p>On crée une OU racine <code>Fabritek</code>, puis une sous-OU par service. Ranger par service facilite la délégation et le ciblage des GPO.</p>
<pre class="pseudo">ADUC ▸ clic droit sur le domaine ▸ Nouveau ▸ Unité d'organisation ▸ « Fabritek »
   → sous Fabritek, créer : Comptabilite, Ventes, RH, IT
   → dans chaque OU, prevoir des sous-OU Utilisateurs et Ordinateurs si besoin</pre>
<div class="tip">Coche « Protéger le conteneur contre une suppression accidentelle » à la création d'une OU : un garde-fou activé par défaut, très utile.</div>
<h3>3. Étape B — Les utilisateurs</h3>
<p>On crée un compte par personne, dans l'OU de son service.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU Ventes ▸ Nouveau ▸ Utilisateur
   Prénom / Nom / Nom d'ouverture de session : p.durand
   Mot de passe initial + cocher « L'utilisateur doit changer... a la prochaine ouverture »
   ▸ Terminer</pre>
<h3>4. Étape C — Les groupes</h3>
<p>On crée un <strong>groupe de sécurité</strong> par service pour gérer les droits collectivement (un groupe = un ensemble de comptes qu'on autorise d'un bloc). On y place les utilisateurs concernés.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU voulue ▸ Nouveau ▸ Groupe
   Nom : GRP-Ventes ▸ Étendue : Globale ▸ Type : Sécurité ▸ OK
   ▸ Propriétés du groupe ▸ onglet Membres ▸ Ajouter ▸ les utilisateurs de Ventes</pre>
<div class="tip">Convention utile (AGDLP) : placer les comptes dans des groupes <strong>Globaux</strong> (par service), puis accorder les droits à des groupes de <strong>Domaine Local</strong> sur les ressources. Pour ce projet, un groupe global par service suffit.</div>
<h3>5. Étape D — Les GPO de sécurité</h3>
<p>On applique des règles de sécurité. Certaines valent pour tout le monde (au domaine), d'autres par service (à l'OU).</p>
<pre class="pseudo">Mots de passe (tout le domaine) :
   GPMC ▸ Default Domain Policy ▸ Modifier ▸ Strategies de comptes ▸ Strategie de mot de passe
   → longueur 12, complexite Activé, verrouillage a 5

Restrictions Comptabilite :
   GPMC ▸ clic droit OU Comptabilite ▸ Créer un objet GPO et le lier ici ▸ « SEC-Compta »
   ▸ Modifier ▸ Config utilisateur ▸ Modèles d'administration ▸ Panneau de configuration
      → « Interdire l'accès au Panneau de configuration » ▸ Activé

Lecteur commun Ventes :
   GPMC ▸ OU Ventes ▸ nouvelle GPO « Ventes-Lecteur » ▸ Préférences ▸ Mappages de lecteurs
      → Créer V: vers \\SRV1\Ventes (ciblage sur GRP-Ventes)</pre>
<h3>6. Étape E — Délégation</h3>
<p>Pour soulager l'IT, on délègue au groupe <strong>Helpdesk</strong> la réinitialisation des mots de passe, sur l'OU racine Fabritek.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU Fabritek ▸ Déléguer le contrôle...
   ▸ ajouter Helpdesk ▸ tâche « Réinitialiser les mots de passe utilisateur » ▸ Terminer</pre>
<h3>7. Étape F — Filet de sécurité</h3>
<pre class="pseudo">ADAC ▸ domaine ▸ Activer la Corbeille...              // recuperation rapide des suppressions
Sauvegarde Windows Server ▸ Planifier ▸ État du système   // sauvegarde quotidienne d'AD</pre>
<h3>8. Étape G — Vérification</h3>
<p>On valide que tout s'applique : <code>gpupdate /force</code> sur un poste, puis <code>gpresult /r</code> ou l'assistant Résultats de stratégie de groupe ; un test de connexion par service ; <code>repadmin /replsummary</code> si plusieurs DC. Le domaine Fabritek est prêt.</p>
<div class="warn">Ne teste jamais des restrictions fortes directement sur ton propre compte admin : crée un compte de test dans l'OU concernée, sinon tu risques de te bloquer toi-même.</div>`,
  exercises: [
    { type: "qcm", q: "Dans quel ordre monte-t-on logiquement le domaine ?", opts: ["GPO, puis OU, puis utilisateurs", "Structure (OU), puis objets (utilisateurs/groupes), puis règles (GPO), puis vérification", "Sauvegarde d'abord, structure jamais", "Au hasard"], a: 1, exp: "Du plus stable (structure) au plus mouvant (règles), puis contrôle." },
    { type: "qcm", q: "Pourquoi ranger les objets par OU de service ?", opts: ["Pour améliorer l'esthétique de la console", "Pour faciliter la délégation et le ciblage des GPO", "Pour réduire le nombre d'objets AD", "Sans bénéfice d'administration réel"], a: 1, exp: "Une OU par service = périmètre clair pour droits et stratégies." },
    { type: "qcm", q: "Quel type de groupe crée-t-on pour gérer les droits d'un service ?", opts: ["Un groupe de distribution", "Un groupe de sécurité", "Une OU", "Un site"], a: 1, exp: "Les groupes de sécurité portent des droits ; les groupes de distribution non." },
    { type: "qcm", q: "Où règle-t-on la politique de mot de passe valable pour tout le domaine ?", opts: ["Une GPO d'OU", "La Default Domain Policy", "Le DNS", "La corbeille"], a: 1, exp: "La stratégie de mot de passe du domaine est globale." },
    { type: "qcm", q: "Comment interdire le Panneau de configuration aux seuls comptables ?", opts: ["Au domaine", "Une GPO liée à l'OU Comptabilite, modèle d'administration Activé", "Dans le DNS", "Via la corbeille"], a: 1, exp: "GPO ciblée sur l'OU du service." },
    { type: "qcm", q: "Bon réflexe avant de tester une restriction forte ?", opts: ["La tester sur son compte admin", "Utiliser un compte de test dans l'OU concernée", "Supprimer l'OU", "Désactiver AD"], a: 1, exp: "Éviter de se bloquer soi-même." },
    { type: "vf", q: "Cocher « Protéger contre la suppression accidentelle » à la création d'une OU est recommandé.", a: true, exp: "Un garde-fou utile, activé par défaut." },
    { type: "vf", q: "Activer la corbeille AD et planifier une sauvegarde de l'état du système forment un bon filet de sécurité.", a: true, exp: "Récupération rapide + sauvegarde d'AD." },
    { type: "vf", q: "On délègue de préférence à une personne nommée plutôt qu'à un groupe.", a: false, exp: "Non : à un groupe (Helpdesk), pour que les droits suivent l'appartenance." },
    { type: "input", q: "Quel sigle désigne la console où l'on crée OU, utilisateurs et groupes ?", a: ["ADUC", "aduc"], ph: "sigle", exp: "Utilisateurs et ordinateurs Active Directory." },
    { type: "input", q: "Quelle console sert à créer et lier les GPO du projet ?", a: ["GPMC", "gpmc"], ph: "sigle", exp: "Gestion des stratégies de groupe." },
    { type: "input", q: "Quel type d'objet AD range les comptes par service ? (sigle)", a: ["OU", "ou", "unité d'organisation", "unite d'organisation"], ph: "sigle", exp: "L'unité d'organisation (OU)." },
    { type: "input", q: "Quelle commande force l'application des GPO lors de la vérification ?", a: ["gpupdate /force", "gpupdate"], ph: "commande", exp: "gpupdate /force." },
    { type: "input", q: "Quelle commande liste les GPO réellement appliquées à un poste ?", a: ["gpresult /r", "gpresult"], ph: "commande", exp: "gpresult /r." },
    { type: "input", q: "Quel élément sauvegarde-t-on pour pouvoir remonter AD ? (État du …)", a: ["système", "systeme", "état du système", "System State"], ph: "élément", exp: "L'état du système." }
  ],
  final: {
    title: "Exercice final — Livrer le domaine Fabritek",
    intro: `<p>Tu montes <code>fabritek.local</code> : OU par service, utilisateurs, groupes, GPO de sécurité, délégation et filet de sécurité. Réponds sur les choix clés du projet.</p>`,
    questions: [
      { type: "qcm", q: "Toute première étape concrète du montage ?", opts: ["Créer les GPO", "Créer l'OU racine Fabritek et les sous-OU par service", "Planifier la sauvegarde", "Activer l'audit"], a: 1, exp: "La structure d'OU vient avant les objets et les règles." },
      { type: "input", q: "Quel type de groupe crée-t-on par service pour porter les droits ? (groupe de …)", a: ["sécurité", "securite", "groupe de sécurité"], ph: "type", exp: "Un groupe de sécurité." },
      { type: "qcm", q: "La politique de mot de passe (12 car., complexité) se pose sur…", opts: ["Chaque OU séparément", "La Default Domain Policy", "Le DNS", "Un site"], a: 1, exp: "Une règle unique pour tout le domaine." },
      { type: "input", q: "À quel groupe délègue-t-on la réinitialisation des mots de passe ?", a: ["Helpdesk", "helpdesk", "le groupe Helpdesk"], ph: "groupe", exp: "Au groupe Helpdesk, sur l'OU Fabritek." },
      { type: "vf", q: "On finit par vérifier avec gpupdate /force puis gpresult /r et un test par service.", a: true, exp: "La vérification confirme que tout s'applique comme prévu." }
    ],
    solution: `<p>Plan de montage complet du domaine Fabritek :</p>
<pre class="pseudo">A. STRUCTURE — ADUC ▸ créer OU Fabritek ▸ sous-OU Comptabilite, Ventes, RH, IT
   (cocher « Protéger contre la suppression accidentelle »)
B. UTILISATEURS — ADUC ▸ clic droit sur chaque OU ▸ Nouveau ▸ Utilisateur
   (mot de passe initial + « doit changer à la prochaine ouverture »)
C. GROUPES — ADUC ▸ Nouveau ▸ Groupe GRP-Ventes, GRP-Compta... (Globale, Sécurité)
   ▸ ajouter les membres de chaque service
D. GPO SECURITE :
   - Default Domain Policy : mot de passe longueur 12, complexité, verrouillage 5
   - OU Comptabilite : GPO « SEC-Compta » interdisant le Panneau de configuration
   - OU Ventes : GPO « Ventes-Lecteur » mappant V: vers \\SRV1\Ventes (ciblage GRP-Ventes)
E. DELEGATION — ADUC ▸ clic droit OU Fabritek ▸ Déléguer le contrôle
   ▸ Helpdesk ▸ « Réinitialiser les mots de passe utilisateur »
F. FILET — ADAC ▸ Activer la Corbeille ; Sauvegarde Windows Server ▸ Planifier ▸ État du système
G. VERIFICATION — gpupdate /force ▸ gpresult /r ▸ test de connexion par service
   ▸ (si plusieurs DC) repadmin /replsummary</pre>
<p>En suivant cet ordre — structure, objets, règles, filet, vérification — on obtient un domaine cohérent, sécurisé et facile à maintenir, en n'utilisant quasiment que les consoles graphiques.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "adgui-j30", title: "Monter le service RH de A à Z", level: 3,
    statement: "Décris toutes les étapes, dans l'interface, pour livrer le service RH du domaine Fabritek : l'OU <code>RH</code>, deux utilisateurs, un groupe <code>GRP-RH</code>, et une GPO liée à l'OU qui interdit l'accès à l'invite de commandes.",
    hints: [
      "Commence par la structure (l'OU RH), puis les objets, puis la GPO.",
      "Le groupe de sécurité se crée dans ADUC et reçoit ses membres via l'onglet Membres.",
      "L'interdiction de l'invite de commandes est un Modèle d'administration à passer sur Activé."
    ],
    solution: "1. STRUCTURE — ADUC ▸ clic droit sur l'OU Fabritek ▸ Nouveau ▸ Unité d'organisation ▸ nommer RH (laisser cochée la protection contre la suppression accidentelle).\n2. UTILISATEURS — clic droit sur l'OU RH ▸ Nouveau ▸ Utilisateur ; créer par ex. a.martin puis s.benali, avec un mot de passe initial et l'option « L'utilisateur doit changer le mot de passe à la prochaine ouverture de session ».\n3. GROUPE — clic droit sur l'OU RH ▸ Nouveau ▸ Groupe ▸ nom GRP-RH, étendue Globale, type Sécurité ▸ OK.\n4. MEMBRES — double-clic sur GRP-RH ▸ onglet Membres ▸ Ajouter ▸ a.martin et s.benali ▸ OK.\n5. GPO — GPMC ▸ clic droit sur l'OU RH ▸ Créer un objet GPO dans ce domaine et le lier ici ▸ nommer SEC-RH.\n6. Clic droit sur SEC-RH ▸ Modifier ▸ Configuration utilisateur ▸ Stratégies ▸ Modèles d'administration ▸ Système ▸ « Empêcher l'accès à l'invite de commandes » ▸ Activé ▸ OK.\n7. VERIFICATION — sur un poste RH (ou un compte de test dans l'OU RH) : gpupdate /force, puis gpresult /r pour confirmer que SEC-RH s'applique.",
    checklist: ["L'OU RH est-elle créée (protégée) et contient-elle les utilisateurs et le groupe ?", "Les deux utilisateurs (ex. a.martin, s.benali) existent-ils avec changement de mot de passe imposé ?", "Le groupe GRP-RH (Globale, Sécurité) contient-il ces deux utilisateurs ?", "La GPO SEC-RH liée à l'OU RH interdit-elle l'accès à l'invite de commandes (gpresult /r le confirme) ?"],
    atoi: {"cmd": "Get-ADGroupMember -Identity GRP-RH | Select-Object Name", "expected": "Name\n----\na.martin\ns.benali"},
    note: "En rangeant utilisateurs et groupe dans l'OU RH puis en liant la GPO à cette même OU, tout le service est administré comme un bloc cohérent : c'est exactement l'intérêt d'une structure par service." }
  ]
};
</script>
