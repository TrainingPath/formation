  num: 25,
  title: "Sauvegarde et restauration via l'interface",
  subtitle: "Protéger l'annuaire et savoir le remonter après un incident.",
  theory: `
<h3>1. Pourquoi sauvegarder un contrôleur de domaine ?</h3>
<p>Un <strong>contrôleur de domaine</strong> (DC) contient toute la base Active Directory. Si le serveur tombe, se corrompt, ou qu'un objet vital est supprimé sans corbeille, il faut pouvoir <strong>restaurer</strong>. La <strong>sauvegarde</strong> (backup) est une copie de sécurité des données à un instant donné, conservée à part.</p>
<h3>2. L'outil : Sauvegarde Windows Server</h3>
<p>Windows fournit l'outil graphique <strong>Sauvegarde Windows Server</strong> (Windows Server Backup). C'est une fonctionnalité qu'on installe d'abord, puis qu'on pilote depuis sa console.</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Gérer ▸ Ajouter des rôles et fonctionnalités
   ▸ Fonctionnalités ▸ cocher « Sauvegarde Windows Server » ▸ Installer   // installer l'outil
Gestionnaire de serveur ▸ Outils ▸ Sauvegarde Windows Server              // ouvrir la console</pre>
<h3>3. L'état du système (System State)</h3>
<p>Pour Active Directory, l'élément clé à sauvegarder est l'<strong>état du système</strong> (System State) : un ensemble qui regroupe la base AD (le fichier <code>NTDS.dit</code>), le registre, le dossier SYSVOL (qui contient les GPO), et les fichiers de démarrage. Sauvegarder l'état du système suffit à pouvoir remonter AD.</p>
<pre class="pseudo">Console Sauvegarde ▸ Action ▸ Sauvegarde unique (ou Planifier une sauvegarde)
   ▸ Personnalisé ▸ Ajouter des éléments ▸ cocher « État du système »
   ▸ choisir la destination (disque/partage) ▸ Sauvegarder</pre>
<div class="tip">« Sauvegarde unique » lance une copie tout de suite ; « Planifier une sauvegarde » programme des copies automatiques régulières (ex. chaque nuit). En production, on planifie.</div>
<h3>4. Restaurer : le mode DSRM</h3>
<p>Restaurer Active Directory ne se fait pas machine allumée normalement : il faut démarrer le DC en <strong>mode DSRM</strong> (Directory Services Restore Mode, « mode de restauration des services d'annuaire »), un mode de démarrage spécial où AD est <strong>hors ligne</strong>. On y accède au démarrage via les options, et on s'y connecte avec le <strong>mot de passe DSRM</strong> défini lors de la promotion du DC.</p>
<pre class="pseudo">Redémarrer ▸ options de démarrage avancées ▸ Mode de restauration des services d'annuaire (DSRM)
   → se connecter avec le compte administrateur local et le mot de passe DSRM</pre>
<h3>5. Restauration ordinaire vs faisant autorité</h3>
<p>Deux types de restauration. La <strong>restauration ordinaire</strong> (non-authoritative) remet les données, puis laisse la réplication les rafraîchir depuis les autres DC : bien pour reconstruire un DC défaillant. La <strong>restauration faisant autorité</strong> (authoritative) marque certains objets comme « la version qui fait foi », pour les <strong>réimposer</strong> aux autres DC : c'est ce qu'on utilise pour ressusciter un objet supprimé partout.</p>
<pre class="pseudo">Restauration ordinaire     → recréer un DC ; la replication corrige ensuite
Restauration faisant autorité → forcer le retour d'objets supprimes, via l'outil ntdsutil</pre>
<div class="warn">La restauration faisant autorité se fait avec l'outil en ligne de commande <strong>ntdsutil</strong> (commande <code>authoritative restore</code>). C'est l'une des rares tâches où l'on quitte la souris ; la corbeille AD (jour 24) évite d'en arriver là dans la plupart des cas.</div>
<h3>6. Tester ses sauvegardes</h3>
<p>Une sauvegarde jamais testée est une fausse sécurité. La bonne pratique : <strong>vérifier régulièrement</strong> qu'une restauration fonctionne (sur un serveur de test), et conserver les sauvegardes <strong>hors du serveur</strong> (disque externe, autre site).</p>`,
  exercises: [
    { type: "qcm", q: "Quel outil graphique sauvegarde un contrôleur de domaine ?", opts: ["GPMC", "Sauvegarde Windows Server", "DNS Manager", "ADAC"], a: 1, exp: "Windows Server Backup, à installer puis piloter." },
    { type: "qcm", q: "Que contient l'état du système (System State) pour AD ?", opts: ["Juste des logs", "La base AD (NTDS.dit), le registre, SYSVOL et les fichiers de démarrage", "Les mots de passe en clair", "Les fichiers personnels des utilisateurs"], a: 1, exp: "L'ensemble nécessaire pour remonter AD." },
    { type: "qcm", q: "Dans quel mode démarre-t-on un DC pour restaurer AD ?", opts: ["Mode sans échec réseau", "Mode DSRM (restauration des services d'annuaire)", "Mode normal", "Mode veille"], a: 1, exp: "DSRM met AD hors ligne pour la restauration." },
    { type: "qcm", q: "Une restauration ordinaire (non-authoritative)…", opts: ["Réimpose des objets aux autres DC", "Remet les données puis laisse la réplication rafraîchir", "Supprime AD", "Change le DNS"], a: 1, exp: "Idéale pour reconstruire un DC défaillant." },
    { type: "qcm", q: "Une restauration faisant autorité sert à…", opts: ["Accélérer le DNS", "Réimposer des objets (ex. ressusciter un objet supprimé partout)", "Installer une GPO", "Créer un site"], a: 1, exp: "Elle marque des objets comme faisant foi." },
    { type: "qcm", q: "En production, comment planifie-t-on les sauvegardes ?", opts: ["Jamais", "Avec « Planifier une sauvegarde » (copies automatiques régulières)", "En copiant les fichiers sur une clé USB", "Manuellement chaque heure à la main"], a: 1, exp: "Une planification automatique (ex. chaque nuit)." },
    { type: "vf", q: "Sauvegarder l'état du système suffit à pouvoir remonter Active Directory.", a: true, exp: "Il contient NTDS.dit, le registre, SYSVOL et les fichiers de démarrage." },
    { type: "vf", q: "La restauration faisant autorité se fait avec l'outil ntdsutil.", a: true, exp: "Commande authoritative restore dans ntdsutil." },
    { type: "vf", q: "Une sauvegarde jamais testée garantit une restauration réussie.", a: false, exp: "Il faut tester régulièrement : sinon fausse sécurité." },
    { type: "input", q: "Quel sigle désigne le mode de démarrage spécial pour restaurer AD ?", a: ["DSRM", "dsrm"], ph: "sigle", exp: "Directory Services Restore Mode." },
    { type: "input", q: "Comment s'appelle l'ensemble à sauvegarder pour AD (2 mots) ? (État du …)", a: ["système", "systeme", "état du système", "etat du systeme", "System State"], ph: "élément", exp: "L'état du système (System State)." },
    { type: "input", q: "Quel est le nom du fichier de la base Active Directory ?", a: ["NTDS.dit", "ntds.dit", "NTDS", "ntds"], ph: "fichier", exp: "NTDS.dit contient l'annuaire." },
    { type: "input", q: "Quel outil en ligne de commande réalise une restauration faisant autorité ?", a: ["ntdsutil", "Ntdsutil"], ph: "outil", exp: "ntdsutil ▸ authoritative restore." },
    { type: "input", q: "Quel dossier, inclus dans l'état du système, contient les GPO ?", a: ["SYSVOL", "sysvol"], ph: "dossier", exp: "SYSVOL héberge les stratégies de groupe." },
    { type: "input", q: "Quel type de mot de passe faut-il pour se connecter en mode de restauration ?", a: ["DSRM", "mot de passe DSRM", "dsrm"], ph: "type", exp: "Le mot de passe DSRM défini à la promotion du DC." }
  ],
  final: {
    title: "Exercice final — Perte d'un contrôleur de domaine",
    intro: `<p>Le seul contrôleur de domaine d'une petite entreprise a subi une panne disque. On dispose d'une sauvegarde récente de l'état du système. Réponds sur la démarche de restauration.</p>`,
    questions: [
      { type: "qcm", q: "Qu'a-t-on eu la bonne idée de sauvegarder pour AD ?", opts: ["Seulement les dossiers personnels des utilisateurs", "L'état du système (System State)", "Uniquement les journaux d'événements", "La configuration du pare-feu"], a: 1, exp: "L'état du système permet de remonter AD." },
      { type: "input", q: "Dans quel mode redémarre-t-on le serveur pour restaurer AD ? (sigle)", a: ["DSRM", "dsrm"], ph: "sigle", exp: "Directory Services Restore Mode." },
      { type: "input", q: "Quel mot de passe est nécessaire pour se connecter dans ce mode ?", a: ["DSRM", "mot de passe DSRM", "dsrm"], ph: "type", exp: "Le mot de passe DSRM défini lors de la promotion." },
      { type: "qcm", q: "Pour reconstruire ce DC unique, quel type de restauration ?", opts: ["Restauration ordinaire (non-authoritative)", "Restauration faisant autorité obligatoire", "Aucune", "Réinstaller le DNS seul"], a: 0, exp: "Reconstruire un DC = restauration ordinaire de l'état du système." },
      { type: "vf", q: "Conserver la sauvegarde sur un disque externe / autre site est une bonne pratique.", a: true, exp: "Hors du serveur, elle survit à la panne de celui-ci." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Réparer/remplacer le matériel, réinstaller Windows Server si nécessaire
2. Rendre la sauvegarde accessible (disque externe, partage réseau)
3. Redémarrer en Mode de restauration des services d'annuaire (DSRM)
4. Se connecter avec l'administrateur local et le mot de passe DSRM
5. Ouvrir Sauvegarde Windows Server ▸ Récupérer ▸ choisir « État du système »
6. Sélectionner la sauvegarde ▸ lancer la restauration (ordinaire / non-authoritative)
7. Redémarrer en mode normal ▸ vérifier AD, la réplication, SYSVOL et le DNS</pre>
<p>La restauration ordinaire suffit pour un DC défaillant. On ne recourt à ntdsutil (restauration faisant autorité) que pour réimposer des objets supprimés à d'autres DC encore vivants.</p>`
  }
};
</script>
