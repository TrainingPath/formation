var DAY = {
  num: 22,
  title: "Le DNS et Active Directory",
  subtitle: "L'annuaire téléphonique du réseau, indispensable au fonctionnement d'AD.",
  theory: `
<h3>1. Qu'est-ce que le DNS ?</h3>
<p>Le <strong>DNS</strong> (Domain Name System, « système de noms de domaine ») est le service qui traduit un <strong>nom</strong> lisible (ex. <code>srv1.mondomaine.local</code>) en <strong>adresse IP</strong> (ex. <code>192.168.1.10</code>), l'adresse numérique réelle d'une machine sur le réseau. C'est l'annuaire téléphonique du réseau : tu donnes un nom, il te rend le numéro.</p>
<h3>2. Pourquoi AD dépend du DNS</h3>
<p>Active Directory ne peut <strong>pas fonctionner sans DNS</strong>. Les postes utilisent le DNS pour <strong>trouver le contrôleur de domaine</strong> : à quelle adresse s'authentifier, où appliquer les GPO, etc. Ces informations sont publiées dans le DNS sous forme d'<strong>enregistrements SRV</strong> (service records), qui annoncent « le service d'ouverture de session du domaine est à telle adresse ».</p>
<div class="warn">Symptôme classique : un poste « ne trouve pas le domaine » ou « aucun contrôleur de domaine disponible ». Neuf fois sur dix, c'est un <strong>problème de DNS</strong> (le poste pointe vers le mauvais serveur DNS).</div>
<h3>3. La console DNS</h3>
<p>On administre le DNS avec la console <strong>Gestionnaire DNS</strong> (DNS Manager).</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Outils ▸ DNS                 // ouvre la console Gestionnaire DNS
Console DNS ▸ nom-du-serveur ▸ Zones de recherche directe   // noms → adresses IP
Console DNS ▸ nom-du-serveur ▸ Zones de recherche inversée  // adresses IP → noms</pre>
<h3>4. Zones directes et inversées</h3>
<p>Une <strong>zone</strong> est un conteneur d'enregistrements pour une portion de l'espace de noms. La <strong>zone de recherche directe</strong> (forward lookup) traduit nom → IP (le cas courant). La <strong>zone de recherche inversée</strong> (reverse lookup) fait l'inverse : IP → nom, utile pour des vérifications et certains services.</p>
<h3>5. Les types d'enregistrements</h3>
<pre class="pseudo">A       nom → adresse IPv4        (srv1 → 192.168.1.10)        // l'enregistrement le plus courant
AAAA    nom → adresse IPv6                                     // version IPv6 du A
CNAME   alias → autre nom         (intranet → srv1)            // un surnom pointant vers un vrai nom
PTR     adresse IP → nom          (dans la zone inversee)      // le miroir du A
SRV     localise un service       (ouverture de session AD)    // vital pour Active Directory
MX      serveur de messagerie                                  // pour le courrier</pre>
<h3>6. Zones intégrées à AD</h3>
<p>Quand la zone DNS est <strong>intégrée à Active Directory</strong> (AD-integrated), ses données sont stockées dans l'annuaire lui-même et <strong>répliquées</strong> automatiquement entre tous les contrôleurs de domaine. Avantage : chaque DC connaît le DNS, plus de fichier unique à sauvegarder à part, et la sécurité des mises à jour est renforcée.</p>
<pre class="pseudo">Console DNS ▸ clic droit sur la zone ▸ Propriétés ▸ onglet Général
   Type : Intégré à Active Directory              // stockage dans AD, replication automatique
   Mises à jour dynamiques : Sécurisées uniquement // seuls les membres du domaine ecrivent</pre>
<div class="tip">Les <strong>mises à jour dynamiques</strong> permettent aux machines d'enregistrer elles-mêmes leur nom dans le DNS. En mode « Sécurisées uniquement », seules les machines authentifiées du domaine peuvent le faire.</div>
<h3>7. Tester le DNS</h3>
<p>L'outil en ligne de commande <strong>nslookup</strong> interroge le DNS pour vérifier qu'un nom se résout bien. C'est le premier réflexe de dépannage.</p>
<pre class="pseudo">nslookup srv1.mondomaine.local        // doit renvoyer l'adresse IP du serveur
nslookup mondomaine.local             // doit renvoyer l'adresse d'un contrôleur de domaine</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait le DNS ?", opts: ["Il chiffre les mots de passe", "Il traduit un nom (ex. srv1) en adresse IP", "Il crée des GPO", "Il sauvegarde AD"], a: 1, exp: "Le DNS résout les noms en adresses IP, comme un annuaire." },
    { type: "qcm", q: "Pourquoi Active Directory dépend-il du DNS ?", opts: ["Pour afficher un logo", "Pour que les postes trouvent le contrôleur de domaine", "Pour mapper des lecteurs", "Il n'en dépend pas"], a: 1, exp: "Les postes localisent le DC via les enregistrements SRV du DNS." },
    { type: "qcm", q: "Quel type d'enregistrement localise un service comme l'ouverture de session AD ?", opts: ["A", "MX", "SRV", "PTR"], a: 2, exp: "Les enregistrements SRV publient les services du domaine." },
    { type: "qcm", q: "Un enregistrement A fait correspondre…", opts: ["Un nom à une adresse IPv4", "Une IP à un nom", "Un alias à un nom", "Un service à un port"], a: 0, exp: "A : nom → IPv4. Le plus courant." },
    { type: "qcm", q: "Une zone de recherche inversée traduit…", opts: ["Nom → IP", "IP → nom", "Nom → nom", "IP → IP"], a: 1, exp: "Reverse lookup : de l'adresse IP vers le nom (enregistrements PTR)." },
    { type: "qcm", q: "Avantage d'une zone DNS intégrée à Active Directory ?", opts: ["Elle est plus lente", "Elle est répliquée automatiquement sur tous les DC", "Elle supprime le DNS", "Elle chiffre les GPO"], a: 1, exp: "Stockée dans AD, elle se réplique avec l'annuaire." },
    { type: "vf", q: "Active Directory peut fonctionner sans DNS.", a: false, exp: "Non : sans DNS, les postes ne trouvent pas le contrôleur de domaine." },
    { type: "vf", q: "Le mode « Mises à jour dynamiques sécurisées uniquement » limite l'enregistrement aux machines authentifiées du domaine.", a: true, exp: "Seuls les membres du domaine peuvent écrire dans la zone." },
    { type: "vf", q: "Un enregistrement CNAME est un alias qui pointe vers un autre nom.", a: true, exp: "CNAME = surnom renvoyant vers un vrai nom (ex. intranet → srv1)." },
    { type: "input", q: "Quel sigle (3 lettres) désigne le système de noms de domaine ?", a: ["DNS", "dns"], ph: "sigle", exp: "Domain Name System." },
    { type: "input", q: "Quel outil en ligne de commande teste la résolution d'un nom DNS ?", a: ["nslookup", "Nslookup"], ph: "commande", exp: "nslookup interroge le DNS." },
    { type: "input", q: "Comment appelle-t-on la zone qui traduit nom → IP ? (recherche …)", a: ["directe", "recherche directe", "zone de recherche directe"], ph: "type de zone", exp: "Zone de recherche directe (forward lookup)." },
    { type: "input", q: "Quel type d'enregistrement fait IP → nom dans la zone inversée ? (sigle)", a: ["PTR", "ptr"], ph: "sigle", exp: "L'enregistrement PTR (pointeur)." },
    { type: "input", q: "Depuis quel menu du Gestionnaire de serveur ouvre-t-on la console DNS ?", a: ["Outils", "outils", "menu Outils"], ph: "menu", exp: "Gestionnaire de serveur ▸ Outils ▸ DNS." },
    { type: "input", q: "Quel type d'enregistrement pointe vers le serveur de messagerie ? (sigle)", a: ["MX", "mx"], ph: "sigle", exp: "MX = Mail eXchange." }
  ],
  final: {
    title: "Exercice final — Un poste ne trouve plus le domaine",
    intro: `<p>Un ordinateur affiche « Aucun contrôleur de domaine disponible ». On soupçonne le DNS. Réponds sur la démarche de diagnostic via l'interface et les outils.</p>`,
    questions: [
      { type: "qcm", q: "Cause la plus probable de ce message ?", opts: ["Un mot de passe expiré", "Un problème de DNS (mauvais serveur DNS configuré)", "Une imprimante en panne", "Une GPO manquante"], a: 1, exp: "Sans DNS correct, le poste ne localise pas le DC." },
      { type: "input", q: "Quelle commande vérifie que le nom du domaine se résout ?", a: ["nslookup", "nslookup mondomaine.local"], ph: "commande", exp: "nslookup teste la résolution." },
      { type: "input", q: "Quel type d'enregistrement, publié par AD, permet aux postes de localiser le DC ? (sigle)", a: ["SRV", "srv"], ph: "sigle", exp: "Les enregistrements SRV localisent les services du domaine." },
      { type: "qcm", q: "Où vérifier/recréer les enregistrements côté serveur ?", opts: ["GPMC", "Console DNS (Gestionnaire DNS) ▸ zone de recherche directe", "ADAC", "Sites et services"], a: 1, exp: "La console DNS gère zones et enregistrements." },
      { type: "vf", q: "Configurer le poste pour utiliser le contrôleur de domaine comme serveur DNS est une bonne piste.", a: true, exp: "Les clients d'un domaine doivent pointer vers le DNS interne (souvent le DC), pas la box." }
    ],
    solution: `<p>Marche à suivre de diagnostic :</p>
<pre class="pseudo">1. Sur le poste : vérifier la config IP (serveur DNS = adresse du DC interne, PAS la box)
2. nslookup mondomaine.local        // doit renvoyer l'IP d'un contrôleur de domaine
3. nslookup srv1.mondomaine.local   // le DC doit se résoudre
4. Côté serveur : Gestionnaire de serveur ▸ Outils ▸ DNS
5. Console DNS ▸ zone de recherche directe ▸ vérifier les enregistrements A du DC
   et la présence des dossiers _msdcs / SRV (services d'ouverture de session)
6. Si besoin, forcer la ré-inscription depuis le DC : ipconfig /registerdns
7. Retester avec nslookup depuis le poste, puis rejoindre/ouvrir la session</pre>
<p>La règle d'or : un membre du domaine doit toujours pointer vers le DNS interne du domaine. C'est ce DNS qui contient les enregistrements SRV nécessaires à AD.</p>`
  }
};
