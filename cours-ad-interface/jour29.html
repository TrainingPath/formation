  title: "Modèles d'administration et bonnes pratiques",
  subtitle: "Maîtriser les réglages fins et adopter une hygiène d'administration durable.",
  theory: `
<h3>1. Les modèles d'administration (rappel et approfondissement)</h3>
<p>Les <strong>modèles d'administration</strong> (Administrative Templates) sont l'immense bibliothèque de réglages « Activé/Désactivé » d'une GPO, organisés par thème (Panneau de configuration, Système, Réseau…). Techniquement, ils reposent sur des fichiers <strong>ADMX</strong> (et leur traduction <strong>ADML</strong>) qui décrivent chaque réglage possible.</p>
<pre class="pseudo">.admx   definition d'un reglage (langue-neutre)         // le "quoi" est reglable
.adml   textes traduits d'un .admx (fr-FR, en-US...)    // les libelles affiches</pre>
<h3>2. Le magasin central (Central Store)</h3>
<p>Par défaut, chaque poste d'admin a sa copie locale des modèles. Le <strong>magasin central</strong> (Central Store) est un dossier unique dans SYSVOL où l'on place les fichiers ADMX/ADML : toutes les consoles GPMC du domaine lisent alors <strong>la même version</strong>, ce qui évite les incohérences.</p>
<pre class="pseudo">Copier les fichiers vers : \\domaine\SYSVOL\domaine\Policies\PolicyDefinitions   // le magasin central
   → l'editeur de GPO affiche « recupere depuis le magasin central »</pre>
<h3>3. Précédence des GPO : LSDOU</h3>
<p>Quand plusieurs GPO s'appliquent, l'ordre d'application suit le sigle <strong>LSDOU</strong> : <strong>L</strong>ocal, puis <strong>S</strong>ite, puis <strong>D</strong>omaine, puis <strong>OU</strong> (et sous-OU). La <strong>dernière appliquée gagne</strong> en cas de conflit : donc une GPO d'OU l'emporte sur une GPO de domaine.</p>
<pre class="pseudo">Ordre d'application (du 1er au dernier applique) :
   1. Stratégie Locale de la machine
   2. GPO liées au Site
   3. GPO liées au Domaine
   4. GPO liées aux OU (de la plus haute a la plus profonde)
La derniere qui ecrit un reglage l'emporte.</pre>
<h3>4. Deux réglages de lien : Bloquer / Appliqué</h3>
<p>Deux options modifient la cascade. <strong>Bloquer l'héritage</strong> (Block Inheritance) sur une OU empêche les GPO des niveaux supérieurs de descendre. <strong>Appliqué</strong> (Enforced, anciennement « No Override ») sur un lien de GPO force celle-ci à s'appliquer <strong>malgré</strong> un blocage et à gagner les conflits.</p>
<pre class="pseudo">Clic droit sur une OU ▸ Bloquer l'héritage          // stoppe les GPO venues d'en haut
Clic droit sur un lien de GPO ▸ Appliqué            // cette GPO passe partout et gagne (bat le blocage)</pre>
<div class="warn">« Appliqué » l'emporte toujours, même sur « Bloquer l'héritage ». À réserver aux règles vraiment non négociables (ex. une GPO de sécurité obligatoire).</div>
<h3>5. Le filtrage de sécurité</h3>
<p>Par défaut, une GPO s'applique au groupe <strong>Utilisateurs authentifiés</strong>. Le <strong>filtrage de sécurité</strong> (Security Filtering) restreint l'application à un groupe précis : on retire « Utilisateurs authentifiés » et on ajoute, par exemple, le groupe « Comptabilité ».</p>
<pre class="pseudo">GPMC ▸ sélectionner la GPO ▸ onglet Étendue ▸ section Filtrage de sécurité
   ▸ Supprimer « Utilisateurs authentifiés » ▸ Ajouter le groupe cible</pre>
<h3>6. Bonnes pratiques d'administration</h3>
<pre class="pseudo">- Nommer clairement GPO et OU (ex. « SEC-Postes-Verrouillage »)   // on comprend d'un coup d'oeil
- Une GPO = un objectif (ne pas tout entasser dans une seule)     // plus facile a depanner
- Ne pas modifier les GPO par defaut sauf mots de passe/DC        // limiter les degats
- Comptes admin separes du compte de tous les jours              // moindre privilege
- Documenter et tester avant d'appliquer largement                // eviter les surprises
- Activer la corbeille AD et sauvegarder l'etat du systeme        // filet de securite</pre>
<div class="tip">Vérifie toujours l'effet réel d'une GPO avec l'assistant <strong>Résultats de stratégie de groupe</strong> (RSOP) de la GPMC ou <code>gpresult /r</code> : ce qui est configuré n'est pas toujours ce qui s'applique.</div>`,
  exercises: [

    { type: "vf", q: "« Appliqué » l'emporte même sur « Bloquer l'héritage ».", a: true, exp: "Enforced bat le blocage : à réserver aux règles non négociables." },

    { type: "input", q: "Quel réglage sur une OU empêche les GPO d'en haut de descendre ? (Bloquer l'…)", a: ["héritage", "heritage", "Bloquer l'héritage", "blocage d'héritage"], ph: "option", exp: "Bloquer l'héritage." },
    { type: "input", q: "Quel groupe par défaut se voit appliquer une GPO (dans le filtrage de sécurité) ?", a: ["Utilisateurs authentifiés", "Utilisateurs authentifies", "utilisateurs authentifiés"], ph: "groupe", exp: "Utilisateurs authentifiés." },
    { type: "input", q: "Quel sigle (ou commande /r) désigne la vérification de l'effet réel des GPO ?", a: ["RSOP", "rsop", "gpresult", "gpresult /r"], ph: "sigle ou commande", exp: "RSOP / gpresult /r montrent ce qui s'applique vraiment." }
  ],

    questions: [
      { type: "qcm", q: "Pour que la GPO passe malgré le blocage de l'OU Direction, on active…", opts: ["Bloquer l'héritage", "Appliqué (Enforced) sur le lien de la GPO", "Le filtrage DNS", "Rien"], a: 1, exp: "Enforced l'emporte même sur un blocage d'héritage." },
      { type: "qcm", q: "Pour ne toucher que Postes-Fixes, on utilise…", opts: ["Le filtrage de sécurité (retirer Utilisateurs authentifiés, ajouter Postes-Fixes)", "Une sauvegarde", "Le DNS inversé", "La corbeille AD"], a: 0, exp: "Le filtrage de sécurité cible un groupe précis." },
      { type: "input", q: "Dans quel onglet de la GPO règle-t-on le filtrage de sécurité ?", a: ["Étendue", "Etendue", "étendue"], ph: "onglet", exp: "L'onglet Étendue de la GPO." },
      { type: "vf", q: "Sans « Appliqué », le « Bloquer l'héritage » de la Direction empêcherait la GPO de s'y appliquer.", a: true, exp: "Le blocage stoppe les GPO d'en haut, sauf celles marquées Appliqué." },
      { type: "input", q: "Quelle commande vérifie sur un poste ce qui s'applique réellement ?", a: ["gpresult /r", "gpresult"], ph: "commande", exp: "gpresult /r liste les GPO appliquées." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. GPMC ▸ localiser le lien de SEC-Verrouillage sous le domaine
2. Clic droit sur ce lien ▸ cocher « Appliqué »        // la GPO gagne et ignore les blocages
3. Sélectionner la GPO ▸ onglet Étendue ▸ Filtrage de sécurité
   ▸ Supprimer « Utilisateurs authentifiés » ▸ Ajouter le groupe « Postes-Fixes »
   (verifier que ces machines ont le droit « Lecture » et « Appliquer la stratégie »)
4. gpupdate /force sur un poste concerné
5. gpresult /r (ou assistant Résultats de stratégie de groupe) pour confirmer l'application</pre>
<p>Deux leviers combinés : « Appliqué » garantit la portée <strong>malgré</strong> le blocage de la Direction, et le filtrage de sécurité restreint l'effet au seul groupe Postes-Fixes.</p>`
  }
};
