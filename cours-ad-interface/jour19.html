<script>
var DAY = {
  num: 19,
  title: "Déployer des paramètres (lecteurs, restrictions)",
  subtitle: "Connecter automatiquement un lecteur réseau et brider l'interface, via GPO.",
  theory: `
<h3>1. Deux usages très courants des GPO</h3>
<p>Une fois qu'on sait créer et lier une GPO (jour 17), on l'utilise pour deux besoins quotidiens : <strong>connecter des lecteurs réseau</strong> automatiquement, et <strong>restreindre</strong> ce que l'utilisateur peut faire (cacher des menus, interdire des outils). Tout se fait à la souris dans l'éditeur de GPO.</p>
<h3>2. Les préférences de stratégie de groupe</h3>
<p>Les <strong>Préférences de stratégie de groupe</strong> (Group Policy Preferences) sont une catégorie de réglages « souples » : contrairement aux stratégies classiques, l'utilisateur peut parfois les ajuster, et elles servent à déployer des éléments concrets comme des lecteurs mappés, des imprimantes ou des raccourcis. Un <strong>lecteur mappé</strong> (mapped drive) est un dossier réseau qui apparaît comme un disque (ex. lettre <code>S:</code>) dans l'explorateur.</p>
<pre class="pseudo">Editeur de GPO ▸ Configuration utilisateur ▸ Préférences ▸ Paramètres Windows ▸ Mappages de lecteurs
   ▸ clic droit ▸ Nouveau ▸ Lecteur mappé
      Action : Créer                          // creer le mappage
      Emplacement : \\serveur\partage         // chemin UNC du dossier reseau
      Lettre de lecteur : S:                  // la lettre affichee dans l'explorateur
      ▸ OK</pre>
<div class="tip">Le <strong>chemin UNC</strong> (Universal Naming Convention) est l'adresse d'un dossier partagé sur le réseau, de la forme <code>\\nom-du-serveur\nom-du-partage</code>.</div>
<h3>3. Restreindre l'interface (modèles d'administration)</h3>
<p>Pour interdire des fonctions, on passe par les <strong>Modèles d'administration</strong> (Administrative Templates) : une immense bibliothèque de réglages tout prêts (activer/désactiver) organisés par thème. Chaque réglage a trois états : <strong>Non configuré</strong>, <strong>Activé</strong>, <strong>Désactivé</strong>.</p>
<pre class="pseudo">Editeur ▸ Configuration utilisateur ▸ Strategies ▸ Modèles d'administration
   ▸ Panneau de configuration ▸ « Interdire l'accès au Panneau de configuration » ▸ Activé
   ▸ Système ▸ « Empêcher l'accès à l'invite de commandes » ▸ Activé
   ▸ Menu Démarrer et barre des tâches ▸ divers reglages d'affichage</pre>
<div class="warn">« Activé » sur une restriction du type « Interdire… » veut dire que l'interdiction est <strong>en vigueur</strong>. Lis toujours l'intitulé complet : activer une règle nommée « Interdire X » bloque X.</div>
<h3>4. Ordinateur ou utilisateur ?</h3>
<p>Un réglage qui suit la <strong>personne</strong> (peu importe le poste) va dans <strong>Configuration utilisateur</strong>. Un réglage qui suit la <strong>machine</strong> (peu importe qui se connecte) va dans <strong>Configuration ordinateur</strong>. Les lecteurs mappés sont typiquement côté utilisateur ; une restriction de sécurité machine côté ordinateur.</p>
<h3>5. Le ciblage au niveau de l'élément</h3>
<p>Une préférence peut être limitée finement avec le <strong>ciblage au niveau de l'élément</strong> (item-level targeting) : on précise « appliquer seulement si l'utilisateur est membre du groupe Comptabilité », par exemple. Utile pour un même GPO qui mappe des lecteurs différents selon le service.</p>
<pre class="pseudo">Nouveau ▸ Lecteur mappé ▸ onglet Commun ▸ cocher « Ciblage au niveau de l'élément »
   ▸ Ciblage... ▸ Nouvel élément ▸ Groupe de sécurité ▸ choisir « Comptabilite »</pre>
<h3>6. Vérifier ce qui s'applique</h3>
<p>Pour savoir quelles GPO s'appliquent réellement à un poste, on utilise l'outil <strong>gpresult</strong> en ligne de commande (<code>gpresult /r</code>) ou l'assistant graphique <strong>Résultats de stratégie de groupe</strong> de la GPMC, qui produit un rapport lisible.</p>`,
  exercises: [
    { type: "qcm", q: "Comment appelle-t-on un dossier réseau affiché comme un disque (ex. S:) ?", opts: ["Un lecteur mappé", "Une OU", "Un site", "Un PSO"], a: 0, exp: "Un lecteur mappé (mapped drive) apparaît comme une lettre de disque." },
    { type: "qcm", q: "Où crée-t-on un mappage de lecteur dans l'éditeur ?", opts: ["Modèles d'administration", "Préférences ▸ Paramètres Windows ▸ Mappages de lecteurs", "Stratégie de mot de passe", "DNS"], a: 1, exp: "Les mappages sont des Préférences côté utilisateur." },
    { type: "qcm", q: "Que signifie « Activé » sur une règle nommée « Interdire l'accès au Panneau de configuration » ?", opts: ["Le Panneau est accessible", "L'interdiction est en vigueur : le Panneau est bloqué", "Rien", "Le poste redémarre"], a: 1, exp: "Activer la règle applique l'interdiction décrite dans l'intitulé." },
    { type: "qcm", q: "Un lecteur mappé pour un utilisateur se place plutôt dans…", opts: ["Configuration ordinateur", "Configuration utilisateur", "Le DNS", "Un site"], a: 1, exp: "Il suit la personne : côté utilisateur." },
    { type: "qcm", q: "À quoi sert le ciblage au niveau de l'élément (item-level targeting) ?", opts: ["À accélérer le réseau", "À n'appliquer une préférence que sous condition (ex. membre d'un groupe)", "À supprimer une GPO", "À chiffrer le disque"], a: 1, exp: "Il conditionne finement l'application d'une préférence." },
    { type: "qcm", q: "Quels sont les trois états d'un réglage de Modèle d'administration ?", opts: ["Oui, Non, Peut-être", "Non configuré, Activé, Désactivé", "Vert, Orange, Rouge", "Lecture, Écriture, Exécution"], a: 1, exp: "Non configuré (on ne touche pas), Activé, Désactivé." },
    { type: "vf", q: "Un chemin UNC a la forme \\\\serveur\\partage.", a: true, exp: "Universal Naming Convention : deux antislashs, le serveur, le partage." },
    { type: "vf", q: "Les Modèles d'administration servent surtout à mapper des imprimantes.", a: false, exp: "Ce sont des réglages activés/désactivés ; le mappage relève des Préférences." },
    { type: "vf", q: "Un réglage placé en Configuration ordinateur suit la machine, quel que soit l'utilisateur connecté.", a: true, exp: "Côté ordinateur = lié à la machine ; côté utilisateur = lié à la personne." },
    { type: "input", q: "Quel sigle désigne le chemin réseau du type \\\\serveur\\partage ?", a: ["UNC", "unc"], ph: "sigle", exp: "Universal Naming Convention." },
    { type: "input", q: "Quelle catégorie de réglages « souples » sert à déployer lecteurs, imprimantes et raccourcis ? (nom)", a: ["Préférences", "Preferences", "préférences", "Préférences de stratégie de groupe"], ph: "nom", exp: "Les Préférences de stratégie de groupe." },
    { type: "input", q: "Quel nom porte la bibliothèque de réglages Activé/Désactivé organisés par thème ?", a: ["Modèles d'administration", "Modeles d'administration", "modèles d'administration"], ph: "nom", exp: "Administrative Templates." },
    { type: "input", q: "Quelle commande (ligne de commande) affiche les GPO réellement appliquées à un poste ?", a: ["gpresult /r", "gpresult", "gpresult/r"], ph: "commande", exp: "gpresult /r produit un rapport des stratégies appliquées." },
    { type: "input", q: "Quel onglet d'une préférence contient l'option « Ciblage au niveau de l'élément » ?", a: ["Commun", "commun"], ph: "onglet", exp: "L'onglet Commun de la boîte de dialogue de la préférence." },
    { type: "input", q: "Quelle lettre de lecteur est proposée en exemple pour le partage S ? (une lettre)", a: ["S", "S:", "s", "s:"], ph: "lettre", exp: "Le lecteur mappé apparaît en S:." }
  ],
  final: {
    title: "Exercice final — Lecteur commun et Panneau bloqué",
    intro: `<p>Objectif : pour l'OU <code>Bureaux</code>, mapper le partage <code>\\\\SRV1\\Commun</code> en lettre <strong>K:</strong> et interdire l'accès au Panneau de configuration. Réponds sur la démarche.</p>`,
    questions: [
      { type: "qcm", q: "Pour le mappage K:, dans quelle branche de l'éditeur va-t-on ?", opts: ["Configuration ordinateur ▸ Modèles d'administration", "Configuration utilisateur ▸ Préférences ▸ Mappages de lecteurs", "Stratégie de mot de passe", "DNS"], a: 1, exp: "Les mappages sont des préférences utilisateur." },
      { type: "input", q: "Quel chemin UNC saisit-on comme Emplacement du lecteur ?", a: ["\\\\SRV1\\Commun", "\\\\srv1\\commun"], ph: "chemin UNC", exp: "\\\\serveur\\partage." },
      { type: "input", q: "Quelle Action choisit-on pour établir le mappage ? (Créer / Supprimer / …)", a: ["Créer", "Creer", "créer"], ph: "action", exp: "Action = Créer établit le mappage." },
      { type: "qcm", q: "Pour bloquer le Panneau de configuration, on passe par…", opts: ["Préférences ▸ Mappages", "Configuration utilisateur ▸ Modèles d'administration ▸ Panneau de configuration", "Le DNS", "La corbeille AD"], a: 1, exp: "C'est un réglage de Modèle d'administration." },
      { type: "vf", q: "On règle « Interdire l'accès au Panneau de configuration » sur Activé pour appliquer l'interdiction.", a: true, exp: "Activer une règle « Interdire… » met l'interdiction en vigueur." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. GPMC ▸ clic droit sur l'OU Bureaux ▸ Créer un objet GPO et le lier ici ▸ nommer « Bureaux-Deploiement »
2. Clic droit sur la GPO ▸ Modifier
3. Configuration utilisateur ▸ Préférences ▸ Paramètres Windows ▸ Mappages de lecteurs
   ▸ clic droit ▸ Nouveau ▸ Lecteur mappé
      Action = Créer ; Emplacement = \\SRV1\Commun ; Lettre = K: ▸ OK
4. Configuration utilisateur ▸ Strategies ▸ Modèles d'administration ▸ Panneau de configuration
   ▸ « Interdire l'accès au Panneau de configuration » ▸ Activé ▸ OK
5. Fermer l'editeur ▸ sur un poste : gpupdate /force
6. Verifier avec gpresult /r ou l'assistant Résultats de stratégie de groupe</pre>
<p>Un seul GPO déploie à la fois un lecteur réseau et une restriction d'interface pour toute l'OU.</p>`
  }
};
</script>

};
