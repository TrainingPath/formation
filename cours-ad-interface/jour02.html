var DAY = {
  num: 2,
  title: "Installer Windows Server et Server Manager",
  subtitle: "Poser les fondations : le système d'exploitation serveur et son tableau de bord.",
  theory: `
<h3>1. Qu'est-ce que Windows Server ?</h3>
<p><strong>Windows Server</strong> est la version de Windows destinée aux <strong>serveurs</strong>, c'est-à-dire des ordinateurs qui rendent des services à d'autres (l'annuaire, les fichiers partagés, l'impression). Analogie : Windows 11 est la voiture personnelle, Windows Server est le <strong>camion de livraison</strong> de l'entreprise. Même famille, mais l'un est fait pour travailler en continu et servir beaucoup de monde.</p>
<p>Pour ce cours, nous utilisons une édition récente (par exemple <strong>Windows Server 2022</strong>). L'installation se fait souvent dans une <strong>machine virtuelle</strong> (une machine « faisant semblant » d'exister à l'intérieur de ton PC), ce qui permet de s'entraîner sans risque.</p>
<h3>2. L'installation pas à pas</h3>
<p>Au démarrage sur le support d'installation (image ISO ou clé USB), l'assistant graphique de Windows apparaît. Voici les grandes étapes que tu vois à l'écran :</p>
<pre class="pseudo">Assistant d'installation ▸ Langue et clavier ▸ Suivant
   ▸ Installer maintenant
   ▸ Choisir l'édition : « Expérience de bureau »   (avec interface graphique)
   ▸ Accepter le contrat de licence
   ▸ Type d'installation : « Personnalisé »
   ▸ Choisir le disque ▸ Suivant
   ▸ (copie des fichiers, redémarrages automatiques)
   ▸ Définir le mot de passe de l'Administrateur local</pre>
<div class="warn">Choisis bien l'édition <strong>« Expérience de bureau »</strong> (Desktop Experience) et non « Server Core ». Server Core n'a PAS d'interface graphique : or tout ce cours repose sur les fenêtres et les clics.</div>
<div class="tip">Le mot de passe de l'<strong>Administrateur</strong> demandé à la fin est celui du compte tout-puissant de la machine. Note-le : sans lui, tu ne pourras pas ouvrir de session.</div>
<h3>3. La première ouverture de session</h3>
<p>Pour ouvrir une session sur un serveur, on appuie d'abord sur <strong>Ctrl+Alt+Suppr</strong> (une sécurité qui garantit que l'écran de connexion est bien le vrai). Puis on tape le nom <code>Administrateur</code> et le mot de passe défini.</p>
<h3>4. Le Gestionnaire de serveur (Server Manager)</h3>
<p>Dès l'ouverture de session, une grande fenêtre s'ouvre automatiquement : le <strong>Gestionnaire de serveur</strong> (en anglais <em>Server Manager</em>). C'est le <strong>tableau de bord</strong> central de Windows Server : de là, on ajoute des rôles, on surveille l'état des services, on gère les serveurs. Analogie : c'est le <strong>poste de pilotage</strong> depuis lequel on commande tout l'avion.</p>
<pre class="pseudo">Gestionnaire de serveur
   ├─ Tableau de bord          (vue d'ensemble, alertes)
   ├─ Serveur local            (nom, réseau, pare-feu, mises à jour)
   ├─ Tous les serveurs
   └─ menu « Gérer » (en haut à droite)  → « Ajouter des rôles et fonctionnalités »</pre>
<h3>5. Le rôle et la fonctionnalité</h3>
<p>Un <strong>rôle</strong> est une grande mission confiée au serveur : « être contrôleur de domaine », « être serveur de fichiers », « être serveur DNS ». Une <strong>fonctionnalité</strong> est un complément plus petit qui aide un rôle. Analogie : le rôle est le <strong>métier</strong> de l'employé (comptable), la fonctionnalité est un <strong>outil</strong> qu'on lui ajoute (une calculatrice). Au jour 3, nous ajouterons le rôle <strong>AD DS</strong>.</p>
<h3>6. Renommer le serveur (bonne pratique)</h3>
<p>Par défaut, le serveur a un nom automatique illisible (par exemple WIN-4F8K…). Avant d'installer AD DS, il est vivement conseillé de lui donner un nom clair comme <code>SRV-DC1</code>. On le fait depuis le tableau de bord :</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Serveur local ▸ clic sur le nom d'ordinateur
   ▸ bouton « Modifier… » ▸ saisir SRV-DC1 ▸ OK ▸ redémarrer</pre>
<div class="warn">Renomme le serveur AVANT de le promouvoir contrôleur de domaine (jour 4). Changer le nom après coup est possible mais bien plus délicat.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert Windows Server par rapport à Windows 11 ?", opts: ["À servir de poste de travail bureautique", "À rendre des services à d'autres ordinateurs en continu", "À se substituer à un pare-feu réseau", "À stocker les fichiers personnels d'un employé"], a: 1, exp: "Windows Server est conçu pour héberger des services (annuaire, fichiers…) en permanence." },
    { type: "qcm", q: "Quelle édition faut-il choisir pour disposer de l'interface graphique ?", opts: ["Server Core", "Expérience de bureau (Desktop Experience)", "Édition Familiale", "Édition Nano Server"], a: 1, exp: "L'Expérience de bureau fournit les fenêtres et les consoles nécessaires à ce cours." },
    { type: "qcm", q: "Comment s'appelle le tableau de bord qui s'ouvre à l'ouverture de session ?", opts: ["L'Explorateur de fichiers", "Le Gestionnaire de serveur (Server Manager)", "Le Panneau de configuration", "Le Gestionnaire des tâches"], a: 1, exp: "Le Gestionnaire de serveur est le point de départ de l'administration." },
    { type: "qcm", q: "Depuis quel menu du Gestionnaire de serveur lance-t-on l'ajout d'un rôle ?", opts: ["Fichier", "Gérer ▸ Ajouter des rôles et fonctionnalités", "Aide", "Affichage"], a: 1, exp: "Le menu « Gérer » (en haut à droite) contient « Ajouter des rôles et fonctionnalités »." },
    { type: "qcm", q: "Qu'est-ce qu'un « rôle » sur Windows Server ?", opts: ["Une simple option d'affichage", "Une grande mission confiée au serveur (ex. contrôleur de domaine)", "Un compte utilisateur", "Un pilote de périphérique"], a: 1, exp: "Un rôle définit la fonction principale du serveur." },
    { type: "qcm", q: "Pourquoi renommer le serveur AVANT de le promouvoir contrôleur de domaine ?", opts: ["Parce que le nom NetBIOS doit correspondre au domaine", "Parce que renommer un DC après coup est délicat", "Pour accélérer le démarrage du serveur", "Ce n'est pas nécessaire"], a: 1, exp: "Le nom est lié à l'identité du contrôleur : on le fixe avant la promotion." },
    { type: "vf", q: "L'édition « Server Core » convient pour suivre un cours entièrement basé sur l'interface graphique.", a: false, exp: "Server Core n'a pas d'interface graphique : il faut l'Expérience de bureau." },
    { type: "vf", q: "On appuie sur Ctrl+Alt+Suppr avant d'ouvrir une session sur Windows Server.", a: true, exp: "Cette combinaison sécurise l'affichage du véritable écran de connexion." },
    { type: "vf", q: "Le compte tout-puissant local créé pendant l'installation s'appelle « Administrateur ».", a: true, exp: "On définit son mot de passe à la fin de l'installation." },
    { type: "input", q: "Quel est le nom (en français) du tableau de bord central de Windows Server ?", a: ["Gestionnaire de serveur", "gestionnaire de serveur", "Server Manager"], ph: "quelques mots", exp: "Le Gestionnaire de serveur, en anglais Server Manager." },
    { type: "input", q: "Comment s'appelle une grande mission confiée au serveur (un mot) ?", a: ["rôle", "role", "un rôle"], ph: "un mot", exp: "Un rôle : par exemple AD DS, DNS, serveur de fichiers." },
    { type: "input", q: "Comment s'appelle un complément plus petit qui aide un rôle (un mot) ?", a: ["fonctionnalité", "fonctionnalite", "une fonctionnalité"], ph: "un mot", exp: "Une fonctionnalité vient compléter un rôle." },
    { type: "input", q: "Quelle combinaison de touches ouvre l'écran de connexion sécurisé du serveur ?", a: ["Ctrl+Alt+Suppr", "ctrl+alt+suppr", "Ctrl Alt Suppr", "Ctrl+Alt+Del"], ph: "trois touches", exp: "Ctrl+Alt+Suppr (Ctrl+Alt+Del en anglais)." },
    { type: "input", q: "Sous quel onglet du Gestionnaire de serveur modifie-t-on le nom de la machine ?", a: ["Serveur local", "serveur local"], ph: "deux mots", exp: "L'onglet « Serveur local » regroupe nom, réseau, pare-feu, mises à jour." },
    { type: "qcm", q: "Pourquoi installe-t-on souvent Windows Server dans une machine virtuelle pour s'entraîner ?", opts: ["Parce qu'une VM est toujours plus rapide qu'un PC physique", "Pour s'exercer sans risque et pouvoir recommencer facilement", "Parce que Windows Server ne fonctionne qu'en machine virtuelle", "Pour héberger plusieurs serveurs sur un seul PC physique"], a: 1, exp: "La machine virtuelle isole les essais : on peut se tromper sans conséquence." }
  ],
  final: {
    title: "Exercice final — Préparer le serveur SRV-DC1",
    intro: `<p>Tu viens d'installer Windows Server 2022 (édition Expérience de bureau) dans une machine virtuelle. Le serveur porte un nom automatique. Tu dois le préparer avant d'ajouter le rôle AD DS demain. Réponds aux questions.</p>`,
    questions: [
      { type: "qcm", q: "Première action après la toute première ouverture de session ?", opts: ["Installer une suite bureautique", "Vérifier que le Gestionnaire de serveur s'ouvre bien", "Repartitionner le disque système", "Désactiver la carte réseau"], a: 1, exp: "Le Gestionnaire de serveur est le point de départ de toute la suite." },
      { type: "input", q: "Sous quel onglet iras-tu pour renommer le serveur en SRV-DC1 ?", a: ["Serveur local", "serveur local"], ph: "deux mots", exp: "Serveur local ▸ clic sur le nom d'ordinateur ▸ Modifier." },
      { type: "vf", q: "Après avoir renommé le serveur, un redémarrage est nécessaire pour appliquer le nouveau nom.", a: true, exp: "Le changement de nom d'ordinateur exige un redémarrage." },
      { type: "input", q: "Quel menu, en haut à droite du Gestionnaire de serveur, servira demain à ajouter le rôle ?", a: ["Gérer", "gérer", "gerer"], ph: "un mot", exp: "Le menu « Gérer » contient « Ajouter des rôles et fonctionnalités »." },
      { type: "qcm", q: "Dans quel ordre faut-il faire les choses ?", opts: ["Promouvoir DC puis renommer", "Renommer et redémarrer, puis ajouter AD DS, puis promouvoir", "Ajouter AD DS avant d'installer Windows", "L'ordre n'a aucune importance"], a: 1, exp: "On fixe le nom AVANT d'installer et promouvoir le contrôleur de domaine." }
    ],
    solution: `<p>Marche à suivre pour préparer SRV-DC1 :</p>
<pre class="pseudo">1. Ouvrir une session : Ctrl+Alt+Suppr ▸ Administrateur ▸ mot de passe
2. Attendre l'ouverture du Gestionnaire de serveur
3. Gestionnaire de serveur ▸ Serveur local
4. Clic sur le nom d'ordinateur (à côté de « Nom de l'ordinateur »)
5. Onglet « Nom de l'ordinateur » ▸ bouton « Modifier… »
6. Saisir SRV-DC1 ▸ OK ▸ OK
7. Redémarrer le serveur quand il le propose
8. Rouvrir une session : le nom SRV-DC1 apparaît désormais dans « Serveur local »</pre>
<p>Le serveur est maintenant nommé proprement et prêt à recevoir le rôle AD DS (jour 3).</p>`
  }
};
</script>
