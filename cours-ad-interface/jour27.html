var DAY = {
  num: 27,
  title: "Surveiller la réplication (outils graphiques)",
  subtitle: "Vérifier que tous les contrôleurs de domaine restent synchronisés.",
  theory: `
<h3>1. Qu'est-ce que la réplication ?</h3>
<p>Quand plusieurs <strong>contrôleurs de domaine</strong> (DC) coexistent, chacun détient une copie de l'annuaire. La <strong>réplication</strong> est le mécanisme qui copie les modifications d'un DC vers les autres, pour que tous aient les <strong>mêmes données</strong>. Créer un utilisateur sur DC1 doit se retrouver sur DC2 en quelques minutes.</p>
<div class="tip">AD utilise une réplication <strong>multimaître</strong> : on peut écrire sur n'importe quel DC, et les changements se propagent aux autres. Cela suppose une synchronisation fiable, d'où l'importance de la surveiller.</div>
<h3>2. Pourquoi surveiller ?</h3>
<p>Si la réplication est cassée (réseau, DNS, DC éteint), les DC <strong>divergent</strong> : un utilisateur créé n'apparaît pas partout, un mot de passe changé n'est pas reconnu ailleurs. Surveiller, c'est détecter tôt ces écarts avant qu'ils ne gênent les utilisateurs.</p>
<h3>3. L'outil de diagnostic : dcdiag</h3>
<p>Le diagnostic de référence est <strong>dcdiag</strong> (Domain Controller Diagnostic) : un outil qui lance une batterie de tests sur un DC et affiche « réussi/échoué » pour chacun, dont le test de réplication.</p>
<pre class="pseudo">dcdiag                          // batterie de tests generale sur le DC local
dcdiag /test:replications       // se concentre sur la sante de la replication
dcdiag /v                       // mode detaille (verbose)</pre>
<h3>4. repadmin : l'état de la réplication</h3>
<p><strong>repadmin</strong> (Replication Administrator) est l'outil dédié à la réplication. Sa commande la plus utile affiche un tableau de l'état entre tous les DC.</p>
<pre class="pseudo">repadmin /replsummary       // resume : erreurs et retards de replication, DC par DC
repadmin /showrepl          // detail des partenaires de replication du DC
repadmin /syncall           // force une synchronisation immediate</pre>
<div class="tip">Bien que ces outils s'exécutent en ligne de commande, ils sont le complément naturel des consoles graphiques : la console Sites et services montre la topologie, ces outils en mesurent la santé.</div>
<h3>5. Forcer la réplication dans Sites et services</h3>
<p>On peut déclencher une réplication <strong>à la souris</strong> depuis la console Sites et services, sans attendre le cycle automatique.</p>
<pre class="pseudo">Sites et services ▸ Sites ▸ [site] ▸ Servers ▸ [DC] ▸ NTDS Settings
   ▸ clic droit sur l'objet de connexion ▸ Répliquer maintenant   // declenche une replication immediate</pre>
<h3>6. Lire les journaux d'événements</h3>
<p>La console <strong>Observateur d'événements</strong> (Event Viewer) contient un journal spécial <strong>Directory Service</strong> où AD écrit ses avertissements et erreurs. Les problèmes de réplication y laissent des traces datées et numérotées (ID d'événement).</p>
<pre class="pseudo">Observateur d'événements ▸ Journaux des applications et des services
   ▸ Directory Service          // avertissements et erreurs propres a AD
   ▸ DNS Server / File Replication Service (SYSVOL)   // journaux connexes utiles</pre>
<h3>7. La bonne routine</h3>
<p>Un administrateur vigilant vérifie régulièrement : <code>repadmin /replsummary</code> (aucun échec), <code>dcdiag</code> (tous les tests réussis), et un coup d'œil au journal Directory Service. Trois gestes simples qui évitent bien des surprises.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que la réplication AD ?", opts: ["La sauvegarde sur bande", "La copie des modifications d'un DC vers les autres pour les garder synchronisés", "Le chiffrement des mots de passe", "La création de GPO"], a: 1, exp: "Elle maintient des données identiques sur tous les DC." },
    { type: "qcm", q: "Que se passe-t-il si la réplication est cassée ?", opts: ["Rien", "Les DC divergent : un objet créé n'apparaît pas partout", "Le DNS s'améliore", "Les GPO se dupliquent"], a: 1, exp: "Divergence des données entre DC : source de pannes." },
    { type: "qcm", q: "Quelle commande donne un résumé de l'état de réplication entre DC ?", opts: ["gpupdate /force", "repadmin /replsummary", "nslookup", "ipconfig"], a: 1, exp: "repadmin /replsummary : erreurs et retards, DC par DC." },
    { type: "qcm", q: "À quoi sert dcdiag ?", opts: ["À mapper un lecteur", "À lancer une batterie de tests de diagnostic sur un DC", "À créer une OU", "À installer le DNS"], a: 1, exp: "Domain Controller Diagnostic : tests réussi/échoué." },
    { type: "qcm", q: "Comment forcer une réplication à la souris ?", opts: ["Dans GPMC", "Sites et services ▸ NTDS Settings ▸ clic droit sur la connexion ▸ Répliquer maintenant", "Dans le DNS", "Dans ADAC"], a: 1, exp: "La console Sites et services permet de déclencher la réplication." },
    { type: "qcm", q: "Quel journal de l'Observateur d'événements est propre à AD ?", opts: ["Application", "Directory Service", "Sécurité", "Système"], a: 1, exp: "Directory Service recueille les événements d'AD." },
    { type: "vf", q: "AD utilise une réplication multimaître : on peut écrire sur n'importe quel DC.", a: true, exp: "Les changements se propagent ensuite aux autres DC." },
    { type: "vf", q: "repadmin /syncall force une synchronisation immédiate.", a: true, exp: "Elle déclenche la réplication sans attendre le cycle normal." },
    { type: "vf", q: "Une réplication cassée est sans conséquence pour les utilisateurs.", a: false, exp: "Au contraire : objets manquants, mots de passe non reconnus, etc." },
    { type: "input", q: "Quel outil (ligne de commande) est dédié à l'administration de la réplication ?", a: ["repadmin", "Repadmin"], ph: "outil", exp: "Replication Administrator." },
    { type: "input", q: "Quel outil lance une batterie de tests de diagnostic sur un DC ?", a: ["dcdiag", "Dcdiag"], ph: "outil", exp: "Domain Controller Diagnostic." },
    { type: "input", q: "Quelle option de repadmin affiche le résumé (erreurs/retards) ? (/…)", a: ["/replsummary", "replsummary", "repadmin /replsummary"], ph: "option", exp: "repadmin /replsummary." },
    { type: "input", q: "Sous quel objet, dans Sites et services, trouve-t-on « Répliquer maintenant » ? (NTDS …)", a: ["Settings", "NTDS Settings", "settings"], ph: "objet", exp: "NTDS Settings du DC." },
    { type: "input", q: "Quel journal de l'Observateur d'événements montre les erreurs propres à AD ?", a: ["Directory Service", "directory service"], ph: "journal", exp: "Le journal Directory Service." },
    { type: "input", q: "Quelle console graphique montre la topologie (sites, serveurs, connexions) ?", a: ["Sites et services", "sites et services", "Sites et services Active Directory"], ph: "console", exp: "Sites et services Active Directory." }
  ],
  final: {
    title: "Exercice final — Un utilisateur créé n'apparaît pas sur DC2",
    intro: `<p>Un compte créé sur <strong>DC1</strong> reste invisible sur <strong>DC2</strong> après une heure. On suspecte un problème de réplication. Réponds sur la démarche de diagnostic.</p>`,
    questions: [
      { type: "qcm", q: "Premier réflexe pour évaluer la santé globale ?", opts: ["Supprimer le compte", "Lancer repadmin /replsummary", "Redémarrer la box", "Créer une GPO"], a: 1, exp: "Le résumé montre erreurs et retards entre DC." },
      { type: "input", q: "Quelle commande lance une batterie de tests sur DC2 ?", a: ["dcdiag", "Dcdiag"], ph: "commande", exp: "dcdiag exécute les tests de diagnostic." },
      { type: "qcm", q: "Quelle cause fréquente vérifier en priorité ?", opts: ["La couleur du fond d'écran", "Le DNS (résolution des DC entre eux)", "Le nombre de GPO", "La taille de l'écran"], a: 1, exp: "Un DNS défaillant casse souvent la réplication." },
      { type: "input", q: "Dans quel journal de l'Observateur d'événements chercher les erreurs AD ?", a: ["Directory Service", "directory service"], ph: "journal", exp: "Le journal Directory Service." },
      { type: "vf", q: "On peut forcer la réplication depuis Sites et services (Répliquer maintenant) pour tester.", a: true, exp: "Cela déclenche immédiatement la synchronisation." }
    ],
    solution: `<p>Marche à suivre de diagnostic :</p>
<pre class="pseudo">1. repadmin /replsummary          // repérer les échecs/retards DC1 ↔ DC2
2. repadmin /showrepl             // détailler les partenaires et la dernière réplication réussie
3. dcdiag /test:replications      // tests ciblés de réplication sur les DC
4. Vérifier le DNS : chaque DC doit résoudre l'autre (nslookup), enregistrements SRV présents
5. Observateur d'événements ▸ Directory Service        // lire les ID d'erreur datés
6. Sites et services ▸ NTDS Settings de DC2 ▸ clic droit connexion ▸ Répliquer maintenant
7. Recontrôler que le compte créé sur DC1 apparaît désormais sur DC2</pre>
<p>Neuf fois sur dix, une réplication bloquée cache un souci de DNS ou de connectivité entre les DC. Les outils repadmin et dcdiag pointent la cause, et Sites et services permet de relancer la synchronisation à la main.</p>`
  }
};
</script>
