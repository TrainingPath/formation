<script>
var DAY = {
  num: 15,
  title: "Gérer les ordinateurs du domaine",
  subtitle: "Objets ordinateur : déplacer, désactiver, réinitialiser le compte, retirer un poste.",
  theory: `
<h3>1. L'objet ordinateur</h3>
<p>Chaque PC joint au domaine possède un <strong>objet ordinateur</strong> dans l'annuaire, exactement comme un utilisateur a un objet utilisateur. Cet objet a un nom (ex. <code>PC-COMPTA01</code>), un <strong>mot de passe</strong> (géré automatiquement par la machine, pas par un humain), et des propriétés. Analogie : c'est la <strong>carte d'identité du PC</strong> dans le domaine.</p>
<pre class="pseudo">ADUC ▸ conteneur « Computers » (ou l'OU où tu l'as déplacé) ▸ double-clic sur l'ordinateur
   → onglets : Général | Système d'exploitation | Membre de | Emplacement | Géré par…</pre>
<h3>2. Déplacer un ordinateur dans la bonne OU</h3>
<p>Par défaut, les nouveaux PC arrivent dans <code>Computers</code>, qui ne reçoit pas de GPO. Pour appliquer des stratégies, on déplace l'objet vers une OU dédiée (comme au jour 11 pour les utilisateurs) :</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'ordinateur ▸ Déplacer… ▸ choisir OU Comptabilite\Ordinateurs ▸ OK</pre>
<h3>3. Désactiver un compte ordinateur</h3>
<p>Comme pour un utilisateur, on peut <strong>désactiver</strong> un compte ordinateur (par exemple un poste envoyé en réparation). Tant qu'il est désactivé, la machine ne peut plus s'authentifier auprès du domaine.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'ordinateur ▸ « Désactiver le compte » ▸ confirmer
   → une flèche vers le bas apparaît sur l'icône</pre>
<h3>4. Réinitialiser un compte ordinateur</h3>
<p>Parfois, un PC perd la « relation d'approbation » avec le domaine (message : <em>« La relation d'approbation entre ce poste et le domaine a échoué »</em>). Cela vient d'une désynchronisation du mot de passe machine. La solution graphique côté serveur :</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'ordinateur ▸ « Réinitialiser le compte » ▸ Oui
   → puis, côté client, quitter et re-joindre le domaine (ou réintégrer le poste)</pre>
<div class="warn">« Réinitialiser le compte » ordinateur n'est PAS la même chose que réinitialiser un mot de passe utilisateur. Ici, on remet à zéro le canal sécurisé entre le PC et le domaine. À utiliser quand la relation d'approbation est cassée.</div>
<h3>5. Retirer un ordinateur du domaine</h3>
<p>Quand un poste est réformé, on procède en deux temps :</p>
<pre class="pseudo">Côté CLIENT : Propriétés système ▸ Modifier ▸ repasser en Groupe de travail ▸ redémarrer
Côté SERVEUR : ADUC ▸ clic droit sur l'objet ordinateur ▸ Supprimer ▸ confirmer</pre>
<div class="tip">Ordre conseillé : d'abord sortir le PC côté client (retour en groupe de travail), puis supprimer l'objet obsolète côté serveur pour garder l'annuaire propre.</div>
<h3>6. Lire les informations utiles</h3>
<p>L'onglet <strong>Système d'exploitation</strong> indique la version de Windows du poste (utile pour l'inventaire). L'onglet <strong>Membre de</strong> montre les groupes de l'ordinateur (oui, un ordinateur peut être membre de groupes). L'onglet <strong>Géré par</strong> permet d'indiquer un responsable.</p>
<h3>7. Bonnes pratiques</h3>
<pre class="pseudo">- Déplacer chaque PC dans l'OU correspondant à son service (pour les GPO)
- Désactiver plutôt que supprimer un poste temporairement hors service
- Supprimer les objets ordinateurs obsolètes pour éviter un annuaire encombré
- Réinitialiser le compte en cas de « relation d'approbation » cassée</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un objet ordinateur dans AD ?", opts: ["Un dossier partagé", "La fiche d'identité d'un PC joint au domaine", "Un dossier personnel", "Une GPO"], a: 1, exp: "Chaque PC membre du domaine a son objet ordinateur dans l'annuaire." },
    { type: "qcm", q: "Qui gère le mot de passe d'un compte ordinateur ?", opts: ["L'utilisateur", "La machine, automatiquement", "Personne", "Le DNS"], a: 1, exp: "Le mot de passe machine est géré automatiquement par l'ordinateur." },
    { type: "qcm", q: "Pourquoi déplacer un PC hors du conteneur Computers ?", opts: ["Pour le cacher", "Pour qu'il reçoive les GPO de l'OU cible", "Pour le supprimer", "Pour le renommer"], a: 1, exp: "Computers ne reçoit pas de GPO ; on déplace vers une OU." },
    { type: "qcm", q: "Que provoque la désactivation d'un compte ordinateur ?", opts: ["Rien", "La machine ne peut plus s'authentifier au domaine", "Le PC s'éteint", "Le domaine est supprimé"], a: 1, exp: "Un ordinateur désactivé ne peut plus se connecter au domaine." },
    { type: "qcm", q: "Le message « La relation d'approbation entre ce poste et le domaine a échoué » se règle par…", opts: ["Le remplacement de la carte réseau", "Réinitialiser le compte ordinateur, puis réintégrer le poste", "La suppression du domaine", "Le changement de compte utilisateur"], a: 1, exp: "On réinitialise le compte ordinateur pour rétablir le canal sécurisé." },
    { type: "qcm", q: "Quel onglet indique la version de Windows du poste ?", opts: ["Général", "Système d'exploitation", "Membre de", "Géré par"], a: 1, exp: "L'onglet Système d'exploitation renseigne la version de Windows." },
    { type: "vf", q: "Un ordinateur peut être membre de groupes dans AD.", a: true, exp: "L'onglet « Membre de » d'un ordinateur liste ses groupes." },
    { type: "vf", q: "Réinitialiser un compte ordinateur revient à réinitialiser le mot de passe d'un utilisateur.", a: false, exp: "Ce sont deux opérations différentes : l'une concerne le canal machine-domaine." },
    { type: "vf", q: "Pour réformer un poste, on le repasse en groupe de travail côté client puis on supprime son objet côté serveur.", a: true, exp: "C'est l'ordre conseillé pour garder l'annuaire propre." },
    { type: "input", q: "Dans quel conteneur arrivent par défaut les nouveaux ordinateurs (un mot) ?", a: ["Computers", "computers"], ph: "un mot", exp: "Le conteneur Computers." },
    { type: "input", q: "Quelle action du clic droit rétablit le canal sécurisé cassé (deux mots) ?", a: ["Réinitialiser le compte", "réinitialiser le compte", "reinitialiser le compte", "Réinitialiser"], ph: "deux mots", exp: "« Réinitialiser le compte » ordinateur." },
    { type: "input", q: "Quelle action rend un poste temporairement inutilisable sans le supprimer (un mot) ?", a: ["Désactiver", "désactiver", "desactiver"], ph: "un mot", exp: "« Désactiver le compte »." },
    { type: "input", q: "Dans quel onglet voit-on les groupes d'un ordinateur (deux mots) ?", a: ["Membre de", "membre de"], ph: "deux mots", exp: "L'onglet « Membre de »." },
    { type: "input", q: "Comment appelle-t-on le lien de confiance cassé entre le PC et le domaine (deux mots) ?", a: ["relation d'approbation", "relation d'approbation", "relation approbation"], ph: "deux mots", exp: "La relation d'approbation." },
    { type: "qcm", q: "Un PC part définitivement à la casse. Quelle est la bonne fin de vie de son objet AD ?", opts: ["Le laisser tel quel", "Le supprimer de l'annuaire une fois le poste sorti", "Le renommer", "Le déplacer dans Users"], a: 1, exp: "On supprime l'objet obsolète pour garder l'annuaire propre." }
  ],
  final: {
    title: "Exercice final — Dépanner une relation d'approbation cassée",
    intro: `<p>Au démarrage, PC-COMPTA01 affiche « La relation d'approbation entre ce poste et le domaine a échoué ». Personne ne peut ouvrir de session de domaine dessus. Décris comment réparer via l'interface graphique.</p>`,
    questions: [
      { type: "qcm", q: "Quelle est la cause de ce message ?", opts: ["La carte réseau est débranchée", "Le mot de passe machine est désynchronisé (canal sécurisé cassé)", "Le DNS est éteint", "Le domaine n'existe plus"], a: 1, exp: "La relation d'approbation cassée vient d'une désynchronisation du compte ordinateur." },
      { type: "input", q: "Côté serveur, quelle action du clic droit appliques-tu sur l'objet (deux mots) ?", a: ["Réinitialiser le compte", "réinitialiser le compte", "reinitialiser le compte"], ph: "deux mots", exp: "« Réinitialiser le compte » ordinateur dans ADUC." },
      { type: "vf", q: "Après réinitialisation, il faut réintégrer le poste au domaine côté client.", a: true, exp: "On rétablit ensuite l'appartenance côté PC." },
      { type: "input", q: "Dans quelle console (sigle) fais-tu la réinitialisation côté serveur ?", a: ["ADUC", "aduc"], ph: "un sigle", exp: "ADUC gère les objets ordinateurs." },
      { type: "qcm", q: "Alternative simple côté client si besoin ?", opts: ["Réinstaller Windows systématiquement", "Sortir le PC du domaine (groupe de travail), redémarrer, puis re-joindre le domaine", "Remplacer l'écran du poste", "Désinstaller le service DNS"], a: 1, exp: "Quitter puis re-joindre le domaine rétablit la relation." }
    ],
    solution: `<p>Réparer PC-COMPTA01 :</p>
<pre class="pseudo">Côté SERVEUR (ADUC) :
1. Ouvrir ADUC ▸ localiser l'objet PC-COMPTA01 (Computers ou son OU)
2. Clic droit ▸ « Réinitialiser le compte » ▸ Oui

Côté CLIENT :
3. Ouvrir une session avec un compte LOCAL administrateur du PC
4. Propriétés système (sysdm.cpl) ▸ Modifier ▸ repasser en Groupe de travail ▸ OK ▸ redémarrer
5. Rejoindre à nouveau le domaine : Modifier ▸ Domaine : entreprise.local
      ▸ compte autorisé + mot de passe ▸ OK ▸ redémarrer
6. Ouvrir une session de domaine (entreprise\mdurand) : le message a disparu</pre>
<p>La relation d'approbation est rétablie ; le poste retrouve sa place dans le domaine.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "adgui-j15", title: "Déplacer et désactiver un objet ordinateur", level: 2,
    statement: "Le poste <code>PC-COMM01</code> vient d'être joint au domaine et se trouve dans le conteneur Computers. Déplace-le vers l'OU <code>Commercial\\Ordinateurs</code>, puis, comme il part en réparation, désactive son compte. Décris chaque étape dans ADUC.",
    hints: [
      "Le déplacement se fait via clic droit ▸ Déplacer…",

    ],
    solution: "1. Ouvrir ADUC ▸ deplier entreprise.local ▸ cliquer sur le conteneur Computers.\n2. Reperer PC-COMM01 dans le volet droit.\n3. Clic droit sur PC-COMM01 ▸ « Deplacer… ».\n4. Dans l'arborescence, deplier Commercial et selectionner la sous-OU Ordinateurs ▸ OK.\n5. Verifier que PC-COMM01 apparait desormais dans Commercial\\Ordinateurs.\n6. Le poste part en reparation : clic droit sur PC-COMM01 ▸ « Desactiver le compte » ▸ confirmer (Oui/OK).\n7. Verifier que l'icone de l'ordinateur affiche une petite fleche vers le bas (compte desactive).\n8. (Retour de reparation) Clic droit ▸ « Activer le compte » pour le remettre en service.",
    checklist: ["PC-COMM01 se trouve-t-il maintenant dans l'OU Commercial\\Ordinateurs ?", "L'icône de l'ordinateur affiche-t-elle la flèche vers le bas (compte désactivé) ?", "As-tu retenu que, désactivé, le poste ne peut plus authentifier de session de domaine ?", "Sais-tu le réactiver au retour de réparation ?"],
    atoi: {"cmd": "Get-ADComputer -Identity PC-COMM01 -Properties CanonicalName | Select-Object Name,Enabled,CanonicalName", "expected": "Name      Enabled CanonicalName\n----      ------- -------------\nPC-COMM01   False entreprise.local/Commercial/Ordinateurs/PC-COMM01"},

  ]
};
</script>
