<script>
var DAY = {
  num: 12,
  title: "Créer des groupes (types et étendues)",
  subtitle: "Comprendre groupes de sécurité, de distribution, et les trois étendues.",
  theory: `
<h3>1. À quoi sert un groupe ?</h3>
<p>Un <strong>groupe</strong> rassemble plusieurs comptes pour leur donner des droits ou leur envoyer des messages <strong>en une seule fois</strong>. Analogie : au lieu de distribuer une clé à chaque employé de la compta, on crée un <strong>trousseau « Compta »</strong> ; ouvrir un accès au trousseau l'ouvre à tous ses membres. C'est le principe : on donne des droits AU GROUPE, et les membres en héritent.</p>
<div class="tip">Règle d'or de l'administration : <strong>on affecte les droits à des groupes, pas à des utilisateurs individuels</strong>. Ainsi, pour donner un accès à un nouvel employé, il suffit de l'ajouter au bon groupe.</div>
<h3>2. Deux TYPES de groupe</h3>
<pre class="pseudo">Groupe de SÉCURITÉ      → sert à donner des DROITS/permissions (accès à un dossier, une imprimante…)
                          (peut aussi servir de liste de diffusion)
Groupe de DISTRIBUTION  → sert UNIQUEMENT de liste d'envoi d'e-mails (aucun droit d'accès)</pre>
<div class="warn">Pour gérer des permissions, choisis toujours un groupe de <strong>sécurité</strong>. Le groupe de <strong>distribution</strong> ne sert qu'à la messagerie (par exemple avec Exchange) et ne peut PAS accorder de droits.</div>
<h3>3. Trois ÉTENDUES de groupe</h3>
<p>L'<strong>étendue</strong> (en anglais <em>scope</em>) définit « jusqu'où » le groupe est visible et quels membres il peut contenir :</p>
<pre class="pseudo">Domaine local   → droits sur des ressources d'UN SEUL domaine ; peut contenir des membres de partout
Globale         → regroupe des comptes d'UN MÊME domaine ; visible dans toute la forêt
Universelle     → visible et utilisable dans TOUTE la forêt ; pour les environnements multi-domaines</pre>
<div class="tip">Moyen mnémotechnique classique (stratégie « AGDLP ») : on met les <strong>comptes</strong> (A) dans des groupes <strong>Globaux</strong> (G), qu'on place dans des groupes <strong>Domaine Local</strong> (DL), auxquels on attribue les <strong>Permissions</strong> (P). Pour un domaine unique, retiens surtout : <strong>Globale</strong> pour regrouper les gens, <strong>Domaine local</strong> pour porter les droits.</div>
<h3>4. Créer un groupe pas à pas</h3>
<pre class="pseudo">ADUC ▸ clic droit sur l'OU voulue ▸ Nouveau ▸ Groupe
   ▸ Nom du groupe : G_Comptabilite
   ▸ Étendue du groupe : (o) Globale   ( ) Domaine local   ( ) Universelle
   ▸ Type de groupe :   (o) Sécurité   ( ) Distribution
   ▸ OK</pre>
<div class="tip">Adopte une convention de nommage : préfixe <code>G_</code> pour un groupe global, <code>DL_</code> pour un domaine local, par exemple <code>G_Comptabilite</code>, <code>DL_Partage_Compta</code>. On repère ainsi l'étendue d'un coup d'œil.</div>
<h3>5. Choisir type et étendue : cas courants</h3>
<pre class="pseudo">Donner accès à un dossier partagé du service       → Sécurité, Domaine local
Regrouper tous les employés de la Compta            → Sécurité, Globale
Liste d'e-mails « tous@ » sans aucun droit          → Distribution, Globale
Groupe couvrant plusieurs domaines de la forêt      → Universelle</pre>
<h3>6. Les groupes intégrés</h3>
<p>Windows fournit des groupes prêts à l'emploi dans <code>Builtin</code> et <code>Users</code> : <strong>Administrateurs du domaine</strong> (Domain Admins), <strong>Utilisateurs du domaine</strong> (Domain Users), <strong>Opérateurs de sauvegarde</strong>, etc. On s'appuie dessus plutôt que de tout recréer.</p>
<div class="warn">Le groupe <strong>Admins du domaine</strong> est très puissant : n'y place que le strict nécessaire. Un membre de ce groupe peut tout faire dans le domaine.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert principalement un groupe ?", opts: ["À accélérer le réseau", "À donner des droits (ou envoyer des messages) à plusieurs comptes en une fois", "À chiffrer le disque", "À renommer le domaine"], a: 1, exp: "Un groupe applique droits ou diffusion à tous ses membres d'un coup." },
    { type: "qcm", q: "Quel type de groupe sert à accorder des permissions d'accès ?", opts: ["Distribution", "Sécurité", "Universel", "Aucun"], a: 1, exp: "Seul le groupe de sécurité peut porter des droits." },
    { type: "qcm", q: "À quoi sert UNIQUEMENT un groupe de distribution ?", opts: ["À donner des droits", "À servir de liste d'envoi d'e-mails", "À joindre un PC au domaine", "À créer des OU"], a: 1, exp: "La distribution ne fait que de la messagerie, sans aucun droit." },
    { type: "qcm", q: "Que définit l'étendue d'un groupe ?", opts: ["Sa couleur", "Jusqu'où il est visible et quels membres il peut contenir", "Son mot de passe", "Sa date de création"], a: 1, exp: "L'étendue fixe la portée et les membres possibles." },
    { type: "qcm", q: "Quelle étendue regroupe des comptes d'un même domaine et est visible dans toute la forêt ?", opts: ["Domaine local", "Globale", "Universelle", "Distribution"], a: 1, exp: "L'étendue Globale regroupe des comptes du même domaine." },
    { type: "qcm", q: "Quelle étendue convient à un environnement multi-domaines couvrant toute la forêt ?", opts: ["Domaine local", "Globale", "Universelle", "Aucune"], a: 2, exp: "L'étendue Universelle est visible dans toute la forêt." },
    { type: "vf", q: "Un groupe de distribution peut accorder l'accès à un dossier partagé.", a: false, exp: "Non : seul un groupe de sécurité porte des droits." },
    { type: "vf", q: "La bonne pratique est d'affecter les droits à des groupes plutôt qu'à des utilisateurs.", a: true, exp: "On gère ainsi les accès plus simplement et durablement." },
    { type: "vf", q: "Le groupe « Admins du domaine » est très puissant et doit rester restreint.", a: true, exp: "Ses membres peuvent tout faire dans le domaine." },
    { type: "input", q: "Quel type de groupe choisir pour porter des permissions (un mot) ?", a: ["Sécurité", "sécurité", "securite", "de sécurité"], ph: "un mot", exp: "Le type Sécurité." },
    { type: "input", q: "Quel sous-menu du clic droit crée un groupe (Nouveau ▸ ?) ?", a: ["Groupe", "groupe"], ph: "un mot", exp: "Clic droit ▸ Nouveau ▸ Groupe." },
    { type: "input", q: "Quelle étendue (un mot) sert typiquement à regrouper les employés d'un même domaine ?", a: ["Globale", "globale", "global"], ph: "un mot", exp: "L'étendue Globale." },
    { type: "input", q: "Quelle étendue (deux mots) porte typiquement les droits sur une ressource d'un seul domaine ?", a: ["Domaine local", "domaine local"], ph: "deux mots", exp: "L'étendue Domaine local." },
    { type: "input", q: "Comment nomme-t-on le groupe intégré tout-puissant des administrateurs (deux mots en français) ?", a: ["Admins du domaine", "admins du domaine", "Administrateurs du domaine", "Domain Admins"], ph: "deux mots", exp: "Admins du domaine (Domain Admins)." },
    { type: "qcm", q: "Tu veux donner accès à un dossier partagé aux comptables. Quel choix ?", opts: ["Distribution, Universelle", "Sécurité, Domaine local (avec les comptes via un groupe Global)", "Distribution, Globale", "Aucun groupe, droits individuels"], a: 1, exp: "Sécurité + Domaine local pour porter le droit ; les comptes arrivent via un groupe Global (AGDLP)." }
  ],
  final: {
    title: "Exercice final — Créer les groupes de la Comptabilité",
    intro: `<p>Tu veux (1) regrouper tous les comptables et (2) leur donner accès à un dossier partagé « Compta ». Décris quels groupes créer, avec quels types et étendues, et comment les créer dans ADUC.</p>`,
    questions: [
      { type: "input", q: "Quel type de groupe choisis-tu pour porter des droits (un mot) ?", a: ["Sécurité", "sécurité", "securite"], ph: "un mot", exp: "Type Sécurité : lui seul porte des permissions." },
      { type: "qcm", q: "Pour REGROUPER les comptes des comptables, quelle étendue ?", opts: ["Domaine local", "Globale", "Distribution", "Aucune"], a: 1, exp: "Globale pour regrouper les comptes du domaine (le « G » d'AGDLP)." },
      { type: "qcm", q: "Pour PORTER le droit d'accès au dossier partagé, quelle étendue ?", opts: ["Globale", "Domaine local", "Universelle", "Distribution"], a: 1, exp: "Domaine local pour porter la permission (le « DL » d'AGDLP)." },
      { type: "vf", q: "Un groupe de distribution conviendrait pour donner cet accès au dossier.", a: false, exp: "Non : il faut un groupe de sécurité pour porter des droits." },
      { type: "input", q: "Quel chemin de menu crée un groupe (Nouveau ▸ ?) ?", a: ["Groupe", "groupe"], ph: "un mot", exp: "Clic droit sur l'OU ▸ Nouveau ▸ Groupe." }
    ],
    solution: `<p>Deux groupes à créer (approche AGDLP) :</p>
<pre class="pseudo">1. Groupe qui REGROUPE les comptables :
   ADUC ▸ clic droit sur OU Comptabilite ▸ Nouveau ▸ Groupe
      Nom : G_Comptabilite
      Étendue : Globale   |   Type : Sécurité   ▸ OK

2. Groupe qui PORTE le droit sur le dossier partagé :
   ADUC ▸ clic droit sur l'OU appropriée ▸ Nouveau ▸ Groupe
      Nom : DL_Partage_Compta
      Étendue : Domaine local   |   Type : Sécurité   ▸ OK

3. Ensuite (jour 13) : ajouter les utilisateurs dans G_Comptabilite,
   puis ajouter G_Comptabilite comme membre de DL_Partage_Compta,
   et attribuer au dossier la permission via DL_Partage_Compta.</pre>
<p>Résultat : ajouter un nouveau comptable à G_Comptabilite lui donne automatiquement l'accès au dossier.</p>`
  }
};
</script>
