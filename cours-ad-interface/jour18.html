  title: "Configurer une stratégie de mot de passe",
  subtitle: "Imposer des mots de passe solides à tout le domaine, depuis l'interface.",
  theory: `
<h3>1. Pourquoi une stratégie de mot de passe ?</h3>
<p>Une <strong>stratégie de mot de passe</strong> (password policy) est un ensemble de règles qui obligent les utilisateurs à choisir des mots de passe sûrs : assez longs, changés régulièrement, non réutilisés. Sans elle, chacun mettrait « 1234 », et un seul compte faible peut ouvrir tout le réseau à un attaquant.</p>
<h3>2. Où se trouve-t-elle ?</h3>
<p>Dans un domaine Active Directory, la stratégie de mot de passe « du domaine » se règle dans la GPO nommée <strong>Default Domain Policy</strong>. C'est l'un des rares cas où l'on modifie légitimement cette GPO, car la règle des mots de passe est unique pour tout le domaine.</p>
<pre class="pseudo">GPMC ▸ Domaines ▸ mondomaine.local ▸ clic droit sur Default Domain Policy ▸ Modifier
Editeur ▸ Configuration ordinateur ▸ Strategies ▸ Parametres Windows
   ▸ Parametres de securite ▸ Strategies de comptes ▸ Strategie de mot de passe</pre>
<h3>3. Les paramètres à connaître</h3>
<p>Sous <strong>Stratégie de mot de passe</strong>, on trouve les réglages suivants (double-clic pour définir chaque valeur) :</p>
<pre class="pseudo">Longueur minimale du mot de passe          → ex. 12 caracteres
Le mot de passe doit respecter des exigences de complexité   → Activé (majuscules, chiffres, symboles)
Durée de vie maximale du mot de passe      → ex. 90 jours (au-dela, changement force)
Durée de vie minimale du mot de passe      → ex. 1 jour (empeche de changer 5 fois d'affilee)
Conserver l'historique des mots de passe   → ex. 5 (interdit de reutiliser les 5 derniers)</pre>
<div class="tip">La <strong>complexité</strong> exige au moins trois familles de caractères parmi : majuscules, minuscules, chiffres, symboles. « Motdepasse » est refusé ; « Mot2Passe! » est accepté.</div>
<h3>4. La stratégie de verrouillage de compte</h3>
<p>Juste à côté se trouve la <strong>Stratégie de verrouillage du compte</strong> (account lockout). Elle bloque temporairement un compte après plusieurs mauvais mots de passe, pour contrer les attaques par essais répétés (brute force).</p>
<pre class="pseudo">Editeur ▸ ... ▸ Strategies de comptes ▸ Strategie de verrouillage du compte
   Seuil de verrouillage du compte      → ex. 5 tentatives echouees
   Durée de verrouillage du compte      → ex. 15 minutes
   Réinitialiser le compteur après      → ex. 15 minutes</pre>
<div class="warn">Un seuil trop bas (ex. 3) verrouille les gens pour une simple faute de frappe. Un seuil de 5 à 10 est un bon compromis.</div>
<h3>5. Une politique différente pour certains ? (PSO)</h3>
<p>Par défaut, la stratégie de mot de passe est <strong>la même pour tout le domaine</strong>. Pour imposer des règles plus strictes à un groupe précis (ex. les administrateurs), on utilise un <strong>PSO</strong> (Password Settings Object, « objet de paramètres de mot de passe »). Il se crée dans la console <strong>ADAC</strong> (Active Directory Administrative Center, « Centre d'administration Active Directory »).</p>
<pre class="pseudo">ADAC ▸ System ▸ Password Settings Container ▸ Nouveau ▸ Password Settings
   → definir longueur, complexite, etc. ▸ ajouter le groupe cible (ex. Admins)</pre>
<h3>6. Appliquer et vérifier</h3>
<p>Comme toute GPO, les nouveaux réglages descendent au prochain rafraîchissement, ou via <code>gpupdate /force</code>. Ils s'appliquent au <strong>prochain changement</strong> de mot de passe : les mots de passe existants ne sont pas invalidés d'un coup.</p>`,
  exercises: [
    { type: "qcm", q: "Dans quelle GPO se règle la stratégie de mot de passe du domaine ?", opts: ["Une GPO quelconque liée à une OU", "La Default Domain Policy", "Le DNS", "La corbeille AD"], a: 1, exp: "La règle des mots de passe est unique pour tout le domaine." },
    { type: "qcm", q: "Que fait la stratégie de verrouillage de compte ?", opts: ["Supprime le compte", "Bloque temporairement après trop de mauvais mots de passe", "Change le mot de passe", "Désactive le DNS"], a: 1, exp: "Elle contre les attaques par essais répétés (brute force)." },
    { type: "qcm", q: "L'exigence de complexité impose…", opts: ["Un mot de passe de 4 chiffres", "Au moins trois familles de caractères (majuscules, chiffres, symboles…)", "Un seul caractère", "Le même mot de passe pour tous"], a: 1, exp: "Plusieurs familles rendent le mot de passe plus difficile à deviner." },
    { type: "qcm", q: "À quoi sert l'historique des mots de passe ?", opts: ["À afficher les anciens mots de passe", "À empêcher de réutiliser les derniers mots de passe", "À supprimer le compte", "À accélérer la connexion"], a: 1, exp: "Conserver l'historique interdit le recyclage des anciens mots de passe." },
    { type: "qcm", q: "Pour des règles PLUS strictes réservées aux administrateurs, on utilise…", opts: ["Une deuxième Default Domain Policy", "Un PSO (Password Settings Object)", "Le DNS", "Un site AD"], a: 1, exp: "Le PSO cible un groupe précis avec ses propres règles." },
    { type: "qcm", q: "Quand les nouvelles règles de longueur s'appliquent-elles aux utilisateurs ?", opts: ["Immédiatement, en invalidant tous les mots de passe", "Au prochain changement de mot de passe", "Jamais", "Seulement au redémarrage du serveur"], a: 1, exp: "Les mots de passe existants restent valides jusqu'à leur prochain changement." },
    { type: "vf", q: "La stratégie de mot de passe du domaine est, par défaut, la même pour tous les comptes du domaine.", a: true, exp: "Une seule politique globale, sauf PSO ciblé." },
    { type: "vf", q: "Un seuil de verrouillage de 3 tentatives est idéal en entreprise.", a: false, exp: "Trop bas : une faute de frappe verrouille. On préfère 5 à 10." },
    { type: "vf", q: "La durée de vie minimale d'un mot de passe empêche de le changer plusieurs fois d'affilée pour contourner l'historique.", a: true, exp: "Elle force à attendre avant de rechanger, ce qui protège l'historique." },
    { type: "input", q: "Quel est le sigle (3 lettres) de l'objet qui applique une politique de mot de passe à un groupe précis ?", a: ["PSO", "pso"], ph: "sigle", exp: "Password Settings Object." },
    { type: "input", q: "Comment s'appelle la GPO où l'on règle la politique de mot de passe du domaine ? (nom exact)", a: ["Default Domain Policy", "default domain policy"], ph: "nom de la GPO", exp: "C'est la GPO liée au domaine par défaut." },
    { type: "input", q: "Sous quel dossier de l'éditeur trouve-t-on « Stratégie de mot de passe » ? (le dossier parent)", a: ["Stratégies de comptes", "Strategies de comptes", "stratégies de comptes"], ph: "dossier parent", exp: "Paramètres de sécurité ▸ Stratégies de comptes." },
    { type: "input", q: "Quel réglage définit le nombre maximal de jours avant changement forcé ? (nom du paramètre)", a: ["Durée de vie maximale du mot de passe", "duree de vie maximale du mot de passe", "durée de vie maximale"], ph: "nom du paramètre", exp: "Ex. 90 jours." },
    { type: "input", q: "Quel sigle désigne la console (Centre d'administration AD) où l'on crée un PSO ?", a: ["ADAC", "adac"], ph: "sigle", exp: "Active Directory Administrative Center." },
    { type: "input", q: "Quelle commande force l'application immédiate des nouveaux réglages sur un poste ?", a: ["gpupdate /force", "gpupdate"], ph: "commande", exp: "gpupdate /force rafraîchit sans attendre le cycle normal." }
  ],
  final: {
    title: "Exercice final — Durcir les mots de passe de l'entreprise",
    intro: `<p>La direction demande : mot de passe d'au moins <strong>12 caractères</strong>, <strong>complexité activée</strong>, changement tous les <strong>90 jours</strong>, verrouillage après <strong>5 échecs</strong>. Réponds sur la mise en place via l'interface.</p>`,
    questions: [
      { type: "qcm", q: "Où appliquer ces règles globales ?", opts: ["Une GPO liée à une OU au hasard", "La Default Domain Policy (Modifier)", "Le DNS Manager", "Sites et services"], a: 1, exp: "La stratégie de mot de passe du domaine vit dans la Default Domain Policy." },
      { type: "input", q: "Quel dossier de l'éditeur contient à la fois « Stratégie de mot de passe » et « Stratégie de verrouillage » ?", a: ["Stratégies de comptes", "Strategies de comptes", "stratégies de comptes"], ph: "dossier", exp: "Paramètres de sécurité ▸ Stratégies de comptes." },
      { type: "input", q: "Quelle valeur mettre pour « Longueur minimale du mot de passe » ?", a: ["12", "12 caractères", "12 caracteres"], ph: "nombre", exp: "La demande est 12 caractères." },
      { type: "vf", q: "Pour imposer 5 échecs maximum, on règle le « Seuil de verrouillage du compte » à 5.", a: true, exp: "C'est le paramètre qui compte les tentatives échouées." },
      { type: "qcm", q: "Ces règles plus strictes juste pour les admins nécessiteraient…", opts: ["Rien de plus", "Un PSO ciblant le groupe des admins", "Un nouveau domaine", "Un site supplémentaire"], a: 1, exp: "Le PSO permet une politique différenciée par groupe." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. GPMC ▸ Domaines ▸ mondomaine.local ▸ clic droit Default Domain Policy ▸ Modifier
2. Configuration ordinateur ▸ Strategies ▸ Parametres Windows ▸ Parametres de securite
   ▸ Strategies de comptes ▸ Strategie de mot de passe
3. Longueur minimale = 12 ; Exigences de complexite = Activé ; Duree de vie max = 90 jours
4. Strategie de verrouillage du compte ▸ Seuil de verrouillage = 5 ; Duree = 15 min
5. Fermer l'editeur ▸ sur un poste : gpupdate /force pour appliquer</pre>
<p>Pour des admins encore plus protégés : ADAC ▸ Password Settings Container ▸ nouveau PSO ciblant le groupe Admins, avec longueur 16 par exemple. Les règles s'appliquent au prochain changement de mot de passe.</p>`
  }
};
