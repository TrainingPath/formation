<script>
var DAY = {
  num: 9,
  title: "Mot de passe, activer et désactiver un compte",
  subtitle: "Réinitialiser, déverrouiller, désactiver : le cycle de vie d'un compte au quotidien.",
  theory: `
<h3>1. Trois actions à ne pas confondre</h3>
<p>Sur un compte, trois opérations reviennent souvent et sont différentes :</p>
<pre class="pseudo">Réinitialiser le mot de passe → donner un NOUVEAU mot de passe (l'ancien est oublié)
Déverrouiller le compte       → lever un blocage temporaire après trop d'essais ratés
Désactiver le compte          → rendre le compte inutilisable SANS le supprimer</pre>
<div class="warn">Ne confonds pas <strong>déverrouiller</strong> (le compte s'est bloqué tout seul après plusieurs mauvais mots de passe) et <strong>désactiver</strong> (c'est TOI qui coupes volontairement l'accès). Ni l'un ni l'autre ne supprime le compte.</div>
<h3>2. Réinitialiser un mot de passe oublié</h3>
<p>Quand un utilisateur a oublié son mot de passe, on ne peut pas le « retrouver » (il est chiffré) : on en définit un <strong>nouveau</strong>.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'utilisateur ▸ « Réinitialiser le mot de passe… »
   ▸ Nouveau mot de passe | Confirmer
   ▸ [x] L'utilisateur doit changer le mot de passe à la prochaine ouverture de session
   ▸ (option) [x] Déverrouiller le compte de l'utilisateur
   ▸ OK</pre>
<div class="tip">La boîte de réinitialisation propose souvent une case « Déverrouiller le compte » : pratique si le compte était aussi verrouillé. Coche « doit changer à la prochaine ouverture » pour que l'utilisateur choisisse ensuite son propre secret.</div>
<h3>3. Déverrouiller un compte</h3>
<p>Après trop de tentatives échouées (selon la stratégie de verrouillage), un compte se <strong>verrouille</strong> automatiquement pour contrer les attaques. On le déverrouille dans l'onglet Compte :</p>
<pre class="pseudo">ADUC ▸ double-clic sur l'utilisateur ▸ onglet « Compte »
   ▸ cocher « Déverrouiller le compte » (la case n'apparaît que si le compte est verrouillé) ▸ OK</pre>
<h3>4. Désactiver un compte</h3>
<p><strong>Désactiver</strong> conserve le compte et tous ses attributs, mais empêche toute connexion. On le fait quand un employé part en congé longue durée, ou quitte l'entreprise (avant une suppression définitive).</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'utilisateur ▸ « Désactiver le compte »
   → l'icône affiche alors une petite flèche vers le bas</pre>
<div class="tip">Bonne pratique : quand quelqu'un quitte l'entreprise, on <strong>désactive</strong> d'abord (au cas où il faudrait récupérer ses données ou ses accès), et on supprime seulement plus tard. Désactiver est réversible, supprimer beaucoup moins.</div>
<h3>5. Réactiver un compte</h3>
<pre class="pseudo">ADUC ▸ clic droit sur l'utilisateur désactivé ▸ « Activer le compte »
   → la flèche vers le bas disparaît, le compte redevient utilisable</pre>
<h3>6. Reconnaître l'état d'un compte</h3>
<p>Dans le volet droit, l'icône donne l'état : une <strong>flèche vers le bas</strong> = compte désactivé ; un <strong>cadenas</strong> ou une croix dans l'onglet Compte = compte verrouillé. Un compte normal a une icône « tête » simple.</p>
<h3>7. Options utiles de l'onglet Compte</h3>
<pre class="pseudo">[ ] Le mot de passe n'expire jamais   → pour un compte de service (à éviter pour un humain)
[ ] L'utilisateur ne peut pas changer de mot de passe
[ ] Le compte est désactivé           → équivaut au clic droit « Désactiver »</pre>
<div class="warn">Éviter de cocher « Le mot de passe n'expire jamais » pour un vrai utilisateur : cela affaiblit la sécurité. Réserve-le à certains comptes techniques bien maîtrisés.</div>`,
  exercises: [
    { type: "qcm", q: "Peut-on « retrouver » le mot de passe oublié d'un utilisateur ?", opts: ["Oui, il est affiché en clair", "Non : on en définit un nouveau (réinitialisation)", "Oui, mais seulement par un administrateur", "Oui, en le déchiffrant dans l'annuaire"], a: 1, exp: "Le mot de passe est chiffré : on le réinitialise, on ne le lit pas." },
    { type: "qcm", q: "Que signifie « désactiver » un compte ?", opts: ["Le supprimer définitivement", "Le rendre inutilisable sans le supprimer (réversible)", "Changer son nom", "Le déplacer"], a: 1, exp: "Désactiver bloque l'accès mais conserve le compte." },
    { type: "qcm", q: "Pourquoi un compte se verrouille-t-il tout seul ?", opts: ["Lorsque son mot de passe arrive à expiration", "Après trop de tentatives de mot de passe échouées (protection)", "À chaque redémarrage du poste", "Quand on le change d'unité d'organisation"], a: 1, exp: "Le verrouillage automatique contre les attaques par essais répétés." },
    { type: "qcm", q: "Quelle action lève un verrouillage automatique ?", opts: ["Supprimer le compte", "Déverrouiller le compte (onglet Compte ou boîte de réinitialisation)", "Renommer", "Redémarrer le DC"], a: 1, exp: "On coche « Déverrouiller le compte »." },
    { type: "qcm", q: "Quelle bonne pratique appliquer au départ d'un employé ?", opts: ["Supprimer immédiatement", "Désactiver d'abord, supprimer plus tard", "Ne rien faire", "Changer son bureau"], a: 1, exp: "Désactiver est réversible : on garde la possibilité de récupérer données et accès." },
    { type: "qcm", q: "Comment reconnaître un compte désactivé dans le volet droit d'ADUC ?", opts: ["Icône avec une flèche vers le bas", "Icône avec une coche verte", "Il disparaît", "Icône avec un cadenas rouge"], a: 0, exp: "La flèche vers le bas signale un compte désactivé." },
    { type: "vf", q: "Désactiver et supprimer un compte sont la même chose.", a: false, exp: "Désactiver conserve le compte ; supprimer l'efface." },
    { type: "vf", q: "La réinitialisation du mot de passe peut aussi déverrouiller le compte via une case dédiée.", a: true, exp: "La boîte de réinitialisation propose « Déverrouiller le compte »." },
    { type: "vf", q: "Cocher « Le mot de passe n'expire jamais » est recommandé pour tous les utilisateurs humains.", a: false, exp: "Cela affaiblit la sécurité ; à réserver à certains comptes techniques." },
    { type: "input", q: "Quelle action du clic droit donne un nouveau mot de passe (deux mots) ?", a: ["Réinitialiser le mot de passe", "réinitialiser", "reinitialiser le mot de passe"], ph: "deux mots", exp: "« Réinitialiser le mot de passe… »." },
    { type: "input", q: "Quelle action du clic droit rend un compte inutilisable sans l'effacer (un mot) ?", a: ["Désactiver", "désactiver", "desactiver"], ph: "un mot", exp: "« Désactiver le compte »." },
    { type: "input", q: "Quelle action rend de nouveau utilisable un compte désactivé (un mot) ?", a: ["Activer", "activer"], ph: "un mot", exp: "« Activer le compte »." },
    { type: "input", q: "Dans quel onglet coche-t-on « Déverrouiller le compte » ?", a: ["Compte", "compte"], ph: "un mot", exp: "L'onglet Compte affiche la case quand le compte est verrouillé." },
    { type: "input", q: "Comment appelle-t-on l'état d'un compte bloqué après trop d'essais ratés (un mot) ?", a: ["verrouillé", "verrouille", "verrouillage"], ph: "un mot", exp: "Le compte est verrouillé (lockout)." },
    { type: "qcm", q: "Un utilisateur revient de congé, son compte avait été désactivé. Que fais-tu ?", opts: ["Je le supprime", "Clic droit ▸ Activer le compte", "Je le déplace dans une autre OU", "Je réinitialise son mot de passe"], a: 1, exp: "« Activer le compte » le rend de nouveau utilisable." }
  ],
  final: {
    title: "Exercice final — Marie a oublié son mot de passe et s'est bloquée",
    intro: `<p>Marie a saisi cinq fois un mauvais mot de passe : son compte est maintenant verrouillé, et de toute façon elle ne s'en souvient plus. Décris comment la dépanner en une seule opération.</p>`,
    questions: [
      { type: "qcm", q: "Quelle action unique règle à la fois le mot de passe oublié et le verrouillage ?", opts: ["Supprimer le compte", "Réinitialiser le mot de passe en cochant « Déverrouiller le compte »", "Renommer le compte", "Désactiver puis réactiver"], a: 1, exp: "La boîte de réinitialisation permet aussi de déverrouiller." },
      { type: "input", q: "Sur quel clic ouvres-tu le menu contextuel de Marie (deux mots) ?", a: ["clic droit", "droit", "bouton droit"], ph: "quel clic ?", exp: "Clic droit ▸ Réinitialiser le mot de passe." },
      { type: "vf", q: "Tu coches « L'utilisateur doit changer le mot de passe à la prochaine ouverture » pour qu'elle choisisse son secret.", a: true, exp: "Elle définira un mot de passe personnel au prochain démarrage." },
      { type: "input", q: "Quelle case supplémentaire coches-tu pour lever le blocage (un mot) ?", a: ["Déverrouiller", "déverrouiller", "deverrouiller"], ph: "un mot", exp: "« Déverrouiller le compte »." },
      { type: "qcm", q: "As-tu besoin de supprimer puis recréer le compte de Marie ?", opts: ["Oui, obligatoire", "Non : réinitialiser et déverrouiller suffisent", "Oui, chaque fois", "Non, il faut redémarrer le serveur"], a: 1, exp: "Aucune suppression : la réinitialisation résout tout." }
    ],
    solution: `<p>Dépannage de Marie en une opération :</p>
<pre class="pseudo">1. ADUC ▸ ouvrir l'OU de Marie ▸ clic droit sur mdurand
2. « Réinitialiser le mot de passe… »
3. Saisir un nouveau mot de passe provisoire (conforme à la complexité) ▸ Confirmer
4. [x] L'utilisateur doit changer le mot de passe à la prochaine ouverture de session
5. [x] Déverrouiller le compte de l'utilisateur
6. OK
7. Communiquer le mot de passe provisoire à Marie (canal sûr) ; elle définira le sien au prochain démarrage</pre>
<p>Le compte est déverrouillé et un nouveau mot de passe est en place, sans jamais supprimer le compte.</p>`
  }
};
</script>
