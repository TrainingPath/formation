<h3>1. Ce que tu sais faire maintenant</h3>
<p>Ce dernier jour est un <strong>examen de synthèse</strong>. Il ne présente pas de nouvelle notion : il vérifie que tu maîtrises l'administration d'Active Directory <strong>à la souris</strong>, des GPO à la sauvegarde. Relis d'abord ce mémo, puis affronte les questions.</p>
<h3>2. Les consoles à connaître</h3>
<pre class="pseudo">ADUC   Utilisateurs et ordinateurs AD   OU, utilisateurs, groupes, délégation, rôles RID/PDC/Infra
GPMC   Gestion des stratégies de groupe  créer/lier/modifier les GPO, filtrage, RSOP
ADAC   Centre d'administration AD         corbeille AD, PSO (mots de passe fins)
DNS    Gestionnaire DNS                   zones, enregistrements A/CNAME/SRV/PTR
Sites et services                         sites, subnets, liens, réplication
Domaines et approbations                  rôle Domain Naming Master
Sauvegarde Windows Server                 état du système, restauration
Observateur d'événements                  journaux Sécurité et Directory Service</pre>
<h3>3. Les stratégies de groupe (GPO)</h3>
<pre class="pseudo">Créer + LIER (site / domaine / OU) sinon inactive
Ordre LSDOU : Local, Site, Domaine, OU — la DERNIERE gagne
Bloquer l'héritage (OU)  vs  Appliqué (lien, l'emporte toujours)
Filtrage de sécurité : cibler un groupe précis
Vérifier : gpupdate /force puis gpresult /r (ou RSOP)</pre>
<h3>4. Sécurité et comptes</h3>
<pre class="pseudo">Mots de passe du domaine : Default Domain Policy ▸ Strategies de comptes
PSO (ADAC) : règles plus strictes pour un groupe
Délégation : moindre privilège, sur une OU, à un GROUPE
Audit : catégorie par GPO + SACL sur un dossier ; lire le journal Sécurité</pre>
<h3>5. Infrastructure et maintenance</h3>
<pre class="pseudo">DNS : indispensable à AD (enregistrements SRV localisent le DC)
Rôles FSMO (5) : Schema, Domain Naming (forêt) ; RID, PDC, Infra (domaine)
   → transférer (DC vivants) / saisir/seize via ntdsutil (DC mort)
Réplication : repadmin /replsummary, dcdiag ; forcer via Sites et services
Corbeille AD (ADAC) : restaurer un objet supprimé
Sauvegarde : état du système ; restaurer en mode DSRM</pre>
<div class="tip">Réflexe d'or récurrent : après tout changement de GPO, <code>gpupdate /force</code> puis <code>gpresult /r</code> pour vérifier l'effet réel. Configurer n'est pas appliquer.</div>

    solution: `<p>Réponses détaillées, tâche par tâche :</p>
<pre class="pseudo">1. Compte supprimé → ADAC ▸ domaine ▸ Deleted Objects ▸ clic droit ▸ Restaurer
2. Mot de passe 14 car. → GPMC ▸ Default Domain Policy ▸ Modifier

   ▸ « Interdire l'accès au Panneau de configuration » ▸ Activé

   ▸ Maîtres d'opérations ▸ TRANSFERER les rôles FSMO vers un DC sain, puis rétrograder
Vérification générale : gpupdate /force ▸ gpresult /r ▸ repadmin /replsummary</pre>
<p>Chaque tâche renvoie à un jour du cours : corbeille (24), mots de passe (18), restrictions GPO (17/19), sites et subnets (23), rôles FSMO (26). Savoir relier un besoin à la bonne console et au bon chemin ▸ : voilà le cœur du métier. Félicitations, tu as terminé le parcours !</p>`
