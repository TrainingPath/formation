<script>
var DAY = {
  num: 23,
  title: "Sites et services Active Directory",
  subtitle: "Organiser AD selon la géographie du réseau pour un trafic maîtrisé.",
  theory: `
<h3>1. Qu'est-ce qu'un site AD ?</h3>
<p>Un <strong>site</strong> Active Directory représente un <strong>emplacement physique</strong> du réseau bien connecté : typiquement un bâtiment ou une ville, relié en interne par un réseau rapide. Un site regroupe une ou plusieurs plages d'adresses IP. Exemple : le site « Bruxelles » et le site « Lyon », reliés par une liaison plus lente entre eux.</p>
<div class="tip">Ne confonds pas : un <strong>domaine</strong> est une frontière <em>logique</em> (organisation, sécurité) ; un <strong>site</strong> est une réalité <em>physique</em> (géographie du réseau). Un même domaine peut couvrir plusieurs sites.</div>
<h3>2. Pourquoi des sites ?</h3>
<p>Deux bénéfices majeurs. D'abord, l'<strong>authentification locale</strong> : un poste s'adresse de préférence à un contrôleur de domaine de <strong>son propre site</strong>, donc proche et rapide. Ensuite, le contrôle de la <strong>réplication</strong> : les échanges entre DC de sites différents peuvent être planifiés et compressés pour ménager la liaison lente qui les relie.</p>
<h3>3. La console Sites et services</h3>
<p>On configure tout cela dans la console <strong>Sites et services Active Directory</strong> (Active Directory Sites and Services).</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Outils ▸ Sites et services Active Directory   // ouvre la console
Console ▸ Sites                        // liste des sites (au depart : Default-First-Site-Name)
Console ▸ Sites ▸ Subnets              // les sous-reseaux associes aux sites
Console ▸ Inter-Site Transports ▸ IP   // les liens entre sites</pre>
<h3>4. Les objets clés</h3>
<pre class="pseudo">Site        un emplacement physique (ex. Bruxelles)          // regroupe des sous-reseaux
Subnet      une plage d'adresses IP (ex. 192.168.10.0/24)    // rattache un reseau a un site
Site Link   un lien entre deux sites                         // porte le cout et la planification
Server      un DC placé dans un site                         // sert les clients de ce site</pre>
<div class="warn">Un poste dont l'adresse IP n'appartient à <strong>aucun subnet</strong> déclaré ne sait pas dans quel site il se trouve : il peut alors s'authentifier auprès d'un DC lointain. Déclarer les subnets est donc essentiel.</div>
<h3>5. Créer un site et l'associer à un subnet</h3>
<pre class="pseudo">Console ▸ clic droit sur Sites ▸ Nouveau site...           // creer le site
   → nommer le site (ex. Lyon) ▸ choisir un lien de site (DEFAULTIPSITELINK) ▸ OK
Console ▸ clic droit sur Subnets ▸ Nouveau sous-réseau...  // declarer le reseau
   → saisir le prefixe (ex. 192.168.20.0/24) ▸ associer au site Lyon ▸ OK</pre>
<h3>6. Le lien de site et sa planification</h3>
<p>Un <strong>lien de site</strong> (site link) relie deux sites et porte deux réglages : le <strong>coût</strong> (un chiffre : plus il est bas, plus le lien est « préféré » quand plusieurs chemins existent) et la <strong>planification</strong> (à quels moments et à quelle fréquence la réplication a lieu).</p>
<pre class="pseudo">Console ▸ Inter-Site Transports ▸ IP ▸ clic droit sur le lien ▸ Propriétés
   Coût : 100                          // priorite du chemin (plus bas = prefere)
   Répliquer toutes les : 180 minutes  // frequence de replication inter-sites
   Modifier la planification...        // fenetres horaires autorisees</pre>
<h3>7. Le KCC et les objets de connexion</h3>
<p>Le <strong>KCC</strong> (Knowledge Consistency Checker, « vérificateur de cohérence des connexions ») est un mécanisme automatique d'AD qui calcule la <strong>topologie de réplication</strong> : il crée les <strong>objets de connexion</strong> entre DC pour que tout le monde reçoive les mises à jour. En général, on le laisse travailler seul.</p>`,
  exercises: [
    { type: "qcm", q: "Que représente un site Active Directory ?", opts: ["Une page web", "Un emplacement physique du réseau (ex. un bâtiment)", "Un utilisateur", "Une GPO"], a: 1, exp: "Un site = réalité physique/géographique du réseau." },
    { type: "qcm", q: "Différence domaine / site ?", opts: ["Aucune", "Le domaine est logique, le site est physique", "Le site est logique, le domaine physique", "Ce sont des synonymes"], a: 1, exp: "Domaine = frontière logique ; site = géographie du réseau." },
    { type: "qcm", q: "À quoi sert un subnet dans Sites et services ?", opts: ["À chiffrer les données", "À rattacher une plage d'adresses IP à un site", "À créer une GPO", "À sauvegarder AD"], a: 1, exp: "Le subnet dit à quel site appartient un réseau." },
    { type: "qcm", q: "Un des bénéfices des sites est…", opts: ["Ralentir le réseau", "L'authentification auprès d'un DC local (proche et rapide)", "Supprimer le DNS", "Désactiver les GPO"], a: 1, exp: "Les clients préfèrent un DC de leur propre site." },
    { type: "qcm", q: "Sur un lien de site, que signifie un coût plus bas ?", opts: ["Le lien est ignoré", "Le lien est préféré quand plusieurs chemins existent", "La réplication est désactivée", "Le site est supprimé"], a: 1, exp: "Coût bas = chemin privilégié." },
    { type: "qcm", q: "Que fait le KCC ?", opts: ["Il gère le DNS", "Il calcule automatiquement la topologie de réplication (objets de connexion)", "Il crée des utilisateurs", "Il verrouille les comptes"], a: 1, exp: "Le Knowledge Consistency Checker bâtit les connexions entre DC." },
    { type: "vf", q: "Un même domaine peut s'étendre sur plusieurs sites.", a: true, exp: "Le logique (domaine) et le physique (sites) sont indépendants." },
    { type: "vf", q: "Un poste dont l'IP n'est dans aucun subnet déclaré peut s'authentifier auprès d'un DC lointain.", a: true, exp: "Sans subnet, AD ne sait pas dans quel site il est." },
    { type: "vf", q: "La planification d'un lien de site permet de choisir quand a lieu la réplication inter-sites.", a: true, exp: "On peut espacer/limiter la réplication pour ménager une liaison lente." },
    { type: "input", q: "Quel nom porte l'objet qui associe une plage IP à un site ? (mot anglais courant)", a: ["subnet", "Subnet", "sous-réseau", "sous-reseau"], ph: "nom", exp: "Le subnet (sous-réseau)." },
    { type: "input", q: "Quel sigle désigne le mécanisme qui calcule la topologie de réplication ?", a: ["KCC", "kcc"], ph: "sigle", exp: "Knowledge Consistency Checker." },
    { type: "input", q: "Comment s'appelle le site créé par défaut à l'installation d'AD ?", a: ["Default-First-Site-Name", "default-first-site-name"], ph: "nom", exp: "Default-First-Site-Name." },
    { type: "input", q: "Quel objet relie deux sites et porte un coût et une planification ? (nom)", a: ["lien de site", "Site Link", "site link", "lien"], ph: "nom", exp: "Le lien de site (site link)." },
    { type: "input", q: "Sous quel conteneur trouve-t-on les liens de sites IP ? (Inter-Site …)", a: ["Transports", "Inter-Site Transports", "transports"], ph: "conteneur", exp: "Inter-Site Transports ▸ IP." },
    { type: "input", q: "Depuis quel menu ouvre-t-on la console Sites et services ?", a: ["Outils", "outils", "menu Outils"], ph: "menu", exp: "Gestionnaire de serveur ▸ Outils." }
  ],
  final: {
    title: "Exercice final — Ouvrir un site à Lyon",
    intro: `<p>L'entreprise ouvre une agence à <strong>Lyon</strong> (réseau <code>192.168.20.0/24</code>) reliée au siège par une liaison lente. On veut que les postes lyonnais s'authentifient localement. Réponds sur la démarche.</p>`,
    questions: [
      { type: "qcm", q: "Première action dans Sites et services ?", opts: ["Créer un nouveau site (ex. Lyon)", "Supprimer le domaine", "Ouvrir le DNS", "Créer une GPO"], a: 0, exp: "On crée le site avant d'y rattacher un réseau." },
      { type: "input", q: "Que déclare-t-on pour rattacher le réseau lyonnais au site Lyon ?", a: ["un subnet", "subnet", "sous-réseau", "un sous-réseau"], ph: "objet", exp: "Le subnet 192.168.20.0/24 associé au site Lyon." },
      { type: "input", q: "Quel préfixe IP saisit-on pour ce subnet ?", a: ["192.168.20.0/24", "192.168.20.0"], ph: "préfixe", exp: "Le réseau de l'agence." },
      { type: "qcm", q: "Pour ménager la liaison lente, on ajuste…", opts: ["La stratégie de mot de passe", "Le coût et la planification du lien de site", "Le DNS inversé", "La corbeille AD"], a: 1, exp: "Coût et planification règlent la réplication inter-sites." },
      { type: "vf", q: "Placer un DC dans le site Lyon permettra l'authentification locale des postes lyonnais.", a: true, exp: "Un client préfère un DC de son propre site." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Sites et services Active Directory
2. Clic droit sur Sites ▸ Nouveau site ▸ nommer « Lyon » ▸ choisir DEFAULTIPSITELINK ▸ OK
3. Clic droit sur Subnets ▸ Nouveau sous-réseau ▸ préfixe 192.168.20.0/24 ▸ associer au site Lyon ▸ OK
4. Placer (ou promouvoir) un contrôleur de domaine dans le site Lyon
5. Inter-Site Transports ▸ IP ▸ Propriétés du lien ▸ ajuster Coût et « Répliquer toutes les » 
   et la planification pour ménager la liaison lente
6. Laisser le KCC recalculer la topologie ; verifier que les postes Lyon utilisent le DC local</pre>
<p>Grâce au subnet déclaré, chaque poste lyonnais sait qu'il est dans le site Lyon et s'authentifie auprès du DC local, réduisant le trafic sur la liaison inter-sites.</p>`
  }
};
</script>
