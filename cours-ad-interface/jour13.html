<script>
var DAY = {
  num: 13,
  title: "Gérer l'appartenance aux groupes",
  subtitle: "Ajouter et retirer des membres, imbriquer des groupes, contrôler le résultat.",
  theory: `
<h3>1. Appartenance : deux points de vue</h3>
<p>Un même lien « X est membre de Y » peut se gérer de deux côtés :</p>
<pre class="pseudo">Depuis l'UTILISATEUR → onglet « Membre de »   : les groupes auxquels IL appartient
Depuis le GROUPE     → onglet « Membres »     : la liste des membres du groupe</pre>
<p>Les deux vues montrent la même relation. Analogie : une équipe de foot ; on peut lister « les équipes de Paul » ou « les joueurs de l'équipe A » — c'est le même lien vu des deux bouts.</p>
<h3>2. Ajouter un utilisateur à un groupe (depuis le groupe)</h3>
<pre class="pseudo">ADUC ▸ double-clic sur le groupe (ex. G_Comptabilite) ▸ onglet « Membres »
   ▸ bouton « Ajouter… »
   ▸ champ « Entrez les noms… » : taper le nom (ex. mdurand)
   ▸ bouton « Vérifier les noms » (souligne le nom s'il est reconnu)
   ▸ OK ▸ OK</pre>
<div class="tip">Le bouton <strong>« Vérifier les noms »</strong> confirme que le compte existe : le nom se souligne. S'il ne trouve rien, une boîte propose de choisir dans une liste. Prends l'habitude de vérifier avant de valider.</div>
<h3>3. Ajouter un groupe à un utilisateur (depuis l'utilisateur)</h3>
<pre class="pseudo">ADUC ▸ double-clic sur l'utilisateur ▸ onglet « Membre de »
   ▸ bouton « Ajouter… » ▸ taper le nom du groupe ▸ Vérifier les noms ▸ OK</pre>
<h3>4. Ajouter plusieurs comptes d'un coup</h3>
<p>On peut sélectionner plusieurs utilisateurs dans le volet droit, puis clic droit ▸ <strong>Ajouter à un groupe…</strong> : tous rejoignent le même groupe en une opération.</p>
<pre class="pseudo">ADUC ▸ sélectionner plusieurs utilisateurs (Ctrl+clic) ▸ clic droit ▸ « Ajouter à un groupe… »
   ▸ taper le nom du groupe ▸ OK</pre>
<h3>5. Retirer un membre</h3>
<pre class="pseudo">ADUC ▸ double-clic sur le groupe ▸ onglet « Membres »
   ▸ sélectionner le membre ▸ bouton « Supprimer » ▸ OK
   (retirer du groupe ne supprime PAS le compte : il perd juste les droits liés au groupe)</pre>
<div class="warn">Retirer un utilisateur d'un groupe lui enlève les droits fournis par ce groupe, mais ne supprime pas son compte. Ne confonds pas « Supprimer » (le membre de la liste) avec la suppression du compte.</div>
<h3>6. Imbriquer des groupes (groupe dans groupe)</h3>
<p>Un groupe peut être <strong>membre</strong> d'un autre groupe : c'est l'<strong>imbrication</strong>. Elle est au cœur du modèle AGDLP : on met le groupe global (G_Comptabilite) DANS le groupe domaine local (DL_Partage_Compta) qui porte le droit.</p>
<pre class="pseudo">ADUC ▸ double-clic sur DL_Partage_Compta ▸ onglet Membres ▸ Ajouter…
   ▸ taper G_Comptabilite ▸ Vérifier les noms ▸ OK
   → tous les membres de G_Comptabilite héritent alors du droit porté par DL_Partage_Compta</pre>
<h3>7. Le groupe principal</h3>
<p>Chaque utilisateur a un <strong>groupe principal</strong> (par défaut « Utilisateurs du domaine »). On le voit dans l'onglet « Membre de ». Dans la grande majorité des cas, on n'y touche pas ; c'est surtout utile pour certains environnements spécifiques.</p>`,
  exercises: [
    { type: "qcm", q: "Depuis l'utilisateur, quel onglet liste ses groupes ?", opts: ["Membres", "Membre de", "Compte", "Profil"], a: 1, exp: "L'onglet « Membre de » liste les groupes de l'utilisateur." },
    { type: "qcm", q: "Depuis le groupe, quel onglet liste ses membres ?", opts: ["Membre de", "Membres", "Général", "Objet"], a: 1, exp: "L'onglet « Membres » liste les comptes appartenant au groupe." },
    { type: "qcm", q: "À quoi sert le bouton « Vérifier les noms » ?", opts: ["À changer le mot de passe", "À confirmer qu'un nom saisi correspond bien à un objet existant", "À supprimer le groupe", "À créer une OU"], a: 1, exp: "Il valide et souligne le nom reconnu avant l'ajout." },
    { type: "qcm", q: "Retirer un utilisateur d'un groupe…", opts: ["supprime son compte", "lui enlève les droits du groupe sans supprimer le compte", "désactive le domaine", "change son mot de passe"], a: 1, exp: "Le compte reste ; seuls les droits liés au groupe disparaissent." },
    { type: "qcm", q: "Qu'est-ce que l'imbrication de groupes ?", opts: ["Un groupe membre d'un autre groupe", "Un groupe supprimé", "Un groupe sans membre", "Un groupe caché"], a: 0, exp: "Un groupe peut être membre d'un autre : c'est l'imbrication." },
    { type: "qcm", q: "Comment ajouter plusieurs utilisateurs à un groupe en une fois ?", opts: ["Impossible", "Ctrl+clic pour sélectionner, puis clic droit ▸ Ajouter à un groupe…", "Un par un obligatoirement", "En les supprimant"], a: 1, exp: "La sélection multiple + « Ajouter à un groupe… » traite tout d'un coup." },
    { type: "vf", q: "Les onglets « Membre de » et « Membres » décrivent la même relation vue des deux côtés.", a: true, exp: "C'est le même lien d'appartenance, vu de l'utilisateur ou du groupe." },
    { type: "vf", q: "Un groupe ne peut jamais être membre d'un autre groupe.", a: false, exp: "L'imbrication de groupes est possible et centrale dans AGDLP." },
    { type: "vf", q: "Le bouton « Supprimer » dans l'onglet Membres efface le compte utilisateur.", a: false, exp: "Il retire seulement le membre de la liste du groupe." },
    { type: "input", q: "Depuis un utilisateur, dans quel onglet ajoute-t-on un groupe (deux mots) ?", a: ["Membre de", "membre de"], ph: "deux mots", exp: "Onglet « Membre de »." },
    { type: "input", q: "Depuis un groupe, dans quel onglet ajoute-t-on un membre (un mot) ?", a: ["Membres", "membres"], ph: "un mot", exp: "Onglet « Membres »." },
    { type: "input", q: "Quel bouton confirme qu'un nom saisi existe (deux/trois mots) ?", a: ["Vérifier les noms", "vérifier les noms", "verifier les noms", "Vérifier"], ph: "deux/trois mots", exp: "« Vérifier les noms »." },
    { type: "input", q: "Comment appelle-t-on le fait qu'un groupe soit membre d'un autre (un mot) ?", a: ["imbrication", "imbriquer", "l'imbrication"], ph: "un mot", exp: "L'imbrication de groupes." },
    { type: "input", q: "Quel est le groupe principal par défaut d'un utilisateur (trois mots) ?", a: ["Utilisateurs du domaine", "utilisateurs du domaine", "Domain Users"], ph: "trois mots", exp: "« Utilisateurs du domaine » (Domain Users)." },
    { type: "qcm", q: "Dans AGDLP, comment relie-t-on G_Comptabilite au droit porté par DL_Partage_Compta ?", opts: ["On les fusionne", "On ajoute G_Comptabilite comme membre de DL_Partage_Compta", "On les supprime", "On renomme le domaine"], a: 1, exp: "Le groupe global devient membre du groupe domaine local qui porte la permission." }
  ],
  final: {
    title: "Exercice final — Peupler les groupes de la Comptabilité",
    intro: `<p>Les groupes <code>G_Comptabilite</code> (global) et <code>DL_Partage_Compta</code> (domaine local) existent. Tu dois ajouter les comptables au groupe global, puis relier le global au domaine local (modèle AGDLP). Décris tes actions.</p>`,
    questions: [
      { type: "input", q: "Dans quel onglet du groupe G_Comptabilite ajoutes-tu les comptables (un mot) ?", a: ["Membres", "membres"], ph: "un mot", exp: "Onglet « Membres » ▸ Ajouter…" },
      { type: "input", q: "Quel bouton vérifie que « mdurand » existe avant validation (deux/trois mots) ?", a: ["Vérifier les noms", "vérifier les noms", "verifier les noms"], ph: "deux/trois mots", exp: "« Vérifier les noms »." },
      { type: "qcm", q: "Pour l'étape AGDLP, que fais-tu ensuite ?", opts: ["Supprimer G_Comptabilite", "Ajouter G_Comptabilite comme membre de DL_Partage_Compta", "Renommer le domaine", "Désactiver les comptes"], a: 1, exp: "Le groupe global devient membre du groupe domaine local." },
      { type: "vf", q: "Ajouter G_Comptabilite dans DL_Partage_Compta fait hériter ses membres du droit porté par DL.", a: true, exp: "Les membres du global héritent du droit via l'imbrication." },
      { type: "input", q: "Retirer un comptable de G_Comptabilite supprime-t-il son compte ? (oui/non)", a: ["non", "Non", "NON"], ph: "oui ou non", exp: "Non : il perd seulement les droits du groupe." }
    ],
    solution: `<p>Peupler et relier les groupes (AGDLP) :</p>
<pre class="pseudo">1. Ajouter les comptables au groupe global :
   ADUC ▸ double-clic sur G_Comptabilite ▸ onglet Membres ▸ Ajouter…
      taper mdurand ; ppetit ; … ▸ Vérifier les noms ▸ OK ▸ OK

2. Relier le global au domaine local :
   ADUC ▸ double-clic sur DL_Partage_Compta ▸ onglet Membres ▸ Ajouter…
      taper G_Comptabilite ▸ Vérifier les noms ▸ OK ▸ OK

3. (Fait par ailleurs) La permission du dossier « Compta » est attribuée à DL_Partage_Compta.

Résultat : chaque membre de G_Comptabilite hérite du droit d'accès au dossier.
Ajouter un futur comptable à G_Comptabilite suffira à lui donner l'accès.</pre>`
  }
};
</script>
