<script>
var DAY = {
  num: 5,
  title: "La console Utilisateurs et ordinateurs (ADUC)",
  subtitle: "Découvrir l'outil historique de gestion : fenêtre, arborescence et conteneurs.",
  theory: `
<h3>1. Qu'est-ce qu'ADUC ?</h3>
<p><strong>ADUC</strong> signifie « <strong>Active Directory Users and Computers</strong> », en français <strong>Utilisateurs et ordinateurs Active Directory</strong>. C'est la console MMC <strong>historique</strong> et la plus utilisée pour gérer au quotidien les comptes utilisateurs, les ordinateurs, les groupes et les OU. Analogie : c'est le <strong>meuble à tiroirs</strong> du service du personnel, où chaque fiche est rangée dans un tiroir.</p>
<h3>2. Ouvrir la console</h3>
<pre class="pseudo">Gestionnaire de serveur ▸ menu « Outils » ▸ « Utilisateurs et ordinateurs Active Directory »</pre>
<p>On peut aussi la lancer par la commande <code>dsa.msc</code> (dans Exécuter, Win+R), mais dans ce cours nous privilégions le menu graphique.</p>
<h3>3. La fenêtre en deux volets</h3>
<p>ADUC se présente comme l'Explorateur de fichiers : un <strong>volet gauche</strong> qui montre l'arborescence, et un <strong>volet droit</strong> qui affiche le contenu de l'élément sélectionné.</p>
<pre class="pseudo">Volet GAUCHE (arborescence)              Volet DROIT (contenu)
  entreprise.local                         ← liste des objets de l'élément
    ├─ Builtin                               sélectionné à gauche
    ├─ Computers
    ├─ Domain Controllers
    ├─ Users
    └─ (tes futures OU)</pre>
<h3>4. Les conteneurs par défaut</h3>
<p>À la racine du domaine, plusieurs <strong>conteneurs</strong> existent déjà. Un conteneur est un dossier prédéfini par Windows (à ne pas confondre avec une OU que tu crées toi-même). Les principaux :</p>
<pre class="pseudo">Users              → comptes et groupes intégrés (Administrateur, Invité, groupes prédéfinis)
Computers          → les ordinateurs joints au domaine y arrivent par défaut
Domain Controllers → les contrôleurs de domaine (SRV-DC1 s'y trouve)
Builtin            → groupes système intégrés de Windows</pre>
<div class="warn">Différence clé : les <strong>conteneurs</strong> (Users, Computers…) sont fournis par Windows et on ne peut PAS leur appliquer de stratégie de groupe (GPO). Les <strong>OU</strong> que tu crées, si. C'est l'une des raisons pour lesquelles on crée ses propres OU (jour 10).</div>
<h3>5. Afficher les fonctions avancées</h3>
<p>Par défaut, ADUC cache certains onglets et objets. Pour tout voir, active le mode avancé :</p>
<pre class="pseudo">ADUC ▸ menu « Affichage » ▸ cocher « Fonctionnalités avancées »</pre>
<p>Cela fait apparaître des conteneurs supplémentaires (comme <code>LostAndFound</code>) et l'onglet <strong>Éditeur d'attributs</strong> dans les propriétés des objets. Utile pour aller plus loin.</p>
<h3>6. Naviguer et lire les objets</h3>
<p>Un clic sur un conteneur à gauche affiche ses objets à droite. Chaque objet a une <strong>icône</strong> distincte : une tête pour un utilisateur, deux têtes pour un groupe, un écran pour un ordinateur, un dossier avec un livre pour une OU. Un double-clic sur un objet ouvre sa fenêtre de <strong>Propriétés</strong>, organisée en <strong>onglets</strong> (Général, Compte, Membre de…).</p>
<div class="tip">Le clic droit est ton meilleur ami dans ADUC : sur un conteneur, il propose « Nouveau ▸ Utilisateur / Groupe / Unité d'organisation… ». Sur un objet, il propose Renommer, Supprimer, Déplacer, Propriétés, etc.</div>
<h3>7. Le champ de recherche</h3>
<p>Pour retrouver un objet dans un grand domaine, on utilise la loupe :</p>
<pre class="pseudo">ADUC ▸ clic droit sur le domaine ▸ « Rechercher… » ▸ taper le nom ▸ Rechercher maintenant</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie ADUC ?", opts: ["Active Directory Users and Computers", "Advanced Domain User Console", "Active Data Update Center", "Automatic Directory Update Client"], a: 0, exp: "ADUC = Active Directory Users and Computers (Utilisateurs et ordinateurs AD)." },
    { type: "qcm", q: "Depuis quel menu du Gestionnaire de serveur ouvre-t-on ADUC ?", opts: ["Gérer", "Outils", "Fichier", "Aide"], a: 1, exp: "Le menu « Outils » liste les consoles, dont ADUC." },
    { type: "qcm", q: "Comment est organisée la fenêtre d'ADUC ?", opts: ["Un seul grand volet", "Deux volets : arborescence à gauche, contenu à droite", "Trois colonnes égales", "Une fenêtre par objet"], a: 1, exp: "Comme l'Explorateur : arborescence à gauche, contenu à droite." },
    { type: "qcm", q: "Où arrivent par défaut les ordinateurs joints au domaine ?", opts: ["Dans Users", "Dans le conteneur Computers", "Dans Builtin", "Nulle part"], a: 1, exp: "Le conteneur Computers reçoit les ordinateurs joints par défaut." },
    { type: "qcm", q: "Quelle est une différence majeure entre un conteneur (Users) et une OU ?", opts: ["Aucune", "On peut appliquer une GPO à une OU, mais pas au conteneur Users", "Le conteneur est plus grand", "L'OU ne contient rien"], a: 1, exp: "Les GPO s'appliquent aux OU, pas aux conteneurs par défaut comme Users." },
    { type: "qcm", q: "Comment afficher les onglets et objets cachés d'ADUC ?", opts: ["Affichage ▸ Filtrer les objets", "Affichage ▸ Fonctionnalités avancées", "Fichier ▸ Enregistrer", "Action ▸ Actualiser la console"], a: 1, exp: "Le mode « Fonctionnalités avancées » dévoile plus d'objets et l'Éditeur d'attributs." },
    { type: "vf", q: "Le contrôleur de domaine SRV-DC1 se trouve dans le conteneur « Domain Controllers ».", a: true, exp: "Les DC sont rangés dans Domain Controllers." },
    { type: "vf", q: "Un conteneur par défaut comme Users peut recevoir une stratégie de groupe (GPO).", a: false, exp: "Seules les OU (et le domaine/site) reçoivent des GPO, pas les conteneurs par défaut." },
    { type: "vf", q: "Un double-clic sur un objet ouvre sa fenêtre de Propriétés organisée en onglets.", a: true, exp: "Les Propriétés regroupent Général, Compte, Membre de, etc." },
    { type: "input", q: "Quelle commande (à taper dans Exécuter) ouvre aussi ADUC ?", a: ["dsa.msc", "DSA.MSC", "dsa"], ph: "une commande .msc", exp: "dsa.msc lance directement la console ADUC." },
    { type: "input", q: "Quel conteneur par défaut regroupe les comptes intégrés comme Administrateur et Invité ?", a: ["Users", "users"], ph: "un mot", exp: "Le conteneur Users contient les comptes et groupes intégrés." },
    { type: "input", q: "Quel bouton de la souris ouvre le menu « Nouveau ▸ Utilisateur / OU… » sur un conteneur ?", a: ["clic droit", "le clic droit", "droit", "bouton droit"], ph: "quel clic ?", exp: "Le clic droit affiche le menu contextuel de création." },
    { type: "input", q: "Comment appelle-t-on les rubriques (Général, Compte, Membre de…) dans la fenêtre Propriétés d'un objet ?", a: ["onglets", "des onglets", "onglet"], ph: "un mot", exp: "Les Propriétés sont réparties en onglets." },
    { type: "input", q: "Quel mode d'affichage active-t-on pour voir l'Éditeur d'attributs (deux mots) ?", a: ["Fonctionnalités avancées", "fonctionnalités avancées", "fonctionnalites avancees"], ph: "deux mots", exp: "Affichage ▸ Fonctionnalités avancées." },
    { type: "qcm", q: "Que fait un clic sur un conteneur du volet gauche ?", opts: ["Il supprime le conteneur", "Il affiche son contenu dans le volet droit", "Il crée un utilisateur", "Il ferme la console"], a: 1, exp: "Sélectionner un conteneur à gauche affiche ses objets à droite." }
  ],
  final: {
    title: "Exercice final — Explorer entreprise.local dans ADUC",
    intro: `<p>Tu ouvres ADUC pour la première fois sur SRV-DC1. Tu veux comprendre la structure du domaine <code>entreprise.local</code> avant de créer quoi que ce soit. Réponds aux questions.</p>`,
    questions: [
      { type: "input", q: "Par quel menu du Gestionnaire de serveur ouvres-tu ADUC (un mot) ?", a: ["Outils", "outils"], ph: "un mot", exp: "Menu « Outils » ▸ « Utilisateurs et ordinateurs Active Directory »." },
      { type: "qcm", q: "Dans quel conteneur retrouves-tu SRV-DC1 ?", opts: ["Users", "Computers", "Domain Controllers", "Builtin"], a: 2, exp: "Les contrôleurs de domaine sont dans Domain Controllers." },
      { type: "vf", q: "Pour voir l'onglet Éditeur d'attributs, tu actives Affichage ▸ Fonctionnalités avancées.", a: true, exp: "Le mode avancé dévoile cet onglet." },
      { type: "input", q: "Quel clic utilises-tu sur le domaine pour lancer une recherche d'objet ?", a: ["clic droit", "droit", "bouton droit"], ph: "quel clic ?", exp: "Clic droit sur le domaine ▸ Rechercher…" },
      { type: "qcm", q: "Pourquoi vas-tu bientôt créer tes propres OU plutôt qu'utiliser le conteneur Users ?", opts: ["Pour trier les comptes par ordre alphabétique", "Parce qu'on peut appliquer des GPO aux OU, pas au conteneur Users", "Parce que le conteneur Users est en lecture seule", "Parce que Users n'accepte pas de nouveaux comptes"], a: 1, exp: "Les OU permettent d'appliquer des stratégies ; les conteneurs par défaut, non." }
    ],
    solution: `<p>Découverte guidée d'ADUC :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Utilisateurs et ordinateurs Active Directory
2. Volet gauche : cliquer sur entreprise.local pour déplier l'arborescence
3. Observer les conteneurs par défaut :
     - Users              (comptes/groupes intégrés)
     - Computers          (PC joints par défaut)
     - Domain Controllers (SRV-DC1 est ici)
     - Builtin            (groupes système)
4. Affichage ▸ Fonctionnalités avancées (pour voir plus d'objets et l'Éditeur d'attributs)
5. Clic droit sur entreprise.local ▸ Rechercher… (pour retrouver un objet par son nom)
6. Double-clic sur un objet ▸ lire ses onglets (Général, Compte, Membre de…)</pre>
<p>Tu connais maintenant l'arborescence : tu es prêt à créer des OU et des utilisateurs.</p>`
  }
};
</script>
