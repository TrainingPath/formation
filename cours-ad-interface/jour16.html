  num: 16,
  title: "Introduction aux stratégies de groupe (GPMC)",
  subtitle: "Comprendre les GPO et les appliquer à une OU avec la console GPMC.",
  theory: `
<h3>1. Qu'est-ce qu'une stratégie de groupe (GPO) ?</h3>
<p>Une <strong>stratégie de groupe</strong> (en anglais <em>Group Policy Object</em>, abrégée <strong>GPO</strong>) est un ensemble de <strong>règles</strong> que Windows applique automatiquement aux utilisateurs et aux ordinateurs. Exemples : imposer un fond d'écran, interdire le Panneau de configuration, forcer un mot de passe long, déployer une imprimante. Analogie : c'est le <strong>règlement intérieur</strong> de l'entreprise, appliqué sans que chacun ait à le configurer soi-même.</p>
<div class="tip">Une GPO applique les mêmes réglages à TOUS les objets de la zone visée, automatiquement et de façon centralisée. Modifier la règle une fois au serveur suffit à changer le comportement de tous les postes concernés.</div>
<h3>2. La console GPMC</h3>
<p>On gère les GPO avec la console <strong>GPMC</strong> (<em>Group Policy Management Console</em>), en français <strong>Gestion des stratégies de groupe</strong>. C'est la console dédiée, distincte d'ADUC.</p>
<pre class="pseudo">Gestionnaire de serveur ▸ menu « Outils » ▸ « Gestion des stratégies de groupe »
   (commande équivalente : gpmc.msc)</pre>
<h3>3. Deux notions : créer et LIER</h3>
<p>Il faut distinguer deux gestes :</p>
<pre class="pseudo">CRÉER une GPO  → fabriquer l'objet de règles (il vit dans « Objets de stratégie de groupe »)
LIER une GPO   → l'attacher à un emplacement (un DOMAINE, un SITE ou une OU) pour qu'elle s'applique</pre>
<p>Une GPO ne fait rien tant qu'elle n'est pas <strong>liée</strong> à un conteneur. Analogie : écrire une consigne (créer) ne sert à rien tant qu'on ne l'a pas affichée sur la porte du bon service (lier).</p>
<div class="warn">Rappel important des jours précédents : on lie les GPO à des <strong>OU</strong> (ou au domaine, ou à un site), mais PAS aux conteneurs par défaut comme Users ou Computers. C'est LA raison pour laquelle on crée ses propres OU et on y range utilisateurs et ordinateurs.</div>
<h3>4. Créer et lier une GPO en une fois</h3>
<pre class="pseudo">GPMC ▸ déplier Forêt ▸ Domaines ▸ entreprise.local
   ▸ clic droit sur l'OU cible (ex. Comptabilite)
   ▸ « Créer un objet GPO dans ce domaine, et le lier ici… »
   ▸ Nom : GPO_Compta_Securite ▸ OK
   → la GPO est créée ET liée à l'OU en une seule action</pre>
<h3>5. Modifier le contenu d'une GPO</h3>
<p>On édite les règles avec l'<strong>Éditeur de gestion des stratégies de groupe</strong> :</p>
<pre class="pseudo">GPMC ▸ clic droit sur la GPO ▸ « Modifier… »
   → l'éditeur s'ouvre, séparé en deux grandes branches :
       Configuration ordinateur   (règles appliquées à la machine)
       Configuration utilisateur  (règles appliquées à la personne)
   ▸ naviguer dans Stratégies ▸ Modèles d'administration ▸ … ▸ double-clic sur un paramètre
   ▸ choisir Activé / Désactivé / Non configuré ▸ OK</pre>
<h3>6. Deux branches : ordinateur et utilisateur</h3>
<pre class="pseudo">Configuration ORDINATEUR   → s'applique au démarrage du PC, vaut pour tout utilisateur du poste
Configuration UTILISATEUR  → s'applique à l'ouverture de session, suit la personne</pre>
<h3>7. Appliquer et vérifier (gpupdate)</h3>
<p>Les GPO se rafraîchissent périodiquement, mais on peut forcer la mise à jour immédiate sur un client avec la commande <code>gpupdate /force</code> (dans une invite de commandes). Pour vérifier ce qui s'applique réellement à un poste ou un utilisateur, on utilise <code>gpresult /r</code>, ou l'assistant graphique <strong>Résultats de stratégie de groupe</strong> dans GPMC.</p>
<div class="tip">Ordre d'application (le dernier gagne en cas de conflit) : <strong>L</strong>ocal, puis <strong>S</strong>ite, puis <strong>D</strong>omaine, puis <strong>OU</strong> — retenu par le sigle <strong>LSDOU</strong>. Une GPO liée à l'OU l'emporte donc, en général, sur une GPO du domaine.</div>`,
  exercises: [
    { type: "qcm", q: "Que contient une GPO ?", opts: ["Des fichiers de sauvegarde", "Un ensemble de règles appliquées automatiquement aux utilisateurs/ordinateurs", "Des adresses IP", "Des mots de passe en clair"], a: 1, exp: "Une GPO regroupe des règles de configuration appliquées automatiquement." },
    { type: "qcm", q: "Quelle console gère les stratégies de groupe ?", opts: ["ADUC", "ADAC", "GPMC", "DNS"], a: 2, exp: "GPMC = Gestion des stratégies de groupe." },

    { type: "vf", q: "On peut créer et lier une GPO à une OU en une seule action dans GPMC.", a: true, exp: "« Créer un objet GPO dans ce domaine, et le lier ici… »." },
    { type: "vf", q: "On peut lier une GPO directement au conteneur par défaut Users.", a: false, exp: "Les conteneurs par défaut ne reçoivent pas de GPO ; il faut une OU." },
    { type: "vf", q: "La Configuration utilisateur d'une GPO s'applique à l'ouverture de session de la personne.", a: true, exp: "Elle suit l'utilisateur ; la Configuration ordinateur suit la machine." },
    { type: "input", q: "Quel sigle désigne la console de gestion des stratégies de groupe ?", a: ["GPMC", "gpmc"], ph: "un sigle", exp: "GPMC = Group Policy Management Console." },
    { type: "input", q: "Quel sigle désigne une stratégie de groupe (l'objet lui-même) ?", a: ["GPO", "gpo"], ph: "un sigle", exp: "GPO = Group Policy Object." },
    { type: "input", q: "Quelle commande (Win+R) ouvre directement GPMC ?", a: ["gpmc.msc", "GPMC.MSC", "gpmc"], ph: "une commande .msc", exp: "gpmc.msc ouvre la console." },
    { type: "input", q: "Quel verbe désigne le fait d'attacher une GPO à une OU pour qu'elle agisse (un mot) ?", a: ["lier", "Lier", "lier la gpo"], ph: "un mot", exp: "On « lie » la GPO à un conteneur." },
    { type: "input", q: "Quel sigle mnémotechnique donne l'ordre d'application des GPO ?", a: ["LSDOU", "lsdou"], ph: "un sigle", exp: "LSDOU : Local, Site, Domaine, OU (le dernier l'emporte)." },
    { type: "qcm", q: "Comment vérifier précisément quelles GPO s'appliquent à un poste ?", opts: ["En redémarrant au hasard", "gpresult /r, ou l'assistant Résultats de stratégie de groupe dans GPMC", "En supprimant la GPO", "En renommant le PC"], a: 1, exp: "gpresult /r ou l'assistant graphique donnent le résultat effectif." }
  ],
  final: {

    intro: `<p>La direction veut interdire l'accès au Panneau de configuration pour les postes de la Comptabilité. Tu vas créer une GPO, la lier à l'OU Comptabilite, y régler le paramètre, puis l'appliquer. Décris la démarche.</p>`,
    questions: [
      { type: "input", q: "Quelle console (sigle) ouvres-tu pour cela ?", a: ["GPMC", "gpmc"], ph: "un sigle", exp: "GPMC gère les stratégies de groupe." },
      { type: "qcm", q: "Sur quoi fais-tu le clic droit pour créer ET lier la GPO d'un coup ?", opts: ["Sur le conteneur Users", "Sur l'OU Comptabilite ▸ Créer un objet GPO… et le lier ici", "Sur DNS", "Sur le Bureau"], a: 1, exp: "On clique droit sur l'OU cible pour créer et lier en une action." },
      { type: "input", q: "Quelle action du clic droit ouvre l'éditeur de la GPO (un mot) ?", a: ["Modifier", "modifier"], ph: "un mot", exp: "Clic droit sur la GPO ▸ Modifier…" },
      { type: "vf", q: "Le paramètre visant l'utilisateur se règle dans la branche Configuration utilisateur.", a: true, exp: "Interdire le Panneau de configuration est un réglage utilisateur." },
      { type: "input", q: "Quelle commande forces-tu sur un poste client pour appliquer tout de suite ?", a: ["gpupdate /force", "gpupdate", "gpupdate/force"], ph: "une commande", exp: "gpupdate /force." }
    ],
    solution: `<p>Créer et appliquer la GPO :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Gestion des stratégies de groupe (GPMC)
2. Déplier Forêt ▸ Domaines ▸ entreprise.local ▸ OU Comptabilite
3. Clic droit sur OU Comptabilite ▸ « Créer un objet GPO dans ce domaine, et le lier ici… »
      Nom : GPO_Compta_Interdictions ▸ OK
4. Clic droit sur GPO_Compta_Interdictions ▸ « Modifier… »
5. Éditeur ▸ Configuration utilisateur ▸ Stratégies ▸ Modèles d'administration
      ▸ Panneau de configuration ▸ double-clic « Interdire l'accès au Panneau de configuration… »
      ▸ Activé ▸ OK
6. Fermer l'éditeur
7. (Client) Invite de commandes ▸ gpupdate /force ▸ (rouvrir la session si demandé)
8. Vérifier : gpresult /r, ou GPMC ▸ Résultats de stratégie de groupe</pre>
<p>Les postes/utilisateurs de la Comptabilité n'ont plus accès au Panneau de configuration : une règle centrale, appliquée à toute l'OU.</p>`
  }
};
