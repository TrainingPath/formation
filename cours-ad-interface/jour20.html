<script>
var DAY = {
  num: 20,
  title: "La délégation de contrôle (assistant)",
  subtitle: "Confier des tâches précises sans donner les pleins pouvoirs.",
  theory: `
<h3>1. Le principe de la délégation</h3>
<p>La <strong>délégation de contrôle</strong> consiste à donner à une personne ou à un groupe le droit d'effectuer <strong>certaines tâches</strong> d'administration sur une partie de l'annuaire, sans en faire un administrateur du domaine. Exemple : le responsable RH peut réinitialiser les mots de passe de son service, mais ne peut pas créer de comptes ailleurs ni toucher aux serveurs.</p>
<div class="tip">C'est l'application du <strong>principe du moindre privilège</strong> : chacun reçoit exactement les droits nécessaires à son rôle, ni plus, ni moins. Moins de droits distribués = moins de risques.</div>
<h3>2. On délègue sur une OU</h3>
<p>La délégation se pose sur un conteneur, presque toujours une <strong>OU</strong> (unité d'organisation). Les droits accordés s'appliquent alors aux objets rangés <strong>dans cette OU</strong>. Ainsi, en déléguant sur l'OU <code>RH</code>, on limite naturellement le pouvoir au périmètre RH.</p>
<h3>3. L'assistant Délégation de contrôle</h3>
<p>Tout se fait par un <strong>assistant</strong> (wizard : une suite d'écrans qui guide pas à pas) lancé depuis la console <strong>Utilisateurs et ordinateurs Active Directory</strong> (sigle ADUC, en anglais <em>Active Directory Users and Computers</em>).</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Outils ▸ Utilisateurs et ordinateurs Active Directory   // ouvre ADUC
ADUC ▸ clic droit sur l'OU voulue ▸ Déléguer le contrôle...                        // lance l'assistant
   Ecran 1 : Bienvenue ▸ Suivant
   Ecran 2 : Utilisateurs ou groupes ▸ Ajouter... ▸ choisir le groupe (ex. Delegues-RH) ▸ Suivant
   Ecran 3 : Tâches à déléguer ▸ cocher une tâche courante OU créer une tâche personnalisée
   Ecran 4 : Terminer ▸ l'assistant ecrit les permissions</pre>
<h3>4. Les tâches courantes proposées</h3>
<p>L'assistant offre une liste de <strong>tâches prédéfinies</strong>, très pratiques pour les cas fréquents :</p>
<pre class="pseudo">- Créer, supprimer et gérer des comptes d'utilisateur
- Réinitialiser les mots de passe utilisateur et forcer le changement à la prochaine ouverture
- Lire toutes les informations utilisateur
- Créer, supprimer et gérer des groupes
- Gérer les liaisons de stratégie de groupe</pre>
<div class="warn">Déléguez de préférence à un <strong>groupe</strong> (ex. « Delegues-RH »), pas à une personne nommée. Quand quelqu'un change de poste, il suffit de l'ajouter ou le retirer du groupe : les droits suivent.</div>
<h3>5. Tâche personnalisée</h3>
<p>Si aucune tâche prédéfinie ne convient, on choisit <strong>Créer une tâche personnalisée à déléguer</strong>. On précise alors le type d'objet (ex. les objets Utilisateur) et les autorisations exactes (ex. seulement « Réinitialiser le mot de passe »).</p>
<h3>6. Vérifier une délégation posée</h3>
<p>Les délégations se traduisent par des <strong>permissions</strong> dans l'onglet <strong>Sécurité</strong> des propriétés de l'OU. Pour voir ou retirer une délégation, on active l'affichage avancé, puis on inspecte ces permissions.</p>
<pre class="pseudo">ADUC ▸ menu Affichage ▸ Fonctionnalités avancées      // rend visibles les onglets caches
ADUC ▸ clic droit sur l'OU ▸ Propriétés ▸ onglet Sécurité ▸ Avancé   // liste des permissions deleguees</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert la délégation de contrôle ?", opts: ["À supprimer un domaine", "À donner des droits précis sans faire de la personne un admin complet", "À mapper un lecteur", "À changer le DNS"], a: 1, exp: "Des pouvoirs ciblés, appliquant le moindre privilège." },
    { type: "qcm", q: "Sur quel objet pose-t-on le plus souvent une délégation ?", opts: ["Un utilisateur unique", "Une OU (unité d'organisation)", "Le DNS", "Un site"], a: 1, exp: "L'OU délimite naturellement le périmètre des droits." },
    { type: "qcm", q: "Depuis quelle console lance-t-on l'assistant de délégation ?", opts: ["GPMC", "ADUC (Utilisateurs et ordinateurs Active Directory)", "DNS Manager", "Sites et services"], a: 1, exp: "Clic droit sur l'OU ▸ Déléguer le contrôle, dans ADUC." },
    { type: "qcm", q: "À qui vaut-il mieux déléguer ?", opts: ["À une personne nommée", "À un groupe", "À tout le monde", "À personne"], a: 1, exp: "Un groupe : les droits suivent l'appartenance, plus simple à maintenir." },
    { type: "qcm", q: "Quel principe de sécurité la délégation illustre-t-elle ?", opts: ["Le moindre privilège", "Le plus grand privilège", "La redondance", "Le chiffrement"], a: 0, exp: "Chacun reçoit juste les droits nécessaires." },
    { type: "qcm", q: "Si aucune tâche prédéfinie ne convient, on choisit…", opts: ["De tout donner", "Créer une tâche personnalisée à déléguer", "De supprimer l'OU", "D'ouvrir le DNS"], a: 1, exp: "La tâche personnalisée précise objets et autorisations exactes." },
    { type: "vf", q: "Déléguer une tâche fait automatiquement de la personne un administrateur du domaine.", a: false, exp: "Non : c'est justement l'inverse, on donne des droits limités." },
    { type: "vf", q: "Une délégation posée sur l'OU RH ne concerne que les objets rangés dans cette OU.", a: true, exp: "Le périmètre est celui du conteneur délégué." },
    { type: "vf", q: "La délégation se traduit par des permissions dans l'onglet Sécurité de l'OU.", a: true, exp: "L'assistant écrit ces autorisations, visibles via les Fonctionnalités avancées." },
    { type: "input", q: "Quel sigle (4 lettres) désigne la console Utilisateurs et ordinateurs Active Directory ?", a: ["ADUC", "aduc"], ph: "sigle", exp: "Active Directory Users and Computers." },
    { type: "input", q: "Quel mot désigne la suite d'écrans qui guide la délégation pas à pas ?", a: ["assistant", "Assistant", "wizard"], ph: "mot", exp: "L'assistant (wizard) de délégation de contrôle." },
    { type: "input", q: "Quelle option du menu clic droit sur l'OU lance la délégation ? (intitulé)", a: ["Déléguer le contrôle", "Deleguer le controle", "déléguer le contrôle"], ph: "intitulé", exp: "Clic droit sur l'OU ▸ Déléguer le contrôle." },
    { type: "input", q: "Quelle tâche prédéfinie permet à un helpdesk de dépanner les connexions oubliées ? (intitulé court)", a: ["Réinitialiser les mots de passe utilisateur", "Reinitialiser les mots de passe utilisateur", "réinitialiser les mots de passe"], ph: "intitulé", exp: "Réinitialiser les mots de passe des utilisateurs." },
    { type: "input", q: "Quel menu d'ADUC faut-il activer pour voir les onglets cachés (dont Sécurité avancé) ?", a: ["Fonctionnalités avancées", "Fonctionnalites avancees", "fonctionnalités avancées"], ph: "menu Affichage", exp: "Affichage ▸ Fonctionnalités avancées." },
    { type: "input", q: "Dans quel onglet des propriétés de l'OU voit-on les permissions déléguées ?", a: ["Sécurité", "Securite", "sécurité"], ph: "onglet", exp: "L'onglet Sécurité (bouton Avancé)." }
  ],
  final: {
    title: "Exercice final — Un helpdesk pour réinitialiser les mots de passe",
    intro: `<p>On veut que le groupe <strong>Helpdesk</strong> puisse réinitialiser les mots de passe des utilisateurs de l'OU <code>Personnel</code>, et rien d'autre. Réponds sur la démarche via l'assistant.</p>`,
    questions: [
      { type: "qcm", q: "Depuis quelle console et sur quel objet ?", opts: ["GPMC, sur le domaine", "ADUC, clic droit sur l'OU Personnel", "DNS, sur une zone", "Sites et services"], a: 1, exp: "ADUC ▸ clic droit sur l'OU ▸ Déléguer le contrôle." },
      { type: "input", q: "Au 2e écran, qu'ajoute-t-on comme bénéficiaire de la délégation ?", a: ["le groupe Helpdesk", "Helpdesk", "groupe Helpdesk"], ph: "bénéficiaire", exp: "On délègue à un groupe, pas à une personne." },
      { type: "input", q: "Quelle tâche prédéfinie coche-t-on ? (intitulé)", a: ["Réinitialiser les mots de passe utilisateur", "Reinitialiser les mots de passe utilisateur", "réinitialiser les mots de passe"], ph: "tâche", exp: "Réinitialiser les mots de passe des utilisateurs." },
      { type: "vf", q: "Cette délégation permettra au Helpdesk de créer aussi des OU dans tout le domaine.", a: false, exp: "Non : seule la tâche cochée, sur l'OU Personnel, est autorisée." },
      { type: "qcm", q: "Pour vérifier ensuite la délégation posée…", opts: ["Supprimer l'OU", "Affichage ▸ Fonctionnalités avancées, puis Propriétés de l'OU ▸ Sécurité", "Redémarrer le serveur", "Changer le DNS"], a: 1, exp: "Les permissions déléguées apparaissent dans l'onglet Sécurité." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Utilisateurs et ordinateurs Active Directory (ADUC)
2. Clic droit sur l'OU Personnel ▸ Déléguer le contrôle... ▸ Suivant
3. Ecran « Utilisateurs ou groupes » ▸ Ajouter ▸ taper Helpdesk ▸ Vérifier les noms ▸ OK ▸ Suivant
4. Ecran « Tâches à déléguer » ▸ cocher « Réinitialiser les mots de passe utilisateur
   et forcer le changement à la prochaine ouverture de session » ▸ Suivant
5. Terminer : l'assistant ecrit les permissions sur l'OU Personnel
6. Vérification : Affichage ▸ Fonctionnalités avancées ▸ clic droit OU ▸ Propriétés ▸ Sécurité ▸ Avancé</pre>
<p>Le Helpdesk peut désormais dépanner les mots de passe du Personnel, sans aucun autre pouvoir : moindre privilège respecté.</p>`
  }
};
</script>
