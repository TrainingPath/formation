<script>
var DAY = {
  num: 24,
  title: "La corbeille Active Directory (ADAC)",
  subtitle: "Restaurer un compte supprimé par erreur, sans redémarrage ni sauvegarde.",
  theory: `
<h3>1. Le problème de la suppression</h3>
<p>Supprimer un objet AD (utilisateur, groupe, ordinateur) par erreur est vite arrivé. Avant, le récupérer était pénible. La <strong>corbeille Active Directory</strong> (Active Directory Recycle Bin) résout cela : quand elle est activée, un objet supprimé est <strong>conservé intact</strong> pendant un certain temps, avec tous ses attributs, et peut être <strong>restauré en quelques clics</strong>.</p>
<div class="tip">Avant la corbeille, un objet supprimé devenait un « tombstone » (pierre tombale) vidé de ses attributs : le restaurer complètement exigeait une sauvegarde. La corbeille garde l'objet <strong>complet</strong>, prêt à revivre.</div>
<h3>2. Une console dédiée : ADAC</h3>
<p>On utilise le <strong>Centre d'administration Active Directory</strong> (sigle <strong>ADAC</strong>, en anglais <em>Active Directory Administrative Center</em>), une console moderne et graphique. C'est là qu'on active la corbeille et qu'on restaure les objets.</p>
<pre class="pseudo">Gestionnaire de serveur ▸ Outils ▸ Centre d'administration Active Directory   // ouvre ADAC</pre>
<h3>3. Activer la corbeille (une fois pour toutes)</h3>
<p>La corbeille n'est <strong>pas active par défaut</strong>. On l'active une seule fois, et c'est <strong>irréversible</strong> (impossible de la désactiver ensuite). Elle exige que la forêt soit à un niveau fonctionnel suffisant (Windows Server 2008 R2 ou plus).</p>
<pre class="pseudo">ADAC ▸ sélectionner le domaine (racine) ▸ volet Tâches (à droite)
   ▸ Activer la Corbeille...            // confirmer : action irreversible
   → un message avertit que la replication doit se propager a tous les DC</pre>
<div class="warn">Attention : la corbeille ne protège que les objets supprimés <strong>APRÈS</strong> son activation. Ce qui a été supprimé avant n'est pas récupérable par ce moyen. Active-la donc dès le départ.</div>
<h3>4. Où vont les objets supprimés ?</h3>
<p>Les objets supprimés atterrissent dans un conteneur spécial nommé <strong>Deleted Objects</strong> (« Objets supprimés »), visible dans ADAC.</p>
<pre class="pseudo">ADAC ▸ nom-du-domaine (arborescence) ▸ conteneur Deleted Objects   // liste des objets supprimes recuperables</pre>
<h3>5. Restaurer un objet</h3>
<p>Restaurer se fait en deux clics : on le renvoie à son emplacement d'origine ou à un autre emplacement choisi.</p>
<pre class="pseudo">ADAC ▸ Deleted Objects ▸ clic droit sur l'objet ▸ Restaurer            // remet a son emplacement d'origine
ADAC ▸ Deleted Objects ▸ clic droit sur l'objet ▸ Restaurer vers...    // choisir une autre OU de destination</pre>
<div class="tip">Si l'OU d'origine a elle aussi été supprimée, restaure-la d'abord (elle est aussi dans Deleted Objects), puis restaure l'objet : il retrouvera sa place.</div>
<h3>6. Durée de conservation</h3>
<p>Un objet reste récupérable dans la corbeille pendant la <strong>durée de vie des objets supprimés</strong> (deleted object lifetime), 180 jours par défaut. Passé ce délai, il est réellement purgé. C'est largement suffisant pour rattraper une erreur.</p>
<h3>7. Et sans la corbeille ?</h3>
<p>Si la corbeille n'a jamais été activée, la seule voie reste la <strong>restauration faisant autorité</strong> depuis une sauvegarde (vue au jour 25), une opération bien plus lourde. D'où l'intérêt d'activer la corbeille dès la mise en place du domaine.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert la corbeille Active Directory ?", opts: ["À vider les fichiers temporaires", "À restaurer facilement un objet AD supprimé, avec ses attributs", "À créer des GPO", "À gérer le DNS"], a: 1, exp: "Elle conserve l'objet supprimé complet, prêt à restaurer." },
    { type: "qcm", q: "Depuis quelle console active-t-on et utilise-t-on la corbeille AD ?", opts: ["GPMC", "ADAC (Centre d'administration Active Directory)", "DNS Manager", "Sites et services"], a: 1, exp: "ADAC est la console moderne pour la corbeille." },
    { type: "qcm", q: "L'activation de la corbeille est…", opts: ["Réversible à volonté", "Irréversible : on ne peut plus la désactiver", "Automatique dès l'installation", "Inutile"], a: 1, exp: "Une fois activée, elle le reste définitivement." },
    { type: "qcm", q: "La corbeille protège les objets supprimés…", opts: ["Avant son activation", "Après son activation seulement", "Jamais", "Uniquement les ordinateurs"], a: 1, exp: "Seuls les objets supprimés après activation sont récupérables ainsi." },
    { type: "qcm", q: "Dans quel conteneur trouve-t-on les objets supprimés récupérables ?", opts: ["Users", "Deleted Objects", "Computers", "Builtin"], a: 1, exp: "Le conteneur Deleted Objects, visible dans ADAC." },
    { type: "qcm", q: "Combien de temps un objet reste-t-il récupérable par défaut ?", opts: ["1 jour", "180 jours", "5 minutes", "Indéfiniment"], a: 1, exp: "Deleted object lifetime = 180 jours par défaut." },
    { type: "vf", q: "La corbeille AD est activée par défaut à l'installation du domaine.", a: false, exp: "Non : il faut l'activer explicitement (action irréversible)." },
    { type: "vf", q: "Un objet restauré peut être renvoyé à son emplacement d'origine.", a: true, exp: "Clic droit ▸ Restaurer le remet à sa place ; « Restaurer vers... » choisit une autre OU." },
    { type: "vf", q: "Sans corbeille activée, restaurer un objet exige généralement une restauration depuis une sauvegarde.", a: true, exp: "C'est la restauration faisant autorité, bien plus lourde." },
    { type: "input", q: "Quel sigle (4 lettres) désigne le Centre d'administration Active Directory ?", a: ["ADAC", "adac"], ph: "sigle", exp: "Active Directory Administrative Center." },
    { type: "input", q: "Quel est le nom (anglais) du conteneur des objets supprimés ?", a: ["Deleted Objects", "deleted objects"], ph: "nom", exp: "Le conteneur Deleted Objects." },
    { type: "input", q: "Quelle tâche du volet de droite active la fonction ? (intitulé)", a: ["Activer la Corbeille", "Activer la corbeille", "activer la corbeille"], ph: "intitulé", exp: "Tâches ▸ Activer la Corbeille." },
    { type: "input", q: "Quelle action du clic droit remet l'objet à son emplacement d'origine ?", a: ["Restaurer", "restaurer"], ph: "action", exp: "Clic droit ▸ Restaurer." },
    { type: "input", q: "Quelle action permet de choisir une autre OU de destination ? (intitulé)", a: ["Restaurer vers", "Restaurer vers...", "restaurer vers"], ph: "intitulé", exp: "« Restaurer vers... » ouvre le choix de l'emplacement." },
    { type: "input", q: "Combien de jours (nombre) dure par défaut la conservation d'un objet supprimé ?", a: ["180", "180 jours"], ph: "nombre", exp: "180 jours par défaut." }
  ],
  final: {
    title: "Exercice final — Restaurer un compte supprimé par erreur",
    intro: `<p>Un collègue a supprimé le compte <strong>marie.leroy</strong> de l'OU <code>Comptabilite</code>. La corbeille AD est activée. Réponds sur la démarche de restauration via ADAC.</p>`,
    questions: [
      { type: "qcm", q: "Quelle console ouvre-t-on ?", opts: ["GPMC", "ADAC (Centre d'administration Active Directory)", "DNS", "Sites et services"], a: 1, exp: "ADAC gère la corbeille." },
      { type: "input", q: "Dans quel conteneur cherche-t-on le compte supprimé ? (nom)", a: ["Deleted Objects", "deleted objects"], ph: "conteneur", exp: "Le conteneur Deleted Objects." },
      { type: "input", q: "Quelle action du clic droit remet marie.leroy dans son OU d'origine ?", a: ["Restaurer", "restaurer"], ph: "action", exp: "Clic droit ▸ Restaurer." },
      { type: "vf", q: "Si l'OU Comptabilite avait aussi été supprimée, il faudrait la restaurer d'abord.", a: true, exp: "L'objet retrouve sa place une fois l'OU parente restaurée." },
      { type: "qcm", q: "Le compte restauré retrouve…", opts: ["Un objet vide", "Ses attributs (nom, appartenance aux groupes, etc.)", "Un nouveau mot de passe aléatoire imposé", "Rien"], a: 1, exp: "La corbeille conserve l'objet complet avec ses attributs." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Gestionnaire de serveur ▸ Outils ▸ Centre d'administration Active Directory (ADAC)
2. Dans l'arborescence, sélectionner le domaine ▸ conteneur Deleted Objects
3. Repérer l'objet marie.leroy (on peut filtrer/rechercher par nom)
4. Clic droit ▸ Restaurer            // remet le compte dans l'OU Comptabilite d'origine
   (ou « Restaurer vers... » pour choisir une autre OU si besoin)
5. Vérifier dans ADUC/ADAC que marie.leroy est de retour, avec ses groupes et attributs</pre>
<p>La restauration prend quelques secondes, sans redémarrage ni sauvegarde : tout le bénéfice d'avoir activé la corbeille dès le départ.</p>`
  }
};
</script>
