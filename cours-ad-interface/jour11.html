<script>
var DAY = {
  num: 11,
  title: "Organiser et déplacer les objets",
  subtitle: "Déplacer, renommer, rechercher : maintenir un annuaire bien rangé.",
  theory: `
<h3>1. Pourquoi déplacer des objets ?</h3>
<p>Un annuaire vit : un employé change de service, un ordinateur passe d'une équipe à l'autre, un compte créé au mauvais endroit doit rejoindre la bonne OU. <strong>Déplacer</strong> un objet, c'est le changer de conteneur sans le recréer. Analogie : <strong>ranger un dossier</strong> dans le bon tiroir du classeur.</p>
<div class="warn">Déplacer un objet peut changer les <strong>GPO</strong> qui s'appliquent à lui (car les GPO dépendent de l'OU). Un utilisateur déplacé de l'OU Comptabilite vers l'OU Direction reçoit désormais les stratégies de la Direction. C'est souvent l'effet recherché, mais il faut en être conscient.</div>
<h3>2. Déplacer par « Déplacer… » (menu)</h3>
<p>La méthode la plus sûre passe par le menu contextuel :</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'objet (ex. mdurand) ▸ « Déplacer… »
   ▸ dans l'arborescence, choisir l'OU de destination (ex. Direction)
   ▸ OK</pre>
<h3>3. Déplacer par glisser-déposer</h3>
<p>On peut aussi <strong>glisser-déposer</strong> l'objet du volet droit vers une OU du volet gauche. Windows demande une confirmation, car un glisser malencontreux pourrait déplacer un objet par erreur.</p>
<pre class="pseudo">ADUC ▸ cliquer-glisser mdurand du volet droit vers l'OU Direction (volet gauche) ▸ confirmer</pre>
<div class="tip">Le glisser-déposer est rapide mais risqué (on peut lâcher au mauvais endroit). Pour éviter les erreurs, beaucoup d'administrateurs préfèrent « Déplacer… » qui montre clairement la destination avant de valider.</div>
<h3>4. Déplacer plusieurs objets d'un coup</h3>
<p>On sélectionne plusieurs objets (Ctrl+clic pour en choisir plusieurs, ou Maj+clic pour une plage), puis clic droit ▸ Déplacer. Tous partent ensemble vers la même OU.</p>
<h3>5. Renommer un objet</h3>
<p><strong>Renommer</strong> change le nom affiché, mais attention : pour un utilisateur, le nom d'ouverture de session ne change pas automatiquement.</p>
<pre class="pseudo">ADUC ▸ clic droit sur l'objet ▸ Renommer ▸ nouveau nom ▸ Entrée
   → pour un utilisateur, une boîte propose aussi d'ajuster prénom/nom/UPN</pre>
<div class="warn">Renommer le nom complet d'un utilisateur ne modifie pas forcément son identifiant de connexion (UPN). Si une personne se marie et change de nom, pense à mettre à jour AUSSI le nom d'ouverture de session dans l'onglet Compte si nécessaire.</div>
<h3>6. Rechercher un objet</h3>
<p>Dans un grand domaine, on retrouve un objet avec la recherche :</p>
<pre class="pseudo">ADUC ▸ clic droit sur le domaine (ou une OU) ▸ « Rechercher… »
   ▸ champ Nom : taper « Durand » ▸ « Rechercher maintenant »
   → double-clic sur le résultat pour ouvrir ses propriétés</pre>
<h3>7. Bonnes pratiques de rangement</h3>
<pre class="pseudo">- Un objet = une OU logique (celle de son service/rôle)
- Vérifier après un déplacement quelles GPO s'appliquent
- Nommer les objets de façon cohérente (convention d'identifiants)
- Éviter de laisser des comptes « en vrac » dans le conteneur Users</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « déplacer » un objet ?", opts: ["Le supprimer", "Le changer de conteneur/OU sans le recréer", "Le renommer", "Le désactiver"], a: 1, exp: "Déplacer = changer d'OU tout en gardant le même objet." },
    { type: "qcm", q: "Quel effet un déplacement peut-il avoir en plus du rangement ?", opts: ["Aucun", "Changer les GPO qui s'appliquent à l'objet", "Supprimer le mot de passe", "Renommer le domaine"], a: 1, exp: "Les GPO dépendent de l'OU : changer d'OU change les stratégies appliquées." },
    { type: "qcm", q: "Quelle méthode montre clairement la destination avant de valider ?", opts: ["Le glisser-déposer", "Le menu « Déplacer… »", "La suppression", "Le renommage"], a: 1, exp: "« Déplacer… » affiche l'arborescence pour choisir la destination." },
    { type: "qcm", q: "Pourquoi Windows demande-t-il confirmation lors d'un glisser-déposer ?", opts: ["Pour ralentir", "Parce qu'un glisser accidentel pourrait déplacer un objet par erreur", "Pour changer le mot de passe", "Sans raison"], a: 1, exp: "La confirmation évite les déplacements involontaires." },
    { type: "qcm", q: "Comment sélectionner plusieurs objets à déplacer ensemble ?", opts: ["Impossible", "Ctrl+clic (ou Maj+clic) puis clic droit ▸ Déplacer", "Un par un seulement", "En les supprimant"], a: 1, exp: "Ctrl+clic/Maj+clic sélectionne plusieurs objets d'un coup." },
    { type: "qcm", q: "Renommer le nom complet d'un utilisateur change-t-il automatiquement son UPN ?", opts: ["Oui toujours", "Non, l'UPN peut rester inchangé : à vérifier dans l'onglet Compte", "Cela supprime le compte", "Cela le désactive"], a: 1, exp: "Le nom d'ouverture de session ne suit pas forcément le renommage." },
    { type: "vf", q: "Déplacer un objet le recrée entièrement dans la nouvelle OU.", a: false, exp: "C'est le même objet qui change simplement d'emplacement." },
    { type: "vf", q: "On peut déplacer plusieurs objets à la fois vers une même OU.", a: true, exp: "Sélection multiple puis Déplacer." },
    { type: "vf", q: "La recherche d'ADUC se lance par un clic droit sur le domaine ▸ Rechercher.", a: true, exp: "Clic droit ▸ Rechercher… puis Rechercher maintenant." },
    { type: "input", q: "Quelle action du menu contextuel change un objet de conteneur (un mot) ?", a: ["Déplacer", "déplacer", "deplacer"], ph: "un mot", exp: "« Déplacer… »." },
    { type: "input", q: "Quelle action du menu contextuel change le nom affiché d'un objet (un mot) ?", a: ["Renommer", "renommer"], ph: "un mot", exp: "« Renommer »." },
    { type: "input", q: "Quelle touche maintient-on pour sélectionner plusieurs objets non contigus ?", a: ["Ctrl", "ctrl"], ph: "une touche", exp: "Ctrl+clic ajoute des objets à la sélection." },
    { type: "input", q: "Quelle action du clic droit sur le domaine permet de retrouver un objet (un mot) ?", a: ["Rechercher", "rechercher"], ph: "un mot", exp: "« Rechercher… »." },
    { type: "input", q: "Dans quel onglet vérifie-t-on le nom d'ouverture de session après un renommage (un mot) ?", a: ["Compte", "compte"], ph: "un mot", exp: "L'onglet Compte contient l'UPN." },
    { type: "qcm", q: "Un objet a été créé par erreur dans le conteneur Users. Que fais-tu ?", opts: ["Je le supprime et recrée", "Je le déplace vers la bonne OU", "Je le laisse là", "Je renomme le domaine"], a: 1, exp: "Un simple déplacement suffit, inutile de recréer." }
  ],
  final: {
    title: "Exercice final — Marie est promue à la Direction",
    intro: `<p>Marie Durand (compte <code>mdurand</code>, actuellement dans l'OU Comptabilite) est promue et rejoint la Direction. Son compte doit passer dans l'OU Direction. Décris comment déplacer proprement son compte et ce qu'il faut vérifier ensuite.</p>`,
    questions: [
      { type: "qcm", q: "Quelle méthode privilégies-tu pour déplacer sans risque d'erreur ?", opts: ["Glisser-déposer à l'aveugle", "Clic droit ▸ Déplacer… ▸ choisir l'OU Direction", "Supprimer et recréer", "Renommer"], a: 1, exp: "« Déplacer… » montre la destination avant de valider." },
      { type: "input", q: "Quelle action du menu contextuel utilises-tu (un mot) ?", a: ["Déplacer", "déplacer", "deplacer"], ph: "un mot", exp: "Clic droit ▸ Déplacer…" },
      { type: "vf", q: "Après déplacement, les GPO appliquées à Marie peuvent changer.", a: true, exp: "Les GPO dépendent de l'OU de destination." },
      { type: "input", q: "Dans quelle OU se retrouve le compte après l'opération ?", a: ["Direction", "direction", "OU Direction"], ph: "une OU", exp: "Le compte passe dans l'OU Direction." },
      { type: "qcm", q: "Que vérifies-tu après le déplacement ?", opts: ["Rien", "Que mdurand apparaît bien dans Direction et quelles GPO s'y appliquent", "Que le serveur redémarre", "Que le domaine change de nom"], a: 1, exp: "On contrôle l'emplacement et l'effet des stratégies." }
    ],
    solution: `<p>Déplacer Marie vers la Direction :</p>
<pre class="pseudo">1. ADUC ▸ ouvrir l'OU Comptabilite ▸ repérer mdurand
2. Clic droit sur mdurand ▸ « Déplacer… »
3. Dans l'arborescence, sélectionner l'OU Direction ▸ OK
4. Vérifier que mdurand apparaît maintenant dans l'OU Direction
5. (Recommandé) Contrôler les GPO liées à l'OU Direction pour anticiper les changements
6. Mettre éventuellement à jour l'onglet Organisation (nouveau service, nouveau responsable)</pre>
<p>Le compte est déplacé sans recréation ; il hérite désormais des stratégies de la Direction.</p>`
  }
};
</script>

  items: [
  { id: "adgui-j11", title: "Déplacer un compte vers la bonne OU", level: 2,

    hints: [

    checklist: ["jdupuis apparaît-il désormais dans l'OU Commercial ?", "A-t-il bien disparu du conteneur Users ?", "As-tu utilisé « Déplacer… » plutôt que le glisser-déposer ?", "As-tu noté que les GPO liées à Commercial s'appliqueront maintenant à jdupuis ?"],
    atoi: {"cmd": "Get-ADUser jdupuis -Properties CanonicalName | Select-Object SamAccountName,CanonicalName", "expected": "SamAccountName CanonicalName\n-------------- -------------\njdupuis        entreprise.local/Commercial/jdupuis"},

  ]
};
</script>
