<script>
var DAY = {
  num: 21,
  title: "Profils et dossiers de base",
  subtitle: "Retrouver ses documents et son bureau depuis n'importe quel poste.",
  theory: `
<h3>1. Le profil utilisateur</h3>
<p>Un <strong>profil utilisateur</strong> est l'ensemble des données personnelles d'une session : le bureau, les documents, les favoris, les réglages de l'utilisateur. Sur un poste seul, ce profil est <strong>local</strong> : il reste sur cette machine. Le problème : si la personne change de poste, elle ne retrouve rien.</p>
<h3>2. Le profil itinérant</h3>
<p>Un <strong>profil itinérant</strong> (roaming profile) est un profil stocké sur un <strong>serveur</strong> partagé. À chaque ouverture de session, Windows le télécharge sur le poste ; à la fermeture, il le renvoie sur le serveur. Résultat : l'utilisateur retrouve son environnement sur n'importe quelle machine du domaine.</p>
<pre class="pseudo">ADUC ▸ double-clic sur l'utilisateur ▸ onglet Profil
   Chemin du profil :  \\SRV1\Profils\%username%       // %username% = nom du compte, dossier cree automatiquement
   ▸ OK</pre>
<div class="tip">La variable <code>%username%</code> est remplacée automatiquement par le nom du compte. En écrivant une seule fois <code>\\SRV1\Profils\%username%</code>, chaque utilisateur obtient son propre sous-dossier.</div>
<h3>3. Le dossier de base</h3>
<p>Le <strong>dossier de base</strong> (home folder) est un dossier réseau personnel où l'utilisateur range ses fichiers de travail. On peut le faire apparaître comme un lecteur (ex. <code>H:</code>). Il se configure dans le même onglet Profil.</p>
<pre class="pseudo">ADUC ▸ Propriétés de l'utilisateur ▸ onglet Profil ▸ section Dossier de base
   ● Connecter :  H:  À :  \\SRV1\Users\%username%     // lettre H: pointant vers le dossier personnel
   ▸ OK</pre>
<div class="warn">Le dossier partagé de destination (ex. <code>\\SRV1\Users</code>) doit exister et disposer des bons partages/permissions, sinon la création automatique du sous-dossier échoue.</div>
<h3>4. Profil obligatoire (mandatory)</h3>
<p>Un <strong>profil obligatoire</strong> (mandatory profile) est un profil itinérant en <strong>lecture seule</strong> : l'utilisateur peut travailler, mais ses modifications ne sont pas enregistrées à la déconnexion. Chaque session repart d'un état propre et identique. Utile pour des postes en libre-service (accueil, salle de formation).</p>
<h3>5. La redirection de dossiers (par GPO)</h3>
<p>La <strong>redirection de dossiers</strong> (folder redirection) est une alternative moderne et plus légère au profil itinérant : plutôt que de copier tout le profil, on redirige seulement certains dossiers (Documents, Bureau) vers le serveur. Cela se fait par GPO.</p>
<pre class="pseudo">Editeur de GPO ▸ Configuration utilisateur ▸ Strategies ▸ Parametres Windows
   ▸ Redirection de dossiers ▸ clic droit sur « Documents » ▸ Propriétés
      Paramètre : De base - Rediriger vers un emplacement...   // ou Avancé pour differencier par groupe
      Emplacement racine : \\SRV1\Redir\%username%\Documents
      ▸ OK</pre>
<div class="tip">Avantage de la redirection : seuls les dossiers ciblés voyagent, l'ouverture de session est plus rapide qu'avec un profil itinérant complet.</div>
<h3>6. Résumé des choix</h3>
<pre class="pseudo">Profil local       → simple, mais ne suit pas l'utilisateur
Profil itinérant   → suit l'utilisateur, mais peut etre lourd
Profil obligatoire → identique a chaque session, lecture seule
Redirection        → leger, cible juste Documents/Bureau, via GPO</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un profil itinérant ?", opts: ["Un profil stocké localement", "Un profil stocké sur un serveur, suivant l'utilisateur d'un poste à l'autre", "Un mot de passe", "Une OU"], a: 1, exp: "Il est téléchargé à l'ouverture et renvoyé au serveur à la fermeture." },
    { type: "qcm", q: "À quoi sert le dossier de base (home folder) ?", opts: ["À stocker le DNS", "À offrir un dossier réseau personnel pour les fichiers de travail", "À verrouiller le compte", "À lier une GPO"], a: 1, exp: "Un espace personnel réseau, souvent monté en lecteur H:." },
    { type: "qcm", q: "Que remplace la variable %username% dans un chemin ?", opts: ["Le nom du serveur", "Le nom du compte de l'utilisateur", "La date", "La lettre de lecteur"], a: 1, exp: "Chaque utilisateur obtient ainsi son propre sous-dossier." },
    { type: "qcm", q: "Un profil obligatoire (mandatory)…", opts: ["Enregistre toutes les modifications", "Est en lecture seule : les changements ne sont pas conservés à la déconnexion", "Supprime le compte", "Change le mot de passe"], a: 1, exp: "Chaque session repart d'un état propre et identique." },
    { type: "qcm", q: "La redirection de dossiers se configure via…", opts: ["ADUC uniquement", "Une GPO (Configuration utilisateur ▸ Redirection de dossiers)", "Le DNS", "Sites et services"], a: 1, exp: "C'est un réglage de stratégie de groupe." },
    { type: "qcm", q: "Avantage principal de la redirection sur le profil itinérant complet ?", opts: ["Elle est plus lourde", "Seuls certains dossiers voyagent : ouverture de session plus rapide", "Elle supprime le profil", "Elle chiffre le disque"], a: 1, exp: "On ne déplace que Documents/Bureau, pas tout le profil." },
    { type: "vf", q: "Un profil local suit l'utilisateur sur toutes les machines du domaine.", a: false, exp: "Non : le profil local reste sur la machine où il a été créé." },
    { type: "vf", q: "Le profil et le dossier de base se configurent dans l'onglet Profil des propriétés de l'utilisateur (ADUC).", a: true, exp: "Même onglet Profil pour les deux réglages." },
    { type: "vf", q: "Un profil obligatoire convient bien à un poste en libre-service (accueil).", a: true, exp: "Chaque session repart propre, les changements ne persistent pas." },
    { type: "input", q: "Quel sigle désigne la console où l'on ouvre les propriétés d'un utilisateur pour régler son profil ?", a: ["ADUC", "aduc"], ph: "sigle", exp: "Utilisateurs et ordinateurs Active Directory." },
    { type: "input", q: "Dans quel onglet des propriétés de l'utilisateur règle-t-on profil et dossier de base ?", a: ["Profil", "profil"], ph: "onglet", exp: "L'onglet Profil." },
    { type: "input", q: "Quelle variable, dans un chemin, est remplacée par le nom du compte ?", a: ["%username%", "username", "%USERNAME%"], ph: "variable", exp: "%username% crée un sous-dossier par utilisateur." },
    { type: "input", q: "Quel nom anglais désigne le profil itinérant ?", a: ["roaming profile", "roaming", "roaming profil"], ph: "terme anglais", exp: "Roaming profile." },
    { type: "input", q: "Quelle lettre de lecteur est proposée en exemple pour le dossier de base ?", a: ["H", "H:", "h", "h:"], ph: "lettre", exp: "Le home folder monté en H:." },
    { type: "input", q: "Comment appelle-t-on la fonction GPO qui déplace juste Documents/Bureau vers le serveur ?", a: ["Redirection de dossiers", "redirection de dossiers", "folder redirection"], ph: "nom", exp: "La redirection de dossiers." }
  ],
  final: {
    title: "Exercice final — Retrouver son bureau partout",
    intro: `<p>On veut que chaque utilisateur de l'OU <code>Personnel</code> retrouve son environnement sur n'importe quel poste, avec un dossier de base personnel en <strong>H:</strong>. Réponds sur la démarche.</p>`,
    questions: [
      { type: "qcm", q: "Pour retrouver l'environnement partout, quel type de profil ?", opts: ["Profil local", "Profil itinérant (roaming)", "Aucun profil", "Profil obligatoire"], a: 1, exp: "Le profil itinérant suit l'utilisateur." },
      { type: "input", q: "Dans quel onglet des propriétés de l'utilisateur configure-t-on cela ?", a: ["Profil", "profil"], ph: "onglet", exp: "L'onglet Profil dans ADUC." },
      { type: "input", q: "Quel chemin met-on comme Chemin du profil pour un dossier par personne ?", a: ["\\\\SRV1\\Profils\\%username%", "\\\\serveur\\profils\\%username%", "%username%"], ph: "chemin", exp: "%username% génère un sous-dossier par compte." },
      { type: "input", q: "Pour le dossier de base, quelle lettre de lecteur connecte-t-on ?", a: ["H", "H:", "h", "h:"], ph: "lettre", exp: "On connecte H: vers le dossier personnel." },
      { type: "vf", q: "Une alternative plus légère serait la redirection de dossiers par GPO.", a: true, exp: "Elle ne déplace que Documents/Bureau, session plus rapide." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. S'assurer que le partage \\SRV1\Profils et \\SRV1\Users existent avec les bonnes permissions
2. ADUC ▸ ouvrir l'OU Personnel ▸ double-clic sur un utilisateur ▸ onglet Profil
3. Chemin du profil : \\SRV1\Profils\%username%       // profil itinerant, un dossier par compte
4. Dossier de base ▸ Connecter H: À \\SRV1\Users\%username%   // espace personnel monte en H:
5. OK ▸ répéter (ou sélectionner plusieurs utilisateurs à la fois pour appliquer en lot)
6. Tester : ouvrir une session sur un autre poste et verifier que le bureau/documents suivent</pre>
<p>Pour alléger les ouvertures de session, on peut remplacer le profil itinérant complet par une redirection de dossiers (GPO) ciblant Documents et Bureau.</p>`
  }
};
</script>
