<script>
var DAY = {
  num: 1,
  title: "Active Directory : les concepts",
  subtitle: "Comprendre l'annuaire, le domaine, la forêt et les objets avant de cliquer.",
  theory: `
<h3>1. Qu'est-ce qu'un annuaire ?</h3>
<p>Un <strong>annuaire</strong> est une base de données organisée qui répertorie des ressources et permet de les retrouver rapidement. Pense à l'ancien <strong>annuaire téléphonique</strong> : des milliers de noms rangés par ordre alphabétique, chacun associé à un numéro et une adresse. Tu ne lis pas tout : tu cherches un nom, tu obtiens l'information.</p>
<p><strong>Active Directory</strong> (souvent abrégé <strong>AD</strong>) est l'annuaire de Microsoft pour les réseaux d'entreprise sous Windows. Il stocke les comptes des employés, les ordinateurs, les imprimantes, les groupes, et sert à contrôler <em>qui a le droit de faire quoi</em>. Le service exact qui fournit cet annuaire s'appelle <strong>AD DS</strong> (Active Directory Domain Services, « services de domaine Active Directory »).</p>
<div class="tip">Retiens l'idée centrale : au lieu de créer un compte séparé sur chaque PC, on crée <strong>un seul compte</strong> dans l'annuaire, et il fonctionne sur tous les ordinateurs du réseau. C'est l'ouverture de session <strong>centralisée</strong>.</div>
<h3>2. Le domaine</h3>
<p>Un <strong>domaine</strong> est le regroupement logique de tous ces comptes et ordinateurs sous une même autorité et un même nom, par exemple <code>entreprise.local</code>. Imagine une <strong>entreprise</strong> avec un service du personnel unique : toute personne embauchée y est enregistrée une fois, et cet enregistrement vaut dans tous les bureaux. Le domaine, c'est ce périmètre d'administration commun.</p>
<pre class="pseudo">Domaine : entreprise.local
   ├─ Utilisateurs (Marie, Paul, Sophie…)
   ├─ Ordinateurs (PC-COMPTA, PC-ACCUEIL…)
   └─ Groupes (Comptabilité, Direction…)</pre>
<h3>3. Le contrôleur de domaine (DC)</h3>
<p>Le <strong>contrôleur de domaine</strong> (en anglais <em>Domain Controller</em>, abrégé <strong>DC</strong>) est le serveur qui héberge l'annuaire et qui vérifie les identités. C'est le <strong>gardien</strong> du domaine : quand Marie tape son mot de passe le matin, c'est le contrôleur de domaine qui confirme « oui, c'est bien elle » et lui ouvre l'accès. Vérifier l'identité s'appelle l'<strong>authentification</strong>.</p>
<div class="warn">Sans contrôleur de domaine allumé et joignable, personne ne peut ouvrir de session avec un compte du domaine. On en installe souvent <strong>deux</strong> pour la sécurité : si l'un tombe en panne, l'autre prend le relais.</div>
<h3>4. La forêt et l'arbre</h3>
<p>Plusieurs domaines peuvent être regroupés. Un <strong>arbre</strong> est un ensemble de domaines qui partagent un même nom de base (comme <code>paris.entreprise.local</code> et <code>lyon.entreprise.local</code>). Une <strong>forêt</strong> est le plus grand contenant : elle regroupe un ou plusieurs arbres et représente la limite de sécurité la plus externe. Analogie : un <strong>arbre</strong> a un tronc et des branches (les sous-domaines) ; une <strong>forêt</strong> est l'ensemble des arbres qui poussent sur le même terrain.</p>
<div class="tip">Pour un petit réseau, on a le plus souvent <strong>une seule forêt</strong> contenant <strong>un seul domaine</strong>. C'est le cas que nous étudierons dans ce cours.</div>
<h3>5. Les objets</h3>
<p>Tout ce qui est stocké dans l'annuaire est un <strong>objet</strong> : un compte utilisateur, un compte ordinateur, un groupe, une imprimante. Chaque objet possède des <strong>attributs</strong> (des propriétés) : un utilisateur a un nom, un prénom, un service, un numéro de téléphone. Analogie : chaque objet est une <strong>fiche</strong> dans un fichier, et les attributs sont les cases remplies sur la fiche.</p>
<h3>6. Les unités d'organisation (OU)</h3>
<p>Une <strong>unité d'organisation</strong> (en anglais <em>Organizational Unit</em>, abrégée <strong>OU</strong>) est un conteneur qui sert à ranger les objets, comme un <strong>dossier</strong> range des fichiers. On crée par exemple une OU « Comptabilité » et une OU « Direction ». Ce rangement n'est pas que cosmétique : il servira plus tard à appliquer des règles différentes à chaque service.</p>
<h3>7. Les consoles d'administration (MMC)</h3>
<p>On administre AD par des fenêtres graphiques appelées <strong>consoles MMC</strong> (<em>Microsoft Management Console</em>). Une console est un tableau de bord regroupant les outils d'une tâche précise. Les principales de ce cours :</p>
<pre class="pseudo">ADUC  → Utilisateurs et ordinateurs Active Directory   (créer/gérer utilisateurs, ordinateurs, OU)
ADAC  → Centre d'administration Active Directory        (version moderne, avec corbeille)
GPMC  → Gestion des stratégies de groupe                (les règles GPO)
DNS   → Gestionnaire DNS                                (l'annuaire de noms du réseau)</pre>
<div class="warn">Ne confonds pas les sigles : <strong>ADUC</strong> sert aux comptes et OU, <strong>GPMC</strong> sert aux stratégies. Nous les manipulerons un par un dans les jours suivants.</div>`,
  exercises: [
    { type: "qcm", q: "Que désigne le sigle AD DS ?", opts: ["Active Directory Domain Services", "Advanced Data Disk Storage", "Automatic Domain DNS Server", "Active Desktop Display System"], a: 0, exp: "AD DS = Active Directory Domain Services, le service qui fournit l'annuaire." },
    { type: "qcm", q: "Quel serveur héberge l'annuaire et vérifie les mots de passe ?", opts: ["Le serveur d'impression", "Le contrôleur de domaine (DC)", "Le routeur", "Le client Windows"], a: 1, exp: "Le contrôleur de domaine authentifie les utilisateurs et stocke l'annuaire." },
    { type: "qcm", q: "Quel est le plus grand conteneur de la hiérarchie Active Directory ?", opts: ["L'OU", "Le domaine", "L'arbre", "La forêt"], a: 3, exp: "La forêt englobe les arbres, qui englobent les domaines, qui contiennent les OU." },
    { type: "qcm", q: "À quoi sert une unité d'organisation (OU) ?", opts: ["À chiffrer les mots de passe", "À ranger les objets comme un dossier range des fichiers", "À connecter Internet", "À sauvegarder le disque"], a: 1, exp: "Une OU est un conteneur de rangement pour les objets de l'annuaire." },
    { type: "qcm", q: "Un compte utilisateur, un compte ordinateur, un groupe : comment les appelle-t-on globalement dans AD ?", opts: ["Des fichiers", "Des objets", "Des services", "Des consoles"], a: 1, exp: "Tout élément stocké dans l'annuaire est un objet, décrit par des attributs." },
    { type: "qcm", q: "Quelle console graphique sert principalement à créer utilisateurs et OU ?", opts: ["GPMC", "DNS", "ADUC", "Hyper-V"], a: 2, exp: "ADUC (Utilisateurs et ordinateurs Active Directory) gère comptes, ordinateurs et OU." },
    { type: "vf", q: "Avec un domaine, un même compte utilisateur permet d'ouvrir une session sur plusieurs ordinateurs du réseau.", a: true, exp: "C'est justement l'intérêt de l'authentification centralisée." },
    { type: "vf", q: "Sans aucun contrôleur de domaine joignable, il reste possible d'ouvrir une session avec un compte du domaine.", a: false, exp: "Le contrôleur de domaine est indispensable pour authentifier un compte de domaine." },
    { type: "vf", q: "Une forêt peut contenir plusieurs domaines.", a: true, exp: "La forêt regroupe un ou plusieurs arbres, eux-mêmes composés de domaines." },
    { type: "input", q: "Quel sigle (3 lettres) désigne la console « Utilisateurs et ordinateurs Active Directory » ?", a: ["ADUC", "aduc"], ph: "un sigle", exp: "ADUC est la console historique de gestion des comptes et des OU." },
    { type: "input", q: "Quel sigle (2 lettres) désigne un contrôleur de domaine, en anglais Domain Controller ?", a: ["DC", "dc"], ph: "deux lettres", exp: "DC = Domain Controller = contrôleur de domaine." },
    { type: "input", q: "Comment appelle-t-on le conteneur qui range les objets comme un dossier (sigle 2 lettres) ?", a: ["OU", "ou"], ph: "un sigle", exp: "OU = Organizational Unit = unité d'organisation." },
    { type: "input", q: "Comment nomme-t-on l'opération qui vérifie l'identité d'un utilisateur qui se connecte ?", a: ["authentification", "l'authentification"], ph: "un mot", exp: "L'authentification confirme « qui tu es » à partir du mot de passe." },
    { type: "input", q: "Les fenêtres graphiques d'administration de Windows Server s'appellent des consoles quoi ? (sigle 3 lettres)", a: ["MMC", "mmc"], ph: "un sigle", exp: "MMC = Microsoft Management Console, le cadre commun des consoles." },
    { type: "qcm", q: "Quelle est la configuration typique d'un petit réseau d'entreprise ?", opts: ["Plusieurs forêts sans domaine", "Une seule forêt contenant un seul domaine", "Aucun domaine", "Un domaine sans contrôleur"], a: 1, exp: "Le cas le plus courant et le plus simple : une forêt, un domaine." }
  ],
  final: {
    title: "Exercice final — Cartographier un petit réseau",
    intro: `<p>Une PME nommée <strong>Belfort SA</strong> veut créer son premier domaine <code>belfort.local</code>. Elle a 12 employés répartis en deux services (Comptabilité et Commercial), 12 ordinateurs, et souhaite gérer tout cela de façon centralisée. Réponds aux questions en t'appuyant sur les concepts du jour.</p>`,
    questions: [
      { type: "qcm", q: "Quel élément doit obligatoirement exister pour que belfort.local fonctionne ?", opts: ["Une imprimante", "Au moins un contrôleur de domaine", "Un site web", "Un pare-feu matériel"], a: 1, exp: "Sans contrôleur de domaine, pas d'annuaire ni d'authentification." },
      { type: "input", q: "Pour ranger séparément les comptes des deux services, quel type de conteneur va-t-on créer (sigle 2 lettres) ?", a: ["OU", "ou"], ph: "un sigle", exp: "On crée une OU par service : OU Comptabilité, OU Commercial." },
      { type: "qcm", q: "Les 12 comptes des employés, dans l'annuaire, sont des…", opts: ["consoles", "objets utilisateur", "forêts", "attributs"], a: 1, exp: "Chaque employé correspond à un objet utilisateur avec ses attributs." },
      { type: "input", q: "Quelle console graphique (sigle) l'administrateur ouvrira-t-il pour créer ces comptes ?", a: ["ADUC", "aduc"], ph: "un sigle", exp: "ADUC permet de créer les utilisateurs et les OU." },
      { type: "vf", q: "Pour la sécurité, il est recommandé d'installer deux contrôleurs de domaine plutôt qu'un seul.", a: true, exp: "Si l'un tombe, l'autre continue d'authentifier les utilisateurs." }
    ],
    solution: `<p>Marche à suivre conceptuelle pour Belfort SA :</p>
<pre class="pseudo">1. Installer un serveur puis le rôle AD DS       // jours 2 et 3
2. Promouvoir ce serveur en contrôleur de domaine → domaine belfort.local   // jour 4
3. (Recommandé) Ajouter un 2e contrôleur de domaine pour la tolérance de panne
4. Ouvrir ADUC ▸ créer les OU Comptabilite et Commercial   // jour 10
5. Dans chaque OU, créer les objets utilisateur des employés   // jour 7
6. Joindre les 12 ordinateurs au domaine belfort.local   // jour 14</pre>
<p>On obtient un domaine unique, dans une forêt unique, avec des comptes centralisés : un seul identifiant par employé, valable sur tous les postes.</p>`
  }
};
</script>
