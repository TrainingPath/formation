<script>
var DAY = {
  num: 28,
  title: "Auditer et sécuriser (stratégies d'audit)",
  subtitle: "Garder une trace de qui fait quoi, pour détecter et prouver.",
  theory: `
<h3>1. Qu'est-ce que l'audit ?</h3>
<p><strong>Auditer</strong>, c'est demander au système d'<strong>enregistrer certains événements</strong> (connexions, accès à un fichier, modifications de comptes) dans un journal, afin de savoir plus tard <strong>qui a fait quoi et quand</strong>. Une <strong>stratégie d'audit</strong> (audit policy) définit précisément quels événements sont tracés.</p>
<div class="tip">L'audit répond à trois besoins : <strong>détecter</strong> une intrusion, <strong>enquêter</strong> après un incident, et <strong>prouver</strong> (conformité). Sans audit, une action malveillante ne laisse aucune trace exploitable.</div>
<h3>2. Réussite et échec</h3>
<p>Pour chaque catégorie, on choisit de tracer les <strong>succès</strong> (l'action a réussi), les <strong>échecs</strong> (l'action a été refusée), ou les deux. Exemple : auditer les <strong>échecs</strong> d'ouverture de session révèle des tentatives d'intrusion ; auditer les <strong>succès</strong> montre qui s'est réellement connecté.</p>
<h3>3. Où se règle l'audit ? (par GPO)</h3>
<p>La stratégie d'audit se configure dans une GPO. Pour l'ensemble des DC, on l'applique typiquement à la GPO liée à l'OU spéciale <strong>Domain Controllers</strong>, la <strong>Default Domain Controllers Policy</strong>.</p>
<pre class="pseudo">GPMC ▸ OU Domain Controllers ▸ clic droit Default Domain Controllers Policy ▸ Modifier
Editeur ▸ Configuration ordinateur ▸ Strategies ▸ Parametres Windows
   ▸ Parametres de securite ▸ Strategies locales ▸ Strategie d'audit   // audit "classique"</pre>
<h3>4. L'audit avancé (recommandé)</h3>
<p>Windows propose un <strong>audit avancé</strong> (Advanced Audit Policy) : les mêmes idées, mais avec des <strong>sous-catégories</strong> beaucoup plus fines (ex. « Modification de compte d'utilisateur » séparé de « Modification de groupe »). C'est la méthode conseillée aujourd'hui.</p>
<pre class="pseudo">Editeur ▸ Configuration ordinateur ▸ Strategies ▸ Parametres Windows ▸ Parametres de securite
   ▸ Configuration avancée de la stratégie d'audit ▸ Stratégies d'audit
      ▸ Connexion au compte / Gestion des comptes / Accès aux objets / etc.
         → cocher Réussite et/ou Échec</pre>
<div class="warn">Ne mélange pas l'audit « classique » (Stratégies locales) et l'audit avancé : le paramètre « Forcer les sous-catégories… à remplacer les catégories » évite les conflits. En pratique, choisis l'audit avancé.</div>
<h3>5. Les catégories les plus utiles</h3>
<pre class="pseudo">Connexion au compte        authentifications (ex. tentatives sur un DC)
Gestion des comptes        creation/suppression/modif d'utilisateurs et de groupes
Accès aux objets           lecture/ecriture de fichiers, dossiers, cles (audit d'un dossier sensible)
Modification de stratégie  changements des GPO/strategies elles-memes
Utilisation de privilèges  usage de droits sensibles (ex. prise de propriete)</pre>
<h3>6. Auditer un dossier précis (SACL)</h3>
<p>Pour tracer les accès à un dossier sensible, activer « Accès aux objets » ne suffit pas : il faut aussi poser une <strong>SACL</strong> (System Access Control List, « liste de contrôle d'accès système ») sur le dossier lui-même, c'est-à-dire dire <em>quels</em> accès de <em>qui</em> doivent être journalisés.</p>
<pre class="pseudo">Propriétés du dossier ▸ Sécurité ▸ Avancé ▸ onglet Audit ▸ Ajouter
   → choisir un principal (ex. Tout le monde) ▸ type Réussite/Échec ▸ autorisations à auditer</pre>
<h3>7. Lire les résultats</h3>
<p>Les événements d'audit s'écrivent dans le journal <strong>Sécurité</strong> de l'<strong>Observateur d'événements</strong>, chacun avec un <strong>ID d'événement</strong> (ex. 4624 : ouverture de session réussie ; 4625 : échec ; 4720 : compte créé). On y filtre par date, ID ou utilisateur.</p>`,
  exercises: [
    { type: "qcm", q: "Que permet une stratégie d'audit ?", opts: ["Chiffrer les disques", "Enregistrer certains événements pour savoir qui a fait quoi", "Mapper des lecteurs", "Créer un site"], a: 1, exp: "L'audit trace des événements dans un journal." },
    { type: "qcm", q: "Auditer les échecs d'ouverture de session sert surtout à…", opts: ["Accélérer la connexion", "Repérer des tentatives d'intrusion", "Créer des GPO", "Changer le DNS"], a: 1, exp: "Des échecs répétés trahissent une attaque." },
    { type: "qcm", q: "Où s'écrivent les événements d'audit ?", opts: ["Journal Application", "Journal Sécurité de l'Observateur d'événements", "Le DNS", "SYSVOL"], a: 1, exp: "Le journal Sécurité recueille les événements audités." },
    { type: "qcm", q: "Quelle méthode d'audit est recommandée aujourd'hui ?", opts: ["L'audit classique (Stratégies locales)", "L'audit avancé (sous-catégories fines)", "Aucun audit", "Le DNS inversé"], a: 1, exp: "L'audit avancé offre des sous-catégories précises." },
    { type: "qcm", q: "Pour tracer les accès à un dossier sensible, en plus d'activer « Accès aux objets », il faut…", opts: ["Redémarrer", "Poser une SACL sur le dossier", "Supprimer le dossier", "Créer une OU"], a: 1, exp: "La SACL dit quels accès de qui journaliser." },
    { type: "qcm", q: "Sur quelle GPO applique-t-on l'audit pour tous les DC ?", opts: ["Default Domain Policy", "Default Domain Controllers Policy (OU Domain Controllers)", "Une GPO de test", "Aucune"], a: 1, exp: "L'OU Domain Controllers regroupe les DC." },
    { type: "vf", q: "On peut auditer séparément les succès et les échecs d'une catégorie.", a: true, exp: "Réussite, Échec, ou les deux, selon le besoin." },
    { type: "vf", q: "L'audit sert à détecter, enquêter et prouver.", a: true, exp: "Ce sont ses trois usages principaux." },
    { type: "vf", q: "Activer « Accès aux objets » suffit à journaliser les accès à un dossier précis.", a: false, exp: "Non : il faut aussi une SACL sur le dossier." },
    { type: "input", q: "Quel sigle désigne la liste de contrôle d'accès système posée sur un objet pour l'auditer ?", a: ["SACL", "sacl"], ph: "sigle", exp: "System Access Control List." },
    { type: "input", q: "Dans quel journal de l'Observateur d'événements lit-on les événements d'audit ?", a: ["Sécurité", "Securite", "sécurité"], ph: "journal", exp: "Le journal Sécurité." },
    { type: "input", q: "Comment appelle-t-on la méthode d'audit avec sous-catégories fines ? (audit …)", a: ["avancé", "avance", "audit avancé", "Configuration avancée de la stratégie d'audit"], ph: "type", exp: "L'audit avancé." },
    { type: "input", q: "Quel ID d'événement correspond à une ouverture de session réussie ? (nombre)", a: ["4624", "4 624"], ph: "ID", exp: "4624 = ouverture de session réussie." },
    { type: "input", q: "Quel ID d'événement correspond à un échec d'ouverture de session ? (nombre)", a: ["4625", "4 625"], ph: "ID", exp: "4625 = échec d'ouverture de session." },
    { type: "input", q: "Quelle catégorie d'audit couvre la création/suppression de comptes ? (Gestion des …)", a: ["comptes", "Gestion des comptes", "gestion des comptes"], ph: "catégorie", exp: "Gestion des comptes." }
  ],
  final: {
    title: "Exercice final — Tracer les accès à un dossier sensible",
    intro: `<p>La direction veut savoir <strong>qui accède</strong> au dossier <code>D:\\Paie</code> sur un serveur, en cas de réussite comme d'échec. Réponds sur la démarche via l'interface.</p>`,
    questions: [
      { type: "qcm", q: "Quelle catégorie d'audit faut-il d'abord activer ?", opts: ["Connexion au compte", "Accès aux objets", "Modification de stratégie", "Utilisation de privilèges"], a: 1, exp: "L'accès à un fichier/dossier relève de « Accès aux objets »." },
      { type: "input", q: "Quel élément faut-il poser sur le dossier D:\\Paie lui-même ? (sigle)", a: ["SACL", "sacl"], ph: "sigle", exp: "Une SACL, dans l'onglet Audit des propriétés." },
      { type: "qcm", q: "Où pose-t-on cet élément d'audit sur le dossier ?", opts: ["Propriétés ▸ Général", "Propriétés ▸ Sécurité ▸ Avancé ▸ onglet Audit", "Propriétés ▸ Partage", "Dans le DNS"], a: 1, exp: "L'onglet Audit des paramètres de sécurité avancés." },
      { type: "vf", q: "On coche à la fois Réussite et Échec pour tout tracer.", a: true, exp: "La demande couvre les deux cas." },
      { type: "input", q: "Dans quel journal lira-t-on ensuite les accès enregistrés ?", a: ["Sécurité", "Securite", "sécurité"], ph: "journal", exp: "Le journal Sécurité de l'Observateur d'événements." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. GPMC ▸ GPO liée au serveur (ou Default Domain Controllers Policy s'il s'agit d'un DC) ▸ Modifier
2. Configuration ordinateur ▸ Strategies ▸ Parametres Windows ▸ Parametres de securite
   ▸ Configuration avancée de la stratégie d'audit ▸ Accès aux objets
   ▸ « Auditer le système de fichiers » ▸ cocher Réussite et Échec
3. Sur le serveur : clic droit sur D:\Paie ▸ Propriétés ▸ Sécurité ▸ Avancé ▸ onglet Audit
4. Ajouter ▸ principal « Tout le monde » ▸ type « Tous » (Réussite + Échec) ▸ autorisations à auditer ▸ OK
5. gpupdate /force pour appliquer la stratégie
6. Observateur d'événements ▸ journal Sécurité ▸ filtrer par date/utilisateur pour voir les accès</pre>
<p>Deux ingrédients sont indispensables : la <strong>catégorie</strong> d'audit activée par GPO ET la <strong>SACL</strong> posée sur le dossier. L'une sans l'autre ne journalise rien.</p>`
  }
};
</script>
