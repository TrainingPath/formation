  num: 14,
  title: "Joindre un poste au domaine",
  subtitle: "Faire entrer un PC Windows dans le domaine depuis les paramètres graphiques.",
  theory: `
<h3>1. Groupe de travail ou domaine ?</h3>
<p>Par défaut, un PC Windows fraîchement installé est dans un <strong>groupe de travail</strong> (workgroup) : il est seul, avec ses propres comptes locaux. <strong>Joindre le domaine</strong>, c'est le rattacher à l'annuaire pour que les comptes du domaine puissent s'y connecter et qu'il soit géré de façon centralisée. Analogie : le PC quitte la <strong>maison individuelle</strong> (groupe de travail) pour emménager dans l'<strong>immeuble géré par un concierge</strong> (le domaine).</p>
<div class="tip">Après jonction, un compte objet <strong>ordinateur</strong> est créé automatiquement dans AD (par défaut dans le conteneur Computers). Le PC devient un membre du domaine, avec sa propre identité dans l'annuaire.</div>
<h3>2. Les prérequis</h3>
<pre class="pseudo">- Le PC doit joindre le bon SERVEUR DNS : celui du domaine (le contrôleur de domaine)
- Le contrôleur de domaine doit être joignable sur le réseau
- Il faut un compte AUTORISÉ à joindre des machines (ex. un administrateur du domaine)
- Windows édition Pro/Entreprise (l'édition Famille ne peut PAS rejoindre un domaine)</pre>
<div class="warn">Le point le plus fréquent d'échec : le PC n'utilise pas le bon DNS. Il DOIT pointer vers le serveur DNS du domaine (souvent le contrôleur de domaine lui-même), sinon il ne trouvera pas le domaine. On règle le DNS dans les propriétés de la carte réseau.</div>
<h3>3. Vérifier/régler le DNS du client</h3>
<pre class="pseudo">Sur le PC client :
Paramètres ▸ Réseau et Internet ▸ (carte) ▸ Modifier les options d'adaptateur
   ▸ clic droit sur la carte ▸ Propriétés
   ▸ « Protocole Internet version 4 (TCP/IPv4) » ▸ Propriétés
   ▸ Serveur DNS préféré : (adresse IP du contrôleur de domaine) ▸ OK</pre>
<h3>4. Joindre le domaine (interface moderne)</h3>
<pre class="pseudo">Sur le PC client :
Paramètres ▸ Système ▸ Informations système ▸ « Domaine ou groupe de travail »
   → ouvre l'ancienne fenêtre « Propriétés système »
   ▸ onglet « Nom de l'ordinateur » ▸ bouton « Modifier… »
   ▸ section « Membre de » : cocher (o) Domaine ▸ taper entreprise.local ▸ OK
   ▸ saisir un compte autorisé (ex. ENTREPRISE\Administrateur) + mot de passe ▸ OK
   ▸ message « Bienvenue dans le domaine entreprise.local » ▸ OK
   ▸ redémarrer le PC</pre>
<div class="tip">Le raccourci historique pour ouvrir « Propriétés système » directement : la commande <code>sysdm.cpl</code> (Win+R). On arrive au même onglet « Nom de l'ordinateur ».</div>
<h3>5. Après le redémarrage : ouvrir une session du domaine</h3>
<p>Sur l'écran de connexion, on choisit « Autre utilisateur » et on saisit un compte du domaine :</p>
<pre class="pseudo">Nom : entreprise\mdurand   (ou mdurand@entreprise.local)
Mot de passe : ********
→ le contrôleur de domaine authentifie : la session du domaine s'ouvre</pre>
<h3>6. Vérifier côté serveur</h3>
<p>De retour sur le contrôleur de domaine, on constate que le compte ordinateur est apparu :</p>
<pre class="pseudo">ADUC ▸ conteneur « Computers » ▸ le PC (ex. PC-COMPTA01) est listé</pre>
<div class="warn">Si tu as prévu une OU dédiée aux ordinateurs (jour 10), pense à DÉPLACER le compte ordinateur du conteneur Computers vers cette OU pour qu'il reçoive les bonnes GPO (jour 15).</div>`,
  exercises: [
    { type: "qcm", q: "Dans quel état est un PC Windows neuf par défaut ?", opts: ["Déjà dans le domaine", "Dans un groupe de travail (workgroup)", "Éteint définitivement", "Contrôleur de domaine"], a: 1, exp: "Par défaut, un PC est en groupe de travail, isolé." },
    { type: "qcm", q: "Que crée automatiquement la jonction au domaine ?", opts: ["Une imprimante", "Un compte objet ordinateur dans AD", "Une nouvelle forêt", "Un site web"], a: 1, exp: "Un compte ordinateur est créé, par défaut dans le conteneur Computers." },
    { type: "qcm", q: "Quel est le prérequis réseau le plus souvent oublié ?", opts: ["La couleur du câble", "Que le PC utilise le DNS du domaine (le contrôleur de domaine)", "Un deuxième écran", "Un antivirus tiers"], a: 1, exp: "Sans le bon DNS, le PC ne trouve pas le domaine." },
    { type: "qcm", q: "Quelle édition de Windows NE peut PAS rejoindre un domaine ?", opts: ["Professionnel", "Entreprise", "Famille (Home)", "Éducation"], a: 2, exp: "L'édition Famille ne prend pas en charge la jonction de domaine." },
    { type: "qcm", q: "Où coche-t-on « Domaine » pour joindre le PC ?", opts: ["Dans le pare-feu", "Propriétés système ▸ Nom de l'ordinateur ▸ Modifier ▸ Membre de : Domaine", "Dans DNS", "Dans le BIOS"], a: 1, exp: "L'option « Membre de : Domaine » se trouve dans Propriétés système." },
    { type: "qcm", q: "Que faut-il fournir pour valider la jonction ?", opts: ["Rien", "Un compte autorisé à joindre des machines et son mot de passe", "Le mot de passe DSRM", "Une clé de licence Windows"], a: 1, exp: "Un compte autorisé (souvent admin du domaine) confirme la jonction." },
    { type: "vf", q: "Après avoir joint le domaine, il faut redémarrer le PC.", a: true, exp: "Un redémarrage finalise la jonction." },
    { type: "vf", q: "Le compte ordinateur créé apparaît par défaut dans le conteneur Computers.", a: true, exp: "C'est l'emplacement par défaut des nouveaux ordinateurs." },
    { type: "vf", q: "Un PC en édition Famille peut rejoindre le domaine sans problème.", a: false, exp: "Seules les éditions Pro/Entreprise/Éducation le peuvent." },
    { type: "input", q: "Comment appelle-t-on l'état par défaut isolé d'un PC (un mot, français ou anglais) ?", a: ["groupe de travail", "workgroup", "groupe de travail (workgroup)"], ph: "un terme", exp: "Le groupe de travail (workgroup)." },
    { type: "input", q: "Vers quel serveur le DNS du PC client doit-il pointer (deux mots) ?", a: ["contrôleur de domaine", "controleur de domaine", "le contrôleur de domaine", "DC"], ph: "deux mots", exp: "Le serveur DNS du domaine, souvent le contrôleur de domaine." },
    { type: "input", q: "Quelle commande (Win+R) ouvre directement Propriétés système ?", a: ["sysdm.cpl", "SYSDM.CPL", "sysdm"], ph: "une commande .cpl", exp: "sysdm.cpl ouvre Propriétés système." },
    { type: "input", q: "Dans quel conteneur AD apparaît le PC joint par défaut (un mot) ?", a: ["Computers", "computers"], ph: "un mot", exp: "Le conteneur Computers." },
    { type: "input", q: "Sous quelle forme saisit-on un compte du domaine à l'ouverture de session ? (donne un exemple avec entreprise et mdurand)", a: ["entreprise\\mdurand", "mdurand@entreprise.local", "entreprise/mdurand"], ph: "domaine\\utilisateur", exp: "entreprise\\mdurand ou mdurand@entreprise.local." },
    { type: "qcm", q: "Après la jonction, pourquoi déplacer le compte ordinateur vers une OU dédiée ?", opts: ["Pour le cacher", "Pour qu'il reçoive les bonnes GPO", "Pour le supprimer", "Pour changer son nom"], a: 1, exp: "Les GPO s'appliquent aux OU : on range l'ordinateur dans la bonne OU." }
  ],
  final: {
    title: "Exercice final — Rattacher PC-COMPTA01 au domaine",
    intro: `<p>Le poste PC-COMPTA01 (Windows 11 Pro) doit rejoindre <code>entreprise.local</code> pour que Marie s'y connecte avec son compte de domaine. Décris les vérifications et la marche à suivre.</p>`,
    questions: [
      { type: "qcm", q: "Première vérification avant de joindre le domaine ?", opts: ["La luminosité de l'écran", "Que le DNS du PC pointe vers le contrôleur de domaine", "Le fond d'écran", "La souris"], a: 1, exp: "Le bon DNS est la condition clé de réussite." },
      { type: "input", q: "Quelle commande ouvre directement Propriétés système pour joindre le domaine ?", a: ["sysdm.cpl", "sysdm"], ph: "une commande", exp: "sysdm.cpl." },
      { type: "qcm", q: "Dans « Membre de », que sélectionnes-tu ?", opts: ["Groupe de travail", "Domaine, puis entreprise.local", "Rien", "Contrôleur de domaine"], a: 1, exp: "On coche Domaine et on saisit entreprise.local." },
      { type: "vf", q: "Tu dois saisir un compte autorisé (ex. ENTREPRISE\\Administrateur) pour valider.", a: true, exp: "Un compte autorisé confirme la jonction." },
      { type: "input", q: "Sous quel nom Marie ouvrira-t-elle sa session ensuite (exemple) ?", a: ["entreprise\\mdurand", "mdurand@entreprise.local"], ph: "domaine\\utilisateur", exp: "entreprise\\mdurand ou mdurand@entreprise.local." }
    ],
    solution: `<p>Rattacher PC-COMPTA01 :</p>
<pre class="pseudo">1. (Client) Régler le DNS : Options d'adaptateur ▸ carte ▸ Propriétés ▸ TCP/IPv4
      ▸ Serveur DNS préféré = IP du contrôleur de domaine ▸ OK
2. Win+R ▸ sysdm.cpl ▸ onglet « Nom de l'ordinateur » ▸ Modifier…
3. Membre de : (o) Domaine ▸ taper entreprise.local ▸ OK
4. Compte autorisé : ENTREPRISE\Administrateur + mot de passe ▸ OK
5. Message « Bienvenue dans le domaine entreprise.local » ▸ OK
6. Redémarrer le PC
7. Écran de connexion ▸ Autre utilisateur ▸ entreprise\mdurand + mot de passe
8. (Serveur) ADUC ▸ conteneur Computers ▸ vérifier la présence de PC-COMPTA01
9. Déplacer PC-COMPTA01 vers l'OU Comptabilite\Ordinateurs (pour les GPO)</pre>
<p>Le poste est membre du domaine ; Marie s'y connecte avec son compte centralisé.</p>`
  }
};
