<body>
<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : l'API de la Ludothèque complète (examen)",
  subtitle: "Vingt leçons, une API. Aujourd'hui, tu signes le contrat de la Ludothèque.",
  theory: `
<h3>1. Semaine 1 — la conversation HTTP</h3>
<p>Tout repose sur un dialogue <strong>stateless</strong> (sans mémoire) : le client demande, le serveur répond, rien n'est mémorisé entre deux requêtes (leçon 1). D'où le token qui voyage à chaque appel, d'où le cache, d'où tout le reste :</p>
<pre class="pseudo">REQUÊTE   MÉTHODE + chemin + en-têtes + corps JSON éventuel                    # une requête = ce que le CLIENT envoie
          GET lire · POST créer · PUT remplacer · PATCH modifier · DELETE retirer   # les 5 verbes (méthodes) et leur rôle
RÉPONSE   CODE + en-têtes + corps                                              # une réponse = ce que le SERVEUR renvoie
          2xx c'est fait · 3xx ailleurs/cache · 4xx ta faute · 5xx ma faute    # les 4 familles de codes de statut
          200 · 201(+Location) · 204 · 304 · 400 · 401 · 403 · 404             # les codes courants (succès et erreurs)…
          405 · 409 · 422 · 429 · 500 · 503                                    # …et la suite (erreurs client puis serveur)
JSON      la langue commune : objets, listes, chaînes, nombres, booléens, null # le format de données universel des API</pre>

<h3>2. Semaine 2 — concevoir : des ressources, pas des actions</h3>
<pre class="pseudo">Des NOMS au pluriel : /jeux · /membres · /locations   (jamais /getJeux)         # l'URL désigne une CHOSE, jamais une action
CRUD : GET /jeux · GET /jeux/5 · POST /jeux · PATCH /jeux/5 · DELETE /jeux/5     # les 5 opérations de base sur une ressource
Query params : /jeux?categorie=strategie&amp;tri=titre&amp;page=2&amp;page_size=20         # filtrer + trier + paginer, après le ?
  → enveloppe { "count": 87, "next": …, "previous": …, "results": […] }         # la réponse paginée : total, liens, page
Relations : /jeux/5/avis (appartenance forte, 2 niveaux max)                    # sous-ressource : l'avis appartient au jeu
  /locations?membre=12 ≡ /membres/12/locations (raccourci documenté)            # deux chemins équivalents pour la même liste</pre>
<p>Une action métier n'est jamais un verbe d'URL : « rendre un jeu » = <code>PATCH /locations/40</code> avec <code>{ "statut": "terminee" }</code>. Quelle ressource, quel état ? — la question mère du cours.</p>

<h3>3. Semaine 2 — professionnaliser : erreurs, versions, doc</h3>
<pre class="pseudo">Erreurs : une enveloppe UNIQUE partout, jamais de stack trace                   # même format d'erreur pour tout, aucune fuite interne
  { "erreur": { "code", "message", "details": { champ: [messages] } } }         # code (programme) + message (humain) + détails par champ
  422 données invalides (400 si illisible) · 500 → message générique + ref      # 422 = sens KO ; 400 = JSON cassé ; 500 = message neutre + ref
Versions : /v1/ dès le premier jour · cassant → v2 · additif → v1               # versionner : le cassant crée v2, l'additif reste en v1
  déprécier : Deprecation + Sunset → 410 Gone                                   # retirer une version proprement, avec préavis
Doc : OpenAPI générée du code (drf-spectacular) + Swagger UI (/api/docs)        # documentation issue du code + interface d'essai</pre>

<h3>4. Semaine 3 — sécuriser</h3>
<p>Rappel des sigles : le <strong>JWT</strong> est le format de token porteur d'identité ; <strong>CORS</strong> est la règle qui autorise (ou non) un site web d'une autre origine à appeler ton API depuis un navigateur.</p>
<pre class="pseudo">Auth : POST /auth/login → JWT · Authorization: Bearer &lt;token&gt;                    # se connecter, puis envoyer le token à CHAQUE requête
  session+cookie = site même domaine · API key = machine-à-machine              # autres stratégies, selon le type de client
  HTTPS obligatoire · JAMAIS de secret dans une URL                            # règles de transport non négociables
401 « qui es-tu ? » ≠ 403 « je sais qui tu es : non » · permissions par rôle    # 401 = identité manquante ; 403 = droit refusé
CORS : le SERVEUR déclare ses origines (Access-Control-Allow-Origin)            # le serveur liste les sites d'origine autorisés
  preflight OPTIONS · CORS ne protège PAS le serveur (curl s'en moque)          # le navigateur pré-demande en OPTIONS ; CORS ≠ sécurité serveur</pre>

<h3>5. Semaine 3 — tenir la route, et l'examen</h3>
<pre class="pseudo">Idempotence : GET/PUT/DELETE rejouables · POST + Idempotency-Key               # rejouer sans dégât ; POST protégé par une clé d'idempotence
Cache : Cache-Control · ETag / If-None-Match → 304 · no-store (personnel)      # garder des copies ; 304 = « pas changé » ; no-store = données privées
Débit : 429 + Retry-After · quota serré sur /auth/login                        # limiter le nombre de requêtes ; login très surveillé
Client : tester rep.ok · timeout obligatoire · router sur les codes           # côté client : vérifier la réponse, délai maximal, agir selon le code
         UN module client (401 → reconnexion, 422 → details par champ)         # centraliser la gestion des réponses en un seul endroit</pre>
<p>Place à l'examen : 15 questions d'entraînement, puis 5 questions finales qui traversent tout le cours. La solution de l'exercice final est le document que tu poursuis depuis la leçon 1 : le <strong>contrat d'API complet de la Ludothèque</strong>. Bonne chance — tu es prêt.</p>
<div class="warn">À l'examen comme en production, les pièges sont toujours les mêmes : 401 contre 403, PUT contre PATCH, 400 contre 422, « CORS protège le serveur » (non), « fetch rejette sur 404 » (non). Relis deux fois avant de répondre.</div>
<div class="tip">En cas d'hésitation, reviens à la question mère : <strong>quelle ressource, quel état, qui le demande ?</strong> La méthode, l'URL et le code en découlent presque toujours.</div>`,
  exercises: [
    { type: "qcm", q: "(L1) HTTP est dit « stateless » parce que…", opts: ["Il ne transporte pas de données", "Le serveur ne garde aucune mémoire entre deux requêtes", "Il n'a pas de codes d'erreur", "Il ne fonctionne que la journée"], a: 1, exp: "D'où la preuve d'identité qui accompagne CHAQUE requête protégée (leçon 15)." },
    { type: "qcm", q: "(L2) L'en-tête qui annonce le format du corps envoyé :", opts: ["Accept-Language", "Host", "Content-Type", "User-Agent"], a: 2, exp: "Content-Type: application/json — Accept, lui, annonce ce qu'on veut recevoir." },
    { type: "qcm", q: "(L4) Modifier UNIQUEMENT le champ « disponible » du jeu 5 :", opts: ["PUT /jeux/5", "PATCH /jeux/5", "POST /jeux", "GET /jeux/5?disponible=false"], a: 1, exp: "Modification partielle = PATCH ; PUT remplace la ressource entière." },
    { type: "qcm", q: "(L5) Token valide, mais l'opération est réservée à l'admin :", opts: ["401", "403", "404", "422"], a: 1, exp: "Identité connue, droit refusé : 403 — se ré-authentifier n'y changera rien." },
    { type: "qcm", q: "(L6) L'endpoint bien conçu pour lister les jeux :", opts: ["GET /getJeux", "POST /jeux/liste", "GET /jeux", "GET /api?action=listerJeux"], a: 2, exp: "Des noms, pas des verbes : la méthode porte l'action, l'URL désigne la ressource." },
    { type: "qcm", q: "(L9) Réponse d'un POST /jeux réussi :", opts: ["200 sans corps", "201 + en-tête Location + le jeu créé", "204", "302"], a: 1, exp: "Created, avec l'adresse de la nouvelle ressource dans Location." },
    { type: "qcm", q: "(L10) Dans l'enveloppe paginée, « next » contient…", opts: ["Le nombre de pages restantes", "L'URL de la page suivante, ou null en bout de liste", "Le prochain id libre", "La date de la prochaine mise à jour"], a: 1, exp: "count, next, previous, results : le front suit les liens sans rien calculer." },
    { type: "qcm", q: "(L12) Le corps d'un 422 bien conçu contient…", opts: ["La stack trace pour aider", "Un texte brut « erreur »", "L'enveloppe commune avec details champ par champ", "Rien"], a: 2, exp: "{ \"erreur\": { \"code\", \"message\", \"details\": { champ: [messages] } } }." },
    { type: "qcm", q: "(L13) Renommer « prix » en « prix_location » dans les réponses est…", opts: ["Compatible", "Cassant : il faut une nouvelle version majeure", "Un simple détail", "Interdit"], a: 1, exp: "Les clients existants lisent un champ disparu : /v2, dépréciation, Sunset, 410." },
    { type: "qcm", q: "(L14) Swagger UI est…", opts: ["Un framework", "La doc interactive générée depuis le document OpenAPI", "Une base de données", "Un protocole"], a: 1, exp: "Try it out + Authorize : le contrat lisible ET essayable." },
    { type: "qcm", q: "(L15-16) Le JWT voyage…", opts: ["Dans l'URL (?token=…)", "Dans un en-tête Authorization: Bearer", "Dans le DNS", "Dans le champ id du JSON"], a: 1, exp: "Jamais dans l'URL (logs, historique) ; HTTPS obligatoire." },
    { type: "vf", q: "(L18) CORS protège ton serveur contre les appels de curl et des scripts.", a: false, exp: "Seuls les navigateurs appliquent CORS, pour protéger l'utilisateur ; la défense du serveur = auth + permissions." },
    { type: "vf", q: "(L19) PUT est idempotente : remplacer deux fois par le même corps laisse le même état.", a: true, exp: "Comme GET et DELETE — contrairement à POST, jamais rejoué sans Idempotency-Key." },
    { type: "input", q: "(L5) Le code pour « louer un jeu déjà loué » :", a: ["409"], ph: "Un code…", exp: "409 Conflict : la requête contredit l'état actuel de la ressource." },
    { type: "input", q: "(L18) La méthode HTTP du preflight CORS :", a: ["OPTIONS", "options"], ph: "MÉTHODE", exp: "OPTIONS + Access-Control-Request-Method, avant toute requête « non simple »." }
  ],
  final: {
    title: "Exercice final — L'examen : le contrat de la Ludothèque",
    intro: `<p>Cinq questions qui traversent les vingt leçons. Réussis-les, puis compare la solution au contrat que tu portes en tête depuis la leçon 1.</p>`,
    questions: [
      { type: "qcm", q: "La séquence complète et correcte pour qu'Aïcha loue Catan depuis l'app mobile :", opts: ["GET /louerJeu?membre=12&amp;jeu=5&amp;token=abc", "POST /v1/auth/login → token, puis POST /v1/locations avec Authorization: Bearer et { \"jeu\": 5 } → 201 + Location", "PUT /v1/locations sans authentification → 200", "POST /v1/jeux/5 avec le mot de passe dans l'URL"], a: 1, exp: "Login → token → POST sur la collection, preuve d'identité en en-tête, 201 + Location : tout le cours en une ligne." },
      { type: "qcm", q: "Aïcha (token valide, rôle membre) tente DELETE /v1/jeux/5, réservé à l'admin. L'API répond…", opts: ["401 avec un corps vide", "204", "403 avec l'enveloppe d'erreur commune", "500"], a: 2, exp: "Identité connue, droit refusé → 403 ; et même les refus parlent le format d'erreur du contrat." },
      { type: "qcm", q: "Le front (https://app.ludotheque.example) est bloqué en appelant https://api.ludotheque.example ; Postman passe. Le correctif :", opts: ["Réécrire le fetch", "Désactiver le token", "Déclarer l'origine du front dans la config CORS de l'API", "Changer de navigateur"], a: 2, exp: "Hôtes différents = origines différentes ; c'est le serveur qui déclare ses invités (leçon 18)." },
      { type: "vf", q: "GET /v1/jeux peut être à la fois public, paginé (count/next/previous/results) et mis en cache avec ETag → 304.", a: true, exp: "Lecture publique, enveloppe de la leçon 10, revalidation de la leçon 19 : les trois cohabitent parfaitement." },
      { type: "input", q: "Le code de statut d'un POST /v1/locations réussi :", a: ["201"], ph: "Un code…", exp: "201 Created + Location: /v1/locations/41 — la promesse tenue depuis la leçon 5." }
    ],
    solution: `<pre class="pseudo">CONTRAT D'API — LUDOTHÈQUE v1 · https://api.ludotheque.example        # le contrat complet, sur cette URL de base
── AUTH ────────────────────────────────────────────────────────    # section : authentification
POST /v1/auth/login { email, mot_de_passe } → 200 { "token": JWT }   # se connecter → reçoit un token JWT
Ensuite : Authorization: Bearer &lt;token&gt; · HTTPS · rien dans l'URL     # ensuite : token en en-tête, en HTTPS, jamais dans l'URL
401 identité absente/invalide · 403 identité connue, droit refusé    # rappel : 401 = « qui es-tu ? » ; 403 = « interdit »
── JEUX ────────────────────────────────────────────────────────    # section : ressource jeux
GET    /v1/jeux       public · ?categorie&amp;disponible&amp;tri&amp;page&amp;page_size   # lister (public), avec filtres/tri/pagination
                      → 200 { count, next, previous, results }       # réponse : l'enveloppe paginée
                      Cache-Control: max-age=300 · ETag → 304        # cache : garder 5 min, revalider via ETag
GET    /v1/jeux/5     public → 200 | 404                             # détail d'un jeu (ou 404 s'il n'existe pas)
POST   /v1/jeux       admin → 201 + Location | 401/403/422           # créer (admin) : 201, sinon erreurs d'auth/validation
PATCH  /v1/jeux/5     admin → 200 | 404/422                          # modifier partiellement (admin)
DELETE /v1/jeux/5     admin → 204 | 404                              # supprimer (admin)
── AVIS (sous-ressource, 2 niveaux max) ────────────────────────    # section : avis, nichés sous les jeux
GET    /v1/jeux/5/avis   public → 200                                # lister les avis d'un jeu
POST   /v1/jeux/5/avis   membre → 201 | 401/404/422 (note 1..5)      # poster un avis (membre) ; note bornée à 1..5
── MEMBRES ─────────────────────────────────────────────────────    # section : membres
GET    /v1/membres/12    soi-même ou admin → 200 | 401/403/404       # voir un membre : soi-même ou admin
                         Cache-Control: no-store                     # données personnelles → ne PAS mettre en cache
── LOCATIONS ───────────────────────────────────────────────────    # section : locations (à la racine)
GET    /v1/locations     membre (les siennes) / admin (toutes)       # lister : un membre ne voit que SES locations
                         ?membre=12&amp;statut=en_cours ≡ /v1/membres/12/locations   # filtres ; chemin équivalent documenté
POST   /v1/locations     membre { "jeu": 5 } → 201 | 409 déjà loué   # créer un emprunt ; 409 si le jeu est déjà loué
                         Idempotency-Key acceptée                    # clé d'idempotence : rejouer sans créer de doublon
PATCH  /v1/locations/40  { "statut": "terminee" } → 200 | 404/409    # rendre le jeu = changer l'ÉTAT (pas un verbe d'URL)
── TRANSVERSAL ─────────────────────────────────────────────────    # section : règles valables partout
Erreurs  { "erreur": { "code", "message", "details": { champ: [msgs] } } }   # l'enveloppe d'erreur commune, partout
         jamais de stack trace · 500 → message générique + ref       # aucune fuite ; 500 = message neutre + référence
Débit    429 + Retry-After · quota serré sur /auth/login             # limitation de débit ; login très surveillé
CORS     origines du front déclarées côté serveur · preflight OPTIONS # le serveur autorise ses origines ; pré-vol en OPTIONS
Doc      /api/docs (Swagger UI) générée du code — la source de vérité # doc interactive, issue du code lui-même
Versions cassant → /v2 · Deprecation + Sunset → 410 Gone</pre>        # évolution : cassant → v2 ; retrait annoncé → 410
<p>🎉 Félicitations : tu as conçu, construit, sécurisé et documenté une API complète — et tu sais aussi la consommer. Ce contrat est exactement celui que tes <strong>capstones du Niveau 6</strong> exposent : retourne les construire avec ce document sous les yeux. Pour creuser HTTPS, le CSRF, le stockage des tokens et tout ce que ce cours a effleuré, le cours <strong>Sécurité applicative</strong> t'attend. Bonne route — et souviens-toi : une API publiée est une promesse.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "api-l21", title: "Le contrat, de mémoire", level: 3,
    statement: "L'épreuve finale d'écriture : sans regarder la solution de l'exercice final, rédige de mémoire le contrat d'API complet de la Ludothèque v1. Il doit couvrir : l'authentification (endpoint de login, transport du token, différence 401/403), les quatre ressources (jeux, avis, membres, locations) avec méthodes, droits et codes de succès comme d'échec, la pagination et les filtres du catalogue, l'enveloppe d'erreur commune, et les règles transversales (cache, débit, CORS, doc, versionnage). Compare ensuite avec la solution de l'exercice final et note ce que tu avais oublié.",
    hints: [
      "Structure par ressource, et pour chaque endpoint : méthode + chemin + qui a le droit + codes possibles (succès ET échecs).",
      "N'oublie pas les transversaux : que renvoie l'API quand ça se passe mal, trop souvent, ou depuis une autre origine ?",
      "Les avis sont une sous-ressource des jeux, les locations vivent à la racine avec filtres — sauras-tu redire pourquoi (leçon 11) ?"
    ],
    solution: "CONTRAT D'API — LUDOTHÈQUE v1 (de mémoire)\n\nAUTHENTIFICATION\n- POST /v1/auth/login { email, mot_de_passe } → 200 { token JWT } (5 essais/min max).\n- Toute requête protégée : Authorization: Bearer <token>, HTTPS, jamais de secret en URL.\n- 401 = preuve d'identité absente/invalide (→ se connecter) ; 403 = identité connue mais droit insuffisant (→ inutile de re-badger).\n\nJEUX (public en lecture, admin en écriture)\n- GET /v1/jeux : filtres ?categorie&disponible, tri ?tri=titre, pagination ?page&page_size → { count, next, previous, results } ; Cache-Control: max-age=300 + ETag/If-None-Match → 304.\n- GET /v1/jeux/5 → 200 | 404.\n- POST /v1/jeux (admin) → 201 + Location | 401/403/422.\n- PATCH /v1/jeux/5 (admin) → 200 | 404/422 · DELETE /v1/jeux/5 (admin) → 204 | 404.\n\nAVIS — sous-ressource (un avis n'existe pas sans son jeu, 2 niveaux max)\n- GET /v1/jeux/5/avis → 200.\n- POST /v1/jeux/5/avis (membre) : { note 1..5, commentaire } — pas de champ \"jeu\", il est dans l'URL → 201 | 401/404/422.\n\nMEMBRES\n- GET /v1/membres/12 (soi-même ou admin) → 200 | 401/403/404 ; Cache-Control: no-store.\n\nLOCATIONS — à la racine (elles relient jeu ET membre, filtrables dans tous les sens)\n- GET /v1/locations?membre=12&statut=en_cours (≡ /v1/membres/12/locations, raccourci documenté) ; un membre ne voit que les siennes.\n- POST /v1/locations (membre) { \"jeu\": 5 } → 201 | 409 si déjà loué ; Idempotency-Key acceptée (retry sans doublon).\n- PATCH /v1/locations/40 { \"statut\": \"terminee\" } → 200 | 404/409 (le « retour du jeu » est un changement d'état, pas un verbe d'URL).\n\nTRANSVERSAL\n- Erreurs : enveloppe unique { \"erreur\": { code, message, details } }, details champ par champ sur 422, jamais de stack trace, 500 = message générique + ref corrélée aux logs.\n- Débit : 429 + Retry-After, quotas par token/API key, serré sur le login.\n- CORS : origines du front déclarées côté serveur ; ne protège pas l'API elle-même.\n- Doc : OpenAPI générée du code, Swagger UI sur /api/docs — la source de vérité.\n- Versions : /v1 dès le premier jour ; cassant → /v2 ; dépréciation Deprecation + Sunset → 410 Gone.",
    note: "Si ton contrat de mémoire couvre 80 % de cette solution, tu es prêt : file vers les capstones du Niveau 6, où ce contrat devient du code (Django REST Framework, Spring, Laravel ou ASP.NET Core — au choix). Et garde le cours Sécurité applicative en ligne de mire : HTTPS/TLS, CSRF, stockage des tokens et brute force y sont traités en profondeur. Bravo pour ces 21 leçons." }
  ]
};
