<script>
var DAY = {
  num: 9,
  title: "Le CRUD complet d'une ressource",
  subtitle: "/jeux de bout en bout : cinq opérations, cinq paires requête-réponse.",
  theory: `
<h3>1. Lire : GET /jeux et GET /jeux/5</h3>
<p>On prend la ressource <code>/jeux</code> du contrat de la leçon 8 et on écrit, pour chaque opération, <strong>la requête ET la réponse</strong>. Le mot <strong>CRUD</strong> (du titre) est un acronyme anglais qui résume les quatre gestes de base sur une donnée : <em>Create</em> (créer), <em>Read</em> (lire), <em>Update</em> (modifier), <em>Delete</em> (supprimer) — soit, en HTTP, POST, GET, PUT/PATCH et DELETE. Commençons par la lecture : la collection, puis le détail.</p>
<pre class="pseudo">GET /jeux HTTP/1.1                                      # ligne de requête : méthode GET + chemin /jeux + version du protocole HTTP
Host: api.ludotheque.example                            # en-tête obligatoire : sur quel serveur on tape
                                                        # (ligne vide : fin des en-têtes ; un GET n'a pas de corps)
HTTP/1.1 200 OK                                         # ligne de réponse : 200 = succès
Content-Type: application/json                          # en-tête : le corps ci-dessous est du JSON
                                                        # (ligne vide : séparation en-têtes / corps)
[ { "id": 5, "titre": "Catan", "disponible": true },    # corps : un TABLEAU (crochets) d'objets jeu — 1er jeu
  { "id": 8, "titre": "Azul",  "disponible": false } ]  # 2e jeu ; le crochet fermant clôt le tableau</pre>
<pre class="pseudo">GET /jeux/5    → 200 OK + le JSON complet du jeu 5   # l'élément existe → 200 avec ses données
GET /jeux/999  → 404 Not Found (id inexistant)       # aucun jeu 999 → 404, pas un 200 vide</pre>
<p>Deux issues, deux codes : le client doit pouvoir distinguer « voilà le jeu » de « ce jeu n'existe pas » sans lire un message.</p>

<h3>2. Créer : POST /jeux → 201 + Location</h3>
<p>Le client envoie la représentation <em>sans id</em> (c'est le serveur qui l'attribue). La réponse dit trois choses : <strong>201 Created</strong>, <strong>où</strong> vit la nouvelle ressource (en-tête <code>Location</code>), et <strong>ce qui a été créé</strong> (le corps, avec l'id).</p>
<pre class="pseudo">POST /jeux HTTP/1.1                                         # requête POST sur la collection → « crée un jeu »
Content-Type: application/json                             # en-tête : le corps est du JSON
                                                           # (séparation en-têtes / corps)
{ "titre": "Dixit", "editeur": "Libellud", "annee": 2008,  # corps : la fiche à créer, SANS id (le serveur l'attribuera)
  "categorie": "ambiance", "prix_location": 2.50,          # …suite des champs…
  "prix_vente": 29.90, "disponible": true }                # …fin du corps de la requête
                                                           # (séparation requête / réponse)
HTTP/1.1 201 Created                                       # réponse : 201 = créé avec succès
Location: /jeux/29                                         # en-tête Location : l'adresse du nouveau jeu (id 29)
Content-Type: application/json                             # le corps de réponse est du JSON
                                                           # (séparation en-têtes / corps)
{ "id": 29, "titre": "Dixit", "editeur": "Libellud", "annee": 2008,  # corps : la ressource créée, AVEC son id attribué (29)
  "categorie": "ambiance", "prix_location": 2.50,          # …suite des champs…
  "prix_vente": 29.90, "disponible": true }                # …fin</pre>

<h3>3. Modifier : PUT remplace tout, PATCH retouche</h3>
<p><strong>PUT /jeux/5</strong> = remplacement <strong>total</strong> : le corps envoyé devient LA nouvelle représentation. Tout champ absent est considéré comme volontairement retiré — donc <strong>perdu</strong>. <strong>PATCH /jeux/5</strong> = modification <strong>partielle</strong> : on n'envoie que ce qui change.</p>
<pre class="pseudo">PUT /jeux/5                    # PUT = remplacement TOTAL : il faut renvoyer TOUTE la fiche
{ "titre": "Catan",            # on redonne le titre…
  "editeur": "Kosmos",         # …l'éditeur…
  "annee": 1995,               # …l'année…
  "categorie": "strategie",    # …la catégorie…
  "prix_location": 4.00,       # …le prix de location (mis à jour à 4,00)…
  "prix_vente": 39.90,         # …le prix de vente…
  "disponible": true }         # …et la disponibilité. TOUT l'état est fourni.
→ 200 OK, jeu remplacé EN ENTIER   # succès : la fiche entière a été remplacée par ce corps</pre>
<pre class="pseudo">PATCH /jeux/5              # PATCH = modification PARTIELLE : on n'envoie QUE ce qui change
{ "disponible": false }   # seul "disponible" est modifié
→ 200 OK                  # succès : seuls les champs envoyés changent, tout le reste est intact</pre>
<p>Envoyer <code>{ "prix_location": 4.00 }</code> en PUT effacerait titre, éditeur, année… C'est LA différence à retenir.</p>

<h3>4. Supprimer : DELETE → 204 sans corps</h3>
<pre class="pseudo">DELETE /jeux/5 HTTP/1.1                          # requête : supprimer l'élément /jeux/5
                                                 # (un DELETE n'a pas de corps ; ligne vide)
HTTP/1.1 204 No Content                          # réponse : 204 = fait, rien à renvoyer
(aucun corps : il n'y a plus rien à montrer)     # note : réponse sans aucun corps
                                                 # (ligne vide)
DELETE /jeux/5   (une seconde fois)              # on rejoue la même suppression…
HTTP/1.1 404 Not Found                           # …mais le jeu n'existe plus → 404</pre>
<p><strong>204 No Content</strong> dit « fait, et je n'ai rien à te renvoyer ». Le second DELETE échoue en 404 : la ressource n'existe plus.</p>

<h3>5. Quinze lignes suffisent : l'implémentation DRF</h3>
<p>Ce contrat est si standard que les frameworks le génèrent. En <strong>Django REST Framework</strong> (abrégé DRF, la boîte à outils qui bâtit des API sur le framework Python Django) :</p>
<pre class="pseudo"># serializers.py — décrit comment traduire un jeu en JSON (le « traducteur »)
class JeuSerializer(serializers.ModelSerializer):     # une classe traductrice, calquée sur le modèle Jeu
    class Meta:                                        # sous-classe de configuration (les réglages du serializer)
        model = Jeu                                    # sur quel modèle (table de la base) elle s'appuie : Jeu
        fields = "__all__"                             # inclure TOUS les champs du modèle dans le JSON

# views.py — les 5 opérations CRUD (créer/lire/modifier/supprimer) d'un coup
class JeuViewSet(viewsets.ModelViewSet):              # ModelViewSet = list + retrieve + create + update + destroy déjà fournis
    queryset = Jeu.objects.all()                      # les données exposées : tous les jeux
    serializer_class = JeuSerializer                  # quel traducteur JSON utiliser

# urls.py — génère les URLs /jeux et /jeux/&lt;id&gt; automatiquement
router = DefaultRouter()                              # un « routeur » qui fabrique les URLs tout seul
router.register("jeux", JeuViewSet)                   # associe le préfixe /jeux au ViewSet → toutes les routes CRUD</pre>
<p>Quinze lignes : <code>ModelSerializer</code> traduit le modèle en JSON, <code>ModelViewSet</code> fournit list/retrieve/create/update/destroy, le <code>router</code> câble les URLs et les bons codes (200, 201, 204, 404). Équivalents ailleurs : Spring avec <code>@RestController</code> + <code>@GetMapping</code>/<code>@PostMapping</code>, Laravel avec <code>Route::apiResource('jeux', JeuController::class)</code>, ASP.NET Core avec <code>[ApiController]</code> + <code>[HttpGet]</code>. Même contrat HTTP partout — c'est tout l'intérêt.</p>
<div class="warn">Le piège classique du débutant : envoyer un corps partiel en <strong>PUT</strong>. Résultat : les champs absents sont écrasés ou remis à null. Pour une retouche, c'est <strong>PATCH</strong> — toujours.</div>
<div class="tip">Le framework automatise, mais le contrat HTTP reste TA responsabilité : c'est parce que tu sais qu'un POST réussi vaut 201 + Location que tu repéreras un endpoint mal configuré. Teste chaque opération avec curl ou ton client REST (leçon 7).</div>`,
  exercises: [
    { type: "qcm", q: "GET /jeux réussi renvoie…", opts: ["201 + un objet", "200 + un tableau JSON", "204 sans corps", "302 + une redirection"], a: 1, exp: "Lecture réussie = 200, et une collection = un tableau." },
    { type: "qcm", q: "GET /jeux/999 quand le jeu 999 n'existe pas :", opts: ["200 avec un corps vide", "400", "404 Not Found", "500"], a: 2, exp: "Ressource introuvable = 404, pas un 200 déguisé." },
    { type: "qcm", q: "Un POST /jeux réussi renvoie…", opts: ["200 sans corps", "204", "201 + en-tête Location + la ressource créée", "301"], a: 2, exp: "Créé, où, et quoi : les trois informations du 201." },
    { type: "qcm", q: "Pourquoi le client n'envoie-t-il pas d'id dans le corps du POST ?", opts: ["Parce que c'est le serveur qui attribue l'id", "Parce que JSON interdit les id", "Pour gagner de la place", "Parce que l'id va dans l'URL du POST"], a: 0, exp: "L'id apparaît dans la réponse : « id »: 29." },
    { type: "qcm", q: "La différence PUT / PATCH :", opts: ["PUT crée, PATCH supprime", "PUT remplace la ressource en entier, PATCH modifie partiellement", "PATCH est plus rapide", "Aucune, ce sont des synonymes"], a: 1, exp: "En PUT, tout champ absent est perdu." },
    { type: "qcm", q: "PATCH /jeux/5 avec { « disponible »: false } réussi :", opts: ["200 OK, seuls les champs envoyés changent", "201 Created", "204 obligatoire", "405"], a: 0, exp: "Modification partielle appliquée, le reste du jeu est intact." },
    { type: "qcm", q: "Un DELETE /jeux/5 réussi renvoie typiquement…", opts: ["200 + le jeu supprimé", "404", "204 No Content, sans corps", "202 toujours"], a: 2, exp: "Rien à montrer : la ressource n'existe plus." },
    { type: "qcm", q: "Dans DRF, la classe qui fournit les cinq opérations CRUD d'un coup :", opts: ["ModelSerializer", "DefaultRouter", "APIView", "ModelViewSet"], a: 3, exp: "list, retrieve, create, update, destroy — tout est là." },
    { type: "qcm", q: "Le rôle de router.register(« jeux », JeuViewSet) :", opts: ["Créer la table en base", "Générer les URLs /jeux et /jeux/&lt;id&gt; et les relier au ViewSet", "Valider le JSON", "Lancer le serveur"], a: 1, exp: "Le router câble chemins, méthodes et actions." },
    { type: "qcm", q: "L'équivalent Laravel du CRUD complet en une ligne :", opts: ["Route::get('/jeux')", "Route::apiResource('jeux', JeuController::class)", "@RestController", "[ApiController]"], a: 1, exp: "@RestController c'est Spring, [ApiController] c'est ASP.NET Core." },
    { type: "vf", q: "Une réponse 204 contient un petit corps JSON de confirmation.", a: false, exp: "204 No Content = pas de corps, c'est sa définition." },
    { type: "vf", q: "Avec PUT, un champ absent du corps envoyé est considéré comme retiré.", a: true, exp: "Remplacement total : ce qui n'est pas envoyé disparaît." },
    { type: "input", q: "Le code de statut d'une création réussie :", a: ["201"], ph: "code", exp: "201 Created, accompagné de l'en-tête Location." },
    { type: "input", q: "L'en-tête de réponse qui donne l'URL de la ressource créée :", a: ["Location", "location", "Location:"], ph: "En-tête", exp: "Location: /jeux/29." },
    { type: "input", q: "La méthode pour une modification partielle :", a: ["PATCH", "patch", "Patch"], ph: "MÉTHODE", exp: "PATCH n'envoie que ce qui change." }
  ],
  final: {
    title: "Exercice final — Les cinq opérations sur le bout des doigts",
    intro: `<p>Le CRUD de /jeux est le modèle de toutes les autres ressources. Dernière vérification.</p>`,
    questions: [
      { type: "qcm", q: "Associe : lecture réussie / création / suppression sans corps :", opts: ["200 / 201 / 204", "201 / 200 / 404", "200 / 204 / 201", "204 / 201 / 200"], a: 0, exp: "Le trio à connaître par cœur." },
      { type: "input", q: "Le code d'une suppression réussie sans corps de réponse :", a: ["204"], ph: "code", exp: "204 No Content." },
      { type: "vf", q: "GET /jeux/5 sur un id inexistant renvoie 200 avec un corps vide.", a: false, exp: "C'est 404 : le code doit dire la vérité." },
      { type: "qcm", q: "Pour augmenter uniquement prix_location du jeu 5 :", opts: ["PUT /jeux/5 avec { « prix_location »: 4.00 }", "PATCH /jeux/5 avec { « prix_location »: 4.00 }", "POST /jeux/5", "DELETE puis POST"], a: 1, exp: "En PUT, ce corps partiel effacerait tous les autres champs." },
      { type: "qcm", q: "En Spring, la classe qui expose des endpoints REST est annotée…", opts: ["@Entity", "@Service", "@RestController", "@Autowired"], a: 2, exp: "Avec @GetMapping, @PostMapping… pour chaque endpoint." }
    ],
    solution: `<pre class="pseudo">GET    /jeux     → 200 + tableau JSON                              # lire la collection entière
GET    /jeux/5   → 200 + le jeu   |  404 si inexistant             # lire un élément (ou 404)
POST   /jeux     → 201 + Location: /jeux/29 + corps créé (avec id) # créer (le serveur donne l'id)
PUT    /jeux/5   → 200, remplacement TOTAL (champs absents perdus) # remplacer toute la fiche
PATCH  /jeux/5   → 200, modification partielle                     # ne changer que certains champs
DELETE /jeux/5   → 204 sans corps  |  404 au second essai          # supprimer (puis plus rien)
                                                                   # (ligne vide)
DRF : ModelSerializer + ModelViewSet + router = 15 lignes          # côté Django : tout le CRUD en ~15 lignes
Spring @RestController · Laravel Route::apiResource · ASP.NET [ApiController]</pre>  # mêmes idées dans les autres frameworks
<p>Le CRUD tourne, mais GET /jeux renvoie déjà 87 jeux d'un bloc… Prochaine leçon : filtrer, trier et paginer la collection avec les query params.</p>`
  }
};
</script>
