<script>
var DAY = {
  num: 6,
  title: "Penser ressources : des noms, pas des verbes",
  subtitle: "Le cœur de REST tient en une règle : l'URL nomme, la méthode agit.",
  theory: `
<h3>0. Rappel des mots de base (à garder sous la main)</h3>
<p>Avant de commencer, remettons à plat le vocabulaire, car tout le reste s'appuie dessus. Une <strong>API</strong> (de l'anglais <em>Application Programming Interface</em>, « interface de programmation ») est la <strong>porte d'entrée</strong> par laquelle deux programmes se parlent, un peu comme le guichet d'une banque : tu ne rentres pas toucher aux coffres toi-même, tu passes commande au guichet qui, lui, a le droit d'agir. Le programme qui <em>demande</em> s'appelle le <strong>client</strong> (ton navigateur, une application mobile) ; celui qui <em>répond</em> s'appelle le <strong>serveur</strong> (l'ordinateur distant qui détient les données). <strong>HTTP</strong> (<em>HyperText Transfer Protocol</em>) est la <strong>langue</strong> qu'ils utilisent sur le Web : un ensemble de règles fixant la forme des messages. Le client envoie une <strong>requête</strong> (une demande : « donne-moi la liste des jeux ») et le serveur renvoie une <strong>réponse</strong> (les données, ou un message d'erreur). <strong>REST</strong> est une <strong>façon d'organiser</strong> cette API pour qu'elle soit propre et prévisible — c'est le sujet du jour.</p>

<h3>1. La grande idée de REST</h3>
<p>REST (REpresentational State Transfer) repose sur un basculement mental : ton API n'expose pas des <em>actions</em>, elle expose des <strong>ressources</strong> — les « choses » de ton domaine : jeux, membres, locations, avis. Une <strong>ressource</strong>, c'est simplement un « objet » que ton application manipule, comme une fiche dans un classeur. Chaque ressource a une <strong>URL qui la nomme</strong>, et c'est la <strong>méthode HTTP qui porte le verbe</strong> (leçon 4). Une <strong>URL</strong> (<em>Uniform Resource Locator</em>) est l'<strong>adresse</strong> qui désigne une chose précise, comme l'adresse postale d'une maison. Une <strong>méthode HTTP</strong> est le petit mot en tête de requête (<code>GET</code>, <code>POST</code>…) qui dit <em>quelle intention</em> tu as. L'URL est un <strong>nom</strong> ; l'action est ailleurs.</p>
<pre class="pseudo">   URL = NOM (quoi ?)          MÉTHODE = VERBE (quoi faire ?)   # à gauche : l'adresse qui NOMME la chose ; à droite : le verbe HTTP qui dit l'ACTION
   /jeux/5                     GET, PUT, PATCH, DELETE          # /jeux/5 = UN jeu précis (le n° 5) ; on peut le lire (GET), remplacer (PUT), retoucher (PATCH), supprimer (DELETE)
   /jeux                       GET, POST                        # /jeux = la LISTE des jeux ; on peut la lire (GET) ou y ajouter (POST)</pre>
<p>Retiens les cinq verbes : <code>GET</code> = <em>lire</em> (« donne-moi »), <code>POST</code> = <em>créer</em> (« ajoute »), <code>PUT</code> = <em>remplacer entièrement</em>, <code>PATCH</code> = <em>modifier un morceau</em>, <code>DELETE</code> = <em>supprimer</em>. Ce sont les seuls dont tu as besoin 99 % du temps.</p>

<h3>2. Anti-exemples : les verbes dans l'URL</h3>
<p>Voici ce qu'on voit dans les API mal conçues — et comment REST l'écrit. Le symbole <code>✗</code> marque le mauvais exemple, <code>✓</code> le bon :</p>
<pre class="pseudo">✗ GET  /getJeux                    ✓ GET    /jeux              # inutile de mettre « get » dans l'URL : GET le dit déjà
✗ POST /creerJeu                   ✓ POST   /jeux              # « creer » est en trop : POST signifie déjà « créer »
✗ GET  /jeu.php?action=delete&amp;id=5 ✓ DELETE /jeux/5            # le verbe passe dans la méthode (DELETE), l'id dans le chemin, plus d'extension .php
✗ POST /modifierPrixDuJeu          ✓ PATCH  /jeux/5            # « modifier » devient PATCH ; l'URL ne fait que nommer le jeu 5</pre>
<p>Pourquoi c'est mieux ? Parce que c'est <strong>prévisible</strong>. Quand un développeur voit la ressource <code>/jeux</code>, il devine seul les cinq opérations possibles, leurs codes de retour, leur sémantique. Avec <code>/getJeux</code>, <code>/creerJeu</code>, <code>/jeuSupprimer</code>… chaque équipe invente son dialecte et tout doit se documenter au cas par cas. En prime, <code>/getJeux</code> est un mensonge en puissance : rien n'empêche d'y mettre un POST qui modifie.</p>

<h3>3. Collection et élément</h3>
<p>Chaque ressource existe sous deux formes : la <strong>collection</strong> (<code>/jeux</code> — l'ensemble, comme un tiroir entier de fiches) et l'<strong>élément</strong> (<code>/jeux/5</code> — un individu, une fiche précise, identifié par son <strong>id</strong> — son numéro unique — <strong>dans le chemin</strong>, pas en query string). La <strong>query string</strong> est la partie d'une URL après le <code>?</code> (par exemple <code>?categorie=strategie</code>) : elle sert à passer des options. C'est le motif universel :</p>
<pre class="pseudo">GET    /jeux        lire la collection      GET    /jeux/5     lire l'élément      # colonne gauche : opérations sur la LISTE ; colonne droite : sur UN jeu
POST   /jeux        créer dans la collection PUT    /jeux/5     remplacer          # POST ajoute à la liste ; PUT réécrit entièrement le jeu 5
                                             PATCH  /jeux/5     retoucher          # PATCH ne change que quelques champs du jeu 5
                                             DELETE /jeux/5     supprimer          # DELETE efface le jeu 5</pre>
<p>Note l'asymétrie : POST vit sur la collection, PUT/PATCH/DELETE sur l'élément. Et <code>/jeux?id=5</code> est un anti-motif : l'identité appartient au chemin ; la query string sert aux options (filtres, tri — leçon 10).</p>

<h3>4. Les conventions de nommage</h3>
<pre class="pseudo">pluriel        /jeux, /membres     (pas /jeu ni /leJeu)         # toujours au pluriel : /jeux = « la collection des jeux »
minuscules     /jeux               (pas /Jeux)                  # tout en minuscules, jamais de majuscule
kebab-case     /prix-locations     (tiret, pas prixLocations ni prix_locations)  # mots séparés par des tirets « - » (style « kebab-case »)
pas d'extension /jeux              (pas /jeux.php ni /jeux.json : le format,      # pas de .php/.json à la fin : l'URL nomme la CHOSE, pas son format
                                    c'est le rôle de Content-Type et Accept)      # le format se négocie par les en-têtes Content-Type / Accept (voir plus bas)
hiérarchie     /jeux/5/avis        les avis DU jeu 5 (leçon 11)  # imbrication : ce qui APPARTIENT au jeu 5 s'écrit après lui</pre>
<p>Le <strong>pluriel</strong> est la convention dominante : <code>/jeux</code> se lit « la collection des jeux » et <code>/jeux/5</code> « le jeu 5 de cette collection ». La <strong>hiérarchie</strong> exprime l'appartenance : <code>GET /jeux/5/avis</code> liste les avis du jeu 5, <code>POST /jeux/5/avis</code> en crée un. Un <strong>en-tête</strong> (ou <em>header</em>) est une ligne d'information ajoutée à la requête ou à la réponse ; <code>Content-Type</code> annonce le format du contenu envoyé (par exemple <code>application/json</code>) et <code>Accept</code> dit le format que le client souhaite recevoir. Deux niveaux de hiérarchie suffisent presque toujours ; nous creuserons ces relations à la leçon 11.</p>

<h3>5. Le cas limite : les actions métier</h3>
<p>Que faire de « rendre une location », qui n'est ni vraiment une création ni une suppression ? Le réflexe REST : chercher <strong>l'état</strong> que l'action modifie. L'<strong>état</strong> d'une ressource, c'est l'ensemble de ses valeurs à un instant donné (son statut, ses dates…). Rendre un jeu, c'est faire passer la location à l'état « terminée » :</p>
<pre class="pseudo">✓ PATCH /locations/40                                    # PATCH = retoucher partiellement ; /locations/40 = la location n° 40
  { "statut": "terminee", "date_retour": "2026-07-08" }  # corps JSON envoyé : on ne modifie QUE ces 2 champs (statut → « terminee », et on note la date de retour)</pre>
<p>Ce bloc entre accolades <code>{ }</code> est du <strong>JSON</strong> (<em>JavaScript Object Notation</em>) : un format texte universel pour représenter des données sous forme de paires « <code>"clé": valeur</code> ». C'est le <strong>corps</strong> (<em>body</em>) de la requête, c'est-à-dire les données que le client joint à sa demande. Presque toutes les « actions » se re-formulent ainsi en modification d'état. En <strong>dernier recours</strong>, quand aucune reformulation n'est naturelle (déclencher un envoi d'email, lancer un calcul), on tolère un POST sur une sous-ressource nommant l'action : <code>POST /locations/40/retour</code>. C'est l'exception, pas la règle — si ton API en est truffée, ta modélisation des ressources est à revoir.</p>
<p>Côté frameworks, cette pensée en ressources est si centrale que tout est bâti autour : les <em>routers</em> de Django REST Framework génèrent les URL collection/élément d'un coup, Laravel a <code>Route::apiResource</code>, Spring et ASP.NET Core structurent leurs contrôleurs par ressource.</p>
<div class="warn">Un verbe dans l'URL (<code>/creerJeu</code>, <code>/jeux/supprimer</code>) est le symptôme numéro un d'une API non REST. Avant d'ajouter une route, demande-toi toujours : <strong>quelle ressource, quel état ?</strong> — pas « quelle fonction j'appelle ? ».</div>
<div class="tip">Teste la qualité d'un chemin en le lisant à voix haute avec sa méthode : « GET /jeux/5/avis » → « donne-moi les avis du jeu 5 ». Si la phrase est naturelle et sans redondance, le chemin est bon ; si tu entends deux fois le verbe (« POST /creerJeu » = « crée crée-jeu »), il est mauvais.</div>`,
  exercises: [
    { type: "qcm", q: "En REST, l'URL désigne… et la méthode exprime…", opts: ["une action / une ressource", "une ressource / une action", "un serveur / un client", "un format / un code"], a: 1, exp: "L'URL nomme, la méthode agit." },
    { type: "qcm", q: "Le remplaçant REST de GET /getJeux :", opts: ["GET /jeux", "POST /getJeux", "GET /jeux/get", "GET /listeDesJeux"], a: 0, exp: "Le « get » est déjà dans la méthode." },
    { type: "qcm", q: "Le remplaçant REST de /jeu.php?action=delete&id=5 :", opts: ["GET /jeux/5/delete", "POST /supprimerJeu", "DELETE /jeux/5", "PATCH /jeux?delete=5"], a: 2, exp: "Le verbe passe dans la méthode, l'id dans le chemin, l'extension disparaît." },
    { type: "qcm", q: "La convention dominante pour nommer une collection :", opts: ["Singulier majuscule : /Jeu", "Pluriel minuscule : /jeux", "Verbe : /listerJeux", "CamelCase : /listeJeux"], a: 1, exp: "« La collection des jeux », en minuscules." },
    { type: "qcm", q: "Où placer l'identifiant du jeu 5 ?", opts: ["Dans le chemin : /jeux/5", "En query string : /jeux?id=5", "Dans un en-tête X-Id", "Dans le corps d'un GET"], a: 0, exp: "L'identité appartient au chemin ; la query string sert aux options." },
    { type: "qcm", q: "POST se pratique sur…", opts: ["L'élément /jeux/5", "La collection /jeux", "Les deux indifféremment", "Uniquement /jeux/0"], a: 1, exp: "On crée DANS la collection ; le serveur attribue l'id." },
    { type: "qcm", q: "GET /jeux/5/avis signifie…", opts: ["Les avis du jeu 5", "Le jeu 5 de l'avis", "Créer un avis", "Les jeux ayant 5 avis"], a: 0, exp: "La hiérarchie exprime l'appartenance (leçon 11)." },
    { type: "qcm", q: "Pourquoi éviter /jeux.json ?", opts: ["Le format est négocié par les en-têtes Accept/Content-Type, pas par l'URL", "JSON est interdit dans les API", "Le point est illisible", "C'est trop court"], a: 0, exp: "L'URL nomme la ressource, pas sa représentation." },
    { type: "qcm", q: "L'atout principal d'une API en ressources :", opts: ["Elle est plus rapide", "Elle est prévisible : on devine les opérations sans documentation exhaustive", "Elle évite les codes d'erreur", "Elle n'a pas besoin de serveur"], a: 1, exp: "/jeux suffit à deviner GET, POST, et /jeux/5 le reste." },
    { type: "qcm", q: "« Rendre la location 40 » se modélise d'abord par…", opts: ["GET /locations/40/rendre", "POST /rendreLocation", "DELETE /locations/40", "PATCH /locations/40 avec le nouveau statut"], a: 3, exp: "L'action devient un changement d'ÉTAT ; le POST /locations/40/retour reste le dernier recours." },
    { type: "qcm", q: "En Laravel, la génération des routes REST d'une ressource passe par…", opts: ["Route::apiResource", "Route::verbes", "api.rest()", "makeRoutes.php"], a: 0, exp: "Routers en Django REST Framework, contrôleurs par ressource chez Spring et ASP.NET Core." },
    { type: "vf", q: "DELETE /jeux/5 contient un verbe dans l'URL.", a: false, exp: "Le verbe est la MÉTHODE ; /jeux/5 est un pur nom." },
    { type: "vf", q: "Une API truffée de POST /ressource/action est le signe d'une modélisation à revoir.", a: true, exp: "Presque toute action se reformule en changement d'état d'une ressource." },
    { type: "input", q: "Quelle méthode HTTP remplace le verbe de l'URL /supprimerJeu ?", a: ["DELETE"], ph: "Une méthode…", exp: "DELETE /jeux/5 : le verbe passe dans la méthode." },
    { type: "input", q: "Singulier ou pluriel pour nommer les collections ?", a: ["pluriel"], ph: "Un mot…", exp: "/jeux, /membres, /locations, /avis." }
  ],
  final: {
    title: "Exercice final — Nettoyer une API héritée",
    intro: `<p>Tu reprends une vieille API de ludothèque pleine de verbes. Modernise-la. (Une API « héritée » — <em>legacy</em> — est une API ancienne dont on a hérité et qu'on doit continuer à faire vivre.)</p>`,
    questions: [
      { type: "qcm", q: "POST /creerMembre devient…", opts: ["POST /membres", "PUT /creerMembre", "POST /membres/creer", "GET /nouveauMembre"], a: 0, exp: "Créer dans la collection : POST /membres → 201." },
      { type: "qcm", q: "GET /listerAvisDuJeu?jeu=5 devient…", opts: ["GET /avisDuJeu/5", "GET /jeux/5/avis", "POST /avis/lister", "GET /lister/avis/5"], a: 1, exp: "La hiérarchie nomme l'appartenance : les avis du jeu 5." },
      { type: "qcm", q: "POST /membres/12/modifierEmail devient…", opts: ["PATCH /membres/12 avec { \"email\": … }", "POST /email/12", "PUT /modifierEmail/12", "GET /membres/12?email=nouveau"], a: 0, exp: "Une retouche d'état : PATCH sur l'élément." },
      { type: "vf", q: "GET /jeux/disponibles.json respecte les conventions REST.", a: false, exp: "Pas d'extension ; la disponibilité se filtrera en query string : /jeux?disponible=true (leçon 10)." },
      { type: "input", q: "« Donne-moi le membre 12 » : GET /membres/___ ?", a: ["12"], ph: "Un identifiant…", exp: "L'id vit dans le chemin : /membres/12." }
    ],
    solution: `<pre class="pseudo">URL = NOM (pluriel, minuscules, kebab-case, sans extension)   # l'adresse ne fait que NOMMER la ressource, jamais l'action
MÉTHODE = VERBE                                              # c'est le mot HTTP (GET/POST/PUT/PATCH/DELETE) qui porte l'intention

Collection /jeux        : GET (lire), POST (créer)           # sur la LISTE : lire tout, ou ajouter un élément
Élément    /jeux/5      : GET, PUT, PATCH, DELETE            # sur UN jeu : lire, remplacer, retoucher, supprimer
Hiérarchie /jeux/5/avis : les avis DU jeu 5                  # imbrication : ce qui appartient au jeu 5
Action métier → changement d'état : PATCH /locations/40 { "statut": "terminee" }   # « rendre » = passer le statut à « terminee » via PATCH + corps JSON
                (POST /locations/40/retour : dernier recours)                       # POST sur une sous-ressource-action : uniquement si aucune reformulation ne marche</pre>
<p>Tu penses ressources. Il ne reste qu'à mettre les mains dans le cambouis : demain, on interroge une vraie API avec curl.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "api-l6", title: "Des besoins métier aux ressources", level: 2,
    statement: "La gérante de la Ludothèque exprime cinq besoins : « voir tous les jeux de stratégie », « inscrire un nouveau membre », « voir l'historique des locations d'Aïcha (membre 12) », « publier un avis sur Catan (jeu 5) », « signaler que le jeu 7 est parti à la réparation (indisponible) ». Pour chaque besoin, propose la requête REST (méthode + chemin + corps éventuel), puis justifie en une phrase pourquoi ton URL ne contient aucun verbe.",
    atoi: {cmd: "python manage.py runserver\ncurl -i \"http://127.0.0.1:8000/api/jeux/?categorie=strategie\"\ncurl -i http://127.0.0.1:8000/api/membres/12/locations/", expected: "voir jeux de stratégie      -> GET /api/jeux/?categorie=strategie     -> HTTP 200 + liste JSON\ninscrire un membre          -> POST /api/membres/                     -> HTTP 201\nhistorique d'Aïcha (12)     -> GET /api/membres/12/locations/         -> HTTP 200\npublier un avis sur Catan   -> POST /api/jeux/5/avis/                  -> HTTP 201\njeu 7 en réparation         -> PATCH /api/jeux/7 {\"disponible\":false} -> HTTP 200\nAucune URL ne contient de verbe : le verbe, c'est la méthode HTTP."},

    hints: [
      "Identifie d'abord la ressource concernée : jeu, membre, location ou avis ? Collection ou élément ?",

    solution: "1. Voir les jeux de stratégie → GET /jeux?categorie=strategie\n   La ressource est la collection /jeux ; « stratégie » n'est qu'un filtre en query string.\n2. Inscrire un membre → POST /membres avec { \"nom\": \"...\", \"email\": \"...\" } → 201 + Location\n   « Inscrire » = créer dans la collection : le verbe, c'est POST.\n3. Historique d'Aïcha → GET /membres/12/locations\n   La hiérarchie nomme l'appartenance : les locations DU membre 12.\n4. Publier un avis sur Catan → POST /jeux/5/avis avec { \"note\": 4, \"commentaire\": \"...\" }\n   Créer dans la sous-collection des avis du jeu 5.\n5. Jeu 7 en réparation → PATCH /jeux/7 avec { \"disponible\": false }\n   L'« action » n'est qu'un changement d'état du jeu : une retouche → PATCH.\n\nAucune URL ne contient de verbe : chaque besoin s'est reformulé en « lire / créer / modifier UNE RESSOURCE », et c'est la méthode HTTP qui porte l'intention.",
    note: "Tu viens de faire, en miniature, le travail de conception de la semaine 2 : traduire des besoins métier en endpoints. C'est aussi le cœur du capstone Ludothèque, et la compétence que les routers de Django REST Framework ou Route::apiResource de Laravel supposent acquise — ils génèrent les routes, mais c'est toi qui choisis les ressources." }
  ]
};
