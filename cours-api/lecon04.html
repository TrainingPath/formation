<script>
var DAY = {
  num: 4,
  title: "Les méthodes : GET, POST, PUT, PATCH, DELETE",
  subtitle: "Cinq verbes suffisent pour tout dire à une API.",
  theory: `
<h3>1. Le verbe, c'est la méthode</h3>
<p>Reprenons deux mots de la leçon 1. Une <strong>ressource</strong> est une « chose » que le serveur expose et qu'on peut désigner : un jeu, un membre, une location… La <strong>méthode HTTP</strong> est le <em>verbe</em> de la demande : elle dit ce qu'on veut <em>faire</em> à cette ressource. En REST (le style d'architecture qu'on suit, détaillé en leçon 6), l'<strong>URL</strong> (l'adresse) nomme la ressource, et la méthode dit l'action. On distingue deux cibles : la <strong>collection</strong> <code>/jeux</code> (l'ensemble de tous les jeux) et l'<strong>élément</strong> <code>/jeux/5</code> (un jeu précis, le n°5). Cinq méthodes couvrent l'essentiel :</p>
<pre class="pseudo">GET    /jeux      → lire la liste des jeux            # GET = « donne-moi » ; sur la COLLECTION → toute la liste
GET    /jeux/5    → lire le jeu 5                      # GET sur un ÉLÉMENT (le n°5) → juste ce jeu-là
POST   /jeux      → créer un jeu dans la collection   # POST sur la collection → AJOUTE un nouvel élément
PUT    /jeux/5    → REMPLACER entièrement le jeu 5     # PUT = remplace TOUTE la ressource par ce qu'on envoie
PATCH  /jeux/5    → modifier PARTIELLEMENT le jeu 5    # PATCH = ne change QUE les champs fournis
DELETE /jeux/5    → supprimer le jeu 5                 # DELETE = efface l'élément visé</pre>

<h3>2. GET et POST : lire et créer</h3>
<p><strong>GET</strong> lit, et ne modifie <strong>jamais</strong> rien : c'est une méthode <strong>sûre</strong> (« safe » : sans effet de bord). On peut la répéter, la mettre en <strong>cache</strong> (garder une copie de la réponse pour la resservir plus vite), la pré-charger sans risque. Autre particularité : <strong>GET n'a pas de corps</strong> — le <strong>corps</strong> (body) d'une requête est le paquet de données qu'elle transporte ; avec GET, il n'y en a pas : tout passe par l'URL et sa query string.</p>
<p><strong>POST</strong> s'envoie sur la <strong>collection</strong> pour y créer un élément. Le serveur choisit lui-même l'<strong>identifiant</strong> (le numéro unique du nouvel élément) et répond <code>201 Created</code> (« créé ») avec l'en-tête <code>Location</code> (leçon 2) qui donne l'adresse de la nouveauté :</p>
<pre class="pseudo">POST /jeux                                            # méthode POST + collection cible /jeux → « crée un jeu »
Content-Type: application/json                        # en-tête : le corps ci-dessous est du JSON
                                                      # (ligne de séparation entre les en-têtes et le corps)
{ "titre": "Dixit", "editeur": "Libellud", "annee": 2008,          # corps = le jeu à créer (aucun id : le serveur le choisira)
  "categorie": "ambiance", "prix_location": 2.50, "prix_vente": 32.00 }   # suite et fin du corps JSON
                                                      # (séparation entre la requête et la réponse)
→ HTTP/1.1 201 Created                                # réponse du serveur : 201 = « créé avec succès »
  Location: /jeux/8                                   # en-tête Location : l'adresse du jeu fraîchement créé (le n°8)</pre>

<h3>3. PUT contre PATCH : remplacer ou retoucher</h3>
<p><strong>PUT</strong> remplace la ressource <strong>en entier</strong> : le corps envoyé devient le nouvel état complet. Tout champ omis (absent du corps) est perdu, ou refusé par la <strong>validation</strong> (le contrôle des données par le serveur). <strong>PATCH</strong>, lui, ne modifie <strong>que les champs présents</strong> dans le corps. Comparons — même ressource, deux façons de la mettre à jour :</p>
<pre class="pseudo">PUT /jeux/5                    # PUT = remplace TOUTE la ressource : il faut renvoyer TOUS les champs
{ "titre": "Catan",            # on redonne le titre…
  "editeur": "Kosmos",         # …l'éditeur…
  "annee": 1995,               # …l'année…
  "categorie": "strategie",    # …la catégorie…
  "prix_location": 3.50,       # …le prix de location…
  "prix_vente": 39.90,         # …le prix de vente…
  "disponible": false }        # …et enfin la disponibilité mise à false. TOUT l'état est fourni.</pre>
<pre class="pseudo">PATCH /jeux/5                  # PATCH = simple RETOUCHE : on n'envoie QUE le champ à changer
{ "disponible": false }        # seul "disponible" est modifié ; titre, prix, éditeur… restent inchangés</pre>
<p>Pour marquer Catan indisponible, PATCH est évidemment le bon outil. Un PUT avec le seul champ <code>disponible</code> serait une faute : il prétendrait que le nouvel état complet du jeu se résume à ce champ.</p>

<h3>4. DELETE, et les deux propriétés à connaître</h3>
<p><strong>DELETE /jeux/5</strong> supprime le jeu 5 ; la réponse typique est <code>204 No Content</code> (« pas de contenu à renvoyer », leçon 5). Deux propriétés servent à classer les méthodes. Une méthode est <strong>sûre</strong> si elle ne modifie rien côté serveur. Elle est <strong>idempotente</strong> (mot savant, mais idée simple) si la <em>répéter</em> produit exactement le même état final qu'une seule exécution — précieux quand le réseau flanche et qu'un client réessaie sa requête sans savoir si la première est passée :</p>
<pre class="pseudo">Méthode | Sûre | Idempotente | Effet                                # en-tête du tableau : les 2 propriétés + l'effet de chaque méthode
--------+------+-------------+---------------------------------     # ligne de séparation visuelle
GET     | oui  | oui         | lire (répéter : aucun effet)         # sûre : ne change rien, rejouable sans danger
PUT     | non  | oui         | 2 PUT identiques → même état final   # modifie, mais rejouer donne le MÊME résultat
DELETE  | non  | oui         | supprimer 2 fois → toujours supprimé # idempotent : l'état final ne bouge plus
PATCH   | non  | pas garanti | dépend du contenu du patch           # peut être idempotent… ou non, selon ce qu'on envoie
POST    | non  | NON         | 2 POST → DEUX jeux créés !           # NON idempotent : rejouer = doublon (le piège)</pre>
<p>Retiens surtout la ligne POST : rejouer un POST crée un doublon. Nous verrons à la leçon 19 comment les clients et les serveurs se protègent de ce piège.</p>

<h3>5. Le danger du GET qui modifie</h3>
<p>Rien n'empêche <em>techniquement</em> d'écrire un serveur où <code>GET /jeux/5/supprimer</code> détruit le jeu. C'est une bombe : les navigateurs <strong>pré-chargent</strong> des liens (ils les visitent d'avance pour aller plus vite), les <strong>robots d'indexation</strong> (les programmes des moteurs de recherche qui parcourent le web automatiquement) suivent toutes les URL, les <strong>proxys</strong> (serveurs intermédiaires) mettent les GET en cache… Un robot qui « visite » ton site effacerait le catalogue entier. <strong>La sémantique des méthodes est un contrat</strong> que tout l'écosystème du web suppose respecté.</p>
<p>Côté frameworks, ce contrat structure ton code : en Django REST Framework, chaque méthode d'une classe APIView (<code>get</code>, <code>post</code>, <code>put</code>, <code>patch</code>, <code>delete</code>) répond à la méthode HTTP du même nom ; Spring utilise les annotations <code>@GetMapping</code>/<code>@PostMapping</code>, Laravel <code>Route::get</code>/<code>Route::post</code>, ASP.NET Core <code>[HttpGet]</code>/<code>[HttpPost]</code>. Même idée partout.</p>
<div class="warn">Ne « bricole » jamais la sémantique : un GET qui modifie sera déclenché par des robots et des caches ; un POST rejoué par un client impatient crée des doublons. Choisis la méthode pour son <strong>sens</strong>, pas pour sa facilité.</div>
<div class="tip">Hésitation PUT/PATCH ? Pose la question : « est-ce que j'envoie l'état COMPLET de la ressource ? » Oui → PUT. Non, juste une retouche → PATCH. En pratique, les API modernes exposent surtout PATCH pour les mises à jour.</div>`,
  exercises: [
    { type: "qcm", q: "Pour créer un jeu, on envoie…", opts: ["POST /jeux/5", "PUT /jeux", "POST /jeux", "GET /jeux?creer=true"], a: 2, exp: "POST sur la collection ; le serveur choisit l'id." },
    { type: "qcm", q: "PUT /jeux/5 avec pour corps { \"disponible\": false } uniquement…", opts: ["Modifie juste la disponibilité", "Prétend que l'état complet du jeu se résume à ce champ", "Crée un nouveau jeu", "Est équivalent à un GET"], a: 1, exp: "PUT remplace TOUT ; pour une retouche, c'est PATCH." },
    { type: "qcm", q: "La méthode qui modifie partiellement une ressource :", opts: ["PUT", "POST", "GET", "PATCH"], a: 3, exp: "Seuls les champs présents dans le corps changent." },
    { type: "qcm", q: "Une méthode « sûre » est une méthode qui…", opts: ["Ne modifie rien côté serveur", "Est chiffrée", "Répond toujours 200", "N'a pas d'en-têtes"], a: 0, exp: "GET est la méthode sûre par excellence." },
    { type: "qcm", q: "Une méthode « idempotente » :", opts: ["Ne peut être appelée qu'une fois", "Répétée, produit le même état final qu'une seule exécution", "Est toujours rapide", "N'existe qu'en HTTPS"], a: 1, exp: "Précieux quand un client réessaie après une panne réseau." },
    { type: "qcm", q: "Envoyer deux fois le même POST /jeux…", opts: ["Crée deux jeux identiques", "Crée un seul jeu", "Renvoie une erreur automatique", "Supprime le premier"], a: 0, exp: "POST n'est pas idempotent : doublon garanti." },
    { type: "qcm", q: "DELETE /jeux/5 exécuté deux fois : l'état final du serveur est…", opts: ["Différent à chaque fois", "Le même : le jeu 5 n'existe plus", "Deux jeux supprimés", "Imprévisible"], a: 1, exp: "DELETE est idempotent (le 2e appel répondra sans doute 404, mais l'état est identique)." },
    { type: "qcm", q: "La particularité de GET côté message :", opts: ["Il exige un corps JSON", "Il n'a pas de corps : tout passe par l'URL", "Il n'a pas d'en-têtes", "Il n'a pas de réponse"], a: 1, exp: "Filtres et options vont dans la query string (leçon 10)." },
    { type: "qcm", q: "Pourquoi un GET /jeux/5/supprimer qui supprime est-il dangereux ?", opts: ["Il est trop lent", "Robots et pré-chargeurs suivent les GET : suppression involontaire", "GET est réservé aux images", "Il coûte plus cher"], a: 1, exp: "Tout l'écosystème suppose GET sûre." },
    { type: "qcm", q: "En Django REST Framework, la requête PATCH /jeux/5 est traitée par…", opts: ["La méthode patch de la vue", "Le fichier patch.py", "La base de données directement", "Le navigateur"], a: 0, exp: "Une méthode de classe par méthode HTTP ; @PatchMapping chez Spring." },
    { type: "vf", q: "PUT et DELETE sont idempotentes.", a: true, exp: "Les rejouer ne change pas l'état final ; POST, si." },
    { type: "vf", q: "PATCH est garanti idempotent dans tous les cas.", a: false, exp: "Pas garanti : cela dépend du contenu du patch." },
    { type: "vf", q: "GET /jeux et GET /jeux/5 visent la même chose.", a: false, exp: "La collection entière vs l'élément 5 : deux ressources distinctes." },
    { type: "input", q: "Quelle méthode utiliser pour marquer seulement \"disponible\": false sur le jeu 5 ?", a: ["PATCH"], ph: "Une méthode…", exp: "Modification partielle → PATCH /jeux/5." },
    { type: "input", q: "Quelle est la seule méthode du tableau qui n'est NI sûre NI idempotente ?", a: ["POST"], ph: "Une méthode…", exp: "D'où le danger des POST rejoués (leçon 19)." }
  ],
  final: {
    title: "Exercice final — Le bon verbe pour la Ludothèque",
    intro: `<p>Pour chaque besoin métier de la Ludothèque, choisis la requête correcte.</p>`,
    questions: [
      { type: "qcm", q: "Afficher la fiche du jeu Catan (id 5) :", opts: ["POST /jeux/5", "GET /jeux/5", "PATCH /jeux/5", "PUT /jeux"], a: 1, exp: "Lecture pure : GET sur l'élément." },
      { type: "qcm", q: "Le prix de location de Catan passe de 3.50 à 4.00, rien d'autre ne change :", opts: ["PUT /jeux/5 avec le seul prix", "PATCH /jeux/5 avec { \"prix_location\": 4.00 }", "POST /jeux", "DELETE /jeux/5"], a: 1, exp: "Retouche d'un champ → PATCH." },
      { type: "qcm", q: "Le magasin retire définitivement 7 Wonders (id 7) du catalogue :", opts: ["DELETE /jeux/7", "GET /jeux/7/supprimer", "PATCH /jeux", "POST /jeux/7"], a: 0, exp: "Suppression → DELETE sur l'élément ; jamais via GET." },
      { type: "vf", q: "Rejouer le POST d'inscription d'Aïcha après une coupure réseau risque de créer deux membres.", a: true, exp: "POST n'est pas idempotent : le doublon est le risque classique (parades leçon 19)." },
      { type: "input", q: "Le client renvoie la fiche COMPLÈTE et corrigée du jeu 5. Quelle méthode ?", a: ["PUT"], ph: "Une méthode…", exp: "État complet fourni → PUT remplace la ressource." }
    ],
    solution: `<pre class="pseudo">GET    /jeux, /jeux/5   lire            sûre + idempotente, sans corps      # lecture ; rejouable sans risque, aucun corps
POST   /jeux            créer           ni sûre ni idempotente → 201 + Location   # création ; rejouer = doublon
PUT    /jeux/5          remplacer TOUT  idempotente                          # on envoie l'état COMPLET
PATCH  /jeux/5          retoucher       idempotence non garantie             # ne change que les champs fournis
DELETE /jeux/5          supprimer       idempotente → souvent 204            # efface ; 204 = « fait, rien à renvoyer »
                                                                             # ↓ la leçon à retenir ↓
Règle d'or : le SENS de la méthode est un contrat que                       # ce sens n'est pas décoratif…
navigateurs, caches et robots supposent respecté.</pre>                      # …tout l'écosystème du web compte dessus
<p>Les verbes sont en place. Reste à savoir comment le serveur raconte le résultat : les codes de statut, demain.</p>`
  }
};
</script>

    ],
    solution: "1. GET /jeux/ajouter?titre=Azul — GET doit être sûre ; ici elle crée. Un robot d'indexation ou un pré-chargeur de navigateur qui suit l'URL crée des jeux fantômes ; un cache peut « avaler » la création.\n   Correct : POST /jeux avec corps { \"titre\": \"Azul\", ... } → 201 + Location.\n\n2. GET /jeux/5/supprimer — même faute, en pire : un robot qui parcourt les liens efface le catalogue.\n   Correct : DELETE /jeux/5 → 204.\n\n3. POST /jeux/5/modifierPrix — le verbe « modifier » est dans l'URL alors que HTTP a déjà un verbe pour ça ; et POST n'est pas idempotent : un client qui réessaie pourrait appliquer deux fois un changement.\n   Correct : PATCH /jeux/5 avec { \"prix_location\": 4.00 }.\n\n4. PUT /jeux/5 avec { \"disponible\": true } — PUT promet un remplacement COMPLET : un serveur strict effacerait titre, prix et éditeur, ou rejetterait la requête en validation.\n   Correct : PATCH /jeux/5 avec { \"disponible\": true } (ou un PUT avec la fiche entière).",
