<script>
var DAY = {
  num: 18,
  title: "CORS : le navigateur et les origines",
  subtitle: "Ton API marche dans Postman mais pas dans le navigateur ? Bienvenue au grand classique.",
  theory: `
<h3>1. Le grand classique</h3>
<p>Avant de commencer, posons les mots. Une <strong>API</strong> (<em>Application Programming Interface</em>, « interface de programmation ») est un serveur qui expose des données et des actions à d'autres programmes : ici, l'API de la Ludothèque sait lister les jeux, réserver des emplacements, etc. Le <strong>front</strong> (ou <em>front-end</em>) est la partie visible dans le navigateur — les pages, les boutons — écrite en JavaScript. Le <strong>navigateur</strong> est le logiciel (Chrome, Firefox…) qui affiche ces pages. Le front est le <strong>client</strong> (celui qui demande), l'API est le <strong>serveur</strong> (celui qui répond). Une <strong>requête</strong> est un message « je veux ceci » envoyé par le client ; la <strong>réponse</strong> est ce que le serveur renvoie. <code>fetch</code> est la fonction JavaScript qui, depuis le navigateur, envoie une requête à une API.</p>
<p>Tu développes le front de la Ludothèque sur <code>http://localhost:5173</code>. L'API Django tourne sur <code>http://localhost:8000</code>. (<code>localhost</code>, c'est « ta propre machine » ; le nombre après les deux-points, comme <code>5173</code>, est le <strong>port</strong> : un numéro de « porte » qui distingue deux programmes tournant sur la même machine.) Le <code>fetch</code> part… et la <strong>console</strong> — la fenêtre du navigateur où s'affichent les messages techniques et les erreurs — s'énerve :</p>
<pre class="pseudo">Access to fetch at 'http://localhost:8000/jeux'
from origin 'http://localhost:5173' has been blocked by CORS policy:
No 'Access-Control-Allow-Origin' header is present on the requested resource.</pre>
<p>Traduction de ce message : « l'accès au <code>fetch</code> vers <code>localhost:8000/jeux</code>, depuis l'origine <code>localhost:5173</code>, a été bloqué par la règle CORS : aucun en-tête <code>Access-Control-Allow-Origin</code> n'est présent sur la ressource demandée ». Pourtant, la même URL — l'<strong>URL</strong> étant l'adresse complète d'une ressource sur le web — répond parfaitement dans <code>curl</code> (un petit outil en ligne de commande qui envoie des requêtes) et dans Postman (une application pour tester des API). Le coupable n'est ni ton API ni ton code : c'est le <strong>navigateur</strong>, qui applique une règle de sécurité.</p>

<h3>2. Origine et Same-Origin Policy</h3>
<p>Une <strong>origine</strong> = <strong>schéma + hôte + port</strong>. Décomposons : le <strong>schéma</strong> est le protocole en tête d'URL (<code>http</code> ou <code>https</code>, la version chiffrée) ; l'<strong>hôte</strong> est le nom de domaine ou l'adresse (<code>localhost</code>, <code>api.ludo.example</code>…) ; le <strong>port</strong> est le numéro de porte. Il suffit qu'un seul des trois diffère pour que deux URL soient d'origines différentes :</p>
<pre class="pseudo">http://localhost:5173   et   http://localhost:8000   → ports différents
https://ludotheque.example  et  http://ludotheque.example → schémas différents
https://app.ludo.example    et  https://api.ludo.example  → hôtes différents</pre>
<p>La <strong>Same-Origin Policy</strong> (« politique de même origine », abrégée SOP) est une règle de base des navigateurs : elle interdit par défaut à une page web de <em>lire</em> les réponses d'une autre origine. Elle protège <strong>l'utilisateur</strong> : sans elle, n'importe quel site malveillant ouvert dans un onglet pourrait lire, avec tes <strong>cookies</strong> (les petits fichiers où le navigateur garde ta session de connexion), tes données bancaires hébergées ailleurs. En clair, elle empêche un site espion de piller les autres sites où tu es connecté.</p>

<h3>3. CORS : le serveur déclare ses invités</h3>
<p><strong>CORS</strong> (Cross-Origin Resource Sharing, « partage de ressources entre origines ») est le mécanisme par lequel <strong>le serveur déclare</strong> quelles origines étrangères ont le droit de lire ses réponses. C'est une exception volontaire à la Same-Origin Policy : le serveur dit « pour ces origines-là précisément, j'autorise la lecture ». Un <strong>en-tête</strong> (en anglais <em>header</em>) est une ligne de métadonnée accompagnant une requête ou une réponse HTTP — le <strong>HTTP</strong> étant le langage (le protocole) que client et serveur utilisent pour dialoguer sur le web. Le serveur répond donc avec l'en-tête <code>Access-Control-Allow-Origin</code> ; le navigateur compare et décide :</p>
<pre class="pseudo">GET /jeux HTTP/1.1                                   # requête : méthode GET (= lire) sur la ressource /jeux, protocole HTTP/1.1
Origin: http://localhost:5173          ← ajouté par le navigateur   # en-tête Origin = « d'où vient ma page »

HTTP/1.1 200 OK                                      # réponse du serveur : code de statut 200 = succès (« OK »)
Access-Control-Allow-Origin: http://localhost:5173   ← « cette origine peut lire »   # en-tête d'autorisation CORS
→ le navigateur remet la réponse au JavaScript. Sans cet en-tête : blocage.</pre>
<p>Détaillons. <code>GET</code> est une <strong>méthode HTTP</strong> : le verbe qui dit ce qu'on veut faire (<code>GET</code> = lire, <code>POST</code> = créer, <code>PUT</code>/<code>PATCH</code> = modifier, <code>DELETE</code> = supprimer). <code>/jeux</code> est l'<strong>endpoint</strong> (le chemin de la <strong>ressource</strong> visée — ici la collection des jeux). Le <strong>code de statut</strong> (<code>200</code>, <code>204</code>, <code>404</code>…) est le chiffre par lequel le serveur résume le résultat : <code>2xx</code> = réussite. L'en-tête <code>Origin</code> est ajouté automatiquement par le navigateur, tu n'as rien à écrire ; l'en-tête <code>Access-Control-Allow-Origin</code> est la réponse du serveur : s'il contient bien l'origine de ta page, le navigateur livre la réponse au JavaScript ; sinon, il la jette et affiche l'erreur CORS.</p>

<h3>4. La requête préliminaire (preflight)</h3>
<p>Certaines requêtes sont dites « simples » (un <code>GET</code> ordinaire) : le navigateur les envoie directement. D'autres sont « non simples » (un <code>PATCH</code>, ou toute requête portant un en-tête <code>Authorization</code> — celui qui transporte le <strong>token</strong>, le jeton de connexion qui prouve qui tu es). Pour celles-là, le navigateur demande d'abord la permission avec une requête <strong>OPTIONS</strong> : c'est le <strong>preflight</strong> (« vol de reconnaissance »). Il ne transporte aucune donnée, il pose seulement la question « ai-je le droit d'envoyer la vraie requête ? » :</p>
<pre class="pseudo">OPTIONS /locations HTTP/1.1                           # preflight : le navigateur demande la permission AVANT le vrai envoi
Origin: http://localhost:5173                         # d'où vient la page appelante
Access-Control-Request-Method: POST                   # « je voudrais envoyer un POST, est-ce autorisé ? »
Access-Control-Request-Headers: authorization, content-type   # « avec ces en-têtes-là (dont le token) »

HTTP/1.1 204 No Content                               # réponse : 204 = OK, sans corps à renvoyer
Access-Control-Allow-Origin: http://localhost:5173    # origine autorisée à lire
Access-Control-Allow-Methods: GET, POST, PATCH, DELETE # méthodes autorisées depuis cette origine
Access-Control-Allow-Headers: authorization, content-type # en-têtes autorisés dans la vraie requête
Access-Control-Max-Age: 86400     ← réponse mémorisée 24 h   # 86400 s = 24 h : évite de refaire ce OPTIONS à chaque appel

→ feu vert : le navigateur envoie ENSUITE le vrai POST /locations.</pre>
<p><code>Content-Type</code> est l'en-tête qui annonce le format du corps envoyé (souvent <code>application/json</code> : du <strong>JSON</strong>, le format texte universel pour échanger des données structurées). <code>Max-Age</code> active un petit <strong>cache</strong> (une mémoire temporaire) : pendant 24 h, le navigateur réutilise la réponse du preflight au lieu de renvoyer un <code>OPTIONS</code> avant chaque requête. Une fois le « feu vert » reçu, la vraie requête <code>POST</code> part.</p>

<h3>5. Ce que CORS n'est PAS (et la config)</h3>
<p>Point capital : CORS ne protège <strong>pas ton serveur</strong>. <code>curl</code>, Postman, un script Python ignorent totalement CORS — seuls les navigateurs l'appliquent, pour protéger leurs utilisateurs. Ce qui protège ton API, ce sont l'authentification et les permissions des leçons 15 à 17 (vérifier <em>qui</em> appelle et <em>ce qu'il a le droit</em> de faire). Autre règle : jamais <code>Access-Control-Allow-Origin: *</code> — l'étoile <code>*</code> signifiant « n'importe quelle origine » — sur une API qui accepte des <strong>credentials</strong> (des preuves d'identité : cookies, en-tête <code>Authorization</code>) ; le navigateur le refuse d'ailleurs. Déclare des origines <strong>précises</strong> :</p>
<pre class="pseudo"># Django — django-cors-headers, settings.py    # bibliothèque qui gère CORS pour Django
CORS_ALLOWED_ORIGINS = [                          # liste blanche des origines autorisées à lire l'API
    "http://localhost:5173",                     # le front en développement
    "https://app.ludotheque.example",            # le front en production
]                                                # fin de la liste

# Spring : @CrossOrigin / config CorsRegistry    # équivalent côté Java/Spring
# Laravel : config/cors.php · ASP.NET Core : app.UseCors(…)   # équivalents PHP et .NET</pre>
<p>Une <strong>liste blanche</strong> (<em>whitelist</em>) est une liste des seuls éléments autorisés : tout ce qui n'y figure pas est refusé. Le tableau complet des protections côté navigateur (SOP, CSP, cookies SameSite…) t'attend dans le cours <em>Sécurité applicative</em>.</p>
<div class="warn">Une erreur CORS n'est presque jamais un bug du front : c'est le <strong>serveur</strong> qui n'a pas déclaré l'origine du front. On la corrige dans la config de l'API, pas en bidouillant le fetch.</div>
<div class="tip">En développement, ajoute l'origine de ton serveur de dev (http://localhost:5173) à CORS_ALLOWED_ORIGINS dès le premier jour : tu t'épargnes le rituel du « ça marche dans Postman mais pas dans le navigateur ».</div>`,
  exercises: [
    { type: "qcm", q: "Le front (localhost:5173) reçoit une erreur CORS en appelant l'API (localhost:8000). Qui bloque ?", opts: ["Le serveur Django", "Le navigateur", "Le routeur", "Postman"], a: 1, exp: "Seul le navigateur applique CORS ; l'API a bien répondu." },
    { type: "qcm", q: "Une origine est définie par…", opts: ["Schéma + hôte + port", "Le nom de domaine seul", "L'adresse IP", "Le chemin de l'URL"], a: 0, exp: "Un seul des trois diffère → origines différentes." },
    { type: "qcm", q: "http://localhost:5173 et http://localhost:8000 sont…", opts: ["La même origine", "Deux origines différentes (ports différents)", "Deux schémas différents", "Invalides"], a: 1, exp: "Même schéma, même hôte, mais 5173 ≠ 8000." },
    { type: "qcm", q: "La Same-Origin Policy protège avant tout…", opts: ["Le serveur d'API", "La base de données", "L'utilisateur du navigateur", "Le DNS"], a: 2, exp: "Elle empêche un site malveillant de lire tes données hébergées ailleurs." },
    { type: "qcm", q: "CORS est le mécanisme par lequel…", opts: ["Le client force le passage", "Le navigateur chiffre les requêtes", "L'API bloque les robots", "Le serveur déclare quelles origines peuvent lire ses réponses"], a: 3, exp: "Via l'en-tête Access-Control-Allow-Origin." },
    { type: "qcm", q: "Quel en-tête de réponse autorise une origine étrangère à lire ?", opts: ["Access-Control-Allow-Origin", "Origin", "Allow", "X-CORS"], a: 0, exp: "Le navigateur le compare à l'origine de la page." },
    { type: "qcm", q: "Le preflight est une requête…", opts: ["GET", "HEAD", "OPTIONS", "TRACE"], a: 2, exp: "OPTIONS + Access-Control-Request-Method : « puis-je envoyer ce POST ? »." },
    { type: "qcm", q: "Access-Control-Max-Age: 86400 signifie…", opts: ["Le token expire dans 24 h", "La réponse preflight est mémorisée 24 h", "L'API a 86400 routes", "Le cache du GET dure 24 h"], a: 1, exp: "Le navigateur s'épargne un OPTIONS par requête pendant ce délai." },
    { type: "qcm", q: "Un script Python (requests) appelle ton API sans en-têtes CORS. Résultat ?", opts: ["Bloqué par CORS", "Erreur 403 automatique", "Ça fonctionne : CORS ne concerne que les navigateurs", "Erreur DNS"], a: 2, exp: "curl, Postman, scripts : aucun ne vérifie CORS." },
    { type: "qcm", q: "Ce qui protège réellement ton API contre les accès indésirables :", opts: ["CORS", "L'authentification et les permissions (leçons 15-17)", "Le favicon", "Access-Control-Max-Age"], a: 1, exp: "CORS protège l'utilisateur du navigateur, pas ton serveur." },
    { type: "vf", q: "Access-Control-Allow-Origin: * est acceptable sur une API qui accepte des credentials (cookies, Authorization).", a: false, exp: "Interdit — et refusé par les navigateurs : déclare des origines précises." },
    { type: "vf", q: "Une erreur CORS se corrige dans la configuration du serveur, pas dans le code du front.", a: true, exp: "C'est le serveur qui doit déclarer l'origine du front (CORS_ALLOWED_ORIGINS…)." },
    { type: "vf", q: "https://app.ludo.example et https://api.ludo.example sont la même origine car le domaine racine est identique.", a: false, exp: "L'hôte complet compte : app ≠ api, donc origines différentes." },
    { type: "input", q: "Quelle méthode HTTP le navigateur utilise-t-il pour le preflight ?", a: ["OPTIONS", "options"], ph: "Une méthode…", exp: "OPTIONS, avec Access-Control-Request-Method et -Headers." },
    { type: "input", q: "Quel en-tête de requête, ajouté par le navigateur, indique l'origine de la page appelante ?", a: ["Origin", "origin"], ph: "Nom de l'en-tête…", exp: "Origin: http://localhost:5173 — le serveur s'en sert pour répondre." }
  ],
  final: {
    title: "Exercice final — Diagnostic en console",
    intro: `<p>Le front de la Ludothèque (http://localhost:5173) échoue à joindre l'API (http://localhost:8000). <strong>Diagnostiquer</strong>, c'est trouver la cause d'un problème à partir des indices : ici, les indices sont les messages de la <strong>console</strong> du navigateur (la fenêtre où s'affichent les erreurs). Lis-les comme un pro et raisonne sur le vrai coupable.</p>`,
    questions: [
      { type: "qcm", q: "La console affiche « blocked by CORS policy ». La même requête réussit dans Postman. Conclusion :", opts: ["L'API est en panne", "Le serveur n'a pas déclaré l'origine du front", "Le JSON est invalide", "Le token a expiré"], a: 1, exp: "L'API répond (Postman le prouve) : il manque Access-Control-Allow-Origin." },
      { type: "qcm", q: "Le correctif côté Django REST Framework :", opts: ["Changer le fetch en XMLHttpRequest", "Passer le front sur le port 8000", "Ajouter http://localhost:5173 à CORS_ALLOWED_ORIGINS", "Désactiver HTTPS"], a: 2, exp: "django-cors-headers, la déclaration explicite de l'origine." },
      { type: "vf", q: "Avant le POST /locations avec Authorization, le navigateur enverra d'abord un OPTIONS.", a: true, exp: "Requête non simple → preflight obligatoire." },
      { type: "qcm", q: "Après le correctif CORS, l'API doit-elle encore vérifier le token et les permissions ?", opts: ["Non, CORS suffit", "Non, le navigateur s'en charge", "Oui, mais seulement en production", "Oui : CORS n'est pas une sécurité du serveur"], a: 3, exp: "Auth et permissions restent la vraie défense (leçons 15-17)." },
      { type: "input", q: "Quel en-tête de réponse manquait pour que le navigateur accepte de livrer la réponse ?", a: ["Access-Control-Allow-Origin", "access-control-allow-origin"], ph: "Nom de l'en-tête…", exp: "Il doit porter l'origine exacte du front." }
    ],
    solution: `<pre class="pseudo">Origine = schéma + hôte + port                        # les 3 morceaux qui définissent une origine
Same-Origin Policy : le navigateur protège L'UTILISATEUR   # règle par défaut du navigateur
CORS : le SERVEUR déclare ses invités                 # exception volontaire à la SOP
  → Access-Control-Allow-Origin: http://localhost:5173   # en-tête de réponse qui autorise l'origine
Preflight : OPTIONS + Access-Control-Request-Method   # demande de permission avant une requête non simple
  → Allow-Methods / Allow-Headers / Max-Age           # réponse : méthodes/en-têtes permis + durée de cache
CORS ne protège PAS le serveur (curl s'en moque)      # curl/Postman/scripts ignorent CORS
  → la défense : auth + permissions (leçons 15-17)    # la vraie sécurité côté serveur
Jamais * avec credentials — origines précises :       # * interdit avec cookies/Authorization
  CORS_ALLOWED_ORIGINS (Django) · @CrossOrigin (Spring)   # où déclarer les origines selon le framework
  config/cors.php (Laravel) · app.UseCors (ASP.NET)   # équivalents PHP et .NET</pre>
<p>Le navigateur est apprivoisé. Demain, les trois finitions d'une API professionnelle : idempotence, cache et limites de débit.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "api-l18", title: "Le ticket CORS", level: 3,
    statement: "Un développeur front de la Ludothèque ouvre un ticket : « L'API est cassée. GET /jeux marche dans le navigateur, mais POST /locations avec le token échoue avec une erreur CORS mentionnant un OPTIONS. Dans Postman, tout fonctionne. J'ai essayé d'ajouter Access-Control-Allow-Origin: * dans les en-têtes de mon fetch, sans effet. » Rédige ta réponse au ticket : explique pourquoi GET passe mais pas POST, pourquoi Postman fonctionne, pourquoi sa tentative de correctif ne peut pas marcher (deux raisons), puis donne le vrai correctif côté serveur et rappelle ce que CORS protège réellement.",
    atoi: {cmd: "python manage.py runserver\n# simuler le preflight envoyé par le navigateur avant le POST :\ncurl -i -X OPTIONS http://127.0.0.1:8000/api/locations/ \\\n  -H \"Origin: https://app.ludotheque.example\" \\\n  -H \"Access-Control-Request-Method: POST\" \\\n  -H \"Access-Control-Request-Headers: authorization\"", expected: "Sans config CORS serveur -> réponse SANS en-tête Access-Control-Allow-* :\n  le navigateur bloque le POST (le GET simple, lui, passait sans preflight).\nAvec django-cors-headers configuré -> HTTP 200/204 + :\n  Access-Control-Allow-Origin: https://app.ludotheque.example\n  Access-Control-Allow-Methods: POST\n  Access-Control-Allow-Headers: authorization\nPostman n'applique pas la politique CORS (ce n'est pas un navigateur)."},
    checklist: ["Expliques-tu que le POST déclenche un preflight OPTIONS, pas le GET simple ?", "Précises-tu que Postman ignore CORS (donc « ça marche dans Postman » ne prouve rien) ?", "Rappelles-tu que Allow-Origin doit venir du SERVEUR, pas d'un en-tête du fetch client ?", "Le vrai correctif est-il côté serveur (django-cors-headers / en-têtes de réponse) ?"],
    hints: [
      "POST /locations porte un en-tête Authorization : que déclenche le navigateur avant une requête « non simple » ?",
      "Access-Control-Allow-Origin est un en-tête de RÉPONSE : qui doit l'envoyer ? Et pourquoi * est-il de toute façon exclu ici ?",
      "Postman n'est pas un navigateur : qu'est-ce que cela prouve sur l'état réel de l'API ?"
    ],
    solution: "RÉPONSE AU TICKET — rien n'est cassé côté API, tout s'explique.\n\n1) Pourquoi GET passe et pas POST ?\n   GET /jeux sans en-tête particulier est une requête « simple ».\n   POST /locations avec Authorization ne l'est pas : le navigateur\n   envoie d'abord un preflight OPTIONS (Access-Control-Request-Method:\n   POST, Access-Control-Request-Headers: authorization). Si le serveur\n   ne répond pas avec Allow-Methods / Allow-Headers corrects, le\n   navigateur bloque avant même d'envoyer le vrai POST. C'est le\n   OPTIONS que tu vois dans l'erreur.\n\n2) Pourquoi Postman fonctionne ?\n   CORS n'est appliqué que par les navigateurs, pour protéger leurs\n   utilisateurs. Postman, curl ou un script l'ignorent. Que Postman\n   réussisse prouve justement que l'API fonctionne : le problème est\n   une déclaration CORS manquante, pas une panne.\n\n3) Pourquoi ton correctif ne peut pas marcher ?\n   a. Access-Control-Allow-Origin est un en-tête de RÉPONSE, envoyé\n      par le serveur. L'ajouter à la requête du fetch n'a aucun sens :\n      c'est le serveur qui déclare ses invités, pas le client.\n   b. Même côté serveur, * serait refusé ici : notre API reçoit des\n      credentials (Authorization). Il faut des origines précises.\n\n4) Le vrai correctif (côté API Django) :\n   CORS_ALLOWED_ORIGINS = [\"http://localhost:5173\"] via\n   django-cors-headers (équivalents : @CrossOrigin en Spring,\n   config/cors.php en Laravel, app.UseCors en ASP.NET). Le preflight\n   recevra alors Allow-Origin, Allow-Methods et Allow-Headers, et le\n   POST partira normalement.\n\n5) Rappel : CORS protège l'utilisateur du navigateur, pas notre\n   serveur. Ce qui protège l'API, ce sont le JWT et les permissions —\n   qui restent évidemment vérifiés à chaque requête.",
    note: "Ce ticket, tu le recevras (ou l'écriras) dans chaque capstone full-stack : le duo front localhost:5173 / API localhost:8000 est le quotidien des projets Django, Spring, Laravel et ASP.NET. Le cours Sécurité applicative complète le tableau des protections navigateur (Same-Origin Policy, CSP, cookies SameSite) et t'expliquera ce que risquerait un utilisateur sans elles." }
