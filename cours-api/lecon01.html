<script>
var DAY = {
  num: 1,
  title: "Client, serveur, HTTP : la conversation du web",
  subtitle: "Tout le web tient en une phrase : un client demande, un serveur répond.",
  theory: `
<h3>1. Le modèle client/serveur</h3>
<p>Sur le web, deux rôles seulement. Le <strong>client</strong> pose une question ; le <strong>serveur</strong> y répond. Le client peut être un <strong>navigateur</strong>, une <strong>application mobile</strong>, un <strong>autre serveur</strong>, ou un simple outil en ligne de commande comme <code>curl</code> (leçon 7). Le serveur, lui, c'est ton back-end : le programme Spring, Laravel, ASP.NET Core ou Django que tu écris dans les autres cours.</p>
<p>Prends une image du quotidien : le <strong>restaurant</strong>. Toi, à table, tu es le <strong>client</strong> : tu passes commande. La cuisine est le <strong>serveur</strong> : elle prépare et t'apporte le plat. Un mot de vocabulaire au passage : un <strong>client</strong>, en informatique, c'est <em>n'importe quel programme qui envoie une demande</em> (pas forcément un humain) ; un <strong>serveur</strong>, c'est le programme, tournant en permanence sur une machine allumée jour et nuit, qui <em>attend</em> ces demandes et y répond. Le mot <strong>back-end</strong> (« l'arrière ») désigne cette partie cachée, côté serveur, par opposition au <strong>front-end</strong> (« la façade »), la partie visible que l'utilisateur manipule.</p>
<pre class="pseudo">navigateur ──┐
appli mobile ──┼──► SERVEUR (ton back-end) ──► réponse
autre serveur ─┤
curl ──────────┘</pre>
<p>Retiens l'asymétrie : c'est <strong>toujours le client qui commence</strong>. Le serveur ne fait qu'attendre des requêtes et y répondre. À table, jamais la cuisine ne t'apporte un plat que tu n'as pas commandé ; de même, le serveur ne parle jamais en premier.</p>

<h3>2. Une conversation : requête → réponse</h3>
<p>Le protocole de cette conversation s'appelle <strong>HTTP</strong> (HyperText Transfer Protocol). Un <strong>protocole</strong>, c'est simplement un <em>ensemble de règles communes</em> que les deux parties acceptent de suivre pour se comprendre — exactement comme les règles de politesse d'une conversation (on se salue, on pose une question, l'autre répond). Sans langage commun, impossible de se comprendre : HTTP est ce langage commun du web. Chaque échange suit le même rituel : le client envoie une <strong>requête</strong> (le message de demande : « donne-moi le jeu numéro 5 »), le serveur renvoie une <strong>réponse</strong> (le message de retour : « le voici, tout s'est bien passé »). Une requête, une réponse, point final. Jamais de réponse sans requête.</p>
<pre class="pseudo">CLIENT                          SERVEUR
  │  requête : GET /jeux/5        │
  │ ──────────────────────────►  │
  │                               │ (cherche en base)
  │  réponse : 200 + le jeu       │
  │ ◄──────────────────────────  │</pre>
<p>Dans ce schéma, <code>GET</code> est une <strong>méthode HTTP</strong> : le <em>verbe</em> de la demande, ici « va chercher / donne-moi » (les autres verbes — créer, modifier, supprimer — viennent en leçon 4). <code>/jeux/5</code> est le <strong>chemin</strong> qui désigne quoi on veut : le jeu numéro 5. Et <code>200</code> est un <strong>code de statut</strong> : un petit nombre par lequel le serveur résume comment ça s'est passé (200 = « tout va bien » ; on les détaille en leçon 5). Nous disséquerons le contenu exact de ces deux messages dès la leçon 2.</p>

<h3>3. Anatomie d'une URL</h3>
<p>Pour poser sa question, le client doit savoir <em>où</em> et <em>quoi</em>. C'est le rôle de l'<strong>URL</strong> (Uniform Resource Locator, « localisateur uniforme de ressource ») : c'est l'<em>adresse</em> complète de ce que l'on veut, comme une adresse postale indique le pays, la ville, la rue et le numéro. Une <strong>ressource</strong>, en langage d'API, c'est une « chose » que le serveur expose et que l'on peut désigner : un jeu, un membre, une location… ici, le jeu n°5.</p>
<pre class="pseudo">https://api.ludotheque.example:443/jeux/5?details=true
──┬── ─────────┬───────────── ─┬─ ──┬─── ─────┬──────
schéma       hôte            port chemin  query string</pre>
<p>Le <strong>schéma</strong> (<code>http</code> ou <code>https</code>) fixe le protocole utilisé. L'<strong>hôte</strong> (ici <code>api.ludotheque.example</code>) désigne le serveur, c'est-à-dire <em>quelle machine</em> on contacte, un peu comme le nom d'un immeuble. Le <strong>port</strong> est la « porte » numérotée sur cette machine : 80 par défaut pour HTTP, 443 pour HTTPS — on l'omet presque toujours car ces valeurs sont sous-entendues. Le <strong>chemin</strong> (<code>/jeux/5</code>) désigne la ressource visée à l'intérieur du serveur. La <strong>query string</strong> (« chaîne de requête »), après le <code>?</code>, transporte des <em>options</em> sous forme <code>clé=valeur</code> (filtres, tri, détails… leçon 10) — ici <code>details=true</code> demande la version détaillée.</p>

<h3>4. HTTP est sans état (stateless)</h3>
<p>Point fondamental : <strong>le serveur ne garde aucun souvenir entre deux requêtes</strong>. Chaque requête arrive comme si c'était la première, et doit donc contenir <em>tout</em> ce qu'il faut pour être comprise : qui tu es, ce que tu veux, dans quel format. C'est ce qu'on appelle <strong>stateless</strong> (« sans état », <em>state</em> = état/mémoire). Image simple : c'est comme parler à un employé frappé d'amnésie totale à chaque phrase — tu dois te re-présenter et tout ré-expliquer à chacune de tes demandes, car il a déjà tout oublié de la précédente.</p>
<p>Conséquence énorme pour les API : pas de « conversation en cours » côté serveur. Si un client doit prouver son identité, il la prouvera <strong>à chaque requête</strong> (avec un <strong>token</strong> — un jeton, sorte de bracelet d'entrée numérique qui prouve qui tu es, leçons 15 et 16). En échange, le serveur peut traiter des millions de clients sans mémoriser quoi que ce soit, et n'importe quelle machine d'une ferme de serveurs (un groupe de machines identiques qui se partagent le travail) peut répondre à n'importe quelle requête.</p>

<h3>5. Pourquoi une API ? La Ludothèque, fil conducteur</h3>
<p>Une <strong>API</strong> (Application Programming Interface, « interface de programmation d'application ») web, c'est un serveur qui répond non pas avec des pages HTML pour un humain, mais avec des <strong>données brutes pour un programme</strong> — en JSON (<strong>JSON</strong> = un format texte universel pour représenter des données, vu en détail leçon 3). Le mot <strong>interface</strong> désigne un <em>point de contact</em> entre deux mondes : comme la prise électrique qui te laisse brancher n'importe quel appareil sans connaître le câblage du mur, l'API te laisse utiliser le serveur sans connaître son code interne. C'est un <strong>contrat</strong> : « si tu m'envoies telle requête, je te renvoie telle réponse ». Ton back-end expose ce contrat ; le front-end, l'appli mobile et les partenaires le consomment, sans jamais voir ton code ni ta base de données.</p>
<p>Notre fil conducteur : <strong>la Ludothèque</strong>, une application de location et de vente de jeux de société (c'est aussi ton capstone full-stack). Son API vivra sur <code>https://api.ludotheque.example</code> et exposera des jeux, des membres, des locations et des avis. Exemple de conversation, en avant-première :</p>
<pre class="pseudo">GET https://api.ludotheque.example/jeux/5                                    # REQUÊTE : méthode GET (« donne-moi ») + URL de la ressource « jeu n°5 »
→ { "id": 5, "titre": "Catan", "prix_location": 3.50, "disponible": true }   # RÉPONSE (en JSON) : id=5, titre "Catan", prix 3,50, disponible = vrai</pre>
<p>Dans la réponse ci-dessus, les accolades <code>{ }</code> délimitent un objet JSON (un ensemble de données), et chaque paire <code>"clé": valeur</code> décrit une propriété du jeu. À la fin du cours, tu sauras concevoir, tester et sécuriser cette API — quel que soit le framework qui l'implémente.</p>
<div class="warn"><strong>HTTP transporte tout en clair</strong> : n'importe qui sur le réseau peut lire les requêtes. <strong>HTTPS</strong> = HTTP chiffré via TLS (une couche qui rend le message illisible pour les curieux) ; en production, c'est HTTPS ou rien. Le fonctionnement du chiffrement est approfondi dans le cours Sécurité applicative.</div>
<div class="tip">Le caractère <strong>stateless</strong> de HTTP n'est pas un détail : il explique les tokens (leçon 16), le cache (le fait de garder une copie d'une réponse déjà obtenue pour aller plus vite, leçon 19) et la montée en charge. Chaque fois que tu hésites sur un concept d'API, reviens à cette question : « que sait le serveur au moment où la requête arrive ? » Réponse : uniquement ce qu'elle contient.</div>`,
  exercises: [
    { type: "qcm", q: "Dans le modèle client/serveur, qui initie toujours l'échange ?", opts: ["Le serveur", "Le client", "Les deux à tour de rôle", "Le proxy"], a: 1, exp: "Le serveur attend ; le client demande." },
    { type: "qcm", q: "Lequel de ces acteurs peut être un client HTTP ?", opts: ["Seulement un navigateur", "Seulement une appli mobile", "Navigateur, appli mobile, autre serveur, curl…", "Seulement un humain"], a: 2, exp: "Tout programme capable d'envoyer une requête est un client." },
    { type: "qcm", q: "HTTP signifie…", opts: ["HyperText Transfer Protocol", "High Tech Transfer Program", "HyperText Transport Protocol", "HyperText Tag Parser"], a: 0, exp: "Le protocole de transfert du web." },
    { type: "qcm", q: "Dans https://api.ludotheque.example/jeux/5, le chemin est…", opts: ["https", "api.ludotheque.example", "/jeux/5", "5"], a: 2, exp: "Ce qui suit l'hôte désigne la ressource." },
    { type: "qcm", q: "La query string d'une URL commence après…", opts: ["le caractère ?", "le caractère #", "le caractère /", "le caractère :"], a: 0, exp: "Exemple : /jeux?categorie=strategie." },
    { type: "qcm", q: "Le port par défaut de HTTPS est…", opts: ["80", "8080", "3000", "443"], a: 3, exp: "80 pour HTTP, 443 pour HTTPS ; on les omet en général." },
    { type: "qcm", q: "« HTTP est stateless » signifie que…", opts: ["Le serveur mémorise chaque client", "Le serveur ne garde aucun souvenir entre deux requêtes", "Les requêtes n'ont pas d'URL", "Le client garde l'état du serveur"], a: 1, exp: "Chaque requête doit être autosuffisante." },
    { type: "qcm", q: "Conséquence directe du sans-état pour une API :", opts: ["Le client prouve son identité à chaque requête", "Le serveur se souvient de la connexion", "Une seule machine peut répondre", "Les réponses sont en HTML"], a: 0, exp: "D'où les tokens des leçons 15-16." },
    { type: "qcm", q: "Une API web renvoie en général…", opts: ["Des pages HTML mises en forme", "Des données brutes (JSON) pour un programme", "Des images", "Du code source du serveur"], a: 1, exp: "Le client se charge de l'affichage." },
    { type: "qcm", q: "Une API est avant tout…", opts: ["Une base de données", "Un langage de programmation", "Un contrat entre le serveur et ses clients", "Un framework"], a: 2, exp: "Telle requête → telle réponse, promis." },
    { type: "vf", q: "Le serveur peut envoyer une réponse à un client qui n'a rien demandé.", a: false, exp: "En HTTP classique, jamais de réponse sans requête." },
    { type: "vf", q: "HTTPS est un protocole totalement différent de HTTP.", a: false, exp: "C'est HTTP chiffré via TLS : mêmes requêtes, mêmes réponses, transport protégé." },
    { type: "vf", q: "L'API de la Ludothèque pourra servir à la fois un site web et une appli mobile.", a: true, exp: "Un seul contrat, plusieurs clients : tout l'intérêt d'une API." },
    { type: "input", q: "Quel est le port par défaut de HTTP (non chiffré) ?", a: ["80"], ph: "Un nombre…", exp: "80 pour HTTP, 443 pour HTTPS." },
    { type: "input", q: "Quel mot anglais désigne la propriété de HTTP « sans état » ?", a: ["stateless"], ph: "Un mot anglais…", exp: "Stateless : le serveur oublie tout entre deux requêtes." }
  ],
  final: {
    title: "Exercice final — La conversation est posée",
    intro: `<p>Vérifions que le vocabulaire de base est en place avant d'ouvrir le capot des requêtes.</p>`,
    questions: [
      { type: "qcm", q: "Le rituel de base de HTTP :", opts: ["Requête du client → réponse du serveur", "Réponse → requête", "Connexion permanente bavarde", "Diffusion sans destinataire"], a: 0, exp: "Une question, une réponse." },
      { type: "qcm", q: "Dans https://api.ludotheque.example/jeux?categorie=strategie, la partie ?categorie=strategie est…", opts: ["Le schéma", "L'hôte", "La query string", "Le port"], a: 2, exp: "Les options après le ?." },
      { type: "vf", q: "Grâce au sans-état, n'importe quel serveur d'une ferme peut répondre à n'importe quelle requête.", a: true, exp: "Aucune mémoire de session à partager : la montée en charge est simple." },
      { type: "qcm", q: "Le back-end de la Ludothèque pourrait être écrit…", opts: ["Uniquement en Python", "Uniquement en Java", "En Spring, Laravel, ASP.NET Core ou Django : le contrat HTTP est le même", "Uniquement en PHP"], a: 2, exp: "L'API est transversale : HTTP ne dépend pas du framework." },
      { type: "input", q: "Quel schéma d'URL indique que la conversation est chiffrée ?", a: ["https"], ph: "Un schéma…", exp: "HTTPS = HTTP + TLS, approfondi en Sécurité applicative." }
    ],
    solution: `<pre class="pseudo">Client (navigateur, mobile, serveur, curl) ──requête──► Serveur (ton back-end)   # le client demande, le serveur reçoit
                                            ◄─réponse──                          # le serveur renvoie sa réponse au client

URL     : schéma :// hôte : port / chemin ? query string                        # anatomie : où (schéma/hôte/port) + quoi (chemin) + options (query)
Stateless : le serveur oublie tout entre deux requêtes                          # aucune mémoire d'une requête à l'autre
            → chaque requête est autosuffisante (identité comprise)              # elle doit tout contenir, y compris qui l'envoie
API     : un CONTRAT — telle requête, telle réponse, en JSON                     # promesse stable entre le serveur et ses clients
Fil conducteur : la Ludothèque, https://api.ludotheque.example</pre>              # notre exemple pour tout le cours
<p>Le décor est planté. Prochaine leçon : on ouvre une requête et une réponse ligne par ligne.</p>`
  }
};
</script>
