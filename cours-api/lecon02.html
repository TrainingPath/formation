<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 2,
  title: "Anatomie d'une requête et d'une réponse",
  subtitle: "Sous le capot, HTTP est du texte. Apprenons à le lire ligne par ligne.",
  theory: `
<h3>1. La requête : trois blocs</h3>
<p>Rappel : une <strong>requête</strong> est le message que le <strong>client</strong> (celui qui demande) envoie au <strong>serveur</strong> (celui qui répond). Bonne nouvelle pour débuter : une requête HTTP n'a rien de magique, c'est juste du <strong>texte</strong>, lisible par un humain. Ce texte est un message en trois parties : la <strong>ligne de requête</strong> (la première ligne, qui résume la demande), des <strong>en-têtes</strong> (des informations complémentaires), puis — après une <strong>ligne vide</strong> obligatoire — un <strong>corps</strong> optionnel (les données transportées). Compare-le à une lettre postale : la ligne de requête est l'objet du courrier, les en-têtes sont les mentions sur l'enveloppe (expéditeur, format…), et le corps est la feuille glissée dedans.</p>
<pre class="pseudo">GET /jeux/5 HTTP/1.1           # ligne de requête : méthode GET + chemin /jeux/5 + version du protocole HTTP/1.1
Host: api.ludotheque.example   # en-tête : quel serveur je vise (obligatoire en HTTP/1.1)
Accept: application/json       # en-tête : je souhaite recevoir la réponse au format JSON
                               # ligne vide : elle marque la fin des en-têtes
                               # corps vide ici : un GET ne transporte pas de données</pre>
<p>La ligne de requête contient trois informations : la <strong>méthode</strong> (<code>GET</code> — le verbe de la demande, « donne-moi », leçon 4), le <strong>chemin</strong> (<code>/jeux/5</code> — la ressource visée, ici le jeu n°5), et la <strong>version</strong> du protocole (<code>HTTP/1.1</code> — quelle édition des règles on parle).</p>

<h3>2. Les en-têtes qui comptent</h3>
<p>Les <strong>en-têtes</strong> (en anglais <em>headers</em>) sont des paires <code>Nom: valeur</code> qui donnent le <em>contexte</em> de l'échange — comme des étiquettes collées sur un colis (« fragile », « format A4 », « expéditeur »). Ils ne sont pas les données elles-mêmes ; ils <em>décrivent</em> l'envoi. Cinq à connaître par cœur côté requête :</p>
<pre class="pseudo">Host: api.ludotheque.example   # quel site je vise (obligatoire : une machine peut héberger plusieurs sites)
Accept: application/json       # le format que je VEUX recevoir en réponse
Content-Type: application/json # le format de ce que J'ENVOIE dans le corps
Authorization: Bearer eyJhb…   # qui je suis : un token (jeton) prouve mon identité (leçons 15-16)
User-Agent: mobile-app/2.1     # quel logiciel envoie la requête (navigateur, appli, curl…)</pre>
<p>Grave la distinction : <strong><code>Content-Type</code> décrit ce qu'on ENVOIE</strong> (le corps de la requête), <strong><code>Accept</code> décrit ce qu'on VEUT recevoir</strong> (le corps de la réponse). Moyen mnémotechnique : <em>Content-Type</em> parle du <em>contenu</em> déjà présent dans mon message ; <em>Accept</em> dit ce que j'<em>accepte</em> comme retour. Les confondre est l'erreur de débutant numéro un.</p>

<h3>3. Une requête avec corps : créer un jeu</h3>
<p>Quand le client envoie des données (création, modification), elles voyagent dans le <strong>corps</strong> (le contenu principal du message), après la ligne vide, et l'en-tête <code>Content-Type</code> annonce leur format :</p>
<pre class="pseudo">POST /jeux HTTP/1.1                                          # méthode POST (créer) + collection /jeux + version
Host: api.ludotheque.example                                # le serveur visé
Content-Type: application/json                              # j'envoie du JSON dans le corps
Accept: application/json                                    # je veux du JSON en retour

{ "titre": "Azul", "editeur": "Next Move", "annee": 2017,   # corps JSON : les données du jeu à créer (début de l'objet)
  "categorie": "abstrait", "prix_location": 3.00, "prix_vente": 44.90 }   # suite et fin du même objet JSON</pre>
<p>La ligne vide au milieu n'est pas là par hasard : c'est elle qui sépare les en-têtes du corps. Sans <code>Content-Type</code>, le serveur ne saurait pas comment interpréter ces octets (un <strong>octet</strong> = la plus petite unité de données brutes) : du JSON ? un formulaire ? du XML (un autre format texte, plus verbeux) ?</p>

<h3>4. La réponse : le miroir de la requête</h3>
<p>La <strong>réponse</strong> (le message de retour du serveur) a la même structure que la requête : une <strong>ligne de statut</strong> (au lieu de la ligne de requête), des en-têtes, une ligne vide, un corps. Voici la réponse à <code>GET /jeux/5</code> :</p>
<pre class="pseudo">HTTP/1.1 200 OK                # ligne de statut : version + code 200 + libellé « OK » (= succès)
Content-Type: application/json # en-tête : format du corps de la réponse (ici du JSON)
Content-Length: 178            # en-tête : taille du corps en octets (le client sait où il s'arrête)

{ "id": 5, "titre": "Catan", "editeur": "Kosmos", "annee": 1995,   # corps JSON : les données du jeu n°5 (début)
  "categorie": "strategie", "prix_location": 3.50,                 # suite de l'objet…
  "prix_vente": 39.90, "disponible": true }                        # fin de l'objet JSON</pre>
<p>La ligne de statut porte le <strong>code de statut</strong> (<code>200</code> = succès — toute la leçon 5 y est consacrée), un petit nombre qui résume l'issue de la requête. Et la réponse à notre <code>POST /jeux</code> ? Un code <code>201 Created</code> (« créé »), avec un en-tête précieux :</p>
<pre class="pseudo">HTTP/1.1 201 Created           # code 201 : une nouvelle ressource a été créée avec succès
Location: /jeux/9              # en-tête : URL où retrouver la ressource créée (le nouveau jeu)
Content-Type: application/json # format du corps de la réponse

{ "id": 9, "titre": "Azul", "disponible": true, … }   # corps JSON : le jeu créé, avec son id attribué par le serveur</pre>
<p>L'en-tête <strong><code>Location</code></strong> indique l'URL de la ressource qui vient d'être créée. Le client sait immédiatement où la retrouver.</p>

<h3>5. Qui lit tout ça ?</h3>
<p>Ton framework, dans les deux sens. Un <strong>framework</strong> est une boîte à outils prête à l'emploi qui t'évite de tout réécrire. Côté serveur, Django REST Framework (comme Spring, Laravel ou ASP.NET Core) découpe la requête pour toi : la méthode et le chemin choisissent la fonction à exécuter, les en-têtes sont accessibles, le corps JSON est <em>désérialisé</em> en objet (« désérialiser » = transformer le texte reçu en un objet manipulable dans le code). Côté client, la <strong>bibliothèque HTTP</strong> (un module tout fait pour envoyer des requêtes) fabrique la requête et découpe la réponse. Mais dans les deux cas, <strong>c'est ce texte-là qui circule</strong> — et quand ça ne marche pas, c'est ce texte-là que tu iras lire, avec <code>curl -i</code> (leçon 7) ou l'onglet Réseau du navigateur.</p>
<div class="warn">La <strong>ligne vide</strong> entre en-têtes et corps n'est pas décorative : c'est elle qui marque la frontière. Un outil qui l'omet produit une requête invalide — et un <code>Content-Type</code> absent ou faux donne souvent une erreur 400 (requête mal formée) ou 415 (format non supporté) côté serveur.</div>
<div class="tip">Ouvre l'onglet <strong>Réseau</strong> des outils de développement de ton navigateur (touche F12) sur n'importe quel site : chaque ligne est une requête réelle, avec sa méthode, ses en-têtes et sa réponse. C'est le meilleur terrain d'entraînement gratuit pour cette leçon.</div>`,
  exercises: [
    { type: "qcm", q: "La ligne de requête contient, dans l'ordre :", opts: ["chemin, méthode, version", "méthode, chemin, version", "version, méthode, chemin", "hôte, chemin, méthode"], a: 1, exp: "Exemple : GET /jeux/5 HTTP/1.1." },
    { type: "qcm", q: "Qu'est-ce qui sépare les en-têtes du corps ?", opts: ["Une ligne vide", "Un point-virgule", "Le mot BODY", "Rien"], a: 0, exp: "La ligne vide marque la frontière." },
    { type: "qcm", q: "L'en-tête qui décrit le format de ce que le client ENVOIE :", opts: ["Accept", "Host", "Content-Type", "User-Agent"], a: 2, exp: "Content-Type = format du corps émis." },
    { type: "qcm", q: "L'en-tête qui décrit le format que le client VEUT recevoir :", opts: ["Accept", "Content-Type", "Location", "Content-Length"], a: 0, exp: "Accept = « réponds-moi en JSON, s'il te plaît »." },
    { type: "qcm", q: "L'en-tête Host sert à…", opts: ["Chiffrer la requête", "Indiquer quel site est visé sur la machine", "Donner la taille du corps", "Identifier l'utilisateur"], a: 1, exp: "Une même machine peut héberger plusieurs sites." },
    { type: "qcm", q: "Après un POST /jeux réussi, le code attendu est…", opts: ["200", "204", "301", "201"], a: 3, exp: "201 Created : une ressource est née." },
    { type: "qcm", q: "L'en-tête Location d'une réponse 201 contient…", opts: ["L'adresse du client", "L'URL de la ressource créée", "Le pays du serveur", "Le format du corps"], a: 1, exp: "Exemple : Location: /jeux/9." },
    { type: "qcm", q: "La ligne de statut d'une réponse contient…", opts: ["méthode + chemin", "version + code + libellé", "uniquement le corps", "l'URL complète"], a: 1, exp: "Exemple : HTTP/1.1 200 OK." },
    { type: "qcm", q: "L'en-tête Authorization transporte…", opts: ["La preuve d'identité du client", "Le format de la réponse", "La version de HTTP", "Le chemin"], a: 0, exp: "Indispensable à chaque requête, HTTP étant stateless (leçons 15-16)." },
    { type: "qcm", q: "Content-Length indique…", opts: ["Le nombre d'en-têtes", "La durée de la requête", "La taille du corps en octets", "Le nombre de requêtes restantes"], a: 2, exp: "Le client sait quand le corps se termine." },
    { type: "vf", q: "Une requête GET transporte normalement un corps JSON.", a: false, exp: "GET n'a pas de corps : tout passe par l'URL (leçon 4)." },
    { type: "vf", q: "Requête et réponse ont la même structure générale : première ligne, en-têtes, ligne vide, corps.", a: true, exp: "Seule la première ligne diffère : requête vs statut." },
    { type: "vf", q: "Sans Content-Type, le serveur devine toujours correctement le format du corps.", a: false, exp: "Il ne devine pas : erreur 400/415 fréquente." },
    { type: "input", q: "Quel en-tête annonce le format du corps qu'on envoie ?", a: ["Content-Type"], ph: "Nom d'en-tête…", exp: "Content-Type: application/json pour du JSON." },
    { type: "input", q: "Quel en-tête d'une réponse 201 donne l'URL de la ressource créée ?", a: ["Location"], ph: "Nom d'en-tête…", exp: "Location: /jeux/9." }
  ],
  final: {
    title: "Exercice final — Lire le texte qui circule",
    intro: `<p>Tu reçois des fragments de requêtes et de réponses de la Ludothèque : à toi de les décoder.</p>`,
    questions: [
      { type: "qcm", q: "« POST /jeux HTTP/1.1 » : que fait cette requête ?", opts: ["Elle lit la liste des jeux", "Elle envoie des données à la collection /jeux (création)", "Elle supprime un jeu", "Elle change la version de HTTP"], a: 1, exp: "POST sur la collection = créer (détails leçon 4)." },
      { type: "qcm", q: "Le client envoie du JSON et veut du JSON en retour. Il pose donc…", opts: ["Content-Type et Accept à application/json", "Seulement Host", "Location et Content-Length", "Deux fois Accept"], a: 0, exp: "Content-Type pour l'aller, Accept pour le retour." },
      { type: "vf", q: "Dans « HTTP/1.1 200 OK », « OK » est le libellé lisible du code 200.", a: true, exp: "Le client route sa logique sur le nombre, pas sur le libellé." },
      { type: "input", q: "Quelle méthode apparaît dans la ligne de requête qui lit le jeu 5 : « ___ /jeux/5 HTTP/1.1 » ?", a: ["GET"], ph: "Une méthode…", exp: "GET : lire sans rien modifier." },
      { type: "qcm", q: "Une réponse arrive sans Content-Type mais avec un corps. C'est…", opts: ["Parfait", "Gênant : le client ne sait pas comment interpréter le corps", "Obligatoire en HTTP", "Plus rapide"], a: 1, exp: "Toujours annoncer le format du corps." }
    ],
    solution: `<pre class="pseudo">REQUÊTE                            RÉPONSE
GET /jeux/5 HTTP/1.1               HTTP/1.1 200 OK
Host: api.ludotheque.example       Content-Type: application/json
Accept: application/json           Content-Length: 178
(ligne vide)                       (ligne vide)
(pas de corps)                     { "id": 5, "titre": "Catan", … }

Content-Type = ce que j'ENVOIE   |   Accept = ce que je VEUX recevoir
POST réussi → 201 Created + Location: /jeux/9</pre>
<p>Tu sais maintenant lire les messages. Reste à maîtriser leur contenu : place au JSON, la langue commune de toutes les API.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "api-l2", title: "La requête reconstituée", level: 1,
    statement: "L'appli mobile de la Ludothèque doit inscrire un nouveau membre : Aïcha Diallo, aicha@example.com. Rédige à la main, ligne par ligne, la requête HTTP complète (ligne de requête, en-têtes utiles, ligne vide, corps JSON) puis la réponse complète que le serveur devrait renvoyer en cas de succès (ligne de statut, en-têtes, corps). Justifie en une phrase chaque en-tête que tu utilises.",
    atoi: {cmd: "python manage.py runserver\n# dans un autre terminal :\ncurl -i -X POST http://127.0.0.1:8000/api/membres/ \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"nom\":\"Aïcha Diallo\",\"email\":\"aicha@example.com\"}'", expected: "HTTP/1.1 201 Created\nLocation: /api/membres/13\nContent-Type: application/json\n\n{\"id\": 13, \"nom\": \"Aïcha Diallo\", \"email\": \"aicha@example.com\"}"},
    checklist: ["La ligne de requête est-elle « POST /api/membres/ HTTP/1.1 » (verbe POST = création) ?", "As-tu placé l'en-tête Content-Type: application/json avant le corps ?", "Y a-t-il bien une ligne vide entre les en-têtes et le corps JSON ?", "La réponse renvoie-t-elle 201 Created (pas 200) avec un en-tête Location ?"],
    hints: [

      "Côté requête, trois en-têtes au minimum : à qui je parle, ce que j'envoie, ce que je veux recevoir.",
      "Côté réponse : quel code pour une création, et quel en-tête indique où vit le nouveau membre ?"
    ],
    solution: "POST /membres HTTP/1.1              # méthode POST (créer) + chemin de la collection /membres + version\nHost: api.ludotheque.example        # le site visé (obligatoire)\nContent-Type: application/json      # j'envoie du JSON\nAccept: application/json            # je veux du JSON en retour\n\n{ \"nom\": \"Aïcha Diallo\", \"email\": \"aicha@example.com\" }   # corps JSON : les données du nouveau membre\n\n--- Réponse ---\nHTTP/1.1 201 Created                # code 201 = une ressource a été créée\nLocation: /membres/12               # en-tête : où retrouver le membre créé\nContent-Type: application/json      # format du corps renvoyé\n\n{ \"id\": 12, \"nom\": \"Aïcha Diallo\", \"email\": \"aicha@example.com\", \"date_inscription\": \"2026-01-15\" }   # corps JSON : id et date ajoutés par le SERVEUR\n\nRemarque : l'id et la date d'inscription sont créés par le SERVEUR, pas envoyés par le client.",
