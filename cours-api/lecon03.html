<script>
var DAY = {
  num: 3,
  title: "JSON : la langue commune",
  subtitle: "Un serveur Java, un client JavaScript, une appli Swift : tous parlent JSON.",
  theory: `
<h3>1. Pourquoi une langue commune ?</h3>
<p>Reprenons le décor de la leçon 1. Ton <strong>back-end</strong> (la partie cachée, côté serveur) manipule des <strong>objets</strong> — des paquets de données rangés en mémoire — dans le langage où il est écrit : Java, Python, PHP ou C#. Ton <strong>front-end</strong> (la façade visible, côté client) manipule, lui, des objets <strong>JavaScript</strong>. Un <strong>objet</strong>, ici, désigne simplement un ensemble d'informations regroupées (par exemple un jeu, avec son titre, son année, son prix). Problème : ces objets vivent dans la <strong>mémoire</strong> de l'ordinateur, chacun dans un format interne différent et <em>incompatible</em> — un objet Java ne « rentre » pas tel quel dans du JavaScript. Pour voyager d'un programme à l'autre à l'intérieur d'un message HTTP, il faut d'abord les traduire en <strong>texte</strong> : une simple suite de caractères que tout le monde sait lire et écrire. C'est comme deux personnes de langues maternelles différentes qui se mettent d'accord sur une langue commune pour se comprendre. Cette langue commune du web, c'est <strong>JSON</strong> (JavaScript Object Notation, « notation d'objet JavaScript ») : un format texte, né de JavaScript, mais aujourd'hui compris par absolument tous les langages.</p>
<p>Avant JSON, le web échangeait ses données en <strong>XML</strong> (un autre format texte, à base de <strong>balises</strong> comme le HTML — des marqueurs du type &lt;titre&gt;…&lt;/titre&gt;) : correct, mais <em>verbeux</em> (beaucoup de caractères pour peu d'information) et pénible à lire comme à écrire. JSON l'a peu à peu remplacé dans les API parce qu'il est <strong>léger</strong> (peu de caractères superflus), <strong>lisible par un humain</strong>, et <strong>trivial à traiter</strong> (facile à transformer en objets) dans tous les langages. Compare la même information dans les deux formats :</p>
<pre class="pseudo">XML  : &lt;jeu&gt;&lt;titre&gt;Catan&lt;/titre&gt;&lt;annee&gt;1995&lt;/annee&gt;&lt;/jeu&gt;   # XML : chaque donnée est encadrée par deux balises &lt;x&gt;…&lt;/x&gt; (ouvrante puis fermante) → lourd
JSON : { "titre": "Catan", "annee": 1995 }                            # JSON : la MÊME information en paires "clé": valeur entre accolades → court et clair</pre>

<h3>2. La syntaxe : six types, pas un de plus</h3>
<p>Tout document JSON se construit avec seulement <strong>six types de valeurs</strong>. Un <strong>type</strong>, c'est la « nature » d'une donnée : est-ce du texte, un nombre, une liste… ? Les voici :</p>
<pre class="pseudo">objet    : { "cle": valeur, "autre_cle": valeur }   # objet = ensemble de paires "clé": valeur, entre accolades { }
tableau  : [ valeur, valeur, valeur ]               # tableau = liste ORDONNÉE de valeurs, entre crochets [ ]
chaîne   : "Catan"                                  # chaîne = du texte, TOUJOURS entre guillemets DOUBLES "
nombre   : 3.50   1995                              # nombre = entier ou décimal, sans guillemets, séparateur = un POINT
booléen  : true   false                             # booléen = vrai ou faux, écrit en MINUSCULES
null     : null                                     # null = l'absence VOLONTAIRE de valeur (« il n'y a rien ici »)</pre>
<p>Un <strong>objet</strong> est un ensemble de paires <code>"clé": valeur</code> entre accolades — la <strong>clé</strong> est le nom de l'information (à gauche du <code>:</code>), la <strong>valeur</strong> est son contenu (à droite), et <strong>les clés sont toujours des chaînes entre guillemets doubles</strong>. Un <strong>tableau</strong> est une liste ordonnée entre crochets (l'ordre compte : le 1<sup>er</sup> élément reste le 1<sup>er</sup>). Objets et tableaux peuvent <strong>s'imbriquer</strong> librement — c'est-à-dire se contenir l'un l'autre : un tableau d'objets, un objet contenant un tableau, etc.</p>

<h3>3. La Ludothèque en JSON</h3>
<p>Voici un <strong>jeu</strong> de la Ludothèque tel qu'il circulera dans nos réponses. Chaque ligne à l'intérieur des accolades est une paire clé/valeur décrivant une propriété du jeu :</p>
<pre class="pseudo">{                              # début de l'objet jeu (accolade ouvrante)
  "id": 5,                     # identifiant unique du jeu (un nombre) → sert à le retrouver via /jeux/5
  "titre": "Catan",            # titre du jeu (une chaîne, entre guillemets doubles)
  "editeur": "Kosmos",         # nom de l'éditeur (chaîne)
  "annee": 1995,              # année de sortie (nombre, donc SANS guillemets)
  "categorie": "strategie",    # catégorie du jeu (chaîne)
  "prix_location": 3.50,       # prix de location en euros (nombre décimal, séparateur = point)
  "prix_vente": 39.90,         # prix de vente (nombre décimal)
  "disponible": true           # louable ou non (booléen) ; PAS de virgule après la DERNIÈRE paire
}                              # fin de l'objet jeu (accolade fermante)</pre>
<p>Et voici la réponse de <code>GET /jeux</code> (la demande « donne-moi tous les jeux ») : un <strong>tableau d'objets</strong>, c'est-à-dire une liste dont chaque élément est un jeu. Remarque le <code>null</code> pour une donnée absente, bien différent d'une chaîne vide :</p>
<pre class="pseudo">[                                                                       # début du tableau (crochet ouvrant) : la liste de jeux
  { "id": 5, "titre": "Catan", "annee": 1995, "disponible": true },     # 1er élément : le jeu n°5 ; virgule car d'autres suivent
  { "id": 6, "titre": "Les Aventuriers du Rail", "annee": 2004, "disponible": false },  # 2e élément : jeu n°6, non disponible
  { "id": 7, "titre": "7 Wonders", "annee": 2010, "disponible": true },  # 3e élément : jeu n°7
  { "id": 8, "titre": "Dixit", "annee": 2008, "disponible": null }       # 4e (dernier) élément : disponibilité INCONNUE (null), PAS de virgule après
]                                                                       # fin du tableau (crochet fermant)</pre>

<h3>4. Les pièges qui cassent tout</h3>
<p>JSON est <strong>strict</strong> : au moindre écart, le <strong>parseur</strong> (le programme chargé de lire le texte JSON et de le retransformer en objets) rejette le document <em>entier</em>. Voici les fautes les plus courantes — la croix ✗ marque ce qui est interdit :</p>
<pre class="pseudo">{ 'titre': 'Catan' }        # ✗ guillemets SIMPLES interdits : JSON n'accepte que les guillemets doubles "
{ titre: "Catan" }          # ✗ clé SANS guillemets interdite : une clé est toujours une chaîne "titre"
{ "annee": 1995, }          # ✗ virgule FINALE (après la dernière paire) interdite
{ "prix": 3,50 }            # ✗ virgule décimale interdite : le séparateur est un POINT → 3.50
{ "ok": True }              # ✗ majuscule interdite : les booléens s'écrivent true / false en minuscules
// mon commentaire          # ✗ AUCUN commentaire n'existe en JSON (ni //, ni #, ni /* */)</pre>
<p>Oui, <strong>aucun commentaire n'est possible en JSON</strong> : c'est un format d'<em>échange de données</em> entre programmes, pas un fichier de configuration destiné à être annoté par un humain.</p>

<h3>5. Sérialiser, désérialiser</h3>
<p>Traduire un objet vivant en mémoire en <strong>texte</strong> JSON s'appelle <strong>sérialiser</strong> (image : « mettre en série de caractères ») ; le chemin inverse — repartir du texte pour reconstruire un objet manipulable — s'appelle <strong>désérialiser</strong>. Tu ne fais presque jamais ce travail à la main : chaque langage fournit un <strong>outil</strong> (une bibliothèque) qui s'en charge — le module <code>json</code> en Python, <strong>Jackson</strong> en Java (utilisé par Spring), <code>json_encode</code>/<code>json_decode</code> en PHP (Laravel), <code>System.Text.Json</code> en C# (ASP.NET Core), <code>JSON.parse</code>/<code>JSON.stringify</code> en JavaScript. En Django REST Framework, ce travail est confié aux <em>serializers</em>, qui valident au passage les données entrantes.</p>
<pre class="pseudo">objet Python ──sérialisation──►  texte JSON  ──désérialisation──► objet Java   # même donnée, trois formes successives
{'titre': 'Catan'}            { "titre": "Catan" }             Jeu(titre="Catan")   # aux extrémités : objets EN MÉMOIRE ; au milieu : le TEXTE qui voyage sur le réseau</pre>
<p>Enfin, un corps JSON s'annonce toujours avec l'<strong>en-tête</strong> vu à la leçon précédente : <strong><code>Content-Type: application/json</code></strong>. Un <strong>en-tête</strong> (header) est une petite étiquette d'information collée au message ; <code>Content-Type</code> précise le format du contenu, et <code>application/json</code> est le <strong>type MIME</strong> (le nom officiel de format) de JSON.</p>
<div class="warn">Ne confonds pas un objet de ton langage avec du JSON : <code>{'titre': 'Catan'}</code> est un dictionnaire Python valide mais un JSON <strong>invalide</strong> (guillemets simples). Le JSON n'existe que sous forme de <strong>texte</strong> aux règles strictes ; laisse toujours la sérialisation à la bibliothèque, jamais à une concaténation de chaînes à la main.</div>
<div class="tip">Colle tout JSON douteux dans un validateur (jsonlint.com, ou la console du navigateur avec JSON.parse) avant d'accuser ton code. Neuf « bugs d'API » sur dix chez les débutants sont une virgule finale ou un guillemet simple.</div>`,
  exercises: [
    { type: "qcm", q: "JSON signifie…", opts: ["Java Standard Object Notation", "JavaScript Object Notation", "JSON Serialized Object Network", "Java Server Output Name"], a: 1, exp: "Né de JavaScript, adopté par tous les langages." },
    { type: "qcm", q: "En JSON, les chaînes et les clés s'écrivent…", opts: ["Entre guillemets simples", "Sans guillemets", "Entre guillemets doubles", "Entre parenthèses"], a: 2, exp: "Guillemets doubles obligatoires, partout." },
    { type: "qcm", q: "Lequel de ces fragments est un JSON valide ?", opts: ["{ titre: \"Catan\" }", "{ \"titre\": \"Catan\" }", "{ 'titre': 'Catan' }", "{ \"titre\": \"Catan\", }"], a: 1, exp: "Clé entre guillemets doubles, pas de virgule finale." },
    { type: "qcm", q: "Le nombre trois euros cinquante s'écrit en JSON…", opts: ["\"3,50\"", "3,50", "3.50", "trois-cinquante"], a: 2, exp: "Point décimal, pas de guillemets pour un nombre." },
    { type: "qcm", q: "En JSON, l'absence de valeur se note…", opts: ["null", "None", "nil", "undefined"], a: 0, exp: "None est du Python, nil du Ruby, undefined du JavaScript." },
    { type: "qcm", q: "La réponse de GET /jeux (une liste) est naturellement…", opts: ["Un objet unique", "Un tableau d'objets", "Une chaîne géante", "Un nombre"], a: 1, exp: "Crochets autour, un objet par jeu." },
    { type: "qcm", q: "Les commentaires en JSON…", opts: ["S'écrivent avec //", "S'écrivent avec #", "N'existent pas", "S'écrivent entre balises"], a: 2, exp: "Format d'échange de données : aucun commentaire prévu." },
    { type: "qcm", q: "Transformer un objet mémoire en texte JSON s'appelle…", opts: ["Compiler", "Sérialiser", "Chiffrer", "Indexer"], a: 1, exp: "Et l'inverse : désérialiser." },
    { type: "qcm", q: "En Java (Spring), la bibliothèque standard de sérialisation JSON est…", opts: ["Jackson", "Pandas", "Eloquent", "NumPy"], a: 0, exp: "json en Python, json_encode en PHP, System.Text.Json en C#." },
    { type: "qcm", q: "JSON a remplacé XML dans les API surtout parce qu'il est…", opts: ["Plus ancien", "Compilé", "Plus léger et plus simple à lire et traiter", "Réservé à Java"], a: 2, exp: "Moins verbeux, parseurs natifs partout." },
    { type: "vf", q: "true, false et True sont trois booléens JSON valides.", a: false, exp: "Uniquement true et false, en minuscules." },
    { type: "vf", q: "Objets et tableaux JSON peuvent s'imbriquer sans limite.", a: true, exp: "Un tableau d'objets contenant des tableaux : parfaitement valide." },
    { type: "vf", q: "\"disponible\": null et \"disponible\": \"\" signifient la même chose.", a: false, exp: "null = absence de valeur ; \"\" = une chaîne vide bien présente." },
    { type: "input", q: "Quelle valeur de Content-Type annonce un corps JSON ?", a: ["application/json"], ph: "type/sous-type…", exp: "Le type MIME officiel de JSON." },
    { type: "input", q: "En Django REST Framework, quel composant sérialise et valide les données (mot anglais) ?", a: ["serializer", "serializers", "le serializer"], ph: "Un mot…", exp: "Les serializers traduisent et valident dans les deux sens." }
  ],
  final: {
    title: "Exercice final — Chasse aux JSON invalides",
    intro: `<p>Le stagiaire de la Ludothèque a écrit plusieurs corps de requêtes à la main. À toi de repérer ce qui casse.</p>`,
    questions: [
      { type: "qcm", q: "{ \"titre\": \"Azul\", \"annee\": 2017, } — le problème :", opts: ["Les guillemets doubles", "La virgule finale", "Le nombre sans guillemets", "Aucun problème"], a: 1, exp: "La virgule après la dernière paire est interdite." },
      { type: "qcm", q: "{ \"prix_location\": \"3.50\" } — techniquement valide, mais…", opts: ["Le prix est une CHAÎNE, pas un nombre : les calculs côté client casseront", "Le point décimal est interdit", "Les clés en minuscules sont interdites", "Il manque un commentaire"], a: 0, exp: "Type correct = contrat correct : un prix est un nombre." },
      { type: "vf", q: "{ \"jeux\": [ { \"id\": 5 }, { \"id\": 7 } ] } est un JSON valide.", a: true, exp: "Un objet contenant un tableau d'objets : imbrication normale." },
      { type: "input", q: "Le stagiaire a écrit \"disponible\": True. Quelle est la valeur correcte ?", a: ["true"], ph: "Un booléen…", exp: "Minuscules obligatoires : true." },
      { type: "qcm", q: "Pour produire le JSON d'un jeu côté serveur, la bonne pratique est…", opts: ["Concaténer des chaînes à la main", "Laisser la bibliothèque de sérialisation du langage faire le travail", "L'écrire dans un fichier Word", "Utiliser XML puis convertir"], a: 1, exp: "Échappement, types, encodage : la bibliothèque gère tout." }
    ],
    solution: `<pre class="pseudo">Six types : objet {}, tableau [], "chaîne", nombre, true/false, null      # les 6 seules valeurs possibles en JSON
Règles    : guillemets DOUBLES, point décimal, pas de virgule finale,     # les fautes qui font tout rejeter…
            pas de commentaires, true/false/null en minuscules            # …par le parseur, sans pitié
Voyage    : objet mémoire ──sérialiser──► texte JSON ──désérialiser──► objet   # comment une donnée passe d'un programme à l'autre
Outils    : json (Python) · Jackson (Java) · json_encode (PHP)            # chaque langage a SA bibliothèque de (dé)sérialisation
            System.Text.Json (C#) · serializers (Django REST Framework)   # …à utiliser plutôt que d'écrire le JSON à la main
En-tête   : Content-Type: application/json                                # l'étiquette qui annonce « mon corps est du JSON »</pre>
<p>Tu parles la langue. Prochaine étape : les verbes de la conversation — GET, POST, PUT, PATCH, DELETE.</p>`
  }
};
</script>

  { id: "api-l3", title: "Modéliser une location en JSON", level: 1,
    statement: "La Ludothèque doit représenter une location en JSON : le membre 12 loue le jeu 5 depuis le 1er juillet 2026, la location est en cours (pas encore rendue). Écris l'objet JSON complet en choisissant soigneusement le type de chaque champ (nombre, chaîne, null…), puis justifie par écrit trois de tes choix de types. Écris ensuite le même objet une fois la location terminée (retour le 8 juillet).",
    atoi: {cmd: "python manage.py runserver\ncurl -i http://127.0.0.1:8000/api/locations/1", expected: "HTTP/1.1 200 OK\nContent-Type: application/json\n\n{\"id\": 1, \"membre\": 12, \"jeu\": 5, \"debut\": \"2026-07-01\", \"retour\": null, \"en_cours\": true}\n\n# Location terminée (retour le 8) : \"retour\": \"2026-07-08\", \"en_cours\": false"},
