<script>
var DAY = {
  num: 20,
  title: "Consommer une API : le point de vue du client",
  subtitle: "Dix-neuf leçons côté serveur. Aujourd'hui, tu passes de l'autre côté du contrat.",
  theory: `
<h3>1. Changer de chaise</h3>
<p>Avant de commencer, posons les mots en langage de tous les jours. Une <strong>API</strong> (sigle anglais de <em>Application Programming Interface</em>, « interface de programmation ») est une porte d'entrée par laquelle un programme demande des services à un autre programme — comme le guichet d'un restaurant où l'on passe commande sans jamais entrer en cuisine. Une <strong>API REST</strong> est simplement une API qui respecte un style d'organisation très répandu sur le web (le style « REST », détaillé tout au long de ce cours). Deux acteurs dialoguent : le <strong>client</strong> (celui qui demande — ton navigateur, une application mobile, un script) et le <strong>serveur</strong> (celui qui répond — l'ordinateur distant qui héberge l'API). Ils s'échangent des messages grâce à <strong>HTTP</strong> (<em>HyperText Transfer Protocol</em>), la « langue » du web : le client envoie une <strong>requête</strong> (la commande passée au guichet) et le serveur renvoie une <strong>réponse</strong> (le plat servi… ou un message d'erreur).</p>
<p>Une API n'existe que consommée : par le front React de la Ludothèque, par le script Python d'un partenaire, par l'app mobile. Aujourd'hui tu écris le <strong>client</strong> — et tu vas constater que chaque effort des leçons précédentes (codes justes, enveloppe d'erreur, Retry-After) devient une ligne triviale de ce côté-ci. Deux outils au programme : <code>fetch</code> dans le navigateur (détaillé dans le cours front-end — ici, l'essentiel vu de l'API) et la bibliothèque <code>requests</code> en Python. Un <strong>outil</strong> comme <code>fetch</code> ou <code>requests</code> est un morceau de code tout prêt qui sait fabriquer une requête HTTP et récupérer la réponse à ta place.</p>

<h3>2. fetch : le client du navigateur</h3>
<p>Quelques mots à connaître avant de lire ce bloc. Une <strong>URL</strong> (<em>Uniform Resource Locator</em>) est l'adresse d'une ressource sur le web, comme <code>https://api.ludotheque.example/v1/jeux/5</code> ; une <strong>ressource</strong> est une « chose » exposée par l'API (ici, le jeu numéro 5) et le morceau d'adresse qui la désigne s'appelle un <strong>endpoint</strong> (« point d'accès »). Un <strong>en-tête</strong> (en anglais <em>header</em>) est une petite étiquette d'information collée sur la requête ou la réponse (par exemple : « voici mon identité »). Le <strong>token</strong> est un jeton d'identité : une longue chaîne de caractères, reçue au moment de la connexion, qui prouve « c'est bien moi » à chaque appel. Enfin <strong>JSON</strong> (<em>JavaScript Object Notation</em>) est un format texte, lisible par l'humain et la machine, pour représenter des données structurées (accolades, listes, paires nom/valeur).</p>
<pre class="pseudo">const rep = await fetch("https://api.ludotheque.example/v1/jeux/5", {   // fetch = envoie la requête HTTP ; await = attend la réponse ; rep la stocke
  headers: { "Authorization": "Bearer " + token }   // en-tête d'identité : le mot "Bearer " suivi du token reçu au login
});                                // fin de l'appel fetch (accolade + parenthèse fermantes, puis point-virgule)

if (!rep.ok) {                     // rep.ok vaut true pour un statut 2xx ; le "!" (NON) fait entrer ici sur un 4xx ou 5xx
  const err = await rep.json();    // lit le corps JSON de la réponse (l'enveloppe d'erreur de la leçon 12)
  // … router selon rep.status (section 4)   // on choisit la réaction selon le code de statut reçu
}
const jeu = await rep.json();      // cas de succès : on transforme le corps JSON en objet JavaScript exploitable</pre>
<p>Un mot sur <code>fetch</code> : c'est la fonction du navigateur qui part chercher (<em>to fetch</em> = « aller chercher ») une ressource sur le réseau. Elle renvoie une <strong>promesse</strong> (une valeur « pas encore arrivée »), et <code>await</code> (« attendre ») met le code en pause jusqu'à ce que la réponse revienne. Piège n°1, responsable de mille bugs : <strong>fetch ne rejette PAS sa promesse sur un 404 ou un 500</strong>. Elle n'échoue que sur une erreur <em>réseau</em> (serveur injoignable, DNS, CORS bloqué). Un <code>catch</code> ne suffit donc jamais : on teste <code>rep.ok</code> (statut 2xx) ou <code>rep.status</code>. Le <strong>code de statut</strong> est le numéro à trois chiffres que le serveur colle sur sa réponse pour dire comment ça s'est passé (200 = ok, 404 = introuvable, etc.). Pour un POST : <code>method: "POST"</code>, en-tête <code>Content-Type: application/json</code> (l'étiquette qui annonce « le corps que j'envoie est du JSON »), et <code>body: JSON.stringify(donnees)</code> (le <strong>corps</strong> de la requête, c'est-à-dire les données transportées, converties en texte JSON).</p>

<h3>3. requests : le client Python</h3>
<p>Côté Python, <code>requests</code> est la bibliothèque de référence pour parler à une API. Une <strong>méthode</strong> HTTP est le verbe de la requête, qui dit l'intention : <code>GET</code> (« lis/donne-moi »), <code>POST</code> (« crée »), <code>PUT</code> (« remplace »), <code>PATCH</code> (« modifie en partie »), <code>DELETE</code> (« supprime »). Ici on utilise <code>requests.get</code>, la version Python d'un GET.</p>
<pre class="pseudo">import requests                     # importe la bibliothèque requests (le client HTTP de Python)

rep = requests.get(                # requests.get = envoie une requête HTTP de type GET (lire une ressource)
    "https://api.ludotheque.example/v1/jeux/5",   # l'URL de la ressource demandée (le jeu n°5)
    headers={"Authorization": "Bearer " + token},   # en-tête d'identité : le token présenté en "Bearer"
    timeout=5)                     # OBLIGATOIRE : sinon attente infinie (délai maximal de 5 secondes)

if rep.status_code == 404:         # rep.status_code = le code de statut renvoyé par le serveur ; == teste l'égalité
    print("Jeu introuvable")       # 404 = ressource absente : on affiche un message métier clair
rep.raise_for_status()             # lève une exception sur 4xx/5xx (stoppe le script en cas d'erreur)
jeu = rep.json()                   # transforme le corps JSON de la réponse en dictionnaire Python</pre>
<p>Trois réflexes : le <code>timeout</code> explicite (sans lui, un serveur muet gèle ton script pour toujours — <code>requests</code> n'a <em>pas</em> de timeout par défaut ; un <strong>timeout</strong> est un délai d'attente maximal au-delà duquel on abandonne) ; <code>rep.status_code</code> pour router finement ; <code>raise_for_status()</code> quand « toute erreur doit stopper le script » suffit (« lever une exception » = déclencher une erreur qui interrompt l'exécution). Le POST s'écrit <code>requests.post(url, json=donnees)</code> — le paramètre <code>json=</code> sérialise et pose le Content-Type tout seul (<strong>sérialiser</strong> = transformer un objet en texte JSON prêt à voyager sur le réseau).</p>

<h3>4. Router sur les codes : le miroir du serveur</h3>
<p>« Router » veut dire : choisir quoi faire selon le code de statut reçu, comme un aiguilleur oriente les trains. La table de la leçon 5, lue depuis l'autre chaise :</p>
<pre class="pseudo">401 → jeter le token, renvoyer vers l'écran de connexion
403 → « accès refusé » — se ré-authentifier n'y changera RIEN
404 → « jeu introuvable » (message métier, pas une page blanche)
422 → lire erreur.details, afficher sous chaque champ (leçon 12)
429 → attendre Retry-After, puis réessayer (leçon 19)
5xx → réessayer avec attente croissante — UNIQUEMENT si idempotent</pre>
<p>Petit lexique de ces codes : <strong>401</strong> = « qui es-tu ? » (non authentifié — le token manque ou a expiré) ; <strong>403</strong> = « je sais qui tu es, mais tu n'as pas le droit » ; <strong>404</strong> = « cette ressource n'existe pas » ; <strong>422</strong> = « ta demande est mal formée » (données invalides), le serveur détaille les erreurs dans <code>erreur.details</code> ; <strong>429</strong> = « trop de requêtes, ralentis », l'en-tête <code>Retry-After</code> disant combien de secondes patienter ; <strong>5xx</strong> = une panne côté serveur. Le mot <strong>idempotent</strong> qualifie une opération que l'on peut répéter sans effet supplémentaire : redemander la lecture du jeu 5 (GET) dix fois donne le même résultat, alors que renvoyer dix fois un POST « ajoute un avis » créerait dix avis — dangereux à réessayer. Relis cette table : chaque ligne n'est possible que parce que le serveur tient son contrat. Un serveur qui répond 200 <code>{ "erreur": … }</code> condamne ses clients à parser des messages en français — c'était l'avertissement de la leçon 5, le voilà vécu.</p>

<h3>5. Le token et le module client</h3>
<p>Un <strong>module</strong> est un fichier de code regroupant des fonctions liées, que l'on peut <em>importer</em> (réutiliser) partout ailleurs. L'idée ici : rassembler tout le dialogue avec l'API dans UN seul module, au lieu d'éparpiller des <code>fetch</code> dans chaque écran.</p>
<pre class="pseudo">// UN module client, importé partout — jamais 40 fetch éparpillés
const BASE = "https://api.ludotheque.example/v1";   // adresse de base + numéro de version, écrites UNE seule fois
let token = null;                                   // le jeton d'identité : vide (null) tant qu'on n'est pas connecté

async function apiFetch(chemin, options) {          // fonction unique par laquelle passent TOUS les appels à l'API
  // 1. ajoute Authorization: Bearer si un token est présent   // colle l'en-tête d'identité quand on est connecté
  // 2. exécute le fetch sur BASE + chemin                      // reconstruit l'URL complète = base + endpoint
  // 3. 401 → purge le token, redirige vers /connexion          // token expiré : on repart au login
  // 4. !rep.ok → lève une erreur construite depuis l'enveloppe JSON   // erreur HTTP : on la traduit proprement
}</pre>
<p>Le token reçu au login (leçon 15) se stocke côté client — en mémoire ou en <code>localStorage</code> (un petit coffre du navigateur qui garde des données même après fermeture de l'onglet), un compromis discuté dans le cours <em>Sécurité applicative</em> — et repart dans <code>Authorization</code> à chaque appel, jamais dans l'URL. Un 401 en cours de session signale l'expiration : on purge et on redemande le login (ou on utilise le <strong>refresh token</strong>, un second jeton qui permet d'obtenir un nouveau token sans retaper son mot de passe, leçon 16). Centraliser tout cela dans <strong>un seul module</strong> paie double : la base URL et le <code>/v1</code> vivent à un endroit (bonjour la leçon 13), et la traduction des erreurs aussi. Bonus leçon 14 : le document OpenAPI (une fiche technique standardisée qui décrit toute l'API) sait <strong>générer</strong> ce module — on parle alors d'un <strong>SDK</strong> (<em>Software Development Kit</em>, une boîte à outils de code) TypeScript ou Python, produit automatiquement.</p>
<div class="warn">Le bug classique du débutant : entourer <code>fetch</code> d'un try/catch et croire les erreurs gérées. Un 500 ne passe PAS dans le catch — la promesse est <strong>résolue</strong>. Teste toujours <code>rep.ok</code> avant de lire le corps comme un succès.</div>
<div class="tip">Écris le module client le premier jour et interdis les fetch « sauvages » dans les composants : base URL, version, token et erreurs vivent à UN seul endroit. Le jour où l'API passe en /v2, tu changes une ligne.</div>`,
  exercises: [
    { type: "qcm", q: "fetch reçoit une réponse 404. Que se passe-t-il côté JavaScript ?", opts: ["La promesse est rejetée : direction le catch", "La promesse est résolue, et rep.ok vaut false", "Une exception TypeError", "La page se recharge"], a: 1, exp: "fetch ne rejette que sur erreur réseau : le 404 est une réponse comme une autre." },
    { type: "qcm", q: "fetch rejette sa promesse quand…", opts: ["Le serveur répond 500", "Le serveur répond 422", "Le serveur est injoignable (erreur réseau, DNS, blocage CORS)", "Le JSON est vide"], a: 2, exp: "Pas de réponse du tout ≠ réponse d'erreur : seule la première fait échouer la promesse." },
    { type: "qcm", q: "rep.ok vaut true quand…", opts: ["Le statut est dans les 2xx", "Le statut est inférieur à 500", "Le corps contient « ok »", "La requête a mis moins d'une seconde"], a: 0, exp: "Le raccourci officiel pour « succès » — à tester avant de parser le corps." },
    { type: "qcm", q: "Pour lire le corps JSON d'une réponse fetch :", opts: ["rep.body directement", "JSON.parse(rep)", "await rep.json()", "rep.text.json"], a: 2, exp: "La lecture du corps est asynchrone : await rep.json()." },
    { type: "qcm", q: "Pour un POST avec fetch, il faut préciser…", opts: ["method, Content-Type: application/json et body: JSON.stringify(donnees)", "Seulement l'URL", "Un cookie", "method: « SEND »"], a: 0, exp: "Le corps part en chaîne JSON, annoncé par son Content-Type (leçon 2)." },
    { type: "qcm", q: "En Python, la bibliothèque de référence du cours pour appeler une API :", opts: ["numpy", "requests", "flask", "os"], a: 1, exp: "requests.get / requests.post — simple et omniprésente." },
    { type: "qcm", q: "rep.raise_for_status() en Python…", opts: ["Renvoie le statut en texte", "Relance la requête", "Lève une exception si le statut est 4xx ou 5xx", "Ferme la connexion"], a: 2, exp: "Pratique quand « toute erreur doit stopper le script » suffit comme politique." },
    { type: "qcm", q: "Pourquoi toujours passer timeout=5 à requests ?", opts: ["Pour accélérer le serveur", "Sans timeout, un serveur muet gèle le script indéfiniment (pas de défaut !)", "C'est obligatoire syntaxiquement", "Pour éviter le code 408"], a: 1, exp: "requests attend pour toujours par défaut : le timeout explicite est un réflexe vital." },
    { type: "qcm", q: "L'API répond 401 en pleine session. Le client doit…", opts: ["Réessayer la même requête en boucle", "Purger le token et repasser par le login (ou le refresh token)", "Afficher la stack trace", "Passer en HTTP"], a: 1, exp: "Le token a expiré : seule une nouvelle preuve d'identité débloquera la suite." },
    { type: "qcm", q: "L'API répond 422 sur le formulaire d'avis. Le client doit…", opts: ["Réessayer sans rien changer", "Afficher « erreur inconnue »", "Lire erreur.details et afficher chaque message sous le bon champ", "Se déconnecter"], a: 2, exp: "Le contrat d'erreur de la leçon 12 paie exactement ici." },
    { type: "vf", q: "Sur un 403, se ré-authentifier résoudra le problème.", a: false, exp: "403 = identité connue, droit refusé (leçon 5) : re-badger ne sert à rien, on affiche « accès refusé »." },
    { type: "vf", q: "Après un timeout sur un POST sans Idempotency-Key, le module client réessaie automatiquement.", a: false, exp: "Leçon 19 : POST n'est pas idempotent — retry interdit sans clé, sous peine de doublons." },
    { type: "input", q: "La propriété booléenne de la réponse fetch qui vaut true pour un statut 2xx :", a: ["ok", "rep.ok", ".ok", "response.ok"], ph: "propriété", exp: "if (!rep.ok) { … } — LE test à faire avant de lire le corps." },
    { type: "input", q: "L'en-tête dans lequel le client place son token à chaque requête :", a: ["Authorization", "authorization"], ph: "Nom de l'en-tête…", exp: "Authorization: Bearer &lt;token&gt; — jamais dans l'URL (leçon 15)." },
    { type: "input", q: "L'en-tête de réponse qui dit combien de temps attendre après un 429 :", a: ["Retry-After", "retry-after"], ph: "Nom de l'en-tête…", exp: "Le client bien élevé attend Retry-After secondes avant de réessayer (leçon 19)." }
  ],
  final: {
    title: "Exercice final — Le client bien élevé",
    intro: `<p>Tu écris le front de la Ludothèque et un script Python d'import. Chaque situation appelle le bon réflexe client.</p>`,
    questions: [
      { type: "qcm", q: "Le fetch vers /v1/jeux/999 se termine, rep.status vaut 404. Côté JavaScript…", opts: ["Le catch a été déclenché", "La promesse est résolue : c'est à TON code de tester rep.ok", "fetch a relancé la requête", "Le navigateur affiche une alerte"], a: 1, exp: "Réponse reçue = promesse résolue, même pour une erreur : le piège n°1 de la leçon." },
      { type: "qcm", q: "Le script Python reste figé depuis deux minutes sur un appel à l'API. Le plus probable :", opts: ["Le JSON est trop lourd", "Il manque le paramètre timeout= : requests attend indéfiniment", "Python est trop lent", "L'ETag a expiré"], a: 1, exp: "Pas de timeout par défaut dans requests — le réflexe vital de la section 3." },
      { type: "qcm", q: "En pleine navigation, un appel renvoie 401 alors qu'il marchait il y a une heure :", opts: ["Le serveur est en panne", "Le token a expiré : purge + reconnexion (ou refresh token)", "C'est un problème CORS", "Il faut réessayer en boucle"], a: 1, exp: "L'expiration du JWT (leçon 16) se manifeste exactement ainsi côté client." },
      { type: "vf", q: "Grâce au contrat d'erreur unique de la leçon 12, le module client peut afficher les erreurs 422 sous chaque champ avec une seule fonction.", a: true, exp: "Même enveloppe partout → une fonction de traduction des erreurs suffit pour toute l'API." },
      { type: "input", q: "La méthode de requests qui lève une exception sur un statut 4xx/5xx :", a: ["raise_for_status", "raise_for_status()", "rep.raise_for_status()"], ph: "nom_de_methode", exp: "rep.raise_for_status() — la politique « toute erreur stoppe le script » en une ligne." }
    ],
    solution: `<pre class="pseudo">fetch : ne rejette QUE sur erreur réseau → tester rep.ok / rep.status   // 4xx/5xx = promesse résolue, à toi de tester
        Authorization: "Bearer " + token · POST = method + Content-Type   // token en en-tête ; POST annonce son type
        + body JSON.stringify (détails : cours front-end)                 // corps sérialisé en texte JSON
requests : requests.get/post(url, json=…, timeout=5) — timeout OBLIGATOIRE   // sans timeout, attente infinie
           rep.status_code · rep.json() · rep.raise_for_status()            // lire le code, le corps, ou lever une erreur
Router : 401 reconnexion · 403 stop · 404 message · 422 details par champ    // une réaction par code de statut
         429 attendre Retry-After · 5xx retry si idempotent (leçon 19)       // ralentir sur 429 ; retry prudent sur 5xx
UN module client : BASE + /v1, token, traduction des erreurs — à un          // tout centralisé à un seul endroit
seul endroit (générable depuis OpenAPI, leçon 14)                            // ou généré automatiquement (SDK)</pre>
<p>Tu tiens désormais les deux bouts du contrat : le concevoir et le consommer. Dernière leçon : l'examen — l'API de la Ludothèque complète, de la première requête HTTP au dernier en-tête.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "api-l20", title: "Le module client de la Ludothèque", level: 3,
    statement: "Écris en pseudo-code le module client officiel du front de la Ludothèque. Il doit exposer connexion(email, mot_de_passe), apiGet(chemin) et apiPost(chemin, donnees), gérer le token à UN seul endroit, et traduire les réponses : 2xx → données, 401 → purge du token + redirection connexion, 422 → erreur structurée avec details, 429 → attente de Retry-After puis UN seul nouvel essai, autres erreurs → erreur générique portant le message de l'enveloppe. Termine par la liste de ce que le module ne fait JAMAIS (au moins deux interdits).",
    checklist: ["Le token est-il géré à UN seul endroit (stocké, injecté, purgé au même lieu) ?", "Chaque code (2xx, 401, 422, 429, autre) a-t-il son traitement dédié ?", "Le 429 attend-il Retry-After puis ne retente-t-il qu'UNE seule fois ?", "La liste des interdits (au moins deux) est-elle explicite (ne jamais avaler une erreur en silence, ne jamais dupliquer la logique du token…) ?"],
    hints: [
      "Commence par les constantes partagées : BASE avec /v1, variable token — puis fais passer apiGet et apiPost par UNE fonction interne commune.",

    ],
    solution: "MODULE client-api (pseudo-code) — le SEUL endroit qui parle à l'API\n\nconstante BASE = \"https://api.ludotheque.example/v1\"   // adresse de base + version, écrites une seule fois\nvariable token = null   (en mémoire ; compromis localStorage : cours Sécurité applicative)   // vide tant qu'on n'est pas connecté\n\nfonction connexion(email, mot_de_passe):   // échange un couple identifiants contre un token\n    rep = POST BASE + \"/auth/login\" avec corps { email, mot_de_passe }   // envoie les identifiants au serveur\n    si rep.ok : token = rep.json().token ; retourner vrai   // succès : on mémorise le token et on signale OK\n    sinon : retourner erreur « identifiants invalides » (sans préciser lequel)   // échec : message volontairement vague\n\nfonction interne requete(methode, chemin, donnees, dejaReessaye = faux):   // le passage obligé de TOUS les appels\n    en_tetes = { \"Content-Type\": \"application/json\" }   // annonce qu'on envoie du JSON\n    si token existe : en_tetes[\"Authorization\"] = \"Bearer \" + token   // ajoute la preuve d'identité si connecté\n    rep = fetch(BASE + chemin, { methode, en_tetes, corps: JSON.stringify(donnees) })   // envoie la requête HTTP\n    // rappel : fetch ne rejette pas sur 4xx/5xx → on teste rep.status\n\n    si rep.ok : retourner rep.json()   (ou rien si 204)   // succès 2xx : on renvoie les données\n    si rep.status == 401 : token = null ; rediriger vers /connexion ; stop   // token expiré : purge + retour au login\n    si rep.status == 422 :   // données invalides\n        env = rep.json() ; lever ErreurValidation(env.erreur.details)   // on remonte le détail des champs fautifs\n        // l'écran affiche chaque message sous le bon champ\n    si rep.status == 429 et non dejaReessaye :   // trop de requêtes, et on n'a pas encore réessayé\n        attendre rep.en_tetes[\"Retry-After\"] secondes   // patiente le temps indiqué par le serveur\n        retourner requete(methode, chemin, donnees, vrai)   // UN seul ré-essai\n    sinon :   // toute autre erreur (403, 404, 5xx…)\n        env = rep.json() ; lever ErreurApi(env.erreur.code, env.erreur.message)   // erreur générique portant le message de l'enveloppe\n\nfonction apiGet(chemin):            retourner requete(\"GET\", chemin)   // lecture : délègue à la fonction interne\nfonction apiPost(chemin, donnees):  retourner requete(\"POST\", chemin, donnees)   // création : même passage commun\n\nCE QUE LE MODULE NE FAIT JAMAIS :\n1. Mettre le token (ou tout secret) dans une URL — Authorization uniquement (leçon 15).\n2. Réessayer automatiquement un POST après timeout sans Idempotency-Key — risque de doublons (leçon 19).\n3. Traiter une réponse comme un succès sans avoir testé rep.ok.\n4. Afficher à l'utilisateur un message technique brut : il traduit toujours l'enveloppe de la leçon 12.",
    note: "Ce module est le premier fichier à écrire dans ton capstone front — et tu remarqueras qu'il n'est simple QUE parce que l'API tient ses promesses : codes justes, enveloppe unique, Retry-After. C'est aussi exactement ce que génère un SDK OpenAPI (leçon 14). Le stockage sécurisé du token et les refresh tokens sont approfondis dans le cours Sécurité applicative." }
  ]
};
</script>
