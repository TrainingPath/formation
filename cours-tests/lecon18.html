<script>
var DAY = {
  num: 18,
  title: "La revue de code : lire pour améliorer",
  subtitle: "Quatre yeux valent mieux que deux : l'outil qualité le plus efficace tient en une lecture attentive.",
  theory: `
<h3>1. Pourquoi faire relire son code</h3>
<p>La <strong>revue de code</strong> (code review) : avant d'intégrer un changement, un autre développeur le lit et le commente. Trois gains mesurés partout : des <strong>bugs attrapés</strong> avant la production (le relecteur voit le cas limite que l'auteur, le nez dans le guidon, a raté), du <strong>savoir partagé</strong> (au moins deux personnes connaissent chaque coin du projet — plus de « seul Karim comprend les tarifs »), et une <strong>cohérence</strong> d'ensemble (les conventions se diffusent en pratiquant). Concrètement, la revue vit dans une <strong>pull request</strong> : une demande d'intégrer ta branche, avec le diff, une discussion ligne par ligne — le cours CI/CD &amp; Git avancé lui consacre une leçon entière ; ici on apprend le contenu : quoi chercher, comment le dire.</p>

<h3>2. Quoi chercher : le fond, pas la forme</h3>
<p>Depuis la leçon 17, la machine gère la forme : si black et flake8 sont passés, <strong>ne commente jamais une virgule</strong>. L'énergie du relecteur va à ce que seuls les humains voient, dans cet ordre :</p>
<pre class="pseudo">1. CORRECTION  : le code fait-il ce que la PR annonce ?
                 cas limites ? erreurs gerees ? (lecons 4, 10)
2. TESTS       : chaque comportement nouveau a-t-il son test ?
                 les tests testent-ils vraiment ? (asserts presents ?)
3. CONCEPTION  : bon etage de la pyramide ? duplication ?
                 nommage honnete ? fonction a rallonge ?
4. LISIBILITE  : comprendrai-je ce code dans 6 mois ?</pre>
<p>Le réflexe du cours entier s'applique : <strong>commence par lire les tests</strong> de la PR. Ils racontent ce que le code prétend faire — et leurs trous (pas de cas d'erreur ? pas de limite de palier ?) sont tes premiers commentaires.</p>

<h3>3. Comment commenter : sur le code, jamais sur la personne</h3>
<p>Un commentaire de revue s'adresse au <strong>code</strong>, pas à son auteur, et il <strong>pose souvent une question</strong> plutôt qu'il n'assène :</p>
<pre class="pseudo">Mauvais : « C'est faux. Tu n'as pas pense aux retards. »
Bon     : « Que renvoie frais_de_retard si jours est negatif ?
            Un cas parametrize 'retour en avance' couvrirait ca. »

Mauvais : « Renomme. »
Bon     : « 'data' est tres generique — 'locations_actives'
            dirait ce que contient la liste. »</pre>
<p>Convention utile : préfixer <code>nit:</code> (<em>nitpick</em>, broutille) les remarques non bloquantes — « nit: une f-string serait plus lisible ici ». L'auteur sait ce qui doit être corrigé et ce qui est une suggestion. Et quand la PR est bonne, <strong>dis-le</strong> : un « joli découpage, le tableau de cas se lit tout seul » enseigne autant qu'une critique.</p>

<h3>4. Côté auteur : préparer sa PR pour être bien relu</h3>
<p>La qualité d'une revue se joue à moitié côté auteur. <strong>Petite PR</strong> : au-delà de 400 lignes environ, l'attention du relecteur s'effondre et tout finit approuvé d'un « LGTM » distrait — découpe en plusieurs PR. <strong>Description honnête</strong> : le pourquoi, le comment, comment tester. <strong>Auto-revue</strong> : relis ton propre diff avant de demander la revue — tu attraperas la moitié des remarques toi-même. Et la règle d'or émotionnelle : <strong>les commentaires visent le code</strong> ; une remarque sur ta PR n'est pas une remarque sur toi.</p>

<h3>5. La revue dans la chaîne qualité</h3>
<p>La revue arrive en <strong>dernier filtre humain</strong>, après les filets automatiques : les tests passent (leçons 1-16), lint et format sont verts (leçon 17), la couverture n'a pas reculé (leçon 14) — c'est la CI qui vérifie tout ça sur chaque PR, comme tu le verras au cours CI/CD. Le relecteur ne perd donc plus une minute sur ce que la machine sait faire : il lit le design, les cas limites, les tests. En une ligne : GitHub, GitLab et Bitbucket offrent tous le même trio — diff, commentaires ligne à ligne, approbation requise avant fusion.</p>
<div class="warn">La PR de 1500 lignes qui mélange reformatage, refactoring et nouvelle fonctionnalité est <strong>irrelisable</strong> : elle récoltera un « LGTM » de découragement, et les bugs passeront. Une PR = une intention, comme un commit (cours Git) : la taille est LE facteur numéro un de qualité d'une revue.</div>
<div class="tip">Relecteur débutant, adopte la check-list en 4 points de la section 2 et commence TOUJOURS par les tests de la PR. Si tu ne trouves rien à dire, dis au moins ce qui est bien fait — c'est aussi de l'information.</div>`,
  exercises: [
    { type: "qcm", q: "Les trois gains majeurs de la revue de code :", opts: ["Bugs attrapés tôt, savoir partagé, cohérence du projet", "Vitesse, compilation, déploiement", "Moins de commits, moins de branches, moins de tests", "Compilation, déploiement, monitoring"], a: 0, exp: "Le relecteur voit ce que l'auteur, le nez dans le guidon, ne voit plus." },
    { type: "qcm", q: "La revue de code vit concrètement dans…", opts: ["Un e-mail", "Une pull request : diff + discussion ligne par ligne", "Un appel téléphonique", "Le README"], a: 1, exp: "Le mécanisme Git de la PR est détaillé au cours CI/CD et Git avancé." },
    { type: "qcm", q: "Si black et flake8 sont passés, le relecteur…", opts: ["Vérifie quand même les virgules", "Ne commente jamais la forme : son énergie va au fond", "Reformate à la main", "Refuse la PR"], a: 1, exp: "La machine gère la forme (leçon 17) ; l'humain lit design, cas limites, tests." },
    { type: "qcm", q: "Par quoi commencer la lecture d'une PR ?", opts: ["Le nom de la branche", "Les tests : ils racontent ce que le code prétend faire", "Le dernier fichier", "Les images"], a: 1, exp: "Leurs trous (pas de cas d'erreur ?) sont tes premiers commentaires." },
    { type: "qcm", q: "Le meilleur commentaire pour un cas limite manquant :", opts: ["« C'est faux, refais »", "« Que renvoie frais_de_retard si jours est négatif ? Un cas parametrize couvrirait ça »", "« Bof »", "« Je n'aurais pas fait comme ça »"], a: 1, exp: "Une question précise, sur le code, avec une piste actionnable." },
    { type: "input", q: "Le préfixe conventionnel des remarques non bloquantes (broutilles) :", a: ["nit", "nit:", "nitpick"], ph: "préfixe…", exp: "nit: — l'auteur distingue le bloquant de la suggestion." },
    { type: "vf", q: "Un bon relecteur signale aussi ce qui est bien fait.", a: true, exp: "« Joli découpage » enseigne autant qu'une critique — et se lit mieux." },
    { type: "qcm", q: "Au-delà d'environ 400 lignes de diff…", opts: ["La revue devient plus précise", "L'attention s'effondre et tout finit approuvé d'un LGTM distrait", "GitHub refuse la PR", "Les tests s'arrêtent"], a: 1, exp: "La taille est LE facteur numéro un de qualité d'une revue : découpe." },
    { type: "qcm", q: "L'auto-revue, c'est…", opts: ["Relire son propre diff avant de demander la revue", "S'approuver soi-même", "Un outil payant", "Une option de pytest"], a: 0, exp: "Tu attrapes la moitié des remarques toi-même — respect du temps du relecteur." },
    { type: "vf", q: "Un commentaire sur ta PR est une attaque personnelle.", a: false, exp: "Les commentaires visent le code, jamais la personne — dans les deux sens." },
    { type: "qcm", q: "Que vérifie la machine (CI) AVANT que l'humain ne relise ?", opts: ["Le design et le nommage", "Tests verts, lint, format, couverture", "L'humour des commentaires", "Rien"], a: 1, exp: "Le relecteur ne perd plus une minute sur ce que la machine sait faire." },
    { type: "qcm", q: "Une PR qui mélange reformatage, refactoring et fonctionnalité :", opts: ["Est idéale : tout d'un coup", "Est irrelisable : une PR = une intention", "Passe plus vite en revue", "Est obligatoire le vendredi"], a: 1, exp: "Même discipline qu'un commit : une intention à la fois (cours Git)." },
    { type: "qcm", q: "Dans la check-list du relecteur, la question de conception :", opts: ["« Le fichier est-il bien indenté ? »", "« Bon étage de la pyramide ? duplication ? nommage honnête ? »", "« Combien de lignes ? »", "« Qui est l'auteur ? »"], a: 1, exp: "Après correction et tests : le design, ce que seul un humain évalue." },
    { type: "vf", q: "GitHub, GitLab et Bitbucket offrent tous le même mécanisme de revue : diff, commentaires ligne à ligne, approbation.", a: true, exp: "L'outil change, la pratique est universelle." },
    { type: "input", q: "L'acronyme du « approuvé distraitement » qui sanctionne les PR trop grosses :", a: ["LGTM", "lgtm"], ph: "quatre lettres…", exp: "Looks Good To Me — le symptôme d'une revue qui n'a pas eu lieu." }
  ],
  final: {
    title: "Exercice final — Relecteur d'un jour",
    intro: `<p>La PR « Ajout de la remise fidélité » arrive : 180 lignes, tests inclus, CI verte. À toi de la relire.</p>`,
    questions: [
      { type: "qcm", q: "La CI est verte (tests, lint, format, couverture). Ton rôle de relecteur :", opts: ["Approuver sans lire", "Lire le fond : correction, tests, conception, lisibilité", "Vérifier les espaces", "Relancer les tests à la main"], a: 1, exp: "La machine a fait sa part ; à l'humain le design et les cas limites." },
      { type: "qcm", q: "Tu remarques que les tests de la remise ne couvrent pas le palier d'ancienneté pile à 1 an. Ton commentaire :", opts: ["« Tests insuffisants. »", "« Que se passe-t-il pile à 1 an d'ancienneté ? Une ligne parametrize sur la limite verrouillerait le palier. »", "« LGTM »", "Rien, ce n'est pas ton code"], a: 1, exp: "Question précise + piste concrète : le commentaire qui améliore." },
      { type: "vf", q: "« nit: f-string plus lisible ici » signale une remarque bloquante.", a: false, exp: "nit: = broutille, suggestion non bloquante par convention." },
      { type: "qcm", q: "La même fonctionnalité arrivait en une PR de 1500 lignes mêlant trois intentions. La bonne réaction :", opts: ["La relire en diagonale", "Demander à l'auteur de la découper : une PR = une intention", "L'approuver pour aller vite", "La fermer sans explication"], a: 1, exp: "Une grosse PR mal relue coûte plus cher que trois petites bien relues." },
      { type: "input", q: "Le document Git où se déroulent diff, commentaires et approbation : la pull …", a: ["request", "pull request"], ph: "un mot…", exp: "La pull request — mécanique détaillée au cours CI/CD et Git avancé." }
    ],
    solution: `<pre class="pseudo">Pourquoi : bugs attrapes tot + savoir partage + coherence
Quoi     : 1 correction (cas limites)  2 tests (presents ? honnetes ?)
           3 conception (etage, duplication, noms)  4 lisibilite
           — JAMAIS la forme : black et flake8 l'ont deja faite
Comment  : questions precises, sur le code, jamais la personne
           nit: pour les broutilles — et dire aussi ce qui est bien
Auteur   : PR petite (une intention), description, auto-revue
Chaine   : CI d'abord (tests, lint, couverture) → humain ensuite</pre>
<p>Tu sais lire le code des autres pour l'améliorer. Prochaine leçon : modifier le tien sans trembler — refactorer avec les tests comme filet.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l18", title: "Ta première vraie revue", level: 3,
    statement: "Voici l'essentiel d'une PR reçue sur la Ludothèque : def calc(d, m): res = d.prix_jour * m; if m > 7: res = res * 0.9; return res — accompagnée d'UN test : def test_calc(): assert calc(jeu, 8) > 0 — CI verte, couverture de la fonction 100 pour cent. Rédige ta revue complète : au moins quatre commentaires formulés comme tu les posterais réellement (question + piste), en balayant la check-list (correction — compare avec la règle officielle « remise À PARTIR de 7 jours » —, tests, conception/nommage, lisibilité), en distinguant le bloquant du nit:, et en terminant par une phrase positive sincère. Précise aussi pourquoi la couverture à 100 pour cent ne t'a pas rassuré.",
    hints: [
      "Compare m > 7 à la règle « à partir de 7 jours » : que se passe-t-il pile à 7 ? C'est un bug de palier — leçon 12.",
      "assert calc(jeu, 8) > 0 est un assert faible (leçon 14) : quelle valeur exacte attendrait un vrai test ?",
      "calc, d, m : que diraient des noms honnêtes ? Et où irait ce commentaire, bloquant ou nit ?"
    ],
    checklist: ["Postes-tu au moins quatre commentaires en « question + piste », couvrant correction, tests, conception/nommage et lisibilité ?", "Compares-tu le code à la règle officielle (remise À PARTIR de 7 jours) pour repérer le bug de bordure ?", "Distingues-tu le bloquant du nit:, et termines-tu par une remarque positive sincère ?", "Expliques-tu pourquoi la couverture à 100 % (un seul assert > 0) ne te rassure pas ?"],
    solution: "Commentaire 1 — CORRECTION (bloquant) :\n« La règle annonce la remise À PARTIR de 7 jours, or m > 7\nl'exclut à 7 pile (7 x 2.00 = 14.00 au lieu de 12.60).\nUn cas parametrize (7, 12.60) verrouillerait le palier. »\n\nCommentaire 2 — TESTS (bloquant) :\n« assert calc(jeu, 8) > 0 passerait même si la remise\ndisparaissait : peux-tu asserter la valeur exacte (14.40) et\najouter les cas 1, 6, 7 jours ? La couverture affiche 100 %\nmais elle mesure l'exécution, pas la vérification. »\n\nCommentaire 3 — CONCEPTION (bloquant léger) :\n« calc(d, m) : calcul_prix_location(jeu, jours) dirait le\nmétier — dans six mois, m sera un mystère. »\n\nCommentaire 4 — LISIBILITÉ (nit) :\n« nit: 0.9 mérite un nom (REMISE_DUREE = 0.90) pour relier\nle code au barème affiché en magasin. »\n\nPositif : « Merci pour la PR compacte et la CI verte — la\nfonction est au bon étage de la pyramide, pur calcul sans\ndépendance, facile à tester. »\n\nPourquoi le 100 % ne rassure pas : un seul assert, faible\n(> 0), aucun cas de palier — exécuté n'est pas vérifié.",
    note: "Tu viens d'utiliser TOUT le cours dans une seule revue : paliers (l4, l12), asserts honnêtes (l3), couverture menteuse (l14), nommage et pyramide (l5, l8). C'est exactement ça, relire du code. Au cours CI/CD, tu posteras ces commentaires dans de vraies pull requests, avec la CI en première ligne de défense." }
  ]
};
