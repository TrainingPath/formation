<script>
var DAY = {
  num: 5,
  title: "Organiser ses tests : fichiers, nommage, indépendance",
  subtitle: "Une suite qui grossit sans plan devient un grenier : range avant que ça déborde.",
  theory: `
<h3>1. Le dossier tests/, miroir du code</h3>
<p>Un <strong>module</strong> est simplement un fichier de code Python (un fichier <code>.py</code>). Convention simple et universelle : un dossier <code>tests/</code> à la racine, qui <strong>reflète</strong> la structure du code. Chaque module a son fichier de tests — on sait toujours où chercher, et où ajouter. Le schéma ci-dessous est une arborescence de dossiers (les <code>│ ├ └</code> dessinent l'emboîtement) ; <code>→</code> se lit « est testé par ».</p>
<pre class="pseudo">ludotheque/
├── ludo/
│   ├── tarifs.py         → tests/test_tarifs.py       (le module tarifs a son fichier de tests)
│   ├── catalogue.py      → tests/test_catalogue.py    (le module catalogue a le sien)
│   └── location.py       → tests/test_location.py     (le module location aussi)
└── tests/
    ├── test_tarifs.py                                 (contient les tests de tarifs.py)
    ├── test_catalogue.py                              (contient les tests de catalogue.py)
    └── test_location.py                               (contient les tests de location.py)</pre>

<h3>2. Le nommage : test_quoi_condition_resultat</h3>
<p>On systématise la leçon 2 : <strong>quoi</strong> (la fonction ou la règle), <strong>condition</strong> (le contexte), <strong>résultat</strong> (l'attendu). <code>test_prix_location_7_jours_applique_le_tarif_degressif</code>, <code>test_location_refusee_si_jeu_deja_loue</code>. Avec <code>pytest -v</code>, la suite se lit alors comme le cahier des charges de la Ludothèque.</p>

<h3>3. L'indépendance : seul, et dans n'importe quel ordre</h3>
<p>Le I de FIRST (Independent) devient une règle d'or : <strong>chaque test doit passer seul</strong> (<code>pytest -k un_seul_test</code>) <strong>et dans n'importe quel ordre</strong>. Un test qui dépend du passage d'un autre est une bombe : le jour où l'ordre change — parallélisation, filtre <code>-k</code>, nouveau fichier — il explose sans raison apparente.</p>

<h3>4. Le piège : l'état partagé et les tests flaky</h3>
<p>L'ennemi n° 1 de l'indépendance est <strong>l'état partagé</strong> : une donnée que plusieurs tests se passent sans le vouloir — une variable de module, une base de données modifiée, un fichier laissé derrière soi. Un <strong>objet</strong> (comme <code>Catalogue()</code>) est une « chose » du programme qui garde des données en mémoire ; s'il est créé une seule fois pour tous les tests, ils se marchent dessus.</p>
<pre class="pseudo"># DANGER : etat partage au niveau du module         # commentaire d'avertissement (ignore par Python)
catalogue = Catalogue()                             # UN SEUL catalogue cree ici, partage par TOUS les tests du fichier

def test_ajout_augmente_le_compte():                # test A : ajouter un jeu augmente le compte
    catalogue.ajouter(Jeu(titre="Catan"))           # ajoute "Catan" dans le catalogue PARTAGE (il n'est plus vide !)
    assert catalogue.taille() == 1                  # on verifie qu'il contient bien 1 jeu

def test_catalogue_neuf_est_vide():                 # test B : un catalogue neuf devrait etre vide
    assert catalogue.taille() == 0    # rouge si le test A est passe AVANT (le catalogue contient deja Catan)</pre>
<p>Selon l'ordre d'exécution, le second test passe ou casse : on dit qu'il est <strong>flaky</strong> (instable). Un test flaky détruit la confiance — on finit par ignorer le rouge, et le filet ne protège plus rien. Remède : chaque test <strong>construit son propre état</strong> et ne laisse aucune trace.</p>

<h3>5. Grouper avec des classes, partager avec conftest.py</h3>
<p>Une <strong>classe</strong> est un regroupement nommé de fonctions ; ici, on s'en sert comme d'un simple tiroir pour ranger les tests liés (leur nom commence par <code>Test</code>). Le mot <code>self</code> (« soi-même ») est un paramètre imposé par la syntaxe des méthodes rangées dans une classe : on le met sans avoir à s'en soucier ici.</p>
<pre class="pseudo">class TestFraisRetard:                          # une CLASSE = un tiroir qui regroupe des tests lies (pas d'heritage ici)
    def test_retard_nul_ne_coute_rien(self):    # test range dans le tiroir ; "self" est exige par la syntaxe
        assert calcul_frais_retard(0) == 0      # 0 jour de retard => 0 euro a payer

    def test_frais_plafonnes_a_15_euros(self):  # second test du meme tiroir
        assert calcul_frais_retard(40) == 15    # 40 jours de retard => plafonne a 15 euros</pre>
<p>Et pytest reconnaît un fichier spécial, <code>conftest.py</code>, où l'on placera ce qui est <strong>partagé</strong> entre fichiers de tests — on l'ouvrira en grand à la leçon 6 avec les fixtures. C'est l'équivalent d'esprit des classes de base de tests en JUnit ou PHPUnit.</p>
<div class="warn">Un test flaky est pire qu'un test rouge : à force de le relancer « jusqu'à ce que ça passe », l'équipe apprend à ignorer les échecs — et le vrai bug passera par le même trou.</div>
<div class="tip">Vérifie l'indépendance à peu de frais : lance un test isolé avec <code>-k</code>, puis la suite complète. Si un résultat change selon le contexte, tu tiens un état partagé à éliminer.</div>`,
  exercises: [
    { type: "qcm", q: "La convention d'organisation des tests :", opts: ["Un dossier tests/ qui reflète la structure du code", "Les tests au milieu du code métier", "Un seul fichier géant test_tout.py", "Des tests dans le README"], a: 0, exp: "Miroir du code : on sait toujours où chercher." },
    { type: "input", q: "ludo/tarifs.py est testé par quel fichier (chemin compris) ?", a: ["tests/test_tarifs.py", "test_tarifs.py"], ph: "chemin du fichier", exp: "Le miroir : un module, un fichier de tests." },
    { type: "qcm", q: "Le format de nommage systématisé dans cette leçon :", opts: ["test_numero_auteur_date", "test_quoi_condition_resultat", "quoi_test_condition", "TestQuoiCamelCase"], a: 1, exp: "Avec pytest -v, la suite se lit comme un cahier des charges." },
    { type: "qcm", q: "test_location_refusee_si_jeu_deja_loue : la « condition » du nom est…", opts: ["test", "location", "si_jeu_deja_loue", "refusee"], a: 2, exp: "Quoi : la location ; condition : jeu déjà loué ; résultat : refusée." },
    { type: "vf", q: "Un test peut compter sur le fait qu'un autre test s'exécute avant lui.", a: false, exp: "Règle d'or : chaque test passe seul et dans n'importe quel ordre." },
    { type: "qcm", q: "Pourquoi l'ordre d'exécution des tests peut-il changer un jour ?", opts: ["Il ne change jamais", "Parallélisation, filtre -k, ajout de fichiers…", "Uniquement si on change d'ordinateur", "Uniquement si on met à jour Python"], a: 1, exp: "Le jour où l'ordre bouge, les tests dépendants explosent." },
    { type: "input", q: "Comment appelle-t-on un test instable, qui passe ou casse selon les exécutions ?", a: ["flaky", "flaky test", "test flaky"], ph: "adjectif anglais", exp: "L'ennemi de la confiance : on finit par ignorer le rouge." },
    { type: "qcm", q: "L'ennemi numéro 1 de l'indépendance des tests :", opts: ["Les noms trop longs", "Les commentaires", "Le trop grand nombre de fichiers", "L'état partagé (variable de module, base modifiée…)"], a: 3, exp: "Chaque test doit construire son propre état et ne rien laisser derrière." },
    { type: "qcm", q: "Dans l'exemple du catalogue partagé, test_catalogue_neuf_est_vide casse quand…", opts: ["Il s'exécute après le test qui ajoute Catan", "Il s'exécute en premier", "Le catalogue est trop grand", "pytest est en mode -v"], a: 0, exp: "L'autre test a laissé un jeu dans le catalogue partagé : flaky." },
    { type: "qcm", q: "Le remède à l'état partagé :", opts: ["Relancer jusqu'à ce que ça passe", "Chaque test construit son propre état et ne laisse aucune trace", "Trier les tests par ordre alphabétique", "Supprimer le test instable"], a: 1, exp: "La leçon 6 (fixtures) rendra cela élégant et sans duplication." },
    { type: "vf", q: "Relancer un test flaky « jusqu'à ce que ça passe » est une solution acceptable.", a: false, exp: "C'est apprendre à ignorer le rouge : le vrai bug passera par le même trou." },
    { type: "qcm", q: "Pour grouper des tests liés dans un fichier, pytest reconnaît…", opts: ["Les fonctions imbriquées", "Les modules zippés", "Les classes dont le nom commence par Test", "Les dossiers cachés"], a: 2, exp: "Un simple tiroir de rangement : pas d'héritage nécessaire." },
    { type: "input", q: "Le fichier spécial de pytest où l'on place ce qui est partagé entre fichiers de tests :", a: ["conftest.py", "conftest"], ph: "nom du fichier", exp: "Ouvert en grand à la leçon 6, avec les fixtures." },
    { type: "qcm", q: "Une suite bien nommée lancée avec pytest -v ressemble à…", opts: ["Une liste de numéros", "Un fichier binaire", "Le cahier des charges lisible de la Ludothèque", "Un log réseau"], a: 2, exp: "Chaque nom raconte une règle : documentation exécutable." },
    { type: "vf", q: "Vérifier l'indépendance peut se faire en lançant un test seul avec -k puis dans la suite complète.", a: true, exp: "Résultat différent selon le contexte = état partagé à éliminer." }
  ],
  final: {
    title: "Exercice final — La suite bien rangée",
    intro: `<p>Structure, noms, indépendance : l'hygiène qui permet à la suite de grandir.</p>`,
    questions: [
      { type: "qcm", q: "Le dossier tests/ doit…", opts: ["Refléter la structure du code (un module → un fichier de tests)", "Être caché", "Contenir un seul fichier", "Vivre dans un autre dépôt"], a: 0, exp: "ludo/tarifs.py → tests/test_tarifs.py." },
      { type: "qcm", q: "Un test flaky est un test qui…", opts: ["Échoue toujours", "Passe ou casse selon les exécutions, sans changement du code", "Est trop lent", "N'a pas de nom"], a: 1, exp: "Souvent causé par un état partagé ou une dépendance d'ordre." },
      { type: "vf", q: "Chaque test doit passer seul ET dans n'importe quel ordre.", a: true, exp: "Le I de FIRST, devenu règle d'or de l'organisation." },
      { type: "qcm", q: "Une variable de module modifiée par un test est…", opts: ["Une bonne optimisation", "Obligatoire avec pytest", "Un état partagé, source de tests flaky", "Sans effet sur les autres tests"], a: 2, exp: "Chaque test construit son propre état, sans trace laissée." },
      { type: "input", q: "Le préfixe des classes de regroupement reconnues par pytest :", a: ["Test", "Test*"], ph: "préfixe", exp: "class TestFraisRetard: — un tiroir, pas un héritage." }
    ],
    solution: `<pre class="pseudo">Structure : tests/ miroir du code → ludo/tarifs.py ↔ tests/test_tarifs.py
Nommage   : test_quoi_condition_resultat → la suite = cahier des charges
Regle d'or: chaque test passe SEUL et dans N'IMPORTE QUEL ordre
Piege     : etat partage (variable de module, base) → tests flaky
Rangement : classes Test* pour grouper, conftest.py pour partager

Flaky = pire que rouge : on apprend a ignorer les echecs.</pre>
<p>La maison est rangée, mais chaque test duplique encore sa préparation. La suite : « Les fixtures : préparer et nettoyer le terrain » — pytest va faire le ménage pour toi.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  ]
};
