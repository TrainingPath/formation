<script>
var DAY = {
  num: 3,
  title: "pytest : premiers tests, premières assertions",
  subtitle: "Un pip install, une convention de nommage, un assert : ta première suite tourne.",
  theory: `
<h3>1. Installer pytest</h3>
<p>Deux mots d'abord. Un <strong>paquet</strong> (ou « bibliothèque ») est du code tout prêt écrit par d'autres, qu'on ajoute à son projet. <strong>pip</strong> est l'outil qui télécharge et installe ces paquets pour Python — comme un magasin d'applications en ligne de commande. Un <strong>venv</strong> (« environnement virtuel ») est un dossier isolé qui contient les paquets d'un seul projet, pour ne pas mélanger les versions entre projets. Le <code>$</code> en début de ligne représente l'invite du terminal : il ne se tape pas, il indique juste « ici commence une commande ».</p>
<pre class="pseudo">$ pip install pytest    # pip = magasin de paquets Python : telecharge et installe la bibliotheque "pytest"
$ pytest --version      # verifier que pytest est bien installe en affichant sa version
pytest 8.x              # reponse affichee par la commande : la version installee</pre>

<h3>2. Les conventions de découverte</h3>
<p>pytest ne demande aucune configuration : il <strong>découvre</strong> tes tests par convention. Les fichiers nommés <code>test_*.py</code> (ou <code>*_test.py</code>) sont scannés ; dedans, toute fonction <code>test_*</code> devient un test. Pas de classe obligatoire, pas d'héritage, pas d'enregistrement : tu nommes bien, pytest trouve tout. Le mot-clé <code>from ... import ...</code> sert à <strong>importer</strong> une fonction, c'est-à-dire aller la chercher dans un autre fichier pour pouvoir l'utiliser ici.</p>
<pre class="pseudo"># fichier : tests/test_tarifs.py                       # commentaire : rappelle le chemin du fichier (ignore par Python)
from ludo.tarifs import calcul_prix_location           # IMPORTER la fonction a tester depuis le module ludo/tarifs.py

def test_prix_3_jours_tarif_plein():                   # 1er test ; le nom decrit le comportement verifie
    assert calcul_prix_location(3) == 9                # on affirme : 3 jours doivent couter 9 euros (3 x 3)

def test_prix_location_applique_le_tarif_degressif():  # 2e test : le tarif degressif au-dela de 5 jours
    assert calcul_prix_location(7) == 19               # on affirme : 7 jours doivent couter 19 euros (5x3 + 2x2)</pre>

<h3>3. L'assert nu et l'introspection</h3>
<p>Là où JUnit exige <code>assertEquals(19, prix)</code>, xUnit <code>Assert.Equal(19, prix)</code> et PHPUnit <code>assertSame(19, $prix)</code>, pytest se contente du <strong>assert nu</strong> de Python (le simple mot <code>assert</code>, sans fonction spéciale). Sa botte secrète : <strong>l'introspection</strong> — la capacité de l'outil à examiner ton code au moment de l'échec. Quand un assert échoue, pytest réécrit l'expression et affiche <strong>les valeurs comparées</strong> — pas juste « faux ».</p>

<h3>4. Lancer les tests</h3>
<pre class="pseudo">$ pytest                          # decouvre et lance TOUS les tests trouves
$ pytest -v                       # -v (verbose) : affiche un nom de test par ligne
$ pytest tests/test_tarifs.py     # ne lancer qu'UN seul fichier (on donne son chemin)
$ pytest -k degressif             # ne lancer que les tests dont le nom contient "degressif"</pre>
<p><code>-v</code> transforme la suite en spécification lisible ; <code>-k</code> est ton ami quand tu travailles sur un seul comportement.</p>

<h3>5. Lire un échec</h3>
<p>Imaginons le bug de la leçon 1 encore présent. Ci-dessous, ce n'est pas du code à écrire mais le <strong>rapport affiché par pytest</strong> ; chaque symbole a un sens, détaillé juste après.</p>
<pre class="pseudo">$ pytest
tests/test_tarifs.py .F                                        [100%]

    def test_prix_location_applique_le_tarif_degressif():
&gt;       assert calcul_prix_location(7) == 19
E       assert 21 == 19

tests/test_tarifs.py:8: AssertionError
1 failed, 1 passed in 0.03s</pre>
<p>Tout y est : le <strong>F</strong> dans la ligne de progression (un point <code>.</code> = un test vert, un <code>F</code> = un échec), le <strong>nom</strong> du test fautif, la ligne <code>&gt;</code> qui pointe l'assert exact, la ligne <code>E</code> qui donne le <strong>diff des valeurs</strong> (obtenu 21, attendu 19), et enfin le fichier et la <strong>ligne exacte</strong> (<code>:8</code>). Le tarif dégressif n'est pas appliqué — diagnostic immédiat, sans débogueur.</p>
<div class="warn">Si pytest affiche « collected 0 items », il n'a rien trouvé : vérifie les conventions — fichier <code>test_*.py</code>, fonctions <code>test_*</code>. Un fichier <code>tarifs_tests.py</code> est invisible pour lui.</div>
<div class="tip">Lance <code>pytest</code> après CHAQUE petite modification, pas une fois par jour : plus le feu rouge arrive tôt, plus le suspect est facile à identifier — c'est le réflexe que le pipeline CI/CD automatisera.</div>`,
  exercises: [
    { type: "input", q: "La commande pour installer pytest :", a: ["pip install pytest"], ph: "commande complète", exp: "Un paquet Python comme un autre, de préférence dans le venv." },
    { type: "qcm", q: "pytest découvre automatiquement les fichiers nommés…", opts: ["tests.py uniquement", "test_*.py (ou *_test.py)", "N'importe quel .py", "pytest.py"], a: 1, exp: "La convention de découverte : bien nommer suffit." },
    { type: "qcm", q: "Dans un fichier découvert, deviennent des tests…", opts: ["Toutes les fonctions", "Les fonctions marquées d'un décorateur @test", "Les fonctions dont le nom commence par test_", "Les fonctions documentées"], a: 2, exp: "Pas de décorateur ni d'enregistrement : le nom suffit." },
    { type: "vf", q: "Il faut hériter d'une classe spéciale pour écrire un test pytest.", a: false, exp: "De simples fonctions test_* suffisent — contrairement au vieux style unittest." },
    { type: "qcm", q: "Pour vérifier une valeur, pytest utilise…", opts: ["check(prix, 19)", "expect(prix).toBe(19)", "assertEquals(19, prix)", "L'assert nu de Python : assert prix == 19"], a: 3, exp: "assertEquals, c'est JUnit ; Assert.Equal, xUnit ; assertSame, PHPUnit." },
    { type: "qcm", q: "L'« introspection » de pytest signifie que sur un échec, il affiche…", opts: ["Les valeurs réellement comparées", "Le temps d'exécution du test", "Uniquement « AssertionError »", "Le code entier du projet"], a: 0, exp: "assert 21 == 19 : obtenu et attendu, sans effort." },
    { type: "input", q: "L'option de pytest qui affiche un nom de test par ligne (mode verbose) :", a: ["-v", "--verbose"], ph: "option", exp: "pytest -v : la suite devient une spécification lisible." },
    { type: "qcm", q: "Pour lancer uniquement les tests dont le nom contient « degressif » :", opts: ["pytest --only degressif", "pytest -k degressif", "pytest -v degressif", "pytest --grep degressif"], a: 1, exp: "-k filtre par mot-clé dans le nom." },
    { type: "qcm", q: "Pour lancer un seul fichier de tests :", opts: ["pytest tests/test_tarifs.py", "pytest --file test_tarifs", "python test_tarifs.py --test", "pytest -k tests/"], a: 0, exp: "On passe simplement le chemin du fichier." },
    { type: "qcm", q: "Dans la ligne de progression « .F », le F signifie…", opts: ["Fast : test rapide", "Un test a échoué (Failed)", "Fichier introuvable", "Fin de la suite"], a: 1, exp: "Un point = un test vert, un F = un échec." },
    { type: "qcm", q: "« E  assert 21 == 19 » te dit que…", opts: ["Le test attendait 21", "La fonction a retourné 21 alors que le test attendait 19", "Il manque 2 tests", "La ligne 21 est fausse"], a: 1, exp: "Obtenu à gauche, attendu à droite : le tarif dégressif manque." },
    { type: "vf", q: "« collected 0 items » signifie que tous les tests sont passés.", a: false, exp: "pytest n'a RIEN trouvé : vérifie les conventions de nommage." },
    { type: "qcm", q: "L'équivalent JUnit pour marquer une méthode de test en Java :", opts: ["[Fact]", "@Test", "def test_", "dataProvider"], a: 1, exp: "[Fact] c'est xUnit en C# ; test_* c'est pytest." },
    { type: "input", q: "La commande la plus simple pour découvrir et lancer toute la suite :", a: ["pytest"], ph: "commande", exp: "Tout court : découverte automatique par convention." },
    { type: "vf", q: "Un rapport d'échec pytest indique le fichier et la ligne exacte de l'assert qui a échoué.", a: true, exp: "tests/test_tarifs.py:8 : diagnostic sans débogueur." }
  ],
  final: {
    title: "Exercice final — La machine est lancée",
    intro: `<p>Installation, conventions, lancement, lecture d'échec : le cycle complet.</p>`,
    questions: [
      { type: "input", q: "La commande qui installe le framework de tests du cours :", a: ["pip install pytest"], ph: "commande complète", exp: "Puis pytest --version pour vérifier." },
      { type: "qcm", q: "Quel fichier sera découvert par pytest ?", opts: ["tarifs.py", "mes_tests.txt", "test_tarifs.py", "tarifs_a_tester.py"], a: 2, exp: "Préfixe test_ sur le fichier ET sur les fonctions." },
      { type: "qcm", q: "Grâce à l'introspection, un échec affiche…", opts: ["Les valeurs comparées et la ligne fautive", "Un simple code d'erreur 1", "Le nom de l'auteur du bug", "La pile réseau"], a: 0, exp: "assert 21 == 19 à la ligne 8 : tout le diagnostic." },
      { type: "vf", q: "pytest -k mot lance seulement les tests dont le nom contient ce mot.", a: true, exp: "Idéal pour travailler sur un seul comportement." },
      { type: "qcm", q: "assertSame est l'assertion typique de…", opts: ["pytest", "JUnit", "xUnit", "PHPUnit"], a: 3, exp: "JUnit : assertEquals ; xUnit : Assert.Equal ; pytest : assert nu." }
    ],
    solution: `<pre class="pseudo">Installer  : pip install pytest      (puis pytest --version)
Convention : fichiers test_*.py, fonctions test_*
Assertion  : assert nu + introspection (les valeurs comparees s'affichent)
Lancer     : pytest | pytest -v | pytest tests/test_tarifs.py | pytest -k mot
Lire       : F dans la progression → nom du test → ligne → assert 21 == 19

Ailleurs   : JUnit @Test/assertEquals, xUnit [Fact]/Assert.Equal,
             PHPUnit assertSame — memes idees, autre syntaxe.</pre>
<p>Ta suite tourne sur les cas heureux. La suite : « Tester les cas limites et les erreurs attendues » — là où vivent les vrais bugs.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l3", title: "Le premier fichier de tests de la Ludothèque", level: 2,
    statement: "Rédige, en texte, le contenu complet de tests/test_tarifs.py pour la Ludothèque : l'import de calcul_prix_location, puis trois tests (3 jours → 9 €, exactement 5 jours → 15 €, 7 jours → 19 €) avec des noms au format test_quoi_condition_resultat. Ajoute ensuite les trois commandes que tu taperais : installer pytest, lancer toute la suite en mode verbose, lancer uniquement les tests contenant « degressif ». Termine en expliquant en deux phrases ce que le rapport afficherait si le bug du tarif dégressif était encore présent.",
    hints: [
      "Respecte les conventions de découverte : le nom du fichier et le préfixe des fonctions ne sont pas décoratifs.",
      "Barème : 3 €/jour jusqu'à 5 jours inclus, 2 €/jour au-delà — vérifie tes valeurs attendues avant de les écrire.",
      "Pour le rapport d'échec, repense à l'introspection : quelles deux valeurs apparaîtraient dans la ligne E ?"
    ],
    atoi: { cmd: "pip install pytest\npytest -v\npytest -k degressif", expected: "$ pytest -v\ntests/test_tarifs.py::test_prix_3_jours_retourne_9 PASSED\ntests/test_tarifs.py::test_prix_5_jours_retourne_15 PASSED\ntests/test_tarifs.py::test_prix_7_jours_avec_degressif_retourne_19 PASSED\n\n3 passed in 0.02s\n\n$ pytest -k degressif\n1 passed, 2 deselected in 0.01s\n\n# Si le bug du tarif degressif etait encore la, test_prix_7_jours rougirait :\n# E   assert 21 == 19  (obtenu 21, attendu 19)." },
    checklist: ["Le fichier s'appelle-t-il test_*.py et chaque fonction commence-t-elle par test_ (découverte pytest) ?", "Tes valeurs attendues sont-elles justes : 5 jours = 15 €, 7 jours = 19 € avec le tarif dégressif ?", "Les trois commandes sont-elles exactes (installation, -v pour le mode verbose, -k degressif pour le filtre) ?", "Sais-tu quelles deux valeurs la ligne E afficherait si le bug persistait (introspection) ?"],
    solution: "# tests/test_tarifs.py\nfrom ludo.tarifs import calcul_prix_location\n\ndef test_prix_3_jours_tarif_plein():\n    assert calcul_prix_location(3) == 9\n\ndef test_prix_5_jours_borne_du_tarif_plein():\n    assert calcul_prix_location(5) == 15\n\ndef test_prix_location_applique_le_tarif_degressif():\n    assert calcul_prix_location(7) == 19\n\nCommandes :\n1. pip install pytest\n2. pytest -v\n3. pytest -k degressif\n\nSi le bug est encore là : la progression afficherait ..F, puis le\nrapport pointerait test_prix_location_applique_le_tarif_degressif\navec la ligne « E  assert 21 == 19 » — obtenu 21, attendu 19 :\nle tarif dégressif n'est jamais appliqué.",
    note: "Tu viens d'écrire ton premier vrai fichier de suite : garde-le, il grandira jusqu'à la leçon 7. Commite-le avec Git dans le même dépôt que le code (tests et code voyagent ensemble), et note que « pytest -v » est mot pour mot la commande que ton futur pipeline CI/CD exécutera à chaque push." }
  ]
};
