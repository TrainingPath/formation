<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la qualité en continu (examen)",
  subtitle: "Vingt leçons en une : l'examen final — et la passerelle vers l'automatisation.",
  theory: `
<h3>1. Semaine 1 — Écrire des tests (leçons 1 à 7)</h3>
<p>Tout part du <strong>coût du bug</strong> : plus il est détecté tard, plus il coûte — les tests sont le détecteur le plus précoce et le plus répétable. Un test se lit en trois temps, <strong>Arrange, Act, Assert</strong>, et <strong>pytest</strong> le fait vivre : fichiers <code>test_*.py</code>, fonctions <code>test_*</code>, un <code>assert</code> nu qui raconte l'échec. On teste le nominal, puis les <strong>cas limites</strong> et les <strong>erreurs attendues</strong> avec <code>pytest.raises</code>. Les tests restent <strong>indépendants</strong> et bien nommés ; les <strong>fixtures</strong> (avec <code>yield</code>, scopes, <code>conftest.py</code>) préparent et nettoient le terrain ; <code>@pytest.mark.parametrize</code> transforme dix clones en un tableau de cas — limites de palier comprises.</p>
<pre class="pseudo">def test_prix_location_trois_jours():           # Arrange : on met en place le decor du test
    jeu = Jeu(titre="Catan", prix_jour=2.50)    # on cree un jeu a 2,50 euro par jour
    prix = calcul_prix_location(jeu, jours=3)   # Act : on execute l'action testee (calcul pour 3 jours)
    assert prix == 7.50                         # Assert : on verifie le resultat attendu (3 x 2,50 = 7,50)</pre>

<h3>2. Semaine 2 — Isoler et piloter (leçons 8 à 14)</h3>
<p>La <strong>pyramide</strong> place chaque test à l'étage le plus bas qui prouve : beaucoup d'unitaires, moins d'intégration, très peu d'e2e (l'inverse = cône glacé). Les <strong>doubles de test</strong> (stub, fake, mock) et <code>unittest.mock</code> isolent l'unité — <code>patch</code> là où l'objet est <strong>utilisé</strong>, <code>return_value</code>, <code>side_effect</code> pour les pannes. Le <strong>TDD</strong> enchaîne red, green, refactor en cycles minuscules (kata du prix de location) ; le <strong>legacy</strong> s'apprivoise par tests de <strong>caractérisation</strong>, coutures et sprout method ; la <strong>couverture</strong> (coverage.py) montre les lignes jamais vues — en se rappelant que <strong>100 pour cent ≠ zéro bug</strong> : exécuté n'est pas vérifié.</p>

<h3>3. Semaine 3 — La qualité au quotidien (leçons 15 à 20)</h3>
<p>Les tests d'<strong>intégration</strong> (base jetable, <code>TestCase</code>, rollback, <code>setUpTestData</code>) prouvent ce que seule la vraie base garantit — contraintes, <code>IntegrityError</code>. Le <strong>client de test Django</strong> vérifie vues, statuts et redirections sans navigateur. Autour du code : <strong>lint et format</strong> (flake8/ruff, black, isort) confient la forme aux machines ; la <strong>revue de code</strong> concentre les humains sur le fond (correction, tests, conception, lisibilité — en petites PR) ; le <strong>refactoring</strong> améliore la structure à comportement identique, un petit pas vert et commité à la fois. La leçon 20 a tout assemblé en une stratégie : risques → étages → outils.</p>

<h3>4. Les dix réflexes à emporter</h3>
<pre class="pseudo"> 1. Un comportement = un test qui echoue s'il casse
 2. AAA : lisible en trois temps, nom qui raconte la regle
 3. Les bugs vivent aux limites : paliers, zero, vide, negatif
 4. Erreur attendue = comportement a tester (pytest.raises)
 5. Un tableau parametrize = UNE regle, limites comprises
 6. Patcher la ou l'objet est UTILISE, jamais ailleurs
 7. Code neuf : TDD. Code nu : caracteriser avant de toucher
 8. Couverture : boussole vers les trous, jamais trophee
 9. Une regle, UN etage — le plus bas qui prouve
10. Refactoring : tests verts avant, verts apres, petit pas, commit</pre>

<h3>5. Et maintenant : que tout tourne tout seul</h3>
<p>Il te reste un geste manuel : taper <code>pytest</code>. Le cours <strong>CI/CD &amp; Git avancé</strong> supprime ce geste : à chaque push, un pipeline lancera lint, format, la suite par étages et la couverture avec son <code>fail_under</code> ; les pull requests exigeront CI verte + revue avant fusion ; et le déploiement suivra. Tout ce que tu as appris ici — tests rapides et isolés, seuils honnêtes, petites PR — est exactement ce qui rend un pipeline utile plutôt que décoratif. L'examen ci-dessous balaie les vingt leçons : bonne épreuve.</p>
<div class="warn">À l'examen comme en entreprise, la réponse « ça dépend » ne suffit jamais seule : dis <strong>de quoi</strong> ça dépend. « Quel étage ? » → « le plus bas qui prouve : calcul pur = unitaire, contrainte = intégration ». C'est le raisonnement qu'on évalue, pas la récitation.</div>
<div class="tip">Avant de commencer, rejoue mentalement UNE journée type : j'écris un test rouge, du code vert, je refactore, black formate, je pousse une petite PR, la couverture n'a pas reculé, un collègue relit. Si ce film est fluide dans ta tête, tu es prêt.</div>`,
  exercises: [
    { type: "qcm", q: "(L1) Plus un bug est détecté tard…", opts: ["Moins il coûte", "Plus il coûte cher à corriger", "Plus il est drôle", "Moins il est grave"], a: 1, exp: "Les tests sont le détecteur le plus précoce et le plus répétable." },
    { type: "input", q: "(L2) Les trois temps d'un test, dans l'ordre (en anglais) :", a: ["arrange, act, assert", "arrange act assert", "arrange,act,assert"], ph: "trois mots…", exp: "Préparer, agir, vérifier — la structure de tout test lisible." },
    { type: "qcm", q: "(L3) pytest découvre les tests…", opts: ["Dans les fichiers test_*.py et les fonctions test_*", "Dans le README", "Par une base de données", "Au hasard"], a: 0, exp: "La convention de nommage EST le mécanisme de découverte." },
    { type: "qcm", q: "(L4) Vérifier qu'un titre vide lève ValueError s'écrit…", opts: ["assert ValueError", "with pytest.raises(ValueError):", "try sans except", "print(ValueError)"], a: 1, exp: "L'erreur attendue est un comportement : elle a son test dédié." },
    { type: "qcm", q: "(L6) Dans une fixture, le code après le yield…", opts: ["Ne tourne jamais", "Est le teardown, exécuté même si le test échoue", "Tourne avant le test", "Est du commentaire"], a: 1, exp: "Setup avant, nettoyage après : le terrain rendu propre." },
    { type: "qcm", q: "(L7) @pytest.mark.parametrize avec 6 tuples génère…", opts: ["1 test", "6 tests indépendants", "Une boucle", "6 fichiers"], a: 1, exp: "Chaque cas est rapporté séparément ; un rouge n'arrête pas les autres." },
    { type: "qcm", q: "(L8) La pyramide des tests :", opts: ["Beaucoup d'e2e, peu d'unitaires", "Beaucoup d'unitaires, moins d'intégration, très peu d'e2e", "Tout à égalité", "Uniquement de l'intégration"], a: 1, exp: "L'inverse s'appelle le cône glacé : lent, fragile, ignoré." },
    { type: "qcm", q: "(L9-10) Pour simuler une panne de l'API de cotation :", opts: ["side_effect = TimeoutError sur le mock", "return_value = None", "time.sleep(60)", "Débrancher le wifi"], a: 0, exp: "Le chemin d'erreur, indéclenchable en vrai, se teste à la demande." },
    { type: "vf", q: "(L10) On patche un objet là où il est défini, pas là où il est utilisé.", a: false, exp: "C'est l'inverse : ludo.tarifs.date, le nom vu par le code testé." },
    { type: "qcm", q: "(L11) L'ordre du cycle TDD :", opts: ["Green, red, refactor", "Red, green, refactor", "Refactor, red, green", "Code, test, déploiement"], a: 1, exp: "Le rouge d'abord : un test jamais vu échouer ne prouve rien." },
    { type: "qcm", q: "(L13) Face à 120 lignes sans tests à modifier, le premier geste :", opts: ["Réécrire", "Des tests de caractérisation qui gravent le comportement actuel", "Ajouter la fonctionnalité au milieu", "Formater avec black"], a: 1, exp: "Photographier l'existant, puis ouvrir des coutures — le filet avant tout." },
    { type: "vf", q: "(L14) Une couverture de 100 pour cent garantit un code sans bug.", a: false, exp: "Elle mesure l'exécution, pas la vérification : asserts faibles et cas absents lui échappent." },
    { type: "qcm", q: "(L15) La contrainte « un jeu, une seule location active » se prouve…", opts: ["Avec un mock", "En intégration : la vraie base lève IntegrityError", "En e2e uniquement", "Par un commentaire"], a: 1, exp: "Le schéma garantit, le test d'intégration vérifie." },
    { type: "qcm", q: "(L17-18) Le partage des rôles dans la chaîne qualité :", opts: ["L'humain vérifie les virgules, la machine le design", "La machine gère la forme (black, flake8) ; l'humain relit le fond en PR", "Tout à la machine", "Tout à l'humain"], a: 1, exp: "L'énergie du relecteur va aux cas limites, aux tests, à la conception." },
    { type: "qcm", q: "(L19) pytest passe au rouge en plein refactoring :", opts: ["On débogue en avant", "On annule, on revient au dernier vert, on recommence plus petit", "On commente le test", "On pousse quand même"], a: 1, exp: "Un refactoring n'a aucune urgence : le dernier vert n'est jamais loin." }
  ],
  final: {
    title: "Exercice final — L'examen : vingt leçons, cinq preuves",
    intro: `<p>Cinq questions transversales : chacune traverse plusieurs leçons. C'est ton raisonnement de testeur qu'on évalue.</p>`,
    questions: [
      { type: "qcm", q: "La règle « remise de 10 pour cent à partir de 7 jours » vient d'être codée. La couverture affiche 100 pour cent avec un unique test à 10 jours. Qu'est-ce qui manque ? (L4, L7, L14)", opts: ["Rien : 100 pour cent suffit", "Les limites du palier (6 et 7 jours) en parametrize — la couverture ne voit pas les cas absents", "Un test e2e du barème", "Un mock de la base"], a: 1, exp: "Exécuté n'est pas vérifié, et les bugs vivent aux paliers : 6 et 7 jours verrouillent la règle." },
      { type: "qcm", q: "frais_de_retard appelle date.today() et le test passe aujourd'hui mais échouera demain. Le bon remède ? (L5, L10)", opts: ["Lancer les tests toujours à la même heure", "Patcher ludo.tarifs.date (ou injecter la date) pour figer l'horloge : test reproductible", "Supprimer le test", "Attraper l'exception"], a: 1, exp: "Un test doit être répétable : l'horloge se mocke là où elle est utilisée." },
      { type: "vf", q: "Pour ajouter une règle neuve dans un fichier legacy jamais testé : je caractérise d'abord la zone, puis la règle naît en TDD dans une fonction à part (sprout), appelée par une ligne dans le vieux code. (L11, L13)", a: true, exp: "Le duo complet : filet de caractérisation pour le vieux, red-green-refactor pour le neuf." },
      { type: "input", q: "Complète la règle d'or de la pyramide : chaque comportement se teste à l'étage le plus … qui suffit à le prouver. (L8, L20)", a: ["bas"], ph: "un mot…", exp: "Calcul pur = unitaire, contrainte = intégration, parcours = e2e — sans duplication d'étage." },
      { type: "qcm", q: "Ta PR de refactoring mélange renommages ET un changement de barème, 900 lignes. Le relecteur ne peut pas la lire. La leçon complète ? (L18, L19)", opts: ["Les revues sont inutiles", "Un refactoring = comportement identique, en commits séparés de la fonctionnalité, et des PR petites : une intention à la fois", "Il faut plus de e2e", "black aurait tout réglé"], a: 1, exp: "Structure et comportement se relisent séparément — c'est ce qui rend la revue possible." }
    ],
    solution: `<pre class="pseudo">LE COURS EN UNE PAGE
Pourquoi   : un bug coute d'autant plus cher qu'il est detecte tard
Ecrire     : AAA, pytest, assert nu, noms qui racontent
Couvrir    : nominal + LIMITES + erreurs (pytest.raises)
Organiser  : tests independants, fixtures (yield, conftest.py),
             parametrize (un tableau = une regle)
Architecturer : pyramide — unitaire (masse), integration, e2e (rare)
Isoler     : stubs/fakes/mocks, patch LA OU C'EST UTILISE,
             return_value / side_effect, monkeypatch
Piloter    : TDD red-green-refactor, triangulation, kata
Sauver     : legacy = caracteriser → coutures → sprout → refactorer
Mesurer    : coverage.py, colonne Missing, --cov-branch,
             fail_under — et 100% ≠ zero bug
Integrer   : base jetable, TestCase (rollback), setUpTestData,
             IntegrityError ; client Django pour le web
Entourer   : black/flake8 (la forme aux machines), revue de code
             (le fond aux humains, petites PR), refactoring sous filet
Synthese   : risques → etages → outils, une regle = UN etage</pre>
<p>Félicitations : tu es arrivé au bout des 21 leçons. Tu sais écrire des tests qui prouvent, isoler n'importe quelle unité, piloter du code neuf par le TDD, sauver du legacy, mesurer sans te mentir et entretenir la qualité au quotidien — la Ludothèque entière tient sous ton filet. Il ne reste qu'un pas : que tout cela s'exécute automatiquement à chaque push, sur chaque branche, avant chaque fusion. C'est exactement le programme du cours <strong>CI/CD &amp; Git avancé</strong> : pipelines, job de tests, lint et couverture automatiques, pull requests protégées. Tes tests sont prêts ; allons les faire tourner tout seuls.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "tests-l21", title: "L'épreuve de synthèse : une journée de qualité", level: 3,
    statement: "Épreuve finale. Lundi matin à la Ludothèque, quatre tickets t'attendent : A) BUG — le plafond des frais de retard n'est pas appliqué pour les membres premium (code testé, suite verte pourtant) ; B) FEATURE — ajouter une remise étudiante de 15 pour cent (règle neuve) ; C) DETTE — la fonction export_catalogue, 90 lignes sans tests, doit changer de format de fichier ; D) ÉQUIPE — un collègue propose « visons 100 pour cent de couverture partout d'ici vendredi ». Pour chaque ticket, décris ta démarche complète en citant les techniques et leçons du cours (quel type de test, quel étage, quel ordre, quels pièges). Quatre réponses structurées, cinq lignes maximum chacune.",
    hints: [

    solution: "A — BUG (l2, l4, l7, l11) : reproduire d'abord — un test rouge\nparametrize (premium=True, 25 jours) qui attend le plafond 10.00 ;\nla suite était verte car ce CUMUL n'avait aucun cas. Corriger,\nvoir le vert, garder le test : c'est une régression verrouillée\nà vie. Commit séparé « Fix: plafond des frais pour premium ».\n\nB — FEATURE (l11, l12, l7, l20) : règle neuve = TDD. Liste de\ntests (nominal, palier du statut étudiant, cumul avec les autres\nremises, arrondi), cycles red-green-refactor, tableau parametrize\nau refactor. Étage unitaire : calcul pur. PR courte, description,\nrevue (l18).\n\nC — LEGACY (l13, l6, l19) : caractériser export_catalogue avec\ntmp_path (graver le fichier produit actuel), couture sur le\nchemin de sortie si besoin, puis modifier le format sous filet ;\nla caractérisation rouge attendue est mise à jour en connaissance\nde cause. Refactorings en commits séparés (l19).\n\nD — ÉQUIPE (l14) : refuser l'objectif-chiffre : viser 100 partout\npousse aux tests sans assert — le chiffre monte, la confiance\nchute (l'indicateur devient l'objectif). Contre-proposition :\nfail_under au niveau actuel pour interdire la régression, revue\nde la colonne Missing sur tarifs/factures à chaque PR, et\n--cov-branch sur les fichiers d'argent. La couverture boussole,\njamais trophée.",
