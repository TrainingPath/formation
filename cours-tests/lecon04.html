<body>
<script>
var DAY = {
  num: 4,
  title: "Tester les cas limites et les erreurs attendues",
  subtitle: "Les bugs n'habitent pas au milieu : ils vivent aux bornes et dans les refus.",
  theory: `
<h3>1. Les bugs vivent aux bornes</h3>
<p>Ta fonction marche pour 3 jours et pour 7 jours ? Bravo — mais que fait-elle pour <strong>0 jour</strong> ? Pour <strong>-2</strong> ? Pour une <strong>chaîne vide</strong> ou <strong>None</strong> ? (<code>None</code> est la valeur spéciale de Python signifiant « rien », « aucune valeur ».) L'expérience est formelle : la grande majorité des bugs se cache <strong>aux frontières</strong> — le zéro, le négatif, la borne exacte, le vide. Tester le milieu ne suffit jamais.</p>

<h3>2. L'inventaire des cas limites de calcul_prix_location</h3>
<p>Avant d'écrire les tests, on dresse <strong>l'inventaire</strong> : pour chaque frontière, que doit faire la fonction ? Répondre, ou refuser proprement ? Ci-dessous, ce n'est pas du code mais un tableau ; <code>→</code> se lit « doit produire ». <code>ValueError</code> (mauvaise <em>valeur</em>) et <code>TypeError</code> (mauvais <em>type</em>) sont deux <strong>exceptions</strong> : des signaux d'erreur que le programme envoie quand quelque chose cloche.</p>
<pre class="pseudo">jours = 1      → 3 €            (plus petite location valide)
jours = 5      → 15 €           (borne exacte du tarif plein)
jours = 6      → 17 €           (premier jour degressif : 15 + 2)
jours = 0      → ValueError     (louer zero jour n'a pas de sens)
jours = -2     → ValueError     (valeur negative refusee)
jours = None   → TypeError      (type invalide : None n'est pas un nombre)
jours = "cinq" → TypeError      (chaine de texte au lieu d'un entier)</pre>
<p>Remarque le trio autour de la borne : 5, puis 6 — c'est <strong>là</strong> que le bug de la leçon 1 se nichait.</p>

<h3>3. Tester qu'une erreur EST levée</h3>
<p>Deux mots de vocabulaire. Une <strong>exception</strong> est une erreur signalée pendant l'exécution ; on dit qu'on la <strong>lève</strong> (en anglais <em>raise</em>) — comme un maître-nageur qui lève le drapeau rouge pour dire « stop, situation anormale ». Refuser proprement une entrée invalide, en levant la bonne exception, est un <strong>comportement</strong> comme un autre : il se teste. Avec pytest, on déclare qu'un bloc <strong>doit</strong> lever une exception grâce à <code>with pytest.raises(...)</code> (<code>with</code> ouvre un bloc « surveillé ») :</p>
<pre class="pseudo">import pytest                                   # importer le framework pytest (pour utiliser pytest.raises)
from ludo.tarifs import calcul_prix_location    # importer la fonction a tester

def test_prix_location_refuse_zero_jour():      # test : louer 0 jour doit etre refuse
    with pytest.raises(ValueError):             # J'EXIGE qu'une ValueError soit levee a l'interieur de ce bloc
        calcul_prix_location(0)                 # cet appel DOIT lever ValueError ; sinon le test echoue (rouge)</pre>
<p>Si <code>ValueError</code> est levée : test vert. Si <strong>rien</strong> n'est levé, ou une autre exception : test rouge. En Java on écrit <code>assertThrows</code> (JUnit), en C# <code>Assert.Throws</code> (xUnit), en PHP <code>expectException</code> (PHPUnit).</p>

<h3>4. Vérifier le message avec match=</h3>
<p>Une bonne erreur porte un message utile. <code>match=</code> vérifie que le message de l'exception contient le motif de texte donné :</p>
<pre class="pseudo">def test_prix_location_refuse_les_jours_negatifs():   # test : un nombre de jours negatif doit etre refuse
    with pytest.raises(ValueError, match="positif"):  # exige une ValueError DONT le message contient "positif"
        calcul_prix_location(-2)                       # -2 jours : appel qui doit lever l'erreur attendue</pre>
<p>Si la fonction lève bien ValueError mais avec un message qui ne contient pas « positif », le test échoue : le contrat porte aussi sur le message.</p>

<h3>5. La règle métier : un jeu déjà loué ne se loue pas</h3>
<p>Une <strong>règle métier</strong> est une règle du monde réel de l'application (ici, la Ludothèque). Elle se teste comme le reste. « Un jeu déjà loué ne peut pas l'être à nouveau » se traduit par une exception dédiée, <code>JeuDejaLoueError</code> (une exception qu'on crée nous-mêmes, au nom parlant) :</p>
<pre class="pseudo">def test_location_refusee_si_jeu_deja_loue():   # test de la regle metier : pas de double location
    jeu = Jeu(titre="Catan")                    # Arrange : creer un jeu nomme "Catan"
    louer(jeu, membre="alice")                  # premiere location a alice : doit reussir (OK)
    with pytest.raises(JeuDejaLoueError):       # on exige l'exception dediee JeuDejaLoueError...
        louer(jeu, membre="bob")                # ...quand bob tente de louer le meme jeu, deja pris</pre>
<p>Ce test est une <strong>spécification exécutable</strong> de la règle : quiconque la casse verra rouge immédiatement. Même logique pour les frais de retard : <code>calcul_frais_retard(-1)</code> doit lever ValueError.</p>
<div class="warn">Ne mets qu'UNE ligne dans le bloc <code>with pytest.raises(...)</code> : s'il entoure dix lignes, n'importe laquelle peut lever l'exception et le test devient menteur — il passe pour une mauvaise raison.</div>
<div class="tip">Pour chaque fonction, récite la litanie des bornes : 0, 1, la borne exacte, la borne + 1, une valeur négative, le vide, None. Cinq minutes d'inventaire évitent trois semaines de production cassée.</div>`,
  exercises: [
    { type: "qcm", q: "Où se cache la majorité des bugs ?", opts: ["Au milieu des plages de valeurs", "Aux bornes : zéro, négatif, borne exacte, vide, None", "Dans les commentaires", "Dans les imports"], a: 1, exp: "Tester le milieu ne suffit jamais : vise les frontières." },
    { type: "qcm", q: "Pour le barème (3 €/jour jusqu'à 5 jours, 2 € ensuite), le trio de valeurs le plus révélateur :", opts: ["1, 2, 3", "10, 20, 30", "4, 5, 6 — autour de la borne", "100, 200, 300"], a: 2, exp: "C'est à la frontière du tarif que le bug de la leçon 1 vivait." },
    { type: "qcm", q: "calcul_prix_location(6) doit retourner…", opts: ["18", "12", "15", "17"], a: 3, exp: "5 jours à 3 € puis 1 jour à 2 € : 15 + 2 = 17." },
    { type: "qcm", q: "Pour tester qu'une erreur EST levée, pytest propose…", opts: ["try/except dans le test", "with pytest.raises(ValueError):", "assert error == True", "pytest --catch ValueError"], a: 1, exp: "Le bloc raises : vert si l'exception attendue est levée." },
    { type: "qcm", q: "Dans un bloc pytest.raises(ValueError), si AUCUNE exception n'est levée…", opts: ["Le test passe", "Le test échoue", "pytest plante", "Le test est ignoré"], a: 1, exp: "L'absence d'erreur attendue est un échec : le refus fait partie du contrat." },
    { type: "input", q: "Le paramètre de pytest.raises qui vérifie le message de l'exception :", a: ["match", "match="], ph: "paramètre", exp: "match=«positif» : le contrat porte aussi sur le message." },
    { type: "qcm", q: "with pytest.raises(ValueError, match=« positif ») échoue si…", opts: ["Le message contient « positif »", "ValueError est levée avec le bon message", "ValueError est levée mais son message ne contient pas « positif »", "Le test est trop lent"], a: 2, exp: "Bonne exception + bon message, sinon rouge." },
    { type: "vf", q: "Refuser proprement une valeur invalide est un comportement qui mérite son propre test.", a: true, exp: "Le refus fait partie de la spécification, autant que le calcul." },
    { type: "input", q: "L'exception dédiée levée quand on tente de louer un jeu déjà loué :", a: ["JeuDejaLoueError", "jeudejaloueerror"], ph: "nom de l'exception", exp: "Une exception métier nommée : la règle se lit dans le code." },
    { type: "qcm", q: "Le test de la règle « jeu déjà loué » consiste à…", opts: ["Louer une fois, puis vérifier que la seconde location lève JeuDejaLoueError", "Louer deux fois et vérifier le prix", "Supprimer le jeu", "Vérifier le catalogue"], a: 0, exp: "Arrange : jeu loué ; Act+Assert : seconde location refusée." },
    { type: "qcm", q: "L'équivalent JUnit de pytest.raises :", opts: ["expectException", "Assert.Throws", "assertThrows", "@Raises"], a: 2, exp: "Assert.Throws c'est xUnit (C#), expectException c'est PHPUnit." },
    { type: "vf", q: "calcul_prix_location(0) devrait retourner 0 € plutôt que lever une erreur.", a: false, exp: "Louer zéro jour n'a pas de sens : ValueError, et un test le grave dans le marbre." },
    { type: "qcm", q: "Passer None à calcul_prix_location devrait provoquer…", opts: ["Un prix de 0 €", "Une TypeError", "Un prix négatif", "Rien du tout"], a: 1, exp: "Mauvais type : TypeError ; mauvaise valeur : ValueError." },
    { type: "qcm", q: "Pourquoi ne mettre qu'une ligne dans le bloc with pytest.raises ?", opts: ["Pour la performance", "Python l'impose", "Sinon n'importe quelle ligne du bloc peut lever l'exception et le test ment", "Pour économiser l'écran"], a: 2, exp: "Un test qui passe pour une mauvaise raison est pire qu'un test rouge." },
    { type: "vf", q: "Les frais de retard suivent la même logique : calcul_frais_retard(-1) doit lever ValueError.", a: true, exp: "Mêmes bornes, même inventaire, même pytest.raises." }
  ],
  final: {
    title: "Exercice final — La chasse aux bornes",
    intro: `<p>Bornes, refus, messages : tu vérifies que le contrat complet est testable.</p>`,
    questions: [
      { type: "qcm", q: "Le réflexe d'inventaire des cas limites :", opts: ["0, 1, borne, borne + 1, négatif, vide, None", "Uniquement des grandes valeurs", "Une valeur au hasard", "Le milieu de la plage"], a: 0, exp: "La litanie des bornes, à réciter pour chaque fonction." },
      { type: "input", q: "La construction pytest (deux mots séparés par un point) qui attend une exception :", a: ["pytest.raises", "raises"], ph: "pytest.___", exp: "with pytest.raises(ValueError): — le refus se teste." },
      { type: "qcm", q: "Pour vérifier que le message d'erreur contient « positif » :", opts: ["assert message == positif", "pytest.raises(ValueError, match='positif')", "pytest -k positif", "print(message)"], a: 1, exp: "match= : le motif doit apparaître dans le message." },
      { type: "vf", q: "Si le code lève TypeError alors que le test attend ValueError, le test passe quand même.", a: false, exp: "Mauvaise exception = rouge : le type d'erreur fait partie du contrat." },
      { type: "qcm", q: "PHPUnit teste une exception attendue avec…", opts: ["assertThrows", "Assert.Throws", "expectException", "pytest.raises"], a: 2, exp: "assertThrows : JUnit ; Assert.Throws : xUnit." }
    ],
    solution: `<pre class="pseudo">Bornes     : 0, 1, borne (5), borne+1 (6), negatif, vide, None
Inventaire : pour chaque frontiere, decider → repondre ou refuser
Refus      : with pytest.raises(ValueError): calcul_prix_location(0)
Message    : pytest.raises(ValueError, match="positif")
Metier     : jeu deja loue → JeuDejaLoueError, grave dans un test

Ailleurs   : JUnit assertThrows, xUnit Assert.Throws,
             PHPUnit expectException.</pre>
<p>Tes tests couvrent maintenant les refus autant que les calculs. La suite : « Organiser ses tests : fichiers, nommage, indépendance » — une suite qui grossit doit rester rangée.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l4", title: "L'inventaire des frontières", level: 2,
    statement: "La Ludothèque ajoute la fonction calcul_frais_retard(jours_retard) : 1 € par jour de retard, plafonné à 15 € (au-delà, le membre paie le plafond), et un retard de 0 jour coûte 0 €. Dresse l'inventaire complet des cas limites au format « entrée → résultat attendu » (valeurs normales, bornes du plafond, zéro, négatif, mauvais type), puis rédige deux tests pytest en toutes lettres : un cas nominal de ton choix et le refus d'un retard négatif avec vérification du message d'erreur.",
    hints: [
      "La litanie des bornes : 0, 1, la borne exacte du plafond (15), la borne + 1 (16), un négatif, None.",
      "À la borne : 15 jours → 15 €, mais 16 jours → 15 € aussi. C'est le couple qui piège les implémentations naïves.",
      "Pour le refus, combine pytest.raises et match= — le message doit dire pourquoi la valeur est refusée."
    ],
    atoi: { cmd: "pytest tests/test_frais_retard.py -v", expected: "tests/test_frais_retard.py::test_frais_5_jours_retourne_5 PASSED\ntests/test_frais_retard.py::test_frais_retard_negatif_leve_valueerror PASSED\n\n2 passed in 0.02s\n\n# Verifie aussi les bornes du plafond : 15 jours -> 15 €, 16 jours -> 15 € aussi." },
    checklist: ["Ton inventaire couvre-t-il 0, la borne du plafond (15) ET la borne+1 (16), le négatif et le mauvais type (None) ?", "Le cas nominal choisit-il une valeur dont tu as calculé le résultat à la main ?", "Le test de refus utilise-t-il pytest.raises avec match= sur le message d'erreur ?", "Un retard de 16 jours renvoie-t-il bien 15 € (plafond), et non 16 € ?"],
    solution: "INVENTAIRE — calcul_frais_retard\n\nEntrée            | Attendu\n------------------+------------------------------------\n0                 | 0 €   (retard nul, rien à payer)\n1                 | 1 €   (plus petit retard facturé)\n14                | 14 €  (dernier jour sous le plafond)\n15                | 15 €  (borne exacte du plafond)\n16                | 15 €  (plafonné : pas 16 !)\n40                | 15 €  (loin au-delà : toujours 15)\n-1                | ValueError (retard négatif refusé)\nNone              | TypeError  (type invalide)\n\nTests :\n\ndef test_frais_retard_plafonnes_a_15_euros():\n    assert calcul_frais_retard(16) == 15\n\ndef test_frais_retard_refuse_un_retard_negatif():\n    with pytest.raises(ValueError, match='negatif'):\n        calcul_frais_retard(-1)\n\nLe couple (15, 16) est le cœur de l'inventaire : c'est lui qui\ndistingue un plafond correct d'un simple calcul linéaire.",
    note: "Cet inventaire est un livrable en soi : dans ton capstone, c'est lui que tu montreras au client pour valider les règles avant de coder. Et quand le pipeline CI/CD tournera, chaque ligne du tableau sera un test — la leçon 7 t'apprendra à écrire cette table en une seule fois avec parametrize." }
  ]
};
