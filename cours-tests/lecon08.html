<script>
var DAY = {
  num: 8,
  title: "La pyramide des tests : unitaire, intégration, bout en bout",
  subtitle: "Beaucoup de petits tests rapides, quelques gros tests réalistes : une question d'architecture.",
  theory: `
<h3>1. Les trois étages</h3>
<p>Tous les tests ne jouent pas au même niveau. Un test <strong>unitaire</strong> vérifie <strong>une fonction ou une classe isolée</strong> du reste : ni base de données, ni réseau, ni navigateur — il tourne en millisecondes. Un test d'<strong>intégration</strong> vérifie que <strong>plusieurs briques fonctionnent ensemble</strong> : ton code + la vraie base MySQL, par exemple (une <strong>base de données</strong> stocke durablement les informations de l'application). Un test <strong>bout en bout</strong> (e2e, <em>end to end</em>, « d'un bout à l'autre ») pilote <strong>l'application entière</strong> comme un utilisateur, souvent via le navigateur.</p>
<pre class="pseudo">Unitaire     : calcul_prix_location(2.50, 3) == 7.50      (millisecondes)
Intégration  : le modèle Jeu écrit puis relit dans MySQL  (secondes)
Bout en bout : un navigateur clique « Louer » et vérifie  (minutes)</pre>

<h3>2. Le compromis : vitesse, réalisme, diagnostic</h3>
<p>Plus on monte, plus le test est <strong>réaliste</strong>… et plus il est <strong>lent, fragile et flou</strong>. Quand un test unitaire échoue, tu sais exactement quelle fonction est cassée. Quand un test e2e échoue, la panne peut venir du code, de la base, du serveur, du navigateur ou d'un simple délai réseau : le diagnostic prend dix fois plus de temps. À l'inverse, un test unitaire ne prouvera jamais que ta requête SQL est correcte. Chaque étage a son rôle ; aucun ne remplace les autres.</p>

<h3>3. La pyramide… et le cône glacé</h3>
<p>D'où la <strong>pyramide des tests</strong> : <strong>beaucoup</strong> d'unitaires à la base, <strong>moins</strong> de tests d'intégration au milieu, <strong>très peu</strong> de tests e2e au sommet. Un <strong>anti-pattern</strong> (une « mauvaise recette » courante) inverse cette forme : on l'appelle le <strong>cône glacé</strong> — une suite dominée par des e2e lents et fragiles, avec trois malheureux tests unitaires en dessous. Résultat : une suite qui met vingt minutes, échoue au hasard, et que tout le monde finit par ignorer. Le schéma ci-dessous compare les deux formes (ce n'est pas du code, c'est un dessin).</p>
<pre class="pseudo">La pyramide (sain)              Le cône glacé (anti-pattern)
      [  e2e  ]                     [ e2e  e2e  e2e  e2e ]
   [ intégration ]                     [ intégration ]
[    unitaires     ]                      [ unit. ]
rapide, stable, précis          lent, fragile, diagnostic flou</pre>

<h3>4. La Ludothèque, étage par étage</h3>
<p>Reprenons notre application de location de jeux (Python, Django, MySQL). La fonction <code>calcul_prix_location</code> est un calcul pur : <strong>unitaire</strong>. Le <strong>modèle</strong> <code>Jeu</code> (une classe reliée à une table de la base de données, dans le vocabulaire de Django) qui écrit et relit dans MySQL : <strong>intégration</strong>. Le parcours complet « un client se connecte, choisit Catan, clique Louer » : <strong>bout en bout</strong>.</p>
<pre class="pseudo"># Unitaire — tests/test_tarifs.py                       # commentaire de section : un test unitaire
def test_prix_location_trois_jours():                   # test d'une fonction pure, sans base ni reseau
    assert calcul_prix_location(prix_jour=2.50, jours=3) == 7.50   # 3 jours a 2,50 => 7,50 (calcul isole)

# Intégration — tests/test_modeles.py (base de test)    # commentaire de section : un test d'integration
def test_jeu_sauvegarde_puis_relu():                    # verifie le contrat entre le code et la vraie base
    Jeu.objects.create(nom="Catan", prix_jour=2.50)     # ECRIRE un jeu dans la base de test (via le modele Django)
    assert Jeu.objects.get(nom="Catan").prix_jour == 2.50   # RELIRE ce jeu et verifier que le prix a bien ete stocke</pre>
<p>La règle d'or : vérifie chaque comportement à <strong>l'étage le plus bas</strong> qui suffit à le prouver. La pyramide est universelle : les suites JUnit (Java), xUnit (C#) ou PHPUnit (PHP) suivent exactement la même répartition.</p>

<h3>5. La carte des prochaines leçons</h3>
<p>Ce cours suit la pyramide de bas en haut. Leçons 9 et 10 : <strong>isoler</strong> l'unité de la base, du réseau et de l'horloge grâce aux doubles de test et aux mocks. Leçons 11 à 14 : TDD, legacy et couverture, toujours au niveau unitaire. Leçons 15 et 16 : monter d'un étage avec les tests d'<strong>intégration</strong> (vraie base) et les tests <strong>web</strong>. Tu sauras alors placer chaque test de la Ludothèque au bon endroit.</p>
<div class="warn">Tout tester en e2e semble séduisant (« c'est le plus réaliste ! ») mais produit une suite <strong>lente et fragile</strong> que l'équipe désactive au premier retard. C'est le cône glacé : évite-le dès la conception.</div>
<div class="tip">Avant d'écrire un test, pose-toi une seule question : quel est l'étage <strong>le plus bas</strong> qui prouve cette règle ? Si un test unitaire suffit, ne monte pas.</div>`,
  exercises: [
    { type: "qcm", q: "Un test unitaire vérifie…", opts: ["L'application entière via le navigateur", "Une fonction ou une classe isolée du reste", "La connexion MySQL", "Le déploiement en production"], a: 1, exp: "Isolé = ni base, ni réseau, ni horloge réelle : millisecondes." },
    { type: "qcm", q: "Un test d'intégration vérifie…", opts: ["Une fonction pure", "La couleur des boutons", "Que plusieurs briques fonctionnent ensemble (ex. modèle + MySQL)", "L'orthographe du code"], a: 2, exp: "Le contrat entre les briques est le sujet du test." },
    { type: "qcm", q: "Un test bout en bout (e2e)…", opts: ["Pilote l'application entière comme un utilisateur, souvent via le navigateur", "Teste une seule fonction", "Ne teste que la base", "Compile le code"], a: 0, exp: "D'un bout à l'autre : navigateur → Django → MySQL." },
    { type: "qcm", q: "Le grand atout des tests unitaires :", opts: ["Ils testent le navigateur", "Ils remplacent la documentation", "Ils sont réalistes à 100 pour cent", "Rapides, stables, diagnostic précis"], a: 3, exp: "On peut en avoir des centaines et les lancer à chaque sauvegarde." },
    { type: "qcm", q: "Quand un test e2e échoue…", opts: ["La fonction fautive est identifiée immédiatement", "La panne peut venir de n'importe quelle couche : diagnostic lent", "C'est toujours la base de données", "C'est toujours le navigateur"], a: 1, exp: "Code, base, serveur, réseau, navigateur : tout est suspect." },
    { type: "qcm", q: "La pyramide des tests recommande…", opts: ["Beaucoup d'unitaires, moins d'intégration, très peu d'e2e", "Autant de tests à chaque étage", "Beaucoup d'e2e, peu d'unitaires", "Zéro test unitaire"], a: 0, exp: "Large en bas, pointue en haut." },
    { type: "qcm", q: "L'anti-pattern du cône glacé, c'est…", opts: ["Trop de tests unitaires", "Des tests sans assert", "Une suite dominée par les e2e, lente et fragile", "Un test qui tourne la nuit"], a: 2, exp: "La pyramide inversée : elle fond de partout." },
    { type: "qcm", q: "Dans la Ludothèque, calcul_prix_location se teste idéalement en…", opts: ["Unitaire : c'est un calcul pur, sans dépendance", "E2e", "Intégration", "Pas du tout"], a: 0, exp: "Une formule isolée = l'étage le plus bas suffit." },
    { type: "qcm", q: "Le parcours complet « louer un jeu » dans le navigateur relève du test…", opts: ["Unitaire", "D'intégration", "De compilation", "Bout en bout"], a: 3, exp: "Il traverse toute l'application, comme un vrai client." },
    { type: "qcm", q: "Vérifier que le modèle Jeu écrit puis relit correctement dans MySQL est un test…", opts: ["Unitaire", "D'intégration", "E2e", "Manuel"], a: 1, exp: "Deux briques ensemble : ton code + la base." },
    { type: "vf", q: "Une suite composée surtout de tests e2e est rapide et stable.", a: false, exp: "C'est l'inverse : lente et fragile — le cône glacé." },
    { type: "vf", q: "Un test unitaire ne doit dépendre ni de la base, ni du réseau, ni de l'horloge réelle.", a: true, exp: "C'est la définition de « isolé » — les leçons 9-10 montrent comment." },
    { type: "vf", q: "La pyramide des tests vaut aussi pour JUnit (Java) et xUnit (C#).", a: true, exp: "La répartition est universelle ; seul l'outil change." },
    { type: "input", q: "Le sigle courant des tests bout en bout :", a: ["e2e", "end to end", "bout en bout"], ph: "trois caractères…", exp: "End to end : d'un bout de l'application à l'autre." },
    { type: "input", q: "Nom de l'anti-pattern où la pyramide est inversée :", a: ["cône glacé", "cone glace", "le cône glacé"], ph: "deux mots", exp: "Beaucoup d'e2e en haut, presque rien en dessous." }
  ],
  final: {
    title: "Exercice final — Chaque test à son étage",
    intro: `<p>Cinq situations de la Ludothèque : place chacune au bon étage de la pyramide.</p>`,
    questions: [
      { type: "qcm", q: "La formule des frais de retard (sans base ni réseau) se teste en…", opts: ["Intégration", "E2e", "Unitaire", "Test de charge"], a: 2, exp: "Un calcul pur : l'étage le plus bas suffit." },
      { type: "qcm", q: "La requête qui liste le catalogue depuis MySQL se teste en…", opts: ["Intégration", "Unitaire", "E2e", "Aucun test possible"], a: 0, exp: "Le contrat code + base est justement ce qu'on veut prouver." },
      { type: "vf", q: "Les tests e2e doivent être les plus nombreux de la suite.", a: false, exp: "Très peu, au sommet : ils sont lents et fragiles." },
      { type: "qcm", q: "Pourquoi la base de la pyramide est-elle unitaire ?", opts: ["Parce que c'est plus joli", "Rapides et précis : on peut en avoir des centaines sans ralentir l'équipe", "Parce que MySQL est payant", "Parce que le navigateur est interdit"], a: 1, exp: "Vitesse + diagnostic précis = la base idéale." },
      { type: "input", q: "À quel étage appartient un test qui traverse navigateur, Django et MySQL ?", a: ["bout en bout", "e2e", "end to end"], ph: "l'étage…", exp: "Toute l'application d'un bout à l'autre." }
    ],
    solution: `<pre class="pseudo">Unitaire     : une fonction isolée   → rapide, précis, très nombreux
Intégration  : plusieurs briques     → la vraie base, moins nombreux
Bout en bout : l'application entière → réaliste, lent, très rares

Pyramide     : large en bas, pointue en haut
Cône glacé   : l'inverse — suite lente, fragile, ignorée

Ludothèque   : calcul_prix_location (unitaire)
               modèle Jeu + MySQL   (intégration)
               parcours « louer »   (e2e)</pre>
<p>La base de la pyramide exige d'isoler chaque unité de la base, du réseau et de l'horloge. Prochaine leçon : les doubles de test — stubs, fakes et mocks.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l8", title: "Le tri de la Ludothèque", level: 2,
    statement: "Voici huit vérifications prévues pour la Ludothèque : 1) calcul_prix_location renvoie 7,50 € pour 3 jours à 2,50 € ; 2) la page catalogue affiche les jeux après connexion d'un client dans le navigateur ; 3) le modèle Location écrit puis relit une location dans MySQL ; 4) frais_de_retard plafonne à 10 € ; 5) le parseur transforme correctement un JSON de cotation d'exemple (fonction pure, JSON local) ; 6) la vue Django « louer » refuse un jeu déjà loué (vue + base de test) ; 7) le parcours complet inscription → location → retour dans le navigateur ; 8) un nom de jeu vide lève ValueError. Classe chaque vérification dans un étage de la pyramide (unitaire, intégration, bout en bout) et justifie chacune en une ligne. Termine par un bilan : la répartition obtenue a-t-elle la forme d'une pyramide ?",
    hints: [
      "Pose pour chaque cas la question : de quoi ce test a-t-il VRAIMENT besoin pour tourner ? Rien ? La base ? Le navigateur ?",
      "Un JSON d'exemple stocké en local n'est pas le réseau : le parseur se teste comme une fonction pure.",
      "Compte tes réponses par étage à la fin : il devrait y avoir plus d'unitaires que d'intégration, et plus d'intégration que d'e2e."
    ],
    solution: "No | Étage        | Pourquoi\n---+--------------+------------------------------------------------\n1  | Unitaire     | calcul pur, aucune dépendance\n2  | Bout en bout | navigateur + session + base : tout l'empilement\n3  | Intégration  | le contrat avec MySQL est le sujet du test\n4  | Unitaire     | encore une formule isolée\n5  | Unitaire     | on parse un JSON local, pas le vrai réseau\n6  | Intégration  | vue + modèle + base de test ensemble\n7  | Bout en bout | le parcours utilisateur complet\n8  | Unitaire     | validation pure, pytest.raises suffit\n\nBilan : 4 unitaires, 2 intégration, 2 e2e → la forme d'une pyramide\n(on réduirait même l'e2e no 2, couvert par le parcours no 7).\nRègle : toujours tester à l'étage LE PLUS BAS qui prouve la règle.",
    note: "Ce tri est exactement celui que tu referas dans le capstone Ludothèque du Niveau 6. Et il prépare le cours CI/CD : le pipeline lancera les étages dans cet ordre — unitaires à chaque push (secondes), intégration ensuite, e2e plus rarement. Une base unitaire rapide rend chaque commit Git vérifiable en quelques secondes." }
  ]
};
</script>
