<script>
var DAY = {
  num: 7,
  title: "Paramétrer : un test, dix jeux de données",
  subtitle: "Le barème complet des tarifs vérifié par UNE fonction : ajoute une ligne, gagne un test.",
  theory: `
<h3>1. Le problème : dix tests clones</h3>
<p>Le barème de la Ludothèque a plusieurs paliers, et te voilà en train d'écrire dix tests <strong>identiques à une valeur près</strong> : même Arrange, même Act, même Assert — seuls les chiffres changent. C'est la duplication de la leçon 6, version données.</p>
<pre class="pseudo">def test_prix_1_jour():                            # test du prix pour 1 jour
    assert calcul_prix_location(2.50, 1) == 2.50   # 1 jour a 2,50 EUR => 2,50 EUR

def test_prix_3_jours():                           # test du prix pour 3 jours (copie du precedent...)
    assert calcul_prix_location(2.50, 3) == 7.50   # 3 x 2,50 => 7,50 EUR

def test_prix_7_jours():           # ...et encore huit copies presque identiques
    assert calcul_prix_location(2.50, 7) == 15.75  # 7 jours avec remise duree => 15,75 EUR</pre>

<h3>2. @pytest.mark.parametrize : le tableau de cas</h3>
<p>Le décorateur <code>@pytest.mark.parametrize</code> prend deux arguments : une <strong>chaîne avec les noms des paramètres</strong>, puis une <strong>liste de tuples</strong>. Un <strong>tuple</strong> est un petit groupe ordonné de valeurs écrit entre parenthèses, par exemple <code>(7, 15.75)</code> ; ici, un tuple par cas de test. pytest exécute la fonction une fois par tuple :</p>
<pre class="pseudo">import pytest                                   # importer pytest pour le decorateur parametrize

@pytest.mark.parametrize("jours, attendu", [    # declare 2 parametres ("jours", "attendu") + la liste des cas
    (1,  2.50),                                 # cas 1 : jours=1  -> attendu=2.50
    (3,  7.50),                                 # cas 2 : jours=3  -> attendu=7.50
    (7,  15.75),     # cas 3 : jours=7 -> 15.75 (remise duree appliquee)
    (14, 31.50),                                # cas 4 : jours=14 -> attendu=31.50
])
def test_prix_location(jours, attendu):         # la fonction recoit "jours" et "attendu" ; appelee 1x par cas
    assert calcul_prix_location(2.50, jours) == attendu   # verifie le prix calcule contre l'attendu du cas</pre>
<p>Une fonction, quatre cas : pytest annonce <strong>4 tests</strong>. Ajouter un cas au barème, c'est désormais ajouter <strong>une ligne</strong> au tableau.</p>

<h3>3. Chaque cas est un test à part entière</h3>
<p>Ce n'est pas une boucle : si le cas <code>(7, 15.75)</code> échoue, les trois autres <strong>tournent quand même</strong>, et pytest te dit exactement lequel est rouge : <code>test_prix_location[7-15.75]</code>. Pour des noms plus parlants que des chiffres entre crochets, <code>pytest.param</code> accepte un <code>id</code> (une étiquette lisible) :</p>
<pre class="pseudo">@pytest.mark.parametrize("jours, attendu", [           # meme mecanique, mais avec des noms de cas lisibles
    pytest.param(1,  2.50,  id="un-jour-plein-tarif"), # cas etiquete "un-jour-plein-tarif"
    pytest.param(7,  15.75, id="remise-semaine"),      # cas etiquete "remise-semaine"
])
def test_prix_location(jours, attendu):                # fonction de test appelee 1x par cas
    assert calcul_prix_location(2.50, jours) == attendu   # verifie le prix contre l'attendu</pre>

<h3>4. Cumuler : le produit cartésien</h3>
<p>On peut <strong>empiler</strong> plusieurs décorateurs parametrize : pytest croise alors toutes les combinaisons (le « produit cartésien », c'est-à-dire tous les mariages possibles entre les valeurs). Deux durées x deux statuts membre = quatre tests, écrits en cinq lignes :</p>
<pre class="pseudo">@pytest.mark.parametrize("jours", [1, 7])              # 1er tableau : le parametre "jours" prend 2 valeurs
@pytest.mark.parametrize("premium", [True, False])     # 2e tableau EMPILE : "premium" prend 2 valeurs
def test_prix_jamais_negatif(jours, premium):          # pytest croise tout : 2 x 2 = 4 tests generes
    assert calcul_prix_location(2.50, jours, premium) &gt;= 0   # quel que soit le cas, le prix doit rester >= 0</pre>
<p>Et parametrize se combine sans problème avec les fixtures de la leçon 6 : un test peut recevoir <code>jeu_disponible</code> ET des paramètres.</p>

<h3>5. Bien choisir ses lignes — et les équivalents</h3>
<p>Un tableau de cas se construit comme à la leçon 4 : le <strong>cas nominal</strong> (l'usage normal), les <strong>limites</strong> (le palier exact où la remise démarre : 6, 7, 8 jours), et les valeurs spéciales. En revanche, ne mets dans un même tableau que des cas qui vérifient <strong>la même règle</strong> : si les erreurs attendues (ValueError pour jours négatif) exigent un autre assert, elles méritent leur propre test. En une ligne : JUnit dit <code>@ParameterizedTest</code> + <code>@CsvSource</code>, xUnit dit <code>[Theory]</code> + <code>[InlineData]</code>, PHPUnit passe par un <code>dataProvider</code>.</p>
<div class="warn">Si tu te surprends à écrire un <strong>if dans le corps du test</strong> (« si jours est négatif, alors vérifier l'exception, sinon le prix »), c'est le signal : deux règles se cachent dans ton tableau. Sépare-les en deux tests paramétrés — un tableau = une règle.</div>
<div class="tip">Relis ton tableau comme un barème affiché en magasin : chaque ligne doit se lire à voix haute (« 7 jours coûtent 15,75, remise semaine »). Si une ligne ne se raconte pas, elle n'a rien à faire là.</div>`,
  exercises: [
    { type: "qcm", q: "Le problème que résout @pytest.mark.parametrize :", opts: ["La lenteur de la base de données", "Dix tests identiques à une valeur près", "Le manque de fixtures", "Les imports circulaires"], a: 1, exp: "Même Arrange, même Assert, seuls les chiffres changent : un tableau suffit." },
    { type: "input", q: "Le décorateur complet qui paramètre un test pytest :", a: ["@pytest.mark.parametrize", "pytest.mark.parametrize"], ph: "décorateur", exp: "Attention à l'orthographe : parametrize, avec un z." },
    { type: "qcm", q: "Le premier argument de parametrize est…", opts: ["Une liste de tuples", "Le nombre de tests à générer", "Une chaîne contenant les noms des paramètres", "Le nom du fichier de données"], a: 2, exp: "\"jours, attendu\" : les noms que la fonction de test déclare ensuite." },
    { type: "qcm", q: "Le second argument de parametrize est…", opts: ["Une liste de tuples, un par cas", "Un dictionnaire de fixtures", "Un fichier JSON", "Une expression régulière"], a: 0, exp: "Chaque tuple fournit les valeurs des paramètres pour un cas." },
    { type: "qcm", q: "Un test paramétré avec 4 tuples : pytest annonce…", opts: ["1 test", "4 tests distincts", "2 tests", "0 test"], a: 1, exp: "Chaque cas est un test à part entière, compté et rapporté séparément." },
    { type: "vf", q: "Si le deuxième cas d'un test paramétré échoue, les cas suivants ne sont pas exécutés.", a: false, exp: "Ce n'est pas une boucle : chaque cas tourne indépendamment des autres." },
    { type: "qcm", q: "pytest.param(7, 15.75, id=\"remise-semaine\") sert à…", opts: ["Ignorer ce cas", "Donner un nom lisible au cas dans la sortie de pytest", "Chronométrer le cas", "Le lancer en premier"], a: 1, exp: "test_prix_location[remise-semaine] se lit mieux que [7-15.75]." },
    { type: "qcm", q: "Deux décorateurs parametrize empilés sur un même test produisent…", opts: ["Une erreur", "Le produit cartésien de toutes les combinaisons", "Seulement le premier tableau", "Un test unique"], a: 1, exp: "2 durées x 2 statuts = 4 tests générés." },
    { type: "qcm", q: "Que met-on dans un MÊME tableau paramétré ?", opts: ["Des cas qui vérifient la même règle avec des données différentes", "Tous les tests du fichier", "Des cas aux asserts différents", "Uniquement des erreurs"], a: 0, exp: "Un tableau = une règle ; les asserts différents vont dans un autre test." },
    { type: "vf", q: "Ajouter un if dans le corps du test selon la valeur du paramètre est une bonne pratique.", a: false, exp: "C'est le signal que deux règles cohabitent : sépare-les en deux tests." },
    { type: "qcm", q: "Quels cas choisir pour le tableau du barème (leçon 4 en renfort) ?", opts: ["Uniquement le cas nominal", "Des valeurs au hasard", "Le nominal, les limites de palier (6, 7, 8 jours) et les valeurs spéciales", "Le plus de lignes possible"], a: 2, exp: "Les limites de palier sont là où les bugs de barème se cachent." },
    { type: "input", q: "L'annotation JUnit équivalente à parametrize :", a: ["@ParameterizedTest", "ParameterizedTest"], ph: "annotation Java", exp: "Avec @CsvSource ou @ValueSource pour fournir les données." },
    { type: "qcm", q: "L'équivalent xUnit (C#) d'un test paramétré :", opts: ["[Fact] + [Setup]", "[Theory] + [InlineData]", "[Test] + [Loop]", "[Params]"], a: 1, exp: "[Theory] déclare le test, chaque [InlineData] fournit un cas." },
    { type: "qcm", q: "En PHPUnit, les jeux de données d'un test viennent…", opts: ["D'un dataProvider", "D'un fichier .env", "De la base MySQL", "Du navigateur"], a: 0, exp: "Une méthode fournit les cas, le test les reçoit en arguments." },
    { type: "vf", q: "Un test paramétré peut aussi recevoir une fixture de la leçon 6.", a: true, exp: "Fixtures et paramètres se combinent librement dans la signature." }
  ],
  final: {
    title: "Exercice final — Le barème en tableau",
    intro: `<p>Le barème complet de la Ludothèque tient maintenant dans un tableau. Vérifions la mécanique.</p>`,
    questions: [
      { type: "qcm", q: "@pytest.mark.parametrize(\"jours, attendu\", [(1, 2.50), (3, 7.50)]) génère…", opts: ["Un seul test à deux asserts", "Deux tests indépendants", "Une boucle dans un test", "Deux fichiers"], a: 1, exp: "Un tuple = un test, rapporté séparément dans la sortie." },
      { type: "input", q: "La fonction qui permet de donner un id lisible à un cas du tableau :", a: ["pytest.param", "param"], ph: "fonction…", exp: "pytest.param(7, 15.75, id=\"remise-semaine\")." },
      { type: "vf", q: "Empiler deux parametrize croise toutes les combinaisons de valeurs.", a: true, exp: "Le produit cartésien : pratique pour balayer durées x statuts." },
      { type: "qcm", q: "Les cas d'erreur (ValueError pour jours négatif) dans le tableau du barème :", opts: ["On les mélange avec les prix", "On les met dans un test séparé : autre assert, autre règle", "On les supprime", "On les commente"], a: 1, exp: "pytest.raises n'est pas le même assert : un tableau = une règle." },
      { type: "qcm", q: "Le grand gain de parametrize au quotidien :", opts: ["Les tests deviennent plus lents", "Un nouveau cas de barème = une ligne ajoutée au tableau", "On n'écrit plus d'assert", "La couverture monte toute seule"], a: 1, exp: "Le tableau grandit avec le barème, sans dupliquer la mécanique." }
    ],
    solution: `<pre class="pseudo">Probleme   : dix tests identiques a une valeur pres
Solution   : @pytest.mark.parametrize("noms", [tuples])
Comptage   : un tuple = UN test independant, rapporte a part
Lisibilite : pytest.param(..., id="remise-semaine")
Croiser    : deux parametrize empiles = produit cartesien
Choisir    : nominal + limites de palier + valeurs speciales
Regle d'or : un tableau = une regle (pas de if dans le test)

Ailleurs   : JUnit @ParameterizedTest/@CsvSource,
             xUnit [Theory]/[InlineData], PHPUnit dataProvider.</pre>
<p>Tu sais écrire des tests efficaces au kilomètre. Prochaine leçon : prendre de la hauteur avec la pyramide des tests — unitaire, intégration, bout en bout.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l7", title: "Le tableau des frais de retard", level: 2,
    statement: "La règle des frais de retard de la Ludothèque : 0,50 € par jour de retard, plafonné à 10 €, jamais négatif (un retour en avance ne crée pas de crédit), et un nombre de jours non entier lève TypeError. Conçois le ou les tests paramétrés qui couvrent cette règle : écris le décorateur @pytest.mark.parametrize complet avec son tableau de cas (choisis les valeurs en justifiant chaque ligne : nominal, limites du plafond, retour en avance), donne un id parlant à chaque cas avec pytest.param, et explique pourquoi le cas TypeError ne figure PAS dans ce tableau mais dans un test séparé.",
    hints: [
      "Le plafond est un palier : teste juste en dessous (19 jours), pile dessus (20 jours) et au-delà (25 jours).",
      "Le retour en avance donne un nombre de jours négatif : le résultat attendu est 0, pas un montant négatif.",
      "TypeError exige pytest.raises : ce n'est pas le même assert que la comparaison de prix, donc pas le même tableau."
    ],
    atoi: { cmd: "pytest tests/test_frais_retard.py -v", expected: "tests/test_frais_retard.py::test_frais[nominal_3j] PASSED\ntests/test_frais_retard.py::test_frais[juste_sous_plafond_19j] PASSED\ntests/test_frais_retard.py::test_frais[pile_plafond_20j] PASSED\ntests/test_frais_retard.py::test_frais[au_dela_plafond_25j] PASSED\ntests/test_frais_retard.py::test_frais[retour_en_avance] PASSED\ntests/test_frais_retard.py::test_frais_jours_non_entier_leve_typeerror PASSED\n\n6 passed in 0.03s\n\n# 0,50 €/jour, plafond 10 € atteint a 20 jours : 19 et 20 encadrent le palier." },
    checklist: ["Chaque ligne du tableau parametrize a-t-elle un id parlant via pytest.param(..., id=...) ?", "Le tableau couvre-t-il le nominal, juste sous le plafond (19 j), pile dessus (20 j), au-delà (25 j) et le retour en avance (→ 0) ?", "Le cas TypeError est-il dans un test séparé avec pytest.raises (pas dans le tableau de comparaisons) ?", "As-tu justifié le choix de chaque valeur (pourquoi 19 et 20 encadrent le palier du plafond) ?"],
    solution: "@pytest.mark.parametrize('jours_retard, attendu', [\n    pytest.param(0,   0.00,  id='retour-a-temps'),\n    pytest.param(1,   0.50,  id='un-jour'),\n    pytest.param(4,   2.00,  id='nominal-quatre-jours'),\n    pytest.param(19,  9.50,  id='juste-sous-le-plafond'),\n    pytest.param(20, 10.00,  id='pile-au-plafond'),\n    pytest.param(25, 10.00,  id='au-dela-plafonne'),\n    pytest.param(-3,  0.00,  id='retour-en-avance-jamais-negatif'),\n])\ndef test_frais_de_retard(jours_retard, attendu):\n    assert frais_de_retard(jours_retard) == attendu\n\n# Test SÉPARÉ : autre assert (exception), donc autre règle\ndef test_frais_refuse_jours_non_entier():\n    with pytest.raises(TypeError):\n        frais_de_retard(2.5)\n\nJustification des lignes : nominal (1 et 4 jours), les trois\ncôtés du palier du plafond (19/20/25), la limite zéro et le\ncas négatif. Le TypeError sort du tableau : un if dans le test\npour choisir entre assert == et pytest.raises mélangerait\ndeux règles — un tableau = une règle.",
    note: "Ce réflexe « tableau + limites de palier » est celui des testeurs professionnels : la plupart des bugs de barème vivent à 19, 20 et 21 — jamais à 4. Au capstone Ludothèque, chaque règle tarifaire aura son tableau ; et dans le cours CI/CD, ces dizaines de cas tourneront en quelques millisecondes à chaque push." }
  ]
};
