<script>
var DAY = {
  num: 11,
  title: "TDD : red, green, refactor",
  subtitle: "Et si le test venait AVANT le code ? Trois couleurs, un cycle, une discipline.",
  theory: `
<h3>1. L'inversion : le test d'abord</h3>
<p>Jusqu'ici, tu écrivais le code, puis les tests. Le <strong>TDD</strong> (<em>Test-Driven Development</em>, développement piloté par les tests) inverse l'ordre : on écrit d'abord un <strong>test qui échoue</strong>, puis <strong>juste assez de code</strong> pour le faire passer, puis on nettoie. Le test n'est plus une vérification après coup : c'est le <strong>cahier des charges exécutable</strong> de la prochaine petite fonctionnalité. Nouvelle règle de la Ludothèque : « un membre qui a déjà 3 locations actives ne peut plus louer ». Le TDD commence par écrire ce que ça veut dire :</p>
<pre class="pseudo">def test_membre_avec_trois_locations_ne_peut_plus_louer():   # le test decrit la regle AVANT que le code existe
    membre = Membre(nom="Alice", locations_actives=3)       # Arrange : un membre qui a deja 3 locations en cours
    assert peut_louer(membre) is False                      # on EXIGE que peut_louer reponde Faux (interdit de louer)</pre>
<p>La fonction <code>peut_louer</code> n'existe pas encore. C'est normal : c'est le but.</p>

<h3>2. RED : échouer pour la bonne raison</h3>
<p>On lance pytest et on <strong>regarde le test échouer</strong>. Ce n'est pas une formalité : le rouge prouve que le test <strong>sait détecter l'absence</strong> de la fonctionnalité. Et il faut échouer <strong>pour la bonne raison</strong> : un <code>NameError: peut_louer</code> dit « la fonction manque » — parfait pour démarrer. Mais si plus tard un test neuf échoue sur une faute de frappe ou un import cassé, corrige le test avant d'écrire le code : un test qui échoue pour une mauvaise raison ne pilote rien.</p>
<pre class="pseudo">$ pytest
E   NameError: name 'peut_louer' is not defined     ← RED, bonne raison</pre>

<h3>3. GREEN : le code minimal, même naïf</h3>
<p>On écrit maintenant <strong>le code le plus simple qui fait passer le test</strong> — et rien de plus. Oui, même une valeur codée en dur :</p>
<pre class="pseudo">def peut_louer(membre):     # on cree enfin la fonction attendue, avec le minimum
    return False        # naïf... mais le test passe : GREEN</pre>
<p>Choquant ? C'est voulu : ce code minimal révèle que <strong>ta suite est incomplète</strong>. Pour forcer la vraie logique, on ajoute un deuxième test — c'est la <strong>triangulation</strong> :</p>
<pre class="pseudo">def test_membre_sans_location_peut_louer():    # 2e test : un membre sans location doit, lui, pouvoir louer
    membre = Membre(nom="Bruno", locations_actives=0)   # Arrange : un membre a 0 location active
    assert peut_louer(membre) is True          # on EXIGE Vrai ; "return False" en dur echoue donc ici

# return False ne suffit plus : le code doit devenir vrai
def peut_louer(membre):                        # on reecrit la fonction avec la vraie logique
    return membre.locations_actives &lt; 3        # Vrai seulement si le membre a MOINS de 3 locations actives</pre>

<h3>4. REFACTOR : nettoyer sous protection</h3>
<p>Les tests sont verts : on a le droit d'<strong>améliorer la structure</strong> sans changer le comportement — renommer, extraire, supprimer une duplication. Ici, le nombre magique 3 mérite un nom :</p>
<pre class="pseudo">LIMITE_LOCATIONS_ACTIVES = 3    # on nomme le "nombre magique" 3 : une constante parlante et modifiable en un endroit

def peut_louer(membre):                                     # meme fonction, meme comportement
    return membre.locations_actives &lt; LIMITE_LOCATIONS_ACTIVES   # plus lisible : "moins que la limite autorisee"</pre>
<p>On relance pytest : toujours vert, donc le nettoyage n'a rien cassé. Le refactor s'applique aussi <strong>aux tests</strong> : une fixture ou un parametrize peut naître à cette étape. Puis le cycle recommence avec le test suivant.</p>

<h3>5. Le cycle court, et ce qu'il t'achète</h3>
<p>Un tour complet red → green → refactor dure <strong>quelques minutes</strong>, pas une journée. Les gains : une <strong>couverture native</strong> (chaque ligne est née pour faire passer un test), un <strong>design testable d'office</strong> (le code naît isolé de la base et de l'horloge, sinon le test serait impossible à écrire), et une <strong>spécification vivante</strong> — la liste des tests raconte les règles. Les limites : le TDD brille sur la logique métier ; pour l'exploration tâtonnante ou le réglage visuel d'une interface, il est moins naturel. En une ligne : la discipline est identique en JUnit, xUnit ou PHPUnit — seule la commande change.</p>
<div class="warn">Sauter l'étape RED est le péché capital : un test que tu n'as <strong>jamais vu échouer</strong> ne prouve rien — il passerait peut-être même sans ton code (assert inutile, mauvaise cible). Le rouge d'abord, toujours.</div>
<div class="tip">Garde les tours de cycle minuscules : UN test, une poignée de lignes, moins de cinq minutes. Si tu restes bloqué au rouge plus de dix minutes, ton pas était trop grand — supprime, découpe la règle en deux tests plus petits, recommence.</div>`,
  exercises: [
    { type: "qcm", q: "TDD signifie…", opts: ["Test-Driven Development : le test s'écrit avant le code", "Total Debug Discipline", "Tester Deux fois par Jour", "Test During Deployment"], a: 0, exp: "Le développement est piloté par les tests, écrits en premier." },
    { type: "input", q: "Les trois étapes du cycle TDD, dans l'ordre (en anglais, séparées par des virgules) :", a: ["red, green, refactor", "red green refactor", "red,green,refactor"], ph: "trois mots…", exp: "Échouer, faire passer, nettoyer — puis recommencer." },
    { type: "qcm", q: "L'étape RED consiste à…", opts: ["Corriger un bug", "Écrire un test et le voir échouer pour la bonne raison", "Supprimer les tests rouges", "Formater le code"], a: 1, exp: "Le rouge prouve que le test détecte bien l'absence de la fonctionnalité." },
    { type: "qcm", q: "Pourquoi faut-il VOIR le test échouer avant de coder ?", opts: ["Pour le plaisir", "Parce que pytest l'exige", "Un test jamais vu rouge pourrait passer même sans le code : il ne prouve rien", "Pour ralentir le projet"], a: 2, exp: "Le rouge valide le test lui-même — c'est le test du test." },
    { type: "qcm", q: "À l'étape GREEN, on écrit…", opts: ["Toute la fonctionnalité d'un coup", "La documentation", "Le code le plus simple qui fait passer le test, même naïf", "Un deuxième test"], a: 2, exp: "return False codé en dur est légitime : la suite de tests forcera la suite." },
    { type: "vf", q: "Écrire return False en dur pour passer le premier test est une tricherie interdite en TDD.", a: false, exp: "C'est même recommandé : le code naïf révèle que la suite de tests est incomplète." },
    { type: "input", q: "Ajouter un deuxième cas pour forcer le code à se généraliser s'appelle la…", a: ["triangulation"], ph: "un mot…", exp: "Deux points forcent la droite : deux tests forcent la vraie logique." },
    { type: "qcm", q: "L'étape REFACTOR consiste à…", opts: ["Ajouter des fonctionnalités", "Améliorer la structure sans changer le comportement, tests au vert", "Supprimer les tests", "Déployer en production"], a: 1, exp: "Renommer, extraire, dédupliquer — et relancer pytest pour vérifier." },
    { type: "vf", q: "L'étape refactor peut aussi améliorer le code des tests eux-mêmes.", a: true, exp: "Une fixture ou un parametrize naissent souvent à cette étape." },
    { type: "qcm", q: "Un NameError au premier lancement d'un test TDD signifie…", opts: ["Que pytest est cassé", "Que le test échoue pour la bonne raison : la fonction n'existe pas encore", "Qu'il faut supprimer le test", "Que Python est mal installé"], a: 1, exp: "C'est le RED attendu au tout début d'un cycle." },
    { type: "qcm", q: "La durée idéale d'un tour de cycle red-green-refactor :", opts: ["Une semaine", "Une journée", "Quelques minutes", "Un mois"], a: 2, exp: "Des pas minuscules : un test, quelques lignes, on recommence." },
    { type: "qcm", q: "Pourquoi le code né en TDD est-il testable d'office ?", opts: ["Parce qu'il est plus court", "Le test existant AVANT, un code couplé à la base ou à l'horloge serait impossible à écrire", "Parce que pytest le reformate", "Il ne l'est pas"], a: 1, exp: "Le design émerge isolé : la contrainte du test précède le code." },
    { type: "qcm", q: "Où le TDD est-il le moins naturel ?", opts: ["Sur la logique métier", "Sur un barème de tarifs", "Sur une règle de validation", "Sur l'exploration tâtonnante ou le réglage visuel d'une interface"], a: 3, exp: "Il brille sur la logique ; l'exploratoire et le visuel se prêtent moins au test d'abord." },
    { type: "vf", q: "Le cycle TDD est propre à Python : il ne s'applique pas avec JUnit ou PHPUnit.", a: false, exp: "La discipline est universelle ; seul l'outil de lancement change." },
    { type: "qcm", q: "Bloqué au rouge depuis dix minutes : le bon réflexe TDD ?", opts: ["Commenter le test", "Le pas était trop grand : découper la règle en tests plus petits", "Écrire tout le code d'un coup", "Passer à un autre projet"], a: 1, exp: "Supprimer, découper, recommencer petit : le cycle doit rester court." }
  ],
  final: {
    title: "Exercice final — Un cycle dans l'ordre",
    intro: `<p>La règle « un membre suspendu ne peut pas louer » arrive dans la Ludothèque. Déroulons le cycle sans fausse note.</p>`,
    questions: [
      { type: "qcm", q: "La toute première action en TDD :", opts: ["Écrire peut_louer", "Écrire le test test_membre_suspendu_ne_peut_pas_louer et le voir échouer", "Créer la base de données", "Formater le code"], a: 1, exp: "Le test d'abord, le rouge ensuite, le code enfin." },
      { type: "vf", q: "Si le nouveau test passe du premier coup, quelque chose cloche : il faut comprendre pourquoi avant de continuer.", a: true, exp: "Soit la règle existe déjà, soit le test ne teste rien — dans les deux cas, on enquête." },
      { type: "qcm", q: "Le test est rouge (NameError). L'étape suivante :", opts: ["Écrire le code minimal qui le fait passer", "Écrire cinq autres tests", "Refactorer", "Commit et déploiement"], a: 0, exp: "GREEN : juste assez de code, rien de plus." },
      { type: "input", q: "Une fois le test vert, l'étape qui améliore la structure sans changer le comportement :", a: ["refactor", "le refactor", "refactoring", "refactorer"], ph: "l'étape…", exp: "Sous la protection des tests verts — puis on relance pytest." },
      { type: "qcm", q: "Après le refactor, le cycle…", opts: ["Est terminé pour toujours", "Recommence avec le test de la prochaine petite règle", "Passe en production", "Supprime les anciens tests"], a: 1, exp: "Red, green, refactor, et on remet une pièce : c'est une boucle." }
    ],
    solution: `<pre class="pseudo">RED      : ecrire UN test → le voir echouer POUR LA BONNE RAISON
GREEN    : le code le plus simple qui passe (meme naif, en dur)
REFACTOR : nettoyer code ET tests, comportement identique, re-pytest
           puis recommencer — cycle de quelques minutes

Triangulation : un 2e test force le code a se generaliser
Gains  : couverture native, design testable, spec vivante
Piege  : sauter le RED = un test qui ne prouve rien
Partout: meme discipline en JUnit, xUnit, PHPUnit</pre>
<p>Tu connais la théorie du cycle. Prochaine leçon : on le déroule en entier, chrono en main, sur un kata complet — le calcul du prix de location avec remises.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "tests-l11", title: "Ton premier cycle commenté", level: 2,
    statement: "Nouvelle règle de la Ludothèque : « la réservation d'un jeu expire après 48 heures si le membre ne vient pas le chercher ». Déroule PAR ÉCRIT un cycle TDD complet pour la fonction reservation_expiree(reservation, maintenant) : 1) écris le premier test (choisis un cas précis avec des dates concrètes) ; 2) décris le RED attendu et pourquoi c'est la bonne raison ; 3) écris le code GREEN minimal (autorise-toi le code naïf) ; 4) écris le deuxième test qui triangule et le code qui en découle ; 5) propose un REFACTOR avec sa justification. À chaque étape, indique ce que pytest afficherait (rouge ou vert).",
    hints: [
      "Passer « maintenant » en paramètre plutôt qu'appeler datetime.now() dans la fonction : le test t'y pousse naturellement — c'est le design testable du TDD.",
      "Le code GREEN minimal du premier test peut être return True ou return False en dur : c'est le deuxième test qui forcera le calcul des 48 heures.",
      "Pour le refactor, cherche le nombre magique : 48 mérite un nom de constante."
    ],
    solution: "1) RED — premier test :\ndef test_reservation_de_trois_jours_est_expiree():\n    resa = Reservation(creee_le=datetime(2026, 7, 6, 10, 0))\n    assert reservation_expiree(resa, maintenant=datetime(2026, 7, 9, 10, 0)) is True\npytest → NameError: reservation_expiree — bonne raison :\nla fonction n'existe pas, le test détecte bien son absence.\n\n2) GREEN naïf :\ndef reservation_expiree(reservation, maintenant):\n    return True\npytest → vert. Trop simple ? Oui : la suite est incomplète.\n\n3) Triangulation — deuxième test :\ndef test_reservation_du_jour_nest_pas_expiree():\n    resa = Reservation(creee_le=datetime(2026, 7, 9, 8, 0))\n    assert reservation_expiree(resa, maintenant=datetime(2026, 7, 9, 10, 0)) is False\npytest → rouge (return True ne suffit plus). Vrai code :\ndef reservation_expiree(reservation, maintenant):\n    age = maintenant - reservation.creee_le\n    return age > timedelta(hours=48)\npytest → 2 tests verts.\n\n4) REFACTOR :\nDELAI_EXPIRATION = timedelta(hours=48)\ndef reservation_expiree(reservation, maintenant):\n    return maintenant - reservation.creee_le > DELAI_EXPIRATION\npytest → toujours vert : le nettoyage n'a rien cassé.\nBonus design : « maintenant » en paramètre = pas de mock\nnécessaire, l'horloge est injectée (leçon 10 en renfort).",
    note: "Remarque ce que le TDD a produit sans effort : une fonction pure, une horloge injectée, deux tests aux limites. Au kata de la leçon 12, tu enchaîneras quatre cycles comme celui-ci ; et au capstone, chaque règle métier de la Ludothèque naîtra de cette façon — le pipeline CI/CD du cours suivant ne fera que rejouer ces cycles à chaque push." }
