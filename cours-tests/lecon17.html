<script>
var DAY = {
  num: 17,
  title: "Lint et format : flake8, black et les autres",
  subtitle: "Des robots relisent ton code en continu : gratuits, instantanés, jamais de mauvaise humeur.",
  theory: `
<h3>1. Deux familles d'outils</h3>
<p>Le <strong>linter</strong> lit ton code sans l'exécuter et signale les <strong>erreurs probables</strong> et le style douteux : variable jamais utilisée, import mort, comparaison suspecte. Le <strong>formateur</strong>, lui, <strong>réécrit la présentation</strong> : indentation, espaces, longueur de ligne. Le premier critique, le second corrige la forme.</p>
<pre class="pseudo">Linter    (flake8, ruff)  : « ceci est probablement une erreur »
Formateur (black, isort)  : « je réécris la présentation, point »</pre>

<h3>2. flake8 / ruff en pratique</h3>
<p>Installe, puis lance sur la Ludothèque :</p>
<pre class="pseudo">$ pip install flake8
$ flake8 ludotheque/
ludotheque/tarifs.py:12:5: F841 local variable 'remise'
                                is assigned but never used
ludotheque/vues.py:3:1: F401 'datetime' imported but unused
ludotheque/modeles.py:48:80: E501 line too long
                                  (94 &gt; 79 characters)</pre>
<p>Regarde bien F841 : tu as calculé une remise… et tu ne t'en sers jamais. Le prix renvoyé est faux, et aucun test ne l'a encore vu — le linter attrape de <strong>vrais bugs avant même les tests</strong>. <code>ruff</code> fait le même travail beaucoup plus vite et remplace peu à peu flake8 ; les codes d'erreurs restent les mêmes.</p>

<h3>3. black et isort</h3>
<p><code>black</code> applique UN style, quasi sans options. Fini les débats d'espaces et de virgules en revue de code : la question n'existe plus, la machine a tranché. <code>isort</code> complète en triant et regroupant les imports.</p>
<pre class="pseudo">$ black ludotheque/
reformatted ludotheque/tarifs.py
All done! 1 file reformatted.

$ isort ludotheque/     # imports triés : stdlib, tiers, projet</pre>
<p>En une ligne : Java a Checkstyle, C# a dotnet format, PHP a PHP-CS-Fixer — chaque écosystème a son duo linter + formateur.</p>

<h3>4. Pourquoi ça compte</h3>
<p>Trois gains concrets. <strong>Lisibilité</strong> : tout le code du projet se ressemble, on s'y déplace sans friction. <strong>Diffs Git propres</strong> : un <em>diff</em> est la liste des lignes ajoutées et supprimées par une modification ; si personne ne reformate à sa sauce, il ne montre que le fond du changement, jamais du bruit de mise en page. <strong>Revue de code</strong> : l'énergie du relecteur va au design et aux bugs, pas aux virgules — la machine gère la forme, les humains gèrent le fond.</p>

<h3>5. L'intégration au quotidien</h3>
<p>Deux moments clés. <strong>À la sauvegarde</strong> : configure ton éditeur pour lancer black à chaque enregistrement — tu ne penses plus jamais au format. <strong>Avant le commit</strong> : un <strong>hook</strong> (un déclencheur automatique — un bout de code lancé tout seul à un moment précis, ici juste avant chaque commit) <code>pre-commit</code> bloque tout commit qui ne passe pas lint et format.</p>
<pre class="pseudo"># .pre-commit-config.yaml (extrait)
repos:                                              # liste des depots d'outils a brancher
  - repo: https://github.com/psf/black              # 1er outil : black, recupere depuis son depot GitHub
    hooks: [{id: black}]                            # on active le hook "black" (reformatage automatique)
  - repo: https://github.com/pycqa/flake8           # 2e outil : flake8, depuis son depot
    hooks: [{id: flake8}]                           # on active le hook "flake8" (verification du style)</pre>
<p>Et pour toute l'équipe ? C'est le rôle de l'intégration continue : la leçon 11 du cours CI/CD branche lint, format et couverture sur chaque push — impossible de fusionner du code qui ne passe pas.</p>
<div class="warn">Ne mélange jamais le <strong>premier passage de black</strong> avec d'autres changements : le commit de reformatage doit être seul, sinon le diff noie tes vraies modifications sous des centaines de lignes de mise en page.</div>
<div class="tip">Ordre gagnant au quotidien : black à la sauvegarde, flake8 (ou ruff) en continu dans l'éditeur, hook pre-commit en filet. Tu n'y penses plus, et ton code arrive propre en revue.</div>`,
  exercises: [
    { type: "qcm", q: "La différence linter / formateur :", opts: ["Aucune, ce sont des synonymes", "Le linter signale les erreurs probables ; le formateur réécrit la présentation", "Le linter est payant, pas le formateur", "Le formateur exécute les tests"], a: 1, exp: "L'un critique, l'autre corrige la forme." },
    { type: "qcm", q: "F841 (variable assignée mais jamais utilisée) révèle souvent…", opts: ["un problème d'indentation", "un vrai bug : un calcul dont le résultat est perdu", "une ligne trop longue", "un import manquant"], a: 1, exp: "La remise calculée mais jamais appliquée : prix faux, aucun test ne l'a vu." },
    { type: "input", q: "Quel formateur Python impose un style unique, quasi sans options ?", a: ["black"], ph: "nom de l'outil", exp: "black réécrit la présentation ; on ne débat plus du style en revue." },
    { type: "input", q: "Quel outil trie et regroupe les imports Python ?", a: ["isort"], ph: "nom de l'outil", exp: "stdlib, bibliothèques tierces, projet : trois blocs nets." },
    { type: "qcm", q: "Le code flake8 pour un import jamais utilisé :", opts: ["E501", "F401", "W291", "B008"], a: 1, exp: "F401 : l'import mort encombre et trompe le lecteur." },
    { type: "qcm", q: "E501 signale…", opts: ["une ligne trop longue", "une variable non utilisée", "une fonction trop lente", "un test qui échoue"], a: 0, exp: "Au-delà de la limite configurée (79 ou 88 caractères)." },
    { type: "vf", q: "black corrige les bugs de logique.", a: false, exp: "Il ne touche qu'à la présentation ; les bugs relèvent des tests et du linter." },
    { type: "qcm", q: "Un style unique imposé par black aide la revue de code car…", opts: ["le code devient plus rapide", "l'énergie du relecteur va au fond, pas aux virgules", "les tests deviennent inutiles", "Git devient optionnel"], a: 1, exp: "La machine gère la forme, les humains le design et les bugs." },
    { type: "qcm", q: "Le lien entre formatage cohérent et Git :", opts: ["Aucun", "Les diffs ne montrent que le fond, sans bruit de mise en page", "Git refuse le code non formaté", "Les commits deviennent plus petits en octets"], a: 1, exp: "Si personne ne reformate à sa sauce, chaque diff est lisible." },
    { type: "qcm", q: "Un hook pre-commit…", opts: ["s'exécute après le push", "bloque le commit si lint ou format échouent", "formate le README", "supprime les branches"], a: 1, exp: "Le filet local avant le filet d'équipe (la CI)." },
    { type: "input", q: "Quel linter moderne, très rapide, remplace peu à peu flake8 ?", a: ["ruff"], ph: "nom de l'outil", exp: "Mêmes codes d'erreurs, vitesse fulgurante." },
    { type: "vf", q: "Un linter doit exécuter ton code pour trouver les erreurs.", a: false, exp: "Analyse statique : il lit le code sans le lancer." },
    { type: "qcm", q: "L'équivalent Java d'un linter de style :", opts: ["Checkstyle", "MockMvc", "JUnit", "pytest"], a: 0, exp: "Et dotnet format côté C#, PHP-CS-Fixer côté PHP." },
    { type: "qcm", q: "L'automatisation du lint pour TOUTE l'équipe se fait…", opts: ["par un e-mail de rappel", "dans l'intégration continue (cours CI/CD, leçon 11)", "à la main chaque vendredi", "jamais"], a: 1, exp: "Chaque push est vérifié : impossible de fusionner du code sale." },
    { type: "vf", q: "Le linter peut attraper un bug avant même que les tests ne tournent.", a: true, exp: "Variable calculée jamais utilisée, import mort : des erreurs bien réelles, détectées à la lecture." }
  ],
  final: {
    title: "Exercice final — La chaîne de propreté",
    intro: `<p>flake8 crie, black réécrit : vérifions que tu sais qui fait quoi, et quand.</p>`,
    questions: [
      { type: "qcm", q: "Qui RÉÉCRIT le code, sans poser de question ?", opts: ["flake8", "pytest", "black", "coverage"], a: 2, exp: "Le formateur réécrit ; le linter signale." },
      { type: "input", q: "Quelle commande vérifie le style et les erreurs probables de ludotheque/ ?", a: ["flake8 ludotheque/", "flake8 ludotheque", "ruff check ludotheque/"], ph: "commande", exp: "flake8 ludotheque/ (ou ruff check) : la liste des avertissements, fichier par fichier." },
      { type: "vf", q: "Le premier passage de black sur un projet doit être un commit séparé.", a: true, exp: "Sinon le reformatage massif noie tes vraies modifications dans le diff." },
      { type: "qcm", q: "Le bon ordre d'intégration au quotidien :", opts: ["CI d'abord, éditeur jamais", "éditeur (à la sauvegarde) → hook pre-commit → CI pour l'équipe", "hook post-push uniquement", "à la main une fois par mois"], a: 1, exp: "Trois filets emboîtés, du plus rapide au plus collectif." },
      { type: "qcm", q: "PHP-CS-Fixer est l'équivalent PHP de…", opts: ["pytest", "black / dotnet format", "MySQL", "git merge"], a: 1, exp: "Chaque écosystème a son formateur standard." }
    ],
    solution: `<pre class="pseudo">Linter    : flake8 / ruff → erreurs probables (F841, F401, E501)
Formateur : black (un seul style) + isort (imports)
Pourquoi  : lisibilité, diffs Git propres, revue centrée sur le fond
Quand     : à la sauvegarde (éditeur), avant commit (pre-commit),
            à chaque push (CI — cours CI/CD, leçon 11)
Ailleurs  : Checkstyle (Java), dotnet format (C#), PHP-CS-Fixer (PHP)</pre>
<p>La machine s'occupe désormais de la forme. Prochaine leçon : ce que seuls les humains savent relire — la revue de code.</p>`
  }
};
</script>
