<body>
<script>
var DAY = {
  num: 14,
  title: "La couverture de code : mesurer sans se mentir",
  subtitle: "coverage.py te dit quelles lignes tes tests n'ont JAMAIS vues — et c'est tout ce qu'il te dit.",
  theory: `
<h3>1. Ce que mesure la couverture</h3>
<p>La <strong>couverture de code</strong> répond à une question simple : quelles lignes de ton code ont été <strong>exécutées</strong> pendant la suite de tests ? L'outil Python de référence est <code>coverage.py</code>, branché sur pytest par le <strong>plugin</strong> <code>pytest-cov</code> (un plugin est un module d'extension qui ajoute des fonctionnalités à un outil existant) :</p>
<pre class="pseudo">$ pip install pytest-cov
$ pytest --cov=ludotheque --cov-report=term-missing

Name                    Stmts   Miss  Cover   Missing
ludotheque/tarifs.py       24      6    75%   31-36
ludotheque/factures.py     58     20    66%   40-52, 71
ludotheque/modeles.py      31      0   100%
TOTAL                     113     26    77%</pre>
<p>Lecture : dans <code>tarifs.py</code>, 6 instructions sur 24 n'ont jamais tourné — les lignes 31 à 36. En une ligne : Java mesure avec JaCoCo, C# avec Coverlet, PHP avec PCOV ou Xdebug.</p>

<h3>2. La colonne qui compte : Missing</h3>
<p>Le pourcentage attire l'oeil, mais la vraie information est la colonne <code>Missing</code>. Ouvre les lignes 31-36 de <code>tarifs.py</code> : c'est le bloc <code>except</code> qui gère l'API de cotation en panne. Traduction : <strong>le chemin d'erreur n'a jamais été testé</strong> — précisément le genre de code qui explose un samedi en production. Le rapport HTML rend la chasse visuelle, lignes rouges sur fond de code :</p>
<pre class="pseudo">$ pytest --cov=ludotheque --cov-report=html   # genere le rapport sous forme de pages HTML colorees
$ ouvrir htmlcov/index.html     # lignes vertes = vues, rouges = jamais</pre>

<h3>3. Lignes ou branches : le if à moitié testé</h3>
<p>La couverture de <strong>lignes</strong> a un angle mort : un <code>if</code> sans <code>else</code> peut être « couvert » alors qu'un seul de ses deux chemins a tourné. La couverture de <strong>branches</strong> (<code>--cov-branch</code>) vérifie que chaque condition a été prise <strong>dans les deux sens</strong> :</p>
<pre class="pseudo">def calcul_prix_location(prix_jour, jours):   # exemple : un if dont un seul chemin est teste
    prix = prix_jour * jours                  # prix de base
    if jours &gt;= 7:            # teste seulement avec jours=7 ?
        prix = prix * 0.90    # lignes 100% couvertes...
    return prix               # ...mais le chemin SANS remise jamais pris !

$ pytest --cov=ludotheque --cov-branch    # demasque le if a moitie teste</pre>

<h3>4. Le grand mensonge : 100 pour cent ≠ zéro bug</h3>
<p>Voici un test qui porte la couverture de <code>calculer_facture</code> à 100 pour cent :</p>
<pre class="pseudo">def test_facture():                   # un "test" qui n'en a que le nom
    calculer_facture(membre_type)     # execute tout... ne VERIFIE rien</pre>
<p>Pas un seul assert : chaque ligne a tourné, aucune n'a été <strong>vérifiée</strong>. La couverture mesure l'<strong>exécution</strong>, pas la <strong>vérification</strong>. Autres angles morts : les asserts faibles (<code>assert prix &gt; 0</code> quand on attendait 12.60), les <strong>cas absents</strong> (ton code du palier à 7 jours est couvert, mais as-tu testé 6 ET 7 ?), et tout ce qui n'est pas écrit (la remise oubliée n'apparaît dans aucun rapport). Conclusion : une couverture <strong>basse est une alarme fiable</strong> (« pas testé »), une couverture <strong>haute n'est PAS une garantie</strong> (« exécuté, peut-être vérifié »).</p>

<h3>5. S'en servir intelligemment</h3>
<p>Trois usages sains. <strong>Boussole</strong> : après une séance de tests sur le legacy (leçon 13), le rapport montre où le filet a des trous — le bloc except oublié. <strong>Garde-fou d'équipe</strong> : un seuil qui empêche la régression, sans course au chiffre :</p>
<pre class="pseudo"># pyproject.toml
[tool.coverage.report]   # section de configuration de coverage.py dans le fichier du projet
fail_under = 80        # la suite echoue sous 80% — la CI s'en servira</pre>
<p><strong>Filtre de revue</strong> : du code neuf qui arrive avec 40 pour cent de couverture mérite une question en pull request. À l'inverse, viser 100 pour cent partout pousse à écrire des tests sans assert pour « faire le chiffre » — le indicateur devient l'objectif, et il ment (loi de Goodhart).</p>
<div class="warn">Ne transforme jamais la couverture en objectif de performance (« l'équipe doit atteindre 95 pour cent »). Le jour où le chiffre devient la cible, les tests sans assert apparaissent, le chiffre monte… et la confiance qu'il mesurait disparaît.</div>
<div class="tip">Réflexe hebdo : ouvre le rapport HTML et lis UNIQUEMENT la colonne Missing des fichiers critiques (tarifs, factures). Chaque bloc rouge est une question : « et si ce chemin tournait en prod ce soir ? »</div>`,
  exercises: [
    { type: "qcm", q: "La couverture de code mesure…", opts: ["Le nombre de bugs", "Les lignes exécutées pendant la suite de tests", "La vitesse des tests", "La qualité des asserts"], a: 1, exp: "Exécutées — pas vérifiées : toute la nuance de la leçon." },
    { type: "input", q: "L'outil Python de référence pour mesurer la couverture :", a: ["coverage.py", "coverage"], ph: "nom de l'outil", exp: "Branché sur pytest via le plugin pytest-cov." },
    { type: "qcm", q: "L'option pytest qui affiche les lignes jamais exécutées :", opts: ["--verbose", "--cov-report=term-missing", "--tb=short", "--maxfail=1"], a: 1, exp: "La colonne Missing : la vraie information du rapport." },
    { type: "qcm", q: "Dans le rapport, tarifs.py affiche « 75% , Missing 31-36 ». La lecture correcte :", opts: ["75% des tests passent", "Les lignes 31 à 36 n'ont jamais tourné pendant les tests", "Le fichier a 36 bugs", "31 tests sur 36 sont verts"], a: 1, exp: "Souvent un bloc except ou un chemin d'erreur oublié." },
    { type: "qcm", q: "Le rapport HTML (htmlcov/index.html) sert à…", opts: ["Déployer le site", "Voir en couleur, ligne par ligne, ce qui n'a jamais été exécuté", "Formater le code", "Générer la documentation"], a: 1, exp: "Lignes vertes = vues, rouges = jamais : la chasse devient visuelle." },
    { type: "qcm", q: "Un if sans else testé dans un seul sens : la couverture de LIGNES dit…", opts: ["100% — c'est son angle mort", "0%", "50%", "Erreur"], a: 0, exp: "Toutes les lignes ont tourné, mais un chemin n'a jamais été pris." },
    { type: "input", q: "L'option qui active la couverture de branches :", a: ["--cov-branch", "cov-branch"], ph: "option…", exp: "Chaque condition doit avoir été prise dans les deux sens." },
    { type: "qcm", q: "Un test sans assert qui appelle toute la fonction :", opts: ["Est refusé par pytest", "Donne 100% de couverture et ne vérifie rien", "Donne 0% de couverture", "Est un test de caractérisation"], a: 1, exp: "La couverture mesure l'exécution, pas la vérification." },
    { type: "vf", q: "Une couverture de 100% garantit l'absence de bugs.", a: false, exp: "Asserts absents ou faibles, cas manquants, code jamais écrit : le chiffre ne voit rien de tout ça." },
    { type: "vf", q: "Une couverture basse est une information fiable : ce code n'est pas testé.", a: true, exp: "L'alarme est sûre dans ce sens-là ; c'est le sens inverse qui ment." },
    { type: "qcm", q: "La remise oubliée (jamais codée) apparaît dans le rapport de couverture…", opts: ["En rouge", "Nulle part : on ne mesure que le code qui existe", "À 50%", "Dans la colonne Missing"], a: 1, exp: "Le rapport ne connaît que les lignes écrites — pas les règles absentes." },
    { type: "qcm", q: "fail_under = 80 dans la config signifie…", opts: ["80 tests minimum", "La suite échoue si la couverture passe sous 80% : un garde-fou anti-régression", "80 secondes maximum", "80 fichiers couverts"], a: 1, exp: "Un plancher qui empêche de reculer, sans course au chiffre." },
    { type: "qcm", q: "Pourquoi viser 100% partout est-il contre-productif ?", opts: ["C'est trop rapide", "On finit par écrire des tests sans assert pour faire le chiffre : l'indicateur ment", "coverage.py plante à 100%", "Les tests deviennent trop précis"], a: 1, exp: "Quand la mesure devient l'objectif, elle cesse d'être une bonne mesure (Goodhart)." },
    { type: "vf", q: "JaCoCo (Java) et Coverlet (C#) jouent le même rôle que coverage.py.", a: true, exp: "Et PCOV ou Xdebug côté PHP : chaque écosystème a son outil." },
    { type: "qcm", q: "L'usage le plus sain du rapport après une séance de tests sur du legacy :", opts: ["Encadrer le pourcentage au mur", "Lire la colonne Missing pour repérer les trous du filet (blocs except, chemins d'erreur)", "Supprimer les fichiers à 100%", "Le montrer au client"], a: 1, exp: "La couverture est une boussole vers ce qui reste à tester." }
  ],
  final: {
    title: "Exercice final — Le chiffre et la vérité",
    intro: `<p>Le rapport de la Ludothèque affiche 77%. Avant de fêter ou de paniquer : que dit-il vraiment ?</p>`,
    questions: [
      { type: "qcm", q: "factures.py : « 66%, Missing 40-52 » où vivent les blocs except. La priorité :", opts: ["Écrire les tests des chemins d'erreur (leçon 4 : pytest.raises, leçon 10 : side_effect)", "Supprimer les except", "Passer le fichier en 100% avec un test sans assert", "Ignorer"], a: 0, exp: "Les chemins d'erreur non testés explosent toujours au pire moment." },
      { type: "vf", q: "modeles.py est à 100% : ce fichier est donc garanti sans bug.", a: false, exp: "Exécuté ne veut pas dire vérifié — et les cas absents ne se mesurent pas." },
      { type: "qcm", q: "calcul_prix_location est couverte à 100% en lignes, mais testée seulement avec jours=7. Qui le démasque ?", opts: ["--cov-branch : le chemin sans remise n'a jamais été pris", "Le rapport HTML seul", "black", "git log"], a: 0, exp: "La couverture de branches exige les deux sens de chaque condition." },
      { type: "input", q: "Le réglage de configuration qui fait échouer la suite sous un seuil de couverture :", a: ["fail_under", "fail_under = 80"], ph: "réglage…", exp: "Dans pyproject.toml — la CI du cours suivant s'en servira à chaque push." },
      { type: "qcm", q: "La phrase juste sur la couverture :", opts: ["Haute = code sans bug", "Basse = alarme fiable ; haute = exécuté, pas forcément vérifié", "Elle remplace les tests", "Elle mesure la qualité des asserts"], a: 1, exp: "La leçon en une ligne : mesurer sans se mentir." }
    ],
    solution: `<pre class="pseudo">Outil     : coverage.py + pytest-cov
Commande  : pytest --cov=ludotheque --cov-report=term-missing
La cle    : la colonne Missing (les lignes JAMAIS vues), pas le %
Branches  : --cov-branch demasque le if a moitie teste
LE PIEGE  : 100% ≠ zero bug — execution ≠ verification
            (test sans assert, asserts faibles, cas absents,
             code jamais ecrit : invisibles au rapport)
Sain      : boussole vers les trous + fail_under en garde-fou
Ailleurs  : JaCoCo (Java), Coverlet (C#), PCOV/Xdebug (PHP)</pre>
<p>Tu sais mesurer ton filet sans te raconter d'histoires. Prochaine leçon : on monte d'un étage dans la pyramide — les tests d'intégration contre une vraie base de données.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l14", title: "L'audit du rapport de couverture", level: 2,
    statement: "Le rapport de la Ludothèque : tarifs.py 100% — factures.py 62%, Missing 40-52 (le bloc except CotationIndisponible) et 71 (le plafond des frais) — export.py 15% — modeles.py 100% mais couvert notamment par test_tout() qui appelle chaque méthode sans un seul assert. Rédige ton audit : pour chaque fichier, dis ce que le chiffre dit VRAIMENT, ce qu'il cache peut-être, et l'action concrète que tu recommandes (avec les leçons du cours à mobiliser : pytest.raises, side_effect, caractérisation…). Termine par ta recommandation de seuil fail_under pour l'équipe, justifiée en deux phrases.",
    hints: [
      "Deux fichiers affichent 100% : leur situation est-elle vraiment la même ? Cherche la différence entre exécuté et vérifié.",
      "Pour la ligne 71 (le plafond), la couverture dit « jamais exécuté » : quel cas de test des leçons 4 et 7 manque-t-il ?",
      "Le seuil fail_under doit être atteignable aujourd'hui : un plancher anti-régression, pas un objectif de course."
    ],
    solution: "tarifs.py — 100%\n  Dit : toutes les lignes ont tourné. Cache : les cas absents\n  (les deux côtés du palier ? l'arrondi ?) et la force des asserts.\n  Action : relire les tests, ajouter --cov-branch pour vérifier\n  que chaque if a été pris dans les deux sens.\n\nfactures.py — 62%, Missing 40-52 et 71\n  Dit : le bloc except CotationIndisponible et le plafond ne sont\n  JAMAIS testés — les deux chemins qui casseront en prod.\n  Action : leçon 10 (side_effect=TimeoutError pour déclencher\n  l'except) + leçon 7 (cas de barème pile au plafond). Priorité 1.\n\nexport.py — 15%\n  Dit : quasi pas de filet. C'est du legacy au sens de la leçon 13.\n  Action : tests de caractérisation avec tmp_path (leçon 6)\n  AVANT toute modification. Pas besoin de 100% : couvrir ce\n  qu'on touchera.\n\nmodeles.py — 100%... par un test sans assert\n  Dit : exécuté. Cache : RIEN n'est vérifié — le pire cas du\n  rapport : un faux sentiment de sécurité. Action : réécrire\n  test_tout() en vrais tests AAA avec asserts ; le chiffre\n  baissera peut-être, la confiance montera.\n\nSeuil : fail_under = 60 aujourd'hui (juste sous l'existant),\nremonté par crans à mesure que factures et export se couvrent.\nUn plancher anti-régression atteignable — jamais un objectif\nde course, sinon les tests sans assert reviendront.",
    note: "Cet audit — distinguer le chiffre de la vérité fichier par fichier — est exactement ce qu'un lead demande avant une mise en production. Au cours CI/CD, la leçon « lint, format, couverture » branchera fail_under sur chaque push : ton seuil raisonné d'aujourd'hui deviendra une règle automatique du pipeline." }
  ]
};
</script>
