<script>
var DAY = {
  num: 1,
  title: "Pourquoi tester ? Le coût du bug",
  subtitle: "Un bug attrapé pendant l'écriture coûte 1 ; le même bug en production coûte 100.",
  theory: `
<h3>1. Le scénario catastrophe</h3>
<p>La Ludothèque — ton application de location et vente de jeux du Niveau 6 (Python·Django·MySQL) — est en ligne. Trois semaines plus tard, un client furieux appelle : il a payé 30 € au lieu de 25 € pour dix jours de location. Le coupable : <code>calcul_prix_location</code>, qui n'applique jamais le tarif dégressif.</p>
<p>Avant de lire le code, posons les mots. Une <strong>fonction</strong> est une petite machine à qui l'on donne des informations (ses <strong>paramètres</strong>, ici le nombre de <code>jours</code>) et qui rend un résultat (ici un prix) — comme une machine à café à qui l'on glisse une pièce et qui rend un café. En Python, <code>def</code> (de l'anglais <em>define</em>, « définir ») annonce « je crée une fonction ». <code>return</code> (« renvoyer ») donne le résultat et <strong>arrête</strong> la fonction sur-le-champ. <code>if</code> veut dire « si » : c'est un aiguillage qui n'exécute la suite que lorsque sa condition est vraie. <code>jours</code> est une <strong>variable</strong>, c'est-à-dire une boîte étiquetée qui contient une valeur. Le symbole <code>#</code> introduit un <strong>commentaire</strong> : une note pour les humains, totalement ignorée par l'ordinateur. Un <strong>tarif dégressif</strong>, enfin, est un prix qui baisse quand on prend davantage (moins cher au-delà de 5 jours).</p>
<pre class="pseudo">def calcul_prix_location(jours):   # DEFINIT une fonction nommee calcul_prix_location qui recoit un nombre de "jours"
    # tarif : 3 euros/jour les 5 premiers jours, 2 euros/jour ensuite   # commentaire pour l'humain (ignore par la machine)
    if jours &lt;= 5:                  # SI le nombre de jours est inferieur ou egal a 5...
        return jours * 3           # ...renvoyer jours x 3 euros, et ARRETER la fonction ici
    return jours * 3               # BUG : on DEVRAIT appliquer le tarif degressif ; ici on refacture 3 euros/jour a tout le monde</pre>
<p>Bilan : des dizaines de clients surfacturés, des remboursements, des excuses publiques. Un test de dix lignes l'aurait attrapé <strong>avant</strong> la mise en ligne.</p>

<h3>2. Le coût d'un bug explose avec le temps</h3>
<p>Plus un bug est découvert <strong>tard</strong>, plus il coûte cher — le contexte est perdu, d'autres couches se sont construites dessus, et des humains sont touchés. Le tableau ci-dessous n'est pas du code : c'est une échelle de coûts, où <code>→</code> se lit « donne un coût de ». Les nombres sont relatifs (le coût le plus faible vaut 1).</p>
<pre class="pseudo">Pendant l'ecriture  →  cout ~ 1    (tu corriges en trente secondes, le contexte est encore en tete)
En phase de tests   →  cout ~ 10   (il faut retrouver le contexte, corriger, puis relivrer)
En recette client   →  cout ~ 50   (aller-retour avec le client, replanification, confiance ecornee)
En production       →  cout ~ 100+ (clients touches, remboursements, reputation abimee)</pre>

<h3>3. Ce qu'apportent les tests automatisés</h3>
<p>D'abord, un mot sur le vocabulaire. Un <strong>test automatisé</strong> est un petit programme qui en exécute un autre et vérifie tout seul que le résultat est correct — sans qu'un humain ait à regarder. Une <strong>régression</strong> est un bug qui réapparaît (ou apparaît) parce qu'on a modifié le code ailleurs. <strong>Refactorer</strong>, c'est réorganiser le code pour le rendre plus propre sans changer ce qu'il fait.</p>
<p>Les tests apportent trois choses, et elles changent la vie. <strong>Un filet anti-régression</strong> : chaque modification relance tous les tests ; si tu casses le barème en touchant au catalogue, une alarme sonne — comme le filet du trapéziste, invisible tant qu'on ne tombe pas. <strong>Une documentation exécutable</strong> : le test <code>test_prix_10_jours_avec_tarif_degressif</code> décrit le comportement attendu et vérifie qu'il tient toujours — contrairement à un document Word, il ne peut pas mentir. <strong>La confiance pour modifier</strong> : refactorer, optimiser, nettoyer sans peur, puisque le filet est là.</p>

<h3>4. Test manuel vs test automatisé</h3>
<p>Tester à la main (« je clique, je regarde ») marche une fois, puis on oublie, on se lasse, on se trompe. Le test automatisé est <strong>répétable</strong> (mêmes étapes, à l'identique), <strong>rapide</strong> (des centaines de vérifications en quelques secondes), <strong>objectif</strong> (vert ou rouge, pas d'interprétation) et <strong>lancé à chaque changement</strong> — c'est ce dernier point qui fait le filet.</p>
<pre class="pseudo">Manuel     : lent, fastidieux, oublie, subjectif, abandonne des la 3e fois
Automatise : repetable, rapide, objectif, relance a CHAQUE modification</pre>

<h3>5. Le fil conducteur du cours</h3>
<p>Nous allons tester <strong>la Ludothèque</strong> : <code>calcul_prix_location</code>, la règle « un jeu déjà loué ne peut pas l'être à nouveau », les frais de retard, le catalogue. Outil : <strong>pytest</strong>, le framework de tests standard en Python. Un <strong>framework</strong> est une boîte à outils toute prête qui prend en charge le travail répétitif (ici : lancer les tests, compter les réussites, afficher les échecs en rouge). Tout ce que tu apprendras se transpose mot pour mot en Java (JUnit), C# (xUnit) et PHP (PHPUnit) : mêmes concepts, autre syntaxe.</p>
<div class="warn">« Les tests montrent la <strong>présence</strong> de bugs, jamais leur <strong>absence</strong> » (Dijkstra). Une suite verte ne prouve pas que le programme est correct — elle prouve que les comportements testés tiennent encore.</div>
<div class="tip">Ce cours prépare directement le « job de tests » du cours CI/CD : la suite pytest que tu vas construire est exactement ce qu'un pipeline lancera à chaque push.</div>`,
  exercises: [
    { type: "qcm", q: "Dans le scénario d'ouverture, le bug de calcul_prix_location est découvert…", opts: ["Pendant l'écriture du code", "Pendant la phase de tests", "En recette client", "En production, par les clients surfacturés"], a: 3, exp: "Le pire moment : remboursements, excuses, réputation écornée." },
    { type: "qcm", q: "Plus un bug est découvert tard…", opts: ["Moins il coûte cher", "Plus il coûte cher", "Son coût ne change pas", "Il finit par disparaître tout seul"], a: 1, exp: "De ~1 pendant l'écriture à ~100+ en production." },
    { type: "qcm", q: "Le moment le moins coûteux pour attraper un bug :", opts: ["Pendant l'écriture du code", "En recette client", "En production", "Pendant la démo au client"], a: 0, exp: "Trente secondes de correction, contexte encore en tête." },
    { type: "qcm", q: "Un « filet anti-régression », c'est…", opts: ["Un antivirus", "Une sauvegarde Git", "Des tests relancés à chaque modification, qui sonnent si on casse un comportement", "Une revue manuelle du code avant chaque livraison"], a: 2, exp: "Tu touches au catalogue, le test du barème te prévient si tu l'as cassé." },
    { type: "qcm", q: "Les tests comme « documentation exécutable » signifient que…", opts: ["Ils remplacent le manuel utilisateur", "Ils décrivent le comportement attendu ET vérifient qu'il tient toujours", "Ils génèrent un PDF automatiquement", "Ils ajoutent des commentaires au code"], a: 1, exp: "Contrairement à un document Word, un test qui passe ne peut pas mentir." },
    { type: "vf", q: "Une suite de tests qui passe prouve que le programme n'a aucun bug.", a: false, exp: "Dijkstra : les tests montrent la présence de bugs, jamais leur absence." },
    { type: "qcm", q: "Par rapport au test manuel, le test automatisé est…", opts: ["Répétable, rapide, objectif, relancé à chaque changement", "Plus lent mais plus sûr", "Réservé aux très gros projets", "Impossible à relancer deux fois"], a: 0, exp: "Les quatre qualités vues en section 4." },
    { type: "qcm", q: "Le principal défaut du test manuel :", opts: ["Il est interdit en entreprise", "Il exige un framework de test payant", "Il est lent, fastidieux, et on cesse vite de le refaire à chaque changement", "Il ne détecte jamais rien"], a: 2, exp: "Utile ponctuellement, mais il ne fait pas de filet." },
    { type: "vf", q: "Un test automatisé peut être relancé à l'identique après chaque modification du code.", a: true, exp: "C'est exactement ce qui en fait un filet anti-régression." },
    { type: "input", q: "Quel framework de tests Python utiliserons-nous dans tout ce cours ?", a: ["pytest"], ph: "nom du framework", exp: "Le standard du monde Python, installé dès la leçon 3." },
    { type: "qcm", q: "L'équivalent de pytest dans le monde Java :", opts: ["PHPUnit", "JUnit", "xUnit", "Mocha"], a: 1, exp: "xUnit pour C#, PHPUnit pour PHP : mêmes concepts, autre syntaxe." },
    { type: "input", q: "Comment appelle-t-on un bug qui réapparaît (ou apparaît) à cause d'une modification du code ?", a: ["régression", "regression", "une régression"], ph: "un mot", exp: "D'où le nom de « filet anti-régression »." },
    { type: "qcm", q: "Le projet fil conducteur de ce cours :", opts: ["Un blog de cuisine", "Un carnet de recettes", "Un jeu vidéo 3D", "La Ludothèque, application de location et vente de jeux"], a: 3, exp: "Ton projet du Niveau 6 : Python, Django, MySQL." },
    { type: "vf", q: "Les tests donnent confiance pour modifier le code : si une modification casse un comportement, un test le signale.", a: true, exp: "Refactorer sans peur, c'est le troisième apport majeur." },
    { type: "qcm", q: "« Les tests montrent la présence de bugs, jamais leur absence » est une phrase de…", opts: ["Edsger Dijkstra", "Linus Torvalds", "Guido van Rossum", "Ada Lovelace"], a: 0, exp: "À garder en tête pendant tout le cours : humilité obligatoire." }
  ],
  final: {
    title: "Exercice final — Le coût du bug, en place",
    intro: `<p>Avant d'écrire le moindre test, on vérifie que le « pourquoi » est solide.</p>`,
    questions: [
      { type: "qcm", q: "Où un bug coûte-t-il le plus cher ?", opts: ["Pendant l'écriture", "En phase de tests", "En recette client", "En production"], a: 3, exp: "Clients touchés, remboursements, image : coût ~100+." },
      { type: "qcm", q: "Les trois apports majeurs des tests automatisés :", opts: ["Vitesse du code, RAM, design", "Filet anti-régression, documentation exécutable, confiance pour modifier", "Sauvegarde, chiffrement, compression", "Refactoring automatique, compilation, déploiement"], a: 1, exp: "Le trio de la section 3." },
      { type: "vf", q: "Un test manuel est objectif et répétable à l'identique.", a: false, exp: "C'est précisément la faiblesse que l'automatisation corrige." },
      { type: "qcm", q: "La fonction de la Ludothèque au cœur du scénario catastrophe :", opts: ["envoyer_facture", "calcul_prix_location", "ajouter_jeu_catalogue", "connexion_membre"], a: 1, exp: "Elle nous suivra pendant tout le cours." },
      { type: "input", q: "Le framework de tests cité comme équivalent de pytest dans le monde PHP :", a: ["phpunit"], ph: "nom du framework", exp: "JUnit en Java, xUnit en C#, PHPUnit en PHP." }
    ],
    solution: `<pre class="pseudo">Scenario  : bug du tarif degressif decouvert en production → clients surfactures
Cout      : ecriture ~1  &lt;  tests ~10  &lt;  recette ~50  &lt;  production ~100+
Apports   : filet anti-regression + documentation executable + confiance
Manuel    : lent, subjectif, oublie  |  Automatise : repetable, rapide, objectif
Fil rouge : tester la Ludotheque avec pytest (JUnit / xUnit / PHPUnit ailleurs)

Dijkstra  : les tests montrent la PRESENCE de bugs, jamais leur absence.</pre>
<p>Le pourquoi est posé. La suite : « Anatomie d'un test : Arrange, Act, Assert » — on dissèque un test pour comprendre ses trois temps.</p>`
  }
};
</script>
