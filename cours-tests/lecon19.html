  title: "Refactorer sans peur : les tests comme filet",
  subtitle: "Changer la structure sans changer le comportement — et le prouver à chaque pas.",
  theory: `
<h3>1. Refactorer : une définition stricte</h3>
<p><strong>Refactorer</strong>, c'est améliorer la <strong>structure</strong> du code — noms, découpage, duplication — <strong>sans changer son comportement</strong> observable. La définition est stricte : si le prix calculé change, si une exception apparaît ou disparaît, ce n'est plus un refactoring, c'est une modification. Et comment PROUVER que le comportement n'a pas changé ? C'est tout le cours qui répond : <strong>les tests</strong>. Verts avant, verts après — sans eux, refactorer c'est marcher sur un fil sans filet, et c'est pour ça qu'on a caractérisé le legacy (leçon 13) avant d'y toucher.</p>
<pre class="pseudo">Le rituel : 1. pytest → tout VERT (sinon, on ne refactore pas)
            2. UN petit changement de structure
            3. pytest → tout VERT ? → commit
            4. rouge ? → annuler, pas plus petit, recommencer</pre>

<h3>2. Les déclencheurs : sentir les code smells</h3>
<p>Quand refactorer ? Quand le code <strong>sent</strong> : les <em>code smells</em> sont des symptômes, pas des bugs. Les plus courants dans la Ludothèque : la <strong>fonction à rallonge</strong> (calculer_facture, 120 lignes), la <strong>duplication</strong> (le calcul de remise copié dans trois vues), les <strong>nombres magiques</strong> (0.90, 3, 48), le <strong>nom menteur</strong> (une fonction get_jeu qui en réalité crée le jeu), les <strong>if imbriqués</strong> à trois étages. Un smell ne t'oblige à rien : il te signale un endroit où la prochaine modification coûtera cher.</p>

<h3>3. Les petits pas : un refactoring à la fois</h3>
<p>Le secret des refactoreurs sereins : des pas <strong>minuscules et nommés</strong>. Les grands classiques : <strong>renommer</strong> (variable, fonction — l'<strong>IDE</strong>, l'environnement de développement intégré, c'est-à-dire le logiciel dans lequel on écrit le code, le fait partout d'un coup), <strong>extraire une fonction</strong> (un bloc de 10 lignes devient remise_duree(prix, jours)), <strong>extraire une variable</strong> (une expression illisible reçoit un nom), <strong>remplacer un nombre magique par une constante</strong>, <strong>inverser un if</strong> en clause de garde. Un pas = un lancement de pytest = un commit. Exemple sur les if imbriqués :</p>
<pre class="pseudo"># AVANT : trois etages d'imbrication
def louer(jeu, membre):                             # fonction : tenter de louer un jeu a un membre
    if jeu is not None:                             # 1er etage : seulement si le jeu existe...
        if jeu.est_disponible:                      # 2e etage : ...et s'il est disponible...
            if membre.peut_louer():                 # 3e etage : ...et si le membre a le droit de louer...
                return creer_location(jeu, membre)  # ...alors on cree la location (tout au fond de l'imbrication)

# APRES : clauses de garde — meme comportement, lisible
def louer(jeu, membre):                             # meme fonction, meme resultat
    if jeu is None:                                 # on ecarte d'abord le cas "pas de jeu"...
        return None                                 # ...en sortant tout de suite (c'est une "clause de garde")
    if not jeu.est_disponible:                      # jeu indisponible ?...
        return None                                 # ...on sort
    if not membre.peut_louer():                     # membre pas autorise ?...
        return None                                 # ...on sort
    return creer_location(jeu, membre)              # arrive ici, tout est bon : on cree la location</pre>
<p>Entre les deux versions : pytest, vert, commit « Refactor: clauses de garde dans louer ». En une ligne : ces refactorings portent les mêmes noms dans tous les langages — les IDE Java, C# et PHP les automatisent aussi.</p>

<h3>4. Rouge pendant un refactoring : la règle d'or</h3>
<p>Tu extrais une fonction, pytest passe au rouge. Réflexe de débutant : déboguer en avant, rafistoler. Réflexe de pro : <strong>annuler</strong> (git restore, ou l'annulation de l'éditeur) et recommencer en <strong>plus petit</strong>. Un refactoring n'a aucune urgence : le code marchait avant, il doit marcher après. Cinq minutes de replay valent mieux qu'une heure de débogage sur un état intermédiaire cassé. C'est exactement pour ça que le rituel dit <strong>un pas = un commit</strong> : le dernier état vert n'est jamais loin.</p>

<h3>5. Refactoring et fonctionnalité : jamais dans le même commit</h3>
<p>Le piège du quotidien : « pendant que j'ajoute la remise fidélité, je renomme aussi ces cinq variables et je découpe cette fonction ». Résultat : un diff où le relecteur (leçon 18) ne distingue plus <strong>ce qui change le comportement</strong> de ce qui n'est que structure. La discipline : <strong>d'abord refactorer</strong> (tests verts, comportement identique, commit), <strong>puis ajouter</strong> la fonctionnalité (TDD, commit). Deux commits, deux intentions, une revue facile — souvent résumé par la formule : « make the change easy, then make the easy change » (rends le changement facile, puis fais le changement facile).</p>
<div class="warn">Refactorer <strong>sans filet</strong> — sur du code non testé — n'est pas du refactoring, c'est de la roulette : rien ne te dira que le comportement a changé. Sur du code nu, commence TOUJOURS par des tests de caractérisation (leçon 13), refactore ensuite.</div>
<div class="tip">Profite de chaque passage : la règle du boy-scout s'applique au refactoring. Tu touches tarifs.py pour un bug ? Un renommage ou une extraction en plus (dans un commit séparé), et le fichier est un peu plus sain qu'hier.</div>`,
  exercises: [
    { type: "qcm", q: "Refactorer, c'est…", opts: ["Corriger des bugs", "Améliorer la structure SANS changer le comportement observable", "Ajouter des fonctionnalités", "Réécrire le projet"], a: 1, exp: "Si le comportement change, ce n'est plus un refactoring." },

    { type: "qcm", q: "Extraire un bloc de 10 lignes en fonction remise_duree(prix, jours) s'appelle…", opts: ["Extraire une fonction", "Inverser un if", "Renommer", "Mocker"], a: 0, exp: "Un des refactorings les plus courants — et les plus automatisés par les IDE." },
    { type: "qcm", q: "pytest passe au ROUGE au milieu d'un refactoring. Le réflexe pro :", opts: ["Déboguer en avant pendant une heure", "Annuler, revenir au dernier vert, recommencer en plus petit", "Commenter les tests rouges", "Pousser quand même"], a: 1, exp: "Aucune urgence : le code marchait avant, le dernier vert n'est jamais loin." },
    { type: "vf", q: "Refactorer et ajouter une fonctionnalité dans le même commit facilite la revue.", a: false, exp: "Le relecteur ne distingue plus structure et comportement : deux commits, deux intentions." },
    { type: "qcm", q: "La formule « make the change easy, then make the easy change » signifie…", opts: ["Coder vite", "D'abord refactorer pour préparer le terrain, puis ajouter la fonctionnalité simplement", "Éviter les changements", "Tout faire en même temps"], a: 1, exp: "Le refactoring préalable rend la fonctionnalité triviale à écrire." },
    { type: "qcm", q: "Refactorer du code sans aucun test, c'est…", opts: ["Du refactoring rapide", "De la roulette : rien ne détectera un changement de comportement", "Recommandé le lundi", "Impossible techniquement"], a: 1, exp: "D'abord caractériser (leçon 13), ensuite refactorer." },
    { type: "input", q: "L'outil qui renomme une fonction PARTOUT d'un coup, sans oubli :", a: ["l'IDE", "IDE", "l'éditeur", "un IDE"], ph: "outil…", exp: "Le renommage automatisé de l'IDE est plus sûr qu'un chercher-remplacer." },
    { type: "vf", q: "Les refactorings « renommer » et « extraire une fonction » existent aussi dans les IDE Java, C# et PHP.", a: true, exp: "Mêmes noms, mêmes gestes : le catalogue est universel." },
    { type: "qcm", q: "La règle du boy-scout appliquée au refactoring :", opts: ["Tout réécrire à chaque passage", "À chaque passage dans un fichier, une petite amélioration en commit séparé", "Ne jamais toucher au code des autres", "Refactorer seulement avant une release"], a: 1, exp: "Le fichier est un peu plus sain qu'hier, sans big-bang risqué." }
  ],
  final: {
    title: "Exercice final — Le pas, le filet, le commit",
    intro: `<p>calculer_facture sent fort : 120 lignes, nombres magiques, if imbriqués. Elle est caractérisée depuis la leçon 13. En route.</p>`,
    questions: [

      { type: "qcm", q: "Premier pas choisi : remplacer 0.90 par REMISE_DUREE. Juste après le changement :", opts: ["Pas suivant directement", "pytest — et commit si vert", "git push --force", "Renommer trois autres choses"], a: 1, exp: "Un pas = un pytest = un commit : le rituel." },

      { type: "input", q: "Complète la définition : un refactoring = comportement …", a: ["identique", "inchangé", "inchange", "le même"], ph: "un mot…", exp: "Structure améliorée, comportement identique — prouvé par les tests." },
      { type: "qcm", q: "La remise fidélité doit être ajoutée dans cette fonction. Le bon enchaînement :", opts: ["Tout dans un commit", "Refactorer d'abord (commit), puis la fonctionnalité en TDD (autre commit)", "La fonctionnalité d'abord, le nettoyage jamais", "Demander à quelqu'un d'autre"], a: 1, exp: "Rends le changement facile, puis fais le changement facile." }
    ],
    solution: `<pre class="pseudo">Definition : structure amelioree, comportement IDENTIQUE
Preuve     : tests verts avant, verts apres CHAQUE pas
Rituel     : vert → petit pas → pytest → vert → commit
Rouge ?    : annuler, recommencer plus petit (jamais deboguer en avant)
Declencheurs (smells) : fonction a rallonge, duplication,
             nombres magiques, noms menteurs, if imbriques
Catalogue  : renommer, extraire fonction/variable, constante nommee,
             clauses de garde — automatises par les IDE partout
Discipline : refactoring et fonctionnalite = commits SEPARES
Sans tests : caracteriser d'abord (lecon 13), refactorer ensuite</pre>
<p>Le filet, le pas, le commit : tu peux toucher à tout sans trembler. Prochaine leçon : la synthèse — la stratégie de test complète de la Ludothèque, étage par étage.</p>`
  }
};
