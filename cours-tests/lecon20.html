<script>
var DAY = {
  num: 20,
  title: "La Ludothèque sous tests : la synthèse",
  subtitle: "Dix-neuf leçons, une application : la stratégie de test complète du capstone, étage par étage.",
  theory: `
<h3>1. Partir des risques, pas des fichiers</h3>
<p>Une stratégie de test ne commence pas par « testons tout » mais par « qu'est-ce qui doit ne JAMAIS casser ? ». Pour la Ludothèque : <strong>l'argent</strong> (barème, remises, frais de retard — une erreur se voit sur la facture), <strong>les règles de location</strong> (un jeu ne se loue qu'une fois, un membre a une limite), <strong>les données</strong> (rien ne se perd en base) et <strong>le parcours client</strong> (on peut réellement louer de bout en bout). Chaque risque descend ensuite à <strong>l'étage le plus bas</strong> de la pyramide (leçon 8) qui suffit à le prouver.</p>
<pre class="pseudo">Risque                     → Etage           → Lecons
Bareme, remises, frais     → unitaire        → 3, 4, 7, 12
Regles avec l'horloge/API  → unitaire mocke  → 9, 10
Contraintes en base        → integration     → 15
Vues et parcours web       → client Django   → 16
Le parcours complet client → e2e (tres peu)  → 8</pre>

<h3>2. La base de la pyramide : les unitaires</h3>
<p>Le gros bataillon, dans <code>tests/unit/</code>. Le barème complet vit dans des <strong>tableaux parametrize</strong> avec les limites de palier (6/7 jours, plafond des frais), les erreurs attendues dans leurs propres tests <code>pytest.raises</code>, l'horloge et l'API de cotation <strong>mockées</strong> (patch au bon endroit : <code>ludo.tarifs.date</code>). Toute règle NOUVELLE naît en <strong>TDD</strong> (leçons 11-12) ; le vieux code passe par la <strong>caractérisation</strong> (leçon 13). Objectif de vitesse : cette base entière tourne en <strong>moins de dix secondes</strong> — c'est elle qu'on lance à chaque sauvegarde.</p>

<h3>3. L'étage intégration : les coutures avec la base</h3>
<p>Dans <code>tests/integration/</code>, moins nombreux, sur base jetable avec <code>django.test.TestCase</code> et <code>setUpTestData</code> (leçon 15). On y met UNIQUEMENT ce que seule la vraie base peut prouver : la <code>UniqueConstraint</code> « un jeu, une location active », les suppressions protégées (<code>ProtectedError</code>), les NOT NULL, les requêtes du catalogue. PAS le barème : il est déjà prouvé à l'étage du dessous — dupliquer un test à deux étages, c'est payer deux fois la maintenance sans gagner une preuve.</p>

<h3>4. Le sommet : le web et le parcours</h3>
<p>Dans <code>tests/web/</code>, le client de test Django (leçon 16) vérifie les vues : statuts HTTP, redirections, le refus de louer un jeu déjà loué <strong>vu du navigateur simulé</strong>. Et tout au sommet, une <strong>poignée</strong> de tests bout en bout sur LE parcours critique : inscription → location → retour. Un seul parcours e2e bien choisi vaut mieux que vingt fragiles. L'arborescence finale :</p>
<pre class="pseudo">tests/
  conftest.py            # fixtures partagees (lecon 6)
  unit/
    test_tarifs.py       # parametrize + limites + raises
    test_regles.py       # peut_louer, reservations (TDD)
    test_cotation.py     # API mockee, pannes comprises
  integration/
    test_modeles.py      # contraintes, TestCase, setUpTestData
  web/
    test_vues.py         # client Django, statuts, redirections
  e2e/
    test_parcours.py     # LE parcours critique, un seul</pre>

<h3>5. La qualité en continu autour des tests</h3>
<p>La stratégie ne s'arrête pas aux tests : <strong>lint et format</strong> (leçon 17) tournent à la sauvegarde et en pre-commit ; la <strong>couverture</strong> (leçon 14) sert de boussole avec un <code>fail_under</code> réaliste — en surveillant la colonne Missing des fichiers d'argent (tarifs, factures) ; chaque changement passe en <strong>revue</strong> (leçon 18) via une petite PR ; chaque amélioration de structure suit le rituel du <strong>refactoring</strong> (leçon 19) sous filet. Résultat : une application qu'on peut modifier un vendredi à 17 h sans sueur froide. Il ne manque qu'une chose : que tout ceci se lance <strong>tout seul à chaque push</strong> — c'est le cours CI/CD &amp; Git avancé, et c'est la prochaine étape.</p>
<div class="warn">Le piège de la synthèse : tester la même règle à <strong>plusieurs étages</strong> « pour être sûr ». Le barème vérifié en unitaire, PUIS via la vue, PUIS en e2e, c'est trois fois la maintenance pour zéro preuve supplémentaire — et une suite qui enfle jusqu'à devenir lente. Une règle, un étage : le plus bas qui suffit.</div>
<div class="tip">Affiche la carte risque → étage de la section 1 près de ton écran pendant le capstone : chaque nouveau test commence par la question « où vis-tu, toi ? ». Si tu hésites, descends d'un étage.</div>`,
  exercises: [
    { type: "qcm", q: "Une stratégie de test commence par…", opts: ["Lister les fichiers du projet", "Identifier ce qui ne doit JAMAIS casser (les risques)", "Installer pytest", "Écrire les e2e"], a: 1, exp: "L'argent, les règles, les données, le parcours : les risques d'abord." },
    { type: "qcm", q: "Le barème et les remises de la Ludothèque se testent principalement…", opts: ["En e2e", "En unitaire, avec des tableaux parametrize et les limites de palier", "En intégration", "À la main"], a: 1, exp: "Des calculs purs : l'étage le plus bas suffit, leçons 3, 4, 7, 12." },
    { type: "qcm", q: "La contrainte « un jeu ne se loue qu'une fois » se prouve…", opts: ["En intégration : seule la vraie base applique la UniqueConstraint", "En unitaire avec un mock", "Dans le README", "Par la revue de code"], a: 0, exp: "Le mock rejouerait tes suppositions ; la base tranche (leçon 15)." },
    { type: "qcm", q: "Combien de parcours e2e recommande la synthèse ?", opts: ["Un par page", "Une poignée : LE parcours critique bien choisi", "Cinquante", "Zéro"], a: 1, exp: "Inscription → location → retour : un seul, stable, vaut vingt fragiles." },
    { type: "vf", q: "Vérifier le barème en unitaire PUIS via la vue PUIS en e2e triple la sécurité.", a: false, exp: "Triple la maintenance, zéro preuve en plus : une règle, un étage." },
    { type: "qcm", q: "L'objectif de vitesse de la base unitaire :", opts: ["Moins de dix secondes : on la lance à chaque sauvegarde", "Une heure", "Peu importe", "Une nuit"], a: 0, exp: "C'est sa vitesse qui fait qu'on la lance vraiment, tout le temps." },
    { type: "qcm", q: "Dans l'arborescence, les fixtures partagées vivent dans…", opts: ["chaque test copié-collé", "tests/conftest.py", "le README", "settings.py"], a: 1, exp: "Visibles par tout le dossier, sans import (leçon 6)." },
    { type: "qcm", q: "L'API de cotation dans les tests unitaires :", opts: ["On appelle la vraie API", "Mockée — pannes comprises (side_effect)", "On saute ces tests", "On la teste en e2e uniquement"], a: 1, exp: "patch au bon endroit + TimeoutError : leçons 9-10." },
    { type: "qcm", q: "Une règle métier NOUVELLE arrive au capstone. Elle naît…", opts: ["En TDD : red, green, refactor", "Sans test", "En e2e d'abord", "Dans un mock"], a: 0, exp: "Le code neuf se pilote par les tests (leçons 11-12)." },
    { type: "qcm", q: "Le vieux code du capstone jamais testé passe d'abord par…", opts: ["La suppression", "Des tests de caractérisation (leçon 13)", "Un reformatage black", "L'e2e"], a: 1, exp: "Photographier l'existant avant d'y toucher." },
    { type: "vf", q: "Le client de test Django (tests/web/) vérifie statuts HTTP et redirections sans vrai navigateur.", a: true, exp: "L'étage web simule les requêtes : rapide, sans Selenium (leçon 16)." },
    { type: "input", q: "Le réglage de couverture qui sert de plancher anti-régression à l'équipe :", a: ["fail_under", "fail_under = 80"], ph: "réglage…", exp: "Avec l'oeil sur la colonne Missing des fichiers d'argent (leçon 14)." },
    { type: "input", q: "Le dossier de l'arborescence qui contient test_modeles.py (contraintes, TestCase) :", a: ["integration", "tests/integration", "tests/integration/"], ph: "dossier…", exp: "L'étage du milieu : ce que seule la vraie base peut prouver." },
    { type: "qcm", q: "Autour des tests, la qualité en continu comprend…", opts: ["Uniquement pytest", "Lint/format, couverture-boussole, revues sur petites PR, refactoring sous filet", "Un audit annuel", "Des réunions"], a: 1, exp: "Leçons 14 et 17 à 19 : l'écosystème complet autour de la suite." },
    { type: "vf", q: "Il manque encore une brique à cette stratégie : son lancement automatique à chaque push.", a: true, exp: "C'est le cours CI/CD et Git avancé — la suite directe." }
  ],
  final: {
    title: "Exercice final — L'architecte de la suite",
    intro: `<p>Cinq décisions de stratégie pour le capstone : tranche comme l'architecte de la suite de tests.</p>`,
    questions: [
      { type: "qcm", q: "La remise fidélité (calcul pur, palier à 1 an) : quel étage ?", opts: ["Unitaire — tableau parametrize avec les deux côtés du palier", "Intégration", "E2e", "Aucun"], a: 0, exp: "Un calcul : l'étage le plus bas, avec les limites (leçons 4 et 7)." },
      { type: "qcm", q: "« Supprimer un membre qui a une location en cours doit échouer » : quel étage ?", opts: ["Unitaire mocké", "Intégration : la protection vit dans la base (ProtectedError)", "E2e", "Revue de code"], a: 1, exp: "C'est le schéma qui garantit — seule la vraie base le prouve." },
      { type: "vf", q: "Le test du parcours « inscription → location → retour » doit rester quasi unique au sommet.", a: true, exp: "Le sommet de la pyramide est pointu : un parcours critique, stable." },
      { type: "input", q: "Le fichier qui centralise les fixtures partagées de toute la suite :", a: ["conftest.py", "tests/conftest.py"], ph: "nom du fichier…", exp: "jeu_disponible, membre_avec_retard… disponibles partout sans import." },
      { type: "qcm", q: "Un collègue propose de re-tester le barème complet via les vues « pour être sûr ». Ta réponse d'architecte :", opts: ["Excellente idée", "Non : une règle, un étage — le barème est prouvé en unitaire, la vue teste la vue", "Oui mais en e2e aussi", "On supprime les unitaires alors"], a: 1, exp: "Dupliquer les étages enfle la suite sans ajouter de preuve." }
    ],
    solution: `<pre class="pseudo">STRATEGIE LUDOTHEQUE — la carte finale
Risques      : argent, regles de location, donnees, parcours client
Unitaire     : bareme parametrize + raises + mocks horloge/API
               (TDD pour le neuf, caracterisation pour le vieux)
               → moins de 10 s, lance a chaque sauvegarde
Integration  : contraintes et requetes — TestCase, setUpTestData
Web          : client Django — statuts, redirections, refus
E2e          : UN parcours critique (inscription→location→retour)
Autour       : lint/format, couverture (Missing + fail_under),
               revues de petites PR, refactoring sous filet
Regle d'or   : une regle, UN etage — le plus bas qui prouve</pre>
<p>La stratégie est complète : il ne reste qu'à la faire tourner toute seule. Dernière leçon : l'examen récapitulatif — puis direction le cours CI/CD &amp; Git avancé.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "tests-l20", title: "Le document de stratégie du capstone", level: 3,
    statement: "Rédige le document de stratégie de test que tu joindrais à ton capstone Ludothèque, tel qu'un jury (ou un lead) le lirait. Structure imposée : 1) les quatre risques majeurs et pourquoi ; 2) un tableau « comportement → étage → outil/technique » avec AU MOINS huit comportements concrets couvrant les quatre étages (dont un mock d'horloge, une contrainte de base, un test de vue et le parcours e2e) ; 3) les trois règles d'équipe (vitesse de la base unitaire, non-duplication des étages, fail_under) ; 4) une phrase sur ce que le cours CI/CD automatisera. Sois précis : noms de fonctions, valeurs, exceptions.",
    hints: [
      "Reprends la carte risque → étage de la théorie et remplis-la avec TES fonctions : calcul_prix_location, frais_de_retard, peut_louer, cotation…",

      "Le jury cherche la justification d'étage : pourquoi CE test vit-il LÀ et pas ailleurs ?"
    ],
    solution: "1) RISQUES : l'argent (barème/remises/frais : toute erreur se voit\nsur une facture), les règles de location (double location = conflit\nclient), l'intégrité des données (une location perdue = un jeu\nperdu), le parcours client (si on ne peut pas louer, rien n'existe).\n\n2) TABLEAU comportement → étage → technique\nbareme 1/3/6/7/14 jours     | unitaire    | parametrize + ids\nplafond frais (19/20/25 j)  | unitaire    | parametrize, limites\njours &lt; 1 → ValueError      | unitaire    | pytest.raises\nfrais selon date du jour    | unitaire    | patch('ludo.tarifs.date')\ncotation + panne API        | unitaire    | patch requests.get,\n                            |             | side_effect=TimeoutError\njeu deja loue → refus       | integration | TestCase, IntegrityError\n                            |             | (UniqueConstraint)\nmembre avec location protege| integration | ProtectedError\nvue louer → redirection     | web         | client Django, status 302\njeu indisponible → message  | web         | client Django, contenu\ninscription→location→retour | e2e         | UN parcours navigateur\n\nJustification type : le barème ne monte pas d'étage (calcul pur) ;\nla contrainte ne descend pas (seule la base la garantit).\n\n3) RÈGLES D'ÉQUIPE : unit/ sous 10 secondes (lancée à chaque\nsauvegarde) ; une règle = un étage, jamais dupliquée ; couverture\nfail_under = 80 avec revue de la colonne Missing sur tarifs.py\net factures.py à chaque PR.\n\n4) CI/CD : le cours suivant branchera tout ça sur chaque push —\nlint, format, suite complète par étages, couverture — pour que\nla stratégie tourne sans qu'on y pense.",
    note: "Ce document est exactement le livrable « stratégie de test » qu'on te demandera en entreprise avant tout gros développement — et c'est une pièce en or pour la soutenance du capstone. Garde-le : au cours CI/CD, tu le traduiras presque ligne à ligne en pipeline." }
