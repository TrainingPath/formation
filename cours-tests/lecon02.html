<script>
var DAY = {
  num: 2,
  title: "Anatomie d'un test : Arrange, Act, Assert",
  subtitle: "Trois temps, un comportement, un nom qui dit tout : la recette d'un bon test.",
  theory: `
<h3>1. Un test, c'est juste une fonction</h3>
<p>Pas de magie : un test est une <strong>fonction qui exécute ton code et vérifie le résultat</strong>. Rappel de vocabulaire : <code>print(...)</code> <strong>affiche</strong> un texte à l'écran, et <code>==</code> (deux signes égal) <strong>compare</strong> deux valeurs et répond « vrai » ou « faux » (à ne pas confondre avec <code>=</code>, un seul signe, qui <em>range</em> une valeur dans une variable). On peut écrire un test sans aucun framework :</p>
<pre class="pseudo">resultat = calcul_prix_location(3)                 # appeler la fonction pour 3 jours, ranger ce qu'elle renvoie dans "resultat"
if resultat == 9:                                  # SI resultat vaut bien 9 (le prix attendu pour 3 jours)...
    print("OK")                                    # ...afficher "OK" a l'ecran (print = afficher)
else:                                              # SINON (resultat n'est pas 9)...
    print("ECHEC : attendu 9, obtenu", resultat)   # ...afficher un message d'echec avec la valeur reellement obtenue</pre>
<p>Ça marche, mais c'est verbeux et rien ne collecte les résultats. Les frameworks (pytest, JUnit, xUnit, PHPUnit) automatisent la découverte, l'exécution et le rapport — la structure du test, elle, reste la même partout.</p>

<h3>2. Les trois temps : Arrange, Act, Assert</h3>
<p>Tout bon test se lit en trois temps — on dit aussi <strong>Given / When / Then</strong> (« étant donné / quand / alors »). <strong>Arrange</strong> : préparer les données. <strong>Act</strong> : exécuter le code testé. <strong>Assert</strong> : vérifier le résultat. Le mot <code>assert</code> signifie « j'affirme que » : c'est une <strong>assertion</strong>, une affirmation que l'ordinateur vérifie. Si elle est vraie, le test continue (vert) ; si elle est fausse, le test <strong>échoue</strong> immédiatement (rouge). C'est le cœur de tout test.</p>
<pre class="pseudo">def test_prix_location_applique_le_tarif_degressif():   # une fonction de test ; son nom decrit le comportement verifie
    # Arrange : preparer les donnees                     # (commentaire de section, ignore par la machine)
    jours = 7                                           # donnee de depart : on teste une location de 7 jours
    # Act : executer le code teste                        # (commentaire de section)
    prix = calcul_prix_location(jours)                  # on appelle le code teste et on garde son resultat dans "prix"
    # Assert : verifier le resultat                       # (commentaire de section)
    assert prix == 19    # 5 jours x 3 + 2 jours x 2 = 19 ; si prix vaut autre chose, le test ECHOUE (rouge)</pre>
<p>Trois blocs, dans cet ordre, toujours. Un lecteur pressé comprend le test en cinq secondes : voilà pourquoi cette structure est universelle.</p>

<h3>3. Un test vérifie UN comportement</h3>
<p>Un test = <strong>un comportement</strong> = un assert <em>conceptuel</em> (plusieurs lignes <code>assert</code> sont tolérées si elles vérifient la même idée). Si <code>test_tout</code> vérifie à la fois le prix, le catalogue et les frais de retard, un rouge ne dit plus <strong>quoi</strong> réparer. Trois comportements → trois tests.</p>

<h3>4. Bien nommer : le nom raconte le comportement</h3>
<p>Compare <code>test_1</code> et <code>test_prix_location_applique_le_tarif_degressif</code>. Quand le second échoue, tu sais déjà quoi chercher <strong>sans ouvrir le fichier</strong>. Un bon nom dit : quoi, dans quelle condition, avec quel résultat attendu. Long, oui — et c'est très bien : ce nom ne sera jamais tapé, seulement lu dans les rapports. (La flèche <code>→</code> ci-dessous se lit « donne » ; ce n'est pas du code, mais une comparaison de noms.)</p>
<pre class="pseudo">test_1                                            → illisible : aucune idee de ce qui est verifie
test_prix                                         → vague : le prix de quoi ? dans quel cas ?
test_prix_location_applique_le_tarif_degressif    → le rapport se lit seul : on sait quoi chercher
test_location_refusee_si_jeu_deja_loue            → la regle metier est nommee dans le titre</pre>

<h3>5. Les qualités FIRST</h3>
<p><strong>FIRST</strong> est un moyen mnémotechnique : les cinq lettres résument les qualités d'un bon test. Il est <strong>Fast</strong> (rapide : on le lance cent fois par jour), <strong>Independent</strong> (indépendant : il passe seul, dans n'importe quel ordre), <strong>Repeatable</strong> (répétable : même résultat partout, chez toi comme sur le serveur), <strong>Self-validating</strong> (auto-validant : vert ou rouge, sans inspection humaine) et <strong>Timely</strong> (écrit au bon moment : au plus près du code, pas six mois après). En Java comme en C# ou en PHP, JUnit, xUnit et PHPUnit reposent sur exactement les mêmes qualités.</p>
<div class="warn">Un test fourre-tout qui vérifie dix comportements ne dit plus <strong>ce qui casse</strong> : un seul rouge, dix suspects. Découpe : un comportement par test.</div>
<div class="tip">Écris le squelette Arrange / Act / Assert en commentaires AVANT de remplir : si tu n'arrives pas à nommer les trois temps, c'est que le comportement à tester n'est pas clair.</div>`,
  exercises: [
    { type: "qcm", q: "Un test automatisé, fondamentalement, c'est…", opts: ["Un fichier de configuration", "Une fonction qui exécute ton code et vérifie le résultat", "Un rapport PDF", "Un point d'arrêt du débogueur"], a: 1, exp: "Pas de magie : exécuter, puis vérifier." },
    { type: "qcm", q: "Les trois temps d'un test, dans l'ordre :", opts: ["Assert, Act, Arrange", "Act, Arrange, Assert", "Arrange, Act, Assert", "Arrange, Assert, Act"], a: 2, exp: "Préparer, exécuter, vérifier." },
    { type: "qcm", q: "L'alias de Arrange / Act / Assert :", opts: ["Begin / Run / End", "Given / When / Then", "Setup / Loop / Exit", "Input / Process / Output"], a: 1, exp: "Même idée, vocabulaire venu du BDD." },
    { type: "input", q: "Quel mot-clé Python vérifie une condition dans un test ?", a: ["assert"], ph: "mot-clé", exp: "assert prix == 19 : le cœur du temps Assert." },
    { type: "qcm", q: "Dans test_prix_location_applique_le_tarif_degressif, la ligne « jours = 7 » appartient au temps…", opts: ["Arrange", "Act", "Assert", "Aucun"], a: 0, exp: "On prépare les données avant d'exécuter." },
    { type: "qcm", q: "La ligne « prix = calcul_prix_location(jours) » appartient au temps…", opts: ["Arrange", "Assert", "Teardown", "Act"], a: 3, exp: "C'est l'exécution du code testé." },
    { type: "vf", q: "Un test devrait vérifier un seul comportement (un assert conceptuel).", a: true, exp: "Sinon, un rouge ne dit plus quoi réparer." },
    { type: "qcm", q: "test_tout vérifie prix, catalogue et frais de retard à la fois. Le problème :", opts: ["Il est trop rapide", "Quand il échoue, on ne sait pas lequel des trois comportements casse", "Il utilise trop d'assert", "Python l'interdit"], a: 1, exp: "Un rouge, dix suspects : découpe en trois tests." },
    { type: "qcm", q: "Le meilleur nom de test parmi :", opts: ["test_1", "test_prix", "test_location_refusee_si_jeu_deja_loue", "test_verifier"], a: 2, exp: "Quoi + condition + résultat : le rapport se lit seul." },
    { type: "vf", q: "Un nom de test long est un défaut : il faut abréger au maximum.", a: false, exp: "Ce nom n'est jamais tapé, seulement lu : la clarté prime." },
    { type: "qcm", q: "Dans FIRST, le F signifie…", opts: ["Final", "Fast", "Formal", "Flexible"], a: 1, exp: "Rapide : on doit pouvoir lancer la suite cent fois par jour." },
    { type: "qcm", q: "« Independent » (le I de FIRST) veut dire que le test…", opts: ["N'utilise aucune fonction", "Tourne sans électricité", "Est écrit par une autre équipe", "Passe seul et dans n'importe quel ordre"], a: 3, exp: "Aucune dépendance à un autre test — leçon 5." },
    { type: "qcm", q: "« Self-validating » signifie que le test…", opts: ["Se corrige tout seul", "Conclut vert ou rouge sans inspection humaine", "Se documente tout seul", "S'exécute sans code"], a: 1, exp: "Pas de « regarde la console et juge toi-même »." },
    { type: "input", q: "Quelle qualité FIRST demande d'écrire le test au plus près du code, pas six mois après ?", a: ["timely"], ph: "mot anglais", exp: "T comme Timely : au bon moment." },
    { type: "vf", q: "La structure Arrange / Act / Assert est propre à Python : JUnit et PHPUnit utilisent une autre logique.", a: false, exp: "Elle est universelle : mêmes trois temps en Java, C# et PHP." }
  ],
  final: {
    title: "Exercice final — Disséquer un test",
    intro: `<p>Tu dois pouvoir découper n'importe quel test en trois temps et juger son nom.</p>`,
    questions: [
      { type: "qcm", q: "Le temps qui vérifie le résultat s'appelle…", opts: ["Arrange", "Act", "Assert", "Then il n'y en a pas"], a: 2, exp: "Assert = Then : la vérification." },
      { type: "qcm", q: "calcul_prix_location(7) doit valoir…", opts: ["21", "19", "14", "9"], a: 1, exp: "5 jours à 3 € puis 2 jours à 2 € : 15 + 4 = 19." },
      { type: "vf", q: "Plusieurs lignes assert sont acceptables si elles vérifient la même idée.", a: true, exp: "Un assert CONCEPTUEL : un seul comportement testé." },
      { type: "qcm", q: "Un bon nom de test contient…", opts: ["Un numéro unique", "La date d'écriture", "Le quoi, la condition et le résultat attendu", "Le nom de son auteur"], a: 2, exp: "test_prix_location_applique_le_tarif_degressif : tout y est." },
      { type: "input", q: "Acronyme des cinq qualités d'un bon test (Fast, Independent, Repeatable, Self-validating, Timely) :", a: ["first"], ph: "acronyme", exp: "FIRST : à réciter avant chaque test douteux." }
    ],
    solution: `<pre class="pseudo">Un test  = une fonction : executer le code, verifier le resultat
3 temps  = Arrange (preparer) / Act (executer) / Assert (verifier)
           alias Given / When / Then
1 test   = 1 comportement = 1 assert conceptuel
Nom      = test_quoi_condition_resultat, long et lisible
FIRST    = Fast, Independent, Repeatable, Self-validating, Timely</pre>
<p>Tu sais à quoi ressemble un bon test. La suite : « pytest : premiers tests, premières assertions » — on installe l'outil et on lance la machine.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "tests-l2", title: "Le test fourre-tout au bloc opératoire", level: 1,
    statement: "Un collègue a écrit pour la Ludothèque un unique test nommé test_tout : il crée un jeu, vérifie que le prix de 3 jours vaut 9 €, que le prix de 7 jours vaut 19 €, que louer un jeu déjà loué échoue, et que le catalogue compte bien un jeu de plus après un ajout. Rédige ta revue de code : explique en quoi ce test viole les principes de la leçon, puis propose le plan de découpage — pour chaque nouveau test, donne son nom complet (format test_quoi_condition_resultat) et le contenu de ses trois temps Arrange / Act / Assert.",
    hints: [
      "Compte les comportements distincts vérifiés par test_tout : chacun mérite son propre test.",
      "Chaque nom doit permettre de deviner le comportement sans lire le code : quoi, condition, résultat.",
      "Pour chaque test, une ligne par temps suffit : Arrange (quelles données ?), Act (quel appel ?), Assert (quelle vérification ?)."
    ],
    solution: "REVUE DE CODE — test_tout\n\nProblème : 4 comportements dans un seul test. Un rouge = 4 suspects,\net le premier assert qui échoue masque les trois suivants.\nViolations : « un test, un comportement » et le I de FIRST (les\nvérifications dépendent les unes des autres).\n\nPlan de découpage :\n\n1. test_prix_location_3_jours_tarif_plein\n   Arrange : jours = 3\n   Act     : prix = calcul_prix_location(jours)\n   Assert  : prix == 9\n\n2. test_prix_location_applique_le_tarif_degressif\n   Arrange : jours = 7\n   Act     : prix = calcul_prix_location(jours)\n   Assert  : prix == 19\n\n3. test_location_refusee_si_jeu_deja_loue\n   Arrange : un jeu déjà loué à un membre\n   Act     : tentative de seconde location\n   Assert  : la location est refusée (erreur attendue — leçon 4)\n\n4. test_ajout_au_catalogue_augmente_le_compte\n   Arrange : un catalogue de N jeux\n   Act     : ajouter un jeu\n   Assert  : le catalogue compte N + 1 jeux\n\nBilan : 4 tests courts, 4 noms qui se lisent comme une spécification.",
    note: "Ce découpage est exactement ce qu'on te demandera en revue de code sur ton capstone : des tests-spécifications lisibles par toute l'équipe. Et quand la suite tournera dans le pipeline CI/CD, chaque nom apparaîtra tel quel dans le rapport d'échec — un bon nom aujourd'hui, c'est un diagnostic gratuit demain." }
  ]
};
</script>
