<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire — Allemand</title>
<link rel="stylesheet" href="accueil.css">
<style>
  .vc-wrap{max-width:720px}
  .vc-head{background:#f3efff;border:1px solid #ddd0ff;border-radius:12px;padding:13px 18px;
           margin:0 0 14px;color:#3b2a5c;text-align:center}
  .vc-acq{background:#e1f5ee;border:1px solid #9fe1cb;border-radius:12px;padding:12px 16px;
          margin:0 0 14px;text-align:center;color:#0f6e56}
  .vc-boites{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .vc-boites span{display:flex;flex-direction:column;align-items:center;min-width:88px;
                  padding:7px 12px;border-radius:10px;font-size:1.35em;font-weight:700;line-height:1.1}
  .vc-boites small{font-size:.42em;font-weight:600;letter-spacing:.02em;margin-top:3px;opacity:.85}
  .vc-b1{background:#fcebeb;color:#a32d2d}
  .vc-b2{background:#faeeda;color:#854f0b}
  .vc-b3{background:#c0dd97;color:#27500a}
  .vc-expl{font-size:.85em;color:#0f6e56;margin-top:10px;line-height:1.55}
  .vc-filtres{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
  .vc-champ{display:flex;flex-direction:column;gap:4px;font-size:.88em;color:#5b6478}
  .vc-champ select{padding:8px 12px;border:1px solid #dde3ec;border-radius:10px;font-size:.95em}
  .vc-note{font-size:.9em;color:#5b6478;line-height:1.6;text-align:center;margin:10px 0}
  .vc-btn{background:#7c3aed;color:#fff;border:0;border-radius:999px;padding:11px 22px;
          font-weight:700;font-size:1em;cursor:pointer;display:block;margin:10px auto}
  .vc-sec{background:#eef1f6;color:#334155}
  .vc-prog{font-size:.85em;color:#7a8699;font-weight:700;text-align:center;margin-bottom:8px}
  .vc-q{font-size:1.25em;font-weight:600;text-align:center;margin:0 0 8px}
  .vc-ctx{font-style:italic;color:#5b6478;text-align:center;margin:0 0 14px}
  .vc-opts{display:flex;flex-direction:column;gap:9px;max-width:420px;margin:0 auto}
  .vc-opt{padding:12px 16px;border:1px solid #dde3ec;border-radius:10px;background:#f7f9fc;
          font-size:1em;cursor:pointer;text-align:center}
  .vc-opt:hover:enabled{border-color:#7c3aed;background:#f3efff}
  .vc-opt.ok{background:#e1f5ee;border-color:#1d9e75;font-weight:700}
  .vc-opt.ko{background:#fcebeb;border-color:#e24b4a}
  .vc-corr{text-align:center;margin-top:12px;color:#0f6e56}
  .vc-res{font-size:1.35em;text-align:center;margin-bottom:10px}
  .vc-signal{text-align:center;font-size:.85em;margin-top:16px}
  .vc-signal a{color:#b3541e;text-decoration:none}
  .vc-signal-note{color:#7a8699;font-size:.92em}
  .signal-note{color:#7a8699;font-size:.92em}
  .signal-cours{color:#7a8699}
</style>
</head>
<body>
<div class="wrap vc-wrap">
  <nav class="topnav"><a href="allemand.html">← Retour à l'allemand</a></nav>

  <div class="hero">
    <h1>📚 Vocabulaire — Allemand</h1>
    <p>Le lexique te montre les mots ; <strong>ici, on t'interroge</strong> — et on te fait réviser ce que tu rates.</p>
    <p>Des sessions de 20 questions, filtrables par niveau, par catégorie et par sens. Les mots ratés reviennent en priorité.</p>
  </div>

  <div id="vocab"></div>

</div>

<script src="signalement.js"></script>
<script src="vocab-synonymes.js"></script>
<script src="vocab.js"></script>
<script src="vocab-data-allemand.js"></script>
<script>
  Vocab.monter("vocab", VOCAB_ALLEMAND, "allemand", "allemand");
</script>
</body>
</html>
