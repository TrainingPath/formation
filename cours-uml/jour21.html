  theory: `
<h3>1. La définition, en une phrase</h3>
<p>La <strong>vue d'ensemble des interactions</strong> (<em>Interaction Overview Diagram</em> ; ton cours d'école dit <strong>diagramme global d'interaction</strong>, sigle <strong>DGI</strong>) est <strong>un diagramme d'activités dont les nœuds sont des interactions</strong>, et non des actions.</p>
<p>Retiens cette phrase telle quelle, parce qu'elle contient tout. Prends un diagramme d'activités : sa structure de contrôle (début, décisions, bifurcations, fin) ne change pas d'un iota. Remplace simplement chaque rectangle « action » par un <strong>diagramme de séquence entier</strong>. C'est tout. Tu obtiens une carte des scénarios : quel scénario s'enchaîne après quel autre, sous quelle condition.</p>
<pre class="pseudo"># Le meme squelette, deux remplissages
Diagramme d'ACTIVITES        : les noeuds sont des ACTIONS
                               ("Verifier le stock", "Encaisser")
Vue d'ensemble des INTERACTIONS : les noeuds sont des INTERACTIONS
                               (le diagramme de sequence "Louer un jeu"
                                dans son entier)</pre>
<div class="tip">C'est le diagramme le plus facile de la semaine, à une condition : bien connaître le diagramme d'activités. Tout ce que tu as appris sur les nœuds de contrôle se réemploie sans la moindre modification.</div>

<h3>2. Le cadre et son en-tête</h3>
<p>Le diagramme entier est enfermé dans un <strong>cadre</strong> (<em>frame</em>) dont le coin supérieur gauche porte un pentagone avec le mot-clé <code>sd</code> suivi du nom — car formellement, une vue d'ensemble des interactions <em>est</em> une interaction.</p>
<pre class="pseudo"> .-------------------------------------------------------.
 | sd LouerUnJeu \\ lifelines Membre, Employe, Systeme     |
 |----------------------------------------------------.  |
 |                                                     |  |
 |          (le contenu du diagramme ici)              |  |
 |                                                     |  |
 '-----------------------------------------------------'  |
 '-------------------------------------------------------'

# Les LIGNES DE VIE concernees PEUVENT etre citees dans l'en-tete
# du cadre (clause "lifelines"), mais elles ne sont PAS
# REPRESENTEES GRAPHIQUEMENT : aucune barre verticale, aucun
# rectangle d'acteur dans le corps du diagramme.
# On sait QUI participe ; on ne voit pas les participants.</pre>
<p>C'est une différence importante avec le diagramme de séquence, où les lignes de vie sont l'ossature même du dessin. Ici, elles sont mentionnées, pas dessinées.</p>

<h3>3. Les nœuds de contrôle, hérités du diagramme d'activités</h3>
<p>Ce sont exactement les mêmes que dans un diagramme d'activités, avec les mêmes symboles et le même sens :</p>
<pre class="pseudo">NOEUD INITIAL       *              # disque plein : le point de depart

NOEUD FINAL         (*)            # disque cercle : fin du flot

NOEUD DE DECISION      / \\         # LOSANGE a UNE entree et
                      /   \\        # PLUSIEURS sorties gardees
                      \\   /        # -> on CHOISIT une branche
                       \\ /

NOEUD DE FUSION        / \\         # LOSANGE a PLUSIEURS entrees et
                      /   \\        # UNE sortie, sans garde
                      \\   /        # -> on RASSEMBLE des branches
                       \\ /         #    alternatives

NOEUD DE BIFURCATION  =========     # BARRE epaisse, 1 entree, n sorties
   (fork)                           # -> les branches partent EN PARALLELE

NOEUD DE JONCTION     =========     # BARRE epaisse, n entrees, 1 sortie
   (join)                           # -> on ATTEND que TOUTES les
                                    #    branches paralleles soient finies</pre>
<pre class="pseudo"># Les deux paires, a ne jamais confondre
DECISION  + FUSION      -> l'ALTERNATIF : un seul chemin est pris
                           (losanges, gardes sur les sorties)
BIFURCATION + JONCTION  -> le PARALLELE : tous les chemins sont pris
                           (barres epaisses, aucune garde)

# Regle de symetrie : ce qu'une decision ouvre, une fusion le referme ;
# ce qu'une bifurcation ouvre, une jonction le referme.</pre>
<div class="warn"><strong>Écart de vocabulaire avec ton cours d'école.</strong> Le support du PAC emploie « <strong>fusion</strong> » pour désigner ce que la norme appelle un <strong>nœud de décision</strong>, et « <strong>débranchement</strong> » pour ce que la norme appelle un <strong>nœud de bifurcation</strong>. La terminologie standard d'UML 2.5.1 est celle-ci, sans ambiguïté : nœud de <strong>décision</strong> (une entrée, plusieurs sorties gardées), nœud de <strong>fusion</strong> (plusieurs entrées, une sortie), nœud de <strong>bifurcation</strong> (<em>fork</em>, parallélisme ouvert), nœud de <strong>jonction</strong> (<em>join</em>, parallélisme refermé). Emploie ces quatre mots-là : ce sont eux qui figurent dans la norme et dans les outils.</div>

<h3>4. Les deux sortes de nœuds d'interaction</h3>
<p>Voilà ce qui remplace les actions. Un nœud d'interaction se présente sous deux formes, et tu peux mélanger les deux dans le même diagramme :</p>
<pre class="pseudo">FORME 1 -- L'UTILISATION D'INTERACTION (mot-cle "ref")
 .------------------------------.
 | ref                          |     # renvoie a un diagramme de
 |     LouerUnJeu               |     # sequence EXISTANT, defini
 '------------------------------'     # ailleurs. Compact et reutilisable.


FORME 2 -- LE FRAGMENT D'INTERACTION DESSINE EN LIGNE
 .------------------------------.
 | sd VerifierStock             |     # le diagramme de sequence est
 |  Employe   Systeme           |     # dessine MINIATURE, directement
 |     |         |              |     # dans le noeud. Utile pour un
 |     |-------->|              |     # echange court qu'on ne veut pas
 |     |<--------|              |     # sortir dans un diagramme separe.
 '------------------------------'</pre>
<p>Dans la pratique, la forme <code>ref</code> domine largement : c'est elle qui donne au diagramme son utilité de <em>table des matières</em>. Chaque <code>ref</code> renvoie à un diagramme de séquence détaillé, que le lecteur ouvre s'il veut le détail.</p>
<div class="tip">Tu as déjà croisé <code>ref</code> dans le diagramme de séquence : c'est le même opérateur, avec le même sens — « le détail est ailleurs ». Ici, il devient l'élément principal au lieu d'être un raccourci occasionnel.</div>

<h3>5. Assembler les scénarios de la Ludothèque</h3>
<p>Mettons bout à bout quatre scénarios que tu connais : consulter le catalogue, louer un jeu, payer, et réserver si le jeu est indisponible.</p>
<pre class="pseudo"> .-------------------------------------------------------------------.

 |                      v         v                                  |

 |    | ref  LouerUnJeu      |   | ref  ReserverJeu     |             |
 |    '---------------------'   '---------------------'              |
 |                      |         |                                  |
 |                      v         |                                  |
 |            ==================  |    NOEUD DE BIFURCATION          |
 |             |            |     |    (les deux se font en parallele)|
 |             v            v     |                                  |
 |  .-----------------. .-----------------.                          |

 |  '-----------------' '-----------------'                          |
 |             |            |     |                                  |
 |             v            v     |                                  |
 |            ==================  |    NOEUD DE JONCTION             |
 |                      |         |    (on attend les DEUX)          |
 |                      v         v                                  |
 |                          \\   /                                     |
 |                           \\ /    NOEUD DE FUSION                   |
 |                            |     (les deux chemins se rejoignent)  |
 |                            v                                      |
 |                           (*)                                     |
 '-------------------------------------------------------------------'

<h3>6. Synthèse de la semaine : trois vues d'une même réalité</h3>
<p>Les trois diagrammes d'interaction que tu as vus cette semaine racontent la <strong>même chose</strong> à trois échelles différentes. Tenir ces trois niveaux ensemble, c'est ce qu'on attend d'un analyste.</p>
<pre class="pseudo">1. DIAGRAMME DE SEQUENCE  -- le DETAIL d'UN scenario
   Lignes de vie verticales, temps de haut en bas.
   Question : "dans quel ORDRE precis les messages s'echangent-ils
              entre le Membre, l'Employe et le Systeme ?"
   Force    : la chronologie, message par message.

2. DIAGRAMME DE COMMUNICATION -- LES MEMES ECHANGES, vue SPATIALE
   Objets relies par des liens, messages NUMEROTES (1, 1.1, 2...).
   Question : "QUI parle a QUI ? quelle est la topologie ?"
   Force    : les relations entre objets, pas la chronologie.
   Note     : sequence et communication sont EQUIVALENTS -- un outil
              passe de l'un a l'autre automatiquement. Ils portent
              la MEME information, presentee autrement.

3. VUE D'ENSEMBLE DES INTERACTIONS -- l'ASSEMBLAGE de PLUSIEURS scenarios
   Squelette de diagramme d'activites, noeuds = interactions (ref).
   Question : "dans quel ORDRE et sous quelles CONDITIONS les
              scenarios s'enchainent-ils ?"
   Force    : la vue d'ensemble ; c'est la TABLE DES MATIERES des
              diagrammes de sequence.

# On zoome, puis on dezoome :
#   sequence      = le message
#   communication = la structure des echanges
#   vue d'ensemble= le scenario comme brique elementaire</pre>
<div class="tip">Ordre de travail conseillé : commence par les <strong>diagrammes de séquence</strong> des scénarios importants (un par cas d'utilisation significatif), puis assemble-les dans une <strong>vue d'ensemble</strong> si leur enchaînement n'est pas évident. Faire l'inverse — dessiner la vue d'ensemble d'abord — mène à des <code>ref</code> qui ne renvoient à rien.</div>

<h3>7. Quand l'employer, et quand s'en passer</h3>
<pre class="pseudo">UTILE quand...                        INUTILE quand...
-----------------------------------   ------------------------------
Un processus enchaine PLUSIEURS       Il n'y a qu'un seul scenario
scenarios avec des conditions         -> un diagramme de sequence suffit

Les memes scenarios se REUTILISENT    Les enchainements sont triviaux
dans plusieurs processus              -> le texte suffit

On veut une vue de haut niveau        On veut le detail des messages
pour un chef de projet                -> c'est le role du DSE

# Comme le diagramme de temps, le DGI est un diagramme de niche.
# Mais sa niche est plus large : des qu'un processus metier combine
# trois ou quatre scenarios, il devient franchement utile.</pre>

ERREUR 4 : ouvrir une bifurcation sans la refermer par une jonction
           -> le flot parallele resterait sans point de synchronisation.

ERREUR 5 : un "ref" qui ne renvoie a aucun diagramme existant
           -> le nom du noeud DOIT etre celui d'une interaction reelle.</pre>`,

    solution: "@startuml\n' VUE D'ENSEMBLE DES INTERACTIONS -- une visite a la Ludotheque\n' Definition : un diagramme d'ACTIVITES dont les noeuds sont des\n' INTERACTIONS (des diagrammes de sequence), et non des actions.\n' PlantUML n'a pas de notation dediee : on emploie la syntaxe des\n' diagrammes d'activites, ce qui est precisement sa definition.\n\ntitle sd GererUneVisite\n\nnote left\n  Cadre : sd GererUneVisite\n  lifelines : Membre, Employe, Systeme, Banque\n  --\n  Les lignes de vie sont CITEES ici mais ne sont JAMAIS\n  representees graphiquement dans le corps du diagramme.\n  C'est la difference majeure avec le diagramme de sequence.\nend note\n\nstart\n' NOEUD INITIAL : disque plein\n\n:ref ConsulterCatalogue;\n' NOEUD D'INTERACTION, forme \"utilisation d'interaction\" :\n' renvoie au diagramme de SEQUENCE existant du meme nom.\n' Un noeud contenant une action ordinaire (\"verifier le stock\")\n' ferait de ce diagramme un simple diagramme d'activites.\n\nif (stock_location > 0 ?) then ([stock_location > 0])\n' NOEUD DE DECISION : losange, UNE entree, PLUSIEURS sorties\n' GARDEES et mutuellement exclusives -> un SEUL chemin est pris.\n' (Le support de l'ecole appelle ceci une \"fusion\" : terme non\n'  normatif. UML 2.5.1 dit noeud de DECISION.)\n\n  :ref LouerUnJeu;\n\n  fork\n  ' NOEUD DE BIFURCATION (fork) : barre epaisse, UNE entree,\n  ' PLUSIEURS sorties, AUCUNE garde -> toutes les branches\n  ' partent EN PARALLELE.\n  ' (Le support de l'ecole dit \"debranchement\" : non normatif.)\n    :ref Payer;\n  fork again\n    :ref ImprimerRecu;\n  end fork\n  ' NOEUD DE JONCTION (join) : barre epaisse, PLUSIEURS entrees,\n  ' UNE sortie -> on ATTEND que les DEUX branches soient finies\n  ' avant de continuer. Une bifurcation doit toujours etre\n  ' refermee par une jonction.\n\nelse ([stock_location = 0])\n  :ref ReserverJeu;\nendif\n' NOEUD DE FUSION : losange, PLUSIEURS entrees, UNE sortie, SANS\n' garde -> il rassemble les deux branches ALTERNATIVES.\n' Regle de symetrie : ce qu'une decision ouvre, une fusion le\n' referme ; ce qu'une bifurcation ouvre, une jonction le referme.\n\nstop\n' NOEUD FINAL : disque plein cercle\n\n@enduml\n\n' --- Les quatre noeuds de controle, resumes ---\n' DECISION    losange, 1 entree, n sorties GARDEES  -> alternatif\n' FUSION      losange, n entrees, 1 sortie          -> fin d'alternatif\n' BIFURCATION barre,   1 entree, n sorties          -> parallelisme\n' JONCTION    barre,   n entrees, 1 sortie          -> synchronisation\n\n' --- Synthese de la semaine ---\n' SEQUENCE      : le DETAIL d'un scenario. Lignes de vie verticales,\n'   temps de haut en bas, message par message.\n' COMMUNICATION : les MEMES echanges, vue SPATIALE. Objets relies\n'   par des liens, messages numerotes. Equivalent au precedent :\n'   un outil passe de l'un a l'autre automatiquement.\n' VUE D'ENSEMBLE : l'ASSEMBLAGE de plusieurs scenarios. C'est la\n'   TABLE DES MATIERES des diagrammes de sequence -- elle dit dans\n'   quel ordre et sous quelles conditions ils s'enchainent.\n' Ordre de travail : ecrire les sequences D'ABORD, assembler\n'   ENSUITE. Sinon les \"ref\" renvoient a des diagrammes inexistants.",
