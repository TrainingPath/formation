  theory: `
<h3>1. Le diagramme central</h3>
<p>Le <strong>diagramme de classes</strong> (sigle <strong>DCL</strong> dans ton cours d'école) est le plus utilisé de tout UML. Il décrit la <strong>structure statique</strong> du système : quelles classes existent, ce qu'elles savent (leurs <strong>attributs</strong>) et ce qu'elles savent faire (leurs <strong>opérations</strong>).</p>
<p>C'est aussi le diagramme le plus proche du code : dans trois jours, tu le traduiras mécaniquement en Python et en Java, puis en tables SQL. Autant dire qu'une erreur ici se paie partout ailleurs.</p>

<h3>2. Objet et classe</h3>
<p>Un <strong>objet</strong> est une entité du monde réel ou virtuel, dotée de propriétés et d'un comportement. Une <strong>classe</strong> est l'<strong>abstraction</strong> d'un ensemble d'objets ayant la même structure et le même comportement.</p>
<pre class="pseudo"># A la ludotheque
La classe  Jeu           # le concept general : tout jeu a un titre, un prix...
L'objet    "Catan" n°7   # UNE instance concrete de cette classe
L'objet    "Dixit" n°3   # une autre instance de la MEME classe

# On dit : "Catan n°7 est une INSTANCE de la classe Jeu"</pre>
<div class="tip">Règle de nommage : une classe se nomme au <strong>singulier</strong> et commence par une <strong>majuscule</strong> — <code>Jeu</code>, pas <code>Jeux</code> ni <code>jeu</code>. Elle désigne le concept, pas la collection.</div>

<h3>3. Les trois compartiments</h3>
<p>Une classe se dessine comme un <strong>rectangle à trois compartiments</strong> : le nom, les attributs, les opérations.</p>
<pre class="pseudo">       +--------------------------------+
       |              Jeu               |  <- 1. le NOM (au singulier, majuscule)
       +--------------------------------+
       | - titre : String               |  <- 2. les ATTRIBUTS (ce qu'il SAIT)
       | - prixLocation : Real          |
       | - stockLocation : Integer      |
       +--------------------------------+
       | + louer(m : Membre) : Location |  <- 3. les OPERATIONS (ce qu'il SAIT FAIRE)
       | + estDisponible() : Boolean    |
       +--------------------------------+</pre>
<p>Les deux derniers compartiments sont <strong>facultatifs</strong> à l'affichage : dans une vue d'ensemble, on montre souvent le nom seul, ou le nom et les attributs. Cacher un compartiment ne veut pas dire qu'il est vide — juste qu'il n'est pas utile ici.</p>
<div class="warn"><strong>Écart avec ton cours d'école.</strong> Le support du PAC mentionne deux compartiments supplémentaires possibles : les « responsabilités » et les « exceptions traitées ». Ces compartiments ne sont <strong>pas normalisés</strong> par UML 2.5.1 (les responsabilités viennent des cartes CRC, un autre outil d'analyse). Tu peux les rencontrer dans ton cours ; ne les considère pas comme de l'UML standard.</div>

<h3>4. La visibilité : quatre symboles</h3>
<p>Devant chaque attribut et chaque opération, un symbole dit <strong>qui a le droit d'y accéder</strong> :</p>
<pre class="pseudo">+  public     # visible par TOUTES les autres classes
-  prive      # visible seulement A L'INTERIEUR de la classe
#  protege    # visible dans la classe ET dans toutes ses sous-classes
~  paquetage  # visible a l'interieur du paquetage ou se trouve la classe</pre>
<p>La règle de conception, elle, tient en une phrase : <strong>attributs privés, opérations publiques</strong>. C'est l'<strong>encapsulation</strong> — on cache l'état, on expose le service. Si <code>stockLocation</code> était public, n'importe qui pourrait le mettre à <code>-5</code> ; en le rendant privé et en passant par <code>louer()</code>, la classe garde le contrôle de sa cohérence.</p>

<h3>5. La syntaxe exacte d'un attribut</h3>
<p>UML 2.5.1 définit précisément l'ordre des éléments :</p>
<pre class="pseudo">visibilite  /nom : type [multiplicite] = valeurParDefaut {proprietes}

# Exemples, du plus simple au plus complet
- titre : String                       # prive, de type chaine
- prixLocation : Real = 3.50           # avec une valeur par defaut
- prenoms : String [1..3]              # MULTIVALUE : de 1 a 3 prenoms
- dateAjout : Date {readOnly}          # non modifiable apres creation
/ ageJeu : Integer                     # ATTRIBUT DERIVE (calcule, non stocke)</pre>
<p>La barre oblique <code>/</code> devant le nom marque un <strong>attribut dérivé</strong> : sa valeur se <em>calcule</em> à partir d'autres attributs, elle n'est pas stockée. L'âge se déduit de la date de naissance ; le total d'une vente se déduit de ses lignes.</p>
<div class="warn"><strong>Attention à une coquille de ton support.</strong> Le PAC écrit la syntaxe <code>Visibilité/Nom attribut : type</code>, ce qui laisse croire que la barre oblique sépare la visibilité du nom. C'est faux : <strong>le <code>/</code> est le marqueur d'attribut dérivé</strong>. Le support le confirme d'ailleurs plus loin en écrivant « /nom de l'attribut dérivé ». Retiens la forme normative ci-dessus.</div>

<h3>6. La syntaxe exacte d'une opération</h3>
<pre class="pseudo">visibilite  nom(parametres) : typeRetour {proprietes}

# Exemples
+ louer(m : Membre, nbJours : Integer) : Location
+ estDisponible() : Boolean {query}    # {query} : ne modifie PAS l'etat
+ appliquerRemise(taux : Real) : void  # ne retourne rien
- verifierStock() : Boolean            # operation interne, privee</pre>
<p>Une opération se nomme par un <strong>verbe</strong> — c'est une action. Les parenthèses sont <strong>toujours écrites</strong>, même vides : <code>estDisponible()</code>. La propriété <code>{query}</code> signale une opération qui se contente de lire l'état sans le modifier.</p>
<div class="tip"><strong>Opération ou méthode ?</strong> Ton cours fait la distinction, et elle est juste : l'<strong>opération</strong> est la déclaration (le <em>quoi</em>, visible dans le diagramme), la <strong>méthode</strong> est son implémentation (le <em>comment</em>, écrit dans le code). En UML, on modélise des opérations.</div>

<h3>7. Le niveau classe : le soulignement</h3>
<p>Certains attributs et opérations n'appartiennent pas à <em>chaque objet</em> mais à <strong>la classe entière</strong>. On les note en les <strong>soulignant</strong>.</p>
<pre class="pseudo">       +----------------------------------+
       |               Jeu                |
       +----------------------------------+
       | - titre : String                 |  # propre a CHAQUE jeu
       | - tauxTva : Real = 0.21          |  # SOULIGNE : commun a TOUS les jeux
       +----------------------------------+
       | + creer(t : String) : Jeu        |  # SOULIGNE : appelable sans instance
       +----------------------------------+
# (le soulignement ne se rend pas en texte brut : ici, les deux lignes
#  marquees "SOULIGNE" seraient soulignees sur un vrai diagramme)</pre>
<p>Le taux de TVA est le même pour tous les jeux : inutile de le stocker mille fois. En Python ce sera un attribut de classe, en Java un membre <code>static</code>.</p>

<h3>8. Les types</h3>
<p>UML n'impose pas les types d'un langage particulier. On emploie des <strong>types primitifs</strong> génériques, ou un <strong>type classe</strong> quand l'attribut désigne un autre objet :</p>
<pre class="pseudo">String   Integer   Real   Boolean   Date    # types primitifs courants
Membre                                      # type CLASSE : renvoie a une autre classe</pre>
<div class="warn">Quand un attribut a pour type une <strong>autre classe</strong> du diagramme, c'est presque toujours le signe qu'il faut dessiner une <strong>association</strong> à la place (demain). Écrire <code>- categorie : Categorie</code> dans le compartiment des attributs « cache » une relation qui mériterait un trait visible.</div>

<h3>9. La classe complète de la Ludothèque</h3>
