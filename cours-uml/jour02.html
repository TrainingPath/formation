var DAY = {
  num: 2,
  title: "UML face à Merise : deux écoles, un même réel",
  subtitle: "Panorama des 14 diagrammes, et ce que Merise fait que UML fait autrement.",
  theory: `
<h3>1. Deux écoles, deux points d'entrée</h3>
<p><strong>Merise</strong> est une méthode française née dans les années 1970-80, pensée pour les <strong>systèmes d'information de gestion</strong>. Elle sépare les <em>données</em> des <em>traitements</em> et descend par niveaux : conceptuel, logique, physique. Son produit vedette est le <strong>MCD</strong> (modèle conceptuel de données).</p>
<p><strong>UML</strong> est un <strong>langage</strong> international (normalisé par l'OMG), né dans les années 1990 de la fusion de plusieurs notations objet. Il ne sépare pas données et traitements : il décrit des <strong>objets</strong>, qui portent à la fois un état (attributs) et un comportement (opérations).</p>
<pre class="pseudo"># La difference de fond
Merise : "quelles DONNEES stocke-t-on, et quels TRAITEMENTS les modifient ?"
         -> deux modeles separes, qu'on fait dialoguer
UML    : "quels OBJETS existent, que savent-ils et que savent-ils faire ?"
         -> l'etat et le comportement sont dans le meme paquet : la classe</pre>
<div class="tip">Elles ne s'opposent pas. Beaucoup d'analystes francophones font un MCD Merise pour la base, et des diagrammes UML pour le reste de l'application. Ce cours te donne les deux points de vue sur <strong>le même</strong> projet : la Ludothèque.</div>

<h3>2. L'approche objet en six mots</h3>
<p>UML est bâti sur l'approche objet. Six concepts la résument :</p>
<pre class="pseudo">Objet     # une entite du monde reel ou virtuel, avec des proprietes
          #   et un comportement (le jeu "Catan" n°7 de la ludotheque)
Classe    # l'abstraction d'un ensemble d'objets de meme structure
          #   (la classe Jeu, dont "Catan" est une instance)
Encapsulation # regrouper donnees (attributs) et traitements (operations)
              #   dans la meme classe, et cacher le detail interne
Interface # l'ensemble des operations visibles par les autres classes
Generalisation/Specialisation # factoriser le commun dans une super-classe
                              #   (Membre et Employe sont des Personne)
Polymorphisme # une meme operation s'execute differemment selon la classe
Persistance   # capacite d'un objet a survivre a l'execution du programme</pre>

<h3>3. Les 14 diagrammes d'UML 2.5.1</h3>
<p>UML classe ses diagrammes en deux familles. <strong>Structurels</strong> (ou statiques) : ce que le système <em>est</em>. <strong>Comportementaux</strong> (ou dynamiques) : ce que le système <em>fait</em>.</p>
<pre class="pseudo"># STRUCTURELS (7)
Classes            # les classes, leurs attributs, operations et relations
Objets             # des instances concretes, a un instant donne
Paquetages         # regrouper les elements du modele en sous-ensembles
Structure composite# la structure INTERNE d'un classifieur
Composants         # l'organisation des composants logiciels
Deploiement        # la repartition du logiciel sur le materiel
Profils            # etendre UML lui-meme (stereotypes)

# COMPORTEMENTAUX (7)
Cas d'utilisation  # les fonctionnalites attendues, vues des utilisateurs
Activites          # l'enchainement logique des actions d'un processus
Machine a etats    # le cycle de vie d'un objet (etats et transitions)
Sequence           # les interactions entre objets, dans l'ordre du temps
Communication      # les memes interactions, vues sous l'angle des liens
Vue d'ensemble des interactions # assembler des interactions completes
Temps (timing)     # les contraintes de duree et l'evolution des etats</pre>
<div class="warn"><strong>Attention, écart avec ton cours d'école.</strong> Le support du PAC annonce <strong>treize</strong> diagrammes : il omet le <strong>diagramme de profils</strong>. La norme UML 2.5.1 en compte bien <strong>quatorze</strong>. Nous étudierons les quatorze (les profils au jour 25) — si ton examen demande « combien de diagrammes ? », réponds ce que ton cours enseigne, mais sache que la norme dit 14.</div>

<h3>4. Quels diagrammes pour qui ?</h3>
<p>On n'utilise jamais les quatorze sur un même projet. Le choix dépend du public :</p>
<pre class="pseudo">Pour la MOA (le metier) : cas d'utilisation, activites, classes,
                          objets, sequence, machine a etats
                          -> ils font comprendre le FONCTIONNEMENT
Pour la MOE (la technique): composants, deploiement, communication
                          -> ils formalisent les CONTRAINTES TECHNIQUES</pre>
<p>Ton cours d'école recommande aussi un <strong>ordre de présentation</strong> d'un modèle, du plus général au plus détaillé :</p>
<pre class="pseudo">1. Diagramme de cas d'utilisation # vision globale des fonctionnalites
2. Diagramme d'activites          # les processus internes de chaque cas
3. Diagramme de sequence          # la chronologie de chaque scenario
4. Diagramme de classes           # les objets manipules, en detail</pre>

<h3>5. Le même réel, deux notations : la Ludothèque</h3>
<p>Voici le cœur de la journée. Prenons une règle métier de la Ludothèque : <em>un jeu appartient à une catégorie ; une catégorie contient plusieurs jeux</em>. Comparons.</p>
<pre class="pseudo"># MERISE — Modele Conceptuel de Donnees (MCD)
   +------------------+                    +------------------+
   |    CATEGORIE     |                    |       JEU        |
   +------------------+  0,n  APPARTENIR   +------------------+
   | id_categorie     |----------------1,1-| id_jeu           |
   | nom              |                    | titre            |
   +------------------+                    | prix_location    |
                                           +------------------+
# On lit les CARDINALITES du cote de l'entite concernee :
#   "une categorie appartient a 0,n jeux" -> cote CATEGORIE
#   "un jeu appartient a 1,1 categorie"   -> cote JEU

# UML — Diagramme de classes
   +------------------+                    +------------------+
   |    Categorie     |                    |       Jeu        |
   +------------------+ 1            0..*  +------------------+
   | - nom : String   |--------------------| - titre : String |
   +------------------+                    | - prixLocation   |
   | + lister() ...   |                    +------------------+
   +------------------+                    | + louer() ...    |
                                           +------------------+
# On lit les MULTIPLICITES a l'extremite OPPOSEE :
#   le "0..*" pres de Jeu se lit "une Categorie contient 0 a N Jeux"
#   le "1"    pres de Categorie se lit "un Jeu a exactement 1 Categorie"</pre>
<div class="warn"><strong>Le piège numéro un</strong> quand on passe de Merise à UML : la <strong>position</strong> du chiffre change de sens. En Merise, la cardinalité <code>1,1</code> écrite près de JEU décrit ce que fait <em>un jeu</em>. En UML, la multiplicité <code>1</code> écrite près de <code>Categorie</code> décrit <em>combien de Categorie</em> a un Jeu. Le nombre est du côté de ce qu'on <strong>compte</strong>, pas de ce qu'on décrit.</div>

<h3>6. Le tableau de correspondance</h3>
<pre class="pseudo">MERISE                        UML
------                        ---
Entite                        Classe (sans les operations)
Attribut / propriete          Attribut
Association                   Association
Cardinalite  0,n / 1,1        Multiplicite  0..* / 1..1 (ou 1)
Identifiant (souligne)        pas de notation native (voir jour 14)
Association porteuse          Classe-association
Heritage (rare en Merise)     Generalisation / specialisation
(rien : Merise ignore le      Operations, visibilite, interfaces,
 comportement des objets)      polymorphisme</pre>
<div class="tip">Note la dernière ligne : c'est ce que Merise ne dit pas. Un MCD te donne une base de données ; il ne te dit pas quelles <strong>méthodes</strong> aura la classe <code>Location</code>, ni dans quel <strong>ordre</strong> se déroule une location. C'est là qu'UML prend le relais.</p></div>

<h3>7. Les formats de multiplicité en UML</h3>
<pre class="pseudo">0..1   # zero ou un (facultatif, au plus un)
1      # exactement un (equivaut a 1..1)
0..*   # zero ou plusieurs (s'ecrit aussi simplement *)
1..*   # au moins un
2..10  # entre 2 et 10
1,3    # exactement 1 ou exactement 3 (valeurs enumerees)</pre>
<div class="tip">Bonne nouvelle pour toi : le chapitre du PAC consacré au MCD utilise <strong>déjà les multiplicités UML</strong> (<code>0..*</code>, <code>1..1</code>) et non les cardinalités Merise (<code>0,n</code>). Il emploie systématiquement le mot <strong>« multiplicité »</strong>, jamais « cardinalité ». Nous ferons pareil.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence de fond entre Merise et UML ?", opts: ["Merise est plus récent qu'UML", "Merise sépare données et traitements ; UML réunit état et comportement dans l'objet", "Merise est graphique, UML est textuel", "UML ne sert qu'aux bases de données"], a: 1, exp: "Merise sépare les deux modèles ; l'approche objet d'UML les encapsule ensemble dans la classe." },
    { type: "qcm", q: "En UML, une classe regroupe…", opts: ["Uniquement des données", "Des attributs (l'état) et des opérations (le comportement)", "Uniquement des méthodes", "Des tables et des index"], a: 1, exp: "C'est l'encapsulation : données et traitements dans la même classe." },

    { type: "qcm", q: "Quel diagramme manque à la liste de « treize diagrammes » du cours de l'école ?", opts: ["Le diagramme de composants", "Le diagramme de profils", "Le diagramme de temps", "Le diagramme d'objets"], a: 1, exp: "Le diagramme de profils (extension d'UML par stéréotypes) est absent de la liste du support ; la norme en compte 14." },
    { type: "qcm", q: "Le diagramme de déploiement appartient à la famille…", opts: ["Comportementale", "Structurelle", "Ni l'une ni l'autre", "Les deux à la fois"], a: 1, exp: "Il décrit une architecture physique : c'est un diagramme structurel (statique)." },

    { type: "qcm", q: "Selon le cours, quels diagrammes conviennent le mieux à la MOA (le métier) ?", opts: ["Composants et déploiement", "Cas d'utilisation, activités, classes, séquence, états", "Profils et structure composite", "Uniquement le diagramme de classes"], a: 1, exp: "Ils rendent le fonctionnement compréhensible ; composants et déploiement visent plutôt la MOE." },

    { type: "input", q: "Comment appelle-t-on la capacité d'un objet à survivre à l'exécution du programme qui l'a créé ? (un mot)", a: ["persistance", "la persistance"], ph: "un mot", exp: "La persistance : elle justifie de stocker les objets en base de données." }
  ],
  final: {
    title: "Exercice final — Traduire le MCD de la Ludothèque en langage UML",
    intro: `<p>Tu as (ou tu auras) fait en Merise le MCD de la Ludothèque. On y trouve l'entité <strong>MEMBRE</strong>, l'entité <strong>EXEMPLAIRE</strong>, et entre elles l'association <strong>LOUER</strong>, porteuse de <code>date_debut</code> et <code>date_fin</code>. Les cardinalités : un membre loue <code>0,n</code> exemplaires, un exemplaire est loué par <code>0,n</code> membres. Traduisons.</p>`,

      { type: "qcm", q: "La cardinalité Merise 0,n des deux côtés se traduit en UML par…", opts: ["1 d'un côté et 0..* de l'autre", "0..* aux deux extrémités", "1..1 aux deux extrémités", "0..1 aux deux extrémités"], a: 1, exp: "0,n ↔ 0..* ; ici la relation est plusieurs-à-plusieurs des deux côtés." },

      { type: "input", q: "En UML, quel mot emploie-t-on pour ce que Merise appelle « cardinalité » ? (un mot)", a: ["multiplicité", "multiplicite", "la multiplicité"], ph: "un mot", exp: "UML dit « multiplicité » ; le chapitre MCD de ton cours emploie déjà ce mot." }
    ],
    solution: `<pre class="pseudo"># Du MCD Merise au diagramme de classes UML — la Ludotheque

# MERISE
  MEMBRE  0,n ---- LOUER ---- 0,n  EXEMPLAIRE
                  (date_debut, date_fin)

# UML
  +----------------+                    +------------------+
  |     Membre     | 0..*        0..*   |    Exemplaire    |
  +----------------+--------------------+------------------+
  | - nom : String |         |          | - etat : String  |
  +----------------+         |          +------------------+
                             |
                    +--------+---------+   <- classe-association
                    |     Location     |      (trait pointille)
                    +------------------+
                    | - dateDebut:Date |
                    | - dateFin : Date |
                    +------------------+
                    | + prolonger()    |   <- ce que Merise ne dit pas
                    +------------------+

# Correspondances appliquees
Entite MEMBRE              -> classe Membre
Entite EXEMPLAIRE          -> classe Exemplaire
Association porteuse LOUER -> classe-association Location
Cardinalites 0,n / 0,n     -> multiplicites 0..* / 0..*
(rien en Merise)           -> operation prolonger() sur Location</pre>
<p>Tu as traduit ton premier modèle. Retiens surtout la dernière ligne : UML ne se contente pas de redire le MCD, il ajoute le <strong>comportement</strong>. Demain, on commence par le début du cycle : à quoi sert le système, et pour qui — le diagramme de cas d'utilisation.</p>`
  }
};
