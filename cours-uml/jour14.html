<h3>1. Le problème du jour</h3>
<p>Hier, tu as traduit le diagramme de classes en objets Python et Java. Mais les objets meurent avec le programme. Le jour 2 t'a donné le mot pour ce qui manque : la <strong>persistance</strong>, cette capacité d'un objet à survivre à l'exécution du programme qui l'a créé. Concrètement, cela veut dire : une base de données relationnelle.</p>
<p>Ce jour-ci fait donc descendre la <em>même</em> conception dans une <em>autre</em> direction. Et c'est là que le cours d'UML rejoint le cours de Merise : le diagramme de classes et le MCD racontent la même histoire, et se traduisent en tables par des règles très proches.</p>

<h3>2. Les trois correspondances de base</h3>
<pre class="pseudo"># La regle fondamentale du passage au relationnel
Classe UML      ->  une TABLE
Attribut UML    ->  une COLONNE de cette table
Instance/objet  ->  une LIGNE de cette table (un enregistrement)</pre>
<p>Reprends la Ludothèque. La classe <code>Jeu</code> devient la table <code>jeu</code> ; ses attributs <code>titre</code>, <code>prix_location</code>, <code>prix_vente</code>, <code>stock_location</code>, <code>stock_vente</code> deviennent des colonnes ; le jeu « Catan » devient une ligne.</p>

<h3>3. L'identifiant : le trou d'UML</h3>
<p>Une table a besoin d'une <strong>clé primaire</strong> : la colonne qui identifie chaque ligne sans ambiguïté. Or, comme le tableau de correspondance du jour 2 l'annonçait, <strong>UML n'a pas de notation native pour l'identifiant</strong>. Rien, dans le langage standard, ne dit « cet attribut est la clé ».</p>
<pre class="pseudo"># Les deux notations que tu vas rencontrer
MERISE / la plupart des notations
   +-------------------+
   |       CLIENT      |
   +-------------------+
   | no_client         |   &lt;-- SOULIGNE : c'est l'identifiant
   | nom_client        |
   +-------------------+

LE SUPPORT DE TON ECOLE (chapitre 4.2 du PAC)
   +---------------------------+
   |          Client           |
   +---------------------------+
   | No client {Unique}        |   &lt;-- CONTRAINTE placee APRES le nom
   | Nom client : String       |
   +---------------------------+</pre>
<div class="warn"><strong>Écart important à connaître.</strong> Le support de l'école note l'identifiant par une contrainte <code>{Unique}</code> placée <em>après le nom de l'attribut</em>, et précise que la contrainte <code>{Unique}</code> implique aussi « non nul ». <strong>Cette notation n'est pas normative en UML.</strong> Dans le standard, <code>{unique}</code> est une propriété qui qualifie une <em>multiplicité de collection</em> — elle dit qu'une collection ne contient pas de doublons — et n'a rien à voir avec la clé primaire d'une entité. L'usage courant, et celui de Merise, est le <strong>soulignement</strong>. Apprends le standard (soulignement), reconnais la variante de l'école (<code>{Unique}</code>), et sache pourquoi elles diffèrent : c'est exactement le genre de question qui distingue celui qui a compris de celui qui a recopié.</div>
<pre class="pseudo"># Dans les deux cas, la traduction en base est la MEME
identifiant (souligne ou {Unique})  ->  PRIMARY KEY
identifiant compose sur 2 attributs ->  PRIMARY KEY (col1, col2)</pre>

<h3>4. Association 1..* : la clé étrangère</h3>
<p>C'est la traduction la plus fréquente. Reprends l'association du jour 2 : <em>une Catégorie regroupe 0..* Jeu ; un Jeu appartient à 1 Catégorie.</em></p>
<pre class="pseudo"># LA REGLE
Association "un cote 1, un cote plusieurs"
   ->  une CLE ETRANGERE placee du cote "PLUSIEURS"

# Pourquoi de ce cote ? Parce qu'une colonne ne contient qu'UNE valeur.
# Un jeu a UNE categorie : sa categorie tient dans une colonne.
# Une categorie a PLUSIEURS jeux : impossible de les mettre
# dans une colonne (ce serait violer la regle de description).</pre>
<pre class="pseudo">categorie                     jeu
+--------------+-------+      +--------+-------+--------------+
| categorie_id | nom   |      | jeu_id | titre | categorie_id |
+--------------+-------+      +--------+-------+--------------+
|      1       | Strat.|&lt;-----|   1    | Catan |      1       |
|      2       | Ambian|&lt;--+  |   2    | Dixit |      2       |
+--------------+-------+   +--|   3    | Risk  |      1       |
                              +--------+-------+--------------+
# categorie_id dans jeu = CLE ETRANGERE vers categorie.categorie_id
# La lecture "tous les jeux d'une categorie" se fait par JOINTURE.</pre>
<div class="tip">Le test qui ne trompe jamais : la clé étrangère va du côté qui n'a qu'<strong>un seul</strong> partenaire. Si tu hésites, demande-toi « combien de valeurs devrais-je écrire dans la colonne ? ». Si la réponse est « plusieurs », tu t'es trompé de côté.</div>

<h3>5. Association *..* : la table d'association</h3>
<p>Quand les deux côtés sont « plusieurs », aucune des deux tables ne peut porter la clé étrangère. Il faut une <strong>troisième table</strong>, dite <strong>table d'association</strong> (ou table de jonction), qui porte les deux clés étrangères.</p>
<pre class="pseudo"># LA REGLE
Association *..*  ->  une TABLE D'ASSOCIATION portant les DEUX
                      cles etrangeres ; sa cle primaire est en
                      general la combinaison des deux (cle composee)</pre>
<p>Et voici le point qui boucle tout le cours : <strong>c'est exactement ce que devient une classe-association</strong>. La classe-association <code>Location</code>, entre <code>Membre</code> et <code>Exemplaire</code>, avec ses attributs <code>date_debut</code>, <code>date_fin</code> et <code>caution</code>, devient la table <code>location</code> qui porte <code>membre_id</code>, <code>exemplaire_id</code> et ses colonnes propres.</p>
<pre class="pseudo">   Membre  0..* -------------------- 0..*  Exemplaire
                        |
                    Location
              (date_debut, date_fin, caution)

                      DEVIENT

location
+-----------+---------------+------------+----------+---------+
| membre_id | exemplaire_id | date_debut | date_fin | caution |
+-----------+---------------+------------+----------+---------+
|     7     |      42       | 2026-03-01 |2026-03-08|  20.00  |
+-----------+---------------+------------+----------+---------+
   ^ FK vers membre    ^ FK vers exemplaire   ^ colonnes propres</pre>
<div class="tip">La chaîne complète du site, en une ligne : <strong>association porteuse</strong> (Merise) → <strong>classe-association</strong> (UML) → <strong>classe à deux références</strong> (code, jour 13) → <strong>table d'association</strong> (base de données). Un seul concept, quatre visages. Si tu retiens une chose du mois, que ce soit celle-là.</div>

<h3>6. Composition : NOT NULL et suppression en cascade</h3>
<p>Le jour 13 l'a montré : en code, la composition tient à la discipline du développeur. En base de données, on peut faire mieux — le SGBD peut <strong>garantir</strong> la contrainte de durée de vie.</p>
<pre class="pseudo"># COMPOSITION (losange plein)  Jeu &lt;&gt;----- Exemplaire
#   "un Exemplaire n'existe pas sans son Jeu"
#   ->  cle etrangere jeu_id NOT NULL         (elle ne peut pas manquer)
#   ->  ON DELETE CASCADE                     (elle disparait avec le tout)

# AGREGATION (losange creux)   Location &lt;&gt;----- Membre
#   "le Membre survit a la Location"
#   ->  cle etrangere ordinaire, sans cascade
#   ->  souvent ON DELETE RESTRICT : on refuse de supprimer un membre
#       qui a encore des locations, au lieu de les effacer avec lui</pre>
<pre class="pseudo">-- COMPOSITION traduite en SQL
CREATE TABLE exemplaire (
  exemplaire_id  INT          NOT NULL AUTO_INCREMENT,
  numero         INT          NOT NULL,
  etat           VARCHAR(30)  NOT NULL DEFAULT 'bon',
  jeu_id         INT          NOT NULL,          -- NOT NULL = composition
  PRIMARY KEY (exemplaire_id),
  CONSTRAINT fk_exemplaire_jeu
    FOREIGN KEY (jeu_id) REFERENCES jeu (jeu_id)
    ON DELETE CASCADE                            -- il meurt avec son Jeu
);</pre>
<div class="warn">La composition est le seul cas où le losange se traduit par quelque chose que la base <strong>fait respecter toute seule</strong>. Si tu écris <code>jeu_id INT NULL</code> sans cascade, tu as dessiné un losange plein et livré une agrégation : le modèle et la base se contredisent, et c'est la base qui gagne.</div>

<h3>7. L'héritage : trois stratégies, aucune parfaite</h3>
<p>Le relationnel ne connaît pas l'héritage. Il faut donc <em>choisir</em> une traduction, et assumer ses défauts. Prenons <code>Personne</code>, avec ses spécialisations <code>Membre</code> (attribut <code>caution</code>) et <code>Employé</code> (attribut <code>matricule</code>).</p>

<p><strong>Stratégie 1 — une table par classe concrète.</strong> On oublie la classe mère ; chaque classe concrète reçoit sa table, avec les colonnes héritées recopiées.</p>
<pre class="pseudo">-- Strategie 1
CREATE TABLE membre (
  membre_id INT          NOT NULL AUTO_INCREMENT,
  nom       VARCHAR(60)  NOT NULL,      -- herite de Personne
  prenom    VARCHAR(60)  NOT NULL,      -- herite de Personne
  caution   DECIMAL(6,2) NOT NULL DEFAULT 20.00,
  PRIMARY KEY (membre_id)
);
CREATE TABLE employe (
  employe_id INT         NOT NULL AUTO_INCREMENT,
  nom       VARCHAR(60)  NOT NULL,      -- recopie
  prenom    VARCHAR(60)  NOT NULL,      -- recopie
  matricule VARCHAR(20)  NOT NULL,
  PRIMARY KEY (employe_id)
);</pre>
<pre class="pseudo"># AVANTAGES     tables simples, aucune jointure, aucune colonne nulle
# INCONVENIENTS les colonnes communes sont dupliquees dans le schema ;
#               lister TOUTES les personnes exige une UNION ;
#               une personne a la fois membre et employe est saisie
#               deux fois -> deux identifiants pour un seul individu</pre>

<p><strong>Stratégie 2 — une seule table pour toute la hiérarchie</strong>, avec une <strong>colonne discriminante</strong> qui dit de quelle sous-classe il s'agit.</p>
<pre class="pseudo">-- Strategie 2
CREATE TABLE personne (
  personne_id   INT          NOT NULL AUTO_INCREMENT,
  type_personne VARCHAR(10)  NOT NULL,   -- COLONNE DISCRIMINANTE
  nom           VARCHAR(60)  NOT NULL,
  prenom        VARCHAR(60)  NOT NULL,
  caution       DECIMAL(6,2) NULL,       -- NULL si c'est un employe
  matricule     VARCHAR(20)  NULL,       -- NULL si c'est un membre
  PRIMARY KEY (personne_id),
  CONSTRAINT ck_personne_type
    CHECK (type_personne IN ('membre', 'employe'))
);</pre>
<pre class="pseudo"># AVANTAGES     une seule table, aucune jointure, lecture tres rapide ;
#               lister toutes les personnes est immediat
# INCONVENIENTS BEAUCOUP DE COLONNES NULLES : chaque ligne porte les
#               colonnes des autres sous-classes ;
#               la base ne peut pas garantir qu'un membre a une caution
#               (la colonne doit rester NULL-able pour les employes) ;
#               ajouter une sous-classe = ajouter des colonnes a tous</pre>

<p><strong>Stratégie 3 — une table par classe, avec clé partagée.</strong> La classe mère a sa table ; chaque sous-classe a la sienne, dont la clé primaire est <em>aussi</em> une clé étrangère vers la table mère.</p>
<pre class="pseudo">-- Strategie 3
CREATE TABLE personne (
  personne_id INT         NOT NULL AUTO_INCREMENT,
  nom         VARCHAR(60) NOT NULL,
  prenom      VARCHAR(60) NOT NULL,
  PRIMARY KEY (personne_id)
);
CREATE TABLE membre (
  personne_id INT          NOT NULL,     -- CLE PARTAGEE : PK et FK
  caution     DECIMAL(6,2) NOT NULL DEFAULT 20.00,
  PRIMARY KEY (personne_id),
  CONSTRAINT fk_membre_personne
    FOREIGN KEY (personne_id) REFERENCES personne (personne_id)
    ON DELETE CASCADE
);</pre>
<pre class="pseudo"># AVANTAGES     fidele au modele, aucune colonne nulle, aucune
#               redondance ; une personne peut etre membre ET employe
#               sans etre saisie deux fois
# INCONVENIENTS toute lecture d'un membre complet exige une JOINTURE ;
#               une insertion touche deux tables ;
#               plus de tables, donc plus de requetes</pre>
<div class="tip">Aucune des trois n'est « la bonne ». Choisis la 2 si tu lis beaucoup et que les sous-classes ajoutent peu de colonnes ; la 3 si le modèle doit rester propre et que les sous-classes divergent ; la 1 si les sous-classes n'ont presque rien en commun en pratique. Ce qui compte à l'examen, c'est de savoir <strong>nommer les trois</strong> et <strong>citer un défaut de chacune</strong>.</div>

<h3>8. Les quatre règles de validation d'un modèle de données</h3>
<p>Avant de générer la moindre table, ton support d'école impose de valider le modèle. Voici les règles, citées fidèlement :</p>
<pre class="pseudo"># REGLE D'IDENTITE (regle 1)
"Toute entite presente dans un modele conceptuel de donnees doit
 comporter obligatoirement un identifiant. Chaque occurrence de
 l'entite doit posseder une valeur pour cet attribut. La valeur de
 l'attribut identifiant devra etre stable [...]. De plus deux
 occurrences de l'entite ne pourront avoir la meme valeur pour leur
 identifiant."
   -> en un mot : un identifiant est OBLIGATOIRE, STABLE, SANS DOUBLON
   -> en base   : PRIMARY KEY (donc NOT NULL et UNIQUE)

# REGLE DE DESCRIPTION (regle 2)
"Chaque attribut d'une entite presente dans le modele conceptuel ne
 peut prendre qu'une seule valeur a la fois pour son occurrence."
   -> un attribut = UNE SEULE valeur, ATOMIQUE (non decomposable)
   -> en base   : une colonne, une valeur. Pas de liste dans une case.

# REGLE DE NON REDONDANCE (regle 3)
"Chaque attribut du modele conceptuel est unique, il ne peut y
 apparaitre plus d'une fois a travers plusieurs entites du modele."
   -> un attribut n'apparait QU'UNE FOIS dans tout le modele
   -> le lien entre deux entites se fait par une ASSOCIATION,
      pas en recopiant un attribut de l'une dans l'autre

# REGLE DE CONSTRUCTION
"Une entite ne peut en contenir une autre. En particulier, une entite
 ne peut contenir un attribut d'une autre entite."
   -> les attributs appartiennent EN PROPRE a l'entite
   -> un attribut qui depend de DEUX entites n'appartient a aucune
      des deux : il appartient a l'ASSOCIATION entre elles</pre>
<p>Applique-les à la Ludothèque. <code>date_debut</code> dépend-il du membre seul ? Non. De l'exemplaire seul ? Non plus : il dépend du <em>couple</em>. Par la règle de construction, il appartient donc à l'association — c'est-à-dire à la classe-association <code>Location</code>, donc à la table <code>location</code>. La règle a désigné toute seule le bon endroit.</p>
<div class="warn">L'erreur classique du débutant, celle que le support illustre : mettre <code>no_client</code> comme attribut de l'entité <code>Commande</code> « pour montrer le lien ». C'est une double faute — non redondance (l'attribut apparaît deux fois dans le modèle) et construction (une entité contient un attribut d'une autre). Le lien se dessine par une <strong>association</strong>. La clé étrangère n'apparaît qu'<strong>au niveau logique</strong>, quand on descend vers les tables : jamais dans le modèle conceptuel.</div>

<h3>9. Le SQL de la Ludothèque, ligne par ligne</h3>
<p>Terminons par du vrai code. Deux tables : <code>jeu</code>, une classe ordinaire ; <code>location</code>, la classe-association.</p>
<pre class="pseudo">-- ================= TABLE JEU : une classe ordinaire =================
CREATE TABLE jeu (
  jeu_id         INT          NOT NULL AUTO_INCREMENT,
      -- l'IDENTIFIANT ({Unique} chez l'ecole, souligne en Merise).
      -- AUTO_INCREMENT : le SGBD le genere (identifiant artificiel,
      -- donc STABLE : il ne depend d'aucune donnee metier).
  titre          VARCHAR(120) NOT NULL,
      -- attribut UML "titre : String" -> colonne. NOT NULL car un jeu
      -- sans titre n'a pas de sens (contrainte de domaine).
  prix_location  DECIMAL(6,2) NOT NULL DEFAULT 0,
      -- DECIMAL et non FLOAT : on ne calcule jamais de l'argent
      -- en virgule flottante.
  prix_vente     DECIMAL(6,2) NOT NULL DEFAULT 0,
  stock_location INT          NOT NULL DEFAULT 0,
      -- deux stocks DISTINCTS : c'est une regle metier de la
      -- ludotheque, pas un detail technique.
  stock_vente    INT          NOT NULL DEFAULT 0,
  categorie_id   INT          NOT NULL,
      -- CLE ETRANGERE : association Categorie 1 ---- 0..* Jeu.
      -- Elle est du cote "plusieurs" (Jeu), car un jeu n'a
      -- qu'UNE categorie. NOT NULL traduit la multiplicite "1".
  PRIMARY KEY (jeu_id),
      -- traduction de la regle d'IDENTITE : obligatoire + sans doublon.
  CONSTRAINT fk_jeu_categorie
    FOREIGN KEY (categorie_id) REFERENCES categorie (categorie_id)
    ON DELETE RESTRICT,
      -- AGREGATION, pas composition : on refuse de supprimer une
      -- categorie encore utilisee plutot que d'effacer ses jeux.
  CONSTRAINT ck_jeu_stocks
    CHECK (stock_location &gt;= 0 AND stock_vente &gt;= 0)
      -- la contrainte {stock &gt;= 0} du diagramme, enfin APPLIQUEE :
      -- ici, contrairement au code, c'est la BASE qui la garantit.
);

-- ========= TABLE LOCATION : la classe-association =========
CREATE TABLE location (
  membre_id     INT          NOT NULL,
      -- premiere CLE ETRANGERE : le cote Membre de l'association.
  exemplaire_id INT          NOT NULL,
      -- seconde CLE ETRANGERE : le cote Exemplaire.
      -- Les deux ensemble font de "location" une TABLE D'ASSOCIATION.
  date_debut    DATE         NOT NULL,
      -- attribut PROPRE a l'association : par la regle de
      -- construction, il ne peut appartenir ni a Membre ni a
      -- Exemplaire, car il depend des DEUX.
  date_fin      DATE         NOT NULL,
  caution       DECIMAL(6,2) NOT NULL DEFAULT 20.00,
  PRIMARY KEY (membre_id, exemplaire_id, date_debut),
      -- IDENTIFIANT COMPOSE : un meme membre peut relouer le meme
      -- exemplaire plus tard, mais pas deux fois le meme jour.
  CONSTRAINT fk_location_membre
    FOREIGN KEY (membre_id) REFERENCES membre (membre_id)
    ON DELETE RESTRICT,
      -- le Membre SURVIT a la Location : agregation, pas de cascade.
  CONSTRAINT fk_location_exemplaire
    FOREIGN KEY (exemplaire_id) REFERENCES exemplaire (exemplaire_id)
    ON DELETE CASCADE,
      -- l'Exemplaire est un COMPOSANT du Jeu : s'il disparait,
      -- ses lignes de location n'ont plus d'objet.
  CONSTRAINT ck_location_dates
    CHECK (date_fin &gt; date_debut)
      -- la contrainte {date_fin &gt; date_debut} du diagramme.
);</pre>
<div class="tip"><code>AUTO_INCREMENT</code> est la syntaxe MySQL / MariaDB. En PostgreSQL on écrit <code>GENERATED ALWAYS AS IDENTITY</code>, en SQLite <code>INTEGER PRIMARY KEY AUTOINCREMENT</code>. L'idée est la même : laisser le SGBD produire un identifiant artificiel, donc stable.</div>

CREATE TABLE location (

CREATE TABLE personne (

    FOREIGN KEY (personne_id) REFERENCES personne (personne_id)
    ON DELETE CASCADE
);</pre>

    solution: "-- ==================================================================\n-- LUDOTHEQUE \"LE DE BLEU\" — schema relationnel issu du diagramme\n-- de classes. Syntaxe MySQL / MariaDB.\n-- Chaque commentaire indique l'element UML traduit.\n-- Ordre de creation impose par les dependances de cles etrangeres.\n-- ==================================================================\n\n\n-- ------------------------------------------------------------------\n-- CLASSE Categorie -> TABLE categorie\n-- ------------------------------------------------------------------\nCREATE TABLE categorie (\n  categorie_id INT         NOT NULL AUTO_INCREMENT,\n      -- IDENTIFIANT de la classe. Artificiel, donc STABLE :\n      -- il respecte la regle d'identite (obligatoire, stable,\n      -- sans doublon).\n  nom          VARCHAR(60) NOT NULL,\n      -- attribut UML \"nom : String\" -> colonne.\n  PRIMARY KEY (categorie_id)\n      -- traduction de l'identifiant : NOT NULL + UNIQUE.\n);\n\n\n-- ------------------------------------------------------------------\n-- CLASSE Jeu -> TABLE jeu\n-- Association  Categorie 1 ---- 0..* Jeu\n--   -> cle etrangere DU COTE \"PLUSIEURS\", donc ici.\n-- ------------------------------------------------------------------\nCREATE TABLE jeu (\n  jeu_id         INT          NOT NULL AUTO_INCREMENT,\n      -- identifiant de la classe Jeu.\n  titre          VARCHAR(120) NOT NULL,\n      -- attribut \"titre : String\".\n  prix_location  DECIMAL(6,2) NOT NULL DEFAULT 0,\n      -- attribut \"prixLocation : Real\". DECIMAL et non FLOAT :\n      -- on ne calcule pas de l'argent en virgule flottante.\n  prix_vente     DECIMAL(6,2) NOT NULL DEFAULT 0,\n      -- attribut \"prixVente : Real\".\n  stock_location INT          NOT NULL DEFAULT 0,\n      -- attribut \"stockLocation : Integer\".\n  stock_vente    INT          NOT NULL DEFAULT 0,\n      -- attribut \"stockVente : Integer\". Deux stocks DISTINCTS :\n      -- c'est une regle metier de la ludotheque.\n  categorie_id   INT          NOT NULL,\n      -- CLE ETRANGERE issue de l'association avec Categorie.\n      -- NOT NULL traduit la multiplicite \"1\" cote Categorie :\n      -- tout jeu appartient obligatoirement a une categorie.\n  PRIMARY KEY (jeu_id),\n  CONSTRAINT fk_jeu_categorie\n    FOREIGN KEY (categorie_id) REFERENCES categorie (categorie_id)\n    ON DELETE RESTRICT,\n      -- AGREGATION (pas de losange plein) : une categorie supprimee\n      -- ne doit pas emporter ses jeux. On refuse la suppression.\n  CONSTRAINT ck_jeu_stocks\n    CHECK (stock_location >= 0 AND stock_vente >= 0)\n      -- traduction directe de la contrainte {stock_location >= 0}\n      -- ecrite entre accolades sur le diagramme.\n);\n\n\n-- ------------------------------------------------------------------\n-- CLASSE Exemplaire -> TABLE exemplaire\n-- COMPOSITION  Jeu <>---- 1..* Exemplaire  (losange PLEIN)\n--   -> cle etrangere NOT NULL  + ON DELETE CASCADE\n-- ------------------------------------------------------------------\nCREATE TABLE exemplaire (\n  exemplaire_id INT         NOT NULL AUTO_INCREMENT,\n      -- identifiant de la classe Exemplaire.\n  numero        INT         NOT NULL,\n      -- attribut \"numero : Integer\" (le n de l'exemplaire du jeu).\n  etat          VARCHAR(30) NOT NULL DEFAULT 'bon',\n      -- attribut \"etat : String\".\n  jeu_id        INT         NOT NULL,\n      -- CLE ETRANGERE vers le composite.\n      -- NOT NULL = premiere moitie de la composition :\n      -- un Exemplaire n'existe PAS sans son Jeu.\n  PRIMARY KEY (exemplaire_id),\n  CONSTRAINT uq_exemplaire_numero UNIQUE (jeu_id, numero),\n      -- deux exemplaires du meme jeu ne portent pas le meme numero.\n  CONSTRAINT fk_exemplaire_jeu\n    FOREIGN KEY (jeu_id) REFERENCES jeu (jeu_id)\n    ON DELETE CASCADE\n      -- seconde moitie de la composition : le composant DISPARAIT\n      -- avec le composite. C'est ici, et seulement ici, que la\n      -- contrainte de duree de vie du losange plein est GARANTIE\n      -- par la base et non par la discipline du developpeur.\n);\n\n\n-- ------------------------------------------------------------------\n-- CLASSE Membre -> TABLE membre\n-- (reduite ici a ce qui est necessaire a la table location)\n-- ------------------------------------------------------------------\nCREATE TABLE membre (\n  membre_id INT          NOT NULL AUTO_INCREMENT,\n      -- identifiant de la classe Membre.\n  nom       VARCHAR(60)  NOT NULL,\n  prenom    VARCHAR(60)  NOT NULL,\n  PRIMARY KEY (membre_id)\n);\n\n\n-- ------------------------------------------------------------------\n-- CLASSE-ASSOCIATION Location -> TABLE D'ASSOCIATION location\n-- Association  Membre *..* Exemplaire, porteuse d'attributs.\n--   -> une table portant les DEUX cles etrangeres\n--      + ses colonnes propres.\n-- ------------------------------------------------------------------\nCREATE TABLE location (\n  membre_id     INT          NOT NULL,\n      -- premiere CLE ETRANGERE : le cote Membre de l'association.\n  exemplaire_id INT          NOT NULL,\n      -- seconde CLE ETRANGERE : le cote Exemplaire.\n      -- Les deux ensemble font de location une TABLE D'ASSOCIATION\n      -- (ce que Merise appelle une association porteuse).\n  date_debut    DATE         NOT NULL,\n      -- attribut PROPRE a la classe-association.\n  date_fin      DATE         NOT NULL,\n      -- attribut PROPRE a la classe-association.\n  caution       DECIMAL(6,2) NOT NULL DEFAULT 20.00,\n      -- attribut PROPRE a la classe-association.\n  PRIMARY KEY (membre_id, exemplaire_id, date_debut),\n      -- IDENTIFIANT COMPOSE : un meme membre peut relouer le meme\n      -- exemplaire plus tard, mais pas deux fois le meme jour.\n  CONSTRAINT fk_location_membre\n    FOREIGN KEY (membre_id) REFERENCES membre (membre_id)\n    ON DELETE RESTRICT,\n      -- AGREGATION : le Membre SURVIT a la Location.\n      -- Pas de cascade : on refuse d'effacer un membre qui a\n      -- encore un historique de locations.\n  CONSTRAINT fk_location_exemplaire\n    FOREIGN KEY (exemplaire_id) REFERENCES exemplaire (exemplaire_id)\n    ON DELETE CASCADE,\n      -- l'Exemplaire est lui-meme un COMPOSANT du Jeu : s'il\n      -- disparait, ses lignes de location n'ont plus d'objet.\n  CONSTRAINT ck_location_dates\n    CHECK (date_fin > date_debut)\n      -- traduction de la contrainte {date_fin > date_debut}.\n);\n\n\n-- ==================================================================\n-- POURQUOI date_debut EST-IL DANS location ET NON DANS membre ?\n--\n-- C'est la REGLE DE CONSTRUCTION qui tranche :\n--   \"Une entite ne peut en contenir une autre. En particulier,\n--    une entite ne peut contenir un attribut d'une autre entite.\"\n-- Son corollaire : un attribut qui depend de DEUX entites\n-- n'appartient en propre a aucune des deux ; il appartient a\n-- l'ASSOCIATION entre elles.\n--\n-- Or date_debut ne depend ni du membre seul (le meme membre a\n-- plusieurs dates de debut differentes), ni de l'exemplaire seul\n-- (le meme exemplaire est loue a plusieurs dates). Il depend du\n-- COUPLE membre + exemplaire. Sa place est donc la\n-- classe-association Location, c'est-a-dire la table location.\n--\n-- Le placer dans membre transgresserait en plus la REGLE DE\n-- DESCRIPTION : la colonne devrait contenir plusieurs dates a la\n-- fois pour une meme ligne, alors qu'un attribut ne prend qu'UNE\n-- seule valeur, atomique, par occurrence.\n-- ==================================================================",
