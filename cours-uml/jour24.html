  theory: `
<h3>1. La question à laquelle ce diagramme répond</h3>
<p>Reprends ton diagramme de classes de la Ludothèque. La classe <code>GestionLocation</code> y figure comme un rectangle, avec ses opérations : <code>louer()</code>, <code>rendre()</code>, <code>calculerPenalite()</code>. Parfait pour dire <em>ce qu'elle sait faire</em>. Mais totalement muet sur une autre question, tout aussi importante en conception : <strong>de quoi est-elle faite, à l'intérieur ?</strong></p>
<p>Le <strong>diagramme de structure composite</strong> (sigle <strong>DSC</strong> dans ton cours d'école) répond à cela. En UML 2.5.1, sa définition est sans ambiguïté : il décrit la <strong>structure interne d'un classifieur</strong> — c'est-à-dire les morceaux qui le constituent et la façon dont ces morceaux collaborent pour produire son comportement.</p>
<div class="tip">Le mot <strong>classifieur</strong> est volontairement large : il couvre les classes, les composants, les collaborations. Autrement dit, on peut ouvrir aussi bien une classe qu'un composant. C'est le même diagramme, et ce sont les mêmes symboles que tu as vus au jour 22.</div>

<h3>2. Les parties (parts)</h3>
<p>Une <strong>partie</strong> (<em>part</em>) est un <strong>élément constitutif</strong> du classifieur : un rôle joué, à l'intérieur, par un objet d'un certain type. On la dessine par un <strong>rectangle imbriqué</strong> dans le rectangle du classifieur, avec la syntaxe :</p>
<pre class="pseudo">nom : Type [multiplicite]

# Exemples
contrat : ContratLocation          # une partie, un seul objet
lignes  : LigneLocation [1..*]     # une partie MULTIPLE : au moins un objet
calcul  : CalculPrix               # sans multiplicite -&gt; 1 par defaut
        : VerificationStock        # le nom est facultatif : le TYPE suffit</pre>
<pre class="pseudo">   +--------------------------------------------------------+
   |                    GestionLocation                     |
   |                                                        |
   |   +--------------------------+  +-------------------+  |
   |   | contrat : ContratLocation|  | calcul : CalculPrix|  |
   |   +--------------------------+  +-------------------+  |
   |                                                        |
   |   +---------------------------------+                  |
   |   | lignes : LigneLocation [1..*]   |                  |
   |   +---------------------------------+                  |
   +--------------------------------------------------------+
   # Les rectangles IMBRIQUES sont les PARTIES.
   # Lecture : "un GestionLocation est fait d'un contrat,
   #            d'un calculateur de prix et d'au moins une ligne".</pre>
<p>Attention à la nuance : une partie n'est <strong>pas</strong> un attribut de plus. C'est un <strong>rôle interne</strong>, avec une durée de vie liée à celle du tout — très exactement la sémantique de la <strong>composition</strong> du diagramme de classes (le losange plein). Le DSC est en quelque sorte la vue « zoomée » d'une composition.</p>

<h3>3. Les ports</h3>
<p>Un <strong>port</strong> se note par un <strong>petit carré posé sur la bordure</strong> du classifieur. C'est un <strong>point d'interaction nommé et typé</strong> : tout ce qui entre ou sort du classifieur passe par un port.</p>
<pre class="pseudo">        pLouer                         pBanque
          [ ]                            [ ]
   +-------|----------------------------- |------------------+
   |       |          GestionLocation     |                  |
   |       v                              v                  |
   |   ( parties internes )                                  |
   +---------------------------------------------------------+
   # PORTS : petits carres A CHEVAL sur la bordure.
   # pLouer  : par ou l'IHM demande une location
   # pBanque : par ou l'on sort vers le composant Paiement</pre>
<p>Un port peut porter les mêmes symboles d'interface qu'au jour 22 : une <strong>boule</strong> (interface fournie par ce port) et une <strong>prise</strong> (interface requise à travers ce port). Un classifieur peut avoir plusieurs ports, ce qui permet de séparer proprement ses différents rôles : un port « côté client », un port « côté banque », un port « côté base de données ».</p>

<h3>4. Les connecteurs : assemblage et délégation</h3>
<p>Parties et ports ne servent à rien s'ils ne sont pas reliés. UML 2.5.1 définit exactement <strong>deux connecteurs</strong>, et ce sont les deux mêmes qu'au jour 22 :</p>
<pre class="pseudo">CONNECTEUR D'ASSEMBLAGE   entre DEUX PARTIES internes (des pairs)
                          "ces deux morceaux se parlent directement"

CONNECTEUR DE DELEGATION  d'un PORT EXTERNE vers une PARTIE interne
                          "ce qui arrive par ce port est traite par..."</pre>
<pre class="pseudo">        pLouer
          [ ]
   +-------|--------------------------------------------------+
   |       |             GestionLocation                      |
   |       |  DELEGATION                                       |
   |       v                                                   |
   |   +------------------------+        +------------------+  |
   |   | contrat : ContratLoc   |--------| calcul : CalcPrix|  |
   |   +------------------------+        +------------------+  |
   |               ^                                           |
   |          ASSEMBLAGE (entre deux parties, des pairs)        |
   |                                                           |
   |   +------------------------+                              |
   |   | stock : VerifStock     |                              |
   |   +------------------------+                              |
   +-----------------------------------------------------------+</pre>
<div class="tip">Le moyen le plus sûr de ne jamais les confondre : regarde les <strong>deux bouts du trait</strong>. Deux parties internes ? assemblage. Un port sur la bordure d'un côté, une partie de l'autre ? délégation. Le connecteur de délégation ne <em>traite</em> rien : il <strong>redirige</strong>.</div>

<h3>5. Le DSC de la Ludothèque, en entier</h3>
<p>Ouvrons le classifieur <code>GestionLocation</code>, celui qui orchestre le prêt d'un jeu à la Ludothèque :</p>
<pre class="pseudo">   pComptoir                                            pPaiement
      [ ]                                                  [ ]
       |                                                    |

   |   |                  GestionLocation                   |     |
   |   | delegation                            delegation   |     |
   |   v                                                    |     |
   | +--------------------------+                           |     |
   | | contrat : ContratLocation|                           |     |
   | +--------------------------+                           |     |
   |     |            |                                     |     |
   |     | assemblage | assemblage                          |     |
   |     v            v                                     v     |
   | +----------------+   +---------------------+  +--------------+|
   | | calcul :       |   | stock :             |  | caution :    ||
   | | CalculPrix     |   | VerificationStock   |  | GestionCaut. ||
   | +----------------+   +---------------------+  +--------------+|
   |                              |                                |
   |                              | assemblage                     |
   |                              v                                |
   |                      +---------------------+                  |
   |                      | resa :              |                  |
   |                      | Reservation [0..*]  |                  |
   |                      +---------------------+                  |
   +---------------------------------------------------------------+

# Lecture, en une phrase :
#   "Quand une demande de location arrive par pComptoir, elle est
#    deleguee au contrat, qui fait appel au calcul de prix
#    (prix_location), a la verification de stock_location et a la
#    gestion de la caution, laquelle sort par pPaiement."
# Les PARTIES ont une multiplicite quand c'est utile : [0..*] pour
# les reservations, car un contrat peut n'en honorer aucune.</pre>
<p>Compare avec ce que t'aurait dit le diagramme de classes : une classe <code>GestionLocation</code> avec cinq opérations, et rien sur la manière dont elles s'articulent. Le DSC montre l'<strong>architecture interne</strong>, sans descendre au niveau d'un diagramme de séquence.</p>

<h3>6. L'autre usage : la collaboration de rôles</h3>
<p>Il existe un <strong>second usage</strong> du diagramme de structure composite, moins fréquent mais tout à fait normalisé : la <strong>collaboration</strong>. Une collaboration décrit un <em>motif d'interaction</em> — un ensemble de <strong>rôles</strong> qui coopèrent pour rendre un service, indépendamment des classes concrètes qui joueront ces rôles.</p>
<p>Elle se note par une <strong>ellipse en pointillé</strong> contenant le nom de la collaboration et les rôles. Quand on l'<em>applique</em> à des participants réels, on parle de <strong>CollaborationUse</strong>, et on relie l'ellipse aux classes participantes par des traits portant le nom du rôle :</p>
<pre class="pseudo">                  .- - - - - - - - - - - - -.
                 (      LocationDeJeu        )     # ELLIPSE EN POINTILLE
                  '- - - - - - - - - - - - -'
                     /          |         \\
              emprunteur    ressource    guichetier
                   /            |             \\
            +--------+    +------------+   +----------+
            | Membre |    | Exemplaire |   | Employe  |
            +--------+    +------------+   +----------+

# Lecture : dans la collaboration "LocationDeJeu", un Membre joue le
# role d'EMPRUNTEUR, un Exemplaire celui de RESSOURCE, un Employe
# celui de GUICHETIER. Les traits portent les NOMS DE ROLES.</pre>
<p>L'intérêt réel de cette notation est la <strong>réutilisation d'un motif</strong> : la même collaboration « prêt d'une ressource » peut se rejouer avec un <code>Membre</code> et un <code>Exemplaire</code>, ou avec un <code>Employe</code> et une salle de jeu. On décrit le motif une fois, on l'applique plusieurs fois.</p>

<h3>7. L'écart le plus important de tout ce cours</h3>
<div class="warn"><strong>Attention : ici, ton support d'école réduit gravement le diagramme.</strong><br><br>
Le chapitre du PAC consacré au DSC ne présente <strong>que</strong> la collaboration de rôles : une ellipse en pointillé reliée à des participants. Il n'y a ni <strong>partie</strong>, ni <strong>port</strong>, ni <strong>connecteur</strong>.<br><br>
Or ce qu'il décrit là est la notation d'une <strong>CollaborationUse</strong>, qui n'est qu'<strong>un</strong> usage possible du diagramme de structure composite — et pas le principal. En UML 2.5.1, le DSC sert d'abord et avant tout à décrire la <strong>structure interne d'un classifieur</strong> : ses <strong>parties</strong>, ses <strong>ports</strong> et ses <strong>connecteurs</strong>. C'est cette lecture-là qui est utilisée dans l'industrie, et c'est elle qu'on retrouve dans SysML pour l'ingénierie système.<br><br>
Détail savoureux et instructif : le <strong>document d'introduction du PAC définit pourtant correctement le DSC</strong>, en écrivant qu'« il décrit la structure interne d'un classifieur ». Le support se contredit donc lui-même : sa définition est juste, son chapitre ne l'illustre pas.<br><br>
<strong>Ce que tu dois faire.</strong> Apprends d'abord la structure interne (parties / ports / connecteurs) : c'est la norme, et c'est ce qui te servira. Sache ensuite présenter la collaboration de rôles, puisque c'est la variante que ton cours privilégie et qu'elle tombera probablement à l'examen. Et si tu peux glisser une phrase disant que la collaboration n'est qu'un usage particulier du DSC, tu montreras que tu as compris les deux.</div>

<h3>8. Récapitulatif des symboles</h3>
<pre class="pseudo">Classifieur ouvert   -&gt; grand rectangle portant son nom
Partie (part)        -&gt; rectangle IMBRIQUE, note   nom : Type [multiplicite]
Port                 -&gt; petit CARRE sur la BORDURE du classifieur
Interface fournie    -&gt; boule (cercle plein) accrochee a un port
Interface requise    -&gt; prise (demi-cercle) accrochee a un port
Connecteur assemblage-&gt; trait entre DEUX PARTIES internes
Connecteur delegation-&gt; trait d'un PORT vers une PARTIE interne
Collaboration        -&gt; ELLIPSE EN POINTILLE contenant le nom
Role                 -&gt; trait de l'ellipse vers un participant, nom du role</pre>
<div class="tip">Tu remarques que rien n'est nouveau depuis le jour 22 : parties, ports, boules, prises, assemblage, délégation. C'est normal — UML réutilise volontairement les mêmes symboles pour ouvrir un composant et pour ouvrir une classe. Un symbole appris deux fois est un symbole retenu.</div>
<p>Demain, dernier diagramme du cours, et il ne figure nulle part dans ton support : les <strong>profils et stéréotypes</strong>, qui permettent d'étendre UML à ton propre domaine sans sortir de la norme.</p>`,

    solution: "@startuml\n' ================================================================\n' Diagramme de structure composite (DSC) - Ludotheque\n' Classifieur ouvert : GestionLocation\n' UML 2.5.1 : le DSC decrit la STRUCTURE INTERNE d'un classifieur,\n' c'est-a-dire ses PARTIES, ses PORTS et ses CONNECTEURS.\n' ================================================================\n\ncomponent \"GestionLocation\" as GL {\n\n  ' --- LES PORTS (petits carres sur la bordure) ---\n  portin \"pComptoir\" as PC\n  ' Point d'entree : par ici arrivent les demandes de l'IHM\n  ' (louer un jeu, rendre un jeu, honorer une reservation).\n  portout \"pPaiement\" as PP\n  ' Point de sortie : par ici partent les encaissements de\n  ' prix_location et les blocages/restitutions de caution.\n\n  ' --- LES PARTIES (rectangles imbriques : nom : Type [mult.]) ---\n  [contrat : ContratLocation] as CONTRAT\n  ' Le chef d'orchestre. Une seule instance -> multiplicite 1\n  ' implicite, on ne l'ecrit pas.\n  [calcul : CalculPrix] as CALC\n  ' Applique prix_location, la duree, les eventuelles penalites.\n  [stock : VerificationStock] as STOCK\n  ' Controle stock_location avant d'autoriser la sortie d'un\n  ' Exemplaire. Ne touche jamais a stock_vente.\n  [caution : GestionCaution] as CAUT\n  ' Bloque la caution a la sortie, la restitue au retour.\n  [resa : Reservation [0..*]] as RESA\n  ' MULTIPLICITE [0..*] : un contrat peut n'honorer aucune\n  ' reservation. Ecrire 1 par defaut serait une erreur de modele.\n\n  ' --- LES CONNECTEURS DE DELEGATION (port -> partie) ---\n  PC - CONTRAT\n  ' DELEGATION : tout ce qui arrive par pComptoir est traite,\n  ' en interne, par le contrat. Le port ne traite RIEN lui-meme :\n  ' il redirige.\n  CAUT - PP\n  ' DELEGATION : ce que la gestion de caution doit envoyer vers\n  ' l'exterieur ressort par le port pPaiement.\n\n  ' --- LES CONNECTEURS D'ASSEMBLAGE (partie <-> partie) ---\n  CONTRAT -- CALC\n  ' ASSEMBLAGE : le contrat demande le montant a payer.\n  CONTRAT -- STOCK\n  ' ASSEMBLAGE : le contrat demande si un exemplaire est disponible.\n  CONTRAT -- CAUT\n  ' ASSEMBLAGE : le contrat declenche le blocage de la caution.\n  STOCK -- RESA\n  ' ASSEMBLAGE : quand un exemplaire redevient disponible, la\n  ' verification de stock consulte les reservations en attente.\n}\n@enduml\n\n' ================================================================\n' COMMENT DISTINGUER LES DEUX CONNECTEURS\n' ================================================================\n' Regarde les DEUX BOUTS du trait :\n'   port (sur la bordure) + partie (a l'interieur) -> DELEGATION\n'   partie + partie (memes niveau)                 -> ASSEMBLAGE\n' La delegation REDIRIGE, l'assemblage FAIT COLLABORER.\n'\n' ================================================================\n' VARIANTE \"COLLABORATION DE ROLES\" (celle du support du PAC)\n' ================================================================\n' Le chapitre DSC du PAC ne montre que cette forme : une ELLIPSE EN\n' POINTILLE reliee a ses participants, chaque trait portant un NOM\n' DE ROLE. C'est la notation d'une CollaborationUse.\n'\n'                  .- - - - - - - - - - - .\n'                 (      LocationDeJeu     )   <- ellipse POINTILLEE\n'                  '- - - - - - - - - - - '\n'                    /        |         \\\n'             emprunteur  ressource  guichetier   <- NOMS DE ROLES\n'                  /          |            \\\n'            +--------+ +------------+ +----------+\n'            | Membre | | Exemplaire | | Employe  |\n'            +--------+ +------------+ +----------+\n'\n' A SAVOIR POUR L'EXAMEN :\n' - La collaboration de roles est UN usage du DSC, pas sa definition.\n' - La definition normative (UML 2.5.1) est : \"le DSC decrit la\n'   structure interne d'un classifieur\".\n' - Le document d'introduction du PAC donne d'ailleurs cette\n'   definition correcte, que son propre chapitre n'illustre jamais.\n' - Interet reel de la collaboration : REUTILISER un motif. Le motif\n'   \"pret d'une ressource\" se decrit une fois et se rejoue ailleurs.",
    note: "Le découpage interne peut varier (on peut fusionner CalculPrix et GestionCaution). Ce qui est évalué : la présence de parties typées et imbriquées, une multiplicité correcte sur les réservations, deux ports sur la bordure, et surtout la distinction explicite entre connecteur de délégation et connecteur d'assemblage. Mentionner que la collaboration de rôles n'est qu'un usage particulier du DSC est un vrai plus." }
