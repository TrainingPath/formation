var DAY = {

  title: "Cadrer le besoin : cahier des charges et user stories",
  subtitle: "Ce qu'on écrit avant de dessiner, pour savoir quoi dessiner.",
  theory: `
<h3>1. Le problème du jour</h3>
<p>Depuis six jours, tu dessines. Cas d'utilisation, activités, couloirs, flots d'objet. Mais d'où venaient les informations que tu as dessinées ? De phrases entre guillemets attribuées à « la gérante ». Aujourd'hui, on remonte d'un cran : <strong>comment obtient-on ces phrases, et sous quelle forme les écrit-on ?</strong></p>
<p>Deux réponses, issues de deux cultures : le <strong>cahier des charges</strong> (culture projet, plutôt contractuelle) et les <strong>user stories</strong> (culture agile, plutôt itérative). Elles ne s'excluent pas — beaucoup d'équipes rédigent un cahier des charges pour cadrer, puis des user stories pour livrer.</p>

<h3>2. Le cahier des charges : un outil stratégique</h3>
<p>Le <strong>cahier des charges</strong> est le document qui <strong>formalise le besoin</strong>. Ton cours insiste : ce n'est pas une formalité administrative, c'est un <strong>outil stratégique</strong>. Il remplit quatre fonctions :</p>
<pre class="pseudo">1. FORMALISER le besoin
   -> transformer des envies orales en exigences ecrites, verifiables
2. Servir de REFERENCE COMMUNE
   -> tout le monde parle du meme perimetre : MOA, MOE, direction
3. Servir de BASE CONTRACTUELLE
   -> en cas de desaccord, c'est le document qui fait foi
4. Faciliter l'ESTIMATION DES COUTS et le SUIVI du projet
   -> on ne chiffre bien que ce qui est ecrit precisement</pre>
<div class="tip">La fonction 3 explique pourquoi on soigne la rédaction. Une phrase floue dans un cahier des charges — « le système doit être ergonomique » — est une phrase qu'on ne pourra ni chiffrer, ni vérifier, ni opposer à personne. Le cahier des charges rend le besoin <strong>opposable</strong>.</div>

<h3>3. Un document évolutif, en trois temps</h3>
<p>Deuxième idée forte du cours : le cahier des charges n'est <strong>pas figé</strong>. Il <strong>évolue</strong> avec la maturité du projet, en trois versions successives.</p>
<pre class="pseudo">EBAUCHE
  -> premiere expression du besoin, encore incomplete
  -> sert a lancer la reflexion en interne, a verifier l'interet

VERSION VALIDEE (avec volet FINANCEMENT)
  -> le besoin est stabilise et la direction s'engage
  -> on y ajoute le budget, les delais, les ressources
  -> c'est la version qui autorise le projet a demarrer

VERSION DETAILLEE (pour les PRESTATAIRES)
  -> le document que l'on transmet aux fournisseurs / a la MOE
  -> exigences fonctionnelles precises, contraintes techniques,
     criteres de reception</pre>
<p>Troisième idée : le cahier des charges est <strong>adapté à son destinataire</strong>. On ne présente pas le même niveau de détail à un conseil d'administration qu'à un développeur. Un même besoin, trois écritures.</p>
<div class="warn">Erreur fréquente en école : croire qu'un cahier des charges doit être « complet dès le début ». Non. Vouloir tout figer avant de rien savoir produit un document long, faux, et jamais relu. Mieux vaut une ébauche honnête, révisée trois fois, qu'un pavé rédigé une fois.</div>

<h3>4. Les user stories : l'autre entrée</h3>
<p>La <strong>user story</strong> vient du monde agile. C'est une <strong>expression courte du besoin, formulée du point de vue de l'utilisateur</strong>. Son gabarit est fixe :</p>
<pre class="pseudo">En tant que [ROLE], je souhaite [ACTION] afin de [BENEFICE]</pre>
<p>Trois morceaux, trois questions :</p>
<pre class="pseudo">[ROLE]     -> QUI ?      un acteur, jamais "l'utilisateur" en general
                          (un Membre, un Employe, la gerante)
[ACTION]   -> QUOI ?     ce que la personne veut pouvoir faire
                          (reserver un Jeu indisponible)
[BENEFICE] -> POURQUOI ? la valeur metier obtenue
                          (etre prevenu des qu'un Exemplaire revient)</pre>
<pre class="pseudo"># Une user story de la Ludotheque
En tant que Membre, je souhaite reserver un Jeu dont le
stock_location est vide, afin d'etre averti des qu'un
Exemplaire redevient disponible.</pre>
<div class="tip">Ton cours emploie <strong>« je souhaite »</strong> et <strong>« je veux »</strong> indifféremment — les deux sont acceptés. En revanche il écrit <strong>toujours « afin de »</strong> pour introduire le bénéfice, jamais « pour » ni « parce que ». Reprends cette formulation en examen.</div>
<p>La partie <strong>afin de</strong> est celle qu'on saute le plus souvent, et c'est la plus utile : elle donne la <strong>raison</strong>. Si tu n'arrives pas à écrire le bénéfice, c'est probablement que la fonctionnalité ne sert à rien — ou que tu ne l'as pas comprise.</p>

<h3>5. INVEST : les six critères d'une bonne story</h3>
<p>Comment savoir si une user story est bien écrite ? L'acronyme <strong>INVEST</strong> donne six critères :</p>
<pre class="pseudo">I  Independent  # independante : realisable sans dependre d'une autre
N  Negotiable   # negociable : c'est une base de discussion, pas
                #   un contrat fige ni une specification technique
V  Valuable     # de valeur : elle apporte un benefice a l'utilisateur
E  Estimable    # estimable : l'equipe peut evaluer sa charge
S  Small        # petite : realisable dans une iteration
T  Testable     # testable : on sait dire si elle est faite ou non</pre>
<div class="tip">Les deux critères qui font échouer le plus de stories en pratique sont le <strong>S</strong> et le <strong>T</strong>. Trop grosse, elle ne rentre pas dans une itération. Non testable, personne ne peut dire quand elle est terminée — donc elle ne finit jamais.</div>

<h3>6. L'épique : quand la story est trop grosse</h3>
<p>Une <strong>épique</strong> (<em>epic</em>) est une user story <strong>trop grosse pour être réalisée telle quelle</strong> : elle viole le critère <strong>S</strong> d'INVEST. Ce n'est pas une erreur — c'est une étape normale. On l'écrit, puis on la <strong>découpe</strong> en stories plus petites, chacune livrable.</p>
<pre class="pseudo"># EPIQUE (trop grosse)
En tant que Membre, je souhaite gerer mes locations en ligne
afin de ne plus devoir passer au comptoir.

# DECOUPAGE en stories
En tant que Membre, je souhaite consulter la liste de mes
  Locations en cours afin de connaitre mes dates de retour.
En tant que Membre, je souhaite prolonger une Location afin
  d'eviter une penalite de retard.
En tant que Membre, je souhaite reserver un Jeu indisponible
  afin d'etre averti de son retour.</pre>

<h3>7. Les critères d'acceptation, au format Gherkin</h3>
<p>Une user story seule ne suffit pas : elle dit <em>quoi</em>, pas <em>jusqu'où</em>. On lui attache donc des <strong>critères d'acceptation</strong> : les conditions concrètes qui permettent de dire « c'est fait ». Le format le plus répandu est <strong>Gherkin</strong>, en trois mots-clés :</p>
<pre class="pseudo">Etant donne [CONTEXTE]           # l'etat du systeme AVANT
Quand       [ACTION]             # ce que fait l'utilisateur
Alors       [RESULTAT ATTENDU]   # l'etat OBSERVABLE apres</pre>
<pre class="pseudo"># Criteres d'acceptation de la story "reserver un Jeu"

Etant donne un Membre a jour de cotisation et un Jeu dont
  stock_location vaut 0
Quand le Membre demande une Reservation de ce Jeu
Alors une Reservation est enregistree a son nom, avec sa date

Etant donne un Jeu dont stock_location vaut 2
Quand le Membre demande une Reservation de ce Jeu
Alors le systeme refuse la Reservation et propose une Location

Etant donne une Reservation en attente pour un Membre
Quand un Exemplaire de ce Jeu est retourne
Alors le Membre est averti et la Reservation passe a l'etat
  "disponible"</pre>
<div class="tip">Un bon critère Gherkin est <strong>observable</strong> : quelqu'un qui ne connaît pas le code doit pouvoir le vérifier. « Alors la Location est enregistrée avec sa <code>date_debut</code> » se vérifie. « Alors le système gère correctement le cas » ne se vérifie pas.</div>

<h3>8. Trois erreurs à ne pas commettre</h3>
<pre class="pseudo"># ERREUR 1 : la story NON TESTABLE
Mauvais : "En tant qu'utilisateur, je veux que l'application soit
           rapide et intuitive."
Pourquoi : rapide = combien ? intuitive = selon qui ? Personne ne
           peut dire si c'est fait. Violation du T d'INVEST.
Mieux    : "En tant qu'Employe, je souhaite retrouver un Membre par
           son nom en moins de 3 secondes afin de ne pas faire
           attendre la file au comptoir."

# ERREUR 2 : la story TROP TECHNIQUE
Mauvais : "En tant que developpeur, je veux une table locations
           avec un index sur date_debut."
Pourquoi : ce n'est pas un besoin d'utilisateur, c'est une solution
           d'implementation. La story dit QUOI et POURQUOI, jamais
           COMMENT. Violation du N (negociable) : elle ferme le
           choix technique avant meme la discussion.
Mieux    : "En tant qu'Employe, je souhaite lister les Locations
           du jour afin de preparer les retours attendus."

# ERREUR 3 : l'OUBLI DES CRITERES D'ACCEPTATION
Mauvais : une story seule, sans aucun "Etant donne / Quand / Alors".
Pourquoi : sans criteres, chacun a sa definition du "termine".
           Le developpeur croit avoir fini, le client dit que non,
           et personne n'a tort : rien n'avait ete ecrit.</pre>
<div class="warn">La formule « <strong>rapide et intuitive</strong> » est l'exemple canonique de la mauvaise story, et elle tombe régulièrement en évaluation. Repère le réflexe : dès qu'un adjectif qualitatif apparaît (rapide, simple, moderne, ergonomique, convivial), demande « mesuré comment ? ». Si personne ne sait répondre, la story n'est pas testable.</div>

<h3>9. Le pont vers UML : de la story au diagramme</h3>
<p>Voici le lien qui justifie de placer cette journée au milieu d'un cours UML. Une user story bien écrite <strong>devient un cas d'utilisation</strong>, et ses critères d'acceptation <strong>deviennent les enchaînements du scénario</strong>.</p>
<pre class="pseudo">USER STORY                 -&gt;  DIAGRAMME UML
----------                     -------------
[ROLE]                     -&gt;  l'ACTEUR du cas d'utilisation
[ACTION]                   -&gt;  le CAS D'UTILISATION lui-meme
[BENEFICE]                 -&gt;  la justification du cas (son interet)

CRITERES D'ACCEPTATION     -&gt;  les ENCHAINEMENTS du scenario
  Etant donne [contexte]   -&gt;  les PRECONDITIONS
  Quand       [action]     -&gt;  l'enchainement NOMINAL
  Alors       [resultat]   -&gt;  les POSTCONDITIONS
Les cas "Alors le systeme refuse" -&gt; les enchainements ALTERNATIFS
                                     et les cas d'ERREUR</pre>
<pre class="pseudo"># Le meme besoin, trois ecritures successives

# 1. USER STORY
En tant que Membre, je souhaite louer un Jeu afin d'y jouer
chez moi sans devoir l'acheter.

# 2. CRITERES D'ACCEPTATION (Gherkin)
Etant donne un Membre a jour et un Jeu avec stock_location &gt; 0
Quand le Membre demande la Location
Alors la caution est encaissee, la Location est enregistree
  avec sa date_debut, et stock_location est decremente

Etant donne un Jeu avec stock_location a 0
Quand le Membre demande la Location
Alors le systeme propose une Reservation

# 3. DIAGRAMME D'ACTIVITES (jours 5 et 6)
Acteur         -&gt; couloir MEMBRE
Cas            -&gt; l'activite "Louer un jeu"
Etant donne    -&gt; les actions "Verifier l'adhesion",
                  "Consulter stock_location"
Le premier cas -&gt; la branche [stock_location &gt; 0]
Le second cas  -&gt; la branche [sinon] -&gt; "Proposer une Reservation"</pre>
<div class="tip">Retiens ce chemin : <strong>besoin oral → user story → critères Gherkin → cas d'utilisation → diagramme d'activités</strong>. Chaque étape ajoute de la précision sans jamais contredire la précédente. Si à un moment le diagramme dit autre chose que la story, ce n'est pas le diagramme qui a raison : c'est qu'il faut retourner parler au client.</div>`,

  { id: "uml-j07", title: "Rédiger les user stories du retour et de la vente", level: 2,
    statement: "La gérante du Dé Bleu te dit : « Au comptoir, mes employés perdent du temps. Quand un <strong>Membre</strong> rend un jeu, il faut retrouver sa <strong>Location</strong>, vérifier l'<strong>Exemplaire</strong>, rendre ou retenir la <code>caution</code>. Et quand quelqu'un veut acheter un jeu, il faut regarder le <code>stock_vente</code> et enregistrer la <strong>Vente</strong>. J'aimerais aussi que le logiciel soit rapide et facile à prendre en main. » <strong>Rédige :</strong> (a) <strong>trois user stories</strong> au gabarit « En tant que… je souhaite… afin de… », dont au moins une pour l'<strong>Employé</strong> et une pour le <strong>Membre</strong> ; (b) pour l'une d'elles, <strong>trois critères d'acceptation au format Gherkin</strong>, dont un cas d'erreur ; (c) la <strong>reformulation</strong> de la phrase « rapide et facile à prendre en main », en expliquant en une ligne quel critère d'INVEST elle violait ; (d) le <strong>lien vers UML</strong> : indique pour ta story détaillée quel sera l'acteur, le cas d'utilisation, et quels critères deviennent l'enchaînement nominal et l'alternatif.",
    hints: [
      "Pour (a), commence par identifier le rôle avant l'action. « L'utilisateur » n'est jamais un rôle valable : ici tu as un Membre, un Employé, et éventuellement la gérante. Et n'oublie pas le « afin de » : si tu n'arrives pas à l'écrire, la story est mal comprise.",
      "Pour (b), écris d'abord le cas qui marche (Étant donné / Quand / Alors), puis demande-toi ce qui peut mal se passer : jeu abîmé, retard, stock_vente à zéro. Chaque cas d'erreur devient un critère supplémentaire.",
      "Pour (c), remplace chaque adjectif par un comportement mesurable : « rapide » devient une durée ou un nombre d'étapes ; « facile à prendre en main » devient une action réalisable sans formation. Le critère violé est celui qui te fait dire « personne ne peut vérifier si c'est fait »."
    ],
    checklist: [
      "Les trois user stories respectent EXACTEMENT le gabarit « En tant que [rôle], je souhaite [action] afin de [bénéfice] », avec un rôle précis (Membre, Employé) et jamais « l'utilisateur ».",
      "Aucune story ne décrit une SOLUTION technique (table, bouton, index, écran) : elles disent QUOI et POURQUOI, pas COMMENT.",
      "Les trois critères d'acceptation emploient bien les trois clauses Étant donné / Quand / Alors, portent sur des résultats OBSERVABLES, et l'un d'eux couvre un cas d'erreur ou de refus.",
      "La reformulation de « rapide et facile à prendre en main » est mesurable (durée, nombre de clics, action vérifiable) ET le critère d'INVEST violé est nommé explicitement (Testable)."
    ],
    solution: "# CADRAGE DU COMPTOIR — Ludotheque Le De Bleu\n\n# ==================================================================\n# (a) TROIS USER STORIES\n# Gabarit impose : En tant que [ROLE], je souhaite [ACTION]\n#                  afin de [BENEFICE].\n# ==================================================================\n\nUS1 (Employe)\n  En tant qu'Employe, je souhaite retrouver la Location en cours\n  d'un Membre a partir de son nom, afin de traiter un retour sans\n  faire attendre la file au comptoir.\n\nUS2 (Employe)\n  En tant qu'Employe, je souhaite enregistrer le retour d'un\n  Exemplaire en indiquant son etat, afin de decider automatiquement\n  si la caution est rendue ou retenue.\n\nUS3 (Membre)\n  En tant que Membre, je souhaite acheter un Jeu disponible au\n  stock_vente, afin de repartir avec mon exemplaire et mon ticket\n  sans passer par une commande.\n\n# Verification INVEST rapide :\n#   I : chacune est realisable seule\n#   N : aucune n'impose de solution technique\n#   V : le benefice est ecrit et concerne un vrai utilisateur\n#   E : la charge est evaluable\n#   S : chacune tient dans une iteration\n#   T : chacune se verifie par des criteres observables (voir (b))\n\n# ==================================================================\n# (b) CRITERES D'ACCEPTATION (Gherkin) — pour US2\n# Format : Etant donne [contexte] / Quand [action] / Alors [resultat]\n# ==================================================================\n\n# Critere 1 — cas nominal : tout va bien\nEtant donne une Location en cours et un Exemplaire complet\n  et en bon etat\nQuand l'Employe enregistre le retour de cet Exemplaire\nAlors la caution est rendue au Membre, la Location est cloturee\n  et stock_location est reincremente de 1\n\n# Critere 2 — cas alternatif : le jeu est abime\nEtant donne une Location en cours et un Exemplaire incomplet\n  ou endommage\nQuand l'Employe enregistre le retour en signalant l'etat\nAlors le systeme retient tout ou partie de la caution et\n  enregistre le motif de la retenue sur la Location\n\n# Critere 3 — CAS D'ERREUR : la Location n'existe pas\nEtant donne un Exemplaire presente au comptoir sans Location\n  en cours a ce nom\nQuand l'Employe tente d'enregistrer le retour\nAlors le systeme refuse l'operation et affiche un message\n  indiquant qu'aucune Location correspondante n'a ete trouvee\n\n# Chaque \"Alors\" est OBSERVABLE : une personne qui ne connait pas\n# le code peut verifier le resultat au comptoir.\n\n# ==================================================================\n# (c) REFORMULATION DE LA PHRASE FLOUE\n# ==================================================================\n\nPhrase d'origine :\n  \"j'aimerais que le logiciel soit rapide et facile a prendre\n   en main\"\n\nCritere INVEST viole : T — TESTABLE.\n  \"Rapide\" et \"facile a prendre en main\" sont des adjectifs\n  qualitatifs : personne ne peut dire objectivement si c'est fait,\n  donc la story ne se termine jamais. (C'est exactement l'erreur\n  du \"rapide et intuitive\" vu en cours.)\n\nReecriture en deux stories testables :\n  En tant qu'Employe, je souhaite retrouver un Membre par son nom\n  en moins de 3 secondes, afin de ne pas faire attendre la file\n  au comptoir.\n\n  En tant qu'Employe nouvellement embauche, je souhaite enregistrer\n  une Location complete en 5 etapes au maximum, afin d'etre\n  operationnel des mon premier jour sans formation prealable.\n\n# ==================================================================\n# (d) LE PONT VERS UML — a partir d'US2\n# ==================================================================\n\n[ROLE] Employe            -> l'ACTEUR \"Employe\" du diagramme\n                             de cas d'utilisation\n[ACTION] enregistrer le\n  retour d'un Exemplaire  -> le CAS D'UTILISATION \"Retourner un jeu\"\n[BENEFICE] decider du\n  sort de la caution      -> la justification metier du cas\n\nCritere 1 (bon etat)      -> l'ENCHAINEMENT NOMINAL du scenario\n  \"Etant donne\"           ->   les PRECONDITIONS\n  \"Alors\"                 ->   les POSTCONDITIONS\nCritere 2 (jeu abime)     -> un ENCHAINEMENT ALTERNATIF\n                             = la branche [sinon] du noeud de\n                               decision dans le diagramme d'activites\nCritere 3 (pas de Location)-> un enchainement d'ERREUR\n                             = une branche menant a un noeud de\n                               FIN DE FLOT (le reste continue)\n\n# Chemin complet, du besoin au dessin :\n#   phrase de la gerante\n#     -> ebauche de cahier des charges\n#       -> user story (role / action / benefice)\n#         -> criteres d'acceptation Gherkin\n#           -> cas d'utilisation + scenarios\n#             -> diagramme d'activites (couloirs, decisions, fusions)",
    note: "Les formulations exactes peuvent varier : plusieurs rédactions sont valables. Ce qui est évalué, c'est le gabarit respecté au mot près (« afin de »), des rôles précis plutôt que « l'utilisateur », des critères Gherkin dont le résultat est observable, et le fait d'avoir nommé le critère INVEST violé par la phrase floue. Si l'une de tes stories parle de table, d'écran ou de bouton, tu as décrit une solution : reviens au besoin." }
