<script>
var DAY = {
  num: 3,
  title: "Cas d'utilisation (1) : acteurs, frontière et associations",
  subtitle: "Ce que le système doit faire, et pour qui : le premier diagramme d'une analyse.",
  theory: `
<h3>1. Le premier diagramme qu'on dessine</h3>
<p>Hier, tu as vu l'ordre de présentation recommandé : cas d'utilisation, puis activités, puis séquence, puis classes. Ce n'est pas un hasard. Le <strong>diagramme de cas d'utilisation</strong> est le <strong>premier modèle élaboré lors de l'analyse</strong>, parce qu'il répond à la seule question qui compte au démarrage : <em>à quoi sert ce système, et pour qui ?</em></p>
<p>Un <strong>cas d'utilisation</strong> est une <strong>fonctionnalité attendue du système, vue de l'utilisateur</strong>. Pas vue du développeur, pas vue de la base de données : vue de celui qui s'en sert. Chez nous, ce sera « Louer un jeu », « S'inscrire », « Consulter le catalogue ».</p>
<div class="tip">Le test de validité d'un cas d'utilisation : est-ce que quelqu'un d'extérieur au système en retire un <strong>service concret</strong> ? Si oui, c'est un cas. Si la réponse est « ça sert au système à fonctionner », ce n'est pas un cas d'utilisation, c'est un morceau de conception.</div>

<h3>2. L'acteur : un rôle, pas une personne</h3>
<p>Un <strong>acteur</strong> est un <strong>rôle joué par une entité externe qui interagit avec le système</strong>. Le mot important est <strong>rôle</strong>. On ne modélise jamais des individus.</p>
<pre class="pseudo"># A la ludotheque
Mme Dupont, employee depuis 2019   -> NON, c'est une personne
Employe                            -> OUI, c'est un role

# Une meme personne peut jouer PLUSIEURS roles
Mme Dupont tient le guichet         -> acteur Employe
Mme Dupont loue un jeu pour elle    -> acteur Membre
# Deux roles, deux acteurs, une seule personne physique</pre>
<p>Et l'inverse est vrai aussi : plusieurs personnes différentes peuvent jouer <em>le même</em> rôle. C'est exactement pour cela que l'acteur est un rôle : il reste stable même quand le personnel change.</p>
<div class="warn">Nommer un acteur avec un nom propre (« Mme Dupont », « Julien du magasin ») est la faute la plus fréquente du premier diagramme. Le modèle doit survivre au départ d'un employé.</div>

<h3>3. Acteur principal et acteur secondaire</h3>
<p>Tous les acteurs n'ont pas le même statut par rapport à un cas donné :</p>
<pre class="pseudo">ACTEUR PRINCIPAL   # celui A QUI le cas rend service
                   # c'est lui qui INITIE l'interaction
                   # ex : le Membre pour "Louer un jeu"

ACTEUR SECONDAIRE  # celui que le systeme SOLLICITE pour obtenir
                   # des informations complementaires
                   # ex : le Systeme de paiement pour "Louer un jeu"</pre>
<p>Retiens le sens de l'initiative. L'acteur principal <em>pousse</em> : il vient demander quelque chose. L'acteur secondaire est <em>tiré</em> : c'est le système qui va le chercher parce qu'il a besoin de lui pour terminer.</p>
<p>Une nuance : le statut est <strong>relatif à un cas</strong>, pas absolu. L'<strong>Employé</strong> est acteur principal de « Enregistrer un retour », mais il pourrait être acteur secondaire d'un cas « Valider une réservation en ligne » initié par le Membre.</p>

<h3>4. Les acteurs qu'on oublie toujours</h3>
<p>Trois familles d'acteurs échappent régulièrement au débutant :</p>
<pre class="pseudo">1. Les acteurs NON HUMAINS
   -> un autre systeme informatique (Systeme de paiement bancaire)
   -> du materiel (lecteur de code-barres, imprimante de tickets)

2. Les acteurs d'ADMINISTRATION
   -> Gerant : consulter les statistiques, fixer les prix
   -> Administrateur : gerer les comptes, sauvegarder

3. Les acteurs de MAINTENANCE / exploitation
   -> celui qui purge les donnees, qui restaure une sauvegarde</pre>
<div class="tip">Une bonne question à se poser en fin de séance : « qui d'autre touche à ce système, ne serait-ce qu'une fois par mois ? ». C'est souvent là qu'apparaissent le Gérant et le Système de paiement.</div>

<h3>5. La frontière du système</h3>
<p>La <strong>frontière du système</strong> est le <strong>cadre qui sépare le système du monde extérieur</strong>. On la dessine comme un rectangle portant le nom du système. À l'intérieur : les cas d'utilisation. À l'extérieur : les acteurs.</p>
<p>L'ensemble des cas d'utilisation contenus dans ce cadre constitue ce qu'UML appelle <strong>un sujet</strong> (<em>subject</em>). Le cadre n'est donc pas décoratif : il définit <strong>le périmètre de ce qu'on s'engage à construire</strong>.</p>
<pre class="pseudo">              +--- LUDOTHEQUE (la frontiere) -------+
              |                                      |
   Membre ----|---( Consulter le catalogue )         |
      O       |                                      |
     /|\  ----|---( Louer un jeu )------------------ |---- Systeme
     / \      |                                      |     de paiement
              |   ( Vendre un jeu )                  |
   Employe ---|---( Enregistrer un retour )          |
              |                                      |
              +--------------------------------------+
# Les acteurs sont DEHORS, les cas sont DEDANS.
# Le trait qui traverse le cadre est une ASSOCIATION.</pre>
<div class="warn">Un acteur à l'intérieur du cadre, c'est une contradiction : par définition un acteur est <strong>externe</strong> au système. S'il est dedans, ce n'est pas un acteur, c'est un composant que tu dois construire.</div>

<h3>6. La notation, élément par élément</h3>
<pre class="pseudo">ACTEUR       # un bonhomme filiforme, son nom ecrit dessous
             # forme equivalente : une classe stereotypee
             #   +----------------+
             #   |  &lt;&lt;acteur&gt;&gt;    |     (ou &lt;&lt;actor&gt;&gt;)
             #   |    Membre      |
             #   +----------------+
             # Utile quand l'acteur n'est pas humain.

CAS D'UTILISATION  # une ELLIPSE contenant le nom du cas
                   # nom = un VERBE A L'INFINITIF
                   #   ( Louer un jeu )   ( S'inscrire )

FRONTIERE    # un rectangle nomme, englobant les cas

ASSOCIATION  # un TRAIT SIMPLE entre un acteur et un cas
             # pas de fleche obligatoire : c'est une communication
             # bidirectionnelle par nature</pre>
<p>Le nom du cas est un point d'examen classique : <strong>verbe à l'infinitif</strong>. On écrit « Louer un jeu », pas « Location de jeu » ni « Le membre loue un jeu ». Un cas d'utilisation est une <em>action</em>.</p>

<h3>7. La multiplicité sur l'association</h3>
<p>Une association acteur-cas peut porter une <strong>multiplicité</strong>, facultative, placée <strong>à l'extrémité du cas d'utilisation</strong>. Elle indique combien d'instances du cas un acteur peut avoir en cours simultanément.</p>
<pre class="pseudo">Membre  ------------ *  ( Louer un jeu )
   # un membre peut avoir plusieurs locations en cours

Membre  ------------ 1  ( S'inscrire )
   # on ne s'inscrit qu'une fois

Employe ------------ 0..3  ( Traiter une reservation )
   # trois dossiers ouverts au maximum au guichet

# Formats acceptes : *  |  n  |  m..n</pre>
<div class="tip">En pratique cette multiplicité est peu utilisée : la plupart des diagrammes de cas s'en passent. Elle reste à connaître, car elle apparaît dans les énoncés d'examen et dans la norme.</div>

<h3>8. La généralisation entre acteurs</h3>
<p>Quand deux acteurs partagent des cas d'utilisation, on factorise avec une <strong>généralisation</strong> : une flèche à <strong>pointe triangulaire creuse</strong>, qui part de l'acteur <em>spécialisé</em> vers l'acteur <em>général</em>.</p>
<pre class="pseudo">        Employe
           ^
           |          <- pointe triangulaire creuse
           |             (elle designe le GENERAL)
        Gerant

# Lecture : "un Gerant est un Employe"
# Consequence : le Gerant herite de TOUS les cas de l'Employe,
#   et y ajoute les siens (Consulter les statistiques,
#   Fixer les prix de location).</pre>
<p>Le sens de la flèche est le même que pour l'héritage entre classes : la pointe désigne toujours le plus général. Le spécialisé <em>hérite</em> des associations du général, jamais l'inverse.</p>

<h3>9. Le piège du niveau d'abstraction</h3>
<p>C'est l'erreur la plus coûteuse de la journée. Un diagramme de cas d'utilisation décrit <strong>ce que</strong> le système fait, jamais <strong>comment</strong> il le fait.</p>
<pre class="pseudo"># TROP BAS (du COMMENT : des clics, des ecrans)
  ( Cliquer sur le bouton OK )
  ( Saisir le numero de carte dans le champ )
  ( Ouvrir la fenetre de recherche )
  ( Enregistrer la ligne dans la table LOCATION )

# BON NIVEAU (du QUOI : un service rendu)
  ( Louer un jeu )
  ( S'inscrire )
  ( Consulter le catalogue )

# TROP HAUT (trop vague : ce n'est plus un service identifiable)
  ( Gerer la ludotheque )
  ( Utiliser le systeme )</pre>
<div class="warn">Deux symptômes à surveiller. Si le nom de ton cas contient un mot d'interface (bouton, écran, champ, fenêtre, cliquer, saisir), tu es descendu trop bas. Si tu ne peux pas dire quel acteur en retire un service précis, tu es monté trop haut.</div>

<h3>10. Le diagramme de la Ludothèque</h3>
<p>Récapitulons sur le fil rouge, avec les acteurs Membre, Employé, Gérant et Système de paiement :</p>
<pre class="pseudo">+--- LUDOTHEQUE ------------------------------------+
|                                                    |
|   ( Consulter le catalogue )                       |
|   ( S'inscrire )                                   |
|   ( Reserver un jeu )                              |
|   ( Louer un jeu )         ----- Systeme de paiement
|   ( Vendre un jeu )        ----- Systeme de paiement
|   ( Rendre un exemplaire )                         |
|   ( Consulter les statistiques )                   |
|                                                    |
+----------------------------------------------------+

Membre   -- Consulter le catalogue, S'inscrire,
            Reserver un jeu, Louer un jeu
Employe  -- Louer un jeu, Vendre un jeu, Rendre un exemplaire
Gerant   -- (herite d'Employe) + Consulter les statistiques
Systeme de paiement -- acteur SECONDAIRE de Louer un jeu
                       (caution) et de Vendre un jeu</pre>
<p>Remarque « Louer un jeu » : le Membre et l'Employé y sont tous les deux associés. Ce n'est pas une erreur — le Membre est l'acteur principal (le service lui rend service), l'Employé participe au guichet. Le Système de paiement, lui, est sollicité par le système pour bloquer la <code>caution</code> : acteur secondaire.</p>
<div class="tip">Demain : quand deux cas partagent un morceau de comportement (« S'authentifier »), ou quand un comportement ne survient que parfois (« Appliquer une pénalité de retard »), il te faudra <code>&lt;&lt;include&gt;&gt;</code> et <code>&lt;&lt;extend&gt;&gt;</code>. Et surtout : le diagramme ne raconte pas le scénario — c'est la description textuelle qui s'en charge.</div>`,
  exercises: [

    { type: "qcm", q: "Un acteur, en UML, désigne…", opts: ["Une personne physique identifiée par son nom", "Un module interne du logiciel", "Un utilisateur possédant un compte", "Un rôle joué par une entité externe qui interagit avec le système"], a: 3, exp: "L'acteur est un rôle : il reste stable même si les personnes changent." },
    { type: "qcm", q: "Comment nommer correctement l'acteur qui tient le guichet de la Ludothèque ?", opts: ["Mme Dupont", "Employé", "Le personnel de la ludothèque depuis 2019", "Guichet numéro 2"], a: 1, exp: "On nomme le rôle, pas la personne ni le poste physique." },

    { type: "qcm", q: "Dans « Louer un jeu », le Système de paiement qui bloque la caution est…", opts: ["L'acteur principal", "Un cas d'utilisation", "Un élément interne à la frontière", "Un acteur secondaire, sollicité par le système"], a: 3, exp: "Le système va le chercher pour obtenir une information complémentaire : c'est un acteur secondaire." },

    { type: "input", q: "Comment UML appelle-t-il l'ensemble des cas d'utilisation contenus dans la frontière ? (un mot)", a: ["sujet", "un sujet", "le sujet", "subject"], ph: "un mot", exp: "L'ensemble des cas dans le cadre constitue « un sujet »." },
    { type: "qcm", q: "Quelle forme graphique représente un cas d'utilisation ?", opts: ["Un rectangle", "Un losange", "Une ellipse", "Un bonhomme filiforme"], a: 2, exp: "Le cas est une ellipse ; le rectangle est la frontière et le bonhomme est l'acteur." },
    { type: "qcm", q: "Quel nom de cas d'utilisation est correctement formulé ?", opts: ["Location de jeu", "Le membre loue un jeu", "Louer un jeu", "Formulaire de location"], a: 2, exp: "Un cas se nomme par un verbe à l'infinitif : « Louer un jeu »." },
    { type: "qcm", q: "Comment représente-t-on l'association entre un acteur et un cas d'utilisation ?", opts: ["Par une flèche pointillée", "Par un losange plein", "Par un trait simple", "Par une flèche à pointe triangulaire"], a: 2, exp: "Un trait simple : la communication est bidirectionnelle par nature." },
    { type: "qcm", q: "Une multiplicité sur une association acteur-cas se place…", opts: ["À l'extrémité de l'acteur", "Au milieu du trait, obligatoirement", "Dans le cadre de la frontière", "À l'extrémité du cas d'utilisation, de façon facultative"], a: 3, exp: "Elle est optionnelle et se note côté cas : *, n ou m..n." },
    { type: "vf", q: "La flèche de généralisation entre acteurs a sa pointe triangulaire du côté de l'acteur le plus général.", a: true, exp: "Comme pour l'héritage entre classes : la pointe désigne le général, le spécialisé hérite de ses cas." },
    { type: "qcm", q: "Pourquoi « Cliquer sur le bouton OK » est-il un mauvais cas d'utilisation ?", opts: ["Parce qu'il n'a pas d'acteur", "Parce qu'il n'est pas à l'infinitif", "Parce qu'il est trop général", "Parce qu'il décrit le COMMENT (l'interface) au lieu du QUOI (le service rendu)"], a: 3, exp: "Le diagramme de cas reste au niveau du service ; les clics et les écrans relèvent de la conception d'interface." }
  ],

    questions: [

    solution: "@startuml\n' Diagramme de cas d'utilisation — Ludotheque, jour 3\n\nleft to right direction\n' left to right direction : place les acteurs a gauche et les cas\n' a droite ; c'est la disposition habituelle d'un diagramme de cas.\n\n' --- LES ACTEURS (toujours HORS de la frontiere) ---\nactor Membre\nactor Employe\nactor Gerant\nactor \"Systeme de paiement\" as Paiement\n' Paiement est un acteur NON HUMAIN : un autre systeme, donc externe.\n' On le nomme par son role, jamais par sa marque ou son fournisseur.\n\n' --- LA FRONTIERE DU SYSTEME ---\nrectangle Ludotheque {\n  ' Tout ce qui est entre ces accolades est DANS le perimetre a\n  ' construire. L'ensemble de ces cas constitue \"un sujet\".\n\n  usecase \"Consulter le catalogue\" as UC1\n  usecase \"S'inscrire\" as UC2\n  usecase \"Reserver un jeu\" as UC3\n  usecase \"Louer un jeu\" as UC4\n  usecase \"Vendre un jeu\" as UC5\n  usecase \"Rendre un exemplaire\" as UC6\n  usecase \"Consulter les statistiques\" as UC7\n  ' Chaque nom commence par un VERBE A L'INFINITIF.\n  ' Aucun ne parle de bouton, d'ecran ni de table : on decrit\n  ' CE QUE fait le systeme, pas COMMENT il le fait.\n}\n\n' --- LES ASSOCIATIONS (trait simple, pas de fleche) ---\nMembre -- UC1\nMembre -- \"1\" UC2\n' Multiplicite 1 cote CAS : on ne s'inscrit qu'une seule fois.\nMembre -- UC3\nMembre -- \"*\" UC4\n' Multiplicite * cote CAS : un membre peut avoir plusieurs\n' locations en cours simultanement.\n\nEmploye -- UC4\nEmploye -- UC5\nEmploye -- UC6\n\nGerant -- UC7\n' Le Gerant n'est relie QU'A son cas propre : le reste est herite.\n\n' --- L'ACTEUR SECONDAIRE ---\nUC4 -- Paiement\nUC5 -- Paiement\n' Le systeme SOLLICITE le Systeme de paiement pour bloquer la\n' caution (UC4) et encaisser (UC5). Il ne declenche rien lui-meme.\n\n' --- LA GENERALISATION ENTRE ACTEURS ---\nGerant --|> Employe\n' Pointe triangulaire creuse vers Employe, le plus GENERAL.\n' Lecture : \"un Gerant est un Employe\". Il herite donc de UC4,\n' UC5 et UC6 sans qu'on redessine ces trois traits.\n\n@enduml\n\n' === ACTEURS DU CAS \"Louer un jeu\" ===\n' Acteur PRINCIPAL   : le Membre. C'est a lui que le cas rend\n'   service et c'est lui qui initie l'interaction.\n' Acteur SECONDAIRE  : le Systeme de paiement. Il est sollicite\n'   par le systeme pour une information complementaire (accord\n'   de blocage de la caution). L'Employe, lui, participe au\n'   guichet mais le service final vise le Membre.\n\n' === CE QU'ON A ECARTE ===\n' ( Cliquer sur Valider )          -> mot d'interface : trop bas\n' ( Mettre a jour stock_location ) -> traitement interne : trop bas\n' ( Gerer la ludotheque )          -> aucun service identifiable :\n'                                     trop haut",
