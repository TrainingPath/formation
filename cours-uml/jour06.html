<h3>1. Ce qui manquait au diagramme d'hier</h3>
<p>Hier, tu as dessiné le flot de contrôle d'une location : une action, puis la suivante, avec des choix en chemin. Ce diagramme était juste, mais il laissait trois questions sans réponse :</p>
<pre class="pseudo">1. Que se passe-t-il EN MEME TEMPS ?
   (pendant qu'on encaisse la caution, on pourrait deja imprimer
    le contrat de location)

<p>Trois questions, trois notations : la <strong>bifurcation / jonction</strong>, la <strong>partition</strong> (couloir), et le <strong>flot d'objet</strong>. C'est tout le programme du jour.</p>

<h3>2. Le nœud de bifurcation : créer des flots concurrents</h3>
<p>Le <strong>nœud de bifurcation</strong> (aussi appelé <strong>fourche</strong>, ou <em>fork</em> en anglais) permet, <strong>à partir d'un flot unique, de créer plusieurs flots concurrents</strong>. Autrement dit : à partir d'ici, tout se déroule <strong>en parallèle</strong>.</p>
<p>Il se dessine par une <strong>barre épaisse</strong> (horizontale ou verticale), avec <strong>un seul arc entrant</strong> et <strong>plusieurs arcs sortants</strong>.</p>
<pre class="pseudo"># Bifurcation : 1 entrant, n sortants, TOUS empruntes
   ( Valider la Location )
            |
   =========================   &lt;-- barre epaisse : BIFURCATION
       |              |
       v              v
  ( Imprimer     ( Envoyer un
    le contrat )   mail de
                   confirmation )
# Les DEUX actions se font ; aucune condition, aucun choix.</pre>

<h3>3. Le nœud de jonction : synchroniser les flots</h3>
<p>Le <strong>nœud de jonction</strong> (ou <strong>synchronisation</strong>, <em>join</em> en anglais) est <strong>symétrique</strong> de la bifurcation. Il <strong>attend que TOUS les flots entrants soient arrivés</strong>, puis produit <strong>un flot unique</strong> en sortie.</p>
<pre class="pseudo"># Jonction : n entrants, 1 sortant, on ATTEND TOUT LE MONDE
  ( Imprimer     ( Envoyer un
    le contrat )   mail )
       |              |
       v              v
   =========================   &lt;-- barre epaisse : JONCTION
            |
            v
   ( Remettre le jeu au Membre )
# Le membre ne repart pas avant que le contrat ET le mail soient faits.</pre>
<div class="tip">Bifurcation et jonction se dessinent avec <strong>le même symbole</strong> : la barre épaisse. Comme pour les losanges d'hier, tu les distingues en <strong>comptant les flèches</strong> : une entrée et plusieurs sorties = bifurcation ; plusieurs entrées et une sortie = jonction. Et comme pour les losanges, elles vont presque toujours par paire.</div>

<h3>4. Le piège classique : décision ou bifurcation ?</h3>
<p>Voici l'erreur qui coûte le plus de points en examen, et le plus de bugs en projet. Les deux notations ouvrent visuellement « plusieurs chemins ». Elles ne veulent pas du tout dire la même chose.</p>
<pre class="pseudo">DECISION (losange)          BIFURCATION (barre epaisse)
------------------          ---------------------------
choix EXCLUSIF              PARALLELISME
UN SEUL chemin est suivi    TOUS les chemins sont suivis
arcs gardes : [condition]   arcs SANS condition
se referme par une FUSION   se referme par une JONCTION
  (des qu'UN arrive)          (quand TOUS sont arrives)
"ou bien... ou bien"        "et... et..."</pre>
<div class="warn"><strong>Le test infaillible.</strong> Pose-toi la question : « à l'exécution, combien de ces branches seront réellement parcourues ? » Si la réponse est « une seule, ça dépend », c'est une <strong>décision</strong>. Si la réponse est « toutes, systématiquement », c'est une <strong>bifurcation</strong>. Et corollaire : si tu vois une <strong>condition entre crochets</strong> sur une sortie de barre épaisse, c'est une faute de notation.</div>

<h3>5. Les partitions : les couloirs d'activités</h3>
<p>Une <strong>partition d'activités</strong> est une bande — verticale ou horizontale — qui regroupe les actions relevant d'un même <strong>domaine de responsabilité</strong>. Chaque action est dessinée <em>dans</em> le couloir de celui qui l'exécute.</p>
<p>Le vocabulaire varie selon les sources : la norme dit <strong>partition</strong>, l'anglais courant dit <strong>swimlane</strong> (littéralement « couloir de piscine »), et ton cours d'école dit <strong>« couloir d'activités »</strong> ou <strong>« couloir de responsabilité »</strong>. Ce sont trois noms pour la même chose.</p>
<pre class="pseudo"># Trois couloirs pour la location d'un jeu
  |    MEMBRE       |     EMPLOYE          |     SYSTEME        |
  |-----------------|----------------------|--------------------|
  | (Demander un    |                      |                    |
  |  Jeu en         |                      |                    |
  |  location)      |                      |                    |
  |        \\--------&gt;(Verifier l'adhesion) |                    |
  |                 |          \\-----------&gt;(Consulter          |
  |                 |                      |  stock_location)   |
  |                 | (Encaisser la        |                    |
  |                 |&lt;--------------------/|                    |
  |                 |  caution)            |                    |
  |                 |          \\-----------&gt;(Enregistrer la     |
  |                 |                      |  Location)         |
  |                 |                      |(Decrementer        |
  |                 |                      | stock_location)    |
  | (Recevoir le    |                      |                    |
  |&lt;----------------| (Remettre le jeu)    |                    |
  |  jeu)           |                      |                    |</pre>
<p>Le diagramme devient d'un coup beaucoup plus parlant pour la gérante : elle voit <strong>ce qu'elle doit faire faire à ses employés</strong> et <strong>ce que le logiciel doit prendre en charge</strong>.</p>
<div class="tip">Une flèche qui <strong>traverse un couloir</strong> signale un <strong>passage de responsabilité</strong>. Ces traversées sont les points sensibles d'un processus : c'est là qu'on perd du temps, qu'on oublie une information, ou qu'on découvre qu'il manque une interface entre l'humain et le logiciel. Quand tu relis un diagramme à couloirs, compte les traversées.</div>

<h3>6. L'ordre des couloirs ne veut rien dire</h3>
<div class="warn">Point de notation à retenir : <strong>l'ordre relatif des couloirs n'est pas significatif</strong>. Mettre « Membre » à gauche et « Système » à droite est un choix de lisibilité, pas une information du modèle. Un couloir n'est pas plus « avant » ou plus « important » qu'un autre parce qu'il est placé en premier. La seule chose qui porte du sens, c'est <strong>dans quel couloir se trouve chaque action</strong> — et l'ordre des actions est donné par les <strong>flèches</strong>, jamais par la position des bandes.</div>
<p>Autre conséquence pratique : tu peux réorganiser les couloirs pour réduire le nombre de croisements de flèches sans changer d'un iota la signification du diagramme. C'est même conseillé.</p>

<h3>7. Le flot d'objet et les nœuds d'objet</h3>
<p>Jusqu'ici, nos flèches transportaient du <strong>contrôle</strong> : « quand ceci est fini, fais cela ». UML 2 distingue un second type d'arc, le <strong>flot d'objet</strong>, qui transporte des <strong>données</strong> d'une action à l'autre.</p>
<p>La donnée elle-même se représente par un <strong>nœud d'objet</strong> : un <strong>rectangle à coins droits</strong> (contrairement à l'action, arrondie) contenant le nom de l'objet, éventuellement suivi de son <strong>état entre crochets</strong>.</p>
<pre class="pseudo"># Un noeud d'objet entre deux actions
  ( Enregistrer la Location )
            |
            v
    +----------------------+
    | Location [en cours]  |   &lt;-- noeud d'objet, coins DROITS
    +----------------------+       nom + etat entre crochets
            |
            v
  ( Imprimer le contrat )
# La fleche n'exprime plus seulement "ensuite" : elle dit AUSSI
# "l'objet Location produit ici est consomme la".</pre>
<div class="tip">Repère visuel imparable : <strong>coins arrondis = action</strong> (on <em>fait</em> quelque chose), <strong>coins droits = objet</strong> (on <em>manipule</em> quelque chose). Si tu hésites en lisant un diagramme, regarde les coins.</div>

<h3>8. Les pins : les paramètres d'une action</h3>
<p>Le <strong>pin</strong> (ou <em>broche</em>) est la notation compacte du flot d'objet. Un <strong>pin d'entrée</strong> représente un <strong>paramètre consommé</strong> par l'action ; un <strong>pin de sortie</strong> représente un <strong>résultat produit</strong>. Il se dessine par un <strong>petit rectangle accolé au bord de l'action</strong>, portant un <strong>nom et un type</strong>.</p>
<pre class="pseudo"># Notation avec pins : plus compacte que le noeud d'objet
        [membre:Membre]                [loc:Location]
              |                              |
   .----------+-----------------------------+---.
  (        Enregistrer la Location              )
   '------------------------------------------'
              |
        [expl:Exemplaire]        # autre pin d'entree

# Lecture : l'action consomme un Membre et un Exemplaire,
#           et produit une Location.</pre>
<p>Les deux notations sont équivalentes : un pin de sortie relié à un pin d'entrée, c'est exactement un nœud d'objet dessiné entre deux actions. On choisit les pins quand le diagramme est déjà chargé, les nœuds d'objet quand on veut montrer l'<strong>état</strong> de la donnée.</p>

<p>Trois lectures possibles du même dessin, selon à qui tu le montres : la gérante lit les <strong>couloirs</strong> (qui fait quoi), le chef de projet lit le <strong>parallélisme</strong> (ce qui se gagne en temps), le développeur lit le <strong>flot d'objet</strong> (quels objets sont créés, avec quel état).</p>
<div class="warn">Vérifie toujours la cohérence de tes barres : une bifurcation qui n'est jamais refermée par une jonction laisse des flots orphelins. Symétriquement, une jonction qui attend un flot jamais créé provoque un <strong>blocage définitif</strong> (<em>deadlock</em>) : le processus s'arrête et n'atteint jamais son nœud final.</div>

  { id: "uml-j06", title: "Modéliser la vente d'un jeu avec couloirs et parallélisme", level: 3,
    statement: "La gérante te décrit la <strong>vente</strong> d'un jeu au comptoir : « Le <strong>Membre</strong> choisit un <strong>Jeu</strong>. L'<strong>Employé</strong> vérifie <code>stock_vente</code> auprès du logiciel. Si le stock est vide, le système enregistre un <strong>Achat</strong> auprès du fournisseur et prévient le membre. Sinon, deux opérations se déroulent <em>en parallèle</em> : l'employé encaisse le paiement pendant que le système enregistre la <strong>Vente</strong> et décrémente <code>stock_vente</code>. Le ticket n'est imprimé que lorsque les deux sont terminées. » <strong>Rédige le diagramme d'activités en syntaxe PlantUML</strong>, commenté, avec <strong>trois couloirs</strong> (Membre / Employé / Système), au moins <strong>une décision</strong> et <strong>une bifurcation refermée par une jonction</strong>. Ajoute en commentaire le <strong>nœud d'objet</strong> produit par l'enregistrement de la Vente.",
    hints: [
      "Commence par lister chaque action et par décider dans quel couloir elle va : qui l'exécute réellement ? Un logiciel qui « enregistre » est dans le couloir Système, même si c'est l'employé qui clique.",
      "Pose-toi la question du test infaillible pour chaque endroit où le dessin se sépare : « combien de branches seront parcourues à l'exécution ? » Une seule, ça dépend → décision (losange, gardes entre crochets). Toutes → bifurcation (barre épaisse, aucune garde).",
      "En PlantUML : les couloirs s'écrivent |Membre| , |Employe| , |Systeme| ; le parallélisme s'écrit fork / fork again / end fork ; le choix s'écrit if (...) then (oui) / else (non) / endif."
    ],
    checklist: [
      "Le diagramme comporte exactement trois couloirs nommés (Membre, Employé, Système) et CHAQUE action est placée dans le couloir de celui qui l'exécute réellement.",
      "Le test sur stock_vente est modélisé par une DÉCISION avec des conditions entre crochets (dont un cas [sinon]), et non par une bifurcation.",
      "Le paiement et l'enregistrement de la Vente sont ouverts par une BIFURCATION sans aucune condition de garde, et refermés par une JONCTION avant l'impression du ticket.",
      "Le nœud d'objet Vente est signalé (rectangle à coins droits, nom + état entre crochets), et sa présence est distinguée du flot de contrôle."
    ],
    solution: "# DIAGRAMME D'ACTIVITES — Vendre un jeu (Ludotheque Le De Bleu)\n# Syntaxe PlantUML, avec couloirs (partitions), decision et parallelisme.\n\n@startuml\n\n' --- Les couloirs se declarent avec des barres verticales.\n' --- Chaque couloir = un DOMAINE DE RESPONSABILITE.\n' --- RAPPEL : l'ordre relatif des couloirs n'est PAS significatif ;\n' --- on les range seulement pour limiter les croisements de fleches.\n\n|Membre|\nstart\n:Choisir un Jeu;\n\n|Employe|\n:Demander le controle de stock_vente;\n\n|Systeme|\n:Consulter stock_vente;\n\n' --- DECISION (losange) : choix EXCLUSIF.\n' --- UN SEUL chemin sera parcouru a l'execution.\n' --- Les libelles (oui)/(sinon) sont les gardes, notees\n' --- [stock_vente > 0] et [sinon] sur le dessin normalise.\nif (stock_vente > 0 ?) then (oui)\n\n  ' --- BIFURCATION (barre epaisse) : parallelisme.\n  ' --- TOUS les chemins sont parcourus, AUCUNE garde n'est permise ici.\n  fork\n    |Employe|\n    :Encaisser le paiement;\n  fork again\n    |Systeme|\n    :Enregistrer la Vente;\n    ' --- NOEUD D'OBJET produit ici :\n    '       +------------------+\n    '       | Vente [validee]  |   <- rectangle a coins DROITS\n    '       +------------------+      (l'action, elle, est arrondie)\n    '     Il est relie aux actions par un FLOT D'OBJET, qui vehicule\n    '     une DONNEE, et non un simple flot de controle.\n    :Decrementer stock_vente;\n  end fork\n  ' --- JONCTION (barre epaisse) : end fork attend que TOUS les\n  ' --- flots entrants soient arrives avant de continuer.\n  ' --- A ne pas confondre avec la FUSION, qui passe des qu'UN arrive.\n\n  |Employe|\n  :Imprimer le ticket;\n\n  |Membre|\n  :Recevoir le jeu et le ticket;\n\nelse (sinon)\n\n  |Systeme|\n  :Enregistrer un Achat aupres du fournisseur;\n\n  |Employe|\n  :Prevenir le Membre du delai;\n\n  |Membre|\n  :Prendre note du delai;\n\nendif\n' --- endif materialise la FUSION des deux branches de la decision.\n\n|Membre|\nstop\n\n@enduml\n\n# ------------------------------------------------------------------\n# LES QUATRE POINTS DE NOTATION EVALUES\n#\n# 1. COULOIRS. Chaque action est dans le couloir de celui qui\n#    l'execute VRAIMENT. \"Enregistrer la Vente\" est un traitement\n#    du logiciel : couloir Systeme, meme si c'est l'employe qui\n#    clique sur le bouton. Une fleche qui traverse un couloir est\n#    un PASSAGE DE RESPONSABILITE : ce sont les points sensibles.\n#\n# 2. DECISION vs BIFURCATION — le piege classique.\n#    stock_vente > 0 ?  -> une seule branche parcourue -> DECISION\n#                          (losange, gardes entre crochets)\n#    paiement + Vente   -> les deux branches parcourues -> BIFURCATION\n#                          (barre epaisse, AUCUNE garde)\n#    Test infaillible : \"a l'execution, combien de branches ?\"\n#\n# 3. FUSION vs JONCTION.\n#    endif   -> FUSION   : n entrants, 1 sortant, passe des qu'UN arrive\n#    end fork-> JONCTION : n entrants, 1 sortant, attend TOUS les flots\n#    Une bifurcation jamais refermee laisse des flots orphelins ;\n#    une jonction qui attend un flot inexistant bloque le processus.\n#\n# 4. FLOT D'OBJET. La Vente produite circule comme une DONNEE.\n#    Repere visuel : coins arrondis = action, coins droits = objet.\n#    En notation compacte, on aurait mis des PINS accoles a l'action :\n#    [membre:Membre] et [jeu:Jeu] en entree, [v:Vente] en sortie.",
    note: "Le découpage exact des actions peut varier, et PlantUML n'est qu'un support : ce sont les quatre points de notation qui comptent. Si tu as utilisé une barre épaisse pour le test sur stock_vente, ou mis une condition entre crochets en sortie de bifurcation, relis le tableau décision / bifurcation : c'est l'erreur la plus fréquente de tout le chapitre." }
  ]
};
