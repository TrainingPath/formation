<h3>1. Le problème du jour</h3>
<p>Tu as dessiné le diagramme de classes de la Ludothèque : <strong>Jeu</strong>, <strong>Catégorie</strong>, <strong>Membre</strong>, <strong>Employé</strong>, <strong>Exemplaire</strong>, <strong>Location</strong>, <strong>Vente</strong>, <strong>Réservation</strong>. Il est propre, les multiplicités sont du bon côté, les losanges sont posés. Et maintenant ?</p>
<p>Maintenant, quelqu'un doit l'écrire en vrai. Et c'est là que se joue le sort du modèle : ou bien la traduction est <strong>mécanique</strong> — chaque symbole a une contrepartie précise dans le langage — ou bien chacun bricole, et le code finit par raconter une histoire différente du dessin. Ce jour-ci te donne les règles de traduction, <strong>en Python et en Java côte à côte</strong>, pour que la même conception produise le même code, quel que soit le langage.</p>
<div class="tip">On ne change pas de projet : c'est toujours la Ludothèque « Le Dé Bleu », avec ses attributs <code>stock_location</code>, <code>stock_vente</code>, <code>prix_location</code>, <code>prix_vente</code>, <code>date_debut</code>, <code>date_fin</code> et <code>caution</code>.</div>

<h3>2. Les trois correspondances de base</h3>
<p>Avant tout raffinement, retiens ces trois lignes. Elles couvrent 80 % de la traduction :</p>
<pre class="pseudo"># La regle fondamentale
Classe UML      ->  une classe du langage        (class ...)
Attribut UML    ->  un champ d'INSTANCE          (self.x / this.x)
Operation UML   ->  une METHODE de la classe     (def ... / public ...)</pre>
<p>Une classe UML n'est pas un fichier, pas une table, pas un écran : c'est un <strong>type d'objet</strong>. Un attribut n'est pas une variable globale : il appartient à <em>chaque</em> objet. Une opération n'est pas une fonction libre : elle s'exécute <em>sur</em> un objet.</p>

<h3>3. Le squelette d'une classe</h3>
<p>Prenons la classe <code>Jeu</code> telle qu'elle apparaît dans le diagramme :</p>
<pre class="pseudo"># LE MODELE
   +-------------------------------+
   |              Jeu              |
   +-------------------------------+
   | - titre : String              |
   | - prixLocation : Float        |
   | - stockLocation : Integer     |
   +-------------------------------+
   | + estDisponible() : Boolean   |
   +-------------------------------+</pre>
<pre class="pseudo"># PYTHON
class Jeu:
    def __init__(self, titre, prix_location, stock_location):
        self._titre = titre                    # attribut d'instance
        self._prix_location = prix_location
        self._stock_location = stock_location

    def est_disponible(self):                  # operation -> methode
        return self._stock_location &gt; 0</pre>
<pre class="pseudo">// JAVA
public class Jeu {
    private String titre;                      // attribut d'instance
    private double prixLocation;
    private int stockLocation;

    public Jeu(String titre, double prixLocation, int stockLocation) {
        this.titre = titre;
        this.prixLocation = prixLocation;
        this.stockLocation = stockLocation;
    }

    public boolean estDisponible() {           // operation -&gt; methode
        return this.stockLocation &gt; 0;
    }
}</pre>
<p>Même modèle, même structure, deux syntaxes. Le constructeur n'apparaît pas toujours dans le diagramme : il est le passage obligé pour donner un état initial à l'objet.</p>

<h3>4. La visibilité : +, - et #</h3>
<p>UML place devant chaque attribut et chaque opération un symbole de <strong>visibilité</strong>. Voici sa traduction :</p>
<pre class="pseudo">UML   SENS        PYTHON                          JAVA
---   ----        ------                          ----
 +    public      nom            (rien du tout)   public  nom
 -    prive       _nom  ou  __nom (CONVENTION)    private nom
 #    protege     _nom            (CONVENTION)    protected nom</pre>
<pre class="pseudo"># PYTHON — les trois visibilites
class Membre:
    def __init__(self, nom):
        self.nom = nom              # +  public
        self._caution = 20.0        # #  protege (convention : un underscore)
        self.__code_secret = "A17"  # -  prive (deux underscores : name mangling)</pre>
<pre class="pseudo">// JAVA — les trois visibilites
public class Membre {
    public    String nom;           // +  public
    protected double caution;       // #  protege
    private   String codeSecret;    // -  prive
}</pre>
<div class="warn"><strong>Écart honnête à connaître : Python n'a pas de vraie visibilité privée.</strong> Le simple underscore <code>_nom</code> est une <em>convention</em> entre développeurs : rien n'empêche techniquement d'écrire <code>membre._caution = 0</code>. Le double underscore <code>__nom</code> déclenche seulement le <em>name mangling</em> (l'attribut est renommé <code>_Membre__nom</code>) : c'est une gêne, pas une protection — on peut toujours y accéder en connaissant le nouveau nom. En Java, au contraire, <code>private</code> est vérifié par le compilateur. Conclusion : en Python, la visibilité UML est <strong>documentée</strong>, pas <strong>imposée</strong>. Dis-le, plutôt que de faire croire que le code respecte le modèle.</div>

<h3>5. L'attribut souligné : le niveau classe</h3>
<p>En UML, un attribut <strong>souligné</strong> n'appartient pas à chaque objet mais à la <strong>classe elle-même</strong> : il est partagé par toutes les instances. Typiquement, un tarif d'adhésion ou un compteur.</p>
<pre class="pseudo"># PYTHON — attribut de classe
class Membre:
    tarif_adhesion = 25.0          # SOULIGNE en UML : niveau classe
    nb_membres = 0                 # partage par toutes les instances

    def __init__(self, nom):
        self.nom = nom             # niveau instance
        Membre.nb_membres += 1     # on incremente sur la CLASSE</pre>
<pre class="pseudo">// JAVA — mot-cle static
public class Membre {
    public static final double TARIF_ADHESION = 25.0;  // souligne en UML
    private static int nbMembres = 0;
    private String nom;                                // niveau instance

    public Membre(String nom) {
        this.nom = nom;
        nbMembres++;
    }
}</pre>
<div class="tip">Le test mental : « si je change cette valeur, est-ce que ça change pour <em>tous</em> les objets ? » Si oui, elle est de niveau classe, donc soulignée en UML, donc <code>static</code> en Java et attribut de classe en Python.</div>

<h3>6. Traduire une association 1 -- 0..*</h3>
<p>C'est la traduction que l'on rate le plus souvent. Reprends la règle du jour 2 : <em>une Catégorie regroupe 0..* Jeu ; un Jeu appartient à 1 Catégorie.</em></p>
<pre class="pseudo"># LE MODELE
   Categorie  1 ------------------- 0..*  Jeu

# LA REGLE DE TRADUCTION
Cote "1"     ->  une REFERENCE  (un seul objet)
Cote "0..*"  ->  une COLLECTION (list en Python, List en Java)</pre>
<pre class="pseudo"># PYTHON
class Categorie:
    def __init__(self, nom):
        self.nom = nom
        self.jeux = []                 # cote 0..* -> une COLLECTION

    def ajouter_jeu(self, jeu):
        self.jeux.append(jeu)
        jeu.categorie = self           # on maintient LES DEUX cotes

class Jeu:
    def __init__(self, titre, categorie=None):
        self.titre = titre
        self.categorie = categorie     # cote 1 -> une REFERENCE</pre>
<pre class="pseudo">// JAVA  (une classe par fichier, regroupees ici pour la lecture)
import java.util.ArrayList;
import java.util.List;

public class Categorie {
    private String nom;
    private List&lt;Jeu&gt; jeux = new ArrayList&lt;&gt;();   // cote 0..*

    public void ajouterJeu(Jeu jeu) {
        this.jeux.add(jeu);
        jeu.setCategorie(this);                     // les DEUX cotes
    }
}

public class Jeu {
    private String titre;
    private Categorie categorie;                    // cote 1 -> REFERENCE

    public void setCategorie(Categorie categorie) {
        this.categorie = categorie;
    }
}</pre>
<div class="warn">Une association UML est <strong>navigable dans les deux sens</strong> par défaut ; le code, lui, ne connaît que les champs qu'on a écrits. Si tu veux les deux sens, tu dois les maintenir <strong>toi-même</strong>, comme dans <code>ajouter_jeu()</code> ci-dessus. Sinon une Catégorie peut contenir un Jeu qui, lui, croit appartenir à une autre catégorie : le modèle dit une chose, le code en fait une autre.</div>

<h3>7. Composition et agrégation : qui crée, qui reçoit ?</h3>
<p>Les deux losanges se traduisent par la même chose en apparence (une référence ou une collection) — mais pas par le même <strong>cycle de vie</strong>. La différence est dans le code, pas dans le type.</p>
<pre class="pseudo"># COMPOSITION (losange PLEIN)     Jeu  &lt;&gt;------ Exemplaire
#   Le composite CREE ses composants et les DETRUIT avec lui.
#   Un Exemplaire n'existe pas sans son Jeu.

# AGREGATION (losange CREUX)      Location  &lt;&gt;------ Membre
#   La partie est RECUE de l'exterieur (passee au constructeur)
#   et elle SURVIT au tout : le Membre reste apres la Location.</pre>
<pre class="pseudo"># PYTHON — COMPOSITION : le Jeu instancie lui-meme ses Exemplaires
class Jeu:
    def __init__(self, titre, nb_exemplaires):
        self.titre = titre
        self.exemplaires = []
        for numero in range(1, nb_exemplaires + 1):
            self.exemplaires.append(Exemplaire(self, numero))   # il CREE

    def retirer_du_catalogue(self):
        self.exemplaires.clear()      # il DETRUIT ses composants avec lui</pre>
<pre class="pseudo"># PYTHON — AGREGATION : la Location RECOIT le Membre, elle ne le cree pas
class Location:
    def __init__(self, membre, exemplaire, date_debut, date_fin):
        self.membre = membre          # RECU de l'exterieur
        self.exemplaire = exemplaire  # RECU de l'exterieur
        self.date_debut = date_debut
        self.date_fin = date_fin
        self.caution = 20.0
    # Quand la Location est cloturee, le Membre existe toujours.</pre>
<pre class="pseudo">// JAVA — COMPOSITION
public class Jeu {
    private final List&lt;Exemplaire&gt; exemplaires = new ArrayList&lt;&gt;();

    public Jeu(String titre, int nbExemplaires) {
        for (int numero = 1; numero &lt;= nbExemplaires; numero++) {
            this.exemplaires.add(new Exemplaire(this, numero));  // il CREE
        }
    }
}

// JAVA — AGREGATION
public class Location {
    private final Membre membre;          // RECU par le constructeur
    private final Exemplaire exemplaire;

    public Location(Membre membre, Exemplaire exemplaire) {
        this.membre = membre;
        this.exemplaire = exemplaire;
    }
}</pre>
<div class="tip">Le repère infaillible : cherche le <code>new</code> (ou l'appel <code>Exemplaire(...)</code>). S'il est <strong>dans</strong> la classe, c'est une composition. Si l'objet arrive <strong>par le constructeur</strong>, c'est une agrégation.</div>

<h3>8. Généralisation, classe abstraite, interface</h3>
<p>La <strong>généralisation</strong> (le triangle creux) se traduit directement par l'<strong>héritage</strong>. Dans la Ludothèque, <code>Membre</code> et <code>Employé</code> sont des <code>Personne</code>.</p>
<pre class="pseudo"># PYTHON — classe abstraite + heritage
from abc import ABC, abstractmethod

class Personne(ABC):                 # classe ABSTRAITE (nom en italique en UML)
    def __init__(self, nom, prenom):
        self.nom = nom
        self.prenom = prenom

    @abstractmethod
    def role(self):                  # operation abstraite : aucun corps
        pass

class Membre(Personne):              # GENERALISATION -> heritage
    def __init__(self, nom, prenom, caution=20.0):
        super().__init__(nom, prenom)
        self.caution = caution

    def role(self):                  # obligatoire : sinon impossible d'instancier
        return "membre"

class Employe(Personne):
    def role(self):
        return "employe"</pre>
<pre class="pseudo">// JAVA — abstract class + extends
public abstract class Personne {
    protected String nom;
    protected String prenom;

    public Personne(String nom, String prenom) {
        this.nom = nom;
        this.prenom = prenom;
    }

    public abstract String role();
}

public class Membre extends Personne {
    private double caution = 20.0;

    public Membre(String nom, String prenom) {
        super(nom, prenom);
    }

    @Override
    public String role() {
        return "membre";
    }
}</pre>
<p>L'<strong>interface</strong> UML (un contrat, sans état ni implémentation) se traduit par un <code>Protocol</code> ou une ABC pure en Python, et par <code>interface</code> + <code>implements</code> en Java :</p>
<pre class="pseudo"># PYTHON — interface via Protocol
from typing import Protocol

class Louable(Protocol):             # INTERFACE : que des signatures
    def prix_location(self):
        ...
    def est_disponible(self):
        ...

class Exemplaire:                    # aucune declaration necessaire :
    def prix_location(self):         # Python verifie la FORME, pas le nom
        return 3.5
    def est_disponible(self):
        return True</pre>
<pre class="pseudo">// JAVA — interface + implements
public interface Louable {
    double prixLocation();
    boolean estDisponible();
}

public class Exemplaire implements Louable {
    @Override
    public double prixLocation() { return 3.5; }
    @Override
    public boolean estDisponible() { return true; }
}</pre>
<div class="warn">Nouvel écart de langage : en Java, <code>implements Louable</code> est une <strong>déclaration explicite</strong>, vérifiée à la compilation. En Python avec <code>Protocol</code>, la conformité est <strong>structurelle</strong> : une classe qui possède les bonnes méthodes convient, sans rien déclarer. Le modèle UML dit « Exemplaire réalise Louable » ; en Python, ce lien n'existe nulle part dans le code — il n'est visible que dans le diagramme.</div>

<h3>9. La classe-association Location</h3>
<p>Le jour 2 l'a établi : l'association porteuse d'attributs (<code>date_debut</code>, <code>date_fin</code>) devient une <strong>classe-association</strong>. En code, la subtilité disparaît : une classe-association est une <strong>classe à part entière</strong>, avec <strong>ses deux références</strong> vers les classes qu'elle relie.</p>
<pre class="pseudo"># LE MODELE
   Membre  0..* ---------------- 0..*  Exemplaire
                       |
                   Location
                (dateDebut, dateFin, caution)</pre>
<pre class="pseudo"># PYTHON — la classe-association devient une classe ORDINAIRE
class Location:
    def __init__(self, membre, exemplaire, date_debut, date_fin, caution=20.0):
        self.membre = membre            # reference 1 : vers Membre
        self.exemplaire = exemplaire    # reference 2 : vers Exemplaire
        self.date_debut = date_debut
        self.date_fin = date_fin
        self.caution = caution

    def prolonger(self, jours):
        self.date_fin = self.date_fin + timedelta(days=jours)</pre>
<pre class="pseudo">// JAVA — meme principe
public class Location {
    private final Membre membre;          // reference 1
    private final Exemplaire exemplaire;  // reference 2
    private LocalDate dateDebut;
    private LocalDate dateFin;
    private double caution;

    public void prolonger(int jours) {
        this.dateFin = this.dateFin.plusDays(jours);
    }
}</pre>
<div class="tip">Retiens la chaîne complète du site : association porteuse Merise → classe-association UML → <strong>classe ordinaire à deux références</strong> en code → et demain, <strong>table de jonction</strong> en base de données. Un seul concept, quatre visages.</div>

<h3>10. Ce que le code ne conserve PAS</h3>
<p>Voici le piège central de la journée, et il vaut pour tous les langages. Regarde bien ce qui a disparu entre le diagramme et le code :</p>
<pre class="pseudo">CE QUI SURVIT AU PASSAGE AU CODE
  les classes, les attributs, les operations
  la visibilite (vraiment en Java, par convention en Python)
  l'heritage, les interfaces
  le SENS de navigation qu'on a code

CE QUI DISPARAIT
  les MULTIPLICITES     : rien n'empeche une liste de contenir 50 elements
                          la ou le modele disait 0..3
  les CONTRAINTES {...} : {stock_location &gt;= 0}, {date_fin &gt; date_debut}
                          ne sont ecrites nulle part
  la difference COMPOSITION / AGREGATION : elle ne tient qu'a la
                          discipline du developpeur</pre>
<p>Un modèle ne s'applique pas tout seul. Ce que le diagramme <em>affirme</em>, le code doit le <strong>vérifier</strong>. Reprenons le service métier existant sur le site, <code>louer(client, jeu_id, nb_jours=7)</code>, et faisons-lui respecter le modèle :</p>
<pre class="pseudo"># PYTHON — le service metier qui fait respecter le modele
MAX_LOCATIONS = 3          # traduction de la multiplicite 0..3 du diagramme

def louer(client, jeu_id, nb_jours=7):
    jeu = catalogue.trouver(jeu_id)
    if jeu is None:
        raise ValueError("Jeu inconnu")

    # CONTRAINTE 1 — multiplicite Membre 0..3 Location
    #   le modele la DESSINE, le code doit la VERIFIER
    if len(client.locations) &gt;= MAX_LOCATIONS:
        raise ValueError("Ce membre a deja 3 locations en cours")

    # CONTRAINTE 2 — {stock_location &gt; 0}
    if jeu.stock_location &lt;= 0:
        raise ValueError("Plus aucun exemplaire disponible a la location")

    # CONTRAINTE 3 — {date_fin &gt; date_debut}
    if nb_jours &lt;= 0:
        raise ValueError("La duree doit etre d'au moins un jour")

    debut = date.today()
    fin = debut + timedelta(days=nb_jours)
    exemplaire = jeu.premier_exemplaire_libre()
    location = Location(client, exemplaire, debut, fin)

    client.locations.append(location)   # on maintient les deux cotes
    jeu.stock_location -= 1
    return location</pre>
<div class="warn"><strong>Un modèle n'est pas auto-appliqué.</strong> Le diagramme n'est pas un programme : il n'exécute rien, il ne vérifie rien. Les multiplicités et les contraintes du modèle doivent devenir du <strong>code de validation</strong> explicite — dans le constructeur, dans une méthode <em>setter</em>, ou dans un service métier comme <code>louer()</code>. Un modèle non traduit en vérifications est un modèle qui sera violé dès le premier cas particulier.</div>

---                          ------                     ----
Classe                       class Jeu:                 public class Jeu
Attribut                     self.x                     this.x
Operation                    def m(self):               public ... m()
Visibilite +                 nom                        public
Visibilite -                 _nom / __nom (convention)  private
Visibilite #                 _nom (convention)          protected
Attribut souligne            attribut de classe         static
Cote "1"                     une reference              un champ objet
Cote "0..*"                  list                       List

Agregation (creux)           la partie est RECUE        parametre du ctor
Generalisation               class B(A)                 extends

Interface                    Protocol / ABC pure        interface + implements
Classe-association           classe a 2 references      classe a 2 references
Multiplicites, {contraintes} RIEN : a coder a la main   RIEN : idem</pre>

    solution: "# =================================================================\n# LUDOTHEQUE \"LE DE BLEU\" — traduction du diagramme de classes\n# Chaque commentaire indique le symbole UML dont vient la ligne.\n# =================================================================\n\nfrom abc import ABC, abstractmethod\nfrom datetime import date, timedelta\n\n\n# -----------------------------------------------------------------\n# Personne : nom en ITALIQUE dans le diagramme -> classe ABSTRAITE\n# -----------------------------------------------------------------\nclass Personne(ABC):\n    def __init__(self, nom, prenom):\n        self.nom = nom          # attribut UML \"+ nom : String\"\n        self.prenom = prenom    # attribut UML \"+ prenom : String\"\n\n    @abstractmethod\n    def role(self):\n        # operation en italique = ABSTRAITE : aucun corps ici,\n        # chaque sous-classe DOIT la fournir\n        pass\n\n    def nom_complet(self):      # operation concrete, heritee telle quelle\n        return self.prenom + \" \" + self.nom\n\n\n# -----------------------------------------------------------------\n# Membre / Employe : triangle creux vers Personne -> HERITAGE\n# -----------------------------------------------------------------\nclass Membre(Personne):\n    tarif_adhesion = 25.0   # attribut SOULIGNE en UML -> niveau CLASSE\n    MAX_LOCATIONS = 3       # contrainte {au plus 3 locations en cours}\n\n    def __init__(self, nom, prenom):\n        super().__init__(nom, prenom)   # generalisation : on delegue\n        self.locations = []             # cote 0..* -> une COLLECTION\n\n    def role(self):                     # implementation obligatoire\n        return \"membre\"\n\n    def locations_en_cours(self):\n        aujourd_hui = date.today()\n        return [l for l in self.locations if l.date_fin >= aujourd_hui]\n\n\nclass Employe(Personne):\n    def __init__(self, nom, prenom, matricule):\n        super().__init__(nom, prenom)\n        self._matricule = matricule     # visibilite \"-\" -> convention _nom\n\n    def role(self):\n        return \"employe\"\n\n\n# -----------------------------------------------------------------\n# Exemplaire : la PARTIE de la composition\n# -----------------------------------------------------------------\nclass Exemplaire:\n    def __init__(self, jeu, numero):\n        self.jeu = jeu          # cote \"1\" de l'association -> REFERENCE\n        self.numero = numero\n        self.disponible = True\n\n\n# -----------------------------------------------------------------\n# Jeu : losange PLEIN vers Exemplaire -> COMPOSITION\n#   le Jeu CREE ses Exemplaires et les DETRUIT avec lui\n# -----------------------------------------------------------------\nclass Jeu:\n    def __init__(self, jeu_id, titre, prix_location, prix_vente,\n                 nb_exemplaires, stock_vente=0):\n        self.jeu_id = jeu_id\n        self.titre = titre\n        self.prix_location = prix_location\n        self.prix_vente = prix_vente\n        self.stock_location = nb_exemplaires\n        self.stock_vente = stock_vente\n        # COMPOSITION : c'est ICI qu'on instancie les parties\n        self.exemplaires = [Exemplaire(self, n)\n                            for n in range(1, nb_exemplaires + 1)]\n\n    def premier_exemplaire_libre(self):\n        for ex in self.exemplaires:\n            if ex.disponible:\n                return ex\n        return None\n\n    def retirer_du_catalogue(self):\n        # les composants ne survivent pas au composite\n        self.exemplaires.clear()\n        self.stock_location = 0\n\n\n# -----------------------------------------------------------------\n# Location : CLASSE-ASSOCIATION -> classe ordinaire a DEUX references\n#   losange CREUX vers Membre et Exemplaire -> AGREGATION :\n#   ils sont RECUS de l'exterieur et SURVIVENT a la Location\n# -----------------------------------------------------------------\nclass Location:\n    def __init__(self, membre, exemplaire, date_debut, date_fin,\n                 caution=20.0):\n        self.membre = membre            # reference 1 (recue, pas creee)\n        self.exemplaire = exemplaire    # reference 2 (recue, pas creee)\n        self.date_debut = date_debut    # attribut de la classe-association\n        self.date_fin = date_fin        # attribut de la classe-association\n        self.caution = caution\n\n    def prolonger(self, jours):\n        self.date_fin = self.date_fin + timedelta(days=jours)\n\n    def cloturer(self):\n        self.exemplaire.disponible = True\n        self.exemplaire.jeu.stock_location += 1\n        # le Membre, lui, existe toujours : c'est une AGREGATION\n\n\n# =================================================================\n# LE SERVICE METIER\n# Ce que le diagramme AFFIRME, le code doit le VERIFIER :\n# aucune multiplicite, aucune contrainte {...} n'est appliquee\n# automatiquement par Python.\n# =================================================================\ndef louer(client, jeu_id, nb_jours=7):\n    jeu = catalogue.trouver(jeu_id)\n\n    if jeu is None:\n        raise ValueError(\"Jeu inconnu : \" + str(jeu_id))\n\n    # CONTRAINTE 1 : multiplicite {au plus 3 locations en cours}\n    if len(client.locations_en_cours()) >= Membre.MAX_LOCATIONS:\n        raise ValueError(\"Ce membre a deja 3 locations en cours\")\n\n    # CONTRAINTE 2 : {stock_location > 0}\n    if jeu.stock_location <= 0:\n        raise ValueError(\"Plus aucun exemplaire disponible a la location\")\n\n    # CONTRAINTE 3 : {date_fin > date_debut}\n    if nb_jours <= 0:\n        raise ValueError(\"La duree doit etre d'au moins un jour\")\n\n    exemplaire = jeu.premier_exemplaire_libre()\n    if exemplaire is None:\n        raise ValueError(\"Aucun exemplaire libre malgre le stock annonce\")\n\n    debut = date.today()\n    fin = debut + timedelta(days=nb_jours)\n    location = Location(client, exemplaire, debut, fin)\n\n    # on maintient LES DEUX cotes de l'association\n    client.lo
