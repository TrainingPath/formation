var DAY = {

  title: "Diagramme d'objets : instancier pour valider son modèle",
  subtitle: "Prendre une photo du système à un instant donné, pour vérifier que le modèle tient.",
  theory: `
<h3>1. Le problème du jour</h3>
<p>Pendant trois jours, tu as construit le diagramme de classes de la Ludothèque : classes, attributs, opérations, associations, multiplicités, héritage, composition. Le dessin est propre. Mais une question reste entière : <strong>est-il juste ?</strong></p>
<p>Un diagramme de classes est une <strong>promesse</strong>. Il promet que tout ce qui peut arriver dans la vraie ludothèque pourra être représenté par le modèle. Le problème, c'est qu'une promesse ne se vérifie pas en la relisant. Elle se vérifie en la <strong>confrontant à des cas réels</strong>.</p>
<p>C'est exactement le rôle du <strong>diagramme d'objets</strong> (sigle <strong>DOB</strong> dans ton cours d'école). Il prend un scénario concret — « le 12 mars à 14 h, Alice loue l'exemplaire n° 7 de Catan » — et le dessine. Si le scénario se dessine sans forcer, le modèle tient. S'il ne se dessine pas, ce n'est pas le scénario qui a tort.</p>

<h3>2. L'objet : une instance de classe</h3>
<p>Un <strong>objet</strong> est une <strong>instance</strong> d'une classe : un exemplaire concret, particulier, qui existe à un moment donné. La classe <code>Jeu</code> décrit ce qu'est un jeu <em>en général</em> ; l'objet <code>catan</code> est <em>un</em> jeu précis, avec un titre précis et un prix précis.</p>
<pre class="pseudo">CLASSE                      OBJET (= instance)
------                      -----------------
Jeu                         catan, dixit, monopoly...
Membre                      alice, bruno...
Exemplaire                  ex7, ex3...
Location                    loc12, loc13...

# La classe est un MOULE, l'objet est une PIECE sortie du moule.
# Une classe existe dans le modele ; un objet existe a l'execution,
# ou dans le monde reel qu'on decrit.</pre>
<p>Le <strong>diagramme d'objets</strong> illustre donc un diagramme de classes par des <strong>exemples concrets pris à un instant donné</strong>. C'est une <strong>photographie</strong> du système : elle est vraie à 14 h, et peut être fausse à 15 h, quand Alice aura rendu le jeu.</p>
<div class="tip">Le diagramme d'objets appartient à la famille des diagrammes <strong>structurels</strong>, comme le diagramme de classes. Il est pourtant lié à un instant : ce n'est pas une contradiction. Il décrit une <em>structure</em> (qui est relié à qui), simplement il la décrit à une date, au lieu de la décrire en général.</div>

<h3>3. La notation : le soulignement, et rien d'autre</h3>
<p>Un objet se dessine comme une classe : un <strong>rectangle</strong>. Une seule chose le distingue, et elle est capitale : <strong>son nom est SOULIGNÉ</strong>.</p>
<pre class="pseudo">   +--------------------+          +--------------------+
   |        Jeu         |          |    catan : Jeu     |
   |                    |          |    -----------     |  # SOULIGNE
   +--------------------+          +--------------------+
   |  c'est une CLASSE  |          |  c'est un OBJET    |
   +--------------------+          +--------------------+</pre>
<div class="warn">Le <strong>soulignement est le seul signe distinctif</strong>. Un rectangle non souligné est une classe ; le même rectangle souligné est un objet. En examen, oublier le trait n'est pas une faute de présentation : c'est une faute de <strong>sens</strong>, tu as dessiné un autre diagramme que celui demandé.</div>
<p>Le nom d'un objet admet <strong>trois formes</strong>, toutes les trois valides :</p>
<pre class="pseudo">   catan : Jeu     # forme complete : le nom de l'objet ET sa classe
   -----------

   catan           # l'objet seul : sa classe n'est pas precisee
   -----             (utile quand elle est evidente dans le contexte)

   : Jeu           # objet ANONYME : on sait ce qu'il est,
   -----             pas qui il est
                     -> "un Jeu, peu importe lequel"</pre>
<p>La forme <strong>anonyme</strong> (<code>: Jeu</code>) sert quand l'identité de l'objet n'a aucune importance pour ce qu'on veut montrer : « un membre loue <em>un</em> exemplaire », sans dire lequel. Le deux-points reste écrit, et le soulignement aussi.</p>
<div class="warn">Attention à l'ordre : on écrit <code>nomObjet : Classe</code>, jamais <code>Classe : nomObjet</code>. L'objet d'abord, sa classe ensuite, séparés par un deux-points.</div>

<h3>4. Le second compartiment : les valeurs d'attributs</h3>
<p>Sous le nom, un second compartiment donne les <strong>valeurs des attributs</strong> de cet objet précis. En vocabulaire UML, ces couples attribut/valeur s'appellent des <strong>slots</strong>. On les écrit <code>attribut = valeur</code>.</p>
<pre class="pseudo">   +----------------------------+
   |        catan : Jeu         |
   |        -----------         |
   +----------------------------+
   | titre = "Catan"            |   # un slot
   | prix_location = 3.50       |   # un slot
   | stock_location = 2         |   # un slot
   +----------------------------+
# Pas de troisieme compartiment. JAMAIS d'operations.</pre>
<p>Pourquoi pas d'opérations ? Parce qu'elles ne varient pas d'un objet à l'autre. Tous les <code>Jeu</code> ont la même méthode <code>louer()</code> — c'est la classe qui la porte. Ce qui distingue <code>catan</code> de <code>dixit</code>, ce ne sont pas leurs opérations, ce sont leurs <strong>valeurs</strong>.</p>
<div class="tip">Tu n'es pas obligé de montrer tous les attributs. Un diagramme d'objets sert à démontrer quelque chose : montre les valeurs qui servent à la démonstration, tais les autres. Si tu veux prouver qu'un jeu à <code>stock_location = 0</code> ne peut pas être loué, la couleur de la boîte n'intéresse personne.</div>

<h3>5. Le lien : une instance d'association</h3>
<p>Entre deux objets, on trace un <strong>lien</strong> (en anglais <em>link</em>). Un lien est à une association ce qu'un objet est à une classe : une <strong>instance</strong>. C'est un <strong>trait plein</strong>, exactement comme l'association.</p>
<pre class="pseudo"># DANS LE DIAGRAMME DE CLASSES (le general)
   +-----------+  1              1..*  +---------------+
   |    Jeu    |------------------------|   Exemplaire  |
   +-----------+   association          +---------------+

# DANS LE DIAGRAMME D'OBJETS (le particulier, a un instant)
   +----------------+              +---------------------+
   |  catan : Jeu   |              |  ex7 : Exemplaire   |
   |  -----------   |--------------|  ----------------   |
   +----------------+     lien     +---------------------+
                     (aucun chiffre)</pre>
<p>Et voici le point que les examinateurs adorent : <strong>un lien ne porte JAMAIS de multiplicité</strong>.</p>
<div class="warn"><strong>Pourquoi ?</strong> Une multiplicité répond à la question « combien ? » : combien d'exemplaires peut avoir <em>un</em> jeu, en général. Mais entre <code>catan</code> et <code>ex7</code>, il n'y a rien à compter : ces deux objets-là sont reliés, ou ils ne le sont pas. Écrire <code>0..*</code> sur un lien reviendrait à dire « ex7 est relié à catan entre zéro et plusieurs fois » — la phrase n'a aucun sens. La multiplicité est une <strong>contrainte sur le modèle</strong> ; le diagramme d'objets est un <strong>cas qui respecte</strong> cette contrainte, il ne la répète pas.</div>
<p>Un lien peut en revanche porter le <strong>nom de l'association</strong> et les <strong>rôles</strong>, si cela aide à lire. Ce qui est interdit, c'est le chiffre.</p>

<h3>6. Une photo complète de la Ludothèque</h3>
<p>Assemblons. Scénario : <em>le 12 mars à 14 h, Alice Dupont emporte l'exemplaire n° 7 du jeu Catan, contre une caution de 20 €</em>.</p>
<pre class="pseudo"># DIAGRAMME D'OBJETS — la Ludotheque, le 12/03 a 14h00

   +------------------------+        +--------------------------+
   |      catan : Jeu       |        |    ex7 : Exemplaire      |
   |      -----------       |--------|    ----------------      |
   +------------------------+        +--------------------------+
   | titre = "Catan"        |        | numero = 7               |
   | prix_location = 3.50   |        | etat = "bon"             |
   | stock_location = 2     |        +--------------------------+
   +------------------------+                    |
                                                 |
   +------------------------+        +--------------------------+
   |    alice : Membre      |        |     loc12 : Location     |
   |    --------------      |--------|     ----------------     |
   +------------------------+        +--------------------------+
   | nom = "Dupont"         |        | date_debut = 12/03/2025  |
   | prenom = "Alice"       |        | date_fin = null          |
   +------------------------+        | caution = 20.00          |
                                     +--------------------------+

# Lecture : tous les noms sont SOULIGNES, tous les liens sont des
# traits pleins, AUCUN chiffre n'apparait, AUCUN compartiment
# d'operations n'existe.
# date_fin = null : la location est en cours a l'instant de la photo.</pre>
<p>Note <code>date_fin = null</code>. C'est typiquement ce qu'un diagramme de classes ne montre jamais et qu'un diagramme d'objets rend évident : à cet instant, la location n'est pas terminée. Une photo raconte un <strong>état</strong>.</p>

<h3>7. Le vrai usage : tester son diagramme de classes</h3>
<p>Voici la raison pour laquelle ce diagramme mérite une journée entière. Il ne sert pas à faire joli : il sert à <strong>valider la pertinence d'un modèle de classes face à des scénarios réels</strong>. La méthode tient en trois lignes :</p>
<pre class="pseudo">1. Prendre une situation reelle et LEGITIME du metier
2. Essayer de la dessiner en objets, en respectant STRICTEMENT
   les multiplicites et les associations du diagramme de classes
3. Si c'est impossible -> le diagramme de CLASSES est faux</pre>
<div class="tip">Retiens la règle d'or : <strong>quand une situation métier valide ne peut pas être instanciée, ce n'est jamais la réalité qui a tort.</strong> C'est le modèle. Le diagramme d'objets est le contre-exemple qui fait tomber la promesse.</div>

<h3>8. Deux erreurs que le diagramme d'objets révèle</h3>
<p><strong>Cas 1 — une multiplicité trop restrictive.</strong> Ton diagramme de classes dit qu'une location porte sur exactement un exemplaire.</p>
<pre class="pseudo"># CE QUE DIT LE MODELE
   Location  1 ---------------- 1  Exemplaire
   # "une Location concerne exactement 1 Exemplaire"

# CE QUE DIT LA REALITE
   Le 12/03, Alice repart avec l'exemplaire n7 de Catan ET
   l'exemplaire n3 de Dixit, sur UN SEUL contrat de location.

# ON ESSAIE D'INSTANCIER
   loc12 : Location ------ ex7 : Exemplaire
                    ------ ex3 : Exemplaire   # INTERDIT par le "1"

# VERDICT : la situation est legitime, elle arrive tous les jours.
# C'est donc la multiplicite qui est fausse. Correction :
   Location  1 ---------------- 1..*  Exemplaire</pre>
<p><strong>Cas 2 — une association manquante.</strong> Ton diagramme de classes relie <code>Reservation</code> à <code>Jeu</code>, et s'arrête là.</p>
<pre class="pseudo"># CE QUE DIT LE MODELE
   Reservation  0..* ---------- 1  Jeu
   # et rien d'autre

# CE QUE DIT LA REALITE
   "resa5 est la reservation d'Alice sur le jeu Catan"

# ON ESSAIE D'INSTANCIER
   resa5 : Reservation ------ catan : Jeu        # OK
   resa5 : Reservation ------ alice : Membre     # AUCUN LIEN POSSIBLE

# VERDICT : impossible de dire QUI a reserve. Il ne manque pas une
# multiplicite, il manque une ASSOCIATION entiere :
   Membre  1 ---------- 0..*  Reservation</pre>
<p>Dans les deux cas, le diagramme d'objets n'a rien inventé. Il a simplement essayé de dessiner un lundi ordinaire, et il a buté. C'est un <strong>test</strong>, au sens strict : on lui donne un jeu de données, et il passe ou il échoue.</p>
<div class="warn">Erreur de raisonnement fréquente : quand l'instanciation échoue, l'étudiant modifie le <em>scénario</em> pour qu'il rentre dans le modèle (« bon, on fera deux locations séparées »). C'est prendre le problème à l'envers. Si la ludothèque délivre un seul ticket pour trois jeux, le logiciel devra le faire aussi. Le modèle s'adapte au métier, jamais l'inverse.</div>

<h3>9. Récapitulatif, et ce qui vient après</h3>
<pre class="pseudo">DIAGRAMME DE CLASSES          DIAGRAMME D'OBJETS (DOB)
--------------------          ------------------------
Classe                        Objet (instance de classe)
Nom normal                    Nom SOULIGNE
Attribut : Type               attribut = valeur (slot)
Compartiment d'operations     AUCUN compartiment d'operations
Association (trait plein)     Lien (trait plein)
Multiplicites 0..*, 1..1      AUCUNE multiplicite
Vrai en general, toujours     Vrai a un INSTANT donne
Definit ce qui est POSSIBLE   Montre un cas REEL

Trois ecritures du nom : catan : Jeu | catan | : Jeu (anonyme)</pre>
<p>Tu sais maintenant vérifier un modèle. Reste un autre problème, celui du volume : le diagramme de classes complet de la Ludothèque approche la vingtaine de classes, et un vrai système d'information en compte des centaines. Comment ranger tout ça ? Demain : le <strong>diagramme de paquetages</strong>, et l'art de maîtriser qui dépend de qui.</p>`,

    statement: "Le diagramme de classes de la Ludothèque affirme : <code>Membre 1 ---- 0..* Location</code>, <code>Location 1 ---- 1 Exemplaire</code>, <code>Jeu 1 ---- 1..* Exemplaire</code>, <code>Reservation 0..* ---- 1 Jeu</code>. Voici le samedi 12 mars : <em>Alice Dupont emporte en une seule fois l'exemplaire n° 7 de Catan (état « bon ») et l'exemplaire n° 3 de Dixit, sur un seul contrat de location commencé le 12/03, caution 20 €. Au même moment, elle réserve le jeu Carcassonne, indisponible.</em> <strong>Rédige :</strong> (a) le <strong>diagramme d'objets</strong> de cette scène (en texte ou en art ASCII), avec au minimum <code>catan : Jeu</code>, <code>ex7 : Exemplaire</code>, <code>alice : Membre</code> et <code>loc12 : Location</code>, valeurs d'attributs comprises ; (b) l'identification des <strong>deux endroits où l'instanciation devient impossible</strong> ; (c) pour chacun, la <strong>correction à apporter au diagramme de classes</strong>, en distinguant bien le cas « multiplicité trop restrictive » du cas « association manquante » ; (d) une phrase expliquant <strong>pourquoi tu n'as écrit aucune multiplicité</strong> sur tes liens.",
    hints: [
      "Pour (a), commence par lister les objets avant de tracer le moindre trait : combien d'exemplaires, combien de locations, combien de réservations ? Puis souligne chaque nom, et remplis les slots au format attribut = valeur — sans jamais ouvrir un compartiment d'opérations.",
      "Pour (b), prends chaque phrase de l'énoncé et essaie de la dessiner en respectant STRICTEMENT les chiffres du diagramme de classes. « Un seul contrat pour deux exemplaires » se heurte à un chiffre. « Elle réserve Carcassonne » se heurte à autre chose : cherche par quel lien tu relierais la réservation à Alice.",
      "Pour (c), distingue les deux natures de défaut : si le lien existe dans le modèle mais que le nombre l'interdit, c'est une multiplicité à élargir ; si aucun trait ne relie les deux classes concernées, c'est une association entière qui manque, et il faudra aussi lui donner ses multiplicités."
    ],
    checklist: [
      "Tous les noms d'objets sont SOULIGNÉS et écrits dans l'ordre nomObjet : Classe (ou en forme anonyme : Classe), jamais l'inverse.",
      "Les valeurs sont écrites au format attribut = valeur dans un second compartiment, et AUCUN objet ne porte de compartiment d'opérations.",
      "Aucun lien du diagramme ne porte de multiplicité ni de cardinalité, et cette absence est justifiée explicitement en (d).",
      "Les deux défauts sont identifiés ET qualifiés séparément : l'un est une multiplicité trop restrictive à élargir, l'autre est une association manquante à créer avec ses propres multiplicités."

    solution: "# DIAGRAMME D'OBJETS — Le De Bleu, samedi 12/03/2025, 14h00\n\n# ==================================================================\n# (a) LA PHOTO DE LA SCENE\n# ==================================================================\n\n   +------------------------+       +--------------------------+\n   |      catan : Jeu       |       |      dixit : Jeu         |\n   |      -----------       |       |      -----------         |\n   +------------------------+       +--------------------------+\n   | titre = \"Catan\"        |       | titre = \"Dixit\"          |\n   | prix_location = 3.50   |       | prix_location = 2.50     |\n   | stock_location = 2     |       | stock_location = 1       |\n   +------------------------+       +--------------------------+\n              |                                  |\n   +------------------------+       +--------------------------+\n   |   ex7 : Exemplaire     |       |   ex3 : Exemplaire       |\n   |   ----------------     |       |   ----------------       |\n   +------------------------+       +--------------------------+\n   | numero = 7             |       | numero = 3               |\n   | etat = \"bon\"           |       | etat = \"bon\"             |\n   +------------------------+       +--------------------------+\n              |                                  |\n              +---------------+------------------+\n                              |\n                   +--------------------------+\n                   |    loc12 : Location      |\n                   |    ----------------      |\n                   +--------------------------+\n                   | date_debut = 12/03/2025  |\n                   | date_fin = null          |\n                   | caution = 20.00          |\n                   +--------------------------+\n                              |\n                   +--------------------------+\n                   |     alice : Membre       |\n                   |     --------------       |\n                   +--------------------------+\n                   | nom = \"Dupont\"           |\n                   | prenom = \"Alice\"         |\n                   +--------------------------+\n                              ?\n                   +--------------------------+\n                   |   resa5 : Reservation    |\n                   |   --------------------   |\n                   +--------------------------+       +---------------+\n                   | date = 12/03/2025        |-------| carcassonne   |\n                   | statut = \"en attente\"    |       | ------------- |\n                   +--------------------------+       |    : Jeu      |\n                                                      +---------------+\n\n# Le \"?\" marque le lien que je VOUDRAIS tracer et qui n'existe pas\n# dans le modele. C'est deja le second defaut.\n\n# ==================================================================\n# (a bis) LA MEME PHOTO EN PlantUML (a coller dans un editeur)\n# ==================================================================\n# @startuml\n# object \"catan : Jeu\" as catan\n# catan : titre = \"Catan\"\n# catan : prix_location = 3.50\n# catan : stock_location = 2\n#\n# object \"dixit : Jeu\" as dixit\n# dixit : titre = \"Dixit\"\n# dixit : prix_location = 2.50\n# dixit : stock_location = 1\n#\n# object \"ex7 : Exemplaire\" as ex7\n# ex7 : numero = 7\n# ex7 : etat = \"bon\"\n#\n# object \"ex3 : Exemplaire\" as ex3\n# ex3 : numero = 3\n# ex3 : etat = \"bon\"\n#\n# object \"alice : Membre\" as alice\n# alice : nom = \"Dupont\"\n# alice : prenom = \"Alice\"\n#\n# object \"loc12 : Location\" as loc12\n# loc12 : date_debut = 12/03/2025\n# loc12 : date_fin = null\n# loc12 : caution = 20.00\n#\n# object \"resa5 : Reservation\" as resa5\n# resa5 : date = 12/03/2025\n# resa5 : statut = \"en attente\"\n#\n# object \"carcassonne : Jeu\" as carcassonne\n# carcassonne : titre = \"Carcassonne\"\n# carcassonne : stock_location = 0\n#\n# catan -- ex7\n# dixit -- ex3\n# loc12 -- ex7\n# loc12 -- ex3\n# alice -- loc12\n# resa5 -- carcassonne\n# alice -- resa5\n# @enduml\n#\n# Remarque : en PlantUML on ecrit \"object\" et non \"class\", et le\n# soulignement du nom est ajoute automatiquement au rendu.\n# Aucune multiplicite n'est ecrite sur les traits \"--\".\n\n# ==================================================================\n# (b) LES DEUX POINTS DE RUPTURE\n# ==================================================================\n\n# RUPTURE 1 — un seul contrat pour deux exemplaires\n   Le modele dit :  Location  1 ------------ 1  Exemplaire\n   La scene dit  :  loc12 est reliee a ex7 ET a ex3\n   -> le chiffre 1 interdit le second lien.\n   Or delivrer un seul ticket pour plusieurs jeux est la pratique\n   normale du comptoir : la situation est LEGITIME.\n\n# RUPTURE 2 — qui a reserve Carcassonne ?\n   Le modele dit :  Reservation  0..* ---------- 1  Jeu\n                    et rien entre Reservation et Membre\n   La scene dit  :  resa5 est la reservation D'ALICE\n   -> aucun trait du diagramme de classes ne permet de tracer\n      le lien alice -- resa5. Ce n'est pas un probleme de nombre :\n      le chemin n'existe pas du tout.\n\n# ==================================================================\n# (c) LES DEUX CORRECTIONS, DE NATURES DIFFERENTES\n# ==================================================================\n\n# CORRECTION 1 : MULTIPLICITE TROP RESTRICTIVE\n   Avant :  Location  1 ------------ 1     Exemplaire\n   Apres :  Location  1 ------------ 1..*  Exemplaire\n   Nature : l'association existait deja, seul le nombre etait faux.\n            On l'ELARGIT. Rien d'autre ne change dans le modele.\n   Lecture : \"une Location porte sur au moins un Exemplaire\" ;\n             \"un Exemplaire est concerne par 1 Location a la fois\".\n\n# CORRECTION 2 : ASSOCIATION MANQUANTE\n   Avant :  (rien entre Membre et Reservation)\n   Apres :  Membre  1 ---------- 0..*  Reservation\n   Nature : on AJOUTE une association complete, avec ses deux\n            multiplicites. Sans elle, le systeme saurait qu'une\n            reservation existe mais pas a qui la proposer quand\n            un Exemplaire revient.\n   Lecture : \"un Membre peut avoir 0 a N Reservations\" ;\n             \"une Reservation appartient a exactement 1 Membre\".\n\n# La distinction a retenir :\n#   multiplicite trop restrictive -> le trait existe, le chiffre ment\n#   association manquante         -> le trait n'existe pas du tout\n\n# ==================================================================\n# (d) POURQUOI AUCUNE MULTIPLICITE SUR MES LIENS\n# ==================================================================\n\nParce qu'un lien relie DEUX INSTANCES PRECISES : loc12 et ex7 sont\nreliees, ou elles ne le sont pas. Il n'y a rien a compter entre\nelles. La multiplicite est une contrainte qui s'exprime au niveau\nde la CLASSE (\"combien d'Exemplaires peut avoir une Location ?\") ;\nle diagramme d'objets est un cas particulier qui doit RESPECTER\ncette contrainte, pas la repeter. Ecrire \"1\" sur le lien\nloc12 -- ex7 signifierait \"ex7 est relie a loc12 exactement une\nfois\", ce qui ne veut rien dire.\n\n# ==================================================================\n# CE QU'IL FAUT RETENIR\n# ==================================================================\n# Le diagramme d'objets ne decore pas le diagramme de classes :\n# il le TESTE. On lui donne un scenario reel, et il passe ou il\n# echoue. Ici il a echoue deux fois — et chaque echec a fait\n# apparaitre un defaut du modele AVANT la premiere ligne de code.\n# Quand une situation metier valide ne s'instancie pas, ce n'est\n# jamais la realite qui a tort.",
    note: "Ta mise en page peut différer : ce qui compte n'est pas l'esthétique. Vérifie quatre choses avant de comparer : tes noms sont-ils soulignés, tes valeurs écrites attribut = valeur, tes liens dépourvus de tout chiffre, et as-tu bien qualifié séparément les deux défauts (un nombre trop étroit d'un côté, un trait absent de l'autre) ? Si tu as modifié le scénario pour qu'il rentre dans le modèle — par exemple en créant deux locations séparées — tu as pris le problème à l'envers : c'est le modèle qui doit s'adapter au métier." }
