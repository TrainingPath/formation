  theory: `
<h3>1. Un diagramme pour un seul objet</h3>
<p>Le <strong>diagramme de machine à états</strong> (nom normatif d'UML 2.5.1 ; ton cours d'école dit <strong>diagramme d'état-transition</strong>, sigle <strong>DET</strong>) décrit le <strong>cycle de vie d'UN objet</strong> : par quels états passe-t-il depuis sa création jusqu'à sa disparition, et qu'est-ce qui le fait changer d'état.</p>
<p>C'est la différence clé avec le <strong>diagramme d'activités</strong>, et il faut la retenir telle quelle : le diagramme d'activités décrit un <strong>processus</strong> impliquant <strong>plusieurs participants</strong> (un membre, un employé, un système de paiement) ; le diagramme de machine à états décrit la <strong>vie interne d'un seul objet</strong>, instance d'<strong>une seule classe</strong>.</p>
<pre class="pseudo"># Deux diagrammes, deux questions differentes
Diagramme d'activites -> "comment se deroule une location, du debut a la fin,
                          entre le membre, l'employe et le systeme ?"
Machine a etats       -> "par quels etats passe UN Exemplaire de jeu,
                          de son achat a sa mise au rebut ?"
# Le premier suit un PROCESSUS, le second suit un OBJET.</pre>
<div class="tip">Test rapide : si tu es tenté de dessiner des couloirs (<em>partitions</em>) pour séparer les acteurs, tu n'es pas dans une machine à états. Une machine à états n'a qu'un seul sujet, et ce sujet ne se dessine pas : il <em>est</em> le diagramme.</div>

<h3>2. L'état</h3>
<p>Un <strong>état</strong> est une situation durable dans laquelle se trouve l'objet, et pendant laquelle il satisfait une condition, exécute une activité ou attend un événement. On le dessine par un <strong>rectangle à coins arrondis</strong> contenant son nom.</p>
<pre class="pseudo">   .---------------.        .---------------.
  (   Disponible    )      (      Loue       )
   '---------------'        '---------------'
# Rectangle a COINS ARRONDIS.
# Le nom d'un etat s'ecrit avec un adjectif ou un participe passe :
# Disponible, Loue, En retard, Retire.
# JAMAIS un verbe d'action a l'infinitif : "Louer" n'est pas un etat.</pre>
<p>Un objet se trouve, à tout instant, dans <strong>exactement un</strong> état (nous verrons demain la seule exception : les régions orthogonales). Bien nommer les états, c'est la moitié du travail : un état décrit une <em>situation</em>, pas une <em>opération</em>.</p>

<h3>3. Les pseudo-états de début et de fin</h3>
<p>Deux symboles marquent les bornes du cycle de vie :</p>
<pre class="pseudo">  *          # ETAT INITIAL : un DISQUE PLEIN (petit rond noir)
  |          #   -> designe l'etat dans lequel l'objet nait
  v
 .---------------.
(   Disponible    )
 '---------------'
  |
  v
 (*)         # ETAT FINAL : un disque plein CERCLE (rond noir dans un cercle)
             #   -> l'objet a termine son cycle de vie</pre>
<p>L'état initial n'est pas un vrai état : c'est un <strong>pseudo-état</strong>, l'objet n'y séjourne pas. Il indique simplement où commence la vie de l'objet. L'état final, lui, marque la fin de la machine. Une machine possède <strong>un seul état initial</strong> par région, et <strong>zéro, un ou plusieurs</strong> états finaux.</p>
<div class="tip">Une machine sans état final n'est pas une erreur : un objet peut être conçu pour tourner indéfiniment (un thermostat, une session de service). Un <code>Exemplaire</code> de jeu, lui, finit par être <code>Retire</code> : son cycle a bien une fin.</div>

<h3>4. La transition et sa syntaxe normative</h3>
<p>Une <strong>transition</strong> est le passage d'un état source vers un état cible. On la dessine par une <strong>flèche</strong>, et on l'étiquette selon une syntaxe précise que la norme définit ainsi :</p>
<pre class="pseudo">          evenement [garde] / effet

# Les trois parties sont TOUTES FACULTATIVES, mais l'ordre est impose.
# Exemples, du plus simple au plus complet :

louer(m)                                             # evenement seul
[stock_location > 0]                                 # garde seule
/ decrementerStock()                                 # effet seul
louer(m) [stock_location > 0]                        # evenement + garde
louer(m) [stock_location > 0] / decrementerStock()   # les trois</pre>
<p>Lis-la comme une phrase : « <em>quand</em> l'événement survient, <em>si</em> la garde est vraie, <em>alors</em> on exécute l'effet et on change d'état ». Si l'événement survient alors que la garde est fausse, <strong>rien ne se passe</strong> : l'objet reste où il est, et l'événement est perdu.</p>
<div class="tip">Le support de l'école montre cette syntaxe uniquement <strong>en figures</strong>, sans jamais l'écrire en toutes lettres. Retiens-la sous cette forme : <strong><code>événement [garde] / effet</code></strong>. C'est elle qu'on attend de toi à l'examen, et c'est elle qu'emploient les outils (PlantUML, StarUML, Visual Paradigm).</div>

<h3>5. Les quatre types d'événements</h3>
<p>Un <strong>événement</strong> est un fait ponctuel, instantané, susceptible de déclencher une transition. Ton cours en enseigne quatre familles :</p>
<pre class="pseudo">1. APPEL DE METHODE (call)   # une operation de l'objet est invoquee
   louer(m : Membre)
   rendre()

2. SIGNAL                    # un message asynchrone recu de l'exterieur
   PaiementAccepte
   AlerteRetard

3. CHANGEMENT DE VALEUR      # une expression booleenne devient vraie
   when(stock_location = 0)
   # l'evenement survient au MOMENT ou la condition bascule

4. ECOULEMENT DU TEMPS       # le temps passe
   after(7 jours)            # 7 jours APRES l'entree dans l'etat courant
   when(date = date_fin)     # a une DATE absolue</pre>
<p>Retiens la distinction entre les deux notations temporelles : <strong><code>after(durée)</code></strong> est <em>relatif</em> — il compte à partir du moment où l'objet est entré dans l'état ; <strong><code>when(date)</code></strong> est <em>absolu</em> — il se déclenche à une date donnée, ou dès qu'une expression devient vraie.</p>
<pre class="pseudo"># A la ludotheque, les quatre types en situation
Disponible -> Loue       : louer(m)             # appel de methode
Loue       -> EnRetard   : after(7 jours)       # ecoulement du temps
Reserve    -> Disponible : when(now > date_fin) # date absolue
Loue       -> Disponible : ReceptionRetour      # signal</pre>

<h3>6. La garde</h3>
<p>Une <strong>garde</strong> est une condition booléenne écrite entre <strong>crochets</strong>. La transition ne se déclenche que si la garde est <strong>vraie au moment où l'événement survient</strong>.</p>
<pre class="pseudo">Disponible -> Loue         : louer(m) [stock_location > 0]
Disponible -> Loue         : louer(m) [m.estAJour() = true]
Loue       -> EnReparation : rendre() [etat = "abime"]
Loue       -> Disponible   : rendre() [etat &lt;&gt; "abime"]

# Deux transitions partent du MEME etat sur le MEME evenement :
# ce sont les GARDES qui les departagent. Elles doivent etre
# MUTUELLEMENT EXCLUSIVES, sinon la machine est indeterministe.</pre>
<div class="warn">Une garde n'est <strong>pas</strong> un événement. Écrire <code>[stock_location > 0]</code> seul sur une flèche signifie « dès que cette condition devient vraie » — c'est une transition automatique, évaluée dès la fin de l'activité de l'état source. Si tu veux dire « quand on demande une location <em>et</em> qu'il reste du stock », il faut écrire les deux : <code>louer(m) [stock_location > 0]</code>.</div>

<h3>7. Les activités internes d'un état</h3>
<p>Un état n'est pas forcément passif. UML permet d'y attacher trois comportements, notés à l'intérieur du rectangle arrondi :</p>
<pre class="pseudo"> .-------------------------------------.
(  Loue                                 )
(  ---------------------------------    )
(  entry / enregistrerSortie()          )   # a l'ENTREE dans l'etat
(  do    / surveillerEcheance()         )   # PENDANT le sejour
(  exit  / calculerPenalite()           )   # a la SORTIE de l'etat
 '-------------------------------------'

# entry : execute UNE FOIS, des qu'on entre dans l'etat
# do    : execute TANT QU'ON RESTE dans l'etat ; peut etre interrompu
#         par n'importe quelle transition sortante
# exit  : execute UNE FOIS, juste avant de quitter l'etat</pre>
<p>L'ordre d'exécution est fixe, et il faut le connaître : quand une transition fait passer de A à B, on exécute d'abord le <code>exit</code> de A, puis l'<strong>effet</strong> de la transition, puis l'<code>entry</code> de B, et enfin le <code>do</code> de B démarre.</p>
<pre class="pseudo"># Ordre d'execution, transition A --evenement/effet--> B
1. exit  de A
2. effet de la transition
3. entry de B
4. do    de B   (tant qu'on reste dans B)</pre>
<div class="warn"><strong>Écart de vocabulaire avec ton cours d'école.</strong> Le support du PAC oppose deux mots : une <strong>action</strong> serait « instantanée, non interruptible, associée à une <strong>transition</strong> », et une <strong>activité</strong> serait « d'une certaine durée, interruptible, associée à un <strong>état</strong> ». Cette opposition vient d'<strong>UML 1.x</strong>. Depuis UML 2, elle n'est plus normative : la norme 2.5.1 parle de <strong>comportements</strong> (<em>behaviors</em>) attachés à un état par <code>entry</code>, <code>do</code> et <code>exit</code>, et d'un <strong><code>effect</code></strong> porté par la transition. Apprends le standard ; reconnais la variante si ton professeur l'emploie — l'intuition qu'elle véhicule (ce qui dure va dans l'état, ce qui est instantané va sur la flèche) reste juste.</div>

# Lecture : un exemplaire NAIT Disponible (achat), peut etre Reserve,

<h3>9. Quand dessiner une machine à états ?</h3>
<p>Pas pour toutes les classes, loin de là. Le critère est simple : la classe a-t-elle un <strong>état</strong> qui change au cours de sa vie et qui conditionne ce qu'on a le droit de lui faire ? Si oui, la machine à états vaut le détour.</p>

Location    -> OUI       (en cours / terminee / en retard)
Reservation -> OUI       (en attente / confirmee / annulee / expiree)
Membre      -> PEUT-ETRE (actif / suspendu / radie)
Jeu         -> NON       (un jeu ne change pas d'etat ; ses exemplaires si)
Categorie   -> NON       (aucun cycle de vie)</pre>`,
