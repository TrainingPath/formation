  theory: `
<h3>1. Deux dessins pour une seule interaction</h3>
<p>Le <strong>diagramme de communication</strong> (sigle <strong>DCO</strong> dans ton cours d'école) montre <strong>exactement les mêmes informations</strong> qu'un diagramme de séquence. Mêmes participants, mêmes messages, même scénario. Ce qui change, c'est l'<strong>angle</strong> :</p>
<pre class="pseudo">Diagramme de SEQUENCE (DSE)  -&gt; accent sur l'aspect TEMPOREL
                                "dans quel ordre les messages partent-ils ?"

Diagramme de COMMUNICATION   -&gt; accent sur l'aspect SPATIAL
              (DCO)             "qui est relie a qui ?"</pre>
<p>Les deux diagrammes sont <strong>équivalents</strong> : toute l'information de l'un se retrouve dans l'autre, et les outils de modélisation savent <strong>convertir</strong> automatiquement l'un en l'autre. Ce n'est pas un diagramme de plus à apprendre : c'est le même contenu, réorganisé.</p>
<div class="tip">Pourquoi deux formes alors ? Parce qu'elles ne répondent pas à la même question. Si tu veux vérifier <strong>l'enchaînement</strong> d'un scénario, prends le DSE : le temps y est lisible d'un coup d'œil. Si tu veux vérifier <strong>l'architecture des collaborations</strong> — quels objets se parlent, lesquels sont surchargés de liens — prends le DCO : la topologie y saute aux yeux.</div>

<h3>2. La notation : rectangles et liens</h3>
<p>Le dessin repose sur trois éléments seulement.</p>
<pre class="pseudo">1. Les PARTICIPANTS  -&gt; des RECTANGLES, nommes "role : Type"
2. Les LIENS         -&gt; des TRAITS simples entre rectangles
3. Les MESSAGES      -&gt; des FLECHES le long du lien, avec un NUMERO</pre>
<pre class="pseudo">    +--------------+                    +---------------------+
    | e : Employe  |--------------------| sys : Ludotheque    |
    +--------------+   1 : louer(...)   +---------------------+
                          -----&gt;
    #  le TRAIT    = le LIEN (une relation existe entre les deux)
    #  la FLECHE   = le MESSAGE qui circule sur ce lien
    #  le NUMERO   = la position du message dans la chronologie</pre>
<p>Attention à la <strong>syntaxe du nom</strong> : le séparateur <code>:</code> est <strong>obligatoire</strong>. Les formes admises sont les mêmes que pour une ligne de vie :</p>
<pre class="pseudo">e : Employe        # role nomme + type
: Employe          # role ANONYME, type precise
e :                # role nomme, type non precise
# Le : est TOUJOURS present. Ecrire "Employe" tout court est une faute.</pre>
<div class="warn">Ne confonds pas le <strong>lien</strong> et le <strong>message</strong>. Le lien est le trait : il dit que les deux objets <em>peuvent</em> se parler (c'est une instance d'association du diagramme de classes). Le message est la flèche posée le long du trait : il dit qu'ils <em>se parlent effectivement</em>, à ce moment-là du scénario. Un même lien peut porter plusieurs messages, dans les deux sens.</div>

<h3>3. La numérotation hiérarchique</h3>
<p>Le diagramme de communication n'a pas d'axe du temps : les rectangles sont posés n'importe où. La chronologie est donc portée <strong>entièrement par les numéros</strong>. C'est le point le plus important du chapitre.</p>
<p>La numérotation est <strong>hiérarchique</strong> : <code>1</code>, <code>1.1</code>, <code>1.2</code>, <code>2</code>… Le <strong>point</strong> marque l'<strong>imbrication</strong>. Le message <code>1.1</code> est envoyé <em>pendant le traitement</em> du message <code>1</code>.</p>
<pre class="pseudo">1       # premier message du scenario, envoye par l'acteur
1.1     # envoye PENDANT le traitement de 1
1.2     # envoye PENDANT le traitement de 1, apres 1.1
1.2.1   # envoye PENDANT le traitement de 1.2
1.3     # envoye PENDANT le traitement de 1, apres 1.2
2       # deuxieme message de premier niveau (traitement de 1 termine)

# Traduction en profondeur d'appel :
#   1     -&gt; niveau 1
#   1.1   -&gt; niveau 2 (appele PAR 1)
#   1.2.1 -&gt; niveau 3 (appele PAR 1.2, lui-meme appele PAR 1)</pre>
<div class="tip">Le lien avec le diagramme de séquence est direct : <strong>un point de plus dans le numéro = une barre d'activation de plus empilée</strong> dans le DSE. La profondeur du numéro <em>est</em> la profondeur d'imbrication des appels.</div>

<h3>4. Les lettres : la simultanéité</h3>
<p>Que faire quand deux messages partent <strong>en même temps</strong> ? On leur donne le <strong>même numéro</strong>, suivi d'une <strong>lettre</strong> différente.</p>
<pre class="pseudo">1.2a : envoyerConfirmation(membre)     # ces deux messages partent
1.2b : mettreAJourStatistiques()       # EN MEME TEMPS

# La lettre marque la SIMULTANEITE, pas un ordre alphabetique :
# 1.2a ne precede PAS 1.2b, ils sont concurrents.

# A comparer :
1.1 puis 1.2   -&gt; SEQUENTIEL : 1.2 attend la fin de 1.1
1.2a et 1.2b   -&gt; SIMULTANE  : ils partent ensemble</pre>
<p>C'est l'équivalent, en diagramme de communication, du fragment <code>par</code> que tu as vu hier — en beaucoup plus limité, comme on va le voir.</p>

<h3>5. La clause d'itération</h3>
<p>Pour exprimer qu'un message est <strong>répété</strong>, on préfixe sa description d'une <strong>clause d'itération</strong> : un <strong>astérisque</strong> suivi d'une condition entre crochets.</p>
<pre class="pseudo">*[condition] : nomDuMessage()

# Exemple a la ludotheque
1.2 *[pour chaque exemplaire] : verifier()

# Lecture : le message verifier() est envoye AUTANT DE FOIS
#          qu'il y a d'exemplaires a parcourir.

# Autres formes rencontrees
1.3 *[i := 1..10] : estDisponible()    # borne explicite
1.4 *  : notifier()                    # repetition, condition non precisee</pre>
<p>Une <strong>condition simple</strong>, sans astérisque, exprime un message conditionnel :</p>
<pre class="pseudo">1.4 [stock_location &gt; 0] : reserverExemplaire()
# Le message n'est envoye QUE SI la condition est vraie.</pre>

<h3>6. Ce que le diagramme de communication ne sait pas exprimer</h3>
<p>Voici le point qui décide, en pratique, du choix entre les deux diagrammes. Le diagramme de communication <strong>ne sait pas représenter les fragments combinés</strong> : ni <code>alt</code>, ni <code>opt</code>, ni <code>loop</code>, ni <code>par</code>, ni <code>break</code>, ni <code>critical</code>. Il n'a aucun cadre englobant, aucun opérateur.</p>
<pre class="pseudo"># Ce qu'il sait faire, tant bien que mal
Repetition   -&gt; clause d'iteration  *[condition]
Condition    -&gt; garde simple        [condition]
Simultaneite -&gt; lettres             1.2a / 1.2b

# Ce qu'il NE SAIT PAS faire
alt avec plusieurs branches   -&gt; IMPOSSIBLE a dessiner proprement
loop avec bornes min/max      -&gt; pas de syntaxe normative
break (rupture de scenario)   -&gt; aucun equivalent
critical (region atomique)    -&gt; aucun equivalent
ref (sous-interaction)        -&gt; aucun equivalent</pre>
<div class="warn"><strong>La conséquence pratique, à retenir absolument.</strong> Dès qu'un scénario comporte des <strong>choix multiples</strong>, des <strong>boucles bornées</strong> ou des <strong>ruptures</strong>, il faut passer au <strong>diagramme de séquence</strong>. Le diagramme de communication reste excellent pour un scénario <strong>simple et linéaire</strong> dont on veut montrer la <strong>topologie</strong> : qui parle à qui, quels objets sont au centre des échanges. C'est précisément pour cette limite que le DSE est, en pratique, bien plus utilisé que le DCO.</div>

<h3>7. Un écart de ton support d'école</h3>
<div class="warn"><strong>Attention à la syntaxe enseignée par le PAC.</strong> Le support de l'école présente une syntaxe de message comportant un <strong>préfixe « numéro du message précédent reçu »</strong>, du type :<br><br><code>1.2a.1.1 [si t &gt; 100] : lancer()</code><br><br>où la première partie (<code>1.2a</code>) désigne le message qui a déclenché celui-ci, et la seconde (<code>1.1</code>) le numéro du message lui-même. Cette forme existe bien, mais elle vient d'<strong>UML 1.x</strong> : ce n'est <strong>pas la syntaxe normative</strong> d'UML 2.5.1. La norme actuelle se contente de la <strong>numérotation hiérarchique</strong>, où l'imbrication est déjà portée par les points : le message <code>1.2.1</code> indique <em>par construction</em> qu'il a été déclenché pendant le traitement de <code>1.2</code>. Le préfixe est donc redondant.<br><br>Sache la <strong>lire</strong> si tu la rencontres dans ton examen ou dans un vieux document, mais <strong>écris la forme hiérarchique simple</strong> partout ailleurs.</div>
<pre class="pseudo"># La meme information, deux ecritures
Syntaxe de l'ecole (UML 1.x) :  1.2a.1.1 [si t &gt; 100] : lancer()
Syntaxe normative (UML 2.5.1):  1.2a.1   [t &gt; 100]    : lancer()

# Dans la forme normative, le "1.2a" en tete du numero indique DEJA
# que ce message est declenche pendant le traitement de 1.2a.
# Repeter le declencheur en prefixe n'apporte rien.</pre>
