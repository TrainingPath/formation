var DAY = {

  title: "Diagramme de séquence (1) : lignes de vie et messages",
  subtitle: "Qui appelle qui, dans quel ordre : la chronologie d'un scénario.",
  theory: `
<h3>1. Le diagramme qui raconte le temps</h3>
<p>Le <strong>diagramme de séquence</strong> (sigle <strong>DSE</strong> dans ton cours d'école) représente les <strong>interactions entre objets</strong> en insistant sur la <strong>chronologie</strong>. C'est un diagramme <strong>comportemental</strong> : il ne dit pas ce que le système <em>est</em>, mais ce qui se <em>passe</em>, message après message.</p>
<p>Sa règle de lecture tient en une phrase : <strong>le temps s'écoule du haut vers le bas</strong>. Un message dessiné plus bas qu'un autre se produit plus tard. Rien d'autre n'a de sens temporel : ni la largeur du dessin, ni l'ordre des colonnes de gauche à droite.</p>
<div class="tip">Le diagramme de classes te dit qu'un <code>Jeu</code> <em>sait</em> se louer. Le diagramme de séquence te dit <em>dans quel ordre</em> l'Employé, le service Ludothèque, le Jeu et l'Exemplaire se parlent pour qu'une location se produise réellement. Les deux sont complémentaires.</div>

<h3>2. La ligne de vie</h3>
<p>Chaque participant à l'interaction est représenté par une <strong>ligne de vie</strong> (<em>lifeline</em>) : un <strong>rectangle en haut</strong> portant le nom du participant, prolongé vers le bas par un <strong>trait vertical pointillé</strong>.</p>
<pre class="pseudo">   +--------------------+
   |  e : Employe       |   &lt;- le rectangle d'en-tete, nom SOULIGNE
   +--------------------+      (c'est un OBJET, pas une classe)
            :
            :                 &lt;- le trait vertical POINTILLE :
            :                    la duree de vie de l'objet
            :</pre>
<p>Le nom suit la forme <code>objet : Classe</code> et il est <strong>souligné</strong>, comme tout objet en UML. Les trois écritures suivantes sont admises :</p>
<pre class="pseudo">e : Employe     # objet nomme "e", de la classe Employe
: Employe       # objet ANONYME de la classe Employe
e               # objet nomme, classe non precisee</pre>
<div class="warn">Une ligne de vie représente <strong>un objet</strong>, pas une classe. Écrire <code>Employe</code> sans les deux-points et sans soulignement, c'est mélanger le diagramme de classes et le diagramme de séquence. Sur un DSE, on parle toujours d'instances.</div>

<h3>3. La barre d'activation</h3>
<p>Sur la ligne de vie, un <strong>rectangle fin et vertical</strong> montre les moments où l'objet est en train d'<strong>exécuter quelque chose</strong>. On l'appelle <strong>barre d'activation</strong>, ou <strong>occurrence d'exécution</strong> ; son nom normatif dans UML 2.5.1 est <code>ExecutionSpecification</code>.</p>
<pre class="pseudo">   +--------------------+
   |  sys : Ludotheque  |
   +--------------------+
            :
           +-+           &lt;- DEBUT de la barre : l'objet commence a travailler
           | |
           | |           &lt;- pendant toute cette hauteur, il est ACTIF
           | |
           +-+           &lt;- FIN de la barre : le traitement est termine
            :</pre>
<p>La barre commence quand l'objet reçoit un message et se termine quand il a fini de le traiter. Elle rend visible une information capitale : pendant qu'un objet attend la réponse d'un autre, sa propre barre reste <strong>ouverte</strong> — il est bloqué, pas disponible.</p>
<div class="warn"><strong>Écart avec ton cours d'école.</strong> Le support du PAC décrit les lignes de vie et les messages, mais ne <strong>nomme jamais</strong> la barre d'activation. Ce n'est pas une invention pour autant : c'est un élément parfaitement <strong>standard d'UML 2.5.1</strong>, présent sur tous les outils (StarUML, PlantUML, Visual Paradigm). Considère-le comme un <strong>complément standard</strong> à ton support : tu dois savoir le lire et le dessiner, même s'il n'apparaît pas dans le vocabulaire de tes notes.</div>

<h3>4. Le message synchrone</h3>
<p>Un <strong>message synchrone</strong> se dessine avec une <strong>flèche à pointe pleine</strong> (un petit <strong>triangle noir</strong>). Son sens est précis : l'émetteur <strong>attend</strong> que le destinataire ait fini avant de continuer. C'est l'appel de méthode classique.</p>
<pre class="pseudo">   e : Employe                    sys : Ludotheque
       :                                  :
      +-+   louer(client, jeu_id, 7)     +-+
      | |------------------------------&gt;| |   # pointe PLEINE = SYNCHRONE
      | |                                | |
      | |  &lt;-- e reste ACTIF mais BLOQUE | |   # sys travaille
      | |      il attend la reponse      | |
      +-+                                +-+</pre>
<p>Retiens l'image : synchrone = <strong>l'émetteur tient la ligne</strong>. Tant que la réponse n'arrive pas, il ne fait rien d'autre.</p>

<h3>5. Le message asynchrone</h3>
<p>Un <strong>message asynchrone</strong> se dessine avec une <strong>flèche à pointe ouverte</strong> — deux simples traits, sans triangle rempli. L'émetteur <strong>n'attend pas</strong> : il envoie et poursuit immédiatement son propre traitement.</p>
<pre class="pseudo">   sys : Ludotheque               n : Notificateur
       :                                  :
      +-+   envoyerMailConfirmation()     :
      | |- - - - - - -&gt;&gt; - - - - - - - -&gt;+-+   # pointe OUVERTE = ASYNCHRONE
      | |                                | |
      | |  &lt;-- sys CONTINUE tout de suite| |   # les deux travaillent EN MEME TEMPS
      | |      sans attendre le mail     | |
      +-+                                +-+

# ATTENTION : ici les pointilles ne servent qu'a dessiner la fleche en
# mode texte. Ce qui distingue l'asynchrone, c'est la POINTE OUVERTE,
# pas le trait. Un message asynchrone se trace en trait PLEIN.</pre>
<div class="tip">Choisis en te posant une seule question : <strong>l'émetteur a-t-il besoin de la réponse pour continuer ?</strong> Oui → synchrone (pointe pleine). Non → asynchrone (pointe ouverte). Encaisser une caution est synchrone ; envoyer un courriel de confirmation est asynchrone.</div>

<h3>6. Le message de retour</h3>
<p>La réponse à un message synchrone se note par une <strong>flèche pointillée à pointe ouverte</strong>, qui repart du destinataire vers l'émetteur.</p>
<pre class="pseudo">      +-+   verifier_stock()             +-+
      | |------------------------------&gt;| |   # appel : trait PLEIN, pointe pleine
      | |                                | |
      | |&lt;- - - - - - - - - - - - - - - -| |   # retour : trait POINTILLE,
      | |          true                  | |   #           pointe OUVERTE
      +-+                                +-+</pre>
<p>Point souvent mal compris : le message de retour est <strong>très souvent implicite</strong>, c'est-à-dire <strong>non dessiné</strong>. La <strong>fin de la barre d'activation</strong> du destinataire signifie déjà « j'ai fini, je te rends la main ». On ne trace le retour explicitement que lorsque la <strong>valeur renvoyée</strong> compte pour la compréhension du scénario.</p>
<div class="warn">Ne dessine pas systématiquement une flèche de retour après chaque message : un diagramme saturé de pointillés devient illisible. Trace le retour quand tu veux <strong>nommer la valeur</strong> (<code>location</code>, <code>true</code>, <code>liste_exemplaires</code>) ; laisse-le implicite le reste du temps.</div>

<h3>7. Création et destruction d'objets</h3>
<p>Tous les objets n'existent pas dès le début du scénario. Une <strong>Location</strong> n'existe qu'à partir du moment où on la crée.</p>
<pre class="pseudo">   sys : Ludotheque
       :
      +-+
      | |   &lt;&lt;create&gt;&gt;         +--------------------+
      | |--------------------&gt;|  l : Location      |  &lt;- la ligne de vie
      | |                      +--------------------+     COMMENCE ICI,
      | |                               :                 plus BAS que les autres
      | |                              +-+
      +-+                              +-+
       :                                :
      +-+   &lt;&lt;destroy&gt;&gt;                 :
      | |--------------------------&gt;    X    &lt;- la CROIX termine la ligne de vie
      +-+                                     (l'objet est detruit)</pre>
<p>Deux règles à retenir : la ligne de vie d'un objet créé pendant le scénario <strong>commence plus bas</strong> que les autres, à la hauteur du message <code>&lt;&lt;create&gt;&gt;</code> ; et une <strong>croix X</strong> termine la ligne de vie d'un objet détruit, à la hauteur du message <code>&lt;&lt;destroy&gt;&gt;</code>.</p>

<h3>8. L'auto-message</h3>
<p>Un objet peut s'envoyer un message à lui-même : c'est l'<strong>auto-message</strong>, ou <strong>message réflexif</strong>. La flèche part de la ligne de vie et y revient, en formant un petit crochet.</p>
<pre class="pseudo">   sys : Ludotheque
       :
      +-+
      | |---+  calculerMontant()
      | |   |                        # la fleche repart vers LA MEME ligne de vie
      | |&lt;--+
      | |
      | |  # souvent, une SECONDE barre d'activation s'empile sur la premiere
      +-+</pre>
<p>C'est ce qu'on utilise pour montrer un traitement <strong>interne</strong> à l'objet, typiquement l'appel d'une opération privée.</p>

<h3>9. Le cadre et le scénario</h3>
<p>Un diagramme de séquence complet s'inscrit dans un <strong>cadre rectangulaire</strong> dont le coin supérieur gauche porte un en-tête de la forme <strong><code>sd nomDuScenario</code></strong>. Les deux lettres <code>sd</code> signifient <em>sequence diagram</em>.</p>
<pre class="pseudo">+-----------------------------------------------------+
| sd louerUnJeu  \                                     |
+----------------+                                     |
|                                                      |
|   ... les lignes de vie et les messages ...          |
|                                                      |
+-----------------------------------------------------+</pre>
<div class="tip"><strong>La règle d'or :</strong> un diagramme de séquence documente <strong>un scénario</strong> d'un cas d'utilisation — pas tous les cas d'un coup. « Louer un jeu, stock disponible » est un scénario ; « louer un jeu, stock épuisé » en est un autre. Tu peux les regrouper (demain, avec les fragments combinés), mais le réflexe de base est : <strong>un scénario = un diagramme</strong>.</div>

<h3>10. Le scénario « louer un jeu » à la Ludothèque</h3>
<p>Voici le scénario nominal du service <code>louer(client, jeu_id, nb_jours=7)</code>, dessiné avec tout ce que tu viens d'apprendre.</p>
<pre class="pseudo"># sd louerUnJeu   -- le temps s'ecoule du HAUT vers le BAS

 e:Employe      sys:Ludotheque    m:Membre    j:Jeu     x:Exemplaire
    :                 :               :         :             :
   +-+ louer(client,  :               :         :             :
   | |  jeu_id, 7)   +-+              :         :             :
   | |--------------&gt;| |              :         :             :   # SYNCHRONE
   | |               | | verifierAdhesion()     :             :
   | |               | |-------------&gt;+-+       :             :
   | |               | |&lt;- - - - - - -+-+       :             :   # retour : true
   | |               | |              :         :             :
   | |               | | verifierStockLocation():             :
   | |               | |-----------------------&gt;+-+           :
   | |               | |&lt;- - - - - - - - - - - -+-+           :   # retour : 3
   | |               | |              :         :             :
   | |               | | reserverExemplaire()   :             :
   | |               | |---------------------------------&gt;   +-+
   | |               | |&lt;- - - - - - - - - - - - - - - - - -  +-+
   | |               | |              :         :             :
   | |               | |---+ encaisserCaution()  :            :   # AUTO-MESSAGE
   | |               | |&lt;--+           :         :            :
   | |               | |              :         :             :
   | |               | |  &lt;&lt;create&gt;&gt;   :        +-----------------+
   | |               | |------------------------|  l : Location   |
   | |               | |              :         +-----------------+
   | |               | | decrementerStockLocation()    :
   | |               | |-----------------------&gt;+-+           :
   | |&lt;- - - - - - - +-+              :         :             :   # retour : l
   +-+                :               :         :             :

# Lecture ligne a ligne :
#  1. l'Employe declenche le service (message SYNCHRONE : il attend)
#  2. le systeme verifie l'adhesion du Membre
#  3. il verifie le stock_location du Jeu
#  4. il reserve un Exemplaire disponible
#  5. il encaisse la caution (traitement INTERNE -&gt; auto-message)
#  6. il CREE la Location (&lt;&lt;create&gt;&gt; : ligne de vie qui commence plus bas)
#  7. il decremente stock_location
#  8. il retourne la Location a l'Employe</pre>
<p>Ce diagramme ne décrit qu'<strong>un</strong> scénario : celui où tout se passe bien. Que faire si <code>stock_location</code> vaut zéro et qu'il faut proposer une <strong>Réservation</strong> ? Il faudrait aujourd'hui un second diagramme. Demain, les <strong>fragments combinés</strong> te permettront de mettre les deux dans le même dessin.</p>`,
  exercises: [
    { type: "qcm", q: "Dans un diagramme de séquence, dans quel sens s'écoule le temps ?", opts: ["De haut en bas", "De gauche à droite", "De droite à gauche", "Dans le sens des numéros de message"], a: 0, exp: "La verticale porte le temps : un message dessiné plus bas se produit plus tard. L'ordre des colonnes, lui, n'a aucun sens temporel." },

  { id: "uml-j15", title: "Dessiner le scénario nominal de la location", level: 2,
    statement: "La Ludothèque expose le service <code>louer(client, jeu_id, nb_jours=7)</code>. Le scénario <strong>nominal</strong> (tout se passe bien) est le suivant : l'<strong>Employé</strong> déclenche le service ; le système vérifie l'<strong>adhésion</strong> du <strong>Membre</strong> ; il vérifie le <code>stock_location</code> du <strong>Jeu</strong> ; il réserve un <strong>Exemplaire</strong> disponible ; il encaisse la <code>caution</code> (traitement interne) ; il crée la <strong>Location</strong> avec sa <code>date_debut</code> et sa <code>date_fin</code> ; il décrémente le <code>stock_location</code> ; il renvoie la Location à l'Employé. En fin de traitement, un courriel de confirmation part vers le Membre <strong>sans que le système attende quoi que ce soit</strong>.<br><br><strong>Produis le diagramme de séquence</strong> en syntaxe PlantUML : lignes de vie nommées <code>objet : Classe</code>, messages synchrones et asynchrones correctement distingués, auto-message pour le traitement interne, création de la Location, et retour explicite là où la valeur compte.",
    hints: [
      "Commence par lister les participants et par les placer de gauche à droite dans l'ordre où ils entrent en scène : l'Employé, le service Ludothèque, puis le Membre, le Jeu, l'Exemplaire, et enfin la Location qui n'existe pas encore au début.",
      "Pour chaque message, pose-toi la question du blocage : l'émetteur a-t-il besoin de la réponse pour continuer ? Si oui, c'est une flèche à pointe pleine (en PlantUML : -&gt;). Si non, c'est une pointe ouverte (en PlantUML : -&gt;&gt;). Le courriel de confirmation est le seul message où la réponse n'intéresse personne.",
      "Encaisser la caution ne fait sortir aucun message du système : c'est un traitement interne, donc un auto-message, qui part de la ligne de vie du système et y revient. En PlantUML, il suffit d'écrire l'expéditeur et le destinataire identiques."
    ],
    checklist: [
      "Chaque participant est déclaré comme un objet sous la forme objet : Classe (avec les deux-points), et non sous le seul nom d'une classe.",
      "Au moins un message est explicitement asynchrone (pointe ouverte) et il correspond bien au courriel de confirmation, tous les autres appels métier étant synchrones (pointe pleine).",
      "L'encaissement de la caution est dessiné comme un auto-message : l'expéditeur et le destinataire sont la même ligne de vie (le service Ludothèque).",
      "La ligne de vie de la Location est créée en cours de scénario (mot-clé create / stéréotype de création) et non présente dès le haut du diagramme."
    ],
    solution: "@startuml\n' ------------------------------------------------------------\n' Diagramme de sequence : scenario NOMINAL de la location\n' Cadre : sd louerUnJeu   -- le temps s'ecoule du HAUT vers le BAS\n' ------------------------------------------------------------\ntitle sd louerUnJeu\n\n' --- Les participants (lignes de vie) ---\n' Un acteur pour l'Employe : c'est lui qui declenche le scenario\nactor \"e : Employe\" as E\n' Le service metier du site, point d'entree de toute la logique\nparticipant \"sys : Ludotheque\" as S\n' Les objets metier manipules pendant le scenario\nparticipant \"m : Membre\" as M\nparticipant \"j : Jeu\" as J\nparticipant \"x : Exemplaire\" as X\n' n : Notificateur sert a l'envoi asynchrone du courriel\nparticipant \"n : Notificateur\" as N\n\n' --- 1. Declenchement, message SYNCHRONE ---\n' Fleche a pointe PLEINE (-> en PlantUML) : l'Employe ATTEND\n' le resultat avant de pouvoir continuer a servir le client.\nE -> S : louer(client, jeu_id, 7)\n' activate ouvre la BARRE D'ACTIVATION du service : il travaille\nactivate S\n\n' --- 2. Verification de l'adhesion du Membre ---\nS -> M : verifierAdhesion()\nactivate M\n' Retour EXPLICITE (--> = trait pointille, pointe ouverte) :\n' on le trace ici parce que la valeur renvoyee decide de la suite.\nM --> S : true\ndeactivate M\n\n' --- 3. Verification du stock de location du Jeu ---\nS -> J : verifierStockLocation()\nactivate J\nJ --> S : stock_location = 3\ndeactivate J\n\n' --- 4. Reservation d'un exemplaire disponible ---\nS -> X : reserverExemplaire()\nactivate X\nX --> S : x\ndeactivate X\n\n' --- 5. Encaissement de la caution : AUTO-MESSAGE ---\n' Expediteur = destinataire : le traitement est INTERNE au service,\n' aucun autre objet n'est sollicite.\nS -> S : encaisserCaution(caution)\n\n' --- 6. CREATION de la Location ---\n' create fait COMMENCER la ligne de vie plus BAS que les autres :\n' l'objet Location n'existait pas au debut du scenario.\ncreate \"l : Location\" as L\nS -> L : <<create>>(date_debut, date_fin, caution)\n\n' --- 7. Decrementation du stock ---\nS -> J : decrementerStockLocation()\n\n' --- 8. Courriel de confirmation : message ASYNCHRONE ---\n' Fleche a pointe OUVERTE (->> en PlantUML) : le service n'attend\n' PAS l'envoi du mail pour rendre la main a l'Employe.\nS ->> N : envoyerConfirmation(m)\n\n' --- 9. Retour du service vers l'Employe ---\n' Trait pointille, pointe ouverte : on nomme la valeur rendue.\nS --> E : location\ndeactivate S\n\n@enduml\n\n' --- Justification des choix ---\n' Lignes de vie nommees \"objet : Classe\" : un DSE manipule des\n'   INSTANCES, jamais des classes. Le nom est souligne sur un\n'   dessin normatif.\n' Messages synchrones (pointe pleine) : verifierAdhesion,\n'   verifierStockLocation, reserverExemplaire et decrementer...\n'   bloquent l'appelant, qui a besoin du resultat pour continuer.\n' Message asynchrone (pointe ouverte) : envoyerConfirmation ne\n'   conditionne rien ; si le mail part avec 3 secondes de retard,\n'   la location est valide quand meme.\n' Auto-message : encaisserCaution() ne sort pas du service, donc\n'   la fleche repart vers la MEME ligne de vie.\n' create : la Location naissant pendant le scenario, sa ligne de\n'   vie commence a la hauteur du message de creation.\n' Retours en pointilles : traces uniquement quand la valeur compte\n'   (true, stock_location, location). Ailleurs, la fin de la barre\n'   d'activation suffit : le retour reste IMPLICITE.\n' Ce diagramme ne couvre QUE le scenario nominal. Le cas\n'   stock_location = 0 -> proposer une Reservation demande un\n'   second diagramme... ou un fragment combine alt (jour 16).",
    note: "Plusieurs variantes sont acceptables : tu peux nommer les objets autrement, fusionner Membre et Jeu en un seul participant, ou tracer plus ou moins de retours. Ce qui est évalué : des lignes de vie qui désignent des objets, la distinction correcte synchrone / asynchrone, l'auto-message pour le traitement interne, et la création de la Location en cours de scénario." }
  ]
