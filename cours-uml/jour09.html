<h3>1. Le problème du jour</h3>
<p>Hier, tu as appris à dessiner une classe : un rectangle à trois compartiments, un nom, des attributs typés, des opérations, des visibilités. Tu sais donc écrire <code>Jeu</code>, <code>Exemplaire</code>, <code>Membre</code>, <code>Categorie</code>. Mais si tu poses ces quatre rectangles côte à côte sur une feuille, tu n'as pas encore un modèle : tu as un <strong>sac de classes</strong>.</p>
<p>Ce qui fait le modèle, ce sont les <strong>liens</strong>. Un <code>Exemplaire</code> ne flotte pas dans le vide : il est l'exemplaire d'<em>un</em> <code>Jeu</code>. Un <code>Jeu</code> appartient à <em>une</em> <code>Categorie</code>. Un <code>Membre</code> loue <em>plusieurs</em> <code>Exemplaire</code>. Aujourd'hui, on apprend à écrire exactement ces trois phrases en UML — et surtout à ne pas se tromper de côté quand on écrit les nombres.</p>
<pre class="pseudo"># CONVENTIONS DE DESSIN utilisees dans cette lecon

#  grand triangle CREUX de l'heritage : celui-la, c'est demain)</pre>

<h3>2. L'association : un trait plein, et c'est tout</h3>
<p>Une <strong>association</strong> est une relation structurelle entre deux classes. Elle signifie : « les objets de A et les objets de B sont durablement liés ». On la dessine avec un <strong>trait plein</strong>, sans fioriture.</p>
<pre class="pseudo">   +------------------+                    +------------------+
   |    Categorie     |                    |       Jeu        |
   +------------------+                    +------------------+
   | - nom : String   |--------------------| - titre : String |
   +------------------+                    +------------------+
# Voila. Un trait plein. C'est deja une association valide.
# Mais elle ne dit ni COMBIEN, ni DANS QUEL SENS, ni POURQUOI.
# Les trois sections suivantes ajoutent ces informations.</pre>
<div class="tip">Retiens la hiérarchie des symboles : le <strong>trait plein nu</strong> est l'association de base. Tout ce que tu ajouteras cette semaine — flèches, losanges, triangles, pointillés — n'est qu'une <strong>décoration</strong> posée sur ce trait, qui en précise le sens.</div>

<h3>3. Le nom de l'association et son sens de lecture</h3>
<p>On peut <strong>nommer</strong> une association, au milieu du trait. Le nom est en général un <strong>verbe</strong> : <em>regroupe</em>, <em>loue</em>, <em>édite</em>. Mais un verbe pose aussitôt une question : dans quel sens le lit-on ? « Catégorie regroupe Jeu » ou « Jeu regroupe Catégorie » ?</p>
<p>UML répond avec un <strong>petit triangle plein</strong> collé au nom, qui indique le <strong>sens de lecture</strong>.</p>
<pre class="pseudo">   +------------------+                    +------------------+
   |    Categorie     |                    |       Jeu        |
   +------------------+                    +------------------+
   | - nom : String   |--------------------| - titre : String |
   +------------------+     regroupe ▶     +------------------+
# Le triangle pointe vers Jeu -&gt; on lit de gauche a droite :
#     "une Categorie REGROUPE des Jeu"
# Si le triangle pointait vers Categorie (◀), on lirait :
#     "un Jeu REGROUPE des Categorie"  -- ce qui serait absurde ici.</pre>
<div class="warn">Le triangle du sens de lecture est <strong>purement documentaire</strong> : il aide l'humain à lire la phrase, il n'ajoute aucune contrainte au modèle. Ne le confonds jamais avec la <strong>flèche de navigabilité</strong> (section 6), qui, elle, est une vraie information de conception.</div>

<h3>4. Les rôles : qui est quoi pour qui</h3>
<p>Un <strong>rôle</strong> est un nom écrit à une <strong>extrémité</strong> de l'association. Il indique le <strong>rôle tenu par la classe</strong> de ce côté vis-à-vis de l'association. C'est souvent plus parlant qu'un nom d'association, et c'est ce qui deviendra le nom de l'attribut quand tu passeras au code.</p>
<pre class="pseudo">   +------------------+                          +------------------+
   |      Membre      | emprunteur      emprunte |    Exemplaire    |
   +------------------+                          +------------------+
   | - nom : String   |--------------------------| - numero : String|
   +------------------+ 0..*                0..* +------------------+
# Le role "emprunteur" est ecrit DU COTE DE MEMBRE :
#     c'est le role que joue le MEMBRE dans cette association.
# Le role "emprunte" est ecrit DU COTE D'EXEMPLAIRE.
#
# Au codage, le role devient le nom de la collection generee :
#     Membre.emprunte     -&gt; les Exemplaire de ce Membre
#     Exemplaire.emprunteur -&gt; les Membre de cet Exemplaire</pre>
<div class="tip">Nom d'association ou rôles ? Les deux sont facultatifs, mais un diagramme lisible en a <strong>au moins un des deux</strong> sur chaque association. Le nom raconte l'association, les rôles racontent les extrémités. Quand tu hésites, mets des rôles : ils survivent au passage au code.</div>

<h3>5. Les multiplicités — et le piège numéro un</h3>
<p>La <strong>multiplicité</strong> indique <strong>combien d'objets</strong> peuvent participer à l'association de ce côté. Elle s'écrit à chaque extrémité. Voici tous les formats normalisés :</p>
<pre class="pseudo">0..1   # zero ou un (facultatif, au plus un)
1      # exactement un (equivaut a 1..1)
0..*   # zero ou plusieurs (s'ecrit aussi simplement *)
1..*   # au moins un
2..10  # entre 2 et 10 (bornes libres)
1,3    # exactement 1 OU exactement 3 (valeurs ENUMEREES,
       #   surtout pas "entre 1 et 3" : ce serait 1..3)</pre>
<p>Maintenant, la règle qui fait échouer la moitié d'une classe en évaluation. <strong>La multiplicité se lit à l'extrémité OPPOSÉE.</strong> Le nombre collé à la classe B ne décrit pas B : il dit <strong>combien de B pour un A</strong>.</p>
<pre class="pseudo"># LE PIEGE NUMERO UN
   +-------------+                            +-------------+
   |  Categorie  | 1                     0..* |     Jeu     |
   +-------------+----------------------------+-------------+

# Le 0..* est colle a Jeu   -&gt; il COMPTE des Jeu
#     "une Categorie regroupe 0..* Jeu"
# Le 1 est colle a Categorie -&gt; il COMPTE des Categorie
#     "un Jeu appartient a exactement 1 Categorie"
#
# METHODE INFAILLIBLE, en trois temps :
#   1. pose ton doigt sur le nombre
#   2. lis la classe qu'il TOUCHE  -&gt; c'est ce qu'on compte
#   3. pars de la classe d'EN FACE -&gt; c'est le point de vue
#   Resultat : "un [classe d'en face] a [nombre] [classe touchee]"</pre>
<div class="warn">Si tu viens de Merise, c'est <strong>l'inverse</strong> de ce que tu as appris. En Merise, la cardinalité <code>1,1</code> écrite près de JEU décrit ce que fait <em>un jeu</em>. En UML, le <code>1</code> écrit près de <code>Categorie</code> compte <em>les catégories</em>. Le nombre est du côté de ce qu'on <strong>compte</strong>, pas de ce qu'on <strong>décrit</strong>. Relis cette phrase autant de fois qu'il le faudra : c'est la première erreur corrigée dans toutes les copies.</div>

<h3>6. La navigabilité : dans quel sens peut-on circuler ?</h3>
<p>La <strong>navigabilité</strong> répond à une question de conception : <em>depuis un objet de A, puis-je atteindre directement les objets de B liés ?</em> Elle se note avec une <strong>flèche ouverte</strong> (une simple pointe en V, sans triangle fermé).</p>
<pre class="pseudo"># 1) NAVIGABLE DANS UN SEUL SENS : fleche ouverte a l'arrivee
   +-------------+                            +-------------+
   |     Avis    |---------------------------&gt;|     Jeu     |
   +-------------+                            +-------------+
# "Depuis un Avis, j'atteins son Jeu."
# "Depuis un Jeu, je n'ai pas de chemin direct vers ses Avis."
# Au code : la classe Avis aura un attribut jeu ; la classe Jeu
#           n'aura PAS de collection avis.

# 2) BIDIRECTIONNELLE : habituellement AUCUNE fleche
   +-------------+                            +-------------+
   |    Membre   |----------------------------|  Exemplaire |
   +-------------+                            +-------------+
# Les deux extremites sont navigables. La convention UML est de
# ne rien dessiner : un trait nu = on circule dans les deux sens.

# 3) NON NAVIGABLE : une CROIX (notation UML 2, OPTIONNELLE)
   +-------------+                            +-------------+
   |     Avis    |------X--------------------&gt;|     Jeu     |
   +-------------+                            +-------------+
# La croix cote Avis dit EXPLICITEMENT : depuis Jeu, aucun chemin
# vers Avis. C'est le meme sens que le cas 1, mais ecrit noir sur
# blanc au lieu d'etre sous-entendu par l'absence de fleche.</pre>
<div class="tip">Pourquoi limiter la navigabilité ? Parce qu'un lien bidirectionnel coûte cher : il faut maintenir les deux côtés cohérents en permanence. Si l'application n'a jamais besoin d'afficher « les avis d'un jeu » depuis le jeu lui-même, la flèche à sens unique évite du code inutile et des bugs de synchronisation.</div>

<h3>7. La classe-association : quand l'association a ses propres données</h3>
<p>Un <code>Membre</code> loue un <code>Exemplaire</code>. Où mets-tu la <code>date_debut</code> ? Sur <code>Membre</code> ? Non : un membre a plusieurs locations, à des dates différentes. Sur <code>Exemplaire</code> ? Non plus, pour la même raison. Cette date n'appartient ni à l'un ni à l'autre : elle appartient au <strong>couple</strong>, c'est-à-dire à l'association elle-même.</p>
<p>UML fournit exactement l'outil : la <strong>classe-association</strong>. C'est une classe reliée à l'association par un <strong>trait pointillé</strong>.</p>
<pre class="pseudo">   +------------------+                    +------------------+
   |      Membre      | 0..*        0..*   |    Exemplaire    |
   +------------------+--------------------+------------------+
   | - nom : String   |         .          | - numero : String|
   +------------------+         .          +------------------+
                                .   &lt;- TRAIT POINTILLE
                       +--------.---------+
                       |     Location     |
                       +------------------+
                       | - date_debut     |
                       | - date_fin       |
                       | - caution        |
                       +------------------+
                       | + prolonger()    |
                       +------------------+
# La classe-association est A LA FOIS une association (elle relie
# Membre et Exemplaire) ET une classe (elle a des attributs et
# des operations). D'ou le trait pointille : il ne relie pas deux
# classes, il rattache une classe A UNE ASSOCIATION.</pre>
<div class="tip">Le réflexe qui ne trompe pas : dès que tu écris une association <code>0..*</code> des deux côtés et que tu te demandes « mais où je mets cette date ? », la réponse est <strong>classe-association</strong>. C'est aussi ce que Merise appelait une « association porteuse de données ».</div>

<h3>8. L'association n-aire : au-delà de deux classes</h3>
<p>La plupart des associations relient <strong>deux</strong> classes : on les dit <em>binaires</em>. UML autorise aussi des associations de <strong>dimension supérieure à 2</strong>, dites <strong>n-aires</strong>. On les dessine avec un <strong>grand losange</strong> auquel toutes les classes participantes sont reliées.</p>
<pre class="pseudo"># ASSOCIATION TERNAIRE : "l'Employe E a loue l'Exemplaire X
#                          au Membre M"
   +-------------+               /\               +-------------+
   |    Membre   |--------------+  +--------------|  Exemplaire |
   +-------------+               \/               +-------------+
                                  |...............
                                  |              .
                          +-------+------+  +----.----------+
                          |    Employe   |  |    Location   |
                          +--------------+  | - date_debut  |
                                            | - date_fin    |
                                            +---------------+
# Les TROIS classes participent a UNE SEULE association.
# La classe-association Location s'accroche AU LOSANGE par un
# trait POINTILLE, exactement comme dans le cas binaire.</pre>
<div class="warn">Les associations n-aires sont <strong>rares et difficiles à lire</strong>. Avant d'en dessiner une, demande-toi si tu ne peux pas la remplacer par une classe ordinaire reliée aux trois autres par trois associations binaires — c'est presque toujours plus clair, et c'est de toute façon ce que tu devras faire au moment de coder ou de créer les tables.</div>

<h3>9. L'association réflexive : une classe reliée à elle-même</h3>
<p>Rien n'interdit qu'une association relie une classe <strong>à elle-même</strong>. On parle d'<strong>association réflexive</strong>. Le trait part de la classe et y revient. Comme les deux extrémités portent le même nom de classe, les <strong>rôles deviennent obligatoires</strong> pour distinguer les deux bouts.</p>
<pre class="pseudo"># Le parrainage entre Membres de la ludotheque
                          parraine ▶
                    +---------------------+
                    |                     |
           parrain  |                     |  filleul
             0..1   |                     |   0..*
                 +--+---------------------+--+
                 |          Membre           |
                 +---------------------------+
# Lecture : "un Membre a 0..1 parrain" et "un Membre a 0..* filleuls".
# Sans les roles, ce dessin serait illisible : on ne saurait pas
# lequel des deux nombres compte les parrains.</pre>

<h3>10. L'association qualifiée : accéder par une clé</h3>
<p>Un <code>Jeu</code> possède <code>0..*</code> <code>Exemplaire</code>. Pour retrouver un exemplaire précis, il faut parcourir toute la collection. Mais si chaque exemplaire porte un <code>numero</code> unique <em>au sein de son jeu</em>, alors le couple (jeu, numéro) désigne <strong>au plus un</strong> exemplaire. UML permet de l'écrire : c'est le <strong>qualifieur</strong>, un <strong>petit rectangle accolé à la classe source</strong>.</p>
<pre class="pseudo"># SANS qualifieur
   +-------------+                            +-------------+
   |     Jeu     | 1                     0..* |  Exemplaire |
   +-------------+----------------------------+-------------+
#   "un Jeu a 0..* Exemplaire" -&gt; pour en trouver un, on parcourt.

# AVEC qualifieur
   +-------------+---------+                  +-------------+
   |     Jeu     | numero  | 1           0..1 |  Exemplaire |
   +-------------+---------+------------------+-------------+
#   Le petit rectangle "numero" est ACCOLE a la classe source.
#   Il ne FAIT PAS PARTIE de l'association : c'est une CLE d'acces.
#   Effet : pour un Jeu ET un numero donnes, il y a AU PLUS UN
#   Exemplaire -&gt; la multiplicite passe de 0..* a 0..1.</pre>
<div class="tip">Le qualifieur est le cousin UML de la clé d'un dictionnaire (ou d'un <code>Map</code> en Java, d'un <code>dict</code> en Python). Écrire <code>jeu.exemplaires[numero]</code> plutôt que de boucler : voilà exactement l'information que le qualifieur transmet au développeur.</div>

<h3>11. La dépendance : le lien faible</h3>
<p>Toutes les relations ne sont pas des associations. Parfois, une classe <strong>a simplement besoin</strong> d'une autre, sans la stocker : elle la reçoit en paramètre, l'utilise dans le corps d'une méthode, ou renvoie un objet de ce type. C'est une <strong>dépendance</strong>, notée par une <strong>flèche pointillée à pointe ouverte</strong>.</p>
<pre class="pseudo">   +------------------+                       +------------------+
   |     Location     |- - - - - - - - - - - &gt;|   CalculTarif    |
   +------------------+                       +------------------+
   | + montant()      |                       | + tarif(j : int) |
   +------------------+                       +------------------+
# "Location A BESOIN DE CalculTarif."
# Mais Location ne STOCKE aucun CalculTarif : il n'y a pas
# d'attribut, pas de lien durable entre les objets.
# -&gt; ce n'est PAS une association, c'est une DEPENDANCE.

# Le test : si tu supprimes la classe cible, la classe source
# compile-t-elle encore ? Non -&gt; il y a bien dependance.
# Les objets sont-ils lies DANS LA DUREE ? Non -&gt; pas d'association.</pre>

<h3>12. Les contraintes entre accolades</h3>
<p>UML permet d'ajouter des <strong>contraintes</strong> sur une extrémité d'association, écrites <strong>entre accolades</strong>. Les quatre normatives que tu dois connaître :</p>
<pre class="pseudo">{ordered}     # les objets de la collection sont ORDONNES
              #   (les Avis d'un Jeu, du plus recent au plus ancien)
{unique}      # pas de doublon dans la collection
              #   (un Membre n'apparait qu'une fois dans la liste)
{readOnly}    # l'extremite ne peut plus etre modifiee apres
              #   la creation du lien
{subsets r}   # cette extremite est un SOUS-ENSEMBLE du role r
              #   (les exemplaires_reserves sont un sous-ensemble
              #    des exemplaires)

# Ou on les ecrit :
   +-------------+                                    +-------------+
   |     Jeu     | 1                0..* {ordered}    |     Avis    |
   +-------------+------------------------------------+-------------+
# La contrainte est collee A L'EXTREMITE qu'elle concerne,
# juste apres la multiplicite.</pre>
<div class="warn"><strong>Écart avec ton support d'école.</strong> Les contraintes UML sont normalisées <strong>en anglais</strong> : <code>{ordered}</code>, <code>{unique}</code>, <code>{readOnly}</code>, <code>{subsets ...}</code>. Le support du PAC les écrit <strong>traduites en français</strong> — tu y croiseras <code>{interdit}</code> ou <code>{ajout seul}</code>. Ces formes n'existent pas dans la norme. En examen d'école, écris ce que ton cours enseigne ; partout ailleurs (outil, entretien, documentation), écris les mots-clés anglais, ce sont les seuls qu'un lecteur ou un générateur de code reconnaîtra.</div>

    solution: "# DIAGRAMME DE CLASSES DE LA LUDOTHEQUE — LES ASSOCIATIONS\n# Code PlantUML : colle-le sur plantuml.com pour voir le dessin.\n\n@startuml\n\n' ==============================================================\n' 1. LES CLASSES (version allegee du jour 8)\n' ==============================================================\nclass Categorie {\n  - nom : String\n}\n\nclass Editeur {\n  - nom : String\n  - pays : String\n}\n\nclass Jeu {\n  - titre : String\n  - prix_location : double\n  - prix_vente : double\n  - stock_location : int\n  - stock_vente : int\n  + estDisponible() : boolean\n}\n\nclass Exemplaire {\n  - numero : String\n  - etat : String\n}\n\nclass Membre {\n  - nom : String\n  - dateAdhesion : Date\n}\n\nclass Avis {\n  - note : int\n  - commentaire : String\n  - date : Date\n}\n\n' La CLASSE-ASSOCIATION : elle porte les donnees du COUPLE\n' (Membre, Exemplaire), et d'aucune des deux classes seules.\nclass Location {\n  - date_debut : Date\n  - date_fin : Date\n  - caution : double\n  + prolonger(jours : int) : void\n}\n\n' ==============================================================\n' 2. LES ASSOCIATIONS BINAIRES\n'    \"1\" et \"0..*\" sont les MULTIPLICITES.\n'    Le \">\" final du libelle dessine le petit triangle PLEIN\n'    du SENS DE LECTURE.\n'    Rappel de la regle : le nombre est du cote de ce qu'on COMPTE.\n' ==============================================================\n\n' \"une Categorie regroupe 0..* Jeu\"  (0..* est colle a Jeu)\n' \"un Jeu appartient a 1 Categorie\"  (1 est colle a Categorie)\nCategorie \"1\" -- \"0..*\" Jeu : regroupe >\n\n' \"un Editeur edite 0..* Jeu\" / \"un Jeu a 1 Editeur\"\nEditeur \"1\" -- \"0..*\" Jeu : edite >\n\n' \"un Jeu possede AU MOINS UN Exemplaire\" -> 1..*, pas 0..*\nJeu \"1\" -- \"1..*\" Exemplaire : possede >\n\n' ==============================================================\n' 3. LA CLASSE-ASSOCIATION\n'    Membre et Exemplaire sont en 0..* / 0..* : la date de debut\n'    n'appartient ni a l'un ni a l'autre, mais au COUPLE.\n'    (A, B) .. C rattache C a l'association A-B par le trait\n'    POINTILLE d'UML.\n' ==============================================================\nMembre \"0..*\" -- \"0..*\" Exemplaire : loue >\n(Membre, Exemplaire) .. Location\n\n' ==============================================================\n' 4. LA NAVIGABILITE\n'    \"-->\" = fleche OUVERTE = navigable dans CE sens seulement.\n'    Depuis un Avis j'atteins son Jeu ; depuis un Jeu, il n'y a\n'    pas de chemin direct vers ses Avis.\n' ==============================================================\nAvis \"0..*\" --> \"1\" Jeu : porte sur >\n\n' Celle-ci reste bidirectionnelle : trait nu, aucune fleche.\nMembre \"1\" -- \"0..*\" Avis : redige >\n\n' ==============================================================\n' 5. L'ASSOCIATION REFLEXIVE\n'    La meme classe aux deux bouts. Sans ROLES, le dessin serait\n'    illisible : on ne saurait pas quel nombre compte quoi.\n' ==============================================================\nMembre \"0..1 parrain\" -- \"0..* filleul\" Membre : parraine >\n\n' ==============================================================\n' 6. UNE CONTRAINTE UML\n'    Les mots-cles normalises sont en ANGLAIS : {ordered},\n'    {unique}, {readOnly}, {subsets ...}. On les colle a\n'    l'extremite concernee, juste apres la multiplicite.\n' ==============================================================\nJeu \"1\" -- \"0..* {ordered}\" Avis : recoit >\n\n@enduml\n\n# ==============================================================\n# CE QUE PLANTUML NE SAIT PAS DESSINER — a faire a la main\n# ==============================================================\n\n# L'ASSOCIATION QUALIFIEE\n#   +-------------+---------+                  +-------------+\n#   |     Jeu     | numero  | 1           0..1 |  Exemplaire |\n#   +-------------+---------+------------------+-------------+\n#   Le petit rectangle \"numero\" est ACCOLE a la classe source.\n#   Il ne FAIT PAS PARTIE de l'association : c'est une CLE\n#   d'acces. Effet : pour un Jeu ET un numero donnes, il y a\n#   AU PLUS UN Exemplaire -> la multiplicite passe de 0..* a 0..1.\n#   C'est le jeu.exemplaires[numero] du developpeur.\n\n# LA NON-NAVIGABILITE (croix, notation UML 2, optionnelle)\n#   Avis  ------X--------------------->  Jeu\n#   La croix cote Avis dit EXPLICITEMENT : depuis Jeu, aucun\n#   chemin vers Avis. Meme sens que la fleche seule, mais ecrit\n#   noir sur blanc au lieu d'etre sous-entendu.\n\n# L'ASSOCIATION N-AIRE (grand losange)\n#   +-------------+          /\\          +-------------+\n#   |    Membre   |---------+  +---------|  Exemplaire |\n#   +-------------+          \\/          +-------------+\n#                             |..........\n#                             |         .\n#                      +------+-----+ +-.------------+\n#                      |   Employe  | |   Location   |\n#                      +------------+ +--------------+\n#   Les TROIS classes participent a UNE SEULE association.\n#   La classe-association s'accroche AU LOSANGE, en pointille.\n#   A n'utiliser qu'en dernier recours : trois associations\n#   binaires autour d'une classe Location ordinaire sont\n#   presque toujours plus lisibles.",
