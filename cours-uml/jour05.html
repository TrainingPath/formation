  title: "Diagramme d'activités (1) : actions et flot de contrôle",
  subtitle: "Décrire un processus métier étape par étape, avec ses choix.",
  theory: `
<h3>1. À quoi sert vraiment un diagramme d'activités</h3>
<p>Le diagramme de cas d'utilisation te disait <em>quoi</em> : « le membre loue un jeu ». Il ne disait pas <em>comment</em>. Le <strong>diagramme d'activités</strong> répond à cette deuxième question : il décrit le <strong>comportement interne des opérations ou des cas d'utilisation</strong>, en mettant l'accent sur les <strong>flots de contrôle</strong> et les <strong>flots de données</strong>.</p>
<p>Concrètement, tu l'utilises quand tu veux montrer un <strong>processus métier</strong> du début à la fin : vérifier l'adhésion, contrôler le stock, encaisser, enregistrer. Un enchaînement d'étapes, avec des choix en cours de route.</p>
<pre class="pseudo"># Trois usages typiques du diagramme d'activites
Detailler un cas d'utilisation  -> "louer un jeu", etape par etape
Detailler une operation         -> le corps de la methode louer()
Decrire un processus metier     -> l'ouverture de la ludotheque le matin</pre>
<div class="tip">Retiens la formule du cours : le diagramme d'activités se concentre sur les <strong>flots de contrôle et de données</strong>. Le mot « flot » est le mot-clé de toute la journée : quelque chose <em>circule</em> d'une action à la suivante.</div>

<h3>2. Ne le confonds pas avec la machine à états</h3>
<p>C'est la confusion numéro un, et elle est facile à lever avec une seule question : <strong>de quoi parle le diagramme ?</strong></p>
<pre class="pseudo">Machine a etats      -> le cycle de vie d'UNE classe, d'UN objet
                        (les etats successifs d'un Exemplaire :
                         Disponible, Loue, En reparation, Retire)

Diagramme d'activites-> un PROCESSUS qui traverse plusieurs objets,
                        plusieurs acteurs, plusieurs classes
                        (louer un jeu : Membre + Employe + Location
                         + Exemplaire + stock_location)</pre>
<p>Une machine à états est <strong>centrée objet</strong> : elle appartient à une classe. Un diagramme d'activités est <strong>centré processus</strong> : il ne se rattache à aucune classe en particulier.</p>

<h3>3. L'action : la brique de base</h3>
<p>Une <strong>action</strong> est un <strong>traitement qui fait évoluer le système</strong>. C'est l'unité élémentaire du diagramme : elle ne se décompose pas plus finement à ce niveau de lecture.</p>
<p>Graphiquement, une action se dessine par un <strong>rectangle aux coins arrondis</strong>, avec son nom à l'intérieur. On la nomme avec un <strong>verbe à l'infinitif</strong> suivi de son complément.</p>
<pre class="pseudo"># Une action, en notation texte
   .-----------------------------.
  (  Verifier l'adhesion du membre )
   '-----------------------------'
   # rectangle a COINS ARRONDIS

# Bien nommer une action : un VERBE + un COMPLEMENT
Bon   : "Verifier stock_location"
Bon   : "Encaisser la caution"
Bon   : "Enregistrer la Location"
Mauvais : "Stock"          # ce n'est pas un traitement, c'est une donnee
Mauvais : "Le membre paie" # une phrase, pas une action nommee</pre>

<h3>4. La transition est automatique : il n'y a pas d'événement</h3>
<p>Voici le point le plus important de la journée, et la <strong>différence clé</strong> avec la machine à états. Dans un diagramme d'activités, dès qu'une action <strong>s'achève</strong>, le passage à la suivante se fait <strong>automatiquement</strong>. Il n'y a <strong>aucun événement associé</strong> à ce passage.</p>
<pre class="pseudo"># Machine a etats : la transition PORTE un evenement
   [Disponible] --- louer(membre) ---> [Loue]
   # rien ne bouge tant que l'evenement louer() n'arrive pas

# Diagramme d'activites : la transition est AUTOMATIQUE
   ( Encaisser la caution ) -----> ( Enregistrer la Location )
   # des que "Encaisser la caution" est terminee, on passe a la suite
   # aucun evenement n'est ecrit sur la fleche</pre>
<div class="warn">Si tu écris un nom d'événement sur une flèche de diagramme d'activités, c'est presque toujours le signe que tu étais en train de dessiner une machine à états sans le savoir. La seule chose qu'on peut écrire sur un arc d'activité, c'est une <strong>condition de garde</strong> entre crochets, à la sortie d'un nœud de décision.</div>

<h3>5. Les nœuds de contrôle : début, fin, fin de flot</h3>
<p>Un diagramme d'activités commence et se termine par des <strong>nœuds de contrôle</strong> dédiés :</p>
<pre class="pseudo">Noeud initial       # un disque NOIR plein
                    #   le point de depart du processus
   (*)---->

Noeud final         # un disque noir ENTOURE d'un cercle ("oeil de boeuf")
                    #   il termine TOUTE l'activite : tous les flots
                    #   encore en cours sont interrompus
   ---->(*)

Noeud de fin de flot # un cercle barre d'une croix : (X)
                     #   il termine UNIQUEMENT le flot qui l'atteint
                     #   le reste de l'activite continue
   ---->(X)</pre>
<div class="tip">La distinction <strong>fin d'activité</strong> / <strong>fin de flot</strong> tombe souvent en examen. Moyen mnémotechnique : l'œil de bœuf coupe le courant de <em>tout le bâtiment</em> ; le cercle barré coupe <em>une seule prise</em>.</div>

<h3>6. Le nœud de décision : un seul entrant, plusieurs sortants gardés</h3>
<p>Le <strong>nœud de décision</strong> se dessine par un <strong>losange</strong>. Sa règle structurelle est stricte :</p>
<pre class="pseudo">Noeud de decision
  - UN SEUL flot entrant
  - PLUSIEURS flots sortants
  - chaque sortant porte une CONDITION DE GARDE entre crochets
  - les conditions doivent etre MUTUELLEMENT EXCLUSIVES
  - un cas [sinon] couvre tout ce qui n'est pas prevu</pre>
<pre class="pseudo"># Le controle du stock, a la ludotheque
                       [stock_location > 0]
   ( Verifier    )        .------> ( Encaisser la caution )
   ( stock_location ) --> ( ) &lt;--- losange
                          '------> ( Proposer une Reservation )
                       [sinon]</pre>
<p>Les crochets sont <strong>obligatoires</strong> : <code>[stock_location &gt; 0]</code>, <code>[membre a jour de cotisation]</code>, <code>[sinon]</code>. Une flèche sortant d'un losange sans condition est une erreur de notation.</p>
<div class="warn">Le cas <code>[sinon]</code> n'est pas une coquetterie. Sans lui, un jeton peut arriver sur le losange et <strong>rester bloqué</strong> parce qu'aucune garde n'est vraie. Ton processus ne se termine jamais : c'est un vrai bug de modèle.</div>

<h3>7. Le nœud de fusion : plusieurs entrants, un seul sortant</h3>
<p>Le <strong>nœud de fusion</strong> se dessine avec <strong>le même losange</strong> que la décision — c'est ce qui trouble les débutants. Ce qui les distingue, c'est le <strong>nombre de flèches de chaque côté</strong>.</p>
<pre class="pseudo">Noeud de fusion
  - PLUSIEURS flots entrants
  - UN SEUL flot sortant
  - PAS de condition de garde
  - il s'execute DES QU'UN SEUL entrant est active
    (il n'attend PAS les autres : ce n'est pas une synchronisation)</pre>
<pre class="pseudo"># Apres le losange de decision, on recolle les deux chemins
   ( Encaisser la caution )  ----.
                                  &gt;--( ) --> ( Remettre le ticket )
   ( Proposer une Reservation ) -'    fusion</pre>
<div class="tip">Règle de lecture : <strong>losange à une entrée = décision</strong> ; <strong>losange à une sortie = fusion</strong>. Compte les flèches, tu ne te tromperas jamais.</div>

<h3>8. Le vocabulaire de ton cours d'école</h3>
<div class="tip">Le support du PAC nomme ces deux losanges <strong>« nœud de test-décision »</strong> et <strong>« nœud de fusion-test »</strong>. Ce sont exactement les mêmes objets que le <strong>nœud de décision</strong> (<em>decision node</em>) et le <strong>nœud de fusion</strong> (<em>merge node</em>) de la norme UML 2.5.1. Si ton examen emploie « test-décision », lis « décision » ; si tu lis « fusion-test », lis « fusion ». Le dessin et la règle des flèches sont identiques.</div>

<h3>9. Un mot sur le vocabulaire hérité d'UML 1</h3>
<div class="warn"><strong>Écart avec ton cours d'école.</strong> Le support parle de <strong>« transitions »</strong> entre les actions et d'<strong>« état initial »</strong>. C'est du vocabulaire hérité d'<strong>UML 1.x</strong>, où le diagramme d'activités était officiellement un cas particulier de machine à états. Depuis <strong>UML 2</strong>, ce n'est plus vrai : on parle d'<strong>arcs d'activité</strong> (<em>activity edges</em>), qui sont soit des <strong>flots de contrôle</strong>, soit des <strong>flots d'objet</strong>, et le point de départ s'appelle le <strong>nœud initial</strong>, pas l'état initial. La sémantique aussi a changé : UML 2 raisonne en <strong>jetons</strong> (<em>tokens</em>) qui circulent le long des arcs, à la façon d'un réseau de Petri. Emploie le mot que ton examen attend, mais sache lequel est le mot juste.</div>

<h3>10. Le fil rouge : louer un jeu à la Ludothèque</h3>
<p>Assemblons tout sur le processus qui nous servira tout le mois. Voici le flot de contrôle complet, en notation texte :</p>
<pre class="pseudo"># ACTIVITE : Louer un jeu
   (*)  noeud initial
    |
    v
  ( Verifier l'adhesion du Membre )
    |
    v
   ( ) &lt;-- noeud de decision (test-decision)
    |--[adhesion valide]------> ( Verifier stock_location du Jeu )
    |                                  |
    |                                  v
    |                                 ( ) &lt;-- decision
    |                                  |--[stock_location > 0]--> ( Encaisser la caution )
    |                                  |                                 |
    |                                  |                                 v
    |                                  |                          ( Enregistrer la Location )
    |                                  |                                 |
    |                                  |                                 v
    |                                  |                          ( Decrementer stock_location )
    |                                  |                                 |
    |                                  |--[sinon]--> ( Proposer une Reservation )
    |                                  |                    |            |
    |                                  |                    v            v
    |                                  '------------------&gt;( ) &lt;---------'  fusion
    |                                                       |
    |                                                       v
    |                                                      (*)  noeud final
    |
    '--[sinon]--> ( Proposer une adhesion ) --> (X)  fin de flot</pre>
<p>Lis-le à voix haute : « on vérifie l'adhésion ; si elle est valide on vérifie <code>stock_location</code> ; s'il reste des exemplaires on encaisse la <code>caution</code>, on enregistre la <code>Location</code> avec sa <code>date_debut</code> et on décrémente le stock ; sinon on propose une <code>Reservation</code> ; les deux chemins se rejoignent par une fusion. »</p>
<div class="tip">Remarque ce que ce diagramme apporte par rapport au cas d'utilisation : il rend visibles les <strong>cas d'échec</strong>. « Et si le membre n'est plus à jour ? » « Et si le stock est vide ? » Ce sont exactement les questions métier du jour 1, mais cette fois elles ont une réponse dessinée.</div>

<h3>11. Ce qui arrive demain</h3>

obligatoire : sans lui, un jeton pourrait\n#    arriver sur le losange sans qu'aucune garde soit vraie, et\n#    rester bloque la pour toujours.\n# 3. Decision et fusion se dessinent avec le MEME losange.\n#    On les distingue en comptant les fleches :\n#       1 entrant  + n sortants gardes = DECISION\n#       n entrants + 1 sortant sans garde = FUSION\n# 4. Si tu voulais terminer une seule branche sans arreter toute\n#    l'activite (par exemple \"Signaler l'Exemplaire au responsable\"),\n#    tu utiliserais un NOEUD DE FIN DE FLOT : end en PlantUML,\n#    dessine par un cercle barre d'une croix.",
