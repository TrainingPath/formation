  theory: `
<h3>1. Le dernier kilomètre</h3>
<p>Hier, tu as découpé la Ludothèque en cinq composants. Bien. Mais le jour de la mise en production, la gérante ne te demandera pas « quelles sont tes interfaces ? ». Elle te demandera : <em>« il me faut combien de machines, et qu'est-ce que j'installe dessus ? »</em>.</p>
<p>Le <strong>diagramme de déploiement</strong> (sigle <strong>DPL</strong> dans ton cours d'école) répond exactement à cela. Il décrit l'<strong>architecture physique</strong> du système : le <strong>matériel</strong>, les <strong>environnements d'exécution</strong>, les <strong>fichiers</strong> qu'on y installe et les <strong>liaisons réseau</strong> entre eux. C'est le plus concret de tous les diagrammes UML — celui qu'on imprime et qu'on donne à l'administrateur système.</p>
<div class="tip">Trois diagrammes, trois altitudes : le <strong>diagramme de classes</strong> décrit les concepts, le <strong>diagramme de composants</strong> décrit le découpage logiciel, le <strong>diagramme de déploiement</strong> décrit les machines. On descend du plus abstrait au plus tangible.</div>

<h3>2. Le nœud : un cube</h3>
<p>L'élément de base du DPL est le <strong>nœud</strong> (<em>node</em>). Il se dessine par un <strong>cube</strong> (un parallélépipède en perspective) portant son nom :</p>
<pre class="pseudo">        +-------------------+
       /                   /|
      +-------------------+ |
      |                   | |     # NOEUD : un cube en perspective
      |   ServeurBDD      | +
      |                   |/
      +-------------------+</pre>
<p>Un nœud est une <strong>ressource de calcul</strong> sur laquelle on peut installer et exécuter des choses. UML 2.5.1 en distingue deux spécialisations, notées par un mot-clé :</p>
<pre class="pseudo">&laquo;device&raquo;                # unite MATERIELLE de traitement
                        # exemples : un serveur physique, un PC de comptoir,
                        #            un routeur, un terminal de paiement

&laquo;executionEnvironment&raquo; # ENVIRONNEMENT D'EXECUTION heberge par un device
                        # exemples : une JVM, un serveur d'application
                        #            (Tomcat, JBoss), un conteneur Docker,
                        #            un SGBD, un navigateur</pre>
<p>La relation naturelle entre les deux est l'<strong>imbrication</strong> : un <code>&laquo;executionEnvironment&raquo;</code> est dessiné <em>à l'intérieur</em> du <code>&laquo;device&raquo;</code> qui l'héberge. C'est logique : une JVM ne flotte pas dans le vide, elle tourne sur une machine.</p>
<pre class="pseudo">   +-----------------------------------------------+
   |  &laquo;device&raquo;  ServeurLudotheque                 |
   |    +---------------------------------------+  |
   |    |  &laquo;executionEnvironment&raquo;              |  |
   |    |        ServeurApplication             |  |
   |    +---------------------------------------+  |
   +-----------------------------------------------+
   # Lecture : le serveur d'application TOURNE SUR ce serveur physique.</pre>
<div class="warn">Ne mets pas <code>&laquo;device&raquo;</code> partout par réflexe. Un nœud sans mot-clé reste parfaitement valide : le mot-clé sert à <em>préciser</em> quand la distinction matériel / environnement est utile au lecteur. Sur un schéma d'infrastructure destiné à un administrateur, elle l'est presque toujours.</div>

<h3>3. L'artefact : le fichier concret</h3>
<p>Un nœud vide n'intéresse personne. Ce qu'on y installe, ce sont des <strong>artefacts</strong>. Un <strong>artefact</strong> est une <strong>entité physique et concrète</strong> produite par le développement : un fichier, et rien d'autre.</p>
<pre class="pseudo">ludotheque.war   # l'application web packagee
ludotheque.jar   # une bibliotheque Java
schema.sql       # le script de creation de la base
config.xml       # un fichier de configuration
pilote.dll       # une bibliotheque native
manuel.pdf       # meme un document peut etre un artefact</pre>
<p>Il se note par un <strong>rectangle</strong> portant le mot-clé <code>&laquo;artifact&raquo;</code>, et/ou une <strong>icône de document</strong> : une petite <strong>feuille au coin corné</strong> (le coin supérieur droit replié).</p>
<pre class="pseudo">   +----------------------------+       +-----------------+
   |  &laquo;artifact&raquo;               |       |            /|   |
   |     ludotheque.war         |       |           /_|   |   # icone de
   +----------------------------+       | ludotheque.war  |   # DOCUMENT
   # forme "mot-cle"                    +-----------------+   # (coin corne)</pre>
<div class="warn"><strong>Composant ou artefact ? Ne les confonds jamais.</strong> Le <strong>composant</strong> est une unité de <em>conception</em> : une brique logique, remplaçable, définie par ses interfaces (c'était hier). L'<strong>artefact</strong> est le <em>fichier concret</em> qui l'incarne sur le disque. Le composant <code>Catalogue</code> existe dans ta tête et dans ton modèle ; l'artefact <code>catalogue.jar</code> existe sur le serveur, avec une taille en octets et une date de modification. Un composant peut d'ailleurs être incarné par plusieurs artefacts, et un artefact peut en incarner plusieurs.</div>

<h3>4. Deux façons de placer un artefact sur un nœud</h3>
<p>UML propose deux notations équivalentes. La première est la <strong>représentation inclusive</strong> : on dessine simplement l'artefact <em>à l'intérieur</em> du nœud.</p>
<pre class="pseudo">   +-------------------------------------------+
   |  &laquo;executionEnvironment&raquo;                  |
   |         ServeurApplication                |
   |    +--------------------------------+     |
   |    |  &laquo;artifact&raquo; ludotheque.war    |     |   # REPRESENTATION
   |    +--------------------------------+     |   # INCLUSIVE
   |    +--------------------------------+     |
   |    |  &laquo;artifact&raquo; ludotheque.jar    |     |
   |    +--------------------------------+     |
   +-------------------------------------------+</pre>
<p>La seconde est la <strong>dépendance de déploiement</strong> : on dessine l'artefact à l'extérieur et on trace une <strong>flèche en pointillé</strong> vers le nœud, portant le mot-clé <code>&laquo;deploy&raquo;</code>.</p>
<pre class="pseudo">   +---------------------------+                   +-------------------+
   | &laquo;artifact&raquo;               |                   |    &laquo;device&raquo;      |
   |    schema.sql             |- - - - - - - - -&gt; |    ServeurBDD     |
   +---------------------------+   &laquo;deploy&raquo;       +-------------------+
   # Fleche POINTILLEE, mot-cle &laquo;deploy&raquo;, orientee ARTEFACT -&gt; NOEUD
   # Lecture : "schema.sql est deploye sur ServeurBDD"</pre>
<p>Quand choisir l'une ou l'autre ? L'inclusive est plus lisible quand un nœud héberge peu d'artefacts. La dépendance <code>&laquo;deploy&raquo;</code> est indispensable quand un <strong>même artefact</strong> est déployé sur <strong>plusieurs nœuds</strong> (un même <code>.jar</code> sur deux serveurs en répartition de charge, par exemple) : on ne peut pas le dessiner deux fois à l'intérieur.</p>

<h3>5. La relation &laquo;manifest&raquo;</h3>
<p>Il reste à faire le pont entre les deux mondes : le modèle (composants, classes) et le disque (artefacts). C'est le rôle de la relation <code>&laquo;manifest&raquo;</code>, une dépendance qui va de l'<strong>artefact</strong> vers l'<strong>élément de modèle qu'il matérialise</strong>.</p>
<pre class="pseudo">   +---------------------------+                   +---------------------+
   | &laquo;artifact&raquo;               |                   |   &laquo;component&raquo;      |
   |    catalogue.jar          |- - - - - - - - -&gt; |     Catalogue       |
   +---------------------------+   &laquo;manifest&raquo;     +---------------------+
   # Lecture : "catalogue.jar MANIFESTE le composant Catalogue",
   #           c'est-a-dire : ce fichier est la forme concrete
   #           que prend cette brique de conception.</pre>
<p>Retiens la paire de verbes, c'est le meilleur moyen de ne plus se tromper :</p>
<pre class="pseudo">&laquo;manifest&raquo;  : un ARTEFACT  manifeste  un ELEMENT DE MODELE   (fichier -&gt; concept)
&laquo;deploy&raquo;    : un ARTEFACT  est deploye sur un NOEUD          (fichier -&gt; machine)</pre>

<h3>6. Les chemins de communication</h3>
<p>Des nœuds isolés ne forment pas un système. Deux nœuds qui échangent des données sont reliés par un <strong>chemin de communication</strong> (<em>CommunicationPath</em>), noté par un <strong>simple trait plein</strong>, exactement comme une association du diagramme de classes.</p>
<p>Ce trait peut porter un <strong>stéréotype</strong> qui précise le <strong>protocole</strong> employé, et des <strong>multiplicités</strong> à ses extrémités :</p>
<pre class="pseudo">  +-----------------+                         +----------------------+
  |  &laquo;device&raquo;      |  1              1..*    |  &laquo;device&raquo;           |
  | PosteComptoir   |-------------------------|  ServeurLudotheque   |
  +-----------------+     &laquo;HTTPS&raquo;            +----------------------+
  # Trait PLEIN entre deux noeuds = CHEMIN DE COMMUNICATION
  # Le stereotype dit COMMENT ils se parlent : &laquo;HTTPS&raquo;, &laquo;TCP/IP&raquo;,
  # &laquo;JDBC&raquo;, &laquo;SOAP&raquo;, &laquo;USB&raquo;, &laquo;RS232&raquo;...</pre>
<p>C'est ce trait qui transforme un catalogue de machines en <strong>architecture</strong>. Sans lui, tu as une liste de serveurs ; avec lui, tu as un système dont on peut discuter la sécurité, la latence et les pannes.</p>

<h3>7. Le déploiement complet de la Ludothèque</h3>
<p>Assemblons tout. La Ludothèque est une application web : les employés travaillent au comptoir sur un navigateur, l'application tourne sur un serveur, les données vivent dans MySQL.</p>

  |  +--------------------+  |
  |  | &laquo;executionEnv...&raquo; |  |
  |  |    Navigateur      |  |
  |  +--------------------+  |
  +--------------------------+
             |
             |  &laquo;HTTPS&raquo;              # chemin de communication
             |
  +---------------------------------------------------+
  |  &laquo;executionEnvironment&raquo;                          |
  |          ServeurApplication                       |

  |   |  &laquo;artifact&raquo;  ludotheque.war             |   |
  |   +-------------------------------------------+   |
  |   +-------------------------------------------+   |
  |   |  &laquo;artifact&raquo;  ludotheque.jar             |   |
  |   +-------------------------------------------+   |
  +---------------------------------------------------+
             |
             |  &laquo;JDBC&raquo; / &laquo;TCP/IP&raquo;    # chemin de communication

<p>Ce seul schéma répond à des questions que rien d'autre ne pouvait trancher : faut-il un certificat TLS ? (oui, le chemin est en <code>&laquo;HTTPS&raquo;</code>) ; que sauvegarde-t-on ? (le <code>ServeurBDD</code>) ; si le serveur d'application tombe, le comptoir peut-il encaisser ? (non). Voilà pourquoi ce diagramme est le préféré des exploitants.</p>
<div class="tip">Ordre de lecture recommandé pour construire un DPL : (1) je liste les <strong>machines</strong>, (2) j'y place les <strong>environnements d'exécution</strong>, (3) j'installe les <strong>artefacts</strong>, (4) je trace les <strong>chemins de communication</strong> et je les stéréotype, (5) je relie enfin les artefacts aux composants par <code>&laquo;manifest&raquo;</code>.</div>

<h3>8. Ce que dit ton support d'école, et ce qu'il ne dit pas</h3>
<div class="warn"><strong>Écarts avec le support du PAC.</strong> Deux points importants.<br><br>

2. Le support <strong>confond par endroits composant et artefact</strong>, en dessinant des « composants » installés sur des nœuds. En UML 2.5.1, ce qu'on déploie sur un nœud, c'est un <strong>artefact</strong> — un fichier. Le composant, lui, est une unité de conception : il n'a pas de taille en octets et ne s'installe pas. Le lien correct entre les deux est <code>&laquo;manifest&raquo;</code> : <em>l'artefact manifeste le composant</em>. Retiens la phrase, elle résout la confusion à elle seule.</div>
