<h3>1. Pourquoi un catalogue d'erreurs</h3>
<p>Tu connais maintenant les 14 diagrammes. La difficulté n'est plus de savoir <em>ce qu'est</em> un diagramme de séquence : c'est d'éviter les quelques erreurs qui reviennent chez presque tous les débutants, et que les correcteurs repèrent en trois secondes.</p>
<p>Ce chapitre est organisé <strong>par diagramme</strong>. Pour chaque piège, trois lignes : <strong>ce qu'on écrit à tort</strong>, <strong>pourquoi c'est faux</strong>, <strong>ce qu'il faut écrire</strong>. Relis-le avant chaque rendu ; c'est ta grille de relecture.</p>

<h3>2. Cas d'utilisation — piège 1 : l'acteur nommé par une personne</h3>
<pre class="pseudo">A TORT      un acteur nomme "Sophie" ou "Monsieur Dupont",
            ou encore "Ordinateur du comptoir"

POURQUOI    un acteur est un ROLE, pas un individu ni un materiel.
            Sophie part en conges, le role reste. Et si Sophie
            est a la fois vendeuse et responsable, elle joue DEUX
            roles : deux acteurs distincts sur le diagramme.

IL FAUT     Membre, Employe, Responsable, Systeme de paiement.
            Un nom de role, au singulier, sans prenom.</pre>

<h3>3. Cas d'utilisation — piège 2 : descendre au niveau de l'IHM</h3>
<pre class="pseudo">A TORT      des cas nommes "Cliquer sur OK", "Saisir le login",
            "Ouvrir la fenetre de recherche"

POURQUOI    un cas d'utilisation decrit un SERVICE rendu a
            l'acteur, qui lui apporte une valeur observable.
            "Cliquer sur OK" n'a aucune valeur metier : c'est de
            l'interface, et l'interface changera dix fois.

IL FAUT     "Louer un jeu", "Consulter le catalogue",
            "Enregistrer un retour". Un VERBE a l'infinitif +
            un complement metier. Test : peux-tu le facturer ?</pre>
<div class="tip">Le test du bon niveau : demande-toi si le cas resterait vrai en remplaçant l'application web par un guichet papier. « Louer un jeu » : oui. « Cliquer sur OK » : non — donc ce n'est pas un cas d'utilisation.</div>

<h3>4. Cas d'utilisation — piège 3 : confondre include et extend</h3>
<pre class="pseudo">A TORT      utiliser &lt;&lt;include&gt;&gt; pour un comportement optionnel
            ("appliquer une remise si le membre est etudiant")

POURQUOI    les deux relations n'ont PAS le meme statut :
            &lt;&lt;include&gt;&gt;  -> comportement OBLIGATOIRE et PARTAGE,
                             toujours execute, factorise parce
                             qu'il sert a plusieurs cas.
            &lt;&lt;extend&gt;&gt;   -> comportement OPTIONNEL et CONDITIONNEL,
                             declenche seulement sous condition,
                             a un point d'extension precis.

IL FAUT     "Louer un jeu" ..&gt; &lt;&lt;include&gt;&gt; ..&gt; "S'authentifier"
              (on s'authentifie TOUJOURS, et pour plusieurs cas)
            "Appliquer une remise" ..&gt; &lt;&lt;extend&gt;&gt; ..&gt; "Louer un jeu"
              (seulement SI le membre est etudiant)</pre>

<h3>5. Cas d'utilisation — piège 4 : le sens de la flèche extend</h3>
<pre class="pseudo">A TORT      "Louer un jeu"  ......&gt;  "Appliquer une remise"
            avec le stereotype &lt;&lt;extend&gt;&gt;

POURQUOI    c'est le sens de &lt;&lt;include&gt;&gt;, pas celui de
            &lt;&lt;extend&gt;&gt;. Les deux fleches sont pointillees et se
            ressemblent, mais elles vont en sens INVERSE :
              &lt;&lt;include&gt;&gt; : du cas de BASE vers le cas INCLUS
              &lt;&lt;extend&gt;&gt;  : du cas EXTENSION vers le cas de BASE

IL FAUT     "Appliquer une remise" ......&gt; "Louer un jeu"
            Moyen mnemotechnique : le cas optionnel "vient
            s'accrocher" au cas normal, donc il pointe vers lui.
            Le cas de base, lui, ne sait meme pas qu'il existe.</pre>
<div class="warn">Ces deux pièges (3 et 4) sont, statistiquement, les plus fréquents de tout le cours. Si tu ne dois retenir qu'une chose du jour 4 : <strong>include = obligatoire, la flèche part du cas de base ; extend = optionnel, la flèche arrive sur le cas de base.</strong></div>

<h3>6. Classes — piège 5 : une classe en type d'attribut</h3>
<pre class="pseudo">A TORT      class Jeu {
              - categorie : Categorie      &lt;- une CLASSE en type
              - exemplaires : Exemplaire[] &lt;- pire encore
            }

POURQUOI    tu viens de CACHER une relation qui merite un trait
            visible. Le diagramme de classes sert justement a
            montrer les liens ; enterrer un lien dans un
            compartiment d'attributs, c'est le rendre invisible
            au lecteur et perdre la multiplicite.

IL FAUT     Jeu "0..*" ---- "1" Categorie
            Jeu "1" ---- "0..*" Exemplaire
            Le lien devient un TRAIT, avec ses multiplicites,
            son nom et eventuellement sa navigabilite.</pre>

<h3>7. Classes — piège 6 : oublier les multiplicités</h3>
<pre class="pseudo">A TORT      Membre ---- Location        (un trait nu)

POURQUOI    un trait sans multiplicite ne dit RIEN. Est-ce qu'un
            membre a une location ou mille ? Une location peut-elle
            exister sans membre ? Le modele ne repond pas, donc
            il ne se traduit ni en code ni en base de donnees :
            c'est la multiplicite qui decide de la cle etrangere.

IL FAUT     Membre "1" ---- "0..*" Location
            Regle de relecture : AUCUN trait ne doit rester nu.
            Les DEUX extremites portent une multiplicite.</pre>

<h3>8. Classes — piège 7 : agrégation contre composition</h3>
<pre class="pseudo">A TORT      Jeu &lt;&gt;---- Exemplaire   avec un losange PLEIN
            (composition) parce que "l'exemplaire appartient
            au jeu"

POURQUOI    la composition (losange PLEIN) impose deux choses :
              - le composant n'appartient qu'a UN seul composite,
              - et il est DETRUIT avec lui (cycle de vie lie).
            L'agregation (losange CREUX) est un simple
            "fait partie de", sans dependance de vie.

IL FAUT     se poser UNE question : si je supprime le tout,
            la partie disparait-elle forcement ?
              Commande &lt;&gt;-- LigneCommande  : oui -> losange PLEIN
              Equipe   &lt;&gt;-- Joueur         : non -> losange CREUX
            A la ludotheque : supprimer une fiche Jeu du catalogue
            ne detruit pas les exemplaires physiques -> agregation.</pre>

<h3>9. Classes — piège 8 : « une super-classe est forcément abstraite »</h3>
<pre class="pseudo">A TORT      croire que des qu'une classe a des sous-classes,
            son nom doit s'ecrire en italique (abstraite)

POURQUOI    C'EST FAUX. Une classe est abstraite parce qu'on a
            DECIDE qu'elle ne doit pas etre instanciee, pas parce
            qu'elle a des heritiers. Les deux notions sont
            independantes : une super-classe peut parfaitement
            avoir ses propres instances.

IL FAUT     decider explicitement, et le dire :
              Personne (concrete) -> Membre, Employe
                 une Personne "simple" peut exister dans le systeme
              Paiement (ABSTRAITE) -> Especes, Carte, Cheque
                 aucun paiement "generique" n'a de sens
            Lien avec le jour 29 : "pas d'occurrence du super-type"
            correspond aux contraintes de partition / totalite.</pre>

<h3>10. Classes — piège 9 : la multiplicité du mauvais côté</h3>
<pre class="pseudo">A TORT      Membre "0..*" ---- "1" Location
            en voulant dire "un membre a plusieurs locations"

POURQUOI    reflexe MERISE. En entite-association, la cardinalite
            se lit DU COTE de l'entite d'ou l'on part ; en UML,
            la multiplicite se place a l'AUTRE extremite : elle
            dit combien d'objets de la classe VOISINE sont relies
            a UN objet du cote d'ou l'on lit.

IL FAUT     Membre "1" ---- "0..*" Location
            Lecture UML : "un Membre est lie a 0..* Locations"
            -> le 0..* se lit du cote LOCATION.
            Test rapide : lis la phrase a voix haute. Si elle
            sonne a l'envers, tes multiplicites sont inversees.</pre>
<div class="warn">Ce piège est le seul du catalogue qui vient d'un <em>autre</em> cours : si tu as fait Merise avant UML (jour 2 et jour 14), tu inverseras les multiplicités au moins une fois. Vérifie systématiquement en lisant l'association à voix haute, dans les deux sens.</div>

<h3>11. Séquence — piège 10 : synchrone contre asynchrone</h3>
<pre class="pseudo">A TORT      dessiner toutes les fleches avec la meme pointe,
            ou utiliser la pointe ouverte pour un appel normal

POURQUOI    la forme de la pointe porte une information
            SEMANTIQUE, ce n'est pas de la decoration :
              pointe PLEINE (triangle noir) -> message SYNCHRONE :
                 l'emetteur ATTEND la reponse, il est bloque.
              pointe OUVERTE (deux traits)  -> message ASYNCHRONE :
                 l'emetteur continue immediatement, sans attendre.
              trait POINTILLE + pointe ouverte -> message de RETOUR.

IL FAUT     louer(exemplaire) ---&gt;| pointe PLEINE
              (le comptoir attend de savoir si c'est accepte)
            envoyerMailConfirmation() --&gt;&gt; pointe OUVERTE
              (personne n'attend le mail pour continuer)</pre>

<h3>12. Séquence — piège 11 : par au lieu de alt</h3>
<pre class="pseudo">A TORT      un fragment "par" contenant deux operandes
            "si stock disponible" / "si stock epuise"

POURQUOI    "par" signifie PARALLELE : les operandes s'executent
            TOUS, dans un ordre quelconque, potentiellement en
            meme temps. Ecrire deux cas mutuellement exclusifs
            dans un "par", c'est dire que le stock est a la fois
            disponible et epuise.

IL FAUT     alt  -> choix EXCLUSIF entre operandes gardees
                    (avec eventuellement un operande [else])
            opt  -> un seul bloc, execute ou non
            par  -> executions CONCURRENTES, toutes realisees
            loop -> repetition
            Ici : alt [stock &gt; 0] / [else]</pre>

<h3>13. Activités vs machine à états — piège 12 : le mauvais diagramme</h3>
<pre class="pseudo">A TORT      un diagramme d'ACTIVITES pour decrire le cycle de vie
            d'un exemplaire : "Disponible -> Loue -> Rendu"
            (ou l'inverse : une machine a etats pour decrire
             le processus d'inscription d'un nouveau membre)

POURQUOI    les deux diagrammes ne repondent pas a la meme
            question :
              ACTIVITES        -> un PROCESSUS, un enchainement
                                  d'ACTIONS, souvent traverse par
                                  plusieurs objets et plusieurs
                                  acteurs (d'ou les couloirs).
              MACHINE A ETATS  -> le cycle de vie d'UN SEUL objet :
                                  ses ETATS successifs et les
                                  EVENEMENTS qui le font changer.

IL FAUT     Cycle de vie d'un Exemplaire -> MACHINE A ETATS
              (Disponible / Loue / En reparation / Retire)
            Processus "traiter une location au comptoir"
              -> DIAGRAMME D'ACTIVITES, avec couloirs
                 Membre / Employe / Systeme</pre>

<h3>14. Activités — piège 13 : un événement sur un arc d'activité</h3>
<pre class="pseudo">A TORT      Verifier le stock  --[retour du client]--&gt;  Rendre

POURQUOI    dans un diagramme d'activites, un arc represente un
            FLOT : le jeton passe des que l'action precedente est
            terminee. Il n'y a PAS d'evenement sur un arc. On peut
            y mettre une GARDE ([stock &gt; 0]), qui est une
            condition booleenne, jamais un evenement.
            Les evenements, c'est la machine a etats :
              etatA --evenement[garde]/effet--&gt; etatB

IL FAUT     dans un diagramme d'activites, pour attendre un
            evenement, on utilise un noeud dedie :
            l'ACCEPTATION D'EVENEMENT (le pentagone entrant),
            qui est un NOEUD, pas une etiquette d'arc.</pre>

              scenario complexe  -> sequence
              objet a etats      -> machine a etats
              deploiement reel   -> deploiement
            Un diagramme se justifie par la question a laquelle
            il repond, jamais par le fait qu'il existe.</pre>
