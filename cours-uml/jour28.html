<h3>1. Le même texte, l'autre lunette</h3>
<p>Hier, tu as cherché ce que le système <strong>fait</strong> : acteurs, frontière, cas d'utilisation, description textuelle, activités. Aujourd'hui, tu reprends <strong>exactement le même énoncé</strong> et tu cherches ce que le système <strong>connaît</strong>. C'est le passage du comportemental au structurel — et c'est là que la plupart des copies dérapent, parce qu'on se met à inventer des classes au lieu de les <em>trouver</em> dans le texte.</p>
<p>Rappel de l'énoncé, en condensé : la ludothèque « Le Dé Bleu » ouvre un <strong>service d'animation</strong>. Des <em>animateurs</em>, salariés ou bénévoles, encadrent des <em>séances</em> de jeu. Une séance a une <em>date</em> et une <em>heure</em>, se tient dans une <em>salle</em>, porte sur un ou plusieurs <em>jeux</em> du catalogue. Chaque salle a une <em>capacité</em> ; les <em>places</em> offertes ne peuvent pas la dépasser. Un <em>membre</em> s'inscrit tant qu'il reste des places, et règle au comptoir auprès d'un <em>employé</em> un <em>tarif</em> par participant propre à chaque séance. L'annulation à plus de 48 heures donne droit à remboursement. Les jeux utilisés sortent du <code>stock_location</code>. L'animateur consulte son <em>planning</em> et déclare les <em>participants</em> présents.</p>

<h3>2. Étape 1 — Extraire tous les candidats</h3>
<p>La méthode est bête et efficace : <strong>relever tous les noms communs du texte</strong>, sans trier, sans juger. Trier trop tôt, c'est perdre une classe.</p>
<pre class="pseudo">animateur   seance      salle       jeu         membre
employe     place       capacite    tarif       inscription
planning    participant catalogue   ludotheque  comptoir
date        heure       stock       taux de remplissage</pre>
<p>Dix-neuf candidats. Il en restera cinq ou six. Le travail d'analyse, ce n'est pas la liste : c'est <strong>l'élimination motivée</strong>.</p>

<h3>3. Étape 2 — Le test du candidat classe</h3>
<p>Un nom du texte mérite d'être une classe s'il passe <strong>quatre questions</strong>. Il suffit d'un non pour l'écarter.</p>
<pre class="pseudo">Q1. IDENTITE      : deux exemplaires ayant les memes valeurs
                    restent-ils deux choses DIFFERENTES ?
Q2. PROPRIETES    : a-t-il PLUSIEURS informations a lui ?
Q3. PERSISTANCE   : le systeme a-t-il besoin de le MEMORISER ?
Q4. COMPORTEMENT  : sait-il faire quelque chose, ou lui
                    arrive-t-il quelque chose dans le temps ?

# Q1 et Q3 sont les plus discriminantes.
# Une chose sans identite propre est un ATTRIBUT, pas une classe.</pre>
<div class="tip">Le test d'identité, en pratique : imagine deux occurrences aux valeurs identiques. Deux <em>séances</em> du 12 mars à 14 h, même salle, même animateur : ce sont malgré tout deux séances distinctes, on veut les distinguer — <strong>identité</strong>, donc classe. Deux <em>capacités</em> valant 20 : c'est le même nombre 20, il n'y a rien à distinguer — <strong>valeur</strong>, donc attribut.</div>

<h3>5. Étape 4 — Les attributs, et où les poser</h3>
<p>Un attribut appartient à la classe dont il <strong>dépend entièrement</strong>. La question à poser : <em>de quoi cette valeur dépend-elle ?</em> Si elle dépend de deux classes à la fois, elle n'appartient à aucune des deux — elle appartient à l'association entre elles.</p>
<pre class="pseudo">Salle       : code, libelle, capacite
              # capacite depend de la SALLE seule -&gt; Salle

Seance      : numero, dateHeure, nbPlaces, tarif, statut
              # tarif "propre a chaque seance" (R5) -&gt; Seance,
              #   surtout PAS Salle ni Membre
              # /tauxRemplissage : DERIVE

Animateur   : matricule, nom, prenom, courriel, statut
              # statut : "salarie" ou "benevole"

Inscription : dateInscription, montant, paye, present,
              dateAnnulation
              # montant depend du COUPLE (Membre, Seance) :
              #   ni le membre ni la seance ne peut le porter.
              #   La regle de construction de Merise le dit deja :
              #   un attribut qui depend de DEUX entites appartient
              #   a l'ASSOCIATION entre elles.
              # present : declare par l'animateur apres la seance</pre>

<h3>6. Étape 5 — Les associations et leurs multiplicités</h3>
<p>Chaque association se lit dans les <strong>deux sens</strong>, et chaque sens se justifie par une phrase de l'énoncé. Si tu ne trouves pas la phrase, tu inventes.</p>
<pre class="pseudo">Salle 1 ----------- 0..* Seance
  # "une seance se tient dans l'une des salles"
  # UNE seance -&gt; UNE salle (1) ; une salle accueille 0 ou N seances

Animateur 1 ------- 0..* Seance
  # "le responsable affecte UN animateur"
  # UNE seance -&gt; UN animateur ; un animateur en encadre 0 ou N

Seance 1 &lt;&gt;-------- 0..* Inscription       COMPOSITION (losange PLEIN)
  # une Inscription n'existe pas sans sa Seance : si la seance
  # disparait, ses inscriptions n'ont plus aucun sens.

Membre 1 ---------- 0..* Inscription       association simple
  # le Membre SURVIT a l'inscription : pas de composition ici.
  # On refusera meme de supprimer un membre qui en a encore une.

Seance 1..* ------- 1..* Jeu
  # "porte sur UN OU PLUSIEURS jeux du catalogue" -&gt; 1..* cote Jeu
  # un meme jeu ressert a plusieurs seances -&gt; 1..* cote Seance
  # N:N : il faudra une table d'association en base.

Personne (abstraite)
   ^        ^         ^
   |        |         |
Membre  Employe   Animateur                 HERITAGE</pre>
<p>Trois décisions de conception méritent d'être argumentées, parce qu'elles tombent en interrogation :</p>
<pre class="pseudo">1. POURQUOI COMPOSITION entre Seance et Inscription ?
   Test de la duree de vie : l'Inscription peut-elle survivre a
   la Seance ? Non, elle perd tout sens. Losange PLEIN.
   Test inverse pour Membre : le Membre survit-il a son
   inscription ? Evidemment. Donc PAS de composition de ce cote.

2. POURQUOI Inscription est-elle une CLASSE et non une simple
   classe-association entre Membre et Seance ?
   Parce qu'un membre peut s'inscrire DEUX FOIS a la meme seance
   (il accompagne un enfant : alternatif A1 d'hier). Une classe-
   association n'autorise qu'UN lien par couple. Des que le
   couple peut se repeter, il faut une CLASSE a part entiere,
   avec son propre identifiant.

3. POURQUOI un HERITAGE Personne ?
   Membre, Employe et Animateur partagent nom, prenom, courriel.
   Test de substitution : "un Animateur EST-IL une Personne ?"
   Oui -&gt; l'heritage est legitime.
   Contre-exemple a ne pas faire : "un Animateur EST-IL un
   Employe ?" NON, il peut etre benevole. Le statut est un
   ATTRIBUT, pas une sous-classe.</pre>
<div class="warn">Piège classique : dériver <code>Animateur</code> de <code>Employé</code> parce que « ça se ressemble ». L'énoncé dit <em>salariés ou bénévoles</em> : un bénévole n'est pas un employé. L'héritage exige que la phrase « A est un B » soit vraie pour <strong>toutes</strong> les instances, sans exception. Une seule exception suffit à l'invalider.</div>

<h3>8. Du diagramme au code Python</h3>
<p>La traduction est mécanique, et tu la connais depuis le jour 13. Rappel des correspondances, puis le code complet.</p>
<pre class="pseudo">Classe UML          -&gt; class Python
Attribut prive      -&gt; self._attribut  (convention du souligne)
Attribut de classe  -&gt; variable declaree DANS la classe
Attribut derive     -&gt; methode de calcul (ou @property)
Operation           -&gt; methode
Heritage            -&gt; class Fille(Mere) + super().__init__(...)
Association 1..*    -&gt; une LISTE dans la classe du cote "1"
Composition         -&gt; le tout CREE la partie et la detient seul</pre>
<pre class="pseudo">from datetime import datetime, timedelta


class Personne:
    """Classe abstraite : nom, prenom, courriel communs."""

    def __init__(self, nom, prenom, courriel):
        self._nom = nom
        self._prenom = prenom
        self._courriel = courriel

    def nom_complet(self):
        return self._prenom + " " + self._nom


class Membre(Personne):
    # ATTRIBUT DE CLASSE (souligne sur le diagramme)
    CAUTION_MINIMUM = 20.0

    def __init__(self, numero, nom, prenom, courriel):
        super().__init__(nom, prenom, courriel)
        self._numero = numero
        self._suspendu = False
        self._inscriptions = []      # association 1 -- 0..*

    def est_a_jour(self):
        return not self._suspendu

    def ajouter_inscription(self, inscription):
        self._inscriptions.append(inscription)


class Animateur(Personne):
    def __init__(self, matricule, nom, prenom, courriel, statut):
        super().__init__(nom, prenom, courriel)
        self._matricule = matricule
        # statut = "salarie" ou "benevole" : un ATTRIBUT,
        # surtout pas deux sous-classes (voir section 6)
        self._statut = statut
        self._seances = []

    def ajouter_seance(self, seance):
        self._seances.append(seance)

    def planning(self, depuis):
        return [s for s in self._seances if s.date_heure &gt;= depuis]


class Salle:
    def __init__(self, code, libelle, capacite):
        self._code = code
        self._libelle = libelle
        self._capacite = capacite

    @property
    def capacite(self):
        return self._capacite


class Seance:
    DELAI_REMBOURSEMENT_H = 48       # regle R6

    def __init__(self, numero, date_heure, salle, animateur,
                 nb_places, tarif):
        # REGLE R1 verifiee des la construction : le modele UML
        # portait la contrainte {nbPlaces &lt;= salle.capacite}
        if nb_places &gt; salle.capacite:
            raise ValueError("R1 : nb_places depasse la capacite")
        self._numero = numero
        self.date_heure = date_heure
        self._salle = salle
        self._animateur = animateur
        self._nb_places = nb_places
        self._tarif = tarif
        self._jeux = []              # association 1..* -- 1..*
        self._inscriptions = []      # COMPOSITION : la Seance
                                     # detient seule ses parties
        animateur.ajouter_seance(self)

    def places_restantes(self):
        actives = [i for i in self._inscriptions if not i.est_annulee()]
        return self._nb_places - len(actives)

    def taux_remplissage(self):
        # ATTRIBUT DERIVE : calcule, jamais stocke
        if self._nb_places == 0:
            return 0.0
        occupees = self._nb_places - self.places_restantes()
        return round(100.0 * occupees / self._nb_places, 2)

    def ajouter_jeu(self, jeu):
        if jeu not in self._jeux:
            self._jeux.append(jeu)

    def inscrire(self, membre):
        if not membre.est_a_jour():
            raise ValueError("R4 : membre non inscrit ou suspendu")
        if self.places_restantes() &lt;= 0:
            raise ValueError("R3 : plus aucune place disponible")
        # COMPOSITION : c'est la Seance qui CREE l'Inscription
        inscription = Inscription(membre, self, self._tarif)
        self._inscriptions.append(inscription)
        membre.ajouter_inscription(inscription)
        return inscription


class Inscription:
    def __init__(self, membre, seance, montant):
        self._membre = membre
        self._seance = seance
        self._montant = montant
        self._date_inscription = datetime.now()
        self._paye = False
        self._present = False
        self._date_annulation = None

    def est_annulee(self):
        return self._date_annulation is not None

    def payer(self):
        self._paye = True

    def marquer_present(self):
        self._present = True

    def annuler(self, maintenant=None):
        """Retourne True si le membre a droit au remboursement."""
        if maintenant is None:
            maintenant = datetime.now()
        self._date_annulation = maintenant
        delai = self._seance.date_heure - maintenant
        # regle R6 : remboursement au-dela de 48 heures
        return delai &gt; timedelta(hours=Seance.DELAI_REMBOURSEMENT_H)</pre>
<div class="warn">Regarde <code>inscrire()</code> : c'est la <strong>Séance</strong> qui crée l'<code>Inscription</code>, et personne d'autre. C'est ainsi qu'on traduit une composition en code — le tout est le seul constructeur de ses parties. Si n'importe quel module peut faire <code>Inscription(...)</code> dans son coin, tu as dessiné un losange plein et livré une association ordinaire.</div>

<h3>9. Du diagramme aux tables MySQL</h3>
<p>Les règles de traduction du jour 14, appliquées telles quelles. Rappel de l'essentiel :</p>
<pre class="pseudo">Classe                -&gt; TABLE
Attribut              -&gt; COLONNE (+ NOT NULL si obligatoire)
Identifiant           -&gt; PRIMARY KEY, en AUTO_INCREMENT
Association 1..*      -&gt; cle etrangere du cote "plusieurs"
Association *..*      -&gt; TABLE D'ASSOCIATION, cle primaire composee
Composition           -&gt; FK NOT NULL + ON DELETE CASCADE
Association ordinaire -&gt; FK + ON DELETE RESTRICT
Attribut derive       -&gt; AUCUNE colonne : une requete ou une vue
Heritage              -&gt; une des trois strategies du jour 14</pre>
<pre class="pseudo">-- ============ SALLE : une classe ordinaire ============
CREATE TABLE salle (
  salle_id  INT          NOT NULL AUTO_INCREMENT,
  code      VARCHAR(10)  NOT NULL,
  libelle   VARCHAR(60)  NOT NULL,
  capacite  INT          NOT NULL,
      -- attribut UML "capacite : Integer" -&gt; colonne
  PRIMARY KEY (salle_id),
  UNIQUE KEY uk_salle_code (code),
      -- la contrainte {Unique} du modele UML
  CONSTRAINT ck_salle_capacite CHECK (capacite &gt; 0)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

-- ============ ANIMATEUR ============
CREATE TABLE animateur (
  animateur_id INT          NOT NULL AUTO_INCREMENT,
  matricule    VARCHAR(20)  NOT NULL,
  nom          VARCHAR(60)  NOT NULL,
  prenom       VARCHAR(60)  NOT NULL,
  courriel     VARCHAR(120) NULL,
  statut       VARCHAR(10)  NOT NULL DEFAULT 'benevole',
      -- ATTRIBUT, pas sous-classe : un benevole n'est pas
      -- un employe, donc pas d'heritage ici
  PRIMARY KEY (animateur_id),
  UNIQUE KEY uk_animateur_matricule (matricule),
  CONSTRAINT ck_animateur_statut
    CHECK (statut IN ('salarie', 'benevole'))
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

-- ============ SEANCE : deux associations 1 -- 0..* ============
CREATE TABLE seance (
  seance_id    INT          NOT NULL AUTO_INCREMENT,
  numero       VARCHAR(20)  NOT NULL,
  date_heure   DATETIME     NOT NULL,
  nb_places    INT          NOT NULL,
  tarif        DECIMAL(6,2) NOT NULL DEFAULT 0.00,
      -- DECIMAL et non FLOAT : on ne calcule jamais de l'argent
      -- en virgule flottante
  statut       VARCHAR(15)  NOT NULL DEFAULT 'programmee',
  salle_id     INT          NOT NULL,
      -- FK cote "plusieurs" : UNE seance -&gt; UNE salle
  animateur_id INT          NOT NULL,
  PRIMARY KEY (seance_id),
  UNIQUE KEY uk_seance_numero (numero),
  CONSTRAINT fk_seance_salle
    FOREIGN KEY (salle_id) REFERENCES salle (salle_id)
    ON DELETE RESTRICT,
      -- association ORDINAIRE : la salle survit aux seances,
      -- on refuse de la supprimer si elle en a encore
  CONSTRAINT fk_seance_animateur
    FOREIGN KEY (animateur_id) REFERENCES animateur (animateur_id)
    ON DELETE RESTRICT,
  CONSTRAINT ck_seance_places CHECK (nb_places &gt; 0),
  CONSTRAINT ck_seance_statut
    CHECK (statut IN ('programmee', 'terminee', 'annulee'))
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

-- ============ INSCRIPTION : la COMPOSITION ============
CREATE TABLE inscription (
  inscription_id   INT          NOT NULL AUTO_INCREMENT,
  seance_id        INT          NOT NULL,
      -- NOT NULL = composition : une inscription SANS seance
      -- est impossible
  membre_id        INT          NOT NULL,
  date_inscription DATETIME     NOT NULL,
  montant          DECIMAL(6,2) NOT NULL,
      -- depend du COUPLE (membre, seance) : il ne pouvait
      -- appartenir ni a membre ni a seance
  paye             TINYINT(1)   NOT NULL DEFAULT 0,
  present          TINYINT(1)   NOT NULL DEFAULT 0,
  date_annulation  DATETIME     NULL,
      -- NULL tant que l'inscription n'est pas annulee :
      -- c'est cette colonne qui rend l'etat "Annulee" DECIDABLE
  PRIMARY KEY (inscription_id),
  CONSTRAINT fk_inscription_seance
    FOREIGN KEY (seance_id) REFERENCES seance (seance_id)
    ON DELETE CASCADE,
      -- COMPOSITION : les inscriptions meurent avec leur seance
  CONSTRAINT fk_inscription_membre
    FOREIGN KEY (membre_id) REFERENCES membre (membre_id)
    ON DELETE RESTRICT
      -- le Membre SURVIT : surtout pas de cascade ici
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

-- ============ SEANCE_JEU : l'association *..* ============
CREATE TABLE seance_jeu (
  seance_id      INT NOT NULL,
  jeu_id         INT NOT NULL,
  nb_exemplaires INT NOT NULL DEFAULT 1,
      -- attribut PORTE PAR L'ASSOCIATION : combien de boites
      -- de ce jeu sont mobilisees par cette seance
  PRIMARY KEY (seance_id, jeu_id),
      -- cle primaire COMPOSEE des deux cles etrangeres
  CONSTRAINT fk_sj_seance
    FOREIGN KEY (seance_id) REFERENCES seance (seance_id)
    ON DELETE CASCADE,
  CONSTRAINT fk_sj_jeu
    FOREIGN KEY (jeu_id) REFERENCES jeu (jeu_id)
    ON DELETE RESTRICT
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;</pre>
<div class="tip">Les tables <code>membre</code> et <code>jeu</code> ne sont pas recréées : elles <strong>existent déjà</strong> dans la base de la Ludothèque, avec <code>prix_location</code>, <code>caution</code>, <code>stock_location</code> et <code>stock_vente</code>. Un module nouveau se <em>greffe</em> sur le modèle existant, il ne le duplique pas. C'est la même exigence de cohérence qu'au jour 26, appliquée cette fois à la base de données.</div>

<h3>10. Ce que la base ne sait pas garantir</h3>
<p>Deux règles de l'énoncé résistent au <code>CREATE TABLE</code>, et il faut savoir dire pourquoi :</p>
<pre class="pseudo">R1 : nb_places &lt;= capacite de la salle
   Une contrainte CHECK ne peut porter que sur des colonnes de
   la MEME ligne. Ici, capacite est dans une AUTRE table.
   -&gt; solution : un TRIGGER BEFORE INSERT / BEFORE UPDATE sur
      seance, ou le controle dans la couche metier (le code
      Python le fait deja dans __init__).

R3 : on ne peut pas inscrire au-dela de nb_places
   Le nombre d'inscrits est un COMPTAGE dans une autre table,
   qui change a chaque insertion.
   -&gt; solution : transaction + SELECT ... FOR UPDATE sur la
      ligne seance, sinon deux membres prennent la derniere
      place en meme temps. C'etait deja la contrainte non
      fonctionnelle notee hier dans la description textuelle.

# A retenir : le SGBD garantit l'INTEGRITE REFERENTIELLE et les
# contraintes de LIGNE. Les regles metier qui traversent
# plusieurs tables restent la responsabilite du code.
# (Rappel : CHECK n'est reellement applique qu'a partir de
#  MySQL 8.0.16 ; avant, il etait analyse puis ignore.)</pre>

ReservationGroupe CLASSE     identite (une reservation precise),

Ecole 1 ---------- 0..* ReservationGroupe    # pour la facturation

CREATE TABLE ecole (

  adresse   VARCHAR(200) NOT NULL,
  compte    VARCHAR(34)  NULL,

) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

  ecole_id         INT          NOT NULL,

  CONSTRAINT ck_rg_effectif CHECK (effectif &gt; 0)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    solution: "-- ============================================================\n-- SERVICE D'ANIMATION — module MATERIEL\n-- Ludotheque \"Le De Bleu\"\n-- ============================================================\n\n-- ------------------------------------------------------------\n-- (a) TRI DES CANDIDATS CLASSES\n-- ------------------------------------------------------------\n-- CANDIDAT        VERDICT    MOTIF\n-- Materiel        CLASSE     identite (deux tapis identiques\n--                            restent deux tapis, chacun avec son\n--                            code d'inventaire), plusieurs\n--                            proprietes, memorise, cycle de vie\n-- ConstatDegat    CLASSE     identite (le constat du 12/03 sur la\n--                            piece M-042 est UNE chose precise),\n--                            date, description, cout estime\n-- piece           SYNONYME   c'est le Materiel. Un synonyme ne\n--                            cree JAMAIS une classe.\n-- tables, tapis,  VALEURS    ce sont des exemples de libelle,\n-- sabliers,                  pas des classes. Les modeliser en\n-- minuteurs                  sous-classes serait une erreur :\n--                            elles n'ont aucun attribut propre.\n--                            -> attribut type_materiel.\n-- etat            ATTRIBUT   valeur -> etat sur Materiel\n-- cout estime     ATTRIBUT   valeur -> cout_estime sur Constat\n-- inventaire      COLLECTION l'ensemble des Materiel : c'est le\n--                            cote \"plusieurs\" d'une association\n-- planning        VUE        resultat d'une requete, rien a\n--                            stocker de nouveau\n\n-- ------------------------------------------------------------\n-- ASSOCIATIONS ET MULTIPLICITES\n-- ------------------------------------------------------------\n-- Seance 0..*  ----------  0..* Materiel\n--   \"chaque seance mobilise du materiel\" ; un meme materiel\n--   ressert a d'autres seances -> N:N -> table d'association.\n--\n-- Seance 1  <>----------  0..* ConstatDegat      COMPOSITION\n--   \"un constat n'a plus aucun sens si la seance est supprimee\"\n--   -> la phrase de l'enonce donne litteralement le test de\n--      duree de vie. Losange PLEIN -> ON DELETE CASCADE.\n--\n-- Materiel 1  ----------  0..* ConstatDegat      association simple\n--   le materiel SURVIT au constat (il est repare, ou reforme)\n--   -> ON DELETE RESTRICT : on refuse d'effacer une piece qui\n--      porte encore un historique de degats.\n--\n-- CONTRAINTE non traduisible en cle etrangere :\n--   {une piece de materiel n'est affectee qu'a UNE seance a la\n--    fois} -> contrainte de NON-CHEVAUCHEMENT dans le temps.\n\n-- ------------------------------------------------------------\n-- (b) LES TABLES\n-- ------------------------------------------------------------\n\nCREATE TABLE materiel (\n  materiel_id     INT          NOT NULL AUTO_INCREMENT,\n  code_inventaire VARCHAR(20)  NOT NULL,\n      -- \"code d'inventaire unique\" -> contrainte UNIQUE ci-dessous.\n      -- On ne s'en sert PAS comme cle primaire : une cle metier\n      -- peut etre renumerotee, un AUTO_INCREMENT est stable.\n  libelle         VARCHAR(80)  NOT NULL,\n  type_materiel   VARCHAR(30)  NOT NULL,\n      -- 'table', 'tapis', 'sablier', 'minuteur' : un ATTRIBUT,\n      -- pas quatre sous-classes (elles n'ont rien en propre).\n  etat            VARCHAR(20)  NOT NULL DEFAULT 'bon',\n  PRIMARY KEY (materiel_id),\n  UNIQUE KEY uk_materiel_code (code_inventaire),\n  CONSTRAINT ck_materiel_etat\n    CHECK (etat IN ('neuf', 'bon', 'use', 'hors service'))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- Table d'association : traduction de l'association N:N.\n-- Elle porte son propre attribut (quantite mobilisee).\nCREATE TABLE seance_materiel (\n  seance_id   INT NOT NULL,\n  materiel_id INT NOT NULL,\n  quantite    INT NOT NULL DEFAULT 1,\n  PRIMARY KEY (seance_id, materiel_id),\n      -- cle primaire COMPOSEE des deux cles etrangeres :\n      -- elle interdit d'affecter deux fois la meme piece a la\n      -- meme seance.\n  CONSTRAINT fk_sm_seance\n    FOREIGN KEY (seance_id) REFERENCES seance (seance_id)\n    ON DELETE CASCADE,\n      -- l'affectation n'a plus de sens sans la seance\n  CONSTRAINT fk_sm_materiel\n    FOREIGN KEY (materiel_id) REFERENCES materiel (materiel_id)\n    ON DELETE RESTRICT\n      -- le materiel SURVIT : on refuse de l'effacer s'il est\n      -- encore affecte a une seance\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE constat_degat (\n  constat_id   INT          NOT NULL AUTO_INCREMENT,\n  seance_id    INT          NOT NULL,\n      -- NOT NULL = COMPOSITION : un constat sans seance est\n      -- impossible, la cle etrangere ne peut pas manquer.\n  materiel_id  INT          NOT NULL,\n  date_constat DATETIME     NOT NULL,\n  description  VARCHAR(255) NOT NULL,\n  cout_estime  DECIMAL(8,2) NOT NULL DEFAULT 0.00,\n      -- DECIMAL et non FLOAT : c'est de l'argent.\n  PRIMARY KEY (constat_id),\n  CONSTRAINT fk_constat_seance\n    FOREIGN KEY (seance_id) REFERENCES seance (seance_id)\n    ON DELETE CASCADE,\n      -- COMPOSITION : le constat meurt avec sa seance\n  CONSTRAINT fk_constat_materiel\n    FOREIGN KEY (materiel_id) REFERENCES materiel (materiel_id)\n    ON DELETE RESTRICT,\n      -- association ORDINAIRE : le materiel survit au constat\n  CONSTRAINT ck_constat_cout CHECK (cout_estime >= 0)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ------------------------------------------------------------\n-- (c) CE QUE LA BASE NE SAIT PAS GARANTIR\n-- ------------------------------------------------------------\n-- REGLE : \"une piece ne peut servir qu'a UNE SEULE seance a la\n--          fois\".\n--\n-- Pourquoi la base seule n'y arrive pas :\n--   - la cle primaire composee de seance_materiel empeche le\n--     doublon (meme piece, meme seance), mais elle n'empeche PAS\n--     d'affecter la piece M-042 a deux seances differentes qui\n--     se deroulent le meme jour a la meme heure ;\n--   - un CHECK ne voit que les colonnes de SA ligne : il ne peut\n--     pas consulter date_heure dans la table seance ;\n--   - c'est une contrainte de NON-CHEVAUCHEMENT temporel, qui\n--     suppose de comparer des intervalles entre plusieurs lignes\n--     de plusieurs tables.\n--\n-- Solutions possibles, par ordre de robustesse :\n--   1. TRIGGER BEFORE INSERT / BEFORE UPDATE sur\n--      seance_materiel : rechercher toute autre seance affectee\n--      a ce materiel dont le creneau recouvre celui demande, et\n--      lever une erreur avec SIGNAL SQLSTATE '45000'.\n--   2. Controle dans la couche metier, dans une methode\n--      Seance.affecter_materiel(m), a l'interieur d'une\n--      TRANSACTION avec SELECT ... FOR UPDATE, sinon deux\n--      affectations simultanees passent toutes les deux.\n--   3. Ajouter date_debut / date_fin a l'affectation et poser\n--      un index couvrant, pour rendre le controle rapide.\n--\n-- A RETENIR : le SGBD garantit l'INTEGRITE REFERENTIELLE et les\n-- contraintes de LIGNE. Toute regle metier qui traverse\n-- plusieurs lignes ou plusieurs tables reste a la charge du\n-- code ou d'un trigger. Le dire explicitement fait partie de la\n-- conception : une regle qu'on croit garantie et qui ne l'est\n-- pas est pire qu'une regle qu'on sait devoir coder.",
    note: "Plusieurs variantes sont acceptables : tu peux nommer la table degat plutôt que constat_degat, ajouter une colonne reparé, ou porter la quantité autrement. Ce qui est évalué : le tri motivé des candidats avec le vocabulaire du cours (synonyme, attribut, valeur), la traduction correcte de l'association N:N par une table à clé primaire composée, l'emploi de CASCADE strictement réservé à la composition et de RESTRICT ailleurs, la syntaxe MySQL valide (AUTO_INCREMENT, contraintes nommées, ENGINE=InnoDB), et surtout l'honnêteté finale sur la règle que la base ne peut pas tenir seule." }
  ]
