  theory: `
<h3>1. Pourquoi un diagramme de plus ?</h3>
<p>Tu sais décrire des classes, leurs associations, leurs paquetages. Mais quand la Ludothèque grossit, la question du chef de projet n'est plus « quelles classes existent ? » : elle devient « en combien de <strong>morceaux livrables</strong> ce logiciel est-il découpé, et qui dépend de qui ? ». Si l'équipe qui refait l'écran du comptoir casse la gestion des locations, c'est que le découpage était mauvais.</p>
<p>Le <strong>diagramme de composants</strong> (sigle <strong>DCP</strong> dans ton cours d'école) répond à cette question. Il est <strong>structurel</strong> : il montre l'organisation du logiciel en briques et les <strong>contrats</strong> qu'elles passent entre elles.</p>
<div class="tip">Retiens la nuance dès maintenant : le diagramme de classes montre le système <em>vu du développeur</em> (les concepts), le diagramme de composants le montre <em>vu de l'architecte</em> (les briques remplaçables). Demain, le diagramme de déploiement le montrera <em>vu de l'exploitant</em> (les machines).</div>

<h3>2. Qu'est-ce qu'un composant ?</h3>
<p>UML 2.5.1 définit un <strong>composant</strong> comme une <strong>unité logicielle modulaire et remplaçable</strong>, qui encapsule son contenu et dont on ne connaît de l'extérieur que ses <strong>interfaces</strong>. Les trois mots comptent :</p>
<pre class="pseudo">modulaire    # il a une frontiere nette, on sait ou il commence et ou il finit
remplacable  # on peut le substituer par un autre qui respecte les MEMES interfaces
encapsule    # son interieur ne regarde personne : on ne voit que le contrat</pre>
<p>« Remplaçable » est le critère décisif. Si tu peux échanger ton module <code>Paiement</code> contre celui d'un prestataire bancaire sans toucher au reste, tu as un vrai composant. Sinon, tu as juste un dossier de fichiers.</p>

<h3>3. Deux notations pour un composant</h3>
<p>UML autorise <strong>deux écritures équivalentes</strong>. La première est un classifieur (un rectangle) portant le <strong>mot-clé</strong> <code>&laquo;component&raquo;</code> devant son nom :</p>
<pre class="pseudo">   +--------------------------+
   |      &laquo;component&raquo;         |     # le mot-cle, entre guillemets francais
   |        Catalogue         |
   +--------------------------+</pre>
<p>La seconde est l'<strong>icône de module</strong> : un rectangle auquel s'accrochent <strong>deux petits rectangles sur le flanc gauche</strong>. C'est le vieux symbole, hérité d'UML 1, que tout le monde reconnaît :</p>
<pre class="pseudo">      +----------------------------+
      |                            |
   +--+                            |
   |  |                            |   # icone de MODULE :
   +--+        Catalogue           |   # deux petits rectangles
   |  |                            |   # accroches au flanc GAUCHE
   +--+                            |
      |                            |
      +----------------------------+</pre>
<p>Les outils modernes combinent souvent les deux : le mot-clé <code>&laquo;component&raquo;</code> dans le rectangle, plus une petite icône de module dans le coin supérieur droit. Les trois formes sont acceptées ; ne mélange pas plusieurs styles dans un même diagramme.</p>

<h3>4. Interface fournie et interface requise</h3>
<p>Un composant seul ne dit rien. Ce qui l'intéresse, ce sont ses <strong>points de contact</strong>. UML en distingue deux, et leur symbole est le cœur de ce diagramme :</p>
<pre class="pseudo">Interface FOURNIE   -> trait termine par un CERCLE PLEIN   (la "boule", lollipop)
                       "voici ce que je sais faire pour toi"

Interface REQUISE   -> trait termine par un DEMI-CERCLE    (la "prise", socket)
                       "voici ce dont j'ai besoin des autres"</pre>
<pre class="pseudo">   +--------------------+                    +-----------------------+
   |    &laquo;component&raquo;     |                    |     &laquo;component&raquo;       |
   |     Catalogue      |---O                |    GestionLocation    |
   +--------------------+   ^                +-----------------------+
                            |                     |
                        ICatalogue                |
                       (FOURNIE : boule)          (---
                                                    ^
                                              ICatalogue
                                            (REQUISE : prise)</pre>
<p>Lis toujours le symbole comme une <strong>phrase</strong> : la boule dit « je fournis », la prise dit « j'exige ». Le nom écrit à côté du symbole est celui de l'<strong>interface</strong>, pas celui du composant.</p>
<div class="tip">Moyen mnémotechnique : la <strong>boule</strong> est pleine, elle <em>donne</em> quelque chose ; la <strong>prise</strong> est creuse, elle <em>attend</em> qu'on la remplisse.</div>

<h3>5. Le connecteur d'assemblage</h3>
<p>Quand la boule d'un composant s'emboîte dans la prise d'un autre, on obtient un <strong>connecteur d'assemblage</strong> (<em>assembly connector</em>). C'est la façon la plus lisible de dire « ce composant-ci utilise le service de celui-là » :</p>
<pre class="pseudo">   +--------------------+                    +-----------------------+
   |     Catalogue      |---O(---------------|    GestionLocation    |
   +--------------------+   ^                +-----------------------+
                       ICatalogue
   # La BOULE (fournie par Catalogue) est emboitee dans la PRISE
   # (requise par GestionLocation) : c'est un CONNECTEUR D'ASSEMBLAGE.
   # Lecture : GestionLocation consomme ICatalogue, que Catalogue fournit.</pre>
<p>L'intérêt pratique : si demain tu remplaces <code>Catalogue</code> par <code>CatalogueExterne</code>, tant que la nouvelle brique fournit <code>ICatalogue</code>, <code>GestionLocation</code> ne bouge pas d'une ligne. Le connecteur d'assemblage matérialise cette <strong>substituabilité</strong>.</p>
<p>Une écriture alternative existe, plus proche du diagramme de classes : une <strong>dépendance en pointillé</strong> avec le mot-clé <code>&laquo;use&raquo;</code> allant du composant client vers l'interface. Les deux disent la même chose ; la boule et la prise sont simplement plus parlantes.</p>

<h3>6. Boîte noire et boîte blanche</h3>
<p>Ton cours d'école insiste sur ces deux <strong>représentations</strong> d'un même composant, et il a raison : elles répondent à deux publics différents.</p>
<pre class="pseudo"># BOITE NOIRE : on ne montre QUE les interfaces (le contrat)
   +--------------------+
   |    &laquo;component&raquo;     |---O ICatalogue        # ce que je fournis
   |     Catalogue      |
   |                    |(--- IPersistance      # ce que j'exige
   +--------------------+
   # Public vise : l'architecte, l'equipe voisine, le client.
   # Message : "peu importe comment c'est fait, voila le contrat".

# BOITE BLANCHE : on ouvre le composant et on montre son CONTENU
   +---------------------------------------------------+
   |  &laquo;component&raquo; Catalogue                            |
   |    +------------+  +------------+  +------------+  |
   |    |    Jeu     |  | Categorie  |  | Exemplaire |  |  <- classificateurs
   |    +------------+  +------------+  +------------+  |
   |    +--------------------------------------------+  |
   |    |  &laquo;artifact&raquo; catalogue.jar                 |  |  <- artefact
   |    +--------------------------------------------+  |
   +---------------------------------------------------+
   # Public vise : l'equipe qui developpe CE composant.
   # Message : "voici les classes et les fichiers qui l'implementent".</pre>
<p>La boîte blanche peut aussi lister le contenu sous forme d'une simple <strong>liste de classificateurs</strong> écrite dans un compartiment du rectangle. C'est plus compact, et souvent suffisant.</p>

<h3>7. Ports et connecteur de délégation</h3>
<p>Un <strong>port</strong> se note par un <strong>petit carré posé sur la bordure</strong> du composant. Il représente un point d'interaction nommé et typé : au lieu d'accrocher les interfaces directement au bord, on les accroche à un port. Cela permet à un composant d'exposer plusieurs points d'entrée distincts.</p>
<pre class="pseudo">   +----------------------------------------------------+
   |  &laquo;component&raquo; GestionLocation                      |
   |                                                    |
 [ ]--------------+                    +-------------+  |
   |  ^           |                    |             |  |
   |  |     +-----v--------+           | CalculPrix  |  |
   |  |     | ContratLoc   |           |             |  |
   |  |     +--------------+           +-------------+  |
   |  |                                                 |
   +--|-------------------------------------------------+
      |
   PORT : petit carre sur la BORDURE.
   Le trait qui va du port vers la partie interne ContratLoc
   est un CONNECTEUR DE DELEGATION : il dit "tout ce qui arrive
   par ce port est traite, en interne, par ContratLoc".</pre>
<p>Le <strong>connecteur de délégation</strong> ne transporte rien lui-même : il <em>redirige</em>. Il relie toujours un <strong>port externe</strong> à une <strong>partie interne</strong> (ou à un port de cette partie). Ne le confonds pas avec le connecteur d'assemblage, qui relie deux éléments de <strong>même niveau</strong>.</p>
<div class="tip">Deux connecteurs, deux directions : <strong>assemblage = horizontal</strong> (entre pairs, boule dans prise) ; <strong>délégation = vertical</strong> (de la frontière vers l'intérieur). Tu retrouveras exactement ces deux connecteurs après-demain, au jour 24.</div>

<h3>8. L'architecture logicielle de la Ludothèque</h3>
<p>Appliquons tout cela au fil rouge. Le site de la Ludothèque est une application web adossée à une base MySQL. On la découpe en cinq composants :</p>
<pre class="pseudo"># Les cinq briques et leur contrat
IHM              fournit : (rien vers l'interieur)
                 requiert: ILocation, ICatalogue
GestionLocation  fournit : ILocation
                 requiert: ICatalogue, IPersistance, IPaiement
Catalogue        fournit : ICatalogue
                 requiert: IPersistance
Paiement         fournit : IPaiement
                 requiert: IPersistance
Persistance      fournit : IPersistance
                 requiert: (rien : c'est la couche basse)</pre>
<pre class="pseudo"># Le diagramme, en boite noire
   +---------+
   |   IHM   |(--------------O+-------------------+
   +---------+  ILocation     |  GestionLocation  |
        |                     +-------------------+
        |                          |         |
        |(---------O+-----------+  |         |
        ICatalogue  | Catalogue |(-+         |(--------O+----------+
                    +-----------+  |          IPaiement | Paiement |
                          |        |                    +----------+
                          |(-------+---------------------------|
                                IPersistance                   |
                                     |                         |
                              +--------------+                 |
                              | Persistance  |O----------------+
                              +--------------+
# Lecture : l'IHM ne parle JAMAIS a Persistance directement.
# Elle passe par GestionLocation et Catalogue. C'est une architecture
# en COUCHES : chaque niveau ne connait que le niveau juste en dessous.</pre>
<p>Observe ce que ce diagramme rend visible et que le diagramme de classes cachait : la <strong>direction des dépendances</strong>. <code>Persistance</code> ne connaît personne — c'est elle qui sait parler à MySQL et charger <code>Jeu</code>, <code>Membre</code>, <code>Location</code>. Si tu passais de MySQL à PostgreSQL, un seul composant changerait.</p>
<div class="tip">Un bon test de découpage : trace toutes les flèches de dépendance. Si tu trouves un <strong>cycle</strong> (A dépend de B qui dépend de A), c'est que ta frontière est mal placée : ces deux composants n'en font en réalité qu'un.</div>

<h3>9. Ce que dit ton support d'école, et ce qu'il ne dit pas</h3>
<div class="warn"><strong>Écarts avec le support du PAC.</strong> Trois points à connaître pour l'examen comme pour la pratique.<br><br>
1. Le support <strong>ne nomme pas le connecteur de délégation</strong> : il dessine parfois des ports mais sans expliquer le trait qui va du port vers l'intérieur. Or ce connecteur a un nom normalisé, et il est indispensable dès qu'on ouvre un composant.<br><br>
2. Le support <strong>ne traite pas les composants imbriqués</strong> : en UML 2.5.1, un composant peut en contenir d'autres, ce qui permet une architecture à plusieurs niveaux de zoom. C'est précisément ce que permet la vue « boîte blanche ».<br><br>

<p>Demain, on descend d'un cran vers le réel : sur quelle machine tourne chacune de ces briques, et sous quelle forme de fichier ? C'est le diagramme de déploiement.</p>`,

    solution: "@startuml\n' ================================================================\n' Diagramme de composants (DCP) - Ludotheque \"Le De Bleu\"\n' Vue BOITE NOIRE : on ne montre que les contrats, pas l'interieur.\n' ================================================================\n\n' --- Les cinq briques logicielles ---\ncomponent [IHM] as IHM <<component>>\ncomponent [GestionLocation] as GL <<component>>\ncomponent [Catalogue] as CAT <<component>>\ncomponent [Paiement] as PAY <<component>>\ncomponent [Persistance] as PER <<component>>\n\n' --- Les interfaces echangees ---\n' Une interface = un CONTRAT. Elle est fournie par UN composant\n' et requise par un ou plusieurs autres.\ninterface \"ILocation\" as ILOC\ninterface \"ICatalogue\" as ICAT\ninterface \"IPaiement\" as IPAY\ninterface \"IPersistance\" as IPER\n\n' --- Interfaces FOURNIES : trait plein (la \"boule\") ---\nGL  -up- ILOC\n' GestionLocation sait louer, rendre, reserver -> il FOURNIT ILocation\nCAT -up- ICAT\n' Catalogue connait Jeu, Categorie, Exemplaire, stock_location\n' et stock_vente -> il FOURNIT ICatalogue\nPAY -up- IPAY\n' Paiement encaisse les ventes, prend et rend la caution -> IPaiement\nPER -up- IPER\n' Persistance parle a MySQL -> IPersistance. C'est la couche BASSE :\n' elle ne requiert rien de personne.\n\n' --- Interfaces REQUISES : dependance pointillee (la \"prise\") ---\nIHM ..> ILOC : use\n' L'ecran du comptoir declenche une location\nIHM ..> ICAT : use\n' L'ecran affiche la fiche d'un jeu et son stock\n\nGL ..> ICAT : use\n' Pour louer, il faut verifier le stock_location du jeu\nGL ..> IPAY : use\n' Pour louer, il faut encaisser prix_location et bloquer la caution\nGL ..> IPER : use\n' Il faut enregistrer la Location et la Reservation\n\nCAT ..> IPER : use\n' Il faut lire et ecrire Jeu, Categorie, Exemplaire\nPAY ..> IPER : use\n' Il faut enregistrer la Vente et le mouvement de caution\n@enduml\n\n' ================================================================\n' JUSTIFICATION DES CHOIX\n' ================================================================\n' 1. ARCHITECTURE EN COUCHES\n'    IHM -> (GestionLocation, Catalogue) -> Persistance\n'    Chaque niveau ne connait que le niveau juste en dessous.\n'    L'IHM n'atteint JAMAIS Persistance directement : si demain on\n'    ajoute une regle metier (ex. plafonner le nombre de locations\n'    simultanees d'un Membre), elle se place dans GestionLocation\n'    et l'IHM n'a pas a le savoir.\n'\n' 2. AUCUN CYCLE\n'    Si Catalogue dependait de GestionLocation, qui depend deja de\n'    Catalogue, on aurait un cycle : les deux briques ne seraient en\n'    realite qu'une seule, impossible a livrer separement.\n'\n' 3. SUBSTITUABILITE\n'    Persistance est le seul composant qui connaisse MySQL. Passer a\n'    PostgreSQL = remplacer cette brique par une autre fournissant\n'    la MEME interface IPersistance. Rien d'autre ne bouge.\n'    De meme, changer de prestataire bancaire = remplacer Paiement.\n'\n' 4. MOTS-CLES EN ANGLAIS\n'    On ecrit <<component>> et \"use\", pas <<composant>> ni <<utilise>> :\n'    ce sont des mots-cles du metamodele UML, reconnus par les outils.\n'\n' 5. POUR ALLER PLUS LOIN (vue BOITE BLANCHE)\n'    On pourrait ouvrir Catalogue et y montrer les classificateurs\n'    Jeu, Categorie, Exemplaire ainsi que l'artefact catalogue.jar.\n'    Un PORT (petit carre sur la bordure) plus un CONNECTEUR DE\n'    DELEGATION relierait alors ICatalogue a la classe qui l'implemente.",
