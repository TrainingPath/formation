  theory: `
<h3>1. Vingt-cinq jours de diagrammes, et maintenant ?</h3>
<p>Tu sais dessiner les quatorze diagrammes d'UML 2.5.1. Tu sais qu'un diagramme de classes décrit la structure, qu'un diagramme de séquence décrit une interaction, qu'une machine à états décrit le cycle de vie d'un objet. Il te manque la chose la plus importante — et celle qu'on enseigne le moins.</p>
<p>Ces diagrammes ne sont pas <strong>quatorze descriptions indépendantes</strong>. Ce sont <strong>quatorze vues d'un seul et même système</strong>. Une <code>Location</code> qui apparaît dans ton diagramme de classes, dans ton diagramme de séquence, dans ta machine à états et dans ton diagramme de déploiement, c'est <em>la même Location</em>. Si elle n'a pas les mêmes propriétés d'un dessin à l'autre, ton modèle est faux — même si chaque dessin, pris isolément, est impeccable.</p>
<div class="tip">La formule à retenir pour toute la journée : <strong>un diagramme juste tout seul peut faire partie d'un modèle faux.</strong> La justesse d'un modèle ne se lit sur aucun diagramme pris isolément : elle se lit <em>entre</em> les diagrammes.</div>

<h3>2. Le mot du métier : la traçabilité</h3>
<p>On appelle <strong>traçabilité</strong> la propriété d'un modèle dans lequel chaque élément peut être <strong>retrouvé et justifié</strong> dans les autres vues. Une classe tracée, c'est une classe dont on peut dire : elle vient de tel besoin, elle rend tel service dans telle interaction, elle est rangée dans tel paquetage, elle est livrée dans tel artefact.</p>
<pre class="pseudo"># Ce que la tracabilite garantit, dans les deux sens
Vers l'AVAL   : ce besoin exprime par le client, ou est-il realise ?
                (cas d'utilisation -&gt; classes -&gt; composant -&gt; artefact)
Vers l'AMONT  : cette classe que je vois dans le modele,
                a quel besoin repond-elle ?
                (si la reponse est "a aucun", elle est de trop)</pre>
<p>La traçabilité vers l'amont est la plus impitoyable : une classe qui ne sert dans <em>aucun</em> scénario est soit inutile, soit le signe qu'un scénario a été oublié. Dans les deux cas, tu viens d'apprendre quelque chose.</p>

<h3>3. Règle 1 — Un acteur doit réapparaître comme ligne de vie</h3>
<p>Un <strong>acteur</strong> du diagramme de cas d'utilisation représente quelqu'un ou quelque chose qui échange avec le système. Si ce quelqu'un échange, il <strong>envoie et reçoit des messages</strong>. Donc, dans les diagrammes de séquence qui décrivent les scénarios de ce cas, il doit exister une <strong>ligne de vie</strong> qui le porte.</p>
<pre class="pseudo"># Cas d'utilisation "Louer un jeu"
Acteur principal   : Membre
Acteur secondaire  : Systeme de paiement

# Diagramme de sequence du scenario nominal : les lignes de vie
:Membre     :IHMGuichet    :Location    :Exemplaire   :SystemePaiement
   |             |             |             |               |
   |--louer()---&gt;|             |             |               |
   |             |--creer()---&gt;|             |               |
   |             |             |--reserver()-&gt;|              |
   |             |--bloquerCaution()------------------------&gt;|
   |             |&lt;--confirmation()-------------------------|

# CONTROLE : Membre est present    -&gt; OK
#            SystemePaiement present -&gt; OK
# Si SystemePaiement n'apparaissait dans AUCUN scenario,
# il ne serait pas un acteur : il faudrait le retirer du DCU.</pre>
<p>La réciproque est vraie et tout aussi utile : une ligne de vie qui représente un <strong>rôle humain ou un système externe</strong> et qui ne figure sur <em>aucun</em> diagramme de cas d'utilisation signale un acteur oublié à l'analyse.</p>
<div class="warn">Attention à ne pas surinterpréter la règle. Toutes les lignes de vie ne sont pas des acteurs : <code>:Location</code>, <code>:Exemplaire</code>, <code>:IHMGuichet</code> sont des objets <em>internes</em> au système. La règle dit qu'un acteur doit apparaître comme ligne de vie, pas que toute ligne de vie doit être un acteur.</div>

<h3>4. Règle 2 — Un cas d'utilisation doit être décrit dynamiquement</h3>
<p>Une ellipse est un titre, rien de plus. « Louer un jeu » ne dit ni dans quel ordre, ni sous quelles conditions, ni ce qui se passe en cas d'échec. Un cas d'utilisation retenu dans la frontière doit donc être <strong>développé par au moins un diagramme d'activités ou un diagramme de séquence</strong> — le plus souvent, une description textuelle <em>plus</em> l'un des deux.</p>
<pre class="pseudo"># Regle de couverture, cas par cas
Louer un jeu            -&gt; description textuelle + DSE nominal + DAC
Rendre un exemplaire    -&gt; description textuelle + DSE nominal
S'authentifier          -&gt; DSE (cas inclus, partage par 3 cas)
Consulter le catalogue  -&gt; RIEN
   ^^^^^^^^^^^^^^^^^^^^^^^^^ ANOMALIE : soit ce cas est trivial et
   n'aurait pas du entrer dans la frontiere, soit on a oublie de
   le decrire. Les deux reponses sont acceptables, l'absence de
   reponse ne l'est pas.</pre>
<p>Le diagramme d'activités convient quand le cas est un <strong>processus</strong> (des étapes, des décisions, du parallélisme). Le diagramme de séquence convient quand le cas est un <strong>dialogue</strong> entre objets identifiés. Beaucoup de cas méritent les deux : l'activité pour le métier, la séquence pour la conception.</p>

<h3>5. Règle 3 — Un message reçu doit être une opération de la classe</h3>
<p>Voici la règle la plus opérationnelle du cours, celle qui te fera <strong>trouver des trous dans ta conception</strong>. Elle tient en une phrase :</p>
<div class="tip"><strong>Tout message reçu par une ligne de vie dans un diagramme de séquence doit correspondre à une opération déclarée dans la classe de cette ligne de vie</strong> — même nom, paramètres compatibles, visibilité suffisante.</div>
<p>La raison est simple : un message reçu, c'est un appel. Si l'objet ne sait pas répondre, il n'y a rien à appeler. Un message sans opération correspondante est du <em>vœu pieux</em> dessiné sur un diagramme.</p>
<pre class="pseudo"># DIAGRAMME DE SEQUENCE — scenario "Rendre un exemplaire en retard"
:Employe    :Location     :Exemplaire    :Membre
   |            |              |            |
   |--cloturer(d)-&gt;|          |            |
   |            |--calculerPenalite(d)      |     &lt;-- message RECU
   |            |   (auto-appel)            |         par :Location
   |            |--marquerRendu()-&gt;|        |     &lt;-- recu par :Exemplaire
   |            |--debiterCaution(p)-------&gt;|     &lt;-- recu par :Membre

# DIAGRAMME DE CLASSES — ce qui existe reellement
   Location  : + creer(), + cloturer(d : Date), + estEnRetard()
   Exemplaire: + marquerLoue(), + marquerRendu()
   Membre    : + estAJour(), + deposerCaution(m : Real)

# CONFRONTATION, message par message
cloturer(d)          -&gt; Location.cloturer(d)        OK
calculerPenalite(d)  -&gt; Location.???                MANQUANTE
marquerRendu()       -&gt; Exemplaire.marquerRendu()   OK
debiterCaution(p)    -&gt; Membre.???                  MANQUANTE</pre>
<p>Deux opérations manquantes. Et surtout : <strong>ce ne sont pas des oublis de dessin, ce sont des oublis de conception</strong>. Le jour où tu codes, tu découvres que rien ne calcule la pénalité et que rien ne sait retirer de l'argent de la caution. Deux règles métier entières n'ont pas de propriétaire.</p>
<p>La correction consiste à ajouter les deux opérations — et surtout à se demander <strong>si elles sont au bon endroit</strong> :</p>
<pre class="pseudo">   Location  : + calculerPenalite(dateRetour : Date) : Real
               # legitime ici : la penalite depend de date_debut,
               # date_prevue et du tarif de la Location. C'est
               # bien la Location qui possede l'information.
   Membre    : + debiterCaution(montant : Real) : void
               # legitime ici : la caution est un attribut du
               # Membre, seul le Membre doit pouvoir la modifier
               # (encapsulation).</pre>
<div class="warn">L'erreur inverse existe aussi et se corrige à l'envers : une opération publique du diagramme de classes qu'<strong>aucun message n'appelle jamais</strong>, dans aucun scénario. Ce n'est pas forcément une faute — elle peut servir à une évolution prévue — mais c'est toujours une question à poser. Souvent, c'est du code mort dessiné avant d'être écrit.</div>

<h3>6. Règle 4 — Un état doit être justifiable par les attributs</h3>
<p>Une machine à états décrit les états successifs d'un objet d'<strong>une classe précise</strong>. Or un état n'est rien d'autre qu'une <strong>condition sur les valeurs des attributs</strong> de cet objet. Donc : pour chaque état, tu dois pouvoir écrire la condition qui le caractérise, en n'employant que des attributs qui <em>existent</em> dans le diagramme de classes.</p>
<pre class="pseudo"># MACHINE A ETATS de la classe Location
[*] --&gt; EnCours --&gt; Cloturee --&gt; [*]
         |
         +--&gt; EnRetard --&gt; Cloturee

# JUSTIFICATION DE CHAQUE ETAT PAR LES ATTRIBUTS
EnCours   : dateRetourReelle = null
EnRetard  : dateRetourReelle = null ET dateFin &lt; aujourd'hui
Cloturee  : dateRetourReelle != null

# Attributs necessaires -&gt; dateFin, dateRetourReelle
# Si la classe Location ne declare PAS dateFin, l'etat EnRetard
# est INDECIDABLE : le systeme ne peut pas savoir qu'il y est.
# L'etat n'est pas "mal dessine", il est IMPOSSIBLE A CALCULER.</pre>
<p>C'est le test le plus rapide qui soit sur une machine à états : prends chaque état, écris sa condition, et vérifie que tous les attributs cités figurent bien dans la classe. Un état qu'on ne peut pas exprimer est un état qu'on ne pourra pas coder.</p>
<div class="tip">Même contrôle sur les <strong>transitions</strong> : un événement de transition doit correspondre à une opération de la classe (ou à un signal reçu), et une garde <code>[stockLocation &gt; 0]</code> doit citer des attributs existants. Une garde qui invente un attribut est aussi fausse qu'un état qui en invente un.</div>

<h3>7. Règle 5 — De la classe au paquetage, au composant, à l'artefact</h3>
<p>Une classe n'existe pas en apesanteur. Elle est <strong>rangée</strong> quelque part, <strong>livrée</strong> dans quelque chose, <strong>déployée</strong> sur une machine. La chaîne architecturale doit être complète, sans maillon manquant :</p>
<pre class="pseudo">CLASSE      Location
   |  appartient a
PAQUETAGE   Metier::Locations
   |  est realise par
COMPOSANT   &lt;&lt;component&gt;&gt; GestionPrets
   |  est manifeste par
ARTEFACT    &lt;&lt;artifact&gt;&gt; ludotheque-metier.jar
   |  est deploye sur
NOEUD       &lt;&lt;device&gt;&gt; ServeurApplicatif

# CONTROLE : remonte la chaine depuis n'importe quel artefact
# deploye, tu dois retomber sur des classes du diagramme de
# classes ; descends depuis n'importe quelle classe, tu dois
# arriver sur une machine reelle.</pre>
<p>Deux anomalies typiques, et ce qu'elles veulent dire :</p>
<pre class="pseudo">Une classe dans AUCUN paquetage
   -&gt; le modele n'est pas organise ; a 40 classes, il devient
      illisible. Symptome benin, mais annonciateur.

Une classe dans AUCUN composant / artefact deploye
   -&gt; personne ne livrera son code. Symptome grave : la classe
      existe sur le papier et n'existera jamais sur une machine.</pre>

<h3>8. Règle 6 — Les multiplicités doivent tenir face au diagramme d'objets</h3>
<p>Le diagramme d'objets est un <strong>instantané</strong> : des objets réels, avec leurs valeurs, reliés par des liens. C'est le <strong>banc d'essai</strong> du diagramme de classes. Chaque lien qu'il montre doit être autorisé par une association du diagramme de classes, et le nombre de liens doit rester dans les bornes des multiplicités.</p>
<pre class="pseudo"># DIAGRAMME DE CLASSES
   Membre  1 -------- 0..3  Location      # "au plus 3 locations"
   Jeu     1 -------- 1..*  Exemplaire

# DIAGRAMME D'OBJETS (un instantane du 2 aout)
   dupont:Membre --- loc12:Location
   dupont:Membre --- loc19:Location
   dupont:Membre --- loc23:Location
   dupont:Membre --- loc31:Location       # QUATRIEME lien !

# CONFRONTATION : 4 liens la ou la multiplicite dit 0..3.
# L'un des deux ment. Deux corrections possibles, PAS TROIS :
#   (a) la regle metier est bien "3 max" -&gt; le diagramme
#       d'objets illustre un cas INTERDIT, il faut le corriger
#       (et le systeme devra refuser la 4e location) ;
#   (b) la regle metier a change (les membres premium ont droit
#       a 5 locations) -&gt; c'est la MULTIPLICITE qui est perimee.
# Ce qu'on ne peut pas faire : laisser les deux tels quels.</pre>
<div class="warn">Un diagramme d'objets n'est jamais « un cas particulier qui n'a pas à respecter le modèle ». S'il montre quelque chose d'interdit, soit il est faux, soit le modèle l'est. Cette confrontation est d'ailleurs la <strong>seule</strong> façon de tester un diagramme de classes sans écrire une ligne de code.</div>

<h3>9. La relecture croisée : une méthode, pas une intuition</h3>
<p>Les six règles ne servent à rien si tu les appliques « au feeling ». Voici la procédure de <strong>relecture croisée</strong>, à dérouler mécaniquement, dans cet ordre. Elle prend une demi-heure sur un modèle d'école et t'évite des semaines de reprise sur un vrai projet.</p>
<pre class="pseudo"># PROCEDURE DE RELECTURE CROISEE

Etape 1 — Inventaire des acteurs
  Lister les acteurs du DCU. Pour chacun, verifier qu'il apparait
  comme ligne de vie dans au moins un DSE.

Etape 2 — Couverture des cas
  Lister les cas d'utilisation. Pour chacun, cocher : description
  textuelle ? DAC ? DSE ? Toute ligne sans aucune coche est
  une anomalie.

Etape 3 — Confrontation messages / operations   [LA PLUS RENTABLE]
  Pour chaque DSE :
    a. relever TOUS les messages, dans l'ordre ;
    b. pour chaque message, noter la ligne de vie DESTINATAIRE ;
    c. ouvrir la classe de ce destinataire dans le DCL ;
    d. chercher une operation de meme nom ;
    e. si absente : soit on l'ajoute, soit le message est faux.
  Puis dans l'autre sens : toute operation publique jamais
  appelee est signalee (pas forcement supprimee).

Etape 4 — Etats et attributs
  Pour chaque etat d'une machine a etats, ecrire la condition sur
  les attributs. Verifier que ces attributs existent dans la classe.

Etape 5 — Chaine architecturale
  Pour chaque classe : paquetage ? composant ? artefact ? noeud ?

Etape 6 — Instantane
  Confronter le diagramme d'objets aux multiplicites du DCL.</pre>
<p>L'étape 3 mérite d'être formalisée dans un <strong>tableau de confrontation</strong>, qu'on peut poser tel quel sur une copie d'examen :</p>
<pre class="pseudo">DSE "Reserver un jeu indisponible"

MESSAGE                DESTINATAIRE   OPERATION DANS LE DCL   VERDICT
reserver(j, m)         :Reservation   creer(...)              A RENOMMER
estDisponible()        :Jeu           + estDisponible()       OK
placerEnAttente(m)     :Jeu           ---                     MANQUANTE
notifierDisponible()   :Membre        ---                     MANQUANTE
annuler()              :Reservation   + annuler()             OK</pre>
<p>Regarde la troisième ligne. <code>placerEnAttente(m)</code> n'existe pas dans <code>Jeu</code>. Mais en cherchant où la mettre, une question surgit : <strong>qui mémorise la file d'attente ?</strong> Ni <code>Jeu</code> ni <code>Membre</code> n'a d'attribut pour cela. On ne découvre pas une opération manquante : on découvre qu'il manque une <strong>notion entière</strong> — la file d'attente, avec son ordre d'arrivée, sa date de mise en attente, sa durée de validité.</p>
<div class="tip">C'est exactement l'effet recherché. Une incohérence bien traquée ne se contente pas de corriger un dessin : elle <strong>révèle un oubli d'analyse</strong>. La quatrième ligne le confirme — <code>notifierDisponible()</code> suppose qu'on sache joindre le membre, donc un canal de notification, donc peut-être un acteur secondaire « Service de messagerie » absent du diagramme de cas d'utilisation. Une seule ligne de tableau, et voilà trois diagrammes à revoir.</div>

    intro: `<p>Un stagiaire a livré un modèle de la Ludothèque « Le Dé Bleu ». Chaque diagramme est joli. Tu vas les confronter. Voici les pièces : le diagramme de cas d'utilisation déclare les acteurs <strong>Membre</strong>, <strong>Employé</strong> et <strong>Service de messagerie</strong> ; le diagramme de séquence de « Réserver un jeu » montre les messages <code>reserver(j, m)</code> vers <code>:Reservation</code>, <code>placerEnAttente(m)</code> vers <code>:Jeu</code> et <code>notifierDisponible()</code> vers <code>:Membre</code> ; le diagramme de classes déclare <code>Reservation : + creer(), + annuler()</code>, <code>Jeu : + estDisponible()</code>, <code>Membre : + estAJour()</code> ; enfin, une machine à états de <code>Reservation</code> comporte un état <code>Expiree</code>, alors que la classe ne possède que les attributs <code>numero</code> et <code>membre</code>.</p>`,

      { type: "qcm", q: "Le message reserver(j, m) est adressé à :Reservation, dont la classe déclare creer(). Quel est le verdict de la confrontation ?", opts: ["Incohérence : il faut renommer le message ou l'opération pour qu'ils correspondent", "Cohérent : reserver et creer veulent dire la même chose", "Incohérence : il faut supprimer la classe Reservation", "Cohérent : les noms de messages sont libres en UML"], a: 0, exp: "Les noms doivent correspondre. Deux mots pour un même appel, c'est une ambiguïté qui se paiera au codage : on tranche, on renomme." },
      { type: "input", q: "Comment nomme-t-on la méthode qui consiste à parcourir chaque diagramme de séquence, lister les messages et vérifier un par un qu'ils existent comme opérations ? (deux mots)", a: ["relecture croisée", "relecture croisee", "la relecture croisée", "relecture-croisée", "relecture croisées"], ph: "deux mots", exp: "La relecture croisée se déroule mécaniquement, étape par étape ; elle remplace le compilateur, qu'un diagramme n'a pas." }
    ],
    solution: `<pre class="pseudo"># RAPPORT D'AUDIT DU MODELE — Ludotheque "Le De Bleu"

# --- Etape 3 : confrontation messages / operations ---
MESSAGE               DESTINATAIRE   OPERATION DECLAREE   VERDICT
reserver(j, m)        :Reservation   + creer()            A RENOMMER
placerEnAttente(m)    :Jeu           ---                  MANQUANTE
notifierDisponible()  :Membre        ---                  MANQUANTE

# --- Ce que chaque anomalie revele vraiment ---
1. reserver / creer : deux mots pour un meme appel.
   Correction : choisir UN nom (par exemple creer(jeu, membre))
   et l'ecrire a l'identique dans les deux diagrammes.

2. placerEnAttente(m) : en cherchant OU placer cette operation,
   on constate qu'AUCUNE classe ne peut porter l'information.
   Il manque une notion : la FILE D'ATTENTE.
   -&gt; nouvelle classe MiseEnAttente { rang : Integer,
                                      dateDemande : Date,
                                      dateValidite : Date }
   L'incoherence n'etait pas un defaut de dessin :
   c'etait un OUBLI D'ANALYSE.

3. notifierDisponible() est adresse a :Membre. Or notifier
   suppose un canal externe -&gt; l'acteur secondaire "Service de
   messagerie" du DCU n'apparait sur AUCUNE ligne de vie.
   Correction : ajouter la ligne de vie :ServiceMessagerie et
   lui adresser le message. La regle 1 est alors satisfaite.

# --- Etape 4 : etats et attributs ---
Etat Expiree  -&gt; condition : dateValidite &lt; aujourd'hui
Attributs de Reservation : numero, membre
   -&gt; dateValidite ABSENTE : l'etat Expiree est INDECIDABLE.
Correction : ajouter dateLimite : Date a Reservation
   (ou porter l'etat par la nouvelle classe MiseEnAttente).

# --- Bilan ---
3 messages confrontes -&gt; 1 renommage, 1 classe nouvelle,
1 acteur enfin relie, 1 attribut ajoute, 4 diagrammes corriges.</pre>
<p>Retiens le mécanisme : tu es parti d'un simple contrôle de noms, et tu as terminé en découvrant une <strong>classe métier absente</strong>, un <strong>acteur déclaré mais jamais utilisé</strong> et un <strong>état impossible à évaluer</strong>. Aucun de ces trois défauts n'était visible sur un diagramme pris isolément. Demain, on repart de zéro : un cahier des charges neuf, et la démarche complète du texte aux cas d'utilisation.</p>`

kVente est un attribut PRIVE de Jeu. Si Vente modifiait\n  ' ce stock directement, on violerait l'encapsulation et\n  ' plus rien ne garantirait que le stock ne passe pas negatif.\n}\n\ninterface ImprimanteTicket {\n  + editerTicket(v : Vente) : void\n  ' Le message editerTicket() partait vers une ligne de vie qui\n  ' n'existait dans AUCUN diagramme. Or l'imprimante est un\n  ' systeme EXTERNE : elle doit apparaitre comme ACTEUR SECONDAIRE\n  ' au diagramme de cas d'utilisation (regle 1), et son contrat\n  ' doit exister quelque part dans le modele.\n}\n\nVente \"0..*\" -- \"1\" Jeu\nVente ..> ImprimanteTicket : utilise\n\n@enduml\n\n' ============================================================\n' (c) JUSTIFICATION DES ETATS PAR LES ATTRIBUTS (etape 4)\n' ============================================================\n' EnSaisie : datePaiement = null ET dateVente != null\n' Payee    : datePaiement != null\n' Annulee  : dateAnnulation != null\n'\n' Attributs necessaires : datePaiement, dateAnnulation\n' Or la classe Vente ne declarait NI l'un NI l'autre.\n' -> l'etat Payee etait INDECIDABLE : le systeme n'avait aucun\n'    moyen de savoir qu'une vente etait payee.\n' -> correction : ajout de datePaiement (fait ci-dessus) et de\n'    dateAnnulation : Date pour l'etat Annulee.\n'\n' Le meme controle vaut pour les TRANSITIONS : l'evenement qui\n' mene de EnSaisie a Payee doit correspondre a une operation de\n' la classe -> c'est payer(date), ajoutee ci-dessus.\n'\n' BILAN DE L'AUDIT\n' 4 messages confrontes -> 1 renommage, 3 operations ajoutees,\n' 3 attributs ajoutes, 1 acteur secondaire a declarer.\n' Aucun de ces defauts n'etait visible sur un diagramme SEUL.",
