<script>
var DAY = {

  title: "Diagramme de temps : quand la durée compte",
  subtitle: "Représenter l'évolution des états sur une échelle de temps.",
  theory: `
<h3>1. La question à laquelle il répond</h3>
<p>Le <strong>diagramme de temps</strong> (sigle <strong>DTP</strong> dans ton cours ; <em>Timing Diagram</em> en anglais) met l'accent sur les <strong>contraintes temporelles</strong> et sur l'évolution des <strong>états d'un objet au fil du temps</strong>.</p>
<p>Les deux diagrammes que tu viens d'étudier disent <em>par quels états passe un objet</em> et <em>ce qui le fait changer</em>. Aucun des deux ne dit <strong>combien de temps</strong> il reste dans chaque état, ni <strong>à quel moment précis</strong> les changements se produisent. C'est exactement ce trou que comble le diagramme de temps.</p>
<pre class="pseudo"># Trois diagrammes, trois questions sur le meme Exemplaire
Machine a etats     -> "quels etats, et qu'est-ce qui fait changer ?"
Diagramme de sequence -> "dans quel ORDRE les messages s'echangent ?"
Diagramme de temps  -> "COMBIEN DE TEMPS dans chaque etat,
                        et le delai tient-il dans le budget ?"</pre>
<div class="warn">Disons-le honnêtement : c'est <strong>le diagramme le plus rare des 14</strong>. Dans un projet de gestion ordinaire — une ludothèque, une facturation, un site web — tu n'en dessineras probablement jamais. Son domaine, ce sont les <strong>systèmes temps réel</strong> et l'<strong>embarqué</strong> : un feu de circulation, un protocole réseau, un capteur ABS, un automate industriel. Là, la question « le signal est-il retombé sous 200 ms ? » n'est pas un détail : c'est la spécification elle-même.</div>

<h3>2. La ligne de vie est HORIZONTALE</h3>
<p>Voici la différence visuelle majeure avec le diagramme de séquence, et c'est la première chose à retenir : dans un diagramme de temps, la <strong>ligne de vie est dessinée horizontalement</strong>, et le <strong>temps se lit de gauche à droite</strong>.</p>
<pre class="pseudo"># DIAGRAMME DE SEQUENCE          # DIAGRAMME DE TEMPS
#   ligne de vie VERTICALE       #   ligne de vie HORIZONTALE
#   temps du haut vers le bas    #   temps de GAUCHE a DROITE

   :Exemplaire                      Exemplaire
        |                              |
        |                              |------------------------>
        |  <- temps                    |   0    2    5    9   (jours)
        v                              |        temps ->
</pre>
<p>Chaque objet observé occupe une <strong>bande horizontale</strong>. Si tu en observes plusieurs, tu empiles les bandes les unes sous les autres, toutes alignées sur la <strong>même échelle de temps</strong> — ce qui permet de lire d'un coup d'œil les corrélations entre objets.</p>

<h3>3. Première représentation : la forme en escalier</h3>
<p>La norme l'appelle <em>state-or-condition timeline</em> ; on la reconnaît à son tracé en créneaux. Les <strong>états possibles sont listés en colonne à gauche</strong>, un par ligne, et le tracé <strong>monte ou descend</strong> pour indiquer dans quel état se trouve l'objet à chaque instant.</p>
<pre class="pseudo">Exemplaire n°42

EnRetard   |                                    .--------.
           |                                    |        |
Loue       |          .-------------------------'        |
           |          |                                   |
Reserve    |   .------'                                   |
           |   |                                          |
Disponible |---'                                          '------
           +---+------+-------------------------+--------+------->
           0   1      2                         9        11   (jours)

# Lecture ligne par ligne :
#   j0 a j1  : Disponible
#   j1 a j2  : Reserve      (le membre a reserve en ligne)
#   j2 a j9  : Loue         (7 jours : la duree contractuelle)
#   j9 a j11 : EnRetard     (2 jours de retard)
#   j11      : Disponible   (retour effectif du jeu)
# Le trace ne fait que MONTER ou DESCENDRE d'un cran a l'autre :
# d'ou le nom de forme "en escalier".</pre>
<p>Cette forme est la plus parlante quand les états sont peu nombreux et que ce qui compte est la <strong>durée</strong> passée dans chacun. Elle se lit comme un tracé d'oscilloscope.</p>

<h3>4. Seconde représentation : la forme linéaire</h3>
<p>La norme l'appelle <em>general value lifeline</em>. Ici, plus de colonne d'états ni de créneaux : les valeurs successives s'inscrivent dans des <strong>hexagones allongés</strong> qui se succèdent le long de la ligne.</p>
<pre class="pseudo">Location n°17

  &lt;--------&gt;&lt;-------------------------&gt;&lt;----------&gt;&lt;------&gt;
   Reservee        EnCours                EnRetard   Terminee
  &lt;--------&gt;&lt;-------------------------&gt;&lt;----------&gt;&lt;------&gt;
  |        |                          |            |      |
  0        2                          9            11    11.5  (jours)

# Chaque hexagone = une valeur (ou un etat) ; sa LARGEUR = sa duree.
# Les croisements entre hexagones marquent les instants de changement.
# Plus compact que l'escalier : pratique quand il y a BEAUCOUP de
# valeurs distinctes, ou quand on suit la valeur d'un ATTRIBUT.</pre>
<div class="tip">Comment choisir ? <strong>Escalier</strong> quand les états sont peu nombreux et qu'on veut comparer visuellement les durées (le tracé se lit comme une courbe). <strong>Linéaire</strong> quand les valeurs sont nombreuses ou qu'on suit un attribut plutôt qu'un état. Les deux formes sont normatives et peuvent cohabiter dans un même diagramme : une bande en escalier au-dessus, une bande linéaire en dessous.</div>

<h3>5. Contraintes de durée et observations de temps</h3>
<p>C'est le cœur du diagramme, et c'est ce qui justifie de le dessiner. Deux notations à connaître :</p>
<pre class="pseudo"># CONTRAINTE DE DUREE : entre ACCOLADES, sous une double fleche
#   Elle exprime une exigence : cette duree DOIT respecter cela.

  {3 min}          # duree exacte imposee
  {0..7 jours}     # intervalle : entre 0 et 7 jours
  {d..3*d}         # intervalle RELATIF a une duree d nommee ailleurs
  {&lt; 200 ms}       # borne superieure seule


# OBSERVATION DE TEMPS : on NOMME un instant pour s'y referer.
#   La variable capture la date a laquelle l'evenement s'est produit.

  t = now          # l'instant courant est memorise dans t
  {t..t + 7j}      # on s'en sert ensuite dans une contrainte</pre>
<pre class="pseudo"># Les deux notations en situation
Exemplaire n°42

Loue       |          .------------------------.
           |          |                        |
Disponible |----------'                        '-----------
           +----------+------------------------+----------->
                      t = now                  {t..t + 7 jours}
                      |&lt;----------------------&gt;|
                              {7 jours}

# On LIT : l'exemplaire entre dans Loue a l'instant t (observation
# de temps) ; il doit en sortir dans l'intervalle [t, t+7 jours]
# (contrainte de duree). Au-dela, la regle metier est violee.</pre>
<div class="warn"><strong>Écart avec ton cours d'école.</strong> Le support du PAC cite bien les trois ingrédients — « échelle de temps », « contrainte de durée », « événements » — mais <strong>ne donne aucune syntaxe</strong>. Retiens donc celle de la norme : <strong>contrainte de durée entre accolades</strong> (<code>{3 min}</code>, <code>{d..3*d}</code>) et <strong>observation de temps</strong> sous la forme <code>t = now</code>. Ce sont ces écritures qu'emploient les outils et la spécification OMG.</div>

<h3>6. Événements et messages</h3>
<p>Deux éléments complètent le tableau. Les <strong>événements</strong> se notent sur l'axe, à l'instant où ils surviennent : ce sont eux qui expliquent les changements d'état. Et quand plusieurs lignes de vie sont empilées, une <strong>flèche verticale ou oblique</strong> entre deux bandes représente un <strong>message</strong> envoyé de l'une à l'autre.</p>
<pre class="pseudo">Exemplaire  Loue      |    .----------------------.
                      |    |                      |
            Disponible|----'                      '--------
                      +----+----------------------+-------->
                           |                      ^
                           | notifierRetard()     | rendreJeu()
                           v                      |
Membre      Alerte    |    .---------.            |
                      |    |         |            |
            Normal    |----'         '------------'---------
                      +----+---------+------------+-------->
                      0    9        9.1          11 (jours)

# Une fleche OBLIQUE entre deux bandes = un MESSAGE.
# Son inclinaison rend visible le DELAI DE PROPAGATION :
# une fleche verticale = message instantane ;
# une fleche penchee   = le message met du temps a arriver.</pre>
<p>Cette inclinaison est un détail qui a du sens : dans un protocole réseau, c'est précisément le temps de vol du message qu'on cherche à contraindre.</p>

<h3>7. À la Ludothèque : la location de 7 jours</h3>
<p>Le fil rouge s'y prête bien, parce que la règle des 7 jours est une vraie contrainte temporelle.</p>
<pre class="pseudo">Exemplaire n°42 -- location de Marie, jeu "Catan"

EnRetard   |                                       .-------.
           |                                       |       |
Loue       |          .----------------------------'       |
           |          |                                    |
Reserve    |   .------'                                    |
           |   |                                           |
Disponible |---'                                           '-----
           +---+------+----------------------------+-------+----->
           0   1      2                            9      11  (jours)
               |      |                            |       |
               |      | t = now                    |       | rendre()
               |      |&lt;--------------------------&gt;|       |
               |            {7 jours} DUREE CONTRACTUELLE  |
               |                                   |&lt;-----&gt;|
               |                                    {0..14 jours}
               |                                    RETARD TOLERE
               |&lt;----&gt;|
               {&lt;= 48 heures} EXPIRATION DE LA RESERVATION

# Trois contraintes de duree, trois regles metier :
#   {&lt;= 48 heures} : la reservation expire si elle n'est pas confirmee
#   {7 jours}      : duree contractuelle de la location -> after(7 jours)
#                    dans la machine a etats du jour 18
#   {0..14 jours}  : au-dela de 14 jours de retard, le jeu est
#                    declare perdu et la caution est retenue
# NOTE : ces memes contraintes apparaissaient deja dans la machine
# a etats sous forme d'evenements after(...). Le diagramme de temps
# ne les invente pas : il les rend VISIBLES et MESURABLES.</pre>
<div class="tip">Le lien entre les deux diagrammes est direct : chaque <code>after(durée)</code> de ta machine à états correspond à une <strong>contrainte de durée</strong> du diagramme de temps. Si tu sais écrire l'un, tu sais dériver l'autre — c'est d'ailleurs le meilleur usage du DTP dans un projet de gestion : vérifier que les délais annoncés sont cohérents entre eux.</div>

<h3>8. Ce qu'il faut en retenir</h3>
<pre class="pseudo">CE QU'IL APPORTE                  CE QU'IL N'APPORTE PAS
-------------------------------   ------------------------------
La DUREE de chaque etat           La structure des classes
Les contraintes {min..max}        L'ordre logique des appels
La correlation entre objets       Les acteurs et leurs roles
Le delai de propagation           Les regles de gestion completes

# En un mot : le DTP est un diagramme de MESURE, pas de STRUCTURE.
# On le dessine quand le temps est une EXIGENCE, pas une consequence.</pre>`,

    { type: "vf", q: "Le diagramme de temps est l'un des diagrammes UML les plus fréquemment dessinés.", a: false, exp: "C'est au contraire le plus rare des 14 : dans un projet de gestion ordinaire, on ne le dessine quasiment jamais." },

    { type: "input", q: "Quelle contrainte de durée écrirais-tu pour la durée contractuelle d'une location à la Ludothèque ?", a: ["{7 jours}", "{7j}", "{7 jours }", "{ 7 jours }", "{7 days}"], ph: "{ … }", exp: "La règle métier des 7 jours devient la contrainte {7 jours}, qui correspond à l'événement after(7 jours) de la machine à états." }
  ],
  final: {

    solution: "@startuml\n' Diagramme de TEMPS (timing) -- Exemplaire n°42 de la Ludotheque\n' Rappel : la ligne de vie est HORIZONTALE et le temps se lit\n' de GAUCHE a DROITE (contrairement au diagramme de sequence).\n\n' ---------- Les deux lignes de vie ----------\nrobust \"Exemplaire n°42\" as EX\n' robust = forme EN ESCALIER (state-or-condition timeline) :\n' les etats sont listes en COLONNE a gauche et le trace monte\n' ou descend en creneaux d'un etat a l'autre.\n\nconcise \"Location n°17\" as LO\n' concise = forme LINEAIRE (general value lifeline) :\n' les valeurs se succedent dans des HEXAGONES allonges dont\n' la largeur represente la duree.\n\nEX has Disponible, Reserve, Loue, EnRetard\n' l'ordre de declaration fixe l'ordre des lignes de l'escalier\n\nscale 1 as 40 pixels\n\n' ---------- L'echelle de temps, en jours ----------\n@0\nEX is Disponible\nLO is Aucune\n\n@1\nEX is Reserve\nLO is Reservee\n' le membre reserve en ligne\n\n@2\nEX is Loue\nLO is EnCours\nEX -> LO : retirerJeu()\nnote top of EX : t = now\n' OBSERVATION DE TEMPS : on memorise l'instant du retrait dans t.\n' Elle sert de reference pour ecrire ensuite {t..t + 7 jours}.\n\n@9\nEX is EnRetard\nLO is EnRetard\n' echeance depassee : correspond a l'evenement after(7 jours)\n' de la machine a etats du jour 18\n\n@11\nEX is Disponible\nLO is Terminee\nLO -> EX : rendre()\n\n@13\nEX is Disponible\n\n' ---------- Les contraintes de duree ----------\n' Elles s'ecrivent ENTRE ACCOLADES. Les crochets seraient des\n' GARDES : ils appartiennent aux machines a etats, pas ici.\n\nEX@1 <-> @2 : {0..48 heures}\n' regle metier : une reservation non confirmee expire.\n' Correspond a after(48 heures) dans la machine a etats.\n\nEX@2 <-> @9 : {7 jours}\n' duree CONTRACTUELLE de la location.\n' Correspond a after(7 jours) dans la machine a etats.\n\nEX@9 <-> @11 : {0..14 jours}\n' retard TOLERE ; au-dela, le jeu est declare perdu et la\n' caution est retenue.\n\n@enduml\n\n' --- Ce que ce diagramme apporte, et ce qu'il n'apporte pas ---\n' IL APPORTE : la DUREE de chaque etat, les bornes {min..max}\n'   a respecter, et la correlation entre l'Exemplaire et la\n'   Location -- on voit d'un coup d'oeil que les deux basculent\n'   au meme instant.\n' IL N'APPORTE PAS : la structure des classes, l'ordre logique\n'   des appels, les acteurs. Le DTP est un diagramme de MESURE,\n'   pas de structure.\n' HONNETEMENT : pour une ludotheque, ce diagramme est un luxe.\n'   Son vrai terrain, c'est le TEMPS REEL et l'EMBARQUE, ou une\n'   contrainte comme {< 200 ms} EST la specification.\n' LIEN AVEC LE JOUR 18 : chaque after(duree) de la machine a\n'   etats se traduit ici en contrainte de duree mesurable.\n'   Si les deux diagrammes se contredisent, l'un des deux ment.",
