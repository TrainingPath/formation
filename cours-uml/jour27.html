<h3>1. Ce qui change aujourd'hui</h3>
<p>Depuis vingt-six jours, on te donnait le modèle et tu apprenais à le dessiner. Aujourd'hui, on te donne <strong>un texte, et rien d'autre</strong>. C'est exactement la situation d'examen, et c'est aussi la situation réelle : un client parle, quelqu'un prend des notes, et il faut en sortir un système.</p>
<p>L'énoncé qui suit est neuf, mais il se situe dans l'univers que tu connais : la Ludothèque « Le Dé Bleu », avec ses <code>Jeu</code>, ses <code>Membre</code>, ses <code>Employé</code>, son <code>stock_location</code>. Elle ouvre un <strong>service d'animation</strong>. Aujourd'hui : acteurs, frontière, cas d'utilisation, description textuelle, diagramme d'activités. Demain : classes, code Python, tables MySQL.</p>

<h3>2. L'énoncé</h3>
<p>Lis-le une première fois d'un trait, sans rien noter. Puis relis-le crayon en main.</p>
<p><em>« La ludothèque Le Dé Bleu souhaite ouvrir un service d'animation. Des animateurs, salariés ou bénévoles, viennent y encadrer des séances de jeu. Une séance se tient à une date et une heure données, dans l'une des salles de la ludothèque, et porte sur un ou plusieurs jeux du catalogue. Chaque salle a une capacité d'accueil ; le nombre de places offertes pour une séance ne peut jamais dépasser la capacité de la salle retenue. Le responsable d'animation programme les séances, y affecte un animateur et réserve la salle ; chaque fin de mois, il consulte le taux de remplissage des séances passées. Un membre déjà inscrit à la ludothèque peut s'inscrire à une séance tant qu'il reste des places ; il règle alors au comptoir, auprès d'un employé, un tarif fixé par participant et propre à chaque séance. Un membre peut annuler son inscription ; si l'annulation intervient plus de 48 heures avant la séance, il est remboursé, sinon la somme reste acquise à la ludothèque. Les jeux utilisés pendant une séance sont prélevés sur le stock de location et ne peuvent donc pas être loués ce jour-là. Un animateur consulte son planning et déclare, à l'issue de chaque séance, les participants réellement présents. »</em></p>
<div class="tip">Ne cherche pas encore de classes ni de diagrammes. Un énoncé d'école est écrit exprès pour que les <strong>règles de gestion soient noyées dans la prose</strong> : « ne peut jamais dépasser », « tant qu'il reste des places », « plus de 48 heures avant ». Ce sont ces morceaux de phrase qui portent l'analyse, pas les noms de choses.</div>

<h3>3. Étape 1 — Marquer le texte : trois couleurs</h3>
<p>La première passe est mécanique et se fait au crayon. Trois marques, trois usages :</p>
<pre class="pseudo">NOMS COMMUNS       -&gt; candidats CLASSES ou ATTRIBUTS (demain)

   capacite, tarif, inscription, planning, taux de remplissage

VERBES D'ACTION    -&gt; candidats CAS D'UTILISATION (aujourd'hui)
   encadrer, programmer, affecter, reserver, consulter,
   s'inscrire, regler, annuler, rembourser, declarer

NOMBRES ET CONDITIONS -&gt; REGLES DE GESTION (a ne perdre a aucun prix)
   R1 : places offertes &lt;= capacite de la salle
   R2 : une seance = UN animateur, UNE salle, 1..* jeux
   R3 : inscription possible seulement s'il reste des places
   R4 : le membre doit deja etre inscrit a la ludotheque
   R5 : tarif par participant, propre a chaque seance
   R6 : annulation &gt; 48 h avant -&gt; remboursement, sinon rien
   R7 : les jeux d'une seance sortent du stock_location du jour</pre>
<div class="warn">Numérote tes règles de gestion <strong>dès la première lecture</strong>, et garde la liste sous les yeux jusqu'à la fin. C'est la seule protection contre le défaut le plus fréquent des copies : un modèle joli qui a perdu en route la moitié des contraintes de l'énoncé.</div>

<h3>4. Étape 2 — Identifier les acteurs</h3>
<p>Un <strong>acteur</strong> n'est pas « quelqu'un dont le texte parle ». C'est une entité <strong>extérieure au système</strong> qui <strong>échange</strong> avec lui. Trois questions suffisent à trancher :</p>
<pre class="pseudo">Q1. Est-elle EXTERIEURE au systeme informatique ?
Q2. ECHANGE-t-elle avec lui (envoie ou recoit de l'information) ?
Q3. Est-ce un ROLE, et non une personne nommee ?

# Trois OUI -&gt; acteur. Un seul NON -&gt; ce n'est pas un acteur.</pre>
<p>Application, candidat par candidat :</p>
<pre class="pseudo">CANDIDAT               Q1   Q2   Q3   VERDICT
Membre                 oui  oui  oui  ACTEUR PRINCIPAL
Employe                oui  oui  oui  ACTEUR PRINCIPAL
Responsable animation  oui  oui  oui  ACTEUR PRINCIPAL
Animateur              oui  oui  oui  ACTEUR PRINCIPAL
Systeme de paiement    oui  oui  ---  ACTEUR SECONDAIRE
Salle                  oui  NON  non  PAS un acteur : ressource passive,
                                      elle ne dialogue avec rien
Jeu                    oui  NON  non  PAS un acteur : objet du domaine
La ludotheque          NON  ---  ---  PAS un acteur : c'est le SYSTEME</pre>
<p>La distinction <strong>principal / secondaire</strong> ne dépend pas de l'importance mais de l'<strong>initiative</strong> :</p>
<pre class="pseudo">ACTEUR PRINCIPAL   : il DECLENCHE le cas, il en tire le benefice
ACTEUR SECONDAIRE  : il est SOLLICITE par le systeme pendant le cas

# Le Membre declenche "S'inscrire a une seance"    -&gt; principal
# Le Systeme de paiement est appele par le systeme -&gt; secondaire</pre>
<div class="warn">Le cas de l'<strong>Animateur</strong> mérite qu'on s'y arrête. Il est <strong>acteur</strong> (il consulte son planning, il déclare les présents) <em>et</em> il sera <strong>classe</strong> demain (le système stocke son nom, ses coordonnées, ses séances). Ce n'est pas une contradiction : l'acteur est le <em>rôle</em> joué à l'extérieur, la classe est l'<em>information</em> conservée à l'intérieur. Un Membre est dans le même cas depuis le premier jour du cours.</div>

<h3>5. Étape 3 — Tracer la frontière du système</h3>
<p>La <strong>frontière</strong> est le rectangle qui sépare ce que le logiciel fait de ce qu'il ne fait pas. Elle se décide par une question : <strong>le système en est-il responsable ?</strong></p>
<pre class="pseudo">DANS LA FRONTIERE  (le logiciel s'en charge)
  programmer une seance, affecter un animateur, controler la
  capacite, gerer les inscriptions, calculer le montant du,
  enregistrer les presences, calculer le taux de remplissage

HORS FRONTIERE     (le monde reel, ou un autre systeme)
  animer effectivement la seance          # ca se passe dans la salle
  ranger les jeux apres la seance         # geste physique
  autoriser le paiement par carte         # Systeme de paiement
  imprimer les affiches du programme      # hors perimetre demande</pre>
<div class="tip">Le nom du système s'écrit <strong>dans le rectangle</strong>, en haut. Ici : <code>Service d'animation</code>. Ce n'est pas décoratif : quand deux personnes discutent d'un cas, savoir quel système on modélise évite la moitié des malentendus.</div>

<h3>6. Étape 4 — Dégager les cas d'utilisation</h3>
<p>Un cas d'utilisation se nomme <strong>verbe à l'infinitif + complément</strong>, du <strong>point de vue de l'acteur</strong>, et doit représenter un <strong>service complet</strong> qui laisse l'acteur satisfait. On repart des verbes relevés à l'étape 1 :</p>
<pre class="pseudo">VERBE DU TEXTE          CAS D'UTILISATION            ACTEUR PRINCIPAL
programme les seances   Programmer une seance        Responsable
affecte un animateur    Affecter un animateur        Responsable
consulte le taux        Consulter le taux de         Responsable
                        remplissage
s'inscrire              S'inscrire a une seance      Membre
regle au comptoir       Encaisser le tarif           Employe
annuler                 Annuler une inscription      Membre
est rembourse           Rembourser l'inscription     (extension)
consulte son planning   Consulter son planning       Animateur
declare les presents    Declarer les presences       Animateur

# VERBES ECARTES, et pourquoi
encadrer une seance  -&gt; action du monde reel, HORS frontiere
reserver la salle    -&gt; ce n'est pas un service complet rendu a
                        un acteur : c'est une ETAPE de
                        "Programmer une seance"</pre>
<div class="warn">L'erreur la plus courante en examen : confondre un <strong>cas d'utilisation</strong> et une <strong>étape</strong>. « Saisir la date », « Choisir la salle », « Cliquer sur Valider » ne sont pas des cas : personne ne vient à la ludothèque pour saisir une date. Le test : <em>si l'acteur s'arrêtait là, serait-il satisfait ?</em> Si non, ce n'est qu'une étape — elle ira dans l'enchaînement nominal ou dans le diagramme d'activités.</div>

<h3>7. Étape 5 — Placer un &lt;&lt;include&gt;&gt; et un &lt;&lt;extend&gt;&gt;</h3>
<p>Rappel du jour 4, appliqué ici. La question pour <code>&lt;&lt;include&gt;&gt;</code> : <em>ce comportement arrive-t-il à tous les coups, et est-il partagé ?</em> La question pour <code>&lt;&lt;extend&gt;&gt;</code> : <em>ce comportement n'arrive-t-il que sous condition ?</em></p>
<pre class="pseudo"># INCLUDE — obligatoire et factorisable
"S'inscrire a une seance" ---&gt; "Verifier les places disponibles"
   Pourquoi : la regle R3 impose ce controle A CHAQUE inscription,
   et le meme controle sert au Responsable quand il reduit la
   capacite d'une salle. Obligatoire + partage = include.

"S'inscrire a une seance" ---&gt; "Encaisser le tarif"
   Pourquoi : la regle R5 dit que le membre REGLE au comptoir.
   Pas de reglement, pas d'inscription : c'est systematique.

# EXTEND — optionnel et conditionnel
"Rembourser l'inscription" ---&gt; "Annuler une inscription"
   Pourquoi : la regle R6 conditionne le remboursement au delai
   de 48 heures. Sans remboursement, "Annuler une inscription"
   reste un cas complet et valide -&gt; c'est bien une extension.
   Point d'extension declare dans le cas etendu : controle_delai
   Condition en note : {delai avant seance &gt; 48 h}</pre>
<p>Et le sens des flèches, qu'on retrouve sans l'apprendre : <strong>la flèche part de celui qui connaît l'autre</strong>. Le cas de base connaît ce qu'il inclut ; l'extension connaît le cas où elle se greffe.</p>

<h3>9. Étape 6 — La description textuelle du cas central</h3>
<p>Le diagramme donne la carte, la description donne l'itinéraire. On détaille le cas qui porte le plus de règles de gestion : <strong>S'inscrire à une séance</strong>. Gabarit imposé, trois blocs.</p>
<pre class="pseudo">IDENTIFICATION
  Nom du cas        : S'inscrire a une seance
  But               : permettre a un membre de reserver une place
                      a une seance d'animation, contre paiement
                      du tarif par participant
  Acteur principal  : Membre
  Acteur secondaire : Employe, Systeme de paiement
  Date              : 02/08/2026
  Responsable       : A. Toumi
  Version           : 1.0

SEQUENCEMENT
  Le cas commence lorsqu'un membre se presente au comptoir ou se
  connecte pour demander une place a une seance programmee.

  Pre-conditions
    - le membre est inscrit a la ludotheque et son compte n'est
      pas suspendu                                       (regle R4)
    - la seance existe, est programmee et n'a pas encore eu lieu
    - il reste au moins une place libre sur la seance    (regle R3)

  Enchainement nominal
    1. le membre choisit une seance dans le programme
    2. le systeme verifie que le membre est inscrit et a jour
    3. le systeme verifie les places disponibles
       (cas inclus : Verifier les places disponibles)
    4. le systeme affiche le tarif par participant de la seance
    5. le membre confirme son inscription
    6. le systeme cree l'Inscription et decremente le nombre de
       places restantes
    7. le systeme demande l'encaissement du tarif
       (cas inclus : Encaisser le tarif)
    8. l'employe encaisse et le systeme enregistre le paiement
    9. le systeme confirme l'inscription au membre

  Enchainements alternatifs
    A1 : au point 5, le membre inscrit un accompagnant en meme
         temps -&gt; le systeme cree DEUX Inscriptions et double le
         montant, puis reprend au point 6
    A2 : au point 8, le membre paie en especes -&gt; l'employe
         encaisse sans solliciter le Systeme de paiement, le cas
         se poursuit au point 9
    A3 : au point 4, le membre beneficie du tarif reduit
         (moins de 12 ans) -&gt; le systeme applique le tarif reduit
         et poursuit au point 5

  Enchainements d'exception
    E1 : au point 2, le membre n'est pas inscrit a la ludotheque
         -&gt; le cas s'arrete, aucune Inscription creee   (regle R4)
    E2 : au point 3, il ne reste aucune place libre
         -&gt; le cas s'arrete, le membre est informe      (regle R3)
    E3 : au point 8, le paiement est refuse -&gt; l'Inscription
         creee au point 6 est supprimee et le nombre de places
         restantes est retabli

  Post-conditions
    - si succes : une Inscription existe, liee au Membre et a la
      Seance, elle est payee, et le nombre de places restantes a
      diminue de 1
    - si echec : aucune Inscription ne subsiste et le nombre de
      places restantes est identique a ce qu'il etait avant

RUBRIQUES OPTIONNELLES
  Contraintes non fonctionnelles
    - le controle des places doit etre atomique : deux membres ne
      doivent jamais pouvoir prendre la derniere place
    - la confirmation doit parvenir au membre en moins de 5 s
  Contraintes liees a l'interface homme-machine
    - le nombre de places restantes est affiche en permanence a
      cote du nom de la seance
    - le tarif total est affiche avant la confirmation</pre>
<div class="warn">Relis l'exception E3. Elle n'est pas décorative : elle dit ce qu'on fait de l'<code>Inscription</code> créée au point 6 quand le paiement échoue au point 8. Sans elle, le système laisse des inscriptions fantômes qui occupent des places sans avoir été payées. Les <strong>enchaînements d'exception sont là pour ça</strong> : décrire ce qu'on défait quand ça rate.</div>

    solution: `<pre class="pseudo"># EXTENSION DU MODELE — les groupes scolaires

# 1. NOUVEAUX ACTEURS
Enseignant            -&gt; PRINCIPAL   (il declenche la reservation)
Logiciel comptabilite -&gt; SECONDAIRE  (sollicite par le systeme)
Service de messagerie -&gt; SECONDAIRE  (sollicite pour notifier)

# systeme, elle recoit une facture. Ce sera une CLASSE demain.

# 2. NOUVEAUX CAS D'UTILISATION
( Reserver une seance pour un groupe )  &lt;- Enseignant
( Facturer a l'ecole )                  &lt;- interne + comptabilite
( Annuler une seance )                  &lt;- Responsable d'animation
( Notifier les inscrits )               &lt;- extension

# 3. RELATIONS
Reserver une seance pour un groupe
   .....&gt; Verifier les places disponibles      &lt;&lt;include&gt;&gt;
   # meme regle, meme controle : la factorisation existait deja
   .....&gt; Facturer a l'ecole                   &lt;&lt;include&gt;&gt;
   # systematique : un groupe ne paie jamais au comptoir

Notifier les inscrits .....&gt; Annuler une seance   &lt;&lt;extend&gt;&gt;
   # point d'extension : seance_annulee
   # condition : {la seance compte au moins un inscrit}
   # sans inscrits, "Annuler une seance" reste complet -&gt; extend

# 4. DESCRIPTION TEXTUELLE (extrait)
IDENTIFICATION
  Nom du cas        : Reserver une seance pour un groupe
  But               : bloquer plusieurs places d'un coup pour une
                      classe, avec facturation a l'ecole
  Acteur principal  : Enseignant
  Acteur secondaire : Logiciel de comptabilite
  Date / Responsable / Version : 02/08/2026 / A. Toumi / 1.0

SEQUENCEMENT
  Le cas commence lorsqu'un enseignant demande une seance pour
  sa classe.

  Pre-conditions
    - la seance existe et n'a pas encore eu lieu
    - le nombre d'eleves annonce est inferieur ou egal au nombre
      de places restantes de la seance
    - l'ecole est referencee et n'a pas d'impaye

  Enchainement nominal
    1. l'enseignant choisit une seance et saisit son effectif
    2. le systeme verifie les places (cas inclus)
    3. le systeme cree une reservation de groupe et decremente
       les places restantes de l'effectif annonce
    4. le systeme transmet les elements au logiciel de
       comptabilite (cas inclus : Facturer a l'ecole)
    5. le systeme confirme la reservation a l'enseignant

  Enchainements alternatifs
    A1 : au point 1, l'enseignant demande la seance ENTIERE
         -&gt; le systeme bloque toutes les places restantes
            et poursuit au point 3

  Enchainements d'exception
    E1 : au point 2, l'effectif depasse les places restantes
         -&gt; le cas s'arrete, rien n'est reserve
    E2 : au point 4, le logiciel de comptabilite est
         indisponible -&gt; la reservation creee au point 3 est
         supprimee et les places sont retablies

  Post-conditions
    - si succes : une reservation de groupe existe, la facture
      est partie, les places restantes ont diminue de l'effectif
    - si echec : aucune reservation ne subsiste et le nombre de
      places restantes est inchange</pre>
