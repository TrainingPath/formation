  theory: `
<h3>1. Au-delà de deux classes : l'association de degré supérieur</h3>
<p>Depuis le jour 9, toutes tes associations relient <strong>deux</strong> classes : on parle d'association <strong>binaire</strong>, ou de <strong>degré 2</strong>. Le jour 10 t'a montré le cas réflexif (une classe reliée à elle-même) : il reste de degré 2, il y a bien deux extrémités.</p>
<p>Mais certaines informations refusent de se laisser découper en deux. Ton cours d'école les appelle les associations <strong>de dimension supérieure à 2</strong>, la norme les appelle des associations <strong>n-aires</strong>. Le principe : un fait qui n'existe que si <strong>n classes sont présentes en même temps</strong>.</p>
<p>À la ludothèque, une <strong>location</strong> n'a de sens que si trois éléments sont réunis : un <strong>Membre</strong> qui emprunte, un <strong>Exemplaire</strong> qu'il emporte, et un <strong>Employé</strong> qui enregistre l'opération au comptoir. Enlève l'un des trois, le fait disparaît.</p>

<h3>2. La notation : le grand losange</h3>
<p>Une association n-aire se note par un <strong>grand losange</strong> placé au centre, relié par un trait simple à <strong>chacune</strong> des classes participantes. Chaque trait — chaque <strong>arc</strong> — porte sa propre multiplicité.</p>
<pre class="pseudo"># Association TERNAIRE (degre 3) a la ludotheque
#
#        Membre                          Exemplaire
#          |                                  |
#          | 0..*                        0..* |
#          |                                  |
#          +-----------< >-------------------+
#                     /     \\
#                    <  ENREG >     <- GRAND LOSANGE : l'association n-aire
#                     \\     /          (on ecrit son nom a cote)
#                        |
#                        | 1
#                        |
#                     Employe
#
# Lecture : le fait "cet exemplaire a ete loue par ce membre,
#           enregistre par cet employe" n'existe que si les TROIS
#           occurrences sont donnees ensemble.</pre>
<p>Le losange est <strong>l'association elle-même</strong>, pas une classe. Si tu as besoin de lui ajouter des attributs — <code>date_debut</code>, <code>date_fin</code>, <code>caution</code> — tu rattaches une <strong>classe-association</strong> au losange par un trait pointillé, exactement comme pour une binaire (jour 9).</p>

<h3>3. La règle de lecture des multiplicités</h3>
<p>C'est le point qui fait trébucher tout le monde, et il faut le mémoriser mot pour mot :</p>
<div class="tip"><strong>Règle.</strong> Sur une association de degré <em>n</em>, la multiplicité placée près d'une classe indique <strong>combien d'occurrences de cette classe</strong> peuvent être associées à <strong>un tuple mettant en cause une occurrence de chacune des n−1 autres classes</strong>.</div>
<p>Autrement dit : on <em>fige</em> les n−1 autres, et on compte combien il peut y en avoir du côté qu'on lit. Sur notre exemple ternaire :</p>
<pre class="pseudo"># On fige (Membre, Exemplaire) et on compte les Employe -> multiplicite 1
#   "Pour un membre donne ET un exemplaire donne, il y a exactement
#    UN employe qui a enregistre l'operation."
#
# On fige (Membre, Employe) et on compte les Exemplaire -> 0..*
#   "Pour un membre donne ET un employe donne, il peut y avoir
#    plusieurs exemplaires concernes."
#
# ATTENTION : ce n'est PAS "un membre a un employe".
# La multiplicite d'une n-aire ne se lit JAMAIS deux classes a la fois.</pre>
<p>C'est pour cette raison qu'une n-aire est difficile à valider avec un client : la phrase de lecture est longue et contre-intuitive. Retiens le chiffre : les associations de degré supérieur représentent <strong>moins de 20 % des associations</strong> d'un modèle réel, et le <strong>degré 4 est très rare</strong>. Au-delà, c'est presque toujours le signe d'une analyse mal découpée.</p>

<h3>4. Décomposer une association n-aire</h3>
<p>Beaucoup de n-aires n'en sont pas vraiment : elles se <strong>décomposent</strong> en associations binaires sans perte d'information. Ton cours d'école identifie <strong>deux situations</strong> qui autorisent la décomposition :</p>
<pre class="pseudo"># SITUATION (a) : dependance fonctionnelle entre les identifiants
#                 de DEUX des classes participantes
#
#   Si connaitre l'identifiant de A suffit a determiner celui de B,
#   alors le lien A-B est un fait autonome : on le sort du losange.
#
#   Exemple : (Jeu, Categorie, Editeur) ... mais un Jeu determine
#   deja son Editeur -> l'association Jeu-Editeur est binaire,
#   elle n'a rien a faire dans le losange.
#
# SITUATION (b) : une multiplicite maximale vaut 1 sur un des arcs
#
#   Exemple : dans (Membre, Exemplaire, Employe), l'arc vers
#   Employe porte la multiplicite 1. On peut donc remplacer :
#     Membre --0..*-- Location --0..*-- Exemplaire
#     Location --*----1-- Employe
#   La classe Location (classe-association promue en classe)
#   porte date_debut, date_fin, caution.</pre>
<div class="warn"><strong>Le point que tout le monde oublie.</strong> Après une décomposition, <strong>les multiplicités restantes doivent être réévaluées</strong>. Elles ne se recopient pas : elles ne portaient pas sur les mêmes tuples. Une multiplicité <code>0..*</code> qui se lisait « pour un couple figé » devient une multiplicité qui se lit « pour une seule occurrence » — la borne change presque toujours. Repose la question au client, arc par arc, après décomposition.</div>
<p>Quand la décomposition est possible, <strong>fais-la</strong>. Un modèle en binaires se lit, se valide et se traduit en tables sans discussion. Ne garde une n-aire que lorsqu'aucune des deux situations ne s'applique — par exemple <code>(Jeu, Salle, Créneau)</code> pour la réservation d'une séance de jeu : aucun des trois ne détermine les autres, et chaque arc admet plusieurs occurrences.</p>
<pre class="pseudo"># n-aire IRREDUCTIBLE : la reservation de seance
#
#     Jeu 0..*  ---+
#                  |
#   Salle 0..*  ---+---< SEANCE >   <- grand losange, degre 3
#                  |
#  Creneau 0..* ---+
#
# Lecture d'un arc : "pour une salle donnee ET un creneau donne,
#                     plusieurs jeux peuvent etre programmes".
# Aucune dependance fonctionnelle, aucune borne max a 1
# -> la decomposition perdrait de l'information.</pre>

<h3>5. Le piège du ventilateur (fan trap)</h3>
<p>Un <strong>piège</strong> est une configuration d'associations qui <em>semble</em> correcte sur le dessin, mais qui rend une question du client <strong>impossible à répondre</strong> avec le modèle. Il y en a deux classiques.</p>
<p>Le <strong>piège du ventilateur</strong> apparaît quand <strong>deux associations « un vers plusieurs » divergent depuis une même classe</strong>. Le chemin qui relie les deux extrémités devient <strong>ambigu</strong> : plusieurs lectures sont possibles, et le modèle ne tranche pas.</p>
<pre class="pseudo"># PIEGE DU VENTILATEUR
#
#      Employe 0..*  ----1---- Ludotheque ----1---- 0..* Exemplaire
#                                  ^
#                                  |
#                     les deux "1..*" partent d'ICI : ca "eventaille"
#
# Question du client : "quel employe est responsable de
#                       l'exemplaire n°412 ?"
# Reponse du modele  : impossible. On sait que l'exemplaire
#   appartient a la ludotheque, et que la ludotheque a 12 employes.
#   Le chemin donne 12 reponses possibles, donc aucune.
#
# CORRECTION : ajouter l'association DIRECTE qui manque
#      Employe 1 ---- 0..* Exemplaire   (est responsable de)</pre>
<div class="tip">Le réflexe de détection : dès que tu vois deux traits <code>1 — 0..*</code> partir de la même classe, demande-toi si quelqu'un aura besoin de naviguer d'une branche à l'autre. Si oui, le chemin passant par le sommet est ambigu : il faut une association directe.</div>

<h3>6. Le piège de l'abîme (chasm trap)</h3>
<p>Le <strong>piège de l'abîme</strong> est le symétrique : le chemin existe bien, mais une <strong>multiplicité minimale à 0</strong> quelque part sur ce chemin fait que <strong>certaines occurrences ne sont jamais atteignables</strong>. Le lien est <em>coupé</em> pour une partie des données.</p>
<pre class="pseudo"># PIEGE DE L'ABIME
#
#   Categorie 1 ---- 0..* Jeu 1 ---- 0..* Exemplaire
#                          ^
#                          | multiplicite MINIMALE = 0 cote Jeu :
#                            un jeu peut n'avoir AUCUN exemplaire
#
# Question du client : "quels exemplaires relevent de la
#                       categorie Strategie ?"
# Probleme : les jeux du catalogue qui n'ont pas encore
#   d'exemplaire physique existent, mais aucun chemin ne
#   permet de rattacher un exemplaire nouvellement recu
#   a sa categorie tant que le lien intermediaire manque.
#
# CORRECTION : associer DIRECTEMENT les deux extremites
#   quand le metier a besoin du lien
#      Categorie 1 ---- 0..* Exemplaire</pre>
<pre class="pseudo"># Les deux pieges, resumes
Ventilateur (fan trap)  -> le chemin existe mais il est AMBIGU
                           (deux "1 vers plusieurs" divergentes)
Abime (chasm trap)      -> le chemin existe mais il est COUPE
                           (une multiplicite MINIMALE a 0)
Dans les deux cas, le remede est le meme :
   une association DIRECTE entre les deux classes concernees.</pre>

<h3>7. Les contraintes entre associations</h3>
<p>Parfois, deux associations ne sont pas indépendantes : participer à l'une interdit — ou impose — de participer à l'autre. Ton cours d'école note cela par un <strong>trait pointillé reliant les deux associations</strong>, étiqueté d'un <strong>mot entre accolades</strong>.</p>
<pre class="pseudo"># Notation de l'ecole
#
#            +------------- Location
#   Membre --+   {PARTITION}      <- mot entre accolades
#            +. . . . . . .+         sur le trait POINTILLE
#            +------------- Vente
#
# Les quatre contraintes enseignees :
#
# {PARTITION}      participation EXCLUSIVE et OBLIGATOIRE :
#                  chaque occurrence participe a l'une OU l'autre,
#                  jamais aux deux, jamais a aucune.
#
# exclusion        EXCLUSIVE mais NON obligatoire :
#                  l'une OU l'autre OU aucune des deux.
#
# {SOUS-ENSEMBLE}  INCLUSION : participer a A impose de participer
#                  a B. Se note avec une FLECHE pointillee, orientee
#                  vers l'association englobante.
#
# simultaneite     participer a l'une impose de participer a l'autre,
#                  et reciproquement (les deux ou aucune).</pre>
<p>Exemple à la ludothèque : un <strong>Avis</strong> ne peut être déposé que par un membre ayant déjà loué ou acheté le jeu concerné. L'association <em>Membre dépose Avis sur Jeu</em> est un <strong>sous-ensemble</strong> de l'association <em>Membre a emprunté ce Jeu</em> : flèche pointillée étiquetée <code>{SOUS-ENSEMBLE}</code>, pointant vers l'association englobante.</p>

<h3>8. Les contraintes portant sur l'héritage</h3>
<p>Les mêmes mots servent, avec un sens légèrement différent, quand la contrainte porte sur un ensemble de <strong>sous-types</strong> d'une généralisation :</p>
<pre class="pseudo"># Sur un heritage, l'ecole distingue trois cas
#
# partition   -> pas d'occurrence du SUPER-TYPE seul
#                ET sous-types mutuellement EXCLUSIFS
#                (tout objet est dans un sous-type, et un seul)
#
# exclusion   -> le super-type EST instanciable
#                mais les sous-types restent EXCLUSIFS
#                (un objet peut n'etre dans aucun sous-type)
#
# totalite    -> pas d'occurrence du super-type seul,
#                MAIS un objet peut relever de DEUX sous-types
#                a la fois (recouvrement autorise)
#
# Exemple ludotheque : Personne -> Membre / Employe
#   totalite : toute Personne est Membre ou Employe (ou les deux :
#   un employe peut etre membre de la ludotheque).</pre>
<div class="warn"><strong>Attention, écart avec la norme.</strong> Ces contraintes — {PARTITION}, exclusion, {SOUS-ENSEMBLE}, simultanéité, totalité — viennent de la tradition <strong>Merise / entité-association</strong>, pas d'UML. UML 2.5.1 ne normalise que <strong><code>{xor}</code></strong> entre deux associations (participation exclusive), et, pour l'héritage, les <strong>GeneralizationSet</strong> avec les deux couples de mots-clés <code>{complete}</code> / <code>{incomplete}</code> (le super-type est-il entièrement couvert ?) et <code>{disjoint}</code> / <code>{overlapping}</code> (les sous-types peuvent-ils se recouvrir ?). Emploie le vocabulaire de l'école dans tes devoirs, mais sache le traduire.</div>
<pre class="pseudo"># TABLE DE CORRESPONDANCE ecole -> UML 2.5.1
#
#  Ecole (Merise)            UML 2.5.1
#  ------------------------  ----------------------------------
#  partition (heritage)      {complete, disjoint}
#  exclusion (heritage)      {incomplete, disjoint}
#  totalite  (heritage)      {complete, overlapping}
#  (cas restant)             {incomplete, overlapping}  = defaut
#
#  exclusion entre 2 assoc.  {xor}       <- le SEUL normalise
#  {PARTITION} entre assoc.  {xor} + une contrainte de totalite
#                            a exprimer en OCL ou en note
#  {SOUS-ENSEMBLE}           contrainte {subsets} ou note OCL
#  simultaneite              pas de notation standard -> OCL</pre>

<h3>9. Les règles de validation du modèle</h3>
<p>Ton cours d'école termine le chapitre par une grille de relecture. Passe-la sur chaque modèle avant de le rendre :</p>
<pre class="pseudo">1. IDENTITE      chaque classe a-t-elle un moyen d'identifier
                 ses occurrences de facon unique ?
2. DESCRIPTION   chaque attribut decrit-il bien la classe ou il
                 est place, et une seule chose a la fois ?
3. NON-REDONDANCE une meme information n'apparait-elle qu'a UN
                 seul endroit ? (sinon : incoherence garantie)
4. CONSTRUCTION  le modele est-il forme correctement : pas
                 d'association sans multiplicite, pas de classe
                 isolee sans raison, pas de cycle non justifie ?
5. MULTIPLICITE MAXIMALE  sur une association de degre superieur,
                 au moins une multiplicite maximale doit valoir *
                 sur chaque arc ; si une borne max vaut 1,
                 l'association DOIT etre decomposee (situation b).</pre>
<div class="tip">La règle 5 est le test mécanique de la n-aire : parcours chaque arc du losange, lis la borne maximale. Une seule borne à 1 suffit à condamner la n-aire — décompose, puis réévalue les multiplicités restantes.</div>
