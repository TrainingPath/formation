<h3>1. Le diagramme que ton support ne mentionne pas</h3>
<p>Disons-le d'emblée : le <strong>diagramme de profil</strong> est le <strong>14e diagramme</strong> d'UML 2.5.1, et il est <strong>totalement absent du support du PAC</strong>. Ton cours d'école en annonce quatorze au premier chapitre, mais n'en traite que treize. Celui-ci manque.</p>
<p>Ce n'est pas un détail anecdotique. Le diagramme de profil est celui qui rend UML <strong>extensible</strong> : sans lui, SysML, MARTE et la moitié des outils de modélisation du marché n'existeraient pas. Il mérite bien une journée.</p>
<div class="tip">Si un correcteur te demande « citez les 14 diagrammes », c'est très probablement celui-là qui te manquera. Retiens-le : <strong>diagramme de profil</strong>, famille <strong>structurelle</strong>.</div>

<h3>2. Le problème : un langage général face à un domaine particulier</h3>
<p>UML est un langage <strong>généraliste</strong>. Il connaît les classes, les associations, les composants — mais il ne connaît rien à la ludothèque, ni à la banque, ni à l'aéronautique. Or au bout de quelques semaines de projet, tu as envie de dire des choses qu'UML ne sait pas exprimer :</p>
<pre class="pseudo">"Cette classe est une ENTITE PERSISTANTE, elle deviendra une table"
"Cette classe est un SERVICE METIER, elle ne stocke rien"
"Cette classe appartient a l'IHM, elle ne doit jamais appeler la base"
"Cette operation doit s'executer en moins de 50 ms"</pre>
<p>Deux mauvaises solutions se présentent. La première : écrire tout cela en notes libres, que personne ne lira et qu'aucun outil ne comprendra. La seconde : modifier UML, ce qui produirait un dialecte incompatible avec le reste du monde.</p>
<p>UML propose une troisième voie, propre et normalisée : le <strong>profil</strong>.</p>

<h3>3. Qu'est-ce qu'un profil ?</h3>
<p>Un <strong>profil</strong> est un <strong>mécanisme d'extension d'UML</strong>. Il permet d'<strong>adapter le langage à un domaine particulier sans modifier le métamodèle</strong>. C'est la clé : on n'ajoute pas de nouveaux concepts à UML, on <em>spécialise</em> ceux qui existent.</p>
<p>Un profil se compose de trois sortes d'éléments :</p>
<pre class="pseudo">1. STEREOTYPE      # etend une metaclasse UML existante
                   # notation : &laquo;nomDuStereotype&raquo; (guillemets francais)

2. VALEUR MARQUEE  # (tagged value) : propriete ajoutee par le stereotype
                   # exemple : &laquo;entite&raquo; ajoute la propriete  table : String

3. CONTRAINTE      # regle que doit respecter l'element stereotype
                   # souvent exprimee en OCL (Object Constraint Language)</pre>

<h3>4. Le stéréotype</h3>
<p>Un <strong>stéréotype</strong> <strong>étend une métaclasse</strong> : il crée une variante spécialisée d'un concept UML existant. Il se note entre <strong>guillemets français</strong>, avant le nom de l'élément :</p>
<pre class="pseudo">   +---------------------------+
   |        &laquo;entite&raquo;          |     # le STEREOTYPE, en guillemets francais
   |           Jeu             |
   +---------------------------+
   | - titre : String          |
   | - prix_location : Real    |
   +---------------------------+</pre>
<p>Une variante existe : au lieu du texte entre guillemets, on peut associer au stéréotype une <strong>icône</strong>, qui remplace ou accompagne le symbole standard. C'est ce qui donne, dans les outils, les jolis pictogrammes « base de données », « écran », « service ».</p>
<div class="warn">Les guillemets sont bien des <strong>guillemets français</strong> (les chevrons doubles), pas deux signes « inférieur à » collés. Beaucoup d'outils affichent <code>&lt;&lt;entite&gt;&gt;</code> faute de clavier adapté, et c'est toléré à l'écrit — mais la notation officielle est <code>&laquo;entite&raquo;</code>. Ne mets jamais de majuscule initiale imposée : le nom d'un stéréotype suit la convention des propriétés, en minuscule.</div>

<h3>5. La valeur marquée</h3>
<p>Un stéréotype ne se contente pas d'étiqueter : il peut <strong>ajouter des propriétés</strong> à l'élément qu'il étend. Ces propriétés s'appellent des <strong>valeurs marquées</strong> (<em>tagged values</em>). Elles se notent entre <strong>accolades</strong>, sous forme <code>propriete = valeur</code> :</p>
<pre class="pseudo">   +---------------------------------------+
   |             &laquo;entite&raquo;                 |
   |                Jeu                    |
   |  {table = "jeu", cle = "id_jeu"}      |   # VALEURS MARQUEES
   +---------------------------------------+
   | - titre : String                      |
   | - stock_location : Integer            |
   | - stock_vente : Integer               |
   +---------------------------------------+

# Le stereotype &laquo;entite&raquo; DEFINIT les proprietes disponibles :
#     table : String
#     cle   : String
# Chaque classe stereotypee leur donne UNE VALEUR.</pre>
<p>C'est exactement ce mécanisme qui permet à un générateur de code de produire, à partir de ton diagramme, le fichier de correspondance objet-relationnel de la Ludothèque.</p>

<h3>6. La contrainte</h3>
<p>Un profil peut enfin porter des <strong>contraintes</strong> : des règles que tout élément portant le stéréotype doit respecter. On les écrit souvent en <strong>OCL</strong> (<em>Object Constraint Language</em>), le langage de contraintes normalisé par l'OMG aux côtés d'UML.</p>
<pre class="pseudo"># Contraintes attachees au profil de la Ludotheque
context &laquo;entite&raquo;
   inv : self.attributs-&gt;exists(a | a.estIdentifiant)
   # toute entite doit posseder un identifiant

context &laquo;ihm&raquo;
   inv : self.dependances-&gt;forAll(d | not d.cible.aPourStereotype(&laquo;entite&raquo;))
   # une classe d'IHM ne doit JAMAIS dependre directement d'une entite</pre>
<p>Tu n'as pas besoin de maîtriser OCL pour l'examen. Retiens simplement que la contrainte est le <strong>troisième pilier</strong> du profil, à côté du stéréotype et de la valeur marquée, et qu'elle rend les règles d'architecture <strong>vérifiables automatiquement</strong>.</p>

<h3>7. La notation du diagramme de profil</h3>
<p>Le diagramme de profil lui-même se dessine comme un <strong>paquetage</strong> portant le mot-clé <code>&laquo;profile&raquo;</code>. À l'intérieur, on trouve :</p>
<pre class="pseudo">- les METACLASSES etendues, notees avec le mot-cle &laquo;metaclass&raquo;
  (ce sont des concepts d'UML lui-meme : Class, Component, Operation...)
- les STEREOTYPES que l'on definit
- la relation d'EXTENSION entre les deux</pre>
<p>La relation <strong>« extension »</strong> se note par une flèche allant du <strong>stéréotype</strong> vers la <strong>métaclasse</strong>, terminée par une <strong>pointe triangulaire pleine</strong> :</p>
<pre class="pseudo">   +==========================================================+
   |  &laquo;profile&raquo;  ProfilLudotheque                            |
   |                                                          |
   |   +---------------------+           +------------------+ |
   |   |    &laquo;metaclass&raquo;      |&lt;|---------|   &laquo;stereotype&raquo;  | |
   |   |        Class        |           |      entite      | |
   |   +---------------------+           | table : String   | |
   |             ^                       | cle   : String   | |
   |             |                       +------------------+ |
   |             |                                            |
   |             |                       +------------------+ |
   |             +-----------------------|   &laquo;stereotype&raquo;  | |
   |             |                       |     service      | |
   |             |                       +------------------+ |
   |             |                       +------------------+ |
   |             +-----------------------|   &laquo;stereotype&raquo;  | |
   |                                     |       ihm        | |
   |                                     +------------------+ |
   +==========================================================+

# La fleche part du STEREOTYPE et pointe vers la METACLASSE.
# Sa pointe est TRIANGULAIRE et PLEINE (ici notee |&lt; faute de mieux
# en texte brut). Lecture : "le stereotype entite ETEND la
# metaclasse Class".</pre>
<div class="tip">Ne confonds pas cette flèche avec la généralisation du diagramme de classes, dont la pointe triangulaire est <strong>creuse</strong>. Ici, la pointe est <strong>pleine</strong>, et la relation s'appelle <strong>extension</strong>, pas héritage.</div>

<h3>8. Des profils réels, que tu croiseras</h3>
<pre class="pseudo">SysML   # profil d'INGENIERIE SYSTEME : etend UML pour modeliser des

<p>Le point commun de ces trois exemples : aucun n'a <em>changé</em> UML. Tous l'ont <strong>spécialisé</strong>. C'est la raison d'être du mécanisme de profil, et la raison pour laquelle un modèle SysML reste lisible par un outil UML standard.</p>

<h3>9. Les stéréotypes standard, ceux que tu utilises déjà</h3>
<p>UML fournit lui-même un jeu de stéréotypes courants. Tu en as employé plusieurs sans forcément les nommer ainsi :</p>
<pre class="pseudo">&laquo;interface&raquo;    # le classifieur est un contrat, sans implementation
&laquo;enumeration&raquo;  # le classifieur est une liste de valeurs fixes
                # (exemple : EtatLocation = {en_cours, rendue, en_retard})
&laquo;abstract&raquo;     # le classifieur ne peut pas etre instancie directement
&laquo;create&raquo;       # l'operation (ou le message) CREE l'objet cible
&laquo;destroy&raquo;      # l'operation (ou le message) DETRUIT l'objet cible

# Et ceux que tu as croises les jours precedents :
&laquo;component&raquo;    # jour 22 : unite logicielle modulaire et remplacable
&laquo;use&raquo;          # jour 22 : dependance d'utilisation
&laquo;device&raquo;       # jour 23 : unite materielle de traitement
&laquo;executionEnvironment&raquo;  # jour 23 : environnement d'execution
&laquo;artifact&raquo;     # jour 23 : fichier concret
&laquo;deploy&raquo;       # jour 23 : artefact deploye sur un noeud
&laquo;manifest&raquo;     # jour 23 : artefact manifestant un element de modele
&laquo;include&raquo; / &laquo;extend&raquo;   # relations entre cas d'utilisation</pre>
<p>Tu comprends maintenant pourquoi tous ces mots-clés s'écrivent entre guillemets français : ce sont des <strong>stéréotypes</strong>. Le mécanisme que tu découvres aujourd'hui était à l'œuvre depuis le premier jour.</p>
