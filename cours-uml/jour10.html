<h3>2. La généralisation : factoriser le commun</h3>
<p>La <strong>généralisation</strong> (ou héritage) relie une <strong>sous-classe</strong> à une <strong>super-classe</strong> plus générale. Elle se lit toujours dans le sens « <strong>est un</strong> » : <em>un Membre est une Personne</em>. La sous-classe <strong>hérite</strong> de tous les attributs, opérations et associations de la super-classe, et peut y ajouter les siens.</p>
<p>Notation : un <strong>trait plein</strong> terminé par une <strong>pointe triangulaire creuse (non remplie)</strong>, dirigée vers la <strong>super-classe</strong>.</p>
<pre class="pseudo">                    +---------------------------+
                    |         Personne          |   &lt;- SUPER-CLASSE
                    +---------------------------+
                    | - nom : String            |
                    | - prenom : String         |
                    | - email : String          |
                    +---------------------------+
                    | + sIdentifier() : String  |
                    +---------------------------+
                                 /_\   &lt;- triangle CREUX,
                                  |       pointe vers le HAUT
                   +--------------+--------------+
                   |                             |
   +---------------------------+   +---------------------------+
   |          Membre           |   |          Employe          |
   +---------------------------+   +---------------------------+
   | - dateAdhesion : Date     |   | - matricule : String      |
   | - caution : double        |   | - fonction : String       |
   +---------------------------+   +---------------------------+
# Membre possede DEJA nom, prenom, email et sIdentifier() :
# il n'y a aucune raison de les recopier.
# Le triangle CREUX est du cote de la SUPER-CLASSE. Toujours.</pre>
<div class="warn"><strong>Deux écarts avec ton support d'école, sur la même page.</strong><br>1. Le support écrit que la généralisation se note « avec une <strong>pointe triangulaire pleine</strong> ». C'est <strong>inexact</strong> : en UML 2.5.1, la pointe de la généralisation est <strong>creuse (non remplie)</strong>. Le seul triangle plein d'UML est le minuscule marqueur de sens de lecture d'un nom d'association, vu hier — un objet complètement différent.<br>2. Le support affirme aussi que « la super-classe est <strong>par définition</strong> une classe abstraite ». C'est <strong>faux</strong>. Une super-classe <strong>peut</strong> être abstraite, et c'est souvent un bon choix — mais rien ne l'y oblige : une super-classe UML parfaitement instanciable est légale et courante. Abstraite ou non, c'est une <strong>décision de conception</strong>, pas une conséquence de l'héritage.</div>

<h3>3. La classe abstraite et l'opération abstraite</h3>
<p>Une <strong>classe abstraite</strong> est une classe qui <strong>ne peut pas être instanciée</strong> : elle n'existe que pour être héritée. On la note en écrivant son <strong>nom en italique</strong>, ou en ajoutant la contrainte <code>{abstract}</code> (utile quand on dessine à la main, où l'italique ne se voit pas).</p>
<p>Une <strong>opération abstraite</strong> suit la même règle : son nom est <strong>en italique</strong>. Elle déclare une signature sans fournir de corps ; ce sont les sous-classes qui devront l'implémenter.</p>
<pre class="pseudo">   +---------------------------------+
   |            Personne             |  &lt;- nom en ITALIQUE
   |           {abstract}            |     (ou {abstract} ecrit)
   +---------------------------------+
   | - nom : String                  |
   | - prenom : String               |
   +---------------------------------+
   | + sIdentifier() : String        |  &lt;- operation CONCRETE
   | + calculerTarif(b:double):double|  &lt;- en ITALIQUE = operation
   +---------------------------------+     ABSTRAITE, sans corps
# On ne peut pas ecrire "new Personne()" : Personne est abstraite.
# En revanche "new Membre()" fonctionne, a condition que Membre
# fournisse un corps a calculerTarif().</pre>
<div class="tip">Le test pour décider : <strong>« un objet de cette classe, tout seul, a-t-il un sens dans le métier ? »</strong> Une « Personne » de la ludothèque qui ne serait ni membre ni employé n'existe pas dans les faits : la classe mérite d'être abstraite. À l'inverse, si la gérante enregistre parfois de simples « contacts » qui ne sont rien d'autre, alors <code>Personne</code> doit rester concrète — et l'affirmation du support tombe d'elle-même.</div>

<h3>4. L'héritage multiple et les contraintes sur la généralisation</h3>
<p><strong>UML autorise l'héritage multiple</strong> : une classe peut avoir plusieurs super-classes. (Beaucoup de langages l'interdisent — Java, C# — mais c'est une limite du langage, pas d'UML.)</p>
<p>Quand plusieurs sous-classes partagent la même super-classe, elles forment un <strong>ensemble de généralisation</strong> (<em>GeneralizationSet</em>). UML permet de le qualifier par deux couples de contraintes, écrites entre accolades près du triangle :</p>
<pre class="pseudo">{complete}    # toutes les sous-classes possibles sont dessinees
{incomplete}  # il en manque : d'autres pourront etre ajoutees

{disjoint}    # un objet appartient a UNE SEULE sous-classe
{overlapping} # un objet peut appartenir a PLUSIEURS sous-classes

# Les deux couples se combinent : on ecrit par exemple
#   {incomplete, overlapping}

                    +----------------+
                    |    Personne    |
                    +----------------+
                            /_\
                             |
              +--------------+--------------+
              |   {incomplete, overlapping} |
   +----------------+             +----------------+
   |     Membre     |             |     Employe    |
   +----------------+             +----------------+
# {overlapping} : un Employe de la ludotheque PEUT aussi etre
#   Membre et louer des jeux. Souviens-toi : c'etait l'une des
#   questions metier non tranchees du jour 1.
# {incomplete} : rien n'interdit d'ajouter demain une sous-classe
#   Benevole ou Fournisseur.</pre>
<div class="warn"><strong>Écart avec ton support d'école.</strong> Ces quatre mots-clés sont normalisés <strong>en anglais</strong> : <code>{complete}</code>, <code>{incomplete}</code>, <code>{disjoint}</code>, <code>{overlapping}</code>. Le support du PAC les écrit <strong>traduits en français</strong> — tu y liras <code>{complète}</code>, <code>{incomplète}</code>, <code>{disjoint}</code> et <code>{chevauchement}</code>. Le sens est le même, la forme n'est pas normative. En examen d'école, écris ce que ton cours enseigne ; dans un outil ou une documentation, écris l'anglais.</div>

<h3>5. L'interface : contractualiser un service</h3>
<p>Une <strong>interface</strong> est un <strong>contrat</strong> : une liste d'opérations, sans aucune implémentation et sans attribut d'état. Elle répond à la deuxième question du jour : <em>comment dire que trois classes très différentes savent faire la même chose ?</em></p>
<p>Première notation : le <strong>classifieur stéréotypé</strong>. On dessine un rectangle de classe ordinaire, avec le stéréotype <code>&lt;&lt;interface&gt;&gt;</code> au-dessus du nom.</p>
<pre class="pseudo">   +---------------------------------+
   |         &lt;&lt;interface&gt;&gt;           |
   |           Empruntable           |
   +---------------------------------+
   | + emprunter(m : Membre) : void  |
   | + retourner(etat : String):void |
   | + estDisponible() : boolean     |
   +---------------------------------+
# Pas de compartiment d'attributs : une interface ne porte pas
# d'etat, seulement des operations.</pre>

<h3>6. Réalisation et dépendance : les deux façons d'être lié à une interface</h3>
<p>Deux classes bien distinctes gravitent autour d'une interface, et UML les note différemment.</p>
<p>La classe qui <strong>fournit</strong> le service <strong>réalise</strong> l'interface. La <strong>réalisation</strong> se note par un <strong>trait pointillé</strong> terminé par une <strong>pointe triangulaire creuse</strong>, dirigée de la classe vers l'interface.</p>
<p>La classe qui <strong>consomme</strong> le service ne réalise rien : elle en <strong>dépend</strong>. On la relie par une <strong>dépendance</strong>, la flèche pointillée à pointe ouverte du jour 9.</p>
<pre class="pseudo">   +---------------------------------+
   |         &lt;&lt;interface&gt;&gt;           |
   |           Empruntable           |
   +---------------------------------+
                   /_\ &lt;- triangle CREUX
                    :
                    :  &lt;- trait POINTILLE = REALISATION
                    :
   +---------------------------------+
   |           Exemplaire            |  la classe FOURNIT le service
   +---------------------------------+

   +----------------+                     +------------------+
   |    Comptoir    |- - - - - - - - - - &gt;|   Empruntable    |
   +----------------+                     +------------------+
#  DEPENDANCE (fleche pointillee OUVERTE) : le Comptoir UTILISE
#  l'interface. Il ne l'implemente pas.

# LE TABLEAU A NE PAS MELANGER
#  trait PLEIN     + triangle CREUX  -&gt; GENERALISATION (heritage)
#  trait POINTILLE + triangle CREUX  -&gt; REALISATION (interface)
#  trait POINTILLE + pointe OUVERTE  -&gt; DEPENDANCE (utilisation)</pre>

<h3>7. La notation « boule » (lollipop) et la notation « socket »</h3>
<p>Quand l'interface n'a pas besoin d'être détaillée, UML propose une écriture compacte. La classe qui <strong>fournit</strong> l'interface porte un <strong>petit cercle</strong> — la <strong>boule</strong>, en anglais <em>lollipop</em> — relié par un trait, avec le nom de l'interface à côté. La classe qui la <strong>consomme</strong> porte un <strong>demi-cercle</strong> ouvert, le <strong>socket</strong>.</p>
<pre class="pseudo"># LE FOURNISSEUR : la boule (lollipop)
   +--------------+
   |  Exemplaire  |------O  Empruntable
   +--------------+
#  Strictement equivalent au trait pointille + triangle creux.

# LE CONSOMMATEUR : le socket (demi-cercle ouvert)
   +--------------+
   |   Comptoir   |- - - (  Empruntable
   +--------------+

# EMBOITES, les deux forment un connecteur d'assemblage :
   +--------------+                    +--------------+
   |  Exemplaire  |------O    (- - - - |   Comptoir   |
   +--------------+                    +--------------+
#  La boule se loge dans le socket : "Exemplaire fournit ce que
#  Comptoir demande". C'est cette image qu'on retrouvera au jour
#  22, dans le diagramme de composants.</pre>
<div class="tip">Boule et socket ne sont <strong>pas</strong> une notation au rabais : elles disent exactement la même chose que le rectangle stéréotypé, en beaucoup moins de place. On les emploie dès qu'on veut montrer <em>qui branche quoi</em> plutôt que <em>ce que contient le contrat</em>.</div>

<h3>8. L'agrégation : un ensemble et ses éléments</h3>
<p>L'<strong>agrégation</strong> est une association qui exprime une relation « <strong>ensemble / éléments</strong> » : un tout regroupe des parties, <strong>mais les parties gardent leur existence propre</strong>. Elle se note par un <strong>losange creux (blanc)</strong>, placé <strong>du côté du tout</strong>.</p>
<pre class="pseudo">   +---------------+                        +---------------+
   |   Categorie   |&lt;&gt;----------------------|      Jeu      |
   +---------------+ 1                 0..* +---------------+
#  Le losange CREUX est du cote du TOUT (Categorie).
#
#  "une Categorie est un ENSEMBLE de Jeu"
#  Supprime la categorie "Strategie" : les Jeu, eux, EXISTENT
#  toujours. On les rangera dans une autre categorie.
#  -&gt; les parties SURVIVENT au tout -&gt; losange CREUX.</pre>

<h3>9. La composition : le tout et ses parties inséparables</h3>
<p>La <strong>composition</strong> est une agrégation <strong>forte</strong>. Elle ajoute une <strong>contrainte de durée de vie</strong> : la <strong>destruction du composite entraîne la destruction des composants</strong>. Elle se note par un <strong>losange plein (noir)</strong>, également du côté du tout.</p>
<pre class="pseudo">   +---------------+                        +---------------+
   |      Jeu      |&lt;#&gt;---------------------|   Exemplaire  |
   +---------------+ 1                 1..* +---------------+
#  Le losange PLEIN est du cote du TOUT (Jeu).
#
#  "un Exemplaire n'existe PAS sans son Jeu"
#  Supprime le Jeu "Catan" du catalogue : ses Exemplaires n'ont
#  plus aucun sens, ils disparaissent avec lui.
#  -&gt; les parties MEURENT avec le tout -&gt; losange PLEIN.

# CONSEQUENCE OBLIGATOIRE SUR LA MULTIPLICITE
# Une partie ne peut appartenir qu'a UN SEUL composite a la fois.
# Donc la multiplicite du COTE DU COMPOSITE vaut 1 (ou 0..1).
#   Jeu 1 &lt;#&gt;---- 1..* Exemplaire      -&gt; correct
#   Jeu 0..* &lt;#&gt;-- 1..* Exemplaire     -&gt; INTERDIT : un exemplaire
#                                         appartiendrait a plusieurs
#                                         jeux, la regle de
#                                         destruction n'aurait
#                                         plus de sens.</pre>

<h3>10. Agrégation ou composition ? Le test de la destruction</h3>
<p>C'est la distinction que tu dois savoir trancher en trois secondes. Une seule question à poser :</p>
<pre class="pseudo"># DETRUIS LE TOUT. QUE DEVIENNENT LES PARTIES ?
#
#   elles survivent, on les range ailleurs  -&gt; AGREGATION
#                                              (losange CREUX)
#   elles n'ont plus de sens, elles meurent -&gt; COMPOSITION
#                                              (losange PLEIN)
#
# Applique a la Ludotheque
#   Categorie / Jeu        : je supprime "Strategie", les jeux
#                            restent au catalogue -&gt; AGREGATION
#   Jeu / Exemplaire       : je retire "Catan" du catalogue, ses
#                            exemplaires n'existent plus -&gt; COMPOSITION
#   Membre / Avis          : je radie un membre, ses avis peuvent
#                            etre conserves ou supprimes -&gt; c'est
#                            une REGLE METIER a demander a la
#                            gerante. Ne devine pas.</pre>
<div class="warn">Le losange plein est un <strong>engagement</strong>, pas une décoration. Il dit littéralement « la partie meurt avec le tout ». Si tu n'es pas capable de justifier cette phrase pour la relation que tu dessines, mets un losange creux — ou une association ordinaire. Une composition posée par habitude produit, au moment du codage ou de la création des tables, des suppressions en cascade que personne n'avait demandées.</div>

<h3>11. Héritage ou composition ? « Est un » contre « est composé de »</h3>
<p>Deuxième confusion classique, et elle est plus grave : héritage et composition ne se ressemblent pas du tout, mais on les choisit pour des raisons voisines (éviter de répéter du code). Le départage est purement sémantique.</p>
<pre class="pseudo">"EST UN"          -&gt; GENERALISATION (trait plein, triangle CREUX)
"EST COMPOSE DE"  -&gt; COMPOSITION    (trait plein, losange PLEIN)

# Le test, applique a la Ludotheque
#   "Un Membre EST UNE Personne ?"        OUI -&gt; heritage
#   "Un Employe EST UNE Personne ?"       OUI -&gt; heritage
#   "Un Jeu EST UN Exemplaire ?"          NON -&gt; surtout pas
#   "Un Exemplaire FAIT PARTIE d'un Jeu ?" OUI -&gt; composition
#   "Une Location EST UNE Vente ?"        NON, les deux sont
#                                          des operations payantes
#                                          -&gt; interface commune
#                                             Payable, pas heritage

# LE REFLEXE DE CONCEPTION
# Quand tu hesites entre heritage et composition, la composition
# est presque toujours le choix le plus sur : elle se modifie
# sans casser les sous-classes existantes. On n'herite que
# lorsque le "est un" est vrai dans le METIER, pas parce que
# deux classes ont trois attributs en commun.</pre>

 ET SA DEPENDANCE\n'    Payable <|.. Location = REALISATION : trait POINTILLE\n'    + triangle CREUX, de la classe vers l'interface.\n'    Comptoir ..> Payable = DEPENDANCE : fleche POINTILLEE\n'    a pointe OUVERTE. Le Comptoir UTILISE le contrat,\n'    il ne l'implemente pas.\n' ==============================================================\n\ninterface Payable {\n  + montant() : double\n}\n\nclass Location {\n  - date_debut : Date\n  - date_fin : Date\n  - caution : double\n  + montant() : double\n  + prolonger(jours : int) : void\n}\n\nclass Vente {\n  - date : Date\n  - quantite : int\n  + montant() : double\n}\n\nclass Achat {\n  - date : Date\n  - quantite : int\n  + montant() : double\n}\n\nclass Comptoir {\n  + encaisser(p : Payable) : void\n}\n\nPayable <|.. Location\nPayable <|.. Vente\nPayable <|.. Achat\nComptoir ..> Payable : utilise >\n\n' JUSTIFICATION : aucune des trois classes n'EST une des deux\n' autres. Elles partagent seulement un CONTRAT (savoir dire\n' combien on paie) -> interface, pas heritage.\n\n' ==============================================================\n' 3. AGREGATION vs COMPOSITION\n'    o-- = losange CREUX (agregation) : les parties SURVIVENT.\n'    *-- = losange PLEIN (composition) : les parties MEURENT\n'          avec le tout. Le losange est TOUJOURS du cote du TOUT.\n' ==============================================================\n\nclass Categorie {\n  - nom : String\n}\n\nclass Jeu {\n  - titre : String\n  - prix_location : double\n  - prix_vente : double\n  - stock_location : int\n  - stock_vente : int\n}\n\nclass Exemplaire {\n  - numero : String\n  - etat : String\n}\n\n' TEST DE LA DESTRUCTION : je supprime la Categorie \"Strategie\".\n' Les Jeu restent au catalogue, on les reclasse ailleurs.\n' -> les parties SURVIVENT -> AGREGATION (losange CREUX).\nCategorie \"1\" o-- \"0..*\" Jeu : regroupe >\n\n' TEST DE LA DESTRUCTION : je retire le Jeu \"Catan\" du catalogue.\n' Ses Exemplaires n'ont plus aucun sens, ils disparaissent.\n' -> les parties MEURENT -> COMPOSITION (losange PLEIN).\n' Multiplicite 1 cote composite : un Exemplaire n'appartient\n' qu'a UN SEUL Jeu, sinon la destruction en cascade serait absurde.\nJeu \"1\" *-- \"1..*\" Exemplaire : possede >\n\n' Les operations payantes se rattachent aux acteurs et aux objets\n' par de simples associations (jour 9).\nMembre \"1\" -- \"0..*\" Location : effectue >\nExemplaire \"1\" -- \"0..*\" Location : concerne >\nMembre \"1\" -- \"0..*\" Vente : effectue >\nJeu \"1\" -- \"0..*\" Vente : porte sur >\n\n@enduml\n\n# ==============================================================\n# CE QUE PLANTUML NE DESSINE PAS ICI — a faire a la main\n# ==============================================================\n\n# LA NOTATION BOULE (lollipop) : l'interface FOURNIE\n#   +--------------+\n#   |   Location   |------O  Payable\n#   +--------------+\n#   Strictement equivalent a  Payable <|.. Location.\n\n# LA NOTATION SOCKET : l'interface REQUISE\n#   +--------------+\n#   |   Comptoir   |- - - (  Payable\n#   +--------------+\n\n# EMBOITEES, elles forment un connecteur d'assemblage :\n#   +--------------+                    +--------------+\n#   |   Location   |------O    (- - - - |   Comptoir   |\n#   +--------------+                    +--------------+\n\n# ==============================================================\n# LES QUATRE TRAITS, EN RESUME\n# ==============================================================\n#   A <|-- B   trait PLEIN     + triangle CREUX -> B est un A\n#   A <|.. B   trait POINTILLE + triangle CREUX -> B realise A\n#   A ..> B    fleche POINTILLEE ouverte        -> A a besoin de B\n#   A o-- B    losange CREUX cote A             -> A regroupe des B\n#   A *-- B    losange PLEIN  cote A            -> B meurt avec A\n#\n# LE TEST QUI TRANCHE TOUT :\n#   \"est un\"         -> heritage   (triangle creux)\n#   \"est compose de\" -> composition (losange plein)\n#   \"regroupe\"       -> agregation  (losange creux)\n#   \
