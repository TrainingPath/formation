  theory: `
<h3>1. Deux problèmes que le jour 3 a laissés ouverts</h3>
<p>Ton diagramme de la Ludothèque tient debout, mais deux situations lui manquent :</p>
<pre class="pseudo">Probleme 1 — LA REPETITION
  Louer un jeu, Vendre un jeu et Reserver un jeu commencent tous
  par la meme chose : le membre doit s'authentifier.
  -> comment ecrire ce comportement UNE SEULE FOIS ?

Probleme 2 — L'EXCEPTIONNEL
  Quand on rend un exemplaire, on applique parfois une penalite
  de retard. Parfois seulement : si la date de retour est depassee.
  -> comment noter un comportement OPTIONNEL sans alourdir le cas ?</pre>
<p>UML répond avec deux relations entre cas d'utilisation : <code>&lt;&lt;include&gt;&gt;</code> pour le premier problème, <code>&lt;&lt;extend&gt;&gt;</code> pour le second. Toutes deux se dessinent avec une <strong>flèche pointillée</strong> stéréotypée. La seule difficulté — mais elle est réelle — c'est le <strong>sens</strong> de la flèche.</p>

<h3>2. La relation include : obligatoire et partagée</h3>
<p><code>&lt;&lt;include&gt;&gt;</code> exprime un comportement <strong>obligatoire et partagé</strong>. Le cas inclus est <em>toujours</em> exécuté quand le cas de base l'est. On l'emploie pour <strong>factoriser</strong> ce que plusieurs cas ont en commun.</p>
<pre class="pseudo"># SENS DE LA FLECHE : du CAS DE BASE vers le CAS INCLUS

  ( Louer un jeu ) ......&gt;  ( S'authentifier )
                &lt;&lt;include&gt;&gt;

  ( Vendre un jeu ) .....&gt;  ( S'authentifier )
                &lt;&lt;include&gt;&gt;

# Lecture : "Louer un jeu INCLUT S'authentifier"
# Le cas de base SAIT qu'il appelle l'inclus : c'est lui
#   qui pointe. L'inclus, lui, ignore qui l'appelle.</pre>
<p>Le moyen mnémotechnique : la phrase se lit dans le sens de la flèche. « Louer un jeu inclut S'authentifier » — le sujet de la phrase est le cas de base, et c'est de lui que part le trait.</p>
<div class="tip">Conséquence pratique : si tu supprimes le cas inclus, le cas de base devient incomplet. C'est le test de l'obligation. Une location <em>sans</em> authentification n'a pas de sens ; donc c'est bien un <code>&lt;&lt;include&gt;&gt;</code>.</div>

<h3>3. La relation extend : optionnelle et conditionnelle</h3>
<p><code>&lt;&lt;extend&gt;&gt;</code> exprime un comportement <strong>optionnel et conditionnel</strong>. Le cas d'extension ajoute quelque chose au cas étendu, mais <em>seulement si</em> une condition est vraie. Sans lui, le cas étendu reste parfaitement valable.</p>
<pre class="pseudo"># SENS DE LA FLECHE : du CAS D'EXTENSION vers le CAS ETENDU
#   c'est-a-dire l'INVERSE de include

  ( Appliquer une penalite de retard ) ......&gt; ( Rendre un exemplaire )
                                  &lt;&lt;extend&gt;&gt;

# Lecture : "Appliquer une penalite ETEND Rendre un exemplaire"
# Le cas ETENDU ignore totalement son extension : il fonctionne
#   sans elle. C'est l'extension qui sait ou elle se greffe,
#   donc c'est elle qui pointe.</pre>
<div class="warn"><strong>Attention, écart avec ton cours d'école.</strong> Le support du PAC formule le sens de <code>&lt;&lt;extend&gt;&gt;</code> de façon contradictoire d'un paragraphe à l'autre. La norme <strong>UML 2.5.1</strong> est sans ambiguïté : la flèche pointillée part du <strong>cas d'extension</strong> et pointe vers le <strong>cas étendu</strong> (le cas de base). Ton cours note ceci autrement par endroits — apprends la règle de la norme, et si l'examen reprend la formulation du support, sache reconnaître les deux écritures.</div>
<p>La règle profonde, celle qui permet de retrouver le sens sans l'apprendre par cœur : <strong>la flèche part toujours de celui qui connaît l'autre.</strong> Dans <code>include</code>, c'est le cas de base qui sait qu'il appelle l'inclus. Dans <code>extend</code>, c'est l'extension qui sait où elle se greffe — le cas étendu, lui, ne sait rien d'elle.</p>

<h3>4. Le point d'extension</h3>
<p>Puisque le cas étendu ignore son extension, il faut bien indiquer <strong>à quel endroit</strong> celle-ci s'insère. C'est le rôle du <strong>point d'extension</strong> : un nom déclaré dans un <strong>compartiment</strong> du cas étendu.</p>
<pre class="pseudo">        +----------------------------------+
       (   Rendre un exemplaire            )
        |----------------------------------|   &lt;- compartiment
        | points d'extension :             |
        |    controle_retard               |   &lt;- le point nomme
        +----------------------------------+
                      ^
                      : &lt;&lt;extend&gt;&gt;
                      :   (controle_retard)
        ( Appliquer une penalite de retard )

# La CONDITION se note dans une NOTE attachee au lien :
#   +--------------------------------------+
#   | condition : {date_retour &gt; date_prevue} |
#   | point d'extension : controle_retard  |
#   +--------------------------------------+</pre>
<p>Trois éléments donc, à ne pas confondre : le <strong>point d'extension</strong> (où), la <strong>condition</strong> (quand), et le <strong>cas d'extension</strong> (quoi). Un même cas étendu peut déclarer plusieurs points d'extension.</p>

<h3>5. Le cas interne</h3>
<p>Un <strong>cas interne</strong> est un cas d'utilisation <strong>non directement accessible à un acteur</strong>. Il n'a aucune association avec un bonhomme : il n'existe que parce qu'un autre cas l'inclut ou l'étend.</p>
<pre class="pseudo">Membre ---- ( Louer un jeu ) ......&gt; ( S'authentifier )
                                        ^
                                        |
              aucun acteur relie ici ---+
              -> "S'authentifier" est un CAS INTERNE

# Il est bien DANS la frontiere (le systeme le realise),
# mais aucun acteur ne le declenche directement :
# on ne vient pas a la ludotheque pour "s'authentifier",
# on vient pour louer.</pre>
<div class="tip">Ne t'inquiète pas de voir un cas sans acteur : ce n'est pas une erreur de diagramme dès lors qu'il est la cible d'un <code>include</code> ou la source d'un <code>extend</code>. Ce qui serait une erreur, c'est un cas <em>isolé</em>, sans acteur <strong>et</strong> sans relation.</p></div>

<h3>6. Le tableau qui règle la question</h3>
<pre class="pseudo">                    &lt;&lt;include&gt;&gt;          &lt;&lt;extend&gt;&gt;
                    -----------          ----------
Nature              obligatoire          optionnel
Declenchement       systematique         sous condition
Sens de la fleche   base ---&gt; inclus     extension ---&gt; etendu
Qui connait qui     la base connait      l'extension connait
                    l'inclus             le cas etendu
Si on l'enleve      la base devient      la base reste
                    incomplete           complete et valide
Point d'extension   non                  oui (nomme)
Condition en note   non                  oui
Sert a              FACTORISER           ISOLER L'EXCEPTIONNEL</pre>
<div class="warn">L'erreur classique en examen : utiliser <code>&lt;&lt;extend&gt;&gt;</code> pour découper un gros cas en morceaux. Découper, c'est <code>&lt;&lt;include&gt;&gt;</code>. <code>&lt;&lt;extend&gt;&gt;</code> ne sert que pour ce qui <strong>n'arrive pas toujours</strong>.</div>

<h3>7. Ce que le diagramme ne dit pas</h3>
<p>Regarde l'ellipse « Louer un jeu ». Elle ne te dit pas : dans quel ordre les choses se passent, ce qu'il faut vérifier avant, ce qui se passe si le <code>stock_location</code> est à zéro, ni ce qui est vrai à la fin.</p>
<p>C'est pour cela que <strong>tout cas d'utilisation important doit être accompagné d'une description textuelle</strong>. Le diagramme donne la carte ; la description donne l'itinéraire. Ton cours impose un gabarit en <strong>trois blocs</strong>.</p>

<h3>8. Bloc 1 — IDENTIFICATION</h3>
<pre class="pseudo">IDENTIFICATION
  Nom du cas        : Louer un jeu
  But               : permettre a un membre d'emporter un
                      exemplaire pour une duree determinee,
                      contre une caution
  Acteur principal  : Membre
  Acteur secondaire : Systeme de paiement
  Date              : 02/08/2026
  Responsable       : A. Toumi
  Version           : 1.2</pre>
<p>Les quatre dernières rubriques ne sont pas du remplissage administratif : un modèle vit, il est relu, discuté, corrigé. Sans <strong>date</strong>, <strong>responsable</strong> et <strong>version</strong>, personne ne sait quelle description fait foi.</p>

<h3>9. Bloc 2 — SÉQUENCEMENT</h3>
<p>C'est le cœur. Il s'ouvre par une <strong>phrase de déclenchement</strong> qui dit ce qui met le cas en marche, puis enchaîne cinq rubriques.</p>
<pre class="pseudo">SEQUENCEMENT
  Le cas commence lorsqu'un membre se presente au guichet
  avec un exemplaire qu'il souhaite emporter.

  Pre-conditions
    - le membre est inscrit et son compte n'est pas suspendu
    - stock_location de l'exemplaire est superieur a 0

  Enchainement nominal
    1. le membre presente sa carte
    2. le systeme authentifie le membre
    3. le membre designe l'exemplaire souhaite
    4. le systeme verifie stock_location
    5. le systeme calcule le montant : prix_location + caution
    6. le systeme demande le blocage de la caution au
       Systeme de paiement
    7. le Systeme de paiement confirme
    8. le systeme enregistre la Location avec date_debut
    9. le systeme decremente stock_location
   10. le systeme edite le ticket de location

  Enchainements alternatifs
    A1 : au point 3, le membre a une Reservation en cours pour
         ce jeu -> le systeme reprend l'exemplaire reserve et
         poursuit au point 4
    A2 : au point 6, le membre paie la caution en especes ->
         le systeme enregistre l'encaissement et poursuit au 8

  Enchainements d'exception
    E1 : au point 2, l'authentification echoue apres trois
         essais -> le cas s'arrete, aucune Location creee
    E2 : au point 4, stock_location vaut 0 -> le systeme
         propose une Reservation et le cas s'arrete
    E3 : au point 7, le Systeme de paiement refuse la caution
         -> le cas s'arrete, aucune Location creee

  Post-conditions
    - si succes : une Location existe, datee de date_debut,
      et stock_location a diminue de 1
    - si echec : aucune Location n'a ete creee et
      stock_location est inchange</pre>
<p>Retiens la distinction qui tombe presque toujours à l'examen :</p>
<pre class="pseudo">ENCHAINEMENT NOMINAL     # le chemin ideal, celui qui reussit
ENCHAINEMENTS ALTERNATIFS# d'AUTRES chemins qui menent AUSSI
                         #   au SUCCES (le but est atteint,
                         #   autrement)
ENCHAINEMENTS D'EXCEPTION# des chemins qui menent a l'ECHEC
                         #   (le but n'est PAS atteint)</pre>
<div class="warn">Piège fréquent : « le membre paie en espèces » n'est pas une exception, c'est un <strong>alternatif</strong> — le jeu est bien loué au bout du compte. Et « le paiement est refusé » n'est pas un alternatif, c'est une <strong>exception</strong> — personne ne repart avec le jeu. Le critère n'est pas « est-ce inhabituel ? », c'est <strong>« le but est-il atteint ? »</strong>.</div>
<div class="tip">Autre point technique souvent raté : les <strong>post-conditions</strong> doivent être vraies <strong>que le scénario ait réussi ou échoué</strong>. On ne se contente donc pas d'écrire ce qu'on obtient en cas de succès : on précise aussi l'état du système après un échec. C'est ce qui garantit qu'aucune donnée n'est laissée à moitié écrite.</div>

<h3>10. Bloc 3 — RUBRIQUES OPTIONNELLES</h3>
<pre class="pseudo">RUBRIQUES OPTIONNELLES

  { id: "uml-j04", title: "Factoriser le diagramme et rédiger la description de « Louer un jeu »", level: 3,
    statement: "Deux travaux sur la Ludothèque.<br><strong>(1) Le diagramme.</strong> Reprends ton diagramme du jour 3 et enrichis-le : « Louer un jeu », « Vendre un jeu » et « Réserver un jeu » commencent tous par une authentification ; et lorsqu'un membre rend un exemplaire en retard, on applique une pénalité prélevée sur la <code>caution</code>. Utilise <code>&lt;&lt;include&gt;&gt;</code> et <code>&lt;&lt;extend&gt;&gt;</code> avec le bon sens de flèche, déclare un <strong>point d'extension</strong> nommé et note la <strong>condition</strong> dans une note.<br><strong>(2) La description textuelle.</strong> Rédige la description complète du cas <strong>« Louer un jeu »</strong> en suivant le gabarit à trois blocs : IDENTIFICATION, SÉQUENCEMENT (phrase de déclenchement, pré-conditions, enchaînement nominal numéroté, enchaînements alternatifs, enchaînements d'exception, post-conditions) et RUBRIQUES OPTIONNELLES. Ton scénario doit faire intervenir <code>stock_location</code>, <code>prix_location</code>, <code>caution</code>, <code>date_debut</code> et le <strong>Système de paiement</strong>.",
    hints: [
      "Pour choisir entre include et extend, pose-toi une seule question : « est-ce que ça arrive à TOUS les coups ? ». Si oui, include. Si c'est sous condition, extend.",
      "Pour le sens de la flèche, applique la règle : elle part de celui qui CONNAÎT l'autre. Le cas de base connaît son inclus ; l'extension connaît le cas qu'elle étend.",
      "Pour trier alternatifs et exceptions, ne te demande pas si c'est rare, mais si le BUT est atteint. Payer en espèces : le jeu est loué, donc alternatif. Paiement refusé : personne ne repart avec le jeu, donc exception."
    ],
    checklist: [
      "« S'authentifier » est relié par &lt;&lt;include&gt;&gt; à Louer, Vendre et Réserver, avec la flèche partant de chaque cas de base VERS S'authentifier, et aucun acteur ne lui est directement relié (cas interne).",
      "« Appliquer une pénalité de retard » est relié par &lt;&lt;extend&gt;&gt; avec la flèche partant DE la pénalité VERS « Rendre un exemplaire », un point d'extension nommé est déclaré dans un compartiment du cas étendu, et la condition figure dans une note.",
      "La description contient les trois blocs en capitales avec TOUTES les rubriques du gabarit : Nom, But, Acteur principal, Acteur secondaire, Date, Responsable, Version, puis phrase de déclenchement, Pré-conditions, Enchaînement nominal numéroté, Enchaînements alternatifs, Enchaînements d'exception, Post-conditions, puis les deux types de contraintes.",
      "Chaque enchaînement alternatif mène bien au SUCCÈS et chaque enchaînement d'exception mène bien à l'ÉCHEC, et les post-conditions décrivent l'état du système DANS LES DEUX CAS (réussite et échec)."
    ],
    solution: "@startuml\n' Partie 1 — Diagramme enrichi de la Ludotheque, jour 4\n\nleft to right direction\n\nactor Membre\nactor Employe\nactor \"Systeme de paiement\" as Paiement\n\nrectangle Ludotheque {\n\n  usecase \"Louer un jeu\" as UC1\n  usecase \"Vendre un jeu\" as UC2\n  usecase \"Reserver un jeu\" as UC3\n\n  ' Le cas etendu declare son POINT D'EXTENSION dans un\n  ' compartiment : c'est l'endroit ou l'extension se greffe.\n  usecase \"Rendre un exemplaire\\n--\\npoints d'extension :\\n  controle_retard\" as UC4\n\n  ' Cas INTERNE : aucun acteur ne lui sera relie.\n  usecase \"S'authentifier\" as UC5\n\n  ' Cas d'EXTENSION : lui non plus n'a pas d'acteur direct.\n  usecase \"Appliquer une penalite de retard\" as UC6\n}\n\n' --- Associations avec les acteurs (trait simple) ---\nMembre -- UC1\nMembre -- UC3\nEmploye -- UC1\nEmploye -- UC2\nEmploye -- UC4\nUC1 -- Paiement\nUC2 -- Paiement\n' Paiement reste ACTEUR SECONDAIRE : sollicite, jamais initiateur.\n\n' --- INCLUDE : obligatoire et partage ---\nUC1 ..> UC5 : <<include>>\nUC2 ..> UC5 : <<include>>\nUC3 ..> UC5 : <<include>>\n' Sens : du CAS DE BASE vers le CAS INCLUS.\n' Lecture : \"Louer un jeu INCLUT S'authentifier\".\n' L'authentification a lieu a TOUS les coups ; si on la retire,\n' les trois cas de base deviennent incomplets.\n' S'authentifier n'a aucun acteur : c'est un CAS INTERNE.\n\n' --- EXTEND : optionnel et conditionnel ---\nUC6 ..> UC4 : <<extend>>\n' Sens : du CAS D'EXTENSION vers le CAS ETENDU.\n' C'est l'INVERSE d'include. Regle generale : la fleche part\n' de celui qui CONNAIT l'autre. Ici l'extension sait ou elle\n' se greffe ; \"Rendre un exemplaire\" ignore tout d'elle et\n' fonctionne parfaitement sans elle.\n\nnote on link\n  condition : {date_retour > date_prevue}\n  point d'extension : controle_retard\nend note\n' La NOTE porte la CONDITION (quand), le compartiment porte le\n' POINT D'EXTENSION (ou), et UC6 est le comportement (quoi).\n\n@enduml\n\n\n' =========================================================\n' Partie 2 — Description textuelle du cas \"Louer un jeu\"\n' =========================================================\n\n' IDENTIFICATION\n'   Nom du cas        : Louer un jeu\n'   But               : permettre a un membre d'emporter un\n'                       exemplaire pour une duree determinee,\n'                       contre le paiement du prix_location et\n'                       le blocage d'une caution\n'   Acteur principal  : Membre\n'   Acteur secondaire : Systeme de paiement\n'   Date              : 02/08/2026\n'   Responsable       : A. Toumi\n'   Version           : 1.0\n\n' SEQUENCEMENT\n'   Le cas commence lorsqu'un membre se presente au guichet\n'   avec un exemplaire qu'il souhaite emporter.\n'\n'   Pre-conditions\n'     - le membre est inscrit et son compte n'est pas suspendu\n'     - le stock_location du jeu concerne est superieur a 0\n'     - le poste de guichet est en service\n'\n'   Enchainement nominal\n'     1. le membre presente sa carte de membre\n'     2. le systeme authentifie le membre (cas inclus)\n'     3. le membre designe l'exemplaire souhaite\n'     4. le systeme verifie que stock_location > 0\n'     5. le systeme calcule le montant du :\n'        prix_location + caution\n'     6. le systeme demande au Systeme de paiement le\n'        prelevement du prix_location et le blocage de\n'        la caution\n'     7. le Systeme de paiement confirme l'operation\n'     8. le systeme cree la Location avec la date_debut\n'        du jour et la date de retour prevue\n'     9. le systeme decremente stock_location de 1\n'    10. le systeme edite le ticket de location\n'\n'   Enchainements alternatifs   (autres chemins vers le SUCCES)\n'     A1 : au point 3, le membre dispose d'une Reservation en\n'          cours pour ce jeu -> le systeme selectionne\n'          l'exemplaire reserve, cloture la Reservation, puis\n'          poursuit au point 4.\n'     A2 : au point 6, le membre regle en especes -> l'employe\n'          encaisse le prix_location et la caution, le systeme\n'          enregistre l'encaissement, puis poursuit au point 8.\n'     ' Dans les deux cas le membre repart avec son jeu :\n'     ' le BUT est atteint, donc ce sont bien des alternatifs.\n'\n'   Enchainements d'exception   (chemins vers l'ECHEC)\n'     E1 : au point 2, l'authentification echoue apres trois\n'          tentatives -> le cas s'arrete, aucune Location.\n'     E2 : au point 4, stock_location vaut 0 -> le systeme\n'          propose au membre de creer une Reservation, puis\n'          le cas s'arrete sans Location.\n'     E3 : au point 7, le Systeme de paiement refuse le\n'          blocage de la caution -> le cas s'arrete, aucune\n'          Location, stock_location inchange.\n'     ' Ici personne ne repart avec le jeu : le BUT n'est pas\n'     ' atteint, ce sont donc des exceptions, pas des alternatifs.\n'\n'   Post-conditions   (vraies en cas de SUCCES comme d'ECHEC)\n'     - si le scenario a reussi : une Location existe, datee\n'       de date_debut, la caution est bloquee et\n'       stock_location a diminue de 1.\n'     - si le scenario a echoue : aucune Location n'a ete\n'       creee, aucun montant n'est bloque et stock_location\n'       est strictement inchange.\n\n' RUBRIQUES OPTIONNELLES\n'   Contraintes non fonctionnelles\n'     - la reponse du Systeme de paiement ne doit pas depasser\n'       5 secondes, au-dela on bascule sur l'alternatif A2\n'     - toute Location creee doit etre tracee (qui, quand)\n'   Contraintes liees a l'interface homme-machine\n'     - l'ecran de guichet affiche en permanence le nom du\n'       membre, le titre du jeu et le montant total\n'     - la validation finale tient en une seule touche,\n'       l'employe ayant les mains prises par les boites\n'     ' Seul endroit du document ou l'on parle d'ecran :\n'     ' ailleurs on decrit le QUOI, jamais le COMMENT.",
    note: "Plusieurs scénarios sont acceptables : tu peux avoir numéroté autrement, ajouté un alternatif ou une exception de plus. Ce qui est évalué : le sens des deux flèches (base → inclus, extension → étendu), la présence du point d'extension et de la condition, les trois blocs complets du gabarit, et surtout le tri correct alternatif (succès) / exception (échec) avec des post-conditions couvrant les deux issues." }
