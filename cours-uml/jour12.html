  theory: `
<h3>1. Le problème du jour</h3>
<p>Le diagramme de classes de la Ludothèque tient encore sur une feuille. Ajoute la facturation, les pénalités de retard, les statistiques, l'authentification, l'envoi de courriels, et tu passes à soixante classes. Imprime-le : personne ne le lira. Ce n'est pas un problème de dessin, c'est un problème d'<strong>échelle</strong>.</p>
<p>Pire : quand tout est relié à tout, modifier une classe devient dangereux, parce que personne ne sait ce qui en dépend. Le vrai enjeu n'est donc pas la lisibilité, c'est le <strong>contrôle des dépendances</strong>.</p>
<p>UML répond avec le <strong>diagramme de paquetages</strong> (sigle <strong>DPA</strong> dans ton cours d'école). Il ne montre pas les classes une par une : il montre les <strong>boîtes dans lesquelles on les a rangées</strong>, et les <strong>flèches</strong> qui disent qui a besoin de qui.</p>
<div class="warn">Vocabulaire : ton cours d'école dit toujours <strong>« paquetage »</strong>. Le mot anglais <em>package</em> est celui que tu verras dans les outils et dans le code Java, mais en évaluation, écris <strong>paquetage</strong>.</div>

<h3>2. Le paquetage : des membres et un espace de nommage</h3>
<p>Un <strong>paquetage</strong> est un élément qui <strong>regroupe d'autres éléments du modèle</strong> : des classes, mais aussi des cas d'utilisation, des interfaces, des composants, et même d'autres paquetages. Les éléments qu'il contient s'appellent ses <strong>membres</strong>.</p>
<p>Il remplit deux fonctions distinctes, qu'il ne faut pas confondre :</p>
<pre class="pseudo">1. REGROUPER
   -> rassembler les elements qui traitent d'un meme sujet
      (tout ce qui concerne le catalogue au meme endroit)

2. DEFINIR UN ESPACE DE NOMMAGE (namespace)
   -> a l'interieur d'un paquetage, chaque nom est unique
   -> mais deux paquetages differents peuvent contenir chacun
      une classe "Categorie" sans conflit :
         Catalogue::Categorie   et   Comptabilite::Categorie
      sont deux classes DIFFERENTES</pre>
<div class="tip">La seconde fonction est celle qu'on oublie, et c'est pourtant elle qui a des conséquences concrètes. Sans espace de nommage, une grosse équipe finirait par se disputer les mots courants : <code>Categorie</code>, <code>Etat</code>, <code>Client</code>. Le paquetage donne à chacun sa propre étagère.</div>

<h3>3. La notation : un dossier</h3>
<p>Le symbole d'un paquetage est un <strong>dossier</strong> : un grand rectangle surmonté, en haut à gauche, d'un <strong>petit onglet</strong>.</p>
<pre class="pseudo">   +-----------+
   |           |   # l'onglet
   +-----------+--------------+
   |                          |   # le grand rectangle
   |                          |
   +--------------------------+</pre>
<p>Ton cours d'école enseigne <strong>trois représentations</strong> de ce dossier, à choisir selon ce que tu veux montrer.</p>
<p><strong>a) La représentation GLOBALE.</strong> Le nom est écrit <em>dans le grand rectangle</em>, l'onglet reste vide, et le contenu n'est pas montré. C'est la forme qu'on utilise dans un diagramme d'architecture : on veut voir les blocs et les flèches, pas les détails.</p>
<pre class="pseudo">   +-----------+
   |           |
   +-----------+--------------+
   |                          |
   |        Catalogue         |   # le nom est DANS le rectangle
   |                          |
   +--------------------------+</pre>
<p><strong>b) La représentation DÉTAILLÉE.</strong> Le nom <em>monte dans l'onglet</em>, et les membres sont dessinés <em>à l'intérieur</em> du grand rectangle. C'est la forme qui montre le contenu.</p>
<pre class="pseudo">   +-------------+
   |  Catalogue  |             # le nom est DANS L'ONGLET
   +-------------+------------+
   |   +-------+   +--------+ |
   |   |  Jeu  |   | Editeur| |
   |   +-------+   +--------+ |
   |       +-------------+    |
   |       |  Categorie  |    |
   |       +-------------+    |
   +--------------------------+</pre>
<p><strong>c) La représentation ÉCLATÉE.</strong> Les membres sont dessinés <em>à l'extérieur</em> du dossier et reliés à lui par un trait portant le symbole <strong>⊕</strong> (un cercle barré d'une croix) du côté du paquetage. C'est la forme qui permet de montrer beaucoup de membres sans faire exploser la taille de la boîte.</p>
<pre class="pseudo">   +-----------+
   |           |
   +-----------+--------------+
   |        Catalogue         |
   +------------+-------------+
                |
                ⊕                 # le symbole cote PAQUETAGE
                |
       +--------+--------+-----------------+
       |                 |                 |
   +-------+      +-------------+     +---------+
   |  Jeu  |      |  Categorie  |     | Editeur |
   +-------+      +-------------+     +---------+</pre>
<div class="warn">Piège classique : dans la représentation <strong>globale</strong> le nom est dans le grand rectangle, dans la représentation <strong>détaillée</strong> il passe dans l'onglet. On ne l'écrit jamais aux deux endroits. Retiens la logique : dès que le rectangle sert à contenir des membres, le nom doit déménager pour lui laisser la place.</div>

<h3>4. Le nom qualifié</h3>
<p>Pour désigner sans ambiguïté un membre depuis l'extérieur, on utilise son <strong>nom qualifié</strong> : le nom du paquetage, deux fois deux-points, le nom du membre.</p>
<pre class="pseudo">   Paquetage::Element

   Catalogue::Jeu          # la classe Jeu du paquetage Catalogue
   Adhesion::Membre        # la classe Membre du paquetage Adhesion
   Transactions::Location  # etc.

# Avec des paquetages imbriques, on empile :
   Ludotheque::Catalogue::Jeu</pre>
<div class="tip">Le séparateur est bien le <strong>double deux-points</strong> <code>::</code>, pas le point. Le point est la notation Java ou Python ; UML normalise <code>::</code>. C'est une erreur de notation qui coûte des points en évaluation alors qu'elle ne coûte rien à corriger.</div>

<h3>5. La visibilité des membres</h3>
<p>Comme les attributs d'une classe, les membres d'un paquetage ont une <strong>visibilité</strong>, notée devant leur nom :</p>
<pre class="pseudo">   +  public  # visible depuis l'exterieur du paquetage
   -  prive   # visible uniquement a l'interieur du paquetage

   +-------------+
   |  Catalogue  |
   +-------------+------------+
   |  + Jeu                   |   # utilisable ailleurs
   |  + Categorie             |   # utilisable ailleurs
   |  - IndexRecherche        |   # detail interne, invisible dehors
   +--------------------------+</pre>
<p>Un membre privé est un <strong>détail d'implémentation</strong> : le paquetage s'en sert, personne d'autre ne doit s'y accrocher. C'est ce qui te permet de le modifier plus tard sans casser le reste du système.</p>

<h3>6. Les dépendances entre paquetages</h3>
<p>Une <strong>dépendance</strong> se dessine par une <strong>flèche en pointillés</strong>, à pointe ouverte, du paquetage qui dépend vers celui dont il dépend. Elle porte un <strong>mot-clé</strong> entre guillemets français. Trois mots-clés sont au programme.</p>
<pre class="pseudo">   +--------------+                      +--------------+
   | Transactions | - - - - - - - - - -&gt; |  Catalogue   |
   +--------------+     «import»         +--------------+

# Sens de lecture : Transactions A BESOIN de Catalogue.
# La fleche part de celui qui depend, vers celui dont on depend.</pre>
<p><strong>«import»</strong> — le paquetage source <strong>importe l'espace de nommage</strong> de la cible. Deux conséquences :</p>
<pre class="pseudo">1. Les membres importes sont accessibles SANS PREFIXER :
   dans Transactions, on ecrit  Jeu  et non  Catalogue::Jeu

2. L'import est PUBLIC : les elements importes sont RE-EXPORTES,
   c'est-a-dire visibles a leur tour depuis les paquetages
   qui importent Transactions.
   -> l'import est donc TRANSITIF</pre>
<p><strong>«access»</strong> — le paquetage source obtient le même accès, mais <strong>en privé</strong>. Il voit le contenu de la cible, et <strong>ne le ré-exporte pas</strong>.</p>
<pre class="pseudo">   Access = un import PRIVE.
   -> le contenu importe reste utilisable A L'INTERIEUR du
      paquetage source, mais reste invisible pour ceux qui
      dependent de lui
   -> l'access n'est PAS TRANSITIF</pre>
<p><strong>«merge»</strong> — la <strong>fusion</strong>. Le paquetage qui reçoit est <strong>enrichi du contenu</strong> du paquetage fusionné : les définitions des deux sont combinées, et si un même élément existe des deux côtés, il est complété plutôt que dupliqué. C'est un mécanisme d'extension, employé surtout pour construire des versions successives d'un modèle (une version « de base » qu'une version « étendue » fusionne).</p>
<pre class="pseudo">   +-------------------+                    +--------------+
   | LudothequePremium | - - - - - - - - -&gt; | LudothequeBase|
   +-------------------+      «merge»       +--------------+
# LudothequePremium recupere tout le contenu de LudothequeBase
# et peut l'enrichir (attributs, operations supplementaires).</pre>

<h3>7. Import contre access : la démonstration</h3>
<p>C'est la question d'examen. Prenons trois paquetages de la Ludothèque et regardons ce que voit le troisième.</p>
<pre class="pseudo"># SITUATION A — deux imports
   Transactions - - -«import»- -&gt; Catalogue - - -«import»- -&gt; Persistance

   Ce que voit Catalogue    : le contenu de Persistance  (OK)
   Ce que voit Transactions : le contenu de Catalogue    (OK)
                              + le contenu de Persistance (OK !)
   Pourquoi : l'import est PUBLIC, donc Catalogue RE-EXPORTE ce
              qu'il a importe. La visibilite est TRANSITIVE.

# SITUATION B — on remplace le premier par un access
   Transactions - - -«import»- -&gt; Catalogue - - -«access»- -&gt; Persistance

   Ce que voit Catalogue    : le contenu de Persistance  (OK)
   Ce que voit Transactions : le contenu de Catalogue    (OK)
                              + le contenu de Persistance (NON !)
   Pourquoi : l'access est PRIVE. Catalogue s'en sert pour lui-meme
              mais ne le RE-EXPORTE PAS. La chaine est coupee.</pre>
<div class="tip">Formule à retenir : <strong>«import» = public = transitif ; «access» = privé = non transitif.</strong> Et l'usage qui va avec : quand tu ne veux pas que tes voisins deviennent dépendants d'une bibliothèque que tu utilises en interne, tu l'importes en <code>«access»</code>. La situation B est d'ailleurs la bonne architecture : personne d'autre que <code>Catalogue</code> n'a de raison de parler à la couche de persistance.</div>
<div class="warn">Ne confonds pas les deux effets. <code>«import»</code> autorise à écrire <code>Jeu</code> au lieu de <code>Catalogue::Jeu</code> : c'est du confort d'écriture. La transitivité, elle, est une décision d'<strong>architecture</strong> : elle détermine jusqu'où se propage une dépendance. La deuxième conséquence est bien plus lourde que la première.</div>

<h3>8. Découper pour limiter les dépendances</h3>
<p>On ne découpe pas pour faire joli. On découpe pour que <strong>chaque paquetage dépende du plus petit nombre possible d'autres paquetages</strong>. Deux principes en découlent.</p>
<p><strong>Principe 1 : la cohésion.</strong> Un paquetage rassemble ce qui change ensemble. Si deux classes sont toujours modifiées en même temps, elles vont dans le même paquetage. Si un paquetage doit être ouvert pour trois raisons différentes, il est mal découpé.</p>
<p><strong>Principe 2 : pas de dépendances circulaires.</strong> Deux paquetages qui dépendent l'un de l'autre forment un cycle : on ne peut plus les compiler, les tester, ni les livrer séparément. Ils sont devenus <em>un seul</em> paquetage, mal dessiné.</p>
<pre class="pseudo"># CYCLE — a proscrire
   +--------------+  - - -«import»- - -&gt;  +--------------+
   |  Catalogue   |                       | Transactions |
   +--------------+  &lt;- - -«import»- - -  +--------------+
   # Impossible de comprendre l'un sans l'autre.
   # Impossible d'en tester un seul.

# SOLUTIONS possibles
   1. Deplacer la classe fautive dans le paquetage qui l'utilise
      le plus
   2. Extraire la partie commune dans un troisieme paquetage
      (par ex. Commun) dont les deux dependent
   3. Inverser une dependance en passant par une INTERFACE</pre>
<div class="warn">Un cycle ne se voit presque jamais entre deux paquetages voisins : il apparaît par ricochet, sur trois ou quatre sauts (A dépend de B, B de C, C de A). C'est précisément pour cela qu'on dessine le diagramme : à l'œil nu, dans le code, ces boucles sont invisibles.</div>

<h3>9. La Ludothèque en paquetages</h3>

Catalogue     : Jeu, Categorie, Editeur
Adhesion      : Membre, Employe
Transactions  : Location, Vente, Reservation
Persistance   : acces aux donnees (connexion, requetes)
IHM           : les ecrans du comptoir et du site

              +-----------------+
              |       IHM       |

                   |        |

                   |        |
                   v        v
   +-----------------+           +-----------------+
   |  Transactions   |           |    Adhesion     |
   +-----------------+           +-----------------+
        |        |                        ^
   «import»   «import» -------------------+
        |          (Transactions importe AUSSI Adhesion :
        v           une Location est faite par un Membre)
   +-----------------+
   |    Catalogue    |
   +-----------------+
        |
   «access»      (SEUL Catalogue parle a la persistance)
        |
        v
   +-----------------+
   |   Persistance   |
   +-----------------+

                |        |
           «import»    «import»
                v        v
   +-----------------+  +-----------------+
   |  Transactions   |  |    Adhesion     |
   +-----------------+  +-----------------+
        |        |
   «import»  «import»
        |        +-------------------+
        v                            v
   +-----------------+     (vers Adhesion : un Membre
   |    Catalogue    |      fait une Location)
   +-----------------+
        |
   «access»
        v
   +-----------------+
   |   Persistance   |
   +-----------------+

# ---------- 3. JUSTIFICATION DE CHAQUE FLECHE ----------

Transactions - -«import»- -&gt; Catalogue
   une Location et une Vente portent sur un Jeu
Transactions - -«import»- -&gt; Adhesion
   une Location est faite par un Membre, saisie par un Employe
IHM - -«import»- -&gt; Transactions  et  IHM - -«import»- -&gt; Adhesion
   les ecrans manipulent les objets metier
Catalogue - -«access»- -&gt; Persistance
   Catalogue lit et ecrit ses donnees, MAIS ne veut pas imposer
   cette dependance technique a ceux qui l'importent

# ---------- 4. CE QU'ON NE DESSINE PAS, ET POURQUOI ----------

Catalogue - - -&gt; Transactions   :  INTERDIT
   ce serait un CYCLE avec la fleche existante. Un Jeu existe
   parfaitement sans qu'on le loue : le catalogue n'a aucune
   raison de connaitre les locations.

Catalogue - - -&gt; IHM            :  INTERDIT
   aucun paquetage metier ne doit connaitre les ecrans, sinon
   changer l'interface obligerait a rouvrir le metier.

# ---------- 5. LA DIFFERENCE IMPORT / ACCESS, ICI ----------

Avec  Catalogue - -«access»- -&gt; Persistance :
   Catalogue voit Persistance                        OUI
   Transactions (qui importe Catalogue) voit
     Persistance                                     NON
   -> l'access est PRIVE, il ne RE-EXPORTE rien : NON TRANSITIF

Si on ecrivait  Catalogue - -«import»- -&gt; Persistance :
   Transactions verrait Persistance                  OUI
   -> l'import est PUBLIC : TRANSITIF
   -> et toute la couche metier deviendrait dependante de la
      technique de stockage. C'est exactement ce qu'on veut eviter.

# ---------- 6. NOMS QUALIFIES ----------
   Catalogue::Jeu            Adhesion::Membre
   Catalogue::Categorie      Adhesion::Employe
   Catalogue::Editeur        Transactions::Location
   Persistance::Depot        Transactions::Vente
   IHM::EcranComptoir        Transactions::Reservation</pre>

    solution: "# ARCHITECTURE EN PAQUETAGES — Ludotheque Le De Bleu\n\n# ==================================================================\n# (a) LES CINQ PAQUETAGES, REPRESENTATION DETAILLEE\n# ==================================================================\n\n   +-------------+                +-------------+\n   |  Catalogue  |                |  Adhesion   |\n   +-------------+-----------+    +-------------+-----------+\n   |  + Jeu                  |    |  + Membre               |\n   |  + Categorie            |    |  + Employe              |\n   |  + Editeur              |    |  - GrilleTarifs         |\n   |  - IndexRecherche       |    +-------------------------+\n   +-------------------------+\n\n   +---------------+              +---------------+\n   | Transactions  |              |  Persistance  |\n   +---------------+---------+    +---------------+---------+\n   |  + Location             |    |  + Depot                |\n   |  + Vente                |    |  - Connexion            |\n   |  + Reservation          |    |  - RequeteSQL           |\n   +-------------------------+    +-------------------------+\n\n   +-------------+\n   |     IHM     |\n   +-------------+-----------+\n   |  + EcranComptoir        |\n   |  + EcranCatalogue       |\n   +-------------------------+\n\n# Le nom est dans l'ONGLET, les membres dans le grand rectangle :\n# c'est la representation DETAILLEE.\n#\n# Membres prives justifies :\n#   Catalogue::IndexRecherche : structure d'acceleration interne au\n#     catalogue ; si on la remplace un jour par un moteur externe,\n#     aucun autre paquetage ne doit avoir a changer.\n#   Persistance::Connexion et RequeteSQL : details techniques du\n#     stockage. Seul Depot est expose, ce qui permet de changer de\n#     base de donnees sans toucher au metier.\n#   Adhesion::GrilleTarifs : regle interne de calcul des cotisations.\n\n# ==================================================================\n# (a bis) LE MEME DIAGRAMME EN PlantUML\n# ==================================================================\n# @startuml\n# package Catalogue {\n#   class Jeu\n#   class Categorie\n#   class Editeur\n# }\n# package Adhesion {\n#   class Membre\n#   class Employe\n# }\n# package Transactions {\n#   class Location\n#   class Vente\n#   class Reservation\n# }\n# package Persistance {\n#   class Depot\n# }\n# package IHM {\n#   class EcranComptoir\n#   class EcranCatalogue\n# }\n#\n# Transactions ..> Catalogue : <<import>>\n# Transactions ..> Adhesion : <<import>>\n# IHM ..> Transactions : <<import>>\n# IHM ..> Adhesion : <<import>>\n# IHM ..> Catalogue : <<import>>\n# Catalogue ..> Persistance : <<access>>\n# @enduml\n#\n# En PlantUML, \"..>\" produit la fleche en pointilles a pointe\n# ouverte, et le texte apres \":\" affiche le stereotype.\n\n# ==================================================================\n# (b) LES DEPENDANCES ET LEUR JUSTIFICATION\n# ==================================================================\n\nTransactions - -<<import>>- -> Catalogue\n   une Location et une Vente portent sur un Jeu ; Transactions\n   ecrit donc Jeu sans avoir a le qualifier.\n\nTransactions - -<<import>>- -> Adhesion\n   une Location est effectuee par un Membre et enregistree par\n   un Employe.\n\nIHM - -<<import>>- -> Transactions\n   EcranComptoir affiche et cree des Locations et des Ventes.\n\nIHM - -<<import>>- -> Adhesion\n   EcranComptoir recherche un Membre par son nom.\n\nIHM - -<<import>>- -> Catalogue\n   EcranCatalogue affiche la liste des Jeux et des Categories.\n\nCatalogue - -<<access>>- -> Persistance\n   chaque paquetage metier lit et ecrit ses propres donnees,\n   MAIS aucun ne doit imposer cette dependance technique a ceux\n   qui l'importent. D'ou <<access>> et non <<import>>.\n\n# Toutes les fleches descendent : IHM -> metier -> Persistance.\n# Aucune ne remonte : il n'y a donc aucun cycle.\n\n# ==================================================================\n# (c) DEMONSTRATION : IMPORT PUBLIC CONTRE ACCESS PRIVE\n# ==================================================================\n\n# La chaine de trois paquetages :\n#   Transactions - -<<import>>- -> Catalogue - -[ ? ]- -> Persistance\n\n# CAS 1 — tel que je l'ai dessine : le second lien est un ACCESS\n   Transactions - -<<import>>- -> Catalogue - -<<access>>- -> Persistance\n\n   Catalogue voit Persistance::Depot          ->  OUI\n   Transactions voit Catalogue::Jeu           ->  OUI\n   Transactions voit Persistance::Depot       ->  NON\n\n   Pourquoi : <<access>> est un import PRIVE. Catalogue se sert de\n   Depot pour lui-meme, mais ne le RE-EXPORTE pas. La chaine de\n   visibilite s'arrete a Catalogue : l'access N'EST PAS TRANSITIF.\n\n   Consequence concrete : si demain la ludotheque passe d'un fichier\n   CSV a une base PostgreSQL, seul Catalogue est impacte.\n   Transactions ne peut meme pas avoir ecrit une ligne dependant\n   de Depot : le compilateur le lui interdisait.\n\n# CAS 2 — on remplace l'access par un IMPORT\n   Transactions - -<<import>>- -> Catalogue - -<<import>>- -> Persistance\n\n   Catalogue voit Persistance::Depot          ->  OUI\n   Transactions voit Catalogue::Jeu           ->  OUI\n   Transactions voit Persistance::Depot       ->  OUI (!)\n\n   Pourquoi : <<import>> est PUBLIC. Les elements importes par\n   Catalogue sont RE-EXPORTES, donc visibles depuis tout paquetage\n   qui importe Catalogue. L'import EST TRANSITIF.\n\n   Consequence concrete : rien n'empeche plus un developpeur\n   presse d'ecrire un appel direct a Depot depuis Location. Le\n   jour du changement de base, la moitie du metier casse — et\n   personne n'avait vu venir la dependance, puisqu'elle n'etait\n   ecrite nulle part sur le diagramme.\n\n# LA FORMULE A RETENIR\n#   <<import>> = public  = RE-EXPORTE = TRANSITIF\n#   <<access>> = prive   = non re-exporte = NON TRANSITIF\n\n# ==================================================================\n# (d) LA DEPENDANCE QUE JE REFUSE DE DESSINER\n# ==================================================================\n\nRefusee :  Catalogue - -<<import>>- -> Transactions\n\nTentation : on voudrait qu'un Jeu sache s'il est actuellement loue,\n   donc que Jeu connaisse Location.\n\nCycle cree :\n   Catalogue - -<<import>>- -> Transactions\n   Transactions - -<<import>>- -> Catalogue\n   -> les deux paquetages se citent mutuellement.\n\nPourquoi c'est grave :\n   - impossible de tester Catalogue seul : il faut aussi charger\n     Transactions, qui reclame Catalogue, etc.\n   - impossible de livrer ou de reutiliser le catalogue ailleurs\n     (par exemple dans un site vitrine sans location)\n   - les deux paquetages n'en forment plus qu'un, mal dessine\n\nCe qu'il faut faire a la place :\n   1. laisser la responsabilite du cote de celui qui sait deja :\n      c'est Transactions qui connait les Locations, donc c'est lui\n      qui repond a la question \"ce Jeu est-il loue ?\"\n   2. ou bien lire l'information via stock_location, attribut qui\n      appartient legitimement a Jeu et que Transactions met a jour\n   3. ou bien, en dernier recours, definir une interface dans\n      Catalogue que Transactions implemente : la dependance\n      s'inverse et le cycle disparait\n\nRefusee aussi :  Catalogue - - -> IHM  (ou tout paquetage metier\n   vers IHM). Le metier ne doit jamais connaitre les ecrans, sinon\n   refaire l'interface obligerait a rouvrir le metier.\n\n# ==================================================================\n# (e) NOMS QUALIFIES\n# ==================================================================\n\n   Catalogue::Jeu\n   Transactions::Location\n   Persistance::Depot\n\n# Le separateur est le DOUBLE DEUX-POINTS. Ecrire Catalogue.Jeu\n# est une notation Java ou Python, pas une notation UML.\n\n# ==================================================================\n# CE QU'IL FAUT RETENIR\n# ==================================================================\n# On ne decoupe pas pour rendre le d
