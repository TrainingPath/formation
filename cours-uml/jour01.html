  title: "Pourquoi modéliser ? Du besoin au modèle",
  subtitle: "Avant d'écrire la première ligne de code, comprendre ce qu'on doit construire.",
  theory: `
<h3>1. Le problème que la modélisation résout</h3>
<p>Imagine qu'on te demande de développer le logiciel d'une <strong>ludothèque</strong> : on y prête des jeux de société, on en vend, il y a des membres, des employés, des stocks. Si tu ouvres ton éditeur et que tu commences à taper, tu vas très vite te poser des questions auxquelles le code ne peut pas répondre : un membre peut-il louer deux fois le même jeu ? Que se passe-t-il si le stock est à zéro ? Un employé est-il aussi un membre ?</p>
<p>Ces questions ne sont pas techniques, elles sont <strong>métier</strong>. Y répondre <em>avant</em> de coder, c'est exactement ce qu'on appelle <strong>analyser</strong> et <strong>concevoir</strong>. Et l'outil pour le faire, c'est le <strong>modèle</strong>.</p>

<h3>2. Qu'est-ce qu'un modèle ?</h3>
<p>Un <strong>modèle</strong> est une <strong>représentation simplifiée et abstraite</strong> d'un système réel, qui permet de le décrire, de l'expliquer ou de le prévoir. Son but est de <strong>réduire la complexité</strong> en mettant en évidence ce qui compte pour l'objectif visé — et en laissant tomber le reste.</p>
<p>Pense à une carte de métro. Elle est fausse géographiquement : les distances sont déformées, les rues ont disparu. Mais pour la question « comment aller de A à B ? », elle est <em>meilleure</em> qu'une photo satellite. Un bon modèle n'est pas un modèle complet : c'est un modèle <strong>utile pour une question donnée</strong>.</p>
<pre class="pseudo"># Le meme systeme, trois modeles, trois questions
Modele des donnees      -> "quelles informations stocke-t-on ?"
Modele des traitements  -> "qui fait quoi, dans quel ordre ?"
Modele de l'architecture-> "quel logiciel tourne sur quelle machine ?"
# Aucun n'est "le vrai" : chacun repond a une question differente</pre>

<h3>3. Pourquoi modéliser ? Cinq raisons concrètes</h3>
<p>Modéliser un système avant sa réalisation permet :</p>
<pre class="pseudo">1. Une meilleure comprehension du probleme
2. Une gestion plus efficace de la complexite
3. Une meilleure communication entre les parties prenantes
4. Une reduction des couts et des delais
5. Une amelioration de la qualite et de la maintenance</pre>
<p>La troisième raison est souvent la plus importante en pratique. Un diagramme se montre à un client, à un chef de projet, à un collègue qui ne connaît pas ton langage. Du code, non. Le modèle est un <strong>langage commun</strong>.</p>

<h3>4. Le coût de l'erreur augmente avec le temps</h3>
<p>C'est le raisonnement qui justifie tout le reste. Une erreur d'analyse détectée <strong>pendant l'analyse</strong> coûte une conversation. La même erreur détectée <strong>en production</strong> coûte une reprise du code, des données à corriger, parfois un client perdu.</p>
<pre class="pseudo"># Cout relatif de la correction d'une meme erreur
Detectee a l'analyse      -> tres faible (on change un dessin)
Detectee au codage        -> moyen      (on reecrit des classes)
Detectee aux tests        -> eleve      (on reprend la conception)
Detectee en production    -> tres eleve (code + donnees + confiance)</pre>
<div class="tip">Retiens la formule : <strong>plus une erreur est détectée tard, plus elle coûte cher.</strong> Modéliser, c'est déplacer la détection des erreurs vers la gauche du calendrier.</div>

<h3>5. Qui modélise ? MOA et MOE</h3>
<p>Deux sigles reviennent partout dans les projets français, et ton cours d'école les emploie :</p>
<pre class="pseudo">MOA = Maitrise d'OuvrAge   -> l'entite CLIENTE, porteuse du besoin metier
                              (la ludotheque qui veut son logiciel)
MOE = Maitrise d'OEuvre    -> l'entite qui REALISE techniquement
                              (l'equipe informatique, prestataire)</pre>
<p>Idéalement, c'est la <strong>MOA</strong> qui devrait modéliser : elle connaît le métier, donc les vrais besoins. En pratique, c'est souvent la MOE qui s'en charge — avec un risque : ses priorités sont techniques, pas métier. D'où la notion de <strong>professionnalisation de la MOA</strong> : donner aux équipes métier les compétences d'abstraction et de modélisation.</p>
<div class="warn">Ne confonds pas : la MOA <em>exprime et valide</em> le besoin, la MOE <em>construit</em>. Quand un modèle est clair et stable, la MOE peut se concentrer sur la technique sans avoir à deviner ce que le client voulait dire.</div>

<h3>6. Le cycle de vie d'un logiciel</h3>
<p>Le <strong>cycle de vie</strong> couvre toutes les phases, de l'idée à la disparition du logiciel. Il structure le développement et valide les étapes intermédiaires. Les étapes classiques :</p>
<pre class="pseudo">1.  Definition des objectifs      # a quoi sert ce projet ?
2.  Analyse des besoins           # que doit faire le systeme ? (+ faisabilite)
3.  Specification / conception generale   # architecture d'ensemble
4.  Conception detaillee          # chaque sous-ensemble precisement
5.  Codage                        # traduction dans un langage
6.  Tests unitaires               # chaque module isole fonctionne
7.  Integration                   # les modules s'emboitent
8.  Qualification (recette)       # conforme aux specifications ?
9.  Documentation
10. Mise en production
11. Maintenance                   # corrective et evolutive</pre>
<p>UML sert principalement aux étapes <strong>2 à 4</strong>. C'est là que se joue ce mois de cours.</p>

<h3>7. Ce qu'on entend par « qualité » d'un logiciel</h3>
<p>Modéliser vise la qualité. Encore faut-il savoir ce que ce mot recouvre. Les critères classiques :</p>
<pre class="pseudo">Validite        # repond exactement aux exigences du cahier des charges
Fiabilite       # fonctionne meme en conditions anormales (robustesse)
Extensibilite   # facile a modifier ou enrichir (maintenance)
Reutilisabilite # reutilisable, en tout ou partie, ailleurs
Compatibilite   # s'integre avec d'autres logiciels
Efficacite      # bonne utilisation des ressources materielles
Portabilite     # se deploie sur d'autres environnements
Verifiabilite   # facile a tester
Integrite       # protege code et donnees des acces non autorises
Facilite d'emploi # apprentissage, usage, gestion des erreurs</pre>
<div class="warn">Ces critères <strong>entrent parfois en conflit</strong>. Rendre un programme plus portable peut le rendre moins efficace ; le blinder en sécurité peut le rendre moins facile d'emploi. Concevoir, c'est arbitrer en connaissance de cause — pas cocher toutes les cases.</div>

<h3>8. Où UML intervient</h3>
<p><strong>UML</strong> (<em>Unified Modeling Language</em>, « langage de modélisation unifié ») est un <strong>langage graphique de modélisation orienté objet</strong>, devenu le standard de l'industrie. Attention au mot : UML est un <em>langage</em>, pas une <em>méthode</em>. Il te donne des symboles et leur signification ; il ne te dit pas dans quel ordre travailler.</p>
<p>Nous étudierons ses <strong>14 diagrammes</strong> (version 2.5.1, la norme actuelle publiée par l'OMG), répartis en deux familles : les <strong>structurels</strong> (ce que le système <em>est</em>) et les <strong>comportementaux</strong> (ce que le système <em>fait</em>). Demain, nous les passerons en revue et les comparerons à Merise.</p>
<div class="tip">Notre fil rouge de tout le mois : <strong>la Ludothèque</strong> — Jeu, Catégorie, Membre, Employé, Exemplaire, Location, Vente. Si tu as suivi le cours Merise ou un parcours langage du site, tu retrouveras exactement le même projet, vu sous un autre angle.</div>`,

    { type: "qcm", q: "Un modèle est avant tout…", opts: ["Une copie complète et fidèle du système réel", "Une représentation simplifiée qui met en évidence l'essentiel pour un objectif donné", "Le code source commenté du programme", "Une maquette graphique de l'interface"], a: 1, exp: "Un modèle réduit volontairement la complexité : il garde ce qui sert à la question posée." },
    { type: "qcm", q: "Pourquoi une carte de métro est-elle un bon modèle malgré ses distances fausses ?", opts: ["Parce qu'elle est jolie", "Parce qu'elle est utile pour la question « comment aller de A à B ? »", "Parce qu'elle est complète", "Parce qu'elle est à l'échelle"], a: 1, exp: "Un bon modèle est utile pour une question précise, pas exhaustif." },
    { type: "qcm", q: "Que signifie MOA ?", opts: ["Maîtrise d'œuvre applicative", "Maîtrise d'ouvrage : l'entité cliente, porteuse du besoin métier", "Module d'organisation avancée", "Méthode d'organisation et d'analyse"], a: 1, exp: "La MOA est le client : elle porte et valide le besoin métier." },

    { type: "vf", q: "Le coût de correction d'une erreur augmente à mesure qu'elle est détectée tardivement.", a: true, exp: "C'est le raisonnement qui justifie le découpage en cycle de vie et la modélisation en amont." },

    { type: "qcm", q: "UML est…", opts: ["Une méthode qui impose un ordre de travail", "Un langage graphique de modélisation orienté objet", "Un langage de programmation", "Un logiciel de dessin"], a: 1, exp: "UML est un langage (symboles + sens), pas une méthode ni un langage de programmation." },
    { type: "input", q: "Combien de diagrammes compte UML dans sa version 2.5.1 ? (un nombre)", a: ["14", "quatorze"], ph: "un nombre", exp: "UML 2.5.1 définit 14 diagrammes, répartis en structurels et comportementaux." },
    { type: "qcm", q: "Les deux grandes familles de diagrammes UML sont…", opts: ["Les diagrammes simples et les diagrammes complexes", "Les diagrammes structurels (ce que le système est) et comportementaux (ce qu'il fait)", "Les diagrammes client et les diagrammes serveur", "Les diagrammes d'analyse et les diagrammes de test"], a: 1, exp: "Structurel = statique ; comportemental = dynamique." },

    { type: "vf", q: "Idéalement, c'est la MOE qui devrait porter la modélisation du système d'information métier.", a: false, exp: "Idéalement c'est la MOA, qui connaît le métier ; en pratique la MOE s'en charge souvent, d'où un risque de dérive technique." },

    ],

La gerante qui exprime le besoin      -> MOA (maitrise d'ouvrage)
L'equipe qui developpera              -> MOE (maitrise d'oeuvre)
"Peut-on louer 2 fois le meme jeu ?"  -> regle METIER, a trancher a l'ANALYSE
Confondre stock_location/stock_vente  -> erreur d'analyse ; en production
                                         elle coute code + donnees + confiance
Montrer le fonctionnement a la gerante-> un DIAGRAMME (langage commun)
Prevoir la reservation plus tard      -> critere d'EXTENSIBILITE</pre>
<p>Tu viens de faire ce que fait un analyste avant d'ouvrir son éditeur : identifier qui porte le besoin, repérer les questions métier non tranchées, et anticiper ce qui coûtera cher si on se trompe. Demain : les 14 diagrammes d'UML, et pourquoi Merise et UML ne racontent pas la même histoire.</p>`
  }
