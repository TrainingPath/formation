  theory: `
<h3>1. Le problème que résolvent les fragments</h3>
<p>Hier, tu as dessiné le scénario nominal de <code>louer(client, jeu_id, nb_jours=7)</code> : tout se passe bien, le stock est disponible, la Location est créée. Mais la vraie vie de la Ludothèque n'est pas linéaire. Que se passe-t-il si <code>stock_location</code> vaut <strong>zéro</strong> ? Il faut proposer une <strong>Réservation</strong>.</p>
<p>Avec les seuls outils d'hier, tu es coincé : il te faudrait <strong>un diagramme par cas</strong>. Deux conditions imbriquées, et tu produis quatre dessins presque identiques que personne ne maintiendra. Les <strong>fragments combinés</strong> résolvent exactement ce problème : ils permettent d'exprimer un <strong>choix</strong>, une <strong>boucle</strong> ou un <strong>parallélisme</strong> <em>à l'intérieur</em> d'un seul diagramme de séquence.</p>

<h3>2. La notation d'un fragment combiné</h3>
<p>Un <strong>fragment combiné</strong> est un <strong>rectangle</strong> qui englobe une portion de l'interaction. Son <strong>coin supérieur gauche</strong> porte, dans un petit cartouche, le nom de l'<strong>opérateur</strong> qui dit comment lire ce qu'il contient.</p>
<pre class="pseudo">+-------------------------------------------------+
| alt \                                            |   &lt;- l'OPERATEUR est
+------+                                          |      dans le coin
|      [stock_location &gt; 0]                       |      SUPERIEUR GAUCHE
|                                                 |
|   ... les messages de la premiere branche ...    |
|                                                 |
|- - - - - - - - - - - - - - - - - - - - - - - - -|   &lt;- separateur POINTILLE
|      [else]                                     |
|                                                 |
|   ... les messages de la seconde branche ...     |
|                                                 |
+-------------------------------------------------+</pre>
<p>Trois éléments à repérer sur ce dessin : le <strong>rectangle</strong> englobant, l'<strong>opérateur</strong> en haut à gauche, et les <strong>gardes</strong> entre crochets <code>[condition]</code> qui commandent chaque branche. Le trait <strong>pointillé horizontal</strong> sépare les branches.</p>
<div class="tip">Le vocabulaire normatif : le rectangle est un <em>CombinedFragment</em>, chaque compartiment séparé par des pointillés est un <em>InteractionOperand</em>, et la condition entre crochets est une <em>InteractionConstraint</em> — la <strong>garde</strong>. Tu n'as pas à retenir les noms anglais, mais tu dois savoir que garde = condition entre crochets.</div>

<h3>3. alt — l'alternative</h3>
<p>L'opérateur <strong><code>alt</code></strong> exprime une <strong>alternative</strong> : plusieurs branches séparées par des pointillés, chacune gardée par une condition, et <strong>une seule</strong> est exécutée. C'est le <code>if / elif / else</code> du diagramme de séquence.</p>
<pre class="pseudo">+---------------------------------------------------------+
| alt \                                                    |
+------+  [stock_location &gt; 0]                             |
|   sys -&gt; x : reserverExemplaire()                         |
|   sys -&gt; l : &lt;&lt;create&gt;&gt; Location                          |
|- - - - - - - - - - - - - - - - - - - - - - - - - - - - - |
|          [else]                                          |
|   sys -&gt; r : &lt;&lt;create&gt;&gt; Reservation                       |
|   sys --&gt; e : "jeu indisponible, reservation enregistree" |
+---------------------------------------------------------+

# UNE SEULE branche s'execute, celle dont la garde est vraie.
# [else] est la branche par defaut : elle joue si aucune autre garde
# n'est satisfaite. Elle est FACULTATIVE.</pre>
<p>Les gardes doivent être <strong>mutuellement exclusives</strong> : si deux conditions peuvent être vraies en même temps, le diagramme devient ambigu. Écris-les de façon à ce qu'exactement une soit vraie à chaque exécution.</p>

<h3>4. opt — l'optionnel</h3>
<p>L'opérateur <strong><code>opt</code></strong> décrit un traitement <strong>optionnel</strong> : il ne contient qu'<strong>une seule branche</strong>, exécutée <strong>si la garde est vraie</strong>, ignorée sinon. C'est le <code>if</code> sans <code>else</code>.</p>
<pre class="pseudo">+---------------------------------------------------+
| opt \                                              |
+------+  [membre.est_premium]                       |
|   sys -&gt; l : appliquerRemise(0.10)                  |
+---------------------------------------------------+

# UNE SEULE branche, pas de pointille separateur, pas de [else].
# Si la garde est fausse, on saute simplement le fragment.</pre>
<div class="tip">Comment choisir entre <code>alt</code> et <code>opt</code> ? Compte les chemins possibles. <strong>Deux traitements différents</strong> selon la condition → <code>alt</code>. <strong>Un traitement en plus</strong> ou rien du tout → <code>opt</code>. Un <code>opt</code> est un <code>alt</code> à une seule branche, mais l'écrire en <code>opt</code> exprime mieux l'intention.</div>

<h3>5. loop — la boucle</h3>
<p>L'opérateur <strong><code>loop</code></strong> répète les messages qu'il contient. Deux formes normatives :</p>
<pre class="pseudo">loop(min, max)      # repete entre min et max fois
loop                # avec une GARDE : repete TANT QUE la garde est vraie

# Exemples
loop(1, 5)          # de 1 a 5 iterations
loop(3, 3)          # exactement 3 fois
loop                # + garde [il reste des exemplaires a verifier]
                    #   -> tant que la condition tient</pre>
<pre class="pseudo">+-------------------------------------------------------+
| loop(1, 5) \                                           |
+------------+  [il reste des exemplaires a verifier]    |
|   sys -&gt; x : estDisponible()                            |
|   x --&gt; sys : true / false                              |
+-------------------------------------------------------+

# Lecture : on parcourt les exemplaires du Jeu jusqu'a en trouver
# un de disponible, avec au minimum 1 et au maximum 5 tentatives.</pre>
<p>Les deux notations se combinent : <code>loop(1, 5)</code> avec une garde signifie « au moins 1 fois, au plus 5 fois, et on s'arrête dès que la garde devient fausse ».</p>

<h3>6. par — le parallélisme</h3>
<p>L'opérateur <strong><code>par</code></strong> décrit des traitements <strong>parallèles</strong>. Comme pour <code>alt</code>, les branches sont séparées par des pointillés — mais cette fois, <strong>toutes</strong> s'exécutent, et l'ordre entre elles n'est pas déterminé.</p>
<pre class="pseudo">+-----------------------------------------------------+
| par \                                                |
+------+                                              |
|   sys -&gt;&gt; n : envoyerConfirmation(membre)            |
|- - - - - - - - - - - - - - - - - - - - - - - - - - -|
|   sys -&gt;&gt; c : mettreAJourStatistiques()              |
|- - - - - - - - - - - - - - - - - - - - - - - - - - -|
|   sys -&gt;&gt; i : imprimerRecu()                         |
+-----------------------------------------------------+

# LES TROIS branches s'executent. Aucune garde n'est necessaire.
# L'ordre relatif entre branches n'est PAS specifie : le mail peut
# partir avant ou apres l'impression du recu.</pre>
<div class="warn"><strong>Le piège classique de l'examen.</strong> <code>alt</code> et <code>par</code> se ressemblent visuellement : même rectangle, mêmes branches séparées par des pointillés. Ils disent pourtant l'inverse l'un de l'autre. <strong><code>alt</code> : un seul chemin est pris</strong>, celui dont la garde est vraie. <strong><code>par</code> : tous les chemins sont pris</strong>, en parallèle. Deux indices visuels : <code>alt</code> porte des <strong>gardes</strong> sur chaque branche, <code>par</code> n'en a généralement pas.</div>

<h3>7. break — la rupture de scénario</h3>
<p>L'opérateur <strong><code>break</code></strong> exprime une <strong>rupture de scénario</strong> : si sa garde est vraie, on exécute le contenu du fragment puis on <strong>abandonne le reste</strong> de l'interaction englobante. C'est le traitement d'exception du diagramme de séquence.</p>
<pre class="pseudo">+---------------------------------------------------+
| break \                                            |
+--------+  [membre.adhesion_expiree]                |
|   sys --&gt; e : "adhesion expiree, location refusee"  |
+---------------------------------------------------+

#   ... la suite du scenario n'est PAS executee ...

# Difference avec opt : opt saute son contenu et CONTINUE ;
# break execute son contenu et ARRETE tout.</pre>

<h3>8. critical — la région atomique</h3>
<p>L'opérateur <strong><code>critical</code></strong> délimite une <strong>région atomique</strong> : la séquence de messages qu'il contient <strong>ne peut pas être interrompue</strong> par d'autres traitements concurrents. Elle s'exécute d'un bloc.</p>
<pre class="pseudo">+-------------------------------------------------------+
| critical \                                             |
+-----------+                                            |
|   sys -&gt; j : verifierStockLocation()                    |
|   sys -&gt; j : decrementerStockLocation()                 |
+-------------------------------------------------------+

# Sans critical, deux employes servant deux clients en meme temps
# pourraient tous deux lire stock_location = 1 et decrementer :
# le stock passerait a -1. La region critique l'interdit.</pre>
<div class="tip">Repère l'usage typique : dès que tu <strong>lis une valeur puis la modifies</strong> en fonction de ce que tu as lu, tu as un candidat à <code>critical</code>. C'est exactement la situation du <code>stock_location</code> de la Ludothèque.</div>

<h3>9. ref — la référence à une autre interaction</h3>
<p>Un diagramme de séquence complet devient vite illisible. <strong><code>ref</code></strong> permet de renvoyer à une <strong>interaction décrite ailleurs</strong>, dans son propre diagramme : on dessine un rectangle contenant simplement le nom du sous-diagramme.</p>
<pre class="pseudo">+----------------------------------------+
| ref \                                   |
+------+                                 |
|          verifierAdhesionMembre         |
+----------------------------------------+

# Le detail de cette interaction est decrit dans un AUTRE
# diagramme de sequence, portant l'en-tete :
#   sd verifierAdhesionMembre</pre>
<p>C'est l'équivalent de l'appel de fonction : on nomme, on ne détaille pas sur place. Utilise-le dès qu'une portion d'interaction se répète dans plusieurs scénarios.</p>

<h3>10. Deux écarts du support de l'école</h3>
<div class="warn"><strong>Deux points à corriger dans ton support du PAC.</strong><br><br><strong>(a) « Treize opérateurs ».</strong> Le support annonce <strong>treize</strong> opérateurs de fragment combiné. UML 2.5.1 en définit en réalité <strong>douze</strong> : <code>alt</code>, <code>opt</code>, <code>loop</code>, <code>break</code>, <code>par</code>, <code>seq</code>, <code>strict</code>, <code>critical</code>, <code>ignore</code>, <code>consider</code>, <code>assert</code>, <code>neg</code>. Le treizième de la liste du PAC est <code>ref</code> — or <code>ref</code> n'est <strong>pas un opérateur</strong> de fragment combiné : c'est une <strong>InteractionUse</strong>, un élément distinct dans le métamodèle. Il se dessine de la même façon, ce qui explique la confusion, mais formellement ce n'est pas la même chose.<br><br><strong>(b) L'opérateur « weak ».</strong> Le support définit un opérateur <code>weak</code> comme signifiant « l'ordre n'a pas d'importance ». Deux erreurs en une phrase. D'abord le nom : l'opérateur normatif s'appelle <strong><code>seq</code></strong> (<em>weak sequencing</em>, séquencement faible) — <code>weak</code> est le qualificatif, pas le mot-clé. Ensuite le sens : <code>seq</code> <strong>conserve l'ordre des messages sur chaque ligne de vie prise séparément</strong> ; il ne relâche l'ordre qu'<strong>entre lignes de vie différentes</strong>. Ce n'est donc pas « l'ordre n'a pas d'importance » — c'est « l'ordre local est garanti, l'ordre global ne l'est pas ».</div>
<pre class="pseudo"># Ce que seq garantit, et ce qu'il ne garantit pas
Sur UNE MEME ligne de vie   -&gt; l'ordre est CONSERVE
Entre DEUX lignes de vie    -&gt; l'ordre n'est PAS impose

# A comparer avec :
strict  -&gt; l'ordre est impose PARTOUT, strictement
par     -&gt; aucun ordre entre les branches, elles sont paralleles
# seq se situe donc ENTRE strict et par.</pre>

# Recapitulatif des cinq choix
break       -&gt; on joue le refus PUIS on abandonne la suite

alt         -&gt; UN SEUL chemin : Location OU Reservation
opt         -&gt; un traitement EN PLUS (remise), ou rien
par         -&gt; TOUS les chemins : mail ET statistiques
critical    -&gt; region atomique autour du couple lire/decrementer</pre>
