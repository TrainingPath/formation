<p>Ce dernier chapitre n'apporte rien de neuf. C'est une <strong>synthèse de révision</strong> : les 14 diagrammes d'UML 2.5.1, chacun avec sa famille, la question à laquelle il répond, sa notation clé en une ligne, et le jour où tu l'as vu. Relis-le avant l'examen, puis attaque les exercices.</p>

<h3>2. Les 7 diagrammes STRUCTURELS</h3>
<p>Ils décrivent ce que le système <strong>est</strong> : sa composition, à un instant donné. Ils ne parlent pas du temps.</p>

<div class="tip"><strong>La carte mentale à retenir.</strong> Structurel = photo (ce qui existe) ; comportemental = film (ce qui se passe). Dans le film, trois angles : le <em>processus</em> (activités), les <em>échanges</em> (séquence, communication, temps, vue d'ensemble), le <em>cycle de vie d'un objet</em> (machine à états). Dans la photo, trois échelles : le <em>concept</em> (classes, objets), l'<em>organisation</em> (paquetages, structure composite), le <em>déployé</em> (composants, déploiement) — plus les profils, qui outillent le langage lui-même.</div>

Jour 30  Le catalogue des pieges classiques, diagramme par

    intro: `<p>Dernière mission. La Ludothèque « Le Dé Bleu » ouvre un <strong>service en ligne</strong>. Un <strong>Membre</strong> consultera le catalogue de <strong>Jeux</strong> classés par <strong>Catégorie</strong>, posera une <strong>Réservation</strong> sur un <strong>Exemplaire</strong> disponible, puis viendra le retirer au comptoir où un <strong>Employé</strong> transformera la réservation en <strong>Location</strong> (<code>date_debut</code>, <code>date_fin</code>, <code>caution</code>). Il pourra aussi acheter (<strong>Vente</strong>, sur le <code>stock_vente</code>) et déposer un <strong>Avis</strong>. Le site tourne sur un serveur web, la base sur un serveur distinct, et la réservation doit être confirmée <strong>en moins de trois secondes</strong>. Modélise tout cela — en choisissant les bons diagrammes.</p>`,

<p><strong>Bravo.</strong> Tu viens de terminer un mois complet d'analyse et de conception avec UML. En trente et un jours, tu as couvert les <strong>14 diagrammes d'UML 2.5.1</strong> sans exception : les sept structurels — classes, objets, paquetages, composants, déploiement, structure composite, profils — et les sept comportementaux — cas d'utilisation, activités, machine à états, séquence, communication, temps, vue d'ensemble des interactions. Tu as aussi appris ce qui ne se trouve pas dans la norme : cadrer un besoin, traduire un modèle en code et en base, faire le pont avec Merise, garder tes diagrammes cohérents entre eux, traiter les associations de degré supérieur, et repérer les pièges classiques avant qu'un correcteur ne les repère pour toi.</p>
<p>Il te reste une seule chose à faire, et c'est la plus importante : <strong>applique tout cela sur un vrai projet</strong>. Pas la Ludothèque — un projet à toi, avec un vrai besoin, de vraies contraintes et un vrai interlocuteur qui changera d'avis. Commence petit : deux ou trois diagrammes, ceux qui répondent à tes questions du moment. Un modèle vivant, imparfait et discuté vaut infiniment mieux qu'un dossier de quatorze diagrammes que personne ne relit. C'est là, sur le terrain, que la modélisation cesse d'être un exercice pour devenir un outil.</p>`

  { id: "uml-j31", title: "Le mini-dossier d'analyse : choisir ses diagrammes et le justifier", level: 3,
    statement: "La Ludothèque veut lancer un <strong>abonnement mensuel illimité</strong> : moyennant un forfait, un membre emprunte autant de jeux qu'il veut, mais <strong>trois exemplaires maximum en même temps</strong>. L'abonnement se souscrit en ligne, se suspend en cas d'impayé, se résilie, et donne droit à une remise de 10 % sur les <strong>Ventes</strong>. Les retards restent facturés.<br><br><strong>Rédige un mini-dossier d'analyse.</strong> Il doit contenir : (a) la liste des <strong>4 diagrammes</strong> — et exactement quatre — que tu produirais pour cette fonctionnalité ; (b) pour <strong>chacun</strong>, la <strong>question métier précise</strong> auquel il répond et <strong>pourquoi les autres diagrammes ne peuvent pas y répondre</strong> ; (c) pour chacun, un <strong>croquis ou une esquisse textuelle</strong> de son contenu sur ce cas ; (d) la liste des <strong>diagrammes que tu écartes</strong>, avec la raison en une ligne chacun.",
    hints: [
      "Commence par lister les questions ouvertes de l'énoncé, pas les diagrammes : qui souscrit et comment ? quelles entités nouvelles ? un abonnement change-t-il d'état au cours de sa vie ? y a-t-il un scénario d'échange délicat ? Les diagrammes viendront ensuite, chacun répondant à une question.",
      "« Suspendu en cas d'impayé », « résilié » : ce vocabulaire est celui des ÉTATS d'un seul objet. Demande-toi quel diagramme du jour 18 est fait pour cela — et surtout pourquoi le diagramme d'activités ne conviendrait pas (piège 12 du jour 30).",
      "Pour (d), écarter n'est pas ignorer : justifie en disant quelle question le diagramme aurait tranchée, et pourquoi cette question ne se pose pas ici. Le jour 30, piège 14, dit qu'un diagramme se justifie par la question à laquelle il répond."
    ],
    checklist: [
      "EXACTEMENT quatre diagrammes sont retenus, chacun nommé avec son nom UML officiel (pas « le schéma des classes » mais « diagramme de classes »).",
      "Chaque choix est justifié par une QUESTION MÉTIER formulée en une phrase interrogative précise, et par une raison expliquant pourquoi un autre diagramme n'y répondrait pas.",
      "Chaque diagramme retenu est esquissé sur le cas de l'abonnement : on y voit des noms concrets de l'énoncé (Abonnement, Membre, Exemplaire, suspendre, résilier, la limite de trois exemplaires), pas un exemple générique.",
      "Les diagrammes écartés sont listés avec, pour chacun, une raison en une ligne indiquant quelle question ils auraient tranchée et pourquoi elle ne se pose pas ici."
    ],
    solution: "MINI-DOSSIER D'ANALYSE - Fonctionnalite \"Abonnement mensuel illimite\"\nLudotheque Le De Bleu\n\n============================================================\n0. LES QUESTIONS OUVERTES (avant tout diagramme)\n============================================================\nQ1. Qui souscrit, qui gere, quels services sont rendus ?\nQ2. Quelles entites nouvelles, et quelles regles chiffrees\n    (3 exemplaires max, remise 10 %) ?\nQ3. Un abonnement change-t-il d'etat au fil du temps ?\nQ4. Que se passe-t-il exactement, pas a pas, quand un abonne\n    tente un 4e emprunt ?\n\nCe sont ces quatre questions - et non la liste des 14 diagrammes -\nqui determinent le dossier.\n\n============================================================\n(a) LES QUATRE DIAGRAMMES RETENUS\n============================================================\n1. Diagramme de CAS D'UTILISATION        (jours 3 et 4)\n2. Diagramme de CLASSES                  (jours 8, 9 et 10)\n3. MACHINE A ETATS de l'Abonnement       (jours 18 et 19)\n4. Diagramme de SEQUENCE                 (jours 15 et 16)\n\n============================================================\n(b) et (c) JUSTIFICATION ET ESQUISSE, DIAGRAMME PAR DIAGRAMME\n============================================================\n\n------------------------------------------------------------\n1. DIAGRAMME DE CAS D'UTILISATION\n------------------------------------------------------------\nQUESTION : quels services nouveaux le systeme rend-il, a quels\n  roles, et ou passe la frontiere du systeme ?\nPOURQUOI PAS UN AUTRE : c'est le seul diagramme qui se place\n  a l'EXTERIEUR du systeme et qui parle le langage du client.\n  Le diagramme de classes repondrait \"quelles donnees\", pas\n  \"quel service a valeur metier\". C'est aussi la vue qu'on\n  montre a la gerante pour validation (MOA, jour 1).\nESQUISSE :\n  Acteurs : Membre, Employe, Systeme de paiement (secondaire).\n  Cas :\n    Souscrire un abonnement\n    Emprunter avec abonnement\n    Suspendre un abonnement       (acteur : Employe)\n    Resilier un abonnement\n    Acheter un jeu\n  Relations :\n    Souscrire un abonnement ..include..> S'authentifier\n      (obligatoire et partage : la fleche part du cas de BASE)\n    Appliquer la remise abonne ..extend..> Acheter un jeu\n      (optionnel et conditionnel : la fleche ARRIVE sur le\n       cas de base - piege n°4 du jour 30)\n\n------------------------------------------------------------\n2. DIAGRAMME DE CLASSES\n------------------------------------------------------------\nQUESTION : quelles entites nouvelles apparaissent, comment se\n  relient-elles a l'existant, et ou inscrire la regle des\n  trois exemplaires et la remise de 10 % ?\nPOURQUOI PAS UN AUTRE : c'est la seule vue qui porte les\n  ATTRIBUTS, les MULTIPLICITES et les CONTRAINTES. C'est aussi\n  elle qui se traduira en code et en tables (jours 13 et 14) :\n  une erreur ici se paie partout ailleurs.\nESQUISSE :\n  Membre \"1\" ---- \"0..*\" Abonnement\n    (0..* et non 0..1 : on garde l'historique des abonnements\n     passes ; un seul est actif a la fois -> contrainte)\n  Abonnement \"1\" ---- \"0..*\" Location\n  Membre \"1\" ---- \"0..*\" Location\n  Membre \"1\" ---- \"0..*\" Vente\n  Location \"0..*\" ---- \"1\" Exemplaire\n\n  class Abonnement {\n    - dateDebut : Date\n    - dateFin : Date\n    - montantMensuel : Real\n    - {static} maxSimultane : Integer = 3\n    ' NIVEAU CLASSE : la limite vaut pour TOUS les abonnements,\n    ' la stocker dans chaque objet serait une redondance (regle 3\n    ' de validation, jour 29)\n    - {static} tauxRemise : Real = 0.10\n    --\n    + estActif() : Boolean\n    + peutEmprunter() : Boolean\n  }\n\n  Contrainte a noter explicitement :\n    { un Abonnement actif ne peut avoir plus de 3 Locations\n      dont date_fin est nulle }\n    -> en UML 2.5.1, une note ou une invariant OCL :\n       context Abonnement inv limiteEmprunts:\n         self.location->select(l | l.date_fin.isEmpty())->size() <= 3\n\n  Verification anti-pieges (jour 30) :\n    - aucun attribut n'a pour type une autre classe ;\n    - toutes les extremites portent une multiplicite ;\n    - pas de losange plein : supprimer un Membre ne doit pas\n      effacer l'historique comptable de ses locations.\n\n------------------------------------------------------------\n3. MACHINE A ETATS DE L'ABONNEMENT\n------------------------------------------------------------\nQUESTION : par quels etats passe UN abonnement, et quels\n  evenements le font changer ?\nPOURQUOI PAS UN AUTRE : l'enonce emploie le vocabulaire des\n  etats (\"se suspend\", \"se resilie\"). Le diagramme d'ACTIVITES\n  decrirait un processus traverse par plusieurs acteurs, pas le\n  cycle de vie d'un seul objet : les confondre est le piege 12\n  du jour 30. Le diagramme de classes, lui, dit qu'il existe un\n  statut mais pas quelles transitions sont AUTORISEES.\nESQUISSE :\n  [initial] --souscrire/debiter(1er mois)--> Actif\n  Actif --echecPrelevement--> Suspendu\n  Actif --resilier--> Resilie --> [final]\n  Actif --finDeMois[paiement ok]/renouveler--> Actif\n  Suspendu --regulariser[dette soldee]/reactiver--> Actif\n  Suspendu --delai(30 jours)--> Resilie\n\n  Chaque transition respecte la forme\n    evenement [garde] / effet          (jour 18)\n  Coherence (jour 26) : chacun de ces etats correspond a une\n  valeur de l'attribut statut de la classe Abonnement.\n\n------------------------------------------------------------\n4. DIAGRAMME DE SEQUENCE\n------------------------------------------------------------\nQUESTION : dans quel ordre les objets echangent-ils des messages\n  quand un abonne tente un emprunt, et que se passe-t-il au\n  quatrieme ?\nPOURQUOI PAS UN AUTRE : la machine a etats dit ce que devient\n  l'abonnement, pas QUI appelle QUI ni dans quel ORDRE. Le\n  diagramme de communication montrerait les memes echanges mais\n  privilegierait les liens ; ici c'est la CHRONOLOGIE et le\n  branchement conditionnel qui comptent, donc la sequence.\nESQUISSE :\n  Employe -> IHM : emprunter(membre, exemplaire)   [pointe PLEINE]\n  IHM -> Abonnement : estActif()                    [pointe PLEINE]\n  alt [abonnement actif]\n        IHM -> Abonnement : peutEmprunter()\n        alt [nbEnCours < 3]\n              IHM -> Location : creer(date_debut)\n              IHM -> Exemplaire : marquerLoue()\n              IHM --> Employe : accord            [retour pointille]\n            [else]\n              IHM --> Employe : refus - limite de 3 atteinte\n        end\n      [else]\n        IHM --> Employe : refus - abonnement suspendu\n  end\n\n  On utilise alt (choix EXCLUSIF) et non par (parallelisme) :\n  piege 11 du jour 30. Les pointes pleines marquent les appels\n  synchrones, les pointilles les retours.\n\n============================================================\n(d) LES DIAGRAMMES ECARTES, ET POURQUOI\n============================================================\nObjets           : utile pour VALIDER le modele sur un cas reel ;\n                   ici la structure est simple, on s'en passe -\n                   a ressortir si les multiplicites sont contestees.\nActivites        : decrirait le processus au comptoir ; deja couvert\n                   au jour 27, et rien de nouveau dans cette\n                   fonctionnalite cote enchainement d'actions.\nCommunication    : montrerait les memes echanges que la sequence,\n                   sans apporter d'information supplementaire.\nTemps            : aucune contrainte de DUREE chiffree n'est\n                   exprimee dans l'enonce.\nVue d'ensemble des interactions : un seul scenario ici, rien a\n                   assembler.\nPaquetages       : le modele reste petit, aucun probleme de\n                   decoupage ni de dependance circulaire.\nComposants       : l'architecture logicielle ne change pas ;\n                   l'abonnement s'ajoute au module existant.\nDeploiement      : aucune machine nouvelle, aucun protocole\n                   nouveau.\nStructure composite : aucun classifieur complexe a ouvrir.\nProfils          : aucun besoin d'etendre UML pour ce domaine.\n\n============================================================\nCONCLUSION\n============================================================\nQuatre diagrammes, quatre questions, dix diagrammes ecartes avec\nune raison. C'est le format d'un dossier reel : on ne dessine pas\nles 14 diagrammes parce qu'ils existent, on dessine ceux qui\ntranchent une question ouverte (piege 14, jour 30).\n\nAvant de rendre, dernier controle de coherence (jour 26) :\n  - \"Membre\" s'appelle Membre dans les quatre diagrammes ;\n  - chaque cas d'utilisation retenu est trace par la sequence\n    ou par la machine a etats ;\n  - chaque message de la sequence correspond a une operation\n    declaree dans le diagramme de classes ;\n  - chaque etat de la machine correspond a une valeur de\n    l'attribut statut d'Abonnement.",
    note: "Un autre jeu de quatre diagrammes peut être défendable — par exemple activités à la place de séquence, si tu justifies par le besoin de montrer les couloirs Membre/Employé/Système. Ce qui est évalué : exactement quatre choix, une question métier précise par diagramme, l'argument expliquant pourquoi un autre diagramme ne conviendrait pas, une esquisse ancrée sur l'abonnement avec les noms de l'énoncé, et la liste motivée des diagrammes écartés." }
