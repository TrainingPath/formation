<script>
var DAY = {
  num: 28,
  title: "Sauvegarde et haute disponibilité (aperçu)",
  subtitle: "Deux questions à ne jamais confondre : « je perds quoi ? » et « je continue comment ? ».",
  theory: `
<h3>1. Sauvegarder n'est pas dupliquer</h3>
<p>Une <strong>sauvegarde</strong> (en anglais <em>backup</em>) est une copie mise de côté pour <em>restaurer</em> des données perdues (erreur humaine, virus, panne). La <strong>haute disponibilité</strong> (en anglais <em>high availability</em>, HA) est autre chose : c'est la capacité d'un service à <em>continuer de fonctionner</em> malgré une panne. La sauvegarde répond à « comment récupérer ce qui est perdu ? » ; la haute disponibilité répond à « comment ne pas s'arrêter ? ». Les deux sont nécessaires et ne se remplacent pas.</p>
<p>Une bonne discipline de sauvegarde suit la règle <strong>3-2-1</strong> : au moins <strong>3</strong> copies, sur <strong>2</strong> supports différents, dont <strong>1</strong> hors site (à un autre endroit). Ainsi un incendie ou un vol ne détruit pas tout.</p>
<h3>2. RAID : plusieurs disques comme un seul</h3>
<p>Le <strong>RAID</strong> (« Redundant Array of Independent Disks ») regroupe plusieurs disques pour améliorer la sécurité ou les performances. Attention : le RAID protège contre la <em>panne d'un disque</em>, il ne remplace pas une sauvegarde (il ne protège pas d'un effacement ou d'un virus). Les niveaux courants :</p>
<pre class="pseudo"># Niveaux RAID les plus utilises :
RAID 0  : agregation (stripe) -> vitesse, AUCUNE securite (1 disque HS = tout perdu)
RAID 1  : miroir (mirror)     -> copie identique sur 2 disques (tolere 1 panne)
RAID 5  : parite repartie     -> tolere la panne d'1 disque, min. 3 disques
RAID 6  : double parite       -> tolere la panne de 2 disques, min. 4 disques
RAID 10 : miroir + stripe     -> vitesse ET securite (min. 4 disques)</pre>
<h3>3. Réplication et redondance</h3>
<p>La <strong>redondance</strong> consiste à doubler les éléments critiques pour qu'aucun ne soit un <strong>point unique de défaillance</strong> (en anglais <em>SPOF, Single Point Of Failure</em>) : deux alimentations, deux liens réseau, deux serveurs. La <strong>réplication</strong> copie en continu les données d'un serveur vers un autre, pour qu'un second puisse prendre le relais instantanément. Quand le serveur principal tombe, le secondaire assure : c'est le <strong>basculement</strong> (en anglais <em>failover</em>).</p>
<pre class="pseudo"># Redondance et bascule :
[Serveur PRINCIPAL] ==replication continue==> [Serveur SECONDAIRE]
       (actif)                                    (en attente)
   panne !  --failover-->  le secondaire devient actif
# Objectif : pas de SPOF, service qui continue.</pre>
<h3>4. RPO et RTO : mesurer l'exigence</h3>
<p>Deux indicateurs chiffrent le besoin. Le <strong>RPO</strong> (« Recovery Point Objective », objectif de point de reprise) : quelle <em>quantité de données</em> peut-on se permettre de perdre, exprimée en temps ? Si on sauvegarde toutes les heures, on risque de perdre jusqu'à 1h de données : RPO = 1h. Le <strong>RTO</strong> (« Recovery Time Objective », objectif de temps de reprise) : en combien de temps le service doit-il être rétabli après la panne ? RTO = 4h signifie « remis debout en 4h maximum ».</p>
<div class="tip">Astuce mémoire : <strong>RPO</strong> regarde vers le <em>passé</em> (« combien de données perdues ? ») ; <strong>RTO</strong> regarde vers le <em>futur</em> (« dans combien de temps ça remarche ? »). Plus on les veut petits, plus la solution coûte cher.</div>
<div class="warn">Piège classique : croire que le RAID ou la réplication remplacent la sauvegarde. Ils copient <em>aussi</em> les erreurs et les virus en temps réel. Une vraie sauvegarde garde une version <strong>antérieure</strong>, à part, restaurable.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SAUVEGARDE (backup) = restaurer ce qui est perdu | regle 3-2-1
# HAUTE DISPO (HA)    = continuer malgre la panne
# RAID : 0=vitesse(0 secu) 1=miroir 5=parite(1 panne) 6=(2 pannes) 10=miroir+stripe
# Redondance = pas de SPOF | Replication + failover = bascule sur le secondaire
# RPO = donnees perdues max (passe) | RTO = delai de remise en service (futur)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert une sauvegarde (backup) ?", opts: ["À accélérer le réseau", "À restaurer des données perdues", "À router les paquets", "À distribuer les adresses IP"], a: 1, exp: "La sauvegarde permet de récupérer des données après une perte." },
    { type: "vf", q: "Le RAID remplace complètement une sauvegarde.", a: false, exp: "Non : le RAID protège d'une panne disque, pas d'un effacement ou d'un virus." },
    { type: "input", q: "Comment appelle-t-on (en français, 3 mots) la capacité d'un service à continuer malgré une panne ?", a: ["haute disponibilité", "haute disponibilite", "high availability", "la haute disponibilité"], ph: "3 mots", exp: "La haute disponibilité (HA) vise la continuité de service." },
    { type: "qcm", q: "La règle « 3-2-1 » de sauvegarde signifie…", opts: ["3 disques, 2 serveurs, 1 réseau", "3 copies, sur 2 supports, dont 1 hors site", "3 ports, 2 câbles, 1 switch", "3 sauvegardes par an"], a: 1, exp: "3 copies, 2 supports différents, 1 conservée hors site." },
    { type: "qcm", q: "Quel niveau RAID est un simple miroir de deux disques ?", opts: ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], a: 1, exp: "RAID 1 = miroir : la même donnée sur deux disques." },
    { type: "qcm", q: "Quel niveau RAID offre de la vitesse mais AUCUNE sécurité ?", opts: ["RAID 0", "RAID 1", "RAID 5", "RAID 10"], a: 0, exp: "RAID 0 (stripe) accélère mais un disque HS fait tout perdre." },
    { type: "input", q: "Combien de pannes de disque le RAID 5 tolère-t-il ?", a: ["1", "un", "une", "un disque"], ph: "un nombre", exp: "RAID 5 (parité répartie) tolère la panne d'un seul disque." },
    { type: "qcm", q: "Le RAID 6 tolère la panne de combien de disques ?", opts: ["0", "1", "2", "4"], a: 2, exp: "RAID 6 (double parité) tolère la perte de deux disques." },
    { type: "input", q: "Quel sigle désigne un élément unique dont la panne arrête tout (point unique de défaillance) ?", a: ["spof", "single point of failure"], ph: "4 lettres", exp: "SPOF = Single Point Of Failure ; la redondance vise à l'éliminer." },
    { type: "qcm", q: "Comment appelle-t-on le passage automatique du serveur principal au secondaire ?", opts: ["Le failover (basculement)", "Le broadcast", "Le routage", "Le proxy"], a: 0, exp: "Le failover fait prendre le relais au serveur secondaire." },
    { type: "qcm", q: "Que mesure le RPO (Recovery Point Objective) ?", opts: ["Le délai pour rétablir le service", "La quantité de données que l'on peut se permettre de perdre", "Le nombre de disques", "La vitesse du réseau"], a: 1, exp: "Le RPO chiffre la perte de données acceptable (en temps)." },
    { type: "qcm", q: "Que mesure le RTO (Recovery Time Objective) ?", opts: ["La quantité de données perdue", "Le temps maximal pour rétablir le service", "Le nombre de sauvegardes", "La taille du disque"], a: 1, exp: "Le RTO chiffre le délai maximal de remise en service." },
    { type: "vf", q: "Si l'on sauvegarde toutes les heures, le RPO est d'environ 1 heure.", a: true, exp: "Oui : au pire on perd les données produites depuis la dernière sauvegarde." },
    { type: "input", q: "Comment appelle-t-on la copie continue des données d'un serveur vers un autre ?", a: ["réplication", "replication", "la réplication"], ph: "un mot", exp: "La réplication maintient un second serveur à jour, prêt à prendre le relais." },
    { type: "vf", q: "Doubler les alimentations et les liens réseau est une forme de redondance.", a: true, exp: "Oui : la redondance supprime les points uniques de défaillance." }
  ],
  final: {
    title: "Exercice final — Protéger le serveur de facturation",
    intro: `<p>Le serveur de facturation d'une PME est vital. La direction dit : « on ne peut pas perdre plus d'<strong>1 heure</strong> de données, et le service doit revenir en <strong>2 heures</strong> maximum ». On monte du RAID, une réplication et une sauvegarde 3-2-1. Chiffre et nomme les choix.</p>`,
    questions: [
      { type: "input", q: "« Pas plus d'1h de données perdue » définit quel indicateur (sigle) ?", a: ["rpo"], ph: "3 lettres", exp: "C'est le RPO (Recovery Point Objective) = 1h." },
      { type: "input", q: "« Service rétabli en 2h maximum » définit quel indicateur (sigle) ?", a: ["rto"], ph: "3 lettres", exp: "C'est le RTO (Recovery Time Objective) = 2h." },
      { type: "qcm", q: "Pour tolérer la panne d'un disque sur 3 disques utiles, quel RAID choisir ?", opts: ["RAID 0", "RAID 5", "RAID (aucun)", "RAID -1"], a: 1, exp: "RAID 5 tolère la panne d'un disque avec au moins 3 disques." },
      { type: "vf", q: "Le RAID seul suffit : on peut se passer de sauvegarde puisqu'un disque peut lâcher sans perte.", a: false, exp: "Non : le RAID ne protège pas d'un effacement ou d'un virus. Il faut aussi des sauvegardes." },
      { type: "qcm", q: "Pour que le service continue si le serveur principal tombe, on met en place…", opts: ["Un seul serveur, sans copie", "Une réplication vers un secondaire avec failover", "Un proxy sortant", "Un serveur DHCP de plus"], a: 1, exp: "Réplication + failover assurent la continuité (haute disponibilité)." }
    ],
    solution: `<pre class="pseudo"># Plan de resilience du serveur de facturation :
Exigences : RPO = 1h (perte max)  |  RTO = 2h (remise en service)
Disques   : RAID 5 (tolere 1 panne disque, min. 3 disques)
Continuite: replication -> serveur secondaire + failover automatique
Sauvegarde: regle 3-2-1 (3 copies, 2 supports, 1 hors site), toutes les heures
Rappel    : RAID != sauvegarde. Redondance -> pas de SPOF.</pre>
<p>Données protégées, service qui continue, perte bornée : les trois piliers sont en place. Demain, on passe à la pratique en déployant un vrai serveur web.</p>`
  }
};
</script>
