<script>
var DAY = {
  num: 7,
  title: "Le service DNS : pourquoi ?",
  subtitle: "Retenir « exemple.com » plutôt que « 93.184.216.34 » : merci le DNS.",
  theory: `
<h3>1. Le problème : les machines parlent en chiffres</h3>
<p>Sur Internet, chaque machine est joignable par une <strong>adresse IP</strong>, une suite de chiffres comme 93.184.216.34 (IPv4) ou une adresse IPv6 encore plus longue. C'est parfait pour les ordinateurs, mais illisible pour un humain. Personne ne veut retenir des dizaines d'adresses numériques ni les taper sans se tromper. Il fallait une couche de noms lisibles.</p>
<h3>2. La solution : le DNS, annuaire d'Internet</h3>
<p>Le <strong>DNS</strong> (en anglais <em>Domain Name System</em>, « système de noms de domaine ») est le service qui traduit un <strong>nom</strong> (comme <em>exemple.com</em>) en <strong>adresse IP</strong>, et inversement. C'est l'<strong>annuaire</strong> d'Internet : tu connais le nom, il te donne le numéro. Grâce à lui, tu tapes un nom facile à mémoriser et la machine retrouve seule l'adresse à contacter.</p>
<pre class="pseudo"># Ce que fait le DNS, en une image
Toi tapes :   www.exemple.com
DNS repond :  93.184.216.34
Ton navigateur contacte alors cette adresse IP.
# Nom lisible (humain)  &lt;-->  adresse IP (machine)</pre>
<div class="tip">Analogie : le DNS est le répertoire de ton téléphone. Tu tapes « Maman » (le nom), le téléphone compose le vrai numéro. Sans répertoire, il faudrait connaître tous les numéros par cœur.</div>
<h3>3. Résolution directe et inverse</h3>
<p>La traduction <strong>nom → IP</strong> est la <strong>résolution directe</strong> (la plus courante). L'opération inverse, <strong>IP → nom</strong>, s'appelle la <strong>résolution inverse</strong> (utile pour les journaux, la messagerie, le diagnostic). Le DNS gère les deux sens.</p>
<h3>4. Un deuxième avantage : la souplesse</h3>
<p>Le DNS n'est pas qu'un confort de mémoire. Il apporte une <strong>indirection</strong> précieuse : si le serveur qui héberge <em>exemple.com</em> déménage vers une nouvelle adresse IP, on met simplement à jour l'annuaire DNS. Le nom, lui, ne change pas : les visiteurs continuent de taper <em>exemple.com</em> sans rien savoir du changement. On peut aussi répartir la charge entre plusieurs serveurs pour un même nom. Changer l'adresse sans changer le nom : voilà la vraie force du DNS.</p>
<div class="warn">Sans DNS, taper une adresse numérique fonctionne encore techniquement, mais tout devient pénible : plus de noms mémorisables, plus de possibilité de changer d'IP sans prévenir tout le monde. C'est pourquoi une panne DNS donne l'impression qu'« Internet ne marche plus », alors que le réseau physique fonctionne.</div>
<h3>5. Où et quand ça se passe</h3>
<p>La résolution DNS a lieu <strong>avant</strong> la connexion réelle : dès que tu valides une adresse, ton système interroge un <strong>serveur DNS</strong> (souvent celui fourni par le DHCP, jour 2) pour obtenir l'IP, puis seulement il se connecte. Le DNS utilise le <strong>port 53</strong> (en UDP le plus souvent, en TCP pour les grosses réponses). C'est un service d'infrastructure, silencieux mais indispensable.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DNS = Domain Name System = annuaire d'Internet
# Role : traduire un NOM en adresse IP (et l'inverse)
# Directe  : nom  -> IP    | Inverse : IP -> nom
# Avantage : changer l'IP sans changer le nom (indirection)
# Port DNS : 53 (UDP le plus souvent, TCP pour grosses reponses)</pre>`,
  exercises: [
    { type: "input", q: "Que signifie le sigle DNS ?", a: ["domain name system", "système de noms de domaine", "systeme de noms de domaine", "domain name service"], ph: "trois mots", exp: "DNS = Domain Name System (système de noms de domaine)." },
    { type: "qcm", q: "Quel est le rôle principal du DNS ?", opts: ["Attribuer des adresses IP automatiquement", "Traduire un nom (exemple.com) en adresse IP", "Distribuer des pages web", "Acheminer les paquets entre les réseaux"], a: 1, exp: "Le DNS traduit les noms de domaine en adresses IP (et inversement)." },
    { type: "qcm", q: "À quel objet du quotidien compare-t-on souvent le DNS ?", opts: ["Un répertoire téléphonique (annuaire)", "Un facteur qui distribue le courrier", "Un standard téléphonique qui relie les appels", "Un péage à l'entrée de l'autoroute"], a: 0, exp: "Le DNS est l'annuaire d'Internet : le nom donne le numéro." },
    { type: "vf", q: "Retenir « exemple.com » est plus facile pour un humain que retenir « 93.184.216.34 ».", a: true, exp: "Oui : c'est justement la raison d'être du DNS — des noms lisibles." },
    { type: "input", q: "Comment appelle-t-on la traduction NOM → IP (le sens le plus courant) ?", a: ["résolution directe", "resolution directe", "directe", "la résolution directe"], ph: "résolution…", exp: "C'est la résolution directe (nom → IP)." },

    { type: "qcm", q: "Quel avantage, au-delà de la mémoire, apporte le DNS ?", opts: ["Il attribue les adresses IP à la place du DHCP", "Il permet de changer l'IP d'un service sans changer son nom", "Il chiffre automatiquement les échanges web", "Il garde une copie locale des pages web"], a: 1, exp: "L'indirection : on met à jour l'annuaire, le nom reste identique." },
    { type: "vf", q: "Si un site déménage vers une nouvelle IP, il faut obligatoirement changer son nom de domaine.", a: false, exp: "Non : on met à jour l'enregistrement DNS ; le nom reste le même." },
    { type: "qcm", q: "Sur quel numéro de port fonctionne le DNS ?", opts: ["25", "53", "67", "80"], a: 1, exp: "Le DNS utilise le port 53 (UDP le plus souvent, TCP pour les grosses réponses)." },
    { type: "input", q: "Quel protocole de transport le DNS utilise-t-il le plus souvent (pour les requêtes courantes) ?", a: ["udp", "en udp", "l'udp"], ph: "UDP ou TCP", exp: "Le DNS utilise surtout UDP (port 53) ; TCP pour les grosses réponses." },
    { type: "qcm", q: "Quand a lieu la résolution DNS lors de l'ouverture d'un site ?", opts: ["Après avoir chargé la page", "Avant la connexion : on obtient d'abord l'IP, puis on se connecte", "Jamais", "Uniquement le week-end"], a: 1, exp: "Le système résout d'abord le nom en IP, puis établit la connexion." },
    { type: "vf", q: "Une panne DNS peut donner l'impression qu'« Internet ne marche plus », même si le réseau physique fonctionne.", a: true, exp: "Oui : sans résolution de noms, rien ne se charge par son nom habituel." },
    { type: "qcm", q: "D'où le poste client tient-il généralement l'adresse du serveur DNS à interroger ?", opts: ["Il l'obtient toujours des serveurs racine", "Souvent du DHCP (fourni avec l'IP, le masque et la passerelle)", "De la configuration du navigateur web", "Du serveur web qu'il visite"], a: 1, exp: "Le DHCP fournit l'adresse du serveur DNS aux clients (jour 2)." },
    { type: "input", q: "Le DNS est un service d'infrastructure ou applicatif ?", a: ["infrastructure", "d'infrastructure", "service d'infrastructure", "infrastructure "], ph: "un mot", exp: "Comme le DHCP, le DNS est un service d'infrastructure." },
    { type: "vf", q: "Le DNS gère aussi bien la traduction nom → IP que IP → nom.", a: true, exp: "Oui : résolution directe (nom → IP) et inverse (IP → nom)." }
  ],
  final: {
    title: "Exercice final — Pourquoi le nom plutôt que le numéro ?",
    intro: `<p>Une entreprise héberge son site sur le serveur d'adresse 203.0.113.10 sous le nom <code>www.societe.fr</code>. Six mois plus tard, elle change d'hébergeur : la nouvelle IP est 198.51.100.20. Analyse le rôle du DNS.</p>`,
    questions: [
      { type: "qcm", q: "Quand un visiteur tape www.societe.fr, que fait d'abord son ordinateur ?", opts: ["Il devine l'adresse", "Il interroge le DNS pour obtenir l'adresse IP", "Il se connecte directement sans résoudre le nom", "Il demande une nouvelle adresse IP au DHCP"], a: 1, exp: "Le poste résout d'abord le nom en IP via le DNS, puis se connecte." },
      { type: "input", q: "Comment s'appelle la traduction www.societe.fr → 203.0.113.10 ?", a: ["résolution directe", "resolution directe", "directe", "la résolution directe"], ph: "résolution…", exp: "C'est la résolution directe (nom → IP)." },
      { type: "vf", q: "Après le changement d'hébergeur, il suffit de mettre à jour l'enregistrement DNS pour pointer vers 198.51.100.20.", a: true, exp: "Oui : on change l'IP dans le DNS, le nom www.societe.fr ne change pas." },
      { type: "qcm", q: "Les visiteurs devront-ils apprendre une nouvelle adresse après le déménagement ?", opts: ["Oui, la nouvelle IP", "Non : ils tapent toujours le même nom, le DNS s'occupe du reste", "Oui, un nouveau nom", "Oui, un nouveau numéro de port"], a: 1, exp: "Le nom reste identique ; c'est tout l'intérêt de l'indirection DNS." },
      { type: "qcm", q: "Sur quel port l'ordinateur du visiteur interroge-t-il le serveur DNS ?", opts: ["80", "53", "67", "443"], a: 1, exp: "La requête DNS part vers le port 53." }
    ],
    solution: `<pre class="pseudo"># Le DNS comme couche d'indirection :
Avant :  www.societe.fr  --DNS-->  203.0.113.10
Apres :  www.societe.fr  --DNS-->  198.51.100.20   (seul le DNS change)
# Le NOM reste identique -> les visiteurs ne changent rien.
# Resolution directe = nom -> IP  | port DNS = 53.</pre>
<p>Tu comprends POURQUOI le DNS existe. Demain : comment les noms sont organisés — l'arborescence, de la racine au FQDN.</p>`
  }
