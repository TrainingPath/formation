  title: "Le bail DHCP et la réservation",
  subtitle: "Une adresse n'est pas donnée pour toujours : elle est prêtée, puis renouvelée.",
  theory: `
<h3>1. Le bail : une location, pas un cadeau</h3>
<p>Quand le serveur attribue une adresse, il ne la donne pas définitivement : il la <strong>loue</strong> pour une durée limitée. C'est le <strong>bail</strong> (en anglais <em>lease</em>). Le serveur note dans un fichier quelle adresse est prêtée, à quelle machine (identifiée par son adresse <strong>MAC</strong>), et jusqu'à quand. Passé ce délai sans renouvellement, l'adresse redevient disponible pour un autre. C'est exactement l'idée d'un bail immobilier : tu occupes le logement tant que le contrat court.</p>
<pre class="pseudo"># Exemple d'entree de bail (fichier leases)
lease 192.168.1.42 {
  starts   2026/07/27 08:00:00;   # debut du bail
  ends     2026/07/28 08:00:00;   # fin (ici 24 h plus tard)
  hardware ethernet 00:1a:2b:3c:4d:5e;  # adresse MAC du client
}</pre>
<h3>2. Pourquoi une durée limitée ?</h3>
<p>Une durée limitée permet de <strong>recycler</strong> les adresses. Un portable de passage libère naturellement son adresse au bout de quelques heures : inutile de la lui garder éternellement. Sur un réseau où beaucoup d'appareils vont et viennent (Wi-Fi public, salle de réunion), des baux courts évitent d'épuiser la plage. À l'inverse, sur un parc stable de postes fixes, on choisit des baux plus longs (plusieurs jours) pour réduire le trafic de renouvellement.</p>
<h3>3. Le renouvellement (T1 et T2)</h3>
<p>Le client ne laisse pas son bail expirer : il le <strong>renouvelle</strong> avant la fin. À la moitié de la durée du bail (temps <strong>T1</strong>, soit 50 %), il envoie un <strong>DHCPREQUEST</strong> directement au serveur qui l'avait servi (en unicast) pour prolonger. Si ce serveur ne répond pas, il réessaie à <strong>T2</strong> (environ 87,5 %) en broadcast, auprès de n'importe quel serveur. S'il obtient un DHCPACK, le compteur repart à zéro.</p>
<div class="tip">Ce renouvellement est invisible pour l'utilisateur. C'est pourquoi une machine allumée en permanence garde souvent la même adresse pendant des semaines : elle renouvelle son bail avant qu'il n'expire.</div>
<h3>4. La réservation : une adresse fixe via le DHCP</h3>
<p>Parfois, on veut qu'un équipement reçoive <strong>toujours la même adresse</strong> (une imprimante, un serveur), tout en restant géré par le DHCP. C'est la <strong>réservation</strong> (en anglais <em>reservation</em>, ou <em>static mapping</em>). Le serveur associe une adresse MAC précise à une adresse IP fixe : chaque fois que cette carte réseau demande une adresse, elle reçoit exactement la même. On garde ainsi la centralisation du DHCP sans l'aléa de la plage dynamique.</p>
<pre class="pseudo"># Reservation dans dhcpd.conf (associer une MAC a une IP fixe)
host imprimante-etage2 {
  hardware ethernet 00:aa:bb:cc:dd:ee;   # la MAC de l'imprimante
  fixed-address 192.168.1.240;           # toujours cette IP
}</pre>
<div class="warn">Ne confonds pas <strong>réservation</strong> et <strong>IP statique manuelle</strong>. La réservation reste gérée par le serveur DHCP (l'appareil demande et reçoit) ; l'IP statique est saisie en dur sur l'appareil, hors du DHCP. La réservation est plus souple : on change l'attribution côté serveur, sans toucher l'appareil.</div>
<h3>5. Libérer et renouveler à la demande</h3>
<p>Un client peut rendre son adresse avant l'heure avec un <strong>DHCPRELEASE</strong> (par exemple <code>ipconfig /release</code> sous Windows), ou en redemander une avec <code>ipconfig /renew</code>. On verra ces commandes de dépannage au jour 6.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Bail (lease)   = adresse pretee pour une duree limitee, liee a la MAC
# Renouvellement : T1 ~50% (unicast), T2 ~87,5% (broadcast)
# Bail court  -> beaucoup d'appareils de passage (recyclage)
# Bail long   -> parc stable (moins de trafic)
# Reservation  = MAC -> IP fixe, TOUJOURS la meme, gere par le DHCP</pre>`,
  exercises: [
    { type: "input", q: "Comment appelle-t-on la « location » temporaire d'une adresse IP par le DHCP (mot français) ?", a: ["bail", "le bail", "un bail"], ph: "un mot", exp: "C'est le bail (lease en anglais) : l'adresse est prêtée pour une durée limitée." },

    { type: "qcm", q: "Pour quel type d'équipement une réservation est-elle particulièrement utile ?", opts: ["Un portable de passage", "Une imprimante réseau ou un serveur", "Un téléphone d'invité", "Un poste client en libre-service"], a: 1, exp: "Imprimantes et serveurs gagnent à garder toujours la même adresse." },
    { type: "input", q: "Quel message un client envoie-t-il pour RENDRE son adresse avant la fin du bail ?", a: ["dhcprelease", "release", "dhcp release"], ph: "DHCP…", exp: "Le DHCPRELEASE libère l'adresse (commande ipconfig /release sous Windows)." },
    { type: "qcm", q: "Avantage d'une réservation par rapport à une IP statique manuelle ?", opts: ["Elle est plus lente", "On peut changer l'attribution côté serveur sans toucher l'appareil", "Elle supprime le DHCP", "Elle attribue une adresse différente à chaque démarrage"], a: 1, exp: "La réservation est centralisée : on modifie le serveur, pas chaque appareil." },
    { type: "vf", q: "Un bail plus long réduit le trafic de renouvellement sur un parc de postes fixes et stables.", a: true, exp: "Oui : moins d'appareils changeants = baux longs = moins d'échanges de renouvellement." },
    { type: "input", q: "À environ quel pourcentage de la durée du bail se situe la seconde tentative de renouvellement (T2) ?", a: ["87,5%", "87.5%", "87,5", "87.5", "87,5 %", "87.5 %", "875"], ph: "un pourcentage", exp: "T2 se situe à environ 87,5 % de la durée du bail (en broadcast)." },
    { type: "qcm", q: "Que contient typiquement une entrée de bail dans le fichier leases ?", opts: ["Uniquement l'adresse IP, sans la MAC", "L'adresse prêtée, la MAC du client, le début et la fin du bail", "Le nom de domaine complet du client", "La liste des ports ouverts sur le client"], a: 1, exp: "Une entrée lease indique l'IP, la MAC, les dates starts/ends." }
  ],
  final: {

      { type: "qcm", q: "Pour les 60 portables très mobiles, quelle durée de bail est la plus adaptée ?", opts: ["Un bail très long (30 jours)", "Un bail court (quelques heures)", "Une réservation MAC pour chaque portable", "Un bail permanent de plusieurs années"], a: 1, exp: "Beaucoup de va-et-vient = baux courts pour recycler vite les adresses." },

    ],
    solution: `<pre class="pseudo"># Configuration recommandee :
