<script>
var DAY = {
  num: 31,
  title: "Projet final : monter l'infra d'une petite entreprise",
  subtitle: "Tout ce qu'on a appris, réuni en un plan de services cohérent et sécurisé.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>C'est le grand jour : on conçoit l'infrastructure réseau d'une PME, « <strong>Atelier Nord</strong> », 25 employés. Objectif : que chaque poste se connecte tout seul, retrouve les serveurs par leur nom, consulte l'intranet, et que les administrateurs pilotent tout à distance, en sécurité. On mobilise quatre services vus dans le cours : <strong>DHCP</strong>, <strong>DNS</strong>, <strong>web</strong> et <strong>SSH</strong>. Un projet, c'est d'abord des <em>choix</em> justifiés, pas une accumulation de logiciels.</p>
<pre class="pseudo"># Plan d'adressage retenu (reseau 192.168.10.0/24) :
192.168.10.1        Passerelle (routeur/pare-feu)
192.168.10.5        Serveur DHCP    (isc-dhcp-server)
192.168.10.10       Serveur DNS     (BIND) -> atelier.local
192.168.10.20       Serveur WEB     (Apache) -> intranet.atelier.local
192.168.10.100-200  Plage distribuee aux postes (bail DHCP)
# Les serveurs ont une IP FIXE ; les postes une IP dynamique.</pre>
<h3>2. Les quatre services et leur rôle</h3>
<p>Chaque service occupe une case précise. Le <strong>DHCP</strong> distribue aux postes l'IP, le masque, la passerelle et l'adresse du DNS (option 6). Le <strong>DNS</strong> (BIND) tient la zone <code>atelier.local</code> et traduit les noms en IP. Le <strong>web</strong> (Apache) sert l'intranet. Le <strong>SSH</strong> permet aux admins d'administrer les serveurs à distance, en ligne de commande chiffrée.</p>
<pre class="pseudo"># Ports a connaitre pour le plan :
DHCP  : UDP 67 (serveur) / 68 (client)
DNS   : UDP et TCP 53
WEB   : TCP 80 (HTTP) et 443 (HTTPS)
SSH   : TCP 22
# Le pare-feu n'ouvre QUE ces ports, et seulement la ou c'est utile.</pre>
<h3>3. Faire coopérer les services</h3>
<p>La force du plan, c'est l'enchaînement : un poste branché reçoit une IP <em>et</em> l'adresse du DNS (DHCP), il traduit <code>intranet.atelier.local</code> en <code>192.168.10.20</code> (DNS), puis affiche la page (web). Les serveurs, eux, ont une <strong>IP fixe</strong> (jamais dynamique, sinon leurs noms pointeraient dans le vide). Les administrateurs se connectent en <strong>SSH</strong> pour configurer et dépanner sans se déplacer.</p>
<pre class="pseudo"># Le parcours d'un poste, du branchement a la page :
Poste --DHCP--> IP 192.168.10.137 + DNS 192.168.10.10
Poste --DNS---> intranet.atelier.local = 192.168.10.20
Poste --WEB---> http://intranet.atelier.local/ (Apache, port 80)
Admin --SSH---> ssh admin@192.168.10.20 (administration a distance)</pre>
<h3>4. Sécuriser l'ensemble</h3>
<p>Un plan sans sécurité est un plan inachevé. Quelques réflexes essentiels : sur <strong>SSH</strong>, désactiver la connexion directe de <code>root</code> (<code>PermitRootLogin no</code>) et préférer les <strong>clés</strong> aux mots de passe. Fermer au <strong>pare-feu</strong> tous les ports sauf ceux utiles. <strong>Journaliser</strong> (logs, /var/log) pour tracer les incidents et <strong>superviser</strong> (SNMP) pour être alerté avant la panne. Enfin, <strong>sauvegarder</strong> (règle 3-2-1) et prévoir la reprise (RPO/RTO).</p>
<div class="tip">Principe du <strong>moindre privilège</strong> : chaque service, chaque compte, chaque port n'a que les droits strictement nécessaires. Un port fermé ne peut pas être attaqué ; un compte root inaccessible en SSH réduit fortement la surface d'attaque.</div>
<div class="warn">Erreur de débutant : donner une IP dynamique (DHCP) aux serveurs. Leur adresse changerait, et le DNS pointerait vers le vide. Les serveurs doivent avoir une IP FIXE, exclue de la plage DHCP.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># INFRA PME = DHCP + DNS + WEB + SSH, choix justifies
# DHCP (67/68) -> IP + DNS aux postes | DNS (53) -> noms | WEB (80/443) | SSH (22)
# Serveurs = IP FIXE (hors plage DHCP) | Postes = IP dynamique
# Securite : SSH par cles + PermitRootLogin no, pare-feu (moindre privilege),
#            logs (/var/log), supervision (SNMP), sauvegarde 3-2-1 (RPO/RTO)</pre>`,
  exercises: [
    { type: "qcm", q: "Quels sont les quatre services au cœur du projet ?", opts: ["DHCP, DNS, web, SSH", "FTP, Telnet, SMTP, POP", "RAID, SNMP, syslog, TLS", "HTTP, HTTPS, DNS, ICMP"], a: 0, exp: "Le plan de la PME repose sur DHCP, DNS, web et SSH." },
    { type: "vf", q: "Les serveurs (DNS, web...) doivent avoir une IP fixe, hors de la plage DHCP.", a: true, exp: "Oui : une IP fixe garantit que leurs noms pointent toujours au bon endroit." },
    { type: "qcm", q: "Quel service distribue aux postes l'IP et l'adresse du DNS ?", opts: ["DNS", "DHCP", "SSH", "Apache"], a: 1, exp: "Le DHCP fournit IP, masque, passerelle et adresse du DNS (option 6)." },
    { type: "input", q: "Sur quel port TCP se connecte-t-on en SSH pour administrer les serveurs ?", a: ["22"], ph: "un nombre", exp: "SSH écoute sur le port TCP 22." },
    { type: "qcm", q: "Quel service traduit intranet.atelier.local en 192.168.10.20 ?", opts: ["DHCP", "DNS", "SNMP", "RAID"], a: 1, exp: "Le DNS résout le nom en adresse IP." },
    { type: "input", q: "Quel port UDP/TCP utilise le DNS ?", a: ["53"], ph: "un nombre", exp: "Le DNS utilise le port 53 (UDP et TCP)." },
    { type: "qcm", q: "Quelle directive SSH interdit la connexion directe de root ?", opts: ["PermitRootLogin no", "AllowRoot yes", "RootAccess full", "EnableRoot 1"], a: 0, exp: "PermitRootLogin no bloque la connexion directe du compte root." },
    { type: "vf", q: "Pour SSH, mieux vaut privilégier l'authentification par clés plutôt que par mot de passe.", a: true, exp: "Oui : les clés sont bien plus résistantes que les mots de passe." },
    { type: "qcm", q: "Le principe du « moindre privilège » consiste à…", opts: ["Tout ouvrir par confort", "N'accorder que les droits/ports strictement nécessaires", "Donner root à tous", "Désactiver les logs"], a: 1, exp: "Le moindre privilège réduit la surface d'attaque au strict nécessaire." },
    { type: "qcm", q: "Quel service sert la page de l'intranet ?", opts: ["BIND", "Apache (web)", "isc-dhcp-server", "OpenSSH"], a: 1, exp: "Apache est le serveur web qui délivre l'intranet." },
    { type: "input", q: "Quel numéro d'option DHCP transmet l'adresse du serveur DNS aux postes ?", a: ["6", "option 6"], ph: "un nombre", exp: "L'option 6 (domain-name-servers) relie DHCP et DNS." },
    { type: "vf", q: "Ouvrir tous les ports du pare-feu « au cas où » est une bonne pratique de sécurité.", a: false, exp: "Non : on n'ouvre que les ports utiles. Un port fermé ne peut pas être attaqué." },
    { type: "qcm", q: "Pour être alerté AVANT une panne matérielle, on met en place…", opts: ["Une supervision (SNMP, Nagios/Zabbix)", "Un second DHCP", "Un proxy sortant", "Un RAID 0"], a: 0, exp: "La supervision surveille et alerte avant la panne." },
    { type: "input", q: "Quelle règle de sauvegarde recommande 3 copies, 2 supports, 1 hors site ?", a: ["3-2-1", "321", "règle 3-2-1", "regle 3-2-1"], ph: "des chiffres", exp: "La règle 3-2-1 sécurise les sauvegardes contre les sinistres." },
    { type: "qcm", q: "Pourquoi placer les serveurs hors de la plage DHCP dynamique ?", opts: ["Pour aller plus vite", "Pour que leur IP reste fixe et que leurs noms pointent toujours juste", "Pour économiser l'électricité", "Pour désactiver le DNS"], a: 1, exp: "Une IP fixe évite que les noms DNS pointent vers le vide." }
  ],
  final: {
    title: "Exercice final — Valider le plan d'Atelier Nord",
    intro: `<p>Voici le plan proposé pour Atelier Nord (réseau 192.168.10.0/24) : DHCP en .5, DNS en .10, web en .20, plage postes .100-.200, administration en SSH. Vérifie sa cohérence et sa sécurité.</p>`,
    questions: [
      { type: "qcm", q: "Le serveur web est en 192.168.10.20. Est-ce cohérent avec la plage DHCP .100-.200 ?", opts: ["Non, il devrait être dans la plage", "Oui : les serveurs ont une IP fixe HORS de la plage dynamique", "Peu importe l'adresse", "Il faut le mettre en .150"], a: 1, exp: "Un serveur a une IP fixe, exclue de la plage distribuée aux postes." },
      { type: "input", q: "Quelle adresse DNS le DHCP doit-il distribuer aux postes (option 6) ?", a: ["192.168.10.10"], ph: "une IP", exp: "Le DNS est en 192.168.10.10 : c'est ce que transmet l'option 6." },
      { type: "qcm", q: "Pour sécuriser l'accès SSH des administrateurs, on choisit…", opts: ["root autorisé + mot de passe simple", "Clés SSH + PermitRootLogin no", "Aucune authentification", "Telnet à la place"], a: 1, exp: "Clés SSH et interdiction de root réduisent nettement le risque." },
      { type: "vf", q: "On n'ouvre au pare-feu que les ports utiles : 67/68, 53, 80/443 et 22.", a: true, exp: "Oui : principe du moindre privilège ; le reste est fermé." },
      { type: "qcm", q: "Pour se remettre d'une panne (perte de données bornée + délai de reprise), on prévoit…", opts: ["Rien, le RAID suffit", "Sauvegarde 3-2-1 + objectifs RPO/RTO définis", "Un seul serveur sans copie", "Uniquement un proxy"], a: 1, exp: "Sauvegarde 3-2-1 et RPO/RTO chiffrent et garantissent la reprise." }
    ],
    solution: `<pre class="pseudo"># PLAN VALIDE - Atelier Nord (192.168.10.0/24) :
Serveurs IP FIXE hors plage : DHCP .5 | DNS .10 | WEB .20
Postes : plage DHCP .100-.200 (IP dynamique + DNS=192.168.10.10 via option 6)
Cooperation : DHCP -> IP+DNS | DNS -> noms | WEB -> intranet | SSH -> admin
Ports ouverts (et RIEN d'autre) : 67/68, 53, 80/443, 22
Securite : SSH par cles + PermitRootLogin no | pare-feu moindre privilege
           logs /var/log | supervision SNMP | sauvegarde 3-2-1 (RPO/RTO)</pre>
<p>Le plan tient debout : chaque service à sa place, IP fixes pour les serveurs, ports filtrés, accès chiffré et reprise prévue. Tu sais désormais concevoir, déployer et sécuriser l'infrastructure d'une petite entreprise. Bravo, c'est la fin du parcours.</p>`
  }
};
</script>
