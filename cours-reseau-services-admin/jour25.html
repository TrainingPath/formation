  title: "Le proxy et le reverse proxy",
  subtitle: "Un intermédiaire qui parle à ta place, ou qui répond à ta place.",
  theory: `
<h3>1. Un intermédiaire sur le chemin</h3>
<p>Un <strong>proxy</strong> (mot anglais qui signifie « mandataire », « celui qui agit à la place d'un autre ») est un serveur qui se place <em>entre</em> un client et une destination. Au lieu de parler directement au serveur final, le client parle au proxy, et le proxy relaie la demande. C'est comme un concierge d'hôtel : tu ne cours pas toi-même chercher un taxi, tu le demandes au concierge qui s'en occupe et te rapporte le résultat.</p>
<p>Il existe deux familles très différentes selon le <em>sens</em> dans lequel travaille l'intermédiaire : le <strong>proxy sortant</strong> (proxy direct, en anglais <em>forward proxy</em>) et le <strong>reverse proxy</strong> (proxy inverse). Confondre les deux est l'erreur classique du débutant.</p>
<h3>2. Le proxy sortant (forward proxy)</h3>
<p>Le proxy sortant agit <strong>au nom des clients internes</strong> qui veulent sortir vers Internet. Dans une entreprise, tous les postes passent par lui pour accéder au web. Le serveur distant (par exemple un site) voit alors l'adresse IP du proxy, pas celle du poste. Cela sert à <strong>filtrer</strong> (bloquer certains sites), à <strong>journaliser</strong> qui accède à quoi, et à <strong>mettre en cache</strong> les pages populaires pour économiser la bande passante.</p>
<pre class="pseudo"># Sens du proxy SORTANT : de l'intérieur vers l'extérieur
[Postes internes] --&gt; [Proxy sortant] --&gt; [Internet]
# Le site distant voit l'IP du proxy, pas celle du poste.
# Cote client, on configure le navigateur : Proxy = 10.0.0.1:3128 (ex. Squid)</pre>
<h3>3. Le reverse proxy (proxy entrant)</h3>
<p>Le <strong>reverse proxy</strong> travaille dans l'autre sens : il agit <strong>au nom des serveurs</strong>. Placé <em>devant</em> tes serveurs web, il reçoit les requêtes venues d'Internet et décide vers quel serveur interne les envoyer. Le visiteur ne connaît que le reverse proxy ; il ignore combien de serveurs se cachent derrière. Les logiciels les plus courants sont <strong>nginx</strong> et <strong>Apache</strong> (module mod_proxy), ainsi que HAProxy et Traefik.</p>
<pre class="pseudo"># Sens du reverse proxy : de l'extérieur vers tes serveurs
[Internet] --&gt; [Reverse proxy nginx] --&gt; [Serveur web 1]
                                     \--&gt; [Serveur web 2]
                                     \--&gt; [Serveur web 3]
# Le visiteur ne voit qu'une seule adresse : celle du reverse proxy.</pre>
<h3>4. Cache et répartition de charge</h3>
<p>Le reverse proxy rend deux grands services. Le <strong>cache</strong> : il garde en mémoire les réponses fréquentes (images, pages) et les ressert sans déranger le serveur du fond, ce qui accélère et soulage. La <strong>répartition de charge</strong> (en anglais <em>load balancing</em>) : quand plusieurs serveurs identiques existent, il distribue les visiteurs entre eux (par exemple à tour de rôle, méthode <em>round-robin</em>) pour qu'aucun ne sature. Il peut aussi gérer le <strong>HTTPS</strong> à leur place (terminaison TLS), ce qui centralise les certificats.</p>
<div class="tip">Moyen mnémotechnique : le proxy <strong>sortant</strong> protège et sert les <strong>clients</strong> ; le reverse proxy protège et sert les <strong>serveurs</strong>. « Reverse » = sens inversé.</div>
<div class="warn">Un reverse proxy masque l'adresse réelle des serveurs du fond. Si tu oublies de transmettre l'en-tête <code>X-Forwarded-For</code>, tes serveurs verront tous les visiteurs comme venant du proxy, et tes logs perdront la vraie IP des clients.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># PROXY SORTANT (forward) : agit pour les CLIENTS internes
#   -&gt; filtrage, journalisation, cache de sortie (ex. Squid)
# REVERSE PROXY : agit pour les SERVEURS, face a Internet
#   -&gt; cache, repartition de charge, terminaison HTTPS (nginx / Apache)
# Regle : forward = sortie des clients | reverse = entree vers serveurs</pre>`,

    { type: "vf", q: "Le reverse proxy peut mettre en cache les réponses fréquentes pour soulager les serveurs du fond.", a: true, exp: "Oui : le cache ressert les contenus populaires sans déranger le serveur." },

    { type: "input", q: "Nom du proxy « inversé » placé DEVANT les serveurs (2 mots, anglais accepté) ?", a: ["reverse proxy", "proxy inverse", "reverse-proxy"], ph: "en anglais", exp: "Le reverse proxy fait face à Internet pour le compte des serveurs." },
    { type: "qcm", q: "La méthode qui distribue les requêtes « à tour de rôle » s'appelle…", opts: ["Round-robin", "Broadcast", "Multicast", "Spanning-tree"], a: 0, exp: "Round-robin : chaque serveur reçoit une requête chacun son tour." },
    { type: "vf", q: "Proxy sortant et reverse proxy sont exactement la même chose.", a: false, exp: "Non : le sens diffère. Forward sert les clients, reverse sert les serveurs." },
    { type: "qcm", q: "Que centralise souvent un reverse proxy pour ses serveurs ?", opts: ["L'attribution des adresses IP internes", "Le HTTPS / la terminaison TLS et les certificats", "La résolution des noms de domaine", "Le routage des paquets entre sous-réseaux"], a: 1, exp: "Il gère le chiffrement HTTPS à la place des serveurs (terminaison TLS)." },
    { type: "input", q: "Quel en-tête HTTP transmet la vraie IP du client à travers un reverse proxy ?", a: ["x-forwarded-for", "xforwardedfor"], ph: "X-...", exp: "X-Forwarded-For conserve l'adresse d'origine du visiteur dans les logs." },
    { type: "qcm", q: "Un logiciel de proxy sortant / cache web bien connu sous Linux ?", opts: ["Squid", "MySQL", "Bind", "Postfix"], a: 0, exp: "Squid est un proxy-cache sortant très utilisé." },
    { type: "vf", q: "Depuis Internet, un visiteur voit combien de serveurs se cachent derrière un reverse proxy.", a: false, exp: "Non : il ne voit que le reverse proxy ; le nombre réel lui est masqué." }
  ],
  final: {
    title: "Exercice final — Une boutique en ligne qui grossit",
    intro: `<p>La boutique « Mercado » reçoit de plus en plus de visiteurs. On installe un <strong>nginx</strong> en frontal, devant trois serveurs web identiques, et un <strong>Squid</strong> pour l'accès Internet des employés. Nomme et explique chaque pièce.</p>`,
    questions: [
      { type: "qcm", q: "Le nginx placé devant les trois serveurs web est un…", opts: ["Proxy sortant", "Reverse proxy", "Serveur DNS", "Client"], a: 1, exp: "Face à Internet, devant les serveurs : c'est un reverse proxy." },
      { type: "qcm", q: "Le Squid par lequel passent les employés pour aller sur le web est un…", opts: ["Reverse proxy", "Proxy sortant (forward)", "Pare-feu", "Commutateur"], a: 1, exp: "Il représente les clients internes vers l'extérieur : proxy sortant." },
      { type: "input", q: "Comment appelle-t-on la fonction de nginx qui répartit les visiteurs entre les trois serveurs ?", a: ["répartition de charge", "repartition de charge", "load balancing", "équilibrage de charge", "equilibrage de charge"], ph: "2 mots", exp: "La répartition de charge (load balancing) équilibre le trafic." },
      { type: "vf", q: "Les visiteurs de Mercado connaissent l'adresse IP de chacun des trois serveurs du fond.", a: false, exp: "Non : ils ne voient que le reverse proxy nginx." },
      { type: "qcm", q: "Pour que les logs des serveurs gardent la vraie IP des clients, nginx doit transmettre…", opts: ["Le nom DNS", "L'en-tête X-Forwarded-For", "Le port 22", "L'adresse MAC"], a: 1, exp: "X-Forwarded-For véhicule l'IP d'origine à travers le proxy." }
    ],
    solution: `<pre class="pseudo"># Deux intermediaires, deux sens opposes :
Squid  = proxy SORTANT   -&gt; sert les employes vers Internet (filtre + cache)
nginx  = REVERSE proxy   -&gt; sert les serveurs face aux visiteurs
         + repartition de charge (round-robin) entre 3 serveurs
         + cache des reponses + HTTPS centralise
# Pense a X-Forwarded-For pour garder la vraie IP dans les logs.</pre>
<p>La boutique tient la charge, filtre ses employés et masque son architecture interne. Demain : garder une trace de tout ce qui se passe grâce aux journaux.</p>`
  }
};
