  title: "Introduction à la supervision (SNMP)",
  subtitle: "Prendre le pouls des machines à distance, avant qu'elles ne tombent.",
  theory: `
<h3>1. Superviser, c'est surveiller en continu</h3>
<p>La <strong>supervision</strong> (en anglais <em>monitoring</em>) consiste à surveiller en permanence l'état des équipements : un routeur est-il en vie ? un disque est-il plein ? un lien est-il saturé ? Plutôt que d'attendre l'appel furieux d'un utilisateur, l'administrateur veut être prévenu <em>avant</em> la panne. C'est le tableau de bord d'une voiture : température, essence, régime — on lit l'état d'un coup d'œil, et un voyant s'allume avant la casse.</p>
<p>Pour lire à distance l'état de centaines d'équipements de marques différentes, il faut un <strong>langage commun</strong>. Ce langage, c'est <strong>SNMP</strong> (« Simple Network Management Protocol »), la norme historique de la supervision réseau.</p>
<h3>2. Agents et managers</h3>
<p>SNMP répartit les rôles en deux camps. Sur chaque équipement surveillé tourne un petit logiciel, l'<strong>agent</strong> (en anglais <em>agent</em>) : il connaît l'état local de sa machine (trafic des interfaces, charge, température). En face, une station de supervision, le <strong>manager</strong> (le superviseur), interroge les agents et rassemble les réponses. Le manager <em>demande</em> (opération <code>GET</code>), l'agent <em>répond</em>. L'agent peut aussi, de lui-même, envoyer une alerte spontanée appelée <strong>trap</strong> (« piège / alarme ») quand un événement grave survient.</p>
<pre class="pseudo"># Le dialogue SNMP :
[Manager / superviseur]  --GET-->  [Agent sur le routeur]
[Manager]                <-reponse- [Agent]
[Agent]  --TRAP (alerte spontanee)-->  [Manager]
# Ports : agent en UDP 161 (requetes), traps en UDP 162</pre>
<h3>3. MIB et OID : nommer chaque information</h3>
<p>Pour que manager et agent se comprennent, chaque information mesurable porte un identifiant unique. La <strong>MIB</strong> (« Management Information Base ») est le <em>dictionnaire</em> : un catalogue arborescent qui décrit toutes les données disponibles (interfaces, uptime, mémoire...). Chaque entrée du dictionnaire a une adresse numérique, l'<strong>OID</strong> (« Object IDentifier »), écrite en nombres séparés par des points, comme une adresse postale hiérarchique.</p>
<pre class="pseudo"># Un OID ressemble a une adresse en pointille :
1.3.6.1.2.1.1.3.0   =  sysUpTime  (depuis quand l'appareil tourne)
1.3.6.1.2.1.1.5.0   =  sysName    (nom de l'appareil)
# La MIB est le dictionnaire qui traduit ces chiffres en noms lisibles.
# Exemple de lecture :  snmpget -v2c -c public 10.0.0.1 sysName.0</pre>
<h3>4. Les outils : Nagios, Zabbix, et les seuils</h3>
<p>Autour de SNMP, des logiciels de supervision offrent des tableaux de bord, des graphiques et des alertes. Les plus connus sont <strong>Nagios</strong> et <strong>Zabbix</strong> (aussi Centreon, PRTG, Cacti). On y définit des <strong>seuils</strong> : par exemple « alerte si le disque dépasse 90 % » ou « critique si le serveur ne répond plus ». Quand un seuil est franchi, le superviseur prévient (courriel, SMS, message) pour agir tôt.</p>
<div class="tip">Deux façons de savoir : le manager qui <em>interroge</em> régulièrement (polling, par GET) et l'agent qui <em>alerte</em> tout seul en cas d'urgence (trap). Les deux se complètent : l'un mesure, l'autre crie.</div>
<div class="warn">SNMP v1 et v2c protègent l'accès par une simple « community string » (souvent <code>public</code>), transmise en clair : c'est très faible. Sur un vrai réseau, préfère <strong>SNMPv3</strong>, qui ajoute authentification et chiffrement.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SUPERVISION = surveiller en continu pour agir AVANT la panne
# SNMP : agent (sur l'equipement) <-> manager (station qui interroge)
#   GET = le manager demande | TRAP = l'agent alerte spontanement
#   Ports : UDP 161 (requetes) et UDP 162 (traps)
# MIB = dictionnaire des donnees | OID = adresse numerique d'une donnee
# Outils : Nagios, Zabbix + seuils d'alerte | Securite : SNMPv3</pre>`,

    { type: "qcm", q: "Que représente la MIB ?", opts: ["Le protocole de transport des requêtes SNMP", "Le dictionnaire décrivant les données disponibles", "La communauté (community string) d'accès à l'agent", "Une adresse IP"], a: 1, exp: "La MIB (Management Information Base) catalogue les objets mesurables." },
    { type: "qcm", q: "Que représente un OID ?", opts: ["Un identifiant numérique unique d'une donnée, en nombres pointés", "Le nom de la communauté SNMP utilisée", "Un port physique", "Une adresse MAC"], a: 0, exp: "L'OID (Object IDentifier) adresse une donnée précise, ex. 1.3.6.1.2.1.1.5.0." },
    { type: "qcm", q: "Sur quel port UDP l'agent SNMP reçoit-il les requêtes ?", opts: ["22", "53", "161", "443"], a: 2, exp: "Les requêtes SNMP arrivent sur UDP 161 (les traps sur 162)." },
    { type: "input", q: "Sur quel port UDP sont envoyés les traps SNMP ?", a: ["162"], ph: "un nombre", exp: "Les traps (alertes) utilisent UDP 162." },
    { type: "qcm", q: "Deux logiciels de supervision très connus ?", opts: ["Apache et MySQL", "Nagios et Zabbix", "Bash et PowerShell", "Squid et Bind"], a: 1, exp: "Nagios et Zabbix sont des solutions de supervision de référence." },
    { type: "vf", q: "On définit des seuils (ex. alerte si disque > 90 %) pour être prévenu tôt.", a: true, exp: "Oui : franchir un seuil déclenche une notification (mail, SMS...)." },
    { type: "vf", q: "La community string « public » de SNMPv2c est un moyen d'authentification robuste et chiffré.", a: false, exp: "Non : elle circule en clair. Pour la sécurité, on utilise SNMPv3." },
    { type: "qcm", q: "Quelle version de SNMP ajoute authentification ET chiffrement ?", opts: ["SNMPv1", "SNMPv2c", "SNMPv3", "SNMPv0"], a: 2, exp: "SNMPv3 apporte l'authentification et le chiffrement." },
    { type: "input", q: "Comment nomme-t-on (en français) le fait que le manager interroge régulièrement les agents ?", a: ["interrogation", "polling", "l'interrogation", "scrutation", "sondage"], ph: "un mot", exp: "Le polling (interrogation régulière) mesure l'état à intervalles fixes." }
  ],
  final: {
    title: "Exercice final — Mettre le datacenter sous surveillance",
    intro: `<p>Une PME veut surveiller ses routeurs et serveurs. On installe <strong>Zabbix</strong> comme station de supervision, on active un <strong>agent SNMP</strong> sur chaque équipement, et on définit des seuils d'alerte. Réponds aux questions de mise en place.</p>`,
    questions: [
      { type: "qcm", q: "Zabbix, qui interroge les équipements, joue le rôle de…", opts: ["Agent", "Manager (superviseur)", "Routeur", "Client DHCP"], a: 1, exp: "La station qui interroge et centralise est le manager." },
      { type: "qcm", q: "Le logiciel activé sur chaque routeur pour répondre aux requêtes est…", opts: ["Le manager", "L'agent SNMP", "Le reverse proxy", "Le pare-feu"], a: 1, exp: "L'agent réside sur l'équipement et répond aux GET." },
      { type: "input", q: "Comment appelle-t-on le dictionnaire qui décrit les données disponibles (uptime, interfaces...) ?", a: ["mib", "la mib"], ph: "3 lettres", exp: "La MIB est le catalogue des objets mesurables." },
      { type: "vf", q: "Si un routeur tombe brutalement, il peut prévenir Zabbix par un trap (UDP 162).", a: true, exp: "Oui : le trap est une alerte spontanée émise par l'agent." },
      { type: "qcm", q: "Pour sécuriser la supervision sur ce réseau, on choisit…", opts: ["SNMPv1 avec community public", "SNMPv2c avec community public", "SNMPv3 (authentification + chiffrement)", "Aucune sécurité"], a: 2, exp: "SNMPv3 protège les échanges, contrairement aux community strings en clair." }
    ],
    solution: `<pre class="pseudo"># Architecture de supervision SNMP :
Zabbix (MANAGER)  --GET UDP161-->  Agents sur routeurs/serveurs
Agents  --TRAP UDP162-->  Zabbix   (alertes spontanees)
MIB = dictionnaire des donnees | OID = adresse d'une donnee
Seuils : disque > 90% = alerte | equipement muet = critique
Securite : SNMPv3 (auth + chiffrement), pas de community "public".</pre>
<p>La PME voit désormais l'état de son réseau en temps réel et reçoit l'alerte avant la panne. Demain : que faire quand malgré tout un composant lâche — sauvegarde et haute disponibilité.</p>`
  }
};
