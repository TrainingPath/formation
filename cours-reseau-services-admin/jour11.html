<script>
var DAY = {
  num: 11,
  title: "Serveurs racine, TLD et autoritatifs",
  subtitle: "L'arbre mondial des noms : 13 racines, des TLD et la magie de la délégation.",
  theory: `
<h3>1. Le DNS est un arbre inversé</h3>
<p>Tous les noms de domaine forment un immense <strong>arbre</strong> dont le sommet est la <strong>racine</strong> (en anglais <em>root</em>). Sous la racine se trouvent les <strong>TLD</strong> (« Top-Level Domain », domaines de premier niveau) : <em>.com</em>, <em>.org</em>, <em>.fr</em>, <em>.be</em>… Sous chaque TLD, les domaines de deuxième niveau (<em>exemple.com</em>), puis les sous-domaines (<em>www.exemple.com</em>). On lit un nom de la <strong>droite vers la gauche</strong> : le plus général à droite, le plus précis à gauche.</p>
<pre class="pseudo">                 . (racine)
        ┌────────┼────────┐
      .com      .fr      .org        &lt;- TLD
        │
    exemple.com                      &lt;- domaine
        │
  www.exemple.com                    &lt;- sous-domaine (hote)</pre>
<h3>2. Le point final et les serveurs racine</h3>
<p>Un nom pleinement qualifié se termine techniquement par un point : <em>www.exemple.com.</em> Ce point représente la racine. La racine est gérée par les <strong>serveurs racine</strong> : il existe <strong>13 « identités » de serveurs racine</strong>, nommées par les lettres <strong>A à M</strong> (a.root-servers.net … m.root-servers.net). Attention : ce ne sont pas 13 machines uniques, mais 13 adresses derrière lesquelles se cachent des centaines de serveurs répartis dans le monde grâce à une technique appelée <em>anycast</em>.</p>
<div class="tip">Pourquoi seulement 13 ? Historiquement, pour que la liste des adresses des serveurs racine tienne dans un seul paquet DNS. Ce chiffre est resté, mais chaque lettre est aujourd'hui dupliquée sur de nombreux sites physiques.</div>
<h3>3. Les serveurs TLD</h3>
<p>Chaque TLD a ses propres serveurs autoritatifs. Les serveurs de <em>.com</em> ne connaissent pas l'adresse de <em>www.exemple.com</em>, mais ils savent <strong>quels serveurs gèrent exemple.com</strong>. Ils jouent le rôle d'aiguilleurs vers le niveau inférieur. Les TLD sont administrés par des organismes appelés <strong>registres</strong> (par exemple l'Afnic pour le .fr).</p>
<h3>4. La délégation : chacun son morceau</h3>
<p>Le principe génial du DNS est la <strong>délégation</strong> : personne ne connaît tout, chaque serveur connaît seulement son niveau et sait vers qui déléguer le reste. La racine délègue aux TLD, les TLD délèguent aux domaines, et ainsi de suite. Cette délégation s'exprime par des enregistrements <strong>NS</strong> (« Name Server ») qui pointent vers les serveurs responsables de la zone du dessous.</p>
<pre class="pseudo"># Dans la zone .com, une delegation ressemble a :
exemple.com.   IN  NS  ns1.exemple.com.
exemple.com.   IN  NS  ns2.exemple.com.
# => "pour exemple.com, va interroger ns1 et ns2"</pre>
<h3>5. Les serveurs autoritatifs</h3>
<p>Au bout de la chaîne, le <strong>serveur autoritatif</strong> détient les vrais enregistrements de la zone (A, AAAA, MX, TXT…). C'est la source officielle : sa réponse fait <em>autorité</em>. Un domaine a généralement au moins deux serveurs autoritatifs (un maître et un esclave) pour la fiabilité.</p>
<div class="warn">Ne confonds pas resolver et serveur autoritatif. Le resolver enquête et met en cache pour les clients ; le serveur autoritatif détient la donnée d'origine et ne fait, lui, aucune enquête pour toi.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Arbre DNS : RACINE -> TLD (.com, .fr) -> DOMAINE -> HOTE
# On lit un nom de DROITE (general) a GAUCHE (precis)
# 13 identites de serveurs racine : lettres A a M (anycast mondial)
# TLD = geres par des registres ; ils aiguillent vers les domaines
# Delegation = enregistrements NS pointant vers le niveau du dessous
# Autoritatif = source officielle des enregistrements d'une zone</pre>`,
  exercises: [
    { type: "qcm", q: "Combien y a-t-il d'identités de serveurs racine ?", opts: ["7", "13", "26", "256"], a: 1, exp: "13 identités, nommées de A à M (a.root-servers.net à m.root-servers.net)." },
    { type: "qcm", q: "Comment sont nommés les serveurs racine ?", opts: ["Par des chiffres 1 à 13", "Par les lettres A à M", "Par des noms de villes", "Par des couleurs"], a: 1, exp: "Les lettres A à M, soit 13 identités." },
    { type: "qcm", q: "Que signifie TLD ?", opts: ["Total Link Data", "Top-Level Domain (domaine de premier niveau)", "Transfer Layer Domain", "Time Live Domain"], a: 1, exp: "TLD = Top-Level Domain : .com, .fr, .org…" },
    { type: "qcm", q: "Comment lit-on un nom de domaine ?", opts: ["De gauche (général) à droite (précis)", "De droite (général) à gauche (précis)", "Dans un ordre aléatoire", "Du milieu vers les extrémités"], a: 1, exp: "Le plus général est à droite (la racine), le plus précis à gauche." },
    { type: "qcm", q: "Un serveur du TLD .com connaît…", opts: ["L'IP exacte de www.exemple.com", "Quels serveurs gèrent exemple.com", "Le contenu du site", "Le cache du client"], a: 1, exp: "Le TLD aiguille vers les serveurs autoritatifs du domaine, sans connaître l'IP finale." },
    { type: "qcm", q: "Quel enregistrement exprime une délégation vers le niveau inférieur ?", opts: ["A", "MX", "NS", "TXT"], a: 2, exp: "Les enregistrements NS pointent vers les serveurs responsables de la zone déléguée." },
    { type: "vf", q: "Les 13 serveurs racine sont exactement 13 machines physiques dans le monde.", a: false, exp: "Faux : 13 identités (adresses), mais des centaines de machines via anycast." },
    { type: "vf", q: "Dans la délégation, chaque serveur connaît seulement son niveau et renvoie vers le suivant.", a: true, exp: "Vrai : c'est le principe de la délégation, personne ne connaît tout." },
    { type: "vf", q: "Un serveur autoritatif détient la source officielle des enregistrements d'une zone.", a: true, exp: "Vrai : sa réponse fait autorité, c'est la donnée d'origine." },
    { type: "vf", q: "Le point final dans www.exemple.com. représente la racine.", a: true, exp: "Vrai : ce point est la racine de l'arbre DNS." },
    { type: "input", q: "Quelle lettre nomme le premier serveur racine ?", a: ["a", "a.root-servers.net"], ph: "1 lettre", exp: "Le serveur A (a.root-servers.net)." },
    { type: "input", q: "Quelle lettre nomme le dernier des serveurs racine ?", a: ["m", "m.root-servers.net"], ph: "1 lettre", exp: "Le serveur M, treizième identité." },
    { type: "input", q: "Comment appelle-t-on le mécanisme où chaque serveur renvoie vers le niveau du dessous ?", a: ["la delegation", "delegation"], ph: "un mot", exp: "La délégation, exprimée par des enregistrements NS." },
    { type: "input", q: "Quel type d'enregistrement (sigle) sert à déléguer une zone ?", a: ["ns"], ph: "2 lettres", exp: "NS = Name Server." },
    { type: "input", q: "Quel niveau de l'arbre est interrogé en tout premier ?", a: ["la racine", "racine", "root"], ph: "un mot", exp: "La racine, au sommet de l'arbre." }
  ],
  final: {
    title: "Exercice final — Remonter l'arbre pour dns-lab.org",
    intro: `<p>Une association enregistre le domaine <code>dns-lab.org</code>. Un administrateur veut comprendre qui gère quoi entre la racine, le TLD .org et ses propres serveurs. Aidons-le à situer chaque acteur.</p>`,
    questions: [
      { type: "qcm", q: "Le sommet de l'arbre, interrogé en premier, est…", opts: ["Le serveur .org", "La racine (serveurs A à M)", "ns1.dns-lab.org", "Le resolver"], a: 1, exp: "La racine est le sommet, gérée par les serveurs A à M." },
      { type: "qcm", q: "La racine renvoie le resolver vers…", opts: ["Les serveurs du TLD .org", "L'IP finale", "Le serveur mail", "Le client"], a: 0, exp: "La racine délègue vers les serveurs du TLD .org." },
      { type: "input", q: "Le serveur du TLD .org indique quels serveurs gèrent dns-lab.org grâce à quel type d'enregistrement (sigle) ?", a: ["ns"], ph: "2 lettres", exp: "Des enregistrements NS de délégation." },
      { type: "qcm", q: "Les vrais enregistrements A/MX de dns-lab.org se trouvent sur…", opts: ["La racine", "Le TLD .org", "Les serveurs autoritatifs de dns-lab.org", "Le resolver public"], a: 2, exp: "Les serveurs autoritatifs du domaine détiennent la donnée officielle." },
      { type: "vf", q: "Il est recommandé d'avoir au moins deux serveurs autoritatifs pour dns-lab.org.", a: true, exp: "Vrai : redondance (maître + esclave) pour la fiabilité." }
    ],
    solution: `<pre class="pseudo"># Remontee de l'arbre pour dns-lab.org :
RACINE (A..M)  -> "va voir le TLD .org"
TLD .org       -> NS : "dns-lab.org est gere par ns1/ns2.dns-lab.org"
AUTORITATIFS   -> detiennent A, AAAA, MX, TXT de dns-lab.org (source officielle)
# Recommande : >= 2 serveurs autoritatifs (maitre + esclave)</pre>
<p>Chaque niveau ne connaît que le suivant : c'est la délégation qui fait tenir tout l'Internet des noms. Demain : comment le cache et le TTL accélèrent (et parfois ralentissent) ce système.</p>`
  }
};
</script>
