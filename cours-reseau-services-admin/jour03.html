<script>
var DAY = {
  num: 3,
  title: "Le fonctionnement du DHCP",
  subtitle: "Quatre messages, une adresse : Discover, Offer, Request, Ack.",
  theory: `
<h3>1. Un dialogue en quatre temps : DORA</h3>
<p>Quand une machine se branche, elle n'a pas encore d'adresse IP : elle ne peut donc pas « appeler » directement un serveur qu'elle ne connaît pas. Le DHCP résout ce paradoxe avec un échange en quatre messages, résumé par l'acronyme <strong>DORA</strong> : <strong>D</strong>iscover, <strong>O</strong>ffer, <strong>R</strong>equest, <strong>A</strong>ck (acknowledge). Retiens-le comme le prénom « Dora » : c'est la clé de tout le protocole.</p>
<pre class="pseudo"># Les 4 etapes DORA
CLIENT  --- 1. DHCPDISCOVER --->  (broadcast : y a-t-il un serveur DHCP ?)
CLIENT  &lt;-- 2. DHCPOFFER ------  SERVEUR (je te propose 192.168.1.42)
CLIENT  --- 3. DHCPREQUEST --->  (broadcast : j'accepte cette offre)
CLIENT  &lt;-- 4. DHCPACK --------  SERVEUR (c'est valide, l'adresse est a toi)</pre>
<h3>2. Discover — « Y a-t-il un serveur ? »</h3>
<p>Le client n'a pas d'adresse et ne connaît aucun serveur. Il envoie donc un <strong>DHCPDISCOVER</strong> en <strong>diffusion générale</strong> (en anglais <em>broadcast</em>), c'est-à-dire à toutes les machines du réseau local (destination 255.255.255.255). C'est une bouteille à la mer : « Est-ce qu'un serveur DHCP m'entend ? ». Comme il n'a pas encore d'IP source, il utilise 0.0.0.0 comme adresse d'origine.</p>
<h3>3. Offer — « Voici une proposition »</h3>
<p>Chaque serveur DHCP qui entend le Discover répond par un <strong>DHCPOFFER</strong> : il propose une adresse libre de sa plage, avec le masque, la passerelle, le DNS et la durée du bail. S'il y a plusieurs serveurs, le client peut recevoir plusieurs offres ; il en choisit une (en général la première arrivée).</p>
<h3>4. Request — « Je choisis celle-ci »</h3>
<p>Le client répond par un <strong>DHCPREQUEST</strong>, lui aussi en broadcast. Pourquoi en diffusion, alors qu'il a choisi un serveur ? Pour prévenir les <strong>autres</strong> serveurs que leur offre n'est pas retenue (ils peuvent reprendre l'adresse proposée). Le Request désigne explicitement le serveur choisi et l'adresse demandée.</p>
<h3>5. Ack — « C'est officiel »</h3>
<p>Le serveur choisi confirme par un <strong>DHCPACK</strong> (acknowledge, « accusé de réception ») : l'adresse est désormais attribuée au client pour la durée du bail. Le client configure alors son interface avec ces paramètres. En cas de problème (adresse déjà prise entre-temps), le serveur envoie à la place un <strong>DHCPNAK</strong> (refus), et le client recommence à Discover.</p>
<div class="tip">Les ports du DHCP : le <strong>serveur écoute sur le port 67</strong>, le <strong>client sur le port 68</strong>, tous deux en <strong>UDP</strong>. Moyen mnémotechnique : 67 pour le serveur (le plus « grand » attend), 68 pour le client.</div>
<div class="warn">Les échanges DORA reposent sur le broadcast, qui ne franchit pas les routeurs. Sur un réseau segmenté, on utilise un <strong>relais DHCP</strong> (DHCP relay / ip helper) pour transporter les demandes jusqu'au serveur situé ailleurs. Sans relais, un client d'un autre sous-réseau ne trouverait aucun serveur.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DORA : Discover -> Offer -> Request -> Ack
# Discover  : client en broadcast (0.0.0.0 -> 255.255.255.255)
# Offer     : serveur propose une adresse + parametres
# Request   : client accepte (broadcast, previent les autres serveurs)
# Ack       : serveur confirme (DHCPNAK = refus)
# Ports : serveur 67, client 68, en UDP</pre>`,
  exercises: [
    { type: "input", q: "Que signifie l'acronyme DORA (les quatre étapes du DHCP, en anglais) ?", a: ["discover offer request ack", "discover, offer, request, ack", "discover offer request acknowledge", "discover-offer-request-ack"], ph: "quatre mots", exp: "DORA = Discover, Offer, Request, Ack (acknowledge)." },
    { type: "qcm", q: "Quelle est la PREMIÈRE étape, envoyée par le client ?", opts: ["DHCPOFFER", "DHCPDISCOVER", "DHCPACK", "DHCPREQUEST"], a: 1, exp: "Le client démarre par un DHCPDISCOVER (il cherche un serveur)." },
    { type: "qcm", q: "Le DHCPDISCOVER est envoyé en…", opts: ["Unicast vers le serveur", "Broadcast (diffusion générale) à tout le réseau local", "Multicast vers un routeur", "Courriel"], a: 1, exp: "Le client ne connaît pas de serveur : il diffuse en broadcast (255.255.255.255)." },
    { type: "input", q: "Quelle adresse IP source le client utilise-t-il dans le Discover (il n'en a pas encore) ?", a: ["0.0.0.0", "0000", "0.0.0.0/0"], ph: "une adresse", exp: "N'ayant pas encore d'IP, le client utilise 0.0.0.0 comme source." },
    { type: "qcm", q: "Que contient le DHCPOFFER envoyé par le serveur ?", opts: ["Uniquement l'adresse IP, sans les autres paramètres", "Une adresse proposée + masque + passerelle + DNS + durée du bail", "L'identifiant et le mot de passe du client", "La liste des adresses déjà attribuées"], a: 1, exp: "L'Offer propose une adresse et tous les paramètres, plus la durée du bail." },
    { type: "vf", q: "Le client peut recevoir plusieurs Offer s'il existe plusieurs serveurs DHCP.", a: true, exp: "Oui : chaque serveur qui entend le Discover peut répondre ; le client en choisit une." },
    { type: "qcm", q: "Pourquoi le DHCPREQUEST est-il aussi envoyé en broadcast ?", opts: ["Pour que le routeur transmette la demande à Internet", "Pour prévenir les autres serveurs que leur offre n'est pas retenue", "Pour aller plus vite sur Internet", "Parce que c'est obligatoire pour le DNS"], a: 1, exp: "Le Request en broadcast informe les serveurs non retenus qu'ils peuvent libérer leur offre." },
    { type: "input", q: "Quel message le serveur envoie-t-il pour CONFIRMER définitivement l'attribution (4e étape) ?", a: ["dhcpack", "ack", "dhcp ack", "acknowledge"], ph: "DHCP…", exp: "Le DHCPACK confirme : l'adresse est attribuée pour la durée du bail." },
    { type: "qcm", q: "Sur quel port le SERVEUR DHCP écoute-t-il ?", opts: ["53", "67", "68", "80"], a: 1, exp: "Le serveur DHCP écoute sur le port 67 (UDP)." },
    { type: "qcm", q: "Sur quel port le CLIENT DHCP reçoit-il les réponses ?", opts: ["67", "68", "80", "443"], a: 1, exp: "Le client DHCP utilise le port 68 (UDP)." },
    { type: "input", q: "Sur quel protocole de transport (UDP ou TCP) fonctionne le DHCP ?", a: ["udp", "en udp", "l'udp"], ph: "TCP ou UDP", exp: "Le DHCP utilise UDP (ports 67 et 68)." },
    { type: "vf", q: "Le broadcast DHCP traverse naturellement les routeurs vers d'autres sous-réseaux.", a: false, exp: "Non : le broadcast ne franchit pas les routeurs. Il faut un relais DHCP (DHCP relay)." },
    { type: "qcm", q: "Comment appelle-t-on le mécanisme qui transporte les demandes DHCP vers un serveur situé sur un autre sous-réseau ?", opts: ["Un pare-feu", "Un relais DHCP (DHCP relay / ip helper)", "Un proxy web", "Un antivirus"], a: 1, exp: "Le relais DHCP relaie les demandes broadcast vers le serveur distant." },
    { type: "vf", q: "Si l'adresse choisie n'est plus disponible, le serveur peut renvoyer un DHCPNAK et le client recommence à Discover.", a: true, exp: "Oui : DHCPNAK = refus ; le client relance la procédure depuis le début." },
    { type: "input", q: "Remets dans l'ordre les 2e et 3e étapes : après Discover vient l'____, puis le ____.", a: ["offer puis request", "offer, request", "offer request", "l'offer puis le request"], ph: "deux mots", exp: "Ordre : Discover, Offer, Request, Ack." }
  ],
  final: {
    title: "Exercice final — Suivre une capture réseau",
    intro: `<p>Tu observes un poste qui démarre. Un outil de capture affiche quatre trames DHCP dans l'ordre. Analyse cet échange.</p>`,
    questions: [
      { type: "qcm", q: "Trame 1 : source 0.0.0.0, destination 255.255.255.255, type DHCP… ?", opts: ["OFFER", "DISCOVER", "ACK", "REQUEST"], a: 1, exp: "Source 0.0.0.0 vers broadcast = DHCPDISCOVER (le client cherche un serveur)." },
      { type: "qcm", q: "Trame 2 : émise par 192.168.1.1 (le serveur) vers le client, avec une adresse proposée. C'est…", opts: ["DISCOVER", "OFFER", "REQUEST", "NAK"], a: 1, exp: "Le serveur propose une adresse : c'est le DHCPOFFER." },
      { type: "input", q: "Trame 3 : le client accepte l'offre. Quel est le nom de ce message ?", a: ["dhcprequest", "request", "dhcp request"], ph: "DHCP…", exp: "Le client répond par un DHCPREQUEST." },
      { type: "qcm", q: "Trame 4 : le serveur confirme. Sur quel port source part cette trame ?", opts: ["68", "67", "53", "80"], a: 1, exp: "Le serveur émet depuis le port 67 (le client écoute sur 68). Trame = DHCPACK." },
      { type: "vf", q: "Cette capture confirme la séquence complète Discover → Offer → Request → Ack (DORA).", a: true, exp: "Oui : les quatre trames dans cet ordre décrivent un bail obtenu avec succès." }
    ],
    solution: `<pre class="pseudo"># Lecture de la capture (DORA) :
Trame 1  DISCOVER  0.0.0.0        -> 255.255.255.255  (client cherche)
Trame 2  OFFER     192.168.1.1    -> client            (serveur propose)
Trame 3  REQUEST   client         -> 255.255.255.255  (client accepte)
Trame 4  ACK       192.168.1.1    -> client            (serveur confirme)
# Ports : serveur 67, client 68, en UDP.</pre>
<p>Tu sais lire un échange DORA. Demain : ce que le serveur inscrit quand il attribue une adresse — le bail et la réservation.</p>`
  }
};
</script>
