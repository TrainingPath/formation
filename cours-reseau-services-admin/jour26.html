  title: "La journalisation (logs)",
  subtitle: "La mémoire écrite de la machine : sans elle, on dépanne à l'aveugle.",
  theory: `
<h3>1. Pourquoi journaliser ?</h3>
<p>Un <strong>journal</strong> (en anglais <em>log</em>) est un fichier où les programmes écrivent, ligne après ligne, ce qu'ils font : « service démarré », « connexion refusée », « disque presque plein ». C'est la boîte noire d'un avion : quand quelque chose casse, on relit le journal pour comprendre <em>quoi</em>, <em>quand</em> et <em>pourquoi</em>. Sans logs, un administrateur dépanne à l'aveugle, en devinant.</p>
<p>Chaque ligne porte au minimum une <strong>date/heure</strong> (horodatage, en anglais <em>timestamp</em>), le nom du programme concerné, et un message. Beaucoup ajoutent un <strong>niveau de gravité</strong> : info, avertissement (warning), erreur (error), critique.</p>
<h3>2. syslog, la norme du journal système</h3>
<p>Sous Linux, la journalisation repose historiquement sur <strong>syslog</strong>, une norme (RFC 5424) qui définit un format de message commun. Un programme envoie son message à un <strong>collecteur</strong> (le service <em>rsyslog</em> ou <em>syslog-ng</em>) qui décide où l'écrire. Chaque message porte une <strong>facilité</strong> (<em>facility</em> : la catégorie, par exemple <code>auth</code>, <code>mail</code>, <code>kern</code>) et une <strong>sévérité</strong> (de 0 = urgence à 7 = debug). Gros avantage : syslog peut envoyer les messages <strong>par le réseau</strong> (port UDP 514) vers un serveur central qui centralise les logs de toutes les machines.</p>
<pre class="pseudo"># Un message syslog, simplifie :
Jul 27 09:14:02 srv-web sshd[1420]: Failed password for root from 10.0.0.9
#     date/heure     machine  programme(pid)  message
# Facility=auth  Severite=warning
# Envoi vers un serveur central : @192.168.1.10:514 (UDP)</pre>
<h3>3. Où vivent les logs : /var/log</h3>
<p>Sur un système Linux, les journaux sont rangés dans le répertoire <strong>/var/log</strong>. Quelques fichiers classiques : <code>/var/log/syslog</code> (messages généraux), <code>/var/log/auth.log</code> (authentifications et sudo), <code>/var/log/kern.log</code> (le noyau), <code>/var/log/apache2/</code> (le serveur web). On les lit avec des commandes texte : <code>tail -f</code> pour suivre en direct, <code>grep</code> pour filtrer un mot.</p>
<pre class="pseudo"># Suivre en direct les nouvelles lignes :
tail -f /var/log/syslog
# Chercher les echecs d'authentification :
grep "Failed password" /var/log/auth.log
# Sur les systemes recents (systemd) : journalctl
journalctl -u ssh --since "today"</pre>
<h3>4. La rotation des journaux</h3>
<p>Un journal grossit sans fin : laissé libre, il finirait par remplir le disque. La <strong>rotation</strong> (en anglais <em>log rotation</em>) résout cela. L'outil <strong>logrotate</strong> archive régulièrement le fichier courant (par exemple chaque semaine), le compresse (<code>.gz</code>), et n'en garde qu'un nombre limité avant d'effacer les plus vieux. Ainsi <code>syslog</code> devient <code>syslog.1</code>, puis <code>syslog.2.gz</code>, etc. On garde de l'historique <em>sans</em> saturer l'espace.</p>
<div class="tip">Pour un dépannage, commence toujours par la <strong>date</strong> de l'incident, puis cherche dans le bon fichier. « Quand ça a cassé ? » guide vers la bonne ligne bien plus vite que lire tout le journal.</div>
<div class="warn">Les logs contiennent souvent des données sensibles (adresses IP, noms d'utilisateur, erreurs internes). Protège leur accès et respecte les durées de conservation légales. Ne les rends jamais lisibles par tout le monde.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># LOG = fichier ou les programmes ecrivent ce qu'ils font (horodate)
# syslog  = norme du journal systeme (facility + severite), port UDP 514
# /var/log = le repertoire des journaux sous Linux (syslog, auth.log...)
# logrotate = archive + compresse + limite la taille (evite le disque plein)
# Outils : tail -f, grep, journalctl  |  Utilite : DEPANNAGE et securite</pre>`,

    { type: "qcm", q: "Quelle commande filtre les lignes contenant « Failed password » ?", opts: ["grep \"Failed password\" /var/log/auth.log", "cat /var/log/auth.log", "chmod 777 auth.log", "rm auth.log"], a: 0, exp: "grep filtre les lignes correspondant à un motif." },
    { type: "input", q: "Sur un système systemd, quelle commande consulte les journaux (au lieu de lire directement les fichiers) ?", a: ["journalctl"], ph: "une commande", exp: "journalctl interroge le journal de systemd (ex. journalctl -u ssh)." },
    { type: "vf", q: "La rotation des logs sert uniquement à les rendre plus jolis.", a: false, exp: "Non : elle limite leur taille pour ne pas saturer le disque, tout en gardant un historique." }
  ],

      { type: "input", q: "Dans quel répertoire va-t-elle chercher les journaux ?", a: ["/var/log", "var/log"], ph: "un chemin", exp: "Tous les journaux système sont dans /var/log." },
      { type: "qcm", q: "Pour repérer d'éventuelles tentatives de connexion suspectes, quel fichier ?", opts: ["/var/log/auth.log", "/var/log/mail.log", "/var/log/kern.log", "/var/log/dpkg.log"], a: 0, exp: "auth.log recense les authentifications et échecs de mot de passe." },
      { type: "vf", q: "Elle constate que /var/log est plein car aucun logrotate n'était configuré : c'est une cause plausible de panne.", a: true, exp: "Oui : un disque plein à cause de journaux non tournés peut bloquer un service." },
      { type: "qcm", q: "Que met-elle en place pour éviter que ça recommence ?", opts: ["Augmenter la taille du disque sans autre mesure", "logrotate pour archiver et limiter la taille des journaux", "Supprimer syslog", "Désactiver tous les logs"], a: 1, exp: "logrotate garde un historique borné sans saturer le disque." }
    ],
    solution: `<pre class="pseudo"># Methode de depannage par les logs :
1) Quand ? -&gt; noter l'heure de l'incident (~3h)
2) Ou ?   -&gt; cd /var/log  (syslog, auth.log, apache2/...)
3) Lire   -&gt; grep / tail -f / journalctl --since "03:00"
4) Cause  -&gt; disque plein : journaux jamais tournes
5) Fix    -&gt; configurer logrotate (archive + compresse + limite)</pre>
<p>Les journaux ont transformé un mystère en diagnostic précis. Demain : au lieu de lire après coup, on surveille en temps réel avec la supervision SNMP.</p>`
