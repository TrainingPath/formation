var DAY = {
  num: 20,
  title: "Le protocole HTTP côté serveur",
  subtitle: "Ce qui se passe entre la requête reçue et la réponse envoyée.",
  theory: `
<h3>1. L'anatomie d'une requête HTTP</h3>
<p>Quand un navigateur contacte le serveur, il envoie une <strong>requête HTTP</strong> composée de trois parties. La première ligne indique la <strong>méthode</strong> (l'action voulue), la <strong>ressource</strong> demandée et la version. Viennent ensuite les <strong>en-têtes</strong> (en anglais <em>headers</em>), des lignes « clé: valeur » qui précisent le contexte (le nom du site, le navigateur, la langue…). Enfin, un éventuel <strong>corps</strong> (en anglais <em>body</em>), utilisé surtout pour envoyer des données.</p>
<pre class="pseudo"># Une requête vue par le serveur :
GET /produits/index.html HTTP/1.1     &lt;-- méthode + ressource + version
Host: www.boutique.fr                 &lt;-- quel site (virtualhost)
User-Agent: Firefox/128.0             &lt;-- quel navigateur
Accept-Language: fr                   &lt;-- langue préférée
(ligne vide = fin des en-têtes)</pre>
<p>Les méthodes les plus courantes : <strong>GET</strong> (demander une ressource), <strong>POST</strong> (envoyer des données, par exemple un formulaire), <strong>HEAD</strong> (demander seulement les en-têtes, sans le contenu).</p>
<h3>2. Le traitement de la requête par le serveur</h3>
<p>Quand la requête arrive, Apache déroule toujours les mêmes étapes : il choisit le bon <strong>virtualhost</strong> (grâce à l'en-tête Host), traduit l'URL en un chemin de fichier dans le <strong>DocumentRoot</strong>, vérifie les <strong>permissions</strong>, puis lit le fichier (contenu statique) ou exécute un programme (contenu dynamique). Il fabrique alors une <strong>réponse</strong> et l'envoie au client.</p>
<pre class="pseudo"># Le cycle interne, simplifié :
1. Recevoir la requête (méthode, URL, en-têtes)
2. Choisir le virtualhost (en-tête Host)
3. Traduire l'URL -> fichier dans le DocumentRoot
4. Lire le fichier OU exécuter le code
5. Construire la réponse (code + en-têtes + corps)
6. Envoyer au client, puis noter la visite dans les logs</pre>
<h3>3. Les codes de réponse</h3>
<p>Toute réponse commence par un <strong>code de statut</strong> (en anglais <em>status code</em>) à trois chiffres, rangé par familles selon le premier chiffre. C'est le résumé chiffré du résultat.</p>
<pre class="pseudo"># Familles de codes HTTP :
2xx = succès       -> 200 OK (voici la ressource)
3xx = redirection  -> 301 déplacé définitivement, 302 temporaire
4xx = erreur client-> 403 interdit, 404 introuvable
5xx = erreur serveur-> 500 erreur interne, 503 service indisponible</pre>
<div class="tip">Retiens la logique : <strong>4xx = la faute vient de la demande</strong> (mauvaise URL, accès refusé) ; <strong>5xx = la faute vient du serveur</strong> (un script a planté, la machine est surchargée).</div>
<h3>4. Les journaux d'accès (logs)</h3>
<p>Chaque requête laisse une trace. Apache écrit deux journaux principaux : le <strong>journal d'accès</strong> (<em>access log</em>), une ligne par requête reçue, et le <strong>journal d'erreurs</strong> (<em>error log</em>), qui note les problèmes. Sous Debian/Ubuntu, ils se trouvent dans <strong>/var/log/apache2/</strong>.</p>
<pre class="pseudo"># /var/log/apache2/access.log  (une ligne = une requête)
203.0.113.5 - - [27/Jul/2026:10:15:03] "GET /index.html HTTP/1.1" 200 1043
#  ^IP client          ^date/heure     ^requête              ^code ^octets

# Suivre le journal en direct :
sudo tail -f /var/log/apache2/access.log</pre>
<p>Ces journaux servent à mesurer le trafic, repérer les pages en erreur (beaucoup de 404 ?), détecter des attaques et diagnostiquer les pannes.</p>
<div class="warn">Un code 200 signifie « la requête a réussi », pas « la page est correcte ». Une page d'erreur personnalisée peut être renvoyée avec un 200 par mégarde : vérifie toujours le CODE, pas seulement l'apparence.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Requête = méthode (GET/POST/HEAD) + URL + en-têtes (dont Host) + corps
# Le serveur choisit le virtualhost, traduit l'URL, lit/exécute, répond
# Codes : 2xx succès | 3xx redirection | 4xx erreur client | 5xx erreur serveur
#   200 OK  |  301/302 redirection  |  403 interdit  |  404 introuvable  |  500 serveur
# Logs Apache : /var/log/apache2/  (access.log + error.log)</pre>`,

    { type: "input", q: "Quel code à trois chiffres signifie « tout va bien, voici la ressource » ?", a: ["200", "200 ok"], ph: "un nombre", exp: "200 OK = succès, la ressource est renvoyée." },

    { type: "qcm", q: "Quelle méthode HTTP sert à envoyer des données de formulaire ?", opts: ["GET", "POST", "HEAD", "PUT"], a: 1, exp: "POST envoie des données au serveur (par exemple un formulaire)." },
    { type: "qcm", q: "Où Apache enregistre-t-il chaque requête reçue (Debian/Ubuntu) ?", opts: ["/etc/apache2/access.log", "/var/log/apache2/access.log", "/home/logs", "/tmp/http.log"], a: 1, exp: "Le journal d'accès est /var/log/apache2/access.log." },
    { type: "vf", q: "Le journal d'accès (access log) contient une ligne par requête reçue.", a: true, exp: "Oui : chaque requête produit une ligne dans access.log." },
    { type: "input", q: "Comment appelle-t-on (en anglais, deux mots) le nombre à trois chiffres qui résume le résultat d'une réponse HTTP ?", a: ["status code", "statuscode", "http status code"], ph: "terme anglais", exp: "Status code = code de statut (200, 404, 500…)." },
    { type: "qcm", q: "Que signifie un code 301 ?", opts: ["Succès", "Redirection permanente", "Erreur serveur", "Accès interdit"], a: 1, exp: "301 = Moved Permanently, redirection définitive vers une autre URL." },
    { type: "qcm", q: "Quel code indique un accès interdit (permissions) ?", opts: ["200", "301", "403", "500"], a: 2, exp: "403 = Forbidden, l'accès à la ressource est refusé." },
    { type: "vf", q: "Un code 200 garantit toujours que le contenu affiché est celui attendu.", a: false, exp: "Non : 200 = requête réussie, mais le contenu peut être une page d'erreur renvoyée par erreur." },
    { type: "input", q: "Quelle commande suit en direct le journal d'accès qui défile ?", a: ["tail -f", "tail -f /var/log/apache2/access.log", "sudo tail -f /var/log/apache2/access.log"], ph: "commande", exp: "tail -f affiche les nouvelles lignes du journal au fur et à mesure." },
    { type: "qcm", q: "Quelle est la toute première étape du serveur à la réception d'une requête name-based ?", opts: ["Lire aussitôt le fichier dans le DocumentRoot", "Choisir le virtualhost via l'en-tête Host", "Renvoyer immédiatement un code 200", "Vérifier les permissions du fichier"], a: 1, exp: "Le serveur choisit d'abord le bon virtualhost grâce à l'en-tête Host." }
  ],
  final: {
    title: "Exercice final — Lire les journaux",
    intro: `<p>Yanis administre un serveur Apache. Ce matin, les visiteurs se plaignent. Il ouvre son access.log et voit beaucoup de lignes se terminant par 404, et quelques-unes par 500. Aide-le à interpréter ce qu'il lit.</p>`,
    questions: [
      { type: "qcm", q: "Les nombreuses lignes en 404 signifient…", opts: ["Le serveur est en panne", "Des ressources demandées sont introuvables (mauvaises URL ou fichiers manquants)", "Les visiteurs n'ont pas les droits d'accès", "Le serveur redirige vers une autre page"], a: 1, exp: "404 = introuvable : liens cassés ou fichiers absents côté client." },
      { type: "qcm", q: "Les lignes en 500 indiquent plutôt…", opts: ["Une erreur côté serveur (script planté)", "Une réussite", "Une redirection", "Un accès interdit"], a: 0, exp: "500 = erreur interne du serveur, souvent un programme qui a planté." },
      { type: "input", q: "Dans quel dossier Yanis trouve-t-il ces journaux (Debian) ?", a: ["/var/log/apache2", "/var/log/apache2/", "var/log/apache2"], ph: "un chemin", exp: "Les logs Apache sont dans /var/log/apache2/." },
      { type: "vf", q: "Pour surveiller les nouvelles requêtes en temps réel, il peut utiliser tail -f.", a: true, exp: "Oui : tail -f affiche les nouvelles lignes du journal en continu." },
      { type: "input", q: "Quel code cherchera-t-il pour confirmer que certaines pages se chargent bien (succès) ?", a: ["200", "200 ok"], ph: "un nombre", exp: "200 marque les requêtes réussies." }
    ],
    solution: `<pre class="pseudo"># Diagnostic de Yanis à partir des logs :
404 (nombreux)  -> ressources introuvables : liens cassés / fichiers manquants
500 (quelques-uns) -> erreur serveur : un script plante -> voir error.log
200 -> requêtes qui réussissent normalement

# Commandes utiles :
sudo tail -f /var/log/apache2/access.log     # suivre le trafic en direct
sudo tail -f /var/log/apache2/error.log      # voir le détail des erreurs 500</pre>
<p>Les logs racontent tout : lus régulièrement, ils transforment une panne mystérieuse en diagnostic clair. Demain : le service de temps (NTP).</p>`
  }
};
