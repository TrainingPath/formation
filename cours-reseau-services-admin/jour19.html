  theory: `
<h3>1. Le problème : plusieurs sites, une machine</h3>
<p>Louer un serveur coûte cher. Or, un site web modeste consomme très peu de ressources. Pourquoi dédier une machine entière à un seul site ? Apache permet d'héberger <strong>plusieurs sites différents sur un même serveur</strong> grâce aux <strong>hôtes virtuels</strong> (en anglais <em>virtual hosts</em>, ou « virtualhosts »). Chaque site a son propre nom de domaine, son propre dossier de fichiers, mais partage la même machine et le même service Apache.</p>
<p>Analogie : un immeuble unique (le serveur) abrite plusieurs appartements (les sites). Chacun a sa porte et son adresse, mais le bâtiment est commun. Le facteur (Apache) lit l'adresse pour livrer au bon appartement.</p>
<h3>2. Le virtualhost « par nom » (name-based)</h3>
<p>La méthode la plus courante s'appelle le virtualhost <strong>par nom</strong> (en anglais <em>name-based</em>). Tous les sites partagent la <strong>même adresse IP</strong> et le <strong>même port 80</strong>. Comment Apache sait-il alors quel site servir ? Grâce à l'<strong>en-tête HTTP</strong> <strong>Host</strong> : quand ton navigateur demande une page, il précise le nom de domaine visé (par exemple <em>www.boulangerie.fr</em>). Apache lit ce champ et choisit le bon virtualhost.</p>
<pre class="pseudo"># Le navigateur envoie, dans sa requête :
GET /index.html HTTP/1.1
Host: www.boulangerie.fr      &lt;-- Apache lit ce nom pour choisir le site</pre>
<p>Il existe aussi le virtualhost <strong>par IP</strong> (<em>IP-based</em>), où chaque site a sa propre adresse IP, mais il est moins pratique et plus coûteux en adresses. Le <strong>name-based</strong> est de loin le plus répandu.</p>
<h3>3. Écrire un virtualhost</h3>
<p>Un virtualhost se déclare dans un bloc de configuration. Sous Debian/Ubuntu, chaque site a son fichier dans <strong>/etc/apache2/sites-available/</strong>. On y indique le nom du site (<strong>ServerName</strong>) et son dossier de fichiers (<strong>DocumentRoot</strong>).</p>
<pre class="pseudo"># /etc/apache2/sites-available/boulangerie.conf
&lt;VirtualHost *:80&gt;
    ServerName www.boulangerie.fr
    DocumentRoot /var/www/boulangerie
&lt;/VirtualHost&gt;

# Un second site sur la MÊME machine :
&lt;VirtualHost *:80&gt;
    ServerName www.fleuriste.fr
    DocumentRoot /var/www/fleuriste
&lt;/VirtualHost&gt;</pre>
<p>Le <strong>*:80</strong> signifie « écoute sur toutes les adresses de la machine, port 80 ». C'est le <strong>ServerName</strong> qui distingue les deux sites, pas l'adresse.</p>
<h3>4. Activer un site sous Debian/Ubuntu</h3>
<p>Écrire le fichier ne suffit pas : il faut <strong>activer</strong> le site. Debian fournit deux commandes pratiques : <strong>a2ensite</strong> (enable site) et <strong>a2dissite</strong> (disable site). Elles créent ou suppriment un lien depuis <strong>sites-enabled/</strong>. Après activation, on recharge Apache.</p>
<pre class="pseudo"># Activer le site puis recharger :
sudo a2ensite boulangerie.conf
sudo systemctl reload apache2
# Chaque nom de domaine doit pointer (DNS) vers l'IP du serveur.</pre>
<div class="tip">Pour tester sans DNS, tu peux ajouter le nom dans le fichier hosts de ta machine cliente (/etc/hosts sous Linux) : il fera pointer le nom vers l'IP du serveur le temps du test.</div>
<div class="warn">Si deux virtualhosts ont le même ServerName, ou si aucun ne correspond, Apache sert le PREMIER virtualhost déclaré (le site « par défaut »). Vérifie toujours l'orthographe exacte du ServerName.</div>
<h3>5. Ce qu'il faut retenir</h3>

    intro: `<p>Sofia loue un seul serveur mais gère deux boutiques : <em>www.chaussures.fr</em> et <em>www.sacs.fr</em>. Elle veut que chaque nom affiche son propre site, sans louer une deuxième machine. Aide-la à configurer ses virtualhosts.</p>`,
