  title: "Le cache DNS et le TTL",
  subtitle: "Mémoriser pour aller vite : durée de vie, expiration et pièges lors d'un changement.",
  theory: `
<h3>1. Pourquoi mettre en cache ?</h3>
<p>Refaire toute l'enquête (racine, TLD, autoritatif) à chaque visite serait lent et gaspillerait les serveurs mondiaux. Le DNS applique donc une règle simple : <strong>on mémorise les réponses</strong> pour les réutiliser. Cette mémoire s'appelle le <strong>cache</strong>. Ton resolver, ton système d'exploitation et même ton navigateur gardent chacun une copie temporaire des réponses reçues.</p>
<p>Résultat : le premier accès à un site déclenche l'enquête complète ; les suivants, tant que la réponse est en cache, sont quasi instantanés.</p>
<h3>2. Le TTL : une date de péremption</h3>
<p>Mais une adresse IP peut changer. Pour éviter de garder une info périmée éternellement, chaque enregistrement porte un <strong>TTL</strong> (« Time To Live », durée de vie). C'est un nombre de <strong>secondes</strong> indiquant combien de temps la réponse peut rester en cache avant d'être considérée comme expirée. Un TTL de 3600 signifie « garde-moi une heure ».</p>
<pre class="pseudo">www.exemple.com.   3600   IN  A   93.184.216.34
#                   ^^^^ TTL en secondes : valable 1 heure en cache</pre>
<div class="tip">Le TTL, c'est comme la date de péremption sur un yaourt : tant qu'elle n'est pas dépassée, on consomme la copie du cache ; une fois dépassée, on va rechercher une version fraîche auprès du serveur autoritatif.</div>
<h3>3. Expiration et rafraîchissement</h3>
<p>Quand un enregistrement est mis en cache, le resolver démarre un décompte. Chaque fois qu'il ressert la réponse, le TTL restant diminue. À zéro, l'entrée est <strong>expirée</strong> : au prochain besoin, le resolver refait l'enquête et récupère une valeur fraîche, avec un TTL remis à sa valeur d'origine. Ainsi le cache reste globalement à jour sans être interrogé en permanence.</p>
<h3>4. L'impact d'un changement : anticiper le TTL</h3>
<p>Le TTL a une conséquence pratique majeure. Si tu changes l'adresse IP d'un serveur, les caches du monde entier peuvent encore renvoyer l'<strong>ancienne</strong> adresse jusqu'à l'expiration du TTL. C'est la fameuse « propagation DNS » : elle n'est pas magique, elle dépend directement du TTL.</p>
<pre class="pseudo"># Bonne pratique avant une migration :
# 1. Quelques jours avant : baisser le TTL (ex : de 86400 a 300 secondes)
# 2. Attendre que l'ancien TTL long ait expire partout
# 3. Faire le changement d'IP : les caches se rafraichissent en ~5 min
# 4. Apres stabilisation : remonter le TTL (moins de charge)</pre>
<div class="warn">Un TTL très long économise des requêtes mais rend les changements lents à se propager. Un TTL très court propage vite mais surcharge les serveurs. C'est un compromis à choisir selon le besoin.</div>
<h3>5. Vider le cache</h3>
<p>En dépannage, on peut forcer l'oubli. Sous Windows : <code>ipconfig /flushdns</code>. Sur de nombreux systèmes Linux avec systemd-resolved : <code>resolvectl flush-caches</code>. Cela n'affecte que ta machine, pas les caches distants.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Cache = memoire temporaire des reponses DNS (resolver, OS, navigateur)
# TTL   = duree de vie en SECONDES avant expiration d'une entree
# A l'expiration : nouvelle enquete, valeur fraiche, TTL reinitialise
# Changement d'IP : ancien cache valable jusqu'a expiration du TTL
# Avant migration : baisser le TTL a l'avance ; le remonter apres
# Vider son cache : ipconfig /flushdns (Windows)</pre>`,

    { type: "input", q: "Comment appelle-t-on la mémoire temporaire des réponses DNS ?", a: ["le cache", "cache"], ph: "un mot", exp: "Le cache DNS." },
    { type: "input", q: "Que fait-on au TTL, quelques jours avant une migration, pour propager vite ?", a: ["le baisser", "baisser", "reduire", "le reduire", "diminuer"], ph: "un verbe", exp: "On le baisse à l'avance, par exemple de 86400 à 300." },
    { type: "input", q: "Quel adjectif qualifie une entrée dont le TTL a atteint zéro ?", a: ["expiree", "expire", "perimee"], ph: "un adjectif", exp: "Une entrée expirée, qui sera rafraîchie." }
  ],

    ],
    solution: `<pre class="pseudo"># Plan de migration maville.fr :

<p>La « propagation DNS » n'est pas de la magie : elle suit exactement le TTL. Le maîtriser, c'est maîtriser ses migrations. Demain : on quitte la théorie pour installer un vrai serveur DNS.</p>`
