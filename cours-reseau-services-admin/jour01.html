<script>
var DAY = {
  num: 1,
  title: "Les services réseau : vue d'ensemble",
  subtitle: "Derrière chaque clic sur Internet, des services invisibles font le travail.",
  theory: `
<h3>1. Un réseau, c'est plein de petits métiers</h3>
<p>Un réseau ne se limite pas à des câbles et à des adresses IP. Pour qu'il soit utilisable au quotidien, des programmes rendent des <strong>services</strong> : donner une adresse à une machine qui vient de se brancher, traduire un nom comme <em>exemple.com</em> en adresse IP, distribuer des pages web, transporter des courriels. Chacun de ces métiers est un <strong>service réseau</strong> (en anglais <em>network service</em>).</p>
<p>Pense à une petite ville. La mairie attribue les adresses des maisons, l'annuaire relie les noms aux numéros de téléphone, la poste distribue le courrier. Personne ne voit ces bureaux fonctionner, mais si l'un s'arrête, plus rien ne marche. Sur un réseau, c'est pareil : les services d'infrastructure travaillent en coulisses.</p>
<h3>2. Le modèle client/serveur</h3>
<p>La plupart des services suivent le <strong>modèle client/serveur</strong>. Le <strong>serveur</strong> est un programme qui attend des demandes et y répond. Le <strong>client</strong> est le programme qui pose la question. Ton navigateur est un client web ; il interroge un serveur web qui lui renvoie la page. La même machine peut être cliente pour un service et serveuse pour un autre.</p>
<pre class="pseudo"># Le schema de base
CLIENT  --- demande --->  SERVEUR
CLIENT  &lt;-- reponse ----  SERVEUR
# Le client ouvre le dialogue, le serveur ecoute et repond.</pre>
<div class="tip">Un serveur « écoute » sur un <strong>port</strong> précis. Un port est un numéro (de 0 à 65535) qui identifie le service visé sur une machine. Exemples : web = 80, DNS = 53, DHCP = 67 et 68. On parle de couple adresse IP + port pour joindre un service.</div>
<h3>3. Services d'infrastructure vs services applicatifs</h3>
<p>On distingue deux familles. Les <strong>services d'infrastructure</strong> font tourner le réseau lui-même : le <strong>DHCP</strong> (attribution automatique d'adresses IP) et le <strong>DNS</strong> (traduction noms ↔ IP) en sont les piliers. Les <strong>services applicatifs</strong> rendent un service à l'utilisateur final : web (HTTP), messagerie (SMTP), partage de fichiers. Les seconds ne pourraient pas fonctionner sans les premiers : sans adresse IP (DHCP) et sans annuaire (DNS), impossible de charger la moindre page.</p>
<h3>4. Le rôle de l'administrateur système</h3>
<p>L'<strong>administrateur système</strong> (en anglais <em>sysadmin</em>) installe, configure et surveille ces services. Son travail : garantir qu'ils soient toujours disponibles, corrects et sécurisés. Dans ce cours, tu apprendras d'abord le DHCP, puis le DNS, deux services d'infrastructure que tout admin doit maîtriser.</p>
<div class="warn">Un service invisible reste critique : si le DHCP tombe, aucune nouvelle machine ne reçoit d'adresse ; si le DNS tombe, les noms ne se résolvent plus et l'utilisateur croit qu'« Internet est en panne ». Diagnostiquer, c'est savoir quel service défaille.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Service reseau      = un programme qui rend un service (DHCP, DNS, web...)
# Client / serveur    = le client demande, le serveur ecoute et repond
# Port                = numero qui identifie le service vise (web 80, DNS 53)
# Infrastructure      = DHCP + DNS (font tourner le reseau)
# Applicatif          = web, mail, partage (services aux utilisateurs)</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un « service réseau » ?", opts: ["Un câble réseau particulier", "Un programme qui rend un service sur le réseau (attribuer une IP, résoudre un nom...)", "Une adresse IP", "Un type de prise murale"], a: 1, exp: "Un service réseau est un programme (DHCP, DNS, web...) qui rend un service précis." },
    { type: "qcm", q: "Dans le modèle client/serveur, qui ouvre le dialogue ?", opts: ["Le serveur", "Le client", "Le routeur", "Le câble"], a: 1, exp: "Le client pose la question ; le serveur écoute et répond." },
    { type: "vf", q: "Une même machine peut être cliente d'un service et serveuse d'un autre.", a: true, exp: "Oui : les rôles client et serveur dépendent du service, pas de la machine." },
    { type: "input", q: "Comment appelle-t-on le numéro (0 à 65535) qui identifie le service visé sur une machine ?", a: ["port", "le port", "un port"], ph: "un mot", exp: "Le port identifie le service. Web = 80, DNS = 53, DHCP = 67/68." },
    { type: "qcm", q: "Lesquels sont des services d'INFRASTRUCTURE ?", opts: ["Le web et la messagerie", "Le DHCP et le DNS", "Le tableur et le traitement de texte", "L'imprimante et le scanner"], a: 1, exp: "DHCP et DNS font tourner le réseau : ce sont les services d'infrastructure." },
    { type: "vf", q: "Un serveur web pourrait fonctionner normalement sans aucun DNS ni aucune adresse IP.", a: false, exp: "Non : sans IP (DHCP) et sans annuaire (DNS), les services applicatifs ne sont pas joignables simplement." },
    { type: "qcm", q: "À quoi sert le service DHCP (en une phrase) ?", opts: ["À traduire les noms en adresses", "À attribuer automatiquement des adresses IP", "À afficher des pages web", "À envoyer des courriels"], a: 1, exp: "Le DHCP attribue automatiquement les adresses IP aux machines." },
    { type: "qcm", q: "À quoi sert le service DNS (en une phrase) ?", opts: ["À distribuer les adresses IP", "À traduire les noms de domaine en adresses IP (et l'inverse)", "À stocker des fichiers", "À imprimer"], a: 1, exp: "Le DNS traduit les noms (exemple.com) en adresses IP." },
    { type: "input", q: "Sur quel numéro de port un serveur web écoute-t-il classiquement (HTTP) ?", a: ["80", "port 80"], ph: "un nombre", exp: "Le web (HTTP) utilise classiquement le port 80." },
    { type: "vf", q: "Un serveur « écoute » sur un port en attendant les demandes des clients.", a: true, exp: "Oui : le serveur est en attente sur son port ; le client s'y connecte." },
    { type: "qcm", q: "Comment appelle-t-on la personne qui installe, configure et surveille les services réseau ?", opts: ["L'utilisateur final", "L'administrateur système (sysadmin)", "Le graphiste", "Le commercial"], a: 1, exp: "L'administrateur système gère la disponibilité et la sécurité des services." },
    { type: "input", q: "Cite un service APPLICATIF (destiné à l'utilisateur final) autre que le web.", a: ["messagerie", "mail", "courriel", "email", "e-mail", "smtp", "partage de fichiers"], ph: "un exemple", exp: "Messagerie, partage de fichiers... sont des services applicatifs." },
    { type: "qcm", q: "Que joint-on avec le couple « adresse IP + port » ?", opts: ["Un utilisateur précis", "Un service précis sur une machine précise", "Un câble", "Un mot de passe"], a: 1, exp: "IP + port = un service précis (ex : 192.168.1.10:53 pour un DNS)." },
    { type: "vf", q: "Si le DNS tombe en panne, l'utilisateur a souvent l'impression qu'« Internet ne marche plus », même si le réseau physique fonctionne.", a: true, exp: "Oui : sans résolution de noms, rien ne se charge, d'où l'illusion de panne globale." },
    { type: "input", q: "Complète : le programme qui attend et répond aux demandes s'appelle le ______ ; celui qui demande s'appelle le ______.", a: ["serveur ; client", "serveur, client", "serveur client", "le serveur ; le client"], ph: "deux mots", exp: "Le serveur répond, le client demande : c'est le modèle client/serveur." }
  ],
  final: {
    title: "Exercice final — Cartographier les services d'une petite entreprise",
    intro: `<p>Dans une PME, un ordinateur portable se connecte au Wi-Fi le matin, reçoit une adresse, puis l'employé ouvre <code>intranet.pme.local</code> dans son navigateur. Identifions les services impliqués.</p>`,
    questions: [
      { type: "qcm", q: "Le portable vient de se brancher : quel service lui donne automatiquement une adresse IP ?", opts: ["Le DNS", "Le DHCP", "Le serveur web", "La messagerie"], a: 1, exp: "Le DHCP attribue l'adresse IP à la machine qui arrive sur le réseau." },
      { type: "qcm", q: "L'employé tape un nom : quel service le traduit en adresse IP ?", opts: ["Le DHCP", "Le DNS", "Le port 80", "Le câble"], a: 1, exp: "Le DNS traduit intranet.pme.local en adresse IP." },
      { type: "vf", q: "Le navigateur joue ici le rôle de client, et le serveur intranet celui de serveur.", a: true, exp: "Oui : le navigateur (client) interroge le serveur web de l'intranet." },
      { type: "input", q: "DHCP et DNS appartiennent à quelle famille de services (deux mots) ?", a: ["services d'infrastructure", "infrastructure", "service d'infrastructure", "d'infrastructure"], ph: "…", exp: "DHCP et DNS sont des services d'infrastructure." },
      { type: "qcm", q: "Si le matin personne ne reçoit d'adresse IP, quel service faut-il d'abord suspecter ?", opts: ["Le serveur web", "Le DHCP", "L'imprimante", "Le tableur"], a: 1, exp: "Pas d'adresse automatique = on suspecte d'abord le DHCP." }
    ],
    solution: `<pre class="pseudo"># Chaine des services le matin :
1) Le portable arrive       -> DHCP lui donne une adresse IP
2) L'employe tape un nom     -> DNS traduit le nom en IP
3) Le navigateur (CLIENT)    -> interroge le serveur web (SERVEUR) sur le port 80
# DHCP + DNS = infrastructure (invisibles mais critiques)
# web/mail    = applicatif  (le service rendu a l'utilisateur)</pre>
<p>Tu sais maintenant situer chaque service. Demain : pourquoi le DHCP existe et ce qu'il nous évite de faire à la main.</p>`
  }
};
