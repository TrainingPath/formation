  title: "Le service web : le principe",
  subtitle: "Comment une machine sert des pages à des millions de navigateurs.",
  theory: `
<h3>1. Qu'est-ce qu'un service web ?</h3>
<p>Quand tu tapes une adresse dans ton navigateur, une machine à l'autre bout du monde te répond en quelques millisecondes. Cette machine fait tourner un <strong>service web</strong> (en anglais <em>web service</em>), aussi appelé <strong>serveur HTTP</strong>. Un « service » est un programme qui tourne en permanence, attend des demandes et y répond : c'est comme un guichet ouvert 24h/24. Le serveur web attend des demandes de pages et renvoie du contenu (texte, images, données).</p>
<p>Le mot « serveur » désigne deux choses qu'il faut distinguer : la <strong>machine</strong> physique (l'ordinateur qui héberge le site) et le <strong>logiciel serveur</strong> (le programme qui écoute les requêtes). Les deux sens coexistent : on dit « le serveur est en panne » pour la machine, et « installer un serveur Apache » pour le logiciel.</p>
<h3>2. Le modèle client-serveur et le dialogue HTTP</h3>
<p>Le web repose sur le modèle <strong>client-serveur</strong>. Le <strong>client</strong> (ton navigateur : Firefox, Chrome…) envoie une <strong>requête</strong> (en anglais <em>request</em>) ; le <strong>serveur</strong> renvoie une <strong>réponse</strong> (en anglais <em>response</em>). Ce dialogue suit un langage précis : le protocole <strong>HTTP</strong> (« HyperText Transfer Protocol »). En version chiffrée, on parle de <strong>HTTPS</strong> (le S signifie « Secure »).</p>
<pre class="pseudo"># Un échange HTTP, vu de haut :
CLIENT (navigateur)                SERVEUR (Apache, Nginx...)
  |  GET /index.html  ----------->  |   je cherche le fichier
  |                                 |   je le prépare
  |  &lt;----------- 200 OK + page HTML |   je te le renvoie
  |  j'affiche la page              |</pre>
<p>Le serveur écoute par défaut sur le <strong>port 80</strong> pour HTTP et le <strong>port 443</strong> pour HTTPS. Un port est comme un numéro de porte sur la machine : le service web se tient derrière la porte 80.</p>
<h3>3. Contenu statique et contenu dynamique</h3>
<p>Il y a deux grandes façons pour un serveur de produire une page. Le <strong>contenu statique</strong> (en anglais <em>static content</em>) est un fichier déjà écrit sur le disque : une page HTML, une image, un PDF. Le serveur le lit et le renvoie tel quel, sans le transformer. C'est rapide et simple : le même fichier est servi à tout le monde.</p>
<p>Le <strong>contenu dynamique</strong> (en anglais <em>dynamic content</em>) est <strong>fabriqué à la volée</strong>, au moment de la demande, souvent par un programme (PHP, Python, Node…) qui interroge une base de données. Deux visiteurs peuvent recevoir des pages différentes : ton fil d'actualité, ton panier, ton tableau de bord. Le serveur ne renvoie pas un fichier figé, il exécute du code puis renvoie le résultat.</p>
<div class="tip">Analogie : le contenu statique, c'est une affiche déjà imprimée qu'on distribue à tous. Le contenu dynamique, c'est un plat cuisiné à la commande selon ce que TU as demandé.</div>
<h3>4. Ce qui se passe côté serveur</h3>
<p>Le logiciel serveur (Apache, Nginx, IIS…) fait toujours le même cycle : il <strong>écoute</strong> sur un port, <strong>accepte</strong> une connexion, <strong>lit</strong> la requête, <strong>trouve ou génère</strong> la ressource demandée, puis <strong>renvoie</strong> une réponse avec un code (200 = OK, 404 = introuvable). Il note aussi chaque visite dans des <strong>journaux</strong> (en anglais <em>logs</em>). Un même logiciel peut servir des milliers de clients quasi simultanément.</p>
<div class="warn">Un serveur web ne « pousse » pas les pages vers toi : il attend qu'on les lui demande. Sans requête, il ne fait rien. C'est toujours le client qui déclenche l'échange.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Service web / serveur HTTP = programme qui répond aux requêtes de pages

# Port 80 = HTTP   |   Port 443 = HTTPS (chiffré)

# Contenu DYNAMIQUE = page fabriquée à la volée par du code (+ base de données)
# Logiciels courants : Apache, Nginx, IIS</pre>`,

    { type: "vf", q: "Le contenu dynamique implique souvent l'exécution de code et une base de données.", a: true, exp: "Oui : PHP, Python, etc. interrogent une base puis fabriquent la page à la demande." },
    { type: "qcm", q: "Quel élément joue le rôle de « client » dans le web classique ?", opts: ["Le serveur Apache", "Le navigateur", "La base de données", "Le câble réseau"], a: 1, exp: "Le navigateur est le client : il envoie les requêtes et affiche les réponses." },
    { type: "input", q: "Comment appelle-t-on (en anglais, un mot) une demande envoyée par le client au serveur ?", a: ["request", "a request"], ph: "un mot anglais", exp: "Request = requête ; la réponse s'appelle response." },
    { type: "vf", q: "Un serveur web envoie les pages spontanément, même sans qu'on les demande.", a: false, exp: "Non : il attend une requête. Sans demande du client, il ne renvoie rien." }
  ],

    intro: `<p>Nadia lance le site de sa boulangerie. La page « Nos horaires » est un simple fichier HTML identique pour tous. La page « Commander » affiche le panier propre à chaque client et lit les stocks dans une base de données. Aide-la à décrire son service web.</p>`,
    questions: [

      { type: "input", q: "Sur quel port son serveur écoutera-t-il par défaut pour du HTTP simple ?", a: ["80", "port 80"], ph: "un nombre", exp: "Le port 80 est le port HTTP par défaut." },
      { type: "vf", q: "C'est le navigateur du client qui envoie la requête ; le serveur répond.", a: true, exp: "Oui : modèle client-serveur, le client demande, le serveur répond." },

    solution: `<pre class="pseudo"># Récapitulatif du service web de Nadia :
Horaires (fichier HTML fixe)   -> contenu STATIQUE, servi tel quel

Le serveur écoute sur le port 80 (HTTP) et répond aux requêtes du navigateur.
Page trouvée -> 200 OK    |    Page absente -> 404 introuvable</pre>
<p>Le principe est en place. Demain : installer concrètement Apache pour héberger ces pages.</p>`
  }
