  title: "Configurer et sécuriser SSH",

  theory: `
<h3>1. Clés ou mot de passe : deux façons de prouver son identité</h3>
<p>Pour se connecter en SSH, il faut prouver qui l'on est. La méthode la plus simple est le <strong>mot de passe</strong> : pratique, mais vulnérable, car un attaquant peut essayer des millions de combinaisons (attaque par force brute) sur le port 22 exposé. La méthode recommandée est l'<strong>authentification par clé</strong> (en anglais <em>key-based authentication</em>), bien plus sûre.</p>
<p>Une clé SSH est une <strong>paire</strong> : une <strong>clé privée</strong> (en anglais <em>private key</em>), gardée secrète sur ta machine, et une <strong>clé publique</strong> (<em>public key</em>), déposée sur le serveur. Le serveur lance un défi que seule la clé privée peut résoudre. Impossible à deviner, immunisé contre la force brute sur mot de passe. On génère la paire avec <strong>ssh-keygen</strong>.</p>
<pre class="pseudo"># Générer une paire de clés puis l'installer sur le serveur :
ssh-keygen -t ed25519                 # crée clé privée + clé publique
ssh-copy-id alice@serveur.exemple.fr  # dépose la clé PUBLIQUE sur le serveur
# La clé privée ne quitte JAMAIS ta machine.</pre>
<div class="tip">La clé privée est comme la clé de ta maison : tu ne la donnes à personne. La clé publique est comme la serrure : tu peux l'installer partout, elle ne révèle rien de la clé privée.</div>
<h3>2. Le fichier de configuration : sshd_config</h3>
<p>Le comportement du serveur SSH se règle dans un fichier central : <strong>/etc/ssh/sshd_config</strong> (le « config du démon sshd »). Attention à ne pas le confondre avec <strong>ssh_config</strong> (sans « d »), qui règle le <em>client</em>. Chaque directive se met sur une ligne. Après modification, on recharge ou redémarre le service pour appliquer.</p>
<pre class="pseudo"># Fichier serveur : /etc/ssh/sshd_config
# Appliquer les changements après édition :
sudo systemctl restart sshd
# (Toujours garder une session ouverte en secours pendant les tests !)</pre>
<h3>3. Désactiver la connexion root</h3>
<p>Le compte <strong>root</strong> est le super-utilisateur tout-puissant. Autoriser sa connexion directe en SSH est dangereux : les attaquants connaissent déjà son nom, il ne leur reste qu'à trouver le mot de passe. La bonne pratique est de <strong>désactiver la connexion root</strong> et de se connecter avec un compte normal, puis d'élever ses droits avec <strong>sudo</strong> si besoin.</p>
<pre class="pseudo"># Dans /etc/ssh/sshd_config :
PermitRootLogin no            # interdit la connexion directe en root
# On se connecte avec un compte normal, puis :
sudo commande                 # pour les actions administratives</pre>
<div class="warn">Avant d'écrire <strong>PermitRootLogin no</strong>, assure-toi qu'un compte normal peut bien se connecter ET utiliser sudo. Sinon tu risques de te verrouiller dehors de ton propre serveur.</div>
<h3>4. Renforcer encore : mot de passe et port</h3>
<p>Deux réglages complètent le durcissement. D'abord, une fois les clés en place, on peut <strong>désactiver l'authentification par mot de passe</strong> (<strong>PasswordAuthentication no</strong>) : seules les clés sont acceptées, la force brute devient inutile. Ensuite, on peut <strong>changer le port</strong> d'écoute (par exemple 2222 au lieu de 22) : cela n'apporte pas une vraie sécurité mais réduit fortement le « bruit » des scans automatiques qui visent le port 22.</p>
<pre class="pseudo"># Extrait durci de /etc/ssh/sshd_config :
Port 2222                     # changer le port (réduit les scans du 22)
PermitRootLogin no            # pas de connexion root directe
PasswordAuthentication no     # clés uniquement, plus de mot de passe
# Puis : sudo systemctl restart sshd   (et penser au pare-feu : ouvrir 2222)</pre>
<div class="tip">Changer le port est de la « sécurité par l'obscurité » : utile pour réduire le bruit, mais jamais suffisant seul. Les vraies protections sont les clés et la désactivation de root.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Authentification par CLÉ &gt; mot de passe (immunisée contre la force brute)

#   outils : ssh-keygen (générer), ssh-copy-id (déposer la clé publique)

    { type: "vf", q: "Avec PermitRootLogin no, on se connecte avec un compte normal puis on utilise sudo.", a: true, exp: "Oui : on ouvre une session utilisateur puis on élève ses droits via sudo." },
    { type: "qcm", q: "Après avoir modifié sshd_config, que faut-il faire ?", opts: ["Rien", "Redémarrer/recharger le service sshd", "Supprimer le fichier", "Débrancher le réseau"], a: 1, exp: "Un restart/reload de sshd applique la nouvelle configuration." },
    { type: "input", q: "La clé que l'on dépose sur le serveur est la clé… ?", a: ["publique", "la clé publique", "clé publique", "cle publique", "public key"], ph: "quelle clé ?", exp: "On dépose la clé publique sur le serveur ; la privée reste chez soi." },
    { type: "vf", q: "Il est prudent de garder une session SSH ouverte pendant qu'on teste une nouvelle config.", a: true, exp: "Oui : cela évite de se verrouiller dehors si la nouvelle configuration bloque l'accès." }
  ],

    intro: `<p>Le serveur de Théo, exposé sur Internet, subit des milliers de tentatives de connexion root par mot de passe chaque jour. Il veut le sécuriser sans se verrouiller dehors. Aide-le à appliquer les bonnes directives.</p>`,
    questions: [

    solution: `<pre class="pseudo"># Durcissement du serveur de Théo (/etc/ssh/sshd_config) :
PermitRootLogin no            # plus de connexion root directe
PasswordAuthentication no     # clés uniquement (fin de la force brute)
Port 2222                     # réduit le bruit des scans du port 22

<p>Le serveur passe d'une porte grande ouverte à une porte blindée. Tu as bouclé le module web + services d'administration : service web, Apache, virtualhosts, HTTP, NTP, partage de fichiers et SSH.</p>`
