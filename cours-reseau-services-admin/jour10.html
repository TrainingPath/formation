<title>Jour 10</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 10,
  title: "La résolution DNS pas à pas (récursive vs itérative)",
  subtitle: "Du resolver aux serveurs autoritatifs : suivons le voyage d'une question DNS.",
  theory: `
<h3>1. Qui pose la question, qui y répond ?</h3>
<p>Quand tu tapes <em>www.exemple.com</em>, ton ordinateur ne connaît pas l'adresse IP. Il la demande à un intermédiaire : le <strong>resolver</strong> (« résolveur »), souvent celui de ton fournisseur d'accès ou un service public comme 8.8.8.8. Ce resolver va mener l'enquête à ta place et te rapporter la réponse. Comprendre ce trajet, c'est comprendre pourquoi le premier accès à un site est parfois un peu plus lent, puis instantané ensuite.</p>
<h3>2. Deux styles de questions : récursif et itératif</h3>
<p>Il existe deux façons de poser une question DNS. Dans le mode <strong>récursif</strong>, le client dit : « Débrouille-toi et rapporte-moi la réponse finale. » C'est ce que ton ordinateur demande au resolver. Dans le mode <strong>itératif</strong>, le serveur interrogé répond : « Je ne sais pas, mais voici l'adresse de quelqu'un qui en sait plus. » C'est ainsi que le resolver dialogue avec les serveurs de l'infrastructure DNS.</p>
<div class="tip">Analogie : le mode récursif, c'est demander à un concierge « trouvez-moi ce bureau » et attendre qu'il revienne avec la réponse. Le mode itératif, c'est le concierge qui, à chaque étage, demande « où est ce bureau ? » et se fait répondre « montez encore, demandez au 3e ».</div>
<h3>3. Le voyage complet d'une requête</h3>
<p>Supposons que le cache soit vide. Voici les étapes que suit le resolver pour <em>www.exemple.com</em> :</p>
<pre class="pseudo">Client  --recursif-->  Resolver (il va enqueter pour moi)
Resolver --iteratif--> Serveur RACINE     : "et .com, qui gere ?"
   RACINE repond       : "demande aux serveurs TLD .com"
Resolver --iteratif--> Serveur TLD .com    : "et exemple.com ?"
   TLD repond          : "demande aux serveurs autoritatifs d'exemple.com"
Resolver --iteratif--> Serveur AUTORITATIF : "et www.exemple.com ?"
   AUTORITATIF repond  : "A = 93.184.216.34"  (reponse finale)
Resolver --> Client    : "93.184.216.34"      (et il met en cache)</pre>
<p>Le resolver descend l'arbre des noms de la <strong>droite vers la gauche</strong> : d'abord la racine, puis le domaine de premier niveau (<strong>TLD</strong>, « Top-Level Domain » comme .com, .fr), puis le domaine lui-même. Chaque serveur ne connaît qu'un morceau et renvoie vers le suivant.</p>
<h3>4. Autoritatif ou pas ?</h3>
<p>On distingue une réponse <strong>autoritative</strong> — donnée par le serveur officiellement responsable de la zone, qui détient l'information originale — d'une réponse <strong>non autoritative</strong> — donnée par un resolver depuis son cache. Ton resolver renvoie généralement une réponse non autoritative : correcte, mais recopiée, pas issue de la source directe.</p>
<div class="warn">Ton ordinateur envoie presque toujours des requêtes récursives ; l'infrastructure publique (racine, TLD) ne répond, elle, qu'en itératif. Un serveur racine ne fera jamais tout le travail à ta place.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Client -> Resolver        : requete RECURSIVE (rapporte-moi la reponse)
# Resolver -> infrastructure : requetes ITERATIVES (renvoie-moi vers le suivant)
# Ordre descendant : RACINE -> TLD -> AUTORITATIF
# Reponse AUTORITATIVE = source officielle ; via cache = NON autoritative
# Le resolver mene l'enquete, met en cache, puis repond au client</pre>`,
  exercises: [
    { type: "qcm", q: "Comment appelle-t-on l'intermédiaire qui mène l'enquête DNS pour ton ordinateur ?", opts: ["Le serveur racine", "Le resolver (résolveur)", "Le serveur autoritatif", "Le TLD"], a: 1, exp: "Le resolver reçoit la requête récursive et enquête à ta place." },
    { type: "qcm", q: "Dans une requête récursive, que demande le client ?", opts: ["Une piste vers un autre serveur", "La réponse finale, quoi qu'il arrive", "Uniquement le serveur TLD", "Un transfert de zone"], a: 1, exp: "Récursif = « débrouille-toi et rapporte-moi la réponse complète »." },
    { type: "qcm", q: "Dans une réponse itérative, que renvoie le serveur interrogé ?", opts: ["La réponse finale", "Un renvoi vers un serveur qui en sait plus", "Une erreur systématique", "Le cache du client"], a: 1, exp: "Itératif = « je ne sais pas, mais demande à celui-ci »." },
    { type: "qcm", q: "Dans quel ordre le resolver interroge-t-il les serveurs ?", opts: ["Autoritatif, TLD, racine", "Racine, TLD, autoritatif", "TLD, racine, autoritatif", "Racine, autoritatif, TLD"], a: 1, exp: "On descend l'arbre : racine, puis TLD (.com), puis autoritatif." },
    { type: "qcm", q: "Une réponse issue du cache d'un resolver est…", opts: ["Autoritative", "Non autoritative", "Toujours fausse", "Interdite"], a: 1, exp: "Le cache donne une réponse non autoritative : correcte mais recopiée." },
    { type: "qcm", q: "Qui donne une réponse autoritative ?", opts: ["Le serveur racine", "Le resolver du FAI", "Le serveur autoritatif de la zone", "Le navigateur"], a: 2, exp: "Le serveur officiellement responsable de la zone détient l'info originale." },
    { type: "vf", q: "Ton ordinateur envoie généralement des requêtes récursives à son resolver.", a: true, exp: "Vrai : le client délègue toute l'enquête au resolver." },
    { type: "vf", q: "Un serveur racine fait tout le travail à ta place et te renvoie l'IP finale.", a: false, exp: "Faux : la racine répond en itératif, elle renvoie seulement vers les serveurs TLD." },
    { type: "vf", q: "Le premier accès à un site peut être plus lent car le cache est vide.", a: true, exp: "Vrai : sans cache, le resolver doit mener toute l'enquête ; ensuite c'est mémorisé." },
    { type: "vf", q: "Le resolver interroge les serveurs de gauche à droite (www d'abord, racine en dernier).", a: false, exp: "Faux : il descend de la droite (racine) vers la gauche (le nom précis)." },
    { type: "input", q: "Comment nomme-t-on le type de requête où le client attend la réponse complète ?", a: ["recursive", "recursif", "requete recursive"], ph: "un mot", exp: "La requête récursive." },
    { type: "input", q: "Comment nomme-t-on le type de requête où le serveur renvoie vers un autre serveur ?", a: ["iterative", "iteratif", "requete iterative"], ph: "un mot", exp: "La requête itérative." },
    { type: "input", q: "Quel serveur (mot) est interrogé en tout premier quand le cache est vide ?", a: ["racine", "root", "serveur racine"], ph: "un mot", exp: "Le serveur racine (root), sommet de l'arbre DNS." },
    { type: "input", q: "Comment qualifie-t-on une réponse fournie par le serveur officiel de la zone ?", a: ["autoritative", "autoritaire", "faisant autorite"], ph: "un adjectif", exp: "Une réponse autoritative (faisant autorité)." },
    { type: "input", q: "Quel élément, une fois rempli, accélère les requêtes suivantes du resolver ?", a: ["le cache", "cache"], ph: "un mot", exp: "Le cache : il évite de refaire toute l'enquête." }
  ],
  final: {
    title: "Exercice final — Suivre une requête de A à Z",
    intro: `<p>Chez un particulier, le PC de Karim ouvre pour la première fois de la journée <code>www.blog-cuisine.fr</code>. Le cache du resolver est totalement vide. Reconstituons ce qui se passe sur le réseau.</p>`,
    questions: [
      { type: "qcm", q: "Le PC de Karim envoie sa question à…", opts: ["Un serveur racine directement", "Son resolver, en mode récursif", "Un serveur TLD", "Le serveur autoritatif de blog-cuisine.fr"], a: 1, exp: "Le client interroge son resolver en récursif." },
      { type: "qcm", q: "Le resolver interroge d'abord…", opts: ["Le serveur autoritatif", "Un serveur racine", "Le PC de Karim", "Le serveur mail"], a: 1, exp: "Cache vide : il commence par la racine." },
      { type: "qcm", q: "Le serveur racine répond en indiquant…", opts: ["L'IP finale", "Les serveurs TLD .fr à interroger", "Une erreur", "Le cache"], a: 1, exp: "La racine renvoie vers les serveurs du TLD .fr (mode itératif)." },
      { type: "input", q: "Quel serveur donnera finalement l'enregistrement A de www.blog-cuisine.fr ? (deux mots)", a: ["serveur autoritatif", "autoritatif", "le serveur autoritatif"], ph: "deux mots", exp: "Le serveur autoritatif de la zone blog-cuisine.fr." },
      { type: "vf", q: "Après cette enquête, le resolver met la réponse en cache pour les prochaines fois.", a: true, exp: "Vrai : le cache évitera de refaire tout le trajet." }
    ],
    solution: `<pre class="pseudo"># Enquete complete (cache vide) :
PC ---recursif---> Resolver
Resolver -> RACINE      : renvoie vers TLD .fr
Resolver -> TLD .fr     : renvoie vers autoritatifs de blog-cuisine.fr
Resolver -> AUTORITATIF : A = 198.51.100.7  (reponse finale)
Resolver -> PC          : 198.51.100.7  (mise en cache au passage)</pre>
<p>La récursivité côté client, l'itération côté infrastructure, et le cache pour la vitesse : ces trois idées expliquent tout le trajet. Demain : qui sont précisément la racine, les TLD et les autoritatifs.</p>`
  }
};
</script>
