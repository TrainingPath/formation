var DAY = {
  num: 29,
  title: "Pratique : déployer un serveur web complet",
  subtitle: "Du paquet installé à la page qui s'affiche : la chaîne complète, à la main.",
  theory: `
<h3>1. Objectif du jour</h3>
<p>Aujourd'hui, on met la main dans le cambouis : installer <strong>Apache</strong> (le serveur web <em>httpd</em>), publier un vrai site, puis vérifier qu'il répond. Apache est l'un des serveurs web les plus répandus au monde ; son rôle est d'<em>écouter</em> les requêtes HTTP et de renvoyer des pages. On travaille sur une machine Linux de type Debian/Ubuntu.</p>
<h3>2. Installer et démarrer Apache</h3>
<p>On installe le paquet, puis on démarre le service et on l'active au démarrage. Le service s'appelle <code>apache2</code> sous Debian/Ubuntu (et <code>httpd</code> sous Red Hat/CentOS).</p>
<pre class="pseudo"># Installation (Debian / Ubuntu) :
sudo apt update
sudo apt install apache2
# Demarrer le service et l'activer au boot :
sudo systemctl start apache2
sudo systemctl enable apache2
# Verifier qu'il tourne :
sudo systemctl status apache2   # doit afficher : active (running)</pre>
<p>Dès l'installation, Apache sert une page de test. On peut la voir en ouvrant <code>http://localhost/</code> depuis la machine, ou <code>http://IP_du_serveur/</code> depuis un autre poste.</p>
<h3>3. Publier son propre site</h3>
<p>Apache sert les fichiers rangés dans son <strong>racine web</strong> (en anglais <em>document root</em>). Sous Debian/Ubuntu, c'est le dossier <code>/var/www/html</code>. Le fichier d'accueil par défaut s'appelle <code>index.html</code>. Pour publier ton site, tu remplaces cette page :</p>
<pre class="pseudo"># Ecrire une page d'accueil :
echo "&lt;h1&gt;Bienvenue chez Mercado&lt;/h1&gt;" | sudo tee /var/www/html/index.html
# Verifier le contenu :
cat /var/www/html/index.html
# (Les fichiers doivent etre lisibles par l'utilisateur d'Apache : www-data)
sudo chown -R www-data:www-data /var/www/html</pre>
<h3>4. Tester que ça marche</h3>
<p>On vérifie de trois façons complémentaires. Depuis le serveur en ligne de commande avec <code>curl</code>, depuis un navigateur, et en contrôlant le <strong>port 80</strong> (HTTP) qui doit être ouvert. Si rien ne s'affiche, on lit les journaux d'Apache.</p>
<pre class="pseudo"># Test local en ligne de commande :
curl http://localhost/            # doit renvoyer le HTML de la page
# Test depuis un autre poste : ouvrir http://192.168.1.20/ dans le navigateur
# Verifier que le port 80 ecoute :
sudo ss -tlnp | grep :80
# En cas de probleme, lire les journaux :
sudo tail -f /var/log/apache2/error.log
sudo tail -f /var/log/apache2/access.log</pre>
<div class="tip">Après avoir modifié une configuration (pas un simple index.html), recharge Apache sans couper les connexions : <code>sudo systemctl reload apache2</code>. Teste d'abord la config avec <code>sudo apache2ctl configtest</code>.</div>
<div class="warn">Si la page marche en <code>localhost</code> mais pas depuis un autre poste, le coupable est presque toujours le <strong>pare-feu</strong> qui bloque le port 80, ou une mauvaise adresse IP. Vérifie <code>sudo ufw allow 80/tcp</code> et l'IP réelle du serveur.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 1) Installer : sudo apt install apache2
# 2) Demarrer : systemctl start/enable apache2 (status = running)
# 3) Publier  : mettre index.html dans /var/www/html (document root)
# 4) Tester   : curl http://localhost/ + navigateur + port 80 (ss -tlnp)
# 5) Debugger : /var/log/apache2/error.log | pare-feu ufw allow 80/tcp</pre>`,
  exercises: [
    { type: "qcm", q: "Quel logiciel installe-t-on aujourd'hui pour servir des pages web ?", opts: ["Apache", "MySQL", "Bind", "Postfix"], a: 0, exp: "Apache (httpd) est le serveur web installé dans cette leçon." },
    { type: "qcm", q: "Sous Debian/Ubuntu, quelle commande installe Apache ?", opts: ["sudo apt install apache2", "sudo apt remove apache2", "sudo systemctl start apache2", "sudo dpkg -r apache2"], a: 0, exp: "apt install apache2 installe le paquet sous Debian/Ubuntu." },
    { type: "input", q: "Quel dossier est la racine web (document root) par défaut sous Debian/Ubuntu ?", a: ["/var/www/html", "var/www/html"], ph: "un chemin", exp: "Apache sert les fichiers de /var/www/html par défaut." },
    { type: "qcm", q: "Quel fichier sert de page d'accueil par défaut ?", opts: ["home.php", "index.html", "default.htm", "main.css"], a: 1, exp: "index.html est la page d'accueil servie par défaut." },
    { type: "qcm", q: "Sur quel port TCP Apache écoute-t-il en HTTP par défaut ?", opts: ["22", "53", "80", "443"], a: 2, exp: "HTTP utilise le port 80 (HTTPS utilise 443)." },
    { type: "input", q: "Quelle commande démarre le service Apache (Debian/Ubuntu) ?", a: ["sudo systemctl start apache2", "systemctl start apache2"], ph: "systemctl ...", exp: "systemctl start apache2 lance le service." },
    { type: "qcm", q: "Quelle commande l'active au démarrage de la machine ?", opts: ["systemctl enable apache2", "systemctl stop apache2", "systemctl mask apache2", "systemctl disable apache2"], a: 0, exp: "enable démarre automatiquement le service au boot." },
    { type: "qcm", q: "Quel outil en ligne de commande teste la réponse HTTP depuis le serveur ?", opts: ["curl", "chmod", "grep", "tar"], a: 0, exp: "curl http://localhost/ récupère la page servie." },
    { type: "vf", q: "L'état « active (running) » de systemctl status apache2 indique qu'Apache tourne.", a: true, exp: "Oui : running signifie que le service est bien démarré." },
    { type: "input", q: "Quel fichier journal contient les erreurs d'Apache ?", a: ["/var/log/apache2/error.log", "error.log", "var/log/apache2/error.log"], ph: "un chemin", exp: "Les erreurs d'Apache s'écrivent dans /var/log/apache2/error.log." },
    { type: "qcm", q: "La page marche en localhost mais pas depuis un autre poste. Cause la plus probable ?", opts: ["Le disque est plein", "Le pare-feu bloque le port 80 (ou mauvaise IP)", "Le DNS ne résout pas le nom du serveur", "Apache n'écoute que sur l'interface loopback"], a: 1, exp: "Un pare-feu fermant le port 80 (ou une IP erronée) empêche l'accès distant." },
    { type: "input", q: "Quelle commande ufw ouvre le port HTTP ?", a: ["sudo ufw allow 80/tcp", "ufw allow 80/tcp", "ufw allow 80"], ph: "ufw ...", exp: "ufw allow 80/tcp autorise le trafic web entrant." },
    { type: "qcm", q: "Sous quel utilisateur système Apache lit-il les fichiers du site (Debian/Ubuntu) ?", opts: ["root", "www-data", "admin", "apache-user"], a: 1, exp: "Sous Debian/Ubuntu, Apache tourne sous l'utilisateur www-data." },
    { type: "vf", q: "Après avoir modifié la configuration, mieux vaut tester avec apache2ctl configtest avant de recharger.", a: true, exp: "Oui : configtest détecte les erreurs avant qu'elles ne cassent le service." },
    { type: "qcm", q: "Quelle URL permet de tester le site depuis la machine elle-même ?", opts: ["http://localhost/", "ftp://serveur/", "ssh://localhost/", "file:///etc/"], a: 0, exp: "http://localhost/ interroge Apache sur la machine locale." }
  ],
  final: {
    title: "Exercice final — Mettre en ligne le site de Mercado",
    intro: `<p>Tu disposes d'un serveur Ubuntu vierge d'adresse <strong>192.168.1.20</strong>. Objectif : y publier la page d'accueil de « Mercado » et la rendre accessible depuis les autres postes du réseau. Décris la marche à suivre.</p>`,
    questions: [
      { type: "qcm", q: "Première étape ?", opts: ["Écrire index.html", "Installer Apache (sudo apt install apache2)", "Ouvrir le pare-feu", "Tester curl"], a: 1, exp: "Sans serveur web installé, rien ne peut répondre : on installe Apache d'abord." },
      { type: "input", q: "Dans quel dossier déposes-tu le fichier index.html du site ?", a: ["/var/www/html", "var/www/html"], ph: "un chemin", exp: "La racine web par défaut est /var/www/html." },
      { type: "qcm", q: "Pour que le site survive à un redémarrage, tu lances…", opts: ["systemctl enable apache2", "systemctl restart apache2", "systemctl mask apache2", "reboot uniquement"], a: 0, exp: "enable relance automatiquement Apache au démarrage." },
      { type: "input", q: "Quelle commande ouvre le port 80 dans ufw pour l'accès distant ?", a: ["sudo ufw allow 80/tcp", "ufw allow 80/tcp", "ufw allow 80"], ph: "ufw ...", exp: "ufw allow 80/tcp autorise les visiteurs à joindre le port HTTP." },
      { type: "qcm", q: "Depuis un autre poste, quelle URL permet de vérifier ?", opts: ["http://localhost/", "http://192.168.1.20/", "ssh://192.168.1.20/", "http://127.0.0.1/"], a: 1, exp: "Depuis un autre poste, on vise l'IP réelle du serveur : 192.168.1.20." }
    ],
    solution: `<pre class="pseudo"># Deploiement du site Mercado, de A a Z :
1) sudo apt update && sudo apt install apache2
2) sudo systemctl enable --now apache2      # demarre + active au boot
3) echo "&lt;h1&gt;Bienvenue chez Mercado&lt;/h1&gt;" | sudo tee /var/www/html/index.html
4) sudo ufw allow 80/tcp                     # ouvrir HTTP au pare-feu
5) Tests : curl http://localhost/  puis  http://192.168.1.20/ (autre poste)
   Souci ? -&gt; sudo tail -f /var/log/apache2/error.log</pre>
<p>Le site est en ligne et accessible depuis le réseau. Demain : faire coopérer trois services (DHCP, DNS et web) dans une même petite infrastructure.</p>`
  }
};
</script>
