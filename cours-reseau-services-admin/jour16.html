<script>
var DAY = {
  num: 16,
  title: "Tester le DNS (nslookup, dig)",
  subtitle: "Interroger, lire les réponses et diagnostiquer : les outils du technicien DNS.",
  theory: `
<h3>1. Deux outils pour poser des questions au DNS</h3>
<p>Configurer un serveur, c'est bien ; vérifier qu'il répond correctement, c'est indispensable. Deux outils dominent. <strong>nslookup</strong> (« name server lookup ») est présent partout, y compris sur Windows : simple, idéal pour un test rapide. <strong>dig</strong> (« Domain Information Groper ») est l'outil de référence sous Linux/macOS : plus verbeux, plus précis, parfait pour diagnostiquer.</p>
<h3>2. nslookup en un coup d'œil</h3>
<pre class="pseudo">nslookup www.exemple.com
# Server:   192.168.1.1        &lt;- le resolver interroge
# Address:  192.168.1.1#53
# Non-authoritative answer:    &lt;- reponse depuis un cache
# Name:  www.exemple.com
# Address: 93.184.216.34

nslookup -type=MX exemple.com   # demander un type precis (ici MX)
nslookup www.exemple.com 8.8.8.8  # interroger un serveur DNS specifique</pre>
<p>La mention <em>Non-authoritative answer</em> signale que la réponse vient d'un cache et non du serveur autoritatif : c'est normal et correct.</p>
<h3>3. dig, l'outil de référence</h3>
<p>La forme générale est <code>dig [@serveur] nom [type]</code>. Par défaut dig demande un enregistrement A.</p>
<pre class="pseudo">dig www.exemple.com            # type A par defaut
dig exemple.com MX             # le query type est MX
dig @8.8.8.8 exemple.com NS    # interroger le serveur 8.8.8.8, type NS
dig +short www.exemple.com     # reponse minimale (juste l'IP)
dig -x 93.184.216.34           # resolution INVERSE (genere le PTR)</pre>
<div class="tip">L'option <code>+short</code> ne garde que l'essentiel : idéale dans les scripts. L'option <code>-x</code> lance directement une requête inverse (PTR) sans écrire soi-même l'adresse in-addr.arpa.</div>
<h3>4. Lire une réponse dig</h3>
<p>La sortie complète de dig est structurée en sections. Il faut savoir les repérer :</p>
<pre class="pseudo">;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR, id: 12345
;; QUESTION SECTION:      &lt;- ce qu'on a demande (nom + type)
;www.exemple.com.  IN  A
;; ANSWER SECTION:        &lt;- la reponse tant attendue
www.exemple.com.  3600  IN  A  93.184.216.34
;; AUTHORITY SECTION:     &lt;- les serveurs autoritatifs (NS)
;; ADDITIONAL SECTION:    &lt;- infos complementaires (ex : IP des NS)</pre>
<p>Le <strong>status</strong> dans l'en-tête est capital : <strong>NOERROR</strong> = tout va bien, <strong>NXDOMAIN</strong> = le nom n'existe pas, <strong>SERVFAIL</strong> = le serveur a échoué (souvent une config cassée ou injoignable). L'ANSWER SECTION contient la réponse ; sa colonne juste après le nom est le TTL.</p>
<h3>5. Le query type et le diagnostic</h3>
<p>Le <strong>query type</strong> (type de requête) précise ce qu'on cherche : A, AAAA, MX, NS, TXT, PTR, SOA… En variant le type, on vérifie chaque facette d'une zone. Comparer la réponse d'un serveur donné (<code>@monserveur</code>) à celle d'un resolver public permet de savoir si un problème vient de ton serveur ou de la propagation.</p>
<div class="warn">Un SERVFAIL n'est pas « le nom n'existe pas » (ça, c'est NXDOMAIN) : c'est le serveur qui n'a pas pu répondre. Vérifie alors la config, le serial, les autorisations et que named tourne bien.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># nslookup : simple, partout (Windows inclus)  |  dig : precis, Linux/macOS
# dig [@serveur] nom [type]   ; type A par defaut
# dig +short  -> reponse minimale   ; dig -x IP -> resolution inverse (PTR)
# Sections dig : QUESTION / ANSWER / AUTHORITY / ADDITIONAL
# status : NOERROR (ok) | NXDOMAIN (nom inexistant) | SERVFAIL (echec serveur)
# Non-authoritative answer = reponse issue d'un cache (normal)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel outil est disponible partout, y compris sur Windows ?", opts: ["dig", "nslookup", "traceroute", "named"], a: 1, exp: "nslookup est présent sur Windows, Linux et macOS." },
    { type: "qcm", q: "Quelle est la forme générale d'une commande dig ?", opts: ["dig nom [@serveur]", "dig [@serveur] nom [type]", "dig type nom serveur", "dig -all nom"], a: 1, exp: "dig [@serveur] nom [type] ; le type A est demandé par défaut." },
    { type: "qcm", q: "Par défaut, quel type d'enregistrement dig demande-t-il ?", opts: ["MX", "A", "TXT", "PTR"], a: 1, exp: "Sans précision, dig interroge le type A." },
    { type: "qcm", q: "Que fait l'option dig -x ?", opts: ["Une résolution inverse (PTR)", "Une réponse courte", "Un transfert de zone", "Un test de ping"], a: 0, exp: "-x lance une requête inverse à partir d'une IP (génère le PTR)." },
    { type: "qcm", q: "Dans la sortie de dig, où se trouve la réponse attendue ?", opts: ["QUESTION SECTION", "ANSWER SECTION", "ADDITIONAL SECTION", "HEADER"], a: 1, exp: "L'ANSWER SECTION contient la réponse (nom, TTL, type, valeur)." },
    { type: "qcm", q: "Que signifie le status NXDOMAIN ?", opts: ["Tout va bien", "Le nom n'existe pas", "Le serveur a échoué", "La zone est transférée"], a: 1, exp: "NXDOMAIN = nom inexistant. NOERROR = ok, SERVFAIL = échec serveur." },
    { type: "vf", q: "La mention « Non-authoritative answer » de nslookup indique une erreur.", a: false, exp: "Faux : elle signale simplement une réponse issue d'un cache. C'est normal." },
    { type: "vf", q: "dig +short donne une réponse minimale, pratique dans les scripts.", a: true, exp: "Vrai : +short ne garde que l'essentiel (par exemple juste l'IP)." },
    { type: "vf", q: "SERVFAIL signifie que le nom demandé n'existe pas.", a: false, exp: "Faux : ça, c'est NXDOMAIN. SERVFAIL = le serveur n'a pas pu répondre (config, panne)." },
    { type: "vf", q: "On peut préciser le serveur à interroger avec dig grâce à @adresse.", a: true, exp: "Vrai : dig @8.8.8.8 exemple.com interroge le serveur 8.8.8.8." },
    { type: "input", q: "Quelle commande (un mot) est l'outil DNS de référence sous Linux/macOS ?", a: ["dig"], ph: "3 lettres", exp: "dig (Domain Information Groper)." },
    { type: "input", q: "Quel status dig indique que tout s'est bien passé ?", a: ["noerror"], ph: "un mot", exp: "NOERROR : la requête a réussi." },
    { type: "input", q: "Quelle option de dig donne une réponse minimale ?", a: ["+short", "short"], ph: "+...", exp: "+short réduit la sortie à l'essentiel." },
    { type: "input", q: "Comment appelle-t-on le paramètre qui précise le type d'enregistrement cherché ? (deux mots)", a: ["query type", "le query type", "type de requete"], ph: "deux mots", exp: "Le query type (type de requête) : A, MX, NS, TXT…" },
    { type: "input", q: "Écris la commande dig qui demande les enregistrements MX de exemple.com.", a: ["dig exemple.com mx", "dig exemple.com MX"], ph: "dig ...", exp: "dig exemple.com MX interroge le query type MX." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer une panne de mail",
    intro: `<p>Les utilisateurs de <code>societe.fr</code> ne reçoivent plus d'e-mails. L'administrateur soupçonne un problème d'enregistrement MX. Son serveur DNS interne est en 192.168.0.53. Aidons-le à mener le diagnostic avec dig.</p>`,
    questions: [
      { type: "input", q: "Quelle commande dig vérifie les MX de societe.fr auprès du serveur interne 192.168.0.53 ?", a: ["dig @192.168.0.53 societe.fr mx", "dig @192.168.0.53 societe.fr MX"], ph: "dig @... nom type", exp: "dig @192.168.0.53 societe.fr MX interroge le serveur interne pour le type MX." },
      { type: "qcm", q: "La réponse recherchée apparaîtra dans quelle section ?", opts: ["QUESTION SECTION", "ANSWER SECTION", "HEADER", "ADDITIONAL SECTION"], a: 1, exp: "Les enregistrements MX trouvés figurent dans l'ANSWER SECTION." },
      { type: "qcm", q: "dig renvoie status: SERVFAIL. Que faut-il en déduire ?", opts: ["Le domaine n'existe pas", "Le serveur n'a pas pu répondre (config ou panne)", "Tout va bien", "Le mail est arrivé"], a: 1, exp: "SERVFAIL = échec du serveur : vérifier config, serial, service named." },
      { type: "qcm", q: "Pour comparer, il interroge un resolver public. Quelle commande ?", opts: ["dig @8.8.8.8 societe.fr MX", "dig -x societe.fr", "nslookup 8.8.8.8", "dig +short 53"], a: 0, exp: "dig @8.8.8.8 societe.fr MX compare la réponse d'un resolver public." },
      { type: "vf", q: "Si le serveur public répond NOERROR avec les MX mais pas le serveur interne, le problème vient de la config interne.", a: true, exp: "Vrai : la comparaison localise la panne sur le serveur interne." }
    ],
    solution: `<pre class="pseudo"># Diagnostic pas a pas :
dig @192.168.0.53 societe.fr MX    # tester le serveur interne
#   -> status SERVFAIL ? config cassee, serial, named arrete...
dig @8.8.8.8 societe.fr MX         # comparer avec un resolver public
#   -> NOERROR + MX ok cote public => le probleme est LOCAL
dig +short societe.fr MX           # verification rapide une fois corrige
# Rappel status : NOERROR (ok) | NXDOMAIN (inexistant) | SERVFAIL (echec)</pre>
<p>Interroger, lire les sections, comparer les serveurs : c'est toute la méthode du diagnostic DNS. Tu as désormais fait le tour du DNS, de la théorie des enregistrements jusqu'au dépannage sur le terrain.</p>`
  }
};
</script>
