  theory: `
<h3>1. Le problème : chaque machine a besoin d'une identité</h3>
<p>Pour communiquer sur un réseau IP, une machine a besoin d'au moins quatre informations : une <strong>adresse IP</strong> unique, un <strong>masque de sous-réseau</strong> (pour savoir qui est « voisin »), une <strong>passerelle par défaut</strong> (la porte de sortie vers les autres réseaux) et l'adresse d'un <strong>serveur DNS</strong> (pour traduire les noms). Sans ces quatre éléments, la machine est isolée : elle ne peut ni sortir, ni résoudre un nom.</p>
<h3>2. La solution manuelle et ses limites</h3>
<p>On pourrait tout saisir à la main sur chaque poste : c'est la <strong>configuration statique</strong> (IP fixe). Sur trois machines, pourquoi pas. Sur trois cents, c'est un cauchemar. Chaque nouvelle machine demande une intervention, il faut tenir un registre pour éviter les doublons, et un ordinateur portable qui passe d'un bureau à un autre garderait une adresse inadaptée.</p>
<pre class="pseudo"># Config manuelle (statique), a repeter sur CHAQUE poste :
adresse IP        : 192.168.1.42
masque            : 255.255.255.0
passerelle        : 192.168.1.1
serveur DNS       : 192.168.1.1
# Multiplie par 300 postes... et gare aux doublons d'adresses !</pre>
<div class="warn">Deux machines avec la MÊME adresse IP = <strong>conflit d'adresse</strong>. Les communications deviennent erratiques (paquets mal aiguillés). La saisie manuelle multiplie ce risque d'erreur humaine.</div>
<h3>3. Le DHCP : la distribution automatique</h3>
<p>Le <strong>DHCP</strong> (en anglais <em>Dynamic Host Configuration Protocol</em>, « protocole de configuration dynamique des hôtes ») résout tout cela. Un <strong>serveur DHCP</strong> gère une réserve d'adresses (une <strong>plage</strong>, en anglais <em>pool</em> ou <em>scope</em>) et distribue automatiquement, à toute machine qui se branche, son IP, son masque, sa passerelle et son DNS. La machine n'a rien à saisir : elle demande, le serveur répond.</p>
<div class="tip">Sur presque tous les appareils, le réglage réseau par défaut est « <strong>obtenir une adresse IP automatiquement</strong> » : cela signifie « utiliser le DHCP ». C'est pourquoi ton téléphone se connecte au Wi-Fi sans que tu tapes la moindre adresse.</div>
<h3>4. Les avantages concrets</h3>
<p>Le DHCP apporte trois bénéfices majeurs. <strong>Zéro configuration côté utilisateur</strong> : on branche, ça marche. <strong>Pas de doublons</strong> : le serveur tient la comptabilité des adresses déjà distribuées. <strong>Mobilité</strong> : un portable qui change de site reçoit à chaque fois une configuration adaptée au réseau local. L'administrateur, lui, gère les paramètres à un seul endroit (le serveur) au lieu de courir de poste en poste.</p>
<h3>5. Quand garder du statique ?</h3>
<p>Le DHCP est idéal pour les postes clients. Mais certains équipements ont besoin d'une adresse <strong>toujours identique</strong> : serveurs, imprimantes réseau, routeurs. On leur donne alors une IP fixe, soit en statique pur, soit via une <strong>réservation</strong> DHCP (on verra cela au jour 4). L'idée : automatiser le grand nombre, fixer le petit nombre stratégique.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DHCP = Dynamic Host Configuration Protocol
# Distribue automatiquement : IP + masque + passerelle + DNS
# Evite : la saisie manuelle, les doublons, les erreurs humaines
# Permet : la mobilite (portable qui change de reseau)

    { type: "qcm", q: "Pourquoi ton téléphone se connecte-t-il au Wi-Fi sans que tu tapes d'adresse ?", opts: ["Parce qu'il n'a pas besoin d'IP", "Parce qu'il obtient sa configuration via le DHCP", "Parce que le routeur lui impose une adresse fixe", "Parce que son adresse IP est gravée dans la carte Wi-Fi"], a: 1, exp: "Le téléphone demande sa config au serveur DHCP du réseau." },
