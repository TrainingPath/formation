<title>Jour 09</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 9,
  title: "Les types d'enregistrements DNS (A, AAAA, MX, CNAME, NS, PTR, TXT)",
  subtitle: "Un annuaire n'a pas qu'une colonne : découvre les grandes familles de fiches DNS.",
  theory: `
<h3>1. Le DNS, un annuaire à plusieurs colonnes</h3>
<p>Le <strong>DNS</strong> (« Domain Name System », système de noms de domaine) traduit des noms lisibles comme <em>www.exemple.com</em> en informations techniques. On imagine souvent qu'il ne renvoie qu'une adresse IP, mais c'est un annuaire riche : pour un même nom, il peut stocker plusieurs types de fiches. Chaque fiche s'appelle un <strong>enregistrement</strong> (en anglais <em>resource record</em>, ou RR), et son <strong>type</strong> indique la nature de l'information : une adresse, un serveur de courrier, un alias, du texte…</p>
<p>Comprendre les types, c'est comme distinguer, dans un annuaire papier, la colonne « téléphone fixe », « mobile » et « adresse postale » : même personne, informations différentes.</p>
<h3>2. Trouver une machine : A et AAAA</h3>
<p>L'enregistrement <strong>A</strong> (« Address ») associe un nom à une adresse <strong>IPv4</strong> (ex : 93.184.216.34). L'enregistrement <strong>AAAA</strong> (prononcé « quad-A ») fait la même chose pour une adresse <strong>IPv6</strong> (ex : 2606:2800:220:1:248:1893:25c8:1946). Le nom « quatre A » vient de la taille : une IPv6 (128 bits) est quatre fois plus longue qu'une IPv4 (32 bits).</p>
<pre class="pseudo">www.exemple.com.   IN  A     93.184.216.34
www.exemple.com.   IN  AAAA  2606:2800:220:1:248:1893:25c8:1946</pre>
<h3>3. Le courrier et les alias : MX et CNAME</h3>
<p>L'enregistrement <strong>MX</strong> (« Mail eXchanger ») indique <em>quel serveur reçoit le courrier</em> d'un domaine. Il comporte une <strong>priorité</strong> : le plus petit nombre est essayé en premier, les autres servent de secours.</p>
<pre class="pseudo">exemple.com.   IN  MX  10 mail1.exemple.com.
exemple.com.   IN  MX  20 mail2.exemple.com.   # secours (priorite plus haute)</pre>
<p>L'enregistrement <strong>CNAME</strong> (« Canonical Name », nom canonique) crée un <strong>alias</strong> : il dit « ce nom est un autre nom pour… ». Pratique pour que <em>boutique.exemple.com</em> pointe vers <em>www.exemple.com</em> sans dupliquer l'adresse IP.</p>
<div class="warn">Un CNAME ne doit jamais coexister avec un autre enregistrement pour le même nom, et on ne met jamais de CNAME à la racine d'un domaine (l'apex). C'est une source classique d'erreurs de configuration.</div>
<h3>4. Déléguer et pointer à l'envers : NS et PTR</h3>
<p>L'enregistrement <strong>NS</strong> (« Name Server ») désigne les <strong>serveurs de noms autoritatifs</strong> responsables d'une zone. C'est lui qui organise la délégation : « pour tout ce qui finit par .exemple.com, demande à ces serveurs-là ». L'enregistrement <strong>PTR</strong> (« Pointer ») fait l'inverse d'un A : il associe une <strong>adresse IP à un nom</strong>. C'est la <em>résolution inverse</em>, utilisée notamment pour vérifier l'origine d'un serveur de courrier.</p>
<h3>5. Du texte libre : TXT</h3>
<p>L'enregistrement <strong>TXT</strong> stocke du texte libre. À l'origine pour des commentaires, il sert aujourd'hui surtout à prouver la propriété d'un domaine et à sécuriser le courrier (SPF, DKIM, DMARC).</p>
<pre class="pseudo">exemple.com.  IN  TXT  "v=spf1 include:_spf.exemple.com -all"</pre>
<div class="tip">Astuce mnémotechnique : A/AAAA = « où est la machine ? », MX = « où va le courrier ? », CNAME = « autre nom pour… », NS = « qui gère la zone ? », PTR = « à qui est cette IP ? », TXT = « une note libre ».</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># A     -> IPv4     (nom  => adresse 32 bits)
# AAAA  -> IPv6     (nom  => adresse 128 bits)
# MX    -> courrier (avec priorite : petit nombre = prioritaire)
# CNAME -> alias    (ce nom = un autre nom)
# NS    -> serveurs autoritatifs de la zone (delegation)
# PTR   -> resolution inverse (IP => nom)
# TXT   -> texte libre (SPF, DKIM, verification de domaine)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel enregistrement associe un nom à une adresse IPv4 ?", opts: ["AAAA", "A", "MX", "PTR"], a: 1, exp: "L'enregistrement A (Address) pointe vers une IPv4." },
    { type: "qcm", q: "À quoi sert l'enregistrement AAAA ?", opts: ["Associer un nom à une IPv6", "Associer un nom à une IPv4", "Déclarer un serveur mail", "Créer un alias"], a: 0, exp: "AAAA (quad-A) donne l'adresse IPv6, quatre fois plus longue que l'IPv4." },
    { type: "qcm", q: "Que représente le nombre dans un enregistrement MX ?", opts: ["Le port du serveur", "La priorité (petit = essayé en premier)", "Le TTL", "Le nombre de boîtes mail"], a: 1, exp: "Le plus petit chiffre de priorité est tenté d'abord ; les autres sont des secours." },
    { type: "qcm", q: "Quel enregistrement crée un alias vers un autre nom ?", opts: ["NS", "TXT", "CNAME", "PTR"], a: 2, exp: "CNAME (Canonical Name) dit « ce nom est un autre nom pour… »." },
    { type: "qcm", q: "Quel enregistrement désigne les serveurs autoritatifs d'une zone ?", opts: ["NS", "A", "MX", "SOA"], a: 0, exp: "NS (Name Server) liste les serveurs responsables de la zone : c'est la délégation." },
    { type: "qcm", q: "L'enregistrement PTR sert à…", opts: ["Trouver l'IP d'un nom", "Trouver le nom d'une IP (résolution inverse)", "Router le courrier", "Stocker une clé DKIM"], a: 1, exp: "PTR fait l'inverse d'un A : d'une IP vers un nom." },
    { type: "vf", q: "Un même nom DNS ne peut avoir qu'un seul type d'enregistrement.", a: false, exp: "Faux : un nom peut avoir A, AAAA, MX, TXT… simultanément. Le DNS a plusieurs colonnes." },
    { type: "vf", q: "On peut placer un CNAME à la racine (apex) d'un domaine.", a: false, exp: "Non : un CNAME ne coexiste avec aucun autre enregistrement, ce qui l'interdit à l'apex." },
    { type: "vf", q: "L'enregistrement TXT sert notamment à publier des politiques SPF/DKIM/DMARC.", a: true, exp: "Vrai : le TXT stocke ces textes de sécurité du courrier." },
    { type: "vf", q: "Une adresse IPv6 est stockée dans un enregistrement A.", a: false, exp: "Faux : l'IPv6 va dans un AAAA ; le A est réservé à l'IPv4." },
    { type: "input", q: "Quel type d'enregistrement (sigle) indique le serveur qui reçoit le courrier d'un domaine ?", a: ["mx"], ph: "2 lettres", exp: "MX = Mail eXchanger." },
    { type: "input", q: "Quel type d'enregistrement (sigle) associe un nom à une adresse IPv4 ?", a: ["a"], ph: "1 lettre", exp: "L'enregistrement A." },
    { type: "input", q: "Comment appelle-t-on en français la résolution qui va d'une IP vers un nom (via PTR) ?", a: ["resolution inverse", "inverse", "resolution reverse", "reverse"], ph: "deux mots", exp: "La résolution inverse (reverse DNS)." },
    { type: "input", q: "Quel type d'enregistrement (sigle) désigne les serveurs de noms autoritatifs d'une zone ?", a: ["ns"], ph: "2 lettres", exp: "NS = Name Server." },
    { type: "input", q: "Quel type d'enregistrement (sigle) stocke du texte libre comme le SPF ?", a: ["txt"], ph: "3 lettres", exp: "TXT stocke du texte, dont les politiques SPF/DKIM/DMARC." }
  ],
  final: {
    title: "Exercice final — Concevoir les fiches DNS d'une PME",
    intro: `<p>La société <em>Bonjour SARL</em> ouvre son domaine <code>bonjour.fr</code>. Elle veut un site web joignable en IPv4 et IPv6, recevoir des e-mails, faire pointer <code>shop.bonjour.fr</code> vers le site, et prouver la propriété du domaine à un prestataire. Aide l'administrateur à choisir les bons types.</p>`,
    questions: [
      { type: "qcm", q: "Pour rendre www.bonjour.fr joignable en IPv4, on crée un…", opts: ["AAAA", "A", "CNAME", "MX"], a: 1, exp: "Un enregistrement A pour l'IPv4." },
      { type: "qcm", q: "Pour la même machine en IPv6, on ajoute un…", opts: ["A", "AAAA", "PTR", "NS"], a: 1, exp: "Un AAAA pour l'adresse IPv6." },
      { type: "qcm", q: "Pour que shop.bonjour.fr renvoie vers www.bonjour.fr, on utilise un…", opts: ["MX", "TXT", "CNAME", "PTR"], a: 2, exp: "Un CNAME : alias vers le nom canonique du site." },
      { type: "input", q: "Pour recevoir les e-mails de bonjour.fr, quel type (sigle) faut-il déclarer ?", a: ["mx"], ph: "2 lettres", exp: "Un MX pointant vers le serveur de courrier." },
      { type: "qcm", q: "Pour prouver au prestataire la propriété du domaine, on publie souvent un…", opts: ["TXT contenant un jeton de vérification", "PTR", "A supplémentaire", "NS"], a: 0, exp: "La vérification de propriété passe classiquement par un enregistrement TXT." }
    ],
    solution: `<pre class="pseudo"># Zone bonjour.fr (extrait)
www.bonjour.fr.   IN  A      203.0.113.10
www.bonjour.fr.   IN  AAAA   2001:db8::10
shop.bonjour.fr.  IN  CNAME  www.bonjour.fr.
bonjour.fr.       IN  MX     10 mail.bonjour.fr.
bonjour.fr.       IN  TXT    "verification=xyz123"</pre>
<p>Chaque besoin correspond à un type précis : localiser la machine (A/AAAA), router le courrier (MX), créer un alias (CNAME), publier une preuve textuelle (TXT). Demain : comment ces fiches sont retrouvées, étape par étape.</p>`
  }
};
</script>
