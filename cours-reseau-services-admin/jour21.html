  title: "Le service de temps (NTP)",
  subtitle: "Mettre toutes les horloges du réseau à la même heure.",
  theory: `
<h3>1. Pourquoi l'heure exacte compte</h3>
<p>Chaque ordinateur possède une horloge interne, mais elle <strong>dérive</strong> : elle avance ou retarde de quelques secondes par jour. Sur une seule machine, ce n'est pas grave. Sur un réseau de dizaines de serveurs, c'est un désastre. Comparer les <strong>journaux</strong> (logs) de deux serveurs devient impossible si leurs horloges diffèrent. Les certificats de sécurité, les tickets d'authentification (Kerberos), les sauvegardes et les transactions bancaires exigent une heure commune et précise.</p>
<p>La solution est le <strong>NTP</strong> (« Network Time Protocol », protocole de temps réseau). Il permet à une machine de <strong>synchroniser</strong> son horloge sur une référence fiable, à travers le réseau, en corrigeant même les délais de transmission.</p>
<h3>2. Le principe de la synchronisation</h3>
<p>Un client NTP interroge régulièrement un ou plusieurs <strong>serveurs de temps</strong>. Il mesure le temps aller-retour des messages pour estimer le délai réseau, puis ajuste doucement son horloge — sans « sauter » brutalement d'une heure à l'autre, ce qui perturberait les programmes en cours. NTP est très précis : sur un réseau local, il atteint souvent la milliseconde.</p>
<pre class="pseudo"># NTP fonctionne sur le port 123 en UDP :
Client  --- requête temps ---&gt;  Serveur NTP   (port 123/UDP)
Client  &lt;-- heure + horodatage ---
Le client calcule le décalage et corrige son horloge en douceur.</pre>
<div class="tip">NTP utilise le port <strong>123</strong> en <strong>UDP</strong> (et non TCP). UDP est un transport léger et rapide, sans connexion : parfait pour de petits échanges d'horodatage fréquents.</div>
<h3>3. Les strates (stratum)</h3>
<p>NTP organise les serveurs de temps en niveaux hiérarchiques appelés <strong>strates</strong> (en anglais <em>stratum</em>). La strate indique la <strong>distance à l'horloge de référence</strong>, pas la qualité en soi. Le compte va de <strong>0 à 15</strong>.</p>
<pre class="pseudo"># La hiérarchie des strates :
Stratum 0  = source de référence (horloge atomique, GPS)  -- pas sur le réseau
Stratum 1  = serveur directement relié à une source stratum 0
Stratum 2  = serveur synchronisé sur un stratum 1
Stratum 3  = synchronisé sur un stratum 2   ... et ainsi de suite
Stratum 15 = dernier niveau valide
Stratum 16 = NON synchronisé (horloge non fiable)</pre>
<p>Chaque niveau ajoute un petit décalage. Plus la strate est basse (proche de 0), plus la source est proche de la référence. En pratique, on se synchronise sur des serveurs stratum 2 ou 3, largement assez précis.</p>
<h3>4. Configurer NTP en pratique</h3>
<p>Sur les Linux modernes, le service de temps le plus courant est <strong>chrony</strong> (ou l'ancien <strong>ntpd</strong>, et <strong>systemd-timesyncd</strong> pour les postes légers). On indique un ou plusieurs serveurs, souvent via le projet public <strong>pool.ntp.org</strong>, un vaste ensemble de serveurs partagés.</p>
<pre class="pseudo"># Extrait de configuration (chrony : /etc/chrony/chrony.conf)
pool 2.pool.ntp.org iburst      # serveurs de temps publics
# Vérifier l'état de la synchronisation :
chronyc tracking                # décalage, strate, source utilisée
timedatectl                     # heure système + statut NTP (actif ?)</pre>
<div class="warn">Ne configure pas une machine pour qu'elle soit à la fois sa propre référence et cliente d'elle-même : tu obtiendrais une heure « inventée ». Synchronise toujours sur une source externe fiable (pool public ou serveur interne relié à une source sûre).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># NTP = Network Time Protocol : synchronise les horloges via le réseau
# Port 123 en UDP (léger, sans connexion)
# STRATES (stratum) 0 à 15 : distance à la source de référence
#   0 = horloge de référence (GPS/atomique) | 1 = relié direct | 2,3... = en cascade
#   16 = non synchronisé (non fiable)
# Outils : chrony (chronyc tracking), ntpd, timedatectl ; serveurs pool.ntp.org
# Utilité : logs cohérents, sécurité, certificats, authentification</pre>`,

    { type: "vf", q: "Plus le numéro de strate est élevé, plus on s'éloigne de la source de référence.", a: true, exp: "Oui : chaque niveau supplémentaire ajoute un pas depuis la référence." },
    { type: "input", q: "Jusqu'à quel numéro vont les strates valides (le maximum) ?", a: ["15", "strate 15", "stratum 15"], ph: "un nombre", exp: "Les strates valides vont de 0 à 15 ; 16 signifie « non synchronisé »." },
    { type: "qcm", q: "Que signifie un stratum 16 ?", opts: ["La meilleure précision", "Horloge non synchronisée (non fiable)", "Un serveur GPS", "Une source de référence atomique"], a: 1, exp: "Stratum 16 indique une machine non synchronisée, dont l'heure n'est pas fiable." },
    { type: "vf", q: "Un décalage d'horloge entre serveurs complique la comparaison de leurs journaux (logs).", a: true, exp: "Oui : sans heure commune, corréler les événements de deux serveurs devient très difficile." },

    { type: "input", q: "Cite un service/logiciel de synchronisation de temps courant sous Linux moderne.", a: ["chrony", "ntpd", "systemd-timesyncd", "timesyncd", "chronyd"], ph: "un nom", exp: "chrony (chronyd), ntpd ou systemd-timesyncd assurent la synchronisation." },
    { type: "vf", q: "NTP ajuste l'horloge en douceur plutôt que de la faire sauter brutalement.", a: true, exp: "Oui : un ajustement progressif évite de perturber les programmes en cours." }
  ],

      { type: "qcm", q: "Sur quel type de source ses serveurs devraient-ils se synchroniser ?", opts: ["Sur eux-mêmes", "Sur une source externe fiable (pool.ntp.org ou serveur interne sûr)", "Sur l'horloge du BIOS de chaque machine", "Sur un serveur stratum 16 quelconque"], a: 1, exp: "Il faut une source externe fiable, jamais une machine se référençant elle-même." },

    ],
    solution: `<pre class="pseudo"># Plan de Léna :
