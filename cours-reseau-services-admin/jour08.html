var DAY = {

  title: "L'arborescence des noms de domaine",
  subtitle: "De la racine au FQDN : un nom se lit de droite à gauche.",
  theory: `
<h3>1. Un annuaire trop grand pour un seul cahier</h3>
<p>Il existe des milliards de noms sur Internet. Impossible de tout mettre dans une seule liste centrale. Le DNS est donc organisé en <strong>arbre</strong> (une <strong>hiérarchie</strong>), à la manière des dossiers d'un disque dur. Chaque niveau délègue la gestion au niveau inférieur : personne ne connaît tout, chacun connaît sa branche. Cette structure permet de répartir la charge et l'autorité entre des millions d'acteurs.</p>
<pre class="pseudo"># L'arbre des noms (simplifie)
                 .  (racine)
              /   |   \\
           fr    com   org        &lt;- TLD (domaines de premier niveau)
           |      |
        gouv   exemple             &lt;- domaine (2e niveau)
                  |
                 www               &lt;- sous-domaine / hote
# On lit de DROITE a GAUCHE : www.exemple.com</pre>
<h3>2. La racine : le point de départ</h3>
<p>Tout en haut se trouve la <strong>racine</strong> (en anglais <em>root</em>), notée par un point « . » invisible en fin de nom. Elle est gérée par des <strong>serveurs racine</strong> répartis dans le monde. La racine ne connaît pas les noms complets : elle sait seulement vers quel serveur envoyer pour chaque extension (fr, com, org…).</p>
<h3>3. Les TLD : les grandes catégories</h3>
<p>Juste sous la racine, on trouve les <strong>domaines de premier niveau</strong> (en anglais <em>TLD</em>, Top-Level Domain). Ce sont les extensions finales : <strong>génériques</strong> (.com, .org, .net, .info) ou <strong>géographiques</strong> (en anglais <em>ccTLD</em> : .fr, .be, .ca…). C'est la partie la plus à droite d'un nom, juste avant le point-racine.</p>
<h3>4. Domaine et sous-domaine</h3>
<p>Sous un TLD, on enregistre un <strong>domaine</strong> (le 2e niveau) : dans <em>exemple.com</em>, « exemple » est le domaine, « com » le TLD. Le propriétaire du domaine peut créer autant de <strong>sous-domaines</strong> qu'il veut, en ajoutant des étiquettes à gauche : <em>www.exemple.com</em>, <em>mail.exemple.com</em>, <em>boutique.exemple.com</em>. Chaque étiquette (en anglais <em>label</em>) est séparée par un point.</p>
<div class="tip">Règle de lecture : un nom de domaine se lit <strong>de droite à gauche</strong>, du plus général au plus précis. Dans <em>www.exemple.com</em> : com (catégorie) → exemple (organisation) → www (machine ou service précis).</div>
<h3>5. Le FQDN : le nom complet et sans ambiguïté</h3>
<p>Quand on écrit un nom <strong>complet</strong>, de l'hôte jusqu'à la racine, on obtient un <strong>FQDN</strong> (en anglais <em>Fully Qualified Domain Name</em>, « nom de domaine pleinement qualifié »). Techniquement, il se termine par un point final qui représente la racine : <em>www.exemple.com.</em> Un FQDN est <strong>unique</strong> et ne dépend d'aucun contexte : il désigne une seule cible sur Internet.</p>
<pre class="pseudo"># Decomposition d'un FQDN
www . exemple . com .
 |      |       |   \\_ la racine (point final, souvent implicite)
 |      |       \\____ TLD (premier niveau)
 |      \\____________ domaine (deuxieme niveau)
 \\___________________ hote / sous-domaine</pre>
<div class="warn">Ne confonds pas un simple nom d'hôte (« www ») avec un FQDN (« www.exemple.com. »). Le nom d'hôte seul est ambigu ; le FQDN est complet et unique. En configuration serveur, on précise souvent le FQDN pour éviter toute confusion.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Le DNS est hierarchique : un ARBRE de noms
# Racine (.)  ->  TLD (fr, com...)  ->  domaine  ->  sous-domaine / hote
# On lit de DROITE a GAUCHE (general -> precis)
# TLD generiques (.com, .org) et geographiques / ccTLD (.fr, .be)
# FQDN = nom complet et unique, termine par un point (www.exemple.com.)</pre>`,

    { type: "qcm", q: "Lesquels sont des TLD génériques ?", opts: [".fr et .ca", ".com et .org", ".be et .de", ".uk et .jp"], a: 1, exp: ".com, .org, .net, .info sont génériques ; .fr/.ca/.be sont géographiques." },
    { type: "input", q: "Que signifie le sigle FQDN ?", a: ["fully qualified domain name", "nom de domaine pleinement qualifié", "nom de domaine pleinement qualifie", "fully-qualified domain name"], ph: "…", exp: "FQDN = Fully Qualified Domain Name (nom de domaine pleinement qualifié)." },
    { type: "vf", q: "Un FQDN techniquement complet se termine par un point final représentant la racine (ex : www.exemple.com.).", a: true, exp: "Oui : le point final symbolise la racine ; il est souvent implicite à l'usage." },
    { type: "qcm", q: "Quelle est la différence entre « www » seul et « www.exemple.com. » ?", opts: ["Le nom d'hôte seul est toujours unique", "« www » seul est ambigu ; le FQDN est complet et unique", "Le FQDN est plus court", "« www » est un TLD"], a: 1, exp: "Le nom d'hôte seul est ambigu ; le FQDN désigne une cible unique." },
    { type: "input", q: "Comment appelle-t-on chaque « morceau » d'un nom séparé par des points (www, exemple, com) ?", a: ["une étiquette", "étiquette", "label", "un label", "etiquette", "une etiquette (label)"], ph: "un mot", exp: "Chaque morceau est une étiquette (label), séparée par des points." },
    { type: "vf", q: "La racine connaît directement l'adresse IP de tous les sites du monde.", a: false, exp: "Non : la racine sait seulement vers quel serveur de TLD renvoyer. Elle délègue." },
    { type: "qcm", q: "Pourquoi le DNS est-il organisé en hiérarchie plutôt qu'en liste unique ?", opts: ["Pour être plus joli", "Pour répartir la charge et l'autorité (chacun gère sa branche)", "Pour ralentir Internet", "Sans raison"], a: 1, exp: "La hiérarchie répartit la gestion : personne ne gère tout, chacun sa branche." }
  ],

    questions: [
