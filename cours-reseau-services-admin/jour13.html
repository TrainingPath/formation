  theory: `
<h3>1. Bind, le vétéran du DNS</h3>
<p>Pour faire tourner son propre serveur DNS, le logiciel de référence sous Linux s'appelle <strong>Bind</strong> (« Berkeley Internet Name Domain »). Sa version actuelle est <strong>Bind 9</strong>, et le programme qui tourne en tâche de fond s'appelle <strong>named</strong> (prononcé « name-d », le démon de noms). C'est lui qui écoute les requêtes DNS sur le <strong>port 53</strong> et y répond.</p>
<h3>2. Installer le paquet</h3>
<p>Sur les distributions de la famille Debian/Ubuntu, le paquet s'appelle <strong>bind9</strong>. On l'installe avec le gestionnaire de paquets :</p>
<pre class="pseudo"># Debian / Ubuntu
sudo apt update
sudo apt install bind9 bind9-utils
# bind9-utils fournit des outils comme named-checkconf et named-checkzone

# Famille Red Hat / Rocky / Fedora, le paquet s'appelle "bind"
sudo dnf install bind bind-utils</pre>
<div class="tip">Sur Debian/Ubuntu, les fichiers de configuration vivent dans <code>/etc/bind/</code>. Le service se pilote avec <code>systemctl</code> : <code>sudo systemctl status named</code> (ou <code>bind9</code> selon la version).</div>
<h3>3. Le fichier central : named.conf</h3>
<p>Le point d'entrée de la configuration est <strong>named.conf</strong>. Sur Debian, il est découpé en plusieurs morceaux inclus pour rester lisible : <code>named.conf.options</code> (réglages généraux), <code>named.conf.local</code> (tes zones à toi), et <code>named.conf.default-zones</code>.</p>
<pre class="pseudo"># /etc/bind/named.conf.options : reglages generaux
options {
    directory "/var/cache/bind";
    recursion no;              // serveur autoritatif : pas de recursion ouverte
    listen-on { any; };
    allow-query { any; };
};</pre>
<h3>4. Déclarer une zone</h3>
<p>Une <strong>zone</strong> est la portion de l'arbre DNS dont ce serveur est responsable (par exemple <em>exemple.local</em>). On la déclare dans <code>named.conf.local</code> en indiquant son type (<strong>master</strong> pour le serveur maître) et le fichier qui contient les enregistrements.</p>
<pre class="pseudo">// /etc/bind/named.conf.local
zone "exemple.local" {
    type master;
    file "/etc/bind/db.exemple.local";
};</pre>
<h3>5. Vérifier avant de démarrer</h3>
<p>Bind fournit des outils de contrôle qui évitent bien des pannes. <strong>named-checkconf</strong> vérifie la syntaxe de la configuration, <strong>named-checkzone</strong> vérifie un fichier de zone. Toujours les lancer avant de recharger le service.</p>
<pre class="pseudo">sudo named-checkconf                              # verifie named.conf*
sudo named-checkzone exemple.local /etc/bind/db.exemple.local
sudo systemctl reload named                       # applique sans couper
sudo systemctl restart named                      # redemarrage complet si besoin</pre>
<div class="warn">Ouvre le port 53 (UDP et TCP) sur le pare-feu, sinon les clients ne pourront pas interroger ton serveur. Et n'active jamais la récursion ouverte sur un serveur exposé à Internet : c'est un risque de sécurité (amplification d'attaques).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Logiciel : Bind 9 ; demon : named ; port DNS : 53
# Paquet : bind9 (Debian/Ubuntu) ou bind (Red Hat)
# Config : /etc/bind/named.conf (+ .options, .local)
# Declarer une zone : zone "..." { type master; file "..."; };
# Verifier : named-checkconf et named-checkzone AVANT de recharger
# Appliquer : systemctl reload named ; ouvrir le port 53 au pare-feu</pre>`,

    ],
    solution: `<pre class="pseudo"># 1. Installer
sudo apt update && sudo apt install bind9 bind9-utils

# 2. Declarer la zone dans /etc/bind/named.conf.local

# 4. Appliquer + ouvrir le port 53
sudo systemctl reload named</pre>
<p>Le serveur est installé et sa zone déclarée. Mais le fichier de zone lui-même reste à écrire : c'est tout le sujet de demain.</p>`
