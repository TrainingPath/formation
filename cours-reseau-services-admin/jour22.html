  theory: `
<h3>1. Le principe du partage réseau</h3>
<p>Plutôt que de copier un fichier par clé USB ou par e-mail, on peut le placer sur un <strong>serveur de fichiers</strong> et le rendre accessible à travers le réseau. Chaque poste voit alors un dossier distant comme s'il était un disque local : on parle de <strong>partage de fichiers</strong> (en anglais <em>file sharing</em>). Deux grands protocoles dominent, selon le monde d'origine : <strong>SMB</strong> côté Windows, <strong>NFS</strong> côté Unix/Linux.</p>
<p>L'intérêt est énorme : un dossier commun partagé par toute une équipe, des sauvegardes centralisées, un espace unique toujours à jour. Fini les dix versions d'un même document éparpillées sur dix ordinateurs.</p>
<h3>2. SMB / CIFS : le partage à la mode Windows</h3>
<p><strong>SMB</strong> (« Server Message Block ») est le protocole de partage historique de <strong>Windows</strong>. On rencontre aussi le nom <strong>CIFS</strong> (« Common Internet File System »), un ancien dialecte de SMB : les deux termes sont souvent employés ensemble. SMB gère les fichiers <strong>mais aussi les imprimantes</strong> partagées et s'appuie sur les comptes utilisateurs pour les droits d'accès.</p>
<pre class="pseudo"># SMB écoute sur le port 445 (TCP)
# Accès Windows par chemin UNC :
\\\\serveur\\partage\\dossier
# Sous Linux, Samba fournit un serveur SMB. Monter un partage :
sudo mount -t cifs //serveur/partage /mnt/part -o username=alice</pre>
<div class="tip">Sur Linux, le logiciel <strong>Samba</strong> implémente SMB : il permet à une machine Linux de partager des dossiers avec des postes Windows, et inversement d'accéder à des partages Windows.</div>
<h3>3. NFS : le partage à la mode Unix</h3>
<p><strong>NFS</strong> (« Network File System ») est le protocole de partage natif du monde <strong>Unix/Linux</strong>. Il est réputé simple et performant sur un réseau local de confiance. Le serveur « exporte » un dossier ; les clients le « montent » dans leur arborescence, à un point de montage, et l'utilisent comme un dossier local.</p>
<pre class="pseudo"># Côté serveur NFS : déclarer l'export (fichier /etc/exports)
/data/partage   192.168.1.0/24(rw,sync)     # qui a accès, en lecture/écriture
# Côté client : monter l'export
sudo mount -t nfs serveur:/data/partage /mnt/data</pre>
<p>NFS traite l'identité par les identifiants numériques d'utilisateur (UID/GID) : il suppose souvent un réseau maîtrisé, d'où l'importance de bien le sécuriser ou de le réserver aux réseaux internes.</p>
<h3>4. SMB ou NFS : lequel choisir ?</h3>
<p>Le choix dépend surtout de l'écosystème. Un parc majoritairement <strong>Windows</strong> ? <strong>SMB</strong> est naturel (intégration native, gestion des droits par comptes). Un parc <strong>Linux/Unix</strong>, du calcul, des serveurs entre eux ? <strong>NFS</strong> est classique et efficace. En environnement mixte, Samba fait le pont. Beaucoup d'entreprises utilisent les deux selon les usages.</p>
<pre class="pseudo"># Comparaison express :
                 SMB / CIFS            NFS
Monde d'origine  Windows               Unix / Linux
Port principal   445 (TCP)             2049 (TCP)
Gère imprimantes oui                   non (fichiers seulement)
Cas d'usage      partage bureautique   serveurs Linux, calcul, home dirs</pre>
<div class="warn">Un partage de fichiers ouvre une porte sur tes données. Ne laisse jamais un partage accessible « à tout le monde » sans réfléchir aux droits (lecture seule vs écriture) ni aux réseaux autorisés. Un dossier partagé mal protégé est une fuite de données en puissance.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Partage de fichiers = accéder à un dossier distant comme un disque local
# SMB / CIFS  -> monde Windows, port 445 (TCP), gère aussi les imprimantes

# Choix : parc Windows -> SMB | parc Linux/serveurs -> NFS | mixte -> Samba
# Toujours : soigner les droits (lecture/écriture) et les réseaux autorisés</pre>`,

  ],

    intro: `<p>L'entreprise de Malik a des postes Windows au service commercial et des serveurs Linux à l'informatique. Il veut un dossier partagé pour les commerciaux (Windows) et un espace partagé entre serveurs Linux. Aide-le à choisir les bons protocoles.</p>`,
    questions: [

    ],
    solution: `<pre class="pseudo"># Choix de Malik :
