  theory: `
<h3>1. Apache, le serveur web historique</h3>
<p><strong>Apache HTTP Server</strong> (souvent appelé simplement « Apache ») est l'un des serveurs web les plus utilisés au monde. C'est un logiciel libre qui écoute les requêtes HTTP et sert des pages. Selon les systèmes, le paquet et le service ne portent pas le même nom : sur Debian/Ubuntu il s'appelle <strong>apache2</strong> ; sur Red Hat/CentOS/Fedora il s'appelle <strong>httpd</strong>. C'est le même logiciel, deux baptêmes différents.</p>
<pre class="pseudo"># Installer Apache selon la distribution :
# Debian / Ubuntu :
sudo apt install apache2
# Red Hat / CentOS / Fedora :
sudo dnf install httpd</pre>
<h3>2. Démarrer, arrêter, activer le service</h3>
<p>Une fois installé, Apache est un <strong>service</strong> (en anglais <em>daemon</em>, « démon ») : un programme d'arrière-plan géré par le système. Sur les Linux modernes, on le pilote avec <strong>systemctl</strong>. Il faut distinguer deux idées : <strong>démarrer</strong> le service maintenant (<em>start</em>) et l'<strong>activer</strong> pour qu'il redémarre automatiquement à chaque démarrage de la machine (<em>enable</em>).</p>
<pre class="pseudo"># Piloter le service (nom apache2 OU httpd selon la distro) :
sudo systemctl start apache2      # démarre maintenant
sudo systemctl enable apache2     # démarrage automatique au boot
sudo systemctl status apache2     # voir l'état (active/running ?)
sudo systemctl restart apache2    # relancer (après un changement de config)
sudo systemctl stop apache2       # arrêter</pre>
<div class="tip">Pour vérifier qu'Apache tourne, ouvre un navigateur sur <strong>http://localhost</strong> (ou http://127.0.0.1). Si tu vois la page d'accueil par défaut, le service est bien lancé.</div>
<h3>3. Le DocumentRoot : où vivent tes pages</h3>
<p>Apache ne sert pas n'importe quel fichier du disque : il sert ceux d'un dossier précis appelé le <strong>DocumentRoot</strong> (« racine des documents »). Par défaut, sous Debian/Ubuntu, c'est <strong>/var/www/html</strong>. Tout ce que tu déposes dans ce dossier devient accessible depuis le web. Si tu places un fichier <strong>index.html</strong> dedans, il sera affiché quand on demande l'adresse racine du site.</p>
<pre class="pseudo"># Le DocumentRoot par défaut :
/var/www/html/
# Y déposer une page d'accueil :
echo "&lt;h1&gt;Bonjour !&lt;/h1&gt;" | sudo tee /var/www/html/index.html
# Résultat visible sur http://localhost/</pre>
<h3>4. Les fichiers de configuration</h3>
<p>Le comportement d'Apache se règle dans des fichiers texte. Sous Debian/Ubuntu, la configuration principale est dans <strong>/etc/apache2/</strong> ; sous Red Hat, dans <strong>/etc/httpd/</strong>. Le fichier maître se nomme <strong>apache2.conf</strong> (ou httpd.conf). Le DocumentRoot, le port d'écoute et les options s'y déclarent. Après toute modification, il faut <strong>recharger</strong> ou <strong>redémarrer</strong> le service pour que le changement prenne effet.</p>
<pre class="pseudo"># Emplacements de config :
/etc/apache2/apache2.conf       # Debian / Ubuntu
/etc/httpd/conf/httpd.conf      # Red Hat / CentOS
# Directive clé dans la config :
DocumentRoot /var/www/html
# Vérifier la syntaxe avant de recharger :
sudo apache2ctl configtest      # doit afficher : Syntax OK</pre>
<div class="warn">Ne redémarre jamais Apache sans avoir vérifié la syntaxe (<strong>apache2ctl configtest</strong>). Une accolade ou une directive mal écrite empêche le service de repartir, et ton site tombe.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Paquet/service : apache2 (Debian/Ubuntu)  |  httpd (Red Hat/CentOS)

# DocumentRoot par défaut : /var/www/html  (là où vivent les pages)
# Config : /etc/apache2/  ou  /etc/httpd/
# Toujours : configtest AVANT restart. Tester sur http://localhost</pre>`,

    { type: "vf", q: "apache2 et httpd désignent en réalité le même logiciel, nommé différemment selon la distribution.", a: true, exp: "Oui : c'est Apache HTTP Server, appelé apache2 (Debian) ou httpd (Red Hat)." },
    { type: "qcm", q: "Quelle commande affiche si Apache est actif (running) ?", opts: ["systemctl status apache2", "systemctl check apache2", "systemctl info apache2", "systemctl state apache2"], a: 0, exp: "systemctl status apache2 montre l'état du service (active/running)." },
    { type: "vf", q: "Il est prudent de redémarrer Apache sans jamais vérifier la syntaxe de sa configuration.", a: false, exp: "Non : une erreur de config empêche le redémarrage. On lance d'abord configtest." }
  ],

    intro: `<p>Karim vient d'installer Apache sur un serveur Ubuntu. Il veut publier une page d'accueil, s'assurer que le service repart après un redémarrage de la machine, et vérifier que tout fonctionne. Guide-le étape par étape.</p>`,
