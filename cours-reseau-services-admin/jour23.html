var DAY = {

  title: "Le protocole SSH : administration à distance",
  subtitle: "Piloter un serveur à l'autre bout du monde, en toute confidentialité.",
  theory: `
<h3>1. Administrer une machine qu'on ne touche pas</h3>
<p>Un serveur vit souvent dans un datacenter, sans écran ni clavier, parfois à des milliers de kilomètres. Comment lui donner des ordres ? Grâce à <strong>SSH</strong> (« Secure Shell »), le standard de l'<strong>administration à distance</strong> (en anglais <em>remote administration</em>). SSH ouvre, depuis ta machine, un <strong>terminal</strong> sur la machine distante : tu tapes des commandes chez toi, elles s'exécutent là-bas, et les résultats reviennent sur ton écran.</p>
<p>SSH fait bien plus que le terminal : il permet aussi de <strong>copier des fichiers</strong> (avec scp ou sftp) et de faire passer d'autres connexions dans son tunnel chiffré. C'est le couteau suisse de l'administrateur système.</p>
<h3>2. Chiffré de bout en bout</h3>
<p>La grande force de SSH est le <strong>chiffrement</strong> : tout ce qui circule (commandes, mots de passe, résultats) est brouillé et illisible pour quiconque intercepterait le trafic. Même sur un réseau hostile (un Wi-Fi public), un espion ne verrait que des données incompréhensibles. SSH vérifie aussi l'identité du serveur, pour éviter de se connecter à un imposteur.</p>
<pre class="pseudo"># SSH écoute par défaut sur le port 22 (TCP)
# Se connecter à un serveur distant :
ssh alice@192.168.1.10        # utilisateur@adresse
ssh alice@serveur.exemple.fr  # ou par nom de domaine
# Copier un fichier vers le serveur (chiffré) :
scp rapport.pdf alice@serveur.exemple.fr:/home/alice/</pre>
<div class="tip">La syntaxe de base est <strong>ssh utilisateur@machine</strong>. À la première connexion, SSH affiche l'empreinte du serveur et te demande de la confirmer : c'est normal, il enregistre l'identité du serveur pour les fois suivantes.</div>
<h3>3. SSH remplace telnet</h3>
<p>Avant SSH, on utilisait <strong>telnet</strong> pour se connecter à distance. Mais telnet transmet <strong>tout en clair</strong>, y compris le mot de passe : n'importe qui sur le réseau pouvait le lire. C'était une catastrophe de sécurité. SSH est né précisément pour corriger cela : mêmes usages, mais <strong>chiffré</strong>. Aujourd'hui, telnet est considéré comme obsolète et dangereux pour l'administration ; SSH l'a remplacé partout.</p>
<pre class="pseudo"># Comparaison décisive :
telnet -> port 23, TOUT en clair (mot de passe lisible)   [OBSOLÈTE]
ssh    -> port 22, TOUT chiffré (confidentiel)            [STANDARD]</pre>
<div class="warn">Ne jamais administrer un serveur via telnet sur un vrai réseau : le mot de passe voyage en clair. Utilise toujours SSH. C'est une règle de base, non négociable, en administration système.</div>
<h3>4. Le modèle client-serveur de SSH</h3>
<p>SSH suit le modèle client-serveur. Sur la machine distante tourne le <strong>serveur SSH</strong> (le démon <strong>sshd</strong>, « SSH daemon ») qui écoute sur le port 22. Sur ta machine, tu utilises le <strong>client SSH</strong> (la commande <strong>ssh</strong>). Le client se connecte au serveur, une négociation chiffrée s'établit, puis l'utilisateur s'authentifie (par mot de passe ou, mieux, par clé — sujet de demain).</p>
<pre class="pseudo"># Les deux rôles :
Ta machine (client)          Serveur distant
  ssh alice@serveur  ------&gt;  sshd (écoute port 22)
                     &lt;------  session chiffrée ouverte
# Le paquet serveur s'appelle souvent openssh-server ; le client openssh-client.</pre>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SSH = Secure Shell : administration à distance CHIFFRÉE
# Port 22 (TCP) ; commande client : ssh utilisateur@machine
# Chiffre tout (commandes, mot de passe, résultats) -> confidentiel
# Remplace telnet (port 23, tout en clair, obsolète et dangereux)
# Serveur = démon sshd | Client = commande ssh
# Permet aussi : copie de fichiers (scp/sftp) et tunnels chiffrés</pre>`,

    { type: "qcm", q: "Sur un Wi-Fi public, pourquoi SSH est-il sûr ?", opts: ["Parce qu'il est plus rapide", "Parce que le trafic est chiffré et illisible pour un espion", "Parce qu'il masque l'adresse IP du client", "Parce qu'il utilise le port 80"], a: 1, exp: "Le chiffrement rend les données interceptées incompréhensibles." },
    { type: "input", q: "Quel paquet installe généralement le serveur SSH sous Linux ?", a: ["openssh-server", "openssh server", "openssh"], ph: "un nom de paquet", exp: "openssh-server fournit le démon sshd ; openssh-client fournit la commande ssh." },
    { type: "vf", q: "SSH permet aussi de copier des fichiers et de créer des tunnels chiffrés.", a: true, exp: "Oui : au-delà du terminal, SSH offre scp/sftp et le tunneling chiffré." }
  ],

    questions: [

# 1. Refuser telnet (mot de passe en clair, obsolète)
# 2. Vérifier que sshd tourne sur le serveur (openssh-server, port 22)

scp fichier.txt ines@203.0.113.42:/home/ines/</pre>
<p>Connexion chiffrée établie, mot de passe protégé. Demain : durcir cette configuration SSH (clés, sshd_config, root, port).</p>`
