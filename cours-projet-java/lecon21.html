var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque assemblée (examen)",
  subtitle: "Tout le projet en une épreuve : de l'architecture au déploiement.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, une application complète. Le langage (Java, la langue dans laquelle on écrit les instructions), le framework (Spring, la grande boîte à outils toute prête) et la base de données (MySQL, le classeur électronique qui range durablement les informations) ne sont plus des cours séparés : ils forment un seul logiciel. Récapitulons avant les 20 questions.</p>

<h3>1. Architecture et données</h3>
<p>Une <strong>architecture en couches</strong> (l'organisation du code en étages à rôle unique : controller → service → repository → MySQL) sépare les responsabilités. Le schéma de la base (la liste des tables et de leurs colonnes) est issu de <strong>Merise</strong> (la méthode de conception) et appliqué par des <strong>migrations Flyway</strong> (des scripts SQL numérotés et versionnés). Des <strong>entités JPA</strong> (des classes Java qui reflètent les tables) et des <strong>repositories</strong> Spring Data permettent de lire et écrire sans écrire de SQL à la main.</p>

<h3>2. Métier et sécurité</h3>
<p>La <strong>couche service</strong> porte les règles métier (louer, acheter, gérer les deux stocks), rendues <em>atomiques</em> — tout ou rien — par <code>@Transactional</code>. Une <strong>API REST</strong> (des adresses web standard) expose des <strong>DTO</strong> (des objets d'échange sûrs, et non les entités brutes), avec de la <strong>validation</strong> (le refus des données invalides) et une gestion centralisée des erreurs. <strong>Spring Security</strong> gère l'<em>authentification</em> (vérifier <em>qui</em> se connecte, mots de passe hachés par BCrypt) et l'<em>autorisation</em> (ce que chaque rôle a le droit de faire).</p>

<h3>3. Interface, qualité, livraison</h3>
<p>Un <strong>frontend Thymeleaf</strong> (des pages HTML fabriquées côté serveur) avec recherche et pagination, trois <strong>espaces</strong> cloisonnés (client, vendeur, administrateur), des <strong>tests</strong> unitaires (JUnit/Mockito, qui vérifient une brique isolée) et d'intégration (MockMvc, qui vérifient la chaîne complète), des réflexes de <strong>qualité</strong> (logs, problème N+1, secrets hors du code) et un <strong>déploiement</strong> par jar autonome et profils d'environnement.</p>
<div class="tip">Conseil d'examen : à chaque question, demande-toi « quelle couche ? quel rôle ? quelle garantie ? ». Et souviens-toi : la bonne réponse n'est pas la plus longue. Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "Le flux d'une requête :", opts: ["Base → DTO → HTTP", "Controller → Service → Repository → MySQL", "Service → HTTP", "Repository → Controller"], a: 1, exp: "Les couches." },
    { type: "qcm", q: "Le schéma est créé par…", opts: ["Hibernate en prod", "Des migrations Flyway", "Un script SQL manuel", "Le contrôleur au démarrage"], a: 1, exp: "Migrations versionnées." },
    { type: "qcm", q: "Une entité JPA correspond à…", opts: ["Un controller", "Une table", "Une vue HTML", "Un DTO"], a: 1, exp: "Objet ↔ table." },
    { type: "qcm", q: "Le CRUD sans SQL vient de…", opts: ["JpaRepository", "un trigger", "un DTO", "Thymeleaf"], a: 0, exp: "Spring Data." },
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["Le controller", "Le service", "Le repository", "Le HTML"], a: 1, exp: "Couche service." },
    { type: "qcm", q: "Rendre louer/acheter atomiques :", opts: ["@Async", "@Transactional", "@Cacheable", "@Scheduled"], a: 1, exp: "Transaction." },
    { type: "qcm", q: "Ne pas exposer l'entité au client :", opts: ["Un DTO", "un trigger", "un index", "un log"], a: 0, exp: "Découplage." },
    { type: "qcm", q: "Refuser des données invalides :", opts: ["@Valid + Bean Validation", "un contrôle if manuel", "un trigger SQL", "un cast"], a: 0, exp: "Validation." },
    { type: "qcm", q: "Hacher les mots de passe :", opts: ["Base64", "BCrypt", "MD5", "en clair"], a: 1, exp: "Sécurisé." },
    { type: "qcm", q: "Réserver une action à l'admin :", opts: ["@PreAuthorize(\"hasRole('ADMINISTRATEUR')\")", "permitAll()", "authenticated()", "@ResponseBody"], a: 0, exp: "Autorisation." },
    { type: "qcm", q: "Rendre du HTML côté serveur :", opts: ["@RestController", "Thymeleaf (@Controller)", "un @ResponseBody", "un JSON brut"], a: 1, exp: "Vue serveur." },
    { type: "qcm", q: "Paginer un grand catalogue :", opts: ["Tout charger", "Pageable / Page", "un filtre manuel", "un index unique"], a: 1, exp: "LIMIT/OFFSET." },
    { type: "qcm", q: "Tester le service en isolation :", opts: ["JUnit + Mockito (mocks)", "en production", "à la main", "avec la vraie base"], a: 0, exp: "Unitaire." },
    { type: "qcm", q: "Tester la chaîne complète :", opts: ["@SpringBootTest + MockMvc", "un mock seul", "un @Test isolé", "un println"], a: 0, exp: "Intégration." },
    { type: "qcm", q: "Le problème « N+1 » se corrige par…", opts: ["@EntityGraph / JOIN FETCH", "plus de boucles Java", "un index unique", "un cache mémoire"], a: 0, exp: "Préchargement." },
    { type: "qcm", q: "Les secrets se mettent…", opts: ["En dur", "En variables d'environnement", "Dans Git", "Dans les commentaires"], a: 1, exp: "Hors du code." },
    { type: "qcm", q: "Spring Boot se déploie comme…", opts: ["Un jar autonome", "Un dossier de sources", "Un .exe", "Un fichier .war seul"], a: 0, exp: "Artefact unique." },
    { type: "qcm", q: "En prod, ddl-auto vaut…", opts: ["create", "validate", "update", "drop"], a: 1, exp: "Schéma via Flyway." },
    { type: "qcm", q: "Le modèle Ludothèque a deux stocks :", opts: ["neuf et occasion", "stockVente et stockLocation", "achat et retour", "disponible et réservé"], a: 1, exp: "Vente et location." },
    { type: "qcm", q: "Les trois rôles :", opts: ["admin, user, guest", "CLIENT, VENDEUR, ADMINISTRATEUR", "acheteur, loueur, gérant", "membre, staff, root"], a: 1, exp: "Cahier des charges." }
  ],
  final: {
    title: "Épreuve pratique — Le trajet d'une location",
    intro: `<p>On relie toutes les couches sur un cas concret.</p>`,
    questions: [
      { type: "qcm", q: "Qui vérifie l'identité et le rôle avant le contrôleur ?", opts: ["Le repository", "Le filtre de sécurité (Spring Security)", "Le DTO", "MySQL"], a: 1, exp: "Filtre en amont." },
      { type: "qcm", q: "Où est décidé « stock suffisant ? »", opts: ["Le controller", "Le service (règle métier)", "Le repository", "La base MySQL"], a: 1, exp: "Service." },
      { type: "qcm", q: "Qui garantit location + stock ensemble ?", opts: ["@Transactional", "@Async", "@Cacheable", "un simple try/catch"], a: 0, exp: "Transaction." },
      { type: "qcm", q: "Qui traduit l'appel en SQL ?", opts: ["Le repository (JPA)", "le controller", "le DTO", "Thymeleaf"], a: 0, exp: "Persistance." },
      { type: "vf", q: "Une exception dans le service annule toute la transaction (ROLLBACK).", a: true, exp: "Atomicité ACID." }
    ],
    solution: `<pre class="pseudo">1. CLIENT authentifié clique « Louer » (Spring Security vérifie identité + rôle).
2. Controller (Spring MVC) appelle LocationService.louer(client, jeu).
3. Service @Transactional : vérifie le stock, enregistre la Location,
   décrémente stockLocation.
4. Repository (Spring Data JPA) traduit en SQL, écrit dans MySQL (InnoDB).
5. COMMIT : location + stock à jour — ou ROLLBACK si erreur (ACID).
6. Réponse renvoyée : l'utilisateur voit sa location confirmée.

Java (langage) · Spring (framework, chaque couche) · MySQL (base) :
les trois briques de la formation, assemblées en UNE application.</pre>
<p>Félicitations ! Tu as conçu, codé, sécurisé, testé et déployé une application complète. Le Niveau 6 est franchi : tu sais construire un logiciel de bout en bout.</p>`
  }
};
