  title: "Du cahier des charges à l'architecture en couches",
  subtitle: "Avant d'écrire une ligne, on décide comment le logiciel est organisé.",
  theory: `
<h3>1. Le projet : assembler ce qu'on sait déjà</h3>
<p>Un <strong>logiciel</strong> (ou <strong>application</strong>) est un ensemble d'instructions qui font faire quelque chose d'utile à un ordinateur, comme une recette de cuisine dit au cuisinier quoi faire étape par étape. Ce cours ne réapprend pas les outils un par un : il les fait <strong>travailler ensemble</strong> pour construire une seule application complète, <strong>La Ludothèque</strong>. On la conçoit (on décide comment elle marche), on la code (on écrit les instructions), on la teste (on vérifie qu'elle marche) et on la déploie (on la met en service pour de vrais utilisateurs).</p>
<p>Les outils qu'on assemble : <strong>Java</strong> est le <em>langage</em> de programmation, c'est-à-dire la langue dans laquelle on écrit les instructions (comme le français est une langue pour écrire un livre). <strong>Spring</strong> est un <em>framework</em>, c'est-à-dire une grande boîte à outils toute prête qui évite de tout réécrire soi-même (comme un meuble en kit fournit planches et vis au lieu de partir de l'arbre). <strong>MySQL</strong> est une <em>base de données</em> : un grand classeur électronique qui range et retrouve les informations (les jeux, les clients…) même après l'extinction de l'ordinateur. <strong>Merise</strong> est une méthode pour <em>dessiner à l'avance</em> la façon dont ces informations sont organisées, comme le plan d'un architecte avant de bâtir une maison.</p>

<h3>2. Le cahier des charges (rappel du domaine)</h3>
<p>Le <strong>cahier des charges</strong> est le document qui décrit ce que le logiciel doit faire : la commande du client, comme le bon de commande qu'on remet à un artisan. Ici : une ludothèque de jeux de société où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux, avec trois <strong>profils</strong> d'utilisateurs (trois types de personnes qui se servent de l'application) : <strong>client</strong> (parcourt, loue, achète), <strong>vendeur</strong> (gère les stocks), <strong>administrateur</strong> (gère jeux et comptes). Chaque jeu a deux stocks : un pour la vente, un pour la location.</p>

<h3>3. Pourquoi une architecture en couches ?</h3>
<p>L'<strong>architecture</strong> d'un logiciel, c'est la façon dont on organise son code, comme le plan d'un bâtiment organise ses pièces. Mettre tout le code au même endroit devient vite ingérable : imaginez une maison où cuisine, salle de bain et garage seraient une seule pièce en vrac. On <strong>sépare les responsabilités</strong> en <strong>couches</strong> (des étages), chacune avec un rôle unique :</p>
<pre class="pseudo">Controller (web)    reçoit les requêtes HTTP, renvoie les réponses
Service (métier)    contient les règles (louer, acheter, gérer le stock)
Repository (données) lit et écrit dans la base MySQL
Model (entités)     les objets du domaine (Jeu, Categorie, Utilisateur…)
DTO                 objets d'échange avec le client (pas les entités brutes)</pre>
<p>Décodons ce tableau. Le <strong>Controller</strong> (« contrôleur ») est la couche qui reçoit les demandes venues d'internet et renvoie les réponses : c'est le guichet d'accueil. Une <strong>requête HTTP</strong> est simplement un message qu'un navigateur (Chrome, Firefox…) envoie à l'application pour lui demander quelque chose ; <strong>HTTP</strong> (<em>HyperText Transfer Protocol</em>) est la « langue » standard que parlent navigateurs et sites web, comme le code de la route que tout le monde respecte. Le <strong>Service</strong> contient les <em>règles métier</em> : les décisions propres à l'activité (peut-on louer si le stock est vide ?), comme le règlement intérieur d'un magasin. Le <strong>Repository</strong> (« dépôt ») lit et écrit dans la base de données : c'est le magasinier qui va chercher et ranger les informations. Le <strong>Model</strong> (« modèle ») regroupe les <em>entités</em>, c'est-à-dire les objets du domaine (un Jeu, une Catégorie, un Utilisateur) : ce sont les fiches cartonnées décrivant chaque chose réelle. Enfin le <strong>DTO</strong> (<em>Data Transfer Object</em>, « objet de transfert de données ») est une version simplifiée d'une fiche, préparée spécialement pour être envoyée au client sans dévoiler les détails internes, comme un extrait de compte qui ne montre pas tout le dossier bancaire.</p>

<h3>4. Le flux d'une requête</h3>
<pre class="pseudo">HTTP → Controller → Service → Repository → MySQL
                     (règles)   (accès)     (données)</pre>
<p>Le <strong>flux</strong> est le trajet que suit une demande, de l'écran de l'utilisateur jusqu'à la base et retour. Règle d'or : le <strong>controller ne parle jamais directement à la base</strong>. Il passe par le service (les règles), qui passe par le repository (l'accès aux données). Chaque couche ne connaît que la suivante, comme dans un restaurant : le serveur (controller) transmet au cuisinier (service), qui demande au magasinier (repository) d'aller chercher les ingrédients dans la réserve (MySQL). Le serveur ne va jamais fouiller lui-même la réserve.</p>

<h3>5. L'organisation en packages</h3>
<p>Un <strong>package</strong> (« paquet ») est un dossier qui regroupe des fichiers de code allant ensemble, exactement comme on range ses papiers dans des dossiers étiquetés. On donne aux packages des noms à points, du plus général au plus précis (ici tout commence par <code>com.ludotheque</code>) :</p>
<pre class="pseudo">com.ludotheque
├── web         controllers (REST et web)
├── service     logique métier
├── repository  accès aux données (Spring Data JPA)
├── model       entités JPA
├── dto         objets d'échange
└── config      sécurité, beans, configuration</pre>
<p>Deux mots à définir ici. <strong>REST</strong> est une manière standard d'organiser les adresses web pour communiquer avec une application (par exemple demander « /api/jeux » pour obtenir la liste des jeux) ; c'est une convention polie et prévisible, comme un menu de restaurant où chaque plat a une place fixe. <strong>JPA</strong> (<em>Java Persistence API</em>) est l'outil qui fait le pont entre les objets Java (les entités) et les tables de la base de données : il traduit automatiquement une fiche Jeu en une ligne de tableau MySQL, et inversement, comme un traducteur entre deux langues. <strong>Spring Data JPA</strong> est la partie du framework Spring qui automatise cet aller-retour.</p>
<div class="tip">Cette séparation rend le code <strong>testable</strong> (on vérifie le service sans vraie base), <strong>évolutif</strong> (changer la base n'affecte pas le web) et <strong>compréhensible</strong> (chaque fichier a un seul rôle). C'est le squelette de tout le projet.</div>`,
  exercises: [
