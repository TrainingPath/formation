var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois profils, trois interfaces cloisonnées.",
  theory: `
<h3>1. Un espace par rôle</h3>
<p>Chaque profil de la Ludothèque a son <strong>espace</strong> (un ensemble de pages qui lui sont dédiées) : <strong>/client</strong> (mes locations et achats), <strong>/vendeur</strong> (gérer les stocks), <strong>/admin</strong> (gérer jeux et comptes). Chaque <strong>route</strong> (une adresse et la page qu'elle affiche) est réservée au bon rôle, comme des étages d'un immeuble accessibles selon son badge.</p>

<h3>2. Sécuriser par URL</h3>
<pre class="pseudo">http.authorizeHttpRequests(a -&gt; a                     // configurer qui accède à quoi
    .requestMatchers("/admin/**").hasRole("ADMINISTRATEUR")   // /admin/... : réservé à l'administrateur
    .requestMatchers("/vendeur/**").hasAnyRole("VENDEUR","ADMINISTRATEUR")   // /vendeur/... : vendeur ou admin
    .requestMatchers("/client/**").authenticated()   // /client/... : tout utilisateur connecté
    .requestMatchers(HttpMethod.GET, "/catalogue", "/api/jeux/**").permitAll()   // catalogue en lecture : public
    .anyRequest().authenticated());                  // tout le reste : connexion obligatoire</pre>
<p><code>hasRole</code> exige un rôle précis, <code>hasAnyRole</code> en accepte plusieurs, <code>authenticated()</code> demande seulement d'être connecté, et <code>permitAll()</code> ouvre à tous. Les règles sont lues de haut en bas : la première qui correspond s'applique.</p>

<h3>3. L'espace client (données du connecté)</h3>
<pre class="pseudo">@GetMapping("/client")                                // répond au GET /client
public String espaceClient(Authentication auth, Model model) {   // Authentication = l'identité connectée
    String email = auth.getName();          // l'utilisateur connecté (on récupère son email)
    model.addAttribute("locations", locationService.mesLocations(email));   // SES locations seulement
    model.addAttribute("achats", achatService.mesAchats(email));            // SES achats seulement
    return "client";                                  // renvoyer la vue « client »
}                                                     // fin de la méthode</pre>
<p><code>Authentication</code> est l'objet qui représente la personne connectée ; <code>auth.getName()</code> en donne l'identifiant (ici l'email). Le client ne voit ainsi que <strong>ses</strong> données (contrôle de propriété, leçon 11), jamais celles des autres.</p>

<h3>4. L'espace vendeur (gérer le stock)</h3>
<pre class="pseudo">@PostMapping("/vendeur/stock")                        // répond au POST /vendeur/stock (ajout de stock)
public String ajouterStock(@RequestParam Long idJeu,  // id du jeu (paramètre du formulaire)
                           @RequestParam int quantite,   // quantité à ajouter
                           @RequestParam String type) {  // type de stock : « location » ou « vente »
    if (type.equals("location")) stockService.ajouterStockLocation(idJeu, quantite);   // si location : incrémenter le stock de location
    else                          stockService.ajouterStockVente(idJeu, quantite);     // sinon : incrémenter le stock de vente
    return "redirect:/vendeur";     // Post-Redirect-Get : rediriger pour éviter la double soumission
}                                                     // fin de la méthode</pre>

<h3>5. L'espace administrateur</h3>
<p>L'admin gère les jeux (créer, modifier, retirer) et les comptes (lister, changer un rôle, désactiver). Il réutilise les services existants ; l'interface change, pas le métier.</p>
<div class="tip">Les trois espaces réutilisent les <strong>mêmes services</strong> (catalogue, stock, location, achat) : seule la présentation et les droits changent. Cloisonner par rôle, c'est appliquer le cahier des charges — et la sécurité par URL complète les <code>@PreAuthorize</code> pour une défense en profondeur.</div>`,
  exercises: [
    { type: "qcm", q: "Combien d'espaces pour la Ludothèque ?", opts: ["Un", "Trois (client, vendeur, admin)", "Deux", "Cinq"], a: 1, exp: "Un par rôle." },
    { type: "qcm", q: "L'espace /admin est réservé…", opts: ["À tous", "À l'administrateur", "Au client", "Au vendeur"], a: 1, exp: "hasRole ADMINISTRATEUR." },
    { type: "qcm", q: "L'espace /vendeur est ouvert…", opts: ["Au client", "Au vendeur et à l'admin", "À personne", "À tous"], a: 1, exp: "hasAnyRole." },
    { type: "qcm", q: "Connaître l'utilisateur connecté :", opts: ["Un cookie brut", "Authentication (auth.getName())", "l'URL", "un DTO"], a: 1, exp: "Identité de session." },
    { type: "qcm", q: "Le client ne voit que…", opts: ["Toutes les locations", "Ses propres locations et achats", "Celles des admins", "Aucune"], a: 1, exp: "Propriété." },
    { type: "qcm", q: "Sécuriser /admin/** :", opts: ["permitAll()", ".requestMatchers(\"/admin/**\").hasRole(\"ADMINISTRATEUR\")", "denyAll partout", "rien"], a: 1, exp: "Par URL." },
    { type: "qcm", q: "L'espace vendeur sert à…", opts: ["Supprimer des comptes", "Gérer les stocks", "Rien", "Payer"], a: 1, exp: "Gestion du stock." },
    { type: "qcm", q: "Après un POST d'ajout de stock, on…", opts: ["Reste sur la page", "Redirige (redirect:/vendeur)", "Rafraîchit en boucle", "Supprime"], a: 1, exp: "Post-Redirect-Get." },
    { type: "qcm", q: "Les trois espaces réutilisent…", opts: ["Des services différents", "Les mêmes services métier", "Aucun service", "La base directement"], a: 1, exp: "Une seule logique." },
    { type: "qcm", q: "Ce qui change entre les espaces :", opts: ["Le métier", "La présentation et les droits", "La base", "Le langage"], a: 1, exp: "UI + autorisation." },
    { type: "vf", q: "La sécurité par URL complète les @PreAuthorize (défense en profondeur).", a: true, exp: "Plusieurs couches." },
    { type: "qcm", q: "L'admin peut…", opts: ["Seulement consulter", "Gérer jeux ET comptes", "Rien", "Payer"], a: 1, exp: "Gestion complète." },
    { type: "vf", q: "Cloisonner par rôle applique directement le cahier des charges.", a: true, exp: "Trois profils." },
    { type: "qcm", q: "mesLocations(email) filtre sur…", opts: ["Tous", "L'utilisateur connecté", "Les admins", "Le stock"], a: 1, exp: "Ses données." },
    { type: "qcm", q: "redirect:/vendeur évite…", opts: ["La sécurité", "La double soumission du formulaire", "Le tri", "La base"], a: 1, exp: "PRG." }
  ],
  final: {
    title: "Exercice final — Construire les espaces",
    intro: `<p>On câble les trois interfaces.</p>`,
    questions: [
      { type: "qcm", q: "Route admin sécurisée :", opts: [".requestMatchers(\"/admin/**\").hasRole(\"ADMINISTRATEUR\")", "permitAll()", "authenticated() seul", "rien"], a: 0, exp: "Par rôle." },
      { type: "qcm", q: "Espace client, données du connecté :", opts: ["auth.getName() + mesLocations", "findAll()", "toutes les locations", "un DTO seul"], a: 0, exp: "Propriété." },
      { type: "qcm", q: "Vendeur ajoute du stock via…", opts: ["stockService (existant)", "un nouveau repository chaque fois", "la base en direct", "rien"], a: 0, exp: "Réutiliser le service." },
      { type: "qcm", q: "Après le POST vendeur :", opts: ["redirect:/vendeur", "return \"vendeur\" sans redirect", "boucle", "supprimer"], a: 0, exp: "PRG." },
      { type: "vf", q: "Les trois espaces partagent les mêmes services métier.", a: true, exp: "Une logique, trois vues." }
    ],
    solution: `<pre class="pseudo">// sécurité par URL                                    // règles d'accès dans la chaîne de filtres
.requestMatchers("/admin/**").hasRole("ADMINISTRATEUR")   // /admin/... : administrateur seulement
.requestMatchers("/vendeur/**").hasAnyRole("VENDEUR","ADMINISTRATEUR")   // /vendeur/... : vendeur ou admin
.requestMatchers("/client/**").authenticated()        // /client/... : utilisateur connecté

// espace client                                       // contrôleur de l'espace client
@GetMapping("/client")                                // répond au GET /client
public String espaceClient(Authentication auth, Model model) {   // auth = identité connectée
  model.addAttribute("locations", locationService.mesLocations(auth.getName()));   // seulement SES locations
  return "client";                                    // renvoyer la vue « client »
}</pre>
<p>Les trois profils ont leur espace. Demain : les tests unitaires.</p>`
  }
};

      "POST .../{id}/role avec @RequestParam Role role -> service.changerRole(id, role) puis return \"redirect:/admin/utilisateurs\".",

    ],
    solution: "@Controller\n@RequestMapping(\"/admin/utilisateurs\")               // prefixe d'URL commun : /admin/utilisateurs\npublic class AdminUtilisateurController {               // controleur de l'espace admin des comptes\n  private final UtilisateurService service;             // service des comptes (injecte)\n  public AdminUtilisateurController(UtilisateurService s) { this.service = s; }   // injection par constructeur\n\n  @GetMapping                                           // GET /admin/utilisateurs : lister les comptes\n  public String lister(Model model) {                   // le Model porte les donnees vers la vue\n    model.addAttribute(\"users\", service.tous());        // deposer la liste de tous les utilisateurs\n    return \"admin/users\";                               // renvoyer la vue admin/users\n  }\n\n  @PostMapping(\"/{id}/role\")                            // POST /admin/utilisateurs/{id}/role : changer un role\n  public String changerRole(@PathVariable Long id, @RequestParam Role role) {   // id dans l'URL, nouveau role en parametre\n    service.changerRole(id, role);                      // appliquer le changement via le service\n    return \"redirect:/admin/utilisateurs\";              // rediriger (Post-Redirect-Get)\n  }\n}\n\n// sécurité (SecurityFilterChain)                       // rappel de la protection par URL\n// .requestMatchers(\"/admin/**\").hasRole(\"ADMINISTRATEUR\")   // /admin/... reserve a l'administrateur",
    note: "L'espace admin réutilise UtilisateurService : seule la présentation et l'autorisation changent. La double protection (route /admin/** par rôle + éventuel @PreAuthorize) assure la défense en profondeur. Le POST suit le motif Post-Redirect-Get pour éviter la re-soumission au rafraîchissement." }
  ]
