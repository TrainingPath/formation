var DAY = {
  num: 20,
  title: "Déploiement : build, variables d'environnement, mise en ligne",
  subtitle: "Transformer le projet en application en ligne.",
  theory: `
<h3>1. Construire un jar exécutable</h3>
<p>Jusqu'ici on lançait le projet depuis l'éditeur. Pour le mettre en ligne, on le <strong>construit</strong> (« build ») : Maven compile le code, lance les tests et l'emballe dans un fichier livrable.</p>
<pre class="pseudo">mvn clean package                                     # nettoie puis construit le projet (compile, teste, empaquette)
# -> target/ludotheque-0.0.1.jar (serveur Tomcat inclus)   # résultat : un jar autonome dans le dossier target/</pre>
<p>Spring Boot produit un <strong>jar autonome</strong> : un seul fichier qui contient tout, y compris le serveur web (Tomcat) intégré. On le lance comme un simple programme Java avec <code>java -jar ludotheque.jar</code>, sans rien installer d'autre. Ce fichier livrable s'appelle un <em>artefact</em>.</p>

<h3>2. Les profils : dev vs prod</h3>
<p>Un <strong>profil</strong> est un jeu de réglages propre à un <em>environnement</em> : « dev » (la machine du développeur) et « prod » (le serveur des vrais utilisateurs) n'ont pas les mêmes besoins.</p>
<pre class="pseudo"># application-prod.properties                          # fichier de réglages du profil « prod »
spring.jpa.show-sql=false          # pas de SQL en clair dans les logs (on n'affiche pas les requêtes en prod)
spring.jpa.hibernate.ddl-auto=validate                # seulement vérifier le schéma (créé par Flyway)
spring.datasource.url=jdbc:mysql://db-prod:3306/ludotheque   # pointer la base de PRODUCTION (serveur db-prod)</pre>
<pre class="pseudo">export SPRING_PROFILES_ACTIVE=prod                    # activer le profil « prod » (via une variable d'environnement)
java -jar target/ludotheque-0.0.1.jar                 # lancer l'application (le jar autonome)</pre>
<p>En prod, on désactive les traces SQL (pour ne pas encombrer les logs ni divulguer d'informations), on garde <code>validate</code> (le schéma vient des migrations Flyway) et on pointe la base de production. <code>export</code> est la commande qui définit une variable d'environnement.</p>

<h3>3. Les secrets par l'environnement</h3>
<pre class="pseudo">export DB_USER=ludo                                   # nom d'utilisateur de la base (dans l'environnement)
export DB_PASSWORD=motDePasseFort                     # mot de passe de la base (jamais dans le code)
export JWT_SECRET=uneCleLongueEtAleatoire             # clé secrète de l'application (hors du code)</pre>
<p>Les secrets viennent de <strong>variables d'environnement</strong> de la machine ou du service d'hébergement, jamais du jar ni du dépôt.</p>

<h3>4. La checklist de mise en ligne</h3>
<p>Avant d'ouvrir au public, on vérifie une liste de points essentiels :</p>
<pre class="pseudo">✓ DEBUG/traces désactivés (show-sql=false)
✓ ddl-auto=validate (le schéma vient des migrations Flyway)
✓ secrets hors du code (variables d'env)
✓ HTTPS activé (chiffrement en transit)
✓ base de production sauvegardée régulièrement
✓ tests verts avant de livrer (mvn test)</pre>
<p>Notamment <strong>HTTPS</strong> (la version chiffrée de HTTP, qui protège les échanges des regards indiscrets grâce à <em>TLS</em>) et des <strong>sauvegardes</strong> régulières de la base (des copies de secours en cas de panne).</p>

<h3>5. Où héberger ?</h3>
<div class="tip">Le jar peut tourner sur un serveur (un <strong>VPS</strong>, une machine louée), une plateforme clé en main (Heroku, Render…), ou dans un <strong>conteneur</strong> (Docker : une boîte qui emballe l'app ET son environnement pour qu'elle tourne partout à l'identique — cours dédié). Le principe reste le même : un artefact autonome, configuré par l'environnement. L'application de la Ludothèque est en ligne — elle existe pour de vrai, accessible à ses utilisateurs.</div>`,
  exercises: [
    { type: "qcm", q: "Construire l'application :", opts: ["mvn clean package", "python build", "npm run", "gcc"], a: 0, exp: "Build Maven." },
    { type: "qcm", q: "Spring Boot produit…", opts: ["Un fichier .exe Windows", "Un jar autonome (serveur inclus)", "Un dossier de sources", "Rien"], a: 1, exp: "Jar exécutable." },
    { type: "qcm", q: "Lancer l'application :", opts: ["java -jar ludotheque.jar", "run ludotheque", "start.exe", "python app.py"], a: 0, exp: "java -jar." },
    { type: "qcm", q: "Un profil regroupe…", opts: ["Des tests", "Des réglages par environnement", "Des entités", "Des DTO"], a: 1, exp: "Config par env." },
    { type: "qcm", q: "Activer le profil prod :", opts: ["SPRING_PROFILES_ACTIVE=prod", "--dev", "profile=test", "rien"], a: 0, exp: "Variable d'env." },
    { type: "qcm", q: "En prod, show-sql doit être…", opts: ["true", "false", "obligatoire", "random"], a: 1, exp: "Pas de SQL en clair." },
    { type: "qcm", q: "En prod, ddl-auto reste…", opts: ["create", "validate", "update", "none et pas de JPA"], a: 1, exp: "Schéma via Flyway." },
    { type: "qcm", q: "Les secrets en prod viennent…", opts: ["Du jar", "De variables d'environnement", "Du dépôt Git", "Du HTML"], a: 1, exp: "Hors du code." },
    { type: "qcm", q: "Avant de livrer, on lance…", opts: ["mvn test (tests verts)", "rien", "un formatage", "un log"], a: 0, exp: "Tests d'abord." },
    { type: "qcm", q: "Chiffrer les échanges en ligne :", opts: ["HTTP simple", "HTTPS", "FTP", "aucun"], a: 1, exp: "TLS." },
    { type: "vf", q: "Le jar Spring Boot inclut le serveur : un seul artefact à déployer.", a: true, exp: "Autonome." },
    { type: "qcm", q: "La base de production doit être…", opts: ["Jamais sauvegardée", "Sauvegardée régulièrement", "La base de test", "Publique"], a: 1, exp: "Backups." },
    { type: "vf", q: "On peut héberger le jar sur un serveur, une plateforme ou un conteneur.", a: true, exp: "Portable." },
    { type: "qcm", q: "Le même artefact configuré différemment selon…", opts: ["Le hasard", "L'environnement (dev/prod)", "Le langage", "Le navigateur"], a: 1, exp: "Config externe." },
    { type: "qcm", q: "Un conteneur (Docker) sert à…", opts: ["Compiler", "Empaqueter l'app et son environnement (cours dédié)", "Trier", "Chiffrer"], a: 1, exp: "Packaging reproductible." }
  ],
  final: {
    title: "Exercice final — Mettre en ligne",
    intro: `<p>On prépare et on lance la version de production.</p>`,
    questions: [
      { type: "qcm", q: "Produire le jar :", opts: ["mvn clean package", "mvn compile only", "npm build", "gcc"], a: 0, exp: "Build." },
      { type: "qcm", q: "Activer le profil prod :", opts: ["SPRING_PROFILES_ACTIVE=prod", "--debug", "profile dev", "rien"], a: 0, exp: "Variable d'env." },
      { type: "qcm", q: "Réglage prod correct :", opts: ["show-sql=false, ddl-auto=validate", "show-sql=true, ddl-auto=create", "aucun", "secrets en dur"], a: 0, exp: "Sûr." },
      { type: "qcm", q: "Fournir le mot de passe :", opts: ["export DB_PASSWORD=...", "en dur dans le jar", "dans Git", "dans un log"], a: 0, exp: "Variable d'env." },
      { type: "vf", q: "On lance les tests avant de livrer.", a: true, exp: "Qualité." }
    ],
    solution: `<pre class="pseudo">mvn clean package                 # construire le jar -> target/ludotheque-0.0.1.jar

export DB_USER=ludo DB_PASSWORD=secret       # fournir les secrets par l'environnement
export SPRING_PROFILES_ACTIVE=prod           # activer le profil de production
java -jar target/ludotheque-0.0.1.jar        # lancer l'application (jar autonome)

# application-prod.properties                 # réglages du profil prod
spring.jpa.show-sql=false                     # pas de SQL en clair dans les logs
spring.jpa.hibernate.ddl-auto=validate        # schéma vérifié (créé par Flyway)
spring.datasource.url=jdbc:mysql://db-prod:3306/ludotheque   # base de production</pre>
<p>La Ludothèque est en ligne. Demain : l'examen final, l'application assemblée.</p>`
  }
};
