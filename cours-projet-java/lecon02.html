  title: "Mise en place : Spring Boot + connexion MySQL",

  theory: `
<h3>1. Générer le projet</h3>
<p><strong>Spring Boot</strong> est une version « prête à l'emploi » du framework Spring : elle fournit un projet qui démarre tout seul, sans réglages compliqués, comme une voiture qu'on lance en tournant la clé sans avoir à monter le moteur. On part de <strong>Spring Initializr</strong> (le site start.spring.io), un formulaire en ligne qui fabrique le squelette du projet. On y coche des <strong>dépendances</strong> : ce sont des bibliothèques de code déjà écrites par d'autres qu'on ajoute à son projet, comme des ingrédients pris au supermarché au lieu de les cultiver. Ici : <code>Spring Web</code> (répondre aux requêtes web), <code>Spring Data JPA</code> (dialoguer avec la base), <code>MySQL Driver</code> (le « pilote » qui sait parler à MySQL), <code>Validation</code> (vérifier les données reçues) et <code>Flyway</code> (gérer les évolutions de la base, leçon 3). Résultat : un projet <strong>Maven</strong> prêt à démarrer — Maven étant l'outil qui télécharge automatiquement ces dépendances et assemble (« build ») le programme, comme un chef de chantier qui rassemble les matériaux.</p>

<h3>2. La configuration de la base</h3>
<p>Le fichier <code>application.properties</code> est la fiche de réglages de l'application : une liste de « clé = valeur », comme le menu des préférences d'un téléphone.</p>
<pre class="pseudo"># src/main/resources/application.properties          # emplacement du fichier de configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ludotheque   # adresse de la base : protocole JDBC, serveur MySQL local (porte 3306), base « ludotheque »
spring.datasource.username=\${DB_USER}                # nom d'utilisateur, lu dans une variable d'environnement (jamais écrit en clair)
spring.datasource.password=\${DB_PASSWORD}            # mot de passe, lui aussi lu dans une variable d'environnement
spring.jpa.hibernate.ddl-auto=validate               # au démarrage : seulement VÉRIFIER que la base correspond aux entités (ne rien créer/effacer)
spring.jpa.show-sql=true                              # afficher dans la console les requêtes SQL générées (utile pour apprendre et déboguer)</pre>
<p>L'<strong>URL JDBC</strong> est l'adresse qui indique où trouver la base. <strong>JDBC</strong> (<em>Java Database Connectivity</em>) est le standard permettant à un programme Java de parler à n'importe quelle base de données, comme une prise électrique universelle. <code>localhost</code> signifie « cet ordinateur-ci » et <code>3306</code> est le <em>port</em>, le numéro de la « porte » réseau par laquelle MySQL écoute (comme un numéro d'appartement dans un immeuble). Les identifiants viennent de <strong>variables d'environnement</strong> : des valeurs rangées à l'extérieur du code, dans le système, qu'on lit avec la syntaxe <code>\${...}</code> — ainsi le mot de passe n'apparaît jamais écrit « en dur » dans les fichiers (sécurité).</p>

<h3>3. ddl-auto : qui gère le schéma ?</h3>
<p>Le <strong>schéma</strong> est la structure de la base : la liste des tables et de leurs colonnes, comme l'en-tête d'un tableau avant de le remplir. <strong>Hibernate</strong> est le moteur (sous JPA) qui traduit les objets Java en lignes de base. Le réglage <code>ddl-auto</code> décide qui, au démarrage, s'occupe de ce schéma :</p>
<pre class="pseudo">create      Hibernate recrée les tables (efface tout !) — dev jetable
update      Hibernate ajuste — pratique mais imprévisible
validate    Hibernate vérifie que le schéma correspond aux entités
none        Hibernate ne touche à rien</pre>
<div class="warn">En projet sérieux, on met <code>validate</code> : le schéma est géré par des <strong>migrations Flyway</strong> (des scripts numérotés qui font évoluer la base pas à pas, leçon 3), pas par Hibernate. Ainsi la base reste maîtrisée et reproductible.</div>

<h3>4. Un premier endpoint de vie</h3>
<p>Un <strong>endpoint</strong> (« point d'accès ») est une adresse à laquelle l'application répond, comme un numéro de poste téléphonique interne. Un <strong>@RestController</strong> est une classe qui fournit de tels endpoints ; le symbole <code>@</code> introduit une <strong>annotation</strong>, c'est-à-dire une étiquette collée sur le code pour dire au framework comment le traiter (comme un post-it « fragile » sur un colis).</p>
<pre class="pseudo">@RestController                       // annotation : cette classe est un contrôleur web (répond aux requêtes HTTP)
class PingController {                 // on déclare une classe (un fichier de code) nommée PingController
    @GetMapping("/ping")              // cette méthode répond aux requêtes GET envoyées à l'adresse /ping
    String ping() { return "pong"; }  // la méthode renvoie le texte « pong »
}                                     // fin de la classe</pre>
<p>On lance l'application avec <code>mvn spring-boot:run</code> (une commande Maven) et on visite <code>/ping</code> dans un navigateur : si « pong » s'affiche, le projet démarre et le serveur intégré tourne. <code>@GetMapping("/ping")</code> relie l'adresse <code>/ping</code> à la méthode ; <strong>GET</strong> est le type de requête utilisé pour <em>lire</em> une information (par opposition à POST, qui envoie des données).</p>

<h3>5. Vérifier la connexion</h3>
<p>Au démarrage, Spring Boot tente de se connecter à MySQL. Si les identifiants ou l'URL sont faux, l'application <strong>refuse de démarrer</strong> avec une erreur claire. C'est voulu : mieux vaut échouer tout de suite que servir des requêtes sans base, comme un guichet qui reste fermé plutôt que d'ouvrir sans caisse.</p>
<div class="tip">Le <strong>serveur</strong> (ici <strong>Tomcat</strong>, le programme qui écoute les requêtes web et les distribue) est <strong>intégré</strong> à Spring Boot : pas besoin d'installer un serveur à part. L'application est un simple programme Java qu'on lance ; on le transformera en <strong>jar</strong> (un fichier unique et déployable regroupant tout le programme) en leçon 20.</div>`,

    { type: "qcm", q: "L'endpoint /ping sert à…", opts: ["Se connecter à MySQL", "Vérifier que l'application démarre", "Trier", "Chiffrer"], a: 1, exp: "Signe de vie." },
    { type: "qcm", q: "Lancer l'application :", opts: ["mvn spring-boot:run", "python app.py", "node index.js", "gcc app"], a: 0, exp: "Commande Maven." },
    { type: "qcm", q: "Si les identifiants MySQL sont faux, l'app…", opts: ["Démarre quand même", "Refuse de démarrer avec une erreur claire", "Ignore la base", "Crée la base"], a: 1, exp: "Échec immédiat, voulu." },
    { type: "vf", q: "Le serveur (Tomcat) est intégré à Spring Boot.", a: true, exp: "Pas de serveur à installer." },
    { type: "qcm", q: "show-sql=true affiche…", opts: ["Le HTML", "Les requêtes SQL générées dans les logs", "Les mots de passe", "Rien"], a: 1, exp: "Utile en développement." },

    { type: "qcm", q: "Spring Web sert à…", opts: ["Parler à la base", "Exposer des endpoints HTTP", "Chiffrer", "Compiler"], a: 1, exp: "La couche web." },
    { type: "qcm", q: "Le projet généré utilise l'outil de build…", opts: ["Maven (ou Gradle)", "Make", "Webpack", "npm"], a: 0, exp: "Maven/Gradle." }
  ],

    ],
    solution: `<pre class="pseudo"># application.properties
spring.datasource.url=jdbc:mysql://localhost:3306/ludotheque   # adresse JDBC de la base MySQL locale « ludotheque »

<p>L'application vit et parle à MySQL. Demain : créer le schéma via des migrations.</p>`
  }
};
