  title: "Louer un jeu : transaction, stock, réservation",
  subtitle: "Le cœur métier : deux écritures indissociables.",
  theory: `
<h3>1. Le besoin</h3>
<p>Louer un jeu, c'est <strong>deux écritures</strong> en base (une « écriture » = un enregistrement ou une modification de données) : enregistrer la location ET décrémenter (diminuer de 1) le stock de location. Les deux réussissent ensemble, ou aucune. Si le stock manque, on refuse la location.</p>

<h3>2. L'exception métier</h3>
<p>Une <strong>exception métier</strong> est un signal d'erreur qu'on crée soi-même pour exprimer une règle de l'activité (ici « plus de stock »).</p>
<pre class="pseudo">public class StockInsuffisantException extends RuntimeException {   // exception « maison » : hérite de RuntimeException
    public StockInsuffisantException(String message) { super(message); }   // constructeur : transmet le message au parent
}                                                     // fin de la classe</pre>
<p><code>extends RuntimeException</code> signifie que notre exception <em>hérite</em> d'une exception standard de Java (elle en est une variante spécialisée). <code>super(message)</code> transmet le message d'erreur à cette classe parente. Cette exception dédiée sera traduite en code HTTP 409 (Conflict) par l'advice (leçon 8).</p>

<h3>3. Le service transactionnel</h3>
<pre class="pseudo">@Service                                              // couche métier gérée par Spring
public class LocationService {                        // classe du service de location
    private final JeuRepository jeux;                 // repository des jeux (injecté)
    private final LocationRepository locations;       // repository des locations (injecté)
    // constructeur…                                 // reçoit les deux repositories (injection)

    @Transactional                                    // toute la méthode = une transaction (tout ou rien)
    public void louer(Long idClient, Long idJeu) {    // louer le jeu idJeu au client idClient
        Jeu j = jeux.findById(idJeu).orElseThrow();   // récupérer le jeu (ou exception s'il n'existe pas)
        if (j.getStockLocation() &lt;= 0)                // s'il ne reste aucun exemplaire à louer…
            throw new StockInsuffisantException("Plus de stock de location");   // …refuser via l'exception métier
        locations.save(new Location(idClient, idJeu, LocalDate.now(), 7));   // 1re écriture : enregistrer la location (date du jour, 7 jours)
        j.setStockLocation(j.getStockLocation() - 1); // 2e écriture : retirer 1 du stock de location
        jeux.save(j);                                 // sauvegarder le jeu mis à jour (UPDATE)
    }                                                 // fin de la méthode (COMMIT si tout s'est bien passé)
}                                                     // fin de la classe</pre>

<h3>4. Pourquoi @Transactional est indispensable</h3>
<p>Sans transaction, si l'enregistrement de la location réussit mais que la mise à jour du stock échoue, on aurait une location « fantôme » sans décompte du stock. <code>@Transactional</code> garantit l'<strong>atomicité</strong> (« tout ou rien ») : toute exception déclenche un <code>ROLLBACK</code> (annulation qui remet la base dans son état d'avant) ; à l'inverse, si tout se passe bien, un <code>COMMIT</code> valide définitivement. La base reste toujours cohérente. <code>LocalDate.now()</code> fournit simplement la date du jour.</p>

<h3>5. Réservation : une variante</h3>
<pre class="pseudo">// réserver = mettre de côté sans encore décrémenter le stock disponible   // principe de la réservation
@Transactional                                        // opération atomique
public void reserver(Long idClient, Long idJeu) {     // réserver le jeu idJeu pour le client idClient
    reservations.save(new Reservation(idClient, idJeu, LocalDate.now()));   // enregistrer la réservation, datée d'aujourd'hui
}                                                     // fin de la méthode</pre>
<div class="tip">C'est exactement la transaction MySQL vue en cours de bases de données (les propriétés <em>ACID</em>), mais pilotée par Spring : <code>@Transactional</code> ouvre, valide (COMMIT) ou annule (ROLLBACK) automatiquement autour de la méthode. Le métier de la Ludothèque prend vie.</div>`,

    { type: "qcm", q: "Sans transaction, un échec partiel donne…", opts: ["Une base cohérente", "Une location fantôme sans décompte", "Un rollback automatique", "Un stock négatif"], a: 1, exp: "Incohérence." },
    { type: "qcm", q: "StockInsuffisantException sera traduite en…", opts: ["200", "409 Conflict (via l'advice)", "404", "301"], a: 1, exp: "Code métier." },
    { type: "qcm", q: "Décrémenter le stock :", opts: ["j.setStockLocation(j.getStockLocation() - 1)", "delete j", "stock = 0", "j.getStockLocation()"], a: 0, exp: "Une unité en moins." },

    { type: "qcm", q: "@Transactional gère le COMMIT/ROLLBACK…", opts: ["À la main", "Automatiquement autour de la méthode", "Seulement en cas d'erreur", "Dans le contrôleur"], a: 1, exp: "Géré par Spring." },
    { type: "vf", q: "C'est la transaction MySQL du cours BDD, pilotée par Spring.", a: true, exp: "Même principe ACID." },
    { type: "qcm", q: "L'ordre logique de louer :", opts: ["Décrémenter puis vérifier", "Vérifier le stock, enregistrer, décrémenter", "Supprimer le jeu", "Ne rien vérifier"], a: 1, exp: "Contrôle d'abord." },
    { type: "vf", q: "Une exception métier dédiée rend la règle explicite et traduisible en HTTP.", a: true, exp: "Lisibilité + advice." },
    { type: "qcm", q: "findById(idJeu).orElseThrow() gère…", opts: ["Le stock", "Le cas d'un jeu introuvable", "Un doublon", "Un timeout"], a: 1, exp: "404 possible." },
    { type: "qcm", q: "Le stock concerné par une location :", opts: ["stockVente", "stockLocation", "les deux", "aucun"], a: 1, exp: "Stock de location." }
  ],
  final: {

      { type: "qcm", q: "Enregistrer la location :", opts: ["locations.save(new Location(...))", "jeux.delete", "locations.findAll()", "un SELECT"], a: 0, exp: "Persistance." },

      { type: "vf", q: "Une exception annule toute la transaction (location + stock).", a: true, exp: "ROLLBACK." }
    ],
    solution: `<pre class="pseudo">@Transactional                                        // toute la méthode = une transaction (tout ou rien)
public void louer(Long idClient, Long idJeu) {        // louer le jeu idJeu au client idClient
  Jeu j = jeux.findById(idJeu).orElseThrow();         // récupérer le jeu (ou exception si introuvable)
  if (j.getStockLocation() &lt;= 0)                      // s'il ne reste aucun exemplaire à louer…

  locations.save(new Location(idClient, idJeu, LocalDate.now(), 7));   // 1re écriture : enregistrer la location
  j.setStockLocation(j.getStockLocation() - 1);       // 2e écriture : retirer 1 du stock de location
  jeux.save(j);                                       // sauvegarder le jeu mis à jour
}</pre>
<p>On sait louer. Demain : acheter, sur l'autre stock.</p>`
