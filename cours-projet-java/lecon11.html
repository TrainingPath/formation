var DAY = {
  num: 11,
  title: "Autorisation par rôle et par ressource",
  subtitle: "Décider qui a le droit de faire quoi.",
  theory: `
<h3>1. De l'identité aux droits</h3>
<p>On sait <em>qui</em> est connecté (leçon 10). L'<strong>autorisation</strong> décide ensuite de ses actions selon son <strong>rôle</strong> (son profil : client, vendeur ou administrateur) : le client loue/achète, le vendeur gère le stock, l'administrateur gère tout. C'est le passage de « qui es-tu ? » à « qu'as-tu le droit de faire ? ».</p>

<h3>2. Activer la sécurité au niveau des méthodes</h3>
<p>Par défaut, on protège des URL entières. Pour poser des règles directement sur des méthodes précises, il faut d'abord l'activer avec une classe de configuration.</p>
<pre class="pseudo">@Configuration                                        // classe de configuration Spring (règle le fonctionnement de l'app)
@EnableMethodSecurity                                 // active les contrôles de sécurité posés sur les méthodes (@PreAuthorize)
public class SecuriteConfig { }                       // classe vide : sa seule utilité est de porter ces annotations</pre>
<p><code>@Configuration</code> marque une classe qui règle le fonctionnement de l'application ; <code>@EnableMethodSecurity</code> allume la vérification des annotations de sécurité posées sur les méthodes.</p>

<h3>3. @PreAuthorize sur les méthodes</h3>
<pre class="pseudo">@PreAuthorize("hasAnyRole('VENDEUR','ADMINISTRATEUR')")   // n'autoriser que les rôles VENDEUR ou ADMINISTRATEUR
@PostMapping("/api/jeux")                             // POST /api/jeux : créer un jeu
public JeuDTO creer(@Valid @RequestBody CreationJeuDTO dto) { ... }   // corps de la méthode (données validées par @Valid)

@PreAuthorize("hasRole('ADMINISTRATEUR')")           // réservé au seul rôle ADMINISTRATEUR
@DeleteMapping("/api/utilisateurs/{id}")             // DELETE /api/utilisateurs/{id} : supprimer un compte
public void supprimer(@PathVariable Long id) { ... }  // récupère l'id dans l'URL et supprime</pre>
<p><code>@PreAuthorize</code> (« autoriser avant ») pose une condition vérifiée <em>avant</em> d'exécuter la méthode. À l'intérieur, <code>hasRole('ADMINISTRATEUR')</code> exige un rôle précis et <code>hasAnyRole('VENDEUR','ADMINISTRATEUR')</code> en accepte plusieurs. La règle s'exprime au plus près de l'action : modifier le catalogue exige vendeur ou admin ; gérer les comptes exige admin.</p>

<h3>4. L'autorisation par ressource (ownership)</h3>
<p>Parfois le rôle ne suffit pas : deux clients ont le même rôle, mais un client ne doit voir <strong>que ses</strong> locations, pas celles des autres. On vérifie alors la <strong>propriété</strong> de la ressource (en anglais <em>ownership</em>) : « cet objet t'appartient-il ? ».</p>
<pre class="pseudo">public List&lt;Location&gt; mesLocations(String emailConnecte) {   // renvoyer les locations de l'utilisateur connecté
    Utilisateur u = utilisateurs.findByEmail(emailConnecte).orElseThrow();   // retrouver l'utilisateur par son email
    return locations.findByIdClient(u.getIdUtilisateur());  // ne renvoyer QUE les locations dont il est le client
}                                                     // fin de la méthode</pre>

<h3>5. Défense en profondeur</h3>
<pre class="pseudo">// 1. par URL (dans la SecurityFilterChain)          // 1er niveau : filtrage selon le chemin de l'URL
.requestMatchers("/admin/**").hasRole("ADMINISTRATEUR")   // toute URL /admin/... exige le rôle ADMINISTRATEUR
// 2. par méthode (@PreAuthorize)                    // 2e niveau : contrôle posé sur chaque méthode
// 3. par ressource (vérifier la propriété dans le service)   // 3e niveau : vérifier que la ressource appartient à l'utilisateur</pre>
<div class="tip">On combine plusieurs niveaux : filtrage par URL, contrôle par méthode, vérification de propriété. Si une couche est contournée, une autre protège. C'est la « défense en profondeur », comme un château avec douves, remparts ET portes verrouillées.</div>
<div class="warn">Ne jamais se fier au <strong>frontend</strong> (la partie visible dans le navigateur) pour la sécurité : cacher un bouton n'empêche pas d'appeler l'API directement. L'autorisation doit toujours être vérifiée côté <strong>serveur</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "L'autorisation décide…", opts: ["Qui est connecté", "Ce que l'utilisateur a le droit de faire", "Le mot de passe", "Le stock"], a: 1, exp: "Les droits." },
    { type: "qcm", q: "Activer la sécurité par méthode :", opts: ["@EnableWeb", "@EnableMethodSecurity", "@Secured seul", "rien"], a: 1, exp: "Annotation de config." },
    { type: "qcm", q: "Restreindre une méthode à un rôle :", opts: ["@RolesOnly", "@PreAuthorize(\"hasRole('ADMINISTRATEUR')\")", "@Secure", "@Auth"], a: 1, exp: "@PreAuthorize." },
    { type: "qcm", q: "Modifier le catalogue est réservé…", opts: ["Au client", "Au vendeur ou à l'admin", "À tous", "À personne"], a: 1, exp: "hasAnyRole VENDEUR/ADMIN." },
    { type: "qcm", q: "Gérer les comptes est réservé…", opts: ["Au client", "Au vendeur", "À l'administrateur", "À tous"], a: 2, exp: "hasRole ADMINISTRATEUR." },
    { type: "qcm", q: "Un client ne doit voir que…", opts: ["Toutes les locations", "Ses propres locations", "Celles des admins", "Aucune"], a: 1, exp: "Propriété de la ressource." },
    { type: "qcm", q: "Vérifier la propriété s'appelle aussi…", opts: ["ownership", "caching", "routing", "pooling"], a: 0, exp: "Contrôle de propriété." },
    { type: "qcm", q: "hasAnyRole('VENDEUR','ADMINISTRATEUR') autorise…", opts: ["Seulement vendeur", "Vendeur OU administrateur", "Le client", "Personne"], a: 1, exp: "L'un des deux." },
    { type: "qcm", q: "La sécurité par URL se déclare dans…", opts: ["Le DTO", "La SecurityFilterChain", "L'entité", "Le test"], a: 1, exp: "Filtres par chemin." },
    { type: "qcm", q: "La « défense en profondeur » combine…", opts: ["Une seule règle", "Plusieurs niveaux (URL, méthode, ressource)", "Aucune règle", "Le frontend seul"], a: 1, exp: "Couches multiples." },
    { type: "vf", q: "Cacher un bouton dans le frontend ne suffit pas à sécuriser.", a: true, exp: "Vérifier côté serveur." },
    { type: "qcm", q: "@PreAuthorize s'évalue…", opts: ["Après la méthode", "Avant l'exécution de la méthode", "Dans la base", "Jamais"], a: 1, exp: "En amont." },
    { type: "vf", q: "Le rôle ne suffit pas toujours : parfois il faut vérifier la propriété.", a: true, exp: "Ownership." },
    { type: "qcm", q: "mesLocations filtre sur…", opts: ["Tous les clients", "L'id de l'utilisateur connecté", "Les admins", "Le stock"], a: 1, exp: "Seulement les siennes." },
    { type: "qcm", q: "L'autorisation doit être vérifiée…", opts: ["Côté frontend", "Côté serveur", "Nulle part", "Par l'utilisateur"], a: 1, exp: "Serveur." }
  ],
  final: {
    title: "Exercice final — Cloisonner les actions",
    intro: `<p>On applique les droits des trois rôles.</p>`,
    questions: [
      { type: "qcm", q: "Créer un jeu (vendeur/admin) :", opts: ["@PreAuthorize(\"hasAnyRole('VENDEUR','ADMINISTRATEUR')\")", "permitAll()", "@PreAuthorize(\"hasRole('CLIENT')\")", "aucune annotation"], a: 0, exp: "Deux rôles autorisés." },
      { type: "qcm", q: "Supprimer un compte (admin) :", opts: ["@PreAuthorize(\"hasRole('ADMINISTRATEUR')\")", "permitAll()", "hasRole('CLIENT')", "rien"], a: 0, exp: "Admin seulement." },
      { type: "qcm", q: "Un client consulte ses locations :", opts: ["Toutes les locations", "filtrer par son id (ownership)", "celles des admins", "aucune"], a: 1, exp: "Propriété." },
      { type: "qcm", q: "Sécuriser /admin/** :", opts: [".requestMatchers(\"/admin/**\").hasRole(\"ADMINISTRATEUR\")", "permitAll()", "denyAll pour tous", "rien"], a: 0, exp: "Par URL." },
      { type: "vf", q: "Combiner URL + méthode + propriété = défense en profondeur.", a: true, exp: "Plusieurs couches." }
    ],
    solution: `<pre class="pseudo">@PreAuthorize("hasAnyRole('VENDEUR','ADMINISTRATEUR')")   // réservé aux vendeurs et administrateurs
@PostMapping("/api/jeux")                             // POST /api/jeux : créer un jeu
public JeuDTO creer(@Valid @RequestBody CreationJeuDTO dto) { ... }   // corps de la méthode

@PreAuthorize("hasRole('ADMINISTRATEUR')")           // réservé au seul administrateur
@DeleteMapping("/api/utilisateurs/{id}")             // DELETE /api/utilisateurs/{id} : supprimer un compte
public void supprimer(@PathVariable Long id) { ... }  // supprime le compte identifié dans l'URL

// propriété : un client ne voit que ses locations   // contrôle d'ownership dans le service
public List&lt;Location&gt; mesLocations(String email) {    // renvoyer les locations de l'utilisateur connecté
  Utilisateur u = utilisateurs.findByEmail(email).orElseThrow();   // retrouver l'utilisateur par email
  return locations.findByIdClient(u.getIdUtilisateur());   // seulement les locations de ce client
}</pre>
<p>Les rôles sont cloisonnés. Demain : le cœur métier — louer un jeu.</p>`
  }
};

    solution: "@PreAuthorize(\"hasAnyRole('VENDEUR','ADMINISTRATEUR')\")   // reserve aux roles VENDEUR et ADMINISTRATEUR\n@PostMapping(\"/api/stock/{idJeu}/location\")            // POST : ajouter du stock de location au jeu {idJeu}\npublic void ajouterStock(@PathVariable Long idJeu, @RequestParam int quantite) {   // id dans l'URL, quantite en parametre\n  stockService.ajouterStockLocation(idJeu, quantite);  // deleguer l'ajout au service metier\n}\n\n// SecurityFilterChain (défense par URL)               // second niveau : filtrage par chemin d'URL\nhttp.authorizeHttpRequests(a -> a                       // configurer les autorisations\n    .requestMatchers(\"/vendeur/**\").hasAnyRole(\"VENDEUR\",\"ADMINISTRATEUR\")   // /vendeur/... reserve vendeur/admin\n    .requestMatchers(HttpMethod.GET, \"/api/jeux/**\").permitAll()   // catalogue en lecture : public\n    .anyRequest().authenticated());                     // tout le reste : connexion obligatoire",
