  title: "Repositories Spring Data et requêtes dérivées",
  subtitle: "Lire et écrire en base sans écrire de SQL.",
  theory: `
<h3>1. Le repository : le CRUD gratuit</h3>
<p>Un <strong>repository</strong> (« dépôt ») est la couche qui lit et écrit en base. En Spring, c'est une <strong>interface</strong> : un contrat qui liste des méthodes sans les écrire (comme un menu qui annonce les plats sans les cuisiner). Elle <strong>étend</strong> (hérite de) <code>JpaRepository</code>, et Spring en fabrique tout seul l'<strong>implémentation</strong> (le vrai code) au démarrage. On obtient gratuitement le <strong>CRUD</strong> — les quatre opérations de base : <em>Create</em> (créer), <em>Read</em> (lire), <em>Update</em> (modifier), <em>Delete</em> (supprimer) — via <code>save</code>, <code>findById</code>, <code>findAll</code>, <code>deleteById</code>…, sans écrire une ligne.</p>
<pre class="pseudo">public interface JeuRepository extends JpaRepository&lt;Jeu, Long&gt; {   // une interface qui hérite de JpaRepository (CRUD tout prêt) pour l'entité Jeu (clé Long)
}                                                                  // corps vide : les méthodes de base sont déjà fournies par Spring</pre>
<p>Les deux <em>paramètres de type</em> entre chevrons <code>&lt; &gt;</code> précisent sur quoi travaille le repository : le type d'entité (<code>Jeu</code>) et le type de sa clé primaire (<code>Long</code>, un grand entier). C'est ce qu'on appelle les <em>génériques</em> : une même interface réutilisable pour n'importe quelle entité, à qui l'on précise « pour des Jeu identifiés par un Long ».</p>

<h3>2. Les requêtes dérivées</h3>
<p>Magie de Spring Data : il traduit le <strong>nom de la méthode</strong> en requête SQL. On décrit ce qu'on cherche en <em>nommant</em> la méthode, et il génère la clause <code>WHERE</code> (la partie « où… » d'une requête, celle qui filtre les lignes).</p>
<pre class="pseudo">List&lt;Jeu&gt; findByStockLocationGreaterThan(int n);     // renvoie les jeux dont stockLocation > n   (SQL : WHERE stockLocation > ?)
List&lt;Jeu&gt; findByTitreContainingIgnoreCase(String q); // titres contenant q, sans distinction majuscules/minuscules (WHERE titre LIKE %?%)
List&lt;Jeu&gt; findByCategorie_IdCategorie(Long id);      // jeux d'une catégorie donnée (jointure : suit la relation vers Categorie)
long countByStockVenteGreaterThan(int n);            // compte (renvoie le nombre) les jeux dont stockVente > n</pre>

<h3>3. Les mots-clés courants</h3>
<p>Voici les briques de vocabulaire qu'on assemble dans les noms de méthodes (ce n'est pas du code à exécuter, mais un aide-mémoire) :</p>
<pre class="pseudo">findBy…            sélection
…GreaterThan …LessThan …Between   comparaisons
…Containing …StartingWith          motifs de texte
…IgnoreCase                         insensible à la casse
…OrderBy…Desc                       tri
And / Or                            combiner des conditions</pre>

<h3>4. Quand le nom ne suffit pas : @Query</h3>
<p>Pour les cas complexes, on écrit la requête à la main avec l'annotation <code>@Query</code>, en <strong>JPQL</strong> (<em>Java Persistence Query Language</em>) : un langage très proche du SQL mais qui porte sur les <em>entités</em> Java (les objets) plutôt que sur les tables.</p>
<pre class="pseudo">@Query("SELECT j FROM Jeu j WHERE j.prixLocation > (SELECT AVG(x.prixLocation) FROM Jeu x)")   // requête JPQL écrite à la main : jeux plus chers que le prix moyen
List&lt;Jeu&gt; plusChersQueLaMoyenne();                   // ici le nom est libre : c'est @Query qui définit la requête</pre>
<p>On y retrouve les notions du cours SQL : les <em>sous-requêtes</em> (une requête à l'intérieur d'une autre), les <em>agrégats</em> comme <code>AVG</code> (la moyenne) et les <em>jointures</em> (croiser plusieurs tables).</p>

<h3>5. Pagination et tri intégrés</h3>
<p>Afficher 5 000 jeux d'un coup est inutile : on les découpe en « pages ». Un <code>Pageable</code> décrit la page voulue (son numéro, sa taille, l'ordre de tri).</p>
<pre class="pseudo">Page&lt;Jeu&gt; findByTitreContainingIgnoreCase(String q, Pageable p);   // même recherche, mais paginée : le Pageable décrit la page (numéro, taille, tri)</pre>
<div class="tip">En passant un <code>Pageable</code>, Spring ajoute automatiquement <code>LIMIT/OFFSET</code> (les instructions SQL qui disent « ne renvoie que N lignes, à partir de la position X ») et le tri — la pagination MySQL vue en cours, sans l'écrire. Le repository reste une simple interface : c'est Spring qui fait le travail derrière.</div>`,

    { type: "qcm", q: "JPQL porte sur…", opts: ["Les tables", "Les entités Java", "Les fichiers", "Les DTO"], a: 1, exp: "Objets, pas tables." },
    { type: "qcm", q: "…OrderByPrixLocationDesc trie…", opts: ["Croissant", "Décroissant sur le prix", "Par id", "Au hasard"], a: 1, exp: "Tri intégré." },
    { type: "qcm", q: "Passer un Pageable ajoute…", opts: ["Un index", "LIMIT/OFFSET et le tri automatiquement", "Un DTO", "Une transaction"], a: 1, exp: "Pagination." },
    { type: "vf", q: "On peut combiner des conditions avec And / Or dans le nom de méthode.", a: true, exp: "findBy...And..." },
    { type: "qcm", q: "countByStockVenteGreaterThan(0) renvoie…", opts: ["La liste", "Le nombre de jeux en stock de vente", "Un booléen", "Le prix"], a: 1, exp: "count = nombre." },
    { type: "vf", q: "Le repository reste une simple interface, Spring génère le code.", a: true, exp: "Pas d'implémentation à écrire." },
    { type: "qcm", q: "findByCategorie_IdCategorie(id) fait…", opts: ["Rien", "Une jointure/filtre sur la catégorie du jeu", "Un tri", "Un DELETE"], a: 1, exp: "Navigation dans la relation." },
    { type: "qcm", q: "save(jeu) sur un jeu existant…", opts: ["Crée un doublon", "Met à jour la ligne", "Supprime", "Ne fait rien"], a: 1, exp: "INSERT ou UPDATE selon l'id." }
  ],
  final: {
    title: "Exercice final — Le JeuRepository",
    intro: `<p>On équipe le catalogue de ses requêtes de lecture.</p>`,
    questions: [
      { type: "qcm", q: "Déclarer le repository :", opts: ["class JeuRepository", "interface JeuRepository extends JpaRepository<Jeu, Long>", "@Entity JeuRepository", "JeuRepository()"], a: 1, exp: "Interface + JpaRepository." },
      { type: "qcm", q: "Les jeux louables :", opts: ["findByStockLocationGreaterThan(0)", "findAll()", "findByStock", "getLouables"], a: 0, exp: "Requête dérivée." },
      { type: "qcm", q: "Chercher « catan » sans casse :", opts: ["findByTitreContainingIgnoreCase(\"catan\")", "findByTitre(\"catan\")", "search(\"catan\")", "like catan"], a: 0, exp: "Containing + IgnoreCase." },
      { type: "qcm", q: "Une requête avec sous-requête AVG :", opts: ["Une requête dérivée", "@Query en JPQL", "un DTO", "un trigger"], a: 1, exp: "@Query." },
      { type: "vf", q: "Passer un Pageable pagine automatiquement le résultat.", a: true, exp: "LIMIT/OFFSET intégrés." }
    ],
    solution: `<pre class="pseudo">public interface JeuRepository extends JpaRepository&lt;Jeu, Long&gt; {   // repository CRUD pour l'entité Jeu (clé Long)
  List&lt;Jeu&gt; findByStockLocationGreaterThan(int n);                  // jeux dont stockLocation > n (disponibles à la location)
  Page&lt;Jeu&gt; findByTitreContainingIgnoreCase(String q, Pageable p);  // recherche paginée par titre, insensible à la casse
  List&lt;Jeu&gt; findByCategorie_IdCategorie(Long idCategorie);          // jeux d'une catégorie donnée (via la relation)

  @Query("SELECT j FROM Jeu j WHERE j.prixLocation > " +            // requête JPQL manuelle (1re partie, concaténée avec +)
         "(SELECT AVG(x.prixLocation) FROM Jeu x)")                 // sous-requête : la moyenne des prix de location
  List&lt;Jeu&gt; plusChersQueLaMoyenne();                               // jeux au prix de location supérieur à la moyenne
}                                                                  // fin de l'interface</pre>
<p>La couche données est prête. Demain : la couche service et les règles métier.</p>`
  }
};
