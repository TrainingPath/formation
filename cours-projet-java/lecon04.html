  title: "Le catalogue : entités JEU, CATEGORIE, FOURNISSEUR",
  subtitle: "Refléter les tables MySQL en objets Java avec JPA.",
  theory: `
<h3>1. Une entité = une table</h3>
<p>Une <strong>entité JPA</strong> est une <strong>classe</strong> Java (un plan qui décrit un type d'objet, comme le moule d'une figurine) portant des <strong>annotations</strong> (des étiquettes commençant par <code>@</code> qui donnent des instructions au framework). Elle correspond à une table : chaque <strong>champ</strong> (une variable interne de l'objet) correspond à une colonne, et chaque <strong>instance</strong> (un objet concret fabriqué à partir de la classe) correspond à une ligne. C'est le pont entre le monde « objet » de Java et le monde « relationnel » (les tables) de MySQL, un traducteur automatique dans les deux sens ; on appelle ce lien le <em>mapping</em>.</p>

<h3>2. L'entité Categorie</h3>
<pre class="pseudo">@Entity @Table(name = "CATEGORIE")                 // @Entity : classe = entité liée à une table ; @Table : nom de la table = CATEGORIE
public class Categorie {                            // déclaration de la classe Categorie (public = visible partout)
    @Id @GeneratedValue(strategy = GenerationType.IDENTITY)   // @Id : clé primaire ; valeur générée par l'AUTO_INCREMENT de MySQL
    private Long idCategorie;                       // champ identifiant (private = accessible seulement via getters/setters)
    private String libelle;                         // le nom (libellé) de la catégorie, un texte
    // getters / setters                            // méthodes pour lire/écrire les champs (générées automatiquement)
}                                                   // fin de la classe</pre>
<p><code>@Id</code> marque la <strong>clé primaire</strong> (la colonne qui identifie chaque ligne de façon unique) ; <code>@GeneratedValue</code> dit « ne remplis pas ce numéro toi-même », et <code>GenerationType.IDENTITY</code> s'appuie sur l'<code>AUTO_INCREMENT</code> de MySQL (la base numérote seule : 1, 2, 3…). Les mots <code>public</code> et <code>private</code> règlent la <em>visibilité</em> : <code>public</code> = accessible partout, <code>private</code> = protégé, accessible seulement à travers des méthodes dédiées (les getters/setters, ci-dessous).</p>

<h3>3. Les relations : @ManyToOne</h3>
<p>Un jeu appartient à une catégorie et provient d'un fournisseur. Une <strong>relation</strong> exprime un lien entre deux tables. Comme plusieurs jeux peuvent partager la même catégorie, on est du côté « plusieurs vers un » : on utilise <code>@ManyToOne</code> (« plusieurs-à-un »), en indiquant avec <code>@JoinColumn</code> la colonne de clé étrangère qui matérialise le lien.</p>
<pre class="pseudo">@Entity @Table(name = "JEU")                        // entité liée à la table JEU
public class Jeu {                                  // déclaration de la classe Jeu
    @Id @GeneratedValue(strategy = GenerationType.IDENTITY)   // clé primaire auto-générée par MySQL
    private Long idJeu;                             // identifiant du jeu
    private String titre;                           // titre du jeu (texte)
    private BigDecimal prixAchat;                   // prix d'achat en BigDecimal (nombre exact, adapté à l'argent)
    private BigDecimal prixLocation;                // prix de location, également exact
    private int stockVente;                         // quantité disponible à la vente (entier)
    private int stockLocation;                      // quantité disponible à la location (entier)

    @ManyToOne @JoinColumn(name = "idCategorie")    // relation « plusieurs jeux → une catégorie » ; colonne clé étrangère idCategorie
    private Categorie categorie;                    // l'objet Categorie relié à ce jeu

    @ManyToOne @JoinColumn(name = "idFournisseur")  // relation « plusieurs jeux → un fournisseur »
    private Fournisseur fournisseur;                // l'objet Fournisseur relié à ce jeu
    // getters / setters                            // méthodes d'accès aux champs
}                                                   // fin de la classe</pre>

<h3>4. Le bon type pour chaque colonne</h3>
<p>À chaque type de colonne SQL correspond un type Java adapté :</p>
<pre class="pseudo">DECIMAL(6,2) → BigDecimal   (jamais double pour de l'argent)
INT          → int / Long
VARCHAR      → String
DATE         → LocalDate
DATETIME     → LocalDateTime</pre>
<div class="warn">Pour les prix, on utilise <code>BigDecimal</code> (un nombre décimal <em>exact</em>), pas <code>double</code>. Un <code>double</code> est un nombre « à virgule flottante » stocké en binaire : il ne peut pas représenter exactement des valeurs comme 0,10 € et introduit de minuscules erreurs d'arrondi — inacceptables quand il s'agit d'argent (les centimes doivent tomber juste).</div>

<h3>5. Chargement paresseux (lazy)</h3>
<p>Par défaut, <code>@ManyToOne</code> charge la relation immédiatement (mode <em>eager</em>, « avide » : lire un jeu va aussitôt chercher sa catégorie). Sur de gros volumes, on préfère souvent <code>fetch = FetchType.LAZY</code> (« paresseux ») pour ne charger la catégorie que si on l'utilise vraiment — on reviendra sur le fameux problème « N+1 » (une requête qui en déclenche des dizaines d'autres) en leçon 19.</p>
<div class="tip">Les entités reflètent fidèlement le schéma Flyway (leçon 3) : mêmes noms de colonnes via <code>@Column</code>/<code>@JoinColumn</code>, mêmes relations que le MCD Merise. Avec <code>ddl-auto=validate</code>, Hibernate refuse de démarrer si une entité ne correspond pas à sa table — un garde-fou précieux.</div>`,

    { type: "vf", q: "Avec validate, Hibernate refuse de démarrer si une entité ne correspond pas à sa table.", a: true, exp: "Contrôle de cohérence." },
    { type: "qcm", q: "Jeu a deux relations @ManyToOne vers…", opts: ["Client et Vendeur", "Categorie et Fournisseur", "Louer et Acheter", "aucune"], a: 1, exp: "Catégorie et fournisseur." },

  ],
  final: {
    title: "Exercice final — L'entité Jeu",
    intro: `<p>On mappe la table JEU en entité Java.</p>`,

      { type: "vf", q: "Les deux stocks (vente et location) sont deux champs int distincts.", a: true, exp: "Modèle Ludothèque." }
    ],
    solution: `<pre class="pseudo">@Entity @Table(name = "JEU")                        // entité liée à la table JEU
public class Jeu {                                  // déclaration de la classe Jeu
  @Id @GeneratedValue(strategy = GenerationType.IDENTITY)   // clé primaire auto-générée (AUTO_INCREMENT MySQL)
  private Long idJeu;                               // identifiant du jeu

  // getters / setters                              // méthodes d'accès aux champs
}                                                   // fin de la classe</pre>
<p>Le catalogue existe en objets Java. Demain : les repositories pour lire et écrire.</p>`
  }
