<h3>1. La migration des utilisateurs</h3>
<pre class="pseudo">-- V2__utilisateurs.sql                               -- deuxième migration : la table des utilisateurs
CREATE TABLE UTILISATEUR (                            -- créer la table UTILISATEUR
  idUtilisateur INT AUTO_INCREMENT PRIMARY KEY,       -- identifiant unique auto-numéroté (clé primaire)
  email       VARCHAR(120) NOT NULL UNIQUE,           -- email obligatoire et UNIQUE (aucun doublon possible)
  motDePasse  VARCHAR(100) NOT NULL,   -- HACHÉ, jamais en clair
  role        VARCHAR(20)  NOT NULL                   -- rôle : CLIENT, VENDEUR ou ADMINISTRATEUR
) ENGINE=InnoDB;                                      -- moteur InnoDB</pre>
<p>L'email est <strong>unique</strong> (mot-clé <code>UNIQUE</code>) : deux comptes ne peuvent pas partager le même email, qui sert donc d'identifiant. Le mot de passe stocké est un <strong>haché</strong> : le résultat d'une transformation à sens unique qui brouille le mot de passe (leçon 10), jamais le mot de passe réel — comme une empreinte digitale plutôt que la personne elle-même.</p>

<h3>2. L'enum des rôles</h3>
<pre class="pseudo">public enum Role {                                    // un enum : liste fermée des valeurs autorisées
    CLIENT,          // rôle client : parcourt, loue, achète
    VENDEUR,         // rôle vendeur : gère les stocks
    ADMINISTRATEUR   // rôle administrateur : gère jeux et comptes
}                                                     // fin de l'enum</pre>
<p>Un <strong>enum</strong> (énumération) fige la liste des valeurs possibles : impossible d'avoir un rôle inexistant, contrairement à une chaîne de texte libre où l'on pourrait écrire n'importe quoi (« venduer », « admn »…). C'est un menu à choix limité.</p>

<h3>3. L'entité Utilisateur</h3>
<pre class="pseudo">@Entity @Table(name = "UTILISATEUR")                  // entité liée à la table UTILISATEUR
public class Utilisateur {                            // classe Utilisateur
    @Id @GeneratedValue(strategy = GenerationType.IDENTITY)   // clé primaire auto-générée par MySQL
    private Long idUtilisateur;                       // identifiant de l'utilisateur

    @Column(unique = true, nullable = false)          // colonne email : unique et obligatoire
    private String email;                             // l'email (sert d'identifiant de connexion)

    private String motDePasse;                        // le mot de passe HACHÉ (jamais en clair)

    @Enumerated(EnumType.STRING)                      // stocke le rôle sous forme de texte (« CLIENT ») en base
    private Role role;                                // le rôle de l'utilisateur
    // getters / setters                              // méthodes d'accès aux champs
}                                                     // fin de la classe</pre>
<p><code>@Column(unique = true, nullable = false)</code> traduit l'unicité et l'obligation côté entité. <code>@Enumerated(EnumType.STRING)</code> stocke le rôle en clair (« CLIENT ») plutôt qu'un numéro d'ordre : c'est lisible en base et robuste si on réordonne l'enum (avec un numéro, ajouter une valeur au milieu décalerait tout).</p>

<h3>4. Le repository et la recherche par email</h3>
<pre class="pseudo">public interface UtilisateurRepository extends JpaRepository&lt;Utilisateur, Long&gt; {   // repository CRUD pour Utilisateur (clé Long)
    Optional&lt;Utilisateur&gt; findByEmail(String email);   // retrouver un utilisateur par son email (Optional : peut être vide)
    boolean existsByEmail(String email);               // vrai si un utilisateur avec cet email existe déjà
}                                                     // fin de l'interface</pre>
<p>La connexion (leçon 10) chargera l'utilisateur par son email. <code>findByEmail</code> renvoie un <strong>Optional</strong> (résultat éventuellement vide si l'email n'existe pas) et <code>existsByEmail</code> renvoie simplement vrai ou faux.</p>

<h3>5. Créer un compte proprement</h3>
<div class="warn">Ne jamais enregistrer un mot de passe en clair. À l'inscription, on le <strong>hache</strong> avant de le stocker (leçon 10). Vérifier aussi l'unicité de l'email (<code>existsByEmail</code>) pour un message clair plutôt qu'une erreur de contrainte brute.</div>
<div class="tip">Les trois profils du cahier des charges deviennent un enum et une colonne : c'est la base de la sécurité. L'<strong>authentification</strong> dira <em>qui</em> est connecté (demain), l'<strong>autorisation</strong> dira <em>ce qu'il a le droit de faire</em> (leçon 11).</div>`,
