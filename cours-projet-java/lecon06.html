  title: "La couche service et les règles métier",
  subtitle: "Le cœur de l'application : où vivent les décisions.",
  theory: `
<h3>1. Le rôle du service</h3>
<p>Le <strong>service</strong> est le cœur de l'application : il contient la <strong>logique métier</strong>, c'est-à-dire les décisions propres à l'activité (peut-on louer ? reste-t-il du stock ?), indépendamment du web et de la base. Il <em>orchestre</em> (coordonne) un ou plusieurs repositories et applique les règles de la Ludothèque, comme un chef de cuisine qui décide de la recette et donne des ordres au magasinier.</p>
<pre class="pseudo">@Service                                              // annotation : cette classe est un service (couche métier gérée par Spring)
public class CatalogueService {                       // déclaration de la classe du service
    private final JeuRepository jeux;                 // le repository dont on a besoin ; final = fixé une fois, ne change plus
    public CatalogueService(JeuRepository jeux) { this.jeux = jeux; }   // constructeur : Spring fournit (injecte) le repository ici
    // méthodes métier…                               // les règles métier viendront ici
}                                                     // fin de la classe</pre>

<h3>2. L'injection de dépendances</h3>
<p>Le repository est <strong>injecté par le constructeur</strong>. Un <strong>constructeur</strong> est la méthode spéciale qui sert à fabriquer un objet ; ici, au lieu de créer lui-même le repository (avec le mot <code>new</code>), le service le <em>reçoit</em> tout prêt. C'est Spring qui le lui fournit : ce principe s'appelle l'<strong>injection de dépendances</strong> (ou « inversion de contrôle »). Image : on ne construit pas sa propre voiture, on se la fait livrer. Avantage : pour tester, on peut livrer un <em>faux</em> repository, sans vraie base. Le mot <code>final</code> devant le champ signifie qu'une fois reçu, il ne changera plus (immuable).</p>

<h3>3. Des méthodes qui portent le sens métier</h3>
<p>Une <strong>méthode</strong> est une action nommée que sait faire un objet (comme un bouton sur une machine). On leur donne des noms parlants :</p>
<pre class="pseudo">public List&lt;Jeu&gt; jeuxLouables() {                     // méthode métier : la liste des jeux qu'on peut louer
    return jeux.findByStockLocationGreaterThan(0);    // demande au repository les jeux dont le stock de location > 0
}                                                     // fin de la méthode
public Jeu parId(Long id) {                           // méthode : retrouver un jeu par son identifiant
    return jeux.findById(id)                          // findById renvoie un Optional (contient le jeu… ou rien)
        .orElseThrow(() -> new NoSuchElementException("Jeu introuvable"));   // si absent : lever une exception « Jeu introuvable »
}                                                     // fin de la méthode</pre>
<p>Le service traduit une intention (« les jeux qu'on peut louer ») en appels au repository. <code>findById</code> renvoie un <strong>Optional</strong> : une boîte qui contient soit le résultat, soit rien (elle évite les fameux « objets nuls » qui font planter). <code>orElseThrow</code> dit « sinon, lève une <strong>exception</strong> » — une exception étant un signal d'erreur qui interrompt le cours normal, comme une alarme. La syntaxe <code>() -&gt; ...</code> est une <em>lambda</em> : une mini-fonction écrite sur place. Le controller, lui, n'aura qu'à appeler ces méthodes claires.</p>

<h3>4. @Transactional : l'unité de travail</h3>
<pre class="pseudo">@Transactional                                        // entoure la méthode d'une transaction (tout réussit, ou tout est annulé)
public void ajouterStockLocation(Long idJeu, int quantite) {   // méthode : ajouter des exemplaires au stock de location
    Jeu j = parId(idJeu);                             // récupérer le jeu concerné (ou exception s'il n'existe pas)
    j.setStockLocation(j.getStockLocation() + quantite);   // lire le stock actuel, y ajouter la quantité, l'écrire dans l'objet
    jeux.save(j);                                     // sauvegarder le jeu modifié en base (UPDATE)
}                                                     // fin de la méthode</pre>
<p><code>@Transactional</code> entoure la méthode d'une <strong>transaction</strong> : un groupe d'opérations « tout ou rien ». Toutes ses écritures réussissent ensemble (<em>COMMIT</em>, on valide) ou sont toutes annulées (<em>ROLLBACK</em>, on revient en arrière) si une exception survient. C'est l'<em>atomicité</em>, comme un virement bancaire : soit l'argent part ET arrive, soit rien ne bouge. Indispensable pour louer/acheter (leçons 12-13).</p>

<h3>5. Pourquoi ne pas mettre ça dans le controller ?</h3>
<div class="warn">Mettre la logique métier dans le controller le rendrait gros, non réutilisable et difficile à tester. En l'isolant dans le service, on peut la tester sans HTTP ni base (leçon 17), et la réutiliser depuis le web ET l'API.</div>
<div class="tip">Règle simple : le controller traduit HTTP ↔ appels de méthodes ; le service décide ; le repository persiste (enregistre durablement). Chaque couche fait une seule chose, et le métier vit au centre.</div>`,

  ],

    ],
    solution: `<pre class="pseudo">@Service                                              // service = couche métier
public class CatalogueService {                       // classe du service catalogue
  private final JeuRepository jeux;                   // repository injecté (final = immuable)
  public CatalogueService(JeuRepository jeux) { this.jeux = jeux; }   // injection par constructeur

}                                                     // fin de la classe</pre>
<p>Le cœur métier est en place. Demain : l'exposer via une API REST.</p>`
