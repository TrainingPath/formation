  theory: `
<h3>1. Valider les entrées : Bean Validation</h3>
<p>On ne fait <strong>jamais</strong> confiance aux données reçues d'un client (elles peuvent être erronées, incomplètes ou malveillantes). <strong>Bean Validation</strong> est un standard Java pour poser des <strong>contraintes</strong> (des règles à respecter) directement sur les champs, sous forme d'annotations. Spring les vérifie automatiquement, comme un videur qui contrôle chaque entrée.</p>
<pre class="pseudo">public record CreationJeuDTO(                          // DTO d'entrée : les données envoyées pour créer un jeu
    @NotBlank String titre,                            // le titre est obligatoire et non vide (pas seulement des espaces)
    @Positive BigDecimal prixLocation,                 // le prix de location doit être strictement supérieur à 0
    @PositiveOrZero int stockLocation,                 // le stock de location doit être positif ou nul (>= 0)
    @NotNull Long idCategorie) {}                      // l'identifiant de catégorie ne doit pas être absent (non nul)</pre>

<h3>2. Déclencher la validation</h3>
<pre class="pseudo">@PostMapping                                          // répond au POST (création d'un jeu)
public JeuDTO creer(@Valid @RequestBody CreationJeuDTO dto) { ... }   // @Valid déclenche la validation du DTO reçu avant d'entrer dans la méthode</pre>
<p>Le mot-clé <code>@Valid</code> déclenche le contrôle <em>avant</em> l'entrée dans la méthode. Si une contrainte échoue, Spring lève (déclenche) une <strong>exception</strong> nommée <code>MethodArgumentNotValidException</code> — un signal d'erreur automatique qui interrompt le traitement.</p>

<h3>3. Les contraintes courantes</h3>
<p>Voici les annotations de contrainte les plus utiles (un aide-mémoire) :</p>
<pre class="pseudo">@NotNull       non nul
@NotBlank      texte non vide (et pas que des espaces)
@Positive      strictement > 0
@PositiveOrZero >= 0
@Size(max=120) longueur maximale
@Email         format d'email</pre>

<h3>4. Centraliser les erreurs : @RestControllerAdvice</h3>
<p>Plutôt que gérer les erreurs dans chaque contrôleur (répétitif et source d'oublis), on les traite au même endroit grâce à <code>@RestControllerAdvice</code> : une classe « conseil » qui surveille tous les contrôleurs. Avec <code>@ExceptionHandler</code>, chaque type d'exception est associé à une réponse, et <code>@ResponseStatus</code> fixe le code HTTP renvoyé.</p>
<pre class="pseudo">@RestControllerAdvice                                 // classe « conseil » : gère les erreurs de TOUS les contrôleurs au même endroit
class GestionErreurs {                                 // déclaration de la classe
    @ExceptionHandler(MethodArgumentNotValidException.class)   // quand cette exception (validation échouée) survient…
    @ResponseStatus(HttpStatus.BAD_REQUEST)               // …renvoyer le code HTTP 400 (Bad Request)
    Map&lt;String,String&gt; invalides(MethodArgumentNotValidException e) {   // méthode qui construit la réponse
        return Map.of("erreur", "données invalides");     // renvoyer un petit dictionnaire { "erreur": "données invalides" }
    }                                                 // fin du gestionnaire
    @ExceptionHandler(NoSuchElementException.class)       // quand une ressource est introuvable…
    @ResponseStatus(HttpStatus.NOT_FOUND)                 // …renvoyer le code HTTP 404 (Not Found)
    Map&lt;String,String&gt; introuvable() {                    // méthode de réponse
        return Map.of("erreur", "ressource introuvable"); // message maîtrisé
    }                                                 // fin du gestionnaire
}                                                     // fin de la classe</pre>
<p>Le type <code>Map&lt;String,String&gt;</code> est un petit dictionnaire « clé → valeur » (ici « erreur » → le message) que Spring transforme en JSON ; <code>Map.of(...)</code> en crée un rapidement.</p>

<h3>5. Pourquoi centraliser ?</h3>
<div class="tip">Un seul endroit décide comment une erreur devient une réponse HTTP : le code des contrôleurs reste propre, les réponses sont cohérentes partout, et on n'oublie aucun cas. La validation protège la base (données saines), l'advice protège le client (réponses claires).</div>
<div class="warn">Ne jamais renvoyer une <strong>stack trace</strong> (la trace technique détaillée d'un plantage, qui liste le code interne) ni un message technique brut au client : cela fuit des détails internes exploitables. On renvoie un message maîtrisé et le bon code HTTP.</div>`,

    solution: `<pre class="pseudo">public record CreationJeuDTO(                          // DTO d'entrée pour créer un jeu

    @Positive BigDecimal prixLocation,                 // prix de location strictement > 0

@RestControllerAdvice                                 // gestion centralisée des erreurs

}</pre>
<p>L'API est robuste. Demain : les utilisateurs et les trois rôles.</p>`
