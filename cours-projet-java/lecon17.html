  title: "Tests unitaires : JUnit et Mockito",
  subtitle: "Prouver que la logique métier est correcte, en isolation.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test automatique</strong> est un petit programme qui vérifie qu'une méthode fait ce qu'on attend, et qu'on relance à chaque modification du code, comme un contrôle qualité en bout de chaîne. Il documente les règles et attrape les <strong>régressions</strong> (des bugs réintroduits par une modification) avant qu'elles n'atteignent les utilisateurs.</p>

<h3>2. Un test JUnit</h3>
<p><strong>JUnit</strong> est la bibliothèque standard pour écrire des tests en Java.</p>
<pre class="pseudo">@Test                                                 // @Test : cette méthode est un test exécutable
void louer_decremente_le_stock() {                    // le nom du test décrit ce qu'il vérifie
    // given                                           // GIVEN : préparer la situation de départ
    Jeu j = new Jeu(); j.setStockLocation(2);          // un jeu avec 2 exemplaires en stock de location
    // when                                            // WHEN : exécuter l'action à tester
    service.louer(10L, 1L);                            // louer ce jeu
    // then                                            // THEN : vérifier le résultat attendu
    assertEquals(1, j.getStockLocation());             // le stock doit maintenant valoir 1
}                                                     // fin du test</pre>
<p>Structure classique <strong>given / when / then</strong> (« étant donné / quand / alors ») : on <em>prépare</em> une situation, on <em>agit</em>, puis on <em>vérifie</em> avec des <code>assert…</code> — des affirmations qui font échouer le test si elles sont fausses. <code>assertEquals(attendu, obtenu)</code> compare une valeur attendue à celle produite.</p>

<h3>3. Isoler avec Mockito</h3>
<p>Le service dépend d'un repository. Pour tester le service <strong>seul</strong> (sans vraie base, donc rapidement et sans surprise), on remplace le repository par un <strong>mock</strong> : un faux objet qu'on programme pour répondre ce qu'on veut. <strong>Mockito</strong> est la bibliothèque qui fabrique ces doublures.</p>
<pre class="pseudo">@ExtendWith(MockitoExtension.class)                   // active le support des mocks Mockito dans ce test
class LocationServiceTest {                            // classe de tests du service de location
    @Mock JeuRepository jeux;                          // faux repository de jeux (mock)
    @Mock LocationRepository locations;                // faux repository de locations (mock)
    @InjectMocks LocationService service;              // le service testé, avec les mocks injectés dedans

    @Test void louer_decremente_le_stock() {           // test : la location fait baisser le stock
        Jeu j = new Jeu(); j.setStockLocation(2);      // given : un jeu avec 2 en stock de location
        when(jeux.findById(1L)).thenReturn(Optional.of(j));   // programmer le mock : findById(1) renvoie ce jeu
        service.louer(10L, 1L);                        // when : louer le jeu
        assertEquals(1, j.getStockLocation());         // then : le stock vaut 1
    }                                                 // fin du test
}                                                     // fin de la classe</pre>

<h3>4. Tester les cas d'erreur</h3>
<pre class="pseudo">@Test void louer_sans_stock_leve_exception() {        // test du cas d'erreur : plus de stock
    Jeu j = new Jeu(); j.setStockLocation(0);          // given : un jeu sans stock de location
    when(jeux.findById(1L)).thenReturn(Optional.of(j));   // le mock renvoie ce jeu
    assertThrows(StockInsuffisantException.class, () -&gt; service.louer(10L, 1L));   // then : louer doit lever l'exception attendue
}                                                     // fin du test</pre>
<p>Un bon test couvre le <em>cas nominal</em> (tout se passe bien) <strong>et</strong> les <em>cas limites</em> (stock nul, jeu introuvable). <code>assertThrows</code> vérifie qu'une exception précise est bien levée. La syntaxe <code>() -&gt; ...</code> est une lambda qui encapsule l'action censée échouer.</p>

<h3>5. Rapides et ciblés</h3>
<div class="tip">Les tests unitaires ne touchent ni la base ni le réseau : ils s'exécutent en millisecondes. On peut en avoir des centaines, lancés à chaque <em>build</em> (chaque assemblage du programme). <code>@InjectMocks</code> crée le service en y injectant les mocks ; <code>when(...).thenReturn(...)</code> programme leur comportement. C'est ainsi qu'on sécurise le métier de la Ludothèque.</div>`,

    { type: "qcm", q: "Un test unitaire touche la base ?", opts: ["Oui", "Non (isolé)", "Parfois obligatoire", "Toujours"], a: 1, exp: "Isolé, rapide." },

    { type: "qcm", q: "Les tests unitaires s'exécutent en…", opts: ["Minutes", "Millisecondes", "Heures", "Jours"], a: 1, exp: "Très rapides." },
    { type: "vf", q: "Les tests documentent les règles métier et attrapent les régressions.", a: true, exp: "Double bénéfice." },
    { type: "qcm", q: "when(jeux.findById(1L)).thenReturn(Optional.of(j)) …", opts: ["Écrit en base", "Simule le retour du repository", "Trie", "Supprime"], a: 1, exp: "Stub du repo." },

  ],

      { type: "vf", q: "Un test unitaire s'exécute sans base ni réseau.", a: true, exp: "Rapide et isolé." }
    ],
    solution: `<pre class="pseudo">@ExtendWith(MockitoExtension.class)                   // active les mocks Mockito
class LocationServiceTest {                           // classe de tests du service de location
  @Mock JeuRepository jeux;                           // faux repository de jeux
  @Mock LocationRepository locations;                 // faux repository de locations
  @InjectMocks LocationService service;               // service testé, avec les mocks injectés

  @Test void louer_decremente_le_stock() {            // cas nominal
    Jeu j = new Jeu(); j.setStockLocation(2);         // given : jeu avec 2 en stock
    when(jeux.findById(1L)).thenReturn(Optional.of(j));   // le mock renvoie ce jeu
    service.louer(10L, 1L);                           // when : louer

  }
  @Test void sans_stock_leve_exception() {            // cas d'erreur

    assertThrows(StockInsuffisantException.class, () -&gt; service.louer(10L, 1L));   // then : exception attendue
  }
}</pre>
<p>Le métier est testé en isolation. Demain : les tests d'intégration.</p>`
