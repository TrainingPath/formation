var DAY = {
  num: 18,
  title: "Tests d'intégration : l'API et une base de test",
  subtitle: "Vérifier l'assemblage réel de toutes les couches.",
  theory: `
<h3>1. Unitaire vs intégration</h3>
<p>Le test unitaire isole une brique (leçon 17). Le <strong>test d'intégration</strong> vérifie la <strong>chaîne complète</strong> : controller → service → repository → base. Il valide que les couches s'assemblent vraiment, comme un essai routier après avoir testé chaque pièce séparément.</p>

<h3>2. Démarrer le contexte Spring</h3>
<pre class="pseudo">@SpringBootTest                                       // démarre l'application entière pour le test (toutes les couches)
@AutoConfigureMockMvc                                 // prépare MockMvc, l'outil qui envoie de fausses requêtes HTTP
class JeuApiIT {                                       // classe de test d'intégration (IT = Integration Test)
    @Autowired MockMvc mvc;                            // @Autowired : Spring fournit ici l'objet MockMvc
    // ...                                             // les tests viendront ici
}                                                     // fin de la classe</pre>
<p><code>@SpringBootTest</code> démarre l'application entière (le <em>contexte Spring</em> : tous les <em>beans</em>, la base, la sécurité). <code>MockMvc</code> envoie de vraies requêtes HTTP à l'application <em>sans</em> lancer de serveur réseau : plus rapide et plus simple qu'un vrai navigateur. <code>@Autowired</code> demande à Spring de fournir automatiquement l'objet dont on a besoin.</p>

<h3>3. Une base de test isolée</h3>
<pre class="pseudo"># application-test.properties                          # fichier de configuration réservé aux tests
spring.datasource.url=jdbc:h2:mem:test   # base en mémoire, jetable (recréée à chaque test, effacée après)
# ou une base MySQL de test dédiée, séparée de la production   # autre option : une vraie MySQL, mais isolée de la prod</pre>
<p>On teste sur une base <strong>dédiée</strong> — souvent <strong>H2</strong> (une base légère qui vit <em>en mémoire</em>, c'est-à-dire dans la RAM, et disparaît à la fin), ou un conteneur MySQL de test — jamais la vraie. Chaque exécution part d'un état propre, sans polluer les données réelles.</p>

<h3>4. Un test d'API</h3>
<pre class="pseudo">@Test                                                 // méthode de test
@Sql("/data-test.sql")     // précharge des jeux (exécute ce script SQL avant le test)
void liste_les_jeux() throws Exception {              // « throws Exception » : le test peut lever une exception
    mvc.perform(get("/api/jeux"))                      // envoyer une requête GET /api/jeux
       .andExpect(status().isOk())                     // vérifier que la réponse a le statut 200 (OK)
       .andExpect(jsonPath("$[0].titre").exists());    // vérifier que le 1er élément JSON possède un champ « titre »
}                                                     // fin du test</pre>
<p><code>@Sql</code> exécute un script SQL avant le test pour préparer des données. On appelle ensuite l'endpoint réel et on vérifie le <strong>statut HTTP</strong> (200, 404…) et le <strong>contenu JSON</strong> avec <code>jsonPath</code> (une façon de désigner un champ précis à l'intérieur du JSON).</p>

<h3>5. Tester la sécurité aussi</h3>
<pre class="pseudo">@Test @WithMockUser(roles = "CLIENT")                 // simuler un utilisateur connecté ayant le rôle CLIENT
void un_client_ne_peut_pas_creer_un_jeu() throws Exception {   // le test
    mvc.perform(post("/api/jeux").contentType(APPLICATION_JSON).content("{...}"))   // POST création d'un jeu (corps JSON)
       .andExpect(status().isForbidden());   // 403 : vérifier que l'accès est refusé (interdit au client)
}                                                     // fin du test</pre>
<div class="tip">La <strong>pyramide des tests</strong> : beaucoup d'unitaires (rapides, ciblés) à la base, moins d'intégration (plus lents, mais réalistes) au milieu, quelques tests <em>bout-en-bout</em> (l'application complète, comme un vrai utilisateur) au sommet. <code>@WithMockUser</code> simule un utilisateur connecté avec un rôle donné. Ensemble, ces tests garantissent que la Ludothèque marche vraiment, pas seulement en théorie.</div>`,
  exercises: [
    { type: "qcm", q: "Un test d'intégration vérifie…", opts: ["Une méthode isolée", "La chaîne complète des couches", "Uniquement le contrôleur", "La performance réseau"], a: 1, exp: "Assemblage réel." },
    { type: "qcm", q: "Démarrer l'application pour le test :", opts: ["@Test seul", "@SpringBootTest", "@Mock", "@Entity"], a: 1, exp: "Contexte complet." },
    { type: "qcm", q: "Envoyer des requêtes HTTP sans serveur réseau :", opts: ["MockMvc", "curl", "un navigateur", "Postman obligatoire"], a: 0, exp: "MockMvc." },
    { type: "qcm", q: "La base de test est…", opts: ["La production", "Dédiée et jetable (H2 ou MySQL de test)", "Partagée avec le dev", "Un simple fichier CSV"], a: 1, exp: "Isolée." },
    { type: "qcm", q: "Vérifier le statut HTTP :", opts: ["andExpect(status().isOk())", "status().equals(200)", "assertEquals(200)", "andReturn() seul"], a: 0, exp: "Assertion MockMvc." },
    { type: "qcm", q: "Vérifier un champ JSON :", opts: ["jsonPath(\"$[0].titre\").exists()", "assertEquals", "objectMapper.read()", "response.contains()"], a: 0, exp: "jsonPath." },
    { type: "qcm", q: "Précharger des données de test :", opts: ["@Sql(\"/data-test.sql\")", "@Insert", "manuellement en prod", "@BeforeAll manuel"], a: 0, exp: "Jeu de données." },
    { type: "qcm", q: "Tester qu'un client ne peut pas créer un jeu :", opts: ["@WithMockUser(roles=\"CLIENT\") + attendre 403", "ignorer la sécurité", "désactiver la sécurité du test", "attendre un 200"], a: 0, exp: "Sécurité testée." },
    { type: "qcm", q: "Un client tentant une action interdite reçoit…", opts: ["200", "403 Forbidden", "201", "404"], a: 1, exp: "Interdit." },
    { type: "qcm", q: "La pyramide des tests : le plus nombreux =", opts: ["Bout-en-bout", "Unitaires", "Manuels", "D'intégration"], a: 1, exp: "Base large." },
    { type: "vf", q: "On ne teste jamais sur la base de production.", a: true, exp: "Base dédiée." },
    { type: "qcm", q: "@AutoConfigureMockMvc fournit…", opts: ["La base", "Le MockMvc prêt à l'emploi", "Un serveur Tomcat réel", "Le client RestTemplate"], a: 1, exp: "Client HTTP de test." },
    { type: "vf", q: "Le test d'intégration traverse controller, service, repository et base.", a: true, exp: "Toutes les couches." },
    { type: "qcm", q: "Les tests d'intégration sont, vs unitaires…", opts: ["Plus rapides", "Plus lents mais plus réalistes", "Identiques", "Moins fiables"], a: 1, exp: "Compromis." },
    { type: "qcm", q: "H2 en mémoire est…", opts: ["Une base de prod", "Une base jetable pour les tests", "Un cache en mémoire", "Un mock"], a: 1, exp: "Base de test." }
  ],
  final: {
    title: "Exercice final — Tester l'API bout en bout",
    intro: `<p>On valide l'assemblage réel.</p>`,
    questions: [
      { type: "qcm", q: "Annoter la classe de test :", opts: ["@SpringBootTest @AutoConfigureMockMvc", "@Mock", "@Entity", "@Service"], a: 0, exp: "Contexte + MockMvc." },
      { type: "qcm", q: "Appeler GET /api/jeux :", opts: ["mvc.perform(get(\"/api/jeux\"))", "new URL()", "curl", "restTemplate.getForObject()"], a: 0, exp: "MockMvc." },
      { type: "qcm", q: "Attendre un 200 :", opts: ["andExpect(status().isOk())", "assertEquals", "andExpect(200)", "status().ok()"], a: 0, exp: "Statut." },
      { type: "qcm", q: "La base utilisée :", opts: ["la production", "une base de test dédiée", "la base partagée du dev", "un simple fichier"], a: 1, exp: "Isolée." },
      { type: "vf", q: "On peut tester la sécurité avec @WithMockUser et vérifier un 403.", a: true, exp: "Autorisation testée." }
    ],
    solution: `<pre class="pseudo">@SpringBootTest                                       // démarre l'application entière
@AutoConfigureMockMvc                                 // prépare MockMvc (fausses requêtes HTTP)
class JeuApiIT {                                       // classe de test d'intégration
  @Autowired MockMvc mvc;                             // MockMvc fourni par Spring

  @Test @Sql("/data-test.sql")                        // test, avec données préchargées via SQL
  void liste_les_jeux() throws Exception {            // le test peut lever une exception
    mvc.perform(get("/api/jeux"))                     // appeler GET /api/jeux
       .andExpect(status().isOk())                    // attendre un statut 200
       .andExpect(jsonPath("$[0].titre").exists());   // vérifier la présence du champ « titre »
  }

  @Test @WithMockUser(roles = "CLIENT")               // simuler un utilisateur de rôle CLIENT
  void client_ne_cree_pas_de_jeu() throws Exception { // le test
    mvc.perform(post("/api/jeux").contentType(APPLICATION_JSON).content("{}"))   // POST création (corps JSON vide)
       .andExpect(status().isForbidden());            // attendre un 403 (accès refusé)
  }
}</pre>
<p>L'assemblage est validé. Demain : la qualité (logs, performance, secrets).</p>`
  }
};
