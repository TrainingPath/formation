  theory: `
<h3>1. API JSON ou pages HTML ?</h3>
<p>L'API REST (leçon 7) renvoie du JSON, consommé par une appli mobile ou un <em>front</em> séparé (une interface développée à part). Pour un site web classique, on fabrique le HTML <strong>côté serveur</strong> (c'est le serveur qui assemble la page finie) avec <strong>Thymeleaf</strong>, un <em>moteur de templates</em> : un système qui remplit un modèle de page HTML avec des données, comme un publipostage qui insère le nom de chaque destinataire dans une lettre type. Le même service alimente les deux.</p>

<h3>2. Un contrôleur web (pas REST)</h3>
<pre class="pseudo">@Controller     // et non @RestController              // @Controller : renvoie des VUES (HTML), pas du JSON
public class CatalogueWebController {                  // classe du contrôleur web
    private final CatalogueService service;            // le même service métier que l'API (injecté)
    public CatalogueWebController(CatalogueService s) { this.service = s; }   // injection par constructeur

    @GetMapping("/catalogue")                          // répond au GET /catalogue
    public String catalogue(Model model) {             // le Model transporte les données vers la vue
        model.addAttribute("jeux", service.jeuxLouables());   // déposer la liste des jeux louables sous le nom « jeux »
        return "catalogue";     // nom du template catalogue.html   (renvoie le NOM de la vue à afficher)
    }                                                 // fin de la méthode
}                                                     // fin de la classe</pre>
<p>Un <code>@Controller</code> (sans « Rest ») renvoie le <strong>nom d'une vue</strong> (le fichier HTML à afficher) plutôt que des données ; les données à afficher passent par le <strong>Model</strong>, une sorte de sac étiqueté que la vue viendra piocher.</p>

<h3>3. Le template Thymeleaf</h3>
<p>Un <strong>template</strong> est une page HTML normale enrichie d'attributs spéciaux <code>th:...</code> que Thymeleaf remplace par les vraies valeurs :</p>
<pre class="pseudo">&lt;!-- src/main/resources/templates/catalogue.html --&gt;   &lt;!-- emplacement du fichier de template --&gt;
&lt;table&gt;                                                &lt;!-- début d'un tableau HTML --&gt;
  &lt;tr th:each="jeu : \${jeux}"&gt;                         &lt;!-- th:each : répéter cette ligne pour chaque jeu de la liste --&gt;
    &lt;td th:text="\${jeu.titre}"&gt;Titre&lt;/td&gt;              &lt;!-- th:text : afficher le titre du jeu dans la cellule --&gt;
    &lt;td th:text="\${jeu.prixLocation} + ' €'"&gt;0 €&lt;/td&gt;  &lt;!-- afficher le prix de location suivi de « € » --&gt;
    &lt;td&gt;&lt;a th:href="@{/louer/{id}(id=\${jeu.idJeu})}"&gt;Louer&lt;/a&gt;&lt;/td&gt;   &lt;!-- th:href : lien vers /louer/ID-du-jeu --&gt;
  &lt;/tr&gt;                                                &lt;!-- fin de la ligne du tableau --&gt;
&lt;/table&gt;                                               &lt;!-- fin du tableau --&gt;</pre>
<p><code>th:each</code> boucle (répète un élément pour chaque valeur d'une liste), <code>th:text</code> affiche une valeur, <code>th:href="@{...}"</code> construit une URL. Astuce : le HTML reste valide même sans serveur (on peut l'ouvrir tel quel pour un aperçu statique).</p>

<h3>4. Formulaires et POST</h3>
<p>Un <strong>formulaire</strong> HTML sert à envoyer au serveur des données saisies par l'utilisateur.</p>
<pre class="pseudo">&lt;form th:action="@{/louer}" method="post"&gt;            &lt;!-- formulaire envoyé en POST vers /louer --&gt;
  &lt;input type="hidden" name="idJeu" th:value="\${jeu.idJeu}"&gt;   &lt;!-- champ caché portant l'id du jeu à louer --&gt;
  &lt;button&gt;Louer&lt;/button&gt;                                &lt;!-- bouton qui soumet le formulaire --&gt;
&lt;/form&gt;                                                &lt;!-- fin du formulaire --&gt;</pre>
<p>Une action de modification passe par <code>POST</code> (le verbe HTTP qui envoie des données) ; on <em>redirige</em> ensuite vers une autre page (motif « Post-Redirect-Get ») pour éviter la double soumission si l'utilisateur recharge la page.</p>

<h3>5. Sécurité des templates</h3>
<div class="tip">Thymeleaf <strong>échappe automatiquement</strong> le HTML injecté via <code>th:text</code> : il neutralise les caractères dangereux, si bien qu'un titre malicieux ne peut pas exécuter de script. C'est une protection contre les failles <strong>XSS</strong> (<em>Cross-Site Scripting</em> : injection de code malveillant dans une page). Le même <code>CatalogueService</code> sert l'API et les pages : une seule logique métier, deux présentations.</div>`,
