<script>
var DAY = {
  num: 3,
  title: "Du MCD Merise aux migrations (Flyway)",
  subtitle: "Traduire le modèle conçu en Merise en un schéma MySQL versionné.",
  theory: `
<h3>1. Pourquoi des migrations ?</h3>
<p>Le <strong>schéma</strong> (la structure des tables et colonnes de la base) ne doit dépendre ni de la machine ni d'Hibernate : il doit être <strong>reproductible</strong> (identique partout) et <strong>versionné</strong> (dont on garde l'historique). Une <strong>migration</strong> est un petit script <strong>SQL</strong> numéroté, appliqué une seule fois, conservé dans le dépôt <strong>Git</strong>. SQL (<em>Structured Query Language</em>) est la langue standard pour parler aux bases de données ; Git est l'outil qui enregistre l'historique du code, comme un carnet où l'on note chaque modification avec sa date. <strong>Flyway</strong> exécute ces scripts dans l'ordre au démarrage, comme on suit une notice de montage étape par étape sans jamais refaire une étape déjà faite.</p>

<h3>2. Où placer les migrations</h3>
<pre class="pseudo">src/main/resources/db/migration/
├── V1__schema.sql        les tables
├── V2__utilisateurs.sql  ajout des utilisateurs
└── V3__operations.sql    louer / acheter / réserver</pre>
<p>Convention Flyway : <code>V{numéro}__{description}.sql</code> (deux tirets bas, « underscores »). Chaque fichier est appliqué une fois puis ne se modifie plus une fois joué — comme une page de journal officiel : une fois publiée, on ne la réécrit pas, on publie une correction séparée.</p>

<h3>3. Traduire le MCD Merise</h3>
<p>Le <strong>MCD</strong> (Modèle Conceptuel de Données) est le schéma dessiné en Merise qui décrit les informations et leurs liens. On le traduit en <strong>tables</strong> MySQL : une table est un tableau à colonnes et lignes, comme une feuille de tableur. Ici, deux stocks distincts (vente et location) et un fournisseur relié au jeu.</p>
<pre class="pseudo">-- V1__schema.sql                                  -- nom du script (V1 = première version du schéma)
CREATE TABLE CATEGORIE (                            -- créer la table CATEGORIE (un tableau de catégories)
  idCategorie INT AUTO_INCREMENT PRIMARY KEY,       -- identifiant unique, entier, numéroté automatiquement (clé primaire)
  libelle     VARCHAR(60) NOT NULL                  -- le nom de la catégorie : texte jusqu'à 60 caractères, obligatoire
) ENGINE=InnoDB;                                    -- moteur InnoDB : gère clés étrangères et transactions

CREATE TABLE FOURNISSEUR (                          -- créer la table FOURNISSEUR
  idFournisseur INT AUTO_INCREMENT PRIMARY KEY,     -- identifiant unique auto-incrémenté
  nom           VARCHAR(80) NOT NULL                -- nom du fournisseur, obligatoire
) ENGINE=InnoDB;                                    -- moteur InnoDB

CREATE TABLE JEU (                                  -- créer la table JEU
  idJeu INT AUTO_INCREMENT PRIMARY KEY,             -- identifiant unique du jeu (clé primaire)
  titre VARCHAR(120) NOT NULL,                      -- titre du jeu, obligatoire
  prixAchat DECIMAL(6,2) NOT NULL,                  -- prix d'achat : nombre à 2 décimales (ex : 44.90), obligatoire
  prixLocation DECIMAL(6,2) NOT NULL,               -- prix de location, obligatoire
  stockVente INT NOT NULL DEFAULT 0,                -- quantité en stock pour la vente (0 par défaut)
  stockLocation INT NOT NULL DEFAULT 0,             -- quantité en stock pour la location (0 par défaut)
  idCategorie INT NOT NULL,                         -- catégorie du jeu (obligatoire)
  idFournisseur INT NULL,                           -- fournisseur du jeu (facultatif : NULL autorisé)
  CONSTRAINT fk_jeu_cat  FOREIGN KEY (idCategorie)  REFERENCES CATEGORIE(idCategorie),    -- clé étrangère : idCategorie doit exister dans CATEGORIE
  CONSTRAINT fk_jeu_four FOREIGN KEY (idFournisseur) REFERENCES FOURNISSEUR(idFournisseur) -- clé étrangère : idFournisseur doit exister dans FOURNISSEUR
) ENGINE=InnoDB;                                    -- moteur InnoDB</pre>
<p>Décodons ce SQL. <code>CREATE TABLE</code> crée un nouveau tableau. Chaque ligne entre parenthèses décrit une <strong>colonne</strong> : son nom puis son <em>type</em> (la nature du contenu). <code>INT</code> = nombre entier, <code>VARCHAR(60)</code> = texte d'au plus 60 caractères, <code>DECIMAL(6,2)</code> = nombre à virgule avec 2 décimales (idéal pour un prix). <code>PRIMARY KEY</code> (« clé primaire ») est la colonne qui identifie de façon unique chaque ligne, comme un numéro de sécurité sociale ; <code>AUTO_INCREMENT</code> demande à MySQL de numéroter tout seul (1, 2, 3…). <code>NOT NULL</code> signifie « obligatoire » (interdit de laisser vide), <code>DEFAULT 0</code> fournit une valeur par défaut. Enfin une <strong>clé étrangère</strong> (<code>FOREIGN KEY … REFERENCES …</code>) relie une table à une autre : chaque jeu pointe vers une catégorie existante — impossible d'inventer une catégorie qui n'existe pas, c'est l'<em>intégrité référentielle</em>.</p>

<h3>4. Comment Flyway suit l'état</h3>
<p>Flyway crée une table <code>flyway_schema_history</code> qui note les migrations déjà appliquées, comme un registre de présence. Au démarrage, il n'exécute que les nouvelles. Impossible de rejouer deux fois la même.</p>
<div class="warn">On ne modifie <strong>jamais</strong> une migration déjà appliquée (elle est « figée »). Pour changer le schéma, on ajoute une <strong>nouvelle</strong> migration (V2, V3…). C'est ce qui rend la base cohérente entre tous les développeurs et environnements.</div>

<h3>5. Cohérence avec ddl-auto=validate</h3>
<p>Avec <code>ddl-auto=validate</code> (leçon 2), Hibernate ne crée rien : il <strong>vérifie</strong> seulement que les entités Java correspondent au schéma créé par Flyway. Les deux se complètent : Flyway construit, Hibernate contrôle.</p>
<div class="tip">Résultat : le même <code>git clone</code> (récupérer une copie du projet depuis Git) suivi du démarrage produit exactement la même base sur toutes les machines. La conception Merise, le SQL MySQL et le code Java sont désormais reliés par un pont fiable.</div>`,
  exercises: [
    { type: "qcm", q: "Une migration est…", opts: ["Un test", "Un script SQL numéroté, appliqué une fois et versionné", "Un controller", "Un DTO"], a: 1, exp: "Schéma reproductible." },
    { type: "qcm", q: "L'outil de migration utilisé :", opts: ["Flyway", "Tomcat", "Maven", "JUnit"], a: 0, exp: "Flyway (ou Liquibase)." },
    { type: "qcm", q: "La convention de nommage Flyway :", opts: ["migration1.sql", "V1__schema.sql (deux underscores)", "schema.v1", "1-schema"], a: 1, exp: "V{n}__{desc}.sql." },
    { type: "qcm", q: "Les migrations se placent dans…", opts: ["src/test", "src/main/resources/db/migration", "la racine", "src/main/java"], a: 1, exp: "Dossier conventionnel." },
    { type: "qcm", q: "Le MCD Merise se traduit en…", opts: ["Classes de test", "Tables MySQL (CREATE TABLE)", "Interfaces Java", "DTO"], a: 1, exp: "Le schéma relationnel." },
    { type: "qcm", q: "Flyway suit l'état via…", opts: ["Un fichier texte", "La table flyway_schema_history", "Un commentaire SQL", "Une colonne version"], a: 1, exp: "Historique des migrations." },
    { type: "qcm", q: "Modifier une migration déjà appliquée…", opts: ["Est recommandé", "Est interdit : on ajoute une nouvelle migration", "Accélère", "Efface la base"], a: 1, exp: "Migrations figées." },
    { type: "qcm", q: "Changer le schéma ensuite se fait par…", opts: ["Éditer V1", "Une nouvelle migration V2, V3…", "Hibernate create", "Modifier l'entité JPA"], a: 1, exp: "Nouvelle migration." },
    { type: "qcm", q: "Avec validate, Hibernate…", opts: ["Crée les tables", "Vérifie que les entités correspondent au schéma", "Efface tout", "Ne démarre pas"], a: 1, exp: "Contrôle seulement." },
    { type: "qcm", q: "Flyway et Hibernate se répartissent :", opts: ["Les deux créent les tables", "Flyway construit, Hibernate vérifie", "Hibernate construit, Flyway vérifie", "Aucun ne sert"], a: 1, exp: "Complémentaires." },
    { type: "vf", q: "Le même clone + démarrage produit la même base partout.", a: true, exp: "Reproductibilité." },
    { type: "qcm", q: "JEU a deux clés étrangères vers…", opts: ["CLIENT et VENDEUR", "CATEGORIE et FOURNISSEUR", "LOUER et ACHETER", "aucune"], a: 1, exp: "Catégorie et fournisseur." },
    { type: "vf", q: "Une migration appliquée n'est jamais rejouée par Flyway.", a: true, exp: "Historique." },
    { type: "qcm", q: "Le moteur des tables :", opts: ["MyISAM", "InnoDB (FK + transactions)", "MEMORY", "CSV"], a: 1, exp: "InnoDB." },
    { type: "qcm", q: "Les migrations sont versionnées dans…", opts: ["Le serveur MySQL", "Git (le dépôt du projet)", "La base seule", "Un fichier local non suivi"], a: 1, exp: "Suivi de version." }
  ],
  final: {
    title: "Exercice final — La première migration",
    intro: `<p>On crée le schéma initial de la Ludothèque via Flyway.</p>`,
    questions: [
      { type: "qcm", q: "Le nom de fichier correct :", opts: ["schema1.sql", "V1__schema.sql", "1_schema.sql", "migration.sql"], a: 1, exp: "Convention Flyway." },
      { type: "qcm", q: "La clé auto-incrémentée en MySQL :", opts: ["IDENTITY(1,1)", "INT AUTO_INCREMENT PRIMARY KEY", "SERIAL", "SEQUENCE"], a: 1, exp: "AUTO_INCREMENT." },
      { type: "qcm", q: "Relier JEU à CATEGORIE :", opts: ["FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)", "UNIQUE idCategorie", "CHECK", "DEFAULT"], a: 0, exp: "Clé étrangère." },
      { type: "qcm", q: "Pour que Flyway gère seul le schéma, ddl-auto vaut…", opts: ["create", "validate", "update", "none et pas de JPA"], a: 1, exp: "validate." },
      { type: "vf", q: "On ajoute une migration V2 plutôt que de modifier V1 déjà appliquée.", a: true, exp: "Migrations figées." }
    ],
    solution: `<pre class="pseudo">-- src/main/resources/db/migration/V1__schema.sql   -- emplacement et nom du script de première version
CREATE TABLE CATEGORIE (                            -- créer la table des catégories
  idCategorie INT AUTO_INCREMENT PRIMARY KEY,       -- identifiant unique auto-numéroté (clé primaire)
  libelle     VARCHAR(60) NOT NULL                  -- nom de la catégorie, texte obligatoire (max 60 car.)
) ENGINE=InnoDB;                                    -- moteur InnoDB (clés étrangères + transactions)

CREATE TABLE JEU (                                  -- créer la table des jeux
  idJeu INT AUTO_INCREMENT PRIMARY KEY,             -- identifiant unique du jeu
  titre VARCHAR(120) NOT NULL,                      -- titre du jeu, obligatoire
  prixLocation DECIMAL(6,2) NOT NULL,               -- prix de location : nombre à 2 décimales, obligatoire
  stockVente INT NOT NULL DEFAULT 0,                -- stock de vente (0 par défaut)
  stockLocation INT NOT NULL DEFAULT 0,             -- stock de location (0 par défaut)
  idCategorie INT NOT NULL,                         -- catégorie du jeu (obligatoire)
  CONSTRAINT fk_jeu_cat FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)   -- clé étrangère vers CATEGORIE
) ENGINE=InnoDB;                                    -- moteur InnoDB</pre>
<p>Le schéma est versionné et reproductible. Demain : refléter ces tables en entités JPA.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta migration Flyway…",
  items: [
  { id: "projjava-l3", title: "La migration des opérations", level: 3,
    statement: "Écris la migration Flyway V3__operations.sql qui crée les tables LOUER(idClient, idJeu, dateDebut, nbJours) et ACHETER(idClient, idJeu, dateAchat, montant), en InnoDB, avec les clés étrangères vers UTILISATEUR (via idClient) et JEU. Choisis un bon nom de fichier.",
    hints: [
      "Fichier : src/main/resources/db/migration/V3__operations.sql.",
      "Chaque table a sa clé primaire auto-incrémentée et deux clés étrangères.",
      "dateDebut/dateAchat en DATE, montant en DECIMAL(6,2) ; ENGINE=InnoDB."
    ],
    solution: "-- V3__operations.sql\nCREATE TABLE LOUER (                                                -- table des locations\n  idLocation INT AUTO_INCREMENT PRIMARY KEY,                        -- identifiant unique de la location (cle primaire)\n  idClient INT NOT NULL,                                            -- quel client (obligatoire)\n  idJeu    INT NOT NULL,                                            -- quel jeu (obligatoire)\n  dateDebut DATE NOT NULL,                                          -- date de debut de location\n  nbJours  INT NOT NULL,                                            -- nombre de jours loues\n  CONSTRAINT fk_louer_client FOREIGN KEY (idClient) REFERENCES UTILISATEUR(idUtilisateur),   -- cle etrangere vers UTILISATEUR\n  CONSTRAINT fk_louer_jeu    FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu)                     -- cle etrangere vers JEU\n) ENGINE=InnoDB;                                                    -- moteur InnoDB\n\nCREATE TABLE ACHETER (                                              -- table des achats\n  idAchat INT AUTO_INCREMENT PRIMARY KEY,                           -- identifiant unique de l'achat\n  idClient INT NOT NULL,                                            -- quel client (obligatoire)\n  idJeu    INT NOT NULL,                                            -- quel jeu (obligatoire)\n  dateAchat DATE NOT NULL,                                          -- date de l'achat\n  montant  DECIMAL(6,2) NOT NULL,                                   -- montant paye (2 decimales)\n  CONSTRAINT fk_achat_client FOREIGN KEY (idClient) REFERENCES UTILISATEUR(idUtilisateur),   -- cle etrangere vers UTILISATEUR\n  CONSTRAINT fk_achat_jeu    FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu)                     -- cle etrangere vers JEU\n) ENGINE=InnoDB;                                                    -- moteur InnoDB",
    atoi: { cmd: "./mvnw spring-boot:run   # Flyway applique la migration au démarrage\nmysql -u ludo -p ludotheque -e \"SHOW TABLES; DESCRIBE LOUER;\"", expected: "Au démarrage, Flyway journalise « Migrating schema `ludotheque` to version 3 - operations », puis SHOW TABLES fait apparaître ACHETER et LOUER (ENGINE=InnoDB, clés étrangères vers UTILISATEUR et JEU)." },
    checklist: [
      "Le fichier s'appelle V3__operations.sql (préfixe V, double underscore) dans db/migration.",
      "Les deux tables sont en ENGINE=InnoDB (transactions + clés étrangères).",
      "Chaque FK référence bien UTILISATEUR(idUtilisateur) et JEU(idJeu).",
      "Flyway l'applique sans erreur (statut « success » dans flyway_schema_history)."
    ],
    note: "Cette migration ajoute les opérations métier de la Ludothèque, numérotée V3 pour s'appliquer après le schéma (V1) et les utilisateurs (V2). Les clés étrangères relient chaque opération à son client et à son jeu — l'intégrité référentielle conçue en Merise, appliquée par InnoDB." }
  ]
};
</script>
