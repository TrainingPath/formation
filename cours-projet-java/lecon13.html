  title: "Acheter un jeu : paiement simulé, stock de vente",
  subtitle: "La même mécanique que louer, sur l'autre stock.",
  theory: `
<h3>1. Acheter vs louer</h3>
<p>L'achat reprend la structure de la location, mais agit sur <code>stockVente</code> (le stock destiné à la vente) et non <code>stockLocation</code>. Le montant payé est le <strong>prix d'achat</strong> du jeu. Les deux stocks distincts du modèle Merise prennent ici tout leur sens : un même jeu peut être disponible à la vente mais épuisé à la location, ou l'inverse.</p>

<h3>2. Le service d'achat</h3>
<pre class="pseudo">@Service                                              // couche métier gérée par Spring
public class AchatService {                           // classe du service d'achat
    private final JeuRepository jeux;                 // repository des jeux (injecté)
    private final AchatRepository achats;             // repository des achats (injecté)
    // constructeur…                                 // reçoit les deux repositories (injection)

    @Transactional                                    // méthode atomique (tout ou rien)
    public Achat acheter(Long idClient, Long idJeu) { // acheter le jeu idJeu pour le client idClient
        Jeu j = jeux.findById(idJeu).orElseThrow();   // récupérer le jeu (ou exception si introuvable)
        if (j.getStockVente() &lt;= 0)                   // s'il ne reste aucun exemplaire à vendre…
            throw new StockInsuffisantException("Plus de stock de vente");   // …refuser via l'exception métier
        BigDecimal montant = j.getPrixAchat();          // paiement simulé : on prend le prix d'achat comme montant
        Achat a = achats.save(new Achat(idClient, idJeu, LocalDate.now(), montant));   // enregistrer l'achat (date du jour + montant)
        j.setStockVente(j.getStockVente() - 1);       // retirer 1 du stock de vente
        jeux.save(j);                                 // sauvegarder le jeu mis à jour
        return a;                                     // renvoyer l'achat créé
    }                                                 // fin de la méthode
}                                                     // fin de la classe</pre>

<h3>3. Le paiement : une frontière</h3>
<p>Ici, le paiement est <strong>simulé</strong> : on enregistre juste le montant, sans vraiment débiter une carte. Dans une vraie application, on appellerait un <strong>prestataire externe</strong> (une société tierce comme Stripe ou PayPal) via un service dédié. On garde cette <em>frontière</em> propre — un point de branchement bien isolé — pour pouvoir connecter un vrai paiement plus tard sans toucher au reste du code.</p>

<h3>4. Réutiliser plutôt que dupliquer</h3>
<p>Louer et acheter vérifient tous deux « reste-t-il du stock ? ». Plutôt que de copier ce test à deux endroits (source d'incohérences), on le <strong>factorise</strong> : on l'écrit une seule fois dans une méthode partagée. C'est le principe <em>DRY</em> (« Don't Repeat Yourself », ne te répète pas).</p>
<pre class="pseudo">// la vérification de stock est la même pour louer et acheter   // logique commune, écrite une seule fois
private Jeu jeuAvecStock(Long idJeu, ToIntFunction&lt;Jeu&gt; stock, String msg) {   // reçoit une fonction qui lit LE bon stock
    Jeu j = jeux.findById(idJeu).orElseThrow();       // récupérer le jeu (ou exception)
    if (stock.applyAsInt(j) &lt;= 0) throw new StockInsuffisantException(msg);   // si le stock choisi est vide : refuser
    return j;                                         // sinon renvoyer le jeu prêt à servir
}                                                     // fin de la méthode</pre>
<p><code>ToIntFunction&lt;Jeu&gt;</code> est une <em>fonction passée en paramètre</em> : on lui donne la façon de lire le bon stock (vente ou location), et la même méthode sert aux deux cas. Quand deux opérations partagent une logique, on la factorise pour éviter la duplication et les bugs.</p>

<h3>5. Cohérence du domaine</h3>
<div class="tip">Acheter et louer sont deux chemins vers le même but : servir un client tout en gardant les stocks justes. Grâce aux transactions, jamais de vente enregistrée sans stock décrémenté. Le domaine « acheter OU louer » du cahier des charges est désormais complet.</div>`,

    solution: `<pre class="pseudo">@Transactional                                        // méthode atomique (tout ou rien)
public Achat acheter(Long idClient, Long idJeu) {     // acheter le jeu idJeu pour le client idClient
  Jeu j = jeux.findById(idJeu).orElseThrow();         // récupérer le jeu (ou exception si introuvable)

  jeux.save(j);                                      // sauvegarder le jeu mis à jour
  return a;                                          // renvoyer l'achat créé
}</pre>
<p>Le métier est complet (louer ET acheter). Demain : donner un visage à l'application avec Thymeleaf.</p>`
