<h3>1. Le contrôleur REST</h3>
<p>Le <strong>contrôleur</strong> est la porte d'entrée web de l'application : il reçoit les requêtes HTTP et renvoie les réponses. Un <strong>@RestController</strong> renvoie directement des <strong>données</strong> au format <strong>JSON</strong> (<em>JavaScript Object Notation</em>, un texte structuré universel pour échanger des données, comme une fiche remplie de « clé : valeur »), et non des pages HTML.</p>
<pre class="pseudo">@RestController                                       // cette classe est un contrôleur REST : elle répond en JSON
@RequestMapping("/api/jeux")                          // toutes ses adresses commencent par /api/jeux
public class JeuController {                           // déclaration de la classe du contrôleur
    private final CatalogueService service;            // le service métier dont dépend le contrôleur (injecté)
    public JeuController(CatalogueService s) { this.service = s; }   // constructeur : Spring injecte le service
}                                                     // fin de la classe</pre>
<p><code>@RequestMapping("/api/jeux")</code> fixe le <strong>préfixe d'URL</strong> commun à toutes les adresses de ce contrôleur (une <strong>URL</strong> est l'adresse d'une ressource, comme une adresse postale). Le service métier est injecté par le constructeur, comme vu hier.</p>

<h3>2. Les verbes REST</h3>
<p>Une requête HTTP porte un <strong>verbe</strong> (aussi appelé « méthode HTTP ») qui exprime l'<em>intention</em>. <strong>REST</strong> associe chaque verbe à une opération sur les ressources :</p>
<pre class="pseudo">GET    /api/jeux        lister
GET    /api/jeux/{id}   consulter un jeu
POST   /api/jeux        créer
PUT    /api/jeux/{id}   modifier
DELETE /api/jeux/{id}   supprimer</pre>
<p>C'est la convention REST, la même dans tous les frameworks : GET pour lire, POST pour créer, PUT pour modifier, DELETE pour supprimer — les quatre opérations du CRUD, transposées au web.</p>

<h3>3. Le DTO : ne pas exposer l'entité</h3>
<pre class="pseudo">public record JeuDTO(Long id, String titre, BigDecimal prixLocation, boolean disponible) {   // un record = petite classe immuable décrivant les 4 données exposées
    static JeuDTO from(Jeu j) {                        // fabrique un JeuDTO à partir d'une entité Jeu
        return new JeuDTO(j.getIdJeu(), j.getTitre(), j.getPrixLocation(),   // on recopie id, titre, prix de location…
                          j.getStockLocation() > 0);   // …et on calcule « disponible » : vrai si le stock de location > 0
    }                                                 // fin de la méthode from
}                                                     // fin du record</pre>
<p>Le <strong>DTO</strong> (objet de transfert) choisit exactement ce que l'API montre à l'extérieur. Ici on l'écrit sous forme de <strong>record</strong> : une classe courte et <em>immuable</em> (non modifiable) faite juste pour transporter des données. <code>from</code> est une <strong>méthode statique</strong> (attachée à la classe elle-même, pas à un objet précis) qui fabrique le DTO à partir d'une entité. On ne renvoie jamais l'entité brute : elle contient des détails internes (stocks, prix d'achat, relations) qu'on ne veut pas divulguer.</p>

<h3>4. Le contrôleur au complet</h3>
<pre class="pseudo">@GetMapping                                           // répond au GET /api/jeux (lister)
public List&lt;JeuDTO&gt; lister() {                         // renvoie la liste des jeux sous forme de DTO
    return service.tousLesJeux().stream().map(JeuDTO::from).toList();   // pour chaque jeu, le convertir en DTO, puis rassembler en liste
}                                                     // fin de la méthode

@GetMapping("/{id}")                                  // répond au GET /api/jeux/{id} (consulter) ; {id} est un paramètre d'URL
public JeuDTO un(@PathVariable Long id) {             // @PathVariable récupère l'id présent dans l'URL
    return JeuDTO.from(service.parId(id));            // demande le jeu au service, puis le convertit en DTO
}                                                     // fin de la méthode

@PostMapping                                          // répond au POST /api/jeux (créer)
@ResponseStatus(HttpStatus.CREATED)                   // en cas de succès, renvoyer le code HTTP 201 (Created)
public JeuDTO creer(@Valid @RequestBody CreationJeuDTO dto) {   // @RequestBody lit le JSON reçu ; @Valid en vérifie la validité
    return JeuDTO.from(service.creer(dto));           // crée le jeu via le service, renvoie le DTO du jeu créé
}                                                     // fin de la méthode</pre>
<p>Petit décodage : <code>.stream()</code> ouvre un « flux » pour traiter la liste élément par élément ; <code>.map(JeuDTO::from)</code> transforme chaque jeu en DTO (<code>JeuDTO::from</code> est une <em>référence de méthode</em>, un raccourci pour « applique la méthode from ») ; <code>.toList()</code> rassemble le tout en liste. <code>@PathVariable</code> extrait une valeur de l'URL (le <code>{id}</code>), tandis que <code>@RequestBody</code> lit le corps JSON envoyé par le client, et <code>@Valid</code> en vérifie la validité (leçon 8).</p>

<h3>5. Les bons codes HTTP</h3>
<p>Chaque réponse HTTP porte un <strong>code</strong> à trois chiffres qui résume le résultat, comme un feu tricolore de la communication web :</p>
<pre class="pseudo">200 OK          lecture réussie
201 Created     création réussie
400 Bad Request données invalides
404 Not Found   ressource inexistante
403 Forbidden   pas le droit</pre>
<div class="tip">Une API REST bien faite parle par ses codes HTTP et ses DTO stables : le client (page web, appli mobile…) sait à quoi s'attendre, quel que soit ce qui change à l'intérieur. On gérera les erreurs (400/404) de façon centralisée demain.</div>`,
