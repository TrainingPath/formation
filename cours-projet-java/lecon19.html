  title: "Qualité : logs, performance, secrets",
  subtitle: "Les réflexes qui rendent l'application prête pour de vrais utilisateurs.",
  theory: `
<h3>1. Journaliser (logs)</h3>
<p><strong>Journaliser</strong>, c'est écrire au fil de l'eau des messages qui racontent ce que fait le programme — les <strong>logs</strong> sont ce journal de bord, utile pour surveiller (audit) et comprendre les problèmes (débogage).</p>
<pre class="pseudo">private static final Logger log = LoggerFactory.getLogger(LocationService.class);   // créer un « journal » attaché à cette classe

log.info("Location enregistrée jeu={} client={}", idJeu, idClient);   // niveau INFO : événement normal ; {} remplacés par idJeu puis idClient
log.warn("Stock épuisé pour le jeu {}", idJeu);      // niveau WARN : situation anormale mais non bloquante
log.error("Échec du paiement", exception);            // niveau ERROR : erreur grave ; on joint l'exception (sa trace)</pre>
<p>On utilise <strong>SLF4J</strong> (une façade standard de journalisation) via un objet <code>Logger</code>, avec des <strong>niveaux</strong> selon la gravité : <code>info</code> (normal), <code>warn</code> (anormal mais non bloquant), <code>error</code> (grave). Les <code>{}</code> sont des emplacements remplacés par les valeurs fournies : c'est plus efficace qu'assembler le texte à la main (une « concaténation » coûteuse, faite même quand le log est désactivé).</p>
<div class="warn">Ne jamais logguer de données sensibles : mot de passe, jeton, numéro de carte. Un log peut être lu par d'autres et conservé longtemps.</div>

<h3>2. Le problème N+1</h3>
<p>Afficher 20 jeux puis lire <code>jeu.getCategorie()</code> pour chacun déclenche <strong>1 requête</strong> (les jeux) <strong>+ 20 requêtes</strong> (une par catégorie). C'est le fameux problème <strong>« N+1 »</strong> : au lieu d'une seule requête, on en fait N+1. Sur de grandes listes, c'est catastrophique pour la vitesse.</p>
<pre class="pseudo">// solution : charger la relation en une seule requête   // pré-charger la catégorie avec les jeux
@EntityGraph(attributePaths = "categorie")            // demander à charger aussi la relation « categorie » d'un coup
List&lt;Jeu&gt; findByStockLocationGreaterThan(int n);      // la requête ramène les jeux ET leurs catégories (plus de N+1)
// ou une requête avec JOIN FETCH                     // alternative : écrire un JOIN FETCH en JPQL</pre>

<h3>3. Ne demander que le nécessaire</h3>
<pre class="pseudo">jeux.count();                       // compter les jeux côté base, sans charger toutes les lignes
jeux.findByStockLocationGreaterThan(0); // filtrer côté base (clause WHERE), pas en Java après coup
// pagination (leçon 15) : ne charger qu'une page      // et paginer pour ne ramener qu'un lot à la fois</pre>
<p>On laisse la <strong>base</strong> faire le travail (filtrer, compter, trier, paginer) plutôt que de tout ramener en mémoire pour ensuite trier en Java. La base est conçue pour ça et ne renvoie que le strict nécessaire.</p>

<h3>4. Sortir les secrets du code</h3>
<pre class="pseudo"># application.properties — AUCUN secret en dur         # règle d'or : jamais de mot de passe/clé écrit dans le code
spring.datasource.password=\${DB_PASSWORD}            # mot de passe lu dans une variable d'environnement
app.jwt.secret=\${JWT_SECRET}                          # clé secrète lue elle aussi dans une variable d'environnement</pre>
<p>Les mots de passe et clés viennent de <strong>variables d'environnement</strong> (des valeurs rangées dans le système, hors du code), jamais du code ni du dépôt Git. Un secret <em>commité</em> (enregistré dans l'historique Git) est un secret compromis : il faut le considérer comme divulgué et le changer.</p>

<h3>5. Les index, côté base</h3>
<div class="tip">Les colonnes souvent filtrées (titre, idCategorie) gagnent à être <strong>indexées</strong> : un <em>index</em> est comme l'index d'un livre, il permet de retrouver une ligne sans tout parcourir (vu en cours MySQL). Logs, N+1, index, secrets hors du code : ces réflexes distinguent un exercice d'une application déployable. On les met en place avant la mise en ligne (demain).</div>`,
  exercises: [

    { type: "qcm", q: "Les secrets viennent…", opts: ["Du code en dur", "De variables d'environnement", "Du dépôt Git", "Du HTML"], a: 1, exp: "Hors du code." },

    { type: "qcm", q: "Indexer aide sur…", opts: ["Les colonnes jamais utilisées", "Les colonnes souvent filtrées (titre, idCategorie)", "Le CSS", "Les logs"], a: 1, exp: "Recherche rapide." },
    { type: "vf", q: "Les paramètres {} des logs évitent une concaténation coûteuse.", a: true, exp: "Performance de log." },

    { type: "qcm", q: "Ces réflexes servent surtout…", opts: ["À ralentir", "À rendre l'app prête pour la production", "À supprimer des tests", "À rien"], a: 1, exp: "Qualité." }
  ],

      { type: "qcm", q: "Compter efficacement :", opts: ["count()", "findAll().size()", "tout charger", "un log"], a: 0, exp: "Délégué à la base." },
      { type: "qcm", q: "Le mot de passe de base :", opts: ["en dur", "${DB_PASSWORD}", "dans le HTML", "dans un log"], a: 1, exp: "Variable d'env." },
      { type: "vf", q: "Un secret ne doit jamais être commité dans le dépôt.", a: true, exp: "Compromission." }
    ],
    solution: `<pre class="pseudo">private static final Logger log = LoggerFactory.getLogger(LocationService.class);   // journal attaché à la classe
log.info("Location jeu={} client={}", idJeu, idClient);   // tracer un événement normal (INFO)

@EntityGraph(attributePaths = "categorie")   // évite le N+1   // pré-charge la catégorie en une seule requête

# application.properties (aucun secret en dur)         # secrets hors du code
spring.datasource.password=\${DB_PASSWORD}            # mot de passe lu dans une variable d'environnement</pre>
<p>L'application est robuste et rapide. Demain : la mettre en ligne.</p>`
