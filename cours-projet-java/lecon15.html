  title: "Recherche, filtres et pagination côté UI",
  subtitle: "Rendre un grand catalogue navigable et rapide.",
  theory: `
<h3>1. Le besoin</h3>
<p>Un catalogue de centaines de jeux ne s'affiche pas d'un seul bloc : ce serait lent et illisible. On ajoute une <strong>recherche</strong> par titre et une <strong>pagination</strong> — découper la liste en pages numérotées et ne charger que celle qu'on montre, comme un livre qu'on lit page par page plutôt que d'étaler toutes les feuilles.</p>

<h3>2. Pagination côté repository</h3>
<pre class="pseudo">Page&lt;Jeu&gt; findByTitreContainingIgnoreCase(String q, Pageable p);   // recherche par titre (insensible à la casse), paginée : renvoie une Page</pre>
<p>En passant un <code>Pageable</code> (un objet qui décrit « quelle page, de quelle taille, trié comment »), Spring Data ajoute automatiquement <code>LIMIT/OFFSET</code> (les instructions SQL qui limitent le nombre de lignes et sautent les précédentes, vues en cours de MySQL) et renvoie une <code>Page</code> : un paquet de résultats qui connaît en plus le total et le nombre de pages.</p>

<h3>3. Le contrôleur</h3>
<pre class="pseudo">@GetMapping("/catalogue")                             // répond au GET /catalogue
public String catalogue(@RequestParam(defaultValue = "") String q,   // q = texte recherché (vide par défaut), lu dans l'URL
                        @RequestParam(defaultValue = "0") int page,  // page = numéro de page demandé (0 par défaut)
                        Model model) {                 // le Model transporte les données vers la vue
    Page&lt;Jeu&gt; resultat = jeux.findByTitreContainingIgnoreCase(q, PageRequest.of(page, 10));   // chercher, 10 jeux par page
    model.addAttribute("page", resultat);              // déposer la page de résultats sous le nom « page »
    model.addAttribute("q", q);                        // déposer aussi le texte cherché (pour le ré-afficher)
    return "catalogue";                                // renvoyer le nom de la vue
}                                                     // fin de la méthode</pre>
<p>Les paramètres <code>q</code> (recherche) et <code>page</code> viennent de l'URL (par exemple <code>?q=catan&amp;page=1</code>) grâce à <code>@RequestParam</code> ; <code>defaultValue</code> fournit une valeur de repli si le paramètre est absent. <code>PageRequest.of(page, 10)</code> demande la page voulue à raison de 10 éléments par page.</p>

<h3>4. Le template : liste + navigation</h3>
<pre class="pseudo">&lt;form method="get" th:action="@{/catalogue}"&gt;         &lt;!-- formulaire de recherche envoyé en GET vers /catalogue --&gt;
  &lt;input name="q" th:value="\${q}" placeholder="Rechercher…"&gt;   &lt;!-- champ texte, pré-rempli avec la recherche courante --&gt;
&lt;/form&gt;                                                &lt;!-- fin du formulaire --&gt;

&lt;tr th:each="jeu : \${page.content}"&gt; ... &lt;/tr&gt;       &lt;!-- une ligne par jeu de la page courante (page.content) --&gt;

&lt;a th:if="\${page.hasPrevious()}" th:href="@{/catalogue(q=\${q}, page=\${page.number-1})}"&gt;Précédent&lt;/a&gt;   &lt;!-- lien « Précédent » : affiché seulement s'il existe une page avant --&gt;
&lt;span th:text="\${page.number+1} + ' / ' + \${page.totalPages}"&gt;&lt;/span&gt;   &lt;!-- indicateur « page courante / nombre total de pages » --&gt;
&lt;a th:if="\${page.hasNext()}" th:href="@{/catalogue(q=\${q}, page=\${page.number+1})}"&gt;Suivant&lt;/a&gt;   &lt;!-- lien « Suivant » : affiché seulement s'il existe une page après --&gt;</pre>

<h3>5. Trier et filtrer proprement</h3>
<pre class="pseudo">PageRequest.of(page, 10, Sort.by("prixLocation").ascending());   // page demandée, 10 par page, triée par prix de location croissant</pre>
<div class="tip">La <code>Page</code> expose <code>content</code> (les éléments), <code>number</code> (le numéro de page), <code>totalPages</code> (le total), <code>hasNext()</code>… tout le nécessaire pour une navigation. On ne charge que 10 jeux par requête : l'<strong>UI</strong> (l'interface utilisateur, ce que voit et manipule la personne) reste rapide même avec un immense catalogue, exactement comme le <code>LIMIT/OFFSET</code> du cours MySQL.</div>`,
  exercises: [
    { type: "qcm", q: "Paginer sert à…", opts: ["Mettre en cache toute la liste", "Ne charger que ce qu'on montre (rapidité)", "Charger tout le catalogue d'un coup", "Trier la base"], a: 1, exp: "Découper la liste." },
    { type: "qcm", q: "Pour paginer avec Spring Data, on passe un…", opts: ["DTO", "Pageable", "String", "boolean"], a: 1, exp: "Pageable." },
    { type: "qcm", q: "Le repository renvoie alors un…", opts: ["List", "Page<Jeu>", "int", "void"], a: 1, exp: "Page." },
    { type: "qcm", q: "Sous le capot, Spring génère…", opts: ["Un tri seul", "LIMIT/OFFSET", "Un GROUP BY", "Un index"], a: 1, exp: "Pagination SQL." },
    { type: "qcm", q: "Créer une demande de page :", opts: ["PageRequest.of(page, 10)", "new Page()", "Pageable.all()", "new PageImpl<>()"], a: 0, exp: "PageRequest." },
    { type: "qcm", q: "Le paramètre de recherche vient…", opts: ["Du corps JSON", "De l'URL (@RequestParam)", "D'un cookie", "De la base"], a: 1, exp: "?q=..." },
    { type: "qcm", q: "@RequestParam(defaultValue=\"0\") int page permet…", opts: ["De forcer la page 0", "Une valeur par défaut si absent", "De trier", "De supprimer"], a: 1, exp: "Défaut." },
    { type: "qcm", q: "page.getContent() donne…", opts: ["Le total", "Les éléments de la page courante", "Le numéro", "La taille de page"], a: 1, exp: "Contenu." },
    { type: "qcm", q: "Savoir s'il y a une page suivante :", opts: ["page.hasNext()", "page.size()", "page.first()", "page.empty()"], a: 0, exp: "hasNext()." },
    { type: "qcm", q: "Le nombre total de pages :", opts: ["page.number", "page.totalPages", "page.content", "page.size"], a: 1, exp: "totalPages." },
    { type: "vf", q: "On ne charge que 10 jeux par requête, pas tout le catalogue.", a: true, exp: "Efficacité." },
    { type: "qcm", q: "Trier la page par prix :", opts: ["PageRequest.of(page, 10, Sort.by(\"prixLocation\"))", "ORDER BY manuel", "Collections.sort() en Java", "un Comparator custom"], a: 0, exp: "Sort intégré." },
    { type: "vf", q: "La pagination Spring correspond au LIMIT/OFFSET du cours MySQL.", a: true, exp: "Même mécanisme." },
    { type: "qcm", q: "La recherche par titre réutilise…", opts: ["Un trigger", "Une requête dérivée (Containing/IgnoreCase)", "Un DTO", "Un index unique"], a: 1, exp: "findByTitreContaining." },
    { type: "qcm", q: "page.getNumber() renvoie…", opts: ["Le total", "L'index de la page courante (0-based)", "Le contenu", "La taille"], a: 1, exp: "Numéro de page." }
  ],
  final: {
    title: "Exercice final — Catalogue paginé",
    intro: `<p>On rend le catalogue cherchable et paginé.</p>`,
    questions: [
      { type: "qcm", q: "La signature du repository :", opts: ["Page<Jeu> findByTitreContainingIgnoreCase(String q, Pageable p)", "List<Jeu> findAll()", "int count()", "Jeu findByTitre(String q)"], a: 0, exp: "Page + Pageable." },
      { type: "qcm", q: "Récupérer q et page :", opts: ["@PathVariable", "@RequestParam avec defaultValue", "@RequestBody", "un cookie"], a: 1, exp: "Paramètres d'URL." },
      { type: "qcm", q: "Construire la page demandée :", opts: ["PageRequest.of(page, 10)", "new PageImpl<>(list)", "Pageable.unpaged()", "PageRequest.of(10)"], a: 0, exp: "PageRequest." },
      { type: "qcm", q: "Afficher « Suivant » si besoin :", opts: ["th:if=\"${page.hasNext()}\"", "th:if=\"${page.last}\"", "th:unless=\"${page.first}\"", "th:text"], a: 0, exp: "hasNext()." },
      { type: "vf", q: "La Page connaît son numéro, son total et ses voisins.", a: true, exp: "Navigation complète." }
    ],
    solution: `<pre class="pseudo">@GetMapping("/catalogue")                             // répond au GET /catalogue
public String catalogue(@RequestParam(defaultValue = "") String q,   // texte recherché (vide par défaut)
                        @RequestParam(defaultValue = "0") int page,  // numéro de page (0 par défaut)
                        Model model) {                 // le Model porte les données vers la vue
  Page&lt;Jeu&gt; resultat = jeux.findByTitreContainingIgnoreCase(   // rechercher par titre…
      q, PageRequest.of(page, 10, Sort.by("titre")));  // …page demandée, 10 par page, triée par titre
  model.addAttribute("page", resultat);                // déposer la page de résultats
  model.addAttribute("q", q);                          // déposer le texte cherché
  return "catalogue";                                  // renvoyer le nom de la vue
}</pre>
<p>Le catalogue est navigable. Demain : les trois espaces par rôle.</p>`
  }
};
