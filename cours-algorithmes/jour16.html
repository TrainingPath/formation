<script>
var DAY = {
  num: 16,
  title: "La recherche séquentielle",
  subtitle: "Trouver une valeur dans un tableau : premier vrai algorithme classique.",
  theory: `
<h3>1. Le problème de la recherche</h3>
<p>« Est-ce que 15 est dans le tableau ? À quelle position ? » C'est LE problème le plus fréquent de l'informatique (moteur de recherche, annuaire, inventaire…). La méthode la plus simple : regarder les cases <strong>une par une</strong> — la <strong>recherche séquentielle</strong> (ou linéaire).</p>
<h3>2. Version 1 : présent ou absent ?</h3>
<pre class="pseudo">trouve ← FAUX
POUR i DE 1 A n FAIRE
    SI t[i] = cherche ALORS
        trouve ← VRAI
    FINSI
FINPOUR
// après la boucle : trouve dit si la valeur existe</pre>
<div class="tip">Le <strong>drapeau</strong> (flag) <code>trouve</code> part à FAUX et passe à VRAI dès qu'on voit la valeur. Il ne repasse JAMAIS à FAUX : une fois trouvé, c'est trouvé.</div>
<h3>3. Version 2 : à quelle position ?</h3>
<pre class="pseudo">position ← 0                  // 0 = "pas trouvé" (indice impossible)
POUR i DE 1 A n FAIRE
    SI t[i] = cherche ET position = 0 ALORS
        position ← i          // on mémorise le PREMIER emplacement
    FINSI
FINPOUR</pre>
<h3>4. Version 3 : s'arrêter dès qu'on trouve (plus efficace)</h3>
<p>Pourquoi continuer à chercher après avoir trouvé ? Le TANT QUE permet de sortir tôt :</p>
<pre class="pseudo">i ← 1
TANT QUE i <= n ET t[i] ≠ cherche FAIRE
    i ← i + 1
FINTANTQUE
SI i <= n ALORS
    Écrire("Trouvé en position ", i)
SINON
    Écrire("Absent")
FINSI</pre>
<div class="warn">L'ordre des conditions compte : <code>i <= n</code> AVANT <code>t[i] ≠ cherche</code>. Si i dépasse n, on ne doit pas évaluer t[i] (débordement) !</div>
<h3>5. Combien de comparaisons ?</h3>
<ul>
<li><strong>Meilleur cas</strong> : la valeur est en case 1 → 1 comparaison.</li>
<li><strong>Pire cas</strong> : elle est à la fin, ou absente → n comparaisons.</li>
<li><strong>En moyenne</strong> : environ n/2.</li>
</ul>
<p>Pour un annuaire d'un million de noms, ça fait beaucoup… On verra bien mieux au jour 23 (dichotomie). Mais la recherche séquentielle a un avantage unique : elle marche même si le tableau n'est <strong>pas trié</strong>.</p>`,
  exercises: [

    { type: "qcm", q: "À quoi sert le drapeau <code>trouve</code> ?", opts: ["À compter les occurrences", "À mémoriser qu'on a vu la valeur au moins une fois", "À trier", "À vider le tableau"], a: 1, exp: "Initialisé à FAUX, il passe à VRAI à la première rencontre et le reste." },

    { type: "qcm", q: "Après la v3, comment sait-on que la valeur était ABSENTE ?", opts: ["trouve = VRAI", "i > n : on a dépassé la fin sans s'arrêter sur la valeur", "t[i] = cherche", "position = 1"], a: 1, exp: "Sortie par épuisement du tableau = absence." },
    { type: "qcm", q: "La recherche séquentielle exige-t-elle un tableau trié ?", opts: ["Oui, toujours", "Non : c'est justement sa force", "Seulement pour les nombres", "Seulement si n > 100"], a: 1, exp: "Elle regarde tout, ordre ou pas. La dichotomie (jour 23), elle, exigera le tri." },
    { type: "input", q: "Pour COMPTER les occurrences de 5 dans t = [ 5 ][ 2 ][ 5 ][ 9 ][ 5 ], quel motif du jour 12 utilise-t-on, et combien trouve-t-on ? (réponds par le nombre)", a: "3", ph: "nombre", exp: "Un compteur : c ← c + 1 à chaque t[i] = 5 → 3 occurrences." }
  ],

    title: "Exercice final — Le fichier des adhérents",
    intro: `<p>Le club stocke les numéros d'adhérents : <code>num = [ 205 ][ 118 ][ 342 ][ 217 ][ 118 ][ 460 ]</code>. À l'accueil, on tape un numéro et l'algorithme dit s'il est valide et où il se trouve.</p>
<pre class="pseudo">ALGORITHME Accueil
DEBUT
    Lire(cherche)
    i ← 1
    TANT QUE i <= 6 ET num[i] ≠ cherche FAIRE
        i ← i + 1
    FINTANTQUE
    SI i <= 6 ALORS
        Écrire("Adhérent trouvé en position ", i)
    SINON
        Écrire("Numéro inconnu")
    FINSI
FIN</pre>`,

      { type: "input", q: "cherche = 342 : combien de comparaisons <code>num[i] ≠ cherche</code> ont été faites ?", a: "3", ph: "nombre", exp: "Cases 1, 2, 3 : trois comparaisons puis arrêt." },
      { type: "input", q: "cherche = 118 : quelle position est affichée ?", a: "2", ph: "nombre", exp: "118 apparaît deux fois (cases 2 et 5), mais l'arrêt anticipé donne la PREMIÈRE : 2." },
      { type: "qcm", q: "cherche = 999 : qu'affiche l'algorithme et que vaut i ?", opts: ["Trouvé en position 6, i = 6", "Numéro inconnu, i = 7", "Numéro inconnu, i = 6", "Erreur"], a: 1, exp: "On épuise les 6 cases, i finit à 7 > 6 : branche SINON." },
      { type: "qcm", q: "Le club passe à 10 000 adhérents. En moyenne, une recherche séquentielle fera environ…", opts: ["10 comparaisons", "100 comparaisons", "5 000 comparaisons", "1 comparaison"], a: 2, exp: "≈ n/2. C'est le prix de la simplicité — motivation parfaite pour la dichotomie du jour 23." }
    ],
    solution: `<p>Traces des trois recherches :</p>
<pre class="pseudo">cherche=342 : 205? non · 118? non · 342? OUI → position 3
cherche=118 : 205? non · 118? OUI → position 2 (la 1ʳᵉ occurrence)
cherche=999 : 6 échecs → i = 7 → "Numéro inconnu"</pre>
<p>Retiens le squelette : TANT QUE (dans les bornes ET pas trouvé) → avancer. Puis le verdict se lit sur i. Ce squelette resservira mot pour mot toute ta vie de programmeur.</p>`
  }
};
</script>

  { num: "16.3", titre: "Le fichier des adhérents — 1 / 4", niveau: 3, domaine: "club sportif",
    serie: { nom: "Le fichier des adhérents", jour: 1, sur: 4 },
    enonce: "Nouvelle mini-série de quatre jours : le fichier des adhérents d'un club sportif. Aujourd'hui, la recherche. Le secrétariat conserve les numéros d'adhérent de quinze membres dans un tableau, tenu dans l'ordre des inscriptions et donc pas trié. À l'entrée de la salle, un bénévole saisit le numéro présenté et l'algorithme doit répondre immédiatement : le membre est-il à jour, à quelle position figure-t-il au fichier, et — question qui fâche le secrétariat — le numéro apparaît-il plusieurs fois, signe d'une double inscription à corriger.",

      { ref: "c", texte: "Le bénévole contrôle une file de personnes. Enveloppe le tout dans une boucle qui traite les contrôles l'un après l'autre et s'arrête sur le numéro 0, en comptant les contrôles servis et les refus." }
    ],
    reflexion: "Les points a) et b) posent deux questions sur les mêmes données, et l'une autorise un raccourci que l'autre interdit. Formule la règle générale : qu'est-ce qui, dans l'énoncé d'une question, indique qu'un parcours peut s'arrêter tôt ? Puis : ton algorithme fait maintenant deux parcours du fichier par contrôle. Sur une file de trente personnes et un fichier de quinze adhérents, combien de cases sont examinées en tout dans le pire des cas ? Ce coût te paraît-il acceptable, et qu'est-ce qui le rendrait insupportable ?",
    principe: "Une question qui porte sur l'<em>existence</em> autorise l'arrêt à la première réponse : une seule occurrence suffit à conclure. Une question qui porte sur le <em>nombre</em> ou sur <em>l'ensemble</em> des occurrences l'interdit, puisqu'une occurrence non vue est une réponse fausse. Le raccourci n'est jamais une propriété de l'algorithme : c'est une propriété de la question.",
    indices: [
      "Trois niveaux emboîtés : la file des personnes contrôlées, le fichier parcouru pour chacune, et deux questions différentes posées à ce fichier. Écris d'abord le contrôle d'une seule personne, vérifie-le, et seulement ensuite enveloppe-le dans la file.",
      "Le plan : pour un numéro donné, un premier parcours interruptible qui donne la position ou l'absence, puis un second parcours complet qui compte les occurrences et signale chacune. La file, elle, est une boucle qui lit un numéro, effectue ce double travail, met à jour ses deux compteurs, et recommence jusqu'au numéro d'arrêt.",
      "En pseudocode : <code>RÉPÉTER</code> · lire le numéro présenté · si ce n'est pas le signal d'arrêt, chercher en s'interrompant, puis reparcourir en comptant · mettre à jour le compteur de contrôles ou celui de refus · <code>JUSQU'À</code> le signal d'arrêt · puis afficher le bilan de la file.",
      "Le point délicat est le signal d'arrêt. Lu au début du tour, il doit empêcher tout le traitement qui suit — sinon l'algorithme cherche le numéro 0 dans le fichier, ne le trouve pas, et compte un refus qui n'a jamais eu lieu. Le bilan annonce alors une personne de trop, et l'erreur passe d'autant mieux qu'elle est constante : toujours un de plus.",
      "Ta copie ressemble à ceci : <br><code>RÉPÉTER</code><br><code>&nbsp;&nbsp;Lire(numero)</code><br><code>&nbsp;&nbsp;SI numero <> 0 ALORS</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;</code>… la recherche interruptible, puis le comptage complet …<br><code>&nbsp;&nbsp;FINSI</code><br><code>JUSQU'À numero = 0</code>"

    solution: "Algorithme FichierDesAdherents\nConst\n    N = 15\nVar\n    fichier : TABLEAU[1..15] D'ENTIERS\n    i, numero, position, occurrences : ENTIER\n    controles, refus : ENTIER\nDebut\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Numero d'adherent \", i, \" ?\")\n        Lire(fichier[i])\n    FINPOUR\n\n    controles <- 0\n    refus <- 0\n\n    /* c) la file : le menu doit tourner au moins une fois */\n    REPETER\n        Ecrire(\"Numero presente (0 pour terminer) ?\")\n        Lire(numero)\n\n        /* le signal d'arret ne doit declencher AUCUN traitement : sans ce\n           test, on chercherait 0 dans le fichier et on compterait un refus\n           qui n'a jamais eu lieu — une personne de trop, a chaque fois. */\n        SI numero <> 0 ALORS\n            /* a) recherche INTERRUPTIBLE : l'existence suffit a conclure */\n            i <- 1\n            TANT QUE i <= N ET fichier[i] <> numero FAIRE\n                i <- i + 1\n            FINTANTQUE\n\n            SI i <= N ALORS\n                position <- i\n            SINON\n                position <- 0\n            FINSI\n\n            SI position = 0 ALORS\n                Ecrire(\"Numero \", numero, \" inconnu — acces refuse\")\n                refus <- refus + 1\n            SINON\n                Ecrire(\"Adherent trouve en position \", position)\n                controles <- controles + 1\n\n                /* b) le COMPTE interdit le raccourci : une occurrence non vue\n                      serait une reponse fausse. Parcours COMPLET obligatoire. */\n                occurrences <- 0\n                POUR i DE 1 A N FAIRE\n                    SI fichier[i] = numero ALORS\n                        occurrences <- occurrences + 1\n                        Ecrire(\"  occurrence en position \", i)\n                    FINSI\n                FINPOUR\n                SI occurrences > 1 ALORS\n                    Ecrire(\"  DOUBLE INSCRIPTION : \", occurrences, \" fiches\")\n                FINSI\n            FINSI\n        FINSI\n    JUSQU'A numero = 0\n\n    Ecrire(\"File terminee : \", controles, \" acces, \", refus, \" refus\")\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>La règle générale</strong> tient en une phrase : un parcours peut s'arrêter tôt lorsque la réponse cherchée est <em>décidée</em> par le premier élément qui la satisfait. « Ce numéro existe-t-il ? » est décidée dès la première occurrence — les suivantes ne peuvent plus rien changer à la réponse. « Combien de fois ? », « à quelles positions ? », « quel est le plus grand ? » ne le sont jamais : chaque élément non vu peut encore modifier le résultat. Le test pratique est de se demander <em>si l'on peut imaginer une donnée située plus loin qui changerait la réponse</em>. Si oui, il faut tout voir ; si non, on peut sortir. Cette règle vaut bien au-delà de la recherche — elle explique aussi pourquoi le maximum exige un parcours complet alors que « y a-t-il une valeur négative ? » n'en exige pas. <strong>Le décompte.</strong> Dans le pire des cas, chaque contrôle coûte 15 cases pour la recherche interruptible — numéro absent, ou en dernière position — plus 15 pour le comptage, soit 30 par personne. Sur une file de trente personnes, cela fait <strong>900 cases examinées</strong>. C'est parfaitement acceptable ici : neuf cents comparaisons sont instantanées pour une machine, et surtout le vrai facteur limitant est le temps qu'une personne met à présenter sa carte, pas le calcul. Ce qui rendrait ce coût insupportable, c'est le produit des deux tailles : le travail croît comme <em>file × fichier</em>. Un club de dix mille adhérents contrôlant deux mille entrées un soir de match, ce sont quarante millions de cases examinées — et là, le bénévole attend. Le remède n'est pas d'écrire la boucle plus habilement : c'est de changer de méthode, en triant le fichier une fois pour toutes afin que chaque recherche coûte quatorze comparaisons au lieu de quinze mille. C'est exactement le sujet du jour 23, et l'arbitrage y sera le même que dans la réflexion de l'exercice précédent : trier coûte cher, mais il s'amortit dès qu'on interroge souvent." }
    ],

    ],
