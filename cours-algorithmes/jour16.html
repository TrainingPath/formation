<script>
var DAY = {
  num: 16,
  title: "La recherche séquentielle",
  subtitle: "Trouver une valeur dans un tableau : premier vrai algorithme classique.",
  theory: `
<h3>1. Le problème de la recherche</h3>
<p>« Est-ce que 15 est dans le tableau ? À quelle position ? » C'est LE problème le plus fréquent de l'informatique (moteur de recherche, annuaire, inventaire…). La méthode la plus simple : regarder les cases <strong>une par une</strong> — la <strong>recherche séquentielle</strong> (ou linéaire).</p>
<h3>2. Version 1 : présent ou absent ?</h3>
<pre class="pseudo">trouve ← FAUX
POUR i DE 1 A n FAIRE
    SI t[i] = cherche ALORS
        trouve ← VRAI
    FINSI
FINPOUR
// après la boucle : trouve dit si la valeur existe</pre>
<div class="tip">Le <strong>drapeau</strong> (flag) <code>trouve</code> part à FAUX et passe à VRAI dès qu'on voit la valeur. Il ne repasse JAMAIS à FAUX : une fois trouvé, c'est trouvé.</div>
<h3>3. Version 2 : à quelle position ?</h3>
<pre class="pseudo">position ← 0                  // 0 = "pas trouvé" (indice impossible)
POUR i DE 1 A n FAIRE
    SI t[i] = cherche ET position = 0 ALORS
        position ← i          // on mémorise le PREMIER emplacement
    FINSI
FINPOUR</pre>
<h3>4. Version 3 : s'arrêter dès qu'on trouve (plus efficace)</h3>
<p>Pourquoi continuer à chercher après avoir trouvé ? Le TANT QUE permet de sortir tôt :</p>
<pre class="pseudo">i ← 1
TANT QUE i <= n ET t[i] ≠ cherche FAIRE
    i ← i + 1
FINTANTQUE
SI i <= n ALORS
    Écrire("Trouvé en position ", i)
SINON
    Écrire("Absent")
FINSI</pre>
<div class="warn">L'ordre des conditions compte : <code>i <= n</code> AVANT <code>t[i] ≠ cherche</code>. Si i dépasse n, on ne doit pas évaluer t[i] (débordement) !</div>
<h3>5. Combien de comparaisons ?</h3>
<ul>
<li><strong>Meilleur cas</strong> : la valeur est en case 1 → 1 comparaison.</li>
<li><strong>Pire cas</strong> : elle est à la fin, ou absente → n comparaisons.</li>
<li><strong>En moyenne</strong> : environ n/2.</li>
</ul>
<p>Pour un annuaire d'un million de noms, ça fait beaucoup… On verra bien mieux au jour 23 (dichotomie). Mais la recherche séquentielle a un avantage unique : elle marche même si le tableau n'est <strong>pas trié</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "La recherche séquentielle consiste à…", opts: ["Couper le tableau en deux", "Examiner les cases une par une, dans l'ordre", "Trier le tableau", "Regarder seulement la première case"], a: 1, exp: "D'où son autre nom : recherche linéaire." },
    { type: "qcm", q: "À quoi sert le drapeau <code>trouve</code> ?", opts: ["À compter les occurrences", "À mémoriser qu'on a vu la valeur au moins une fois", "À trier", "À vider le tableau"], a: 1, exp: "Initialisé à FAUX, il passe à VRAI à la première rencontre et le reste." },
    { type: "qcm", q: "t = [ 8 ][ 3 ][ 15 ][ 6 ], cherche = 15. Que vaut <code>trouve</code> après la boucle ?", opts: ["VRAI", "FAUX"], a: 0, exp: "t[3] = 15 : le drapeau se lève au 3ᵉ tour." },
    { type: "qcm", q: "t = [ 8 ][ 3 ][ 15 ][ 6 ], cherche = 7. Et maintenant ?", opts: ["VRAI", "FAUX"], a: 1, exp: "Aucune case ne vaut 7 : le drapeau reste à FAUX." },
    { type: "input", q: "t = [ 8 ][ 3 ][ 15 ][ 6 ], cherche = 15 : que vaut <code>position</code> (version 2) ?", a: "3", ph: "nombre", exp: "Premier (et seul) 15 en case 3." },
    { type: "qcm", q: "Pourquoi initialiser <code>position ← 0</code> ?", opts: ["Parce que 0 est la première case", "0 est un indice impossible : il signifie « pas encore trouvé »", "Pour compter à partir de 0", "Par habitude"], a: 1, exp: "Nos indices vont de 1 à n : 0 est un code de « valeur absente » sans ambiguïté." },
    { type: "qcm", q: "t = [ 5 ][ 2 ][ 5 ][ 9 ], cherche = 5. Version 2 (avec ET position = 0) : position = ?", opts: ["1", "3", "2", "0"], a: 0, exp: "Le test position = 0 fige la PREMIÈRE occurrence : case 1." },
    { type: "qcm", q: "Sans le test <code>ET position = 0</code>, que vaudrait position pour t = [ 5 ][ 2 ][ 5 ][ 9 ] ?", opts: ["1", "3 : chaque nouvelle occurrence écrase la précédente → on garde la DERNIÈRE", "0", "2"], a: 1, exp: "Subtil : la version modifie le sens du résultat (première vs dernière occurrence)." },
    { type: "input", q: "Recherche du pire cas : tableau de 200 cases, valeur ABSENTE. Combien de comparaisons fait la version 1 ?", a: "200", ph: "nombre", exp: "On examine tout : n comparaisons." },
    { type: "input", q: "Meilleur cas : la valeur est en case 1. Combien de comparaisons pour la version 3 (arrêt anticipé) ?", a: "1", ph: "nombre", exp: "On trouve immédiatement et on sort : 1 seule comparaison." },
    { type: "qcm", q: "Quel avantage la version TANT QUE (v3) a-t-elle sur la version POUR (v1) ?", opts: ["Elle est plus jolie", "Elle s'arrête dès que la valeur est trouvée : moins de travail en moyenne", "Elle trouve plus de valeurs", "Aucun"], a: 1, exp: "Pourquoi visiter 999 cases si la réponse est dans la première ?" },
    { type: "qcm", q: "Dans <code>TANT QUE i <= n ET t[i] ≠ cherche</code>, pourquoi i <= n doit-il être testé en premier ?", opts: ["Question de style", "Si i > n, il ne faut PAS évaluer t[i] : ce serait un débordement", "Parce que n est petit", "Aucune raison"], a: 1, exp: "L'évaluation s'arrête au premier FAUX : i <= n protège l'accès t[i]." },
    { type: "qcm", q: "Après la v3, comment sait-on que la valeur était ABSENTE ?", opts: ["trouve = VRAI", "i > n : on a dépassé la fin sans s'arrêter sur la valeur", "t[i] = cherche", "position = 1"], a: 1, exp: "Sortie par épuisement du tableau = absence." },
    { type: "qcm", q: "La recherche séquentielle exige-t-elle un tableau trié ?", opts: ["Oui, toujours", "Non : c'est justement sa force", "Seulement pour les nombres", "Seulement si n > 100"], a: 1, exp: "Elle regarde tout, ordre ou pas. La dichotomie (jour 23), elle, exigera le tri." },
    { type: "input", q: "Pour COMPTER les occurrences de 5 dans t = [ 5 ][ 2 ][ 5 ][ 9 ][ 5 ], quel motif du jour 12 utilise-t-on, et combien trouve-t-on ? (réponds par le nombre)", a: "3", ph: "nombre", exp: "Un compteur : c ← c + 1 à chaque t[i] = 5 → 3 occurrences." }
  ],
  final: {
    title: "Exercice final — Le fichier des adhérents",
    intro: `<p>Le club stocke les numéros d'adhérents : <code>num = [ 205 ][ 118 ][ 342 ][ 217 ][ 118 ][ 460 ]</code>. À l'accueil, on tape un numéro et l'algorithme dit s'il est valide et où il se trouve.</p>
<pre class="pseudo">ALGORITHME Accueil
DEBUT
    Lire(cherche)
    i ← 1
    TANT QUE i <= 6 ET num[i] ≠ cherche FAIRE
        i ← i + 1
    FINTANTQUE
    SI i <= 6 ALORS
        Écrire("Adhérent trouvé en position ", i)
    SINON
        Écrire("Numéro inconnu")
    FINSI
FIN</pre>`,
    questions: [
      { type: "input", q: "cherche = 342 : quelle position affiche l'algorithme ?", a: "3", ph: "nombre", exp: "num[3] = 342 : arrêt au 3ᵉ tour." },
      { type: "input", q: "cherche = 342 : combien de comparaisons <code>num[i] ≠ cherche</code> ont été faites ?", a: "3", ph: "nombre", exp: "Cases 1, 2, 3 : trois comparaisons puis arrêt." },
      { type: "input", q: "cherche = 118 : quelle position est affichée ?", a: "2", ph: "nombre", exp: "118 apparaît deux fois (cases 2 et 5), mais l'arrêt anticipé donne la PREMIÈRE : 2." },
      { type: "qcm", q: "cherche = 999 : qu'affiche l'algorithme et que vaut i ?", opts: ["Trouvé en position 6, i = 6", "Numéro inconnu, i = 7", "Numéro inconnu, i = 6", "Erreur"], a: 1, exp: "On épuise les 6 cases, i finit à 7 > 6 : branche SINON." },
      { type: "qcm", q: "Le club passe à 10 000 adhérents. En moyenne, une recherche séquentielle fera environ…", opts: ["10 comparaisons", "100 comparaisons", "5 000 comparaisons", "1 comparaison"], a: 2, exp: "≈ n/2. C'est le prix de la simplicité — motivation parfaite pour la dichotomie du jour 23." }
    ],
    solution: `<p>Traces des trois recherches :</p>
<pre class="pseudo">cherche=342 : 205? non · 118? non · 342? OUI → position 3
cherche=118 : 205? non · 118? OUI → position 2 (la 1ʳᵉ occurrence)
cherche=999 : 6 échecs → i = 7 → "Numéro inconnu"</pre>
<p>Retiens le squelette : TANT QUE (dans les bornes ET pas trouvé) → avancer. Puis le verdict se lit sur i. Ce squelette resservira mot pour mot toute ta vie de programmeur.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton pseudocode ici…",
  items: [
  { id: "algo-rechseq", title: "La recherche séquentielle", level: 3,
    statement: "Un tableau <code>T</code> de 20 entiers est rempli. Lis une valeur <code>v</code> et affiche <code>\"Trouvé à la position …\"</code> (première occurrence) ou <code>\"Absent\"</code>. La boucle doit <strong>s'arrêter dès que la valeur est trouvée</strong>.",
    hints: [
      "Une boucle POUR va toujours au bout : utilise plutôt TANT QUE avec deux conditions.",
      "Il faut un booléen trouve (initialisé à FAUX) et un indice i (initialisé à 1).",
      "Condition de la boucle : TANT QUE i <= 20 ET NON trouve. Après la boucle, teste trouve pour savoir quoi afficher."
    ],
    solution: "ALGORITHME RechercheSequentielle             // nom de l'algorithme\nVARIABLES T : TABLEAU[1..20] D'ENTIERS       // le tableau déjà rempli\n          v, i : ENTIER                      // v = valeur cherchée, i = position courante\n          trouve : BOOLEEN                   // drapeau : a-t-on trouvé ?\nDEBUT                                        // début des instructions\n    Écrire(\"Valeur cherchée ?\")              // demande la valeur\n    Lire(v)                                  // range la saisie dans v\n    trouve ← FAUX                            // au départ, rien n'est trouvé\n    i ← 1                                    // on démarre à la première case\n    TANT QUE i <= 20 ET NON trouve FAIRE     // on continue si : cases restantes ET pas trouvé\n        SI T[i] = v ALORS                    // la case courante contient-elle v ?\n            trouve ← VRAI                    // oui → lever le drapeau (la boucle s'arrêtera)\n        SINON                                // non →\n            i ← i + 1                        // avancer à la case suivante\n        FINSI                                // fin du test\n    FINTANTQUE                               // sortie : trouvé OU tableau épuisé\n    SI trouve ALORS                          // pourquoi est-on sorti ?\n        Écrire(\"Trouvé à la position \", i)   // i pointe encore sur la bonne case\n    SINON                                    // sinon on a épuisé le tableau\n        Écrire(\"Absent\")                     // la valeur n'y est pas\n    FINSI                                    // fin du test final\nFIN                                          // fin de l'algorithme",
    note: "On n'incrémente i que si on n'a PAS trouvé : ainsi i pointe encore sur la bonne case à la sortie." },
  { id: "algo-occurrences", title: "Compter les occurrences", level: 2,
    statement: "Un tableau <code>T</code> de 15 entiers est rempli. Lis une valeur <code>v</code> et affiche <strong>combien de fois</strong> elle apparaît dans le tableau.",
    hints: [
      "Contrairement à la recherche séquentielle, il faut parcourir TOUT le tableau : une boucle POUR convient.",
      "C'est un compteur : compteur ← 0 avant la boucle, compteur ← compteur + 1 à chaque case égale à v.",
      "Après la boucle, pense au cas zéro : affiche un message différent si le compteur vaut 0."
    ],
    solution: "ALGORITHME CompterOccurrences                // nom de l'algorithme\nVARIABLES T : TABLEAU[1..15] D'ENTIERS       // le tableau déjà rempli\n          v, i, compteur : ENTIER            // valeur cherchée, indice, compteur\nDEBUT                                        // début des instructions\n    Écrire(\"Valeur à compter ?\")             // demande la valeur\n    Lire(v)                                  // range la saisie dans v\n    compteur ← 0                             // aucun trouvé pour l'instant\n    POUR i DE 1 A 15 FAIRE                   // on parcourt TOUTES les cases (pas d'arrêt anticipé)\n        SI T[i] = v ALORS                    // la case courante vaut-elle v ?\n            compteur ← compteur + 1          // oui → on compte une occurrence de plus\n        FINSI                                // fin du test\n    FINPOUR                                  // fin du parcours complet\n    SI compteur = 0 ALORS                    // aucun trouvé ?\n        Écrire(v, \" n'apparaît pas\")         // message spécifique\n    SINON                                    // au moins une occurrence\n        Écrire(v, \" apparaît \", compteur, \" fois\") // affiche le total\n    FINSI                                    // fin du bilan\nFIN                                          // fin de l'algorithme",
    note: "Compter = parcourir tout ; chercher la première occurrence = pouvoir s'arrêter tôt. Deux besoins, deux boucles différentes." }
  ]
};
</script>
