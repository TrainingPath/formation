  title: "Tri par sélection, tri par insertion",
  subtitle: "Deux autres stratégies de tri, deux façons de penser.",
  theory: `
<h3>1. Le tri par sélection : « je choisis le plus petit »</h3>
<p>Un <strong>tri</strong> est un algorithme qui <strong>range</strong> les valeurs d'un tableau dans l'ordre — ici l'ordre <strong>croissant</strong> (du plus petit au plus grand). Rappel de vocabulaire : un <strong>tableau</strong> est une rangée de <strong>cases</strong> numérotées, contenant chacune une valeur (imagine une rangée de casiers alignés) ; on écrit <code>t[i]</code> pour désigner « la valeur rangée dans la case numéro <code>i</code> » ; et <code>n</code> désigne le <strong>nombre total de cases</strong> du tableau.</p>
<p>Stratégie : chercher le <strong>minimum</strong> de tout le tableau (jour 17 !) — c'est-à-dire la <strong>plus petite valeur</strong> — et l'<strong>échanger</strong> (permuter, comme on échange la place de deux objets) avec la case 1. Puis chercher le minimum du reste, l'échanger avec la case 2. Et ainsi de suite. C'est exactement ce qu'on fait pour classer une pile de copies : on cherche la meilleure, on la pose devant ; on cherche la meilleure de celles qui restent, on la pose en 2ᵉ position ; etc.</p>
<p>Dans le pseudocode ci-dessous, <code>i</code> est le numéro de la case qu'on cherche à remplir avec le bon élément, <code>j</code> sert à parcourir tout le reste du tableau pour y chercher le minimum, et <code>posMin</code> retient la <strong>position</strong> (le numéro de case) du plus petit élément trouvé jusqu'ici. Chaque ligne est commentée après le symbole <code>//</code> (un commentaire : du texte pour l'humain, ignoré par la machine) :</p>
<pre class="pseudo">POUR i DE 1 A n - 1 FAIRE              // i = la case à « remplir » ; on va de la 1re à l'avant-dernière
    posMin ← i                         // au départ, on suppose que le plus petit est déjà en case i
    POUR j DE i + 1 A n FAIRE          // j parcourt tout le reste, de la case après i jusqu'à la fin : on cherche le min de t[i..n]
        SI t[j] < t[posMin] ALORS      // si la case j contient une valeur plus petite que le plus petit connu…
            posMin ← j                 // …on retient cette nouvelle position comme celle du minimum
        FINSI                          // fin du test de comparaison
    FINPOUR                            // fin du parcours du reste : posMin pointe le plus petit de t[i..n]
    SI posMin ≠ i ALORS                // si le plus petit n'était PAS déjà à sa place (≠ veut dire « différent de »)
        échanger t[i] et t[posMin]      // on permute les deux cases (UN seul échange par passage)
    FINSI                              // fin du test
FINPOUR                                // fin : la case i est définitivement bien remplie, on passe à la suivante</pre>
<p>Voici le déroulé pas à pas (une <strong>trace</strong>) sur un petit tableau. La barre <code>|</code> sépare la partie déjà triée (à gauche) du reste :</p>
<pre class="pseudo">[ 5 ][ 2 ][ 8 ][ 3 ]  min=2 → échange avec case 1 → [ 2 ][ 5 ][ 8 ][ 3 ]
[ 2 |  5 ][ 8 ][ 3 ]  min du reste=3 → case 2      → [ 2 ][ 3 ][ 8 ][ 5 ]
[ 2 | 3 |  8 ][ 5 ]   min du reste=5 → case 3      → [ 2 ][ 3 ][ 5 ][ 8 ] ✓</pre>
<div class="tip">Sélection = « recrutement » : à chaque tour, on sélectionne le meilleur candidat restant pour le prochain poste. Peu d'échanges (n−1 max), mais toujours n(n−1)/2 <strong>comparaisons</strong> (une comparaison = tester si une valeur est plus petite qu'une autre), même si le tableau est déjà trié.</div>
<h3>2. Le tri par insertion : « je range comme des cartes »</h3>
<p>Stratégie : on prend les éléments un à un et on <strong>insère</strong> (glisse) chacun À SA PLACE dans la partie déjà triée à gauche — exactement comme on range une main de cartes : chaque nouvelle carte piochée, on la fait glisser jusqu'à sa bonne position parmi celles déjà en ordre dans la main.</p>
<p>Dans le pseudocode, <code>i</code> désigne la carte qu'on est en train de ranger, <code>valeur</code> est une copie de cette carte mise de côté, et <code>j</code> sert à reculer vers la gauche pour trouver le bon trou. Le mot-clé <strong>TANT QUE</strong> répète des étapes tant qu'une condition reste vraie (une boucle « à condition »). Chaque ligne est commentée après <code>//</code> :</p>
<pre class="pseudo">POUR i DE 2 A n FAIRE                  // on prend les cartes une à une, à partir de la 2e (la 1re, seule, est déjà « triée »)
    valeur ← t[i]                      // la carte à ranger : on la met de côté (sinon un décalage l'écraserait)
    j ← i - 1                          // j part de la case juste à gauche de la carte
    TANT QUE j >= 1 ET t[j] > valeur FAIRE   // tant qu'on n'est pas sorti par la gauche ET que la case regardée est plus grande que la carte
        t[j + 1] ← t[j]                // décaler cette grande valeur d'une case vers la droite
        j ← j - 1                      // reculer d'une case vers la gauche
    FINTANTQUE                         // fin de la boucle : on a trouvé le trou où poser la carte
    t[j + 1] ← valeur                  // insérer la carte dans le trou libéré
FINPOUR                                // fin : on passe à la carte suivante</pre>
<p>Trace pas à pas (la barre <code>|</code> sépare la partie déjà rangée du reste) :</p>
<pre class="pseudo">[ 5 | 2   8   3 ]  insérer 2 : décale 5 → [ 2  5 | 8   3 ]
[ 2   5 | 8   3 ]  insérer 8 : rien à décaler → [ 2  5  8 | 3 ]
[ 2   5   8 | 3 ]  insérer 3 : décale 8, 5 → [ 2  3  5  8 ] ✓</pre>
<h3>3. Le duel des trois tris</h3>
<p>Comparons les trois tris quadratiques vus jusqu'ici (bulles au jour 24, plus les deux d'aujourd'hui). Ce tableau n'est pas du pseudocode mais un <strong>récapitulatif</strong> : chaque colonne est un tri, chaque ligne un critère (<code>~</code> veut dire « environ ») :</p>
<pre class="pseudo">                 Bulles      Sélection     Insertion
Comparaisons     ~n²/2       ~n²/2         ~n²/4 en moyenne
Échanges/décal.  beaucoup    n-1 max       selon désordre
Déjà trié ?      rapide*     lent          TRÈS rapide (n-1 comp.)
                 (*avec drapeau)</pre>
<div class="warn">Les trois restent « <strong>quadratiques</strong> » (leur travail est proportionnel à n², le carré de la taille) : doubler n quadruple le travail. Les tris professionnels (tri fusion, tri rapide) font bien mieux — tu les rencontreras après ce mois. L'important ici : une même mission, plusieurs STRATÉGIES.</div>`,

    { type: "qcm", q: "Quelle est la stratégie du tri par sélection ?", opts: ["Comparer les voisins", "Chercher le minimum du reste et le placer au début de la zone non triée", "Couper en deux", "Insérer des cartes"], a: 1, exp: "Le « recrutement du meilleur candidat » à chaque poste." },

    { type: "qcm", q: "Le tri par insertion sur un tableau DÉJÀ trié fait…", opts: ["n(n−1)/2 comparaisons", "Seulement n−1 comparaisons : chaque carte est déjà à sa place, aucun décalage", "n² échanges", "Il boucle à l'infini"], a: 1, exp: "Son point fort : il est adaptatif — presque gratuit sur des données presque triées." },

    solution: `<p>Équipe A (sélection) — chaque ligne montre le tableau, le minimum trouvé et l'échange effectué :</p>
<pre class="pseudo">[4 1 3 2] → min 1 ↔ case 1 → [1 4 3 2]        // passage 1 : le plus petit (1) vient en tête
[1 |4 3 2] → min 2 ↔ case 2 → [1 2 4 3]        // passage 2 : min du reste (2) vient en case 2
[1 2 |4 3] → min 3 ↔ case 3 → [1 2 3 4] ✓      // passage 3 : min du reste (3) en case 3 → trié (3 échanges)</pre>
<p>Équipe B (insertion) — chaque ligne insère la carte suivante à sa place dans la partie déjà triée (à gauche du <code>|</code>) :</p>
<pre class="pseudo">[4 | 1 3 2] insérer 1 → [1 4 | 3 2]            // 1 glisse devant 4
[1 4 | 3 2] insérer 3 → [1 3 4 | 2]            // 3 se place entre 1 et 4
[1 3 4 | 2] insérer 2 → [1 2 3 4] ✓            // 2 se place entre 1 et 3 → trié</pre>
<p>Même résultat, chemins différents. Savoir comparer des stratégies est plus précieux que connaître un tri par cœur.</p>`
  }

    ],
    solution: "PROCEDURE triInsertion(t : TABLEAU D'ENTIERS, n : ENTIER)\nVar\n    i, j, valeur, comparaisons, decalages : ENTIER\nDEBUT\n    comparaisons <- 0\n    decalages <- 0\n\n    POUR i DE 2 A n FAIRE\n        valeur <- t[i]          /* on MET DE COTE : la case i va etre ecrasee */\n        j <- i - 1\n\n        /* la borne sur j est testee AVANT la lecture de t[j] : sinon on lit\n           la case 0 des que la valeur est plus petite que toutes les autres.\n           Evaluation paresseuse, comme au jour 16. */\n        TANT QUE j >= 1 ET t[j] > valeur FAIRE\n            comparaisons <- comparaisons + 1\n            t[j + 1] <- t[j]    /* on decale vers la DROITE, en reculant */\n            decalages <- decalages + 1\n            j <- j - 1\n        FINTANTQUE\n        SI j >= 1 ALORS\n            comparaisons <- comparaisons + 1   /* celle qui a fait sortir */\n        FINSI\n\n        t[j + 1] <- valeur      /* on depose dans le trou */\n    FINPOUR\n\n    Ecrire(\"Insertion : \", comparaisons, \" comparaisons, \",\n           decalages, \" decalages\")\nFIN\n\nPROCEDURE triSelection(t : TABLEAU D'ENTIERS, n : ENTIER)\nVar\n    i, j, posMin, temp, comparaisons, echanges : ENTIER\nDEBUT\n    comparaisons <- 0\n    echanges <- 0\n\n    POUR i DE 1 A n - 1 FAIRE\n        posMin <- i\n        /* elle cherche TOUJOURS dans tout le reste : rien ne peut\n           l'interrompre plus tot, d'ou un cout independant des donnees */\n        POUR j DE i + 1 A n FAIRE\n            comparaisons <- comparaisons + 1\n            SI t[j] < t[posMin] ALORS\n                posMin <- j\n            FINSI\n        FINPOUR\n        SI posMin <> i ALORS\n            temp <- t[i]\n            t[i] <- t[posMin]\n            t[posMin] <- temp\n            echanges <- echanges + 1\n        FINSI\n    FINPOUR\n\n    Ecrire(\"Selection : \", comparaisons, \" comparaisons, \",\n           echanges, \" echanges\")\nFIN\n\nAlgorithme BancDEssai\nConst\n    N = 7\nVar\n    ecart, copie : TABLEAU[1..7] D'ENTIERS\n    i, jeu : ENTIER\nDebut\n    POUR jeu DE 1 A 3 FAIRE\n        Ecrire(\"Jeu \", jeu, \" — saisis les 7 ecarts\")\n        POUR i DE 1 A N FAIRE\n            Lire(ecart[i])\n        FINPOUR\n\n        /* chaque tri MODIFIE le tableau qu'on lui donne (jour 24) : il faut\n           donc une copie, sinon le second tri travaillerait sur un tableau\n           deja trie par le premier et tous les chiffres seraient faux */\n        POUR i DE 1 A N FAIRE\n            copie[i] <- ecart[i]\n        FINPOUR\n        triInsertion(copie, N)\n\n        POUR i DE 1 A N FAIRE\n            copie[i] <- ecart[i]\n        FINPOUR\n        triSelection(copie, N)\n    FINPOUR\nFin",
    reponses: [
      { ref: "c", texte: "Le tableau des six résultats. <strong>En désordre</strong> (14 · 9 · 21 · 5 · 17 · 3 · 12) : insertion 16 comparaisons et 13 décalages ; sélection 21 comparaisons et 5 échanges. <strong>Déjà trié</strong> (3 · 5 · 9 · 12 · 14 · 17 · 21) : insertion 6 comparaisons et 0 décalage ; sélection 21 comparaisons et 0 échange. <strong>Trié à l'envers</strong> (21 · 17 · 14 · 12 · 9 · 5 · 3) : insertion 21 comparaisons et 21 décalages ; sélection 21 comparaisons et 3 échanges." },
      { ref: "d", texte: "L'<strong>insertion est la meilleure sur les données déjà triées ou presque</strong> — 6 comparaisons contre 21, et aucun déplacement — et c'est son cas d'usage. La <strong>sélection est la meilleure sur les données triées à l'envers</strong> pour les déplacements : 3 échanges contre 21 décalages, parce qu'elle déplace chaque valeur une seule fois, directement à sa place, au lieu de la faire glisser case par case. Mais la question de la <em>prévisibilité</em> est différente et sa réponse est nette : la <strong>sélection</strong> est la plus prévisible, puisqu'elle effectue exactement 21 comparaisons sur les trois jeux. On sait à l'avance ce qu'elle coûtera ; l'insertion peut coûter de 6 à 21 selon des données qu'on ne contrôle pas. Cette distinction compte dès qu'un système doit garantir un temps de réponse plutôt qu'être rapide en moyenne — un pilote automatique préfère un algorithme lent et régulier à un algorithme rapide qui s'effondre parfois." },
      { ref: "Réflexion", texte: "<strong>Pourquoi l'une dépend des données et l'autre non.</strong> La sélection cherche le minimum de tout ce qui reste : sa boucle intérieure est une boucle à compteur qui va de bout en bout, et <em>rien ne peut l'interrompre</em> — même si le minimum est trouvé au premier essai, il faut vérifier tous les autres pour en être sûr. Son coût ne dépend donc que de la taille. L'insertion, elle, recule par une boucle à condition qui s'arrête dès qu'elle rencontre une valeur plus petite : sur des données déjà triées, elle s'arrête à la première comparaison de chaque tour, et sur des données inversées elle remonte jusqu'au début. C'est la nature de la boucle — compteur contre condition — qui décide de la sensibilité aux données, et c'est vrai bien au-delà des tris. <strong>Compter « des opérations » sans distinguer lesquelles</strong> est un raccourci trompeur. L'insertion fait 16 + 13 = 29 opérations contre 21 + 5 = 26 pour la sélection sur le tableau en désordre : à ce compte-là, la sélection gagnerait. Mais une comparaison et un déplacement ne coûtent pas la même chose, et surtout leur rapport dépend de <em>ce qu'on trie</em>. Sur des entiers, un déplacement est presque gratuit. Sur des fiches de plusieurs centaines de caractères, il coûte cent fois une comparaison — et la sélection, qui déplace peu, devient nettement meilleure. Sur des données où la comparaison est coûteuse — comparer deux chaînes longues, deux dates avec fuseaux — c'est l'inverse. Un décompte utile précise donc toujours <em>quelle</em> opération domine, et cette question n'a pas de réponse universelle. <strong>Où choisir l'insertion sans hésiter :</strong> sur des données presque triées, et surtout sur des données qui <em>arrivent</em> au fil de l'eau. L'insertion est le seul des trois tris étudiés qui fonctionne sans avoir toutes les valeurs sous la main : chaque nouvelle donnée se range dans ce qui est déjà trié, et le tableau est correct à tout instant. C'est exactement l'insertion triée de la billetterie du jour 23 — et c'est pourquoi elle sert encore, malgré son coût théorique, à l'intérieur des tris les plus rapides, qui l'appellent sur les petits morceaux." }

    pourquoi: "Le programme principal recopie le tableau avant chaque tri. C'est indispensable et facile à oublier : les procédures de tri <em>modifient</em> le tableau qu'on leur passe — c'est la leçon du jour 24 sur les tableaux qui ne sont pas recopiés — de sorte que le second tri travaillerait sur un tableau déjà trié par le premier. Les six chiffres du banc d'essai seraient alors faux, et faux dans le sens flatteur : le second tri paraîtrait toujours excellent.",

    hier: "jour24.html",
    enonce: "Reprends le tournoi d'hier. Le classement se met désormais à jour <strong>en direct</strong> : après chaque partie, un joueur voit son score changer, et le tableau d'affichage doit rester classé sans être retrié de fond en comble. Puisqu'il n'est jamais désordonné qu'à un seul endroit — celui du joueur dont le score vient de bouger —, la méthode qui convient est celle qui range une valeur dans un ensemble déjà trié. L'organisateur veut en outre savoir combien de places chaque joueur a gagnées ou perdues à chaque mise à jour, et voir le nombre de déplacements que cela a coûté.",
    principe: "Un tableau déjà trié dont une seule valeur a changé se remet en ordre en déplaçant cette seule valeur : elle remonte ou descend jusqu'à trouver sa place, et les autres se décalent d'un cran pour lui laisser le passage. Le coût est proportionnel au <em>nombre de places franchies</em>, et non à la taille du tableau — un joueur qui gagne deux rangs coûte deux déplacements, qu'il y ait huit ou huit mille joueurs.",
    sousQuestions: [
      { ref: "a", texte: "Écris la procédure qui, un score ayant changé à la position donnée, replace ce joueur au bon rang par déplacements successifs. Elle doit gérer les deux sens : le joueur peut être remonté ou descendu." },

    ],
    reflexion: "Ta procédure de replacement doit gérer les deux sens, et l'on pourrait croire qu'il suffit d'écrire deux boucles symétriques. Y a-t-il vraiment une symétrie parfaite, ou l'un des deux sens cache-t-il une difficulté que l'autre n'a pas ? Puis : la mise à jour en direct suppose que le tableau <em>était</em> trié avant. Que se passe-t-il si cette hypothèse est fausse — parce qu'une partie a été saisie deux fois, par exemple — et comment un algorithme peut-il se protéger d'une hypothèse dont il dépend entièrement ?",
    indices: [
      "Une seule valeur est mal placée, et l'algorithme ne doit toucher qu'à elle. Toute solution qui reparcourt l'ensemble du tableau passe à côté de l'exercice, même si elle donne le bon résultat.",
      "Le plan : mettre le joueur de côté — son score et son pseudonyme. Regarder de quel côté il doit aller. S'il doit remonter, décaler vers le bas tous ceux qu'il dépasse, en reculant ; s'il doit descendre, décaler vers le haut tous ceux qui le dépassent, en avançant. Le déposer enfin dans le trou, et annoncer le nombre de places franchies.",
      "En pseudocode, pour la remontée : <code>j ← position − 1</code> · <code>TANT QUE j &gt;= 1 ET score[j] &lt; scoreDuJoueur FAIRE</code> · recopier le joueur j un cran plus bas · <code>j ← j − 1</code> · <code>FINTANTQUE</code> · déposer en <code>j + 1</code>. La descente est le miroir, avec la borne haute et le sens inverse.",
      "Le point délicat est que les deux sens ne sont pas symétriques dans leur <em>déclenchement</em> : un score augmenté fait toujours remonter ou ne fait rien, un score diminué fait descendre ou ne fait rien, et il faut savoir lequel des deux traiter avant de commencer. Écrire les deux boucles à la suite sans discernement en ferait exécuter une pour rien — inoffensif — mais brouillerait le décompte des places franchies.",
      "Ta copie ressemble à ceci : <br><code>PROCÉDURE replacer(score, pseudo, n, position)</code><br>deux variables de mise de côté, un test de sens, deux boucles à condition<br>un dépôt final et un affichage du mouvement<br>puis la boucle des parties, qui n'appelle que cette procédure."
    ],
    solution: "PROCEDURE replacer(score : TABLEAU D'ENTIERS, pseudo : TABLEAU DE CHAINES,\n                   n : ENTIER, position : ENTIER)\n/* le tableau est trie DECROISSANT et une seule case est mal placee */\nVar\n    s, j, depart : ENTIER\n    p : CHAINE\nDEBUT\n    s <- score[position]        /* on met le joueur de cote : sa case va\n                                   etre ecrasee par les decalages */\n    p <- pseudo[position]\n    depart <- position\n\n    SI position > 1 ET s > score[position - 1] ALORS\n        /* REMONTEE : il depasse ceux qui le precedent, on les decale vers\n           le bas en reculant */\n        j <- position - 1\n        TANT QUE j >= 1 ET score[j] < s FAIRE\n            score[j + 1] <- score[j]\n            pseudo[j + 1] <- pseudo[j]\n            j <- j - 1\n        FINTANTQUE\n        score[j + 1] <- s\n        pseudo[j + 1] <- p\n        Ecrire(p, \" gagne \", depart - (j + 1), \" place(s)\")\n\n    SINON SI position < n ET s < score[position + 1] ALORS\n        /* DESCENTE : miroir exact, borne haute et sens inverse */\n        j <- position + 1\n        TANT QUE j <= n ET score[j] > s FAIRE\n            score[j - 1] <- score[j]\n            pseudo[j - 1] <- pseudo[j]\n            j <- j + 1\n        FINTANTQUE\n        score[j - 1] <- s\n        pseudo[j - 1] <- p\n        Ecrire(p, \" perd \", (j - 1) - depart, \" place(s)\")\n\n    SINON\n        Ecrire(p, \" conserve sa place\")\n    FINSI\nFIN\n\nAlgorithme TournoiEnDirect\nConst\n    N = 8\nVar\n    score : TABLEAU[1..8] D'ENTIERS\n    pseudo : TABLEAU[1..8] DE CHAINES\n    i, rang, points : ENTIER\nDebut\n    Ecrire(\"Saisis le classement de depart, du meilleur au moins bon\")\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Pseudonyme du rang \", i, \" ?\")\n        Lire(pseudo[i])\n        Ecrire(\"Score ?\")\n        Lire(score[i])\n    FINPOUR\n\n    REPETER\n        Ecrire(\"Rang du joueur qui marque (0 pour clore) ?\")\n        Lire(rang)\n        SI rang <> 0 ALORS\n            SI rang < 1 OU rang > N ALORS\n                Ecrire(\"Ce rang n'existe pas\")\n            SINON\n                Ecrire(\"Points gagnes (negatif pour une penalite) ?\")\n                Lire(points)\n                score[rang] <- score[rang] + points\n\n                /* une seule case est mal placee : on ne retrie rien */\n                replacer(score, pseudo, N, rang)\n\n                POUR i DE 1 A N FAIRE\n                    Ecrire(\"  \", i, \". \", pseudo[i], \" — \", score[i], \" pts\")\n                FINPOUR\n            FINSI\n        FINSI\n    JUSQU'A rang = 0\nFin",

      { ref: "d", texte: "Une mise à jour qui fait gagner deux rangs coûte <strong>deux déplacements</strong> — les deux joueurs dépassés reculent d'un cran chacun — plus la mise de côté et le dépôt, soit quatre écritures en tout. Un tri complet du tableau à chaque partie coûterait, avec le tri à bulles amélioré d'hier sur un tableau presque trié, un passage complet de sept comparaisons pour constater qu'il n'y a rien à faire, plus les passages nécessaires au déplacement réel — soit une vingtaine d'opérations au minimum sur huit joueurs. L'écart paraît modeste à cette échelle ; sur un tournoi de mille joueurs, il devient celui entre deux déplacements et plusieurs milliers de comparaisons, à chaque partie." },
      { ref: "Réflexion", texte: "<strong>La symétrie n'est pas parfaite</strong>, et la difficulté cachée est dans les bornes. À la remontée, on recule vers l'indice 1 et l'on dépose en <code>j + 1</code> ; à la descente, on avance vers l'indice <code>n</code> et l'on dépose en <code>j − 1</code>. Ce ne sont pas les mêmes corrections, et surtout elles s'appliquent au moment où la boucle vient de sortir — c'est-à-dire quand <code>j</code> a déjà franchi la position d'arrivée. L'erreur classique consiste à écrire la seconde boucle en recopiant la première et en inversant seulement les symboles de comparaison, sans toucher aux <code>+ 1</code> et <code>− 1</code> : le joueur est alors déposé une case trop loin, il écrase son voisin, et le tableau perd un joueur tout en restant parfaitement trié. Un joueur disparu d'un classement ordonné ne se remarque pas — sauf par celui qui a disparu. La seconde asymétrie est plus subtile : les deux tests de déclenchement doivent vérifier qu'on n'est pas déjà à une extrémité, et ces vérifications portent sur des bornes différentes, <code>position &gt; 1</code> d'un côté, <code>position &lt; n</code> de l'autre. <strong>L'hypothèse qui peut être fausse.</strong> Toute cette méthode repose sur le fait que le tableau était trié avant la mise à jour. Si une partie a été saisie deux fois — ou si le classement de départ a été saisi en désordre par l'organisateur — le replacement produit un tableau qui n'est trié <em>ni avant ni après</em>, et l'erreur ne se corrige jamais d'elle-même : chaque mise à jour suivante s'appuie sur une hypothèse fausse et ajoute son propre désordre. Un algorithme peut se protéger de deux façons. La moins coûteuse est de <strong>vérifier l'hypothèse une fois</strong>, au démarrage : un parcours de <code>n − 1</code> comparaisons suffit à confirmer que le tableau est trié, et c'est négligeable en regard de ce qu'on économise ensuite. La plus rigoureuse est de la <strong>vérifier après chaque opération</strong> — même parcours, à chaque mise à jour — ce qui annule une partie du gain mais transforme un désordre silencieux en anomalie détectée sur-le-champ. Le choix dépend de la gravité : pour un classement de tournoi, un contrôle au démarrage et un contrôle en fin de journée suffisent ; pour un système bancaire, on vérifie à chaque fois." }
