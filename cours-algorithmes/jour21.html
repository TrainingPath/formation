<script>
var DAY = {
  num: 21,
  title: "Paramètres et valeurs de retour",
  subtitle: "Comprendre finement comment les données circulent dans les fonctions.",
  theory: `
<h3>Rappel express : fonction, procédure, paramètre, argument</h3>
<p>Avant d'entrer dans le détail, remettons en place quatre mots vus les jours précédents. Une <strong>fonction</strong> est un petit programme réutilisable, avec un nom, qui prend des données et <strong>renvoie</strong> (« retourne ») un résultat — comme une machine à café qui reçoit des pièces et rend une boisson. Une <strong>procédure</strong> est presque pareille, mais elle <strong>ne renvoie rien</strong> : elle se contente d'agir (par exemple afficher quelque chose à l'écran). Un <strong>paramètre</strong> est le nom d'une « case d'entrée » écrit dans la définition de la fonction (par exemple <code>n</code> dans <code>doubler(n)</code>). Un <strong>argument</strong> est la valeur réelle qu'on donne au moment de l'appel (par exemple le <code>5</code> dans <code>doubler(5)</code>). <strong>Appeler</strong> une fonction, c'est la lancer en lui fournissant ses arguments. Aujourd'hui on regarde à la loupe COMMENT les données passent d'un côté à l'autre.</p>
<h3>1. Le passage par valeur : une COPIE</h3>
<p>Quand on appelle <code>f(x)</code>, la fonction ne reçoit pas la variable <code>x</code> elle-même : elle reçoit une <strong>copie</strong> de sa valeur. On appelle cela le <strong>passage par valeur</strong> (« par valeur » = on transmet la valeur recopiée, pas la boîte d'origine). Imagine que tu photocopies une feuille et que tu donnes la photocopie : celui qui gribouille dessus n'abîme pas ton original. Résultat : modifier le paramètre à l'intérieur de la fonction <strong>ne change pas</strong> la variable de départ :</p>
<pre class="pseudo">PROCÉDURE doubler(n : ENTIER)   // définit une procédure nommée "doubler" ; n est le paramètre (type ENTIER = nombre entier)
DEBUT                           // début du corps de la procédure
    n ← n * 2                   // n reçoit son ancienne valeur multipliée par 2 (* = "multiplié par") ; ne modifie que la COPIE locale
FIN                             // fin de la procédure

x ← 5                           // la variable x (dans le programme) reçoit la valeur 5
doubler(x)                      // on appelle doubler en lui passant une COPIE de x ; x lui-même n'est pas touché
Écrire(x)                       // affiche 5, PAS 10 ! (l'original n'a pas bougé)</pre>
<div class="tip">Pour récupérer un résultat, la bonne pratique est de RETOURNER : <code>x ← double(x)</code> avec <code>FONCTION double(n) : RETOURNER n * 2</code>. Le mot-clé <strong>RETOURNER</strong> (renvoyer) fait sortir la valeur de la fonction ; c'est à TOI de la ranger dans une variable avec la flèche <code>←</code> (l'affectation), sinon le résultat est perdu.</div>
<h3>2. Variables locales : chaque fonction a sa bulle</h3>
<p>Une variable est une <strong>boîte nommée</strong> qui contient une valeur. Les variables créées à l'intérieur d'une fonction (y compris ses paramètres) sont dites <strong>locales</strong> (« locales » = qui n'existent qu'à cet endroit) : elles <strong>naissent</strong> au moment de l'appel, <strong>meurent</strong> dès que la fonction renvoie son résultat, et sont <strong>invisibles</strong> depuis l'extérieur. C'est comme une conversation privée dans une pièce fermée : ce qui s'y dit reste dedans. Conséquence pratique très utile : deux fonctions différentes peuvent chacune avoir une variable nommée <code>i</code> sans jamais se gêner, car chacune a sa propre « bulle ».</p>
<pre class="pseudo">FONCTION sommeTableau(t, n)       // fonction qui additionne les n premières cases du tableau t
VARIABLES s, i : ENTIER           // déclare deux variables LOCALES : s (la somme) et i (le compteur), invisibles dehors
DEBUT                             // début du corps de la fonction
    s ← 0                         // on démarre la somme à 0 (case départ vide avant d'accumuler)
    POUR i DE 1 A n FAIRE         // boucle : i prend successivement les valeurs 1, 2, ... jusqu'à n
        s ← s + t[i]             // on ajoute à s la valeur de la case numéro i du tableau (t[i] = "case i de t")
    FINPOUR                       // fin de la boucle POUR
    RETOURNER s                   // on renvoie la somme calculée à celui qui a appelé la fonction
FIN                               // fin de la fonction</pre>
<h3>3. Plusieurs paramètres, un contrat clair</h3>
<p>Une fonction peut recevoir <strong>plusieurs</strong> paramètres, séparés par des virgules. L'ensemble « nom de la fonction + liste des paramètres + type renvoyé » forme son <strong>contrat</strong> : ce qu'elle attend en entrée et ce qu'elle promet en sortie. Ici <code>REEL</code> désigne un nombre à virgule (par exemple 60,5) et <code>ENTIER</code> un nombre entier (sans virgule).</p>
<pre class="pseudo">FONCTION prixRemise(prix : REEL, tauxRemise : ENTIER) : REEL   // deux paramètres ; ": REEL" à la fin = type de la valeur renvoyée
DEBUT                                                          // début du corps de la fonction
    RETOURNER prix * (100 - tauxRemise) / 100                 // calcule le prix après remise et le renvoie (/ = "divisé par")
FIN                                                            // fin de la fonction
prixRemise(80, 25)     → 60      // appel : prix=80, taux=25 → 80 × 75 / 100 = 60 ; ordre : prix PUIS taux !
prixRemise(25, 80)     → 5       // appel inversé : prix=25, taux=80 → 25 × 20 / 100 = 5 ; inversé = absurde mais calculé !</pre>
<div class="warn">Les arguments sont associés aux paramètres <strong>par position</strong> : le 1ᵉʳ argument remplit le 1ᵉʳ paramètre, le 2ᵉ le 2ᵉ, etc. Inverser l'ordre ne provoque <strong>aucune erreur</strong> visible : juste un résultat faux (un « bug silencieux »). Vérifie l'ordre à chaque appel.</div>
<h3>4. Retourner un booléen : les fonctions-tests</h3>
<p>Un <strong>booléen</strong> est une valeur qui ne peut valoir que <strong>VRAI</strong> ou <strong>FAUX</strong> (comme une réponse oui/non). Une <strong>fonction-test</strong> est une fonction qui renvoie un booléen : elle répond à une question. C'est très puissant, car le résultat s'utilise directement dans un <code>SI</code> (« si … alors ») ou un <code>TANT QUE</code> (une boucle qui répète tant qu'une condition reste vraie) :</p>
<pre class="pseudo">FONCTION estValide(note) : RETOURNER note >= 0 ET note <= 20   // renvoie VRAI si note est entre 0 et 20 ; >= "supérieur ou égal", ET "et en même temps"

SI estValide(n) ALORS ...            // si la fonction renvoie VRAI, on exécute le bloc ; se lit comme une phrase !
TANT QUE NON estValide(n) FAIRE Lire(n) FINTANTQUE   // NON inverse le résultat : tant que n n'est PAS valide, on redemande n avec Lire</pre>
<h3>5. Retour anticipé : sortir dès qu'on sait</h3>
<p>Un <strong>retour anticipé</strong> consiste à faire <code>RETOURNER</code> avant la fin de la fonction, dès qu'on connaît la réponse : inutile de continuer à travailler pour rien. Dans l'exemple ci-dessous, on cherche une valeur dans un tableau ; dès qu'on la trouve, on sort immédiatement.</p>
<pre class="pseudo">FONCTION contient(t, n, cherche) : BOOLEEN   // renvoie VRAI si "cherche" figure parmi les n premières cases de t
DEBUT                                        // début du corps de la fonction
    POUR i DE 1 A n FAIRE                     // on parcourt les cases 1, 2, ... jusqu'à n
        SI t[i] = cherche ALORS              // si la case i contient exactement la valeur cherchée (= teste l'égalité)
            RETOURNER VRAI                    // trouvé : on renvoie VRAI et on sort TOUT DE SUITE de la fonction
        FINSI                                 // fin du SI
    FINPOUR                                   // fin de la boucle : on est ici seulement si rien n'a été trouvé
    RETOURNER FAUX                            // boucle finie sans trouver → la valeur est absente, on renvoie FAUX
FIN                                           // fin de la fonction</pre>
<p>Le <code>RETOURNER VRAI</code> remplace élégamment le <strong>drapeau</strong> du jour 16 (une variable booléenne qu'on mettait à VRAI pour « se souvenir » qu'on avait trouvé) : ici la recherche s'arrête d'elle-même, sans variable supplémentaire.</p>`,
  exercises: [
    { type: "qcm", q: "x ← 5 ; doubler(x) (qui fait n ← n * 2). Que vaut x après ?", opts: ["10", "5 : la fonction n'a modifié que sa copie", "0", "Erreur"], a: 1, exp: "Passage par valeur = copie. L'original est intact." },

    { type: "vf", q: "Deux fonctions différentes peuvent chacune avoir une variable locale nommée <code>i</code>.", a: true, exp: "Aucun conflit : chaque bulle est isolée. C'est ce qui rend les fonctions composables." },

    { type: "input", q: "<code>FONCTION f(a, b) : RETOURNER a * 10 + b</code>. Que vaut <code>f(f(1, 2), 3)</code> ?", a: "123", ph: "nombre", exp: "f(1,2) = 12, puis f(12, 3) = 123." },
    { type: "qcm", q: "<code>FONCTION valider(note)</code> : quel corps pour retourner VRAI si la note est dans [0..20] ?", opts: ["RETOURNER note >= 0 ET note <= 20", "RETOURNER 0 <= note <= 20", "SI note ALORS RETOURNER", "RETOURNER note"], a: 0, exp: "L'encadrement du jour 8, retourné tel quel." },

    { type: "vf", q: "<code>Écrire(s)</code> dans une fonction remplace avantageusement <code>RETOURNER s</code>.", a: false, exp: "Écrire montre ; RETOURNER transmet. Une fonction qui affiche au lieu de retourner est inutilisable dans un calcul." }
  ],

    intro: `<p>Une boutique en ligne assemble des fonctions pour valider une commande :</p>
<pre class="pseudo">FONCTION enStock(stock, qte) : RETOURNER qte <= stock   // renvoie VRAI si la quantité demandée tient dans le stock (<= "inférieur ou égal")
FONCTION prixLigne(pu : REEL, qte : ENTIER) : RETOURNER pu * qte   // renvoie le prix d'une ligne : prix unitaire (pu) × quantité (qte)
FONCTION appliquerRemise(total) :   // fonction qui applique une remise éventuelle au total
    SI total >= 100 ALORS           // si le total atteint 100 € ou plus...
        RETOURNER total * 0.90      // ...on renvoie 90 % du total, soit -10 % dès 100 €
    SINON                           // sinon (total sous 100 €)
        RETOURNER total             // on renvoie le total sans remise
    FINSI                           // fin du SI
FIN                                 // fin de la fonction</pre>
<p>Commande : 4 articles à 30 € pièce, stock disponible : 10.</p>`,

    solution: `<p>Le pipeline complet de la commande (un « pipeline » = une suite d'étapes où la sortie de l'une nourrit l'entrée de la suivante) :</p>
<pre class="pseudo">SI enStock(10, 4) ALORS                        // teste d'abord la disponibilité : ici VRAI (4 <= 10)
    total ← prixLigne(30, 4)                   // calcule le prix de la ligne et le range dans total : 120
    aPayer ← appliquerRemise(total)            // applique la remise au total et range le résultat : 108
    Écrire("À payer : ", aPayer, " €")         // affiche le montant final à payer
SINON                                          // sinon (stock insuffisant)
    Écrire("Stock insuffisant")                // on informe que la commande ne peut pas être servie
FINSI                                          // fin du SI</pre>
<p>Chaque fonction fait UNE chose, se teste seule, et s'assemble avec les autres. C'est exactement ainsi qu'on construit de vrais logiciels — demain, on apprend à découper un problème entier de cette façon.</p>`
  }

      "Le plan : une procédure qui modifie son paramètre, un appel, un affichage qui montre l'absence d'effet. Puis la même chose en fonction, avec une affectation chez l'appelant. Puis la limitation, un simple test avec deux retours possibles. Puis la moyenne, un accumulateur local et une division, sans le moindre affichage.",
      "En pseudocode : <code>PROCÉDURE reglerRate(niveau, gain)</code> · <code>niveau ← niveau + gain</code> — sans effet. <code>FONCTION regler(niveau, gain) : REEL</code> · <code>RETOURNER niveau + gain</code>, et chez l'appelant <code>n ← regler(n, 3)</code>. <code>FONCTION limiter(niveau, plafond) : REEL</code> · un test, deux retours.",
      "Le point délicat est l'appel imbriqué du point c). Le résultat de la fonction intérieure devient l'argument de l'extérieure, donc l'intérieure s'exécute d'abord — comme dans une expression mathématique où l'on calcule ce qui est entre parenthèses avant le reste. Inverser l'ordre change le résultat dès que le gain fait franchir le plafond.",
      "Ta copie ressemble à ceci : <br>une procédure sans effet, écrite exprès<br><code>FONCTION …(niveau : REEL, gain : REEL) : REEL</code> avec un <code>RETOURNER</code><br>chez l'appelant : <code>n ← …(n, 3)</code> — l'affectation est indispensable<br>un appel imbriqué du genre <code>limiter(regler(…), …)</code>"
    ],
    solution: "PROCEDURE reglerRate(niveau : REEL, gain : REEL)\n/* a) SANS EFFET : niveau est une COPIE. On gribouille sur la photocopie. */\nDEBUT\n    niveau <- niveau + gain\nFIN\n\nFONCTION regler(niveau : REEL, gain : REEL) : REEL\n/* b) le seul canal de sortie d'un sous-programme est ce qu'il RETOURNE */\nDEBUT\n    RETOURNER niveau + gain\nFIN\n\nFONCTION limiter(niveau : REEL, plafond : REEL) : REEL\nDEBUT\n    SI niveau > plafond ALORS\n        RETOURNER plafond\n    SINON\n        RETOURNER niveau\n    FINSI\nFIN\n\nFONCTION niveauMoyen(piste : TABLEAU DE REELS, n : ENTIER) : REEL\nVar\n    somme : REEL              /* LOCALE : invisible du programme principal,\n                                 meme s'il possede une variable du meme nom */\n    i : ENTIER\nDEBUT\n    somme <- 0\n    POUR i DE 1 A n FAIRE\n        somme <- somme + piste[i]\n    FINPOUR\n    RETOURNER somme / n       /* elle n'affiche RIEN : l'appelant decide */\nFIN\n\nAlgorithme MixageConsole\nVar\n    piste : TABLEAU[1..8] DE REELS\n    n, i : ENTIER\n    niveau, somme : REEL      /* ce \"somme\"-ci n'a AUCUN rapport avec celui\n                                 de la fonction : deux boites distinctes */\nDebut\n    Ecrire(\"Nombre de pistes ?\")\n    Lire(n)\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"Niveau de la piste \", i, \" (dB) ?\")\n        Lire(piste[i])\n    FINPOUR\n\n    niveau <- piste[1]\n    Ecrire(\"Niveau de depart : \", niveau)\n\n    /* a) l'appel qui ne sert a rien */\n    reglerRate(niveau, 6)\n    Ecrire(\"Apres la procedure : \", niveau, \" — inchange\")\n\n    /* b) l'affectation est indispensable : sans elle, le resultat est perdu */\n    niveau <- regler(niveau, 6)\n    Ecrire(\"Apres la fonction : \", niveau)\n\n    /* c) appel imbrique : l'interieur s'execute D'ABORD, son resultat devient\n          l'argument de l'exterieur */\n    niveau <- limiter(regler(niveau, 12), 0)\n    Ecrire(\"Regle puis limite : \", niveau)\n\n    somme <- 0                /* cette variable locale au principal reste a 0 :\n                                 la fonction n'y a jamais touche */\n    Ecrire(\"Niveau moyen : \", Arrondi(niveauMoyen(piste, n), 2), \" dB\")\n    Ecrire(\"somme du principal : \", somme, \" — intacte\")\nFin",
    reponses: [
      { ref: "a", texte: "La variable ne change pas. La procédure reçoit une <em>copie</em> du niveau, ajoute le gain à cette copie, puis la copie disparaît avec la fin de l'appel : rien n'est jamais revenu jusqu'à l'appelant. L'affichage montre donc la valeur de départ, exactement. Ce qui rend la faute pénible, c'est qu'elle ne provoque aucune erreur — la procédure s'exécute, le calcul est juste, et le seul symptôme est que « ça ne fait rien »." },
      { ref: "Réflexion", texte: "<strong>Ce ne sont pas la même variable.</strong> Celle de la fonction naît au moment de l'appel, vit le temps de l'exécution, et disparaît au retour ; celle du programme principal existe pendant tout l'algorithme et n'est jamais atteinte. Elles portent le même nom parce que ce nom décrit bien ce qu'elles contiennent, et c'est tout ce qu'elles ont en commun — le nom d'une variable locale n'existe qu'à l'intérieur de son sous-programme, comme le prénom d'un élève n'a de sens que dans sa classe. Ce que cette séparation <strong>garantit</strong> est considérable : je peux écrire une fonction sans savoir quels noms de variables emploie celui qui l'appellera, et sans risquer d'écraser les siens. Sans elle, ajouter une variable de travail dans une fonction pourrait casser un algorithme écrit six mois plus tôt par quelqu'un d'autre, et l'on ne pourrait plus rien réutiliser sans tout relire. Ce qu'elle <strong>empêche</strong> : qu'une fonction communique autrement que par son retour — donc, en particulier, qu'elle rende <em>plusieurs</em> résultats. On contourne cet empêchement de trois façons : retourner une structure qui regroupe les valeurs, appeler plusieurs fonctions spécialisées plutôt qu'une seule qui ferait tout, ou — dans les langages qui le permettent — demander explicitement un passage par référence, où le sous-programme reçoit la boîte elle-même et non sa copie. Cette dernière solution est la plus puissante et la plus dangereuse : elle rend à la fonction le pouvoir de modifier son appelant, avec tous les risques que la séparation évitait. <strong>L'ordre des appels imbriqués</strong> va de l'intérieur vers l'extérieur : le réglage s'exécute d'abord, son résultat devient l'argument de la limitation. Inverser les deux — limiter d'abord, régler ensuite — donne un résultat différent dès que le gain fait franchir le plafond : partant de −6 dB avec un gain de 12 et un plafond de 0, ma version donne <code>limiter(6, 0) = 0</code>, tandis que l'inverse donnerait <code>regler(limiter(−6, 0), 12) = regler(−6, 12) = 6</code>, soit six décibels au-dessus du plafond de sécurité. Le limiteur doit être le dernier maillon de la chaîne, sinon il ne limite rien du tout — et c'est vrai des vrais limiteurs de studio comme de cette fonction." }

    enonce: "Reprends la billetterie d'hier : elle savait afficher, elle ne savait pas compter. Le théâtre applique une grille tarifaire : le plein tarif dépend de la catégorie de place ; les moins de 26 ans et les plus de 65 ans bénéficient de 30 % de réduction ; les abonnés d'une remise supplémentaire de 10 % appliquée après la première ; et le montant final ne descend jamais sous un plancher de 5 €, quelle que soit l'accumulation des réductions. Le guichet doit calculer le prix d'un billet, encaisser une série de ventes, et donner la recette de la soirée avec le nombre de billets vendus et le panier moyen.",

    reflexion: "Le plancher de 5 € est appliqué à la toute fin, après les deux réductions. Que donnerait un plancher appliqué après la première réduction seulement, sur un billet d'orchestre pour un abonné de 70 ans ? Calcule les deux et dis lequel est correct. Puis : ta fonction de prix ne consulte ni ne modifie aucune variable du programme principal, et pourtant elle a besoin de la grille tarifaire. Comment as-tu résolu cela, et quelles seraient les deux autres solutions possibles ? Enfin : pourrais-tu tester ta fonction de prix sans exécuter le reste de l'algorithme ? Qu'est-ce qui le permet ?",
    principe: "Les réductions successives se <strong>multiplient</strong> : 30 % puis 10 % laissent <code>0,70 × 0,90 = 0,63</code>, soit 37 % de réduction et non 40 %. Sur un orchestre à 28 €, un abonné de 70 ans paie donc 17,64 €. Le plancher, lui, n'est pas une réduction mais une <em>borne</em> : il s'applique après tout le reste, sur le montant final, et jamais au milieu de la chaîne.",
    indices: [
      "Trois fonctions de calcul, une procédure d'affichage reprise d'hier, et une boucle d'encaissement. Aucune des fonctions ne doit afficher, et la boucle ne doit calculer aucun prix elle-même : elle appelle.",
      "Le plan : une fonction qui traduit une catégorie en plein tarif, une qui juge l'âge, une qui enchaîne les deux réductions puis borne le résultat. Puis une boucle qui lit une vente, appelle la fonction de prix, imprime le billet, cumule la recette et compte le billet, jusqu'au signal d'arrêt. Enfin le bilan.",
      "En pseudocode : <code>FONCTION pleinTarif(categorie) : REEL</code> · <code>FONCTION aDroitReduction(age) : BOOLEEN</code> · <code>FONCTION prix(categorie, age, abonne) : REEL</code> · une variable locale qui porte le montant, deux multiplications conditionnelles, puis le plancher · une boucle d'encaissement · un bilan.",

      "Ta copie ressemble à ceci : <br>trois fonctions, dont la troisième contient une variable locale <code>montant</code><br><code>SI … ALORS montant ← montant * 0.70 FINSI</code> puis la seconde remise<br><code>SI montant < PLANCHER ALORS montant ← PLANCHER FINSI</code> — en dernier<br>une boucle d'encaissement qui n'appelle que <code>prix(…)</code> et la procédure d'hier."

    solution: "FONCTION pleinTarif(categorie : ENTIER) : REEL\nDEBUT\n    SI categorie = 1 ALORS\n        RETOURNER 28.00        /* orchestre */\n    SINON SI categorie = 2 ALORS\n        RETOURNER 19.00        /* corbeille */\n    SINON\n        RETOURNER 12.00        /* poulailler */\n    FINSI\nFIN\n\nFONCTION aDroitReduction(age : ENTIER) : BOOLEEN\nDEBUT\n    RETOURNER age < 26 OU age > 65\nFIN\n\nFONCTION prix(categorie : ENTIER, age : ENTIER, abonne : BOOLEEN) : REEL\nConst\n    PLANCHER = 5.00\nVar\n    montant : REEL             /* locale : elle porte le montant courant */\nDEBUT\n    montant <- pleinTarif(categorie)\n\n    /* les reductions se MULTIPLIENT sur le montant courant :\n       30 % puis 10 % laissent 0,63 et non 0,60 */\n    SI aDroitReduction(age) ALORS\n        montant <- montant * 0.70\n    FINSI\n    SI abonne ALORS\n        montant <- montant * 0.90\n    FINSI\n\n    /* le plancher est une BORNE, pas une reduction : il vient EN DERNIER.\n       Place entre les deux remises, il serait rabaisse par la seconde et\n       le prix final passerait SOUS le plancher cense le garantir. */\n    SI montant < PLANCHER ALORS\n        montant <- PLANCHER\n    FINSI\n    RETOURNER montant          /* elle n'affiche rien */\nFIN\n\nAlgorithme GuichetDuTheatre\nVar\n    spectacle, nomCategorie : CHAINE\n    categorie, age, billets, place : ENTIER\n    abonne : BOOLEEN\n    montant, recette : REEL\nDebut\n    Ecrire(\"Spectacle ?\")\n    Lire(spectacle)\n    recette <- 0\n    billets <- 0\n    place <- 0\n\n    REPETER\n        Ecrire(\"Categorie 1/2/3 (0 pour clore la soiree) ?\")\n        Lire(categorie)\n        SI categorie <> 0 ALORS\n            Ecrire(\"Age du spectateur ?\")\n            Lire(age)\n            Ecrire(\"Abonne (VRAI/FAUX) ?\")\n            Lire(abonne)\n\n            /* la boucle ne calcule aucun prix : elle appelle */\n            montant <- prix(categorie, age, abonne)\n            place <- place + 1\n            billets <- billets + 1\n            recette <- recette + montant\n\n            SI categorie = 1 ALORS\n                nomCategorie <- \"Orchestre\"\n            SINON SI categorie = 2 ALORS\n                nomCategorie <- \"Corbeille\"\n            SINON\n                nomCategorie <- \"Poulailler\"\n            FINSI\n            billet(spectacle, nomCategorie, montant, place)   /* procedure d'hier */\n        FINSI\n    JUSQU'A categorie = 0\n\n    titre(\"BILAN DE LA SOIREE\", 34)                            /* procedure d'hier */\n    SI billets = 0 ALORS\n        Ecrire(\"  Aucune vente : soiree annulee ou salle vide\")\n    SINON\n        Ecrire(\"  \", billets, \" billet(s)\")\n        Ecrire(\"  Recette : \", Arrondi(recette, 2), \" EUR\")\n        Ecrire(\"  Panier moyen : \", Arrondi(recette / billets, 2), \" EUR\")\n    FINSI\n    ligne(34)\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le plancher mal placé.</strong> Sur un orchestre à 28 € pour un abonné de 70 ans : la version correcte donne <code>28 × 0,70 = 19,60</code>, puis <code>× 0,90 = 17,64</code>, et le plancher ne joue pas. Prenons plutôt un poulailler à 12 € pour le même spectateur : <code>12 × 0,70 = 8,40</code>, puis <code>× 0,90 = 7,56</code> — le plancher ne joue toujours pas, mais la mécanique se voit mieux si l'on imagine un tarif enfant à 7 € : <code>7 × 0,70 = 4,90</code>, ce qui est <em>déjà</em> sous le plancher. Version fautive, plancher après la première réduction : le montant remonte à 5,00, puis la remise abonné le rabaisse à <strong>4,50 €</strong> — soit cinquante centimes sous le plancher que la règle prétendait garantir. Version correcte : <code>4,90 × 0,90 = 4,41</code>, puis le plancher le remonte à <strong>5,00 €</strong>. La leçon générale est qu'une <em>borne</em> et une <em>transformation</em> ne commutent pas : borner puis transformer ne donne pas transformer puis borner, et une borne doit toujours être la dernière opération de la chaîne — sinon elle ne borne rien. C'est exactement ce que disait le limiteur de l'exercice précédent, appliqué à un montant. <strong>La grille tarifaire</strong> est enfermée dans la fonction <code>pleinTarif</code>, qui la connaît en dur. C'est la solution la plus simple et elle a un défaut : changer un prix oblige à modifier une fonction, donc à toucher au code. Les deux autres solutions possibles sont, d'une part, de <strong>passer les trois prix en paramètres</strong> à la fonction de prix, ce qui la rend indépendante mais alourdit chaque appel de trois arguments qui ne varient jamais ; d'autre part, de <strong>ranger la grille dans un tableau</strong> déclaré au niveau du programme et indexé par la catégorie, ce qui permet de la lire depuis un fichier au démarrage — c'est ce que fait toute vraie billetterie, et cela supprime la chaîne de tests par la même occasion. <strong>Oui, je peux tester la fonction de prix isolément</strong>, et c'est sa qualité principale : elle ne lit aucune saisie, n'affiche rien, ne dépend d'aucune variable extérieure, et son résultat ne dépend que de ses trois arguments. Il suffit donc de l'appeler avec des valeurs choisies et de comparer le retour à ce qu'on a calculé à la main — sans guichet, sans spectacle, sans boucle. Une fonction dont le résultat ne dépend que de ses arguments est testable ; une fonction qui interroge le clavier ou consulte l'état du programme ne l'est pas, et c'est la raison de fond pour laquelle on sépare le calcul du dialogue." }
