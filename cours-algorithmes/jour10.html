<script>
var DAY = {
  num: 10,
  title: "La boucle POUR",
  subtitle: "Répéter un nombre de fois connu à l'avance.",
  theory: `
<h3>1. Quand on sait combien de tours</h3>
<p>Hier, le TANT QUE répétait « tant qu'une situation dure ». Quand on connaît <strong>à l'avance</strong> le nombre de répétitions, la boucle <strong>POUR</strong> est plus simple : elle gère elle-même le <strong>compteur</strong> (la variable qui compte les tours).</p>
<pre class="pseudo">POUR i DE 1 A 5 FAIRE               // i part de 1, augmente de 1 à chaque tour, jusqu'à 5
    Écrire(i)                       // affiche la valeur courante du compteur
FINPOUR                             // marque la fin du corps de la boucle
// affiche 1 2 3 4 5                // i vaut successivement 1, 2, 3, 4, 5</pre>
<p>La variable <code>i</code> est le <strong>compteur</strong> : elle vaut 1 au premier tour, 2 au deuxième… jusqu'à 5, puis la boucle s'arrête. L'incrémentation (l'ajout de 1 : <code>i ← i + 1</code>) est <strong>automatique</strong>, on n'a pas à l'écrire.</p>
<h3>2. Équivalence avec TANT QUE</h3>
<p>Un POUR est en réalité un TANT QUE où l'initialisation, le test et la progression du compteur sont déjà intégrés :</p>
<pre class="pseudo">POUR i DE 1 A n FAIRE          i ← 1                     // à gauche le POUR, à droite son équivalent TANT QUE
    corps               =      TANT QUE i <= n FAIRE     // même condition d'arrêt
FINPOUR                            corps                 // même corps répété
                                   i ← i + 1             // progression AUTOMATIQUE dans le POUR
                               FINTANTQUE                // fin de la boucle équivalente</pre>
<h3>3. Compter le nombre de tours</h3>
<div class="tip">De <code>a</code> à <code>b</code>, la boucle fait <strong>b − a + 1</strong> tours. POUR i DE 3 A 7 : 7−3+1 = <strong>5</strong> tours (3, 4, 5, 6, 7).</div>
<h3>4. Varier le pas</h3>
<p>Le <strong>pas</strong> est la quantité ajoutée au compteur à chaque tour (1 par défaut). On peut le changer avec le mot-clé PAS, y compris le rendre négatif pour descendre :</p>
<pre class="pseudo">POUR i DE 0 A 10 PAS 2 FAIRE    // 0 2 4 6 8 10   // pas de 2 : le compteur saute de 2 en 2
POUR i DE 5 A 1 PAS -1 FAIRE    // 5 4 3 2 1 (compte à rebours)   // pas négatif : le compteur descend</pre>
<h3>5. Utiliser le compteur dans les calculs</h3>
<pre class="pseudo">// Table de multiplication de 7           // on se sert de i comme multiplicateur
POUR i DE 1 A 10 FAIRE                     // i prend les valeurs 1 à 10
    Écrire(7, " x ", i, " = ", 7 * i)     // affiche la ligne "7 x i = résultat"
FINPOUR                                    // fin de la boucle</pre>
<pre class="pseudo">// Somme des n premiers entiers           // on additionne 1 + 2 + … + n
somme ← 0                                 // accumulateur : démarre à 0
POUR i DE 1 A n FAIRE                      // i parcourt 1, 2, …, n
    somme ← somme + i                     // ajoute i au total courant
FINPOUR                                    // fin de la boucle</pre>
<h3>6. POUR ou TANT QUE ?</h3>
<ul>
<li>Nombre de tours <strong>connu d'avance</strong> (10 fois, n fois, pour chaque élève…) → <strong>POUR</strong></li>
<li>Nombre de tours <strong>inconnu</strong> (tant que la saisie est fausse, tant que le solde est positif…) → <strong>TANT QUE</strong></li>
</ul>
<div class="warn">Ne modifie JAMAIS le compteur à la main dans le corps d'un POUR (pas de <code>i ← i + 2</code> dedans) : c'est la boucle qui le gère.</div>`,
  exercises: [
    { type: "qcm", q: "Quand préférer POUR à TANT QUE ?", opts: ["Quand la condition est complexe", "Quand le nombre de répétitions est connu à l'avance", "Quand on veut une boucle infinie", "Jamais"], a: 1, exp: "POUR = nombre de tours connu ; TANT QUE = situation qui dure." },
    { type: "input", q: "Combien de tours fait <code>POUR i DE 1 A 8</code> ?", a: "8", ph: "nombre", exp: "8 − 1 + 1 = 8 tours." },
    { type: "input", q: "Combien de tours fait <code>POUR i DE 4 A 12</code> ?", a: "9", ph: "nombre", exp: "12 − 4 + 1 = 9 tours (piège classique du ±1 !)." },
    { type: "qcm", q: "Qu'affiche <code>POUR i DE 1 A 4 FAIRE Écrire(i * i) FINPOUR</code> ?", opts: ["1 2 3 4", "1 4 9 16", "2 4 6 8", "4 9 16 25"], a: 1, exp: "Le carré du compteur : 1, 4, 9, 16." },
    { type: "vf", q: "Dans une boucle POUR, il faut écrire soi-même <code>i ← i + 1</code>.", a: false, exp: "L'incrémentation est automatique : c'est tout l'intérêt du POUR." },
    { type: "qcm", q: "Qu'affiche <code>POUR i DE 0 A 10 PAS 2 FAIRE Écrire(i) FINPOUR</code> ?", opts: ["0 1 2 … 10", "0 2 4 6 8 10", "2 4 6 8", "0 2 4 8"], a: 1, exp: "Pas de 2 : on saute de deux en deux." },
    { type: "qcm", q: "Comment faire un compte à rebours 10, 9, …, 1 ?", opts: ["POUR i DE 1 A 10", "POUR i DE 10 A 1 PAS -1", "TANT QUE i = 10", "POUR i DE 10 A 1 PAS 2"], a: 1, exp: "Un pas négatif fait descendre le compteur." },
    { type: "input", q: "<code>s ← 0 ; POUR i DE 1 A 5 FAIRE s ← s + i FINPOUR</code> : que vaut <code>s</code> ?", a: "15", ph: "nombre", exp: "1+2+3+4+5 = 15." },
    { type: "input", q: "<code>p ← 1 ; POUR i DE 1 A 4 FAIRE p ← p * 2 FINPOUR</code> : que vaut <code>p</code> ?", a: "16", ph: "nombre", exp: "On double 4 fois : 2, 4, 8, 16 = 2 puissance 4." },
    { type: "qcm", q: "Pour afficher la table de multiplication de 9 (de 9×1 à 9×10), quelle boucle ?", opts: ["POUR i DE 1 A 10 FAIRE Écrire(9 * i) FINPOUR", "POUR i DE 9 A 90", "TANT QUE 9 < 10", "POUR i DE 1 A 9"], a: 0, exp: "Le compteur i joue le rôle du multiplicateur." },
    { type: "input", q: "Combien de fois « Hop » ? <code>POUR i DE 5 A 5 FAIRE Écrire(\"Hop\") FINPOUR</code>", a: "1", ph: "nombre", exp: "5 − 5 + 1 = 1 tour : la boucle tourne une seule fois." },
    { type: "input", q: "Combien de tours fait <code>POUR i DE 7 A 3</code> (pas de 1) ?", a: "0", ph: "nombre", exp: "Départ déjà au-delà de l'arrivée : zéro tour (comme un TANT QUE faux d'entrée)." },
    { type: "qcm", q: "« Demander leur note aux 25 élèves de la classe » : quelle structure ?", opts: ["25 instructions Lire", "POUR i DE 1 A 25 FAIRE Écrire(\"Note ?\") ; Lire(note) … FINPOUR", "TANT QUE note > 0", "Un seul Lire"], a: 1, exp: "Nombre connu (25) → POUR. La boucle remplace 25 copies du même code." },
    { type: "qcm", q: "« Redemander le mot de passe jusqu'à ce qu'il soit correct » : quelle structure ?", opts: ["POUR i DE 1 A 3", "TANT QUE motDePasse ≠ correct", "POUR i DE 1 A 100", "SI motDePasse = correct"], a: 1, exp: "Nombre d'essais imprévisible → TANT QUE." },
    { type: "input", q: "<code>c ← 0 ; POUR i DE 1 A 20 FAIRE SI i MOD 5 = 0 ALORS c ← c + 1 FINSI FINPOUR</code> : que vaut <code>c</code> ?", a: "4", ph: "nombre", exp: "Multiples de 5 entre 1 et 20 : 5, 10, 15, 20 → quatre. Une boucle peut contenir un SI !" }
  ],
  final: {
    title: "Exercice final — La facture du traiteur",
    intro: `<p>Un traiteur sert un banquet de <strong>n tables</strong>. Chaque table i (numérotée de 1 à n) commande <code>i</code> plats à <strong>15 €</strong> pièce (la table 1 : 1 plat, la table 2 : 2 plats, etc.). L'algorithme calcule la facture totale.</p>
<pre class="pseudo">ALGORITHME Banquet                  // nom de l'algorithme
DEBUT                               // début des étapes
    Lire(n)                         // saisit le nombre de tables
    total ← 0                       // accumulateur de somme : démarre à 0
    POUR i DE 1 A n FAIRE           // i = numéro de table, de 1 à n
        total ← total + i * 15      // ajoute le coût de la table i (i plats × 15 €)
    FINPOUR                         // fin de la boucle
    Écrire(total)                   // affiche la facture totale
FIN                                 // fin de l'algorithme</pre>
<p>On prend <strong>n = 4</strong>.</p>`,
    questions: [
      { type: "input", q: "Que vaut <code>total</code> après le tour i = 1 ?", a: "15", ph: "nombre", exp: "0 + 1×15 = 15." },
      { type: "input", q: "Après le tour i = 2 ?", a: "45", ph: "nombre", exp: "15 + 2×15 = 45." },
      { type: "input", q: "Qu'affiche l'algorithme à la fin (n = 4) ?", a: "150", ph: "nombre", exp: "15 + 30 + 45 + 60 = 150 € = (1+2+3+4) × 15." },
      { type: "input", q: "Combien de tours la boucle fait-elle si n = 12 ?", a: "12", ph: "nombre", exp: "De 1 à 12 : 12 tours." },
      { type: "qcm", q: "Le traiteur veut maintenant boucler « tant qu'il reste des plats en cuisine » (stock imprévisible). Quelle boucle ?", opts: ["POUR, car plus rapide", "TANT QUE, car le nombre de tours n'est pas connu d'avance", "Les deux sont identiques", "Aucune"], a: 1, exp: "Le critère de choix du jour : connu → POUR, inconnu → TANT QUE." }
    ],
    solution: `<p>Trace avec n = 4 :</p>
<pre class="pseudo">i    i * 15    total
1    15        15
2    30        45
3    45        90
4    60        150</pre>
<p>Le motif « POUR + accumulateur » (total ← total + …) est LE motif le plus fréquent de l'algorithmique. On le formalise au jour 12.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton pseudocode ici…",
  items: [
  { id: "algo-factorielle", title: "La factorielle", level: 2,
    statement: "Lis un entier <code>n</code> et calcule sa factorielle : <code>n! = 1 × 2 × 3 × … × n</code> (avec <code>0! = 1</code>).<pre class=\"pseudo\">n ? 5\n5! = 120</pre>",
    hints: [
      "C'est un accumulateur… de multiplication : il démarre à 1, pas à 0 !",
      "fact ← 1 avant la boucle, puis fact ← fact * i à chaque tour.",
      "Boucle POUR i DE 1 A n : si n = 0, la boucle ne fait aucun tour et fact reste 1 — le cas 0! = 1 est gratuit."
    ],
    solution: "ALGORITHME Factorielle          // nom de l'algorithme\nVARIABLES n, i, fact : ENTIER   // n = borne, i = compteur, fact = produit accumulé\nDEBUT                           // début des instructions\n    Écrire(\"n ?\")               // demande la valeur\n    Lire(n)                     // range la saisie dans n\n    fact ← 1                    // un accumulateur de PRODUIT démarre à 1 (pas 0 !)\n    POUR i DE 1 A n FAIRE       // i prend les valeurs 1, 2, 3, …, n\n        fact ← fact * i         // multiplie le produit courant par i\n    FINPOUR                     // si n = 0 : zéro tour, fact reste 1 → correct !\n    Écrire(n, \"! = \", fact)     // affiche le résultat final\nFIN                             // fin de l'algorithme",
    note: "Accumulateur de somme → départ 0 ; accumulateur de produit → départ 1 (jour 12). Tu réécriras cet exercice en récursif au jour 26 !" }
  ]
};
</script>
