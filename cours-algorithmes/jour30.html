<body>
<script>
var DAY = {
  num: 30,
  title: "Résoudre un problème de A à Z",
  subtitle: "La méthode complète : de l'énoncé flou à l'algorithme vérifié.",
  theory: `
<h3>1. La méthode en 6 étapes (à graver)</h3>
<p>Depuis le jour 1, on a appris des <strong>outils</strong> un par un. Aujourd'hui, on apprend la <strong>méthode</strong> : la marche à suivre, du début à la fin, quand on nous pose un problème « tout neuf ». Une <strong>méthode</strong> est simplement une liste d'étapes qu'on suit toujours dans le même ordre, comme la procédure d'un pompier qui arrive sur un incendie : il ne réfléchit pas dans le désordre, il déroule. Voici la nôtre, en six étapes. Chaque ligne est commentée après le symbole <code>//</code> (qui introduit un <strong>commentaire</strong> : un texte destiné à l'humain, ignoré lors de l'exécution) :</p>
<pre class="pseudo">1. COMPRENDRE   : reformuler l'énoncé, identifier entrées/sorties   // étape 1 : que reçoit-on, que doit-on produire ?
2. EXEMPLIFIER  : résoudre UN exemple à la main, sur papier          // étape 2 : jouer soi-même le rôle de l'ordinateur
3. DÉCOUPER     : raffinements successifs (jour 22)                  // étape 3 : casser le gros problème en petits morceaux
4. OUTILLER     : quels motifs connus s'appliquent ?                 // étape 4 : reconnaître un problème déjà rencontré
                  (compteur ? max ? drapeau ? tri ? dichotomie ?)    // ... et piocher le bon outil dans la boîte
5. ÉCRIRE       : le pseudocode, bloc par bloc                       // étape 5 : traduire enfin la logique en instructions
6. VÉRIFIER     : trace sur l'exemple + CAS LIMITES                  // étape 6 : tester, surtout les cas piégeux</pre>
<p>Quelques mots à définir. L'<strong>énoncé</strong> est le texte du problème tel qu'on nous le donne (« calcule la moyenne de la classe… ») ; le <strong>reformuler</strong>, c'est le réécrire avec ses propres mots pour être sûr de l'avoir compris. Les <strong>entrées</strong> sont les données que l'algorithme reçoit (jour 1), les <strong>sorties</strong> le résultat qu'il produit. Un <strong>raffinement successif</strong> (jour 22) consiste à découper une tâche trop grosse en sous-tâches plus petites, encore et encore, jusqu'à ce que chaque morceau devienne évident — comme un plan de dissertation qu'on détaille en parties puis en paragraphes. Un <strong>motif</strong> est une solution-type déjà rencontrée qu'on réutilise (voir la boîte à outils plus bas). Enfin, un <strong>cas limite</strong> est une situation extrême ou inhabituelle qui met l'algorithme à l'épreuve (on y revient en section 4).</p>
<h3>2. L'étape 2 est magique</h3>
<p>Résoudre un exemple À LA MAIN révèle l'algorithme : observe TES propres gestes. Comment as-tu trouvé le max ? Tu as gardé « le plus grand vu jusqu'ici » en tête — c'est l'algorithme du jour 17 ! Ton cerveau EST un interprète d'algorithmes ; il suffit de l'écouter. (Un <strong>interprète</strong>, ici, désigne celui qui exécute les étapes une par une : quand tu suis une recette de cuisine, l'interprète, c'est toi.)</p>
<h3>3. Le catalogue de motifs du mois (ta boîte à outils)</h3>
<p>Un <strong>motif</strong> (en anglais <em>pattern</em>, « modèle ») est un problème-type revenu tout au long du mois, avec sa solution toute prête. Reconnaître le motif, c'est comme un mécanicien qui, au bruit du moteur, sait déjà quel outil sortir. Voici le tableau des correspondances « phrase de l'énoncé → outil à utiliser (et le jour où on l'a vu) » ; chaque ligne est commentée après <code>//</code> :</p>
<pre class="pseudo">« combien de… ? »            → compteur (j12)                        // ajouter 1 à une boîte chaque fois qu'une condition est vraie
« total / moyenne ? »        → accumulateur (j12)                    // une boîte qui additionne les valeurs au fur et à mesure
« le plus grand/petit ? »    → champion provisoire (j17)             // garder en mémoire le meilleur élément vu jusqu'ici
« existe-t-il… ? »           → drapeau / retour anticipé (j16, j21)  // un booléen VRAI/FAUX qui mémorise « je l'ai trouvé »
« où se trouve… ? »          → position + recherche (j16, j23)       // renvoyer l'indice (le numéro de la case) de l'élément trouvé
« dans l'ordre ? »           → tri (j24, j25)                        // ranger les éléments du plus petit au plus grand
« valider une saisie ? »     → boucle TANT QUE/RÉPÉTER (j9, j11)     // redemander une valeur tant que la réponse est incorrecte
« grille / paires ? »        → boucles imbriquées (j13, j18)         // une boucle placée à l'intérieur d'une autre boucle
« structure emboîtée ? »     → récursivité (j26, j27)                // un algorithme qui s'appelle lui-même sur un sous-problème
« qui sort en premier ? »    → pile / file (j29)                     // pile : le dernier arrivé sort ; file : le premier arrivé sort</pre>
<h3>4. Les cas limites : là où meurent les algorithmes</h3>
<p>Un <strong>cas limite</strong> est une entrée extrême ou inhabituelle (un tableau vide, une seule valeur, une valeur introuvable…) : ce sont les situations où un algorithme qui « marche en général » se casse la figure. Un algorithme qui marche « en général » n'est pas fini. Teste TOUJOURS :</p>
<ul>
<li><strong>vide</strong> : tableau de 0 élément, chaîne vide (il n'y a rien du tout à traiter)</li>
<li><strong>unité</strong> : un seul élément (le plus petit cas qui ne soit pas vide)</li>
<li><strong>extrêmes</strong> : tout égal, déjà trié, trié à l'envers, valeurs négatives, zéro</li>
<li><strong>absent</strong> : la valeur cherchée n'existe pas</li>
</ul>
<div class="warn">Le bug du débutant : tester uniquement le cas facile. Le réflexe du pro : attaquer son propre algorithme avec les cas vicieux AVANT qu'un utilisateur ne le fasse. (Un <strong>bug</strong> est une erreur cachée dans l'algorithme qui lui fait donner un mauvais résultat ou le fait planter.)</div>
<h3>5. Vérifier par la trace</h3>
<p>La <strong>trace</strong> (jour 2 !) reste l'arme absolue : dérouler l'algorithme ligne par ligne sur un petit exemple, en notant dans un tableau la valeur de chaque variable après chaque instruction (une colonne par variable). C'est exactement ce que ferait l'ordinateur, mais réalisé à la main pour vérifier. 90 % des bugs apparaissent à la trace.</p>
<div class="tip">Boucle vertueuse : Comprendre → Exemple → Découper → Outiller → Écrire → Vérifier… et si la vérification échoue, on remonte d'une étape. Jamais de panique : une étape à la fois.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la PREMIÈRE étape face à un problème ?", opts: ["Écrire du pseudocode", "Comprendre : reformuler, identifier entrées et sorties", "Choisir une boucle", "Déclarer des variables"], a: 1, exp: "Coder avant de comprendre = coder deux fois." },
    { type: "qcm", q: "À quoi sert de résoudre un exemple À LA MAIN ?", opts: ["À perdre du temps", "À observer ses propres gestes : ils RÉVÈLENT l'algorithme", "À éviter le pseudocode", "À obtenir le résultat sans écrire d'algorithme"], a: 1, exp: "Ton cerveau exécute déjà l'algorithme — écris ce qu'il fait." },
    { type: "qcm", q: "« Combien d'élèves ont plus de 15 de moyenne ? » Quel motif ?", opts: ["Accumulateur", "Compteur conditionnel", "Tri", "Pile"], a: 1, exp: "« Combien ? » → compteur (jour 12)." },
    { type: "qcm", q: "« Quel produit a le meilleur rapport qualité/prix ? » Quel motif ?", opts: ["Champion provisoire (max) sur la valeur qualite[i]/prix[i]", "File", "Drapeau", "Concaténation"], a: 0, exp: "« Le plus… » → max (jour 17), appliqué à une expression calculée." },
    { type: "qcm", q: "« Ce client existe-t-il dans le fichier ? » Quel motif ?", opts: ["Accumulateur", "Recherche avec drapeau ou retour anticipé", "Boucles imbriquées", "Moyenne"], a: 1, exp: "« Existe-t-il ? » → recherche (jour 16), dichotomie si trié (jour 23)." },
    { type: "qcm", q: "« Afficher le classement des joueurs » : quel prérequis ?", opts: ["Une pile", "Trier les scores (jour 24-25)", "Une factorielle", "Un drapeau"], a: 1, exp: "« Dans l'ordre » → tri." },
    { type: "qcm", q: "Quels sont les 4 cas limites incontournables ?", opts: ["Grand, petit, moyen, nul", "Vide, un seul élément, extrêmes (trié/inversé/égaux), valeur absente", "Positif, négatif", "Pair, impair"], a: 1, exp: "La check-list qui tue les bugs avant la mise en service." },
    { type: "qcm", q: "L'algorithme du max (jour 17) sur un tableau VIDE (n = 0) :", opts: ["Retourne 0", "Plante : max ← t[1] accède à une case inexistante — le cas limite l'attrape !", "Retourne -1", "Fonctionne"], a: 1, exp: "D'où l'intérêt du test « vide » : il faut traiter n = 0 à part." },
    { type: "qcm", q: "La moyenne (somme / nb) quand nb = 0 :", opts: ["Vaut 0", "Division par zéro : erreur ! Le cas limite encore", "Vaut 1", "Pas de problème"], a: 1, exp: "SI nb = 0, afficher « aucune donnée » AVANT de diviser." },
    { type: "qcm", q: "Ta trace révèle qu'une variable n'a pas la valeur attendue à la ligne 4. Que fais-tu ?", opts: ["Tu réécris tout", "Tu examines les lignes 1-4 : le bug est en amont de la première anomalie", "Tu changes le langage", "Tu ignores"], a: 1, exp: "La trace localise ; on remonte à la source, pas de panique." },
    { type: "qcm", q: "Ton découpage donne un bloc « gérer les réservations » que tu ne sais pas résumer en une phrase. Que fais-tu ?", opts: ["Tu le codes quand même", "Tu le re-découpes (raffinement, jour 22)", "Tu le supprimes", "Tu demandes un délai"], a: 1, exp: "Bloc flou = bloc trop gros. Découper encore." },
    { type: "qcm", q: "« Valider que l'âge saisi est entre 0 et 130, redemander sinon » : quel duo ?", opts: ["POUR + tableau", "RÉPÉTER…JUSQU'À + encadrement booléen (j11 + j8)", "Pile + file", "Récursivité + tri"], a: 1, exp: "RÉPÉTER Lire(age) JUSQU'À age >= 0 ET age <= 130." },
    { type: "qcm", q: "Pourquoi vérifier sur l'exemple de l'étape 2 plutôt que sur un nouvel exemple ?", opts: ["C'est interdit d'en changer", "On CONNAÎT déjà le résultat attendu : toute différence est un bug certain", "Les nouveaux exemples sont faux", "Aucune raison"], a: 1, exp: "L'exemple manuel sert de résultat de référence — puis on ajoute les cas limites." },
    { type: "qcm", q: "« Le chemin le plus court en explorant toutes les intersections, chaque intersection relançant l'exploration » : quel outil ?", opts: ["Un compteur", "La récursivité (structure d'exploration emboîtée, jour 27)", "Une moyenne", "Un accumulateur"], a: 1, exp: "L'exploration qui se relance elle-même = signature récursive." },
    { type: "vf", q: "Un algorithme livré sans avoir testé les cas limites est un algorithme non terminé.", a: true, exp: "La vérification fait PARTIE de la conception — c'est l'étape 6, pas une option." }
  ],
  final: {
    title: "Exercice final — La médaille du concours",
    intro: `<p>Applique la méthode complète à ce problème : « Au concours de mathématiques, on saisit les scores des candidats (fin de saisie : score = -1). Afficher le nombre de candidats, le score moyen, le meilleur score, et dire si AU MOINS UN candidat a fait un sans-faute (100). »</p>
<p>Exemple à la main : scores saisis 72, 100, 85, -1.</p>`,
    questions: [
      { type: "qcm", q: "Étape 1 — Les ENTRÉES et la SORTIE :", opts: ["Entrée : des scores jusqu'à -1 · Sorties : nombre, moyenne, max, booléen sans-faute", "Entrée : -1 · Sortie : 100", "Entrée : la moyenne · Sortie : les scores", "Rien à identifier"], a: 0, exp: "Toujours commencer par le contrat entrées/sorties." },
      { type: "qcm", q: "Étape 3/4 — Quels MOTIFS pour les 4 résultats demandés ?", opts: ["compteur, accumulateur, champion provisoire, drapeau", "quatre tris", "quatre récursions", "pile, file, tri, dicho"], a: 0, exp: "nombre → compteur · moyenne → accumulateur/compteur · meilleur → max · « au moins un » → drapeau." },
      { type: "qcm", q: "Quelle boucle pour la saisie « jusqu'à -1 » ?", opts: ["POUR i DE 1 A 100", "TANT QUE score ≠ -1 (avec un Lire avant la boucle et un à la fin)", "RÉPÉTER sans condition", "Pas de boucle"], a: 1, exp: "Nombre de candidats inconnu → TANT QUE, sentinelle -1." },
      { type: "input", q: "Étape 2 — Sur l'exemple (72, 100, 85), que doivent valoir nb et moyenne ? Donne la moyenne.", a: ["85.67", "85,67", "85.66"], ph: "nombre", exp: "nb = 3, somme = 257, moyenne ≈ 85,67. C'est ta référence de vérification." },
      { type: "qcm", q: "Étape 6 — Quel cas limite fait planter la version naïve ?", opts: ["Trois candidats", "AUCUN candidat (l'utilisateur tape -1 direct) : division par zéro sur la moyenne et max sans valeur", "Un score de 50", "Un score de 100"], a: 1, exp: "SI nb = 0 : afficher « aucun candidat » et ne PAS calculer moyenne/max." }
    ],
    solution: `<p>Solution modèle en pseudocode (chaque ligne est commentée après <code>//</code>) :</p>
<pre class="pseudo">ALGORITHME Concours                          // nom de l'algorithme
DEBUT                                          // début des instructions
    nb ← 0 ; somme ← 0 ; max ← -1 ; sansFaute ← FAUX   // on initialise les 4 outils (compteur, accumulateur, champion, drapeau)
    Écrire("Score ? (-1 pour finir)")          // on affiche la consigne à l'écran
    Lire(score)                                // ENTRÉE : on lit le PREMIER score (avant la boucle)
    TANT QUE score ≠ -1 FAIRE                  // on répète tant que l'utilisateur n'a pas tapé la sentinelle -1
        nb ← nb + 1                        // compteur : un candidat de plus
        somme ← somme + score              // accumulateur : on ajoute ce score au total
        SI score > max ALORS max ← score FINSI   // champion : si ce score bat le record, il devient le nouveau max
        SI score = 100 ALORS sansFaute ← VRAI FINSI  // drapeau : on mémorise qu'un sans-faute existe
        Lire(score)                        // on lit le score SUIVANT (sinon la boucle serait infinie)
    FINTANTQUE                                 // fin de la boucle : on en sort dès que score = -1
    SI nb = 0 ALORS                            // cas limite : aucun candidat n'a été saisi
        Écrire("Aucun candidat.")           // cas limite traité ! (on évite ainsi la division par zéro)
    SINON                                      // sinon, il y a au moins un candidat
        Écrire(nb, " candidats, moyenne ", somme / nb,   // on affiche le nombre et la moyenne (division sûre car nb ≠ 0)
               ", meilleur score ", max)                  // ... ainsi que le meilleur score
        SI sansFaute ALORS Écrire("Au moins un sans-faute !") FINSI   // si le drapeau est levé, on le signale
    FINSI                                      // fin du test nb = 0
FIN                                            // fin de l'algorithme</pre>
<p>Vérification sur l'exemple : nb=3 ✓, moyenne=85,67 ✓, max=100 ✓, sansFaute=VRAI ✓. Quatre motifs, une boucle, un cas limite : le mois entier dans 20 lignes. Demain : l'examen final !</p>`
  }
};
</script>
