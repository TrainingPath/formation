<script>
var DAY = {
  num: 30,
  title: "Résoudre un problème de A à Z",
  subtitle: "La méthode complète : de l'énoncé flou à l'algorithme vérifié.",
  theory: `
<h3>1. La méthode en 6 étapes (à graver)</h3>
<p>Depuis le jour 1, on a appris des <strong>outils</strong> un par un. Aujourd'hui, on apprend la <strong>méthode</strong> : la marche à suivre, du début à la fin, quand on nous pose un problème « tout neuf ». Une <strong>méthode</strong> est simplement une liste d'étapes qu'on suit toujours dans le même ordre, comme la procédure d'un pompier qui arrive sur un incendie : il ne réfléchit pas dans le désordre, il déroule. Voici la nôtre, en six étapes. Chaque ligne est commentée après le symbole <code>//</code> (qui introduit un <strong>commentaire</strong> : un texte destiné à l'humain, ignoré lors de l'exécution) :</p>
<pre class="pseudo">1. COMPRENDRE   : reformuler l'énoncé, identifier entrées/sorties   // étape 1 : que reçoit-on, que doit-on produire ?
2. EXEMPLIFIER  : résoudre UN exemple à la main, sur papier          // étape 2 : jouer soi-même le rôle de l'ordinateur
3. DÉCOUPER     : raffinements successifs (jour 22)                  // étape 3 : casser le gros problème en petits morceaux
4. OUTILLER     : quels motifs connus s'appliquent ?                 // étape 4 : reconnaître un problème déjà rencontré
                  (compteur ? max ? drapeau ? tri ? dichotomie ?)    // ... et piocher le bon outil dans la boîte
5. ÉCRIRE       : le pseudocode, bloc par bloc                       // étape 5 : traduire enfin la logique en instructions
6. VÉRIFIER     : trace sur l'exemple + CAS LIMITES                  // étape 6 : tester, surtout les cas piégeux</pre>
<p>Quelques mots à définir. L'<strong>énoncé</strong> est le texte du problème tel qu'on nous le donne (« calcule la moyenne de la classe… ») ; le <strong>reformuler</strong>, c'est le réécrire avec ses propres mots pour être sûr de l'avoir compris. Les <strong>entrées</strong> sont les données que l'algorithme reçoit (jour 1), les <strong>sorties</strong> le résultat qu'il produit. Un <strong>raffinement successif</strong> (jour 22) consiste à découper une tâche trop grosse en sous-tâches plus petites, encore et encore, jusqu'à ce que chaque morceau devienne évident — comme un plan de dissertation qu'on détaille en parties puis en paragraphes. Un <strong>motif</strong> est une solution-type déjà rencontrée qu'on réutilise (voir la boîte à outils plus bas). Enfin, un <strong>cas limite</strong> est une situation extrême ou inhabituelle qui met l'algorithme à l'épreuve (on y revient en section 4).</p>
<h3>2. L'étape 2 est magique</h3>
<p>Résoudre un exemple À LA MAIN révèle l'algorithme : observe TES propres gestes. Comment as-tu trouvé le max ? Tu as gardé « le plus grand vu jusqu'ici » en tête — c'est l'algorithme du jour 17 ! Ton cerveau EST un interprète d'algorithmes ; il suffit de l'écouter. (Un <strong>interprète</strong>, ici, désigne celui qui exécute les étapes une par une : quand tu suis une recette de cuisine, l'interprète, c'est toi.)</p>
<h3>3. Le catalogue de motifs du mois (ta boîte à outils)</h3>
<p>Un <strong>motif</strong> (en anglais <em>pattern</em>, « modèle ») est un problème-type revenu tout au long du mois, avec sa solution toute prête. Reconnaître le motif, c'est comme un mécanicien qui, au bruit du moteur, sait déjà quel outil sortir. Voici le tableau des correspondances « phrase de l'énoncé → outil à utiliser (et le jour où on l'a vu) » ; chaque ligne est commentée après <code>//</code> :</p>
<pre class="pseudo">« combien de… ? »            → compteur (j12)                        // ajouter 1 à une boîte chaque fois qu'une condition est vraie
« total / moyenne ? »        → accumulateur (j12)                    // une boîte qui additionne les valeurs au fur et à mesure
« le plus grand/petit ? »    → champion provisoire (j17)             // garder en mémoire le meilleur élément vu jusqu'ici
« existe-t-il… ? »           → drapeau / retour anticipé (j16, j21)  // un booléen VRAI/FAUX qui mémorise « je l'ai trouvé »
« où se trouve… ? »          → position + recherche (j16, j23)       // renvoyer l'indice (le numéro de la case) de l'élément trouvé
« dans l'ordre ? »           → tri (j24, j25)                        // ranger les éléments du plus petit au plus grand
« valider une saisie ? »     → boucle TANT QUE/RÉPÉTER (j9, j11)     // redemander une valeur tant que la réponse est incorrecte
« grille / paires ? »        → boucles imbriquées (j13, j18)         // une boucle placée à l'intérieur d'une autre boucle
« structure emboîtée ? »     → récursivité (j26, j27)                // un algorithme qui s'appelle lui-même sur un sous-problème
« qui sort en premier ? »    → pile / file (j29)                     // pile : le dernier arrivé sort ; file : le premier arrivé sort</pre>
<h3>4. Les cas limites : là où meurent les algorithmes</h3>
<p>Un <strong>cas limite</strong> est une entrée extrême ou inhabituelle (un tableau vide, une seule valeur, une valeur introuvable…) : ce sont les situations où un algorithme qui « marche en général » se casse la figure. Un algorithme qui marche « en général » n'est pas fini. Teste TOUJOURS :</p>
<ul>
<li><strong>vide</strong> : tableau de 0 élément, chaîne vide (il n'y a rien du tout à traiter)</li>
<li><strong>unité</strong> : un seul élément (le plus petit cas qui ne soit pas vide)</li>
<li><strong>extrêmes</strong> : tout égal, déjà trié, trié à l'envers, valeurs négatives, zéro</li>
<li><strong>absent</strong> : la valeur cherchée n'existe pas</li>
</ul>
<div class="warn">Le bug du débutant : tester uniquement le cas facile. Le réflexe du pro : attaquer son propre algorithme avec les cas vicieux AVANT qu'un utilisateur ne le fasse. (Un <strong>bug</strong> est une erreur cachée dans l'algorithme qui lui fait donner un mauvais résultat ou le fait planter.)</div>
<h3>5. Vérifier par la trace</h3>
<p>La <strong>trace</strong> (jour 2 !) reste l'arme absolue : dérouler l'algorithme ligne par ligne sur un petit exemple, en notant dans un tableau la valeur de chaque variable après chaque instruction (une colonne par variable). C'est exactement ce que ferait l'ordinateur, mais réalisé à la main pour vérifier. 90 % des bugs apparaissent à la trace.</p>
<div class="tip">Boucle vertueuse : Comprendre → Exemple → Découper → Outiller → Écrire → Vérifier… et si la vérification échoue, on remonte d'une étape. Jamais de panique : une étape à la fois.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la PREMIÈRE étape face à un problème ?", opts: ["Écrire du pseudocode", "Comprendre : reformuler, identifier entrées et sorties", "Choisir une boucle", "Déclarer des variables"], a: 1, exp: "Coder avant de comprendre = coder deux fois." },
    { type: "qcm", q: "À quoi sert de résoudre un exemple À LA MAIN ?", opts: ["À perdre du temps", "À observer ses propres gestes : ils RÉVÈLENT l'algorithme", "À éviter le pseudocode", "À obtenir le résultat sans écrire d'algorithme"], a: 1, exp: "Ton cerveau exécute déjà l'algorithme — écris ce qu'il fait." },
    { type: "qcm", q: "« Combien d'élèves ont plus de 15 de moyenne ? » Quel motif ?", opts: ["Accumulateur", "Compteur conditionnel", "Tri", "Pile"], a: 1, exp: "« Combien ? » → compteur (jour 12)." },
    { type: "qcm", q: "« Quel produit a le meilleur rapport qualité/prix ? » Quel motif ?", opts: ["Champion provisoire (max) sur la valeur qualite[i]/prix[i]", "File", "Drapeau", "Concaténation"], a: 0, exp: "« Le plus… » → max (jour 17), appliqué à une expression calculée." },
    { type: "qcm", q: "« Ce client existe-t-il dans le fichier ? » Quel motif ?", opts: ["Accumulateur", "Recherche avec drapeau ou retour anticipé", "Boucles imbriquées", "Moyenne"], a: 1, exp: "« Existe-t-il ? » → recherche (jour 16), dichotomie si trié (jour 23)." },
    { type: "qcm", q: "« Afficher le classement des joueurs » : quel prérequis ?", opts: ["Une pile", "Trier les scores (jour 24-25)", "Une factorielle", "Un drapeau"], a: 1, exp: "« Dans l'ordre » → tri." },
    { type: "qcm", q: "Quels sont les 4 cas limites incontournables ?", opts: ["Grand, petit, moyen, nul", "Vide, un seul élément, extrêmes (trié/inversé/égaux), valeur absente", "Positif, négatif", "Pair, impair"], a: 1, exp: "La check-list qui tue les bugs avant la mise en service." },
    { type: "qcm", q: "L'algorithme du max (jour 17) sur un tableau VIDE (n = 0) :", opts: ["Retourne 0", "Plante : max ← t[1] accède à une case inexistante — le cas limite l'attrape !", "Retourne -1", "Fonctionne"], a: 1, exp: "D'où l'intérêt du test « vide » : il faut traiter n = 0 à part." },
    { type: "qcm", q: "La moyenne (somme / nb) quand nb = 0 :", opts: ["Vaut 0", "Division par zéro : erreur ! Le cas limite encore", "Vaut 1", "Pas de problème"], a: 1, exp: "SI nb = 0, afficher « aucune donnée » AVANT de diviser." },
    { type: "qcm", q: "Ta trace révèle qu'une variable n'a pas la valeur attendue à la ligne 4. Que fais-tu ?", opts: ["Tu réécris tout", "Tu examines les lignes 1-4 : le bug est en amont de la première anomalie", "Tu changes le langage", "Tu ignores"], a: 1, exp: "La trace localise ; on remonte à la source, pas de panique." },
    { type: "qcm", q: "Ton découpage donne un bloc « gérer les réservations » que tu ne sais pas résumer en une phrase. Que fais-tu ?", opts: ["Tu le codes quand même", "Tu le re-découpes (raffinement, jour 22)", "Tu le supprimes", "Tu demandes un délai"], a: 1, exp: "Bloc flou = bloc trop gros. Découper encore." },
    { type: "qcm", q: "« Valider que l'âge saisi est entre 0 et 130, redemander sinon » : quel duo ?", opts: ["POUR + tableau", "RÉPÉTER…JUSQU'À + encadrement booléen (j11 + j8)", "Pile + file", "Récursivité + tri"], a: 1, exp: "RÉPÉTER Lire(age) JUSQU'À age >= 0 ET age <= 130." },
    { type: "qcm", q: "Pourquoi vérifier sur l'exemple de l'étape 2 plutôt que sur un nouvel exemple ?", opts: ["C'est interdit d'en changer", "On CONNAÎT déjà le résultat attendu : toute différence est un bug certain", "Les nouveaux exemples sont faux", "Aucune raison"], a: 1, exp: "L'exemple manuel sert de résultat de référence — puis on ajoute les cas limites." },
    { type: "qcm", q: "« Le chemin le plus court en explorant toutes les intersections, chaque intersection relançant l'exploration » : quel outil ?", opts: ["Un compteur", "La récursivité (structure d'exploration emboîtée, jour 27)", "Une moyenne", "Un accumulateur"], a: 1, exp: "L'exploration qui se relance elle-même = signature récursive." },
    { type: "vf", q: "Un algorithme livré sans avoir testé les cas limites est un algorithme non terminé.", a: true, exp: "La vérification fait PARTIE de la conception — c'est l'étape 6, pas une option." }
  ],
  final: {
    title: "Exercice final — La médaille du concours",
    intro: `<p>Applique la méthode complète à ce problème : « Au concours de mathématiques, on saisit les scores des candidats (fin de saisie : score = -1). Afficher le nombre de candidats, le score moyen, le meilleur score, et dire si AU MOINS UN candidat a fait un sans-faute (100). »</p>
<p>Exemple à la main : scores saisis 72, 100, 85, -1.</p>`,
    questions: [
      { type: "qcm", q: "Étape 1 — Les ENTRÉES et la SORTIE :", opts: ["Entrée : des scores jusqu'à -1 · Sorties : nombre, moyenne, max, booléen sans-faute", "Entrée : -1 · Sortie : 100", "Entrée : la moyenne · Sortie : les scores", "Rien à identifier"], a: 0, exp: "Toujours commencer par le contrat entrées/sorties." },
      { type: "qcm", q: "Étape 3/4 — Quels MOTIFS pour les 4 résultats demandés ?", opts: ["compteur, accumulateur, champion provisoire, drapeau", "quatre tris", "quatre récursions", "pile, file, tri, dicho"], a: 0, exp: "nombre → compteur · moyenne → accumulateur/compteur · meilleur → max · « au moins un » → drapeau." },
      { type: "qcm", q: "Quelle boucle pour la saisie « jusqu'à -1 » ?", opts: ["POUR i DE 1 A 100", "TANT QUE score ≠ -1 (avec un Lire avant la boucle et un à la fin)", "RÉPÉTER sans condition", "Pas de boucle"], a: 1, exp: "Nombre de candidats inconnu → TANT QUE, sentinelle -1." },
      { type: "input", q: "Étape 2 — Sur l'exemple (72, 100, 85), que doivent valoir nb et moyenne ? Donne la moyenne.", a: ["85.67", "85,67", "85.66"], ph: "nombre", exp: "nb = 3, somme = 257, moyenne ≈ 85,67. C'est ta référence de vérification." },
      { type: "qcm", q: "Étape 6 — Quel cas limite fait planter la version naïve ?", opts: ["Trois candidats", "AUCUN candidat (l'utilisateur tape -1 direct) : division par zéro sur la moyenne et max sans valeur", "Un score de 50", "Un score de 100"], a: 1, exp: "SI nb = 0 : afficher « aucun candidat » et ne PAS calculer moyenne/max." }
    ],
    solution: `<p>Solution modèle en pseudocode (chaque ligne est commentée après <code>//</code>) :</p>
<pre class="pseudo">ALGORITHME Concours                          // nom de l'algorithme
DEBUT                                          // début des instructions
    nb ← 0 ; somme ← 0 ; max ← -1 ; sansFaute ← FAUX   // on initialise les 4 outils (compteur, accumulateur, champion, drapeau)
    Écrire("Score ? (-1 pour finir)")          // on affiche la consigne à l'écran
    Lire(score)                                // ENTRÉE : on lit le PREMIER score (avant la boucle)
    TANT QUE score ≠ -1 FAIRE                  // on répète tant que l'utilisateur n'a pas tapé la sentinelle -1
        nb ← nb + 1                        // compteur : un candidat de plus
        somme ← somme + score              // accumulateur : on ajoute ce score au total
        SI score > max ALORS max ← score FINSI   // champion : si ce score bat le record, il devient le nouveau max
        SI score = 100 ALORS sansFaute ← VRAI FINSI  // drapeau : on mémorise qu'un sans-faute existe
        Lire(score)                        // on lit le score SUIVANT (sinon la boucle serait infinie)
    FINTANTQUE                                 // fin de la boucle : on en sort dès que score = -1
    SI nb = 0 ALORS                            // cas limite : aucun candidat n'a été saisi
        Écrire("Aucun candidat.")           // cas limite traité ! (on évite ainsi la division par zéro)
    SINON                                      // sinon, il y a au moins un candidat
        Écrire(nb, " candidats, moyenne ", somme / nb,   // on affiche le nombre et la moyenne (division sûre car nb ≠ 0)
               ", meilleur score ", max)                  // ... ainsi que le meilleur score
        SI sansFaute ALORS Écrire("Au moins un sans-faute !") FINSI   // si le drapeau est levé, on le signale
    FINSI                                      // fin du test nb = 0
FIN                                            // fin de l'algorithme</pre>
<p>Vérification sur l'exemple : nb=3 ✓, moyenne=85,67 ✓, max=100 ✓, sansFaute=VRAI ✓. Quatre motifs, une boucle, un cas limite : le mois entier dans 20 lignes. Demain : l'examen final !</p>`
  }
};
</script>

  placeholder: "Écris ton algorithme en pseudocode ici…",
  items: [

  { num: "30.1", titre: "Le relevé des bornes kilométriques", niveau: 1, domaine: "géographie",
    enonce: "Un service des routes relève l'altitude des bornes kilométriques d'un col, borne par borne, dans l'ordre de la montée puis de la descente. On lui demande de repérer le sommet du col : la borne à partir de laquelle l'altitude cesse de monter. Applique la méthode complète en six étapes, en <strong>rédigeant chacune</strong> avant d'écrire la moindre ligne d'algorithme : comprendre, exemplifier à la main, découper, outiller, écrire, vérifier. L'étape de vérification doit porter sur au moins trois cas limites que tu auras identifiés toi-même.",
    principe: "La méthode en six étapes se suit toujours dans le même ordre. <strong>Comprendre</strong> : reformuler, identifier ce qui entre et ce qui sort. <strong>Exemplifier</strong> : résoudre un cas à la main, sur papier. <strong>Découper</strong> : raffinements successifs. <strong>Outiller</strong> : reconnaître les motifs connus applicables. <strong>Écrire</strong> : le pseudocode, bloc par bloc. <strong>Vérifier</strong> : dérouler sur l'exemple, puis sur les cas limites.",
    remarque: "L'étape 2 — résoudre un exemple à la main — est celle qu'on saute le plus volontiers, et c'est la plus rentable. Elle prend deux minutes, et c'est là qu'on découvre que l'énoncé ne dit pas ce qu'on croyait : ici, par exemple, qu'un col peut avoir deux bornes à la même altitude au sommet, et que l'énoncé ne dit pas laquelle est « le sommet ».",
    indices: [
      "Ne cherche pas encore l'algorithme. Prends dix altitudes sur papier, entoure celle que tu appellerais le sommet, et demande-toi comment tu l'as trouvée — c'est cette réponse-là qui deviendra l'algorithme, pas l'inverse.",
      "Le plan : l'entrée est une suite d'altitudes, la sortie est un numéro de borne et une altitude. En découpant : lire les altitudes, parcourir en cherchant le point de retournement, afficher. En outillant : c'est une recherche de maximum du jour 17, avec son couple valeur-position.",
      "Pour l'étape d'écriture, le motif est connu : un couple valeur-position initialisé sur la première borne, un parcours à partir de la deuxième, une comparaison stricte qui met à jour les deux ensemble.",

      "Ta copie ressemble à ceci : <br>les six étapes rédigées, numérotées, avant tout code<br>un couple valeur-position initialisé sur la première case<br>un parcours à partir de la deuxième<br>et, sous le code, le déroulé écrit des trois cas limites."
    ],
    solution: "/* ---------------------------------------------------------------\n   1. COMPRENDRE\n      Entree : n altitudes, dans l'ordre des bornes.\n      Sortie : le numero de la borne la plus haute et son altitude.\n      Reformulation : \"le sommet du col\" = la borne d'altitude maximale.\n\n   2. EXEMPLIFIER (a la main, sur papier)\n      420 · 505 · 610 · 688 · 688 · 640 · 512\n      J'entoure la borne 4 (688 m). Comment l'ai-je trouvee ? En suivant les\n      altitudes et en retenant la plus haute vue jusque-la.\n      DECOUVERTE : les bornes 4 et 5 ont la MEME altitude. L'enonce ne dit pas\n      laquelle est \"le sommet\". Je decide : la PREMIERE atteinte.\n\n   3. DECOUPER\n      3.1 lire les n altitudes\n      3.2 chercher la plus haute et son rang\n      3.3 afficher\n\n   4. OUTILLER\n      L'etape 3.2 est le motif du MAXIMUM AVEC POSITION (jour 17) :\n      couple valeur-rang, initialise sur la premiere case, comparaison\n      STRICTE pour garder le premier des ex aequo (jour 24).\n\n   5. ECRIRE — ci-dessous.\n\n   6. VERIFIER — deroules en fin de fichier.\n   --------------------------------------------------------------- */\n\nAlgorithme SommetDuCol\nVar\n    altitude : TABLEAU[1..200] D'ENTIERS\n    n, i, sommet, rangSommet : ENTIER\nDebut\n    Ecrire(\"Nombre de bornes relevees ?\")\n    Lire(n)\n\n    SI n < 1 ALORS\n        Ecrire(\"Aucune borne relevee : pas de sommet\")\n    SINON\n        POUR i DE 1 A n FAIRE\n            Ecrire(\"Altitude de la borne \", i, \" (m) ?\")\n            Lire(altitude[i])\n        FINPOUR\n\n        /* le couple se prend sur la PREMIERE case, jamais sur zero :\n           un col peut passer sous le niveau de la mer (jour 17) */\n        sommet <- altitude[1]\n        rangSommet <- 1\n\n        POUR i DE 2 A n FAIRE\n            /* comparaison STRICTE : a egalite, on garde le premier atteint,\n              conformement a la decision prise a l'etape 2 */\n            SI altitude[i] > sommet ALORS\n                sommet <- altitude[i]\n                rangSommet <- i\n            FINSI\n        FINPOUR\n\n        Ecrire(\"Sommet du col : borne \", rangSommet, \" a \", sommet, \" m\")\n    FINSI\nFin\n\n/* ---------------------------------------------------------------\n   6. VERIFIER — trois cas limites deroules\n\n   a) UNE SEULE borne (n = 1)\n      Le couple est initialise sur elle, la boucle de 2 a 1 ne fait aucun\n      tour, on annonce la borne 1. Correct : une route d'une borne a bien\n      un point le plus haut, c'est elle.\n\n   b) DEUX bornes a la meme altitude maximale (688 et 688)\n      La comparaison stricte echoue sur la seconde, on garde la premiere.\n      Conforme a la decision de l'etape 2 — et il fallait DECIDER, car\n      l'enonce ne tranchait pas.\n\n   c) Une route qui MONTE SANS REDESCENDRE\n      Le maximum est la derniere borne. L'algorithme la designe correctement.\n      Mais l'enonce parlait d'un \"col\", ce qui suppose une redescente :\n      l'algorithme repond a la question posee, pas a la question voulue.\n      A signaler au service des routes plutot qu'a corriger en silence.\n   --------------------------------------------------------------- */",
    pourquoi: "L'étape 2 a modifié l'étape 5. En déroulant l'exemple à la main, on découvre deux bornes à la même altitude — un cas que l'énoncé ne tranche pas — et cette découverte impose une décision sur la comparaison, stricte ou large. Sans l'exemple, on aurait écrit l'une des deux au hasard et l'on n'aurait jamais su qu'il y avait un choix. C'est le rendement de cette étape : elle ne sert pas à vérifier, elle sert à trouver les questions.",
    checklist: [
      "As-tu rédigé les six étapes, ou seulement écrit l'algorithme ?",
      "Ton étape 2 a-t-elle été faite sur papier, avec de vraies valeurs ? Qu'y as-tu découvert ?",
      "Ton couple maximum est-il initialisé sur la première case ?",
      "As-tu déroulé au moins trois cas limites, et décidé pour chacun si la réponse convient ?",
      "Le cas d'une route qui ne redescend jamais : ton algorithme est-il faux, ou l'énoncé incomplet ?"
    ],
    note: "Refais les six étapes pour une variante : « trouver la borne où la pente est la plus forte ». Laquelle des six étapes change le plus ?" },

  { num: "30.2", titre: "Le réassort de l'épicerie", niveau: 2, domaine: "commerce de quartier",
    enonce: "L'épicier arrive avec un problème formulé comme il l'a en tête : « J'ai une trentaine de références, je note chaque soir combien il m'en reste et combien j'en ai vendu dans la journée. Je voudrais savoir lesquelles commander demain, en priorité celles qui vont manquer le plus vite, sans commander celles que je ne vends plus, et je veux voir combien ça va me coûter. » Aucune de ces phrases n'est un algorithme. Traite le problème par la méthode en six étapes, en <strong>rédigeant chacune</strong>, et en signalant explicitement les questions que l'énoncé ne tranche pas.",

    sousQuestions: [

    reflexion: "Les questions que l'énoncé ne tranche pas sont le vrai sujet de cette leçon. Pour chacune de celles que tu as relevées, dis quelle décision tu as prise et sur quoi tu t'es appuyé — et distingue celles que tu pouvais trancher seul de celles qu'il aurait fallu poser à l'épicier. Puis : une référence dont la vente quotidienne est nulle fait échouer la division. Tu peux la traiter comme une autonomie infinie ou l'écarter d'emblée. Les deux choix donnent-ils le même classement final, et lequel dit le mieux ce que l'épicier veut savoir ?",

    ],
    solution: "/* ---------------------------------------------------------------\n   1. COMPRENDRE\n      Entrees : par reference — un nom, un stock restant, une vente\n                quotidienne, un prix unitaire.\n      Sortie : la liste des references a commander, de la plus urgente a la\n               moins urgente, et le cout total de la commande.\n\n   2. EXEMPLIFIER (5 references, a la main)\n      Cafe    stock 12  vend 4/j  -> autonomie 3 jours\n      Farine  stock 40  vend 2/j  -> autonomie 20 jours\n      Cirage  stock  8  vend 0/j  -> ne se vend plus\n      Lait    stock  6  vend 6/j  -> autonomie 1 jour\n      Sel     stock 25  vend 5/j  -> autonomie 5 jours\n      Classement : Lait, Cafe, Sel, Farine. Cirage ecarte.\n\n      QUESTIONS QUE L'ENONCE NE TRANCHE PAS :\n      (i)   \"que je ne vends plus\" : vente nulle, ou vente tres faible ?\n            -> DECIDE SEUL : vente strictement nulle. C'est le seul sens\n               qui ne demande pas de choisir un seuil arbitraire.\n      (ii)  combien commander de chaque reference ?\n            -> A DEMANDER A L'EPICIER. Je retiens : de quoi tenir 15 jours.\n      (iii) faut-il commander celles qui ont encore 20 jours d'autonomie ?\n            -> A DEMANDER A L'EPICIER. Je retiens : oui, mais en dernier.\n\n   3. DECOUPER\n      3.1 lire les references\n      3.2 calculer l'autonomie de chacune, ecarter les invendues\n      3.3 classer par autonomie croissante\n      3.4 chiffrer et afficher\n\n   4. OUTILLER\n      3.2 division simple + drapeau d'exclusion\n      3.3 TRI (jour 24) sur QUATRE tableaux paralleles qui se deplacent\n          ensemble — le piege du jour 24.3\n      3.4 ACCUMULATEUR (jour 12)\n   --------------------------------------------------------------- */\n\nPROCEDURE permuterRef(nom : TABLEAU DE CHAINES, auto : TABLEAU DE REELS,\n                      manque : TABLEAU D'ENTIERS, prix : TABLEAU DE REELS,\n                      a : ENTIER, b : ENTIER)\nVar\n    tc : CHAINE\n    tr : REEL\n    te : ENTIER\nDEBUT\n    tc <- nom[a]    : nom[a] <- nom[b]       : nom[b] <- tc\n    tr <- auto[a]   : auto[a] <- auto[b]     : auto[b] <- tr\n    te <- manque[a] : manque[a] <- manque[b] : manque[b] <- te\n    tr <- prix[a]   : prix[a] <- prix[b]     : prix[b] <- tr\nFIN\n\nAlgorithme ReassortEpicerie\nConst\n    COUVERTURE = 15           /* jours de stock vises — decision (ii) */\nVar\n    nom : TABLEAU[1..30] DE CHAINES\n    auto : TABLEAU[1..30] DE REELS\n    manque : TABLEAU[1..30] D'ENTIERS\n    prix : TABLEAU[1..30] DE REELS\n    n, i, k, retenues, stock, vente : ENTIER\n    prixUnit, cout : REEL\n    permute : BOOLEEN\nDebut\n    Ecrire(\"Nombre de references ?\")\n    Lire(n)\n\n    retenues <- 0\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"Nom de la reference \", i, \" ?\")\n        Lire(nom[retenues + 1])\n        Ecrire(\"Stock restant ?\")\n        Lire(stock)\n        Ecrire(\"Vente quotidienne ?\")\n        Lire(vente)\n        Ecrire(\"Prix unitaire ?\")\n        Lire(prixUnit)\n\n        /* decision (i) : vente strictement nulle = reference ecartee.\n           C'est aussi ce qui evite la division par zero — le sens et la\n           technique tombent d'accord, ce qui est bon signe. */\n        SI vente > 0 ALORS\n            retenues <- retenues + 1\n            auto[retenues] <- stock / vente\n            manque[retenues] <- COUVERTURE * vente - stock\n            SI manque[retenues] < 0 ALORS\n                manque[retenues] <- 0\n            FINSI\n            prix[retenues] <- prixUnit\n        SINON\n            Ecrire(\"  \", nom[retenues + 1], \" ecartee : plus de vente\")\n        FINSI\n    FINPOUR\n\n    SI retenues = 0 ALORS\n        Ecrire(\"Aucune reference a commander\")\n    SINON\n        /* tri croissant sur l'autonomie : les QUATRE tableaux se deplacent\n           ensemble, faute de quoi les prix seraient attribues aux mauvaises\n           references (jour 24.3) */\n        k <- retenues - 1\n        permute <- VRAI\n        TANT QUE permute ET k > 0 FAIRE\n            permute <- FAUX\n            POUR i DE 1 A k FAIRE\n                SI auto[i] > auto[i + 1] ALORS\n                    permuterRef(nom, auto, manque, prix, i, i + 1)\n                    permute <- VRAI\n                FINSI\n            FINPOUR\n            k <- k - 1\n        FINTANTQUE\n\n        cout <- 0\n        Ecrire(\"--- Commande, de la plus urgente a la moins urgente ---\")\n        POUR i DE 1 A retenues FAIRE\n            cout <- cout + manque[i] * prix[i]\n            Ecrire(\"  \", nom[i], \" — \", Arrondi(auto[i], 1),\n                   \" jour(s) — commander \", manque[i], \" unite(s)\")\n        FINPOUR\n        Ecrire(\"Cout total : \", Arrondi(cout, 2), \" EUR\")\n    FINSI\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Les trois questions non tranchées, et ce que j'en ai fait.</strong> La première — que signifie « que je ne vends plus » — je pouvais la trancher seul, et je l'ai tranchée par « vente strictement nulle ». Non par facilité, mais parce que toute autre interprétation exige de choisir un seuil — moins de une vente par jour ? par semaine ? — et qu'inventer un seuil à la place du commerçant, c'est prendre une décision commerciale sans mandat. Le sens et la technique tombent d'ailleurs d'accord, puisque c'est exactement le cas qui ferait échouer la division : quand la contrainte technique et la règle métier désignent le même cas, c'est généralement bon signe. La deuxième — combien commander de chaque référence — je ne pouvais <strong>pas</strong> la trancher seul : quinze jours de couverture est un chiffre que j'ai inventé, et il dépend du délai de livraison, de la place en réserve, de la trésorerie. Je l'ai posé en constante nommée et signalé comme une décision de l'épicier, ce qui est le minimum : un nombre arbitraire enfoui dans le code est une décision prise en cachette. La troisième — faut-il commander ce qui a vingt jours d'autonomie — relève aussi de l'épicier, et mon algorithme la contourne : il commande tout, mais le classement met ces références en dernier, et la colonne « unités à commander » vaut zéro pour celles qui sont déjà couvertes. C'est un compromis honnête, qui laisse la décision visible au lieu de la trancher. <strong>La vente nulle : deux traitements, deux classements.</strong> Les traiter comme une autonomie infinie les placerait <em>tout à la fin</em> du classement, avec zéro unité à commander — le résultat pratique serait le même, puisqu'on ne commanderait rien. Les écarter d'emblée les fait <em>disparaître</em> de la liste. Le classement diffère donc, mais pas la commande. Ce qui dit le mieux ce que l'épicier veut savoir est l'écart : il a demandé de ne pas commander ce qu'il ne vend plus, ce qui signifie qu'il ne veut pas les voir — une liste de commande où figurent trente lignes dont vingt à zéro unité est une liste qu'on ne lit plus. Mais l'affichage nominatif de chaque référence écartée, que j'ai conservé, répond à un autre besoin qu'il n'a pas formulé : savoir <em>lesquelles</em> ne se vendent plus est une information commerciale précieuse — ce sont les références à déréférencer. La bonne réponse est donc : écarter de la commande, mais lister à part." }
    ],
    pourquoi: "Les références écartées sont annoncées nominativement au lieu d'être simplement omises. L'énoncé ne le demandait pas — l'épicier voulait juste ne pas les commander. Mais une information qu'un algorithme calcule et jette est une information perdue, et celle-ci vaut d'être dite : une référence qui ne se vend plus du tout occupe de la place et immobilise de l'argent. Signaler ce qu'on écarte est une règle générale, et le CHANGELOG de ce chantier la formule ainsi : une exclusion silencieuse se lit comme une absence de problème.",
    checklist: [

    ],
    note: "Change la couverture de 15 à 7 jours : le classement change-t-il ? Et le coût ? L'un des deux ne bouge pas — lequel ?" },

  { num: "30.3", titre: "La file du guichet — 3 / 4", niveau: 3, domaine: "guichet et services",

    hier: "jour29.html",
    enonce: "Reprends le guichet. La direction arrive avec une demande neuve, formulée en une phrase : « Je veux savoir si trois guichets suffisent, et sinon combien il en faut. » Rien d'autre. C'est un problème qu'on n'a jamais traité, dont l'énoncé ne dit ni ce qu'on entend par « suffire », ni quelles données sont disponibles, ni sous quelle forme rendre la réponse. Applique la méthode complète en six étapes, en rédigeant chacune — et en consacrant à l'étape 1 le soin qu'elle mérite : c'est elle qui décidera si tu réponds à la bonne question.",
    principe: "Un guichet qui traite un usager en <em>d</em> minutes en sert <code>60 / d</code> par heure. Avec <em>g</em> guichets ouverts, la capacité horaire vaut <code>g × 60 / d</code>. Si les usagers arrivent au rythme de <em>a</em> par heure, le service « suffit » lorsque la capacité atteint le flux d'arrivée. Sur des dossiers de 12 minutes et 20 arrivées par heure : un guichet sert 5 usagers par heure, il en faut donc <strong>quatre</strong>, et trois ne suffisent pas.",
    sousQuestions: [
      { ref: "a", texte: "Étape 1 : reformule la demande de la direction en une question à laquelle un algorithme peut répondre. Écris explicitement les trois choses que la phrase ne dit pas et que tu dois décider ou demander." },
      { ref: "b", texte: "Étape 2 : résous un cas à la main, avec des chiffres que tu choisis. Étape 3 : découpe. Étape 4 : nomme les motifs applicables — il y en a moins qu'on ne croit, et c'est instructif." },
      { ref: "c", texte: "Étape 5 : écris l'algorithme. Il lit le flux d'arrivée, la durée moyenne d'un dossier et le nombre de guichets envisagé, dit si cela suffit, et donne le nombre minimal nécessaire." },
      { ref: "d", texte: "Étape 6 : vérifie sur ton exemple, puis sur les cas limites — flux nul, durée nulle, capacité exactement égale au flux. Le troisième est le plus intéressant." }
    ],
    reflexion: "Ta réponse suppose que les usagers arrivent régulièrement, ce qui est faux : ils arrivent par vagues, et une moyenne horaire ne dit rien des dix minutes où trente personnes se présentent ensemble. Explique en quoi cela rend ta réponse insuffisante, et dis ce qu'il faudrait mesurer en plus. Puis : la direction a demandé « si trois guichets suffisent ». Ton algorithme répond oui ou non. Est-ce vraiment la réponse qu'elle attend, ou faudrait-il lui rendre autre chose ?",
    indices: [
      "L'étape 1 est ici les trois quarts du travail. Écris la phrase de la direction, puis souligne chaque mot dont tu ne connais pas la définition précise : « suffire », « il en faut », et même « guichet ». Le reste est de l'arithmétique.",
      "Le plan, une fois la question posée : lire le flux d'arrivée, la durée moyenne d'un dossier, le nombre de guichets envisagé. Calculer la capacité horaire. Comparer. Calculer le nombre minimal par une division arrondie vers le haut.",
      "En outillant, la moisson est maigre : aucune des structures du mois ne sert ici. Il ne reste qu'une division, une comparaison et un arrondi — celui de la billetterie du jour 23. Quand la boîte à outils reste presque fermée, c'est que l'effort était ailleurs, et l'étape 1 te dira où.",
      "Le point délicat est l'arrondi. Le nombre de guichets nécessaires est le flux divisé par la capacité d'un guichet, et ce quotient tombe rarement juste. Demande-toi ce que signifierait un résultat de 3,4 guichets, puis dans quel sens il faut le ramener à un entier pour que le service tienne — les deux sens ne se valent pas, et l'un d'eux laisse le guichet en dessous du besoin.",
      "Ta copie ressemble à ceci : <br>l'étape 1 longuement rédigée, avec la liste des non-dits<br>quelques lectures, une division, une comparaison<br>un arrondi vers le haut pour le nombre minimal<br>et le déroulé des trois cas limites, dont un qui mérite discussion."
    ],
    solution: "/* ---------------------------------------------------------------\n   1. COMPRENDRE — l'etape qui fait les trois quarts du travail.\n\n      Phrase de la direction : \"est-ce que trois guichets suffisent, et\n      sinon combien en faut-il ?\"\n\n      CE QU'ELLE NE DIT PAS :\n      (i)   Que veut dire SUFFIRE ? Servir tout le monde avant la fermeture ?\n            Ne jamais depasser 20 minutes d'attente ? Ne jamais refuser\n            personne a l'entree ?\n            -> A DEMANDER. Je retiens : la capacite horaire doit au moins\n               egaler le flux d'arrivee, sinon la file grossit sans fin.\n      (ii)  Quelles donnees a-t-on ? Un flux moyen ? Un releve minute par\n            minute ? Rien ?\n            -> A DEMANDER. Je retiens : un flux moyen par heure et une duree\n               moyenne de dossier, les deux seules choses qu'un guichet\n               mesure sans equipement.\n      (iii) Un guichet est-il ouvert en continu ? Pauses, absences ?\n            -> DECIDE SEUL : ouverture continue. Toute autre hypothese\n               demanderait des donnees qu'on n'a pas.\n\n   2. EXEMPLIFIER (a la main)\n      20 usagers/heure, dossiers de 12 minutes.\n      Un guichet sert 60/12 = 5 usagers par heure.\n      Trois guichets servent 15 usagers par heure. 15 < 20 : NON, ca ne\n      suffit pas. Il en faut 20/5 = 4.\n\n   3. DECOUPER\n      3.1 lire flux, duree, nombre envisage\n      3.2 calculer la capacite d'un guichet, puis celle du groupe\n      3.3 comparer et conclure\n      3.4 calculer le minimum necessaire\n\n   4. OUTILLER\n      Etonnamment peu de choses : ni tableau, ni tri, ni recherche. Une\n      division, une comparaison, et un ARRONDI VERS LE HAUT (jour 23).\n      C'est le signe que la difficulte n'etait pas dans l'algorithme.\n   --------------------------------------------------------------- */\n\nAlgorithme DimensionnementDuGuichet\nVar\n    flux, guichetsEnvisages, minimum : ENTIER\n    duree, parGuichet, capacite : REEL\nDebut\n    Ecrire(\"Usagers par heure ?\")\n    Lire(flux)\n    Ecrire(\"Duree moyenne d'un dossier (min) ?\")\n    Lire(duree)\n    Ecrire(\"Nombre de guichets envisages ?\")\n    Lire(guichetsEnvisages)\n\n    SI duree <= 0 ALORS\n        Ecrire(\"Une duree nulle n'a pas de sens : un guichet servirait une\")\n        Ecrire(\"infinite d'usagers. Verifie la mesure.\")\n    SINON SI flux <= 0 ALORS\n        Ecrire(\"Aucun usager attendu : zero guichet suffit\")\n    SINON\n        parGuichet <- 60 / duree\n        capacite <- guichetsEnvisages * parGuichet\n\n        Ecrire(\"Un guichet sert \", Arrondi(parGuichet, 1), \" usager(s)/h\")\n        Ecrire(guichetsEnvisages, \" guichets servent \",\n               Arrondi(capacite, 1), \" usager(s)/h\")\n\n        SI capacite >= flux ALORS\n            Ecrire(\"OUI, \", guichetsEnvisages, \" guichets suffisent\")\n        SINON\n            Ecrire(\"NON, la file grossira de \",\n                   Arrondi(flux - capacite, 1), \" personne(s) par heure\")\n        FINSI\n\n        /* arrondi VERS LE HAUT : trois guichets et demi n'existent pas, et\n           arrondir au plus proche laisserait le service en sous-capacite\n           une fois sur deux (jour 23) */\n        minimum <- ArrondiSup(flux / parGuichet)\n        Ecrire(\"Minimum necessaire : \", minimum, \" guichet(s)\")\n    FINSI\nFin\n\n/* ---------------------------------------------------------------\n   6. VERIFIER\n   a) flux nul : zero guichet suffit. Traite avant toute division.\n   b) duree nulle : la division 60/duree echoue. Traite en premier, avec un\n      message qui met en cause la MESURE et non l'algorithme.\n   c) capacite EXACTEMENT egale au flux : mon test repond OUI. C'est\n      arithmetiquement correct et pratiquement faux — un service dimensionne\n      au plus juste n'absorbe aucune variation, et la moindre irregularite\n      d'arrivee fait grossir la file sans qu'elle puisse jamais se resorber.\n      Voir la reflexion.\n   --------------------------------------------------------------- */",
    reponses: [
      { ref: "Réflexion", texte: "<strong>L'hypothèse de régularité est le point faible.</strong> Ma réponse compare deux moyennes horaires, ce qui suppose implicitement que les usagers se présentent à intervalles réguliers — un toutes les trois minutes pour vingt par heure. La réalité est tout autre : il y a une vague à l'ouverture, une à la pause de midi, et de longues plages vides. Sur une moyenne de vingt par heure, on peut parfaitement recevoir trente personnes en dix minutes et rien pendant quarante. Or une file qui a pris du retard pendant une vague ne le rattrape que si la capacité <em>dépasse</em> le flux moyen — à capacité exactement égale, le retard pris est définitif. C'est exactement le cas limite c) de mon étape 6 : arithmétiquement le service suffit, pratiquement il ne se résorbe jamais. Ce qu'il faudrait mesurer en plus : la <strong>distribution</strong> des arrivées — le flux par tranche de quinze minutes plutôt que par heure — et la <strong>variabilité</strong> des durées de dossier, car une moyenne de douze minutes peut recouvrir des dossiers de trois minutes et d'une heure. Avec ces deux relevés, on ne calcule plus une capacité : on simule la journée minute par minute, et l'on regarde la longueur maximale de la file. C'est un algorithme d'un tout autre genre, et c'est ce qu'un vrai service de dimensionnement fait. <strong>La réponse attendue par la direction n'est pas oui ou non.</strong> Elle a posé une question fermée, mais ce qu'elle veut est une décision : ouvrir un quatrième guichet coûte un poste, et elle veut savoir si ça vaut la peine. Un « non » sec ne l'aide pas. Ce qu'il faudrait lui rendre, c'est un petit tableau : pour trois, quatre et cinq guichets, la capacité, le nombre de personnes non servies par heure, et l'attente moyenne qui en découle. Elle pourrait alors arbitrer entre le coût d'un poste et le nombre d'usagers qu'elle accepte de faire attendre — ce qui est une décision politique, pas algorithmique. C'est le même constat qu'au jour 22 avec le cahier des charges de l'épicier : la question posée n'est presque jamais la question utile, et l'étape 1 sert précisément à s'en apercevoir avant d'avoir écrit trois cents lignes." }
