  title: "La récursivité : introduction",
  subtitle: "Une fonction qui s'appelle elle-même.",
  theory: `
<h3>1. L'idée vertigineuse</h3>
<p>Petit rappel avant de commencer : une <strong>fonction</strong> est une <strong>mini-machine</strong> à laquelle on donne une ou plusieurs valeurs (les <strong>entrées</strong>, aussi appelées <strong>paramètres</strong>) et qui, en échange, rend un résultat. Comme une machine à café : on met une capsule (l'entrée), on obtient un café (la sortie). <strong>Appeler</strong> une fonction, c'est simplement lui demander de travailler en lui donnant ses entrées (par exemple <code>fact(4)</code> = « fais tourner la machine <code>fact</code> avec l'entrée 4 »).</p>
<p>Nouveauté du jour : une fonction peut <strong>s'appeler elle-même</strong>. C'est la <strong>récursivité</strong> (du latin <em>recurrere</em>, « revenir en arrière ») : résoudre un problème en le ramenant à une version PLUS PETITE de lui-même, puis à une version encore plus petite, jusqu'à un cas si simple qu'on sait répondre du tac au tac.</p>
<p>Image : des <strong>poupées russes</strong> (ces poupées en bois qui s'emboîtent l'une dans l'autre). Pour ouvrir toutes les poupées : ouvrir la première, puis… ouvrir toutes les poupées restantes (le même problème, en plus petit). Autre image : deux miroirs face à face qui se renvoient l'image à l'infini — sauf qu'en informatique, on veut que ça s'arrête un jour !</p>
<h3>2. Les deux ingrédients OBLIGATOIRES</h3>
<p>Une récursion qui fonctionne a TOUJOURS deux morceaux. Si l'un manque, tout s'effondre :</p>
<ul>
<li>Le <strong>cas de base</strong> : le cas si simple qu'on répond directement, sans se rappeler. C'est le frein — comme la marche du bas d'un escalier : arrivé là, on ne descend plus.</li>
<li>Le <strong>cas récursif</strong> : on se rappelle soi-même sur un problème <strong>strictement plus petit</strong>. C'est le moteur — c'est lui qui fait avancer vers le cas de base, une marche à la fois.</li>
</ul>
<p>Voici un premier exemple : un compte à rebours de fusée. On lit chaque ligne, commentée après le symbole <code>//</code> (qui introduit un commentaire, un texte pour l'humain ignoré par l'ordinateur) :</p>
<pre class="pseudo">FONCTION compteARebours(n)          // on définit une fonction nommée compteARebours ; n est son entrée (un nombre)
DEBUT                               // début du corps de la fonction (la liste des étapes)
    SI n = 0 ALORS                  // CAS DE BASE (le frein) : si n est arrivé à 0
        Écrire("Décollage !")       // on affiche le message final, SANS se rappeler → la cascade s'arrête ici
    SINON                           // CAS RÉCURSIF (le moteur) : tant que n n'est pas encore 0
        Écrire(n)                   // on affiche la valeur actuelle de n
        compteARebours(n - 1)       // la fonction S'APPELLE elle-même sur n - 1 : le même problème, en plus petit !
    FINSI                           // fin du choix SI / SINON
FIN                                 // fin de la fonction
compteARebours(3)   →  3  2  1  Décollage !   // exemple : l'appel de départ déclenche toute la cascade 3, 2, 1, décollage</pre>
<div class="warn">Sans cas de base, ou si le problème ne rétrécit pas : <strong>récursion infinie</strong> (les appels s'enchaînent sans jamais s'arrêter et le programme s'effondre). C'est la version récursive de la boucle infinie du jour 9. Pour éviter ça, vérifie toujours deux choses : (1) il existe un cas de base, et (2) chaque appel se rapproche vraiment de ce cas de base.</div>
<h3>3. La factorielle : le classique absolu</h3>
<p>La <strong>factorielle</strong> d'un nombre <code>n</code>, notée <code>n!</code> (le point d'exclamation se lit « factorielle »), est le produit de tous les entiers de 1 à n : <code>n! = n × (n−1) × … × 2 × 1</code> (le symbole <code>×</code> veut dire « multiplié par »). Par exemple <code>4! = 4 × 3 × 2 × 1 = 24</code>. On convient aussi que <code>0! = 1</code>.</p>
<p>Observation clé : à l'intérieur de <code>n!</code> se cache <code>(n−1)!</code>. En effet <strong>n! = n × (n−1)!</strong> — la définition s'appelle elle-même ! C'est exactement ce dont la récursivité a besoin.</p>
<pre class="pseudo">FONCTION fact(n) : ENTIER           // fonction fact : prend n en entrée et RENVOIE un ENTIER (le résultat du calcul)
DEBUT                               // début du corps de la fonction
    SI n <= 1 ALORS                 // CAS DE BASE : si n vaut 0 ou 1 (<= se lit « inférieur ou égal à »)
        RETOURNER 1                 // on renvoie 1 tout de suite (car 0! = 1 et 1! = 1), sans appel récursif
    SINON                           // SINON, n vaut 2 ou plus
        RETOURNER n * fact(n - 1)   // CAS RÉCURSIF : n multiplié par le résultat de fact appliqué à n - 1
    FINSI                           // fin du choix SI / SINON
FIN                                 // fin de la fonction (RETOURNER envoie le résultat à qui a appelé fact)</pre>
<h3>4. Dérouler un appel : la descente et la remontée</h3>
<p>Pour vraiment comprendre, on <strong>déroule</strong> l'appel à la main, comme on ferait une trace (jour 2). Un appel récursif se lit en deux temps : la <strong>descente</strong> (on empile les appels, du plus grand au cas de base) puis la <strong>remontée</strong> (les résultats reviennent et se combinent). « Empiler » signifie mettre les appels en attente les uns par-dessus les autres, comme une pile d'assiettes : le dernier posé est le premier repris.</p>
<pre class="pseudo">fact(4)                            // on veut calculer fact(4)
= 4 * fact(3)              // descente : on met 4 de côté ; il faut d'abord connaître fact(3)
= 4 * (3 * fact(2))                // fact(3) = 3 * fact(2) : on descend encore d'un cran
= 4 * (3 * (2 * fact(1)))          // fact(2) = 2 * fact(1) : on descend jusqu'au bord du cas de base
= 4 * (3 * (2 * 1))        // fact(1) atteint le CAS DE BASE et renvoie 1 : la descente s'arrête
= 4 * (3 * 2)              // remontée : 2 * 1 = 2, le résultat commence à remonter
= 4 * 6                            // remontée : 3 * 2 = 6
= 24                               // remontée finale : 4 * 6 = 24 → c'est le résultat de fact(4)</pre>
<div class="tip">Pour comprendre une récursion, écris TOUJOURS ce déroulé descente/remontée. Après quelques traces, ton cerveau fera confiance à la « magie » : si fact(n−1) est correct, alors n × fact(n−1) l'est aussi. On appelle ça l'<strong>acte de foi récursif</strong> — on suppose que l'appel plus petit fait bien son travail, et on se contente de combiner son résultat.</div>
<h3>5. Récursif ou itératif ?</h3>
<p>Deux mots à distinguer. <strong>Itératif</strong> veut dire « avec une boucle » (POUR, TANT QUE… : on répète des étapes, comme aux jours 9 à 12). <strong>Récursif</strong> veut dire « avec une fonction qui s'appelle elle-même ». Ce sont deux façons différentes d'obtenir de la répétition.</p>
<p>Tout ce qui est récursif peut s'écrire avec une boucle (la factorielle, par exemple, n'est que l'<strong>accumulateur produit</strong> du jour 12 : une variable qui garde le total en le multipliant à chaque tour) et vice-versa. La récursivité brille quand le problème est <strong>naturellement emboîté</strong> (une chose contient une plus petite version d'elle-même) : arborescences de dossiers, dessins fractals, dichotomie… La boucle, elle, brille pour les parcours simples et est souvent plus rapide et plus économe en mémoire.</p>`,

    { type: "qcm", q: "Une fonction récursive est une fonction qui…", opts: ["Boucle avec POUR", "S'appelle elle-même sur un problème plus petit", "Retourne toujours 0", "N'a pas de paramètres"], a: 1, exp: "Le problème se ramène à une version réduite de lui-même." },

<pre class="pseudo">FONCTION mystere(n) : ENTIER        // fonction mystere : prend n en entrée et RENVOIE un ENTIER

<pre class="pseudo">DESCENTE                       REMONTÉE
mystere(4)                     = 4 × ... non : m(3) × 2   // m(4) attend le résultat de m(3), puis ×2
 └─ mystere(3)                 = m(2) × 2                 // m(3) attend m(2), puis ×2
     └─ mystere(2)             = m(1) × 2                 // m(2) attend m(1), puis ×2
         └─ mystere(1) = 1     ← cas de base             // m(1) répond 1 : la descente s'arrête
         m(2) = 1 × 2 = 2                                 // remontée : m(2) vaut 2

 m(4) = 4 × 2 = 8                                         // remontée finale : m(4) vaut 8</pre>

    solution: "/* ---------------------------------------------------------------\n   ETAPE 1 — l'expression commune (carre) :\n     4^2 = 1+3+5+7   3^2 = 1+3+5   2^2 = 1+3   1^2 = 1\n     donc 4^2 = 3^2 + 7  et  3^2 = 2^2 + 5  et  2^2 = 1^2 + 3\n     Le carre d'une valeur n vaut (2n - 1) ajoute au carre de n - 1.\n     Verification : carre(4) = 7 + carre(3) ; carre(3) = 5 + carre(2). OK.\n\n   ETAPE 2 — le point d'arret :\n     on connait 1^2 = 1. C'est le point d'arret.\n\n   ETAPE 3 — le rapprochement :\n     on part d'une valeur STRICTEMENT POSITIVE et on diminue de 1 a chaque\n     appel : on finira donc par atteindre 1.\n   --------------------------------------------------------------- */\n\nFONCTION carre(valeur : ENTIER) : ENTIER\nDEBUT\n    SI valeur = 1 ALORS\n        RETOURNER 1                          /* point d'arret */\n    SINON\n        RETOURNER (2 * valeur - 1) + carre(valeur - 1)\n    FINSI\nFIN\n\n/* ---------------------------------------------------------------\n   ETAPE 1 — l'expression commune (puissance) :\n     4^4 = 4 * 4^3   4^3 = 4 * 4^2   4^2 = 4 * 4^1   4^1 = 4\n     Expression commune : on retire un a l'exposant et on multiplie par m.\n   ETAPE 2 — le point d'arret : m^1 = m.\n   ETAPE 3 — l'exposant part positif et diminue de 1 : on atteint 1.\n   --------------------------------------------------------------- */\n\nFONCTION puissance(valeur : ENTIER, exposant : ENTIER) : ENTIER\nDEBUT\n    SI exposant = 1 ALORS\n        RETOURNER valeur                     /* point d'arret */\n    SINON\n        RETOURNER valeur * puissance(valeur, exposant - 1)\n    FINSI\nFIN\n\nAlgorithme CarresDuPatissier\nVar\n    cote, facteur, niveaux : ENTIER\nDebut\n    Ecrire(\"Cote du carre de macarons ?\")\n    Lire(cote)\n    SI cote < 1 ALORS\n        /* d) le point d'arret est teste par EGALITE : un cote nul ou negatif\n              ne l'atteindrait jamais et la fonction descendrait sans fin */\n        Ecrire(\"Un cote doit valoir au moins 1\")\n    SINON\n        Ecrire(\"Le carre de \", cote, \" vaut \", carre(cote), \" macarons\")\n    FINSI\n\n    Ecrire(\"Facteur de multiplication par niveau ?\")\n    Lire(facteur)\n    Ecrire(\"Nombre de niveaux ?\")\n    Lire(niveaux)\n    SI niveaux < 1 ALORS\n        Ecrire(\"Il faut au moins un niveau\")\n    SINON\n        Ecrire(\"Quantite du dernier niveau : \", puissance(facteur, niveaux))\n    FINSI\nFin",

      { ref: "d", texte: "Avec un côté de <strong>0</strong> : le test <code>valeur = 1</code> échoue, donc on part dans le cas récursif et l'on appelle la fonction avec −1. Le test échoue encore, on appelle avec −2, puis −3… La suite des appels s'éloigne du point d'arrêt au lieu de s'en rapprocher, et la descente ne s'arrête jamais — jusqu'à ce que la machine épuise la mémoire réservée aux appels en attente. Avec <strong>−3</strong> : exactement la même chose, un cran plus bas. C'est pourquoi mon programme principal refuse ces valeurs avant même d'appeler : la fonction, elle, ne se protège pas, et la troisième étape de la démarche disait explicitement « on part d'une valeur strictement positive » — c'est une <em>hypothèse</em>, et une hypothèse doit être vérifiée par quelqu'un." },
      { ref: "Réflexion", texte: "<strong>L'étape 3 non satisfaite</strong> produit une descente infinie. Le symptôme ne ressemble pas à une erreur ordinaire : le programme ne s'arrête pas sur un message, il ne rend pas un résultat faux, il <em>ne rend rien du tout</em>. Il paraît réfléchir, puis il s'effondre d'un coup avec un message qui parle de mémoire ou de pile — un message qui ne mentionne ni la fonction fautive, ni la valeur en cause, et qui ressemble davantage à une panne de la machine qu'à une faute de l'algorithme. C'est ce qui le rend si déroutant pour un débutant : l'erreur est dans la ligne qui manque — le cas d'arrêt jamais atteint — et les diagnostics pointent vers un endroit qui n'a rien à voir. Le rapprochement avec la boucle infinie du jour 9 est direct : dans les deux cas, rien ne progresse vers la sortie, et dans les deux cas le programme ne proteste pas, il s'enlise. La différence est que la boucle infinie tourne indéfiniment sans rien consommer, tandis que la récursion infinie consomme de la mémoire à chaque appel et finit donc par mourir — ce qui est presque une chance, puisque cela au moins se voit. <strong>Ce qu'on a gagné à écrire ces deux calculs récursivement :</strong> presque rien en efficacité, et l'exercice est honnête de le reconnaître. La version en boucle est plus rapide, ne consomme aucune pile, et ne risque pas la descente infinie. Ce qu'on gagne est ailleurs : la fonction récursive <em>ressemble à la propriété mathématique</em> qu'elle applique. <code>carre(n) = (2n−1) + carre(n−1)</code> est littéralement la relation de récurrence écrite au tableau ; la boucle équivalente est une traduction, correcte mais qui ne se relit plus comme la propriété. Pour un calcul qu'on démontre, cette proximité est précieuse. <strong>Le gain réel</strong> apparaît quand le problème est lui-même récursif dans sa <em>forme</em>, c'est-à-dire quand un cas se ramène à plusieurs sous-cas et non à un seul : explorer un arbre, où chaque branche mène à deux branches ; parcourir un dossier qui contient des dossiers ; résoudre les tours de Hanoï, où déplacer <em>n</em> disques demande deux déplacements de <em>n−1</em> disques. Là, la version en boucle exige de gérer soi-même une pile des travaux en attente — c'est-à-dire de réécrire à la main ce que la récursion fait gratuitement — et elle devient nettement plus longue et plus difficile que la version récursive. La règle : quand un problème se ramène à <em>une</em> version plus petite, la boucle suffit ; quand il se ramène à <em>plusieurs</em>, la récursion s'impose." }

    enonce: "Reprends le tournoi. Les huit joueurs ne sont plus classés au score : ils s'affrontent en élimination directe. Les joueurs 1 et 2 se rencontrent, les joueurs 3 et 4 aussi, et ainsi de suite ; les quatre vainqueurs se rencontrent à leur tour, puis les deux derniers. La question posée est en apparence identique à celle d'hier — qui gagne ? — et sa résolution ne l'est plus du tout : le vainqueur de huit joueurs est le vainqueur d'un match entre le vainqueur des quatre premiers et le vainqueur des quatre derniers. Écris cette idée telle quelle, sans la traduire en boucles.",
    principe: "Un tournoi à élimination directe sur une tranche de joueurs se ramène à deux tournois sur les deux moitiés de cette tranche, suivis d'un match entre leurs vainqueurs. Le point d'arrêt est la tranche réduite à <strong>un seul joueur</strong> : celui-ci est le vainqueur de sa propre tranche, sans avoir à jouer. Un tournoi de <em>n</em> joueurs comporte exactement <em>n − 1</em> matchs — sept pour huit joueurs — puisque chaque match élimine une personne et qu'il faut en éliminer toutes sauf une.",

    reflexion: "Cette récursion se ramène à <strong>deux</strong> appels et non à un seul, contrairement à toutes celles de l'exercice précédent. Explique ce que cela change — pour l'écriture, pour l'ordre dans lequel les choses se produisent, et pour la possibilité de récrire le tout avec une boucle. Puis : ton affichage des matchs suit un ordre qui n'est pas celui d'un vrai tournoi, où tous les huitièmes se jouent avant les quarts. Décris l'ordre que produit ta récursion, dis d'où il vient, et propose une façon d'obtenir l'ordre réel.",
    indices: [
      "Une fonction qui reçoit deux bornes et rend un rang. Elle ne connaît ni le nombre total de joueurs ni l'état du tournoi : seulement la tranche qu'on lui confie. C'est cette ignorance qui lui permet de s'appeler sur des tranches plus petites.",

      "Le point délicat est le découpage de la tranche. Les deux moitiés doivent être strictement plus petites que la tranche d'origine <em>et</em> ne rien laisser de côté : la première va du début au milieu, la seconde du milieu suivant à la fin. Un milieu mal calculé donne soit une moitié vide — et la récursion ne se termine plus — soit un joueur oublié, qui ne jouera jamais.",
      "Ta copie ressemble à ceci : <br>les trois étapes en commentaire<br>une fonction qui reçoit les deux tableaux et deux bornes, et qui rend un entier<br><code>SI debut = fin ALORS RETOURNER debut FINSI</code><br>un milieu, deux appels rangés dans deux variables, un match, un retour."

    solution: "/* ---------------------------------------------------------------\n   ETAPE 1 — l'expression commune :\n     le vainqueur d'une tranche est le vainqueur du match entre le vainqueur\n     de sa premiere moitie et le vainqueur de sa seconde moitie.\n   ETAPE 2 — le point d'arret :\n     une tranche d'UN SEUL joueur : il est vainqueur sans jouer.\n   ETAPE 3 — le rapprochement :\n     chaque moitie est strictement plus petite que la tranche d'origine,\n     donc on finit par atteindre des tranches d'un joueur.\n   --------------------------------------------------------------- */\n\nFONCTION vainqueur(score : TABLEAU D'ENTIERS, pseudo : TABLEAU DE CHAINES,\n                   debut : ENTIER, fin : ENTIER) : ENTIER\n/* elle ne connait QUE la tranche qu'on lui confie : ni le nombre total de\n   joueurs, ni l'etat du tournoi. C'est cette ignorance qui lui permet de\n   s'appeler sur des tranches plus petites. */\nVar\n    milieu, gaucheGagnant, droiteGagnant : ENTIER\nDEBUT\n    SI debut = fin ALORS\n        RETOURNER debut                     /* point d'arret : un seul joueur */\n    FINSI\n\n    milieu <- (debut + fin) DIV 2\n\n    /* DEUX appels recursifs, et non un seul : c'est ce qui distingue cette\n       recursion de celles d'hier */\n    gaucheGagnant <- vainqueur(score, pseudo, debut, milieu)\n    droiteGagnant <- vainqueur(score, pseudo, milieu + 1, fin)\n\n    /* le match ne se joue qu'APRES le retour des deux appels : les deux\n       adversaires n'existent pas avant */\n    Ecrire(\"Match : \", pseudo[gaucheGagnant], \" contre \",\n           pseudo[droiteGagnant])\n\n    SI score[gaucheGagnant] >= score[droiteGagnant] ALORS\n        /* a egalite, le mieux place au classement l'emporte : c'est celui\n           dont le rang est le plus petit, donc celui de gauche */\n        Ecrire(\"   vainqueur : \", pseudo[gaucheGagnant])\n        RETOURNER gaucheGagnant\n    SINON\n        Ecrire(\"   vainqueur : \", pseudo[droiteGagnant])\n        RETOURNER droiteGagnant\n    FINSI\nFIN\n\nAlgorithme TournoiEliminationDirecte\nConst\n    N = 8\nVar\n    score : TABLEAU[1..8] D'ENTIERS\n    pseudo : TABLEAU[1..8] DE CHAINES\n    i, champion : ENTIER\nDebut\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Pseudonyme du joueur \", i, \" ?\")\n        Lire(pseudo[i])\n        Ecrire(\"Score ?\")\n        Lire(score[i])\n    FINPOUR\n\n    champion <- vainqueur(score, pseudo, 1, N)\n\n    Ecrire(\"Champion du tournoi : \", pseudo[champion],\n           \" (\", score[champion], \" pts)\")\n    /* d) chaque match elimine exactement une personne, et il faut les\n          eliminer toutes sauf une : donc N - 1 matchs, soit 7 pour 8 joueurs.\n          La formule ne demande aucun deroule. */\n    Ecrire(N - 1, \" matchs joues\")\nFin",
    reponses: [
      { ref: "c", texte: "Les matchs s'affichent dans l'ordre où ils se <em>terminent</em>, c'est-à-dire en remontant depuis le fond de la récursion : d'abord le match du joueur 1 contre le 2, puis celui du 3 contre le 4, puis le quart qui les oppose, puis les mêmes trois matchs pour la seconde moitié du tableau, et enfin la finale. Cet ordre vient de ce que le match d'une tranche ne peut se jouer qu'<em>après</em> le retour de ses deux appels : la récursion descend jusqu'aux joueurs isolés sans rien afficher, et tous les affichages se produisent en remontant. C'est exactement le même mécanisme que l'addition différée de l'exercice 26.1." },
      { ref: "Réflexion", texte: "<strong>Deux appels au lieu d'un</strong> change trois choses. Pour l'<em>écriture</em>, il faut ranger chaque résultat dans une variable avant de pouvoir les confronter : on ne peut plus écrire le retour en une seule expression, puisque les deux appels doivent aboutir avant que le match ait un sens. Pour l'<em>ordre des événements</em>, la récursion cesse d'être une simple descente suivie d'une remontée : elle explore d'abord toute une moitié, puis toute l'autre, et le déroulé prend la forme d'un arbre parcouru branche par branche plutôt que d'une ligne. Pour la <em>réécriture en boucle</em>, enfin, c'est le point décisif : avec un seul appel récursif, une boucle suffit toujours à faire la même chose. Avec deux, il faut mémoriser les travaux en attente — quand on part explorer la moitié gauche, la moitié droite reste à faire — et cette mémorisation, c'est une pile qu'il faut gérer à la main. On peut le faire ; c'est nettement plus long et plus facile à rater que la version récursive. C'est la frontière annoncée hier : un problème qui se ramène à <em>une</em> version plus petite se traite aussi bien en boucle ; un problème qui se ramène à <em>plusieurs</em> appelle la récursion. <strong>L'ordre réel d'un tournoi</strong> est différent : tous les huitièmes se jouent d'abord, puis tous les quarts, puis les demies, puis la finale — c'est-à-dire tour par tour, en largeur. Ma récursion produit un parcours en <em>profondeur</em> : elle épuise complètement une branche avant de s'occuper de l'autre. La différence n'est pas une faute — le champion est le même, les sept matchs sont les mêmes, seul leur ordre change — mais elle compte dès qu'un tournoi réel se joue dans le temps, parce que les huit joueurs du premier tour ne peuvent pas attendre qu'une moitié du tableau soit allée jusqu'à sa finale. Pour obtenir l'ordre réel, il faut cesser de descendre : on procède par <strong>tours successifs</strong>, avec une boucle qui, à chaque tour, fait s'affronter les joueurs restants deux à deux et ne garde que les vainqueurs — huit, puis quatre, puis deux, puis un. C'est une boucle et non une récursion, et c'est le bon outil ici : le problème « jouer un tour » ne se ramène pas à un problème plus petit de même nature, il produit simplement un tableau plus court." }
