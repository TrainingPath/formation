<script>
var DAY = {
  num: 26,
  title: "La récursivité : introduction",
  subtitle: "Une fonction qui s'appelle elle-même.",
  theory: `
<h3>1. L'idée vertigineuse</h3>
<p>Petit rappel avant de commencer : une <strong>fonction</strong> est une <strong>mini-machine</strong> à laquelle on donne une ou plusieurs valeurs (les <strong>entrées</strong>, aussi appelées <strong>paramètres</strong>) et qui, en échange, rend un résultat. Comme une machine à café : on met une capsule (l'entrée), on obtient un café (la sortie). <strong>Appeler</strong> une fonction, c'est simplement lui demander de travailler en lui donnant ses entrées (par exemple <code>fact(4)</code> = « fais tourner la machine <code>fact</code> avec l'entrée 4 »).</p>
<p>Nouveauté du jour : une fonction peut <strong>s'appeler elle-même</strong>. C'est la <strong>récursivité</strong> (du latin <em>recurrere</em>, « revenir en arrière ») : résoudre un problème en le ramenant à une version PLUS PETITE de lui-même, puis à une version encore plus petite, jusqu'à un cas si simple qu'on sait répondre du tac au tac.</p>
<p>Image : des <strong>poupées russes</strong> (ces poupées en bois qui s'emboîtent l'une dans l'autre). Pour ouvrir toutes les poupées : ouvrir la première, puis… ouvrir toutes les poupées restantes (le même problème, en plus petit). Autre image : deux miroirs face à face qui se renvoient l'image à l'infini — sauf qu'en informatique, on veut que ça s'arrête un jour !</p>
<h3>2. Les deux ingrédients OBLIGATOIRES</h3>
<p>Une récursion qui fonctionne a TOUJOURS deux morceaux. Si l'un manque, tout s'effondre :</p>
<ul>
<li>Le <strong>cas de base</strong> : le cas si simple qu'on répond directement, sans se rappeler. C'est le frein — comme la marche du bas d'un escalier : arrivé là, on ne descend plus.</li>
<li>Le <strong>cas récursif</strong> : on se rappelle soi-même sur un problème <strong>strictement plus petit</strong>. C'est le moteur — c'est lui qui fait avancer vers le cas de base, une marche à la fois.</li>
</ul>
<p>Voici un premier exemple : un compte à rebours de fusée. On lit chaque ligne, commentée après le symbole <code>//</code> (qui introduit un commentaire, un texte pour l'humain ignoré par l'ordinateur) :</p>
<pre class="pseudo">FONCTION compteARebours(n)          // on définit une fonction nommée compteARebours ; n est son entrée (un nombre)
DEBUT                               // début du corps de la fonction (la liste des étapes)
    SI n = 0 ALORS                  // CAS DE BASE (le frein) : si n est arrivé à 0
        Écrire("Décollage !")       // on affiche le message final, SANS se rappeler → la cascade s'arrête ici
    SINON                           // CAS RÉCURSIF (le moteur) : tant que n n'est pas encore 0
        Écrire(n)                   // on affiche la valeur actuelle de n
        compteARebours(n - 1)       // la fonction S'APPELLE elle-même sur n - 1 : le même problème, en plus petit !
    FINSI                           // fin du choix SI / SINON
FIN                                 // fin de la fonction
compteARebours(3)   →  3  2  1  Décollage !   // exemple : l'appel de départ déclenche toute la cascade 3, 2, 1, décollage</pre>
<div class="warn">Sans cas de base, ou si le problème ne rétrécit pas : <strong>récursion infinie</strong> (les appels s'enchaînent sans jamais s'arrêter et le programme s'effondre). C'est la version récursive de la boucle infinie du jour 9. Pour éviter ça, vérifie toujours deux choses : (1) il existe un cas de base, et (2) chaque appel se rapproche vraiment de ce cas de base.</div>
<h3>3. La factorielle : le classique absolu</h3>
<p>La <strong>factorielle</strong> d'un nombre <code>n</code>, notée <code>n!</code> (le point d'exclamation se lit « factorielle »), est le produit de tous les entiers de 1 à n : <code>n! = n × (n−1) × … × 2 × 1</code> (le symbole <code>×</code> veut dire « multiplié par »). Par exemple <code>4! = 4 × 3 × 2 × 1 = 24</code>. On convient aussi que <code>0! = 1</code>.</p>
<p>Observation clé : à l'intérieur de <code>n!</code> se cache <code>(n−1)!</code>. En effet <strong>n! = n × (n−1)!</strong> — la définition s'appelle elle-même ! C'est exactement ce dont la récursivité a besoin.</p>
<pre class="pseudo">FONCTION fact(n) : ENTIER           // fonction fact : prend n en entrée et RENVOIE un ENTIER (le résultat du calcul)
DEBUT                               // début du corps de la fonction
    SI n <= 1 ALORS                 // CAS DE BASE : si n vaut 0 ou 1 (<= se lit « inférieur ou égal à »)
        RETOURNER 1                 // on renvoie 1 tout de suite (car 0! = 1 et 1! = 1), sans appel récursif
    SINON                           // SINON, n vaut 2 ou plus
        RETOURNER n * fact(n - 1)   // CAS RÉCURSIF : n multiplié par le résultat de fact appliqué à n - 1
    FINSI                           // fin du choix SI / SINON
FIN                                 // fin de la fonction (RETOURNER envoie le résultat à qui a appelé fact)</pre>
<h3>4. Dérouler un appel : la descente et la remontée</h3>
<p>Pour vraiment comprendre, on <strong>déroule</strong> l'appel à la main, comme on ferait une trace (jour 2). Un appel récursif se lit en deux temps : la <strong>descente</strong> (on empile les appels, du plus grand au cas de base) puis la <strong>remontée</strong> (les résultats reviennent et se combinent). « Empiler » signifie mettre les appels en attente les uns par-dessus les autres, comme une pile d'assiettes : le dernier posé est le premier repris.</p>
<pre class="pseudo">fact(4)                            // on veut calculer fact(4)
= 4 * fact(3)              // descente : on met 4 de côté ; il faut d'abord connaître fact(3)
= 4 * (3 * fact(2))                // fact(3) = 3 * fact(2) : on descend encore d'un cran
= 4 * (3 * (2 * fact(1)))          // fact(2) = 2 * fact(1) : on descend jusqu'au bord du cas de base
= 4 * (3 * (2 * 1))        // fact(1) atteint le CAS DE BASE et renvoie 1 : la descente s'arrête
= 4 * (3 * 2)              // remontée : 2 * 1 = 2, le résultat commence à remonter
= 4 * 6                            // remontée : 3 * 2 = 6
= 24                               // remontée finale : 4 * 6 = 24 → c'est le résultat de fact(4)</pre>
<div class="tip">Pour comprendre une récursion, écris TOUJOURS ce déroulé descente/remontée. Après quelques traces, ton cerveau fera confiance à la « magie » : si fact(n−1) est correct, alors n × fact(n−1) l'est aussi. On appelle ça l'<strong>acte de foi récursif</strong> — on suppose que l'appel plus petit fait bien son travail, et on se contente de combiner son résultat.</div>
<h3>5. Récursif ou itératif ?</h3>
<p>Deux mots à distinguer. <strong>Itératif</strong> veut dire « avec une boucle » (POUR, TANT QUE… : on répète des étapes, comme aux jours 9 à 12). <strong>Récursif</strong> veut dire « avec une fonction qui s'appelle elle-même ». Ce sont deux façons différentes d'obtenir de la répétition.</p>
<p>Tout ce qui est récursif peut s'écrire avec une boucle (la factorielle, par exemple, n'est que l'<strong>accumulateur produit</strong> du jour 12 : une variable qui garde le total en le multipliant à chaque tour) et vice-versa. La récursivité brille quand le problème est <strong>naturellement emboîté</strong> (une chose contient une plus petite version d'elle-même) : arborescences de dossiers, dessins fractals, dichotomie… La boucle, elle, brille pour les parcours simples et est souvent plus rapide et plus économe en mémoire.</p>`,
  exercises: [
    { type: "qcm", q: "Une fonction récursive est une fonction qui…", opts: ["Boucle avec POUR", "S'appelle elle-même sur un problème plus petit", "Retourne toujours 0", "N'a pas de paramètres"], a: 1, exp: "Le problème se ramène à une version réduite de lui-même." },
    { type: "qcm", q: "Les deux ingrédients obligatoires d'une récursion sont…", opts: ["Une boucle et un SI", "Un cas de base (frein) et un cas récursif qui RÉTRÉCIT le problème (moteur)", "Deux fonctions", "Un tableau et un indice"], a: 1, exp: "Sans frein ou sans rétrécissement : récursion infinie." },
    { type: "qcm", q: "Que se passe-t-il sans cas de base ?", opts: ["La fonction retourne 0", "Récursion infinie : les appels s'empilent jusqu'au crash", "Rien", "Le compilateur corrige"], a: 1, exp: "L'équivalent récursif de la boucle infinie du jour 9." },
    { type: "input", q: "Que vaut <code>fact(3)</code> ?", a: "6", ph: "nombre", exp: "3 × 2 × 1 = 6." },
    { type: "input", q: "Que vaut <code>fact(5)</code> ?", a: "120", ph: "nombre", exp: "5 × fact(4) = 5 × 24 = 120." },
    { type: "qcm", q: "Dans fact, quel est le cas de base ?", opts: ["n <= 1 : RETOURNER 1", "n * fact(n-1)", "n = 100", "RETOURNER n"], a: 0, exp: "Le cas trivial qui répond sans se rappeler." },
    { type: "qcm", q: "Qu'affiche <code>compteARebours(2)</code> ?", opts: ["2 1 Décollage !", "Décollage ! 1 2", "2 1 0", "1 2 Décollage !"], a: 0, exp: "Écrire(2), appel(1) → Écrire(1), appel(0) → « Décollage ! »." },
    { type: "qcm", q: "On inverse les deux lignes du SINON : <code>compteARebours(n - 1)</code> PUIS <code>Écrire(n)</code>. Qu'affiche l'appel (3) ?", opts: ["3 2 1 Décollage !", "Décollage ! 1 2 3 : l'affichage se fait à la REMONTÉE", "Rien", "3 3 3"], a: 1, exp: "Agir avant l'appel = descente ; après l'appel = remontée. L'ordre des lignes change tout." },
    { type: "input", q: "<code>FONCTION s(n) : SI n = 0 ALORS RETOURNER 0 SINON RETOURNER n + s(n - 1)</code>. Que vaut s(4) ?", a: "10", ph: "nombre", exp: "4+3+2+1+0 = 10 : la somme des n premiers entiers, en récursif." },
    { type: "qcm", q: "Quel est le problème de : <code>FONCTION f(n) : RETOURNER n * f(n - 1)</code> (sans SI) ?", opts: ["Aucun", "Pas de cas de base : f(3) appelle f(2), f(1), f(0), f(-1)… à l'infini", "n est trop grand", "Il manque une boucle"], a: 1, exp: "Le moteur sans frein." },
    { type: "qcm", q: "Et celui de : <code>FONCTION g(n) : SI n = 0 ALORS RETOURNER 0 SINON RETOURNER g(n)</code> ?", opts: ["Aucun", "L'appel g(n) ne RÉTRÉCIT pas le problème : infini pour n > 0", "Le cas de base est faux", "g est une procédure"], a: 1, exp: "Le frein existe mais on n'avance jamais vers lui : il faut g(n−1)." },
    { type: "qcm", q: "fact(4) : combien d'appels de la fonction fact au TOTAL (y compris le premier) ?", opts: ["1", "4 : fact(4), fact(3), fact(2), fact(1)", "24", "3"], a: 1, exp: "Un appel par étage jusqu'au cas de base." },
    { type: "qcm", q: "La version itérative de fact utilise quel motif du jour 12 ?", opts: ["Le compteur", "L'accumulateur PRODUIT initialisé à 1", "Le drapeau", "La moyenne"], a: 1, exp: "p ← 1 ; POUR i DE 1 A n FAIRE p ← p * i. Récursif et itératif : deux habits du même calcul." },
    { type: "qcm", q: "<code>FONCTION m(n) : SI n < 10 ALORS RETOURNER n SINON RETOURNER m(n DIV 10)</code>. Que vaut m(4728) ?", opts: ["8", "4 : on retire le dernier chiffre jusqu'à n'en garder qu'un — le PREMIER chiffre", "4728", "2"], a: 1, exp: "4728 → 472 → 47 → 4. La récursion « épluche » le nombre (DIV du jour 3 !)." },
    { type: "vf", q: "La dichotomie du jour 23 est naturellement récursive : « chercher dans [g..d] » se ramène à « chercher dans une moitié ».", a: true, exp: "Même zone rétrécissante, exprimée par appels au lieu de boucle : demain, on l'écrit !" }
  ],
  final: {
    title: "Exercice final — La fusée récursive",
    intro: `<p>Déroule cette fonction, qui combine tout le vocabulaire du jour :</p>
<pre class="pseudo">FONCTION mystere(n) : ENTIER        // fonction mystere : prend n en entrée et RENVOIE un ENTIER
DEBUT                               // début du corps de la fonction
    SI n = 1 ALORS                  // CAS DE BASE (le frein) : si n vaut exactement 1
        RETOURNER 1                 // on renvoie 1 tout de suite, sans se rappeler
    SINON                           // SINON, n vaut 2 ou plus
        RETOURNER mystere(n - 1) * 2 // CAS RÉCURSIF : (résultat de mystere sur n - 1) multiplié par 2
    FINSI                           // fin du choix SI / SINON
FIN                                 // fin de la fonction</pre>`,
    questions: [
      { type: "qcm", q: "Quel est le cas de base de <code>mystere</code> ?", opts: ["n = 1 → RETOURNER 1", "n = 0", "mystere(n-1)", "* 2"], a: 0, exp: "Le frein : à n = 1, on répond sans se rappeler." },
      { type: "input", q: "Que vaut <code>mystere(2)</code> ?", a: "2", ph: "nombre", exp: "mystere(1) × 2 = 1 × 2 = 2." },
      { type: "input", q: "Que vaut <code>mystere(4)</code> ? (déroule : m(4) = m(3)×2 = …)", a: "8", ph: "nombre", exp: "m(4) = m(3)×2 = (m(2)×2)×2 = ((1×2)×2)×2 = 8." },
      { type: "qcm", q: "Que calcule <code>mystere(n)</code> en général ?", opts: ["n²", "2 puissance (n−1) : on double n−1 fois à partir de 1", "n!", "2n"], a: 1, exp: "1, 2, 4, 8, 16… chaque étage multiplie par 2." },
      { type: "input", q: "Combien d'appels à mystere pour <code>mystere(6)</code> (premier appel compris) ?", a: "6", ph: "nombre", exp: "m(6), m(5), m(4), m(3), m(2), m(1) : la profondeur suit n." }
    ],
    solution: `<p>Déroulé complet de mystere(4). À gauche la DESCENTE (on empile les appels jusqu'au cas de base), à droite la REMONTÉE (chaque résultat revient et se multiplie par 2) :</p>
<pre class="pseudo">DESCENTE                       REMONTÉE
mystere(4)                     = 4 × ... non : m(3) × 2   // m(4) attend le résultat de m(3), puis ×2
 └─ mystere(3)                 = m(2) × 2                 // m(3) attend m(2), puis ×2
     └─ mystere(2)             = m(1) × 2                 // m(2) attend m(1), puis ×2
         └─ mystere(1) = 1     ← cas de base             // m(1) répond 1 : la descente s'arrête
         m(2) = 1 × 2 = 2                                 // remontée : m(2) vaut 2
     m(3) = 2 × 2 = 4                                     // remontée : m(3) vaut 4
 m(4) = 4 × 2 = 8                                         // remontée finale : m(4) vaut 8</pre>
<p>mystere(n) = 2^(n−1). Frein ✓, moteur qui rétrécit ✓, trace descente/remontée ✓ : tu sais lire une récursion. Demain : s'en servir pour résoudre de vrais problèmes.</p>`
  }
};
