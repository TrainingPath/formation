  title: "Les chaînes de caractères",
  subtitle: "Du texte qui se manipule comme un tableau.",
  theory: `
<h3>1. Une chaîne est (presque) un tableau</h3>
<p>Un <strong>caractère</strong> est un <strong>seul symbole</strong> : une lettre (« B »), un chiffre (« 7 »), un espace, ou un signe de ponctuation (« ! »). Une <strong>chaîne</strong> (on dit aussi « chaîne de caractères ») est une <strong>suite de caractères mis bout à bout</strong>, autrement dit du <strong>texte</strong> : « BONJOUR », « chat », « code 42 ». On écrit toujours une chaîne entre <strong>guillemets</strong> <code>"…"</code> : les guillemets sont des bornes qui montrent où le texte commence et où il finit (ils ne font pas partie du texte lui-même).</p>
<p>Souviens-toi du <strong>tableau</strong> (vu les jours précédents) : une rangée de cases numérotées, chacune contenant une valeur. Une chaîne fonctionne presque pareil : c'est une rangée de cases dont chacune contient <strong>un</strong> caractère. On accède à un caractère précis par son <strong>indice</strong>, c'est-à-dire son <strong>numéro de position</strong> (on numérote à partir de 1), en le mettant entre crochets <code>[ ]</code> :</p>
<pre class="pseudo">mot ← "BONJOUR"                              // la boîte "mot" reçoit le texte BONJOUR (7 caractères)
indice :   1    2    3    4    5    6    7    // le numéro de position de chaque caractère (on compte dès 1)
mot :    [ B ][ O ][ N ][ J ][ O ][ U ][ R ] // chaque case contient UN caractère, comme un tableau
mot[1] → "B"       mot[4] → "J"              // mot[i] désigne le caractère situé à la position i</pre>
<div class="tip">Le symbole <code>→</code> se lit ici « donne » ou « vaut » : <code>mot[1] → "B"</code> veut dire « le caractère de position 1 vaut B ». Ce n'est pas une instruction, juste une façon de montrer un résultat.</div>
<h3>2. Les opérations de base</h3>
<p>Voici la petite <strong>boîte à outils</strong> pour manipuler du texte. <code>LONGUEUR</code> compte le nombre de caractères ; la <strong>concaténation</strong> (le symbole <code>&amp;</code>) <strong>colle</strong> deux chaînes bout à bout pour en former une seule ; <code>MAJUSCULE</code> et <code>MINUSCULE</code> changent la <strong>casse</strong> (le fait qu'une lettre soit en grande forme « A » ou en petite forme « a ») :</p>
<pre class="pseudo">LONGUEUR("chat")           → 4               // LONGUEUR compte les caractères : c-h-a-t = 4
"al" &amp; "go"                → "algo"          // & colle deux chaînes bout à bout : c'est la concaténation (jour 3)
mot[i]                     → i-ème caractère  // les crochets [ ] renvoient le caractère à la position i
MAJUSCULE("abc") → "ABC"   MINUSCULE("ABC") → "abc"  // convertissent tout le texte en grandes / petites lettres</pre>
<div class="warn">Comparaison de caractères : "a" = "A" est <strong>FAUX</strong>. Majuscules et minuscules sont des caractères différents ! D'où l'astuce : tout convertir en minuscules (ou tout en majuscules) avant de comparer.</div>
<h3>3. Parcourir une chaîne : tout ce qu'on sait resservi</h3>
<p><strong>Parcourir</strong> une chaîne, c'est passer sur chacun de ses caractères, un par un, du premier au dernier — exactement comme on parcourt un tableau. Pour cela on réutilise le motif <strong>compteur</strong> (une variable qui compte, vue au jour 12) : elle démarre à 0 et augmente de 1 chaque fois qu'on rencontre ce qu'on cherche.</p>
<pre class="pseudo">// Compter les "A" dans un mot            // objectif de l'algorithme (ce commentaire est pour l'humain)
nb ← 0                                    // le compteur démarre à 0 (aucun A trouvé pour l'instant)
POUR i DE 1 A LONGUEUR(mot) FAIRE         // i prend chaque position, de 1 jusqu'au dernier caractère
    SI mot[i] = "A" ALORS                 // le caractère à la position i est-il un "A" ?
        nb ← nb + 1                       // oui : on ajoute 1 au compteur
    FINSI                                 // fin du test SI
FINPOUR                                   // fin de la boucle : on passe au caractère suivant</pre>
<p>C'est EXACTEMENT le motif compteur du jour 12 appliqué au jour 15 — seule la nature des données change.</p>
<h3>4. Inverser une chaîne</h3>
<p>Pour construire une nouvelle chaîne petit à petit, on utilise un <strong>accumulateur</strong> : une variable dans laquelle on <strong>accumule</strong> (on entasse) le résultat au fil de la boucle. Pour du texte, l'accumulateur commence à la <strong>chaîne vide</strong> <code>""</code> (du texte qui ne contient rien du tout), puis on lui colle un caractère à chaque tour :</p>
<pre class="pseudo">envers ← ""                          // chaîne VIDE : l'accumulateur de texte, vide au départ
POUR i DE LONGUEUR(mot) A 1 PAS -1 FAIRE  // i part du DERNIER caractère et recule de 1 (PAS -1) jusqu'à 1
    envers ← envers &amp; mot[i]            // on colle le caractère courant au bout de l'accumulateur
FINPOUR                              // fin de la boucle : tous les caractères ont été ajoutés à l'envers
// "CHAT" → "TAHC"                   // exemple de résultat obtenu</pre>
<div class="tip">L'accumulateur de chaînes s'initialise à <code>""</code> (chaîne vide), comme la somme à 0 et le produit à 1. Toujours l'élément neutre !</div>
<h3>5. Le palindrome : comparer le début et la fin</h3>
<p>Un <strong>palindrome</strong> est un mot qui se lit de la même façon dans les deux sens : RADAR, KAYAK, LAVAL. Astuce : on compare le caractère de position <code>i</code> à son caractère « miroir », celui de position <code>n − i + 1</code> (le symétrique en partant de la fin). Le mot <code>DIV</code> ci-dessous désigne la <strong>division entière</strong> (le quotient sans virgule : 5 DIV 2 vaut 2) :</p>
<pre class="pseudo">n ← LONGUEUR(mot)                    // n = nombre de caractères du mot
estPalindrome ← VRAI                 // drapeau : on suppose OUI au départ (hypothèse optimiste)
POUR i DE 1 A n DIV 2 FAIRE          // i va de 1 à la moitié (DIV = division entière) : une demi-passe suffit
    SI mot[i] ≠ mot[n - i + 1] ALORS // compare le caractère i à son miroir (position n - i + 1) ; ≠ signifie « différent de »
        estPalindrome ← FAUX         // une paire diffère → ce n'est pas un palindrome
    FINSI                            // fin du test SI
FINPOUR                              // fin de la boucle : toutes les paires miroir ont été comparées</pre>
<p>Pour RADAR (n=5) : on compare mot[1]/mot[5] (R/R) et mot[2]/mot[4] (A/A). Le milieu se compare à lui-même : inutile, d'où n DIV 2.</p>`,

    { type: "input", q: "Que vaut <code>LONGUEUR(\"algorithme\")</code> ?", a: "10", ph: "nombre", exp: "a-l-g-o-r-i-t-h-m-e : 10 caractères." },

    { type: "input", q: "Qu'affiche l'algorithme d'inversion pour mot ← \"ROMA\" ?", a: ["AMOR", "amor"], ph: "texte", exp: "On lit de la fin vers le début : AMOR." },

    { type: "input", q: "Que vaut <code>\"BON\" &amp; \"JOUR\"</code> ? (sans guillemets)", a: ["BONJOUR", "bonjour"], ph: "texte", exp: "Concaténation : BONJOUR." },
    { type: "qcm", q: "Compter les voyelles de mot : quelle condition dans le SI ?", opts: ["mot[i] = \"aeiou\"", "mot[i] = \"a\" OU mot[i] = \"e\" OU mot[i] = \"i\" OU mot[i] = \"o\" OU mot[i] = \"u\"", "mot[i] ≠ consonne", "mot = voyelle"], a: 1, exp: "On compare le CARACTÈRE à chaque voyelle, relié par des OU (jour 8)." },
    { type: "input", q: "s ← \"\" ; POUR i DE 1 A 3 FAIRE s ← s &amp; \"AB\" FINPOUR. Que vaut s ?", a: ["ABABAB", "ababab"], ph: "texte", exp: "Trois collages de AB : ABABAB." },

    { type: "vf", q: "Le parcours d'une chaîne utilise les mêmes motifs (compteur, drapeau, accumulateur) que le parcours d'un tableau.", a: true, exp: "C'est le message du jour : les MOTIFS sont universels, seules les données changent." }

    questions: [

      { type: "qcm", q: "Pour détecter un espace, on utilise…", opts: ["Un accumulateur", "Un drapeau : contientEspace ← VRAI dès que mot[i] = \" \"", "MAJUSCULE", "La longueur"], a: 1, exp: "Recherche séquentielle d'un caractère précis." },
      { type: "input", q: "Combien de \"A\" contient \"LAVAL\" ?", a: "2", ph: "nombre", exp: "L-A-V-A-L : deux A." },
      { type: "qcm", q: "\"LAVAL\" est-il un palindrome ?", opts: ["Oui : L=L et A=A, le V central est seul", "Non"], a: 0, exp: "mot[1]/mot[5] : L/L ✓, mot[2]/mot[4] : A/A ✓ → palindrome." },
      { type: "input", q: "Que vaut la version miroir de \"BONJOUR\" ?", a: ["RUOJNOB", "ruojnob"], ph: "texte", exp: "Parcours à l'envers avec accumulateur de chaîne : RUOJNOB." }
    ],
    solution: `<pre class="pseudo">ALGORITHME AnalysePseudo             // nom de l'algorithme
DEBUT                                // début des instructions
    Lire(pseudo)                     // ENTRÉE : on récupère le pseudo saisi par l'utilisateur
    n ← LONGUEUR(pseudo)             // n = nombre de caractères du pseudo
    // 1. longueur                   // première vérification
    lgOK ← (n >= 3 ET n <= 12)       // lgOK vaut VRAI si n est entre 3 et 12 inclus (encadrement, jour 8)
    // 2. pas d'espace (drapeau)     // deuxième vérification
    espace ← FAUX                    // drapeau : aucun espace trouvé pour l'instant
    POUR i DE 1 A n FAIRE            // on parcourt chaque caractère du pseudo
        SI pseudo[i] = " " ALORS espace ← VRAI FINSI  // un espace ? on lève le drapeau
    FINPOUR                          // fin du parcours
    // 3. miroir (accumulateur de chaîne)  // fabrication de la version inversée
    miroir ← ""                      // accumulateur de texte, vide au départ
    POUR i DE n A 1 PAS -1 FAIRE     // on parcourt à l'envers : du dernier caractère jusqu'au premier
        miroir ← miroir &amp; pseudo[i]  // on colle chaque caractère au bout du miroir
    FINPOUR                          // fin du parcours inversé
    SI lgOK ET NON espace ALORS      // pseudo valide : bonne longueur ET aucun espace (NON inverse le drapeau)
        Écrire("Pseudo accepté ! Miroir : ", miroir)  // Affiche l'acceptation et le miroir
    SINON                            // sinon (au moins une règle non respectée)
        Écrire("Pseudo refusé")      // Affiche le refus
    FINSI                            // fin du test final
FIN</pre>
<p>Trois motifs connus (encadrement, drapeau, accumulateur), appliqués à du texte. Rien de neuf — c'est bon signe : tu recycles tes automatismes.</p>`
  }

      "Trois traitements de texte indépendants, et deux idées seulement. La première est qu'on transforme une chaîne pour la rendre comparable ; la seconde est qu'on parcourt une chaîne par les deux bouts à la fois, ce qui demande deux indices qui se déplacent en sens contraire — ou un seul, et un peu d'arithmétique.",
      "Le plan : pour la normalisation, avancer un indice tant que le caractère courant est un espace, reculer un autre depuis la fin selon le même principe, puis reconstruire la chaîne entre ces deux bornes et la convertir. Pour le palindrome, comparer les caractères symétriques deux à deux jusqu'au milieu, en s'arrêtant à la première différence.",
      "En pseudocode, pour le palindrome : <code>i ← 1 ; j ← LONGUEUR(code) ; estPalindrome ← VRAI</code> · puis une boucle à condition qui tourne tant que les deux indices ne se sont pas rejoints <em>et</em> qu'aucune différence n'a été constatée : comparer les deux caractères après les avoir mis dans la même casse ; s'ils diffèrent, abandonner ; sinon rapprocher les deux indices l'un de l'autre.",
      "Le point délicat est la condition d'arrêt du palindrome. Écrire <code>i &lt;= j</code> ferait comparer le caractère central à lui-même sur une longueur impaire — inoffensif mais inutile — tandis que <code>i &lt; j</code> s'arrête juste avant. Sur une longueur paire, les deux indices se croisent sans jamais être égaux, et la condition stricte suffit là aussi. C'est un cas où deux écritures donnent le même résultat pour des raisons différentes selon la parité.",
      "Ta copie ressemble à ceci : <br><code>debut ← 1</code> · <code>TANT QUE … ET s[debut] = \" \" FAIRE debut ← … FINTANTQUE</code><br><code>fin ← LONGUEUR(s)</code> · une boucle symétrique qui recule<br><code>i ← 1 ; j ← LONGUEUR(code)</code><br><code>TANT QUE i < j ET … FAIRE … ; i ← i + 1 ; j ← j - 1 FINTANTQUE</code>"
    ],
    solution: "Algorithme GuichetBanque\nVar\n    nomFichier, nomSaisi, a, b, code : CHAINE\n    normalise : CHAINE\n    i, j, debut, fin, comparaisons : ENTIER\n    estPalindrome : BOOLEEN\nDebut\n    Ecrire(\"Nom au fichier ?\")\n    Lire(nomFichier)\n    Ecrire(\"Nom saisi au guichet ?\")\n    Lire(nomSaisi)\n\n    /* a) NORMALISATION du premier nom */\n    debut <- 1\n    TANT QUE debut <= LONGUEUR(nomFichier) ET nomFichier[debut] = \" \" FAIRE\n        debut <- debut + 1\n    FINTANTQUE\n    fin <- LONGUEUR(nomFichier)\n    TANT QUE fin >= debut ET nomFichier[fin] = \" \" FAIRE\n        fin <- fin - 1\n    FINTANTQUE\n    normalise <- \"\"\n    POUR i DE debut A fin FAIRE\n        normalise <- normalise & nomFichier[i]\n    FINPOUR\n    /* la casse en DERNIER : elle ne change ni la longueur ni la position des\n       espaces, donc l'ordre est en realite indifferent ici — mais l'inverser\n       ferait convertir des caracteres qu'on va jeter, pour rien */\n    a <- MAJUSCULE(normalise)\n\n    /* meme traitement pour le second nom (voir remarque en fin d'algorithme) */\n    debut <- 1\n    TANT QUE debut <= LONGUEUR(nomSaisi) ET nomSaisi[debut] = \" \" FAIRE\n        debut <- debut + 1\n    FINTANTQUE\n    fin <- LONGUEUR(nomSaisi)\n    TANT QUE fin >= debut ET nomSaisi[fin] = \" \" FAIRE\n        fin <- fin - 1\n    FINTANTQUE\n    normalise <- \"\"\n    POUR i DE debut A fin FAIRE\n        normalise <- normalise & nomSaisi[i]\n    FINPOUR\n    b <- MAJUSCULE(normalise)\n\n    /* b) la comparaison ne porte QUE sur les formes normalisees */\n    SI a = b ALORS\n        Ecrire(\"Meme titulaire : \", a)\n    SINON\n        Ecrire(\"Titulaires differents : \", a, \" / \", b)\n    FINSI\n\n    /* c) PALINDROME : on parcourt par les deux bouts a la fois */\n    Ecrire(\"Code interne a verifier ?\")\n    Lire(code)\n    i <- 1\n    j <- LONGUEUR(code)\n    estPalindrome <- VRAI\n    comparaisons <- 0\n    /* i < j strictement : sur une longueur impaire, le caractere central\n       serait compare a lui-meme, ce qui est toujours vrai et inutile */\n    TANT QUE i < j ET estPalindrome FAIRE\n        comparaisons <- comparaisons + 1\n        SI MAJUSCULE(code[i]) <> MAJUSCULE(code[j]) ALORS\n            estPalindrome <- FAUX\n        FINSI\n        i <- i + 1\n        j <- j - 1\n    FINTANTQUE\n\n    SI estPalindrome ALORS\n        Ecrire(code, \" est un palindrome (\", comparaisons, \" comparaisons)\")\n    SINON\n        Ecrire(code, \" n'est pas un palindrome (\", comparaisons, \" comparaisons)\")\n    FINSI\nFin",
    reponses: [
      { ref: "a", texte: "L'ordre des trois opérations est en réalité <strong>indifférent</strong> pour le résultat : convertir la casse ne modifie ni la longueur de la chaîne, ni la position des espaces, donc le découpage donnera le même résultat avant ou après. Il y a malgré tout une raison de mettre la conversion en dernier : convertir d'abord ferait travailler sur des caractères qu'on va ensuite jeter — les espaces de bordure — ce qui est du travail perdu. Sur des noms de dix lettres, c'est négligeable ; sur un traitement de millions de lignes, c'est le genre de détail qui se paie. La question mérite d'être posée parce qu'elle a souvent une autre réponse : si la normalisation devait aussi retirer les accents ou les tirets, l'ordre cesserait d'être neutre." },
      { ref: "d", texte: "Sur un code de <strong>neuf</strong> caractères, la boucle effectue au maximum <strong>4</strong> comparaisons : les couples (1,9), (2,8), (3,7), (4,6), après quoi les indices valent 5 et 5, la condition stricte devient fausse et l'on sort — le caractère central n'est jamais comparé. Sur un code de <strong>dix</strong> caractères, elle en effectue <strong>5</strong> : les couples (1,10) jusqu'à (5,6), après quoi les indices se croisent à 6 et 5. L'écart tient donc à la parité : une longueur impaire a un caractère central qui n'a pas de partenaire, une longueur paire n'en a pas. En général, le nombre de comparaisons vaut la longueur divisée par deux, en division entière." },
      { ref: "Réflexion", texte: "<strong>Ce que la normalisation fait perdre</strong>, c'est précisément l'information qu'elle jette : la casse et les espaces de bordure. Tant qu'il s'agit de retrouver un titulaire, cette perte est le but recherché. Elle devient grave dès que la distinction jetée portait du sens. Un exemple concret : dans certains pays, les particules et les préfixes se distinguent par la casse — <em>de Vries</em> et <em>De Vries</em> peuvent être deux familles différentes aux Pays-Bas, et <em>MacDonald</em> n'est pas <em>Macdonald</em> pour l'état civil écossais. Après normalisation, ces personnes deviennent indiscernables, et le guichetier peut créditer le compte de l'une avec le virement de l'autre. Plus grave encore : dans un système où les identifiants seraient sensibles à la casse — beaucoup de systèmes de fichiers le sont —, normaliser au moment de la recherche ferait trouver un compte, et normaliser au moment de l'écriture en créerait un second. La règle qui en sort : normaliser pour <em>comparer</em>, jamais pour <em>stocker</em>. Le fichier doit garder la forme d'origine, et la forme normalisée ne doit exister que le temps d'une comparaison. <strong>Le caractère central</strong> d'une chaîne de longueur impaire n'est jamais comparé, et c'est correct : il serait comparé à lui-même, ce qui est vrai par construction et n'apporte aucune information. La condition stricte s'arrête juste avant. Sur une longueur paire, le cas ne se pose pas puisque les deux indices se croisent sans jamais coïncider. La condition large donnerait le même résultat dans les deux cas, au prix d'une comparaison inutile sur les longueurs impaires — c'est un exemple d'écriture qui n'est pas fausse mais qui révèle qu'on n'a pas réfléchi à la parité." }
    ],
    pourquoi: "La normalisation est écrite deux fois, intégralement, une fois par nom. C'est une duplication assumée faute d'outil pour la nommer — et c'est précisément le manque que la leçon du jour 20 viendra combler : une <em>procédure</em> permettrait d'écrire ce traitement une seule fois et de l'appeler deux fois. Tel quel, l'algorithme a un défaut réel : le jour où la normalisation devra aussi retirer les tirets, il faudra le faire à deux endroits, et l'un des deux sera oublié.",
    checklist: [
      "Tes deux boucles de suppression d'espaces vérifient-elles leurs bornes avant de lire un caractère ?",

    ],
    note: "Vérifie <code>kayak</code>, <code>Radar</code>, <code>ressort</code> et <code>ETE</code>. Le troisième doit échouer dès la première comparaison." },

  { num: "19.3", titre: "Le fichier des adhérents — 4 / 4", niveau: 3, domaine: "club sportif",
    serie: { nom: "Le fichier des adhérents", jour: 4, sur: 4 },
    hier: "jour18.html",
    enonce: "Dernier jour de la série. Le fichier ne connaissait que des numéros ; le secrétariat y ajoute enfin les noms des douze adhérents, saisis au fil des années par des bénévoles différents — d'où des majuscules capricieuses et des espaces parasites. L'algorithme doit rendre le fichier utilisable : normaliser chaque nom pour la comparaison, retrouver un adhérent quelle que soit la façon dont on tape son nom, produire les initiales de chaque membre pour les dossards, et signaler les noms qui apparaissent deux fois sous des écritures différentes — les doublons que la recherche par numéro du premier jour ne pouvait pas voir.",
    sousQuestions: [
      { ref: "a", texte: "Normalise les douze noms du fichier dans un second tableau, en conservant intacts les noms d'origine. Justifie en une phrase pourquoi on ne remplace pas les originaux." },
      { ref: "b", texte: "Recherche un nom saisi au guichet, normalisé lui aussi, et annonce la position de l'adhérent ou son absence." },
      { ref: "c", texte: "Produis les initiales de chaque adhérent : la première lettre du nom, suivie de la première lettre qui suit le premier espace. Un nom sans espace ne donne qu'une initiale." },
      { ref: "d", texte: "Signale les doublons : deux fiches dont les noms normalisés sont identiques. Compte-les et affiche les couples de positions concernés." }
    ],
    reflexion: "Le premier jour de cette série, la recherche des doublons portait sur des numéros et se réglait en un parcours. Aujourd'hui elle porte sur des noms et te coûte bien davantage. Explique précisément d'où vient le surcoût — combien de comparaisons dans chaque cas sur douze fiches — et dis ce qui, dans la nature des données, l'explique. Puis : ton point d) compare toutes les fiches deux à deux. Combien de couples exactement, et pourquoi la formule n'est-elle pas simplement douze au carré ? Enfin, en regardant les quatre jours de la série : à quel moment le fichier a-t-il cessé d'être une liste pour devenir une base de données ?",
    principe: "Comparer <em>n</em> éléments deux à deux, sans se comparer soi-même ni compter deux fois le même couple, demande <code>n × (n − 1) / 2</code> comparaisons. Sur douze fiches, cela fait <strong>66</strong> comparaisons — et non 144. C'est la même somme triangulaire que le programme d'entraînement du jour 13, sous un autre visage : la boucle intérieure ne repart pas de 1, elle repart de l'indice de l'extérieure plus un.",
    indices: [
      "Quatre traitements sur les mêmes douze noms, et un choix de structure qui commande tout le reste : conserver les noms d'origine <em>et</em> leurs formes normalisées, dans deux tableaux parallèles. C'est ce doublement qui rend possibles à la fois l'affichage fidèle et la comparaison tolérante.",
      "Le plan : un premier parcours qui normalise chaque nom dans le second tableau. Une recherche qui normalise la saisie puis la compare aux formes normalisées, en s'arrêtant dès qu'elle trouve. Un parcours qui découpe chaque nom d'origine pour en tirer les initiales. Enfin un double parcours en triangle pour les doublons.",
      "En pseudocode, pour les doublons : <code>POUR i DE 1 A 11 FAIRE</code> · <code>POUR j DE i + 1 A 12 FAIRE</code> · si les deux formes normalisées coïncident, signaler le couple et compter · <code>FINPOUR</code> · <code>FINPOUR</code>. Remarque que la boucle intérieure démarre après l'extérieure.",
      "Le point délicat est le départ de la boucle intérieure. Le faire partir de 1 comparerait chaque fiche à elle-même — un doublon garanti pour les douze — et signalerait deux fois chaque vrai couple, dans un sens puis dans l'autre. Le faire partir de l'indice extérieur plus un supprime les deux défauts d'un coup, et divise le travail par un peu plus de deux.",
      "Ta copie ressemble à ceci : <br><code>POUR i … FAIRE norme[i] ← normalisation de nom[i] FINPOUR</code><br>une recherche interruptible sur <code>norme</code><br>un parcours qui cherche l'espace dans chaque nom<br><code>POUR i DE 1 A 11 FAIRE POUR j DE i + 1 A 12 FAIRE … FINPOUR FINPOUR</code>"
    ],
    solution: "Algorithme FichierNominatif\nConst\n    N = 12\nVar\n    nom : TABLEAU[1..12] DE CHAINES      /* forme d'origine, jamais modifiee */\n    norme : TABLEAU[1..12] DE CHAINES    /* forme de comparaison */\n    i, j, k, debut, fin, position, doublons : ENTIER\n    brut, propre, saisie, initiales : CHAINE\n    trouve : BOOLEEN\nDebut\n    /* a) DEUX tableaux paralleles. On ne remplace pas les originaux :\n          normaliser sert a COMPARER, jamais a STOCKER — le club doit\n          continuer d'imprimer les noms tels que leurs porteurs les ecrivent. */\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Nom de l'adherent \", i, \" ?\")\n        Lire(nom[i])\n\n        brut <- nom[i]\n        debut <- 1\n        TANT QUE debut <= LONGUEUR(brut) ET brut[debut] = \" \" FAIRE\n            debut <- debut + 1\n        FINTANTQUE\n        fin <- LONGUEUR(brut)\n        TANT QUE fin >= debut ET brut[fin] = \" \" FAIRE\n            fin <- fin - 1\n        FINTANTQUE\n        propre <- \"\"\n        POUR k DE debut A fin FAIRE\n            propre <- propre & brut[k]\n        FINPOUR\n        norme[i] <- MAJUSCULE(propre)\n    FINPOUR\n\n    /* b) recherche sur les formes NORMALISEES, arret des qu'on trouve */\n    Ecrire(\"Nom recherche ?\")\n    Lire(saisie)\n    saisie <- MAJUSCULE(saisie)\n    i <- 1\n    TANT QUE i <= N ET norme[i] <> saisie FAIRE\n        i <- i + 1\n    FINTANTQUE\n    SI i <= N ALORS\n        Ecrire(\"Trouve en position \", i, \" — fiche : \", nom[i])\n    SINON\n        Ecrire(\"Aucun adherent de ce nom\")\n    FINSI\n\n    /* c) initiales : premiere lettre, puis la premiere qui suit un espace */\n    POUR i DE 1 A N FAIRE\n        initiales <- MAJUSCULE(norme[i][1])\n        position <- 0\n        POUR k DE 1 A LONGUEUR(norme[i]) FAIRE\n            SI norme[i][k] = \" \" ET position = 0 ALORS\n                position <- k        /* le PREMIER espace seulement */\n            FINSI\n        FINPOUR\n        SI position > 0 ET position < LONGUEUR(norme[i]) ALORS\n            initiales <- initiales & norme[i][position + 1]\n        FINSI\n        Ecrire(\"Dossard \", i, \" : \", initiales)\n    FINPOUR\n\n    /* d) comparaison DEUX A DEUX en triangle : j part apres i, jamais de 1.\n          Partir de 1 comparerait chaque fiche a elle-meme et signalerait\n          chaque vrai couple deux fois. */\n    doublons <- 0\n    POUR i DE 1 A N - 1 FAIRE\n        POUR j DE i + 1 A N FAIRE\n            SI norme[i] = norme[j] ALORS\n                Ecrire(\"Doublon : fiches \", i, \" et \", j, \" — \", nom[i],\n                       \" / \", nom[j])\n                doublons <- doublons + 1\n            FINSI\n        FINPOUR\n    FINPOUR\n    Ecrire(doublons, \" doublon(s) detecte(s) sur \", N * (N - 1) / 2,\n           \" comparaisons\")\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le surcoût</strong> vient de ce qu'on ne cherche plus <em>une</em> valeur donnée mais <em>toutes</em> les coïncidences internes. Au jour 1, le bénévole présentait un numéro et l'on parcourait les quinze fiches : quinze comparaisons au pire, pour une question dont la cible était fournie. Aujourd'hui, aucune cible n'est donnée — il faut confronter chaque fiche à toutes les autres, soit soixante-six comparaisons sur douze fiches. La nature des données n'y est pour rien : c'est la nature de la <em>question</em> qui a changé, et le même surcoût existerait sur des numéros. Ce qui vient bien des données, en revanche, c'est que la comparaison elle-même est devenue coûteuse : comparer deux nombres est immédiat, comparer deux chaînes demande de les parcourir caractère par caractère — et il a fallu, en plus, les normaliser d'abord. Le vrai coût est donc double : plus de comparaisons, et chacune plus chère. <strong>Le nombre de couples</strong> vaut <code>12 × 11 / 2 = 66</code>, et non 144. Deux corrections successives : chaque fiche ne se compare pas à elle-même, ce qui retire les douze cas de la diagonale et laisse <code>12 × 11 = 132</code> ; puis chaque couple apparaît deux fois dans ce décompte — la fiche 3 avec la 7, puis la 7 avec la 3 — ce qui impose de diviser par deux. C'est exactement la somme triangulaire du jour 13 : <code>11 + 10 + 9 + … + 1 = 66</code>, où le nombre de tours de la boucle intérieure décroît d'un à chaque tour de l'extérieure. <strong>Le basculement en base de données</strong> s'est produit au jour 3, avec la grille de présences — et non au jour 2 comme on pourrait le croire. Aux jours 1 et 2, le fichier était une liste de valeurs sur laquelle on posait des questions : où est ce numéro, quelle est la moyenne d'âge. Au jour 3, il est devenu une <em>relation</em> entre deux ensembles — les adhérents et les séances — et l'on a pu poser des questions qui ne portaient plus sur des valeurs mais sur des liens : qui vient quand. C'est la définition même d'une base de données relationnelle, et la grille de douze par huit en est la forme la plus élémentaire. Le jour 4 n'a rien changé à cela : il a seulement rendu les données <em>sales</em>, c'est-à-dire réelles, et montré que la première chose que fait un système d'information est de nettoyer ce qu'on lui donne." }
    ],
    pourquoi: "Les deux tableaux sont maintenus en parallèle, avec la garantie tacite que la fiche <code>i</code> de l'un correspond à la fiche <code>i</code> de l'autre. Cette correspondance n'est écrite nulle part : elle n'existe que dans la discipline avec laquelle les deux tableaux sont remplis dans la même boucle. C'est fragile — insérer une fiche dans l'un sans l'autre romprait tout en silence — et c'est exactement le problème que résoudra plus tard une structure regroupant les champs d'une même fiche en un seul objet. En attendant, remplir les deux au même endroit est la seule protection disponible.",

    solution: "ALGORITHME Palindrome                        // nom de l'algorithme\nVARIABLES mot : CHAINE                       // la chaîne à tester\n          i, j, L : ENTIER                   // i = avance depuis le début, j = recule depuis la fin\n          estPalindrome : BOOLEEN            // le verdict en cours\nDEBUT                                        // début des instructions\n    L ← Longueur(mot)                        // nombre de lettres de la chaîne\n    i ← 1                                    // premier caractère\n    j ← L                                    // dernier caractère\n    estPalindrome ← VRAI                     // hypothèse optimiste de départ\n    TANT QUE i < j ET estPalindrome FAIRE    // on continue tant que : pas croisés ET pas de défaut\n        SI mot[i] <> mot[j] ALORS            // les deux lettres symétriques diffèrent ?\n            estPalindrome ← FAUX             // défaut trouvé → verdict négatif, la boucle s'arrête\n        SINON                                // lettres identiques →\n            i ← i + 1                        // avance l'indice de gauche\n            j ← j - 1                        // recule l'indice de droite\n        FINSI                                // fin du test de la paire\n    FINTANTQUE                               // sortie : indices croisés ou défaut trouvé\n    SI estPalindrome ALORS                   // bilan\n        Écrire(mot, \" est un palindrome\")    // toutes les paires concordent\n    SINON                                    // au moins une paire diffère\n        Écrire(mot, \" n'est pas un palindrome\") // verdict négatif\n    FINSI                                    // fin du bilan\nFIN                                          // fin de l'algorithme",
