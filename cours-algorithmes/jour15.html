<script>
var DAY = {
  num: 15,
  title: "Parcourir un tableau",
  subtitle: "La boucle POUR rencontre le tableau : le motif central de l'algorithmique.",
  theory: `
<h3>1. Le mariage POUR + tableau</h3>
<p>Rappel de vocabulaire avant tout : un <strong>tableau</strong> est une longue rangée de cases numérotées qui portent toutes le même nom (vu au jour 14) ; le numéro d'une case s'appelle son <strong>indice</strong>, et l'écriture <code>t[i]</code> se lit « la case numéro i du tableau t ». Rappelle-toi aussi qu'une <strong>boucle POUR</strong> répète des instructions un nombre connu de fois grâce à un <strong>compteur</strong> — une variable qui avance toute seule d'un tour à l'autre (jour 10). L'idée centrale d'aujourd'hui : comme l'indice d'un tableau peut être une variable, on se sert du compteur de la boucle COMME indice. La boucle fait alors défiler i = 1, puis 2, puis 3… et à chaque tour on touche une case différente. On dit qu'on <strong>parcourt</strong> le tableau, c'est-à-dire qu'on le traverse case par case, du début à la fin :</p>
<pre class="pseudo">POUR i DE 1 A TAILLE(t) FAIRE   // i démarre à 1 et monte jusqu'au nombre de cases (TAILLE(t))
    ... t[i] ...                // au tour numéro i, on travaille sur la case numéro i
FINPOUR                         // fin de la boucle : on recommence le tour avec i augmenté de 1</pre>
<p><code>TAILLE(t)</code> est une <strong>fonction</strong> (une opération toute prête que l'on réutilise) qui renvoie le <strong>nombre de cases</strong> du tableau, c'est-à-dire sa longueur ; pour aller plus vite on la note souvent <code>n</code>. Au 1ᵉʳ tour, <code>t[i]</code> désigne <code>t[1]</code> ; au 2ᵉ tour, <code>t[2]</code>… et ainsi de suite. Chaque case est visitée exactement une fois, ni plus, ni moins.</p>
<h3>2. Les parcours fondamentaux</h3>
<p>Un <strong>parcours</strong> n'est rien d'autre qu'une boucle qui passe sur toutes les cases pour y faire une action. Voici les quatre parcours que tu réutiliseras sans arrêt. <code>Écrire(...)</code> affiche une valeur à l'écran ; <code>Lire(...)</code> range dans une case ce que l'utilisateur tape au clavier.</p>
<pre class="pseudo">// AFFICHER toutes les valeurs
POUR i DE 1 A n FAIRE                  // i prend successivement 1, 2, 3, … jusqu'à n (le nombre de cases)
    Écrire(t[i])                       // affiche à l'écran la valeur rangée dans la case i
FINPOUR                                // fin du parcours : on passe à la case suivante

// REMPLIR par saisie utilisateur
POUR i DE 1 A n FAIRE                  // on visite chaque case, de la première à la dernière
    Lire(t[i])                         // on range dans la case i la valeur tapée au clavier
FINPOUR                                // fin du parcours : le tableau est entièrement rempli

// SOMMER (accumulateur du jour 12 !)
somme ← 0                              // l'accumulateur (la boîte qui totalise) démarre à 0 : rien d'ajouté
POUR i DE 1 A n FAIRE                  // on visite chaque case, de 1 à n
    somme ← somme + t[i]               // on ajoute la valeur de la case i à l'ancien total
FINPOUR                                // fin du parcours : somme contient l'addition de toutes les cases

// COMPTER sous condition (compteur du jour 12 !)
nb ← 0                                 // le compteur (la boîte qui dénombre) démarre à 0
POUR i DE 1 A n FAIRE                  // on visite chaque case, de 1 à n
    SI t[i] >= 10 ALORS                // la valeur de la case i est-elle au moins 10 ? (>= = « supérieur ou égal à »)
        nb ← nb + 1                    // oui → on compte une case de plus
    FINSI                              // fin du test
FINPOUR                                // fin du parcours : nb = nombre de valeurs supérieures ou égales à 10</pre>
<div class="tip">Tous les motifs déjà appris (compteur, accumulateur, SI) fonctionnent tels quels : on remplace juste « la valeur » par <code>t[i]</code>.</div>
<h3>3. Transformer un tableau</h3>
<p>On peut aussi <strong>modifier</strong> les cases pendant le parcours. Faire cela directement dans le tableau, sans en créer un second, s'appelle travailler <strong>sur place</strong> : on écrase l'ancienne valeur de chaque case par la nouvelle.</p>
<pre class="pseudo">// Augmenter tous les prix de 10 %
POUR i DE 1 A n FAIRE                  // on visite chaque case du tableau prix, de 1 à n
    prix[i] ← prix[i] * 1.10           // on remplace la case par sa valeur multipliée par 1,10 (soit +10 %)
FINPOUR                                // fin du parcours : toutes les cases ont été augmentées sur place</pre>
<h3>4. Parcours à l'envers et parcours partiel</h3>
<p>Le compteur n'est pas obligé d'aller de 1 à n en montant. Le mot <code>PAS</code> indique de combien i change à chaque tour : <code>PAS -1</code> le fait DESCENDRE de 1 au lieu de monter. Et on peut aussi ne commencer qu'à la case 2, par exemple, pour sauter la première.</p>
<pre class="pseudo">POUR i DE n A 1 PAS -1 FAIRE ...   // i part de n et DESCEND de 1 à chaque tour : de la fin vers le début
POUR i DE 2 A n FAIRE ...           // i part de 2 : on saute la case 1, donc toutes les cases sauf la première</pre>
<h3>5. Comparer des cases voisines</h3>
<p>Deux cases sont <strong>voisines</strong> quand leurs indices se suivent, comme <code>t[i]</code> et <code>t[i+1]</code>. Au tour i, on peut donc regarder une case ET celle juste à sa droite en même temps :</p>
<pre class="pseudo">// Le tableau est-il trié en ordre croissant ?
trie ← VRAI                        // drapeau : on suppose « oui, trié » au départ (on le baissera si on trouve un défaut)
POUR i DE 1 A n - 1 FAIRE          // on s'arrête à n-1 car on lira la voisine t[i+1] (attention : n-1 !)
    SI t[i] > t[i + 1] ALORS       // une case est-elle STRICTEMENT plus grande que sa voisine de droite ? (> = « supérieur à »)
        trie ← FAUX                // oui → l'ordre croissant est cassé : on baisse le drapeau
    FINSI                          // fin du test
FINPOUR                            // fin du parcours : trie vaut VRAI seulement si tout est en ordre croissant</pre>
<div class="warn">Si on accède à <code>t[i+1]</code>, la boucle doit s'arrêter à <code>n − 1</code>, sinon t[n+1] déborde ! Le « ±1 » est l'erreur favorite des débutants (et des experts).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>POUR i DE 1 A n FAIRE Écrire(t[i]) FINPOUR</code> ?", opts: ["Affiche n fois t[1]", "Affiche toutes les valeurs du tableau, dans l'ordre", "Affiche les indices", "Efface le tableau"], a: 1, exp: "i avance : t[1], t[2], … t[n]." },

    { type: "input", q: "t = [ 12 ][ 9 ][ 15 ][ 8 ][ 11 ]. Que vaut le compteur des valeurs >= 10 ?", a: "3", ph: "nombre", exp: "12, 15 et 11 : trois valeurs." },

    { type: "qcm", q: "Pour afficher un tableau À L'ENVERS (de la dernière case à la première) :", opts: ["POUR i DE 1 A n", "POUR i DE n A 1 PAS -1", "TANT QUE t[i] > 0", "POUR i DE n A 1 PAS 2"], a: 1, exp: "Le pas négatif fait descendre l'indice." },
    { type: "qcm", q: "Dans le test « tableau trié ? », pourquoi la boucle va-t-elle de 1 à n−1 et pas à n ?", opts: ["Pour aller plus vite", "Parce qu'on lit t[i+1] : au tour n, t[n+1] n'existerait pas", "Parce que le tableau commence à 0", "C'est une erreur du cours"], a: 1, exp: "Accès à i+1 → borne n−1. Le réflexe anti-débordement." },
    { type: "qcm", q: "t = [ 3 ][ 5 ][ 4 ][ 8 ]. Que vaut <code>trie</code> après le test de tri croissant ?", opts: ["VRAI", "FAUX"], a: 1, exp: "t[2]=5 > t[3]=4 : une inversion suffit, trie ← FAUX." },

    { type: "qcm", q: "Comment remplir un tableau de 10 notes saisies par l'utilisateur ?", opts: ["Lire(t)", "POUR i DE 1 A 10 FAIRE Lire(t[i]) FINPOUR", "t ← 10 notes", "Écrire(t[i])"], a: 1, exp: "Un Lire par case, piloté par la boucle." },
    { type: "input", q: "t = [ 5 ][ 3 ][ 5 ][ 5 ][ 1 ]. Combien de fois la valeur 5 apparaît-elle (comptage avec SI t[i] = 5) ?", a: "3", ph: "nombre", exp: "Cases 1, 3 et 4 : trois occurrences." },
    { type: "qcm", q: "Que calcule : <code>s ← 0 ; POUR i DE 1 A n FAIRE s ← s + 1 FINPOUR</code> ? (attention !)", opts: ["La somme des valeurs", "La taille n du tableau : on ajoute 1 par case, pas t[i]", "Toujours 0", "Le maximum"], a: 1, exp: "s + 1 compte les cases ; s + t[i] additionnerait les valeurs. Un caractère change tout." },
    { type: "input", q: "t = [ 2 ][ 4 ][ 6 ]. Après <code>POUR i DE 1 A 3 FAIRE t[i] ← t[i] + i FINPOUR</code>, que vaut t[3] ?", a: "9", ph: "nombre", exp: "t[3] ← 6 + 3 = 9 (t devient [3][6][9])." },
    { type: "qcm", q: "moyenne d'un tableau de n valeurs : quel enchaînement ?", opts: ["somme en boucle, puis diviser par n APRÈS la boucle", "diviser chaque case par n avant de sommer... c'est pareil", "somme / n dans la boucle à chaque tour", "Les réponses A et B sont toutes deux correctes"], a: 3, exp: "Mathématiquement les deux marchent, mais la version A (somme puis division unique) est le motif standard : plus simple et plus précis." },
    { type: "vf", q: "Le parcours <code>POUR i DE 2 A n FAIRE SI t[i] ≠ t[i-1] … </code> est sûr (pas de débordement).", a: true, exp: "On lit t[i-1] : en partant de i=2, le plus petit accès est t[1]. Borne de départ adaptée = pas de débordement." }
  ],
  final: {
    title: "Exercice final — L'audit de la boutique",
    intro: `<p>Une boutique relève ses ventes des 6 derniers jours : <code>ventes = [ 120 ][ 80 ][ 150 ][ 60 ][ 90 ][ 100 ]</code> (en €). L'algorithme fait un audit complet :</p>
<pre class="pseudo">ALGORITHME Audit                     // nom de l'algorithme
DEBUT                                // début des instructions
    total ← 0                        // accumulateur du chiffre d'affaires : démarre à 0
    nbBons ← 0                       // compteur des jours >= 100 € : démarre à 0
    POUR i DE 1 A 6 FAIRE            // premier parcours : les 6 jours, de 1 à 6
        total ← total + ventes[i]    // on ajoute la vente du jour i au total courant
        SI ventes[i] >= 100 ALORS    // la vente du jour i atteint-elle 100 € ? (>= = « au moins »)
            nbBons ← nbBons + 1      // oui → un bon jour de plus
        FINSI                        // fin du test
    FINPOUR                          // fin du premier parcours
    moyenne ← total / 6              // moyenne = total divisé par le nombre de jours (6)
    // puis : baisse ← nombre de jours où ventes[i] < ventes[i-1]
    baisse ← 0                       // compteur des jours en baisse : démarre à 0
    POUR i DE 2 A 6 FAIRE            // second parcours : on démarre à 2 car on lit la veille ventes[i-1]
        SI ventes[i] < ventes[i - 1] ALORS   // le jour i a-t-il vendu moins que la veille ? (< = « inférieur à »)
            baisse ← baisse + 1      // oui → un jour de baisse de plus
        FINSI                        // fin du test
    FINPOUR                          // fin du second parcours
FIN                                  // fin de l'algorithme</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>total</code> ?", a: "600", ph: "nombre", exp: "120+80+150+60+90+100 = 600 €." },
      { type: "input", q: "Que vaut <code>moyenne</code> ?", a: "100", ph: "nombre", exp: "600 / 6 = 100 € par jour." },
      { type: "input", q: "Que vaut <code>nbBons</code> (jours >= 100) ?", a: "3", ph: "nombre", exp: "120, 150 et 100 : trois bons jours." },
      { type: "input", q: "Que vaut <code>baisse</code> (jours en baisse par rapport à la veille) ?", a: "2", ph: "nombre", exp: "80 < 120 (oui), 150 < 80 (non), 60 < 150 (oui), 90 < 60 (non), 100 < 90 (non) → 2." },
      { type: "qcm", q: "Pourquoi la 2ᵉ boucle commence-t-elle à i = 2 ?", opts: ["Pour gagner du temps", "Parce qu'on compare avec ventes[i-1] : à i=1, ventes[0] n'existe pas", "Parce que lundi ne compte pas", "Erreur d'énoncé"], a: 1, exp: "Accès à i−1 → départ à 2. Le réflexe anti-débordement, dans l'autre sens." }
    ],
    solution: `<p>Trace de l'audit :</p>

  }

      "Le point délicat est la valeur absolue. Comparer directement les écarts signés désignerait le plus grand écart <em>positif</em>, c'est-à-dire l'objet le plus faible — et sur ces données, la réponse serait le cinquième objet au lieu du premier. Les deux nombres sont proches, tous deux plausibles, et rien ne signale l'erreur : c'est le classement qui est faux, pas le calcul.",

    solution: "Algorithme MagnitudesCatalogue\nConst\n    NB = 8\nVar\n    magnitude : TABLEAU[1..8] DE REELS\n    i, brillants, faibles, egaux, recordNum : ENTIER\n    total, moyenne, ecart, absolu, recordEcart : REEL\nDebut\n    /* PREMIER parcours : il n'a qu'un but, obtenir la moyenne */\n    total <- 0\n    POUR i DE 1 A NB FAIRE\n        Ecrire(\"Magnitude de l'objet \", i, \" ?\")\n        Lire(magnitude[i])\n        total <- total + magnitude[i]\n    FINPOUR\n\n    moyenne <- total / NB\n    Ecrire(\"Magnitude moyenne : \", Arrondi(moyenne, 2))\n\n    brillants <- 0\n    faibles <- 0\n    egaux <- 0\n    recordEcart <- -1\n    recordNum <- 0\n\n    /* SECOND parcours : impossible plus tot, il a besoin de la moyenne.\n       C'est le tableau qui le rend possible : sans lui, les magnitudes\n       n'existeraient plus au moment ou la moyenne devient connue. */\n    POUR i DE 1 A NB FAIRE\n        ecart <- magnitude[i] - moyenne\n\n        /* valeur absolue : un ecart de -2,76 est aussi grand qu'un de +2,76.\n           Comparer les ecarts SIGNES designerait le plus grand ecart positif,\n           donc l'objet le plus faible — et la reponse serait fausse sans\n           qu'aucun calcul ne le soit. */\n        SI ecart < 0 ALORS\n            absolu <- -ecart\n        SINON\n            absolu <- ecart\n        FINSI\n\n        SI absolu > recordEcart ALORS\n            recordEcart <- absolu\n            recordNum <- i\n        FINSI\n\n        /* b) magnitude PLUS PETITE = objet plus brillant : l'echelle est inversee */\n        SI magnitude[i] < moyenne ALORS\n            brillants <- brillants + 1\n        SINON SI magnitude[i] > moyenne ALORS\n            faibles <- faibles + 1\n        SINON\n            egaux <- egaux + 1     /* ni au-dessus ni en dessous : compte a part */\n        FINSI\n\n        /* d) affichage signe */\n        SI ecart >= 0 ALORS\n            Ecrire(\"Objet \", i, \" : \", magnitude[i], \" (+\", Arrondi(absolu, 2), \")\")\n        SINON\n            Ecrire(\"Objet \", i, \" : \", magnitude[i], \" (-\", Arrondi(absolu, 2), \")\")\n        FINSI\n    FINPOUR\n\n    Ecrire(brillants, \" objet(s) plus brillants que la moyenne\")\n    Ecrire(faibles, \" objet(s) moins brillants\")\n    Ecrire(egaux, \" objet(s) exactement a la moyenne\")\n    Ecrire(\"Ecart maximal : objet \", recordNum, \" a \", Arrondi(recordEcart, 2))\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Ce qui empêche le parcours unique</strong> est une dépendance de sens, pas de code : trois des quatre questions ont besoin de la moyenne, et la moyenne n'existe qu'une fois <em>toutes</em> les valeurs additionnées. Au troisième objet, je ne peux pas dire s'il est au-dessus de la moyenne, parce que les cinq objets suivants la feront encore bouger. Le second parcours devient possible exactement à l'instant où la première boucle se referme : ni avant, ni plus tard. C'est un motif très général — toute question relative à une propriété globale d'un ensemble exige deux passages, un pour établir la propriété, un pour situer chaque élément par rapport à elle. <strong>Sans tableau, l'exercice serait irréalisable</strong> en une seule saisie. Au jour 12, chaque valeur était lue, utilisée, puis perdue : au moment où la moyenne devient connue, les huit magnitudes n'existent plus nulle part, et il faudrait redemander à l'astronome de tout ressaisir — huit valeurs pour un catalogue, des milliers pour un vrai relevé, avec le risque qu'il se trompe et que les deux passages ne portent pas sur les mêmes données. C'est <em>la</em> raison d'être du tableau, et elle est plus profonde que le confort : il permet de poser à des données une question qu'on n'avait pas prévue au moment de les acquérir. <strong>La surprise</strong> vient de ce que le catalogue est déséquilibré : trois objets se serrent entre 3,4 et 4,0 tandis que quatre autres s'étalent entre 6,9 et 8,8. La moyenne, tirée vers le haut par ce groupe supérieur plus nombreux, se fixe à 6,16 — une valeur qu'<em>aucun</em> objet ne porte, et qui tombe dans le vide entre les deux groupes. L'objet le plus brillant se retrouve alors plus loin de ce centre théorique que l'objet le plus faible. Ce que cela dit d'une moyenne : elle ne décrit bien un ensemble que s'il est ramassé autour d'elle. Dès qu'il se sépare en groupes, elle indique un point où il n'y a personne, et toute conclusion tirée d'elle — « l'objet typique du catalogue a une magnitude de 6,2 » — devient une affirmation sur un objet qui n'existe pas. C'est la même leçon que le cachet moyen du festival au jour 19 du cours de Python, sous un autre visage : la moyenne est une position, pas une description." }
    ],
    pourquoi: "Le cas de l'objet exactement à la moyenne est compté séparément plutôt que rattaché à l'une des deux catégories. Sur ces données il vaut zéro et n'apparaîtra jamais — la moyenne est 6,1625, qu'aucune magnitude à une décimale ne peut valoir. Mais le compter à part coûte trois lignes et transforme une hypothèse tacite en fait vérifiable : si ce compteur devenait non nul un jour, on le verrait. Un cas qu'on croit impossible mérite d'être compté plutôt que supposé.",

    hier: "jour14.html",
    enonce: "Dernier jour de la série. Le carnet conserve désormais les sept houles moyennes de la semaine dans un tableau, et l'inspection maritime réclame le bilan complet. L'algorithme doit produire, en exploitant ce tableau : la houle totale et la houle moyenne de la semaine ; le nombre de journées de mauvaise mer, c'est-à-dire à 3 mètres ou plus ; la journée la plus agitée et la plus calme, avec leurs numéros ; le nombre de journées au-dessus de la moyenne hebdomadaire ; et enfin la plus longue série de journées consécutives de mauvaise mer, avec le jour où elle commence.",

    reflexion: "La série d'aujourd'hui a suivi le carnet pendant quatre jours : un relevé quotidien traité au vol, puis quatre créneaux par jour avec deux boucles emboîtées, puis un tableau qui conserve, puis ce bilan complet. Pour chacune des cinq questions de l'énoncé, dis à quel jour de la série elle serait devenue possible — et pour celles qui ne l'auraient pas été plus tôt, dis ce qui manquait exactement. Puis, sur le point d) : ton compteur de série en cours se remet à zéro à un endroit précis. Que produirait exactement l'oubli de cette remise à zéro, et le résultat aurait-il l'air faux ?",
    indices: [
      "Cinq questions, dont quatre se règlent en deux parcours et une, la dernière, demande une manière de compter qu'aucun exercice de la semaine n'a encore employée : suivre une propriété qui s'installe et se rompt, plutôt que compter des cas isolés.",
      "Le plan : remplir en cumulant, ce qui donne la moyenne. Reparcourir en traitant d'un coup les extrema, le décompte de mauvaise mer, le comptage au-dessus de la moyenne et le suivi des séries. Ce second parcours a besoin de la moyenne ; le suivi des séries, lui, n'en a pas besoin mais ne coûte rien à y loger.",
      "En pseudocode, pour la dernière question : <code>serie ← 0 ; recordSerie ← 0 ; debut ← 0</code> · <code>POUR j FAIRE</code> · si la journée est mauvaise, allonger la série en cours puis, si elle bat le record, mémoriser sa longueur et en déduire son jour de départ · sinon, rompre la série · <code>FINPOUR</code>.",
      "Le point délicat est le calcul du jour de début. Au moment où l'on constate un nouveau record, on est à la <em>fin</em> de la série, pas à son commencement : le jour de départ se retrouve en reculant de la longueur de la série moins un. L'oubli du « moins un » décale le début d'une journée, ce qui donne un bilan cohérent et faux — et l'erreur ne se voit pas sur une série de longueur 1, où elle est sans effet.",

    ],
    solution: "Algorithme BilanDeLaSemaine\nConst\n    JOURS = 7\n    SEUIL = 3\nVar\n    houle : TABLEAU[1..7] DE REELS\n    j, mauvaises, auDessus : ENTIER\n    jourFort, jourCalme : ENTIER\n    serie, recordSerie, debutSerie : ENTIER\n    total, moyenne, plusForte, plusCalme : REEL\nDebut\n    /* a) premier parcours : remplir et cumuler */\n    total <- 0\n    POUR j DE 1 A JOURS FAIRE\n        Ecrire(\"Houle moyenne du jour \", j, \" (m) ?\")\n        Lire(houle[j])\n        total <- total + houle[j]\n    FINPOUR\n    moyenne <- total / JOURS\n\n    mauvaises <- 0\n    auDessus <- 0\n    plusForte <- -1           /* impossible pour une houle */\n    plusCalme <- 999999       /* pour un MINIMUM, on part tres haut */\n    jourFort <- 0\n    jourCalme <- 0\n    serie <- 0\n    recordSerie <- 0\n    debutSerie <- 0\n\n    /* b), c) et d) : un seul parcours, mais il doit venir APRES la moyenne */\n    POUR j DE 1 A JOURS FAIRE\n        SI houle[j] > plusForte ALORS\n            plusForte <- houle[j]\n            jourFort <- j\n        FINSI\n        SI houle[j] < plusCalme ALORS\n            plusCalme <- houle[j]\n            jourCalme <- j\n        FINSI\n\n        SI houle[j] > moyenne ALORS\n            auDessus <- auDessus + 1\n        FINSI\n\n        /* d) suivre une propriete qui s'INSTALLE et se ROMPT */\n        SI houle[j] >= SEUIL ALORS\n            mauvaises <- mauvaises + 1\n            serie <- serie + 1\n            SI serie > recordSerie ALORS\n                recordSerie <- serie\n                /* on est a la FIN de la serie : on recule de sa longueur,\n                   moins un, pour retrouver son premier jour */\n                debutSerie <- j - serie + 1\n            FINSI\n        SINON\n            serie <- 0        /* la rupture : sans cette ligne, la serie ne\n                                 se romprait jamais et compterait TOUTES les\n                                 mauvaises journees, meme separees */\n        FINSI\n    FINPOUR\n\n    Ecrire(\"Houle totale : \", Arrondi(total, 2), \" m\")\n    Ecrire(\"Houle moyenne : \", Arrondi(moyenne, 2), \" m\")\n    Ecrire(mauvaises, \" journee(s) de mauvaise mer\")\n    Ecrire(\"Plus agitee : jour \", jourFort, \" (\", plusForte, \" m)\")\n    Ecrire(\"Plus calme : jour \", jourCalme, \" (\", plusCalme, \" m)\")\n    Ecrire(auDessus, \" journee(s) au-dessus de la moyenne\")\n    Ecrire(\"Plus longue serie : \", recordSerie, \" jour(s) a partir du jour \",\n           debutSerie)\nFin",
    reponses: [
      { ref: "c", texte: "Le comptage des journées au-dessus de la moyenne ne peut pas figurer dans un parcours qui n'aurait pas encore établi cette moyenne : au troisième jour, on ignore ce que vaudra la moyenne de la semaine, puisque quatre journées ne sont pas encore lues. Il faut donc que la totalité des valeurs ait été additionnée avant que la comparaison ait un sens — c'est-à-dire un premier parcours complet, puis la division, puis seulement le comptage. Les extrema et le décompte de mauvaise mer, eux, ne dépendent que d'un seuil fixe et d'une comparaison entre valeurs déjà vues : ils pourraient parfaitement se calculer pendant la saisie." },
      { ref: "Réflexion", texte: "<strong>Question par question.</strong> Le <em>total et la moyenne</em> étaient possibles dès le jour 1 : un accumulateur suffit, aucune conservation n'est nécessaire. Le <em>décompte des journées de mauvaise mer</em> aussi, dès le jour 1, pour la même raison. Les <em>extrema avec leurs numéros</em> également dès le jour 1 : le couple valeur-indice se tient au vol. Le <em>comptage au-dessus de la moyenne</em>, en revanche, exigeait le jour 3 et son tableau : il faut revenir sur les données après avoir calculé la moyenne, et jusque-là les valeurs étaient perdues au fur et à mesure. Ce qui manquait était exactement cela — la possibilité de relire. La <em>plus longue série consécutive</em> est le cas intéressant : elle aurait été possible dès le jour 1, car elle ne demande jamais de revenir en arrière, seulement de se souvenir de ce qui vient de se passer. C'est un contre-exemple utile à l'idée que « conserver » et « traiter dans l'ordre » seraient la même chose : une propriété portant sur des voisins immédiats se calcule au vol, sans mémoire d'ensemble. <strong>L'oubli de la remise à zéro.</strong> Sans elle, le compteur de série ne se romprait jamais : il compterait toutes les journées de mauvaise mer, consécutives ou non. Sur mes données, il annoncerait une série de <strong>trois</strong> jours au lieu de deux — les jours 3, 4 et 7 additionnés comme s'ils se suivaient. Le résultat n'aurait <em>absolument pas</em> l'air faux : trois est un nombre plausible, inférieur à sept, cohérent avec le décompte de mauvaise mer affiché juste au-dessus — trop cohérent, même, puisque le compteur de série deviendrait alors un doublon exact du compteur de mauvaises journées. C'est d'ailleurs le seul indice qui trahirait la faute à la relecture : deux quantités censées mesurer des choses différentes qui donnent toujours le même nombre. Le jour de début, lui, deviendrait faux aussi — il indiquerait le jour 5, qui n'est pas une journée de mauvaise mer du tout — mais il faudrait le vérifier à la main pour s'en apercevoir." }
