<script>
var DAY = {
  num: 15,
  title: "Parcourir un tableau",
  subtitle: "La boucle POUR rencontre le tableau : le motif central de l'algorithmique.",
  theory: `
<h3>1. Le mariage POUR + tableau</h3>
<p>Rappel de vocabulaire avant tout : un <strong>tableau</strong> est une longue rangée de cases numérotées qui portent toutes le même nom (vu au jour 14) ; le numéro d'une case s'appelle son <strong>indice</strong>, et l'écriture <code>t[i]</code> se lit « la case numéro i du tableau t ». Rappelle-toi aussi qu'une <strong>boucle POUR</strong> répète des instructions un nombre connu de fois grâce à un <strong>compteur</strong> — une variable qui avance toute seule d'un tour à l'autre (jour 10). L'idée centrale d'aujourd'hui : comme l'indice d'un tableau peut être une variable, on se sert du compteur de la boucle COMME indice. La boucle fait alors défiler i = 1, puis 2, puis 3… et à chaque tour on touche une case différente. On dit qu'on <strong>parcourt</strong> le tableau, c'est-à-dire qu'on le traverse case par case, du début à la fin :</p>
<pre class="pseudo">POUR i DE 1 A TAILLE(t) FAIRE   // i démarre à 1 et monte jusqu'au nombre de cases (TAILLE(t))
    ... t[i] ...                // au tour numéro i, on travaille sur la case numéro i
FINPOUR                         // fin de la boucle : on recommence le tour avec i augmenté de 1</pre>
<p><code>TAILLE(t)</code> est une <strong>fonction</strong> (une opération toute prête que l'on réutilise) qui renvoie le <strong>nombre de cases</strong> du tableau, c'est-à-dire sa longueur ; pour aller plus vite on la note souvent <code>n</code>. Au 1ᵉʳ tour, <code>t[i]</code> désigne <code>t[1]</code> ; au 2ᵉ tour, <code>t[2]</code>… et ainsi de suite. Chaque case est visitée exactement une fois, ni plus, ni moins.</p>
<h3>2. Les parcours fondamentaux</h3>
<p>Un <strong>parcours</strong> n'est rien d'autre qu'une boucle qui passe sur toutes les cases pour y faire une action. Voici les quatre parcours que tu réutiliseras sans arrêt. <code>Écrire(...)</code> affiche une valeur à l'écran ; <code>Lire(...)</code> range dans une case ce que l'utilisateur tape au clavier.</p>
<pre class="pseudo">// AFFICHER toutes les valeurs
POUR i DE 1 A n FAIRE                  // i prend successivement 1, 2, 3, … jusqu'à n (le nombre de cases)
    Écrire(t[i])                       // affiche à l'écran la valeur rangée dans la case i
FINPOUR                                // fin du parcours : on passe à la case suivante

// REMPLIR par saisie utilisateur
POUR i DE 1 A n FAIRE                  // on visite chaque case, de la première à la dernière
    Lire(t[i])                         // on range dans la case i la valeur tapée au clavier
FINPOUR                                // fin du parcours : le tableau est entièrement rempli

// SOMMER (accumulateur du jour 12 !)
somme ← 0                              // l'accumulateur (la boîte qui totalise) démarre à 0 : rien d'ajouté
POUR i DE 1 A n FAIRE                  // on visite chaque case, de 1 à n
    somme ← somme + t[i]               // on ajoute la valeur de la case i à l'ancien total
FINPOUR                                // fin du parcours : somme contient l'addition de toutes les cases

// COMPTER sous condition (compteur du jour 12 !)
nb ← 0                                 // le compteur (la boîte qui dénombre) démarre à 0
POUR i DE 1 A n FAIRE                  // on visite chaque case, de 1 à n
    SI t[i] >= 10 ALORS                // la valeur de la case i est-elle au moins 10 ? (>= = « supérieur ou égal à »)
        nb ← nb + 1                    // oui → on compte une case de plus
    FINSI                              // fin du test
FINPOUR                                // fin du parcours : nb = nombre de valeurs supérieures ou égales à 10</pre>
<div class="tip">Tous les motifs déjà appris (compteur, accumulateur, SI) fonctionnent tels quels : on remplace juste « la valeur » par <code>t[i]</code>.</div>
<h3>3. Transformer un tableau</h3>
<p>On peut aussi <strong>modifier</strong> les cases pendant le parcours. Faire cela directement dans le tableau, sans en créer un second, s'appelle travailler <strong>sur place</strong> : on écrase l'ancienne valeur de chaque case par la nouvelle.</p>
<pre class="pseudo">// Augmenter tous les prix de 10 %
POUR i DE 1 A n FAIRE                  // on visite chaque case du tableau prix, de 1 à n
    prix[i] ← prix[i] * 1.10           // on remplace la case par sa valeur multipliée par 1,10 (soit +10 %)
FINPOUR                                // fin du parcours : toutes les cases ont été augmentées sur place</pre>
<h3>4. Parcours à l'envers et parcours partiel</h3>
<p>Le compteur n'est pas obligé d'aller de 1 à n en montant. Le mot <code>PAS</code> indique de combien i change à chaque tour : <code>PAS -1</code> le fait DESCENDRE de 1 au lieu de monter. Et on peut aussi ne commencer qu'à la case 2, par exemple, pour sauter la première.</p>
<pre class="pseudo">POUR i DE n A 1 PAS -1 FAIRE ...   // i part de n et DESCEND de 1 à chaque tour : de la fin vers le début
POUR i DE 2 A n FAIRE ...           // i part de 2 : on saute la case 1, donc toutes les cases sauf la première</pre>
<h3>5. Comparer des cases voisines</h3>
<p>Deux cases sont <strong>voisines</strong> quand leurs indices se suivent, comme <code>t[i]</code> et <code>t[i+1]</code>. Au tour i, on peut donc regarder une case ET celle juste à sa droite en même temps :</p>
<pre class="pseudo">// Le tableau est-il trié en ordre croissant ?
trie ← VRAI                        // drapeau : on suppose « oui, trié » au départ (on le baissera si on trouve un défaut)
POUR i DE 1 A n - 1 FAIRE          // on s'arrête à n-1 car on lira la voisine t[i+1] (attention : n-1 !)
    SI t[i] > t[i + 1] ALORS       // une case est-elle STRICTEMENT plus grande que sa voisine de droite ? (> = « supérieur à »)
        trie ← FAUX                // oui → l'ordre croissant est cassé : on baisse le drapeau
    FINSI                          // fin du test
FINPOUR                            // fin du parcours : trie vaut VRAI seulement si tout est en ordre croissant</pre>
<div class="warn">Si on accède à <code>t[i+1]</code>, la boucle doit s'arrêter à <code>n − 1</code>, sinon t[n+1] déborde ! Le « ±1 » est l'erreur favorite des débutants (et des experts).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>POUR i DE 1 A n FAIRE Écrire(t[i]) FINPOUR</code> ?", opts: ["Affiche n fois t[1]", "Affiche toutes les valeurs du tableau, dans l'ordre", "Affiche les indices", "Efface le tableau"], a: 1, exp: "i avance : t[1], t[2], … t[n]." },
    { type: "input", q: "t = [ 4 ][ 7 ][ 1 ][ 8 ]. Que vaut la somme calculée par le parcours accumulateur ?", a: "20", ph: "nombre", exp: "4+7+1+8 = 20." },
    { type: "input", q: "t = [ 12 ][ 9 ][ 15 ][ 8 ][ 11 ]. Que vaut le compteur des valeurs >= 10 ?", a: "3", ph: "nombre", exp: "12, 15 et 11 : trois valeurs." },
    { type: "qcm", q: "Après <code>POUR i DE 1 A 4 FAIRE t[i] ← i * 2 FINPOUR</code>, que contient t ?", opts: ["[ 2 ][ 4 ][ 6 ][ 8 ]", "[ 1 ][ 2 ][ 3 ][ 4 ]", "[ 8 ][ 6 ][ 4 ][ 2 ]", "[ 2 ][ 2 ][ 2 ][ 2 ]"], a: 0, exp: "Chaque case reçoit le double de son indice." },
    { type: "qcm", q: "prix = [ 10 ][ 20 ]. Après <code>POUR i DE 1 A 2 FAIRE prix[i] ← prix[i] * 1.10 FINPOUR</code> ?", opts: ["[ 10 ][ 20 ]", "[ 11 ][ 22 ]", "[ 20 ][ 30 ]", "[ 1.1 ][ 2.2 ]"], a: 1, exp: "Chaque case est augmentée de 10 % sur place." },
    { type: "qcm", q: "Pour afficher un tableau À L'ENVERS (de la dernière case à la première) :", opts: ["POUR i DE 1 A n", "POUR i DE n A 1 PAS -1", "TANT QUE t[i] > 0", "POUR i DE n A 1 PAS 2"], a: 1, exp: "Le pas négatif fait descendre l'indice." },
    { type: "qcm", q: "Dans le test « tableau trié ? », pourquoi la boucle va-t-elle de 1 à n−1 et pas à n ?", opts: ["Pour aller plus vite", "Parce qu'on lit t[i+1] : au tour n, t[n+1] n'existerait pas", "Parce que le tableau commence à 0", "C'est une erreur du cours"], a: 1, exp: "Accès à i+1 → borne n−1. Le réflexe anti-débordement." },
    { type: "qcm", q: "t = [ 3 ][ 5 ][ 4 ][ 8 ]. Que vaut <code>trie</code> après le test de tri croissant ?", opts: ["VRAI", "FAUX"], a: 1, exp: "t[2]=5 > t[3]=4 : une inversion suffit, trie ← FAUX." },
    { type: "input", q: "t = [ 6 ][ 2 ][ 9 ][ 4 ][ 5 ]. Parcours : <code>c ← 0 ; POUR i DE 1 A 5 FAIRE SI t[i] MOD 2 = 0 ALORS c ← c + 1 FINSI FINPOUR</code>. c = ?", a: "3", ph: "nombre", exp: "6, 2 et 4 sont pairs : c = 3." },
    { type: "qcm", q: "Comment remplir un tableau de 10 notes saisies par l'utilisateur ?", opts: ["Lire(t)", "POUR i DE 1 A 10 FAIRE Lire(t[i]) FINPOUR", "t ← 10 notes", "Écrire(t[i])"], a: 1, exp: "Un Lire par case, piloté par la boucle." },
    { type: "input", q: "t = [ 5 ][ 3 ][ 5 ][ 5 ][ 1 ]. Combien de fois la valeur 5 apparaît-elle (comptage avec SI t[i] = 5) ?", a: "3", ph: "nombre", exp: "Cases 1, 3 et 4 : trois occurrences." },
    { type: "qcm", q: "Que calcule : <code>s ← 0 ; POUR i DE 1 A n FAIRE s ← s + 1 FINPOUR</code> ? (attention !)", opts: ["La somme des valeurs", "La taille n du tableau : on ajoute 1 par case, pas t[i]", "Toujours 0", "Le maximum"], a: 1, exp: "s + 1 compte les cases ; s + t[i] additionnerait les valeurs. Un caractère change tout." },
    { type: "input", q: "t = [ 2 ][ 4 ][ 6 ]. Après <code>POUR i DE 1 A 3 FAIRE t[i] ← t[i] + i FINPOUR</code>, que vaut t[3] ?", a: "9", ph: "nombre", exp: "t[3] ← 6 + 3 = 9 (t devient [3][6][9])." },
    { type: "qcm", q: "moyenne d'un tableau de n valeurs : quel enchaînement ?", opts: ["somme en boucle, puis diviser par n APRÈS la boucle", "diviser chaque case par n avant de sommer... c'est pareil", "somme / n dans la boucle à chaque tour", "Les réponses A et B sont toutes deux correctes"], a: 3, exp: "Mathématiquement les deux marchent, mais la version A (somme puis division unique) est le motif standard : plus simple et plus précis." },
    { type: "vf", q: "Le parcours <code>POUR i DE 2 A n FAIRE SI t[i] ≠ t[i-1] … </code> est sûr (pas de débordement).", a: true, exp: "On lit t[i-1] : en partant de i=2, le plus petit accès est t[1]. Borne de départ adaptée = pas de débordement." }
  ],
  final: {
    title: "Exercice final — L'audit de la boutique",
    intro: `<p>Une boutique relève ses ventes des 6 derniers jours : <code>ventes = [ 120 ][ 80 ][ 150 ][ 60 ][ 90 ][ 100 ]</code> (en €). L'algorithme fait un audit complet :</p>
<pre class="pseudo">ALGORITHME Audit                     // nom de l'algorithme
DEBUT                                // début des instructions
    total ← 0                        // accumulateur du chiffre d'affaires : démarre à 0
    nbBons ← 0                       // compteur des jours >= 100 € : démarre à 0
    POUR i DE 1 A 6 FAIRE            // premier parcours : les 6 jours, de 1 à 6
        total ← total + ventes[i]    // on ajoute la vente du jour i au total courant
        SI ventes[i] >= 100 ALORS    // la vente du jour i atteint-elle 100 € ? (>= = « au moins »)
            nbBons ← nbBons + 1      // oui → un bon jour de plus
        FINSI                        // fin du test
    FINPOUR                          // fin du premier parcours
    moyenne ← total / 6              // moyenne = total divisé par le nombre de jours (6)
    // puis : baisse ← nombre de jours où ventes[i] < ventes[i-1]
    baisse ← 0                       // compteur des jours en baisse : démarre à 0
    POUR i DE 2 A 6 FAIRE            // second parcours : on démarre à 2 car on lit la veille ventes[i-1]
        SI ventes[i] < ventes[i - 1] ALORS   // le jour i a-t-il vendu moins que la veille ? (< = « inférieur à »)
            baisse ← baisse + 1      // oui → un jour de baisse de plus
        FINSI                        // fin du test
    FINPOUR                          // fin du second parcours
FIN                                  // fin de l'algorithme</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>total</code> ?", a: "600", ph: "nombre", exp: "120+80+150+60+90+100 = 600 €." },
      { type: "input", q: "Que vaut <code>moyenne</code> ?", a: "100", ph: "nombre", exp: "600 / 6 = 100 € par jour." },
      { type: "input", q: "Que vaut <code>nbBons</code> (jours >= 100) ?", a: "3", ph: "nombre", exp: "120, 150 et 100 : trois bons jours." },
      { type: "input", q: "Que vaut <code>baisse</code> (jours en baisse par rapport à la veille) ?", a: "2", ph: "nombre", exp: "80 < 120 (oui), 150 < 80 (non), 60 < 150 (oui), 90 < 60 (non), 100 < 90 (non) → 2." },
      { type: "qcm", q: "Pourquoi la 2ᵉ boucle commence-t-elle à i = 2 ?", opts: ["Pour gagner du temps", "Parce qu'on compare avec ventes[i-1] : à i=1, ventes[0] n'existe pas", "Parce que lundi ne compte pas", "Erreur d'énoncé"], a: 1, exp: "Accès à i−1 → départ à 2. Le réflexe anti-débordement, dans l'autre sens." }
    ],
    solution: `<p>Trace de l'audit :</p>
<pre class="pseudo">i    ventes[i]   total   nbBons
1    120         120     1
2    80          200     1
3    150         350     2
4    60          410     2
5    90          500     2
6    100         600     3
moyenne = 100 · comparaisons voisines : 2 baisses (jours 2 et 4)</pre>
<p>Un seul tableau, deux parcours, quatre indicateurs. Tu maîtrises maintenant LE motif central de l'algorithmique : la boucle sur indice.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton pseudocode ici…",
  items: [
  { id: "algo-inverser", title: "Inverser un tableau", level: 2,
    statement: "Un tableau <code>T</code> de <code>N</code> entiers est rempli. Inverse-le <strong>sur place</strong> (le premier échange sa place avec le dernier, le deuxième avec l'avant-dernier, etc.) sans créer de second tableau.",
    hints: [
      "C'est une série d'échanges : T[1] ↔ T[N], puis T[2] ↔ T[N-1], etc. Réutilise le motif d'échange du jour 2.",
      "La case symétrique de T[i] est T[N + 1 - i] (vérifie : pour i = 1 → N, pour i = 2 → N-1).",
      "ATTENTION : la boucle doit s'arrêter à la MOITIÉ (N DIV 2), sinon tu ré-échanges tout et le tableau revient à l'état initial !"
    ],
    solution: "ALGORITHME InverserTableau               // nom de l'algorithme\nVARIABLES T : TABLEAU[1..N] D'ENTIERS    // le tableau à retourner\n          i, temp : ENTIER               // i = position, temp = variable d'échange\nDEBUT                                    // début des instructions\n    POUR i DE 1 A N DIV 2 FAIRE          // on ne va que jusqu'à la MOITIÉ (N DIV 2 = division entière)\n        temp ← T[i]                      // 1) sauvegarde l'élément de gauche\n        T[i] ← T[N + 1 - i]              // 2) l'élément symétrique vient à gauche\n        T[N + 1 - i] ← temp              // 3) la sauvegarde part à droite\n    FINPOUR                              // après N DIV 2 échanges, tout est inversé\n    POUR i DE 1 A N FAIRE                // parcours d'affichage, de 1 à N\n        Écrire(T[i])                     // montre la case i du tableau inversé\n    FINPOUR                              // fin de l'affichage\nFIN                                      // fin de l'algorithme",
    note: "Aller jusqu'à N au lieu de N DIV 2 est le piège : chaque paire serait échangée deux fois, retour à la case départ !" }
  ]
};
</script>
