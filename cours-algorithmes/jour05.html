<script>
var DAY = {
  num: 5,
  title: "Entrées et sorties (Lire / Écrire)",
  subtitle: "Faire dialoguer l'algorithme avec l'utilisateur.",
  theory: `
<h3>1. Communiquer avec l'extérieur</h3>
<p>Jusqu'ici nos algorithmes rangeaient des valeurs eux-mêmes. Mais un algorithme utile <strong>dialogue</strong> avec la personne qui l'utilise (l'<strong>utilisateur</strong>) : il reçoit des données qu'elle tape au clavier, et lui affiche des résultats à l'écran. Deux instructions suffisent pour ce dialogue :</p>
<ul>
<li><strong>Lire(variable)</strong> : c'est une <strong>entrée</strong>. L'algorithme s'arrête et attend que l'utilisateur tape une valeur au clavier, puis range cette valeur dans la variable indiquée entre parenthèses.</li>
<li><strong>Écrire(expression)</strong> : c'est une <strong>sortie</strong>. L'algorithme affiche à l'écran une valeur, un texte, ou un mélange des deux.</li>
</ul>
<pre class="pseudo">ALGORITHME Salutation                       // nom de l'algorithme
VARIABLES prenom : CHAINE                    // une boîte à texte nommée "prenom"
DEBUT                                        // début des étapes
    Écrire("Quel est ton prénom ?")          // SORTIE : affiche la question à l'écran
    Lire(prenom)                             // ENTRÉE : range dans prenom ce que l'utilisateur tape
    Écrire("Bonjour " &amp; prenom &amp; " !")       // SORTIE : colle les morceaux et affiche le tout
FIN                                          // fin de l'algorithme</pre>
<h3>2. Le schéma universel</h3>
<p>La quasi-totalité des petits algorithmes suivent ces 4 temps, qui reprennent le schéma Entrée → Traitement → Sortie du jour 1 :</p>
<pre class="pseudo">1. Écrire(...)   // demander poliment (l'invite : le message qui invite à taper)
2. Lire(...)     // récupérer la donnée saisie par l'utilisateur (l'ENTRÉE)
3. calculer      // le traitement : on transforme la donnée
4. Écrire(...)   // afficher le résultat (la SORTIE)</pre>
<h3>3. Exemple complet : convertisseur euros → dollars</h3>
<pre class="pseudo">ALGORITHME Conversion                       // nom de l'algorithme
VARIABLES euros, dollars : REEL             // deux boîtes à nombres à virgule
DEBUT                                        // début des étapes
    Écrire("Montant en euros ?")             // invite : on demande le montant
    Lire(euros)                              // on range le montant tapé dans euros
    dollars ← euros * 1.08                   // traitement : on convertit (1 € = 1.08 $)
    Écrire("Cela fait ", dollars, " dollars")   // affiche texte + valeur + texte
FIN                                          // fin de l'algorithme</pre>
<div class="tip">Toujours ÉCRIRE une question avant de LIRE : sinon l'utilisateur voit un écran vide et ne sait pas quoi faire.</div>
<h3>4. Écrire du texte vs écrire une variable</h3>
<p>Point crucial : les <strong>guillemets</strong> décident si on affiche des lettres telles quelles, ou le contenu d'une variable.</p>
<pre class="pseudo">Écrire("age")      // affiche le MOT :  age        // guillemets → texte littéral, mot à mot
Écrire(age)        // affiche la VALEUR de la variable :  15   // sans guillemets → contenu de la boîte
Écrire("age = ", age)   // affiche :  age = 15     // texte "age = " PUIS la valeur de age</pre>
<div class="warn">Les guillemets = texte littéral. Sans guillemets = contenu de la variable. C'est LE piège classique du débutant.</div>
<h3>5. Lire plusieurs valeurs</h3>
<p>On peut enchaîner plusieurs Lire : chaque Lire remplit une variable différente, dans l'ordre des saisies.</p>
<pre class="pseudo">Écrire("Donne deux notes")           // invite globale
Lire(note1)                          // range la 1re note tapée dans note1
Lire(note2)                          // range la 2e note tapée dans note2
moyenne ← (note1 + note2) / 2        // traitement : moyenne des deux notes
Écrire("Moyenne : ", moyenne)        // affiche le texte puis le résultat</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait l'instruction <code>Lire(x)</code> ?", opts: ["Elle affiche x à l'écran", "Elle attend une saisie de l'utilisateur et la range dans x", "Elle supprime x", "Elle compare x à zéro"], a: 1, exp: "Lire = entrée : l'utilisateur fournit la valeur." },
    { type: "qcm", q: "Que fait l'instruction <code>Écrire(x)</code> ?", opts: ["Elle demande une valeur", "Elle range une valeur dans x", "Elle affiche la valeur de x à l'écran", "Elle efface l'écran"], a: 2, exp: "Écrire = sortie : on montre une valeur à l'utilisateur." },
    { type: "qcm", q: "Si <code>age ← 15</code>, qu'affiche <code>Écrire(\"age\")</code> ?", opts: ["15", "age", "\"15\"", "Erreur"], a: 1, exp: "Avec guillemets, c'est le TEXTE « age » qui s'affiche, pas la valeur." },
    { type: "qcm", q: "Si <code>age ← 15</code>, qu'affiche <code>Écrire(age)</code> ?", opts: ["age", "15", "\"age\"", "Rien"], a: 1, exp: "Sans guillemets, on affiche le contenu de la boîte : 15." },
    { type: "vf", q: "Il faut afficher une question (invite) AVANT de faire un Lire.", a: true, exp: "Sinon l'utilisateur ignore ce qu'on attend de lui." },
    { type: "qcm", q: "L'utilisateur tape 8 puis 5. Trace : <code>Lire(a)</code>, <code>Lire(b)</code>, <code>Écrire(a - b)</code>. Qu'affiche l'algorithme ?", opts: ["3", "-3", "13", "85"], a: 0, exp: "a reçoit 8 (première saisie), b reçoit 5 : 8 - 5 = 3." },
    { type: "qcm", q: "Dans le convertisseur euros→dollars, quelle ligne est le TRAITEMENT ?", opts: ["Écrire(\"Montant en euros ?\")", "Lire(euros)", "dollars ← euros * 1.08", "Écrire(dollars)"], a: 2, exp: "Le calcul est le cœur : le reste n'est que dialogue." },
    { type: "vf", q: "<code>Lire(5)</code> est une instruction valide.", a: false, exp: "On lit DANS une variable (une boîte). 5 n'est pas une boîte." },
    { type: "qcm", q: "Qu'affiche <code>Écrire(\"Total : \", 3 + 4)</code> ?", opts: ["Total : 3 + 4", "Total : 7", "3 + 4", "7"], a: 1, exp: "Le texte s'affiche tel quel, l'expression est calculée : Total : 7." },
    { type: "qcm", q: "L'utilisateur tape 10. Trace : <code>Lire(n)</code>, <code>n ← n * 2</code>, <code>Écrire(n)</code>. Affichage ?", opts: ["10", "20", "n * 2", "n"], a: 1, exp: "n reçoit 10, puis est doublé : 20." },
    { type: "qcm", q: "Pour demander l'âge, quel enchaînement est correct ?", opts: ["Lire(age) puis Écrire(\"Quel âge as-tu ?\")", "Écrire(\"Quel âge as-tu ?\") puis Lire(age)", "Écrire(age) puis Lire(age)", "Lire(\"Quel âge as-tu ?\")"], a: 1, exp: "Question d'abord, saisie ensuite." },
    { type: "vf", q: "Un algorithme peut faire plusieurs Lire et plusieurs Écrire.", a: true, exp: "Autant que nécessaire : chaque donnée a son Lire." },
    { type: "qcm", q: "L'utilisateur tape 4. Qu'affiche : <code>Lire(x)</code>, <code>Écrire(\"x\", \" vaut \", x)</code> ?", opts: ["x vaut 4", "4 vaut 4", "x vaut x", "4 vaut x"], a: 0, exp: "\"x\" (avec guillemets) affiche la lettre x ; x (sans) affiche 4." },
    { type: "qcm", q: "Il manque quoi à cet algorithme ? <code>Lire(prix)</code>, <code>ttc ← prix * 1.21</code>", opts: ["Un Lire supplémentaire", "L'affichage du résultat : Écrire(ttc)", "Une variable de plus", "Rien"], a: 1, exp: "Sans Écrire, le calcul est fait mais personne ne le voit jamais !" },
    { type: "qcm", q: "Combien de Lire faut-il pour calculer la moyenne de 3 notes saisies par l'utilisateur ?", opts: ["1", "2", "3", "0"], a: 2, exp: "Une saisie par note : 3 Lire (en attendant les tableaux du jour 14 !)." }
  ],
  final: {
    title: "Exercice final — Le ticket de caisse",
    intro: `<p>Écris mentalement l'algorithme suivant, puis vérifie chaque morceau : l'utilisateur donne le <strong>prix unitaire</strong> d'un article et la <strong>quantité</strong> achetée ; l'algorithme affiche le total TTC (TVA 21 %).</p>
<p>L'utilisateur tape : prix = <strong>10</strong>, quantité = <strong>3</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Quelle est la 1ʳᵉ instruction correcte ?", opts: ["Lire(prix)", "Écrire(\"Prix unitaire ?\")", "total ← prix * quantite", "Écrire(total)"], a: 1, exp: "On commence par l'invite : l'utilisateur doit savoir quoi taper." },
      { type: "qcm", q: "Après les deux invites et les deux Lire, quel est le bon calcul du total HT ?", opts: ["total ← prix + quantite", "total ← prix * quantite", "total ← prix DIV quantite", "Lire(total)"], a: 1, exp: "10 × 3 = 30 € HT." },
      { type: "input", q: "Que vaut le total HT ?", a: "30", ph: "nombre", exp: "10 × 3 = 30." },
      { type: "input", q: "Le TTC vaut <code>total * 1.21</code>. Résultat ?", a: ["36.3", "36,3", "36.30"], ph: "nombre", exp: "30 × 1.21 = 36.3 €." },
      { type: "qcm", q: "Quelle instruction affiche « À payer : 36.3 € » ?", opts: ["Écrire(\"À payer : ttc €\")", "Écrire(\"À payer : \", ttc, \" €\")", "Lire(ttc)", "ttc ← \"À payer\""], a: 1, exp: "Texte entre guillemets, valeur sans guillemets, texte à nouveau." }
    ],
    solution: `<pre class="pseudo">ALGORITHME TicketDeCaisse                   // nom de l'algorithme
VARIABLES prix, ttc : REEL                  // prix unitaire et prix TTC (à virgule)
          quantite : ENTIER                 // nombre d'articles (entier)
          total : REEL                      // total HT (à virgule)
DEBUT                                       // début des étapes
    Écrire("Prix unitaire ?")               // invite pour le prix
    Lire(prix)                    // 10      // range la saisie dans prix
    Écrire("Quantité ?")                    // invite pour la quantité
    Lire(quantite)                // 3       // range la saisie dans quantite
    total ← prix * quantite       // 30      // total HT = prix × quantité
    ttc ← total * 1.21            // 36.3    // on ajoute 21 % de TVA
    Écrire("À payer : ", ttc, " €")         // affiche texte + valeur + texte
FIN                                         // fin de l'algorithme</pre>
<p>Le schéma Invite → Lire → Calcul → Écrire doit devenir un réflexe : tu le réutiliseras tous les jours du mois.</p>`
  }
};
