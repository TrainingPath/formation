  theory: `
<h3>1. Communiquer avec l'extérieur</h3>
<p>Jusqu'ici nos algorithmes rangeaient des valeurs eux-mêmes. Mais un algorithme utile <strong>dialogue</strong> avec la personne qui l'utilise (l'<strong>utilisateur</strong>) : il reçoit des données qu'elle tape au clavier, et lui affiche des résultats à l'écran. Deux instructions suffisent pour ce dialogue :</p>
<ul>
<li><strong>Lire(variable)</strong> : c'est une <strong>entrée</strong>. L'algorithme s'arrête et attend que l'utilisateur tape une valeur au clavier, puis range cette valeur dans la variable indiquée entre parenthèses.</li>
<li><strong>Écrire(expression)</strong> : c'est une <strong>sortie</strong>. L'algorithme affiche à l'écran une valeur, un texte, ou un mélange des deux.</li>
</ul>
<pre class="pseudo">ALGORITHME Salutation                       // nom de l'algorithme
VARIABLES prenom : CHAINE                    // une boîte à texte nommée "prenom"
DEBUT                                        // début des étapes
    Écrire("Quel est ton prénom ?")          // SORTIE : affiche la question à l'écran
    Lire(prenom)                             // ENTRÉE : range dans prenom ce que l'utilisateur tape
    Écrire("Bonjour " &amp; prenom &amp; " !")       // SORTIE : colle les morceaux et affiche le tout
FIN                                          // fin de l'algorithme</pre>
<h3>2. Le schéma universel</h3>
<p>La quasi-totalité des petits algorithmes suivent ces 4 temps, qui reprennent le schéma Entrée → Traitement → Sortie du jour 1 :</p>
<pre class="pseudo">1. Écrire(...)   // demander poliment (l'invite : le message qui invite à taper)
2. Lire(...)     // récupérer la donnée saisie par l'utilisateur (l'ENTRÉE)
3. calculer      // le traitement : on transforme la donnée
4. Écrire(...)   // afficher le résultat (la SORTIE)</pre>
<h3>3. Exemple complet : convertisseur euros → dollars</h3>
<pre class="pseudo">ALGORITHME Conversion                       // nom de l'algorithme
VARIABLES euros, dollars : REEL             // deux boîtes à nombres à virgule
DEBUT                                        // début des étapes
    Écrire("Montant en euros ?")             // invite : on demande le montant
    Lire(euros)                              // on range le montant tapé dans euros
    dollars ← euros * 1.08                   // traitement : on convertit (1 € = 1.08 $)
    Écrire("Cela fait ", dollars, " dollars")   // affiche texte + valeur + texte
FIN                                          // fin de l'algorithme</pre>
<div class="tip">Toujours ÉCRIRE une question avant de LIRE : sinon l'utilisateur voit un écran vide et ne sait pas quoi faire.</div>
<h3>4. Écrire du texte vs écrire une variable</h3>
<p>Point crucial : les <strong>guillemets</strong> décident si on affiche des lettres telles quelles, ou le contenu d'une variable.</p>
<pre class="pseudo">Écrire("age")      // affiche le MOT :  age        // guillemets → texte littéral, mot à mot
Écrire(age)        // affiche la VALEUR de la variable :  15   // sans guillemets → contenu de la boîte
Écrire("age = ", age)   // affiche :  age = 15     // texte "age = " PUIS la valeur de age</pre>
<div class="warn">Les guillemets = texte littéral. Sans guillemets = contenu de la variable. C'est LE piège classique du débutant.</div>
<h3>5. Lire plusieurs valeurs</h3>
<p>On peut enchaîner plusieurs Lire : chaque Lire remplit une variable différente, dans l'ordre des saisies.</p>
<pre class="pseudo">Écrire("Donne deux notes")           // invite globale
Lire(note1)                          // range la 1re note tapée dans note1
Lire(note2)                          // range la 2e note tapée dans note2
moyenne ← (note1 + note2) / 2        // traitement : moyenne des deux notes
Écrire("Moyenne : ", moyenne)        // affiche le texte puis le résultat</pre>`,

VARIABLES prix, ttc : REEL                  // prix unitaire et prix TTC (à virgule)
          quantite : ENTIER                 // nombre d'articles (entier)
          total : REEL                      // total HT (à virgule)
DEBUT                                       // début des étapes
    Écrire("Prix unitaire ?")               // invite pour le prix
    Lire(prix)                    // 10      // range la saisie dans prix
    Écrire("Quantité ?")                    // invite pour la quantité
    Lire(quantite)                // 3       // range la saisie dans quantite
    total ← prix * quantite       // 30      // total HT = prix × quantité
    ttc ← total * 1.21            // 36.3    // on ajoute 21 % de TVA
    Écrire("À payer : ", ttc, " €")         // affiche texte + valeur + texte
FIN                                         // fin de l'algorithme</pre>
<p>Le schéma Invite → Lire → Calcul → Écrire doit devenir un réflexe : tu le réutiliseras tous les jours du mois.</p>`

    solution: "ALGORITHME BorneDePeage (version 2 : avec saisies)\n\nVARIABLES\n    TARIF_C1, TARIF_C2, TARIF_C3 : REEL\n    TAUX_TVA                     : REEL\n    PK_SORTIE                    : ENTIER    // propre a cette borne\n\n    pk_entree  : ENTIER\n    classe     : ENTIER\n    tarif      : REEL\n    distance   : ENTIER\n    montant_ht : REEL\n    total      : REEL\n\nDEBUT\n    TARIF_C1 ← 0.092\n    TARIF_C2 ← 0.146\n    TARIF_C3 ← 0.241\n    TAUX_TVA ← 0.21\n    PK_SORTIE ← 187\n\n    // a) le dialogue de saisie\n    Afficher \"Point kilometrique d'entree (voir ticket) ?\"\n    Lire pk_entree\n    Afficher \"Classe du vehicule (1, 2 ou 3) ?\"\n    Lire classe\n\n    // b) SOLUTION PROVISOIRE, assumee comme telle :\n    //    on demande directement le tarif au lieu de le deduire de la classe.\n    //    LIMITE : le conducteur n'a aucune raison de connaitre le tarif, et\n    //    rien n'empeche qu'il en annonce un faux. Il faudrait CHOISIR le tarif\n    //    a partir de la classe - c'est l'objet de la lecon de demain.\n    Afficher \"Tarif kilometrique applicable a cette classe ?\"\n    Lire tarif\n\n    // le calcul d'hier, inchange\n    distance   ← ABS(PK_SORTIE − pk_entree)\n    montant_ht ← distance × tarif\n    total      ← montant_ht × (1 + TAUX_TVA)\n\n    // c) le ticket de sortie\n    Afficher \"--- TICKET DE SORTIE ---\"\n    Afficher \"Entree   : PK \", pk_entree\n    Afficher \"Sortie   : PK \", PK_SORTIE\n    Afficher \"Distance : \", distance, \" km\"\n    Afficher \"Classe   : \", classe\n    Afficher \"Tarif    : \", tarif, \" EUR/km\"\n    Afficher \"A PAYER  : \", ARRONDI(total, 2), \" EUR\"\nFIN",
    reponses: [
      { ref: "Réflexion", texte: "Ce qui manque : <em>il me faudrait une instruction qui exécute une affectation plutôt qu'une autre selon la valeur d'une variable.</em> C'est exactement la définition d'une condition, et c'est l'objet de la leçon de demain. La solution provisoire — demander le tarif au conducteur — a le mérite d'être honnête : elle produit un ticket juste tant que la saisie est juste, et elle rend visible le manque au lieu de le camoufler. Avec une classe 4 ou la lettre A, l'algorithme actuel ne bronche pas : il affiche la classe telle quelle sur le ticket et calcule avec le tarif saisi. Le ticket serait donc parfaitement lisible, parfaitement formaté, et faux — puisque la classe imprimée ne correspondrait à rien. Rien ne relie encore la classe au tarif : ce sont deux valeurs indépendantes qui ne se contrôlent pas l'une l'autre. Dès demain, le simple fait de déduire l'une de l'autre rendra la classe 4 impossible à traiter, donc détectable." }
