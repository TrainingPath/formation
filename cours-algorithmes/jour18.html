<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Jour 18</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 18,
  title: "Tableaux à deux dimensions",
  subtitle: "Des grilles de données : lignes × colonnes.",
  theory: `
<h3>1. Quand une dimension ne suffit plus</h3>
<p>Les notes de 3 élèves à 4 contrôles ? C'est une <strong>grille</strong> : 3 lignes, 4 colonnes. Un <strong>tableau 2D</strong> (matrice) se déclare et s'utilise avec DEUX indices : <code>t[ligne][colonne]</code>.</p>
<pre class="pseudo">VARIABLES notes : TABLEAU[1..3][1..4] D'ENTIERS</pre>
<pre class="pseudo">           col 1   col 2   col 3   col 4
ligne 1  [  12  ][  14  ][  9   ][  15  ]
ligne 2  [  8   ][  11  ][  13  ][  10  ]
ligne 3  [  16  ][  9   ][  14  ][  12  ]</pre>
<pre class="pseudo">notes[2][3] → 13     // ligne 2, colonne 3
notes[3][1] → 16     // ligne 3, colonne 1</pre>
<div class="warn">L'ordre est <strong>ligne d'abord, colonne ensuite</strong> : notes[2][3] ≠ notes[3][2] (13 vs 9 ici) !</div>
<h3>2. Parcourir toute la grille : le double POUR</h3>
<p>Les boucles imbriquées du jour 13 trouvent ici leur vraie raison d'être :</p>
<pre class="pseudo">POUR i DE 1 A nbLignes FAIRE
    POUR j DE 1 A nbColonnes FAIRE
        ... t[i][j] ...
    FINPOUR
FINPOUR</pre>
<h3>3. Parcourir UNE ligne ou UNE colonne</h3>
<pre class="pseudo">// Moyenne de l'élève 2 (ligne 2 : on FIXE i=2, j varie)
somme ← 0
POUR j DE 1 A 4 FAIRE
    somme ← somme + notes[2][j]
FINPOUR
moyenne ← somme / 4

// Moyenne du contrôle 3 (colonne 3 : i varie, on FIXE j=3)
somme ← 0
POUR i DE 1 A 3 FAIRE
    somme ← somme + notes[i][3]
FINPOUR
moyenne ← somme / 3</pre>
<div class="tip">Ligne fixe → boucle sur les colonnes. Colonne fixe → boucle sur les lignes. Demande-toi toujours : « qu'est-ce qui varie ? »</div>
<h3>4. Motifs 1D transposés en 2D</h3>
<p>Somme totale, max, comptage… tous les motifs connus marchent : il suffit de remplacer <code>t[i]</code> par <code>t[i][j]</code> dans un double POUR.</p>
<pre class="pseudo">// Max de toute la grille
max ← t[1][1]
POUR i DE 1 A nbLignes FAIRE
    POUR j DE 1 A nbColonnes FAIRE
        SI t[i][j] > max ALORS max ← t[i][j] FINSI
    FINPOUR
FINPOUR</pre>
<h3>5. La diagonale (grilles carrées)</h3>
<pre class="pseudo">POUR i DE 1 A n FAIRE
    ... t[i][i] ...        // (1,1), (2,2), (3,3)… un seul POUR suffit !
FINPOUR</pre>`,
  exercises: [
    { type: "qcm", q: "Comment accède-t-on à la case ligne 2, colonne 5 d'un tableau 2D t ?", opts: ["t[5][2]", "t[2][5]", "t[2,5] et t[5,2] sont pareils", "t[7]"], a: 1, exp: "Ligne d'abord, colonne ensuite." },
    { type: "input", q: "Grille de la théorie : que vaut <code>notes[1][4]</code> ?", a: "15", ph: "nombre", exp: "Ligne 1, colonne 4 : 15." },
    { type: "input", q: "Et <code>notes[3][2]</code> ?", a: "9", ph: "nombre", exp: "Ligne 3, colonne 2 : 9." },
    { type: "qcm", q: "<code>notes[2][3]</code> et <code>notes[3][2]</code> contiennent-ils la même valeur ?", opts: ["Oui, toujours", "Non : 13 et 9 ici — l'ordre des indices compte", "Oui dans les grilles carrées", "Impossible à savoir"], a: 1, exp: "Inverser les indices est LE bug classique du 2D." },
    { type: "input", q: "Un tableau [1..6][1..8] contient combien de cases ?", a: "48", ph: "nombre", exp: "6 × 8 = 48." },
    { type: "qcm", q: "Quelle structure parcourt TOUTES les cases d'une grille ?", opts: ["Un seul POUR", "Deux POUR imbriqués (lignes puis colonnes)", "Un TANT QUE seul", "Un SI"], a: 1, exp: "Une boucle par dimension." },
    { type: "qcm", q: "Pour sommer la LIGNE 3 d'une grille 5×7, quelle boucle ?", opts: ["POUR i DE 1 A 5 : somme + t[i][3]", "POUR j DE 1 A 7 : somme + t[3][j]", "Double POUR complet", "POUR j DE 1 A 5 : somme + t[3][j]"], a: 1, exp: "Ligne fixée à 3, la colonne j varie de 1 à 7." },
    { type: "qcm", q: "Pour sommer la COLONNE 2 d'une grille 5×7 ?", opts: ["POUR i DE 1 A 5 : somme + t[i][2]", "POUR j DE 1 A 7 : somme + t[2][j]", "POUR i DE 1 A 7 : somme + t[i][2]", "t[2] tout court"], a: 0, exp: "Colonne fixée à 2, la ligne i varie de 1 à 5." },
    { type: "input", q: "Grille de la théorie : somme de la ligne 2 (8, 11, 13, 10) ?", a: "42", ph: "nombre", exp: "8+11+13+10 = 42." },
    { type: "input", q: "Grille de la théorie : moyenne de la colonne 1 (12, 8, 16) ?", a: "12", ph: "nombre", exp: "36 / 3 = 12." },
    { type: "input", q: "Grille de la théorie : que vaut le MAX de toute la grille ?", a: "16", ph: "nombre", exp: "16 en ligne 3, colonne 1." },
    { type: "qcm", q: "Que parcourt <code>POUR i DE 1 A n FAIRE Écrire(t[i][i]) FINPOUR</code> ?", opts: ["La première ligne", "La première colonne", "La diagonale principale", "Toute la grille"], a: 2, exp: "(1,1), (2,2), (3,3)… les deux indices égaux = diagonale." },
    { type: "qcm", q: "Dans le double POUR (i externe = lignes, j interne = colonnes), dans quel ordre visite-t-on les cases ?", opts: ["Colonne par colonne", "Ligne par ligne, de gauche à droite", "En diagonale", "Au hasard"], a: 1, exp: "Pour chaque ligne i, j balaie toutes les colonnes : lecture « comme un livre »." },
    { type: "qcm", q: "Un damier d'échecs [1..8][1..8] : comment compter les pièces (cases ≠ 0) ?", opts: ["Un compteur dans un double POUR avec SI t[i][j] ≠ 0", "Un accumulateur sans SI", "Impossible", "Un seul POUR"], a: 0, exp: "Motif compteur (jour 12) + parcours 2D : les briques s'assemblent." },
    { type: "vf", q: "Pour une grille 3×4, <code>t[4][3]</code> est un accès valide.", a: false, exp: "Les lignes vont de 1 à 3 : ligne 4 = débordement. (t[3][4] serait valide, lui !)" }
  ],
  final: {
    title: "Exercice final — Le bulletin trimestriel",
    intro: `<p>Notes de 3 élèves à 4 contrôles :</p>
<pre class="pseudo">           C1    C2    C3    C4
Élève 1  [ 12 ][ 14 ][ 9  ][ 15 ]
Élève 2  [ 8  ][ 11 ][ 13 ][ 10 ]
Élève 3  [ 16 ][ 9  ][ 14 ][ 12 ]</pre>
<p>Le professeur calcule la moyenne de chaque élève (ligne), la moyenne de chaque contrôle (colonne), et cherche la meilleure note de la classe.</p>`,
    questions: [
      { type: "input", q: "Moyenne de l'élève 1 (ligne 1) ?", a: ["12.5", "12,5"], ph: "nombre", exp: "(12+14+9+15)/4 = 50/4 = 12,5." },
      { type: "input", q: "Moyenne du contrôle 2 (colonne 2) ? Arrondi à 2 décimales.", a: ["11.33", "11,33"], ph: "nombre", exp: "(14+11+9)/3 = 34/3 ≈ 11,33." },
      { type: "qcm", q: "La meilleure note de la classe (16) est en <code>notes[?][?]</code> :", opts: ["notes[1][3]", "notes[3][1]", "notes[1][1]", "notes[4][3]"], a: 1, exp: "Élève 3, contrôle 1 : ligne 3, colonne 1." },
      { type: "qcm", q: "Pour calculer les 3 moyennes d'élèves, quelle structure ?", opts: ["POUR i DE 1 A 3 (élèves) contenant un POUR j DE 1 A 4 (contrôles) avec somme remise à 0 pour chaque élève", "Un seul POUR", "Une somme globale divisée par 3", "Trois SI"], a: 0, exp: "La remise à 0 de la somme DANS la boucle externe (avant l'interne) est le point clé." },
      { type: "input", q: "Moyenne générale de la classe (somme des 12 notes / 12) ? Arrondi 2 décimales.", a: ["11.92", "11,92"], ph: "nombre", exp: "Somme totale = 143 ; 143/12 ≈ 11,92." }
    ],
    solution: `<pre class="pseudo">// Moyennes par élève (ligne)
POUR i DE 1 A 3 FAIRE
    somme ← 0                        // remise à zéro PAR élève !
    POUR j DE 1 A 4 FAIRE
        somme ← somme + notes[i][j]
    FINPOUR
    Écrire("Élève ", i, " : ", somme / 4)
FINPOUR
// Élève 1 : 12,5 · Élève 2 : 10,5 · Élève 3 : 12,75

// Moyennes par contrôle (colonne)
POUR j DE 1 A 4 FAIRE
    somme ← 0
    POUR i DE 1 A 3 FAIRE
        somme ← somme + notes[i][j]
    FINPOUR
    Écrire("Contrôle ", j, " : ", somme / 3)
FINPOUR
// C1 : 12 · C2 : 11,33 · C3 : 12 · C4 : 12,33</pre>
<p>Remarque le symétrique parfait : pour changer « par ligne » en « par colonne », on échange simplement les rôles des deux boucles.</p>`
  }
};
</script>
<script src="engine.js"></script>
</body>
