  theory: `
<h3>1. Quand une dimension ne suffit plus</h3>
<p>Les notes de 3 élèves à 4 contrôles ? C'est une <strong>grille</strong> : 3 lignes, 4 colonnes. Un <strong>tableau 2D</strong> (matrice) se déclare et s'utilise avec DEUX indices : <code>t[ligne][colonne]</code>.</p>
<pre class="pseudo">VARIABLES notes : TABLEAU[1..3][1..4] D'ENTIERS</pre>
<pre class="pseudo">           col 1   col 2   col 3   col 4
ligne 1  [  12  ][  14  ][  9   ][  15  ]
ligne 2  [  8   ][  11  ][  13  ][  10  ]
ligne 3  [  16  ][  9   ][  14  ][  12  ]</pre>
<pre class="pseudo">notes[2][3] → 13     // ligne 2, colonne 3
notes[3][1] → 16     // ligne 3, colonne 1</pre>
<div class="warn">L'ordre est <strong>ligne d'abord, colonne ensuite</strong> : notes[2][3] ≠ notes[3][2] (13 vs 9 ici) !</div>
<h3>2. Parcourir toute la grille : le double POUR</h3>
<p>Les boucles imbriquées du jour 13 trouvent ici leur vraie raison d'être :</p>
<pre class="pseudo">POUR i DE 1 A nbLignes FAIRE
    POUR j DE 1 A nbColonnes FAIRE
        ... t[i][j] ...
    FINPOUR
FINPOUR</pre>
<h3>3. Parcourir UNE ligne ou UNE colonne</h3>
<pre class="pseudo">// Moyenne de l'élève 2 (ligne 2 : on FIXE i=2, j varie)
somme ← 0
POUR j DE 1 A 4 FAIRE
    somme ← somme + notes[2][j]
FINPOUR
moyenne ← somme / 4

// Moyenne du contrôle 3 (colonne 3 : i varie, on FIXE j=3)
somme ← 0
POUR i DE 1 A 3 FAIRE
    somme ← somme + notes[i][3]
FINPOUR
moyenne ← somme / 3</pre>
<div class="tip">Ligne fixe → boucle sur les colonnes. Colonne fixe → boucle sur les lignes. Demande-toi toujours : « qu'est-ce qui varie ? »</div>
<h3>4. Motifs 1D transposés en 2D</h3>
<p>Somme totale, max, comptage… tous les motifs connus marchent : il suffit de remplacer <code>t[i]</code> par <code>t[i][j]</code> dans un double POUR.</p>
<pre class="pseudo">// Max de toute la grille
max ← t[1][1]
POUR i DE 1 A nbLignes FAIRE
    POUR j DE 1 A nbColonnes FAIRE
        SI t[i][j] > max ALORS max ← t[i][j] FINSI
    FINPOUR
FINPOUR</pre>
<h3>5. La diagonale (grilles carrées)</h3>
<pre class="pseudo">POUR i DE 1 A n FAIRE
    ... t[i][i] ...        // (1,1), (2,2), (3,3)… un seul POUR suffit !
FINPOUR</pre>`,

    ],
    solution: `<pre class="pseudo">// Moyennes par élève (ligne)
POUR i DE 1 A 3 FAIRE
    somme ← 0                        // remise à zéro PAR élève !
    POUR j DE 1 A 4 FAIRE
        somme ← somme + notes[i][j]
    FINPOUR
    Écrire("Élève ", i, " : ", somme / 4)
FINPOUR
// Élève 1 : 12,5 · Élève 2 : 10,5 · Élève 3 : 12,75

// Moyennes par contrôle (colonne)
POUR j DE 1 A 4 FAIRE
    somme ← 0
    POUR i DE 1 A 3 FAIRE
        somme ← somme + notes[i][j]
    FINPOUR
    Écrire("Contrôle ", j, " : ", somme / 3)
FINPOUR
// C1 : 12 · C2 : 11,33 · C3 : 12 · C4 : 12,33</pre>
<p>Remarque le symétrique parfait : pour changer « par ligne » en « par colonne », on échange simplement les rôles des deux boucles.</p>`

    solution: "Algorithme TableauDeServiceRestaurant\nConst\n    PLATS = 4\n    JOURS = 5\nVar\n    vente : TABLEAU[1..4][1..5] D'ENTIERS\n    totalPlat : TABLEAU[1..4] D'ENTIERS\n    p, j, cumul, general : ENTIER\n    meilleurPlat, totalMeilleurPlat : ENTIER\n    meilleurJour, totalMeilleurJour : ENTIER\n    record, platRecord, jourRecord : ENTIER\n    audessus : ENTIER\n    moyenneGenerale : REEL\nDebut\n    POUR p DE 1 A PLATS FAIRE\n        POUR j DE 1 A JOURS FAIRE\n            Ecrire(\"Portions du plat \", p, \" le jour \", j, \" ?\")\n            Lire(vente[p][j])\n        FINPOUR\n    FINPOUR\n\n    /* a) LIGNE fixe, colonnes qui varient : boucle externe sur les plats.\n          Le cumul appartient au plat : il se remet a zero a chaque plat. */\n    general <- 0\n    meilleurPlat <- 1\n    totalMeilleurPlat <- -1\n    POUR p DE 1 A PLATS FAIRE\n        cumul <- 0\n        POUR j DE 1 A JOURS FAIRE\n            cumul <- cumul + vente[p][j]\n        FINPOUR\n        totalPlat[p] <- cumul        /* conserve : le point d) en aura besoin */\n        general <- general + cumul\n        Ecrire(\"Plat \", p, \" : \", cumul, \" portions, moyenne \",\n               Arrondi(cumul / JOURS, 1))\n        SI cumul > totalMeilleurPlat ALORS\n            totalMeilleurPlat <- cumul\n            meilleurPlat <- p\n        FINSI\n    FINPOUR\n\n    /* b) COLONNE fixe, lignes qui varient : les deux boucles s'inversent.\n          Mais le premier indice reste celui du PLAT : vente[p][j], jamais\n          vente[j][p] — c'est l'erreur classique, et elle sort de la grille\n          des que les deux dimensions n'ont pas la meme taille. */\n    meilleurJour <- 1\n    totalMeilleurJour <- -1\n    POUR j DE 1 A JOURS FAIRE\n        cumul <- 0\n        POUR p DE 1 A PLATS FAIRE\n            cumul <- cumul + vente[p][j]\n        FINPOUR\n        Ecrire(\"Jour \", j, \" : \", cumul, \" portions\")\n        SI cumul > totalMeilleurJour ALORS\n            totalMeilleurJour <- cumul\n            meilleurJour <- j\n        FINSI\n    FINPOUR\n\n    /* c) la meilleure vente ISOLEE : trois variables, mises a jour ensemble */\n    record <- vente[1][1]\n    platRecord <- 1\n    jourRecord <- 1\n    POUR p DE 1 A PLATS FAIRE\n        POUR j DE 1 A JOURS FAIRE\n            SI vente[p][j] > record ALORS\n                record <- vente[p][j]\n                platRecord <- p\n                jourRecord <- j\n            FINSI\n        FINPOUR\n    FINPOUR\n\n    /* d) la moyenne generale n'existe qu'ici : comptage dans un parcours a part */\n    moyenneGenerale <- general / PLATS\n    audessus <- 0\n    POUR p DE 1 A PLATS FAIRE\n        SI totalPlat[p] > moyenneGenerale ALORS\n            audessus <- audessus + 1\n        FINSI\n    FINPOUR\n\n    Ecrire(\"Total general : \", general, \" portions\")\n    Ecrire(\"Meilleur plat : le \", meilleurPlat, \" (\", totalMeilleurPlat, \")\")\n    Ecrire(\"Jour le plus charge : le \", meilleurJour, \" (\", totalMeilleurJour, \")\")\n    Ecrire(\"Meilleure vente : \", record, \" portions (plat \", platRecord,\n           \", jour \", jourRecord, \")\")\n    Ecrire(\"Moyenne par plat : \", moyenneGenerale, \" — \", audessus,\n           \" plat(s) au-dessus\")\nFin",
    reponses: [
      { ref: "d", texte: "Le comptage compare le total de chaque plat à la <em>moyenne générale des plats</em>, laquelle n'existe qu'une fois les quatre totaux connus. Au deuxième plat, je ne peux pas savoir si son total dépasse une moyenne dont deux termes ne sont pas encore calculés. Il faut donc soit un parcours supplémentaire, soit — ce que fait mon algorithme — <strong>conserver les quatre totaux</strong> dans un tableau à une dimension pendant le premier parcours, ce qui évite de reparcourir toute la grille : le second passage ne porte plus que sur quatre valeurs au lieu de vingt." },
      { ref: "Réflexion", texte: "<strong>La règle</strong> : la boucle externe est celle qui porte l'unité de regroupement du résultat. Si l'on veut un chiffre <em>par plat</em>, les plats sont dehors et le cumul se remet à zéro à chaque plat. Si l'on veut un chiffre <em>par jour</em>, les jours sont dehors. On peut le formuler autrement : la boucle externe désigne ce dont on parle, la boucle interne ce qu'on additionne. Inverser les deux au point b) — plats dehors, jours dedans — donnerait des totaux par <em>plat</em> affichés sous des étiquettes de jour : cinq nombres corrects mais mal nommés, et seulement quatre d'entre eux existeraient puisqu'il n'y a que quatre plats. Selon l'écriture, cela produit soit un débordement sur le cinquième tour, soit — si les deux dimensions avaient la même taille — un tableau de bord parfaitement plausible et entièrement faux. C'est la raison pour laquelle une grille carrée est plus dangereuse qu'une grille rectangulaire : elle pardonne l'inversion des indices au lieu de la signaler. <strong>La conclusion du chef n'est pas solide.</strong> Le plat 3 totalise le plus de portions, c'est un fait ; mais « meilleur » n'est pas un synonyme de « le plus vendu ». Il manque à la grille au moins deux choses. D'abord la <strong>marge</strong> : un plat vendu 126 fois avec deux euros de marge rapporte moins qu'un plat vendu 110 fois à six euros. Ensuite le <strong>nombre de portions préparées</strong> : le plat 4 s'est peut-être vendu 36 fois parce qu'on n'en préparait que huit par jour et qu'il partait toujours entièrement, auquel cas c'est un succès qu'on étouffe, tandis que le plat 3 était peut-être préparé en cinquante exemplaires quotidiens pour n'en vendre que vingt-cinq — un gâchis rentable en apparence. La grille mesure ce qui a été vendu, pas ce qui aurait pu l'être, et encore moins ce que cela a rapporté. C'est le défaut le plus commun d'un tableau de bord : il répond très bien à la question qu'il sait poser, et l'on finit par croire que c'était la bonne question." }

    pourquoi: "Les totaux par plat sont conservés dans un tableau à une dimension pendant le premier double parcours, plutôt que recalculés au moment du comptage final. Vingt cases relues coûteraient peu ici — mais le vrai gain n'est pas là : conserver garantit que le chiffre comparé à la moyenne est <em>exactement</em> celui qui a été affiché, ligne à ligne, au-dessus. Recalculer, c'est se donner l'occasion d'obtenir deux valeurs différentes pour la même grandeur, et de ne pas savoir laquelle croire.",

    reflexion: "Les cases valent 1 ou 0, et cela permet un raccourci : additionner la ligne d'un adhérent donne directement son nombre de présences, sans le moindre test. Explique pourquoi ce raccourci fonctionne, et dis à quelle condition sur les données il cesserait de fonctionner. Puis : le trésorier constate que la séance 5 affiche le meilleur taux de remplissage et en conclut qu'il faut caler tous les entraînements sur ce créneau. Quelle information la grille ne contient-elle pas, sans laquelle cette conclusion est prématurée ? Enfin : ton algorithme parcourt la grille plusieurs fois. Combien de fois exactement, et laquelle de ces passes aurait pu être évitée ?",
    principe: "Lorsque les données ne valent que 0 ou 1, <strong>compter</strong> et <strong>additionner</strong> reviennent au même : la somme d'une ligne est le nombre de cases valant 1, puisque les autres n'ajoutent rien. Le taux d'assiduité d'un adhérent est son nombre de présences divisé par le nombre de séances, multiplié par cent. Sur douze adhérents et huit séances, la grille compte 96 cases.",
    indices: [
      "Deux vues de la même grille, comme à l'exercice précédent — par ligne pour les adhérents, par colonne pour les séances — et deux questions qui s'y greffent : un extremum de chaque côté, et une sélection sur seuil fixe. Rien ici n'exige d'attendre une moyenne générale, ce qui simplifie beaucoup la structure.",
      "Le plan : un premier double parcours, adhérents en externe, qui compte les présences de chacun, calcule son taux, l'affiche, le confronte au record d'assiduité et le compare au seuil de cinquante pour cent. Un second double parcours, séances en externe, qui fait le symétrique pour le remplissage. Rien d'autre n'est nécessaire.",
      "En pseudocode : <code>POUR a DE 1 A 12 FAIRE</code> · <code>presences ← 0</code> · <code>POUR s DE 1 A 8 FAIRE presences ← presences + grille[a][s] FINPOUR</code> · <code>taux ← presences × 100 / 8</code> · afficher, confronter au record, tester le seuil · <code>FINPOUR</code> · puis le symétrique sur les séances.",

      "Ta copie ressemble à ceci : <br><code>POUR a … FAIRE</code> · <code>presences ← 0</code> · <code>POUR s … FAIRE presences ← presences + grille[a][s] FINPOUR</code><br><code>&nbsp;&nbsp;taux ← presences * 100 / SEANCES</code><br><code>&nbsp;&nbsp;SI … ALORS … FINSI</code> ×2<br><code>FINPOUR</code><br>puis les deux boucles inversées, avec <code>grille[a][s]</code> inchangé."

    solution: "Algorithme AssiduiteDuClub\nConst\n    ADHERENTS = 12\n    SEANCES = 8\n    SEUIL = 50\nVar\n    grille : TABLEAU[1..12][1..8] D'ENTIERS\n    a, s, presences, taux : ENTIER\n    recordAssidu, plusAssidu : ENTIER\n    recordSeance, meilleureSeance : ENTIER\n    relances : ENTIER\nDebut\n    POUR a DE 1 A ADHERENTS FAIRE\n        POUR s DE 1 A SEANCES FAIRE\n            Ecrire(\"Adherent \", a, \" seance \", s, \" (1 present, 0 absent) ?\")\n            Lire(grille[a][s])\n        FINPOUR\n    FINPOUR\n\n    /* a) et d) : LIGNE fixe, colonnes qui varient */\n    recordAssidu <- -1\n    plusAssidu <- 0\n    relances <- 0\n    POUR a DE 1 A ADHERENTS FAIRE\n        presences <- 0\n        POUR s DE 1 A SEANCES FAIRE\n            /* les cases valent 0 ou 1 : additionner REVIENT a compter,\n               les absences n'ajoutent rien. Aucun test necessaire. */\n            presences <- presences + grille[a][s]\n        FINPOUR\n\n        /* multiplier AVANT de diviser : en division entiere, presences / 8\n           vaut 0 des que l'assiduite n'est pas totale, et tout le tableau\n           de bord afficherait 0 % */\n        taux <- presences * 100 / SEANCES\n        Ecrire(\"Adherent \", a, \" : \", presences, \"/\", SEANCES, \" — \", taux, \" %\")\n\n        SI presences > recordAssidu ALORS\n            recordAssidu <- presences\n            plusAssidu <- a          /* comparaison STRICTE : a egalite, le\n                                        PREMIER inscrit garde le titre */\n        FINSI\n\n        /* d) seuil FIXE : le comptage tient dans ce parcours.\n              \"sous 50 %\" est strict : 4 seances sur 8 font exactement 50 %,\n              donc l'adherent n'est PAS relance — il respecte la moitie. */\n        SI taux < SEUIL ALORS\n            Ecrire(\"   -> relance : assiduite insuffisante\")\n            relances <- relances + 1\n        FINSI\n    FINPOUR\n\n    /* b) et c) : COLONNE fixe, lignes qui varient. Le premier indice reste\n          celui de l'ADHERENT, meme si la boucle externe porte sur les seances. */\n    recordSeance <- -1\n    meilleureSeance <- 0\n    POUR s DE 1 A SEANCES FAIRE\n        presences <- 0\n        POUR a DE 1 A ADHERENTS FAIRE\n            presences <- presences + grille[a][s]\n        FINPOUR\n        taux <- presences * 100 / ADHERENTS\n        Ecrire(\"Seance \", s, \" : \", presences, \" present(s) — \", taux, \" %\")\n        SI presences > recordSeance ALORS\n            recordSeance <- presences\n            meilleureSeance <- s\n        FINSI\n    FINPOUR\n\n    Ecrire(\"Adherent le plus assidu : le \", plusAssidu,\n           \" (\", recordAssidu, \" seances)\")\n    Ecrire(\"Seance la mieux suivie : la \", meilleureSeance,\n           \" (\", recordSeance, \" presents)\")\n    Ecrire(relances, \" adherent(s) a relancer\")\nFin",
    reponses: [
      { ref: "c", texte: "Ma comparaison est stricte, donc à égalité c'est le <strong>premier rencontré</strong> qui conserve le titre — le plus anciennement inscrit, puisque le fichier suit l'ordre des inscriptions. C'est un choix que j'assume plutôt qu'une conséquence subie : dans un club, l'ancienneté est un critère de départage acceptable et surtout stable, alors que désigner le dernier ferait changer le champion à chaque nouvelle adhésion sans que rien n'ait changé dans les présences. La vraie leçon est qu'un extremum <em>désigne toujours</em> quelqu'un, même quand plusieurs le méritent, et qu'il ne dit jamais tout seul qu'il y avait égalité. Si le club remettait une médaille, il faudrait compter combien d'adhérents atteignent le record avant de l'annoncer." },
      { ref: "d", texte: "Un adhérent présent à exactement quatre séances sur huit affiche 50 %, et ma comparaison étant stricte, il n'est <strong>pas</strong> relancé. C'est cohérent avec la formulation de l'énoncé — « tombe sous cinquante pour cent » — et c'est aussi le choix le plus défendable : relancer quelqu'un qui a exactement respecté la moitié des séances serait lui reprocher de n'avoir pas fait mieux que ce qu'on lui demandait. Le point mérite d'être tranché explicitement parce que, sur huit séances, la valeur 4 est atteinte souvent : ce n'est pas un cas limite théorique mais un cas fréquent." },
      { ref: "Réflexion", texte: "<strong>Le raccourci</strong> fonctionne parce que 1 et 0 sont exactement les valeurs neutres et unitaires de l'addition : ajouter une absence ne change rien, ajouter une présence ajoute un. La somme d'une ligne <em>est</em> donc le nombre de 1 qu'elle contient. Il cesserait de fonctionner dès que la grille admettrait une troisième valeur — un 2 pour une double séance, un −1 pour une absence injustifiée, ou même un 0,5 pour une demi-présence. La somme deviendrait alors une quantité différente du décompte, et les deux divergeraient sans qu'aucune erreur ne survienne : le taux d'assiduité dépasserait cent pour cent, ou tomberait sous zéro, et c'est le seul signe qu'on aurait. Le raccourci est donc élégant mais <em>fragile</em> : il repose sur une convention de codage des données, et il faut le documenter comme tel, faute de quoi la première évolution du fichier le casse en silence. <strong>La conclusion du trésorier</strong> est prématurée parce que la grille ne dit pas <em>quand</em> les séances ont eu lieu. Si la séance 5 était la seule à tomber un samedi matin, son taux exceptionnel s'explique par le créneau ; mais elle pouvait aussi être la séance précédant un tournoi, ou celle qui suivait une relance du club, ou simplement une semaine sans vacances scolaires. La grille mesure une corrélation entre un numéro de colonne et un taux, et un numéro de colonne n'est pas une cause. Il manque au minimum le jour et l'heure de chaque séance, et idéalement le contexte — période de vacances, météo, compétition à venir. C'est le même défaut que le tableau de bord du restaurant, sous un autre visage. <strong>Les parcours :</strong> mon algorithme traverse la grille <strong>trois</strong> fois — une pour la saisie, une par adhérent, une par séance. Aucune des trois ne peut être évitée sans changer la nature du résultat : les deux dernières regroupent selon deux axes différents, et il n'existe pas de parcours unique qui produise simultanément des totaux par ligne et par colonne… à ceci près qu'il en existe un. Un double parcours qui cumulerait dans <em>deux</em> tableaux à une dimension à la fois — l'un indexé par adhérent, l'autre par séance — les remplirait tous les deux en un seul passage sur les 96 cases. C'est ce qu'il faudrait faire si la grille comptait dix mille lignes ; ici, la clarté vaut mieux que le gain." }
