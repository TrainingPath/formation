<script>
var DAY = {
  num: 23,
  title: "La recherche dichotomique",
  subtitle: "Couper en deux : retrouver une valeur parmi un million en 20 questions.",
  theory: `
<h3>1. L'idée du dictionnaire</h3>
<p>Pour chercher « pixel » dans le dictionnaire, tu ne lis pas depuis la page 1 : tu ouvres au <strong>milieu</strong>, tu compares, et tu élimines la moitié inutile. Tu recommences sur la moitié restante. C'est la <strong>recherche dichotomique</strong> (en anglais <em>binary search</em>, « recherche binaire »). Le mot <strong>dichotomie</strong> vient du grec et signifie littéralement « couper en deux » : à chaque étape, on partage en deux la zone qui reste à explorer et on en jette une moitié.</p>
<p>Deux mots reviennent sans arrêt aujourd'hui. Un <strong>tableau</strong> est une rangée de cases numérotées contenant chacune une valeur (imagine une boîte d'œufs : chaque alvéole a un numéro et contient un œuf) ; le numéro d'une case s'appelle son <strong>indice</strong> (ou sa <strong>position</strong>), et l'écriture <code>t[milieu]</code> se lit « la valeur rangée dans la case numéro <em>milieu</em> du tableau t ». <strong>Comparer</strong> deux valeurs, c'est simplement regarder si l'une est égale, plus petite ou plus grande que l'autre (comme soupeser deux objets pour savoir lequel est le plus lourd) ; on appelle chaque vérification de ce genre une <strong>comparaison</strong>, et on les compte pour mesurer le travail que fournit l'algorithme.</p>
<div class="warn">Condition absolue : le tableau doit être <strong>TRIÉ</strong> (c'est-à-dire rangé dans l'ordre, ici du plus petit au plus grand, comme les mots d'un dictionnaire classés de A à Z). Sans tri, éliminer une moitié n'a aucun sens : rien ne garantirait que la valeur cherchée se trouve d'un côté plutôt que de l'autre.</div>
<h3>2. L'algorithme</h3>
<p>Voici la recette écrite en pseudocode. C'est une <strong>fonction</strong> : un mini-algorithme réutilisable qui reçoit des informations (ses <strong>paramètres</strong>, listés entre parenthèses) et renvoie un résultat (ici un ENTIER, c'est-à-dire un nombre entier). Nos paramètres sont <code>t</code> (le tableau trié), <code>n</code> (son nombre de cases) et <code>cherche</code> (la valeur qu'on veut trouver). Le mot-clé <strong>RETOURNER</strong> arrête aussitôt la fonction et renvoie une valeur à celui qui l'a appelée. La <strong>boucle</strong> <code>TANT QUE … FAIRE … FINTANTQUE</code> répète les mêmes étapes aussi longtemps qu'une condition reste vraie (comme « tant que le voyant est rouge, attends »). Enfin, <code>DIV</code> est la <strong>division entière</strong> : elle garde uniquement la partie entière du résultat en jetant ce qui suit la virgule (7 DIV 2 = 3, et non 3,5), tout comme partager 7 billes entre 2 enfants donne 3 billes chacun.</p>
<pre class="pseudo">FONCTION dichotomie(t, n, cherche) : ENTIER   // fonction : reçoit le tableau t, sa taille n et la valeur cherche ; renvoie un ENTIER (une position)
DEBUT                                        // début des instructions
    gauche ← 1                               // borne GAUCHE : première case encore possible (on numérote les cases à partir de 1)
    droite ← n                               // borne DROITE : dernière case encore possible (au départ, tout le tableau est concerné)
    TANT QUE gauche <= droite FAIRE          // on répète tant que la zone [gauche..droite] n'est pas vide
        milieu ← (gauche + droite) DIV 2     // indice de la case du MILIEU de la zone (division entière : on jette la virgule)
        SI t[milieu] = cherche ALORS         // la valeur du milieu est-elle exactement celle qu'on cherche ?
            RETOURNER milieu                 // trouvé ! on renvoie sa position et la fonction s'arrête immédiatement
        SINON SI t[milieu] < cherche ALORS   // sinon, la valeur du milieu est-elle trop PETITE ?
            gauche ← milieu + 1              // la cible est À DROITE : on abandonne la moitié gauche (milieu compris)
        SINON                                // dernier cas restant : la valeur du milieu est trop GRANDE
            droite ← milieu - 1              // la cible est À GAUCHE : on abandonne la moitié droite (milieu compris)
        FINSI                                // fin du choix entre les trois cas possibles
    FINTANTQUE                               // fin de la boucle : on remonte tester à nouveau la condition
    RETOURNER 0                              // on sort de la boucle : la zone est devenue vide → valeur ABSENTE (0 signifie « pas trouvé »)
FIN                                          // fin de la fonction</pre>
<h3>3. Exemple pas à pas</h3>
<p>t = [ 3 ][ 8 ][ 12 ][ 17 ][ 25 ][ 31 ][ 40 ], cherche = 31. Suivons l'algorithme à la main (chaque ligne montre l'état des bornes, puis la décision prise) :</p>
<pre class="pseudo">Étape 1 : gauche=1, droite=7 → milieu=4, t[4]=17
          17 < 31 → gauche ← 5
Étape 2 : gauche=5, droite=7 → milieu=6, t[6]=31
          TROUVÉ en position 6 : 2 comparaisons !</pre>
<p>(La recherche séquentielle — celle qui regarde les cases une par une depuis le début — en aurait fait 6.)</p>
<h3>4. Pourquoi c'est si puissant</h3>
<p>Chaque comparaison <strong>divise par 2</strong> la zone de recherche. Voici, selon la taille du tableau, le nombre de comparaisons au pire cas (le cas le plus défavorable) pour chaque méthode :</p>
<pre class="pseudo">Taille du tableau     Pire cas séquentiel     Pire cas dichotomie
100                   100                     7
1 000                 1 000                   10
1 000 000             1 000 000               20
1 000 000 000         1 milliard              30</pre>
<div class="tip">Le nombre d'étapes est le nombre de fois qu'on peut diviser n par 2 avant d'arriver à 1 : les mathématiciens appellent cela le <strong>logarithme en base 2</strong> de n (une opération qui grandit très, très lentement quand n explose). Retiens juste l'ordre de grandeur : n = 1 million → ~20 étapes. Vertigineux.</div>
<h3>5. Le contrat gauche/droite</h3>
<p>À tout moment, la zone [gauche..droite] est « la zone où la cible PEUT encore se trouver » : tout ce qui est en dehors a déjà été éliminé avec certitude. Cette promesse qui reste vraie du premier au dernier tour de boucle s'appelle un <strong>invariant</strong> (une propriété <em>invariable</em>, qui ne change jamais pendant l'exécution — comme la règle « il y a toujours autant d'assiettes que de convives » qu'on maintient en dressant la table). Quand <code>gauche</code> finit par dépasser <code>droite</code>, la zone est vide : il ne reste plus une seule case où la valeur pourrait se cacher, donc elle est absente. Savoir formuler un tel invariant est la marque des grands algorithmes.</p>`,

    { type: "qcm", q: "Quelle condition le tableau doit-il remplir pour la dichotomie ?", opts: ["Être grand", "Être TRIÉ", "Contenir des entiers positifs", "Aucune"], a: 1, exp: "Sans ordre, impossible de savoir quelle moitié éliminer." },

    { type: "qcm", q: "Et la recherche séquentielle sur le même million, au pire ?", opts: ["20", "1 000", "1 000 000", "2"], a: 2, exp: "Elle regarde tout : 50 000 fois plus de travail que la dichotomie." },
    { type: "qcm", q: "Le tableau [ 9 ][ 4 ][ 7 ][ 1 ] peut-il être fouillé par dichotomie ?", opts: ["Oui, directement", "Non : il n'est pas trié — il faut le trier d'abord (jour 24 !) ou chercher séquentiellement", "Oui si on cherche 9", "Oui si n est pair"], a: 1, exp: "Toujours vérifier le prérequis. Non trié → séquentielle, ou tri préalable." },
    { type: "input", q: "t = [ 2 ][ 5 ][ 9 ][ 14 ][ 20 ], cherche = 14. Combien de comparaisons ? (milieu=3 : 9<14 ; milieu=4 : trouvé)", a: "2", ph: "nombre", exp: "t[3]=9, puis t[4]=14 : deux comparaisons." },
    { type: "qcm", q: "Le jeu du nombre mystère (jour 11) avec « plus grand / plus petit »… c'était quoi en fait ?", opts: ["Une recherche séquentielle", "Une dichotomie déguisée : chaque réponse élimine la moitié des possibilités", "Un tri", "Un hasard"], a: 1, exp: "Le joueur optimal coupe l'intervalle en deux : 7 essais suffisent pour 1-100." },

  ],

gauche=5 droite=5 → milieu=5  t[5]=25   25=25 → TROUVÉ !   // position 5, en 3 comparaisons</pre>
<p>Trois comparaisons pour 7 valeurs ; sur un million de valeurs, il en faudrait à peine ~20. C'est toute la magie de « couper en deux ».</p>`

    solution: "FONCTION rechercheSequentielle(t : TABLEAU D'ENTIERS, n : ENTIER,\n                              cherche : ENTIER) : ENTIER\nVar\n    i : ENTIER\nDEBUT\n    i <- 1\n    TANT QUE i <= n ET t[i] <> cherche FAIRE\n        i <- i + 1\n    FINTANTQUE\n    SI i <= n ALORS\n        RETOURNER i\n    SINON\n        RETOURNER 0\n    FINSI\nFIN\n\nFONCTION comparaisonsSequentielle(t : TABLEAU D'ENTIERS, n : ENTIER,\n                                  cherche : ENTIER) : ENTIER\n/* a) une fonction ne rend qu'UNE valeur, et il en faut deux : la position et\n      le decompte. Plutot que de tricher avec une variable globale ou un\n      tableau a une case, on ecrit une fonction par question. C'est plus long\n      et parfaitement clair — chacune se teste seule. */\nVar\n    i, c : ENTIER\nDEBUT\n    i <- 1\n    c <- 0\n    TANT QUE i <= n ET t[i] <> cherche FAIRE\n        c <- c + 1\n        i <- i + 1\n    FINTANTQUE\n    SI i <= n ALORS\n        c <- c + 1        /* la comparaison qui a REUSSI n'a pas ete comptee :\n                             elle a fait sortir sans executer le corps */\n    FINSI\n    RETOURNER c\nFIN\n\nFONCTION rechercheDichotomique(t : TABLEAU D'ENTIERS, n : ENTIER,\n                               cherche : ENTIER) : ENTIER\nVar\n    debut, fin, milieu : ENTIER\nDEBUT\n    debut <- 1\n    fin <- n\n    TANT QUE debut <= fin FAIRE\n        milieu <- (debut + fin) DIV 2\n        SI t[milieu] = cherche ALORS\n            RETOURNER milieu\n        SINON SI t[milieu] < cherche ALORS\n            debut <- milieu + 1\n        SINON\n            fin <- milieu - 1\n        FINSI\n    FINTANTQUE\n    RETOURNER 0\nFIN\n\nFONCTION comparaisonsDichotomique(t : TABLEAU D'ENTIERS, n : ENTIER,\n                                  cherche : ENTIER) : ENTIER\nVar\n    debut, fin, milieu, c : ENTIER\nDEBUT\n    debut <- 1\n    fin <- n\n    c <- 0\n    TANT QUE debut <= fin FAIRE\n        milieu <- (debut + fin) DIV 2\n        c <- c + 1\n        SI t[milieu] = cherche ALORS\n            RETOURNER c\n        SINON SI t[milieu] < cherche ALORS\n            debut <- milieu + 1\n        SINON\n            fin <- milieu - 1\n        FINSI\n    FINTANTQUE\n    RETOURNER c\nFIN\n\nAlgorithme CatalogueEtoiles\nConst\n    N = 1024\nVar\n    etoile : TABLEAU[1..1024] D'ENTIERS\n    i, cherche, posSeq, posDicho, cmpSeq, cmpDicho : ENTIER\nDebut\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Ascension droite de l'etoile \", i, \" (croissante) ?\")\n        Lire(etoile[i])\n    FINPOUR\n\n    Ecrire(\"Ascension droite recherchee ?\")\n    Lire(cherche)\n\n    posSeq <- rechercheSequentielle(etoile, N, cherche)\n    posDicho <- rechercheDichotomique(etoile, N, cherche)\n    cmpSeq <- comparaisonsSequentielle(etoile, N, cherche)\n    cmpDicho <- comparaisonsDichotomique(etoile, N, cherche)\n\n    /* b) les deux methodes doivent trouver la MEME position */\n    SI posSeq <> posDicho ALORS\n        Ecrire(\"INCOHERENCE : le tableau est-il bien trie ?\")\n    FINSI\n\n    Ecrire(\"Position : \", posDicho)\n    Ecrire(\"Sequentielle : \", cmpSeq, \" comparaisons\")\n    Ecrire(\"Dichotomique : \", cmpDicho, \" comparaisons\")\n\n    /* c) et d) — pires cas, calcules et non estimes :\n         1 024 objets : sequentielle 1 024 ; dichotomique 11\n           (1024 -> 512 -> 256 -> 128 -> 64 -> 32 -> 16 -> 8 -> 4 -> 2 -> 1,\n            soit dix divisions et une derniere comparaison)\n         1 000 000 objets : sequentielle 1 000 000 ; dichotomique 20\n         DOUBLER le catalogue : la sequentielle DOUBLE son pire cas,\n         la dichotomique en ajoute UNE SEULE comparaison. */\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le doublement, en une phrase par méthode.</strong> Séquentielle : doubler le catalogue <em>double</em> le travail — deux fois plus d'étoiles, deux fois plus de cases à regarder. Dichotomique : doubler le catalogue ajoute <strong>une seule</strong> comparaison — une division de plus avant d'arriver à une case unique. C'est la totalité de la leçon, et c'est ce qui rend la méthode presque insensible à la taille : passer de mille à un million d'objets multiplie le catalogue par mille et double à peine le travail. <strong>Le seuil de rentabilité du tri.</strong> Sur mille objets, une recherche séquentielle coûte en moyenne cinq cents comparaisons et une dichotomique environ dix : chaque recherche fait donc gagner quatre cent quatre-vingt-dix comparaisons. Le tri coûtant dix mille comparaisons, il faut <code>10 000 / 490</code>, soit environ <strong>21 recherches</strong>, pour amortir la dépense. En dessous, trier est une perte nette ; au-delà, le gain devient rapidement écrasant — à mille recherches, le tri a fait gagner un demi-million de comparaisons pour dix mille investies. Le calcul se refait avec d'autres chiffres, mais sa forme ne change pas : on compare un coût fixe payé une fois à un gain récurrent. C'est la même arithmétique que celle qui décide d'acheter une machine plutôt que de louer. À noter que le raisonnement s'effondre si le catalogue est <em>modifié</em> entre les recherches : chaque insertion oblige à maintenir le tri, et le coût fixe redevient récurrent. <strong>Là où la séquentielle reste le seul choix</strong>, même en acceptant de payer le tri : sur des données qu'on ne peut pas ordonner, ou dont l'ordre ne dit rien de ce qu'on cherche. Trier des noms de famille permet de retrouver un nom, mais pas de retrouver « tous les adhérents de plus de soixante ans » — pour cette question-là, l'ordre alphabétique est inutile et il faut tout parcourir. Plus radicalement, la dichotomie suppose une relation d'ordre <em>totale</em> et compatible avec le critère de recherche ; sur des données où la comparaison n'a pas de sens — des couleurs, des photographies, des formes — il n'y a pas de milieu à examiner. Enfin, elle suppose un accès direct à n'importe quelle case : sur des données qui arrivent au fil de l'eau, ou qu'on ne peut lire que du début à la fin, il est impossible de sauter au milieu, et la séquentielle redevient la seule méthode praticable." }

    solution: "FONCTION positionDe(t : TABLEAU D'ENTIERS, nb : ENTIER,\n                    numero : ENTIER) : ENTIER\n/* a) dichotomie ordinaire : elle s'arrete sur l'egalite */\nVar\n    debut, fin, milieu : ENTIER\nDEBUT\n    debut <- 1\n    fin <- nb\n    TANT QUE debut <= fin FAIRE\n        milieu <- (debut + fin) DIV 2\n        SI t[milieu] = numero ALORS\n            RETOURNER milieu\n        SINON SI t[milieu] < numero ALORS\n            debut <- milieu + 1\n        SINON\n            fin <- milieu - 1\n        FINSI\n    FINTANTQUE\n    RETOURNER 0\nFIN\n\nFONCTION positionInsertion(t : TABLEAU D'ENTIERS, nb : ENTIER,\n                           numero : ENTIER) : ENTIER\n/* b) meme mecanique, SANS cas d'egalite : la valeur n'est pas la. La boucle\n      va donc toujours jusqu'au croisement des bornes — et a ce moment-la,\n      debut designe exactement la place ou la valeur devrait etre. */\nVar\n    debut, fin, milieu : ENTIER\nDEBUT\n    debut <- 1\n    fin <- nb\n    TANT QUE debut <= fin FAIRE\n        milieu <- (debut + fin) DIV 2\n        SI t[milieu] < numero ALORS\n            debut <- milieu + 1\n        SINON\n            fin <- milieu - 1\n        FINSI\n    FINTANTQUE\n    RETOURNER debut\nFIN\n\nPROCEDURE insererTrie(t : TABLEAU D'ENTIERS, nb : ENTIER,\n                      position : ENTIER, numero : ENTIER)\n/* c) le decalage part de la FIN. Dans l'autre sens, chaque case ecraserait\n      sa voisine AVANT de l'avoir deplacee, et la premiere valeur se\n      propagerait sur toute la zone — sans la moindre erreur signalee. */\nVar\n    i : ENTIER\nDEBUT\n    POUR i DE nb A position PAS -1 FAIRE\n        t[i + 1] <- t[i]\n    FINPOUR\n    t[position] <- numero\nFIN\n\nAlgorithme GuichetNumerote\nConst\n    CAPACITE = 300\nVar\n    vendues : TABLEAU[1..300] D'ENTIERS   /* trie en permanence */\n    nb, numero, position : ENTIER\nDebut\n    nb <- 0\n\n    REPETER\n        Ecrire(\"Numero de place demande (0 pour clore) ?\")\n        Lire(numero)\n        SI numero <> 0 ALORS\n            SI numero < 1 OU numero > CAPACITE ALORS\n                Ecrire(\"Ce numero n'existe pas dans cette salle\")\n            SINON SI positionDe(vendues, nb, numero) <> 0 ALORS\n                Ecrire(\"Place \", numero, \" deja vendue\")\n            SINON\n                position <- positionInsertion(vendues, nb, numero)\n                insererTrie(vendues, nb, position, numero)\n                nb <- nb + 1        /* APRES l'insertion : la procedure a\n                                       travaille sur l'ancien effectif */\n                Ecrire(\"Place \", numero, \" vendue (rang \", position,\n                       \" au fichier)\")\n            FINSI\n        FINSI\n    JUSQU'A numero = 0\n\n    Ecrire(nb, \" place(s) vendue(s) sur \", CAPACITE)\n    SI nb = 0 ALORS\n        Ecrire(\"Premiere place libre : 1\")\n    SINON SI vendues[1] > 1 ALORS\n        Ecrire(\"Premiere place libre : 1\")\n    SINON\n        Ecrire(\"Premiere place libre : \", vendues[nb] + 1)\n    FINSI\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le décalage à l'envers, déroulé.</strong> Soit trois cases contenant 10, 20, 30, et l'on veut décaler à partir de la première. Dans le bon sens — de la fin vers le début — la case 4 reçoit 30, la case 3 reçoit 20, la case 2 reçoit 10 : on obtient 10, 10, 20, 30, et la case 1 est libre. Dans le mauvais sens, la case 2 reçoit d'abord le contenu de la case 1, soit 10 — mais le 20 qu'elle contenait vient d'être écrasé. La case 3 reçoit alors le contenu de la case 2, qui vaut désormais 10 et non 20 : on obtient 10, 10, 10, 10. La première valeur s'est propagée sur toute la zone, les autres ont disparu, et <em>rien n'a été signalé</em> — aucun débordement, aucune division impossible, un tableau parfaitement bien formé et entièrement faux. C'est exactement le mécanisme de l'échange à deux affectations du jour 14, propagé le long d'un tableau. <strong>L'asymétrie recherche/insertion.</strong> La recherche coûte au plus neuf comparaisons sur trois cents places ; l'insertion peut coûter trois cents décalages. La structure est donc excellente pour lire et médiocre pour écrire, et cela n'a de conséquence que si l'on écrit souvent. Pour un théâtre de trois cents places vendues sur quelques semaines, l'asymétrie est sans importance : trois cents décalages sont instantanés, et la simplicité du tableau trié vaut tous les raffinements. Si le théâtre vendait mille places à la minute — un stade, une billetterie en ligne au moment de l'ouverture —, il faudrait changer de structure : soit renoncer au tri permanent et accepter une recherche séquentielle sur des données en désordre, soit adopter une structure qui reste triée sans décalage, ce qu'aucune rangée de cases contiguës ne permet. Le choix d'une structure n'est jamais « laquelle est la meilleure » mais « quelle opération fait-on le plus souvent ». <strong>L'ordre des quatre jours n'est pas le bon, et je peux dire lequel aurait dû venir en premier : le jour 3, la décomposition.</strong> J'ai écrit des procédures d'affichage parce qu'on me les demandait, puis des fonctions de calcul parce qu'on me les demandait, et ce n'est qu'au troisième jour que j'ai fait apparaître les sous-programmes à partir du problème. Le résultat a bien tenu — parce que l'énoncé des deux premiers jours avait été écrit par quelqu'un qui, lui, avait déjà décomposé. Sur un vrai projet, personne ne fournit cette liste : on part de la phrase du directeur, et si l'on commence à coder avant de l'avoir découpée, on écrit des sous-programmes qui correspondent aux idées qu'on a eues plutôt qu'aux besoins qu'il y a. Le jour 4, en revanche, est bien à sa place : on n'optimise que ce qui existe et qu'on a mesuré." }
