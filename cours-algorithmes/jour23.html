<script>
var DAY = {
  num: 23,
  title: "La recherche dichotomique",
  subtitle: "Couper en deux : retrouver une valeur parmi un million en 20 questions.",
  theory: `
<h3>1. L'idée du dictionnaire</h3>
<p>Pour chercher « pixel » dans le dictionnaire, tu ne lis pas depuis la page 1 : tu ouvres au <strong>milieu</strong>, tu compares, et tu élimines la moitié inutile. Tu recommences sur la moitié restante. C'est la <strong>recherche dichotomique</strong> (en anglais <em>binary search</em>, « recherche binaire »). Le mot <strong>dichotomie</strong> vient du grec et signifie littéralement « couper en deux » : à chaque étape, on partage en deux la zone qui reste à explorer et on en jette une moitié.</p>
<p>Deux mots reviennent sans arrêt aujourd'hui. Un <strong>tableau</strong> est une rangée de cases numérotées contenant chacune une valeur (imagine une boîte d'œufs : chaque alvéole a un numéro et contient un œuf) ; le numéro d'une case s'appelle son <strong>indice</strong> (ou sa <strong>position</strong>), et l'écriture <code>t[milieu]</code> se lit « la valeur rangée dans la case numéro <em>milieu</em> du tableau t ». <strong>Comparer</strong> deux valeurs, c'est simplement regarder si l'une est égale, plus petite ou plus grande que l'autre (comme soupeser deux objets pour savoir lequel est le plus lourd) ; on appelle chaque vérification de ce genre une <strong>comparaison</strong>, et on les compte pour mesurer le travail que fournit l'algorithme.</p>
<div class="warn">Condition absolue : le tableau doit être <strong>TRIÉ</strong> (c'est-à-dire rangé dans l'ordre, ici du plus petit au plus grand, comme les mots d'un dictionnaire classés de A à Z). Sans tri, éliminer une moitié n'a aucun sens : rien ne garantirait que la valeur cherchée se trouve d'un côté plutôt que de l'autre.</div>
<h3>2. L'algorithme</h3>
<p>Voici la recette écrite en pseudocode. C'est une <strong>fonction</strong> : un mini-algorithme réutilisable qui reçoit des informations (ses <strong>paramètres</strong>, listés entre parenthèses) et renvoie un résultat (ici un ENTIER, c'est-à-dire un nombre entier). Nos paramètres sont <code>t</code> (le tableau trié), <code>n</code> (son nombre de cases) et <code>cherche</code> (la valeur qu'on veut trouver). Le mot-clé <strong>RETOURNER</strong> arrête aussitôt la fonction et renvoie une valeur à celui qui l'a appelée. La <strong>boucle</strong> <code>TANT QUE … FAIRE … FINTANTQUE</code> répète les mêmes étapes aussi longtemps qu'une condition reste vraie (comme « tant que le voyant est rouge, attends »). Enfin, <code>DIV</code> est la <strong>division entière</strong> : elle garde uniquement la partie entière du résultat en jetant ce qui suit la virgule (7 DIV 2 = 3, et non 3,5), tout comme partager 7 billes entre 2 enfants donne 3 billes chacun.</p>
<pre class="pseudo">FONCTION dichotomie(t, n, cherche) : ENTIER   // fonction : reçoit le tableau t, sa taille n et la valeur cherche ; renvoie un ENTIER (une position)
DEBUT                                        // début des instructions
    gauche ← 1                               // borne GAUCHE : première case encore possible (on numérote les cases à partir de 1)
    droite ← n                               // borne DROITE : dernière case encore possible (au départ, tout le tableau est concerné)
    TANT QUE gauche <= droite FAIRE          // on répète tant que la zone [gauche..droite] n'est pas vide
        milieu ← (gauche + droite) DIV 2     // indice de la case du MILIEU de la zone (division entière : on jette la virgule)
        SI t[milieu] = cherche ALORS         // la valeur du milieu est-elle exactement celle qu'on cherche ?
            RETOURNER milieu                 // trouvé ! on renvoie sa position et la fonction s'arrête immédiatement
        SINON SI t[milieu] < cherche ALORS   // sinon, la valeur du milieu est-elle trop PETITE ?
            gauche ← milieu + 1              // la cible est À DROITE : on abandonne la moitié gauche (milieu compris)
        SINON                                // dernier cas restant : la valeur du milieu est trop GRANDE
            droite ← milieu - 1              // la cible est À GAUCHE : on abandonne la moitié droite (milieu compris)
        FINSI                                // fin du choix entre les trois cas possibles
    FINTANTQUE                               // fin de la boucle : on remonte tester à nouveau la condition
    RETOURNER 0                              // on sort de la boucle : la zone est devenue vide → valeur ABSENTE (0 signifie « pas trouvé »)
FIN                                          // fin de la fonction</pre>
<h3>3. Exemple pas à pas</h3>
<p>t = [ 3 ][ 8 ][ 12 ][ 17 ][ 25 ][ 31 ][ 40 ], cherche = 31. Suivons l'algorithme à la main (chaque ligne montre l'état des bornes, puis la décision prise) :</p>
<pre class="pseudo">Étape 1 : gauche=1, droite=7 → milieu=4, t[4]=17
          17 < 31 → gauche ← 5
Étape 2 : gauche=5, droite=7 → milieu=6, t[6]=31
          TROUVÉ en position 6 : 2 comparaisons !</pre>
<p>(La recherche séquentielle — celle qui regarde les cases une par une depuis le début — en aurait fait 6.)</p>
<h3>4. Pourquoi c'est si puissant</h3>
<p>Chaque comparaison <strong>divise par 2</strong> la zone de recherche. Voici, selon la taille du tableau, le nombre de comparaisons au pire cas (le cas le plus défavorable) pour chaque méthode :</p>
<pre class="pseudo">Taille du tableau     Pire cas séquentiel     Pire cas dichotomie
100                   100                     7
1 000                 1 000                   10
1 000 000             1 000 000               20
1 000 000 000         1 milliard              30</pre>
<div class="tip">Le nombre d'étapes est le nombre de fois qu'on peut diviser n par 2 avant d'arriver à 1 : les mathématiciens appellent cela le <strong>logarithme en base 2</strong> de n (une opération qui grandit très, très lentement quand n explose). Retiens juste l'ordre de grandeur : n = 1 million → ~20 étapes. Vertigineux.</div>
<h3>5. Le contrat gauche/droite</h3>
<p>À tout moment, la zone [gauche..droite] est « la zone où la cible PEUT encore se trouver » : tout ce qui est en dehors a déjà été éliminé avec certitude. Cette promesse qui reste vraie du premier au dernier tour de boucle s'appelle un <strong>invariant</strong> (une propriété <em>invariable</em>, qui ne change jamais pendant l'exécution — comme la règle « il y a toujours autant d'assiettes que de convives » qu'on maintient en dressant la table). Quand <code>gauche</code> finit par dépasser <code>droite</code>, la zone est vide : il ne reste plus une seule case où la valeur pourrait se cacher, donc elle est absente. Savoir formuler un tel invariant est la marque des grands algorithmes.</p>`,
  exercises: [
    { type: "qcm", q: "Quelle condition le tableau doit-il remplir pour la dichotomie ?", opts: ["Être grand", "Être TRIÉ", "Contenir des entiers positifs", "Aucune"], a: 1, exp: "Sans ordre, impossible de savoir quelle moitié éliminer." },
    { type: "qcm", q: "Que fait-on à chaque étape de la dichotomie ?", opts: ["On avance d'une case", "On compare au milieu et on élimine la moitié où la cible ne peut pas être", "On trie le tableau", "On compte les cases"], a: 1, exp: "Diviser pour régner." },
    { type: "input", q: "gauche = 1, droite = 7 : que vaut <code>milieu ← (gauche + droite) DIV 2</code> ?", a: "4", ph: "nombre", exp: "8 DIV 2 = 4." },
    { type: "input", q: "gauche = 5, droite = 6 : que vaut milieu ?", a: "5", ph: "nombre", exp: "11 DIV 2 = 5 : la division entière tranche." },
    { type: "qcm", q: "t[milieu] < cherche. Où continuer la recherche ?", opts: ["À gauche : droite ← milieu - 1", "À droite : gauche ← milieu + 1", "Au même endroit", "On abandonne"], a: 1, exp: "La case du milieu est trop petite : la cible (si elle existe) est après." },
    { type: "qcm", q: "Pourquoi <code>gauche ← milieu + 1</code> et pas <code>gauche ← milieu</code> ?", opts: ["Par coquetterie", "t[milieu] vient d'être testé : inutile de le garder dans la zone (et ça peut boucler à l'infini)", "Pour sauter des valeurs", "C'est une erreur"], a: 1, exp: "Le milieu est éliminé par le test : la zone doit rétrécir STRICTEMENT à chaque tour." },
    { type: "qcm", q: "Comment l'algorithme détecte-t-il que la valeur est ABSENTE ?", opts: ["t[milieu] = 0", "gauche > droite : la zone de recherche est devenue vide", "Après 100 tours", "milieu = 0"], a: 1, exp: "Zone vide = plus aucun endroit où la cible pourrait se cacher." },
    { type: "input", q: "t = [ 3 ][ 8 ][ 12 ][ 17 ][ 25 ][ 31 ][ 40 ], cherche = 12. Que vaut le PREMIER milieu testé (la valeur t[milieu]) ?", a: "17", ph: "nombre", exp: "milieu = 4, t[4] = 17." },
    { type: "input", q: "Suite : 17 > 12, donc droite ← 3. Nouveau milieu = (1+3) DIV 2 = 2, t[2] = 8 < 12 → gauche ← 3. Dernier test : t[3] = ? (et c'est trouvé !)", a: "12", ph: "nombre", exp: "3 comparaisons : 17, 8, 12. Trouvé en position 3." },
    { type: "input", q: "Tableau de 1 000 000 de valeurs triées : combien de comparaisons au PIRE avec la dichotomie ? (environ)", a: ["20", "~20", "20 comparaisons"], ph: "nombre", exp: "2 puissance 20 ≈ 1 million : 20 divisions par 2 suffisent." },
    { type: "qcm", q: "Et la recherche séquentielle sur le même million, au pire ?", opts: ["20", "1 000", "1 000 000", "2"], a: 2, exp: "Elle regarde tout : 50 000 fois plus de travail que la dichotomie." },
    { type: "qcm", q: "Le tableau [ 9 ][ 4 ][ 7 ][ 1 ] peut-il être fouillé par dichotomie ?", opts: ["Oui, directement", "Non : il n'est pas trié — il faut le trier d'abord (jour 24 !) ou chercher séquentiellement", "Oui si on cherche 9", "Oui si n est pair"], a: 1, exp: "Toujours vérifier le prérequis. Non trié → séquentielle, ou tri préalable." },
    { type: "input", q: "t = [ 2 ][ 5 ][ 9 ][ 14 ][ 20 ], cherche = 14. Combien de comparaisons ? (milieu=3 : 9<14 ; milieu=4 : trouvé)", a: "2", ph: "nombre", exp: "t[3]=9, puis t[4]=14 : deux comparaisons." },
    { type: "qcm", q: "Le jeu du nombre mystère (jour 11) avec « plus grand / plus petit »… c'était quoi en fait ?", opts: ["Une recherche séquentielle", "Une dichotomie déguisée : chaque réponse élimine la moitié des possibilités", "Un tri", "Un hasard"], a: 1, exp: "Le joueur optimal coupe l'intervalle en deux : 7 essais suffisent pour 1-100." },
    { type: "vf", q: "Sur un tableau de 8 cases, la dichotomie fait au pire 4 comparaisons (8 → 4 → 2 → 1).", a: true, exp: "Chaque étape divise par 2 : 3-4 étapes selon le cas. L'ordre de grandeur est logarithmique." }
  ],
  final: {
    title: "Exercice final — Retrouver un livre par son ISBN",
    intro: `<p>Une bibliothèque range ses livres par numéro ISBN croissant dans <code>t : TABLEAU[1..7]</code>. On cherche l'ISBN <strong>25</strong> avec la dichotomie :</p>
<pre class="pseudo">indice :   1     2     3     4     5     6     7        // les 7 positions du tableau trié
t :     [ 3 ][ 8 ][ 12 ][ 17 ][ 25 ][ 31 ][ 40 ]      // ISBN rangés du plus petit au plus grand
cherche = 25                                          // la valeur qu'on veut localiser</pre>`,
    questions: [
      { type: "input", q: "Étape 1 : gauche=1, droite=7. Quel est l'indice du milieu ?", a: "4", ph: "nombre", exp: "(1+7) DIV 2 = 4." },
      { type: "qcm", q: "t[4]=17 et 17 < 25. Que fait-on ?", opts: ["droite ← 3 (à gauche)", "gauche ← 5 (à droite)", "on a trouvé", "on abandonne"], a: 1, exp: "Le milieu est trop petit : la cible est après → gauche ← milieu+1 = 5." },
      { type: "input", q: "Étape 2 : gauche=5, droite=7. Nouvel indice du milieu ?", a: "6", ph: "nombre", exp: "(5+7) DIV 2 = 6." },
      { type: "qcm", q: "t[6]=31 et 31 > 25. Que fait-on ?", opts: ["gauche ← 7", "droite ← 5 (à gauche)", "on a trouvé", "erreur"], a: 1, exp: "Le milieu est trop grand : droite ← milieu-1 = 5." },
      { type: "input", q: "Étape 3 : gauche=5, droite=5, milieu=5, t[5]=25. En combien de comparaisons a-t-on trouvé ?", a: "3", ph: "nombre", exp: "17, 31, 25 : trois comparaisons contre cinq pour la recherche séquentielle." }
    ],
    solution: `<p>Déroulé complet de la recherche de 25 :</p>
<pre class="pseudo">gauche=1 droite=7 → milieu=4  t[4]=17   17<25 → gauche←5   // on jette la moitié gauche
gauche=5 droite=7 → milieu=6  t[6]=31   31>25 → droite←5   // on jette la moitié droite
gauche=5 droite=5 → milieu=5  t[5]=25   25=25 → TROUVÉ !   // position 5, en 3 comparaisons</pre>
<p>Trois comparaisons pour 7 valeurs ; sur un million de valeurs, il en faudrait à peine ~20. C'est toute la magie de « couper en deux ».</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "algo-dichotomie", title: "Présent ou absent ?", level: 3,
    statement: "Écris une fonction <code>contient(t, n, x)</code> qui renvoie VRAI si la valeur x est présente dans le tableau TRIÉ t (de n cases), FAUX sinon, en utilisant la recherche dichotomique.",
    hints: [
      "Reprends le squelette gauche/droite/milieu de la théorie.",
      "Dès que t[milieu] = x, RETOURNER VRAI.",
      "Si la boucle se termine (gauche > droite) sans avoir trouvé, RETOURNER FAUX."
    ],
    solution: "FONCTION contient(t, n, x) : BOOLEEN        // renvoie VRAI (présent) ou FAUX (absent)\nDEBUT                                       // début des instructions\n    gauche ← 1                              // première case possible\n    droite ← n                              // dernière case possible\n    TANT QUE gauche <= droite FAIRE         // tant que la zone n'est pas vide\n        milieu ← (gauche + droite) DIV 2    // indice du milieu (division entière)\n        SI t[milieu] = x ALORS              // valeur du milieu égale à la cible ?\n            RETOURNER VRAI                  // trouvé : on renvoie VRAI et on s'arrête\n        SINON SI t[milieu] < x ALORS        // milieu trop petit ?\n            gauche ← milieu + 1             // la cible est à droite\n        SINON                               // milieu trop grand\n            droite ← milieu - 1             // la cible est à gauche\n        FINSI                               // fin du choix\n    FINTANTQUE                              // fin de la boucle\n    RETOURNER FAUX                          // zone vide : la valeur est absente\nFIN                                         // fin de la fonction",
    note: "BOOLEEN est le type des valeurs VRAI/FAUX. Renvoyer un booléen (présent/absent) plutôt qu'une position est fréquent : on adapte la même mécanique dichotomique au besoin." }
  ]
};
