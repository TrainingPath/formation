  title: "La condition SI … ALORS … SINON",
  subtitle: "Donner le choix à l'algorithme : exécuter ou non des instructions.",
  theory: `
<h3>1. Pourquoi des conditions ?</h3>
<p>Jusqu'ici, nos algorithmes exécutaient TOUTES leurs lignes, dans l'ordre, toujours. Mais la vie est pleine de « si… » : « <em>si</em> il pleut, je prends un parapluie ». Une <strong>condition</strong> est une question à laquelle on répond par oui ou par non (une expression booléenne, vue au jour 3). La <strong>structure conditionnelle</strong> (aussi appelée « test ») permet d'exécuter un <strong>bloc</strong> d'instructions <strong>seulement si</strong> une condition est vraie. Un <strong>bloc</strong>, c'est simplement un groupe d'une ou plusieurs instructions qui vont ensemble.</p>
<h3>2. La forme simple : SI … ALORS</h3>
<pre class="pseudo">SI condition ALORS                  // teste la condition ; si elle est VRAIE, on entre dans le bloc
    instructions      // exécutées seulement si la condition est VRAIE
FINSI                               // marque la fin du bloc conditionnel</pre>
<pre class="pseudo">SI age >= 18 ALORS                  // la condition : age est-il ≥ 18 ?
    Écrire("Tu peux voter")          // affiché uniquement si la condition est VRAIE
FINSI                               // fin du bloc SI</pre>
<p>Si <code>age</code> vaut 15, l'algorithme <strong>saute</strong> le bloc (il l'ignore) et continue après FINSI. Rien ne s'affiche.</p>
<h3>3. La forme complète : SI … ALORS … SINON</h3>
<p>Le mot-clé <strong>SINON</strong> ajoute un second bloc, exécuté quand la condition est fausse :</p>
<pre class="pseudo">SI condition ALORS                  // si la condition est VRAIE…
    bloc A            // si la condition est VRAIE   // … on exécute le bloc A
SINON                               // sinon (condition FAUSSE)…
    bloc B            // si la condition est FAUSSE   // … on exécute le bloc B
FINSI                               // fin de la structure</pre>
<pre class="pseudo">SI note >= 10 ALORS                 // la note atteint-elle 10 ?
    Écrire("Réussi")                 // oui → on affiche Réussi
SINON                               // non (note < 10)…
    Écrire("Échoué")                 // … on affiche Échoué
FINSI                               // fin du bloc SI</pre>
<div class="tip">Avec SINON, <strong>exactement un</strong> des deux blocs s'exécute. Jamais les deux, jamais aucun.</div>
<h3>4. La condition est un booléen</h3>
<p>Entre SI et ALORS, on place n'importe quelle expression booléenne (jours 3 et 4), c'est-à-dire une expression qui vaut VRAI ou FAUX :</p>
<pre class="pseudo">SI n MOD 2 = 0 ALORS ...        // n est pair ?   // teste si le reste par 2 est nul
SI solde >= prix ALORS ...      // assez d'argent ?   // le solde couvre-t-il le prix ?
SI reponse = "oui" ALORS ...    // comparaison de chaînes   // le texte saisi vaut-il "oui" ?</pre>
<h3>5. Exemple complet</h3>
<pre class="pseudo">ALGORITHME PairImpair               // nom de l'algorithme
VARIABLES n : ENTIER                // une boîte à nombre entier
DEBUT                               // début des étapes
    Écrire("Donne un entier")        // invite l'utilisateur
    Lire(n)                          // range la saisie dans n
    SI n MOD 2 = 0 ALORS             // le reste de n par 2 est-il nul ?
        Écrire(n, " est pair")       // oui → n est pair
    SINON                            // sinon (reste = 1)…
        Écrire(n, " est impair")     // … n est impair
    FINSI                            // fin du bloc SI
FIN                                 // fin de l'algorithme</pre>
<div class="warn">N'oublie jamais le <strong>FINSI</strong> : il indique où se termine le bloc conditionnel. Sans lui, on ne sait pas quelles instructions dépendent du SI.</div>`,

    { type: "qcm", q: "Comment afficher le PLUS GRAND de deux nombres a et b ?", opts: ["SI a > b ALORS Écrire(a) SINON Écrire(b) FINSI", "Écrire(a + b)", "SI a > b ALORS Écrire(b) SINON Écrire(a) FINSI", "Écrire(a) puis Écrire(b)"], a: 0, exp: "Si a dépasse b on affiche a, sinon b. (Si égalité, b s'affiche — même valeur !)" },
    { type: "vf", q: "On peut mettre plusieurs instructions entre ALORS et SINON.", a: true, exp: "Un bloc peut contenir autant d'instructions que nécessaire." }

    intro: `<p>Un manège exige une taille <strong>minimale de 140 cm</strong>. Si le visiteur est assez grand, on lui vend un billet à 12 € ; s'il a un <strong>bon de réduction</strong>, il ne paie que 8 €. Sinon, l'accès est refusé.</p>
<pre class="pseudo">ALGORITHME Portique                         // nom de l'algorithme
VARIABLES taille : ENTIER                   // la taille du visiteur en cm
          bonReduc : BOOLEEN                // a-t-il un bon de réduction ? (VRAI/FAUX)
          prix : ENTIER                     // le prix qu'on va calculer
DEBUT                                       // début des étapes
    Lire(taille)                            // saisit la taille
    Lire(bonReduc)                          // saisit la présence d'un bon
    SI taille >= 140 ALORS                  // le visiteur est-il assez grand ?
        SI bonReduc = VRAI ALORS            // (test interne) a-t-il un bon ?
            prix ← 8                        // oui → tarif réduit 8 €
        SINON                               // sinon (pas de bon)…
            prix ← 12                       // … tarif plein 12 €
        FINSI                               // fin du test interne
        Écrire("Accès autorisé, prix : ", prix)   // annonce le prix
    SINON                                   // sinon (taille < 140)…

    FINSI                                   // fin du test externe
FIN                                         // fin de l'algorithme</pre>`,

    ],
