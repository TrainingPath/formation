<script>
var DAY = {
  num: 6,
  title: "La condition SI … ALORS … SINON",
  subtitle: "Donner le choix à l'algorithme : exécuter ou non des instructions.",
  theory: `
<h3>1. Pourquoi des conditions ?</h3>
<p>Jusqu'ici, nos algorithmes exécutaient TOUTES leurs lignes, dans l'ordre, toujours. Mais la vie est pleine de « si… » : « <em>si</em> il pleut, je prends un parapluie ». Une <strong>condition</strong> est une question à laquelle on répond par oui ou par non (une expression booléenne, vue au jour 3). La <strong>structure conditionnelle</strong> (aussi appelée « test ») permet d'exécuter un <strong>bloc</strong> d'instructions <strong>seulement si</strong> une condition est vraie. Un <strong>bloc</strong>, c'est simplement un groupe d'une ou plusieurs instructions qui vont ensemble.</p>
<h3>2. La forme simple : SI … ALORS</h3>
<pre class="pseudo">SI condition ALORS                  // teste la condition ; si elle est VRAIE, on entre dans le bloc
    instructions      // exécutées seulement si la condition est VRAIE
FINSI                               // marque la fin du bloc conditionnel</pre>
<pre class="pseudo">SI age >= 18 ALORS                  // la condition : age est-il ≥ 18 ?
    Écrire("Tu peux voter")          // affiché uniquement si la condition est VRAIE
FINSI                               // fin du bloc SI</pre>
<p>Si <code>age</code> vaut 15, l'algorithme <strong>saute</strong> le bloc (il l'ignore) et continue après FINSI. Rien ne s'affiche.</p>
<h3>3. La forme complète : SI … ALORS … SINON</h3>
<p>Le mot-clé <strong>SINON</strong> ajoute un second bloc, exécuté quand la condition est fausse :</p>
<pre class="pseudo">SI condition ALORS                  // si la condition est VRAIE…
    bloc A            // si la condition est VRAIE   // … on exécute le bloc A
SINON                               // sinon (condition FAUSSE)…
    bloc B            // si la condition est FAUSSE   // … on exécute le bloc B
FINSI                               // fin de la structure</pre>
<pre class="pseudo">SI note >= 10 ALORS                 // la note atteint-elle 10 ?
    Écrire("Réussi")                 // oui → on affiche Réussi
SINON                               // non (note < 10)…
    Écrire("Échoué")                 // … on affiche Échoué
FINSI                               // fin du bloc SI</pre>
<div class="tip">Avec SINON, <strong>exactement un</strong> des deux blocs s'exécute. Jamais les deux, jamais aucun.</div>
<h3>4. La condition est un booléen</h3>
<p>Entre SI et ALORS, on place n'importe quelle expression booléenne (jours 3 et 4), c'est-à-dire une expression qui vaut VRAI ou FAUX :</p>
<pre class="pseudo">SI n MOD 2 = 0 ALORS ...        // n est pair ?   // teste si le reste par 2 est nul
SI solde >= prix ALORS ...      // assez d'argent ?   // le solde couvre-t-il le prix ?
SI reponse = "oui" ALORS ...    // comparaison de chaînes   // le texte saisi vaut-il "oui" ?</pre>
<h3>5. Exemple complet</h3>
<pre class="pseudo">ALGORITHME PairImpair               // nom de l'algorithme
VARIABLES n : ENTIER                // une boîte à nombre entier
DEBUT                               // début des étapes
    Écrire("Donne un entier")        // invite l'utilisateur
    Lire(n)                          // range la saisie dans n
    SI n MOD 2 = 0 ALORS             // le reste de n par 2 est-il nul ?
        Écrire(n, " est pair")       // oui → n est pair
    SINON                            // sinon (reste = 1)…
        Écrire(n, " est impair")     // … n est impair
    FINSI                            // fin du bloc SI
FIN                                 // fin de l'algorithme</pre>
<div class="warn">N'oublie jamais le <strong>FINSI</strong> : il indique où se termine le bloc conditionnel. Sans lui, on ne sait pas quelles instructions dépendent du SI.</div>`,
  exercises: [
    { type: "qcm", q: "Que permet la structure SI … ALORS ?", opts: ["De répéter des instructions", "D'exécuter un bloc seulement si une condition est vraie", "De déclarer une variable", "D'afficher du texte"], a: 1, exp: "C'est la structure de CHOIX." },
    { type: "qcm", q: "<code>SI age >= 18 ALORS Écrire(\"majeur\") FINSI</code> avec age = 15 : qu'affiche-t-on ?", opts: ["majeur", "mineur", "Rien du tout", "15"], a: 2, exp: "Condition fausse, pas de SINON : le bloc est sauté, rien ne s'affiche." },
    { type: "qcm", q: "Avec un SI … ALORS … SINON … FINSI, combien de blocs s'exécutent ?", opts: ["Toujours les deux", "Exactement un des deux", "Aucun si la condition est fausse", "Ça dépend du nombre de variables"], a: 1, exp: "VRAI → bloc ALORS ; FAUX → bloc SINON. Toujours exactement un." },
    { type: "qcm", q: "note = 10. Que fait <code>SI note >= 10 ALORS Écrire(\"Réussi\") SINON Écrire(\"Échoué\") FINSI</code> ?", opts: ["Affiche Réussi", "Affiche Échoué", "Affiche les deux", "Rien"], a: 0, exp: ">= inclut l'égalité : 10 >= 10 est VRAI." },
    { type: "qcm", q: "Quel mot-clé ferme obligatoirement un SI ?", opts: ["FIN", "FINSI", "STOP", "FERMER"], a: 1, exp: "FINSI délimite la fin du bloc conditionnel." },
    { type: "vf", q: "La condition placée entre SI et ALORS doit être une expression booléenne (VRAI ou FAUX).", a: true, exp: "L'algorithme doit pouvoir trancher : oui ou non." },
    { type: "qcm", q: "x = 7. Trace : <code>SI x > 5 ALORS x ← x + 10 FINSI</code>, puis <code>Écrire(x)</code>. Affichage ?", opts: ["7", "17", "5", "10"], a: 1, exp: "7 > 5 est VRAI : x devient 17." },
    { type: "qcm", q: "x = 3. Même code : <code>SI x > 5 ALORS x ← x + 10 FINSI</code>, <code>Écrire(x)</code>. Affichage ?", opts: ["13", "3", "10", "Rien"], a: 1, exp: "3 > 5 est FAUX : l'affectation est sautée, x reste 3." },
    { type: "qcm", q: "Pour tester si un nombre est NÉGATIF, quelle condition ?", opts: ["n > 0", "n = 0", "n < 0", "n MOD 2 = 0"], a: 2, exp: "Négatif = strictement inférieur à zéro." },
    { type: "vf", q: "<code>SI n MOD 2 = 0 ALORS Écrire(\"pair\") SINON Écrire(\"impair\") FINSI</code> : avec n = 9, on affiche « impair ».", a: true, exp: "9 MOD 2 = 1 ≠ 0 : condition fausse → bloc SINON." },
    { type: "qcm", q: "solde = 20, prix = 25. <code>SI solde >= prix ALORS Écrire(\"Achat OK\") SINON Écrire(\"Solde insuffisant\") FINSI</code> ?", opts: ["Achat OK", "Solde insuffisant", "Rien", "Erreur"], a: 1, exp: "20 >= 25 est FAUX → SINON." },
    { type: "qcm", q: "Quelle est la différence entre <code>SI a = b</code> et <code>a ← b</code> ?", opts: ["Aucune", "Le premier compare (question), le second affecte (action)", "Le premier affecte, le second compare", "Les deux comparent"], a: 1, exp: "Rappel du jour 4 : = pose une question, ← range une valeur." },
    { type: "qcm", q: "temp = 5. <code>SI temp < 0 ALORS Écrire(\"gel\") FINSI</code> <code>Écrire(\"fin\")</code>. Qu'affiche-t-on ?", opts: ["gel puis fin", "gel", "fin", "Rien"], a: 2, exp: "Le bloc SI est sauté, mais « fin » est APRÈS le FINSI : il s'affiche toujours." },
    { type: "qcm", q: "Comment afficher le PLUS GRAND de deux nombres a et b ?", opts: ["SI a > b ALORS Écrire(a) SINON Écrire(b) FINSI", "Écrire(a + b)", "SI a > b ALORS Écrire(b) SINON Écrire(a) FINSI", "Écrire(a) puis Écrire(b)"], a: 0, exp: "Si a dépasse b on affiche a, sinon b. (Si égalité, b s'affiche — même valeur !)" },
    { type: "vf", q: "On peut mettre plusieurs instructions entre ALORS et SINON.", a: true, exp: "Un bloc peut contenir autant d'instructions que nécessaire." }
  ],
  final: {
    title: "Exercice final — Le portique du parc d'attractions",
    intro: `<p>Un manège exige une taille <strong>minimale de 140 cm</strong>. Si le visiteur est assez grand, on lui vend un billet à 12 € ; s'il a un <strong>bon de réduction</strong>, il ne paie que 8 €. Sinon, l'accès est refusé.</p>
<pre class="pseudo">ALGORITHME Portique                         // nom de l'algorithme
VARIABLES taille : ENTIER                   // la taille du visiteur en cm
          bonReduc : BOOLEEN                // a-t-il un bon de réduction ? (VRAI/FAUX)
          prix : ENTIER                     // le prix qu'on va calculer
DEBUT                                       // début des étapes
    Lire(taille)                            // saisit la taille
    Lire(bonReduc)                          // saisit la présence d'un bon
    SI taille >= 140 ALORS                  // le visiteur est-il assez grand ?
        SI bonReduc = VRAI ALORS            // (test interne) a-t-il un bon ?
            prix ← 8                        // oui → tarif réduit 8 €
        SINON                               // sinon (pas de bon)…
            prix ← 12                       // … tarif plein 12 €
        FINSI                               // fin du test interne
        Écrire("Accès autorisé, prix : ", prix)   // annonce le prix
    SINON                                   // sinon (taille < 140)…
        Écrire("Accès refusé")              // … on refuse l'accès
    FINSI                                   // fin du test externe
FIN                                         // fin de l'algorithme</pre>`,
    questions: [
      { type: "qcm", q: "taille = 150, bonReduc = FAUX : qu'affiche l'algorithme ?", opts: ["Accès autorisé, prix : 8", "Accès autorisé, prix : 12", "Accès refusé", "Rien"], a: 1, exp: "150 >= 140 VRAI, mais pas de bon : prix ← 12." },
      { type: "qcm", q: "taille = 150, bonReduc = VRAI : quel prix ?", opts: ["8", "12", "0", "Accès refusé"], a: 0, exp: "Grand ET muni d'un bon : 8 €." },
      { type: "qcm", q: "taille = 139, bonReduc = VRAI : qu'affiche-t-on ?", opts: ["Accès autorisé, prix : 8", "Accès autorisé, prix : 12", "Accès refusé", "prix : 0"], a: 2, exp: "139 >= 140 est FAUX : le bon ne sert à rien, on va direct au SINON externe." },
      { type: "input", q: "Quelle taille minimale EXACTE permet l'accès ? (en cm)", a: "140", ph: "nombre", exp: ">= 140 : 140 cm pile suffit." },
      { type: "vf", q: "Dans cet algorithme, la question du bon de réduction n'est posée QUE si la taille est suffisante.", a: true, exp: "Le SI interne est à l'intérieur du bloc ALORS externe : c'est un SI imbriqué (approfondi demain !)." }
    ],
    solution: `<p>Table de tous les cas possibles :</p>
<pre class="pseudo">taille   bonReduc   Affichage
150      FAUX       Accès autorisé, prix : 12
150      VRAI       Accès autorisé, prix : 8
139      VRAI       Accès refusé
139      FAUX       Accès refusé
140      FAUX       Accès autorisé, prix : 12</pre>
<p>Méthode : pour vérifier un algorithme conditionnel, on teste TOUS les chemins (chaque combinaison VRAI/FAUX).</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "algo-pairimpair", title: "Pair ou impair", level: 1,
    statement: "Écris un algorithme qui lit un entier et affiche <code>\"pair\"</code> ou <code>\"impair\"</code>.",
    hints: [
      "Un nombre est pair si le reste de sa division par 2 vaut 0.",
      "L'opérateur qui donne le reste de la division entière est <code>MOD</code>.",
      "Un seul SI suffit : SI n MOD 2 = 0 ALORS … SINON … FINSI."
    ],
    solution: "ALGORITHME PairImpair            // nom de l'algorithme\nVARIABLES n : ENTIER             // le nombre à tester\nDEBUT                            // début des instructions\n    Écrire(\"Entre un nombre :\")  // invite l'utilisateur à taper\n    Lire(n)                      // range la saisie dans n\n    SI n MOD 2 = 0 ALORS         // MOD donne le reste de la division par 2\n        Écrire(\"pair\")           // reste 0 → le nombre est pair\n    SINON                        // dans tous les autres cas (reste 1)\n        Écrire(\"impair\")         // le nombre est impair\n    FINSI                        // ferme le bloc SI\nFIN                              // fin de l'algorithme",
    note: "MOD a été vu au jour 4 — c'est l'outil parfait pour la parité." },
  { id: "algo-plusgrand3", title: "Le plus grand de trois", level: 1,
    statement: "Lis trois entiers et affiche le plus grand des trois.",
    hints: [
      "Pars du principe que le premier est le plus grand, puis remets cette hypothèse en question.",
      "Utilise une variable max : max ← a, puis compare-la à b, puis à c.",
      "Deux SI successifs (sans SINON) suffisent : SI b > max ALORS max ← b, puis pareil pour c."
    ],
    solution: "ALGORITHME PlusGrandDeTrois     // nom de l'algorithme\nVARIABLES a, b, c, max : ENTIER // les 3 valeurs lues + le maximum courant\nDEBUT                           // début des instructions\n    Écrire(\"Trois nombres ?\")   // invite\n    Lire(a)                     // première valeur\n    Lire(b)                     // deuxième valeur\n    Lire(c)                     // troisième valeur\n    max ← a                     // hypothèse de départ : a est le plus grand\n    SI b > max ALORS            // b dépasse-t-il le max actuel ?\n        max ← b                 // oui → b devient le nouveau max\n    FINSI                       // fin du test sur b\n    SI c > max ALORS            // c dépasse-t-il le max actuel ?\n        max ← c                 // oui → c devient le nouveau max\n    FINSI                       // fin du test sur c\n    Écrire(\"Le plus grand : \", max) // affiche le résultat\nFIN                             // fin de l'algorithme",
    note: "Cette technique « hypothèse puis correction » s'étend à un tableau entier (jour 17)." }
  ]
};
