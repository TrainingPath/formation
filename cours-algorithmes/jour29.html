  title: "Piles et files",

  theory: `
<h3>1. Au-delà du tableau : organiser les accès</h3>
<p>Rappel : une <strong>structure de données</strong> est une façon organisée de ranger plusieurs valeurs en mémoire pour les retrouver ensuite. Le <strong>tableau</strong> (la structure des jours précédents : une suite de cases numérotées) donne accès à tout, tout le temps : on peut lire ou écrire n'importe quelle case, dans n'importe quel ordre. Mais beaucoup de situations imposent au contraire une <strong>discipline d'accès</strong> : une règle stricte qui décide QUI on peut lire, et QUAND. Par exemple, on ne sert que le premier arrivé, ou on ne reprend que le dernier posé. On ne choisit plus librement : la règle choisit pour nous.</p>
<p>Deux structures classiques encadrent cela : la <strong>pile</strong> et la <strong>file</strong>. Ce sont deux « boîtes à valeurs » qui ne se distinguent que par une chose : l'ordre dans lequel les éléments en ressortent.</p>
<h3>2. La PILE (stack) : LIFO — dernier arrivé, premier sorti</h3>
<p>Une <strong>pile</strong> (en anglais <em>stack</em>) est une structure où l'on ajoute et retire toujours par le même bout, appelé le <strong>sommet</strong> (le dessus de la pile). Image concrète : une <strong>pile d'assiettes</strong> dans un placard. On pose la nouvelle assiette <strong>au sommet</strong> (sur le dessus), et quand on en prend une, on prend forcément celle <strong>du sommet</strong> — jamais celle du fond. On dit qu'une pile est <strong>LIFO</strong>, abréviation de l'anglais <em>Last In, First Out</em> : « dernier entré, premier sorti ». Le dernier élément ajouté sera le premier à ressortir.</p>
<p>Une pile se manipule avec un petit jeu d'opérations (des actions au nom fixe, comme des boutons dédiés). Chaque ligne ci-dessous est commentée après le symbole <code>//</code> (qui introduit un <strong>commentaire</strong> : un texte pour l'humain, ignoré par la machine). Ici <code>p</code> désigne la pile et <code>x</code> une valeur :</p>
<pre class="pseudo">EMPILER(p, x)     // opération « poser » : on ajoute la valeur x au SOMMET de la pile p
x ← DÉPILER(p)    // opération « reprendre » : on retire le sommet ET on renvoie sa valeur (rangée ici dans x)
SOMMET(p)         // opération « regarder » : on CONSULTE la valeur du sommet SANS la retirer
ESTVIDE(p)        // opération « tester » : renvoie VRAI si la pile ne contient aucun élément, FAUX sinon</pre>
<p>Déroulons un exemple. Le symbole <code>;</code> sépare simplement deux instructions écrites sur la même ligne, et la flèche <code>→</code> se lit « donne comme résultat » :</p>
<pre class="pseudo">EMPILER(p, 3) ; EMPILER(p, 7) ; EMPILER(p, 9)   // on pose 3, puis 7 par-dessus, puis 9 tout en haut
      [ 9 ]  ← sommet                            // 9 est le dernier posé : il est au sommet (dessus)
      [ 7 ]                                       // 7 est au milieu
      [ 3 ]                                       // 3 est au fond (le premier posé)
DÉPILER(p) → 9    (le DERNIER posé sort en PREMIER)   // on retire le sommet : c'est 9 qui sort</pre>
<p><strong>Utilisations réelles</strong> : le bouton <strong>Annuler</strong> (Ctrl+Z) — chaque action que tu fais est « posée » sur une pile, et Annuler « reprend » la dernière, donc la plus récente action est la première annulée ; le bouton <strong>Retour</strong> (page précédente) du navigateur — même principe avec les pages visitées ; et la gestion des <strong>appels de fonctions</strong> — la récursivité du jour 26 EST une pile d'appels ! (On y revient au point 6.)</p>
<h3>3. La FILE (queue) : FIFO — premier arrivé, premier servi</h3>
<p>Une <strong>file</strong> (en anglais <em>queue</em>, qui veut dire « file d'attente ») est une structure où l'on ajoute par un bout (l'<strong>arrière</strong>) et où l'on retire par l'autre bout (l'<strong>avant</strong>). Image concrète : la <strong>file d'attente de la boulangerie</strong>. On entre par l'<strong>arrière</strong> (on se met au bout de la queue), on est servi et on sort par l'<strong>avant</strong> (la tête de la queue). On dit qu'une file est <strong>FIFO</strong>, abréviation de l'anglais <em>First In, First Out</em> : « premier entré, premier sorti ». Le premier arrivé est le premier servi — c'est la règle équitable de l'attente.</p>
<pre class="pseudo">ENFILER(f, x)     // opération « ajouter » : la valeur x rejoint l'ARRIÈRE (la fin) de la file f
x ← DÉFILER(f)    // opération « servir » : l'élément à l'AVANT (le plus ancien) est retiré et renvoyé
ESTVIDE(f)        // opération « tester » : renvoie VRAI si la file ne contient aucun élément</pre>
<p>Déroulons un exemple avec des prénoms (les guillemets <code>" "</code> délimitent du texte) :</p>
<pre class="pseudo">ENFILER(f, "Ana") ; ENFILER(f, "Bob") ; ENFILER(f, "Zoé")   // Ana entre, puis Bob derrière, puis Zoé au bout
avant → [ Ana ][ Bob ][ Zoé ] ← arrière                     // Ana est à l'avant (arrivée en 1er), Zoé à l'arrière
DÉFILER(f) → "Ana"   (la PREMIÈRE arrivée sort en PREMIER)  // on sert l'avant : c'est Ana qui sort</pre>
<p><strong>Utilisations réelles</strong> : la <strong>file d'impression</strong> (les documents s'impriment dans l'ordre d'envoi), les <strong>tickets de support</strong> traités dans l'ordre d'arrivée, les <strong>messages réseau</strong> livrés dans l'ordre, la <strong>playlist « à suivre »</strong> qui joue les morceaux dans l'ordre où tu les as ajoutés.</p>
<h3>4. Le choix en une question</h3>
<div class="tip">Pour savoir laquelle des deux structures utiliser, pose-toi UNE seule question : « Qui doit sortir en premier ? » Le plus RÉCENT (le dernier arrivé) → <strong>pile</strong> (LIFO). Le plus ANCIEN (le premier arrivé) → <strong>file</strong> (FIFO). C'est tout : cette boussole suffit à choisir dans 100 % des cas.</div>
<h3>5. Vérifier des parenthèses avec une pile (classique d'entretien !)</h3>
<p>Voici un problème réel où la pile brille : vérifier qu'une expression a ses parenthèses <strong>bien équilibrées</strong> (chaque <code>(</code> ouvrante possède une <code>)</code> fermante correspondante, dans le bon ordre). L'idée : on parcourt l'expression caractère par caractère ; chaque <code>(</code> rencontrée est empilée (comme une « dette » à rembourser), et chaque <code>)</code> dépile une <code>(</code> (elle « rembourse » l'ouverture la plus récente). Le mot-clé <strong>RETOURNER</strong> renvoie un résultat et arrête l'algorithme ; <strong>VRAI</strong> et <strong>FAUX</strong> sont les deux valeurs booléennes (oui/non) vues plus tôt dans le mois.</p>
<pre class="pseudo">POUR chaque caractère c de l'expression FAIRE     // on lit l'expression, un caractère c à la fois
    SI c = "(" ALORS EMPILER(p, c) FINSI            // parenthèse OUVRANTE : on l'empile (une ouverture à refermer)
    SI c = ")" ALORS                               // parenthèse FERMANTE : elle doit correspondre à une ouverture
        SI ESTVIDE(p) ALORS RETOURNER FAUX FINSI    // ) alors que la pile est vide = ) sans ( : déséquilibre → FAUX
        DÉPILER(p)                                  // sinon on retire une ( : cette paire ()  est refermée
    FINSI                                           // fin du traitement du caractère fermant
FINPOUR                                             // on passe au caractère suivant, jusqu'à la fin
RETOURNER ESTVIDE(p)      // tout ( doit avoir trouvé sa )   // à la fin : pile vide = équilibré (VRAI) ; sinon ( orphelines → FAUX</pre>
<h3>6. Le lien caché avec la récursivité</h3>
<p>Souviens-toi du jour 26 : quand une fonction s'appelle elle-même (récursivité), chaque appel attend que l'appel suivant se termine avant de continuer. L'ordinateur range ces appels en attente dans une structure appelée la <strong>pile d'appels</strong> : le dernier appel commencé est le premier à se terminer, exactement comme une pile d'assiettes. Comprendre la pile, c'est donc comprendre de l'intérieur comment fonctionne la récursivité.</p>
<div class="warn">Dépiler une pile vide (ou défiler une file vide) est une <strong>erreur</strong> : on tente de reprendre un élément qui n'existe pas, exactement comme le débordement de tableau (lire une case inexistante). La parade est simple et systématique : on teste <code>ESTVIDE</code> AVANT de dépiler ou défiler — toujours.</div>`,

Sortie 3,1,2 (impossible) :                        // objectif : 3 en premier, puis 1, puis 2

    reflexion: "Les deux structures se réalisent avec le même tableau et se distinguent par un seul choix — le bout par lequel on sort. Pour chacune des situations suivantes, dis laquelle convient et pourquoi : les pages visitées d'un navigateur avec son bouton « retour » ; les documents envoyés à une imprimante partagée ; les appels de fonctions imbriqués d'un programme récursif ; les tickets d'un service après-vente. Puis : l'une de ces quatre situations pourrait légitimement demander l'autre structure sous certaines conditions — laquelle, et lesquelles ?",
    indices: [
      "Deux structures dans un même algorithme, et la tentation de partager du code entre elles. Résiste : elles n'ont pas le même nombre de repères, et une opération d'enfilement ne ressemble à un empilement qu'en surface.",
      "Le plan : pour la file, deux entiers — l'un désignant le prochain à sortir, l'autre le prochain emplacement libre — et un décompte. Pour la pile, un seul entier. Chaque opération vérifie son cas limite avant d'agir. Enfin, faire passer la même suite dans les deux et comparer.",

    solution: "Algorithme RegieDuStudio\nConst\n    CAPACITE = 10\nVar\n    /* la FILE : deux reperes plus un decompte */\n    morceau : TABLEAU[1..10] DE CHAINES\n    tete, queue, nbFile : ENTIER\n    /* la PILE : un seul repere */\n    action : TABLEAU[1..10] DE CHAINES\n    sommet : ENTIER\n    i : ENTIER\n    element : CHAINE\nDebut\n    tete <- 1\n    queue <- 1\n    nbFile <- 0\n    sommet <- 0\n\n    /* c) la MEME suite de cinq elements entre dans les deux structures */\n    POUR i DE 1 A 5 FAIRE\n        Ecrire(\"Element \", i, \" ?\")\n        Lire(element)\n\n        /* a) ENFILER : on range a la queue, on avance la queue */\n        SI nbFile = CAPACITE ALORS\n            Ecrire(\"File pleine\")\n        SINON\n            morceau[queue] <- element\n            queue <- queue + 1\n            nbFile <- nbFile + 1\n        FINSI\n\n        /* b) EMPILER : on augmente le sommet, on ecrit */\n        SI sommet = CAPACITE ALORS\n            Ecrire(\"Pile pleine\")\n        SINON\n            sommet <- sommet + 1\n            action[sommet] <- element\n        FINSI\n    FINPOUR\n\n    /* on vide la FILE : on sort par la TETE, l'autre bout que celui d'entree */\n    Ecrire(\"Sortie de la file (premier entre, premier sorti) :\")\n    TANT QUE nbFile > 0 FAIRE\n        Ecrire(\"  \", morceau[tete])\n        tete <- tete + 1\n        nbFile <- nbFile - 1\n    FINTANTQUE\n\n    /* on vide la PILE : on sort par le MEME bout que celui d'entree */\n    Ecrire(\"Sortie de la pile (dernier entre, premier sorti) :\")\n    TANT QUE sommet > 0 FAIRE\n        Ecrire(\"  \", action[sommet])\n        sommet <- sommet - 1\n    FINTANTQUE\nFin",
    reponses: [
      { ref: "d", texte: "Le problème est réel : mes deux repères ne font qu'<strong>avancer</strong>, jamais reculer. Après dix enfilements et dix défilements sur un tableau de dix cases, la file est vide — le décompte vaut zéro — et pourtant la queue est arrivée au bout du tableau : plus rien ne peut entrer, alors que les dix cases sont libres. La structure s'est <em>épuisée</em> sans se remplir. Deux solutions. La plus simple consiste à <strong>décaler</strong> tout le contenu vers le début à chaque défilement, ce qui remet la tête à un — mais coûte un déplacement par élément restant, donc un coût linéaire pour une opération qui devrait être immédiate. La bonne solution est le <strong>tableau circulaire</strong> : lorsqu'un repère dépasse la dernière case, il revient à la première, comme une aiguille d'horloge. On l'obtient en remplaçant l'incrément par un incrément modulo la capacité. Le tableau ne s'épuise alors jamais, et c'est le décompte — et non la position relative des deux repères — qui distingue la file vide de la file pleine. C'est précisément pour cela que j'ai tenu un décompte séparé plutôt que de comparer tête et queue : dans un tableau circulaire, <code>tete = queue</code> signifie <em>soit</em> vide <em>soit</em> plein, et rien ne permet de trancher sans un troisième renseignement." },
      { ref: "Réflexion", texte: "<strong>Les quatre situations.</strong> Le bouton « retour » d'un navigateur est une <strong>pile</strong> : on revient à la page précédente, c'est-à-dire à la dernière empilée. Une file donnerait un bouton qui ramènerait à la toute première page de la session, ce qui n'a aucun sens. Les documents d'une imprimante partagée forment une <strong>file</strong> : le premier envoyé s'imprime en premier, et l'inverse serait insupportable — celui qui a lancé son document il y a une heure ne l'obtiendrait jamais tant que d'autres continueraient d'en envoyer. Les appels de fonctions imbriqués sont une <strong>pile</strong>, et ce n'est pas une image : c'est littéralement ainsi que la machine les gère, chaque appel empilant son contexte et le dépilant au retour — c'est ce qui explique que la récursivité du jour 26 remonte dans l'ordre inverse de sa descente, et c'est ce qui déborde quand une récursion ne s'arrête pas. Les tickets d'un service après-vente sont une <strong>file</strong>, pour la même raison d'équité que l'imprimante. <strong>La situation qui pourrait basculer</strong> est celle des tickets du service après-vente. Une file pure traite dans l'ordre d'arrivée, ce qui est équitable ; mais un service confronté à un afflux soudain peut légitimement vouloir traiter les tickets <em>les plus récents</em> d'abord, dans une situation précise : lorsqu'une panne massive vient de se produire et que les anciens tickets portent sur un problème déjà résolu par le correctif. Traiter en pile permet alors de servir ceux qui n'ont pas encore la réponse plutôt que de répondre à des questions périmées. Les conditions sont donc strictes : un événement qui rend les demandes anciennes obsolètes, et une garantie qu'aucun ticket ne restera indéfiniment au fond — sans quoi l'on retombe sur le problème d'équité du guichet d'hier, en pire, puisqu'une pile sous afflux continu ne ressort jamais son fond." }

    solution: "Algorithme GuichetAvecPriorite\nConst\n    CAPACITE = 20\nVar\n    prio : TABLEAU[1..20] DE CHAINES\n    normale : TABLEAU[1..20] DE CHAINES\n    tetePrio, queuePrio, nbPrio : ENTIER\n    teteNorm, queueNorm, nbNorm : ENTIER\n    choix : ENTIER\n    nom : CHAINE\n    estPrioritaire : BOOLEEN\n    recusPrio, recusNorm, refus : ENTIER\nDebut\n    tetePrio <- 1 : queuePrio <- 1 : nbPrio <- 0\n    teteNorm <- 1 : queueNorm <- 1 : nbNorm <- 0\n    recusPrio <- 0 : recusNorm <- 0 : refus <- 0\n\n    REPETER\n        Ecrire(\"1.Arrivee 2.Appeler le suivant 3.Etat 4.Fermer\")\n        Lire(choix)\n\n        SI choix = 1 ALORS\n            /* la capacite est PARTAGEE : on la teste sur la SOMME.\n               File par file, on laisserait entrer quarante personnes. */\n            SI nbPrio + nbNorm = CAPACITE ALORS\n                Ecrire(\"Local plein : merci de revenir plus tard\")\n                refus <- refus + 1\n            SINON\n                Ecrire(\"Nom de l'usager ?\")\n                Lire(nom)\n                Ecrire(\"Prioritaire (VRAI/FAUX) ?\")\n                Lire(estPrioritaire)\n                SI estPrioritaire ALORS\n                    prio[queuePrio] <- nom\n                    queuePrio <- queuePrio + 1\n                    nbPrio <- nbPrio + 1\n                SINON\n                    normale[queueNorm] <- nom\n                    queueNorm <- queueNorm + 1\n                    nbNorm <- nbNorm + 1\n                FINSI\n                Ecrire(nom, \" en attente\")\n            FINSI\n\n        SINON SI choix = 2 ALORS\n            /* l'ORDRE de ces trois cas EST la regle de priorite */\n            SI nbPrio > 0 ALORS\n                Ecrire(\"Au guichet : \", prio[tetePrio], \" (prioritaire)\")\n                tetePrio <- tetePrio + 1\n                nbPrio <- nbPrio - 1\n                recusPrio <- recusPrio + 1\n            SINON SI nbNorm > 0 ALORS\n                Ecrire(\"Au guichet : \", normale[teteNorm])\n                teteNorm <- teteNorm + 1\n                nbNorm <- nbNorm - 1\n                recusNorm <- recusNorm + 1\n            SINON\n                Ecrire(\"Personne en attente\")\n            FINSI\n\n        SINON SI choix = 3 ALORS\n            Ecrire(nbPrio, \" prioritaire(s), \", nbNorm, \" autre(s)\")\n            SI nbPrio > 0 ALORS\n                Ecrire(\"Prochain appele : \", prio[tetePrio])\n            SINON SI nbNorm > 0 ALORS\n                Ecrire(\"Prochain appele : \", normale[teteNorm])\n            SINON\n                Ecrire(\"Aucun usager en attente\")\n            FINSI\n\n        SINON SI choix <> 4 ALORS\n            Ecrire(\"Choix inconnu\")\n        FINSI\n    JUSQU'A choix = 4\n\n    Ecrire(\"--- Bilan de la matinee ---\")\n    Ecrire(recusPrio, \" prioritaire(s) recu(s), \", recusNorm, \" autre(s)\")\n    Ecrire(refus, \" refus a l'entree\")\n    Ecrire(nbPrio + nbNorm, \" personne(s) encore presente(s) a la fermeture\")\nFin",

      { ref: "Réflexion", texte: "<strong>Le défaut est la famine.</strong> Tant qu'il reste un seul prioritaire dans sa file, aucun usager ordinaire n'est jamais appelé. Le scénario exact qui le déclenche : un flux continu de prioritaires, même faible. Si un nouveau prioritaire arrive en moyenne plus souvent qu'un dossier ne se traite, la file prioritaire ne se vide jamais, et la personne arrivée en premier le matin dans la file ordinaire est encore là à la fermeture — comptée parmi les « personnes encore présentes » de mon bilan, ce qui est la seule trace du problème. C'est exactement le défaut symétrique de celui du jour 28 : là, on faisait attendre les dossiers longs ; ici, on fait attendre les non-prioritaires, et dans les deux cas la règle est <em>localement</em> juste et <em>globalement</em> insoutenable. La correction standard est une <strong>garantie d'ancienneté</strong> : au-delà d'un temps d'attente donné, ou après un nombre fixé de prioritaires servis d'affilée, on appelle obligatoirement dans la file ordinaire. Dans mon algorithme, cela tient en un compteur de prioritaires consécutifs remis à zéro à chaque appel ordinaire, et un test qui force le passage tous les trois ou quatre. Le coût est nul et la propriété gagnée est forte : plus personne ne peut être ignoré indéfiniment. <strong>Deux files valent mieux qu'une file à insertion</strong> pour une raison de coût, et le vocabulaire d'hier la formule exactement. Insérer un prioritaire devant tous les non-prioritaires d'une file unique oblige à décaler tout le monde d'un cran : le coût d'une arrivée devient <strong>linéaire</strong> — jusqu'à vingt déplacements ici, jusqu'à des milliers sur une file d'attente téléphonique. Avec deux files, une arrivée coûte deux ou trois opérations, quelle que soit la longueur des files : le coût est <strong>constant</strong>. C'est la différence entre une classe et une autre, pas un facteur — donc exactement le genre d'écart dont le jour 28 a montré qu'aucune machine plus rapide ne le rattrape. Et le bénéfice ne s'arrête pas là : deux files séparées rendent la règle de priorité <em>lisible</em>, puisqu'elle tient dans l'ordre de trois tests, alors qu'une file unique la cache dans la mécanique d'insertion." }
