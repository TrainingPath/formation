<script>
var DAY = {
  num: 12,
  title: "Compteurs et accumulateurs",
  subtitle: "Les deux motifs universels qui reviennent dans 90 % des boucles.",
  theory: `
<h3>1. Des motifs, pas des recettes uniques</h3>
<p>En observant les boucles écrites depuis 3 jours, deux <strong>motifs</strong> (patterns) reviennent sans cesse : le <strong>compteur</strong> et l'<strong>accumulateur</strong>. Les reconnaître instantanément, c'est ça, l'automatisme.</p>
<h3>2. Le compteur : compter des événements</h3>
<pre class="pseudo">compteur ← 0                    // 1. initialiser à 0 AVANT la boucle
POUR/TANT QUE ... FAIRE
    SI condition ALORS
        compteur ← compteur + 1 // 2. +1 quand l'événement se produit
    FINSI
FIN...
Écrire(compteur)                // 3. exploiter APRÈS la boucle</pre>
<pre class="pseudo">// Compter les notes >= 10 parmi 20 notes saisies
nbReussites ← 0
POUR i DE 1 A 20 FAIRE
    Lire(note)
    SI note >= 10 ALORS
        nbReussites ← nbReussites + 1
    FINSI
FINPOUR</pre>
<h3>3. L'accumulateur : additionner des valeurs</h3>
<pre class="pseudo">somme ← 0                       // init à 0 pour une SOMME
POUR ... FAIRE
    somme ← somme + valeur      // on ajoute la valeur (pas 1 !)
FIN...</pre>
<pre class="pseudo">produit ← 1                     // init à 1 pour un PRODUIT !
POUR i DE 1 A n FAIRE
    produit ← produit * i       // n! (factorielle)
FINPOUR</pre>
<div class="warn">Initialisation : <strong>0</strong> pour une somme (0 + x = x), <strong>1</strong> pour un produit (1 × x = x). Un produit initialisé à 0 restera 0 pour toujours !</div>
<h3>4. Compteur vs accumulateur : la différence</h3>
<ul>
<li>Compteur : <code>c ← c + 1</code> → répond à « <strong>combien de fois ?</strong> »</li>
<li>Accumulateur : <code>s ← s + valeur</code> → répond à « <strong>quel total ?</strong> »</li>
</ul>
<h3>5. Les combiner : la moyenne</h3>
<pre class="pseudo">somme ← 0
nb ← 0
TANT QUE il reste des notes FAIRE
    Lire(note)
    somme ← somme + note      // accumulateur
    nb ← nb + 1               // compteur
FINTANTQUE
moyenne ← somme / nb</pre>
<div class="tip">Réflexe à graver : « combien ? » → compteur à 0 · « total ? » → somme à 0 · « produit ? » → init à 1 · « moyenne ? » → somme ET compteur.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence entre <code>c ← c + 1</code> et <code>s ← s + note</code> ?", opts: ["Aucune", "Le premier compte des événements (+1), le second accumule des valeurs", "Le second est plus rapide", "Le premier est une erreur"], a: 1, exp: "Compteur = combien de fois ; accumulateur = quel total." },
    { type: "qcm", q: "À quelle valeur initialise-t-on un accumulateur de SOMME ?", opts: ["1", "0", "La première valeur", "N'importe"], a: 1, exp: "0 est neutre pour l'addition." },
    { type: "qcm", q: "À quelle valeur initialise-t-on un accumulateur de PRODUIT ?", opts: ["0", "1", "2", "10"], a: 1, exp: "1 est neutre pour la multiplication ; 0 tuerait le produit." },
    { type: "qcm", q: "Que calcule : <code>p ← 0 ; POUR i DE 1 A 5 FAIRE p ← p * i FINPOUR</code> ?", opts: ["120 (5!)", "0 : le produit initialisé à 0 reste 0", "15", "5"], a: 1, exp: "0 × 1 = 0, 0 × 2 = 0… l'erreur d'initialisation classique." },
    { type: "input", q: "Notes saisies : 12, 8, 15, 9, 10. Que vaut le compteur des notes >= 10 ?", a: "3", ph: "nombre", exp: "12, 15 et 10 passent le seuil : compteur = 3." },
    { type: "input", q: "Mêmes notes (12, 8, 15, 9, 10) : que vaut l'accumulateur somme ?", a: "54", ph: "nombre", exp: "12+8+15+9+10 = 54." },
    { type: "input", q: "Et la moyenne (somme / nb) ?", a: ["10.8", "10,8"], ph: "nombre", exp: "54 / 5 = 10.8 : accumulateur ET compteur travaillent ensemble." },
    { type: "qcm", q: "Où initialise-t-on compteurs et accumulateurs ?", opts: ["Dans le corps de la boucle", "AVANT la boucle", "Après la boucle", "Dans le FINSI"], a: 1, exp: "Dans la boucle, ils seraient remis à zéro à chaque tour !" },
    { type: "qcm", q: "Que calcule ce code ? <code>c ← 0 ; POUR i DE 1 A 100 FAIRE SI i MOD 7 = 0 ALORS c ← c + 1 FINSI FINPOUR</code>", opts: ["La somme des multiples de 7", "Le nombre de multiples de 7 entre 1 et 100", "7 × 100", "Le reste de 100 ÷ 7"], a: 1, exp: "c ← c + 1 : on COMPTE (réponse : 14, mais l'important est le motif)." },
    { type: "input", q: "<code>s ← 0 ; POUR i DE 1 A 4 FAIRE s ← s + i * i FINPOUR</code> : que vaut s ?", a: "30", ph: "nombre", exp: "1 + 4 + 9 + 16 = 30 : somme des carrés." },
    { type: "input", q: "<code>f ← 1 ; POUR i DE 1 A 4 FAIRE f ← f * i FINPOUR</code> : que vaut f (c'est 4!) ?", a: "24", ph: "nombre", exp: "1×1×2×3×4 = 24. La factorielle reviendra au jour 26 (récursivité) !" },
    { type: "qcm", q: "Un magasin veut son chiffre d'affaires du jour ET son nombre de clients. Il lui faut…", opts: ["Deux compteurs", "Deux accumulateurs", "Un accumulateur (CA) et un compteur (clients)", "Une seule variable"], a: 2, exp: "Total d'argent = accumulateur ; nombre de passages = compteur." },
    { type: "qcm", q: "Bug : <code>POUR i DE 1 A 10 FAIRE s ← 0 ; s ← s + i FINPOUR</code>. Que vaut s à la fin ?", opts: ["55", "10 : s est remis à 0 à chaque tour, il ne garde que le dernier i", "0", "1"], a: 1, exp: "L'initialisation DANS la boucle détruit l'accumulation : s vaut juste 0 + 10." },
    { type: "input", q: "Pluies de la semaine : 5, 0, 12, 0, 3, 0, 8 (mm). Que vaut le compteur des jours SANS pluie (valeur = 0) ?", a: "3", ph: "nombre", exp: "Trois zéros : on peut compter n'importe quel événement, pas seulement des réussites." },
    { type: "vf", q: "Un même algorithme peut contenir plusieurs compteurs différents (ex : compter les pairs ET les impairs).", a: true, exp: "Chaque question « combien ? » a son propre compteur, chacun initialisé à 0." }
  ],
  final: {
    title: "Exercice final — Les statistiques de la classe",
    intro: `<p>Le professeur saisit les notes de ses <strong>6 élèves</strong> : <strong>14, 7, 11, 18, 9, 13</strong>. L'algorithme calcule la moyenne de la classe, le nombre d'élèves en réussite (note >= 10) et le taux de réussite.</p>
<pre class="pseudo">ALGORITHME StatsClasse
DEBUT
    somme ← 0
    nbReussite ← 0
    POUR i DE 1 A 6 FAIRE
        Lire(note)
        somme ← somme + note
        SI note >= 10 ALORS
            nbReussite ← nbReussite + 1
        FINSI
    FINPOUR
    moyenne ← somme / 6
    taux ← nbReussite * 100 / 6
    Écrire(moyenne, nbReussite, taux)
FIN</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>somme</code> à la fin de la boucle ?", a: "72", ph: "nombre", exp: "14+7+11+18+9+13 = 72." },
      { type: "input", q: "Que vaut <code>moyenne</code> ?", a: "12", ph: "nombre", exp: "72 / 6 = 12." },
      { type: "input", q: "Que vaut <code>nbReussite</code> ?", a: "4", ph: "nombre", exp: "14, 11, 18, 13 sont >= 10 : quatre réussites." },
      { type: "qcm", q: "Dans cet algorithme, <code>somme</code> et <code>nbReussite</code> sont respectivement…", opts: ["Deux compteurs", "Un accumulateur et un compteur", "Un compteur et un accumulateur", "Deux accumulateurs"], a: 1, exp: "somme additionne des VALEURS ; nbReussite ajoute 1 par ÉVÉNEMENT." },
      { type: "input", q: "Que vaut <code>taux</code> (en %) ? Arrondi à l'entier inférieur.", a: ["66", "66.67", "66,67"], ph: "nombre", exp: "4 × 100 / 6 ≈ 66,67 % → 66. Deux tiers de la classe réussit." }
    ],
    solution: `<p>Trace complète :</p>
<pre class="pseudo">note   somme   nbReussite
14     14      1
7      21      1
11     32      2
18     50      3
9      59      3
13     72      4
→ moyenne = 72/6 = 12 ; taux = 400/6 ≈ 66,67 %</pre>
<p>Motifs utilisés : POUR (nombre connu), accumulateur (somme), compteur conditionnel (nbReussite), exploitation APRÈS la boucle. Tu viens d'écrire un vrai programme de gestion de classe.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton pseudocode ici…",
  items: [
  { id: "algo-sommemoyenne", title: "Somme et moyenne", level: 2,
    statement: "Lis d'abord un entier <code>N</code>, puis lis <code>N</code> nombres réels. Affiche à la fin leur <strong>somme</strong> et leur <strong>moyenne</strong>.",
    hints: [
      "Le nombre de tours est connu à l'avance (N) : c'est une boucle POUR.",
      "Utilise un accumulateur : somme ← 0 avant la boucle, puis somme ← somme + x à chaque tour.",
      "La moyenne se calcule APRÈS la boucle : somme / N."
    ],
    solution: "ALGORITHME SommeMoyenne              // nom de l'algorithme\nVARIABLES n, i : ENTIER              // n = nombre de valeurs, i = compteur de boucle\n          x, somme, moyenne : REEL   // x = valeur lue, somme et moyenne = résultats\nDEBUT                                // début des instructions\n    Écrire(\"Combien de nombres ?\")   // demande combien de valeurs vont suivre\n    Lire(n)                          // range ce nombre dans n\n    somme ← 0                        // IMPORTANT : l'accumulateur démarre à zéro\n    POUR i DE 1 A n FAIRE            // répète exactement n fois\n        Écrire(\"Nombre \", i, \" ?\")   // affiche le numéro de la saisie en cours\n        Lire(x)                      // lit la valeur du tour\n        somme ← somme + x            // ajoute la valeur au total (accumulation)\n    FINPOUR                          // fin du bloc répété\n    moyenne ← somme / n              // la moyenne se calcule APRÈS la boucle\n    Écrire(\"Somme : \", somme)        // affiche le total\n    Écrire(\"Moyenne : \", moyenne)    // affiche la moyenne\nFIN                                  // fin de l'algorithme",
    note: "Le duo accumulateur + boucle POUR est LE motif de cette leçon." }
  ]
};
</script>
