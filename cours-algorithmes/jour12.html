<script>

  num: 12,
  title: "Compteurs et accumulateurs",
  subtitle: "Les deux motifs universels qui reviennent dans 90 % des boucles.",
  theory: `
<h3>1. Des motifs, pas des recettes uniques</h3>
<p>En observant les boucles écrites depuis 3 jours, deux <strong>motifs</strong> (patterns) reviennent sans cesse : le <strong>compteur</strong> et l'<strong>accumulateur</strong>. Les reconnaître instantanément, c'est ça, l'automatisme.</p>
<h3>2. Le compteur : compter des événements</h3>
<pre class="pseudo">compteur ← 0                    // 1. initialiser à 0 AVANT la boucle
POUR/TANT QUE ... FAIRE
    SI condition ALORS
        compteur ← compteur + 1 // 2. +1 quand l'événement se produit
    FINSI
FIN...
Écrire(compteur)                // 3. exploiter APRÈS la boucle</pre>
<pre class="pseudo">// Compter les notes >= 10 parmi 20 notes saisies
nbReussites ← 0
POUR i DE 1 A 20 FAIRE
    Lire(note)
    SI note >= 10 ALORS
        nbReussites ← nbReussites + 1
    FINSI
FINPOUR</pre>
<h3>3. L'accumulateur : additionner des valeurs</h3>
<pre class="pseudo">somme ← 0                       // init à 0 pour une SOMME
POUR ... FAIRE
    somme ← somme + valeur      // on ajoute la valeur (pas 1 !)
FIN...</pre>
<pre class="pseudo">produit ← 1                     // init à 1 pour un PRODUIT !
POUR i DE 1 A n FAIRE
    produit ← produit * i       // n! (factorielle)
FINPOUR</pre>
<div class="warn">Initialisation : <strong>0</strong> pour une somme (0 + x = x), <strong>1</strong> pour un produit (1 × x = x). Un produit initialisé à 0 restera 0 pour toujours !</div>
<h3>4. Compteur vs accumulateur : la différence</h3>
<ul>
<li>Compteur : <code>c ← c + 1</code> → répond à « <strong>combien de fois ?</strong> »</li>
<li>Accumulateur : <code>s ← s + valeur</code> → répond à « <strong>quel total ?</strong> »</li>
</ul>
<h3>5. Les combiner : la moyenne</h3>
<pre class="pseudo">somme ← 0
nb ← 0
TANT QUE il reste des notes FAIRE
    Lire(note)
    somme ← somme + note      // accumulateur
    nb ← nb + 1               // compteur
FINTANTQUE
moyenne ← somme / nb</pre>
<div class="tip">Réflexe à graver : « combien ? » → compteur à 0 · « total ? » → somme à 0 · « produit ? » → init à 1 · « moyenne ? » → somme ET compteur.</div>`,

<pre class="pseudo">ALGORITHME StatsClasse
DEBUT
    somme ← 0
    nbReussite ← 0
    POUR i DE 1 A 6 FAIRE
        Lire(note)
        somme ← somme + note
        SI note >= 10 ALORS
            nbReussite ← nbReussite + 1
        FINSI
    FINPOUR

    taux ← nbReussite * 100 / 6
    Écrire(moyenne, nbReussite, taux)
FIN</pre>`,

      { type: "input", q: "Que vaut <code>moyenne</code> ?", a: "12", ph: "nombre", exp: "72 / 6 = 12." },
      { type: "input", q: "Que vaut <code>nbReussite</code> ?", a: "4", ph: "nombre", exp: "14, 11, 18, 13 sont >= 10 : quatre réussites." },
      { type: "qcm", q: "Dans cet algorithme, <code>somme</code> et <code>nbReussite</code> sont respectivement…", opts: ["Deux compteurs", "Un accumulateur et un compteur", "Un compteur et un accumulateur", "Deux accumulateurs"], a: 1, exp: "somme additionne des VALEURS ; nbReussite ajoute 1 par ÉVÉNEMENT." },
      { type: "input", q: "Que vaut <code>taux</code> (en %) ? Arrondi à l'entier inférieur.", a: ["66", "66.67", "66,67"], ph: "nombre", exp: "4 × 100 / 6 ≈ 66,67 % → 66. Deux tiers de la classe réussit." }
    ],
    solution: `<p>Trace complète :</p>
<pre class="pseudo">note   somme   nbReussite
14     14      1
7      21      1
11     32      2
18     50      3
9      59      3
13     72      4
→ moyenne = 72/6 = 12 ; taux = 400/6 ≈ 66,67 %</pre>
<p>Motifs utilisés : POUR (nombre connu), accumulateur (somme), compteur conditionnel (nbReussite), exploitation APRÈS la boucle. Tu viens d'écrire un vrai programme de gestion de classe.</p>`
  }
};
</script>

    solution: "Algorithme ControleBrasserie\nVar\n    nb, b, forts : ENTIER\n    volume, volumeTotal : REEL\n    degre, degreTotal, moyenne : REEL\n    h, arrangements : ENTIER\nDebut\n    Ecrire(\"Nombre de brassins de la semaine ?\")\n    Lire(nb)\n\n    volumeTotal <- 0          /* accumulateur : \"quel total ?\" */\n    degreTotal <- 0           /* accumulateur, pour la moyenne */\n    forts <- 0                /* compteur : \"combien de fois ?\" */\n\n    POUR b DE 1 A nb FAIRE\n        Ecrire(\"Volume du brassin \", b, \" (L) ?\")\n        Lire(volume)\n        Ecrire(\"Degre d'alcool ?\")\n        Lire(degre)\n\n        volumeTotal <- volumeTotal + volume    /* on ajoute la VALEUR */\n        degreTotal <- degreTotal + degre\n        SI degre > 6 ALORS\n            forts <- forts + 1                 /* on ajoute UN */\n        FINSI\n    FINPOUR\n\n    /* la moyenne n'est pas un motif : c'est un accumulateur DIVISE par un\n       compteur, et la division n'a lieu qu'APRES la boucle */\n    moyenne <- degreTotal / nb\n\n    Ecrire(forts, \" brassin(s) au-dessus de 6 degres\")\n    Ecrire(\"Volume total : \", volumeTotal, \" L\")\n    Ecrire(\"Degre moyen : \", Arrondi(moyenne, 2))\n\n    /* accumulateur MULTIPLICATIF : il part de 1, jamais de 0.\n       Parti de 0, il vaudrait 0 quoi qu'on lui multiplie ensuite. */\n    arrangements <- 1\n    POUR h DE 1 A 5 FAIRE\n        arrangements <- arrangements * h\n    FINPOUR\n    Ecrire(\"Classements possibles des 5 houblons : \", arrangements)\nFin",

    solution: "Algorithme ComptesPharmacie\nVar\n    o, t, nbRembourses : ENTIER\n    montant, total, totalRembourse, moyenne : REEL\n    rembourse : BOOLEEN\n    taux, coefficient, remiseReelle : REEL\nDebut\n    /* a) un compteur et DEUX accumulateurs, tous a zero */\n    nbRembourses <- 0\n    total <- 0\n    totalRembourse <- 0\n\n    POUR o DE 1 A 7 FAIRE\n        Ecrire(\"Montant de l'ordonnance \", o, \" ?\")\n        Lire(montant)\n        Ecrire(\"Remboursee (VRAI/FAUX) ?\")\n        Lire(rembourse)\n\n        /* encaisse a CHAQUE tour : la question ne comporte pas de condition */\n        total <- total + montant\n\n        /* rembourse SOUS CONDITION : la question en comporte une */\n        SI rembourse ALORS\n            nbRembourses <- nbRembourses + 1\n            totalRembourse <- totalRembourse + montant\n        FINSI\n    FINPOUR\n\n    moyenne <- total / 7\n\n    Ecrire(nbRembourses, \" ordonnance(s) remboursee(s) sur 7\")\n    Ecrire(\"Total encaisse : \", total, \" EUR\")\n    Ecrire(\"Total rembourse : \", totalRembourse, \" EUR\")\n    Ecrire(\"Montant moyen : \", Arrondi(moyenne, 2), \" EUR\")\n\n    /* c) accumulateur MULTIPLICATIF : sa valeur neutre est 1.\n          On multiplie par ce que le client PAIE ENCORE (0,90 pour 10 %),\n          jamais par la remise elle-meme. */\n    coefficient <- 1\n    POUR t DE 1 A 3 FAIRE\n        Ecrire(\"Taux de la remise \", t, \" (en %) ?\")\n        Lire(taux)\n        coefficient <- coefficient * (1 - taux / 100)\n    FINPOUR\n\n    remiseReelle <- (1 - coefficient) * 100\n\n    /* d) l'annonce du representant confrontee au calcul */\n    Ecrire(\"Remise annoncee : 35 %\")\n    Ecrire(\"Remise reelle : \", Arrondi(remiseReelle, 1), \" %\")\n    Ecrire(\"Sur 100 EUR : annonce 65,00 — reel \", Arrondi(coefficient * 100, 2))\nFin",

    solution: "Algorithme CarnetDuPhare\nConst\n    SEUIL_HOULE = 3           /* metres : au-dela, mauvaise mer */\n    SEUIL_VISIB = 2           /* kilometres : en deca, mauvaise mer */\nVar\n    j, mauvaises, corne, corneTotale, recordJour : ENTIER\n    houle, visibilite, houleTotale, houleMoyenne, recordHoule : REEL\nDebut\n    mauvaises <- 0            /* compteur */\n    corneTotale <- 0          /* accumulateur */\n    houleTotale <- 0          /* accumulateur */\n\n    /* le couple du maximum. -1 est une valeur IMPOSSIBLE pour une houle :\n       elle garantit que le premier jour deviendra record. Voir la reflexion\n       pour une initialisation qui ne suppose rien sur les donnees. */\n    recordHoule <- -1\n    recordJour <- 0\n\n    POUR j DE 1 A 7 FAIRE\n        Ecrire(\"Jour \", j, \" — houle (m) ?\")\n        Lire(houle)\n        Ecrire(\"Visibilite (km) ?\")\n        Lire(visibilite)\n        Ecrire(\"Heures de corne de brume ?\")\n        Lire(corne)\n\n        houleTotale <- houleTotale + houle\n        corneTotale <- corneTotale + corne\n\n        SI houle >= SEUIL_HOULE OU visibilite < SEUIL_VISIB ALORS\n            mauvaises <- mauvaises + 1\n            Ecrire(\"  Jour \", j, \" : mauvaise mer\")\n        FINSI\n\n        /* les DEUX moities du record changent ensemble, dans le meme bloc :\n           noter la hauteur sans noter le jour rendrait le jour introuvable,\n           puisque rien n'est conserve */\n        SI houle > recordHoule ALORS\n            recordHoule <- houle\n            recordJour <- j\n        FINSI\n    FINPOUR\n\n    houleMoyenne <- houleTotale / 7\n\n    /* c) une semaine calme merite mieux qu'un zero sec */\n    SI mauvaises = 0 ALORS\n        Ecrire(\"Semaine entierement praticable\")\n    SINON\n        Ecrire(mauvaises, \" journee(s) de mauvaise mer\")\n    FINSI\n    Ecrire(\"Corne de brume : \", corneTotale, \" heures\")\n    Ecrire(\"Houle moyenne : \", Arrondi(houleMoyenne, 2), \" m\")\n    Ecrire(\"Houle maximale : \", recordHoule, \" m le jour \", recordJour)\nFin",

      { ref: "Réflexion", texte: "<strong>Le troisième motif.</strong> Un compteur et un accumulateur mettent à jour leur variable <em>à chaque fois</em> — inconditionnellement, ou sous une condition qui porte sur la donnée. La recherche d'extremum, elle, met à jour sous une condition qui porte sur <em>la variable elle-même</em> : on compare la valeur du jour à ce qu'on a déjà retenu. C'est ce retour sur soi qui la distingue, et qui explique ses deux difficultés propres — la valeur de départ, et le cas d'égalité — qu'aucun des deux autres motifs ne connaît. <strong>L'initialisation.</strong> J'ai pris −1, qui n'est pas une hauteur de houle possible : le premier jour la dépassera forcément et deviendra record. Sur des températures hivernales, cette astuce s'effondre : −1 degré est parfaitement plausible, et une semaine à −8, −12, −5 laisserait le record à −1, une valeur qu'aucun jour n'a connue, associée au jour 0 qui n'existe pas. L'initialisation « impossible » repose toujours sur une hypothèse concernant les données, et cette hypothèse finit par être fausse. L'initialisation qui ne suppose rien consiste à prendre <strong>la première valeur</strong> comme record de départ : on lit le premier jour hors de la boucle, on pose <code>recordHoule ← houle</code> et <code>recordJour ← 1</code>, puis on parcourt les jours 2 à 7. Le record est alors toujours une valeur réellement observée, quelle que soit l'échelle. Le seul cas qu'elle ne traite pas est celui d'une série vide — et là, il n'y a effectivement pas de maximum à annoncer, ce qui est une réponse honnête plutôt qu'un défaut. <strong>L'égalité.</strong> Ma comparaison est stricte : un jour dont la houle égale le record ne le remplace pas, donc c'est le <em>premier</em> des ex æquo qui est désigné. C'est une conséquence, pas un choix — mais elle est devenue un choix au moment où je l'ai constatée, et j'en assume la préférence : à égalité, le premier événement est plus informatif que le dernier, puisqu'il date le début de l'épisode. Écrire une comparaison large désignerait le dernier, et le faire sans y penser est la vraie faute : la plupart des algorithmes de tri et de recherche dépendent de ce détail, et deux d'entre eux qui ne le trancheraient pas de la même façon donneraient des résultats différents sur les mêmes données." }
