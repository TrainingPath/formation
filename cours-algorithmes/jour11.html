<script>
var DAY = {
  num: 11,
  title: "Choisir sa boucle · RÉPÉTER … JUSQU'À",
  subtitle: "La troisième boucle, et l'art de choisir la bonne.",
  theory: `
<h3>1. RÉPÉTER … JUSQU'À : tester APRÈS</h3>
<p>Voici la troisième et dernière boucle. Contrairement au TANT QUE (qui teste sa condition avant chaque tour), ici le corps s'exécute d'abord et la condition est testée <strong>après</strong> chaque tour. On répète <strong>jusqu'à ce que</strong> la condition devienne vraie :</p>
<pre class="pseudo">RÉPÉTER                             // on entre directement dans le corps (sans test préalable)
    instructions                    // le corps : exécuté au moins une fois
JUSQU'À condition      // on SORT quand c'est VRAI   // condition testée en fin de tour</pre>
<div class="tip">Différence clé avec TANT QUE :
<br>• TANT QUE : test AVANT → le corps peut tourner <strong>0 fois</strong> ; on continue tant que c'est VRAI.
<br>• RÉPÉTER : test APRÈS → le corps tourne <strong>au moins 1 fois</strong> ; on s'arrête quand c'est VRAI.</div>
<h3>2. Exemple parfait : le menu</h3>
<p>Un menu doit s'afficher au moins une fois — RÉPÉTER est fait pour ça :</p>
<pre class="pseudo">RÉPÉTER                             // on affiche le menu au moins une fois
    Écrire("1. Jouer  2. Scores  3. Quitter")   // affiche les options
    Lire(choix)                     // lit le choix de l'utilisateur
JUSQU'À choix = 3                   // on recommence tant que choix ≠ 3 ; on sort quand choix = 3</pre>
<h3>3. Conditions inversées</h3>
<p>Attention : TANT QUE garde la condition de <strong>continuation</strong> (quand continuer), RÉPÉTER…JUSQU'À la condition d'<strong>arrêt</strong> (quand s'arrêter). Ce sont des contraires !</p>
<pre class="pseudo">TANT QUE reponse ≠ "oui" FAIRE ...        // on continue si différent   // condition de CONTINUATION
RÉPÉTER ... JUSQU'À reponse = "oui"       // on s'arrête si égal   // condition d'ARRÊT (l'inverse)</pre>
<h3>4. Le guide de choix complet</h3>
<pre class="pseudo">Nombre de tours connu d'avance ?           // 1re question à se poser
    OUI → POUR                             // compteur géré automatiquement
    NON → Le corps doit-il s'exécuter au moins une fois ?   // 2e question
        OUI → RÉPÉTER … JUSQU'À            // test APRÈS : garanti 1 tour minimum
        NON → TANT QUE                     // test AVANT : 0 tour possible</pre>
<h3>5. Exemple comparé : validation de saisie</h3>
<pre class="pseudo">// Version TANT QUE (2 Lire nécessaires)     // un Lire avant, un Lire dans la boucle
Lire(note)                                  // première saisie (obligatoire avant le test)
TANT QUE note < 0 OU note > 20 FAIRE        // tant que la note est invalide…
    Lire(note)                              // … on relit
FINTANTQUE                                  // fin de la boucle

// Version RÉPÉTER (1 seul Lire : plus élégant)   // pas besoin de Lire préalable
RÉPÉTER                                     // on entre au moins une fois
    Lire(note)                              // seule saisie, dans le corps
JUSQU'À note >= 0 ET note <= 20             // on sort quand la note est valide</pre>
<p>Remarque : les deux conditions sont l'inverse l'une de l'autre (lois de Morgan, jour 8 !).</p>`,
  exercises: [
    { type: "qcm", q: "Quelle est la grande différence entre TANT QUE et RÉPÉTER…JUSQU'À ?", opts: ["Aucune", "RÉPÉTER teste après le corps : au moins 1 exécution garantie", "TANT QUE est plus rapide", "RÉPÉTER ne peut pas boucler plus de 10 fois"], a: 1, exp: "Test avant (TANT QUE, 0 tour possible) vs test après (RÉPÉTER, 1 tour minimum)." },
    { type: "qcm", q: "Avec RÉPÉTER … JUSQU'À condition, on sort de la boucle quand la condition est…", opts: ["FAUSSE", "VRAIE"], a: 1, exp: "JUSQU'À = on s'arrête dès que c'est vrai. (TANT QUE, c'est l'inverse !)" },
    { type: "input", q: "<code>i ← 10 ; RÉPÉTER Écrire(i) ; i ← i + 1 JUSQU'À i > 10</code> : combien d'affichages ?", a: "1", ph: "nombre", exp: "Le corps tourne une fois (affiche 10), puis 11 > 10 : sortie. Un TANT QUE i <= 10 identique aurait aussi affiché 10, mais un TANT QUE i < 10 aurait affiché 0 fois." },
    { type: "qcm", q: "Quelle boucle garantit qu'un menu s'affiche au moins une fois ?", opts: ["POUR", "TANT QUE", "RÉPÉTER … JUSQU'À", "SI"], a: 2, exp: "Corps exécuté avant tout test : parfait pour les menus." },
    { type: "qcm", q: "« TANT QUE reponse ≠ \"oui\" » équivaut à « RÉPÉTER … JUSQU'À … » quelle condition ?", opts: ["reponse ≠ \"oui\"", "reponse = \"oui\"", "NON reponse", "reponse = \"non\""], a: 1, exp: "Continuation et arrêt sont des contraires." },
    { type: "qcm", q: "Afficher 100 fois « Bravo » : quelle boucle ?", opts: ["POUR i DE 1 A 100", "TANT QUE bravo < 100", "RÉPÉTER", "100 lignes Écrire"], a: 0, exp: "Nombre connu d'avance → POUR, sans hésiter." },
    { type: "qcm", q: "Relancer un dé JUSQU'À obtenir un 6 : quelle boucle ?", opts: ["POUR i DE 1 A 6", "RÉPÉTER … JUSQU'À de = 6", "TANT QUE de = 6", "SI de = 6"], a: 1, exp: "On doit lancer au moins une fois, et le nombre d'essais est imprévisible." },
    { type: "qcm", q: "Pourquoi <code>TANT QUE de = 6</code> est-il faux pour ce problème ?", opts: ["Il est correct", "Il boucle tant qu'on A un 6 : c'est l'inverse ; et si le 1ᵉʳ lancer n'est pas fait, de n'existe pas", "TANT QUE ne marche pas avec les dés", "Il manque FINPOUR"], a: 1, exp: "Confusion continuation/arrêt : le piège n°1 de ce chapitre." },
    { type: "input", q: "<code>n ← 0 ; RÉPÉTER n ← n + 3 JUSQU'À n >= 10</code> : que vaut <code>n</code> à la sortie ?", a: "12", ph: "nombre", exp: "3, 6, 9 (toujours < 10, on continue), 12 (>= 10, on sort)." },
    { type: "qcm", q: "Traiter chaque ligne d'un fichier dont on ignore la taille, fichier possiblement VIDE : quelle boucle ?", opts: ["RÉPÉTER, toujours", "TANT QUE (il ne faut pas exécuter le corps si le fichier est vide)", "POUR i DE 1 A 1000", "Aucune"], a: 1, exp: "0 exécution doit être possible → test AVANT → TANT QUE." },
    { type: "vf", q: "Toute boucle RÉPÉTER…JUSQU'À peut se réécrire en TANT QUE (quitte à dupliquer une instruction).", a: true, exp: "Les trois boucles sont interchangeables ; on choisit la plus LISIBLE pour le problème." },
    { type: "qcm", q: "Le guide de choix : nombre de tours inconnu + au moins une exécution requise → ?", opts: ["POUR", "TANT QUE", "RÉPÉTER … JUSQU'À", "SI…SINON"], a: 2, exp: "C'est la case exacte du RÉPÉTER dans l'arbre de décision." },
    { type: "qcm", q: "Dans la version RÉPÉTER de la validation de note, la condition de sortie est <code>note >= 0 ET note <= 20</code>. C'est…", opts: ["La même condition que le TANT QUE", "L'inverse exact de la condition du TANT QUE (Morgan)", "Une erreur", "Une condition au hasard"], a: 1, exp: "NON (note < 0 OU note > 20) = note >= 0 ET note <= 20." },
    { type: "input", q: "<code>s ← 0 ; i ← 0 ; RÉPÉTER i ← i + 1 ; s ← s + i JUSQU'À i = 4</code> : que vaut <code>s</code> ?", a: "10", ph: "nombre", exp: "1 + 2 + 3 + 4 = 10." },
    { type: "qcm", q: "Un distributeur demande le code PIN (4 chiffres, au moins un essai, on redemande si faux). Meilleure boucle ?", opts: ["POUR i DE 1 A 4", "RÉPÉTER Lire(pin) JUSQU'À pin = codeCorrect", "TANT QUE pin = codeCorrect", "SI pin ≠ codeCorrect"], a: 1, exp: "Au moins un essai + arrêt sur succès = RÉPÉTER…JUSQU'À. (Dans la vraie vie on limiterait à 3 essais — exercice bonus !)" }
  ],
  final: {
    title: "Exercice final — Le jeu du nombre mystère",
    intro: `<p>L'ordinateur a choisi le nombre <strong>42</strong>. Le joueur propose des nombres ; l'algorithme répond « plus grand », « plus petit » ou « gagné », et compte les essais.</p>
<pre class="pseudo">ALGORITHME NombreMystere            // nom de l'algorithme
DEBUT                               // début des étapes
    mystere ← 42                    // le nombre secret à deviner
    essais ← 0                      // compteur de tentatives (initialisé à 0)
    RÉPÉTER                         // on entre au moins une fois (il faut proposer)
        Écrire("Propose un nombre") // invite
        Lire(prop)                  // lit la proposition du joueur
        essais ← essais + 1         // une tentative de plus
        SI prop < mystere ALORS     // proposition trop basse ?
            Écrire("Plus grand !")  // indice : viser plus haut
        SINON SI prop > mystere ALORS   // proposition trop haute ?
            Écrire("Plus petit !")  // indice : viser plus bas
        FINSI                       // si égal : pas de message, on va sortir
    JUSQU'À prop = mystere          // condition d'ARRÊT : on sort quand trouvé
    Écrire("Gagné en ", essais, " essais")   // bilan final
FIN                                 // fin de l'algorithme</pre>
<p>Le joueur propose successivement : <strong>50, 30, 42</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Que répond l'algorithme à la proposition 50 ?", opts: ["Plus grand !", "Plus petit !", "Gagné", "Rien"], a: 1, exp: "50 > 42 → « Plus petit ! » (il faut proposer plus petit)." },
      { type: "qcm", q: "Et à la proposition 30 ?", opts: ["Plus grand !", "Plus petit !", "Gagné", "Erreur"], a: 0, exp: "30 < 42 → « Plus grand ! »." },
      { type: "input", q: "Qu'affiche la dernière ligne ? « Gagné en … essais »", a: "3", ph: "nombre", exp: "Trois propositions : 50, 30, 42." },
      { type: "qcm", q: "Pourquoi RÉPÉTER plutôt que TANT QUE ici ?", opts: ["Par hasard", "Le joueur doit proposer au moins une fois, et prop n'existe pas avant le premier Lire", "RÉPÉTER est plus rapide", "TANT QUE est interdit avec Lire"], a: 1, exp: "Tester prop = mystere AVANT toute saisie serait impossible : prop serait vide." },
      { type: "qcm", q: "Que combine cet algorithme ?", opts: ["Boucle + condition en cascade + compteur", "Seulement des boucles", "Seulement des conditions", "Des tableaux"], a: 0, exp: "RÉPÉTER (jour 11) + SINON SI (jour 7) + compteur essais (jours 2 et 9) : tout s'assemble !" }
    ],
    solution: `<p>Trace du jeu :</p>
<pre class="pseudo">Tour   prop   essais   réponse
1      50     1        Plus petit !
2      30     2        Plus grand !
3      42     3        (sortie : prop = mystere)
→ "Gagné en 3 essais"</pre>
<p>Remarque stratégique : répondre « plus grand / plus petit » et couper l'intervalle en deux à chaque essai… c'est déjà l'idée de la recherche dichotomique (jour 23) !</p>`
  }
};
</script>

    hints: [
      "On répète au moins une fois et on s'arrête quand c'est trouvé : RÉPÉTER … JUSQU'À est la boucle idéale.",

  ]
};
