<script>
var DAY = {
  num: 9,
  title: "La boucle TANT QUE",
  subtitle: "Répéter des instructions tant qu'une condition reste vraie.",
  theory: `
<h3>1. Pourquoi des boucles ?</h3>
<p>Afficher les nombres de 1 à 1000 avec ce qu'on connaît demanderait 1000 lignes d'Écrire. Une <strong>boucle</strong> est une structure qui <strong>répète</strong> automatiquement un bloc d'instructions plusieurs fois, sans qu'on ait à le recopier. On dit qu'on « itère », et chaque répétition s'appelle un <strong>tour</strong> (ou une itération).</p>
<h3>2. La boucle TANT QUE</h3>
<p>La boucle <strong>TANT QUE</strong> répète son bloc aussi longtemps qu'une condition (une expression booléenne, vue au jour 3) reste vraie :</p>
<pre class="pseudo">TANT QUE condition FAIRE            // teste la condition ; si VRAIE, on entre dans le corps
    instructions          // le "corps" de la boucle   // les actions répétées à chaque tour
FINTANTQUE                          // marque la fin du corps ; on retourne tester la condition</pre>
<p>Fonctionnement : on évalue la condition ; si elle est VRAIE, on exécute le <strong>corps</strong> (les instructions répétées), puis on <strong>revient tester la condition</strong>, et ainsi de suite. Dès qu'elle est FAUSSE, on saute après FINTANTQUE.</p>
<h3>3. Exemple : compter de 1 à 5</h3>
<pre class="pseudo">i ← 1                               // INITIALISATION : i (le compteur) part de 1
TANT QUE i <= 5 FAIRE               // tant que i n'a pas dépassé 5…
    Écrire(i)                       // … on affiche la valeur courante de i
    i ← i + 1                       // PROGRESSION : on augmente i de 1 (sinon boucle infinie)
FINTANTQUE                          // retour au test de la condition
// affiche 1 2 3 4 5, puis i vaut 6   // à 6, la condition devient FAUSSE, on sort</pre>
<div class="tip">La recette d'une boucle TANT QUE en 3 temps :
<br>1. <strong>Initialiser</strong> avant la boucle (i ← 1)
<br>2. <strong>Tester</strong> la condition (i <= 5)
<br>3. <strong>Faire progresser</strong> dans le corps (i ← i + 1)</div>
<h3>4. Le danger : la boucle infinie</h3>
<p>Une <strong>boucle infinie</strong> est une boucle qui ne s'arrête jamais parce que rien ne rend sa condition fausse. Le programme reste bloqué pour toujours :</p>
<pre class="pseudo">i ← 1                               // i vaut 1
TANT QUE i <= 5 FAIRE               // 1 <= 5 : toujours VRAI…
    Écrire(i)          // on a oublié i ← i + 1 !   // i n'augmente jamais
FINTANTQUE             // i vaut toujours 1 : boucle INFINIE   // la condition ne devient jamais fausse</pre>
<div class="warn">Si rien dans le corps ne peut rendre la condition fausse, la boucle ne s'arrête jamais. Vérifie TOUJOURS que quelque chose progresse.</div>
<h3>5. Une boucle peut ne jamais s'exécuter</h3>
<p>La condition est testée AVANT le premier tour. Si elle est fausse d'entrée, le corps est exécuté <strong>zéro</strong> fois :</p>
<pre class="pseudo">i ← 10                              // i vaut 10 au départ
TANT QUE i <= 5 FAIRE      // 10 <= 5 : FAUX dès le départ   // le test échoue immédiatement
    Écrire(i)               // jamais exécuté   // le corps est complètement sauté
FINTANTQUE                          // on continue directement après la boucle</pre>
<h3>6. Boucle de validation de saisie</h3>
<p>Usage très courant : redemander tant que la saisie est invalide.</p>
<pre class="pseudo">Écrire("Note entre 0 et 20 ?")      // invite
Lire(note)                          // première saisie (avant la boucle)
TANT QUE note < 0 OU note > 20 FAIRE   // tant que la note est HORS bornes (invalide)…
    Écrire("Invalide, recommence !")   // … on signale l'erreur
    Lire(note)                      // … et on redemande une saisie
FINTANTQUE                          // on ne sort qu'avec une note valide</pre>`,
  exercises: [
    { type: "qcm", q: "Quand la condition d'un TANT QUE est-elle testée ?", opts: ["Après chaque tour seulement", "Avant chaque tour, y compris le premier", "Une seule fois au début", "À la fin de l'algorithme"], a: 1, exp: "Test AVANT chaque exécution du corps : une boucle peut tourner 0 fois." },
    { type: "qcm", q: "<code>i ← 1 ; TANT QUE i <= 3 FAIRE Écrire(i) ; i ← i + 1 FINTANTQUE</code> : qu'affiche-t-on ?", opts: ["1 2 3", "1 2 3 4", "0 1 2 3", "2 3 4"], a: 0, exp: "i = 1, 2, 3 passent le test ; à 4 le test échoue." },
    { type: "input", q: "Après cette même boucle, que vaut <code>i</code> ?", a: "4", ph: "nombre", exp: "C'est justement parce que i vaut 4 que la boucle s'est arrêtée." },
    { type: "input", q: "<code>i ← 0 ; TANT QUE i < 10 FAIRE i ← i + 2 FINTANTQUE</code> : combien de tours ?", a: "5", ph: "nombre", exp: "i passe par 2, 4, 6, 8, 10 : cinq incréments." },

    { type: "qcm", q: "<code>i ← 8 ; TANT QUE i < 5 FAIRE Écrire(i) FINTANTQUE</code> : qu'affiche-t-on ?", opts: ["8", "5 6 7 8", "Rien : la condition est fausse dès le départ", "Boucle infinie"], a: 2, exp: "8 < 5 est FAUX avant le premier tour : zéro exécution." },

    { type: "qcm", q: "Dans la validation « note entre 0 et 20 », pourquoi la condition est-elle <code>note < 0 OU note > 20</code> ?", opts: ["C'est une erreur, il faudrait ET", "On boucle tant que la note est INVALIDE : hors bornes d'un côté OU de l'autre", "OU est plus rapide que ET", "Pour tester deux variables"], a: 1, exp: "La condition du TANT QUE décrit la situation qui doit continuer : ici, l'invalidité." },
    { type: "input", q: "<code>n ← 1 ; TANT QUE n < 100 FAIRE n ← n * 2 FINTANTQUE</code> : que vaut <code>n</code> à la fin ?", a: "128", ph: "nombre", exp: "1→2→4→8→16→32→64→128 ; 128 >= 100, on sort." },
    { type: "vf", q: "Le corps d'un TANT QUE s'exécute au moins une fois, quoi qu'il arrive.", a: false, exp: "Non ! Test avant le premier tour : zéro exécution possible (c'est RÉPÉTER…JUSQU'À, jour 11, qui garantit un tour)." },
    { type: "qcm", q: "Un utilisateur doit deviner un code. Quelle condition pour REDEMANDER tant qu'il se trompe ?", opts: ["TANT QUE reponse = code", "TANT QUE reponse ≠ code", "SI reponse ≠ code", "TANT QUE VRAI"], a: 1, exp: "On répète tant que c'est FAUX… donc tant que reponse ≠ code." },
    { type: "input", q: "Combien de fois « Bip » s'affiche-t-il ? <code>i ← 3 ; TANT QUE i > 0 FAIRE Écrire(\"Bip\") ; i ← i - 1 FINTANTQUE</code>", a: "3", ph: "nombre", exp: "i = 3, 2, 1 passent le test : trois Bip. Un compte à rebours classique." }
  ],
  final: {
    title: "Exercice final — Le livret d'épargne",
    intro: `<p>Tu places <strong>100 €</strong> sur un livret à <strong>10 %</strong> par an (les intérêts s'ajoutent au capital chaque année). Combien d'années faut-il pour dépasser <strong>150 €</strong> ?</p>
<pre class="pseudo">ALGORITHME Epargne                  // nom de l'algorithme
DEBUT                               // début des étapes
    capital ← 100                   // INITIALISATION : capital de départ
    annees ← 0                      // INITIALISATION : compteur d'années à 0
    TANT QUE capital <= 150 FAIRE   // tant qu'on n'a pas dépassé 150 €…
        capital ← capital * 1.10    // … on ajoute 10 % (×1.10) au capital
        annees ← annees + 1         // … et on compte une année de plus
    FINTANTQUE                      // retour au test tant que capital <= 150
    Écrire(annees)                  // affiche le nombre d'années nécessaire
FIN                                 // fin de l'algorithme</pre>`,
    questions: [
      { type: "input", q: "Que vaut le capital après le 1ᵉʳ tour de boucle ? (arrondi entier)", a: ["110"], ph: "nombre", exp: "100 × 1.10 = 110." },
      { type: "input", q: "Et après le 3ᵉ tour ? (110 → 121 → …)", a: ["133.1", "133,1", "133"], ph: "nombre", exp: "121 × 1.10 = 133.1." },
      { type: "input", q: "Combien d'années affiche l'algorithme ? (Suite : 110, 121, 133.1, 146.41, 161.05…)", a: "5", ph: "nombre", exp: "146.41 <= 150 : encore un tour → 161.05 > 150. On sort avec annees = 5." },
      { type: "qcm", q: "Que se passerait-il avec un taux de 0 % (capital ← capital * 1.0) ?", opts: ["La boucle s'arrête tout de suite", "Boucle infinie : le capital n'augmente jamais, la condition reste vraie", "annees vaut 1", "Erreur de syntaxe"], a: 1, exp: "Rien ne progresse vers la sortie : c'est le piège de la boucle infinie appliqué à un cas réel." },
      { type: "qcm", q: "Pourquoi initialiser <code>annees ← 0</code> AVANT la boucle ?", opts: ["Pour faire joli", "Sans initialisation, annees + 1 lirait une boîte vide : erreur", "Parce que 0 est pair", "C'est facultatif"], a: 1, exp: "Recette du TANT QUE : initialiser, tester, progresser." }
    ],
    solution: `<p>Trace complète :</p>
<pre class="pseudo">Tour   capital (avant)   capital (après)   annees
1      100               110               1
2      110               121               2
3      121               133.10            3
4      133.10            146.41            4
5      146.41            161.05            5
→ 161.05 > 150 : sortie, affiche 5</pre>
<p>Ce motif « boucler jusqu'à franchir un seuil » se retrouve partout : épargne, croissance de population, remboursement de dette…</p>`
  }
};

    solution: "Algorithme PesageDesPrises\nVar\n    poids : REEL              /* la saisie courante ; 0 = fin du pesage */\n    total : REEL              /* accumulateur des poids retenus */\n    nb : ENTIER               /* compteur de prises retenues */\n    rejets : ENTIER           /* compteur de saisies ecartees */\n    record : REEL             /* la prise la plus lourde */\n    moyenne : REEL\nDebut\n    total <- 0\n    nb <- 0\n    rejets <- 0\n    record <- 0\n\n    Ecrire(\"Poids de la prise (0 pour terminer) ?\")\n    Lire(poids)                        /* lecture d'AMORCAGE : sans elle, la\n                                          condition testerait une variable vide */\n\n    /* a) le 0 est une SENTINELLE : la boucle s'arrete dessus et il n'entre\n          dans aucun total. La condition le rejette avant tout traitement. */\n    TANT QUE poids <> 0 FAIRE\n        SI poids < 0 ALORS\n            /* b) ecartee et signalee, mais le pesage CONTINUE */\n            Ecrire(\"Saisie negative ecartee : \", poids)\n            rejets <- rejets + 1\n        SINON\n            total <- total + poids\n            nb <- nb + 1\n            SI poids > record ALORS\n                record <- poids\n            FINSI\n        FINSI\n        Ecrire(\"Poids de la prise (0 pour terminer) ?\")\n        Lire(poids)                    /* RELECTURE : c'est elle qui fait\n                                          progresser vers la sortie */\n    FINTANTQUE\n\n    /* c) le pecheur bredouille : nb vaut 0, et diviser par 0 n'a pas de sens */\n    SI nb > 0 ALORS\n        moyenne <- total / nb\n        Ecrire(nb, \" prise(s), total \", total, \" kg\")\n        Ecrire(\"Moyenne \", Arrondi(moyenne, 2), \" kg\")\n        Ecrire(\"Plus lourde : \", record, \" kg\")\n    SINON\n        Ecrire(\"Aucune prise retenue\")\n    FINSI\n    Ecrire(rejets, \" saisie(s) ecartee(s)\")\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>La duplication de la lecture</strong> est imposée par l'endroit où cette boucle teste : <em>avant</em> chaque tour. Pour que le tout premier test ait un sens, la variable doit déjà contenir quelque chose — donc une lecture doit avoir eu lieu avant d'entrer. Et pour que le test suivant porte sur une donnée nouvelle, il faut relire à la fin du corps. D'où deux instructions de lecture pour une seule saisie logique, et le fait qu'elles doivent rester <em>identiques</em> : le jour où l'on change le message de l'invite, il faut le changer aux deux endroits, ce qui est exactement le genre de dette qu'on oublie. Si je supprimais la première lecture, la condition testerait une variable jamais remplie : selon la rigueur du langage, soit une erreur immédiate, soit — bien pire — une valeur résiduelle quelconque, et l'algorithme entrerait ou n'entrerait pas dans la boucle sans qu'on puisse prévoir lequel. C'est cette gêne qui motivera la troisième boucle, celle qui teste après : elle n'a besoin que d'une seule lecture. <strong>Le pêcheur bredouille</strong> fait échouer la division : le compteur vaut zéro et la moyenne demande de diviser le total, lui aussi nul, par ce zéro. Est-ce que cela se voit ? Cela dépend, et c'est là que réside le danger. Sur papier ou dans un langage strict, la division par zéro s'arrête net et l'on comprend tout de suite. Mais en virgule flottante, 0 divisé par 0 ne provoque parfois aucune erreur : il produit une valeur spéciale qui s'affiche sous une forme absurde, ou pire, certains environnements rendent simplement 0 — et l'algorithme annonce alors tranquillement « moyenne : 0 kg » pour un pêcheur qui n'a rien pesé du tout. Le message est cohérent, personne ne le questionne, et la moyenne d'un ensemble vide vient d'être inventée. Le test explicite ne protège donc pas seulement du plantage : il protège d'une réponse fausse qui a l'air d'une réponse." }
    ],
    pourquoi: "Le compteur de rejets est affiché <em>hors</em> du test sur le nombre de prises, alors que tout le reste est à l'intérieur. C'est volontaire : un pêcheur peut très bien être rentré bredouille <em>et</em> avoir fait trois fautes de frappe, et cette information-là reste utile. Ranger un affichage dans une branche parce qu'il se trouve concerner le même sujet est une erreur fréquente ; ce qui décide de sa place, c'est la condition dont il dépend réellement.",
    checklist: [
      "Le 0 de fin est-il compté dans ton nombre de prises ? Il ne doit pas l'être.",
      "Une saisie négative fait-elle sortir de ta boucle, ou le pesage continue-t-il ?",
      "Sur 1,4 · 2,7 · −3 · 1,0 · 3,5 · 0, obtiens-tu 4 prises, 8,6 kg, une moyenne de 2,15 et un rejet ?",

      "Ta valeur de départ du record est-elle sûre ? Demande-toi ce qu'elle donnerait si les poids pouvaient être négatifs."
    ],
    note: "Déroule le jeu de saisies de la checklist ligne à ligne, en notant les quatre variables après chaque tour." },

  { num: "9.3", titre: "La borne d'arrosage — 2 / 4", niveau: 3, domaine: "espaces verts",

    reflexion: "La condition de continuation réunit trois exigences ; sa négation — la condition d'arrêt — en réunit combien, et avec quel mot de liaison ? Écris les deux et vérifie-les l'une contre l'autre. Puis : supprime par la pensée la ligne qui fait monter l'humidité, en gardant tout le reste. Ta boucle s'arrête-t-elle quand même, et grâce à quoi ? Que t'apprend cette expérience sur le nombre de garde-fous qu'il est raisonnable de mettre à une boucle qui dépend d'une mesure venue du monde extérieur ?",

    indices: [
      "Trois raisons d'arrêter, donc trois raisons de continuer, et il faut que toutes soient encore vraies pour faire une minute de plus. Trois grandeurs évoluent en même temps, chacune de sa propre quantité, et une seule d'entre elles décidera de la sortie.",

      "Ta copie ressemble à ceci : <br><code>TANT QUE … ET … ET … FAIRE</code><br><code>&nbsp;&nbsp;humidite ← …</code><br><code>&nbsp;&nbsp;litres ← …</code><br><code>&nbsp;&nbsp;minutes ← …</code><br><code>&nbsp;&nbsp;Écrire(…)</code><br><code>FINTANTQUE</code><br><code>SI humidite >= 60 ALORS … SINON SI … FINSI</code>"

    solution: "Algorithme SessionArrosage\nConst\n    SEUIL = 60                /* humidite de confort, en % */\n    RESERVOIR = 500           /* contenance, en litres */\n    DEBIT = 12                /* litres consommes par minute */\n    GAIN = 4                  /* points d'humidite gagnes par minute */\n    DUREE_MAX = 30            /* duree maximale d'une session, en minutes */\nVar\n    humidite : ENTIER\n    litres, minutes : ENTIER\nDebut\n    Ecrire(\"Humidite de depart (%) ?\")\n    Lire(humidite)\n    litres <- 0\n    minutes <- 0\n\n    /* a) on CONTINUE tant que les trois raisons de continuer tiennent :\n          elles se relient donc par des ET. Une seule qui cede arrete tout. */\n    TANT QUE humidite < SEUIL ET litres + DEBIT <= RESERVOIR ET minutes < DUREE_MAX FAIRE\n        /* la condition sur le reservoir ANTICIPE la minute a venir : tester\n           \"reste-t-il des litres\" laisserait consommer une minute de trop */\n        humidite <- humidite + GAIN\n        litres <- litres + DEBIT\n        minutes <- minutes + 1\n        Ecrire(\"Minute \", minutes, \" : \", humidite, \" % — \", litres, \" L\")\n    FINTANTQUE\n\n    /* c) l'ordre des tests fixe la priorite d'annonce. Le confort atteint\n          est le seul motif qui soit une REUSSITE : il passe en premier. */\n    SI humidite >= SEUIL ALORS\n        Ecrire(\"Arret : humidite de confort atteinte\")\n    SINON SI litres + DEBIT > RESERVOIR ALORS\n        Ecrire(\"Arret : reservoir insuffisant\")\n    SINON\n        Ecrire(\"Arret : duree maximale atteinte\")\n    FINSI\n\n    Ecrire(\"Bilan : \", minutes, \" min, \", litres, \" L, sol a \", humidite, \" %\")\nFin",

      { ref: "c", texte: "Deux motifs peuvent effectivement coïncider — le seuil atteint exactement à la trentième minute, ou le réservoir épuisé pile au moment où le confort est obtenu. J'annonce alors le <strong>confort atteint</strong>, parce que c'est le seul des trois qui soit une réussite : la session a fait ce qu'on lui demandait, et les deux autres motifs ne sont que des limites qu'elle a frôlées sans en souffrir. Annoncer « réservoir insuffisant » alors que le jardin est arrosé donnerait au jardinier une inquiétude sans objet, et l'enverrait vérifier une cuve qui n'a pas manqué. L'ordre des tests est donc une décision de communication, pas de logique." },
      { ref: "Réflexion", texte: "<strong>Les deux conditions.</strong> Continuer : <code>humidite &lt; 60 ET litres + 12 &lt;= 500 ET minutes &lt; 30</code>. S'arrêter, c'est la négation de cela — et par les lois de Morgan, le NON entre dans la parenthèse, retourne chaque comparaison et transforme les ET en OU : <code>humidite &gt;= 60 OU litres + 12 &gt; 500 OU minutes &gt;= 30</code>. Trois exigences reliées par des ET donnent trois motifs reliés par des OU : il suffit d'un seul pour arrêter, alors qu'il fallait les trois pour continuer. C'est la même règle qu'au jour 8, appliquée à trois termes au lieu de deux — et c'est aussi pourquoi les trois tests qui désignent le motif, après la boucle, sont exactement les trois membres de cette négation. <strong>L'expérience de pensée.</strong> Si je supprime la ligne qui fait monter l'humidité, la première exigence ne cédera jamais : le sol restera à 22 % pour l'éternité. La boucle s'arrête pourtant, et deux fois plutôt qu'une — le compteur de minutes atteindra 30, et le réservoir aurait de toute façon cédé à la 42<sup>e</sup>. Ce n'est pas un hasard heureux, c'est ce à quoi servent ces deux garde-fous : ils ne décrivent pas le fonctionnement normal, ils décrivent ce qui reste vrai <em>même quand le monde ne se comporte pas comme prévu</em>. Or une borne d'arrosage lit une sonde réelle, plantée dans une terre réelle, et cette sonde peut se boucher, geler, ou renvoyer une valeur figée. Sans limite de durée, l'algorithme continuerait d'ouvrir la vanne jusqu'à noyer le massif et vider la cuve — et il aurait raison, du point de vue de sa logique. Une boucle dont la condition dépend d'une mesure extérieure a besoin d'au moins un garde-fou qui, lui, ne dépende que du temps ou d'un décompte : c'est le seul qui progresse quoi qu'il arrive." }
