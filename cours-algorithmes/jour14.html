<script>
var DAY = {
  num: 14,
  title: "Les tableaux : introduction",
  subtitle: "Une seule variable pour des dizaines de valeurs.",
  theory: `
<h3>1. Le problème</h3>
<p>Imagine que tu dois stocker les notes de 30 élèves. Avec ce qu'on connaît, il faudrait 30 <strong>variables</strong> (une variable est une « boîte » nommée qui retient une valeur) : note1, note2, … jusqu'à note30. Ingérable, surtout pour les parcourir toutes. Le <strong>tableau</strong> (en anglais « array ») résout ça : c'est une <strong>rangée de boîtes</strong> regroupées sous UN seul nom, contenant plusieurs valeurs <strong>du même type</strong>. Le <strong>type</strong>, c'est la nature de la donnée : ENTIER pour un nombre entier, REEL pour un nombre à virgule, CHAINE pour du texte.</p>
<h3>2. Déclaration et représentation</h3>
<p><strong>Déclarer</strong> un tableau, c'est le créer en annonçant son nom, sa taille et le type de ses cases :</p>
<pre class="pseudo">VARIABLES notes : TABLEAU[1..5] D'ENTIERS   // "notes" : 5 cases numérotées 1 à 5, chacune un entier</pre>
<p>On peut se le représenter comme une rangée de casiers numérotés :</p>
<pre class="pseudo">indice :     1     2     3     4     5        // le numéro (la position) de chaque case
notes :   [ 12 ][  8 ][ 15 ][ 10 ][ 14 ]      // la valeur rangée dans chaque case</pre>
<p>Chaque case est repérée par son <strong>indice</strong> : sa position, son numéro dans la rangée. Dans ce cours, les indices commencent à <strong>1</strong> (la première case est la case numéro 1).</p>
<h3>3. Accéder à une case : nom[indice]</h3>
<p>Pour désigner une case précise, on écrit le nom du tableau suivi de l'indice entre <strong>crochets</strong> <code>[ ]</code> : <code>notes[3]</code> se lit « la case numéro 3 de notes ».</p>
<pre class="pseudo">notes[3] ← 15            // écrit 15 dans la case 3 (la flèche ← range une valeur à gauche)
x ← notes[1]             // lit la case 1 et copie sa valeur dans x → x vaut 12
notes[2] ← notes[2] + 1  // lit la case 2 (8), ajoute 1, réécrit le résultat : la case 2 passe à 9</pre>
<p>Une case de tableau s'utilise <strong>exactement comme une variable</strong> : on peut y affecter une valeur, l'utiliser dans des calculs, la comparer…</p>
<h3>4. L'indice peut être une variable !</h3>
<p>C'est LA grande idée, celle qui donne toute leur puissance aux tableaux : l'indice n'est pas obligé d'être un nombre fixe, ce peut être une variable (ou même un calcul).</p>
<pre class="pseudo">i ← 4                    // i est une variable qui vaut 4
Écrire(notes[i])         // notes[i] vaut notes[4] : affiche 10
Écrire(notes[i + 1])     // l'indice est un calcul : notes[4+1] = notes[5] : affiche 14</pre>
<div class="tip">Puisque l'indice peut être une variable… il peut être le compteur d'une boucle ! <code>notes[i]</code> placé dans un POUR permet de parcourir tout le tableau, case après case. C'est le programme de demain.</div>
<h3>5. Ne pas confondre indice et valeur</h3>
<p>Deux notions à ne jamais mélanger : l'<strong>indice</strong> dit <em>où</em> (à quelle position), la <strong>valeur</strong> dit <em>quoi</em> (ce qui est rangé à cette position).</p>
<pre class="pseudo">notes : [ 12 ][ 8 ][ 15 ][ 10 ][ 14 ]   // rappel du contenu du tableau
notes[2] = 8      // l'indice est 2, la VALEUR est 8
// "où ?" = indice   ·   "quoi ?" = valeur</pre>
<div class="warn">Accéder à une case qui n'existe pas (ex : <code>notes[6]</code> dans un tableau [1..5]) est une <strong>erreur de débordement</strong> (« dépasser les limites ») — l'une des erreurs les plus fréquentes en programmation.</div>
<h3>6. La taille</h3>
<p>La <strong>taille</strong> d'un tableau est son nombre de cases. Un tableau [1..n] contient <strong>n</strong> cases. On note souvent <code>TAILLE(t)</code> le nombre de cases du tableau t.</p>`,
  exercises: [
    { type: "qcm", q: "Un tableau sert à…", opts: ["Stocker plusieurs valeurs de même type sous un seul nom", "Dessiner des grilles", "Remplacer les boucles", "Stocker une seule valeur"], a: 0, exp: "Un nom + des indices, au lieu de 30 variables numérotées." },
    { type: "qcm", q: "Soit <code>t : [ 7 ][ 3 ][ 9 ][ 1 ]</code> (indices 1 à 4). Que vaut <code>t[2]</code> ?", opts: ["7", "3", "9", "2"], a: 1, exp: "Case numéro 2 → valeur 3." },
    { type: "input", q: "Même tableau : que vaut <code>t[4]</code> ?", a: "1", ph: "nombre", exp: "La dernière case contient 1." },

    { type: "qcm", q: "Peut-on mélanger des entiers et des chaînes dans un même tableau ?", opts: ["Oui, librement", "Non : toutes les cases ont le même type", "Oui, le tableau les convertit toutes en chaînes", "Oui, si on déclare le tableau sans préciser de type"], a: 1, exp: "TABLEAU D'ENTIERS = que des entiers. L'homogénéité permet les traitements en boucle." },
    { type: "qcm", q: "Pour stocker les températures des 365 jours de l'année, on déclare…", opts: ["365 variables", "temp : TABLEAU[1..365] DE REELS", "temp : REEL", "Une chaîne"], a: 1, exp: "Un tableau de 365 cases : temp[32] = température du 1ᵉʳ février." },
    { type: "qcm", q: "Échanger t[1] et t[2] : quelle séquence est correcte ?", opts: ["t[1] ← t[2] ; t[2] ← t[1]", "aux ← t[1] ; t[1] ← t[2] ; t[2] ← aux", "t[2] ← t[1] ; t[1] ← t[2]", "t[1] ← t[2]"], a: 1, exp: "Même règle que pour les variables (jour 2) : variable temporaire obligatoire !" },
    { type: "vf", q: "Dans le tableau [ 7 ][ 3 ][ 9 ][ 1 ], l'expression <code>t[t[2]]</code> est valide et vaut 9.", a: true, exp: "t[2] = 3, donc t[t[2]] = t[3] = 9. Un indice peut même venir du tableau lui-même !" }
  ],
  final: {
    title: "Exercice final — Le relevé de température",
    intro: `<p>Une station météo enregistre les températures de la semaine dans <code>temp : TABLEAU[1..7]</code> (lundi = 1, …, dimanche = 7) :</p>
<pre class="pseudo">indice :   1     2     3     4     5     6     7        // les 7 positions (lundi=1 … dimanche=7)
temp :  [ 12 ][ 15 ][ 11 ][ 18 ][ 16 ][  9 ][ 14 ]      // la température relevée chaque jour</pre>`,
    questions: [
      { type: "input", q: "Quelle température a-t-il fait jeudi (indice 4) ?", a: "18", ph: "nombre", exp: "temp[4] = 18°." },
      { type: "input", q: "Quel est l'INDICE du jour le plus froid ?", a: "6", ph: "nombre", exp: "La plus petite valeur (9°) est en case 6 (samedi). Réponse attendue : l'indice, pas la valeur !" },
      { type: "input", q: "Que vaut <code>temp[7] - temp[1]</code> (écart dimanche-lundi) ?", a: "2", ph: "nombre", exp: "14 - 12 = 2°." },
      { type: "qcm", q: "<code>j ← 2 ; Écrire(temp[j * 2])</code> affiche…", opts: ["15", "18", "11", "Erreur"], a: 1, exp: "j*2 = 4 → temp[4] = 18. L'indice est une expression calculée." },
      { type: "qcm", q: "On exécute <code>temp[8] ← 20</code>. Que se passe-t-il ?", opts: ["Le mois prochain est ajouté", "Erreur de débordement : le tableau s'arrête à l'indice 7", "temp[1] est modifié", "Rien"], a: 1, exp: "[1..7] : la case 8 n'existe pas. Le débordement, encore et toujours." }
    ],
    solution: `<p>Réponses sur le tableau :</p>
<pre class="pseudo">temp[4] = 18            (jeudi)              // la case 4 contient 18
minimum = 9 à l'INDICE 6 (samedi)          // la plus petite valeur (9) est en case 6
temp[7] - temp[1] = 14 - 12 = 2            // écart dimanche - lundi
temp[j*2] avec j=2 → temp[4] = 18          // l'indice est un calcul : 2 × 2 = 4
temp[8] → débordement !                     // la case 8 n'existe pas dans [1..7]</pre>
<p>Demain, on branche une boucle POUR sur l'indice pour traiter les 7 cases automatiquement — et là, les tableaux prennent tout leur sens.</p>`
  }
};

    solution: "Algorithme RayonDesConserves\nConst\n    NB_REF = 8\n    TRES_GRAND = 999999       /* valeur de depart d'un MINIMUM */\nVar\n    stock : TABLEAU[1..8] D'ENTIERS\n    i, ruptures, minStock, minRef, numero : ENTIER\nDebut\n    POUR i DE 1 A NB_REF FAIRE\n        Ecrire(\"Stock de la reference \", i, \" ?\")\n        Lire(stock[i])\n    FINPOUR\n\n    ruptures <- 0\n    minStock <- TRES_GRAND    /* pour un MINIMUM on part TRES HAUT.\n                                 Partir de 0 laisserait le minimum a 0 et\n                                 minRef a 0 : une reponse d'allure correcte. */\n    minRef <- 0               /* 0 = aucune reference retenue pour l'instant */\n\n    POUR i DE 1 A NB_REF FAIRE\n        SI stock[i] = 0 ALORS\n            Ecrire(\"Reference \", i, \" en rupture\")\n            ruptures <- ruptures + 1\n        SINON\n            /* b) le minimum ne porte QUE sur les references en stock :\n                  une rupture n'est pas un stock faible, c'est une absence */\n            SI stock[i] < minStock ALORS\n                minStock <- stock[i]\n                minRef <- i            /* on retient le NUMERO, pas la quantite */\n            FINSI\n        FINSI\n    FINPOUR\n\n    Ecrire(ruptures, \" reference(s) en rupture\")\n\n    /* d) le cas ou tout est en rupture : minRef n'a jamais ete affecte */\n    SI minRef = 0 ALORS\n        Ecrire(\"Aucune reference en stock : rayon entierement vide\")\n    SINON\n        Ecrire(\"Reference la moins fournie : n\", minRef, \" (\", minStock, \" boites)\")\n    FINSI\n\n    /* c) on VALIDE avant d'acceder : un indice hors bornes ne designe rien */\n    Ecrire(\"Consulter quelle reference ?\")\n    Lire(numero)\n    SI numero >= 1 ET numero <= NB_REF ALORS\n        Ecrire(\"Reference \", numero, \" : \", stock[numero], \" boites\")\n    SINON\n        Ecrire(\"Numero inconnu : les references vont de 1 a \", NB_REF)\n    FINSI\nFin",

      { ref: "Réflexion", texte: "<strong>La confusion plausible</strong> se loge dans la ligne <code>minRef ← i</code>. Écrire <code>minRef ← stock[i]</code> à la place produit un algorithme qui tourne, n'affiche aucune erreur, et annonce « référence la moins fournie : n° 3 » sur mes données — parce que le stock minimal vaut 3 et que la référence n° 3 existe. Elle porte 45 boîtes, c'est la troisième mieux fournie du rayon, et l'épicier va la recommander pour rien. Le résultat est faux, il a la bonne forme, et il désigne une référence réelle : rien ne permet de le repérer sans recompter à la main. C'est exactement pourquoi l'énoncé a été construit avec un stock minimal de 3 — sur des données où le minimum vaudrait 47, la confusion sauterait aux yeux, et l'exercice n'apprendrait rien. <strong>L'ordre inverse est impossible</strong>, pas seulement déconseillé. Accéder d'abord, c'est demander la case n° 12 d'un tableau qui en compte 8 : selon l'environnement, soit l'exécution s'arrête sur-le-champ — et le test qui suivait n'est jamais atteint —, soit, ce qui est bien pire, l'algorithme lit ce qui se trouve en mémoire juste après le tableau et rend une valeur quelconque sans rien signaler. Dans les deux cas, la vérification arrive trop tard : elle porterait sur un accès déjà commis. Une validation qui ne précède pas l'opération qu'elle valide ne valide rien. C'est la même logique que l'anticipation du réservoir au jour 9, où il fallait se demander si la minute à venir tiendrait, et non si des litres restaient. <strong>La difficulté du minimum sous condition</strong> n'est pas la condition elle-même, qui est un simple test. Elle est que la recherche peut ne rencontrer <em>aucune</em> case admissible, et que dans ce cas les deux variables du couple restent sur leur valeur de départ — une quantité gigantesque et un numéro qui n'existe pas. Un minimum ordinaire n'a pas ce problème : dès qu'il y a une case, il y a un minimum. Ici, il faut un moyen de savoir si l'on a retenu quelque chose, et c'est le rôle de la valeur 0 donnée au numéro, choisie précisément parce qu'aucun indice valide ne peut valoir 0. La difficulté n'est donc pas dans la boucle, elle est <em>après</em> — dans l'obligation de distinguer « le minimum est petit » de « il n'y a pas de minimum »." }
    ],
    pourquoi: "Le numéro de référence non retenu est marqué par la valeur 0, et non par une valeur négative ou par un booléen supplémentaire. Zéro fonctionne ici parce que les indices commencent à 1 : c'est une valeur <em>structurellement</em> impossible, garantie par la déclaration du tableau et non par une hypothèse sur les données. C'est la différence avec la houle initialisée à −1 du jour 12, qui reposait, elle, sur une propriété des mesures — et qui s'effondrerait sur des températures.",

    solution: "Algorithme CarnetAvecTableau\nConst\n    JOURS = 7\nVar\n    houle : TABLEAU[1..7] DE REELS\n    j, numero, jourPremier : ENTIER\n    nouvelle, ancienne, ecart : REEL\n    premier, second : REEL\nDebut\n    /* a) le tableau CONSERVE : les valeurs survivent a la boucle qui les lit */\n    POUR j DE 1 A JOURS FAIRE\n        Ecrire(\"Houle moyenne du jour \", j, \" (m) ?\")\n        Lire(houle[j])\n    FINPOUR\n\n    /* b) consultation : on valide AVANT d'acceder */\n    Ecrire(\"Consulter quel jour (1 a \", JOURS, \") ?\")\n    Lire(numero)\n    SI numero >= 1 ET numero <= JOURS ALORS\n        Ecrire(\"Jour \", numero, \" : \", houle[numero], \" m\")\n    SINON\n        Ecrire(\"Jour inconnu\")\n    FINSI\n\n    /* c) correction : l'ancienne valeur est mise de cote AVANT l'ecriture */\n    Ecrire(\"Corriger quel jour ?\")\n    Lire(numero)\n    SI numero < 1 OU numero > JOURS ALORS\n        Ecrire(\"Jour inconnu : aucune correction\")\n    SINON\n        Ecrire(\"Nouvelle houle moyenne ?\")\n        Lire(nouvelle)\n        ancienne <- houle[numero]\n        houle[numero] <- nouvelle\n        ecart <- nouvelle - ancienne\n        Ecrire(\"Jour \", numero, \" : \", ancienne, \" corrige en \", nouvelle,\n               \" (ecart \", Arrondi(ecart, 2), \" m)\")\n\n        /* d) DEUX records tenus en cascade : quand une valeur bat le premier,\n              l'ancien premier ne disparait pas, il devient le second. */\n        premier <- -1\n        second <- -1\n        jourPremier <- 0\n        POUR j DE 1 A JOURS FAIRE\n            SI houle[j] > premier ALORS\n                second <- premier      /* on RELEGUE avant de promouvoir :\n                                          l'ordre inverse perdrait l'ancien */\n                premier <- houle[j]\n                jourPremier <- j\n            SINON SI houle[j] > second ALORS\n                /* la valeur intermediaire : elle ne bat pas le premier mais\n                   doit quand meme etre confrontee au second */\n                second <- houle[j]\n            FINSI\n        FINPOUR\n\n        SI jourPremier = numero ALORS\n            Ecrire(\"Le jour \", numero, \" devient le plus agite de la semaine\")\n            Ecrire(\"Il depasse le suivant de \", Arrondi(premier - second, 2), \" m\")\n        SINON\n            Ecrire(\"Le plus agite reste le jour \", jourPremier,\n                   \" avec \", premier, \" m\")\n        FINSI\n    FINSI\nFin",
