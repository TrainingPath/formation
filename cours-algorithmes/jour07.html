<script>
var DAY = {
  num: 7,
  title: "Conditions imbriquées et SINON SI",
  subtitle: "Gérer plus de deux cas : les chaînes de décisions.",
  theory: `
<h3>1. Plus de deux cas ?</h3>
<p>Hier, nos SI ne géraient que 2 issues. Or beaucoup de problèmes ont 3, 4, 5 cas : mentions d'examen, tranches de tarifs, catégories d'âge… Deux outils : l'<strong>imbrication</strong> et le <strong>SINON SI</strong>.</p>
<h3>2. SI imbriqués</h3>
<p>On peut placer un SI à l'intérieur d'un autre :</p>
<pre class="pseudo">SI age >= 18 ALORS
    SI aPermis = VRAI ALORS
        Écrire("Peut conduire")
    SINON
        Écrire("Doit passer le permis")
    FINSI
SINON
    Écrire("Trop jeune")
FINSI</pre>
<p>Le SI interne n'est évalué <strong>que si</strong> le SI externe est vrai.</p>
<h3>3. SINON SI : la cascade</h3>
<p>Pour tester des cas <strong>exclusifs</strong> en série, la cascade est plus lisible que l'imbrication :</p>
<pre class="pseudo">SI note >= 16 ALORS
    Écrire("Très bien")
SINON SI note >= 14 ALORS
    Écrire("Bien")
SINON SI note >= 12 ALORS
    Écrire("Assez bien")
SINON SI note >= 10 ALORS
    Écrire("Passable")
SINON
    Écrire("Échoué")
FINSI</pre>
<div class="tip">La cascade s'arrête à la <strong>première</strong> condition vraie : les suivantes ne sont même pas regardées. Avec note = 15 : 15 >= 16 FAUX, puis 15 >= 14 VRAI → « Bien », et on saute directement au FINSI.</div>
<h3>4. L'ordre des conditions compte !</h3>
<pre class="pseudo">// FAUX : tout le monde >= 10 tombe dans "Passable" !
SI note >= 10 ALORS Écrire("Passable")
SINON SI note >= 16 ALORS Écrire("Très bien")   // jamais atteint !
FINSI</pre>
<div class="warn">Dans une cascade de seuils, on teste du <strong>plus exigeant au moins exigeant</strong> (ou l'inverse strict), jamais dans le désordre.</div>
<h3>5. Un seul FINSI pour toute la cascade</h3>
<p>SI / SINON SI / SINON SI / … / SINON forment UNE seule structure : un unique FINSI la termine. En revanche, chaque SI imbriqué a son propre FINSI.</p>`,
  exercises: [
    { type: "qcm", q: "Dans une cascade SINON SI, combien de blocs s'exécutent au maximum ?", opts: ["Tous ceux dont la condition est vraie", "Exactement un : le premier dont la condition est vraie", "Toujours le dernier", "Deux"], a: 1, exp: "Dès qu'une condition est vraie, le reste de la cascade est ignoré." },
    { type: "qcm", q: "note = 15 dans la cascade des mentions (16/14/12/10). Qu'affiche-t-on ?", opts: ["Très bien", "Bien", "Assez bien", "Passable"], a: 1, exp: "15 >= 16 FAUX, 15 >= 14 VRAI → Bien, et on sort." },
    { type: "qcm", q: "note = 16 : qu'affiche la même cascade ?", opts: ["Très bien", "Bien", "Assez bien", "Échoué"], a: 0, exp: "16 >= 16 VRAI dès le premier test." },
    { type: "qcm", q: "note = 9 : qu'affiche la cascade ?", opts: ["Passable", "Échoué", "Assez bien", "Rien"], a: 1, exp: "Toutes les conditions sont fausses → bloc SINON final." },
    { type: "vf", q: "Avec note = 17, les blocs « Très bien », « Bien » et « Assez bien » s'exécutent tous (17 dépasse tous les seuils).", a: false, exp: "Seul le PREMIER bloc vrai s'exécute : « Très bien » uniquement." },
    { type: "qcm", q: "Pourquoi cette cascade est-elle fausse ? <code>SI n >= 10 ALORS \"Passable\" SINON SI n >= 16 ALORS \"Très bien\"</code>", opts: ["Il manque une variable", "n >= 16 ne sera jamais testé pour les notes >= 10 : une note de 17 affiche « Passable »", "On ne peut pas mettre deux conditions", "Elle est correcte"], a: 1, exp: "17 >= 10 est vrai en premier : l'ordre des seuils est cassé." },
    { type: "qcm", q: "Dans le code du permis (théorie §2), que s'affiche-t-il pour age = 20 et aPermis = FAUX ?", opts: ["Peut conduire", "Doit passer le permis", "Trop jeune", "Rien"], a: 1, exp: "SI externe vrai → SI interne : aPermis FAUX → SINON interne." },
    { type: "qcm", q: "Même code, age = 15 et aPermis = VRAI ?", opts: ["Peut conduire", "Doit passer le permis", "Trop jeune", "Erreur"], a: 2, exp: "Le SI externe est faux : le permis n'est même pas regardé." },
    { type: "vf", q: "Une cascade SI / SINON SI / SINON se termine par un seul FINSI.", a: true, exp: "C'est UNE structure unique, donc un seul FINSI." },
    { type: "qcm", q: "Combien de cas distincts gère : SI…ALORS / SINON SI / SINON SI / SINON / FINSI ?", opts: ["2", "3", "4", "5"], a: 2, exp: "3 conditions + le cas « aucune » du SINON = 4 chemins." },
    { type: "qcm", q: "x = 0. <code>SI x > 0 ALORS \"positif\" SINON SI x < 0 ALORS \"négatif\" SINON \"nul\" FINSI</code> ?", opts: ["positif", "négatif", "nul", "Rien"], a: 2, exp: "0 n'est ni > 0 ni < 0 : c'est le SINON final." },
    { type: "qcm", q: "Pour classer un âge en « enfant (<12) », « ado (12–17) », « adulte (18+) », quel premier test choisir dans une cascade descendante ?", opts: ["age >= 18", "age >= 12", "age < 12 puis age >= 18", "age = 12"], a: 0, exp: "On part du seuil le plus haut : >= 18, SINON SI >= 12, SINON enfant." },
    { type: "qcm", q: "Dans la cascade « age >= 18 → adulte, SINON SI age >= 12 → ado, SINON → enfant », pourquoi le 2ᵉ test n'a pas besoin de vérifier age < 18 ?", opts: ["Parce que c'est interdit", "Parce qu'on n'arrive au SINON SI que si age >= 18 était FAUX : on SAIT déjà que age < 18", "Parce que age est un entier", "Il en a besoin en réalité"], a: 1, exp: "Chaque SINON SI hérite de la négation des tests précédents : c'est ce qui rend la cascade élégante." },
    { type: "qcm", q: "Un SI imbriqué dans un autre SI : combien de FINSI faut-il ?", opts: ["1", "2 : un par SI", "0", "3"], a: 1, exp: "Chaque SI ouvre un bloc qui doit être refermé." },
    { type: "vf", q: "Imbrication et cascade peuvent se combiner dans le même algorithme.", a: true, exp: "On imbrique quand les questions sont dépendantes, on cascade quand les cas sont exclusifs." }
  ],
  final: {
    title: "Exercice final — Le tarif du musée",
    intro: `<p>Un musée applique : <strong>gratuit</strong> pour les moins de 6 ans, <strong>5 €</strong> de 6 à 17 ans, <strong>12 €</strong> de 18 à 64 ans, <strong>8 €</strong> à partir de 65 ans. De plus, le mercredi, les 6-17 ans ne paient que <strong>3 €</strong>.</p>
<pre class="pseudo">ALGORITHME TarifMusee
DEBUT
    Lire(age)
    Lire(estMercredi)     // BOOLEEN
    SI age < 6 ALORS
        prix ← 0
    SINON SI age < 18 ALORS
        SI estMercredi ALORS
            prix ← 3
        SINON
            prix ← 5
        FINSI
    SINON SI age < 65 ALORS
        prix ← 12
    SINON
        prix ← 8
    FINSI
    Écrire(prix)
FIN</pre>`,
    questions: [
      { type: "input", q: "age = 4, estMercredi = VRAI : quel prix ?", a: "0", ph: "nombre", exp: "Moins de 6 ans : gratuit, le mercredi n'est même pas testé." },
      { type: "input", q: "age = 15, estMercredi = VRAI : quel prix ?", a: "3", ph: "nombre", exp: "6-17 ans + mercredi : le SI imbriqué donne 3 €." },
      { type: "input", q: "age = 15, estMercredi = FAUX : quel prix ?", a: "5", ph: "nombre", exp: "6-17 ans hors mercredi : 5 €." },
      { type: "input", q: "age = 70, estMercredi = VRAI : quel prix ?", a: "8", ph: "nombre", exp: "65+ : 8 €. La réduction du mercredi ne concerne que les 6-17 ans." },
      { type: "qcm", q: "Pourquoi le test <code>age < 18</code> suffit-il pour la tranche 6-17, sans vérifier age >= 6 ?", opts: ["C'est une erreur de l'algorithme", "Parce qu'on n'atteint ce SINON SI que si age < 6 était FAUX : on sait déjà que age >= 6", "Parce que age est positif", "Parce que 18 > 6"], a: 1, exp: "La cascade élimine les cas au fur et à mesure : chaque étage hérite des refus précédents." }
    ],
    solution: `<p>Table de vérification complète :</p>
<pre class="pseudo">age   mercredi   chemin suivi                 prix
4     -          age &lt; 6                      0
15    VRAI       6-17 → SI interne VRAI       3
15    FAUX       6-17 → SINON interne         5
30    -          age &lt; 65                     12
70    -          SINON final                  8</pre>
<p>Structure : une CASCADE pour les tranches d'âge (cas exclusifs) + une IMBRICATION pour le mercredi (question dépendante). C'est le duo gagnant.</p>`
  }
};
</script>

var ECRITURE = {

  items: [
  { id: "algo-mention", title: "La mention", level: 2,
    statement: "Lis une note sur 20 et affiche la mention : <strong>&lt; 10</strong> → \"Insuffisant\", <strong>10–11</strong> → \"Passable\", <strong>12–13</strong> → \"Assez bien\", <strong>14–15</strong> → \"Bien\", <strong>16 et +</strong> → \"Très bien\".",
    hints: [
      "C'est une chaîne de décisions : un seul cas doit s'afficher → SINON SI.",
      "Teste les cas dans l'ordre croissant : si note < 10 est faux, tu sais déjà que note ≥ 10. Inutile de retester la borne basse.",
      "Enchaîne : SI note < 10 … SINON SI note < 12 … SINON SI note < 14 … SINON SI note < 16 … SINON … FINSI."
    ],
    solution: "ALGORITHME Mention               // nom de l'algorithme\nVARIABLES note : REEL            // la note saisie (peut avoir des décimales)\nDEBUT                            // début des instructions\n    Écrire(\"Note sur 20 ?\")      // pose la question\n    Lire(note)                   // range la saisie dans note\n    SI note < 10 ALORS           // premier palier testé\n        Écrire(\"Insuffisant\")    // en dessous de 10\n    SINON SI note < 12 ALORS     // ici on sait déjà que note >= 10\n        Écrire(\"Passable\")       // donc entre 10 et 11,99\n    SINON SI note < 14 ALORS     // ici note >= 12 forcément\n        Écrire(\"Assez bien\")     // entre 12 et 13,99\n    SINON SI note < 16 ALORS     // ici note >= 14 forcément\n        Écrire(\"Bien\")           // entre 14 et 15,99\n    SINON                        // tout ce qui reste : 16 et plus\n        Écrire(\"Très bien\")      // le dernier cas n'a pas besoin de condition\n    FINSI                        // un seul FINSI ferme toute la chaîne\nFIN                              // fin de l'algorithme",
    note: "Le piège classique : retester inutilement note >= 10 ET note < 12. Le SINON SI le fait déjà." }
  ]
};
