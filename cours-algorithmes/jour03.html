  title: "Les types de données",
  subtitle: "Entier, réel, chaîne, booléen : chaque boîte a une forme.",
  theory: `
<h3>1. Pourquoi des types ?</h3>
<p>Rappel du jour 2 : une <strong>variable</strong> est une boîte nommée dans la <strong>mémoire</strong> (l'espace de travail temporaire de l'ordinateur) qui contient une <strong>valeur</strong> (une information : un nombre, un texte…). Mais toutes les valeurs ne se ressemblent pas : on ne calcule pas avec un prénom, on ne met pas de virgule dans un nombre d'enfants. Le <strong>type</strong> d'une variable, c'est la <strong>nature</strong> de ce qu'elle a le droit de contenir. C'est comme la forme d'un récipient : une bouteille est faite pour un liquide, une boîte à œufs pour des œufs. Le type définit donc à la fois <strong>ce que la variable peut contenir</strong> et <strong>ce qu'on peut en faire</strong> (quelles opérations sont autorisées).</p>
<h3>2. Les 4 types fondamentaux</h3>
<p>Une <strong>opération</strong> est une action que l'on applique à des valeurs (une addition, un collage de textes…). Voici les quatre grandes familles de valeurs que nous utiliserons :</p>
<ul>
<li><strong>ENTIER</strong> : les nombres <strong>sans virgule</strong> (les nombres entiers) : <code>-3, 0, 42</code>. Opérations possibles : + (addition), − (soustraction), × (multiplication), ÷ (division), ainsi que DIV et MOD (voir plus bas).</li>
<li><strong>REEL</strong> : les nombres <strong>à virgule</strong> (comme sur une calculatrice) : <code>3.14, -0.5, 2.0</code>. En informatique on écrit la virgule avec un <strong>point</strong>.</li>
<li><strong>CHAINE</strong> : du <strong>texte</strong>, c'est-à-dire une suite de <strong>caractères</strong> (lettres, chiffres, espaces, symboles). On l'écrit entre guillemets : <code>"Bonjour"</code>, <code>"42"</code> (attention : "42" entre guillemets est du TEXTE, pas un nombre !). Le mot « chaîne » vient de « chaîne de caractères » : les caractères se suivent comme les maillons d'une chaîne.</li>
<li><strong>BOOLEEN</strong> : un type qui n'a que <strong>deux valeurs possibles</strong> : <code>VRAI</code> ou <code>FAUX</code>. C'est le type des réponses par oui ou par non.</li>
</ul>
<pre class="pseudo">VARIABLES                       // section qui liste les variables et leur type
    age : ENTIER          // 15       // la boîte "age" ne peut contenir qu'un nombre entier
    taille : REEL         // 1.68     // la boîte "taille" contient un nombre à virgule
    prenom : CHAINE       // "Léa"    // la boîte "prenom" contient du texte (entre guillemets)
    estMajeur : BOOLEEN   // FAUX     // la boîte "estMajeur" ne contient que VRAI ou FAUX</pre>
<h3>3. Le piège "42" vs 42</h3>
<p>Le même « 42 » peut être un nombre ou un texte selon qu'il y a ou non des guillemets. C'est une distinction fondamentale :</p>
<pre class="pseudo">a ← 42        // ENTIER : "a" reçoit le NOMBRE 42, donc a + 1 vaut 43
b ← "42"      // CHAINE : "b" reçoit le TEXTE "42" ; b + 1 n'a pas de sens (ou colle du texte)</pre>
<div class="warn">Les guillemets changent tout : <code>"42"</code> est une suite de deux caractères (le caractère '4' puis le caractère '2'), pas un nombre avec lequel on peut calculer.</div>
<h3>4. Opérations spéciales des entiers : DIV et MOD</h3>
<p>Quand on divise deux entiers, il y a deux résultats intéressants, comme à l'école primaire avec la division « à la main ». <strong>DIV</strong> donne le <strong>quotient</strong> de la division entière (combien de fois le second nombre rentre dans le premier). <strong>MOD</strong> donne le <strong>reste</strong> (ce qui reste une fois qu'on ne peut plus retirer le diviseur). MOD est l'abréviation de « modulo ».</p>
<pre class="pseudo">17 DIV 5  → 3     // quotient : 5 rentre 3 fois entières dans 17
17 MOD 5  → 2     // reste : il reste 2 (car 3×5=15, et 17-15=2)
12 MOD 2  → 0     // reste nul : 12 est divisible par 2, donc 12 est PAIR</pre>
<div class="tip"><code>n MOD 2 = 0</code> ⇔ n est pair (car un nombre pair se divise exactement par 2, sans reste). <code>n MOD 10</code> donne le dernier chiffre de n. Ces deux astuces servent constamment.</div>
<h3>5. La concaténation des chaînes</h3>
<p><strong>Concaténer</strong>, c'est <strong>coller deux textes bout à bout</strong> pour n'en former qu'un seul. L'opérateur <code>&amp;</code> réalise cette opération :</p>
<pre class="pseudo">message ← "Bonjour " &amp; "Léa"    // colle "Bonjour " et "Léa" → message contient "Bonjour Léa"</pre>
<h3>6. Les booléens</h3>
<p>Un booléen stocke le résultat d'une question fermée (à laquelle on répond seulement par oui ou par non). Il sera le carburant des <strong>conditions</strong> (les « si… alors… », vus au jour 6) :</p>
<pre class="pseudo">estMajeur ← (age >= 18)    // teste "age est-il ≥ 18 ?" : range VRAI si oui, FAUX sinon</pre>`,

    { type: "qcm", q: "Quel type pour stocker un nombre d'élèves dans une classe ?", opts: ["REEL", "CHAINE", "ENTIER", "BOOLEEN"], a: 2, exp: "On ne compte pas 24,5 élèves : un entier suffit." },

    { type: "input", q: "Que vaut <code>n MOD 7</code> si <code>n ← 21</code> ?", a: "0", ph: "nombre", exp: "21 = 3×7 : reste nul, 21 est divisible par 7." }
  ],

VARIABLES                           // liste des boîtes et de leur type
    nom : CHAINE                    // texte : le nom du membre
    age : ENTIER                    // nombre entier : son âge
    cotisation : REEL               // nombre à virgule : le montant à payer
    aPaye : BOOLEEN                 // VRAI ou FAUX : a-t-il payé ?
    numero : ENTIER                 // nombre entier : son numéro de membre
DEBUT                               // début des étapes
    nom ← "Martin"                  // on range le texte "Martin" dans nom
    age ← 15                        // on range le nombre 15 dans age
    cotisation ← 25.50              // on range le réel 25.50 dans cotisation
    aPaye ← VRAI                    // on range la valeur booléenne VRAI
    numero ← 2026 * 10 + 4      // 20264   // année×10 puis + rang → 20264
    // numero MOD 10 → rang (4), numero DIV 10 → année (2026)   // rappel : MOD garde le reste, DIV coupe
    message ← "Bienvenue " &amp; nom     // concatène le texte et le nom → "Bienvenue Martin"
FIN                                 // fin de l'algorithme</pre>
<p>Retiens : DIV coupe, MOD garde le reste — ensemble ils décomposent n'importe quel nombre.</p>`
  }
