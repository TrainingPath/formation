  title: "La récursivité : applications",
  subtitle: "Fibonacci, dichotomie récursive, et l'art de penser « plus petit ».",
  theory: `
<h3>Rappel express : la récursivité</h3>
<p>Aujourd'hui on met en pratique la <strong>récursivité</strong> vue hier. La récursivité, c'est le fait pour une <strong>fonction</strong> (une mini-recette de calcul, qui reçoit des données et renvoie un résultat) de <strong>s'appeler elle-même</strong>. Imaginez deux miroirs face à face : chacun renvoie l'image de l'autre, encore et encore. Ou une <strong>poupée russe</strong> : quand vous l'ouvrez, vous trouvez à l'intérieur… une poupée russe identique mais plus petite, et ainsi de suite jusqu'à la plus petite qui, elle, ne s'ouvre plus. La récursivité fonctionne exactement comme cela.</p>
<p>Deux notions reviennent sans cesse. Définissons-les tout de suite :</p>
<ul>
<li>Le <strong>cas de base</strong> : la situation la plus simple, celle qu'on sait résoudre <em>directement</em>, sans se rappeler soi-même. C'est la plus petite poupée russe, celle qui ne s'ouvre plus : elle <strong>arrête</strong> la descente. Sans elle, la fonction s'appellerait à l'infini (comme les deux miroirs).</li>
<li>Le <strong>cas récursif</strong> : la situation générale. On la résout en se rappelant soi-même sur un problème <strong>un peu plus petit</strong>, qui se rapproche pas à pas du cas de base.</li>
</ul>
<p>Vocabulaire des fonctions que nous allons croiser : le mot-clé <code>FONCTION</code> ouvre la mini-recette et lui donne un nom ; entre parenthèses on trouve ses <strong>paramètres</strong> (les données qu'on lui fournit, comme les ingrédients qu'on passe à une recette) ; après les deux-points, le <strong>type</strong> du résultat renvoyé (<code>ENTIER</code> = un nombre entier, <code>CHAINE</code> = du texte) ; le mot-clé <code>RETOURNER</code> renvoie la réponse <em>et arrête aussitôt</em> la fonction. Un <strong>appel récursif</strong> est simplement le moment où la fonction s'utilise elle-même dans son propre corps.</p>
<h3>1. La méthode pour CONCEVOIR une récursion</h3>
<p>Voici la recette de pensée en trois questions. Ce n'est pas du code, mais une checklist mentale à suivre à chaque fois :</p>
<pre class="pseudo">1. Quel est le cas le plus simple ? (→ cas de base)
2. Si quelqu'un résolvait le problème en taille n-1 pour moi,
   comment m'en servirais-je pour la taille n ? (→ cas récursif)
3. Vérifier : chaque appel se rapproche-t-il du cas de base ?</pre>
<p>Le point 2 est le déclic : on fait CONFIANCE à l'appel récursif, sans dérouler mentalement tous les étages. C'est comme déléguer : vous demandez à un assistant de préparer la version « taille n−1 », vous supposez qu'il la fera correctement, et vous vous contentez d'ajouter la dernière touche pour passer à la « taille n ». Vous ne vérifiez pas comment l'assistant s'y prend — vous lui faites confiance.</p>
<h3>2. La suite de Fibonacci</h3>
<p>La <strong>suite de Fibonacci</strong> est une liste de nombres où chaque terme est la <strong>somme des deux précédents</strong> : 1, 1, 2, 3, 5, 8, 13, 21… (on la retrouve dans la reproduction des lapins, les spirales de tournesol, les pommes de pin…). Le mot <strong>terme</strong> désigne simplement un nombre de la liste, repéré par sa position (le 1<sup>er</sup> terme, le 5<sup>e</sup> terme, etc.). Cette définition « chaque terme dépend des deux d'avant » est <em>naturellement</em> récursive :</p>
<pre class="pseudo">FONCTION fib(n) : ENTIER                  // fonction "fib" : reçoit n (la position voulue), renvoie un ENTIER
DEBUT                                      // début du corps de la fonction
    SI n <= 2 ALORS                        // cas de base : les DEUX premières positions (1 et 2)
        RETOURNER 1                        // fib(1) = fib(2) = 1 : on renvoie 1 et la fonction s'arrête
    SINON                                  // cas récursif : n est plus grand que 2
        RETOURNER fib(n - 1) + fib(n - 2)  // somme des DEUX termes précédents : DEUX appels à fib elle-même
    FINSI                                  // fin du choix SI / SINON
FIN                                        // fin de la fonction</pre>
<div class="warn">Deux appels par étage = les appels se multiplient : fib(50) naïf ferait des milliards d'appels (fib(3) est recalculé des millions de fois). Une boucle, ou une mémorisation des résultats, le calcule en 50 étapes. La récursivité est élégante, pas toujours efficace ! (« Naïf » veut dire ici : écrit de la façon la plus directe, sans astuce d'optimisation.)</div>
<h3>3. La dichotomie récursive (jour 23, version récursive)</h3>
<p>La <strong>dichotomie</strong> (vue au jour 23) est la façon rapide de chercher une valeur dans un <strong>tableau trié</strong> (une liste de cases rangées dans l'ordre croissant) : on regarde la case du <strong>milieu</strong>, et selon qu'elle est trop grande ou trop petite, on élimine d'un coup toute une moitié. Un <strong>indice</strong> est le numéro d'une case (sa position dans le tableau) ; <code>t[milieu]</code> désigne la valeur rangée à la case numéro <code>milieu</code>. Voici la version récursive :</p>
<pre class="pseudo">FONCTION dicho(t, gauche, droite, cherche) : ENTIER   // cherche "cherche" dans le tableau t, entre les indices gauche et droite
DEBUT                                                  // début du corps
    SI gauche > droite ALORS                           // les bornes se sont croisées : la zone à fouiller est VIDE
        RETOURNER 0                                     // cas de base 1 : rien trouvé, on renvoie 0
    FINSI                                               // fin de ce test
    milieu ← (gauche + droite) DIV 2                    // indice du milieu ; DIV = division ENTIÈRE (on jette ce qui est après la virgule)
    SI t[milieu] = cherche ALORS                        // on compare la valeur du milieu à celle cherchée
        RETOURNER milieu                                // cas de base 2 : trouvé ! on renvoie sa position
    SINON SI t[milieu] < cherche ALORS                  // la valeur du milieu est trop PETITE : la cible est plus loin
        RETOURNER dicho(t, milieu + 1, droite, cherche) // appel récursif sur la MOITIÉ DROITE seulement
    SINON                                               // sinon la valeur du milieu est trop GRANDE : la cible est avant
        RETOURNER dicho(t, gauche, milieu - 1, cherche) // appel récursif sur la MOITIÉ GAUCHE seulement
    FINSI                                               // fin du choix
FIN                                                     // fin de la fonction</pre>
<p>La « zone qui rétrécit » du jour 23 devient un paramètre : chaque appel travaille sur une moitié. Boucle et récursion : deux costumes du même algorithme.</p>
<h3>4. Somme récursive d'un tableau</h3>
<p>On veut additionner toutes les valeurs d'un tableau. L'idée récursive : « la somme des n cases = la somme des (n−1) premières + la dernière ». On fait confiance à la fonction pour calculer la somme des (n−1) premières, et on ajoute juste la n-ième :</p>
<pre class="pseudo">FONCTION somme(t, n) : ENTIER              // additionne les n premières cases du tableau t, renvoie un ENTIER
DEBUT                                      // début du corps
    SI n = 0 ALORS                         // cas de base : il ne reste AUCUNE case à additionner
        RETOURNER 0                        // la somme d'un tableau vide vaut 0 (on renvoie 0 et on s'arrête)
    SINON                                  // cas récursif : il reste au moins une case
        RETOURNER somme(t, n - 1) + t[n]   // somme des (n-1) premières cases, PLUS la n-ième case t[n]
    FINSI                                  // fin du choix
FIN                                        // fin de la fonction</pre>
<h3>5. Où la récursivité est-elle REINE ?</h3>
<ul>
<li><strong>Structures emboîtées</strong> : dossiers contenant des dossiers, menus à sous-menus, commentaires à réponses… (une chose qui contient des choses du même genre).</li>
<li><strong>Diviser pour régner</strong> : une grande famille d'algorithmes qui coupent le problème en deux, résolvent chaque moitié à part (récursivement), puis recombinent. Exemples : la dichotomie, le <strong>tri fusion</strong> et le <strong>tri rapide</strong> (deux méthodes rapides pour ranger un tableau dans l'ordre).</li>
<li><strong>Exploration</strong> : labyrinthes, jeux (échecs), combinaisons — explorer un chemin, puis, depuis chaque nouvelle position, relancer la même exploration.</li>
</ul>
<div class="tip">Un dossier contient des fichiers ET des dossiers, qui contiennent des fichiers et des dossiers… Compter les fichiers d'un disque SANS récursivité est un cauchemar ; AVEC, c'est 5 lignes. La structure du problème est emboîtée (poupées russes) → la solution s'emboîte aussi.</div>`,

    reflexion: "Le troisième point de la démarche — vérifier qu'on se rapproche du point d'arrêt — est facile pour le PGCD une fois qu'on a vu la bonne chose, et impossible à voir si on ne l'a pas vue. Quelle grandeur diminue à chaque appel, et pourquoi est-on certain qu'elle finira par atteindre zéro ? Puis, sur le point d) : le calcul du dixième terme déclenche 177 appels pour un résultat de 55. Explique le mécanisme qui produit cette explosion, calcule ce que donnerait le quarantième terme en ordre de grandeur, et dis quelle modification simple — sans renoncer à la récursion — ramènerait le nombre d'appels à quelque chose de raisonnable.",
    indices: [
      "Deux fonctions récursives de formes très différentes. La première a un seul cas de base et un seul appel : elle descend en ligne droite. La seconde a deux cas de base et deux appels : elle descend en arbre, et c'est ce qui va faire toute la différence de coût.",

    solution: "/* ---------------------------------------------------------------\n   ETAPE 1 — l'expression commune (PGCD), donnee par l'enonce :\n     on remplace le couple par (second argument, reste de la division)\n   ETAPE 2 — le point d'arret :\n     PGCD(a, 0) = a\n   ETAPE 3 — le rapprochement :\n     le RESTE d'une division entiere est toujours strictement plus petit que\n     le diviseur. A chaque appel, le second argument devient donc plus petit\n     que le second argument precedent : une suite d'entiers positifs qui\n     decroit strictement atteint forcement zero.\n   --------------------------------------------------------------- */\n\nFONCTION pgcd(a : ENTIER, b : ENTIER) : ENTIER\nDEBUT\n    Ecrire(\"  appel avec \", a, \" et \", b)\n    SI b = 0 ALORS\n        RETOURNER a                        /* point d'arret */\n    SINON\n        RETOURNER pgcd(b, a MOD b)\n    FINSI\nFIN\n\nFONCTION terme(n : ENTIER) : ENTIER\n/* DEUX cas de base et DEUX appels recursifs : la descente n'est plus une\n   ligne droite mais un arbre, et c'est la que se cache l'explosion */\nDEBUT\n    SI n = 0 ALORS\n        RETOURNER 0\n    FINSI\n    SI n = 1 ALORS\n        RETOURNER 1\n    FINSI\n    RETOURNER terme(n - 1) + terme(n - 2)\nFIN\n\nFONCTION appels(n : ENTIER) : ENTIER\n/* on ne peut pas compter avec une variable locale — remise a zero a chaque\n   appel — ni avec un parametre, qui est une copie. On ecrit donc une\n   seconde fonction batie sur le meme squelette : elle compte les appels\n   au lieu de calculer le terme. */\nDEBUT\n    SI n = 0 OU n = 1 ALORS\n        RETOURNER 1                        /* cet appel-ci */\n    FINSI\n    RETOURNER 1 + appels(n - 1) + appels(n - 2)\nFIN\n\nAlgorithme CalculDesEcheances\nVar\n    a, b, n : ENTIER\nDebut\n    Ecrire(\"Deux entiers positifs non nuls ?\")\n    Lire(a)\n    Lire(b)\n    SI a < 1 OU b < 1 ALORS\n        Ecrire(\"Les deux entiers doivent etre strictement positifs\")\n    SINON\n        Ecrire(\"PGCD de \", a, \" et \", b, \" :\")\n        Ecrire(\"  resultat : \", pgcd(a, b))\n    FINSI\n\n    Ecrire(\"Rang du terme a projeter ?\")\n    Lire(n)\n    SI n < 0 ALORS\n        Ecrire(\"Le rang doit etre positif ou nul\")\n    SINON\n        Ecrire(\"Terme \", n, \" : \", terme(n))\n        Ecrire(\"Obtenu en \", appels(n), \" appels\")\n    FINSI\nFin",

      { ref: "d", texte: "Le calcul du dixième terme déclenche <strong>177 appels</strong> pour un résultat de 55. Le nombre surprend, et il doit surprendre : on s'attend à une dizaine d'appels, un par terme. L'explosion vient de ce que chaque appel en déclenche <em>deux</em>, et que ces deux-là recalculent des choses déjà calculées ailleurs. Le terme 8 est calculé une fois pour le terme 10, puis à nouveau pour le terme 9 — et à chaque niveau, la duplication se duplique." },
      { ref: "Réflexion", texte: "<strong>La grandeur qui diminue dans le PGCD</strong> est le <em>second argument</em>. Ce n'est pas évident, parce qu'à première vue les deux arguments changent de place et qu'on ne voit pas ce qui décroît. La clé est une propriété de la division entière : le reste de <code>a</code> par <code>b</code> est toujours strictement inférieur à <code>b</code>. Or le nouveau second argument est précisément ce reste, tandis que l'ancien second argument devient le premier. La suite des seconds arguments est donc une suite d'entiers positifs strictement décroissante — 462, puis 147, puis 21, puis 0 — et une telle suite ne peut pas être infinie : elle atteint zéro. C'est une preuve de terminaison en une phrase, et elle ne repose sur aucune propriété des nombres saisis. <strong>L'explosion de la seconde fonction.</strong> Le mécanisme est la <em>recomputation</em>. Pour obtenir le terme 10, il faut les termes 9 et 8. Mais le terme 9 réclame lui-même les termes 8 et 7 : le terme 8 est donc calculé deux fois, entièrement, sans qu'aucun des deux calculs ne sache que l'autre existe. Et le terme 7 est calculé trois fois, le terme 6 cinq fois, le terme 5 huit fois — on reconnaît la suite elle-même, ce qui n'est pas un hasard. Le nombre d'appels croît donc à peu près comme le résultat, c'est-à-dire en se multipliant par 1,6 environ à chaque rang. Pour le <strong>quarantième terme</strong>, dont la valeur dépasse cent millions, le nombre d'appels est du même ordre : plusieurs centaines de millions. Un calcul instantané au rang 10 devient une attente de plusieurs minutes au rang 40, et impossible au rang 60. C'est le premier exemple, dans ce cours, d'un algorithme correct et inutilisable — la distinction que le jour 28 va formaliser. <strong>La modification simple</strong> qui règle tout sans renoncer à la récursion consiste à <em>mémoriser</em> les termes déjà calculés dans un tableau, et à consulter ce tableau avant de se rappeler : si le terme <em>n</em> y figure déjà, on le rend sans descendre. Chaque terme n'est alors calculé qu'une fois, et le nombre d'appels retombe de 177 à une vingtaine pour le rang 10, et à quatre-vingts environ pour le rang 40. La récursion reste ; c'est la duplication qui disparaît. Cette technique porte un nom — la mémoïsation — et elle est la réponse standard à toutes les récursions en arbre qui repassent sur les mêmes sous-problèmes." }

    reflexion: "Cette procédure est celle où l'on renonce le plus complètement à comprendre <em>comment</em> ça marche pour ne comprendre que <em>pourquoi</em> c'est vrai. Essaie de dérouler à la main le cas de trois disques : combien de lignes cela te prend-il, et à quel moment perds-tu le fil ? Puis dis ce que tu peux affirmer avec certitude <em>sans</em> avoir déroulé, et sur quoi repose cette certitude. Enfin, en regardant les quatre jours de la série : le tournoi a été classé par tri, mis à jour par insertion, arbitré par récursion en arbre, et il s'achève sur un casse-tête. Lequel de ces quatre algorithmes refuserais-tu d'utiliser sur mille éléments, et pourquoi ?",

    solution: "/* ---------------------------------------------------------------\n   ETAPE 1 — l'expression commune :\n     deplacer n disques de DEPART vers ARRIVEE en s'aidant d'INTERMEDIAIRE\n     = deplacer n-1 disques de DEPART vers INTERMEDIAIRE en s'aidant d'ARRIVEE\n     + deplacer le grand disque de DEPART vers ARRIVEE\n     + deplacer n-1 disques d'INTERMEDIAIRE vers ARRIVEE en s'aidant de DEPART\n   ETAPE 2 — le point d'arret :\n     un seul disque : on le deplace directement.\n   ETAPE 3 — le rapprochement :\n     le nombre de disques diminue de 1 a chaque appel et part d'une valeur\n     strictement positive : on atteint forcement 1.\n   --------------------------------------------------------------- */\n\nPROCEDURE hanoi(n : ENTIER, depart : ENTIER, arrivee : ENTIER,\n                intermediaire : ENTIER)\nDEBUT\n    SI n = 1 ALORS\n        Ecrire(\"disque deplace du piquet \", depart, \" vers le piquet \", arrivee)\n    SINON\n        /* les ROLES des piquets permutent : ici l'arrivee sert d'intermediaire */\n        hanoi(n - 1, depart, intermediaire, arrivee)\n\n        /* le grand disque, coince entre les deux appels : sa position n'est\n           pas negociable — avant, il ecraserait les petits ; apres, il ne\n           pourrait plus etre pose */\n        Ecrire(\"disque deplace du piquet \", depart, \" vers le piquet \", arrivee)\n\n        /* et ici, c'est le depart qui sert d'intermediaire */\n        hanoi(n - 1, intermediaire, arrivee, depart)\n    FINSI\nFIN\n\nFONCTION nbDeplacements(n : ENTIER) : ENTIER\n/* une procedure ne rend rien : on ecrit une fonction separee, batie sur le\n   meme squelette, qui compte au lieu de deplacer */\nDEBUT\n    SI n = 1 ALORS\n        RETOURNER 1\n    SINON\n        RETOURNER nbDeplacements(n - 1) + 1 + nbDeplacements(n - 1)\n    FINSI\nFIN\n\nAlgorithme EpreuveDeHanoi\nVar\n    disques, i, k, compte, formule, p : ENTIER\nDebut\n    Ecrire(\"Nombre de disques de l'epreuve ?\")\n    Lire(disques)\n\n    SI disques < 1 ALORS\n        Ecrire(\"Il faut au moins un disque\")\n    SINON\n        hanoi(disques, 1, 3, 2)\n        Ecrire(nbDeplacements(disques), \" deplacements\")\n\n        /* c) concordance entre le comptage recursif et la formule 2^n - 1 */\n        Ecrire(\"n | comptage | formule\")\n        POUR i DE 1 A 5 FAIRE\n            compte <- nbDeplacements(i)\n            p <- 1\n            POUR k DE 1 A i FAIRE          /* un compteur A PART : reutiliser\n                                             disques ecraserait la saisie */\n                p <- p * 2\n            FINPOUR\n            formule <- p - 1\n            Ecrire(\"  \", i, \" |    \", compte, \"     |   \", formule)\n        FINPOUR\n    FINSI\nFin",
