  subtitle: "Fibonacci, dichotomie récursive, et l'art de penser « plus petit ».",
  theory: `
<h3>Rappel express : la récursivité</h3>
<p>Aujourd'hui on met en pratique la <strong>récursivité</strong> vue hier. La récursivité, c'est le fait pour une <strong>fonction</strong> (une mini-recette de calcul, qui reçoit des données et renvoie un résultat) de <strong>s'appeler elle-même</strong>. Imaginez deux miroirs face à face : chacun renvoie l'image de l'autre, encore et encore. Ou une <strong>poupée russe</strong> : quand vous l'ouvrez, vous trouvez à l'intérieur… une poupée russe identique mais plus petite, et ainsi de suite jusqu'à la plus petite qui, elle, ne s'ouvre plus. La récursivité fonctionne exactement comme cela.</p>
<p>Deux notions reviennent sans cesse. Définissons-les tout de suite :</p>
<ul>
<li>Le <strong>cas de base</strong> : la situation la plus simple, celle qu'on sait résoudre <em>directement</em>, sans se rappeler soi-même. C'est la plus petite poupée russe, celle qui ne s'ouvre plus : elle <strong>arrête</strong> la descente. Sans elle, la fonction s'appellerait à l'infini (comme les deux miroirs).</li>
<li>Le <strong>cas récursif</strong> : la situation générale. On la résout en se rappelant soi-même sur un problème <strong>un peu plus petit</strong>, qui se rapproche pas à pas du cas de base.</li>
</ul>
<p>Vocabulaire des fonctions que nous allons croiser : le mot-clé <code>FONCTION</code> ouvre la mini-recette et lui donne un nom ; entre parenthèses on trouve ses <strong>paramètres</strong> (les données qu'on lui fournit, comme les ingrédients qu'on passe à une recette) ; après les deux-points, le <strong>type</strong> du résultat renvoyé (<code>ENTIER</code> = un nombre entier, <code>CHAINE</code> = du texte) ; le mot-clé <code>RETOURNER</code> renvoie la réponse <em>et arrête aussitôt</em> la fonction. Un <strong>appel récursif</strong> est simplement le moment où la fonction s'utilise elle-même dans son propre corps.</p>
<h3>1. La méthode pour CONCEVOIR une récursion</h3>
<p>Voici la recette de pensée en trois questions. Ce n'est pas du code, mais une checklist mentale à suivre à chaque fois :</p>
<pre class="pseudo">1. Quel est le cas le plus simple ? (→ cas de base)
2. Si quelqu'un résolvait le problème en taille n-1 pour moi,
   comment m'en servirais-je pour la taille n ? (→ cas récursif)
3. Vérifier : chaque appel se rapproche-t-il du cas de base ?</pre>
<p>Le point 2 est le déclic : on fait CONFIANCE à l'appel récursif, sans dérouler mentalement tous les étages. C'est comme déléguer : vous demandez à un assistant de préparer la version « taille n−1 », vous supposez qu'il la fera correctement, et vous vous contentez d'ajouter la dernière touche pour passer à la « taille n ». Vous ne vérifiez pas comment l'assistant s'y prend — vous lui faites confiance.</p>
<h3>2. La suite de Fibonacci</h3>
<p>La <strong>suite de Fibonacci</strong> est une liste de nombres où chaque terme est la <strong>somme des deux précédents</strong> : 1, 1, 2, 3, 5, 8, 13, 21… (on la retrouve dans la reproduction des lapins, les spirales de tournesol, les pommes de pin…). Le mot <strong>terme</strong> désigne simplement un nombre de la liste, repéré par sa position (le 1<sup>er</sup> terme, le 5<sup>e</sup> terme, etc.). Cette définition « chaque terme dépend des deux d'avant » est <em>naturellement</em> récursive :</p>
<pre class="pseudo">FONCTION fib(n) : ENTIER                  // fonction "fib" : reçoit n (la position voulue), renvoie un ENTIER
DEBUT                                      // début du corps de la fonction
    SI n <= 2 ALORS                        // cas de base : les DEUX premières positions (1 et 2)
        RETOURNER 1                        // fib(1) = fib(2) = 1 : on renvoie 1 et la fonction s'arrête
    SINON                                  // cas récursif : n est plus grand que 2
        RETOURNER fib(n - 1) + fib(n - 2)  // somme des DEUX termes précédents : DEUX appels à fib elle-même
    FINSI                                  // fin du choix SI / SINON
FIN                                        // fin de la fonction</pre>
<div class="warn">Deux appels par étage = les appels se multiplient : fib(50) naïf ferait des milliards d'appels (fib(3) est recalculé des millions de fois). Une boucle, ou une mémorisation des résultats, le calcule en 50 étapes. La récursivité est élégante, pas toujours efficace ! (« Naïf » veut dire ici : écrit de la façon la plus directe, sans astuce d'optimisation.)</div>
<h3>3. La dichotomie récursive (jour 23, version récursive)</h3>
<p>La <strong>dichotomie</strong> (vue au jour 23) est la façon rapide de chercher une valeur dans un <strong>tableau trié</strong> (une liste de cases rangées dans l'ordre croissant) : on regarde la case du <strong>milieu</strong>, et selon qu'elle est trop grande ou trop petite, on élimine d'un coup toute une moitié. Un <strong>indice</strong> est le numéro d'une case (sa position dans le tableau) ; <code>t[milieu]</code> désigne la valeur rangée à la case numéro <code>milieu</code>. Voici la version récursive :</p>
<pre class="pseudo">FONCTION dicho(t, gauche, droite, cherche) : ENTIER   // cherche "cherche" dans le tableau t, entre les indices gauche et droite
DEBUT                                                  // début du corps
    SI gauche > droite ALORS                           // les bornes se sont croisées : la zone à fouiller est VIDE
        RETOURNER 0                                     // cas de base 1 : rien trouvé, on renvoie 0
    FINSI                                               // fin de ce test
    milieu ← (gauche + droite) DIV 2                    // indice du milieu ; DIV = division ENTIÈRE (on jette ce qui est après la virgule)
    SI t[milieu] = cherche ALORS                        // on compare la valeur du milieu à celle cherchée
        RETOURNER milieu                                // cas de base 2 : trouvé ! on renvoie sa position
    SINON SI t[milieu] < cherche ALORS                  // la valeur du milieu est trop PETITE : la cible est plus loin
        RETOURNER dicho(t, milieu + 1, droite, cherche) // appel récursif sur la MOITIÉ DROITE seulement
    SINON                                               // sinon la valeur du milieu est trop GRANDE : la cible est avant
        RETOURNER dicho(t, gauche, milieu - 1, cherche) // appel récursif sur la MOITIÉ GAUCHE seulement
    FINSI                                               // fin du choix
FIN                                                     // fin de la fonction</pre>
<p>La « zone qui rétrécit » du jour 23 devient un paramètre : chaque appel travaille sur une moitié. Boucle et récursion : deux costumes du même algorithme.</p>
<h3>4. Somme récursive d'un tableau</h3>
<p>On veut additionner toutes les valeurs d'un tableau. L'idée récursive : « la somme des n cases = la somme des (n−1) premières + la dernière ». On fait confiance à la fonction pour calculer la somme des (n−1) premières, et on ajoute juste la n-ième :</p>
<pre class="pseudo">FONCTION somme(t, n) : ENTIER              // additionne les n premières cases du tableau t, renvoie un ENTIER
DEBUT                                      // début du corps
    SI n = 0 ALORS                         // cas de base : il ne reste AUCUNE case à additionner
        RETOURNER 0                        // la somme d'un tableau vide vaut 0 (on renvoie 0 et on s'arrête)
    SINON                                  // cas récursif : il reste au moins une case
        RETOURNER somme(t, n - 1) + t[n]   // somme des (n-1) premières cases, PLUS la n-ième case t[n]
    FINSI                                  // fin du choix
FIN                                        // fin de la fonction</pre>
<h3>5. Où la récursivité est-elle REINE ?</h3>
<ul>
<li><strong>Structures emboîtées</strong> : dossiers contenant des dossiers, menus à sous-menus, commentaires à réponses… (une chose qui contient des choses du même genre).</li>
<li><strong>Diviser pour régner</strong> : une grande famille d'algorithmes qui coupent le problème en deux, résolvent chaque moitié à part (récursivement), puis recombinent. Exemples : la dichotomie, le <strong>tri fusion</strong> et le <strong>tri rapide</strong> (deux méthodes rapides pour ranger un tableau dans l'ordre).</li>
<li><strong>Exploration</strong> : labyrinthes, jeux (échecs), combinaisons — explorer un chemin, puis, depuis chaque nouvelle position, relancer la même exploration.</li>
</ul>
<div class="tip">Un dossier contient des fichiers ET des dossiers, qui contiennent des fichiers et des dossiers… Compter les fichiers d'un disque SANS récursivité est un cauchemar ; AVEC, c'est 5 lignes. La structure du problème est emboîtée (poupées russes) → la solution s'emboîte aussi.</div>`,

<pre class="pseudo">FONCTION frise(n) : CHAINE                 // fonction "frise" : reçoit n, renvoie une CHAINE (du texte)
