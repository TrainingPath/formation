<script>
var DAY = {
  num: 17,
  title: "Minimum, maximum, moyenne",
  subtitle: "Le trio statistique : trois algorithmes à connaître par cœur.",
  theory: `
<h3>1. Trouver le maximum d'un tableau</h3>
<p>Idée : on garde en mémoire « le plus grand vu jusqu'ici » et on le met à jour à chaque case :</p>
<pre class="pseudo">max ← t[1]                    // le champion provisoire : la 1ʳᵉ case
POUR i DE 2 A n FAIRE         // on part de 2 (la case 1 est déjà prise)
    SI t[i] > max ALORS
        max ← t[i]            // nouveau champion !
    FINSI
FINPOUR</pre>
<div class="warn">Initialiser <code>max ← 0</code> est un BUG : si toutes les valeurs sont négatives (t = [-5, -2, -9]), le résultat serait 0, qui n'est même pas dans le tableau ! On initialise toujours avec <strong>t[1]</strong>.</div>
<h3>2. Le minimum : même squelette, comparaison inversée</h3>
<pre class="pseudo">min ← t[1]
POUR i DE 2 A n FAIRE
    SI t[i] < min ALORS
        min ← t[i]
    FINSI
FINPOUR</pre>
<h3>3. Retenir la POSITION du max</h3>
<p>Souvent on veut savoir OÙ est le max (quel élève a la meilleure note), pas seulement sa valeur :</p>
<pre class="pseudo">posMax ← 1
POUR i DE 2 A n FAIRE
    SI t[i] > t[posMax] ALORS
        posMax ← i            // on retient l'INDICE
    FINSI
FINPOUR
// valeur du max : t[posMax]</pre>
<h3>4. La moyenne (déjà vue, on la fige)</h3>
<pre class="pseudo">somme ← 0
POUR i DE 1 A n FAIRE
    somme ← somme + t[i]
FINPOUR
moyenne ← somme / n</pre>
<h3>5. Tout calculer en UN SEUL parcours</h3>
<pre class="pseudo">max ← t[1] ; min ← t[1] ; somme ← t[1]
POUR i DE 2 A n FAIRE
    SI t[i] > max ALORS max ← t[i] FINSI
    SI t[i] < min ALORS min ← t[i] FINSI
    somme ← somme + t[i]
FINPOUR
moyenne ← somme / n
etendue ← max - min           // bonus : l'écart total</pre>
<div class="tip">Un bon algorithmicien évite les parcours inutiles : ici, un seul passage suffit pour 4 statistiques.</div>`,
  exercises: [
    { type: "qcm", q: "Dans l'algorithme du maximum, à quoi sert la variable <code>max</code> pendant la boucle ?", opts: ["À stocker la dernière valeur", "À mémoriser le plus grand élément vu JUSQU'ICI", "À compter les cases", "À stocker l'indice"], a: 1, exp: "C'est un « champion provisoire » défié par chaque nouvelle case." },
    { type: "qcm", q: "Pourquoi initialiser <code>max ← t[1]</code> plutôt que <code>max ← 0</code> ?", opts: ["C'est plus rapide", "Avec un tableau tout négatif, 0 gagnerait à tort", "t[1] est toujours le max", "Aucune différence"], a: 1, exp: "Le champion initial doit être une valeur DU tableau." },
    { type: "input", q: "t = [ 7 ][ 12 ][ 5 ][ 9 ]. Que vaut <code>max</code> à la fin ?", a: "12", ph: "nombre", exp: "12 détrône 7 au 2ᵉ tour et reste champion." },
    { type: "input", q: "t = [ 7 ][ 12 ][ 5 ][ 9 ]. Que vaut <code>min</code> ?", a: "5", ph: "nombre", exp: "5 est le plus petit." },

    { type: "qcm", q: "Combien de fois <code>max</code> change-t-il pour t = [ 3 ][ 5 ][ 4 ][ 8 ][ 2 ] ?", opts: ["1", "2", "3", "4"], a: 1, exp: "max part à 3, passe à 5, puis à 8 : deux mises à jour." },
    { type: "qcm", q: "Pour le MINIMUM, quelle comparaison dans le SI ?", opts: ["t[i] > min", "t[i] < min", "t[i] = min", "t[i] >= max"], a: 1, exp: "On remplace quand on voit PLUS PETIT." },
    { type: "input", q: "t = [ 14 ][ 9 ][ 17 ][ 11 ]. Que vaut <code>posMax</code> (l'indice du max) ?", a: "3", ph: "nombre", exp: "Le max 17 est en case 3 : on retient 3, pas 17." },
    { type: "qcm", q: "Différence entre <code>max ← t[i]</code> et <code>posMax ← i</code> ?", opts: ["Aucune", "Le premier retient la VALEUR, le second la POSITION", "Le second est faux", "Le premier retient la position"], a: 1, exp: "Valeur = « combien », position = « où ». On choisit selon la question posée." },

    { type: "qcm", q: "t = [ 9 ][ 9 ][ 9 ]. Avec <code>SI t[i] > max</code>, combien de mises à jour de max pendant la boucle ?", opts: ["0", "2", "3", "1"], a: 0, exp: "9 > 9 est FAUX : jamais de remplacement. Le > strict garde la PREMIÈRE occurrence." },
    { type: "qcm", q: "Pour trouver max, min ET moyenne, combien de parcours du tableau suffisent ?", opts: ["3", "2", "1", "n"], a: 2, exp: "Un seul passage peut entretenir plusieurs variables à la fois (théorie §5)." },
    { type: "qcm", q: "« Le deuxième plus grand élément » : quelle stratégie en un parcours ?", opts: ["Impossible en un parcours", "Garder deux champions : max et second, mis à jour ensemble", "Trier tout le tableau d'abord, c'est la seule option", "Prendre t[2]"], a: 1, exp: "Quand t[i] bat max : second ← max, max ← t[i] ; sinon s'il bat second seul, second ← t[i]." }
  ],
  final: {
    title: "Exercice final — Le podium du contrôle",
    intro: `<p>Notes du contrôle : <code>notes = [ 11 ][ 16 ][ 8 ][ 16 ][ 13 ][ 6 ]</code> (élèves 1 à 6). L'algorithme du prof calcule en un seul parcours : max, min, somme, posMax.</p>
<pre class="pseudo">max ← notes[1] ; min ← notes[1]
somme ← notes[1] ; posMax ← 1
POUR i DE 2 A 6 FAIRE
    SI notes[i] > max ALORS
        max ← notes[i]
        posMax ← i
    FINSI
    SI notes[i] < min ALORS min ← notes[i] FINSI
    somme ← somme + notes[i]
FINPOUR
moyenne ← somme / 6</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>max</code> ?", a: "16", ph: "nombre", exp: "Meilleure note : 16." },
      { type: "input", q: "Que vaut <code>posMax</code> ?", a: "2", ph: "nombre", exp: "16 apparaît en cases 2 et 4, mais le > STRICT garde la première : élève 2." },
      { type: "input", q: "Que vaut <code>min</code> ?", a: "6", ph: "nombre", exp: "La note la plus basse : 6 (élève 6)." },
      { type: "input", q: "Que vaut <code>moyenne</code> ?", a: ["11.67", "11,67", "11.66", "70/6"], ph: "nombre (2 décimales)", exp: "somme = 70, 70/6 ≈ 11,67." },
      { type: "qcm", q: "Avec <code>SI notes[i] >= max</code> (au lieu de >), que vaudrait posMax ?", opts: ["2", "4 : l'égalité provoque un remplacement, on garde la DERNIÈRE occurrence", "1", "6"], a: 1, exp: "Un seul signe (> vs >=) change quel ex æquo gagne. Les détails font les algorithmes." }
    ],
    solution: `<p>Trace du parcours unique :</p>
<pre class="pseudo">i   notes[i]   max   posMax   min   somme
-   11         11    1        11    11
2   16         16    2        11    27
3   8          16    2        8     35
4   16         16    2        8     51    (16 > 16 faux)
5   13         16    2        8     64
6   6          16    2        6     70
→ max=16 (élève 2), min=6, moyenne=70/6 ≈ 11,67</pre>
<p>Max, min, moyenne : à savoir écrire les yeux fermés. Ils sont la base de tout traitement de données.</p>`
  }
};
</script>

<script>
var ENTRAINEMENT = {

  { num: "17.1", titre: "Le relevé de la classe", niveau: 1, domaine: "école et notes",
    enonce: "Un professeur saisit les notes sur 20 de sa classe — l'effectif est saisi d'abord, les notes ensuite. L'algorithme doit produire en <strong>un seul parcours</strong> les quatre statistiques du relevé : la note la plus haute, la note la plus basse, la moyenne de la classe arrondie au centième, et le nombre d'élèves ayant la moyenne. Il annonce en outre le rang de l'élève ayant obtenu la meilleure note — son numéro dans l'ordre de saisie, pas sa note.",
    principe: "Le champion provisoire d'une recherche d'extremum se prend sur la <strong>première case</strong>, jamais sur une valeur inventée. Partir de zéro pour un maximum est un défaut classique : sur un relevé où toutes les valeurs seraient négatives, le résultat serait zéro, une valeur que le tableau ne contient pas. La première case, elle, est toujours une valeur réellement observée.",
    remarque: "Quatre statistiques ne demandent pas quatre parcours. Chacune se met à jour indépendamment des autres au moment où la case passe, et les mêler dans une seule boucle ne les rend pas plus difficiles à écrire — seulement plus difficiles à écrire <em>mal</em>, car on ne peut plus se tromper de borne d'une boucle à l'autre.",
    indices: [
      "Cinq quantités survivent d'une case à l'autre, et elles se répartissent en trois familles bien distinctes. Deux se comparent, une s'additionne, une compte, et la dernière n'est que le compagnon d'une des deux premières. Fais l'inventaire avant d'écrire.",

    ],
    solution: "Algorithme ReleveDeLaClasse\nVar\n    note : TABLEAU[1..40] DE REELS\n    n, i, admis, rangMax : ENTIER\n    max, min, somme, moyenne : REEL\nDebut\n    Ecrire(\"Effectif de la classe ?\")\n    Lire(n)\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"Note de l'eleve \", i, \" ?\")\n        Lire(note[i])\n    FINPOUR\n\n    /* les champions provisoires se prennent sur la PREMIERE case, jamais sur\n       une valeur inventee : ainsi le resultat est toujours une note reellement\n       obtenue, y compris si toutes les notes valaient zero */\n    max <- note[1]\n    min <- note[1]\n    somme <- note[1]\n    rangMax <- 1\n\n    /* le premier eleve doit etre compte lui aussi : la boucle demarre a 2,\n       donc son cas se regle AVANT, a la main */\n    SI note[1] >= 10 ALORS\n        admis <- 1\n    SINON\n        admis <- 0\n    FINSI\n\n    /* UN seul parcours pour quatre statistiques, a partir de la case 2 */\n    POUR i DE 2 A n FAIRE\n        SI note[i] > max ALORS\n            max <- note[i]\n            rangMax <- i          /* le RANG, pas la note */\n        FINSI\n        SI note[i] < min ALORS\n            min <- note[i]\n        FINSI\n        somme <- somme + note[i]\n        SI note[i] >= 10 ALORS    /* seuil FIXE : le comptage peut se faire ici */\n            admis <- admis + 1\n        FINSI\n    FINPOUR\n\n    moyenne <- somme / n\n\n    Ecrire(\"Meilleure note : \", max, \" (eleve \", rangMax, \")\")\n    Ecrire(\"Note la plus basse : \", min)\n    Ecrire(\"Moyenne de la classe : \", Arrondi(moyenne, 2))\n    Ecrire(admis, \" eleve(s) ont la moyenne sur \", n)\nFin",
    pourquoi: "Le cas du premier élève est réglé à la main, avant la boucle, pour les cinq quantités. C'est le prix à payer pour démarrer le parcours à la deuxième case — et il est facile de n'en payer qu'une partie : initialiser correctement les extrema et oublier que le premier élève doit aussi être compté et additionné. L'oubli sur la somme se voit peu, l'oubli sur le compteur pas du tout. Une alternative existe : partir de la case 1 avec des extrema pris sur la case 1 ; la comparaison de la case 1 avec elle-même est inutile mais inoffensive, et tout le reste se traite uniformément.",

  { num: "17.2", titre: "La dérive de l'horloge", niveau: 2, domaine: "horlogerie",
    enonce: "Un horloger contrôle une pendule ancienne pendant dix jours. Chaque matin il note l'écart entre l'heure affichée et l'heure exacte, en secondes : un écart <strong>négatif</strong> signifie que la pendule retarde, un écart positif qu'elle avance. Sur cette pendule, tous les écarts relevés sont négatifs — elle retarde chaque jour, plus ou moins. L'algorithme doit annoncer le plus petit retard et le jour où il s'est produit, le plus grand retard et son jour, la dérive moyenne, et l'amplitude — c'est-à-dire l'écart entre le meilleur et le pire jour.",
    principe: "Les relevés sont : −3 · −7 · −2 · −11 · −5 · −1 · −9 · −4 · −8 · −6 secondes. Le maximum vaut donc <strong>−1</strong>, atteint le sixième jour : c'est le jour où la pendule s'est le mieux comportée. Le minimum vaut <strong>−11</strong>, le quatrième jour. La dérive moyenne est de −5,6 secondes et l'amplitude de 10 secondes. Aucune de ces valeurs n'est positive, et c'est tout l'intérêt de l'exercice.",

      { ref: "a", texte: "Écris la recherche du maximum et du minimum avec leurs jours respectifs, en un seul parcours." },

      { ref: "d", texte: "L'horloger veut savoir combien de jours la pendule a fait <em>mieux</em> que sa moyenne. Ajoute ce comptage et dis pourquoi il ne peut pas tenir dans le parcours du point a)." }

    reflexion: "Le point c) montre une initialisation qui produit une valeur jamais observée. Formule la règle en une phrase, puis explique pourquoi l'erreur est plus dangereuse sur un maximum que sur un minimum <em>dans ce cas précis</em> — et comment la situation s'inverserait sur des relevés tous positifs. Puis : « le plus grand retard » et « le maximum » désignent ici deux jours différents. Lequel est lequel, et quelle leçon en tirer sur la traduction d'un énoncé en langage courant vers une comparaison ?",
    indices: [
      "Deux extrema, deux compagnons, un accumulateur, et plus tard un compteur qui ne peut pas tenir avec les autres. Le vrai sujet de l'exercice n'est aucune de ces quantités : c'est la valeur qu'on leur donne avant de commencer.",
      "Le plan : remplir le tableau. Prendre les deux extrema et leurs jours sur le premier relevé, l'accumulateur également. Parcourir à partir du deuxième en mettant tout à jour. Après la boucle, diviser pour la moyenne, soustraire pour l'amplitude, puis reparcourir une seconde fois pour le comptage du point d).",
      "En pseudocode : <code>max ← ecart[1] ; jourMax ← 1 ; min ← ecart[1] ; jourMin ← 1 ; somme ← ecart[1]</code> · <code>POUR j DE 2 A 10 FAIRE</code> · deux comparaisons avec mise à jour du couple, et un cumul · <code>FINPOUR</code> · <code>moyenne ← somme / 10</code> · <code>amplitude ← max − min</code>.",
      "Le point délicat est la traduction de l'énoncé. « Le plus grand retard » n'est pas le maximum : un retard de 11 secondes est plus grand qu'un retard de 1 seconde, mais −11 est plus <em>petit</em> que −1. Le langage courant parle de l'intensité du retard, la comparaison porte sur la valeur signée. Confondre les deux inverse les deux réponses sans qu'aucun calcul ne soit faux.",
      "Ta copie ressemble à ceci : <br><code>max ← ecart[1]</code> · <code>jourMax ← 1</code> · <code>min ← ecart[1]</code> · <code>jourMin ← 1</code><br><code>POUR j DE 2 A 10 FAIRE</code> · <code>SI … ALORS … ; … FINSI</code> ×2 · <code>FINPOUR</code><br><code>amplitude ← …</code><br>puis un SECOND parcours pour le comptage."
    ],
    solution: "Algorithme DeriveDeLHorloge\nConst\n    N = 10\nVar\n    ecart : TABLEAU[1..10] D'ENTIERS\n    j, jourMax, jourMin, meilleurs : ENTIER\n    max, min, somme, amplitude : ENTIER\n    moyenne : REEL\nDebut\n    POUR j DE 1 A N FAIRE\n        Ecrire(\"Ecart du jour \", j, \" (secondes, negatif = retard) ?\")\n        Lire(ecart[j])\n    FINPOUR\n\n    /* TOUT se prend sur la premiere case. C'est la seule initialisation qui\n       ne suppose rien : ici, aucun ecart n'est positif, et partir de 0\n       donnerait un maximum de 0 — un jour ou la pendule aurait ete juste,\n       ce qui n'est jamais arrive. */\n    max <- ecart[1]\n    jourMax <- 1\n    min <- ecart[1]\n    jourMin <- 1\n    somme <- ecart[1]\n\n    POUR j DE 2 A N FAIRE\n        SI ecart[j] > max ALORS\n            max <- ecart[j]\n            jourMax <- j\n        FINSI\n        SI ecart[j] < min ALORS\n            min <- ecart[j]\n            jourMin <- j\n        FINSI\n        somme <- somme + ecart[j]\n    FINPOUR\n\n    moyenne <- somme / N\n    amplitude <- max - min      /* deduite, pas recalculee */\n\n    /* attention au vocabulaire : le MAXIMUM (-1) est le plus PETIT retard,\n       le MINIMUM (-11) est le plus GRAND retard. La langue et la comparaison\n       vont en sens inverse sur des valeurs negatives. */\n    Ecrire(\"Plus petit retard : \", -max, \" s, le jour \", jourMax)\n    Ecrire(\"Plus grand retard : \", -min, \" s, le jour \", jourMin)\n    Ecrire(\"Derive moyenne : \", moyenne, \" s par jour\")\n    Ecrire(\"Amplitude : \", amplitude, \" s\")\n\n    /* d) SECOND parcours obligatoire : la moyenne n'existe qu'apres le premier */\n    meilleurs <- 0\n    POUR j DE 1 A N FAIRE\n        SI ecart[j] > moyenne ALORS\n            meilleurs <- meilleurs + 1\n        FINSI\n    FINPOUR\n    Ecrire(meilleurs, \" jour(s) au-dessus de la derive moyenne\")\nFin",
    reponses: [
      { ref: "c", texte: "Avec les deux extrema initialisés à zéro, voici ce qu'afficherait la version fautive. Le <strong>maximum resterait 0</strong> : aucun écart n'étant positif, la comparaison <code>ecart[j] &gt; max</code> ne réussit jamais, et le jour associé resterait celui de l'initialisation — le jour 1, ou le jour 0 selon ce qu'on y a mis. L'algorithme annoncerait donc que la pendule a été parfaitement juste un jour, ce qui n'est jamais arrivé. Le <strong>minimum, lui, serait correct</strong> : −11 est plus petit que 0, donc la comparaison réussit dès la première case et le zéro initial est chassé. La <strong>moyenne serait juste</strong>, puisque l'accumulateur n'est pas concerné. Mais l'<strong>amplitude serait fausse</strong> : <code>0 − (−11) = 11</code> au lieu de 10, une erreur d'une seconde, parfaitement plausible, qu'aucun contrôle de vraisemblance ne rattraperait." },

      { ref: "Réflexion", texte: "<strong>La règle</strong> : un extremum s'initialise toujours sur une valeur réellement présente dans les données — la première case — jamais sur une constante choisie parce qu'elle « paraît petite » ou « paraît grande ». Toute constante repose sur une hypothèse concernant le domaine des valeurs, et cette hypothèse finit toujours par être fausse quelque part. <strong>Pourquoi le maximum est plus dangereux ici :</strong> parce que zéro est au-dessus de <em>toutes</em> les données. Un maximum initialisé à zéro n'est jamais mis à jour, donc il conserve une valeur fabriquée du début à la fin, et le jour associé ne désigne rien. Un minimum initialisé à zéro, lui, est immédiatement chassé par le premier écart négatif : l'erreur s'autocorrige à la première case. Sur des relevés <strong>tous positifs</strong>, la situation s'inverse exactement : le maximum s'autocorrigerait au premier tour, tandis que le minimum resterait bloqué à zéro et annoncerait une journée sans erreur qui n'a pas eu lieu. C'est pourquoi la règle ne peut pas se formuler comme « initialiser le max très bas et le min très haut » — cela ne fait que déplacer l'hypothèse. La seule formulation robuste est celle de la première case. <strong>Le maximum et le plus grand retard</strong> désignent bien deux jours différents : le maximum est le jour 6 avec −1 seconde, c'est-à-dire le jour où la pendule s'est le mieux comportée ; le plus grand retard est le jour 4 avec −11 secondes, le pire. La leçon est qu'un énoncé en langage courant ne se traduit pas mot à mot en comparaison. « Le plus grand » du français porte ici sur l'<em>intensité</em> d'un défaut, tandis que le symbole porte sur la valeur signée, et les deux vont en sens inverse dès que les nombres sont négatifs. Le réflexe qui sauve : avant d'écrire une comparaison, se donner deux valeurs concrètes de l'énoncé et vérifier laquelle doit gagner. Ici, −1 et −11 suffisent à trancher en trois secondes." }

    pourquoi: "L'amplitude est obtenue par soustraction des deux extrema plutôt que par un parcours dédié. Ce n'est pas seulement plus court : c'est ce qui garantit qu'elle sera <em>cohérente</em> avec les deux valeurs affichées juste au-dessus. Un troisième parcours pourrait, à la faveur d'une borne mal écrite, produire une amplitude qui ne correspond pas aux extrema annoncés — trois nombres dont deux se contredisent, et rien pour dire lequel croire.",

    reflexion: "Trois des quatre chiffres demandés se calculent au vol, le quatrième non. Formule le critère qui les sépare — il tient en une phrase et vaut pour tout algorithme statistique. Puis : la collectivité demande « le nombre de membres qui s'écartent de plus de dix ans de la moyenne ». Un club de quinze quinquagénaires et un club mêlant quinze enfants et quinze retraités peuvent-ils obtenir le même chiffre ? Que faudrait-il ajouter pour que l'indicateur dise vraiment ce que la collectivité veut savoir ?",
    principe: "Un seuil <strong>fixe</strong> — dix-huit ans — est connu avant même de lire la première donnée : le comptage correspondant tient dans le parcours de saisie. Un seuil <strong>calculé à partir de l'ensemble</strong> — la moyenne — n'existe qu'une fois toutes les données vues : le comptage correspondant exige un second passage. C'est la seule distinction qui compte, et elle ne dépend pas de la difficulté apparente de la question.",
    indices: [

    solution: "Algorithme DossierDeSubvention\nConst\n    N = 15\n    MAJORITE = 18\n    ECART_MIXITE = 10\nVar\n    age : TABLEAU[1..15] D'ENTIERS\n    i, doyen, benjamin, posDoyen, posBenjamin : ENTIER\n    somme, mineurs, ecartes, ecart, amplitude : ENTIER\n    moyenne : REEL\nDebut\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Age de l'adherent \", i, \" ?\")\n        Lire(age[i])\n    FINPOUR\n\n    /* a) tout se prend sur la premiere case */\n    doyen <- age[1]\n    benjamin <- age[1]\n    posDoyen <- 1\n    posBenjamin <- 1\n    somme <- age[1]\n    SI age[1] < MAJORITE ALORS\n        mineurs <- 1\n    SINON\n        mineurs <- 0\n    FINSI\n\n    POUR i DE 2 A N FAIRE\n        SI age[i] > doyen ALORS\n            doyen <- age[i]\n            posDoyen <- i\n        FINSI\n        SI age[i] < benjamin ALORS\n            benjamin <- age[i]\n            posBenjamin <- i\n        FINSI\n        somme <- somme + age[i]\n        /* seuil FIXE : connu avant meme la premiere lecture */\n        SI age[i] < MAJORITE ALORS\n            mineurs <- mineurs + 1\n        FINSI\n    FINPOUR\n\n    moyenne <- somme / N\n    amplitude <- doyen - benjamin\n\n    /* b) seuil CALCULE : la moyenne n'existe qu'ici. Second parcours\n          obligatoire — au 3e membre, je ne sais pas encore ce qu'elle vaudra. */\n    ecartes <- 0\n    POUR i DE 1 A N FAIRE\n        ecart <- age[i] - moyenne\n        SI ecart < 0 ALORS\n            ecart <- -ecart        /* \"dans un sens comme dans l'autre\" */\n        FINSI\n        SI ecart > ECART_MIXITE ALORS\n            ecartes <- ecartes + 1\n        FINSI\n    FINPOUR\n\n    Ecrire(\"Doyen : \", doyen, \" ans (fiche \", posDoyen, \")\")\n    Ecrire(\"Benjamin : \", benjamin, \" ans (fiche \", posBenjamin, \")\")\n    Ecrire(\"Moyenne d'age : \", Arrondi(moyenne, 1), \" ans\")\n    Ecrire(mineurs, \" membre(s) de moins de \", MAJORITE, \" ans\")\n\n    /* c) le club homogene : amplitude nulle, aucun membre ecarte */\n    SI amplitude = 0 ALORS\n        Ecrire(\"Tous les membres ont le meme age : aucune mixite generationnelle\")\n    SINON\n        Ecrire(\"Amplitude des ages : \", amplitude, \" ans\")\n        Ecrire(ecartes, \" membre(s) a plus de \", ECART_MIXITE, \" ans de la moyenne\")\n    FINSI\nFin",

      { ref: "c", texte: "Sur un club dont tous les membres auraient le même âge, l'amplitude vaut <strong>zéro</strong> — doyen et benjamin sont la même valeur — et le nombre de membres écartés de la moyenne vaut <strong>zéro</strong> également, puisque la moyenne est exactement cet âge commun et que tous les écarts sont nuls. Les deux chiffres sont corrects, et pourtant les afficher tels quels serait trompeur : un zéro dans la case « mixité » se lit comme une donnée manquante autant que comme une absence réelle. D'où le message explicite, qui dit la chose au lieu de la laisser deviner." },
      { ref: "Réflexion", texte: "<strong>Le critère</strong> tient en une phrase : une statistique se calcule au vol si son seuil ou sa référence est connu <em>avant</em> la lecture des données, et exige un second passage si elle se réfère à une grandeur tirée de l'ensemble. Peu importe que la question paraisse simple ou compliquée : compter les mineurs et compter ceux qui s'écartent de la moyenne sont deux comptages de difficulté identique, et l'un tient dans le premier parcours quand l'autre ne le peut pas. Le seul critère est la direction de la dépendance — vers le passé, ou vers l'avenir. <strong>Les deux clubs peuvent obtenir le même chiffre, et c'est le défaut de l'indicateur.</strong> Quinze quinquagénaires tous entre 48 et 52 ans donnent zéro membre écarté, ce qui est fidèle. Mais un club mêlant quinze enfants de 10 ans et quinze retraités de 70 ans a une moyenne de 40 ans dont <em>tout le monde</em> s'écarte de trente ans : trente membres écartés sur trente, soit le maximum possible. Jusqu'ici l'indicateur fonctionne. Le problème est ailleurs : un club de quinze membres régulièrement répartis de 10 à 70 ans obtiendrait un chiffre intermédiaire, alors qu'il est le plus mixte des trois. L'indicateur confond donc « générations éloignées les unes des autres » et « générations diverses », qui ne sont pas la même chose — il récompense la polarisation autant que la diversité. Pour dire ce que la collectivité veut vraiment savoir, il faudrait compter les <strong>tranches d'âge représentées</strong> : découper de 0 à 100 ans en tranches de dix, compter combien sont occupées par au moins un membre. Le club polarisé en occuperait deux, le club réparti en occuperait sept, et le club homogène une seule. C'est un comptage par intervalles — exactement ce que permettra un tableau indexé par tranche, et l'on n'est plus très loin de la grille du jour 18." }

    solution: "ALGORITHME Statistiques                  // nom de l'algorithme\nVARIABLES T : TABLEAU[1..10] D'ENTIERS   // le tableau déjà rempli\n          i, min, max, somme : ENTIER    // i = indice, plus les 3 valeurs suivies\n          moyenne : REEL                 // réelle, car la division ne tombe pas juste\nDEBUT                                    // début des instructions\n    min ← T[1]                           // le 1er élément sert de point de départ (JAMAIS 0)\n    max ← T[1]                           // idem pour le maximum\n    somme ← T[1]                         // la somme inclut déjà T[1]\n    POUR i DE 2 A 10 FAIRE               // on parcourt le RESTE du tableau\n        SI T[i] < min ALORS              // élément plus petit que le min actuel ?\n            min ← T[i]                   // oui → il devient le nouveau min\n        FINSI                            // fin du test min\n        SI T[i] > max ALORS              // élément plus grand que le max actuel ?\n            max ← T[i]                   // oui → il devient le nouveau max\n        FINSI                            // fin du test max\n        somme ← somme + T[i]             // accumulation pour la moyenne\n    FINPOUR                              // fin du parcours\n    moyenne ← somme / 10                 // moyenne = total divisé par le nombre d'éléments\n    Écrire(\"Min : \", min)                // affiche le minimum\n    Écrire(\"Max : \", max)                // affiche le maximum\n    Écrire(\"Moyenne : \", moyenne)        // affiche la moyenne\nFIN                                      // fin de l'algorithme",
    note: "Initialiser min à 0 est LE bug classique : si toutes les valeurs sont positives, min resterait 0." }
