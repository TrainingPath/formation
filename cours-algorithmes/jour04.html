  title: "Opérateurs et expressions",
  subtitle: "Calculer, comparer : les briques de tout traitement.",
  theory: `
<h3>1. Les opérateurs arithmétiques</h3>
<p>Un <strong>opérateur</strong> est un symbole qui demande d'effectuer une opération (un calcul) sur des valeurs. Une <strong>expression</strong>, elle, est une combinaison de valeurs, de variables et d'opérateurs qui, une fois calculée (on dit « évaluée »), produit une seule valeur. Par exemple <code>5 + 3</code> est une expression qui vaut 8. Voici les opérateurs qui font des calculs sur les nombres :</p>
<pre class="pseudo">+   addition          5 + 3   → 8     // ajoute les deux nombres
-   soustraction      5 - 3   → 2     // retire le second au premier
*   multiplication    5 * 3   → 15    // multiplie les deux nombres
/   division réelle   5 / 2   → 2.5   // divise en gardant la virgule (résultat REEL)
DIV division entière  5 DIV 2 → 2     // quotient entier (combien de fois 2 rentre dans 5)
MOD reste             5 MOD 2 → 1     // reste de la division (ce qui reste : 5-2×2=1)</pre>
<h3>2. La priorité des opérations</h3>
<p>Quand une expression contient plusieurs opérateurs, l'ordre du calcul suit des règles, exactement comme en maths. La <strong>priorité</strong> décide qui est calculé en premier : d'abord ce qui est entre <strong>parenthèses</strong>, puis <strong>* / DIV MOD</strong>, puis enfin <strong>+ -</strong>. À priorité égale, on calcule de gauche à droite.</p>
<pre class="pseudo">2 + 3 * 4      → 14   (pas 20 !)   // 3*4=12 d'abord, puis 2+12
(2 + 3) * 4    → 20                // la parenthèse force 2+3=5 d'abord, puis 5*4
10 - 4 - 2     → 4    (de gauche à droite)   // (10-4)=6 puis 6-2=4</pre>
<div class="tip">Dans le doute, mets des parenthèses : elles ne coûtent rien et rendent l'intention claire.</div>
<h3>3. Les opérateurs de comparaison</h3>
<p>Comparer, c'est confronter deux valeurs pour savoir laquelle est plus grande, ou si elles sont égales. Ces opérateurs comparent deux valeurs et produisent un <strong>BOOLEEN</strong> (VRAI ou FAUX, le type des réponses oui/non vu au jour 3) :</p>
<pre class="pseudo">=    égal à              5 = 5    → VRAI   // les deux valeurs sont-elles identiques ?
≠    différent de        5 ≠ 3    → VRAI   (aussi noté &lt;&gt;)   // sont-elles différentes ?
&lt;    strictement plus petit   // 3 &lt; 5 → VRAI ; 5 &lt; 5 → FAUX
&gt;    strictement plus grand   // 5 &gt; 3 → VRAI ; 5 &gt; 5 → FAUX
&lt;=   plus petit ou égal       // 5 &lt;= 5 → VRAI (le "ou égal" accepte l'égalité)
&gt;=   plus grand ou égal       // 5 &gt;= 3 → VRAI</pre>
<div class="warn">Ne confonds pas <code>←</code> (affectation : on RANGE une valeur) et <code>=</code> (comparaison : on POSE une question). <code>x ← 5</code> range 5 dans x ; <code>x = 5</code> demande « x vaut-il 5 ? » et répond VRAI ou FAUX.</div>
<h3>4. Construire des expressions utiles</h3>
<p>On combine variables et opérateurs pour calculer des choses concrètes. Chaque ligne ci-dessous range dans une variable le résultat d'une expression :</p>
<pre class="pseudo">moyenne ← (note1 + note2) / 2       // additionne les 2 notes PUIS divise par 2
ttc ← prixHT * 1.21              // TVA de 21 %   // multiplier par 1.21 ajoute 21 %
resteAPayer ← total - dejaPaye      // ce qu'il reste à régler
dernierChiffre ← n MOD 10           // MOD 10 isole le dernier chiffre de n
estPair ← (n MOD 2 = 0)          // booléen   // VRAI si le reste par 2 est nul</pre>
<h3>5. Évaluer une expression pas à pas</h3>
<p><strong>Évaluer</strong> une expression, c'est la calculer étape par étape jusqu'à sa valeur finale. On remplace chaque variable par sa valeur, puis on applique les priorités :</p>
<pre class="pseudo">a ← 6 ; b ← 4                       // a contient 6, b contient 4
resultat ← a + b * 2 - (a - b)      // on va remplacer a et b par leurs valeurs
         = 6 + 4*2 - (6-4)          // substitution des variables
         = 6 + 8 - 2                // on calcule d'abord * et la parenthèse
         = 12                       // puis les + et - de gauche à droite</pre>`,

    { type: "input", q: "Que vaut <code>2 + 3 * 4</code> ?", a: "14", ph: "nombre", exp: "La multiplication d'abord : 2 + 12 = 14." },

<pre class="pseudo">ALGORITHME Caisse                          // nom de l'algorithme
VARIABLES budget, prix, nbPlaces, reste : ENTIER   // quatre boîtes à nombres entiers
DEBUT                                      // début des étapes
    budget ← 45                            // le groupe dispose de 45 €
    prix ← 8                               // chaque place coûte 8 €
    nbPlaces ← budget DIV prix             // division ENTIÈRE : combien de places entières ?
    reste ← budget MOD prix                // reste : argent non dépensé
    complet ← (reste = 0)                  // booléen : a-t-on dépensé tout pile ?
FIN                                        // fin de l'algorithme</pre>`,

    ],
    solution: `<p>Trace avec budget = 45 et prix = 8 :</p>
<pre class="pseudo">nbPlaces ← 45 DIV 8   → 5      // 8 rentre 5 fois entières dans 45
reste    ← 45 MOD 8   → 5      // reste : 45 - 40 = 5 €
complet  ← (5 = 0)    → FAUX   // 5 n'est pas égal à 0 → FAUX</pre>
<p>Le duo DIV/MOD répond à « combien de fois ? » et « que reste-t-il ? » — deux questions omniprésentes en algorithmique.</p>`
  }
};

      { ref: "Réflexion", texte: "Si l'on arrondit la TVA à 2,96 € avant de l'ajouter, le total devient 17,04 € au lieu de 17,03 € : un centime d'écart, né du seul fait d'avoir arrondi trop tôt. L'arrondi n'est pas une opération neutre — il jette de l'information, et cette information manque à toutes les opérations suivantes. La règle est donc : <strong>on calcule sur les valeurs exactes, et on n'arrondit qu'au moment de l'affichage</strong>, une seule fois, à la toute fin. Sur un seul passage, un centime ne compte pas. Sur une borne qui traite dix mille passages par jour, un centime d'écart systématique fait cent euros par jour, trente-six mille euros par an — et une comptabilité qui ne tombe jamais juste sans qu'on sache pourquoi. C'est la même leçon que le poids total du carnet de recettes : on arrondit pour montrer, jamais pour calculer." }
