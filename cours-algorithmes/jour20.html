<script>
var DAY = {
  num: 20,
  title: "Fonctions et procédures",
  subtitle: "Découper son code en blocs réutilisables et nommés.",
  theory: `
<h3>1. Le problème du copier-coller</h3>
<p><strong>Copier-coller</strong>, c'est recopier à l'identique un morceau de code à plusieurs endroits. Si tu calcules une moyenne à 5 endroits de ton algorithme, tu copies 5 fois le même code. Une erreur ? Cinq corrections. La solution : écrire le code UNE seule fois, lui donner un <strong>nom</strong>, et l'<strong>appeler</strong> (le déclencher par son nom) quand on veut. Ce bloc de code nommé et réutilisable s'appelle un <strong>sous-programme</strong> : un petit programme rangé à part, à l'intérieur du programme principal.</p>
<h3>2. La fonction : elle RENVOIE un résultat</h3>
<p>Une <strong>fonction</strong> est un sous-programme qui <strong>calcule et RENVOIE une valeur</strong> (un résultat qu'on récupère). On la définit avec le mot-clé <code>FONCTION</code>, suivi de son nom, de ses entrées entre parenthèses, puis du <strong>type</strong> du résultat après les deux-points :</p>
<pre class="pseudo">FONCTION carre(x : ENTIER) : ENTIER  // définit une fonction "carre" : reçoit un ENTIER x, renverra un ENTIER
DEBUT                                // début du corps de la fonction
    RETOURNER x * x                  // calcule x fois x et RENVOIE ce résultat à l'appelant
FIN                                  // fin de la fonction</pre>
<p>On l'utilise dans une <strong>expression</strong> (un calcul), comme si c'était directement une valeur :</p>
<pre class="pseudo">a ← carre(4)            // on APPELLE carre avec 4 ; la fonction renvoie 16, donc a vaut 16
b ← carre(3) + 1        // carre(3) renvoie 9, puis + 1 → b vaut 10
Écrire(carre(a))        // carre(a) = carre(16) = 256 ; affiche 256</pre>
<h3>3. La procédure : elle FAIT quelque chose</h3>
<p>Une <strong>procédure</strong> est un sous-programme qui <strong>exécute des actions</strong> (des affichages, par exemple) mais <strong>ne renvoie rien</strong> : on ne récupère aucune valeur, on l'appelle juste pour l'effet qu'elle produit :</p>
<pre class="pseudo">PROCÉDURE afficherLigne(n : ENTIER)  // définit une procédure "afficherLigne" qui reçoit un ENTIER n
DEBUT                                // début du corps de la procédure
    POUR i DE 1 A n FAIRE            // répète n fois
        Écrire("-") sans saut de ligne  // affiche un tiret en restant sur la même ligne
    FINPOUR                          // fin de la boucle
    Aller à la ligne                 // passe à la ligne suivante (une fois les tirets écrits)
FIN                                  // fin de la procédure

afficherLigne(10)       // appelle la procédure avec 10 → affiche : ----------
afficherLigne(3)        // appelle la procédure avec 3 → affiche : ---</pre>
<div class="tip">Question réflexe : « ai-je besoin du RÉSULTAT pour continuer un calcul ? » Oui → fonction. Non (juste agir/afficher) → procédure.</div>
<h3>4. Vocabulaire</h3>
<ul>
<li><strong>Paramètre</strong> : la variable déclarée dans l'en-tête (l'<strong>en-tête</strong> est la première ligne, celle qui nomme la fonction) — le <code>x</code> de carre.</li>
<li><strong>Argument</strong> : la valeur concrète passée à l'appel (le <code>4</code> de carre(4)) ; elle vient se ranger dans le paramètre.</li>
<li><strong>RETOURNER</strong> : mot-clé qui renvoie le résultat et <strong>quitte immédiatement</strong> la fonction (tout ce qui suit est ignoré).</li>
</ul>
<h3>5. Une fonction complète : le maximum de deux nombres</h3>
<pre class="pseudo">FONCTION max2(a, b : ENTIER) : ENTIER  // fonction "max2" : reçoit deux ENTIERS a et b, renvoie un ENTIER
DEBUT                                  // début du corps
    SI a > b ALORS                     // a est-il plus grand que b ?
        RETOURNER a                    // oui : le plus grand est a, on le renvoie (et on quitte)
    SINON                              // sinon (a n'est pas plus grand que b)
        RETOURNER b                    // le plus grand est b, on le renvoie
    FINSI                              // fin du test
FIN                                    // fin de la fonction

// Et le max de TROIS nombres, en réutilisant max2 :  // on assemble un bloc à partir d'un bloc existant
FONCTION max3(a, b, c : ENTIER) : ENTIER  // fonction "max3" : reçoit trois ENTIERS, renvoie un ENTIER
DEBUT                                  // début du corps
    RETOURNER max2(max2(a, b), c)      // max2(a,b) donne le plus grand des 2 premiers, comparé ensuite à c
FIN                                    // fin de la fonction</pre>
<div class="warn">Une fonction doit RETOURNER une valeur sur TOUS ses chemins. Si un SI retourne mais pas le SINON, certains appels ne renverront rien : bug.</div>
<h3>6. Pourquoi c'est une révolution</h3>
<p>Les fonctions permettent de <strong>penser par blocs</strong> : une fois carre() écrite et testée, on l'utilise sans réfléchir à son contenu — comme tu utilises Écrire() sans savoir comment l'écran fonctionne.</p>`,

    { type: "qcm", q: "Quelle est la différence entre fonction et procédure ?", opts: ["Aucune", "La fonction RENVOIE une valeur, la procédure agit sans rien renvoyer", "La procédure est plus rapide", "La fonction ne peut pas contenir de boucle"], a: 1, exp: "Fonction = calcul dont on récupère le résultat ; procédure = action." },
    { type: "input", q: "Avec <code>FONCTION carre(x) : RETOURNER x * x</code>, que vaut <code>carre(7)</code> ?", a: "49", ph: "nombre", exp: "7 × 7 = 49." },

    { type: "input", q: "<code>FONCTION mystere(n) : RETOURNER n * 2 + 1</code>. Que vaut <code>mystere(mystere(3))</code> ?", a: "15", ph: "nombre", exp: "mystere(3) = 7, mystere(7) = 15." },
    { type: "qcm", q: "Pourquoi préférer une fonction moyenne(t, n) à du code copié-collé 5 fois ?", opts: ["C'est plus long à écrire", "Une seule version à corriger et tester, un nom qui documente l'intention", "Les copies sont plus rapides", "Aucun intérêt"], a: 1, exp: "Écrire une fois, tester une fois, réutiliser partout." },
    { type: "qcm", q: "Une fonction peut-elle appeler une autre fonction ?", opts: ["Non, jamais", "Oui : c'est même le principe (max3 appelle max2)", "Seulement les procédures", "Une seule fois"], a: 1, exp: "Les blocs s'assemblent en blocs plus gros : c'est la construction de tout logiciel." },
    { type: "input", q: "<code>FONCTION prixTTC(ht : REEL) : RETOURNER ht * 1.21</code>. Que vaut <code>prixTTC(200)</code> ?", a: "242", ph: "nombre", exp: "200 × 1.21 = 242 €." }
  ],

    intro: `<p>Tu construis ta première bibliothèque de fonctions, puis tu les combines :</p>
<pre class="pseudo">FONCTION carre(x) : RETOURNER x * x        // renvoie x au carré (x fois x)
FONCTION estPair(n) : RETOURNER n MOD 2 = 0  // renvoie VRAI si n est pair (reste de la division par 2 = 0)
FONCTION max2(a, b) : SI a > b ALORS RETOURNER a SINON RETOURNER b FINSI  // renvoie le plus grand des deux

      { type: "input", q: "Que vaut <code>carre(max2(2, 5))</code> ?", a: "25", ph: "nombre", exp: "max2 = 5, carre(5) = 25. L'ordre d'emboîtement change tout." },
      { type: "qcm", q: "On veut <code>FONCTION min2(a, b)</code>. Quel corps ?", opts: ["SI a > b ALORS RETOURNER a SINON RETOURNER b FINSI", "SI a < b ALORS RETOURNER a SINON RETOURNER b FINSI", "RETOURNER a - b", "RETOURNER max2(a, b)"], a: 1, exp: "Comme max2 avec la comparaison inversée (jour 17, le retour !)." },
      { type: "qcm", q: "« Afficher la table de multiplication de n » doit devenir un sous-programme. Lequel ?", opts: ["Une fonction : elle calcule", "Une procédure afficherTable(n) : elle affiche, ne renvoie rien", "Ni l'un ni l'autre", "Une variable"], a: 1, exp: "Que des Écrire, pas de résultat : procédure." }
    ],
    solution: `<p>Évaluation des appels imbriqués, de l'intérieur vers l'extérieur :</p>
<pre class="pseudo">max2(carre(3), 8)          // on veut le plus grand entre carre(3) et 8
  → carre(3) = 9           // on évalue d'abord l'argument intérieur : carre(3) donne 9
  → max2(9, 8) = 9         // puis max2(9, 8) : le plus grand est 9

estPair(dernierChiffre(534))  // on teste si le dernier chiffre de 534 est pair
  → 534 MOD 10 = 4         // dernierChiffre(534) : reste de 534 divisé par 10 = 4
  → estPair(4) = VRAI      // estPair(4) : 4 est pair → VRAI

carre(max2(2, 5))          // on veut le carré du plus grand entre 2 et 5
  → max2(2, 5) = 5         // on évalue d'abord l'intérieur : max2(2, 5) donne 5
  → carre(5) = 25          // puis carre(5) = 25</pre>
<p>Règle d'or : les arguments sont évalués AVANT l'appel. Une fois ce mécanisme automatique, tu peux composer des fonctions comme des Lego — demain, on approfondit les paramètres.</p>`
  }

    solution: "FONCTION doseJournaliere(poids : REEL, posologie : REEL) : REEL\nDEBUT\n    RETOURNER poids * posologie\nFIN\n\nFONCTION doseParPrise(doseJour : REEL, prises : ENTIER) : REEL\nDEBUT\n    RETOURNER doseJour / prises\nFIN\n\nFONCTION depassePlafond(doseJour : REEL, poids : REEL, plafond : REEL) : BOOLEEN\n/* b) une FONCTION, pas une procedure : elle CONSTATE, elle ne decide pas.\n      L'appelant choisit d'alerter, de refuser, ou de journaliser. */\nDEBUT\n    /* le plafond est par KILO, la dose est deja multipliee par le poids :\n       on ramene les deux a la meme unite avant de comparer */\n    RETOURNER doseJour > plafond * poids\nFIN\n\nPROCEDURE ligne(n : ENTIER)\nDEBUT\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"=\") sans saut de ligne\n    FINPOUR\n    Aller a la ligne\nFIN\n\nPROCEDURE fiche(nom : CHAINE, poids : REEL, posologie : REEL,\n                prises : ENTIER, plafond : REEL)\nDEBUT\n    ligne(34)\n    Ecrire(\"  \", nom, \" — \", poids, \" kg\")\n    Ecrire(\"  Dose journaliere : \", doseJournaliere(poids, posologie), \" mg\")\n    Ecrire(\"  Par prise (\", prises, \") : \",\n           doseParPrise(doseJournaliere(poids, posologie), prises), \" mg\")\n    SI depassePlafond(doseJournaliere(poids, posologie), poids, plafond) ALORS\n        Ecrire(\"  ALERTE : plafond de \", plafond, \" mg/kg/j depasse\")\n    FINSI\n    ligne(34)\nFIN\n\nAlgorithme CalculDesDoses\nVar\n    e, prises : ENTIER\n    nom : CHAINE\n    poids, posologie, plafond : REEL\nDebut\n    plafond <- 60          /* mg/kg/jour */\n    POUR e DE 1 A 3 FAIRE\n        Ecrire(\"Nom de l'enfant ?\")\n        Lire(nom)\n        Ecrire(\"Poids (kg) ?\")\n        Lire(poids)\n        Ecrire(\"Posologie (mg/kg/j) ?\")\n        Lire(posologie)\n        Ecrire(\"Nombre de prises par jour ?\")\n        Lire(prises)\n\n        /* d) le principal ne calcule rien et n'affiche aucun detail */\n        fiche(nom, poids, posologie, prises, plafond)\n    FINPOUR\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Les deux versions</strong> : celle qui rend un verdict s'écrit <code>RETOURNER doseJour &gt; plafond * poids</code> ; celle qui affiche s'écrirait <code>SI doseJour &gt; plafond * poids ALORS Ecrire(\"ALERTE\") FINSI</code>. Je retiens la première. Ce que la seconde rendrait impossible, d'abord : <strong>compter</strong> combien d'enfants dépassent le plafond sur la journée, puisqu'elle ne rend rien à comptabiliser ; il faudrait dupliquer le test ailleurs, et l'on aurait alors deux endroits qui décident du dépassement, avec la certitude qu'un jour l'un des deux ne sera pas mis à jour. Ensuite : <strong>changer la réaction</strong>. Aujourd'hui on affiche une alerte ; demain la pharmacienne voudra peut-être bloquer l'impression, envoyer un message au médecin, ou seulement consigner le cas. Une fonction qui constate permet à chaque appelant de choisir ; une procédure qui affiche a déjà choisi pour tout le monde. C'est exactement la répartition des rôles que la leçon des exceptions formulera plus tard dans le cours de Python : <em>la fonction constate, l'appelant décide</em>. <strong>Sur le recalcul dans la fiche :</strong> les deux solutions sont défendables et ne garantissent pas la même chose. Recalculer garantit la <strong>cohérence</strong> : la fiche ne peut pas afficher une dose journalière et une dose par prise qui ne correspondraient pas, puisqu'elles découlent des mêmes entrées par le même chemin. Le risque est le <strong>coût et la répétition</strong> : mon corrigé appelle <code>doseJournaliere</code> trois fois pour le même enfant, ce qui est du travail refait et surtout du code où la même expression apparaît trois fois. Recevoir les doses en paramètres garantit à l'inverse qu'on n'a calculé qu'une fois, mais fait courir le risque qu'un appelant distrait passe une dose journalière et une dose par prise qui ne vont pas ensemble — la fiche afficherait alors deux nombres incohérents sans aucun moyen de s'en apercevoir. La solution qui réunit les deux avantages consiste à calculer une seule fois <em>à l'intérieur</em> de la fiche et à ranger le résultat dans une variable locale : cohérence garantie par la construction, calcul fait une seule fois. C'est ce que permettront les variables locales du jour 21." }

    pourquoi: "Le plafond est passé en paramètre à la fiche plutôt que déclaré comme constante à l'intérieur. Sur cet algorithme il vaut toujours soixante, et la constante serait plus simple — mais le plafond dépend du médicament, et le jour où l'officine traitera de l'ibuprofène, il faudra soit ajouter un paramètre à ce moment-là, soit écrire une seconde procédure presque identique. Ce qui dépend de la situation appelée est un paramètre, même quand la situation n'a encore qu'une seule valeur.",

    solution: "PROCEDURE ligne(n : ENTIER)\nDEBUT\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"-\") sans saut de ligne\n    FINPOUR\n    Aller a la ligne\nFIN\n\nPROCEDURE titre(texte : CHAINE, largeur : ENTIER)\n/* elle APPELLE la brique precedente : les sous-programmes s'empilent */\nDEBUT\n    ligne(largeur)\n    Ecrire(\"  \", texte)\n    ligne(largeur)\nFIN\n\nPROCEDURE barre(blocs : ENTIER)\n/* elle recoit un nombre de BLOCS, pas un nombre de places : elle ne sait\n   rien du theatre et pourra servir a afficher n'importe quelle quantite */\nDEBUT\n    POUR i DE 1 A blocs FAIRE\n        Ecrire(\"#\") sans saut de ligne\n    FINPOUR\n    Aller a la ligne\nFIN\n\nPROCEDURE planTarifaire(prixOrchestre : REEL, prixCorbeille : REEL,\n                        prixPoulailler : REEL)\nDEBUT\n    titre(\"PLAN TARIFAIRE\", 34)\n    Ecrire(\"  Orchestre  : \", prixOrchestre, \" EUR\")\n    Ecrire(\"  Corbeille  : \", prixCorbeille, \" EUR\")\n    Ecrire(\"  Poulailler : \", prixPoulailler, \" EUR\")\n    ligne(34)\nFIN\n\nPROCEDURE etatSalle(restOrchestre : ENTIER, restCorbeille : ENTIER,\n                    restPoulailler : ENTIER, placesParBloc : ENTIER)\nDEBUT\n    titre(\"PLACES RESTANTES\", 34)\n    Ecrire(\"  Orchestre  : \", restOrchestre)\n    /* la regle \"un bloc vaut dix places\" est appliquee ICI, chez l'appelant :\n       la barre reste un outil general */\n    barre(restOrchestre DIV placesParBloc)\n    Ecrire(\"  Corbeille  : \", restCorbeille)\n    barre(restCorbeille DIV placesParBloc)\n    Ecrire(\"  Poulailler : \", restPoulailler)\n    barre(restPoulailler DIV placesParBloc)\n    ligne(34)\nFIN\n\nPROCEDURE billet(spectacle : CHAINE, categorie : CHAINE,\n                 prix : REEL, place : ENTIER)\nDEBUT\n    titre(spectacle, 34)\n    Ecrire(\"  Categorie : \", categorie)\n    Ecrire(\"  Place n\", place)\n    Ecrire(\"  Prix : \", prix, \" EUR\")\n    ligne(34)\nFIN\n\nAlgorithme BilletterieTheatre\nConst\n    PLACES_PAR_BLOC = 10\nVar\n    spectacle, categorie : CHAINE\n    prixO, prixC, prixP, prix : REEL\n    restO, restC, restP, place : ENTIER\nDebut\n    Ecrire(\"Spectacle ?\")\n    Lire(spectacle)\n    Ecrire(\"Prix orchestre, corbeille, poulailler ?\")\n    Lire(prixO)\n    Lire(prixC)\n    Lire(prixP)\n    Ecrire(\"Places restantes orchestre, corbeille, poulailler ?\")\n    Lire(restO)\n    Lire(restC)\n    Lire(restP)\n\n    /* d) le principal n'affiche RIEN lui-meme : il lit et il appelle */\n    planTarifaire(prixO, prixC, prixP)\n    etatSalle(restO, restC, restP, PLACES_PAR_BLOC)\n\n    Ecrire(\"Categorie vendue ?\")\n    Lire(categorie)\n    Ecrire(\"Prix ?\")\n    Lire(prix)\n    Ecrire(\"Numero de place ?\")\n    Lire(place)\n    billet(spectacle, categorie, prix, place)\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le décompte.</strong> Ma ligne de séparation est <em>écrite</em> une seule fois et <em>appelée</em> onze fois : trois fois directement — à la fin du plan, de l'état de salle et du billet — et huit fois indirectement, par les quatre appels au titre encadré qui l'appellent chacun deux fois. Sans sous-programme, il faudrait onze boucles de tirets recopiées dans l'algorithme. Le jour où le théâtre passe du tiret à l'astérisque, c'est une modification contre onze — et la vraie question n'est pas l'effort, c'est qu'<em>on en oubliera une</em>. Un séparateur sur onze resté en tirets, sur une page imprimée, ne se remarque presque pas et donne à tout le document un air bâclé qu'on n'arrive pas à s'expliquer. <strong>Sur la barre :</strong> elle doit recevoir un nombre de <strong>blocs</strong>, et la règle « un bloc vaut dix places » doit rester chez l'appelant. Si la barre recevait un nombre de places et divisait elle-même, elle cesserait d'être un outil d'affichage pour devenir un outil de billetterie : impossible de s'en servir pour représenter un taux de remplissage en pourcentage, un chiffre d'affaires en centaines d'euros, ou une durée en quarts d'heure. Chaque nouvel usage exigerait soit un paramètre supplémentaire, soit une seconde procédure presque identique. C'est important parce que c'est le critère qui sépare une brique réutilisable d'un morceau de code seulement déplacé : une brique ne doit rien savoir du domaine dans lequel on l'emploie. Le test pratique consiste à se demander si l'on pourrait donner ce sous-programme à quelqu'un qui travaille sur un tout autre sujet — un traceur de barres, oui ; un traceur de barres de places de théâtre, non." }
