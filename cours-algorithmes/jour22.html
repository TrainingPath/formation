  theory: `
<h3>1. Face à un gros problème : ne panique pas, découpe</h3>
<p>« Écris le programme de gestion d'une médiathèque » (une médiathèque = une bibliothèque qui prête aussi films, musique, jeux) : par où commencer ?! Devant un problème énorme, la panique vient de ce qu'on essaie de tout tenir en tête d'un coup. La réponse des professionnels : le <strong>raffinement successif</strong>. « Raffiner » veut dire préciser petit à petit, comme quand on zoome sur une carte. On décrit d'abord le problème en 3 à 5 grandes étapes encore vagues, puis on <strong>raffine</strong> (on détaille) chaque étape, et on recommence, jusqu'à atteindre des <strong>instructions élémentaires</strong> (des ordres si simples qu'on peut les écrire directement en code). On appelle aussi cette approche « du général au détail » ou « descendante » (on part du sommet et on descend vers les détails).</p>
<h3>2. Exemple : organiser un tournoi de jeux vidéo</h3>
<p>Chaque « niveau » est un degré de zoom. Le niveau 0 est le problème entier en une phrase ; le niveau 1 le découpe en grandes étapes ; le niveau 2 détaille une étape choisie, et ainsi de suite.</p>
<pre class="pseudo">NIVEAU 0 : Organiser le tournoi   // le problème global, résumé en une seule phrase (le point de départ)

NIVEAU 1 :                        // premier découpage : les grandes étapes, dans l'ordre
    1. Inscrire les joueurs        // étape 1 : constituer la liste des participants
    2. Jouer les matchs            // étape 2 : faire s'affronter les joueurs
    3. Afficher le classement      // étape 3 : montrer qui a gagné

NIVEAU 2 (on raffine l'étape 1) : // on zoome sur "Inscrire les joueurs" pour la détailler
    1.1 RÉPÉTER                     // début d'une boucle qui se répète (RÉPÉTER ... JUSQU'À)
    1.2     Lire(pseudo)            // on demande et on lit le pseudo (le surnom) saisi par le joueur
    1.3     valider le pseudo          ← encore à raffiner   // étape encore vague : deviendra une fonction
    1.4     ajouter au tableau joueurs // on range le pseudo dans le tableau des joueurs (une liste de cases)
    1.5 JUSQU'À nbJoueurs = 16      // on répète jusqu'à avoir 16 joueurs inscrits (fin de la boucle)</pre>
<p>Chaque « étape encore vague » devient… une <strong>fonction à écrire</strong> ! (Rappel : une fonction est un petit sous-programme nommé et réutilisable.) Le découpage du problème dessine ainsi l'<strong>architecture</strong> du programme — c'est-à-dire son plan d'ensemble, la liste des morceaux et la façon dont ils s'emboîtent.</p>
<h3>3. Les critères d'un bon découpage</h3>
<ul>
<li><strong>Une tâche = une fonction</strong> : chaque bloc fait UNE chose, dicible (exprimable) en une seule phrase.</li>
<li><strong>Réutilisable</strong> : si deux étapes se ressemblent, c'est probablement la <strong>même</strong> fonction appelée avec des <strong>paramètres</strong> différents (les paramètres = les valeurs qu'on lui fournit à chaque appel).</li>
<li><strong>Testable seul</strong> : on peut vérifier chaque bloc <strong>indépendamment</strong>, avec des données d'essai, sans avoir besoin du reste du programme.</li>
</ul>
<h3>4. Le programme principal devient un sommaire</h3>
<p>Le <strong>programme principal</strong> est le point d'entrée, le chef d'orchestre qui appelle les fonctions dans le bon ordre. Bien conçu, il ne contient presque pas de détails : juste quelques appels bien nommés.</p>
<pre class="pseudo">ALGORITHME Tournoi                          // le programme principal, nommé "Tournoi"
DEBUT                                        // début des instructions
    joueurs ← inscrireJoueurs(16)           // appelle la fonction d'inscription ; range le résultat (la liste) dans "joueurs"
    scores ← jouerMatchs(joueurs)           // fait jouer les matchs à partir des joueurs ; range les scores obtenus
    afficherClassement(joueurs, scores)     // affiche le classement à partir des joueurs et de leurs scores (procédure)
FIN                                          // fin du programme</pre>
<div class="tip">Un bon programme principal se lit comme la table des matières d'un livre : les détails sont dans les chapitres (les fonctions).</div>
<h3>5. Entrées / Sorties de chaque bloc</h3>
<p>Pour chaque fonction, pose 3 questions : <strong>de quoi a-t-elle besoin ?</strong> (ses <strong>paramètres</strong>, ses entrées) — <strong>que produit-elle ?</strong> (sa valeur de <strong>retour</strong>, sa sortie) — <strong>que fait-elle ?</strong> (sa mission, résumée en une phrase). Ces trois réponses forment le <strong>contrat</strong> de la fonction. Si tu ne peux pas répondre en une seule phrase, le bloc est trop gros : découpe encore.</p>
<h3>6. La check-list de conception</h3>
<p>Une <strong>check-list</strong> est une liste de vérification, un pense-bête d'étapes à suivre dans l'ordre :</p>
<pre class="pseudo">1. Quelles sont les ENTRÉES et SORTIES du problème global ?   // ce qu'on reçoit et ce qu'on doit produire au total
2. Quelles sont les 3-5 grandes étapes ?                       // le découpage de niveau 1
3. Pour chaque étape : entrées ? sortie ? une phrase ?         // le contrat de chaque futur bloc
4. Une étape reste floue → la re-découper                     // on raffine encore (niveau suivant)
5. Écrire les fonctions une par une, tester chacune            // on code brique par brique et on vérifie chaque brique
6. Assembler dans le programme principal                       // on relie enfin les fonctions dans le sommaire</pre>`,

    { type: "qcm", q: "Que signifie « testable seul » pour un bloc ?", opts: ["Il n'a pas de bug", "On peut l'exécuter avec des données d'essai sans le reste du programme", "Il ne contient pas de boucle", "Il est écrit en dernier"], a: 1, exp: "Tester max2(3,8) ne demande pas la médiathèque entière : c'est ça, la force du découpage." },
    { type: "qcm", q: "Un programme principal bien conçu ressemble à…", opts: ["500 lignes de détails", "Un sommaire : quelques appels de fonctions bien nommées", "Une seule grosse boucle", "Un fichier vide"], a: 1, exp: "Les détails vivent dans les fonctions ; le principal raconte l'histoire." },
    { type: "qcm", q: "Pour chaque bloc, les 3 questions de conception sont :", opts: ["Combien de lignes fera-t-il ? Dans quel langage ? Sera-t-il rapide ?", "De quoi a-t-il besoin ? Que produit-il ? Que fait-il (une phrase) ?", "Qui l'écrit ? Quand ? Où ?", "Est-il rapide ? joli ? court ?"], a: 1, exp: "Paramètres, retour, mission : le contrat de la fonction." },

    { type: "qcm", q: "« Calculer la paie des employés » se découpe en : lire les heures / calculer brut / calculer retenues / afficher net. Laquelle est une PROCÉDURE ?", opts: ["calculer brut", "calculer retenues", "afficher net", "lire les heures"], a: 2, exp: "Afficher agit sans produire de valeur réutilisable → procédure (jour 20)." },

      { type: "qcm", q: "Quel programme principal reflète le bon découpage ?", opts: ["200 lignes détaillant chaque affichage", "mot ← choisirMot() ; TANT QUE NON estGagne(...) ET erreurs < 6 FAIRE jouerUnTour(...) FINTANTQUE ; annoncerResultat(...)", "Un seul appel : faireToutLeJeu()", "Que des Écrire"], a: 1, exp: "Un sommaire lisible : ni trop détaillé, ni une boîte noire unique." }
    ],
    solution: `<pre class="pseudo">ALGORITHME Pendu                                        // le programme principal du jeu
DEBUT                                                   // début des instructions
    mot ← choisirMot()                                  // l'ordinateur choisit le mot secret et le range dans "mot"
    lettresTrouvees ← tableau vide                      // liste (au départ vide) des lettres déjà devinées par le joueur
    erreurs ← 0                                          // compteur d'erreurs, démarré à 0
    TANT QUE NON estGagne(mot, lettresTrouvees) ET erreurs < 6 FAIRE   // on continue tant que : PAS encore gagné ET moins de 6 erreurs
        afficherMotMasque(mot, lettresTrouvees)         // montre le mot avec des _ pour les lettres non trouvées
        Lire(lettre)                                     // le joueur propose une lettre, qu'on lit
        SI contient(mot, lettre) ALORS                  // si la lettre proposée est bien dans le mot...
            ajouter lettre à lettresTrouvees            // ...on l'ajoute à la liste des lettres trouvées
        SINON                                            // sinon (lettre absente du mot)
            erreurs ← erreurs + 1                       // on compte une erreur de plus
        FINSI                                            // fin du SI
    FINTANTQUE                                           // fin de la boucle : partie terminée (gagnée ou 6 erreurs)
    SI estGagne(mot, lettresTrouvees) ALORS             // à la sortie, on regarde pourquoi la boucle s'est arrêtée
        Écrire("Gagné !")                               // toutes les lettres trouvées → victoire
    SINON                                                // sinon, c'est qu'on a atteint 6 erreurs
        Écrire("Pendu ! Le mot était ", mot)            // défaite : on révèle le mot
    FINSI                                                // fin du SI
FIN                                                      // fin du programme</pre>
<p>Regarde : le jeu entier tient en 15 lignes lisibles, parce que la complexité vit dans 4 fonctions simples — dont 2 que tu savais déjà écrire. C'est ÇA, penser en algorithmicien.</p>`

    solution: "/* ---------------------------------------------------------------\n   NIVEAU 0 : encaisser les clients d'une journee et rendre les comptes.\n\n   NIVEAU 1 :\n     1. Ouvrir la journee (compteurs a zero)\n     2. Traiter les tickets tant qu'il y a des clients\n     3. Clore la journee (bilan)\n\n   NIVEAU 2 (raffinement de l'etape 2, pour UN ticket) :\n     2.1 RÉPÉTER scanner un article JUSQU'A code 0\n     2.2   calculer son montant TTC        <- vague : FONCTION montantTTC\n     2.3   cumuler et afficher la ligne\n     2.4 appliquer la remise eventuelle    <- vague : FONCTION apresRemise\n     2.5 afficher le total du ticket       <- PROCEDURE d'affichage\n     2.6 rendre la recette du ticket       <- impose une FONCTION, pas une\n                                              procedure : voir jour 21\n   --------------------------------------------------------------- */\n\nFONCTION montantTTC(ht : REEL, taux : REEL) : REEL\nDEBUT\n    RETOURNER ht * (1 + taux / 100)\nFIN\n\nFONCTION apresRemise(total : REEL, seuil : REEL, taux : REEL) : REEL\nDEBUT\n    SI total > seuil ALORS\n        RETOURNER total * (1 - taux / 100)\n    SINON\n        RETOURNER total\n    FINSI\nFIN\n\nFONCTION traiterTicket(seuil : REEL, tauxRemise : REEL) : REEL\n/* une FONCTION et non une procedure : elle doit RENDRE sa recette a la\n   journee, et un sous-programme ne peut pas atteindre les variables de\n   son appelant (jour 21). */\nVar\n    code, articles : ENTIER\n    ht, taux, ttc, total, totalRemise : REEL\nDEBUT\n    total <- 0\n    articles <- 0\n    REPETER\n        Ecrire(\"Code article (0 pour clore le ticket) ?\")\n        Lire(code)\n        SI code <> 0 ALORS\n            Ecrire(\"Prix hors taxes ?\")\n            Lire(ht)\n            Ecrire(\"Taux de TVA (6 alimentaire, 21 autre) ?\")\n            Lire(taux)\n            ttc <- montantTTC(ht, taux)\n            total <- total + ttc\n            articles <- articles + 1\n            Ecrire(\"   article \", code, \" : \", Arrondi(ttc, 2), \" EUR TTC\")\n        FINSI\n    JUSQU'A code = 0\n\n    /* la remise porte sur le total TTC du TICKET, jamais article par article :\n       un article isole n'atteindrait jamais le seuil */\n    totalRemise <- apresRemise(total, seuil, tauxRemise)\n\n    SI articles = 0 ALORS\n        Ecrire(\"   client reparti sans achat\")\n    SINON\n        Ecrire(\"   \", articles, \" article(s) — total \", Arrondi(total, 2))\n        SI totalRemise < total ALORS\n            Ecrire(\"   remise \", tauxRemise, \" % — a payer \",\n                   Arrondi(totalRemise, 2), \" EUR\")\n        SINON\n            Ecrire(\"   a payer \", Arrondi(totalRemise, 2), \" EUR\")\n        FINSI\n    FINSI\n    RETOURNER totalRemise\nFIN\n\nAlgorithme CaisseEpicerie\nConst\n    SEUIL = 50.00\n    REMISE = 5.00\nVar\n    encore : CHAINE\n    tickets : ENTIER\n    chiffre, recetteTicket : REEL\nDebut\n    tickets <- 0\n    chiffre <- 0\n\n    REPETER\n        recetteTicket <- traiterTicket(SEUIL, REMISE)\n        /* un client reparti les mains vides n'est pas un ticket : on ne le\n           compte pas, mais on ne s'arrete pas pour autant */\n        SI recetteTicket > 0 ALORS\n            tickets <- tickets + 1\n            chiffre <- chiffre + recetteTicket\n        FINSI\n        Ecrire(\"Client suivant (oui/non) ?\")\n        Lire(encore)\n    JUSQU'A encore = \"non\"\n\n    Ecrire(\"--- Bilan de la journee ---\")\n    SI tickets = 0 ALORS\n        Ecrire(\"Aucune vente\")\n    SINON\n        Ecrire(tickets, \" ticket(s), chiffre d'affaires \",\n               Arrondi(chiffre, 2), \" EUR\")\n        Ecrire(\"Panier moyen : \", Arrondi(chiffre / tickets, 2), \" EUR\")\n    FINSI\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Le classement des six exigences.</strong> Règles de calcul : « la TVA qui n'est pas la même pour l'alimentaire et le reste » et « une remise de 5 % au-delà de cinquante euros ». Mécanique d'interaction : « ça scanne les articles jusqu'à ce que je tape zéro », « ça affiche un ticket avec le détail et le total », « ça me dise à la fin de la journée combien j'ai fait de tickets et de chiffre d'affaires ». Cas limite : « ça marche même si un client repart sans rien acheter ». Ce qui doit être décidé <strong>en premier</strong>, ce sont les <em>règles de calcul</em> — et c'est contre-intuitif, parce que le commerçant a commencé par l'interaction, et que c'est elle qu'on voit. Les règles décident pourtant de tout le reste : savoir que la remise porte sur le total du ticket et non sur chaque article impose que le total soit connu avant la remise, donc que la boucle de scan se termine avant, donc la structure entière du traitement d'un ticket. À l'inverse, commencer par l'interaction fige une mécanique qu'il faudra défaire dès qu'une règle contredira son ordre. Le cas limite, lui, se traite en dernier — mais il faut l'avoir noté au début, sous peine de découvrir en fin de parcours qu'il ne rentre pas dans la structure choisie. <strong>Le choix du point c).</strong> J'ai retenu la fonction qui rend la recette du ticket. La procédure qui affiche et modifie un cumul est <em>impossible</em> telle quelle : une procédure ne peut pas modifier une variable de son appelant, puisqu'elle n'en reçoit que des copies. Pour y parvenir, il aurait fallu que le cumul de la journée soit une variable globale — visible de partout — ce qui aurait imposé à l'appelant deux choses désagréables. D'abord de <em>savoir</em> que le traitement d'un ticket va modifier cette variable-là dans son dos : rien dans l'appel ne l'indiquerait, et un lecteur devrait ouvrir le sous-programme pour comprendre d'où vient le chiffre d'affaires. Ensuite de renoncer à tester le traitement d'un ticket isolément, puisque son effet ne serait plus dans son résultat mais dans l'état du programme. La fonction, elle, annonce dans son en-tête qu'elle rend un montant, et l'appelant décide ce qu'il en fait — le cumuler, l'ignorer, ou l'imprimer." }

    solution: "/* ---------------------------------------------------------------\n   NIVEAU 0 : gerer une soiree de billetterie, de l'ouverture aux comptes.\n\n   NIVEAU 1 :\n     1. Preparer la salle (capacites et tarifs par categorie)\n     2. Ouvrir la vente (afficher plan tarifaire et etat de salle)\n     3. Vendre tant qu'il y a des clients\n     4. Clore et rendre les comptes\n\n   NIVEAU 2 — raffinement de l'etape 3 (vendre) :\n     3.1 RÉPÉTER\n     3.2   lire la categorie demandee (0 = fin de soiree)\n     3.3   verifier la disponibilite        -> FONCTION disponible\n     3.4   SI complet : refuser et recommencer\n     3.5   lire age et qualite d'abonne\n     3.6   calculer le prix                 -> FONCTION prix (jour 2)\n     3.7   decrementer les places restantes -> une ligne, pas un sous-programme\n     3.8   cumuler la recette de la categorie\n     3.9   imprimer le billet               -> PROCEDURE billet (jour 1)\n     3.10 JUSQU'A categorie = 0\n\n   NIVEAU 2 — raffinement de l'etape 4 (comptes) :\n     4.1 POUR chaque categorie : afficher recette et places restantes\n     4.2 totaliser la recette\n     4.3 calculer le taux de remplissage    -> FONCTION tauxRemplissage\n     4.4 presenter le bilan                 -> PROCEDURE titre / ligne (jour 1)\n\n   SOUS-PROGRAMMES RECLAMES PAR LE DECOUPAGE :\n     ligne, titre, billet          effet    (jour 1, existent)\n     prix, pleinTarif, aDroit...   valeur   (jour 2, existent)\n     disponible                    valeur   (a ecrire)\n     tauxRemplissage               valeur   (a ecrire)\n     etatSalle, planTarifaire      effet    (jour 1, existent)\n   --------------------------------------------------------------- */\n\nFONCTION disponible(restantes : ENTIER) : BOOLEEN\nDEBUT\n    RETOURNER restantes > 0\nFIN\n\nFONCTION tauxRemplissage(vendues : ENTIER, capacite : ENTIER) : REEL\nDEBUT\n    SI capacite = 0 ALORS\n        RETOURNER 0            /* une salle sans place n'est ni pleine ni vide */\n    FINSI\n    RETOURNER vendues * 100 / capacite\nFIN\n\nAlgorithme SoireeDeBilletterie\nConst\n    CATEGORIES = 3\nVar\n    /* trois cases plutot que trois variables : le decoupage a dit\n       \"POUR chaque categorie\", donc une boucle, donc un tableau */\n    capacite : TABLEAU[1..3] D'ENTIERS\n    restantes : TABLEAU[1..3] D'ENTIERS\n    recette : TABLEAU[1..3] DE REELS\n    nomCat : TABLEAU[1..3] DE CHAINES\n    spectacle : CHAINE\n    c, categorie, age, place, vendues, totalCapacite : ENTIER\n    abonne : BOOLEEN\n    montant, totalRecette : REEL\nDebut\n    /* 1. PREPARER */\n    Ecrire(\"Spectacle ?\")\n    Lire(spectacle)\n    nomCat[1] <- \"Orchestre\"\n    nomCat[2] <- \"Corbeille\"\n    nomCat[3] <- \"Poulailler\"\n    POUR c DE 1 A CATEGORIES FAIRE\n        Ecrire(\"Capacite \", nomCat[c], \" ?\")\n        Lire(capacite[c])\n        restantes[c] <- capacite[c]\n        recette[c] <- 0\n    FINPOUR\n\n    /* 2. OUVRIR */\n    planTarifaire(pleinTarif(1), pleinTarif(2), pleinTarif(3))\n    etatSalle(restantes[1], restantes[2], restantes[3], 10)\n\n    /* 3. VENDRE */\n    place <- 0\n    REPETER\n        Ecrire(\"Categorie 1/2/3 (0 pour clore) ?\")\n        Lire(categorie)\n        SI categorie <> 0 ALORS\n            SI NON disponible(restantes[categorie]) ALORS\n                Ecrire(nomCat[categorie], \" : complet\")\n            SINON\n                Ecrire(\"Age ?\")\n                Lire(age)\n                Ecrire(\"Abonne (VRAI/FAUX) ?\")\n                Lire(abonne)\n                montant <- prix(categorie, age, abonne)      /* jour 2 */\n                restantes[categorie] <- restantes[categorie] - 1\n                recette[categorie] <- recette[categorie] + montant\n                place <- place + 1\n                billet(spectacle, nomCat[categorie], montant, place)  /* jour 1 */\n            FINSI\n        FINSI\n    JUSQU'A categorie = 0\n\n    /* 4. CLORE */\n    titre(\"BILAN DE LA SOIREE\", 34)\n    totalRecette <- 0\n    vendues <- 0\n    totalCapacite <- 0\n    POUR c DE 1 A CATEGORIES FAIRE\n        Ecrire(\"  \", nomCat[c], \" : \", Arrondi(recette[c], 2), \" EUR — reste \",\n               restantes[c], \" place(s)\")\n        totalRecette <- totalRecette + recette[c]\n        vendues <- vendues + (capacite[c] - restantes[c])\n        totalCapacite <- totalCapacite + capacite[c]\n    FINPOUR\n    Ecrire(\"  Recette totale : \", Arrondi(totalRecette, 2), \" EUR\")\n    Ecrire(\"  Remplissage : \",\n           Arrondi(tauxRemplissage(vendues, totalCapacite), 1), \" %\")\n    ligne(34)\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>L'écart entre les deux listes</strong> révèle deux choses. Ce que le découpage réclame et que je ne possède pas — le contrôle de disponibilité et le taux de remplissage — c'est le travail qui reste, et il est petit : deux fonctions d'une ligne. C'est le signe que les deux premiers jours ont bien travaillé. Ce que je possède et que le découpage ne réclame pas est plus instructif : au jour 1, j'avais écrit une procédure de barre proportionnelle qui n'apparaît nulle part dans ce découpage — elle n'est utilisée qu'à travers l'état de salle. Ce n'est pas un défaut ici, puisqu'elle sert indirectement ; mais l'exercice montre le mécanisme par lequel un programme accumule du code que plus rien ne réclame. Écrire d'abord et décomposer ensuite produit toujours cet écart, et c'est précisément pour cela qu'on décompose d'abord. <strong>Le taux de remplissage</strong> se calcule d'au moins trois façons, qui ne donnent pas le même nombre. Premièrement, le nombre de places vendues rapporté à la capacité totale — c'est ce que j'ai écrit, et c'est ce que le directeur a en tête quand il parle de remplissage. Deuxièmement, la moyenne des trois taux par catégorie : sur une salle de 200 places d'orchestre remplie à 100 % et 20 places de poulailler remplies à 0 %, la première méthode donne 91 % et la seconde 50 % — les deux sont exactes et répondent à deux questions différentes, la seconde traitant chaque catégorie comme également importante. Troisièmement, la recette réalisée rapportée à la recette maximale possible, qui est le taux de remplissage <em>économique</em> et le seul qui intéresse vraiment un comptable : une salle pleine d'abonnés à tarif réduit affiche 100 % de remplissage et 63 % de recette. Le directeur a en tête la première parce qu'elle mesure le public ; son trésorier lui préférerait la troisième. <strong>Les places à mobilité réduite</strong> : le décompte est instructif. Si elles constituent une quatrième catégorie tarifaire, il suffit de changer la constante <code>CATEGORIES</code> à 4, d'ajouter une entrée à <code>pleinTarif</code> et un nom au tableau — <strong>trois modifications</strong>, dont deux d'une ligne, et rien à toucher dans la vente ni dans le bilan, puisque les deux tournent sur des boucles. Si en revanche elles sont un <em>attribut</em> d'une place existante — une place d'orchestre accessible — alors la structure ne convient plus : il faudrait une seconde dimension, et la moitié des sous-programmes changerait. C'est le genre de question qu'un bon découpage pose au commanditaire avant d'écrire, et qu'un mauvais découvre au moment de livrer." }
