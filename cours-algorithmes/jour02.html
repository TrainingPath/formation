  title: "Variables et affectation",
  subtitle: "La mémoire de l'algorithme : stocker et modifier des valeurs.",
  theory: `
<h3>1. Qu'est-ce qu'une variable ?</h3>
<p>La <strong>mémoire</strong> est l'espace de travail temporaire de l'ordinateur, où il range les valeurs pendant qu'un programme s'exécute. Une <strong>variable</strong> est une <strong>boîte nommée</strong> dans cette mémoire, qui contient une valeur. On peut lire cette valeur, ou la remplacer par une autre — d'où le nom « variable » (qui peut varier).</p>
<pre class="pseudo">VARIABLES                          // section qui annonce la liste des variables utilisées
    age : ENTIER                   // une boîte nommée "age" qui contiendra un nombre entier
    prenom : CHAINE                // une boîte nommée "prenom" qui contiendra du texte</pre>
<p>On <strong>déclare</strong> une variable en lui donnant un <strong>nom</strong> (pour la désigner) et un <strong>type</strong> (la nature de ce qu'elle contient : ENTIER = nombre entier, CHAINE = texte ; le type sera détaillé demain). Déclarer, c'est réserver la boîte ; on la remplira ensuite.</p>
<h3>2. L'affectation : la flèche ←</h3>
<p>L'<strong>affectation</strong> place une valeur dans une variable. On la note avec une flèche <code>←</code> qui pointe vers la boîte que l'on remplit :</p>
<pre class="pseudo">age ← 15          // la boîte "age" reçoit (contient) désormais 15
prenom ← "Léa"    // la boîte "prenom" reçoit le texte "Léa" (les guillemets délimitent du texte)
age ← 16          // l'ancienne valeur 15 est ÉCRASÉE : "age" contient maintenant 16</pre>
<div class="warn">Une variable ne garde qu'<strong>UNE</strong> valeur à la fois : affecter une nouvelle valeur <strong>écrase</strong> l'ancienne, qui est alors perdue.</div>
<h3>3. À droite de la flèche : une expression</h3>
<p>Une <strong>expression</strong> est un calcul qui produit une valeur. À droite de la flèche, on peut mettre une expression, qui peut utiliser d'autres variables… ou la variable elle-même :</p>
<pre class="pseudo">a ← 5            // a reçoit 5
b ← a + 3        // on calcule a + 3 (soit 8) et on le range dans b ; a garde 5
a ← a + 1        // on prend l'ANCIENNE valeur de a (5), on ajoute 1, on range 6 dans a</pre>
<div class="tip"><code>a ← a + 1</code> se lit : « la nouvelle valeur de a est l'ancienne valeur de a, plus 1 ». La flèche n'est pas un « égal » mathématique : c'est un <strong>remplacement</strong>. C'est le motif le plus utilisé de toute l'algorithmique (le compteur !).</p></div>
<h3>4. Suivre un algorithme à la main : la trace</h3>
<p>Pour comprendre un algorithme, on fait sa <strong>trace</strong> : on note, après chaque ligne, la valeur de chaque variable, comme si on était l'ordinateur exécutant les étapes une à une.</p>
<pre class="pseudo">x ← 4            // x=4
y ← x * 2        // x=4, y=8   (le symbole * veut dire « multiplié par »)
x ← y - 1        // x=7, y=8   (x est écrasé ; y ne change pas)</pre>
<h3>5. Échanger deux variables</h3>
<p>Grand classique : échanger le contenu de <code>a</code> et <code>b</code>. C'est impossible sans une <strong>troisième boîte</strong> temporaire, car dès qu'on écrit dans a on perd son ancienne valeur :</p>
<pre class="pseudo">temp ← a         // on SAUVEGARDE l'ancienne valeur de a dans temp
a ← b            // a reçoit la valeur de b (l'ancien a est écrasé, mais il est dans temp)
b ← temp         // b reçoit la valeur sauvegardée : l'échange est terminé</pre>`,

    { type: "input", q: "Trace : <code>x ← 5</code>, <code>y ← 2</code>, <code>x ← x * y</code>, <code>y ← x + 1</code>. Que vaut <code>y</code> ?", a: "11", ph: "nombre", exp: "x devient 10, puis y reçoit 10 + 1 = 11." },
    { type: "vf", q: "Déclarer une variable, c'est lui donner un nom et un type avant de l'utiliser.", a: true, exp: "La déclaration réserve la boîte ; l'affectation la remplit." }
  ],

<pre class="pseudo">ALGORITHME Mystere                 // nom de l'algorithme
VARIABLES a, b, c : ENTIER         // trois boîtes à nombres entiers

<pre class="pseudo">Ligne         a     b     c

b ← a * 2     6     12    10
c ← c + 1     6     12    11</pre>
<p>Méthode : après CHAQUE ligne, on met à jour une seule colonne. C'est le réflexe n°1 de l'algorithmicien.</p>`
