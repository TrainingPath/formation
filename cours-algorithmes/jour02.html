<script>
var DAY = {
  num: 2,
  title: "Variables et affectation",
  subtitle: "La mémoire de l'algorithme : stocker et modifier des valeurs.",
  theory: `
<h3>1. Qu'est-ce qu'une variable ?</h3>
<p>La <strong>mémoire</strong> est l'espace de travail temporaire de l'ordinateur, où il range les valeurs pendant qu'un programme s'exécute. Une <strong>variable</strong> est une <strong>boîte nommée</strong> dans cette mémoire, qui contient une valeur. On peut lire cette valeur, ou la remplacer par une autre — d'où le nom « variable » (qui peut varier).</p>
<pre class="pseudo">VARIABLES                          // section qui annonce la liste des variables utilisées
    age : ENTIER                   // une boîte nommée "age" qui contiendra un nombre entier
    prenom : CHAINE                // une boîte nommée "prenom" qui contiendra du texte</pre>
<p>On <strong>déclare</strong> une variable en lui donnant un <strong>nom</strong> (pour la désigner) et un <strong>type</strong> (la nature de ce qu'elle contient : ENTIER = nombre entier, CHAINE = texte ; le type sera détaillé demain). Déclarer, c'est réserver la boîte ; on la remplira ensuite.</p>
<h3>2. L'affectation : la flèche ←</h3>
<p>L'<strong>affectation</strong> place une valeur dans une variable. On la note avec une flèche <code>←</code> qui pointe vers la boîte que l'on remplit :</p>
<pre class="pseudo">age ← 15          // la boîte "age" reçoit (contient) désormais 15
prenom ← "Léa"    // la boîte "prenom" reçoit le texte "Léa" (les guillemets délimitent du texte)
age ← 16          // l'ancienne valeur 15 est ÉCRASÉE : "age" contient maintenant 16</pre>
<div class="warn">Une variable ne garde qu'<strong>UNE</strong> valeur à la fois : affecter une nouvelle valeur <strong>écrase</strong> l'ancienne, qui est alors perdue.</div>
<h3>3. À droite de la flèche : une expression</h3>
<p>Une <strong>expression</strong> est un calcul qui produit une valeur. À droite de la flèche, on peut mettre une expression, qui peut utiliser d'autres variables… ou la variable elle-même :</p>
<pre class="pseudo">a ← 5            // a reçoit 5
b ← a + 3        // on calcule a + 3 (soit 8) et on le range dans b ; a garde 5
a ← a + 1        // on prend l'ANCIENNE valeur de a (5), on ajoute 1, on range 6 dans a</pre>
<div class="tip"><code>a ← a + 1</code> se lit : « la nouvelle valeur de a est l'ancienne valeur de a, plus 1 ». La flèche n'est pas un « égal » mathématique : c'est un <strong>remplacement</strong>. C'est le motif le plus utilisé de toute l'algorithmique (le compteur !).</p></div>
<h3>4. Suivre un algorithme à la main : la trace</h3>
<p>Pour comprendre un algorithme, on fait sa <strong>trace</strong> : on note, après chaque ligne, la valeur de chaque variable, comme si on était l'ordinateur exécutant les étapes une à une.</p>
<pre class="pseudo">x ← 4            // x=4
y ← x * 2        // x=4, y=8   (le symbole * veut dire « multiplié par »)
x ← y - 1        // x=7, y=8   (x est écrasé ; y ne change pas)</pre>
<h3>5. Échanger deux variables</h3>
<p>Grand classique : échanger le contenu de <code>a</code> et <code>b</code>. C'est impossible sans une <strong>troisième boîte</strong> temporaire, car dès qu'on écrit dans a on perd son ancienne valeur :</p>
<pre class="pseudo">temp ← a         // on SAUVEGARDE l'ancienne valeur de a dans temp
a ← b            // a reçoit la valeur de b (l'ancien a est écrasé, mais il est dans temp)
b ← temp         // b reçoit la valeur sauvegardée : l'échange est terminé</pre>`,
  exercises: [
    { type: "qcm", q: "Une variable est…", opts: ["Une valeur qui ne change jamais", "Une boîte nommée en mémoire contenant une valeur modifiable", "Un algorithme", "Un type de calcul"], a: 1, exp: "Nom + valeur modifiable = variable." },
    { type: "input", q: "Après <code>x ← 7</code> puis <code>x ← 3</code>, que vaut <code>x</code> ?", a: "3", ph: "nombre", exp: "La deuxième affectation écrase la première : x vaut 3." },
    { type: "vf", q: "Après <code>a ← 5</code> puis <code>b ← a</code>, la variable <code>a</code> devient vide.", a: false, exp: "L'affectation COPIE la valeur : a garde 5 et b reçoit 5." },
    { type: "input", q: "Trace : <code>a ← 2</code>, <code>b ← a + 4</code>. Que vaut <code>b</code> ?", a: "6", ph: "nombre", exp: "b reçoit 2 + 4 = 6." },
    { type: "input", q: "Trace : <code>n ← 10</code>, <code>n ← n + 1</code>, <code>n ← n + 1</code>. Que vaut <code>n</code> ?", a: "12", ph: "nombre", exp: "10 → 11 → 12 : chaque ligne ajoute 1 à l'ancienne valeur." },
    { type: "qcm", q: "Comment se lit <code>score ← score + 10</code> ?", opts: ["score est égal à score plus 10 (équation)", "la nouvelle valeur de score = l'ancienne valeur + 10", "on compare score et score+10", "score est supprimé"], a: 1, exp: "La flèche n'est pas un « = » mathématique : c'est un remplacement." },
    { type: "input", q: "Trace : <code>x ← 3</code>, <code>y ← x * x</code>. Que vaut <code>y</code> ?", a: "9", ph: "nombre", exp: "y reçoit 3 × 3 = 9." },
    { type: "qcm", q: "Que se passe-t-il si on écrit <code>a ← b</code> alors que <code>b</code> n'a jamais reçu de valeur ?", opts: ["a vaut 0 automatiquement", "C'est une erreur : b n'est pas initialisée", "a vaut b", "L'algorithme devient plus rapide"], a: 1, exp: "On ne peut pas lire une boîte vide : il faut toujours initialiser avant d'utiliser." },
    { type: "input", q: "Trace : <code>a ← 8</code>, <code>b ← 3</code>, <code>a ← a - b</code>. Que vaut <code>a</code> ?", a: "5", ph: "nombre", exp: "a reçoit 8 - 3 = 5." },
    { type: "vf", q: "<code>5 ← x</code> est une affectation valide.", a: false, exp: "À gauche de la flèche il faut une VARIABLE (une boîte), jamais une valeur." },
    { type: "input", q: "Trace : <code>a ← 1</code>, <code>b ← 2</code>, <code>a ← b</code>, <code>b ← a</code>. Que vaut <code>b</code> ?", a: "2", ph: "nombre", exp: "Piège classique ! a devient 2, puis b reçoit a… qui vaut déjà 2. L'échange a échoué : il fallait une variable temporaire." },
    { type: "qcm", q: "Pour échanger a et b, quel est le bon ordre ?", opts: ["a ← b ; b ← a", "temp ← a ; a ← b ; b ← temp", "b ← a ; a ← b", "temp ← a ; b ← temp ; a ← b"], a: 1, exp: "On sauvegarde a AVANT de l'écraser." },
    { type: "qcm", q: "Quel nom de variable est le plus clair pour stocker un prix total ?", opts: ["x", "truc", "prixTotal", "p2"], a: 2, exp: "Un bon nom décrit le contenu : le code se lit comme une phrase." },
    { type: "input", q: "Trace : <code>x ← 5</code>, <code>y ← 2</code>, <code>x ← x * y</code>, <code>y ← x + 1</code>. Que vaut <code>y</code> ?", a: "11", ph: "nombre", exp: "x devient 10, puis y reçoit 10 + 1 = 11." },
    { type: "vf", q: "Déclarer une variable, c'est lui donner un nom et un type avant de l'utiliser.", a: true, exp: "La déclaration réserve la boîte ; l'affectation la remplit." }
  ],
  final: {
    title: "Exercice final — La trace complète",
    intro: `<p>Fais la trace de cet algorithme ligne par ligne, puis réponds aux questions.</p>
<pre class="pseudo">ALGORITHME Mystere                 // nom de l'algorithme
VARIABLES a, b, c : ENTIER         // trois boîtes à nombres entiers
DEBUT                              // début des étapes
    a ← 6                         // a reçoit 6
    b ← 4                         // b reçoit 4
    c ← a + b        // ligne 3 : c reçoit a + b
    a ← c - b        // ligne 4 : a reçoit c - b
    b ← a * 2        // ligne 5 : b reçoit a × 2
    c ← c + 1        // ligne 6 : c reçoit l'ancien c + 1
FIN                               // fin de l'algorithme</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>c</code> après la ligne 3 ?", a: "10", ph: "nombre", exp: "c ← 6 + 4 = 10." },
      { type: "input", q: "Que vaut <code>a</code> après la ligne 4 ?", a: "6", ph: "nombre", exp: "a ← 10 - 4 = 6 (a retrouve sa valeur, par coïncidence)." },
      { type: "input", q: "Que vaut <code>b</code> après la ligne 5 ?", a: "12", ph: "nombre", exp: "b ← 6 × 2 = 12." },
      { type: "input", q: "Que vaut <code>c</code> à la FIN de l'algorithme ?", a: "11", ph: "nombre", exp: "c ← 10 + 1 = 11." },
      { type: "vf", q: "À la fin, la valeur initiale de <code>b</code> (4) est définitivement perdue.", a: true, exp: "Elle a été écrasée à la ligne 5 sans avoir été sauvegardée ailleurs." }
    ],
    solution: `<p>Trace complète (une colonne par variable, une ligne par instruction) :</p>
<pre class="pseudo">Ligne         a     b     c
a ← 6         6     -     -
b ← 4         6     4     -
c ← a + b     6     4     10
a ← c - b     6     4     10
b ← a * 2     6     12    10
c ← c + 1     6     12    11</pre>
<p>Méthode : après CHAQUE ligne, on met à jour une seule colonne. C'est le réflexe n°1 de l'algorithmicien.</p>`
  }
};
</script>

  { id: "algo-echange", title: "L'échange de deux variables", level: 1,
    statement: "Deux variables <code>a ← 5</code> et <code>b ← 9</code>. Échange leurs contenus (a doit valoir 9 et b doit valoir 5) puis affiche-les. Interdiction de réécrire directement les valeurs !",
    hints: [
      "Si tu écris a ← b directement, l'ancienne valeur de a est écrasée et perdue à jamais.",
      "Il faut une troisième variable pour sauvegarder une des deux valeurs avant l'écrasement.",
      "Trois étapes : temp ← a, puis a ← b, puis b ← temp."
    ],
    solution: "ALGORITHME Echange           // nom de l'algorithme\nVARIABLES a, b, temp : ENTIER // temp = la variable de sauvegarde\nDEBUT                        // début des instructions\n    a ← 5                    // valeur de départ de a\n    b ← 9                    // valeur de départ de b\n    temp ← a                 // 1) on met a de côté (temp vaut 5)\n    a ← b                    // 2) a reçoit la valeur de b (a vaut 9)\n    b ← temp                 // 3) b reçoit la sauvegarde (b vaut 5)\n    Écrire(\"a = \", a)        // affiche : a = 9\n    Écrire(\"b = \", b)        // affiche : b = 5\nFIN                          // fin de l'algorithme",
    note: "Ce motif d'échange est réutilisé tel quel dans tous les algorithmes de tri (jour 24)." }
  ]
};
</script>
