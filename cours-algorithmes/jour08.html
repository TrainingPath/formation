<script>
var DAY = {
  num: 8,
  title: "La logique booléenne (ET, OU, NON)",
  subtitle: "Combiner plusieurs conditions en une seule.",
  theory: `
<h3>1. Combiner des conditions</h3>
<p>Souvent, une décision dépend de plusieurs conditions à la fois. « Pour conduire, il faut avoir 18 ans <strong>ET</strong> le permis. » « Le musée est gratuit si tu as moins de 6 ans <strong>OU</strong> si c'est la nuit des musées. » La <strong>logique booléenne</strong> est l'ensemble des règles qui permettent de combiner des booléens (des valeurs VRAI/FAUX, vues au jour 3). Trois <strong>opérateurs logiques</strong> combinent des booléens : <code>ET</code>, <code>OU</code>, <code>NON</code>.</p>
<h3>2. ET : les deux doivent être vrais</h3>
<p><code>A ET B</code> n'est VRAI que lorsque A <strong>et</strong> B sont tous les deux vrais. Le tableau ci-dessous (appelé <strong>table de vérité</strong> : il liste le résultat pour chaque combinaison possible) le résume :</p>
<pre class="pseudo">A        B        A ET B                       // table de verite du ET
VRAI     VRAI     VRAI                         // les deux vrais donnent VRAI
VRAI     FAUX     FAUX                         // un seul faux suffit a donner FAUX
FAUX     VRAI     FAUX                         // idem
FAUX     FAUX     FAUX                         // aucun vrai donne FAUX</pre>
<pre class="pseudo">SI age >= 18 ET aPermis ALORS       // majeur ET titulaire du permis ?
    Écrire("Peut conduire")          // affiche seulement si les DEUX sont vrais
FINSI                               // fin du bloc SI</pre>
<h3>3. OU : au moins un doit être vrai</h3>
<p><code>A OU B</code> est VRAI dès qu'<strong>au moins un</strong> des deux est vrai :</p>
<pre class="pseudo">A        B        A OU B                       // table de verite du OU
VRAI     VRAI     VRAI                         // au moins un vrai donne VRAI
VRAI     FAUX     VRAI                         // idem
FAUX     VRAI     VRAI                         // idem
FAUX     FAUX     FAUX                         // aucun vrai donne FAUX</pre>
<div class="warn">Le OU logique est <strong>inclusif</strong> : si les DEUX conditions sont vraies, le OU est vrai aussi (contrairement au « fromage ou dessert » du restaurant, où l'on doit choisir).</div>
<h3>4. NON : inverser</h3>
<p><code>NON</code> transforme un booléen en son contraire : il rend VRAI ce qui est FAUX et inversement.</p>
<pre class="pseudo">NON VRAI → FAUX                     // le contraire de VRAI est FAUX
NON FAUX → VRAI                     // le contraire de FAUX est VRAI
SI NON estConnecte ALORS Écrire("Connecte-toi d'abord") FINSI   // s'execute si estConnecte est FAUX</pre>
<h3>5. Encadrer une valeur</h3>
<p>Pour tester « n est entre 10 et 20 », il faut DEUX comparaisons reliées par ET (on ne peut pas écrire une double comparaison d'un coup comme en maths) :</p>
<pre class="pseudo">SI n >= 10 ET n <= 20 ALORS ...     // correct : n >= 10 ET n <= 20, les deux bornes verifiees
SI 10 <= n <= 20 ALORS ...          // INTERDIT : l'ordinateur ne comprend pas cette ecriture</pre>
<h3>6. Les lois de Morgan (pour inverser proprement)</h3>
<p>Ces deux règles disent comment appliquer un NON à une combinaison. Le NON « rentre » à l'intérieur et transforme chaque ET en OU (et inversement) :</p>
<pre class="pseudo">NON (A ET B)  =  (NON A) OU (NON B)   // « pas les deux » = « au moins un manque »
NON (A OU B)  =  (NON A) ET (NON B)   // « ni l'un ni l'autre » = « pas A ET pas B »</pre>
<p>Exemple : « il n'est PAS vrai que (majeur ET permis) » = « mineur OU sans permis ».</p>
<div class="tip">Priorité : NON d'abord, puis ET, puis OU. Dans le doute : des parenthèses !</div>`,
  exercises: [
    { type: "qcm", q: "Que vaut <code>VRAI ET FAUX</code> ?", opts: ["VRAI", "FAUX"], a: 1, exp: "ET exige que les DEUX soient vrais." },
    { type: "qcm", q: "Que vaut <code>VRAI OU FAUX</code> ?", opts: ["VRAI", "FAUX"], a: 0, exp: "OU se contente d'UN vrai." },
    { type: "qcm", q: "Que vaut <code>NON (5 > 3)</code> ?", opts: ["VRAI", "FAUX"], a: 1, exp: "5 > 3 est VRAI, son inverse est FAUX." },
    { type: "qcm", q: "Que vaut <code>FAUX OU FAUX</code> ?", opts: ["VRAI", "FAUX"], a: 1, exp: "Le seul cas où OU répond FAUX : aucun des deux n'est vrai." },
    { type: "qcm", q: "age = 20, aPermis = FAUX. Que vaut <code>age >= 18 ET aPermis</code> ?", opts: ["VRAI", "FAUX"], a: 1, exp: "VRAI ET FAUX = FAUX : il manque le permis." },
    { type: "qcm", q: "Quelle expression teste « n est entre 1 et 100 (inclus) » ?", opts: ["1 <= n <= 100", "n >= 1 ET n <= 100", "n >= 1 OU n <= 100", "n = 1 ET n = 100"], a: 1, exp: "Deux comparaisons reliées par ET. (L'option OU est toujours vraie !)" },
    { type: "qcm", q: "Pourquoi <code>n >= 1 OU n <= 100</code> est-il un mauvais test d'encadrement ?", opts: ["Il est trop lent", "Il est VRAI pour n'importe quel n : 500 >= 1 est vrai, -8 <= 100 est vrai…", "OU n'existe pas", "Il faut trois conditions"], a: 1, exp: "Tout nombre satisfait au moins une des deux conditions : le test ne filtre rien." },
    { type: "qcm", q: "n = 12. Que vaut <code>n MOD 2 = 0 ET n MOD 3 = 0</code> ?", opts: ["VRAI", "FAUX"], a: 0, exp: "12 est pair ET divisible par 3 : VRAI ET VRAI = VRAI (12 est divisible par 6)." },
    { type: "qcm", q: "Un parc est gratuit pour les <code>age < 6 OU age >= 65</code>. Qui paie ?", opts: ["Un bébé de 2 ans", "Un senior de 70 ans", "Un adulte de 40 ans", "Personne"], a: 2, exp: "40 : les deux conditions sont fausses → pas gratuit." },
    { type: "qcm", q: "Que vaut <code>NON (VRAI OU FAUX)</code> ?", opts: ["VRAI", "FAUX"], a: 1, exp: "VRAI OU FAUX = VRAI ; NON VRAI = FAUX." },
    { type: "qcm", q: "D'après Morgan, <code>NON (A ET B)</code> équivaut à…", opts: ["NON A ET NON B", "NON A OU NON B", "A OU B", "A ET B"], a: 1, exp: "L'inverse de « les deux » est « au moins un manque »." },
    { type: "qcm", q: "estConnecte = FAUX. <code>SI NON estConnecte ALORS Écrire(\"Connexion requise\") FINSI</code> ?", opts: ["Affiche « Connexion requise »", "N'affiche rien", "Erreur", "Affiche FAUX"], a: 0, exp: "NON FAUX = VRAI : le bloc s'exécute." },
    { type: "qcm", q: "Avec la priorité (ET avant OU), comment se lit <code>A OU B ET C</code> ?", opts: ["(A OU B) ET C", "A OU (B ET C)", "Erreur", "Les trois en même temps"], a: 1, exp: "ET se calcule d'abord, comme × avant + en arithmétique." },
    { type: "qcm", q: "pluie = VRAI, parapluie = VRAI. Que vaut <code>pluie ET NON parapluie</code> (« je vais être mouillé ») ?", opts: ["VRAI", "FAUX"], a: 1, exp: "NON parapluie = FAUX, donc VRAI ET FAUX = FAUX : sauvé !" },
    { type: "vf", q: "<code>A OU NON A</code> est toujours VRAI, quelle que soit la valeur de A.", a: true, exp: "Soit A est vrai, soit son contraire l'est : c'est une tautologie." }
  ],
  final: {
    title: "Exercice final — Le videur de la piscine",
    intro: `<p>Règlement d'une piscine : l'entrée est autorisée si la personne <strong>sait nager OU porte des brassards</strong>, ET si elle a <strong>payé</strong>, ET si la piscine n'est <strong>PAS complète</strong>.</p>
<pre class="pseudo">autorise ← (saitNager OU brassards) ET aPaye ET NON complete   // combine les 3 exigences en un seul booleen</pre>`,
    questions: [
      { type: "qcm", q: "saitNager=VRAI, brassards=FAUX, aPaye=VRAI, complete=FAUX : autorisé ?", opts: ["Oui", "Non"], a: 0, exp: "(V OU F)=V, ET V, ET NON F=V : tout est vrai." },
      { type: "qcm", q: "saitNager=FAUX, brassards=FAUX, aPaye=VRAI, complete=FAUX : autorisé ?", opts: ["Oui", "Non"], a: 1, exp: "(F OU F)=FAUX : ni nage ni brassards, refus immédiat." },
      { type: "qcm", q: "saitNager=VRAI, aPaye=VRAI, complete=VRAI : autorisé ?", opts: ["Oui", "Non"], a: 1, exp: "NON complete = FAUX : piscine pleine, tout le reste ne compte plus." },
      { type: "qcm", q: "Quelle est la SEULE combinaison qui autorise un non-nageur ?", opts: ["aPaye = VRAI suffit", "brassards = VRAI, aPaye = VRAI, complete = FAUX", "complete = VRAI", "Aucune : un non-nageur est toujours refusé"], a: 1, exp: "Le OU le sauve : les brassards remplacent la nage, mais il faut payer et qu'il reste de la place." },
      { type: "qcm", q: "D'après Morgan, NON autorisé équivaut à…", opts: ["(NON saitNager ET NON brassards) OU NON aPaye OU complete", "NON saitNager OU NON brassards", "NON aPaye ET complete", "saitNager ET brassards"], a: 0, exp: "L'inverse d'une chaîne de ET est un OU des inverses ; l'inverse du OU interne est un ET." }
    ],
    solution: `<p>Analyse de l'expression <code>(saitNager OU brassards) ET aPaye ET NON complete</code> :</p>
<pre class="pseudo">Refusé si :
- il ne sait pas nager ET n'a pas de brassards   (le OU tombe)
- OU il n'a pas payé                              (un ET tombe)
- OU la piscine est complète                      (le NON tombe)</pre>
<p>C'est exactement la loi de Morgan : NON (A ET B ET C) = NON A OU NON B OU NON C. Savoir inverser une condition sans se tromper est un automatisme crucial pour déboguer.</p>`
  }
};
</script>
