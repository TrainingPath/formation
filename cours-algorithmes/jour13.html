  theory: `
<h3>1. Une boucle dans une boucle</h3>
<p>Petit rappel avant de commencer. Une <strong>boucle</strong> est une structure qui <strong>répète</strong> automatiquement un bloc d'instructions (on l'a vue aux jours 11 et 12). La boucle <code>POUR</code> répète un nombre de fois connu à l'avance grâce à un <strong>compteur</strong> : une variable (une « boîte » nommée qui retient une valeur) qui prend, l'une après l'autre, les valeurs d'un intervalle — par exemple 1, puis 2, puis 3. <strong>Imbriquer</strong> veut dire « emboîter », placer une chose <strong>à l'intérieur</strong> d'une autre (comme des poupées russes). Comme les SI (les tests), les boucles peuvent s'<strong>imbriquer</strong> : on écrit une boucle <strong>dans</strong> le corps d'une autre boucle. On appelle <strong>boucle externe</strong> celle du dessus (celle qui contient l'autre) et <strong>boucle interne</strong> celle du dessous (celle qui est contenue). Règle d'or : pour CHAQUE tour de la boucle externe, la boucle interne refait TOUS ses tours, depuis le début.</p>
<pre class="pseudo">POUR i DE 1 A 3 FAIRE          // boucle EXTERNE : le compteur i prend les valeurs 1, 2, 3
    POUR j DE 1 A 2 FAIRE      // boucle INTERNE : pour chaque i, j refait 1 puis 2
        Écrire(i, "-", j)      // affiche la valeur de i, un tiret, puis la valeur de j
    FINPOUR                    // FINPOUR interne : marque la fin de la boucle sur j
FINPOUR                        // FINPOUR externe : marque la fin de la boucle sur i
// Affiche : 1-1  1-2  2-1  2-2  3-1  3-2</pre>
<div class="tip">Le mot-clé <code>FAIRE</code> ouvre le corps de la boucle (les instructions à répéter) et <code>FINPOUR</code> le referme : chaque <code>POUR</code> a donc son <code>FINPOUR</code>. Nombre total d'exécutions du corps interne = tours externes × tours internes (le symbole × veut dire « multiplié par »). Ici : 3 × 2 = <strong>6</strong>.</div>
<h3>2. L'image mentale : l'horloge</h3>
<p>Pour bien visualiser, pense à une horloge. La boucle externe est l'aiguille des <strong>heures</strong>, la boucle interne celle des <strong>minutes</strong> : les minutes font un tour COMPLET (de 0 à 59) pour chaque heure. Le compteur interne « tourne plus vite » que le compteur externe.</p>
<h3>3. Exemple classique : toutes les tables de multiplication</h3>
<p>On veut afficher les 10 tables (celle de 1, celle de 2, …, celle de 10), et pour chaque table ses 10 lignes. Deux répétitions emboîtées : une boucle par « niveau ».</p>
<pre class="pseudo">POUR table DE 1 A 10 FAIRE          // boucle EXTERNE : "table" prend les valeurs 1 à 10
    POUR i DE 1 A 10 FAIRE          // boucle INTERNE : pour chaque table, i va de 1 à 10
        Écrire(table, " x ", i, " = ", table * i)   // affiche une ligne "table x i = produit"
    FINPOUR                         // ferme la boucle interne (le compteur i)
FINPOUR                             // ferme la boucle externe : 100 lignes affichées en tout</pre>
<h3>4. Dessiner des grilles</h3>
<p>En imbriquant deux boucles on peut « dessiner » en deux dimensions : la boucle externe gère les <strong>lignes</strong>, la boucle interne gère les <strong>colonnes</strong> de chaque ligne.</p>
<pre class="pseudo">// Un rectangle de 3 lignes et 5 étoiles   // commentaire d'intention (ignoré à l'exécution)
POUR ligne DE 1 A 3 FAIRE          // boucle EXTERNE : une itération par ligne (3 lignes)
    POUR col DE 1 A 5 FAIRE        // boucle INTERNE : 5 colonnes → 5 étoiles sur la ligne
        Écrire("*") sans saut de ligne   // affiche une étoile en restant sur la même ligne
    FINPOUR                        // ferme la boucle interne (col) : la ligne est complète
    Aller à la ligne               // passe à la ligne suivante (retour à la ligne)
FINPOUR                            // ferme la boucle externe (ligne)
// *****
// *****
// *****</pre>
<h3>5. La borne interne peut dépendre de l'externe</h3>
<p>La <strong>borne</strong> est la valeur limite d'un compteur (le « jusqu'à »). Rien n'oblige la borne de la boucle interne à être un nombre fixe : elle peut être le compteur de la boucle externe. C'est ainsi qu'on obtient des formes qui changent d'une ligne à l'autre.</p>
<pre class="pseudo">POUR i DE 1 A 4 FAIRE          // boucle EXTERNE : i va de 1 à 4 (numéro de la ligne)
    POUR j DE 1 A i FAIRE      // ← borne = i ! la boucle interne dépend du compteur externe
        Écrire("*") sans saut de ligne   // affiche une étoile (répétée i fois sur la ligne)
    FINPOUR                    // ferme la boucle interne (j) : la ligne compte i étoiles
    Aller à la ligne           // termine la ligne courante et passe à la suivante
FINPOUR                        // ferme la boucle externe (i)
// *
// **
// ***
// ****     → un triangle !</pre>
<div class="warn">Utilise des compteurs DIFFÉRENTS (i et j) : réutiliser i dans la boucle interne écraserait la valeur du compteur externe et casserait tout.</div>`,

    title: "Exercice final — La salle de spectacle",
    intro: `<p>Une salle a <strong>4 rangées</strong> de <strong>6 sièges</strong>. L'algorithme parcourt tous les sièges, compte les places et calcule la recette : les rangées 1 et 2 coûtent <strong>30 €</strong>, les rangées 3 et 4 coûtent <strong>20 €</strong>.</p>
<pre class="pseudo">ALGORITHME Salle                       // nom de l'algorithme
DEBUT                                   // début des instructions
    nbSieges ← 0                        // compteur de sièges, démarré à 0
    recette ← 0                         // accumulateur d'argent, démarré à 0
    POUR rangee DE 1 A 4 FAIRE          // boucle EXTERNE : parcourt les 4 rangées
        POUR siege DE 1 A 6 FAIRE       // boucle INTERNE : les 6 sièges de la rangée
            nbSieges ← nbSieges + 1     // +1 siège compté à chaque case parcourue
            SI rangee <= 2 ALORS        // si on est en rangée 1 ou 2 (<= = "inférieur ou égal")
                recette ← recette + 30  // tarif 30 € pour les rangées avant
            SINON                       // sinon (donc rangées 3 et 4)
                recette ← recette + 20  // tarif 20 € pour les rangées arrière
            FINSI                       // ferme le test SI / SINON
        FINPOUR                         // ferme la boucle interne (siege)
    FINPOUR                             // ferme la boucle externe (rangee)
    Écrire(nbSieges, recette)           // affiche le total de sièges et la recette
FIN                                     // fin de l'algorithme</pre>`,

<pre class="pseudo">Rangée 1 : 6 sièges × 30 € = 180 €      // 6 × 30
Rangée 2 : 6 sièges × 30 € = 180 €      // 6 × 30
Rangée 3 : 6 sièges × 20 € = 120 €      // 6 × 20
Rangée 4 : 6 sièges × 20 € = 120 €      // 6 × 20
Total : 24 sièges, 600 €                // 180 + 180 + 120 + 120 = 600</pre>
<p>Structure : POUR externe (rangées) → POUR interne (sièges) → SI (tarif) → accumulateur. Ce schéma « parcourir une grille et agir sur chaque case » reviendra tel quel au jour 18 avec les tableaux 2D.</p>`

      { ref: "d", texte: "C'est <strong>une coïncidence</strong>, et il suffit de bouger un seul nombre pour le vérifier. Avec huit degrés, la grille passe à <code>8 × 3 = 24</code> lignes tandis que l'entraînement reste à 21. Avec sept jours d'entraînement, celui-ci passe à <code>7 × 8 / 2 = 28</code> répétitions tandis que la grille reste à 21. Les deux quantités ne croissent pas du tout de la même façon : la grille est proportionnelle au nombre de degrés — doubler les degrés double les lignes —, tandis que l'entraînement croît beaucoup plus vite, à peu près comme le carré du nombre de jours. Douze jours ne donneraient pas le double de six jours mais <code>12 × 13 / 2 = 78</code> répétitions, soit près de quatre fois plus. Un professeur qui prolongerait « juste un peu » son programme s'en apercevrait à ses dépens." },
      { ref: "Réflexion", texte: "<strong>Ce que change la dépendance.</strong> Quand la boucle intérieure ignore le compteur extérieur, chaque tour extérieur coûte exactement la même chose, donc le total est une multiplication — un rectangle, où toutes les lignes ont la même longueur. Quand elle en dépend, chaque tour extérieur coûte davantage que le précédent, et le total est une somme de termes différents — un triangle. On ne peut pas le multiplier parce qu'il n'y a pas de « nombre de tours de la boucle intérieure » : il y en a six, tous distincts. C'est exactement la différence entre l'aire d'un rectangle et celle d'un triangle, et la formule <code>n(n+1)/2</code> n'est rien d'autre que la moitié du rectangle qui l'englobe, aux termes de la diagonale près. <strong>La troisième boucle.</strong> Trois renversements pour chacun des vingt et un accords donnent <code>7 × 3 × 3 = 63</code> lignes. Le calcul est immédiat, et c'est ce qui rend l'emboîtement séduisant : chaque niveau supplémentaire ne coûte que trois lignes de code. Le problème n'est pas là. Il est que chaque niveau <strong>multiplie</strong> le travail, alors que le code, lui, ne fait que s'allonger un peu — et l'écart entre l'effort d'écriture et le coût d'exécution est ce qui rend l'emboîtement profond dangereux. À trois niveaux de sept, on est à 343 lignes ; à quatre, à 2 401. Pour un affichage, la limite est celle du lecteur : au-delà d'une soixantaine de lignes, personne ne lit une grille, et le document qui devait aider devient un document qu'on jette. Pour un calcul, la limite est celle de la machine, et elle arrive plus vite qu'on ne croit — c'est tout le sujet du jour 28. La règle pratique : deux niveaux d'emboîtement sont ordinaires, trois demandent une justification, quatre signalent presque toujours qu'on a raté une meilleure façon de s'y prendre." }

    solution: "Algorithme CarnetQuatreCreneaux\nConst\n    JOURS = 7\n    CRENEAUX = 4\n    SEUIL_HOULE = 3\nVar\n    j, c, relevesMauvais, recordJour : ENTIER\n    houle, cumulJour, moyenneJour, recordMoyenne : REEL\nDebut\n    /* quantites de la SEMAINE : posees une seule fois, avant toute boucle */\n    relevesMauvais <- 0\n    recordMoyenne <- -1\n    recordJour <- 0\n\n    POUR j DE 1 A JOURS FAIRE\n        /* quantite de la JOURNEE : remise a zero a chaque nouvelle journee.\n           Plus haut, elle cumulerait la semaine ; plus bas, elle ne\n           contiendrait jamais qu'un seul releve. */\n        cumulJour <- 0\n\n        POUR c DE 1 A CRENEAUX FAIRE\n            Ecrire(\"Jour \", j, \" creneau \", c, \" — houle (m) ?\")\n            Lire(houle)\n            cumulJour <- cumulJour + houle\n\n            SI houle >= SEUIL_HOULE ALORS\n                relevesMauvais <- relevesMauvais + 1   /* echelle SEMAINE */\n            FINSI\n        FINPOUR\n\n        moyenneJour <- cumulJour / CRENEAUX\n        Ecrire(\"Jour \", j, \" : moyenne \", Arrondi(moyenneJour, 2), \" m\")\n\n        /* la comparaison se fait une fois la journee complete : elle porte\n           sur la moyenne, qui n'existe qu'apres la boucle des creneaux */\n        SI moyenneJour > recordMoyenne ALORS\n            recordMoyenne <- moyenneJour\n            recordJour <- j\n        FINSI\n    FINPOUR\n\n    Ecrire(relevesMauvais, \" releve(s) en mauvaise mer sur \", JOURS * CRENEAUX)\n    Ecrire(\"Journee la plus agitee : jour \", recordJour,\n           \" (\", Arrondi(recordMoyenne, 2), \" m de moyenne)\")\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Ce qui décide de l'emplacement</strong> d'une remise à zéro, c'est l'<em>échelle</em> de la question à laquelle l'accumulateur répond. « Quelle est la moyenne de cette journée ? » est une question à l'échelle de la journée : l'accumulateur qui y répond naît et meurt avec elle, donc il se remet à zéro dans la boucle des jours, avant celle des créneaux. « Combien de relevés en mauvaise mer cette semaine ? » est une question à l'échelle de la semaine : son compteur se pose une fois, avant tout, et n'est jamais remis à zéro. Les deux erreurs symétriques ont des signatures très différentes. Si je remonte la remise à zéro du cumul journalier au-dessus des deux boucles, il cumule la semaine entière : les moyennes affichées croissent régulièrement de jour en jour, et la dernière vaut sept fois trop. C'est <em>plausible</em> — cela ressemble à une tempête qui se lève — et c'est ce qui rend l'erreur redoutable. Si au contraire je descends la remise à zéro du compteur de mauvaise mer dans la boucle des jours, il repart de zéro chaque matin et n'annonce à la fin que les relevés du <em>dernier</em> jour : un nombre entre 0 et 4 là où on en attendait un jusqu'à 28. Celle-là se voit tout de suite, parce que l'ordre de grandeur est manifestement faux. La leçon : l'erreur qui donne un résultat de la bonne taille est plus dangereuse que celle qui donne un résultat absurde. <strong>Les deux décomptes ne sont pas comparables.</strong> Hier je comptais des journées, aujourd'hui des relevés, et une même journée peut fournir de zéro à quatre relevés en mauvaise mer. Une semaine qui donnerait 8 relevés pourrait correspondre à deux journées entièrement mauvaises comme à huit demi-journées réparties sur toute la semaine — deux situations que le chiffre seul ne distingue pas. Pour retrouver le décompte d'hier, il faut un booléen à l'échelle de la journée, posé à faux au début de chaque journée en même temps que le cumul, basculé à vrai dès qu'un relev
