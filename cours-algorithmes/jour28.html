  title: "La complexité d'un algorithme",
  subtitle: "Mesurer l'efficacité : pourquoi certains algorithmes gagnent toujours.",
  theory: `
<h3>1. Deux algorithmes corrects ne se valent pas</h3>
<p>Depuis un mois, on cherche à écrire des algorithmes <strong>corrects</strong> (qui donnent le bon résultat). Mais deux algorithmes peuvent être tous les deux corrects et pourtant l'un être BEAUCOUP plus rapide que l'autre. Rappelons deux méthodes vues ce mois-ci. La <strong>recherche séquentielle</strong> consiste à regarder les cases d'un tableau une par une, du début à la fin, jusqu'à trouver ce qu'on cherche — comme chercher un mot dans une liste en lisant chaque ligne dans l'ordre. La <strong>dichotomie</strong> (du jour 23) consiste à chercher dans une liste DÉJÀ TRIÉE en coupant à chaque fois la zone de recherche en deux — comme trouver un mot dans un dictionnaire papier : on ouvre au milieu, on voit de quel côté aller, on recommence dans la bonne moitié, et ainsi de suite. Les deux méthodes <strong>trouvent</strong> la valeur. Mais sur un million d'éléments : 1 000 000 d'étapes pour la première contre 20 pour la seconde. La <strong>complexité</strong> d'un algorithme est justement la mesure de la façon dont son travail (le nombre d'étapes à effectuer) <strong>grandit avec n</strong>. Ici, <strong>n</strong> (la lettre choisie par convention) désigne la <strong>taille des données</strong> : le nombre d'éléments à traiter (le nombre de cases d'un tableau, le nombre de clients d'une application, etc.).</p>
<div class="tip">La bonne question n'est pas « mon algorithme est-il rapide ? » (sur 5 données, tout est rapide) mais « comment se comporte-t-il quand n devient ÉNORME ? ». C'est cette montée en charge qui sépare un programme utilisable d'un programme qui se bloque.</div>
<h3>2. Compter les opérations, pas les secondes</h3>
<p>On pourrait mesurer la vitesse avec un chronomètre, en secondes. Mauvaise idée : le nombre de <strong>secondes</strong> dépend de la machine (un ordinateur récent va plus vite qu'un vieux), de ce qui tourne à côté, du langage utilisé… Le NOMBRE d'<strong>opérations</strong>, lui, ne dépend PAS de la machine : c'est une mesure universelle. Une <strong>opération</strong> est une action élémentaire que l'ordinateur exécute (une comparaison, une addition, une affectation…). On compte donc les <strong>opérations dominantes</strong> — celles qui reviennent le plus souvent, typiquement les <strong>comparaisons</strong> (vérifier si deux valeurs sont égales, si l'une est plus petite que l'autre…) et les <strong>affectations</strong> (ranger une valeur dans une variable, avec la flèche ←) — en fonction de n. Et on ne garde que le <strong>terme dominant</strong> : celui qui « écrase » tous les autres quand n devient grand. Pour 3n² + 5n + 12, quand n est grand, seul n² compte vraiment : à n = 1000, n² vaut 1 000 000, ce qui rend 5n = 5000 et 12 totalement négligeables à côté.</p>
<h3>3. La notation O( ) et les grandes familles</h3>
<p>Pour dire « ce travail grandit comme n² », les informaticiens utilisent une notation spéciale : le grand <strong>O</strong> (la lettre O, qu'on prononce « grand O de… »). Ainsi <code>O(n²)</code> se lit « grand O de n deux » et veut dire « le nombre d'opérations grandit proportionnellement à n² ». On range les algorithmes en grandes <strong>familles</strong> selon leur O( ). En voici les principales, de la plus rapide (en haut) à la plus lente (en bas). Chaque ligne donne la notation, le nom de la famille, puis un exemple concret :</p>
<pre class="pseudo">O(1)       constant      accéder à t[i], une affectation      // constant = temps FIXE, peu importe n (comme prendre un livre dont on connaît déjà la place)
O(log n)   logarithmique dichotomie (jour 23)                 // logarithmique = on divise n par 2 à chaque étape ; grandit TRÈS lentement
O(n)       linéaire      parcours, somme, max, recherche séq. // linéaire = proportionnel à n (2× plus de données = 2× plus de temps)
O(n²)      quadratique   boucles imbriquées, tris bulles/sélection/insertion  // quadratique = n × n ; une boucle DANS une autre boucle
O(2^n)     exponentiel   fib récursif naïf (jour 27)          // exponentiel = le travail double à chaque +1 de n ; explose, vite inutilisable</pre>
<p>Précision de vocabulaire : des <strong>boucles imbriquées</strong> sont des boucles emboîtées l'une dans l'autre — une boucle « intérieure » qui refait tout son parcours à CHAQUE tour d'une boucle « extérieure ». Si chacune tourne n fois, le total est n × n = n² tours, d'où le O(n²) (comme vérifier chaque élève face à chaque autre élève d'une classe).</p>
<h3>4. Ce que ça change CONCRÈTEMENT (à 1 million d'opérations/seconde)</h3>
<p>Imaginons une machine qui fait 1 million d'opérations par seconde. Le tableau ci-dessous montre, pour trois tailles de n (colonne de gauche), le temps que met chaque famille. La première ligne est l'en-tête : elle nomme les colonnes.</p>
<pre class="pseudo">n           O(log n)   O(n)      O(n²)         O(2^n)      // en-tête : la taille n, puis le coût pour chaque famille
20          ~4 ops     20        400           1 seconde   // petit n : presque tout est rapide (mais l'exponentiel démarre déjà)
1 000       ~10        1 000     1 seconde     l'âge de l'univers  // n = 1000 : l'exponentiel est DÉJÀ hors course
1 000 000   ~20        1 sec     11 JOURS      -           // n = 1 million : le quadratique met 11 jours ! le log ne fait que ~20 opérations</pre>
<div class="warn">Un O(n²) sur un million de données = 11 jours de calcul. Choisir le bon algorithme n'est pas du luxe : c'est la différence entre « instantané » et « impossible ».</div>
<h3>5. Reconnaître la complexité en un coup d'œil</h3>
<p>Bonne nouvelle : sans rien calculer, la STRUCTURE d'un algorithme trahit sa complexité. Voici les cas les plus fréquents (à gauche : ce que tu vois dans le code ; à droite : la complexité correspondante) :</p>
<pre class="pseudo">Pas de boucle (calcul direct)          → O(1)              // aucune répétition : un nombre fixe d'opérations
Une boucle sur n                       → O(n)              // on parcourt les n éléments une seule fois
Deux boucles imbriquées sur n          → O(n²)             // n tours × n tours = n² (le piège classique)
« On divise n par 2 à chaque étape »   → O(log n)          // signature du logarithme (la dichotomie)
Boucle sur n × dichotomie dedans       → O(n log n)  ← les bons tris !  // n répétitions, chacune coûtant log n</pre>
<p>La famille <code>O(n log n)</code> (« n fois log n ») est celle des <strong>bons algorithmes de tri</strong> : bien plus rapide que O(n²), à peine plus lente que O(n). C'est le meilleur qu'on sache faire pour trier des données.</p>
<h3>6. Meilleur cas, pire cas</h3>
<p>Un même algorithme peut être rapide ou lent selon les données qu'il reçoit. Le <strong>meilleur cas</strong> est la situation la plus favorable ; le <strong>pire cas</strong>, la plus défavorable. Exemple : la recherche séquentielle fait 1 comparaison au mieux (la valeur cherchée est en tête, trouvée du premier coup), mais n comparaisons au pire (la valeur est en toute dernière position, ou carrément absente — il faut alors tout parcourir pour en être sûr). Par prudence, on juge un algorithme sur son <strong>pire cas</strong> : c'est la garantie « quoi qu'il arrive, ça ne dépassera jamais ça ». C'est cette valeur-là qu'on écrit avec le O(…).</p>
<div class="tip">Réflexe final du mois : à chaque algorithme que tu écris, demande-toi « et si n était un million ? ». Cette question sépare le codeur du concepteur.</div>`,
