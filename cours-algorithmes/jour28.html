  title: "La complexité d'un algorithme",
  subtitle: "Mesurer l'efficacité : pourquoi certains algorithmes gagnent toujours.",
  theory: `
<h3>1. Deux algorithmes corrects ne se valent pas</h3>
<p>Depuis un mois, on cherche à écrire des algorithmes <strong>corrects</strong> (qui donnent le bon résultat). Mais deux algorithmes peuvent être tous les deux corrects et pourtant l'un être BEAUCOUP plus rapide que l'autre. Rappelons deux méthodes vues ce mois-ci. La <strong>recherche séquentielle</strong> consiste à regarder les cases d'un tableau une par une, du début à la fin, jusqu'à trouver ce qu'on cherche — comme chercher un mot dans une liste en lisant chaque ligne dans l'ordre. La <strong>dichotomie</strong> (du jour 23) consiste à chercher dans une liste DÉJÀ TRIÉE en coupant à chaque fois la zone de recherche en deux — comme trouver un mot dans un dictionnaire papier : on ouvre au milieu, on voit de quel côté aller, on recommence dans la bonne moitié, et ainsi de suite. Les deux méthodes <strong>trouvent</strong> la valeur. Mais sur un million d'éléments : 1 000 000 d'étapes pour la première contre 20 pour la seconde. La <strong>complexité</strong> d'un algorithme est justement la mesure de la façon dont son travail (le nombre d'étapes à effectuer) <strong>grandit avec n</strong>. Ici, <strong>n</strong> (la lettre choisie par convention) désigne la <strong>taille des données</strong> : le nombre d'éléments à traiter (le nombre de cases d'un tableau, le nombre de clients d'une application, etc.).</p>
<div class="tip">La bonne question n'est pas « mon algorithme est-il rapide ? » (sur 5 données, tout est rapide) mais « comment se comporte-t-il quand n devient ÉNORME ? ». C'est cette montée en charge qui sépare un programme utilisable d'un programme qui se bloque.</div>
<h3>2. Compter les opérations, pas les secondes</h3>
<p>On pourrait mesurer la vitesse avec un chronomètre, en secondes. Mauvaise idée : le nombre de <strong>secondes</strong> dépend de la machine (un ordinateur récent va plus vite qu'un vieux), de ce qui tourne à côté, du langage utilisé… Le NOMBRE d'<strong>opérations</strong>, lui, ne dépend PAS de la machine : c'est une mesure universelle. Une <strong>opération</strong> est une action élémentaire que l'ordinateur exécute (une comparaison, une addition, une affectation…). On compte donc les <strong>opérations dominantes</strong> — celles qui reviennent le plus souvent, typiquement les <strong>comparaisons</strong> (vérifier si deux valeurs sont égales, si l'une est plus petite que l'autre…) et les <strong>affectations</strong> (ranger une valeur dans une variable, avec la flèche ←) — en fonction de n. Et on ne garde que le <strong>terme dominant</strong> : celui qui « écrase » tous les autres quand n devient grand. Pour 3n² + 5n + 12, quand n est grand, seul n² compte vraiment : à n = 1000, n² vaut 1 000 000, ce qui rend 5n = 5000 et 12 totalement négligeables à côté.</p>
<h3>3. La notation O( ) et les grandes familles</h3>
<p>Pour dire « ce travail grandit comme n² », les informaticiens utilisent une notation spéciale : le grand <strong>O</strong> (la lettre O, qu'on prononce « grand O de… »). Ainsi <code>O(n²)</code> se lit « grand O de n deux » et veut dire « le nombre d'opérations grandit proportionnellement à n² ». On range les algorithmes en grandes <strong>familles</strong> selon leur O( ). En voici les principales, de la plus rapide (en haut) à la plus lente (en bas). Chaque ligne donne la notation, le nom de la famille, puis un exemple concret :</p>
<pre class="pseudo">O(1)       constant      accéder à t[i], une affectation      // constant = temps FIXE, peu importe n (comme prendre un livre dont on connaît déjà la place)
O(log n)   logarithmique dichotomie (jour 23)                 // logarithmique = on divise n par 2 à chaque étape ; grandit TRÈS lentement
O(n)       linéaire      parcours, somme, max, recherche séq. // linéaire = proportionnel à n (2× plus de données = 2× plus de temps)
O(n²)      quadratique   boucles imbriquées, tris bulles/sélection/insertion  // quadratique = n × n ; une boucle DANS une autre boucle
O(2^n)     exponentiel   fib récursif naïf (jour 27)          // exponentiel = le travail double à chaque +1 de n ; explose, vite inutilisable</pre>
<p>Précision de vocabulaire : des <strong>boucles imbriquées</strong> sont des boucles emboîtées l'une dans l'autre — une boucle « intérieure » qui refait tout son parcours à CHAQUE tour d'une boucle « extérieure ». Si chacune tourne n fois, le total est n × n = n² tours, d'où le O(n²) (comme vérifier chaque élève face à chaque autre élève d'une classe).</p>
<h3>4. Ce que ça change CONCRÈTEMENT (à 1 million d'opérations/seconde)</h3>
<p>Imaginons une machine qui fait 1 million d'opérations par seconde. Le tableau ci-dessous montre, pour trois tailles de n (colonne de gauche), le temps que met chaque famille. La première ligne est l'en-tête : elle nomme les colonnes.</p>
<pre class="pseudo">n           O(log n)   O(n)      O(n²)         O(2^n)      // en-tête : la taille n, puis le coût pour chaque famille
20          ~4 ops     20        400           1 seconde   // petit n : presque tout est rapide (mais l'exponentiel démarre déjà)
1 000       ~10        1 000     1 seconde     l'âge de l'univers  // n = 1000 : l'exponentiel est DÉJÀ hors course
1 000 000   ~20        1 sec     11 JOURS      -           // n = 1 million : le quadratique met 11 jours ! le log ne fait que ~20 opérations</pre>
<div class="warn">Un O(n²) sur un million de données = 11 jours de calcul. Choisir le bon algorithme n'est pas du luxe : c'est la différence entre « instantané » et « impossible ».</div>
<h3>5. Reconnaître la complexité en un coup d'œil</h3>
<p>Bonne nouvelle : sans rien calculer, la STRUCTURE d'un algorithme trahit sa complexité. Voici les cas les plus fréquents (à gauche : ce que tu vois dans le code ; à droite : la complexité correspondante) :</p>
<pre class="pseudo">Pas de boucle (calcul direct)          → O(1)              // aucune répétition : un nombre fixe d'opérations
Une boucle sur n                       → O(n)              // on parcourt les n éléments une seule fois
Deux boucles imbriquées sur n          → O(n²)             // n tours × n tours = n² (le piège classique)
« On divise n par 2 à chaque étape »   → O(log n)          // signature du logarithme (la dichotomie)
Boucle sur n × dichotomie dedans       → O(n log n)  ← les bons tris !  // n répétitions, chacune coûtant log n</pre>
<p>La famille <code>O(n log n)</code> (« n fois log n ») est celle des <strong>bons algorithmes de tri</strong> : bien plus rapide que O(n²), à peine plus lente que O(n). C'est le meilleur qu'on sache faire pour trier des données.</p>
<h3>6. Meilleur cas, pire cas</h3>
<p>Un même algorithme peut être rapide ou lent selon les données qu'il reçoit. Le <strong>meilleur cas</strong> est la situation la plus favorable ; le <strong>pire cas</strong>, la plus défavorable. Exemple : la recherche séquentielle fait 1 comparaison au mieux (la valeur cherchée est en tête, trouvée du premier coup), mais n comparaisons au pire (la valeur est en toute dernière position, ou carrément absente — il faut alors tout parcourir pour en être sûr). Par prudence, on juge un algorithme sur son <strong>pire cas</strong> : c'est la garantie « quoi qu'il arrive, ça ne dépassera jamais ça ». C'est cette valeur-là qu'on écrit avec le O(…).</p>
<div class="tip">Réflexe final du mois : à chaque algorithme que tu écris, demande-toi « et si n était un million ? ». Cette question sépare le codeur du concepteur.</div>`,

      "Cinq formules, deux tailles de fichier, un seuil. L'exercice est entièrement arithmétique jusqu'au point d), qui est le seul à demander une décision — et cette décision se prend sur des chiffres, pas sur une impression.",
      "Le plan : écrire les cinq coûts comme cinq expressions d'une même taille saisie. Les afficher avec leur nom. Signaler ceux qui franchissent le seuil. Pour le point d), calculer d'un côté le coût divisé par deux, de l'autre le coût de la meilleure classe, et comparer les deux au seuil.",
      "En pseudocode : lire la taille · <code>constant ← 1</code> · <code>logarithmique ← log2(n)</code> · <code>lineaire ← n</code> · <code>quasi ← n × log2(n)</code> · <code>quadratique ← n × n</code> · puis un test de seuil sur chacun.",
      "Le point délicat est le point d). Une machine deux fois plus rapide divise le coût par deux ; changer d'algorithme change la <em>classe</em>. Sur cent millions d'opérations, diviser par deux laisse cinquante millions — toujours cinquante fois au-dessus du seuil — tandis que passer au quasi linéaire ramène à cent trente mille. Ce n'est pas la même nature de progrès.",
      "Ta copie ressemble à ceci : <br>une lecture de la taille<br>cinq affectations, une par classe<br>cinq tests de seuil, ou une petite structure qui les parcourt<br>et le calcul comparatif du point d), en deux lignes."
    ],
    solution: "Algorithme DossierDeLOfficine\nConst\n    SEUIL = 1000000\nVar\n    n : ENTIER\n    logN : REEL\n    constant, logarithmique, lineaire, quasi, quadratique : REEL\n    apresMachine, apresAlgo : REEL\nDebut\n    Ecrire(\"Nombre de patients au fichier ?\")\n    Lire(n)\n\n    logN <- log2(n)              /* environ 10 pour 1000, 13 pour 10000 */\n\n    constant <- 1\n    logarithmique <- logN\n    lineaire <- n\n    quasi <- n * logN\n    quadratique <- n * n\n\n    Ecrire(\"Consulter par numero  : \", constant)\n    Ecrire(\"Chercher par nom      : \", Arrondi(logarithmique, 0))\n    Ecrire(\"Lister par medecin    : \", lineaire)\n    Ecrire(\"Trier le fichier      : \", Arrondi(quasi, 0))\n    Ecrire(\"Detecter les doublons : \", quadratique)\n\n    SI quadratique > SEUIL ALORS\n        Ecrire(\"ALERTE : la detection de doublons depasse le seuil\")\n    FINSI\n    SI quasi > SEUIL ALORS\n        Ecrire(\"ALERTE : le tri depasse le seuil\")\n    FINSI\n    SI lineaire > SEUIL ALORS\n        Ecrire(\"ALERTE : le listage depasse le seuil\")\n    FINSI\n\n    /* d) machine deux fois plus rapide CONTRE changement de classe */\n    apresMachine <- quadratique / 2\n    apresAlgo <- quasi\n    Ecrire(\"Doublons, machine doublee : \", apresMachine)\n    Ecrire(\"Doublons, algorithme quasi lineaire : \", Arrondi(apresAlgo, 0))\n    Ecrire(\"Seuil : \", SEUIL)\nFin",
    reponses: [
      { ref: "a", texte: "Pour <strong>mille</strong> patients : constante 1 · logarithmique 10 · linéaire 1 000 · quasi linéaire 10 000 · quadratique 1 000 000. Pour <strong>dix mille</strong> : constante 1 · logarithmique 13 · linéaire 10 000 · quasi linéaire 130 000 · quadratique <strong>100 000 000</strong>. Le dernier chiffre a gagné deux zéros là où le fichier n'en gagnait qu'un." },
      { ref: "b", texte: "Facteurs de multiplication pour un fichier multiplié par dix : constante <strong>×1</strong> — elle ne bouge pas ; logarithmique <strong>×1,3</strong> — elle gagne trois unités sur dix ; linéaire <strong>×10</strong> — elle suit exactement ; quasi linéaire <strong>×13</strong> — un peu plus vite ; quadratique <strong>×100</strong>. C'est ce dernier facteur qui rend la classe quadratique dangereuse : elle est parfaitement confortable tant que les données sont petites, et elle devient impraticable sans prévenir." },
      { ref: "d", texte: "Sur dix mille patients, la détection de doublons coûte cent millions d'opérations, soit cent fois le seuil. Une machine <strong>deux fois plus rapide</strong> ramène ce coût à cinquante millions — toujours <strong>cinquante fois</strong> au-dessus du seuil. Changer d'algorithme pour du quasi linéaire ramène à <strong>130 000 opérations</strong>, soit près de huit fois <em>sous</em> le seuil. L'écart entre les deux décisions est d'un facteur trois cent quatre-vingts. Il n'y a pas d'hésitation à avoir, et l'argent de la machine serait mieux placé ailleurs." },
      { ref: "Réflexion", texte: "<strong>Non, une opération constante n'est pas toujours plus rapide.</strong> La classe de croissance dit comment le coût <em>évolue</em> avec la taille des données ; elle ne dit rien du coût lui-même. Une opération constante qui demanderait de lire un disque distant coûte des millisecondes, quelle que soit la taille du fichier ; une recherche logarithmique dans un tableau tenu en mémoire coûte treize comparaisons, soit une fraction de microseconde. Sur dix mille patients, la seconde est des milliers de fois plus rapide que la première, alors que sa classe est « moins bonne ». Exemple concret : consulter une fiche par son numéro en interrogeant un serveur — constant, et lent — contre chercher un nom dans l'index trié gardé en mémoire — logarithmique, et instantané. La classe de croissance ne devient décisive que lorsque <em>n</em> grandit assez pour que la différence d'évolution l'emporte sur la différence de coût unitaire, et ce seuil peut être très haut. C'est la raison pour laquelle on ne remplace jamais une mesure par un raisonnement sur les classes : on s'en sert pour savoir <em>où regarder</em> et pour prévoir ce qui arrivera quand les données grossiront. <strong>La conclusion du point d), en une phrase :</strong> le matériel divise un coût, l'algorithme change sa classe — et sur des données qui grandissent, changer de classe l'emporte toujours, à partir d'une certaine taille, sur n'importe quel facteur constant. L'achat de matériel reste malgré tout la bonne décision dans trois situations. D'abord quand on est <em>déjà dans la bonne classe</em> et qu'il ne reste qu'un facteur constant à gagner : là, le matériel est le seul levier. Ensuite quand la taille des données est <em>bornée pour de bon</em> — une officine de village ne dépassera jamais dix mille patients, et un algorithme quadratique sur mille éléments est parfaitement confortable. Enfin quand le changement d'algorithme coûterait plus cher en développement et en risque que la machine, ce qui est souvent le cas sur du code ancien et éprouvé. La règle n'est donc pas « toujours changer d'algorithme » mais « savoir ce qu'on achète » : un facteur, ou une pente." }
    ],
    pourquoi: "Le seuil est déclaré comme constante nommée et testé séparément pour chaque classe, plutôt qu'appliqué à la plus coûteuse seulement. C'est ce qui permet de voir <em>à partir de quelle taille</em> chaque opération bascule : sur mille patients, seule la quadratique alerte ; sur cent mille, le tri s'y ajoute. Ne surveiller que l'opération qu'on soupçonne revient à ne découvrir les autres qu'au moment où elles font mal.",
    checklist: [
      "Tes cinq coûts sont-ils calculés, ou repris de mémoire ?",
      "Sur dix mille patients, ta détection de doublons annonce-t-elle cent millions ?",
      "Ton facteur pour la classe quadratique vaut-il 100 quand le fichier est multiplié par dix ?",
      "Au point d), compares-tu les deux décisions au même seuil ?",
      "Quelles opérations alertent sur mille patients, et lesquelles s'y ajoutent sur cent mille ?"
    ],
    note: "Refais le tableau pour cent patients : combien d'opérations alertent ? C'est pourquoi un algorithme quadratique paraît excellent en phase d'essai." },

  { num: "28.3", titre: "La file du guichet — 1 / 4", niveau: 3, domaine: "guichet et services",
    serie: { nom: "La file du guichet", jour: 1, sur: 4 },
    enonce: "Nouvelle mini-série de quatre jours, la dernière du cours : la file d'attente d'un guichet administratif. Aujourd'hui, on mesure. Le guichet reçoit chaque matin un certain nombre d'usagers et doit choisir sa façon de les traiter. Trois organisations sont envisagées. La première appelle les usagers dans l'ordre d'arrivée. La deuxième cherche à chaque appel l'usager dont le dossier est le plus court, pour libérer le guichet plus vite. La troisième trie une fois pour toutes les dossiers par durée croissante, puis les appelle dans cet ordre. L'algorithme doit compter les opérations de chacune et dire, pour un nombre d'usagers saisi, laquelle tient encore la route.",
    principe: "Appeler dans l'ordre d'arrivée ne demande aucune recherche : le coût est <strong>linéaire</strong>, une opération par usager. Chercher à chaque appel le dossier le plus court oblige à parcourir tous ceux qui restent : c'est la somme <code>n + (n−1) + … + 1</code>, soit <code>n × (n + 1) / 2</code>, une croissance <strong>quadratique</strong>. Trier une fois puis servir dans l'ordre coûte le tri — quasi linéaire avec un bon tri — plus un parcours.",
    sousQuestions: [
      { ref: "a", texte: "Écris les trois organisations, chacune avec son compteur d'opérations. La deuxième réutilise la recherche de minimum du jour 17, la troisième le tri du jour 24." },
      { ref: "b", texte: "Fais afficher les trois compteurs pour un nombre d'usagers saisi, puis les trois coûts théoriques calculés par formule, et vérifie qu'ils concordent." },
      { ref: "c", texte: "Détermine, par essais successifs, à partir de combien d'usagers la deuxième organisation dépasse un million d'opérations." },
      { ref: "d", texte: "La deuxième et la troisième donnent-elles le même ordre de passage ? Si oui, laquelle faut-il retenir et pourquoi ? Si non, en quoi diffèrent-elles ?" }
    ],
    reflexion: "Les organisations deux et trois produisent le même service rendu pour un coût très différent, et c'est là tout l'objet de la journée. Mais l'organisation une, la plus économique de toutes, n'est pas retenue par le guichet : qu'est-ce qu'elle optimise, et qu'est-ce qu'elle sacrifie ? Puis : servir d'abord les dossiers courts réduit l'attente moyenne — mais pour qui, exactement, et au prix de quoi ? Nomme la personne qui paie ce gain, et dis si un service public peut légitimement faire ce choix.",
    indices: [
      "Trois organisations qui rendent presque le même service. Ce qui les distingue n'est pas ce qu'elles produisent mais ce qu'elles coûtent — et pour deux d'entre elles, l'écart tient entièrement à ce qu'on recommence ou non un travail déjà fait.",
      "Le plan : la première est une simple boucle. La deuxième, deux boucles emboîtées dont l'intérieure cherche le minimum parmi ce qui reste. La troisième, un tri suivi d'une boucle. Chacune compte ses opérations, et l'on confronte les trois compteurs aux trois formules.",
      "En pseudocode, pour la deuxième : marquer les usagers déjà servis, puis répéter <em>n</em> fois — parcourir tous les non servis, retenir le plus court, l'appeler, le marquer. Le parcours coûte <em>n</em> au premier tour, <em>n−1</em> au deuxième, et ainsi de suite.",
      "Le point délicat est le point d). Les deux organisations servent les dossiers du plus court au plus long, donc dans le même ordre — à ceci près qu'en cas d'égalité, l'une prend le premier arrivé et l'autre dépend de la stabilité du tri. La question du choix se règle alors uniquement sur le coût, ce qui est rare et confortable.",
      "Ta copie ressemble à ceci : <br>trois blocs indépendants, chacun avec son propre compteur<br>un tableau de booléens pour la deuxième organisation<br>un appel au tri pour la troisième<br>puis l'affichage des trois compteurs à côté des trois formules."
    ],
    solution: "Algorithme FileDuGuichet\nVar\n    duree, copie : TABLEAU[1..500] D'ENTIERS\n    servi : TABLEAU[1..500] DE BOOLEENS\n    n, i, j, k, posMin, temp : ENTIER\n    op1, op2, op3 : ENTIER\n    permute : BOOLEEN\nDebut\n    Ecrire(\"Nombre d'usagers ?\")\n    Lire(n)\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"Duree du dossier \", i, \" (min) ?\")\n        Lire(duree[i])\n    FINPOUR\n\n    /* ORGANISATION 1 : ordre d'arrivee. Aucune recherche. LINEAIRE. */\n    op1 <- 0\n    POUR i DE 1 A n FAIRE\n        op1 <- op1 + 1\n    FINPOUR\n\n    /* ORGANISATION 2 : a chaque appel, chercher le plus court parmi ce qui\n       reste. Le parcours coute n au 1er tour, n-1 au 2e... : QUADRATIQUE.\n       C'est exactement le travail refait de l'exercice 28.1. */\n    op2 <- 0\n    POUR i DE 1 A n FAIRE\n        servi[i] <- FAUX\n    FINPOUR\n    POUR k DE 1 A n FAIRE\n        posMin <- 0\n        POUR j DE 1 A n FAIRE\n            op2 <- op2 + 1\n            SI NON servi[j] ET (posMin = 0 OU duree[j] < duree[posMin]) ALORS\n                posMin <- j\n            FINSI\n        FINPOUR\n        servi[posMin] <- VRAI\n    FINPOUR\n\n    /* ORGANISATION 3 : trier UNE FOIS, puis servir dans l'ordre. */\n    POUR i DE 1 A n FAIRE\n        copie[i] <- duree[i]\n    FINPOUR\n    op3 <- 0\n    k <- n - 1\n    permute <- VRAI\n    TANT QUE permute ET k > 0 FAIRE\n        permute <- FAUX\n        POUR i DE 1 A k FAIRE\n            op3 <- op3 + 1\n            SI copie[i] > copie[i + 1] ALORS\n                temp <- copie[i]\n                copie[i] <- copie[i + 1]\n                copie[i + 1] <- temp\n                permute <- VRAI\n            FINSI\n        FINPOUR\n        k <- k - 1\n    FINTANTQUE\n    POUR i DE 1 A n FAIRE\n        op3 <- op3 + 1      /* le service, apres le tri */\n    FINPOUR\n\n    Ecrire(\"Organisation 1 (arrivee)   : \", op1, \" — formule : \", n)\n    Ecrire(\"Organisation 2 (recherche) : \", op2, \" — formule : \", n * n)\n    Ecrire(\"Organisation 3 (tri) : \", op3)\n\n    /* c) l'organisation 2 franchit le million autour de mille usagers :\n          1000 x 1000 = 1 000 000. */\n    SI op2 > 1000000 ALORS\n        Ecrire(\"L'organisation 2 depasse le million d'operations\")\n    FINSI\nFin",
    reponses: [
      { ref: "c", texte: "L'organisation 2 effectue <em>n</em> parcours complets de <em>n</em> cases dans mon écriture — je ne raccourcis pas le parcours au fil des tours, puisque les servis restent dans le tableau — soit <code>n²</code> opérations. Elle franchit donc le million à <strong>mille usagers</strong> exactement. Avec un parcours raccourci à chaque tour, le coût tomberait à <code>n × (n + 1) / 2</code> et le seuil reculerait à environ 1 414 usagers : deux fois moins de travail, la même classe de croissance. C'est la démonstration la plus nette qu'un facteur constant ne change pas la nature du problème." },
      { ref: "d", texte: "Oui, les deux donnent le <strong>même ordre de passage</strong> : du dossier le plus court au plus long. À égalité de durée, l'organisation 2 sert le premier arrivé — puisqu'elle garde le premier minimum rencontré — et l'organisation 3 fait de même à condition que son tri soit stable, ce qui est le cas du tri à bulles à comparaison stricte. Le service rendu est donc identique, et le choix se règle uniquement sur le coût : il faut retenir la <strong>troisième</strong>, quasi linéaire avec un bon tri contre quadratique. C'est une situation rare et confortable — le plus souvent, l'algorithme le moins cher rend un service légèrement différent, et il faut arbitrer." },
      { ref: "Réflexion", texte: "<strong>L'organisation 1 optimise le coût de gestion</strong> — elle est la moins chère de toutes, et elle n'a besoin de rien savoir des dossiers à l'avance, ce qui compte : les deux autres supposent qu'on connaît la durée de chaque dossier <em>avant</em> de recevoir l'usager, hypothèse souvent fausse. Ce qu'elle sacrifie, c'est le temps d'attente cumulé : si un dossier de deux heures arrive en premier, les vingt personnes derrière attendent deux heures de plus, quelle que soit la brièveté de leur propre demande. <strong>Servir d'abord les dossiers courts réduit l'attente moyenne</strong>, et c'est mathématiquement certain : chaque minute passée sur un dossier est attendue par tous ceux qui suivent, donc traiter d'abord les courts minimise le total des attentes. Mais la moyenne cache qui paie. Celui qui paie, c'est <strong>l'usager au dossier le plus lourd</strong> — et ce n'est pas un usager au hasard. Un dossier long est souvent un dossier compliqué : une situation administrative embrouillée, une personne qui ne parle pas bien la langue, un cas qui sort des cases. La règle « les plus courts d'abord » revient donc à faire attendre systématiquement les plus fragiles, et à les faire attendre <em>d'autant plus</em> que leur cas est difficile. Pire : si de nouveaux usagers arrivent en continu, le dossier le plus long peut n'être jamais appelé — il est reporté par chaque nouvel arrivant plus rapide que lui. Un service public peut-il faire ce choix ? Il peut légitimement en tenir compte, mais pas l'appliquer seul : la solution employée dans la pratique est d'ajouter une garantie d'ancienneté — au-delà d'un certain temps d'attente, l'usager passe quoi qu'il arrive. C'est une contrainte d'<em>équité</em> qui s'ajoute au critère d'<em>efficacité</em>, et elle coûte un peu de performance moyenne. La leçon dépasse le guichet : optimiser une moyenne désigne toujours quelqu'un qui paie, et l'algorithme ne le dit pas — il faut aller le chercher." }
    ],
    pourquoi: "L'organisation 2 conserve les usagers servis dans le tableau, marqués par un booléen, plutôt que de les en retirer. Les retirer donnerait un parcours qui raccourcit et diviserait le travail par deux — mais compliquerait le décompte et, surtout, masquerait le point de l'exercice : le coût resterait quadratique, et le gain d'un facteur deux ne changerait rien à la conclusion. Il valait mieux une écriture qui rende la croissance manifeste qu'une écriture optimisée qui la déguise.",
    checklist: [
      "Tes trois organisations produisent-elles le même ensemble d'usagers servis ?",
      "Ton compteur de l'organisation 2 vaut-il bien le carré du nombre d'usagers ?",
      "Recopies-tu le tableau avant le tri de l'organisation 3 ?",
      "À mille usagers, quelle organisation dépasse le million d'opérations ?",
      "Les organisations 2 et 3 servent-elles dans le même ordre ? Vérifie sur deux dossiers de même durée."
    ],
    note: "Jour 1 sur 4. Demain, la file cessera d'être un tableau qu'on fouille : elle deviendra une structure où l'on ne peut prendre que par un bout." }
