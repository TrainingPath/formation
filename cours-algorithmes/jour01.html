<script>
var DAY = {
  num: 1,
  title: "Qu'est-ce qu'un algorithme ?",
  subtitle: "Comprendre la notion d'algorithme avant d'écrire la moindre ligne.",
  theory: `
<h3>1. Définition</h3>
<p>Un <strong>algorithme</strong> est une <strong>suite finie et ordonnée d'instructions</strong> qui, appliquées à des données d'entrée, produisent un résultat. Décomposons ces mots : une <strong>instruction</strong> est une action élémentaire, un ordre simple (« verser l'eau ») ; une <strong>donnée</strong> est une information que l'on manipule (un nombre, un texte, un choix) ; « <strong>finie</strong> » veut dire que le nombre d'étapes s'arrête ; « <strong>ordonnée</strong> » veut dire que les étapes se suivent dans un ordre précis. En résumé, un algorithme est une <strong>recette</strong> : des ingrédients (les entrées), des étapes précises (les instructions), un plat (la sortie).</p>
<div class="tip">Un algorithme n'est <strong>pas</strong> du code. C'est la logique de résolution, écrite dans un langage neutre (compréhensible par un humain) appelé <strong>pseudocode</strong> — littéralement « presque du code ». Le code réel (Python, Java…) n'est que la <strong>traduction</strong> de cette logique dans un langage que l'ordinateur comprend.</div>
<h3>2. Les 5 propriétés d'un bon algorithme</h3>
<ul>
<li><strong>Fini</strong> : il se termine toujours après un nombre limité d'étapes.</li>
<li><strong>Précis</strong> : chaque instruction est sans ambiguïté (« ajouter du sel » est ambigu, « ajouter 5 g de sel » est précis).</li>
<li><strong>Ordonné</strong> : l'ordre des étapes compte (on casse l'œuf avant de le battre).</li>
<li><strong>Général</strong> : il fonctionne pour toutes les entrées valides, pas pour un seul cas.</li>
<li><strong>Effectif</strong> : chaque étape est réalisable en pratique.</li>
</ul>
<h3>3. La structure Entrée → Traitement → Sortie</h3>
<p>Tout algorithme suit le même schéma : il <strong>reçoit</strong> des données (l'<strong>entrée</strong>), les <strong>transforme</strong> (le <strong>traitement</strong>), puis <strong>renvoie</strong> un résultat (la <strong>sortie</strong>). Voici un exemple de la vie courante, écrit en pseudocode. Chaque ligne est commentée après le symbole <code>//</code> (qui introduit un commentaire : un texte pour l'humain, ignoré lors de l'exécution) :</p>
<pre class="pseudo">ALGORITHME PréparerThé              // ligne de titre : le mot-clé ALGORITHME suivi d'un nom
DEBUT                               // mot-clé qui marque le début des étapes
    Faire bouillir de l'eau          // étape 1 (traitement)
    Mettre un sachet dans la tasse   // étape 2 (traitement)
    Verser l'eau dans la tasse       // étape 3 (traitement)
    Attendre 3 minutes               // étape 4 (traitement)
    Retirer le sachet                // étape 5 (traitement)
FIN                                 // mot-clé qui marque la fin de l'algorithme</pre>
<h3>4. Notre convention de pseudocode</h3>
<p>Tout le mois, nous écrirons les algorithmes ainsi :</p>
<pre class="pseudo">ALGORITHME NomDeLAlgorithme          // le mot-clé ALGORITHME puis le nom qu'on choisit
DEBUT                                // ouvre le corps : la liste des étapes commence ici
    instruction 1                    // une action, décalée vers la droite (« indentée »)
    instruction 2                    // l'action suivante, sur sa propre ligne
    ...                              // et ainsi de suite, une instruction par ligne
FIN                                  // ferme le corps : l'algorithme est terminé</pre>
<p>Les <strong>mots-clés</strong> (mots réservés du langage, comme ALGORITHME, DEBUT, FIN) s'écrivent en MAJUSCULES ; on met une seule instruction par ligne ; et le contenu est <strong>indenté</strong> (décalé vers la droite) entre DEBUT et FIN, pour montrer d'un coup d'œil ce qui est « à l'intérieur ».</p>
<div class="warn">L'ordinateur fait <strong>exactement</strong> ce qu'on lui dit, jamais ce qu'on a voulu dire. Une étape oubliée ou mal ordonnée = un résultat faux.</div>`,
  exercises: [
    { type: "qcm", q: "Un algorithme est…", opts: ["Un langage de programmation", "Une suite finie et ordonnée d'instructions qui résout un problème", "Un ordinateur", "Un fichier informatique"], a: 1, exp: "L'algorithme est la méthode de résolution ; le langage n'est qu'un moyen de l'exprimer." },
    { type: "vf", q: "Une recette de cuisine peut être considérée comme un algorithme.", a: true, exp: "Elle a des entrées (ingrédients), des étapes ordonnées et une sortie (le plat)." },
    { type: "vf", q: "Un algorithme peut ne jamais se terminer et rester correct.", a: false, exp: "Un algorithme doit être FINI : il se termine toujours." },
    { type: "qcm", q: "Quel schéma suit tout algorithme ?", opts: ["Sortie → Entrée → Traitement", "Traitement → Sortie → Entrée", "Entrée → Traitement → Sortie", "Entrée → Sortie → Traitement"], a: 2, exp: "On reçoit des données, on les transforme, on renvoie un résultat." },
    { type: "qcm", q: "Laquelle de ces instructions est la plus PRÉCISE ?", opts: ["Ajouter un peu de sucre", "Chauffer le four", "Attendre un moment", "Verser 250 ml de lait"], a: 3, exp: "Une quantité chiffrée ne laisse aucune ambiguïté." },
    { type: "vf", q: "Dans un algorithme, l'ordre des instructions n'a pas d'importance.", a: false, exp: "L'ordre est essentiel : « ouvrir la porte puis sortir » ≠ « sortir puis ouvrir la porte »." },
    { type: "qcm", q: "Le pseudocode sert à…", opts: ["Faire fonctionner l'ordinateur directement", "Décrire la logique d'un algorithme indépendamment de tout langage", "Chiffrer des données", "Dessiner des schémas"], a: 1, exp: "Le pseudocode se traduit ensuite dans n'importe quel langage." },
    { type: "input", q: "Complète : un algorithme reçoit des données appelées <em>entrées</em>, les traite, puis produit un résultat appelé …", a: ["sortie", "une sortie", "la sortie", "sorties"], ph: "un mot", exp: "Entrée → Traitement → Sortie." },
    { type: "qcm", q: "« Se brosser les dents » : quel ordre est correct ?", opts: ["Rincer, brosser, mettre le dentifrice", "Mettre le dentifrice, brosser, rincer", "Brosser, mettre le dentifrice, rincer", "Rincer, mettre le dentifrice, brosser"], a: 1, exp: "Les étapes doivent suivre l'ordre logique du monde réel." },
    { type: "vf", q: "Un algorithme correct doit fonctionner pour TOUTES les entrées valides, pas seulement pour un exemple.", a: true, exp: "C'est la propriété de généralité." },
    { type: "qcm", q: "Par quel mot-clé commence le corps d'un algorithme dans notre convention ?", opts: ["START", "FIN", "DEBUT", "ALGO"], a: 2, exp: "Le corps est encadré par DEBUT et FIN." },
    { type: "input", q: "Dans notre convention, quel mot-clé termine un algorithme ?", a: ["FIN", "fin"], ph: "mot-clé", exp: "DEBUT ouvre, FIN ferme." },
    { type: "qcm", q: "Pour l'algorithme « calculer la moyenne de deux notes », quelles sont les ENTRÉES ?", opts: ["La moyenne", "Les deux notes", "La calculatrice", "Le professeur"], a: 1, exp: "Les entrées sont les données fournies ; la moyenne est la sortie." },
    { type: "vf", q: "Deux algorithmes différents peuvent résoudre le même problème.", a: true, exp: "Il existe souvent plusieurs méthodes ; certaines sont plus rapides que d'autres (on verra ça au jour 28)." },
    { type: "qcm", q: "Pourquoi l'ordinateur a-t-il besoin d'instructions si précises ?", opts: ["Parce qu'il est lent", "Parce qu'il exécute littéralement ce qu'on écrit, sans deviner l'intention", "Parce qu'il ne connaît pas le français", "Parce qu'il manque de mémoire"], a: 1, exp: "L'ordinateur n'interprète pas : il exécute." }
  ],
  final: {
    title: "Exercice final — L'algorithme du distributeur",
    intro: "<p>Un distributeur de boissons doit servir un client. Remets de l'ordre dans sa logique en répondant aux questions : elles reprennent TOUT ce qu'on a vu aujourd'hui.</p>",
    questions: [
      { type: "qcm", q: "Quelles sont les ENTRÉES de l'algorithme du distributeur ?", opts: ["La boisson distribuée", "L'argent inséré et le choix du client", "Le bruit de la machine", "La monnaie rendue"], a: 1, exp: "Ce que la machine reçoit : pièces + choix. Boisson et monnaie sont des sorties." },
      { type: "qcm", q: "Quel est le bon ordre des étapes ?", opts: ["Distribuer la boisson → vérifier le montant → lire le choix", "Lire le choix → vérifier le montant → distribuer la boisson → rendre la monnaie", "Rendre la monnaie → distribuer → lire le choix", "Vérifier le montant → rendre la monnaie → lire le choix"], a: 1, exp: "L'ordre logique : choix, vérification, distribution, monnaie." },
      { type: "vf", q: "L'étape « vérifier que le montant inséré est suffisant » peut être supprimée sans changer le comportement.", a: false, exp: "Sans elle, la machine distribuerait des boissons gratuites : chaque étape a un rôle." },
      { type: "input", q: "La boisson distribuée et la monnaie rendue sont les … de l'algorithme (un mot).", a: ["sorties", "sortie", "les sorties"], ph: "un mot", exp: "Ce que produit l'algorithme = ses sorties." },
      { type: "qcm", q: "La machine sert 1 client puis s'arrête d'elle-même : quelle propriété respecte-t-elle ?", opts: ["La généralité", "La finitude", "L'ambiguïté", "La rapidité"], a: 1, exp: "Elle se termine après un nombre fini d'étapes : elle est finie." }
    ],
    solution: `<p>Solution modèle en pseudocode (chaque ligne est commentée après <code>//</code>) :</p>
<pre class="pseudo">ALGORITHME Distributeur              // nom de l'algorithme
// Entrées : montant inséré, choix du client   // rappel des données reçues
// Sorties : boisson, monnaie                   // rappel de ce qui est produit
DEBUT                                // début des étapes
    Lire le choix du client          // ENTRÉE : on récupère le choix du client
    Lire le montant inséré           // ENTRÉE : on récupère l'argent inséré
    Vérifier que le montant est suffisant   // TRAITEMENT : contrôle avant de servir
    Distribuer la boisson choisie    // SORTIE : la machine donne la boisson
    Rendre la monnaie                // SORTIE : la machine rend l'appoint
FIN                                  // fin de l'algorithme</pre>
<p>On retrouve : des entrées, un traitement ordonné, des sorties, et un algorithme fini, précis et général (il marche pour tout client).</p>`
  }
};
</script>
