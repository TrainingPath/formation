<script>
var DAY = {
  num: 24,
  title: "Le tri à bulles",
  subtitle: "Ton premier algorithme de tri : les grandes valeurs remontent comme des bulles.",
  theory: `
<h3>1. Pourquoi trier ?</h3>
<p><strong>Trier</strong>, c'est ranger les éléments d'un <strong>tableau</strong> dans un ordre précis (du plus petit au plus grand, par exemple). Rappel : un <strong>tableau</strong> est une suite de <strong>cases</strong> numérotées, contenant chacune une valeur, comme une rangée de casiers alignés et étiquetés 1, 2, 3… Trier un tableau, c'est exactement ce qu'on fait avec un jeu de cartes en main : on remet les cartes dans l'ordre. Un tableau trié permet la <strong>dichotomie</strong> (jour 23 — la recherche qui coupe l'intervalle en deux à chaque étape, comme on cherche un mot dans un dictionnaire sans lire toutes les pages), des affichages lisibles, la détection de <strong>doublons</strong> (deux valeurs identiques ; une fois triées, elles se retrouvent côte à côte, donc faciles à repérer)… Le tri est l'opération la plus étudiée de l'informatique. On commence par le plus intuitif : le <strong>tri à bulles</strong>.</p>
<h3>2. L'idée : comparer les voisins</h3>
<p>On <strong>parcourt</strong> le tableau — c'est-à-dire qu'on visite ses cases une par une, de gauche à droite — en comparant chaque case à sa <strong>voisine</strong> de droite (la case située juste après elle). Si elles sont dans le mauvais ordre (celle de gauche est plus grande que celle de droite, alors qu'on veut ranger du plus petit au plus grand), on les <strong>échange</strong> : on permute leurs contenus. Cet échange se fait avec la <strong>variable temporaire</strong> du jour 2 (une boîte mise de côté qui sauvegarde une valeur le temps de la déplacer, comme quand on vide une tasse pleine dans un verre vide avant de reverser, pour ne rien perdre). Après un <strong>passage</strong> complet (un balayage entier du tableau), la plus grande valeur a « remonté » tout au bout, comme une bulle d'air remonte à la surface de l'eau — d'où le nom de l'algorithme.</p>
<pre class="pseudo">// UN passage sur t = [ 5 ][ 2 ][ 8 ][ 3 ]     // on compare chaque case à sa voisine de droite
5 &gt; 2 ? OUI → échange : [ 2 ][ 5 ][ 8 ][ 3 ]   // 5 est plus grand que 2 : on permute les deux cases
5 &gt; 8 ? non → rien     : [ 2 ][ 5 ][ 8 ][ 3 ]   // 5 n'est pas plus grand que 8 : on ne touche à rien
8 &gt; 3 ? OUI → échange : [ 2 ][ 5 ][ 3 ][ 8 ]   // 8 est plus grand que 3 : on permute les deux cases
// le 8 (le maximum) est arrivé au bout !        // la plus grande valeur a « bullé » jusqu'à la fin</pre>
<h3>3. L'algorithme complet</h3>
<p>Un passage place UN élément à sa position définitive (le plus grand restant). Pour n éléments, il faut n−1 passages : après avoir placé les n−1 plus grands, le dernier se retrouve forcément à sa place tout seul. On utilise deux boucles l'une dans l'autre — des <strong>boucles imbriquées</strong> (jour 13) : la boucle <strong>externe</strong> compte les passages, la boucle <strong>interne</strong> fait les comparaisons de voisins. L'<strong>indice</strong> <code>i</code> est le numéro de la case courante, et <code>t[i]</code> se lit « la case numéro i du tableau t ». La <strong>borne</strong> (la valeur limite d'une boucle) interne s'arrête à <code>n - passage</code> car la fin du tableau est déjà triée. Chaque ligne est commentée après le symbole <code>//</code> :</p>
<pre class="pseudo">POUR passage DE 1 A n - 1 FAIRE            // boucle EXTERNE : on répète n−1 passages
    POUR i DE 1 A n - passage FAIRE        // boucle INTERNE : i parcourt les paires à comparer (la fin est déjà triée !)
        SI t[i] > t[i + 1] ALORS           // la case i est-elle plus grande que sa voisine de droite ?
            aux ← t[i]                     // OUI : on sauvegarde t[i] dans aux (l'échange du jour 2)
            t[i] ← t[i + 1]                // la case i reçoit la valeur de sa voisine
            t[i + 1] ← aux                 // la voisine reçoit la valeur sauvegardée : échange terminé
        FINSI                              // fin du test (si NON, on n'a rien changé)
    FINPOUR                                // fin de la boucle interne = fin d'un passage
FINPOUR                                    // fin de la boucle externe = tri terminé</pre>
<div class="tip">La borne interne <code>n - passage</code> rétrécit : après le passage 1, la dernière case est définitivement à sa place ; après le passage 2, les deux dernières… Inutile d'y retourner.</div>
<h3>4. Trace complète sur [ 5 ][ 2 ][ 8 ][ 3 ]</h3>
<p>Faire la <strong>trace</strong> (jour 2), c'est jouer soi-même le rôle de l'ordinateur en notant l'état du tableau après chaque passage, comme si on exécutait les étapes à la main :</p>
<pre class="pseudo">Départ     : [ 5 ][ 2 ][ 8 ][ 3 ]                              // tableau de départ, non trié
Passage 1  : [ 2 ][ 5 ][ 3 ][ 8 ]   ← 8 placé                  // la plus grande valeur (8) est au bout
Passage 2  : [ 2 ][ 3 ][ 5 ][ 8 ]   ← 5 placé (et déjà tout trié)   // 5 rejoint sa place définitive
Passage 3  : [ 2 ][ 3 ][ 5 ][ 8 ]   ← rien à faire             // plus aucun échange : le tri est fini
</pre>
<h3>5. Optimisation : s'arrêter si rien ne bouge</h3>
<p>Si un passage entier ne fait AUCUN échange, c'est que tout est déjà en ordre : on peut sortir tout de suite. On détecte ça avec un <strong>drapeau</strong> (jour 16) : une variable <strong>booléenne</strong> (qui ne peut valoir que VRAI ou FAUX, comme un interrupteur allumé/éteint) qu'on « lève » (on la met à VRAI) dès qu'un échange a eu lieu. La boucle <strong>RÉPÉTER … JUSQU'À</strong> répète le bloc autant de fois que nécessaire, et ne s'arrête que lorsque la condition finale est vraie :</p>
<pre class="pseudo">RÉPÉTER                                    // on répète un passage complet…
    echange ← FAUX                         // au début du passage, on suppose : aucun échange pour l'instant
    POUR i DE 1 A n - 1 FAIRE              // on parcourt toutes les paires de voisins
        SI t[i] > t[i + 1] ALORS           // deux voisins dans le mauvais ordre ?
            échanger t[i] et t[i+1]        // OUI : on les permute (via une variable temporaire)
            echange ← VRAI                 // on lève le drapeau : un échange a eu lieu ce passage
        FINSI                              // fin du test
    FINPOUR                                // fin du passage
JUSQU'À echange = FAUX                     // …tant qu'un passage bouge ; si rien n'a bougé, on sort</pre>
<h3>6. Combien de travail ?</h3>
<p>Une <strong>comparaison</strong> est une opération élémentaire (« cette case est-elle plus grande que sa voisine ? »). Au pire (tableau trié à l'envers, ce qu'on appelle le <strong>pire cas</strong> : la situation la plus défavorable), il faut environ n × n / 2 comparaisons. Pour n = 1000 : ~500 000 opérations. On parle de croissance <strong>quadratique</strong> (le travail grandit comme le <em>carré</em> du nombre d'éléments : doubler n multiplie le travail par 4). Le tri à bulles est simple mais lent — parfait pour apprendre, à éviter pour un million de données (jour 28 en reparlera).</p>`,
  exercises: [
    { type: "qcm", q: "Sur quoi porte chaque comparaison du tri à bulles ?", opts: ["Deux cases quelconques", "Deux cases VOISINES : t[i] et t[i+1]", "La première et la dernière", "Le milieu"], a: 1, exp: "Voisins seulement : le désordre se corrige de proche en proche." },
    { type: "qcm", q: "Que se passe-t-il quand t[i] > t[i+1] ?", opts: ["On les échange (avec une variable auxiliaire)", "On supprime t[i]", "On s'arrête", "On les additionne"], a: 0, exp: "L'échange du jour 2 : aux ← t[i] ; t[i] ← t[i+1] ; t[i+1] ← aux." },
    { type: "qcm", q: "Après le premier passage complet, que garantit-on ?", opts: ["Le tableau est trié", "La PLUS GRANDE valeur est à sa place définitive (au bout)", "La plus petite est au début", "Rien"], a: 1, exp: "La grosse bulle remonte jusqu'au bout ; le reste peut être encore désordonné." },

    { type: "input", q: "Combien de passages au maximum pour trier n = 6 éléments ?", a: "5", ph: "nombre", exp: "n − 1 = 5 : chaque passage place au moins un élément, le dernier se place tout seul." },
    { type: "qcm", q: "Pourquoi la boucle interne va-t-elle jusqu'à n − passage ?", opts: ["Erreur du cours", "La fin du tableau est déjà triée : les éléments placés n'ont plus à être comparés", "Pour éviter les nombres négatifs", "Pour trier à l'envers"], a: 1, exp: "Après p passages, les p dernières cases sont définitives." },
    { type: "qcm", q: "L'échange <code>t[i] ← t[i+1] ; t[i+1] ← t[i]</code> (sans aux) donne quoi ?", opts: ["Un échange correct", "Les deux cases finissent avec la MÊME valeur : l'une est perdue", "Un tri plus rapide", "Une erreur de syntaxe"], a: 1, exp: "Le piège du jour 2, revenu se venger. TOUJOURS une variable auxiliaire." },
    { type: "qcm", q: "t = [ 7 ][ 3 ]. Trace le tri complet. Résultat ?", opts: ["[ 3 ][ 7 ]", "[ 7 ][ 3 ]", "[ 3 ][ 3 ]", "[ 7 ][ 7 ]"], a: 0, exp: "Un seul passage, un seul échange : trié." },
    { type: "input", q: "t = [ 3 ][ 1 ][ 4 ][ 1 ][ 5 ]. Combien d'ÉCHANGES pendant le premier passage ? (compare : 3-1, 3-4, 4-1, 4-5)", a: "2", ph: "nombre", exp: "3>1 : échange. 3>4 : non. 4>1 : échange. 4>5 : non. → 2 échanges, t = [1][3][1][4][5]." },
    { type: "qcm", q: "Quel est le PIRE tableau pour le tri à bulles (le plus de travail) ?", opts: ["Déjà trié", "Trié à l'envers : chaque paire est en désordre", "Tout égal", "Aléatoire"], a: 1, exp: "[5][4][3][2][1] : échange à CHAQUE comparaison." },
    { type: "qcm", q: "Avec l'optimisation du drapeau, que fait le tri sur un tableau DÉJÀ trié ?", opts: ["n−1 passages quand même", "UN passage sans échange, puis arrêt immédiat", "Zéro passage", "Il le détrie"], a: 1, exp: "echange reste FAUX au premier passage → sortie. Meilleur cas : un seul balayage." },
    { type: "input", q: "Tableau de 4 éléments, boucle interne de 1 à n−passage : combien de comparaisons AU TOTAL sur les 3 passages ? (3 + 2 + 1)", a: "6", ph: "nombre", exp: "3+2+1 = 6. En général : n(n−1)/2, la fameuse croissance quadratique." },
    { type: "qcm", q: "Pour trier en ordre DÉCROISSANT, on change quoi ?", opts: ["Rien", "La comparaison : SI t[i] < t[i+1] ALORS échanger", "La variable aux", "Le nombre de passages"], a: 1, exp: "On inverse juste le sens du désordre. Un caractère !" },
    { type: "qcm", q: "Après le tri, on veut chercher une valeur très souvent. Quel duo gagnant ?", opts: ["Trier une fois, puis dichotomie à chaque recherche", "Recherche séquentielle à chaque fois", "Trier avant chaque recherche", "Ne jamais trier"], a: 0, exp: "Le coût du tri s'amortit : chaque recherche passe de n à log n. Les jours 23 et 24 travaillent ensemble." },
    { type: "vf", q: "Le tri à bulles sur 1000 éléments fait au pire environ 500 000 comparaisons.", a: true, exp: "n(n−1)/2 ≈ 500 000. Simple mais quadratique : on comprend pourquoi d'autres tris existent." }
  ],
  final: {
    title: "Exercice final — Trace maîtresse",
    intro: `<p>Trie <code>t = [ 6 ][ 2 ][ 9 ][ 4 ]</code> (n = 4) avec le tri à bulles, passage par passage, et réponds :</p>`,

      { type: "qcm", q: "Passage 1 (comparaisons 6-2, 6-9, 9-4) : quel tableau à la fin ?", opts: ["[ 2 ][ 6 ][ 4 ][ 9 ]", "[ 2 ][ 4 ][ 6 ][ 9 ]", "[ 6 ][ 2 ][ 4 ][ 9 ]", "[ 2 ][ 6 ][ 9 ][ 4 ]"], a: 0, exp: "6>2 échange · 6>9 non · 9>4 échange → [2][6][4][9]. Le 9 est placé." },

      { type: "input", q: "Le tableau trié permet maintenant la dichotomie. Pour chercher 4 dans [ 2 ][ 4 ][ 6 ][ 9 ] : milieu = (1+4) DIV 2 = 2, t[2] = 4… combien de comparaisons ?", a: "1", ph: "nombre", exp: "Trouvé du premier coup ! Tri + dichotomie : le duo du siècle." }
    ],
    solution: `<p>Trace intégrale (chaque ligne montre un passage ; ✔ = échange, ✘ = pas d'échange) :</p>
<pre class="pseudo">Départ    : [ 6 ][ 2 ][ 9 ][ 4 ]                                       // tableau de départ, non trié
Passage 1 : 6&gt;2 ✔ → [2][6][9][4] · 6&gt;9 ✘ · 9&gt;4 ✔ → [2][6][4][9]      // 2 échanges, le 9 est placé au bout
Passage 2 : 2&gt;6 ✘ · 6&gt;4 ✔ → [2][4][6][9]                              // 1 échange, le tableau est déjà trié
Passage 3 : 2&gt;4 ✘ → aucun échange → TRIÉ (arrêt anticipé)              // drapeau reste FAUX : on s'arrête</pre>
<p>Le tri à bulles assemble tout ton savoir : boucles imbriquées (j13), échange (j2), comparaison de voisins (j15), drapeau (j16). Demain : deux tris plus malins.</p>`
  }
};

      "Ta copie ressemble à ceci : <br><code>PROCÉDURE permuter(t, a, b)</code> · trois affectations<br><code>PROCÉDURE triBulle(t, n)</code> · deux boucles, un test, un appel à la permutation<br>une boucle de saisie à double condition d'arrêt<br>puis la version améliorée, avec un booléen et une borne qui décroît."
    ],
    solution: "PROCEDURE permuter(t : TABLEAU D'ENTIERS, a : ENTIER, b : ENTIER)\n/* elle ne sait rien du tri : elle echange deux cases, c'est tout */\nVar\n    temp : ENTIER\nDEBUT\n    temp <- t[a]\n    t[a] <- t[b]\n    t[b] <- temp\nFIN\n\nPROCEDURE triBulle(t : TABLEAU D'ENTIERS, n : ENTIER)\n/* version naive : (n-1)^2 comparaisons, quel que soit le desordre */\nVar\n    i, p : ENTIER\nDEBUT\n    POUR p DE 1 A n - 1 FAIRE\n        POUR i DE 1 A n - 1 FAIRE\n            SI t[i] > t[i + 1] ALORS\n                permuter(t, i, i + 1)   /* le tri n'echange jamais lui-meme */\n            FINSI\n        FINPOUR\n    FINPOUR\nFIN\n\nPROCEDURE triBulleAmeliore(t : TABLEAU D'ENTIERS, n : ENTIER)\nVar\n    i, fin : ENTIER\n    permute : BOOLEEN\nDEBUT\n    fin <- n - 1\n    permute <- VRAI\n    /* 1re amelioration : on s'arrete des qu'un passage ne permute rien —\n       le tableau est alors trie, continuer ne changerait plus rien */\n    TANT QUE permute ET fin > 0 FAIRE\n        permute <- FAUX\n        POUR i DE 1 A fin FAIRE\n            SI t[i] > t[i + 1] ALORS\n                permuter(t, i, i + 1)\n                permute <- VRAI\n            FINSI\n        FINPOUR\n        /* 2e amelioration : la derniere case est desormais a sa place\n           definitive, inutile de la revisiter au passage suivant */\n        fin <- fin - 1\n    FINTANTQUE\nFIN\n\nAlgorithme TriDesEntrees\nConst\n    CAPACITE = 20\nVar\n    entree : TABLEAU[1..20] D'ENTIERS\n    valeur, nb, i : ENTIER\nDebut\n    /* a) DOUBLE condition d'arret : la sentinelle OU le tableau plein */\n    nb <- 0\n    REPETER\n        Ecrire(\"Entrees de la seance (0 pour terminer) ?\")\n        Lire(valeur)\n        SI valeur <> 0 ALORS\n            nb <- nb + 1\n            entree[nb] <- valeur\n        FINSI\n    JUSQU'A valeur = 0 OU nb = CAPACITE\n\n    SI nb = 0 ALORS\n        Ecrire(\"Aucune seance saisie\")\n    SINON\n        /* l'effectif REEL voyage avec le tableau : trier jusqu'a 20 ferait\n           entrer au classement des cases jamais remplies */\n        triBulleAmeliore(entree, nb)\n\n        Ecrire(\"Classement des \", nb, \" seance(s) :\")\n        POUR i DE 1 A nb FAIRE\n            Ecrire(\"  \", i, \" — \", entree[i], \" entrees\")\n        FINPOUR\n    FINSI\nFin",
    reponses: [
      { ref: "d", texte: "Sur les entrées 12 · 7 · 19 · 3 · 25 · 8, la version naïve effectue <code>(6 − 1)² = 25</code> comparaisons et 7 échanges, en cinq passages. La version améliorée effectue <strong>14 comparaisons</strong> et les mêmes 7 échanges, en quatre passages seulement. Les échanges ne changent pas — ce sont les mêmes désordres à défaire — mais plus d'un tiers des comparaisons étaient du travail pur perdu : elles portaient soit sur des cases déjà à leur place définitive, soit sur un passage entier qui n'avait plus rien à faire." },
      { ref: "Réflexion", texte: "<strong>La différence entre passer une valeur et passer un tableau.</strong> Un entier passé en paramètre est recopié : le sous-programme travaille sur un double, et l'original reste intact. Un tableau, lui, n'est pratiquement jamais recopié — ce serait absurde, il peut contenir des millions de cases — et ce que le sous-programme reçoit est un moyen d'atteindre <em>le</em> tableau, pas une copie de son contenu. Les modifications qu'il y fait sont donc réelles et visibles de l'appelant. C'est ce qui rend la procédure de permutation possible, et c'est aussi ce qui la rend dangereuse : la garantie du jour 21 — « un sous-programme ne peut rien casser chez son appelant » — <strong>ne s'applique plus</strong> aux tableaux. La prudence à observer en découle directement. D'abord, un sous-programme qui reçoit un tableau doit dire clairement dans son nom s'il le modifie : <code>permuter</code> et <code>triBulle</code> annoncent une action, là où <code>estTrie</code> ou <code>maximum</code> annonceraient une simple consultation. Ensuite, il ne faut jamais supposer qu'un tableau ressort intact d'un appel sans avoir lu le sous-programme. Enfin, quand on a besoin de l'original <em>et</em> du résultat, c'est à l'appelant de faire la copie avant l'appel : personne d'autre ne le fera. <strong>Le tableau déjà trié.</strong> Sans amélioration : 25 comparaisons, exactement comme dans le pire cas — l'algorithme naïf ne sait pas qu'il n'a rien à faire, et il fait cinq passages complets pour s'en convaincre. Avec l'amélioration : <strong>5 comparaisons</strong>, un seul passage. Le booléen reste faux, la boucle s'arrête, et l'on est passé de 25 à 5. C'est le meilleur cas, et il n'est pas théorique : dans la vraie vie, les données à trier sont très souvent presque triées — un fichier auquel on ajoute quelques lignes, un classement qu'on remet à jour. L'arrêt anticipé ne change rien au pire cas, qui reste en <code>(n − 1)²</code>, mais il transforme le comportement sur le cas fréquent. C'est un arbitrage courant : améliorer le cas moyen sans toucher au pire vaut souvent mieux que l'inverse." }

    pourquoi: "La procédure de permutation reçoit le tableau et deux <em>indices</em>, plutôt que deux valeurs. Lui passer <code>t[i]</code> et <code>t[i+1]</code> serait plus naturel à lire — mais elle recevrait alors deux copies d'entiers, les échangerait chez elle, et le tableau ne bougerait pas d'un cran. C'est exactement la procédure sans effet du jour 21, et le tri tournerait sans jamais rien trier : aucune erreur, un classement final identique à la saisie.",

      { ref: "d", texte: "Affiche le podium — les trois premiers avec leur rang — puis le classement complet, et l'écart de score entre le premier et le dernier." }

    reflexion: "Deux tableaux parallèles tiennent ensemble uniquement parce que ton algorithme les déplace ensemble : rien dans leur déclaration ne l'impose. Décris ce qui se produirait si un seul échange oubliait le tableau des pseudonymes, et dis à quel moment on s'en apercevrait. Puis : la stabilité repose sur une seule différence, entre une comparaison stricte et une comparaison large. Explique le mécanisme, et donne une situation où l'on <em>voudrait</em> au contraire un tri instable.",
    indices: [
      "Deux tableaux, un seul classement. Chaque opération qui touche l'un doit toucher l'autre au même indice — et le meilleur moyen de ne pas l'oublier est de n'avoir qu'un seul endroit dans l'algorithme où l'on déplace quoi que ce soit.",
      "Le plan : remplir les deux tableaux dans la même boucle. Écrire une permutation qui échange les deux tableaux d'un coup. Écrire le tri, qui l'appelle. Puis parcourir le résultat pour le podium et le classement.",
      "En pseudocode, pour la permutation : trois affectations sur le tableau des scores, trois autres sur celui des pseudonymes, avec deux variables de passage de types différents. Pour le tri : la comparaison porte sur les scores, et l'échange déplace tout.",
      "Le point délicat est le sens de la comparaison. Un tri croissant échange quand la case de gauche est plus grande ; un tri décroissant échange quand elle est plus <em>petite</em>. Le seul caractère qui change est le symbole de comparaison — et une inversion accidentelle donne un classement parfaitement ordonné, dans le mauvais sens, ce qui se repère à l'œil mais pas à la lecture du code.",
      "Ta copie ressemble à ceci : <br><code>PROCÉDURE permuterJoueurs(scores, pseudos, a, b)</code> · six affectations<br><code>PROCÉDURE classer(scores, pseudos, n)</code> · deux boucles, une comparaison stricte, un appel<br>puis le podium et le classement complet."
    ],
    solution: "PROCEDURE permuterJoueurs(score : TABLEAU D'ENTIERS,\n                          pseudo : TABLEAU DE CHAINES,\n                          a : ENTIER, b : ENTIER)\n/* UN SEUL endroit dans tout l'algorithme deplace des joueurs : c'est ce qui\n   garantit que les deux tableaux ne pourront jamais se desynchroniser */\nVar\n    tempScore : ENTIER\n    tempPseudo : CHAINE\nDEBUT\n    tempScore <- score[a]\n    score[a] <- score[b]\n    score[b] <- tempScore\n\n    tempPseudo <- pseudo[a]\n    pseudo[a] <- pseudo[b]\n    pseudo[b] <- tempPseudo\nFIN\n\nPROCEDURE classer(score : TABLEAU D'ENTIERS, pseudo : TABLEAU DE CHAINES,\n                  n : ENTIER)\nVar\n    i, fin : ENTIER\n    permute : BOOLEEN\nDEBUT\n    fin <- n - 1\n    permute <- VRAI\n    TANT QUE permute ET fin > 0 FAIRE\n        permute <- FAUX\n        POUR i DE 1 A fin FAIRE\n            /* DECROISSANT : on echange quand la gauche est plus PETITE.\n               Comparaison STRICTE : a egalite on n'echange pas, donc l'ordre\n               d'inscription est preserve — c'est la stabilite. */\n            SI score[i] < score[i + 1] ALORS\n                permuterJoueurs(score, pseudo, i, i + 1)\n                permute <- VRAI\n            FINSI\n        FINPOUR\n        fin <- fin - 1\n    FINTANTQUE\nFIN\n\nAlgorithme ClassementDuTournoi\nConst\n    N = 8\nVar\n    score : TABLEAU[1..8] D'ENTIERS\n    pseudo : TABLEAU[1..8] DE CHAINES\n    i : ENTIER\nDebut\n    /* les deux tableaux sont remplis dans la MEME boucle : c'est la seule\n       chose qui etablit la correspondance entre leurs cases */\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"Pseudonyme du joueur \", i, \" ?\")\n        Lire(pseudo[i])\n        Ecrire(\"Score ?\")\n        Lire(score[i])\n    FINPOUR\n\n    classer(score, pseudo, N)\n\n    Ecrire(\"--- PODIUM ---\")\n    POUR i DE 1 A 3 FAIRE\n        Ecrire(\"  \", i, \". \", pseudo[i], \" — \", score[i], \" pts\")\n    FINPOUR\n\n    Ecrire(\"--- CLASSEMENT COMPLET ---\")\n    POUR i DE 1 A N FAIRE\n        Ecrire(\"  \", i, \". \", pseudo[i], \" — \", score[i], \" pts\")\n    FINPOUR\n\n    Ecrire(\"Ecart premier-dernier : \", score[1] - score[N], \" pts\")\nFin",

      { ref: "c", texte: "La stabilité est garantie par la comparaison <strong>stricte</strong> : <code>score[i] &lt; score[i + 1]</code>. Deux joueurs à égalité ne déclenchent aucun échange, donc leur ordre relatif ne bouge jamais — et comme ils ont été rangés dans l'ordre d'inscription au remplissage, cet ordre survit au tri. Avec une comparaison large, deux joueurs à égalité s'échangeraient à chaque passage où ils se croisent, et le classement dépendrait du nombre de passages, c'est-à-dire du désordre du reste du tableau. Deux tournois avec les mêmes ex æquo et des scores différents ailleurs donneraient deux podiums différents." },
      { ref: "Réflexion", texte: "<strong>L'échange incomplet.</strong> Si un seul échange oubliait le tableau des pseudonymes, les scores continueraient de se ranger correctement, mais un pseudonyme se retrouverait en face du score d'un autre — et à partir de là, tous les échanges suivants propageraient l'erreur. Le classement final serait parfaitement ordonné par score décroissant, ce qui est le seul contrôle qu'on fait spontanément, et il attribuerait la première place à quelqu'un qui ne l'a pas gagnée. <em>On ne s'en apercevrait pas du tout</em> à la lecture du classement : il n'y a aucune incohérence interne, juste des noms au mauvais endroit. On s'en apercevrait au moment de la remise des prix, quand le joueur qui a le meilleur score constaterait qu'on appelle quelqu'un d'autre — et encore, seulement si les participants se souviennent de leur score. C'est le meilleur argument pour n'avoir qu'un seul endroit qui déplace : la faute devient impossible plutôt que rare. C'est aussi ce qui, dans un vrai langage, pousserait à réunir pseudonyme et score dans une seule structure : deux tableaux parallèles ne sont qu'une convention, une fiche unique est une garantie. <strong>Le tri instable est parfois souhaitable</strong> — plus exactement, l'instabilité est parfois le prix qu'on accepte de payer. Les tris les plus rapides connus, ceux qui déplacent les valeurs sur de longues distances plutôt que de voisin en voisin, sont instables par construction : c'est précisément parce qu'ils ne respectent pas le voisinage qu'ils vont vite. Sur des données où les valeurs égales sont interchangeables — trier des nombres nus, sans étiquette attachée — la stabilité ne sert à rien et il serait absurde de payer pour elle. La règle : la stabilité compte dès que les éléments triés portent une information que la clé de tri ne contient pas, et elle est sans objet quand la clé <em>est</em> l'élément." }

    solution: "ALGORITHME TriBulles                     // nom de l'algorithme\nVARIABLES T : TABLEAU[1..N] D'ENTIERS    // le tableau à trier\n          p, i, temp : ENTIER            // p = n° de passe, i = position, temp = échange\nDEBUT                                    // début des instructions\n    POUR p DE 1 A N - 1 FAIRE            // N-1 passes suffisent à tout trier\n        POUR i DE 1 A N - p FAIRE        // à chaque passe, la fin du tableau est déjà triée\n            SI T[i] > T[i + 1] ALORS     // deux voisins dans le mauvais ordre ?\n                temp ← T[i]              // 1) sauvegarde la 1re valeur\n                T[i] ← T[i + 1]          // 2) la 2e prend la place de la 1re\n                T[i + 1] ← temp          // 3) la sauvegarde prend la place de la 2e\n            FINSI                        // fin de l'échange conditionnel\n        FINPOUR                          // fin de la passe courante\n    FINPOUR                              // fin de toutes les passes\n    POUR i DE 1 A N FAIRE                // parcours d'affichage\n        Écrire(T[i])                     // montre chaque élément, désormais en ordre\n    FINPOUR                              // fin de l'affichage\nFIN                                      // fin de l'algorithme",
