<script>
var DAY = {
  num: 24,
  title: "Le tri à bulles",
  subtitle: "Ton premier algorithme de tri : les grandes valeurs remontent comme des bulles.",
  theory: `
<h3>1. Pourquoi trier ?</h3>
<p><strong>Trier</strong>, c'est ranger les éléments d'un <strong>tableau</strong> dans un ordre précis (du plus petit au plus grand, par exemple). Rappel : un <strong>tableau</strong> est une suite de <strong>cases</strong> numérotées, contenant chacune une valeur, comme une rangée de casiers alignés et étiquetés 1, 2, 3… Trier un tableau, c'est exactement ce qu'on fait avec un jeu de cartes en main : on remet les cartes dans l'ordre. Un tableau trié permet la <strong>dichotomie</strong> (jour 23 — la recherche qui coupe l'intervalle en deux à chaque étape, comme on cherche un mot dans un dictionnaire sans lire toutes les pages), des affichages lisibles, la détection de <strong>doublons</strong> (deux valeurs identiques ; une fois triées, elles se retrouvent côte à côte, donc faciles à repérer)… Le tri est l'opération la plus étudiée de l'informatique. On commence par le plus intuitif : le <strong>tri à bulles</strong>.</p>
<h3>2. L'idée : comparer les voisins</h3>
<p>On <strong>parcourt</strong> le tableau — c'est-à-dire qu'on visite ses cases une par une, de gauche à droite — en comparant chaque case à sa <strong>voisine</strong> de droite (la case située juste après elle). Si elles sont dans le mauvais ordre (celle de gauche est plus grande que celle de droite, alors qu'on veut ranger du plus petit au plus grand), on les <strong>échange</strong> : on permute leurs contenus. Cet échange se fait avec la <strong>variable temporaire</strong> du jour 2 (une boîte mise de côté qui sauvegarde une valeur le temps de la déplacer, comme quand on vide une tasse pleine dans un verre vide avant de reverser, pour ne rien perdre). Après un <strong>passage</strong> complet (un balayage entier du tableau), la plus grande valeur a « remonté » tout au bout, comme une bulle d'air remonte à la surface de l'eau — d'où le nom de l'algorithme.</p>
<pre class="pseudo">// UN passage sur t = [ 5 ][ 2 ][ 8 ][ 3 ]     // on compare chaque case à sa voisine de droite
5 &gt; 2 ? OUI → échange : [ 2 ][ 5 ][ 8 ][ 3 ]   // 5 est plus grand que 2 : on permute les deux cases
5 &gt; 8 ? non → rien     : [ 2 ][ 5 ][ 8 ][ 3 ]   // 5 n'est pas plus grand que 8 : on ne touche à rien
8 &gt; 3 ? OUI → échange : [ 2 ][ 5 ][ 3 ][ 8 ]   // 8 est plus grand que 3 : on permute les deux cases
// le 8 (le maximum) est arrivé au bout !        // la plus grande valeur a « bullé » jusqu'à la fin</pre>
<h3>3. L'algorithme complet</h3>
<p>Un passage place UN élément à sa position définitive (le plus grand restant). Pour n éléments, il faut n−1 passages : après avoir placé les n−1 plus grands, le dernier se retrouve forcément à sa place tout seul. On utilise deux boucles l'une dans l'autre — des <strong>boucles imbriquées</strong> (jour 13) : la boucle <strong>externe</strong> compte les passages, la boucle <strong>interne</strong> fait les comparaisons de voisins. L'<strong>indice</strong> <code>i</code> est le numéro de la case courante, et <code>t[i]</code> se lit « la case numéro i du tableau t ». La <strong>borne</strong> (la valeur limite d'une boucle) interne s'arrête à <code>n - passage</code> car la fin du tableau est déjà triée. Chaque ligne est commentée après le symbole <code>//</code> :</p>
<pre class="pseudo">POUR passage DE 1 A n - 1 FAIRE            // boucle EXTERNE : on répète n−1 passages
    POUR i DE 1 A n - passage FAIRE        // boucle INTERNE : i parcourt les paires à comparer (la fin est déjà triée !)
        SI t[i] > t[i + 1] ALORS           // la case i est-elle plus grande que sa voisine de droite ?
            aux ← t[i]                     // OUI : on sauvegarde t[i] dans aux (l'échange du jour 2)
            t[i] ← t[i + 1]                // la case i reçoit la valeur de sa voisine
            t[i + 1] ← aux                 // la voisine reçoit la valeur sauvegardée : échange terminé
        FINSI                              // fin du test (si NON, on n'a rien changé)
    FINPOUR                                // fin de la boucle interne = fin d'un passage
FINPOUR                                    // fin de la boucle externe = tri terminé</pre>
<div class="tip">La borne interne <code>n - passage</code> rétrécit : après le passage 1, la dernière case est définitivement à sa place ; après le passage 2, les deux dernières… Inutile d'y retourner.</div>
<h3>4. Trace complète sur [ 5 ][ 2 ][ 8 ][ 3 ]</h3>
<p>Faire la <strong>trace</strong> (jour 2), c'est jouer soi-même le rôle de l'ordinateur en notant l'état du tableau après chaque passage, comme si on exécutait les étapes à la main :</p>
<pre class="pseudo">Départ     : [ 5 ][ 2 ][ 8 ][ 3 ]                              // tableau de départ, non trié
Passage 1  : [ 2 ][ 5 ][ 3 ][ 8 ]   ← 8 placé                  // la plus grande valeur (8) est au bout
Passage 2  : [ 2 ][ 3 ][ 5 ][ 8 ]   ← 5 placé (et déjà tout trié)   // 5 rejoint sa place définitive
Passage 3  : [ 2 ][ 3 ][ 5 ][ 8 ]   ← rien à faire             // plus aucun échange : le tri est fini
</pre>
<h3>5. Optimisation : s'arrêter si rien ne bouge</h3>
<p>Si un passage entier ne fait AUCUN échange, c'est que tout est déjà en ordre : on peut sortir tout de suite. On détecte ça avec un <strong>drapeau</strong> (jour 16) : une variable <strong>booléenne</strong> (qui ne peut valoir que VRAI ou FAUX, comme un interrupteur allumé/éteint) qu'on « lève » (on la met à VRAI) dès qu'un échange a eu lieu. La boucle <strong>RÉPÉTER … JUSQU'À</strong> répète le bloc autant de fois que nécessaire, et ne s'arrête que lorsque la condition finale est vraie :</p>
<pre class="pseudo">RÉPÉTER                                    // on répète un passage complet…
    echange ← FAUX                         // au début du passage, on suppose : aucun échange pour l'instant
    POUR i DE 1 A n - 1 FAIRE              // on parcourt toutes les paires de voisins
        SI t[i] > t[i + 1] ALORS           // deux voisins dans le mauvais ordre ?
            échanger t[i] et t[i+1]        // OUI : on les permute (via une variable temporaire)
            echange ← VRAI                 // on lève le drapeau : un échange a eu lieu ce passage
        FINSI                              // fin du test
    FINPOUR                                // fin du passage
JUSQU'À echange = FAUX                     // …tant qu'un passage bouge ; si rien n'a bougé, on sort</pre>
<h3>6. Combien de travail ?</h3>
<p>Une <strong>comparaison</strong> est une opération élémentaire (« cette case est-elle plus grande que sa voisine ? »). Au pire (tableau trié à l'envers, ce qu'on appelle le <strong>pire cas</strong> : la situation la plus défavorable), il faut environ n × n / 2 comparaisons. Pour n = 1000 : ~500 000 opérations. On parle de croissance <strong>quadratique</strong> (le travail grandit comme le <em>carré</em> du nombre d'éléments : doubler n multiplie le travail par 4). Le tri à bulles est simple mais lent — parfait pour apprendre, à éviter pour un million de données (jour 28 en reparlera).</p>`,
  exercises: [
    { type: "qcm", q: "Sur quoi porte chaque comparaison du tri à bulles ?", opts: ["Deux cases quelconques", "Deux cases VOISINES : t[i] et t[i+1]", "La première et la dernière", "Le milieu"], a: 1, exp: "Voisins seulement : le désordre se corrige de proche en proche." },
    { type: "qcm", q: "Que se passe-t-il quand t[i] > t[i+1] ?", opts: ["On les échange (avec une variable auxiliaire)", "On supprime t[i]", "On s'arrête", "On les additionne"], a: 0, exp: "L'échange du jour 2 : aux ← t[i] ; t[i] ← t[i+1] ; t[i+1] ← aux." },
    { type: "qcm", q: "Après le premier passage complet, que garantit-on ?", opts: ["Le tableau est trié", "La PLUS GRANDE valeur est à sa place définitive (au bout)", "La plus petite est au début", "Rien"], a: 1, exp: "La grosse bulle remonte jusqu'au bout ; le reste peut être encore désordonné." },
    { type: "qcm", q: "t = [ 4 ][ 9 ][ 1 ]. Après UN passage, le tableau est…", opts: ["[ 4 ][ 1 ][ 9 ]", "[ 1 ][ 4 ][ 9 ]", "[ 9 ][ 4 ][ 1 ]", "[ 4 ][ 9 ][ 1 ]"], a: 0, exp: "4>9 ? non. 9>1 ? oui, échange → [4][1][9]. Le 9 est placé, le début reste à trier." },
    { type: "input", q: "Combien de passages au maximum pour trier n = 6 éléments ?", a: "5", ph: "nombre", exp: "n − 1 = 5 : chaque passage place au moins un élément, le dernier se place tout seul." },
    { type: "qcm", q: "Pourquoi la boucle interne va-t-elle jusqu'à n − passage ?", opts: ["Erreur du cours", "La fin du tableau est déjà triée : les éléments placés n'ont plus à être comparés", "Pour éviter les nombres négatifs", "Pour trier à l'envers"], a: 1, exp: "Après p passages, les p dernières cases sont définitives." },
    { type: "qcm", q: "L'échange <code>t[i] ← t[i+1] ; t[i+1] ← t[i]</code> (sans aux) donne quoi ?", opts: ["Un échange correct", "Les deux cases finissent avec la MÊME valeur : l'une est perdue", "Un tri plus rapide", "Une erreur de syntaxe"], a: 1, exp: "Le piège du jour 2, revenu se venger. TOUJOURS une variable auxiliaire." },
    { type: "qcm", q: "t = [ 7 ][ 3 ]. Trace le tri complet. Résultat ?", opts: ["[ 3 ][ 7 ]", "[ 7 ][ 3 ]", "[ 3 ][ 3 ]", "[ 7 ][ 7 ]"], a: 0, exp: "Un seul passage, un seul échange : trié." },
    { type: "input", q: "t = [ 3 ][ 1 ][ 4 ][ 1 ][ 5 ]. Combien d'ÉCHANGES pendant le premier passage ? (compare : 3-1, 3-4, 4-1, 4-5)", a: "2", ph: "nombre", exp: "3>1 : échange. 3>4 : non. 4>1 : échange. 4>5 : non. → 2 échanges, t = [1][3][1][4][5]." },
    { type: "qcm", q: "Quel est le PIRE tableau pour le tri à bulles (le plus de travail) ?", opts: ["Déjà trié", "Trié à l'envers : chaque paire est en désordre", "Tout égal", "Aléatoire"], a: 1, exp: "[5][4][3][2][1] : échange à CHAQUE comparaison." },
    { type: "qcm", q: "Avec l'optimisation du drapeau, que fait le tri sur un tableau DÉJÀ trié ?", opts: ["n−1 passages quand même", "UN passage sans échange, puis arrêt immédiat", "Zéro passage", "Il le détrie"], a: 1, exp: "echange reste FAUX au premier passage → sortie. Meilleur cas : un seul balayage." },
    { type: "input", q: "Tableau de 4 éléments, boucle interne de 1 à n−passage : combien de comparaisons AU TOTAL sur les 3 passages ? (3 + 2 + 1)", a: "6", ph: "nombre", exp: "3+2+1 = 6. En général : n(n−1)/2, la fameuse croissance quadratique." },
    { type: "qcm", q: "Pour trier en ordre DÉCROISSANT, on change quoi ?", opts: ["Rien", "La comparaison : SI t[i] < t[i+1] ALORS échanger", "La variable aux", "Le nombre de passages"], a: 1, exp: "On inverse juste le sens du désordre. Un caractère !" },
    { type: "qcm", q: "Après le tri, on veut chercher une valeur très souvent. Quel duo gagnant ?", opts: ["Trier une fois, puis dichotomie à chaque recherche", "Recherche séquentielle à chaque fois", "Trier avant chaque recherche", "Ne jamais trier"], a: 0, exp: "Le coût du tri s'amortit : chaque recherche passe de n à log n. Les jours 23 et 24 travaillent ensemble." },
    { type: "vf", q: "Le tri à bulles sur 1000 éléments fait au pire environ 500 000 comparaisons.", a: true, exp: "n(n−1)/2 ≈ 500 000. Simple mais quadratique : on comprend pourquoi d'autres tris existent." }
  ],
  final: {
    title: "Exercice final — Trace maîtresse",
    intro: `<p>Trie <code>t = [ 6 ][ 2 ][ 9 ][ 4 ]</code> (n = 4) avec le tri à bulles, passage par passage, et réponds :</p>`,
    questions: [
      { type: "qcm", q: "Passage 1 (comparaisons 6-2, 6-9, 9-4) : quel tableau à la fin ?", opts: ["[ 2 ][ 6 ][ 4 ][ 9 ]", "[ 2 ][ 4 ][ 6 ][ 9 ]", "[ 6 ][ 2 ][ 4 ][ 9 ]", "[ 2 ][ 6 ][ 9 ][ 4 ]"], a: 0, exp: "6>2 échange · 6>9 non · 9>4 échange → [2][6][4][9]. Le 9 est placé." },
      { type: "input", q: "Combien d'échanges pendant ce passage 1 ?", a: "2", ph: "nombre", exp: "(6,2) et (9,4)." },
      { type: "qcm", q: "Passage 2 (comparaisons sur les 3 premières cases : 2-6, 6-4) : quel tableau ?", opts: ["[ 2 ][ 4 ][ 6 ][ 9 ]", "[ 4 ][ 2 ][ 6 ][ 9 ]", "[ 2 ][ 6 ][ 4 ][ 9 ]", "[ 9 ][ 6 ][ 4 ][ 2 ]"], a: 0, exp: "2>6 non · 6>4 échange → [2][4][6][9]. Déjà trié !" },
      { type: "qcm", q: "Passage 3 (comparaison 2-4) : que détecte la version optimisée ?", opts: ["Un échange", "Aucun échange → drapeau FAUX → arrêt : le tableau est trié", "Une erreur", "Il faut un 4ᵉ passage"], a: 1, exp: "Le drapeau evite le travail inutile." },
      { type: "input", q: "Le tableau trié permet maintenant la dichotomie. Pour chercher 4 dans [ 2 ][ 4 ][ 6 ][ 9 ] : milieu = (1+4) DIV 2 = 2, t[2] = 4… combien de comparaisons ?", a: "1", ph: "nombre", exp: "Trouvé du premier coup ! Tri + dichotomie : le duo du siècle." }
    ],
    solution: `<p>Trace intégrale (chaque ligne montre un passage ; ✔ = échange, ✘ = pas d'échange) :</p>
<pre class="pseudo">Départ    : [ 6 ][ 2 ][ 9 ][ 4 ]                                       // tableau de départ, non trié
Passage 1 : 6&gt;2 ✔ → [2][6][9][4] · 6&gt;9 ✘ · 9&gt;4 ✔ → [2][6][4][9]      // 2 échanges, le 9 est placé au bout
Passage 2 : 2&gt;6 ✘ · 6&gt;4 ✔ → [2][4][6][9]                              // 1 échange, le tableau est déjà trié
Passage 3 : 2&gt;4 ✘ → aucun échange → TRIÉ (arrêt anticipé)              // drapeau reste FAUX : on s'arrête</pre>
<p>Le tri à bulles assemble tout ton savoir : boucles imbriquées (j13), échange (j2), comparaison de voisins (j15), drapeau (j16). Demain : deux tris plus malins.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton pseudocode ici…",
  items: [
  { id: "algo-tribulles", title: "Le tri à bulles", level: 3,
    statement: "Un tableau <code>T</code> de <code>N</code> entiers est rempli. Écris l'algorithme du <strong>tri à bulles</strong> (ordre croissant), puis affiche le tableau trié.",
    hints: [
      "Principe : comparer chaque paire de voisins T[i] et T[i+1], et les échanger s'ils sont dans le mauvais ordre. Répéter des passes entières.",
      "L'échange demande une variable temporaire : temp ← T[i] ; T[i] ← T[i+1] ; T[i+1] ← temp.",
      "Deux boucles imbriquées : la passe p de 1 à N-1, et à l'intérieur i de 1 à N-p (les derniers éléments sont déjà à leur place)."
    ],
    solution: "ALGORITHME TriBulles                     // nom de l'algorithme\nVARIABLES T : TABLEAU[1..N] D'ENTIERS    // le tableau à trier\n          p, i, temp : ENTIER            // p = n° de passe, i = position, temp = échange\nDEBUT                                    // début des instructions\n    POUR p DE 1 A N - 1 FAIRE            // N-1 passes suffisent à tout trier\n        POUR i DE 1 A N - p FAIRE        // à chaque passe, la fin du tableau est déjà triée\n            SI T[i] > T[i + 1] ALORS     // deux voisins dans le mauvais ordre ?\n                temp ← T[i]              // 1) sauvegarde la 1re valeur\n                T[i] ← T[i + 1]          // 2) la 2e prend la place de la 1re\n                T[i + 1] ← temp          // 3) la sauvegarde prend la place de la 2e\n            FINSI                        // fin de l'échange conditionnel\n        FINPOUR                          // fin de la passe courante\n    FINPOUR                              // fin de toutes les passes\n    POUR i DE 1 A N FAIRE                // parcours d'affichage\n        Écrire(T[i])                     // montre chaque élément, désormais en ordre\n    FINPOUR                              // fin de l'affichage\nFIN                                      // fin de l'algorithme",
    note: "À chaque passe, le plus grand élément restant « remonte » comme une bulle en fin de tableau — d'où le nom." }
  ]
};
</script>
