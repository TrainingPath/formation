<p>Bienvenue au <strong>jour 31</strong> : le <strong>bilan</strong> (le récapitulatif final) du mois. Un bilan, c'est comme la révision de la veille d'un examen : on ne découvre rien de nouveau, on <strong>rassemble</strong> tout ce qu'on a appris pour vérifier que c'est bien en place. Cette page tient sur une seule carte. Si un mot te semble flou, c'est normal : chaque terme technique est redéfini ci-dessous avec une image concrète, et le jour d'origine est rappelé entre crochets (par exemple <code>[J9]</code> = jour 9) pour que tu puisses y retourner.</p>
<h3>Le mois en une carte</h3>
<p>Voici l'itinéraire des 31 jours, regroupé en quatre semaines. Attention : ce bloc n'est <strong>pas du pseudocode</strong> (ce ne sont pas des instructions à exécuter), mais une <strong>carte des thèmes</strong> — une table des matières visuelle. Chaque mot est un thème vu pendant le mois ; le point médian <code>·</code> sépare simplement les sujets d'une même journée.</p>

<h3>Les réflexes qui doivent être automatiques</h3>
<p>Un <strong>réflexe</strong>, c'est un geste devenu automatique, qu'on fait sans réfléchir (comme freiner à vélo quand un obstacle surgit). Voici les huit réflexes de l'algorithmicien. Chaque phrase courte est le mémo à retenir ; le texte qui suit le redéfinit pour un débutant total.</p>
<ul>
<li><strong>Trace = tableau des variables ligne par ligne.</strong> La <strong>trace</strong> (dérouler un algorithme à la main, en jouant le rôle de l'ordinateur, un peu comme on suit une recette étape par étape) se note dans un <strong>tableau</strong> : une colonne par <strong>variable</strong> (une boîte nommée qui contient une valeur) et une ligne par instruction. Après chaque ligne, on met à jour la ou les valeurs qui changent. C'est le meilleur moyen de ne jamais se tromper.</li>
<li><strong>Initialiser AVANT, tester, faire progresser.</strong> C'est la discipline de toute <strong>boucle</strong> (une répétition d'instructions). <strong>Initialiser</strong> veut dire donner une valeur de départ à une variable (comme remettre le compteur d'un stade à 0 avant le match) — et ça se fait AVANT d'entrer dans la boucle. Puis on <strong>teste</strong> la condition d'arrêt (« doit-on continuer ? »), et enfin on <strong>fait progresser</strong> la variable à chaque tour (sinon la boucle tourne à l'infini et ne s'arrête jamais).</li>
<li><strong>Somme → 0, produit → 1, chaîne → "", champion → t[1].</strong> Les bonnes valeurs de départ selon ce qu'on calcule. Une <strong>somme</strong> (un total qu'on obtient en additionnant) part de 0, car ajouter 0 ne change rien. Un <strong>produit</strong> (un total qu'on obtient en multipliant) part de 1, car multiplier par 1 ne change rien. Une <strong>chaîne</strong> (une suite de caractères, c'est-à-dire du texte) part de <code>""</code>, le texte vide (une chaîne sans aucune lettre). Un <strong>champion</strong> (la meilleure valeur trouvée jusqu'ici, un maximum ou un minimum) part de la première case du tableau, notée <code>t[1]</code> (la valeur rangée à la position 1).</li>
<li><strong>Accès t[i+1] → borne n−1. Toujours penser débordement.</strong> Quand on lit la case suivante <code>t[i+1]</code> (la valeur juste après la case numéro <code>i</code>), il faut arrêter la boucle à l'avant-dernière case, soit <code>n−1</code> (où <code>n</code> est le nombre total de cases). Sinon on réclame une case qui n'existe pas : c'est le <strong>débordement</strong> (sortir des limites du tableau, comme chercher un 13e œuf dans une boîte qui n'en contient que 12). Une <strong>borne</strong> est simplement une limite à ne pas dépasser.</li>
<li><strong>« Combien ? » compteur · « Total ? » accumulateur · « Le plus ? » max · « Existe ? » drapeau.</strong> On reconnaît l'outil à la question posée. « Combien y en a-t-il ? » → un <strong>compteur</strong> (une variable qu'on augmente de 1 à chaque élément qui compte, comme un tourniquet à l'entrée d'un concert). « Quel est le total ? » → un <strong>accumulateur</strong> (une variable dans laquelle on cumule, on additionne au fur et à mesure). « Quel est le plus grand / le plus petit ? » → un <strong>max</strong> (ou un min). « Est-ce que ça existe ? » → un <strong>drapeau</strong> (une variable vrai/faux, comme un interrupteur qu'on met sur « vrai » dès qu'on a trouvé ce qu'on cherchait).</li>
<li><strong>Trié → dichotomie. Non trié → séquentielle (ou trier d'abord).</strong> Pour chercher une valeur dans un tableau : s'il est <strong>trié</strong> (rangé dans l'ordre, du plus petit au plus grand), on utilise la <strong>dichotomie</strong> (couper la zone de recherche en deux moitiés à chaque étape, comme dans un dictionnaire papier où l'on ouvre au milieu — extrêmement rapide). S'il n'est pas trié, on utilise la recherche <strong>séquentielle</strong> (regarder les cases une par une, du début à la fin, jusqu'à trouver), ou bien on le trie d'abord.</li>
<li><strong>Récursion = cas de base + rétrécissement.</strong> La <strong>récursion</strong> (ou récursivité) est un algorithme qui s'appelle lui-même sur un problème plus petit, comme des poupées russes qui en contiennent chacune une plus petite. Elle a toujours deux ingrédients obligatoires : un <strong>cas de base</strong> (une situation si simple qu'on la résout directement, sans se rappeler soi-même — sans lui, l'algorithme ne s'arrêterait jamais) et un <strong>rétrécissement</strong> (à chaque appel, le problème devient plus petit et se rapproche du cas de base).</li>
<li><strong>Toujours : « et si n = 1 million ? » et « et si c'est vide ? »</strong> Deux réflexes de prudence. « Et si <code>n</code> (le nombre d'éléments) valait 1 million ? » teste la <strong>complexité</strong> (la façon dont le temps de calcul grandit quand les données grandissent — un algorithme peut être instantané sur 10 données et interminable sur un million). « Et si le tableau était vide ? » teste les <strong>cas limites</strong> (les situations extrêmes, comme zéro élément, qui font souvent planter un algorithme mal écrit).</li>
</ul>
<div class="tip">L'examen ci-dessous pioche dans les 30 jours. Vise 100 % — et si un thème résiste, retourne à son jour : c'est exactement pour ça que ce cours reste consultable.</div>`,

<pre class="pseudo">// A. statistiques (un parcours)                        // PARTIE A : on parcourt le tableau UNE seule fois pour tout calculer
max ← s[1] ; somme ← s[1] ; nbElite ← 0                 // valeurs de départ : champion = 1er score, total = 1er score, compteur d'élite = 0
SI s[1] >= 70 ALORS nbElite ← 1 FINSI                   // le 1er score compte-t-il déjà comme élite (>= 70) ? si oui, compteur = 1

    solution: "/* ---------------------------------------------------------------\n   LES CINQ TACHES, DANS L'ORDRE, AVEC LEUR JOUR D'ORIGINE :\n     1. normaliser les noms                        [J19]\n     2. detecter les doublons                      [J19]  <- AVANT le tri\n     3. classer par magnitude croissante           [J24]\n     4. compter les peu observes, moyenner         [J12]\n     5. rechercher un objet par son nom            [J16]\n   Les taches 2 et 3 ne peuvent pas etre interverties : voir la reflexion.\n   --------------------------------------------------------------- */\n\nPROCEDURE permuterObjet(nom : TABLEAU DE CHAINES, norme : TABLEAU DE CHAINES,\n                        mag : TABLEAU DE REELS, nuits : TABLEAU D'ENTIERS,\n                        a : ENTIER, b : ENTIER)\nVar\n    tc : CHAINE\n    tr : REEL\n    te : ENTIER\nDEBUT\n    tc <- nom[a]   : nom[a] <- nom[b]     : nom[b] <- tc\n    tc <- norme[a] : norme[a] <- norme[b] : norme[b] <- tc\n    tr <- mag[a]   : mag[a] <- mag[b]     : mag[b] <- tr\n    te <- nuits[a] : nuits[a] <- nuits[b] : nuits[b] <- te\nFIN\n\nAlgorithme DepouillementCeleste\nConst\n    SEUIL_NUITS = 3\nVar\n    nom, norme : TABLEAU[1..100] DE CHAINES\n    mag : TABLEAU[1..100] DE REELS\n    nuits : TABLEAU[1..100] D'ENTIERS\n    n, i, j, k, doublons, peuObserves : ENTIER\n    total, moyenne : REEL\n    permute : BOOLEEN\n    cherche : CHAINE\nDebut\n    Ecrire(\"Nombre de releves ?\")\n    Lire(n)\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"Nom de l'objet \", i, \" ?\")\n        Lire(nom[i])\n        norme[i] <- MAJUSCULE(nom[i])      /* 1. normalisation [J19] */\n        Ecrire(\"Magnitude ?\")\n        Lire(mag[i])\n        Ecrire(\"Nuits d'observation ?\")\n        Lire(nuits[i])\n    FINPOUR\n\n    /* 2. DOUBLONS — AVANT le tri, sur les formes normalisees. Comparaison\n          deux a deux en triangle : j part apres i (jour 19). */\n    doublons <- 0\n    POUR i DE 1 A n - 1 FAIRE\n        POUR j DE i + 1 A n FAIRE\n            SI norme[i] = norme[j] ALORS\n                Ecrire(\"Doublon : releves \", i, \" et \", j, \" — \", nom[i])\n                doublons <- doublons + 1\n            FINSI\n        FINPOUR\n    FINPOUR\n    Ecrire(doublons, \" doublon(s) detecte(s)\")\n\n    /* 3. CLASSEMENT par magnitude CROISSANTE : la plus petite magnitude est\n          l'objet le plus brillant. Les QUATRE tableaux se deplacent\n          ensemble (jour 24). */\n    k <- n - 1\n    permute <- VRAI\n    TANT QUE permute ET k > 0 FAIRE\n        permute <- FAUX\n        POUR i DE 1 A k FAIRE\n            SI mag[i] > mag[i + 1] ALORS\n                permuterObjet(nom, norme, mag, nuits, i, i + 1)\n                permute <- VRAI\n            FINSI\n        FINPOUR\n        k <- k - 1\n    FINTANTQUE\n\n    Ecrire(\"--- Du plus brillant au moins brillant ---\")\n    total <- 0\n    peuObserves <- 0\n    POUR i DE 1 A n FAIRE\n        Ecrire(\"  \", i, \". \", nom[i], \" — magnitude \", mag[i],\n               \" — \", nuits[i], \" nuit(s)\")\n        total <- total + mag[i]                    /* 4. accumulateur [J12] */\n        SI nuits[i] < SEUIL_NUITS ALORS            /* seuil FIXE [J12] */\n            peuObserves <- peuObserves + 1\n        FINSI\n    FINPOUR\n    moyenne <- total / n\n    Ecrire(\"Magnitude moyenne : \", Arrondi(moyenne, 2))\n    Ecrire(peuObserves, \" objet(s) observe(s) moins de \", SEUIL_NUITS, \" nuits\")\n\n    /* 5. RECHERCHE par nom — SEQUENTIELLE et non dichotomique : le tableau\n          est trie sur la MAGNITUDE, pas sur le nom. Couper en deux n'aurait\n          aucun sens, les noms etant dans un ordre quelconque (jour 23). */\n    Ecrire(\"Objet recherche ?\")\n    Lire(cherche)\n    cherche <- MAJUSCULE(cherche)\n    i <- 1\n    TANT QUE i <= n ET norme[i] <> cherche FAIRE\n        i <- i + 1\n    FINTANTQUE\n    SI i <= n ALORS\n        Ecrire(\"Trouve au rang \", i, \" — magnitude \", mag[i])\n    SINON\n        Ecrire(\"Objet absent du releve\")\n    FINSI\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Pourquoi la dichotomie est interdite ici.</strong> Elle repose entièrement sur un raisonnement d'élimination : « la valeur cherchée est plus grande que celle du milieu, donc elle ne peut être que dans la seconde moitié ». Ce raisonnement exige que le tableau soit ordonné <em>selon le critère qu'on interroge</em>. Or mon tableau est trié sur la magnitude, et je cherche par nom : les noms se trouvent dans l'ordre où les magnitudes les ont placés, c'est-à-dire dans un ordre quelconque. Comparer le nom cherché à celui du milieu ne permet d'éliminer aucune moitié — la réponse peut être n'importe où. Pour rendre la dichotomie possible, il faudrait un second tableau des noms trié alphabétiquement, portant en regard le rang de chaque objet dans le tableau principal : c'est ce qu'on appelle un <em>index secondaire</em>, et c'est exactement ce que fait une base de données quand on lui demande de pouvoir chercher sur deux colonnes. Le prix est la duplication et la nécessité de tenir cet index à jour à chaque modification. <strong>Les deux tâches qui ne peuvent pas être interverties</strong> sont la détection de doublons et le classement. Il faut détecter <em>avant</em> de trier, et cela pour une raison précise : la détection compare deux à deux et signale des <em>rangs</em> — « relevés 3 et 17 ». Après un tri, ces rangs ne désignent plus les lignes du relevé d'origine mais des positions dans le classement, et l'astronome qui voudrait corriger son carnet chercherait aux mauvais endroits. Le tri déplace les données <em>et les numéros de ligne avec</em>, ce qui rend inutilisable toute information exprimée en rangs et calculée après. C'est un cas particulier d'une règle générale : toute grandeur exprimée en positions doit être calculée et consommée avant qu'on ne réordonne, ou recalculée après. À l'inverse, trier d'abord serait tentant, puisque des doublons triés se retrouvent côte à côte et se détectent alors en un seul parcours au lieu d'un parcours en triangle — un gain réel, qu'il faudrait payer en renonçant aux rangs d'origine. <strong>Les sept jours réutilisés :</strong> jour 12 pour l'accumulateur et le compteur sous condition, jour 16 pour la recherche séquentielle, jour 17 pour la moyenne, jour 19 pour la normalisation et la détection de doublons, jour 23 pour la condition de la dichotomie — invoquée ici pour dire qu'elle n'est pas remplie —, jour 24 pour le tri à bulles amélioré et le déplacement de tableaux parallèles, et jour 20 pour la procédure de permutation." }
    ],
    pourquoi: "La normalisation est faite au moment de la saisie, dans le même parcours, plutôt que dans une boucle séparée. Ce n'est pas seulement un parcours économisé : c'est la garantie qu'aucun objet ne pourra jamais exister dans le tableau des noms sans exister dans celui des formes normalisées. Deux boucles successives laisseraient une fenêtre où les deux tableaux n'ont pas la même longueur, et suffiraient à décaler tout le relevé le jour où l'on ajouterait un filtre à la saisie.",

    ],
    note: "Trie le relevé par nom au lieu de la magnitude : la recherche peut-elle alors devenir dichotomique ? Et le classement par brillance, que devient-il ?" },

  { num: "31.3", titre: "La file du guichet — 4 / 4", niveau: 3, domaine: "guichet et services",

    reflexion: "Ce dernier algorithme est une réunion, et la question qui compte est de savoir ce qu'on a appris à ne <em>pas</em> faire. Cite trois pièges rencontrés pendant le mois que cet exercice t'aurait fait commettre si tu ne les connaissais pas, et dis pour chacun comment tu les as évités. Puis : le taux d'occupation peut valoir 60 % alors que la file n'a jamais désempli. Comment est-ce possible, et qu'est-ce que cela dit de la valeur d'un indicateur pris isolément ? Enfin, en regardant les trente et un jours : quel est, selon toi, le seul réflexe qui, s'il devait n'en rester qu'un, sauverait le plus d'erreurs ?",
    indices: [

      "Le plan : deux files et leurs repères, un compteur de prioritaires consécutifs, un tableau de suivi des dossiers traités, et les compteurs de bilan. Le menu enchaîne arrivée, appel et état. Le bilan se calcule à la fermeture, en parcourant le tableau de suivi.",

      "Ta copie ressemble à ceci : <br>les six étapes esquissées<br>deux jeux de repères, un compteur de consécutifs, deux tableaux de suivi<br>un menu à quatre choix<br>un bilan qui parcourt le suivi et calcule cinq grandeurs."

    solution: "Algorithme GuichetJourneeComplete\nConst\n    CAPACITE = 20\n    MAX_PRIO_CONSECUTIFS = 3\nVar\n    prio, normale : TABLEAU[1..20] DE CHAINES\n    tetePrio, queuePrio, nbPrio : ENTIER\n    teteNorm, queueNorm, nbNorm : ENTIER\n    prioConsecutifs : ENTIER\n    /* suivi des dossiers traites */\n    servi : TABLEAU[1..500] DE CHAINES\n    duree : TABLEAU[1..500] D'ENTIERS\n    traites, recusPrio, recusNorm, refus : ENTIER\n    choix, i, d, guichets, ouverture : ENTIER\n    totalDuree, recordDuree, rangRecord : ENTIER\n    moyenne, occupation : REEL\n    nom : CHAINE\n    estPrio, servirPrio : BOOLEEN\nDebut\n    tetePrio <- 1 : queuePrio <- 1 : nbPrio <- 0\n    teteNorm <- 1 : queueNorm <- 1 : nbNorm <- 0\n    prioConsecutifs <- 0\n    traites <- 0 : recusPrio <- 0 : recusNorm <- 0 : refus <- 0\n\n    REPETER\n        Ecrire(\"1.Arrivee 2.Appeler 3.Etat 4.Fermer\")\n        Lire(choix)\n\n        SI choix = 1 ALORS\n            SI nbPrio + nbNorm = CAPACITE ALORS      /* capacite PARTAGEE */\n                Ecrire(\"Local plein\")\n                refus <- refus + 1\n            SINON\n                Ecrire(\"Nom ?\")\n                Lire(nom)\n                Ecrire(\"Prioritaire (VRAI/FAUX) ?\")\n                Lire(estPrio)\n                SI estPrio ALORS\n                    prio[queuePrio] <- nom\n                    queuePrio <- queuePrio + 1\n                    nbPrio <- nbPrio + 1\n                SINON\n                    normale[queueNorm] <- nom\n                    queueNorm <- queueNorm + 1\n                    nbNorm <- nbNorm + 1\n                FINSI\n            FINSI\n\n        SINON SI choix = 2 ALORS\n            /* a) GARANTIE CONTRE LA FAMINE : on ne sert un prioritaire que\n                  si la limite de consecutifs n'est pas atteinte, OU si la\n                  file ordinaire est vide de toute facon. */\n            servirPrio <- nbPrio > 0\n                          ET (prioConsecutifs < MAX_PRIO_CONSECUTIFS\n                              OU nbNorm = 0)\n\n            SI servirPrio ALORS\n                nom <- prio[tetePrio]\n                tetePrio <- tetePrio + 1\n                nbPrio <- nbPrio - 1\n                recusPrio <- recusPrio + 1\n                prioConsecutifs <- prioConsecutifs + 1\n                Ecrire(\"Au guichet : \", nom, \" (prioritaire)\")\n            SINON SI nbNorm > 0 ALORS\n                nom <- normale[teteNorm]\n                teteNorm <- teteNorm + 1\n                nbNorm <- nbNorm - 1\n                recusNorm <- recusNorm + 1\n                prioConsecutifs <- 0        /* la remise a zero EST la garantie */\n                Ecrire(\"Au guichet : \", nom)\n            SINON\n                Ecrire(\"Personne en attente\")\n                nom <- \"\"\n            FINSI\n\n            SI nom <> \"\" ALORS\n                Ecrire(\"Duree du dossier (min) ?\")\n                Lire(d)\n                traites <- traites + 1\n                servi[traites] <- nom       /* b) suivi : nom ET duree, ensemble */\n                duree[traites] <- d\n            FINSI\n\n        SINON SI choix = 3 ALORS\n            Ecrire(nbPrio, \" prioritaire(s), \", nbNorm, \" autre(s) — \",\n                   prioConsecutifs, \" prioritaire(s) d'affilee\")\n\n        SINON SI choix <> 4 ALORS\n            Ecrire(\"Choix inconnu\")\n        FINSI\n    JUSQU'A choix = 4\n\n    /* c) BILAN */\n    Ecrire(\"--- Bilan de la journee ---\")\n    Ecrire(recusPrio, \" prioritaire(s), \", recusNorm, \" autre(s)\")\n    Ecrire(refus, \" refus, \", nbPrio + nbNorm, \" encore present(s)\")\n\n    SI traites = 0 ALORS\n        Ecrire(\"Aucun dossier traite : pas de statistiques\")\n    SINON\n        totalDuree <- 0\n        recordDuree <- duree[1]             /* extremum sur la 1re case [J17] */\n        rangRecord <- 1\n        POUR i DE 1 A traites FAIRE\n            totalDuree <- totalDuree + duree[i]\n            SI duree[i] > recordDuree ALORS\n                recordDuree <- duree[i]\n                rangRecord <- i\n            FINSI\n        FINPOUR\n        moyenne <- totalDuree / traites\n\n        Ecrire(\"Duree moyenne : \", Arrondi(moyenne, 1), \" min\")\n        Ecrire(\"Dossier le plus long : \", servi[rangRecord],\n               \" (\", recordDuree, \" min)\")\n        Ecrire(\"Temps total de traitement : \", totalDuree, \" min\")\n\n        Ecrire(\"Nombre de guichets ouverts ?\")\n        Lire(guichets)\n        Ecrire(\"Duree d'ouverture (min) ?\")\n        Lire(ouverture)\n        SI guichets > 0 ET ouverture > 0 ALORS\n            occupation <- totalDuree * 100 / (guichets * ouverture)\n            Ecrire(\"Taux d'occupation : \", Arrondi(occupation, 1), \" %\")\n\n            /* d) confrontation au dimensionnement d'hier */\n            SI nbPrio + nbNorm > 0 ALORS\n                Ecrire(\"Des usagers n'ont pas ete recus : capacite insuffisante\")\n            SINON SI refus > 0 ALORS\n                Ecrire(\"Des usagers ont ete refuses a l'entree\")\n            SINON\n                Ecrire(\"Tous les usagers ont ete recus\")\n            FINSI\n        FINSI\n    FINSI\nFin",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Trois pièges du mois que cet exercice tend.</strong> Le premier est l'<em>extremum initialisé à zéro</em> : le dossier le plus long est cherché sur des durées, et partir de zéro marcherait ici par chance, puisqu'une durée est positive — mais j'ai pris la première case, comme au jour 17, parce que cette habitude ne dépend d'aucune hypothèse sur les données. Le deuxième est le <em>couple valeur-position mis à jour à moitié</em> : la durée record et le nom de l'usager doivent bouger ensemble, faute de quoi le bilan attribuerait le dossier le plus long à quelqu'un d'autre — c'est le piège des tableaux parallèles du jour 24, et je l'ai évité en tenant les deux tableaux de suivi remplis dans la même instruction. Le troisième est la <em>division par zéro</em> : une journée sans aucun dossier traité ferait échouer la moyenne, et une durée d'ouverture nulle ferait échouer le taux d'occupation. Les deux sont testés avant, comme le pêcheur bredouille du jour 9. J'en ajouterais volontiers un quatrième : le <em>cas oublié dans la garantie contre la famine</em> — si la limite est atteinte mais que la file ordinaire est vide, il faut quand même servir un prioritaire, sinon le guichet reste inoccupé avec des gens qui attendent. <strong>Un taux de 60 % avec une file qui n'a jamais désempli</strong> est parfaitement possible, et c'est le fait le plus instructif de l'exercice. Il suffit que les guichets aient été inoccupés par intermittence — pauses, absences, temps entre deux appels — pendant que la file, elle, était pleine en permanence. Le taux d'occupation mesure ce que les guichets ont <em>fait</em>, pas ce que les usagers ont <em>attendu</em> : ce sont deux grandeurs différentes, et la direction qui lirait « 60 % » conclurait qu'il reste de la marge alors que quarante personnes sont reparties sans être reçues. C'est exactement le défaut relevé au jour 18 avec la séance la mieux suivie et au jour 22 avec le meilleur plat du restaurant : <em>un indicateur pris isolément répond très bien à la question qu'il sait poser, et l'on finit par croire que c'était la bonne question</em>. Le remède est le même à chaque fois : ne jamais publier un indicateur seul, mais toujours avec celui qui pourrait le contredire — ici, le taux d'occupation à côté du nombre de personnes non reçues. <strong>Le réflexe qui sauverait le plus d'erreurs</strong>, s'il ne devait en rester qu'un : <em>dérouler l'algorithme à la main sur un cas limite</em>. Pas sur un cas normal — celui-là marche toujours — mais sur le tableau vide, la valeur nulle, l'égalité exacte, la première et la dernière case. C'est ce qui a fait apparaître, tout au long du mois, la moyenne d'un pêcheur bredouille, la borne de 19 h qui refuse une entrée par jour, le maximum resté à zéro sur des relevés tous négatifs, le décalage de tableau qui recopie la même valeur partout, et le plancher tarifaire qui passe sous son propre plancher. Aucune de ces fautes ne provoque d'erreur ; toutes se voient en deux minutes de papier. C'est le seul geste du mois qui ne demande ni outil, ni machine, ni relecture par quelqu'un d'autre." }
