var DAY = {
  num: 24,
  title: "GitHub Packages : publier des paquets",
  subtitle: "Héberger et distribuer ses bibliothèques et images, au même endroit que le code.",
  theory: `
<h3>1. Un paquet, un registre : les mots-clés</h3>
<p>Un <strong>paquet</strong> (en anglais <em>package</em>) est un module logiciel <strong>empaqueté et versionné</strong>, prêt à être réutilisé : une bibliothèque npm, une image Docker, un artefact Maven… Un <strong>registre</strong> (en anglais <em>registry</em>) est le serveur qui <strong>héberge</strong> ces paquets et permet de les publier et de les installer. <strong>GitHub Packages</strong> est le registre intégré à GitHub : tes paquets vivent à côté de ton code, sous le même contrôle d'accès.</p>
<pre class="pseudo">npm publish  -&gt; registre npm         # bibliotheques JavaScript
docker push  -&gt; registre d'images    # images de conteneurs
mvn deploy   -&gt; registre Maven        # bibliotheques Java
...tous peuvent viser GitHub Packages au lieu d'un registre externe</pre>

<h3>2. Le registre npm de GitHub</h3>
<p>Pour publier un paquet npm sur GitHub, on vise le registre <code>npm.pkg.github.com</code> et on nomme le paquet avec le <strong>scope</strong> de son organisation (<code>@mon-org/nom</code>). Le <strong>scope</strong> est le préfixe <code>@quelquechose/</code> qui rattache un paquet à un compte ou une organisation.</p>
<pre class="pseudo"># package.json
{
  "name": "@mon-org/utils",              # nom SCOPE : @organisation/paquet
  "version": "1.0.0",
  "publishConfig": {
    "registry": "https://npm.pkg.github.com"   # on publie vers GitHub, pas vers npmjs.com
  }
}</pre>

<h3>3. Publier depuis un workflow Actions</h3>
<p>On publie généralement <strong>automatiquement</strong>, souvent au moment d'une release (sur tag, comme au jour 19). L'authentification passe par le <code>GITHUB_TOKEN</code> — pas besoin de créer un jeton personnel pour publier dans <strong>ton propre</strong> dépôt.</p>
<pre class="pseudo">name: Publish
on:
  release:
    types: [ published ]                 # se declenche quand une release est publiee
permissions:
  contents: read
  packages: write                        # AUTORISE le jeton a publier des paquets
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'   # configure npm pour GitHub Packages
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: \${{ secrets.GITHUB_TOKEN }}   # authentification via le jeton fourni</pre>
<div class="warn">La permission <code>packages: write</code> est indispensable pour publier. C'est encore le principe du moindre privilège (jour 17) : on n'accorde <code>write</code> sur les packages que dans le workflow qui en a besoin, et on laisse <code>read</code> ailleurs.</div>

<h3>4. Consommer un paquet publié</h3>
<p>Pour <strong>installer</strong> un paquet scopé hébergé sur GitHub, on indique à npm que le scope pointe vers le registre GitHub, via un fichier <code>.npmrc</code>.</p>
<pre class="pseudo"># .npmrc
@mon-org:registry=https://npm.pkg.github.com   # ce scope vient de GitHub Packages
# puis, normalement :
npm install @mon-org/utils               # installe le paquet publie</pre>
<p>Un paquet peut être <strong>public</strong> (installable par tous) ou <strong>privé</strong> (réservé aux membres autorisés). Un paquet privé exige une authentification à l'installation, elle aussi via un jeton.</p>

<h3>5. Images de conteneurs : le registre ghcr.io</h3>
<pre class="pseudo">- uses: docker/login-action@v3
  with:
    registry: ghcr.io                    # GitHub Container Registry
    username: \${{ github.actor }}         # l'utilisateur qui declenche le workflow
    password: \${{ secrets.GITHUB_TOKEN }} # authentification par le jeton
- run: |
    docker build -t ghcr.io/mon-org/app:latest .
    docker push ghcr.io/mon-org/app:latest   # publie l'image dans GHCR</pre>
<p>Pour les conteneurs, GitHub fournit <strong>ghcr.io</strong> (<em>GitHub Container Registry</em>) : le registre d'images. On s'y connecte avec le <code>GITHUB_TOKEN</code>, on <em>build</em> puis on <em>push</em>. L'image versionnée est alors visible dans l'onglet <strong>Packages</strong> du dépôt.</p>
<div class="tip">Avantage central de GitHub Packages : <strong>un seul endroit</strong> pour le code, les paquets, les permissions et l'historique. Les mêmes règles d'accès que le dépôt s'appliquent au paquet, et la publication s'intègre naturellement à la CI/CD.</p></div>`,
  exercises: [
    { type: "qcm", q: "Un paquet (package) est…", opts: ["Une branche protégée", "Un module logiciel empaqueté et versionné, prêt à réutiliser", "Un secret chiffré", "Un runner"], a: 1, exp: "Bibliothèque, image, artefact… versionné." },

    { type: "input", q: "Quelle permission autorise le jeton à publier des paquets ? Réponds packages: ___", a: ["write", "packages: write"], ph: "packages: ___", exp: "packages: write est requis pour publier." },

    { type: "input", q: "Quel registre GitHub héberge les IMAGES de conteneurs ? (l'hôte)", a: ["ghcr.io"], ph: "un hôte", exp: "ghcr.io = GitHub Container Registry." },
    { type: "input", q: "Dans le workflow npm, quelle variable d'env reçoit le jeton pour npm publish ? (le nom)", a: ["NODE_AUTH_TOKEN"], ph: "un nom", exp: "NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}." },
    { type: "qcm", q: "Un paquet peut être…", opts: ["Uniquement public", "Public ou privé", "Uniquement privé", "Ni l'un ni l'autre"], a: 1, exp: "Privé = accès restreint, authentification à l'installation." },
    { type: "input", q: "Dans quel fichier indique-t-on qu'un scope vient de GitHub Packages côté consommateur ? (le nom du fichier)", a: [".npmrc", "npmrc"], ph: "un nom de fichier", exp: "@mon-org:registry=... dans .npmrc." },
    { type: "qcm", q: "docker/login-action sert à…", opts: ["Construire l'image", "S'authentifier au registre (ghcr.io) avant push", "Créer un tag Git", "Publier sur npm"], a: 1, exp: "Login avant docker push." },
    { type: "vf", q: "On peut publier un paquet automatiquement depuis un workflow, par exemple sur une release.", a: true, exp: "on: release: types: [published]." },
    { type: "qcm", q: "L'avantage central de GitHub Packages :", opts: ["C'est plus lent", "Code, paquets, permissions et historique au même endroit", "Ça supprime la CI", "Ça évite les tags"], a: 1, exp: "Mêmes règles d'accès que le dépôt." },
    { type: "vf", q: "Un paquet privé s'installe sans aucune authentification.", a: false, exp: "Il exige un jeton à l'installation." },
    { type: "qcm", q: "publishConfig.registry dans package.json sert à…", opts: ["Chiffrer le code", "Indiquer vers quel registre npm publie", "Créer une branche", "Lancer les tests"], a: 1, exp: "Ici : npm.pkg.github.com." }
  ],
  final: {

    intro: `<p>Tu publies @mon-org/utils sur GitHub Packages automatiquement quand une release est publiée.</p>`,

      { type: "input", q: "Quel registre configures-tu dans setup-node (registry-url) ? (l'hôte)", a: ["npm.pkg.github.com", "https://npm.pkg.github.com"], ph: "un hôte", exp: "npm.pkg.github.com." },
      { type: "input", q: "Quelle variable d'env reçoit le GITHUB_TOKEN pour npm publish ? (le nom)", a: ["NODE_AUTH_TOKEN"], ph: "un nom", exp: "NODE_AUTH_TOKEN." },
      { type: "qcm", q: "Le déclencheur choisi est…", opts: ["push sur toute branche", "release: types: [published]", "pull_request", "schedule"], a: 1, exp: "On publie au moment de la release." },
      { type: "vf", q: "Le nom du paquet doit être scopé (@mon-org/utils) pour GitHub Packages.", a: true, exp: "Le scope rattache le paquet à l'organisation." }
    ],
    solution: `<pre class="pseudo"># package.json : "name": "@mon-org/utils"
name: Publish
on:
  release:
    types: [ published ]
permissions:
  contents: read
  packages: write                        # autorise la publication de paquets
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

<p>À chaque release publiée, la bibliothèque est empaquetée et poussée sur GitHub Packages, sous les mêmes droits d'accès que le dépôt.</p>`
  }
};
