  title: "Cherry-pick : transplanter des commits",
  subtitle: "Prendre UN commit précis d'une branche et le rejouer sur une autre.",
  theory: `
<h3>1. Qu'est-ce que le cherry-pick ?</h3>
<p><strong>Cherry-pick</strong> signifie littéralement « cueillir la cerise » : choisir <strong>un commit précis</strong>, où qu'il soit dans le dépôt, et le <strong>rejouer</strong> tel quel sur ta branche courante. Là où le merge apporte <em>toute</em> une branche et le rebase déplace <em>toute</em> ta série de commits, le cherry-pick est chirurgical : <strong>un commit, choisi à la main</strong>.</p>
<p>Analogie : une branche est une grappe de raisin. Le merge prend la grappe entière ; le cherry-pick cueille <strong>un seul grain</strong> et le pose ailleurs.</p>

<h3>2. La commande</h3>
<pre class="pseudo">git switch main                    # se placer sur la branche qui RECEVRA le commit
git cherry-pick a1b2c3             # rejouer le commit a1b2c3 ici (nouveau hash, même changement)
git cherry-pick a1b2c3 d4e5f6      # en rejouer plusieurs, dans l'ordre donné
git cherry-pick a1b2c3^..f7g8h9    # rejouer une PLAGE de commits (de a1b2c3 exclu à f7g8h9 inclus)</pre>
<p>Comme pour le rebase, le commit copié reçoit un <strong>nouvel identifiant</strong> : c'est une <em>copie</em> du changement, pas le commit d'origine. Le contenu (le diff) est identique ; l'ancrage dans l'histoire diffère.</p>

<h3>3. Le cas d'usage roi : le hotfix</h3>
<pre class="pseudo"># Un correctif urgent a été fait sur une branche, mais la prod tourne sur main.
git switch main                    # aller sur la branche de production
git cherry-pick 9f8e7d             # transplanter UNIQUEMENT le correctif, sans le reste du travail en cours
git push                           # publier le correctif en prod, tout de suite</pre>
<p>On récupère le correctif <strong>sans</strong> traîner les fonctionnalités inachevées de la branche source. C'est l'outil du « je veux juste CE fix, maintenant ».</p>

<h3>4. Gérer un conflit et les options utiles</h3>
<pre class="pseudo"># En cas de conflit, comme pour le rebase :
#   1) éditer les fichiers, 2) git add, 3) git cherry-pick --continue
git cherry-pick --abort            # tout annuler, revenir à l'état d'avant
git cherry-pick -x a1b2c3          # -x ajoute au message "(cherry picked from commit a1b2c3)" : traçabilité
git cherry-pick -n a1b2c3          # -n (no-commit) : applique le changement SANS créer le commit (tu committes toi-même)</pre>
<div class="tip">L'option <code>-x</code> laisse une trace de l'origine dans le message : précieux pour savoir plus tard « d'où vient ce correctif » quand le même fix vit sur deux branches.</div>

<h3>5. L'AVERTISSEMENT et les pièges</h3>
<div class="warn"><strong>Le cherry-pick copie des commits : n'en abuse pas entre branches partagées.</strong> Si tu cherry-pick le même changement sur plusieurs branches, tu crées des <strong>doublons</strong> (mêmes changements, hash différents) qui peuvent provoquer des conflits déroutants au moment de fusionner ces branches entre elles. Comme le rebase, c'est un outil de réécriture : à manier avec parcimonie, et jamais pour « bricoler » l'historique d'une branche d'équipe.</div>
<pre class="pseudo">Bon usage    : extraire UN correctif urgent vers main ou une branche de version   # chirurgical, ponctuel
Mauvais usage: recopier en masse des commits au lieu de merger/rebaser proprement # crée des doublons</pre>

<h3>6. Cherry-pick vs rebase vs merge</h3>
<pre class="pseudo">merge       → intègre TOUTE une branche, garde l'histoire (losange)
rebase      → rejoue TOUS mes commits sur une nouvelle base (linéaire)
cherry-pick → rejoue UN (ou quelques) commit(s) choisi(s) ailleurs</pre>
<p>Retiens le cherry-pick comme la <strong>pince à épiler</strong> de Git : parfaite pour un geste précis, inadaptée pour déplacer un meuble. Demain : mettre son travail de côté sans committer, avec le <code>stash</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Le cherry-pick sert à :", opts: ["Fusionner toute une branche", "Rejouer UN commit précis sur la branche courante", "Supprimer un commit", "Créer une branche"], a: 1, exp: "Un commit choisi, transplanté." },

    { type: "vf", q: "Cherry-pick le même changement sur plusieurs branches peut créer des doublons.", a: true, exp: "Mêmes diffs, hash différents : conflits possibles au merge." },
    { type: "input", q: "Écris la commande pour cherry-pick une PLAGE de a1b2c3 (exclu) à f7g8h9 (inclus).", a: ["git cherry-pick a1b2c3^..f7g8h9"], ph: "git cherry-pick ...", exp: "^.. pour une plage." },
    { type: "qcm", q: "Le cherry-pick est comparé à :", opts: ["Une grue", "Une pince à épiler (geste précis)", "Un bulldozer", "Un aimant"], a: 1, exp: "Chirurgical, un commit à la fois." },
    { type: "qcm", q: "Pour intégrer TOUTE une branche relue, on préfère :", opts: ["Le cherry-pick de chaque commit", "Le merge (ou rebase)", "Rien", "git config"], a: 1, exp: "Le cherry-pick est pour l'unitaire." },
    { type: "vf", q: "Recopier en masse des commits par cherry-pick au lieu de merger est une bonne pratique.", a: false, exp: "Ça crée des doublons ; c'est un mauvais usage." },
    { type: "input", q: "Écris la commande qui cherry-pick deux commits a1b2c3 puis d4e5f6.", a: ["git cherry-pick a1b2c3 d4e5f6"], ph: "git cherry-pick ...", exp: "Plusieurs hash à la suite." }
  ],
  final: {
    title: "Exercice final — Transplanter un hotfix",
    intro: `<p>Un correctif (commit 9f8e7d) vit sur une branche de dev ; la prod tourne sur main. Tu veux JUSTE ce fix en prod.</p>`,
    questions: [

      { type: "input", q: "Transplanter le correctif avec sa traçabilité :", a: ["git cherry-pick -x 9f8e7d"], ph: "git cherry-pick ...", exp: "-x note l'origine." },
      { type: "qcm", q: "Un conflit surgit. Après correction + git add :", opts: ["git cherry-pick --abort", "git cherry-pick --continue", "git commit", "git push"], a: 1, exp: "--continue." },
      { type: "input", q: "Publier le correctif en prod :", a: ["git push"], ph: "git ...", exp: "Le fix part en prod." },
      { type: "vf", q: "Le fix arrive sur main SANS le reste du travail de la branche de dev.", a: true, exp: "C'est tout l'intérêt : chirurgical." }
    ],
    solution: `<pre class="pseudo">$ git switch main                 # aller sur la branche de production
$ git cherry-pick -x 9f8e7d       # transplanter UNIQUEMENT le correctif (avec trace d'origine)
# ... conflit éventuel :
$ git add fichier-resolu          # marquer résolu
$ git cherry-pick --continue      # poursuivre
$ git push                        # publier le hotfix en prod, sans traîner le reste</pre>
<p>Un seul grain cueilli, posé au bon endroit. Demain : mettre son travail de côté avec le stash.</p>`
  }
};
