<script>
var DAY = {
  num: 10,
  title: "Bisect : trouver le commit fautif",
  subtitle: "Une recherche dichotomique dans l'historique pour isoler le commit qui a cassé.",
  theory: `
<h3>1. Le problème</h3>
<p>« Ça marchait il y a deux semaines, aujourd'hui c'est cassé, et il y a 200 commits entre les deux. » Tester chaque commit à la main serait interminable. <strong>git bisect</strong> résout ça par une <strong>recherche dichotomique</strong> : à chaque étape, il coupe l'intervalle de commits <strong>en deux</strong>, tu dis si le milieu est bon ou mauvais, et il élimine la moitié inutile. Sur 200 commits, il trouve le coupable en <strong>8 essais environ</strong> (log2 de 200).</p>
<p>Analogie : deviner un nombre entre 1 et 1000. Plutôt que d'essayer 1, 2, 3… tu proposes 500 (« plus haut ? plus bas ? »), puis 250 ou 750, etc. Chaque réponse divise l'espace de recherche par deux. Bisect fait pareil avec les commits.</p>

<h3>2. Les termes de bisect</h3>
<pre class="pseudo">bon (good)    # un commit où le comportement est CORRECT (le bug n'est pas là)
mauvais (bad) # un commit où le bug est PRÉSENT
# bisect suppose que quelque part entre un "bon" ancien et un "mauvais" récent,
# un commit a fait basculer bon -> mauvais. C'est CE commit qu'on cherche.</pre>

<h3>3. Une session bisect à la main</h3>
<pre class="pseudo">git bisect start                # démarrer la session de recherche
git bisect bad                  # le commit ACTUEL (HEAD) est mauvais : le bug est là
git bisect good v1.4.0          # cette ancienne version (tag ou hash) était bonne
# → Git bascule le dépôt sur le commit du MILIEU de l'intervalle. À toi de tester :
# ... tu compiles/lances/testes ce commit ...
git bisect good                 # si le bug est ABSENT ici : le coupable est APRÈS
git bisect bad                  # si le bug est PRÉSENT ici : le coupable est ICI ou AVANT
# → Git recoupe et propose un nouveau commit milieu. On répète.
# Quand il ne reste qu'un candidat, Git affiche :
#   "abc1234 is the first bad commit"    # LE commit fautif est identifié
git bisect reset                # TERMINER : revenir à l'état de départ (HEAD d'origine)</pre>
<div class="tip">À chaque étape, teste vraiment le comportement (lance l'app, exécute le test qui échoue). C'est ta réponse « good/bad » qui guide bisect : une réponse fausse envoie la recherche dans le mur.</div>

<h3>4. Automatiser avec un script</h3>
<pre class="pseudo">git bisect start
git bisect bad
git bisect good v1.4.0
git bisect run ./test-du-bug.sh   # bisect lance CE script à chaque étape et lit son code de sortie
# Convention : sortie 0 = "good" (test passe), sortie non nulle = "bad" (test échoue)
# → bisect parcourt tout seul l'historique et affiche le premier commit fautif</pre>
<p><code>git bisect run</code> est la vraie puissance de l'outil : donne-lui une commande ou un test qui distingue « bon » de « mauvais », et il trouve le coupable <strong>sans intervention</strong>. C'est pour cela qu'un historique de commits propres (jour 4) et une suite de tests fiable (jours 14-16) rendent bisect redoutablement efficace.</p>

<h3>5. Marquer et sauter des commits</h3>
<pre class="pseudo">git bisect skip                 # ce commit ne compile pas / intestable : bisect l'ÉVITE et essaie un voisin
git bisect terms --term-old sain --term-new casse   # renommer good/bad si "bon/mauvais" prête à confusion
git bisect log                  # afficher le journal de la session (utile pour reprendre)</pre>

<h3>6. Après avoir trouvé le coupable</h3>
<pre class="pseudo">git bisect reset                # d'abord SORTIR de la session bisect
git show abc1234                # examiner le commit fautif : qu'a-t-il changé exactement ?
# → puis corriger : nouveau commit correctif, ou git revert abc1234 (annuler ce commit)</pre>
<div class="warn">N'oublie jamais <code>git bisect reset</code> à la fin : sinon tu restes « perdu » sur un commit intermédiaire, en état détaché (detached HEAD), et tu risques de committer au mauvais endroit. Le reset te ramène proprement à ton point de départ.</div>
<p>Bisect transforme une chasse au bug de plusieurs heures en quelques minutes. Demain : les Pull Requests avancées.</p>`,
  exercises: [
    { type: "qcm", q: "git bisect trouve le commit fautif par :", opts: ["Une recherche linéaire", "Une recherche dichotomique (couper en deux)", "L'analyse des messages de commit", "Un parcours des branches distantes"], a: 1, exp: "Dichotomie : on divise l'intervalle par deux." },
    { type: "qcm", q: "Sur 200 commits, bisect trouve le coupable en environ :", opts: ["200 essais", "100 essais", "8 essais (log2)", "1 essai"], a: 2, exp: "log2(200) ~ 8." },
    { type: "input", q: "Écris la commande qui démarre une session bisect.", a: ["git bisect start"], ph: "git bisect ...", exp: "start." },
    { type: "input", q: "Écris la commande qui marque le commit courant comme MAUVAIS.", a: ["git bisect bad"], ph: "git bisect ...", exp: "bad = bug présent." },
    { type: "qcm", q: "Un commit 'good' est :", opts: ["Un commit où le bug est présent", "Un commit où le comportement est correct", "Le dernier commit", "Un tag"], a: 1, exp: "good = bug absent." },
    { type: "input", q: "Écris la commande qui marque la version v1.4.0 comme BONNE.", a: ["git bisect good v1.4.0"], ph: "git bisect good ...", exp: "good <ref>." },
    { type: "qcm", q: "Après chaque marquage good/bad, Git :", opts: ["Termine la recherche", "Bascule sur le commit du MILIEU restant à tester", "Revient au dernier commit bon connu", "Recompile le projet automatiquement"], a: 1, exp: "Il propose le milieu de l'intervalle." },
    { type: "input", q: "Écris la commande qui lance un test automatique à chaque étape (script test-du-bug.sh).", a: ["git bisect run ./test-du-bug.sh"], ph: "git bisect run ...", exp: "run <script>." },
    { type: "qcm", q: "Pour bisect run, la convention du code de sortie du script :", opts: ["0 = bad, non nul = good", "0 = good (test passe), non nul = bad (test échoue)", "Toujours 0", "Peu importe"], a: 1, exp: "0 = good, non nul = bad." },
    { type: "input", q: "Écris la commande qui SAUTE un commit non testable (ne compile pas).", a: ["git bisect skip"], ph: "git bisect ...", exp: "skip évite le commit." },
    { type: "input", q: "Écris la commande qui TERMINE la session et revient au point de départ.", a: ["git bisect reset"], ph: "git bisect ...", exp: "reset restaure HEAD d'origine." },
    { type: "vf", q: "Une mauvaise réponse good/bad envoie la recherche dans le mur.", a: true, exp: "Tes réponses guident bisect : teste vraiment." },
    { type: "qcm", q: "Après avoir trouvé le coupable, on peut l'annuler avec :", opts: ["git revert <hash>", "git bisect delete", "git stash", "git config"], a: 0, exp: "revert crée un commit qui annule le fautif." },
    { type: "vf", q: "Oublier git bisect reset laisse le dépôt en HEAD détaché sur un commit intermédiaire.", a: true, exp: "Toujours reset à la fin." },
    { type: "qcm", q: "Ce qui rend bisect redoutablement efficace :", opts: ["Un historique brouillon", "Des commits propres + une suite de tests fiable", "L'absence de tests", "Beaucoup de branches"], a: 1, exp: "Commits atomiques et test net = automatisation facile." }
  ],
  final: {
    title: "Exercice final — Traquer une régression",
    intro: `<p>Le test 'panier.test' échoue aujourd'hui mais passait à la v1.4.0. Tu isoles le commit fautif, en automatique.</p>`,
    questions: [
      { type: "input", q: "Démarrer la session :", a: ["git bisect start"], ph: "git bisect ...", exp: "start." },
      { type: "input", q: "Marquer HEAD comme mauvais :", a: ["git bisect bad"], ph: "git bisect ...", exp: "bad." },
      { type: "input", q: "Marquer v1.4.0 comme bon :", a: ["git bisect good v1.4.0"], ph: "git bisect good ...", exp: "good v1.4.0." },
      { type: "input", q: "Lancer la recherche automatique avec le script de test :", a: ["git bisect run ./panier-test.sh", "git bisect run ./test.sh"], ph: "git bisect run ...", exp: "run <script>." },
      { type: "qcm", q: "Une fois le coupable affiché, ne pas oublier :", opts: ["git bisect reset", "git push", "git stash", "rien"], a: 0, exp: "reset revient au point de départ." }
    ],
    solution: `<pre class="pseudo">$ git bisect start                    # ouvrir la session de recherche
$ git bisect bad                      # HEAD est cassé (le test échoue)
$ git bisect good v1.4.0              # cette version était saine
$ git bisect run ./panier-test.sh     # bisect teste automatiquement chaque milieu
#   ... plusieurs étapes automatiques ...
#   abc1234 is the first bad commit    # LE commit qui a introduit la régression
$ git bisect reset                    # sortir de la session, revenir au départ
$ git show abc1234                    # examiner le changement fautif
$ git revert abc1234                  # (option) annuler le commit fautif</pre>
<p>Des heures de chasse réduites à quelques minutes. Demain : les Pull Requests avancées.</p>`
  }
};
</script>
