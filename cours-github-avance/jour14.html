var DAY = {

  title: "Introduction à GitHub Actions",
  subtitle: "Automatiser des tâches directement dans GitHub : le vocabulaire de base.",
  theory: `
<h3>1. Qu'est-ce que GitHub Actions ?</h3>
<p><strong>GitHub Actions</strong> est le système d'<strong>automatisation intégré à GitHub</strong> : il exécute des tâches (tester, construire, déployer, notifier…) <strong>en réaction à des événements</strong> du dépôt — un push, une pull request, un tag, une heure programmée. C'est le <strong>robot d'usine</strong> de ton dépôt : dès qu'un colis arrive (un commit), il déclenche une chaîne de gestes définie à l'avance.</p>
<p>C'est l'outil qui va produire les fameux <strong>status checks</strong> du jour 12 : le « ✅ tests » qui débloque le bouton Merge de la PR.</p>

<h3>2. Le vocabulaire essentiel</h3>
<pre class="pseudo">workflow  # un PROCESSUS automatisé décrit dans un fichier YAML. Le "plan" complet.
event     # l'ÉVÉNEMENT qui DÉCLENCHE le workflow (push, pull_request, schedule...).
job       # une TÂCHE du workflow (ex. "tester", "construire"). Un workflow a un ou plusieurs jobs.
step      # une ÉTAPE d'un job (une commande ou une action). Les steps s'enchaînent dans l'ordre.
action    # une brique RÉUTILISABLE prête à l'emploi (ex. récupérer le code, installer Node).
runner    # la MACHINE (virtuelle) qui exécute le job. GitHub en fournit (ubuntu, windows, macos).</pre>
<p>Analogie : le <strong>workflow</strong> est une recette ; l'<strong>event</strong> est « quand cuisiner » ; chaque <strong>job</strong> est un plat ; chaque <strong>step</strong> est une étape de la recette ; une <strong>action</strong> est un ingrédient tout préparé ; le <strong>runner</strong> est la cuisine où tout se fait.</p>

<h3>3. Où vivent les workflows ?</h3>
<pre class="pseudo">.github/workflows/            # dossier OBLIGATOIRE : GitHub y cherche les workflows
.github/workflows/ci.yml      # un workflow (le nom du fichier est libre, l'extension .yml/.yaml)
# Tu peux avoir plusieurs fichiers : ci.yml, deploy.yml, nightly.yml...</pre>
<div class="warn">Le chemin est strict : un workflow DOIT être dans <code>.github/workflows/</code>. Un fichier YAML rangé ailleurs sera ignoré, sans erreur visible — une source de confusion classique pour les débutants.</div>

<h3>4. L'anatomie d'un workflow minimal</h3>
<pre class="pseudo">name: CI                       # nom affiché dans l'onglet "Actions"
on: push                       # EVENT déclencheur : à chaque push
jobs:                          # la liste des jobs
  dire-bonjour:                # identifiant du job
    runs-on: ubuntu-latest     # RUNNER : une machine Ubuntu fournie par GitHub
    steps:                     # les étapes du job
      - run: echo "Bonjour depuis GitHub Actions"   # une commande shell simple</pre>
<p>Deux clés structurantes : <code>on:</code> déclare l'événement, <code>jobs:</code> déclare le travail. Chaque job précise <strong>où</strong> il tourne (<code>runs-on</code>) et <strong>quoi</strong> faire (<code>steps</code>).</p>

<h3>5. Les événements déclencheurs courants</h3>
<pre class="pseudo">on: push                       # à chaque poussée de commits
on: [push, pull_request]       # sur push ET sur pull request (la plupart des CI)
on:
  push:
    branches: [main]           # seulement les push sur main
  schedule:
    - cron: "0 6 * * 1"        # tâche programmée : tous les lundis à 6h (syntaxe cron)
on: workflow_dispatch          # déclenchement MANUEL depuis l'interface (bouton "Run workflow")</pre>

<h3>6. Actions, secrets et contexte</h3>
<pre class="pseudo">steps:
  - uses: actions/checkout@v4          # ACTION réutilisable : récupère le code du dépôt sur le runner
  - run: echo "Commit : \${{ github.sha }}"   # \${{ ... }} = expression GitHub (ici l'identifiant du commit)
  - run: ./deploy.sh
    env:
      TOKEN: \${{ secrets.API_TOKEN }}  # \${{ secrets.X }} = un SECRET chiffré (jamais écrit en clair)</pre>
<p>Deux notions clés introduites ici. Un <strong>secret</strong> est une valeur sensible (mot de passe, jeton) stockée chiffrée dans les réglages du dépôt et injectée à l'exécution — jamais écrite dans le code. Les <strong>expressions</strong> <code>\${{ ... }}</code> lisent le <strong>contexte</strong> (informations sur l'événement, le dépôt, le commit) : <code>github.sha</code>, <code>github.ref</code>, etc.</p>
<div class="tip">Le marketplace GitHub regorge d'<strong>actions</strong> toutes faites (<code>actions/checkout</code>, <code>actions/setup-node</code>…). Réutiliser une action éprouvée évite de réécrire des scripts fragiles. Demain, on assemble tout ça en un vrai workflow de CI.</p></div>`,
  exercises: [
    { type: "qcm", q: "GitHub Actions sert à :", opts: ["Stocker des fichiers", "Automatiser des tâches en réaction à des événements du dépôt", "Remplacer Git", "Gérer les mots de passe"], a: 1, exp: "Automatisation intégrée à GitHub." },
    { type: "input", q: "Dans quel dossier DOIVENT vivre les workflows ?", a: [".github/workflows", ".github/workflows/"], ph: ".github/...", exp: ".github/workflows/." },

    { type: "qcm", q: "Un 'event' (événement) est :", opts: ["La machine d'exécution", "Ce qui DÉCLENCHE le workflow (push, pull_request...)", "Une étape", "Une action"], a: 1, exp: "Le déclencheur." },
    { type: "qcm", q: "Un 'runner' est :", opts: ["Un déclencheur", "La machine (virtuelle) qui exécute le job", "Un fichier YAML", "Un secret"], a: 1, exp: "ubuntu, windows, macos fournis par GitHub." },
    { type: "input", q: "Quelle clé YAML déclare l'événement déclencheur d'un workflow ?", a: ["on", "on:"], ph: "...", exp: "on: push, par exemple." },
    { type: "input", q: "Quelle clé YAML indique le runner d'un job (la machine) ?", a: ["runs-on", "runs-on:"], ph: "runs-...", exp: "runs-on: ubuntu-latest." },
    { type: "qcm", q: "La hiérarchie correcte est :", opts: ["step > job > workflow", "workflow > job > step", "runner > event > job", "action > workflow > step"], a: 1, exp: "Un workflow contient des jobs, qui contiennent des steps." },
    { type: "input", q: "Quelle clé YAML liste les étapes d'un job ?", a: ["steps", "steps:"], ph: "...", exp: "steps: enchaîne les étapes." },
    { type: "qcm", q: "'uses: actions/checkout@v4' :", opts: ["Supprime le dépôt", "Utilise une ACTION réutilisable qui récupère le code sur le runner", "Lance un secret", "Crée une branche"], a: 1, exp: "checkout = récupérer le code." },
    { type: "input", q: "Quel mot-clé YAML exécute une commande shell dans un step ?", a: ["run", "run:"], ph: "...", exp: "run: echo ..." },
    { type: "qcm", q: "Un 'secret' dans Actions est :", opts: ["Une valeur écrite en clair dans le YAML", "Une valeur sensible chiffrée, injectée à l'exécution", "Un commit caché", "Un runner privé"], a: 1, exp: "secrets.X, jamais en clair dans le code." },
    { type: "qcm", q: "'on: workflow_dispatch' permet :", opts: ["Un déclenchement MANUEL depuis l'interface", "Un push automatique", "De supprimer le workflow", "Rien"], a: 0, exp: "Bouton 'Run workflow'." },
    { type: "vf", q: "Un fichier YAML rangé hors de .github/workflows/ est ignoré.", a: true, exp: "Le chemin est strict." },
    { type: "qcm", q: "Une expression comme github.sha se lit via :", opts: ["<% %>", "{{ }}", "les doubles accolades précédées de $ (le contexte)", "[ ]"], a: 2, exp: "L'expression lit le contexte de l'événement." }
  ],
  final: {
    title: "Exercice final — Le vocabulaire d'un premier workflow",
    intro: `<p>On relie chaque terme à sa place dans un workflow minimal déclenché au push.</p>`,
    questions: [
      { type: "input", q: "Clé qui déclare l'événement déclencheur :", a: ["on", "on:"], ph: "...", exp: "on: push." },
      { type: "input", q: "Clé qui déclare la machine d'exécution d'un job :", a: ["runs-on", "runs-on:"], ph: "runs-...", exp: "runs-on." },
      { type: "input", q: "Clé qui liste les étapes :", a: ["steps", "steps:"], ph: "...", exp: "steps." },
      { type: "qcm", q: "L'action qui récupère le code du dépôt sur le runner :", opts: ["actions/setup-node", "actions/checkout", "actions/deploy", "actions/cache"], a: 1, exp: "checkout." },
      { type: "vf", q: "Ce workflow produira un 'status check' visible sur la PR (jour 12).", a: true, exp: "Actions nourrit la protection de branche." }
    ],
    solution: `<pre class="pseudo">name: CI                       # nom dans l'onglet Actions
on: push                       # EVENT : à chaque push
jobs:                          # les JOBS
  build:                       # identifiant du job
    runs-on: ubuntu-latest     # RUNNER : machine Ubuntu de GitHub
    steps:                     # les STEPS
      - uses: actions/checkout@v4   # ACTION : récupère le code
      - run: echo "Commit \${{ github.sha }}"   # commande shell + expression de contexte</pre>
<p>Le vocabulaire est posé. Demain : un vrai workflow de CI qui installe, teste et devient un status check.</p>`
  }
};
