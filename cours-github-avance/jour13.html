  theory: `
<h3>1. Pourquoi des templates ?</h3>
<p>Un <strong>template</strong> (« gabarit », « modèle ») est un <strong>formulaire pré-rempli</strong> qui s'affiche automatiquement quand quelqu'un ouvre une issue ou une pull request. Au lieu d'un champ vide (« Décrivez votre problème… ») où chacun écrit trois mots ou un roman, le template <strong>guide</strong> le contributeur : quelles infos fournir, dans quel ordre, avec quelles cases à cocher.</p>
<p>Analogie : un formulaire de déclaration bien conçu. Sans lui, chacun raconte à sa façon et il manque toujours l'essentiel (« quelle version ? », « comment reproduire ? »). Avec lui, les réponses arrivent <strong>complètes et comparables</strong>. Le gain : moins d'allers-retours, un tri plus rapide, une meilleure qualité de contribution.</p>

<h3>2. Où vivent les templates ?</h3>
<pre class="pseudo">.github/                                   # le dossier des réglages GitHub du dépôt
.github/ISSUE_TEMPLATE/                     # un dossier pour PLUSIEURS gabarits d'issues
.github/ISSUE_TEMPLATE/bug_report.md        # gabarit "rapport de bug"
.github/ISSUE_TEMPLATE/feature_request.md   # gabarit "demande de fonctionnalité"
.github/PULL_REQUEST_TEMPLATE.md            # gabarit unique appliqué à toutes les PR
.github/CONTRIBUTING.md                     # le guide du contributeur (comment participer)</pre>

<h3>3. Un gabarit d'issue (bug) en Markdown</h3>
<pre class="pseudo"># .github/ISSUE_TEMPLATE/bug_report.md
---
name: Rapport de bug          # nom affiché dans le menu "New issue"
about: Signaler un comportement incorrect
labels: bug                    # étiquette appliquée automatiquement à l'issue créée
---
## Description               # (ces titres guident le rédacteur)
## Étapes pour reproduire
## Comportement attendu
## Environnement (version, OS, navigateur)</pre>
<p>La partie entre les <code>---</code> s'appelle le <strong>front matter</strong> (en-tête de métadonnées) : elle règle le nom, la description et les <strong>labels</strong> (étiquettes) automatiques. Le reste est le corps que verra le contributeur.</p>

<h3>4. Formulaires d'issue (issue forms, YAML)</h3>
<p>GitHub propose aussi des <strong>formulaires structurés</strong> en YAML : de vrais champs (texte, liste déroulante, case à cocher) au lieu d'un simple Markdown libre. Plus rigides, donc plus fiables pour collecter des infos précises.</p>
<pre class="pseudo"># .github/ISSUE_TEMPLATE/bug.yml
name: Bug
description: Signaler un bug
body:
  - type: input             # un champ de saisie d'une ligne
    attributes: { label: Version, placeholder: "ex. 2.3.0" }
    validations: { required: true }   # champ OBLIGATOIRE
  - type: textarea          # une zone de texte multiligne
    attributes: { label: Étapes pour reproduire }</pre>

<h3>5. Le gabarit de Pull Request</h3>
<pre class="pseudo"># .github/PULL_REQUEST_TEMPLATE.md  (pré-remplit CHAQUE nouvelle PR)
## Ce que fait cette PR
## Pourquoi (contexte / issue liée : Closes #___)
## Comment tester
## Checklist
- [ ] Tests ajoutés / mis à jour        # cases que l'auteur coche avant de demander la revue
- [ ] Documentation à jour
- [ ] Pas de secret ni de fichier généré committé</pre>
<div class="tip">Une bonne checklist de PR fait la moitié du travail du relecteur : elle rappelle à l'auteur de vérifier les tests, la doc et les secrets AVANT que quiconque relise. La revue humaine se concentre alors sur le fond.</div>

<h3>6. CONTRIBUTING et la cohérence du dépôt</h3>
<pre class="pseudo">.github/CONTRIBUTING.md    # comment contribuer : workflow de branches, style de commit, lancer les tests...
.github/CODEOWNERS         # qui relit quoi (jour 11)
.github/                   # regroupe aussi les workflows (Actions), le CODEOWNERS, les templates...</pre>
<p>Un fichier <strong>CONTRIBUTING.md</strong> (« comment contribuer ») explique aux nouveaux venus les règles du projet : quelle stratégie de branches (jour 2), quelle convention de messages, comment lancer les tests. Combinés, templates + CONTRIBUTING + CODEOWNERS forment le <strong>mode d'emploi</strong> du dépôt : un contributeur sait quoi faire sans demander. Demain, on entre dans l'automatisation : <strong>GitHub Actions</strong>.</p>`,

    { type: "qcm", q: "CONTRIBUTING.md évoque typiquement :", opts: ["Le mot de passe admin", "La stratégie de branches, le style de commit, comment lancer les tests", "Le code source complet", "Les logs serveur"], a: 1, exp: "Le mode d'emploi de la contribution." },

  ],
