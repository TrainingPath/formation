<script>
var DAY = {
  num: 3,
  title: "Rebase : réécrire l'historique proprement",
  subtitle: "Rejouer ses commits sur une nouvelle base pour un historique linéaire et lisible.",
  theory: `
<h3>1. Qu'est-ce que le rebase ?</h3>
<p><strong>Rebase</strong> signifie littéralement « re-baser » : <strong>changer la base</strong> de ta branche. La base, c'est le commit à partir duquel ta branche a démarré. Le rebase prend tes commits, les <strong>détache</strong>, puis les <strong>rejoue un par un</strong> par-dessus un autre commit (souvent le sommet de <code>main</code> mis à jour).</p>
<p>Analogie : tu as construit une étagère (tes commits) posée sur une vieille table (l'ancienne base). Le rebase soulève l'étagère et la repose, intacte, sur une <strong>nouvelle table</strong> — le mur a bougé, mais ton meuble reste le même, juste ré-ancré ailleurs.</p>
<p>Avant d'aller plus loin, deux mots clés. <strong>HEAD</strong> est le pointeur qui indique « où tu es » : le commit (et la branche) sur lequel tu travailles en ce moment. Un <strong>commit</strong> est un instantané enregistré de ton projet, identifié par un code (un hash).</p>

<h3>2. Rebase vs merge</h3>
<pre class="pseudo"># Situation : main a avancé pendant que tu codais sur feature.
# MERGE crée un commit de fusion qui relie les deux histoires :
main    A───B───C
             \\   \\
feature       D───E───M   # M = commit de merge (historique en losange)

# REBASE rejoue D et E APRÈS C, comme si tu avais commencé à jour :
main    A───B───C
                 \\
feature           D'──E'   # D' et E' sont des COPIES rejouées (nouveaux hash), histoire LINÉAIRE</pre>
<p>Le merge <strong>préserve</strong> l'histoire exacte (avec ses fourches). Le rebase la <strong>réécrit</strong> pour la rendre linéaire, plus facile à lire dans <code>git log</code>. Note que D' et E' ne sont PAS D et E : ce sont de nouveaux commits (nouveaux identifiants).</p>

<h3>3. La commande de base</h3>
<pre class="pseudo">git switch feature                 # se placer sur la branche à rebaser
git fetch origin                   # récupérer les dernières nouveautés du distant
git rebase origin/main             # rejouer mes commits par-dessus le sommet de main
# ... en cas de conflit :
#   1) éditer les fichiers en conflit                 # résoudre à la main
#   2) git add fichier-resolu                          # marquer comme résolu
#   3) git rebase --continue                           # passer au commit suivant
git rebase --abort                 # ANNULER tout et revenir à l'état d'avant le rebase</pre>
<div class="tip">Le raccourci fréquent <code>git pull --rebase</code> fait un <code>fetch</code> puis un <code>rebase</code> automatiquement : tu récupères le distant et tu rejoues ton travail par-dessus, sans commit de merge.</div>

<h3>4. Résoudre les conflits pendant un rebase</h3>
<p>Comme les commits sont rejoués <strong>un par un</strong>, un conflit peut surgir à chaque étape. Git s'arrête, te montre le fichier fautif, tu corriges, tu <code>git add</code>, puis <code>git rebase --continue</code>. Si tu es perdu, <code>git rebase --abort</code> te ramène exactement à l'état de départ : rien n'est cassé.</p>

<h3>5. L'AVERTISSEMENT capital</h3>
<div class="warn"><strong>Ne rebase JAMAIS une branche déjà partagée / poussée que d'autres utilisent.</strong> Le rebase réécrit les commits (nouveaux hash) : si un collègue a basé son travail sur les anciens, tu crées deux histoires incompatibles et un <code>git push --force</code> peut <strong>effacer le travail des autres</strong>. Règle simple : on rebase seulement sa <em>propre</em> branche <em>non partagée</em>. Sur <code>main</code> ou une branche d'équipe : jamais.</div>
<pre class="pseudo">git push --force-with-lease        # SI tu dois republier ta branche perso rebasée :
                                   # --force-with-lease refuse d'écraser si le distant a bougé
                                   # (plus sûr que --force, qui écrase aveuglément)</pre>

<h3>6. Quand rebaser ?</h3>
<pre class="pseudo">Mettre à jour MA branche perso avant la PR   → rebase (historique propre) # recommandé
Intégrer une PR relue dans main              → merge (traçabilité)        # souvent préféré
Une branche que d'autres ont déjà récupérée  → NI l'un ni l'autre en force # danger</pre>
<p>Le rebase est un outil de <strong>toilettage</strong> : on nettoie son propre travail avant de le présenter. Demain, on ira plus loin avec le <strong>rebase interactif</strong> pour fusionner, réordonner et renommer ses commits.</p>`,
  exercises: [
    { type: "qcm", q: "Rebaser une branche signifie :", opts: ["La supprimer", "Changer sa base en rejouant ses commits ailleurs", "La renommer", "La pousser"], a: 1, exp: "Re-baser = rejouer les commits sur une nouvelle base." },
    { type: "qcm", q: "HEAD désigne :", opts: ["Le premier commit", "Le pointeur sur le commit/branche courant", "Le dépôt distant", "Un conflit"], a: 1, exp: "HEAD = où tu es." },
    { type: "vf", q: "Après un rebase, les commits rejoués ont de NOUVEAUX identifiants (hash).", a: true, exp: "Ce sont des copies : D' et E', pas D et E." },
    { type: "qcm", q: "La différence merge vs rebase :", opts: ["Aucune", "Merge préserve l'histoire (losange), rebase la linéarise", "Rebase supprime les commits", "Merge réécrit les hash"], a: 1, exp: "Préserver vs réécrire." },
    { type: "input", q: "Écris la commande qui rejoue ta branche par-dessus le sommet de main distant.", a: ["git rebase origin/main"], ph: "git rebase ...", exp: "git rebase origin/main." },
    { type: "input", q: "Après avoir résolu un conflit et fait 'git add', quelle commande poursuit le rebase ?", a: ["git rebase --continue"], ph: "git rebase ...", exp: "--continue passe au commit suivant." },
    { type: "input", q: "Quelle commande ANNULE un rebase en cours et revient à l'état de départ ?", a: ["git rebase --abort"], ph: "git rebase ...", exp: "--abort restaure l'état d'avant." },
    { type: "qcm", q: "git pull --rebase fait :", opts: ["Un merge classique", "Un fetch puis un rebase (pas de commit de merge)", "Un push", "Rien"], a: 1, exp: "Récupère et rejoue par-dessus." },
    { type: "vf", q: "On peut rebaser sans risque une branche partagée que d'autres utilisent.", a: false, exp: "Danger : on réécrit des commits dont d'autres dépendent." },
    { type: "qcm", q: "Pour republier une branche perso rebasée, le plus sûr est :", opts: ["git push --force", "git push --force-with-lease", "git push -u", "git commit"], a: 1, exp: "--force-with-lease refuse d'écraser si le distant a bougé." },
    { type: "vf", q: "git rebase --abort peut casser définitivement ton dépôt.", a: false, exp: "Il te ramène exactement à l'état de départ." },
    { type: "qcm", q: "Les conflits pendant un rebase surviennent :", opts: ["Une seule fois à la fin", "Potentiellement à chaque commit rejoué, un par un", "Jamais", "Seulement sur main"], a: 1, exp: "Chaque commit est rejoué séparément." },
    { type: "qcm", q: "Le bon usage du rebase est :", opts: ["Réécrire main", "Nettoyer sa propre branche non partagée avant la PR", "Fusionner les PR relues", "Effacer l'historique d'équipe"], a: 1, exp: "Toilettage de son travail perso." },
    { type: "input", q: "Quelle commande récupère les nouveautés du distant sans fusionner, avant un rebase ?", a: ["git fetch origin", "git fetch"], ph: "git fetch ...", exp: "fetch met à jour origin/main sans toucher ta branche." },
    { type: "vf", q: "Un push --force aveugle peut effacer le travail des collègues.", a: true, exp: "D'où la règle : jamais sur une branche partagée." }
  ],
  final: {
    title: "Exercice final — Mettre sa branche à jour proprement",
    intro: `<p>main a avancé ; tu remets ta feature perso à jour par rebase avant d'ouvrir la PR.</p>`,
    questions: [
      { type: "input", q: "Se placer sur sa branche :", a: ["git switch feature", "git checkout feature"], ph: "git switch ...", exp: "On rebase depuis la branche à toiletter." },
      { type: "input", q: "Récupérer le distant sans fusionner :", a: ["git fetch origin", "git fetch"], ph: "git fetch ...", exp: "Met à jour origin/main." },
      { type: "input", q: "Rejouer ses commits par-dessus main :", a: ["git rebase origin/main"], ph: "git rebase ...", exp: "Historique linéaire." },
      { type: "qcm", q: "Un conflit apparaît. Après correction + git add :", opts: ["git rebase --abort", "git rebase --continue", "git commit", "git push"], a: 1, exp: "--continue poursuit." },
      { type: "qcm", q: "Republier la branche perso rebasée :", opts: ["git push --force-with-lease", "git push --force", "impossible", "git merge"], a: 0, exp: "Le plus sûr." }
    ],
    solution: `<pre class="pseudo">$ git switch feature               # sur ma branche perso (non partagée)
$ git fetch origin                 # je récupère l'état du distant
$ git rebase origin/main           # je rejoue mes commits par-dessus main à jour
# ... conflit sur stock.py :
$ # (j'édite stock.py pour résoudre)
$ git add stock.py                 # je marque le conflit résolu
$ git rebase --continue            # je poursuis le rebase
$ git push --force-with-lease      # je republie ma branche rebasée, sans risque d'écraser</pre>
<div class="warn">Ceci ne vaut QUE parce que la branche est perso et non partagée. Jamais ce geste sur main ou une branche d'équipe.</div>
<p>Historique propre et à jour. Demain : le rebase INTERACTIF pour remodeler ses commits.</p>`
  }
};
</script>
