var DAY = {
  num: 23,
  title: "Créer sa propre action",
  subtitle: "Emballer une tâche récurrente dans un composant que l'on invoque avec uses.",
  theory: `
<h3>1. Pourquoi créer une action ?</h3>
<p>Quand la même série de steps revient dans plusieurs workflows ou dépôts, on la <strong>factorise</strong> dans une action maison. Une <strong>action</strong>, on l'a vu, est un composant invoqué par <code>uses:</code>. En créer une, c'est définir un dossier avec un fichier descriptif nommé <strong><code>action.yml</code></strong> (le <strong>manifeste</strong> de l'action). Trois familles existent : <strong>composite</strong>, <strong>JavaScript</strong> et <strong>Docker</strong>.</p>
<pre class="pseudo">Action composite : enchaine des steps shell/uses existants   # la plus simple, aucune compilation
Action JavaScript: du code Node.js execute par le runner      # rapide, portable, la plus courante en JS
Action Docker    : s'execute dans un conteneur               # isolation totale, mais plus lente a demarrer</pre>

<h3>2. Le manifeste action.yml</h3>
<p>Le fichier <code>action.yml</code> décrit l'action : son nom, ses <strong>entrées</strong> (<code>inputs</code>), ses <strong>sorties</strong> (<code>outputs</code>) et la façon dont elle s'exécute (<code>runs</code>).</p>
<pre class="pseudo">name: 'Bonjour'
description: 'Affiche un message de salutation'
inputs:
  qui:
    description: 'Le nom a saluer'
    required: false                      # non obligatoire...
    default: 'monde'                     # ...avec une valeur par defaut
outputs:
  horodatage:
    description: 'Heure de l execution'
    value: \${{ steps.dire.outputs.ts }}   # une SORTIE calculee par un step interne
runs:
  using: 'composite'                     # type d'action : composite
  steps:
    - id: dire
      shell: bash
      run: |
        echo "Bonjour \${{ inputs.qui }} !"
        echo "ts=\$(date -u +%FT%TZ)" &gt;&gt; \$GITHUB_OUTPUT   # on ECRIT une sortie</pre>
<div class="tip">Une <strong>action composite</strong> (<code>using: 'composite'</code>) est la plus accessible : elle ne fait qu'enchaîner des steps <code>run</code> (shell) et des <code>uses</code>, sans code à compiler. Idéale pour regrouper « installer + configurer + lancer » en un seul composant.</p></div>

<h3>3. Entrées, sorties et le fichier GITHUB_OUTPUT</h3>
<p>Une <strong>entrée</strong> (<em>input</em>) se lit avec <code>\${{ inputs.nom }}</code>. Pour produire une <strong>sortie</strong> (<em>output</em>), un step écrit une ligne <code>nom=valeur</code> dans le fichier spécial pointé par la variable <code>\$GITHUB_OUTPUT</code>. GitHub lit ce fichier et rend la valeur disponible aux steps suivants et à l'appelant.</p>
<pre class="pseudo">- run: echo "resultat=42" &gt;&gt; \$GITHUB_OUTPUT   # on ecrit la sortie "resultat"
# ...ailleurs...
- run: echo \${{ steps.calc.outputs.resultat }}  # on la relit (42)</pre>

<h3>4. Utiliser son action : locale ou publiée</h3>
<pre class="pseudo"># action rangee DANS le depot (dossier .github/actions/bonjour)
- uses: ./.github/actions/bonjour        # chemin LOCAL relatif au depot
  with:
    qui: 'equipe'

# action publiee dans un depot dedie, versionnee par un tag
- uses: mon-org/action-bonjour@v1        # reference proprietaire/nom@version</pre>
<p>Une action <strong>locale</strong> (chemin commençant par <code>./</code>) vit dans le même dépôt. Une action <strong>publiée</strong> vit dans son propre dépôt public, où on pose un <strong>tag</strong> de version (<code>v1</code>, <code>v1.0.0</code>) pour que les autres l'épinglent — exactement l'épinglage vu au jour 22, vu cette fois du côté de l'auteur.</p>

<h3>5. Bonnes pratiques d'auteur d'action</h3>
<pre class="pseudo">1. Documenter chaque input/output dans action.yml (description)  # l'utilisateur doit comprendre sans lire le code
2. Donner des valeurs par defaut raisonnables                    # utilisable sans tout configurer
3. Versionner par tags (v1, v1.2.0) et maintenir v1 a jour       # pour que @v1 recoive les correctifs
4. Ne JAMAIS coder de secret en dur dans l'action                # les secrets viennent de l'appelant
5. Tester l'action avec un workflow dans son propre depot        # elle doit marcher avant publication</pre>
<div class="warn">Une action que d'autres vont exécuter est du code de confiance : n'y mets jamais de secret en clair, et sois explicite sur ce qu'elle fait. Si tu la publies, tu deviens un maillon de la chaîne d'approvisionnement d'autres projets — la rigueur de sécurité du jour 22 s'applique désormais à toi.</div>`,
  exercises: [
    { type: "input", q: "Quel fichier décrit une action (son manifeste) ? (le nom exact du fichier)", a: ["action.yml", "action.yaml"], ph: "un nom de fichier", exp: "action.yml contient name, inputs, outputs, runs." },

    { type: "qcm", q: "Une action composite…", opts: ["Exige un conteneur Docker", "Enchaîne des steps shell/uses, sans code à compiler", "Ne prend pas d'entrées", "Est la plus lente"], a: 1, exp: "La plus simple : using: 'composite'." },
    { type: "input", q: "Sous quel mot-clé déclare-t-on les entrées d'une action ? (le mot-clé seul)", a: ["inputs", "inputs:"], ph: "un mot-clé", exp: "inputs: dans action.yml." },
    { type: "input", q: "Sous quel mot-clé déclare-t-on les sorties d'une action ? (le mot-clé seul)", a: ["outputs", "outputs:"], ph: "un mot-clé", exp: "outputs: dans action.yml." },
    { type: "input", q: "Comment lit-on l'entrée nommée qui ? Écris ${{ inputs.___ }}", a: ["qui"], ph: "un nom", exp: "inputs.<nom> lit une entrée." },
    { type: "qcm", q: "Pour produire une sortie, un step écrit une ligne nom=valeur dans…", opts: ["le README", "le fichier pointé par $GITHUB_OUTPUT", "un secret", "package.json"], a: 1, exp: "$GITHUB_OUTPUT collecte les sorties." },
    { type: "input", q: "Quelle valeur donner à runs.using pour une action composite ? (le mot, sans guillemets)", a: ["composite"], ph: "un mot", exp: "using: 'composite'." },
    { type: "qcm", q: "Une action locale se référence avec…", opts: ["un tag @v1", "un chemin commençant par ./ (ex. ./.github/actions/bonjour)", "une URL http", "un secret"], a: 1, exp: "Chemin relatif au dépôt." },
    { type: "qcm", q: "Une action publiée dans son propre dépôt se référence avec…", opts: ["./chemin", "proprietaire/nom@version", "run:", "needs:"], a: 1, exp: "Comme toute action du marketplace." },
    { type: "input", q: "Pour permettre l'épinglage @v1, l'auteur pose un ___ Git de version. (le mot)", a: ["tag"], ph: "un mot", exp: "On versionne par tags." },
    { type: "vf", q: "On peut coder un secret en dur dans une action pour simplifier.", a: false, exp: "Jamais : les secrets viennent de l'appelant." },
    { type: "vf", q: "Une action composite peut aussi contenir des steps uses: (pas seulement du shell).", a: true, exp: "Elle enchaîne run et uses." },
    { type: "qcm", q: "default: dans un input sert à…", opts: ["Chiffrer l'entrée", "Fournir une valeur par défaut si l'appelant n'en passe pas", "Rendre l'entrée obligatoire", "Créer une sortie"], a: 1, exp: "Utilisable sans tout configurer." },
    { type: "qcm", q: "Avant de publier une action, la bonne pratique est de…", opts: ["La déployer en prod", "La tester avec un workflow dans son propre dépôt", "La chiffrer", "La supprimer"], a: 1, exp: "Elle doit marcher avant publication." }
  ],
  final: {
    title: "Exercice final — Une action composite avec entrée et sortie",
    intro: `<p>Tu crées une action composite qui prend une entrée nom et produit une sortie salut contenant un message.</p>`,
    questions: [
      { type: "input", q: "Dans quel fichier écris-tu le manifeste ? (le nom exact)", a: ["action.yml", "action.yaml"], ph: "un nom de fichier", exp: "action.yml." },
      { type: "input", q: "Quelle valeur de runs.using pour une action composite ? (le mot)", a: ["composite"], ph: "un mot", exp: "using: 'composite'." },
      { type: "input", q: "Comment un step écrit-il la sortie salut ? echo \"salut=...\" >> $___", a: ["GITHUB_OUTPUT", "$GITHUB_OUTPUT"], ph: "une variable", exp: "$GITHUB_OUTPUT collecte les sorties." },
      { type: "qcm", q: "L'appelant, dans le même dépôt, invoque l'action par…", opts: ["mon-org/action@v1", "./.github/actions/salut", "run:", "un secret"], a: 1, exp: "Chemin local." },
      { type: "vf", q: "L'entrée se lit ${{ inputs.nom }} dans les steps de l'action.", a: true, exp: "inputs.<nom>." }
    ],
    solution: `<pre class="pseudo"># .github/actions/salut/action.yml
name: 'Salut'
description: 'Construit un message de salutation'
inputs:
  nom:
    description: 'Le nom a saluer'
    required: false
    default: 'monde'
outputs:
  salut:
    description: 'Le message complet'
    value: \${{ steps.msg.outputs.texte }}
runs:
  using: 'composite'
  steps:
    - id: msg
      shell: bash
      run: echo "texte=Bonjour \${{ inputs.nom }}" &gt;&gt; \$GITHUB_OUTPUT
# --------------------------------------
# workflow appelant (meme depot)
steps:
  - id: hello
    uses: ./.github/actions/salut
    with:
      nom: 'equipe'
  - run: echo "\${{ steps.hello.outputs.salut }}"</pre>
<p>Une tâche factorisée, documentée par ses <code>inputs</code>/<code>outputs</code>, réutilisable partout : c'est le principe même d'une action.</p>`
  }
};
