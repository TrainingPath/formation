<script>
var DAY = {
  num: 26,
  title: "Code scanning et secret scanning",
  subtitle: "Analyser le code à la recherche de failles, et détecter les secrets committés par erreur.",
  theory: `
<h3>1. Deux analyses complémentaires</h3>
<p>Le jour 25 traitait les failles des <strong>dépendances</strong>. Aujourd'hui, on scanne <strong>ton propre code</strong>. Deux analyses distinctes : le <strong>code scanning</strong> cherche des <strong>bugs de sécurité dans le code</strong> que tu écris ; le <strong>secret scanning</strong> cherche des <strong>secrets exposés</strong> (clés, jetons, mots de passe) qui auraient été committés par accident. Ensemble avec Dependabot, elles forment la sécurité applicative native de GitHub.</p>

<h3>2. Le code scanning et CodeQL</h3>
<p>Le <strong>code scanning</strong> (« analyse de code ») est une <strong>analyse statique</strong> : on inspecte le code <strong>sans l'exécuter</strong> pour repérer des motifs dangereux — injection SQL, XSS, chemins non validés, etc. GitHub fournit <strong>CodeQL</strong>, un moteur qui traite le code comme une base de données interrogeable et applique des requêtes de sécurité éprouvées.</p>
<pre class="pseudo"># .github/workflows/codeql.yml
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]                   # on analyse aussi les PR (avant merge)
  schedule:
    - cron: '0 3 * * 1'                  # + une analyse programmee chaque lundi 03h00
permissions:
  security-events: write                 # AUTORISE l'ecriture des resultats de securite
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript          # le(s) langage(s) a analyser
      - uses: github/codeql-action/analyze@v3   # lance l'analyse et remonte les alertes</pre>
<div class="tip"><strong>Analyse statique</strong> = examiner le code sans le lancer (par opposition à l'analyse dynamique qui l'exécute). CodeQL brille sur les patterns de vulnérabilité classiques et s'intègre aux PR : une alerte apparaît directement dans la revue.</div>

<h3>3. Lire les résultats : l'onglet Security et SARIF</h3>
<p>Les alertes remontent dans l'onglet <strong>Security &gt; Code scanning alerts</strong>, chacune avec sa gravité, l'emplacement exact et une explication. Le format d'échange standard s'appelle <strong>SARIF</strong> (<em>Static Analysis Results Interchange Format</em>) : c'est lui qui permet d'afficher, dans la même interface, les résultats de CodeQL <em>ou</em> d'un autre outil tiers.</p>
<pre class="pseudo">- uses: github/codeql-action/upload-sarif@v3   # remonter des resultats d'un AUTRE outil
  with:
    sarif_file: resultats.sarif          # fichier au format standard SARIF</pre>

<h3>4. Le secret scanning</h3>
<p>Le <strong>secret scanning</strong> (« analyse de secrets ») détecte les <strong>identifiants exposés</strong> dans le code et l'historique : clé AWS, jeton GitHub, clé Stripe… GitHub reconnaît des <strong>motifs</strong> (patterns) fournis par des dizaines de partenaires. Il s'active dans <code>Settings &gt; Code security</code> et fonctionne <strong>sans workflow</strong>.</p>
<pre class="pseudo">Settings &gt; Code security :
- Secret scanning       : ON   # detecte les secrets deja committes
- Push protection       : ON   # BLOQUE un push qui contient un secret (avant qu'il n'entre)</pre>
<div class="warn">La <strong>push protection</strong> est la fonctionnalité la plus utile : elle <strong>bloque le push</strong> au moment où tu tentes d'envoyer un commit contenant un secret reconnu. Elle empêche la fuite <em>avant</em> qu'elle n'atteigne le dépôt, au lieu de la constater après coup.</div>

<h3>5. Un secret a fuité : la seule bonne procédure</h3>
<p>Si le secret scanning détecte une clé <strong>déjà</strong> committée, la retirer du fichier ne suffit pas — elle reste dans l'<strong>historique Git</strong> (rappel du jour 17). La procédure correcte, dans l'ordre :</p>
<pre class="pseudo">1. REVOQUER la cle cote service (la rendre inutilisable)   # priorite absolue : couper le risque
2. Generer une NOUVELLE cle et la stocker dans un secret   # via secrets.* (jour 17)
3. Nettoyer l'historique si necessaire (reecriture)        # optionnel, la revocation prime
4. Comprendre COMMENT c'est arrive (fichier .env commite ?) # pour ne pas recommencer</pre>
<div class="warn">Ordre non négociable : on <strong>révoque d'abord</strong>. Passer du temps à nettoyer l'historique pendant que la clé reste valide, c'est laisser la porte ouverte. La clé exposée doit être considérée comme compromise <strong>dès la première seconde</strong>.</div>
<div class="tip">Vue d'ensemble de la sécurité GitHub : Dependabot (dépendances, jour 25) + code scanning (ton code) + secret scanning (fuites d'identifiants). Trois couches, un même onglet <strong>Security</strong>, et un principe constant : détecter tôt, corriger vite, ne jamais exposer un secret.</div>`,
  exercises: [
    { type: "qcm", q: "Le code scanning analyse…", opts: ["Les dépendances externes", "Ton propre code à la recherche de bugs de sécurité", "Les branches", "Les runners"], a: 1, exp: "Failles dans le code que tu écris." },
    { type: "qcm", q: "Le secret scanning cherche…", opts: ["Des bugs de logique", "Des secrets/identifiants exposés dans le code et l'historique", "Des dépendances obsolètes", "Des tags"], a: 1, exp: "Clés, jetons, mots de passe committés." },
    { type: "input", q: "Quel moteur d'analyse de code GitHub fournit-il ? (le nom)", a: ["CodeQL", "codeql"], ph: "un nom", exp: "CodeQL traite le code comme une base interrogeable." },
    { type: "qcm", q: "Une analyse statique, c'est…", opts: ["Exécuter le code et l'observer", "Inspecter le code SANS l'exécuter", "Chiffrer le code", "Le déployer"], a: 1, exp: "Sans exécution (vs analyse dynamique)." },
    { type: "input", q: "Quelle permission autorise l'écriture des résultats de sécurité ? Réponds security-events: ___", a: ["write", "security-events: write"], ph: "security-events: ___", exp: "security-events: write remonte les alertes." },
    { type: "input", q: "Quel format standard d'échange des résultats d'analyse ? (le sigle)", a: ["SARIF", "sarif"], ph: "un sigle", exp: "SARIF permet d'afficher des résultats d'outils variés." },
    { type: "qcm", q: "Les alertes de code scanning apparaissent…", opts: ["Dans le README", "Dans l'onglet Security > Code scanning alerts", "Dans un secret", "Dans les logs bruts du job"], a: 1, exp: "Avec gravité, emplacement, explication." },
    { type: "qcm", q: "Le secret scanning s'active…", opts: ["Uniquement via un workflow complexe", "Dans Settings > Code security, sans workflow", "En créant un tag", "Avec un runner dédié"], a: 1, exp: "Réglage, pas de YAML nécessaire." },
    { type: "input", q: "Quelle fonctionnalité BLOQUE un push contenant un secret reconnu ? (le terme en anglais)", a: ["push protection", "push-protection"], ph: "deux mots", exp: "Elle empêche la fuite avant qu'elle n'entre." },
    { type: "vf", q: "La push protection empêche la fuite avant qu'elle n'atteigne le dépôt.", a: true, exp: "Prévention plutôt que constat." },
    { type: "qcm", q: "Un secret déjà committé et détecté : première action ?", opts: ["Le retirer du fichier", "Le révoquer côté service", "Nettoyer l'historique d'abord", "Attendre"], a: 1, exp: "On révoque d'abord : la clé est compromise." },
    { type: "vf", q: "Retirer un secret du fichier suffit puisqu'il disparaît alors du dépôt.", a: false, exp: "Il reste dans l'historique Git : révoquer." },
    { type: "qcm", q: "CodeQL peut analyser le code…", opts: ["Seulement sur main", "Sur push, sur PR et selon un planning (cron)", "Seulement après un déploiement", "Sans permissions"], a: 1, exp: "on: push, pull_request, schedule." },
    { type: "qcm", q: "upload-sarif sert à…", opts: ["Publier un package", "Remonter dans Security des résultats d'un AUTRE outil au format SARIF", "Créer une branche", "Chiffrer un secret"], a: 1, exp: "Interopérabilité des outils d'analyse." },
    { type: "qcm", q: "Les trois couches de sécurité GitHub natives sont…", opts: ["lint, test, build", "Dependabot + code scanning + secret scanning", "v1, v2, v3", "cache, artefact, runner"], a: 1, exp: "Dépendances, code, fuites d'identifiants." }
  ],
  final: {
    title: "Exercice final — Mettre en place le scanning",
    intro: `<p>Tu veux analyser ton code JavaScript avec CodeQL sur push et PR vers main, et activer le secret scanning avec push protection.</p>`,
    questions: [
      { type: "input", q: "Quel moteur d'analyse utilises-tu ? (le nom)", a: ["CodeQL", "codeql"], ph: "un nom", exp: "CodeQL." },
      { type: "input", q: "Quelle permission le workflow doit-il accorder ? Réponds security-events: ___", a: ["write", "security-events: write"], ph: "security-events: ___", exp: "security-events: write." },
      { type: "qcm", q: "Pour bloquer les secrets à l'envoi, tu actives…", opts: ["le code scanning", "la push protection", "un runner", "un tag"], a: 1, exp: "Push protection." },
      { type: "input", q: "Sous quel paramètre de codeql-action/init indiques-tu le langage ? (le mot-clé seul)", a: ["languages", "languages:"], ph: "un mot-clé", exp: "languages: javascript." },
      { type: "vf", q: "Si un secret est déjà committé, on le révoque avant tout nettoyage d'historique.", a: true, exp: "La révocation prime toujours." }
    ],
    solution: `<pre class="pseudo"># .github/workflows/codeql.yml
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  security-events: write                 # ecrire les alertes de securite
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
# Puis Settings &gt; Code security :
#   Secret scanning : ON
#   Push protection : ON   # bloque un push contenant un secret</pre>
<p>CodeQL remonte les failles de code dans l'onglet Security ; le secret scanning et la push protection empêchent les fuites d'identifiants. En cas de secret déjà exposé : révoquer d'abord, toujours.</p>`
  }
};
</script>
