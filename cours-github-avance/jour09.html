  title: "Les sous-modules (git submodule)",
  subtitle: "Inclure un dépôt Git dans un autre, verrouillé sur une version précise.",
  theory: `
<h3>1. Qu'est-ce qu'un sous-module ?</h3>
<p>Un <strong>sous-module</strong> (en anglais <em>submodule</em>) permet d'inclure <strong>un dépôt Git à l'intérieur d'un autre</strong>, tout en les gardant <strong>séparés</strong>. Le dépôt principal ne copie pas le code du sous-module : il note simplement « à cet endroit, il y a le dépôt X, verrouillé sur le commit Y ».</p>
<p>Analogie : ton projet est un classeur ; un sous-module est un <strong>livre emprunté à la bibliothèque</strong> et glissé dans le classeur. Le classeur ne recopie pas le livre — il garde un <strong>marque-page</strong> précis (« page 142 ») et un renvoi vers la bibliothèque. Chacun garde son propre historique.</p>
<div class="tip">Cas d'usage : partager une bibliothèque interne entre plusieurs projets, épingler une dépendance sur un commit exact, ou séparer un gros système en composants versionnés indépendamment.</div>

<h3>2. Ajouter un sous-module</h3>
<pre class="pseudo">git submodule add https://github.com/org/lib-commune.git libs/commune   # ajoute le dépôt à l'emplacement libs/commune
# Cela crée/complète le fichier .gitmodules ET pose un "pointeur de commit" sur libs/commune.
git commit -m "chore: ajoute le sous-module lib-commune"                 # on committe l'ajout dans le dépôt principal</pre>
<p>Le fichier <strong>.gitmodules</strong> (versionné) enregistre l'URL et le chemin de chaque sous-module. Le dépôt principal, lui, stocke le <strong>hash du commit</strong> sur lequel le sous-module est verrouillé : c'est le fameux marque-page.</p>

<h3>3. Cloner un projet qui contient des sous-modules</h3>
<pre class="pseudo">git clone --recurse-submodules URL   # cloner ET récupérer d'un coup le contenu des sous-modules
# Si on a cloné SANS l'option, on rattrape avec :
git submodule update --init --recursive   # initialise et remplit les sous-modules (--recursive : même imbriqués)</pre>
<div class="warn">Piège n° 1 des sous-modules : un <code>git clone</code> classique récupère le dépôt principal mais laisse les dossiers de sous-modules <strong>vides</strong>. Il faut <code>--recurse-submodules</code> (au clone) ou <code>submodule update --init</code> (après coup), sinon « il manque du code ».</div>

<h3>4. Mettre à jour un sous-module</h3>
<pre class="pseudo">cd libs/commune                  # entrer dans le sous-module (c'est un vrai dépôt Git à part entière)
git fetch                        # récupérer les nouveautés de la bibliothèque
git checkout v2.1.0              # choisir la version voulue (tag ou commit)
cd ../..                         # revenir au dépôt principal
git add libs/commune             # enregistrer le NOUVEAU marque-page (le pointeur de commit a changé)
git commit -m "chore: maj lib-commune vers v2.1.0"   # committer ce déplacement dans le dépôt principal
# Raccourci pour tout mettre à la dernière version de leur branche suivie :
git submodule update --remote    # avance chaque sous-module sur le sommet de sa branche distante</pre>
<p>Retiens l'idée maîtresse : mettre à jour un sous-module, c'est <strong>déplacer le marque-page</strong> — un changement que tu dois committer dans le dépôt principal.</p>

<h3>5. Retirer un sous-module</h3>
<pre class="pseudo">git submodule deinit libs/commune   # désactiver le sous-module
git rm libs/commune                 # le retirer du suivi (met à jour .gitmodules)
git commit -m "chore: retire lib-commune"   # committer la suppression</pre>

<h3>6. Sous-module ou pas ? Les alternatives</h3>
<pre class="pseudo">Besoin : épingler une dépendance sur une version EXACTE et partagée   → sous-module (puissant mais exigeant)
Besoin : simple dépendance de code               → gestionnaire de paquets (npm, pip, NuGet...)   # souvent plus simple
Besoin : fusionner deux historiques en un seul   → subtree (git subtree)                            # alternative sans .gitmodules</pre>
<div class="warn">Les sous-modules sont <strong>puissants mais délicats</strong> : oublier de committer le déplacement du pointeur, cloner sans <code>--recurse-submodules</code>, ou modifier le sous-module sans le pousser sont des erreurs classiques. Ne les choisis que si tu as un vrai besoin de versionnage indépendant ; sinon, un gestionnaire de paquets est souvent plus simple.</div>
<p>Demain : trouver automatiquement le commit qui a introduit un bug, avec <code>git bisect</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Un sous-module permet :", opts: ["De copier le code d'un autre dépôt", "D'inclure un dépôt Git dans un autre, verrouillé sur un commit", "De supprimer une branche", "De configurer Git"], a: 1, exp: "Un dépôt dans un dépôt, séparés." },

    { type: "vf", q: "Un sous-module est un vrai dépôt Git à part entière.", a: true, exp: "On peut y entrer et y faire fetch/checkout." },
    { type: "qcm", q: "Mettre à jour un sous-module revient à :", opts: ["Copier son code", "Déplacer le marque-page (pointeur de commit) et le committer", "Supprimer le sous-module", "Renommer main"], a: 1, exp: "On committe le nouveau pointeur." },
    { type: "input", q: "Écris la commande qui avance chaque sous-module sur sa branche distante suivie.", a: ["git submodule update --remote"], ph: "git submodule update ...", exp: "update --remote." },
    { type: "qcm", q: "Après avoir changé la version d'un sous-module, dans le dépôt principal on fait :", opts: ["Rien", "git add <chemin> puis git commit (pour enregistrer le nouveau pointeur)", "git stash", "git reset"], a: 1, exp: "Le déplacement du pointeur doit être committé." },
    { type: "input", q: "Quelle commande désactive un sous-module (première étape du retrait) ?", a: ["git submodule deinit libs/commune", "git submodule deinit"], ph: "git submodule deinit ...", exp: "deinit puis git rm." },
    { type: "vf", q: "Pour une simple dépendance de code, un gestionnaire de paquets est souvent plus simple qu'un sous-module.", a: true, exp: "npm/pip/NuGet évitent la complexité des submodules." },
    { type: "qcm", q: "Une alternative qui fusionne les historiques sans .gitmodules :", opts: ["git subtree", "git stash", "git bisect", "git reflog"], a: 0, exp: "subtree intègre le code dans l'historique." },
    { type: "vf", q: "Oublier de committer le déplacement du pointeur est une erreur classique.", a: true, exp: "Les sous-modules sont puissants mais délicats." }
  ],

      { type: "qcm", q: "Après être entré dans libs/commune et avoir fait 'git checkout v2.1.0', dans le dépôt principal :", opts: ["Rien à faire", "git add libs/commune puis git commit", "git stash", "git reset --hard"], a: 1, exp: "Committer le nouveau pointeur." },
      { type: "input", q: "Le collègue clone en récupérant les sous-modules :", a: ["git clone --recurse-submodules url", "git clone --recurse-submodules"], ph: "git clone --recurse-submodules ...", exp: "--recurse-submodules." },
      { type: "qcm", q: "Il avait oublié l'option. Il rattrape avec :", opts: ["git submodule update --init --recursive", "git pull", "git stash", "git reflog"], a: 0, exp: "update --init remplit les sous-modules." },
      { type: "vf", q: "Le dépôt principal ne copie pas le code : il garde un pointeur de commit.", a: true, exp: "Le marque-page." }
    ],
    solution: `<pre class="pseudo">$ git submodule add https://github.com/org/lib-commune.git libs/commune   # ajouter le sous-module
$ git commit -m "chore: ajoute lib-commune"       # committer l'ajout (.gitmodules + pointeur)
$ cd libs/commune && git fetch && git checkout v2.1.0   # figer la version voulue

$ git clone --recurse-submodules URL               # clone + sous-modules remplis
$ # (oubli de l'option ?) git submodule update --init --recursive</pre>
<p>Une dépendance figée sur une version exacte. Demain : traquer le commit fautif avec git bisect.</p>`
