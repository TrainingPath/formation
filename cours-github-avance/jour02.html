<script>
var DAY = {
  num: 2,
  title: "Les stratégies de branches (Git Flow, trunk-based)",
  subtitle: "Choisir un modèle d'organisation des branches adapté à la façon dont l'équipe livre.",
  theory: `
<h3>1. Pourquoi une stratégie de branches ?</h3>
<p>Une <strong>stratégie de branches</strong> (en anglais <em>branching strategy</em>) est le <strong>plan d'urbanisme</strong> de ton dépôt : quelles branches existent, à quoi chacune sert, qui a le droit d'y écrire et comment les changements y arrivent. Sans plan, chaque développeur crée des routes au hasard : embouteillages (conflits), impasses (branches abandonnées), accidents (<code>main</code> cassé). Avec un plan, la circulation est fluide et prévisible.</p>
<p>Rappel : une <strong>branche</strong> est une ligne de développement parallèle — un pointeur mobile vers un commit. Le <strong>tronc</strong> (en anglais <em>trunk</em>) est la branche principale et stable, souvent nommée <code>main</code>.</p>

<h3>2. Trunk-based development</h3>
<p>Le <strong>trunk-based development</strong> (« développement basé sur le tronc ») repose sur une idée simple : <strong>tout le monde intègre son travail dans <code>main</code> très souvent</strong>, via de petites branches qui vivent quelques heures.</p>
<pre class="pseudo">main  ●───●───●───●───●───●     # le tronc, toujours vert (déployable)
       \   \       \
        f1  f2       f3         # branches minuscules, fusionnées en quelques heures via PR</pre>
<p>Avantages : peu de conflits (les branches divergent à peine), CI toujours à jour, déploiement continu facile. C'est le modèle des équipes qui livrent souvent (web, SaaS).</p>
<div class="tip">Variante : les <strong>feature flags</strong> (« interrupteurs de fonctionnalité ») permettent de fusionner du code inachevé dans main tout en le laissant éteint jusqu'à ce qu'il soit prêt. On intègre tôt sans exposer la fonctionnalité.</div>

<h3>3. GitHub Flow</h3>
<p><strong>GitHub Flow</strong> est un trunk-based légèrement formalisé : une seule branche permanente (<code>main</code>) + des branches courtes nommées, chacune fusionnée par <strong>pull request</strong> (demande de fusion relue par un humain et testée par la CI).</p>
<pre class="pseudo">1. brancher depuis main frais       # git switch main && git pull ; git switch -c feature/x
2. coder, committer, pousser        # travail visible tôt
3. ouvrir une pull request          # revue + CI
4. merger dans main, supprimer la branche   # main reste déployable</pre>

<h3>4. Git Flow</h3>
<p><strong>Git Flow</strong> est un modèle plus lourd, avec <strong>plusieurs branches permanentes</strong> :</p>
<pre class="pseudo">main       # ne contient QUE des versions livrées (chaque commit = une release taguée)
develop    # branche d'intégration : le prochain lot de fonctionnalités s'y accumule
feature/*  # une fonctionnalité en cours, part de develop et y retourne
release/*  # préparation d'une version : corrections finales, numéro de version
hotfix/*   # correctif urgent en production, part de main et retourne dans main ET develop</pre>
<p>Git Flow est pensé pour des <strong>versions espacées</strong> : logiciels installés, applications mobiles, produits avec plusieurs versions maintenues en parallèle. Il est trop cérémonieux pour du déploiement continu.</p>
<div class="warn">Ne choisis pas Git Flow « parce que c'est complet ». Sur un projet web qui déploie dix fois par jour, ses branches <code>develop</code> et <code>release/*</code> deviennent des goulots d'étranglement. La complexité doit servir un besoin réel.</div>

<h3>5. Conventions de nommage</h3>
<p>Quel que soit le modèle, nomme tes branches <strong>type/sujet</strong> pour qu'on lise l'intention d'un coup d'oeil :</p>
<pre class="pseudo">feature/reservations       # une nouvelle fonctionnalité
fix/stock-negatif          # une correction de bug
chore/maj-dependances      # tâche d'entretien (build, deps, config)
hotfix/paiement-casse      # correctif urgent en production
release/2.3.0              # préparation de la version 2.3.0</pre>

<h3>6. Comment choisir ?</h3>
<pre class="pseudo">Livraison FRÉQUENTE et automatique   → trunk-based / GitHub Flow   # web, SaaS, microservices
Versions ESPACÉES, plusieurs maintenues en parallèle → Git Flow   # logiciel installé, mobile, embarqué
Petite équipe, projet simple         → GitHub Flow (le défaut raisonnable)</pre>
<p>La bonne stratégie est celle que l'équipe <strong>respecte réellement</strong> et qui colle à son rythme de livraison. Une page écrite dans le README vaut mieux qu'un modèle parfait ignoré de tous.</p>`,
  exercises: [
    { type: "qcm", q: "Le « tronc » (trunk) désigne :", opts: ["Une branche jetable", "La branche principale stable (main)", "Un dépôt distant", "Un commit"], a: 1, exp: "Le tronc = main, la branche de référence." },
    { type: "qcm", q: "En trunk-based development, les branches de fonctionnalité :", opts: ["Vivent des semaines", "Sont très courtes (heures) et fusionnées souvent", "N'existent pas", "Remplacent main"], a: 1, exp: "Petites branches, intégration fréquente." },
    { type: "vf", q: "Le trunk-based facilite le déploiement continu.", a: true, exp: "main reste vert et à jour." },
    { type: "qcm", q: "Les feature flags servent à :", opts: ["Renommer les branches", "Fusionner du code inachevé mais désactivé", "Supprimer main", "Créer des tags"], a: 1, exp: "Un interrupteur cache la fonctionnalité tant qu'elle n'est pas prête." },
    { type: "qcm", q: "GitHub Flow a combien de branches PERMANENTES ?", opts: ["Zéro", "Une seule (main)", "Deux (main + develop)", "Cinq"], a: 1, exp: "main uniquement ; le reste est jetable." },
    { type: "input", q: "Dans Git Flow, quelle branche permanente sert à l'intégration du prochain lot ?", a: ["develop"], ph: "...", exp: "develop accumule les features avant release." },
    { type: "qcm", q: "Dans Git Flow, une branche release/* sert à :", opts: ["Coder une feature", "Préparer/stabiliser une version (numéro, corrections finales)", "Configurer Git", "Supprimer develop"], a: 1, exp: "Préparation de la version à livrer." },
    { type: "input", q: "Dans Git Flow, quel préfixe désigne un correctif urgent en production ?", a: ["hotfix", "hotfix/"], ph: ".../...", exp: "hotfix/* part de main et y retourne." },
    { type: "vf", q: "Git Flow convient aux projets qui déploient dix fois par jour.", a: false, exp: "Trop lourd : develop et release/* freinent." },
    { type: "input", q: "Nomme une branche de nouvelle fonctionnalité pour 'reservations' (convention type/sujet).", a: ["feature/reservations"], ph: ".../...", exp: "type/sujet : feature/reservations." },
    { type: "qcm", q: "Le préfixe 'chore/' désigne :", opts: ["Un bug", "Une tâche d'entretien (build, deps, config)", "Une release", "Un hotfix"], a: 1, exp: "chore = maintenance, pas de nouvelle valeur métier." },
    { type: "qcm", q: "Pour un SaaS qui livre plusieurs fois par jour, on choisit :", opts: ["Git Flow complet", "Trunk-based / GitHub Flow", "Aucune stratégie", "Une branche par développeur permanente"], a: 1, exp: "Intégration fréquente = trunk-based." },
    { type: "vf", q: "La meilleure stratégie est celle que l'équipe respecte vraiment.", a: true, exp: "Un modèle ignoré ne vaut rien." },
    { type: "input", q: "Dans Git Flow, sur quelle branche permanente ne trouve-t-on QUE des versions livrées ?", a: ["main"], ph: "...", exp: "main = uniquement des releases taguées." },
    { type: "qcm", q: "Où documenter la stratégie choisie ?", opts: ["Nulle part", "Dans le README (une page suffit)", "Dans un email", "Sur un post-it"], a: 1, exp: "Écrite et visible des nouveaux arrivants." }
  ],
  final: {
    title: "Exercice final — Choisir un modèle",
    intro: `<p>Trois contextes, une stratégie chacun.</p>`,
    questions: [
      { type: "qcm", q: "Un SaaS web déployé plusieurs fois par jour :", opts: ["Git Flow", "Trunk-based / GitHub Flow", "Aucun", "Une branche par dev"], a: 1, exp: "Livraison fréquente." },
      { type: "qcm", q: "Une app mobile avec versions maintenues en parallèle :", opts: ["Git Flow", "Trunk-based pur", "Pas de branches", "Commit direct sur main"], a: 0, exp: "Versions espacées : Git Flow." },
      { type: "input", q: "Nomme la branche du correctif urgent 'paiement casse' :", a: ["hotfix/paiement-casse"], ph: ".../...", exp: "hotfix/paiement-casse." },
      { type: "qcm", q: "Dans GitHub Flow, une branche fusionnée est :", opts: ["Gardée pour toujours", "Supprimée", "Renommée en main", "Archivée en zip"], a: 1, exp: "Jetable par conception." },
      { type: "vf", q: "Un feature flag permet d'intégrer tôt sans exposer la fonctionnalité.", a: true, exp: "On fusionne éteint, on allume plus tard." }
    ],
    solution: `<pre class="pseudo"># SaaS web (livraison fréquente) → GitHub Flow / trunk-based
main ●──●──●──●        # toujours vert
      \\  \\   \\
      f1 f2   f3       # branches courtes, PR, merge, suppression

# App mobile (versions espacées) → Git Flow
main    ●─────────●(v2.3)──────●(v2.4)   # uniquement des releases
develop ●─●─●─●─●─●    # intégration
        feature/* release/* hotfix/*     # branches spécialisées

# Nommer toujours type/sujet : feature/... fix/... chore/... hotfix/...</pre>
<p>La stratégie suit le rythme de livraison, pas l'inverse. Demain : réécrire proprement l'historique avec le rebase.</p>`
  }
};
</script>
