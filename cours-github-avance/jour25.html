var DAY = {
  num: 25,
  title: "Dependabot et sécurité des dépendances",
  subtitle: "Garder ses dépendances à jour et corriger les failles connues, automatiquement.",
  theory: `
<h3>1. Le risque : les dépendances vieillissent et deviennent vulnérables</h3>
<p>Un projet moderne repose sur des dizaines, voire des centaines de <strong>dépendances</strong> : des bibliothèques écrites par d'autres. Chacune peut receler une <strong>vulnérabilité</strong> — une faille de sécurité — découverte après coup. Une faille publiée reçoit un identifiant <strong>CVE</strong> (<em>Common Vulnerabilities and Exposures</em>, le catalogue mondial des failles connues). Ne pas mettre à jour, c'est laisser des portes ouvertes que tout le monde peut trouver.</p>
<div class="warn">La majorité des incidents de sécurité applicatifs viennent non pas du code maison, mais de <strong>dépendances obsolètes</strong> contenant des failles publiquement connues. Une dépendance non mise à jour est une dette de sécurité silencieuse.</div>

<h3>2. Dependabot : le robot qui surveille et corrige</h3>
<p><strong>Dependabot</strong> est un service intégré à GitHub qui <strong>surveille tes dépendances</strong>, t'<strong>alerte</strong> quand l'une d'elles est vulnérable, et peut <strong>ouvrir automatiquement des pull requests</strong> pour les mettre à jour. Il rend visible et actionnable un travail habituellement négligé. Il agit sur trois fronts : les <strong>alertes</strong>, les <strong>mises à jour de sécurité</strong> et les <strong>mises à jour de version</strong>.</p>
<pre class="pseudo">Dependabot alerts          : te PREVIENT qu'une dependance est vulnerable (CVE)
Dependabot security updates: ouvre une PR pour corriger la faille (version corrigee)
Dependabot version updates : ouvre des PR pour suivre les nouvelles versions (routine)</pre>

<h3>3. Activer les mises à jour de version : dependabot.yml</h3>
<p>Les mises à jour de version se configurent dans un fichier <code>.github/dependabot.yml</code>. On y déclare chaque <strong>écosystème</strong> de paquets à surveiller (npm, pip, Docker, GitHub Actions…) et la <strong>fréquence</strong> des vérifications.</p>
<pre class="pseudo">version: 2
updates:
  - package-ecosystem: "npm"             # ecosysteme surveille : npm
    directory: "/"                       # ou se trouve le manifeste (package.json)
    schedule:
      interval: "weekly"                 # verifie une fois par semaine
    open-pull-requests-limit: 5          # au plus 5 PR ouvertes en meme temps
  - package-ecosystem: "github-actions"  # on met aussi a jour les ACTIONS des workflows
    directory: "/"
    schedule:
      interval: "weekly"</pre>
<div class="tip">Surveiller <code>github-actions</code> est une bonne pratique de sécurité : Dependabot te proposera de bumper les versions d'actions tierces (jour 22), y compris quand tu les as épinglées sur un SHA — il met à jour le SHA vers une version saine.</p></div>

<h3>4. La PR Dependabot : à relire, pas à fusionner les yeux fermés</h3>
<p>Chaque proposition arrive comme une <strong>pull request</strong> normale, avec le changelog et le niveau de gravité. On la traite comme n'importe quelle PR : la <strong>CI</strong> doit passer (les tests attrapent une régression éventuelle), puis un humain relit.</p>
<pre class="pseudo">1. Dependabot ouvre une PR : "bump lodash 4.17.20 -&gt; 4.17.21 (faille corrigee)"
2. La CI se lance sur la PR : tests verts = la mise a jour ne casse rien   # filet de securite
3. On relit la gravite et le changelog
4. On merge (les mises a jour de securite sont prioritaires)</pre>
<div class="warn">Ne fusionne jamais une mise à jour <strong>majeure</strong> sans regarder : un changement de version majeure (ex. 3.x → 4.x) peut casser l'API. C'est justement pour ça que la CI tourne sur la PR Dependabot : elle sert de garde-fou avant le merge.</div>

<h3>5. Le graphe de dépendances et les mises à jour de sécurité</h3>
<p>GitHub construit un <strong>graphe de dépendances</strong> : la carte de tout ce dont ton projet dépend, directement et indirectement (les dépendances de tes dépendances, dites <em>transitives</em>). C'est ce graphe, croisé avec la base des CVE, qui déclenche les <strong>alertes</strong>. Les <strong>mises à jour de sécurité</strong> s'activent en un clic dans <code>Settings &gt; Code security</code>, sans même écrire de fichier.</p>
<pre class="pseudo">Settings &gt; Code security :
- Dependency graph         : ON   # cartographie des dependances (base des alertes)
- Dependabot alerts        : ON   # prevenu des failles connues
- Dependabot security updates: ON # PR de correction automatiques</pre>
<div class="tip">Retenir la chaîne : <strong>graphe de dépendances</strong> → croisé avec les <strong>CVE</strong> → <strong>alerte</strong> → <strong>PR de correction</strong> → CI verte → merge. Tout est traçable et passe par la revue, jamais un secret ni une clé n'est exposé dans ce processus.</div>`,
  exercises: [

    { type: "vf", q: "La CI qui tourne sur une PR Dependabot sert de garde-fou avant le merge.", a: true, exp: "Les tests attrapent une régression." },
    { type: "vf", q: "On peut fusionner une mise à jour majeure sans la relire.", a: false, exp: "Une version majeure peut casser l'API : on relit." },
    { type: "qcm", q: "Le graphe de dépendances est…", opts: ["La liste des branches", "La carte de tout ce dont le projet dépend, directement et transitivement", "Un secret", "Le journal de la CI"], a: 1, exp: "Base des alertes, croisé avec les CVE." },
    { type: "qcm", q: "Une dépendance transitive est…", opts: ["Une branche temporaire", "Une dépendance de tes dépendances (indirecte)", "Un secret partagé", "Un tag"], a: 1, exp: "Indirecte, mais surveillée aussi." },
    { type: "qcm", q: "Surveiller l'écosystème github-actions permet…", opts: ["De supprimer les workflows", "De mettre à jour les versions d'actions tierces (y compris les SHA épinglés)", "De chiffrer les logs", "De créer des tags"], a: 1, exp: "Bonne pratique de sécurité de la chaîne." },
    { type: "vf", q: "Les mises à jour de sécurité Dependabot peuvent s'activer sans écrire de fichier, dans les réglages.", a: true, exp: "Settings > Code security, en un clic." },
    { type: "qcm", q: "La chaîne de la sécurité des dépendances est…", opts: ["secret → log → merge", "graphe → CVE → alerte → PR de correction → CI verte → merge", "tag → branche → prod", "runner → cache → artefact"], a: 1, exp: "Traçable et passant par la revue." },
    { type: "input", q: "Quel paramètre limite le nombre de PR Dependabot ouvertes simultanément ? (le mot-clé seul)", a: ["open-pull-requests-limit", "open-pull-requests-limit:"], ph: "un mot-clé", exp: "Évite d'être submergé de PR." }
  ],
  final: {
    title: "Exercice final — Mettre en place Dependabot",
    intro: `<p>Tu veux surveiller les paquets npm ET les actions GitHub, en hebdomadaire, avec au plus 5 PR ouvertes, et activer les alertes de sécurité.</p>`,
    questions: [
      { type: "input", q: "Dans quel fichier écris-tu la config des mises à jour de version ? (le chemin/nom)", a: [".github/dependabot.yml", "dependabot.yml", "dependabot.yaml"], ph: "un fichier", exp: ".github/dependabot.yml." },
      { type: "input", q: "Quelle valeur de package-ecosystem pour npm ? (le mot, sans guillemets)", a: ["npm"], ph: "un mot", exp: "package-ecosystem: 'npm'." },
      { type: "input", q: "Quelle valeur d'interval pour une vérification hebdomadaire ? (le mot en anglais)", a: ["weekly"], ph: "un mot", exp: "interval: 'weekly'." },
      { type: "qcm", q: "Les propositions arrivent comme…", opts: ["des commits directs", "des pull requests à tester et relire", "des tags", "des secrets"], a: 1, exp: "Des PR normales." },
      { type: "vf", q: "Activer Dependabot alerts nécessite le graphe de dépendances activé.", a: true, exp: "Le graphe est la base des alertes." }
    ],
    solution: `<pre class="pseudo"># .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"                 # verification hebdomadaire
    open-pull-requests-limit: 5          # au plus 5 PR ouvertes
  - package-ecosystem: "github-actions"  # on surveille aussi les actions
    directory: "/"

# Puis dans Settings &gt; Code security :
#   Dependency graph : ON
#   Dependabot alerts : ON            # prevenu des CVE
#   Dependabot security updates : ON  # PR de correction automatiques</pre>
<p>Chaque semaine, Dependabot ouvre des PR de mise à jour ; la CI les teste ; on relit et on merge. Les correctifs de sécurité sont prioritaires et jamais fusionnés à l'aveugle.</p>`
  }
};
