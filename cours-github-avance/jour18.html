<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jour 18</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 18,
  title: "Matrices de build et parallélisme",
  subtitle: "Tester une seule fois, sur toutes les versions et tous les systèmes à la fois.",
  theory: `
<h3>1. Le besoin : tester sur plusieurs configurations</h3>
<p>Ton code doit peut-être fonctionner sur Node 18, 20 et 22, ou sur Linux, macOS et Windows. Écrire un job séparé pour chaque combinaison serait long et répétitif. La <strong>matrice</strong> (en anglais <em>matrix</em>) résout ce problème : à partir d'un <strong>seul</strong> descriptif de job, GitHub génère automatiquement <strong>autant de jobs qu'il y a de combinaisons</strong>, et les exécute <strong>en parallèle</strong>.</p>

<h3>2. Définition : une matrice de build</h3>
<p>Une <strong>matrice de build</strong> est un ensemble de variables listées sous <code>strategy.matrix</code>. GitHub calcule le <strong>produit cartésien</strong> de ces listes (toutes les combinaisons possibles) et crée un job par combinaison. Le <strong>parallélisme</strong>, c'est le fait d'exécuter ces jobs <strong>en même temps</strong> sur des machines différentes, pour aller plus vite.</p>
<pre class="pseudo">jobs:
  test:
    runs-on: \${{ matrix.os }}            # le systeme vient de la matrice
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]   # 2 systemes
        node: [18, 20, 22]                     # 3 versions de Node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}  # la version vient de la matrice
      - run: npm ci &amp;&amp; npm test          # installe et teste</pre>
<p>Ici 2 systèmes × 3 versions = <strong>6 jobs</strong> lancés en parallèle. Chaque job affiche la combinaison dans son nom, par exemple <code>test (ubuntu-latest, 20)</code>.</p>
<div class="tip">Une valeur de matrice se lit avec le contexte <code>matrix</code> : <code>\${{ matrix.os }}</code>, <code>\${{ matrix.node }}</code>. Le nom des clés (<code>os</code>, <code>node</code>) est libre : ce sont les tiens.</div>

<h3>3. Ajouter, exclure, personnaliser des combinaisons</h3>
<pre class="pseudo">strategy:
  matrix:
    os: [ubuntu-latest, windows-latest]
    node: [18, 20]
    include:                             # AJOUTE une combinaison sur-mesure...
      - os: macos-latest
        node: 22
        experimental: true              # ...avec une variable en plus, propre a ce cas
    exclude:                             # RETIRE une combinaison du produit cartesien
      - os: windows-latest
        node: 18                        # on ne teste pas Node 18 sur Windows</pre>
<p><code>include</code> ajoute des combinaisons (ou enrichit celles qui existent), <code>exclude</code> en retire. On les utilise pour couvrir un cas spécial sans démultiplier toute la matrice.</p>

<h3>4. Maîtriser l'échec : fail-fast et max-parallel</h3>
<p>Par défaut, si un job de la matrice échoue, GitHub <strong>annule immédiatement</strong> tous les autres : c'est le comportement <strong>fail-fast</strong> (« échouer vite »). Pratique pour économiser, gênant quand tu veux voir <em>tous</em> les échecs d'un coup.</p>
<pre class="pseudo">strategy:
  fail-fast: false                       # NE PAS tout annuler au premier echec : on veut tout voir
  max-parallel: 2                        # limite le nombre de jobs simultanes (quotas, ressources)
  matrix:
    node: [18, 20, 22]</pre>
<div class="warn"><code>fail-fast: false</code> est très utile pour diagnostiquer : tu obtiens le résultat de chaque version, pas seulement de la première qui casse. En contrepartie, tu consommes plus de minutes de calcul.</div>

<h3>5. Pourquoi le parallélisme accélère (et ses limites)</h3>
<pre class="pseudo">6 jobs x 3 min chacun...
  en serie   : 18 min au total          # l'un apres l'autre
  en parallele : ~3 min (mur d'horloge) # tous en meme temps sur 6 machines</pre>
<p>Le parallélisme réduit le temps <strong>ressenti</strong> (le « temps mural »), pas le temps de calcul total facturé. Les limites viennent des <strong>quotas</strong> de ton compte (nombre de jobs simultanés autorisés) et des dépendances : un job qui doit attendre un autre ne peut pas être parallélisé (mot-clé <code>needs</code>, vu au jour 19).</p>
<div class="tip">Retenir : la matrice sert à la <strong>couverture</strong> (tester partout) ; le parallélisme sert à la <strong>vitesse</strong> (tout en même temps). Une matrice bien pensée reste petite : chaque combinaison ajoutée coûte des minutes.</div>`,
  exercises: [
    { type: "qcm", q: "Une matrice de build sert à…", opts: ["Chiffrer des secrets", "Générer plusieurs jobs depuis un seul descriptif, sur plusieurs configurations", "Créer des branches", "Fusionner des PR"], a: 1, exp: "Un descriptif → N jobs (produit cartésien)." },
    { type: "input", q: "Sous quelle clé (chemin) définit-on une matrice ? Réponds strategy.___", a: ["matrix", "strategy.matrix"], ph: "strategy.___", exp: "strategy.matrix contient les listes de variables." },
    { type: "qcm", q: "Avec os: [ubuntu, windows] et node: [18, 20, 22], combien de jobs ?", opts: ["3", "5", "6", "2"], a: 2, exp: "2 × 3 = 6 (produit cartésien)." },
    { type: "input", q: "Comment lit-on la version de Node définie dans la matrice ? Écris l'expression ${{ ... }}", a: ["${{ matrix.node }}", "${{matrix.node}}"], ph: "${{ ... }}", exp: "Le contexte matrix expose chaque clé." },
    { type: "qcm", q: "Le parallélisme, c'est…", opts: ["Exécuter les jobs l'un après l'autre", "Exécuter les jobs en même temps sur des machines différentes", "Chiffrer les logs", "Annuler les jobs"], a: 1, exp: "En même temps → temps mural réduit." },
    { type: "input", q: "Quel mot-clé de matrice AJOUTE une combinaison sur-mesure ? (le mot-clé seul)", a: ["include", "include:"], ph: "un mot-clé", exp: "include ajoute ou enrichit des combinaisons." },
    { type: "input", q: "Quel mot-clé de matrice RETIRE une combinaison du produit cartésien ? (le mot-clé seul)", a: ["exclude", "exclude:"], ph: "un mot-clé", exp: "exclude enlève une combinaison précise." },
    { type: "qcm", q: "Le comportement fail-fast par défaut…", opts: ["Ignore tous les échecs", "Annule les autres jobs dès qu'un job échoue", "Relance les jobs échoués", "Envoie un email"], a: 1, exp: "Au premier échec, le reste est annulé." },
    { type: "input", q: "Quel réglage passer à false pour voir TOUS les échecs de la matrice ? (le mot-clé seul)", a: ["fail-fast", "fail-fast:"], ph: "un mot-clé", exp: "fail-fast: false laisse tous les jobs aller au bout." },
    { type: "qcm", q: "À quoi sert max-parallel ?", opts: ["À chiffrer la matrice", "À limiter le nombre de jobs exécutés simultanément", "À ajouter des versions", "À supprimer des jobs"], a: 1, exp: "Contrôle la concurrence (quotas, ressources)." },
    { type: "vf", q: "Le parallélisme réduit le temps de calcul total facturé.", a: false, exp: "Il réduit le temps mural (ressenti), pas le total facturé." },
    { type: "vf", q: "Chaque combinaison ajoutée à la matrice coûte des minutes de calcul.", a: true, exp: "D'où l'intérêt d'une matrice raisonnable." },
    { type: "qcm", q: "Le nom des clés de la matrice (os, node)…", opts: ["Est imposé par GitHub", "Est libre : ce sont tes propres noms", "Doit être en majuscules", "Doit commencer par matrix_"], a: 1, exp: "Tu choisis les noms ; tu les relis via matrix.NOM." },
    { type: "qcm", q: "Un job qui doit attendre un autre job…", opts: ["Se parallélise quand même", "Ne peut pas être parallélisé (dépendance needs)", "Est plus rapide", "Est ignoré"], a: 1, exp: "needs crée une dépendance séquentielle." },
    { type: "vf", q: "include peut aussi enrichir une combinaison existante avec une variable supplémentaire.", a: true, exp: "Ex. ajouter experimental: true à un cas précis." }
  ],
  final: {
    title: "Exercice final — Concevoir une matrice",
    intro: `<p>Tu veux tester ton projet sur Node 18, 20 et 22, sur Ubuntu et Windows, MAIS sans tester Node 18 sur Windows, et tu veux voir tous les échecs.</p>`,
    questions: [
      { type: "qcm", q: "Combien de combinaisons AVANT exclusion ?", opts: ["4", "5", "6", "3"], a: 2, exp: "2 systèmes × 3 versions = 6." },
      { type: "qcm", q: "Combien de jobs APRÈS avoir exclu (windows, 18) ?", opts: ["6", "5", "4", "3"], a: 1, exp: "6 − 1 = 5." },
      { type: "input", q: "Quel mot-clé règle-t-on à false pour voir tous les échecs ? (le mot-clé seul)", a: ["fail-fast", "fail-fast:"], ph: "un mot-clé", exp: "fail-fast: false." },
      { type: "input", q: "Quel mot-clé sert à retirer la combinaison (windows, 18) ? (le mot-clé seul)", a: ["exclude", "exclude:"], ph: "un mot-clé", exp: "exclude retire la combinaison." },
      { type: "vf", q: "Ces 5 jobs s'exécutent en parallèle, ce qui réduit le temps mural.", a: true, exp: "Parallélisme = vitesse ressentie." }
    ],
    solution: `<pre class="pseudo">jobs:
  test:
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false                   # on veut TOUS les resultats, pas seulement le premier echec
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - os: windows-latest           # on ne teste pas...
            node: 18                      # ...Node 18 sur Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}
      - run: npm ci &amp;&amp; npm test</pre>
<p>Résultat : 6 − 1 = <strong>5 jobs</strong>, en parallèle, chacun affichant sa combinaison. Avec <code>fail-fast: false</code>, un échec sur une version n'empêche pas de voir les autres.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta matrice ici…",
  items: [
  { id: "ghadv-j18", title: "Une matrice multi-OS avec cas spécial", level: 3,
    statement: "Écris un job test qui tourne sur ubuntu-latest et macos-latest, avec Python 3.10 et 3.12. Ajoute via include un cas macos-latest + Python 3.13 marqué experimental: true. Désactive fail-fast pour voir tous les résultats. Le job installe les dépendances et lance pytest. Commente les lignes clés.",
    hints: [

    note: "Deux systemes x deux versions = 4 jobs, plus le cas include = 5 jobs au total. include sert exactement a couvrir une version en avance (3.13) uniquement la ou c'est pertinent, sans l'imposer partout. fail-fast: false transforme la matrice en veritable tableau de diagnostic : chaque case donne son verdict independamment." }
  ]
};
</script>
