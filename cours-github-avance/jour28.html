  title: "L'API GitHub et le CLI gh",

  theory: `
<h3>1. Une API, pour parler à GitHub par programme</h3>
<p>Une <strong>API</strong> (<em>Application Programming Interface</em>, « interface de programmation ») est un ensemble de points d'entrée qu'un service expose pour qu'on interagisse avec lui <strong>par programme</strong>, sans interface graphique. GitHub expose une <strong>API REST</strong> : chaque ressource (dépôt, issue, pull request, utilisateur) a une <strong>URL</strong>, et on agit dessus avec des <strong>verbes HTTP</strong>.</p>
<pre class="pseudo">GET    /repos/OWNER/REPO/issues        # LIRE les issues d'un depot
POST   /repos/OWNER/REPO/issues        # CREER une issue
PATCH  /repos/OWNER/REPO/issues/42     # MODIFIER l'issue 42
DELETE ...                             # SUPPRIMER une ressource</pre>
<p><strong>REST</strong> (<em>Representational State Transfer</em>) est un style d'API où l'on manipule des <strong>ressources</strong> via des URL et des verbes HTTP standard : <code>GET</code> (lire), <code>POST</code> (créer), <code>PATCH</code>/<code>PUT</code> (modifier), <code>DELETE</code> (supprimer). Les réponses sont généralement en <strong>JSON</strong>.</p>

<h3>2. Le CLI gh : l'API rendue simple</h3>
<p>Le <strong>CLI gh</strong> (<em>Command Line Interface</em>, « interface en ligne de commande ») est l'outil officiel de GitHub pour le terminal. Il enveloppe l'API dans des commandes lisibles : au lieu de construire des requêtes HTTP, tu écris <code>gh issue list</code>. Il gère l'authentification pour toi.</p>
<pre class="pseudo">gh auth login                          # s'authentifier une fois (navigateur ou jeton)
gh repo view OWNER/REPO                # afficher un depot
gh issue list --state open            # lister les issues ouvertes
gh issue create --title "Bug" --body "..."   # creer une issue
gh pr create --fill                   # ouvrir une PR (titre/corps depuis les commits)
gh pr checks                          # voir l'etat de la CI d'une PR
gh run list                           # lister les executions de workflows</pre>
<div class="tip">Le <code>gh</code> est le moyen le plus rapide d'automatiser des gestes répétitifs. Ce qui prend cinq clics dans le navigateur tient en une commande — et une commande, ça se met dans un script (jour 29).</p></div>

<h3>3. Authentification : jamais de mot de passe</h3>
<p>Toute action non publique exige une <strong>authentification</strong>. En local, <code>gh auth login</code> te connecte. Dans un script ou un workflow, on fournit un <strong>jeton</strong> (token) via la variable d'environnement <code>GH_TOKEN</code> — typiquement le <code>GITHUB_TOKEN</code> de l'exécution (jour 17).</p>
<pre class="pseudo"># dans un workflow
- run: gh issue comment 42 --body "CI verte"
  env:
    GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}   # le CLI lit ce jeton pour s'authentifier</pre>
<div class="warn">Jamais de mot de passe ni de jeton en clair dans une commande ou un script versionné. Le jeton vient toujours d'un secret, injecté via <code>env:</code>. C'est la règle de sécurité du jour 17 appliquée au CLI.</div>

<h3>4. Requêtes brutes : gh api</h3>
<p>Quand une action n'a pas de commande dédiée, <code>gh api</code> appelle <strong>directement</strong> un point d'entrée de l'API REST, en gérant l'authentification. On précise le verbe avec <code>--method</code> et les champs avec <code>-f</code> (champ) — pratique pour scripter n'importe quelle opération.</p>
<pre class="pseudo">gh api /repos/OWNER/REPO               # GET brut : infos du depot (JSON)
gh api /repos/OWNER/REPO/issues \\
  --method POST -f title="Automatisee" -f body="creee via l'API"   # POST : creer une issue
gh api /user --jq '.login'            # extraire un champ du JSON avec --jq</pre>
<p><code>--jq</code> applique une expression <strong>jq</strong> (un langage de filtrage de JSON) directement sur la réponse : on récupère exactement le champ voulu, sans outil externe.</p>

<h3>5. Pagination, limites et bonnes pratiques</h3>
<pre class="pseudo">gh api --paginate /repos/OWNER/REPO/issues   # --paginate : recupere TOUTES les pages d'un coup</pre>
<p>L'API renvoie les longues listes par <strong>pages</strong> (la <strong>pagination</strong> découpe les résultats en morceaux) ; <code>--paginate</code> les rassemble. GitHub impose aussi une <strong>limite de débit</strong> (<em>rate limit</em>) : un nombre maximum de requêtes par heure. Bien s'authentifier augmente cette limite ; éviter les boucles inutiles la préserve.</p>
<div class="tip">Ordre mental : l'<strong>API REST</strong> est le socle (URL + verbes HTTP + JSON) ; le <strong>CLI gh</strong> est la couche pratique par-dessus (<code>gh issue</code>, <code>gh pr</code>…) ; <code>gh api</code> est la trappe d'accès direct quand aucune commande dédiée n'existe. Tout cela s'authentifie par jeton, jamais par mot de passe.</div>`,

    { type: "qcm", q: "Le rate limit est…", opts: ["Une branche", "Une limite du nombre de requêtes par heure", "Un secret", "Un artefact"], a: 1, exp: "S'authentifier l'augmente ; éviter les boucles inutiles le préserve." },
    { type: "qcm", q: "L'ordre logique est…", opts: ["gh api est le socle, REST par-dessus", "API REST = socle ; CLI gh = couche pratique ; gh api = accès direct", "les deux sont identiques", "gh ne sert qu'aux issues"], a: 1, exp: "gh simplifie l'API ; gh api ouvre la trappe brute." }
  ],

    solution: `<pre class="pseudo"># En local, apres 'gh auth login' :

<p>Le même geste s'écrit en local (via <code>gh auth login</code>) ou en workflow (via <code>GH_TOKEN</code>). L'API REST est le socle, <code>gh</code> la rend simple, <code>gh api</code> ouvre l'accès brut.</p>`
