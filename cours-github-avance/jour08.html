<script>
var DAY = {
  num: 8,
  title: "Les hooks Git (pre-commit, pre-push)",
  subtitle: "Déclencher automatiquement des scripts à chaque étape clé de Git.",
  theory: `
<h3>1. Qu'est-ce qu'un hook ?</h3>
<p>Un <strong>hook</strong> (en anglais « crochet », « point d'accroche ») est un <strong>script que Git lance automatiquement</strong> à un moment précis : avant un commit, avant un push, après un merge… C'est un <strong>détecteur de fumée</strong> branché sur ton dépôt : dès qu'un événement se produit, il se déclenche tout seul et peut <strong>bloquer</strong> l'action si quelque chose ne va pas.</p>
<p>Concrètement, un hook est un fichier exécutable rangé dans le dossier caché <code>.git/hooks/</code> de ton dépôt. Son <strong>nom</strong> détermine QUAND Git l'appelle.</p>

<h3>2. Où vivent les hooks ?</h3>
<pre class="pseudo">.git/hooks/                     # le dossier des hooks (dans chaque dépôt local)
.git/hooks/pre-commit.sample    # Git fournit des EXEMPLES en .sample (désactivés)
# Pour activer : retirer .sample, rendre le fichier exécutable, et le remplir.
chmod +x .git/hooks/pre-commit  # rendre le hook exécutable (indispensable sous Linux/macOS)</pre>
<div class="warn">Les hooks vivent dans <code>.git/</code>, qui n'est <strong>PAS versionné</strong> : ils ne sont donc PAS partagés par un simple clone. Pour les diffuser à l'équipe, on utilise un dossier versionné + <code>core.hooksPath</code>, ou un outil dédié (voir §6).</div>

<h3>3. Hooks côté client les plus utiles</h3>
<pre class="pseudo">pre-commit   # AVANT que le commit soit créé : lint, formatage, tests rapides. Sortie ≠ 0 → commit ANNULÉ.
prepare-commit-msg  # pour pré-remplir le message de commit
commit-msg   # AVANT d'enregistrer le message : vérifier qu'il respecte une convention (ex. "feat:", "fix:")
pre-push     # AVANT d'envoyer au distant : lancer la suite de tests complète. Sortie ≠ 0 → push BLOQUÉ.
post-merge   # APRÈS un merge : ex. réinstaller les dépendances si elles ont changé</pre>
<p>Point clé : un hook « pre- » qui se termine par un <strong>code de sortie différent de zéro</strong> <strong>annule</strong> l'opération. C'est ainsi qu'un hook <em>empêche</em> un commit ou un push non conforme.</p>

<h3>4. Un pre-commit qui bloque le code mal formaté</h3>
<pre class="pseudo">#!/bin/sh
# .git/hooks/pre-commit  — lance le linter avant chaque commit
npm run lint            # vérifie le style du code
if [ $? -ne 0 ]; then   # si le linter a échoué (code de retour non nul)...
  echo "Lint échoué : commit annulé."
  exit 1               # ... sortie 1 → Git ANNULE le commit
fi
exit 0                 # sinon sortie 0 → le commit continue</pre>

<h3>5. Un commit-msg qui impose une convention</h3>
<pre class="pseudo">#!/bin/sh
# .git/hooks/commit-msg  — reçoit en argument le fichier contenant le message
motif="^(feat|fix|chore|docs|test|refactor): "   # préfixes autorisés
if ! grep -qE "$motif" "$1"; then                 # $1 = chemin du message de commit
  echo "Message invalide : commence par feat:, fix:, chore:, ..."
  exit 1                                            # message non conforme → commit refusé
fi</pre>
<div class="tip">On peut contourner ponctuellement un hook client avec <code>git commit --no-verify</code> (ou <code>-n</code>). Utile en urgence, mais à ne pas banaliser : la vraie garantie viendra des vérifications côté serveur (la CI, jours 14-16), que le développeur ne peut pas sauter.</div>

<h3>6. Partager les hooks avec l'équipe</h3>
<pre class="pseudo">git config core.hooksPath .githooks   # pointer Git vers un dossier VERSIONNÉ (.githooks) au lieu de .git/hooks
# → les hooks sont alors dans le dépôt, clonés et partagés par tous</pre>
<p>En pratique, beaucoup d'équipes utilisent un outil comme <strong>pre-commit</strong> (framework) ou <strong>Husky</strong> (côté Node.js) pour installer et versionner les hooks proprement. L'idée reste la même : <strong>automatiser les vérifications au plus tôt</strong>, sur le poste du développeur. Mais souviens-toi : un hook client est un <em>garde-fou pratique</em>, pas une sécurité infranchissable — le vrai verrou, c'est la CI. Demain : les sous-modules.</p>`,
  exercises: [
    { type: "qcm", q: "Un hook Git est :", opts: ["Une branche spéciale", "Un script lancé automatiquement à un moment précis", "Un commit", "Un dépôt distant"], a: 1, exp: "Un crochet déclenché par un événement." },
    { type: "input", q: "Dans quel dossier (chemin) vivent les hooks d'un dépôt ?", a: [".git/hooks", ".git/hooks/"], ph: "...", exp: ".git/hooks/." },
    { type: "qcm", q: "Le hook qui s'exécute AVANT la création du commit :", opts: ["post-commit", "pre-commit", "pre-push", "commit-msg"], a: 1, exp: "pre-commit : lint, format, tests rapides." },
    { type: "vf", q: "Les hooks dans .git/hooks sont partagés automatiquement par un clone.", a: false, exp: ".git n'est pas versionné : non partagé." },
    { type: "qcm", q: "Un hook 'pre-' annule l'opération quand il :", opts: ["Affiche un message", "Se termine avec un code de sortie non nul", "Dure trop longtemps", "Est vide"], a: 1, exp: "exit != 0 → opération annulée." },
    { type: "input", q: "Quel hook vérifie le MESSAGE de commit (ex. convention feat:/fix:) ?", a: ["commit-msg"], ph: "...", exp: "commit-msg reçoit le fichier du message." },
    { type: "qcm", q: "Le hook idéal pour lancer la suite de tests complète avant l'envoi :", opts: ["pre-commit", "pre-push", "post-merge", "commit-msg"], a: 1, exp: "pre-push : tests avant de publier." },
    { type: "input", q: "Quelle commande rend un hook exécutable sous Linux/macOS ?", a: ["chmod +x .git/hooks/pre-commit", "chmod +x"], ph: "chmod ...", exp: "chmod +x sur le fichier." },
    { type: "vf", q: "git commit --no-verify saute les hooks client de commit.", a: true, exp: "-n contourne pre-commit et commit-msg." },
    { type: "input", q: "Quelle clé de config pointe Git vers un dossier de hooks VERSIONNÉ ?", a: ["core.hookspath", "core.hooksPath"], ph: "core....", exp: "core.hooksPath .githooks." },
    { type: "qcm", q: "Le hook post-merge sert typiquement à :", opts: ["Annuler un merge", "Réinstaller les dépendances si elles ont changé", "Bloquer un commit", "Renommer main"], a: 1, exp: "Une action APRÈS le merge." },
    { type: "qcm", q: "Ce qui détermine QUAND Git appelle un hook :", opts: ["Sa taille", "Son NOM de fichier", "Son auteur", "Sa date"], a: 1, exp: "pre-commit, pre-push... le nom fixe le moment." },
    { type: "vf", q: "Un hook client est une sécurité infranchissable, meilleure que la CI.", a: false, exp: "Contournable (--no-verify) : la CI reste le vrai verrou." },
    { type: "qcm", q: "Des outils pour installer/versionner les hooks proprement :", opts: ["Docker et Nginx", "pre-commit (framework) et Husky", "npm start", "git clone"], a: 1, exp: "Frameworks dédiés aux hooks." },
    { type: "input", q: "Écris l'option courte de git commit qui SAUTE les hooks de vérification.", a: ["--no-verify", "-n"], ph: "--...", exp: "--no-verify (ou -n)." }
  ],
  final: {
    title: "Exercice final — Un pre-commit qui protège le dépôt",
    intro: `<p>Tu installes un hook pre-commit qui lance le linter et bloque le commit si le style échoue.</p>`,
    questions: [
      { type: "input", q: "Chemin du fichier du hook :", a: [".git/hooks/pre-commit"], ph: ".git/hooks/...", exp: "pre-commit." },
      { type: "input", q: "Le rendre exécutable :", a: ["chmod +x .git/hooks/pre-commit"], ph: "chmod ...", exp: "chmod +x." },
      { type: "qcm", q: "Pour BLOQUER le commit si le lint échoue, le script doit :", opts: ["exit 0", "exit 1 (code non nul)", "afficher un warning seulement", "git push"], a: 1, exp: "Sortie non nulle → commit annulé." },
      { type: "qcm", q: "Un développeur pressé peut ponctuellement le contourner avec :", opts: ["git commit --no-verify", "git reset", "git stash", "git config"], a: 0, exp: "--no-verify saute les hooks client." },
      { type: "vf", q: "La garantie ultime reste la CI côté serveur, non contournable par le dev.", a: true, exp: "Le hook client est un garde-fou, pas un verrou." }
    ],
    solution: `<pre class="pseudo">$ cat > .git/hooks/pre-commit <<'FIN'
#!/bin/sh
npm run lint                 # vérifier le style avant chaque commit
if [ $? -ne 0 ]; then        # si le linter échoue...
  echo "Lint échoué : commit annulé."
  exit 1                     # ... sortie non nulle → Git ANNULE le commit
fi
exit 0
FIN
$ chmod +x .git/hooks/pre-commit   # rendre le hook exécutable
# En urgence seulement : git commit --no-verify pour le sauter</pre>
<p>Les erreurs sont attrapées avant même d'être committées. Demain : les sous-modules.</p>`
  }
};
</script>

  ]
};
