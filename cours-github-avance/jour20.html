var DAY = {

  title: "Publier GitHub Pages via Actions",
  subtitle: "Transformer un dossier de fichiers statiques en site web public, automatiquement.",
  theory: `
<h3>1. GitHub Pages : un hébergement de sites statiques</h3>
<p><strong>GitHub Pages</strong> est un service gratuit de GitHub qui héberge des <strong>sites statiques</strong> : des fichiers HTML, CSS, JavaScript et images servis tels quels, sans serveur applicatif ni base de données. Idéal pour un site vitrine, une documentation, un portfolio ou la sortie d'un générateur (Vite, Hugo, MkDocs…). Le site est publié à une URL du type <code>https://utilisateur.github.io/depot/</code>.</p>
<div class="tip">« Statique » signifie que le contenu est fixe côté serveur : chaque visiteur reçoit les mêmes fichiers. L'interactivité vient uniquement du JavaScript exécuté dans le navigateur. Pas de PHP, pas de base de données côté serveur.</div>

<h3>2. Deux façons de publier — on choisit Actions</h3>
<pre class="pseudo">Source du site (Settings &gt; Pages) :
- "Deploy from a branch" : Pages sert le contenu d'une branche (ancien modele)
- "GitHub Actions"       : un WORKFLOW construit et deploie le site (notre choix)</pre>
<p>Le mode <strong>GitHub Actions</strong> est le plus souple : ton workflow peut d'abord <strong>construire</strong> le site (compiler, minifier) puis le <strong>déployer</strong>. On l'active dans <code>Settings &gt; Pages &gt; Source: GitHub Actions</code>.</p>

<h3>3. Les actions officielles et les permissions</h3>
<p>Le déploiement Pages via Actions s'appuie sur trois <strong>actions officielles</strong> et un jeu de <strong>permissions</strong> précis. Une action, rappel, est un composant réutilisable qu'on invoque avec <code>uses:</code>.</p>
<pre class="pseudo">permissions:
  contents: read                         # lire le code du depot
  pages: write                           # ecrire/publier sur Pages
  id-token: write                        # jeton d'identite pour un deploiement securise
concurrency:
  group: pages                           # une seule publication a la fois...
  cancel-in-progress: false              # ...sans annuler celle deja en cours</pre>
<div class="warn">Sans <code>pages: write</code> et <code>id-token: write</code>, le déploiement échoue. Ces permissions autorisent explicitement le <code>GITHUB_TOKEN</code> à publier — un exemple concret du principe du moindre privilège vu au jour 17.</div>

<h3>4. Le workflow type : build, upload, deploy</h3>
<pre class="pseudo">name: Deploy Pages
on:
  push:
    branches: [ main ]                   # on republie a chaque arrivee sur main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci &amp;&amp; npm run build      # produit le site dans ./dist
      - uses: actions/configure-pages@v5 # prepare l'environnement Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist                   # le DOSSIER a publier (sortie du build)
  deploy:
    needs: build                         # on ne deploie qu'apres un build reussi
    runs-on: ubuntu-latest
    environment:
      name: github-pages                 # l'environnement dedie a Pages
      url: \${{ steps.deploy.outputs.page_url }}   # l'URL finale du site
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4    # publie l'artefact prepare</pre>
<p>La logique : <code>build</code> construit le site et l'emballe dans un <strong>artefact Pages</strong> (une archive de fichiers) via <code>upload-pages-artifact</code> ; <code>deploy</code> récupère cet artefact et le met en ligne avec <code>deploy-pages</code>. Le <code>path</code> pointe le dossier de sortie (souvent <code>dist</code>, <code>build</code> ou <code>_site</code>).</p>

<h3>5. Site simple sans build</h3>
<pre class="pseudo">      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                        # tout le depot est deja du HTML/CSS pret a servir</pre>
<p>Si ton dépôt contient <strong>déjà</strong> du HTML statique (pas d'étape de compilation), tu passes simplement <code>path: .</code> (ou le sous-dossier concerné) et tu sautes l'étape <code>npm run build</code>. Le reste est identique.</p>
<div class="tip">Le déploiement Pages utilise l'environnement <code>github-pages</code>. L'<strong>environnement</strong> (vu en détail au jour 27) est une cible de déploiement nommée à laquelle on peut attacher une URL, des secrets et des règles d'approbation.</div>`,
  exercises: [
    { type: "qcm", q: "GitHub Pages héberge…", opts: ["Des bases de données", "Des sites statiques (HTML, CSS, JS servis tels quels)", "Des serveurs Node permanents", "Des conteneurs Docker"], a: 1, exp: "Statique = fichiers fixes côté serveur." },
    { type: "vf", q: "Un site statique peut contenir du JavaScript exécuté dans le navigateur.", a: true, exp: "L'interactivité vient du JS côté client." },
    { type: "qcm", q: "Pour construire PUIS déployer un site, on choisit comme source Pages…", opts: ["Deploy from a branch", "GitHub Actions", "Un serveur FTP", "Une base de données"], a: 1, exp: "Actions permet build + deploy." },
    { type: "input", q: "Quelle action officielle emballe le dossier du site en artefact Pages ? (nom sans version, actions/...)", a: ["actions/upload-pages-artifact", "upload-pages-artifact"], ph: "actions/...", exp: "upload-pages-artifact prépare l'artefact." },
    { type: "input", q: "Quelle action officielle met l'artefact en ligne ? (nom sans version, actions/...)", a: ["actions/deploy-pages", "deploy-pages"], ph: "actions/...", exp: "deploy-pages publie le site." },
    { type: "input", q: "Quelle permission autorise l'écriture/publication sur Pages ? Réponds pages: ___", a: ["write", "pages: write"], ph: "pages: ___", exp: "pages: write est indispensable." },
    { type: "qcm", q: "La permission id-token: write sert à…", opts: ["Chiffrer le CSS", "Fournir un jeton d'identité pour un déploiement sécurisé", "Créer une branche", "Lister les artefacts"], a: 1, exp: "Déploiement Pages sécurisé." },
    { type: "input", q: "Dans upload-pages-artifact, quel paramètre indique le dossier à publier ? (le mot-clé seul)", a: ["path", "path:"], ph: "un mot-clé", exp: "path: ./dist par exemple." },
    { type: "qcm", q: "Le job deploy possède needs: build parce que…", opts: ["C'est décoratif", "On ne déploie qu'après un build réussi", "Ça accélère le build", "Pages l'exige pour le CSS"], a: 1, exp: "Dépendance : build d'abord, deploy ensuite." },
    { type: "input", q: "Quel est le nom de l'environnement dédié au déploiement Pages ? (le nom exact)", a: ["github-pages"], ph: "un nom", exp: "environment: name: github-pages." },
    { type: "qcm", q: "Pour un site déjà 100% HTML statique (pas de build), on met…", opts: ["path: ./dist obligatoirement", "path: . (le dépôt est déjà prêt)", "rien, c'est impossible", "un secret"], a: 1, exp: "On saute npm run build et on pointe le dossier racine." },
    { type: "vf", q: "Sans pages: write ni id-token: write, le déploiement Pages échoue.", a: true, exp: "Ces permissions autorisent le jeton à publier." },
    { type: "qcm", q: "L'URL typique d'un site Pages de projet ressemble à…", opts: ["https://github.com/utilisateur", "https://utilisateur.github.io/depot/", "https://pages.local", "ftp://depot"], a: 1, exp: "utilisateur.github.io/depot/." },
    { type: "qcm", q: "actions/configure-pages@v5 sert à…", opts: ["Compiler le TypeScript", "Préparer l'environnement Pages avant l'upload", "Créer un tag", "Publier un package npm"], a: 1, exp: "Configuration préalable de Pages." },
    { type: "vf", q: "Le dossier de sortie d'un build s'appelle toujours obligatoirement dist.", a: false, exp: "Ça peut être dist, build, _site… selon l'outil." }
  ],
  final: {
    title: "Exercice final — Publier un site construit avec Vite",
    intro: `<p>Ton projet Vite produit le site dans le dossier <code>dist</code> via <code>npm run build</code>. Tu veux le publier sur Pages à chaque push sur main.</p>`,
    questions: [
      { type: "input", q: "Quelle permission pour publier ? Réponds pages: ___", a: ["write", "pages: write"], ph: "pages: ___", exp: "pages: write." },
      { type: "input", q: "Quel dossier passes-tu à path: dans upload-pages-artifact ?", a: ["./dist", "dist"], ph: "un dossier", exp: "La sortie de Vite : ./dist." },
      { type: "qcm", q: "L'ordre des jobs est…", opts: ["deploy puis build", "build (checkout, npm run build, upload) puis deploy (needs: build)", "deploy seul", "build seul"], a: 1, exp: "Build emballe, deploy publie." },
      { type: "input", q: "Quel est le nom de l'environnement à indiquer dans le job deploy ?", a: ["github-pages"], ph: "un nom", exp: "environment: name: github-pages." },
      { type: "vf", q: "actions/deploy-pages récupère l'artefact préparé par upload-pages-artifact.", a: true, exp: "L'un emballe, l'autre publie." }
    ],
    solution: `<pre class="pseudo">name: Deploy Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci &amp;&amp; npm run build      # Vite produit ./dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist                   # on emballe le dossier construit
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4    # on publie l'artefact</pre>
<p>À chaque push sur <code>main</code>, le site est reconstruit et republié automatiquement. C'est du déploiement continu appliqué à un site statique.</p>`
  }
};
