var DAY = {
  num: 1,
  title: "Configuration avancée de Git",
  subtitle: "Régler Git une fois pour toutes : portées, alias et identités multiples.",
  theory: `
<h3>1. Qu'est-ce que la configuration de Git ?</h3>
<p>La <strong>configuration</strong> de Git est l'ensemble des réglages qui décident comment Git se comporte : ton nom d'auteur, ton éditeur de texte, tes raccourcis… Ces réglages sont de simples couples <code>clé = valeur</code> rangés dans des fichiers <code>.gitconfig</code>. Analogie : c'est le <strong>tableau de bord</strong> de ta voiture — tu le règles une fois (siège, rétroviseurs) et tu conduis ensuite sans y penser.</p>
<p>L'outil qui lit et écrit ces réglages est la commande <code>git config</code>.</p>

<h3>2. Les trois portées (scopes)</h3>
<p>Une <strong>portée</strong> (en anglais <em>scope</em>) désigne <em>jusqu'où</em> un réglage s'applique. Git en connaît trois, de la plus large à la plus étroite :</p>
<pre class="pseudo">git config --system user.name "..."   # --system : TOUTE la machine (tous les utilisateurs). Rare, nécessite les droits admin.
git config --global user.name "..."   # --global : TON compte utilisateur (tous TES dépôts). Le cas courant.
git config --local  user.name "..."   # --local  : SEULEMENT le dépôt courant. Écrase le global pour ce projet.</pre>
<p>Règle d'or : <strong>le plus proche gagne</strong>. Un réglage <code>--local</code> l'emporte sur le <code>--global</code>, qui l'emporte sur le <code>--system</code>. C'est comme des règlements : la note de service de ton bureau prime sur celle de l'entreprise.</p>
<div class="tip">Pour voir d'où vient une valeur (quel fichier, quelle portée) : <code>git config --list --show-origin</code>. Indispensable quand un réglage semble « mystérieux ».</div>

<h3>3. Lire, écrire, éditer</h3>
<pre class="pseudo">git config --global user.name "Alice Martin"   # écrire une valeur
git config user.name                            # lire une valeur (affiche la valeur effective)
git config --list                               # lister TOUS les réglages actifs
git config --global --edit                      # ouvrir le .gitconfig global dans l'éditeur
git config --global --unset user.name           # supprimer un réglage</pre>

<h3>4. Les alias : des raccourcis maison</h3>
<p>Un <strong>alias</strong> est un <strong>surnom</strong> que tu donnes à une commande longue pour la taper plus vite. C'est comme un raccourci clavier que tu inventes toi-même.</p>
<pre class="pseudo">git config --global alias.st status             # "git st" = "git status"
git config --global alias.co checkout           # "git co" = "git checkout"
git config --global alias.lg "log --oneline --graph --all"   # un joli graphe d'historique en une lettre... ou deux</pre>
<p>Après ça, taper <code>git lg</code> déroule tout l'historique en graphe. Les alias ne changent rien au dépôt : ils vivent dans TA config.</p>

<h3>5. Réglages qui évitent des ennuis</h3>
<pre class="pseudo">git config --global core.editor "code --wait"   # core.editor : l'éditeur pour les messages de commit (ici VS Code)
git config --global init.defaultBranch main      # nom de la branche créée par "git init" (main plutôt que master)
git config --global pull.rebase false            # "git pull" fait un merge (voir jours 3-4 pour le rebase)
git config --global core.autocrlf input          # gestion des fins de ligne (input : idéal sous Linux/macOS)</pre>
<div class="warn">Sous Windows, <code>core.autocrlf true</code> convertit les fins de ligne à l'aller-retour ; sous Linux/macOS on préfère <code>input</code>. Un mauvais réglage provoque des diffs « fantômes » où chaque ligne semble modifiée.</div>

<h3>6. Une identité par projet : includeIf</h3>
<p>Tu veux ton adresse pro sur les dépôts du travail et ton adresse perso ailleurs ? La directive <strong>includeIf</strong> charge un fichier de config <em>seulement si</em> une condition est vraie (par exemple : le dépôt est dans un certain dossier).</p>
<pre class="pseudo"># dans ~/.gitconfig :
[includeIf "gitdir:~/travail/"]      # SI le dépôt est sous ~/travail/ ...
    path = ~/.gitconfig-pro          # ... alors charge ce fichier (qui contient l'email pro)</pre>
<p><strong>HEAD</strong>, <strong>rebase</strong> et d'autres termes viendront les jours suivants ; ici, retiens surtout les <strong>portées</strong> et les <strong>alias</strong>, la base de tout confort avec Git.</p>`,
  exercises: [
    { type: "qcm", q: "L'outil qui lit et écrit les réglages de Git est :", opts: ["git set", "git config", "git option", "git settings"], a: 1, exp: "git config manipule les couples clé=valeur." },
    { type: "input", q: "Écris la commande qui liste TOUS les réglages actifs.", a: ["git config --list", "git config -l"], ph: "git config ...", exp: "--list (ou -l) affiche la config effective." },
    { type: "qcm", q: "La portée qui s'applique à TOUS tes dépôts (ton compte) est :", opts: ["--system", "--global", "--local", "--user"], a: 1, exp: "--global = ton compte utilisateur." },
    { type: "input", q: "Quelle option cible SEULEMENT le dépôt courant ?", a: ["--local"], ph: "--...", exp: "--local écrit dans .git/config du dépôt." },
    { type: "vf", q: "Un réglage --local l'emporte sur le même réglage --global.", a: true, exp: "Le plus proche gagne." },
    { type: "qcm", q: "Pour savoir de quel fichier vient une valeur :", opts: ["git config --where", "git config --list --show-origin", "git blame", "git config --file"], a: 1, exp: "--show-origin révèle le fichier source." },
    { type: "input", q: "Complète l'alias : git config --global alias.st ____", a: ["status"], ph: "...", exp: "git st deviendra git status." },
    { type: "qcm", q: "Un alias Git est :", opts: ["Un serveur distant", "Un surnom pour une commande longue", "Une branche", "Un commit"], a: 1, exp: "Un raccourci maison, rangé dans ta config." },
    { type: "input", q: "Quelle clé définit l'éditeur des messages de commit ?", a: ["core.editor"], ph: "core....", exp: "core.editor, ex. \"code --wait\"." },
    { type: "vf", q: "core.autocrlf gère les fins de ligne entre systèmes.", a: true, exp: "Évite les diffs fantômes CRLF/LF." },
    { type: "input", q: "Quelle clé fixe le nom de la branche créée par git init ?", a: ["init.defaultbranch", "init.defaultBranch"], ph: "init....", exp: "init.defaultBranch, souvent réglé à main." },
    { type: "qcm", q: "La directive qui charge une config selon le dossier du dépôt :", opts: ["includeOnly", "includeIf", "scopeIf", "loadWhen"], a: 1, exp: "includeIf + gitdir: charge une config conditionnelle." },
    { type: "qcm", q: "Pour supprimer un réglage global user.name :", opts: ["git config --global --del user.name", "git config --global --unset user.name", "git remove user.name", "git config --clear"], a: 1, exp: "--unset supprime la clé." },
    { type: "input", q: "Écris la commande qui ouvre le .gitconfig global dans l'éditeur.", a: ["git config --global --edit", "git config --global -e"], ph: "git config ...", exp: "--edit (ou -e) ouvre le fichier." },
    { type: "vf", q: "La portée --system nécessite en général des droits administrateur.", a: true, exp: "Elle touche toute la machine." }
  ],
  final: {
    title: "Exercice final — Régler un poste de travail",
    intro: `<p>Tu configures un nouveau poste : identité, alias et confort.</p>`,
    questions: [
      { type: "qcm", q: "Définir ton nom pour TOUS tes dépôts :", opts: ["git config --local user.name ...", "git config --global user.name ...", "git config --system user.name ...", "git set name ..."], a: 1, exp: "--global : ton compte." },
      { type: "input", q: "Créer l'alias 'co' pour 'checkout' :", a: ["git config --global alias.co checkout"], ph: "git config ...", exp: "alias.co = checkout." },
      { type: "qcm", q: "Voir tous les réglages et leur origine :", opts: ["git config --list --show-origin", "git status", "git log", "git config --get"], a: 0, exp: "--show-origin." },
      { type: "input", q: "Fixer main comme branche par défaut :", a: ["git config --global init.defaultbranch main", "git config --global init.defaultBranch main"], ph: "git config ...", exp: "init.defaultBranch main." },
      { type: "vf", q: "includeIf permet une identité différente selon le dossier du dépôt.", a: true, exp: "Pro vs perso automatiquement." }
    ],
    solution: `<pre class="pseudo">$ git config --global user.name "Alice Martin"        # identité (nom) pour tous mes dépôts
$ git config --global user.email "alice@exemple.fr"   # identité (email)
$ git config --global alias.st status                 # raccourci git st
$ git config --global alias.co checkout               # raccourci git co
$ git config --global alias.lg "log --oneline --graph --all"   # historique en graphe
$ git config --global init.defaultBranch main         # branche par défaut = main
$ git config --global core.editor "code --wait"       # éditeur des messages de commit
$ git config --list --show-origin                     # vérifier ce qui est actif et d'où ça vient</pre>
<p>Un poste bien réglé, c'est du temps gagné chaque jour. Demain : organiser les branches en équipe.</p>`
  }
};
</script>
