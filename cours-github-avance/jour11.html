<script>
var DAY = {
  num: 11,
  title: "Pull Requests avancées (draft, CODEOWNERS)",
  subtitle: "Aller au-delà de la PR basique : brouillons, relecteurs automatiques, revue efficace.",
  theory: `
<h3>1. Rappel : la Pull Request</h3>
<p>Une <strong>Pull Request</strong> (PR, « demande de fusion ») est une demande formelle d'intégrer une branche dans une autre, ouverte sur GitHub, que les collègues relisent et que la CI teste. Tu sais l'ouvrir ; aujourd'hui on voit les <strong>outils qui la rendent professionnelle</strong> : brouillons, relecteurs imposés, et bonnes pratiques de revue.</p>

<h3>2. La Draft Pull Request (brouillon)</h3>
<p>Une <strong>draft PR</strong> (« pull request en brouillon ») est une PR ouverte mais <strong>explicitement marquée « pas encore prête à fusionner »</strong>. GitHub empêche techniquement de la merger tant qu'elle est en brouillon. Elle sert à <strong>partager tôt</strong> : montrer une direction, lancer la CI, obtenir des retours informels, sans donner l'illusion d'un travail fini.</p>
<pre class="pseudo">gh pr create --draft --title "feat: réservations (WIP)" --body "Travail en cours, retours bienvenus"
# gh = GitHub CLI (l'outil en ligne de commande de GitHub) ; --draft ouvre la PR en brouillon
gh pr ready         # basculer la PR de brouillon vers "prête à relire/merger" quand le travail est fini</pre>
<div class="tip">Ouvrir tôt en draft applique la règle « push tôt, PR tôt » : le travail devient visible et la CI tourne dès les premiers commits, sans qu'on risque un merge prématuré.</div>

<h3>3. CODEOWNERS : des relecteurs automatiques</h3>
<p><strong>CODEOWNERS</strong> (« propriétaires du code ») est un fichier qui déclare <strong>qui est responsable de quelles parties du dépôt</strong>. Quand une PR touche un fichier, GitHub <strong>demande automatiquement la revue</strong> à son propriétaire. C'est le <strong>plan de la maison</strong> : « la plomberie, c'est Sonia ; l'électricité, c'est Karim » — dès qu'on touche à un domaine, le bon expert est convoqué.</p>
<pre class="pseudo"># fichier .github/CODEOWNERS  (chemin  puis  @propriétaires)
*               @equipe-core                 # par défaut, toute la base appartient à l'équipe core
/frontend/      @alice @bob                   # tout ce qui est sous /frontend/ : Alice et Bob relisent
/infra/         @equipe-devops                # l'infra : l'équipe DevOps
*.sql           @dba-team                     # tous les fichiers .sql : l'équipe base de données</pre>
<p>La <strong>dernière règle qui correspond</strong> l'emporte (les motifs sont lus de haut en bas). Combiné à la protection de branche (jour 12), CODEOWNERS peut <strong>imposer</strong> la revue du bon expert avant tout merge.</p>

<h3>4. Écrire une bonne PR</h3>
<pre class="pseudo">Titre    : impératif et normé      # "feat: réservations d'exemplaires" (comme un message de commit)
Corps    : le POURQUOI, pas le comment   # le contexte, le problème résolu, les choix, ce qui reste
"Closes #42"   # dans le corps : lie la PR à l'issue #42 et la ferme AUTOMATIQUEMENT au merge
Petite   : une PR courte se relit vite et bien ; une PR géante décourage la revue</pre>
<p>Mots-clés utiles dans le corps : <code>Closes #N</code>, <code>Fixes #N</code>, <code>Resolves #N</code> ferment l'issue liée quand la PR est fusionnée.</p>

<h3>5. Relire et faire avancer une PR</h3>
<pre class="pseudo">Approve            # "j'approuve" : le code peut être fusionné
Request changes    # "demande des modifications" : bloque le merge tant que ce n'est pas corrigé
Comment            # remarque sans jugement bloquant
Suggested change   # proposer directement une correction que l'auteur applique en un clic</pre>
<pre class="pseudo">gh pr checkout 128   # récupérer localement la branche de la PR n°128 pour la tester chez soi
gh pr review 128 --approve         # approuver depuis le terminal
gh pr merge 128 --squash --delete-branch   # fusionner en squash ET supprimer la branche</pre>

<h3>6. Répondre aux retours proprement</h3>
<div class="tip">Pour intégrer les retours de revue, ajoute de nouveaux commits (l'historique de la discussion reste lisible), puis, une fois la PR approuvée, l'option de merge « squash » condense le tout en un commit propre sur <code>main</code>. Le combo <code>git commit --fixup</code> + rebase autosquash (jour 4) est aussi très apprécié.</p></div>
<div class="warn">Ne force jamais un <code>push --force</code> sur la branche d'une PR partagée pendant que des collègues la relisent ou travaillent dessus : tu casses leur base. Sur ta branche perso non partagée, <code>--force-with-lease</code> reste acceptable.</div>
<p>Demain : verrouiller tout cela avec la protection de branche.</p>`,
  exercises: [
    { type: "qcm", q: "Une draft PR est :", opts: ["Une PR déjà fusionnée", "Une PR marquée 'pas encore prête à merger'", "Une PR supprimée", "Une branche"], a: 1, exp: "Un brouillon : partage tôt, merge bloqué." },
    { type: "input", q: "Écris l'option de 'gh pr create' qui ouvre la PR en brouillon.", a: ["--draft"], ph: "--...", exp: "--draft." },
    { type: "input", q: "Écris la commande gh qui fait passer une PR de brouillon à 'prête'.", a: ["gh pr ready"], ph: "gh pr ...", exp: "gh pr ready." },
    { type: "qcm", q: "Le fichier CODEOWNERS sert à :", opts: ["Configurer Git", "Déclarer qui relit quelles parties du code (revue auto)", "Supprimer des branches", "Lancer les tests"], a: 1, exp: "Relecteurs demandés automatiquement." },
    { type: "input", q: "Dans quel dossier place-t-on le fichier CODEOWNERS (chemin usuel) ?", a: [".github", ".github/", ".github/codeowners"], ph: "....", exp: ".github/CODEOWNERS." },
    { type: "qcm", q: "Dans CODEOWNERS, quand plusieurs motifs correspondent :", opts: ["Le premier gagne", "La DERNIÈRE règle qui correspond l'emporte", "Tous s'appliquent", "Aucun"], a: 1, exp: "Lecture de haut en bas, la dernière gagne." },
    { type: "qcm", q: "Dans CODEOWNERS, la ligne '*.sql  @dba-team' signifie :", opts: ["Supprimer les .sql", "L'équipe dba relit tous les fichiers .sql", "Interdire les .sql", "Renommer les .sql"], a: 1, exp: "Motif de fichier -> propriétaire." },
    { type: "input", q: "Quel mot-clé dans le corps d'une PR ferme l'issue #42 au merge ?", a: ["closes #42", "fixes #42", "resolves #42", "closes"], ph: "... #42", exp: "Closes/Fixes/Resolves #N." },
    { type: "qcm", q: "'Request changes' dans une revue :", opts: ["Approuve la PR", "BLOQUE le merge tant que ce n'est pas corrigé", "Ferme la PR", "Supprime la branche"], a: 1, exp: "Demande des modifications, bloquante." },
    { type: "input", q: "Écris la commande gh qui récupère localement la branche de la PR n°128.", a: ["gh pr checkout 128"], ph: "gh pr checkout ...", exp: "checkout <numéro>." },
    { type: "qcm", q: "Une bonne PR est avant tout :", opts: ["Énorme pour tout livrer d'un coup", "Petite et focalisée (relue vite et bien)", "Sans description", "Sans tests"], a: 1, exp: "Petite = revue efficace." },
    { type: "qcm", q: "Le corps d'une PR doit surtout expliquer :", opts: ["Le comment (chaque ligne)", "Le POURQUOI (contexte, problème, choix)", "Rien", "L'historique Git complet"], a: 1, exp: "Le pourquoi guide le relecteur." },
    { type: "input", q: "Écris la commande gh qui fusionne la PR 128 en squash et supprime la branche.", a: ["gh pr merge 128 --squash --delete-branch"], ph: "gh pr merge ...", exp: "--squash --delete-branch." },
    { type: "vf", q: "Un 'Suggested change' permet à l'auteur d'appliquer la correction en un clic.", a: true, exp: "La suggestion devient un commit." },
    { type: "vf", q: "On peut forcer un push --force sur une branche de PR que des collègues relisent.", a: false, exp: "On casse leur base : à proscrire sur branche partagée." }
  ],
  final: {
    title: "Exercice final — Une PR pro de bout en bout",
    intro: `<p>Tu ouvres tôt en brouillon, CODEOWNERS convoque le bon relecteur, puis tu finalises.</p>`,
    questions: [
      { type: "input", q: "Ouvrir la PR en brouillon (option) :", a: ["--draft"], ph: "--...", exp: "--draft." },
      { type: "qcm", q: "Une règle CODEOWNERS '/infra/ @equipe-devops' provoque :", opts: ["Rien", "Une demande de revue auto à l'équipe DevOps si /infra/ est touché", "La suppression de /infra/", "Un merge auto"], a: 1, exp: "Le bon expert est convoqué." },
      { type: "input", q: "Dans le corps, lier et fermer l'issue #57 :", a: ["closes #57", "fixes #57", "resolves #57"], ph: "... #57", exp: "Closes #57." },
      { type: "input", q: "Sortir la PR du brouillon quand c'est prêt :", a: ["gh pr ready"], ph: "gh pr ...", exp: "gh pr ready." },
      { type: "input", q: "Fusionner en squash + supprimer la branche (PR 130) :", a: ["gh pr merge 130 --squash --delete-branch"], ph: "gh pr merge ...", exp: "merge --squash --delete-branch." }
    ],
    solution: `<pre class="pseudo">$ gh pr create --draft --title "feat: réservations" --body "Contexte... Closes #57"   # ouverte tôt en brouillon
# CODEOWNERS convoque automatiquement le bon relecteur selon les fichiers touchés
$ # ... intégrer les retours par de nouveaux commits ...
$ gh pr ready                          # la PR n'est plus un brouillon : elle est prête
$ gh pr review 130 --approve           # un relecteur approuve
$ gh pr merge 130 --squash --delete-branch   # merge propre (squash) + nettoyage de la branche</pre>
<p>Une PR visible tôt, relue par les bonnes personnes, fusionnée proprement. Demain : verrouiller ces règles avec la protection de branche.</p>`
  }
};
</script>
