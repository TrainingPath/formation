<script>
var DAY = {
  num: 7,
  title: "Reflog : récupérer des commits perdus",
  subtitle: "Le journal de bord de HEAD : retrouver un commit qu'on croyait effacé.",
  theory: `
<h3>1. Qu'est-ce que le reflog ?</h3>
<p>Le <strong>reflog</strong> (contraction de <em>reference log</em>, « journal des références ») est le <strong>journal de bord de HEAD</strong> : à chaque fois que tu changes de branche, committes, rebases, réinitialises… Git note <strong>où pointait HEAD avant et après</strong>. C'est une boîte noire d'avion : même après un « crash » (un mauvais <code>reset</code>, un rebase raté), elle garde la trace de tous les états par lesquels tu es passé.</p>
<p>Rappel : <strong>HEAD</strong> est le pointeur « où je suis ». Le reflog enregistre l'<strong>historique de ses déplacements</strong>, y compris vers des commits qui ne sont plus rattachés à aucune branche.</p>
<div class="tip">Point crucial : Git ne supprime presque jamais un commit tout de suite. Un commit « perdu » (plus référencé par aucune branche) reste dans le dépôt un bon moment (par défaut ~90 jours) avant d'être nettoyé. Le reflog est le chemin pour le retrouver.</div>

<h3>2. Lire le reflog</h3>
<pre class="pseudo">git reflog                      # journal de HEAD : chaque ligne = un état passé
# Exemple de sortie :
#   a1b2c3 HEAD@{0}: reset: moving to HEAD~2     # <- ton reset qui a "perdu" 2 commits
#   d4e5f6 HEAD@{1}: commit: feat: notifications  # <- le commit que tu croyais disparu !
#   7g8h9i HEAD@{2}: commit: feat: mails
git reflog show ma-branche      # le reflog d'une branche précise (pas seulement HEAD)</pre>
<p><code>HEAD@{0}</code> est l'état actuel, <code>HEAD@{1}</code> l'état juste avant, etc. Chaque ligne montre le hash et ce qui a provoqué le déplacement (commit, reset, rebase, checkout…).</p>

<h3>3. Le scénario classique : un reset trop violent</h3>
<pre class="pseudo">git reset --hard HEAD~2         # OUPS : je viens de "perdre" mes 2 derniers commits
git reflog                      # je cherche l'état d'AVANT le reset (ex. d4e5f6, HEAD@{1})
git reset --hard d4e5f6         # je ramène HEAD (et ma branche) sur le bon commit : travail récupéré !</pre>
<p>Le <code>reset --hard</code> déplace la branche <em>et</em> écrase le répertoire de travail : redoutable. Mais tant que le reflog garde la trace du commit d'avant, rien n'est réellement perdu.</p>

<h3>4. Récupérer sans écraser : créer une branche de sauvetage</h3>
<pre class="pseudo">git reflog                      # repérer le hash du commit perdu (ex. d4e5f6)
git branch sauvetage d4e5f6     # créer une branche qui pointe sur ce commit : il est "réamarré"
git switch sauvetage            # aller le récupérer sans toucher à la branche courante</pre>
<div class="tip">Créer une branche sur le hash retrouvé est souvent plus sûr qu'un <code>reset --hard</code> : tu <strong>rattaches</strong> le commit perdu sans rien écraser, puis tu décides tranquillement quoi en faire (cherry-pick, merge, etc.).</div>

<h3>5. Autres usages du reflog</h3>
<pre class="pseudo">git reflog                      # retrouver un commit après un rebase interactif malheureux
git reset --hard HEAD@{5}       # revenir à l'état d'il y a 5 mouvements de HEAD
git show HEAD@{1}               # inspecter l'état précédent sans y toucher</pre>

<h3>6. Limites et bonnes pratiques</h3>
<div class="warn">Le reflog est <strong>local</strong> : il vit sur TA machine et n'est pas poussé. Il ne récupère pas le travail d'un collègue, ni un dépôt supprimé. Ce n'est pas une sauvegarde distante — juste un filet de sécurité personnel. De plus, les commits non référencés finissent par être nettoyés (garbage collection) : agis <strong>rapidement</strong> quand tu réalises une perte.</div>
<p>Retiens la leçon rassurante du jour : avec Git, un commit une fois créé est très dur à perdre pour de bon. Avant de paniquer après un reset ou un rebase raté, tape <strong><code>git reflog</code></strong>. Demain : automatiser des vérifications avec les hooks Git.</p>`,
  exercises: [
    { type: "qcm", q: "Le reflog est :", opts: ["Le journal des déplacements de HEAD", "La liste des branches distantes", "Un fichier de config", "L'historique des merges seulement"], a: 0, exp: "reference log = journal de HEAD." },
    { type: "input", q: "Écris la commande qui affiche le journal de HEAD.", a: ["git reflog"], ph: "git ...", exp: "git reflog." },
    { type: "qcm", q: "Dans le reflog, HEAD@{0} désigne :", opts: ["Le premier commit du dépôt", "L'état ACTUEL", "L'état d'il y a 90 jours", "L'état sur le dépôt distant"], a: 1, exp: "{0} = maintenant, {1} = juste avant." },
    { type: "vf", q: "Un commit 'perdu' est en général effacé instantanément par Git.", a: false, exp: "Il reste ~90 jours avant nettoyage." },
    { type: "qcm", q: "Après un 'git reset --hard HEAD~2' malheureux, on récupère en :", opts: ["Refaisant les commits perdus à la main", "Cherchant le hash d'avant dans le reflog puis en y revenant", "Reclonant le dépôt depuis le distant", "Annulant avec git revert HEAD"], a: 1, exp: "reflog révèle le commit d'avant." },
    { type: "input", q: "Écris la commande qui crée une branche 'sauvetage' sur le commit perdu d4e5f6.", a: ["git branch sauvetage d4e5f6"], ph: "git branch ...", exp: "On réamarre le commit sans écraser." },
    { type: "input", q: "Écris la commande qui ramène HEAD (dur) sur le commit d4e5f6.", a: ["git reset --hard d4e5f6"], ph: "git reset ...", exp: "reset --hard <hash>." },
    { type: "qcm", q: "Créer une branche sur le hash retrouvé, plutôt qu'un reset --hard, permet :", opts: ["D'éviter de consulter le reflog", "De réamarrer le commit SANS rien écraser", "De pousser le commit sur le distant", "De fusionner les deux commits en un"], a: 1, exp: "Approche plus sûre : on n'écrase rien." },
    { type: "vf", q: "Le reflog est local et n'est pas poussé sur le distant.", a: true, exp: "C'est un filet de sécurité personnel." },
    { type: "qcm", q: "Le reflog peut récupérer :", opts: ["Le travail non poussé d'un collègue", "Un dépôt supprimé du serveur", "Tes propres commits après un rebase/reset raté", "Des fichiers jamais committés ni stashés"], a: 2, exp: "Il sauve TES états passés, localement." },
    { type: "input", q: "Écris la commande qui inspecte l'état précédent de HEAD sans y toucher.", a: ["git show head@{1}", "git show HEAD@{1}"], ph: "git show ...", exp: "show HEAD@{1}." },
    { type: "qcm", q: "reset --hard est risqué car il :", opts: ["Ne déplace que HEAD sans toucher la branche", "Déplace la branche ET écrase le répertoire de travail", "Supprime le reflog", "Pousse en force sur le distant"], a: 1, exp: "D'où l'importance du filet reflog." },
    { type: "vf", q: "Il faut agir vite : un commit non référencé finit par être nettoyé.", a: true, exp: "La garbage collection le supprime après un délai." },
    { type: "input", q: "Écris la commande qui montre le reflog d'une branche nommée 'dev'.", a: ["git reflog show dev"], ph: "git reflog show ...", exp: "reflog show <branche>." },
    { type: "qcm", q: "Le réflexe à avoir avant de paniquer après un reset raté :", opts: ["git push --force", "git reflog", "git clone", "git config"], a: 1, exp: "git reflog d'abord." }
  ],
  final: {
    title: "Exercice final — Sauver deux commits après un reset",
    intro: `<p>Tu as fait 'git reset --hard HEAD~2' par erreur : deux commits ont disparu de la branche. Récupère-les.</p>`,
    questions: [
      { type: "input", q: "Afficher le journal de HEAD :", a: ["git reflog"], ph: "git ...", exp: "reflog révèle les états passés." },
      { type: "qcm", q: "Dans la sortie, l'état d'AVANT le reset est repéré par :", opts: ["HEAD@{0}", "HEAD@{1} (ou plus)", "origin/main", "le premier commit"], a: 1, exp: "HEAD@{1} = juste avant le mouvement actuel." },
      { type: "input", q: "Réamarrer sans écraser, sur le hash retrouvé d4e5f6 :", a: ["git branch sauvetage d4e5f6"], ph: "git branch ...", exp: "Branche de sauvetage." },
      { type: "qcm", q: "Autre option, ramener directement la branche courante :", opts: ["git reset --hard d4e5f6", "git push", "git stash", "git commit"], a: 0, exp: "reset --hard sur le bon hash." },
      { type: "vf", q: "Sans reflog, ces commits auraient été plus difficiles à retrouver.", a: true, exp: "Le reflog est le chemin vers les commits déréférencés." }
    ],
    solution: `<pre class="pseudo">$ git reflog                          # lire le journal de HEAD
#   a1b2c3 HEAD@{0}: reset: moving to HEAD~2
#   d4e5f6 HEAD@{1}: commit: feat: notifications   <- l'état d'avant le reset
$ git branch sauvetage d4e5f6         # réamarrer le commit perdu (sans rien écraser)
# — OU, pour ramener la branche courante directement :
$ git reset --hard d4e5f6             # HEAD et la branche reviennent au bon état</pre>
<p>Un commit créé se perd rarement pour de bon. Demain : les hooks, pour automatiser les vérifications.</p>`
  }
};
</script>
