<script>
var DAY = {
  num: 4,
  title: "Rebase interactif : squash, fixup, reword",
  subtitle: "Remodeler ses commits avant la PR : fusionner, renommer, réordonner, supprimer.",
  theory: `
<h3>1. Qu'est-ce que le rebase interactif ?</h3>
<p>Le <strong>rebase interactif</strong> (<code>git rebase -i</code>) ouvre un <strong>éditeur</strong> qui liste tes derniers commits et te laisse décider, ligne par ligne, ce que Git doit faire de chacun : le garder, le fusionner avec le précédent, renommer son message, le réordonner ou le supprimer. C'est le rebase du jour 3, mais avec une <strong>télécommande</strong>.</p>
<p>Analogie : ton historique est un brouillon d'article. Le rebase interactif est la phase de <strong>montage</strong> avant publication : on regroupe les paragraphes bavards, on corrige les titres, on jette les redites. Le lecteur (relecteur de la PR) ne voit que la version propre.</p>

<h3>2. Lancer un rebase interactif</h3>
<pre class="pseudo">git rebase -i HEAD~4        # remodeler les 4 DERNIERS commits (HEAD~4 = "4 commits en arrière")
git rebase -i origin/main   # remodeler tous mes commits depuis que je me suis séparé de main</pre>
<p>Git ouvre alors une liste, du plus ancien (en haut) au plus récent (en bas) :</p>
<pre class="pseudo">pick a1b2c3 feat: modèle de réservation      # "pick" = garder ce commit tel quel
pick d4e5f6 wip corrige typo                  # (wip = work in progress, un commit "de brouillon")
pick 7g8h9i wip encore un oubli
pick j0k1l2 feat: service de réservation</pre>

<h3>3. Les verbes (actions) principaux</h3>
<pre class="pseudo">pick    # garder le commit tel quel
reword  # garder le commit mais RÉÉCRIRE son message (Git rouvrira un éditeur)
squash  # FUSIONNER ce commit avec le précédent ET combiner les deux messages
fixup   # FUSIONNER ce commit avec le précédent mais JETER son message (idéal pour un "oups")
drop    # SUPPRIMER complètement ce commit (ses changements disparaissent)
edit    # STOPPER sur ce commit pour le modifier (changer le contenu, le scinder...)
# on peut aussi RÉORDONNER les lignes : Git rejouera dans le nouvel ordre</pre>
<p>Exemple : on garde le premier commit, on avale les deux « wip » dans lui avec <code>fixup</code>, et on renomme le dernier :</p>
<pre class="pseudo">pick   a1b2c3 feat: modèle de réservation
fixup  d4e5f6 wip corrige typo        # fusionné dans a1b2c3, message jeté
fixup  7g8h9i wip encore un oubli      # fusionné dans a1b2c3, message jeté
reword j0k1l2 feat: service de réservation   # on va réécrire ce message</pre>

<h3>4. squash vs fixup</h3>
<pre class="pseudo">squash → COMBINE les messages : Git te propose un texte fusionné à éditer   # utile si les 2 messages comptent
fixup  → GARDE le message du commit du dessus, jette celui-ci               # utile pour un simple "oups, j'ai oublié un point-virgule"</pre>
<div class="tip">Le combo <code>git commit --fixup=&lt;hash&gt;</code> puis <code>git rebase -i --autosquash</code> range automatiquement les commits de correction juste sous leur cible. Un flux très propre pour intégrer les retours de revue.</div>

<h3>5. L'AVERTISSEMENT (encore et toujours)</h3>
<div class="warn"><strong>Le rebase interactif réécrit l'historique : réserve-le à ta branche PERSO non partagée, avant d'ouvrir ou de finaliser la PR.</strong> Jamais sur <code>main</code>, jamais sur une branche que d'autres ont récupérée. Republier après un rebase se fait avec <code>git push --force-with-lease</code> (jamais <code>--force</code> aveugle), et seulement sur ta propre branche.</p></div>

<h3>6. Pourquoi se donner cette peine ?</h3>
<p>Un historique où chaque commit est <strong>cohérent et bien nommé</strong> rend la revue plus rapide, le <code>git bisect</code> (jour 10) plus efficace, et un éventuel <code>git revert</code> plus sûr. Personne n'a besoin de voir tes dix « wip » : on veut lire une <strong>histoire propre</strong> qui raconte comment la fonctionnalité a été construite. Demain : transplanter un commit précis d'une branche à l'autre avec <code>cherry-pick</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Le rebase interactif se lance avec :", opts: ["git rebase --auto", "git rebase -i", "git commit -i", "git squash"], a: 1, exp: "-i pour interactive." },
    { type: "input", q: "Écris la commande pour remodeler les 4 derniers commits.", a: ["git rebase -i head~4", "git rebase -i HEAD~4"], ph: "git rebase -i ...", exp: "HEAD~4 = 4 commits en arrière." },
    { type: "qcm", q: "Le verbe 'reword' sert à :", opts: ["Supprimer un commit", "Réécrire le message d'un commit", "Fusionner deux commits", "Réordonner"], a: 1, exp: "reword = renommer le message." },
    { type: "input", q: "Quel verbe FUSIONNE un commit avec le précédent en JETANT son message ?", a: ["fixup"], ph: "...", exp: "fixup : idéal pour un 'oups'." },
    { type: "qcm", q: "La différence squash / fixup :", opts: ["Aucune", "squash combine les messages, fixup jette celui du commit avalé", "squash supprime, fixup garde", "squash réordonne"], a: 1, exp: "Le message est la clé." },
    { type: "input", q: "Quel verbe SUPPRIME complètement un commit du rebase interactif ?", a: ["drop"], ph: "...", exp: "drop retire le commit et ses changements." },
    { type: "qcm", q: "Le verbe 'edit' sert à :", opts: ["Renommer le message", "Stopper sur le commit pour le modifier/scinder", "Le supprimer", "Le garder tel quel"], a: 1, exp: "edit met en pause sur ce commit." },
    { type: "vf", q: "On peut réordonner les commits en changeant l'ordre des lignes.", a: true, exp: "Git rejoue dans le nouvel ordre." },
    { type: "qcm", q: "Dans la liste, les commits sont affichés :", opts: ["Du plus récent au plus ancien", "Du plus ancien (haut) au plus récent (bas)", "Au hasard", "Par auteur"], a: 1, exp: "Ordre chronologique croissant." },
    { type: "input", q: "Quel verbe garde le commit tel quel, sans rien changer ?", a: ["pick"], ph: "...", exp: "pick = conserver." },
    { type: "vf", q: "On peut faire un rebase interactif sur main sans risque.", a: false, exp: "Réécrire main = danger pour toute l'équipe." },
    { type: "qcm", q: "git commit --fixup=<hash> puis rebase -i --autosquash :", opts: ["Casse le dépôt", "Range automatiquement la correction sous sa cible", "Supprime main", "Crée une branche"], a: 1, exp: "Flux propre pour les retours de revue." },
    { type: "qcm", q: "Republier une branche perso après rebase interactif :", opts: ["git push --force-with-lease", "git push --force", "impossible", "git merge"], a: 0, exp: "Le plus sûr, sur sa propre branche." },
    { type: "input", q: "Quel verbe combine un commit avec le précédent EN COMBINANT les deux messages ?", a: ["squash"], ph: "...", exp: "squash fusionne et propose un message combiné." },
    { type: "vf", q: "Un historique propre accélère la revue et le git bisect.", a: true, exp: "Des commits cohérents = un débogage plus simple." }
  ],
  final: {
    title: "Exercice final — Nettoyer une branche avant la PR",
    intro: `<p>Ta branche a 1 vrai commit et 2 « wip » ; tu veux 1 commit propre et bien nommé.</p>`,
    questions: [
      { type: "input", q: "Lancer le rebase interactif sur les 3 derniers commits :", a: ["git rebase -i head~3", "git rebase -i HEAD~3"], ph: "git rebase -i ...", exp: "HEAD~3." },
      { type: "input", q: "Le verbe pour avaler un 'wip' dans le commit du dessus en jetant son message :", a: ["fixup"], ph: "...", exp: "fixup." },
      { type: "input", q: "Le verbe pour réécrire le message du commit final :", a: ["reword"], ph: "...", exp: "reword." },
      { type: "qcm", q: "Le premier commit (celui qu'on garde tel quel) :", opts: ["drop", "pick", "squash", "edit"], a: 1, exp: "pick." },
      { type: "qcm", q: "Republier ensuite :", opts: ["git push --force-with-lease", "git push --force", "git push", "impossible"], a: 0, exp: "Branche perso, --force-with-lease." }
    ],
    solution: `<pre class="pseudo">$ git rebase -i HEAD~3        # ouvrir la liste des 3 derniers commits
# Dans l'éditeur, on écrit :
pick   a1b2c3 feat: réservations d'exemplaires
fixup  d4e5f6 wip typo            # avalé dans a1b2c3, message jeté
reword 7g8h9i wip message final   # on renommera ce commit
# → Git fusionne, puis rouvre un éditeur pour le message de reword :
#   "feat: réservations d'exemplaires (validation stock)"
$ git push --force-with-lease     # republier la branche perso nettoyée</pre>
<p>Trois commits brouillons deviennent une histoire lisible. Demain : cherry-pick, transplanter un commit précis.</p>`
  }
};
</script>
