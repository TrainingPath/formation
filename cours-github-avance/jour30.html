<script>
var DAY = {
  num: 30,
  title: "Gérer une organisation et des équipes",
  subtitle: "Structurer plusieurs dépôts, des équipes et des permissions à l'échelle.",
  theory: `
<h3>1. Compte personnel vs organisation</h3>
<p>Un <strong>compte personnel</strong> appartient à une personne : ses dépôts, ses réglages. Une <strong>organisation</strong> (en anglais <em>organization</em>, souvent abrégée <em>org</em>) est un <strong>compte partagé</strong> pour un groupe : elle regroupe des dépôts, des membres et des équipes sous une gouvernance commune. C'est la structure d'une entreprise, d'un projet open source ou d'un club sur GitHub.</p>
<pre class="pseudo">Compte personnel : alice          # les depots d'une personne
Organisation     : mon-entreprise # depots partages + membres + equipes + reglages centralises</pre>

<h3>2. Les rôles dans une organisation</h3>
<p>Chaque membre a un <strong>rôle</strong> qui définit ce qu'il peut faire au niveau de l'org.</p>
<pre class="pseudo">Owner (proprietaire) : controle TOTAL (facturation, membres, suppression)   # a limiter au strict minimum
Member (membre)      : acces selon les equipes et depots dont il fait partie
Outside collaborator : personne externe invitee sur UN depot precis          # pas membre de l'org</pre>
<div class="warn">Le rôle <strong>Owner</strong> peut tout faire, y compris supprimer des dépôts et gérer la facturation. On le réserve à très peu de personnes : c'est encore le principe du moindre privilège (jour 17), appliqué aux humains cette fois.</div>

<h3>3. Les équipes : gérer les permissions par groupe</h3>
<p>Une <strong>équipe</strong> (en anglais <em>team</em>) est un <strong>groupe nommé de membres</strong> auquel on accorde des accès en bloc. Plutôt que de donner des droits dépôt par dépôt à chaque personne, on donne un accès à l'<strong>équipe</strong>, et chaque membre en hérite. Ajouter quelqu'un à l'équipe suffit alors à lui donner tous les bons accès.</p>
<pre class="pseudo">Equipe "backend"  -&gt; acces "write" sur les depots api, base-de-donnees
Equipe "frontend" -&gt; acces "write" sur le depot site-web
Equipe "securite" -&gt; acces "admin" sur tous les depots
# Ajouter Bob a "backend" lui donne d'un coup tous les acces de l'equipe</pre>
<div class="tip">Les équipes peuvent être <strong>imbriquées</strong> (une équipe parent, des sous-équipes) : une sous-équipe hérite des accès de sa parente. Pratique pour refléter l'organigramme (ex. « ingénierie » &gt; « backend », « frontend »).</p></div>

<h3>4. Les niveaux d'accès à un dépôt</h3>
<pre class="pseudo">Read     : lire et cloner                          # observateurs, lecteurs
Triage   : gerer issues et PR sans pousser de code # tri, etiquetage
Write    : pousser du code, creer des branches     # developpeurs
Maintain : gerer le depot sans reglages sensibles  # responsables
Admin    : tout, y compris reglages et suppression # a limiter</pre>
<p>Ces cinq niveaux vont du plus restreint (<strong>Read</strong>) au plus large (<strong>Admin</strong>). On accorde à chaque équipe le <strong>niveau minimal</strong> nécessaire à son travail : un observateur en <em>Read</em>, un développeur en <em>Write</em>, et <em>Admin</em> réservé à de rares responsables.</p>

<h3>5. Gouvernance à l'échelle et automatisation</h3>
<p>Une org offre des réglages <strong>centralisés</strong> : politiques de sécurité par défaut, restrictions de création de dépôts, listes d'accès. On peut aussi factoriser des ressources : des <strong>secrets d'organisation</strong> partagés entre dépôts (jour 17), des <strong>workflows réutilisables</strong> communs (jour 22), des fichiers de communauté par défaut. Le CLI <code>gh</code> (jour 28) automatise l'administration.</p>
<pre class="pseudo">gh api /orgs/ORG/teams                  # lister les equipes de l'organisation
gh api /orgs/ORG/teams/TEAM/repos/ORG/REPO \\
  --method PUT -f permission=push        # donner l'acces "write" (push) d'un depot a une equipe
gh api /orgs/ORG/members                 # lister les membres
# le tout authentifie par un jeton (jamais en clair) :
#   env: GH_TOKEN: \${{ secrets.ADMIN_TOKEN }}</pre>
<div class="tip">Vision d'ensemble : l'<strong>organisation</strong> regroupe dépôts et personnes ; les <strong>équipes</strong> distribuent les permissions par groupe ; les <strong>niveaux d'accès</strong> (Read → Admin) appliquent le moindre privilège ; le <strong>CLI</strong> automatise le tout. Gérer les droits par équipe, jamais individu par individu, est la clé d'une administration saine à l'échelle.</div>`,
  exercises: [
    { type: "qcm", q: "Une organisation GitHub est…", opts: ["Un secret partagé", "Un compte partagé regroupant dépôts, membres et équipes", "Une branche protégée", "Un runner"], a: 1, exp: "Gouvernance commune pour un groupe." },
    { type: "qcm", q: "Le rôle Owner d'une organisation…", opts: ["Ne peut que lire", "A un contrôle total (membres, facturation, suppression)", "Gère seulement les issues", "Ne gère que la facturation"], a: 1, exp: "À réserver à très peu de personnes." },
    { type: "input", q: "Comment appelle-t-on un groupe nommé de membres qui reçoit des accès en bloc ? (le mot)", a: ["équipe", "equipe", "team", "une équipe"], ph: "un mot", exp: "Une équipe (team) distribue les permissions." },
    { type: "qcm", q: "Donner un accès à une équipe plutôt qu'à chaque personne, c'est…", opts: ["Plus fragile", "Plus simple : ajouter quelqu'un à l'équipe suffit à lui donner les accès", "Interdit", "Sans effet"], a: 1, exp: "Gestion par groupe, pas individu par individu." },

    { type: "input", q: "Quel est le niveau d'accès le plus restreint à un dépôt ? (le mot)", a: ["Read", "read"], ph: "un mot", exp: "Read : lire et cloner seulement." },
    { type: "input", q: "Quel niveau d'accès permet de pousser du code (développeur) ? (le mot)", a: ["Write", "write"], ph: "un mot", exp: "Write : push et création de branches." },
    { type: "qcm", q: "Le niveau Triage permet…", opts: ["De pousser du code", "De gérer issues et PR sans pousser de code", "De supprimer le dépôt", "De gérer la facturation"], a: 1, exp: "Tri et étiquetage, pas de push." },
    { type: "qcm", q: "Le niveau Admin d'un dépôt…", opts: ["Ne peut que lire", "Donne tout, y compris réglages et suppression : à limiter", "Gère seulement le CSS", "Est le défaut pour tous"], a: 1, exp: "Réservé à de rares responsables." },
    { type: "vf", q: "On accorde à chaque équipe le niveau minimal nécessaire à son travail.", a: true, exp: "Moindre privilège appliqué aux accès." },
    { type: "vf", q: "Les équipes peuvent être imbriquées : une sous-équipe hérite des accès de sa parente.", a: true, exp: "Reflète l'organigramme." },
    { type: "qcm", q: "Un secret d'organisation permet…", opts: ["De chiffrer une branche", "De partager un secret entre plusieurs dépôts de l'org", "De créer un tag", "De supprimer un membre"], a: 1, exp: "Ressource factorisée au niveau org." },
    { type: "qcm", q: "Pour automatiser l'administration d'une org, on utilise…", opts: ["Le README", "Le CLI gh / l'API (gh api /orgs/...)", "Un cache", "Un artefact"], a: 1, exp: "gh automatise membres, équipes, accès." },
    { type: "input", q: "Dans gh api ... --method PUT -f permission=push, quel niveau d'accès accorde-t-on ? (le mot, en français)", a: ["Write", "write", "écriture", "ecriture"], ph: "un mot", exp: "push correspond au niveau Write." },
    { type: "qcm", q: "La clé d'une administration saine à l'échelle est…", opts: ["Donner Admin à tous", "Gérer les droits par équipe et au niveau minimal, pas individu par individu", "Ne jamais utiliser d'équipes", "Tout mettre en public"], a: 1, exp: "Équipes + moindre privilège." }
  ],
  final: {
    title: "Exercice final — Structurer une organisation",
    intro: `<p>Tu organises une org avec une équipe backend (write sur api), une équipe securite (admin partout), et tu veux limiter les Owners.</p>`,
    questions: [
      { type: "input", q: "Quel objet regroupe des membres pour distribuer des accès en bloc ? (le mot)", a: ["équipe", "equipe", "team"], ph: "un mot", exp: "Une équipe." },
      { type: "input", q: "Quel niveau d'accès pour que backend puisse pousser du code sur api ? (le mot)", a: ["Write", "write"], ph: "un mot", exp: "Write." },
      { type: "qcm", q: "Le rôle Owner doit être…", opts: ["Donné à tous", "Réservé à très peu de personnes", "Supprimé", "Le défaut"], a: 1, exp: "Moindre privilège." },
      { type: "input", q: "Quel outil automatise la gestion des équipes et accès ? (les 2 lettres)", a: ["gh"], ph: "un nom court", exp: "gh / gh api." },
      { type: "vf", q: "On donne les accès à l'équipe, puis on y ajoute les membres, plutôt que dépôt par dépôt.", a: true, exp: "Gestion par groupe." }
    ],
    solution: `<pre class="pseudo"># Structure cible
# Equipe backend  -&gt; Write sur le depot "api"
# Equipe securite -&gt; Admin sur tous les depots
# Owners : 2 personnes maximum (moindre privilege)
# ------------------------------------------
# Automatisation via le CLI / l'API :
gh api /orgs/mon-org/teams                       # lister les equipes
gh api /orgs/mon-org/teams/backend/repos/mon-org/api \\
  --method PUT -f permission=push                # accorder Write a "backend" sur "api"
gh api /orgs/mon-org/teams/securite/repos/mon-org/api \\
  --method PUT -f permission=admin               # accorder Admin a "securite"
# authentification :
#   env: GH_TOKEN: \${{ secrets.ADMIN_TOKEN }}     # jamais de jeton en clair</pre>
<p>Chaque équipe reçoit le niveau minimal utile ; ajouter une personne à une équipe lui donne d'un coup les bons accès ; les Owners restent rares. C'est une administration saine et automatisable.</p>`
  }
};
</script>
