  title: "Protéger les branches (branch protection)",
  subtitle: "Transformer les règles d'équipe en verrous que la machine fait respecter.",
  theory: `
<h3>1. Pourquoi protéger une branche ?</h3>
<p>Jusqu'ici, les bonnes pratiques reposaient sur la <strong>bonne volonté</strong> : « on merge via PR », « on ne pousse pas en force sur main ». Mais une règle qui dépend de la mémoire finit par être oubliée, surtout un vendredi soir. La <strong>protection de branche</strong> (en anglais <em>branch protection</em>) est un ensemble de <strong>verrous configurés sur GitHub</strong> qui <strong>empêchent techniquement</strong> tout ce qui ne respecte pas les règles. On passe de la promesse au <strong>mécanisme</strong>.</p>
<p>Analogie : dire « ne roulez pas trop vite » est une consigne ; poser un <strong>ralentisseur</strong>, c'est un mécanisme. La protection de branche, ce sont les ralentisseurs de ton dépôt.</p>

<h3>2. Les règles de protection les plus utiles</h3>
<pre class="pseudo">Require a pull request before merging   # interdit tout commit DIRECT sur main : on passe forcément par une PR
  └─ Require N approvals                 # exiger au moins N revues approuvées (souvent 1 ou 2)
  └─ Require review from Code Owners     # exiger l'approbation du propriétaire (CODEOWNERS, jour 11)
  └─ Dismiss stale approvals             # une nouvelle poussée ANNULE les approbations précédentes (on re-relit)
Require status checks to pass           # exiger que la CI (les tests) soit VERTE avant de merger
  └─ Require branches to be up to date   # la branche doit être à jour avec main avant merge
Require conversation resolution          # tous les commentaires de revue doivent être résolus
Require linear history                   # interdit les commits de merge (impose rebase/squash) : historique propre
Do not allow bypassing / Include admins  # les ADMINS aussi doivent respecter les règles (pas de passe-droit)</pre>

<h3>3. Bloquer les gestes dangereux</h3>
<pre class="pseudo">Do not allow force pushes    # interdit git push --force sur la branche : impossible de réécrire main
Do not allow deletions       # interdit la suppression de la branche protégée
# → ces deux verrous mettent enfin en application l'avertissement des jours 3-5 :
#   sur une branche partagée comme main, réécrire l'historique devient IMPOSSIBLE, pas seulement déconseillé.</pre>
<div class="warn">C'est ici que l'avertissement récurrent du cours prend tout son sens : avec « Do not allow force pushes » sur <code>main</code>, plus personne — pas même par erreur — ne peut effacer l'historique partagé. La discipline devient une garantie technique.</div>

<h3>4. Le statut de CI : le pont vers GitHub Actions</h3>
<p>« Require status checks to pass » exige qu'un <strong>check</strong> (un contrôle automatisé) réussisse avant le merge. Ces checks sont produits par la <strong>CI</strong> — que tu vas construire dès demain avec GitHub Actions. Concrètement : ta PR affiche « ✅ tests / ❌ tests », et si c'est rouge, le bouton « Merge » est <strong>désactivé</strong>. Le workflow du jour 14 nourrira exactement ce verrou.</p>
<pre class="pseudo">Règle sans mécanisme  : "on ne merge que si les tests passent"        # espoir
Règle AVEC mécanisme  : "Require status checks: build-and-test"       # le bouton Merge reste grisé tant que c'est rouge</pre>

<h3>5. Configurer via l'interface ou l'API</h3>
<pre class="pseudo"># Interface : Settings &gt; Branches &gt; Add branch ruleset / protection rule, cibler "main", cocher les règles.
# En ligne de commande (gh + API) pour automatiser/versionner la config :
gh api -X PUT repos/ORG/REPO/branches/main/protection --input regles.json
# regles.json décrit les mêmes cases : reviews requises, status checks, force push interdit, etc.</pre>
<div class="tip">Les <strong>rulesets</strong> (jeux de règles) sont la version moderne et plus souple : une même règle peut cibler plusieurs branches par motif (ex. <code>release/*</code>), et se gère de façon centralisée à l'échelle de l'organisation.</div>

<h3>6. Une politique cohérente pour main</h3>
<pre class="pseudo">Sur main : PR obligatoire + 1 approbation + CODEOWNERS + CI verte    # qualité et revue garanties
         + force push interdit + suppression interdite               # historique partagé protégé
         + include admins                                            # règles pour TOUT LE MONDE</pre>
<p>Avec cette configuration, les conventions des onze premiers jours cessent d'être des vœux : elles sont <strong>appliquées par la machine</strong>. Il ne manque plus qu'à produire les fameux « status checks » — c'est tout l'objet des cinq derniers jours. Demain : les templates, pour standardiser issues et PR.</p>`,
  exercises: [
    { type: "qcm", q: "La protection de branche sert à :", opts: ["Chiffrer les données du dépôt", "Empêcher TECHNIQUEMENT ce qui ne respecte pas les règles", "Supprimer des branches", "Fusionner les PR automatiquement"], a: 1, exp: "De la promesse au mécanisme." },
    { type: "qcm", q: "'Require a pull request before merging' :", opts: ["Autorise les commits directs sur main", "Interdit tout commit direct : on passe par une PR", "Fusionne les PR sans revue", "Autorise le push --force sur main"], a: 1, exp: "Merge uniquement via PR." },

    { type: "qcm", q: "'Require linear history' :", opts: ["Impose des commits de merge", "Interdit les commits de merge (rebase/squash imposé)", "Autorise le push --force", "Impose un seul commit par PR"], a: 1, exp: "Historique propre et linéaire." },
    { type: "input", q: "Dans l'interface GitHub, la protection se configure sous 'Settings > ___'. Quel mot ?", a: ["branches"], ph: "...", exp: "Settings > Branches." },
    { type: "vf", q: "'Require conversation resolution' exige de résoudre tous les commentaires avant merge.", a: true, exp: "Aucune discussion laissée en suspens." },
    { type: "qcm", q: "'Require branches to be up to date' impose :", opts: ["De rebaser automatiquement la branche", "Que la branche soit à jour avec main avant merge", "Un historique linéaire", "Deux relecteurs"], a: 1, exp: "On teste contre un main récent." },
    { type: "input", q: "Quel réglage (en anglais, tel qu'affiché) interdit la réécriture d'historique par push --force ?", a: ["do not allow force pushes"], ph: "do not allow ...", exp: "Do not allow force pushes." },
    { type: "qcm", q: "Les 'rulesets' apportent :", opts: ["Uniquement des règles sur main", "Des règles ciblant plusieurs branches par motif, gérées de façon centralisée", "Le remplacement du fichier CODEOWNERS", "La désactivation de la CI"], a: 1, exp: "Version moderne et souple." },
    { type: "vf", q: "La protection de branche nourrit ses 'status checks' avec la CI (GitHub Actions).", a: true, exp: "Le pont vers les jours 14-16." },
    { type: "input", q: "Quel réglage (en anglais) empêche la SUPPRESSION de la branche protégée ?", a: ["do not allow deletions"], ph: "do not allow ...", exp: "Do not allow deletions : main ne peut être effacée." }
  ],
  final: {
    title: "Exercice final — Verrouiller main",
    intro: `<p>Tu mets en place une politique cohérente sur la branche main de la Ludothèque.</p>`,
    questions: [
      { type: "qcm", q: "Pour interdire les commits directs sur main :", opts: ["Require linear history", "Require a pull request before merging", "Do not allow deletions", "Include admins"], a: 1, exp: "Merge via PR uniquement." },
      { type: "qcm", q: "Pour exiger une revue approuvée :", opts: ["Require N approvals", "Require linear history", "Require status checks to pass", "Include administrators"], a: 0, exp: "Au moins 1 approbation." },
      { type: "qcm", q: "Pour bloquer le merge tant que les tests ne passent pas :", opts: ["Require status checks to pass", "Require conversation resolution", "Require linear history", "Require review from Code Owners"], a: 0, exp: "CI verte obligatoire." },
      { type: "input", q: "Quel réglage anglais rend impossible la réécriture de l'historique de main ?", a: ["do not allow force pushes"], ph: "do not allow ...", exp: "Force push interdit." },
      { type: "vf", q: "'Include admins' garantit que la règle vaut pour tout le monde.", a: true, exp: "Pas de passe-droit, même pour les admins." }
    ],
    solution: `<pre class="pseudo"># Politique cible sur la branche main :
Require a pull request before merging        # pas de commit direct
  + Require 1 approval                        # au moins une revue humaine
  + Require review from Code Owners           # le bon expert (CODEOWNERS)
  + Dismiss stale approvals                   # re-relire après un nouveau commit
Require status checks to pass: build-and-test # CI verte obligatoire
Require conversation resolution               # aucun commentaire non résolu
Do not allow force pushes                     # historique de main protégé
Do not allow deletions                        # main ne peut pas être supprimée
Include administrators                        # règles pour TOUT LE MONDE</pre>
<p>Les conventions sont devenues des verrous. Il ne manque que les status checks : place à GitHub Actions demain.</p>`
  }
};
