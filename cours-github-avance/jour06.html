  num: 6,
  title: "Stash : mettre son travail de côté",
  subtitle: "Ranger temporairement des modifications non committées pour changer de tâche.",
  theory: `
<h3>1. Qu'est-ce que le stash ?</h3>
<p>Le <strong>stash</strong> (en anglais « réserve », « cachette ») est un <strong>tiroir</strong> où Git range temporairement tes modifications <em>non committées</em> pour te rendre un répertoire de travail propre. Tu retrouves tes changements intacts quand tu rouvres le tiroir.</p>
<p>Le cas typique : tu codes une fonctionnalité, à moitié, et un <strong>correctif urgent</strong> tombe. Tu n'as pas envie de committer un travail inachevé juste pour changer de branche. Tu le mets au stash, tu traites l'urgence, puis tu ressors ton travail et tu reprends là où tu en étais.</p>
<p>Analogie : tu cuisines un plat (travail en cours) quand on sonne à la porte. Tu poses tout sur un plateau (stash), tu vas ouvrir (le hotfix), puis tu récupères ton plateau et tu finis de cuisiner.</p>

<h3>2. Ranger et ressortir</h3>
<pre class="pseudo">git stash                       # ranger toutes les modifs suivies ; le répertoire redevient propre
git stash push -m "wip resa"    # ranger avec un message (recommandé pour s'y retrouver)
git stash list                  # lister les stashs empilés : stash@{0}, stash@{1}, ...
git stash pop                   # ressortir le DERNIER stash ET le retirer de la pile
git stash apply                 # ressortir le dernier stash mais le GARDER dans la pile
git stash apply stash@{2}       # ressortir un stash précis par sa référence</pre>
<p>Le stash est une <strong>pile</strong> : le dernier rangé est <code>stash@{0}</code>. <code>pop</code> = « ressortir et jeter le ticket » ; <code>apply</code> = « ressortir mais garder une copie ».</p>

<h3>3. pop vs apply</h3>
<pre class="pseudo">pop    → applique le stash PUIS le supprime de la pile   # usage courant : je reprends mon travail
apply  → applique le stash mais le LAISSE dans la pile   # utile pour rejouer le même stash sur 2 branches</pre>
<div class="tip">En cas de conflit pendant un <code>pop</code>, Git n'efface PAS le stash : tu résous, tu <code>git add</code>, et tu peux ensuite le retirer manuellement avec <code>git stash drop</code>. Rien n'est perdu.</div>

<h3>4. Options utiles</h3>
<pre class="pseudo">git stash -u                    # -u (--include-untracked) : ranger AUSSI les fichiers nouveaux, non suivis
git stash -a                    # -a (--all) : ranger tout, y compris les fichiers ignorés (.gitignore)
git stash push chemin/fichier   # ranger SEULEMENT un fichier précis
git stash show -p stash@{0}     # voir le diff (les changements) contenus dans un stash
git stash branch nouvelle-br    # créer une branche À PARTIR d'un stash (pratique si la base a bougé)</pre>
<div class="warn">Par défaut, <code>git stash</code> ignore les fichiers <strong>non suivis</strong> (nouveaux, jamais <code>git add</code>). Si ton travail contient un nouveau fichier, il ne sera PAS rangé sans <code>-u</code> — et tu pourrais croire l'avoir perdu. Pense à <code>-u</code> quand tu crées des fichiers.</div>

<h3>5. Nettoyer la pile</h3>
<pre class="pseudo">git stash drop stash@{1}        # supprimer un stash précis
git stash clear                 # VIDER toute la pile (irréversible : à utiliser prudemment)</pre>

<h3>6. Quand PAS utiliser le stash ?</h3>
<p>Le stash est fait pour du <strong>court terme</strong>. Un stash oublié pendant des semaines devient un mystère : « c'était quoi, ça ? ». Pour ranger un travail plus durablement, mieux vaut faire un <strong>vrai commit</strong> sur une branche dédiée (quitte à le nettoyer plus tard par rebase interactif, jour 4). Retiens : le stash est une pause, pas une archive. Demain : récupérer des commits qu'on croyait perdus, avec le <code>reflog</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Le stash sert à :", opts: ["Supprimer des commits", "Ranger temporairement des modifs non committées", "Créer une branche permanente", "Pousser sur le distant"], a: 1, exp: "Un tiroir pour un répertoire propre." },
    { type: "input", q: "Écris la commande qui range toutes les modifs suivies dans le stash.", a: ["git stash", "git stash push"], ph: "git stash ...", exp: "git stash (ou git stash push)." },
    { type: "input", q: "Écris la commande qui liste les stashs empilés.", a: ["git stash list"], ph: "git stash ...", exp: "list affiche stash@{0}, {1}..." },
    { type: "qcm", q: "git stash pop :", opts: ["Applique et SUPPRIME le stash de la pile", "Applique mais le garde", "Vide toute la pile", "Ne fait rien"], a: 0, exp: "pop = ressortir et jeter le ticket." },
    { type: "qcm", q: "git stash apply :", opts: ["Applique et supprime", "Applique mais GARDE le stash dans la pile", "Supprime sans appliquer", "Crée un commit"], a: 1, exp: "apply garde une copie." },
    { type: "vf", q: "Le stash est une pile : le dernier rangé est stash@{0}.", a: true, exp: "LIFO : dernier entré, premier sorti." },
    { type: "input", q: "Quelle option range AUSSI les fichiers non suivis (nouveaux) ?", a: ["-u", "--include-untracked"], ph: "-...", exp: "-u = --include-untracked." },
    { type: "vf", q: "Par défaut, git stash range les fichiers nouveaux jamais git add.", a: false, exp: "Non : il faut -u pour les inclure." },
    { type: "qcm", q: "Ranger avec un message se fait avec :", opts: ["git stash -m \"...\"", "git stash push -m \"...\"", "git stash name", "git stash label"], a: 1, exp: "push -m ajoute un message." },
    { type: "input", q: "Écris la commande qui supprime le stash stash@{1}.", a: ["git stash drop stash@{1}"], ph: "git stash drop ...", exp: "drop supprime un stash précis." },
    { type: "qcm", q: "git stash clear :", opts: ["Range un fichier", "Vide TOUTE la pile (irréversible)", "Liste les stashs", "Applique le dernier"], a: 1, exp: "À utiliser prudemment." },
    { type: "qcm", q: "En cas de conflit pendant un pop, le stash :", opts: ["Est effacé quand même", "N'est PAS effacé : rien n'est perdu", "Casse le dépôt", "Devient une branche"], a: 1, exp: "Tu résous puis drop manuellement." },
    { type: "input", q: "Écris la commande qui crée une branche 'reprise' à partir d'un stash.", a: ["git stash branch reprise"], ph: "git stash branch ...", exp: "stash branch <nom>." },
    { type: "qcm", q: "Voir le diff contenu dans le dernier stash :", opts: ["git stash show -p", "git stash diff", "git stash list -p", "git diff stash"], a: 0, exp: "show -p affiche les changements." },
    { type: "vf", q: "Le stash est fait pour du long terme, comme une archive.", a: false, exp: "Court terme : sinon, fais un vrai commit." }
  ],
  final: {
    title: "Exercice final — Interrompre pour un hotfix",
    intro: `<p>Tu codes une feature (fichiers modifiés + 1 nouveau fichier). Un bug urgent tombe. Tu ranges, tu corriges, tu reprends.</p>`,
    questions: [
      { type: "input", q: "Ranger le travail, y compris le nouveau fichier, avec un message :", a: ["git stash push -u -m \"wip resa\"", "git stash -u -m \"wip resa\""], ph: "git stash push ...", exp: "-u pour le fichier non suivi." },
      { type: "input", q: "Vérifier ce qui a été rangé :", a: ["git stash list"], ph: "git stash ...", exp: "list." },
      { type: "qcm", q: "Après avoir traité et poussé le hotfix, revenir sur sa branche puis :", opts: ["git stash clear", "git stash pop", "git stash drop", "git stash list"], a: 1, exp: "pop ressort et retire le stash." },
      { type: "vf", q: "Sans -u, le nouveau fichier n'aurait PAS été rangé.", a: true, exp: "Les fichiers non suivis sont ignorés par défaut." },
      { type: "qcm", q: "Si le pop provoque un conflit :", opts: ["Le travail est perdu", "On résout, git add, puis stash drop ; rien n'est perdu", "Le dépôt casse", "On doit tout refaire"], a: 1, exp: "Le stash reste tant que le pop échoue." }
    ],
    solution: `<pre class="pseudo">$ git stash push -u -m "wip resa"     # ranger tout (y compris le nouveau fichier) avec un message
$ git stash list                      # stash@{0}: On feature: wip resa
$ git switch main && git pull         # aller traiter le hotfix
$ # ... correction, commit, push du hotfix ...
$ git switch feature/reservations     # revenir à mon travail
$ git stash pop                       # ressortir mon travail et vider le tiroir
# en cas de conflit : éditer, git add, puis git stash drop</pre>
<p>Une pause propre, une reprise sans perte. Demain : le reflog, filet de sécurité ultime.</p>`
  }
};
