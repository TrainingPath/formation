<script>
var DAY = {
  num: 15,
  title: "Contraintes, clés et IDENTITY",
  subtitle: "Garantir l'intégrité des données au niveau de la base.",
  theory: `
<h3>1. Les contraintes, gardiennes des données</h3>
<p>Une <strong>contrainte</strong> est une règle imposée directement par la base de données : elle refuse toute donnée qui la violerait. C'est comme un videur à l'entrée qui recale ce qui ne respecte pas les règles. Son avantage : elle protège les données même si le programme qui écrit oublie de vérifier — c'est la dernière ligne de défense. On appelle <strong>intégrité</strong> le fait que les données restent cohérentes et valides.</p>

<h3>2. PRIMARY KEY et IDENTITY</h3>
<p>Rappel : <strong>PRIMARY KEY</strong> (clé primaire) désigne la colonne identifiant chaque ligne de façon unique, et <strong>IDENTITY</strong> fabrique automatiquement ces identifiants.</p>
<pre class="pseudo">CREATE TABLE CATEGORIE (   -- création de la table CATEGORIE
    idCategorie INT IDENTITY(1,1) PRIMARY KEY,   -- clé + auto-incrément   -- entier auto-généré (1,2,3…) qui identifie chaque catégorie
    libelle     NVARCHAR(50) NOT NULL UNIQUE   -- nom obligatoire (NOT NULL) et sans doublon (UNIQUE)
);</pre>
<p><code>IDENTITY(1,1)</code> génère 1, 2, 3… (départ 1, pas 1). <code>PRIMARY KEY</code> = unique + non NULL.</p>

<h3>3. FOREIGN KEY</h3>
<p>Une <strong>FOREIGN KEY</strong> (clé étrangère) relie une table à une autre en exigeant que la valeur pointée existe réellement. <strong>REFERENCES</strong> indique la table et la colonne visées.</p>
<pre class="pseudo">CREATE TABLE JEU (   -- création de la table JEU
    idJeu       INT IDENTITY(1,1) PRIMARY KEY,   -- identifiant auto-généré, clé primaire
    titre       NVARCHAR(120) NOT NULL,   -- titre obligatoire
    idCategorie INT NOT NULL,   -- catégorie du jeu (obligatoire)
    CONSTRAINT FK_Jeu_Cat FOREIGN KEY (idCategorie)   -- contrainte nommée : idCategorie est une clé étrangère
        REFERENCES CATEGORIE(idCategorie)   -- ... qui doit exister dans CATEGORIE(idCategorie)
);</pre>
<p>La clé étrangère interdit un idCategorie qui n'existe pas dans CATEGORIE.</p>

<h3>4. Les autres contraintes</h3>
<p>Voici les règles complémentaires les plus utiles :</p>
<pre class="pseudo">NOT NULL              -- la valeur est obligatoire (case jamais vide)
UNIQUE                -- interdit deux fois la même valeur (pas de doublon)
CHECK (prix &gt;= 0)     -- règle personnalisée : refuse ce qui ne respecte pas la condition
DEFAULT 0             -- valeur automatique appliquée si on n'en fournit aucune</pre>
<pre class="pseudo">stockLocation INT NOT NULL DEFAULT 0 CHECK (stockLocation &gt;= 0),   -- stock obligatoire, valant 0 par défaut, jamais négatif
prixLocation  DECIMAL(6,2) CHECK (prixLocation &gt; 0)   -- prix décimal qui doit rester strictement positif</pre>

<h3>5. Nommer ses contraintes</h3>
<p>Donner un nom (<code>CONSTRAINT FK_Jeu_Cat ...</code>) facilite les messages d'erreur et la suppression ultérieure (<code>ALTER TABLE ... DROP CONSTRAINT</code>).</p>
<div class="tip">Les actions référentielles <code>ON DELETE CASCADE</code> / <code>ON DELETE NO ACTION</code> décident du sort des lignes filles quand on supprime la ligne mère. Par défaut, SQL Server refuse la suppression d'une catégorie encore référencée par un jeu (NO ACTION).</div>`,
  exercises: [
    { type: "qcm", q: "Une contrainte…", opts: ["Trie les données", "Impose une règle et refuse les données invalides", "Accélère les requêtes", "Supprime des lignes"], a: 1, exp: "Gardienne de l'intégrité." },
    { type: "qcm", q: "IDENTITY(1,1) signifie…", opts: ["Départ 1, pas 1 (1,2,3…)", "Toujours 1", "Un nombre aléatoire", "Une clé étrangère"], a: 0, exp: "Auto-incrément." },
    { type: "qcm", q: "PRIMARY KEY impose…", opts: ["Un doublon", "Unique ET non NULL", "Rien", "Une valeur par défaut"], a: 1, exp: "Identifie chaque ligne." },
    { type: "qcm", q: "FOREIGN KEY garantit…", opts: ["L'unicité", "Que la valeur existe dans la table référencée", "Le tri", "La rapidité"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "NOT NULL impose…", opts: ["Un doublon", "Une valeur obligatoire", "Une clé", "Un index"], a: 1, exp: "Pas de vide." },
    { type: "qcm", q: "UNIQUE interdit…", opts: ["Les NULL toujours", "Les doublons sur la colonne", "Les clés", "Les jointures"], a: 1, exp: "Valeurs distinctes." },
    { type: "qcm", q: "CHECK (prix > 0) …", opts: ["Trie par prix", "Refuse un prix nul ou négatif", "Crée un index", "Supprime"], a: 1, exp: "Règle personnalisée." },
    { type: "qcm", q: "DEFAULT 0 …", opts: ["Interdit 0", "Fournit 0 si aucune valeur donnée", "Trie", "Supprime"], a: 1, exp: "Valeur par défaut." },
    { type: "qcm", q: "Nommer une contrainte permet…", opts: ["De la cacher", "Des messages clairs et une suppression ciblée", "De trier", "Rien"], a: 1, exp: "CONSTRAINT nom ..." },
    { type: "qcm", q: "Par défaut, supprimer une catégorie référencée…", opts: ["Réussit", "Est refusé (NO ACTION)", "Supprime les jeux", "Met NULL"], a: 1, exp: "Protège l'intégrité." },
    { type: "vf", q: "ON DELETE CASCADE supprime les lignes filles avec la ligne mère.", a: true, exp: "Propagation de la suppression." },
    { type: "qcm", q: "Une PRIMARY KEY peut-elle contenir NULL ?", opts: ["Oui", "Non, jamais", "Une seule fois", "Selon la collation"], a: 1, exp: "PK = non NULL." },
    { type: "vf", q: "Une contrainte agit même si l'application oublie de vérifier.", a: true, exp: "Défense au niveau base." },
    { type: "qcm", q: "Empêcher un stock négatif :", opts: ["NOT NULL", "CHECK (stockLocation >= 0)", "UNIQUE", "DEFAULT"], a: 1, exp: "CHECK." },
    { type: "qcm", q: "IDENTITY se combine souvent avec…", opts: ["FOREIGN KEY", "PRIMARY KEY", "CHECK", "DEFAULT"], a: 1, exp: "Clé auto-générée." }
  ],
  final: {
    title: "Exercice final — Une table blindée",
    intro: `<p>On crée JEU avec toutes les protections utiles.</p>`,
    questions: [
      { type: "qcm", q: "Clé auto-incrémentée :", opts: ["idJeu INT UNIQUE", "idJeu INT IDENTITY(1,1) PRIMARY KEY", "idJeu NVARCHAR", "idJeu DEFAULT 1"], a: 1, exp: "IDENTITY + PK." },
      { type: "qcm", q: "Titre obligatoire :", opts: ["titre NVARCHAR(120) NOT NULL", "titre INT", "titre UNIQUE seul", "titre DEFAULT"], a: 0, exp: "NOT NULL." },
      { type: "qcm", q: "Prix strictement positif :", opts: ["prix DECIMAL CHECK (prix > 0)", "prix NOT NULL seul", "prix UNIQUE", "prix DEFAULT 0"], a: 0, exp: "CHECK." },
      { type: "qcm", q: "Lier à CATEGORIE :", opts: ["FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)", "UNIQUE idCategorie", "CHECK", "DEFAULT"], a: 0, exp: "Clé étrangère." },
      { type: "vf", q: "Un stockLocation avec DEFAULT 0 et CHECK (>= 0) empêche les valeurs négatives et fournit 0 par défaut.", a: true, exp: "Deux contraintes combinées." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE JEU (   -- table JEU avec toutes ses protections
    idJeu         INT IDENTITY(1,1) PRIMARY KEY,   -- identifiant auto-généré, clé primaire
    titre         NVARCHAR(120) NOT NULL,   -- titre obligatoire
    prixLocation  DECIMAL(6,2) CHECK (prixLocation &gt; 0),   -- prix décimal, strictement positif
    stockLocation INT NOT NULL DEFAULT 0 CHECK (stockLocation &gt;= 0),   -- stock obligatoire, 0 par défaut, jamais négatif
    idCategorie   INT NOT NULL,   -- catégorie obligatoire
    CONSTRAINT FK_Jeu_Cat FOREIGN KEY (idCategorie)   -- clé étrangère nommée
        REFERENCES CATEGORIE(idCategorie)   -- ... vers CATEGORIE
);</pre>
<p>Tes données sont protégées. Demain : ALTER TABLE, vues et index.</p>`
  }
};

  items: [
  { id: "sqlsrv-l15", title: "La table LOUER protégée", level: 3,
    statement: "Écris le CREATE TABLE de LOUER : idLocation (clé auto-incrémentée), idClient et idJeu (obligatoires, clés étrangères vers CLIENT et JEU), dateDebut (obligatoire, par défaut la date du jour), nbJours (obligatoire, contraint entre 1 et 30). Nomme tes clés étrangères.",
    hints: [
      "idLocation INT IDENTITY(1,1) PRIMARY KEY.",
      "dateDebut DATE NOT NULL DEFAULT GETDATE() ; nbJours INT NOT NULL CHECK (nbJours BETWEEN 1 AND 30).",
      "CONSTRAINT FK_Louer_Client FOREIGN KEY (idClient) REFERENCES CLIENT(idClient), idem pour JEU."
    ],
    solution: "CREATE TABLE LOUER (\n    idLocation INT IDENTITY(1,1) PRIMARY KEY,\n    idClient   INT NOT NULL,\n    idJeu      INT NOT NULL,\n    dateDebut  DATE NOT NULL DEFAULT GETDATE(),\n    nbJours    INT NOT NULL CHECK (nbJours BETWEEN 1 AND 30),\n    CONSTRAINT FK_Louer_Client FOREIGN KEY (idClient) REFERENCES CLIENT(idClient),\n    CONSTRAINT FK_Louer_Jeu    FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu)\n);",
    note: "Chaque colonne porte sa règle : IDENTITY+PK pour l'identité, NOT NULL pour l'obligation, DEFAULT GETDATE() pour la date automatique, CHECK BETWEEN pour borner la durée, et deux clés étrangères nommées pour garantir que client et jeu existent réellement." }
  ]
