var DAY = {
  num: 12,
  title: "Variables, IF, WHILE : le batch T-SQL",
  subtitle: "T-SQL est aussi un vrai langage procédural.",
  theory: `
<h3>1. Déclarer et affecter une variable</h3>
<p>Une <strong>variable</strong> est une petite boîte nommée où l'on range une valeur pour la réutiliser plus loin. En T-SQL, tout nom de variable commence par <strong>@</strong>. <strong>DECLARE</strong> (« déclarer ») crée la boîte en annonçant son type. <strong>SET</strong> (« mettre ») y range une valeur. <strong>Affecter</strong>, c'est justement mettre une valeur dans la variable.</p>
<pre class="pseudo">DECLARE @seuil DECIMAL(5,2) = 5.00;      -- crée la variable @seuil (type décimal) et lui donne d'emblée la valeur 5.00
DECLARE @nb INT;   -- crée la variable @nb (entier) encore vide
SET @nb = (SELECT COUNT(*) FROM JEU);    -- SET range dans @nb le résultat de la requête : le nombre de jeux
SELECT @nb AS total;                      -- affiche la valeur de @nb sous le nom « total »</pre>
<p>Toute variable T-SQL commence par <code>@</code>. On l'affecte avec <code>SET</code> (une valeur) ou <code>SELECT @x = ...</code>.</p>

<h3>2. IF ... ELSE</h3>
<p><strong>IF</strong> (« si ») exécute une instruction seulement quand une condition est vraie ; <strong>ELSE</strong> (« sinon ») donne l'alternative.</p>
<pre class="pseudo">IF (SELECT COUNT(*) FROM JEU) = 0   -- SI le nombre de jeux vaut 0...
    PRINT N'Catalogue vide';   -- ... alors afficher ce message
ELSE   -- SINON (au moins un jeu)...
    PRINT N'Il y a des jeux';   -- ... afficher cet autre message</pre>
<p>Pour exécuter plusieurs instructions dans un IF, on les groupe entre <strong>BEGIN</strong> et <strong>END</strong> (qui délimitent un bloc, comme des accolades).</p>
<pre class="pseudo">IF @nb &gt; 100   -- si la variable @nb dépasse 100...
BEGIN   -- début du bloc à exécuter
    PRINT N'Gros catalogue';   -- première instruction
    SET @seuil = 6.00;   -- seconde instruction : on change @seuil
END   -- fin du bloc</pre>

<h3>3. La boucle WHILE</h3>
<p>Une <strong>boucle</strong> répète des instructions. <strong>WHILE</strong> (« tant que ») recommence tant que sa condition reste vraie.</p>
<pre class="pseudo">DECLARE @i INT = 1;   -- variable compteur, initialisée à 1
WHILE @i &lt;= 5   -- TANT QUE @i est inférieur ou égal à 5...
BEGIN   -- début du corps de la boucle
    PRINT CONCAT(N'Étape ', @i);   -- afficher « Étape » suivi de la valeur du compteur
    SET @i = @i + 1;                      -- ne pas oublier d'avancer !   -- augmenter @i de 1, sinon la condition reste vraie pour toujours
END   -- fin du corps ; on repart tester la condition</pre>
<div class="warn">Oublier d'incrémenter la variable de contrôle crée une boucle infinie. <code>BREAK</code> sort de la boucle, <code>CONTINUE</code> passe au tour suivant.</div>

<h3>4. Le batch et GO</h3>
<p>Un <strong>batch</strong> (lot) est un paquet d'instructions envoyé d'un coup au serveur. Dans SSMS, <code>GO</code> sépare les batchs. Attention : une variable déclarée dans un batch n'existe plus dans le suivant.</p>
<pre class="pseudo">DECLARE @x INT = 1;   -- @x existe dans CE batch
GO            -- fin du batch : @x n'existe plus après   -- GO clôt le lot ; tout ce qui suit est un nouveau batch
PRINT @x;     -- ERREUR : @x n'est plus déclarée   -- la variable a disparu avec le batch précédent</pre>

<h3>5. PRINT vs SELECT</h3>
<p><code>PRINT</code> écrit un message texte (onglet Messages) ; <code>SELECT</code> renvoie un résultat tabulaire (onglet Résultats). Pour tracer l'exécution, on utilise PRINT.</p>`,
  exercises: [
    { type: "qcm", q: "Une variable T-SQL commence par…", opts: ["$", "@", "#", ":"], a: 1, exp: "@nom." },
    { type: "qcm", q: "Déclarer une variable :", opts: ["VAR @x", "DECLARE @x INT", "LET @x", "NEW @x"], a: 1, exp: "DECLARE @x TYPE." },
    { type: "qcm", q: "Affecter une valeur :", opts: ["@x := 3", "SET @x = 3", "LET @x 3", "@x -> 3"], a: 1, exp: "SET (ou SELECT @x = ...)." },
    { type: "qcm", q: "Grouper plusieurs instructions dans un IF :", opts: ["{ }", "BEGIN ... END", "( )", "DO ... DONE"], a: 1, exp: "Bloc BEGIN/END." },
    { type: "qcm", q: "La boucle T-SQL est…", opts: ["FOR", "WHILE condition BEGIN ... END", "LOOP", "REPEAT"], a: 1, exp: "WHILE + BEGIN/END." },
    { type: "qcm", q: "Oublier SET @i = @i + 1 dans un WHILE…", opts: ["N'a aucun effet", "Crée une boucle infinie", "Trie", "Est optimisé"], a: 1, exp: "La condition ne change jamais." },
    { type: "qcm", q: "Sortir d'une boucle :", opts: ["EXIT", "BREAK", "STOP", "RETURN toujours"], a: 1, exp: "BREAK." },
    { type: "qcm", q: "Passer au tour suivant :", opts: ["NEXT", "CONTINUE", "SKIP", "GO"], a: 1, exp: "CONTINUE." },
    { type: "qcm", q: "GO sert à…", opts: ["Lancer le serveur", "Séparer les batchs dans SSMS", "Trier", "Créer une variable"], a: 1, exp: "Séparateur de batch." },
    { type: "qcm", q: "Une variable déclarée avant GO…", opts: ["Existe partout", "N'existe plus dans le batch suivant", "Est globale", "Est permanente"], a: 1, exp: "Portée limitée au batch." },
    { type: "qcm", q: "PRINT sert à…", opts: ["Renvoyer un tableau", "Afficher un message texte (onglet Messages)", "Trier", "Créer une table"], a: 1, exp: "Message, pas un résultat." },
    { type: "qcm", q: "SELECT (sans affectation) renvoie…", opts: ["Un message dans l'onglet Messages", "Un résultat tabulaire", "Une valeur scalaire unique", "Une erreur de syntaxe"], a: 1, exp: "Onglet Résultats." },
    { type: "vf", q: "On peut affecter une variable avec le résultat d'un SELECT.", a: true, exp: "SET @x = (SELECT ...)." },
    { type: "qcm", q: "DECLARE @s DECIMAL(5,2) = 5.00 fait…", opts: ["Rien", "Déclare et initialise en une ligne", "Deux variables", "Une table"], a: 1, exp: "Déclaration + valeur." },
    { type: "vf", q: "T-SQL permet une vraie logique procédurale (IF, WHILE, variables).", a: true, exp: "C'est un langage complet." }
  ],
  final: {
    title: "Exercice final — Petit script T-SQL",
    intro: `<p>On veut un message selon le nombre de jeux de la table JEU.</p>`,
    questions: [
      { type: "qcm", q: "Stocker le nombre de jeux :", opts: ["SET @nb = COUNT(*)", "DECLARE @nb INT; SET @nb = (SELECT COUNT(*) FROM JEU)", "@nb = JEU", "COUNT @nb"], a: 1, exp: "DECLARE puis SET." },
      { type: "qcm", q: "Tester s'il dépasse 50 :", opts: ["IF @nb > 50 BEGIN ... END", "WHERE @nb > 50", "HAVING @nb", "TOP 50"], a: 0, exp: "IF + BEGIN/END." },
      { type: "qcm", q: "Afficher un message :", opts: ["ECHO", "PRINT N'...'", "SELECT INTO", "WRITE"], a: 1, exp: "PRINT." },
      { type: "qcm", q: "Répéter 3 fois :", opts: ["FOR i = 1 to 3", "WHILE @i <= 3 BEGIN ... SET @i = @i + 1 END", "REPEAT 3", "LOOP 3"], a: 1, exp: "WHILE + incrément." },
      { type: "vf", q: "Sans SET @i = @i + 1, la boucle WHILE tourne indéfiniment.", a: true, exp: "Boucle infinie." }
    ],
    solution: `<pre class="pseudo">DECLARE @nb INT;   -- créer la variable compteur @nb
SET @nb = (SELECT COUNT(*) FROM JEU);   -- y ranger le nombre de jeux

IF @nb &gt; 50   -- si plus de 50 jeux...
    PRINT N'Grand catalogue';   -- ... afficher ce message
ELSE   -- sinon...
    PRINT N'Petit catalogue';   -- ... afficher celui-ci

DECLARE @i INT = 1;   -- compteur de boucle initialisé à 1
WHILE @i &lt;= 3   -- tant que @i ne dépasse pas 3...
BEGIN   -- début du corps de boucle
    PRINT CONCAT(N'Tour ', @i);   -- afficher « Tour » et le numéro
    SET @i = @i + 1;   -- avancer le compteur (indispensable)
END</pre>
<p>T-SQL sait programmer. Demain : les procédures stockées.</p>`
  }
};
