<script>
var DAY = {
  num: 7,
  title: "Fonctions T-SQL : chaînes, dates, ISNULL, CAST",
  subtitle: "Transformer et calculer les valeurs à la volée.",
  theory: `
<h3>1. Fonctions de chaînes</h3>
<p>Une <strong>fonction</strong> est une petite machine qui reçoit une ou plusieurs valeurs entre parenthèses (ses <em>arguments</em>) et en renvoie une nouvelle — comme un mixeur : tu mets des fruits, tu obtiens un jus. Les fonctions de <strong>chaînes</strong> travaillent sur du texte. Voici les plus utiles (le <code>--</code> introduit l'explication) :</p>
<pre class="pseudo">LEN(s)            -- LENgth : renvoie la longueur de la chaîne s (le nombre de caractères), sans les espaces de fin
UPPER(s) LOWER(s) -- transforment le texte en MAJUSCULES (UPPER) ou en minuscules (LOWER)
LEFT(s, n) RIGHT(s, n)   -- prennent les n premiers caractères (LEFT = gauche) ou les n derniers (RIGHT = droite)
SUBSTRING(s, d, n)       -- extrait n caractères de s en commençant à la position d (SUBSTRING = sous-chaîne)
LTRIM(s) RTRIM(s) TRIM(s) -- enlèvent les espaces : à gauche (L), à droite (R), ou des deux côtés (TRIM)
REPLACE(s, a, b)         -- remplace dans s chaque a par b
CONCAT(a, b, ...)        -- colle plusieurs valeurs bout à bout (gère les NULL et convertit les types)</pre>

<h3>2. Fonctions de dates</h3>
<p>Ces fonctions manipulent des dates et des heures.</p>
<pre class="pseudo">GETDATE()                     -- renvoie la date ET l'heure de maintenant
SYSDATETIME()                 -- pareil, mais avec une précision encore plus fine
DATEADD(day, 7, GETDATE())    -- DATE-ADD = ajoute une durée : ici 7 « day » (jours) à la date du jour
DATEDIFF(day, d1, d2)         -- DATE-DIFF = différence : le nombre de jours entre d1 et d2
YEAR(d) MONTH(d) DAY(d)       -- extraient une partie d'une date : l'année, le mois, le jour
FORMAT(d, 'dd/MM/yyyy')       -- met la date en forme (ici jour/mois/année) ; pratique mais lent sur beaucoup de lignes</pre>
<pre class="pseudo">-- date de retour prévue d'une location   -- exemple concret d'utilisation de DATEADD
SELECT DATEADD(day, nbJours, dateDebut) AS retour_prevu FROM LOUER;   -- ajoute nbJours à la date de début → la date de retour, renommée retour_prevu</pre>

<h3>3. Gérer les NULL : ISNULL et COALESCE</h3>
<p>Quand une valeur est <strong>NULL</strong> (absente), ces fonctions permettent de fournir une valeur de remplacement.</p>
<pre class="pseudo">ISNULL(x, y)       -- si x est NULL, renvoie y à la place, sinon renvoie x (2 arguments, propre à T-SQL)
COALESCE(a, b, c)  -- renvoie la PREMIÈRE valeur non-NULL de la liste (standard, accepte plusieurs arguments)</pre>
<pre class="pseudo">SELECT ISNULL(telephone, N'non renseigné') FROM FOURNISSEUR;   -- affiche le téléphone, ou « non renseigné » quand la case est vide</pre>

<h3>4. Convertir les types : CAST et CONVERT</h3>
<p><strong>Convertir</strong>, c'est changer le type d'une valeur (par exemple un nombre affiché en texte).</p>
<pre class="pseudo">CAST(prixLocation AS INT)                 -- CAST(valeur AS type) : convertit le prix en entier ; syntaxe STANDARD, portable
CONVERT(NVARCHAR, GETDATE(), 103)         -- CONVERT propre à SQL Server ; le 3e argument 103 = format de date jj/mm/aaaa</pre>
<p><code>CAST</code> est standard ; <code>CONVERT</code> est spécifique à SQL Server mais offre des <strong>styles</strong> de formatage de dates (le 3e argument est un numéro de style).</p>

<h3>5. Choisir selon une condition : CASE et IIF</h3>
<p><strong>CASE</strong> est une expression qui renvoie une valeur différente selon une condition (comme un « si… alors… sinon… »). <strong>WHEN</strong> pose la condition, <strong>THEN</strong> donne la valeur si vraie, <strong>ELSE</strong> la valeur sinon, <strong>END</strong> ferme le bloc. <strong>IIF</strong> en est un raccourci pour les cas à deux issues.</p>
<pre class="pseudo">SELECT titre,   -- on affiche le titre, puis une colonne « état » calculée juste dessous
  CASE WHEN stockLocation &gt; 0 THEN N'dispo' ELSE N'épuisé' END AS etat   -- SI stock &gt; 0 ALORS « dispo » SINON « épuisé » ; END ferme le CASE ; AS le nomme etat
FROM JEU;   -- pour chaque jeu de la table

-- raccourci T-SQL équivalent   -- même résultat en plus court
SELECT titre, IIF(stockLocation &gt; 0, N'dispo', N'épuisé') AS etat FROM JEU;   -- IIF(condition, valeur_si_vrai, valeur_si_faux)</pre>
<div class="tip"><code>CASE</code> est l'expression conditionnelle standard (partout) ; <code>IIF(cond, a, b)</code> est un raccourci propre à T-SQL pour les cas simples à deux issues.</div>`,
  exercises: [
    { type: "qcm", q: "LEN(titre) renvoie…", opts: ["Le titre en majuscules", "La longueur du titre", "Le premier caractère", "Un NULL"], a: 1, exp: "Longueur de la chaîne." },
    { type: "qcm", q: "UPPER(titre) …", opts: ["Met en minuscules", "Met en majuscules", "Coupe la chaîne", "Compte"], a: 1, exp: "Casse haute." },
    { type: "qcm", q: "SUBSTRING(s, 2, 3) extrait…", opts: ["Les 2 premiers", "3 caractères à partir de la position 2", "Tout sauf 3", "La position 3"], a: 1, exp: "Extraction position/longueur." },
    { type: "qcm", q: "GETDATE() renvoie…", opts: ["Un id", "La date et l'heure courantes", "Un nombre aléatoire", "Le nom de la base"], a: 1, exp: "Date/heure système." },
    { type: "qcm", q: "Ajouter 7 jours à une date :", opts: ["DATE + 7", "DATEADD(day, 7, date)", "ADDDATE(7)", "date.plus(7)"], a: 1, exp: "DATEADD(unité, n, date)." },
    { type: "qcm", q: "Écart en jours entre deux dates :", opts: ["DATEDIFF(day, d1, d2)", "d2 - d1 toujours", "DIFF(d1, d2)", "DATEADD"], a: 0, exp: "DATEDIFF(unité, d1, d2)." },
    { type: "qcm", q: "ISNULL(x, y) …", opts: ["Teste l'égalité", "Renvoie y si x est NULL", "Trie", "Compte"], a: 1, exp: "Remplacement de NULL (2 args)." },
    { type: "qcm", q: "COALESCE(a, b, c) …", opts: ["Renvoie a toujours", "Renvoie le premier non-NULL", "Additionne", "Trie"], a: 1, exp: "Premier non nul, plusieurs args." },
    { type: "qcm", q: "CAST est…", opts: ["Propre à SQL Server", "Standard (portable) pour convertir un type", "Une fonction de date", "Un index"], a: 1, exp: "Conversion standard." },
    { type: "qcm", q: "CONVERT avec un 3e argument permet…", opts: ["De trier", "Des styles de formatage (surtout pour les dates)", "De compter", "De joindre"], a: 1, exp: "Styles T-SQL, ex. 103 = jj/mm/aaaa." },
    { type: "qcm", q: "CASE WHEN ... THEN ... ELSE ... END est…", opts: ["Propre à T-SQL", "Une expression conditionnelle standard", "Une boucle", "Un index"], a: 1, exp: "Conditionnelle SQL universelle." },
    { type: "qcm", q: "IIF(cond, a, b) est…", opts: ["Standard partout", "Un raccourci T-SQL pour un CASE à deux issues", "Une jointure", "Une agrégation"], a: 1, exp: "Spécifique SQL Server." },
    { type: "vf", q: "CONCAT gère les NULL et convertit les types automatiquement.", a: true, exp: "Plus sûr que l'opérateur +." },
    { type: "qcm", q: "Date de retour = début + durée :", opts: ["dateDebut + nbJours", "DATEADD(day, nbJours, dateDebut)", "nbJours + GETDATE()", "DATEDIFF"], a: 1, exp: "DATEADD ajoute une durée." },
    { type: "vf", q: "ISNULL prend 2 arguments, COALESCE en accepte plusieurs.", a: true, exp: "Différence clé entre les deux." }
  ],
  final: {
    title: "Exercice final — Fonctions à l'œuvre",
    intro: `<p>Tables JEU(idJeu, titre, prixLocation, stockLocation) et LOUER(idJeu, dateDebut, nbJours).</p>`,
    questions: [
      { type: "qcm", q: "Titre en majuscules + sa longueur :", opts: ["UPPER(titre), LEN(titre)", "titre.upper(), titre.len()", "MAJ(titre)", "SIZE(titre)"], a: 0, exp: "UPPER et LEN." },
      { type: "qcm", q: "État « dispo »/« épuisé » selon le stock :", opts: ["IF stock", "CASE WHEN stockLocation &gt; 0 THEN N'dispo' ELSE N'épuisé' END", "STOCK()", "WHERE stock"], a: 1, exp: "CASE (ou IIF)." },
      { type: "qcm", q: "Date de retour d'une location :", opts: ["dateDebut + nbJours", "DATEADD(day, nbJours, dateDebut)", "DATEDIFF(nbJours)", "GETDATE(nbJours)"], a: 1, exp: "DATEADD." },
      { type: "qcm", q: "Remplacer un téléphone NULL par « - » :", opts: ["ISNULL(telephone, N'-')", "telephone = '-'", "NULLIF(telephone)", "COUNT(telephone)"], a: 0, exp: "ISNULL." },
      { type: "vf", q: "IIF(stockLocation &gt; 0, N'dispo', N'épuisé') équivaut au CASE à deux issues.", a: true, exp: "Raccourci T-SQL." }
    ],
    solution: `<pre class="pseudo">SELECT UPPER(titre) AS titre_maj,   -- titre en majuscules, colonne nommée titre_maj
       LEN(titre)   AS longueur,   -- nombre de caractères du titre
       IIF(stockLocation &gt; 0, N'dispo', N'épuisé') AS etat   -- « dispo » si en stock, sinon « épuisé »
FROM JEU;   -- pour chaque jeu

-- date de retour prévue   -- calcul de la date de rendu d'une location
SELECT idJeu, DATEADD(day, nbJours, dateDebut) AS retour_prevu   -- ajoute nbJours à dateDebut
FROM LOUER;   -- pour chaque location</pre>
<p>Tu transformes les données à la volée. Demain : agrégats et regroupements.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête avec fonctions T-SQL…",
  items: [
  { id: "sqlsrv-l7", title: "Fiche enrichie d'un jeu", level: 3,
    statement: "À partir de JEU(idJeu, titre, prixLocation, stockLocation, idFournisseur), écris une requête affichant : le titre en majuscules, le prix TTC (prixLocation * 1.2 converti en DECIMAL(6,2)), un état 'dispo'/'épuisé' selon le stock de location, et le fournisseur (idFournisseur) ou 'aucun' s'il est NULL.",
    hints: [
      "UPPER(titre) ; CAST(prixLocation * 1.2 AS DECIMAL(6,2)).",
      "IIF(stockLocation > 0, N'dispo', N'épuisé') ou un CASE.",
      "ISNULL(CAST(idFournisseur AS NVARCHAR(10)), N'aucun')."
    ],
    solution: "SELECT UPPER(titre) AS titre,\n       CAST(prixLocation * 1.2 AS DECIMAL(6,2)) AS ttc,\n       IIF(stockLocation > 0, N'dispo', N'épuisé') AS etat,\n       ISNULL(CAST(idFournisseur AS NVARCHAR(10)), N'aucun') AS fournisseur\nFROM JEU;",
    note: "Une seule requête mobilise plusieurs fonctions T-SQL : UPPER (chaîne), CAST (conversion), IIF (conditionnel), ISNULL (gestion du NULL). C'est le quotidien du développeur SQL Server pour produire des affichages propres." }
  ]
};
</script>
