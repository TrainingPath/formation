var DAY = {
  num: 16,
  title: "ALTER TABLE, vues et index",
  subtitle: "Faire évoluer le schéma et accélérer les requêtes.",
  theory: `
<h3>1. ALTER TABLE : faire évoluer une table</h3>
<p>Le <strong>schéma</strong> d'une base, c'est sa structure : les tables et leurs colonnes. Une base vit et doit parfois changer. <strong>ALTER TABLE</strong> (« modifier la table ») sert à faire évoluer une table existante sans la recréer : ajouter une colonne, en supprimer une, changer un type, ajouter une contrainte.</p>
<pre class="pseudo">ALTER TABLE JEU ADD dateAjout DATE;                    -- ajouter une colonne   -- ADD = crée une nouvelle colonne dateAjout de type DATE
ALTER TABLE JEU DROP COLUMN dateAjout;                 -- la supprimer   -- DROP COLUMN = enlève la colonne (et ses données !)
ALTER TABLE JEU ALTER COLUMN titre NVARCHAR(200);      -- changer le type   -- ALTER COLUMN = modifie le type/la taille de titre
ALTER TABLE JEU ADD CONSTRAINT CK_prix CHECK (prixLocation &gt; 0);   -- ADD CONSTRAINT = ajoute après coup une règle (ici prix &gt; 0)</pre>
<div class="warn">En T-SQL, on écrit <code>ALTER COLUMN</code> (et non MODIFY comme MySQL). Supprimer une colonne détruit ses données : à manier avec soin.</div>

<h3>2. Les vues : une requête nommée</h3>
<p>Une <strong>vue</strong> (view) est une requête enregistrée sous un nom, qu'on interroge ensuite comme si c'était une table. On dit qu'elle est <strong>virtuelle</strong> : elle ne contient aucune donnée en propre, elle relit les vraies tables à chaque appel. C'est comme une fenêtre découpée sur les données.</p>
<pre class="pseudo">CREATE VIEW v_JeuxDisponibles AS   -- crée une vue nommée v_JeuxDisponibles ; AS introduit sa requête
SELECT j.titre, c.libelle, j.prixLocation   -- les colonnes montrées par la vue
FROM JEU j   -- table des jeux (alias j)
INNER JOIN CATEGORIE c ON j.idCategorie = c.idCategorie   -- jointe à sa catégorie
WHERE j.stockLocation &gt; 0;   -- ... en ne gardant que les jeux en stock

SELECT * FROM v_JeuxDisponibles;   -- s'interroge comme une table   -- on lit la vue avec un simple SELECT, comme une table normale</pre>

<h3>3. À quoi sert une vue ?</h3>
<p>Masquer la complexité d'une jointure, restreindre les colonnes visibles (sécurité), présenter les données autrement — sans dupliquer les données : la vue lit toujours les tables réelles.</p>

<h3>4. Les index : accélérer les recherches</h3>
<p>Un <strong>index</strong> est une structure qui aide le moteur à retrouver vite les lignes, comme l'index alphabétique à la fin d'un livre évite de tout feuilleter. <strong>UNIQUE</strong> en fait aussi une garantie de non-doublon.</p>
<pre class="pseudo">CREATE INDEX IX_Jeu_Titre ON JEU(titre);            -- non clustered   -- crée un index sur la colonne titre pour accélérer les recherches par titre
CREATE UNIQUE INDEX IX_Cat_Lib ON CATEGORIE(libelle);   -- index UNIQUE : accélère ET interdit deux libellés identiques</pre>
<p>Un index accélère les <code>WHERE</code>, <code>JOIN</code> et <code>ORDER BY</code> sur la colonne, au prix d'un léger surcoût en écriture.</p>

<h3>5. Clustered vs non clustered</h3>
<p>L'index <strong>clustered</strong> (« groupé », souvent la clé primaire) définit l'ordre physique réel des lignes dans la table : il ne peut y en avoir qu'un seul. Les index <strong>non clustered</strong> (« non groupés ») sont des structures séparées qui pointent vers les lignes : on peut en créer plusieurs.</p>
<div class="tip">Trop d'index ralentit les écritures et occupe de l'espace. On indexe les colonnes souvent filtrées ou jointes, pas toutes les colonnes.</div>`,
  exercises: [
    { type: "qcm", q: "Ajouter une colonne :", opts: ["ALTER TABLE JEU ADD col TYPE", "ADD COLUMN", "NEW COLUMN", "INSERT COLUMN"], a: 0, exp: "ALTER TABLE ... ADD." },
    { type: "qcm", q: "Changer le type d'une colonne en T-SQL :", opts: ["MODIFY", "ALTER COLUMN", "CHANGE", "SET TYPE"], a: 1, exp: "ALTER COLUMN (pas MODIFY)." },
    { type: "qcm", q: "Supprimer une colonne détruit…", opts: ["Rien", "Ses données", "La table entière", "Les index seulement"], a: 1, exp: "À manier avec soin." },
    { type: "qcm", q: "Une vue est…", opts: ["Une copie des données", "Une requête enregistrée, manipulée comme une table", "Un index", "Une contrainte"], a: 1, exp: "Table virtuelle." },
    { type: "qcm", q: "Créer une vue :", opts: ["CREATE VIEW nom AS SELECT ...", "NEW VIEW", "MAKE VIEW", "DECLARE VIEW"], a: 0, exp: "CREATE VIEW." },
    { type: "qcm", q: "Une vue duplique-t-elle les données ?", opts: ["Oui", "Non, elle lit les tables réelles", "Parfois", "Toujours"], a: 1, exp: "Pas de duplication." },
    { type: "qcm", q: "Un usage clé d'une vue :", opts: ["Trier plus vite", "Masquer une jointure complexe et restreindre les colonnes", "Créer des index", "Supprimer"], a: 1, exp: "Simplicité et sécurité." },
    { type: "qcm", q: "Un index sert à…", opts: ["Stocker des doublons", "Accélérer WHERE, JOIN, ORDER BY", "Trier l'affichage final", "Supprimer"], a: 1, exp: "Recherche rapide." },
    { type: "qcm", q: "Le coût d'un index :", opts: ["Aucun", "Un léger surcoût en écriture et en espace", "Il casse les requêtes", "Il duplique la table"], a: 1, exp: "Compromis lecture/écriture." },
    { type: "qcm", q: "Un index clustered par table :", opts: ["Plusieurs", "Un seul (ordre physique)", "Aucun", "Autant qu'on veut"], a: 1, exp: "Un seul clustered." },
    { type: "qcm", q: "Les index non clustered :", opts: ["Un seul possible", "Plusieurs possibles", "Interdits", "Identiques au clustered"], a: 1, exp: "Structures séparées." },
    { type: "vf", q: "Trop d'index ralentit les écritures.", a: true, exp: "On indexe avec parcimonie." },
    { type: "qcm", q: "On indexe surtout…", opts: ["Toutes les colonnes", "Les colonnes souvent filtrées ou jointes", "Aucune", "Les colonnes texte longues"], a: 1, exp: "Ciblage utile." },
    { type: "vf", q: "Une vue s'interroge avec SELECT comme une table.", a: true, exp: "SELECT * FROM v_..." },
    { type: "qcm", q: "L'index clustered correspond souvent à…", opts: ["Une colonne texte", "La clé primaire", "Un CHECK", "Une vue"], a: 1, exp: "PK = clustered par défaut." }
  ],
  final: {
    title: "Exercice final — Simplifier et accélérer",
    intro: `<p>On veut une vue des jeux louables et un index de recherche.</p>`,
    questions: [
      { type: "qcm", q: "Vue des jeux disponibles à la location :", opts: ["CREATE VIEW v_dispo AS SELECT ... WHERE stockLocation > 0", "CREATE INDEX", "ALTER TABLE", "NEW VIEW"], a: 0, exp: "CREATE VIEW." },
      { type: "qcm", q: "L'interroger :", opts: ["EXEC v_dispo", "SELECT * FROM v_dispo", "CALL v_dispo", "RUN"], a: 1, exp: "Comme une table." },
      { type: "qcm", q: "Accélérer la recherche par titre :", opts: ["CREATE INDEX IX_Jeu_Titre ON JEU(titre)", "CREATE VIEW", "ALTER titre", "CHECK titre"], a: 0, exp: "Index sur titre." },
      { type: "qcm", q: "Ajouter une colonne dateAjout :", opts: ["ALTER TABLE JEU ADD dateAjout DATE", "MODIFY", "NEW COLUMN", "INSERT COLUMN"], a: 0, exp: "ALTER TABLE ADD." },
      { type: "vf", q: "Une vue ne stocke pas les données : elle lit les tables sous-jacentes à chaque requête.", a: true, exp: "Table virtuelle." }
    ],
    solution: `<pre class="pseudo">CREATE VIEW v_JeuxDisponibles AS   -- crée la vue des jeux disponibles
SELECT j.titre, c.libelle, j.prixLocation   -- colonnes affichées
FROM JEU j JOIN CATEGORIE c ON j.idCategorie = c.idCategorie   -- jointure jeu/catégorie
WHERE j.stockLocation &gt; 0;   -- seulement ceux en stock

CREATE INDEX IX_Jeu_Titre ON JEU(titre);   -- index pour accélérer les recherches par titre

ALTER TABLE JEU ADD dateAjout DATE;   -- ajoute une colonne date d'ajout</pre>
<p>Ton schéma évolue et tes requêtes accélèrent. Demain : les transactions.</p>`
  }
};
