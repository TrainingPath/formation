<script>
var DAY = {
  num: 14,
  title: "Fonctions et gestion d'erreurs (TRY…CATCH)",
  subtitle: "Créer ses propres fonctions, et rattraper les erreurs.",
  theory: `
<h3>1. Fonction scalaire</h3>
<p>Une <strong>fonction</strong> qu'on crée soi-même renvoie une valeur et s'utilise directement dans une requête (un SELECT), à la différence d'une procédure qu'on lance avec EXEC. <strong>Scalaire</strong> veut dire qu'elle renvoie UNE seule valeur. <strong>RETURNS</strong> annonce le type renvoyé, <strong>RETURN</strong> renvoie la valeur calculée.</p>
<pre class="pseudo">CREATE FUNCTION PrixTTC (@ht DECIMAL(6,2))   -- crée la fonction PrixTTC recevant un montant hors taxe @ht
RETURNS DECIMAL(6,2)   -- RETURNS = elle renverra un décimal
AS
BEGIN   -- début du corps
    RETURN @ht * 1.2;   -- RETURN = renvoie le montant TTC (+ 20 %)
END;   -- fin du corps

SELECT titre, dbo.PrixTTC(prixLocation) AS ttc FROM JEU;   -- on l'appelle dans le SELECT pour chaque jeu ; dbo. = son schéma</pre>
<p>Un <strong>schéma</strong> est un dossier logique qui regroupe des objets de la base ; <code>dbo</code> est le schéma par défaut. On préfixe la fonction par son schéma (<code>dbo.</code>) à l'appel.</p>

<h3>2. Fonction table (inline)</h3>
<p>Une <strong>fonction table</strong> renvoie tout un ensemble de lignes : on peut donc l'utiliser dans le FROM, comme une vraie table.</p>
<pre class="pseudo">CREATE FUNCTION JeuxDeCategorie (@idCat INT)   -- crée une fonction recevant une catégorie @idCat
RETURNS TABLE   -- RETURNS TABLE = elle renvoie un tableau de lignes
AS
RETURN (SELECT titre, prixLocation FROM JEU WHERE idCategorie = @idCat);   -- renvoie les jeux de la catégorie demandée

SELECT * FROM dbo.JeuxDeCategorie(1);   -- s'utilise comme une table   -- on lit son résultat dans un FROM, comme n'importe quelle table</pre>

<h3>3. TRY ... CATCH</h3>
<p>Pour éviter qu'une erreur ne fasse tout planter, on entoure le code risqué d'un bloc <strong>TRY</strong> (« essayer ») ; si une erreur survient, l'exécution saute au bloc <strong>CATCH</strong> (« attraper ») au lieu d'interrompre tout le batch.</p>
<pre class="pseudo">BEGIN TRY   -- début de la zone protégée : on ESSAIE
    INSERT INTO JEU (titre, idCategorie) VALUES (N'Test', 999);  -- FK invalide   -- insertion qui va échouer (catégorie 999 inexistante)
END TRY   -- fin de la zone d'essai
BEGIN CATCH   -- si une erreur a eu lieu, on ATTRAPE ici
    PRINT N'Erreur : ' + ERROR_MESSAGE();   -- afficher le message de l'erreur au lieu de planter
END CATCH;   -- fin du bloc de rattrapage</pre>
<p>Le bloc <code>TRY</code> tente ; en cas d'erreur, l'exécution saute au <code>CATCH</code> au lieu d'interrompre tout le batch.</p>

<h3>4. Les fonctions d'erreur</h3>
<p>Dans le CATCH, ces fonctions donnent des détails sur l'erreur attrapée :</p>
<pre class="pseudo">ERROR_MESSAGE()   -- renvoie le texte décrivant l'erreur
ERROR_NUMBER()    -- renvoie le numéro d'identification de l'erreur
ERROR_LINE()      -- renvoie la ligne où l'erreur s'est produite
ERROR_SEVERITY()  -- renvoie le niveau de gravité de l'erreur</pre>

<h3>5. Lever sa propre erreur : THROW</h3>
<p><strong>THROW</strong> (« lever/lancer ») permet de déclencher volontairement une erreur, par exemple pour bloquer une situation métier interdite. On lui donne un numéro, un message et un état.</p>
<pre class="pseudo">IF @stock &lt; 0   -- si le stock devient négatif (interdit)...
    THROW 50001, N'Stock négatif interdit', 1;   -- THROW numéro, message, état : déclenche une erreur personnalisée</pre>
<div class="tip"><code>THROW</code> (depuis SQL Server 2012) remplace l'ancien <code>RAISERROR</code> pour signaler une erreur métier. Placé dans un CATCH, un <code>THROW</code> sans argument <strong>relance</strong> l'erreur d'origine.</div>`,
  exercises: [
    { type: "qcm", q: "Différence fonction / procédure :", opts: ["Aucune", "La fonction renvoie une valeur et s'utilise dans une requête", "La procédure renvoie une valeur", "La fonction supprime des lignes"], a: 1, exp: "Fonction = valeur, dans un SELECT." },
    { type: "qcm", q: "Créer une fonction scalaire :", opts: ["CREATE PROC", "CREATE FUNCTION ... RETURNS type AS BEGIN RETURN ... END", "NEW FUNC", "DECLARE FUNCTION"], a: 1, exp: "CREATE FUNCTION." },
    { type: "qcm", q: "À l'appel, on préfixe la fonction par…", opts: ["@", "le schéma (dbo.)", "#", "EXEC"], a: 1, exp: "dbo.PrixTTC(...)." },
    { type: "qcm", q: "Une fonction table renvoie…", opts: ["Une valeur scalaire unique", "un ensemble de lignes utilisable comme une table", "Un message texte", "Un simple booléen"], a: 1, exp: "RETURNS TABLE." },
    { type: "qcm", q: "TRY ... CATCH sert à…", opts: ["Trier", "Rattraper une erreur sans interrompre tout le batch", "Compter", "Indexer"], a: 1, exp: "Gestion d'erreurs." },
    { type: "qcm", q: "En cas d'erreur dans TRY, l'exécution…", opts: ["S'arrête tout", "Saute au bloc CATCH", "Ignore", "Recommence"], a: 1, exp: "Bascule vers CATCH." },
    { type: "qcm", q: "Le texte de l'erreur s'obtient avec…", opts: ["ERROR_TEXT()", "ERROR_MESSAGE()", "MESSAGE()", "PRINT()"], a: 1, exp: "ERROR_MESSAGE()." },
    { type: "qcm", q: "Le numéro de l'erreur :", opts: ["ERROR_ID()", "ERROR_NUMBER()", "NUM_ERROR()", "CODE()"], a: 1, exp: "ERROR_NUMBER()." },
    { type: "qcm", q: "Lever une erreur métier :", opts: ["ERROR()", "THROW 50001, N'...', 1", "PRINT erreur", "RAISE seul"], a: 1, exp: "THROW." },
    { type: "qcm", q: "THROW sans argument dans un CATCH…", opts: ["Ne fait rien", "Relance l'erreur d'origine", "Trie", "Ferme la session"], a: 1, exp: "Re-throw." },
    { type: "vf", q: "THROW remplace l'ancien RAISERROR depuis SQL Server 2012.", a: true, exp: "Syntaxe moderne." },
    { type: "qcm", q: "SELECT dbo.PrixTTC(prixLocation) …", opts: ["Crée une table", "Applique la fonction à chaque ligne", "Supprime", "Trie"], a: 1, exp: "Fonction dans le SELECT." },
    { type: "vf", q: "Une fonction table s'utilise dans le FROM comme une table.", a: true, exp: "FROM dbo.Fn(...)." },
    { type: "qcm", q: "ERROR_LINE() renvoie…", opts: ["Le message", "La ligne où l'erreur s'est produite", "Le numéro", "La gravité"], a: 1, exp: "Ligne de l'erreur." },
    { type: "qcm", q: "Le corps d'une fonction scalaire finit par…", opts: ["END seul", "RETURN valeur; END", "EXEC", "GO"], a: 1, exp: "RETURN la valeur." }
  ],
  final: {
    title: "Exercice final — Fonction et robustesse",
    intro: `<p>On crée une fonction de tarif et on protège une insertion.</p>`,
    questions: [
      { type: "qcm", q: "Fonction renvoyant le prix TTC :", opts: ["CREATE PROCEDURE", "CREATE FUNCTION PrixTTC(@ht DECIMAL) RETURNS DECIMAL AS BEGIN RETURN @ht*1.2 END", "NEW FUNC", "DECLARE"], a: 1, exp: "CREATE FUNCTION." },
      { type: "qcm", q: "L'appeler dans un SELECT :", opts: ["EXEC PrixTTC", "dbo.PrixTTC(prixLocation)", "CALL PrixTTC", "PrixTTC sans schéma"], a: 1, exp: "Préfixe dbo." },
      { type: "qcm", q: "Protéger un INSERT risqué :", opts: ["WHERE", "BEGIN TRY ... END TRY BEGIN CATCH ... END CATCH", "IF seul", "TOP"], a: 1, exp: "TRY/CATCH." },
      { type: "qcm", q: "Afficher le message d'erreur dans le CATCH :", opts: ["ERROR_MESSAGE()", "PRINT erreur", "MESSAGE()", "ERR()"], a: 0, exp: "ERROR_MESSAGE()." },
      { type: "vf", q: "THROW permet de signaler soi-même une erreur métier.", a: true, exp: "Erreur personnalisée." }
    ],
    solution: `<pre class="pseudo">CREATE FUNCTION PrixTTC (@ht DECIMAL(6,2))   -- fonction de calcul du TTC
RETURNS DECIMAL(6,2)   -- renvoie un décimal
AS BEGIN RETURN @ht * 1.2; END;   -- renvoie le hors-taxe majoré de 20 %

BEGIN TRY   -- zone protégée
    INSERT INTO JEU (titre, idCategorie) VALUES (N'X', 999);   -- insertion qui échouera (catégorie 999 absente)
END TRY
BEGIN CATCH   -- rattrapage de l'erreur
    PRINT N'Erreur : ' + ERROR_MESSAGE();   -- afficher le message plutôt que planter
END CATCH;</pre>
<p>Ton code résiste aux erreurs. Demain : contraintes, clés et IDENTITY.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta fonction ou ton bloc TRY/CATCH…",
  items: [
  { id: "sqlsrv-l14", title: "Insertion protégée", level: 3,
    statement: "Écris un bloc T-SQL qui tente d'insérer un jeu dans JEU(titre, prixLocation, idCategorie) et, en cas d'échec (par exemple catégorie inexistante), rattrape l'erreur avec TRY…CATCH et affiche le numéro et le message de l'erreur. Ajoute un THROW pour relancer l'erreur après l'avoir tracée.",
    hints: [
      "BEGIN TRY ... INSERT ... END TRY.",
      "BEGIN CATCH : PRINT avec ERROR_NUMBER() et ERROR_MESSAGE().",
      "Termine le CATCH par THROW; (sans argument) pour relancer l'erreur d'origine."
    ],
    solution: "BEGIN TRY\n    INSERT INTO JEU (titre, prixLocation, idCategorie)\n    VALUES (N'Nouveau jeu', 4.50, 999);\nEND TRY\nBEGIN CATCH\n    PRINT CONCAT(N'Erreur ', ERROR_NUMBER(), N' : ', ERROR_MESSAGE());\n    THROW;\nEND CATCH;",
    atoi: {
      cmd: "BEGIN TRY\n    INSERT INTO JEU (titre, prixLocation, idCategorie)\n    VALUES (N'Nouveau jeu', 4.50, 999);\nEND TRY\nBEGIN CATCH\n    PRINT CONCAT(N'Erreur ', ERROR_NUMBER(), N' : ', ERROR_MESSAGE());\n    THROW;\nEND CATCH;",
      expected: "Erreur 547 : The INSERT statement conflicted with the FOREIGN KEY constraint...\n\n(onglet « Messages » de SSMS)"
    },
    sqlnote: "TRY…CATCH, ERROR_NUMBER()/ERROR_MESSAGE() et THROW sont propres à SQL Server ; SQLite ne gère pas les erreurs ainsi — la capture se fait côté application (langage hôte).",
    checklist: [
      "L'INSERT risqué est dans BEGIN TRY … END TRY.",
      "Le CATCH affiche ERROR_NUMBER() et ERROR_MESSAGE().",
      "THROW; (sans argument) relance l'erreur d'origine.",
      "Le message est construit avec CONCAT."
    ],
    note: "TRY…CATCH évite qu'une erreur interrompe brutalement le batch : on la trace proprement (numéro + message), puis THROW sans argument la relance pour que l'application soit avertie. C'est le socle d'un code T-SQL robuste, indispensable avant d'aborder les transactions." }
  ]
};
</script>
