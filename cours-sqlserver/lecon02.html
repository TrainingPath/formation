<script>
var DAY = {
  num: 2,
  title: "Types de données et CREATE TABLE (IDENTITY)",
  subtitle: "Créer des tables SQL Server avec les bons types.",
  theory: `
<h3>1. Les types de données SQL Server</h3>
<p>Quand on crée une colonne, on doit annoncer à l'avance <strong>quelle sorte de valeur</strong> elle contiendra : un nombre entier, un prix, du texte, une date… C'est ce qu'on appelle son <strong>type de données</strong>. Le type est comme l'étiquette d'un bocal qui dit « ici, seulement du sucre » : il empêche de ranger n'importe quoi n'importe où et fait gagner de la place. Voici les types les plus courants (le <code>--</code> introduit un commentaire, du texte ignoré par la machine) :</p>
<pre class="pseudo">INT, BIGINT, SMALLINT     -- des nombres ENTIERS (sans virgule) ; BIGINT pour de très grands nombres, SMALLINT pour de petits
DECIMAL(p, s) / NUMERIC   -- un nombre à virgule EXACT (idéal pour l'argent) : DECIMAL(6,2) = 6 chiffres au total dont 2 après la virgule
MONEY                     -- un type « monnaie » spécial, mais moins précis : on lui préfère DECIMAL
VARCHAR(n) / CHAR(n)      -- du texte simple (alphabet latin de base) ; n = longueur maximale en caractères
NVARCHAR(n) / NCHAR(n)    -- du texte UNICODE : gère les accents et tous les alphabets (le N veut dire « National »)
DATE, TIME, DATETIME2     -- une date, une heure, ou les deux ; DATETIME2 remplace l'ancien DATETIME
BIT                       -- un booléen, c'est-à-dire vrai/faux, stocké en 0 ou 1</pre>
<div class="tip">Préfère <code>NVARCHAR</code> à <code>VARCHAR</code> dès qu'il peut y avoir des accents ou des caractères non latins : le N (National) stocke de l'Unicode. Les littéraux Unicode s'écrivent <code>N'texte'</code>.</div>

<h3>2. CREATE TABLE</h3>
<p>Créer une table, c'est dessiner le squelette d'un tableau : on liste ses colonnes avec, pour chacune, un nom et un type. Le mot-clé <strong>PRIMARY KEY</strong> (clé primaire) désigne la colonne qui identifie chaque ligne de façon unique — comme le numéro de sécurité sociale identifie une personne. Le mot-clé <strong>NOT NULL</strong> interdit de laisser la case vide (<strong>NULL</strong> = « absence de valeur »).</p>
<pre class="pseudo">CREATE TABLE CATEGORIE (   -- CREATE TABLE = « fabrique une table » ; CATEGORIE = son nom ; la parenthèse ouvre la liste des colonnes
  idCategorie INT PRIMARY KEY,   -- colonne idCategorie de type entier ; PRIMARY KEY = c'est l'identifiant unique de chaque ligne
  libelle     NVARCHAR(60) NOT NULL   -- colonne libelle : texte Unicode jusqu'à 60 caractères ; NOT NULL = jamais vide
);   -- la parenthèse ferme la liste ; le ; termine l'ordre CREATE TABLE</pre>

<h3>3. La clé auto-incrémentée : IDENTITY</h3>
<p>Souvent on ne veut pas taper soi-même l'identifiant de chaque ligne : on demande à SQL Server de le générer automatiquement. C'est le rôle d'<strong>IDENTITY</strong>. <code>IDENTITY(valeur_initiale, pas)</code> signifie « commence à cette valeur, puis ajoute ce pas à chaque nouvelle ligne ». <code>IDENTITY(1,1)</code> commence donc à 1 et augmente de 1 (1, 2, 3, 4…), comme un distributeur de tickets à la boulangerie. On l'associe presque toujours à la clé primaire.</p>
<pre class="pseudo">CREATE TABLE JEU (   -- création de la table JEU
  idJeu         INT IDENTITY(1,1) PRIMARY KEY,   -- identifiant entier généré tout seul (1, 2, 3…) et clé primaire
  titre         NVARCHAR(120) NOT NULL,   -- le titre du jeu : texte Unicode, obligatoire
  prixLocation  DECIMAL(6,2)  NOT NULL,   -- le prix de location : nombre exact à 2 décimales, obligatoire
  idCategorie   INT NOT NULL   -- l'entier qui dira à quelle catégorie appartient le jeu (obligatoire)
);   -- fin de la définition de la table</pre>

<h3>4. Contraintes nommées</h3>
<p>Une <strong>contrainte</strong> est une règle que la table refuse d'enfreindre (ex. « ce prix ne doit jamais être négatif »). En T-SQL, on aime leur donner un nom avec le mot-clé <strong>CONSTRAINT</strong> : les messages d'erreur deviennent plus clairs et on peut supprimer précisément la bonne règle plus tard. Une <strong>FOREIGN KEY</strong> (clé étrangère) est une colonne qui pointe vers la clé primaire d'une autre table, créant un lien fiable entre elles. Un <strong>CHECK</strong> vérifie une condition à chaque écriture.</p>
<pre class="pseudo">CREATE TABLE JEU (   -- on recrée JEU en nommant chaque contrainte
  idJeu        INT IDENTITY(1,1),   -- identifiant auto-généré
  titre        NVARCHAR(120) NOT NULL,   -- titre obligatoire
  prixLocation DECIMAL(6,2)  NOT NULL,   -- prix exact obligatoire
  idCategorie  INT NOT NULL,   -- référence obligatoire vers une catégorie
  CONSTRAINT pk_jeu PRIMARY KEY (idJeu),   -- contrainte nommée pk_jeu : idJeu est la clé primaire
  CONSTRAINT fk_jeu_cat FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie),   -- fk_jeu_cat : idCategorie doit exister dans CATEGORIE
  CONSTRAINT chk_prix CHECK (prixLocation >= 0)   -- chk_prix : refuse tout prix inférieur à 0
);   -- fin de la table avec ses règles</pre>

<h3>5. Supprimer une table (proprement)</h3>
<p><strong>DROP TABLE</strong> détruit une table entière (structure et données). Attention, l'action est définitive.</p>
<pre class="pseudo">DROP TABLE JEU;                 -- supprime la table JEU ; provoque une ERREUR si elle n'existe pas
DROP TABLE IF EXISTS JEU;       -- SQL Server 2016+ : IF EXISTS = « seulement si elle existe » ; aucune erreur si absente</pre>
<div class="warn">Une table référencée par une clé étrangère ne peut pas être supprimée tant que la contrainte existe. On supprime d'abord la table « fille » (ou la contrainte), puis la « parente ».</div>`,
  exercises: [
    { type: "qcm", q: "Le type d'un prix exact en SQL Server :", opts: ["FLOAT", "DECIMAL(p, s)", "NVARCHAR", "BIT"], a: 1, exp: "DECIMAL exact ; MONEY est moins précis." },
    { type: "qcm", q: "Pour du texte avec accents, on préfère…", opts: ["VARCHAR", "NVARCHAR (Unicode)", "CHAR", "TEXT"], a: 1, exp: "N = National = Unicode." },
    { type: "qcm", q: "Un littéral Unicode s'écrit…", opts: ["'texte'", "N'texte'", "U'texte'", "\"texte\""], a: 1, exp: "Préfixe N." },
    { type: "qcm", q: "Le type booléen en SQL Server :", opts: ["BOOLEAN", "BIT (0 ou 1)", "TINYINT obligatoire", "BOOL"], a: 1, exp: "BIT." },
    { type: "qcm", q: "Pour date + heure, on privilégie…", opts: ["DATETIME (ancien)", "DATETIME2", "TIMESTAMP", "MONEY"], a: 1, exp: "DATETIME2 plus précis et recommandé." },
    { type: "qcm", q: "IDENTITY(1,1) signifie…", opts: ["Une seule ligne", "Commence à 1, s'incrémente de 1", "Clé étrangère", "Un index"], a: 1, exp: "Auto-incrément par pas de 1." },
    { type: "qcm", q: "IDENTITY est l'équivalent SQL Server de…", opts: ["AUTO_INCREMENT (MySQL)", "GROUP BY", "TOP", "GETDATE"], a: 0, exp: "Clé auto-incrémentée." },
    { type: "qcm", q: "Nommer une contrainte se fait avec…", opts: ["NAME", "CONSTRAINT nom ...", "ALIAS", "LABEL"], a: 1, exp: "CONSTRAINT pk_jeu PRIMARY KEY (...)." },
    { type: "qcm", q: "Créer une table :", opts: ["MAKE TABLE", "CREATE TABLE nom (...)", "NEW TABLE", "ADD TABLE"], a: 1, exp: "CREATE TABLE." },
    { type: "qcm", q: "DROP TABLE IF EXISTS JEU; …", opts: ["Provoque une erreur si absente", "Supprime la table sans erreur si elle n'existe pas", "Vide la table", "Crée la table"], a: 1, exp: "IF EXISTS évite l'erreur." },
    { type: "vf", q: "MONEY existe mais on préfère DECIMAL pour la précision.", a: true, exp: "DECIMAL est exact et portable." },
    { type: "qcm", q: "Une table référencée par une FK…", opts: ["Se supprime librement", "Ne peut pas être supprimée tant que la contrainte existe", "Se vide seule", "Devient une vue"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "CONSTRAINT chk_prix CHECK (prixLocation >= 0) empêche…", opts: ["Un doublon", "Un prix négatif", "Un NULL", "Un index"], a: 1, exp: "Contrainte de domaine." },
    { type: "vf", q: "IDENTITY se combine avec PRIMARY KEY pour une clé technique auto-générée.", a: true, exp: "Clé primaire auto-incrémentée." },
    { type: "qcm", q: "NVARCHAR(120) autorise…", opts: ["120 lignes", "Jusqu'à 120 caractères Unicode", "120 octets fixes", "120 mots"], a: 1, exp: "Texte variable Unicode." }
  ],
  final: {
    title: "Exercice final — Créer CATEGORIE et JEU",
    intro: `<p>On crée les deux tables de base, avec une clé auto-incrémentée pour JEU.</p>`,
    questions: [
      { type: "qcm", q: "idCategorie (clé technique fixe donnée) :", opts: ["INT IDENTITY", "INT PRIMARY KEY", "NVARCHAR", "BIT"], a: 1, exp: "Entier clé primaire." },
      { type: "qcm", q: "libelle avec accents :", opts: ["VARCHAR(60)", "NVARCHAR(60) NOT NULL", "CHAR(60)", "TEXT"], a: 1, exp: "NVARCHAR pour l'Unicode." },
      { type: "qcm", q: "idJeu auto-généré :", opts: ["INT AUTO_INCREMENT", "INT IDENTITY(1,1) PRIMARY KEY", "SERIAL", "BIGINT SEQUENCE"], a: 1, exp: "IDENTITY en T-SQL." },
      { type: "qcm", q: "Relier JEU à CATEGORIE :", opts: ["Un index sur idCategorie", "FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)", "Une contrainte CHECK", "Une simple colonne idCategorie INT"], a: 1, exp: "Clé étrangère." },
      { type: "vf", q: "On crée CATEGORIE avant JEU (la FK doit cibler une table existante).", a: true, exp: "Ordre de création." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE CATEGORIE (   -- on crée d'abord la table « parente » CATEGORIE
  idCategorie INT PRIMARY KEY,   -- identifiant entier, clé primaire
  libelle     NVARCHAR(60) NOT NULL   -- nom de la catégorie, Unicode, obligatoire
);

CREATE TABLE JEU (   -- puis la table « fille » JEU qui pointera vers CATEGORIE
  idJeu         INT IDENTITY(1,1) PRIMARY KEY,   -- identifiant auto-généré, clé primaire
  titre         NVARCHAR(120) NOT NULL,   -- titre obligatoire
  prixAchat     DECIMAL(6,2)  NOT NULL,   -- prix d'achat exact, obligatoire
  prixLocation  DECIMAL(6,2)  NOT NULL CHECK (prixLocation >= 0),   -- prix de location obligatoire, jamais négatif
  stockVente    INT NOT NULL DEFAULT 0,   -- stock à la vente ; DEFAULT 0 = vaut 0 si on ne précise rien
  stockLocation INT NOT NULL DEFAULT 0,   -- stock en location ; défaut 0 également
  idCategorie   INT NOT NULL,   -- référence obligatoire vers une catégorie
  CONSTRAINT fk_jeu_cat FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)   -- lie idCategorie à la clé de CATEGORIE
);</pre>
<p>Tes tables SQL Server sont prêtes. Demain : les remplir et récupérer l'IDENTITY.</p>`
  }
};
</script>
