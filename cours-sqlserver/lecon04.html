<script>
var DAY = {
  num: 4,
  title: "SELECT, TOP et alias",
  subtitle: "Projeter, renommer, limiter — à la mode SQL Server.",
  theory: `
<h3>1. SELECT et projection</h3>
<p><strong>SELECT</strong> (« sélectionner ») est l'ordre pour <em>lire</em> des données : on lui donne la liste des colonnes voulues, puis <strong>FROM</strong> (« depuis ») suivi de la table. Choisir quelles colonnes afficher s'appelle la <strong>projection</strong> (on projette une partie du tableau, comme on braque une lampe sur certaines colonnes seulement). L'<strong>étoile</strong> <code>*</code> est un raccourci qui veut dire « toutes les colonnes ».</p>
<pre class="pseudo">SELECT titre, prixLocation FROM JEU;   -- affiche seulement 2 colonnes (titre, prixLocation) de la table JEU
SELECT * FROM JEU;   -- l'étoile * = toutes les colonnes de JEU sans exception</pre>

<h3>2. TOP : limiter le nombre de lignes</h3>
<p>Pour n'afficher qu'une partie des lignes, SQL Server utilise <strong>TOP n</strong> (placé juste après SELECT), là où d'autres SGBD écrivent LIMIT. <strong>PERCENT</strong> demande un pourcentage plutôt qu'un nombre fixe.</p>
<pre class="pseudo">SELECT TOP 5 titre FROM JEU;               -- TOP 5 = garde seulement les 5 premières lignes
SELECT TOP 10 PERCENT titre FROM JEU;      -- PERCENT = 10 % de toutes les lignes (proportion, pas nombre fixe)
SELECT TOP 3 titre FROM JEU ORDER BY prixLocation DESC;  -- TOP 3 + tri décroissant = les 3 jeux les plus chers</pre>
<div class="tip"><code>TOP</code> sans <code>ORDER BY</code> renvoie « n lignes quelconques » : pour un vrai « top », toujours associer un ORDER BY. <code>TOP n WITH TIES</code> inclut les ex æquo de la dernière place.</div>

<h3>3. Les alias (AS)</h3>
<p>Un <strong>alias</strong> est un nom de rechange, temporaire, donné à une colonne ou à une table le temps de la requête — comme un surnom. On l'introduit avec le mot-clé <strong>AS</strong>. Un alias de colonne change juste le titre affiché ; un alias de table permet de la désigner en abrégé (utile quand on écrit beaucoup).</p>
<pre class="pseudo">SELECT titre AS Jeu, prixLocation AS Tarif FROM JEU;   -- AS renomme l'affichage : « titre » devient « Jeu », « prixLocation » devient « Tarif »
-- alias de table   -- commentaire : on va donner un surnom à la table
SELECT j.titre FROM JEU AS j;   -- JEU AS j = la table JEU surnommée j ; on écrit alors j.titre (la colonne titre de j)</pre>

<h3>4. Colonnes calculées et concaténation</h3>
<p>Une <strong>colonne calculée</strong> est une valeur obtenue par un calcul au moment de l'affichage (elle n'existe pas telle quelle dans la table). <strong>Concaténer</strong>, c'est coller des textes bout à bout. En T-SQL, on concatène avec <code>+</code> (attention aux NULL et aux types) ou, plus sûrement, avec la fonction <strong>CONCAT</strong>.</p>
<pre class="pseudo">SELECT titre, prixLocation * 1.2 AS ttc FROM JEU;   -- prixLocation * 1.2 = colonne calculée (prix + 20 %), affichée sous le nom ttc

SELECT CONCAT(titre, ' - ', prixLocation, ' EUR') AS fiche FROM JEU;   -- CONCAT colle titre, un tiret, le prix et « EUR » en une seule chaîne nommée « fiche »
-- CONCAT gère les NULL (les traite comme '') et convertit les types   -- avantage : pas de plantage sur une valeur vide ni sur un nombre</pre>

<h3>5. DISTINCT</h3>
<p><strong>DISTINCT</strong> (« distinct ») supprime les doublons du résultat : chaque valeur n'apparaît qu'une fois.</p>
<pre class="pseudo">SELECT DISTINCT idCategorie FROM JEU;   -- DISTINCT = liste les catégories utilisées SANS répéter deux fois la même</pre>
<div class="warn">Avec <code>+</code>, concaténer un texte et un nombre exige souvent un <code>CAST</code> : <code>titre + ' - ' + CAST(prixLocation AS NVARCHAR)</code>. La fonction <code>CONCAT</code> évite ce souci en convertissant automatiquement.</div>`,
  exercises: [
    { type: "qcm", q: "Limiter à 5 lignes en T-SQL :", opts: ["LIMIT 5", "SELECT TOP 5 ...", "FETCH 5", "ROWNUM 5"], a: 1, exp: "TOP après SELECT." },
    { type: "qcm", q: "TOP se place…", opts: ["À la fin", "Juste après SELECT", "Après FROM", "Après WHERE"], a: 1, exp: "SELECT TOP n ..." },
    { type: "qcm", q: "TOP sans ORDER BY renvoie…", opts: ["Les plus grands", "n lignes quelconques (non fiable pour un top)", "Une erreur", "0 ligne"], a: 1, exp: "Il faut un ORDER BY." },
    { type: "qcm", q: "TOP 10 PERCENT renvoie…", opts: ["Exactement 10 lignes", "10 % des lignes", "La 10e ligne uniquement", "Les 10 dernières lignes"], a: 1, exp: "Pourcentage des lignes." },
    { type: "qcm", q: "WITH TIES (après TOP n ORDER BY) …", opts: ["Trie deux fois", "Inclut les ex æquo de la dernière place", "Supprime les doublons", "Limite à 1"], a: 1, exp: "Gère les égalités." },
    { type: "qcm", q: "Un alias de colonne :", opts: ["titre = Jeu", "titre AS Jeu", "ALIAS titre Jeu", "titre -> Jeu"], a: 1, exp: "colonne AS alias." },
    { type: "qcm", q: "Concaténer sûrement en T-SQL :", opts: ["ADD()", "CONCAT(a, b, c)", "MERGE(a, b)", "JOIN(a, b)"], a: 1, exp: "CONCAT gère NULL et types." },
    { type: "qcm", q: "Avec l'opérateur +, concaténer texte et nombre exige souvent…", opts: ["Rien", "Un CAST du nombre en texte", "Un GROUP BY", "Un index"], a: 1, exp: "CAST(prix AS NVARCHAR)." },
    { type: "qcm", q: "CONCAT et les NULL :", opts: ["Renvoie NULL", "Traite NULL comme chaîne vide", "Provoque une erreur", "Ignore la ligne"], a: 1, exp: "CONCAT est tolérant aux NULL." },
    { type: "qcm", q: "DISTINCT idCategorie renvoie…", opts: ["Tous avec doublons", "Les catégories distinctes utilisées", "Les titres", "Le nombre"], a: 1, exp: "Déduplication." },
    { type: "vf", q: "SELECT * prend toutes les colonnes en T-SQL aussi.", a: true, exp: "Comme partout." },
    { type: "qcm", q: "Les 3 jeux les plus chers :", opts: ["TOP 3 ... ORDER BY prixLocation DESC", "LIMIT 3", "TOP 3 sans tri", "MAX 3"], a: 0, exp: "TOP + tri décroissant." },
    { type: "qcm", q: "Un alias de table :", opts: ["JEU AS j", "TABLE j", "ALIAS JEU", "j = JEU"], a: 0, exp: "FROM JEU AS j." },
    { type: "vf", q: "prixLocation * 1.2 est une colonne calculée affichée, sans modifier la table.", a: true, exp: "SELECT lit seulement." },
    { type: "qcm", q: "Pour un « top N » fiable, il faut…", opts: ["Rien", "Associer TOP à un ORDER BY", "Un GROUP BY", "Un DISTINCT"], a: 1, exp: "Le tri donne du sens au top." }
  ],
  final: {
    title: "Exercice final — Vitrine T-SQL",
    intro: `<p>Table JEU(idJeu, titre, prixAchat, prixLocation, idCategorie).</p>`,
    questions: [
      { type: "qcm", q: "Les 2 jeux les moins chers à louer :", opts: ["TOP 2 ... ORDER BY prixLocation", "LIMIT 2", "TOP 2 sans tri", "MIN 2"], a: 0, exp: "TOP 2 + tri croissant." },
      { type: "qcm", q: "Renommer prixLocation en Tarif :", opts: ["prixLocation Tarif", "prixLocation AS Tarif", "AS Tarif", "Tarif = prixLocation"], a: 1, exp: "colonne AS alias." },
      { type: "qcm", q: "Une fiche « Titre - Prix EUR » sûre :", opts: ["titre + prix", "CONCAT(titre, ' - ', prixLocation, ' EUR')", "titre AND prix", "MERGE"], a: 1, exp: "CONCAT convertit les types." },
      { type: "qcm", q: "Lister les catégories utilisées sans doublon :", opts: ["SELECT idCategorie", "SELECT DISTINCT idCategorie", "TOP idCategorie", "GROUP idCategorie"], a: 1, exp: "DISTINCT." },
      { type: "vf", q: "TOP 3 sans ORDER BY ne garantit pas « les 3 plus chers ».", a: true, exp: "Sans tri, lignes arbitraires." }
    ],
    solution: `<pre class="pseudo">SELECT TOP 2 titre AS Jeu, prixLocation AS Tarif   -- 2 lignes ; titre affiché « Jeu », prix affiché « Tarif »
FROM JEU   -- ... depuis la table JEU
ORDER BY prixLocation;   -- tri croissant (par défaut) : les 2 moins chers

SELECT CONCAT(titre, ' - ', prixLocation, ' EUR') AS fiche   -- colle titre + tiret + prix + « EUR » sous le nom fiche
FROM JEU;   -- pour chaque jeu de la table

SELECT DISTINCT idCategorie FROM JEU;   -- la liste des catégories utilisées, sans doublon</pre>
<p>Tu façonnes l'affichage T-SQL. Demain : filtrer avec WHERE.</p>`
  }
};
</script>
