<script>
var DAY = {
  num: 10,
  title: "Sous-requêtes et CTE (WITH)",
  subtitle: "Une requête dans la requête, et les tables temporaires nommées.",
  theory: `
<h3>1. Sous-requête dans le WHERE</h3>
<p>Une <strong>sous-requête</strong> est une requête placée à l'intérieur d'une autre, entre parenthèses. Elle calcule d'abord son résultat, que la requête « externe » utilise ensuite. Ici, la sous-requête calcule le prix moyen, et la requête externe s'en sert pour ne garder que les jeux plus chers.</p>
<pre class="pseudo">-- les jeux plus chers que la moyenne   -- objectif de la requête
SELECT titre, prixLocation   -- afficher titre et prix
FROM JEU   -- table source
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);   -- comparer chaque prix à la valeur calculée par la sous-requête (la moyenne)</pre>
<p>La sous-requête renvoie une valeur, utilisée par la requête externe.</p>

<h3>2. Sous-requête avec IN</h3>
<p>Une sous-requête peut renvoyer une <em>liste</em> de valeurs ; on la teste alors avec <strong>IN</strong> (appartenance à cette liste).</p>
<pre class="pseudo">-- jeux appartenant à une catégorie « famille »   -- but : filtrer par nom de catégorie
SELECT titre FROM JEU   -- afficher le titre des jeux
WHERE idCategorie IN (SELECT idCategorie FROM CATEGORIE WHERE libelle LIKE N'Famille%');   -- IN = garde les jeux dont idCategorie figure dans la liste des catégories « Famille... »</pre>

<h3>3. EXISTS</h3>
<p><strong>EXISTS</strong> (« il existe ») ne regarde pas une valeur mais répond juste à « y a-t-il au moins une ligne ? ». C'est une sous-requête <strong>corrélée</strong> : elle dépend de la ligne en cours d'examen (via <code>l.idJeu = j.idJeu</code>).</p>
<pre class="pseudo">-- jeux qui ont déjà été loués au moins une fois   -- but de la requête
SELECT titre FROM JEU AS j   -- pour chaque jeu j
WHERE EXISTS (SELECT 1 FROM LOUER AS l WHERE l.idJeu = j.idJeu);   -- EXISTS = vrai s'il existe au moins une location de CE jeu ; le SELECT 1 est symbolique</pre>
<p><code>EXISTS</code> teste la présence d'au moins une ligne : souvent plus efficace qu'un IN sur de gros volumes.</p>

<h3>4. La CTE : WITH ... AS</h3>
<p>Une <strong>CTE</strong> (Common Table Expression, « expression de table commune ») est une sous-requête à laquelle on donne un nom, déclarée AVANT la requête principale avec le mot-clé <strong>WITH</strong>. On peut ensuite s'en servir comme d'une table temporaire. Cela rend le code lisible, en étapes.</p>
<pre class="pseudo">WITH stats AS (   -- WITH stats AS (...) : on nomme « stats » la sous-requête qui suit
    SELECT idCategorie, AVG(prixLocation) AS moyenne   -- pour chaque catégorie, sa moyenne de prix
    FROM JEU   -- ... calculée sur JEU
    GROUP BY idCategorie   -- un résultat par catégorie
)   -- fin de la définition de la CTE stats
SELECT c.libelle, s.moyenne   -- requête principale : le nom de la catégorie et sa moyenne
FROM stats AS s   -- on lit la CTE comme une table, surnommée s
INNER JOIN CATEGORIE AS c ON c.idCategorie = s.idCategorie;   -- on la joint à CATEGORIE pour récupérer le libellé</pre>

<h3>5. CTE vs sous-requête</h3>
<p>La CTE se lit de haut en bas (comme une étape), peut être réutilisée plusieurs fois dans la requête, et se prête à la <strong>récursivité</strong> (une requête qui s'appelle elle-même, via <code>WITH ... UNION ALL</code>). Une sous-requête imbriquée est plus compacte pour un cas unique.</p>
<div class="tip">La CTE n'existe que le temps de la requête qui la suit : ce n'est pas une table stockée. Un point-virgule est recommandé avant <code>WITH</code> si l'instruction précédente n'en a pas.</div>`,
  exercises: [
    { type: "qcm", q: "Une sous-requête est…", opts: ["Un index", "Une requête à l'intérieur d'une autre", "Un tri", "Une table permanente"], a: 1, exp: "Requête imbriquée." },
    { type: "qcm", q: "Jeux plus chers que la moyenne :", opts: ["WHERE prix > AVG(prix)", "WHERE prix > (SELECT AVG(prixLocation) FROM JEU)", "HAVING AVG", "TOP moyenne"], a: 1, exp: "Sous-requête scalaire." },
    { type: "qcm", q: "IN (SELECT ...) teste…", opts: ["Un tri", "L'appartenance au résultat de la sous-requête", "Une somme", "Un index"], a: 1, exp: "Appartenance à un ensemble." },
    { type: "qcm", q: "EXISTS teste…", opts: ["Une valeur exacte", "La présence d'au moins une ligne", "Le nombre de colonnes", "Un tri"], a: 1, exp: "Existence de lignes." },
    { type: "qcm", q: "EXISTS (SELECT 1 ...) : le « 1 » …", opts: ["Compte les lignes", "Est arbitraire, seul compte qu'il y ait une ligne", "Trie", "Additionne"], a: 1, exp: "La valeur importe peu." },
    { type: "qcm", q: "Une CTE se déclare avec…", opts: ["DECLARE", "WITH nom AS (...)", "CREATE TEMP", "SET"], a: 1, exp: "WITH ... AS." },
    { type: "qcm", q: "Une CTE existe…", opts: ["De façon permanente", "Le temps de la requête qui la suit", "Toute la session", "Jamais"], a: 1, exp: "Portée limitée à la requête." },
    { type: "qcm", q: "Un avantage de la CTE :", opts: ["Elle est stockée", "Elle rend le code lisible et réutilisable dans la requête", "Elle trie", "Elle indexe"], a: 1, exp: "Lisibilité." },
    { type: "qcm", q: "La récursivité en T-SQL utilise…", opts: ["Une boucle FOR", "Une CTE récursive (WITH ... UNION ALL)", "Un TOP", "Un index"], a: 1, exp: "CTE récursive." },
    { type: "qcm", q: "EXISTS est souvent préférable à IN quand…", opts: ["Il y a peu de données", "Les volumes sont gros (test de présence)", "On trie", "On compte"], a: 1, exp: "Performance sur gros volumes." },
    { type: "vf", q: "Une CTE n'est pas une table stockée en base.", a: true, exp: "Elle est temporaire." },
    { type: "qcm", q: "Corréler une sous-requête (l.idJeu = j.idJeu) signifie…", opts: ["Elle est indépendante", "Elle dépend de la ligne courante de la requête externe", "Elle trie", "Elle est fausse"], a: 1, exp: "Sous-requête corrélée." },
    { type: "vf", q: "On peut réutiliser une même CTE plusieurs fois dans la requête qui la suit.", a: true, exp: "Un atout des CTE." },
    { type: "qcm", q: "Catégories dont le libellé commence par « Famille » :", opts: ["JOIN obligatoire", "IN (SELECT idCategorie FROM CATEGORIE WHERE libelle LIKE N'Famille%')", "TOP", "HAVING"], a: 1, exp: "Sous-requête avec IN." },
    { type: "qcm", q: "Un point-virgule avant WITH…", opts: ["Est interdit", "Est recommandé pour délimiter l'instruction", "Trie", "Crée un index"], a: 1, exp: "Bonne pratique T-SQL." }
  ],
  final: {
    title: "Exercice final — Requêtes imbriquées",
    intro: `<p>JEU(idJeu, titre, prixLocation, idCategorie), LOUER(idJeu, idClient), CATEGORIE(idCategorie, libelle).</p>`,
    questions: [
      { type: "qcm", q: "Jeux au-dessus du prix moyen :", opts: ["WHERE prixLocation > (SELECT AVG(prixLocation) FROM JEU)", "HAVING AVG", "TOP moyenne", "GROUP BY"], a: 0, exp: "Sous-requête scalaire." },
      { type: "qcm", q: "Jeux déjà loués au moins une fois :", opts: ["WHERE EXISTS (SELECT 1 FROM LOUER l WHERE l.idJeu = j.idJeu)", "COUNT(*)", "TOP", "GROUP BY"], a: 0, exp: "EXISTS corrélé." },
      { type: "qcm", q: "Moyenne par catégorie via une CTE :", opts: ["WITH stats AS (SELECT idCategorie, AVG(prixLocation)... GROUP BY idCategorie)", "DECLARE stats", "TEMP stats", "SET stats"], a: 0, exp: "WITH ... AS." },
      { type: "qcm", q: "Une CTE se lit…", opts: ["De bas en haut", "Comme une étape nommée avant la requête principale", "En parallèle", "Après le ORDER BY"], a: 1, exp: "Étape lisible." },
      { type: "vf", q: "EXISTS peut être plus efficace que IN sur de gros volumes.", a: true, exp: "Test de présence." }
    ],
    solution: `<pre class="pseudo">-- au-dessus de la moyenne   -- première requête : sous-requête scalaire
SELECT titre FROM JEU   -- afficher les titres
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);   -- ... dont le prix dépasse la moyenne calculée

-- moyenne par catégorie, lisible via une CTE   -- seconde requête : version CTE
WITH stats AS (   -- on nomme « stats » l'étape de calcul
  SELECT idCategorie, AVG(prixLocation) AS moyenne   -- moyenne par catégorie
  FROM JEU GROUP BY idCategorie   -- un résultat par catégorie
)
SELECT c.libelle, s.moyenne   -- libellé de la catégorie et sa moyenne
FROM stats s JOIN CATEGORIE c ON c.idCategorie = s.idCategorie;   -- joindre la CTE à CATEGORIE</pre>
<p>Tu structures des requêtes complexes. Demain : les fonctions de fenêtrage.</p>`
  }
};
