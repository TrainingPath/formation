  title: "Les déclencheurs (TRIGGER)",
  subtitle: "Réagir automatiquement à une modification des données.",
  theory: `
<h3>1. Qu'est-ce qu'un trigger ?</h3>
<p>Un <strong>déclencheur</strong> (en anglais <strong>trigger</strong>, « gâchette ») est un bloc de code qui s'exécute TOUT SEUL quand un <code>INSERT</code>, un <code>UPDATE</code> ou un <code>DELETE</code> se produit sur une table. On ne l'appelle jamais soi-même : c'est l'événement (l'écriture) qui le déclenche, comme un détecteur de mouvement qui allume la lumière dès que quelqu'un passe.</p>

<h3>2. Les tables spéciales inserted et deleted</h3>
<p>Pendant l'exécution du trigger, SQL Server fournit deux tables temporaires automatiques qui contiennent les lignes concernées :</p>
<pre class="pseudo">inserted   -- contient les NOUVELLES lignes (celles ajoutées par un INSERT, ou la version « après » d'un UPDATE)
deleted    -- contient les ANCIENNES lignes (celles retirées par un DELETE, ou la version « avant » d'un UPDATE)</pre>
<p>Un UPDATE remplit les deux : <code>deleted</code> = avant, <code>inserted</code> = après.</p>

<h3>3. Un trigger AFTER (journalisation)</h3>
<p><strong>AFTER INSERT</strong> signifie « après une insertion réussie ». <strong>Journaliser</strong>, c'est garder une trace des actions dans une table d'historique.</p>
<pre class="pseudo">CREATE TRIGGER trg_Louer_Log   -- crée un déclencheur nommé trg_Louer_Log
ON LOUER   -- attaché à la table LOUER
AFTER INSERT   -- il s'exécute APRÈS chaque insertion dans LOUER
AS
BEGIN   -- début du corps du trigger
    SET NOCOUNT ON;   -- pas de message « n lignes affectées »
    INSERT INTO JOURNAL (action, idJeu, quand)   -- écrit une trace dans la table JOURNAL
    SELECT N'location', idJeu, GETDATE() FROM inserted;   -- pour chaque ligne insérée : le mot « location », l'idJeu, l'instant présent
END;   -- fin du trigger</pre>
<p>Après chaque insertion dans LOUER, une trace est ajoutée dans JOURNAL — automatiquement.</p>

<h3>4. Maintenir une cohérence (décrémenter le stock)</h3>
<p>Un trigger peut aussi maintenir des données à jour : ici, baisser le stock à chaque location.</p>
<pre class="pseudo">CREATE TRIGGER trg_Louer_Stock   -- déclencheur de mise à jour du stock
ON LOUER   -- sur la table LOUER
AFTER INSERT   -- après chaque location insérée
AS
BEGIN
    SET NOCOUNT ON;   -- silence le compteur de lignes
    UPDATE JEU   -- on va modifier la table JEU
    SET stockLocation = stockLocation - 1   -- baisser son stock de 1
    FROM JEU
    INNER JOIN inserted i ON JEU.idJeu = i.idJeu;   -- ... pour les jeux qui figurent dans inserted (ceux qu'on vient de louer)
END;</pre>
<div class="warn">Un trigger opère par LOT : <code>inserted</code> peut contenir plusieurs lignes. Il faut raisonner en ensemble (jointure sur inserted), jamais supposer une seule ligne.</div>

<h3>5. INSTEAD OF et bonnes pratiques</h3>
<p>Un trigger <strong>INSTEAD OF</strong> (« à la place de ») remplace carrément l'opération d'origine au lieu de s'ajouter après (utile sur les vues). Les triggers sont puissants mais peuvent masquer la logique : à utiliser pour l'audit et l'intégrité, avec un code court et sûr. <strong>DISABLE</strong> désactive, <strong>DROP</strong> supprime.</p>
<pre class="pseudo">DISABLE TRIGGER trg_Louer_Log ON LOUER;   -- désactiver   -- le met en pause sans le supprimer
DROP TRIGGER trg_Louer_Log;               -- supprimer   -- le retire définitivement</pre>`,

  ],

      { type: "vf", q: "Un trigger AFTER INSERT s'exécute sans qu'on l'appelle explicitement.", a: true, exp: "Automatique." }
    ],
    solution: `<pre class="pseudo">CREATE TRIGGER trg_Louer_Log   -- déclencheur de journalisation
ON LOUER   -- sur la table LOUER

    SET NOCOUNT ON;   -- pas de message de comptage

END;</pre>
<p>Ta base réagit toute seule. Demain : MERGE et opérations d'ensemble.</p>`
