<h3>1. Qu'est-ce que SQL Server ? (et le mot T-SQL)</h3>
<p>Une <strong>base de données</strong> est un ensemble d'informations rangées de façon très organisée, un peu comme un immense classeur à tiroirs où chaque chose a une place précise. Un <strong>SGBD</strong> (Système de Gestion de Base de Données) est le <em>logiciel</em> qui garde ce classeur, le protège et répond à nos demandes — pense au bibliothécaire qui sait exactement où se trouve chaque livre. On dit qu'un SGBD est <strong>relationnel</strong> quand il range les données dans des <strong>tables</strong> : des tableaux à lignes et à colonnes, exactement comme une feuille de tableur. <strong>SQL Server</strong> est le SGBD relationnel fabriqué par la société Microsoft.</p>
<p>Pour donner des ordres à ce SGBD, on lui écrit dans un langage spécial : le <strong>SQL</strong> (Structured Query Language, « langage de requêtes structuré »). Une <strong>requête</strong> est justement une phrase-ordre qu'on envoie au SGBD : « affiche-moi ceci », « ajoute cela », « supprime cette ligne ». SQL Server parle une version enrichie du SQL appelée <strong>T-SQL</strong> (Transact-SQL) : c'est le SQL standard <strong>plus</strong> des outils supplémentaires (variables, procédures, gestion des erreurs). Bonne nouvelle : tout le SQL que tu connais déjà marche tel quel ; T-SQL ne fait qu'<em>ajouter</em> des possibilités.</p>
<p>Deux mots reviendront sans cesse. Une <strong>colonne</strong> est une catégorie d'information dans une table (le titre, le prix…), comme l'en-tête d'une colonne de tableur. Une <strong>ligne</strong> (ou enregistrement) est une fiche complète : un objet précis avec toutes ses infos réunies sur une même rangée.</p>

<h3>2. SSMS : l'outil de travail</h3>
<p>Pour dialoguer avec SQL Server, il faut un logiciel-outil. Le plus courant s'appelle <strong>SSMS</strong> (SQL Server Management Studio) : une fenêtre où l'on se connecte au serveur, où l'on voit les bases et leurs tables dans un panneau de gauche (comme un explorateur de fichiers), et où l'on tape ses requêtes dans une zone de texte avant de cliquer sur « Exécuter ». Une alternative plus moderne, qui fonctionne aussi sur Mac et Linux, est <strong>Azure Data Studio</strong>. Pour s'entraîner gratuitement à la maison, on installe <strong>SQL Server Express</strong> (gratuit).</p>
<p>Vocabulaire utile : un <strong>serveur</strong> (aussi appelé <strong>instance</strong>) est le programme SQL Server qui tourne en permanence et héberge tes bases ; « s'y connecter » revient à ouvrir la porte de l'entrepôt où sont rangés les classeurs.</p>

<h3>3. Éditions et bases système</h3>
<p>SQL Server existe en plusieurs <strong>éditions</strong> : des variantes plus ou moins puissantes et coûteuses. Par ailleurs, dès son installation, le moteur crée pour lui-même quelques <strong>bases système</strong> dont il a besoin pour fonctionner : on n'y touche jamais. Voici l'essentiel, puis les deux ordres pour créer et choisir SA propre base. Chaque ligne est expliquée après le <code>--</code> : deux tirets marquent un <strong>commentaire</strong> en SQL, c'est-à-dire du texte pour l'humain que la machine ignore complètement.</p>
<pre class="pseudo">Éditions : Express (gratuit), Developer (gratuit, complet), Standard, Enterprise   -- les 4 « versions » de SQL Server : Express et Developer sont gratuites, Standard et Enterprise payantes
Bases système : master, model, msdb, tempdb  (ne pas y toucher)   -- 4 bases que le moteur crée tout seul pour son propre fonctionnement : on ne les modifie JAMAIS
On crée SA base :  CREATE DATABASE ludotheque;   -- CREATE DATABASE = « fabrique une base vide » ; ludotheque = le nom qu'on lui donne ; le ; termine l'instruction
On la sélectionne : USE ludotheque;   -- USE = « à partir de maintenant, travaille dans cette base-là » (comme ouvrir le bon classeur)</pre>

<h3>4. Les spécificités T-SQL (aperçu du cours)</h3>
<p>Voici, en avant-goût, les mots-clés propres à T-SQL que ce cours va détailler. Ne cherche pas à tout retenir : c'est juste une carte du voyage. Un <strong>mot-clé</strong> est un mot réservé que le langage comprend comme un ordre.</p>
<pre class="pseudo">TOP n           -- limite le nombre de lignes affichées (là où d'autres SGBD écrivent LIMIT)
IDENTITY(1,1)   -- fabrique un numéro qui s'incrémente tout seul (là où MySQL écrit AUTO_INCREMENT)
GETDATE()       -- renvoie la date ET l'heure de l'instant présent
ISNULL(x, y)    -- si x est vide (NULL), renvoie y à la place (proche de COALESCE)
CAST / CONVERT  -- transforment une valeur d'un type vers un autre (ex. un texte en nombre)
@variable       -- une variable locale : une petite boîte pour ranger une valeur le temps d'un script
GO              -- sépare les « lots » (batches) : c'est un signal pour SSMS, PAS du T-SQL</pre>

<h3>5. Première requête et le lot GO</h3>
<p>Assemblons tout dans un premier script complet. Lis-le ligne par ligne grâce aux commentaires :</p>
<pre class="pseudo">USE ludotheque;   -- se placer dans la base ludotheque (toutes les requêtes qui suivent y travailleront)
GO   -- fin du premier lot : SSMS envoie et exécute ce qui précède avant de continuer
SELECT TOP 5 titre, prixLocation   -- SELECT = « affiche » ; TOP 5 = seulement les 5 premières lignes ; titre, prixLocation = les 2 colonnes voulues
FROM JEU   -- FROM = « depuis la table » ; JEU = la table où se trouvent les données
ORDER BY prixLocation DESC;   -- ORDER BY = trie le résultat ; prixLocation = selon cette colonne ; DESC = du plus grand au plus petit</pre>
<div class="tip"><code>GO</code> n'est pas du T-SQL : c'est un séparateur de « lot » propre à SSMS. Chaque bloc séparé par GO est envoyé et exécuté séparément. On l'emploie surtout après CREATE DATABASE, CREATE PROCEDURE, etc.</div>`,
