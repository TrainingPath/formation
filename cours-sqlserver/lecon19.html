var DAY = {
  num: 19,
  title: "MERGE et opérations d'ensemble",
  subtitle: "Fusionner des données et combiner des résultats.",
  theory: `
<h3>1. UNION, INTERSECT, EXCEPT</h3>
<p>Ces mots-clés combinent les résultats de DEUX requêtes empilées l'une sous l'autre (contrairement à une jointure qui les met côte à côte). <strong>UNION</strong> réunit les deux ensembles en supprimant les doublons.</p>
<pre class="pseudo">SELECT titre FROM JEU WHERE idCategorie = 1   -- 1re liste : les jeux de la catégorie 1
UNION   -- UNION = fusionne les deux listes en une seule, sans répéter les doublons
SELECT titre FROM JEU WHERE prixLocation &lt; 3;    -- réunion, sans doublon   -- 2e liste : les jeux à moins de 3</pre>
<pre class="pseudo">UNION ALL   -- réunit les deux listes MAIS en gardant les doublons (plus rapide, aucune déduplication)
INTERSECT   -- ne garde que les lignes présentes dans les DEUX listes (le commun)
EXCEPT      -- garde les lignes de la 1re liste qui NE sont PAS dans la 2e (la différence)</pre>
<p>Les deux SELECT doivent avoir le même nombre de colonnes, de types compatibles.</p>

<h3>2. Le besoin d'UPSERT</h3>
<p>Souvent on veut « mettre à jour la ligne si elle existe déjà, sinon la créer ». Cette opération à double visage porte un nom : un <strong>upsert</strong> (contraction de UPDATE + INSERT). T-SQL l'exprime avec l'instruction <code>MERGE</code>.</p>

<h3>3. MERGE</h3>
<p><strong>MERGE</strong> (« fusionner ») rapproche une table <strong>cible</strong> (celle qu'on modifie) d'une <strong>source</strong> (les données entrantes) selon une condition <strong>ON</strong>, puis agit différemment selon qu'une correspondance existe ou non.</p>
<pre class="pseudo">MERGE INTO STOCK AS cible   -- MERGE INTO = table à modifier (STOCK), surnommée cible
USING (SELECT @idJeu AS idJeu, @qte AS qte) AS source   -- USING = les données entrantes, surnommées source
ON cible.idJeu = source.idJeu   -- ON = comment relier cible et source (même idJeu ?)
WHEN MATCHED THEN   -- SI une ligne correspondante existe déjà dans la cible...
    UPDATE SET cible.quantite = cible.quantite + source.qte   -- ... on la met à jour (on ajoute la quantité reçue)
WHEN NOT MATCHED THEN   -- SINON (aucune correspondance)...
    INSERT (idJeu, quantite) VALUES (source.idJeu, source.qte);   -- ... on insère une nouvelle ligne ; le ; final est obligatoire</pre>
<p><code>WHEN MATCHED</code> = la ligne existe (on met à jour) ; <code>WHEN NOT MATCHED</code> = elle n'existe pas (on insère).</p>

<h3>4. MERGE avec suppression</h3>
<p>On peut aussi supprimer de la cible ce qui a disparu de la source.</p>
<pre class="pseudo">WHEN NOT MATCHED BY SOURCE THEN DELETE   -- présent dans la cible mais plus dans la source   -- BY SOURCE = les lignes de la cible sans équivalent dans la source sont supprimées</pre>
<p>Pratique pour synchroniser une table cible sur une source (import complet).</p>

<h3>5. Précautions</h3>
<div class="warn">Terminer le <code>MERGE</code> par un point-virgule est <strong>obligatoire</strong>. MERGE est puissant mais réputé délicat : pour un simple upsert d'une ligne, un <code>IF EXISTS ... UPDATE ... ELSE INSERT</code> dans une transaction reste une alternative lisible.</div>`,
  exercises: [
    { type: "qcm", q: "UNION combine deux résultats…", opts: ["Avec doublons", "Sans doublon (réunion)", "En colonnes", "En les multipliant"], a: 1, exp: "Réunion dédupliquée." },
    { type: "qcm", q: "UNION ALL …", opts: ["Supprime les doublons", "Garde les doublons (plus rapide)", "Trie", "Intersecte"], a: 1, exp: "Conserve tout." },
    { type: "qcm", q: "INTERSECT renvoie…", opts: ["Tout", "Les lignes communes aux deux", "La différence", "Les doublons"], a: 1, exp: "Intersection." },
    { type: "qcm", q: "EXCEPT renvoie…", opts: ["L'union", "Les lignes du 1er absentes du 2nd", "Le commun", "Rien"], a: 1, exp: "Différence." },
    { type: "qcm", q: "Pour combiner deux SELECT, il faut…", opts: ["Des colonnes différentes", "Le même nombre de colonnes, types compatibles", "Un JOIN", "Un index"], a: 1, exp: "Compatibilité des colonnes." },
    { type: "qcm", q: "Un « upsert » signifie…", opts: ["Supprimer", "Mettre à jour si présent, sinon insérer", "Trier", "Joindre"], a: 1, exp: "UPDATE ou INSERT." },
    { type: "qcm", q: "T-SQL exprime l'upsert avec…", opts: ["UNION", "MERGE", "TOP", "EXCEPT"], a: 1, exp: "MERGE." },
    { type: "qcm", q: "WHEN MATCHED dans un MERGE…", opts: ["La ligne n'existe pas", "La ligne existe (on met à jour)", "Trie", "Supprime la table"], a: 1, exp: "Correspondance trouvée." },
    { type: "qcm", q: "WHEN NOT MATCHED …", opts: ["Met à jour", "Insère (la ligne n'existe pas)", "Trie", "Rien"], a: 1, exp: "Pas de correspondance = INSERT." },
    { type: "qcm", q: "WHEN NOT MATCHED BY SOURCE THEN DELETE …", opts: ["Insère", "Supprime les lignes de la cible absentes de la source", "Trie", "Met NULL"], a: 1, exp: "Synchronisation." },
    { type: "vf", q: "Un MERGE doit se terminer par un point-virgule.", a: true, exp: "Obligatoire." },
    { type: "qcm", q: "Une alternative lisible au MERGE d'une ligne :", opts: ["UNION", "IF EXISTS ... UPDATE ... ELSE INSERT", "TOP", "TRUNCATE"], a: 1, exp: "Upsert manuel." },
    { type: "vf", q: "INTERSECT et EXCEPT éliminent aussi les doublons dans le résultat.", a: true, exp: "Comme UNION." },
    { type: "qcm", q: "UNION ALL est préféré quand…", opts: ["On veut dédupliquer", "On sait qu'il n'y a pas de doublon (perf)", "On trie", "On supprime"], a: 1, exp: "Plus rapide." },
    { type: "qcm", q: "MERGE agit sur…", opts: ["Une seule ligne toujours", "Une cible selon une source, par correspondance", "Un index", "Une vue seulement"], a: 1, exp: "Cible/source." }
  ],
  final: {
    title: "Exercice final — Fusionner un réassort",
    intro: `<p>On reçoit un réassort (idJeu, qte) et on veut mettre à jour le stock, en créant la ligne si besoin.</p>`,
    questions: [
      { type: "qcm", q: "L'opération « update sinon insert » est un…", opts: ["JOIN", "upsert (MERGE)", "UNION", "index"], a: 1, exp: "Upsert." },
      { type: "qcm", q: "Ligne déjà présente → …", opts: ["WHEN NOT MATCHED", "WHEN MATCHED THEN UPDATE", "DELETE", "UNION"], a: 1, exp: "Mise à jour." },
      { type: "qcm", q: "Ligne absente → …", opts: ["WHEN MATCHED", "WHEN NOT MATCHED THEN INSERT", "EXCEPT", "TOP"], a: 1, exp: "Insertion." },
      { type: "qcm", q: "Combiner deux listes de titres sans doublon :", opts: ["UNION", "UNION ALL", "JOIN", "MERGE"], a: 0, exp: "UNION." },
      { type: "vf", q: "Le MERGE doit se terminer par un point-virgule, sinon erreur.", a: true, exp: "Règle T-SQL." }
    ],
    solution: `<pre class="pseudo">MERGE INTO STOCK AS cible   -- table à mettre à jour : STOCK (cible)
USING (SELECT @idJeu AS idJeu, @qte AS qte) AS source   -- données reçues (source)
ON cible.idJeu = source.idJeu   -- correspondance sur idJeu
WHEN MATCHED THEN   -- la ligne existe déjà...
    UPDATE SET cible.quantite = cible.quantite + source.qte   -- ... ajouter la quantité reçue
WHEN NOT MATCHED THEN   -- la ligne n'existe pas...
    INSERT (idJeu, quantite) VALUES (source.idJeu, source.qte);   -- ... la créer ; ; obligatoire</pre>
<p>Tu synchronises tes données. Demain : le projet guidé, la Ludothèque en T-SQL.</p>`
  }
};

    statement: "La table JEU a une colonne stockVente. On reçoit un réassort sous forme de paramètres @idJeu et @qte. Écris un MERGE qui, si le jeu existe, ajoute @qte à son stockVente, et sinon (cas théorique) l'ignore. Puis écris une requête EXCEPT donnant les jeux jamais achetés (présents dans JEU mais absents de ACHETER).",

    ],
    solution: "MERGE INTO JEU AS cible\nUSING (SELECT @idJeu AS idJeu, @qte AS qte) AS source\nON cible.idJeu = source.idJeu\nWHEN MATCHED THEN\n    UPDATE SET cible.stockVente = cible.stockVente + source.qte;\n\n-- jeux jamais achetés\nSELECT idJeu FROM JEU\nEXCEPT\nSELECT idJeu FROM ACHETER;",
