var DAY = {
  num: 9,
  title: "Les jointures en T-SQL",
  subtitle: "Relier les tables reliées par des clés étrangères.",
  theory: `
<h3>1. Pourquoi joindre ?</h3>
<p>Dans une base relationnelle, les informations sont réparties dans plusieurs tables pour éviter de tout répéter. La table JEU stocke seulement <code>idCategorie</code> (un numéro), pas le nom de la catégorie qui, lui, vit dans la table CATEGORIE. Pour afficher « Catan — Stratégie », il faut donc <strong>joindre</strong> les deux tables : une <strong>jointure</strong> recolle les lignes de deux tables en s'appuyant sur une valeur commune (ici la clé). C'est comme rapprocher deux listes qui partagent un même numéro de dossier.</p>

<h3>2. INNER JOIN</h3>
<p><strong>INNER JOIN</strong> (« jointure interne ») ne garde que les lignes ayant une correspondance des DEUX côtés. Le mot-clé <strong>ON</strong> indique la condition de rapprochement (quelles colonnes doivent être égales).</p>
<pre class="pseudo">SELECT j.titre, c.libelle   -- on veut le titre du jeu (côté j) et le libellé de sa catégorie (côté c)
FROM JEU AS j   -- table de gauche, surnommée j
INNER JOIN CATEGORIE AS c ON j.idCategorie = c.idCategorie;   -- INNER JOIN = rapproche c ; ON = là où le idCategorie de j égale celui de c</pre>
<p>Ne garde que les lignes qui ont une correspondance des deux côtés. La syntaxe est la même qu'en SQL standard.</p>

<h3>3. LEFT JOIN</h3>
<p><strong>LEFT JOIN</strong> (« jointure à gauche ») garde TOUTES les lignes de la table de gauche, même celles sans correspondance à droite. Quand il n'y a pas de correspondance, les colonnes de droite valent NULL (vide).</p>
<pre class="pseudo">SELECT j.titre, f.nom   -- le titre du jeu et le nom de son fournisseur
FROM JEU AS j   -- table de gauche : tous les jeux seront conservés
LEFT JOIN FOURNISSEUR AS f ON j.idFournisseur = f.idFournisseur;   -- LEFT JOIN = garde chaque jeu même sans fournisseur correspondant
-- les jeux sans fournisseur apparaissent avec f.nom = NULL   -- pour eux, la colonne de droite reste vide (NULL)</pre>

<h3>4. Joindre plusieurs tables</h3>
<p>On enchaîne autant de JOIN que de relations à suivre, chacun avec son propre ON.</p>
<pre class="pseudo">SELECT c.nom, j.titre, l.dateDebut   -- le nom du client, le titre du jeu, la date de la location
FROM LOUER AS l   -- on part de la table des locations (l)
INNER JOIN CLIENT AS c ON l.idClient = c.idClient   -- rattache chaque location à son client
INNER JOIN JEU AS j    ON l.idJeu   = j.idJeu;   -- et à son jeu</pre>

<h3>5. Jointure + agrégat</h3>
<p>On combine souvent une jointure et un GROUP BY pour compter des lignes liées.</p>
<pre class="pseudo">-- nombre de locations par jeu   -- objectif : combien de fois chaque jeu a été loué
SELECT j.titre, COUNT(l.idJeu) AS nb_locations   -- le titre et le nombre de locations
FROM JEU AS j   -- on part de tous les jeux
LEFT JOIN LOUER AS l ON j.idJeu = l.idJeu   -- LEFT JOIN : garde même les jeux jamais loués
GROUP BY j.titre   -- un paquet par jeu
ORDER BY nb_locations DESC;   -- du plus loué au moins loué</pre>
<div class="tip">Un <code>LEFT JOIN</code> combiné à un <code>COUNT(colonne_de_droite)</code> compte 0 pour les jeux jamais loués (les NULL ne sont pas comptés), là où <code>COUNT(*)</code> compterait 1 à tort.</div>`,
  exercises: [
    { type: "qcm", q: "Une jointure sert à…", opts: ["Trier", "Relier des tables sur une clé", "Compter", "Supprimer"], a: 1, exp: "Rassembler des données liées." },
    { type: "qcm", q: "INNER JOIN garde…", opts: ["Toutes les lignes de gauche", "Seulement les lignes avec correspondance des deux côtés", "Les NULL", "Rien"], a: 1, exp: "Intersection." },
    { type: "qcm", q: "LEFT JOIN garde…", opts: ["Rien à gauche", "Toutes les lignes de gauche, même sans correspondance", "Seulement la droite", "Les doublons"], a: 1, exp: "Tout à gauche." },
    { type: "qcm", q: "La condition de jointure s'écrit après…", opts: ["WHERE", "ON", "HAVING", "GROUP"], a: 1, exp: "JOIN ... ON ..." },

    { type: "qcm", q: "Les jeux sans fournisseur avec LEFT JOIN ont f.nom =", opts: ["0", "NULL", "''", "-1"], a: 1, exp: "Pas de correspondance = NULL." },
    { type: "qcm", q: "Un alias de table (j) sert à…", opts: ["Trier", "Raccourcir et lever l'ambiguïté des colonnes", "Compter", "Filtrer"], a: 1, exp: "JEU AS j." },
    { type: "qcm", q: "Joindre 3 tables demande…", opts: ["Un seul JOIN", "Plusieurs JOIN ... ON enchaînés", "Un GROUP BY", "Impossible"], a: 1, exp: "Un JOIN par relation." },
    { type: "qcm", q: "Pour compter les locations par jeu, même à 0 :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN + COUNT(l.idJeu)", "WHERE", "TOP"], a: 1, exp: "LEFT JOIN garde les jeux non loués." },
    { type: "qcm", q: "COUNT(l.idJeu) sur un LEFT JOIN non apparié donne…", opts: ["1", "0 (le NULL n'est pas compté)", "NULL", "une erreur"], a: 1, exp: "COUNT ignore le NULL." },
    { type: "vf", q: "La syntaxe des jointures est identique au SQL standard en T-SQL.", a: true, exp: "INNER/LEFT JOIN ... ON." },
    { type: "qcm", q: "j.idCategorie = c.idCategorie est…", opts: ["Un tri", "La condition de correspondance", "Un agrégat", "Un index"], a: 1, exp: "L'égalité des clés." },
    { type: "vf", q: "Un INNER JOIN élimine les jeux sans catégorie correspondante.", a: true, exp: "Pas de correspondance = exclu." },
    { type: "qcm", q: "Locations d'un client donné avec son nom :", opts: ["JOIN LOUER, CLIENT, JEU", "Un seul SELECT sur LOUER", "GROUP BY seul", "TOP client"], a: 0, exp: "Chaîner les jointures." },
    { type: "qcm", q: "RIGHT JOIN est…", opts: ["Inexistant", "Le symétrique du LEFT JOIN (tout à droite)", "Un tri", "Un index"], a: 1, exp: "Miroir du LEFT JOIN." }
  ],
  final: {
    title: "Exercice final — Relier les tables",
    intro: `<p>JEU(idJeu, titre, idCategorie, idFournisseur), CATEGORIE(idCategorie, libelle), FOURNISSEUR(idFournisseur, nom), LOUER(idJeu, idClient).</p>`,
    questions: [
      { type: "qcm", q: "Titre + libellé de catégorie :", opts: ["INNER JOIN CATEGORIE ON j.idCategorie = c.idCategorie", "Deux requêtes", "GROUP BY", "TOP"], a: 0, exp: "Jointure sur la clé." },
      { type: "qcm", q: "Tous les jeux, avec leur fournisseur si présent :", opts: ["INNER JOIN FOURNISSEUR", "LEFT JOIN FOURNISSEUR", "RIGHT JOIN", "WHERE"], a: 1, exp: "LEFT JOIN garde tous les jeux." },
      { type: "qcm", q: "Nombre de locations par jeu (0 compris) :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN LOUER + COUNT(l.idJeu) GROUP BY j.titre", "WHERE", "TOP"], a: 1, exp: "LEFT JOIN + COUNT colonne." },
      { type: "qcm", q: "La condition de jointure va après le mot-clé…", opts: ["WHERE", "ON", "SET", "AS"], a: 1, exp: "JOIN ... ON." },
      { type: "vf", q: "Un jeu sans fournisseur disparaît avec INNER JOIN FOURNISSEUR mais reste avec LEFT JOIN.", a: true, exp: "Différence clé." }
    ],
    solution: `<pre class="pseudo">SELECT j.titre, c.libelle, f.nom   -- titre du jeu, libellé de catégorie, nom du fournisseur
FROM JEU AS j   -- table de départ : les jeux
INNER JOIN CATEGORIE AS c ON j.idCategorie = c.idCategorie   -- catégorie obligatoire : INNER JOIN
LEFT  JOIN FOURNISSEUR AS f ON j.idFournisseur = f.idFournisseur;   -- fournisseur facultatif : LEFT JOIN (NULL si absent)

SELECT j.titre, COUNT(l.idJeu) AS nb_locations   -- titre et nombre de locations
FROM JEU AS j   -- tous les jeux
LEFT JOIN LOUER AS l ON j.idJeu = l.idJeu   -- garde même les jeux jamais loués
GROUP BY j.titre;   -- un total par jeu</pre>
<p>Tu relies tout le modèle. Demain : sous-requêtes et CTE.</p>`
  }
};
