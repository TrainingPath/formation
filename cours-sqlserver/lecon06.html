var DAY = {
  num: 6,
  title: "ORDER BY, OFFSET/FETCH (pagination)",
  subtitle: "Trier, puis paginer proprement.",
  theory: `
<h3>1. ORDER BY</h3>
<p><strong>ORDER BY</strong> (« trier par ») range les lignes du résultat dans un ordre choisi. <strong>ASC</strong> (ascending) trie du plus petit au plus grand — c'est le défaut si on ne précise rien — et <strong>DESC</strong> (descending) du plus grand au plus petit. On peut donner plusieurs colonnes : la deuxième sert à départager les ex æquo de la première.</p>
<pre class="pseudo">SELECT titre, prixLocation   -- afficher titre et prix
FROM JEU   -- ... de la table JEU
ORDER BY prixLocation DESC, titre ASC;   -- trier par prix DÉCROISSANT ; à prix égal, par titre CROISSANT (ordre alphabétique)</pre>
<p>Identique au SQL standard : <code>ASC</code> (défaut) ou <code>DESC</code>, plusieurs colonnes possibles.</p>

<h3>2. TOP vs OFFSET/FETCH</h3>
<p><strong>Paginer</strong>, c'est découper un long résultat en pages (comme les résultats d'un moteur de recherche : page 1, page 2…). <code>TOP</code> ne sait prendre que les premières lignes ; pour « sauter les X premières puis prendre les Y suivantes », on utilise <strong>OFFSET ... FETCH</strong> (standardisé depuis SQL Server 2012). <strong>OFFSET</strong> = combien de lignes sauter ; <strong>FETCH NEXT</strong> = combien en prendre ensuite.</p>
<pre class="pseudo">SELECT titre, prixLocation   -- colonnes à afficher
FROM JEU   -- table source
ORDER BY titre   -- tri obligatoire pour que « page » ait un sens
OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY;   -- OFFSET 0 = ne rien sauter ; FETCH NEXT 10 = prendre 10 lignes → c'est la page 1</pre>

<h3>3. La pagination page par page</h3>
<p>Pour changer de page, on augmente l'OFFSET du nombre de lignes déjà vues.</p>
<pre class="pseudo">-- page 2 : sauter 10, prendre 10   -- commentaire : on passe à la deuxième page
ORDER BY titre   -- toujours trier d'abord
OFFSET 10 ROWS FETCH NEXT 10 ROWS ONLY;   -- sauter les 10 de la page 1, prendre les 10 suivantes

-- formule générale (page p, taille t)   -- pour calculer n'importe quelle page
OFFSET (p - 1) * t ROWS FETCH NEXT t ROWS ONLY;   -- décalage = (numéro de page - 1) × taille ; on prend ensuite t lignes</pre>
<div class="tip"><code>OFFSET/FETCH</code> exige TOUJOURS un <code>ORDER BY</code> (sinon « la page suivante » n'a pas de sens). C'est l'équivalent T-SQL du <code>LIMIT ... OFFSET</code> de MySQL/PostgreSQL.</div>

<h3>4. Trier sur un alias ou une expression</h3>
<p>On peut trier sur une colonne calculée en réutilisant son alias.</p>
<pre class="pseudo">SELECT titre, prixLocation * 1.2 AS ttc   -- colonne calculée « ttc » = prix + 20 %
FROM JEU   -- table source
ORDER BY ttc DESC;   -- on trie directement sur l'alias ttc, du plus grand au plus petit</pre>

<h3>5. NULL dans le tri</h3>
<p>En SQL Server, les valeurs <code>NULL</code> (cases vides) sont considérées comme les <strong>plus petites</strong> : elles apparaissent donc en premier en ordre croissant (ASC), en dernier en décroissant (DESC).</p>
<pre class="pseudo">SELECT titre, idFournisseur   -- afficher le titre et le fournisseur
FROM JEU   -- table source
ORDER BY idFournisseur;   -- tri croissant : les lignes sans fournisseur (NULL) sortent en tête</pre>`,
  exercises: [
    { type: "qcm", q: "ORDER BY en T-SQL…", opts: ["N'existe pas", "Fonctionne comme en SQL standard (ASC/DESC)", "Remplace TOP", "Trie toujours par clé"], a: 1, exp: "Même comportement." },
    { type: "qcm", q: "Pour paginer (sauter puis prendre), on utilise…", opts: ["TOP", "OFFSET ... FETCH", "LIMIT", "ROWNUM"], a: 1, exp: "OFFSET/FETCH depuis 2012." },
    { type: "qcm", q: "OFFSET/FETCH exige…", opts: ["Un GROUP BY", "Un ORDER BY", "Un TOP", "Un index"], a: 1, exp: "Sans tri, pas de page cohérente." },
    { type: "qcm", q: "Page 1 de 10 lignes :", opts: ["OFFSET 10 ROWS FETCH NEXT 10", "OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY", "TOP 10 OFFSET 10", "FETCH 10"], a: 1, exp: "OFFSET 0, prendre 10." },
    { type: "qcm", q: "Page 2 de 10 lignes :", opts: ["OFFSET 10 ROWS FETCH NEXT 10 ROWS ONLY", "OFFSET 0", "TOP 20", "FETCH 20"], a: 0, exp: "Sauter 10, prendre 10." },
    { type: "qcm", q: "OFFSET/FETCH est l'équivalent T-SQL de…", opts: ["TOP", "LIMIT ... OFFSET (MySQL/PostgreSQL)", "GROUP BY", "MERGE"], a: 1, exp: "Pagination standardisée." },
    { type: "qcm", q: "TOP sert plutôt à…", opts: ["Paginer", "Prendre les n premières lignes (un top)", "Trier", "Joindre"], a: 1, exp: "TOP = début, OFFSET/FETCH = pagination." },
    { type: "qcm", q: "Trier sur une colonne calculée :", opts: ["Impossible", "ORDER BY ttc (l'alias)", "Interdit", "Seulement la clé"], a: 1, exp: "On peut trier sur l'alias." },
    { type: "qcm", q: "En SQL Server, les NULL au tri sont considérés comme…", opts: ["Les plus grands", "Les plus petits (en premier en ASC)", "Ignorés", "Une erreur"], a: 1, exp: "NULL = plus petit." },
    { type: "qcm", q: "ORDER BY idFournisseur ASC place les NULL…", opts: ["En dernier", "En premier", "Au milieu", "Nulle part"], a: 1, exp: "NULL d'abord en croissant." },
    { type: "vf", q: "OFFSET/FETCH permet une pagination page par page.", a: true, exp: "Sauter (OFFSET) + prendre (FETCH)." },
    { type: "qcm", q: "La formule pour la page p, taille t :", opts: ["OFFSET p ROWS FETCH t", "OFFSET (p-1)*t ROWS FETCH NEXT t ROWS ONLY", "TOP p*t", "LIMIT t"], a: 1, exp: "Décalage = (p-1)*t." },
    { type: "qcm", q: "ORDER BY prixLocation DESC, titre trie…", opts: ["Seulement par prix", "Par prix décroissant, puis titre pour départager", "Aléatoirement", "Par id"], a: 1, exp: "Tri à deux niveaux." },
    { type: "vf", q: "OFFSET 0 ROWS FETCH NEXT 5 ROWS ONLY donne les 5 premières lignes triées.", a: true, exp: "Page 1 de 5." },
    { type: "qcm", q: "Sans ORDER BY, OFFSET/FETCH…", opts: ["Fonctionne quand même", "Est invalide (erreur)", "Prend des lignes au hasard sans erreur", "Trie par clé"], a: 1, exp: "ORDER BY obligatoire." }
  ],
  final: {
    title: "Exercice final — Paginer le catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, idFournisseur). On veut trier et paginer.</p>`,
    questions: [
      { type: "qcm", q: "Trier par prix décroissant :", opts: ["ORDER BY prixLocation", "ORDER BY prixLocation DESC", "TOP prixLocation", "SORT prixLocation"], a: 1, exp: "DESC." },
      { type: "qcm", q: "Les 5 premiers jeux (par titre) :", opts: ["OFFSET 0 ROWS FETCH NEXT 5 ROWS ONLY", "OFFSET 5", "TOP 5 OFFSET", "FETCH 5 seul"], a: 0, exp: "Page 1 de 5." },
      { type: "qcm", q: "La 3e page de 5 jeux :", opts: ["OFFSET 5", "OFFSET 10 ROWS FETCH NEXT 5 ROWS ONLY", "OFFSET 15", "FETCH 15"], a: 1, exp: "(3-1)*5 = 10." },
      { type: "qcm", q: "OFFSET/FETCH sans ORDER BY…", opts: ["Marche", "Provoque une erreur", "Trie par clé", "Prend tout"], a: 1, exp: "ORDER BY requis." },
      { type: "vf", q: "Les jeux sans fournisseur (NULL) apparaissent en premier avec ORDER BY idFournisseur.", a: true, exp: "NULL = plus petit." }
    ],
    solution: `<pre class="pseudo">-- tri   -- simple tri du plus cher au moins cher
SELECT titre, prixLocation FROM JEU ORDER BY prixLocation DESC;

-- page 3 de 5 (triée par titre)   -- (3-1)*5 = 10 lignes à sauter
SELECT titre, prixLocation   -- colonnes voulues
FROM JEU   -- table source
ORDER BY titre   -- tri obligatoire
OFFSET 10 ROWS FETCH NEXT 5 ROWS ONLY;   -- sauter 10, prendre 5 → la 3e page</pre>
<p>Fin de la semaine 1 : SSMS, tables, INSERT, SELECT, filtres, pagination. Demain : les fonctions T-SQL.</p>`
  }
};
