  title: "Les transactions T-SQL (BEGIN TRAN)",
  subtitle: "Tout ou rien : garantir la cohérence des écritures.",
  theory: `
<h3>1. Le problème</h3>
<p>Louer un jeu = deux écritures : insérer dans LOUER ET diminuer le stock. Si la seconde échoue, la première ne doit PAS rester. Une <strong>transaction</strong> regroupe des opérations en un tout indivisible.</p>

<h3>2. BEGIN / COMMIT / ROLLBACK</h3>
<pre class="pseudo">BEGIN TRANSACTION;
    INSERT INTO LOUER (idClient, idJeu, dateDebut)
    VALUES (1, 5, GETDATE());

    UPDATE JEU SET stockLocation = stockLocation - 1 WHERE idJeu = 5;
COMMIT;                 -- valider : les deux écritures deviennent définitives</pre>
<pre class="pseudo">ROLLBACK;               -- annuler : on revient à l'état d'avant la transaction</pre>

<h3>3. Les propriétés ACID</h3>
<pre class="pseudo">Atomicité    tout ou rien
Cohérence    les contraintes restent respectées
Isolation    les transactions concurrentes ne se mélangent pas
Durabilité   une fois validé (COMMIT), c'est permanent</pre>

<h3>4. Transaction + TRY…CATCH (le motif sûr)</h3>
<pre class="pseudo">BEGIN TRY
    BEGIN TRANSACTION;
        INSERT INTO LOUER (idClient, idJeu, dateDebut) VALUES (1, 5, GETDATE());
        UPDATE JEU SET stockLocation = stockLocation - 1 WHERE idJeu = 5;
    COMMIT;
END TRY
BEGIN CATCH
    IF @@TRANCOUNT &gt; 0 ROLLBACK;      -- une erreur : on annule tout
    THROW;
END CATCH;</pre>

<h3>5. XACT_ABORT et @@TRANCOUNT</h3>
<p><code>@@TRANCOUNT</code> indique le niveau de transaction ouvert (0 = aucune). <code>SET XACT_ABORT ON</code> force l'annulation automatique de toute la transaction dès la moindre erreur d'exécution : recommandé dans les procédures qui écrivent.</p>
<div class="tip">La règle d'or : encadrer les écritures liées par une transaction, valider par COMMIT en cas de succès, annuler par ROLLBACK en cas d'erreur. Jamais de demi-location.</div>`,

    { type: "qcm", q: "Le motif sûr combine transaction et…", opts: ["GROUP BY", "TRY…CATCH", "TOP", "index"], a: 1, exp: "Rollback dans le CATCH." },

    { type: "qcm", q: "SET XACT_ABORT ON …", opts: ["Trie", "Annule automatiquement toute la transaction à la moindre erreur", "Accélère", "Crée un index"], a: 1, exp: "Sécurité en écriture." },

    { type: "qcm", q: "Le I de ACID :", opts: ["Index", "Isolation (les transactions concurrentes ne se mélangent pas)", "Insert", "Identity"], a: 1, exp: "Isolation." },
    { type: "qcm", q: "Louer un jeu implique idéalement…", opts: ["Une seule écriture", "INSERT + UPDATE dans une même transaction", "Aucune écriture", "Deux transactions séparées"], a: 1, exp: "Opérations liées." }
  ],
