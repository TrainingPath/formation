var DAY = {
  num: 13,
  title: "Les procédures stockées",
  subtitle: "Enregistrer un traitement réutilisable dans la base.",
  theory: `
<h3>1. Qu'est-ce qu'une procédure stockée ?</h3>
<p>Une <strong>procédure stockée</strong> est un bloc de code T-SQL auquel on donne un nom et qu'on enregistre dans la base, pour le rappeler quand on veut. C'est comme une recette qu'on écrit une fois et qu'on relance sur commande, en lui donnant des ingrédients (les <strong>paramètres</strong>, c'est-à-dire les valeurs qu'on lui transmet à l'appel). Elle centralise une logique métier côté serveur : moins de code répété, plus de sécurité.</p>

<h3>2. Créer une procédure</h3>
<p><strong>CREATE PROCEDURE</strong> crée la procédure ; on liste ses paramètres, puis <strong>AS</strong> introduit son corps, encadré par <strong>BEGIN</strong> et <strong>END</strong>.</p>
<pre class="pseudo">CREATE PROCEDURE JeuxParCategorie   -- crée une procédure nommée JeuxParCategorie
    @idCategorie INT   -- son paramètre d'entrée : un entier @idCategorie fourni à l'appel
AS   -- AS annonce le début du corps de la procédure
BEGIN   -- ouvre le bloc d'instructions
    SET NOCOUNT ON;                     -- ne pas renvoyer le compteur de lignes   -- évite le message « n lignes affectées » (allège la réponse)
    SELECT titre, prixLocation   -- la requête exécutée par la procédure : titre et prix
    FROM JEU   -- ... dans la table JEU
    WHERE idCategorie = @idCategorie   -- ... pour la catégorie reçue en paramètre
    ORDER BY prixLocation;   -- ... triés par prix
END;   -- ferme le bloc</pre>

<h3>3. L'appeler</h3>
<p><strong>EXEC</strong> (execute) lance la procédure en lui passant ses valeurs.</p>
<pre class="pseudo">EXEC JeuxParCategorie @idCategorie = 1;   -- appel nommé : on précise le nom du paramètre
-- ou simplement   -- autre écriture équivalente
EXEC JeuxParCategorie 1;   -- appel positionnel : la valeur 1 va au 1er paramètre</pre>

<h3>4. Paramètres de sortie</h3>
<p>Un paramètre marqué <strong>OUTPUT</strong> (« sortie ») sert à RENVOYER une valeur calculée à celui qui appelle la procédure.</p>
<pre class="pseudo">CREATE PROCEDURE CompterJeux   -- procédure qui compte des jeux
    @idCategorie INT,   -- entrée : la catégorie
    @total INT OUTPUT   -- sortie : le nombre trouvé sera renvoyé dans @total
AS
BEGIN
    SELECT @total = COUNT(*) FROM JEU WHERE idCategorie = @idCategorie;   -- range le compte dans le paramètre de sortie
END;

DECLARE @n INT;   -- variable côté appelant pour recevoir le résultat
EXEC CompterJeux @idCategorie = 1, @total = @n OUTPUT;   -- on appelle en reliant @n au paramètre OUTPUT
PRINT @n;   -- afficher la valeur récupérée</pre>

<h3>5. Modifier / supprimer</h3>
<p><strong>ALTER PROCEDURE</strong> redéfinit une procédure existante ; <strong>DROP PROCEDURE</strong> la supprime.</p>
<pre class="pseudo">ALTER PROCEDURE JeuxParCategorie ... AS ...   -- redéfinir : remplace le corps sans supprimer l'objet
DROP PROCEDURE JeuxParCategorie;              -- supprimer définitivement la procédure</pre>
<div class="tip">Une procédure est <strong>précompilée</strong> et réutilisable : elle évite d'exposer le SQL brut à l'application, réduit le trafic réseau, et permet d'accorder des droits sur la procédure plutôt que sur les tables. C'est un pilier des applications SQL Server.</div>`,
  exercises: [
    { type: "qcm", q: "Une procédure stockée est…", opts: ["Une table", "Un bloc de code T-SQL nommé, enregistré dans la base", "Un index", "Une vue"], a: 1, exp: "Code réutilisable côté serveur." },
    { type: "qcm", q: "La créer :", opts: ["MAKE PROC", "CREATE PROCEDURE nom AS ...", "NEW PROCEDURE", "DECLARE PROC"], a: 1, exp: "CREATE PROCEDURE." },
    { type: "qcm", q: "L'appeler :", opts: ["CALL", "EXEC nom @param = ...", "RUN nom", "DO nom"], a: 1, exp: "EXEC." },
    { type: "qcm", q: "Un paramètre d'entrée se déclare…", opts: ["Sans @", "@nom TYPE après le nom de la procédure", "Dans un WHERE", "En sortie seulement"], a: 1, exp: "@idCategorie INT." },
    { type: "qcm", q: "Un paramètre de sortie utilise le mot-clé…", opts: ["RETURN", "OUTPUT", "SET", "PRINT"], a: 1, exp: "@total INT OUTPUT." },
    { type: "qcm", q: "SET NOCOUNT ON…", opts: ["Trie", "Évite de renvoyer le compteur « n rows affected »", "Compte les lignes", "Crée un index"], a: 1, exp: "Réduit le bruit réseau." },
    { type: "qcm", q: "Modifier une procédure existante :", opts: ["UPDATE PROC", "ALTER PROCEDURE", "CHANGE PROC", "RESET"], a: 1, exp: "ALTER PROCEDURE." },
    { type: "qcm", q: "Supprimer une procédure :", opts: ["DELETE PROC", "DROP PROCEDURE", "REMOVE", "TRUNCATE"], a: 1, exp: "DROP PROCEDURE." },
    { type: "qcm", q: "Un avantage d'une procédure :", opts: ["Elle ralentit", "Elle est précompilée et réutilisable", "Elle expose le SQL brut", "Elle double les données"], a: 1, exp: "Performance et centralisation." },
    { type: "qcm", q: "Pour la sécurité, on peut…", opts: ["Rien", "Accorder des droits sur la procédure plutôt que sur les tables", "Supprimer les tables", "Tout ouvrir"], a: 1, exp: "Contrôle d'accès fin." },
    { type: "vf", q: "Une procédure peut avoir des paramètres d'entrée ET de sortie.", a: true, exp: "IN et OUTPUT." },
    { type: "qcm", q: "EXEC JeuxParCategorie 1 …", opts: ["Crée la procédure", "L'exécute avec @idCategorie = 1", "La supprime", "La modifie"], a: 1, exp: "Appel positionnel." },
    { type: "vf", q: "Une procédure stockée réduit le code répété dans l'application.", a: true, exp: "Logique centralisée." },
    { type: "qcm", q: "Le corps de la procédure est entre…", opts: ["( )", "AS BEGIN ... END", "{ }", "DO ... DONE"], a: 1, exp: "AS + bloc." },
    { type: "qcm", q: "Récupérer une valeur calculée par la procédure :", opts: ["Uniquement via une table temporaire", "Un paramètre OUTPUT", "Un PRINT seul", "Une variable globale"], a: 1, exp: "Paramètre de sortie." }
  ],
  final: {
    title: "Exercice final — Une procédure utile",
    intro: `<p>On veut une procédure listant les jeux d'une catégorie disponibles à la location.</p>`,
    questions: [
      { type: "qcm", q: "Déclarer le paramètre d'entrée :", opts: ["@idCat INT après le nom", "Dans le WHERE", "OUTPUT", "Sans @"], a: 0, exp: "Paramètre @idCat INT." },
      { type: "qcm", q: "La créer :", opts: ["CREATE PROCEDURE JeuxDispo @idCat INT AS BEGIN ... END", "MAKE PROC", "NEW", "DECLARE"], a: 0, exp: "CREATE PROCEDURE." },
      { type: "qcm", q: "L'appeler pour la catégorie 2 :", opts: ["CALL JeuxDispo(2)", "EXEC JeuxDispo 2", "RUN JeuxDispo 2", "DO 2"], a: 1, exp: "EXEC." },
      { type: "qcm", q: "Renvoyer aussi le nombre de jeux trouvés :", opts: ["Un paramètre OUTPUT", "Un PRINT", "Un index", "Impossible"], a: 0, exp: "@total INT OUTPUT." },
      { type: "vf", q: "SET NOCOUNT ON allège la réponse en supprimant le message « n rows affected ».", a: true, exp: "Bonne pratique." }
    ],
    solution: `<pre class="pseudo">CREATE PROCEDURE JeuxDispo   -- créer la procédure JeuxDispo
    @idCat INT   -- paramètre d'entrée : la catégorie
AS   -- début du corps
BEGIN
    SET NOCOUNT ON;   -- pas de message « n lignes affectées »
    SELECT titre, prixLocation   -- afficher titre et prix
    FROM JEU   -- depuis JEU
    WHERE idCategorie = @idCat AND stockLocation &gt; 0   -- de la catégorie demandée ET encore en stock
    ORDER BY prixLocation;   -- triés par prix
END;

EXEC JeuxDispo 2;   -- appel : les jeux dispo de la catégorie 2</pre>
<p>Tu centralises la logique métier. Demain : fonctions et TRY…CATCH.</p>`
  }
};

    statement: "Écris une procédure stockée 'AjouterLocation' qui prend @idClient INT et @idJeu INT, insère une ligne dans LOUER(idClient, idJeu, dateDebut) avec la date du jour, et diminue de 1 le stockLocation du jeu dans JEU. Renvoie via un paramètre OUTPUT @ok BIT valant 1 si le stock était suffisant, 0 sinon.",
    hints: [
      "Signature : CREATE PROCEDURE AjouterLocation @idClient INT, @idJeu INT, @ok BIT OUTPUT.",
      "Vérifie le stock : IF (SELECT stockLocation FROM JEU WHERE idJeu = @idJeu) > 0 ...",
      "Dans le BEGIN : INSERT dans LOUER avec GETDATE(), UPDATE JEU SET stockLocation = stockLocation - 1, SET @ok = 1 ; sinon SET @ok = 0."
    ],
    solution: "CREATE PROCEDURE AjouterLocation\n    @idClient INT,\n    @idJeu INT,\n    @ok BIT OUTPUT\nAS\nBEGIN\n    SET NOCOUNT ON;\n    IF (SELECT stockLocation FROM JEU WHERE idJeu = @idJeu) > 0\n    BEGIN\n        INSERT INTO LOUER (idClient, idJeu, dateDebut)\n        VALUES (@idClient, @idJeu, GETDATE());\n        UPDATE JEU SET stockLocation = stockLocation - 1\n        WHERE idJeu = @idJeu;\n        SET @ok = 1;\n    END\n    ELSE\n        SET @ok = 0;\nEND;",
    atoi: {

    sqlnote: "Les procédures stockées (CREATE PROCEDURE, paramètres @, OUTPUT, SET NOCOUNT) sont propres à SQL Server ; SQLite n'a pas de procédures stockées — ces étapes se réalisent côté application (ou en instructions successives).",
