<script>
var DAY = {
  num: 3,
  title: "INSERT et la valeur IDENTITY",
  subtitle: "Ajouter des lignes et récupérer l'identifiant généré.",
  theory: `
<h3>1. INSERT standard</h3>
<p>Créer une table ne la remplit pas : elle est vide, comme un tableau dont on n'a écrit que les en-têtes. Pour y ajouter une ligne, on utilise l'ordre <strong>INSERT</strong> (« insérer »). On indique la table, la liste des colonnes qu'on remplit, puis le mot-clé <strong>VALUES</strong> (« valeurs ») suivi des valeurs à ranger, dans le MÊME ordre que les colonnes. Une <strong>valeur littérale</strong> est une donnée écrite en clair (un texte, un nombre).</p>
<pre class="pseudo">INSERT INTO CATEGORIE (idCategorie, libelle)   -- INSERT INTO CATEGORIE = « ajoute une ligne dans CATEGORIE » ; entre parenthèses, les colonnes qu'on renseigne
VALUES (1, N'Stratégie');   -- VALUES = les valeurs, dans l'ordre : idCategorie vaut 1, libelle vaut le texte Unicode « Stratégie »</pre>
<p>Comme en SQL standard : chaînes entre apostrophes (préfixe <code>N</code> pour l'Unicode), nombres sans guillemets, plusieurs lignes séparées par des virgules.</p>

<h3>2. Ne PAS insérer la colonne IDENTITY</h3>
<p>Rappel : une colonne <strong>IDENTITY</strong> se remplit toute seule (voir leçon 2). On ne la met donc PAS dans la liste des colonnes de l'INSERT : SQL Server s'en charge et lui attribue le prochain numéro disponible.</p>
<pre class="pseudo">-- idJeu est IDENTITY : on l'omet   -- rappel en commentaire : ne pas fournir la colonne auto-générée
INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)   -- on liste seulement les colonnes qu'on remplit à la main (pas idJeu)
VALUES (N'Catan', 44.90, 5.00, 1);   -- titre « Catan », achat 44.90, location 5.00, catégorie 1 ; idJeu sera généré tout seul</pre>

<h3>3. Récupérer l'identifiant généré : SCOPE_IDENTITY()</h3>
<p>Puisque l'id est fabriqué par le moteur, comment le connaître juste après l'insertion (pour l'utiliser ailleurs) ? La fonction <strong>SCOPE_IDENTITY()</strong> renvoie le dernier id généré dans le <strong>scope</strong> courant (le « scope » est le morceau de code en cours d'exécution). On la préfère à <code>@@IDENTITY</code> (qui pourrait renvoyer l'id créé par un déclencheur en arrière-plan) et à <code>IDENT_CURRENT</code> (qui regarde toute la table, y compris les insertions d'autres utilisateurs).</p>
<pre class="pseudo">INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)   -- on insère un nouveau jeu
VALUES (N'Azul', 39.90, 4.00, 1);   -- ses valeurs ; idJeu est généré automatiquement

SELECT SCOPE_IDENTITY() AS idJeuCree;   -- SELECT affiche le résultat de SCOPE_IDENTITY() ; AS le renomme « idJeuCree » : c'est l'id du jeu qu'on vient d'insérer</pre>

<h3>4. La clause OUTPUT</h3>
<p>T-SQL offre un raccourci : la clause <strong>OUTPUT</strong> renvoie directement, au moment même de l'INSERT, les lignes qui viennent d'être créées — plus besoin d'une seconde requête. Le mot spécial <strong>inserted</strong> désigne « les lignes qu'on vient d'insérer ».</p>
<pre class="pseudo">INSERT INTO JEU (titre, prixLocation, idCategorie)   -- insertion d'un jeu (3 colonnes renseignées)
OUTPUT inserted.idJeu, inserted.titre   -- OUTPUT = « renvoie-moi » ; inserted.idJeu et inserted.titre = ces colonnes de la ligne insérée
VALUES (N'Dixit', 3.50, 2);   -- les valeurs du jeu ; l'id généré est affiché aussitôt grâce à OUTPUT</pre>

<h3>5. Insérer depuis un SELECT</h3>
<p>Au lieu de valeurs tapées à la main, on peut remplir une table avec le <em>résultat d'une requête</em> : pratique pour copier ou archiver des données. On remplace simplement <code>VALUES (...)</code> par un <code>SELECT ...</code>.</p>
<pre class="pseudo">INSERT INTO JEU_ARCHIVE (titre, prixLocation)   -- on va remplir la table JEU_ARCHIVE, colonnes titre et prixLocation
SELECT titre, prixLocation FROM JEU WHERE stockLocation = 0;   -- ... avec le résultat de cette requête : les jeux dont le stock de location est à 0</pre>
<div class="warn">Insérer explicitement une valeur dans une colonne IDENTITY échoue, sauf à activer <code>SET IDENTITY_INSERT JEU ON;</code> (à réserver aux imports/migrations, puis remettre OFF).</div>`,
  exercises: [
    { type: "qcm", q: "Une colonne IDENTITY dans un INSERT…", opts: ["Doit être fournie", "Est omise : elle est générée automatiquement", "Vaut toujours 0", "Est un texte"], a: 1, exp: "Le moteur la génère." },
    { type: "qcm", q: "Une chaîne Unicode s'écrit…", opts: ["'texte'", "N'texte'", "\"texte\"", "[texte]"], a: 1, exp: "Préfixe N." },
    { type: "qcm", q: "Récupérer l'id généré après un INSERT :", opts: ["LAST_ID()", "SCOPE_IDENTITY()", "GET_ID", "IDENTITY()"], a: 1, exp: "SCOPE_IDENTITY() dans le scope courant." },
    { type: "qcm", q: "Pourquoi préférer SCOPE_IDENTITY à @@IDENTITY ?", opts: ["Parce que @@IDENTITY est désormais obsolète", "@@IDENTITY peut renvoyer l'id d'un déclencheur", "Parce que @@IDENTITY ignore les colonnes IDENTITY", "Parce que SCOPE_IDENTITY() verrouille la table"], a: 1, exp: "SCOPE_IDENTITY reste dans le scope." },
    { type: "qcm", q: "La clause OUTPUT permet…", opts: ["De trier", "De renvoyer les lignes insérées (via inserted)", "De supprimer", "D'indexer"], a: 1, exp: "Récupération directe." },
    { type: "qcm", q: "OUTPUT inserted.idJeu renvoie…", opts: ["L'ancien id", "L'id de la ligne insérée", "Le nombre de lignes", "NULL"], a: 1, exp: "inserted contient les nouvelles lignes." },
    { type: "qcm", q: "Insérer depuis un SELECT :", opts: ["INSERT INTO t (...) SELECT ...", "COPY", "IMPORT", "MERGE seulement"], a: 0, exp: "INSERT ... SELECT alimente depuis une requête." },
    { type: "qcm", q: "Insérer explicitement une valeur dans une colonne IDENTITY…", opts: ["Marche toujours", "Échoue, sauf SET IDENTITY_INSERT ON", "Crée un doublon", "Trie"], a: 1, exp: "IDENTITY_INSERT pour les imports." },
    { type: "qcm", q: "Après SET IDENTITY_INSERT JEU ON, on doit…", opts: ["Ne rien faire", "Le remettre OFF ensuite", "Supprimer la table", "Créer un index"], a: 1, exp: "À réactiver puis désactiver." },
    { type: "qcm", q: "Insérer plusieurs jeux en une commande :", opts: ["Impossible", "Plusieurs groupes VALUES séparés par des virgules", "Un seul VALUES", "Un OUTPUT obligatoire"], a: 1, exp: "VALUES (...),(...),(...)." },
    { type: "vf", q: "On n'insère jamais manuellement une colonne IDENTITY en usage normal.", a: true, exp: "Elle est auto-générée." },
    { type: "qcm", q: "Le préfixe N devant une chaîne indique…", opts: ["Un nombre", "Une chaîne Unicode (National)", "Un NULL", "Un nom de table"], a: 1, exp: "N'...' = Unicode." },
    { type: "qcm", q: "Insérer un JEU avec idCategorie inexistant…", opts: ["Réussit", "Échoue (clé étrangère)", "Crée la catégorie", "Met NULL"], a: 1, exp: "Intégrité référentielle." },
    { type: "vf", q: "OUTPUT évite une requête séparée pour connaître les lignes insérées.", a: true, exp: "Renvoi immédiat." },
    { type: "qcm", q: "SCOPE_IDENTITY() renvoie…", opts: ["Tous les ids", "Le dernier id généré dans le scope courant", "0", "Le nombre de lignes"], a: 1, exp: "Le dernier IDENTITY du scope." }
  ],
  final: {
    title: "Exercice final — Insérer et récupérer l'id",
    intro: `<p>La table JEU a idJeu en IDENTITY. On ajoute un jeu et on veut son id.</p>`,
    questions: [
      { type: "qcm", q: "Dans l'INSERT du jeu, on…", opts: ["Fournit idJeu", "Omet idJeu (IDENTITY)", "Met idJeu = 0", "Met idJeu = NULL"], a: 1, exp: "IDENTITY auto-généré." },
      { type: "qcm", q: "Récupérer l'id du jeu créé :", opts: ["SELECT LAST_INSERT_ID()", "SELECT SCOPE_IDENTITY()", "SELECT MAX(idJeu)", "SELECT @@ROWCOUNT"], a: 1, exp: "SCOPE_IDENTITY() fiable." },
      { type: "qcm", q: "Renvoyer l'id directement à l'INSERT :", opts: ["OUTPUT inserted.idJeu", "RETURN idJeu", "PRINT idJeu", "SELECT idJeu"], a: 0, exp: "Clause OUTPUT." },
      { type: "qcm", q: "N'Catan' signifie…", opts: ["Une erreur", "La chaîne Unicode « Catan »", "Un nombre", "Une colonne"], a: 1, exp: "Littéral Unicode." },
      { type: "vf", q: "MAX(idJeu) n'est pas fiable pour récupérer SON id (accès concurrents).", a: true, exp: "SCOPE_IDENTITY est sûr." }
    ],
    solution: `<pre class="pseudo">INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)   -- on insère le jeu (idJeu omis car IDENTITY)
OUTPUT inserted.idJeu, inserted.titre   -- OUTPUT renvoie tout de suite l'id généré et le titre
VALUES (N'Catan', 44.90, 5.00, 1);   -- les valeurs du jeu

-- ou, séparément :   -- autre méthode, en deux temps
SELECT SCOPE_IDENTITY() AS idJeuCree;   -- récupère après coup l'id du dernier INSERT du scope</pre>
<p>Tu remplis et récupères les identifiants. Demain : SELECT, TOP et alias.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris tes INSERT T-SQL…",
  items: [
  { id: "sqlsrv-l3", title: "Peupler le catalogue et tracer l'id", level: 2,
    statement: "La table JEU a idJeu en IDENTITY. (1) Insère « Azul » (achat 39.90, location 4.00, catégorie 1) sans fournir idJeu. (2) Récupère l'identifiant généré avec SCOPE_IDENTITY(). (3) Écris une variante qui renvoie l'id directement grâce à OUTPUT.",
    hints: [
      "Omets idJeu : INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie) VALUES (...).",
      "SELECT SCOPE_IDENTITY() AS idCree; juste après.",
      "OUTPUT inserted.idJeu se place entre INSERT ... et VALUES."
    ],
    solution: "-- (1) + (2)\nINSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)\nVALUES (N'Azul', 39.90, 4.00, 1);\nSELECT SCOPE_IDENTITY() AS idCree;\n\n-- (3) variante avec OUTPUT\nINSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)\nOUTPUT inserted.idJeu, inserted.titre\nVALUES (N'Azul', 39.90, 4.00, 1);",
    atoi: {
      cmd: "INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)\nVALUES (N'Azul', 39.90, 4.00, 1);\nSELECT SCOPE_IDENTITY() AS idCree;",
      expected: "idCree\n------\n42\n\n(1 ligne(s) affectée(s))"
    },
    sqlnote: "SCOPE_IDENTITY() et la clause OUTPUT sont propres à SQL Server ; en SQLite on récupère le dernier identifiant auto-généré avec « SELECT last_insert_rowid(); ».",
    checklist: [
      "La colonne IDENTITY (idJeu) n'est pas fournie dans l'INSERT.",
      "Le préfixe N' introduit une chaîne Unicode (N'Azul').",
      "SCOPE_IDENTITY() renvoie l'id créé dans le bon scope.",
      "La variante OUTPUT inserted.idJeu retourne l'id directement."
    ],
    note: "On n'insère pas la colonne IDENTITY. SCOPE_IDENTITY() récupère l'id du scope courant de façon fiable ; la clause OUTPUT le renvoie directement au moment de l'INSERT, sans requête supplémentaire." }
  ]
};
</script>
