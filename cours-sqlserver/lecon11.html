<script>
var DAY = {
  num: 11,
  title: "Fonctions de fenêtrage (OVER, ROW_NUMBER)",
  subtitle: "Classer et calculer sans écraser les lignes.",
  theory: `
<h3>1. L'idée du fenêtrage</h3>
<p>Rappel : un <code>GROUP BY</code> réduit chaque groupe à UNE seule ligne (on perd le détail). Une <strong>fonction de fenêtrage</strong> fait un calcul sur un ensemble de lignes voisines — appelé la <strong>fenêtre</strong> — mais <strong>garde chaque ligne</strong> visible. Image : au lieu de résumer toute une classe par sa moyenne, on écrit à côté de chaque élève la moyenne de sa classe, sans effacer les élèves. On l'active avec la clause <strong>OVER(...)</strong>.</p>

<h3>2. ROW_NUMBER, RANK, DENSE_RANK</h3>
<p>Ces trois fonctions attribuent un numéro de classement à chaque ligne, selon un ordre donné dans le OVER.</p>
<pre class="pseudo">SELECT titre, prixLocation,   -- on affiche le titre et le prix
  ROW_NUMBER() OVER (ORDER BY prixLocation DESC) AS numero,   -- numérote 1,2,3… par prix décroissant ; AS numero le nomme
  RANK()       OVER (ORDER BY prixLocation DESC) AS rang   -- même chose mais donne un rang identique aux ex æquo
FROM JEU;   -- pour chaque jeu</pre>
<p><code>ROW_NUMBER</code> numérote 1, 2, 3… sans ex æquo. <code>RANK</code> donne le même rang aux égalités puis saute (1,1,3). <code>DENSE_RANK</code> ne saute pas (1,1,2).</p>

<h3>3. PARTITION BY : une fenêtre par groupe</h3>
<p><strong>PARTITION BY</strong> découpe les lignes en paquets et redémarre le calcul à zéro dans chaque paquet — sans fusionner les lignes (contrairement à GROUP BY).</p>
<pre class="pseudo">-- classement des jeux DANS chaque catégorie   -- but : un classement séparé par catégorie
SELECT titre, idCategorie,   -- titre et catégorie
  ROW_NUMBER() OVER (PARTITION BY idCategorie ORDER BY prixLocation DESC) AS rang   -- PARTITION BY idCategorie = repartir de 1 pour chaque catégorie ; ORDER BY = du plus cher au moins cher
FROM JEU;   -- pour chaque jeu</pre>
<p><code>PARTITION BY</code> redémarre le calcul pour chaque groupe, sans fusionner les lignes.</p>

<h3>4. Agrégats fenêtrés</h3>
<p>On peut aussi mettre un agrégat (AVG, SUM…) dans un OVER : il calcule sur la fenêtre tout en conservant chaque ligne.</p>
<pre class="pseudo">SELECT titre, prixLocation,   -- titre et prix de chaque jeu
  AVG(prixLocation) OVER (PARTITION BY idCategorie) AS moyenne_categorie   -- moyenne de la catégorie, ajoutée sur CHAQUE ligne (pas de regroupement)
FROM JEU;
-- chaque jeu voit la moyenne de SA catégorie, sans regroupement   -- on garde le détail ET la moyenne côte à côte</pre>

<h3>5. Le « top N par groupe »</h3>
<p>Combiner une CTE et ROW_NUMBER permet de récupérer, par exemple, le premier de chaque groupe.</p>
<pre class="pseudo">-- le jeu le plus cher de chaque catégorie   -- objectif : 1 gagnant par catégorie
WITH classe AS (   -- CTE nommée « classe »
  SELECT titre, idCategorie,   -- titre et catégorie
    ROW_NUMBER() OVER (PARTITION BY idCategorie ORDER BY prixLocation DESC) AS r   -- rang r dans chaque catégorie, du plus cher au moins cher
  FROM JEU   -- source
)
SELECT titre, idCategorie FROM classe WHERE r = 1;   -- ne garder que le rang 1 = le plus cher de chaque catégorie</pre>
<div class="tip">Le motif « CTE + ROW_NUMBER + WHERE r = 1 » est la façon standard de récupérer le premier de chaque groupe — impossible en un seul GROUP BY.</div>`,
  exercises: [
    { type: "qcm", q: "Une fonction de fenêtrage…", opts: ["Réduit chaque groupe à une ligne", "Calcule sur un groupe MAIS conserve chaque ligne", "Supprime des lignes", "Trie seulement"], a: 1, exp: "Contrairement à GROUP BY." },
    { type: "qcm", q: "On l'active avec…", opts: ["GROUP BY", "OVER(...)", "HAVING", "TOP"], a: 1, exp: "La clause OVER." },
    { type: "qcm", q: "ROW_NUMBER() numérote…", opts: ["Avec des ex æquo", "1, 2, 3… sans égalité", "Aléatoirement", "Par clé"], a: 1, exp: "Numéro unique par ligne." },
    { type: "qcm", q: "RANK() sur des égalités…", opts: ["Ne saute jamais", "Donne le même rang puis saute (1,1,3)", "Numérote 1,2,3", "Trie"], a: 1, exp: "Rang avec saut." },
    { type: "qcm", q: "DENSE_RANK() …", opts: ["Saute les rangs", "Ne saute pas (1,1,2)", "Est aléatoire", "Compte"], a: 1, exp: "Rang dense." },
    { type: "qcm", q: "PARTITION BY sert à…", opts: ["Trier", "Redémarrer le calcul pour chaque groupe", "Supprimer", "Indexer"], a: 1, exp: "Une fenêtre par groupe." },
    { type: "qcm", q: "AVG(prix) OVER (PARTITION BY idCategorie) …", opts: ["Fusionne les lignes", "Ajoute à chaque ligne la moyenne de sa catégorie", "Trie", "Compte les catégories"], a: 1, exp: "Agrégat fenêtré." },
    { type: "qcm", q: "OVER (ORDER BY prixLocation DESC) définit…", opts: ["Le tri final", "L'ordre DANS la fenêtre pour le classement", "Un index", "Un filtre"], a: 1, exp: "Ordre du fenêtrage." },
    { type: "qcm", q: "Le « top 1 par groupe » se fait avec…", opts: ["GROUP BY seul", "CTE + ROW_NUMBER + WHERE r = 1", "TOP 1", "HAVING"], a: 1, exp: "Motif classique." },
    { type: "qcm", q: "Différence GROUP BY / fenêtrage :", opts: ["Aucune", "GROUP BY réduit, le fenêtrage conserve les lignes", "Le fenêtrage supprime", "GROUP BY est plus récent"], a: 1, exp: "Conservation des lignes." },
    { type: "vf", q: "Une fonction de fenêtrage garde toutes les lignes du résultat.", a: true, exp: "C'est son intérêt." },
    { type: "qcm", q: "ROW_NUMBER sans PARTITION BY numérote…", opts: ["Par groupe", "Sur l'ensemble du résultat", "Rien", "Par clé"], a: 1, exp: "Une seule fenêtre globale." },
    { type: "vf", q: "On ne peut pas obtenir « le plus cher de chaque catégorie » avec un simple GROUP BY sur le titre.", a: true, exp: "D'où le fenêtrage." },
    { type: "qcm", q: "Classer les jeux dans leur catégorie :", opts: ["OVER (PARTITION BY idCategorie ORDER BY prixLocation DESC)", "GROUP BY titre", "TOP 1", "ORDER BY seul"], a: 0, exp: "PARTITION + ORDER dans OVER." },
    { type: "qcm", q: "Une fonction de fenêtrage s'utilise souvent avec une…", opts: ["Table temporaire", "CTE pour filtrer ensuite sur le rang", "Clé étrangère", "Vue matérialisée"], a: 1, exp: "CTE + WHERE sur le rang." }
  ],
  final: {
    title: "Exercice final — Classements",
    intro: `<p>JEU(idJeu, titre, prixLocation, idCategorie).</p>`,
    questions: [
      { type: "qcm", q: "Numéroter les jeux du plus cher au moins cher :", opts: ["ROW_NUMBER() OVER (ORDER BY prixLocation DESC)", "RANK sans OVER", "GROUP BY prix", "TOP"], a: 0, exp: "ROW_NUMBER + OVER." },
      { type: "qcm", q: "Classer les jeux DANS chaque catégorie :", opts: ["PARTITION BY idCategorie dans le OVER", "GROUP BY idCategorie", "TOP par catégorie", "HAVING"], a: 0, exp: "PARTITION BY." },
      { type: "qcm", q: "Moyenne de la catégorie sur chaque ligne :", opts: ["AVG(prixLocation) OVER (PARTITION BY idCategorie)", "AVG avec GROUP BY", "TOP moyenne", "COUNT"], a: 0, exp: "Agrégat fenêtré." },
      { type: "qcm", q: "Le plus cher de chaque catégorie :", opts: ["GROUP BY titre", "CTE avec ROW_NUMBER puis WHERE r = 1", "TOP 1 global", "MAX(titre)"], a: 1, exp: "Motif top-N par groupe." },
      { type: "vf", q: "DENSE_RANK ne laisse pas de trou dans les rangs, contrairement à RANK.", a: true, exp: "1,1,2 vs 1,1,3." }
    ],
    solution: `<pre class="pseudo">-- le plus cher de chaque catégorie   -- objectif : 1 gagnant par catégorie
WITH classe AS (   -- CTE de classement
  SELECT titre, idCategorie,   -- titre et catégorie
    ROW_NUMBER() OVER (PARTITION BY idCategorie   -- repartir de 1 dans chaque catégorie
                       ORDER BY prixLocation DESC) AS r   -- du plus cher au moins cher, rang r
  FROM JEU   -- source
)
SELECT titre, idCategorie FROM classe WHERE r = 1;   -- garder uniquement le rang 1</pre>
<p>Tu classes et compares sans perdre le détail. Demain : variables, IF et WHILE.</p>`
  }
};
