var DAY = {

  title: "WHERE et les opérateurs T-SQL",
  subtitle: "Filtrer les lignes — comme en SQL, avec quelques finesses.",
  theory: `
<h3>1. WHERE : identique au SQL standard</h3>
<pre class="pseudo">SELECT titre, prixLocation
FROM JEU
WHERE prixLocation &lt; 5 AND stockLocation &gt; 0;</pre>
<p>Opérateurs : <code>=</code>, <code>&lt;&gt;</code> (ou <code>!=</code>), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>, combinés par <code>AND</code>, <code>OR</code>, <code>NOT</code>.</p>

<h3>2. LIKE, IN, BETWEEN, IS NULL</h3>
<pre class="pseudo">WHERE titre LIKE N'C%'                 -- commence par C
WHERE idCategorie IN (1, 2)            -- appartenance
WHERE prixLocation BETWEEN 3 AND 5     -- intervalle inclus
WHERE idFournisseur IS NULL            -- absence de valeur</pre>

<h3>3. Les jokers T-SQL de LIKE</h3>
<pre class="pseudo">%     n'importe quelle suite de caractères
_     exactement un caractère
[ ]   un caractère parmi un ensemble : [A-D] = A, B, C ou D
[^ ]  un caractère HORS de l'ensemble</pre>
<pre class="pseudo">WHERE titre LIKE N'[A-D]%'    -- titres commençant par A, B, C ou D</pre>
<div class="tip">Les classes <code>[A-D]</code> et <code>[^...]</code> sont une extension T-SQL du LIKE, absente de bien d'autres SGBD. Pratique pour des motifs précis.</div>

<h3>4. La casse (collation)</h3>
<p>SQL Server compare le texte selon la <strong>collation</strong> de la base. La plupart des collations par défaut sont <strong>insensibles à la casse</strong> (CI) : <code>'catan' = 'CATAN'</code>. Une collation CS distingue les majuscules.</p>

<h3>5. WHERE avant SELECT</h3>
<p>Comme partout, <code>WHERE</code> filtre les lignes avant la projection. Le filtre peut porter sur une colonne non affichée.</p>
<pre class="pseudo">SELECT titre
FROM JEU
WHERE prixLocation &gt;= 4;   -- on filtre sur le prix, on n'affiche que le titre</pre>
<div class="warn">Rappel NULL : <code>WHERE idFournisseur = NULL</code> ne renvoie jamais de ligne. Utilise <code>IS NULL</code> / <code>IS NOT NULL</code>.</div>`,
  exercises: [
    { type: "qcm", q: "WHERE en T-SQL…", opts: ["Est très différent du SQL standard", "Est identique au SQL standard", "N'existe pas", "Remplace TOP"], a: 1, exp: "Même syntaxe et opérateurs." },
    { type: "qcm", q: "« différent de » s'écrit…", opts: ["==", "&lt;&gt; ou !=", "=!", "NOT="], a: 1, exp: "&lt;&gt; ou !=." },
    { type: "qcm", q: "Filtrer les jeux à moins de 5 :", opts: ["WHERE prixLocation &gt; 5", "WHERE prixLocation &lt; 5", "WHERE prixLocation = 5", "TOP 5"], a: 1, exp: "Inférieur strict." },
    { type: "qcm", q: "Le joker % signifie…", opts: ["Un caractère", "Une suite quelconque de caractères", "Un chiffre", "Un espace"], a: 1, exp: "% = suite quelconque." },
    { type: "qcm", q: "LIKE N'[A-D]%' trouve les titres…", opts: ["Contenant A à D", "Commençant par A, B, C ou D", "Finissant par D", "Exactement 'A-D'"], a: 1, exp: "Classe de caractères T-SQL." },
    { type: "qcm", q: "[^X] dans un LIKE signifie…", opts: ["Le caractère X", "Un caractère HORS de l'ensemble", "Aucun caractère", "Un chiffre"], a: 1, exp: "Négation de la classe." },
    { type: "qcm", q: "IN (1, 2) teste…", opts: ["Un intervalle", "L'appartenance à une liste", "Un motif", "Une absence"], a: 1, exp: "Valeur dans la liste." },
    { type: "qcm", q: "BETWEEN 3 AND 5 inclut…", opts: ["3 et 5 exclus", "3 et 5 compris", "Seulement 4", "Rien"], a: 1, exp: "Bornes comprises." },
    { type: "qcm", q: "Tester l'absence de fournisseur :", opts: ["= NULL", "IS NULL", "== NULL", "LIKE NULL"], a: 1, exp: "IS NULL." },
    { type: "qcm", q: "La sensibilité à la casse dépend…", opts: ["Du type de colonne", "De la collation (CI = insensible, CS = sensible)", "Du TOP", "De l'index"], a: 1, exp: "La collation gouverne la comparaison." },
    { type: "vf", q: "Avec une collation CI, 'catan' = 'CATAN' est vrai.", a: true, exp: "Insensible à la casse par défaut." },
    { type: "qcm", q: "Les classes [A-D] du LIKE sont…", opts: ["Standard partout", "Une extension T-SQL", "Interdites", "Réservées aux index"], a: 1, exp: "Spécifiques à SQL Server." },
    { type: "vf", q: "WHERE peut filtrer sur une colonne non affichée dans le SELECT.", a: true, exp: "Le filtre agit avant la projection." },
    { type: "qcm", q: "« pas les catégories 1 ni 2 » :", opts: ["IN (1,2)", "NOT IN (1, 2)", "&lt;&gt; 1", "= 1 OR 2"], a: 1, exp: "NOT IN." },
    { type: "qcm", q: "WHERE idFournisseur = NULL renvoie…", opts: ["Les jeux sans fournisseur", "Jamais de ligne (piège du NULL)", "Tous les jeux", "Une erreur"], a: 1, exp: "Comparaison avec NULL = inconnu." }
  ],
  final: {
    title: "Exercice final — Filtres T-SQL",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation, idCategorie, idFournisseur).</p>`,
    questions: [
      { type: "qcm", q: "Jeux disponibles à moins de 5 :", opts: ["WHERE prixLocation &lt; 5 AND stockLocation &gt; 0", "TOP 5", "WHERE prixLocation = 5", "WHERE stockLocation"], a: 0, exp: "Deux conditions AND." },

      { type: "qcm", q: "Jeux sans fournisseur :", opts: ["idFournisseur = NULL", "idFournisseur IS NULL", "idFournisseur = 0", "NOT idFournisseur"], a: 1, exp: "IS NULL." },

      { type: "vf", q: "Avec une collation insensible à la casse, LIKE N'c%' trouve aussi « Catan ».", a: true, exp: "CI ignore la casse." }
    ],
    solution: `<pre class="pseudo">SELECT titre, prixLocation

<p>Tu filtres finement. Demain : trier et paginer avec OFFSET/FETCH.</p>`
  }
