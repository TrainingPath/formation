var DAY = {
  num: 21,
  title: "Examen final SQL Server",
  subtitle: "Tout le T-SQL en une épreuve : du SELECT aux triggers.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt leçons, une Ludothèque complète en T-SQL. Prends deux minutes pour te remémorer les grandes idées, puis lance-toi dans les 20 questions. Rappel des mots essentiels : un <strong>SGBD</strong> est le logiciel qui garde la base ; une <strong>table</strong> est un tableau à lignes et colonnes ; une <strong>requête</strong> est un ordre écrit en SQL ; le <strong>T-SQL</strong> est le dialecte SQL de SQL Server.</p>

<h3>1. Le socle</h3>
<p>SQL Server s'administre avec <strong>SSMS</strong> (l'outil graphique) et se programme en <strong>T-SQL</strong>. Les tables se créent avec des <strong>types</strong> (<code>INT</code> = entier, <code>NVARCHAR</code> = texte Unicode, <code>DECIMAL</code> = nombre à virgule exact, <code>DATE</code> = date), une clé <code>IDENTITY(1,1) PRIMARY KEY</code> (identifiant auto-généré et unique), et des <strong>contraintes</strong> qui posent des règles (<code>NOT NULL</code> = obligatoire, <code>UNIQUE</code> = sans doublon, <code>CHECK</code> = condition à respecter, <code>FOREIGN KEY</code> = lien vérifié vers une autre table).</p>

<h3>2. Interroger</h3>
<p><code>SELECT</code> (afficher) avec <code>TOP</code> (limiter, et non LIMIT), <code>WHERE</code> (filtrer) et ses opérateurs (dont les classes <code>[A-D]</code>), <code>ORDER BY</code> (trier) + <code>OFFSET/FETCH</code> pour paginer, les fonctions (<code>LEN</code> longueur, <code>DATEADD</code> ajouter une durée, <code>ISNULL</code> remplacer un vide, <code>CAST</code> convertir, <code>IIF</code> choix à deux issues), les agrégats (résumés) avec <code>GROUP BY</code>/<code>HAVING</code>, les <code>JOIN</code> (relier des tables), les sous-requêtes (requête dans la requête), les <code>CTE</code> (sous-requête nommée) et le fenêtrage (<code>ROW_NUMBER OVER</code>, classer sans écraser les lignes).</p>

<h3>3. Programmer et fiabiliser</h3>
<p>Variables <code>@x</code> (boîtes à valeurs), <code>IF</code>/<code>WHILE</code> (test et boucle), procédures stockées (traitements nommés), fonctions (qui renvoient une valeur), <code>TRY…CATCH</code> + <code>THROW</code> (rattraper et lever des erreurs), transactions <code>BEGIN TRAN</code>/<code>COMMIT</code>/<code>ROLLBACK</code> (le tout ou rien, propriétés ACID), vues (requêtes nommées), index (accélérateurs de recherche), triggers (code déclenché automatiquement, avec <code>inserted</code>/<code>deleted</code>) et <code>MERGE</code> (mettre à jour sinon insérer).</p>
<div class="tip">Conseil d'examen : repère les mots-clés propres à T-SQL (TOP, IDENTITY, OFFSET/FETCH, N'...', ISNULL, IIF, THROW), et souviens-toi que la bonne réponse n'est pas la plus longue. Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "On administre SQL Server avec…", opts: ["phpMyAdmin", "SSMS", "pgAdmin", "Workbench"], a: 1, exp: "SQL Server Management Studio." },
    { type: "qcm", q: "Une clé auto-incrémentée :", opts: ["AUTO_INCREMENT", "IDENTITY(1,1)", "SERIAL", "SEQUENCE seul"], a: 1, exp: "IDENTITY en T-SQL." },
    { type: "qcm", q: "Limiter à 5 lignes :", opts: ["LIMIT 5", "SELECT TOP 5", "FETCH 5", "ROWNUM 5"], a: 1, exp: "TOP." },
    { type: "qcm", q: "Paginer :", opts: ["LIMIT/OFFSET", "OFFSET ... FETCH NEXT ... ROWS ONLY", "TOP page", "SKIP"], a: 1, exp: "OFFSET/FETCH." },
    { type: "qcm", q: "Une chaîne Unicode :", opts: ["'x'", "N'x'", "\"x\"", "[x]"], a: 1, exp: "Préfixe N." },
    { type: "qcm", q: "Remplacer un NULL :", opts: ["NVL", "ISNULL(x, y)", "IFNULL seul", "NULLIF"], a: 1, exp: "ISNULL (T-SQL)." },
    { type: "qcm", q: "Conditionnel court à deux issues :", opts: ["CASE seul", "IIF(cond, a, b)", "IF() de ligne", "SWITCH"], a: 1, exp: "IIF." },
    { type: "qcm", q: "Filtrer les groupes :", opts: ["WHERE", "HAVING", "TOP", "ORDER BY"], a: 1, exp: "HAVING après GROUP BY." },
    { type: "qcm", q: "Garder toutes les lignes de gauche :", opts: ["INNER JOIN", "LEFT JOIN", "CROSS JOIN", "FULL seul"], a: 1, exp: "LEFT JOIN." },
    { type: "qcm", q: "Numéroter par groupe :", opts: ["GROUP BY", "ROW_NUMBER() OVER (PARTITION BY ...)", "TOP", "RANK sans OVER"], a: 1, exp: "Fenêtrage." },
    { type: "qcm", q: "Une sous-requête nommée et lisible :", opts: ["un index", "une CTE (WITH)", "une vue matérialisée", "un trigger"], a: 1, exp: "CTE." },
    { type: "qcm", q: "Déclarer une variable :", opts: ["VAR x", "DECLARE @x INT", "LET x", "SET x"], a: 1, exp: "DECLARE @x." },
    { type: "qcm", q: "Un traitement réutilisable stocké :", opts: ["une vue", "une procédure stockée", "un index", "un CHECK"], a: 1, exp: "Procédure." },
    { type: "qcm", q: "Rattraper une erreur :", opts: ["ON ERROR", "TRY…CATCH", "IGNORE", "GOTO"], a: 1, exp: "TRY…CATCH." },
    { type: "qcm", q: "Lever une erreur métier :", opts: ["ERROR()", "THROW", "RAISE seul", "PRINT"], a: 1, exp: "THROW." },
    { type: "qcm", q: "Rendre deux écritures indivisibles :", opts: ["un index", "une transaction (BEGIN TRAN/COMMIT/ROLLBACK)", "un TOP", "une vue"], a: 1, exp: "Transaction." },
    { type: "qcm", q: "Réagir automatiquement à un INSERT :", opts: ["une procédure", "un trigger", "une vue", "un index"], a: 1, exp: "Déclencheur." },
    { type: "qcm", q: "Dans un trigger, les nouvelles lignes sont dans…", opts: ["deleted", "inserted", "new", "rows"], a: 1, exp: "inserted." },
    { type: "qcm", q: "« Mettre à jour sinon insérer » :", opts: ["UNION", "MERGE", "EXCEPT", "TOP"], a: 1, exp: "MERGE (upsert)." },
    { type: "qcm", q: "Le modèle Ludothèque a deux stocks :", opts: ["achat et retour", "stockVente et stockLocation", "neuf et occasion", "un seul"], a: 1, exp: "Vente et location." }
  ],
  final: {
    title: "Épreuve pratique — Piloter la Ludothèque",
    intro: `<p>Schéma : JEU(idJeu, titre, prixLocation, stockLocation, idCategorie, idFournisseur), CATEGORIE(idCategorie, libelle), LOUER(idClient, idJeu, dateDebut). Réponds :</p>`,
    questions: [
      { type: "qcm", q: "Les 3 jeux les plus chers à louer :", opts: ["SELECT TOP 3 ... ORDER BY prixLocation DESC", "LIMIT 3", "TOP 3 sans tri", "MAX 3"], a: 0, exp: "TOP + ORDER BY." },
      { type: "qcm", q: "Titre + libellé de catégorie :", opts: ["INNER JOIN CATEGORIE ON j.idCategorie = c.idCategorie", "Deux requêtes", "UNION", "TOP"], a: 0, exp: "Jointure." },
      { type: "qcm", q: "Nombre de locations par jeu (0 compris) :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN LOUER + COUNT(l.idJeu) GROUP BY j.titre", "TOP", "MERGE"], a: 1, exp: "LEFT JOIN + COUNT colonne." },
      { type: "qcm", q: "Jeux sans fournisseur :", opts: ["idFournisseur = NULL", "idFournisseur IS NULL", "idFournisseur = 0", "NOT idFournisseur"], a: 1, exp: "IS NULL." },
      { type: "vf", q: "Louer un jeu devrait insérer dans LOUER ET décrémenter stockLocation dans une même transaction.", a: true, exp: "Atomicité métier." }
    ],
    solution: `<pre class="pseudo">SELECT TOP 3 titre, prixLocation   -- TOP 3 = les 3 premières lignes ; titre et prix
FROM JEU ORDER BY prixLocation DESC;   -- triées du plus cher au moins cher → les 3 plus chers

SELECT j.titre, c.libelle   -- titre du jeu et libellé de sa catégorie
FROM JEU j INNER JOIN CATEGORIE c ON j.idCategorie = c.idCategorie;   -- jointure interne sur la clé catégorie

SELECT j.titre, COUNT(l.idJeu) AS nb   -- titre et nombre de locations
FROM JEU j LEFT JOIN LOUER l ON j.idJeu = l.idJeu   -- LEFT JOIN pour garder les jeux jamais loués (nb = 0)
GROUP BY j.titre;   -- un total par jeu

SELECT titre FROM JEU WHERE idFournisseur IS NULL;   -- jeux sans fournisseur (case vide) : IS NULL, pas = NULL</pre>
<p>Félicitations : tu maîtrises SQL Server et le T-SQL, de la création des tables à l'automatisation d'une vraie base. La Ludothèque n'a plus de secret pour toi !</p>`
  }
};

<script>
var ECRITURE = {
  placeholder: "Écris ta requête finale…",
  items: [
  { id: "sqlsrv-l21", title: "Synthèse : la requête du gérant", level: 3,
    statement: "Requête de synthèse : affiche, pour chaque catégorie ayant au moins un jeu, le libellé, le nombre de jeux, le prix de location moyen (arrondi à 2 décimales) et le titre du jeu le plus cher de la catégorie. Combine jointures, agrégats et une sous-requête ou un fenêtrage.",
    hints: [
      "GROUP BY sur la catégorie pour le compte et la moyenne (AVG + ROUND ou CAST).",
      "Pour le jeu le plus cher par catégorie : une CTE avec ROW_NUMBER() OVER (PARTITION BY idCategorie ORDER BY prixLocation DESC), r = 1.",
      "Joins la CTE aux agrégats sur idCategorie."
    ],
    solution: "WITH plus_cher AS (\n    SELECT idCategorie, titre,\n           ROW_NUMBER() OVER (PARTITION BY idCategorie\n                              ORDER BY prixLocation DESC) AS r\n    FROM JEU\n)\nSELECT c.libelle,\n       COUNT(j.idJeu)                        AS nb_jeux,\n       CAST(AVG(j.prixLocation) AS DECIMAL(6,2)) AS prix_moyen,\n       pc.titre                              AS plus_cher\nFROM CATEGORIE c\nINNER JOIN JEU j       ON j.idCategorie = c.idCategorie\nINNER JOIN plus_cher pc ON pc.idCategorie = c.idCategorie AND pc.r = 1\nGROUP BY c.libelle, pc.titre\nORDER BY nb_jeux DESC;",
    note: "Cette requête finale réunit l'essentiel du cours : une CTE avec fonction de fenêtrage pour isoler le jeu le plus cher de chaque catégorie, des agrégats (COUNT, AVG) avec conversion CAST, et des jointures pour tout relier. C'est exactement le type d'analyse qu'un gérant demanderait sur la vraie Ludothèque." }
  ]
