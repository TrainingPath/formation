<script>
var DAY = {
  num: 8,
  title: "Agrégats, GROUP BY et HAVING",
  subtitle: "Compter, additionner, moyenner — puis filtrer les groupes.",
  theory: `
<h3>1. Les fonctions d'agrégation</h3>
<p>Une fonction d'<strong>agrégation</strong> résume plusieurs lignes en UNE seule valeur : au lieu de lire chaque ligne, elle donne un total, une moyenne, un maximum… C'est comme demander « combien d'élèves en tout ? » plutôt que la liste des noms. Voici les cinq principales :</p>
<pre class="pseudo">COUNT(*)          -- COUNT = compter : le nombre total de lignes
COUNT(col)        -- compte les lignes où col a une valeur (les NULL/vides sont ignorés)
SUM(col)          -- SUM = somme : additionne toutes les valeurs de la colonne
AVG(col)          -- AVG = average (moyenne) : la moyenne des valeurs
MIN(col) MAX(col) -- la plus petite (MIN) et la plus grande (MAX) valeur</pre>
<pre class="pseudo">SELECT COUNT(*) AS nb, AVG(prixLocation) AS moyenne FROM JEU;   -- une ligne de résultat : le nombre de jeux (nb) et leur prix moyen (moyenne)</pre>

<h3>2. GROUP BY : un résultat par groupe</h3>
<p><strong>GROUP BY</strong> (« regrouper par ») rassemble les lignes qui partagent une même valeur, puis calcule un agrégat pour chaque paquet. Exemple : au lieu d'un seul total, on obtient un total PAR catégorie.</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb, AVG(prixLocation) AS moyenne   -- pour chaque catégorie : son numéro, son nombre de jeux, son prix moyen
FROM JEU   -- ... en lisant la table JEU
GROUP BY idCategorie;   -- GROUP BY = fais un paquet par valeur de idCategorie, et calcule les agrégats dans chaque paquet</pre>
<p>Chaque colonne du <code>SELECT</code> doit être soit dans le <code>GROUP BY</code>, soit dans une fonction d'agrégation. Règle valable partout, y compris en T-SQL.</p>

<h3>3. HAVING : filtrer les groupes</h3>
<p><code>WHERE</code> filtre les lignes AVANT le regroupement ; <strong>HAVING</strong> filtre les groupes APRÈS. On utilise HAVING dès qu'on veut poser une condition sur un agrégat (un COUNT, une moyenne…).</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb   -- numéro de catégorie et son nombre de jeux
FROM JEU   -- table source
GROUP BY idCategorie   -- un paquet par catégorie
HAVING COUNT(*) &gt;= 3;   -- HAVING = ne garder que les paquets (catégories) qui contiennent au moins 3 jeux</pre>

<h3>4. L'ordre logique d'exécution</h3>
<p>SQL exécute une requête dans un ordre précis, différent de l'ordre où on l'écrit. Le connaître explique beaucoup de choses :</p>
<pre class="pseudo">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY   -- d'abord la table, puis on filtre les lignes, on regroupe, on filtre les groupes, on choisit les colonnes, on trie en dernier</pre>
<div class="tip">On ne peut pas utiliser un alias du SELECT dans le WHERE ou le GROUP BY : ils sont évalués avant. Mais <code>ORDER BY</code>, évalué en dernier, accepte l'alias.</div>

<h3>5. COUNT et les NULL</h3>
<p><code>COUNT(*)</code> compte toutes les lignes ; <code>COUNT(idFournisseur)</code> ne compte que les lignes où la valeur n'est pas NULL. Utile pour savoir combien de jeux ont un fournisseur.</p>
<pre class="pseudo">SELECT COUNT(*) AS total, COUNT(idFournisseur) AS avec_fournisseur FROM JEU;   -- total = toutes les lignes ; avec_fournisseur = seulement celles dont idFournisseur est renseigné</pre>`,
  exercises: [
    { type: "qcm", q: "COUNT(*) compte…", opts: ["Les colonnes", "Le nombre de lignes", "Les NULL seulement", "Les valeurs distinctes"], a: 1, exp: "Toutes les lignes." },
    { type: "qcm", q: "COUNT(idFournisseur) compte…", opts: ["Toutes les lignes", "Les lignes où idFournisseur n'est pas NULL", "Les NULL", "Les doublons"], a: 1, exp: "Ignore les NULL." },
    { type: "qcm", q: "La moyenne d'une colonne :", opts: ["MEAN(col)", "AVG(col)", "MOY(col)", "MEDIAN(col)"], a: 1, exp: "AVG." },
    { type: "qcm", q: "GROUP BY sert à…", opts: ["Trier", "Produire un résultat par groupe", "Filtrer les lignes", "Joindre"], a: 1, exp: "Un agrégat par groupe." },
    { type: "qcm", q: "HAVING filtre…", opts: ["Les lignes avant regroupement", "Les groupes après regroupement", "Les colonnes", "Les index"], a: 1, exp: "HAVING = après GROUP BY." },
    { type: "qcm", q: "WHERE vs HAVING :", opts: ["Identiques", "WHERE avant le regroupement, HAVING après", "HAVING avant WHERE", "WHERE ne marche pas ici"], a: 1, exp: "Ordre logique." },
    { type: "qcm", q: "Dans GROUP BY, chaque colonne du SELECT doit être…", opts: ["Une constante", "Dans le GROUP BY ou dans un agrégat", "Un alias", "Un index"], a: 1, exp: "Règle du regroupement." },
    { type: "qcm", q: "Catégories d'au moins 3 jeux :", opts: ["WHERE COUNT(*) >= 3", "GROUP BY idCategorie HAVING COUNT(*) >= 3", "TOP 3", "ORDER BY COUNT"], a: 1, exp: "HAVING sur l'agrégat." },
    { type: "qcm", q: "L'ordre logique est…", opts: ["SELECT → FROM → WHERE", "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "WHERE → SELECT → FROM", "GROUP BY d'abord"], a: 1, exp: "FROM en premier, ORDER BY en dernier." },
    { type: "qcm", q: "Un alias du SELECT est utilisable dans…", opts: ["Le WHERE", "L'ORDER BY (évalué en dernier)", "Le GROUP BY", "Le FROM"], a: 1, exp: "ORDER BY accepte l'alias." },
    { type: "vf", q: "COUNT(*) et COUNT(col) peuvent donner des résultats différents s'il y a des NULL.", a: true, exp: "COUNT(col) ignore les NULL." },
    { type: "qcm", q: "Le total et le max des prix :", opts: ["SUM et TOP", "SUM(prix) et MAX(prix)", "COUNT et AVG", "GROUP BY"], a: 1, exp: "SUM et MAX." },
    { type: "vf", q: "HAVING peut utiliser une fonction d'agrégation comme COUNT(*).", a: true, exp: "C'est son rôle." },
    { type: "qcm", q: "Filtrer les lignes AVANT de regrouper se fait avec…", opts: ["HAVING", "WHERE", "TOP", "ORDER BY"], a: 1, exp: "WHERE agit avant GROUP BY." },
    { type: "qcm", q: "Nombre de jeux par catégorie :", opts: ["COUNT(*) sans GROUP BY", "SELECT idCategorie, COUNT(*) ... GROUP BY idCategorie", "TOP idCategorie", "SUM(idCategorie)"], a: 1, exp: "Regroupement par catégorie." }
  ],
  final: {
    title: "Exercice final — Statistiques du catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, idCategorie, idFournisseur).</p>`,
    questions: [
      { type: "qcm", q: "Nombre de jeux par catégorie :", opts: ["COUNT(*) GROUP BY idCategorie", "SELECT idCategorie, COUNT(*) FROM JEU GROUP BY idCategorie", "TOP idCategorie", "SUM(idCategorie)"], a: 1, exp: "GROUP BY + COUNT." },
      { type: "qcm", q: "Prix de location moyen global :", opts: ["SUM(prixLocation)", "AVG(prixLocation)", "COUNT(prixLocation)", "MAX(prixLocation)"], a: 1, exp: "AVG." },
      { type: "qcm", q: "Catégories dont la moyenne dépasse 4 :", opts: ["WHERE AVG(prixLocation) > 4", "GROUP BY idCategorie HAVING AVG(prixLocation) > 4", "HAVING sans GROUP BY", "TOP 4"], a: 1, exp: "HAVING sur l'agrégat." },
      { type: "qcm", q: "Combien de jeux ont un fournisseur :", opts: ["COUNT(*)", "COUNT(idFournisseur)", "SUM(idFournisseur)", "COUNT(NULL)"], a: 1, exp: "COUNT ignore les NULL." },
      { type: "vf", q: "HAVING s'applique après le GROUP BY, WHERE avant.", a: true, exp: "Ordre logique." }
    ],
    solution: `<pre class="pseudo">SELECT idCategorie,   -- une ligne par catégorie
       COUNT(*)          AS nb,   -- nombre de jeux du groupe
       AVG(prixLocation) AS moyenne   -- prix de location moyen du groupe
FROM JEU   -- table source
GROUP BY idCategorie   -- un paquet par catégorie
HAVING AVG(prixLocation) &gt; 4   -- ne garder que les catégories dont la moyenne dépasse 4
ORDER BY moyenne DESC;   -- trier de la plus chère à la moins chère (alias autorisé ici)

SELECT COUNT(idFournisseur) AS avec_fournisseur FROM JEU;   -- combien de jeux ont un fournisseur (NULL ignorés)</pre>
<p>Tu résumes les données. Demain : les jointures pour relier les tables.</p>`
  }
};
