<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test</strong> (test automatisé) est un petit programme qui vérifie qu'une partie de ton code se comporte comme prévu. C'est comme le contrôle qualité en usine : une machine vérifie chaque pièce à ta place. Sans tests, chaque modification risque de casser quelque chose ailleurs sans qu'on le voie — on appelle cela une <strong>régression</strong> (un comportement qui marchait et qui se remet à échouer). Avec des tests, on lance une commande et on sait immédiatement si tout va bien. Django intègre tout ce qu'il faut, sans rien installer.</p>

<h3>2. Un premier test</h3>
<p>Une <strong>assertion</strong> (« affirmation ») est une vérification : on déclare ce qui DOIT être vrai ; si ce n'est pas le cas, le test échoue.</p>
<pre class="pseudo"># taches/tests.py (le fichier des tests de l'application)
from django.test import TestCase                    # TestCase : la classe de base des tests Django
from .models import Tache                           # le modèle à tester

class TacheModelTest(TestCase):                     # une classe de tests hérite de TestCase
    def test_une_tache_nait_a_faire(self):          # chaque méthode nommée « test_… » est un test
        tache = Tache.objects.create(texte="Réviser")  # on crée une tâche pour l'expérience
        self.assertFalse(tache.faite)               # ASSERTION : faite doit être False (non faite)
        self.assertEqual(tache.texte, "Réviser")    # ASSERTION : le texte doit valoir « Réviser »</pre>
<p>Une classe de test hérite de <code>TestCase</code>. Chaque méthode dont le nom commence par <code>test_</code> est exécutée automatiquement. Dedans, on utilise des <strong>assertions</strong> pour affirmer ce qui doit être vrai.</p>

<h3>3. Les assertions courantes</h3>
<pre class="pseudo">self.assertEqual(a, b)                       # réussit si a est ÉGAL à b
self.assertTrue(x)                           # réussit si x est vrai
self.assertFalse(x)                          # réussit si x est faux
self.assertIsNone(x)                         # réussit si x vaut None (rien)
self.assertContains(reponse, "texte")        # réussit si la page CONTIENT ce texte
self.assertEqual(reponse.status_code, 200)   # réussit si le code HTTP de la réponse vaut 200</pre>

<h3>4. Tester une vue avec le client de test</h3>
<p>Un <strong>code de statut HTTP</strong> (<em>status_code</em>) résume le résultat d'une requête en un nombre : 200 = OK, 404 = introuvable, 302 = redirection, 500 = erreur serveur.</p>
<pre class="pseudo">class TacheViewTest(TestCase):
    def test_liste_affiche_les_taches(self):
        Tache.objects.create(texte="Coder")         # on prépare une tâche à afficher
        reponse = self.client.get("/taches/")       # self.client : un navigateur SIMULÉ, envoie un GET
        self.assertEqual(reponse.status_code, 200)  # on vérifie que la page répond OK (200)
        self.assertContains(reponse, "Coder")       # et qu'elle affiche bien la tâche « Coder »</pre>
<div class="tip"><code>self.client</code> est un « navigateur simulé » : il envoie des requêtes GET/POST à tes URLs et te rend la réponse, sans lancer de vrai serveur. On vérifie alors le <code>status_code</code> (200 = OK, 404 = introuvable, 302 = redirection) et le contenu de la page.</div>

<h3>5. Tester un formulaire (POST)</h3>
<pre class="pseudo">def test_creer_ajoute_une_tache(self):
    reponse = self.client.post("/taches/nouvelle/", {"texte": "Nouvelle tâche"})  # POST avec les données du formulaire
    self.assertEqual(Tache.objects.count(), 1)      # une tâche a bien été créée en base (count = 1)
    self.assertEqual(reponse.status_code, 302)      # 302 = redirection : c'est le Post-Redirect-Get !</pre>

<h3>6. Lancer les tests</h3>
<pre class="pseudo">python manage.py test              # lance TOUS les tests du projet
python manage.py test taches       # lance seulement les tests de l'app taches
# Sortie typique : « Ran 3 tests in 0.05s — OK » (ou la liste détaillée des échecs)</pre>

    { type: "vf", q: "Un test qui échoue signale qu'une modification a cassé un comportement attendu.", a: true, exp: "C'est tout l'intérêt : détecter les régressions tôt." },
