  title: "Les templates Django (DTL)",
  subtitle: "Produire du HTML dynamique proprement.",
  theory: `
<h3>1. Qu'est-ce qu'un template ?</h3>
<p>Un <strong>template</strong> (mot anglais pour « gabarit », « modèle ») est un fichier HTML contenant des « trous » que Django remplit avec les données du contexte (leçon 3). C'est comme une <strong>lettre-type</strong> avec des blancs « Cher …, votre commande n° … » : le squelette est fixe, on n'y insère que ce qui change. Rappel : le <strong>HTML</strong> est le langage qui décrit la structure d'une page web (titres, paragraphes, listes…). Le <strong>Django Template Language</strong> (DTL, « langage de gabarit de Django ») ajoute au HTML deux syntaxes : <code>{{ }}</code> pour AFFICHER une valeur, et <code>{% %}</code> pour la LOGIQUE (boucles, conditions).</p>
<pre class="pseudo">&lt;h1&gt;Mes tâches&lt;/h1&gt;                       &lt;!-- &lt;h1&gt; : un grand titre HTML (texte fixe) --&gt;
&lt;p&gt;Bonjour {{ prenom }}&lt;/p&gt;               &lt;!-- {{ prenom }} : affiche la valeur de la variable prenom --&gt;
{% if taches %}                          &lt;!-- {% if %} : condition, exécute le bloc SI taches n'est pas vide --&gt;
    &lt;p&gt;Tu as {{ taches|length }} tâches&lt;/p&gt;  &lt;!-- |length : filtre qui donne le nombre d'éléments --&gt;
{% endif %}                              &lt;!-- {% endif %} : ferme la condition (obligatoire) --&gt;</pre>

<h3>2. Où placer les templates</h3>
<pre class="pseudo">taches/                        &lt;!-- le dossier de l'application --&gt;
└── templates/                 &lt;!-- dossier "templates" : Django y cherche les gabarits --&gt;
    └── taches/                # un sous-dossier au nom de l'app (évite les collisions de noms !)
        └── liste.html         &lt;!-- le template, appelé par render(request, "taches/liste.html") --&gt;</pre>
<p>Convention : chaque app a un dossier <code>templates/&lt;nom_app&gt;/</code>. La vue le référence par <code>render(request, "taches/liste.html", ...)</code>. Le double niveau (<code>taches/taches/</code>) évite que deux apps ayant chacune un <code>liste.html</code> ne se confondent — comme deux personnes homonymes qu'on distingue par leur ville.</p>

<h3>3. Afficher des variables</h3>
<p>Le mot <strong>attribut</strong> désigne une donnée rattachée à un objet (une tâche a un attribut « texte », un attribut « faite »…). L'attaque <strong>XSS</strong> (<em>Cross-Site Scripting</em>) consiste à glisser du code malveillant dans une page via une donnée non filtrée ; Django s'en protège tout seul.</p>
<pre class="pseudo">{{ tache.texte }}            &lt;!-- le POINT accède à un attribut de l'objet : ici le texte de la tâche --&gt;
{{ tache.faite }}            &lt;!-- affiche True (vrai) ou False (faux) --&gt;
{{ liste.0 }}                &lt;!-- premier élément d'une liste : le point suivi de l'indice (pas de crochets !) --&gt;
{{ dico.cle }}               &lt;!-- valeur associée à la clé "cle" d'un dictionnaire --&gt;</pre>
<div class="warn">Dans un template, on accède à tout avec le POINT (jamais les crochets) : <code>{{ liste.0 }}</code>, <code>{{ dico.cle }}</code>, <code>{{ objet.attribut }}</code>. Et Django ÉCHAPPE automatiquement le HTML des variables (protection anti-XSS intégrée) : tu n'as pas à t'en soucier, contrairement à PHP.</div>

<h3>4. Les boucles et les conditions</h3>
<pre class="pseudo">&lt;ul&gt;                                      &lt;!-- &lt;ul&gt; : une liste à puces HTML --&gt;
{% for tache in taches %}                 &lt;!-- POUR chaque tâche de la liste taches (une par tour) --&gt;
    &lt;li&gt;{{ tache.texte }}&lt;/li&gt;             &lt;!-- &lt;li&gt; : un élément de liste, affichant le texte de la tâche --&gt;
{% empty %}                               &lt;!-- bloc exécuté UNIQUEMENT si la liste taches est VIDE --&gt;
    &lt;li&gt;Aucune tâche&lt;/li&gt;                 &lt;!-- message affiché quand il n'y a rien --&gt;
{% endfor %}                              &lt;!-- ferme la boucle for --&gt;
&lt;/ul&gt;                                     &lt;!-- ferme la liste à puces --&gt;

{% if tache.faite %}                      &lt;!-- SI la tâche est faite… --&gt;
    ✅ Terminée                            &lt;!-- …afficher la coche verte + "Terminée" --&gt;
{% else %}                                &lt;!-- SINON… --&gt;
    ⬜ À faire                             &lt;!-- …afficher la case vide + "À faire" --&gt;
{% endif %}                               &lt;!-- ferme la condition --&gt;</pre>
<p>Le <code>{% for %} ... {% empty %} ... {% endfor %}</code> gère élégamment le cas de la liste vide. Chaque bloc de logique se ferme (<code>endfor</code>, <code>endif</code>) — comme une parenthèse qu'on doit refermer.</p>

<h3>5. Les filtres</h3>
<p>Un <strong>filtre</strong> transforme une valeur juste avant de l'afficher, un peu comme un filtre photo modifie l'image sans changer l'original. On l'applique avec la barre verticale <code>|</code>.</p>
<pre class="pseudo">{{ texte|upper }}            &lt;!-- upper : transforme le texte EN MAJUSCULES --&gt;
{{ texte|length }}           &lt;!-- length : donne la longueur (nombre de caractères ou d'éléments) --&gt;
{{ prix|floatformat:2 }}     &lt;!-- floatformat:2 : affiche le nombre avec 2 décimales (19.99) --&gt;
{{ date|date:"d/m/Y" }}      &lt;!-- date:"..." : formate une date (jour/mois/année) --&gt;
{{ texte|default:"(vide)" }} &lt;!-- default : valeur de repli si la variable est vide --&gt;
{{ texte|truncatewords:10 }} &lt;!-- truncatewords:10 : coupe le texte après 10 mots --&gt;</pre>
<p>Un <strong>filtre</strong> transforme une valeur avant l'affichage, avec la barre verticale <code>|</code> : <code>{{ valeur|filtre:argument }}</code> (le <code>:</code> introduit un éventuel argument). Ils remplacent beaucoup de code de mise en forme.</p>

<h3>6. L'héritage de templates</h3>
<p>L'<strong>héritage</strong> permet à une page de reprendre un squelette commun et de n'y remplir que ses parties propres. Un <code>{% block %}</code> est un « trou » nommé ; <code>{% extends %}</code> dit « je pars de ce squelette ».</p>
<pre class="pseudo">&lt;!-- base.html : le squelette commun à toutes les pages (menu, pied de page…) --&gt;
&lt;html&gt;&lt;body&gt;                               &lt;!-- ouverture de la page HTML --&gt;
    &lt;nav&gt;Ma todo-liste&lt;/nav&gt;              &lt;!-- &lt;nav&gt; : la barre de navigation, présente partout --&gt;
    {% block contenu %}{% endblock %}     &lt;!-- un « trou » nommé "contenu" que les pages filles rempliront --&gt;
&lt;/body&gt;&lt;/html&gt;                            &lt;!-- fermeture de la page --&gt;

&lt;!-- liste.html : une page qui hérite du squelette --&gt;
{% extends "taches/base.html" %}          &lt;!-- extends : cette page REPREND base.html --&gt;
{% block contenu %}                       &lt;!-- on remplit le bloc "contenu" défini dans base.html --&gt;
    &lt;h1&gt;Mes tâches&lt;/h1&gt;                   &lt;!-- ce titre s'insère à l'emplacement du bloc --&gt;
{% endblock %}                            &lt;!-- ferme le bloc --&gt;</pre>
<div class="tip">L'<strong>héritage de templates</strong> évite de répéter le menu et la structure sur chaque page : on écrit un <code>base.html</code> commun avec des <code>{% block %}</code>, et chaque page <code>{% extends %}</code> ce squelette en remplissant les blocs. C'est le DRY (« Don't Repeat Yourself », « ne te répète pas ») appliqué au HTML.</div>`,
  exercises: [
    { type: "qcm", q: "Dans un template, <code>{{ prenom }}</code> sert à…", opts: ["Une boucle", "AFFICHER la valeur de la variable prenom", "Une condition", "Un import"], a: 1, exp: "{{ }} = afficher une valeur du contexte." },
    { type: "qcm", q: "<code>{% if ... %}</code> et <code>{% for ... %}</code> servent à…", opts: ["Afficher", "La LOGIQUE : conditions et boucles", "Importer", "Styliser"], a: 1, exp: "{% %} = balises de logique du template." },
    { type: "qcm", q: "Où place-t-on les templates d'une app ?", opts: ["Dans views.py", "Dans templates/<nom_app>/ (sous-dossier au nom de l'app)", "Dans settings", "N'importe où"], a: 1, exp: "Le double niveau évite les collisions de noms." },
    { type: "qcm", q: "Pour accéder au 1er élément d'une liste dans un template :", opts: ["{{ liste[0] }}", "{{ liste.0 }} (le point, pas les crochets)", "{{ liste.first() }}", "{{ liste(0) }}"], a: 1, exp: "En DTL, tout se fait avec le point." },
    { type: "qcm", q: "Django et l'échappement HTML des variables…", opts: ["À faire soi-même", "AUTOMATIQUE : protection anti-XSS intégrée (contrairement à PHP)", "Inexistant", "Optionnel"], a: 1, exp: "{{ variable }} est échappé par défaut : un piège de moins qu'en PHP." },
    { type: "qcm", q: "<code>{% for t in taches %} ... {% empty %} ... {% endfor %}</code> : à quoi sert <code>{% empty %}</code> ?", opts: ["À rien", "Au bloc affiché si la liste est VIDE", "À trier", "À compter"], a: 1, exp: "Le cas de la collection vide, géré proprement." },
    { type: "qcm", q: "Comment ferme-t-on une boucle for dans un template ?", opts: ["}", "{% endfor %}", "end", "{% / %}"], a: 1, exp: "{% endfor %}, comme {% endif %}." },
    { type: "qcm", q: "Un FILTRE s'applique avec…", opts: ["Le point", "La barre verticale | : {{ valeur|filtre }}", "Les crochets", "Le dollar"], a: 1, exp: "{{ texte|upper }} met en majuscules." },
    { type: "qcm", q: "<code>{{ prix|floatformat:2 }}</code> affiche…", opts: ["prix brut", "prix à 2 décimales (ex. 19.99)", "prix + 2", "une erreur"], a: 1, exp: "Le filtre floatformat contrôle les décimales." },
    { type: "qcm", q: "À quoi sert <code>{% block contenu %}{% endblock %}</code> dans base.html ?", opts: ["À afficher contenu", "À définir un « trou » que les pages filles rempliront", "À importer", "À boucler"], a: 1, exp: "Le bloc est le point d'insertion du contenu spécifique." },
    { type: "qcm", q: "<code>{% extends \"taches/base.html\" %}</code> signifie…", opts: ["Importer une vue", "Cette page HÉRITE du squelette base.html", "Créer une table", "Une erreur"], a: 1, exp: "L'héritage de templates : le DRY appliqué au HTML." },
    { type: "qcm", q: "L'intérêt de l'héritage de templates :", opts: ["La vitesse", "Ne pas répéter le menu/la structure sur chaque page (DRY)", "Chiffrer", "Aucun"], a: 1, exp: "Un base.html commun, des pages qui remplissent les blocs." },
    { type: "qcm", q: "La vue appelle le template avec…", opts: ["include", "render(request, \"taches/liste.html\", contexte)", "extends", "path"], a: 1, exp: "render relie la vue au template et lui passe les données." },
    { type: "vf", q: "Dans un template Django, on écrit {{ objet.attribut }} et non {{ objet->attribut }}.", a: true, exp: "Le point pour tout : attributs, clés, indices." },
    { type: "qcm", q: "Le rôle d'un template :", opts: ["Router les URLs", "Produire le HTML final à partir des données du contexte", "Créer les tables", "Configurer"], a: 1, exp: "La couche présentation (le « V » de MVT)." }
  ],
  final: {
    title: "Exercice final — Le template de la liste",
    intro: `<p>On écrit le template qui affiche les tâches (contexte : <code>{"taches": [...]}</code>) :</p>
<pre class="pseudo">&lt;h1&gt;Mes tâches&lt;/h1&gt;                                    &lt;!-- titre de la page --&gt;
&lt;ul&gt;                                                  &lt;!-- début de la liste à puces --&gt;
{% for tache in taches %}                             &lt;!-- pour chaque tâche de la liste --&gt;
    &lt;li&gt;                                              &lt;!-- un élément de liste par tâche --&gt;
        {% if tache.faite %}✅{% else %}⬜{% endif %}     &lt;!-- coche selon l'état faite/à faire --&gt;
        {{ tache.texte }}                             &lt;!-- affiche le texte de la tâche --&gt;
    &lt;/li&gt;                                             &lt;!-- ferme l'élément de liste --&gt;
{% empty %}                                           &lt;!-- si la liste est vide… --&gt;

{% endfor %}                                          &lt;!-- ferme la boucle --&gt;
&lt;/ul&gt;                                                 &lt;!-- ferme la liste à puces --&gt;</pre>`,
    questions: [
      { type: "qcm", q: "Que fait <code>{% for tache in taches %}</code> ?", opts: ["Affiche taches", "Parcourt la liste taches, une tâche par tour", "Trie", "Compte"], a: 1, exp: "La boucle génère un <li> par tâche." },
      { type: "qcm", q: "Que montre <code>{% if tache.faite %}✅{% else %}⬜{% endif %}</code> ?", opts: ["Toujours ✅", "✅ si la tâche est faite, sinon ⬜", "Le texte", "Une erreur"], a: 1, exp: "La condition choisit la coche selon l'état." },
      { type: "qcm", q: "Si la liste taches est vide, qu'affiche-t-on ?", opts: ["Rien", "« Aucune tâche pour l'instant. » (bloc {% empty %})", "Une erreur", "✅"], a: 1, exp: "{% empty %} gère le cas de la collection vide." },
      { type: "qcm", q: "Le texte de chaque tâche est-il protégé contre l'injection HTML ?", opts: ["Non, danger", "Oui : {{ tache.texte }} est échappé automatiquement par Django", "Seulement avec un filtre", "Jamais"], a: 1, exp: "L'échappement auto : sécurité intégrée." },
      { type: "input", q: "Écris le filtre pour afficher le texte EN MAJUSCULES : {{ tache.texte|… }}", a: ["upper"], ph: "un filtre", exp: "{{ tache.texte|upper }}." }
    ],
    solution: `<pre class="pseudo">&lt;h1&gt;Mes tâches&lt;/h1&gt;                                                   &lt;!-- titre --&gt;
&lt;ul&gt;                                                                 &lt;!-- liste à puces --&gt;
{% for tache in taches %}                                            &lt;!-- pour chaque tâche --&gt;
    &lt;li&gt;{% if tache.faite %}✅{% else %}⬜{% endif %} {{ tache.texte }}&lt;/li&gt;  &lt;!-- coche + texte --&gt;
{% empty %}                                                          &lt;!-- si liste vide --&gt;
    &lt;li&gt;Aucune tâche pour l'instant.&lt;/li&gt;                            &lt;!-- message vide --&gt;
{% endfor %}                                                         &lt;!-- fin de la boucle --&gt;
&lt;/ul&gt;                                                                &lt;!-- fin de la liste --&gt;
&lt;!-- {{ }} affiche · {% %} décide/boucle · le point pour tout accéder --&gt;
&lt;!-- échappement automatique · {% empty %} pour le cas vide --&gt;</pre>
<p>Tes pages sont dynamiques et sûres. Demain : bien passer les données de la vue au template.</p>`
  }
};
