  subtitle: "Le back-office gratuit de Django, et des listes qui restent rapides.",
  theory: `
<h3>1. L'interface d'administration : un back-office gratuit</h3>
<p>Un <strong>back-office</strong> (« arrière-boutique ») est la partie privée d'un site, réservée au personnel, pour gérer le contenu (le <em>front-office</em> étant ce que voient les visiteurs). Django génère automatiquement cette interface web pour créer, lire, modifier et supprimer tes données — sans écrire une seule ligne de HTML. Idéal pour gérer le contenu sans coder un formulaire à chaque fois.</p>
<pre class="pseudo"># urls.py — l'admin est déjà branché par défaut à la création du projet
from django.contrib import admin                     # importe le module d'administration
urlpatterns = [ path("admin/", admin.site.urls) ]    # l'adresse /admin/ mène à l'interface
# On y accède sur /admin/ avec un compte créé par createsuperuser (leçon 16)</pre>

<h3>2. Enregistrer un modèle dans l'admin</h3>
<pre class="pseudo"># taches/admin.py (le fichier de configuration de l'admin de l'app)
from django.contrib import admin                     # importe l'admin
from .models import Tache                            # importe le modèle à gérer

admin.site.register(Tache)      # register : Tache apparaît désormais dans l'interface d'admin</pre>
<div class="tip">Tant qu'un modèle n'est pas <code>register</code>é (enregistré), il n'apparaît pas dans l'admin. Une seule ligne suffit à le rendre gérable via l'interface. C'est souvent la première chose qu'on fait après avoir créé un modèle.</div>

<h3>3. Personnaliser l'affichage : ModelAdmin</h3>
<p>Un <strong>ModelAdmin</strong> est une classe qui règle la façon dont un modèle s'affiche dans l'admin (colonnes, filtres, recherche). Le décorateur <code>@admin.register(Tache)</code> enregistre le modèle et lui associe cette configuration.</p>
<pre class="pseudo">@admin.register(Tache)                                   # enregistre Tache avec la config ci-dessous
class TacheAdmin(admin.ModelAdmin):                      # une classe de configuration de l'admin
    list_display = ("texte", "faite", "date_creation")   # list_display : les COLONNES affichées dans la liste
    list_filter = ("faite",)                             # list_filter : des filtres latéraux (la virgule fait un tuple)
    search_fields = ("texte",)                           # search_fields : les champs sur lesquels chercher</pre>
<p>Un <code>ModelAdmin</code> configure l'affichage : quelles colonnes montrer (<code>list_display</code>), quels filtres proposer (<code>list_filter</code>), sur quels champs chercher (<code>search_fields</code>). L'admin devient un vrai outil de gestion.</p>

<h3>4. Pourquoi paginer ?</h3>
<p>Afficher 10 000 tâches sur une seule page est lent et illisible. La <strong>pagination</strong> découpe une longue liste en pages successives (« page 1, 2, 3… ») — comme un livre plutôt qu'un rouleau interminable. On ne charge que ce qu'on montre.</p>

<h3>5. Paginer dans une vue</h3>
<pre class="pseudo">from django.core.paginator import Paginator          # Paginator : l'outil de découpage en pages

def liste(request):
    taches = Tache.objects.all()                     # toutes les tâches
    paginator = Paginator(taches, 10)                # découpe en pages de 10 tâches
    numero = request.GET.get("page")                 # lit le numéro de page dans l'URL (?page=2)
    page = paginator.get_page(numero)                # get_page : renvoie l'objet Page demandé (robuste)
    return render(request, "taches/liste.html", {"page": page})  # on passe la page au template</pre>
<pre class="pseudo">{# dans le template : on boucle sur page, pas sur taches #}
{% for tache in page %}                              &lt;!-- parcourt les tâches DE CETTE page --&gt;
    {{ tache.texte }}                                &lt;!-- affiche le texte de chaque tâche --&gt;
{% endfor %}                                         &lt;!-- fin de la boucle --&gt;

{% if page.has_previous %}&lt;a href="?page={{ page.previous_page_number }}"&gt;Précédent&lt;/a&gt;{% endif %}  &lt;!-- lien vers la page précédente si elle existe --&gt;
Page {{ page.number }} / {{ page.paginator.num_pages }}   &lt;!-- "page courante / nombre total de pages" --&gt;
{% if page.has_next %}&lt;a href="?page={{ page.next_page_number }}"&gt;Suivant&lt;/a&gt;{% endif %}  &lt;!-- lien vers la page suivante si elle existe --&gt;</pre>
<div class="tip"><code>get_page(numero)</code> est robuste : si le numéro est absent ou invalide, il renvoie une page valide plutôt qu'une erreur. L'objet <code>page</code> connaît son numéro, s'il a un précédent/suivant, et le nombre total de pages.</div>

<h3>6. Quelques bonnes pratiques</h3>
<pre class="pseudo"># Éviter le problème « N+1 » : précharger les relations
Tache.objects.select_related("categorie")     # select_related : joint la catégorie en UNE seule requête
# Ne demander que les colonnes qu'on affiche
Tache.objects.only("id", "texte")             # only : ne charge que ces champs (allège la requête)
# Compter sans tout charger en mémoire
Tache.objects.filter(faite=True).count()      # count : laisse la base compter, sans rapatrier les objets</pre>
<div class="warn">Le piège classique « N+1 » : boucler sur des tâches puis lire <code>tache.categorie</code> déclenche UNE requête par tâche (1 requête + N requêtes). <code>select_related</code> (ou <code>prefetch_related</code>) précharge la relation en une seule requête. Sur de grandes listes, la différence est énorme.</div>

<h3>7. En résumé des bons réflexes</h3>
<p>Enregistre tes modèles dans l'admin pour les gérer sans effort ; pagine les longues listes ; précharge les relations ; ne demande à la base que ce dont tu as besoin. Un code lisible et des requêtes efficaces : voilà ce qui distingue une petite app d'une application prête pour de vrais utilisateurs.</p>`,

<pre class="pseudo"># admin.py
@admin.register(Tache)                                   # enregistre Tache dans l'admin
class TacheAdmin(admin.ModelAdmin):
    list_display = ("texte", "faite", "date_creation")   # colonnes affichées
    list_filter = ("faite",)                             # filtre latéral sur faite

from django.core.paginator import Paginator              # outil de pagination

def liste(request):
