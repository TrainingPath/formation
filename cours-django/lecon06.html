  title: "Formulaires et CSRF",
  subtitle: "Recevoir des données de l'utilisateur, en sécurité.",
  theory: `
<h3>1. Le formulaire HTML</h3>
<p>Un <strong>formulaire</strong> (en anglais <em>form</em>) est la partie d'une page où l'utilisateur saisit des informations pour les envoyer au serveur : la boîte de recherche de Google, l'écran de connexion, le champ « nouvelle tâche »… C'est l'équivalent web d'un formulaire papier qu'on remplit puis qu'on dépose. En Django, on l'écrit dans un template, et on le traite dans une vue. Le mot <strong>serveur</strong> désigne l'ordinateur qui exécute ton code Django et répond aux visiteurs.</p>
<pre class="pseudo">&lt;form method="post"&gt;                         &lt;!-- &lt;form&gt; : le formulaire ; method="post" = on ENVOIE des données --&gt;
    {% csrf_token %}                          &lt;!-- OBLIGATOIRE : insère le jeton de protection anti-CSRF --&gt;
    &lt;input type="text" name="texte" placeholder="Nouvelle tâche"&gt;  &lt;!-- champ de saisie ; name="texte" = sa clé --&gt;
    &lt;button type="submit"&gt;Ajouter&lt;/button&gt;    &lt;!-- bouton qui ENVOIE le formulaire (submit = "soumettre") --&gt;
&lt;/form&gt;                                       &lt;!-- ferme le formulaire --&gt;</pre>
<p>L'attribut <code>name</code> de chaque champ est la CLÉ sous laquelle la donnée arrivera côté serveur (comme en PHP). Le <code>method="post"</code> envoie les données dans le corps de la requête (invisible dans l'adresse), contrairement à <code>get</code> qui les met dans l'URL.</p>

<h3>2. {% csrf_token %} : la protection obligatoire</h3>
<p>Le sigle <strong>CSRF</strong> signifie <em>Cross-Site Request Forgery</em> (« falsification de requête entre sites »). Un <strong>jeton</strong> (<em>token</em>) est un code secret unique. Django en glisse un dans chaque formulaire et vérifie qu'il revient bien : c'est comme un ticket de vestiaire, seul celui qui a le vrai ticket récupère le manteau.</p>
<div class="warn">TOUT formulaire <code>method="post"</code> DOIT contenir <code>{% csrf_token %}</code>, sinon Django refuse la soumission avec une erreur « 403 Forbidden ». Ce jeton protège contre l'attaque <strong>CSRF</strong> (Cross-Site Request Forgery), où un site malveillant tenterait d'envoyer une requête à ta place. Django génère un jeton unique et vérifie sa présence : c'est une sécurité automatique, mais tu dois placer la balise.</div>

<h3>3. Traiter le formulaire dans la vue</h3>
<pre class="pseudo">def creer(request):
    if request.method == "POST":              # SI le formulaire a été ENVOYÉ (soumission)…
        texte = request.POST.get("texte", "") # …on lit le champ « texte » (le name), "" si absent
        if texte.strip():                     # strip() enlève les espaces ; on garde si non vide
            Tache.objects.create(texte=texte) # crée la tâche dans la base de données (leçon 9)
        return redirect("liste")              # PRG : on redirige vers la liste après l'envoi
    return render(request, "taches/creer.html")   # méthode GET (simple visite) : on affiche le formulaire</pre>
<p>La même vue gère les deux cas : en <strong>GET</strong> (simple visite), elle affiche le formulaire ; en <strong>POST</strong> (soumission), elle traite les données puis redirige.</p>

<h3>4. Lire les données envoyées</h3>
<p>Rappel : <code>request.POST</code> et <code>request.GET</code> sont des dictionnaires. La méthode <code>.get(clé, défaut)</code> lit une valeur sans planter si la clé manque.</p>
<pre class="pseudo">request.POST["texte"]           # accès direct par crochets : PLANTE (KeyError) si le champ est absent
request.POST.get("texte")       # renvoie None au lieu de planter si absent (plus sûr)
request.POST.get("texte", "")   # renvoie "" (valeur par défaut) si absent : le plus robuste
request.GET.get("q")            # lit une donnée passée dans l'URL (ex. une recherche ?q=…)</pre>
<div class="tip">Utilise <code>request.POST.get("champ", defaut)</code> plutôt que les crochets : un champ peut être absent (l'utilisateur contourne le formulaire), et <code>get</code> évite le plantage. C'est le même réflexe que le <code>dict.get()</code> du cours Python.</div>

<h3>5. Le motif Post-Redirect-Get (PRG)</h3>
<pre class="pseudo">if request.method == "POST":     # après un envoi de formulaire…
    # ... enregistrer ...          # (on sauvegarde les données)
    return redirect("liste")     # ← on REDIRIGE vers une autre page, on ne fait PAS render directement</pre>
<div class="warn">Après un envoi de formulaire réussi, redirige toujours (<code>redirect</code>) plutôt que d'afficher directement la page. Sinon, si l'utilisateur recharge (F5), le formulaire est renvoyé → une tâche en double ! Le motif PRG (Post → Redirect → Get) évite ce piège classique.</div>

<h3>6. Ne jamais faire confiance aux données</h3>
<pre class="pseudo">texte = request.POST.get("texte", "").strip()   # lire la donnée PUIS la nettoyer (strip = ôter les espaces)
if not texte:                                    # valider : si le texte est vide (not = négation)…
    # ... afficher une erreur ...                 # …on refuse et on prévient l'utilisateur
# (Django échappe déjà le HTML à l'affichage : protection anti-XSS automatique)</pre>
<p>Comme en PHP : toute donnée venant de l'utilisateur est <strong>suspecte</strong>. On la <strong>valide</strong> côté serveur (non vide, bon format…). Bonne nouvelle : Django échappe automatiquement le HTML à l'affichage (leçon 4), et le CSRF est géré : deux protections offertes. La validation, elle, reste ton travail — et sera facilitée par les Django Forms (leçon 12).</p>`,
  exercises: [
    { type: "qcm", q: "Pour envoyer des données, un formulaire utilise…", opts: ["method=\"get\" toujours", "method=\"post\" (données dans le corps de la requête)", "un lien", "une vue"], a: 1, exp: "POST pour créer/modifier ; GET pour consulter/rechercher." },
    { type: "qcm", q: "Que doit contenir TOUT formulaire POST en Django ?", opts: ["Un id", "{% csrf_token %}", "Un import", "Une classe"], a: 1, exp: "Sans lui : erreur 403. C'est la protection anti-CSRF." },
    { type: "qcm", q: "Le jeton CSRF protège contre…", opts: ["Les virus", "L'attaque CSRF : un site tiers qui enverrait une requête à ta place", "Le XSS", "La lenteur"], a: 1, exp: "Django vérifie un jeton unique à chaque POST." },
    { type: "qcm", q: "Sans <code>{% csrf_token %}</code>, un POST donne…", opts: ["Un succès", "Une erreur 403 Forbidden", "Un avertissement", "Une page blanche sans message"], a: 1, exp: "Django rejette la soumission non protégée." },
    { type: "qcm", q: "L'attribut <code>name</code> d'un champ sert à…", opts: ["Styliser", "Être la CLÉ sous laquelle la donnée arrive dans request.POST", "L'id", "À définir le type de données du champ"], a: 1, exp: "name=\"texte\" → request.POST[\"texte\"] (comme en PHP)." },
    { type: "qcm", q: "Comment tester qu'un formulaire a été envoyé ?", opts: ["if request.POST", "if request.method == \"POST\":", "if submit", "if request.form"], a: 1, exp: "GET = visite, POST = soumission." },
    { type: "qcm", q: "Pourquoi <code>request.POST.get(\"texte\", \"\")</code> plutôt que les crochets ?", opts: ["Style", "Un champ peut être absent : get évite le KeyError (comme dict.get)", "Plus rapide", "Obligatoire"], a: 1, exp: "get avec valeur par défaut = robuste." },
    { type: "qcm", q: "Après un POST réussi, on fait…", opts: ["render directement", "redirect (Post-Redirect-Get)", "rien", "un print"], a: 1, exp: "Rediriger évite le double envoi au rechargement." },
    { type: "qcm", q: "Le piège évité par le motif PRG :", opts: ["Le XSS", "Le DOUBLE envoi : recharger la page réenverrait le formulaire", "Le CSRF", "La lenteur"], a: 1, exp: "POST → Redirect → GET : F5 recharge sans réenvoyer." },
    { type: "qcm", q: "Une même vue peut-elle afficher ET traiter le formulaire ?", opts: ["Non", "Oui : GET affiche, POST traite (test sur request.method)", "Seulement avec deux URLs", "Jamais"], a: 1, exp: "Le motif classique « afficher ou traiter »." },
    { type: "qcm", q: "Les données d'un formulaire sont, par principe…", opts: ["Fiables", "SUSPECTES : à valider côté serveur, toujours", "Chiffrées", "Inutiles"], a: 1, exp: "Ne jamais faire confiance au client." },
    { type: "qcm", q: "L'échappement HTML des données à l'affichage est…", opts: ["À faire soi-même", "Automatique en Django (anti-XSS) : {{ variable }} est échappé", "Inexistant", "Optionnel"], a: 1, exp: "Django protège l'affichage tout seul." },
    { type: "qcm", q: "<code>request.GET.get(\"q\")</code> sert typiquement à…", opts: ["Un mot de passe", "Lire un paramètre passé dans l'URL (ex. une recherche ?q=...)", "Créer une table", "Le CSRF"], a: 1, exp: "GET pour les données de l'URL (filtres, recherche)." },
    { type: "vf", q: "Django gère le CSRF et l'échappement HTML, mais la validation des données reste ton travail.", a: true, exp: "Deux protections offertes ; la validation métier t'appartient (facilitée par les Forms, leçon 12)." },
    { type: "qcm", q: "Un mot de passe : method GET ou POST ?", opts: ["GET", "POST : jamais un secret dans l'URL", "Peu importe", "GET chiffré"], a: 1, exp: "L'URL se retrouve dans l'historique et les logs : POST pour le sensible." }
  ],
  final: {
    title: "Exercice final — Le formulaire d'ajout",
    intro: `<p>On ajoute une tâche via un formulaire :</p>
<pre class="pseudo">&lt;!-- creer.html --&gt;
&lt;form method="post"&gt;                         &lt;!-- envoi de données --&gt;
    {% csrf_token %}                          &lt;!-- protection anti-CSRF obligatoire --&gt;
    &lt;input type="text" name="texte"&gt;          &lt;!-- champ de saisie, clé "texte" --&gt;
    &lt;button type="submit"&gt;Ajouter&lt;/button&gt;    &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;                                       &lt;!-- fin du formulaire --&gt;</pre>
<pre class="pseudo"># views.py
def creer(request):
    if request.method == "POST":                        # si le formulaire est envoyé
        texte = request.POST.get("texte", "").strip()   # lire + nettoyer le champ
        if texte:                                       # si non vide (validation)
            Tache.objects.create(texte=texte)           # créer la tâche en base
        return redirect("liste")                        # PRG : rediriger après l'envoi
    return render(request, "taches/creer.html")         # GET : afficher le formulaire</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi <code>{% csrf_token %}</code> dans le formulaire ?", opts: ["Pour valider les champs", "Obligatoire pour un POST : sinon erreur 403 (protection CSRF)", "Pour l'id", "Pour le style"], a: 1, exp: "Tout formulaire POST doit inclure le jeton CSRF." },
      { type: "qcm", q: "Comment la vue lit-elle la tâche saisie ?", opts: ["request.GET", "request.POST.get(\"texte\", \"\") — le name du champ", "request.texte", "input()"], a: 1, exp: "Le name=\"texte\" du champ = la clé dans request.POST." },
      { type: "qcm", q: "À quoi sert le <code>.strip()</code> et le <code>if texte:</code> ?", opts: ["À trier", "À valider : nettoyer les espaces et refuser une tâche vide", "À chiffrer", "À convertir le texte en majuscules"], a: 1, exp: "Validation minimale côté serveur." },
      { type: "qcm", q: "Pourquoi <code>redirect(\"liste\")</code> après la création ?", opts: ["Style", "Post-Redirect-Get : éviter le double ajout si l'utilisateur recharge", "Plus rapide", "Obligatoire pour POST"], a: 1, exp: "On redirige après un POST réussi." },
      { type: "qcm", q: "En méthode GET (simple visite de /taches/nouvelle/), la vue…", opts: ["Crée une tâche", "Affiche le formulaire (render creer.html)", "Redirige", "Plante"], a: 1, exp: "GET affiche, POST traite : la même vue gère les deux." }
    ],
    solution: `<pre class="pseudo">&lt;form method="post"&gt;                         &lt;!-- formulaire d'envoi --&gt;
    {% csrf_token %}                        &lt;!-- protection obligatoire --&gt;
    &lt;input type="text" name="texte"&gt;         &lt;!-- champ "texte" --&gt;
    &lt;button&gt;Ajouter&lt;/button&gt;                  &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;                                       &lt;!-- fin du formulaire --&gt;

def creer(request):
    if request.method == "POST":
        texte = request.POST.get("texte", "").strip()   # lire + nettoyer
        if texte:                                       # valider (non vide)
            Tache.objects.create(texte=texte)           # créer en base
        return redirect("liste")                        # PRG : rediriger
    return render(request, "taches/creer.html")         # GET : afficher
# csrf_token + request.POST.get + validation + redirect : le formulaire sûr.</pre>
<p>Tu reçois des données en sécurité. Demain : la vue d'ensemble de l'architecture MVT.</p>`
  }
};
