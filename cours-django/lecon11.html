<script>
var DAY = {
  num: 11,
  title: "Relations entre modèles",
  subtitle: "Relier les données : catégories, auteurs, tags…",
  theory: `
<h3>1. Pourquoi des relations ?</h3>
<p>Les vraies données sont <strong>liées</strong> entre elles : une tâche appartient à une <strong>catégorie</strong>, un article a un <strong>auteur</strong>, un produit a des <strong>tags</strong> (étiquettes). Plutôt que de recopier le nom de la catégorie dans chaque tâche (source d'erreurs et de doublons), on crée une <strong>relation</strong> : un lien qui pointe d'un modèle vers un autre, comme un renvoi « voir fiche n° 3 ». Django propose trois types de relations : <strong>ForeignKey</strong> (plusieurs-à-un), <strong>ManyToManyField</strong> (plusieurs-à-plusieurs) et <strong>OneToOneField</strong> (un-à-un).</p>

<h3>2. ForeignKey : la relation « plusieurs-à-un »</h3>
<p>Une <strong>ForeignKey</strong> (« clé étrangère ») est un champ qui pointe vers une ligne d'un autre modèle. On parle de <strong>parent</strong> (la catégorie) et d'<strong>enfants</strong> (ses tâches).</p>
<pre class="pseudo">class Categorie(models.Model):                # le modèle "parent"
    nom = models.CharField(max_length=100)    # une catégorie a un nom
    def __str__(self):                        # affichage lisible
        return self.nom                       # renvoie le nom

class Tache(models.Model):                    # le modèle "enfant"
    texte = models.CharField(max_length=200)  # le texte de la tâche
    faite = models.BooleanField(default=False)  # état fait/à faire
    categorie = models.ForeignKey(            # ForeignKey : UNE catégorie par tâche…
        Categorie,                            # …vers quel modèle pointe le lien
        on_delete=models.CASCADE,             # que faire si la catégorie est supprimée (voir §3)
        related_name="taches"                 # nom de l'accès inverse : categorie.taches.all()
    )                                         # ferme la définition du champ</pre>
<p>Une <code>ForeignKey</code> vers <code>Categorie</code> signifie « chaque tâche a UNE catégorie, mais une catégorie peut avoir PLUSIEURS tâches ». C'est la relation la plus courante — pense à « chaque élève a une classe, une classe a plusieurs élèves ».</p>

<h3>3. on_delete : que faire si le parent disparaît ?</h3>
<pre class="pseudo">on_delete=models.CASCADE      # CASCADE : supprimer les tâches quand leur catégorie est supprimée
on_delete=models.PROTECT      # PROTECT : EMPÊCHER la suppression de la catégorie si elle a des tâches
on_delete=models.SET_NULL     # SET_NULL : mettre categorie à vide/NULL (exige null=True sur le champ)</pre>
<div class="warn">Le paramètre <code>on_delete</code> est OBLIGATOIRE sur une ForeignKey : Django veut que tu décides explicitement ce qui arrive aux enfants quand le parent est supprimé. <code>CASCADE</code> (tout supprimer) est le plus courant, mais <code>PROTECT</code> évite les suppressions accidentelles.</div>

<h3>4. Accéder aux objets liés</h3>
<p>Le <strong>sens direct</strong> va de l'enfant vers le parent ; le <strong>sens inverse</strong> du parent vers ses enfants.</p>
<pre class="pseudo"># Sens DIRECT : de la tâche vers sa catégorie
tache.categorie              # l'objet Categorie lié à cette tâche
tache.categorie.nom          # le nom de cette catégorie (on enchaîne les points)

# Sens INVERSE : de la catégorie vers ses tâches (grâce à related_name)
categorie.taches.all()                 # toutes les tâches de cette catégorie
categorie.taches.filter(faite=False)   # les tâches non faites de cette catégorie
categorie.taches.count()               # combien de tâches dans cette catégorie</pre>
<p>Le <code>related_name="taches"</code> donne le nom de l'accès inverse : depuis une catégorie, <code>categorie.taches.all()</code> liste ses tâches. Sans related_name, Django utiliserait <code>categorie.tache_set.all()</code> par défaut (le nom du modèle en minuscules + <code>_set</code>).</p>

<h3>5. Filtrer à travers les relations</h3>
<pre class="pseudo"># Les tâches dont la catégorie s'appelle « Travail » (le __ TRAVERSE la relation) :
Tache.objects.filter(categorie__nom="Travail")   # categorie__nom = le champ nom de la catégorie liée
# Les tâches non faites de la catégorie d'id 2 :
Tache.objects.filter(categorie_id=2, faite=False)  # deux critères combinés (ET)</pre>
<div class="tip">Le double underscore <code>__</code> traverse les relations : <code>categorie__nom</code> signifie « le champ <code>nom</code> de la catégorie liée ». On peut ainsi filtrer sur les données d'un modèle relié, en une seule requête — l'ORM génère la <strong>jointure</strong> SQL automatiquement (la jointure est l'opération qui « recolle » deux tables reliées).</div>

<h3>6. ManyToMany et OneToOne</h3>
<pre class="pseudo">class Tache(models.Model):
    tags = models.ManyToManyField("Tag")      # ManyToMany : plusieurs tags par tâche, et inversement

tache.tags.add(tag1, tag2)   # .add() : ajouter des tags à la tâche
tache.tags.all()             # lister tous les tags de la tâche

class Profil(models.Model):
    user = models.OneToOneField(User, on_delete=models.CASCADE)   # OneToOne : un seul profil par utilisateur</pre>
<p><strong>ManyToMany</strong> pour « plusieurs des deux côtés » (une tâche a plusieurs tags, un tag concerne plusieurs tâches) ; <strong>OneToOne</strong> pour « exactement un de chaque côté » (un profil étendu par utilisateur, comme une fiche complémentaire unique). Comme toujours : modifier les modèles → <code>makemigrations</code> + <code>migrate</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Une <code>ForeignKey</code> exprime une relation…", opts: ["Un-à-un", "Plusieurs-à-un : plusieurs tâches → une catégorie", "Plusieurs-à-plusieurs", "Aucune"], a: 1, exp: "Chaque tâche a une catégorie ; une catégorie a plusieurs tâches." },
    { type: "qcm", q: "Le paramètre <code>on_delete</code> sur une ForeignKey est…", opts: ["Optionnel", "OBLIGATOIRE : il décide du sort des enfants si le parent est supprimé", "Décoratif", "Pour le tri"], a: 1, exp: "Django exige une décision explicite." },
    { type: "qcm", q: "<code>on_delete=models.CASCADE</code> signifie…", opts: ["Empêcher la suppression", "Supprimer les tâches quand leur catégorie est supprimée", "Mettre à NULL", "Rien"], a: 1, exp: "CASCADE : les enfants suivent le parent." },
    { type: "qcm", q: "<code>on_delete=models.PROTECT</code> sert à…", opts: ["Tout supprimer", "EMPÊCHER la suppression du parent s'il a des enfants", "Mettre à NULL", "Trier"], a: 1, exp: "Évite les suppressions accidentelles." },
    { type: "qcm", q: "Depuis une tâche, accéder à sa catégorie :", opts: ["tache.categorie", "tache.categorie_set", "tache.get_categorie()", "Categorie.tache"], a: 0, exp: "L'accès direct via l'attribut ForeignKey." },
    { type: "qcm", q: "<code>related_name=\"taches\"</code> permet…", opts: ["De trier", "L'accès INVERSE : categorie.taches.all() liste ses tâches", "De supprimer", "Rien"], a: 1, exp: "Le nom de l'accès de la catégorie vers ses tâches." },
    { type: "qcm", q: "Sans related_name, l'accès inverse par défaut est…", opts: ["categorie.taches", "categorie.tache_set.all()", "categorie.all()", "impossible"], a: 1, exp: "Django génère <modele>_set par défaut." },
    { type: "qcm", q: "<code>categorie.taches.filter(faite=False)</code> retourne…", opts: ["Toutes les tâches", "Les tâches NON faites DE CETTE catégorie", "Une erreur", "La catégorie"], a: 1, exp: "On filtre les tâches liées à cette catégorie." },
    { type: "qcm", q: "<code>Tache.objects.filter(categorie__nom=\"Travail\")</code> : que fait le <code>__</code> ?", opts: ["Rien", "Il TRAVERSE la relation : filtre sur le champ nom de la catégorie liée", "Une erreur", "Un tri"], a: 1, exp: "Le lookup traverse la ForeignKey ; l'ORM fait la jointure." },
    { type: "qcm", q: "Une relation <code>ManyToManyField</code> convient pour…", opts: ["Une catégorie par tâche", "Des TAGS : plusieurs tags par tâche, un tag sur plusieurs tâches", "Un profil par user", "Rien"], a: 1, exp: "Plusieurs des deux côtés = ManyToMany." },
    { type: "qcm", q: "Ajouter des tags à une tâche :", opts: ["tache.tags = [...]", "tache.tags.add(tag1, tag2)", "tache.tags + tag", "tags.append"], a: 1, exp: ".add() pour une relation ManyToMany." },
    { type: "qcm", q: "Un <code>OneToOneField</code> vers User sert typiquement à…", opts: ["Plusieurs profils", "Un PROFIL étendu : exactement un par utilisateur", "Des tags", "Rien"], a: 1, exp: "Un-à-un : un profil unique par user." },
    { type: "qcm", q: "Après avoir ajouté une relation à un modèle, il faut…", opts: ["Rien", "makemigrations puis migrate", "runserver", "collectstatic"], a: 1, exp: "Toute modification de modèle = migrations." },
    { type: "vf", q: "Le double underscore permet de filtrer sur les champs d'un modèle RELIÉ (categorie__nom).", a: true, exp: "L'ORM traverse les relations et génère la jointure SQL." },
    { type: "qcm", q: "Les trois types de relations Django sont…", opts: ["ForeignKey, CharField, TextField", "ForeignKey (plusieurs-à-un), ManyToMany (plusieurs-à-plusieurs), OneToOne (un-à-un)", "GET, POST, PUT", "aucun"], a: 1, exp: "Le trio des relations." }
  ],
  final: {
    title: "Exercice final — Tâches et catégories",
    intro: `<p>On relie les tâches à des catégories :</p>
<pre class="pseudo">class Categorie(models.Model):

class Tache(models.Model):
    texte = models.CharField(max_length=200)  # texte de la tâche

    questions: [
      { type: "qcm", q: "Cette relation signifie…", opts: ["Une tâche a plusieurs catégories", "Une tâche a UNE catégorie ; une catégorie a plusieurs tâches", "Aucun lien", "Un-à-un"], a: 1, exp: "ForeignKey = plusieurs-à-un." },
      { type: "qcm", q: "Si on supprime une catégorie (CASCADE), ses tâches…", opts: ["Restent", "Sont supprimées aussi", "Passent à NULL", "Sont dupliquées"], a: 1, exp: "CASCADE : les enfants suivent le parent." },
      { type: "qcm", q: "Depuis une catégorie <code>c</code>, lister ses tâches :", opts: ["c.tache", "c.taches.all() (grâce à related_name)", "Tache.all()", "c.get_taches()"], a: 1, exp: "related_name=\"taches\" donne l'accès inverse." },
      { type: "qcm", q: "Les tâches de la catégorie nommée « Perso » :", opts: ["Tache.objects.get(\"Perso\")", "Tache.objects.filter(categorie__nom=\"Perso\")", "categorie.Perso", "Tache.Perso"], a: 1, exp: "Le __ traverse la relation vers le champ nom." },
      { type: "vf", q: "Après avoir ajouté cette ForeignKey, il faut relancer makemigrations et migrate.", a: true, exp: "Toute modification de modèle demande les migrations." }
    ],
    solution: `<pre class="pseudo">class Tache(models.Model):
    texte = models.CharField(max_length=200)  # texte de la tâche
    categorie = models.ForeignKey(            # lien vers la catégorie
        Categorie, on_delete=models.CASCADE, related_name="taches")  # CASCADE + accès inverse

# Utilisation :
tache.categorie.nom                       # nom de la catégorie de la tâche (sens direct)
categorie.taches.all()                     # tâches d'une catégorie (sens inverse)
Tache.objects.filter(categorie__nom="Perso")  # filtrer via la relation (__)
# ForeignKey + on_delete + related_name : relier les données proprement.

  }
