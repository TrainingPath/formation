<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt leçons, une application complète. Prends deux minutes pour te remémorer les grandes idées, puis lance-toi dans les 20 questions. On redéfinit au passage chaque terme-clé, pour que tout soit frais.</p>

<h3>1. L'architecture MVT</h3>
<p>Django suit le patron <strong>Modèle – Vue – Template</strong> (une façon d'organiser le code en couches aux rôles séparés). Le <em>modèle</em> décrit les données (une classe Python = une table de la base) ; la <em>vue</em> contient la logique (une fonction qui reçoit une <em>requête</em>, la demande du navigateur, et renvoie une <em>réponse</em>) ; le <em>template</em> produit le HTML affiché. Les <em>URLs</em> (les adresses) aiguillent chaque adresse vers sa vue — c'est le <em>routage</em>.</p>

<h3>2. Modèle, ORM et migrations</h3>
<p>L'<strong>ORM</strong> traduit tes objets Python en ordres pour la base ; une <strong>migration</strong> est la recette qui met la base à jour.</p>
<pre class="pseudo">class Tache(models.Model):                     # un modèle = une table
    texte = models.CharField(max_length=200)   # colonne texte (chaîne courte)
    faite = models.BooleanField(default=False) # colonne booléenne (vrai/faux)

Tache.objects.create(texte="…")            # CREATE : créer un enregistrement
Tache.objects.all() / .filter(faite=False) # READ : lire (tout, ou selon un critère)
tache.save() / tache.delete()              # UPDATE / DELETE : modifier / supprimer
# makemigrations = générer la recette ; migrate = l'appliquer à la base</pre>

<h3>3. Vues, URLs et templates</h3>
<pre class="pseudo">def liste(request):                            # une vue : reçoit request, renvoie une réponse
    return render(request, "taches/liste.html", {"taches": Tache.objects.all()})  # template + contexte
# path("", views.liste, name="liste")          # le routage : l'URL vide → la vue liste
# {% for t in taches %}{{ t.texte }}{% endfor %}   # dans le template : boucle + affichage</pre>

<h3>4. Formulaires et motif PRG</h3>
<p>On récupère les données en <code>POST</code> (l'envoi d'un formulaire), on <strong>valide</strong> (on vérifie qu'elles sont correctes), on enregistre, puis on <strong>redirige</strong> — c'est le motif <strong>Post-Redirect-Get</strong>, qui évite qu'un rafraîchissement renvoie le formulaire. Le <code>ModelForm</code> génère un formulaire directement à partir d'un modèle. Le <code>{% csrf_token %}</code> protège contre l'attaque CSRF.</p>

<h3>5. Authentification et autorisation</h3>
<p><strong>Authentification</strong> = « qui es-tu ? » (<code>login</code>/<code>logout</code>, <code>@login_required</code> pour exiger d'être connecté). <strong>Autorisation</strong> = « qu'as-tu le droit de faire ? » (vérifier la propriété d'un objet, ou <code>has_perm</code> pour une permission). Le tout se vérifie côté serveur, jamais seulement dans le HTML.</p>

<h3>6. Qualité et production</h3>
<p>Tests (<code>TestCase</code>, <code>self.client</code>), interface d'admin, pagination des longues listes, API JSON pour d'autres programmes, et les réflexes de mise en ligne : <code>DEBUG=False</code>, <code>ALLOWED_HOSTS</code> renseigné, <code>SECRET_KEY</code> hors du code (variable d'environnement), requêtes efficaces (<code>select_related</code>, <code>count</code>).</p>
<div class="tip">Conseil d'examen : lis chaque question jusqu'au bout, élimine les réponses manifestement fausses, et repère les mots-clés (« côté serveur », « en une requête », « après un POST »…). Bonne chance !</div>`,

<pre class="pseudo"># models.py
class Note(models.Model):
    titre = models.CharField(max_length=120)             # titre de la note (chaîne courte)
    contenu = models.TextField()                         # contenu (texte long)
    auteur = models.ForeignKey(User, on_delete=models.CASCADE)  # propriétaire de la note

# views.py
@login_required                                          # accès réservé aux connectés
def mes_notes(request):
    notes = Note.objects.filter(auteur=request.user).order_by("-id")  # ses notes, plus récentes d'abord
    page = Paginator(notes, 5).get_page(request.GET.get("page"))      # pages de 5 notes
    return render(request, "notes/liste.html", {"page": page})        # afficher la page

# urls.py
path("notes/", views.mes_notes, name="mes_notes")        # /notes/ → vue mes_notes</pre>`,
