var DAY = {

  title: "Les URLs et le routage",
  subtitle: "Décider quelle page répond à quelle adresse.",
  theory: `
<h3>1. Le rôle du routage</h3>
<p>Rappel : une <strong>URL</strong> est l'adresse d'une page (par exemple <code>/taches/</code> ou <code>/taches/3/</code>). Quand un visiteur demande une adresse, Django doit savoir <strong>quelle fonction</strong> exécuter pour lui répondre. C'est le rôle du <strong>routage</strong> : associer une URL à une <strong>vue</strong>. Une <strong>vue</strong> (qu'on étudiera en détail leçon 3) est simplement une fonction Python qui reçoit la requête et fabrique la réponse. Pense au routage comme au <strong>standard téléphonique</strong> d'une grande entreprise : selon le numéro composé (l'URL), le standardiste transfère l'appel au bon service (la vue). Tout se configure dans les fichiers <code>urls.py</code>.</p>
<pre class="pseudo">NAVIGATEUR ── demande /taches/ ──► urls.py ── associe à ──► une VUE ── renvoie ──► une PAGE</pre>

<h3>2. Le urls.py du projet</h3>
<p>Le mot-clé <code>from ... import ...</code> est l'<strong>importation</strong> Python habituelle : on va chercher un outil dans une bibliothèque pour pouvoir l'utiliser.</p>
<pre class="pseudo"># monsite/urls.py (le fichier de routage RACINE, dans le dossier de config du projet)
from django.contrib import admin              # importe le module de l'interface d'administration
from django.urls import path, include         # path = définit une route ; include = délègue à un autre urls.py

urlpatterns = [                               # urlpatterns : la LISTE (obligatoire, ce nom exact) des routes du site
    path("admin/", admin.site.urls),          # l'adresse /admin/ mène à l'interface d'admin fournie par Django
    path("taches/", include("taches.urls")),  # tout ce qui commence par /taches/ est DÉLÉGUÉ au urls.py de l'app
]                                             # crochet fermant : fin de la liste urlpatterns</pre>
<p><code>include("taches.urls")</code> renvoie vers le fichier <code>urls.py</code> de l'application : on garde ainsi les routes de chaque app dans son propre fichier, propre et modulaire — comme un classeur où chaque intercalaire (chaque app) gère ses propres pages.</p>

<h3>3. Le urls.py de l'application</h3>
<p>Ce fichier n'existe pas par défaut dans une app : il faut le <strong>créer soi-même</strong>. Le <code>.</code> dans <code>from . import views</code> signifie « le dossier courant » (l'app elle-même).</p>
<pre class="pseudo"># taches/urls.py (fichier à créer dans le dossier de l'application)
from django.urls import path                          # importe path pour déclarer les routes
from . import views                                   # importe le fichier views.py de l'app (leçon 3)

urlpatterns = [                                        # la liste des routes propres à l'app taches
    path("", views.liste, name="liste"),              # /taches/          → vue liste ; nommée "liste"
    path("&lt;int:id&gt;/", views.detail, name="detail"),    # /taches/3/        → vue detail (reçoit l'id 3)
    path("nouvelle/", views.creer, name="creer"),      # /taches/nouvelle/ → vue creer ; nommée "creer"
]                                                      # fin de la liste des routes de l'app</pre>
<p>Chaque <code>path()</code> associe un <strong>motif d'URL</strong> (le texte à faire correspondre) à une <strong>vue</strong>. La chaîne vide <code>""</code> correspond à la racine de l'app (ici <code>/taches/</code>), car le préfixe <code>taches/</code> a déjà été consommé par le urls.py du projet.</p>

<h3>4. Les paramètres d'URL (converters)</h3>
<p>Un <strong>converter</strong> (« convertisseur ») capture un morceau variable de l'adresse et en fixe le type. La syntaxe est <code>&lt;type:nom&gt;</code>.</p>
<pre class="pseudo">path("&lt;int:id&gt;/", views.detail)       # &lt;int:id&gt; : capture un ENTIER, passé à la vue sous le nom id
path("&lt;str:nom&gt;/", views.profil)      # &lt;str:nom&gt; : capture une CHAÎNE de texte, passée sous le nom nom
path("&lt;slug:titre&gt;/", views.article)  # &lt;slug:titre&gt; : capture un « slug » (mots-en-minuscules-avec-tirets)</pre>
<p>La partie entre chevrons <code>&lt;type:nom&gt;</code> capture un morceau variable de l'URL et le passe à la vue comme paramètre. Pour <code>/taches/3/</code>, la vue <code>detail(request, id)</code> reçoit <code>id = 3</code> (un vrai entier grâce à <code>int:</code>, et non le texte "3").</p>

<h3>5. Nommer ses URLs : name=</h3>
<pre class="pseudo">path("", views.liste, name="liste")   # name="liste" : on donne un NOM à cette route pour la désigner ailleurs</pre>
<p>Le <code>name=</code> permet de désigner une URL par son nom plutôt que par son adresse en dur. Dans un <strong>template</strong> (un fichier de page, leçon 4) : <code>{% url 'liste' %}</code> génère l'adresse ; dans une vue : <code>redirect('liste')</code> renvoie l'utilisateur vers cette page. Ainsi, si l'adresse change un jour, on n'a rien à réécrire ailleurs — comme un contact enregistré dans ton téléphone : tu appelles « Maman », pas un numéro que tu devrais changer partout s'il évoluait.</p>
<div class="tip">Toujours nommer ses URLs avec <code>name=</code> : c'est LA bonne pratique. On ne code jamais une adresse « en dur » comme <code>/taches/</code> dans le HTML ; on écrit <code>{% url 'liste' %}</code>. Le jour où l'URL change, une seule ligne (le <code>path</code>) est à modifier.</div>

<h3>6. L'ordre de recherche</h3>
<pre class="pseudo">urlpatterns = [                        # la liste est parcourue DE HAUT EN BAS
    path("nouvelle/", views.creer),    # route SPÉCIFIQUE : testée en premier
    path("&lt;int:id&gt;/", views.detail),   # route GÉNÉRALE (n'importe quel entier) : placée après
]                                      # fin de la liste</pre>
<div class="warn">Django examine les motifs <strong>de haut en bas</strong> et s'arrête au PREMIER qui correspond. Place les routes spécifiques (comme <code>nouvelle/</code>) avant les routes générales (comme <code>&lt;int:id&gt;/</code>) — sinon la route générale pourrait « capturer » l'URL en premier.</div>`,
  exercises: [
    { type: "qcm", q: "Le routage sert à…", opts: ["Styliser la page", "Associer une URL à la VUE qui doit y répondre", "Créer la base", "Tester"], a: 1, exp: "URL → vue : le rôle des fichiers urls.py." },
    { type: "qcm", q: "Dans quel fichier définit-on les routes ?", opts: ["views.py", "urls.py", "models.py", "settings.py"], a: 1, exp: "urls.py (du projet et/ou de l'app)." },
    { type: "qcm", q: "<code>include(\"taches.urls\")</code> sert à…", opts: ["Importer une vue", "DÉLÉGUER un groupe d'URLs au urls.py de l'application", "Créer une table", "Lancer le serveur"], a: 1, exp: "Chaque app garde ses routes dans son propre fichier." },
    { type: "qcm", q: "Le motif <code>path(\"\", views.liste)</code> correspond à…", opts: ["Toutes les URLs", "La RACINE (chaîne vide) du préfixe de l'app", "Une erreur", "L'admin"], a: 1, exp: "\"\" = la racine, ici /taches/." },
    { type: "qcm", q: "<code>&lt;int:id&gt;</code> dans un path…", opts: ["Affiche id", "CAPTURE un entier dans l'URL et le passe à la vue en paramètre", "Crée une table", "Style"], a: 1, exp: "Pour /taches/3/, la vue reçoit id = 3 (un int)." },
    { type: "qcm", q: "Pour <code>path(\"&lt;int:id&gt;/\", views.detail)</code>, la signature de la vue est…", opts: ["def detail():", "def detail(request, id):", "def detail(id):", "def detail(request):"], a: 1, exp: "request toujours en 1er, puis les paramètres capturés." },
    { type: "qcm", q: "À quoi sert le <code>name=</code> d'un path ?", opts: ["À styliser", "À DÉSIGNER l'URL par un nom (au lieu de l'adresse en dur) dans les templates/vues", "À créer la vue", "Rien"], a: 1, exp: "{% url 'liste' %} ou redirect('liste')." },
    { type: "qcm", q: "Dans un template, générer l'URL nommée « liste » :", opts: ["/taches/", "{% url 'liste' %}", "url(liste)", "href liste"], a: 1, exp: "On évite l'adresse en dur : {% url 'nom' %}." },
    { type: "qcm", q: "Pourquoi éviter les adresses « en dur » (/taches/) dans le HTML ?", opts: ["Plus lent", "Si l'URL change, il faudrait tout réécrire ; avec name=, une seule ligne change", "Interdit", "Aucune raison"], a: 1, exp: "Le nommage centralise l'adresse dans le path." },
    { type: "qcm", q: "Django examine les motifs d'URL…", opts: ["Au hasard", "De haut en bas, s'arrête au PREMIER qui correspond", "De bas en haut", "Tous à la fois"], a: 1, exp: "L'ordre compte : spécifique avant général." },
    { type: "qcm", q: "Pourquoi placer <code>nouvelle/</code> avant <code>&lt;int:id&gt;/</code> ?", opts: ["Esthétique", "Sinon <int:id> pourrait capturer l'URL en premier (règle : spécifique avant général)", "Aucune importance", "int est plus lent"], a: 1, exp: "L'ordre de recherche : les routes précises d'abord." },
    { type: "qcm", q: "<code>&lt;slug:titre&gt;</code> capture…", opts: ["Un entier", "Un « slug » : des mots-en-minuscules-séparés-par-des-tirets", "Une date", "Un fichier"], a: 1, exp: "Utile pour des URLs lisibles : /articles/mon-super-titre/." },
    { type: "qcm", q: "Le urls.py du PROJET délègue à l'app avec…", opts: ["path(\"taches/\", views.liste)", "path(\"taches/\", include(\"taches.urls\"))", "import taches", "startapp"], a: 1, exp: "include renvoie vers le urls.py de l'application." },
    { type: "vf", q: "Chaque application peut avoir son propre fichier urls.py, inclus dans celui du projet.", a: true, exp: "C'est la structure modulaire recommandée." },
    { type: "qcm", q: "Le flux complet d'une requête débute par…", opts: ["Le template", "L'URL demandée → urls.py → la vue → la réponse", "La base de données", "Le CSS"], a: 1, exp: "Le routage est la première étape après la requête." }
  ],
  final: {
    title: "Exercice final — Le routage de la todo-liste",
    intro: `<p>On met en place les routes de l'app taches :</p>
<pre class="pseudo"># taches/urls.py

      { type: "qcm", q: "L'URL <code>/taches/5/terminer/</code> appelle <code>terminer</code> avec…", opts: ["rien", "id = 5 (capturé par <int:id>)", "id = \"5\" (une chaîne)", "terminer = 5"], a: 1, exp: "<int:id> capture 5 comme entier." },
      { type: "qcm", q: "La signature correcte de la vue terminer :", opts: ["def terminer():", "def terminer(request, id):", "def terminer(id):", "def terminer(request):"], a: 1, exp: "request puis le paramètre id capturé dans l'URL." },
      { type: "qcm", q: "Dans un template, le lien vers la liste s'écrit :", opts: ["href=\"/taches/\"", "{% url 'liste' %}", "url(liste)", "{{ liste }}"], a: 1, exp: "On utilise le nom de la route, pas l'adresse en dur." },

  }
};
