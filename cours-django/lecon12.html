<h3>1. Pourquoi les Django Forms ?</h3>
<p>À la leçon 6, on écrivait le HTML du formulaire à la main et on validait chaque champ dans la vue. <strong>Valider</strong>, c'est vérifier que les données reçues sont correctes (champ non vide, bon format, longueur suffisante…). Les <strong>Django Forms</strong> (« formulaires Django ») sont des classes Python qui automatisent tout : elles <strong>génèrent</strong> le HTML des champs, <strong>valident</strong> les données envoyées, et <strong>affichent les erreurs</strong> à côté des champs fautifs. Résultat : moins de code, plus de sécurité — comme un formulaire administratif intelligent qui refuse lui-même une case mal remplie et te dit pourquoi.</p>

<h3>2. Un formulaire simple : forms.Form</h3>
<p>Un <strong>champ</strong> de formulaire (<em>field</em>) décrit une case à remplir et ses règles. Le mot <code>label</code> est l'étiquette affichée devant le champ.</p>
<pre class="pseudo"># taches/forms.py (le fichier des formulaires de l'app, à créer)
from django import forms                                     # importe la boîte à outils des formulaires

class TacheForm(forms.Form):                                 # un formulaire = une classe héritant de forms.Form
    texte = forms.CharField(max_length=200, label="Tâche")   # un champ texte (200 car. max), étiquette "Tâche"
    urgent = forms.BooleanField(required=False)              # une case à cocher ; required=False = facultative</pre>
<p>Chaque attribut décrit un champ, avec ses règles (longueur max, obligatoire ou non…). Django en déduit à la fois le HTML ET la validation.</p>

<h3>3. Le ModelForm : le formulaire depuis un modèle</h3>
<p>La classe interne <code>Meta</code> (« métadonnées », les informations qui décrivent le formulaire) indique de quel modèle partir et quels champs reprendre.</p>
<pre class="pseudo"># Encore plus court : un formulaire GÉNÉRÉ automatiquement à partir du modèle Tache
class TacheForm(forms.ModelForm):      # ModelForm : formulaire construit depuis un modèle
    class Meta:                        # Meta : la configuration du ModelForm
        model = Tache                  # model : le modèle source (la table Tache)
        fields = ["texte", "faite"]    # fields : la liste des champs à inclure dans le formulaire</pre>
<div class="tip">Le <code>ModelForm</code> génère un formulaire directement à partir d'un modèle : les champs, leurs types et leurs validations sont déduits automatiquement. Il sait même <strong>enregistrer</strong> l'objet en base (<code>form.save()</code>). C'est l'outil de choix pour créer/modifier des enregistrements.</div>

<h3>4. Utiliser le formulaire dans la vue</h3>
<pre class="pseudo">def creer(request):
    if request.method == "POST":            # si le formulaire a été envoyé…
        form = TacheForm(request.POST)      # on construit le form en le REMPLISSANT avec les données reçues
        if form.is_valid():                 # is_valid() : VALIDE automatiquement tous les champs
            form.save()                     # (ModelForm) enregistre la tâche en base de données
            return redirect("liste")        # PRG : rediriger après succès
    else:                                   # sinon (méthode GET, première visite)…
        form = TacheForm()                  # on crée un formulaire VIDE à remplir
    return render(request, "taches/creer.html", {"form": form})  # on affiche le form (vide, ou avec ses erreurs)</pre>
<p>Le motif est toujours le même : en POST, on remplit le form et on teste <code>is_valid()</code> ; si oui, on enregistre et on redirige ; sinon (ou en GET), on ré-affiche le formulaire — avec ses erreurs.</p>

<h3>5. Afficher le formulaire dans le template</h3>
<pre class="pseudo">&lt;form method="post"&gt;                         &lt;!-- envoi de données --&gt;
    {% csrf_token %}                          &lt;!-- protection anti-CSRF, toujours obligatoire --&gt;
    {{ form.as_p }}                           &lt;!-- affiche TOUS les champs (chacun dans un &lt;p&gt;), avec labels et erreurs --&gt;
    &lt;button type="submit"&gt;Enregistrer&lt;/button&gt; &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;                                       &lt;!-- fin du formulaire --&gt;</pre>
<p><code>{{ form.as_p }}</code> génère automatiquement les champs, leurs labels ET les messages d'erreur. Variantes : <code>{{ form.as_table }}</code> (en tableau), <code>{{ form.as_ul }}</code> (en liste), ou champ par champ avec <code>{{ form.texte }}</code> pour un contrôle total de la mise en page.</p>

<h3>6. La validation et les erreurs</h3>
<p><code>cleaned_data</code> (« données nettoyées ») est le dictionnaire des valeurs déjà validées et converties au bon type. Une <code>ValidationError</code> est l'exception qu'on lève pour signaler une donnée invalide.</p>
<pre class="pseudo"># Après form.is_valid() == True :
form.cleaned_data["texte"]     # les données NETTOYÉES et converties (au bon type), pas les données brutes

# Validation PERSONNALISÉE dans le formulaire :
class TacheForm(forms.ModelForm):
    class Meta:
        model = Tache                  # modèle source
        fields = ["texte"]             # champ inclus
    def clean_texte(self):                       # clean_<champ> : validation sur mesure du champ "texte"
        texte = self.cleaned_data["texte"]       # on récupère la valeur nettoyée du champ
        if len(texte) &lt; 3:                        # si le texte fait moins de 3 caractères…
            raise forms.ValidationError("Trop court (3 caractères minimum)")  # …on signale l'erreur
        return texte                             # sinon on renvoie la valeur validée</pre>
