<h3>1. Qu'est-ce qu'une vue ?</h3>
<p>Une <strong>vue</strong> (en anglais <em>view</em>) est une fonction Python qui reçoit une <strong>requête</strong> et renvoie une <strong>réponse</strong>. Rappel : la <em>requête</em> est la demande envoyée par le navigateur, la <em>réponse</em> est ce que le serveur renvoie (souvent une page HTML). La vue est le <strong>cerveau</strong> de l'opération : elle traite la demande (lire la base, valider un formulaire…) puis produit la page. Pense à la vue comme au <strong>cuisinier</strong> d'un restaurant : le serveur (le routage) lui apporte la commande (la requête), il prépare le plat (traitement) et le renvoie (la réponse). Chaque URL (leçon 2) pointe vers une vue.</p>
<pre class="pseudo"># taches/views.py (le fichier des vues de l'application)
from django.http import HttpResponse       # HttpResponse : l'objet "réponse" le plus simple (du texte brut)

def liste(request):                        # def = on définit une fonction ; une vue reçoit TOUJOURS request en 1er
    return HttpResponse("Bonjour depuis Django !")   # return : on renvoie une réponse contenant ce texte</pre>
<p>Le paramètre <code>request</code> est un objet qui contient tout sur la demande : la méthode (GET/POST, voir plus bas), les données envoyées, l'utilisateur connecté… La vue doit <strong>renvoyer</strong> (mot-clé <code>return</code>) un objet réponse — le plus souvent via <code>render</code> (section 4).</p>

<h3>2. Recevoir les paramètres d'URL</h3>
<p>Une <strong>f-string</strong> (le <code>f</code> collé devant les guillemets) est un texte Python dans lequel on insère une variable en l'entourant d'accolades <code>{ }</code>.</p>
<pre class="pseudo">def detail(request, id):                   # id est le morceau &lt;int:id&gt; capturé dans l'URL (leçon 2)
    return HttpResponse(f"Tâche numéro {id}")  # f"..." : on insère la valeur de id dans le texte</pre>
<p>Les morceaux capturés dans l'URL (comme <code>&lt;int:id&gt;</code>) arrivent en paramètres de la vue, APRÈS <code>request</code>. L'ordre est imposé : <code>request</code> d'abord, puis les paramètres d'URL dans l'ordre où ils apparaissent.</p>

<h3>3. Réagir selon la méthode HTTP</h3>
<p>Chaque requête HTTP a une <strong>méthode</strong>, un mot qui dit l'intention : <strong>GET</strong> (« donne-moi la page », une simple visite) ou <strong>POST</strong> (« voici des données à traiter », l'envoi d'un formulaire). C'est comme la différence entre consulter un formulaire papier (GET) et le déposer rempli dans une boîte (POST).</p>
<pre class="pseudo">def creer(request):                        # une seule vue gère l'affichage ET le traitement du formulaire
    if request.method == "POST":           # SI la requête est un envoi de formulaire…
        texte = request.POST["texte"]      # …on lit le champ nommé "texte" envoyé par l'utilisateur
        # ... enregistrer la tâche ...      # (ici, on sauvegarderait la tâche dans la base)
        return HttpResponse("Créée !")     # on confirme la création
    # sinon (méthode GET) : on affiche simplement le formulaire vide
    return HttpResponse("Formulaire à afficher")   # réponse du cas GET</pre>
<p><code>request.method</code> vaut <code>"GET"</code> (simple visite) ou <code>"POST"</code> (envoi de formulaire). <code>request.POST</code> et <code>request.GET</code> sont des <strong>dictionnaires</strong> (des tableaux clé → valeur) contenant les données — exactement les <code>$_POST</code>/<code>$_GET</code> de PHP, en version Python.</p>

<h3>4. render : la vue qui affiche un template</h3>
<p>Un <strong>template</strong> (leçon 4) est un modèle de page HTML à trous, dans lequel Django vient insérer des données. Le <strong>contexte</strong> est le sac de données qu'on lui transmet.</p>
<pre class="pseudo">from django.shortcuts import render        # render : raccourci qui remplit un template avec des données

def liste(request):
    taches = ["Réviser", "Coder", "Dormir"]  # des données (bientôt lues depuis la base de données)
    return render(request, "taches/liste.html", {"taches": taches})
    #             ^la requête ^le fichier template  ^le CONTEXTE (dictionnaire de données pour le template)</pre>
<p><code>render</code> combine trois choses : la requête, un <strong>template</strong> HTML, et un <strong>contexte</strong> (un dictionnaire dont les clés deviendront des variables utilisables dans le template). C'est la façon standard de produire une page.</p>

<h3>5. Rediriger : redirect</h3>
<pre class="pseudo">from django.shortcuts import redirect      # redirect : renvoie le navigateur vers une AUTRE adresse

def terminer(request, id):
    # ... marquer la tâche comme faite ...  # (traitement de l'action)
    return redirect("liste")               # renvoie le navigateur vers l'URL NOMMÉE « liste » (leçon 2)</pre>
<p>Après une action qui modifie des données (créer, supprimer…), on <strong>redirige</strong> vers une autre page plutôt que d'afficher directement : cela évite les envois en double si l'utilisateur recharge la page (le motif appelé « <em>Post-Redirect-Get</em> »). C'est comme, après avoir posté une lettre, revenir à l'accueil plutôt que de rester devant la boîte à lettres.</p>

<h3>6. get_object_or_404 : gérer l'absence</h3>
<p>Une <strong>erreur 404</strong> est le code standard du web pour « page/ressource introuvable ».</p>
<pre class="pseudo">from django.shortcuts import get_object_or_404   # raccourci : "récupère l'objet, ou renvoie une 404"
from .models import Tache                          # importe le modèle Tache (la table, leçon 9)

def detail(request, id):
    tache = get_object_or_404(Tache, id=id)        # cherche la Tache dont id vaut la valeur reçue…
    return render(request, "taches/detail.html", {"tache": tache})  # …et l'affiche dans le template</pre>
<div class="tip"><code>get_object_or_404</code> est un raccourci très courant : il récupère un objet de la base ou affiche automatiquement une page « 404 Introuvable » si l'identifiant n'existe pas. Plus propre qu'un try/except à la main.</div>
<div class="warn">Une vue DOIT toujours renvoyer une réponse (via <code>HttpResponse</code>, <code>render</code> ou <code>redirect</code>). Oublier le <code>return</code> renvoie <code>None</code> → Django lève l'erreur « The view didn't return an HttpResponse object ».</div>`,

<pre class="pseudo"># taches/views.py
from django.shortcuts import render, redirect, get_object_or_404  # trois raccourcis utiles
from .models import Tache                                          # le modèle Tache (la table)

def liste(request):
    taches = Tache.objects.all()                                  # récupère TOUTES les tâches de la base
    return render(request, "taches/liste.html", {"taches": taches})  # affiche le template avec ces tâches

def terminer(request, id):
    tache = get_object_or_404(Tache, id=id)                       # la tâche d'id donné, ou 404
    tache.faite = True                                            # on coche l'attribut "faite"
    tache.save()                                                  # save() enregistre le changement en base
    return redirect("liste")                                      # on revient à la liste</pre>`,

def terminer(request, id):

    tache.faite = True                                 # modifier l'attribut en mémoire

    return redirect("liste")                           # rediriger vers la liste
# request → traitement → render/redirect : le cycle d'une vue.</pre>
