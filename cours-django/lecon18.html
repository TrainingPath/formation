<h3>1. À quoi sert une API ?</h3>
<p>Une <strong>API</strong> (<em>Application Programming Interface</em>, « interface de programmation ») est une porte par laquelle un programme parle à un autre programme. Jusqu'ici, tes vues renvoyaient du <strong>HTML</strong> destiné à un humain qui lit une page. Une API, elle, renvoie des <strong>données</strong> brutes (souvent au format JSON) destinées à une machine : une application mobile, un site en JavaScript, un autre serveur. Image : un restaurant a une salle (le HTML, pour les clients) et un guichet « à emporter » (l'API, pour ceux qui repartent avec les données). Même cuisine, deux façons de servir.</p>

<h3>2. Le JSON en deux mots</h3>
<pre class="pseudo">{
  "id": 1,                        # une paire clé/valeur : ici l'identifiant
  "texte": "Réviser Django",      # le texte, entre guillemets (une chaîne)
  "faite": false                  # un booléen (true/false en JSON, sans majuscule)
}</pre>
<p>Le <strong>JSON</strong> (<em>JavaScript Object Notation</em>) est un format texte universel : des paires clé/valeur entre accolades, des listes entre crochets, des nombres, des booléens. Presque tous les langages savent le lire et l'écrire, ce qui en fait la langue commune des API.</p>

<h3>3. Une mini-API sans rien installer : JsonResponse</h3>
<p><strong>Sérialiser</strong>, c'est transformer des objets en un texte transmissible (ici du JSON). <code>.values(...)</code> renvoie les données sous forme de dictionnaires, directement sérialisables.</p>
<pre class="pseudo">from django.http import JsonResponse                              # JsonResponse : une réponse au format JSON

def api_taches(request):
    taches = Tache.objects.all().values("id", "texte", "faite")   # renvoie une liste de dictionnaires
    return JsonResponse(list(taches), safe=False)                 # list() puis JSON ; safe=False pour une liste</pre>
<div class="tip"><code>JsonResponse</code> transforme un dictionnaire (ou une liste) Python en réponse JSON, avec le bon en-tête <code>Content-Type: application/json</code> (l'étiquette qui dit au destinataire « ceci est du JSON »). Pour une LISTE, on ajoute <code>safe=False</code>. C'est parfait pour un besoin simple.</div>

<h3>4. Pour aller plus loin : Django REST Framework (DRF)</h3>
<p><strong>REST</strong> est un ensemble de conventions répandues pour organiser une API autour des ressources et des méthodes HTTP. Dès que l'API grandit (validation, pagination, authentification, toutes les méthodes CRUD), on installe <strong>Django REST Framework</strong>, l'outil de référence. Il ajoute deux briques : le <em>serializer</em> et les <em>vues d'API</em>.</p>
<pre class="pseudo">pip install djangorestframework          # installe la bibliothèque DRF
# puis ajouter "rest_framework" dans la liste INSTALLED_APPS de settings.py</pre>

<h3>5. Le serializer : traduire modèle ⇄ JSON</h3>
<pre class="pseudo"># taches/serializers.py (fichier à créer)
from rest_framework import serializers          # importe les outils de sérialisation de DRF
from .models import Tache                        # le modèle à exposer

class TacheSerializer(serializers.ModelSerializer):   # ModelSerializer : sérialiseur déduit d'un modèle
    class Meta:                                  # configuration du sérialiseur
        model = Tache                            # à partir de CE modèle
        fields = ["id", "texte", "faite"]        # exposer CES champs en JSON</pre>
<p>Un <strong>serializer</strong> (« sérialiseur ») convertit un objet Django en JSON (et inversement le JSON reçu en objet), en validant les données au passage. Le <code>ModelSerializer</code> le déduit automatiquement du modèle — exactement comme le <code>ModelForm</code> pour les formulaires (leçon 12).</p>

<h3>6. La vue d'API : un ViewSet</h3>
<p>Un <strong>ViewSet</strong> regroupe en une classe toutes les vues liées à une ressource ; un <strong>routeur</strong> génère automatiquement leurs URLs.</p>
<pre class="pseudo"># taches/views.py
from rest_framework import viewsets             # importe les ViewSets de DRF
from .models import Tache                        # le modèle
from .serializers import TacheSerializer         # le sérialiseur créé ci-dessus

class TacheViewSet(viewsets.ModelViewSet):       # ModelViewSet : fournit le CRUD complet automatiquement !
    queryset = Tache.objects.all()               # queryset : les objets exposés par l'API
    serializer_class = TacheSerializer           # serializer_class : comment les traduire en JSON</pre>
<pre class="pseudo"># urls.py — le routeur crée toutes les URLs de l'API tout seul
from rest_framework.routers import DefaultRouter   # importe le routeur automatique
router = DefaultRouter()                            # crée un routeur
router.register("taches", TacheViewSet)             # enregistre le ViewSet sous le préfixe "taches"
urlpatterns = [ path("api/", include(router.urls)) ]  # branche les URLs générées sous /api/</pre>
<div class="tip">Un <code>ModelViewSet</code> + un routeur donnent AUTOMATIQUEMENT toutes les routes CRUD : lister (GET), créer (POST), détailler (GET id), modifier (PUT/PATCH), supprimer (DELETE). Quelques lignes = une API complète.</div>

<h3>7. Les méthodes HTTP d'une API REST</h3>
<p>Chaque <strong>méthode HTTP</strong> exprime une intention sur une <em>ressource</em> (ici une tâche).</p>
<pre class="pseudo">GET     /api/taches/       # lister toutes les tâches
POST    /api/taches/       # créer une tâche (les données JSON sont dans le corps de la requête)
GET     /api/taches/1/     # détailler la tâche d'id 1
PUT     /api/taches/1/     # remplacer entièrement la tâche 1
DELETE  /api/taches/1/     # supprimer la tâche 1</pre>
<div class="warn">Une API n'a pas de page de connexion : on ne PROTÈGE pas de la même façon. DRF fournit ses propres classes de permission (par ex. <code>IsAuthenticated</code>, « utilisateur authentifié requis ») à déclarer sur les vues. Ne laisse jamais une API modifier des données sans authentification appropriée.</div>`,
