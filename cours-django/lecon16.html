  title: "L'authentification",
  subtitle: "Gérer les comptes et les connexions, sans réinventer la roue.",
  theory: `
<h3>1. L'authentification « batteries incluses »</h3>
<p>L'<strong>authentification</strong> est le fait de vérifier l'identité d'une personne (« es-tu bien qui tu prétends être ? »), typiquement via un identifiant et un mot de passe — comme montrer sa carte à l'entrée. Django fournit un système d'authentification complet : un modèle <strong>User</strong> (utilisateur), le <strong>hachage</strong> sécurisé des mots de passe, les vues de connexion/déconnexion… Tout est prêt dans <code>django.contrib.auth</code> (déjà présent dans <code>INSTALLED_APPS</code>). On ne code presque rien.</p>

<h3>2. Le modèle User et le superutilisateur</h3>
<p>Le <strong>hachage</strong> transforme un mot de passe en une empreinte illisible et irréversible : on peut vérifier un mot de passe sans jamais le stocker en clair. Un <strong>superutilisateur</strong> est un compte administrateur qui a tous les droits.</p>
<pre class="pseudo">from django.contrib.auth.models import User               # User : le modèle d'utilisateur fourni par Django

User.objects.create_user("ana", password="secret123")    # crée un utilisateur ; le mot de passe est HACHÉ
User.objects.get(username="ana")                          # récupère cet utilisateur par son nom</pre>
<pre class="pseudo"># Dans le terminal, créer un compte administrateur (superutilisateur) :
python manage.py createsuperuser   # demande un nom, un email et un mot de passe</pre>
<div class="warn">Ne stocke JAMAIS un mot de passe en clair. <code>create_user</code> le <strong>hache</strong> automatiquement (algorithme sécurisé) : même toi ne peux pas le relire. C'est une protection essentielle offerte par Django — n'écris jamais ton propre système de mots de passe.</div>

<h3>3. Connexion et déconnexion</h3>
<p><code>authenticate</code> vérifie le couple identifiant/mot de passe, <code>login</code> ouvre la session (connecte), <code>logout</code> la ferme (déconnecte).</p>
<pre class="pseudo">from django.contrib.auth import authenticate, login, logout   # les trois outils de connexion

def connexion(request):
    if request.method == "POST":                    # si le formulaire de connexion est envoyé…
        user = authenticate(                        # authenticate : vérifie identifiant + mot de passe
            username=request.POST["username"],      # le nom saisi
            password=request.POST["password"])      # le mot de passe saisi
        if user is not None:                        # si les identifiants sont corrects (user trouvé)…
            login(request, user)                    # login : OUVRE la session, l'utilisateur est connecté
            return redirect("liste")                # on l'emmène vers sa liste
    return render(request, "taches/connexion.html") # GET ou échec : afficher le formulaire

def deconnexion(request):
    logout(request)                                 # logout : FERME la session (déconnexion)
    return redirect("liste")                        # retour à la page publique</pre>
<p>Django propose aussi des vues toutes faites (<code>LoginView</code>, <code>LogoutView</code>) qu'il suffit de câbler dans les URLs, avec un template de connexion — encore moins de code.</p>

<h3>4. request.user : qui est connecté ?</h3>
<p><code>AnonymousUser</code> est l'objet « visiteur anonyme » que Django met à la place d'un vrai utilisateur quand personne n'est connecté : ainsi <code>request.user</code> existe toujours.</p>
<pre class="pseudo">request.user                        # l'utilisateur courant (ou AnonymousUser si personne n'est connecté)
request.user.is_authenticated       # renvoie True si un utilisateur est connecté, False sinon
request.user.username               # le nom de l'utilisateur connecté
# Disponible aussi dans TOUS les templates via la variable {{ user }} (leçon 5)</pre>
<pre class="pseudo">{% if user.is_authenticated %}                                       &lt;!-- si connecté… --&gt;
    Bonjour {{ user.username }} — &lt;a href="{% url 'deconnexion' %}"&gt;Se déconnecter&lt;/a&gt;  &lt;!-- nom + lien de déconnexion --&gt;
{% else %}                                                          &lt;!-- sinon (anonyme)… --&gt;
    &lt;a href="{% url 'connexion' %}"&gt;Se connecter&lt;/a&gt;               &lt;!-- lien vers la connexion --&gt;
{% endif %}                                                         &lt;!-- fin de la condition --&gt;</pre>

<h3>5. Protéger une vue : @login_required</h3>
<p>Un <strong>décorateur</strong> est un mot précédé de <code>@</code>, posé au-dessus d'une fonction pour lui ajouter un comportement sans en modifier le corps — ici, exiger d'être connecté.</p>
<pre class="pseudo">from django.contrib.auth.decorators import login_required   # importe le décorateur

@login_required                     # DÉCORATEUR : cette vue exige d'être CONNECTÉ
def liste(request):
    taches = Tache.objects.filter(utilisateur=request.user)   # ne garde que les tâches de CET utilisateur
    return render(request, "taches/liste.html", {"taches": taches})  # les afficher</pre>
<div class="tip">Le décorateur <code>@login_required</code> placé au-dessus d'une vue redirige automatiquement vers la page de connexion si le visiteur n'est pas authentifié. Une seule ligne remplace tout un contrôle d'accès manuel. C'est le portier automatique de Django.</div>

<h3>6. Relier les données à l'utilisateur</h3>
<pre class="pseudo">class Tache(models.Model):
    texte = models.CharField(max_length=200)                          # texte de la tâche
    utilisateur = models.ForeignKey(User, on_delete=models.CASCADE)   # chaque tâche appartient à un utilisateur

# à la création, on associe l'utilisateur connecté :
Tache.objects.create(texte=..., utilisateur=request.user)   # la tâche est reliée à son créateur</pre>
<p>Pour que chaque personne ne voie QUE ses propres tâches, on relie le modèle à <code>User</code> par une ForeignKey (leçon 11), puis on filtre sur <code>request.user</code>. C'est ainsi qu'une todo-liste devient multi-utilisateurs.</p>`,

    { type: "qcm", q: "Django propose aussi des vues toutes faites pour la connexion :", opts: ["Non", "Oui : LoginView / LogoutView, à câbler dans les URLs", "Seulement l'admin", "Uniquement l'API"], a: 1, exp: "Encore moins de code à écrire." },

    intro: `<p>On rend la todo-liste personnelle :</p>
<pre class="pseudo">from django.contrib.auth.decorators import login_required   # le décorateur de protection

@login_required                                             # accès réservé aux connectés
def liste(request):
    taches = Tache.objects.filter(utilisateur=request.user)  # seulement les tâches de l'utilisateur
    return render(request, "taches/liste.html", {"taches": taches})  # afficher

@login_required                                             # accès réservé aux connectés
def creer(request):
    if request.method == "POST":                            # si envoi du formulaire
        Tache.objects.create(
            texte=request.POST.get("texte", ""),            # le texte saisi
