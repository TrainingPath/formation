<h3>1. Le plan de montage</h3>
<p>Aujourd'hui, on relie toutes les briques vues depuis le début : projet et app, modèle, migrations, URLs, vues, templates, formulaire, connexion et données par utilisateur. Rien de nouveau à apprendre — c'est un exercice d'<strong>assemblage</strong>, comme monter un meuble dont on a déjà toutes les pièces, dans le bon ordre.</p>

<h3>2. Créer le projet et l'app</h3>
<pre class="pseudo">django-admin startproject monsite          # crée le PROJET (la config générale)
cd monsite                                  # on entre dans le dossier du projet
python manage.py startapp taches            # crée l'APPLICATION « taches »
# puis ajouter "taches" dans la liste INSTALLED_APPS (settings.py)</pre>

<h3>3. Le modèle (taches/models.py)</h3>
<pre class="pseudo">from django.db import models                            # boîte à outils des modèles
from django.contrib.auth.models import User             # le modèle User (pour relier chaque tâche à un compte)

class Tache(models.Model):                              # le modèle = la table Tache
    texte = models.CharField(max_length=200)            # le libellé de la tâche (chaîne courte)
    faite = models.BooleanField(default=False)          # terminée ? (booléen, False au départ)
    date_creation = models.DateTimeField(auto_now_add=True)  # date fixée automatiquement à la création
    utilisateur = models.ForeignKey(User, on_delete=models.CASCADE)  # le propriétaire (CASCADE : supprimé avec lui)

    def __str__(self):                                  # affichage lisible de l'objet
        return self.texte                               # renvoie le texte de la tâche</pre>
<pre class="pseudo">python manage.py makemigrations     # génère la recette de modification de la base
python manage.py migrate            # applique la recette : crée réellement la table</pre>

<h3>4. Les URLs (taches/urls.py)</h3>
<pre class="pseudo">from django.urls import path                            # path : déclare une route
from . import views                                     # importe les vues de l'app

urlpatterns = [                                          # la liste des routes de l'app
    path("", views.liste, name="liste"),                       # /taches/ → liste
    path("nouvelle/", views.creer, name="creer"),              # /taches/nouvelle/ → creer
    path("&lt;int:id&gt;/basculer/", views.basculer, name="basculer"),    # /taches/N/basculer/ → cocher/décocher
    path("&lt;int:id&gt;/supprimer/", views.supprimer, name="supprimer"), # /taches/N/supprimer/ → supprimer
]                                                        # fin de la liste
# et penser à include("taches.urls") dans le urls.py du projet</pre>

<h3>5. Les vues (taches/views.py)</h3>
<p>La fonction <code>_ma_tache</code> (le tiret bas initial signale un usage interne) évite de répéter le même contrôle dans chaque vue : c'est le principe DRY (« ne te répète pas »).</p>
<pre class="pseudo">from django.shortcuts import render, redirect, get_object_or_404  # raccourcis de vue
from django.http import HttpResponseForbidden                     # réponse 403 (interdit)
from django.contrib.auth.decorators import login_required         # décorateur "connecté requis"
from .models import Tache                                         # le modèle

@login_required                                                   # accès réservé aux connectés
def liste(request):
    taches = Tache.objects.filter(utilisateur=request.user).order_by("-date_creation")  # ses tâches, récentes d'abord
    return render(request, "taches/liste.html", {"taches": taches})   # afficher

@login_required
def creer(request):
    if request.method == "POST":                          # si envoi du formulaire
        texte = request.POST.get("texte", "").strip()     # lire + nettoyer le champ
        if texte:                                         # on ignore une saisie vide
            Tache.objects.create(texte=texte, utilisateur=request.user)  # créer, reliée à l'utilisateur
        return redirect("liste")                          # PRG : rediriger après POST
    return render(request, "taches/creer.html")           # GET : afficher le formulaire

def _ma_tache(request, id):                               # petit assistant réutilisé par plusieurs vues
    tache = get_object_or_404(Tache, id=id)               # la tâche existe ? sinon 404
    if tache.utilisateur != request.user:                 # est-ce la sienne ?
        return None                                       # non : on signale "pas autorisé"
    return tache                                          # oui : on renvoie la tâche

@login_required
def basculer(request, id):
    tache = _ma_tache(request, id)                        # récupérer sa tâche (ou None)
    if tache is None:                                     # si ce n'est pas la sienne…
        return HttpResponseForbidden("Interdit")          # …403
    tache.faite = not tache.faite                         # not inverse le booléen : coche ↔ décoche
    tache.save()                                          # enregistrer
    return redirect("liste")                              # rediriger

@login_required
def supprimer(request, id):
    tache = _ma_tache(request, id)                        # récupérer sa tâche (ou None)
    if tache is None:                                     # si ce n'est pas la sienne…
        return HttpResponseForbidden("Interdit")          # …403
    tache.delete()                                        # supprimer
    return redirect("liste")                              # rediriger</pre>

<h3>6. Les templates</h3>
<pre class="pseudo">{# taches/liste.html #}
&lt;h1&gt;Mes tâches&lt;/h1&gt;                                     &lt;!-- titre de la page --&gt;
&lt;a href="{% url 'creer' %}"&gt;+ Nouvelle tâche&lt;/a&gt;        &lt;!-- lien vers le formulaire de création --&gt;
&lt;ul&gt;                                                   &lt;!-- liste à puces --&gt;
{% for tache in taches %}                              &lt;!-- pour chaque tâche de l'utilisateur --&gt;
  &lt;li&gt;                                                 &lt;!-- une ligne par tâche --&gt;
    &lt;a href="{% url 'basculer' tache.id %}"&gt;{% if tache.faite %}[x]{% else %}[ ]{% endif %}&lt;/a&gt;  &lt;!-- case cliquable [x]/[ ] --&gt;
    {{ tache.texte }}                                  &lt;!-- le texte de la tâche --&gt;
    &lt;a href="{% url 'supprimer' tache.id %}"&gt;supprimer&lt;/a&gt;  &lt;!-- lien de suppression --&gt;
  &lt;/li&gt;                                                &lt;!-- fin de la ligne --&gt;
{% empty %}                                            &lt;!-- si la liste est vide… --&gt;
  &lt;li&gt;Aucune tâche pour l'instant.&lt;/li&gt;                &lt;!-- …message d'accueil --&gt;
{% endfor %}                                           &lt;!-- fin de la boucle --&gt;
&lt;/ul&gt;                                                  &lt;!-- fin de la liste --&gt;</pre>
<div class="tip">Le tag <code>{% empty %}</code> dans une boucle <code>{% for %}</code> s'affiche quand la liste est vide : un message d'accueil bien plus agréable qu'une page blanche. Petit détail, grande différence pour l'utilisateur.</div>

<h3>7. Ce que ça donne</h3>
<p>Chaque personne connectée voit SES tâches, peut en ajouter, les cocher/décocher, les supprimer — et personne ne touche à celles des autres. Modèle, migrations, URLs, vues, templates, authentification, autorisation : la todo-liste réunit tout le cours en une application cohérente et sûre.</p>
<div class="warn">Avant toute mise en ligne : passe <code>DEBUG = False</code>, renseigne <code>ALLOWED_HOSTS</code>, garde la <code>SECRET_KEY</code> hors du code (variable d'environnement, leçon 14) et lance <code>python manage.py test</code>. Une app finie, c'est aussi une app déployée proprement.</div>`,
