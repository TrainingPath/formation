  subtitle: "Être connecté ne suffit pas toujours : qui a le droit de faire quoi ?",
  theory: `
<h3>1. Authentification ≠ autorisation</h3>
<p>Deux notions à ne pas confondre. L'<strong>authentification</strong> (leçon 16) répond à « <strong>qui es-tu ?</strong> » : elle vérifie l'identité. L'<strong>autorisation</strong> répond à « <strong>qu'as-tu le droit de faire ?</strong> » : elle vérifie les permissions. Analogie : à l'aéroport, montrer sa carte d'identité, c'est l'authentification ; avoir un billet valable pour CE vol, c'est l'autorisation. Un utilisateur connecté n'a pas forcément tous les droits : il peut voir ses tâches mais pas celles des autres, un simple membre ne peut pas supprimer, etc.</p>

<h3>2. Le cas le plus courant : « c'est bien à moi ? »</h3>
<pre class="pseudo">from django.shortcuts import get_object_or_404      # récupérer un objet ou renvoyer 404

@login_required                                     # 1) exiger d'être connecté
def supprimer(request, id):
    tache = get_object_or_404(Tache, id=id)         # 2) la tâche existe ? sinon 404
    if tache.utilisateur != request.user:           # 3) est-ce MA tâche ? (!= veut dire "différent de")
        return HttpResponseForbidden("Interdit")    #    sinon on renvoie une erreur 403 (interdit)
    tache.delete()                                  # 4) c'est bien la mienne : je la supprime
    return redirect("liste")                        # 5) retour à la liste</pre>
<div class="tip">La règle d'or : ne fais jamais confiance à l'identifiant reçu. Même connecté, un utilisateur pourrait taper l'URL <code>/taches/42/supprimer/</code> d'une tâche qui n'est pas la sienne. On VÉRIFIE toujours <code>tache.utilisateur == request.user</code> avant d'agir.</div>

<h3>3. Les codes HTTP de refus</h3>
<pre class="pseudo">401  # non authentifié (pas connecté)     → on redirige vers la page de connexion
403  # authentifié mais NON AUTORISÉ       → HttpResponseForbidden (interdit)
404  # ressource introuvable (ou cachée)   → get_object_or_404</pre>
<p><strong>401</strong> dit « connecte-toi », <strong>403</strong> dit « toi, tu n'as pas le droit ». On renvoie <code>403</code> avec <code>HttpResponseForbidden</code>. Parfois on préfère renvoyer <strong>404</strong> pour une ressource qui existe mais qu'on veut cacher (ne pas révéler son existence).</p>

<h3>4. is_staff, is_superuser et les groupes</h3>
<p>Un <strong>groupe</strong> est un ensemble d'utilisateurs à qui l'on attribue des droits communs, d'un coup — comme un rôle (« Modérateurs », « Rédacteurs »).</p>
<pre class="pseudo">request.user.is_staff        # True si l'utilisateur a accès à l'interface d'administration
request.user.is_superuser    # True si l'utilisateur a TOUS les droits (le super-admin)
request.user.groups          # les groupes de l'utilisateur (ex. « Modérateurs »)</pre>
<p>Django distingue les utilisateurs ordinaires, le <em>staff</em> (accès à l'admin, leçon 19) et les <em>superutilisateurs</em> (tous les droits). On peut aussi ranger les gens dans des <strong>groupes</strong> pour leur donner des droits communs.</p>

<h3>5. Le système de permissions</h3>
<p>Une <strong>permission</strong> est un droit précis et nommé (par exemple « supprimer une tâche »). <code>has_perm</code> vérifie si l'utilisateur possède ce droit.</p>
<pre class="pseudo">request.user.has_perm("taches.delete_tache")   # a-t-il la permission de SUPPRIMER une Tache ?</pre>
<p>Pour chaque modèle, Django crée automatiquement quatre permissions : <code>add</code> (ajouter), <code>change</code> (modifier), <code>delete</code> (supprimer) et <code>view</code> (voir). On peut les attribuer à un utilisateur ou à un groupe, puis les tester avec <code>has_perm(...)</code>.</p>

<h3>6. Décorateurs et mixins d'autorisation</h3>
<p>Un <strong>lambda</strong> est une mini-fonction anonyme écrite sur une ligne : <code>lambda u: u.is_staff</code> signifie « prend un utilisateur u et renvoie u.is_staff ».</p>
<pre class="pseudo">from django.contrib.auth.decorators import login_required, permission_required, user_passes_test

@permission_required("taches.delete_tache")     # exige CETTE permission pour entrer dans la vue
def supprimer(request, id): ...                  # (corps de la vue)

@user_passes_test(lambda u: u.is_staff)          # exige que le test (ici : être staff) soit vrai
def tableau_de_bord(request): ...                # (corps de la vue)</pre>
<div class="warn">Vérifie les droits CÔTÉ SERVEUR, dans la vue. Masquer un bouton « Supprimer » en HTML améliore l'expérience, mais n'est PAS une sécurité : n'importe qui peut appeler l'URL directement. La vraie barrière est toujours dans le code Python de la vue.</div>

<h3>7. Filtrer plutôt que refuser</h3>
<pre class="pseudo">taches = Tache.objects.filter(utilisateur=request.user)   # on ne récupère QUE les tâches de l'utilisateur</pre>
<p>Souvent, la meilleure autorisation est un bon filtre : si la liste ne contient déjà que les tâches de l'utilisateur, il ne peut ni voir ni toucher celles des autres. Combine le filtrage (pour l'affichage) et la vérification (avant chaque action).</p>`,

    { type: "qcm", q: "<code>request.user.has_perm(\"taches.delete_tache\")</code> teste…", opts: ["Le mot de passe", "Si l'utilisateur a la permission de supprimer une Tache", "L'URL", "La vitesse"], a: 1, exp: "has_perm interroge le système de permissions." },
    { type: "qcm", q: "<code>@permission_required(\"taches.delete_tache\")</code> …", opts: ["Style la vue", "Exige cette permission pour accéder à la vue", "Crée un user", "Migre"], a: 1, exp: "Un décorateur d'autorisation." },
    { type: "qcm", q: "Masquer un bouton « Supprimer » en HTML suffit-il à sécuriser ?", opts: ["Oui", "Non : la vérification doit se faire CÔTÉ SERVEUR, dans la vue", "Parfois", "En prod seulement"], a: 1, exp: "Le HTML n'est jamais une barrière de sécurité." },
    { type: "vf", q: "Filtrer la liste sur request.user est souvent la forme la plus simple d'autorisation.", a: true, exp: "On ne montre que ce qui appartient à l'utilisateur." },
    { type: "qcm", q: "Les groupes servent à…", opts: ["Styliser", "Donner des droits communs à un ensemble d'utilisateurs (ex. « Modérateurs »)", "Router", "Migrer"], a: 1, exp: "Un groupe regroupe des permissions partagées." }
  ],

    title: "Exercice final — Sécuriser la suppression",
    intro: `<p>On protège la suppression d'une tâche :</p>
<pre class="pseudo">from django.shortcuts import get_object_or_404, redirect        # récupérer / rediriger
from django.http import HttpResponseForbidden                   # réponse 403 (interdit)
from django.contrib.auth.decorators import login_required       # décorateur "connecté requis"

@login_required                                     # exiger d'être connecté (sinon 401 → connexion)
def supprimer(request, id):
    tache = get_object_or_404(Tache, id=id)         # exister (sinon 404)
    if tache.utilisateur != request.user:           # m'appartenir ?

    tache.delete()                                  # supprimer

def supprimer(request, id):
