  title: "Les migrations : créer les tables",
  subtitle: "Décrire ses données en Python, laisser Django créer la base.",
  theory: `
<h3>1. Le modèle : une classe = une table</h3>
<p>Une <strong>base de données</strong> range ses informations dans des <strong>tables</strong>, qui ressemblent à des feuilles de tableur : chaque <strong>ligne</strong> est un enregistrement (une tâche), chaque <strong>colonne</strong> est une caractéristique (le texte, l'état…). Traditionnellement, on crée ces tables avec le <strong>SQL</strong> (le langage des bases de données). En Django, on n'écrit pas de SQL : on décrit ses données avec des <strong>classes Python</strong> dans <code>models.py</code>. Un <strong>modèle</strong> (une classe) devient une table ; chaque attribut, une colonne. C'est comme dessiner le plan d'un meuble : Django se charge ensuite de le fabriquer.</p>
<pre class="pseudo"># taches/models.py (le fichier des modèles de l'application)
from django.db import models                     # importe la boîte à outils des modèles

class Tache(models.Model):                        # class = on définit un modèle ; il HÉRITE de models.Model
    texte = models.CharField(max_length=200)      # colonne "texte" : une chaîne courte (200 caractères max)
    faite = models.BooleanField(default=False)    # colonne "faite" : un booléen (vrai/faux), False par défaut
    date_creation = models.DateTimeField(auto_now_add=True)  # colonne date+heure, remplie à la création

    def __str__(self):                            # __str__ : définit comment l'objet s'AFFICHE en texte
        return self.texte                         # on renvoie le texte de la tâche (self = l'objet courant)</pre>
<p>Le mot <strong>hériter</strong> signifie « reprendre les capacités d'une classe existante » : en héritant de <code>models.Model</code>, notre classe reçoit gratuitement tout le savoir-faire de Django pour parler à la base. La <strong>clé primaire</strong> est l'identifiant unique de chaque ligne : Django ajoute automatiquement une colonne <code>id</code> (auto-incrémentée, c.-à-d. 1, 2, 3…) — pas besoin de la déclarer.</p>

<h3>2. Les types de champs courants</h3>
<p>Un <strong>champ</strong> (<em>field</em>) est une colonne typée : on précise la nature de la donnée (texte, nombre, date…) pour que la base la range correctement.</p>
<pre class="pseudo">models.CharField(max_length=200)         # chaîne COURTE (titre, nom…) — max_length est OBLIGATOIRE
models.TextField()                       # texte LONG (description, article) — pas de limite de taille
models.IntegerField()                    # nombre entier (quantité, âge…)
models.BooleanField(default=False)       # vrai/faux (coché ou non)
models.DateTimeField(auto_now_add=True)  # date + heure remplie automatiquement à la CRÉATION
models.DateField()                       # une date seule (sans l'heure)
models.EmailField()                      # une adresse email (le format est vérifié automatiquement)</pre>

<h3>3. Les migrations : traduire le modèle en base</h3>
<p>Une <strong>migration</strong> est une « recette de modification » de la base, écrite par Django et enregistrée dans un fichier. Deux commandes travaillent en tandem.</p>
<pre class="pseudo">python manage.py makemigrations     # GÉNÈRE la recette (un fichier Python) décrivant les changements
python manage.py migrate            # APPLIQUE la recette : crée/modifie réellement les tables</pre>
<div class="tip">Deux étapes distinctes : <code>makemigrations</code> compare tes modèles à l'état actuel et écrit un fichier de <strong>migration</strong> (dans <code>migrations/</code>) décrivant les changements. <code>migrate</code> exécute ce fichier sur la base. On répète ce duo à CHAQUE modification d'un modèle.</div>

<h3>4. Le cycle de vie d'une modification</h3>
<pre class="pseudo">1. Modifier models.py               # ajouter un champ, une classe, changer un type…
2. python manage.py makemigrations   # Django détecte le changement et écrit la migration
3. python manage.py migrate          # la base est effectivement mise à jour</pre>
<div class="warn">Oublier <code>makemigrations</code> après avoir modifié un modèle est l'erreur n°1 : la base ne « voit » pas ton changement, et tu obtiens des erreurs du type « no such column » (colonne inexistante). Réflexe : modèle modifié → makemigrations + migrate.</div>

<h3>5. Les fichiers de migration</h3>
<pre class="pseudo">taches/migrations/            # dossier des migrations de l'app
├── 0001_initial.py           # la 1re migration : création de la table Tache
├── 0002_tache_priorite.py    # une migration ultérieure : ajout du champ "priorite"
└── __init__.py               # fichier vide qui fait du dossier un paquet Python</pre>
<p>Chaque migration est un fichier Python numéroté, gardé dans le projet (et le dépôt <strong>Git</strong>, l'outil qui archive les versions du code). Cet <strong>historique</strong> permet de reconstruire la base à l'identique sur n'importe quelle machine : un collègue lance <code>migrate</code> et obtient exactement la même structure — comme une notice de montage qui garantit le même meuble pour tous.</p>

<h3>6. La base par défaut : SQLite</h3>
<pre class="pseudo"># settings.py (configuration par défaut de la base) :
DATABASES = {                                     # DATABASES : le dictionnaire de configuration des bases
    "default": {                                  # "default" : la base principale du projet
        "ENGINE": "django.db.backends.sqlite3",   # ENGINE : le moteur utilisé, ici SQLite
        "NAME": BASE_DIR / "db.sqlite3",          # NAME : l'emplacement du fichier de base
    }                                             # ferme la configuration de "default"
}                                                 # ferme DATABASES</pre>
<div class="tip">Par défaut, Django utilise <strong>SQLite</strong> : une base rangée dans un simple fichier (<code>db.sqlite3</code>), parfaite pour apprendre et développer, sans rien installer. En production, on bascule vers PostgreSQL ou MySQL (des bases plus puissantes) en changeant juste cette configuration — les modèles et les migrations, eux, ne changent pas. C'est tout l'intérêt de l'<strong>ORM</strong> (leçon 9), l'outil qui traduit ton Python en ordres pour la base, quelle qu'elle soit.</div>`,

    { type: "qcm", q: "Passer de SQLite à PostgreSQL en production demande de changer…", opts: ["Tous les modèles", "Juste la configuration DATABASES dans settings.py", "Les migrations", "Les templates"], a: 1, exp: "L'ORM abstrait la base : les modèles ne changent pas." },
    { type: "qcm", q: "<code>models.TextField()</code> convient pour…", opts: ["Un titre court", "Un texte LONG (description, contenu d'article)", "Un entier", "Une date"], a: 1, exp: "TextField pour du texte volumineux ; CharField pour du court." },
    { type: "vf", q: "En Django, on décrit ses données en Python et on ne écrit (presque) jamais de SQL.", a: true, exp: "Les modèles + migrations génèrent le SQL pour toi." },

  ],
