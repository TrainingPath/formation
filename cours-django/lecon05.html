  title: "Passer des données aux templates",
  subtitle: "Le contexte : le pont entre la vue et la page.",
  theory: `
<h3>1. Le contexte : un dictionnaire de données</h3>
<p>Rappel : la <strong>vue</strong> est la fonction qui traite la requête, le <strong>template</strong> est la page à trous. La vue prépare les données, le template les affiche. Le lien entre les deux est le <strong>contexte</strong> : un <strong>dictionnaire</strong> (une structure Python qui associe des clés à des valeurs, comme un carnet d'adresses : nom → numéro) passé à <code>render</code>. Chaque clé du contexte devient une variable disponible dans le template. Pense au contexte comme au <strong>plateau-repas</strong> que la cuisine (la vue) transmet au serveur (le template) : chaque plat étiqueté sera présenté au client.</p>
<pre class="pseudo"># views.py
def liste(request):
    taches = Tache.objects.all()          # récupère toutes les tâches depuis la base (une liste d'objets)
    nb_faites = 3                         # une simple variable nombre
    return render(request, "taches/liste.html", {  # render : requête, template, puis le contexte…
        "taches": taches,                 # clé "taches"    → variable {{ taches }} dans le template
        "nb_faites": nb_faites,           # clé "nb_faites" → variable {{ nb_faites }}
        "titre": "Ma journée",            # clé "titre"     → variable {{ titre }}
    })                                    # accolade + parenthèse : ferment le dico puis l'appel render</pre>
<p>Chaque clé du dictionnaire (<code>"taches"</code>, <code>"titre"</code>…) devient une variable du même nom côté template. On peut passer autant de données qu'on veut : listes, objets, nombres, chaînes.</p>

<h3>2. Afficher les données passées</h3>
<pre class="pseudo">&lt;h1&gt;{{ titre }}&lt;/h1&gt;                                    &lt;!-- affiche la valeur de la clé "titre" --&gt;
&lt;p&gt;{{ nb_faites }} tâches terminées&lt;/p&gt;                 &lt;!-- affiche le nombre, suivi d'un texte fixe --&gt;
{% for tache in taches %}                              &lt;!-- boucle sur chaque tâche de la liste --&gt;
    &lt;p&gt;{{ tache.texte }} — {{ tache.date_creation|date:"d/m/Y" }}&lt;/p&gt;  &lt;!-- texte + date formatée jj/mm/aaaa --&gt;
{% endfor %}                                           &lt;!-- ferme la boucle --&gt;</pre>

<h3>3. Générer des liens avec des paramètres</h3>
<p>La balise <code>{% url %}</code> fabrique une adresse à partir du <em>nom</em> d'une route (leçon 2). On peut lui donner des arguments, comme l'identifiant d'une tâche.</p>
<pre class="pseudo">&lt;!-- lien vers /taches/3/terminer/ : route « terminer » + l'id de la tâche --&gt;
&lt;a href="{% url 'terminer' tache.id %}"&gt;Terminer&lt;/a&gt;   &lt;!-- {% url 'nom' arg %} construit l'adresse ; &lt;a&gt; = un lien --&gt;
&lt;!-- lien vers /taches/nouvelle/ : route « creer », sans paramètre --&gt;
&lt;a href="{% url 'creer' %}"&gt;Nouvelle tâche&lt;/a&gt;        &lt;!-- {% url 'creer' %} : pas d'argument ici --&gt;</pre>
<p><code>{% url 'nom' argument %}</code> génère l'adresse d'une route nommée, en lui passant ses paramètres (comme l'<code>id</code>). On ne construit JAMAIS ces URLs à la main : Django s'en charge à partir du <code>path</code>.</p>

<h3>4. Les fichiers statiques (CSS, images, JS)</h3>
<p>Les <strong>fichiers statiques</strong> sont les fichiers qui ne changent pas selon les données : la feuille de style <strong>CSS</strong> (qui décrit les couleurs et la mise en page), les images, le <strong>JavaScript</strong> (le code qui anime la page côté navigateur).</p>
<pre class="pseudo">{% load static %}                                     &lt;!-- charge la balise "static" (à mettre en haut du template) --&gt;
&lt;link rel="stylesheet" href="{% static 'taches/style.css' %}"&gt;  &lt;!-- &lt;link&gt; : branche la feuille de style CSS --&gt;
&lt;img src="{% static 'taches/logo.png' %}"&gt;            &lt;!-- &lt;img&gt; : affiche une image, dont l'URL est générée par static --&gt;</pre>
<p>Les fichiers CSS, images et JS se placent dans un dossier <code>static/&lt;nom_app&gt;/</code>. On les référence avec <code>{% static 'chemin' %}</code> après avoir chargé <code>{% load static %}</code>. Django construit alors la bonne URL, même en production où ces fichiers sont servis ailleurs.</p>

<h3>5. request et user disponibles partout</h3>
<p>Un <strong>context processor</strong> est un mécanisme qui injecte certaines variables dans TOUS les templates, sans qu'on ait à les passer à chaque <code>render</code>. <code>user</code> représente l'utilisateur connecté.</p>
<pre class="pseudo">{% if user.is_authenticated %}                &lt;!-- user est fourni partout ; is_authenticated = "est connecté ?" --&gt;
    Bonjour {{ user.username }}               &lt;!-- affiche le nom d'utilisateur (username) --&gt;
{% else %}                                    &lt;!-- sinon (visiteur non connecté)… --&gt;
    &lt;a href="{% url 'login' %}"&gt;Se connecter&lt;/a&gt;  &lt;!-- …lien vers la page de connexion --&gt;
{% endif %}                                   &lt;!-- ferme la condition --&gt;</pre>
<div class="tip">Certaines variables sont fournies automatiquement à TOUS les templates (via les « context processors ») : notamment <code>user</code> (l'utilisateur connecté) et <code>request</code>. Pas besoin de les passer dans le contexte : elles sont toujours là. On s'en servira pour l'authentification (leçon 16).</div>

<h3>6. Un peu de logique dans la vue, pas dans le template</h3>
<p>Une <strong>compréhension de liste</strong> est une écriture Python compacte qui fabrique une liste en filtrant : <code>[t for t in taches if t.faite]</code> se lit « chaque t de taches, gardé si t.faite est vrai ».</p>
<pre class="pseudo"># BIEN : le CALCUL dans la VUE, l'affichage dans le template
def liste(request):
    taches = Tache.objects.all()                 # récupère toutes les tâches
    faites = [t for t in taches if t.faite]      # compréhension : garde seulement les tâches faites
    return render(request, "taches/liste.html", {
        "taches": taches,                        # la liste complète
        "nb_faites": len(faites),                # len() = le nombre d'éléments de la liste faites
    })                                           # ferme le contexte et l'appel render</pre>
<div class="warn">Règle d'or : les templates AFFICHENT, ils ne CALCULENT pas. Le DTL est volontairement limité (pas d'opérations complexes) pour te forcer à mettre la logique dans la vue (en vrai Python) et à garder le template simple et lisible. Un calcul compliqué dans un template est un signe qu'il devrait être dans la vue.</div>`,
  exercises: [

    { type: "qcm", q: "La clé <code>\"titre\"</code> du contexte s'affiche dans le template avec…", opts: ["{% titre %}", "{{ titre }}", "{{ titre() }}", "title"], a: 1, exp: "La clé devient une variable du même nom." },

    { type: "qcm", q: "La variable <code>user</code> dans un template…", opts: ["Doit être passée à chaque render", "Est fournie AUTOMATIQUEMENT (context processor) : toujours disponible", "N'existe pas", "Est le mot de passe"], a: 1, exp: "user et request sont injectés dans tous les templates." },
    { type: "qcm", q: "<code>{% if user.is_authenticated %}</code> teste…", opts: ["Le mot de passe", "Si un utilisateur est CONNECTÉ", "La vitesse", "L'URL"], a: 1, exp: "Le test d'authentification, utile pour le menu (leçon 16)." },
    { type: "qcm", q: "Un calcul complexe (filtrer, agréger) doit se faire…", opts: ["Dans le template", "Dans la VUE (vrai Python), le template ne fait qu'afficher", "Dans urls.py", "Dans le CSS"], a: 1, exp: "Les templates affichent ; la logique vit dans la vue." },
    { type: "qcm", q: "Pourquoi le DTL est-il volontairement limité ?", opts: ["Par manque de temps", "Pour forcer à mettre la logique dans la vue et garder le template simple", "Pour la sécurité seulement", "Sans raison"], a: 1, exp: "Séparation présentation/logique : un template reste lisible." },
    { type: "qcm", q: "<code>faites = [t for t in taches if t.faite]</code> dans la vue est…", opts: ["Du DTL", "Du Python (une compréhension de liste) : le calcul se fait côté vue", "Une URL", "Un template"], a: 1, exp: "On calcule en Python, puis on passe le résultat au template." },
    { type: "vf", q: "Chaque clé du dictionnaire de contexte devient une variable du même nom dans le template.", a: true, exp: "C'est le mécanisme du contexte." },
    { type: "qcm", q: "Le rôle du contexte :", opts: ["Router", "Faire le PONT entre les données préparées par la vue et leur affichage dans le template", "Créer les tables", "Configurer"], a: 1, exp: "Vue (prépare) → contexte → template (affiche)." }
  ],

<pre class="pseudo"># views.py
def tableau(request):
    taches = Tache.objects.all()                     # toutes les tâches
    restantes = [t for t in taches if not t.faite]   # garde celles NON faites (not = négation)
    return render(request, "taches/tableau.html", {
        "taches": taches,                            # la liste complète
        "nb_restantes": len(restantes),              # le nombre de tâches restantes
    })                                               # ferme le contexte et render</pre>
<pre class="pseudo">&lt;!-- tableau.html --&gt;
&lt;h1&gt;{{ nb_restantes }} tâche(s) à faire&lt;/h1&gt;            &lt;!-- affiche le compteur passé par la vue --&gt;
{% for t in taches %}                                 &lt;!-- pour chaque tâche t --&gt;
    &lt;a href="{% url 'terminer' t.id %}"&gt;{{ t.texte }}&lt;/a&gt;  &lt;!-- lien "terminer" (avec l'id) + texte --&gt;
{% endfor %}                                          &lt;!-- ferme la boucle --&gt;</pre>`,
    questions: [
      { type: "qcm", q: "D'où vient <code>{{ nb_restantes }}</code> dans le template ?", opts: ["De nulle part", "De la clé \"nb_restantes\" du contexte, calculée dans la vue", "De la base", "D'un filtre"], a: 1, exp: "La vue calcule len(restantes) et le passe au template." },
      { type: "qcm", q: "Le calcul <code>[t for t in taches if not t.faite]</code> a lieu…", opts: ["Dans le template", "Dans la VUE (Python), puis len() est passé au template", "Dans l'URL", "Dans le CSS"], a: 1, exp: "La logique dans la vue, l'affichage dans le template." },
      { type: "qcm", q: "<code>{% url 'terminer' t.id %}</code> produit un lien vers…", opts: ["/terminer/", "L'URL « terminer » avec l'id de la tâche courante", "Le template", "La vue liste"], a: 1, exp: "On passe t.id comme paramètre de la route." },
      { type: "qcm", q: "Si aucune tâche n'existe, la boucle for…", opts: ["Plante", "Ne produit aucun lien (on pourrait ajouter {% empty %})", "Affiche 0", "Boucle à l'infini"], a: 1, exp: "Une liste vide = aucun tour ; {% empty %} gérerait le message." },
      { type: "vf", q: "On aurait pu calculer nb_restantes directement dans le template, mais c'est déconseillé.", a: true, exp: "Le DTL est limité exprès : la logique reste dans la vue." }
    ],
    solution: `<pre class="pseudo"># views.py — la LOGIQUE
def tableau(request):
    taches = Tache.objects.all()                     # toutes les tâches
    restantes = [t for t in taches if not t.faite]   # Python : garde les non faites
    return render(request, "taches/tableau.html",
                  {"taches": taches, "nb_restantes": len(restantes)})  # contexte

&lt;!-- tableau.html — l'AFFICHAGE --&gt;
&lt;h1&gt;{{ nb_restantes }} tâche(s) à faire&lt;/h1&gt;            &lt;!-- affiche le compteur --&gt;
{% for t in taches %}                                 &lt;!-- pour chaque tâche --&gt;
    &lt;a href="{% url 'terminer' t.id %}"&gt;{{ t.texte }}&lt;/a&gt;  &lt;!-- lien terminer + texte --&gt;
{% endfor %}                                          &lt;!-- fin de la boucle --&gt;
&lt;!-- Contexte = pont vue→template · {% url %} pour les liens --&gt;
&lt;!-- logique dans la vue, affichage dans le template --&gt;</pre>
<p>Vue et template travaillent main dans la main. Demain : recevoir des données de l'utilisateur avec les formulaires.</p>`
  }
