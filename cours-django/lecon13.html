  title: "Messages, sessions et erreurs",
  subtitle: "Communiquer avec l'utilisateur et mémoriser son passage.",
  theory: `
<h3>1. Les messages flash</h3>
<p>Après une action (tâche créée, supprimée…), on veut souvent afficher une confirmation. Un message <strong>flash</strong> est une notification affichée UNE seule fois, à la page d'après, puis oubliée — comme le petit bandeau « Modifications enregistrées » qui apparaît puis disparaît. Le <strong>framework de messages</strong> de Django gère ces notifications.</p>
<pre class="pseudo">from django.contrib import messages                  # importe le framework de messages

def creer(request):
    # ... créer la tâche ...                          # (on suppose la tâche créée ici)
    messages.success(request, "Tâche ajoutée !")     # prépare un message de SUCCÈS (vert par convention)
    return redirect("liste")                         # le message survivra à cette redirection

# Autres NIVEAUX de message :
messages.error(request, "Une erreur est survenue")   # niveau erreur (rouge)
messages.warning(request, "Attention…")              # niveau avertissement (orange)
messages.info(request, "Pour information…")          # niveau information (bleu)</pre>

<h3>2. Afficher les messages dans le template</h3>
<pre class="pseudo">{% if messages %}                                     &lt;!-- s'il y a des messages en attente… --&gt;
    {% for message in messages %}                     &lt;!-- parcourir chaque message --&gt;
        &lt;div class="alerte {{ message.tags }}"&gt;{{ message }}&lt;/div&gt;  &lt;!-- afficher le texte ; tags = le niveau (classe CSS) --&gt;
    {% endfor %}                                      &lt;!-- fin de la boucle --&gt;
{% endif %}                                           &lt;!-- fin de la condition --&gt;</pre>
<div class="tip">On place cette boucle dans le <code>base.html</code> (le squelette commun) : ainsi les messages s'affichent sur toutes les pages, sans les répéter. Le <code>{{ message.tags }}</code> (« success », « error »…) sert de classe CSS pour colorer la notification. Idéal après un <code>redirect</code> (leçon 6) : le message survit à la redirection.</div>

<h3>3. Les sessions : mémoriser entre les requêtes</h3>
<p>Rappel : <strong>HTTP est sans mémoire</strong> — le serveur oublie tout entre deux requêtes, il ne « reconnaît » pas le visiteur d'une page à l'autre. La <strong>session</strong> résout cela : c'est un espace de rangement, propre à chaque visiteur, qui persiste d'une page à l'autre. Django la gère via <code>request.session</code>, qui s'utilise exactement comme un dictionnaire.</p>
<pre class="pseudo">request.session["theme"] = "sombre"                    # ÉCRIRE une donnée en session (clé → valeur)
theme = request.session.get("theme", "clair")          # LIRE avec une valeur par défaut si absente
request.session["vues"] = request.session.get("vues", 0) + 1   # incrémenter un compteur de visites
del request.session["theme"]                           # del : effacer UNE clé de la session
request.session.flush()                                # flush() : TOUT vider (ex. à la déconnexion)</pre>
<div class="warn">Les données de session sont stockées CÔTÉ SERVEUR ; seul un identifiant (dans un petit fichier appelé <strong>cookie</strong>, déposé chez le visiteur) voyage. C'est sûr — mais ne mets pas d'informations sensibles en clair. Django fournit tout cela sans configuration : les sessions fonctionnent dès la création du projet.</div>

<h3>4. Les pages d'erreur</h3>
<p>Le web utilise des <strong>codes d'erreur HTTP</strong> pour signaler les problèmes : ce sont des numéros standardisés que renvoie le serveur.</p>
<pre class="pseudo">from django.shortcuts import get_object_or_404          # raccourci "objet ou 404"

def detail(request, id):
    tache = get_object_or_404(Tache, id=id)             # renvoie une page 404 automatique si la tâche est absente
    return render(request, "taches/detail.html", {"tache": tache})  # sinon, affiche la tâche</pre>
<p>Django gère les erreurs HTTP courantes : <strong>404</strong> (page introuvable), <strong>403</strong> (accès interdit), <strong>500</strong> (erreur du serveur). <code>get_object_or_404</code> déclenche une 404 propre si l'objet n'existe pas, plutôt qu'un plantage brutal.</p>

<h3>5. DEBUG : deux visages selon l'environnement</h3>
<p><code>DEBUG</code> est un réglage (dans <code>settings.py</code>) qui vaut vrai ou faux. Le <strong>développement</strong> est la phase où tu construis l'app sur ta machine ; la <strong>production</strong> est le site en ligne, utilisé par de vrais visiteurs.</p>
<pre class="pseudo"># settings.py
DEBUG = True     # en DÉVELOPPEMENT : pages d'erreur détaillées (trace complète, variables…)
DEBUG = False    # en PRODUCTION : pages d'erreur sobres (aucun détail sensible exposé !)</pre>
<div class="warn">En développement, <code>DEBUG = True</code> affiche des pages d'erreur très détaillées (la trace, les variables…) — parfait pour déboguer. Mais en PRODUCTION, il faut IMPÉRATIVEMENT <code>DEBUG = False</code> : sinon un visiteur verrait tes détails internes (chemins, code, parfois des secrets). C'est une des premières règles de sécurité en mise en ligne (leçon 14).</div>

<h3>6. Personnaliser les pages d'erreur</h3>
<pre class="pseudo"># On peut créer ses propres pages d'erreur :
templates/404.html      # page « introuvable » sur mesure (aux couleurs du site)
templates/500.html      # page « erreur serveur » sur mesure
# Django les utilise automatiquement quand DEBUG = False</pre>
<p>En production, on remplace les pages d'erreur techniques par des pages soignées aux couleurs du site : il suffit de créer <code>404.html</code> et <code>500.html</code> dans les templates. Django les affiche automatiquement.</p>`,

    { type: "qcm", q: "<code>DEBUG = True</code> en développement affiche…", opts: ["Rien", "Des pages d'erreur DÉTAILLÉES (trace, variables) — pratique pour déboguer", "Une 404 sobre", "Le CSS"], a: 1, exp: "Idéal en dev pour comprendre les erreurs." },
    { type: "qcm", q: "En PRODUCTION, DEBUG doit valoir…", opts: ["True", "False : sinon les détails internes (code, chemins, secrets) fuiraient", "La même valeur qu'en développement", "1"], a: 1, exp: "Règle de sécurité fondamentale." },
    { type: "qcm", q: "Pourquoi DEBUG = False en production ?", opts: ["Pour la vitesse", "Pour ne PAS exposer les détails internes du site aux visiteurs (sécurité)", "Par style", "Sans raison"], a: 1, exp: "Les pages d'erreur détaillées révèlent trop d'informations." },
    { type: "qcm", q: "Créer un <code>404.html</code> dans les templates permet…", opts: ["De router", "D'avoir une page « introuvable » sur mesure (utilisée quand DEBUG=False)", "De valider", "De migrer"], a: 1, exp: "Django utilise automatiquement 404.html et 500.html." },
    { type: "vf", q: "Un message flash s'affiche une seule fois, à la page suivante (après un redirect).", a: true, exp: "C'est le principe du message « flash »." },
    { type: "qcm", q: "<code>request.session.flush()</code> sert à…", opts: ["Écrire", "TOUT vider (par ex. à la déconnexion)", "Lire", "Router"], a: 1, exp: "Vide la session entière." }
  ],
  final: {
    title: "Exercice final — Confirmer et mémoriser",
    intro: `<p>On ajoute une confirmation et un compteur de visites :</p>
<pre class="pseudo">from django.contrib import messages                  # framework de messages

def creer(request):
    if request.method == "POST":                                 # si envoi du formulaire
        Tache.objects.create(texte=request.POST.get("texte", ""))  # créer la tâche
        messages.success(request, "Tâche ajoutée !")             # préparer la notification
        return redirect("liste")                                 # rediriger (le message survit)
    return render(request, "taches/creer.html")                  # GET : afficher le formulaire

def liste(request):
    request.session["visites"] = request.session.get("visites", 0) + 1  # compteur en session
    taches = Tache.objects.all()                                 # lire les tâches
    return render(request, "taches/liste.html", {"taches": taches})  # afficher</pre>`,
    questions: [
      { type: "qcm", q: "Quand le message « Tâche ajoutée ! » s'affiche-t-il ?", opts: ["Jamais", "À la page suivante (après le redirect vers liste)", "Immédiatement puis reste", "Dans l'admin"], a: 1, exp: "Le message flash survit au redirect et s'affiche une fois." },
      { type: "qcm", q: "Que fait <code>request.session.get(\"visites\", 0) + 1</code> ?", opts: ["Compte les tâches", "Incrémente un compteur de visites stocké en session (0 au 1er passage)", "Supprime la session", "Route"], a: 1, exp: "Un compteur qui persiste entre les requêtes du visiteur." },
      { type: "qcm", q: "Pour afficher le message dans le template, il faut…", opts: ["Un simple {{ message }}", "Une boucle {% for message in messages %} (idéalement dans base.html)", "session", "redirect"], a: 1, exp: "On parcourt messages et on affiche chacun." },
      { type: "qcm", q: "Les données de session (visites) sont stockées…", opts: ["Dans l'URL", "Côté serveur (seul un id voyage en cookie)", "Dans le template", "Directement dans le navigateur"], a: 1, exp: "Sûr par construction." },
      { type: "vf", q: "Sans redirect après create, un F5 réenverrait le formulaire ET le message serait mal géré.", a: true, exp: "Le PRG + messages : le duo standard après une action." }
    ],
    solution: `<pre class="pseudo">messages.success(request, "Tâche ajoutée !")   # notification flash (affichée une fois)

&lt;!-- base.html --&gt;

{% endfor %}                                             &lt;!-- fin de la boucle --&gt;
# messages (flash) · session (mémoire) · get_object_or_404 (404) ·
# DEBUG=False en prod (sécurité).</pre>
<p>Ton app communique et se souvient. Demain : settings.py et les environnements.</p>`
