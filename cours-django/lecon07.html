<h3>1. Le patron MVT de Django</h3>
<p>Une <strong>architecture</strong> (ou « patron », en anglais <em>pattern</em>) est une façon d'organiser le code en morceaux aux rôles bien séparés — comme les rayons d'un magasin ou les services d'une entreprise. Django suit le patron <strong>MVT</strong> : <strong>Model</strong> (les données), <strong>View</strong> (la logique) et <strong>Template</strong> (la présentation). Image du restaurant : le <em>Model</em> est le garde-manger (où sont stockés les ingrédients/données), la <em>View</em> est le cuisinier (qui décide quoi préparer), le <em>Template</em> est le dressage de l'assiette (la présentation au client). Chaque couche a une responsabilité claire, ce qui rend le code lisible et maintenable.</p>
<pre class="pseudo">MODEL     (models.py)    → les DONNÉES : décrit les tables de la base de données (leçon 9)
VIEW      (views.py)     → la LOGIQUE : traite la requête, prépare les données
TEMPLATE  (les .html)    → la PRÉSENTATION : produit le HTML final affiché
+ URLconf (urls.py)      → le ROUTAGE : associe une URL à la vue qui doit y répondre</pre>

<h3>2. Le cycle complet d'une requête</h3>
<p>Une <strong>requête</strong> est la demande du navigateur ; la <strong>réponse</strong> est la page renvoyée. Voici leur trajet à travers les couches, étape par étape.</p>
<pre class="pseudo">1. Le navigateur demande une URL             → /taches/
2. urls.py trouve la vue associée            → views.liste
3. La vue traite la requête                  → elle lit le Model (Tache.objects.all())
4. La vue rend un Template avec un contexte  → render(request, "liste.html", {...})
5. Le Template produit le HTML               → la page finale est fabriquée
6. Le navigateur reçoit et affiche           → l'utilisateur voit ses tâches</pre>
<div class="tip">Retiens ce trajet : <strong>URL → Vue → (Modèle) → Template → Réponse</strong>. C'est le fil conducteur de toute application Django. Quand quelque chose ne marche pas, remonte ce chemin pour trouver l'étape fautive.</div>

<h3>3. MVT vs MVC : le même principe, d'autres noms</h3>
<p><strong>MVC</strong> (<em>Model-View-Controller</em>) est le patron le plus répandu dans les autres frameworks (Laravel, Spring…). Django utilise les mêmes idées, mais renomme deux couches — d'où le risque de confusion.</p>
<pre class="pseudo">MVC classique            Django (MVT)
Model                    Model          # identique : les données
View (l'affichage)       Template       # la présentation
Controller (la logique)  View           # la logique</pre>
<p>Django appelle « View » ce que d'autres frameworks appellent « Controller », et « Template » ce qu'ils appellent « View ». C'est le même découpage que le MVC de Laravel ou Spring ; seuls les noms changent. Django ajoute que le framework lui-même joue le rôle du contrôleur qui orchestre le tout.</p>

<h3>4. Qui fait quoi : le tableau de responsabilités</h3>
<pre class="pseudo">urls.py     : « quelle vue pour quelle URL ? »           # routage
views.py    : « que faire de la requête ? »              # logique métier
models.py   : « à quoi ressemblent mes données ? »       # structure de la base (BDD)
templates/  : « comment afficher le résultat ? »         # présentation
settings.py : « comment le projet est-il configuré ? »   # configuration</pre>
<div class="warn">La règle d'or : chaque couche reste à sa place. Pas de logique métier lourde dans un template, pas de HTML dans une vue, pas de requête base de données dans urls.py. Cette discipline est ce qui rend une application Django facile à faire évoluer.</div>

<h3>5. La todo-liste, vue d'ensemble</h3>
<pre class="pseudo">taches/urls.py       path("", views.liste, name="liste")                   # le routage : / → vue liste
taches/views.py      def liste(request): return render(..., {"taches": ...})  # la logique : prépare et rend
taches/templates/    liste.html : {% for t in taches %} ... {% endfor %}    # la présentation : boucle d'affichage
taches/models.py     class Tache: ...  (leçon 9 : les tables !)             # les données : à venir semaine 2</pre>
<p>En une semaine, tu as posé le squelette : les URLs routent, les vues répondent, les templates affichent. Il manque encore la <strong>persistance</strong> — c'est-à-dire la capacité à conserver durablement les données (les « écrire sur le disque »). Jusqu'ici les données étaient fictives, effacées à chaque redémarrage. La semaine 2 ajoute la base de données avec les <strong>modèles</strong> et l'<strong>ORM</strong> (l'outil qui traduit ton Python en ordres pour la base).</p>

<h3>6. Ce que tu sais faire à la fin de la semaine 1</h3>
<p>Créer un projet et une app, router des URLs (avec paramètres et noms), écrire des vues qui traitent les requêtes GET/POST, produire des pages avec des templates (variables, boucles, conditions, filtres, héritage), recevoir des formulaires en sécurité (CSRF, PRG, validation). C'est le socle de toute application web Django.</p>
<div class="tip">La semaine 2 va donner de la <strong>mémoire</strong> à ton application : les modèles définiront les tables, les migrations les créeront, et l'ORM te permettra de lire/écrire la base en Python pur — sans écrire une seule ligne de SQL (le langage traditionnel des bases de données).</div>`,

    { type: "qcm", q: "Le bon réflexe de débogage quand une page ne marche pas :", opts: ["Tout réécrire", "Remonter le cycle URL → Vue → Template pour trouver l'étape fautive", "Redémarrer l'ordinateur", "Changer de framework"], a: 1, exp: "Suivre le trajet de la requête isole le problème." }
