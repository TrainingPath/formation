  title: "L'ORM : les modèles et le CRUD",
  subtitle: "Lire et écrire la base en Python, sans SQL.",
  theory: `
<h3>1. Qu'est-ce que l'ORM ?</h3>
<p>L'<strong>ORM</strong> (<em>Object-Relational Mapping</em>, « correspondance objet-relationnel ») est le <strong>traducteur</strong> entre tes objets Python et la base de données. Au lieu d'écrire du <strong>SQL</strong> (le langage des bases), tu manipules des objets Python normaux, et Django traduit tout seul tes appels en requêtes SQL. C'est comme un interprète : tu parles Python, la base entend du SQL. Chaque modèle possède un <strong>manager</strong> (un « gestionnaire ») nommé <code>objects</code> : c'est la porte d'entrée de toutes les opérations sur la table.</p>
<pre class="pseudo">Tache.objects.all()          # ≈ SQL : SELECT * FROM taches   (lire toutes les lignes)
Tache.objects.create(...)    # ≈ SQL : INSERT INTO taches ... (ajouter une ligne)
tache.save()                 # ≈ SQL : UPDATE ...             (modifier une ligne)
tache.delete()               # ≈ SQL : DELETE ...             (supprimer une ligne)</pre>
<p>Les quatre opérations de base — Créer, Lire, Modifier, Supprimer — forment le <strong>CRUD</strong> (<em>Create, Read, Update, Delete</em>). Presque toute application de gestion se résume à ces quatre gestes.</p>

<h3>2. Create : créer un enregistrement</h3>
<p>Un <strong>enregistrement</strong> est une ligne de la table (ici, une tâche). <strong>Enregistrer</strong> (ou « persister ») veut dire l'écrire durablement dans la base.</p>
<pre class="pseudo"># Méthode 1 — en une ligne (crée l'objet ET l'enregistre) :
Tache.objects.create(texte="Réviser Django", faite=False)  # texte=… et faite=… remplissent les colonnes

# Méthode 2 — en deux étapes (créer l'objet, puis le sauvegarder) :
t = Tache(texte="Coder le projet")   # crée l'objet EN MÉMOIRE seulement (pas encore en base)
t.save()                             # save() écrit l'objet en base — sans lui, rien n'est enregistré !</pre>

<h3>3. Read : lire des enregistrements</h3>
<p>Un <strong>QuerySet</strong> est une collection de résultats renvoyée par l'ORM : une liste « paresseuse » d'objets correspondant à une requête (on l'étudiera leçon 10).</p>
<pre class="pseudo">Tache.objects.all()                       # TOUTES les tâches (renvoie un QuerySet)
Tache.objects.get(id=3)                   # UNE tâche précise (erreur si 0 résultat ou plusieurs)
Tache.objects.filter(faite=False)         # celles qui vérifient un critère (0, 1 ou plusieurs)
Tache.objects.filter(faite=True).count()  # count() : COMBIEN de tâches faites ? (un nombre)
Tache.objects.first()                     # la première tâche (.last() donnerait la dernière)
Tache.objects.exists()                    # y a-t-il au moins une tâche ? renvoie True ou False</pre>
<div class="warn"><code>get()</code> renvoie UN objet et lève une erreur si aucun (<code>DoesNotExist</code>) ou plusieurs (<code>MultipleObjectsReturned</code>). Pour une vue, on préfère <code>get_object_or_404(Tache, id=3)</code> (leçon 3), qui renvoie une page 404 propre. <code>filter()</code>, lui, renvoie toujours une collection (éventuellement vide), sans erreur.</div>

<h3>4. Update : modifier un enregistrement</h3>
<pre class="pseudo">t = Tache.objects.get(id=3)  # on récupère l'objet à modifier
t.faite = True               # on change un attribut de l'objet (en mémoire pour l'instant)
t.save()                     # save() écrit la modification dans la base

# Modifier PLUSIEURS enregistrements d'un coup :
Tache.objects.filter(faite=False).update(faite=True)   # marque toutes les non faites comme faites, en une requête</pre>

<h3>5. Delete : supprimer</h3>
<pre class="pseudo">t = Tache.objects.get(id=3)  # on récupère la tâche à supprimer
t.delete()                   # delete() supprime cet enregistrement de la base

Tache.objects.filter(faite=True).delete()   # supprime EN MASSE toutes les tâches faites</pre>

<h3>6. Le CRUD complet dans une vue</h3>
<pre class="pseudo">from django.shortcuts import render, redirect, get_object_or_404  # les raccourcis de vue
from .models import Tache                                         # le modèle Tache

def liste(request):
    taches = Tache.objects.all()                    # READ : lire toutes les tâches
    return render(request, "taches/liste.html", {"taches": taches})  # les afficher

def creer(request):
    if request.method == "POST":                    # si le formulaire est envoyé…
        Tache.objects.create(texte=request.POST["texte"])   # CREATE : créer la tâche saisie
        return redirect("liste")                    # rediriger vers la liste (PRG)
    return render(request, "taches/creer.html")     # GET : afficher le formulaire

def terminer(request, id):
    t = get_object_or_404(Tache, id=id)             # READ sûr : la tâche ou 404
    t.faite = True                                  # on la marque faite
    t.save()                                        # UPDATE : enregistrer le changement
    return redirect("liste")                        # revenir à la liste

def supprimer(request, id):
    get_object_or_404(Tache, id=id).delete()        # DELETE : récupérer (ou 404) puis supprimer
    return redirect("liste")                        # revenir à la liste</pre>
<div class="tip">Voilà une todo-liste FONCTIONNELLE : ces quatre vues (lister, créer, terminer, supprimer) suffisent à gérer les tâches de bout en bout, sans une seule ligne de SQL. L'ORM traduit tout pour toi — et le même code marcherait sur SQLite, PostgreSQL ou MySQL.</div>`,

    { type: "qcm", q: "Différence clé entre get() et filter() :", opts: ["Aucune", "get() = UN objet (erreur si 0 ou plusieurs) ; filter() = une collection (jamais d'erreur)", "filter est plus lent", "get renvoie une liste"], a: 1, exp: "get pour un objet unique, filter pour un ensemble." },
    { type: "qcm", q: "Modifier une tâche : on change l'attribut puis…", opts: ["recharger la page", "t.save() pour écrire en base", "t.update()", "migrate"], a: 1, exp: "save() persiste la modification (UPDATE)." },
    { type: "qcm", q: "Supprimer une tâche :", opts: ["t.remove()", "t.delete()", "del t", "t.destroy()"], a: 1, exp: "delete() supprime l'enregistrement." },
    { type: "qcm", q: "<code>Tache.objects.filter(faite=False).update(faite=True)</code> …", opts: ["Modifie une tâche", "Marque TOUTES les tâches non faites comme faites, en une requête", "Supprime", "Compte"], a: 1, exp: "update() en masse sur un QuerySet." },
    { type: "qcm", q: "Dans une vue, pour récupérer une tâche ou renvoyer 404 :", opts: ["Tache.objects.get(id=id)", "get_object_or_404(Tache, id=id)", "Tache.objects.all()", "filter"], a: 1, exp: "Le raccourci sûr qui gère l'absence." },
    { type: "vf", q: "Le même code ORM fonctionne sur SQLite, PostgreSQL ou MySQL sans modification.", a: true, exp: "L'ORM abstrait la base : on change juste la config." },
    { type: "qcm", q: "<code>Tache.objects.filter(faite=True).count()</code> retourne…", opts: ["Les tâches faites", "Le NOMBRE de tâches faites", "True", "La première"], a: 1, exp: "count() = combien, sans rapatrier les objets." }
  ],
