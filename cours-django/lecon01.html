<h3>1. Qu'est-ce qu'un framework ?</h3>
<p>Imagine que tu veuilles construire une maison. Tu pourrais fabriquer toi-même chaque brique, chaque tuyau, chaque fil électrique… ou bien partir d'une <strong>maison préfabriquée</strong> dont les murs, la plomberie et l'électricité sont déjà posés : il ne te reste qu'à décorer les pièces. Un <strong>framework</strong> (mot anglais qui signifie « cadre de travail », « ossature »), c'est cette maison préfabriquée pour les logiciels : une <strong>structure toute prête</strong> qui fournit les fondations, et dans laquelle tu ajoutes seulement ce qui est propre à ton projet.</p>
<p>Avant d'aller plus loin, définissons quelques mots qui vont revenir sans cesse. Une <strong>application web</strong> est un programme auquel on accède avec un <strong>navigateur</strong> (Chrome, Firefox…) au lieu de l'installer sur son ordinateur : Gmail, YouTube ou ton compte en banque en ligne en sont. Le <strong>web</strong> fonctionne par <strong>requêtes</strong> et <strong>réponses</strong> : ton navigateur envoie une <em>requête</em> (« montre-moi la page d'accueil ») à un <strong>serveur</strong> (un ordinateur qui reste allumé pour répondre aux visiteurs), et le serveur renvoie une <em>réponse</em> (la page). Ce dialogue suit un ensemble de règles appelé <strong>HTTP</strong> (le « langage » que parlent navigateur et serveur). Une <strong>base de données</strong>, enfin, est un grand classeur électronique où le site range durablement ses informations (les utilisateurs, les articles, les tâches…).</p>
<p>En Python « pur » (sans framework), écrire un site web signifie tout coder à la main : recevoir les requêtes HTTP, gérer la sécurité, parler à la base de données, traiter les formulaires… un travail énorme et risqué. <strong>Django</strong> (prononcé « djan-go ») est le framework web le plus complet du langage <strong>Python</strong>. Sa devise est « <em>batteries incluses</em> » : comme un jouet vendu avec ses piles, il fournit d'office tous les outils — un <strong>ORM</strong> (pour la base de données), l'<strong>authentification</strong> (la gestion des comptes et mots de passe), une <strong>interface d'administration</strong> (un tableau de bord automatique), et la sécurité.</p>
<div class="tip">Prérequis : le cours Python. Django, ce n'est QUE du Python — des classes, des fonctions, des dictionnaires. Tout ce que tu as appris s'applique. Le framework ajoute une organisation et des outils, pas un nouveau langage.</div>

<h3>2. Installer Django (dans un environnement virtuel)</h3>
<p>Un <strong>environnement virtuel</strong> (souvent abrégé <strong>venv</strong>, pour <em>virtual environment</em>) est une « bulle » isolée dans laquelle on installe les bibliothèques d'un seul projet, pour ne pas mélanger les versions d'un projet à l'autre — comme une trousse séparée par matière plutôt qu'un seul gros sac fourre-tout. Un <strong>terminal</strong> est la fenêtre noire où l'on tape des commandes au clavier au lieu de cliquer.</p>
<pre class="pseudo"># Dans un terminal :
python -m venv env                # crée un environnement virtuel isolé nommé "env" (leçon 15 Python)
source env/bin/activate           # l'active (Linux/Mac) — sous Windows : env\\Scripts\\activate
pip install django                # pip = installeur de paquets Python ; installe Django dans la bulle
django-admin --version            # affiche la version : vérifie que l'installation a réussi</pre>
<p><code>pip</code> est l'outil qui télécharge et installe des bibliothèques Python. <code>django-admin</code> est le programme en ligne de commande fourni par Django. On installe toujours Django dans un <strong>venv</strong> propre au projet, pour ne pas mélanger les versions entre projets. C'est exactement le réflexe vu à la fin du cours Python.</p>

<h3>3. Créer un projet et le lancer</h3>
<pre class="pseudo">django-admin startproject monsite   # crée un PROJET Django nommé « monsite » (un dossier + des fichiers de config)
cd monsite                          # cd = "change directory" : on entre DANS le dossier du projet
python manage.py runserver          # lance le SERVEUR de développement (un mini-serveur web pour tester)
# → ouvre http://127.0.0.1:8000 dans le navigateur : « The install worked successfully! »</pre>
<p><code>manage.py</code> est ton couteau suisse : toutes les commandes Django passent par <code>python manage.py ...</code> (lancer le serveur, créer les tables de la base, créer un compte administrateur…). L'adresse <code>127.0.0.1</code> désigne « ton propre ordinateur » et <code>8000</code> est le <em>port</em> (la « porte » numérotée) sur lequel le serveur de test écoute.</p>

<h3>4. La structure d'un projet Django</h3>
<pre class="pseudo">monsite/                     # le dossier principal du projet
├── manage.py                # le point d'entrée de TOUTES les commandes (runserver, migrate…)
└── monsite/                 # le « paquet » de configuration du projet (même nom, à l'intérieur)
    ├── settings.py          # la CONFIGURATION (base de données, apps installées, langue…)
    ├── urls.py              # les URLs racine : le ROUTAGE, c.-à-d. quelle adresse mène à quel code (leçon 2)
    ├── wsgi.py / asgi.py    # le lien technique avec le vrai serveur web (utile en production)
    └── __init__.py          # fichier vide qui indique à Python : "ce dossier est un paquet"</pre>
<p>Une <strong>URL</strong> (<em>Uniform Resource Locator</em>) est l'adresse d'une page, comme <code>monsite.com/contact</code>. Le <strong>routage</strong> est le plan qui associe chaque URL au bout de code chargé d'y répondre — comme le standard téléphonique d'une entreprise qui dirige chaque appel vers le bon service.</p>

<h3>5. Projet vs application</h3>
<p>Django distingue le <strong>projet</strong> (le site entier, avec sa configuration) des <strong>applications</strong> (des modules fonctionnels réutilisables : un blog, une boutique, une todo-liste…). Une <strong>application</strong> (souvent abrégée « app ») est comme un rayon spécialisé dans un magasin : le magasin (le projet) contient plusieurs rayons (les apps), chacun autonome et déplaçable ailleurs.</p>
<pre class="pseudo">python manage.py startapp taches    # crée l'application « taches » (un sous-dossier avec ses fichiers)
# puis on la DÉCLARE dans settings.py, dans la liste INSTALLED_APPS :
INSTALLED_APPS = [                   # INSTALLED_APPS = la liste des apps que Django doit activer
    # ... les apps de base de Django (admin, auth…) sont déjà listées ici ...
    "taches",                       # on ajoute notre application, entre guillemets, à la liste
]                                    # le crochet fermant termine la liste Python</pre>
<div class="warn">Une application créée avec <code>startapp</code> n'est active que si tu l'ajoutes à <code>INSTALLED_APPS</code> dans <code>settings.py</code>. C'est l'oubli n°1 du débutant : l'app existe mais Django l'ignore.</div>

<h3>6. La structure d'une application</h3>
<pre class="pseudo">taches/                # le dossier de l'application
├── models.py          # les MODÈLES : la description des tables de la base de données (leçon 9)
├── views.py           # les VUES : la logique qui répond aux requêtes du navigateur (leçon 3)
├── urls.py            # les URLs propres à l'app (fichier à créer soi-même, leçon 2)
├── admin.py           # pour brancher les modèles sur l'interface d'administration
├── apps.py            # la configuration interne de l'app (généralement on n'y touche pas)
└── migrations/        # l'historique des changements de la base de données (leçon 8)</pre>
<p>Un <strong>modèle</strong> est une classe Python qui décrit une table de la base (par exemple une tâche : son texte, si elle est faite…). Une <strong>vue</strong> est une fonction qui reçoit une requête et renvoie une réponse. Une <strong>migration</strong> est une « recette » enregistrée qui indique à la base comment se mettre à jour. On approfondira chacun à sa leçon.</p>
<div class="tip">Tout au long du cours, on construira une <strong>todo-liste</strong> : une application <code>taches</code> où l'on pourra ajouter, cocher et supprimer des tâches. Chaque leçon ajoutera une brique — exactement comme le gestionnaire de tâches du cours Python, mais en version web.</div>`,
