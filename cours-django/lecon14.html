  title: "settings.py et les environnements",
  subtitle: "Configurer le projet, du développement à la production.",
  theory: `
<h3>1. settings.py : le centre de configuration</h3>
<p><strong>Configurer</strong>, c'est régler les paramètres d'un logiciel — comme les réglages d'un appareil photo. <code>settings.py</code> rassemble TOUS les réglages du projet : les applications installées, la base de données, la sécurité, la langue, les fichiers statiques… C'est un simple fichier Python (une suite de variables), lu par Django au démarrage. On y trouve la « fiche d'identité » complète du projet.</p>

<h3>2. Les réglages essentiels</h3>
<pre class="pseudo">SECRET_KEY = "..."              # clé secrète de chiffrement du projet (à GARDER SECRÈTE !)
DEBUG = True                    # mode débogage : True en développement, False en production
ALLOWED_HOSTS = []              # liste des noms de domaine autorisés (obligatoire si DEBUG=False)
INSTALLED_APPS = [...]          # liste des applications actives (dont les tiennes !)
DATABASES = {...}               # configuration de la base de données
LANGUAGE_CODE = "fr-fr"         # la langue par défaut du site
TIME_ZONE = "Europe/Brussels"   # le fuseau horaire (pour les dates et heures)</pre>

<h3>3. INSTALLED_APPS : activer les applications</h3>
<pre class="pseudo">INSTALLED_APPS = [                  # la liste des applications que Django doit charger
    "django.contrib.admin",        # l'interface d'administration automatique
    "django.contrib.auth",         # l'authentification (comptes, mots de passe)
    "django.contrib.sessions",     # la gestion des sessions (leçon 13)
    # ... autres apps de base fournies par Django ...
    "taches",                      # TON application (à ne surtout pas oublier !)
]                                  # fin de la liste</pre>
<p>Toute application (la tienne ou une bibliothèque tierce comme Django REST Framework, leçon 18) doit figurer ici pour être active — une <strong>bibliothèque tierce</strong> est du code écrit par d'autres qu'on ajoute au projet. C'est aussi ce qui déclenche la détection de ses modèles par <code>makemigrations</code>.</p>

<h3>4. Les fichiers statiques et médias</h3>
<pre class="pseudo">STATIC_URL = "static/"                   # préfixe d'URL des fichiers statiques (ton CSS, JS, images)
STATIC_ROOT = BASE_DIR / "staticfiles"   # dossier où COLLECTER les statiques pour la production
MEDIA_URL = "media/"                     # préfixe d'URL des fichiers UPLOADÉS par les utilisateurs
MEDIA_ROOT = BASE_DIR / "media"          # dossier où STOCKER ces fichiers uploadés</pre>
<p>On distingue les fichiers <strong>statiques</strong> (ton CSS/JS/images, livrés avec le code) des <strong>médias</strong> (les fichiers <em>uploadés</em>, c'est-à-dire envoyés par les utilisateurs, comme des photos). En production, la commande <code>collectstatic</code> rassemble tous les statiques dans <code>STATIC_ROOT</code>.</p>

<h3>5. Le piège des secrets et des environnements</h3>
<p>Une <strong>variable d'environnement</strong> est une valeur définie en dehors du code, au niveau du système, et lue par le programme au démarrage — un moyen de fournir des réglages différents selon la machine sans toucher au code.</p>
<div class="warn">Trois réglages changent entre le développement et la PRODUCTION, et sont sensibles : <code>SECRET_KEY</code> (jamais dans le dépôt Git !), <code>DEBUG</code> (False en prod), et <code>ALLOWED_HOSTS</code> (les domaines réels). Ne les code JAMAIS « en dur » pour la production : on les lit depuis des <strong>variables d'environnement</strong>.</div>
<pre class="pseudo">import os                                                       # os : accès au système, dont os.environ
SECRET_KEY = os.environ.get("SECRET_KEY", "cle-de-dev-non-secrete")  # lit la clé dans l'environnement (repli en dev)
DEBUG = os.environ.get("DEBUG", "False") == "True"              # convertit le texte "True"/"False" en booléen
ALLOWED_HOSTS = os.environ.get("ALLOWED_HOSTS", "").split(",")  # transforme "a.com,b.com" en une liste</pre>

<h3>6. Le fichier .env</h3>
<pre class="pseudo"># fichier .env (JAMAIS versionné : ajouté au .gitignore)
SECRET_KEY=une-vraie-cle-tres-longue-et-aleatoire      # la vraie clé secrète de production
DEBUG=False                                            # pas de mode debug en production
ALLOWED_HOSTS=monsite.com,www.monsite.com              # les domaines réels du site

# avec la bibliothèque python-dotenv, on charge ce fichier au démarrage
# ainsi les secrets restent HORS du code source (hors de Git)</pre>
<div class="tip">Bonne pratique universelle : les <strong>secrets et réglages d'environnement</strong> vivent dans un fichier <code>.env</code>, exclu du dépôt Git (via <code>.gitignore</code>, le fichier qui liste ce que Git doit ignorer). Le code lit ces valeurs via <code>os.environ</code>. Ainsi, le même code tourne en développement et en production, avec des réglages différents — et aucune clé secrète ne se retrouve sur GitHub. C'est valable pour Django comme pour tout projet sérieux.</div>`,

    { type: "qcm", q: "Différence entre fichiers STATIQUES et MÉDIAS :", opts: ["Aucune", "Statiques = ton CSS/JS/images (avec le code) ; médias = fichiers uploadés par les utilisateurs", "Les médias sont plus rapides", "Statiques = base de données"], a: 1, exp: "static/ pour ton code, media/ pour les uploads." },
    { type: "qcm", q: "La commande <code>collectstatic</code> sert à…", opts: ["Migrer", "Rassembler tous les fichiers statiques dans STATIC_ROOT pour la production", "Créer une app", "Router"], a: 1, exp: "Étape de déploiement des statiques." },
    { type: "qcm", q: "Où NE doivent JAMAIS se trouver les secrets (SECRET_KEY…) ?", opts: ["Dans .env", "Dans le dépôt Git / le code source", "Dans os.environ", "En variable d'environnement"], a: 1, exp: "Les secrets restent hors du code versionné." },
    { type: "qcm", q: "Comment lire un secret sans le coder en dur ?", opts: ["L'écrire directement dans settings.py", "os.environ.get(\"SECRET_KEY\") : une variable d'environnement", "input()", "settings.SECRET"], a: 1, exp: "Le code lit la valeur depuis l'environnement." },
    { type: "qcm", q: "Un fichier <code>.env</code> contient…", opts: ["Du HTML", "Les secrets et réglages d'environnement (exclu du dépôt via .gitignore)", "Les URLs", "Le CSS"], a: 1, exp: "SECRET_KEY, DEBUG, ALLOWED_HOSTS… hors du code." },
    { type: "qcm", q: "Pourquoi séparer la config dev / production ?", opts: ["Par style", "Réglages et secrets DIFFÉRENTS : même code, comportements adaptés, aucune clé sur GitHub", "Pour la vitesse", "Aucun intérêt réel"], a: 1, exp: "Le même code tourne partout, avec des .env distincts." },
    { type: "qcm", q: "La base de données par défaut, définie dans DATABASES, est…", opts: ["MySQL", "SQLite (un fichier db.sqlite3)", "PostgreSQL", "Aucune"], a: 1, exp: "Changer de base = changer cette seule configuration." },
    { type: "vf", q: "Le fichier .env doit être ajouté au .gitignore pour ne pas se retrouver sur GitHub.", a: true, exp: "Les secrets ne doivent jamais être versionnés." },
    { type: "qcm", q: "Cette pratique (secrets en variables d'environnement) est…", opts: ["Propre à Django", "Universelle : valable pour tout projet sérieux (comme le cours PHP/Linux le montrait)", "Interdite", "Optionnelle en prod"], a: 1, exp: "Un standard de l'industrie, tous langages confondus." }
  ],
  final: {
    title: "Exercice final — Préparer la production",
    intro: `<p>On sécurise la configuration pour la mise en ligne :</p>
<pre class="pseudo"># settings.py

    # ... apps Django de base ...
    "taches",                                                # notre application, activée
]</pre>`,
    questions: [
      { type: "qcm", q: "D'où vient <code>SECRET_KEY</code> ici ?", opts: ["Codée en dur", "D'une variable d'environnement (os.environ), avec un repli pour le dev", "De l'URL", "Du template"], a: 1, exp: "Le secret n'est pas dans le code : il vient de l'environnement." },
      { type: "qcm", q: "Pourquoi <code>== \"True\"</code> pour DEBUG ?", opts: ["Décoration", "Une variable d'environnement est du TEXTE : on la compare à \"True\" pour obtenir un booléen", "Erreur", "Pour la vitesse"], a: 1, exp: "os.environ renvoie des str : on convertit." },
      { type: "qcm", q: "Que fait <code>.split(\",\")</code> sur ALLOWED_HOSTS ?", opts: ["Trie", "Transforme « a.com,b.com » en la liste [\"a.com\", \"b.com\"]", "Supprime", "Compte"], a: 1, exp: "Plusieurs domaines séparés par des virgules → une liste." },
      { type: "qcm", q: "Pourquoi <code>\"taches\"</code> doit être dans INSTALLED_APPS ?", opts: ["Style", "Sinon Django ignore l'app : pas de modèles détectés, pas de templates trouvés", "Pour la vitesse", "Uniquement pour l'admin"], a: 1, exp: "L'activation de l'application." },
      { type: "vf", q: "En production, on fournira SECRET_KEY, DEBUG=True et ALLOWED_HOSTS via un fichier .env non versionné.", a: false, exp: "Piège : en production DEBUG doit valoir False, pas True !" }
    ],
    solution: `<pre class="pseudo"># settings.py (prêt pour la production)

DEBUG = os.environ.get("DEBUG", "False") == "True"           # False par défaut (sûr)
ALLOWED_HOSTS = os.environ.get("ALLOWED_HOSTS", "").split(",")  # liste des domaines autorisés

# ALLOWED_HOSTS=monsite.com
# Secrets en variables d'environnement · DEBUG=False en prod ·
# INSTALLED_APPS pour activer les apps. Semaine 2 bouclée !</pre>
<p>Ta config est prête pour le monde réel. Demain : tester son application.</p>`
