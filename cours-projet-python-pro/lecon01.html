<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "Ce qui change au Niveau 8 : on pose les outils AVANT d'écrire la première ligne métier.",
  theory: `
<h3>1. La différence avec le Niveau 6</h3>
<p>Avant tout, quelques mots de base. Un <strong>ordinateur</strong> n'obéit qu'à des ordres écrits très précisément ; une <strong>application</strong> (ou « app ») est un ensemble de fichiers texte — le <strong>code</strong> — qui décrivent ces ordres. Un <strong>dépôt Git</strong> (prononcé « guite ») est le carnet de bord du projet : il conserve l'<strong>historique</strong> de toutes les versions du code, un peu comme la fonction « suivi des modifications » d'un traitement de texte, mais pour l'ensemble des fichiers ; chaque version enregistrée s'appelle un <strong>commit</strong>. La version officielle du code s'appelle <strong>main</strong> (la « branche principale ») ; on la garde « toujours déployable », c'est-à-dire prête à être mise en service à tout instant.</p>
<p>Un <strong>conteneur</strong> est une boîte qui emballe l'application avec tout ce dont elle a besoin pour fonctionner (comme un plat préparé livré avec ses couverts et sa notice) : ainsi elle tourne de façon identique sur n'importe quelle machine. <strong>Docker</strong> est l'outil qui fabrique et lance ces boîtes ; <strong>Docker Compose</strong> est le chef d'orchestre qui démarre plusieurs conteneurs ensemble — ici l'app et sa base de données — d'une seule commande. Le <strong>pipeline CI</strong> (« intégration continue ») est un contrôle qualité automatique : à chaque envoi de code, un robot reconstruit le projet et lance tous les tests. « <strong>CI verte</strong> » signifie que tout est passé (le feu est au vert) ; tant qu'il est rouge, le code n'a pas le droit d'entrer dans <code>main</code>.</p>
<p>Au Niveau 6, tu as construit la Ludothèque « à la main » : l'app d'abord, puis (aux cours d'outillage) les conteneurs, le pipeline et la sécurité. Ici, on inverse : le <strong>dépôt Git</strong>, le <strong>Docker Compose</strong>, le <strong>pipeline CI</strong> et la règle « rien n'entre dans main sans CI verte » existent <strong>dès le jour 1</strong>. Chaque fonctionnalité naîtra outillée.</p>

<h3>2. L'arborescence du projet pro</h3>
<pre class="pseudo">ludotheque/                projet Django (settings, urls, wsgi)
catalogue/                 l'app : models, views, services, forms, tests
Dockerfile                 l'image (dev puis prod, multi-stage)
compose.yaml               app + MySQL, réseau, volume (dev)
.github/workflows/ci.yml   tests + lint + build à chaque commit
requirements.txt           dépendances épinglées
.env / .env.docker         config et secrets — HORS Git
.gitignore .dockerignore   .env*, .venv/, __pycache__/, *.pyc</pre>
<p>L'application n'est qu'un dossier parmi d'autres : l'infrastructure (Docker, CI) est du <strong>code</strong>, versionnée avec le reste.</p>
<p>Décodons cette liste. Un <strong>Dockerfile</strong> est la <em>recette</em> qui explique comment construire l'<strong>image</strong> — l'image étant le <em>moule</em> figé à partir duquel on fabrique des conteneurs identiques (l'image est le gâteau photographié ; le conteneur, une part servie). « <strong>Multi-stage</strong> » veut dire que la recette se déroule en deux temps : un atelier encombré pour construire, puis une petite boîte finale propre pour livrer. <strong>MySQL</strong> est la <strong>base de données</strong> : le grand classeur où l'application range durablement ses informations. Un <strong>volume</strong> est un tiroir de rangement qui survit à l'extinction du conteneur (sans lui, les données disparaîtraient à chaque arrêt), et un <strong>réseau</strong> est le câble virtuel qui relie l'app à sa base. Le fichier <strong>requirements.txt</strong> liste les <strong>dépendances</strong> (les briques toutes faites réutilisées) avec leur numéro de version exact — on dit « <strong>épinglées</strong> » — pour que le projet se reconstruise à l'identique partout. Enfin, un <strong>secret</strong> (mot de passe, clé) et la configuration vivent dans des fichiers <code>.env</code> tenus <strong>hors de Git</strong> grâce à <code>.gitignore</code>, et hors de l'image grâce à <code>.dockerignore</code> : on ne range jamais ses clés dans la boîte qu'on distribue.</p>

<h3>3. La « Definition of Done »</h3>
<pre class="pseudo">Une fonctionnalité n'est « faite » que si :
  ✔ le code est écrit
  ✔ ses tests passent (unitaires + intégration)
  ✔ le lint est propre (ruff)
  ✔ l'image build (rien de cassé côté emballage)
  ✔ la PR est relue et la CI verte
« Ça marche chez moi » ne fait pas partie de la définition.</pre>
<p>La <strong>« Definition of Done »</strong> (« définition de terminé ») est la liste, décidée en équipe, des conditions pour déclarer une tâche réellement finie. Un <strong>test</strong> est un petit programme qui vérifie automatiquement qu'une partie du code fait bien ce qu'on attend ; les <strong>tests unitaires</strong> contrôlent une brique isolée, les <strong>tests d'intégration</strong> vérifient que plusieurs briques fonctionnent ensemble. Le <strong>lint</strong> est un correcteur automatique du style du code (comme un correcteur orthographique, mais pour la mise en forme) ; <strong>ruff</strong> est l'outil qui joue ce rôle en Python. « L'image <strong>build</strong> » signifie qu'elle se construit sans erreur (l'emballage tient). Enfin la <strong>PR</strong> (« pull request », demande de fusion) est la proposition d'intégrer son travail : un collègue la <strong>relit</strong> avant que le code ne rejoigne <code>main</code>. La phrase « ça marche chez moi » est bannie, car la CI tranche sur une machine neutre, identique pour tous.</p>

<h3>4. Le flux Git d'équipe (GitHub Flow)</h3>
<pre class="pseudo">main toujours déployable — personne n'y committe en direct
1 branche courte par changement (feature/…, fix/…)
push tôt -> pull request -> CI verte + revue -> merge -> branche supprimée</pre>
<p>Le <strong>GitHub Flow</strong> est une manière simple de travailler à plusieurs sans se gêner. <code>main</code> reste intouchable en direct. Pour chaque changement, on crée une <strong>branche</strong> courte — un brouillon séparé du projet — nommée par son intention (<code>feature/…</code> pour une nouveauté, <code>fix/…</code> pour une correction). On <strong>pousse</strong> (<em>push</em> : on envoie ses commits sur le serveur partagé) tôt, on ouvre une <strong>pull request</strong>, et ce n'est qu'après une CI verte et une revue qu'on <strong>fusionne</strong> (<em>merge</em> : on intègre la branche dans <code>main</code>) ; la branche, devenue inutile, est alors supprimée.</p>

<h3>5. Les trois disciplines en parallèle</h3>
<pre class="pseudo">CONSTRUIRE     le métier (modèles, services, API, frontend)
INDUSTRIALISER conteneurs, tests, CI, image, pipeline
SÉCURISER      entrées, secrets, auth, RGPD — par conception
À chaque leçon, les trois avancent ENSEMBLE, jamais l'une sans les autres.</pre>
<p>Ces trois chantiers avancent de front. <strong>Construire</strong>, c'est écrire le <em>métier</em> (ce que l'app fait vraiment pour l'utilisateur : gérer un catalogue de jeux, par exemple). <strong>Industrialiser</strong>, c'est tout ce qui rend le travail fiable et répétable (conteneurs, tests, pipeline). <strong>Sécuriser</strong>, c'est se protéger des erreurs et des attaques : valider les <strong>entrées</strong> (les données saisies par l'utilisateur, qu'on ne doit jamais croire sur parole), gérer l'<strong>authentification</strong> (vérifier l'identité de qui se connecte) et respecter le <strong>RGPD</strong> (la loi européenne qui protège les données personnelles). « <strong>Par conception</strong> » signifie qu'on y pense dès le début, pas en rattrapage à la fin.</p>
<div class="warn">La tentation reste de « coder d'abord, outiller après ». C'est précisément ce que ce niveau corrige : ajouter les tests, la sécurité ou la conteneurisation à la fin coûte dix fois plus cher (rétrofit) que de les poser au fil de l'eau. Le setup pro du jour 1 est un investissement, pas une perte de temps.</div>
<div class="tip">Prérequis assumés : tu maîtrises déjà Django (capstone N4), Docker, la CI/CD et la sécurité (N5). Ce cours ne réexplique pas ces briques — il les fait <strong>travailler ensemble</strong> sur un vrai projet.</div>`,
  exercises: [
    { type: "qcm", q: "Au Niveau 8, on pose les outils…", opts: ["À la fin, comme au Niveau 6", "Dès le jour 1, avant le métier", "Jamais", "Seulement en prod"], a: 1, exp: "Construire EN outillant." },
    { type: "qcm", q: "L'infrastructure (Docker, CI) est…", opts: ["Un réglage externe", "Du code versionné avec le projet", "Manuelle", "Secrète"], a: 1, exp: "Dockerfile, compose.yaml, ci.yml dans le dépôt." },
    { type: "qcm", q: "Le fichier du pipeline se trouve dans…", opts: [".github/workflows/", "/etc/ci", "le settings", "la base"], a: 0, exp: "Versionné, revu en PR." },
    { type: "qcm", q: "Les secrets (.env) sont…", opts: ["Dans le dépôt", "Hors Git ET hors image", "Dans l'image", "Dans le code"], a: 1, exp: ".gitignore + .dockerignore." },
    { type: "qcm", q: "La Definition of Done inclut…", opts: ["Le code seul", "Code + tests + lint + image + PR relue", "Juste que ça compile", "Rien"], a: 1, exp: "Contrat d'équipe." },
    { type: "qcm", q: "« Ça marche chez moi »…", opts: ["Suffit", "Ne fait pas partie de la définition de fait", "Est un test", "Est la CI"], a: 1, exp: "La CI tranche sur une machine neutre." },
    { type: "qcm", q: "Dans GitHub Flow, main est…", opts: ["Une branche de brouillon", "Toujours déployable, jamais committée en direct", "Supprimée souvent", "Facultative"], a: 1, exp: "Le pivot." },
    { type: "qcm", q: "Un changement part…", opts: ["Directement sur main", "D'une branche courte + PR", "Sans branche", "En prod"], a: 1, exp: "PR obligatoire." },
    { type: "qcm", q: "Les trois disciplines menées en parallèle :", opts: ["Construire, industrialiser, sécuriser", "Écrire, tester, documenter", "Analyser, coder, livrer", "Aucune"], a: 0, exp: "Ensemble, à chaque leçon." },
    { type: "qcm", q: "Ajouter la sécurité à la fin (rétrofit)…", opts: ["Est gratuit", "Coûte bien plus cher que par conception", "Est impossible", "Est mieux"], a: 1, exp: "D'où le « par conception »." },
    { type: "vf", q: "Le Docker Compose et le pipeline existent avant la première fonctionnalité métier.", a: true, exp: "Le setup pro du jour 1." },
    { type: "qcm", q: "L'app Django, dans l'arborescence, est…", opts: ["Le seul élément", "Un dossier parmi d'autres (à côté de Dockerfile, ci.yml…)", "Absente", "Dans l'image seule"], a: 1, exp: "L'infra l'entoure." },
    { type: "qcm", q: "Ce cours suppose acquis…", opts: ["Rien", "Django (N4), Docker, CI/CD et Sécurité (N5)", "Uniquement les bases du HTML/CSS", "La programmation système en C"], a: 1, exp: "Il les fait travailler ensemble." },
    { type: "qcm", q: "requirements.txt doit être…", opts: ["Épinglé (versions figées)", "Vide", "Sans numéros de version", "Secret"], a: 0, exp: "Reproductibilité." },
    { type: "vf", q: "Au Niveau 8, chaque fonctionnalité naît testée et surveillée.", a: true, exp: "Le pipeline est là dès le départ." }
  ],
  final: {
    title: "Exercice final — Les fondations posées",
    intro: `<p>On vérifie que le projet démarre « à la pro ».</p>`,
    questions: [
      { type: "qcm", q: "Avant d'écrire du métier, on met en place :", opts: ["Dépôt Git + Compose + pipeline + .env hors Git", "juste l'app", "l'app et sa base seulement", "rien"], a: 0, exp: "Le setup du jour 1." },
      { type: "qcm", q: "Une fonctionnalité est « faite » quand :", opts: ["Code + tests verts + lint + image build + PR relue", "elle compile", "on l'a poussée", "on le décide"], a: 0, exp: "Definition of Done." },
      { type: "qcm", q: "main se modifie :", opts: ["Via PR (branche courte, CI verte, revue)", "en direct", "par un push forcé sur main", "en prod"], a: 0, exp: "GitHub Flow." },
      { type: "qcm", q: "Les secrets vivent :", opts: ["Hors Git et hors image (variables d'environnement)", "dans le code", "dans l'image", "dans settings.py commité"], a: 0, exp: "Par conception." },
      { type: "vf", q: "Métier, industrialisation et sécurité avancent ensemble, à chaque étape.", a: true, exp: "Le fil du Niveau 8." }
    ],
    solution: `<pre class="pseudo">ludotheque/  catalogue/  Dockerfile  compose.yaml
.github/workflows/ci.yml   requirements.txt (épinglé)
.env* (hors Git/image)     .gitignore  .dockerignore

Definition of Done : code + tests + lint + image + PR relue
Flux : branche courte -> PR -> CI verte + revue -> merge sur main
Trois disciplines en parallèle : construire, industrialiser, sécuriser</pre>
<p>Les fondations pro sont posées. Demain : le squelette Django dans Docker Compose.</p>`
  }
};
</script>
