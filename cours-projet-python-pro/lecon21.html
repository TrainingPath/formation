<script>
var DAY = {

  title: "Récapitulatif : le projet professionnel de bout en bout (examen)",
  subtitle: "Construire, industrialiser, sécuriser — les trois disciplines, en même temps.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et la Ludothèque pro a été construite, conteneurisée, testée, sécurisée, livrée et surveillée — comme en entreprise. Récapitulons.</p>

<h3>1. Fondations outillées (semaine 1)</h3>
<p>Le dépôt, le Compose et le <strong>pipeline posés avant le métier</strong> ; « Definition of Done » (code + tests + lint + image) ; schéma migré en conteneur, index anticipés ; modèles et services <strong>testés dès l'écriture</strong> ; API et job de tests avec MySQL, au vert.</p>

<h3>2. Le métier, sécurisé et testé (semaine 2)</h3>
<p>Validation en liste d'autorisation ; auth <strong>durcie dès le premier compte</strong> (argon2, cookies) ; autorisation rôle + ressource, <strong>anti-IDOR testé</strong> ; louer/acheter transactionnels, prix figé, couverture-cliquet ; frontend échappé + en-têtes ; secrets hors du code, scannés.</p>

<h3>3. La livraison professionnelle (semaine 3)</h3>
<p>Recherche/pagination sans N+1 (<strong>testé</strong>) ; espaces cloisonnés (refus croisé) ; image de prod <strong>multi-stage, non-root, scannée</strong> ; pipeline complet + protection de branche ; déploiement automatisé staging/prod + /sante/ ; observabilité, sauvegardes, RGPD, rollback N-1.</p>

<h3>Le trajet d'une fonctionnalité</h3>
<pre class="pseudo">branche → code + test écrits ENSEMBLE + validation + autorisation
  → CI (tests MySQL, lint, gitleaks, image+scan) → revue → merge
  → staging auto → recette → tag → build+scan+push → approbation → prod → /sante/</pre>
<div class="tip">À aucun moment le métier n'avance sans son test ni sa protection. C'est la vraie différence avec le Niveau 6 — et le quotidien d'une équipe pro. Bonne épreuve, la dernière de la formation !</div>`,
  exercises: [
    { type: "qcm", q: "La différence clé du Niveau 8 :", opts: ["Un autre langage", "Construire EN outillant (les 3 disciplines ensemble)", "Une autre base", "Plus de fonctionnalités métier"], a: 1, exp: "Pas « construire puis outiller »." },
    { type: "qcm", q: "Le pipeline est posé…", opts: ["À la fin", "Avant le métier (jour 1)", "En prod", "Jamais"], a: 1, exp: "Setup pro." },

    { type: "qcm", q: "Les modèles/services sont testés…", opts: ["En semaine 3", "Dès l'écriture (même commit)", "Jamais", "En prod"], a: 1, exp: "TDD léger." },
    { type: "qcm", q: "La couche service se teste…", opts: ["Seulement avec MySQL", "Sans base (SimpleTestCase), en millisecondes", "En prod", "Jamais"], a: 1, exp: "Pipeline rapide." },
    { type: "qcm", q: "L'auth est durcie…", opts: ["En fin de parcours", "Dès le premier compte (argon2, cookies)", "Jamais", "En prod"], a: 1, exp: "Par conception." },
    { type: "qcm", q: "L'anti-IDOR se garantit par…", opts: ["Le menu masqué", "Le filtrage par request.user + test d'accès croisé", "Un UUID", "HTTPS"], a: 1, exp: "Rôle ET ressource." },
    { type: "qcm", q: "Louer/acheter sont…", opts: ["Non testés", "Transactionnels, écrits avec leur test d'intégration", "En prod seulement", "Optionnels"], a: 1, exp: "Verrouillés en CI." },
    { type: "qcm", q: "Le montant d'un achat…", opts: ["Vient du POST", "Est figé (copié de jeu.prix_achat)", "Est nul", "Change avec le prix"], a: 1, exp: "Une facture ne change pas." },
    { type: "qcm", q: "Le frontend hérite gratuitement de…", opts: ["Rien", "L'échappement DTL + les en-têtes de sécurité", "Une 2e base", "Un WAF"], a: 1, exp: "Sécurité du rendu." },
    { type: "qcm", q: "Les secrets vivent…", opts: ["Dans le code", "Hors code/image, scannés par gitleaks", "En clair", "Dans Git"], a: 1, exp: "Config par environnement." },
    { type: "qcm", q: "La performance (N+1) est…", opts: ["Espérée", "Testée (assertNumQueries)", "Ignorée", "En prod seulement"], a: 1, exp: "Comportement vérifié." },
    { type: "qcm", q: "Chaque espace a…", opts: ["Rien", "Son test de refus croisé", "Un WAF", "Un cache"], a: 1, exp: "Matrice verrouillée." },

    { type: "qcm", q: "Le déploiement en prod…", opts: ["À chaque commit", "Sur tag + approbation, puis /sante/ vérifié", "À la main", "Jamais"], a: 1, exp: "Décision humaine du moment." },
    { type: "qcm", q: "Le rollback est trivial grâce…", opts: ["Aux sauvegardes de la base", "Aux images immuables + migrations N-1", "À un WAF", "Au redémarrage du serveur"], a: 1, exp: "Retour < 5 min." },
    { type: "qcm", q: "Le principe directeur du cours :", opts: ["Construire puis outiller", "Construire, industrialiser, sécuriser EN MÊME TEMPS", "Outiller puis construire", "Sécuriser seulement à la fin"], a: 1, exp: "Les trois disciplines ensemble." }
  ],
  final: {
    title: "Épreuve de synthèse — Le trajet complet",

      { type: "qcm", q: "Après le merge :", opts: ["Staging se déploie seul, recette", "la prod direct", "rien", "un rebuild manuel"], a: 0, exp: "Répétition générale." },

      { type: "vf", q: "À aucun moment le métier n'avance sans son test ni sa protection.", a: true, exp: "🎓 La marque du Niveau 8." }
    ],
    solution: `<pre class="pseudo">git switch -c feature/reservation
  code métier (service) + test + validation + autorisation ENSEMBLE
  push → CI : tests(MySQL) + qualite + securite + image(scan)
  revue → merge (protection de branche)
  → STAGING auto → recette
git tag v1.3.0
  → build + scan CVE + push registre
  → approbation → déploiement prod (pull/up/migrate)
  → curl /sante/ 200 ; logs et sauvegardes en place ; rollback prêt (N-1)</pre>
<p>🎓 <strong>Félicitations — et bravo pour toute la formation !</strong> Tu as mené un projet full-stack comme une vraie équipe : construit, conteneurisé, testé, sécurisé, livré par un pipeline et exploité. Non plus « d'abord l'app, puis les outils », mais les trois disciplines d'un même pas. C'est exactement le métier.</p>`
  }
};
