  title: "Secrets et configuration par environnement",
  subtitle: "Rien de sensible dans le dépôt ni l'image — et un scan qui le garantit.",
  theory: `
<h3>1. La config lit l'environnement</h3>
<pre class="pseudo"># settings.py
SECRET_KEY = os.environ["DJANGO_SECRET_KEY"]        # lit la cle secrete dans l'environnement ; KeyError si absent (voulu)
DEBUG = os.environ.get("DJANGO_DEBUG", "0") == "1"   # DEBUG actif seulement si la variable vaut "1" (0 par defaut)
DATABASES["default"]["PASSWORD"] = os.environ["DB_PASSWORD"]   # mot de passe de la base lu depuis l'environnement
ALLOWED_HOSTS = os.environ.get("ALLOWED_HOSTS", "").split(",")   # liste des domaines autorises, decoupee sur les virgules</pre>
<p>La <strong>configuration</strong> réunit les réglages qui varient d'un environnement à l'autre (clé secrète, mot de passe, mode debug). <code>os.environ</code> est le tableau des <strong>variables d'environnement</strong> — des valeurs fournies de l'extérieur au démarrage. Utiliser <code>os.environ["..."]</code> (avec crochets) plutôt que <code>.get(...)</code> est volontaire : si la variable manque, le programme s'arrête net avec une erreur claire, au lieu de démarrer sur une valeur vide et dangereuse. La même image tourne en dev, CI et prod : seule la configuration change. C'est cette <strong>parité</strong> qui rend le déploiement sans surprise.</p>

<h3>2. Où un secret ne va JAMAIS</h3>
<pre class="pseudo">✘ dans le code, dans Git, dans l'image, dans les logs, dans un ticket
✔ variables d'environnement / gestionnaire de secrets (Vault, secrets GitHub)
.env* dans .gitignore ET .dockerignore (doublement exclus)</pre>

<h3>3. Le scan de secrets, dans le pipeline</h3>
<pre class="pseudo"># ci.yml — job securite
  securite:   # un job dedie a la securite
    steps:   # ses etapes
      - uses: actions/checkout@v4   # recuperer le code…
        with: { fetch-depth: 0 }               # tout l'historique
      - run: gitleaks detect --source . --redact --exit-code 1   # scanner les secrets ; --redact masque les valeurs ; --exit-code 1 = echec si trouve
# un secret commité (même dans un vieux commit) → job rouge → merge bloqué</pre>
<p>Le hook pre-commit (gitleaks) bloque en amont ; la CI est le deuxième filet.</p>

<h3>4. La rotation d'un secret exposé</h3>
<pre class="pseudo">1. RÉVOQUER la clé chez le fournisseur (immédiat)
2. GÉNÉRER une nouvelle valeur
3. La poser dans le gestionnaire de secrets / l'environnement
4. VÉRIFIER que le service repart
5. AUDITER l'usage pendant l'exposition
→ un secret exposé est GRILLÉ : on le remplace, on ne le « cache » pas.</pre>

<h3>5. Bilan de la semaine 2</h3>
<div class="warn">« Je l'ai supprimé au commit suivant » est faux : l'historique Git n'oublie rien, et le dépôt a pu être cloné. La seule réponse est la rotation. Le hook pre-commit + le scan en CI empêchent le secret d'entrer — l'investissement le plus rentable de la sécurité opérationnelle.</div>
<div class="tip">Fin de la semaine 2 : l'application est complète, testée ET sécurisée — entrées validées, comptes durcis, IDOR fermé, rendu échappé, secrets hors du code et scannés. On n'a jamais eu à « rattraper » la sécurité : elle a poussé avec le code. Reste à industrialiser la livraison (semaine 3).</div>`,

    { type: "qcm", q: "Le hook pre-commit…", opts: ["Déploie", "Bloque un secret AVANT le commit", "Chiffre", "Ralentit Git"], a: 1, exp: "Prévention à la source." },
    { type: "qcm", q: "La première action face à un secret exposé :", opts: ["Enquêter", "Révoquer la clé (immédiat)", "Réécrire l'historique", "Attendre"], a: 1, exp: "Rotation d'abord." },
    { type: "qcm", q: "Un secret exposé est…", opts: ["Récupérable", "Grillé : on le remplace", "Toujours sûr", "Chiffré sur place"], a: 1, exp: "Rotation obligatoire." },
    { type: "vf", q: "« Supprimé au commit suivant » suffit à sécuriser un secret.", a: false, exp: "L'historique le garde." },
    { type: "qcm", q: "os.environ[\"DJANGO_SECRET_KEY\"] (sans .get) …", opts: ["Est une faute", "Refuse de démarrer si absent (KeyError claire)", "Est vide", "Est chiffré"], a: 1, exp: "Mieux qu'un démarrage sur clé vide." },

    { type: "qcm", q: "Le hook + le scan en CI forment…", opts: ["Une redondance inutile", "Deux filets (avant et pendant l'intégration)", "Un WAF", "Un audit annuel"], a: 1, exp: "Défense en profondeur." },
    { type: "qcm", q: "À la fin de la semaine 2, l'app est…", opts: ["Juste construite", "Complète, testée ET sécurisée", "Déployée", "En placeholder"], a: 1, exp: "Sécurité poussée avec le code." },
    { type: "vf", q: "On n'a jamais eu à « rattraper » la sécurité.", a: true, exp: "Par conception, du début." }
  ],

    solution: `<pre class="pseudo"># settings.py
SECRET_KEY = os.environ["DJANGO_SECRET_KEY"]   # cle secrete lue dans l'environnement (obligatoire)
DEBUG = os.environ.get("DJANGO_DEBUG", "0") == "1"   # DEBUG seulement si la variable vaut "1"

# ci.yml — job securite
  securite:   # job de securite
    steps:   # ses etapes

      - run: gitleaks detect --source . --redact --exit-code 1   # scanner les secrets, echouer si l'un est trouve</pre>
<p>Fin de la semaine 2 : app complète, testée, sécurisée. Lundi : la livraison professionnelle.</p>`
  }
