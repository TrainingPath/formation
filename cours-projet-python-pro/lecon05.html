<script>
var DAY = {
  num: 5,
  title: "Les modèles du catalogue, testés dès l'écriture",
  subtitle: "La règle et son test dans le même commit — le TDD léger d'une équipe.",
  theory: `
<h3>1. Écrire la règle ET son test ensemble</h3>
<p>Au Niveau 6, les tests arrivaient en semaine 3. Ici, chaque propriété et chaque <strong>QuerySet</strong> métier naît <strong>avec son test</strong>, dans le même <strong>commit</strong>. Un <strong>QuerySet</strong> est une requête vers la base présentée comme une liste d'objets que l'on peut filtrer et compter ; lui donner des méthodes nommées (<code>louables()</code>) revient à se forger un petit vocabulaire métier réutilisable. Écrire la règle et sa vérification ensemble est une forme légère de <strong>TDD</strong> (« développement piloté par les tests »). La CI (leçon 7) les exécute aussitôt : une <strong>régression</strong> — un comportement qui marchait et se casse — devient rouge immédiatement.</p>

<h3>2. Le vocabulaire métier</h3>
<pre class="pseudo">class Fournisseur(models.Model):   # un fournisseur de jeux = une table
    nom = models.CharField(max_length=150)   # nom du fournisseur (texte court)
    email = models.EmailField(unique=True)   # email valide et unique : un seul compte par adresse

class Jeu(models.Model):   # (extrait) le modele Jeu, complete
    ...   # (les champs deja vus a la lecon 4 restent la)
    fournisseur = models.ForeignKey(Fournisseur, null=True, blank=True,   # lien OPTIONNEL vers un fournisseur (null autorise)
                                    on_delete=models.SET_NULL)   # si le fournisseur est supprime : mettre la FK a NULL, garder le jeu
    objects = JeuQuerySet.as_manager()   # remplace le gestionnaire par defaut par notre QuerySet metier
    @property   # transforme la methode en attribut calcule (s'appelle sans parentheses)
    def est_louable(self): return self.stock_location > 0   # vrai si au moins un exemplaire est louable
    @property   # autre propriete calculee
    def est_achetable(self): return self.stock_vente > 0   # vrai si au moins un exemplaire est en vente

class JeuQuerySet(models.QuerySet):   # un QuerySet personnalise : des filtres metier nommes
    def louables(self): return self.filter(stock_location__gt=0)   # ne garde que les jeux dont stock_location > 0 (gt = greater than)</pre>

<h3>3. Les tests, dans la foulée</h3>
<pre class="pseudo">class ModelesTests(TestCase):   # une classe de tests ; TestCase = boite a outils de test de Django
    def setUp(self):   # execute AVANT chaque test : prepare les donnees communes
        self.cat = Categorie.objects.create(nom="Stratégie")   # cree une categorie reutilisee par les tests

    def test_non_louable_si_stock_nul(self):   # 1er test : un jeu sans stock de location n'est pas louable
        jeu = Jeu.objects.create(titre="Catan", prix_achat=30, prix_location=5,   # cree un jeu de test…
                                 stock_location=0, categorie=self.cat)   # …avec stock_location = 0
        self.assertFalse(jeu.est_louable)   # on VERIFIE que est_louable vaut Faux

    def test_queryset_louables(self):   # 2e test : le filtre louables() ne renvoie que les jeux louables
        Jeu.objects.create(titre="A", prix_achat=1, prix_location=1,   # jeu A…
                           stock_location=3, categorie=self.cat)   # …louable (stock 3)
        Jeu.objects.create(titre="B", prix_achat=1, prix_location=1,   # jeu B…
                           stock_location=0, categorie=self.cat)   # …non louable (stock 0)
        self.assertEqual(Jeu.objects.louables().count(), 1)   # on VERIFIE : un seul jeu louable trouve</pre>

<h3>4. TestCase : base neuve, test isolé</h3>
<pre class="pseudo">Django crée une base de TEST (jamais la vraie), et enveloppe chaque test
dans une transaction annulée à la fin → les tests ne se voient pas entre eux.
Lancer : docker compose exec app python manage.py test</pre>
<p>Un <strong>test</strong> Django hérite de <code>TestCase</code>. Django crée pour l'occasion une <strong>base de test</strong> séparée (jamais la vraie), et enveloppe chaque test dans une <strong>transaction</strong> — un bloc d'opérations annulé (« rollback ») à la fin — si bien que les tests repartent d'une base propre et ne se voient pas les uns les autres. <code>setUp</code> prépare les données communes avant <em>chaque</em> test ; les méthodes <code>assertFalse</code>, <code>assertEqual</code>… vérifient qu'on obtient bien le résultat attendu.</p>

<h3>5. Pourquoi « en même temps » ?</h3>
<div class="warn">Un test écrit « plus tard » n'est souvent jamais écrit — ou couvre le cas nominal, pas les cas limites. Écrit dans le même commit que la règle, il capture l'intention pendant qu'elle est fraîche, et documente le comportement attendu. « Non testé = non fait » (Definition of Done, leçon 1).</div>
<div class="tip">Le test de <code>est_louable</code> ne touche pas la base pour la logique, mais <code>TestCase</code> reste pratique pour créer des objets réels. Pour les règles purement calculatoires (leçon 6), on testera sans base du tout — encore plus rapide.</div>`,
  exercises: [
    { type: "qcm", q: "Au Niveau 8, les tests des modèles sont écrits…", opts: ["En semaine 3", "Avec la règle, dans le même commit", "Jamais", "Après la prod"], a: 1, exp: "TDD léger." },
    { type: "qcm", q: "@property est_louable renvoie…", opts: ["Le prix", "stock_location > 0 (une règle, un endroit)", "Le titre", "Un QuerySet"], a: 1, exp: "Point de vérité unique." },
    { type: "qcm", q: "Le QuerySet louables() encapsule…", opts: ["Le calcul du prix moyen", "Le filtre métier stock_location__gt=0", "Le tri", "La sécurité"], a: 1, exp: "Vocabulaire réutilisable." },
    { type: "qcm", q: "TestCase crée…", opts: ["La base de prod", "Une base de test (jamais la vraie)", "Aucune base", "Un fichier"], a: 1, exp: "Isolée, jetable." },
    { type: "qcm", q: "Chaque test est isolé car…", opts: ["Il vide les tables à la main", "Enveloppé dans une transaction annulée à la fin", "Il copie la base", "Il est seul"], a: 1, exp: "Les tests ne se voient pas." },
    { type: "qcm", q: "Lancer les tests :", opts: ["docker compose exec app python manage.py test", "sur l'hôte sans venv", "en prod", "docker compose up test"], a: 0, exp: "Dans le conteneur." },
    { type: "qcm", q: "Un test écrit « plus tard »…", opts: ["Est meilleur", "Est souvent jamais écrit ou incomplet", "Est plus rapide", "Est obligatoire"], a: 1, exp: "D'où « en même temps »." },
    { type: "qcm", q: "assertFalse(jeu.est_louable) sur stock 0…", opts: ["Échoue", "Vérifie la règle métier", "Migre", "Chiffre"], a: 1, exp: "Le test de la propriété." },
    { type: "qcm", q: "SET_NULL sur fournisseur exige…", opts: ["null=True", "unique=True", "default=0", "rien"], a: 0, exp: "La FK doit accepter NULL." },
    { type: "qcm", q: "La CI exécute ces tests…", opts: ["Une fois par mois", "À chaque commit (leçon 7)", "En prod", "Jamais"], a: 1, exp: "Régression = rouge immédiat." },
    { type: "vf", q: "« Non testé = non fait » fait partie de la Definition of Done.", a: true, exp: "Leçon 1." },
    { type: "qcm", q: "setUp() sert à…", opts: ["Déployer", "Préparer les données communes avant chaque test", "Nettoyer la base après le test", "Rien"], a: 1, exp: "Arrange partagé." },
    { type: "qcm", q: "Écrire le test avec la règle…", opts: ["Ralentit", "Capture l'intention pendant qu'elle est fraîche", "Est inutile", "Casse la CI"], a: 1, exp: "Documentation vivante." },
    { type: "qcm", q: "est_achetable regarde…", opts: ["stock_location", "stock_vente", "le prix", "la date"], a: 1, exp: "Deux stocks, deux propriétés." },
    { type: "vf", q: "Une régression future sur est_louable rendra un test rouge.", a: true, exp: "Le filet permanent." }
  ],
  final: {
    title: "Exercice final — Règle + test dans le même commit",
    intro: `<p>On ajoute une propriété et son test, ensemble.</p>`,
    questions: [
      { type: "qcm", q: "est_louable :", opts: ["@property renvoyant stock_location > 0", "une colonne", "un template", "un service"], a: 0, exp: "Calculée." },
      { type: "qcm", q: "Son test :", opts: ["assertFalse sur un jeu à stock 0", "un print", "rien", "un déploiement"], a: 0, exp: "Écrit dans la foulée." },
      { type: "qcm", q: "louables() se teste par :", opts: ["count() sur des jeux à stocks variés", "un chrono", "un mock de la base", "rien"], a: 0, exp: "QuerySet vérifié." },
      { type: "qcm", q: "La base des tests :", opts: ["Une base de test jetable", "la prod", "aucune", "SQLite en prod"], a: 0, exp: "TestCase." },
      { type: "vf", q: "Le commit contient la règle ET son test.", a: true, exp: "Le réflexe du Niveau 8." }
    ],
    solution: `<pre class="pseudo">class Jeu(models.Model):   # (extrait) le modele Jeu
    ...   # (champs de la lecon 4)
    objects = JeuQuerySet.as_manager()   # notre QuerySet metier devient le gestionnaire
    @property   # attribut calcule (sans parentheses a l'appel)
    def est_louable(self): return self.stock_location > 0   # vrai si un exemplaire est louable

class JeuQuerySet(models.QuerySet):   # filtres metier nommes
    def louables(self): return self.filter(stock_location__gt=0)   # jeux dont stock_location > 0

# tests.py (même commit)   # le test vit dans le meme commit que la regle
def test_non_louable_si_stock_nul(self):   # un jeu a stock 0 ne doit pas etre louable
    jeu = Jeu.objects.create(titre="Catan", prix_achat=30, prix_location=5,   # jeu de test…
                             stock_location=0, categorie=self.cat)   # …avec stock_location = 0
    self.assertFalse(jeu.est_louable)   # verifie que est_louable = Faux</pre>
<p>Modèles et filet posés ensemble. Demain : la couche service, sous CI.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta règle et son test…",
  items: [
  { id: "proj6py-l5", title: "La propriété en_retard et son test", level: 3,
    statement: "Ajoute au modèle Location une propriété en_retard (pas de date_retour ET date_debut + nb_jours dépassé), et écris son test dans le même commit : un cas en retard, un cas rendu (pas en retard), un cas encore dans les temps. Utilise timezone et timedelta. Explique pourquoi tester les 3 cas plutôt qu'un seul.",
    hints: [
      "fin = date_debut + timedelta(days=nb_jours) ; en_retard = date_retour is None and now > fin.",
      "3 cas : dépassé non rendu (True), dépassé rendu (False), non dépassé (False).",
      "Un seul cas passerait à côté d'un bug (ex. oublier la condition date_retour)."
    ],
    solution: "from datetime import timedelta   # pour exprimer une duree en jours\nfrom django.utils import timezone   # pour l'heure courante (avec fuseau horaire)\n\nclass Location(models.Model):   # (extrait) le modele Location\n    ...   # (champs de la lecon 4)\n    @property   # attribut calcule : s'appelle sans parentheses\n    def en_retard(self):   # vrai si la location a depasse sa date de fin sans retour\n        fin = self.date_debut + timedelta(days=self.nb_jours)   # date theorique de retour\n        return self.date_retour is None and timezone.now() > fin   # non rendue ET on a depasse la fin\n\n# tests.py — les 3 cas, même commit\nclass LocationTests(TestCase):   # classe de tests de la location\n    def setUp(self):   # prepare les donnees communes avant chaque test\n        self.cat = Categorie.objects.create(nom=\"Stratégie\")   # une categorie\n        self.jeu = Jeu.objects.create(titre=\"Catan\", prix_achat=30, prix_location=5,   # un jeu de test…\n                                      stock_location=5, categorie=self.cat)   # …avec du stock\n        self.u = User.objects.create_user(\"c@ludo.fr\", \"c@ludo.fr\", \"Mdp8carac!\")   # un client de test\n\n    def _loc(self, jours_avant, rendue=False):   # fabrique une location commencee « jours_avant » jours plus tot\n        debut = timezone.now() - timedelta(days=jours_avant)   # date de debut dans le passe\n        retour = timezone.now() if rendue else None   # date de retour si rendue, sinon None (en cours)\n        return Location.objects.create(client=self.u, jeu=self.jeu,   # cree la location…\n                    date_debut=debut, nb_jours=7, date_retour=retour)   # …duree 7 jours\n\n    def test_depasse_non_rendu_est_en_retard(self):   # cas 1 : depasse et non rendu\n        self.assertTrue(self._loc(10).en_retard)          # 10 j > 7 j, non rendu -> en retard\n    def test_depasse_mais_rendu_pas_en_retard(self):   # cas 2 : depasse mais rendu\n        self.assertFalse(self._loc(10, rendue=True).en_retard)  # rendu -> pas en retard\n    def test_dans_les_temps_pas_en_retard(self):   # cas 3 : encore dans les temps\n        self.assertFalse(self._loc(2).en_retard)          # 2 j < 7 j -> pas en retard\n\n# Pourquoi 3 cas : la règle combine DEUX conditions (délai ET non rendu).\n# Un seul cas (« dépassé ») validerait le délai mais laisserait passer un bug\n# sur la condition date_retour — le cas « dépassé mais rendu » l'attrape.",
    note: "Une règle à deux conditions demande au moins autant de tests que de branches : le cas « dépassé mais rendu » est celui qui distingue un test sérieux d'un test décoratif. Écrire ces trois cas AVEC la propriété force à réfléchir à toutes les branches pendant qu'on la conçoit — c'est là que le test attrape le plus de bugs, avant même qu'ils existent." }
  ]
};
</script>
