  title: "Le pipeline complet : build, push, scan, protection",
  subtitle: "Assembler l'usine de bout en bout et verrouiller main.",
  theory: `
<h3>1. Le pipeline de CI, à ce stade</h3>
<pre class="pseudo">push / PR
   ├─ tests (MySQL) + couverture     ┐
   ├─ qualite (ruff check + format)  ┤ en parallèle
   └─ securite (gitleaks)            ┘
        └─ image (build + trivy + smoke test)   needs: les trois
BARRIÈRE : merge SEULEMENT si tout est vert + 1 revue.</pre>
<p>Le <strong>pipeline</strong> est la chaîne de vérifications automatiques qui s'exécute à chaque envoi de code. Ses jobs indépendants (tests, qualité, sécurité) tournent <em>en parallèle</em> pour aller vite ; le job <code>image</code> attend leur feu vert (<code>needs</code>). Un <strong>status check</strong> est le verdict d'un job (vert ou rouge) que la <strong>protection de branche</strong> peut exiger avant d'autoriser un <strong>merge</strong> (la fusion dans <code>main</code>). La barrière : on ne fusionne que si tout est vert <em>et</em> qu'un collègue a relu (la <strong>revue</strong>).</p>

<h3>2. Le workflow de release (sur tag)</h3>
<pre class="pseudo"># .github/workflows/release.yml
on: { push: { tags: ["v*"] } }        # SEUL un tag de version déclenche
jobs:   # les travaux du workflow
  publier:   # un job « publier »
    steps:   # ses etapes
      - uses: actions/checkout@v4   # recuperer le code du tag
      - run: echo "VERSION=${'$'}{GITHUB_REF_NAME#v}" >> "${'$'}GITHUB_ENV"   # v1.0.0 → 1.0.0
      - run: echo "${'$'}{{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # se connecter au registre via un secret (par stdin)
      - run: |   # une commande sur plusieurs lignes
          docker build -t ghcr.io/toi/ludotheque:${'$'}VERSION .   # construire l'image versionnee
          trivy image --exit-code 1 --severity CRITICAL ghcr.io/toi/ludotheque:${'$'}VERSION   # scanner ; echouer sur une CRITIQUE
          docker push ghcr.io/toi/ludotheque:${'$'}VERSION   # publier l'image au registre</pre>
<p>Le tag Git (aligné sur semver) déclenche build + scan + push d'un artefact <strong>versionné et immuable</strong>. Code et image racontent la même histoire.</p>

<h3>3. La protection de branche</h3>
<pre class="pseudo">Settings → Branches → main :
✔ Require PR + 1 approbation
✔ Require status checks : tests, qualite, securite, image
✔ Require branches up to date ; ✔ no bypass (admins compris)</pre>

<h3>4. Le graphe complet</h3>
<pre class="pseudo">── ci.yml ────────────  (~6-9 min)
push/PR → tests+qualite+securite (parallèle) → image → [si main] staging
── release.yml ───────  (~4-6 min + approbation)
git tag v1.0.0 → publier (build+scan+push) → approbation → production</pre>

<h3>5. La durée compte</h3>
<div class="warn">Un pipeline de 40 minutes se contourne (« je merge, on verra ») ; un pipeline de 8 minutes est utilisé. Les caches (pip, build), le parallélisme et des jobs minimaux ne sont pas du confort — ils protègent l'adoption. Un pipeline lent est un pipeline mort.</div>
<div class="tip">Le pipeline réunit les trois cours d'outillage : CI/CD (structure, protection), Docker (image), Sécurité (scans). Un commit tagué déclenche un artefact versionné et scanné ; la barrière de branche garantit que main est toujours déployable — une propriété mécanique, plus une intention.</div>`,

    { type: "qcm", q: "L'image poussée est…", opts: ["latest mouvant", "Versionnée et immuable", "Sans tag", "En clair"], a: 1, exp: "Traçable." },

    { type: "qcm", q: "Un pipeline de 40 min…", opts: ["Est plus rigoureux", "Se contourne", "Est idéal", "N'existe pas"], a: 1, exp: "La durée protège l'adoption." },
    { type: "qcm", q: "Les caches et le parallélisme sont…", opts: ["Du luxe", "Une protection de l'adoption du pipeline", "Dangereux", "Décoratifs"], a: 1, exp: "Vitesse = usage." },
    { type: "vf", q: "Un tag Git déclenche un artefact versionné et scanné.", a: true, exp: "Code et image, même histoire." },
    { type: "qcm", q: "Le pipeline réunit…", opts: ["Merise + SQL", "CI/CD + Docker + Sécurité", "HTML + JavaScript", "Rien"], a: 1, exp: "Les trois cours d'outillage." },
    { type: "qcm", q: "« main toujours déployable » est désormais…", opts: ["Une convention d'équipe", "Une propriété mécanique (protection de branche)", "Une bonne pratique", "Une option"], a: 1, exp: "Verrouillé." },
    { type: "qcm", q: "Le registre reçoit…", opts: ["Chaque commit", "Les versions taguées (immuables)", "Rien", "Le code source"], a: 1, exp: "Artefacts choisis." },

  ],

      { type: "vf", q: "Le pipeline reste sous 10 min grâce aux caches et au parallélisme.", a: true, exp: "Adoption." }
    ],
    solution: `<pre class="pseudo"># release.yml
on: { push: { tags: ["v*"] } }   # declenche uniquement sur un tag de version
jobs:   # les travaux
  publier:   # job de publication
    steps:   # ses etapes

      - run: echo "${'$'}{{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # connexion au registre via secret
      - run: |   # commande multi-lignes

          docker push ghcr.io/toi/ludotheque:${'$'}VERSION   # publier au registre

# Protection de main : tests+qualite+securite+image verts + 1 revue   # main toujours deployable</pre>
<p>L'usine est complète. Demain : le déploiement automatisé.</p>`

e\n# EMBALLE et PUBLIE un commit certifié — elle ne re-vérifie pas ce qui l'est\n# déjà. Elle scanne quand même l'image publiée (défense en profondeur : une\n# CVE peut être apparue entre-temps dans une couche de base).",
