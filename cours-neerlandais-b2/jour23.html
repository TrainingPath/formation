<script>
var DAY = {
  num: 23,
  title: "Synthétiser un texte",
  subtitle: "Réduire un texte à l'essentiel : idées principales et reformulation.",
  theory: `
<h3>1. Synthétiser, ce n'est pas résumer mot à mot</h3>
<p><strong>Samenvatten</strong> (synthétiser / résumer) consiste à extraire les idées principales (<strong>de hoofdgedachten</strong>) et à les reformuler brièvement avec vos propres mots, en supprimant les détails et les exemples.</p>
<pre class="pseudo">de hoofdgedachte   l'idée principale
het detail         le détail
de bijzaak         l'accessoire, le secondaire
weglaten           omettre, laisser de côté
herformuleren      reformuler
in het kort        en bref
samengevat         en résumé</pre>
<h3>2. La méthode en trois étapes</h3>
<pre class="pseudo">Stap 1 : Lees het hele tekst en zoek het onderwerp.
Stap 2 : Onderstreep per alinea de belangrijkste zin (de kernzin).
Stap 3 : Herformuleer die kernzinnen kort in je eigen woorden.</pre>
<div class="tip">Repérez la <strong>kernzin</strong> (phrase-clé) de chaque paragraphe : c'est souvent la première ou la dernière phrase. Les exemples (« bijvoorbeeld… ») et les chiffres précis peuvent presque toujours être omis.</div>
<h3>3. Le texte à synthétiser — Jongeren en slaap</h3>
<pre class="pseudo">Steeds meer jongeren slapen te weinig. Uit onderzoek blijkt dat een
groot deel van de tieners minder dan zeven uur per nacht slaapt,
terwijl negen uur wordt aangeraden. De oorzaken zijn bekend: veel
jongeren gebruiken 's avonds laat hun telefoon, en het blauwe licht
van het scherm houdt de hersenen wakker. Bovendien beginnen scholen
vroeg, waardoor tieners niet kunnen uitslapen.</pre>
<pre class="pseudo">De gevolgen zijn niet te onderschatten. Wie te weinig slaapt, kan
zich moeilijker concentreren en presteert slechter op school. Ook het
humeur lijdt eronder: slaaptekort maakt mensen prikkelbaarder.
Deskundigen raden daarom aan om schermen een uur voor het slapengaan
weg te leggen en elke dag op hetzelfde tijdstip naar bed te gaan.</pre>
<div class="warn">Dans une synthèse, n'ajoutez jamais votre opinion ni d'informations absentes du texte. Vous restez fidèle au contenu, mais plus court.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « samenvatten » ?", opts: ["traduire", "synthétiser / résumer", "recopier", "corriger"], a: 1, exp: "samenvatten = résumer." },
    { type: "input", q: "Comment appelle-t-on l'idée principale ? de ___", a: ["hoofdgedachte"], ph: "un nom", exp: "de hoofdgedachte = l'idée principale." },
    { type: "qcm", q: "Dans une synthèse, on doit surtout…", opts: ["ajouter des exemples", "omettre les détails et reformuler l'essentiel", "donner son avis", "tout recopier"], a: 1, exp: "On garde les idées principales, on omet les détails." },
    { type: "input", q: "Complète : « ___ blijkt dat tieners te weinig slapen. » (une étude → uit onderzoek)", a: ["uit onderzoek", "onderzoek"], ph: "deux mots", exp: "Uit onderzoek blijkt dat = une étude montre que." },
    { type: "qcm", q: "Combien d'heures de sommeil sont recommandées selon le texte ?", opts: ["sept", "huit", "neuf", "six"], a: 2, exp: "negen uur wordt aangeraden." },
    { type: "qcm", q: "Quelle est une CAUSE du manque de sommeil citée ?", opts: ["le sport le soir", "le téléphone tard le soir (lumière bleue)", "le café", "le bruit"], a: 1, exp: "telefoon 's avonds laat, blauw licht." },
    { type: "vf", q: "Le texte dit que les écoles commencent tard, ce qui permet aux jeunes de dormir.", a: false, exp: "scholen beginnen vroeg : tôt, donc ils ne peuvent pas faire la grasse matinée." },
    { type: "input", q: "Une conséquence : le manque de sommeil rend les gens plus… ___ (irritables)", a: ["prikkelbaar", "prikkelbaarder"], ph: "un adjectif", exp: "prikkelbaarder = plus irritable." },
    { type: "qcm", q: "Que recommandent les experts ?", opts: ["boire du lait", "ranger les écrans une heure avant le coucher", "faire du sport le soir", "dormir l'après-midi"], a: 1, exp: "schermen een uur voor het slapengaan wegleggen." },
    { type: "input", q: "Quelle phrase omettriez-vous dans une synthèse ? Celle qui commence par « ___ » (par exemple)", a: ["bijvoorbeeld"], ph: "un mot", exp: "Les exemples (bijvoorbeeld) sont des détails à omettre." },
    { type: "vf", q: "Dans une synthèse, on peut ajouter sa propre opinion.", a: false, exp: "Non : la synthèse reste fidèle au texte, sans opinion ajoutée." },
    { type: "qcm", q: "La kernzin (phrase-clé) d'un paragraphe se trouve souvent…", opts: ["au milieu uniquement", "en première ou dernière position", "dans les exemples", "nulle part"], a: 1, exp: "Souvent la 1re ou la dernière phrase." },
    { type: "input", q: "Traduis « en résumé » : ___", a: ["samengevat", "in het kort"], ph: "un mot", exp: "samengevat / in het kort = en résumé." },
    { type: "qcm", q: "Quelle est l'idée principale de tout le texte ?", opts: ["Les jeunes aiment leur téléphone", "Les jeunes dorment trop peu, avec des causes et des conséquences claires", "Les écoles sont trop chères", "Le sport est important"], a: 1, exp: "Le manque de sommeil des jeunes, ses causes et conséquences." },
    { type: "vf", q: "Reformuler avec ses propres mots fait partie de la synthèse.", a: true, exp: "herformuleren = reformuler, c'est essentiel." }
  ],
  final: {
    title: "Exercice final — De kernzinnen kiezen",
    intro: `<p>Voici les phrases-clés possibles. Identifie celles qui doivent figurer dans une synthèse et celles qui sont des détails à omettre :</p>
<pre class="pseudo">1. Steeds meer jongeren slapen te weinig.              -> kernzin
2. Een groot deel slaapt minder dan zeven uur.         -> detail (cijfer)
3. Het blauwe licht van schermen houdt wakker.          -> kernoorzaak
4. Slaaptekort verslechtert concentratie en humeur.     -> kerngevolg
5. Deskundigen raden aan schermen weg te leggen.        -> kernadvies</pre>`,
    questions: [
      { type: "qcm", q: "Laquelle est une phrase-clé (à garder), pas un simple détail chiffré ?", opts: ["Un grand nombre dort moins de sept heures", "De plus en plus de jeunes dorment trop peu", "Neuf heures sont recommandées", "Certains dorment six heures"], a: 1, exp: "C'est l'idée générale, pas un chiffre isolé." },
      { type: "input", q: "Résume la cause principale en un mot-clé : le ___ (des écrans) empêche de dormir", a: ["scherm", "schermen", "licht"], ph: "un nom", exp: "het scherm / het blauwe licht." },
      { type: "qcm", q: "Quel est le principal EFFET du manque de sommeil selon le texte ?", opts: ["on grandit moins", "concentration et humeur se dégradent", "on mange plus", "on parle moins"], a: 1, exp: "moeilijker concentreren + prikkelbaarder." },
      { type: "qcm", q: "Une bonne synthèse de ce texte tiendrait en…", opts: ["une page entière", "deux ou trois phrases", "un seul mot", "dix pages"], a: 1, exp: "Idée + causes + conséquences + conseil, en quelques phrases." },
      { type: "input", q: "Le conseil final des experts : ga elke dag op hetzelfde ___ naar bed. (moment)", a: ["tijdstip"], ph: "un mot", exp: "op hetzelfde tijdstip = à la même heure." }
    ],
    solution: `<p>Synthèse modèle : « De plus en plus de jeunes dorment trop peu. Les causes principales sont l'usage tardif du téléphone (lumière bleue) et les horaires scolaires précoces. Cela nuit à la concentration et à l'humeur. Les experts conseillent de ranger les écrans avant le coucher et de se coucher à heure fixe. »</p>
<p>Méthode : trouver l'idée principale, garder une cause, une conséquence et le conseil, omettre chiffres et exemples, puis reformuler avec ses propres mots.</p>`
  }
};
</script>
