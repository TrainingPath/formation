  theory: `
<h3>1. L'ordre des mots — de woordvolgorde</h3>
<p>La règle d'or : dans la proposition principale, le verbe conjugué est en <strong>deuxième position</strong> (V2). Dans la subordonnée, il part à la <strong>fin</strong>.</p>
<pre class="pseudo">Principale : Morgen ga ik naar Brussel.       (verbe en 2e position)
Subordonnée: Ik weet dat hij morgen komt.     (verbe komt à la fin)
Ordre en fin (TeMPoLi) : Tijd - Manier - Plaats
   Ik ga morgen met de trein naar Gent.
   (quand - comment - où)</pre>
<h3>2. Le parfait et l'imparfait</h3>
<pre class="pseudo">Parfait (récit ponctuel, oral) : hebben/zijn + participe
   Ik heb gewerkt.  Ze is vertrokken.
Imparfait (description, récit écrit) : radical + te/de + terminaison
   Ik werkte.  Het regende de hele dag.</pre>
<div class="tip">Choix de l'auxiliaire au parfait : <strong>zijn</strong> pour les verbes de mouvement/changement (gaan, komen, worden, blijven), <strong>hebben</strong> pour la plupart des autres.</div>
<h3>3. Le passif — de lijdende vorm</h3>
<pre class="pseudo">Actif : De politie arresteert de dief.
Passif présent : De dief wordt gearresteerd (door de politie).
Passif passé   : De dief is gearresteerd.
   worden + participe = passif ; door introduit l'agent.</pre>
<h3>4. Les subordonnées et « om … te »</h3>
<pre class="pseudo">omdat (parce que), hoewel (bien que), zodat (de sorte que),
terwijl (pendant que) -> verbe à la FIN.
   Ik blijf thuis omdat het regent.
om + … + te + infinitif (pour) :
   Ik studeer om een goede baan te vinden.</pre>
<h3>5. « Er » et les prépositions</h3>
<pre class="pseudo">Ik denk eraan.       J'y pense.
Ik ben er trots op.  J'en suis fier.
Wacht je erop?       Tu l'attends ?</pre>
<div class="warn">Ne dites jamais « Ik denk aan het » : avec une chose, la préposition fusionne avec « er » → <strong>eraan</strong>, <strong>erover</strong>, <strong>ermee</strong>. Le « er » peut aussi être séparé : « Ik denk er niet aan. »</div>`,

    { type: "qcm", q: "Quel auxiliaire au parfait pour « blijven » (rester) ?", opts: ["hebben", "zijn", "worden", "zullen"], a: 1, exp: "blijven prend zijn : ik ben gebleven." },
    { type: "input", q: "Mets au passif présent : « De dief ___ gearresteerd. » (worden)", a: ["wordt"], ph: "un verbe", exp: "worden + participe : de dief wordt gearresteerd." },

    { type: "qcm", q: "Compréhension : « Het huis is in 1920 gebouwd. » C'est…", opts: ["une phrase active", "un passif au passé", "un futur", "un impératif"], a: 1, exp: "is + gebouwd = passif passé (a été construite)." },

      { type: "input", q: "Phrase 4 : « Hij belt ___ een afspraak te maken. » (pour)", a: ["om"], ph: "un mot", exp: "om een afspraak te maken." },
      { type: "input", q: "Phrase 5 : « Ben je ___ klaar voor? » — le bon adverbe pronominal (er) ?", a: ["er"], ph: "un mot", exp: "Ben je er klaar voor? = Es-tu prêt ?" }
    ],
    solution: `<p>Corrigés : 1. « Gisteren <strong>heb</strong> ik een interessant artikel gelezen. » (V2 + participe à la fin) 2. « Ik hoop dat je snel beter <strong>wordt</strong>. » (verbe à la fin de la subordonnée) 3. « De brief <strong>is</strong> gisteren verstuurd. » (passif passé) 4. « Hij belt <strong>om</strong> een afspraak <strong>te</strong> maken. » 5. « Ben je <strong>er</strong> klaar <strong>voor</strong>? »</p>
<p>Les cinq piliers du B2 : ordre des mots (V2 / verbe final), parfait vs imparfait, passif (worden/zijn + door), subordonnées et « om…te », et « er » + préposition. Tu es prêt pour les projets finaux !</p>`
  }
