<script>
var DAY = {
  num: 6,
  title: "L'inversion et la mise en relief",
  subtitle: "Déplacer un élément en tête de phrase et respecter la règle du verbe en deuxième position.",
  theory: `
<h3>1. La règle du verbe en deuxième position</h3>
<p>Dans une phrase principale néerlandaise, le verbe conjugué occupe <strong>toujours la deuxième position</strong> (règle dite « V2 »). La première position peut être le sujet, mais aussi un complément de temps, de lieu, un objet… Dès qu'autre chose que le sujet ouvre la phrase, le sujet passe <strong>après</strong> le verbe : c'est l'<strong>inversion</strong>.</p>
<pre class="pseudo">Ik ga morgen naar Amsterdam.        (sujet – verbe)
Morgen ga ik naar Amsterdam.        (temps – verbe – sujet)   Demain je vais à Amsterdam.
Naar Amsterdam ga ik morgen.        (lieu en relief – verbe – sujet)</pre>
<div class="warn">Le francophone oublie l'inversion : il écrit « Morgen ik ga… » par calque du français « Demain je vais… ». En néerlandais, c'est FAUX. Le verbe doit rester en 2e position : « Morgen ga ik… ».</div>
<h3>2. Mettre un élément en relief (topicalisation)</h3>
<p>Placer un élément en tête, c'est le <strong>mettre en valeur</strong>. Le néerlandais l'utilise abondamment pour organiser l'information (le connu d'abord, le nouveau ensuite) :</p>
<pre class="pseudo">Dat boek heb ik al gelezen.          Ce livre-là, je l'ai déjà lu.
Gisteren was het erg druk.           Hier, c'était très animé.
Vooral 's avonds is het rustig.      Surtout le soir, c'est calme.
Daar ben ik het niet mee eens.       Là-dessus, je ne suis pas d'accord.</pre>
<h3>3. Après une subordonnée en tête</h3>
<p>Une subordonnée placée en tête compte comme <strong>un seul élément</strong> en première position : la principale enchaîne donc par le verbe (inversion). C'est un point de contrôle constant :</p>
<pre class="pseudo">Omdat het regende, bleven we thuis.        (subordonnée – VERBE – sujet)
Toen hij binnenkwam, stopte het gesprek.   Quand il entra, la conversation cessa.
Als je moe bent, moet je rusten.           Si tu es fatigué, tu dois te reposer.</pre>
<h3>4. Inversion dans les questions et après certains mots</h3>
<p>L'inversion se produit aussi dans les <strong>questions fermées</strong> (verbe en tête) et après certains adverbes de liaison :</p>
<pre class="pseudo">Kom je vanavond?                     Viens-tu ce soir ?
Toch heeft hij gelijk.               Pourtant il a raison.
Daarom ben ik hier.                  C'est pourquoi je suis ici.
Misschien komt ze later.             Peut-être viendra-t-elle plus tard.</pre>
<div class="tip">Attention : certains connecteurs N'entraînent PAS l'inversion car ils ne comptent pas comme premier élément : <strong>en</strong> (et), <strong>maar</strong> (mais), <strong>want</strong> (car), <strong>of</strong> (ou), <strong>dus</strong> (donc, souvent sans inversion). « Ik ben moe, want ik heb slecht geslapen. » (ordre normal après want). Compare avec « daarom » qui, lui, inverse.</div>
<h3>5. La mise en relief renforcée</h3>
<p>Pour insister davantage, on emploie des tournures d'extraction proches du français « c'est … que » : <strong>Het is Jan die dat gezegd heeft.</strong> = C'est Jean qui a dit cela. Ou l'on détache l'élément avec reprise : <strong>Die film, die vind ik prachtig.</strong> = Ce film-là, je le trouve magnifique.</p>`,
  exercises: [
    { type: "qcm", q: "Dans une phrase principale, le verbe conjugué est…", opts: ["toujours en tête", "toujours en 2e position", "toujours à la fin", "après le sujet uniquement"], a: 1, exp: "Règle V2 : verbe en deuxième position." },
    { type: "input", q: "Corrige par l'inversion : « Morgen ___ ik naar Amsterdam. » (aller)", a: ["ga"], ph: "verbe", exp: "Verbe en 2e position : Morgen ga ik…" },
    { type: "vf", q: "« Morgen ik ga naar school » est correct.", a: false, exp: "Faux : inversion obligatoire → Morgen ga ik naar school." },
    { type: "qcm", q: "« Dat boek heb ik al gelezen » met en relief…", opts: ["le sujet ik", "l'objet « dat boek »", "le verbe", "l'adverbe"], a: 1, exp: "L'objet est topicalisé en tête pour la mise en relief." },
    { type: "input", q: "Après subordonnée en tête : « Omdat het regende, ___ we thuis. » (rester)", a: ["bleven"], ph: "verbe", exp: "La subordonnée compte pour la position 1 → verbe ensuite : bleven we thuis." },
    { type: "qcm", q: "Quel mot n'entraîne PAS l'inversion ?", opts: ["daarom", "toch", "want", "misschien"], a: 2, exp: "want (car) est une conjonction de coordination : ordre normal après lui." },
    { type: "input", q: "Complète avec inversion après « toch » : « Toch ___ hij gelijk. » (avoir)", a: ["heeft"], ph: "verbe", exp: "toch en tête → inversion : Toch heeft hij gelijk." },
    { type: "qcm", q: "« Kom je vanavond? » illustre l'inversion typique de…", opts: ["l'affirmation", "la question fermée", "l'ordre", "la subordonnée"], a: 1, exp: "Question fermée : verbe en tête." },
    { type: "vf", q: "Une subordonnée placée en tête compte comme le premier élément de la phrase.", a: true, exp: "Elle occupe la position 1 ; la principale enchaîne par le verbe (inversion)." },
    { type: "qcm", q: "« Ik ben moe, want ik heb slecht geslapen. » Après « want » l'ordre est…", opts: ["inversé", "normal (sujet-verbe)", "verbe à la fin", "verbe en tête"], a: 1, exp: "want = coordination : ordre normal, pas d'inversion." },
    { type: "input", q: "Mise en relief avec reprise : « Die film, ___ vind ik prachtig. » (pronom de reprise)", a: ["die"], ph: "pronom", exp: "Détachement + reprise par « die »." },
    { type: "qcm", q: "« Daarom ben ik hier » : pourquoi « ben » avant « ik » ?", opts: ["erreur", "daarom occupe la position 1, d'où l'inversion", "daarom est un verbe", "c'est une question"], a: 1, exp: "daarom (c'est pourquoi) en tête → inversion." },
    { type: "vf", q: "« Het is Jan die dat gezegd heeft » est une tournure d'extraction (c'est… qui).", a: true, exp: "Extraction pour mettre Jan en relief : c'est Jean qui l'a dit." },
    { type: "qcm", q: "Compréhension : « Nooit had ik zoiets verwacht. » Cette inversion souligne…", opts: ["le temps", "l'insistance sur « jamais »", "le lieu", "le sujet"], a: 1, exp: "Nooit en tête + inversion : jamais je n'aurais attendu cela (emphase)." },
    { type: "qcm", q: "Compréhension : « In deze stad wonen meer dan een miljoen mensen. » Quel élément ouvre la phrase ?", opts: ["le sujet", "un complément de lieu", "le verbe", "un objet"], a: 1, exp: "In deze stad (lieu) en tête → inversion : wonen … mensen." }
  ],
  final: {
    title: "Exercice final — Een pleidooi",
    intro: `<p>Ce court plaidoyer joue sur l'inversion et la mise en relief. Lis-le, puis réponds :</p>
<pre class="pseudo">Al jaren pleiten wij voor meer groen in de stad.
Toch gebeurt er nog altijd te weinig.
In het centrum verdwijnen bomen, terwijl het verkeer toeneemt.
Juist daarom vragen wij nu om een duidelijk plan.
Als de gemeente niet ingrijpt, verslechtert de luchtkwaliteit verder.
Meer parken, dat is precies wat onze wijk nodig heeft.
Nooit eerder was de steun onder de bewoners zo groot.
Daarom roepen wij iedereen op om de petitie te tekenen.</pre>`,
    questions: [
      { type: "qcm", q: "« Al jaren pleiten wij… » : pourquoi « pleiten » avant « wij » ?", opts: ["erreur", "« Al jaren » ouvre la phrase → inversion", "c'est une question", "pleiten est un nom"], a: 1, exp: "Complément de temps en tête → verbe en 2e position, sujet après." },
      { type: "input", q: "Relève le verbe qui suit immédiatement « Toch » : « Toch ___ er nog te weinig. »", a: ["gebeurt"], ph: "verbe", exp: "toch en tête → inversion : Toch gebeurt er…" },
      { type: "qcm", q: "« Als de gemeente niet ingrijpt, verslechtert de luchtkwaliteit » : la principale commence par le verbe parce que…", opts: ["c'est une question", "la subordonnée « Als… » occupe la position 1", "erreur de l'auteur", "verslechtert est un nom"], a: 1, exp: "Subordonnée en tête → inversion dans la principale." },
      { type: "qcm", q: "« Meer parken, dat is precies wat onze wijk nodig heeft » est une mise en relief par…", opts: ["question", "détachement + reprise (dat)", "passif", "subordination"], a: 1, exp: "Élément détaché en tête, repris par « dat » : c'est exactement cela dont le quartier a besoin." },
      { type: "input", q: "Emphase : « Nooit eerder ___ de steun zo groot. » (être, prétérit)", a: ["was"], ph: "verbe", exp: "Nooit eerder en tête → inversion : Nooit eerder was de steun zo groot." }
    ],
    solution: `<p>Traduction : « Depuis des années nous plaidons pour plus de verdure en ville. Pourtant, il se passe toujours trop peu de choses. Dans le centre, des arbres disparaissent, alors que la circulation augmente. C'est justement pourquoi nous demandons maintenant un plan clair. Si la commune n'intervient pas, la qualité de l'air se dégradera encore. Plus de parcs, voilà précisément ce dont notre quartier a besoin. Jamais auparavant le soutien des habitants n'a été aussi fort. C'est pourquoi nous appelons tout le monde à signer la pétition. »</p>
<p>Chaque phrase illustre la règle V2 : dès qu'un complément (Al jaren, In het centrum, Nooit eerder), un adverbe (Toch, Juist daarom, Daarom) ou une subordonnée (Als…) ouvre la phrase, le verbe reste en deuxième position et le sujet passe derrière. La tournure « Meer parken, dat is… » montre la mise en relief par détachement, très persuasive dans un plaidoyer.</p>`
  }
};
</script>
