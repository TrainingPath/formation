<h3>1. Le fait divers — het nieuwsbericht / het feit</h3>
<p>Un fait divers (en néerlandais souvent <strong>een nieuwsbericht</strong> ou <strong>een voorval</strong>) raconte un événement réel : un vol, un accident, un sauvetage. Il répond aux questions <strong>wie? wat? waar? wanneer? waarom?</strong> (qui ? quoi ? où ? quand ? pourquoi ?).</p>
<h3>2. Vocabulaire utile</h3>
<pre class="pseudo">de dief          le voleur         de politie      la police
de getuige       le témoin         de brand        l'incendie
de gewonde       le blessé         redden          sauver
opmerken         remarquer         achtervolgen    poursuivre
arresteren       arrêter           verdwijnen      disparaître
het onderzoek    l'enquête         de buurt        le quartier</pre>
<h3>3. Le fait divers du jour — De hond die een dief verraadde</h3>
<p>Lisez le texte en entier (environ une page). Repérez qui fait quoi, et dans quel ordre.</p>
<pre class="pseudo">Vorige week donderdag gebeurde er iets opmerkelijks in een rustige
buurt van Gent. Rond acht uur 's avonds hoorde mevrouw De Smet, een
gepensioneerde lerares, dat haar hond Nero luid begon te blaffen.
Normaal blafte Nero bijna nooit, dus vond ze het meteen vreemd.</pre>
<pre class="pseudo">Toen ze uit het raam keek, zag ze een onbekende man in de tuin van
de buren. De buren, de familie Peeters, waren op vakantie in Spanje.
De man probeerde een raam aan de achterkant open te breken. Mevrouw
De Smet aarzelde niet en belde onmiddellijk de politie.</pre>
<pre class="pseudo">Ondertussen bleef Nero blaffen. De dief schrok van het lawaai en
liet zijn tas met gereedschap vallen. Hij klom over de muur en
probeerde te ontsnappen door de smalle straat achter de huizen.
Maar hij had niet gerekend op de buurtbewoners.</pre>
<pre class="pseudo">Een jonge man die net van zijn werk kwam, meneer Janssens, merkte
de vluchtende dief op. Hij begreep snel wat er gebeurde en begon de
man te achtervolgen. Na ongeveer tweehonderd meter struikelde de
dief en viel. Meneer Janssens hield hem tegen tot de politie
arriveerde. Binnen tien minuten was de man gearresteerd.</pre>
<pre class="pseudo">De politie vond in de tas het gestolen gereedschap en bewijzen van
eerdere inbraken in de buurt. Volgens het onderzoek was deze dief
waarschijnlijk verantwoordelijk voor meerdere diefstallen van de
laatste maanden. Mevrouw De Smet kreeg een bedankje van de politie,
en Nero kreeg een groot bot als beloning. Kortom, dankzij een
oplettende buurvrouw, een blaffende hond en een moedige voorbijganger
liep het verhaal goed af.</pre>
<div class="tip">Pour suivre un récit, repérez les marqueurs de temps : <strong>vorige week donderdag, rond acht uur, toen, ondertussen, na tweehonderd meter, binnen tien minuten</strong>. Ils dessinent la chronologie.</div>
<div class="warn">« schrikken » (avoir peur, être effrayé) est irrégulier : « de dief schrok » (le voleur eut peur). Ne le confondez pas avec « schreeuwen » (crier).</div>`,

    solution: `<p>Résumé : un soir, le chien Nero aboie de façon inhabituelle. Sa maîtresse, Mme De Smet, aperçoit un homme qui tente de cambrioler la maison des voisins partis en vacances. Elle appelle la police. Effrayé par le chien, le voleur s'enfuit mais est rattrapé par un passant, M. Janssens, puis arrêté. L'enquête révèle qu'il était responsable de plusieurs cambriolages. Tout finit bien grâce à une voisine attentive, un chien vigilant et un passant courageux.</p>
<p>Pour comprendre un fait divers, répondez aux cinq questions : <strong>wie, wat, waar, wanneer, waarom</strong>, et suivez la chronologie grâce aux marqueurs de temps.</p>`
