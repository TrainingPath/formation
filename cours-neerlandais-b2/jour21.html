<script>

  title: "Le vocabulaire de l'actualité et de la société",

  theory: `
<h3>1. L'actualité — het nieuws / de actualiteit</h3>
<p>Pour lire la presse (<strong>de pers</strong>) et suivre les débats de société, un vocabulaire thématique est indispensable.</p>
<pre class="pseudo">de krant         le journal        het artikel     l'article
het nieuws       les nouvelles     de kop          le titre (une)
de journalist    le journaliste    de reportage    le reportage
het onderwerp    le sujet          de bron         la source</pre>
<h3>2. Politique et société — politiek en samenleving</h3>
<pre class="pseudo">de regering       le gouvernement   de verkiezingen  les élections
de wet            la loi            de maatregel     la mesure
de burger         le citoyen        de samenleving   la société
de belasting      l'impôt           het beleid       la politique (menée)
de vluchteling    le réfugié        de ongelijkheid  l'inégalité</pre>
<h3>3. Économie et travail — economie en werk</h3>
<pre class="pseudo">de werkloosheid   le chômage        de inflatie      l'inflation
de koopkracht     le pouvoir d'achat de groei        la croissance
de crisis         la crise          de begroting     le budget
bezuinigen        faire des économies stijgen        augmenter
dalen             baisser</pre>
<h3>4. Environnement et climat — milieu en klimaat</h3>
<pre class="pseudo">de klimaatverandering  le changement climatique
de opwarming           le réchauffement
de uitstoot            les émissions
duurzaam               durable
de vervuiling          la pollution
hernieuwbare energie   l'énergie renouvelable</pre>

<div class="warn">« het beleid » (la politique menée, l'action publique) n'est pas « de politiek » (la politique comme domaine). « Het klimaatbeleid van de regering » = la politique climatique du gouvernement.</div>`,

    { type: "input", q: "Traduis « durable » : ___", a: ["duurzaam"], ph: "un adjectif", exp: "duurzaam = durable." },

<pre class="pseudo">1. Regering kondigt nieuwe belasting aan.          (politiek/economie)
2. Uitstoot van CO2 daalt licht dankzij windenergie. (milieu)
3. Werkloosheid stijgt in de industrie.             (economie)

    questions: [

      { type: "input", q: "Titre 1 : que fait le gouvernement ? Hij kondigt een nieuwe ___ aan. (impôt)", a: ["belasting"], ph: "un nom", exp: "een nieuwe belasting = un nouvel impôt." },

      { type: "qcm", q: "Le titre 5 traite de…", opts: ["la croissance économique", "l'inégalité croissante dans la société", "la pollution", "les transports"], a: 1, exp: "groeiende ongelijkheid." },
      { type: "input", q: "Grâce à quoi les émissions baissent-elles (titre 2) ? dankzij ___", a: ["windenergie"], ph: "un mot", exp: "dankzij windenergie = grâce à l'énergie éolienne." }
    ],
    solution: `<p>Traduction des titres : 1. « Le gouvernement annonce un nouvel impôt. » 2. « Les émissions de CO2 baissent légèrement grâce à l'énergie éolienne. » 3. « Le chômage augmente dans l'industrie. » 4. « Davantage de citoyens participent aux élections. » 5. « Une étude montre une inégalité croissante. »</p>
<p>Le vocabulaire de l'actualité s'organise par thèmes : politique (<strong>regering, verkiezingen, wet</strong>), économie (<strong>werkloosheid, inflatie, koopkracht</strong>), environnement (<strong>uitstoot, duurzaam, klimaatverandering</strong>) et société (<strong>burger, ongelijkheid, samenleving</strong>).</p>`
  }
