<script>
var ATELIER = {
  prefix: "at-nl-b2",
  titre: "🇳🇱 Atelier — Néerlandais B2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour viser l'aisance B2.",
  retour: "index.html",
  dialogues: [
    {
      num: "1",
      titre: "Een diepgaand sollicitatiegesprek",
      perso: "Mevrouw De Vries (HR-manager) en Karim Belhadj (kandidaat) — entretien d'embauche approfondi",
      lignes: [
        { qui: "De Vries", txt: "Meneer Belhadj, uw dossier werd door mijn collega grondig bekeken. Wat trekt u precies aan in deze functie?", fr: "Monsieur Belhadj, votre dossier a été examiné en profondeur par mon collègue. Qu'est-ce qui vous attire précisément dans ce poste ?" },
        { qui: "Karim", txt: "Wat mij aanspreekt, is de combinatie van analyse en teamleiding. In mijn huidige baan word ik zelden uitgedaagd op strategisch vlak.", fr: "Ce qui me parle, c'est la combinaison d'analyse et d'encadrement d'équipe. Dans mon poste actuel, je suis rarement mis au défi sur le plan stratégique." },
        { qui: "De Vries", txt: "U hebt drie jaar bij Vandenberg gewerkt. Waarom bent u daar weggegaan, als ik vragen mag?", fr: "Vous avez travaillé trois ans chez Vandenberg. Pourquoi en êtes-vous parti, si je peux me permettre ?" },
        { qui: "Karim", txt: "De afdeling werd geherstructureerd en mijn project werd stopgezet. Achteraf gezien had ik eerder om een gesprek moeten vragen.", fr: "Le service a été restructuré et mon projet a été arrêté. Avec le recul, j'aurais dû demander un entretien plus tôt." },
        { qui: "De Vries", txt: "Dat is een eerlijk antwoord. Enerzijds zoeken wij ervaring, anderzijds vooral iemand die zich snel aanpast.", fr: "Voilà une réponse honnête. D'une part nous cherchons de l'expérience, d'autre part surtout quelqu'un qui s'adapte vite." },
        { qui: "Karim", txt: "Aanpassingsvermogen is precies wat ik in Antwerpen heb geleerd, waar ik met vier nationaliteiten samenwerkte.", fr: "La capacité d'adaptation est exactement ce que j'ai appris à Anvers, où je collaborais avec quatre nationalités." },
        { qui: "De Vries", txt: "Stel dat een medewerker de deadline structureel mist. Hoe zou u daarop reageren?", fr: "Supposons qu'un collaborateur rate systématiquement les délais. Comment réagiriez-vous ?" },
        { qui: "Karim", txt: "Ik zou eerst de oorzaak achterhalen. Zonder die kennis wordt er alleen maar symptoombestrijding gedaan.", fr: "Je chercherais d'abord la cause. Sans cette connaissance, on ne fait que traiter les symptômes." },
        { qui: "De Vries", txt: "Niettemin moet er soms snel worden ingegrepen. Bent u bereid een onaangename beslissing te nemen?", fr: "Néanmoins, il faut parfois intervenir vite. Êtes-vous prêt à prendre une décision désagréable ?" },
        { qui: "Karim", txt: "Zeker, mits ze goed onderbouwd is. Een beslissing zonder uitleg wordt door niemand gedragen.", fr: "Certainement, à condition qu'elle soit bien argumentée. Une décision sans explication n'est portée par personne." },
        { qui: "De Vries", txt: "Bijgevolg zou u dus veel tijd in communicatie steken. Dat past bij ons. Wij nemen volgende week contact met u op.", fr: "Par conséquent, vous investiriez donc beaucoup de temps dans la communication. Cela nous convient. Nous vous recontactons la semaine prochaine." },
        { qui: "Karim", txt: "Dank u wel voor het gesprek. Ik kijk ernaar uit iets van u te horen.", fr: "Merci beaucoup pour cet entretien. Je me réjouis d'avoir de vos nouvelles." }
      ]
    },
    {
      num: "2",
      titre: "Een project verdedigen op de vergadering",
      perso: "Sanne (projectleider), Tom (financieel directeur) en Ilse (directeur) — réunion de défense de projet",
      lignes: [
        { qui: "Sanne", txt: "Het voorstel dat vorige maand werd ingediend, is intussen door twee externe experts beoordeeld.", fr: "La proposition qui a été déposée le mois dernier a entre-temps été évaluée par deux experts externes." },
        { qui: "Tom", txt: "Beoordeeld, akkoord. Maar wat mij vooral interesseert, is of het budget realistisch blijft.", fr: "Évaluée, d'accord. Mais ce qui m'intéresse surtout, c'est de savoir si le budget reste réaliste." },
        { qui: "Sanne", txt: "De geraamde kosten zijn met acht procent gestegen, wat volledig aan de prijs van de grondstoffen te wijten is.", fr: "Les coûts estimés ont augmenté de huit pour cent, ce qui est entièrement dû au prix des matières premières." },
        { qui: "Ilse", txt: "Toen we vorig jaar begonnen, spraken we over een terugverdientijd van drie jaar. Geldt die nog?", fr: "Quand nous avons commencé l'an dernier, nous parlions d'un retour sur investissement de trois ans. Est-ce toujours valable ?" },
        { qui: "Sanne", txt: "Drie en een half jaar, om precies te zijn. Toch blijft het rendement hoger dan bij het alternatief.", fr: "Trois ans et demi, pour être exacte. Le rendement reste malgré tout supérieur à celui de l'alternative." },
        { qui: "Tom", txt: "Je gaat er wel van uit dat de vraag stabiel blijft. Die aanname vind ik nogal optimistisch.", fr: "Tu pars du principe que la demande reste stable. Cette hypothèse me paraît assez optimiste." },
        { qui: "Sanne", txt: "Ik heb met opzet het voorzichtigste scenario gekozen. Zelfs bij een terugval van tien procent draaien we quitte.", fr: "J'ai délibérément choisi le scénario le plus prudent. Même avec un recul de dix pour cent, nous sommes à l'équilibre." },
        { qui: "Ilse", txt: "Wanneer zou de eerste fase opgeleverd kunnen worden, als we vandaag groen licht geven?", fr: "Quand la première phase pourrait-elle être livrée si nous donnons le feu vert aujourd'hui ?" },
        { qui: "Sanne", txt: "In het najaar, op voorwaarde dat de aanwerving niet opnieuw wordt uitgesteld.", fr: "À l'automne, à condition que le recrutement ne soit pas de nouveau reporté." },
        { qui: "Tom", txt: "Daar zit hem nu net het probleem. We hadden die twee mensen al in maart moeten aannemen.", fr: "C'est précisément là que réside le problème. Nous aurions dû engager ces deux personnes dès mars." },
        { qui: "Ilse", txt: "Laten we het zo doen: het project wordt goedgekeurd, maar de aanwerving wordt met voorrang behandeld.", fr: "Faisons ainsi : le projet est approuvé, mais le recrutement sera traité en priorité." },
        { qui: "Sanne", txt: "Daar kan ik mee leven. Ik bezorg jullie donderdag een bijgewerkte planning.", fr: "Je peux vivre avec ça. Je vous transmets jeudi un planning mis à jour." }
      ]
    },
    {
      num: "3",
      titre: "Een meningsverschil diplomatiek oplossen",
      perso: "Joris (klant) en mevrouw Aerts (leverancier) — négociation et désaccord traités avec diplomatie",
      lignes: [
        { qui: "Joris", txt: "Mevrouw Aerts, ik wil het gesprek graag rustig houden, maar de levering is nu al drie weken te laat.", fr: "Madame Aerts, je souhaite garder cette conversation calme, mais la livraison a maintenant déjà trois semaines de retard." },
        { qui: "Aerts", txt: "Dat betreur ik oprecht. De vertraging werd veroorzaakt door een storing bij onze onderaannemer.", fr: "Je le regrette sincèrement. Le retard a été causé par une panne chez notre sous-traitant." },
        { qui: "Joris", txt: "Ik begrijp dat, alleen verandert het niets aan mijn situatie. Mijn eigen klanten wachten immers ook.", fr: "Je le comprends, seulement cela ne change rien à ma situation. Mes propres clients attendent en effet aussi." },
        { qui: "Aerts", txt: "Volkomen terecht. Zullen we bekijken wat er nog wel haalbaar is in plaats van te blijven hangen bij wie schuld heeft?", fr: "Tout à fait légitime. Regardons ce qui reste faisable plutôt que de rester bloqués sur la question de la faute." },
        { qui: "Joris", txt: "Graag. Concreet: ik heb de helft van de bestelling voor vrijdag nodig, de rest mag later.", fr: "Volontiers. Concrètement : j'ai besoin de la moitié de la commande pour vendredi, le reste peut venir plus tard." },
        { qui: "Aerts", txt: "Vrijdag wordt krap. Ik zou u dinsdag zestig procent kunnen leveren, mits u de transportkosten deelt.", fr: "Vendredi sera juste. Je pourrais vous livrer soixante pour cent mardi, à condition que vous partagiez les frais de transport." },
        { qui: "Joris", txt: "De transportkosten dragen terwijl de fout niet bij mij ligt? Dat gaat me eerlijk gezegd te ver.", fr: "Supporter les frais de transport alors que la faute n'est pas de mon côté ? Franchement, cela va trop loin." },
        { qui: "Aerts", txt: "Ik hoor u. Laat me een tegenvoorstel doen: wij betalen het transport, u aanvaardt dinsdag in plaats van vrijdag.", fr: "Je vous entends. Permettez-moi une contre-proposition : nous payons le transport, vous acceptez mardi au lieu de vendredi." },
        { qui: "Joris", txt: "Op zich redelijk. Kunt u dat schriftelijk bevestigen, met een boeteclausule bij nieuwe vertraging?", fr: "Raisonnable en soi. Pouvez-vous le confirmer par écrit, avec une clause pénale en cas de nouveau retard ?" },
        { qui: "Aerts", txt: "Dat lijkt me billijk. U ontvangt vanmiddag een aangepaste overeenkomst per mail.", fr: "Cela me semble équitable. Vous recevrez cet après-midi un contrat adapté par mail." },
        { qui: "Joris", txt: "Uitstekend. Ik waardeer het dat u niet in de verdediging bent geschoten.", fr: "Excellent. J'apprécie que vous ne soyez pas partie sur la défensive." },
        { qui: "Aerts", txt: "Een langdurige samenwerking weegt zwaarder dan één moeilijke week. Tot vanmiddag.", fr: "Une collaboration durable pèse plus lourd qu'une semaine difficile. À cet après-midi." }
      ]
    }
  ],
  types: [
    {
      id: "vf",
      nom: "Vrai / Faux",
      consigne: "Vrai ou faux ? Appuie-toi uniquement sur ce que disent les trois dialogues.",
      exercices: [
        { type: "vf", q: "Karim vindt dat hij in zijn huidige baan strategisch te weinig uitgedaagd wordt.", a: true, exp: "Il dit : « word ik zelden uitgedaagd op strategisch vlak ». Notez le passif avec worden, typique du registre professionnel." },
        { type: "vf", q: "Karim heeft Vandenberg verlaten omdat hij ontslagen werd wegens slechte resultaten.", a: false, exp: "Faux : la raison est une restructuration (« de afdeling werd geherstructureerd »), pas une faute personnelle." },
        { type: "vf", q: "Karim geeft toe dat hij eerder om een gesprek had moeten vragen.", a: true, exp: "« had ik eerder om een gesprek moeten vragen » : modal au passé (had + infinitif + moeten) qui exprime le regret." },
        { type: "vf", q: "Volgens Karim moet je bij een structureel gemiste deadline meteen ingrijpen zonder de oorzaak te zoeken.", a: false, exp: "Il dit l'inverse : « Ik zou eerst de oorzaak achterhalen ». Le conditionnel zou + infinitif adoucit la prise de position." },
        { type: "vf", q: "De geraamde kosten van het project van Sanne zijn met acht procent gestegen.", a: true, exp: "Attention à met + pourcentage pour l'ampleur de la hausse ; tot indiquerait le niveau atteint." },
        { type: "vf", q: "Sanne heeft bewust het meest optimistische scenario gekozen.", a: false, exp: "Faux : « met opzet het voorzichtigste scenario ». Met opzet = délibérément, et non par hasard." },
        { type: "vf", q: "Ilse keurt het project goed op voorwaarde dat de aanwerving voorrang krijgt.", a: true, exp: "Elle dit : « het project wordt goedgekeurd, maar de aanwerving wordt met voorrang behandeld » — deux passifs coordonnés." },
        { type: "vf", q: "De levering van mevrouw Aerts is één week te laat.", a: false, exp: "Faux : trois semaines. Joris insiste avec « nu al drie weken », où al souligne la durée déjà écoulée." },
        { type: "vf", q: "Joris weigert eerst de transportkosten te delen omdat de fout niet bij hem ligt.", a: true, exp: "« Dat gaat me eerlijk gezegd te ver » est un refus poli mais net ; eerlijk gezegd annonce une franchise assumée." },
        { type: "vf", q: "Mevrouw Aerts stelt uiteindelijk voor dat haar bedrijf het transport betaalt.", a: true, exp: "Son tegenvoorstel inverse la charge : « wij betalen het transport ». Le pronom wij accentué marque l'engagement." }
      ]
    },
    {
      id: "qcmdial",
      nom: "QCM de compréhension",
      consigne: "Choisis la seule réponse correcte selon les dialogues.",
      exercices: [
        { type: "qcm", q: "Wat trekt Karim aan in de functie?", opts: ["Het hoge loon", "De combinatie van analyse en teamleiding", "De korte werkweek", "De ligging van het kantoor"], a: 1, exp: "Il annonce sa réponse par la mise en relief « Wat mij aanspreekt, is… », structure clivée très courante à l'oral soigné." },
        { type: "qcm", q: "Hoe omschrijft mevrouw De Vries wat het bedrijf zoekt?", opts: ["Enkel ervaring", "Enkel snelle aanpassing", "Enerzijds ervaring, anderzijds aanpassingsvermogen", "Vooral diploma's"], a: 2, exp: "Enerzijds… anderzijds… est le couple argumentatif standard pour équilibrer deux exigences." },
        { type: "qcm", q: "Waar heeft Karim zijn aanpassingsvermogen ontwikkeld?", opts: ["In Rotterdam", "In Antwerpen", "In Brussel", "In Utrecht"], a: 1, exp: "« in Antwerpen, waar ik met vier nationaliteiten samenwerkte » : waar introduit ici une relative de lieu." },
        { type: "qcm", q: "Waardoor is de kostenstijging in dialoog 2 veroorzaakt?", opts: ["Door de lonen", "Door de grondstoffen", "Door de huur", "Door de belastingen"], a: 1, exp: "« aan de prijs van de grondstoffen te wijten » : te wijten aan attribue une cause, souvent négative." },
        { type: "qcm", q: "Wat is de nieuwe terugverdientijd?", opts: ["Twee jaar", "Drie jaar", "Drie en een half jaar", "Vijf jaar"], a: 2, exp: "Sanne précise avec « om precies te zijn », formule utile pour corriger sans contredire frontalement." },
        { type: "qcm", q: "Welk bezwaar formuleert Tom over de berekening van Sanne?", opts: ["De cijfers zijn vervalst", "De aanname over de vraag is te optimistisch", "Het project is te klein", "De experts zijn onbekwaam"], a: 1, exp: "« Die aanname vind ik nogal optimistisch » : nogal atténue tout en critiquant, registre diplomatique." },
        { type: "qcm", q: "Wanneer kan de eerste fase opgeleverd worden?", opts: ["In de zomer", "In het najaar", "In januari", "Volgende week"], a: 1, exp: "Opgeleverd worden : passif avec le participe d'opleveren (livrer un chantier, une phase)." },
        { type: "qcm", q: "Wat is volgens Tom het echte knelpunt?", opts: ["De prijs van de grondstoffen", "De te late aanwerving", "De externe experts", "De planning van Ilse"], a: 1, exp: "« We hadden die twee mensen al in maart moeten aannemen » : reproche exprimé par le double infinitif au passé." },
        { type: "qcm", q: "Wat stelt mevrouw Aerts eerst voor?", opts: ["Alles vrijdag leveren", "Zestig procent dinsdag, mits gedeelde transportkosten", "De bestelling annuleren", "Een korting van tien procent"], a: 1, exp: "Mits introduit une condition positive (à condition que) ; tenzij introduirait au contraire une exception." },
        { type: "qcm", q: "Waarom waardeert Joris de houding van mevrouw Aerts?", opts: ["Omdat ze korting gaf", "Omdat ze niet in de verdediging is geschoten", "Omdat ze de schuld bij hem legde", "Omdat ze het contract verbrak"], a: 1, exp: "In de verdediging schieten est une expression idiomatique : se braquer, se mettre sur la défensive." }
      ]
    },
    {
      id: "rectif",
      nom: "Rectifier l'affirmation fausse",
      consigne: "Chaque phrase contient une erreur factuelle. Tape le mot ou groupe de mots correct (en néerlandais).",
      exercices: [
        { type: "input", q: "Karim werkte vier jaar bij Vandenberg. → Hij werkte er … jaar.", a: ["drie"], ph: "un nombre", exp: "Drie jaar. En néerlandais jaar reste au singulier après un numéral : drie jaar, jamais jaren ici." },
        { type: "input", q: "Karim werkte in Antwerpen met twee nationaliteiten samen. → met … nationaliteiten.", a: ["vier"], ph: "un nombre", exp: "Vier. Samenwerken met + personne : la préposition met est imposée par le verbe." },
        { type: "input", q: "De kosten zijn met achttien procent gestegen. → met … procent.", a: ["acht"], ph: "un nombre", exp: "Acht procent. Procent reste invariable après un chiffre." },
        { type: "input", q: "Sanne bezorgt de planning op maandag. → op ….", a: ["donderdag"], ph: "un jour", exp: "Donderdag. Les jours s'écrivent en minuscule en néerlandais, contrairement à l'allemand." },
        { type: "input", q: "De levering is twee weken te laat. → … weken te laat.", a: ["drie"], ph: "un nombre", exp: "Drie weken. Te laat (adverbe) et non laat tout court : te marque l'excès." },
        { type: "input", q: "Mevrouw Aerts kan zeventig procent leveren. → … procent.", a: ["zestig"], ph: "un nombre", exp: "Zestig. Attention à la formation : zes → zestig, avec la même chute de consonne que dans zeventig." },
        { type: "input", q: "Bij een terugval van twintig procent draait het project quitte. → van … procent.", a: ["tien"], ph: "un nombre", exp: "Tien procent. Quitte draaien = atteindre l'équilibre, expression figée du monde des affaires." },
        { type: "input", q: "De aanwerving had in mei moeten gebeuren volgens Tom. → in ….", a: ["maart"], ph: "un mois", exp: "Maart. Les mois aussi s'écrivent sans majuscule." },
        { type: "input", q: "Het voorstel werd door drie externe experts beoordeeld. → door … externe experts.", a: ["twee"], ph: "un nombre", exp: "Twee. Le complément d'agent du passif se construit avec door, jamais avec van." },
        { type: "input", q: "Joris heeft de helft van de bestelling voor maandag nodig. → voor ….", a: ["vrijdag"], ph: "un jour", exp: "Vrijdag. Voor + moment = avant tel moment ; op + jour = ce jour-là précisément." }
      ]
    },
    {
      id: "texte",
      nom: "Texte + questions",
      consigne: "Lis l'article de fond ci-dessous, puis réponds. Certaines questions portent sur l'implicite.",
      intro: "<div class=\"dlg\"><h3>Thuiswerken: de balans na vijf jaar</h3><p>Vijf jaar geleden werd thuiswerken door veel directies nog als een gunst beschouwd. Vandaag is het voor talloze bedienden een verworven recht geworden. Toch loopt het enthousiasme in de bedrijven sterk uiteen. Uit een onderzoek van de Universiteit Gent blijkt dat werknemers die twee dagen per week thuis werken, gemiddeld tevredener zijn dan wie volledig op kantoor zit. Wie echter vier of vijf dagen thuis blijft, rapporteert vaker een gevoel van isolement. De onderzoekers spreken daarom van een omgekeerde U-curve. Enerzijds bespaart de werknemer reistijd, anderzijds verliest hij informele contacten die zelden in een videovergadering ontstaan. Werkgevers wijzen bovendien op een probleem dat lange tijd onderschat werd: het inwerken van nieuwe collega's. Wie nooit iemand over de schouder kan meekijken, leert het vak langzamer. Bijgevolg kiezen steeds meer bedrijven voor vaste kantoordagen in plaats van volledige vrijheid. Die aanpak wordt niet door iedereen toegejuicht. Vakbonden vrezen dat de verworven flexibiliteit stilaan wordt teruggedraaid. Niettemin blijkt uit dezelfde studie dat driekwart van de werknemers een gemengd model verkiest. Volledig terug naar kantoor wil bijna niemand, volledig thuis evenmin. De discussie gaat dus niet langer over het principe, maar over de dosering.</p></div>",
      exercices: [
        { type: "qcm", q: "Hoe werd thuiswerken vijf jaar geleden vaak gezien?", opts: ["Als een recht", "Als een gunst", "Als een verplichting", "Als een straf"], a: 1, exp: "« als een gunst beschouwd » : beschouwen als + attribut. Le contraste avec verworven recht structure tout le texte." },
        { type: "vf", q: "Volgens het onderzoek zijn mensen die vijf dagen thuis werken het tevredenst.", a: false, exp: "Faux : la courbe en U inversé montre un optimum à deux jours, puis une baisse." },
        { type: "input", q: "Welke universiteit voerde het onderzoek uit? → de Universiteit ….", a: ["gent", "van gent"], ph: "une ville", exp: "Gent. Notez uit een onderzoek blijkt dat… : formule impersonnelle typique du style journalistique." },
        { type: "qcm", q: "Wat verliest de werknemer die veel thuiswerkt?", opts: ["Zijn loon", "Informele contacten", "Zijn vakantiedagen", "Zijn computer"], a: 1, exp: "Le texte oppose reistijd besparen et contacten verliezen via enerzijds… anderzijds." },
        { type: "vf", q: "Het inwerken van nieuwe collega's werd lange tijd onderschat.", a: true, exp: "« een probleem dat lange tijd onderschat werd » : relative au passif, avec le participe en fin de subordonnée." },
        { type: "qcm", q: "Wat doen steeds meer bedrijven volgens de tekst?", opts: ["Ze verbieden thuiswerk", "Ze kiezen vaste kantoordagen", "Ze sluiten hun kantoren", "Ze verlengen de werkweek"], a: 1, exp: "Bijgevolg introduit la conséquence logique et déclenche l'inversion : bijgevolg kiezen…" },
        { type: "qcm", q: "Wat vrezen de vakbonden, impliciet?", opts: ["Dat de lonen dalen", "Dat de flexibiliteit geleidelijk verdwijnt", "Dat kantoren te klein worden", "Dat er te veel wordt vergaderd"], a: 1, exp: "Stilaan teruggedraaid worden suggère un recul progressif, non annoncé officiellement : c'est l'implicite." },
        { type: "input", q: "Welk aandeel van de werknemers verkiest een gemengd model? → ….", a: ["driekwart", "drie kwart"], ph: "une fraction", exp: "Driekwart s'écrit en un mot ; een kwart en deux quand il est déterminé." },
        { type: "vf", q: "Uit de tekst blijkt dat het debat nu vooral over de hoeveelheid thuiswerkdagen gaat.", a: true, exp: "La chute « niet langer over het principe, maar over de dosering » le dit explicitement." },
        { type: "qcm", q: "Welke toon heeft de tekst?", opts: ["Polemisch en eenzijdig", "Afwegend en genuanceerd", "Ironisch", "Reclameachtig"], a: 1, exp: "Les connecteurs toch, enerzijds, niettemin signalent une pesée constante du pour et du contre." }
      ]
    },
    {
      id: "doc",
      nom: "Document authentique",
      consigne: "Voici une lettre de motivation (sollicitatiebrief). Analyse-la et réponds.",
      intro: "<div class=\"dlg\"><h3>Sollicitatiebrief</h3><p>Geachte mevrouw De Vries,<br><br>Met belangstelling las ik uw vacature voor projectcoördinator, die op 12 maart op uw website werd gepubliceerd. Graag stel ik mij kandidaat.<br><br>Na mijn opleiding handelsingenieur werkte ik drie jaar bij Vandenberg nv, waar ik verantwoordelijk was voor de opvolging van vier lopende dossiers. In die functie heb ik geleerd hoe belangrijk het is om belanghebbenden tijdig te informeren. Toen mijn afdeling werd geherstructureerd, heb ik de overdracht van de dossiers zelfstandig begeleid.<br><br>Uw organisatie spreekt mij aan omdat er, blijkens uw jaarverslag, sterk in opleiding wordt geïnvesteerd. Enerzijds zoek ik meer verantwoordelijkheid, anderzijds een omgeving waarin bijleren vanzelfsprekend is.<br><br>Graag licht ik mijn motivatie tijdens een gesprek nader toe. U vindt mijn curriculum vitae in bijlage.<br><br>Met vriendelijke groeten,<br>Karim Belhadj</p></div>",
      exercices: [
        { type: "qcm", q: "Welke aanhef past in een formele sollicitatiebrief?", opts: ["Hoi mevrouw De Vries", "Geachte mevrouw De Vries", "Beste jij", "Aan wie het aanbelangt"], a: 1, exp: "Geachte + titre = registre formel écrit ; Beste est déjà plus familier, Hoi est exclu." },
        { type: "vf", q: "De zin met belangstelling las ik uw vacature begint met een bepaling, waardoor het werkwoord vooraan komt.", a: true, exp: "L'inversion est obligatoire : élément 1 = bepaling, position 2 = verbe conjugué (las), puis le sujet." },
        { type: "input", q: "Vul aan: De vacature … op 12 maart gepubliceerd. (passé du passif)", a: ["werd"], ph: "un auxiliaire", exp: "Werd gepubliceerd = action passée. Was gepubliceerd décrirait un état antérieur, ce qui n'est pas le sens." },
        { type: "qcm", q: "Wat betekent blijkens uw jaarverslag?", opts: ["Ondanks uw jaarverslag", "Zoals blijkt uit uw jaarverslag", "In plaats van uw jaarverslag", "Volgens de kranten"], a: 1, exp: "Blijkens est une préposition de style formel, équivalent condensé de zoals blijkt uit." },
        { type: "qcm", q: "Welke slotformule hoort bij deze brief?", opts: ["Groetjes", "Doei", "Met vriendelijke groeten", "Tot ziens dan maar"], a: 2, exp: "Met vriendelijke groeten est la formule neutre-formelle standard ; Hoogachtend est encore plus solennel." },
        { type: "vf", q: "In bijlage vindt u mijn cv is een aanvaardbare formulering in een sollicitatiebrief.", a: true, exp: "In bijlage (usage belge) ou als bijlage / bijgevoegd (usage néerlandais) : tous relèvent du registre écrit." },
        { type: "input", q: "Zet in het passief: Men publiceerde de vacature. → De vacature … gepubliceerd.", a: ["werd"], ph: "un auxiliaire", exp: "Le passif est justement le moyen d'éliminer men, jugé lourd à l'écrit soigné." },
        { type: "qcm", q: "Waarom schrijft Karim graag licht ik mijn motivatie nader toe?", opts: ["Om een klacht te uiten", "Om beleefd om een gesprek te vragen", "Om te bedanken", "Om te weigeren"], a: 1, exp: "Graag + verbe conjugué en tête = demande polie indirecte ; nader toelichten est un verbe séparable formel." },
        { type: "qcm", q: "Welk woord is het meest formele synoniem van baan?", opts: ["Job", "Functie", "Klusje", "Werkje"], a: 1, exp: "Functie appartient au registre écrit ; baan est neutre, job est un anglicisme courant à l'oral." },
        { type: "vf", q: "De brief gebruikt bewust de u-vorm en vermijdt spreektaalvormen.", a: true, exp: "La cohérence de registre est un critère B2 : u-vorm, pas de formes contractées, connecteurs explicites." }
      ]
    },
    {

        { type: "qcm", q: "Het rendement blijft hoog. → De … blijft hoog.", opts: ["verlies", "risico", "opbrengst", "last"], a: 2, exp: "Rendement ≈ opbrengst. Winst désignerait le bénéfice net, notion plus étroite." },

        { type: "qcm", q: "Niettemin blijft het risico bestaan. → … blijft het risico bestaan.", opts: ["Daarom", "Toch", "Bovendien", "Namelijk"], a: 1, exp: "Niettemin ≈ toch / desondanks : concession. Daarom marquerait au contraire la conséquence." },
        { type: "qcm", q: "De onderaannemer had een storing. → De onderaannemer had een ….", opts: ["feest", "panne", "pauze", "afspraak"], a: 1, exp: "Storing = interruption de service ; defect vise l'appareil lui-même." },
        { type: "qcm", q: "Dat lijkt me billijk. → Dat lijkt me ….", opts: ["duur", "redelijk", "vreemd", "verplicht"], a: 1, exp: "Billijk appartient au vocabulaire juridique et signifie équitable ; redelijk est son équivalent courant." },

        { type: "qcm", q: "De aanname is optimistisch. → De … is optimistisch.", opts: ["conclusie", "veronderstelling", "beslissing", "vergissing"], a: 1, exp: "Aanname = veronderstelling (hypothèse de départ), à ne pas confondre avec aanwerving (embauche)." },

        { type: "qcm", q: "We draaien quitte. → We maken … winst … verlies.", opts: ["zowel / als", "noch / noch", "of / of", "niet / maar"], a: 1, exp: "Noch… noch… = ni… ni…, registre soigné ; à l'oral on dirait plutôt geen winst en geen verlies." }

        { type: "input", q: "Het tegengestelde van een aanwerving is een … .", a: ["ontslag"], ph: "un nom", exp: "Ontslag = licenciement ou démission ; ontslag nemen / krijgen lève l'ambiguïté." },

        { type: "qcm", q: "Het tegengestelde van tijdig is …", opts: ["te laat", "vroeg", "snel", "traag"], a: 0, exp: "Tijdig = à temps ; son contraire est te laat, pas laat tout court." },
        { type: "input", q: "Het tegengestelde van de vraag stijgt is: de vraag … terug.", a: ["valt"], ph: "un verbe", exp: "Terugvallen = reculer, chuter ; le nom correspondant est terugval, employé par Sanne." },

        { type: "qcm", q: "Het tegengestelde van in de verdediging schieten is …", opts: ["openstaan voor kritiek", "boos worden", "weglopen", "zwijgen"], a: 0, exp: "L'expression décrit une crispation ; son contraire est une attitude d'ouverture, pas simplement le silence." }

        { type: "qcm", q: "De kostenstijging is … de grondstoffen te wijten.", opts: ["voor", "aan", "op", "over"], a: 1, exp: "Te wijten aan = imputable à (cause négative) ; te danken aan a la même structure mais un sens positif." },

        { type: "qcm", q: "Een lokaal in het Nederlands is meestal …", opts: ["een café", "een zaal of klaslokaal", "een winkel", "een dorp"], a: 1, exp: "Lokaal = salle. Un bistrot se dit café ou kroeg." },
