<script>
var DAY = {
  num: 18,
  title: "Comprendre un article de fond",
  subtitle: "Lire un texte d'opinion structuré et en dégager les idées principales.",
  theory: `
<h3>1. Qu'est-ce qu'un article de fond ?</h3>
<p>Un <strong>achtergrondartikel</strong> (article de fond) ne se contente pas de rapporter un fait : il explique, analyse et argumente. Il suit en général une structure claire : introduction (<strong>inleiding</strong>), développement (<strong>kern</strong>), conclusion (<strong>slot</strong>). Votre travail de lecteur B2 est de repérer cette ossature.</p>
<h3>2. Vocabulaire de la lecture analytique</h3>
<pre class="pseudo">de kernboodschap     le message central
het argument         l'argument
de aanleiding        l'élément déclencheur
de gevolgen          les conséquences
de oorzaak           la cause
de tegenstelling     l'opposition, le contraste
enerzijds/anderzijds d'une part / d'autre part
kortom               en bref</pre>
<h3>3. L'article du jour — Steeds meer mensen fietsen naar het werk</h3>
<p>Lisez lentement, puis répondez aux exercices. Cherchez d'abord l'idée principale de chaque paragraphe.</p>
<pre class="pseudo">In steeds meer Belgische en Nederlandse steden kiezen mensen de
fiets voor hun dagelijkse verplaatsingen. Volgens een recent
onderzoek is het aantal fietsers in vijf jaar met bijna dertig
procent gestegen. De aanleiding is niet één enkele oorzaak, maar
een combinatie van factoren.</pre>
<pre class="pseudo">Ten eerste spelen de files een grote rol. Wie in de spits met de
auto rijdt, verliest vaak veel tijd. Met de fiets is men soms
sneller op het werk. Ten tweede investeren steden in veilige
fietspaden en stallingen. Ten slotte willen veel mensen gezonder
leven en minder vervuilen.</pre>
<pre class="pseudo">Toch zijn er ook nadelen. Bij slecht weer blijft de auto voor
sommigen aantrekkelijker, en niet iedereen woont dicht genoeg bij
het werk. Kortom, de fiets wint terrein, maar zal de auto niet
volledig vervangen. De toekomst ligt waarschijnlijk in een
combinatie van vervoersmiddelen.</pre>
<div class="tip">Astuce de lecture : les connecteurs <strong>ten eerste, ten tweede, ten slotte, toch, kortom</strong> signalent la structure. Repérez-les et vous suivez l'argumentation sans traduire chaque mot.</div>
<div class="warn">Ne confondez pas <strong>de oorzaak</strong> (la cause) et <strong>het gevolg</strong> (la conséquence). « De file is de oorzaak, de vertraging is het gevolg. »</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet central de l'article ?", opts: ["Le prix de l'essence", "La hausse du vélo pour aller au travail", "Les vacances à vélo", "Les accidents de la route"], a: 1, exp: "Steeds meer mensen fietsen naar het werk." },
    { type: "input", q: "De combien le nombre de cyclistes a-t-il augmenté en cinq ans ? (bijna ___ procent)", a: ["dertig", "30"], ph: "nombre", exp: "met bijna dertig procent gestegen." },
    { type: "qcm", q: "« de aanleiding » signifie…", opts: ["la conséquence", "l'élément déclencheur", "le résumé", "le titre"], a: 1, exp: "de aanleiding = l'élément déclencheur." },
    { type: "qcm", q: "Selon le texte, la hausse a…", opts: ["une seule cause", "une combinaison de facteurs", "aucune cause", "une cause inconnue"], a: 1, exp: "een combinatie van factoren." },
    { type: "input", q: "Complète le premier facteur : « Ten eerste spelen de ___ een grote rol. » (embouteillages)", a: ["files"], ph: "un nom", exp: "de files = les embouteillages." },
    { type: "vf", q: "Selon le texte, à vélo on est parfois plus rapide au travail qu'en voiture.", a: true, exp: "Met de fiets is men soms sneller op het werk." },
    { type: "qcm", q: "Dans quoi les villes investissent-elles (2e facteur) ?", opts: ["des parkings pour voitures", "des pistes cyclables et abris à vélos sûrs", "des trains", "des autoroutes"], a: 1, exp: "veilige fietspaden en stallingen." },
    { type: "qcm", q: "Quel est le 3e facteur mentionné ?", opts: ["gagner de l'argent", "vivre plus sainement et moins polluer", "éviter les gens", "aller plus vite en voiture"], a: 1, exp: "gezonder leven en minder vervuilen." },
    { type: "input", q: "Complète l'inconvénient : « Bij slecht ___ blijft de auto aantrekkelijker. » (temps qu'il fait)", a: ["weer"], ph: "un nom", exp: "bij slecht weer = par mauvais temps." },
    { type: "qcm", q: "« Kortom » introduit…", opts: ["une cause", "un résumé / une conclusion", "une question", "un exemple"], a: 1, exp: "kortom = en bref, en résumé." },
    { type: "vf", q: "L'auteur pense que le vélo va totalement remplacer la voiture.", a: false, exp: "de fiets zal de auto niet volledig vervangen." },
    { type: "qcm", q: "Que voit l'auteur dans l'avenir ?", opts: ["Seulement le vélo", "Seulement la voiture", "Une combinaison de moyens de transport", "Le télétravail"], a: 2, exp: "een combinatie van vervoersmiddelen." },
    { type: "input", q: "Traduis « les conséquences » : de ___", a: ["gevolgen"], ph: "un nom", exp: "de gevolgen = les conséquences." },
    { type: "qcm", q: "Structure : combien de facteurs positifs le texte énumère-t-il ?", opts: ["un", "deux", "trois", "quatre"], a: 2, exp: "Ten eerste, ten tweede, ten slotte : trois facteurs." },
    { type: "vf", q: "Le connecteur « toch » (au début du 3e paragraphe) introduit un contraste avec ce qui précède.", a: true, exp: "toch = pourtant, il introduit les inconvénients après les avantages." }
  ],
  final: {
    title: "Exercice final — De kernboodschap samenvatten",
    intro: `<p>Relis mentalement l'article, puis identifie sa structure et son message central en répondant :</p>
<pre class="pseudo">Inleiding : het aantal fietsers stijgt sterk.
Kern      : drie oorzaken (files, betere fietspaden, gezondheid)
            en enkele nadelen (weer, afstand).
Slot      : de fiets wint terrein maar vervangt de auto niet volledig;
            de toekomst ligt in een combinatie.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle phrase résume le mieux le message central (de kernboodschap) ?", opts: ["La voiture disparaît complètement", "Le vélo progresse mais ne remplacera pas totalement la voiture", "Personne ne fait de vélo", "Le vélo est dangereux"], a: 1, exp: "de fiets wint terrein maar vervangt de auto niet volledig." },
      { type: "input", q: "Comment appelle-t-on la partie centrale d'un article (le développement) ? de ___", a: ["kern"], ph: "un mot", exp: "de kern = le développement." },
      { type: "qcm", q: "Parmi ces causes, laquelle N'EST PAS mentionnée ?", opts: ["les embouteillages", "les meilleures pistes cyclables", "le prix des voitures", "la santé"], a: 2, exp: "Le prix des voitures n'est pas cité." },
      { type: "qcm", q: "Quel connecteur signale la conclusion de l'article ?", opts: ["ten eerste", "kortom", "enerzijds", "de aanleiding"], a: 1, exp: "kortom introduit le résumé final." },
      { type: "input", q: "Où se situe l'avenir selon l'auteur ? in een ___ van vervoersmiddelen", a: ["combinatie"], ph: "un mot", exp: "een combinatie van vervoersmiddelen." }
    ],
    solution: `<p>Traduction du 3e paragraphe : « Pourtant, il y a aussi des inconvénients. Par mauvais temps, la voiture reste plus attrayante pour certains, et tout le monde n'habite pas assez près du travail. En bref, le vélo gagne du terrain, mais ne remplacera pas complètement la voiture. L'avenir réside probablement dans une combinaison de moyens de transport. »</p>
<p>Méthode : pour résumer un article de fond, repérez les connecteurs (<strong>ten eerste… kortom</strong>), distinguez causes et conséquences, et reformulez la kernboodschap en une phrase.</p>`
  }
};
</script>
