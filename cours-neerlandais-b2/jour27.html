  title: "Projet final (1) : lire un fait divers de 2 pages",
  subtitle: "Première moitié : le mystère du tableau disparu au musée de Malines.",
  theory: `
<h3>Le projet final — lire un vrai fait divers</h3>
<p>Voici le premier grand projet du niveau B2 : lire un fait divers original d'environ deux pages. Aujourd'hui, tu lis la <strong>première moitié</strong> ; demain (jour 28), la suite et la résolution. Lis lentement, sers-toi de l'aide lexicale, puis fais les exercices. Ne cherche pas à tout traduire : suis l'histoire.</p>
<div class="tip">Aide lexicale — de woordenlijst :<br>
het schilderij = le tableau · het doek = la toile · de bewaker = le gardien · de dief = le voleur · de dader = l'auteur (du délit) · de directrice = la directrice · de stagiaire = le/la stagiaire · de inspecteur = l'inspecteur · het bewijs = la preuve · de alarminstallatie = le système d'alarme · de braak = l'effraction · het spoor = la trace/indice · verdwijnen = disparaître · verdwenen = disparu · de reputatie = la réputation.</div>
<h3>Het raadsel van het verdwenen schilderij (deel 1)</h3>
<p>Op een koude maandagochtend in november ontdekte het personeel van het kleine stadsmuseum van Mechelen dat een beroemd schilderij verdwenen was. Het ging om « De Winterhaven », een klein maar waardevol doek van een lokale meester uit de negentiende eeuw. Het schilderij hing al meer dan vijftig jaar in de blauwe zaal op de eerste verdieping.</p>
<p>Mevrouw Coppens, de directrice van het museum, kon het eerst niet geloven. « Dit is onmogelijk », zei ze tegen de politie. « De alarminstallatie is gloednieuw en alle deuren waren gesloten. » Toch was de plek aan de muur leeg: alleen een lichte rechthoek op het behang verraadde waar het doek jarenlang gehangen had.</p>
<p>De bewaker, meneer Verhaeghe, werkte al twintig jaar in het museum. Hij zwoer dat hij tijdens zijn ronde niets vreemds had gezien. « Om tien uur 's avonds was alles nog normaal », verklaarde hij nerveus. « Ik heb elke zaal gecontroleerd voordat ik naar huis ging. » De politie vond dat merkwaardig, want er waren nergens sporen van braak. Geen enkel raam was gebroken, geen enkel slot geforceerd.</p>
<p>Een jonge stagiaire, Lena, merkte iets op wat de anderen over het hoofd hadden gezien. Op de vloer, vlak onder de lege plek, lag een klein stukje bruine stof. Het leek op een draad van een handschoen. Lena aarzelde even, want ze was pas twee weken in dienst, maar ze besloot het toch aan de inspecteur te tonen.</p>
<p>Inspecteur De Ridder bekeek het bewijs aandachtig. Hij vermoedde meteen dat de dief het plan zorgvuldig had voorbereid. « Wie dit gedaan heeft, kende het museum goed », zei hij langzaam. « Er is geen alarm afgegaan, dus iemand wist precies hoe het systeem werkte. » Die opmerking maakte iedereen in de zaal ongemakkelijk, want ze betekende dat de dader misschien geen vreemde was, maar een bekende.</p>
<p>Ondertussen verspreidde het nieuws zich razendsnel door de stad. De lokale krant kopte de volgende ochtend: « Meesterwerk gestolen uit ons stadsmuseum. » Journalisten stonden voor de deur en de telefoon rinkelde onophoudelijk. Mevrouw Coppens maakte zich vooral zorgen over de reputatie van het museum. Als het schilderij niet snel terugkwam, zou de stad een belangrijk deel van haar geschiedenis verliezen — en zou zij misschien haar baan verliezen.</p>
<div class="warn">Note la question implicite qui plane sur la première moitié : s'il n'y a aucune trace d'effraction et que l'alarme n'a pas sonné, comment le tableau a-t-il pu disparaître ? Garde cette énigme en tête pour le jour 28.</div>`,
  exercises: [
    { type: "qcm", q: "Dans quelle ville se déroule l'histoire ?", opts: ["Anvers", "Malines (Mechelen)", "Gand", "Bruges"], a: 1, exp: "het stadsmuseum van Mechelen." },
    { type: "input", q: "Comment s'appelle le tableau disparu ? « De ___ »", a: ["winterhaven"], ph: "un nom", exp: "« De Winterhaven »." },
    { type: "qcm", q: "De quelle époque date le tableau ?", opts: ["18e siècle", "19e siècle", "20e siècle", "Moyen Âge"], a: 1, exp: "een meester uit de negentiende eeuw." },
    { type: "qcm", q: "Pourquoi Mme Coppens trouve-t-elle le vol impossible ?", opts: ["le musée était plein", "l'alarme est neuve et les portes étaient fermées", "le tableau est trop grand", "il n'y a pas de fenêtres"], a: 1, exp: "de alarminstallatie is gloednieuw en alle deuren waren gesloten." },
    { type: "input", q: "Que reste-t-il sur le mur à la place du tableau ? een lichte ___ op het behang (rectangle)", a: ["rechthoek"], ph: "un nom", exp: "een lichte rechthoek = un rectangle plus clair." },
    { type: "qcm", q: "Depuis combien de temps le gardien Verhaeghe travaille-t-il au musée ?", opts: ["deux semaines", "cinq ans", "vingt ans", "cinquante ans"], a: 2, exp: "al twintig jaar in het museum." },
    { type: "vf", q: "La police a trouvé des traces d'effraction (fenêtre brisée, serrure forcée).", a: false, exp: "er waren nergens sporen van braak." },
    { type: "input", q: "Qui remarque le petit indice sur le sol ? de stagiaire ___", a: ["lena"], ph: "un prénom", exp: "Een jonge stagiaire, Lena." },
    { type: "qcm", q: "Quel indice Lena trouve-t-elle sur le sol ?", opts: ["une clé", "un petit morceau de tissu brun", "une empreinte", "une lettre"], a: 1, exp: "een klein stukje bruine stof, comme un fil de gant." },
    { type: "qcm", q: "Que déduit l'inspecteur De Ridder du fait que l'alarme n'a pas sonné ?", opts: ["l'alarme est cassée", "quelqu'un connaissait bien le système", "il n'y a pas eu de vol", "le tableau est tombé"], a: 1, exp: "iemand wist precies hoe het systeem werkte." },
    { type: "vf", q: "L'inspecteur suggère que l'auteur pourrait être quelqu'un de connu, pas un inconnu.", a: true, exp: "de dader was misschien geen vreemde, maar een bekende." },
    { type: "input", q: "Complète le titre du journal : « Meesterwerk ___ uit ons stadsmuseum. » (volé)", a: ["gestolen"], ph: "un participe", exp: "gestolen = volé." },
    { type: "qcm", q: "De quoi Mme Coppens se soucie-t-elle surtout ?", opts: ["de son salaire", "de la réputation du musée", "des journalistes", "de l'alarme"], a: 1, exp: "ze maakte zich zorgen over de reputatie van het museum." },
    { type: "qcm", q: "Chronologie : à quelle heure le gardien affirme-t-il que tout était normal ?", opts: ["à 8h du matin", "à 22h (tien uur 's avonds)", "à midi", "à minuit"], a: 1, exp: "Om tien uur 's avonds was alles nog normaal." },
    { type: "vf", q: "L'énigme centrale de cette première partie : comment le tableau a-t-il disparu sans effraction ni alarme.", a: true, exp: "C'est le mystère à résoudre au jour 28." }
  ],
  final: {
    title: "Exercice final — De eerste vragen van het onderzoek",
    intro: `<p>Tu es l'assistant de l'inspecteur. Relis la première moitié et réponds aux premières questions de l'enquête :</p>
<pre class="pseudo">Feiten tot nu toe:
- Het schilderij « De Winterhaven » is verdwenen.
- Geen sporen van braak, geen alarm afgegaan.
- Een stukje bruine stof lag op de vloer.
- De dader kende waarschijnlijk het museum en het alarmsysteem.</pre>`,
    questions: [
      { type: "qcm", q: "Quel élément rend ce vol particulièrement mystérieux ?", opts: ["le tableau était très grand", "aucune trace d'effraction et pas d'alarme", "il y avait beaucoup de témoins", "le musée était fermé depuis des années"], a: 1, exp: "Ni effraction ni alarme : un vol « impossible »." },
      { type: "input", q: "Sur qui les soupçons peuvent-ils se porter, selon l'inspecteur ? Op iemand die het museum ___ kende. (bien)", a: ["goed"], ph: "un mot", exp: "Wie dit gedaan heeft, kende het museum goed." },
      { type: "qcm", q: "Pourquoi le témoignage du gardien intrigue-t-il la police ?", opts: ["il a tout vu", "il affirme que tout était normal, sans aucune trace d'intrusion", "il était absent", "il a déclenché l'alarme"], a: 1, exp: "Tout normal + aucune trace = étrange." },
      { type: "input", q: "Quel objet le fil brun évoque-t-il ? een draad van een ___ (gant)", a: ["handschoen"], ph: "un nom", exp: "een draad van een handschoen." },
      { type: "qcm", q: "Quel enjeu personnel pèse sur la directrice ?", opts: ["elle veut vendre le musée", "elle risque de perdre sa réputation et peut-être son poste", "elle veut partir en vacances", "elle déteste le tableau"], a: 1, exp: "zou zij misschien haar baan verliezen." }
    ],
    solution: `<p>À ce stade, les faits établis sont : un tableau de valeur a disparu sans effraction ni déclenchement d'alarme ; un fil de tissu brun a été trouvé au sol ; l'auteur connaissait vraisemblablement le musée et son système de sécurité. Les soupçons se tournent donc vers une personne de l'intérieur.</p>
<p>Ce type de fait divers se lit comme une enquête : repère les <strong>faits</strong> (indices concrets), les <strong>hypothèses</strong> de l'inspecteur, et les enjeux humains (la peur de la directrice). Garde tes questions ouvertes pour la résolution du jour 28.</p>`
  }
};
</script>

    solution: "Ik vermoed dat de dader iemand van binnen het museum is. Omdat er geen sporen van braak zijn en het alarm niet is afgegaan, moet die persoon het systeem goed gekend hebben. Waarschijnlijk had de dief een sleutel of kende hij de code. Het stukje bruine stof zou van een handschoen kunnen zijn, wat betekent dat de dader voorzichtig te werk ging. Misschien is het zelfs iemand die er al lang werkt. Het zou dus kunnen dat de bewaker of een ander personeelslid meer weet dan hij zegt.\n\nTraduction : Je suppose que l'auteur est quelqu'un de l'intérieur du musée. Comme il n'y a pas de traces d'effraction et que l'alarme ne s'est pas déclenchée, cette personne devait bien connaître le système. Le voleur avait probablement une clé ou connaissait le code. Le petit morceau de tissu brun pourrait provenir d'un gant, ce qui signifie que l'auteur a agi avec prudence. C'est peut-être même quelqu'un qui y travaille depuis longtemps. Il se pourrait donc que le gardien ou un autre membre du personnel en sache plus qu'il ne le dit.",
