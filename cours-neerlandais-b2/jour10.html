<script>
var DAY = {
  num: 10,
  title: "Collocations et nuances de vocabulaire",
  subtitle: "Associer les bons mots entre eux et distinguer des synonymes proches.",
  theory: `
<h3>1. Qu'est-ce qu'une collocation ?</h3>
<p>Une <strong>collocation</strong> est une association de mots que les locuteurs natifs emploient ensemble par habitude, même si d'autres combinaisons seraient logiquement possibles. En français on dit « prendre une décision », pas « faire une décision ». Le néerlandais a ses propres réflexes, souvent différents du français.</p>
<pre class="pseudo">een beslissing nemen        prendre une décision
een vraag stellen           poser une question
een afspraak maken          prendre / fixer un rendez-vous
aandacht besteden aan       accorder de l'attention à
een fout maken              faire une erreur
een risico lopen            courir un risque
maatregelen treffen/nemen   prendre des mesures</pre>
<div class="warn">Ne traduis jamais une collocation mot à mot. « Poser une question » n'est pas « een vraag leggen » mais « een vraag stellen ». « Prendre une photo » n'est pas « een foto nemen » (calque anglais) mais « een foto maken ». Le bon verbe support est une question de mémorisation.</div>
<h3>2. Le bon verbe support</h3>
<p>Beaucoup de noms exigent un verbe précis (doen, maken, nemen, stellen, houden…) :</p>
<pre class="pseudo">een toespraak houden        prononcer un discours
een poging doen             faire une tentative
ruzie maken                 se disputer
een cursus volgen           suivre un cours
een examen afleggen/doen    passer un examen
indruk maken (op)           faire impression (sur)
rekening houden met         tenir compte de</pre>
<h3>3. Distinguer des synonymes proches</h3>
<p>Le B2 exige de choisir le mot juste parmi des quasi-synonymes :</p>
<pre class="pseudo">kennen / weten     kennen = connaître (qqn, un lieu) ; weten = savoir (un fait)
leren / studeren   leren = apprendre ; studeren = étudier (faire des études)
horen / luisteren  horen = entendre ; luisteren (naar) = écouter
zien / kijken      zien = voir ; kijken (naar) = regarder
vragen / stellen   iets vragen = demander ; een vraag stellen = poser une question
gebruiken / benutten  gebruiken = utiliser ; benutten = exploiter (une occasion)</pre>
<div class="tip">Test kennen/weten : si un « que + phrase » ou un fait suit, c'est <strong>weten</strong> (Ik weet dat hij komt). Si c'est une personne, un lieu, une œuvre, c'est <strong>kennen</strong> (Ik ken die stad). « Je sais nager » se dit d'ailleurs « Ik kan zwemmen » (capacité), ni kennen ni weten.</div>
<h3>4. Nuances de registre et d'intensité</h3>
<p>Des mots proches diffèrent par la force ou le ton :</p>
<pre class="pseudo">mooi (beau) < prachtig < schitterend (splendide)
goed (bien) < uitstekend < voortreffelijk (excellent)
boos (fâché) < woedend (furieux)
blij (content) < verheugd (ravi) < dolgelukkig (fou de joie)
groot probleem  vs  ernstig probleem (grave)  vs  klein ongemak (désagrément)</pre>
<h3>5. Prépositions fixes des verbes</h3>
<p>Chaque verbe impose souvent sa préposition, à mémoriser en bloc (vaste voorzetsels) :</p>
<pre class="pseudo">denken aan           penser à
wachten op           attendre
houden van           aimer
zich ergeren aan     s'agacer de
deelnemen aan        participer à
rekenen op           compter sur
bestaan uit          se composer de
lijken op            ressembler à</pre>`,
  exercises: [
    { type: "qcm", q: "« Prendre une décision » se dit…", opts: ["een beslissing doen", "een beslissing nemen", "een beslissing maken", "een beslissing leggen"], a: 1, exp: "Collocation fixe : een beslissing nemen." },
    { type: "input", q: "Complète : « een vraag ___ » (poser une question)", a: ["stellen"], ph: "verbe support", exp: "een vraag stellen, jamais « leggen »." },
    { type: "qcm", q: "« Prendre une photo » en néerlandais correct :", opts: ["een foto nemen", "een foto maken", "een foto doen", "een foto houden"], a: 1, exp: "een foto maken (pas le calque anglais « nemen »)." },
    { type: "input", q: "kennen ou weten ? « Ik ___ dat hij morgen komt. » (un fait)", a: ["weet"], ph: "verbe", exp: "Un fait / une subordonnée → weten : Ik weet dat…" },
    { type: "qcm", q: "« Ik ___ die stad goed » (connaître un lieu) :", opts: ["weet", "ken", "leer", "hoor"], a: 1, exp: "Connaître un lieu/une personne → kennen." },
    { type: "input", q: "Verbe support : « een toespraak ___ » (prononcer un discours)", a: ["houden"], ph: "verbe", exp: "een toespraak houden = prononcer un discours." },
    { type: "qcm", q: "Différence horen / luisteren : « Ik ___ naar de radio » (écouter activement).", opts: ["hoor", "luister", "zie", "weet"], a: 1, exp: "luisteren naar = écouter (volontaire) ; horen = entendre (subir)." },
    { type: "input", q: "Préposition fixe : « Ik denk ___ jou. » (penser à)", a: ["aan"], ph: "préposition", exp: "denken aan = penser à." },
    { type: "vf", q: "« een afspraak maken » signifie « prendre / fixer un rendez-vous ».", a: true, exp: "Collocation fixe avec maken." },
    { type: "qcm", q: "Classe par intensité croissante : mooi / prachtig / schitterend. Le plus fort est…", opts: ["mooi", "prachtig", "schitterend", "les trois égaux"], a: 2, exp: "schitterend (splendide) est le plus intense." },
    { type: "input", q: "Préposition fixe : « Ik wacht ___ de bus. » (attendre)", a: ["op"], ph: "préposition", exp: "wachten op = attendre." },
    { type: "qcm", q: "« rekening houden met » signifie…", opts: ["compter de l'argent", "tenir compte de", "ouvrir un compte", "faire attention à la caisse"], a: 1, exp: "rekening houden met = tenir compte de." },
    { type: "vf", q: "« Je sais nager » se traduit par « Ik weet zwemmen ».", a: false, exp: "Faux : capacité → Ik kan zwemmen (ni weten ni kennen)." },
    { type: "qcm", q: "Compréhension : « We moeten dringend maatregelen treffen. » Cela signifie…", opts: ["prendre des mesures d'urgence", "mesurer la pièce", "annuler les mesures", "attendre"], a: 0, exp: "maatregelen treffen/nemen = prendre des mesures." },
    { type: "qcm", q: "Compréhension : « Hij ergert zich aan het lawaai. » « zich ergeren aan » veut dire…", opts: ["s'habituer au bruit", "s'agacer du bruit", "aimer le bruit", "ignorer le bruit"], a: 1, exp: "zich ergeren aan = s'agacer / s'irriter de." }
  ],
  final: {
    title: "Exercice final — Een professionele e-mail",
    intro: `<p>Cet e-mail soigné illustre collocations, verbes supports et prépositions fixes. Lis-le, puis réponds :</p>
<pre class="pseudo">Geachte mevrouw De Vries,

Naar aanleiding van ons gesprek wil ik graag een afspraak maken
om de details van het project te bespreken. Ik hecht veel belang aan
een goede voorbereiding en houd graag rekening met uw agenda.
Wij hebben besloten om extra aandacht te besteden aan de planning,
omdat we in het verleden een fout hebben gemaakt met de deadlines.
Ik reken erop dat we samen een goede oplossing kunnen vinden.
Mocht u nog vragen hebben, aarzel dan niet om ze te stellen.
Ik kijk uit naar uw antwoord en dank u alvast voor uw tijd.

Met vriendelijke groet,
Thomas Jansen</pre>`,
    questions: [
      { type: "input", q: "Relève le verbe support de « een afspraak ___ » (fixer un rendez-vous)", a: ["maken"], ph: "verbe", exp: "een afspraak maken." },
      { type: "qcm", q: "« aandacht besteden aan » signifie…", opts: ["ignorer", "accorder de l'attention à", "dépenser de l'argent", "attendre"], a: 1, exp: "aandacht besteden aan = accorder de l'attention à." },
      { type: "input", q: "Préposition fixe : « Ik reken ___ dat we een oplossing vinden. » (compter sur)", a: ["erop"], ph: "er + préposition", exp: "rekenen op → erop (er + op) devant une subordonnée." },
      { type: "qcm", q: "« een fout gemaakt » emploie quel verbe support ?", opts: ["doen", "maken", "nemen", "houden"], a: 1, exp: "een fout maken = faire une erreur." },
      { type: "input", q: "Verbe support des questions : « aarzel niet om ze te ___ » (poser des questions)", a: ["stellen"], ph: "verbe", exp: "vragen stellen = poser des questions." }
    ],
    solution: `<p>Traduction : « Madame De Vries, Suite à notre entretien, je souhaiterais fixer un rendez-vous afin de discuter des détails du projet. J'accorde beaucoup d'importance à une bonne préparation et je tiens volontiers compte de votre agenda. Nous avons décidé d'accorder une attention particulière au planning, parce que nous avons commis une erreur avec les délais par le passé. Je compte sur le fait que nous pourrons trouver ensemble une bonne solution. Si vous aviez encore des questions, n'hésitez pas à les poser. J'attends votre réponse avec impatience et vous remercie d'avance pour votre temps. Cordialement, Thomas Jansen. »</p>
<p>Repère le tissu de collocations : <strong>een afspraak maken</strong>, <strong>belang hechten aan</strong>, <strong>rekening houden met</strong>, <strong>aandacht besteden aan</strong>, <strong>een fout maken</strong>, <strong>rekenen op</strong>, <strong>vragen stellen</strong>, <strong>uitkijken naar</strong>. Chacune impose son verbe support et sa préposition : ce sont ces automatismes, plus que la grammaire, qui font sonner l'e-mail comme celui d'un natif.</p>`
  }
};
</script>

  ]
};
