<script>
var DAY = {
  num: 14,
  title: "Rédiger une lettre de motivation",
  subtitle: "La sollicitatiebrief : en-tête, accroche, valorisation du parcours et formule de clôture professionnelle.",
  theory: `
<h3>1. La lettre de motivation en néerlandais</h3>
<p>La lettre de motivation se nomme <strong>de sollicitatiebrief</strong> (ou motivatiebrief). Elle accompagne le CV (het cv) et répond à une offre (een vacature). Son but : montrer <em>pourquoi vous</em> et <em>pourquoi cette entreprise</em>. Le ton est formel (registre soutenu, vouvoiement en <strong>u</strong>) et l'ensemble tient sur une page.</p>
<pre class="pseudo">Structure type d'une sollicitatiebrief
1. Adresgegevens        coordonnées (expéditeur + destinataire)
2. Datum en plaats      date et lieu
3. Onderwerp            objet (Betreft: sollicitatie…)
4. Aanhef               formule d'appel (Geachte…)
5. Inleiding            accroche : quel poste, où vous l'avez vu
6. Motivatie            pourquoi vous : compétences, expérience
7. Slotparagraaf        disponibilité, entretien
8. Afsluiting           clôture (Met vriendelijke groet)</pre>
<h3>2. L'en-tête et l'objet</h3>
<p>On indique ses coordonnées, puis celles de l'entreprise, la date, et un objet clair :</p>
<pre class="pseudo">Amsterdam, 12 maart 2026
Betreft: sollicitatie naar de functie van projectmedewerker

Geachte heer Jansen,        Monsieur Jansen,
Geachte mevrouw De Vries,   Madame De Vries,
Geachte heer/mevrouw,       Madame, Monsieur, (destinataire inconnu)</pre>
<div class="warn">Si le nom du recruteur est inconnu, on écrit <strong>Geachte heer/mevrouw,</strong> mais jamais « Beste » (trop familier) dans une candidature. Évite aussi « Hallo » ou « Hoi ».</div>
<h3>3. L'accroche (de inleiding)</h3>
<p>La première phrase annonce le poste et la source de l'annonce. On la veut dynamique, pas banale :</p>
<pre class="pseudo">Met veel interesse las ik uw vacature voor de functie van…
J'ai lu avec grand intérêt votre offre pour le poste de…

Naar aanleiding van uw vacature op LinkedIn solliciteer ik graag naar…
Suite à votre offre sur LinkedIn, je pose ma candidature pour…

Graag wil ik reageren op uw vacature voor…
Je souhaite répondre à votre offre pour…</pre>
<h3>4. La valorisation du parcours (de motivatie)</h3>
<p>Cœur de la lettre : on relie ses compétences (vaardigheden) et son expérience (werkervaring) aux besoins du poste. On illustre par des faits, pas des adjectifs vides :</p>
<pre class="pseudo">In mijn huidige functie ben ik verantwoordelijk voor…
Dans mon poste actuel, je suis responsable de…

Dankzij mijn ervaring als… beschik ik over…
Grâce à mon expérience de…, je dispose de…

Ik ben communicatief, nauwkeurig en stressbestendig.
Je suis communicatif(ve), rigoureux(se) et résistant(e) au stress.

Uw bedrijf spreekt mij aan omdat…
Votre entreprise m'attire parce que…</pre>
<div class="tip">Vocabulaire utile : <strong>de vaardigheden</strong> (compétences), <strong>de werkervaring</strong> (expérience professionnelle), <strong>de opleiding</strong> (la formation), <strong>het diploma</strong> (le diplôme), <strong>de motivatie</strong> (la motivation), <strong>de functie</strong> (le poste), <strong>de sollicitant</strong> (le candidat).</div>
<h3>5. La clôture (de slotparagraaf en afsluiting)</h3>
<p>On exprime sa disponibilité pour un entretien (een gesprek / een sollicitatiegesprek) et on remercie, puis on signe :</p>
<pre class="pseudo">Graag licht ik mijn motivatie toe in een persoonlijk gesprek.
Je serais ravi(e) d'exposer ma motivation lors d'un entretien.

Ik ben op korte termijn beschikbaar.
Je suis disponible à court terme.

Ik zie uw reactie met belangstelling tegemoet.
J'attends votre réponse avec intérêt.

Met vriendelijke groet,      Cordialement,
Hoogachtend,                 Veuillez agréer… (très solennel)</pre>
<div class="warn">« Ik zie uw reactie met belangstelling tegemoet » est LA formule de clôture standard d'une candidature. Termine par <strong>Met vriendelijke groet,</strong> suivi de ton nom complet. « Hoogachtend » reste possible mais très solennel.</div>`,
  exercises: [
    { type: "qcm", q: "Comment se nomme la lettre de motivation en néerlandais ?", opts: ["de dagboek", "de sollicitatiebrief", "de factuur", "de uitnodiging"], a: 1, exp: "de sollicitatiebrief (ou motivatiebrief) = la lettre de motivation." },
    { type: "input", q: "Objet d'une candidature : « ___: sollicitatie naar de functie van projectmedewerker »", a: ["betreft"], ph: "un mot", exp: "Betreft: = Objet: (introduit le sujet de la lettre)." },
    { type: "qcm", q: "Formule d'appel correcte si le nom du recruteur est inconnu :", opts: ["Hoi,", "Beste vriend,", "Geachte heer/mevrouw,", "Hallo allemaal,"], a: 2, exp: "Geachte heer/mevrouw = Madame, Monsieur (formel, destinataire inconnu)." },
    { type: "vf", q: "Dans une candidature, on peut commencer par « Hoi, » pour paraître sympathique.", a: false, exp: "Une candidature exige le registre formel : Geachte… , jamais Hoi/Hallo." },
    { type: "input", q: "Accroche : « Met veel ___ las ik uw vacature. » (intérêt)", a: ["interesse"], ph: "un mot", exp: "Met veel interesse = avec grand intérêt (accroche dynamique)." },
    { type: "qcm", q: "« een vacature » désigne…", opts: ["un congé", "une offre d'emploi", "un salaire", "un contrat"], a: 1, exp: "een vacature = une offre / un poste vacant." },
    { type: "input", q: "« In mijn huidige ___ ben ik verantwoordelijk voor de planning. » (poste)", a: ["functie"], ph: "un mot", exp: "de functie = le poste, la fonction." },
    { type: "qcm", q: "« de werkervaring » signifie…", opts: ["le salaire", "l'expérience professionnelle", "la formation", "l'entretien"], a: 1, exp: "de werkervaring = l'expérience professionnelle." },
    { type: "input", q: "« Graag licht ik mijn motivatie toe in een persoonlijk ___ . » (entretien)", a: ["gesprek"], ph: "un mot", exp: "een (sollicitatie)gesprek = un entretien." },
    { type: "qcm", q: "Formule de clôture standard d'une candidature :", opts: ["Tot snel!", "Ik zie uw reactie met belangstelling tegemoet.", "Groetjes en kusjes.", "Doei!"], a: 1, exp: "Ik zie uw reactie met belangstelling tegemoet = clôture professionnelle typique." },
    { type: "qcm", q: "Signature professionnelle correcte :", opts: ["Groetjes,", "Liefs,", "Met vriendelijke groet,", "Kusjes,"], a: 2, exp: "Met vriendelijke groet, + nom complet = signature standard." },
    { type: "input", q: "« Dankzij mijn ervaring als teamleider ___ ik over sterke leidinggevende vaardigheden. » (verbe : je dispose)", a: ["beschik"], ph: "verbe", exp: "beschikken over = disposer de (beschik ik / ik beschik over…)." },
    { type: "vf", q: "Une bonne lettre relie les compétences du candidat aux besoins précis du poste.", a: true, exp: "Il faut montrer pourquoi VOUS pour CE poste, avec des faits concrets." },
    { type: "qcm", q: "Compréhension : « Uw bedrijf spreekt mij aan omdat het inzet op duurzaamheid. » signifie…", opts: ["Votre entreprise me dérange", "Votre entreprise m'attire parce qu'elle mise sur la durabilité", "Votre entreprise est fermée", "Je refuse le poste"], a: 1, exp: "aanspreken = attirer, plaire ; inzetten op = miser sur." },
    { type: "qcm", q: "Compréhension : « Ik ben op korte termijn beschikbaar. » veut dire…", opts: ["Je suis indisponible", "Je suis disponible à court terme", "Je pars en vacances", "Je démissionne"], a: 1, exp: "op korte termijn beschikbaar = disponible à court terme." }
  ],
  final: {
    title: "Exercice final — Een sollicitatiebrief lezen",
    intro: `<p>Lis cette lettre de motivation (formelle) et réponds aux questions :</p>
<pre class="pseudo">Rotterdam, 15 april 2026
Betreft: sollicitatie naar de functie van communicatiemedewerker

Geachte mevrouw De Bruyn,

Met veel interesse las ik uw vacature voor de functie van communicatie-
medewerker op uw website. Graag solliciteer ik naar deze functie, omdat zij
naadloos aansluit bij mijn opleiding en ambities.

In mijn huidige functie bij een marketingbureau ben ik verantwoordelijk voor
de sociale media en de interne nieuwsbrief. Dankzij deze ervaring beschik ik
over sterke schriftelijke vaardigheden en werk ik nauwkeurig onder tijdsdruk.
Uw organisatie spreekt mij bijzonder aan omdat zij inzet op heldere en
toegankelijke communicatie, een doel dat ik volledig onderschrijf.

Ik ben communicatief, creatief en stressbestendig, en ik leer graag bij.
Graag licht ik mijn motivatie nader toe in een persoonlijk gesprek. Ik ben
op korte termijn beschikbaar en zie uw reactie met belangstelling tegemoet.

Met vriendelijke groet,
Sophie Vermeulen</pre>`,
    questions: [
      { type: "input", q: "Quel mot introduit l'objet de la lettre ? « ___: sollicitatie naar… »", a: ["betreft"], ph: "un mot", exp: "Betreft: = Objet:" },
      { type: "qcm", q: "La formule d'appel « Geachte mevrouw De Bruyn » indique que…", opts: ["le recruteur est inconnu", "le nom du recruteur est connu et le ton est formel", "la lettre est informelle", "c'est un e-mail entre amis"], a: 1, exp: "Geachte + nom = appel formel avec destinataire nommé." },
      { type: "qcm", q: "« Dankzij deze ervaring beschik ik over sterke schriftelijke vaardigheden » sert à…", opts: ["saluer", "valoriser une compétence via l'expérience", "conclure", "refuser le poste"], a: 1, exp: "beschikken over + vaardigheden = mise en valeur du parcours." },
      { type: "input", q: "Comment la candidate exprime-t-elle sa disponibilité ? « Ik ben op korte ___ beschikbaar. »", a: ["termijn"], ph: "un mot", exp: "op korte termijn beschikbaar = disponible à court terme." },
      { type: "qcm", q: "La clôture « Ik zie uw reactie met belangstelling tegemoet » exprime…", opts: ["un refus", "l'attente polie d'une réponse", "une excuse", "une menace"], a: 1, exp: "Formule standard : j'attends votre réponse avec intérêt." }
    ],
    solution: `<p>Traduction : « Rotterdam, le 15 avril 2026. Objet : candidature au poste de chargé(e) de communication. Madame De Bruyn, J'ai lu avec grand intérêt votre offre pour le poste de chargé(e) de communication sur votre site. Je pose volontiers ma candidature à ce poste, car il correspond parfaitement à ma formation et à mes ambitions. Dans mon poste actuel au sein d'une agence de marketing, je suis responsable des réseaux sociaux et de la newsletter interne. Grâce à cette expérience, je dispose de solides compétences rédactionnelles et je travaille avec rigueur sous la pression du temps. Votre organisation m'attire particulièrement parce qu'elle mise sur une communication claire et accessible, un objectif que je partage entièrement. Je suis communicative, créative et résistante au stress, et j'aime apprendre. Je serais ravie d'exposer ma motivation lors d'un entretien. Je suis disponible à court terme et j'attends votre réponse avec intérêt. Cordialement, Sophie Vermeulen. »</p>
<p>Points clés à réutiliser : l'<strong>objet</strong> (Betreft:), l'<strong>appel formel</strong> (Geachte + nom), une <strong>accroche</strong> qui nomme le poste et sa source (Met veel interesse las ik uw vacature…), une <strong>motivation</strong> ancrée dans des faits (In mijn huidige functie… / Dankzij deze ervaring beschik ik over…), un lien explicite avec l'entreprise (Uw organisatie spreekt mij aan omdat…), et une <strong>clôture</strong> professionnelle (Graag licht ik mijn motivatie toe in een gesprek / Ik zie uw reactie met belangstelling tegemoet / Met vriendelijke groet). Registre soutenu et vouvoiement (u) du début à la fin.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "nl-b2-j14", title: "Rédige ta sollicitatiebrief", level: 3,
    statement: "Rédige une lettre de motivation en néerlandais (10 à 14 phrases) pour un poste de ton choix (par ex. medewerker klantenservice, stagiair marketing, verpleegkundige). Inclus : l'objet (Betreft:), une formule d'appel formelle (Geachte…), une accroche nommant le poste, deux phrases valorisant ton parcours reliées au poste, une phrase sur l'entreprise, la disponibilité et une clôture (Met vriendelijke groet + nom). Vouvoiement (u) tout du long.",
    hints: [
      "Ouvre par : Betreft: sollicitatie naar de functie van… puis Geachte heer/mevrouw,",
      "Accroche : Met veel interesse las ik uw vacature voor de functie van…",
      "Clôture : Graag licht ik mijn motivatie toe in een gesprek. Ik zie uw reactie met belangstelling tegemoet. Met vriendelijke groet, + nom."
    ],
    solution: "Gent, 19 mei 2026\nBetreft: sollicitatie naar de functie van medewerker klantenservice\n\nGeachte heer/mevrouw,\n\nMet veel interesse las ik uw vacature voor de functie van medewerker klantenservice. Graag solliciteer ik naar deze functie, omdat zij goed aansluit bij mijn ervaring en mijn interesse in klantcontact.\n\nIn mijn huidige functie bij een telecombedrijf sta ik dagelijks klanten te woord en los ik hun vragen zelfstandig op. Dankzij deze ervaring beschik ik over sterke communicatieve vaardigheden en blijf ik ook onder tijdsdruk vriendelijk en nauwkeurig. Uw bedrijf spreekt mij aan omdat het bekendstaat om zijn uitstekende service, een waarde die ik volledig deel.\n\nIk ben communicatief, geduldig en stressbestendig, en ik werk graag in teamverband. Graag licht ik mijn motivatie nader toe in een persoonlijk gesprek. Ik ben op korte termijn beschikbaar en zie uw reactie met belangstelling tegemoet.\n\nMet vriendelijke groet,\nDavid Peeters\n\nTraduction : « Gand, le 19 mai 2026. Objet : candidature au poste d'agent du service clientèle. Madame, Monsieur, J'ai lu avec grand intérêt votre offre pour le poste d'agent du service clientèle. Je pose volontiers ma candidature à ce poste, car il correspond bien à mon expérience et à mon intérêt pour le contact client. Dans mon poste actuel au sein d'une entreprise de télécommunications, je réponds chaque jour aux clients et je résous leurs questions de façon autonome. Grâce à cette expérience, je dispose de solides compétences de communication et je reste aimable et rigoureux même sous la pression du temps. Votre entreprise m'attire parce qu'elle est réputée pour son excellent service, une valeur que je partage pleinement. Je suis communicatif, patient et résistant au stress, et j'aime travailler en équipe. Je serais ravi d'exposer ma motivation lors d'un entretien. Je suis disponible à court terme et j'attends votre réponse avec intérêt. Cordialement, David Peeters. »",
    note: "Une sollicitatiebrief efficace ne se contente pas d'adjectifs : elle prouve. À chaque qualité annoncée, associe un fait (« In mijn huidige functie… », « Dankzij deze ervaring… »). Garde le vouvoiement (u), l'objet, l'appel Geachte et la clôture Met vriendelijke groet : c'est le cadre attendu par tout recruteur néerlandophone." }
  ]
};
</script>
