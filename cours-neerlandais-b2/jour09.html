  title: "Articuler un argumentaire",
  subtitle: "Les connecteurs logiques pour structurer une opinion : cause, opposition, conséquence, conclusion.",
  theory: `
<h3>1. Pourquoi les connecteurs comptent</h3>
<p>Un texte B2 ne se contente pas d'aligner des idées : il les <strong>relie</strong>. Les connecteurs (verbindingswoorden) rendent le raisonnement lisible et signalent au lecteur la relation logique. Ils se répartissent en familles.</p>
<h3>2. Introduire et énumérer</h3>
<pre class="pseudo">ten eerste / ten tweede      premièrement / deuxièmement
allereerst                   tout d'abord
bovendien                    en outre, de plus
daarnaast                    par ailleurs, à côté de cela
ook                          aussi
verder / vervolgens          ensuite, puis</pre>
<p><strong>Bovendien</strong> et <strong>daarnaast</strong> ajoutent un argument ; placés en tête, ils déclenchent l'inversion : <strong>Bovendien is het goedkoper.</strong> = De plus, c'est moins cher.</p>
<h3>3. La cause et la conséquence</h3>
<pre class="pseudo">omdat / doordat        parce que (omdat = raison ; doordat = cause matérielle)
want                   car (coordination, pas d'inversion)
daarom / daardoor      c'est pourquoi / de ce fait (inversion)
dus                    donc
zodat                  de sorte que (subordonnée)
namelijk               à savoir, en effet</pre>
<div class="tip">Nuance fine : <strong>omdat</strong> introduit une raison consciente (Ik blijf thuis omdat ik moe ben) ; <strong>doordat</strong> une cause involontaire, mécanique (De weg is glad doordat het vriest = la route est glissante du fait du gel). Et <strong>daardoor</strong> = de ce fait (conséquence), à ne pas confondre avec <strong>daarom</strong> = c'est pourquoi (raison).</div>
<h3>4. L'opposition et la concession</h3>
<pre class="pseudo">maar                   mais (coordination)
echter                 cependant (soutenu, souvent après le 1er élément)
toch                   pourtant (inversion en tête)
hoewel                 bien que (subordonnée)
daarentegen            en revanche
enerzijds … anderzijds d'une part … d'autre part
integendeel            au contraire</pre>
<p><strong>echter</strong> est typique de l'écrit soigné : <strong>Dit plan is aantrekkelijk. Het is echter duur.</strong> = Ce plan est attirant. Il est cependant coûteux. Notez sa place, souvent en deuxième position.</p>
<h3>5. Conclure et nuancer</h3>
<pre class="pseudo">kortom                 bref, en somme
al met al              tout compte fait
ten slotte             enfin, finalement
concluderend           en conclusion
enerzijds … anderzijds pour peser le pour et le contre
in feite               en fait
naar mijn mening       à mon avis</pre>
<div class="warn">Ne confonds pas les catégories syntaxiques : <strong>omdat, hoewel, zodat</strong> sont des conjonctions de SUBORDINATION (verbe à la fin) ; <strong>want, maar, dus</strong> sont des coordonnants (ordre normal) ; <strong>daarom, toch, bovendien, echter</strong> sont des adverbes de liaison (inversion s'ils ouvrent la phrase). Choisir le mauvais type casse la structure.</div>`,
  exercises: [
    { type: "qcm", q: "« bovendien » sert à…", opts: ["opposer", "ajouter un argument (de plus)", "conclure", "donner une cause"], a: 1, exp: "bovendien = en outre, de plus (ajout)." },
    { type: "input", q: "Ajout avec inversion : « ___ is het goedkoper. » (de plus)", a: ["bovendien"], ph: "connecteur", exp: "Bovendien en tête → inversion : Bovendien is het…" },
    { type: "qcm", q: "Différence omdat / doordat : « De weg is glad ___ het vriest » (cause mécanique).", opts: ["omdat", "doordat", "want", "zodat"], a: 1, exp: "doordat = cause involontaire/mécanique (le gel)." },
    { type: "qcm", q: "« daarom » et « daardoor » : lequel signifie « c'est pourquoi » (raison) ?", opts: ["daardoor", "daarom", "les deux", "aucun"], a: 1, exp: "daarom = c'est pourquoi (raison) ; daardoor = de ce fait (conséquence)." },
    { type: "input", q: "Concession en subordonnée : « ___ het regende, gingen we wandelen. » (bien que)", a: ["hoewel"], ph: "conjonction", exp: "hoewel = bien que (verbe à la fin de la subordonnée)." },
    { type: "qcm", q: "« echter » appartient au registre…", opts: ["familier", "soutenu / écrit soigné", "argotique", "enfantin"], a: 1, exp: "echter (cependant) est typique de l'écrit formel." },
    { type: "input", q: "Conclusion : « ___ , het was een geslaagde dag. » (bref / en somme)", a: ["kortom"], ph: "connecteur", exp: "kortom = bref, en somme (conclusion)." },
    { type: "qcm", q: "Quel connecteur est une conjonction de coordination (ordre normal, pas d'inversion) ?", opts: ["daarom", "want", "toch", "bovendien"], a: 1, exp: "want = car (coordination) : ordre sujet-verbe après lui." },
    { type: "vf", q: "« zodat » entraîne le rejet du verbe à la fin (subordination).", a: true, exp: "zodat = de sorte que : conjonction de subordination." },
    { type: "qcm", q: "Pour peser le pour et le contre, on emploie…", opts: ["dus … dus", "enerzijds … anderzijds", "want … maar", "omdat … doordat"], a: 1, exp: "enerzijds … anderzijds = d'une part … d'autre part." },
    { type: "input", q: "Opposition en tête (inversion) : « ___ heeft hij gelijk. » (pourtant)", a: ["toch"], ph: "connecteur", exp: "Toch en tête → inversion : Toch heeft hij gelijk." },
    { type: "qcm", q: "« daarentegen » signifie…", opts: ["par conséquent", "en revanche", "de plus", "à savoir"], a: 1, exp: "daarentegen = en revanche (opposition)." },
    { type: "vf", q: "« daarom » placé en tête de phrase entraîne l'inversion.", a: true, exp: "Adverbe de liaison en tête → verbe en 2e position." },
    { type: "qcm", q: "Compréhension : « Het idee is goed. Het is echter moeilijk uitvoerbaar. » La 2e phrase…", opts: ["ajoute un argument", "nuance / oppose (cependant difficile à réaliser)", "conclut", "donne une cause"], a: 1, exp: "echter = cependant : opposition/nuance." },
    { type: "qcm", q: "Compréhension : « Hij trainde hard, daardoor won hij de wedstrijd. » « daardoor » exprime…", opts: ["une opposition", "la conséquence (de ce fait il a gagné)", "une concession", "une énumération"], a: 1, exp: "daardoor = de ce fait / par conséquent." }
  ],
  final: {
    title: "Exercice final — Een beargumenteerde stelling",
    intro: `<p>Ce texte argumenté enchaîne les connecteurs. Lis-le, puis réponds :</p>
<pre class="pseudo">De laatste jaren wordt er veel gediscussieerd over gratis openbaar vervoer.
Ten eerste zou het de files kunnen verminderen, omdat meer mensen de bus zouden nemen.
Bovendien is het goed voor het milieu, doordat er minder auto's rijden.
Gratis vervoer is echter niet zonder nadelen.
Het kost namelijk veel geld, dat de overheid ergens anders moet weghalen.
Sommigen vrezen daarom dat andere diensten eronder zullen lijden.
Hoewel het idee sympathiek klinkt, moeten we de kosten realistisch bekijken.
Enerzijds is toegankelijkheid belangrijk, anderzijds moet het systeem betaalbaar blijven.
Al met al denk ik dat een goedkoper, maar niet volledig gratis systeem de beste oplossing is.</pre>`,
    questions: [
      { type: "qcm", q: "« Ten eerste » ouvre le texte pour…", opts: ["conclure", "énumérer / introduire le premier argument", "opposer", "donner une conséquence"], a: 1, exp: "ten eerste = premièrement (énumération)." },
      { type: "input", q: "Relève le connecteur d'ajout : « ___ is het goed voor het milieu »", a: ["bovendien"], ph: "connecteur", exp: "bovendien = de plus (ajout d'un argument)." },
      { type: "qcm", q: "« Gratis vervoer is echter niet zonder nadelen » : « echter » marque…", opts: ["un ajout", "une opposition / nuance (cependant)", "une conclusion", "une cause"], a: 1, exp: "echter = cependant : introduit le contre-argument." },
      { type: "qcm", q: "« doordat er minder auto's rijden » exprime…", opts: ["une opposition", "une cause mécanique / involontaire", "une conclusion", "une concession"], a: 1, exp: "doordat = cause matérielle (moins de voitures roulent)." },
      { type: "input", q: "Relève le connecteur de conclusion final : « ___ denk ik dat … de beste oplossing is. » (tout compte fait)", a: ["al met al"], ph: "connecteur", exp: "al met al = tout compte fait (conclusion nuancée)." }
    ],
    solution: `<p>Traduction : « Ces dernières années, on débat beaucoup des transports en commun gratuits. Premièrement, cela pourrait réduire les embouteillages, parce que plus de gens prendraient le bus. De plus, c'est bon pour l'environnement, du fait que moins de voitures circulent. La gratuité n'est cependant pas sans inconvénients. Elle coûte en effet beaucoup d'argent, que les pouvoirs publics doivent prélever ailleurs. Certains craignent donc que d'autres services en pâtissent. Bien que l'idée paraisse sympathique, nous devons examiner les coûts de façon réaliste. D'une part l'accessibilité est importante, d'autre part le système doit rester abordable. Tout compte fait, je pense qu'un système moins cher, mais pas totalement gratuit, est la meilleure solution. »</p>
<p>La structure argumentative se lit dans les connecteurs : <strong>ten eerste / bovendien</strong> (arguments pour), <strong>echter / hoewel</strong> (bascule vers le contre), <strong>omdat / doordat / namelijk</strong> (justifications), <strong>daarom</strong> (conséquence), <strong>enerzijds … anderzijds</strong> (équilibre), <strong>al met al</strong> (conclusion nuancée). Respecte les types syntaxiques : subordination (verbe à la fin), coordination (ordre normal) ou adverbe (inversion).</p>`
  }
};
