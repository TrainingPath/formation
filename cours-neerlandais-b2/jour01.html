<script>
var DAY = {
  num: 1,
  title: "Réviser les temps et l'aspect",
  subtitle: "Remettre au clair les temps du néerlandais et la notion d'aspect (accompli / en cours).",
  theory: `
<h3>1. Panorama des temps</h3>
<p>Avant d'aborder les finesses du B2, faisons le tri parmi les temps déjà rencontrés. Le néerlandais en distingue six principaux, construits autour de deux auxiliaires : <strong>hebben</strong>/<strong>zijn</strong> (avoir/être) et <strong>zullen</strong> (auxiliaire du futur).</p>
<pre class="pseudo">Présent (o.t.t.)        Ik werk.                 Je travaille.
Prétérit (o.v.t.)       Ik werkte.               Je travaillais / je travaillai.
Parfait (v.t.t.)        Ik heb gewerkt.          J'ai travaillé.
Plus-que-parfait        Ik had gewerkt.          J'avais travaillé.
Futur (o.t.t.t.)        Ik zal werken.           Je travaillerai.
Futur antérieur         Ik zal gewerkt hebben.   J'aurai travaillé.</pre>
<p>Les abréviations néerlandaises (o.t.t. = onvoltooid tegenwoordige tijd, etc.) reviennent dans les grammaires : autant les reconnaître.</p>
<h3>2. Prétérit ou parfait ? La vraie difficulté</h3>
<p>Là où le français oppose passé composé et imparfait, le néerlandais oppose <strong>o.v.t.</strong> (prétérit) et <strong>v.t.t.</strong> (parfait) selon une logique différente. Règle pratique :</p>
<ul>
<li>Le <strong>parfait</strong> (heb/heeft + participe) domine à l'oral et pour un fait ponctuel relié au présent : <strong>Ik heb hem gisteren gezien.</strong> = Je l'ai vu hier.</li>
<li>Le <strong>prétérit</strong> s'emploie pour le récit suivi, les descriptions, les habitudes passées et après <strong>toen</strong> : <strong>Toen ik jong was, speelde ik vaak buiten.</strong> = Quand j'étais jeune, je jouais souvent dehors.</li>
</ul>
<div class="tip">Astuce de traduction : l'imparfait français de description ou d'habitude correspond presque toujours au prétérit néerlandais (<strong>het regende</strong> = il pleuvait), tandis que le passé composé d'un fait isolé correspond au parfait.</div>
<h3>3. L'aspect : accompli et progressif</h3>
<p>L'<strong>aspect</strong> ne concerne pas le moment (passé/présent) mais l'état de l'action : est-elle <em>achevée</em> ou <em>en train de se dérouler</em> ? Le néerlandais n'a pas de forme progressive obligatoire comme l'anglais, mais plusieurs tournures rendent l'action en cours :</p>
<pre class="pseudo">aan het + infinitif    Ik ben aan het koken.        Je suis en train de cuisiner.
zitten/staan/liggen te Hij zit te lezen.            Il est en train de lire.
bezig zijn met/te      Ze is bezig met haar werk.   Elle est occupée à son travail.</pre>
<p>La construction <strong>aan het</strong> est la plus fréquente et la plus neutre. Les verbes de posture (<strong>zitten, staan, liggen</strong>) ajoutent une nuance de position : <strong>Hij ligt te slapen</strong> = il dort (allongé).</p>
<h3>4. Le futur : zullen ou présent ?</h3>
<p>Le futur avec <strong>zullen</strong> n'est pas systématique. Un présent accompagné d'un adverbe de temps suffit souvent : <strong>Morgen ga ik naar Brussel.</strong> = Demain je vais / j'irai à Bruxelles. On réserve <strong>zullen</strong> à la prédiction, la promesse ou la proposition : <strong>Zal ik je helpen?</strong> = Veux-tu que je t'aide ?</p>
<div class="warn">Ne confonds pas <strong>zullen</strong> (futur / proposition) et <strong>willen</strong> (vouloir). <strong>Ik zal komen</strong> = je viendrai (prédiction) ; <strong>Ik wil komen</strong> = je veux venir (volonté). Une erreur classique du francophone est de traduire mécaniquement « je vais » par un futur alors qu'un présent suffit.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle forme correspond au plus-que-parfait de « werken » ?", opts: ["ik werkte", "ik heb gewerkt", "ik had gewerkt", "ik zal werken"], a: 2, exp: "had + participe = plus-que-parfait (voltooid verleden tijd)." },
    { type: "qcm", q: "Après « toen » (quand, dans le passé), on emploie de préférence…", opts: ["le parfait", "le prétérit", "le futur", "le présent"], a: 1, exp: "Toen + prétérit : Toen ik jong was, speelde ik buiten." },
    { type: "input", q: "Mets au parfait : « Ik ___ hem gisteren gezien. » (auxiliaire)", a: ["heb"], ph: "auxiliaire", exp: "hebben + participe : ik heb gezien." },
    { type: "vf", q: "La tournure « aan het + infinitif » exprime une action en cours.", a: true, exp: "Ik ben aan het koken = je suis en train de cuisiner." },
    { type: "qcm", q: "« Ik ben aan het lezen » signifie…", opts: ["J'ai lu", "Je vais lire", "Je suis en train de lire", "Je lisais"], a: 2, exp: "aan het + infinitif = action progressive." },
    { type: "input", q: "Traduis « il dort (allongé) » avec un verbe de posture : « Hij ___ te slapen. »", a: ["ligt"], ph: "verbe de posture", exp: "liggen te + infinitif : Hij ligt te slapen." },
    { type: "qcm", q: "L'imparfait français de description (« il pleuvait ») se rend le plus souvent par…", opts: ["le parfait néerlandais", "le prétérit néerlandais", "aan het + infinitif", "zullen + infinitif"], a: 1, exp: "Description / habitude passée = prétérit : het regende." },
    { type: "input", q: "Complète le progressif : « Ze is ___ met haar werk. » (occupée)", a: ["bezig"], ph: "un mot", exp: "bezig zijn met = être occupé à." },
    { type: "vf", q: "« Zal ik je helpen? » est une proposition d'aide (« Veux-tu que je t'aide ? »).", a: true, exp: "zullen à la 1re personne interrogative = proposition." },
    { type: "qcm", q: "Quelle phrase exprime une habitude passée ?", opts: ["Ik heb gewerkt", "Vroeger werkte ik in Gent", "Ik zal werken", "Ik ben aan het werken"], a: 1, exp: "vroeger + prétérit = habitude / description dans le passé." },
    { type: "input", q: "Futur avec zullen : « Ik ___ je morgen bellen. »", a: ["zal"], ph: "auxiliaire", exp: "zullen : ik zal bellen." },
    { type: "qcm", q: "« Morgen ga ik naar Brussel » (sans zullen) est…", opts: ["incorrect au B2", "correct : le présent + adverbe suffit à exprimer le futur", "un ordre", "du passé"], a: 1, exp: "Le présent avec un adverbe de temps exprime couramment le futur." },
    { type: "vf", q: "« Ik wil komen » et « Ik zal komen » ont exactement le même sens.", a: false, exp: "willen = vouloir (volonté) ; zullen = futur / prédiction. Sens différent." },
    { type: "qcm", q: "Compréhension : « Toen ik binnenkwam, was hij aan het telefoneren. » Que faisait-il ?", opts: ["Il avait téléphoné", "Il était en train de téléphoner", "Il allait téléphoner", "Il ne téléphonait pas"], a: 1, exp: "aan het telefoneren au passé (was) = action en cours au moment de l'entrée." },
    { type: "input", q: "Traduis « J'avais déjà mangé » : « Ik ___ al gegeten. » (auxiliaire du plus-que-parfait)", a: ["had"], ph: "auxiliaire", exp: "had + participe = plus-que-parfait : ik had al gegeten." }
  ],
  final: {
    title: "Exercice final — Een dag uit het verleden",
    intro: `<p>Lis ce récit au registre soigné, puis réponds aux questions :</p>
<pre class="pseudo">Toen ik nog studeerde, woonde ik in een klein appartement in Leuven.
Elke ochtend fietste ik naar de universiteit, ook als het regende.
Op een dag, terwijl ik aan het studeren was, ging plotseling de bel.
Het was mijn oude buurman, die me om hulp kwam vragen.
Zijn computer was gecrasht en hij had een belangrijk document verloren.
Ik heb hem meteen geholpen en na een uur werkte alles weer.
Sindsdien hebben we een goede band opgebouwd.
Als ik nu terugdenk aan die tijd, besef ik hoe waardevol die kleine momenten waren.
Ik zal die periode nooit vergeten.
Volgend jaar ga ik hem trouwens weer opzoeken.</pre>`,
    questions: [
      { type: "qcm", q: "Quel temps domine dans la description de la vie étudiante (woonde, fietste) ?", opts: ["le parfait", "le prétérit", "le futur", "le plus-que-parfait"], a: 1, exp: "Description / habitude passée = prétérit." },
      { type: "input", q: "Relève la forme progressive au passé employée dans le texte : « ik was aan het ___ »", a: ["studeren"], ph: "un verbe", exp: "terwijl ik aan het studeren was = pendant que j'étudiais (en cours)." },
      { type: "qcm", q: "« Zijn computer was gecrasht » exprime…", opts: ["un futur", "une action antérieure à un autre passé (plus-que-parfait)", "une habitude", "une proposition"], a: 1, exp: "was gecrasht : l'ordinateur avait planté avant la demande d'aide." },
      { type: "qcm", q: "Pourquoi « Ik heb hem meteen geholpen » est-il au parfait et non au prétérit ?", opts: ["Erreur du texte", "Fait ponctuel mis en relief, relié au présent du narrateur", "C'est une habitude", "C'est un futur"], a: 1, exp: "Le parfait souligne un fait ponctuel important dans le récit." },
      { type: "input", q: "Quelle intention exprime « Ik zal die periode nooit vergeten » ? (un mot : promesse/prédiction → traduis « ne… jamais »)", a: ["nooit"], ph: "un mot", exp: "zal + nooit vergeten = prédiction ferme : je n'oublierai jamais." }
    ],
    solution: `<p>Traduction : « Quand j'étudiais encore, j'habitais un petit appartement à Louvain. Chaque matin je faisais du vélo jusqu'à l'université, même quand il pleuvait. Un jour, pendant que j'étudiais, la sonnette retentit soudain. C'était mon vieux voisin, qui venait me demander de l'aide. Son ordinateur avait planté et il avait perdu un document important. Je l'ai aidé aussitôt et après une heure tout refonctionnait. Depuis, nous avons noué un bon lien. Quand je repense à cette époque, je réalise combien ces petits moments étaient précieux. Je n'oublierai jamais cette période. L'an prochain je compte d'ailleurs lui rendre à nouveau visite. »</p>
<p>Repère la mécanique : <strong>prétérit</strong> pour le décor (woonde, fietste, regende), <strong>plus-que-parfait</strong> pour ce qui précède (was gecrasht, had verloren), <strong>parfait</strong> pour les faits saillants reliés au présent (heb geholpen, hebben opgebouwd), et <strong>zullen / présent + adverbe</strong> pour l'avenir (zal vergeten, ga opzoeken).</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en néerlandais…",
  items: [
  { id: "nl-b2-j01", title: "Un souvenir marquant", level: 3,
    statement: "Raconte un souvenir marquant (8 à 10 phrases) en variant volontairement les temps : décor au prétérit, faits saillants au parfait, une action antérieure au plus-que-parfait et au moins une tournure progressive (aan het / verbe de posture).",
    hints: [
      "Ouvre le décor avec « Toen… » + prétérit (woonde, werkte, was).",
      "Insère une action en cours avec « terwijl ik aan het … was ».",
      "Utilise le plus-que-parfait (had/was + participe) pour ce qui s'était passé avant."
    ],
    solution: "Toen ik achttien was, maakte ik mijn eerste grote reis alleen. Ik reisde met de trein naar Berlijn, terwijl het buiten hard regende. Onderweg was ik aan het lezen, maar ik viel al snel in slaap. Toen ik aankwam, besefte ik dat ik mijn portemonnee had verloren. Gelukkig had ik mijn telefoon nog. Ik heb meteen mijn ouders gebeld en zij hebben me geholpen. Een vriendelijke voorbijganger stond te wachten en wees me de weg naar het hostel. Sindsdien ben ik veel voorzichtiger geworden. Ik zal die dag nooit vergeten.\n\nTraduction : Quand j'avais dix-huit ans, j'ai fait mon premier grand voyage seul. Je voyageais en train vers Berlin, pendant qu'il pleuvait fort dehors. En chemin j'étais en train de lire, mais je me suis vite endormi. En arrivant, j'ai réalisé que j'avais perdu mon portefeuille. Heureusement j'avais encore mon téléphone. J'ai aussitôt appelé mes parents et ils m'ont aidé. Un passant aimable attendait et m'a indiqué le chemin de l'auberge. Depuis, je suis devenu bien plus prudent. Je n'oublierai jamais ce jour.",
    note: "L'enjeu du B2 n'est pas de juxtaposer des temps, mais de les articuler : chaque temps porte une valeur (décor, rupture, antériorité, aspect). Relis en te demandant, pour chaque verbe, pourquoi ce temps-là." }
  ]
};
</script>
