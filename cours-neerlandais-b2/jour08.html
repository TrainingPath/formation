<script>
var DAY = {
  num: 8,
  title: "Les modaux au passé (had moeten...)",
  subtitle: "Exprimer le regret, le reproche et l'hypothèse passée avec les verbes de modalité.",
  theory: `
<h3>1. Rappel des modaux</h3>
<p>Les cinq verbes modaux structurent l'expression de la nécessité, de la possibilité et de la volonté : <strong>kunnen</strong> (pouvoir, capacité), <strong>mogen</strong> (avoir le droit), <strong>moeten</strong> (devoir), <strong>willen</strong> (vouloir), <strong>zullen</strong> (auxiliaire de futur / conditionnel). Au B2, l'enjeu est de les manier <strong>au passé</strong> pour nuancer regret et reproche.</p>
<h3>2. Le double infinitif au parfait</h3>
<p>Quand un modal accompagne un autre verbe au parfait, le modal reste à l'<strong>infinitif</strong> (pas de participe) : c'est le « double infinitif ». L'auxiliaire est toujours <strong>hebben</strong>.</p>
<pre class="pseudo">Ik heb hard moeten werken.       J'ai dû travailler dur.
Ze heeft niet kunnen komen.      Elle n'a pas pu venir.
We hebben mogen blijven.         Nous avons eu le droit de rester.</pre>
<div class="warn">Jamais « gemoeten », « gekund » quand un second verbe suit. On dit « heb moeten werken », pas « heb gemoeten werken ». Le participe (gemoeten, gekund, gewild) n'existe que si le modal est SEUL : « Dat heb ik nooit gewild » (je ne l'ai jamais voulu, sans autre verbe).</div>
<h3>3. Had moeten + infinitif : le reproche et le regret</h3>
<p>La structure reine de cette leçon. <strong>Had / hadden + infinitif + moeten/kunnen/mogen</strong> exprime ce qu'on <em>aurait dû / aurait pu / aurait eu le droit de</em> faire, mais qu'on n'a PAS fait. C'est le regret ou le reproche :</p>
<pre class="pseudo">Je had eerder moeten komen.        Tu aurais dû venir plus tôt. (reproche)
Ik had het kunnen weten.           J'aurais pu le savoir. (regret)
Dat had je niet mogen doen.        Tu n'aurais pas eu le droit de faire ça.
We hadden beter moeten opletten.   Nous aurions mieux fait de faire attention.</pre>
<p>L'ordre des verbes en fin est flexible : <strong>had moeten komen</strong> ou <strong>had komen moeten</strong> ; le modal se place généralement en dernier ou juste avant l'infinitif principal.</p>
<h3>4. Zou(den) + infinitif : le conditionnel</h3>
<p><strong>zou / zouden</strong> (prétérit de zullen) forme le conditionnel présent, et <strong>zou … hebben/zijn</strong> le conditionnel passé :</p>
<pre class="pseudo">Ik zou graag willen komen.              J'aimerais bien venir. (conditionnel présent)
Ik zou dat nooit gedaan hebben.         Je n'aurais jamais fait ça. (conditionnel passé)
Als ik rijk was, zou ik veel reizen.    Si j'étais riche, je voyagerais beaucoup.
Als ik het had geweten, zou ik gekomen zijn.  Si j'avais su, je serais venu.</pre>
<h3>5. Nuancer : moeten, hoeven, mogen</h3>
<p>Attention à la négation : <strong>niet moeten</strong> ≠ <strong>niet hoeven</strong>. Pour « ne pas être obligé de », on emploie <strong>hoeven … te</strong> :</p>
<pre class="pseudo">Je moet niet komen.       Tu ne dois pas venir. (interdiction / conseil négatif)
Je hoeft niet te komen.   Tu n'es pas obligé de venir. (absence d'obligation)
Dat had je niet hoeven doen.  Tu n'aurais pas eu besoin de faire ça.</pre>
<div class="tip">Mémo du regret : had + infinitif principal + moeten = « aurait dû ». Remplace moeten par kunnen (aurait pu) ou mogen (aurait eu le droit) selon la nuance. C'est l'outil clé pour commenter le passé avec recul.</div>`,
  exercises: [
    { type: "qcm", q: "Au parfait, quand un modal suit un autre verbe, il prend la forme…", opts: ["du participe (gemoeten)", "de l'infinitif (moeten)", "du prétérit", "du présent"], a: 1, exp: "Double infinitif : heb moeten werken, pas « gemoeten »." },
    { type: "input", q: "Complète : « Ze heeft niet ___ komen. » (pouvoir → double infinitif)", a: ["kunnen"], ph: "modal à l'infinitif", exp: "heeft niet kunnen komen (double infinitif)." },
    { type: "vf", q: "« Ik heb gemoeten werken » est correct.", a: false, exp: "Faux : double infinitif → Ik heb moeten werken." },
    { type: "qcm", q: "« Je had eerder moeten komen » exprime…", opts: ["un ordre futur", "un reproche : tu aurais dû venir plus tôt", "une capacité présente", "une permission"], a: 1, exp: "had + moeten + infinitif = aurait dû (reproche/regret)." },
    { type: "input", q: "Regret : « Ik ___ het kunnen weten. » (auxiliaire du regret passé)", a: ["had"], ph: "auxiliaire", exp: "Ik had het kunnen weten = j'aurais pu le savoir." },
    { type: "qcm", q: "« Dat had je niet mogen doen » signifie…", opts: ["Tu peux le faire", "Tu n'aurais pas eu le droit de faire ça", "Tu dois le faire", "Tu le feras"], a: 1, exp: "had niet mogen doen = n'aurait pas eu le droit." },
    { type: "input", q: "Conditionnel présent : « Ik ___ graag willen komen. » (auxiliaire)", a: ["zou"], ph: "auxiliaire", exp: "zou + infinitif = conditionnel : j'aimerais venir." },
    { type: "qcm", q: "Le participe « gewild » n'est possible que si…", opts: ["le modal suit un autre verbe", "le modal est SEUL (sans autre infinitif)", "on est au présent", "jamais"], a: 1, exp: "Dat heb ik nooit gewild : modal seul → participe possible." },
    { type: "vf", q: "« Je moet niet komen » et « Je hoeft niet te komen » ont le même sens.", a: false, exp: "moet niet = tu ne dois pas (interdiction) ; hoeft niet te = tu n'es pas obligé (absence d'obligation)." },
    { type: "qcm", q: "Pour « tu n'es pas obligé de venir », on dit…", opts: ["Je moet niet komen", "Je hoeft niet te komen", "Je kan niet komen", "Je mag niet komen"], a: 1, exp: "hoeven … te = ne pas être obligé de." },
    { type: "input", q: "Conditionnel passé : « Als ik het had geweten, ___ ik gekomen zijn. » (auxiliaire)", a: ["zou"], ph: "auxiliaire", exp: "zou … gekomen zijn = serais venu (conditionnel passé)." },
    { type: "qcm", q: "« We hadden beter moeten opletten » traduit…", opts: ["Nous ferons attention", "Nous aurions mieux fait de faire attention", "Nous pouvons regarder", "Nous devons partir"], a: 1, exp: "hadden beter moeten = aurions mieux fait de (regret)." },
    { type: "vf", q: "« Dat had je niet hoeven doen » = tu n'aurais pas eu besoin de faire ça.", a: true, exp: "had niet hoeven doen = absence de nécessité passée." },
    { type: "qcm", q: "Compréhension : « Ik had je moeten waarschuwen, sorry. » Le locuteur exprime…", opts: ["une menace", "un regret / des excuses (j'aurais dû te prévenir)", "un ordre", "une capacité"], a: 1, exp: "had moeten waarschuwen = j'aurais dû prévenir : regret et excuse." },
    { type: "qcm", q: "Compréhension : « Zonder jouw hulp had ik het niet kunnen doen. » Cela signifie…", opts: ["Je l'ai fait seul", "Sans ton aide je n'aurais pas pu le faire", "Tu ne m'as pas aidé", "Je le ferai plus tard"], a: 1, exp: "had het niet kunnen doen = n'aurais pas pu le faire (hypothèse passée)." }
  ],
  final: {
    title: "Exercice final — Spijt en zelfreflectie",
    intro: `<p>Ce monologue exprime regrets et prises de conscience. Lis-le, puis réponds :</p>
<pre class="pseudo">Achteraf gezien had ik het anders moeten aanpakken.
Ik had veel eerder om hulp moeten vragen, maar dat durfde ik niet.
Ik dacht dat ik alles alleen kon, en dat had ik nooit mogen denken.
Als ik toen beter had geluisterd, zou het project geslaagd zijn.
Mijn collega's hadden me kunnen helpen, als ik het maar had gevraagd.
Ik heb er te lang mee gewacht en dat had ik niet hoeven doen.
Nu weet ik dat je fouten niet hoeft te verbergen om sterk te zijn.
De volgende keer zou ik het zeker anders doen.</pre>`,
    questions: [
      { type: "qcm", q: "« had ik het anders moeten aanpakken » exprime…", opts: ["un projet futur", "un regret (j'aurais dû m'y prendre autrement)", "une permission", "une capacité présente"], a: 1, exp: "had moeten aanpakken = aurait dû (regret)." },
      { type: "input", q: "Complète : « dat had ik nooit ___ denken » (avoir le droit → modal à l'infinitif)", a: ["mogen"], ph: "modal", exp: "had nooit mogen denken = je n'aurais jamais dû penser cela." },
      { type: "qcm", q: "« Als ik toen beter had geluisterd, zou het project geslaagd zijn » est…", opts: ["un conditionnel présent", "un conditionnel passé (irréel du passé)", "un futur", "un impératif"], a: 1, exp: "had geluisterd + zou … geslaagd zijn = si j'avais écouté, aurait réussi." },
      { type: "qcm", q: "« dat had ik niet hoeven doen » signifie…", opts: ["je devais le faire", "je n'aurais pas eu besoin de le faire", "je le referai", "je n'ai pas le droit"], a: 1, exp: "had niet hoeven doen = absence de nécessité passée." },
      { type: "input", q: "Conditionnel : « De volgende keer ___ ik het zeker anders doen. » (auxiliaire)", a: ["zou"], ph: "auxiliaire", exp: "zou … doen = je le ferais (conditionnel présent)." }
    ],
    solution: `<p>Traduction : « Avec le recul, j'aurais dû m'y prendre autrement. J'aurais dû demander de l'aide bien plus tôt, mais je n'osais pas. Je pensais que je pouvais tout faire seul, et je n'aurais jamais dû penser cela. Si j'avais mieux écouté à l'époque, le projet aurait réussi. Mes collègues auraient pu m'aider, si seulement je l'avais demandé. J'ai trop longtemps attendu, et je n'aurais pas eu besoin de le faire. Maintenant je sais qu'on n'a pas besoin de cacher ses erreurs pour être fort. La prochaine fois, je m'y prendrais sûrement autrement. »</p>
<p>Ce texte est un catalogue du regret : <strong>had moeten aanpakken/vragen</strong> (aurait dû), <strong>had nooit mogen denken</strong> (n'aurait jamais dû), <strong>hadden kunnen helpen</strong> (auraient pu), <strong>had niet hoeven doen</strong> (pas eu besoin de). Le conditionnel passé <strong>had geluisterd → zou geslaagd zijn</strong> exprime l'irréel du passé. Note le double infinitif partout et l'auxiliaire hebben. C'est le registre de la réflexion mature.</p>`
  }
};
</script>

    solution: "Achteraf gezien had ik mijn examen veel beter moeten voorbereiden. Ik heb wekenlang uitgesteld, en dat had ik niet mogen doen. Ik had veel eerder met studeren kunnen beginnen, maar ik dacht dat ik nog tijd genoeg had. Op de dag zelf heb ik niet helder kunnen nadenken door de stress. Als ik rustiger had geslapen, zou ik meer vragen goed hebben beantwoord. Mijn vrienden hadden me kunnen helpen, als ik het maar had gevraagd. Nu weet ik dat je op tijd om steun mag vragen. De volgende keer zou ik het zeker anders aanpakken.\n\nTraduction : Avec le recul, j'aurais dû bien mieux préparer mon examen. J'ai reporté pendant des semaines, et je n'aurais pas dû le faire. J'aurais pu commencer à étudier bien plus tôt, mais je pensais avoir encore assez de temps. Le jour même, je n'ai pas pu réfléchir clairement à cause du stress. Si j'avais dormi plus tranquillement, j'aurais mieux répondu à davantage de questions. Mes amis auraient pu m'aider, si seulement je l'avais demandé. Maintenant je sais qu'on a le droit de demander du soutien à temps. La prochaine fois, je m'y prendrais sûrement autrement.",

};
