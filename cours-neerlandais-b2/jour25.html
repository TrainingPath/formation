<h3>1. Négocier — onderhandelen</h3>
<p>Négocier, c'est chercher un accord (<strong>een akkoord</strong>) qui satisfait les deux parties. Le vocabulaire de base :</p>
<pre class="pseudo">het voorstel      la proposition    het compromis    le compromis
de voorwaarde     la condition      de eis           l'exigence
toegeven          céder             tegemoetkomen    aller vers, satisfaire
onderhandelen over négocier sur      een deal sluiten conclure un accord</pre>
<h3>2. Faire une proposition</h3>
<pre class="pseudo">Ik stel voor dat…            Je propose que…
Wat vindt u van…?            Que pensez-vous de… ?
Zullen we afspreken dat…?    Pouvons-nous convenir que… ?
Ik zou willen voorstellen om…  J'aimerais proposer de…</pre>
<h3>3. Poser ses conditions et négocier</h3>
<pre class="pseudo">Op voorwaarde dat…           À condition que…
Als u … , dan …              Si vous… , alors…
In ruil daarvoor…            En échange…
Ik kan akkoord gaan, mits…   Je peux accepter, à condition que…
Laten we elkaar tegemoetkomen. Faisons un pas l'un vers l'autre.</pre>
<div class="tip">La formule gagnante du compromis : <strong>« Als u X, dan Y »</strong>. « Als u de prijs verlaagt, dan bestel ik meer » (Si vous baissez le prix, alors je commande plus). On lie une concession à une contrepartie.</div>
<h3>4. Convaincre — overtuigen</h3>
<pre class="pseudo">Het grote voordeel is dat…   Le grand avantage est que…
Denk eens aan…               Pensez donc à…
Stel u voor dat…             Imaginez que…
Dat bespaart u tijd en geld. Cela vous fait gagner du temps et de l'argent.
Daar profiteert iedereen van. Tout le monde en profite.</pre>
<div class="warn">Restez courtois même en désaccord : « Ik begrijp uw standpunt, maar… » ouvre la porte à la suite. Un ton agressif fait échouer la négociation.</div>`,

    ],
    solution: `<p>Traduction : Client : « Je suis intéressé par cinq cents pièces, mais le prix est trop élevé. » Fournisseur : « Je comprends votre point. Que proposez-vous ? » Client : « Si vous baissez le prix de dix pour cent, alors je passe commande tout de suite. » Fournisseur : « Dix pour cent, c'est beaucoup. Je peux accepter cinq pour cent, à condition que vous payiez sous une semaine. » Client : « Faisons un pas l'un vers l'autre : huit pour cent de remise et paiement sous dix jours. » Fournisseur : « Convenu. Nous avons un accord. »</p>
<p>Une négociation réussie : reconnaître l'autre (<strong>ik begrijp uw punt</strong>), proposer un échange (<strong>als u… dan…</strong>), poser une condition (<strong>mits</strong>) et chercher le compromis (<strong>elkaar tegemoetkomen</strong>).</p>`
