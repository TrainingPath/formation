<script>
var DAY = {
  num: 4,
  title: "Les participes employés comme adjectifs",
  subtitle: "Transformer un verbe en adjectif : participe passé et participe présent, avec accord.",
  theory: `
<h3>1. Deux participes, deux sens</h3>
<p>Un participe peut jouer le rôle d'un adjectif placé devant le nom. Le néerlandais en distingue deux :</p>
<ul>
<li>Le <strong>participe passé</strong> (voltooid deelwoord) exprime une action <em>subie / achevée</em> : <strong>een gesloten deur</strong> = une porte fermée.</li>
<li>Le <strong>participe présent</strong> (tegenwoordig deelwoord), en <strong>-end(e)</strong>, exprime une action <em>en cours / active</em> : <strong>een lachend kind</strong> = un enfant riant (qui rit).</li>
</ul>
<pre class="pseudo">gebroken glas          du verre brisé        (participe passé, subi)
de gekozen oplossing   la solution choisie   (participe passé, subi)
een groeiende stad     une ville croissante  (participe présent, actif)
de komende week        la semaine à venir    (participe présent, actif)</pre>
<h3>2. La formation du participe présent</h3>
<p>Très simple : infinitif + <strong>-d</strong> (souvent noté -end après le radical) → <strong>lopen → lopend</strong>, <strong>slapen → slapend</strong>, <strong>zingen → zingend</strong>. Comme adjectif épithète, il prend souvent un <strong>-e</strong> final : <strong>een slapende baby</strong>, <strong>de spelende kinderen</strong>.</p>
<div class="tip">Le participe présent néerlandais n'a PAS la valeur progressive de l'anglais « -ing ». « Je suis en train de lire » n'est jamais « Ik ben lezend » ; on dit « Ik ben aan het lezen ». Le participe présent sert surtout d'adjectif ou d'adverbe.</div>
<h3>3. L'accord de l'adjectif participe</h3>
<p>Un participe épithète suit les règles d'accord normales de l'adjectif : il prend <strong>-e</strong> sauf devant un nom neutre (het-woord) indéfini au singulier.</p>
<pre class="pseudo">de gesloten deur        (de-woord)            → -en reste
een gesloten raam       (het-woord indéfini)  → pas de -e supplémentaire ici
het gebroken glas       (het-woord défini)    → gebroken (participe en -en invariable)
een lachend kind        (het-woord indéfini)  → lachend (sans -e)
een lachende vrouw      (de-woord)            → lachende (avec -e)</pre>
<p>Les participes passés en <strong>-en</strong> (gebroken, gesloten, geschreven) ne changent pas. Ceux en <strong>-d/-t</strong> (gemaakt, verkocht) suivent l'accord de l'adjectif : <strong>een gemaakte fout</strong>, <strong>het gemaakte werk</strong>.</p>
<h3>4. Le participe étoffé (uitgebreide bepaling)</h3>
<p>Trait typiquement néerlandais et très soutenu : on peut <strong>insérer des compléments entre l'article et le participe</strong>, là où le français utiliserait une relative. C'est très fréquent à l'écrit formel :</p>
<pre class="pseudo">de door de directeur genomen beslissing
= la décision prise par le directeur

het in 1830 gestichte land
= le pays fondé en 1830

een goed doordacht plan
= un plan bien réfléchi</pre>
<div class="warn">À la lecture, le francophone se perd dans ces longs groupes. Repère l'article au début et le participe juste avant le nom : tout ce qui est au milieu est un complément. « de [door de directeur genomen] beslissing » se déplie en « la décision [prise par le directeur] ».</div>`,
  exercises: [
    { type: "qcm", q: "« een gesloten deur » emploie un participe…", opts: ["présent (action en cours)", "passé (action subie/achevée)", "futur", "impératif"], a: 1, exp: "gesloten = participe passé : une porte fermée (état subi)." },
    { type: "qcm", q: "Le participe présent se forme avec la terminaison…", opts: ["-ge", "-end / -d", "-te", "-en"], a: 1, exp: "infinitif + d : lopend, slapend, zingend." },
    { type: "input", q: "Forme le participe présent de « slapen » : een ___ baby (qui dort)", a: ["slapende"], ph: "participe présent + e", exp: "slapen → slapend → slapende (accord de-woord)." },
    { type: "vf", q: "« Ik ben lezend » est la bonne façon de dire « je suis en train de lire ».", a: false, exp: "Faux : on dit « Ik ben aan het lezen ». Le participe présent n'a pas de valeur progressive." },
    { type: "qcm", q: "« de komende week » signifie…", opts: ["la semaine passée", "la semaine à venir", "chaque semaine", "cette semaine-ci"], a: 1, exp: "komend = participe présent : à venir." },
    { type: "input", q: "Accord : « de ___ kinderen » (participe présent de spelen, jouer)", a: ["spelende"], ph: "participe + accord", exp: "spelen → spelend → spelende (de-woord pluriel)." },
    { type: "qcm", q: "Quels participes passés restent invariables comme adjectifs ?", opts: ["ceux en -d/-t", "ceux en -en (gebroken, gesloten)", "tous les participes", "aucun"], a: 1, exp: "Les participes en -en ne prennent pas de -e supplémentaire." },
    { type: "input", q: "Accord d'un participe en -t : « een ___ fout » (gemaakt, de-woord)", a: ["gemaakte"], ph: "participe + e", exp: "gemaakt → gemaakte (accord normal de l'adjectif)." },
    { type: "vf", q: "« het gebroken glas » est correct : gebroken ne prend pas de -e.", a: true, exp: "Participe en -en, invariable comme adjectif." },
    { type: "qcm", q: "« de door de directeur genomen beslissing » se traduit par…", opts: ["la décision qui prend le directeur", "la décision prise par le directeur", "le directeur décide", "la décision du directeur seul"], a: 1, exp: "Participe étoffé : la décision [prise par le directeur]." },
    { type: "input", q: "Traduis « un plan bien réfléchi » : « een goed ___ plan » (doordenken)", a: ["doordacht"], ph: "participe passé", exp: "doordacht = participe passé de doordenken." },
    { type: "qcm", q: "Dans « het in 1830 gestichte land », quel mot est le participe ?", opts: ["in", "1830", "gestichte", "land"], a: 2, exp: "gestichte (de stichten, fonder) : le pays fondé en 1830." },
    { type: "vf", q: "Un participe présent peut aussi servir d'adverbe (lachend binnenkomen = entrer en riant).", a: true, exp: "Comme adverbe il est invariable : lachend, zingend." },
    { type: "qcm", q: "Compréhension : « een groeiend probleem ». De quoi parle-t-on ?", opts: ["un problème résolu", "un problème qui grandit", "un problème passé", "un petit problème"], a: 1, exp: "groeiend = participe présent : un problème croissant." },
    { type: "qcm", q: "Compréhension : « de pas verschenen roman » (verschijnen = paraître). Le roman…", opts: ["va bientôt paraître", "vient de paraître", "ne paraîtra jamais", "est épuisé"], a: 1, exp: "pas verschenen = qui vient de paraître (participe passé étoffé)." }
  ],
  final: {
    title: "Exercice final — Een tentoonstelling",
    intro: `<p>Ce texte descriptif abonde en participes-adjectifs. Lis-le, puis réponds :</p>
<pre class="pseudo">In het pas geopende museum trekt een indrukwekkende tentoonstelling
veel bezoekers. Centraal staat een door een jonge kunstenaar geschilderd
werk dat de groeiende spanning in de moderne samenleving verbeeldt.
Rondom hangen zorgvuldig gekozen foto's van spelende kinderen en
werkende mensen. De in de negentiende eeuw gebouwde zalen passen
verrassend goed bij de hedendaagse kunst. Glimlachende gidsen leiden
de geboeide bezoekers rond en beantwoorden hun vragen. De onlangs
gerestaureerde gevel trekt zelfs voorbijgangers naar binnen.
Het is een zorgvuldig doordacht geheel dat nog lang zal nawerken.</pre>`,
    questions: [
      { type: "qcm", q: "« het pas geopende museum » : le musée…", opts: ["va ouvrir", "vient d'ouvrir", "est fermé", "sera rénové"], a: 1, exp: "pas geopende = qui vient d'être ouvert (participe passé)." },
      { type: "input", q: "Dans « een door een jonge kunstenaar geschilderd werk », quel est le participe-clé ?", a: ["geschilderd"], ph: "participe", exp: "geschilderd (schilderen) : l'œuvre peinte par un jeune artiste." },
      { type: "qcm", q: "« spelende kinderen » et « werkende mensen » sont des participes…", opts: ["passés (subis)", "présents (actifs)", "futurs", "impératifs"], a: 1, exp: "participes présents en -end : des enfants qui jouent, des gens qui travaillent." },
      { type: "qcm", q: "« de in de negentiende eeuw gebouwde zalen » : ces salles…", opts: ["seront construites", "ont été construites au XIXe siècle", "sont détruites", "sont en construction"], a: 1, exp: "gebouwde = participe passé étoffé : construites au XIXe siècle." },
      { type: "input", q: "Relève le participe présent qualifiant les guides : « ___ gidsen » (qui sourient)", a: ["glimlachende"], ph: "participe présent + e", exp: "glimlachen → glimlachend → glimlachende (de-woord pluriel)." }
    ],
    solution: `<p>Traduction : « Dans le musée récemment ouvert, une exposition impressionnante attire de nombreux visiteurs. Au centre trône une œuvre peinte par un jeune artiste, qui représente la tension croissante dans la société moderne. Tout autour sont accrochées des photos soigneusement choisies d'enfants qui jouent et de gens qui travaillent. Les salles construites au XIXe siècle s'accordent étonnamment bien avec l'art contemporain. Des guides souriants font visiter aux visiteurs captivés et répondent à leurs questions. La façade récemment restaurée attire même les passants à l'intérieur. C'est un ensemble soigneusement réfléchi qui continuera longtemps de résonner. »</p>
<p>Repère les deux familles : les <strong>participes présents</strong> (groeiende, spelende, werkende, glimlachende) décrivent des actions en cours, tandis que les <strong>participes passés</strong> (geopende, geschilderd, gekozen, gebouwde, gerestaureerde, doordacht) décrivent des états résultant d'une action subie. Les groupes étoffés (« door een jonge kunstenaar geschilderd », « in de negentiende eeuw gebouwde ») remplacent des relatives françaises.</p>`
  }
};
</script>

  { id: "nl-b2-j04", title: "Décrire un lieu", level: 3,
    statement: "Décris un lieu (musée, quartier, gare, parc… 7 à 9 phrases) en utilisant au moins trois participes passés adjectifs, deux participes présents et un groupe participial étoffé (article + complément + participe + nom).",
    hints: [
      "Participes présents actifs : spelende, werkende, groeiende, glimlachende…",
      "Participes passés subis : gebouwd, gerestaureerd, gekozen, geopend…",
      "Étoffe un groupe : « de door … gebouwde … » ou « het in … opgerichte … »."
    ],
    solution: "In de onlangs gerenoveerde stationshal lopen elke ochtend haastende reizigers voorbij. De in de jaren dertig gebouwde gevel is met zorg gerestaureerd en straalt weer als vroeger. Onder de grote klok wachten glimlachende mensen op hun geliefden. Een door een lokale kunstenaar gemaakt schilderij siert de centrale muur. Spelende kinderen rennen tussen de gekozen zitbanken door. De pas geopende koffiebar trekt veel voorbijgangers aan. Het is een levendige, goed doordachte ruimte die de groeiende stad perfect weerspiegelt.\n\nTraduction : Dans le hall de gare récemment rénové, des voyageurs pressés passent chaque matin. La façade construite dans les années trente a été restaurée avec soin et rayonne à nouveau comme autrefois. Sous la grande horloge, des gens souriants attendent leurs proches. Un tableau réalisé par un artiste local orne le mur central. Des enfants qui jouent courent entre les bancs choisis. Le café récemment ouvert attire beaucoup de passants. C'est un espace vivant et bien pensé qui reflète parfaitement la ville en pleine croissance.",
    note: "Distingue toujours le sens : participe présent = l'action est en cours et le nom la fait (haastende reizigers) ; participe passé = l'action est subie et achevée (gerenoveerde hal). Pour le groupe étoffé, garde l'ordre article … complément … participe … nom." }
  ]
};
