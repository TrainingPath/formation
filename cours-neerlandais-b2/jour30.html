<script>
var DAY = {
  num: 30,
  title: "Projet final (4) : conversation fluide de 15 minutes",
  subtitle: "La trame complète d'une conversation B2 : small talk, sujets, opinions, clôture.",
  theory: `
<h3>Le projet final — tenir une conversation de 15 minutes</h3>
<p>Voici le dernier projet, le sommet du parcours : soutenir une <strong>conversation fluide de 15 minutes</strong> en néerlandais sans bloquer. Le secret n'est pas de tout savoir, mais de savoir <strong>relancer</strong>, <strong>gagner du temps</strong> et <strong>rebondir</strong>. Tu vas apprendre une trame en quatre phases, une banque de relances, des « gap-fillers » (mots pour meubler), et un auto-bilan B2.</p>
<div class="tip">Aide lexicale — de woordenlijst :<br>
het gesprek = la conversation · vlot praten = parler avec aisance · de smalltalk / de koetjes en kalfjes = les banalités · het onderwerp = le sujet · van onderwerp veranderen = changer de sujet · de mening = l'opinion · doorvragen = poser une question de relance · afronden = clôturer · aarzelen = hésiter · vloeiend = fluide · de stopwoordjes = les mots de remplissage.</div>
<h3>De vier fasen van een gesprek — les quatre phases</h3>
<div class="tip"><strong>1. Small talk (koetjes en kalfjes) :</strong> Hoe gaat het met je ? · Wat een weer, hè ? · Heb je een leuk weekend gehad ?<br>
<strong>2. Onderwerpen (les sujets) :</strong> Wat doe je in je vrije tijd ? · Heb je onlangs een goede film of serie gezien ? · Hoe bevalt je werk of studie ?<br>
<strong>3. Meningen (les opinions) :</strong> Wat vind jij daarvan ? · Ben je het daarmee eens ? · Ik zie dat een beetje anders, want…<br>
<strong>4. Afronden (la clôture) :</strong> Het was echt leuk om met je te praten. · We moeten snel weer eens afspreken. · Tot de volgende keer !</div>
<h3>Doorvragen — la banque de relances</h3>
<p>Une conversation vit grâce aux relances. Au lieu de laisser un silence tomber, rebondis :</p>
<div class="tip">O ja ? Vertel eens meer ! = Ah oui ? Raconte ! · Hoezo ? / Waarom dan ? = Comment ça ? Pourquoi ? · Wat bedoel je precies ? = Que veux-tu dire exactement ? · En wat gebeurde er toen ? = Et que s'est-il passé alors ? · Dat klinkt interessant ! = Ça a l'air intéressant ! · En jij, wat denk jij ervan ? = Et toi, qu'en penses-tu ? (renvoyer la balle)</div>
<h3>Gap-fillers — meubler et gagner du temps</h3>
<p>Quand tu cherches tes mots, ne te tais pas : utilise ces petits mots très néerlandais qui rendent le discours naturel et te laissent le temps de penser.</p>
<div class="tip"><strong>nou…</strong> = eh bien… (pour démarrer) · <strong>eigenlijk</strong> = en fait · <strong>ik bedoel…</strong> = je veux dire… (pour reformuler) · <strong>hoe zal ik het zeggen…</strong> = comment dire… · <strong>even denken…</strong> = laisse-moi réfléchir… · <strong>weet je</strong> = tu sais · <strong>zeg maar</strong> = disons · <strong>dus</strong> = donc.</div>
<div class="tip">Exemple de discours fluide : « Nou, eigenlijk vind ik dat een moeilijke vraag. Even denken… Ik bedoel, het hangt er een beetje van af, weet je. Maar zeg maar, over het algemeen ben ik het daar wel mee eens. »</div>
<h3>Sortir d'un blocage</h3>
<div class="tip">Hoe zeg je dat ook alweer ? = comment dit-on déjà ? · Ik weet even het woord niet, maar het is zoiets als… = je ne trouve pas le mot, mais c'est comme… · Kun je dat herhalen, alsjeblieft ? = peux-tu répéter ? · Sorry, ik was even de draad kwijt = pardon, j'ai perdu le fil.</div>
<h3>Zelfevaluatie B2 — auto-bilan</h3>
<div class="warn">Après ta conversation, coche mentalement : (1) Ai-je parlé sans traduire mot à mot ? (2) Ai-je relancé au moins 3 fois (doorvragen) ? (3) Ai-je exprimé et justifié une opinion (« ik vind… want… ») ? (4) Ai-je géré un blocage sans passer au français ? (5) Ai-je varié les temps (passé, présent, futur) ? Trois « oui » sur cinq = niveau B2 en construction ; cinq sur cinq = B2 solide. Félicitations, tu es au bout du parcours !</div>`,
  exercises: [
    { type: "qcm", q: "Combien de phases structurent une conversation selon la leçon ?", opts: ["deux", "trois", "quatre", "cinq"], a: 2, exp: "Small talk, onderwerpen, meningen, afronden." },
    { type: "input", q: "Comment appelle-t-on familièrement le small talk en néerlandais ? « koetjes en ___ »", a: ["kalfjes"], ph: "un mot", exp: "koetjes en kalfjes = les banalités." },
    { type: "qcm", q: "Quel est le rôle des gap-fillers (nou, eigenlijk, ik bedoel) ?", opts: ["impressionner le recruteur", "gagner du temps et rester naturel", "corriger la grammaire", "terminer la conversation"], a: 1, exp: "Meubler sans se taire, gagner du temps." },
    { type: "input", q: "Quel petit mot signifie « en fait » ?", a: ["eigenlijk"], ph: "un mot", exp: "eigenlijk = en fait." },
    { type: "qcm", q: "Que signifie « ik bedoel… » ?", opts: ["je pense", "je veux dire… (pour reformuler)", "je termine", "je ne sais pas"], a: 1, exp: "ik bedoel = je veux dire (reformuler)." },
    { type: "qcm", q: "Quelle phrase est une RELANCE (doorvragen) ?", opts: ["« Tot de volgende keer ! »", "« O ja ? Vertel eens meer ! »", "« Wat een weer, hè ? »", "« Ik dank u. »"], a: 1, exp: "Une relance invite l'autre à continuer." },
    { type: "input", q: "Pour renvoyer la balle : « En jij, wat denk jij ___ ? » (à ce sujet)", a: ["ervan"], ph: "un mot", exp: "Wat denk jij ervan ? = qu'en penses-tu ?" },
    { type: "vf", q: "En cas de blocage, il vaut mieux se taire complètement plutôt que d'utiliser un gap-filler.", a: false, exp: "Faux : les gap-fillers évitent le silence gênant." },
    { type: "qcm", q: "Comment exprimer un désaccord poli ?", opts: ["« Dat is fout. »", "« Ik zie dat een beetje anders, want… »", "« Nee, punt. »", "« Onzin. »"], a: 1, exp: "Nuancer : ik zie dat anders, want…" },
    { type: "input", q: "Pour demander de répéter : « Kun je dat ___, alsjeblieft ? » (répéter)", a: ["herhalen"], ph: "un verbe", exp: "Kun je dat herhalen ?" },
    { type: "qcm", q: "Quelle phrase sert à CLÔTURER (afronden) la conversation ?", opts: ["« Hoezo ? »", "« Het was echt leuk om met je te praten. »", "« Vertel eens meer. »", "« Even denken… »"], a: 1, exp: "Une formule de clôture chaleureuse." },
    { type: "input", q: "« J'ai perdu le fil » se dit : « Sorry, ik was even de ___ kwijt. » (fil)", a: ["draad"], ph: "un nom", exp: "de draad kwijt zijn = perdre le fil." },
    { type: "qcm", q: "Quel critère fait partie de l'auto-bilan B2 ?", opts: ["parler très vite", "avoir relancé au moins 3 fois", "utiliser des mots anglais", "ne jamais faire de pause"], a: 1, exp: "Doorvragen (relancer) est un signe de fluidité." },
    { type: "qcm", q: "Que signifie « vloeiend praten » ?", opts: ["parler fort", "parler avec fluidité", "parler lentement", "parler bas"], a: 1, exp: "vloeiend = fluide." },
    { type: "vf", q: "Gérer un blocage sans revenir au français est un bon signe de niveau B2.", a: true, exp: "Rester en néerlandais malgré la difficulté = B2." }
  ],
  final: {
    title: "Exercice final — Jouw gesprek van 15 minuten",
    intro: `<p>Dernière épreuve du parcours : simule mentalement (ou avec un partenaire) une conversation de 15 minutes. Voici la trame à suivre.</p>
<pre class="pseudo">Draaiboek van het gesprek:
1. Small talk (2 min): begroeting + koetjes en kalfjes.
2. Onderwerpen (6 min): vrije tijd, werk, reizen, films...
3. Meningen (5 min): stel vragen + geef je mening met 'want'.
4. Afronden (2 min): bedank en spreek af.
Gebruik doorvragen + stopwoordjes (nou, eigenlijk, ik bedoel).</pre>`,
    questions: [
      { type: "qcm", q: "Par quelle phase commencer la conversation ?", opts: ["les opinions", "le small talk", "la clôture", "le débat"], a: 1, exp: "On démarre toujours par le small talk." },
      { type: "input", q: "Un gap-filler pour démarrer une phrase quand tu cherches tes mots : « ___, eigenlijk vind ik… »", a: ["nou"], ph: "un mot", exp: "Nou… = eh bien…" },
      { type: "qcm", q: "Comment justifier une opinion au niveau B2 ?", opts: ["dire seulement « ja » ou « nee »", "utiliser « ik vind… want… » avec une raison", "parler d'autre chose", "répéter la question"], a: 1, exp: "Opinion + justification avec 'want'." },
      { type: "input", q: "Pour relancer l'autre après une histoire : « En wat gebeurde er ___ ? » (alors)", a: ["toen"], ph: "un mot", exp: "En wat gebeurde er toen ?" },
      { type: "qcm", q: "Quel est le meilleur réflexe si tu ne trouves pas un mot ?", opts: ["passer au français", "te taire jusqu'à le retrouver", "décrire l'idée : « het is zoiets als… »", "arrêter la conversation"], a: 2, exp: "Contourner : « het is zoiets als… »." }
    ],
    solution: `<p>Une conversation de 15 minutes réussie ne repose pas sur un vocabulaire parfait, mais sur la <strong>gestion du flux</strong> : ouvrir par du small talk, développer 2 ou 3 sujets, échanger des opinions justifiées (« ik vind… want… »), et clôturer chaleureusement. Entre les deux, tu relances (doorvragen), tu meubles avec des gap-fillers (nou, eigenlijk, ik bedoel) et tu contournes les blocages (« het is zoiets als… ») au lieu de repasser au français.</p>
<p>C'est l'aboutissement du niveau B2 : communiquer avec aisance et spontanéité, faire face aux imprévus d'une vraie conversation, et exprimer un point de vue nuancé. Bravo — tu as terminé les 30 jours. Continue à parler le plus souvent possible : la fluidité s'entretient comme un muscle.</p>`
  }
};
</script>

<script>

  items: [
  { id: "nl-b2-j30", title: "Préparer ton monologue de présentation", level: 3,
    statement: "Prépare par écrit, en néerlandais (8 à 10 phrases), un monologue de présentation que tu pourrais dire au début d'une conversation : qui tu es, ce que tu fais, tes centres d'intérêt, une opinion personnelle justifiée, et une question pour lancer l'échange. Intègre au moins deux gap-fillers (nou, eigenlijk, ik bedoel).",
    hints: [
      "Commence par « Nou, ik zal me even voorstellen. Ik ben… ».",
      "Ajoute une opinion justifiée : « Ik vind… want… ».",
      "Termine par une question ouverte pour relancer : « En jij, … ? »."
    ],
    solution: "Nou, ik zal me even voorstellen. Ik ben Amina, ik ben zesentwintig jaar en ik woon in Antwerpen. Eigenlijk werk ik als verpleegkundige, maar in mijn vrije tijd hou ik vooral van koken en wandelen in de natuur. Ik ben ook een echte filmliefhebber, weet je. Ik bedoel, ik kan een heel weekend naar oude films kijken zonder me te vervelen. Wat talen betreft, leer ik nu Nederlands omdat ik het een mooie en nuttige taal vind, want ik werk vaak met Nederlandstalige patiënten. Volgens mij is het belangrijk om de taal van je collega's te spreken, want dat schept vertrouwen. Ik zou graag mijn spreekvaardigheid nog verbeteren. En jij, wat doe jij zoal in je vrije tijd ?\n\nTraduction : Eh bien, je vais me présenter brièvement. Je suis Amina, j'ai vingt-six ans et j'habite à Anvers. En fait, je travaille comme infirmière, mais pendant mon temps libre j'aime surtout cuisiner et me promener dans la nature. Je suis aussi une vraie amatrice de films, tu sais. Je veux dire, je peux regarder de vieux films tout un week-end sans m'ennuyer. En ce qui concerne les langues, j'apprends le néerlandais parce que je le trouve beau et utile, car je travaille souvent avec des patients néerlandophones. Selon moi, il est important de parler la langue de ses collègues, car cela crée de la confiance. J'aimerais encore améliorer mon aisance à l'oral. Et toi, que fais-tu pendant ton temps libre ?",
    note: "Un bon monologue d'ouverture reste court, personnel et se termine par une question qui passe la parole. Répète-le à voix haute jusqu'à ce qu'il soit naturel : c'est ta rampe de lancement pour toute conversation." }
  ]
};
