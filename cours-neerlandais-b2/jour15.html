<script>
var DAY = {
  num: 15,
  title: "L'entretien d'embauche approfondi (méthode STAR)",
  subtitle: "Structurer ses réponses d'entretien : Situatie, Taak, Actie, Resultaat, avec exemples en néerlandais.",
  theory: `
<h3>1. L'entretien d'embauche (het sollicitatiegesprek)</h3>
<p>Après la lettre vient l'entretien : <strong>het sollicitatiegesprek</strong>. Le recruteur (de recruiter / de werkgever) pose des questions comportementales (gedragsvragen) du type « Vertel eens over een situatie waarin… » (« Racontez une situation où… »). Pour y répondre de façon claire et convaincante, on utilise la <strong>méthode STAR</strong>.</p>
<pre class="pseudo">S  Situatie    la situation : le contexte
T  Taak        la tâche : ton rôle, ton objectif
A  Actie       l'action : ce que TU as concrètement fait
R  Resultaat   le résultat : l'issue, le bilan chiffré si possible</pre>
<div class="tip">STAR transforme une réponse floue en récit structuré. Au lieu de « Ik ben een teamplayer », on <em>montre</em> une situation concrète où l'on a agi en équipe et obtenu un résultat.</div>
<h3>2. S — Situatie (le contexte)</h3>
<p>On plante le décor en une ou deux phrases : où, quand, quel problème. On reste bref et factuel :</p>
<pre class="pseudo">In mijn vorige baan kregen we plotseling een grote bestelling binnen.
Dans mon précédent emploi, nous avons soudain reçu une grosse commande.

Tijdens een project liep de planning ernstig uit.
Lors d'un projet, le planning a pris un retard important.</pre>
<h3>3. T — Taak (la tâche)</h3>
<p>On précise son rôle et son objectif dans cette situation. Le recruteur veut savoir ce qui dépendait de <em>vous</em> :</p>
<pre class="pseudo">Mijn taak was om het team op tijd klaar te krijgen.
Ma tâche était de préparer l'équipe à temps.

Ik was verantwoordelijk voor de communicatie met de klant.
J'étais responsable de la communication avec le client.</pre>
<div class="warn">Ne confonds pas <strong>Taak</strong> (ce que tu devais faire) et <strong>Actie</strong> (ce que tu as fait). La Taak = l'objectif/le rôle ; l'Actie = les gestes concrets. Beaucoup de candidats sautent la Taak : garde-la, elle donne du sens à l'action.</div>
<h3>4. A — Actie (l'action)</h3>
<p>C'est le cœur : ce que TU as fait, à la première personne (ik), avec des verbes d'action. Évite le « we » qui dilue ta contribution :</p>
<pre class="pseudo">Ik heb meteen de taken opnieuw verdeeld en prioriteiten gesteld.
J'ai aussitôt réparti les tâches et fixé des priorités.

Ik heb de klant proactief geïnformeerd en een nieuwe planning voorgesteld.
J'ai informé le client de façon proactive et proposé un nouveau planning.

Vervolgens heb ik dagelijks de voortgang gecontroleerd.
Ensuite, j'ai contrôlé l'avancement chaque jour.</pre>
<h3>5. R — Resultaat (le résultat)</h3>
<p>On conclut par l'issue, si possible mesurable, et par ce qu'on en a retenu (l'apprentissage) :</p>
<pre class="pseudo">Dankzij deze aanpak hebben we de deadline gehaald.
Grâce à cette approche, nous avons respecté le délai.

De klant was zeer tevreden en heeft opnieuw een opdracht geplaatst.
Le client était très satisfait et a repassé une commande.

Hieruit heb ik geleerd hoe belangrijk duidelijke communicatie is.
J'en ai appris combien une communication claire est importante.</pre>
<h3>6. Questions fréquentes et formules utiles</h3>
<p>Le recruteur enchaîne souvent des questions classiques. Anticipe-les avec des réponses STAR :</p>
<pre class="pseudo">Vertel eens iets over uzelf.        Parlez-moi de vous.
Wat zijn uw sterke punten?          Quels sont vos points forts ?
Wat is uw grootste zwakte?          Quelle est votre plus grande faiblesse ?
Waarom wilt u hier werken?          Pourquoi voulez-vous travailler ici ?
Beschrijf een moeilijke situatie.   Décrivez une situation difficile.
Waar ziet u zichzelf over vijf jaar?  Où vous voyez-vous dans cinq ans ?</pre>
<div class="tip">Pour la « zwakte » (faiblesse), choisis un point réel mais montre comment tu y travailles : « Ik ben soms te perfectionistisch, maar ik leer nu beter te delegeren » (Je suis parfois trop perfectionniste, mais j'apprends à déléguer). La structure STAR + une touche d'auto-réflexion : voilà le niveau B2 à l'oral professionnel.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme STAR ?", opts: ["Snel, Tactisch, Actief, Resultaat", "Situatie, Taak, Actie, Resultaat", "Studie, Team, Ambitie, Rol", "Situatie, Toon, Antwoord, Reactie"], a: 1, exp: "STAR = Situatie, Taak, Actie, Resultaat." },
    { type: "qcm", q: "Comment se dit « l'entretien d'embauche » en néerlandais ?", opts: ["de sollicitatiebrief", "het sollicitatiegesprek", "de vacature", "het cv"], a: 1, exp: "het sollicitatiegesprek = l'entretien d'embauche." },
    { type: "input", q: "Lettre S de STAR : « ___ » = le contexte, la situation.", a: ["situatie"], ph: "un mot", exp: "S = Situatie (le contexte)." },
    { type: "input", q: "Lettre R de STAR : « ___ » = le résultat obtenu.", a: ["resultaat"], ph: "un mot", exp: "R = Resultaat (le résultat, si possible mesurable)." },
    { type: "qcm", q: "Dans la partie « Actie », on décrit surtout…", opts: ["ce que l'équipe a ressenti", "ce que TU as concrètement fait (ik)", "le salaire proposé", "la météo ce jour-là"], a: 1, exp: "Actie = tes actions concrètes, à la première personne (ik)." },
    { type: "vf", q: "La Taak (tâche) et l'Actie (action) désignent exactement la même chose.", a: false, exp: "La Taak = ton rôle/objectif ; l'Actie = les gestes concrets accomplis." },
    { type: "input", q: "Question d'entretien : « Wat zijn uw sterke ___ ? » (points forts)", a: ["punten"], ph: "un mot", exp: "Wat zijn uw sterke punten? = Quels sont vos points forts ?" },
    { type: "qcm", q: "« Vertel eens iets over uzelf » demande de…", opts: ["parler du salaire", "vous présenter", "critiquer l'entreprise", "donner votre adresse"], a: 1, exp: "Vertel eens iets over uzelf = Parlez-moi de vous." },
    { type: "input", q: "Résultat mesurable : « Dankzij deze aanpak hebben we de deadline ___ . » (respecté / atteint)", a: ["gehaald"], ph: "verbe", exp: "de deadline halen = respecter le délai (gehaald au parfait)." },
    { type: "qcm", q: "Pourquoi éviter le « we » dans la partie Actie ?", opts: ["C'est grammaticalement faux", "Cela dilue ta contribution personnelle", "C'est trop formel", "Cela allonge la phrase"], a: 1, exp: "Le « we » masque ce que TU as fait ; en Actie, privilégie « ik »." },
    { type: "qcm", q: "« Wat is uw grootste zwakte? » interroge sur…", opts: ["votre plus grand atout", "votre plus grande faiblesse", "votre ancien salaire", "vos vacances"], a: 1, exp: "de zwakte = la faiblesse (grootste = la plus grande)." },
    { type: "input", q: "Apprentissage tiré : « Hieruit heb ik ___ hoe belangrijk communicatie is. » (verbe : appris)", a: ["geleerd"], ph: "verbe", exp: "leren → geleerd : Hieruit heb ik geleerd… = J'en ai appris…" },
    { type: "vf", q: "Pour la question sur la faiblesse, il est habile de citer un point réel et de montrer comment on y travaille.", a: true, exp: "Un défaut réel + une démarche d'amélioration = réponse mature (B2)." },
    { type: "qcm", q: "Compréhension : « Mijn taak was om het team op tijd klaar te krijgen. » correspond à quelle lettre de STAR ?", opts: ["Situatie", "Taak", "Actie", "Resultaat"], a: 1, exp: "« Mijn taak was om… » = énoncé de la Taak (le rôle/objectif)." },
    { type: "qcm", q: "Compréhension : « Ik heb meteen de taken opnieuw verdeeld en prioriteiten gesteld. » correspond à…", opts: ["Situatie", "Taak", "Actie", "Resultaat"], a: 2, exp: "Verbes d'action à la 1re personne = la partie Actie." }
  ],
  final: {
    title: "Exercice final — Een STAR-antwoord lezen",
    intro: `<p>Voici une réponse d'entretien construite selon la méthode STAR. Lis-la, repère les quatre étapes, puis réponds :</p>
<pre class="pseudo">Vraag van de recruiter:
Vertel eens over een situatie waarin u onder druk moest presteren.

Antwoord van de sollicitant:
(Situatie) In mijn vorige baan als projectmedewerker viel een collega
onverwacht uit, vlak voor een belangrijke deadline. (Taak) Als coördinator
was het mijn taak om ervoor te zorgen dat het project toch op tijd werd
opgeleverd. (Actie) Ik heb meteen de taken opnieuw verdeeld, duidelijke
prioriteiten gesteld en de klant proactief geïnformeerd over de stand van
zaken. Vervolgens heb ik dagelijks de voortgang gecontroleerd en waar nodig
bijgestuurd. (Resultaat) Dankzij deze aanpak hebben we het project een dag
voor de deadline afgerond en was de klant zeer tevreden. Hieruit heb ik
geleerd hoe belangrijk het is om onder druk kalm te blijven en helder te
communiceren.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle phrase correspond à la Situatie ?", opts: ["Als coördinator was het mijn taak…", "Ik heb meteen de taken opnieuw verdeeld…", "In mijn vorige baan viel een collega onverwacht uit…", "Dankzij deze aanpak hebben we…"], a: 2, exp: "La Situatie plante le contexte : un collègue absent avant la deadline." },
      { type: "input", q: "Par quel mot le candidat annonce-t-il sa Taak ? « Als coördinator was het mijn ___ om… »", a: ["taak"], ph: "un mot", exp: "« het was mijn taak om… » introduit clairement la Taak." },
      { type: "qcm", q: "Dans la partie Actie, à quelle personne parle le candidat ?", opts: ["à la 3e personne (hij)", "à la 1re personne (ik)", "au « we » uniquement", "au passif"], a: 1, exp: "Ik heb… verdeeld / gesteld / geïnformeerd : la 1re personne met en valeur l'action personnelle." },
      { type: "input", q: "Résultat : « Dankzij deze aanpak hebben we het project een dag voor de deadline ___ . » (achevé)", a: ["afgerond"], ph: "verbe", exp: "afronden → afgerond = achever, terminer." },
      { type: "qcm", q: "La dernière phrase (« Hieruit heb ik geleerd… ») ajoute…", opts: ["une nouvelle situation", "l'apprentissage tiré de l'expérience", "une question au recruteur", "une objection"], a: 1, exp: "L'apprentissage clôt le R et montre une réflexion mature." }
    ],
    solution: `<p>Traduction : « Question du recruteur : Racontez-moi une situation où vous avez dû être performant sous pression. — Réponse du candidat : (Situation) Dans mon précédent emploi de collaborateur de projet, un collègue s'est absenté à l'improviste, juste avant une échéance importante. (Tâche) En tant que coordinateur, ma tâche était de veiller à ce que le projet soit tout de même livré à temps. (Action) J'ai aussitôt réparti à nouveau les tâches, fixé des priorités claires et informé le client de façon proactive de l'état des choses. Ensuite, j'ai contrôlé l'avancement chaque jour et rectifié le tir là où c'était nécessaire. (Résultat) Grâce à cette approche, nous avons terminé le projet un jour avant l'échéance et le client était très satisfait. J'en ai appris combien il est important de rester calme sous la pression et de communiquer clairement. »</p>
<p>Décryptage STAR : la <strong>Situatie</strong> (In mijn vorige baan… viel een collega uit) donne le contexte ; la <strong>Taak</strong> (het was mijn taak om…) précise le rôle ; l'<strong>Actie</strong> (Ik heb… verdeeld, gesteld, geïnformeerd, gecontroleerd) détaille les gestes à la 1re personne ; le <strong>Resultaat</strong> (Dankzij deze aanpak hebben we… afgerond) livre l'issue mesurable, complétée par l'apprentissage (Hieruit heb ik geleerd…). Retiens l'ordre et le « ik » de l'Actie : c'est ce qui rend la réponse concrète et convaincante.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en néerlandais…",
  items: [
  { id: "nl-b2-j15", title: "Rédige un antwoord en STAR", level: 3,
    statement: "Prépare une réponse d'entretien en néerlandais (8 à 12 phrases) à la question « Vertel eens over een situatie waarin u een probleem hebt opgelost. » Structure-la explicitement selon STAR : d'abord la Situatie (contexte), puis la Taak (ton rôle), ensuite l'Actie (ce que TU as fait, à la 1re personne, verbes d'action) et enfin le Resultaat (l'issue + un apprentissage). Reste au registre professionnel.",
    hints: [
      "Situatie : In mijn vorige baan… / Tijdens een project…",
      "Taak : Het was mijn taak om… / Ik was verantwoordelijk voor…",
      "Actie (ik !) + Resultaat : Ik heb… Dankzij deze aanpak… Hieruit heb ik geleerd dat…"
    ],
    solution: "Vraag: Vertel eens over een situatie waarin u een probleem hebt opgelost.\n\n(Situatie) In mijn vorige baan als medewerker klantenservice ontstond er een grote achterstand in de afhandeling van klachten na een technische storing. (Taak) Als aanspreekpunt van het team was het mijn taak om de achterstand weg te werken en de klanten tevreden te houden. (Actie) Ik heb eerst de openstaande klachten geordend op urgentie en de meest dringende zelf opgepakt. Vervolgens heb ik met mijn collega's een tijdelijk rooster opgesteld en de klanten proactief geïnformeerd over de vertraging. Ook heb ik een korte handleiding geschreven zodat iedereen de klachten op dezelfde manier afhandelde. (Resultaat) Binnen een week was de achterstand volledig weggewerkt en daalde het aantal klachten met dertig procent. Hieruit heb ik geleerd hoe belangrijk het is om onder druk te structureren en helder te communiceren.\n\nTraduction : « Question : Racontez-moi une situation où vous avez résolu un problème. (Situation) Dans mon précédent emploi d'agent du service clientèle, un important retard s'est accumulé dans le traitement des réclamations après une panne technique. (Tâche) En tant que référent de l'équipe, ma tâche était de résorber le retard et de garder les clients satisfaits. (Action) J'ai d'abord classé les réclamations en attente par ordre d'urgence et pris en charge moi-même les plus pressantes. Ensuite, j'ai établi avec mes collègues un planning temporaire et informé les clients de façon proactive du retard. J'ai aussi rédigé un bref guide pour que chacun traite les réclamations de la même manière. (Résultat) En une semaine, le retard était entièrement résorbé et le nombre de réclamations a baissé de trente pour cent. J'en ai appris combien il est important de structurer et de communiquer clairement sous la pression. »",
    note: "Un bon antwoord STAR se reconnaît à trois choses : les quatre étapes présentes et dans l'ordre, une Actie racontée à la 1re personne (ik heb…), et un Resultaat concret si possible chiffré, complété d'un apprentissage. Prépare deux ou trois récits STAR à l'avance (un succès, un conflit, une erreur) : tu pourras les adapter à presque toutes les gedragsvragen." }
  ]
};
</script>
