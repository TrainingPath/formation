<body>
<script>
var DAY = {
  num: 13,
  title: "Rédiger un texte argumentatif",
  subtitle: "Construire un betoog : thèse, arguments hiérarchisés, connecteurs logiques et conclusion convaincante.",
  theory: `
<h3>1. Qu'est-ce qu'un texte argumentatif ?</h3>
<p>Un texte argumentatif (<strong>een betoog</strong> / een argumentatieve tekst) défend un point de vue et cherche à <em>convaincre</em> le lecteur au moyen d'arguments organisés. Sa force ne vient pas du nombre d'idées, mais de leur agencement logique. On distingue l'introduction (de inleiding), le développement (het middenstuk) et la conclusion (het slot).</p>
<pre class="pseudo">Inleiding    on annonce le sujet et la thèse
Middenstuk   on développe les arguments (pro / contra)
Slot         on conclut et on rappelle la thèse</pre>
<h3>2. La thèse (de stelling)</h3>
<p>La thèse est la position que l'on défend. Elle doit être <strong>claire</strong> et formulée dès l'introduction. On l'annonce souvent par une tournure explicite :</p>
<pre class="pseudo">Ik ben van mening dat…            Je suis d'avis que…
Volgens mij zou…                  Selon moi, … devrait…
Ik ben ervan overtuigd dat…       Je suis convaincu(e) que…
In dit betoog verdedig ik dat…    Dans cet essai je défends que…</pre>
<div class="tip">Une bonne thèse est <strong>discutable</strong> : « Roken is ongezond » (fumer est mauvais pour la santé) n'est pas une thèse mais un fait. « Roken zou overal verboden moeten worden » (fumer devrait être interdit partout) est une thèse, car on peut la contester.</div>
<h3>3. Les arguments (de argumenten)</h3>
<p>Chaque argument défend la thèse et s'appuie sur une justification (une preuve, un exemple, une donnée). On hiérarchise du plus fort au plus faible, ou l'inverse en gardant le meilleur pour la fin :</p>
<pre class="pseudo">Ten eerste…      Premièrement…
Ten tweede…      Deuxièmement…
Bovendien…       En outre…
Daarnaast…       Par ailleurs…
Een voorbeeld hiervan is…   Un exemple en est…
Uit onderzoek blijkt dat…   Des études montrent que…</pre>
<h3>4. Concession et réfutation (tegenwerping en weerlegging)</h3>
<p>Un texte solide anticipe l'objection puis la réfute. On concède d'abord (tegenwerping), puis on renverse (weerlegging). C'est le signe d'une argumentation mûre :</p>
<pre class="pseudo">Sommigen beweren dat…       Certains prétendent que…
Het klopt dat…, maar…       Il est vrai que…, mais…
Hoewel…, toch…              Bien que…, pourtant…
Dit argument gaat echter voorbij aan…   Cet argument néglige toutefois…</pre>
<div class="warn">Attention aux connecteurs d'opposition : <strong>maar</strong> (mais) est neutre, <strong>echter</strong> (cependant) est soutenu et se place souvent après le verbe, <strong>toch</strong> (pourtant) marque une contradiction ressentie. « Het is duur. Het is echter noodzakelijk. »</div>
<h3>5. Les connecteurs logiques (verbindingswoorden)</h3>
<p>Ils tissent le raisonnement et guident le lecteur. Les maîtriser est la clé du niveau B2 :</p>
<pre class="pseudo">Cause      omdat, doordat, aangezien       parce que, du fait que, étant donné que
Conséquence  daardoor, dus, bijgevolg      de ce fait, donc, par conséquent
Addition   bovendien, daarnaast, tevens     en outre, par ailleurs, également
Opposition  maar, echter, daarentegen       mais, cependant, en revanche
Concession  hoewel, ondanks, toch           bien que, malgré, pourtant
But        om te, zodat                     pour, afin que</pre>
<h3>6. La conclusion (de conclusie)</h3>
<p>La conclusion synthétise les arguments et réaffirme la thèse, sans introduire d'idée neuve. On la signale nettement :</p>
<pre class="pseudo">Kortom,…            En bref,…
Al met al,…         Tout compte fait,…
Concluderend kan ik stellen dat…   En conclusion, je peux affirmer que…
Om deze redenen ben ik van mening dat…   Pour ces raisons, je suis d'avis que…</pre>
<div class="tip">Un betoog réussi se relit à l'envers : si l'on ne lit que la thèse et la conclusion, elles doivent se répondre. Entre les deux, chaque paragraphe = un argument + sa justification + un connecteur qui le relie au précédent.</div>`,
  exercises: [
    { type: "qcm", q: "Comment appelle-t-on la position défendue dans un texte argumentatif ?", opts: ["de inleiding", "de stelling", "het slot", "het voorbeeld"], a: 1, exp: "de stelling = la thèse (le point de vue défendu)." },
    { type: "qcm", q: "Quelle formule annonce clairement une thèse ?", opts: ["Ik weet het niet.", "Ik ben van mening dat…", "Misschien is het zo.", "Het regent vandaag."], a: 1, exp: "Ik ben van mening dat… = Je suis d'avis que… (annonce de thèse)." },
    { type: "vf", q: "« Roken is ongezond » est une bonne thèse argumentative.", a: false, exp: "C'est un fait, pas une thèse : une thèse doit être discutable." },
    { type: "input", q: "Connecteur d'énumération (premièrement) : « ___ eerste is het goedkoper. »", a: ["ten"], ph: "un mot", exp: "Ten eerste… = premièrement…" },
    { type: "qcm", q: "Registre soutenu de « parce que / étant donné que » :", opts: ["want", "aangezien", "en", "of"], a: 1, exp: "aangezien = étant donné que (soutenu) ; want est plus neutre." },
    { type: "input", q: "Connecteur d'addition (en outre) : « ___ is het beter voor het milieu. »", a: ["bovendien"], ph: "connecteur", exp: "Bovendien = en outre, de plus." },
    { type: "qcm", q: "« Hoewel het duur is, toch kies ik ervoor. » Que marque « hoewel … toch » ?", opts: ["la cause", "la concession", "le but", "l'énumération"], a: 1, exp: "hoewel… toch… = bien que… pourtant… (concession)." },
    { type: "vf", q: "Anticiper une objection puis la réfuter (tegenwerping + weerlegging) renforce un betoog.", a: true, exp: "Concéder puis renverser montre une argumentation mûre." },
    { type: "input", q: "Connecteur de conséquence soutenu (par conséquent) : « Het is te riskant; ___ stel ik het uit. »", a: ["bijgevolg"], ph: "un mot", exp: "bijgevolg = par conséquent (registre soutenu)." },
    { type: "qcm", q: "Quelle formule ouvre une conclusion ?", opts: ["Ten eerste,…", "Kortom,…", "Sommigen beweren…", "Een voorbeeld hiervan…"], a: 1, exp: "Kortom = en bref (ouverture de conclusion)." },
    { type: "qcm", q: "« Uit onderzoek blijkt dat… » sert à…", opts: ["conclure", "étayer un argument par une preuve", "saluer", "poser une question"], a: 1, exp: "Uit onderzoek blijkt dat… = des études montrent que… (justification)." },
    { type: "input", q: "Opposition soutenue (cependant), après le verbe : « Het plan is duur. Het is ___ noodzakelijk. »", a: ["echter"], ph: "connecteur", exp: "echter = cependant (soutenu), souvent placé après le verbe." },
    { type: "vf", q: "La conclusion peut introduire un argument entièrement nouveau.", a: false, exp: "La conclusion synthétise et réaffirme la thèse, sans idée neuve." },
    { type: "qcm", q: "Compréhension : « Dit argument gaat echter voorbij aan de kosten. » Cette phrase…", opts: ["ajoute un exemple", "réfute une objection en pointant ce qu'elle néglige", "conclut le texte", "annonce la thèse"], a: 1, exp: "voorbijgaan aan = négliger, passer à côté de : c'est une weerlegging." },
    { type: "qcm", q: "Compréhension : « Concluderend kan ik stellen dat de voordelen zwaarder wegen. » Cette phrase appartient…", opts: ["à l'introduction", "au développement", "à la conclusion", "à un titre"], a: 2, exp: "Concluderend… = en conclusion… : c'est le slot." }
  ],
  final: {
    title: "Exercice final — Een kort betoog lezen",
    intro: `<p>Lis ce court texte argumentatif (soutenu) et réponds aux questions :</p>
<pre class="pseudo">Zou het openbaar vervoer gratis moeten zijn?

Ik ben ervan overtuigd dat het openbaar vervoer voor iedereen kosteloos zou
moeten worden. Ten eerste zou een gratis systeem de drempel verlagen om de
auto te laten staan. Daardoor zou de uitstoot van schadelijke stoffen dalen,
wat gunstig is voor het klimaat. Bovendien blijkt uit onderzoek dat vooral
mensen met een laag inkomen profiteren, aangezien vervoer een groot deel van
hun budget opslokt. Sommigen beweren echter dat gratis vervoer onbetaalbaar
is voor de overheid. Het klopt dat de kosten aanzienlijk zijn, maar dit
argument gaat voorbij aan de winst op lange termijn: minder files, schonere
lucht en lagere zorgkosten. Daarnaast tonen buitenlandse steden aan dat het
model werkt. Kortom, ondanks de aanvankelijke uitgaven wegen de maat-
schappelijke voordelen ruimschoots op tegen de nadelen. Om deze redenen ben
ik van mening dat gratis openbaar vervoer een verstandige investering is.</pre>`,
    questions: [
      { type: "input", q: "Quelle tournure annonce la thèse dès la première phrase ? « Ik ben ___ overtuigd dat… »", a: ["ervan"], ph: "un mot", exp: "Ik ben ervan overtuigd dat… = Je suis convaincu(e) que…" },
      { type: "qcm", q: "Le connecteur « Ten eerste » introduit…", opts: ["la conclusion", "le premier argument", "une objection", "la thèse"], a: 1, exp: "Ten eerste = premièrement (premier argument)." },
      { type: "qcm", q: "« Sommigen beweren echter dat gratis vervoer onbetaalbaar is » est…", opts: ["un argument pour la thèse", "une objection (tegenwerping)", "la conclusion", "un exemple"], a: 1, exp: "C'est l'objection que l'auteur va ensuite réfuter." },
      { type: "input", q: "Quel mot ouvre la conclusion du texte ? Un seul mot.", a: ["kortom"], ph: "connecteur", exp: "Kortom = en bref (ouverture du slot)." },
      { type: "qcm", q: "Compréhension : « dit argument gaat voorbij aan de winst op lange termijn » signifie que l'objection…", opts: ["est totalement fausse", "néglige le bénéfice à long terme", "confirme la thèse adverse", "n'a pas de rapport"], a: 1, exp: "voorbijgaan aan = négliger : la réfutation pointe ce que l'objection oublie." }
    ],
    solution: `<p>Traduction : « Les transports publics devraient-ils être gratuits ? Je suis convaincu que les transports en commun devraient devenir gratuits pour tous. Premièrement, un système gratuit abaisserait le seuil pour laisser la voiture au garage. De ce fait, les émissions de substances nocives baisseraient, ce qui est favorable au climat. En outre, des études montrent que ce sont surtout les personnes à faibles revenus qui en profitent, étant donné que le transport absorbe une grande part de leur budget. Certains prétendent cependant que la gratuité est intenable pour l'État. Il est vrai que les coûts sont considérables, mais cet argument néglige le gain à long terme : moins d'embouteillages, un air plus pur et des dépenses de santé plus faibles. Par ailleurs, des villes étrangères démontrent que le modèle fonctionne. En bref, malgré les dépenses initiales, les avantages sociaux l'emportent largement sur les inconvénients. Pour ces raisons, je suis d'avis que la gratuité des transports publics est un investissement judicieux. »</p>
<p>Structure à retenir : <strong>thèse</strong> (Ik ben ervan overtuigd…) → <strong>arguments</strong> hiérarchisés (Ten eerste, Bovendien, Daarnaast) reliés par des connecteurs de cause/conséquence (daardoor, aangezien) → <strong>concession + réfutation</strong> (Sommigen beweren echter… / Het klopt dat…, maar…) → <strong>conclusion</strong> (Kortom… Om deze redenen…). Chaque paragraphe articule un argument + sa justification + un connecteur. C'est cette charpente, plus que le nombre d'idées, qui rend un betoog convaincant.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "nl-b2-j13", title: "Rédige un court betoog", level: 3,

    hints: [
      "Ouvre par la thèse : Ik ben van mening dat… / Ik ben ervan overtuigd dat…",

      "Conclus sans idée neuve : Kortom,… / Om deze redenen ben ik van mening dat…"
    ],
    solution: "Zou de vierdaagse werkweek de norm moeten worden?\n\nIk ben ervan overtuigd dat de vierdaagse werkweek de nieuwe norm zou moeten worden. Ten eerste zorgt een kortere werkweek voor uitgerustere en productievere werknemers, aangezien zij meer tijd hebben om te herstellen. Daardoor daalt het aantal ziektedagen. Bovendien blijkt uit onderzoek dat een betere balans tussen werk en privé het welzijn vergroot. Sommigen beweren echter dat bedrijven het zich niet kunnen veroorloven. Het klopt dat de organisatie ingewikkelder wordt, maar dit argument gaat voorbij aan de winst op lange termijn: lagere kosten door minder verzuim en meer gemotiveerde teams. Daarnaast tonen proeven in verschillende landen aan dat de productiviteit gelijk blijft. Kortom, ondanks de aanvankelijke aanpassingen wegen de voordelen ruimschoots op tegen de nadelen. Om deze redenen ben ik van mening dat de vierdaagse werkweek een verstandige stap vooruit is.\n\nTraduction : « La semaine de quatre jours devrait-elle devenir la norme ? Je suis convaincu que la semaine de quatre jours devrait devenir la nouvelle norme. Premièrement, une semaine plus courte donne des employés plus reposés et plus productifs, étant donné qu'ils ont plus de temps pour récupérer. De ce fait, le nombre de jours de maladie diminue. En outre, des études montrent qu'un meilleur équilibre entre vie professionnelle et vie privée accroît le bien-être. Certains prétendent cependant que les entreprises ne peuvent pas se le permettre. Il est vrai que l'organisation devient plus complexe, mais cet argument néglige le gain à long terme : des coûts plus bas grâce à moins d'absentéisme et des équipes plus motivées. Par ailleurs, des essais dans plusieurs pays démontrent que la productivité reste identique. En bref, malgré les ajustements initiaux, les avantages l'emportent largement sur les inconvénients. Pour ces raisons, je suis d'avis que la semaine de quatre jours est un pas en avant judicieux. »",
    note: "Le squelette du betoog : thèse → argument 1 (+ justification + connecteur) → argument 2 → objection + réfutation → conclusion. Varie les connecteurs et ne conclus jamais sur une idée neuve. Une objection réfutée vaut mieux que trois arguments empilés." }
  ]
};
</script>
