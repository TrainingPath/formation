var DAY = {
  num: 28,
  title: "Projet final (2) : comprendre le fait divers en profondeur",
  subtitle: "Deuxième moitié : la résolution du mystère du tableau de Malines.",
  theory: `
<h3>Le projet final — la résolution et la compréhension approfondie</h3>
<p>Hier (jour 27) tu as lu la première moitié du fait divers : un tableau précieux disparu sans effraction ni alarme. Aujourd'hui tu lis la <strong>seconde moitié</strong>, celle qui résout l'énigme. Puis les exercices ne testent plus seulement les détails : ils visent le <strong>sens global</strong>, l'<strong>implicite</strong>, la <strong>chronologie</strong>, les <strong>causes</strong> et ton <strong>opinion</strong>. Lis d'abord toute l'histoire, ensuite reviens en arrière pour vérifier.</p>
<div class="tip">Aide lexicale — de woordenlijst :<br>
het logboek = le journal (des connexions) · in-/uitschakelen = activer/désactiver · de code = le code · verwijderen = supprimer · de restaurateur = le restaurateur · de camerabeelden = les images de caméra · de handschoen = le gant · de vingerafdruk = l'empreinte digitale · gepensioneerd = à la retraite · de wrok = la rancune · de verzamelaar = le collectionneur · oppakken = arrêter (qqn) · onbeschadigd = intact · vrijspreken = disculper · een vast contract = un contrat fixe · de zwakke plek = le point faible.</div>
<h3>Het raadsel van het verdwenen schilderij (deel 2)</h3>
<p>Inspecteur De Ridder besloot als eerste het logboek van de alarminstallatie te onderzoeken. In dat digitale logboek stond precies wanneer het systeem werd in- en uitgeschakeld. Al snel ontdekte hij iets vreemds: om kwart over tien 's avonds was het alarm vier minuten lang uitgeschakeld geweest — net nadat de bewaker naar huis was gegaan.</p>
<p>« Iemand heeft een geldige code gebruikt », zei de inspecteur rustig. « Dit was geen inbraak van buitenaf, maar een goed voorbereide diefstal van binnenuit. » De code hoorde echter niet bij een huidige werknemer. Na lang zoeken bleek dat het een oude code was die jaren geleden aan een restaurateur was gegeven en die het museum vergeten was te verwijderen.</p>
<p>Lena, de stagiaire, herinnerde zich plotseling iets belangrijks. Een paar dagen eerder was er een vriendelijke, oudere man langsgekomen. Hij had opvallend veel vragen gesteld over de openingsuren en over de beveiliging. « Ik vond het toen al een beetje raar », zei ze zacht, « maar ik durfde niets te zeggen. »</p>
<p>De inspecteur liet de camerabeelden van de straat onderzoeken. Op die beelden was dezelfde man te zien, gekleed in een lange jas en met dunne witte handschoenen — precies het soort handschoenen dat restaurateurs gebruiken om kwetsbare schilderijen aan te raken. Toch paste het stukje bruine stof niet bij die witte handschoenen, en dat verwarde de politie in het begin.</p>
<p>Later werd het duidelijk: de man had twee paar handschoenen bij zich. Witte om het doek te beschermen, en bruine leren handschoenen om geen vingerafdrukken achter te laten. Zo loste ook het laatste kleine raadsel zich vanzelf op.</p>
<p>De dader bleek meneer Dubois te zijn, een gepensioneerde restaurateur die vroeger voor het museum had gewerkt. Hij kende het gebouw, het alarm en zelfs de zwakke plekken van het systeem. Omdat zijn oude code nooit was gewist, kon hij ongestoord binnenkomen en daarna rustig weer vertrekken.</p>
<p>De motieven van Dubois waren zowel geld als wrok. Jaren eerder had het museum zijn contract niet verlengd, en dat had hem diep gekwetst. Hij wilde het doek in het buitenland aan een private verzamelaar verkopen. Gelukkig werd hij drie dagen later opgepakt in een hotel in Brussel, waar hij het schilderij in een koffer verborgen hield.</p>
<p>Het doek « De Winterhaven » keerde onbeschadigd terug naar de blauwe zaal. Mevrouw Coppens was enorm opgelucht: de reputatie van het museum was gered en zij kon haar baan behouden. Toch trok ze een belangrijke les uit de hele zaak. « We hadden die oude codes veel eerder moeten verwijderen », gaf ze eerlijk toe. « Een museum is maar zo veilig als zijn slechtst bewaarde sleutel. »</p>
<p>De bewaker Verhaeghe werd volledig vrijgesproken; hij had niets verkeerd gedaan en zijn nervositeit kwam gewoon door de schrik. En Lena, de jonge stagiaire die het kleine stukje stof had opgemerkt, kreeg tot haar verrassing een vast contract. « Soms », zei de inspecteur met een glimlach, « ziet een nieuw paar ogen meer dan twintig jaar ervaring. »</p>
<div class="warn">Compréhension implicite : la dernière phrase de l'inspecteur n'est pas seulement gentille — elle contient la morale de l'histoire. Et remarque la vraie faille : ni l'alarme ni le gardien, mais une négligence administrative (un vieux code jamais supprimé). Le vrai coupable de la faille de sécurité, c'est l'oubli.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le sens global de cette seconde partie ?", opts: ["le tableau était perdu pour toujours", "l'enquête révèle un vol commis de l'intérieur et le tableau est retrouvé", "le gardien est arrêté", "le musée ferme définitivement"], a: 1, exp: "Diefstal van binnenuit, dader gepakt, doek terug." },
    { type: "qcm", q: "Que décide d'examiner l'inspecteur en premier ?", opts: ["les caméras", "le logboek (journal) de l'alarme", "les gants", "le contrat de Dubois"], a: 1, exp: "Als eerste het logboek van de alarminstallatie." },
    { type: "input", q: "À quelle heure l'alarme a-t-elle été désactivée ? om kwart over ___ (dix)", a: ["tien"], ph: "un nombre", exp: "kwart over tien = 22h15." },
    { type: "qcm", q: "Chronologie : quand l'alarme a-t-elle été désactivée par rapport au départ du gardien ?", opts: ["bien avant son arrivée", "juste après son départ", "pendant sa ronde", "le lendemain matin"], a: 1, exp: "net nadat de bewaker naar huis was gegaan." },
    { type: "qcm", q: "Cause : pourquoi la vieille code fonctionnait-elle encore ?", opts: ["le système était neuf", "le musée avait oublié de la supprimer", "le gardien l'avait donnée", "Lena l'avait notée"], a: 1, exp: "die men vergeten was te verwijderen." },
    { type: "vf", q: "Le voleur est entré par effraction en cassant une fenêtre.", a: false, exp: "Non : il a utilisé une code valide, geen inbraak van buitenaf." },
    { type: "qcm", q: "Implicite : pourquoi Lena trouvait-elle l'homme bizarre avant même le vol ?", opts: ["il était impoli", "il posait beaucoup de questions sur la sécurité", "il portait un déguisement", "il refusait de payer"], a: 1, exp: "veel vragen over de beveiliging." },
    { type: "input", q: "Combien de paires de gants l'homme avait-il ? ___ paar (deux)", a: ["twee"], ph: "un nombre", exp: "twee paar handschoenen." },
    { type: "qcm", q: "Pourquoi portait-il aussi des gants en cuir bruns ?", opts: ["pour avoir chaud", "pour ne pas laisser d'empreintes", "pour protéger la toile", "par élégance"], a: 1, exp: "om geen vingerafdrukken achter te laten." },
    { type: "qcm", q: "Qui est le coupable ?", opts: ["le gardien Verhaeghe", "la directrice Coppens", "meneer Dubois, un restaurateur retraité", "la stagiaire Lena"], a: 2, exp: "een gepensioneerde restaurateur die vroeger voor het museum werkte." },
    { type: "qcm", q: "Cause / motif : quels étaient ses motifs ?", opts: ["seulement la gloire", "l'argent et la rancune", "l'amour de l'art", "une erreur involontaire"], a: 1, exp: "zowel geld als wrok." },
    { type: "vf", q: "Le musée avait renouvelé le contrat de Dubois quelques années plus tôt.", a: false, exp: "Non : het museum had zijn contract niet verlengd." },
    { type: "input", q: "Où Dubois a-t-il été arrêté ? in een hotel in ___ (la capitale)", a: ["brussel"], ph: "une ville", exp: "opgepakt in een hotel in Brussel." },
    { type: "qcm", q: "Opinion / leçon : quelle leçon la directrice tire-t-elle ?", opts: ["engager plus de gardiens", "supprimer plus tôt les vieux codes d'accès", "fermer la salle bleue", "vendre le tableau"], a: 1, exp: "We hadden die oude codes veel eerder moeten verwijderen." },
    { type: "vf", q: "La phrase finale de l'inspecteur suggère qu'un regard neuf peut voir plus que l'expérience.", a: true, exp: "Een nieuw paar ogen ziet soms meer dan twintig jaar ervaring." }
  ],
  final: {
    title: "Exercice final — Het onderzoek afgesloten",
    intro: `<p>Tu clôtures le dossier avec l'inspecteur. Vérifie ta compréhension d'ensemble : reconstitue la logique de l'affaire, du premier indice à l'arrestation.</p>
<pre class="pseudo">Samenvatting van de zaak:
- Feit: schilderij weg, geen braak, geen alarm.
- Spoor 1: stukje bruine stof (leren handschoen).
- Spoor 2: logboek -> alarm 4 minuten uit om 22u15.
- Oorzaak: oude, niet-verwijderde code van een restaurateur.
- Dader: meneer Dubois (geld + wrok).
- Resultaat: doek terug, Dubois opgepakt in Brussel.</pre>`,
    questions: [
      { type: "qcm", q: "Quel indice a permis de comprendre COMMENT le voleur est entré ?", opts: ["le fil brun", "le logboek montrant une code valide utilisée à 22h15", "les caméras", "le témoignage du gardien"], a: 1, exp: "Le journal de l'alarme révèle l'usage d'une code valide." },
      { type: "input", q: "Quelle négligence est la véritable faille de sécurité ? een oude ___ die nooit verwijderd was (code)", a: ["code"], ph: "un nom", exp: "Une vieille code jamais supprimée." },
      { type: "qcm", q: "Pourquoi le fil brun avait-il d'abord dérouté la police ?", opts: ["il était trop petit", "les gants vus sur la caméra étaient blancs, pas bruns", "il n'existait pas", "il appartenait à Lena"], a: 1, exp: "Deux paires de gants : blanche et brune." },
      { type: "input", q: "Comment le personnel est-il traité à la fin ? De bewaker werd ___ (disculpé)", a: ["vrijgesproken"], ph: "un participe", exp: "Verhaeghe werd vrijgesproken." },
      { type: "qcm", q: "Selon toi, quelle est la morale principale du fait divers ?", opts: ["il ne faut jamais faire confiance aux stagiaires", "la sécurité dépend du maillon le plus faible, souvent humain ou administratif", "les musées sont inutiles", "l'expérience compte plus que tout"], a: 1, exp: "Een museum is maar zo veilig als zijn slechtst bewaarde sleutel." }
    ],
    solution: `<p>La chaîne logique complète : le vol semblait impossible (ni effraction ni alarme). L'inspecteur cherche donc une explication interne. Le journal de l'alarme montre une désactivation de quatre minutes à 22h15 avec une code valide — mais une vieille code, appartenant à un ancien restaurateur, jamais supprimée. Les caméras et le souvenir de Lena identifient meneer Dubois, qui avait deux paires de gants (d'où le fil brun trompeur). Ses motifs : l'argent et la rancune après le non-renouvellement de son contrat. Il est arrêté à Bruxelles, le tableau revient intact.</p>
<p>Pour comprendre un fait divers en profondeur, distingue toujours : les <strong>faits</strong>, la <strong>chronologie</strong>, la <strong>cause</strong> (ici, une négligence administrative), l'<strong>implicite</strong> (la morale portée par la dernière réplique) et ton <strong>opinion</strong> personnelle. C'est exactement la lecture attendue au niveau B2.</p>`
  }
};

    ],
    solution: "Eerst ontdekte het personeel dat het schilderij « De Winterhaven » verdwenen was, zonder sporen van braak en zonder alarm. De inspecteur onderzocht daarna het logboek en zag dat het alarm om kwart over tien vier minuten was uitgeschakeld met een geldige code. De echte oorzaak was dat een oude code van een restaurateur nooit verwijderd was. Met die code kon de dader ongestoord binnenkomen. Uiteindelijk bleek het meneer Dubois te zijn, een gepensioneerde restaurateur die uit geld en wrok handelde. Hij werd in een hotel in Brussel opgepakt en het doek keerde onbeschadigd terug. De stagiaire Lena kreeg een vast contract omdat zij het beslissende spoor had gezien. Volgens mij toont dit verhaal dat de zwakste plek van elke beveiliging vaak een menselijke of administratieve fout is.\n\nTraduction : D'abord, le personnel a découvert que le tableau « De Winterhaven » avait disparu, sans traces d'effraction et sans alarme. L'inspecteur a ensuite examiné le journal et a vu que l'alarme avait été désactivée quatre minutes à 22h15 avec une code valide. La véritable cause était qu'une vieille code d'un restaurateur n'avait jamais été supprimée. Avec cette code, l'auteur a pu entrer sans être dérangé. Finalement, il s'est avéré que c'était monsieur Dubois, un restaurateur retraité qui agissait par appât du gain et par rancune. Il a été arrêté dans un hôtel à Bruxelles et la toile est revenue intacte. La stagiaire Lena a obtenu un contrat fixe parce qu'elle avait vu l'indice décisif. Selon moi, cette histoire montre que le point faible de toute sécurité est souvent une erreur humaine ou administrative.",
