  theory: `
<h3>1. Pourquoi les idiomes ?</h3>
<p>Une <strong>expression idiomatique</strong> (uitdrukking, zegswijze) a un sens global qu'on ne devine pas à partir des mots isolés. Les comprendre est indispensable pour saisir la conversation réelle, la presse et l'humour ; les employer avec justesse est la marque d'un niveau avancé.</p>
<div class="warn">Le piège est double : ne pas traduire un idiome français mot à mot (« il pleut des cordes » n'est pas « het regent touwen ») et ne pas prendre un idiome néerlandais au pied de la lettre (« de kat uit de boom kijken » ne parle pas vraiment de chat ni d'arbre).</div>
<h3>2. Expressions très courantes</h3>
<pre class="pseudo">de knoop doorhakken          trancher, prendre une décision (couper le nœud)
de kat uit de boom kijken    attendre de voir venir avant d'agir
iets onder de knie krijgen   maîtriser qqch (l'avoir sous le genou)
de draad kwijt zijn          perdre le fil
het hoofd koel houden        garder son sang-froid (garder la tête froide)
de handen uit de mouwen steken  se mettre au travail, mettre la main à la pâte
ergens geen kaas van gegeten hebben  n'y connaître rien</pre>
<h3>3. Expressions imagées avec les animaux</h3>
<pre class="pseudo">een kat in de zak kopen      se faire avoir dans un achat (acheter un chat en sac)
de hond in de pot vinden     arriver quand tout est mangé / trop tard
zo brutaal als de beul       très effronté
een oogje in het zeil houden  garder un œil, surveiller
de kop in het zand steken    faire l'autruche (mettre la tête dans le sable)</pre>
<h3>4. La météo et les images du quotidien</h3>
<pre class="pseudo">het regent pijpenstelen      il pleut des cordes
het is met hem gedaan        c'en est fini de lui
door de zure appel heen bijten  se résigner à une chose désagréable
de puntjes op de i zetten    mettre les points sur les i
iemand iets op de mouw spelden  faire gober qqch à qqn
boter bij de vis             payer comptant / sans attendre</pre>
<div class="tip">Beaucoup d'idiomes ont un équivalent français à image DIFFÉRENTE. « Nu komt de aap uit de mouw » (voilà le singe qui sort de la manche) = maintenant on découvre le pot aux roses / la vérité éclate. Apprends le SENS et l'image néerlandaise, sans chercher un calque.</div>
<h3>5. Nuances d'emploi et registre</h3>
<p>Certains idiomes sont neutres et passent partout (de knoop doorhakken), d'autres sont familiers (balen = en avoir marre : Ik baal ervan). Adapte au contexte : un idiome très imagé détonne dans un rapport officiel mais anime une conversation. Quelques tournures utiles à l'oral :</p>
<pre class="pseudo">Ik baal ervan.               J'en ai marre. (familier)
Dat kan ermee door.          Ça peut aller / c'est acceptable.
Dat slaat nergens op.        Ça n'a aucun sens.
Even goede vrienden.         On reste bons amis (malgré le désaccord).
Dat is een makkie.           C'est du gâteau, c'est facile.</pre>`,

    intro: `<p>Ce dialogue vivant est truffé d'expressions. Lis-le, puis réponds :</p>
<pre class="pseudo">— Zo, eindelijk heb je de knoop doorgehakt en ga je verhuizen!

    ],
    solution: `<p>Traduction : « — Alors, tu as enfin tranché et tu vas déménager ! — Oui, j'ai longtemps attendu de voir venir, mais maintenant c'est décidé. — Sage décision. Tu vas évidemment devoir te retrousser les manches, car tout emballer, ce n'est pas de la tarte. — Je sais. J'en ai déjà marre, mais je dois avaler la pilule. — Surtout, garde ton sang-froid. Et demande de l'aide, car déménager seul, tu n'y connais rien. — C'est vrai. Mon frère aide, mais il arrive souvent quand tout est déjà fait. — Haha, alors garde un œil, sinon tu feras tout toi-même ! — On verra bien. On reste bons amis, hein, même si ça vire au chaos. »</p>
<p>Chaque réplique repose sur une image : <strong>de knoop doorhakken</strong> (décider), <strong>de kat uit de boom kijken</strong> (temporiser), <strong>de handen uit de mouwen steken</strong> (se mettre au travail), <strong>geen makkie</strong> (pas simple), <strong>door de zure appel heen bijten</strong> (se résigner), <strong>het hoofd koel houden</strong> (garder son calme), <strong>geen kaas van gegeten hebben</strong> (n'y rien connaître), <strong>een oogje in het zeil houden</strong> (surveiller), <strong>even goede vrienden</strong> (rester amis). Mémorise le sens et l'image néerlandaise, pas un calque du français.</p>`
