  theory: `
<h3>1. L'échelle de la probabilité — de graad van waarschijnlijkheid</h3>
<p>Entre « c'est sûr » et « c'est impossible », le néerlandais dispose d'adverbes précis pour graduer la certitude.</p>
<pre class="pseudo">zeker            certainement (100%)
waarschijnlijk   probablement
vermoedelijk     vraisemblablement
misschien        peut-être
wellicht         peut-être, sans doute
mogelijk         possiblement
nauwelijks       à peine, difficilement
onmogelijk       impossible (0%)</pre>
<h3>2. Les verbes modaux de probabilité</h3>
<pre class="pseudo">Het kan regenen.        Il peut pleuvoir. (possibilité)
Het zou kunnen.         Cela se pourrait.
Hij moet ziek zijn.     Il doit être malade. (déduction quasi certaine)
Ze zal wel thuis zijn.  Elle est sans doute chez elle. (« wel » = probablement)</pre>
<div class="tip">Le petit mot <strong>wel</strong> après « zullen » exprime une probabilité : « Hij zal het <strong>wel</strong> vergeten zijn » = il l'a sans doute oublié. C'est très courant à l'oral.</div>
<h3>3. Les hypothèses avec « als » (si)</h3>
<pre class="pseudo">Réel / probable :
Als het morgen regent, blijf ik thuis.
   S'il pleut demain, je reste à la maison.

Irréel du présent (conditionnel) : als + imparfait / zou + infinitif
Als ik rijk was, zou ik de wereld rondreizen.
   Si j'étais riche, je ferais le tour du monde.

Irréel du passé : als + plus-que-parfait / zou hebben
Als ik het geweten had, zou ik gekomen zijn.
   Si je l'avais su, je serais venu.</pre>
<h3>4. Formuler une supposition</h3>
<pre class="pseudo">Ik vermoed dat…        Je suppose que…
Ik neem aan dat…       Je pars du principe que…
Stel dat…              Supposons que…
Het lijkt erop dat…    Il semble que…</pre>
<div class="warn">Après « zou », le verbe part à l'infinitif en fin de phrase : « Ik zou dat nooit <strong>doen</strong> » (je ne ferais jamais ça). Ne conjuguez pas deux fois.</div>`,

    { type: "vf", q: "« Als het morgen regent, blijf ik thuis » est une hypothèse réelle/probable (indicatif).", a: true, exp: "als + présent : hypothèse réelle." },
    { type: "input", q: "Complète l'irréel : « Als ik rijk was, ___ ik de wereld rondreizen. » (conditionnel)", a: ["zou"], ph: "un mot", exp: "zou + infinitif = conditionnel." },

    { type: "input", q: "Complète : « ___ dat je gelijk hebt, wat dan? » (supposons que)", a: ["stel"], ph: "un mot", exp: "Stel dat… = supposons que…" },
    { type: "qcm", q: "Compréhension : « Het lijkt erop dat de trein vertraging heeft. » Cela exprime…", opts: ["une certitude absolue", "une apparence / supposition", "un ordre", "un refus"], a: 1, exp: "het lijkt erop dat = il semble que." },

  ],

 75%  Het is waarschijnlijk waar.
 50%  Het is misschien waar.

      { type: "qcm", q: "Ordonne du plus au moins probable : zeker – waarschijnlijk – misschien – onmogelijk. Lequel est le MOINS probable ?", opts: ["zeker", "waarschijnlijk", "misschien", "onmogelijk"], a: 3, exp: "onmogelijk = 0%." },
      { type: "input", q: "Complète l'hypothèse irréelle : « Als het niet zo laat ___, zou ik nog komen. » (imparfait de zijn)", a: ["was"], ph: "un verbe", exp: "Als het niet zo laat was = s'il n'était pas si tard." }
    ],
    solution: `<p>Le néerlandais gradue la certitude avec des adverbes (<strong>zeker &gt; waarschijnlijk &gt; misschien &gt; nauwelijks &gt; onmogelijk</strong>), des modaux (<strong>kan, moet, zou kunnen</strong>) et le mot <strong>wel</strong>. Pour les hypothèses : « als + présent » (réel), « als + imparfait / zou + infinitif » (irréel du présent), « als + plus-que-parfait / zou hebben » (irréel du passé).</p>
<p>Anna dit « Het gaat waarschijnlijk regenen » : le ciel sombre rend la pluie probable mais pas certaine.</p>`
  }
