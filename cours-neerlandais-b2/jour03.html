  title: "Les subordonnées complexes",
  subtitle: "Enchaîner conjonctions, verbes en fin de proposition et empilements verbaux.",
  theory: `
<h3>1. La règle d'or : verbe rejeté à la fin</h3>
<p>Dans une subordonnée (bijzin), le verbe conjugué se place <strong>à la fin</strong>. C'est la marque même de la subordination. Comparons :</p>
<pre class="pseudo">Principale : Ik weet het.              Je le sais.
Subordonnée : … dat ik het weet.       … que je le sais. (weet à la fin)
Principale : Hij komt vanavond.        Il vient ce soir.
Subordonnée : … omdat hij vanavond komt. … parce qu'il vient ce soir.</pre>
<p>Les conjonctions de subordination fréquentes : <strong>dat</strong> (que), <strong>omdat</strong> (parce que), <strong>hoewel</strong> (bien que), <strong>terwijl</strong> (pendant que), <strong>zodat</strong> (de sorte que), <strong>voordat</strong> (avant que), <strong>nadat</strong> (après que), <strong>als</strong> (si/quand), <strong>toen</strong> (quand, passé), <strong>wanneer</strong> (quand), <strong>indien</strong> (si, soutenu).</p>
<h3>2. L'empilement des verbes</h3>
<p>Quand plusieurs verbes se retrouvent en fin de subordonnée, ils s'<strong>empilent</strong>. L'ordre courant place l'auxiliaire avant le participe (ordre « vert »), mais l'inverse existe aussi (ordre « rouge ») ; les deux sont admis :</p>
<pre class="pseudo">… dat hij het boek heeft gelezen.    … qu'il a lu le livre. (aux + participe)
… dat hij het boek gelezen heeft.    même sens (participe + aux)
… dat ze het had kunnen doen.        … qu'elle aurait pu le faire.
… omdat ik morgen zal moeten werken. … parce que je devrai travailler demain.</pre>
<div class="tip">Avec un modal + infinitif au parfait, on obtient un « double infinitif » : <strong>Ik heb niet kunnen komen</strong> = je n'ai pas pu venir (kunnen reste à l'infinitif, pas de participe « gekund »). En subordonnée : <strong>… dat ik niet heb kunnen komen.</strong></div>
<h3>3. Om… te et les infinitives</h3>
<p>Pour exprimer le but, on emploie <strong>om … te + infinitif</strong> (afin de) ; le <strong>te</strong> se place juste devant l'infinitif rejeté en fin :</p>
<pre class="pseudo">Ik studeer hard om te slagen.               J'étudie dur pour réussir.
Hij belt om een afspraak te maken.          Il appelle pour prendre rendez-vous.
Het is belangrijk om op tijd te komen.      Il est important d'arriver à l'heure.</pre>
<p>Avec un verbe à particule séparable, le <strong>te</strong> s'intercale : <strong>om op te bellen</strong> (pour téléphoner), <strong>om mee te gaan</strong> (pour venir avec).</p>
<h3>4. Emboîter les subordonnées</h3>
<p>Le B2 exige de combiner plusieurs propositions sans se perdre. Chaque subordonnée garde son verbe à la fin :</p>
<pre class="pseudo">Hoewel hij wist dat het moeilijk zou zijn, gaf hij niet op.
Bien qu'il sût que ce serait difficile, il n'a pas abandonné.

Ik denk dat ze gelijk heeft, ook al begrijp ik niet waarom ze zo boos werd.
Je pense qu'elle a raison, même si je ne comprends pas pourquoi elle s'est mise en colère.</pre>
<div class="warn">Piège fréquent : après une subordonnée placée EN TÊTE de phrase, la principale commence par le verbe (inversion). « Omdat het regende, bleven we thuis. » (verbe « bleven » juste après la virgule). Ne calque pas l'ordre français.</div>`,
  exercises: [
    { type: "qcm", q: "Dans une subordonnée, le verbe conjugué se place…", opts: ["en deuxième position", "au début", "à la fin", "après le sujet"], a: 2, exp: "Règle d'or de la bijzin : verbe rejeté à la fin." },
    { type: "input", q: "Transforme en subordonnée : « Hij komt. » → « … omdat hij ___. »", a: ["komt"], ph: "verbe", exp: "Le verbe part à la fin : omdat hij komt." },
    { type: "qcm", q: "« hoewel » signifie…", opts: ["parce que", "bien que", "pendant que", "avant que"], a: 1, exp: "hoewel = bien que (concession)." },
    { type: "input", q: "But avec om…te : « Ik studeer hard ___ te slagen. »", a: ["om"], ph: "un mot", exp: "om … te + infinitif = afin de." },

    { type: "qcm", q: "Quel ordre verbal est correct en subordonnée ?", opts: ["… dat hij gelezen heeft het boek", "… dat hij het boek heeft gelezen", "… dat heeft hij het boek gelezen", "… dat het boek hij gelezen heeft"], a: 1, exp: "Les verbes s'empilent en fin : … dat hij het boek heeft gelezen (ou gelezen heeft)." },
    { type: "input", q: "Verbe séparable avec te : « Hij belt om me op ___ bellen. »", a: ["te"], ph: "un mot", exp: "Le te s'intercale : om op te bellen." },

    { type: "vf", q: "Après une subordonnée en tête de phrase, la principale commence par son verbe.", a: true, exp: "Inversion : « Omdat het regende, bleven we thuis. »" },
    { type: "qcm", q: "« … dat ze het had kunnen doen » se traduit par…", opts: ["qu'elle le fait", "qu'elle aurait pu le faire", "qu'elle le fera", "qu'elle doit le faire"], a: 1, exp: "had kunnen doen = aurait pu faire (conditionnel passé)." },
    { type: "input", q: "Complète la conjonction de but/conséquence : « Ik leg het uit ___ je het begrijpt. » (de sorte que)", a: ["zodat"], ph: "conjonction", exp: "zodat = de sorte que (conséquence voulue)." },
    { type: "qcm", q: "Quelle phrase respecte l'ordre correct ?", opts: ["Ik denk dat ze heeft gelijk", "Ik denk dat ze gelijk heeft", "Ik denk heeft dat ze gelijk", "Ik denk dat gelijk ze heeft"], a: 1, exp: "En subordonnée le verbe va à la fin : dat ze gelijk heeft." },
    { type: "vf", q: "« Het is belangrijk om op tijd te komen » est correct.", a: true, exp: "om … te + infinitif après une tournure impersonnelle : parfaitement correct." },
    { type: "qcm", q: "Compréhension : « Nadat hij was aangekomen, belde hij zijn familie. » Quel événement vient EN PREMIER ?", opts: ["il appelle sa famille", "il arrive", "les deux en même temps", "aucun"], a: 1, exp: "nadat = après que : l'arrivée précède l'appel." },
    { type: "qcm", q: "Compréhension : « Ik weet niet of ze vandaag komt. » « of » introduit ici…", opts: ["une cause", "une interrogation indirecte (si)", "un but", "une opposition"], a: 1, exp: "of = si (interrogation indirecte) : je ne sais pas si elle vient." }
  ],
  final: {
    title: "Exercice final — Een genuanceerde mening",
    intro: `<p>Lis ce paragraphe riche en subordonnées, puis réponds :</p>
<pre class="pseudo">Hoewel veel mensen denken dat thuiswerken alleen maar voordelen heeft,
ben ik ervan overtuigd dat de werkelijkheid genuanceerder is.
Terwijl sommige werknemers productiever worden omdat ze rustiger kunnen
werken, missen anderen het contact dat ze op kantoor hadden.
Ik denk dat een bedrijf duidelijke afspraken moet maken, zodat iedereen
weet wat er van hem verwacht wordt.
Voordat we een definitief oordeel vellen, zouden we moeten onderzoeken
hoe verschillende teams hierop reageren.
Ook al lijkt de discussie soms eenvoudig, ze raakt aan diepere vragen
over vertrouwen en verantwoordelijkheid.
Als werkgevers hun medewerkers vrijheid geven, moeten ze er ook op durven
vertrouwen dat het werk gedaan wordt.</pre>`,
    questions: [
      { type: "qcm", q: "Par quelle conjonction commence le texte, exprimant une concession ?", opts: ["omdat", "hoewel", "terwijl", "zodat"], a: 1, exp: "hoewel = bien que (concession)." },
      { type: "input", q: "Dans « dat de werkelijkheid genuanceerder ___ », quel verbe termine la subordonnée ?", a: ["is"], ph: "verbe", exp: "En subordonnée le verbe va à la fin : dat de werkelijkheid genuanceerder is." },
      { type: "qcm", q: "« zodat iedereen weet wat er van hem verwacht wordt » exprime…", opts: ["une cause", "une conséquence voulue (de sorte que)", "une simultanéité", "un but personnel"], a: 1, exp: "zodat = de sorte que (conséquence)." },
      { type: "qcm", q: "« Voordat we een oordeel vellen » situe l'action…", opts: ["après le jugement", "avant le jugement", "pendant le jugement", "sans rapport"], a: 1, exp: "voordat = avant que : l'enquête précède le jugement." },
      { type: "input", q: "Relève la conjonction qui ouvre la dernière phrase (condition) : « ___ werkgevers hun medewerkers vrijheid geven »", a: ["als"], ph: "conjonction", exp: "als = si/quand (condition)." }
    ],
    solution: `<p>Traduction : « Bien que beaucoup de gens pensent que le télétravail n'a que des avantages, je suis convaincu que la réalité est plus nuancée. Tandis que certains employés deviennent plus productifs parce qu'ils peuvent travailler plus tranquillement, d'autres regrettent le contact qu'ils avaient au bureau. Je pense qu'une entreprise doit fixer des règles claires, de sorte que chacun sache ce qu'on attend de lui. Avant de rendre un jugement définitif, nous devrions examiner comment différentes équipes y réagissent. Même si la discussion paraît parfois simple, elle touche à des questions plus profondes sur la confiance et la responsabilité. Si les employeurs donnent de la liberté à leurs collaborateurs, ils doivent aussi oser leur faire confiance pour que le travail soit fait. »</p>
<p>Note l'architecture : chaque subordonnée rejette son verbe à la fin (heeft, is, hadden, wordt), les subordonnées s'emboîtent (dat … dat …), et quand l'une ouvre la phrase, la principale bascule en inversion (« Voordat we …, zouden we … »). C'est cette maîtrise qui distingue un texte B2.</p>`
  }
};
