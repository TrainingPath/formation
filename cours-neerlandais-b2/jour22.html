<script>
var DAY = {
  num: 22,
  title: "L'implicite, l'humour, l'ironie",
  subtitle: "Comprendre ce qui n'est pas dit : sous-entendus, plaisanteries et second degré.",
  theory: `
<h3>1. L'implicite — het impliciete</h3>
<p>Au niveau B2, comprendre ne suffit plus : il faut saisir ce qui est <strong>suggéré</strong> sans être dit. L'implicite (<strong>tussen de regels lezen</strong> = lire entre les lignes) repose sur le contexte et le ton.</p>
<pre class="pseudo">Voorbeeld :
« Het is hier lekker warm », zegt iemand met zijn jas nog aan.
   -> Impliciet : het is eigenlijk koud (ironie).</pre>
<h3>2. L'ironie — de ironie</h3>
<p>L'ironie consiste à dire le contraire de ce qu'on pense, souvent pour se moquer gentiment. Le ton et le contexte donnent la clé.</p>
<pre class="pseudo">« Wat een prachtig weer! » bij stromende regen.
   « Quel temps magnifique ! » sous une pluie battante.
« Fijn, alweer file. Precies wat ik nodig had. »
   « Super, encore un bouchon. Exactement ce qu'il me fallait. »</pre>
<div class="tip">Signaux d'ironie fréquents en néerlandais : <strong>alweer</strong> (encore, une fois de plus), <strong>precies wat ik nodig had</strong> (juste ce qu'il me fallait), <strong>natuurlijk</strong> prononcé avec insistance, ou une exagération évidente.</div>
<h3>3. L'humour et les jeux de mots — humor en woordspelingen</h3>
<pre class="pseudo">de grap          la blague       de woordspeling  le jeu de mots
lachen om        rire de         plagen           taquiner
de overdrijving  l'exagération   het understatement la litote
droge humor      l'humour pince-sans-rire</pre>
<p>Les Néerlandais aiment le <strong>droge humor</strong> (humour pince-sans-rire) : une remarque drôle dite sans sourire, sur un ton neutre.</p>
<h3>4. La litote (understatement)</h3>
<p>Dire moins pour signifier plus. « Het was niet slecht » (ce n'était pas mauvais) peut vouloir dire « c'était excellent ». « Hij is niet bepaald verlegen » (il n'est pas exactement timide) = il est très bavard.</p>
<div class="warn">Ne prenez pas toujours les mots au pied de la lettre. « Dat is ook handig » dit sur un ton sec après une gaffe signifie souvent l'inverse : « ce n'est pas pratique du tout ». Le contexte prime.</div>`,
  exercises: [
    { type: "qcm", q: "« tussen de regels lezen » signifie…", opts: ["lire à voix haute", "lire entre les lignes", "lire vite", "relire"], a: 1, exp: "comprendre l'implicite." },
    { type: "qcm", q: "Quelqu'un dit « Wat een prachtig weer! » sous la pluie. C'est…", opts: ["un compliment sincère", "de l'ironie", "une question", "une erreur"], a: 1, exp: "Il dit le contraire de ce qu'il pense : ironie." },
    { type: "input", q: "Quel petit mot signale souvent l'agacement ironique ? « ___ file! » (encore, une fois de plus)", a: ["alweer"], ph: "un mot", exp: "alweer = encore une fois." },
    { type: "qcm", q: "« Het was niet slecht » (litote) veut souvent dire…", opts: ["c'était nul", "c'était en fait très bon", "je ne sais pas", "c'était moyen et sans intérêt"], a: 1, exp: "L'understatement dit moins pour signifier plus." },
    { type: "vf", q: "« droge humor » désigne un humour pince-sans-rire, dit sur un ton neutre.", a: true, exp: "droge humor = humour à froid." },
    { type: "qcm", q: "« Hij is niet bepaald verlegen » suggère qu'il est…", opts: ["très timide", "plutôt bavard / pas timide du tout", "malade", "absent"], a: 1, exp: "Litote : « pas exactement timide » = très à l'aise." },
    { type: "input", q: "Traduis « la blague » : de ___", a: ["grap"], ph: "un nom", exp: "de grap = la blague." },
    { type: "qcm", q: "« plagen » signifie…", opts: ["insulter", "taquiner (gentiment)", "mentir", "crier"], a: 1, exp: "plagen = taquiner." },
    { type: "qcm", q: "« Precies wat ik nodig had » dit sur un ton las exprime…", opts: ["de la joie sincère", "de l'ironie (le contraire)", "une demande", "un remerciement"], a: 1, exp: "Ironie : c'est en réalité un contretemps." },
    { type: "input", q: "Traduis « le jeu de mots » : de ___", a: ["woordspeling"], ph: "un nom", exp: "de woordspeling = le jeu de mots." },
    { type: "vf", q: "Pour repérer l'ironie, le ton et le contexte sont plus importants que les mots eux-mêmes.", a: true, exp: "L'ironie inverse le sens littéral ; seul le contexte le révèle." },
    { type: "qcm", q: "« de overdrijving » désigne…", opts: ["la litote", "l'exagération", "la question", "la répétition"], a: 1, exp: "overdrijven = exagérer." },
    { type: "input", q: "Complète (litote) : « Dat is ___ slecht nieuws. » = plutôt une bonne nouvelle (pas mauvais)", a: ["niet"], ph: "un mot", exp: "niet slecht = pas mauvais = plutôt bon." },
    { type: "qcm", q: "Compréhension : Après avoir raté son train, Tom dit « Geweldig, echt geweldig. » Il est…", opts: ["ravi", "ironique et contrarié", "reconnaissant", "surpris positivement"], a: 1, exp: "« Génial, vraiment génial » après un contretemps = ironie." },
    { type: "vf", q: "Compréhension : « Onze buurman praat graag — een beetje te graag. » sous-entend que le voisin parle trop.", a: true, exp: "« un peu trop volontiers » suggère avec humour qu'il est bavard." }
  ],
  final: {
    title: "Exercice final — Wat wordt er eigenlijk bedoeld?",
    intro: `<p>Lis chaque situation et détermine le sens réel (impliciet), puis réponds :</p>
<pre class="pseudo">A. Bij een saaie vergadering fluistert een collega:
   « Boeiend, hè? »  -> ironie: hij vindt het net saai.
B. Na een mislukt gerecht zegt de kok: « Tja, het is niet mijn beste werk. »
   -> understatement: het is eigenlijk mislukt.
C. Iemand komt een uur te laat: « Fijn dat je er al bent. »
   -> ironie/verwijt: je bent veel te laat.</pre>`,
    questions: [
      { type: "qcm", q: "Situation A : « Boeiend, hè? » pendant une réunion ennuyeuse signifie…", opts: ["c'est passionnant", "en réalité, c'est ennuyeux (ironie)", "une vraie question", "un compliment"], a: 1, exp: "Ironie : il pense le contraire de « boeiend »." },
      { type: "input", q: "Situation B : « niet mijn beste werk » est une litote. Le plat est en réalité… ___ (raté)", a: ["mislukt", "slecht"], ph: "un mot", exp: "understatement : le plat est raté." },
      { type: "qcm", q: "Situation C : « Fijn dat je er al bent » à quelqu'un très en retard exprime…", opts: ["de la joie sincère", "un reproche ironique", "une invitation", "de l'indifférence"], a: 1, exp: "Ironie : c'est un reproche sur le retard." },
      { type: "qcm", q: "Quel élément permet SURTOUT de décoder ces phrases ?", opts: ["la grammaire", "le contexte et le ton", "le nombre de mots", "la ponctuation seule"], a: 1, exp: "Le contexte révèle le sens réel." },
      { type: "input", q: "Comment appelle-t-on le fait de dire moins pour signifier plus ? het ___", a: ["understatement"], ph: "un mot", exp: "het understatement = la litote." }
    ],
    solution: `<p>Dans chaque cas, le sens littéral et le sens réel divergent. A. « Passionnant, hein ? » en réunion ennuyeuse = ironie (c'est ennuyeux). B. « Ce n'est pas mon meilleur travail » = litote (le plat est raté). C. « Content que tu sois déjà là » à un retardataire = reproche ironique.</p>
<p>Pour saisir l'implicite : observez le <strong>contexte</strong> (la situation réelle), le <strong>ton</strong>, et les signaux (<strong>alweer, precies wat ik nodig had, niet bepaald</strong>). Ne vous fiez jamais aux seuls mots.</p>`
  }
};
