  title: "Les constructions avec het",
  subtitle: "Le het explétif, anticipateur et impersonnel : un petit mot aux grands rôles.",
  theory: `
<h3>1. Het, plus qu'un simple « le »</h3>
<p>Au-delà de l'article neutre (het huis) et du pronom (ik zie het), <strong>het</strong> occupe des fonctions grammaticales sans équivalent simple en français. Le maîtriser, c'est écrire un néerlandais idiomatique.</p>
<h3>2. Het impersonnel (météo, temps, sensations)</h3>
<p>Comme le « il » de « il pleut », <strong>het</strong> sert de sujet vide aux tournures impersonnelles :</p>
<pre class="pseudo">Het regent.              Il pleut.
Het is koud vandaag.     Il fait froid aujourd'hui.
Het is al laat.          Il est déjà tard.
Het gaat goed met mij.   Je vais bien. (litt. il va bien avec moi)</pre>
<h3>3. Het anticipateur (het … dat / om te)</h3>
<p>Très fréquent : <strong>het</strong> annonce une subordonnée ou une infinitive qui viendra ensuite. Il « tient la place » du vrai sujet ou objet, rejeté plus loin :</p>
<pre class="pseudo">Het is jammer dat je niet kunt komen.
= C'est dommage que tu ne puisses pas venir.

Het is belangrijk om goed te slapen.
= Il est important de bien dormir.

Ik vind het fijn dat je er bent.
= Je trouve agréable que tu sois là.</pre>
<div class="tip">Le « vrai » sujet est la subordonnée. « Dat je niet kunt komen, is jammer » est possible mais lourd ; on préfère anticiper avec het : « Het is jammer dat… ». À l'objet aussi : « Ik waardeer het dat je me helpt. » = J'apprécie que tu m'aides.</div>
<h3>4. Het explétif dans les expressions figées</h3>
<p>De nombreuses expressions contiennent un <strong>het</strong> obligatoire, sans référent précis. Il faut les apprendre telles quelles :</p>
<pre class="pseudo">Ik heb het koud / warm.        J'ai froid / chaud.
Ik heb het druk.               Je suis très occupé.
Ik heb het over jou.           Je parle de toi.
Ze hebben het goed.            Ils vivent bien / ils sont à l'aise.
Het regent dat het giet.       Il pleut à verse.</pre>
<div class="warn">Ne supprime jamais ce het figé. « Ik heb koud » est une faute fréquente du francophone : on dit « Ik heb HET koud ». De même « Ik heb het druk » (je suis débordé), pas « Ik ben druk » au sens d'occupé par le travail.</div>
<h3>5. Het présentatif et l'accord</h3>
<p><strong>Het is / het zijn</strong> introduit et identifie, un peu comme « c'est / ce sont ». L'accent est mis sur ce qui suit :</p>
<pre class="pseudo">Het is mijn broer.        C'est mon frère.
Het zijn mijn ouders.     Ce sont mes parents. (het zijn au pluriel)
Wie is het? — Het is Ann. Qui est-ce ? — C'est Ann.</pre>
<p>Enfin, à ne pas confondre avec <strong>er</strong> : <strong>er</strong> introduit l'existence indéfinie (Er is een probleem = il y a un problème), tandis que <strong>het</strong> annonce ou identifie du défini (Het is een probleem = c'est un problème). « Er staat iemand voor de deur » (il y a quelqu'un) vs « Het is de postbode » (c'est le facteur).</p>`,
  exercises: [

  ],

    intro: `<p>Ce texte réflexif regorge de constructions avec het. Lis-le, puis réponds :</p>
<pre class="pseudo">Het is niet altijd gemakkelijk om in een nieuwe stad te wonen.
In het begin had ik het vaak moeilijk en voelde ik me eenzaam.
Het regende die eerste weken bijna elke dag, wat het er niet beter op maakte.
Toch besefte ik dat het belangrijk was om er zelf iets aan te doen.
Ik vind het nu fijn dat ik toen heb doorgezet.

een praatje met de buren, een vaste bakker, een favoriet café.
Het gaat inmiddels een stuk beter met mij.
Ik waardeer het dat mensen me geholpen hebben zonder dat ik erom vroeg.
Het is die openheid die een vreemde stad tot een thuis maakt.</pre>`,
    questions: [
      { type: "qcm", q: "« Het is niet altijd gemakkelijk om … te wonen » : het est…", opts: ["un article", "un anticipateur de l'infinitive « om te wonen »", "un objet", "la météo"], a: 1, exp: "het annonce l'infinitive : le vrai sujet est « om in een nieuwe stad te wonen »." },
      { type: "input", q: "Relève l'expression figée signifiant « j'avais des difficultés » : « ik had ___ moeilijk »", a: ["het"], ph: "un mot", exp: "het moeilijk hebben = avoir des difficultés." },
      { type: "qcm", q: "« Het regende die eerste weken » : rôle de het ?", opts: ["anticipateur", "impersonnel (météo)", "identification", "objet"], a: 1, exp: "het impersonnel de la météo : il pleuvait." },
      { type: "qcm", q: "« Het zijn vooral de kleine dingen die het verschil maken » : pourquoi « zijn » ?", opts: ["erreur", "accord au pluriel du het présentatif", "c'est un passé", "het est objet"], a: 1, exp: "Het présentatif s'accorde au pluriel : het zijn de kleine dingen." },
      { type: "input", q: "Objet anticipé : « Ik waardeer ___ dat mensen me geholpen hebben. »", a: ["het"], ph: "un mot", exp: "het anticipe la subordonnée objet : j'apprécie que…" }
    ],
    solution: `<p>Traduction : « Ce n'est pas toujours facile de vivre dans une nouvelle ville. Au début, j'avais souvent du mal et je me sentais seul. Il a plu presque chaque jour ces premières semaines, ce qui n'arrangeait rien. Pourtant, j'ai réalisé qu'il était important d'y faire quelque chose moi-même. Je trouve agréable, maintenant, d'avoir persévéré à l'époque. Ce sont surtout les petites choses qui font la différence : une conversation avec les voisins, un boulanger attitré, un café préféré. Je vais désormais nettement mieux. J'apprécie que des gens m'aient aidé sans que je le demande. C'est cette ouverture qui transforme une ville étrangère en un chez-soi. »</p>
<p>Passe en revue les rôles : <strong>anticipateur</strong> (Het is niet gemakkelijk om…, Ik vind het fijn dat…, Ik waardeer het dat…), <strong>impersonnel météo</strong> (Het regende), <strong>expression figée</strong> (ik had het moeilijk, het gaat beter met mij), <strong>présentatif accordé</strong> (Het zijn … de dingen die…). Ce petit mot structure tout le texte : sans lui, le néerlandais sonne faux.</p>`
  }
};
