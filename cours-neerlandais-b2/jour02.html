<script>
var DAY = {
  num: 2,
  title: "Le passif approfondi (worden/zijn, door)",
  subtitle: "Maîtriser le passif d'action et le passif d'état, et introduire l'agent avec door.",
  theory: `
<h3>1. Deux passifs pour deux idées</h3>
<p>Le français n'a qu'un passif (« être + participe »). Le néerlandais en a <strong>deux</strong>, et les confondre change le sens :</p>
<ul>
<li>Le <strong>passif d'action</strong> (worden-passief) décrit l'action en train de se produire : auxiliaire <strong>worden</strong> + participe.</li>
<li>Le <strong>passif d'état</strong> (zijn-passief) décrit le <em>résultat</em>, l'état final : auxiliaire <strong>zijn</strong> + participe.</li>
</ul>
<pre class="pseudo">De deur wordt gesloten.    La porte se ferme / est en train d'être fermée. (action)
De deur is gesloten.       La porte est fermée. (état, résultat)</pre>
<div class="warn">C'est LA difficulté du francophone : « la porte est fermée » peut vouloir dire l'action (worden) ou l'état (zijn). Demande-toi toujours : je décris l'événement ou son résultat ? Événement → worden ; résultat → zijn.</div>
<h3>2. Le passif au passé</h3>
<p>Attention aux formes composées, souvent piégeuses :</p>
<pre class="pseudo">Présent action   De brief wordt geschreven.        La lettre est (en train d'être) écrite.
Prétérit action  De brief werd geschreven.         La lettre était écrite / fut écrite.
Parfait action   De brief is geschreven.           La lettre a été écrite.
Plus-que-parfait De brief was geschreven.          La lettre avait été écrite.</pre>
<p>Remarque cruciale : au parfait, le participe de <strong>worden</strong> (geworden) <strong>disparaît</strong> au passif. On dit <strong>is geschreven</strong>, jamais « is geschreven geworden ». C'est pourquoi le parfait du passif d'action et le passif d'état ont la même forme apparente ; c'est le contexte qui tranche.</p>
<h3>3. L'agent : door + complément</h3>
<p>Pour préciser <em>qui</em> accomplit l'action, on emploie <strong>door</strong> (par) :</p>
<pre class="pseudo">Het huis wordt door een architect ontworpen.   La maison est conçue par un architecte.
De ramen werden door de storm vernield.         Les fenêtres furent détruites par la tempête.</pre>
<p>On distingue parfois <strong>door</strong> (agent qui fait l'action) et <strong>met</strong> (moyen, instrument) : <strong>De brief werd met de hand geschreven.</strong> = La lettre fut écrite à la main (moyen). <strong>De brief werd door Jan geschreven.</strong> = par Jean (agent).</p>
<h3>4. Le passif impersonnel</h3>
<p>Une tournure très néerlandaise : le passif <strong>sans sujet</strong> précis, introduit par <strong>er</strong>. Il met l'accent sur l'action elle-même, pas sur qui la fait.</p>
<pre class="pseudo">Er wordt gedanst.            On danse. (littéralement : il est dansé)
Er werd veel gelachen.       On a beaucoup ri.
Er mag hier niet gerookt worden.   Il est interdit de fumer ici.</pre>
<div class="tip">Le passif impersonnel traduit souvent le « on » français ou une consigne générale. Il est très fréquent dans les annonces, règlements et modes d'emploi : <strong>Er wordt verzocht stil te zijn.</strong> = On est prié de garder le silence.</div>
<h3>5. Quand éviter le passif</h3>
<p>Comme en français, le passif alourdit s'il est surutilisé. Le néerlandais recourt volontiers au <strong>men</strong> (on, registre soutenu) ou à <strong>je/ze</strong> (on, courant) pour rester actif : <strong>Men zegt dat…</strong> / <strong>Ze zeggen dat…</strong> = On dit que… Choisis le passif quand l'agent est inconnu, évident ou secondaire.</p>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire marque le passif d'ACTION ?", opts: ["zijn", "worden", "hebben", "zullen"], a: 1, exp: "worden + participe = passif d'action (processus)." },
    { type: "qcm", q: "« De deur is gesloten » décrit plutôt…", opts: ["l'action de fermer", "l'état / le résultat : la porte est fermée", "un futur", "une habitude"], a: 1, exp: "zijn + participe = passif d'état (résultat)." },
    { type: "input", q: "Complète le passif d'action présent : « De brief ___ geschreven. »", a: ["wordt"], ph: "auxiliaire", exp: "worden au présent 3e pers. = wordt." },
    { type: "vf", q: "Au parfait du passif on dit « is geschreven geworden ».", a: false, exp: "Le participe geworden disparaît : on dit simplement « is geschreven »." },
    { type: "qcm", q: "Pour introduire l'agent (qui fait l'action), on utilise…", opts: ["met", "door", "voor", "van"], a: 1, exp: "door = par (agent) : door een architect." },
    { type: "input", q: "Traduis « à la main » (moyen) : « De brief werd ___ de hand geschreven. »", a: ["met"], ph: "préposition", exp: "met = moyen/instrument ; door = agent." },
    { type: "qcm", q: "« Er wordt gedanst » signifie…", opts: ["La danse est finie", "On danse", "Il danse seul", "Personne ne danse"], a: 1, exp: "Passif impersonnel avec er = « on danse »." },
    { type: "input", q: "Mets au prétérit passif : « De ramen ___ door de storm vernield. »", a: ["werden"], ph: "auxiliaire", exp: "worden au prétérit pluriel = werden." },
    { type: "vf", q: "Le passif impersonnel « Er wordt verzocht stil te zijn » traduit une consigne générale.", a: true, exp: "Fréquent dans annonces et règlements : on est prié de garder le silence." },
    { type: "qcm", q: "« Het huis was gebouwd » exprime…", opts: ["un passif d'action présent", "un plus-que-parfait passif (la maison avait été construite)", "un futur", "un impératif"], a: 1, exp: "was + participe = plus-que-parfait passif." },
    { type: "input", q: "Complète avec l'agent : « Het schilderij werd ___ een beroemde kunstenaar gemaakt. »", a: ["door"], ph: "préposition", exp: "door = par (agent) : par un artiste célèbre." },
    { type: "qcm", q: "Pour éviter le passif en registre soutenu, on peut employer…", opts: ["men (on)", "worden", "door", "er"], a: 0, exp: "men zegt dat… = on dit que… (soutenu)." },
    { type: "vf", q: "« De deur wordt gesloten » insiste sur le processus, pas sur le résultat.", a: true, exp: "worden = action en cours ; le résultat serait « is gesloten »." },
    { type: "qcm", q: "Compréhension : « De weg werd wegens werkzaamheden afgesloten. » Que s'est-il passé ?", opts: ["La route a été rouverte", "La route a été fermée à cause de travaux", "La route sera élargie", "On construit une route"], a: 1, exp: "afgesloten door/wegens werkzaamheden = fermée à cause de travaux." },
    { type: "qcm", q: "Compréhension : « In dit gebouw mag niet gerookt worden. » Cela signifie…", opts: ["On peut fumer partout", "Il est interdit de fumer dans ce bâtiment", "On fume à l'extérieur", "Le bâtiment brûle"], a: 1, exp: "mag niet gerookt worden = interdiction de fumer (passif impersonnel + modal)." }
  ],
  final: {
    title: "Exercice final — Een persbericht",
    intro: `<p>Voici un communiqué au registre formel. Lis-le, puis réponds :</p>
<pre class="pseudo">Gisteren werd in het centrum van Antwerpen een nieuw museum geopend.
Het gebouw werd ontworpen door een internationaal architectenbureau
en werd in slechts twee jaar gebouwd. Tijdens de opening werd er
een toespraak gehouden door de burgemeester. Er werd benadrukt dat
cultuur voor iedereen toegankelijk moet zijn. De toegang is voortaan
gratis voor jongeren onder de achttien. Het museum is intussen door
duizenden bezoekers bewonderd. Men verwacht dat het aantal bezoekers
de komende maanden verder zal stijgen. Er wordt bovendien gewerkt aan
een tweede vleugel, die volgend jaar geopend zal worden.</pre>`,
    questions: [
      { type: "qcm", q: "« werd geopend » est un passif de quel type et à quel temps ?", opts: ["passif d'état présent", "passif d'action au prétérit", "passif impersonnel futur", "actif au parfait"], a: 1, exp: "werd + participe = passif d'action au prétérit : fut ouvert." },
      { type: "input", q: "Relève la préposition qui introduit l'agent dans « ontworpen ___ een architectenbureau »", a: ["door"], ph: "préposition", exp: "door = par (agent)." },
      { type: "qcm", q: "« Er werd een toespraak gehouden » illustre…", opts: ["un passif d'état", "un passif impersonnel (avec er)", "un actif", "un impératif"], a: 1, exp: "er + worden = passif impersonnel mettant l'accent sur l'action." },
      { type: "qcm", q: "« De toegang is gratis » exprime…", opts: ["un passif d'action", "un état actuel (résultat)", "un futur", "un passif impersonnel"], a: 1, exp: "Ici « is » décrit l'état actuel : l'accès est gratuit." },
      { type: "input", q: "Futur passif : « een tweede vleugel, die volgend jaar geopend zal ___ ». Complète.", a: ["worden"], ph: "un verbe", exp: "zal geopend worden = sera ouverte (futur du passif d'action)." }
    ],
    solution: `<p>Traduction : « Hier, un nouveau musée a été inauguré dans le centre d'Anvers. Le bâtiment a été conçu par un cabinet d'architectes international et a été construit en deux ans seulement. Pendant l'inauguration, un discours a été prononcé par le bourgmestre. Il a été souligné que la culture doit être accessible à tous. L'entrée est désormais gratuite pour les jeunes de moins de dix-huit ans. Le musée a entre-temps été admiré par des milliers de visiteurs. On s'attend à ce que le nombre de visiteurs continue d'augmenter dans les mois à venir. On travaille en outre à une deuxième aile, qui sera ouverte l'an prochain. »</p>
<p>Observe l'alternance : <strong>werd + participe</strong> (prétérit d'action : werd geopend, werd gebouwd), <strong>er wordt/werd</strong> (impersonnel : er werd gehouden, er wordt gewerkt), <strong>is + participe</strong> (parfait/état : is bewonderd), <strong>door</strong> pour l'agent, et <strong>men</strong> pour rester actif au registre soutenu.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en néerlandais…",
  items: [
  { id: "nl-b2-j02", title: "Un communiqué au passif", level: 3,
    statement: "Rédige un court communiqué formel (7 à 9 phrases) annonçant un événement (ouverture, rénovation, festival…). Emploie au moins un passif d'action (worden), un passif d'état (zijn), un agent avec door et un passif impersonnel avec er.",
    hints: [
      "Ouvre avec un passif d'action au prétérit : « … werd geopend / georganiseerd ».",
      "Introduis l'agent : « … werd ontworpen door … ».",
      "Ajoute une consigne ou un fait général avec « Er wordt … »."
    ],
    solution: "Vorige week werd in onze stad een nieuw cultureel centrum geopend. Het gebouw werd ontworpen door een lokaal architectenbureau en werd volledig met duurzame materialen gebouwd. Tijdens de opening werd er muziek gespeeld en werden er toespraken gehouden. Er werd benadrukt dat het centrum voor iedereen toegankelijk is. De grote zaal is intussen al door honderden bezoekers gebruikt. Men verwacht dat het centrum snel populair zal worden. Bezoekers wordt verzocht hun tickets vooraf te reserveren.\n\nTraduction : La semaine dernière, un nouveau centre culturel a été inauguré dans notre ville. Le bâtiment a été conçu par un cabinet d'architectes local et a été entièrement construit avec des matériaux durables. Pendant l'inauguration, de la musique a été jouée et des discours ont été prononcés. Il a été souligné que le centre est accessible à tous. La grande salle a déjà été utilisée par des centaines de visiteurs. On s'attend à ce que le centre devienne rapidement populaire. Les visiteurs sont priés de réserver leurs billets à l'avance.",
    note: "Le communiqué est le terrain naturel du passif : l'action prime sur l'agent. Mais dose-le : un « men » ou un actif de temps à autre évite la lourdeur. Vérifie qu'au parfait tu n'écris jamais « geworden » après un autre participe." }
  ]
};
</script>
