  theory: `
<h3>1. Le vocabulaire du parcours — het loopbaanvocabulaire</h3>
<p>Pour parler de sa carrière (<strong>de loopbaan</strong> / <strong>de carrière</strong>), quelques mots-clés reviennent sans cesse :</p>
<pre class="pseudo">de opleiding        la formation / les études
de ervaring         l'expérience
de vaardigheid      la compétence
de functie          le poste, la fonction
de werkgever        l'employeur
de sollicitatie     la candidature
solliciteren        postuler
in dienst treden    entrer en fonction
ontslag nemen       démissionner
promotie maken      être promu</pre>
<h3>2. Raconter le passé : le parfait (voltooid tegenwoordige tijd)</h3>
<p>Pour raconter ce qu'on a fait, on emploie surtout le <strong>parfait</strong> : auxiliaire <strong>hebben</strong> (ou <strong>zijn</strong>) + participe passé rejeté à la fin.</p>
<pre class="pseudo">Ik heb vijf jaar bij een bank gewerkt.
   J'ai travaillé cinq ans dans une banque.
Ik heb rechten gestudeerd aan de universiteit van Gent.
   J'ai étudié le droit à l'université de Gand.
Ik ben in 2019 afgestudeerd.
   J'ai obtenu mon diplôme en 2019.</pre>
<div class="tip">Les verbes de changement d'état ou de mouvement prennent <strong>zijn</strong> : <strong>afstuderen</strong> (obtenir son diplôme), <strong>overstappen</strong> (changer d'employeur) → « ik ben overgestapt ».</div>
<h3>3. Décrire ses compétences et qualités</h3>
<pre class="pseudo">Ik ben goed in samenwerken.       Je suis bon en travail d'équipe.
Ik kan goed onder druk werken.    Je sais bien travailler sous pression.
Ik werk zelfstandig en nauwkeurig. Je travaille de façon autonome et précise.
Ik heb leidinggevende ervaring.   J'ai de l'expérience en management.</pre>
<p>Notez la structure <strong>goed zijn in + verbe en -en</strong> et <strong>ervaring hebben met/in</strong>.</p>
<h3>4. Relier les étapes dans le temps</h3>
<pre class="pseudo">eerst        d'abord        daarna       ensuite
vervolgens   puis           ten slotte   enfin
sinds        depuis         gedurende    pendant
in die tijd  à cette époque momenteel    actuellement</pre>
<div class="warn">Attention à la place du participe : il part TOUJOURS à la fin de la proposition principale. « Ik heb daarna bij Philips <strong>gewerkt</strong> », jamais « Ik heb gewerkt bij Philips daarna ».</div>`,

    { type: "input", q: "Complète : « Ik heb vijf jaar bij een bank ___. » (travailler, parfait)", a: ["gewerkt"], ph: "participe passé", exp: "werken → gewerkt." },

    { type: "input", q: "Traduis « la candidature » : de ___", a: ["sollicitatie"], ph: "un nom", exp: "de sollicitatie = la candidature." },

      { type: "qcm", q: "À quel poste a-t-il été promu dans l'entreprise IT ?", opts: ["directeur", "chef de projet", "comptable", "stagiaire"], a: 1, exp: "promotie tot projectleider." },
      { type: "input", q: "Complète une de ses forces : « Ik ben goed in ___. » (négocier)", a: ["onderhandelen"], ph: "un verbe", exp: "goed in onderhandelen = bon en négociation." }
    ],
    solution: `<p>Traduction : « Je m'appelle Wouter, j'ai quarante ans. J'ai étudié l'économie à l'université d'Anvers et j'ai obtenu mon diplôme en 2008. J'ai d'abord travaillé trois ans dans une compagnie d'assurances. Ensuite je suis passé dans une grande entreprise informatique, où j'ai été promu chef de projet. Depuis l'an dernier je travaille en indépendant comme conseiller. Je suis bon en négociation et je sais bien travailler sous pression. »</p>
<p>Pour raconter un parcours : parfait (<strong>heb gewerkt, ben afgestudeerd</strong>), connecteurs temporels (<strong>eerst, daarna, sinds</strong>) et compétences (<strong>goed in…, ik kan…</strong>).</p>`
  }
