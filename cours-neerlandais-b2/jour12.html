<script>
var DAY = {
  num: 12,
  title: "Le registre : formel ou informel",
  subtitle: "Adapter le ton : tutoiement, vouvoiement, vocabulaire et formules selon la situation.",
  theory: `
<h3>1. Deux mondes : jij et u</h3>
<p>Le choix du pronom d'adresse est le premier marqueur de registre. <strong>je / jij</strong> (tutoiement) s'emploie entre proches, jeunes, collègues familiers ; <strong>u</strong> (vouvoiement) marque le respect, la distance, le contexte professionnel ou commercial.</p>
<pre class="pseudo">Informel   Hoe gaat het met je?        Comment vas-tu ?
Formel     Hoe gaat het met u?         Comment allez-vous ?
Informel   Kun je me helpen?           Peux-tu m'aider ?
Formel     Zou u mij kunnen helpen?    Pourriez-vous m'aider ?</pre>
<div class="warn">Aux Pays-Bas, le tutoiement (je) est aujourd'hui plus répandu qu'en Belgique, où le « u/gij » reste courant. Dans le doute professionnel, commence par <strong>u</strong> ; on passe au « je » sur invitation (« Je mag me tutoyeren / Zeg maar je »).</div>
<h3>2. Le vocabulaire change de registre</h3>
<p>Le même sens se dit avec des mots différents selon le ton. Le registre formel préfère souvent des mots plus longs, d'origine latine ou plus abstraits :</p>
<pre class="pseudo">Informel            Formel                 Sens
kopen               aanschaffen            acheter
krijgen             ontvangen              recevoir
beginnen            aanvangen              commencer
genoeg              voldoende              suffisamment
een beetje          enigszins              quelque peu
maar                echter                 cependant
dus                 derhalve / bijgevolg   par conséquent
vragen              verzoeken              demander (prier)</pre>
<h3>3. Les formules de politesse écrites</h3>
<p>Une lettre ou un e-mail formel obéit à des formules figées :</p>
<pre class="pseudo">Ouverture formelle   Geachte heer Jansen, / Geachte mevrouw De Vries,
Ouverture neutre     Beste meneer Jansen, / Beste Anna,
Clôture formelle     Met vriendelijke groet, / Hoogachtend,
Clôture informelle   Groetjes, / Tot snel! / Liefs,
Demande formelle     Ik zou u willen verzoeken om…
Demande informelle   Kun je even…?</pre>
<div class="tip">« Hoogachtend » est très solennel (proche de « Veuillez agréer… ») et se réserve aux lettres officielles ou à un destinataire inconnu. « Met vriendelijke groet » (souvent abrégé « mvg ») est le standard passe-partout professionnel.</div>
<h3>4. La politesse par la modalisation</h3>
<p>Le formel adoucit les demandes par le conditionnel et des tournures indirectes :</p>
<pre class="pseudo">Direct (informel)      Geef me het rapport.        Donne-moi le rapport.
Poli (formel)          Zou u mij het rapport kunnen bezorgen?
Direct                 Ik wil een afspraak.        Je veux un rendez-vous.
Poli                   Ik zou graag een afspraak willen maken.
Direct                 Dat klopt niet.             C'est faux.
Nuancé                 Dat lijkt me niet helemaal juist.  Cela ne me semble pas tout à fait exact.</pre>
<h3>5. Reconnaître et ajuster le ton</h3>
<p>Le B2 sait <strong>identifier</strong> un registre et <strong>reformuler</strong> d'un ton à l'autre. Repère les signaux : pronom (je/u), longueur des mots, contractions familières (ff = even, ff bellen), interjections (hè, hoor, joh), et formules figées. Un message pro ne dira jamais « Hoi, kun je ff terugbellen? » mais « Geachte heer, zou u mij kunnen terugbellen? ».</p>`,
  exercises: [
    { type: "qcm", q: "Quel pronom marque le vouvoiement formel ?", opts: ["je", "jij", "u", "jullie"], a: 2, exp: "u = vouvoiement (respect, distance, contexte pro)." },
    { type: "input", q: "Version formelle de « Kun je me helpen? » : « Zou ___ mij kunnen helpen? »", a: ["u"], ph: "pronom", exp: "u + conditionnel zou = registre formel et poli." },
    { type: "qcm", q: "Registre formel de « kopen » (acheter) :", opts: ["pakken", "aanschaffen", "krijgen", "halen"], a: 1, exp: "aanschaffen = acheter (registre soutenu)." },
    { type: "input", q: "Formel de « krijgen » (recevoir) : « Ik heb uw brief ___. »", a: ["ontvangen"], ph: "verbe", exp: "ontvangen = recevoir (formel) ; krijgen est neutre/familier." },
    { type: "qcm", q: "« Geachte mevrouw De Vries » est une ouverture…", opts: ["informelle", "formelle", "orale", "familière"], a: 1, exp: "Geachte + nom = ouverture de lettre formelle." },
    { type: "input", q: "Clôture professionnelle standard : « Met vriendelijke ___ , »", a: ["groet"], ph: "un mot", exp: "Met vriendelijke groet (mvg) = cordialement." },
    { type: "qcm", q: "« Hoogachtend » convient…", opts: ["à un ami proche", "à une lettre officielle / destinataire inconnu", "à un SMS", "à un chat"], a: 1, exp: "Hoogachtend = formule très solennelle." },
    { type: "input", q: "Formel de « maar » (cependant) : « Het plan is goed. Het is ___ duur. »", a: ["echter"], ph: "connecteur", exp: "echter = cependant (registre écrit soigné)." },
    { type: "vf", q: "« Zou u mij het rapport kunnen bezorgen? » est plus poli que « Geef me het rapport ».", a: true, exp: "Le conditionnel + u + tournure indirecte adoucit la demande." },
    { type: "qcm", q: "« Hoi, kun je ff terugbellen? » relève du registre…", opts: ["formel", "informel / familier", "juridique", "littéraire"], a: 1, exp: "hoi + ff (even) = très familier, inadapté au pro." },
    { type: "input", q: "Formel de « genoeg » (suffisamment) : « Er is ___ tijd. »", a: ["voldoende"], ph: "un mot", exp: "voldoende = suffisamment (registre soutenu)." },
    { type: "qcm", q: "« derhalve » / « bijgevolg » sont des équivalents formels de…", opts: ["maar", "dus (par conséquent)", "want", "of"], a: 1, exp: "derhalve / bijgevolg = par conséquent (formel)." },
    { type: "vf", q: "En Belgique, le « u » reste plus courant qu'aux Pays-Bas où « je » domine davantage.", a: true, exp: "Différence régionale d'usage du tutoiement/vouvoiement." },
    { type: "qcm", q: "Compréhension : « Ik zou u willen verzoeken om het formulier in te vullen. » Ce ton est…", opts: ["familier et direct", "formel et poli (je vous prierais de…)", "agressif", "enfantin"], a: 1, exp: "verzoeken + zou willen = demande très polie et formelle." },
    { type: "qcm", q: "Compréhension : « Zeg maar je, hoor! » signifie…", opts: ["Dis quelque chose", "Tu peux me tutoyer", "Parle plus fort", "Au revoir"], a: 1, exp: "Invitation à passer au tutoiement (je)." }
  ],
  final: {
    title: "Exercice final — Twee versies van hetzelfde bericht",
    intro: `<p>Voici le même message dans deux registres. Lis-les, puis réponds :</p>
<pre class="pseudo">INFORMEEL (aan een collega-vriend):
Hoi Tom,
Kun je me ff het verslag doorsturen? Ik heb het nu nodig, thanks!
Groetjes, Sara

FORMEEL (aan een klant):
Geachte heer Willems,
Naar aanleiding van ons gesprek zou ik u willen verzoeken
het verslag aan mij te bezorgen. Ik zou het graag vandaag nog ontvangen.
Alvast hartelijk dank voor uw medewerking.
Met vriendelijke groet,
Sara Jacobs</pre>`,
    questions: [
      { type: "qcm", q: "Quel élément trahit le registre INFORMEL du premier message ?", opts: ["Geachte heer", "Hoi + ff + thanks", "verzoeken", "Met vriendelijke groet"], a: 1, exp: "Hoi, ff (even) et thanks sont familiers." },
      { type: "input", q: "Dans la version formelle, quel verbe remplace le familier « krijgen » (recevoir) ? « Ik zou het graag vandaag nog ___ . »", a: ["ontvangen"], ph: "verbe", exp: "ontvangen = recevoir (formel)." },
      { type: "qcm", q: "« zou ik u willen verzoeken » exprime…", opts: ["un ordre direct", "une demande polie et formelle", "une menace", "une plaisanterie"], a: 1, exp: "verzoeken + conditionnel = registre très poli." },
      { type: "qcm", q: "La clôture « Groetjes » appartient au registre…", opts: ["formel", "informel", "juridique", "littéraire"], a: 1, exp: "Groetjes = clôture familière ; le formel serait « Met vriendelijke groet »." },
      { type: "input", q: "Quel pronom d'adresse emploie la version formelle ? Un seul mot.", a: ["u"], ph: "pronom", exp: "u = vouvoiement, marqueur du registre formel." }
    ],
    solution: `<p>Traduction (informel) : « Salut Tom, Tu peux vite me transférer le rapport ? J'en ai besoin maintenant, merci ! Bises, Sara. » — (formel) : « Monsieur Willems, Suite à notre entretien, je souhaiterais vous prier de me faire parvenir le rapport. Je voudrais le recevoir dès aujourd'hui. Merci d'avance pour votre collaboration. Cordialement, Sara Jacobs. »</p>
<p>Compare terme à terme : le pronom (<strong>je → u</strong>), le vocabulaire (<strong>doorsturen/krijgen → bezorgen/ontvangen</strong>), l'ouverture (<strong>Hoi → Geachte heer</strong>), la clôture (<strong>Groetjes → Met vriendelijke groet</strong>), et la modalisation (<strong>Kun je → zou ik u willen verzoeken</strong>). Le message informel est bref et direct ; le formel est indirect, modalisé et étoffé. Savoir passer de l'un à l'autre, c'est maîtriser le registre.</p>`
  }
};
</script>
