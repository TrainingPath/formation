<script>
var DAY = {
  num: 5,
  title: "Als, wanneer, toen : traduire « quand »",
  subtitle: "Choisir la bonne conjonction selon le temps et la répétition de l'action.",
  theory: `
<h3>1. Un mot français, trois néerlandais</h3>
<p>Le français « quand » recouvre trois conjonctions néerlandaises qu'on ne peut pas interchanger. Le choix dépend de deux critères : le <strong>temps</strong> (passé / présent-futur) et la <strong>répétition</strong> (une seule fois / plusieurs fois).</p>
<pre class="pseudo">TOEN     passé, action UNIQUE            Toen ik klein was, woonde ik in Gent.
ALS      présent/futur OU passé répété   Als ik tijd heb, lees ik.  /  Als ik klein was, speelde ik vaak.
WANNEER  question + moment précis        Wanneer kom je?  Ik weet niet wanneer hij komt.</pre>
<h3>2. TOEN : le passé unique</h3>
<p><strong>toen</strong> ne s'emploie QUE pour une action <em>passée</em> et <em>ponctuelle / unique</em> (ou une situation continue non répétée). C'est la traduction de « lorsque, quand » dans un récit :</p>
<pre class="pseudo">Toen de telefoon ging, sliep ik nog.     Quand le téléphone a sonné, je dormais encore.
Toen ze binnenkwam, stond iedereen op.   Quand elle est entrée, tout le monde s'est levé.</pre>
<div class="warn">Erreur classique du francophone : employer « als » pour un fait passé unique. « Als de telefoon ging… » suggère « chaque fois que le téléphone sonnait ». Pour un événement unique au passé, c'est TOUJOURS toen.</div>
<h3>3. ALS : présent, futur et passé répété</h3>
<p><strong>als</strong> couvre deux emplois :</p>
<ul>
<li>Le <strong>présent / futur</strong> (souvent proche de « si / chaque fois que ») : <strong>Als het regent, blijf ik thuis.</strong> = Quand / s'il pleut, je reste chez moi.</li>
<li>Le <strong>passé répété / habituel</strong> : <strong>Als we op vakantie waren, gingen we altijd zwemmen.</strong> = Quand nous étions en vacances, nous allions toujours nager.</li>
</ul>
<p>Rappel : als introduit une subordonnée, donc le verbe part à la fin, et si la subordonnée ouvre la phrase, la principale s'inverse.</p>
<h3>4. WANNEER : la question et le moment précis</h3>
<p><strong>wanneer</strong> s'emploie surtout dans les <strong>questions</strong> (directes ou indirectes) portant sur le moment :</p>
<pre class="pseudo">Wanneer begint de film?           Quand commence le film ?
Weet jij wanneer de trein komt?    Sais-tu quand le train arrive ?
Ik herinner me nog de dag wanneer…  (ou : de dag waarop… — plus soutenu)</pre>
<p>Dans un registre soutenu, <strong>wanneer</strong> peut remplacer <strong>als</strong> au présent/futur : <strong>Wanneer u vragen heeft, kunt u ons bellen.</strong> (formel) = Lorsque vous avez des questions, vous pouvez nous appeler.</p>
<div class="tip">Mémo rapide : passé + une fois → TOEN ; passé + plusieurs fois → ALS ; présent/futur → ALS (ou WANNEER soutenu) ; question sur le moment → WANNEER.</div>
<h3>5. Ne pas confondre avec « si » conditionnel</h3>
<p><strong>als</strong> signifie aussi « si » (condition). Le contexte tranche : <strong>Als je komt, bel me.</strong> peut être « quand tu viens » ou « si tu viens ». Pour lever l'ambiguïté en registre soutenu, on emploie <strong>indien</strong> pour « si » : <strong>Indien u niet tevreden bent, krijgt u uw geld terug.</strong></p>`,
  exercises: [
    { type: "qcm", q: "Pour un événement passé UNIQUE, on emploie…", opts: ["als", "toen", "wanneer", "indien"], a: 1, exp: "toen = quand, passé + action unique." },
    { type: "input", q: "Complète : « ___ ik klein was, woonde ik in Gent. » (passé unique)", a: ["toen"], ph: "conjonction", exp: "Situation passée unique : toen." },
    { type: "qcm", q: "« Als het regent, blijf ik thuis » se situe…", opts: ["dans le passé unique", "au présent/futur (quand/si)", "dans une question", "nulle part"], a: 1, exp: "als au présent = quand / chaque fois que / si." },
    { type: "input", q: "Passé RÉPÉTÉ : « ___ we op vakantie waren, gingen we altijd zwemmen. »", a: ["als"], ph: "conjonction", exp: "Passé habituel/répété : als (pas toen)." },
    { type: "qcm", q: "Dans une question sur le moment (« Quand commence le film ? »), on emploie…", opts: ["toen", "als", "wanneer", "omdat"], a: 2, exp: "Wanneer begint de film ? (question sur le moment)." },
    { type: "vf", q: "« Als de telefoon ging, sliep ik nog » est correct pour un événement passé unique.", a: false, exp: "Faux : pour un fait passé unique il faut toen. « Als » suggérerait la répétition." },
    { type: "input", q: "Question indirecte : « Weet jij ___ de trein komt? »", a: ["wanneer"], ph: "conjonction", exp: "Interrogation indirecte sur le moment : wanneer." },
    { type: "qcm", q: "« Toen ze binnenkwam, stond iedereen op » : le verbe de la principale est en tête parce que…", opts: ["c'est une question", "la subordonnée ouvre la phrase, d'où l'inversion", "c'est une erreur", "toen l'exige toujours"], a: 1, exp: "Subordonnée en tête → principale en inversion (verbe d'abord)." },
    { type: "qcm", q: "Pour « si » conditionnel en registre soutenu, on préfère…", opts: ["toen", "wanneer", "indien", "terwijl"], a: 2, exp: "indien = si (condition, soutenu)." },
    { type: "input", q: "Récit : « ___ de oorlog begon, was hij nog een kind. » (passé unique)", a: ["toen"], ph: "conjonction", exp: "Fait passé unique : toen." },
    { type: "qcm", q: "« Wanneer u vragen heeft, kunt u ons bellen » appartient à quel registre ?", opts: ["familier", "soutenu / formel", "argotique", "enfantin"], a: 1, exp: "wanneer + u = registre formel remplaçant als." },
    { type: "vf", q: "« als » peut signifier à la fois « quand » et « si ».", a: true, exp: "Le contexte tranche ; indien lève l'ambiguïté pour « si »." },
    { type: "input", q: "Présent/futur : « ___ ik tijd heb, help ik je. »", a: ["als"], ph: "conjonction", exp: "Présent/futur : als (quand / si j'ai le temps)." },
    { type: "qcm", q: "Compréhension : « Elke keer als ik hem zag, groette hij vriendelijk. » L'action est…", opts: ["unique au passé", "répétée dans le passé", "future", "présente"], a: 1, exp: "elke keer als = chaque fois que : passé répété, d'où als." },
    { type: "qcm", q: "Compréhension : « Ik weet nog goed hoe blij ik was toen ik slaagde. » « toen » renvoie à…", opts: ["une habitude", "un moment passé précis (ma réussite)", "le futur", "une question"], a: 1, exp: "toen ik slaagde = quand j'ai réussi (moment passé unique)." }
  ],
  final: {
    title: "Exercice final — Herinneringen aan vroeger",
    intro: `<p>Ce texte de souvenirs mêle les trois « quand ». Lis-le, puis réponds :</p>
<pre class="pseudo">Toen ik nog een kind was, brachten we elke zomer door aan de kust.
Als het weer mooi was, gingen we altijd vroeg naar het strand.
Ik herinner me nog goed de dag waarop een storm ons verraste:
toen de golven plotseling hoger werden, riep mijn moeder ons terug.
Wanneer ik nu aan die zomers denk, voel ik meteen weer die vrijheid.
Als ik ooit kinderen heb, wil ik hun diezelfde momenten schenken.
Ik weet alleen nog niet wanneer dat zal gebeuren.
Maar telkens als ik de zee ruik, komt alles weer boven.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi « Toen ik nog een kind was » et non « Als » ?", opts: ["habitude répétée", "situation passée unique/continue non répétée", "question", "condition"], a: 1, exp: "toen = période passée envisagée comme un cadre unique." },
      { type: "input", q: "Relève la conjonction du passé RÉPÉTÉ : « ___ het weer mooi was, gingen we naar het strand. »", a: ["als"], ph: "conjonction", exp: "Passé habituel/répété : als." },
      { type: "qcm", q: "« toen de golven plotseling hoger werden » exprime…", opts: ["une habitude", "un événement passé unique et soudain", "une question", "un futur"], a: 1, exp: "Événement passé ponctuel : toen." },
      { type: "qcm", q: "« Wanneer ik nu aan die zomers denk » : ici wanneer a le sens de…", opts: ["une question", "chaque fois que / lorsque (présent, registre soutenu)", "un passé unique", "si"], a: 1, exp: "wanneer au présent, registre soutenu, = lorsque / chaque fois que." },
      { type: "input", q: "Interrogation indirecte : « Ik weet nog niet ___ dat zal gebeuren. »", a: ["wanneer"], ph: "conjonction", exp: "Interrogation indirecte sur le moment : wanneer." }
    ],
    solution: `<p>Traduction : « Quand j'étais encore enfant, nous passions chaque été sur la côte. Quand le temps était beau, nous allions toujours tôt à la plage. Je me souviens encore bien du jour où une tempête nous surprit : quand les vagues sont soudain devenues plus hautes, ma mère nous a rappelés. Quand je pense maintenant à ces étés, je ressens aussitôt cette liberté. Si j'ai un jour des enfants, je veux leur offrir ces mêmes moments. Je ne sais simplement pas encore quand cela arrivera. Mais chaque fois que je sens l'odeur de la mer, tout remonte. »</p>
<p>Le récit illustre les quatre cas : <strong>toen</strong> pour le cadre passé (toen ik een kind was) et l'événement passé unique (toen de golven hoger werden) ; <strong>als</strong> pour l'habitude passée (als het weer mooi was), le futur/condition (als ik kinderen heb) et la répétition présente (telkens als) ; <strong>wanneer</strong> pour le présent soutenu (wanneer ik denk) et l'interrogation indirecte (wanneer dat zal gebeuren) ; enfin <strong>waarop</strong> pour « le jour où » (plus soutenu que wanneer).</p>`
  }
};
</script>

    hints: [
      "Cadre passé unique : « Toen ik klein was, … ».",
      "Habitude passée : « Als het … was, gingen we altijd … ».",
      "Interrogation indirecte : « Ik weet niet meer wanneer … »."
    ],
    solution: "Toen ik klein was, woonde ik op het platteland bij mijn grootouders. Als het zomer was, speelden we elke dag buiten tot het donker werd. Ik herinner me nog goed de dag waarop mijn opa me leerde fietsen: toen ik voor het eerst zonder hulp reed, was ik dolgelukkig. Wanneer ik nu aan die tijd terugdenk, mis ik de eenvoud van toen. Als ik later zelf kinderen heb, wil ik hun ook zo'n vrije jeugd geven. Ik weet alleen nog niet wanneer dat mogelijk zal zijn. Maar telkens als ik vers gemaaid gras ruik, ben ik meteen weer dat kind.\n\nTraduction : Quand j'étais petit, j'habitais à la campagne chez mes grands-parents. Quand c'était l'été, nous jouions dehors chaque jour jusqu'à la nuit. Je me souviens encore bien du jour où mon grand-père m'a appris à faire du vélo : quand j'ai roulé pour la première fois sans aide, j'étais fou de joie. Quand je repense maintenant à cette époque, la simplicité d'alors me manque. Si j'ai plus tard mes propres enfants, je veux leur donner aussi une enfance aussi libre. Je ne sais simplement pas encore quand ce sera possible. Mais chaque fois que je sens l'odeur de l'herbe fraîchement coupée, je redeviens aussitôt cet enfant.",

  ]
};
