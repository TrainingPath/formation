<script>
var DAY = {
  num: 29,
  title: "Projet final (3) : l'entretien d'embauche complet",
  subtitle: "Un sollicitatiegesprek de A à Z : questions, réponses STAR et expressions utiles.",
  theory: `
<h3>Le projet final — réussir un entretien d'embauche en néerlandais</h3>
<p>Deuxième grand projet du niveau B2 : mener un <strong>entretien d'embauche (het sollicitatiegesprek)</strong> complet. Tu vas lire un dialogue modèle entre un candidat (de sollicitant) et une recruteuse (de recruiter), découvrir la <strong>méthode STAR</strong> pour structurer tes réponses, puis t'entraîner avec une banque de questions et d'expressions. Objectif : rester fluide et convaincant, même sous pression.</p>
<div class="tip">Aide lexicale — de woordenlijst :<br>
solliciteren = postuler · de sollicitant = le candidat · de recruiter / de personeelschef = le recruteur · de vacature = l'offre d'emploi · het cv = le CV · de motivatiebrief = la lettre de motivation · de ervaring = l'expérience · de vaardigheid = la compétence · de sterke/zwakke punten = les points forts/faibles · het salaris / het loon = le salaire · de proeftijd = la période d'essai · aannemen = embaucher · de uitdaging = le défi · de doelstelling = l'objectif.</div>
<h3>De STAR-methode</h3>
<p>Pour répondre aux questions sur ton comportement (« Vertel eens over een moeilijke situatie… »), structure ta réponse en quatre étapes, la <strong>STAR-methode</strong> :</p>
<div class="tip"><strong>S</strong>ituatie = la situation (le contexte) · <strong>T</strong>aak = la tâche (ton rôle) · <strong>A</strong>ctie = l'action (ce que TU as fait) · <strong>R</strong>esultaat = le résultat (l'effet concret, si possible chiffré).</div>
<h3>Modelgesprek — le dialogue modèle</h3>
<p><strong>Recruiter :</strong> Goedemorgen, welkom. Fijn dat u er bent. Kunt u zichzelf kort voorstellen ?<br>
<strong>Sollicitant :</strong> Goedemorgen, dank u wel voor de uitnodiging. Mijn naam is Sofie Maes. Ik ben drie jaar geleden afgestudeerd in marketing en werk sindsdien als communicatiemedewerker. Ik zoek nu een nieuwe uitdaging bij een groter bedrijf.</p>
<p><strong>Recruiter :</strong> Waarom heeft u op deze vacature gesolliciteerd ?<br>
<strong>Sollicitant :</strong> Uw bedrijf staat bekend om zijn innovatieve projecten, en dat spreekt mij enorm aan. Bovendien past de functie perfect bij mijn ervaring in digitale communicatie. Ik wil graag bijdragen aan een team dat vooruit denkt.</p>
<p><strong>Recruiter :</strong> Wat zijn uw sterke punten ?<br>
<strong>Sollicitant :</strong> Ik ben georganiseerd, ik werk goed samen en ik blijf rustig onder druk. Als iets misloopt, zoek ik meteen naar een oplossing in plaats van te panikeren.</p>
<p><strong>Recruiter :</strong> En uw zwakke punten ?<br>
<strong>Sollicitant :</strong> Vroeger nam ik te veel taken tegelijk op mij. Ik heb geleerd om beter te delegeren en prioriteiten te stellen. Daardoor werk ik nu efficiënter.</p>
<p><strong>Recruiter :</strong> Vertel eens over een moeilijke situatie op het werk en hoe u die hebt opgelost.<br>
<strong>Sollicitant :</strong> Zeker. <em>(Situatie)</em> Vorig jaar viel een collega plots uit tijdens een belangrijke campagne. <em>(Taak)</em> Ik moest op korte termijn haar taken overnemen. <em>(Actie)</em> Ik heb de planning opnieuw georganiseerd en het team elke dag kort geïnformeerd. <em>(Resultaat)</em> De campagne werd op tijd gelanceerd en behaalde twintig procent meer bereik dan verwacht.</p>
<p><strong>Recruiter :</strong> Waar ziet u zichzelf over vijf jaar ?<br>
<strong>Sollicitant :</strong> Ik zou graag doorgroeien naar een rol met meer verantwoordelijkheid, bijvoorbeeld als projectleider. Ik hecht veel belang aan blijven leren.</p>
<p><strong>Recruiter :</strong> Heeft u zelf nog vragen ?<br>
<strong>Sollicitant :</strong> Ja, graag. Hoe ziet een typische werkdag in dit team eruit ? En zijn er mogelijkheden om bijscholing te volgen ?</p>
<p><strong>Recruiter :</strong> Uitstekende vragen. Wij nemen binnen een week contact met u op. Bedankt voor uw tijd.<br>
<strong>Sollicitant :</strong> Ik dank u hartelijk voor dit gesprek. Ik kijk uit naar uw antwoord.</p>
<h3>Vragenbank — questions classiques du recruteur</h3>
<div class="tip">Wat weet u over ons bedrijf ? · Waarom wilt u van baan veranderen ? · Hoe gaat u om met stress ? · Kunt u een voorbeeld geven van teamwork ? · Wat motiveert u het meest ? · Wat verwacht u qua salaris ? · Wanneer kunt u beginnen ?</div>
<h3>Nuttige uitdrukkingen — expressions utiles</h3>
<div class="tip">Voor mij is het belangrijk dat… = pour moi, il est important que… · Ik heb ervaring met… = j'ai de l'expérience avec… · Een concreet voorbeeld daarvan is… = un exemple concret en est… · Ik zou zeggen dat mijn grootste kwaliteit… is = je dirais que ma plus grande qualité est… · Dat is een goede vraag = c'est une bonne question (pour gagner du temps) · Mag ik daar even over nadenken ? = puis-je y réfléchir un instant ?</div>
<div class="warn">Règles d'or : vouvoie le recruteur (u), donne des exemples concrets et chiffrés (méthode STAR), transforme une faiblesse en apprentissage, et prépare toujours 2 questions à poser à la fin.</div>`,
  exercises: [
    { type: "input", q: "Comment dit-on « postuler » en néerlandais (l'infinitif) ?", a: ["solliciteren"], ph: "un verbe", exp: "solliciteren op een vacature." },
    { type: "qcm", q: "Que signifie l'acronyme STAR ?", opts: ["Snel, Team, Alert, Rust", "Situatie, Taak, Actie, Resultaat", "Start, Talent, Antwoord, Rol", "Salaris, Tijd, Antwoord, Ronde"], a: 1, exp: "Situatie – Taak – Actie – Resultaat." },
    { type: "qcm", q: "Dans STAR, que décrit le « A » (Actie) ?", opts: ["le contexte général", "ce que TU as concrètement fait", "le résultat final", "le rôle de l'équipe"], a: 1, exp: "Actie = ce que tu as fait toi-même." },
    { type: "input", q: "Comment se présente la candidate ? « Mijn ___ is Sofie Maes. » (nom)", a: ["naam"], ph: "un mot", exp: "Mijn naam is…" },
    { type: "qcm", q: "Pourquoi la candidate postule-t-elle dans cette entreprise ?", opts: ["pour le salaire", "car l'entreprise est connue pour ses projets innovants", "car c'est près de chez elle", "par hasard"], a: 1, exp: "bekend om zijn innovatieve projecten." },
    { type: "vf", q: "Pour parler de son point faible, la candidate le transforme en apprentissage.", a: true, exp: "Ik heb geleerd om beter te delegeren." },
    { type: "input", q: "Complète : « Ik blijf rustig onder ___. » (pression)", a: ["druk"], ph: "un nom", exp: "rustig onder druk = calme sous pression." },
    { type: "qcm", q: "Dans son exemple STAR, quel est le RÉSULTAT (Resultaat) ?", opts: ["une collègue est tombée malade", "elle a réorganisé le planning", "la campagne a été lancée à temps avec 20% de portée en plus", "elle a repris les tâches"], a: 2, exp: "Le résultat concret et chiffré." },
    { type: "qcm", q: "Que répond la candidate à « Où vous voyez-vous dans 5 ans ? »", opts: ["elle ne sait pas", "évoluer vers un rôle à plus de responsabilité, ex. chef de projet", "changer de secteur", "prendre sa retraite"], a: 1, exp: "doorgroeien naar meer verantwoordelijkheid." },
    { type: "vf", q: "À la fin, il vaut mieux ne poser aucune question au recruteur.", a: false, exp: "Faux : prépare toujours 2 questions (bijv. over bijscholing)." },
    { type: "input", q: "Formule pour gagner du temps : « Dat is een goede ___. » (question)", a: ["vraag"], ph: "un nom", exp: "Dat is een goede vraag." },
    { type: "qcm", q: "Comment dit-on « la période d'essai » ?", opts: ["de vacature", "de proeftijd", "het salaris", "de motivatiebrief"], a: 1, exp: "de proeftijd = la période d'essai." },
    { type: "qcm", q: "Quelle est la bonne formule de politesse pour vouvoyer en entretien ?", opts: ["jij / je", "u", "gij", "wij"], a: 1, exp: "On vouvoie avec « u »." },
    { type: "input", q: "Une bonne question à poser : « Zijn er mogelijkheden om ___ te volgen ? » (formation continue)", a: ["bijscholing"], ph: "un nom", exp: "bijscholing = formation continue." },
    { type: "vf", q: "Donner des exemples concrets et chiffrés renforce une réponse en entretien.", a: true, exp: "Concreet en met cijfers = overtuigend." }
  ],
  final: {
    title: "Exercice final — Jouw sollicitatiegesprek",
    intro: `<p>Tu passes maintenant l'entretien. Applique la logique du modèle et de la méthode STAR pour répondre correctement.</p>
<pre class="pseudo">Checklist voor het gesprek:
- Stel jezelf kort en positief voor.
- Motiveer waarom je solliciteert (bedrijf + functie).
- Geef sterke punten met een voorbeeld.
- Draai een zwak punt om naar leren.
- Antwoord op gedragsvragen met STAR.
- Stel op het einde 2 eigen vragen.</pre>`,
    questions: [
      { type: "qcm", q: "Une bonne réponse à « Wat zijn uw zwakke punten ? » :", opts: ["« Ik heb geen zwakke punten. »", "« Ik werk te hard, dat is alles. »", "un vrai point + comment tu l'améliores", "changer de sujet"], a: 2, exp: "Honnête + orienté progrès." },
      { type: "input", q: "Structure STAR — quelle lettre correspond au contexte ? La ___ (situation)", a: ["s", "situatie"], ph: "S / Situatie", exp: "S = Situatie (le contexte)." },
      { type: "qcm", q: "Face à une question surprise, quelle formule utiliser pour réfléchir ?", opts: ["« Geen idee. »", "« Mag ik daar even over nadenken ? »", "rester silencieux", "changer de question"], a: 1, exp: "Gagner du temps poliment." },
      { type: "input", q: "Formule de motivation : « De functie past perfect bij mijn ___. » (expérience)", a: ["ervaring"], ph: "un nom", exp: "past bij mijn ervaring." },
      { type: "qcm", q: "Comment bien clôturer l'entretien ?", opts: ["partir sans rien dire", "remercier et dire qu'on attend la réponse", "demander seulement le salaire", "critiquer un concurrent"], a: 1, exp: "Ik dank u hartelijk… Ik kijk uit naar uw antwoord." }
    ],
    solution: `<p>Un entretien réussi suit une trame claire : présentation brève et positive, motivation liée à l'entreprise ET à la fonction, points forts illustrés par un exemple, faiblesse retournée en apprentissage, réponses comportementales structurées en STAR (Situatie – Taak – Actie – Resultaat, avec un résultat concret), puis deux questions personnelles pour montrer ton intérêt.</p>
<p>Rappelle-toi : on vouvoie (u), on reste calme, on utilise des expressions-tampons (« Dat is een goede vraag », « Mag ik daar even over nadenken ? ») pour gagner du temps sans se figer. La forme (fluidité, politesse) compte autant que le fond.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en néerlandais…",
  items: [
  { id: "nl-b2-j29", title: "Rédiger tes propres réponses d'entretien", level: 3,
    statement: "Prépare TES réponses personnelles en néerlandais (8 à 10 phrases) à quatre questions clés : (1) présente-toi brièvement, (2) explique pourquoi tu postules, (3) donne un point fort avec un exemple, (4) raconte une situation difficile en suivant la méthode STAR.",
    hints: [
      "Commence par « Mijn naam is… en ik heb ervaring met… ».",
      "Pour la motivation : « Ik solliciteer omdat… en de functie past bij… ».",
      "Pour la situation difficile, marque les 4 étapes : Situatie, Taak, Actie, Resultaat."
    ],
    solution: "Mijn naam is Karim El Amrani en ik heb drie jaar ervaring als klantenadviseur in de bankensector. Ik solliciteer op deze functie omdat uw bedrijf bekendstaat om zijn goede werksfeer en omdat de job perfect past bij mijn ervaring met klantencontact. Een van mijn sterke punten is dat ik geduldig en oplossingsgericht ben. Toen bijvoorbeeld een boze klant belde over een fout, bleef ik rustig en vond ik snel een oplossing. Ik wil u ook graag een moeilijke situatie beschrijven. Situatie: tijdens de drukste periode van het jaar viel ons computersysteem uit. Taak: ik moest de klanten toch verder helpen zonder het systeem. Actie: ik heb alles tijdelijk manueel genoteerd en mijn collega's georganiseerd. Resultaat: geen enkele klant vertrok ontevreden en de manager bedankte ons team achteraf.\n\nTraduction : Je m'appelle Karim El Amrani et j'ai trois ans d'expérience comme conseiller clientèle dans le secteur bancaire. Je postule à ce poste parce que votre entreprise est réputée pour sa bonne ambiance de travail et parce que le poste correspond parfaitement à mon expérience du contact client. L'un de mes points forts est que je suis patient et orienté solution. Par exemple, quand un client en colère a appelé au sujet d'une erreur, je suis resté calme et j'ai vite trouvé une solution. Je voudrais aussi vous décrire une situation difficile. Situation : pendant la période la plus chargée de l'année, notre système informatique est tombé en panne. Tâche : je devais quand même aider les clients sans le système. Action : j'ai tout noté temporairement à la main et j'ai organisé mes collègues. Résultat : aucun client n'est parti mécontent et le manager a remercié notre équipe ensuite.",
    note: "Personnalise avec ton vrai parcours. La méthode STAR n'est convaincante que si le Resultaat est concret. Répète tes réponses à voix haute jusqu'à ce qu'elles deviennent fluides." }
  ]
};
</script>
