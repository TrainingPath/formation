<script>
var DAY = {
  num: 20,
  title: "Analyser un fait divers en détail",
  subtitle: "Aller au-delà des faits : causes, conséquences, ton et point de vue.",
  theory: `
<h3>1. De la compréhension à l'analyse</h3>
<p>Comprendre un fait divers, c'est savoir ce qui s'est passé. L'<strong>analyser</strong>, c'est aussi repérer : la <strong>cause</strong> et les <strong>conséquences</strong>, le <strong>point de vue</strong> du journaliste, le <strong>ton</strong> (neutre, dramatique, ironique) et ce qui est seulement <strong>suggéré</strong> (l'implicite).</p>
<h3>2. Vocabulaire de l'analyse</h3>
<pre class="pseudo">de oorzaak       la cause          het gevolg      la conséquence
het standpunt    le point de vue   de toon         le ton
neutraal         neutre            kritisch        critique
benadrukken      souligner         suggereren      suggérer
de bron          la source         betrouwbaar     fiable
overdrijven      exagérer          verzwijgen      passer sous silence</pre>
<h3>3. Le fait divers du jour — Chaos door een ontsnapte struisvogel</h3>
<pre class="pseudo">Gisterenochtend zorgde een ontsnapte struisvogel voor flink wat
opschudding op de ring rond Antwerpen. Het dier was rond zeven uur
weggelopen van een nabijgelegen boerderij. Volgens de eigenaar was
een hek niet goed gesloten. De struisvogel rende plotseling over de
snelweg, waardoor verschillende automobilisten hard moesten remmen.</pre>
<pre class="pseudo">Er vielen gelukkig geen gewonden, maar het verkeer stond meer dan een
uur volledig stil. De politie en de brandweer probeerden het nerveuze
dier te vangen. Dat bleek moeilijker dan verwacht: een struisvogel kan
tot zeventig kilometer per uur lopen. Pas na anderhalf uur konden de
hulpdiensten het dier veilig terugbrengen naar de boerderij.</pre>
<pre class="pseudo">De eigenaar bood zijn excuses aan en beloofde de omheining te
herstellen. Sommige weggebruikers reageerden geamuseerd op sociale
media, anderen waren boos over het lange oponthoud. De politie
benadrukte dat de situatie ook gevaarlijk had kunnen aflopen.</pre>
<div class="tip">Le ton ici est <strong>légèrement amusé mais sérieux</strong> : le mot « chaos » et « opschudding » (agitation) dramatisent, tandis que « gelukkig geen gewonden » (heureusement pas de blessés) rassure. Repérer ces choix de mots, c'est analyser le ton.</div>
<div class="warn">Distinguez le <strong>fait</strong> (« het verkeer stond stil » — le trafic était bloqué) de l'<strong>opinion / interprétation</strong> (« de situatie had gevaarlijk kunnen aflopen » — cela aurait pu mal tourner). L'un est vérifiable, l'autre est une appréciation.</div>`,
  exercises: [
    { type: "qcm", q: "Quel animal provoque le chaos ?", opts: ["une vache", "une autruche échappée", "un cheval", "un chien"], a: 1, exp: "een ontsnapte struisvogel = une autruche échappée." },
    { type: "input", q: "Où l'incident a-t-il lieu ? op de ring rond ___", a: ["antwerpen"], ph: "une ville", exp: "op de ring rond Antwerpen." },
    { type: "qcm", q: "Quelle est la cause (de oorzaak) de l'évasion ?", opts: ["une tempête", "une clôture mal fermée", "un vol", "un accident"], a: 1, exp: "een hek was niet goed gesloten." },
    { type: "vf", q: "Il y a eu des blessés graves.", a: false, exp: "Er vielen gelukkig geen gewonden." },
    { type: "input", q: "Combien de temps le trafic est-il resté bloqué ? meer dan een ___", a: ["uur"], ph: "un nom", exp: "meer dan een uur volledig stil." },
    { type: "qcm", q: "Pourquoi l'animal est-il difficile à attraper ?", opts: ["il est invisible", "une autruche court jusqu'à 70 km/h", "il vole", "il se cache"], a: 1, exp: "een struisvogel kan tot zeventig km/u lopen." },
    { type: "qcm", q: "« benadrukken » signifie…", opts: ["oublier", "souligner", "exagérer", "cacher"], a: 1, exp: "benadrukken = souligner, insister sur." },
    { type: "input", q: "Que promet le propriétaire de réparer ? de ___", a: ["omheining"], ph: "un nom", exp: "beloofde de omheining te herstellen (la clôture)." },
    { type: "qcm", q: "Comment réagissent les internautes ?", opts: ["tous en colère", "certains amusés, d'autres fâchés", "tous indifférents", "tous effrayés"], a: 1, exp: "sommigen geamuseerd, anderen boos." },
    { type: "vf", q: "La phrase « de situatie had gevaarlijk kunnen aflopen » est une interprétation, pas un fait vérifiable.", a: true, exp: "C'est une appréciation de ce qui aurait PU arriver." },
    { type: "qcm", q: "Quel mot du titre dramatise l'événement ?", opts: ["struisvogel", "chaos", "ochtend", "boerderij"], a: 1, exp: "« Chaos » choisit un ton dramatique." },
    { type: "qcm", q: "Quel élément RASSURE le lecteur et adoucit le ton ?", opts: ["chaos", "opschudding", "gelukkig geen gewonden", "gevaarlijk"], a: 2, exp: "gelukkig geen gewonden = heureusement pas de blessés." },
    { type: "input", q: "Traduis « la source » (d'une information) : de ___", a: ["bron"], ph: "un nom", exp: "de bron = la source." },
    { type: "qcm", q: "Quelle est la conséquence (het gevolg) principale de la course de l'autruche ?", opts: ["une amende", "le trafic bloqué plus d'une heure", "un incendie", "rien"], a: 1, exp: "het verkeer stond meer dan een uur stil." },
    { type: "vf", q: "Le journaliste prend clairement parti CONTRE le propriétaire.", a: false, exp: "Le ton reste globalement factuel ; il rapporte les excuses sans accuser." }
  ],
  final: {
    title: "Exercice final — Feit of interpretatie?",
    intro: `<p>Analyser, c'est distinguer les faits des interprétations et repérer le ton. Réponds :</p>
<pre class="pseudo">A. Het verkeer stond meer dan een uur stil.        -> feit
B. De situatie had gevaarlijk kunnen aflopen.       -> interpretatie
C. Een struisvogel kan tot 70 km/u lopen.           -> feit
D. Sommige weggebruikers reageerden geamuseerd.     -> feit (waarneming)
E. De struisvogel was zeker de schuld van de eigenaar. -> interpretatie</pre>`,
    questions: [
      { type: "qcm", q: "Laquelle de ces phrases est une INTERPRÉTATION, pas un fait ?", opts: ["Le trafic était bloqué plus d'une heure", "Cela aurait pu mal tourner", "Une autruche court jusqu'à 70 km/h", "Il n'y a pas eu de blessés"], a: 1, exp: "« had kunnen aflopen » exprime une hypothèse, pas un fait." },
      { type: "input", q: "Quel adjectif décrirait le mieux le ton général : neutraal, dramatisch of ___ (amusé) ?", a: ["geamuseerd", "amusant"], ph: "un adjectif", exp: "Le ton mêle le sérieux à une pointe d'amusement." },
      { type: "qcm", q: "Quelle est la cause profonde de tout l'incident ?", opts: ["la vitesse des voitures", "une clôture mal fermée à la ferme", "le mauvais temps", "la police"], a: 1, exp: "een hek was niet goed gesloten." },
      { type: "qcm", q: "Que souligne la police à la fin (implicite : leçon à retenir) ?", opts: ["que c'était drôle", "que la situation aurait pu être dangereuse", "que le propriétaire est innocent", "qu'il faut fermer l'autoroute"], a: 1, exp: "de politie benadrukte het gevaar." },
      { type: "input", q: "Comment dit-on « passer sous silence » (ne pas mentionner) ? ___", a: ["verzwijgen"], ph: "un verbe", exp: "verzwijgen = taire, passer sous silence." }
    ],
    solution: `<p>Analyse : le fait divers rapporte un événement réel (une autruche sur le ring d'Anvers) avec un ton qui mêle le sérieux (danger, embouteillage) et une pointe d'amusement (« chaos », réactions « geamuseerd »). Les <strong>faits</strong> sont vérifiables (durée du blocage, vitesse de l'animal) ; les <strong>interprétations</strong> (« cela aurait pu mal tourner », « c'était sûrement la faute du propriétaire ») relèvent de l'appréciation.</p>
<p>Analyser un fait divers, c'est donc : identifier cause et conséquences, séparer faits et opinions, et nommer le ton grâce aux choix de mots (<strong>chaos, gelukkig, benadrukken</strong>).</p>`
  }
};
</script>

    hints: [
      "Cause et conséquence : « De oorzaak was… », « Het gevolg was… ».",
      "Ton : « De toon is grotendeels neutraal / licht geamuseerd, want… ».",
      "Opinion : « Ik vind dat de journalist… » + justification."
    ],
    solution: "De oorzaak van het incident was een hek dat niet goed gesloten was. Het gevolg was dat het verkeer op de ring meer dan een uur stilstond. De toon van het artikel is grotendeels neutraal, maar het woord chaos maakt het verhaal iets dramatischer. Toch benadrukt de journalist ook dat er gelukkig geen gewonden vielen, wat het geheel geruststelt. Ik vind dat de journalist het evenwichtig heeft verteld: hij geeft de feiten en laat verschillende reacties zien zonder iemand echt te veroordelen.\n\nTraduction : La cause de l'incident était une clôture mal fermée. La conséquence fut que le trafic sur le ring resta bloqué plus d'une heure. Le ton de l'article est globalement neutre, mais le mot chaos rend l'histoire un peu plus dramatique. Pourtant, le journaliste souligne aussi qu'il n'y a heureusement pas eu de blessés, ce qui rassure l'ensemble. Je trouve qu'il a raconté cela de façon équilibrée : il donne les faits et montre différentes réactions sans vraiment condamner quelqu'un.",
    note: "Une analyse relie toujours une observation (choix de mots) à une conclusion (le ton). Appuie chaque jugement sur un élément du texte." }
  ]
};
