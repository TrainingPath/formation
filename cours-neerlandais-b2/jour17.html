  title: "Débattre : nuancer et concéder",
  subtitle: "Défendre une opinion tout en reconnaissant les arguments adverses.",
  theory: `
<h3>1. Prendre position — een standpunt innemen</h3>
<p>Dans un débat (<strong>een debat</strong>), commencez par annoncer clairement votre avis :</p>
<pre class="pseudo">Ik ben ervan overtuigd dat…     Je suis convaincu que…
Naar mijn mening…               À mon avis…
Ik sta achter het idee dat…     Je soutiens l'idée que…
Volgens mij…                    Selon moi…</pre>
<h3>2. Concéder — toegeven</h3>
<p>Concéder, c'est reconnaître qu'une partie de l'argument adverse est valable, avant de la relativiser. C'est la marque d'un débatteur B2.</p>
<pre class="pseudo">Toegegeven, …                   J'en conviens, …
Het klopt dat…, maar…           C'est vrai que…, mais…
Ik geef toe dat…                J'admets que…
Natuurlijk is het zo dat…       Bien sûr, il est vrai que…
Enerzijds…, anderzijds…         D'une part…, d'autre part…</pre>
<div class="tip">La structure gagnante : <strong>concession + nuance</strong>. « Het klopt dat het duur is, <strong>maar</strong> op lange termijn bespaart het geld. » (C'est vrai que c'est cher, mais à long terme cela fait économiser de l'argent.)</div>
<h3>3. Nuancer — nuanceren</h3>
<pre class="pseudo">tot op zekere hoogte    dans une certaine mesure
in principe             en principe
grotendeels             en grande partie
niet noodzakelijk       pas nécessairement
het hangt ervan af      cela dépend
in de meeste gevallen   dans la plupart des cas</pre>
<h3>4. Réfuter poliment — beleefd tegenspreken</h3>
<pre class="pseudo">Toch ben ik het daar niet mee eens.
   Pourtant je ne suis pas d'accord là-dessus.
Ik begrijp uw punt, maar…
   Je comprends votre point, mais…
Daar valt iets voor te zeggen, maar…
   Il y a du vrai là-dedans, mais…
Integendeel, …
   Au contraire, …</pre>
<div class="warn">« mee eens zijn » (être d'accord) se construit avec « het eens zijn MET iemand » (avec qqn) et « het eens zijn OVER iets » (sur qqch). Ne dites pas « ik ben agree ».</div>`,

    { type: "qcm", q: "Comment annoncer clairement son avis ?", opts: ["Het hangt ervan af", "Naar mijn mening…", "Toegegeven", "Integendeel"], a: 1, exp: "Naar mijn mening = à mon avis." },
    { type: "input", q: "Complète (concéder) : « Ik ___ toe dat het een risico is. » (admettre)", a: ["geef"], ph: "un verbe", exp: "toegeven → ik geef toe." },
    { type: "qcm", q: "« Enerzijds…, anderzijds… » sert à…", opts: ["conclure", "opposer deux aspects", "poser une question", "remercier"], a: 1, exp: "D'une part…, d'autre part…" },
    { type: "input", q: "Traduis « dans une certaine mesure » : tot op zekere ___", a: ["hoogte"], ph: "un mot", exp: "tot op zekere hoogte." },

    { type: "input", q: "Complète : « Ik begrijp uw punt, ___ ik zie het anders. » (mais)", a: ["maar"], ph: "conjonction", exp: "maar = mais." },

    { type: "vf", q: "« Ik ben het met je eens » se construit avec « met » pour désigner la personne.", a: true, exp: "het eens zijn met iemand." },

    { type: "input", q: "Complète (nuancer) : « In de meeste ___ werkt dat goed. » (cas)", a: ["gevallen"], ph: "un nom", exp: "in de meeste gevallen = dans la plupart des cas." },
    { type: "qcm", q: "Compréhension : « Toegegeven, het is duur. Toch denk ik dat het de moeite waard is. » Quelle est la position finale ?", opts: ["C'est trop cher, il refuse", "Malgré le prix, il pense que ça vaut la peine", "Il ne sait pas", "C'est gratuit"], a: 1, exp: "Toch = pourtant : il maintient que ça vaut la peine." },
    { type: "vf", q: "Compréhension : « Enerzijds is het praktisch, anderzijds is het slecht voor het milieu. » Un seul aspect est mentionné.", a: false, exp: "Deux aspects opposés : pratique / mauvais pour l'environnement." }

niet iedereen kan thuis even goed werken, en het contact met

alleen voelen. Toch ben ik ervan overtuigd dat de voordelen
grotendeels zwaarder wegen: mensen verliezen geen tijd met reizen

discipline, anderzijds geeft het meer vrijheid. Ik denk dus dat

      { type: "input", q: "Quel mot introduit sa concession ? « ___, niet iedereen kan thuis even goed werken. »", a: ["toegegeven"], ph: "un mot", exp: "Toegegeven = j'en conviens." },
      { type: "qcm", q: "Quel inconvénient reconnaît-il ?", opts: ["C'est plus cher", "Certains se sentent seuls", "On travaille moins", "Il n'y a pas d'internet"], a: 1, exp: "sommige mensen voelen zich alleen." },
      { type: "qcm", q: "Quel est l'avantage principal qu'il met en avant ?", opts: ["Plus de salaire", "On perd moins de temps en trajets", "Moins de réunions", "Plus de vacances"], a: 1, exp: "mensen verliezen geen tijd met reizen." },
      { type: "input", q: "Quelle solution finale propose-t-il ? Une combinaison de thuis et op ___", a: ["kantoor"], ph: "un mot", exp: "combinatie van thuis en op kantoor." }
    ],
    solution: `<p>Traduction : « À mon avis, le télétravail a beaucoup d'avantages. J'en conviens, tout le monde ne travaille pas aussi bien à la maison, et le contact avec les collègues diminue parfois. C'est vrai que certaines personnes se sentent seules. Pourtant, je suis convaincu que les avantages l'emportent en grande partie : les gens ne perdent pas de temps en trajets et peuvent mieux concilier travail et famille. D'une part cela demande de la discipline, d'autre part cela donne plus de liberté. Je pense donc qu'une combinaison de maison et de bureau est la meilleure solution. »</p>
<p>Structure d'un bon argumentaire nuancé : opinion (<strong>naar mijn mening</strong>) → concession (<strong>toegegeven, het klopt dat</strong>) → nuance et maintien (<strong>toch, grotendeels</strong>) → conclusion équilibrée.</p>`
  }
};
