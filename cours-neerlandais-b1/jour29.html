<script>
var DAY = {
  num: 29,
  title: "Bilan B1 : entretien d'embauche simulé",
  subtitle: "Un dialogue complet d'entretien pour mobiliser tout le niveau.",
  theory: `
<h3>1. Le contexte — het sollicitatiegesprek</h3>
<p>L'entretien d'embauche (het sollicitatiegesprek) est un exercice oral clé du niveau B1. On y répond à des questions sur son parcours, ses qualités, ses motivations. Voici un dialogue complet à étudier et à réutiliser.</p>
<h3>2. Le dialogue complet</h3>
<pre class="pseudo">Werkgever: Goedemorgen, gaat u zitten. Kunt u zich even voorstellen?
Kandidaat: Goedemorgen. Mijn naam is Sofie Maes. Ik ben 28 jaar
           en ik woon in Brussel. Ik heb vijf jaar ervaring in de verkoop.

Werkgever: Waarom heeft u op deze functie gesolliciteerd?
Kandidaat: Ik solliciteer omdat uw bedrijf bekend staat om zijn goede
           service. Ik zoek een nieuwe uitdaging en ik denk dat ik hier
           veel kan leren.

Werkgever: Wat zijn uw sterke punten?
Kandidaat: Ik ben punctueel, klantvriendelijk en ik werk goed in een team.
           Bovendien spreek ik vloeiend Nederlands, Frans en Engels.

Werkgever: En heeft u ook een minder sterk punt?
Kandidaat: Soms ben ik te perfectionistisch, maar ik leer om taken
           beter te verdelen.

Werkgever: Waar ziet u zichzelf over vijf jaar?
Kandidaat: Over vijf jaar zou ik graag een team willen leiden.
           Daarom wil ik nu ervaring opdoen en blijven groeien.

Werkgever: Heeft u nog vragen?
Kandidaat: Ja, wanneer kan ik een antwoord verwachten?
Werkgever: Wij nemen volgende week contact met u op. Bedankt voor uw komst.
Kandidaat: Bedankt voor het gesprek. Tot ziens.</pre>
<h3>3. Vocabulaire de l'entretien</h3>
<pre class="pseudo">solliciteren      poser sa candidature   de functie      le poste
de ervaring       l'expérience           de uitdaging    le défi
het sterke punt   le point fort          klantvriendelijk aimable (clients)
een team leiden   diriger une équipe     ervaring opdoen  acquérir de l'expérience</pre>
<div class="tip">Prépare toujours trois éléments : (1) une présentation courte de toi, (2) tes points forts avec un exemple concret, (3) une question à poser à la fin. Poser une question montre ton intérêt.</p></div>
<div class="warn">Reste au vouvoiement (<strong>u</strong>) pendant tout l'entretien : « Kunt u ...? », « uw bedrijf ». Réponds en phrases complètes, pas seulement par « ja » ou « nee », et justifie avec <strong>omdat</strong>, <strong>daarom</strong>, <strong>zodat</strong>.</p></div>`,
  exercises: [
    { type: "qcm", q: "Comment l'employeur commence-t-il l'entretien ?", opts: ["Wat kost het?", "Kunt u zich even voorstellen?", "Waar woont u niet?", "Wilt u koffie?"], a: 1, exp: "Kunt u zich voorstellen? = Pouvez-vous vous présenter ?" },
    { type: "input", q: "Complète la présentation : « Ik heb vijf jaar ___ in de verkoop. » (expérience)", a: ["ervaring"], ph: "un mot", exp: "de ervaring = l'expérience." },
    { type: "qcm", q: "Pourquoi Sofie a-t-elle postulé ?", opts: ["pour le salaire", "parce que l'entreprise est connue pour son bon service", "par hasard", "pour voyager"], a: 1, exp: "omdat uw bedrijf bekend staat om zijn goede service." },
    { type: "qcm", q: "Quels sont les points forts de Sofie ?", opts: ["ponctuelle, aimable, esprit d'équipe", "riche et célèbre", "grande et forte", "jeune et libre"], a: 0, exp: "punctueel, klantvriendelijk, werkt goed in een team." },
    { type: "input", q: "Complète : « Ik werk goed in een ___. » (équipe)", a: ["team"], ph: "un mot", exp: "in een team werken = travailler en équipe." },
    { type: "vf", q: "Sofie parle couramment trois langues.", a: true, exp: "vloeiend Nederlands, Frans en Engels." },
    { type: "qcm", q: "Quel point faible Sofie mentionne-t-elle ?", opts: ["elle est paresseuse", "elle est parfois trop perfectionniste", "elle arrive en retard", "elle n'aime pas les clients"], a: 1, exp: "Soms ben ik te perfectionistisch." },
    { type: "input", q: "Complète (projection) : « Over vijf jaar zou ik graag een team willen ___. » (diriger)", a: ["leiden"], ph: "un verbe", exp: "een team leiden = diriger une équipe." },
    { type: "qcm", q: "Que veut faire Sofie maintenant, avant de diriger une équipe ?", opts: ["se reposer", "acquérir de l'expérience et continuer à grandir", "changer de métier", "voyager"], a: 1, exp: "ervaring opdoen en blijven groeien." },
    { type: "vf", q: "À la fin, Sofie pose une question à l'employeur.", a: true, exp: "Wanneer kan ik een antwoord verwachten? = poser une question montre l'intérêt." },
    { type: "input", q: "Complète la question finale : « Wanneer kan ik een antwoord ___? » (attendre)", a: ["verwachten"], ph: "un verbe", exp: "een antwoord verwachten = attendre une réponse." },
    { type: "qcm", q: "Quel registre utilise-t-on pendant l'entretien ?", opts: ["informel (je)", "formel (u)", "les deux au hasard", "aucun"], a: 1, exp: "Vouvoiement : u, uw, Kunt u ...?" },
    { type: "qcm", q: "Compréhension : « Wij nemen volgende week contact met u op. » Que dit l'employeur ?", opts: ["Sofie est engagée", "il recontactera Sofie la semaine prochaine", "l'entretien est annulé", "Sofie doit revenir demain"], a: 1, exp: "contact opnemen = prendre contact ; volgende week = la semaine prochaine." },
    { type: "vf", q: "Compréhension : il vaut mieux répondre en phrases complètes qu'avec un simple « ja ».", a: true, exp: "On développe et on justifie ses réponses." },
    { type: "qcm", q: "Compréhension : « Ik zoek een nieuwe uitdaging » signifie…", opts: ["Je cherche un salaire", "Je cherche un nouveau défi", "Je cherche un bureau", "Je cherche des vacances"], a: 1, exp: "de uitdaging = le défi." }
  ],
  final: {
    title: "Exercice final — Bien répondre en entretien",
    intro: `<p>Voici quelques questions typiques d'entretien. Choisis ou complète la meilleure réponse :</p>
<pre class="pseudo">Vraag 1: Kunt u zich voorstellen?
Vraag 2: Waarom wilt u hier werken?
Vraag 3: Wat is uw sterke punt?
Vraag 4: Heeft u nog vragen?</pre>`,
    questions: [
      { type: "qcm", q: "Meilleure réponse à « Kunt u zich voorstellen? »", opts: ["Ja.", "Mijn naam is ... en ik heb ... jaar ervaring in ...", "Nee, liever niet.", "Hoeveel verdien ik?"], a: 1, exp: "On se présente en phrases complètes : nom, âge, expérience." },
      { type: "input", q: "Complète une réponse à « Waarom wilt u hier werken? » : « Ik solliciteer ___ uw bedrijf een goede reputatie heeft. » (parce que)", a: ["omdat"], ph: "un mot", exp: "omdat + verbe à la fin : justifier sa motivation." },
      { type: "qcm", q: "Bonne façon de présenter un point fort ?", opts: ["Ik ben perfect.", "Ik ben klantvriendelijk en ik werk goed in een team.", "Ik weet het niet.", "Vraag maar aan mijn baas."], a: 1, exp: "On cite des qualités concrètes et professionnelles." },
      { type: "input", q: "Complète une question à poser à la fin : « Wanneer kan ik een ___ verwachten? » (réponse)", a: ["antwoord"], ph: "un mot", exp: "een antwoord verwachten = attendre une réponse." },
      { type: "qcm", q: "Pourquoi est-il bon de poser une question à la fin ?", opts: ["pour gagner du temps", "pour montrer son intérêt pour le poste", "pour partir plus vite", "ce n'est pas conseillé"], a: 1, exp: "Poser une question montre l'engagement et l'intérêt." }
    ],
    solution: `<p>Traduction du dialogue clé : « Employeur : Bonjour, asseyez-vous. Pouvez-vous vous présenter ? — Candidate : Bonjour. Je m'appelle Sofie Maes, j'ai 28 ans et j'habite à Bruxelles. J'ai cinq ans d'expérience dans la vente. — Pourquoi avez-vous postulé à ce poste ? — Je postule parce que votre entreprise est connue pour son bon service. Je cherche un nouveau défi et je pense que je peux beaucoup apprendre ici... »</p>
<p>Les clés d'un bon entretien en néerlandais : rester au <strong>vouvoiement</strong>, répondre en <strong>phrases complètes</strong>, justifier avec <strong>omdat / daarom / zodat</strong>, préparer ses <strong>points forts</strong> et poser une <strong>question</strong> à la fin. Réutilise les formules du dialogue pour ton propre entretien.</p>`
  }
};
</script>

    solution: "Goedemorgen. Mijn naam is Thomas Laurent, ik ben 30 jaar en ik woon in Antwerpen. Ik heb vier jaar ervaring als verkoper in een grote winkel. Ik solliciteer op deze functie omdat uw bedrijf bekend staat om zijn goede service en ik zoek een nieuwe uitdaging. Mijn sterke punten zijn dat ik klantvriendelijk ben en dat ik goed in een team werk. Bovendien spreek ik vloeiend Nederlands en Frans. Soms ben ik te perfectionistisch, maar ik leer om taken beter te verdelen. Over vijf jaar zou ik graag een team willen leiden. Daarom wil ik nu meer ervaring opdoen. Heeft u een opleiding voor nieuwe medewerkers? En wanneer kan ik een antwoord verwachten?\n\nTraduction : Bonjour. Je m'appelle Thomas Laurent, j'ai 30 ans et j'habite à Anvers. J'ai quatre ans d'expérience comme vendeur dans un grand magasin. Je postule à ce poste parce que votre entreprise est connue pour son bon service et je cherche un nouveau défi. Mes points forts sont que je suis aimable avec les clients et que je travaille bien en équipe. De plus je parle couramment néerlandais et français. Parfois je suis trop perfectionniste, mais j'apprends à mieux répartir les tâches. Dans cinq ans j'aimerais diriger une équipe. C'est pourquoi je veux maintenant acquérir plus d'expérience. Avez-vous une formation pour les nouveaux collaborateurs ? Et quand puis-je attendre une réponse ?",

  ]
};
