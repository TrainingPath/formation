<script>
var DAY = {
  num: 3,
  title: "Le passif (worden)",
  subtitle: "Mettre l'accent sur l'action, pas sur celui qui la fait : worden + participe.",
  theory: `
<h3>1. Actif ou passif ?</h3>
<p>À la voix <strong>active</strong>, le sujet fait l'action : « De bakker bakt het brood » (Le boulanger cuit le pain). À la voix <strong>passive</strong>, on met l'objet en avant et l'acteur devient secondaire, voire disparaît : « Het brood wordt gebakken » (Le pain est cuit). On utilise le passif quand l'auteur de l'action est inconnu, évident ou sans importance.</p>
<h3>2. La formation : worden + participe passé</h3>
<p>Le passif au présent se forme avec l'auxiliaire <strong>worden</strong> (devenir) conjugué + le <strong>participe passé</strong> rejeté à la fin :</p>
<pre class="pseudo">ik word          wij worden       + participe passé à la fin
jij wordt        jullie worden
hij/zij wordt    zij worden</pre>
<p><strong>De brief wordt geschreven.</strong> = La lettre est écrite. · <strong>De ramen worden elke week gewassen.</strong> = Les fenêtres sont lavées chaque semaine.</p>
<h3>3. Préciser l'acteur avec « door »</h3>
<p>Si l'on veut malgré tout indiquer qui fait l'action, on l'introduit avec <strong>door</strong> (par) :</p>
<pre class="pseudo">Het huis wordt door de architect ontworpen.
La maison est conçue par l'architecte.
De kinderen worden door de leraar geholpen.
Les enfants sont aidés par le professeur.</pre>
<h3>4. Le passif au passé</h3>
<p>Au prétérit, worden devient <strong>werd</strong> (singulier) / <strong>werden</strong> (pluriel). Au parfait, on emploie <strong>zijn + participe</strong> (et worden se réduit à <strong>geworden</strong>, souvent sous-entendu à l'écrit courant → « is ... geworden », mais très souvent simplement « is geschreven »).</p>
<pre class="pseudo">Présent :  De auto wordt gerepareerd.   La voiture est réparée.
Prétérit : De auto werd gerepareerd.   La voiture était/fut réparée.
Parfait :  De auto is gerepareerd.      La voiture a été réparée.</pre>
<div class="tip">Ne confonds pas <strong>worden</strong> (auxiliaire du passif) avec <strong>zijn</strong> (état). « De deur wordt gesloten » = la porte est en train d'être fermée (action). « De deur is gesloten » = la porte est fermée (résultat, état).</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">In deze fabriek worden elke dag duizend auto's gemaakt.
De onderdelen worden door robots gemonteerd.
Vroeger werd alles met de hand gedaan.
Vorige week werd een nieuwe machine geïnstalleerd.
Nu wordt het werk veel sneller uitgevoerd.</pre>
<p>Traduction : Dans cette usine, mille voitures sont fabriquées chaque jour. Les pièces sont montées par des robots. Autrefois, tout était fait à la main. La semaine dernière, une nouvelle machine a été installée. Maintenant, le travail est effectué beaucoup plus vite.</p>
<div class="warn">Au passif, le participe passé se place toujours à la fin de la proposition, comme au parfait. Et n'oublie pas d'accorder worden avec le sujet : un sujet pluriel exige « worden » (De ramen <strong>worden</strong> gewassen).</div>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire forme le passif au présent ?", opts: ["zijn", "worden", "hebben", "gaan"], a: 1, exp: "worden + participe passé = passif présent." },
    { type: "input", q: "Complète : « De brief ___ geschreven. » (worden, singulier)", a: ["wordt"], ph: "worden conjugué", exp: "hij/zij/het wordt : De brief wordt geschreven." },
    { type: "qcm", q: "« Les fenêtres sont lavées » se dit…", opts: ["De ramen wordt gewassen", "De ramen worden gewassen", "De ramen zijn wassen", "De ramen hebben gewassen"], a: 1, exp: "Sujet pluriel (de ramen) → worden." },
    { type: "input", q: "Complète : « De kinderen worden ___ de leraar geholpen. » (par)", a: ["door"], ph: "préposition", exp: "door introduit l'auteur de l'action au passif." },
    { type: "vf", q: "Au passif, le participe passé se place à la fin de la proposition.", a: true, exp: "Comme au parfait, le participe est rejeté à la fin." },
    { type: "qcm", q: "Quelle est la forme de worden au prétérit singulier ?", opts: ["werd", "werden", "wordde", "geworden"], a: 0, exp: "worden → werd (singulier) / werden (pluriel)." },
    { type: "input", q: "Passif prétérit : « De auto ___ gerepareerd. » (worden, passé, singulier)", a: ["werd"], ph: "un mot", exp: "De auto werd gerepareerd = la voiture fut réparée." },
    { type: "qcm", q: "Au parfait, le passif utilise…", opts: ["worden + participe", "zijn + participe", "hebben + participe", "werd + participe"], a: 1, exp: "Le passif au parfait se forme avec zijn : De auto is gerepareerd." },
    { type: "vf", q: "« De deur is gesloten » décrit une action en cours de fermeture.", a: false, exp: "Faux : « is gesloten » exprime un état (la porte est fermée) ; l'action serait « wordt gesloten »." },
    { type: "input", q: "Mets au passif présent : « Het huis ___ door de architect ontworpen. » (worden)", a: ["wordt"], ph: "worden conjugué", exp: "Het huis (het-woord singulier) → wordt." },
    { type: "qcm", q: "Comment tourner « De bakker bakt het brood » au passif ?", opts: ["Het brood bakt", "Het brood wordt gebakken", "Het brood is bakken", "De bakker wordt gebakken"], a: 1, exp: "L'objet (het brood) devient sujet + worden + participe." },
    { type: "input", q: "Complète : « De ramen ___ elke week gewassen. » (worden, pluriel)", a: ["worden"], ph: "worden conjugué", exp: "Sujet pluriel → worden." },
    { type: "qcm", q: "Compréhension : « In deze fabriek worden duizend auto's gemaakt. » Qui fabrique ?", opts: ["c'est précisé : le directeur", "l'acteur n'est pas nommé", "les clients", "les voitures elles-mêmes"], a: 1, exp: "Le passif met l'action en avant sans nommer l'auteur." },
    { type: "vf", q: "Compréhension : « Vroeger werd alles met de hand gedaan. » Autrefois, tout se faisait à la main.", a: true, exp: "met de hand gedaan = fait à la main ; werd = passif au passé." },
    { type: "qcm", q: "Compréhension : « De onderdelen worden door robots gemonteerd. » Qui monte les pièces ?", opts: ["des ouvriers", "des robots", "des ingénieurs", "des clients"], a: 1, exp: "door robots = par des robots." }
  ],
  final: {
    title: "Exercice final — Een rondleiding in de fabriek",
    intro: `<p>Lis ce texte d'une visite guidée puis réponds :</p>
<pre class="pseudo">Welkom in onze chocoladefabriek. Hier wordt elke dag verse chocolade gemaakt.
De cacaobonen worden eerst geroosterd en daarna gemalen.
De chocolade wordt door machines in vormen gegoten.
Gisteren werd een nieuwe verpakkingslijn geopend.
Alle producten worden streng gecontroleerd voordat ze worden verkocht.</pre>`,
    questions: [
      { type: "qcm", q: "Que fabrique-t-on chaque jour dans l'usine ?", opts: ["du pain", "du chocolat frais", "des voitures", "des machines"], a: 1, exp: "Hier wordt elke dag verse chocolade gemaakt." },
      { type: "input", q: "Complète : « De cacaobonen ___ geroosterd. » (worden, pluriel)", a: ["worden"], ph: "worden conjugué", exp: "Sujet pluriel → worden geroosterd." },
      { type: "qcm", q: "Comment le chocolat est-il versé dans les moules ?", opts: ["à la main", "par des machines", "par les visiteurs", "par les clients"], a: 1, exp: "door machines in vormen gegoten." },
      { type: "vf", q: "Une nouvelle ligne d'emballage a été ouverte hier.", a: true, exp: "Gisteren werd een nieuwe verpakkingslijn geopend." },
      { type: "input", q: "Complète : « Alle producten worden streng ___ voordat ze worden verkocht. » (contrôlés)", a: ["gecontroleerd"], ph: "participe", exp: "worden gecontroleerd = sont contrôlés." }
    ],
    solution: `<p>Traduction : « Bienvenue dans notre chocolaterie. Ici, du chocolat frais est fabriqué chaque jour. Les fèves de cacao sont d'abord torréfiées puis broyées. Le chocolat est versé dans des moules par des machines. Hier, une nouvelle ligne d'emballage a été ouverte. Tous les produits sont strictement contrôlés avant d'être vendus. »</p>
<p>Retiens la structure : <strong>worden/werd/zijn + participe</strong>, participe rejeté à la fin, et <strong>door</strong> pour nommer l'acteur si besoin.</p>`
  }
};
</script>
