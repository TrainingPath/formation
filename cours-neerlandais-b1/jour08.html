<script>
var DAY = {
  num: 8,
  title: "Te + infinitif : les verbes concernés",
  subtitle: "Quand utiliser te (sans om) et quand l'infinitif reste seul.",
  theory: `
<h3>1. Trois cas d'infinitif</h3>
<p>En néerlandais, un second verbe à l'infinitif apparaît de trois façons : (1) <strong>sans te</strong> après les modaux et quelques verbes ; (2) <strong>avec te</strong> après certains verbes ; (3) <strong>avec om ... te</strong> pour le but (vu au jour 7). Aujourd'hui, on distingue clairement (1) et (2).</p>
<h3>2. Infinitif SANS te : modaux et compagnie</h3>
<p>Après les verbes de modalité et quelques verbes courants, l'infinitif vient <strong>sans te</strong> :</p>
<pre class="pseudo">kunnen, moeten, mogen, willen, zullen   (modaux)
gaan, komen, blijven, laten, zien, horen
Ik kan zwemmen.        Je sais nager.
Ik wil naar huis gaan. Je veux rentrer.
Hij blijft staan.      Il reste debout.
Ze laat de auto repareren.  Elle fait réparer la voiture.</pre>
<h3>3. Infinitif AVEC te : la longue liste</h3>
<p>Beaucoup d'autres verbes exigent <strong>te</strong> devant l'infinitif qui suit :</p>
<pre class="pseudo">proberen te     essayer de     Ik probeer te slapen.
beginnen te     commencer à    Hij begint te lachen.
hopen te        espérer        We hopen te winnen.
beloven te      promettre de   Ik beloof te komen.
vergeten te     oublier de     Ze vergeet te bellen.
weigeren te     refuser de     Hij weigert te betalen.
durven te       oser           Ik durf niet te springen.
proberen te / besluiten te / vragen te ...</pre>
<h3>4. Après certaines expressions : te aussi</h3>
<p>Après des tournures avec <strong>zijn</strong> + adjectif, ou des expressions figées, on emploie souvent <strong>te</strong> :</p>
<pre class="pseudo">Het is moeilijk te zeggen.       C'est difficile à dire.
Ik ben blij je te zien.          Je suis content de te voir.
Er is niets te doen.             Il n'y a rien à faire.
Ik zit te lezen.                 Je suis en train de lire.</pre>
<div class="tip">Les verbes de position (zitten, staan, liggen, lopen) + te + infinitif expriment une action <strong>en cours</strong> : « Ik zit te werken » = je suis en train de travailler ; « Ze staat te wachten » = elle est en train d'attendre.</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Ik probeer elke dag Nederlands te oefenen, maar soms vergeet ik het.
Ik kan al veel begrijpen en ik durf nu ook te spreken.
Mijn lerares belooft me te helpen als ik iets moeilijk vind.
Vandaag zit ik een boek te lezen in het Nederlands.
Het is niet altijd makkelijk, maar ik wil blijven leren.</pre>
<p>Traduction : J'essaie de pratiquer le néerlandais chaque jour, mais parfois je l'oublie. Je peux déjà comprendre beaucoup et j'ose maintenant aussi parler. Ma professeure promet de m'aider si je trouve quelque chose difficile. Aujourd'hui, je suis en train de lire un livre en néerlandais. Ce n'est pas toujours facile, mais je veux continuer à apprendre.</p>
<div class="warn">Ne mets JAMAIS te après un modal : on dit « Ik kan zwemmen », jamais « Ik kan te zwemmen ». Mais avec proberen, beginnen, hopen, vergeten... le te est obligatoire : « Ik probeer <strong>te</strong> slapen ».</div>`,
  exercises: [
    { type: "qcm", q: "Après un verbe modal (kunnen, moeten...), l'infinitif est…", opts: ["avec te", "sans te", "avec om te", "au participe"], a: 1, exp: "Les modaux prennent l'infinitif SANS te : Ik kan zwemmen." },
    { type: "input", q: "Complète : « Ik probeer ___ slapen. » (essayer de)", a: ["te"], ph: "un mot", exp: "proberen exige te : Ik probeer te slapen." },
    { type: "qcm", q: "Laquelle est correcte ?", opts: ["Ik kan te zwemmen", "Ik kan zwemmen", "Ik kan om te zwemmen", "Ik kan zwemmen te"], a: 1, exp: "Modal + infinitif sans te." },
    { type: "input", q: "Complète : « Hij begint ___ lachen. » (commencer à)", a: ["te"], ph: "un mot", exp: "beginnen te : Hij begint te lachen." },
    { type: "vf", q: "Le verbe « vergeten » (oublier) se construit avec te + infinitif.", a: true, exp: "vergeten te : Ze vergeet te bellen." },
    { type: "qcm", q: "« Je veux rentrer » se dit…", opts: ["Ik wil te naar huis gaan", "Ik wil naar huis gaan", "Ik wil naar huis te gaan", "Ik wil gaan te naar huis"], a: 1, exp: "willen est un modal → infinitif gaan sans te." },
    { type: "input", q: "Complète : « We hopen ___ winnen. » (espérer)", a: ["te"], ph: "un mot", exp: "hopen te : We hopen te winnen." },
    { type: "qcm", q: "Que signifie « Ik zit te lezen » ?", opts: ["Je veux lire", "Je suis en train de lire", "J'ai lu", "Je dois lire"], a: 1, exp: "Verbe de position (zitten) + te + infinitif = action en cours." },
    { type: "vf", q: "Après « laten » (faire faire), on met te devant l'infinitif.", a: false, exp: "Faux : laten prend l'infinitif SANS te : Ze laat de auto repareren." },
    { type: "input", q: "Complète : « Ze staat te ___. » (attendre = wachten)", a: ["wachten"], ph: "verbe", exp: "staan te wachten = être en train d'attendre." },
    { type: "qcm", q: "Lequel de ces verbes se construit AVEC te ?", opts: ["moeten", "mogen", "beloven", "zullen"], a: 2, exp: "beloven te (promettre de) ; les autres sont des modaux sans te." },
    { type: "input", q: "Complète : « Ik durf niet ___ springen. » (oser)", a: ["te"], ph: "un mot", exp: "durven te : Ik durf niet te springen." },
    { type: "qcm", q: "Compréhension : « Ik probeer elke dag Nederlands te oefenen. » Que fait-il chaque jour ?", opts: ["il oublie le néerlandais", "il essaie de pratiquer le néerlandais", "il enseigne le néerlandais", "il refuse d'étudier"], a: 1, exp: "probeer te oefenen = essaie de pratiquer." },
    { type: "vf", q: "Compréhension : « Ik durf nu ook te spreken. » Il ose maintenant aussi parler.", a: true, exp: "durven te spreken = oser parler." },
    { type: "qcm", q: "Compréhension : « Mijn lerares belooft me te helpen. » Que promet la professeure ?", opts: ["de partir", "de l'aider", "de le corriger", "de se taire"], a: 1, exp: "belooft te helpen = promet d'aider." }
  ],
  final: {
    title: "Exercice final — Goede voornemens",
    intro: `<p>Lis ces bonnes résolutions puis réponds :</p>
<pre class="pseudo">Dit jaar probeer ik gezonder te leven.
Ik wil elke week sporten en ik beloof minder suiker te eten.
Ik moet ook vroeger naar bed gaan, want ik ben vaak moe.
Soms vergeet ik water te drinken, dus dat ga ik verbeteren.
Ik hoop over een paar maanden fitter te zijn.
Ik durf zelfs te dromen van een marathon!</pre>`,
    questions: [
      { type: "input", q: "Complète : « Dit jaar probeer ik gezonder ___ leven. »", a: ["te"], ph: "un mot", exp: "proberen te leven = essayer de vivre." },
      { type: "qcm", q: "Que promet-il concernant le sucre ?", opts: ["d'en manger plus", "d'en manger moins", "de n'en manger jamais", "de le remplacer"], a: 1, exp: "ik beloof minder suiker te eten = promet de manger moins de sucre." },
      { type: "qcm", q: "Pourquoi doit-il se coucher plus tôt ?", opts: ["il travaille la nuit", "il est souvent fatigué", "il aime dormir", "il a des enfants"], a: 1, exp: "ik moet vroeger naar bed gaan, want ik ben vaak moe." },
      { type: "input", q: "Complète : « Soms vergeet ik water ___ drinken. »", a: ["te"], ph: "un mot", exp: "vergeten te drinken = oublier de boire." },
      { type: "vf", q: "Il ose même rêver d'un marathon.", a: true, exp: "Ik durf zelfs te dromen van een marathon." }
    ],
    solution: `<p>Traduction : « Cette année, j'essaie de vivre plus sainement. Je veux faire du sport chaque semaine et je promets de manger moins de sucre. Je dois aussi me coucher plus tôt, car je suis souvent fatigué. Parfois, j'oublie de boire de l'eau, donc je vais améliorer cela. J'espère être plus en forme dans quelques mois. J'ose même rêver d'un marathon ! »</p>
<p>Compare : <strong>sans te</strong> après les modaux (wil sporten, moet gaan, ga verbeteren) mais <strong>avec te</strong> après proberen, beloven, vergeten, hopen, durven (te leven, te eten, te drinken, te zijn, te dromen).</p>`
  }
};
</script>
