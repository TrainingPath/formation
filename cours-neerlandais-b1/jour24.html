  subtitle: "Le petit suffixe qui rend tout plus petit, mignon ou familier.",
  theory: `
<h3>1. À quoi sert le diminutif ?</h3>
<p>Le <strong>diminutif</strong> (het verkleinwoord) ajoute la nuance « petit », « mignon », « sympa » ou « un peu ». Il est très fréquent en néerlandais, bien plus qu'en français. Un diminutif est <strong>toujours neutre</strong> : son article est <strong>het</strong>, et son pluriel se fait en <strong>-s</strong>.</p>
<pre class="pseudo">de tafel  →  het tafeltje   la petite table
het huis  →  het huisje     la petite maison
de hond   →  het hondje     le petit chien / toutou</pre>
<div class="tip">Même les prénoms et les mots de la vie courante se mettent souvent au diminutif : <strong>een kopje koffie</strong> (une petite tasse de café), <strong>een biertje</strong> (une petite bière), <strong>Jantje</strong> (petit Jan). C'est chaleureux et typiquement néerlandais.</p></div>
<h3>2. Les cinq terminaisons</h3>
<p>Le suffixe de base est <strong>-je</strong>, mais il change selon la fin du mot :</p>
<pre class="pseudo">-je    après la plupart des consonnes   boek → boekje
-tje   après voyelle, l, n, r, w        stoel → stoeltje, auto → autootje
-etje  après l/m/n/ng/r précédée d'une voyelle courte   bal → balletje, kom → kommetje
-pje   après m (précédée de voyelle longue/diphtongue)   boom → boompje
-kje   après -ing (le g tombe)          koning → koninkje</pre>
<div class="warn">Après une <strong>voyelle courte</strong> suivie de l, m, n, ng ou r, on double la consonne et on ajoute <strong>-etje</strong> : bal → bal<strong>letje</strong>, man → man<strong>netje</strong>, kom → kom<strong>metje</strong>. Après une voyelle longue seule (auto, sla), on redouble la voyelle finale + <strong>tje</strong> : auto → auto<strong>otje</strong>.</p></div>
<h3>3. Sens particuliers</h3>
<p>Parfois le diminutif change carrément le sens ou fige une expression :</p>
<pre class="pseudo">een toetje       un dessert (litt. « petit ajout »)
een broodje      un petit pain / sandwich
een uurtje       une petite heure (environ une heure)
even een momentje  juste un petit instant</pre>
<h3>4. Nuance affective</h3>
<pre class="pseudo">Wil je een kopje thee?     Tu veux une petite tasse de thé ?
Wat een schattig katje!    Quel adorable petit chat !
Zullen we een wandelingetje maken?  On fait une petite balade ?</pre>`,

    { type: "input", q: "Diminutif de « de auto » : het ___", a: ["autootje"], ph: "un mot", exp: "Après voyelle longue seule : on redouble la voyelle → autootje." },

    { type: "input", q: "Complète : « Wil je een ___ thee? » (kop → petite tasse)", a: ["kopje"], ph: "un mot", exp: "kop → kopje." },

    { type: "input", q: "Diminutif de « de kom » (bol, voyelle courte + m) : het ___", a: ["kommetje"], ph: "un mot", exp: "Voyelle courte + m → on double : kommetje (-etje)." },

<pre class="pseudo">Hoi Sanne! Heb je zin om vanmiddag langs te komen? We kunnen een kopje koffie

      { type: "input", q: "Relève le diminutif signifiant « petite balade » : een ___", a: ["wandelingetje"], ph: "un mot", exp: "wandeling → wandelingetje = petite promenade." }
    ],
    solution: `<p>Traduction : « Salut Sanne ! As-tu envie de passer cet après-midi ? On peut boire une petite tasse de café et peut-être manger un sandwich. J'ai aussi un nouveau petit chien, une adorable petite bête. Ensuite on peut faire une petite balade dans le parc. N'hésite pas à amener ta petite sœur. À tout à l'heure ! Bises, Tom. »</p>
<p>Les diminutifs (<strong>kopje, broodje, hondje, beestje, wandelingetje, parkje, zusje, groetjes</strong>) rendent le message chaleureux et familier. Souviens-toi : diminutif = article <strong>het</strong>, pluriel en <strong>-s</strong>, et cinq terminaisons selon la fin du mot.</p>`
  }
};
