<script>
var DAY = {
  num: 5,
  title: "Les questions indirectes",
  subtitle: "Rapporter une question avec of et les mots interrogatifs, verbe à la fin.",
  theory: `
<h3>1. Qu'est-ce qu'une question indirecte ?</h3>
<p>Une question indirecte insère une question dans une phrase plus longue, sans point d'interrogation direct : « Je ne sais pas <strong>où il habite</strong> », « Elle demande <strong>si tu viens</strong> ». En néerlandais, ces subordonnées suivent la même règle que le discours indirect : <strong>le verbe conjugué va à la fin</strong>.</p>
<h3>2. Question fermée (oui/non) : « of »</h3>
<p>Pour rapporter une question à laquelle on répond par oui ou non, on utilise <strong>of</strong> (si) :</p>
<pre class="pseudo">Direct :   « Kom je morgen? »
Indirect : Ik vraag of je morgen komt.       (komt à la fin)
Direct :   « Heeft hij tijd? »
Indirect : Ik weet niet of hij tijd heeft.    (heeft à la fin)</pre>
<div class="warn">Attention : ce <strong>of</strong> signifie « si » (interrogatif), à ne pas confondre avec le « si » de condition, qui se dit <strong>als</strong>. « Ik vraag of hij komt » (je demande s'il vient) ≠ « Als hij komt... » (s'il vient...).</div>
<h3>3. Question ouverte : mot interrogatif conservé</h3>
<p>Quand la question commence par un mot interrogatif (wie, wat, waar, wanneer, hoe, waarom, welke...), on <strong>garde ce mot</strong> comme conjonction, et le verbe part à la fin :</p>
<pre class="pseudo">Direct :   « Waar woont hij? »
Indirect : Ik weet niet waar hij woont.
Direct :   « Wanneer begint de film? »
Indirect : Weet jij wanneer de film begint?
Direct :   « Waarom huilt het kind? »
Indirect : Ik vraag me af waarom het kind huilt.</pre>
<h3>4. Verbes introducteurs fréquents</h3>
<pre class="pseudo">vragen of / vragen wanneer...   demander si / quand...
weten of / weten waar...        savoir si / où...
zich afvragen of...             se demander si...
niet weten hoe...               ne pas savoir comment...</pre>
<p><strong>Ik vraag me af of het gaat lukken.</strong> = Je me demande si ça va marcher. · <strong>Weet jij hoe laat het is?</strong> = Sais-tu quelle heure il est ?</p>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Ik weet niet of de winkel vandaag open is.
Mijn vriend vraagt zich af waar hij zijn sleutels heeft gelegd.
Kun je me vertellen hoe ik naar het station moet gaan?
We willen weten wanneer de trein vertrekt.
Niemand weet waarom de vergadering is geannuleerd.</pre>
<p>Traduction : Je ne sais pas si le magasin est ouvert aujourd'hui. Mon ami se demande où il a posé ses clés. Peux-tu me dire comment je dois aller à la gare ? Nous voulons savoir quand le train part. Personne ne sait pourquoi la réunion a été annulée.</p>
<div class="warn">Dans une question indirecte, on n'utilise plus l'inversion de la question directe : on ne dit pas « Ik weet niet waar woont hij », mais « Ik weet niet waar hij <strong>woont</strong> » (sujet avant le verbe, verbe à la fin).</div>`,
  exercises: [
    { type: "qcm", q: "Quel mot introduit une question indirecte fermée (oui/non) ?", opts: ["als", "of", "dat", "die"], a: 1, exp: "of = si (interrogatif) pour les questions oui/non." },
    { type: "input", q: "Transforme : « Kom je morgen? » → « Ik vraag of je morgen ___. »", a: ["komt"], ph: "verbe", exp: "komt rejeté à la fin après of." },
    { type: "vf", q: "Le « of » interrogatif et le « als » de condition sont interchangeables.", a: false, exp: "Faux : of = si (question), als = si (condition). Ils ne sont pas interchangeables." },
    { type: "qcm", q: "« Waar woont hij? » en question indirecte donne…", opts: ["Ik weet niet waar woont hij", "Ik weet niet waar hij woont", "Ik weet niet of hij woont waar", "Ik weet niet hij waar woont"], a: 1, exp: "On garde waar, sujet puis verbe à la fin : waar hij woont." },
    { type: "input", q: "Complète : « Ik weet niet ___ hij tijd heeft. » (si)", a: ["of"], ph: "conjonction", exp: "Question oui/non → of." },
    { type: "qcm", q: "Dans une question indirecte ouverte, le mot interrogatif…", opts: ["disparaît", "est remplacé par of", "est conservé comme conjonction", "devient dat"], a: 2, exp: "wie, wat, waar, wanneer... restent en tête de la subordonnée." },
    { type: "input", q: "Complète : « Weet jij wanneer de film ___? » (beginnen)", a: ["begint"], ph: "verbe", exp: "begint rejeté à la fin : wanneer de film begint." },
    { type: "qcm", q: "« Heeft hij tijd? » en question indirecte…", opts: ["Ik weet niet of hij heeft tijd", "Ik weet niet of hij tijd heeft", "Ik weet niet heeft hij tijd", "Ik weet niet dat hij tijd heeft"], a: 1, exp: "of + sujet + ... + verbe à la fin (heeft)." },
    { type: "vf", q: "En question indirecte, on garde l'inversion de la question directe.", a: false, exp: "Faux : plus d'inversion ; sujet avant le verbe, verbe rejeté à la fin." },
    { type: "input", q: "Complète : « Ik vraag me af ___ het gaat lukken. » (si)", a: ["of"], ph: "conjonction", exp: "zich afvragen of = se demander si." },
    { type: "qcm", q: "Quel verbe signifie « se demander » ?", opts: ["vragen", "zich afvragen", "weten", "vertellen"], a: 1, exp: "zich afvragen = se demander." },
    { type: "input", q: "Complète : « Kun je me vertellen hoe ik naar het station moet ___? » (gaan)", a: ["gaan"], ph: "verbe", exp: "moet gaan rejeté à la fin de la subordonnée." },
    { type: "qcm", q: "Compréhension : « Ik weet niet of de winkel vandaag open is. » Que sait-on ?", opts: ["le magasin est ouvert", "le magasin est fermé", "on ignore s'il est ouvert", "le magasin déménage"], a: 2, exp: "of ... open is = on ne sait pas si le magasin est ouvert." },
    { type: "vf", q: "Compréhension : « We willen weten wanneer de trein vertrekt. » On veut connaître l'heure de départ du train.", a: true, exp: "wanneer de trein vertrekt = quand le train part." },
    { type: "qcm", q: "Compréhension : « Niemand weet waarom de vergadering is geannuleerd. » Que sait-on de la réunion ?", opts: ["elle a lieu demain", "on ne sait pas pourquoi elle a été annulée", "elle est reportée", "elle dure longtemps"], a: 1, exp: "waarom ... is geannuleerd = pourquoi elle a été annulée, et personne ne le sait." }
  ],
  final: {
    title: "Exercice final — Veel vragen op reis",
    intro: `<p>Lis ce texte de voyage puis réponds :</p>
<pre class="pseudo">Op het vliegveld had ik veel vragen.
Ik wist niet of mijn vlucht op tijd zou vertrekken.
Ik vroeg aan een medewerker waar ik moest inchecken.
Hij legde uit hoe ik naar de juiste gate kon lopen.
Ik vroeg me ook af of mijn koffer niet te zwaar was.
Uiteindelijk wist ik precies wanneer ik moest instappen.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Ik wist niet ___ mijn vlucht op tijd zou vertrekken. » (si)", a: ["of"], ph: "conjonction", exp: "Question oui/non → of." },
      { type: "qcm", q: "Que demande le voyageur à l'employé ?", opts: ["où enregistrer", "combien coûte le billet", "quand manger", "où dormir"], a: 0, exp: "waar ik moest inchecken = où je devais m'enregistrer." },
      { type: "input", q: "Complète : « Hij legde uit hoe ik naar de gate kon ___. » (lopen)", a: ["lopen"], ph: "verbe", exp: "kon lopen rejeté à la fin." },
      { type: "vf", q: "Le voyageur se demandait si sa valise n'était pas trop lourde.", a: true, exp: "of mijn koffer niet te zwaar was." },
      { type: "qcm", q: "Que savait-il finalement avec précision ?", opts: ["où manger", "quand embarquer", "combien de bagages", "quel siège"], a: 1, exp: "wanneer ik moest instappen = quand embarquer." }
    ],
    solution: `<p>Traduction : « À l'aéroport, j'avais beaucoup de questions. Je ne savais pas si mon vol partirait à l'heure. J'ai demandé à un employé où je devais m'enregistrer. Il m'a expliqué comment aller jusqu'à la bonne porte. Je me demandais aussi si ma valise n'était pas trop lourde. Finalement, je savais exactement quand je devais embarquer. »</p>
<p>Retiens : <strong>of</strong> pour les questions oui/non, le <strong>mot interrogatif</strong> conservé pour les questions ouvertes, et toujours le verbe rejeté à la fin de la subordonnée.</p>`
  }
};
</script>
