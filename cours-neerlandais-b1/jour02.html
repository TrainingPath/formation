  title: "Le plus-que-parfait",
  subtitle: "Raconter un passé antérieur à un autre passé : had / was + participe.",
  theory: `
<h3>1. À quoi sert le plus-que-parfait ?</h3>
<p>Le plus-que-parfait (en néerlandais <strong>de voltooid verleden tijd</strong>) sert à exprimer une action <strong>déjà terminée avant une autre action passée</strong>. En français : « J'avais déjà mangé quand tu es arrivé. » On empile donc deux moments dans le passé, et le plus-que-parfait désigne le plus ancien des deux.</p>
<h3>2. La formation : imparfait de hebben/zijn + participe passé</h3>
<p>La recette est simple si tu maîtrises déjà le parfait (perfectum). On remplace l'auxiliaire au présent par sa forme au <strong>prétérit</strong> (imparfait) :</p>
<pre class="pseudo">Parfait :          Ik heb gegeten.      J'ai mangé.
Plus-que-parfait : Ik had gegeten.      J'avais mangé.
Parfait :          Ik ben gegaan.       Je suis allé.
Plus-que-parfait : Ik was gegaan.       J'étais allé.</pre>
<p>On garde donc <strong>le même participe passé</strong> ; seul l'auxiliaire change : <strong>heb → had</strong>, <strong>ben → was</strong>.</p>
<h3>3. hebben ou zijn ?</h3>
<p>Même règle qu'au parfait. La plupart des verbes prennent <strong>hebben</strong> (→ had, hadden). Les verbes de <strong>mouvement</strong> ou de <strong>changement d'état</strong> prennent <strong>zijn</strong> (→ was, waren).</p>
<pre class="pseudo">had / hadden   +  participe   (majorité des verbes)
was / waren    +  participe   (gaan, komen, worden, blijven, zijn...)</pre>
<p><strong>Zij had haar huiswerk al gemaakt.</strong> = Elle avait déjà fait ses devoirs. · <strong>Wij waren te laat vertrokken.</strong> = Nous étions partis trop tard.</p>
<h3>4. La combinaison typique avec « toen »</h3>
<p>Très souvent, le plus-que-parfait apparaît avec <strong>toen</strong> (quand, lorsque) + prétérit dans l'autre proposition. Rappelle-toi que <strong>toen</strong> introduit une subordonnée : le verbe part à la fin.</p>
<pre class="pseudo">Toen ik thuiskwam, had hij het eten al gekookt.
Quand je suis rentré, il avait déjà préparé le repas.
Ze waren al vertrokken toen wij aankwamen.
Ils étaient déjà partis lorsque nous sommes arrivés.</pre>
<div class="tip">Le mot <strong>al</strong> (déjà) accompagne très souvent le plus-que-parfait : il souligne que l'action était bel et bien achevée avant l'autre.</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Gisteren wilde ik een film kijken, maar mijn broer had hem al gezien.
Ik had het huis schoongemaakt voordat de gasten kwamen.
Toen we in het restaurant aankwamen, waren de anderen al vertrokken.
Ze hadden niet op ons gewacht.</pre>
<p>Traduction : Hier je voulais regarder un film, mais mon frère l'avait déjà vu. J'avais nettoyé la maison avant que les invités n'arrivent. Quand nous sommes arrivés au restaurant, les autres étaient déjà partis. Ils ne nous avaient pas attendus.</p>
<div class="warn">Ne confonds pas le prétérit (une seule action passée : « ik werkte ») et le plus-que-parfait (une action antérieure à une autre : « ik had gewerkt »). Le plus-que-parfait exige TOUJOURS had/was + participe.</div>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire pour former le plus-que-parfait de « eten » ?", opts: ["heb", "had", "was", "ben"], a: 1, exp: "eten prend hebben → au plus-que-parfait : had gegeten." },
    { type: "input", q: "Complète : « Ik ___ gegeten voordat je kwam. » (avoir, plus-que-parfait)", a: ["had"], ph: "auxiliaire", exp: "had gegeten = j'avais mangé." },

    { type: "qcm", q: "« Elle avait déjà fait ses devoirs » se dit…", opts: ["Zij heeft haar huiswerk gemaakt", "Zij had haar huiswerk al gemaakt", "Zij maakte haar huiswerk", "Zij was haar huiswerk maken"], a: 1, exp: "had + gemaakt = plus-que-parfait ; al = déjà." },
    { type: "input", q: "Traduis l'auxiliaire de « Ils étaient partis » : « Ze ___ vertrokken. »", a: ["waren"], ph: "auxiliaire", exp: "vertrekken → zijn → waren." },
    { type: "qcm", q: "Quel mot introduit souvent le plus-que-parfait avec un prétérit ?", opts: ["als", "toen", "wanneer", "dan"], a: 1, exp: "toen (quand, dans le passé) + prétérit se combine avec le plus-que-parfait." },
    { type: "vf", q: "« al » (déjà) accompagne fréquemment le plus-que-parfait.", a: true, exp: "al souligne l'action déjà achevée avant l'autre moment passé." },
    { type: "input", q: "Complète : « Toen ik thuiskwam, ___ hij het eten al gekookt. » (avoir)", a: ["had"], ph: "auxiliaire", exp: "had gekookt = avait cuisiné." },
    { type: "qcm", q: "Dans « Toen we aankwamen, waren de anderen al vertrokken », que s'est-il passé EN PREMIER ?", opts: ["notre arrivée", "le départ des autres", "les deux en même temps", "on ne sait pas"], a: 1, exp: "Le plus-que-parfait (waren vertrokken) marque l'action la plus ancienne." },
    { type: "input", q: "Mets au plus-que-parfait : « Ik ___ het huis schoongemaakt. » (avoir)", a: ["had"], ph: "auxiliaire", exp: "schoonmaken prend hebben → had schoongemaakt." },
    { type: "qcm", q: "Compréhension : « Mijn broer had de film al gezien. » Le frère…", opts: ["va voir le film", "avait déjà vu le film", "n'aime pas le film", "regarde le film maintenant"], a: 1, exp: "had al gezien = avait déjà vu." },
    { type: "vf", q: "Compréhension : « Ze hadden niet op ons gewacht. » Ils nous avaient attendus.", a: false, exp: "niet gewacht = n'avaient pas attendu, donc c'est faux." },
    { type: "qcm", q: "Compréhension : « Ik had het huis schoongemaakt voordat de gasten kwamen. » Quand la maison a-t-elle été nettoyée ?", opts: ["après l'arrivée des invités", "avant l'arrivée des invités", "pendant la visite", "jamais"], a: 1, exp: "voordat de gasten kwamen = avant que les invités n'arrivent." }
  ],

    intro: `<p>Lis ce récit puis réponds :</p>
<pre class="pseudo">Zaterdag wilde ik mijn vrienden verrassen met een etentje.
Ik had de hele dag gekookt en het huis netjes gemaakt.
Maar toen ze belden, hadden ze al gegeten in een restaurant.

    questions: [

      { type: "qcm", q: "Pourquoi ont-ils mangé ailleurs ?", opts: ["ils n'aimaient pas la cuisine", "ils avaient oublié l'heure", "ils étaient malades", "il pleuvait"], a: 1, exp: "Ze waren het uur vergeten dat ik had genoemd." },
      { type: "vf", q: "La soirée s'est finalement mal terminée.", a: false, exp: "hadden we nog een gezellige avond = une soirée agréable ; donc faux." }
    ],
    solution: `<p>Traduction : « Samedi je voulais surprendre mes amis avec un dîner. J'avais cuisiné toute la journée et rangé la maison. Mais quand ils ont appelé, ils avaient déjà mangé au restaurant. Ils avaient en effet oublié l'heure que j'avais indiquée. Heureusement, nous avons quand même passé une soirée agréable ensuite avec une bonne bouteille de vin. »</p>
<p>Remarque l'empilement des temps : le plus-que-parfait (had gekookt, hadden gegeten, waren vergeten, had genoemd) situe des actions antérieures au moment central du récit.</p>`
  }
};
