<script>
var DAY = {
  num: 20,
  title: "Les particules modales (toch, wel, eens, maar)",
  subtitle: "Ces petits mots qui donnent le ton : nuance, insistance, douceur.",
  theory: `
<h3>1. Qu'est-ce qu'une particule modale ?</h3>
<p>Les <strong>particules modales</strong> (modale partikels) sont de petits mots (toch, wel, eens, maar, even, nou, hoor...) qui n'ont presque pas de traduction fixe mais colorent le ton de la phrase : elles rendent une demande plus douce, une affirmation plus insistante, une remarque plus complice. Elles se placent en général au <strong>milieu</strong> de la phrase.</p>
<div class="tip">Ne cherche pas une traduction mot à mot : ressens l'effet. Un même mot (« maar ») peut être la conjonction « mais » ou une particule qui adoucit un ordre. Le contexte décide.</p></div>
<h3>2. toch — quand même / pourtant / n'est-ce pas</h3>
<pre class="pseudo">Ik ga toch.                  J'y vais quand même.
Je komt toch morgen?         Tu viens bien demain, non ?
Het is toch mooi weer!       Il fait quand même beau, non !</pre>
<p><strong>toch</strong> marque l'opposition à une attente, ou cherche une confirmation (« n'est-ce pas ? »).</p>
<h3>3. wel — bien (si), au contraire</h3>
<p><strong>wel</strong> est l'opposé de <strong>niet</strong> : il affirme, contredit une négation ou renforce :</p>
<pre class="pseudo">— Je houdt niet van koffie.  — Tu n'aimes pas le café.
— Ik hou er wel van!         — Si, j'aime bien !
Dat is wel duur.             C'est quand même cher.</pre>
<h3>4. eens et maar — adoucir une demande</h3>
<p><strong>eens</strong> (souvent écrit « es ») et <strong>maar</strong> rendent un impératif plus aimable, moins sec :</p>
<pre class="pseudo">Kom eens hier.               Viens donc ici.
Kijk eens!                   Regarde donc !
Ga maar zitten.              Assieds-toi donc (vas-y).
Zeg het maar.                Dis-le sans souci.</pre>
<div class="warn">Sans particule, l'impératif « Kom hier ! » sonne comme un ordre sec. Avec <strong>eens</strong> ou <strong>maar</strong>, « Kom eens hier » / « Ga maar zitten » devient une invitation aimable. Ces particules sont essentielles pour paraître poli et naturel.</p></div>
<h3>5. Combinaisons fréquentes</h3>
<pre class="pseudo">Kijk maar eens.              Regarde donc un peu.
Doe maar.                    Vas-y (fais-le). / Volontiers.
Zeg maar Jan.               Appelle-moi Jan (tutoie-moi).</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi servent les particules modales ?", opts: ["à conjuguer les verbes", "à colorer le ton (douceur, insistance...)", "à former le pluriel", "à poser une date"], a: 1, exp: "Elles nuancent le ton, sans traduction fixe." },
    { type: "qcm", q: "« Je komt toch morgen? » exprime surtout…", opts: ["un ordre sec", "une recherche de confirmation (n'est-ce pas ?)", "un refus", "une date exacte"], a: 1, exp: "toch ici = n'est-ce pas ? (confirmation)." },
    { type: "input", q: "Complète (contredire une négation) : « — Je houdt niet van koffie. — Ik hou er ___ van! »", a: ["wel"], ph: "un mot", exp: "wel = si (au contraire), opposé de niet." },
    { type: "vf", q: "« wel » est l'opposé de « niet ».", a: true, exp: "wel affirme là où niet nie." },
    { type: "qcm", q: "« Ga maar zitten » sonne comment par rapport à « Ga zitten » ?", opts: ["plus sec", "plus aimable / invitant", "identique", "grammaticalement faux"], a: 1, exp: "maar adoucit l'impératif : « assieds-toi donc »." },
    { type: "input", q: "Complète pour adoucir : « Kom ___ hier. » (viens donc ici)", a: ["eens", "es"], ph: "un mot", exp: "eens (es) rend l'impératif aimable." },
    { type: "qcm", q: "« Ik ga toch » signifie…", opts: ["Je n'y vais pas", "J'y vais quand même", "J'y vais demain", "Je ne sais pas"], a: 1, exp: "toch = quand même (opposition à une attente)." },
    { type: "vf", q: "Un impératif sans particule (« Kom hier! ») sonne plus sec qu'avec « eens » ou « maar ».", a: true, exp: "Les particules eens/maar adoucissent l'ordre." },
    { type: "qcm", q: "« Dat is wel duur » veut dire à peu près…", opts: ["Ce n'est pas cher", "C'est quand même cher", "C'est gratuit", "C'est bon marché"], a: 1, exp: "wel renforce ici : c'est quand même/plutôt cher." },
    { type: "input", q: "Complète (invitation aimable) : « Zeg het ___. » (dis-le sans souci)", a: ["maar"], ph: "un mot", exp: "maar adoucit : dis-le donc, vas-y." },
    { type: "qcm", q: "Où se placent généralement les particules modales ?", opts: ["toujours en premier", "au milieu de la phrase", "toujours à la fin", "avant le sujet"], a: 1, exp: "En général au milieu de la phrase." },
    { type: "qcm", q: "« Zeg maar Jan » signifie…", opts: ["Ne me parle pas", "Appelle-moi Jan / tutoie-moi", "Jan a dit quelque chose", "Dis à Jan de venir"], a: 1, exp: "Zeg maar Jan = tu peux m'appeler Jan (invitation à moins de formalité)." },
    { type: "qcm", q: "Compréhension : « — Kom je niet mee? — Jawel, ik kom wel mee. » La personne vient-elle ?", opts: ["non", "oui (elle contredit la négation avec wel)", "on ne sait pas", "seulement demain"], a: 1, exp: "wel contredit « niet » : oui, elle vient." },
    { type: "vf", q: "Compréhension : « Kijk eens, wat mooi! » exprime un ordre agressif.", a: false, exp: "eens adoucit : « Regarde donc, comme c'est beau ! » — c'est chaleureux." },
    { type: "qcm", q: "Compréhension : « Het regent, maar we gaan toch naar buiten. » Que décide-t-on malgré la pluie ?", opts: ["rester dedans", "sortir quand même", "attendre demain", "prendre le bus"], a: 1, exp: "toch = quand même : on sort malgré la pluie." }
  ],
  final: {
    title: "Exercice final — Un dialogue plein de particules",
    intro: `<p>Lis ce dialogue et sens le ton de chaque particule, puis réponds :</p>
<pre class="pseudo">Els: Kom eens kijken! Ik heb een nieuwe fiets.
Sam: Wat mooi! Maar is die niet duur?
Els: Hij is wel duur, maar hij gaat lang mee.
Sam: Je fietst toch elke dag, dus dat is een goede keuze.
Els: Precies. Ga maar even zitten, dan drinken we koffie.
Sam: Doe maar. Ik heb toch geen haast vandaag.</pre>`,
    questions: [
      { type: "input", q: "Comment Els invite-t-elle aimablement Sam à regarder ? « Kom ___ kijken! »", a: ["eens", "es"], ph: "un mot", exp: "eens adoucit l'impératif : viens donc voir." },
      { type: "qcm", q: "Le vélo est-il cher, selon Els ?", opts: ["non, pas du tout", "oui, il est quand même cher (wel duur) mais dure longtemps", "il est gratuit", "elle ne sait pas"], a: 1, exp: "Hij is wel duur, maar hij gaat lang mee." },
      { type: "qcm", q: "Pourquoi Sam trouve-t-il que c'est un bon choix ?", opts: ["parce qu'Els est riche", "parce qu'Els fait du vélo chaque jour (toch elke dag)", "parce que c'est joli", "parce que c'est rapide"], a: 1, exp: "Je fietst toch elke dag = tu fais quand même du vélo tous les jours." },
      { type: "input", q: "Comment Els propose-t-elle poliment de s'asseoir ? « Ga ___ even zitten. »", a: ["maar"], ph: "un mot", exp: "maar adoucit : assieds-toi donc." },
      { type: "qcm", q: "Pourquoi Sam accepte-t-il tranquillement ?", opts: ["il est très pressé", "il n'est pourtant pas pressé aujourd'hui (toch geen haast)", "il doit partir", "il n'aime pas le café"], a: 1, exp: "Ik heb toch geen haast = je ne suis pourtant pas pressé." }
    ],
    solution: `<p>Traduction : « Els : Viens donc voir ! J'ai un nouveau vélo. — Sam : Comme il est beau ! Mais il n'est pas cher ? — Els : Il est quand même cher, mais il dure longtemps. — Sam : Tu fais du vélo tous les jours, donc c'est un bon choix. — Els : Exactement. Assieds-toi donc un instant, on va boire un café. — Sam : Volontiers. Je ne suis pourtant pas pressé aujourd'hui. »</p>
<p>Observe comment <strong>eens</strong> et <strong>maar</strong> transforment les ordres en invitations chaleureuses, comment <strong>wel</strong> nuance (« quand même cher »), et comment <strong>toch</strong> renvoie à une évidence partagée. Ces particules sont ce qui distingue un néerlandais scolaire d'un néerlandais naturel.</p>`
  }
};
</script>
