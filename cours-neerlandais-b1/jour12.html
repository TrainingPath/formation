<body>
<script>
var DAY = {
  num: 12,
  title: "Le vocabulaire du travail et le CV",
  subtitle: "Parler de sa carrière, de ses compétences et rédiger un CV en néerlandais.",
  theory: `
<h3>1. Le monde du travail — de arbeidswereld</h3>
<pre class="pseudo">de baan / de functie   l'emploi / le poste   de werkgever   l'employeur
het werk               le travail            de werknemer   l'employé
het bedrijf            l'entreprise          de collega     le collègue
de afdeling            le service            de chef/baas   le chef
het salaris            le salaire            de sollicitatie la candidature
de vacature            l'offre d'emploi      het contract   le contrat</pre>
<h3>2. Parler de son parcours</h3>
<pre class="pseudo">solliciteren naar       postuler à           werkervaring    l'expérience professionnelle
in dienst treden        entrer en fonction   de opleiding    la formation
ontslag nemen           démissionner         het diploma     le diplôme
ontslagen worden        être licencié        de stage        le stage
promotie maken          être promu           voltijds/deeltijds à temps plein/partiel</pre>
<p><strong>Ik heb vijf jaar werkervaring in de marketing.</strong> = J'ai cinq ans d'expérience professionnelle dans le marketing. · <strong>Ik solliciteer naar de functie van teamleider.</strong> = Je postule au poste de chef d'équipe.</p>
<h3>3. Les compétences — de vaardigheden</h3>
<pre class="pseudo">verantwoordelijk        responsable         zelfstandig     autonome
nauwkeurig              précis, minutieux    flexibel        flexible
stressbestendig         résistant au stress  communicatief   communicatif
teamspeler              esprit d'équipe      leergierig      avide d'apprendre</pre>
<p><strong>Ik werk graag zelfstandig, maar ik ben ook een echte teamspeler.</strong> = J'aime travailler de façon autonome, mais je suis aussi un vrai joueur d'équipe.</p>
<h3>4. Structurer un CV — het cv</h3>
<pre class="pseudo">Persoonlijke gegevens   Coordonnées personnelles
Werkervaring            Expérience professionnelle
Opleiding               Formation
Vaardigheden            Compétences
Talen                   Langues
Hobby's / Interesses    Loisirs / Centres d'intérêt</pre>
<div class="tip">Pour les langues sur un CV, utilise les niveaux : <strong>moedertaal</strong> (langue maternelle), <strong>vloeiend</strong> (courant), <strong>goed</strong> (bon), <strong>basiskennis</strong> (notions de base).</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Anna werkt al drie jaar als verpleegkundige in een groot ziekenhuis.
Ze heeft veel werkervaring en werkt zowel zelfstandig als in team.
Nu solliciteert ze naar een functie met meer verantwoordelijkheid.
In haar cv vermeldt ze haar opleiding, haar talen en haar vaardigheden.
Ze hoopt binnenkort promotie te maken en voltijds te blijven werken.</pre>
<p>Traduction : Anna travaille depuis trois ans comme infirmière dans un grand hôpital. Elle a beaucoup d'expérience et travaille aussi bien de façon autonome qu'en équipe. Maintenant, elle postule à un poste avec plus de responsabilités. Dans son CV, elle mentionne sa formation, ses langues et ses compétences. Elle espère être bientôt promue et continuer à travailler à temps plein.</p>
<div class="warn">Ne confonds pas <strong>werkgever</strong> (l'employeur, celui qui donne le travail) et <strong>werknemer</strong> (l'employé, celui qui le prend). Astuce : geven = donner, nemen = prendre.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « de werkgever » ?", opts: ["l'employé", "l'employeur", "le collègue", "le chômeur"], a: 1, exp: "werk + gever (celui qui donne le travail) = l'employeur." },
    { type: "input", q: "Traduis « l'entreprise » : ___", a: ["het bedrijf", "bedrijf"], ph: "un mot", exp: "het bedrijf = l'entreprise." },
    { type: "qcm", q: "« solliciteren naar » signifie…", opts: ["démissionner de", "postuler à", "être licencié de", "être promu à"], a: 1, exp: "solliciteren naar = postuler à." },
    { type: "input", q: "Complète : « Ik heb vijf jaar ___ in de marketing. » (expérience professionnelle)", a: ["werkervaring"], ph: "un mot", exp: "werkervaring = expérience professionnelle." },
    { type: "vf", q: "« ontslag nemen » signifie être licencié.", a: false, exp: "Faux : ontslag nemen = démissionner ; ontslagen worden = être licencié." },
    { type: "qcm", q: "Que veut dire « de vacature » ?", opts: ["les vacances", "l'offre d'emploi", "le salaire", "le contrat"], a: 1, exp: "de vacature = l'offre / le poste vacant." },
    { type: "input", q: "Traduis « le salaire » : het ___", a: ["salaris"], ph: "un mot", exp: "het salaris = le salaire." },
    { type: "qcm", q: "Une personne « stressbestendig » est…", opts: ["souvent malade", "résistante au stress", "toujours en retard", "peu qualifiée"], a: 1, exp: "stressbestendig = résistant au stress." },
    { type: "vf", q: "« promotie maken » veut dire être promu.", a: true, exp: "promotie maken = obtenir une promotion." },
    { type: "input", q: "Complète : « Ik werk graag ___, maar ook in team. » (de façon autonome)", a: ["zelfstandig"], ph: "un mot", exp: "zelfstandig = autonome, indépendant." },
    { type: "qcm", q: "Quelle rubrique de CV correspond à « Opleiding » ?", opts: ["Loisirs", "Formation", "Langues", "Compétences"], a: 1, exp: "Opleiding = formation / études." },
    { type: "input", q: "Sur un CV, quel mot signifie « langue maternelle » ? ___", a: ["moedertaal"], ph: "un mot", exp: "moedertaal = langue maternelle." },
    { type: "qcm", q: "Compréhension : « Anna werkt als verpleegkundige in een ziekenhuis. » Quel est son métier ?", opts: ["professeure", "infirmière", "vendeuse", "ingénieure"], a: 1, exp: "verpleegkundige = infirmier/infirmière." },
    { type: "vf", q: "Compréhension : « Nu solliciteert ze naar een functie met meer verantwoordelijkheid. » Elle cherche un poste à plus de responsabilités.", a: true, exp: "meer verantwoordelijkheid = plus de responsabilités." },
    { type: "qcm", q: "Compréhension : « Ze hoopt promotie te maken en voltijds te blijven werken. » Que souhaite Anna ?", opts: ["démissionner", "être promue et rester à temps plein", "travailler à temps partiel", "changer de pays"], a: 1, exp: "promotie maken en voltijds blijven werken." }
  ],
  final: {
    title: "Exercice final — Een korte cv-tekst",
    intro: `<p>Lis ce mini-CV rédigé puis réponds :</p>
<pre class="pseudo">Mijn naam is Karim El Amrani. Ik ben 29 jaar en ik woon in Gent.
Ik heb een diploma in informatica en drie jaar werkervaring als softwareontwikkelaar.
In mijn huidige baan werk ik voltijds in een klein maar dynamisch bedrijf.
Ik ben nauwkeurig, leergierig en ik werk goed in team.
Ik spreek vloeiend Nederlands en Frans, en ik heb een basiskennis Engels.
Nu zoek ik een nieuwe uitdaging met meer verantwoordelijkheid.</pre>`,
    questions: [
      { type: "input", q: "Quel diplôme a Karim ? Een diploma in ___", a: ["informatica"], ph: "un mot", exp: "een diploma in informatica = un diplôme en informatique." },
      { type: "qcm", q: "Combien d'années d'expérience a-t-il ?", opts: ["un an", "trois ans", "cinq ans", "dix ans"], a: 1, exp: "drie jaar werkervaring." },
      { type: "vf", q: "Il travaille actuellement à temps partiel.", a: false, exp: "Faux : hij werkt voltijds (à temps plein)." },
      { type: "qcm", q: "Quel est son niveau d'anglais ?", opts: ["langue maternelle", "courant", "notions de base", "aucune"], a: 2, exp: "een basiskennis Engels = des notions de base en anglais." },
      { type: "input", q: "Que recherche-t-il maintenant ? Een nieuwe ___ met meer verantwoordelijkheid.", a: ["uitdaging"], ph: "un mot", exp: "een nieuwe uitdaging = un nouveau défi." }
    ],
    solution: `<p>Traduction : « Je m'appelle Karim El Amrani. J'ai 29 ans et j'habite à Gand. J'ai un diplôme en informatique et trois ans d'expérience comme développeur de logiciels. Dans mon emploi actuel, je travaille à temps plein dans une petite entreprise dynamique. Je suis minutieux, avide d'apprendre et je travaille bien en équipe. Je parle couramment le néerlandais et le français, et j'ai des notions d'anglais. Maintenant, je cherche un nouveau défi avec plus de responsabilités. »</p>
<p>Un bon profil combine : le <strong>parcours</strong> (diploma, werkervaring), les <strong>compétences</strong> (nauwkeurig, leergierig, teamspeler), les <strong>langues</strong> (vloeiend, basiskennis) et un <strong>objectif</strong> (een nieuwe uitdaging).</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en néerlandais…",
  items: [
  { id: "nl-b1-j12", title: "Rédige ton mini-CV", level: 2,
    statement: "Rédige un court texte de présentation professionnelle (6 à 8 phrases) comme sur un CV : ton parcours, ton expérience, tes compétences, tes langues et ce que tu recherches.",
    hints: [
      "Utilise le vocabulaire : diploma, werkervaring, functie, vaardigheden.",
      "Décris tes qualités : nauwkeurig, zelfstandig, teamspeler, flexibel.",
      "Indique tes langues avec vloeiend, goed, basiskennis."
    ],
    solution: "Mijn naam is Sofie Janssens en ik ben 34 jaar. Ik heb een diploma in economie en acht jaar werkervaring in de financiële sector. In mijn huidige functie werk ik als teamleider in een groot bedrijf. Ik ben verantwoordelijk, nauwkeurig en stressbestendig. Ik werk graag zelfstandig, maar ik ben ook een echte teamspeler. Ik spreek vloeiend Nederlands en Engels en ik heb een goede kennis van het Frans. Nu zoek ik een nieuwe uitdaging met meer verantwoordelijkheid. Ik ben leergierig en altijd bereid om nieuwe dingen te leren.\n\nTraduction : Je m'appelle Sofie Janssens et j'ai 34 ans. J'ai un diplôme en économie et huit ans d'expérience dans le secteur financier. Dans mon poste actuel, je travaille comme chef d'équipe dans une grande entreprise. Je suis responsable, minutieuse et résistante au stress. J'aime travailler de façon autonome, mais je suis aussi une vraie joueuse d'équipe. Je parle couramment le néerlandais et l'anglais et j'ai une bonne connaissance du français. Maintenant, je cherche un nouveau défi avec plus de responsabilités. Je suis avide d'apprendre et toujours prête à apprendre de nouvelles choses.",
    note: "Structure ton texte comme un CV : parcours, compétences, langues, objectif. Utilise un vocabulaire professionnel précis." }
  ]
};
</script>
