  title: "Raconter un événement en détail",
  subtitle: "Structurer un récit au passé : chronologie, détails et émotions.",
  theory: `
<h3>1. Choisir le bon temps du passé</h3>
<p>Pour raconter, on combine deux temps. Le <strong>parfait</strong> (perfectum : heb/ben + participe) sert aux actions ponctuelles, surtout à l'oral. L'<strong>imparfait</strong> (imperfectum) sert au décor, aux habitudes et aux descriptions. Souvent, on lance le récit au parfait puis on poursuit à l'imparfait.</p>
<pre class="pseudo">Vorige zomer ben ik naar Spanje gegaan.   L'été dernier je suis allé en Espagne. (parfait)
Het was heel warm en de zee was mooi.     Il faisait très chaud et la mer était belle. (imparfait, décor)</pre>
<h3>2. Les mots de la chronologie</h3>
<pre class="pseudo">eerst          d'abord         daarna / toen   ensuite / alors
vervolgens     puis            even later      un peu plus tard
plotseling     soudain         uiteindelijk    finalement
's ochtends     le matin        'de volgende dag le lendemain</pre>
<p><strong>Eerst gingen we wandelen, daarna hebben we gegeten en 's avonds zijn we naar een concert geweest.</strong> = D'abord on est allés se promener, ensuite on a mangé et le soir on est allés à un concert.</p>
<h3>3. Ajouter des détails et des émotions</h3>
<pre class="pseudo">Ik was verrast / blij / bang.     J'étais surpris / content / effrayé.
Het was een onvergetelijke dag.   C'était un jour inoubliable.
Gelukkig ...                      Heureusement ...
Helaas ...                        Malheureusement ...
Tot mijn verbazing ...            À ma grande surprise ...</pre>
<div class="tip">Pour rendre un récit vivant, alterne les actions (parfait) et les descriptions/émotions (imparfait), et ponctue avec <strong>plotseling</strong>, <strong>gelukkig</strong> ou <strong>tot mijn verbazing</strong>. Ces mots donnent du relief.</p></div>
<h3>4. La place du verbe</h3>
<p>Quand une phrase commence par un mot de temps (eerst, toen, daarna), il y a <strong>inversion</strong> : le verbe passe avant le sujet.</p>
<pre class="pseudo">Toen kwam de bus eindelijk.       Alors le bus est enfin arrivé.
Daarna zijn we naar huis gegaan.  Ensuite nous sommes rentrés.</pre>
<div class="warn">Ne confonds pas <strong>toen</strong> (alors / quand, pour le passé) et <strong>dan</strong> (alors / puis, pour le présent-futur ou une conséquence). Pour raconter au passé, c'est presque toujours <strong>toen</strong> : « Toen ik jong was ... » (Quand j'étais jeune ...).</p></div>`,

    { type: "input", q: "Complète (chronologie) : « ___ gingen we wandelen, daarna hebben we gegeten. » (d'abord)", a: ["eerst"], ph: "un mot", exp: "eerst = d'abord." },
    { type: "qcm", q: "Que signifie « plotseling » ?", opts: ["finalement", "soudain", "d'abord", "le lendemain"], a: 1, exp: "plotseling = soudain / tout à coup." },
    { type: "qcm", q: "Quel auxiliaire pour « ik ___ naar Spanje gegaan » ?", opts: ["heb", "ben", "was", "had"], a: 1, exp: "gaan (mouvement) → ben gegaan." },
    { type: "input", q: "Complète : « ___ mijn verbazing was de winkel dicht. » (à ma grande surprise)", a: ["tot"], ph: "un mot", exp: "tot mijn verbazing = à ma grande surprise." },
    { type: "vf", q: "Pour raconter au passé, on utilise surtout « toen » et non « dan ».", a: true, exp: "toen = alors/quand (passé) ; dan = alors (présent/futur/conséquence)." },
    { type: "qcm", q: "« Toen kwam de bus eindelijk » : pourquoi « kwam » avant « de bus » ?", opts: ["erreur", "inversion : la phrase commence par « toen »", "parce que « bus » est féminin", "par hasard"], a: 1, exp: "Un mot de temps en tête entraîne l'inversion." },
    { type: "input", q: "Traduis « heureusement » : ___", a: ["gelukkig"], ph: "un mot", exp: "gelukkig = heureusement." },
    { type: "qcm", q: "« Het was een onvergetelijke dag » signifie…", opts: ["C'était un jour ordinaire", "C'était un jour inoubliable", "C'était un jour triste", "C'était un long jour"], a: 1, exp: "onvergetelijk = inoubliable." },
    { type: "vf", q: "On peut commencer un récit au parfait puis continuer à l'imparfait.", a: true, exp: "C'est une combinaison très naturelle en néerlandais." },
    { type: "input", q: "Complète : « ___ later kwam mijn vriend aan. » (un peu plus tard)", a: ["even"], ph: "un mot", exp: "even later = un peu plus tard." },

    { type: "qcm", q: "Compréhension : « Eerst regende het, maar 's middags werd het mooi weer. » Quel temps faisait-il l'après-midi ?", opts: ["il pleuvait encore", "il faisait beau", "il neigeait", "il y avait du vent"], a: 1, exp: "'s middags werd het mooi weer = l'après-midi il a fait beau." },
    { type: "vf", q: "Compréhension : « Plotseling ging het licht uit en iedereen schrok. » L'événement était soudain.", a: true, exp: "plotseling = soudain ; schrikken = sursauter/prendre peur." },
    { type: "qcm", q: "Compréhension : « Toen ik jong was, woonde ik op het platteland. » De quoi parle la phrase ?", opts: ["d'un projet futur", "d'un souvenir d'enfance (quand j'étais jeune)", "d'aujourd'hui", "de demain"], a: 1, exp: "Toen ik jong was = quand j'étais jeune (souvenir)." }
  ],
  final: {

<pre class="pseudo">Vorige zomer ben ik met vrienden naar de Ardennen gegaan. Het was prachtig weer.

Even later begon het plotseling hard te regenen. Gelukkig hadden we onze jassen bij.
's Avonds hebben we samen gekookt en verhalen verteld rond het vuur.

    questions: [

      { type: "input", q: "Qu'ont-ils fait EN PREMIER ? Ils ont monté leurs ___ (tentes)", a: ["tenten"], ph: "un mot", exp: "Eerst hebben we onze tenten opgezet." },
      { type: "qcm", q: "Que s'est-il passé soudain pendant la promenade ?", opts: ["ils se sont perdus", "il s'est mis à pleuvoir fort", "ils ont vu un cerf", "le soleil est apparu"], a: 1, exp: "begon het plotseling hard te regenen." },
      { type: "input", q: "Pourquoi n'était-ce pas grave ? Heureusement ils avaient leurs ___ (vestes)", a: ["jassen"], ph: "un mot", exp: "Gelukkig hadden we onze jassen bij." },
      { type: "qcm", q: "Comment la personne qualifie-t-elle cette journée à la fin ?", opts: ["ennuyeuse", "inoubliable", "trop courte", "décevante"], a: 1, exp: "Het was een onvergetelijke dag." }
    ],
    solution: `<p>Traduction : « L'été dernier je suis allé dans les Ardennes avec des amis. Il faisait un temps magnifique. D'abord nous avons monté nos tentes, ensuite nous sommes allés nous promener dans la forêt. Un peu plus tard, il s'est soudain mis à pleuvoir fort. Heureusement, nous avions nos vestes sur nous. Le soir, nous avons cuisiné ensemble et raconté des histoires autour du feu. Quand j'étais couché dans ma tente, j'entendais la pluie sur la toile. C'était un jour inoubliable. »</p>
<p>Observe l'alternance parfait (actions : <strong>hebben opgezet, zijn gegaan</strong>) / imparfait (décor et émotions : <strong>was, hoorde, hadden</strong>), les connecteurs de chronologie (<strong>eerst, daarna, even later</strong>) et les émotions (<strong>gelukkig, onvergetelijk</strong>). C'est la recette d'un récit vivant.</p>`
  }
