<script>
var DAY = {
  num: 22,
  title: "Compréhension : un fait divers court",
  subtitle: "Comprendre un court fait divers et son vocabulaire spécifique.",
  theory: `
<h3>1. Le fait divers — het nieuwsbericht / het voorval</h3>
<p>Un fait divers est un court article qui raconte un événement récent : un accident, un vol, un sauvetage... Il répond aux mêmes questions (wie, wat, waar, wanneer) et utilise souvent le <strong>passé</strong> (imparfait et parfait). Le vocabulaire de la police et des secours revient souvent.</p>
<div class="tip">Dans un fait divers, repère les temps du passé (gebeurde, is gearresteerd) et les mots de temps (gisteren, vannacht, rond drie uur) : ils situent l'événement.</p></div>
<h3>2. Le fait divers</h3>
<pre class="pseudo">Man redt hond uit koud kanaal

Gisterenmiddag is in Gent een bijzonder voorval gebeurd. Rond twee uur
zag een voorbijganger een hond in het koude water van een kanaal.
Het dier was in het water gevallen en kon er niet meer uit.

De man, een 34-jarige inwoner van Gent, aarzelde niet en sprong meteen
in het water. Na een paar minuten kon hij de hond veilig op de kant brengen.
Omstanders belden intussen de brandweer.

De hond had het erg koud, maar was verder ongedeerd. De eigenaar,
die even niet had opgelet, was heel dankbaar. « Ik ben deze held
voor altijd dankbaar », zei hij. De man zelf bleef bescheiden:
« Iedereen zou dit doen. »</pre>
<h3>3. Vocabulaire du fait divers</h3>
<pre class="pseudo">het voorval       l'événement/incident  gebeuren         se produire
de voorbijganger  le passant            aarzelen         hésiter
springen          sauter                de omstander     le badaud/témoin
de brandweer      les pompiers          ongedeerd        indemne
de eigenaar       le propriétaire       dankbaar         reconnaissant
de held           le héros              bescheiden       modeste</pre>
<div class="warn">Le passé composé néerlandais (voltooid verleden tijd) se forme avec <strong>zijn</strong> ou <strong>hebben</strong> + participe : « is gebeurd » (s'est produit), « was gevallen » (était tombé). Les verbes de mouvement ou de changement d'état prennent souvent <strong>zijn</strong>.</p></div>`,
  exercises: [
    { type: "qcm", q: "Que raconte ce fait divers ?", opts: ["un vol de vélo", "un homme sauve un chien d'un canal froid", "un incendie", "un accident de voiture"], a: 1, exp: "Man redt hond uit koud kanaal." },
    { type: "input", q: "Où l'événement s'est-il produit ? in ___", a: ["gent"], ph: "une ville", exp: "in Gent = à Gand." },
    { type: "qcm", q: "Vers quelle heure la scène a-t-elle eu lieu ?", opts: ["vers midi", "vers deux heures", "vers cinq heures", "à minuit"], a: 1, exp: "Rond twee uur = vers deux heures." },
    { type: "vf", q: "Le chien était tombé dans l'eau et ne pouvait plus en sortir.", a: true, exp: "Het dier was in het water gevallen en kon er niet meer uit." },
    { type: "qcm", q: "Quel âge a l'homme qui a sauté à l'eau ?", opts: ["24 ans", "34 ans", "44 ans", "54 ans"], a: 1, exp: "een 34-jarige inwoner van Gent." },
    { type: "input", q: "Que signifie « aarzelen » ? Il n'a pas ___ (il n'a pas hésité)", a: ["hésité", "hesite"], ph: "en français", exp: "aarzelen = hésiter ; hij aarzelde niet = il n'a pas hésité." },
    { type: "qcm", q: "Qui les badauds ont-ils appelé entre-temps ?", opts: ["la police", "les pompiers", "le vétérinaire", "l'ambulance"], a: 1, exp: "Omstanders belden intussen de brandweer." },
    { type: "qcm", q: "Dans quel état était le chien à la fin ?", opts: ["gravement blessé", "il avait très froid mais était indemne", "disparu", "endormi"], a: 1, exp: "had het erg koud, maar was verder ongedeerd." },
    { type: "input", q: "Comment dit-on « le propriétaire » ? de ___", a: ["eigenaar"], ph: "un mot", exp: "de eigenaar = le propriétaire." },
    { type: "vf", q: "Le propriétaire était en colère contre l'homme.", a: false, exp: "Non : il était heel dankbaar (très reconnaissant)." },
    { type: "qcm", q: "Comment l'homme a-t-il réagi aux remerciements ?", opts: ["fièrement", "modestement (« tout le monde ferait ça »)", "il a demandé de l'argent", "il n'a rien dit"], a: 1, exp: "bescheiden: « Iedereen zou dit doen. »" },
    { type: "qcm", q: "« ongedeerd » signifie…", opts: ["blessé", "indemne", "mouillé", "perdu"], a: 1, exp: "ongedeerd = indemne, sans blessure." },
    { type: "input", q: "Complète : « Gisterenmiddag is er een voorval ___. » (se produire → s'est produit)", a: ["gebeurd"], ph: "un participe", exp: "gebeuren → is gebeurd (s'est produit)." },
    { type: "qcm", q: "Compréhension : pourquoi le propriétaire n'avait-il pas vu son chien tomber ?", opts: ["il dormait", "il n'avait un instant pas fait attention (niet opgelet)", "il était parti", "il téléphonait"], a: 1, exp: "die even niet had opgelet = qui n'avait un instant pas fait attention." },
    { type: "vf", q: "Le passé composé « is gevallen » utilise l'auxiliaire « zijn » car « vallen » est un verbe de mouvement/changement d'état.", a: true, exp: "Les verbes de mouvement/changement d'état prennent souvent zijn." }
  ],
  final: {
    title: "Exercice final — Les 5 W du fait divers",
    intro: `<p>Un bon lecteur de fait divers sait répondre aux « 5 W » (wie, wat, waar, wanneer, waarom). Relis mentalement l'histoire du chien, puis réponds :</p>
<pre class="pseudo">Wie?    de man, de hond, de eigenaar
Wat?    een redding
Waar?   in een kanaal in Gent
Wanneer? gisterenmiddag, rond twee uur</pre>`,
    questions: [
      { type: "qcm", q: "WIE (qui) est le héros de l'histoire ?", opts: ["un pompier", "un passant de 34 ans", "le propriétaire du chien", "un policier"], a: 1, exp: "een 34-jarige voorbijganger/inwoner van Gent." },
      { type: "input", q: "WAT (quoi) : quel animal a été sauvé ? een ___", a: ["hond"], ph: "un animal", exp: "een hond = un chien." },
      { type: "qcm", q: "WAAR (où) exactement ?", opts: ["dans un lac", "dans un canal à Gand", "dans une rivière à Anvers", "dans la mer"], a: 1, exp: "in het koude water van een kanaal, in Gent." },
      { type: "input", q: "WANNEER (quand) : quel jour ? ___ (hier après-midi)", a: ["gisterenmiddag", "gisteren"], ph: "un mot", exp: "gisterenmiddag = hier après-midi." },
      { type: "qcm", q: "Comment l'homme a-t-il justifié son geste (le « pourquoi » de sa modestie) ?", opts: ["« Je voulais être célèbre »", "« Tout le monde ferait ça »", "« Le chien était à moi »", "« On m'a payé »"], a: 1, exp: "« Iedereen zou dit doen » = tout le monde ferait ça." }
    ],
    solution: `<p>Traduction du fait divers : « Un homme sauve un chien d'un canal froid. Hier après-midi, un incident particulier s'est produit à Gand. Vers deux heures, un passant a vu un chien dans l'eau froide d'un canal. L'animal était tombé à l'eau et ne pouvait plus en sortir. L'homme, un habitant de Gand de 34 ans, n'a pas hésité et a sauté aussitôt dans l'eau. Après quelques minutes, il a pu ramener le chien en sécurité sur la berge. Des badauds ont entre-temps appelé les pompiers. Le chien avait très froid, mais était par ailleurs indemne. Le propriétaire, qui n'avait un instant pas fait attention, était très reconnaissant. "Je serai éternellement reconnaissant envers ce héros", a-t-il dit. L'homme lui-même est resté modeste : "Tout le monde ferait ça." »</p>
<p>Retiens la méthode des <strong>5 W</strong> et le vocabulaire des faits divers (<strong>voorval, brandweer, ongedeerd, eigenaar, held</strong>), ainsi que les temps du passé qui structurent le récit.</p>`
  }
};
