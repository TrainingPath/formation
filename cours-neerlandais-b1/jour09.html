<script>
var DAY = {
  num: 9,
  title: "Verbes à particule : séparables ou non",
  subtitle: "Reconnaître et manier les verbes séparables (opstaan) et inséparables (begrijpen).",
  theory: `
<h3>1. Deux familles de verbes composés</h3>
<p>Beaucoup de verbes néerlandais sont formés d'une <strong>particule</strong> + un verbe : <strong>opstaan</strong> (se lever), <strong>aankomen</strong> (arriver), <strong>begrijpen</strong> (comprendre). Deux comportements existent : les <strong>séparables</strong> (scheidbaar) et les <strong>inséparables</strong> (onscheidbaar).</p>
<h3>2. Les verbes SÉPARABLES</h3>
<p>La particule (op-, aan-, mee-, uit-, af-, in-, terug-, weg-...) porte l'accent et se <strong>détache</strong> dans une phrase principale : elle part <strong>à la fin</strong>.</p>
<pre class="pseudo">opstaan   →  Ik sta om zeven uur op.       Je me lève à sept heures.
aankomen  →  De trein komt te laat aan.    Le train arrive en retard.
meegaan   →  Ga je vanavond mee?           Tu viens ce soir ?
opbellen  →  Ik bel je morgen op.          Je t'appelle demain.</pre>
<p>Au <strong>participe passé</strong>, le <strong>ge-</strong> se glisse entre la particule et le verbe : opstaan → <strong>opgestaan</strong> ; aankomen → <strong>aangekomen</strong>. Avec om ... te, le te se glisse au milieu : « om op te staan ».</p>
<h3>3. Les verbes INSÉPARABLES</h3>
<p>Certaines particules (be-, ver-, ont-, er-, ge-, her-, mis-) sont <strong>toniquement faibles</strong> : le verbe reste <strong>soudé</strong> et ne se sépare jamais. Au participe, il n'y a <strong>pas</strong> de ge-.</p>
<pre class="pseudo">begrijpen  →  Ik begrijp de vraag.        Je comprends la question.
vertellen  →  Hij vertelt een verhaal.    Il raconte une histoire.
ontmoeten  →  We ontmoeten elkaar morgen.  On se rencontre demain.
Participe : begrepen, verteld, ontmoet  (SANS ge-)</pre>
<div class="tip">Repère les préfixes inséparables : <strong>be-, ver-, ont-, ge-, her-, er-, mis-</strong>. Tout le reste (op-, aan-, mee-, uit-, af-, in-, terug-, door-, over-...) est en général séparable.</div>
<h3>4. Dans une subordonnée</h3>
<p>Dans une subordonnée (avec dat, omdat, die...), le verbe conjugué part à la fin et la particule se <strong>recolle</strong> devant lui :</p>
<pre class="pseudo">Principale :   Ik sta vroeg op.
Subordonnée :  ... omdat ik vroeg opsta.   (opsta ressoudé, à la fin)</pre>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Ik sta elke ochtend om zes uur op en ik bel meteen mijn collega op.
We bespreken de planning en daarna begin ik met mijn werk.
De trein komt vaak te laat aan, dus ik vertrek altijd op tijd.
Gisteren heb ik een oude vriend ontmoet en we hebben lang gepraat.
Ik begrijp nu beter waarom hij vorig jaar is weggegaan.</pre>
<p>Traduction : Je me lève chaque matin à six heures et j'appelle aussitôt mon collègue. Nous discutons du planning et ensuite je commence mon travail. Le train arrive souvent en retard, donc je pars toujours à l'heure. Hier, j'ai rencontré un vieil ami et nous avons parlé longtemps. Je comprends maintenant mieux pourquoi il est parti l'an dernier.</p>
<div class="warn">Ne sépare jamais un verbe inséparable : on dit « Ik begrijp het », jamais « Ik grijp het be ». Et n'ajoute pas de ge- au participe des inséparables : begrepen, verteld, ontmoet, betaald.</div>`,
  exercises: [
    { type: "qcm", q: "Le verbe « opstaan » est…", opts: ["inséparable", "séparable", "irrégulier seulement", "un modal"], a: 1, exp: "op- est une particule séparable accentuée." },
    { type: "input", q: "Complète : « Ik sta om zeven uur ___. » (opstaan, principale)", a: ["op"], ph: "particule", exp: "La particule op se détache et part à la fin." },
    { type: "qcm", q: "Le participe passé de « opstaan » est…", opts: ["geopstaan", "opgestaan", "opstaan", "opgestaat"], a: 1, exp: "ge- se glisse au milieu : op + ge + staan → opgestaan." },
    { type: "input", q: "Complète : « De trein komt te laat ___. » (aankomen)", a: ["aan"], ph: "particule", exp: "aan se détache et va à la fin : komt ... aan." },
    { type: "vf", q: "Le verbe « begrijpen » est inséparable.", a: true, exp: "be- est un préfixe inséparable : Ik begrijp." },
    { type: "qcm", q: "Quel est le participe passé de « vertellen » ?", opts: ["gevertellen", "verteld", "geverteld", "vertelde"], a: 1, exp: "Inséparable : pas de ge- → verteld." },
    { type: "input", q: "Complète : « Ik bel je morgen ___. » (opbellen)", a: ["op"], ph: "particule", exp: "op se détache : Ik bel je morgen op." },
    { type: "qcm", q: "Quel préfixe est toujours INSÉPARABLE ?", opts: ["op-", "ver-", "mee-", "uit-"], a: 1, exp: "ver- (comme be-, ont-, ge-) est inséparable." },
    { type: "vf", q: "Au participe passé, les verbes inséparables prennent aussi ge-.", a: false, exp: "Faux : begrepen, verteld, ontmoet — pas de ge-." },
    { type: "input", q: "Dans la subordonnée : « ... omdat ik vroeg ___. » (opstaan → ressoudé)", a: ["opsta"], ph: "verbe", exp: "En subordonnée, la particule se recolle : opsta, à la fin." },
    { type: "qcm", q: "Comment dire « Tu viens ce soir ? » (meegaan) ?", opts: ["Meega je vanavond?", "Ga je vanavond mee?", "Ga mee je vanavond?", "Je gaat mee vanavond?"], a: 1, exp: "Séparable : mee part à la fin → Ga je vanavond mee ?" },
    { type: "input", q: "Participe passé de « aankomen » : ___", a: ["aangekomen"], ph: "un mot", exp: "aan + ge + komen → aangekomen." },
    { type: "qcm", q: "Compréhension : « Ik sta om zes uur op en bel mijn collega op. » Que fait-il en se levant ?", opts: ["il déjeune", "il appelle son collègue", "il fait du sport", "il lit"], a: 1, exp: "bel ... op = appelle (opbellen)." },
    { type: "vf", q: "Compréhension : « Gisteren heb ik een oude vriend ontmoet. » Il a rencontré un vieil ami hier.", a: true, exp: "ontmoet = rencontré (inséparable, sans ge-)." },
    { type: "qcm", q: "Compréhension : « Ik begrijp nu beter waarom hij is weggegaan. » Que comprend-il mieux ?", opts: ["comment il est venu", "pourquoi il est parti", "quand il revient", "où il habite"], a: 1, exp: "waarom hij is weggegaan = pourquoi il est parti." }
  ],
  final: {
    title: "Exercice final — Een drukke ochtend",
    intro: `<p>Lis ce récit d'une matinée puis réponds :</p>
<pre class="pseudo">Vanmorgen stond ik veel te laat op.
Ik belde snel mijn baas op om te zeggen dat ik later zou aankomen.
De bus vertrok net toen ik bij de halte aankwam.
Onderweg ontmoette ik een collega die hetzelfde probleem had.
We legden samen uit waarom we te laat waren, en gelukkig begreep de baas het.
's Avonds nam ik me voor om voortaan vroeger op te staan.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Vanmorgen stond ik veel te laat ___. » (opstaan, prétérit)", a: ["op"], ph: "particule", exp: "stond ... op : la particule se détache." },
      { type: "qcm", q: "Pourquoi appelle-t-il son patron ?", opts: ["pour démissionner", "pour dire qu'il arriverait plus tard", "pour demander un congé", "pour se plaindre"], a: 1, exp: "om te zeggen dat ik later zou aankomen." },
      { type: "vf", q: "Il a rencontré un collègue qui avait le même problème.", a: true, exp: "ontmoette ik een collega die hetzelfde probleem had." },
      { type: "input", q: "Complète : « ... om voortaan vroeger op te ___. » (staan)", a: ["staan"], ph: "verbe", exp: "om op te staan : te se glisse entre op et staan." },
      { type: "qcm", q: "Le patron a-t-il compris ?", opts: ["non, il s'est fâché", "oui, heureusement", "il n'était pas là", "il a licencié le narrateur"], a: 1, exp: "gelukkig begreep de baas het." }
    ],
    solution: `<p>Traduction : « Ce matin, je me suis levé beaucoup trop tard. J'ai vite appelé mon patron pour dire que j'arriverais plus tard. Le bus venait juste de partir quand je suis arrivé à l'arrêt. En chemin, j'ai rencontré un collègue qui avait le même problème. Nous avons expliqué ensemble pourquoi nous étions en retard, et heureusement le patron a compris. Le soir, je me suis promis de me lever désormais plus tôt. »</p>
<p>Observe les séparables (stond ... op, belde ... op, aankwam, op te staan) et les inséparables sans ge- (ontmoette, begreep, uitlegden garde ge : uitgelegd est séparable — attention, uitleggen est séparable !).</p>`
  }
};
</script>
