<script>
var DAY = {
  num: 10,
  title: "Pronoms relatifs avec préposition (waarmee...)",
  subtitle: "Dire « avec quoi, à quoi, dont » pour des choses : waar + préposition.",
  theory: `
<h3>1. Le problème : une préposition + une chose</h3>
<p>Au jour 1, tu as vu die/dat. Mais quand la relative contient une <strong>préposition</strong> renvoyant à une <strong>chose</strong> (le stylo <em>avec lequel</em> j'écris), le néerlandais ne dit pas « met dat ». Il fusionne <strong>waar</strong> + la préposition en un seul mot :</p>
<pre class="pseudo">met  →  waarmee     avec quoi / avec lequel
over →  waarover    à propos de quoi / dont
op   →  waarop      sur quoi / sur lequel
in   →  waarin      dans lequel
aan  →  waaraan     à quoi / auquel
voor →  waarvoor    pour quoi / pour lequel
naar →  waarnaar    vers quoi</pre>
<p><strong>De pen waarmee ik schrijf, is blauw.</strong> = Le stylo avec lequel j'écris est bleu. · <strong>Het huis waarin wij wonen, is groot.</strong> = La maison dans laquelle nous habitons est grande.</p>
<h3>2. La forme séparée (fréquente à l'oral)</h3>
<p>Très souvent, on <strong>sépare</strong> waar et la préposition : waar reste devant, la préposition va <strong>à la fin</strong>, juste avant le verbe :</p>
<pre class="pseudo">De stoel waarop ik zit ...
= De stoel waar ik op zit ...       (forme séparée)
Le siège sur lequel je suis assis...
Het boek waarover we praten ...
= Het boek waar we over praten ...</pre>
<div class="tip">Les deux formes sont correctes. À l'oral, la version séparée (waar ... op) est la plus courante. À l'écrit soigné, on rencontre souvent la forme soudée (waarop).</div>
<h3>3. Pour les personnes : préposition + wie</h3>
<p>Attention : waarmee, waarover... servent pour les <strong>choses</strong>. Pour les <strong>personnes</strong>, on utilise <strong>préposition + wie</strong> :</p>
<pre class="pseudo">De man met wie ik praat ...        L'homme avec qui je parle...
De vrouw voor wie ik werk ...      La femme pour qui je travaille...
De vrienden op wie ik wacht ...    Les amis que j'attends (sur qui...)</pre>
<h3>4. « waar » aussi pour « où »</h3>
<p>Pour un lieu, <strong>waar</strong> seul signifie « où » : <strong>de stad waar ik woon</strong> (la ville où j'habite). Ne le confonds pas avec waar + préposition.</p>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Dit is de computer waarmee ik elke dag werk.
Het project waaraan we werken, is bijna klaar.
De collega met wie ik samenwerk, is heel behulpzaam.
De vergadering waarover ik je vertelde, is verplaatst.
Ik zoek nog het document waarin alle cijfers staan.</pre>
<p>Traduction : Voici l'ordinateur avec lequel je travaille chaque jour. Le projet auquel nous travaillons est presque terminé. Le collègue avec qui je collabore est très serviable. La réunion dont je t'ai parlé a été déplacée. Je cherche encore le document dans lequel figurent tous les chiffres.</p>
<div class="warn">Ne dis jamais « met dat » ou « op dat » pour une chose : fusionne en <strong>waarmee, waarop</strong>... Et réserve <strong>préposition + wie</strong> aux personnes, jamais waarmee pour une personne.</div>`,
  exercises: [
    { type: "qcm", q: "Comment traduire « avec lequel » (pour une chose) ?", opts: ["met dat", "waarmee", "met wie", "waarin"], a: 1, exp: "met → waarmee pour une chose." },
    { type: "input", q: "Complète : « De pen ___ ik schrijf, is blauw. » (avec laquelle)", a: ["waarmee"], ph: "un mot", exp: "met + chose → waarmee." },
    { type: "qcm", q: "« dans lequel » se dit…", opts: ["waarop", "waarin", "waarover", "waaraan"], a: 1, exp: "in → waarin." },
    { type: "input", q: "Complète (forme séparée) : « De stoel waar ik ___ zit. » (préposition op)", a: ["op"], ph: "préposition", exp: "waarop peut se séparer : waar ik op zit." },
    { type: "vf", q: "Pour une personne, on utilise préposition + wie, pas waarmee.", a: true, exp: "De man met wie ik praat (personne) ; De pen waarmee ik schrijf (chose)." },
    { type: "qcm", q: "« L'homme avec qui je parle » se dit…", opts: ["De man waarmee ik praat", "De man met wie ik praat", "De man waarover ik praat", "De man die met ik praat"], a: 1, exp: "Personne + préposition → met wie." },
    { type: "input", q: "Complète : « Het project ___ we werken, is klaar. » (auquel : aan)", a: ["waaraan"], ph: "un mot", exp: "aan + chose → waaraan." },
    { type: "qcm", q: "Dans la forme séparée, où va la préposition ?", opts: ["au début", "collée à waar", "à la fin, avant le verbe", "après le verbe"], a: 2, exp: "waar ... op zit : la préposition se place juste avant le verbe." },
    { type: "vf", q: "« waar » seul peut aussi signifier « où » pour un lieu.", a: true, exp: "de stad waar ik woon = la ville où j'habite." },
    { type: "input", q: "Complète : « De vergadering ___ ik je vertelde. » (dont : over)", a: ["waarover"], ph: "un mot", exp: "over + chose → waarover (dont)." },
    { type: "qcm", q: "« La femme pour qui je travaille » se dit…", opts: ["De vrouw waarvoor ik werk", "De vrouw voor wie ik werk", "De vrouw voor die ik werk", "De vrouw wie voor ik werk"], a: 1, exp: "Personne → voor wie." },
    { type: "input", q: "Fusionne : « Het huis ___ wij wonen, is groot. » (in → dans lequel)", a: ["waarin"], ph: "un mot", exp: "in + chose → waarin." },
    { type: "qcm", q: "Compréhension : « Dit is de computer waarmee ik elke dag werk. » À quoi sert l'ordinateur ?", opts: ["à jouer", "à travailler chaque jour", "à dormir", "à voyager"], a: 1, exp: "waarmee ik elke dag werk = avec lequel je travaille chaque jour." },
    { type: "vf", q: "Compréhension : « De collega met wie ik samenwerk, is behulpzaam. » On parle d'une personne.", a: true, exp: "met wie = pour une personne (le collègue)." },
    { type: "qcm", q: "Compréhension : « Ik zoek het document waarin alle cijfers staan. » Que contient le document ?", opts: ["des photos", "tous les chiffres", "des noms", "des adresses"], a: 1, exp: "waarin alle cijfers staan = dans lequel figurent tous les chiffres." }
  ],
  final: {
    title: "Exercice final — Mijn nieuwe werkplek",
    intro: `<p>Lis ce texte puis réponds :</p>
<pre class="pseudo">Ik heb een nieuwe baan en ik ben er heel blij mee.
Dit is het kantoor waarin ik nu werk; het is licht en modern.
De computer waarmee ik werk, is veel sneller dan mijn oude.
Mijn baas, met wie ik dagelijks overleg, is heel vriendelijk.
Het project waaraan ons team werkt, is belangrijk voor het bedrijf.
De vergaderzaal waarin we samenkomen, heeft een prachtig uitzicht.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Dit is het kantoor ___ ik nu werk. » (dans lequel : in)", a: ["waarin"], ph: "un mot", exp: "in + chose → waarin." },
      { type: "qcm", q: "Comment est le nouvel ordinateur ?", opts: ["plus lent", "beaucoup plus rapide", "cassé", "identique à l'ancien"], a: 1, exp: "veel sneller dan mijn oude." },
      { type: "input", q: "Complète : « Mijn baas, ___ wie ik dagelijks overleg. » (préposition met)", a: ["met"], ph: "préposition", exp: "Personne → met wie." },
      { type: "qcm", q: "Le projet sur lequel l'équipe travaille est…", opts: ["sans importance", "important pour l'entreprise", "terminé", "annulé"], a: 1, exp: "belangrijk voor het bedrijf." },
      { type: "vf", q: "La salle de réunion a une belle vue.", a: true, exp: "De vergaderzaal ... heeft een prachtig uitzicht." }
    ],
    solution: `<p>Traduction : « J'ai un nouveau travail et j'en suis très content. Voici le bureau dans lequel je travaille maintenant ; il est lumineux et moderne. L'ordinateur avec lequel je travaille est beaucoup plus rapide que mon ancien. Mon patron, avec qui je me concerte chaque jour, est très gentil. Le projet auquel notre équipe travaille est important pour l'entreprise. La salle de réunion dans laquelle nous nous réunissons a une vue magnifique. »</p>
<p>Retiens : <strong>waar + préposition</strong> (waarin, waarmee, waaraan) pour les choses, <strong>préposition + wie</strong> (met wie) pour les personnes.</p>`
  }
};
</script>

<script>

  items: [
  { id: "nl-b1-j10", title: "Décris ton environnement avec waar + préposition", level: 3,
    statement: "Écris 5 à 6 phrases décrivant des objets et des personnes de ton quotidien en utilisant au moins trois formes waar + préposition (waarmee, waarin, waarover, waaraan...) et une fois préposition + wie.",
    hints: [
      "Pour les choses : waarmee, waarin, waarop, waaraan, waarover.",
      "Pour les personnes : met wie, voor wie, op wie.",
      "Tu peux séparer : « de stoel waar ik op zit »."
    ],
    solution: "Dit is de fiets waarmee ik elke dag naar het werk ga. De tas waarin ik mijn laptop bewaar, is heel stevig. Het onderwerp waarover ik graag praat, is reizen. Mijn beste vriend, met wie ik alles deel, woont in Antwerpen. Het boek waaraan ik nu werk, is bijna af. De kamer waarin ik studeer, is rustig en licht.\n\nTraduction : Voici le vélo avec lequel je vais au travail chaque jour. Le sac dans lequel je range mon ordinateur portable est très solide. Le sujet dont j'aime parler, c'est les voyages. Mon meilleur ami, avec qui je partage tout, habite à Anvers. Le livre auquel je travaille maintenant est presque fini. La pièce dans laquelle j'étudie est calme et lumineuse.",

};
</script>
