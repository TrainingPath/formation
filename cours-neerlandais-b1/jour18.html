  title: "Rédiger un e-mail formel",
  subtitle: "Structure, formules d'appel et de politesse d'un courrier professionnel.",
  theory: `
<h3>1. La structure d'un e-mail formel</h3>
<p>Un e-mail formel néerlandais (een formele e-mail) suit un ordre précis : l'appel (aanhef), l'introduction, le corps, la conclusion et la formule de politesse (afsluiting). On vouvoie systématiquement avec <strong>u</strong>.</p>
<pre class="pseudo">Onderwerp: ...        Objet : ...
Geachte heer / mevrouw,   Madame, Monsieur,
[introduction]
[corps du message]
[conclusion]
Met vriendelijke groet,   Cordialement,
[Voornaam Achternaam]     [Prénom Nom]</pre>
<h3>2. L'appel — de aanhef</h3>
<pre class="pseudo">Geachte heer Jansen,        Monsieur Jansen, (nom connu, homme)
Geachte mevrouw De Vries,   Madame De Vries, (nom connu, femme)
Geachte heer/mevrouw,       Madame, Monsieur, (nom inconnu)
Beste meneer Jansen,        Cher Monsieur Jansen, (semi-formel)</pre>
<div class="tip">« Geachte » est plus formel que « Beste ». Utilise <strong>Geachte</strong> pour une candidature ou une administration, et <strong>Beste</strong> pour un collègue que tu connais un peu. Après l'appel, une virgule, puis on saute une ligne.</div>
<h3>3. Phrases utiles — nuttige zinnen</h3>
<pre class="pseudo">Ik schrijf u naar aanleiding van ...   Je vous écris au sujet de ...
Hierbij wil ik ...                     Par la présente je souhaite ...
Ik zou graag ... willen ...            Je voudrais ...
Zou u zo vriendelijk willen zijn om ...? Auriez-vous l'amabilité de ... ?
Ik kijk uit naar uw antwoord.          Dans l'attente de votre réponse.
Alvast bedankt voor uw reactie.        Merci d'avance pour votre réponse.</pre>
<h3>4. La formule de politesse finale — de afsluiting</h3>
<pre class="pseudo">Met vriendelijke groet,     Cordialement, (standard, très courant)
Hoogachtend,                Veuillez agréer... (très formel)
Met hartelijke groet,       Bien cordialement, (un peu plus chaleureux)</pre>
<div class="warn">Ne confonds pas <strong>u</strong> (vous, formel) et <strong>jij/je</strong> (tu). Dans un e-mail formel, tout est au vouvoiement : « uw naam » (votre nom), « Kunt u ... ? » (Pouvez-vous ... ?). Emploie aussi le possessif <strong>uw</strong> et jamais « jouw ».</div>`,

    { type: "qcm", q: "« Met vriendelijke groet » correspond à…", opts: ["Bonjour", "Cordialement", "Merci beaucoup", "À bientôt"], a: 1, exp: "Formule de politesse finale standard." },
    { type: "vf", q: "Dans un e-mail formel, on tutoie avec « jij ».", a: false, exp: "Non : on vouvoie avec « u » (et le possessif « uw »)." },
    { type: "input", q: "Complète : « Ik kijk uit naar uw ___. » (réponse/answer)", a: ["antwoord"], ph: "un mot", exp: "uw antwoord = votre réponse ; ik kijk uit naar = dans l'attente de." },
    { type: "qcm", q: "« Geachte heer/mevrouw, » s'emploie quand…", opts: ["on connaît bien la personne", "on ne connaît pas le nom du destinataire", "on écrit à un ami", "on écrit à un enfant"], a: 1, exp: "Formule quand le nom est inconnu." },
    { type: "input", q: "Traduis le possessif formel « votre nom » : ___ naam", a: ["uw"], ph: "un mot", exp: "uw = votre (formel) ; jouw = ton (informel)." },
    { type: "qcm", q: "« Alvast bedankt voor uw reactie » signifie…", opts: ["Merci d'avance pour votre réponse", "Excusez le retard", "Bonne journée", "Je vous appelle demain"], a: 0, exp: "alvast bedankt = merci d'avance ; reactie = réponse." },
    { type: "qcm", q: "Quelle formule est la PLUS formelle ?", opts: ["Groetjes,", "Hoogachtend,", "Doei,", "Beste,"], a: 1, exp: "Hoogachtend = formule la plus solennelle." },
    { type: "vf", q: "« Geachte » est plus formel que « Beste ».", a: true, exp: "Geachte = très formel ; Beste = semi-formel." },

  ],

    intro: `<p>Lis cet e-mail formel, puis réponds :</p>
<pre class="pseudo">Onderwerp: Vraag over de cursus Nederlands

Geachte mevrouw Peeters,

Ik schrijf u naar aanleiding van uw advertentie over de cursus Nederlands.
Ik ben erg geïnteresseerd en zou graag meer informatie willen ontvangen.
Kunt u mij vertellen wanneer de lessen beginnen en hoeveel de cursus kost?
Zou u zo vriendelijk willen zijn om mij ook het lesrooster te sturen?

Met vriendelijke groet,
Sofie Maes</pre>`,

      { type: "input", q: "Comment commence l'appel formel ? « ___ mevrouw Peeters, »", a: ["geachte"], ph: "un mot", exp: "Geachte mevrouw + nom = appel formel." },

      { type: "input", q: "Que demande-t-elle poliment qu'on lui envoie ? het ___ (planning des cours)", a: ["lesrooster"], ph: "un mot", exp: "het lesrooster = l'emploi du temps / planning." },
      { type: "qcm", q: "Par quelle formule termine-t-elle ?", opts: ["Doei,", "Hoogachtend,", "Met vriendelijke groet,", "Groetjes,"], a: 2, exp: "Met vriendelijke groet = formule finale standard." }
    ],
    solution: `<p>Traduction : « Objet : Question sur le cours de néerlandais. Madame Peeters, je vous écris au sujet de votre annonce concernant le cours de néerlandais. Je suis très intéressée et voudrais recevoir plus d'informations. Pouvez-vous me dire quand les cours commencent et combien coûte le cours ? Auriez-vous l'amabilité de m'envoyer aussi l'emploi du temps ? Merci d'avance pour votre réponse. Dans l'attente de votre réponse. Cordialement, Sofie Maes. »</p>
<p>Repère la structure complète : objet, appel formel (<strong>Geachte</strong>), introduction (<strong>naar aanleiding van</strong>), demande polie (<strong>Zou u zo vriendelijk willen zijn om ...?</strong>), remerciement et formule finale (<strong>Met vriendelijke groet</strong>). Tout est au vouvoiement avec <strong>u</strong> et <strong>uw</strong>.</p>`
  }
