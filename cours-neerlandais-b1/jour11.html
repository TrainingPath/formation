<script>
var DAY = {
  num: 11,
  title: "Les modaux : nuances de déduction",
  subtitle: "Exprimer la certitude, la probabilité et le doute avec moeten, kunnen, zullen.",
  theory: `
<h3>1. Les modaux ne servent pas qu'à l'obligation</h3>
<p>Tu connais déjà <strong>moeten</strong> (devoir), <strong>kunnen</strong> (pouvoir), <strong>mogen</strong> (avoir le droit), <strong>willen</strong> (vouloir), <strong>zullen</strong> (auxiliaire du futur). Au niveau B1, ils servent aussi à exprimer une <strong>déduction</strong> : à quel point on est sûr de ce qu'on avance.</p>
<h3>2. moeten = forte probabilité (« ce doit être »)</h3>
<p><strong>moeten</strong> exprime une déduction quasi certaine, comme « ça doit être » en français :</p>
<pre class="pseudo">Hij moet ziek zijn, want hij is niet op het werk.
Il doit être malade, car il n'est pas au travail.
Dat moet een vergissing zijn.
Ce doit être une erreur.</pre>
<h3>3. kunnen = possibilité (« il se peut »)</h3>
<p><strong>kunnen</strong> exprime ce qui est possible mais non certain :</p>
<pre class="pseudo">Het kan waar zijn, maar ik weet het niet zeker.
Ça peut être vrai, mais je n'en suis pas sûr.
Ze kan nog komen; de avond is nog jong.
Elle peut encore venir ; la soirée est jeune.</pre>
<div class="tip">Pour renforcer le doute, on ajoute souvent <strong>misschien</strong> (peut-être) : « Hij komt misschien later » (Il vient peut-être plus tard). Et <strong>zou kunnen</strong> = « pourrait bien » (encore plus prudent).</div>
<h3>4. zullen / zal = probabilité prévue ; moeten = obligation vs déduction</h3>
<p><strong>zullen</strong> sert au futur mais aussi à une supposition probable : <strong>Hij zal wel moe zijn.</strong> (Il doit bien être fatigué / il est sans doute fatigué). Le petit mot <strong>wel</strong> renforce cette supposition.</p>
<pre class="pseudo">Certitude déduite :  Hij moet thuis zijn.     Il doit être chez lui.
Supposition :        Hij zal wel thuis zijn.  Il est sans doute chez lui.
Possibilité :        Hij kan thuis zijn.      Il se peut qu'il soit chez lui.
Doute :              Hij is misschien thuis.  Il est peut-être chez lui.</pre>
<h3>5. Échelle de certitude</h3>
<pre class="pseudo">zeker (sûr)  >  moeten / zullen wel  >  waarschijnlijk  >  kunnen / misschien  >  onmogelijk (impossible)</pre>
<p>Le contraire d'une déduction positive s'exprime avec <strong>kan niet</strong> (ne peut pas) : <strong>Dat kan niet waar zijn.</strong> = Ce n'est pas possible (ça ne peut pas être vrai).</p>
<h3>6. Petit texte de compréhension</h3>
<pre class="pseudo">Waar is Lisa? Ze moet ergens in het gebouw zijn, want haar jas hangt hier.
Ze kan in de vergaderzaal zitten, maar ik weet het niet zeker.
Ze zal wel koffie halen; dat doet ze elke ochtend.
Dat kan niet waar zijn, ze is toch met vakantie!
Misschien heeft iemand zich vergist.</pre>
<p>Traduction : Où est Lisa ? Elle doit être quelque part dans le bâtiment, car son manteau est ici. Elle est peut-être dans la salle de réunion, mais je n'en suis pas sûr. Elle est sans doute allée chercher du café ; c'est ce qu'elle fait chaque matin. Ce n'est pas possible, elle est en vacances ! Peut-être que quelqu'un s'est trompé.</p>
<div class="warn">Distingue bien <strong>moeten</strong> = obligation (« Ik moet werken » = je dois travailler) de <strong>moeten</strong> = déduction (« Hij moet ziek zijn » = il doit être malade). C'est le contexte qui tranche. L'infinitif reste toujours à la fin, sans te.</div>`,
  exercises: [
    { type: "qcm", q: "Quel modal exprime une déduction quasi certaine (« ce doit être ») ?", opts: ["kunnen", "moeten", "mogen", "willen"], a: 1, exp: "moeten = forte probabilité déduite." },
    { type: "input", q: "Complète : « Hij ___ ziek zijn, want hij is er niet. » (déduction forte)", a: ["moet"], ph: "modal", exp: "moet zijn = doit être (déduction)." },
    { type: "qcm", q: "Quel modal exprime la simple possibilité ?", opts: ["moeten", "kunnen", "zullen", "mogen"], a: 1, exp: "kunnen = il se peut, possibilité." },
    { type: "input", q: "Complète : « Het ___ waar zijn, maar ik weet het niet zeker. » (possibilité)", a: ["kan"], ph: "modal", exp: "kan zijn = ça peut être." },
    { type: "vf", q: "« misschien » ajoute une nuance de doute.", a: true, exp: "misschien = peut-être ; renforce l'incertitude." },
    { type: "qcm", q: "« Hij zal wel moe zijn » signifie…", opts: ["Il doit travailler", "Il est sans doute fatigué", "Il veut se reposer", "Il n'est pas fatigué"], a: 1, exp: "zullen wel = supposition probable." },
    { type: "input", q: "Complète : « Dat ___ niet waar zijn! » (impossibilité : ne peut pas)", a: ["kan"], ph: "modal", exp: "Dat kan niet waar zijn = ce n'est pas possible." },
    { type: "qcm", q: "Quel petit mot renforce une supposition avec zullen ?", opts: ["niet", "wel", "te", "om"], a: 1, exp: "Hij zal wel thuis zijn : wel renforce la supposition." },
    { type: "vf", q: "« Ik moet werken » et « Hij moet ziek zijn » utilisent moeten dans le même sens.", a: false, exp: "Faux : le premier = obligation, le second = déduction. Le sens dépend du contexte." },
    { type: "input", q: "Complète : « Hij ___ thuis zijn. » (supposition probable avec wel) : Hij ___ wel thuis zijn.", a: ["zal"], ph: "modal", exp: "zal wel = est sans doute." },
    { type: "qcm", q: "Classe du plus sûr au moins sûr :", opts: ["misschien > moeten > zeker", "zeker > moeten > kunnen/misschien", "kunnen > zeker > moeten", "misschien > zeker > kunnen"], a: 1, exp: "zeker (sûr) > moeten/zullen wel > kunnen/misschien." },
    { type: "input", q: "Complète : « Ze ___ in de vergaderzaal zitten, maar ik weet het niet zeker. » (possibilité)", a: ["kan"], ph: "modal", exp: "kan = possibilité incertaine." },
    { type: "qcm", q: "Compréhension : « Ze moet ergens in het gebouw zijn, want haar jas hangt hier. » Quel est le degré de certitude ?", opts: ["impossible", "forte probabilité", "aucune idée", "simple possibilité"], a: 1, exp: "moeten + preuve (le manteau) = forte déduction." },
    { type: "vf", q: "Compréhension : « Ze zal wel koffie halen; dat doet ze elke ochtend. » C'est une supposition fondée sur une habitude.", a: true, exp: "zal wel + habitude quotidienne = supposition probable." },
    { type: "qcm", q: "Compréhension : « Dat kan niet waar zijn, ze is met vakantie! » Le locuteur exprime…", opts: ["une certitude", "une impossibilité / incrédulité", "une obligation", "un souhait"], a: 1, exp: "kan niet waar zijn = ce n'est pas possible (incrédulité)." }
  ],
  final: {
    title: "Exercice final — Waar is de sleutel?",
    intro: `<p>Lis ce dialogue de déduction puis réponds :</p>
<pre class="pseudo">Ik kan mijn sleutel niet vinden. Hij moet ergens in huis zijn.
Hij kan in mijn jaszak zitten, maar die heb ik al gecontroleerd.
Misschien ligt hij nog in de auto.
Mijn zoon zegt: hij zal wel op de keukentafel liggen, daar leg je hem altijd.
Dat kan niet, want ik heb daar al gekeken!
Uiteindelijk zat de sleutel gewoon in mijn andere broek.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Hij ___ ergens in huis zijn. » (déduction forte)", a: ["moet"], ph: "modal", exp: "moet zijn = doit être (forte probabilité)." },
      { type: "qcm", q: "Pourquoi la poche du manteau est-elle exclue ?", opts: ["elle est trop petite", "il l'a déjà vérifiée", "il n'a pas de manteau", "la clé y est trop grande"], a: 1, exp: "maar die heb ik al gecontroleerd." },
      { type: "input", q: "Complète : « Hij ___ wel op de keukentafel liggen. » (supposition probable)", a: ["zal"], ph: "modal", exp: "zal wel = est sans doute." },
      { type: "vf", q: "Le père rejette l'idée de la table de cuisine parce qu'il y a déjà regardé.", a: true, exp: "Dat kan niet, want ik heb daar al gekeken." },
      { type: "qcm", q: "Où était finalement la clé ?", opts: ["dans la voiture", "sur la table", "dans son autre pantalon", "dans son manteau"], a: 2, exp: "de sleutel zat in mijn andere broek." }
    ],
    solution: `<p>Traduction : « Je ne trouve pas ma clé. Elle doit être quelque part dans la maison. Elle peut être dans la poche de mon manteau, mais je l'ai déjà vérifiée. Peut-être qu'elle est encore dans la voiture. Mon fils dit : elle est sans doute sur la table de la cuisine, tu la poses toujours là. Ce n'est pas possible, car j'y ai déjà regardé ! Finalement, la clé était tout simplement dans mon autre pantalon. »</p>
<p>Retiens l'échelle : <strong>moeten</strong> (forte déduction) &gt; <strong>zullen wel</strong> (supposition) &gt; <strong>kunnen / misschien</strong> (possibilité) &gt; <strong>kan niet</strong> (impossibilité).</p>`
  }
};
</script>
