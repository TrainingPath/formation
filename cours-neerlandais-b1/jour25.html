  title: "L'ordre des mots avancé",
  subtitle: "Placer correctement le temps, la manière et le lieu, et le verbe à la fin.",
  theory: `
<h3>1. Le rappel de base : le verbe en 2e position</h3>
<p>Dans une phrase principale, le verbe conjugué est <strong>toujours en deuxième position</strong>. Ce qui précède peut être le sujet, mais aussi un complément de temps, de lieu, etc. Si ce n'est pas le sujet, il y a <strong>inversion</strong>.</p>
<pre class="pseudo">Ik ga morgen naar de stad.      Je vais demain en ville.
Morgen ga ik naar de stad.      Demain je vais en ville. (inversion)</pre>
<h3>2. L'ordre TMP : Temps – Manière – Place (Tijd – Manier – Plaats)</h3>
<p>Quand plusieurs compléments se suivent au milieu de la phrase, l'ordre habituel est <strong>Temps, puis Manière, puis Lieu</strong> :</p>
<pre class="pseudo">Ik ga    morgen    met de trein    naar Brussel.
         (temps)   (manière)       (lieu)
         Je vais demain en train à Bruxelles.</pre>
<div class="tip">Retiens le sigle <strong>TMP</strong> : Tijd (quand ?), Manier (comment ?), Plaats (où ?). C'est l'inverse du français, qui met souvent le lieu avant le temps. « Ik werk elke dag hard op kantoor » = Je travaille dur au bureau chaque jour.</p></div>
<h3>3. La place du verbe à la fin</h3>
<p>Les infinitifs et participes rejetés vont à la fin. Dans une subordonnée, le verbe conjugué aussi. On peut avoir plusieurs verbes empilés à la fin :</p>
<pre class="pseudo">Ik heb gisteren een film gezien.         participe à la fin
Ik wil volgend jaar Nederlands leren.    infinitif à la fin
..., omdat ik morgen vroeg moet werken.  subordonnée : moet werken à la fin</pre>
<h3>4. La place de « niet »</h3>
<p><strong>niet</strong> se place en général à la fin, mais AVANT un adjectif, un complément de lieu fixe ou un verbe rejeté :</p>
<pre class="pseudo">Ik ken hem niet.                Je ne le connais pas.
Het is niet mooi.               Ce n'est pas beau. (avant l'adjectif)
Ik ga vandaag niet naar school. Je ne vais pas à l'école aujourd'hui.
Ik heb de film niet gezien.     Je n'ai pas vu le film. (avant le participe)</pre>
<div class="warn">Piège classique : ne mets pas le lieu avant le temps. On dit « Ik ga <strong>morgen naar Gent</strong> » (temps puis lieu), et non « Ik ga naar Gent morgen ». Et n'oublie jamais de renvoyer l'infinitif ou le participe à la toute fin.</p></div>`,
  exercises: [

    { type: "input", q: "Complète l'inversion : « Morgen ___ ik naar de stad. » (aller → je vais)", a: ["ga"], ph: "un verbe", exp: "Après « morgen » en tête, inversion : ga ik." },
    { type: "qcm", q: "Que signifie le sigle TMP pour l'ordre des compléments ?", opts: ["Temps-Manière-Place", "Total-Moyen-Prix", "Temps-Mois-Personne", "Titre-Manière-Preuve"], a: 0, exp: "Tijd (temps), Manier (manière), Plaats (lieu)." },
    { type: "qcm", q: "Quel ordre est correct ?", opts: ["Ik ga naar Brussel morgen met de trein", "Ik ga morgen met de trein naar Brussel", "Ik ga met de trein naar Brussel morgen", "Ik ga naar Brussel met de trein morgen"], a: 1, exp: "Temps (morgen) - Manière (met de trein) - Lieu (naar Brussel)." },
    { type: "input", q: "Place le participe : « Ik heb gisteren een film ___. » (voir → vu)", a: ["gezien"], ph: "un participe", exp: "Le participe « gezien » va à la fin." },

    { type: "qcm", q: "Où va l'infinitif dans « Ik wil volgend jaar Nederlands ___ » ?", opts: ["leren, à la fin", "leren, en 2e position", "avant Nederlands", "au début"], a: 0, exp: "L'infinitif « leren » est rejeté à la fin." },
    { type: "input", q: "Complète : « Ik ken hem ___. » (ne ... pas → négation à la fin)", a: ["niet"], ph: "un mot", exp: "niet à la fin quand il porte sur le verbe/COD défini." },
    { type: "qcm", q: "Où se place « niet » dans « Het is ___ mooi » ?", opts: ["après mooi", "avant l'adjectif mooi", "au début", "après het"], a: 1, exp: "niet se place avant l'adjectif : niet mooi." },
    { type: "vf", q: "Dans une subordonnée, le verbe conjugué va à la fin.", a: true, exp: "..., omdat ik moet werken : verbe à la fin." },
    { type: "input", q: "Remets l'ordre TMP : « Ik werk ___ hard op kantoor. » (temps : chaque jour)", a: ["elke dag"], ph: "temps", exp: "Le temps (elke dag) vient avant la manière (hard) et le lieu (op kantoor)." },
    { type: "qcm", q: "Où va « niet » dans « Ik heb de film ___ gezien » ?", opts: ["après gezien", "avant le participe gezien", "au début", "après ik"], a: 1, exp: "niet se place avant le participe rejeté : niet gezien." },
    { type: "qcm", q: "Compréhension : quelle phrase est correcte pour « Demain je travaille dur au bureau » ?", opts: ["Morgen werk ik hard op kantoor", "Morgen ik werk op kantoor hard", "Op kantoor morgen ik werk hard", "Ik morgen werk hard op kantoor"], a: 0, exp: "Inversion (morgen werk ik) + ordre manière/lieu." },
    { type: "vf", q: "Compréhension : « Ik ga vandaag niet naar school » signifie « Je ne vais pas à l'école aujourd'hui ».", a: true, exp: "niet placé avant le complément de lieu (naar school)." },
    { type: "qcm", q: "Compréhension : dans « ..., omdat ik morgen vroeg moet werken », où sont les verbes ?", opts: ["au début de la subordonnée", "moet werken empilés à la fin", "avant « ik »", "séparés"], a: 1, exp: "En subordonnée, moet + werken vont ensemble à la fin." }
  ],

2. Ik heb dat boek nog niet gelezen.                (niet avant le participe)
3. Zij zegt dat ze morgen niet kan komen.           (subordonnée : verbes à la fin)
4. 's Ochtends drink ik altijd rustig een kopje koffie thuis.</pre>`,
    questions: [
      { type: "qcm", q: "Phrase 1 : quel est l'ordre des compléments ?", opts: ["lieu - temps - manière", "temps - manière - lieu", "manière - temps - lieu", "lieu - manière - temps"], a: 1, exp: "Volgende week (temps) - met de auto (manière) - naar mijn oma (lieu)." },
      { type: "input", q: "Phrase 2 : où est placé « niet » ? Avant le ___ (participe « gelezen »)", a: ["participe", "gelezen"], ph: "un mot", exp: "niet se place avant le participe rejeté gelezen." },
      { type: "qcm", q: "Phrase 3 : pourquoi « kan komen » est-il à la fin ?", opts: ["erreur", "c'est une subordonnée (dat ...) : verbes à la fin", "parce que morgen l'exige", "par hasard"], a: 1, exp: "Après « dat », les verbes vont à la fin de la subordonnée." },
      { type: "input", q: "Phrase 4 : quel mot ouvre la phrase et provoque l'inversion « drink ik » ? ___", a: ["'s ochtends", "s ochtends", "'s ochtends"], ph: "un complément de temps", exp: "Le complément de temps en tête entraîne l'inversion." },
      { type: "qcm", q: "Dans la phrase 4, où se trouve le lieu « thuis » ?", opts: ["au début", "juste après le verbe", "à la fin, après le temps et la manière", "avant le sujet"], a: 2, exp: "Ordre TMP : le lieu (thuis) vient en dernier." }
    ],
    solution: `<p>Traductions : 1. « La semaine prochaine je vais en voiture chez ma grand-mère. » 2. « Je n'ai pas encore lu ce livre. » 3. « Elle dit qu'elle ne peut pas venir demain. » 4. « Le matin je bois toujours tranquillement une tasse de café à la maison. »</p>
<p>Retiens les trois piliers : (1) verbe conjugué en 2e position, avec inversion si un autre élément ouvre la phrase ; (2) ordre <strong>TMP</strong> des compléments (temps, manière, lieu) ; (3) infinitifs, participes et verbes de subordonnée rejetés <strong>à la fin</strong>. Et <strong>niet</strong> se place avant l'adjectif, le lieu fixe ou le verbe rejeté.</p>`
  }
};
