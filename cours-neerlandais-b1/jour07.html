  subtitle: "Exprimer le but : « pour faire quelque chose » avec om ... te.",
  theory: `
<h3>1. Exprimer le but</h3>
<p>Pour dire « pour faire quelque chose » (le but, l'intention), le néerlandais utilise la construction <strong>om ... te + infinitif</strong>. C'est l'équivalent du « afin de / pour » français :</p>
<pre class="pseudo">Ik ga naar de winkel om brood te kopen.
Je vais au magasin pour acheter du pain.
Hij belt om een afspraak te maken.
Il appelle pour prendre rendez-vous.</pre>
<p>Structure : <strong>om</strong> + (compléments) + <strong>te</strong> + <strong>infinitif</strong>, le tout rejeté à la fin de la phrase.</p>
<h3>2. La place de « te »</h3>
<p><strong>te</strong> se place juste <strong>devant l'infinitif</strong>. Tous les compléments (objet, lieu, etc.) viennent entre <strong>om</strong> et <strong>te</strong> :</p>
<pre class="pseudo">om  [ brood ]           te  kopen       pour acheter du pain
om  [ een brief ]       te  schrijven   pour écrire une lettre
om  [ op tijd ]         te  komen       pour arriver à l'heure</pre>
<h3>3. Verbes séparables : te s'insère</h3>
<p>Avec un verbe à particule séparable (opbellen, meegaan, aankomen...), le <strong>te</strong> se glisse <strong>entre la particule et le verbe</strong> :</p>
<pre class="pseudo">opbellen   →  om iemand op te bellen     pour appeler quelqu'un
meegaan    →  om mee te gaan             pour venir aussi
aankomen   →  om op tijd aan te komen    pour arriver à l'heure</pre>
<h3>4. Quand « om » est-il obligatoire ?</h3>
<p>Avec un but clair (« pour »), <strong>om</strong> est nécessaire. Mais après certains verbes/adjectifs, on peut avoir <strong>te + infinitif</strong> sans om (voir le jour 8). Après <strong>te</strong> exprimant le but, om est la règle sûre à ce niveau.</p>
<pre class="pseudo">Het is belangrijk om goed te slapen.   Il est important de bien dormir.
Ik heb geen tijd om te koken.          Je n'ai pas le temps de cuisiner.
Ze heeft besloten om te stoppen.       Elle a décidé d'arrêter.</pre>
<div class="tip">Astuce : si tu peux dire « afin de » en français, utilise « om ... te ». « Ik leer Nederlands om in België te werken » (J'apprends le néerlandais afin de travailler en Belgique).</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Ik sta elke dag vroeg op om te sporten.
Daarna ga ik naar mijn werk om geld te verdienen.
Ik gebruik de trein om files te vermijden.
's Avonds bel ik mijn ouders op om even te praten.
In het weekend reis ik graag om nieuwe steden te ontdekken.</pre>
<p>Traduction : Je me lève tôt chaque jour pour faire du sport. Ensuite, je vais au travail pour gagner de l'argent. J'utilise le train pour éviter les embouteillages. Le soir, j'appelle mes parents pour discuter un peu. Le week-end, j'aime voyager pour découvrir de nouvelles villes.</p>
<div class="warn">N'oublie pas le <strong>te</strong> juste avant l'infinitif : on dit « om brood <strong>te</strong> kopen », jamais « om brood kopen ». Et avec un verbe séparable, te va au milieu : « om op <strong>te</strong> bellen ».</div>`,
  exercises: [

    { type: "vf", q: "Dans « om op tijd te komen », les compléments (op tijd) se placent entre om et te.", a: true, exp: "om [op tijd] te komen : les compléments sont au milieu." },

    { type: "input", q: "Complète : « Ik leer Nederlands om in België te ___. » (werken)", a: ["werken"], ph: "verbe", exp: "om in België te werken = afin de travailler en Belgique." },
    { type: "qcm", q: "Compréhension : « Ik sta vroeg op om te sporten. » Pourquoi se lève-t-il tôt ?", opts: ["pour manger", "pour faire du sport", "pour dormir", "pour lire"], a: 1, exp: "om te sporten = pour faire du sport." },
    { type: "vf", q: "Compréhension : « Ik gebruik de trein om files te vermijden. » Il prend le train pour éviter les embouteillages.", a: true, exp: "om files te vermijden = pour éviter les bouchons." },
    { type: "qcm", q: "Compréhension : « In het weekend reis ik om nieuwe steden te ontdekken. » Pourquoi voyage-t-il le week-end ?", opts: ["pour travailler", "pour découvrir de nouvelles villes", "pour se reposer", "pour faire des courses"], a: 1, exp: "om nieuwe steden te ontdekken = pour découvrir de nouvelles villes." }
  ],

<pre class="pseudo">Ik leer Nederlands om betere kansen op de arbeidsmarkt te krijgen.
Elke avond maak ik oefeningen om de grammatica te begrijpen.

      { type: "input", q: "Complète : « Ik maak oefeningen om de grammatica te ___. » (begrijpen)", a: ["begrijpen"], ph: "verbe", exp: "om ... te begrijpen = pour comprendre." },

      { type: "vf", q: "Il va parfois au café pour parler avec des locuteurs natifs.", a: true, exp: "om met moedertaalsprekers te praten." },
      { type: "input", q: "Complète : « Mijn doel is om over een jaar vloeiend te ___. » (zijn)", a: ["zijn"], ph: "verbe", exp: "om vloeiend te zijn = être fluide/courant." }
    ],
    solution: `<p>Traduction : « J'apprends le néerlandais pour obtenir de meilleures chances sur le marché du travail. Chaque soir, je fais des exercices pour comprendre la grammaire. Je regarde des films flamands pour améliorer ma compréhension orale. Parfois, je vais dans un café pour parler avec des locuteurs natifs. J'utilise aussi une application pour apprendre de nouveaux mots chaque jour. Mon objectif est d'être courant dans un an. »</p>
<p>À chaque but : <strong>om</strong> + compléments + <strong>te</strong> + <strong>infinitif</strong> (te krijgen, te begrijpen, te verbeteren, te praten, te leren, te zijn).</p>`
  }
