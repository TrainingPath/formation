<script>
var DAY = {
  num: 16,
  title: "Les médias et la technologie",
  subtitle: "Parler des médias, d'internet et des appareils du quotidien.",
  theory: `
<h3>1. Les médias — de media</h3>
<p>Le mot néerlandais <strong>de media</strong> couvre la presse, la radio, la télévision et internet. Voici le vocabulaire de base :</p>
<pre class="pseudo">de krant          le journal        het nieuws        les informations
het tijdschrift   le magazine       de reclame        la publicité
de zender         la chaîne         het programma     l'émission
de nieuwslezer    le présentateur   het artikel       l'article
de journalist     le journaliste    de kop            le titre (gros titre)</pre>
<p><strong>Ik lees elke ochtend de krant.</strong> = Je lis le journal chaque matin. · <strong>Het nieuws begint om acht uur.</strong> = Le journal télévisé commence à huit heures.</p>
<h3>2. Internet et les réseaux — het internet en de sociale media</h3>
<pre class="pseudo">de website        le site           het wachtwoord    le mot de passe
inloggen          se connecter      uitloggen         se déconnecter
downloaden        télécharger       uploaden          téléverser
de link           le lien           het bericht       le message
delen             partager          liken             aimer (liker)
de app            l'application     de gebruiker      l'utilisateur</pre>
<p><strong>Ik deel dit artikel op sociale media.</strong> = Je partage cet article sur les réseaux sociaux. · <strong>Vergeet je wachtwoord niet.</strong> = N'oublie pas ton mot de passe.</p>
<h3>3. Les appareils — de apparaten</h3>
<pre class="pseudo">de computer       l'ordinateur      de laptop         l'ordinateur portable
de smartphone     le smartphone     het scherm        l'écran
het toetsenbord   le clavier        de muis           la souris
opladen           recharger         de oplader        le chargeur
de batterij       la batterie       aanzetten/uitzetten allumer/éteindre</pre>
<div class="tip">Beaucoup de verbes du numérique sont empruntés à l'anglais et se conjuguent comme des verbes réguliers néerlandais : <strong>downloaden → ik download, ik heb gedownload</strong> · <strong>liken → ik like, ik heb geliket</strong>.</div>
<h3>4. Exprimer un usage et une fréquence</h3>
<p>Pour dire à quoi sert un appareil, on emploie souvent <strong>gebruiken</strong> (utiliser) et <strong>om ... te</strong> (pour + infinitif, vu au jour 7) :</p>
<pre class="pseudo">Ik gebruik mijn laptop om te werken.   J'utilise mon portable pour travailler.
Zij kijkt elke avond naar het nieuws.  Elle regarde le journal chaque soir.
Wij lezen het nieuws online.           Nous lisons les infos en ligne.</pre>
<div class="warn">Attention au verbe séparable <strong>aanzetten</strong> (allumer) : la particule part à la fin. <strong>Ik zet de computer aan.</strong> = J'allume l'ordinateur, et non « Ik aanzet de computer ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le journal » (papier) ?", opts: ["het nieuws", "de krant", "de zender", "de reclame"], a: 1, exp: "de krant = le journal ; het nieuws = les informations." },
    { type: "input", q: "Complète : « Ik lees elke ochtend de ___. » (le journal)", a: ["krant"], ph: "un mot", exp: "de krant = le journal." },
    { type: "qcm", q: "« het wachtwoord » signifie…", opts: ["le message", "le mot de passe", "le lien", "l'écran"], a: 1, exp: "het wachtwoord = le mot de passe." },
    { type: "qcm", q: "Pour « se connecter », on dit…", opts: ["uitloggen", "inloggen", "downloaden", "delen"], a: 1, exp: "inloggen = se connecter ; uitloggen = se déconnecter." },
    { type: "input", q: "Traduis « partager » : ___", a: ["delen"], ph: "un verbe", exp: "delen = partager." },
    { type: "vf", q: "« de zender » veut dire « la chaîne (de télévision) ».", a: true, exp: "de zender = la chaîne." },
    { type: "qcm", q: "Que veut dire « het scherm » ?", opts: ["le clavier", "l'écran", "la souris", "le chargeur"], a: 1, exp: "het scherm = l'écran." },
    { type: "input", q: "Complète le verbe séparable : « Ik zet de computer ___. » (allumer)", a: ["aan"], ph: "une particule", exp: "aanzetten → ik zet ... aan." },
    { type: "qcm", q: "« Ik gebruik mijn laptop om te werken » signifie…", opts: ["Je répare mon portable", "J'utilise mon portable pour travailler", "J'achète un portable", "Je vends mon portable"], a: 1, exp: "gebruiken om te = utiliser pour ; werken = travailler." },
    { type: "vf", q: "« de oplader » veut dire « le chargeur ».", a: true, exp: "opladen = recharger ; de oplader = le chargeur." },
    { type: "input", q: "Traduis « télécharger » : ___", a: ["downloaden"], ph: "un verbe", exp: "downloaden = télécharger ; uploaden = téléverser." },
    { type: "qcm", q: "« de gebruiker » désigne…", opts: ["l'écran", "l'utilisateur", "le journaliste", "la publicité"], a: 1, exp: "de gebruiker = l'utilisateur (van gebruiken)." },
    { type: "qcm", q: "Compréhension : « Ik lees het nieuws niet in de krant, maar online. » Où lit la personne les infos ?", opts: ["dans le journal papier", "en ligne", "à la radio", "à la télé"], a: 1, exp: "niet in de krant, maar online = pas dans le journal, mais en ligne." },
    { type: "vf", q: "Compréhension : « Mijn batterij is leeg, ik moet mijn telefoon opladen. » La personne doit recharger son téléphone.", a: true, exp: "batterij leeg = batterie vide → opladen = recharger." },
    { type: "qcm", q: "Compréhension : « Zij deelt het artikel op sociale media en veel mensen liken het. » Que font beaucoup de gens ?", opts: ["ils partagent l'article", "ils aiment (likent) l'article", "ils écrivent l'article", "ils suppriment l'article"], a: 1, exp: "veel mensen liken het = beaucoup de gens l'aiment." }
  ],
  final: {
    title: "Exercice final — Media in mijn leven",
    intro: `<p>Lis ce texte, puis réponds :</p>
<pre class="pseudo">Hoi, ik ben Daan. 's Ochtends lees ik het nieuws op mijn smartphone.
Ik koop bijna nooit een papieren krant meer, want alles staat online.
Op mijn laptop werk ik en 's avonds kijk ik naar een programma of een film.
Ik gebruik sociale media om foto's met vrienden te delen.
Soms deel ik ook een interessant artikel. Mijn wachtwoord verander ik elke maand,
want veiligheid is belangrijk. Voor het slapengaan zet ik mijn telefoon uit.</pre>`,
    questions: [
      { type: "qcm", q: "Où Daan lit-il les infos le matin ?", opts: ["dans le journal papier", "sur son smartphone", "à la radio", "à la télé"], a: 1, exp: "'s ochtends lees ik het nieuws op mijn smartphone." },
      { type: "qcm", q: "Pourquoi n'achète-t-il presque plus de journal papier ?", opts: ["c'est trop cher", "tout est en ligne", "il n'aime pas lire", "il n'a pas le temps"], a: 1, exp: "want alles staat online = car tout est en ligne." },
      { type: "input", q: "À quoi utilise-t-il les réseaux sociaux ? om foto's te ___", a: ["delen"], ph: "un verbe", exp: "om foto's met vrienden te delen = pour partager des photos." },
      { type: "qcm", q: "À quelle fréquence change-t-il son mot de passe ?", opts: ["chaque jour", "chaque semaine", "chaque mois", "jamais"], a: 2, exp: "mijn wachtwoord verander ik elke maand = chaque mois." },
      { type: "input", q: "Que fait-il avant de dormir ? Il ___ son téléphone (éteint, particule)", a: ["uit"], ph: "une particule", exp: "zet ik mijn telefoon uit = j'éteins mon téléphone (uitzetten)." }
    ],
    solution: `<p>Traduction : « Salut, je suis Daan. Le matin je lis les infos sur mon smartphone. Je n'achète presque plus jamais de journal papier, car tout est en ligne. Sur mon portable je travaille et le soir je regarde une émission ou un film. J'utilise les réseaux sociaux pour partager des photos avec des amis. Parfois je partage aussi un article intéressant. Je change mon mot de passe chaque mois, car la sécurité est importante. Avant de dormir j'éteins mon téléphone. »</p>
<p>Retiens les verbes du numérique (<strong>delen, liken, opladen</strong>) et les verbes séparables <strong>aanzetten / uitzetten</strong> dont la particule part à la fin de la phrase.</p>`
  }
};
</script>

    hints: [
      "Emploie « ik gebruik ... om te ... » pour expliquer un usage.",

    ],
    solution: "Ik ben erg met de media bezig. 's Ochtends lees ik het nieuws online op mijn smartphone, want een papieren krant koop ik bijna nooit. Overdag gebruik ik mijn laptop om te werken en om e-mails te schrijven. 's Avonds kijk ik naar een programma of ik luister naar muziek. Op sociale media deel ik foto's en soms like ik een interessant artikel. Als mijn batterij leeg is, laad ik mijn telefoon op. Voor het slapengaan zet ik alle schermen uit.\n\nTraduction : Je suis très connecté aux médias. Le matin je lis les infos en ligne sur mon smartphone, car je n'achète presque jamais de journal papier. La journée j'utilise mon portable pour travailler et pour écrire des e-mails. Le soir je regarde une émission ou j'écoute de la musique. Sur les réseaux sociaux je partage des photos et parfois je like un article intéressant. Quand ma batterie est vide, je recharge mon téléphone. Avant de dormir j'éteins tous les écrans.",
    note: "Varie le vocabulaire des appareils et des actions numériques, et surveille la place de la particule dans les verbes séparables (opladen, uitzetten)." }

};
