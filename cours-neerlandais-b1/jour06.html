<script>
var DAY = {
  num: 6,
  title: "Le conditionnel irréel (zou)",
  subtitle: "Exprimer l'hypothèse, le souhait et la politesse avec zou + infinitif.",
  theory: `
<h3>1. Le rôle de « zou »</h3>
<p><strong>zou</strong> (pluriel <strong>zouden</strong>) est le prétérit de <strong>zullen</strong>. Combiné à un <strong>infinitif</strong>, il forme le <strong>conditionnel</strong>, l'équivalent du « je ferais, il viendrait » français. Il exprime l'hypothèse, le souhait poli ou l'irréel.</p>
<pre class="pseudo">ik zou            wij zouden        + infinitif à la fin
jij zou           jullie zouden
hij/zij zou       zij zouden</pre>
<p><strong>Ik zou graag naar Italië reizen.</strong> = J'aimerais voyager en Italie. · <strong>Dat zou fantastisch zijn.</strong> = Ce serait fantastique.</p>
<h3>2. L'hypothèse irréelle : als + prétérit, ... zou + infinitif</h3>
<p>Pour dire « Si j'avais... je ferais... » (situation imaginaire, contraire à la réalité), on emploie <strong>als</strong> + prétérit dans la condition, et <strong>zou(den)</strong> + infinitif dans la conséquence :</p>
<pre class="pseudo">Als ik rijk was, zou ik een groot huis kopen.
Si j'étais riche, j'achèterais une grande maison.
Als het niet regende, zouden we gaan wandelen.
S'il ne pleuvait pas, nous irions nous promener.</pre>
<div class="tip">Ordre à retenir : après la subordonnée en « Als ... », la principale commence par le verbe (zou), car la subordonnée occupe la première place : « Als ik tijd had, <strong>zou</strong> ik je helpen. »</div>
<h3>3. La politesse : zou graag / zou willen / zou kunnen</h3>
<p>zou adoucit une demande ou un souhait, comme le conditionnel de politesse français :</p>
<pre class="pseudo">Ik zou graag een koffie willen.     Je voudrais un café.
Zou u mij kunnen helpen?            Pourriez-vous m'aider ?
Zou je het raam kunnen sluiten?     Pourrais-tu fermer la fenêtre ?</pre>
<h3>4. Le conseil : zou moeten</h3>
<p><strong>zou moeten</strong> = « devrait » (conseil atténué) :</p>
<pre class="pseudo">Je zou meer moeten slapen.          Tu devrais dormir davantage.
Hij zou een dokter moeten bellen.   Il devrait appeler un médecin.</pre>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Als ik meer tijd had, zou ik een nieuwe taal leren.
Ik zou graag naar Japan reizen, maar het is nu te duur.
Mijn vriend zegt dat ik meer zou moeten sparen.
Als we samen zouden gaan, zou de reis goedkoper zijn.
Dat zou echt een droom zijn.</pre>
<p>Traduction : Si j'avais plus de temps, j'apprendrais une nouvelle langue. J'aimerais voyager au Japon, mais c'est trop cher maintenant. Mon ami dit que je devrais économiser davantage. Si nous partions ensemble, le voyage serait moins cher. Ce serait vraiment un rêve.</p>
<div class="warn">Dans la condition irréelle, on met le verbe au <strong>prétérit</strong> (Als ik rijk <strong>was</strong>, Als ik tijd <strong>had</strong>), et zou(den) + infinitif seulement dans la conséquence. Évite « Als ik zou rijk zijn » : la condition n'utilise pas zou.</div>`,
  exercises: [
    { type: "qcm", q: "De quel verbe « zou » est-il le prétérit ?", opts: ["zullen", "zijn", "zeggen", "zoeken"], a: 0, exp: "zou / zouden = prétérit de zullen." },
    { type: "input", q: "Complète : « Ik ___ graag naar Italië reizen. » (conditionnel, je)", a: ["zou"], ph: "un mot", exp: "ik zou + infinitif = j'aimerais / je voudrais." },
    { type: "qcm", q: "Comment dire « nous » au conditionnel ?", opts: ["wij zou", "wij zouden", "wij zullen", "wij zal"], a: 1, exp: "Pluriel : wij/jullie/zij zouden." },
    { type: "input", q: "Complète la condition irréelle : « Als ik rijk ___, zou ik een huis kopen. » (zijn, prétérit)", a: ["was"], ph: "verbe", exp: "als + prétérit : Als ik rijk was." },
    { type: "vf", q: "Dans une condition irréelle, on utilise « zou » aussi bien dans la condition que dans la conséquence.", a: false, exp: "Faux : la condition (als...) est au prétérit ; seule la conséquence utilise zou + infinitif." },
    { type: "qcm", q: "« Si j'étais riche, j'achèterais une maison » se dit…", opts: ["Als ik zou rijk zijn, ik koop een huis", "Als ik rijk was, zou ik een huis kopen", "Als ik rijk ben, zou ik een huis kopen", "Als ik rijk was, ik zou kopen een huis"], a: 1, exp: "als + prétérit (was), puis zou + infinitif (kopen) à la fin." },
    { type: "input", q: "Politesse : « ___ u mij kunnen helpen? » (conditionnel de u)", a: ["zou"], ph: "un mot", exp: "Zou u mij kunnen helpen? = Pourriez-vous m'aider ?" },
    { type: "qcm", q: "« Je zou meer moeten slapen » signifie…", opts: ["Tu dois dormir", "Tu devrais dormir davantage", "Tu as trop dormi", "Tu vas dormir"], a: 1, exp: "zou moeten = devrait (conseil atténué)." },
    { type: "vf", q: "« zou moeten » sert à donner un conseil.", a: true, exp: "zou moeten = devrait ; conseil poli." },
    { type: "input", q: "Complète : « Dat zou fantastisch ___. » (zijn)", a: ["zijn"], ph: "verbe", exp: "L'infinitif zijn est rejeté à la fin : Dat zou fantastisch zijn." },
    { type: "qcm", q: "Après « Als ik tijd had, ___ », comment commence la principale ?", opts: ["ik zou je helpen", "zou ik je helpen", "je zou ik helpen", "helpen zou ik je"], a: 1, exp: "La subordonnée occupe la 1re place → la principale commence par le verbe : zou ik je helpen." },
    { type: "input", q: "Complète : « Zou je het raam kunnen ___? » (sluiten)", a: ["sluiten"], ph: "verbe", exp: "L'infinitif sluiten est à la fin : Pourrais-tu fermer la fenêtre ?" },
    { type: "qcm", q: "Compréhension : « Als ik meer tijd had, zou ik een nieuwe taal leren. » Apprend-il une langue maintenant ?", opts: ["oui, actuellement", "non, c'est hypothétique", "il l'a déjà apprise", "il l'enseigne"], a: 1, exp: "C'est une hypothèse irréelle : il n'a pas le temps, donc il ne le fait pas." },
    { type: "vf", q: "Compréhension : « Mijn vriend zegt dat ik meer zou moeten sparen. » L'ami conseille d'économiser davantage.", a: true, exp: "zou moeten sparen = devrait économiser." },
    { type: "qcm", q: "Compréhension : « Als we samen zouden gaan, zou de reis goedkoper zijn. » Voyager ensemble rendrait le voyage…", opts: ["plus cher", "moins cher", "plus long", "impossible"], a: 1, exp: "goedkoper = moins cher." }
  ],
  final: {
    title: "Exercice final — Als ik de loterij won...",
    intro: `<p>Lis ce texte au conditionnel puis réponds :</p>
<pre class="pseudo">Als ik de loterij won, zou mijn leven helemaal veranderen.
Ik zou eerst een mooi huis aan zee kopen.
Daarna zou ik met mijn familie een wereldreis maken.
Ik zou ook een deel van het geld aan goede doelen geven.
Mijn moeder zegt dat ik voorzichtig zou moeten zijn met zoveel geld.
Maar eerlijk gezegd zou ik gewoon heel gelukkig zijn.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Als ik de loterij ___, zou mijn leven veranderen. » (winnen, prétérit)", a: ["won"], ph: "verbe", exp: "als + prétérit : Als ik de loterij won." },
      { type: "qcm", q: "Qu'achèterait-il d'abord ?", opts: ["une voiture", "une belle maison au bord de la mer", "un bateau", "une entreprise"], a: 1, exp: "een mooi huis aan zee kopen." },
      { type: "input", q: "Complète : « Ik zou een wereldreis ___. » (maken)", a: ["maken"], ph: "verbe", exp: "L'infinitif maken est rejeté à la fin." },
      { type: "vf", q: "Sa mère conseille d'être prudent avec autant d'argent.", a: true, exp: "dat ik voorzichtig zou moeten zijn met zoveel geld." },
      { type: "qcm", q: "Au fond, comment se sentirait-il ?", opts: ["inquiet", "très heureux", "fatigué", "seul"], a: 1, exp: "ik zou gewoon heel gelukkig zijn." }
    ],
    solution: `<p>Traduction : « Si je gagnais à la loterie, ma vie changerait complètement. J'achèterais d'abord une belle maison au bord de la mer. Ensuite, je ferais un tour du monde avec ma famille. Je donnerais aussi une partie de l'argent à des œuvres caritatives. Ma mère dit que je devrais être prudent avec autant d'argent. Mais honnêtement, je serais tout simplement très heureux. »</p>
<p>Schéma-clé : <strong>Als + prétérit</strong> pour la condition irréelle, <strong>zou(den) + infinitif</strong> pour la conséquence, et <strong>zou moeten</strong> pour le conseil.</p>`
  }
};
</script>
