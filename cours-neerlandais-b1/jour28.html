var DAY = {

  title: "Révisions B1",
  subtitle: "Faire le point sur la grammaire et le vocabulaire du niveau B1.",
  theory: `
<h3>1. Les subordonnées : le verbe à la fin</h3>
<p>Après un subordonnant (dat, omdat, hoewel, terwijl, zodat, als, toen...), le verbe conjugué part <strong>à la fin</strong>.</p>
<pre class="pseudo">Ik denk dat het morgen regent.       Je pense qu'il pleuvra demain.
Hoewel het duur is, koop ik het.     Bien que ce soit cher, je l'achète.</pre>
<h3>2. Le passé : parfait et imparfait</h3>
<pre class="pseudo">Parfait :  heb/ben + participe    Ik heb gewerkt. Ik ben gegaan.
Imparfait: -de/-te ou irrégulier  Ik werkte. Ik ging. Het was mooi.
Plus-que-parfait: had/was + part.  Ik had het al gezien.</pre>
<h3>3. Le passif et le conditionnel</h3>
<pre class="pseudo">Passif :      worden + participe    Het huis wordt verkocht. (est vendu)
Conditionnel: zou + infinitif       Ik zou graag reizen. (j'aimerais voyager)</pre>
<h3>4. Les connecteurs et l'ordre des mots</h3>
<pre class="pseudo">Cause :       omdat (verbe fin) / want (ordre normal)
But :         om ... te + inf. / zodat + phrase
Conséquence : dus / daarom (+ inversion)
Ordre TMP :   Tijd - Manier - Plaats (temps - manière - lieu)</pre>
<div class="tip">Pour progresser vers le B1, vérifie systématiquement trois choses dans tes phrases : (1) le verbe est-il à la bonne place ? (2) le temps du passé est-il correct ? (3) le registre (u/je) est-il adapté ? Ces trois réflexes évitent la majorité des erreurs.</p></div>
<h3>5. Vocabulaire clé du niveau</h3>
<pre class="pseudo">de sollicitatie   la candidature    het gesprek       l'entretien
de ervaring       l'expérience      de opleiding      la formation
het milieu        l'environnement   het onderzoek     l'étude
de mening         l'opinion         de oorzaak        la cause
het gevolg        la conséquence    de werknemer      l'employé</pre>
<div class="warn">Fautes fréquentes à surveiller : oublier le verbe à la fin des subordonnées ; confondre <strong>omdat</strong> (cause) et <strong>zodat</strong> (but/conséquence) ; placer le lieu avant le temps ; mélanger <strong>u</strong> et <strong>je</strong> dans un même message.</p></div>`,

    { type: "input", q: "Passif : « Het huis ___ verkocht. » (worden → est vendu)", a: ["wordt"], ph: "un verbe", exp: "Passif présent : wordt + participe." },
    { type: "qcm", q: "« Ik zou graag reizen » exprime…", opts: ["une obligation", "un souhait / conditionnel", "un passé", "un ordre"], a: 1, exp: "zou + infinitif = conditionnel (j'aimerais)." },
    { type: "qcm", q: "Quel connecteur exprime le BUT (même sujet) ?", opts: ["omdat", "want", "om ... te", "dus"], a: 2, exp: "om ... te + infinitif = pour + infinitif." },
    { type: "input", q: "Complète (cause, ordre normal) : « Ik blijf thuis, ___ ik ben ziek. » (car)", a: ["want"], ph: "un mot", exp: "want = car (ordre normal)." },
    { type: "vf", q: "Après « omdat », le verbe conjugué va à la fin de la subordonnée.", a: true, exp: "omdat est subordonnant : verbe à la fin." },
    { type: "qcm", q: "Ordre correct (TMP) ?", opts: ["Ik ga naar huis morgen met de bus", "Ik ga morgen met de bus naar huis", "Ik ga met de bus morgen naar huis", "Ik ga naar huis met de bus morgen"], a: 1, exp: "Temps - Manière - Lieu : morgen, met de bus, naar huis." },
    { type: "input", q: "Plus-que-parfait : « Ik ___ het al gezien. » (avoir → j'avais)", a: ["had"], ph: "un verbe", exp: "had + participe = plus-que-parfait." },
    { type: "qcm", q: "Quel pronom pour un e-mail formel ?", opts: ["jij", "je", "u", "jou"], a: 2, exp: "Formel : u (et uw)." },
    { type: "input", q: "Traduis « la candidature » : de ___", a: ["sollicitatie"], ph: "un mot", exp: "de sollicitatie = la candidature." },

    { type: "vf", q: "Compréhension : « Het rapport wordt morgen geschreven » est une phrase au passif.", a: true, exp: "worden + participe (geschreven) = passif." },
    { type: "qcm", q: "Compréhension : « Ik leer Nederlands zodat ik in Gent kan werken. » Quel rapport exprime « zodat » ?", opts: ["cause", "but", "concession", "temps"], a: 1, exp: "zodat = pour que (but/conséquence voulue)." }
  ],
  final: {
    title: "Exercice final — Bilan grammatical",
    intro: `<p>Lis ce texte qui mobilise tout le niveau B1, puis réponds :</p>
<pre class="pseudo">Vorige maand heb ik gesolliciteerd voor een baan in Amsterdam.
Hoewel ik zenuwachtig was, ging het gesprek goed. De werkgever vroeg
waarom ik het bedrijf interessant vond. Ik antwoordde dat het werk
me veel ervaring zou geven. Ze zeiden dat ik binnenkort een antwoord krijg.
Ik hoop dat ik word aangenomen, want deze kans is belangrijk voor mij.
Daarom heb ik me heel goed voorbereid.</pre>`,
    questions: [

      { type: "input", q: "Complète la concession : « ___ ik zenuwachtig was, ging het goed. » (bien que)", a: ["hoewel"], ph: "un mot", exp: "hoewel = bien que (concession)." },
      { type: "qcm", q: "« ...dat het werk me veel ervaring zou geven » : que marque « zou » ?", opts: ["un passé", "un conditionnel (donnerait)", "un passif", "un ordre"], a: 1, exp: "zou + infinitif = conditionnel." },
      { type: "input", q: "Relève la forme passive (worden + participe) : « Ik hoop dat ik word ___. » (accepté/embauché)", a: ["aangenomen"], ph: "un participe", exp: "word aangenomen = suis embauché (passif)." },
      { type: "qcm", q: "Pourquoi la personne s'est-elle bien préparée (« Daarom ... ») ?", opts: ["par obligation", "parce que cette chance est importante (conséquence de « want deze kans is belangrijk »)", "par ennui", "sans raison"], a: 1, exp: "want deze kans is belangrijk → daarom heb ik me voorbereid." }
    ],
    solution: `<p>Traduction : « Le mois dernier, j'ai posé ma candidature pour un emploi à Amsterdam. Bien que j'étais nerveux, l'entretien s'est bien passé. L'employeur a demandé pourquoi je trouvais l'entreprise intéressante. J'ai répondu que le travail me donnerait beaucoup d'expérience. Ils ont dit que je recevrais bientôt une réponse. J'espère que je serai embauché, car cette chance est importante pour moi. C'est pourquoi je me suis très bien préparé. »</p>
<p>Ce texte mobilise tout le B1 : le <strong>parfait</strong> (heb gesolliciteerd), la <strong>concession</strong> (hoewel + verbe à la fin), le <strong>discours indirect</strong> (dat ... zou geven), le <strong>passif</strong> (word aangenomen), la <strong>cause</strong> (want) et la <strong>conséquence</strong> (daarom + inversion). Relire ainsi un texte en repérant chaque structure est la meilleure révision.</p>`
  }
