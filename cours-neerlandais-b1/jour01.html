<script>
var DAY = {
  num: 1,
  title: "Les subordonnées relatives (die, dat)",
  subtitle: "Relier deux idées avec « qui » et « que » : choisir entre die et dat.",
  theory: `
<h3>1. À quoi sert une relative ?</h3>
<p>Une subordonnée relative ajoute une information sur un nom. En français : « l'homme <strong>qui</strong> travaille ici », « le livre <strong>que</strong> je lis ». En néerlandais, on utilise surtout deux mots : <strong>die</strong> et <strong>dat</strong>. Le choix ne dépend pas de « qui » ou « que » comme en français, mais du <strong>genre</strong> et du <strong>nombre</strong> du nom auquel on renvoie (l'antécédent).</p>
<h3>2. La règle du genre : die ou dat ?</h3>
<p>On regarde l'article du nom antécédent :</p>
<pre class="pseudo">de-woord (masc./fém., singulier)   →  die     de man die daar staat
het-woord (neutre, singulier)      →  dat     het boek dat ik lees
TOUS les pluriels (de ...)         →  die     de kinderen die spelen</pre>
<p><strong>De man die daar staat, is mijn buurman.</strong> = L'homme qui se tient là est mon voisin. · <strong>Het huis dat we kopen, is oud.</strong> = La maison (het huis) que nous achetons est vieille.</p>
<div class="tip">Astuce mémoire : le pronom relatif « copie » l'article. Un mot en <strong>de</strong> prend <strong>die</strong> ; un mot en <strong>het</strong> prend <strong>dat</strong>. Tous les pluriels sont des « de-woorden », donc toujours <strong>die</strong>.</div>
<h3>3. La place du verbe : rejeté à la fin</h3>
<p>Point capital du néerlandais B1 : dans une subordonnée, le verbe conjugué part <strong>à la fin</strong> de la proposition. Comparez :</p>
<pre class="pseudo">Principale :   De vrouw werkt hier.        (verbe en 2e position)
Relative :     de vrouw die hier werkt     (verbe rejeté à la fin)</pre>
<p><strong>Ik ken de jongen die naast mij woont.</strong> = Je connais le garçon qui habite à côté de moi. (woont à la fin). · <strong>Dit is de film die ik gisteren heb gezien.</strong> = C'est le film que j'ai vu hier. (heb gezien à la fin).</p>
<h3>4. La virgule</h3>
<p>Quand la relative complète une phrase déjà entière, on met en général une <strong>virgule</strong> avant elle, surtout si elle est longue ou explicative. Après la subordonnée, si la phrase principale continue, le verbe de la principale suit juste après la virgule.</p>
<pre class="pseudo">De man, die in Gent woont, is leraar.
L'homme, qui habite à Gand, est professeur.
(is = verbe de la principale, juste après la relative)</pre>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Ik heb een vriend die in Amsterdam woont.
Hij heeft een auto die heel oud is.
Het appartement dat hij huurt, is klein maar gezellig.
De buren die naast hem wonen, zijn heel aardig.</pre>
<p>Traduction : J'ai un ami qui habite à Amsterdam. Il a une voiture qui est très vieille. L'appartement qu'il loue est petit mais agréable. Les voisins qui habitent à côté de lui sont très gentils.</p>
<div class="warn">Ne traduisez jamais « qui / que » mot à mot. En néerlandais, seul l'article de l'antécédent décide : <strong>de</strong> → die, <strong>het</strong> → dat. Et n'oubliez pas de rejeter le verbe à la fin de la relative.</div>`,
  exercises: [
    { type: "qcm", q: "Quel pronom relatif pour « de man ___ daar staat » ?", opts: ["dat", "die", "wat", "wie"], a: 1, exp: "de man est un de-woord singulier → die." },
    { type: "qcm", q: "Quel pronom relatif pour « het boek ___ ik lees » ?", opts: ["die", "dat", "wie", "welke"], a: 1, exp: "het boek est un het-woord → dat." },
    { type: "input", q: "Complète : « De kinderen ___ buiten spelen, zijn moe. » (pluriel)", a: ["die"], ph: "die/dat", exp: "Tous les pluriels sont des de-woorden → die." },
    { type: "input", q: "Complète : « Het huis ___ we kopen, is oud. »", a: ["dat"], ph: "die/dat", exp: "het huis → dat." },
    { type: "vf", q: "Dans une subordonnée relative, le verbe conjugué se place à la fin.", a: true, exp: "Règle essentielle : rejet du verbe en fin de subordonnée." },
    { type: "qcm", q: "Où se place le verbe dans « de vrouw die hier ___ » (werken) ?", opts: ["die werkt hier", "werkt à la 2e place", "à la fin : hier werkt", "on ne conjugue pas"], a: 2, exp: "de vrouw die hier werkt : le verbe est rejeté à la fin." },
    { type: "input", q: "Traduis « qui » dans « de fiets die kapot is » : ___ (le pronom relatif)", a: ["die"], ph: "un mot", exp: "de fiets → die (le vélo qui est cassé)." },
    { type: "qcm", q: "« Dit is de film ___ ik gisteren heb gezien. »", opts: ["dat", "die", "wat", "hetgeen"], a: 1, exp: "de film → die ; le verbe heb gezien va à la fin." },
    { type: "vf", q: "On choisit die ou dat selon que le mot français est « qui » ou « que ».", a: false, exp: "Faux : le choix dépend du genre néerlandais (de/het), pas du rôle qui/que." },
    { type: "input", q: "Complète : « Het meisje ___ naast mij zit, heet Lisa. »", a: ["dat"], ph: "die/dat", exp: "het meisje est un het-woord → dat." },
    { type: "qcm", q: "« De buren ___ naast ons wonen, zijn aardig. »", opts: ["dat", "die", "wie", "welk"], a: 1, exp: "de buren (pluriel) → die." },
    { type: "input", q: "Remets le verbe à la bonne place : « de man die in Gent ___ » (wonen)", a: ["woont"], ph: "verbe", exp: "woont, rejeté à la fin de la relative." },
    { type: "qcm", q: "Compréhension : « Ik heb een vriend die in Amsterdam woont. » Que sait-on de l'ami ?", opts: ["Il travaille à Amsterdam", "Il habite à Amsterdam", "Il visite Amsterdam", "Il vient d'Amsterdam"], a: 1, exp: "die in Amsterdam woont = qui habite à Amsterdam." },
    { type: "vf", q: "Compréhension : « Het appartement dat hij huurt, is klein. » L'appartement est grand.", a: false, exp: "klein = petit, donc l'affirmation est fausse." },
    { type: "qcm", q: "Compréhension : « Hij heeft een auto die heel oud is. » La voiture est…", opts: ["neuve", "très vieille", "rouge", "chère"], a: 1, exp: "heel oud = très vieille." }
  ],
  final: {
    title: "Exercice final — Een e-mail over een nieuwe collega",
    intro: `<p>Lis ce texte puis réponds :</p>
<pre class="pseudo">Hoi Tom,
Ik wil je iets vertellen over de nieuwe collega die vorige week is begonnen.
Hij heet Daan en hij komt uit Rotterdam. Het project dat hij leidt, is heel groot.
De computer die hij gebruikt, is nieuw, maar het kantoor dat hij deelt met mij is klein.
De mensen die met hem werken, vinden hem heel vriendelijk.
Groetjes, Sara</pre>`,
    questions: [
      { type: "qcm", q: "Quand le nouveau collègue a-t-il commencé ?", opts: ["hier", "la semaine dernière", "le mois dernier", "aujourd'hui"], a: 1, exp: "die vorige week is begonnen = qui a commencé la semaine dernière." },
      { type: "input", q: "D'où vient Daan ? Uit ___", a: ["rotterdam"], ph: "une ville", exp: "hij komt uit Rotterdam." },
      { type: "qcm", q: "Le projet qu'il dirige est…", opts: ["petit", "très grand", "terminé", "difficile"], a: 1, exp: "Het project dat hij leidt, is heel groot." },
      { type: "input", q: "Complète le pronom : « Het kantoor ___ hij deelt, is klein. »", a: ["dat"], ph: "die/dat", exp: "het kantoor → dat." },
      { type: "vf", q: "Les gens qui travaillent avec lui le trouvent désagréable.", a: false, exp: "Ils le trouvent vriendelijk (gentil), donc c'est faux." }
    ],
    solution: `<p>Traduction : « Salut Tom, je veux te dire quelque chose sur le nouveau collègue qui a commencé la semaine dernière. Il s'appelle Daan et vient de Rotterdam. Le projet qu'il dirige est très grand. L'ordinateur qu'il utilise est neuf, mais le bureau qu'il partage avec moi est petit. Les gens qui travaillent avec lui le trouvent très gentil. Bises, Sara. »</p>
<p>Retiens la mécanique : <strong>de-woord/pluriel → die</strong>, <strong>het-woord → dat</strong>, et le verbe part toujours à la fin de la relative (is begonnen, leidt, gebruikt, deelt, werken).</p>`
  }
};
</script>
