<script>
var DAY = {

  title: "Les émotions et la personnalité",
  subtitle: "Exprimer ses sentiments et décrire le caractère de quelqu'un en néerlandais.",
  theory: `
<h3>1. Les émotions — de emoties / de gevoelens</h3>
<pre class="pseudo">blij / gelukkig    content / heureux     verdrietig     triste
boos / kwaad       en colère             bang           effrayé
moe               fatigué                trots          fier
teleurgesteld      déçu                   verrast        surpris
nerveus           nerveux                ontspannen     détendu
jaloers           jaloux                 opgelucht      soulagé</pre>
<p><strong>Ik ben heel blij met dit nieuws.</strong> = Je suis très content de cette nouvelle. · <strong>Zij was verdrietig omdat haar kat weg was.</strong> = Elle était triste parce que son chat avait disparu.</p>
<h3>2. Exprimer un sentiment — een gevoel uitdrukken</h3>
<pre class="pseudo">Ik voel me...          Je me sens...        Ik ben bang dat...   J'ai peur que...
Ik ben trots op...     Je suis fier de...   Ik geniet van...     Je profite de...
Ik heb zin in...       J'ai envie de...     Ik erger me aan...   Je m'agace de...
Het spijt me.          Je suis désolé.      Ik maak me zorgen.   Je m'inquiète.</pre>
<div class="tip">Beaucoup de sentiments se construisent avec un verbe pronominal : <strong>zich voelen</strong> (se sentir), <strong>zich ergeren</strong> (s'agacer), <strong>zich zorgen maken</strong> (s'inquiéter). Exemple : « Ik voel me goed. » = Je me sens bien.</div>
<h3>3. La personnalité — de persoonlijkheid</h3>
<pre class="pseudo">vriendelijk       aimable, gentil       verlegen       timide
eerlijk           honnête               koppig         têtu
geduldig          patient               lui            paresseux
behulpzaam        serviable             egoïstisch     égoïste
zelfverzekerd     sûr de soi            bescheiden     modeste
optimistisch      optimiste            pessimistisch   pessimiste</pre>
<p><strong>Mijn broer is heel geduldig en behulpzaam.</strong> = Mon frère est très patient et serviable. · <strong>Zij is soms een beetje koppig.</strong> = Elle est parfois un peu têtue.</p>
<h3>4. Nuancer avec des adverbes</h3>
<pre class="pseudo">heel / erg     très          een beetje    un peu
soms           parfois        altijd        toujours
nogal          plutôt         helemaal niet pas du tout</pre>
<div class="warn">Ne confonds pas <strong>boos</strong> (en colère) et <strong>bang</strong> (effrayé) : ils se ressemblent mais sont opposés. Astuce : « bang » ressemble au bruit qui fait peur (bang !).</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Tom is een rustige en vriendelijke jongen.
Meestal is hij optimistisch, maar vandaag voelt hij zich nerveus.
Morgen heeft hij een belangrijk examen en hij is bang om te falen.
Zijn zus is zelfverzekerd en zegt: maak je geen zorgen, je bent goed voorbereid.
Na het gesprek voelt Tom zich veel meer ontspannen en zelfs een beetje trots.</pre>
<p>Traduction : Tom est un garçon calme et aimable. En général il est optimiste, mais aujourd'hui il se sent nerveux. Demain il a un examen important et il a peur d'échouer. Sa sœur est sûre d'elle et dit : ne t'inquiète pas, tu es bien préparé. Après la conversation, Tom se sent beaucoup plus détendu et même un peu fier.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « verdrietig » ?", opts: ["heureux", "triste", "en colère", "fatigué"], a: 1, exp: "verdrietig = triste." },
    { type: "input", q: "Traduis « en colère » : ___", a: ["boos", "kwaad"], ph: "un mot", exp: "boos ou kwaad = en colère." },
    { type: "qcm", q: "« Ik ben trots op mijn dochter. » veut dire…", opts: ["J'ai peur de ma fille", "Je suis fier de ma fille", "Je suis déçu de ma fille", "Je m'inquiète pour ma fille"], a: 1, exp: "trots op = fier de." },
    { type: "input", q: "Complète : « Ik ___ me goed vandaag. » (se sentir)", a: ["voel"], ph: "un mot", exp: "zich voelen : ik voel me = je me sens." },
    { type: "vf", q: "« opgelucht » signifie soulagé.", a: true, exp: "opgelucht = soulagé." },
    { type: "qcm", q: "Une personne « verlegen » est…", opts: ["têtue", "timide", "honnête", "paresseuse"], a: 1, exp: "verlegen = timide." },
    { type: "input", q: "Traduis « honnête » : ___", a: ["eerlijk"], ph: "un mot", exp: "eerlijk = honnête." },
    { type: "qcm", q: "Que veut dire « behulpzaam » ?", opts: ["égoïste", "serviable", "paresseux", "nerveux"], a: 1, exp: "behulpzaam = serviable, prêt à aider." },
    { type: "vf", q: "« koppig » signifie patient.", a: false, exp: "Faux : koppig = têtu ; geduldig = patient." },
    { type: "input", q: "Complète : « Zij is een ___ koppig. » (un peu)", a: ["beetje"], ph: "un mot", exp: "een beetje = un peu." },
    { type: "qcm", q: "« Ik maak me zorgen. » signifie…", opts: ["Je me repose", "Je m'inquiète", "Je suis fier", "Je suis détendu"], a: 1, exp: "zich zorgen maken = s'inquiéter." },
    { type: "input", q: "Traduis « sûr de soi » : ___", a: ["zelfverzekerd"], ph: "un mot", exp: "zelfverzekerd = sûr de soi." },
    { type: "qcm", q: "Compréhension : « Vandaag voelt Tom zich nerveus. » Comment se sent Tom aujourd'hui ?", opts: ["détendu", "nerveux", "en colère", "fier"], a: 1, exp: "nerveus = nerveux." },
    { type: "vf", q: "Compréhension : « Hij is bang om te falen. » Tom a peur d'échouer.", a: true, exp: "bang om te falen = avoir peur d'échouer." },
    { type: "qcm", q: "Compréhension : après avoir parlé à sa sœur, Tom se sent…", opts: ["encore plus nerveux", "plus détendu et un peu fier", "triste", "en colère"], a: 1, exp: "meer ontspannen en een beetje trots." }
  ],
  final: {
    title: "Exercice final — Gevoelens en karakter",
    intro: `<p>Lis ce texte puis réponds :</p>
<pre class="pseudo">Lena is een optimistische en behulpzame vrouw.
Ze is meestal geduldig, maar soms een beetje koppig.
Vandaag is ze heel blij, want ze heeft een nieuwe baan gevonden.
Toch is ze ook een beetje nerveus, want alles is nog nieuw voor haar.
Haar vriend is trots op haar en zegt dat ze zich geen zorgen moet maken.
Lena voelt zich opgelucht en kijkt vol vertrouwen naar de toekomst.</pre>`,
    questions: [
      { type: "qcm", q: "Comment est le caractère de Lena ?", opts: ["pessimiste et égoïste", "optimiste et serviable", "timide et paresseuse", "jalouse et têtue"], a: 1, exp: "optimistisch en behulpzaam = optimiste et serviable." },
      { type: "input", q: "Quel petit défaut a-t-elle parfois ? Ze is soms een beetje ___.", a: ["koppig"], ph: "un mot", exp: "koppig = têtue." },
      { type: "vf", q: "Elle est très contente parce qu'elle a trouvé un nouvel emploi.", a: true, exp: "Ze is heel blij want ze heeft een nieuwe baan gevonden." },
      { type: "qcm", q: "Pourquoi est-elle aussi un peu nerveuse ?", opts: ["Parce qu'elle est malade", "Parce que tout est nouveau pour elle", "Parce qu'elle est en retard", "Parce qu'elle a perdu son emploi"], a: 1, exp: "alles is nog nieuw voor haar = tout est encore nouveau pour elle." },
      { type: "input", q: "Comment se sent-elle à la fin ? Ze voelt zich ___.", a: ["opgelucht"], ph: "un mot", exp: "opgelucht = soulagée." }
    ],
    solution: `<p>Traduction : Lena est une femme optimiste et serviable. Elle est généralement patiente, mais parfois un peu têtue. Aujourd'hui elle est très contente, car elle a trouvé un nouvel emploi. Pourtant elle est aussi un peu nerveuse, car tout est encore nouveau pour elle. Son compagnon est fier d'elle et dit qu'elle ne doit pas s'inquiéter. Lena se sent soulagée et regarde l'avenir avec confiance.</p>
<p>Pour décrire quelqu'un, combine : des <strong>traits de personnalité</strong> (optimistisch, geduldig, koppig), des <strong>émotions du moment</strong> (blij, nerveus, opgelucht) et des <strong>nuances</strong> (soms, een beetje, heel). Beaucoup de sentiments emploient un verbe pronominal : <strong>zich voelen</strong>, <strong>zich zorgen maken</strong>.</p>`
  }
};
