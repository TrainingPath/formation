  title: "Bilan B1 : conversation de 10 minutes",
  subtitle: "Une trame pour tenir une vraie conversation et clôturer le niveau B1.",
  theory: `
<h3>1. L'objectif final</h3>
<p>Le but du niveau B1 est de <strong>tenir une conversation de dix minutes</strong> sur des sujets familiers, en donnant son avis, en racontant et en réagissant. Voici une trame de questions et de relances pour t'entraîner seul ou à deux.</p>
<h3>2. La trame : questions et relances</h3>
<pre class="pseudo">THEMA 1 — Jezelf voorstellen (se présenter)
  Vraag: Kun je jezelf voorstellen?
  Relance: Wat doe je in het dagelijks leven? En waar kom je vandaan?

THEMA 2 — Vrije tijd (loisirs)
  Vraag: Wat doe je graag in je vrije tijd?
  Relance: Hoe vaak doe je dat? Waarom vind je dat leuk?

THEMA 3 — Werk of studie (travail/études)
  Vraag: Wat voor werk doe je, of wat studeer je?
  Relance: Wat vind je het leukst? En wat is soms moeilijk?

THEMA 4 — Een herinnering (un souvenir)
  Vraag: Kun je een leuke herinnering vertellen?
  Relance: Wanneer was dat? Wie was erbij? Hoe voelde je je?

THEMA 5 — Je mening (ton opinion)
  Vraag: Wat vind je van sociale media?
  Relance: Ben je het eens met ...? Waarom wel of niet?

THEMA 6 — Toekomstplannen (projets)
  Vraag: Wat zijn je plannen voor volgend jaar?
  Relance: Waarom wil je dat? Hoe ga je dat doen?</pre>
<h3>3. Les formules pour tenir la conversation</h3>
<pre class="pseudo">Gagner du temps:   Even denken ...        Voyons ...
                   Dat is een goede vraag. C'est une bonne question.
Demander:          Kun je dat herhalen?   Peux-tu répéter ?
                   Wat bedoel je precies?  Qu'est-ce que tu veux dire ?
Réagir:            Echt waar? / Wat leuk!  Vraiment ? / Que sympa !
Enchaîner:         En jij? / En wat vind jij? Et toi ?</pre>
<div class="tip">Pour paraître naturel, ne réponds pas seulement à la question : ajoute un détail, une émotion, puis renvoie la parole avec « En jij? ». Une conversation vivante est un échange, pas un interrogatoire.</p></div>
<div class="warn">Si tu ne connais pas un mot, ne bloque pas : contourne (parafrase) avec « een ding om ... » (un truc pour ...) ou « hoe zeg je dat ... » (comment dit-on ...). Garder le fil est plus important que la perfection. Mobilise tout le B1 : passé, opinion, connecteurs, registre adapté.</p></div>`,

    { type: "input", q: "Formule pour gagner du temps : « ___ denken ... » (voyons)", a: ["even"], ph: "un mot", exp: "Even denken ... = laisse-moi réfléchir." },

    { type: "input", q: "Complète (raconter un souvenir) : « Kun je een leuke ___ vertellen? » (souvenir)", a: ["herinnering"], ph: "un mot", exp: "de herinnering = le souvenir." },
    { type: "qcm", q: "Pour réagir avec enthousiasme, on dit…", opts: ["Wat leuk!", "Dat klopt niet", "Ik weet het niet", "Tot morgen"], a: 0, exp: "Wat leuk! = que sympa ! (réaction positive)." },
    { type: "vf", q: "Si on ne connaît pas un mot, mieux vaut se taire complètement.", a: false, exp: "Non : on paraphrase et on garde le fil de la conversation." },
    { type: "input", q: "Complète (opinion) : « Wat ___ je van sociale media? » (trouver → penses-tu)", a: ["vind"], ph: "un verbe", exp: "Wat vind je van ...? = que penses-tu de ...?" },
    { type: "qcm", q: "Quelle relance convient au thème des projets d'avenir ?", opts: ["Wanneer was dat?", "Hoe ga je dat doen?", "Wie was erbij?", "Hoeveel kostte het?"], a: 1, exp: "Hoe ga je dat doen? relance sur les moyens (futur)." },

    { type: "vf", q: "Compréhension : ajouter un détail et une émotion à sa réponse la rend plus naturelle.", a: true, exp: "On développe au lieu de répondre par un seul mot." },
    { type: "qcm", q: "Compréhension : pour bien clôturer le B1 à l'oral, il faut surtout…", opts: ["parler sans aucune faute", "garder le fil et mobiliser passé, opinion et connecteurs", "utiliser des mots savants", "parler très vite"], a: 1, exp: "L'aisance et la continuité priment sur la perfection." }
  ],
  final: {
    title: "Exercice final — Simule ta conversation",
    intro: `<p>Voici un extrait de conversation modèle. Étudie les techniques, puis réponds :</p>
<pre class="pseudo">A: Wat doe je graag in je vrije tijd?
B: Even denken ... Ik hou van fietsen en lezen. Vooral in het weekend fiets ik
   graag in de natuur. En jij, wat doe jij graag?
A: Ik speel gitaar. Wat leuk dat je van de natuur houdt! Hoe vaak fiets je?
B: Meestal twee keer per week. Het ontspant me echt. Vind jij muziek ook ontspannend?
A: Ja, zeker! Muziek helpt me na een drukke dag.</pre>`,

      { type: "qcm", q: "Comment A réagit-il positivement à la réponse de B ?", opts: ["Dat klopt niet", "Wat leuk dat je van de natuur houdt!", "Ik moet gaan", "Herhaal dat"], a: 1, exp: "Wat leuk ...! = réaction chaleureuse." },
      { type: "input", q: "Quelle relance A pose-t-il sur la fréquence ? « Hoe ___ fiets je? »", a: ["vaak"], ph: "un mot", exp: "Hoe vaak ...? = à quelle fréquence ?" },
      { type: "qcm", q: "Qu'est-ce qui rend cette conversation naturelle ?", opts: ["les réponses très courtes", "l'ajout de détails, d'émotions et le renvoi de la parole", "l'absence de questions", "le silence"], a: 1, exp: "Détails + émotions + relances = échange vivant." }
    ],
    solution: `<p>Traduction : « A : Que fais-tu volontiers pendant ton temps libre ? — B : Voyons ... J'aime le vélo et la lecture. Surtout le week-end, j'aime faire du vélo dans la nature. Et toi, qu'aimes-tu faire ? — A : Je joue de la guitare. Que sympa que tu aimes la nature ! À quelle fréquence fais-tu du vélo ? — B : En général deux fois par semaine. Ça me détend vraiment. Trouves-tu la musique relaxante aussi ? — A : Oui, bien sûr ! La musique m'aide après une journée chargée. »</p>
<p>Félicitations, tu arrives au bout du niveau B1 ! Les techniques d'une conversation réussie : <strong>gagner du temps</strong> (Even denken ...), <strong>développer</strong> avec un détail et une émotion, <strong>réagir</strong> (Wat leuk!), <strong>relancer</strong> (En jij? Hoe vaak ...?). Entraîne-toi régulièrement avec la trame des six thèmes : c'est ainsi que l'aisance vient.</p>`
  }
};
