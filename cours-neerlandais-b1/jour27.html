var DAY = {
  num: 27,
  title: "Le registre : u ou jij ?",
  subtitle: "Choisir entre le vouvoiement et le tutoiement selon la situation.",
  theory: `
<h3>1. Les deux « vous / tu »</h3>
<p>Le néerlandais distingue le pronom formel <strong>u</strong> (vouvoiement) et le pronom informel <strong>jij / je</strong> (tutoiement). Le choix dépend de la relation, de l'âge et du contexte (professionnel ou amical).</p>
<pre class="pseudo">u          vous (formel, poli)      jij / je   tu (informel, familier)
uw         votre (formel)           jouw / je  ton/ta (informel)
Kunt u ...? Pouvez-vous ...?         Kun je ...? Peux-tu ...?</pre>
<div class="tip">Astuce : <strong>je</strong> est la forme non accentuée de <strong>jij</strong> (comme « jou/jouw » → « je »). On l'emploie très souvent : « Heb je tijd? » = As-tu le temps ? « jij » n'est utilisé que pour insister : « En jij, wat vind jij? »</p></div>
<h3>2. Quand vouvoyer (u) ?</h3>
<pre class="pseudo">- avec un inconnu adulte           een onbekende volwassene
- dans un cadre professionnel       op het werk, met een klant
- avec une personne âgée            een oudere persoon
- dans une lettre/e-mail formel     in een formele brief
- avec l'administration             bij de overheid, de dokter</pre>
<h3>3. Quand tutoyer (jij / je) ?</h3>
<pre class="pseudo">- avec des amis et la famille       vrienden en familie
- avec des enfants                  kinderen
- entre collègues (souvent)         onder collega's
- entre jeunes                      onder jongeren</pre>
<div class="warn">Aux Pays-Bas, le tutoiement (jij/je) est plus répandu et rapide qu'en Belgique, où l'on garde parfois « u » plus longtemps par politesse. Dans le doute, commence par <strong>u</strong> : on peut toujours proposer ensuite « Je mag me tutoyeren » / « Zeg maar je ».</p></div>
<h3>4. Passer du « u » au « je »</h3>
<p>C'est souvent la personne la plus âgée ou la plus haut placée qui propose le tutoiement :</p>
<pre class="pseudo">Zeg maar je / jij.           Tu peux me tutoyer.
Zeg maar Jan.                Appelle-moi Jan.
Mogen we elkaar tutoyeren?   Peut-on se tutoyer ?</pre>
<p><strong>Conjugaison :</strong> avec « u », le verbe se conjugue comme la 3e personne du singulier le plus souvent : <strong>u kunt / u heeft / u bent</strong>. Avec « je », attention à la chute du -t en cas d'inversion : « je kunt » mais « kun je? ».</p>`,
  exercises: [
    { type: "qcm", q: "Quel pronom est FORMEL (vouvoiement) ?", opts: ["jij", "je", "u", "jou"], a: 2, exp: "u = vous (formel)." },
    { type: "input", q: "Complète le possessif formel : « Wat is ___ naam, meneer? » (votre)", a: ["uw"], ph: "un mot", exp: "uw = votre (formel)." },
    { type: "qcm", q: "Avec qui utilise-t-on plutôt « jij / je » ?", opts: ["un client au travail", "un inconnu âgé", "des amis et la famille", "l'administration"], a: 2, exp: "jij/je s'emploie avec les proches, amis, enfants." },
    { type: "qcm", q: "« je » est…", opts: ["un pronom formel", "la forme non accentuée de « jij »", "un pluriel", "un possessif uniquement"], a: 1, exp: "je = forme atone de jij (informel)." },
    { type: "input", q: "Complète (formel) : « ___ u even wachten? » (pouvoir → pouvez-vous)", a: ["kunt"], ph: "un verbe", exp: "Kunt u ...? = pouvez-vous ...? (u + kunt)." },
    { type: "vf", q: "Dans un e-mail formel, on emploie « u » et « uw ».", a: true, exp: "Le formel exige u / uw." },
    { type: "qcm", q: "« Zeg maar je » signifie…", opts: ["Dis oui", "Tu peux me tutoyer", "Parle plus fort", "Répète"], a: 1, exp: "Zeg maar je = on peut se tutoyer." },
    { type: "input", q: "Complète l'inversion (le -t tombe) : « ___ je morgen tijd? » (avoir → as-tu)", a: ["heb"], ph: "un verbe", exp: "Inversion avec je : heb je? (le -t tombe)." },
    { type: "qcm", q: "Dans le doute avec un inconnu adulte, il vaut mieux…", opts: ["tutoyer directement", "commencer par vouvoyer (u)", "ne rien dire", "utiliser « jij » pour insister"], a: 1, exp: "Par prudence, on commence par « u »." },
    { type: "vf", q: "Le tutoiement est en général plus rapide aux Pays-Bas qu'en Belgique.", a: true, exp: "En Belgique on garde souvent « u » plus longtemps." },
    { type: "input", q: "Complète (formel) : « ___ bent van harte welkom. » (vous êtes)", a: ["u"], ph: "un pronom", exp: "U bent welkom = vous êtes le bienvenu." },
    { type: "qcm", q: "Quand emploie-t-on « jij » plutôt que « je » ?", opts: ["toujours", "jamais", "pour insister / mettre en contraste", "à l'écrit uniquement"], a: 2, exp: "jij accentue : « En jij, wat vind jij? »." },
    { type: "qcm", q: "Compréhension : « Meneer De Wit, kunt u mij helpen? » Quel registre ?", opts: ["informel (tutoiement)", "formel (vouvoiement)", "familier", "enfantin"], a: 1, exp: "Meneer + kunt u = vouvoiement formel." },
    { type: "vf", q: "Compréhension : « Hé Tom, heb je zin om iets te drinken? » emploie le tutoiement.", a: true, exp: "heb je = tutoiement informel entre amis." },
    { type: "qcm", q: "Compréhension : « Mogen we elkaar tutoyeren? » — que propose-t-on ?", opts: ["de se vouvoyer", "de se tutoyer", "de se saluer", "de partir"], a: 1, exp: "elkaar tutoyeren = se tutoyer." }
  ],
  final: {
    title: "Exercice final — Deux situations, deux registres",
    intro: `<p>Compare ces deux mini-dialogues et identifie le registre, puis réponds :</p>
<pre class="pseudo">A) Bij de dokter:
   — Goedemorgen mevrouw, waarmee kan ik u helpen?
   — Kunt u mij een recept geven? Ik heb hoofdpijn.

B) Met een vriend:
   — Hé, hoe gaat het met je? Heb je zin om te voetballen?
   — Ja leuk! Zeg, kom je met de fiets of met de auto?</pre>`,
    questions: [
      { type: "qcm", q: "Dans le dialogue A, quel registre le médecin utilise-t-il ?", opts: ["informel (je)", "formel (u)", "les deux", "aucun pronom"], a: 1, exp: "waarmee kan ik u helpen = vouvoiement formel." },
      { type: "input", q: "Relève le pronom formel employé dans A : ___", a: ["u"], ph: "un pronom", exp: "u = vous (formel), employé chez le médecin." },
      { type: "qcm", q: "Dans le dialogue B, quel est le registre entre amis ?", opts: ["formel (u)", "informel (je/jij)", "administratif", "écrit"], a: 1, exp: "hoe gaat het met je / heb je = tutoiement." },
      { type: "input", q: "Relève une forme de tutoiement dans B : « Heb ___ zin ...? »", a: ["je"], ph: "un pronom", exp: "heb je = tutoiement (je)." },
      { type: "qcm", q: "Pourquoi le registre diffère-t-il entre A et B ?", opts: ["par hasard", "A est une situation formelle (médecin), B est amicale", "A est écrit, B est oral", "A est belge, B est néerlandais"], a: 1, exp: "Le contexte (professionnel/formel vs amical) détermine u ou je." }
    ],
    solution: `<p>Traduction : A) « Bonjour madame, en quoi puis-je vous aider ? — Pouvez-vous me donner une ordonnance ? J'ai mal à la tête. » B) « Hé, comment ça va ? As-tu envie de jouer au foot ? — Oui, chouette ! Dis, tu viens à vélo ou en voiture ? »</p>
<p>Le dialogue A (chez le médecin) est formel : <strong>u</strong>, ton poli. Le dialogue B (entre amis) est informel : <strong>je / jij</strong>, ton détendu. Retiens la règle d'or : dans le doute, commence par <strong>u</strong>, et attends qu'on te propose « Zeg maar je » pour passer au tutoiement.</p>`
  }
};
</script>
