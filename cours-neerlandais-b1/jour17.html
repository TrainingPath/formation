var DAY = {

  title: "Donner son opinion, être d'accord ou non",
  subtitle: "Exprimer un avis, nuancer, approuver ou contester poliment.",
  theory: `
<h3>1. Introduire une opinion — je mening geven</h3>
<p>Pour donner son avis, on dispose de plusieurs formules. Attention : après ces expressions, si elles ouvrent la phrase, le verbe passe en deuxième position (inversion) :</p>
<pre class="pseudo">Ik denk dat ...          Je pense que ...
Ik vind dat ...          Je trouve que ...
Volgens mij ...          Selon moi ...
Naar mijn mening ...     À mon avis ...
Ik ben ervan overtuigd dat ...  Je suis convaincu(e) que ...</pre>
<p><strong>Ik vind dat de trein te duur is.</strong> = Je trouve que le train est trop cher. · <strong>Volgens mij heeft hij gelijk.</strong> = Selon moi, il a raison.</p>
<div class="tip">Attention à la différence : <strong>denken</strong> = penser (une opinion, une supposition) ; <strong>vinden</strong> = trouver (un jugement, une appréciation). « Ik vind de film mooi » = Je trouve le film beau.</div>
<h3>2. Être d'accord — het eens zijn</h3>
<pre class="pseudo">Ik ben het eens.               Je suis d'accord.
Ik ben het met je eens.        Je suis d'accord avec toi.
Dat klopt.                     C'est exact.
Precies! / Inderdaad!          Exactement ! / En effet !
Je hebt gelijk.                Tu as raison.</pre>
<p><strong>Ik ben het helemaal met je eens.</strong> = Je suis entièrement d'accord avec toi.</p>
<h3>3. Ne pas être d'accord — het oneens zijn</h3>
<pre class="pseudo">Ik ben het er niet mee eens.   Je ne suis pas d'accord.
Dat klopt niet.                Ce n'est pas exact.
Ik denk het niet.              Je ne pense pas.
Dat vind ik niet.              Je ne trouve pas.
Ik twijfel eraan.              J'en doute.</pre>
<div class="warn">L'expression est <strong>het eens zijn</strong> (avec « het » obligatoire). On dit « Ik ben het eens » et jamais « Ik ben eens ». Pour ajouter la personne : <strong>het met iemand eens zijn</strong> → « Ik ben het met jou eens ».</div>
<h3>4. Nuancer poliment</h3>
<p>Pour contredire sans brusquer, on adoucit souvent avec ces tournures :</p>
<pre class="pseudo">Dat is waar, maar ...          C'est vrai, mais ...
Aan de ene kant ..., aan de andere kant ...  D'un côté ..., de l'autre ...
Ik snap je punt, maar ...      Je comprends ton point de vue, mais ...
Misschien, maar toch ...       Peut-être, mais quand même ...</pre>
<p><strong>Aan de ene kant is het duur, aan de andere kant is het snel.</strong> = D'un côté c'est cher, de l'autre c'est rapide.</p>`,
  exercises: [
    { type: "qcm", q: "Quelle expression signifie « Selon moi » ?", opts: ["Volgens mij", "Ik ben het eens", "Dat klopt", "Je hebt gelijk"], a: 0, exp: "Volgens mij = selon moi." },
    { type: "input", q: "Complète : « Ik ___ dat de film mooi is. » (trouver, opinion/jugement)", a: ["vind"], ph: "un verbe", exp: "vinden = trouver, pour un jugement." },
    { type: "qcm", q: "Pour dire « Je suis d'accord », on dit…", opts: ["Ik ben eens", "Ik ben het eens", "Ik ben mee", "Ik heb eens"], a: 1, exp: "het eens zijn : « het » est obligatoire." },
    { type: "qcm", q: "« Dat klopt » veut dire…", opts: ["C'est faux", "C'est exact", "Je doute", "Peut-être"], a: 1, exp: "Dat klopt = c'est exact / c'est juste." },
    { type: "input", q: "Complète : « Ik ben het met ___ eens. » (avec toi)", a: ["jou", "je"], ph: "un pronom", exp: "het met jou/je eens zijn = être d'accord avec toi." },
    { type: "vf", q: "« Je hebt gelijk » signifie « Tu as raison ».", a: true, exp: "gelijk hebben = avoir raison." },
    { type: "qcm", q: "Quelle phrase exprime un DÉSACCORD ?", opts: ["Inderdaad!", "Precies!", "Dat klopt niet.", "Je hebt gelijk."], a: 2, exp: "Dat klopt niet = ce n'est pas exact." },
    { type: "input", q: "Traduis « J'en doute » : Ik ___ eraan.", a: ["twijfel"], ph: "un verbe", exp: "twijfelen aan = douter de ; ik twijfel eraan." },
    { type: "qcm", q: "Quelle est la différence entre « denken » et « vinden » ?", opts: ["Aucune", "denken = penser/supposer, vinden = trouver/juger", "denken = trouver, vinden = chercher", "Ce sont des synonymes exacts"], a: 1, exp: "denken = penser ; vinden = trouver, apprécier." },
    { type: "vf", q: "« Aan de ene kant ..., aan de andere kant ... » sert à nuancer (d'un côté, de l'autre).", a: true, exp: "Formule pour présenter deux aspects opposés." },
    { type: "input", q: "Complète l'inversion : « Volgens mij ___ hij gelijk. » (avoir → il a)", a: ["heeft"], ph: "un verbe", exp: "Après « Volgens mij » en tête, le verbe passe en 2e position : heeft hij." },
    { type: "qcm", q: "« Ik snap je punt, maar ... » sert à…", opts: ["approuver totalement", "nuancer / contredire poliment", "poser une question", "changer de sujet"], a: 1, exp: "On reconnaît le point de vue avant d'objecter." },
    { type: "qcm", q: "Compréhension : « Ik vind dat we minder moeten reizen. » — « Dat klopt, maar het is soms nodig. » La 2e personne…", opts: ["est totalement d'accord", "reconnaît le point mais nuance", "n'est pas du tout d'accord", "ne répond pas"], a: 1, exp: "Dat klopt, maar = c'est exact, mais (nuance)." },
    { type: "vf", q: "Compréhension : « Ik ben het er niet mee eens, ik denk het niet. » La personne est en désaccord.", a: true, exp: "het er niet mee eens zijn = ne pas être d'accord." },
    { type: "qcm", q: "Compréhension : « Naar mijn mening is dat idee te duur. » Que pense la personne de l'idée ?", opts: ["qu'elle est bonne", "qu'elle est trop chère", "qu'elle est rapide", "qu'elle est facile"], a: 1, exp: "te duur = trop chère ; naar mijn mening = à mon avis." }
  ],
  final: {
    title: "Exercice final — Een discussie over de auto",
    intro: `<p>Lis ce petit débat, puis réponds :</p>
<pre class="pseudo">Lisa: Volgens mij moeten we de auto vaker laten staan en meer fietsen.
Tom: Dat klopt, maar niet iedereen woont dicht bij het werk.
Lisa: Dat is waar, maar voor korte ritten is de fiets echt beter.
Tom: Aan de ene kant heb je gelijk, aan de andere kant heb ik soms haast.
Lisa: Ik snap je punt, maar de fiets is goedkoper en gezonder.
Tom: Daar ben ik het wel mee eens. Ik ga het proberen.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle est l'opinion de Lisa au début ?", opts: ["prendre plus souvent la voiture", "laisser la voiture et faire plus de vélo", "acheter une nouvelle voiture", "prendre le train"], a: 1, exp: "de auto vaker laten staan en meer fietsen." },
      { type: "input", q: "Comment Tom exprime-t-il un accord partiel au début ? « Dat ___, maar ... » (c'est exact)", a: ["klopt"], ph: "un mot", exp: "Dat klopt, maar ... = c'est exact, mais ..." },
      { type: "qcm", q: "Selon Lisa, pour quels trajets le vélo est-il vraiment mieux ?", opts: ["les longs trajets", "les trajets courts", "les trajets de nuit", "tous les trajets"], a: 1, exp: "voor korte ritten is de fiets echt beter." },
      { type: "qcm", q: "Quels sont les deux arguments finaux de Lisa pour le vélo ?", opts: ["plus rapide et plus beau", "moins cher et plus sain", "plus grand et plus confortable", "plus cher mais plus sûr"], a: 1, exp: "goedkoper en gezonder = moins cher et plus sain." },
      { type: "input", q: "Comment Tom finit-il par être d'accord ? « Daar ben ik het wel mee ___. »", a: ["eens"], ph: "un mot", exp: "het ermee eens zijn = être d'accord avec cela." }
    ],
    solution: `<p>Traduction : « Lisa : Selon moi nous devons plus souvent laisser la voiture et faire plus de vélo. — Tom : C'est exact, mais tout le monde n'habite pas près du travail. — Lisa : C'est vrai, mais pour les trajets courts le vélo est vraiment mieux. — Tom : D'un côté tu as raison, de l'autre je suis parfois pressé. — Lisa : Je comprends ton point de vue, mais le vélo est moins cher et plus sain. — Tom : Là je suis d'accord. Je vais essayer. »</p>
<p>Remarque la progression : chaque interlocuteur reconnaît d'abord l'argument de l'autre (<strong>Dat klopt, Dat is waar, Ik snap je punt</strong>) avant de nuancer avec <strong>maar</strong>. C'est la clé d'un débat poli en néerlandais.</p>`
  }
};
