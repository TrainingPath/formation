  title: "L'environnement et l'actualité",
  subtitle: "Parler d'écologie, de problèmes environnementaux et de l'actualité en néerlandais.",
  theory: `
<h3>1. L'environnement — het milieu</h3>
<pre class="pseudo">het milieu            l'environnement       de natuur        la nature
de vervuiling         la pollution          het klimaat      le climat
de opwarming          le réchauffement      de uitstoot      les émissions
het afval             les déchets           de energie       l'énergie
de zonne-energie      l'énergie solaire     de windmolen     l'éolienne
duurzaam              durable               vervuilen        polluer</pre>
<p><strong>De opwarming van de aarde is een groot probleem.</strong> = Le réchauffement de la Terre est un grand problème.</p>
<h3>2. Agir pour la planète — iets doen voor de planeet</h3>
<pre class="pseudo">recycleren            recycler              afval sorteren    trier les déchets
energie besparen      économiser l'énergie  het openbaar vervoer les transports en commun
de fiets nemen        prendre le vélo       minder vlees eten manger moins de viande
het milieu beschermen protéger l'environnement herbruikbaar   réutilisable</pre>
<p><strong>Wij sorteren ons afval en nemen vaker de fiets.</strong> = Nous trions nos déchets et prenons plus souvent le vélo. · <strong>We moeten energie besparen om het klimaat te beschermen.</strong> = Nous devons économiser l'énergie pour protéger le climat.</p>
<div class="tip">Pour donner ton avis sur un sujet d'actualité : <strong>Ik vind dat...</strong> (Je trouve que...), <strong>Volgens mij...</strong> (Selon moi...), <strong>Ik ben ervan overtuigd dat...</strong> (Je suis convaincu que...).</div>
<h3>3. L'actualité — het nieuws / de actualiteit</h3>
<pre class="pseudo">het nieuws          les informations       de krant         le journal
de journalist       le journaliste         het artikel      l'article
de regering         le gouvernement        de verkiezingen  les élections
de economie         l'économie             de werkloosheid  le chômage
de oorlog           la guerre              de vrede         la paix</pre>
<p><strong>Ik lees elke dag het nieuws in de krant.</strong> = Je lis les informations dans le journal chaque jour.</p>
<h3>4. Exprimer un problème et une solution</h3>
<pre class="pseudo">het probleem        le problème            de oplossing     la solution
Het probleem is dat...  Le problème est que...
Een goede oplossing is...  Une bonne solution est...
We moeten...        Nous devons...          Het is belangrijk om... Il est important de...</pre>
<div class="warn">Ne confonds pas <strong>het weer</strong> (le temps qu'il fait) et <strong>het klimaat</strong> (le climat) : le premier change chaque jour, le second concerne le long terme.</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">De klimaatverandering is vandaag een belangrijk thema in het nieuws.
Volgens veel wetenschappers stijgt de temperatuur te snel.
De grootste oorzaken zijn de vervuiling en de uitstoot van CO2.
Gelukkig kunnen we iets doen: energie besparen, afval sorteren en de fiets nemen.
Ook de regering moet maatregelen nemen om het milieu te beschermen.
Samen kunnen we een duurzame oplossing vinden voor de toekomst.</pre>
<p>Traduction : Le changement climatique est aujourd'hui un thème important dans l'actualité. Selon de nombreux scientifiques, la température monte trop vite. Les plus grandes causes sont la pollution et les émissions de CO2. Heureusement, nous pouvons faire quelque chose : économiser l'énergie, trier les déchets et prendre le vélo. Le gouvernement doit aussi prendre des mesures pour protéger l'environnement. Ensemble, nous pouvons trouver une solution durable pour l'avenir.</p>`,

    { type: "input", q: "Traduis « les transports en commun » : het openbaar ___", a: ["vervoer"], ph: "un mot", exp: "het openbaar vervoer = les transports en commun." },
    { type: "qcm", q: "Où lit-on « het nieuws » ?", opts: ["in de krant", "in de tuin", "in de keuken", "op de fiets"], a: 0, exp: "in de krant = dans le journal." },
    { type: "vf", q: "« het weer » et « het klimaat » veulent dire exactement la même chose.", a: false, exp: "Faux : het weer = le temps du jour ; het klimaat = le climat (long terme)." },
    { type: "input", q: "Complète : « Een goede ___ is de fiets nemen. » (solution)", a: ["oplossing"], ph: "un mot", exp: "de oplossing = la solution." },
    { type: "qcm", q: "« de werkloosheid » signifie…", opts: ["le travail", "le chômage", "l'économie", "la guerre"], a: 1, exp: "de werkloosheid = le chômage." },
    { type: "input", q: "Traduis « le gouvernement » : de ___", a: ["regering"], ph: "un mot", exp: "de regering = le gouvernement." },
    { type: "qcm", q: "Compréhension : « De temperatuur stijgt te snel. » Que dit-on de la température ?", opts: ["Elle baisse", "Elle reste stable", "Elle monte trop vite", "Elle est parfaite"], a: 2, exp: "stijgt te snel = monte trop vite." },
    { type: "vf", q: "Compréhension : les causes citées sont la pollution et les émissions de CO2.", a: true, exp: "de vervuiling en de uitstoot van CO2." },
    { type: "qcm", q: "Compréhension : selon le texte, qui doit aussi agir en plus des citoyens ?", opts: ["les enfants", "le gouvernement", "les touristes", "personne"], a: 1, exp: "Ook de regering moet maatregelen nemen." }
  ],
  final: {
    title: "Exercice final — Het milieu in het nieuws",
    intro: `<p>Lis cet article court puis réponds :</p>
<pre class="pseudo">In het nieuws van vandaag staat een artikel over het milieu.
Steeds meer mensen maken zich zorgen over de klimaatverandering.
In veel steden is de luchtvervuiling een groot probleem geworden.
De regering wil daarom het openbaar vervoer goedkoper maken.
Ook wil ze meer zonne-energie en windmolens gebruiken.
Volgens de journalist is een duurzame toekomst mogelijk als iedereen meehelpt.</pre>`,
    questions: [
      { type: "qcm", q: "Quel est le sujet de l'article ?", opts: ["le sport", "l'environnement", "l'économie", "la culture"], a: 1, exp: "een artikel over het milieu = un article sur l'environnement." },
      { type: "input", q: "Quel problème est devenu grand dans beaucoup de villes ? De ___.", a: ["luchtvervuiling"], ph: "un mot", exp: "de luchtvervuiling = la pollution de l'air." },
      { type: "vf", q: "Le gouvernement veut rendre les transports en commun moins chers.", a: true, exp: "de regering wil het openbaar vervoer goedkoper maken." },
      { type: "qcm", q: "Quelles énergies le gouvernement veut-il utiliser davantage ?", opts: ["le charbon et le pétrole", "l'énergie solaire et les éoliennes", "le gaz naturel", "aucune"], a: 1, exp: "meer zonne-energie en windmolens = plus d'énergie solaire et d'éoliennes." },
      { type: "input", q: "Selon le journaliste, un avenir durable est possible si tout le monde ___.", a: ["meehelpt"], ph: "un mot", exp: "als iedereen meehelpt = si tout le monde aide." }
    ],
    solution: `<p>Traduction : Dans l'actualité d'aujourd'hui, il y a un article sur l'environnement. De plus en plus de gens s'inquiètent du changement climatique. Dans beaucoup de villes, la pollution de l'air est devenue un gros problème. Le gouvernement veut donc rendre les transports en commun moins chers. Il veut aussi utiliser plus d'énergie solaire et d'éoliennes. Selon le journaliste, un avenir durable est possible si tout le monde participe.</p>
<p>Pour parler d'un sujet d'actualité, structure ton propos : nomme le <strong>problème</strong> (het probleem, de vervuiling), donne des <strong>causes</strong> (de uitstoot, de opwarming), propose des <strong>solutions</strong> (energie besparen, afval sorteren, openbaar vervoer) et exprime ton <strong>avis</strong> (Ik vind dat..., Volgens mij...).</p>`
  }
};
