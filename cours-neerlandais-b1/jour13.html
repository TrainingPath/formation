<script>
var DAY = {
  num: 13,
  title: "L'entretien d'embauche : questions clés",
  subtitle: "Comprendre et répondre aux questions d'un entretien d'embauche en néerlandais.",
  theory: `
<h3>1. Le déroulement — het sollicitatiegesprek</h3>
<pre class="pseudo">het sollicitatiegesprek   l'entretien d'embauche   de sollicitant   le candidat
de vraag                  la question              het antwoord     la réponse
de recruiter              le recruteur             de motivatie     la motivation
uitnodigen                inviter                  aannemen         embaucher
afwijzen                  refuser                  de proefperiode  la période d'essai</pre>
<p><strong>Ik ben uitgenodigd voor een sollicitatiegesprek.</strong> = J'ai été invité à un entretien d'embauche.</p>
<h3>2. Banque de questions du recruteur — vragen van de recruiter</h3>
<pre class="pseudo">Kunt u zich even voorstellen?          Pouvez-vous vous présenter ?
Waarom solliciteert u naar deze baan?  Pourquoi postulez-vous à cet emploi ?
Wat zijn uw sterke punten?             Quels sont vos points forts ?
Wat zijn uw zwakke punten?             Quels sont vos points faibles ?
Waarom wilt u van baan veranderen?     Pourquoi voulez-vous changer d'emploi ?
Waar ziet u zichzelf over vijf jaar?   Où vous voyez-vous dans cinq ans ?
Wat verwacht u van dit bedrijf?        Qu'attendez-vous de cette entreprise ?
Heeft u nog vragen voor ons?           Avez-vous encore des questions pour nous ?</pre>
<h3>3. Banque de réponses du candidat — antwoorden van de sollicitant</h3>
<pre class="pseudo">Ik ben gemotiveerd en leergierig.       Je suis motivé et avide d'apprendre.
Ik werk goed onder druk.                Je travaille bien sous pression.
Mijn sterke punt is doorzettingsvermogen. Mon point fort est la persévérance.
Ik wil mezelf verder ontwikkelen.       Je veux continuer à me développer.
Deze functie past goed bij mijn profiel. Ce poste correspond bien à mon profil.
Ik zoek een nieuwe uitdaging.           Je cherche un nouveau défi.</pre>
<div class="tip">Pour un point faible, reste positif : <strong>Soms ben ik te perfectionistisch, maar ik werk eraan.</strong> = Parfois je suis trop perfectionniste, mais j'y travaille. Montre que tu progresses !</div>
<h3>4. Poser des questions à la fin</h3>
<pre class="pseudo">Hoe ziet een typische werkdag eruit?    À quoi ressemble une journée type ?
Zijn er doorgroeimogelijkheden?          Y a-t-il des possibilités d'évolution ?
Wanneer hoor ik iets van u?              Quand aurai-je de vos nouvelles ?
Wat is de volgende stap?                 Quelle est la prochaine étape ?</pre>
<div class="warn">Attention au vouvoiement : en entretien, on utilise <strong>u</strong> (vous) et non <strong>je/jij</strong> (tu). Exemple : « Kunt u... ? » et non « Kun je... ? ».</div>
<h3>5. Petit dialogue de compréhension</h3>
<pre class="pseudo">Recruiter: Waarom solliciteert u naar deze functie?
Sollicitant: Omdat ik een nieuwe uitdaging zoek en het bedrijf me aanspreekt.
Recruiter: Wat zijn uw sterke punten?
Sollicitant: Ik ben nauwkeurig, gemotiveerd en ik werk goed in team.
Recruiter: Heeft u nog vragen?
Sollicitant: Ja, zijn er doorgroeimogelijkheden binnen het bedrijf?</pre>
<p>Traduction : Recruteur : Pourquoi postulez-vous à ce poste ? — Candidat : Parce que je cherche un nouveau défi et que l'entreprise m'attire. — Recruteur : Quels sont vos points forts ? — Candidat : Je suis minutieux, motivé et je travaille bien en équipe. — Recruteur : Avez-vous encore des questions ? — Candidat : Oui, y a-t-il des possibilités d'évolution dans l'entreprise ?</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « het sollicitatiegesprek » ?", opts: ["le contrat de travail", "l'entretien d'embauche", "la fiche de paie", "le licenciement"], a: 1, exp: "het sollicitatiegesprek = l'entretien d'embauche." },
    { type: "input", q: "Traduis « le candidat » : de ___", a: ["sollicitant"], ph: "un mot", exp: "de sollicitant = le candidat." },
    { type: "qcm", q: "« Kunt u zich even voorstellen? » demande de…", opts: ["vous asseoir", "vous présenter", "signer le contrat", "partir"], a: 1, exp: "zich voorstellen = se présenter." },
    { type: "input", q: "Complète la question : « Wat zijn uw sterke ___? » (points forts)", a: ["punten"], ph: "un mot", exp: "sterke punten = points forts." },
    { type: "vf", q: "En entretien formel, on utilise « je/jij » pour s'adresser au recruteur.", a: false, exp: "Faux : on utilise « u » (vous) dans un contexte formel." },
    { type: "qcm", q: "« Waar ziet u zichzelf over vijf jaar? » demande…", opts: ["votre âge", "où vous vous voyez dans cinq ans", "votre salaire actuel", "votre adresse"], a: 1, exp: "over vijf jaar = dans cinq ans." },
    { type: "input", q: "Traduis « la motivation » : de ___", a: ["motivatie"], ph: "un mot", exp: "de motivatie = la motivation." },
    { type: "qcm", q: "Comment présenter un point faible intelligemment ?", opts: ["Nier en avoir un", "Rester positif et montrer qu'on progresse", "Citer un défaut grave", "Ne pas répondre"], a: 1, exp: "On reste positif : « ik werk eraan » (j'y travaille)." },
    { type: "vf", q: "« aannemen » signifie embaucher.", a: true, exp: "iemand aannemen = embaucher quelqu'un ; afwijzen = refuser." },
    { type: "input", q: "Complète : « Ik werk goed onder ___. » (pression)", a: ["druk"], ph: "un mot", exp: "onder druk werken = travailler sous pression." },
    { type: "qcm", q: "« Zijn er doorgroeimogelijkheden? » interroge sur…", opts: ["les horaires", "les possibilités d'évolution", "les congés", "le télétravail"], a: 1, exp: "doorgroeimogelijkheden = possibilités d'évolution." },
    { type: "input", q: "Traduis « la période d'essai » : de ___", a: ["proefperiode"], ph: "un mot", exp: "de proefperiode = la période d'essai." },
    { type: "qcm", q: "Compréhension : « Omdat ik een nieuwe uitdaging zoek. » Pourquoi le candidat postule-t-il ?", opts: ["Pour le salaire", "Parce qu'il cherche un nouveau défi", "Parce qu'il a été licencié", "Pour déménager"], a: 1, exp: "een nieuwe uitdaging = un nouveau défi." },
    { type: "vf", q: "Compréhension : le candidat dit « ik werk goed in team ». Il apprécie le travail d'équipe.", a: true, exp: "in team werken = travailler en équipe." },
    { type: "qcm", q: "Compréhension : à la fin, le candidat demande « zijn er doorgroeimogelijkheden? ». Il s'informe sur…", opts: ["le parking", "l'évolution de carrière", "la cantine", "les vacances"], a: 1, exp: "Il pose une question sur les perspectives d'évolution." }
  ],
  final: {
    title: "Exercice final — Een sollicitatiegesprek",
    intro: `<p>Lis cet extrait d'entretien puis réponds :</p>
<pre class="pseudo">Recruiter: Goedemorgen, kunt u zich even voorstellen?
Fatima: Zeker. Mijn naam is Fatima en ik heb vijf jaar ervaring in de verkoop.
Recruiter: Waarom solliciteert u naar deze functie?
Fatima: Ik zoek een nieuwe uitdaging en deze baan past goed bij mijn profiel.
Recruiter: Wat is uw grootste sterke punt?
Fatima: Mijn doorzettingsvermogen. Ik geef nooit snel op.
Recruiter: En een zwak punt?
Fatima: Soms ben ik te perfectionistisch, maar ik werk eraan.
Recruiter: Prima. Heeft u nog vragen?
Fatima: Ja, wanneer hoor ik iets van u over de volgende stap?</pre>`,
    questions: [
      { type: "input", q: "Combien d'années d'expérience a Fatima ? ___ jaar", a: ["vijf", "5"], ph: "un mot", exp: "vijf jaar ervaring = cinq ans d'expérience." },
      { type: "qcm", q: "Dans quel domaine a-t-elle de l'expérience ?", opts: ["la comptabilité", "la vente", "l'enseignement", "la santé"], a: 1, exp: "de verkoop = la vente." },
      { type: "vf", q: "Son plus grand point fort est la persévérance.", a: true, exp: "doorzettingsvermogen = persévérance." },
      { type: "qcm", q: "Quel point faible mentionne-t-elle ?", opts: ["Elle arrive en retard", "Elle est parfois trop perfectionniste", "Elle parle mal néerlandais", "Elle n'aime pas travailler en équipe"], a: 1, exp: "te perfectionistisch = trop perfectionniste, mais elle y travaille." },
      { type: "input", q: "Sur quoi porte sa question finale ? De volgende ___.", a: ["stap"], ph: "un mot", exp: "de volgende stap = la prochaine étape." }
    ],
    solution: `<p>Traduction : Recruteur : Bonjour, pouvez-vous vous présenter ? — Fatima : Bien sûr. Je m'appelle Fatima et j'ai cinq ans d'expérience dans la vente. — Recruteur : Pourquoi postulez-vous à ce poste ? — Fatima : Je cherche un nouveau défi et cet emploi correspond bien à mon profil. — Recruteur : Quel est votre plus grand point fort ? — Fatima : Ma persévérance. Je n'abandonne jamais facilement. — Recruteur : Et un point faible ? — Fatima : Parfois je suis trop perfectionniste, mais j'y travaille. — Recruteur : Très bien. Avez-vous encore des questions ? — Fatima : Oui, quand aurai-je de vos nouvelles concernant la prochaine étape ?</p>
<p>Un bon entretien suit une logique : <strong>se présenter</strong> (zich voorstellen), <strong>expliquer sa motivation</strong> (motivatie), <strong>valoriser ses points forts</strong> (sterke punten), <strong>gérer ses points faibles avec honnêteté et positivité</strong>, puis <strong>poser des questions pertinentes</strong> (doorgroeimogelijkheden, volgende stap).</p>`
  }
};
</script>

  items: [
  { id: "nl-b1-j13", title: "Réponds à un entretien d'embauche", level: 3,

    hints: [
      "Commence par te présenter : « Mijn naam is... en ik heb ... jaar werkervaring in... ».",
      "Utilise « Ik solliciteer naar deze functie omdat... » pour ta motivation.",
      "Pour le point faible, reste positif : « ..., maar ik werk eraan »."
    ],
    solution: "Goedemorgen. Mijn naam is Youssef en ik heb vier jaar werkervaring in de klantenservice. Ik solliciteer naar deze functie omdat ik een nieuwe uitdaging zoek en het bedrijf me erg aanspreekt. Mijn sterke punt is mijn doorzettingsvermogen: ik geef niet snel op en ik werk goed onder druk. Ik ben ook communicatief en ik werk graag in team. Een zwak punt is dat ik soms te perfectionistisch ben, maar ik werk eraan om beter te delegeren. Ik ben gemotiveerd en leergierig, en ik wil mezelf verder ontwikkelen. Deze functie past goed bij mijn profiel en mijn ambities. Heeft u nog een vraag? Ja, ik heb er ook een: zijn er doorgroeimogelijkheden binnen het bedrijf?\n\nTraduction : Bonjour. Je m'appelle Youssef et j'ai quatre ans d'expérience dans le service clientèle. Je postule à ce poste parce que je cherche un nouveau défi et que l'entreprise m'attire beaucoup. Mon point fort est ma persévérance : je n'abandonne pas facilement et je travaille bien sous pression. Je suis aussi communicatif et j'aime travailler en équipe. Un point faible est que je suis parfois trop perfectionniste, mais j'y travaille pour mieux déléguer. Je suis motivé et avide d'apprendre, et je veux continuer à me développer. Ce poste correspond bien à mon profil et à mes ambitions. Avez-vous une question ? Oui, j'en ai une aussi : y a-t-il des possibilités d'évolution dans l'entreprise ?",
    note: "Utilise le vouvoiement (u) et un ton professionnel. Structure : présentation, motivation, point fort, point faible positif, question finale." }
  ]
};
</script>
