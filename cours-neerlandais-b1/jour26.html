<script>
var DAY = {
  num: 26,
  title: "But, cause, conséquence",
  subtitle: "Exprimer le pourquoi (cause), le pour quoi (but) et le donc (conséquence).",
  theory: `
<h3>1. La cause — de oorzaak</h3>
<p>Pour dire POURQUOI (la raison), on emploie surtout <strong>omdat</strong> (parce que, subordonnant : verbe à la fin) et <strong>want</strong> (car, coordonnant : ordre normal).</p>
<pre class="pseudo">Ik blijf thuis omdat ik ziek ben.   Je reste chez moi parce que je suis malade. (verbe à la fin)
Ik blijf thuis, want ik ben ziek.   Je reste chez moi, car je suis malade. (ordre normal)</pre>
<div class="warn">Différence clé : après <strong>omdat</strong>, le verbe part à la fin (« ... omdat ik ziek <strong>ben</strong> »). Après <strong>want</strong>, l'ordre reste normal (« ... want ik <strong>ben</strong> ziek »). Même sens, construction différente.</p></div>
<h3>2. Le but — het doel</h3>
<p>Pour dire DANS QUEL BUT (l'objectif), on utilise <strong>om ... te</strong> + infinitif (pour + infinitif, même sujet) ou <strong>zodat</strong> (pour que, sujets différents) :</p>
<pre class="pseudo">Ik spaar om een auto te kopen.        J'économise pour acheter une voiture.
Ik leg het uit, zodat je het snapt.   Je l'explique pour que tu comprennes.</pre>
<div class="tip">Choisis selon le sujet : si c'est la MÊME personne qui agit et qui vise le but → <strong>om ... te</strong> + infinitif. Si le but concerne QUELQU'UN D'AUTRE → <strong>zodat</strong> + phrase complète. « Ik werk hard om te slagen » (moi) vs « Ik help je zodat jij slaagt » (toi).</p></div>
<h3>3. La conséquence — het gevolg</h3>
<p>Pour dire DONC (le résultat), on emploie <strong>dus</strong> (donc), <strong>daarom</strong> (c'est pourquoi) ou <strong>zodat</strong> (de sorte que). <strong>daarom</strong> et <strong>dus</strong> en tête de phrase provoquent l'inversion :</p>
<pre class="pseudo">Het regent, dus ik neem een paraplu.     Il pleut, donc je prends un parapluie.
Het regent. Daarom neem ik een paraplu.  Il pleut. C'est pourquoi je prends un parapluie.</pre>
<h3>4. Tableau récapitulatif</h3>
<pre class="pseudo">CAUSE        omdat (+ verbe fin)   want (+ ordre normal)
BUT          om ... te (+ inf.)    zodat (+ phrase)
CONSÉQUENCE  dus                   daarom (+ inversion)</pre>
<p><strong>Ik heb hard gestudeerd, dus ik ben geslaagd, en daarom ben ik heel blij.</strong> = J'ai étudié dur, donc j'ai réussi, et c'est pourquoi je suis très content.</p>`,
  exercises: [
    { type: "qcm", q: "Quel mot exprime la CAUSE avec le verbe à la fin ?", opts: ["want", "omdat", "dus", "om ... te"], a: 1, exp: "omdat = parce que, subordonnant (verbe à la fin)." },
    { type: "input", q: "Complète (verbe à la fin) : « Ik blijf thuis omdat ik ziek ___. » (être → je suis)", a: ["ben"], ph: "un verbe", exp: "Après omdat, le verbe « ben » va à la fin." },
    { type: "qcm", q: "Après « want », l'ordre des mots est…", opts: ["verbe à la fin", "normal (comme une principale)", "inversé", "sans verbe"], a: 1, exp: "want est coordonnant : ordre normal." },
    { type: "qcm", q: "Pour exprimer un BUT avec le MÊME sujet, on utilise…", opts: ["omdat", "want", "om ... te + infinitif", "dus"], a: 2, exp: "om ... te + infinitif = pour + infinitif (même sujet)." },
    { type: "input", q: "Complète : « Ik spaar ___ een auto ___ kopen. » (om ... te)", a: ["om"], ph: "premier mot", exp: "om een auto te kopen = pour acheter une voiture." },
    { type: "vf", q: "« zodat » s'emploie quand le but concerne un autre sujet (pour que tu / il ...).", a: true, exp: "zodat + phrase complète, sujets différents." },
    { type: "qcm", q: "Quel mot exprime la CONSÉQUENCE (« donc ») ?", opts: ["omdat", "om", "dus", "hoewel"], a: 2, exp: "dus = donc (conséquence)." },
    { type: "input", q: "Complète (inversion) : « Het regent. Daarom ___ ik een paraplu. » (prendre → je prends)", a: ["neem"], ph: "un verbe", exp: "Après « daarom » en tête, inversion : neem ik." },
    { type: "qcm", q: "« Ik werk hard om te slagen » : le but concerne…", opts: ["quelqu'un d'autre", "la même personne (je travaille / je réussis)", "personne", "un groupe"], a: 1, exp: "Même sujet → om ... te + infinitif." },
    { type: "vf", q: "« omdat » et « want » ont le même sens mais une construction différente.", a: true, exp: "Les deux = parce que/car ; omdat rejette le verbe, want non." },
    { type: "input", q: "Complète : « Ik help je ___ jij slaagt. » (pour que, autre sujet)", a: ["zodat"], ph: "un mot", exp: "zodat + phrase (sujet différent : jij)." },
    { type: "qcm", q: "Dans « Het regent, dus ik neem een paraplu », que fait « dus » ?", opts: ["introduit une cause", "introduit une conséquence (donc)", "introduit un but", "introduit une concession"], a: 1, exp: "dus = donc, marque le résultat." },
    { type: "qcm", q: "Compréhension : « Ik ben te laat omdat de bus niet kwam. » Pourquoi la personne est-elle en retard ?", opts: ["elle a dormi", "le bus n'est pas venu", "il pleuvait", "elle s'est trompée d'heure"], a: 1, exp: "omdat de bus niet kwam = parce que le bus n'est pas venu." },
    { type: "vf", q: "Compréhension : « Ik zet mijn wekker, zodat ik op tijd wakker word. » exprime un but.", a: true, exp: "zodat ik op tijd wakker word = pour me réveiller à temps (but)." },
    { type: "qcm", q: "Compréhension : « Het was koud, daarom bleef ik binnen. » Quelle est la conséquence ?", opts: ["il faisait froid", "je suis resté à l'intérieur", "je suis sorti", "j'ai eu chaud"], a: 1, exp: "daarom bleef ik binnen = c'est pourquoi je suis resté dedans." }
  ],
  final: {
    title: "Exercice final — Pourquoi, pour quoi, donc",
    intro: `<p>Lis ce texte et distingue cause, but et conséquence, puis réponds :</p>
<pre class="pseudo">Sara wil verpleegkundige worden. Daarom volgt ze nu een opleiding.
Ze studeert elke avond hard, omdat de examens moeilijk zijn.
Ze maakt veel oefeningen, zodat ze goed voorbereid is.
Overdag werkt ze in een winkel om haar studie te betalen.
Volgend jaar is ze klaar, dus dan kan ze in een ziekenhuis werken.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi Sara suit-elle une formation (conséquence de son souhait) ?", opts: ["par hasard", "parce qu'elle veut devenir infirmière (daarom)", "pour voyager", "sans raison"], a: 1, exp: "Ze wil verpleegkundige worden. Daarom volgt ze een opleiding." },
      { type: "input", q: "Complète la CAUSE : « Ze studeert hard, ___ de examens moeilijk zijn. » (parce que)", a: ["omdat"], ph: "un mot", exp: "omdat de examens moeilijk zijn = parce que les examens sont difficiles." },
      { type: "qcm", q: "Dans quel BUT fait-elle beaucoup d'exercices ?", opts: ["pour se détendre", "pour être bien préparée (zodat)", "parce qu'elle s'ennuie", "pour aider une amie"], a: 1, exp: "zodat ze goed voorbereid is = pour être bien préparée." },
      { type: "input", q: "Complète le BUT (même sujet) : « Ze werkt in een winkel ___ haar studie te betalen. »", a: ["om"], ph: "un mot", exp: "om haar studie te betalen = pour payer ses études." },
      { type: "qcm", q: "Quelle est la CONSÉQUENCE l'an prochain ?", opts: ["elle arrête tout", "elle pourra travailler dans un hôpital (dus)", "elle recommence", "elle voyage"], a: 1, exp: "Volgend jaar is ze klaar, dus dan kan ze in een ziekenhuis werken." }
    ],
    solution: `<p>Traduction : « Sara veut devenir infirmière. C'est pourquoi elle suit maintenant une formation. Elle étudie dur chaque soir, parce que les examens sont difficiles. Elle fait beaucoup d'exercices, pour être bien préparée. La journée elle travaille dans un magasin pour payer ses études. L'an prochain elle aura fini, donc elle pourra alors travailler dans un hôpital. »</p>
<p>Repère les trois relations : <strong>cause</strong> (omdat), <strong>but</strong> (om ... te et zodat), <strong>conséquence</strong> (daarom, dus). Rappelle-toi que <strong>omdat</strong> et <strong>zodat</strong> rejettent le verbe à la fin, tandis que <strong>daarom</strong> et <strong>dus</strong> en tête entraînent l'inversion.</p>`
  }
};
</script>
