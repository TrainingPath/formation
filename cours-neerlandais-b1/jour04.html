var DAY = {

  title: "Le discours indirect",
  subtitle: "Rapporter ce que quelqu'un a dit avec « dat » et le verbe à la fin.",
  theory: `
<h3>1. Discours direct et discours indirect</h3>
<p>Le discours <strong>direct</strong> cite les mots exacts : <strong>Hij zegt : « Ik ben moe. »</strong> (Il dit : « Je suis fatigué. »). Le discours <strong>indirect</strong> rapporte le contenu sans guillemets, à l'aide de la conjonction <strong>dat</strong> (que) : <strong>Hij zegt dat hij moe is.</strong> (Il dit qu'il est fatigué.)</p>
<h3>2. La règle-clé : dat + verbe à la fin</h3>
<p><strong>dat</strong> introduit une subordonnée : le verbe conjugué part <strong>à la fin</strong>, exactement comme après die/dat ou toen.</p>
<pre class="pseudo">Direct :   Zij zegt : « Ik werk in Brussel. »
Indirect : Zij zegt dat zij in Brussel werkt.   (werkt à la fin)
Direct :   Hij zegt : « Ik heb geen tijd. »
Indirect : Hij zegt dat hij geen tijd heeft.     (heeft à la fin)</pre>
<h3>3. L'adaptation des pronoms</h3>
<p>Comme en français, il faut adapter les pronoms et possessifs au nouveau point de vue :</p>
<pre class="pseudo">« Ik ben ziek »        →  Hij zegt dat hij ziek is.
« Wij komen morgen »   →  Ze zeggen dat ze morgen komen.
« Ik heb mijn boek »   →  Hij zegt dat hij zijn boek heeft.</pre>
<h3>4. Verbes introducteurs fréquents</h3>
<pre class="pseudo">zeggen dat...       dire que...
denken dat...       penser que...
vertellen dat...    raconter que...
weten dat...        savoir que...
hopen dat...        espérer que...
vinden dat...       trouver / estimer que...</pre>
<p><strong>Ik denk dat het morgen gaat regenen.</strong> = Je pense qu'il va pleuvoir demain. · <strong>Ze vertelt dat ze een nieuwe baan heeft.</strong> = Elle raconte qu'elle a un nouveau travail.</p>
<div class="tip">Au passé, le néerlandais est plus souple que le français : pas de « concordance des temps » stricte. On peut garder le temps d'origine : <strong>Hij zei dat hij moe was.</strong> (Il a dit qu'il était fatigué.)</div>
<h3>5. Petit texte de compréhension</h3>
<pre class="pseudo">Mijn collega vertelt dat ze volgende maand verhuist.
Ze zegt dat haar nieuwe huis dichter bij het werk ligt.
Ze denkt dat ze veel tijd zal besparen.
Ik hoop dat alles goed gaat met de verhuizing.
Ze vindt dat ik ook eens moet verhuizen.</pre>
<p>Traduction : Ma collègue raconte qu'elle déménage le mois prochain. Elle dit que sa nouvelle maison est plus près du travail. Elle pense qu'elle va gagner beaucoup de temps. J'espère que tout se passera bien avec le déménagement. Elle trouve que je devrais moi aussi déménager un jour.</p>
<div class="warn">L'erreur la plus fréquente : oublier de rejeter le verbe à la fin après « dat ». On dit « Hij zegt dat hij moe <strong>is</strong> », jamais « Hij zegt dat hij is moe ».</div>`,
  exercises: [
    { type: "qcm", q: "Quelle conjonction introduit le discours indirect ?", opts: ["die", "dat", "wat", "als"], a: 1, exp: "dat = que, introduit la subordonnée rapportée." },
    { type: "input", q: "Transforme : « Ik ben moe » → « Hij zegt dat hij moe ___. »", a: ["is"], ph: "verbe", exp: "Le verbe is est rejeté à la fin après dat." },
    { type: "qcm", q: "Où va le verbe conjugué après « dat » ?", opts: ["en 1re position", "en 2e position", "à la fin", "juste après dat"], a: 2, exp: "dat introduit une subordonnée → verbe à la fin." },
    { type: "input", q: "Complète : « Zij zegt dat zij in Brussel ___. » (werken)", a: ["werkt"], ph: "verbe", exp: "werkt, rejeté à la fin de la subordonnée." },
    { type: "vf", q: "En discours indirect, il faut adapter les pronoms au nouveau point de vue.", a: true, exp: "« Ik ben ziek » → « Hij zegt dat hij ziek is »." },
    { type: "qcm", q: "« Wij komen morgen » devient…", opts: ["Ze zeggen dat ze morgen komen", "Ze zeggen dat wij komen morgen", "Ze zeggen wij komen morgen", "Ze zeggen dat komen ze morgen"], a: 0, exp: "Pronom adapté (ze) et komen à la fin." },
    { type: "input", q: "Complète le verbe introducteur « penser » : « Ik ___ dat het gaat regenen. »", a: ["denk"], ph: "verbe", exp: "denken dat = penser que ; ik denk." },
    { type: "qcm", q: "« Hij heeft geen tijd » en discours indirect donne…", opts: ["Hij zegt dat hij heeft geen tijd", "Hij zegt dat hij geen tijd heeft", "Hij zegt hij geen tijd heeft", "Hij zegt dat geen tijd heeft hij"], a: 1, exp: "heeft rejeté à la fin : dat hij geen tijd heeft." },
    { type: "vf", q: "En néerlandais, la concordance des temps au passé est aussi stricte qu'en français.", a: false, exp: "Faux : le néerlandais est plus souple ; on peut garder le temps d'origine (zei dat hij moe was)." },
    { type: "input", q: "Complète : « Ze vertelt dat ze een nieuwe baan ___. » (hebben)", a: ["heeft"], ph: "verbe", exp: "heeft à la fin : dat ze een nieuwe baan heeft." },
    { type: "qcm", q: "Quel verbe signifie « raconter que » ?", opts: ["hopen dat", "vertellen dat", "vinden dat", "weten dat"], a: 1, exp: "vertellen dat = raconter que." },
    { type: "input", q: "Transforme : « Ik heb mijn boek » → « Hij zegt dat hij ___ boek heeft. » (possessif adapté)", a: ["zijn"], ph: "possessif", exp: "mijn → zijn (son) au nouveau point de vue." },
    { type: "qcm", q: "Compréhension : « Mijn collega vertelt dat ze volgende maand verhuist. » Quand déménage-t-elle ?", opts: ["cette semaine", "le mois prochain", "l'an prochain", "jamais"], a: 1, exp: "volgende maand = le mois prochain." },
    { type: "vf", q: "Compréhension : « Ze zegt dat haar nieuwe huis dichter bij het werk ligt. » Sa nouvelle maison est plus loin du travail.", a: false, exp: "dichter bij = plus près, donc c'est faux." },
    { type: "qcm", q: "Compréhension : « Ze vindt dat ik ook eens moet verhuizen. » Que pense-t-elle ?", opts: ["que je dois rester", "que je devrais moi aussi déménager", "que je déménage trop", "que le déménagement est cher"], a: 1, exp: "Ze vindt dat ik ook moet verhuizen." }
  ],
  final: {
    title: "Exercice final — Wat zei iedereen?",
    intro: `<p>Lis ces propos rapportés puis réponds :</p>
<pre class="pseudo">Op de vergadering vertelde de baas dat het bedrijf goed draait.
Hij zei dat we volgend jaar meer personeel gaan aannemen.
Mijn collega denkt dat het project op tijd klaar zal zijn.
Ik hoop dat we allemaal een bonus krijgen.
De directeur vindt dat we harder moeten werken, maar iedereen weet dat het team al veel doet.</pre>`,
    questions: [
      { type: "qcm", q: "Que raconte le patron sur l'entreprise ?", opts: ["qu'elle ferme", "qu'elle marche bien", "qu'elle déménage", "qu'elle vend"], a: 1, exp: "dat het bedrijf goed draait = que l'entreprise marche bien." },
      { type: "input", q: "Complète : « Hij zei dat we meer personeel gaan ___. » (aannemen)", a: ["aannemen"], ph: "verbe", exp: "gaan aannemen rejeté à la fin : embaucher plus de personnel." },
      { type: "vf", q: "Le collègue pense que le projet sera terminé à temps.", a: true, exp: "denkt dat het project op tijd klaar zal zijn." },
      { type: "qcm", q: "Que trouve le directeur ?", opts: ["qu'on travaille assez", "qu'on doit travailler plus dur", "qu'on doit se reposer", "qu'on doit partir"], a: 1, exp: "De directeur vindt dat we harder moeten werken." },
      { type: "input", q: "Complète le verbe introducteur : « Ik ___ dat we een bonus krijgen. » (espérer)", a: ["hoop"], ph: "verbe", exp: "hopen dat = espérer que ; ik hoop." }
    ],
    solution: `<p>Traduction : « À la réunion, le patron a raconté que l'entreprise marche bien. Il a dit que l'an prochain nous allons embaucher plus de personnel. Mon collègue pense que le projet sera terminé à temps. J'espère que nous aurons tous une prime. Le directeur trouve que nous devons travailler plus dur, mais tout le monde sait que l'équipe fait déjà beaucoup. »</p>
<p>À chaque fois : verbe introducteur + <strong>dat</strong> + subordonnée avec le verbe conjugué à la fin (draait, aannemen, zal zijn, krijgen, moeten werken, doet).</p>`
  }
};
