<script>
var DAY = {
  num: 21,
  title: "Compréhension : un article de presse",
  subtitle: "Lire et comprendre un vrai article de journal néerlandais.",
  theory: `
<h3>1. Avant de lire</h3>
<p>Un article de presse (een krantenartikel) suit une structure : un <strong>titre</strong> (de kop), parfois un sous-titre, puis les faits, du plus important au moins important. Ne cherche pas à comprendre chaque mot : repère d'abord <strong>qui, quoi, où, quand, pourquoi</strong> (wie, wat, waar, wanneer, waarom).</p>
<div class="tip">Stratégie de lecture : lis d'abord le titre et la première phrase, ils résument l'essentiel. Puis lis l'article en entier une fois sans t'arrêter, et enfin relis pour les détails. Devine le sens des mots inconnus grâce au contexte.</p></div>
<h3>2. L'article</h3>
<pre class="pseudo">Meer mensen nemen de fiets naar het werk

Uit een nieuw onderzoek blijkt dat steeds meer Nederlanders met de fiets
naar hun werk gaan. Vorig jaar fietste veertig procent van de werknemers
minstens één keer per week naar kantoor. Dat is tien procent meer dan
vijf jaar geleden.

Volgens de onderzoekers zijn er verschillende redenen. Ten eerste willen
mensen gezonder leven en meer bewegen. Ten tweede is de fiets vaak sneller
dan de auto in de drukke stad. Bovendien is fietsen goedkoper en beter
voor het milieu.

De gemeente Utrecht is blij met dit nieuws. De stad heeft de afgelopen jaren
veel nieuwe fietspaden aangelegd. Een woordvoerder zegt: « We willen dat
fietsen veilig en aangenaam is voor iedereen. » Toch is er ook kritiek.
Sommige mensen vinden dat er te weinig plaats is om de fiets te parkeren.

De onderzoekers verwachten dat het aantal fietsers de komende jaren verder
zal stijgen, vooral in de grote steden.</pre>
<h3>3. Vocabulaire de l'article</h3>
<pre class="pseudo">het onderzoek     l'étude/enquête   blijkt uit        il ressort de
de werknemer      l'employé         de reden          la raison
bewegen           bouger            het milieu        l'environnement
de gemeente       la commune        het fietspad      la piste cyclable
aanleggen         aménager          de woordvoerder   le porte-parole
de kritiek        la critique       stijgen           augmenter</pre>
<div class="warn">Attention aux connecteurs qui organisent l'argumentation : <strong>ten eerste</strong> (premièrement), <strong>ten tweede</strong> (deuxièmement), <strong>bovendien</strong> (de plus), <strong>toch</strong> (pourtant). Les repérer aide à suivre le fil des idées.</p></div>`,
  exercises: [
    { type: "qcm", q: "De quoi parle l'article ?", opts: ["de la voiture électrique", "du fait que plus de gens vont travailler à vélo", "des transports en commun", "du prix de l'essence"], a: 1, exp: "Meer mensen nemen de fiets naar het werk." },
    { type: "input", q: "Quel pourcentage d'employés a fait du vélo au travail l'an dernier au moins une fois par semaine ? ___ procent", a: ["veertig", "40"], ph: "un nombre", exp: "veertig procent = quarante pour cent." },
    { type: "qcm", q: "De combien ce chiffre a-t-il augmenté en cinq ans ?", opts: ["cinq pour cent", "dix pour cent", "vingt pour cent", "quarante pour cent"], a: 1, exp: "tien procent meer dan vijf jaar geleden." },
    { type: "qcm", q: "Quelle est la PREMIÈRE raison citée (ten eerste) ?", opts: ["le vélo est plus rapide", "vivre plus sainement et bouger plus", "c'est moins cher", "c'est bon pour l'environnement"], a: 1, exp: "Ten eerste willen mensen gezonder leven en meer bewegen." },
    { type: "input", q: "Complète : « Bovendien is fietsen goedkoper en beter voor het ___. » (environnement)", a: ["milieu"], ph: "un mot", exp: "het milieu = l'environnement." },
    { type: "vf", q: "Selon l'article, le vélo est souvent plus rapide que la voiture dans la ville animée.", a: true, exp: "de fiets vaak sneller dan de auto in de drukke stad." },
    { type: "qcm", q: "Quelle ville est contente de cette nouvelle ?", opts: ["Amsterdam", "Rotterdam", "Utrecht", "Den Haag"], a: 2, exp: "De gemeente Utrecht is blij met dit nieuws." },
    { type: "input", q: "Qu'a aménagé la ville ces dernières années ? veel nieuwe ___", a: ["fietspaden"], ph: "un mot", exp: "veel nieuwe fietspaden aangelegd = de nombreuses pistes cyclables." },
    { type: "qcm", q: "Que veut la ville selon le porte-parole ?", opts: ["que le vélo soit gratuit", "que le vélo soit sûr et agréable pour tous", "interdire les voitures", "construire un métro"], a: 1, exp: "We willen dat fietsen veilig en aangenaam is voor iedereen." },
    { type: "vf", q: "Il n'y a aucune critique dans l'article.", a: false, exp: "Toch is er ook kritiek : certains trouvent qu'il manque de places de parking pour vélos." },
    { type: "qcm", q: "Quelle est la critique mentionnée ?", opts: ["le vélo est dangereux", "il y a trop peu de places pour garer le vélo", "les pistes sont trop chères", "les vélos sont trop lourds"], a: 1, exp: "te weinig plaats om de fiets te parkeren." },
    { type: "input", q: "Que signifie « het onderzoek » ? ___", a: ["l'étude", "l'enquête", "étude", "enquête", "l etude", "l enquete"], ph: "en français", exp: "het onderzoek = l'étude / l'enquête." },
    { type: "qcm", q: "Que prévoient les chercheurs pour les prochaines années ?", opts: ["une baisse du nombre de cyclistes", "une hausse du nombre de cyclistes", "aucun changement", "l'interdiction du vélo"], a: 1, exp: "het aantal fietsers ... zal stijgen (va augmenter)." },
    { type: "qcm", q: "Le connecteur « ten tweede » signifie…", opts: ["pourtant", "premièrement", "deuxièmement", "de plus"], a: 2, exp: "ten tweede = deuxièmement." },
    { type: "vf", q: "« de werknemer » veut dire « l'employé ».", a: true, exp: "de werknemer = l'employé (celui qui travaille)." }
  ],
  final: {
    title: "Exercice final — Synthèse de l'article",
    intro: `<p>Relis mentalement l'article sur le vélo, puis réponds à ces questions de synthèse :</p>
<pre class="pseudo">Titre : Meer mensen nemen de fiets naar het werk
Idée : een onderzoek toont dat steeds meer mensen fietsen naar het werk,
om drie redenen, en de steden reageren met nieuwe fietspaden.</pre>`,
    questions: [
      { type: "qcm", q: "En une phrase, quel est le message principal ?", opts: ["Le vélo devient dangereux", "De plus en plus de gens vont au travail à vélo", "Les voitures sont interdites en ville", "Le train remplace le vélo"], a: 1, exp: "C'est l'idée centrale annoncée dès le titre." },
      { type: "input", q: "Cite un connecteur d'énumération utilisé pour la deuxième raison : ten ___", a: ["tweede"], ph: "un mot", exp: "ten eerste, ten tweede : premièrement, deuxièmement." },
      { type: "qcm", q: "Combien de raisons principales l'article donne-t-il ?", opts: ["une", "deux", "trois", "cinq"], a: 2, exp: "santé/mouvement, rapidité, coût+environnement : trois arguments." },
      { type: "qcm", q: "Comment la ville d'Utrecht réagit-elle concrètement ?", opts: ["elle interdit les voitures", "elle aménage de nouvelles pistes cyclables", "elle baisse les impôts", "elle achète des vélos"], a: 1, exp: "veel nieuwe fietspaden aangelegd." },
      { type: "input", q: "Que va faire le nombre de cyclistes dans les prochaines années ? Il va ___ (augmenter)", a: ["stijgen", "augmenter"], ph: "un verbe", exp: "het aantal fietsers zal stijgen = augmentera." }
    ],
    solution: `<p>Résumé : L'article rapporte les résultats d'une étude (<strong>een onderzoek</strong>) : de plus en plus de Néerlandais vont travailler à vélo (40 % au moins une fois par semaine, soit 10 % de plus qu'il y a cinq ans). Trois raisons : vivre plus sainement, le vélo est plus rapide en ville, et il est moins cher et meilleur pour l'environnement. La ville d'Utrecht réagit en aménageant des pistes cyclables (<strong>fietspaden</strong>), même si certains critiquent le manque de places de stationnement. Les chercheurs s'attendent à une hausse continue.</p>
<p>Méthode : pour comprendre un article, repère le titre, les connecteurs d'énumération (<strong>ten eerste, ten tweede, bovendien</strong>) et les mots-clés. Tu n'as pas besoin de comprendre chaque mot pour saisir l'essentiel.</p>`
  }
