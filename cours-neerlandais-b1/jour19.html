  title: "Les connecteurs avancés (hoewel, terwijl, zodat)",
  subtitle: "Relier ses idées avec des subordonnants qui rejettent le verbe à la fin.",
  theory: `
<h3>1. Rappel : le verbe part à la fin</h3>
<p>Les connecteurs d'aujourd'hui sont des <strong>conjonctions de subordination</strong> (onderschikkende voegwoorden). Après eux, le verbe conjugué va à la <strong>toute fin</strong> de la subordonnée, comme avec « dat » ou « omdat ».</p>
<pre class="pseudo">Ik blijf thuis omdat het regent.   Je reste chez moi parce qu'il pleut.
                     (verbe « regent » à la fin)</pre>
<h3>2. hoewel — bien que / quoique</h3>
<p><strong>hoewel</strong> exprime la concession (une opposition, un obstacle qui n'empêche pas) :</p>
<pre class="pseudo">Hoewel het regent, ga ik wandelen.   Bien qu'il pleuve, je vais me promener.
Ik ga wandelen, hoewel het regent.   Je vais me promener bien qu'il pleuve.</pre>
<div class="tip">Quand la subordonnée avec <strong>hoewel</strong> est en tête, la principale commence par le verbe (inversion) : « Hoewel het regent, <strong>ga</strong> ik wandelen. » On peut aussi employer <strong>ondanks</strong> (malgré) + nom : « Ondanks de regen ga ik wandelen. »</p></div>
<h3>3. terwijl — pendant que / alors que</h3>
<p><strong>terwijl</strong> a deux sens : la simultanéité (pendant que) et l'opposition (alors que) :</p>
<pre class="pseudo">Ik kook terwijl hij de tafel dekt.    Je cuisine pendant qu'il met la table.
Hij slaapt, terwijl ik hard werk.     Il dort, alors que je travaille dur.</pre>
<h3>4. zodat — de sorte que / pour que</h3>
<p><strong>zodat</strong> introduit la conséquence ou le but atteint. Ne pas confondre avec <strong>zodra</strong> (dès que) :</p>
<pre class="pseudo">Ik leg het uit, zodat je het begrijpt.  Je l'explique, pour que tu comprennes.
Zet je telefoon uit, zodat je goed slaapt.  Éteins ton téléphone, pour bien dormir.
Zodra ik klaar ben, bel ik je.           Dès que j'ai fini, je t'appelle.</pre>
<div class="warn">Distingue bien : <strong>zodat</strong> = pour que / de sorte que (conséquence, but) ; <strong>zodra</strong> = dès que (temps). Une seule lettre change tout ! Et n'oublie jamais le verbe conjugué à la fin de la subordonnée : « ..., zodat je het <strong>begrijpt</strong>. »</p></div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « hoewel » ?", opts: ["dès que", "bien que", "pour que", "pendant que"], a: 1, exp: "hoewel = bien que / quoique (concession)." },
    { type: "input", q: "Complète (verbe à la fin) : « Hoewel het ___, ga ik wandelen. » (pleuvoir → il pleut)", a: ["regent"], ph: "un verbe", exp: "Après hoewel, le verbe « regent » va à la fin de la subordonnée." },
    { type: "qcm", q: "« terwijl » peut signifier…", opts: ["seulement « bien que »", "« pendant que » ou « alors que »", "« dès que »", "« parce que »"], a: 1, exp: "terwijl = pendant que (simultanéité) ou alors que (opposition)." },
    { type: "qcm", q: "Quelle est la différence entre « zodat » et « zodra » ?", opts: ["aucune", "zodat = pour que ; zodra = dès que", "zodat = dès que ; zodra = pour que", "les deux veulent dire « pendant que »"], a: 1, exp: "zodat = conséquence/but ; zodra = temps." },
    { type: "input", q: "Complète : « Ik leg het uit, ___ je het begrijpt. » (pour que)", a: ["zodat"], ph: "un mot", exp: "zodat = pour que / de sorte que." },
    { type: "vf", q: "Après « terwijl », le verbe conjugué va à la fin de la subordonnée.", a: true, exp: "terwijl est un subordonnant : verbe à la fin." },
    { type: "qcm", q: "« Hij slaapt, terwijl ik hard werk » exprime plutôt…", opts: ["une conséquence", "une opposition (alors que)", "un but", "une cause"], a: 1, exp: "Ici terwijl = alors que (contraste)." },
    { type: "input", q: "Complète : « ___ ik klaar ben, bel ik je. » (dès que)", a: ["zodra"], ph: "un mot", exp: "zodra = dès que (temps)." },
    { type: "qcm", q: "Dans « Hoewel het regent, ga ik wandelen », pourquoi « ga » précède « ik » ?", opts: ["erreur", "parce que la subordonnée en tête entraîne l'inversion dans la principale", "parce que hoewel exige le pluriel", "par hasard"], a: 1, exp: "Subordonnée en 1re position → verbe de la principale en 2e position." },
    { type: "vf", q: "« Ondanks » (malgré) se construit avec un nom, pas avec une phrase complète.", a: true, exp: "Ondanks de regen (+ nom) ; hoewel het regent (+ phrase)." },
    { type: "input", q: "Complète (simultanéité) : « Ik kook ___ hij de tafel dekt. » (pendant que)", a: ["terwijl"], ph: "un mot", exp: "terwijl = pendant que." },
    { type: "qcm", q: "« Zet je telefoon uit, zodat je goed slaapt » exprime…", opts: ["une cause", "un but / une conséquence voulue", "une concession", "une condition"], a: 1, exp: "zodat = pour que / de sorte que (but atteint)." },
    { type: "qcm", q: "Compréhension : « Hoewel hij moe was, ging hij toch werken. » Que fait-il malgré la fatigue ?", opts: ["il reste au lit", "il va quand même travailler", "il part en vacances", "il appelle le médecin"], a: 1, exp: "hoewel moe → ging toch werken = va quand même travailler." },
    { type: "vf", q: "Compréhension : « Ik spreek langzaam, zodat iedereen mij begrijpt. » Le but est que tout le monde comprenne.", a: true, exp: "zodat iedereen mij begrijpt = pour que tout le monde comprenne." },
    { type: "qcm", q: "Compréhension : « Zij belde me terwijl ik in de vergadering zat. » Quand a-t-elle appelé ?", opts: ["après la réunion", "pendant que la personne était en réunion", "avant la réunion", "elle n'a pas appelé"], a: 1, exp: "terwijl ik in de vergadering zat = pendant que j'étais en réunion." }
  ],
  final: {
    title: "Exercice final — Connecteurs dans un texte",
    intro: `<p>Lis ce texte et repère les connecteurs, puis réponds :</p>
<pre class="pseudo">Lisa werkt sinds twee jaar in een ziekenhuis. Hoewel het werk zwaar is,
vindt zij het heel dankbaar. Ze werkt vaak 's nachts, terwijl haar vrienden slapen.
Elke ochtend schrijft ze alles op, zodat haar collega's goed geïnformeerd zijn.
Zodra haar dienst klaar is, gaat ze meteen naar huis om te rusten.
Ze wil later een opleiding volgen, hoewel ze weinig vrije tijd heeft.</pre>`,
    questions: [

      { type: "input", q: "Complète : « Ze werkt vaak 's nachts, ___ haar vrienden slapen. » (alors que)", a: ["terwijl"], ph: "un mot", exp: "terwijl = pendant que / alors que." },
      { type: "qcm", q: "Pourquoi écrit-elle tout chaque matin ?", opts: ["par obligation légale", "pour que ses collègues soient bien informés", "pour se souvenir de ses rêves", "pour son journal intime"], a: 1, exp: "zodat haar collega's goed geïnformeerd zijn = pour que ses collègues soient informés." },
      { type: "input", q: "Complète : « ___ haar dienst klaar is, gaat ze naar huis. » (dès que)", a: ["zodra"], ph: "un mot", exp: "zodra = dès que (temps)." },
      { type: "qcm", q: "Que veut-elle faire plus tard, malgré son peu de temps libre ?", opts: ["déménager", "suivre une formation", "changer de pays", "arrêter de travailler"], a: 1, exp: "een opleiding volgen, hoewel ze weinig vrije tijd heeft." }
    ],
    solution: `<p>Traduction : « Lisa travaille depuis deux ans dans un hôpital. Bien que le travail soit dur, elle le trouve très gratifiant. Elle travaille souvent la nuit, alors que ses amis dorment. Chaque matin elle note tout, pour que ses collègues soient bien informés. Dès que son service est terminé, elle rentre aussitôt à la maison pour se reposer. Elle veut plus tard suivre une formation, bien qu'elle ait peu de temps libre. »</p>
<p>Repère les quatre connecteurs : <strong>hoewel</strong> (concession), <strong>terwijl</strong> (opposition/simultanéité), <strong>zodat</strong> (but), <strong>zodra</strong> (temps). Dans chaque subordonnée, le verbe conjugué se trouve à la fin.</p>`
  }
};
