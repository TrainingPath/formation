var DAY = {
  num: 4,
  title: "La notion de port",
  subtitle: "Un numéro pour dire QUEL logiciel doit recevoir les données.",
  theory: `
<h3>1. Le problème que le port résout</h3>
<p>L'adresse <strong>IP</strong> amène les données à la bonne <em>machine</em>. Mais une machine fait tourner beaucoup de logiciels en même temps : navigateur, client mail, jeu, mise à jour en arrière-plan. Quand un paquet arrive, il faut savoir <strong>lequel</strong> doit le recevoir. C'est le rôle du <strong>port</strong> : un numéro qui identifie précisément l'application (plus exactement le service) concernée.</p>
<p>Analogie : un grand immeuble. L'<strong>adresse IP</strong>, c'est le numéro de la rue et du bâtiment ; le <strong>port</strong>, c'est le numéro d'appartement. Le facteur trouve d'abord l'immeuble (IP), puis dépose le courrier dans la bonne boîte (port). Sans le numéro d'appartement, on saurait où est le bâtiment mais pas à qui remettre la lettre.</p>
<h3>2. Un numéro sur 16 bits : de 0 à 65535</h3>
<p>Un numéro de port est codé sur <strong>16 bits</strong>. Il peut donc aller de <strong>0 à 65535</strong> (soit 2 puissance 16 = 65536 valeurs possibles). C'est un chiffre à connaître par cœur : la plage totale des ports va de 0 à 65535. Chaque connexion utilise en réalité <em>deux</em> ports : un côté client et un côté serveur.</p>
<pre class="pseudo"># Plage complete des numeros de port
0  ---------------------------- 65535
# 16 bits  ->  2^16 = 65536 valeurs (de 0 a 65535)
# Cote serveur : un port fixe et connu (ex : 80 pour le web)
# Cote client  : un port choisi au hasard pour la duree de l'echange</pre>
<h3>3. Où se trouve le port ?</h3>
<p>Le numéro de port est inscrit dans l'<strong>en-tête de la couche transport</strong> (TCP ou UDP), pas dans l'en-tête IP. On y trouve un <strong>port source</strong> (celui de l'expéditeur) et un <strong>port destination</strong> (celui du destinataire). Grâce à eux, la machine réceptrice sait à quel logiciel remettre les données : c'est le démultiplexage vu au cours précédent.</p>
<div class="tip">Le port destination indique « à qui c'est adressé sur la machine d'arrivée ». Le port source indique « à qui répondre ». Les deux permettent un vrai dialogue aller-retour entre deux logiciels.</div>
<h3>4. Un même service, une écoute stable</h3>
<p>Un serveur écoute sur un port <strong>fixe et prévisible</strong> pour que les clients sachent où le joindre : par exemple, un serveur web écoute par convention sur le port 80. Le client, lui, utilise un port <strong>temporaire</strong> choisi automatiquement pour la durée de l'échange, puis libéré ensuite. On dit que le serveur « écoute sur un port », comme un standard téléphonique attaché à un numéro connu.</p>
<div class="warn">Deux services ne peuvent pas écouter en même temps sur le même port, avec le même protocole, sur la même adresse. Si tu tentes de le faire, tu obtiens une erreur du type « port déjà utilisé » (address already in use).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Port = numero qui identifie le LOGICIEL/service sur une machine
# IP = quelle machine   |   Port = quel logiciel sur cette machine
# Code sur 16 bits -> plage 0 a 65535 (65536 valeurs)
# Port ecrit dans l'en-tete TRANSPORT (TCP/UDP) : source + destination
# Serveur : port fixe et connu | Client : port temporaire au hasard</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un numéro de port ?", opts: ["À identifier la machine", "À identifier le logiciel (service) sur la machine", "À poser un câble", "À chiffrer les données"], a: 1, exp: "L'IP identifie la machine ; le port identifie le logiciel destinataire." },
    { type: "input", q: "Quelle est la valeur maximale d'un numéro de port ?", a: ["65535", "65 535"], ph: "un nombre", exp: "Les ports vont de 0 à 65535 (codés sur 16 bits)." },
    { type: "qcm", q: "Sur combien de bits un numéro de port est-il codé ?", opts: ["8 bits", "16 bits", "32 bits", "64 bits"], a: 1, exp: "16 bits, d'où 2^16 = 65536 valeurs (0 à 65535)." },
    { type: "vf", q: "Le numéro de port est inscrit dans l'en-tête de la couche transport (TCP ou UDP).", a: true, exp: "Oui : on y trouve le port source et le port destination." },
    { type: "qcm", q: "Dans l'analogie de l'immeuble, le port correspond à…", opts: ["Le numéro de rue", "Le numéro d'appartement", "La ville", "Le facteur"], a: 1, exp: "IP = l'immeuble ; port = l'appartement précis." },
    { type: "input", q: "Combien de valeurs différentes 16 bits permettent-ils au total (nombre) ?", a: ["65536", "65 536"], ph: "un nombre", exp: "2^16 = 65536 valeurs, numérotées de 0 à 65535." },
    { type: "qcm", q: "Quels deux ports figurent dans l'en-tête de transport ?", opts: ["Port haut et port bas", "Port source et port destination", "Port IP et port MAC", "Port entrant et port sortant uniquement"], a: 1, exp: "Le port source (pour répondre) et le port destination (à qui c'est adressé)." },
    { type: "vf", q: "Un client utilise généralement un port temporaire choisi automatiquement pour la durée de l'échange.", a: true, exp: "Oui : le serveur a un port fixe, le client un port éphémère." },
    { type: "qcm", q: "Que sait-on grâce au port destination ?", opts: ["Quelle machine viser", "À quel logiciel remettre les données à l'arrivée", "La longueur du câble", "La vitesse du réseau"], a: 1, exp: "Le port destination indique le logiciel à qui livrer sur la machine d'arrivée." },
    { type: "input", q: "Quelle est la plus petite valeur possible d'un port (nombre) ?", a: ["0", "zero"], ph: "un nombre", exp: "La plage commence à 0 et va jusqu'à 65535." },
    { type: "vf", q: "Deux services peuvent écouter en même temps sur le même port, même protocole et même adresse, sans problème.", a: false, exp: "Non : cela provoque une erreur « port déjà utilisé » (address already in use)." },
    { type: "qcm", q: "L'IP et le port, ensemble, répondent à quelles questions ?", opts: ["Quelle heure et quelle date", "Quelle machine et quel logiciel", "Quel câble et quelle prise", "Quelle couleur et quelle taille"], a: 1, exp: "IP = quelle machine, port = quel logiciel sur cette machine." },
    { type: "qcm", q: "Le port source sert surtout à…", opts: ["Chiffrer", "Savoir à qui renvoyer la réponse", "Choisir le câble", "Compter les octets"], a: 1, exp: "Le port source indique où renvoyer la réponse, pour un dialogue aller-retour." },
    { type: "input", q: "Comment appelle-t-on l'aiguillage des données vers le bon logiciel à l'arrivée, grâce au port (un mot) ?", a: ["demultiplexage", "démultiplexage", "le demultiplexage"], ph: "un mot", exp: "Le démultiplexage utilise le port destination pour livrer au bon service." },
    { type: "qcm", q: "Un serveur web écoute par convention sur quel port ?", opts: ["Le port 21", "Le port 80", "Le port 3306", "Le port 65535"], a: 1, exp: "Le port 80 est le port historique du web (HTTP)." }
  ],
  final: {

    intro: `<p>Un paquet arrive sur la machine de Nora à l'adresse 192.168.1.20. Plusieurs logiciels tournent. Voyons comment le système sait à qui le remettre.</p>`,
    questions: [

      { type: "input", q: "Quel numéro, dans l'en-tête de transport, désigne le logiciel destinataire ?", a: ["le port destination", "port destination", "le port de destination", "port"], ph: "un terme", exp: "Le port destination indique à quel logiciel livrer." },
      { type: "qcm", q: "Ce numéro de port peut valoir au maximum…", opts: ["255", "1024", "65535", "l'infini"], a: 2, exp: "Codé sur 16 bits, il va de 0 à 65535." },
      { type: "vf", q: "Le port se trouve dans l'en-tête IP, pas dans l'en-tête de transport.", a: false, exp: "Faux : le port est dans l'en-tête transport (TCP/UDP)." },
      { type: "qcm", q: "Pour que le serveur de Nora puisse répondre au bon interlocuteur, il regarde…", opts: ["Le port source du paquet reçu", "La couleur du câble", "Le port 0 uniquement", "Rien du tout"], a: 0, exp: "Le port source indique où renvoyer la réponse." }
    ],
    solution: `<pre class="pseudo"># Livraison finale sur la machine de Nora :
IP 192.168.1.20         -> trouve la bonne MACHINE
Port destination (ex 80)-> trouve le bon LOGICIEL (demultiplexage)
Port source             -> memorise pour renvoyer la reponse
# Rappel chiffre : port sur 16 bits, de 0 a 65535 (65536 valeurs).</pre>
<p>IP pour la machine, port pour le logiciel : le duo qui rend le dialogue possible. Demain : les grandes familles de ports (bien connus, enregistrés, dynamiques).</p>`
  }
};
