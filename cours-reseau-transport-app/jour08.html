  theory: `
<h3>1. La philosophie : rien ne se perd, tout arrive en ordre</h3>
<p><strong>TCP</strong> (« Transmission Control Protocol ») est l'autre grand protocole de transport, à l'opposé d'UDP. Sa promesse : les données arrivent <strong>complètes</strong>, <strong>sans erreur</strong> et <strong>dans le bon ordre</strong>. Si un morceau se perd, TCP le renvoie ; si des morceaux arrivent en désordre, TCP les remet en place. C'est le protocole du web (HTTP/HTTPS), du mail, du transfert de fichiers : partout où il ne faut rien perdre.</p>
<p>Analogie : un envoi recommandé avec accusé de réception. On numérote chaque colis, on attend la confirmation de bonne réception, et on renvoie ce qui n'est pas arrivé. C'est plus lourd qu'une carte postale (UDP), mais on est sûr que tout parvient à destination.</p>
<h3>2. Avec connexion : la poignée de main en trois temps</h3>
<p>Contrairement à UDP, TCP est <strong>orienté connexion</strong> : avant d'échanger des données, les deux extrémités établissent une connexion par une <strong>poignée de main en trois temps</strong> (en anglais <em>three-way handshake</em>). Puis, à la fin, elles la ferment proprement. Ouvrir la connexion prend un aller-retour ; c'est le prix de la fiabilité.</p>
<pre class="pseudo"># Ouverture TCP : three-way handshake (3 messages)
Client --- SYN --------------&gt; Serveur   (je veux me connecter)
Client &lt;-- SYN + ACK --------- Serveur   (d'accord, et toi ?)
Client --- ACK --------------&gt; Serveur   (parfait, on est connectes)
# Ensuite seulement, les donnees circulent.</pre>
<h3>3. Comment TCP garantit la fiabilité</h3>
<p>TCP s'appuie sur trois mécanismes. D'abord la <strong>numérotation</strong> : chaque octet envoyé porte un numéro de séquence, ce qui permet de détecter un manque et de <strong>remettre dans l'ordre</strong>. Ensuite l'<strong>accusé de réception</strong> (en anglais <em>ACK</em>) : le récepteur confirme ce qu'il a reçu. Enfin la <strong>retransmission</strong> : si un accusé n'arrive pas à temps, l'émetteur renvoie le morceau. À cela s'ajoute le <strong>contrôle de flux</strong>, qui évite de noyer un récepteur trop lent.</p>
<div class="tip">Ces garanties ont un coût : en-tête plus gros (20 octets au minimum, contre 8 pour UDP), délai d'ouverture, et attentes d'accusés. En échange, tu ne perds rien et tout arrive dans l'ordre. C'est le compromis fiabilité contre vitesse.</div>
<h3>4. TCP ou UDP : le grand choix</h3>
<p>Le logiciel choisit selon son besoin. <strong>TCP</strong> pour tout ce qui doit être intègre : pages web, e-mails, téléchargements, transactions. <strong>UDP</strong> pour tout ce qui doit être rapide et frais : streaming, jeux, voix en direct, DNS. Ce n'est pas « lequel est meilleur », mais « lequel convient à ce besoin ».</p>
<pre class="pseudo"># Choisir son transport
TCP  -> fiable, ordonne, avec connexion  (web, mail, fichiers)
UDP  -> rapide, leger, sans connexion    (streaming, jeux, DNS)
# Question a se poser : ai-je besoin de TOUT recevoir en ordre ?
#   OUI -> TCP     |     NON, je veux surtout la vitesse -> UDP</pre>
<div class="warn">TCP garantit la livraison de bout en bout, mais pas la sécurité (confidentialité). Pour chiffrer, on ajoute une couche par-dessus : c'est ce que fait HTTPS (TLS au-dessus de TCP). Fiable ne veut pas dire secret.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># TCP = Transmission Control Protocol (couche 4)

    { type: "vf", q: "TCP garantit la fiabilité de la livraison, mais pas la confidentialité des données.", a: true, exp: "Oui : pour chiffrer, on ajoute TLS (c'est HTTPS = HTTP + TLS sur TCP)." },

    { type: "qcm", q: "Question clé pour choisir TCP plutôt qu'UDP ?", opts: ["Ai-je besoin de l'envoi le plus rapide possible ?", "Ai-je besoin de tout recevoir, complet et en ordre ?", "Puis-je tolérer quelques pertes de paquets ?", "Les données doivent-elles être chiffrées ?"], a: 1, exp: "Si tout doit arriver intact et ordonné : TCP. Sinon, pour la vitesse : UDP." },
    { type: "vf", q: "TCP ferme la connexion proprement à la fin de l'échange.", a: true, exp: "Oui : après le transfert, la connexion est close par des messages dédiés." }
  ],

      { type: "qcm", q: "Le rapport est confidentiel. Qu'ajoute-t-on à TCP pour le chiffrer ?", opts: ["Rien, TCP chiffre déjà", "Une couche de chiffrement comme TLS (HTTPS)", "Une somme de contrôle (checksum)", "Un handshake TCP supplémentaire"], a: 1, exp: "TCP fiabilise mais ne chiffre pas ; TLS (HTTPS) apporte la confidentialité." }
    ],
    solution: `<pre class="pseudo"># Deux taches, deux transports :
Telechargement du rapport -> TCP
