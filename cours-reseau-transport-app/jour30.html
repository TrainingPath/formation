<title>Jour 30</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 30,
  title: "Synthèse : le voyage complet d'un paquet",
  subtitle: "De « j'ouvre un site » à « la page s'affiche » : toutes les couches d'un seul coup d'œil.",
  theory: `
<h3>1. Le point de départ : une intention, une URL</h3>
<p>Tout commence par un geste simple : Léa tape <code>https://www.exemple.fr</code>. Derrière cette action se déroule une chaîne d'événements qui traverse <strong>toutes les couches</strong> du réseau, de l'application jusqu'aux câbles, puis remonte côté serveur, et redescend pour le retour. Ce cours rassemble tout ce que tu as appris en un seul récit continu.</p>
<h3>2. La couche application prépare la demande</h3>
<p>Le navigateur veut parler <strong>HTTP</strong> (dans un tunnel <strong>TLS</strong>, car c'est du https). Mais il lui manque l'adresse : il connaît le <em>nom</em> www.exemple.fr, pas l'<strong>adresse IP</strong>. Il interroge donc le <strong>DNS</strong> (l'annuaire du réseau) qui répond, par exemple, <code>203.0.113.10</code>. Le navigateur prépare alors sa requête HTTP : <code>GET / HTTP/1.1</code>, en-tête <code>Host</code>, etc.</p>
<h3>3. Descente dans les couches : l'encapsulation</h3>
<p>Le message ne part pas d'un bloc. Chaque couche l'<strong>encapsule</strong> en ajoutant son propre en-tête, comme des enveloppes gigognes. À la couche <strong>transport</strong>, <strong>TCP</strong> établit d'abord une connexion fiable par une <strong>poignée de main en trois temps</strong> (SYN, SYN-ACK, ACK), puis découpe les données en <strong>segments</strong> numérotés, marqués du <strong>port</strong> destination 443. À la couche <strong>réseau</strong>, <strong>IP</strong> emballe chaque segment dans un <strong>paquet</strong> portant l'IP source et l'IP destination. À la couche <strong>liaison</strong>, chaque paquet devient une <strong>trame</strong> avec les adresses <strong>MAC</strong> du prochain équipement. Enfin la couche <strong>physique</strong> transmet des bits sur le câble ou les ondes.</p>
<pre class="pseudo"># Encapsulation (chaque couche ajoute son en-tête) :
Application : [ GET / HTTP/1.1 ... ]                    (chiffré par TLS)
Transport   : [ TCP:port443 | données ]                 -> segment
Réseau      : [ IP src->dst | TCP | données ]           -> paquet
Liaison     : [ MAC | IP | TCP | données | contrôle ]   -> trame
Physique    :  0100110101...  bits sur le support</pre>
<h3>4. La traversée : NAT et routage</h3>
<p>En sortant de la box, le paquet franchit le <strong>NAT</strong> (<em>Network Address Translation</em>) : la box remplace l'adresse IP <strong>privée</strong> de Léa (ex. 192.168.1.20) par son adresse IP <strong>publique</strong> unique, et note la correspondance pour reconnaître la réponse. Le paquet voyage ensuite de <strong>routeur</strong> en routeur : chacun lit l'IP de destination et consulte sa <strong>table de routage</strong> pour choisir le meilleur saut suivant, comme des panneaux d'autoroute successifs. De proche en proche, le paquet atteint le réseau du serveur.</p>
<div class="tip">Retiens la division du travail : <strong>IP</strong> choisit le chemin (le « où »), <strong>TCP</strong> assure la fiabilité et l'ordre (le « sans perte »), le <strong>NAT</strong> partage une IP publique entre plusieurs machines privées, le <strong>DNS</strong> traduit les noms en adresses.</div>
<h3>5. Côté serveur : la remontée (désencapsulation)</h3>
<p>Arrivé à destination, le processus s'inverse : la trame est ouverte (liaison), le paquet extrait (réseau), le segment reconstitué et remis dans l'ordre (transport), et enfin la requête HTTP est livrée à l'application, le serveur web. Celui-ci comprend « on me demande la page d'accueil », la génère, et renvoie une <strong>réponse HTTP</strong> (statut <code>200 OK</code>, en-têtes, HTML).</p>
<h3>6. Le retour et l'affichage</h3>
<p>La réponse refait le trajet en sens inverse : encapsulée côté serveur, routée sur Internet, elle revient à l'IP publique de Léa. La box, grâce à sa table <strong>NAT</strong>, sait à quelle machine privée rendre le paquet, et le renvoie à l'ordinateur de Léa. Là, désencapsulation, réassemblage TCP, déchiffrement TLS, et le navigateur reçoit enfin le HTML qu'il <strong>affiche</strong>. Des dizaines d'étapes, des allers-retours de couches, le tout en une fraction de seconde.</p>
<div class="warn">Une erreur à n'importe quel étage bloque le voyage : DNS injoignable (le nom ne se résout pas), mauvaise route (paquet perdu), port fermé (personne n'écoute), certificat TLS invalide (le tunnel échoue). Diagnostiquer, c'est identifier À QUELLE couche ça coince.</div>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Le voyage complet, en une phrase par étape :
1. Application : URL -> DNS traduit le nom en IP -> requête HTTP (dans TLS)
2. Transport   : TCP (poignée SYN/SYN-ACK/ACK) découpe en segments, port 443
3. Réseau      : IP emballe en paquets (IP source -> IP destination)
4. Liaison/phys: trames (MAC) puis bits sur le support
5. Traversée   : NAT (privé->public) + routage (routeur en routeur)
6. Serveur     : désencapsulation -> réponse HTTP 200 + HTML
7. Retour      : même chemin inverse, NAT réoriente, navigateur AFFICHE</pre>`,
  exercises: [
    { type: "qcm", q: "Juste après avoir saisi une URL, de quel service le navigateur a-t-il besoin pour obtenir l'adresse IP du site ?", opts: ["Le NAT", "Le DNS", "Le routage", "TLS"], a: 1, exp: "Le DNS traduit le nom de domaine (www.exemple.fr) en adresse IP." },
    { type: "input", q: "Comment appelle-t-on le fait que chaque couche ajoute son propre en-tête autour des données ?", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation : chaque couche emballe les données dans son en-tête, comme des enveloppes gigognes." },
    { type: "qcm", q: "Quelle couche établit une connexion fiable et découpe les données en segments numérotés ?", opts: ["La couche application", "La couche transport (TCP)", "La couche réseau (IP)", "La couche physique"], a: 1, exp: "TCP, à la couche transport, fiabilise, numérote et découpe en segments." },
    { type: "qcm", q: "Dans quel ordre se fait la poignée de main TCP ?", opts: ["ACK, SYN, SYN-ACK", "SYN, SYN-ACK, ACK", "SYN, ACK, FIN", "GET, POST, ACK"], a: 1, exp: "La poignée de main en trois temps : SYN, puis SYN-ACK, puis ACK." },
    { type: "vf", q: "IP choisit le chemin (le « où »), tandis que TCP assure la fiabilité et l'ordre.", a: true, exp: "Vrai : IP route, TCP fiabilise et remet dans l'ordre. Division classique du travail." },
    { type: "input", q: "Quel mécanisme de la box remplace l'adresse IP privée par l'adresse IP publique ? (sigle)", a: ["nat", "le nat"], ph: "3 lettres", exp: "Le NAT (Network Address Translation) traduit privé vers public et mémorise la correspondance." },
    { type: "qcm", q: "Que consulte un routeur pour décider du prochain saut d'un paquet ?", opts: ["Sa table NAT", "Sa table de routage", "Le cache DNS", "La table MAC uniquement"], a: 1, exp: "Le routeur lit l'IP de destination et consulte sa table de routage." },
    { type: "qcm", q: "À la couche liaison, la donnée encapsulée s'appelle…", opts: ["Un segment", "Un paquet", "Une trame", "Un bit"], a: 2, exp: "Segment (transport) -> paquet (réseau) -> trame (liaison) -> bits (physique)." },
    { type: "vf", q: "Côté serveur, on refait l'encapsulation dans le même sens que côté client.", a: false, exp: "Faux : côté serveur, on DÉSENCAPSULE (on retire les en-têtes) pour remonter jusqu'à l'application." },
    { type: "input", q: "Sur quel port se connecte la requête puisque le site est en https ?", a: ["443", "port 443"], ph: "un numéro", exp: "HTTPS utilise le port 443." },
    { type: "qcm", q: "Quand la réponse revient, comment la box sait-elle à quelle machine privée la rendre ?", opts: ["Grâce au DNS", "Grâce à sa table NAT (correspondance mémorisée)", "Grâce à TLS", "En diffusant la réponse à toutes les machines locales"], a: 1, exp: "Le NAT a mémorisé la correspondance ; la box réoriente la réponse vers la bonne machine privée." },
    { type: "qcm", q: "Que renvoie le serveur web quand la page d'accueil est correctement fournie ?", opts: ["404 Not Found", "200 OK + le HTML", "500 Internal Server Error", "301 Moved"], a: 1, exp: "Un statut 200 OK accompagné du contenu HTML de la page." },
    { type: "vf", q: "Un certificat TLS invalide peut empêcher tout le voyage d'aboutir.", a: true, exp: "Vrai : si le tunnel TLS échoue, la connexion HTTPS ne s'établit pas." },
    { type: "input", q: "Comment appelle-t-on, côté serveur, le fait de retirer successivement les en-têtes pour remonter les couches ?", a: ["desencapsulation", "la desencapsulation", "decapsulation"], ph: "un mot", exp: "La désencapsulation : on retire les en-têtes couche par couche jusqu'à l'application." },
    { type: "qcm", q: "Diagnostiquer une panne réseau, c'est avant tout…", opts: ["Remplacer la carte réseau sans diagnostic", "Identifier à quelle couche le problème se situe", "Augmenter le débit de la connexion Internet", "Réinstaller entièrement le navigateur web"], a: 1, exp: "On localise la couche défaillante : DNS, route, port, TLS... pour cibler la cause." }
  ],
  final: {
    title: "Exercice final — Reconstituer le voyage",
    intro: `<p>Depuis son ordinateur (IP privée 192.168.1.20) derrière une box, Yanis ouvre <code>https://www.exemple.fr</code>. Le DNS répond 203.0.113.10. Suivons le paquet du départ au retour et remettons chaque étape à sa place.</p>`,
    questions: [
      { type: "input", q: "Quel service a traduit « www.exemple.fr » en « 203.0.113.10 » ? (sigle)", a: ["dns", "le dns"], ph: "3 lettres", exp: "Le DNS a résolu le nom en adresse IP." },
      { type: "qcm", q: "Avant d'envoyer les données HTTP, TCP fait…", opts: ["Une redirection 301", "Une poignée de main SYN / SYN-ACK / ACK", "Une requête DNS", "Un chiffrement AES"], a: 1, exp: "TCP établit la connexion par la poignée de main en trois temps avant d'échanger les données." },
      { type: "qcm", q: "En sortant de la box, l'IP privée 192.168.1.20 est remplacée par l'IP publique grâce…", opts: ["Au DNS", "Au NAT", "À TLS", "Au port 443"], a: 1, exp: "Le NAT traduit l'adresse privée en adresse publique et note la correspondance." },
      { type: "qcm", q: "Sur Internet, comment le paquet atteint-il 203.0.113.10 ?", opts: ["Par diffusion à tous", "Par routage : de routeur en routeur selon la table de routage", "Par le DNS", "Par NAT uniquement"], a: 1, exp: "Chaque routeur lit l'IP de destination et transmet au saut suivant : c'est le routage." },
      { type: "vf", q: "Au retour, la box utilise sa table NAT pour renvoyer la réponse au bon ordinateur privé, puis le navigateur affiche la page.", a: true, exp: "Vrai : le NAT réoriente la réponse vers 192.168.1.20, désencapsulation et affichage suivent." }
    ],
    solution: `<pre class="pseudo"># Le voyage du paquet de Yanis, bout en bout :
1. DNS      : www.exemple.fr -> 203.0.113.10
2. TCP      : poignée SYN/SYN-ACK/ACK, port 443, segments numérotés
3. TLS+HTTP : requête chiffrée GET / HTTP/1.1
4. Encapsulation : segment -> paquet (IP) -> trame (MAC) -> bits
5. NAT      : 192.168.1.20 (privé) -> IP publique de la box
6. Routage  : de routeur en routeur jusqu'à 203.0.113.10
7. Serveur  : désencapsulation -> réponse 200 OK + HTML
8. Retour   : même chemin inverse, NAT réoriente vers Yanis
9. Affichage: réassemblage TCP, déchiffrement TLS, page à l'écran</pre>
<p>Chaque couche a joué son rôle, dans l'ordre à l'aller et dans l'ordre inverse au retour. Comprendre ce trajet complet, c'est tenir le fil de tout le cours réseau.</p>`
  }
};
</script>
