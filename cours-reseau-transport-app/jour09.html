<script>
var DAY = {
  num: 9,
  title: "L'établissement d'une connexion TCP (3-way handshake : SYN, SYN-ACK, ACK)",
  subtitle: "Avant d'échanger des données, TCP se serre la main en trois temps.",
  theory: `
<h3>1. Pourquoi une poignée de main ?</h3>
<p>Avec <strong>TCP</strong> (« Transmission Control Protocol »), on ne peut pas envoyer des données n'importe comment : les deux machines doivent d'abord <strong>se mettre d'accord</strong>. C'est comme un coup de téléphone : tu ne parles pas avant que l'autre ait décroché et dit « allô ». Cette prise de contact s'appelle le <strong>3-way handshake</strong> (« poignée de main en trois temps »). Elle sert à vérifier que chacun peut <em>émettre ET recevoir</em>, et à choisir les numéros de départ des messages.</p>
<h3>2. Les drapeaux TCP en jeu</h3>
<p>Chaque segment TCP porte des <strong>drapeaux</strong> (en anglais <em>flags</em>) : de petits interrupteurs à 0 ou 1 dans l'en-tête. Quatre nous intéressent aujourd'hui : <strong>SYN</strong> (synchronize, « je veux ouvrir une connexion et voici mon numéro de départ »), <strong>ACK</strong> (acknowledgment, « j'accuse réception »), <strong>FIN</strong> (finish, « je veux fermer », vu au jour 11) et <strong>RST</strong> (reset, « stop brutal, cette connexion n'existe pas »).</p>
<div class="tip">Retiens la logique : <strong>SYN ouvre</strong>, <strong>ACK confirme</strong>, <strong>FIN ferme</strong> proprement, <strong>RST casse</strong> brutalement.</div>
<h3>3. Les trois temps, un par un</h3>
<p>Le client démarre (souvent un navigateur), le serveur écoute (par exemple sur le port 80). Voici l'échange :</p>
<pre class="pseudo"># 1) Le client demande l'ouverture
Client  --SYN, seq=x-->  Serveur          (drapeau SYN levé)
# 2) Le serveur accepte ET demande à son tour
Client  &lt;--SYN, ACK, seq=y, ack=x+1--  Serveur   (SYN et ACK leves)
# 3) Le client confirme
Client  --ACK, ack=y+1-->  Serveur        (drapeau ACK leve)
# => connexion ETABLIE, les donnees peuvent circuler</pre>
<p>Au premier temps, le client envoie <strong>SYN</strong> avec un numéro de séquence initial (ISN) qu'il tire au hasard, appelons-le x. Au deuxième temps, le serveur répond en une seule fois : il lève <strong>SYN</strong> (son propre numéro de départ y) et <strong>ACK</strong> pour accuser réception du client (ack = x+1). Au troisième temps, le client accuse réception du serveur (ack = y+1). Trois messages, et la connexion est <strong>établie</strong> (state ESTABLISHED).</p>
<h3>4. Pourquoi trois et pas deux ?</h3>
<p>Deux messages suffiraient à prévenir le serveur, mais pas à garantir que le <em>client</em> reçoit bien les réponses. Le troisième message (le ACK final) prouve que le canal fonctionne dans les <strong>deux sens</strong>. C'est cette réciprocité qui rend TCP fiable dès la première seconde.</p>
<div class="warn">Si le serveur n'écoute pas sur le port demandé, il ne répond pas par SYN-ACK mais par <strong>RST</strong> : la connexion est refusée immédiatement. Un SYN resté sans réponse (aucun RST, aucun SYN-ACK) signale souvent un pare-feu qui « avale » le paquet en silence.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Le 3-way handshake ouvre TOUTE connexion TCP :
#   1. Client -> Serveur : SYN            (seq=x)
#   2. Serveur -> Client : SYN + ACK      (seq=y, ack=x+1)
#   3. Client -> Serveur : ACK            (ack=y+1)
# Resultat : etat ESTABLISHED, on peut echanger des donnees.
# Drapeaux : SYN=ouvre  ACK=confirme  FIN=ferme  RST=casse</pre>`,
  exercises: [
    { type: "qcm", q: "Comment appelle-t-on la procédure d'ouverture d'une connexion TCP ?", opts: ["Le broadcast", "Le 3-way handshake (poignée de main en 3 temps)", "Le ping-pong", "Le multiplexage"], a: 1, exp: "Trois segments (SYN, SYN-ACK, ACK) établissent la connexion." },
    { type: "qcm", q: "Quel drapeau le client envoie-t-il en tout premier ?", opts: ["ACK", "FIN", "SYN", "RST"], a: 2, exp: "Le tout premier segment porte le drapeau SYN pour demander l'ouverture." },
    { type: "qcm", q: "Que contient le deuxième message (du serveur) ?", opts: ["SYN seul", "ACK seul", "SYN et ACK ensemble", "FIN et ACK"], a: 2, exp: "Le serveur accepte (SYN) et accuse réception (ACK) en un seul segment : SYN-ACK." },
    { type: "input", q: "Quel drapeau TCP signifie « j'accuse réception » (3 lettres) ?", a: ["ack"], ph: "3 lettres", exp: "ACK = acknowledgment, l'accusé de réception." },
    { type: "vf", q: "Le troisième et dernier message du handshake est un ACK envoyé par le client.", a: true, exp: "Oui : le client confirme le SYN du serveur avec un ACK, ce qui établit la connexion." },
    { type: "qcm", q: "À quoi sert le drapeau SYN ?", opts: ["Fermer la connexion", "Ouvrir la connexion et annoncer un numéro de séquence de départ", "Réinitialiser brutalement", "Chiffrer les données"], a: 1, exp: "SYN (synchronize) ouvre et synchronise les numéros de séquence." },
    { type: "vf", q: "Deux messages suffisent à établir une connexion TCP fiable.", a: false, exp: "Non : il en faut trois pour prouver que le canal marche dans les deux sens." },
    { type: "input", q: "Quel drapeau casse brutalement une connexion (ou refuse une ouverture) ? (3 lettres)", a: ["rst", "reset"], ph: "3 lettres", exp: "RST (reset) rejette ou coupe brutalement la connexion." },
    { type: "qcm", q: "Si le client envoie SYN avec seq=x, quel ack le serveur renvoie-t-il ?", opts: ["x", "x+1", "y", "0"], a: 1, exp: "Le serveur accuse réception en renvoyant ack = x+1." },
    { type: "qcm", q: "Un serveur qui n'écoute pas sur le port demandé répond typiquement par…", opts: ["Un SYN-ACK", "Un ACK", "Un RST (refus)", "Rien, jamais"], a: 2, exp: "Un port fermé répond par RST : la connexion est refusée." },
    { type: "vf", q: "Le numéro de séquence initial (ISN) est choisi au hasard par chaque extrémité.", a: true, exp: "Oui : un ISN aléatoire évite les collisions et améliore la sécurité." },
    { type: "input", q: "Nom (en anglais, un mot avec un tiret possible) du terme désignant les petits interrupteurs SYN/ACK/FIN dans l'en-tête TCP ?", a: ["flags", "flag", "drapeaux", "drapeau"], ph: "terme anglais", exp: "Ce sont les flags (drapeaux) de l'en-tête TCP." },
    { type: "qcm", q: "Après le troisième message, dans quel état est la connexion ?", opts: ["CLOSED", "LISTEN", "ESTABLISHED", "TIME_WAIT"], a: 2, exp: "La connexion passe à l'état ESTABLISHED : les données peuvent circuler." },
    { type: "qcm", q: "Pourquoi le troisième message (ACK) est-il indispensable ?", opts: ["Pour chiffrer", "Pour prouver que le client reçoit bien, donc que le canal marche dans les deux sens", "Pour changer de port", "Pour accélérer le débit"], a: 1, exp: "Il confirme la voie retour : la fiabilité bidirectionnelle est garantie." },
    { type: "vf", q: "Le drapeau FIN sert à ouvrir une connexion.", a: false, exp: "Non : FIN sert à fermer proprement une connexion, pas à l'ouvrir." }
  ],
  final: {
    title: "Exercice final — Décoder un handshake",
    intro: `<p>Tu ouvres une page web. Wireshark montre trois premiers segments TCP entre ton PC (192.168.1.20) et le serveur (93.184.216.34) sur le port 80. Analysons-les.</p>`,
    questions: [
      { type: "qcm", q: "Le premier segment part de 192.168.1.20 vers le port 80 avec le drapeau SYN. Qui est le client ?", opts: ["Le serveur 93.184.216.34", "Ton PC 192.168.1.20", "Le routeur", "Le port 80"], a: 1, exp: "Celui qui envoie le premier SYN est le client : ton PC." },
      { type: "qcm", q: "Le deuxième segment revient avec SYN et ACK levés. Qui l'envoie ?", opts: ["Ton PC", "Le serveur", "Le DNS", "Personne"], a: 1, exp: "Le serveur répond SYN-ACK pour accepter et accuser réception." },
      { type: "input", q: "Quel unique drapeau porte le troisième segment (envoyé par le client) ? (3 lettres)", a: ["ack"], ph: "3 lettres", exp: "Le client conclut le handshake avec un ACK." },
      { type: "vf", q: "Après ces trois segments, la connexion est établie et la requête HTTP peut partir.", a: true, exp: "Oui : état ESTABLISHED, les données applicatives suivent." },
      { type: "qcm", q: "Si, à la place du SYN-ACK, tu avais reçu un RST, cela voudrait dire…", opts: ["Connexion établie", "Le serveur refuse (port fermé)", "Données reçues", "Handshake réussi"], a: 1, exp: "Un RST en réponse au SYN signifie un refus : rien n'écoute sur ce port." }
    ],
    solution: `<pre class="pseudo"># Lecture du handshake capture :
1. 192.168.1.20 -> 93.184.216.34 : [SYN]      seq=x
2. 93.184.216.34 -> 192.168.1.20 : [SYN, ACK]  seq=y  ack=x+1
3. 192.168.1.20 -> 93.184.216.34 : [ACK]              ack=y+1
# => ESTABLISHED : la requete HTTP GET peut maintenant partir.</pre>
<p>Trois segments, et le tunnel fiable est ouvert. Demain : comment TCP contrôle le flux et confirme chaque octet.</p>`
  }
};
</script>
