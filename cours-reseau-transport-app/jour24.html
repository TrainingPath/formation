<script>
var DAY = {
  num: 24,
  title: "Le protocole HTTP : requête / réponse",
  subtitle: "Le dialogue du web : une question du client, une réponse du serveur, avec méthodes et codes.",
  theory: `
<h3>1. Un modèle simple : requête puis réponse</h3>
<p><strong>HTTP</strong> (en anglais <em>HyperText Transfer Protocol</em>) fonctionne selon un modèle <strong>requête / réponse</strong> (en anglais <em>request / response</em>). Le <strong>client</strong> (ton navigateur) envoie une <strong>requête</strong> au <strong>serveur</strong> ; le serveur renvoie une <strong>réponse</strong>. C'est un dialogue à sens unique à chaque fois : le client demande, le serveur répond. HTTP est dit <strong>sans état</strong> (en anglais <em>stateless</em>) : chaque requête est indépendante, le serveur ne se souvient pas de la précédente par lui-même.</p>
<pre class="pseudo"># Un echange HTTP minimal
CLIENT  ---- requete ---->  SERVEUR
        "GET /index.html"
CLIENT  &lt;--- reponse ----  SERVEUR
        "200 OK" + la page HTML</pre>
<h3>2. La requête : une méthode + une ressource</h3>
<p>Une requête commence par une <strong>méthode</strong> (le verbe : que veux-tu faire ?) suivie du chemin de la <strong>ressource</strong> visée. Les principales méthodes :</p>
<pre class="pseudo"># Les methodes HTTP les plus courantes
GET     -> LIRE / recuperer une ressource (afficher une page)
POST    -> ENVOYER des donnees (soumettre un formulaire, creer)
PUT     -> REMPLACER / mettre a jour une ressource existante
DELETE  -> SUPPRIMER une ressource
# Exemple de ligne de requete :  GET /articles/42 HTTP/1.1</pre>
<div class="tip">Mnémotechnique : <strong>GET</strong> pour obtenir (lire), <strong>POST</strong> pour poster (envoyer/créer), <strong>PUT</strong> pour poser/remplacer, <strong>DELETE</strong> pour supprimer. GET ne modifie rien ; POST/PUT/DELETE agissent sur les données.</div>
<p>La requête contient aussi des <strong>en-têtes</strong> (en anglais <em>headers</em>) : des informations comme le type de contenu accepté, le navigateur utilisé, etc. Pour POST ou PUT, elle contient un <strong>corps</strong> (en anglais <em>body</em>) avec les données envoyées.</p>
<h3>3. La réponse : un code de statut</h3>
<p>Le serveur répond avec un <strong>code de statut</strong> (en anglais <em>status code</em>) : un nombre à trois chiffres qui résume le résultat. Le premier chiffre donne la famille :</p>
<pre class="pseudo"># Familles de codes de statut HTTP
2xx  Succes         -> 200 OK          (tout va bien, voici la ressource)
3xx  Redirection    -> 301 Moved       (la ressource a demenage)
4xx  Erreur CLIENT  -> 404 Not Found   (la ressource n'existe pas)
5xx  Erreur SERVEUR -> 500 Internal    (le serveur a plante)</pre>
<p>Les quatre à connaître par cœur : <strong>200</strong> (OK, succès), <strong>301</strong> (Moved Permanently, redirection permanente), <strong>404</strong> (Not Found, page introuvable), <strong>500</strong> (Internal Server Error, erreur interne du serveur). Le fameux « 404 » que tu croises est donc une <em>erreur côté client</em> : la ressource demandée n'existe pas.</p>
<div class="warn">Retiens la logique des familles : <strong>4xx</strong> = « c'est de ta faute » (mauvaise requête, page inexistante) ; <strong>5xx</strong> = « c'est de la faute du serveur » (il a planté). Ne confonds pas 404 (client) et 500 (serveur).</div>
<h3>4. Un exemple complet</h3>
<pre class="pseudo"># Requete envoyee par le navigateur :
GET /produits/12 HTTP/1.1
Host: boutique.example
Accept: text/html

# Reponse du serveur :
HTTP/1.1 200 OK
Content-Type: text/html
&lt;html&gt; ... la page du produit ... &lt;/html&gt;</pre>
<p>Si le produit 12 n'existait pas, le serveur répondrait <code>404 Not Found</code>. S'il avait été déplacé, <code>301</code> avec la nouvelle adresse. Si le serveur buggait, <code>500</code>.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># HTTP = requete / reponse, sans etat (stateless)
# Methodes : GET (lire) POST (envoyer) PUT (remplacer) DELETE (supprimer)
# Codes de statut : 2xx succes | 3xx redirection | 4xx erreur client | 5xx erreur serveur
# A connaitre : 200 OK | 301 Moved | 404 Not Found | 500 Internal Server Error</pre>`,
  exercises: [
    { type: "qcm", q: "Selon quel modèle HTTP fonctionne-t-il ?", opts: ["Diffusion permanente", "Requête / réponse", "Pair à pair uniquement", "Sans client"], a: 1, exp: "Le client envoie une requête, le serveur renvoie une réponse." },
    { type: "input", q: "Quelle méthode HTTP sert à LIRE / récupérer une ressource ?", a: ["get"], ph: "un verbe", exp: "GET sert à obtenir/lire une ressource sans la modifier." },

    { type: "input", q: "Quel code de statut signifie que tout s'est bien passé (succès) ?", a: ["200", "200 ok", "code 200"], ph: "un nombre", exp: "200 OK indique le succès de la requête." },

    { type: "qcm", q: "À quelle famille appartient un code commençant par 4 (comme 404) ?", opts: ["Succès", "Redirection", "Erreur client", "Erreur serveur"], a: 2, exp: "Les codes 4xx signalent une erreur côté client." },
    { type: "qcm", q: "Que signifie le code 301 ?", opts: ["Succès", "Redirection (la ressource a déménagé)", "Erreur client", "Erreur serveur"], a: 1, exp: "301 Moved Permanently : la ressource a une nouvelle adresse." },
    { type: "vf", q: "HTTP est sans état (stateless) : chaque requête est indépendante des précédentes.", a: true, exp: "Oui : par défaut le serveur ne se souvient pas des requêtes précédentes." },
    { type: "input", q: "Quelle méthode HTTP sert à REMPLACER / mettre à jour une ressource existante ?", a: ["put"], ph: "un verbe", exp: "PUT remplace ou met à jour une ressource." },
    { type: "qcm", q: "Le code 200 appartient à quelle famille ?", opts: ["2xx succès", "3xx redirection", "4xx erreur client", "5xx erreur serveur"], a: 0, exp: "200 est dans la famille 2xx (succès)." },
    { type: "vf", q: "GET modifie les données du serveur.", a: false, exp: "Non : GET sert à lire, il ne modifie normalement rien (ce sont POST/PUT/DELETE qui agissent)." },
    { type: "qcm", q: "Quel code correspond à 'Internal Server Error' ?", opts: ["200", "301", "404", "500"], a: 3, exp: "500 = Internal Server Error, une erreur interne du serveur." },
    { type: "input", q: "Comment appelle-t-on (deux mots français) le nombre à trois chiffres renvoyé par le serveur pour résumer le résultat ?", a: ["code de statut", "code statut", "code de status", "code d'etat", "code de retour"], ph: "deux mots", exp: "C'est le code de statut (status code), ex. 200, 404, 500." }
  ],
  final: {
    title: "Exercice final — Lire les réponses d'une API",
    intro: `<p>Tom teste une petite API de blog. Il envoie plusieurs requêtes HTTP et observe les codes de statut renvoyés. Aide-le à interpréter chaque échange.</p>`,
    questions: [
      { type: "qcm", q: "Pour AFFICHER l'article numéro 7, quelle méthode utilise-t-il ?", opts: ["GET", "POST", "DELETE", "PUT"], a: 0, exp: "GET récupère/lit la ressource (l'article) sans la modifier." },
      { type: "input", q: "Le serveur répond avec le code du succès. Lequel ?", a: ["200", "200 ok"], ph: "un nombre", exp: "200 OK : la requête a réussi." },

      { type: "vf", q: "Si le serveur plante pendant sa requête, il recevra un code de la famille 5xx (par ex. 500).", a: true, exp: "Oui : les erreurs serveur sont en 5xx, dont 500 Internal Server Error." }
    ],
    solution: `<pre class="pseudo"># Les echanges de Tom :
# GET  /articles/7    -> 200 OK           (lecture reussie)
# GET  /articles/999  -> 404 Not Found    (n'existe pas : erreur client)
# POST /articles      -> creation d'un article (envoi de donnees)
# Si le serveur bugge  -> 500 Internal Server Error (erreur serveur)
#
# Methodes : GET=lire  POST=creer/envoyer  PUT=remplacer  DELETE=supprimer
# Codes : 2xx succes | 3xx redirection | 4xx client | 5xx serveur</pre>
<p>Tu sais lire un échange HTTP : méthode, ressource, code de statut. C'est le socle de tout le web moderne et des API. Bravo, tu boucles ce parcours NAT et couche application.</p>`
  }
};
</script>
