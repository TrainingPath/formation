var DAY = {
  num: 28,
  title: "Le transfert de fichiers (FTP, SFTP)",
  subtitle: "Déplacer des fichiers entre machines : l'ancien FTP et le sûr SFTP.",
  theory: `
<h3>1. À quoi sert un protocole de transfert de fichiers</h3>
<p>Envoyer une page web sur un serveur d'hébergement, récupérer une sauvegarde, déposer des documents sur une machine distante : autant de cas où l'on veut <strong>copier des fichiers d'un ordinateur à un autre</strong> à travers le réseau. Le plus ancien outil dédié s'appelle <strong>FTP</strong>. Sa version sécurisée moderne s'appelle <strong>SFTP</strong>. Attention, ce sont deux technologies très différentes malgré leurs noms proches.</p>
<h3>2. FTP : deux canaux, un héritage</h3>
<p><strong>FTP</strong> (<em>File Transfer Protocol</em>) est un vétéran. Sa particularité : il utilise <strong>deux connexions séparées</strong>. Un <strong>canal de commande</strong> (port <strong>21</strong>) transporte les ordres — se connecter, changer de dossier, lister, demander un fichier. Un <strong>canal de données</strong> (port <strong>20</strong> en mode actif) transporte le contenu des fichiers eux-mêmes. Séparer les ordres et les données est l'originalité — et la source de complications — de FTP.</p>
<pre class="pseudo"># Quelques commandes FTP côté canal de commande :
USER alice        # nom d'utilisateur
PASS ****         # mot de passe (EN CLAIR avec FTP !)
LIST              # lister le dossier courant
RETR rapport.pdf  # récupérer (download) un fichier
STOR photo.jpg    # déposer (upload) un fichier
QUIT</pre>
<h3>3. Mode actif contre mode passif</h3>
<p>Le canal de données peut s'ouvrir de deux façons. En <strong>mode actif</strong>, c'est le <em>serveur</em> qui initie la connexion de données vers le client (depuis son port 20). Problème : le pare-feu ou le routeur NAT du client bloque souvent cette connexion entrante inattendue. En <strong>mode passif</strong>, c'est le <em>client</em> qui initie aussi la connexion de données, vers un port que le serveur lui indique. Le mode passif traverse beaucoup mieux les pare-feu : c'est celui utilisé par défaut aujourd'hui.</p>
<pre class="pseudo"># Mode ACTIF  : le SERVEUR se connecte au client (port 20 -> client)
#               souvent bloqué par le pare-feu du client
# Mode PASSIF : le CLIENT ouvre les deux connexions vers le serveur
#               traverse mieux NAT et pare-feu (par défaut aujourd'hui)</pre>
<div class="warn">FTP transmet le nom d'utilisateur et le mot de passe <strong>en clair</strong>, ainsi que les fichiers. N'importe qui sur le trajet peut les lire. À proscrire pour tout ce qui est sensible : préfère SFTP.</div>
<h3>4. SFTP : le transfert dans un tunnel SSH</h3>
<p><strong>SFTP</strong> (<em>SSH File Transfer Protocol</em>) n'est PAS « du FTP chiffré » : c'est un protocole distinct, transporté à l'intérieur d'une connexion <strong>SSH</strong>. Il hérite donc de toute la sécurité de SSH : identifiants et fichiers <strong>chiffrés</strong>, authentification solide (mot de passe ou clé). Autre avantage pratique : un <strong>seul canal</strong> sur un <strong>seul port, le 22</strong> (le port de SSH). Pas de canal de données séparé, pas de casse-tête actif/passif : SFTP traverse les pare-feu aussi facilement que SSH.</p>
<pre class="pseudo"># Se connecter en SFTP (client en ligne de commande) :
sftp alice@serveur.exemple.fr      # port 22 par défaut (SSH)
sftp&gt; ls                            # lister
sftp&gt; get rapport.pdf               # télécharger
sftp&gt; put photo.jpg                 # envoyer
sftp&gt; bye</pre>
<div class="tip">Ne confonds pas <strong>SFTP</strong> (SSH File Transfer Protocol, sur le port 22) avec <strong>FTPS</strong> (FTP classique enrobé de TLS, qui garde les deux canaux). Les deux chiffrent, mais SFTP est plus simple à faire passer les pare-feu grâce à son unique connexion.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># FTP  : ancien, EN CLAIR. Deux canaux : commande=21, données=20 (actif)
#        mode PASSIF (client ouvre tout) traverse mieux les pare-feu
# SFTP : transfert DANS un tunnel SSH, chiffré, UN seul port = 22
#        != FTPS (FTP + TLS). Pour tout ce qui est sensible : SFTP.</pre>`,

    { type: "qcm", q: "Quel mode FTP traverse le mieux les pare-feu et NAT ?", opts: ["Le mode actif", "Le mode passif", "Le mode furtif", "Le mode broadcast"], a: 1, exp: "En mode passif, le client ouvre lui-même les connexions : cela passe mieux les pare-feu." },
    { type: "input", q: "Sur quel port unique fonctionne SFTP (celui de SSH) ?", a: ["22", "port 22"], ph: "un numéro", exp: "SFTP transite dans SSH, donc sur le port 22." },
    { type: "vf", q: "SFTP est simplement « du FTP auquel on a ajouté du chiffrement ».", a: false, exp: "Faux : SFTP est un protocole distinct transporté dans SSH ; il n'a pas les deux canaux de FTP." },
    { type: "qcm", q: "Grâce à quoi SFTP chiffre-t-il les identifiants et les fichiers ?", opts: ["TLS sur le port 443", "Le tunnel SSH (port 22)", "Le DNS", "Le mode passif"], a: 1, exp: "SFTP hérite de la sécurité de SSH : tout passe chiffré dans le tunnel SSH." },
    { type: "input", q: "Combien de canaux (connexions) FTP utilise-t-il pour fonctionner ?", a: ["2", "deux", "2 canaux", "deux canaux"], ph: "un nombre", exp: "FTP utilise deux canaux : un pour les commandes (21), un pour les données (20)." },
    { type: "qcm", q: "Quelle commande FTP télécharge (récupère) un fichier depuis le serveur ?", opts: ["STOR", "RETR", "USER", "LIST"], a: 1, exp: "RETR (retrieve) récupère un fichier ; STOR l'y dépose." },
    { type: "vf", q: "SFTP n'utilise qu'un seul port, ce qui simplifie la traversée des pare-feu.", a: true, exp: "Vrai : un seul canal sur le port 22, sans le casse-tête actif/passif de FTP." },
    { type: "input", q: "Quel protocole de tunnel sécurisé SFTP utilise-t-il (sigle de 3 lettres) ?", a: ["ssh", "le ssh"], ph: "3 lettres", exp: "SFTP = SSH File Transfer Protocol : il circule dans une connexion SSH." },
    { type: "qcm", q: "Qu'est-ce que FTPS, à ne pas confondre avec SFTP ?", opts: ["Un FTP classique enrobé de TLS, qui garde deux canaux", "Un synonyme exact de SFTP", "Un protocole de messagerie", "Le transfert de fichiers à l'intérieur d'une connexion SSH"], a: 0, exp: "FTPS = FTP + TLS (deux canaux) ; SFTP = transfert dans SSH (un canal, port 22)." },
    { type: "qcm", q: "Pour transférer des fichiers sensibles aujourd'hui, que choisir ?", opts: ["FTP en clair", "SFTP (ou FTPS)", "POP", "Telnet"], a: 1, exp: "SFTP (ou FTPS) chiffre tout ; FTP en clair est à proscrire pour le sensible." }
  ],
  final: {
    title: "Exercice final — Choisir sa méthode de transfert",
    intro: `<p>Un développeur doit envoyer les fichiers de son site vers un serveur d'hébergement, depuis un réseau d'entreprise protégé par un pare-feu strict. Il hésite entre FTP et SFTP, et se demande quel mode utiliser.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi FTP en clair est-il risqué sur ce transfert ?", opts: ["Il utilise un chiffrement obsolète, facile à casser aujourd'hui", "Identifiants et fichiers circulent en clair, lisibles sur le trajet", "Il ouvre deux canaux, difficiles à protéger par un pare-feu", "Il ne demande jamais de mot de passe à l'utilisateur"], a: 1, exp: "FTP n'est pas chiffré : mot de passe et fichiers sont exposés." },
      { type: "input", q: "Quel protocole lui conseilles-tu pour chiffrer le transfert ?", a: ["sftp", "le sftp"], ph: "un sigle", exp: "SFTP chiffre tout via le tunnel SSH." },
      { type: "input", q: "Sur quel port unique SFTP va-t-il se connecter ?", a: ["22", "port 22"], ph: "un numéro", exp: "SFTP passe par le port 22 (SSH)." },
      { type: "qcm", q: "S'il tenait à utiliser FTP malgré le pare-feu strict, quel mode privilégier ?", opts: ["Le mode actif", "Le mode passif", "Le mode actif, en autorisant le port 20 entrant", "Le mode actif avec authentification renforcée"], a: 1, exp: "Le mode passif, où le client ouvre les connexions, traverse mieux un pare-feu strict." },
      { type: "vf", q: "L'avantage de SFTP ici est qu'un seul port (22) suffit, sans canal de données séparé.", a: true, exp: "Vrai : un canal unique évite les problèmes actif/passif et de pare-feu de FTP." }
    ],
    solution: `<pre class="pseudo"># Décision du développeur :
FTP en clair -> NON : mot de passe + fichiers exposés sur le réseau.
Choix : SFTP (SSH File Transfer Protocol) sur le PORT 22
  - chiffré (hérite de SSH), un SEUL canal
  - traverse le pare-feu strict sans casse-tête actif/passif
# Si FTP était imposé : mode PASSIF (le client ouvre les connexions).</pre>
<p>Pour un transfert professionnel sur réseau surveillé, SFTP est le bon réflexe : chiffrement et simplicité de traversée grâce à son unique port.</p>`
  }
};
