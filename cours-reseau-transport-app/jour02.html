var DAY = {

  title: "Le modèle client / serveur",
  subtitle: "Celui qui demande, celui qui répond : le schéma qui structure Internet.",
  theory: `
<h3>1. Deux rôles, une conversation</h3>
<p>La plupart des échanges sur Internet suivent le même schéma : le <strong>client</strong> demande, le <strong>serveur</strong> répond. Le client est le logiciel qui prend l'initiative : ton navigateur, ton application de messagerie, ton client mail. Le serveur est le logiciel qui attend patiemment les demandes et y répond : un serveur web, un serveur mail. Ce n'est pas une question de matériel, mais de <strong>rôle dans l'échange</strong>.</p>
<p>Analogie : un restaurant. Le client passe commande ; la cuisine (le serveur) prépare et renvoie le plat. La cuisine ne va jamais frapper à la porte des gens pour leur imposer un repas : elle attend qu'on la sollicite. De la même façon, un serveur web reste à l'écoute et ne parle que lorsqu'un client l'interroge.</p>
<h3>2. Qui commence ? Toujours le client</h3>
<p>Point essentiel : c'est <strong>toujours le client qui déclenche</strong> l'échange. Le serveur, lui, est en état d'<strong>écoute</strong> (en anglais <em>listening</em>) : il attend une connexion sur son adresse. Quand une demande arrive, il la traite et renvoie une <strong>réponse</strong>. Puis il retourne écouter la suivante. Un même serveur peut servir des milliers de clients à la fois.</p>
<pre class="pseudo"># Le dialogue de base
Client  --- "Donne-moi la page d'accueil" --->  Serveur
Client  &lt;--- "Voici la page (code 200 OK)" ---  Serveur
# Le serveur ecoute, le client demande, le serveur repond.</pre>
<h3>3. Des exemples concrets</h3>
<p><strong>Le web.</strong> Ton navigateur est le client ; il parle le protocole <strong>HTTP</strong> (ou sa version sécurisée <strong>HTTPS</strong>). Il envoie une requête (« GET / ») au serveur web, qui renvoie la page. C'est l'exemple le plus courant du modèle client / serveur.</p>
<p><strong>Le mail.</strong> Pour <em>envoyer</em> un message, ton client mail parle à un serveur d'envoi avec le protocole <strong>SMTP</strong>. Pour <em>relever</em> ta boîte, il parle à un serveur de réception avec <strong>IMAP</strong> (ou l'ancien <strong>POP</strong>). Là encore, le client demande, le serveur stocke et répond.</p>
<div class="tip">Un même ordinateur peut être client d'un service et serveur d'un autre en même temps. « Client » et « serveur » qualifient un <strong>rôle</strong> dans un échange précis, pas la nature de la machine.</div>
<h3>4. Et le pair-à-pair alors ?</h3>
<p>Il existe un autre modèle : le <strong>pair-à-pair</strong> (en anglais <em>peer-to-peer</em>, ou P2P), où chaque machine est à la fois client et serveur, sans autorité centrale. C'est le principe de certains partages de fichiers ou de réseaux de cryptomonnaie. Mais l'immense majorité des services que tu utilises (web, mail, streaming) reposent sur le modèle client / serveur.</p>
<div class="warn">Ne confonds pas « serveur » (le rôle logiciel qui répond) et « serveur » (la grosse machine dans un centre de données). Le mot désigne les deux ; le contexte tranche. Ici, on parle du rôle.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Client  = demande, prend l'initiative (navigateur, client mail)
# Serveur = ecoute et repond (serveur web, serveur mail)
# C'est TOUJOURS le client qui commence l'echange
# Web  : client = navigateur, protocole = HTTP / HTTPS
# Mail : envoi = SMTP, reception = IMAP ou POP
# Client/serveur = un ROLE, pas un type de machine</pre>`,

    { type: "input", q: "Quel logiciel joue le rôle de client dans une navigation web (un mot courant) ?", a: ["navigateur", "le navigateur", "browser"], ph: "un mot", exp: "Le navigateur (browser) est le client web." },
    { type: "vf", q: "Un même ordinateur peut être client d'un service et serveur d'un autre en même temps.", a: true, exp: "Oui : le rôle dépend de l'échange considéré, pas de la machine." },
    { type: "qcm", q: "Version sécurisée de HTTP ?", opts: ["HTTPS", "HTTPX", "SHTTP", "HTTP2"], a: 0, exp: "HTTPS ajoute le chiffrement à HTTP." },
    { type: "qcm", q: "Combien de clients un serveur peut-il servir en même temps ?", opts: ["Un seul", "Deux au maximum", "Potentiellement des milliers", "Autant que de ports ouverts, soit un par client"], a: 2, exp: "Un serveur est conçu pour traiter de nombreux clients simultanément." },
    { type: "input", q: "Ancien protocole de réception de mail, souvent opposé à IMAP (sigle) ?", a: ["pop", "pop3"], ph: "3 lettres", exp: "POP (souvent POP3) télécharge les messages, historiquement plus ancien qu'IMAP." },
    { type: "qcm", q: "Le streaming vidéo grand public repose surtout sur quel modèle ?", opts: ["Le pair-à-pair pur", "Le client / serveur", "La diffusion générale (broadcast)", "Le modèle maître / esclave"], a: 1, exp: "Les plateformes de streaming servent leurs clients depuis des serveurs." }
  ],

    title: "Exercice final — Qui demande, qui répond ?",
    intro: `<p>Sami consulte un site puis envoie un e-mail. Deux échanges, un même schéma. Identifions les rôles et les protocoles.</p>`,

      { type: "qcm", q: "Pour ENVOYER son e-mail, son client mail parle à un serveur avec…", opts: ["IMAP", "SMTP", "DNS", "HTTP"], a: 1, exp: "SMTP gère l'envoi du courrier sortant." },
      { type: "vf", q: "C'est le serveur web qui a contacté Sami en premier pour lui imposer la page.", a: false, exp: "Non : c'est le client (le navigateur) qui a lancé la demande." },
      { type: "qcm", q: "Plus tard, pour relire ses messages reçus, son client mail utilisera plutôt…", opts: ["SMTP", "IMAP (ou POP)", "IP", "Ethernet"], a: 1, exp: "IMAP (ou POP) sert à relever la boîte de réception." }
    ],
    solution: `<pre class="pseudo"># Deux echanges, un meme schema client/serveur :
Web  : navigateur (client) --HTTP/HTTPS--> serveur web (repond)
Mail : envoi     -> client mail --SMTP--> serveur d'envoi
       reception -> client mail --IMAP/POP--> serveur de reception
# Regle d'or : le client demande, le serveur ecoute et repond.</pre>
<p>Le schéma est toujours le même : quelqu'un demande, quelqu'un répond. Demain : on plonge dans la couche 4 pour comprendre le rôle du transport.</p>`
