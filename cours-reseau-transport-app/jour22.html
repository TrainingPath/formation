  theory: `
<h3>1. Où se situe la couche application</h3>
<p>Le réseau est organisé en <strong>couches</strong> empilées, chacune ayant un rôle précis. Dans le modèle <strong>OSI</strong> (7 couches), la <strong>couche application</strong> est la <strong>couche 7</strong>, tout en haut. Dans le modèle <strong>TCP/IP</strong> (plus simple), elle regroupe les trois couches supérieures d'OSI en une seule couche « application ». C'est la couche <strong>la plus proche de l'utilisateur</strong> et de ses programmes.</p>
<pre class="pseudo"># Modele OSI (de haut en bas) :
7. Application   <-- ICI : interface avec les logiciels
6. Presentation
5. Session
4. Transport     (TCP / UDP : ports, fiabilite)
3. Reseau        (IP : adressage, routage)
2. Liaison       (Ethernet, MAC)
1. Physique      (cables, signaux)</pre>
<div class="tip">Retiens l'image d'un immeuble : la couche 1 (physique) est la fondation ; la couche 7 (application) est le dernier étage, celui où vivent les utilisateurs et leurs applications.</div>
<h3>2. Son rôle : l'interface avec les logiciels</h3>
<p>La couche application ne transporte pas elle-même les octets sur le câble — ce sont les couches basses qui le font. Son rôle est de fournir aux <strong>logiciels</strong> (navigateur, client mail, application de messagerie) des <strong>protocoles</strong> pour dialoguer de façon compréhensible. Elle définit <strong>le langage et les règles</strong> que deux programmes utilisent pour se comprendre à travers le réseau : quelle question poser, sous quelle forme, et à quoi ressemble la réponse.</p>
<p>Exemple : quand ton navigateur veut une page web, il ne se soucie pas des câbles ni du routage. Il parle le protocole <strong>HTTP</strong>, un protocole de la couche application, qui définit comment demander « donne-moi cette page » et comment la réponse arrive. HTTP, c'est du vocabulaire de niveau 7.</p>
<h3>3. Ce que fait (et ne fait pas) la couche 7</h3>
<p>La couche application <strong>fait</strong> : définir les messages applicatifs (une requête HTTP, un courriel, une requête DNS), gérer le format des données échangées, et s'appuyer sur la couche transport pour l'acheminement. Elle <strong>ne fait pas</strong> : découper en paquets, gérer les ports au niveau transport, router entre réseaux, ni transmettre les bits — tout cela est délégué aux couches inférieures (transport, réseau, liaison, physique).</p>
<pre class="pseudo"># Division du travail (exemple : ouvrir une page web)
Couche 7 (application) : "Je veux GET /index.html"  (protocole HTTP)
Couche 4 (transport)   : decoupe en segments, port 80, fiabilite (TCP)
Couche 3 (reseau)      : met l'adresse IP source/destination, route
Couches 2-1            : Ethernet/Wi-Fi, signaux electriques/ondes
# La couche 7 dit QUOI echanger ; les couches basses disent COMMENT l'acheminer.</pre>
<div class="warn">Piège classique : confondre « application » (le logiciel, ex. Firefox) et « couche application » (l'ensemble des protocoles standards de niveau 7, ex. HTTP). Firefox <em>utilise</em> le protocole HTTP de la couche application ; il n'est pas lui-même la couche.</div>
<h3>4. Pourquoi c'est important</h3>
<p>La couche application est celle que tu « vois » le plus : chaque service quotidien (web, mail, DNS, transfert de fichiers) repose sur un protocole applicatif. Comprendre cette couche, c'est comprendre le <strong>sens</strong> des échanges, pas seulement leur transport. Les jours suivants détaillent ces protocoles concrets (HTTP, FTP, SMTP, DNS, DHCP).</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Couche APPLICATION = couche 7 du modele OSI (sommet de la pile)
# Role : interface avec les LOGICIELS ; definit les protocoles applicatifs
# Elle dit QUOI echanger (HTTP, DNS, mail...) ; pas COMMENT l'acheminer
# S'appuie sur la couche TRANSPORT (TCP/UDP) en dessous
# En TCP/IP, elle regroupe les couches 5-6-7 d'OSI en une seule</pre>`,

    { type: "vf", q: "La couche application définit le langage et les règles que deux programmes utilisent pour se comprendre.", a: true, exp: "Oui : elle fixe le vocabulaire et le format des échanges applicatifs." },

  ],
