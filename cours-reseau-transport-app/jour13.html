<title>Jour 13</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 13,
  title: "Wireshark : découvrir l'analyseur (capturer, filtrer, lire une trame)",
  subtitle: "Ouvrir le capot du réseau et voir circuler les paquets, un par un.",
  theory: `
<h3>1. Un analyseur de paquets, pour quoi faire ?</h3>
<p><strong>Wireshark</strong> est un <strong>analyseur de paquets</strong> (en anglais <em>packet analyzer</em> ou <em>sniffer</em>) : un outil gratuit qui <strong>capture</strong> le trafic passant par une carte réseau et te le montre, trame par trame, en clair. C'est le stéthoscope du réseau : là où tu ne voyais qu'un câble ou un Wi-Fi, tu vois soudain chaque conversation. Indispensable pour <strong>diagnostiquer</strong> une panne, <strong>apprendre</strong> les protocoles et <strong>vérifier</strong> ce qui circule réellement.</p>
<h3>2. Capturer sur une interface</h3>
<p>Au démarrage, Wireshark liste les <strong>interfaces réseau</strong> disponibles (Ethernet, Wi-Fi…). Tu choisis celle par laquelle passe ton trafic, puis tu cliques sur la nageoire bleue pour <strong>lancer la capture</strong>. Les paquets défilent en direct ; le bouton rouge <strong>arrête</strong> la capture. Tu peux ensuite <strong>enregistrer</strong> le tout dans un fichier <strong>.pcapng</strong> pour l'analyser plus tard ou le partager.</p>
<pre class="pseudo"># Cycle de base :
# 1. Choisir l'interface (ex : Wi-Fi, Ethernet)
# 2. Cliquer sur la nageoire bleue -> capture en direct
# 3. Provoquer du trafic (ouvrir une page, un ping...)
# 4. Cliquer sur le carre rouge -> arret
# 5. Fichier -> Enregistrer sous... (.pcapng)</pre>
<h3>3. Les trois volets de la fenêtre</h3>
<p>L'écran d'analyse se divise en trois zones. En haut, la <strong>liste des paquets</strong> (une ligne par trame : n°, temps, source, destination, protocole, info). Au milieu, l'<strong>arbre des détails</strong> : le paquet décortiqué couche par couche (Ethernet, IP, TCP, données). En bas, les <strong>octets bruts</strong> en hexadécimal et ASCII. Cliquer sur un champ du milieu surligne les octets correspondants en bas : très pédagogique pour relier théorie et réalité.</p>
<div class="tip">Wireshark colore les lignes : le vert signale souvent du trafic HTTP, le noir/rouge une anomalie TCP (retransmission, reset). Ces couleurs guident l'œil avant même de lire les détails.</div>
<h3>4. Filtrer pour ne voir que l'utile</h3>
<p>Une capture contient vite des milliers de trames. Les <strong>filtres d'affichage</strong> (display filters) trient tout cela. On les tape dans la barre au-dessus de la liste. Quelques exemples essentiels :</p>
<pre class="pseudo"># Filtres d'affichage courants :
tcp.port == 80          # tout le trafic sur le port 80 (HTTP)
ip.addr == 192.168.1.20 # tout ce qui vient DE ou VERS cette IP
tcp                     # uniquement les segments TCP
udp                     # uniquement les datagrammes UDP
dns                     # uniquement les requetes/reponses DNS
tcp.flags.syn == 1      # les segments portant le drapeau SYN</pre>
<p>On combine avec <strong>&amp;&amp;</strong> (et) et <strong>||</strong> (ou) : par exemple <strong>ip.addr == 192.168.1.20 &amp;&amp; tcp.port == 443</strong> ne montre que le HTTPS de cette machine. La barre devient <strong>verte</strong> si le filtre est valide, <strong>rouge</strong> s'il contient une erreur de syntaxe.</p>
<div class="warn">Ne confonds pas <strong>filtre de capture</strong> (décidé avant, il jette ce qui n'est pas gardé) et <strong>filtre d'affichage</strong> (appliqué après, il cache sans supprimer). Un filtre d'affichage rouge = syntaxe invalide : rien ne s'affiche tant que tu ne corriges pas.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Wireshark = analyseur de paquets (capture le trafic reel)
# Capturer : choisir l'interface -> nageoire bleue -> carre rouge
# 3 volets : liste des paquets | details couche par couche | octets bruts
# Filtres d'affichage : tcp.port == 80  |  ip.addr == 192.168.1.20
# Combiner : &amp;&amp; (et)  ||  (ou)   ; barre verte = ok, rouge = erreur
# Fichier de capture : .pcapng</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que Wireshark ?", opts: ["Un antivirus", "Un analyseur de paquets qui capture et affiche le trafic réseau", "Un navigateur web", "Un pare-feu"], a: 1, exp: "Wireshark capture et décode le trafic, trame par trame." },
    { type: "qcm", q: "Que choisit-on en premier pour démarrer une capture ?", opts: ["Un port TCP", "L'interface réseau (Wi-Fi, Ethernet…)", "Un mot de passe", "Une couleur"], a: 1, exp: "On sélectionne l'interface par laquelle passe le trafic." },
    { type: "vf", q: "Un filtre d'affichage sert à ne montrer que certaines trames sans supprimer les autres.", a: true, exp: "Oui : il masque, la capture complète reste en mémoire." },
    { type: "input", q: "Quel filtre d'affichage montre tout le trafic sur le port 80 ? (écris-le)", a: ["tcp.port == 80", "tcp.port==80"], ph: "un filtre", exp: "tcp.port == 80 isole le trafic HTTP." },
    { type: "qcm", q: "Combien de volets principaux affiche la fenêtre d'analyse ?", opts: ["Un", "Deux", "Trois (liste, détails, octets)", "Cinq"], a: 2, exp: "Liste des paquets, détails couche par couche, octets bruts." },
    { type: "input", q: "Quel filtre affiche tout le trafic de ou vers l'IP 192.168.1.20 ? (écris-le)", a: ["ip.addr == 192.168.1.20", "ip.addr==192.168.1.20"], ph: "un filtre", exp: "ip.addr == 192.168.1.20 capte les deux sens." },
    { type: "qcm", q: "Que contient le volet du milieu ?", opts: ["Les octets en hexadécimal", "Le paquet décortiqué couche par couche (Ethernet, IP, TCP…)", "La liste des interfaces", "Les couleurs"], a: 1, exp: "L'arbre des détails montre chaque couche du paquet." },
    { type: "vf", q: "La barre de filtre devient rouge quand la syntaxe est invalide.", a: true, exp: "Oui : rouge = erreur de syntaxe, vert = filtre valide." },
    { type: "qcm", q: "Quel opérateur combine deux conditions de filtre par un « et » logique ?", opts: ["+", "&&", "==", "//"], a: 1, exp: "&& = et logique ; || = ou logique." },
    { type: "input", q: "Quelle extension de fichier Wireshark utilise-t-il pour enregistrer une capture ? (avec le point)", a: [".pcapng", "pcapng", ".pcap", "pcap"], ph: ".xxxx", exp: "Les captures se sauvegardent en .pcapng (ou .pcap)." },
    { type: "qcm", q: "Que montre le volet du bas ?", opts: ["Les octets bruts (hexadécimal et ASCII)", "La liste des IP", "Les statistiques globales", "Les filtres"], a: 0, exp: "Le volet du bas affiche les octets bruts de la trame." },
    { type: "vf", q: "Le filtre de capture et le filtre d'affichage sont exactement identiques.", a: false, exp: "Non : le filtre de capture jette avant ; l'affichage cache après." },
    { type: "qcm", q: "Quel filtre ne garde que les datagrammes UDP ?", opts: ["tcp", "udp", "ip", "arp"], a: 1, exp: "Le filtre udp isole les datagrammes UDP." },
    { type: "input", q: "Quel filtre montre uniquement les segments portant le drapeau SYN ? (écris-le)", a: ["tcp.flags.syn == 1", "tcp.flags.syn==1"], ph: "un filtre", exp: "tcp.flags.syn == 1 isole les segments SYN." },
    { type: "qcm", q: "À quoi sert la coloration des lignes dans Wireshark ?", opts: ["À rien", "À repérer d'un coup d'œil un type de trafic ou une anomalie (retransmission, reset)", "À chiffrer", "À choisir l'interface"], a: 1, exp: "Les couleurs guident l'œil vers l'important." }
  ],
  final: {
    title: "Exercice final — Première capture guidée",
    intro: `<p>Tu ouvres Wireshark pour observer une simple visite de site web sur le port 80 depuis ton PC (192.168.1.20). Mène l'analyse étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Première action logique ?", opts: ["Taper un filtre", "Choisir l'interface réseau puis lancer la capture", "Fermer Wireshark", "Enregistrer un fichier vide"], a: 1, exp: "On sélectionne l'interface, puis on démarre la capture." },
      { type: "input", q: "Pour ne voir que le trafic HTTP (port 80), quel filtre d'affichage tapes-tu ?", a: ["tcp.port == 80", "tcp.port==80"], ph: "un filtre", exp: "tcp.port == 80 isole le port 80." },
      { type: "input", q: "Pour restreindre à ta seule machine, quel filtre ajoutes-tu (avec ip.addr) ?", a: ["ip.addr == 192.168.1.20", "ip.addr==192.168.1.20"], ph: "un filtre", exp: "ip.addr == 192.168.1.20 limite à ton IP." },
      { type: "qcm", q: "Pour combiner « port 80 ET ton IP », que mets-tu entre les deux conditions ?", opts: ["||", "&&", "==", "+"], a: 1, exp: "&& combine les deux conditions par un ET." },
      { type: "vf", q: "En cliquant sur un champ TCP dans le volet des détails, Wireshark surligne les octets correspondants en bas.", a: true, exp: "Oui : cela relie la structure logique aux octets réels." }
    ],
    solution: `<pre class="pseudo"># Premiere capture, pas a pas :
1. Choisir l'interface (Wi-Fi/Ethernet) -> nageoire bleue (start)
2. Ouvrir une page web (port 80) pour generer du trafic
3. Filtre d'affichage :  tcp.port == 80 &amp;&amp; ip.addr == 192.168.1.20
4. Cliquer un paquet -> lire les 3 volets (liste | details | octets)
5. Carre rouge (stop) -> Fichier -> Enregistrer (.pcapng)</pre>
<p>Tu sais capturer, filtrer et lire une trame. Demain, on repère un vrai 3-way handshake dans une capture.</p>`
  }
};
</script>
