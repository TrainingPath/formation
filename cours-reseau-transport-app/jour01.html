<script>
var DAY = {
  num: 1,
  title: "Monter dans les couches : transport et applications",
  subtitle: "On quitte les câbles et les adresses pour arriver là où vivent les logiciels.",
  theory: `
<h3>1. Un rappel : pourquoi des couches ?</h3>
<p>Un réseau est trop compliqué pour être pensé d'un seul bloc. On le découpe donc en <strong>couches</strong> (en anglais <em>layers</em>), chacune responsable d'un petit métier. Le modèle de référence s'appelle <strong>OSI</strong> (« Open Systems Interconnection ») et compte 7 couches, numérotées du bas vers le haut : 1 physique, 2 liaison, 3 réseau, 4 transport, 5 session, 6 présentation, 7 application. Chaque couche rend un service à celle du dessus et s'appuie sur celle du dessous, comme les étages d'un immeuble.</p>
<p>Une bonne image : envoyer un colis. La couche basse, ce sont les routes et les camions (le physique) ; au-dessus, le tri par ville (l'adressage) ; encore au-dessus, la façon d'emballer et de découper la marchandise ; et tout en haut, la lettre que le destinataire va vraiment lire. Ce cours part de la couche 4 et monte jusqu'à la 7.</p>
<h3>2. Où s'arrête le réseau « pur »</h3>
<p>Les couches 1 à 3 amènent des <strong>paquets</strong> d'une machine à une autre grâce aux adresses <strong>IP</strong>. Mais IP sait seulement livrer à la bonne <em>machine</em> : il ignore quel <em>logiciel</em> doit recevoir les données. Sur ton ordinateur, un navigateur, un client mail et un jeu tournent en même temps. Qui reçoit quoi ? C'est justement le rôle des couches hautes, à partir du transport.</p>
<pre class="pseudo"># Le voyage d'une donnee, du haut vers le bas puis retour
Couche 7  Application   -> le logiciel (navigateur, mail...)
Couche 4  Transport     -> decoupe, remet dans l'ordre, aiguille vers le bon logiciel
Couche 3  Reseau (IP)   -> trouve la bonne machine
Couches 1-2 Liaison/Physique -> les cables, le Wi-Fi, les signaux</pre>
<h3>3. Transport (couche 4) et application (couche 7)</h3>
<p>La <strong>couche transport</strong> (couche 4) organise le dialogue entre deux logiciels situés sur des machines différentes. Elle découpe les gros messages, les numérote, et surtout les dirige vers le bon programme. Ses deux protocoles vedettes sont <strong>TCP</strong> et <strong>UDP</strong>, que nous étudierons en détail.</p>
<p>La <strong>couche application</strong> (couche 7) est celle que tu utilises tous les jours sans le savoir : <strong>HTTP</strong> pour le web, <strong>SMTP</strong> pour envoyer un e-mail, <strong>DNS</strong> pour traduire un nom en adresse. Ces protocoles ne se soucient pas des câbles : ils font confiance aux couches du dessous pour transporter leurs messages.</p>
<div class="tip">On dit souvent « TCP/IP » : IP (couche 3) trouve la machine, TCP (couche 4) trouve le bon logiciel et garantit la livraison. Les deux forment le duo au cœur d'Internet.</div>
<h3>4. Encapsulation : des poupées russes</h3>
<p>Chaque couche ajoute son propre <strong>en-tête</strong> (en anglais <em>header</em>) autour des données de la couche du dessus, comme des enveloppes emboîtées. On appelle cela l'<strong>encapsulation</strong>. À l'arrivée, chaque couche retire son enveloppe et transmet le contenu à la couche supérieure : c'est la <strong>décapsulation</strong>.</p>
<div class="warn">Le modèle OSI est une carte mentale, pas un logiciel. Sur le terrain, Internet suit le modèle <strong>TCP/IP</strong> (4 couches), plus simple. Retiens surtout l'idée : chaque niveau a un rôle précis et parle à son voisin direct.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># OSI : 7 couches, de la 1 (physique) a la 7 (application)
# Couches 1-3 : amener les paquets a la bonne MACHINE (IP)
# Couche 4 (transport) : amener au bon LOGICIEL (TCP / UDP)
# Couche 7 (application) : HTTP, SMTP, DNS... ce qu'on utilise
# Encapsulation : chaque couche ajoute son en-tete (enveloppe)</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de couches compte le modèle OSI ?", opts: ["4", "5", "7", "10"], a: 2, exp: "OSI définit 7 couches, de la physique (1) à l'application (7)." },
    { type: "qcm", q: "Quel est le numéro de la couche transport ?", opts: ["2", "3", "4", "7"], a: 2, exp: "Le transport est la couche 4, juste au-dessus de la couche réseau (IP)." },
    { type: "input", q: "Quel protocole de la couche 3 amène les paquets à la bonne machine (sigle) ?", a: ["ip"], ph: "2 lettres", exp: "IP (Internet Protocol) assure l'adressage de machine à machine." },
    { type: "vf", q: "IP sait à quel logiciel précis livrer les données sur la machine de destination.", a: false, exp: "Non : IP livre à la bonne machine. C'est la couche transport qui vise le bon logiciel." },
    { type: "qcm", q: "Quels sont les deux protocoles vedettes de la couche transport ?", opts: ["HTTP et DNS", "TCP et UDP", "IP et Ethernet", "SMTP et FTP"], a: 1, exp: "TCP et UDP sont les deux protocoles de transport (couche 4)." },
    { type: "qcm", q: "À quelle couche appartient HTTP (le web) ?", opts: ["Couche 1 (physique)", "Couche 3 (réseau)", "Couche 4 (transport)", "Couche 7 (application)"], a: 3, exp: "HTTP est un protocole applicatif, en couche 7." },
    { type: "input", q: "Comment appelle-t-on le fait qu'une couche ajoute son en-tête autour des données de la couche supérieure ?", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation emboîte les en-têtes comme des enveloppes successives." },
    { type: "vf", q: "Chaque couche du modèle OSI dialogue directement avec sa voisine immédiate (celle juste au-dessus ou en dessous).", a: true, exp: "Oui : une couche rend service à celle du dessus et utilise celle du dessous." },
    { type: "qcm", q: "Que fait la couche transport que la couche réseau ne fait pas ?", opts: ["Elle pose les câbles", "Elle dirige les données vers le bon logiciel", "Elle attribue les adresses IP", "Elle génère l'électricité"], a: 1, exp: "Le transport aiguille vers le bon programme et gère la livraison." },
    { type: "input", q: "Quel sigle désigne le modèle de référence à 7 couches ?", a: ["osi"], ph: "3 lettres", exp: "OSI : Open Systems Interconnection." },
    { type: "vf", q: "Le modèle OSI est un logiciel installé sur chaque ordinateur.", a: false, exp: "Non : c'est un modèle conceptuel, une carte mentale. Internet suit plutôt TCP/IP." },
    { type: "qcm", q: "Dans « TCP/IP », qui trouve la bonne machine ?", opts: ["TCP", "IP", "HTTP", "DNS"], a: 1, exp: "IP (couche 3) adresse la machine ; TCP (couche 4) gère le dialogue et la fiabilité." },
    { type: "qcm", q: "Comment appelle-t-on le retrait des en-têtes couche par couche à l'arrivée ?", opts: ["L'encapsulation", "La décapsulation", "La compression", "Le routage"], a: 1, exp: "La décapsulation retire chaque enveloppe pour remonter vers l'application." },
    { type: "input", q: "Quel protocole applicatif traduit un nom de domaine en adresse IP (sigle) ?", a: ["dns"], ph: "3 lettres", exp: "DNS (Domain Name System) fait la traduction nom -> adresse IP." },
    { type: "qcm", q: "Ce cours part de quelle couche pour monter ?", opts: ["De la couche 1", "De la couche 3", "De la couche 4", "De la couche 7 vers le bas"], a: 2, exp: "On démarre au transport (couche 4) et on monte jusqu'à l'application." }
  ],
  final: {
    title: "Exercice final — Situer chaque acteur dans les couches",
    intro: `<p>Tu ouvres ton navigateur et tu tapes une adresse de site. En coulisses, plusieurs couches entrent en jeu. Replaçons chaque élément à son étage.</p>`,
    questions: [
      { type: "qcm", q: "Le navigateur qui affiche la page appartient à quelle couche ?", opts: ["Couche 1", "Couche 3", "Couche 4", "Couche 7 (application)"], a: 3, exp: "Le logiciel visible est en couche application (7)." },
      { type: "input", q: "Quel protocole de couche 3 achemine les paquets jusqu'au serveur (sigle) ?", a: ["ip"], ph: "2 lettres", exp: "IP transporte les paquets de machine à machine." },
      { type: "qcm", q: "Qui, sur le serveur, garantit que les données arrivent au bon logiciel et dans le bon ordre ?", opts: ["La couche physique", "La couche transport (4)", "Le câble", "L'écran"], a: 1, exp: "La couche transport aiguille et fiabilise la livraison." },
      { type: "vf", q: "Chaque couche ajoute son en-tête avant de passer les données à la couche du dessous.", a: true, exp: "Oui : c'est l'encapsulation, enveloppe après enveloppe." },
      { type: "qcm", q: "À l'arrivée, dans quel ordre les couches sont-elles traversées ?", opts: ["De la 7 vers la 1", "De la 1 vers la 7", "Uniquement la 4", "Aucun ordre précis"], a: 1, exp: "En réception, on remonte de la couche 1 (signaux) vers la 7 (application)." }
    ],
    solution: `<pre class="pseudo"># Le chemin d'une requete web, etage par etage :
Couche 7  Application -> le navigateur prepare la requete (HTTP)
Couche 4  Transport   -> TCP decoupe, numerote, vise le bon logiciel
Couche 3  Reseau      -> IP adresse le serveur et route les paquets
Couches 1-2           -> cables/Wi-Fi transportent les signaux
# A l'arrivee, on remonte : 1 -> 2 -> 3 -> 4 -> 7 (decapsulation)</pre>
<p>Tu sais maintenant que le réseau « bas » livre à la machine, et que les couches hautes livrent au bon logiciel. Demain : le modèle client / serveur.</p>`
  }
};
