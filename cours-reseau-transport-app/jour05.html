<script>
var DAY = {
  num: 5,
  title: "Ports bien connus, enregistrés, dynamiques",
  subtitle: "Trois grandes plages, et une poignée de numéros à retenir par cœur.",
  theory: `
<h3>1. Trois familles de ports</h3>
<p>Les 65536 ports possibles (0 à 65535) sont rangés en <strong>trois plages</strong> par l'organisme qui coordonne Internet (l'<strong>IANA</strong>). Cette organisation évite le désordre : chaque famille a un usage.</p>
<pre class="pseudo"># Les trois familles de ports (a memoriser)
0     - 1023    Ports BIEN CONNUS (well-known)   -> grands services standards
1024  - 49151   Ports ENREGISTRES (registered)   -> logiciels precis, editeurs
49152 - 65535   Ports DYNAMIQUES (ephemeres)     -> cote client, temporaires</pre>
<h3>2. Les ports bien connus (0 à 1023)</h3>
<p>Les <strong>ports bien connus</strong> (en anglais <em>well-known ports</em>) vont de <strong>0 à 1023</strong>. Ils sont réservés aux grands services universels : web, mail, DNS, connexion à distance. Sur les systèmes classiques, il faut des droits d'administrateur pour ouvrir un service dans cette plage, ce qui protège ces numéros sensibles. Ce sont ceux qu'il faut connaître.</p>
<pre class="pseudo"># Ports bien connus a retenir absolument
22   SSH    -> connexion a distance securisee
25   SMTP   -> envoi d'e-mail
53   DNS    -> traduction nom &lt;-&gt; adresse IP
80   HTTP   -> web (non securise)
443  HTTPS  -> web securise (chiffre)</pre>
<h3>3. Les ports enregistrés (1024 à 49151)</h3>
<p>Les <strong>ports enregistrés</strong> (en anglais <em>registered ports</em>) vont de <strong>1024 à 49151</strong>. Des éditeurs de logiciels y déclarent officiellement le port de leur application, pour éviter les collisions. Exemples : 3306 pour la base de données MySQL, 3389 pour le bureau à distance de Windows, 8080 souvent utilisé par des serveurs web de développement. Ils n'exigent pas de droits d'administrateur.</p>
<h3>4. Les ports dynamiques (49152 à 65535)</h3>
<p>Les <strong>ports dynamiques</strong> (ou <em>éphémères</em>, en anglais <em>dynamic / ephemeral ports</em>) vont de <strong>49152 à 65535</strong>. Le système les attribue automatiquement et temporairement au <strong>client</strong> pour la durée d'un échange. Quand tu ouvres une page web, ton ordinateur choisit un port éphémère comme port source, puis le libère une fois la connexion terminée. Personne ne les réserve : ils tournent en permanence.</p>
<div class="tip">Truc mnémotechnique pour les frontières : <strong>0–1023</strong> (bien connus), <strong>1024–49151</strong> (enregistrés), <strong>49152–65535</strong> (dynamiques). La première frontière (1023/1024) et la valeur haute (65535) sont les plus utiles à retenir.</div>
<div class="warn">Ces plages sont une <strong>convention</strong>, pas une loi physique. Techniquement, un logiciel pourrait détourner un numéro. Mais respecter les conventions garantit que tout le monde se comprend : lancer son serveur web sur 80 ou 443, c'est parler la langue commune.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 0     - 1023   : bien connus (well-known)   -> HTTP 80, HTTPS 443,
#                                                 SSH 22, DNS 53, SMTP 25
# 1024  - 49151  : enregistres (registered)   -> ex MySQL 3306
# 49152 - 65535  : dynamiques / ephemeres     -> ports clients temporaires
# IANA coordonne l'attribution des numeros de port.</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la plage des ports « bien connus » ?", opts: ["0 à 1023", "1024 à 49151", "49152 à 65535", "0 à 65535"], a: 0, exp: "Les well-known ports vont de 0 à 1023." },
    { type: "input", q: "Sur quel port écoute un serveur web en HTTP (non sécurisé) ?", a: ["80"], ph: "un nombre", exp: "HTTP utilise le port 80 par convention." },
    { type: "input", q: "Sur quel port écoute le web sécurisé HTTPS ?", a: ["443"], ph: "un nombre", exp: "HTTPS (web chiffré) utilise le port 443." },
    { type: "qcm", q: "Quel service utilise le port 22 ?", opts: ["DNS", "SSH (connexion à distance)", "SMTP", "HTTP"], a: 1, exp: "SSH, la connexion distante sécurisée, écoute sur le port 22." },
    { type: "input", q: "Sur quel port fonctionne le DNS (traduction nom vers IP) ?", a: ["53"], ph: "un nombre", exp: "Le DNS utilise le port 53." },
    { type: "input", q: "Quel port utilise SMTP pour l'envoi d'e-mail ?", a: ["25"], ph: "un nombre", exp: "SMTP (envoi de courrier) utilise historiquement le port 25." },
    { type: "qcm", q: "Quelle est la plage des ports enregistrés (registered) ?", opts: ["0 à 1023", "1024 à 49151", "49152 à 65535", "1024 à 65535"], a: 1, exp: "Les ports enregistrés vont de 1024 à 49151." },
    { type: "qcm", q: "Quelle est la plage des ports dynamiques (éphémères) ?", opts: ["0 à 1023", "1024 à 49151", "49152 à 65535", "80 à 443"], a: 2, exp: "Les ports dynamiques vont de 49152 à 65535." },
    { type: "vf", q: "Les ports dynamiques sont surtout attribués automatiquement au client pour la durée d'un échange.", a: true, exp: "Oui : ce sont des ports éphémères, choisis puis libérés." },
    { type: "qcm", q: "Quel organisme coordonne l'attribution des numéros de port ?", opts: ["L'IETF seule", "L'IANA", "L'ISO seule", "Le W3C"], a: 1, exp: "L'IANA gère l'attribution officielle des ports." },
    { type: "vf", q: "Ouvrir un service sur un port bien connu (0-1023) demande souvent des droits d'administrateur.", a: true, exp: "Oui : cette protection réserve les numéros sensibles." },
    { type: "input", q: "Sur quel port écoute par défaut la base de données MySQL (nombre) ?", a: ["3306"], ph: "un nombre", exp: "MySQL utilise le port 3306, un port enregistré." },
    { type: "qcm", q: "Quelle est la frontière entre ports bien connus et enregistrés ?", opts: ["Entre 255 et 256", "Entre 1023 et 1024", "Entre 49151 et 49152", "Entre 80 et 81"], a: 1, exp: "0-1023 = bien connus ; 1024 commence les enregistrés." },
    { type: "vf", q: "Les plages de ports sont une loi physique impossible à contourner.", a: false, exp: "Non : c'est une convention. La respecter permet à tous de se comprendre." },
    { type: "qcm", q: "Parmi ces couples, lequel est correct ?", opts: ["HTTP = 443", "HTTPS = 80", "SSH = 22", "DNS = 25"], a: 2, exp: "SSH = 22. (HTTP=80, HTTPS=443, DNS=53, SMTP=25.)" }
  ],
  final: {
    title: "Exercice final — Classer les ports",
    intro: `<p>Tom configure un petit serveur. Il croise plusieurs numéros de port et doit les classer dans la bonne famille et reconnaître les services.</p>`,
    questions: [
      { type: "qcm", q: "Il veut servir un site en HTTPS. Quel port choisir ?", opts: ["80", "443", "22", "3306"], a: 1, exp: "HTTPS = port 443." },
      { type: "input", q: "Il veut aussi se connecter à distance de façon sécurisée. Quel port SSH ?", a: ["22"], ph: "un nombre", exp: "SSH écoute sur le port 22." },
      { type: "qcm", q: "Le port 3306 de sa base MySQL appartient à quelle famille ?", opts: ["Bien connus (0-1023)", "Enregistrés (1024-49151)", "Dynamiques (49152-65535)", "Ports privés réservés au système"], a: 1, exp: "3306 est dans la plage des ports enregistrés." },
      { type: "vf", q: "Quand un visiteur charge son site, le navigateur du visiteur utilise un port dynamique (49152-65535) comme port source.", a: true, exp: "Oui : le client se voit attribuer un port éphémère temporaire." },
      { type: "qcm", q: "Pour que son serveur DNS fonctionne, sur quel port doit-il écouter ?", opts: ["25", "53", "80", "443"], a: 1, exp: "Le DNS écoute sur le port 53." }
    ],
    solution: `<pre class="pseudo"># Le plan de ports de Tom :
443   HTTPS  -> site web securise (bien connu, 0-1023)
22    SSH    -> administration a distance (bien connu)
53    DNS    -> resolution de noms (bien connu)
3306  MySQL  -> base de donnees (enregistre, 1024-49151)
Cote visiteur : port source pris dans 49152-65535 (dynamique).</pre>
<p>Trois familles, quelques numéros clés (80, 443, 22, 53, 25) : c'est la carte d'identité des services. Demain : le socket, qui réunit IP et port.</p>`
  }
};
