var DAY = {
  num: 18,
  title: "NAT statique et dynamique",
  subtitle: "Traduire une adresse privée en publique : une correspondance figée, ou piochée dans un pool.",
  theory: `
<h3>1. Rappel : à quoi sert le NAT</h3>
<p>Le <strong>NAT</strong> (en anglais <em>Network Address Translation</em>) réécrit l'adresse IP source d'un paquet quand il passe du réseau privé vers Internet. À l'intérieur, une machine a une adresse privée (par exemple <code>192.168.1.20</code>) ; en sortant, le routeur remplace cette adresse par une adresse publique. Quand la réponse revient, le routeur fait l'opération inverse pour retrouver la bonne machine. Il existe plusieurs façons de choisir la correspondance : c'est ce qui distingue le NAT <strong>statique</strong> du NAT <strong>dynamique</strong>.</p>
<h3>2. Le NAT statique : une correspondance 1:1 figée</h3>
<p>Dans le <strong>NAT statique</strong> (en anglais <em>static NAT</em>), on associe <strong>une adresse privée précise à une adresse publique précise</strong>, de façon permanente. C'est une correspondance <strong>un pour un</strong> (1:1) qui ne change pas : la machine <code>192.168.1.20</code> sera <em>toujours</em> vue comme <code>203.0.113.20</code>, et réciproquement.</p>
<pre class="pseudo"># NAT statique : table figee, definie a la main
# IP privee        <-->  IP publique
192.168.1.20      <-->  203.0.113.20
192.168.1.21      <-->  203.0.113.21
# La correspondance est reservee en permanence, meme si la machine est eteinte.</pre>
<div class="tip">Avantage clé : comme l'adresse publique est fixe et réservée, on peut joindre la machine <em>depuis l'extérieur</em>. C'est idéal pour un <strong>serveur</strong> (web, mail) qui doit être accessible en permanence à une adresse connue.</div>
<h3>3. Le NAT dynamique : piocher dans un pool</h3>
<p>Dans le <strong>NAT dynamique</strong> (en anglais <em>dynamic NAT</em>), le routeur dispose d'un <strong>groupe d'adresses publiques</strong> — appelé <strong>pool</strong> (« réservoir »). Quand une machine interne veut sortir, le routeur lui <strong>attribue temporairement</strong> une adresse publique libre du pool. Quand la session est terminée, l'adresse retourne dans le pool et pourra servir à quelqu'un d'autre.</p>
<pre class="pseudo"># NAT dynamique : pool d'adresses publiques partagees
Pool public = { 203.0.113.10 , 203.0.113.11 , 203.0.113.12 }

192.168.1.30 sort  -> on lui prete 203.0.113.10  (temporaire)
192.168.1.31 sort  -> on lui prete 203.0.113.11  (temporaire)
# Quand 192.168.1.30 a fini, 203.0.113.10 revient dans le pool.</pre>
<div class="warn">Toujours du <strong>1:1 à un instant donné</strong> : chaque adresse publique du pool ne sert qu'à une machine privée à la fois. Si le pool a 3 adresses, seules 3 machines peuvent sortir <em>simultanément</em>. Une 4ᵉ devra attendre. Le NAT dynamique n'économise donc pas énormément d'adresses — c'est la PAT (jour suivant) qui fera mieux.</div>
<h3>4. Statique ou dynamique : lequel choisir ?</h3>
<p>Le <strong>statique</strong> sert quand on veut qu'une machine soit <strong>joignable de l'extérieur à une adresse fixe</strong> (serveurs). Le <strong>dynamique</strong> sert quand on a un <strong>groupe d'utilisateurs</strong> qui sortent vers Internet et pour qui l'adresse publique exacte n'a pas d'importance, tant qu'ils en obtiennent une. Dans les deux cas, la correspondance reste de type 1:1 (une privée pour une publique) ; ce qui change, c'est <em>fixe et réservée</em> (statique) contre <em>prêtée à la demande</em> (dynamique).</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># NAT STATIQUE  : 1:1 fige, permanent (privee X <-> publique Y toujours)
#                -> pour un SERVEUR joignable de l'exterieur
# NAT DYNAMIQUE : 1:1 temporaire, pioche dans un POOL d'adresses publiques
#                -> pour des utilisateurs qui SORTENT vers Internet
# Limite du dynamique : pas plus de machines simultanees que d'adresses du pool</pre>`,
  exercises: [
    { type: "qcm", q: "Le NAT statique établit une correspondance…", opts: ["Aléatoire à chaque paquet", "Un pour un (1:1) fixe et permanente", "Un pour plusieurs", "Uniquement sortante"], a: 1, exp: "Statique = une privée pour une publique, figée en permanence." },
    { type: "input", q: "Comment appelle-t-on (un mot anglais courant) le groupe d'adresses publiques dans lequel pioche le NAT dynamique ?", a: ["pool", "un pool", "le pool"], ph: "un mot", exp: "Le pool est le réservoir d'adresses publiques partagées." },
    { type: "vf", q: "En NAT statique, la machine 192.168.1.20 est toujours traduite vers la même adresse publique.", a: true, exp: "Oui : la correspondance est figée en permanence." },
    { type: "qcm", q: "Quel NAT convient à un serveur web qui doit être joignable de l'extérieur à une adresse connue ?", opts: ["NAT dynamique", "NAT statique", "La PAT (surcharge de ports)", "Une attribution DHCP publique"], a: 1, exp: "Le statique donne une adresse publique fixe et réservée, donc joignable de l'extérieur." },
    { type: "qcm", q: "En NAT dynamique, une adresse publique du pool est attribuée…", opts: ["Définitivement à une seule machine", "Temporairement, puis rendue au pool", "À toutes les machines en même temps", "Selon l'adresse MAC de la machine"], a: 1, exp: "Elle est prêtée le temps d'une session puis rejoint le pool." },
    { type: "vf", q: "Un pool de 3 adresses publiques permet à 100 machines de sortir en même temps.", a: false, exp: "Non : au plus 3 machines simultanément (1:1 à un instant donné). La PAT réglera ce point." },
    { type: "input", q: "Le NAT ___ est celui dont la correspondance privée-publique est fixée manuellement et permanente.", a: ["statique", "static"], ph: "un adjectif", exp: "NAT statique = correspondance 1:1 figée." },
    { type: "qcm", q: "Point commun entre NAT statique et NAT dynamique ?", opts: ["Ils partagent une seule IP entre plusieurs machines simultanément", "Chaque adresse publique ne sert qu'à une machine à la fois (1:1)", "Ils n'utilisent aucune adresse publique", "Ils chiffrent les données"], a: 1, exp: "Les deux sont du 1:1 à un instant donné ; c'est la PAT qui fait du plusieurs-pour-un." },
    { type: "qcm", q: "En NAT dynamique, que se passe-t-il quand toutes les adresses du pool sont prises ?", opts: ["Rien, c'est illimité", "Les nouvelles machines ne peuvent pas sortir tant qu'une adresse ne se libère pas", "Le routeur bascule automatiquement en PAT", "Le pool devient statique"], a: 1, exp: "Le pool est fini : plus d'adresse libre signifie attendre qu'une se libère." },
    { type: "vf", q: "Le NAT statique réserve l'adresse publique même quand la machine interne est éteinte.", a: true, exp: "Oui : la correspondance est permanente, donc l'adresse reste réservée." },
    { type: "input", q: "Quel type de NAT utilise-t-on plutôt pour un groupe d'utilisateurs qui ne font que sortir vers Internet ?", a: ["dynamique", "nat dynamique", "dynamic"], ph: "un adjectif", exp: "Le NAT dynamique prête une adresse du pool à la demande." },
    { type: "qcm", q: "203.0.113.20 est une adresse…", opts: ["Privée", "Publique (destinée à Internet)", "MAC", "Multicast"], a: 1, exp: "203.0.113.0/24 est un bloc public (documentation), utilisé ici côté Internet." },
    { type: "qcm", q: "Différence essentielle entre statique et dynamique ?", opts: ["Statique = réservé/permanent ; dynamique = prêté à la demande depuis un pool", "Statique chiffre, dynamique non", "Statique est plus lent", "Il n'y a aucune différence"], a: 0, exp: "L'un fige la correspondance, l'autre la loue temporairement." },
    { type: "vf", q: "Le NAT dynamique économise beaucoup d'adresses publiques par rapport au nombre total de machines.", a: false, exp: "Non : il reste du 1:1 simultané. C'est la PAT (surcharge) qui économise vraiment." },
    { type: "input", q: "En NAT statique, quel est le rapport entre nombre d'adresses privées et publiques traduites ? (chiffre:chiffre)", a: ["1:1", "1 pour 1", "un pour un", "1 1"], ph: "x:y", exp: "Statique = correspondance 1:1." }
  ],
  final: {
    title: "Exercice final — Concevoir le NAT d'une PME",
    intro: `<p>Une PME possède 4 adresses publiques : <code>203.0.113.1</code> à <code>203.0.113.4</code>. Elle héberge un serveur web interne (<code>192.168.0.10</code>) qui doit rester joignable, et 30 postes de bureau qui sortent sur Internet.</p>`,
    questions: [
      { type: "qcm", q: "Pour le serveur web joignable de l'extérieur, quel NAT choisir ?", opts: ["Dynamique", "Statique (1:1 fixe)", "La PAT (surcharge de ports)", "Un pool dynamique d'une seule adresse"], a: 1, exp: "Le serveur a besoin d'une adresse publique fixe et réservée : NAT statique." },
      { type: "input", q: "Réservons 203.0.113.1 au serveur. Comment appelle-t-on ce type de correspondance permanente 1:1 ?", a: ["nat statique", "statique", "static"], ph: "deux mots", exp: "C'est un NAT statique : 192.168.0.10 <-> 203.0.113.1 en permanence." },
      { type: "qcm", q: "Il reste 3 adresses publiques pour les 30 postes en NAT dynamique. Combien peuvent sortir EN MÊME TEMPS ?", opts: ["30", "3", "Illimité", "0"], a: 1, exp: "Le pool a 3 adresses : 3 postes simultanés maximum en NAT dynamique." },
      { type: "vf", q: "Avec seulement du NAT dynamique, les 30 postes pourraient tous naviguer simultanément.", a: false, exp: "Non : le pool de 3 adresses limite à 3 sorties simultanées." },
      { type: "qcm", q: "Quelle technique (vue au prochain jour) permettrait aux 30 postes de partager UNE seule IP publique ?", opts: ["Le NAT statique", "La PAT (surcharge)", "Le NAT dynamique", "Le port forwarding"], a: 1, exp: "La PAT (NAT overload) partage une IP publique entre de nombreuses machines via les ports." }
    ],
    solution: `<pre class="pseudo"># Plan NAT de la PME :
# Serveur web  : NAT STATIQUE  192.168.0.10 <-> 203.0.113.1  (permanent)
# 30 postes    : NAT DYNAMIQUE pool { 203.0.113.2, .3, .4 }
#   -> 3 sorties simultanees maximum (limite du dynamique)
# Pour depasser cette limite : passer a la PAT (une IP publique + ports).</pre>
<p>On voit vite la limite du NAT dynamique en 1:1. Demain, la PAT résout ce goulot en jouant sur les numéros de port.</p>`
  }
};
