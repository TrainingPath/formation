<script>
var DAY = {
  num: 27,
  title: "Le courrier électronique (SMTP, IMAP, POP)",
  subtitle: "Qui envoie, qui relève : les trois protocoles derrière chaque e-mail.",
  theory: `
<h3>1. Deux gestes, trois protocoles</h3>
<p>Le courriel repose sur une idée simple : <strong>envoyer</strong> un message et <strong>le relever</strong> sont deux gestes différents, confiés à des protocoles différents. Un seul protocole sert à <em>expédier</em> : <strong>SMTP</strong>. Deux protocoles servent à <em>consulter</em> sa boîte : <strong>IMAP</strong> et <strong>POP</strong>. Comme à la poste : déposer une lettre (SMTP) n'a rien à voir avec ouvrir sa boîte aux lettres (IMAP/POP).</p>
<h3>2. SMTP : l'expédition</h3>
<p><strong>SMTP</strong> (<em>Simple Mail Transfer Protocol</em>) transporte le message de ton logiciel vers ton serveur d'envoi, puis de serveur en serveur jusqu'au serveur du destinataire. C'est le <strong>facteur</strong> du courriel : il ne s'occupe que de l'acheminement, jamais de la lecture. Historiquement, SMTP écoute sur le <strong>port 25</strong> (utilisé aujourd'hui surtout entre serveurs). Pour la soumission d'un message par un client (ton téléphone, Thunderbird), on emploie le <strong>port 587</strong>, avec authentification et chiffrement.</p>
<pre class="pseudo"># Dialogue SMTP (simplifié) :
HELO client.exemple.fr
MAIL FROM:&lt;alice@exemple.fr&gt;
RCPT TO:&lt;bob@autre.fr&gt;
DATA
Subject: Bonjour
... corps du message ...
.
QUIT</pre>
<h3>3. POP : relever et rapatrier</h3>
<p><strong>POP</strong> (<em>Post Office Protocol</em>, version 3 : POP3) télécharge les messages du serveur vers <strong>un seul appareil</strong>, puis, par défaut, les <strong>efface du serveur</strong>. C'est le modèle « je vide ma boîte aux lettres et j'emporte tout chez moi ». Simple, économe en espace serveur, mais mal adapté si tu consultes le même compte depuis le téléphone et l'ordinateur : ce qui est rapatrié sur l'un disparaît pour l'autre. POP écoute sur le <strong>port 110</strong> (en clair) ou <strong>995</strong> (chiffré par TLS).</p>
<h3>4. IMAP : consulter en laissant sur le serveur</h3>
<p><strong>IMAP</strong> (<em>Internet Message Access Protocol</em>) laisse les messages <strong>sur le serveur</strong> et les <strong>synchronise</strong> entre tous tes appareils. Lu sur le téléphone, un mail apparaît lu sur l'ordinateur ; les dossiers, les brouillons, tout est reflété partout. C'est le modèle dominant aujourd'hui. IMAP écoute sur le <strong>port 143</strong> (en clair) ou <strong>993</strong> (chiffré par TLS).</p>
<div class="tip">Moyen mnémotechnique : <strong>P</strong>OP « <strong>P</strong>rend et Part » (rapatrie et efface) ; <strong>I</strong>MAP « <strong>I</strong>ci et partout, ça reste » (synchronise, garde sur le serveur).</div>
<h3>5. Récapitulatif des ports</h3>
<pre class="pseudo"># ENVOI (SMTP)
  25   SMTP entre serveurs (relais)
  587  Soumission par un client (authentifié)
# RELÈVE
  IMAP :  143  (clair)   |  993  (TLS)   -> synchronise, garde sur le serveur
  POP  :  110  (clair)   |  995  (TLS)   -> rapatrie puis efface</pre>
<div class="warn">Ne confonds pas les rôles : SMTP ne sert JAMAIS à lire des messages, et IMAP/POP ne servent JAMAIS à en envoyer. Un logiciel de messagerie configure donc toujours un serveur d'envoi (SMTP) ET un serveur de relève (IMAP ou POP), séparément.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SMTP = envoyer      (25 entre serveurs, 587 depuis un client)
# IMAP = consulter, laisse sur le serveur, synchronise (143 / 993 TLS)
# POP  = rapatrie puis efface, un seul appareil        (110 / 995 TLS)
# Toujours : un serveur d'ENVOI (SMTP) + un serveur de RELÈVE (IMAP/POP)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel protocole sert à ENVOYER un courriel ?", opts: ["IMAP", "POP", "SMTP", "HTTP"], a: 2, exp: "SMTP (Simple Mail Transfer Protocol) est le protocole d'expédition." },
    { type: "qcm", q: "Que fait POP par défaut après avoir téléchargé les messages ?", opts: ["Il les garde sur le serveur", "Il les efface du serveur", "Il les envoie à un autre serveur", "Il les chiffre"], a: 1, exp: "POP rapatrie les messages sur l'appareil puis, par défaut, les supprime du serveur." },
    { type: "input", q: "Quel protocole de relève synchronise les messages entre plusieurs appareils en les laissant sur le serveur ?", a: ["imap", "l'imap"], ph: "4 lettres", exp: "IMAP laisse les messages sur le serveur et les synchronise partout." },
    { type: "qcm", q: "Sur quel port un CLIENT soumet-il un message à envoyer (SMTP submission) ?", opts: ["25", "110", "587", "993"], a: 2, exp: "Le port 587 est dédié à la soumission authentifiée par un client ; le 25 sert surtout entre serveurs." },
    { type: "vf", q: "IMAP peut servir à envoyer des courriels.", a: false, exp: "Faux : IMAP ne sert qu'à consulter/relever. L'envoi passe toujours par SMTP." },
    { type: "input", q: "Quel est le port IMAP chiffré par TLS ?", a: ["993", "port 993"], ph: "un numéro", exp: "IMAP over TLS utilise le port 993 (143 en clair)." },
    { type: "qcm", q: "Quel port historique SMTP est surtout utilisé aujourd'hui entre serveurs (relais) ?", opts: ["25", "143", "465", "995"], a: 0, exp: "Le port 25 sert à l'acheminement entre serveurs (relais SMTP)." },
    { type: "vf", q: "POP est bien adapté quand on consulte le même compte depuis plusieurs appareils.", a: false, exp: "Faux : POP rapatrie et efface, donc les autres appareils ne voient plus les messages. IMAP convient mieux." },
    { type: "input", q: "Quel est le port POP3 chiffré par TLS ?", a: ["995", "port 995"], ph: "un numéro", exp: "POP3 over TLS utilise le port 995 (110 en clair)." },
    { type: "qcm", q: "Que signifie le sigle IMAP ?", opts: ["Internet Mail Access Port", "Internet Message Access Protocol", "Internal Mail Application Protocol", "Instant Message And Post"], a: 1, exp: "IMAP = Internet Message Access Protocol." },
    { type: "qcm", q: "Un logiciel de messagerie configure généralement…", opts: ["Seulement un serveur SMTP", "Seulement un serveur IMAP", "Un serveur d'envoi (SMTP) ET un serveur de relève (IMAP ou POP)", "Un unique serveur qui fait tout via HTTP"], a: 2, exp: "L'envoi (SMTP) et la relève (IMAP/POP) sont configurés séparément." },
    { type: "vf", q: "Le port 143 est le port IMAP en clair (non chiffré).", a: true, exp: "Vrai : 143 = IMAP en clair, 993 = IMAP sur TLS." },
    { type: "input", q: "Quel protocole rapatrie les messages sur un seul appareil puis les efface du serveur (sigle) ?", a: ["pop", "pop3", "le pop"], ph: "3 lettres", exp: "POP (POP3) télécharge puis, par défaut, supprime du serveur." },
    { type: "qcm", q: "Sur le Wi-Fi, quelle paire de ports correspond à POP en clair puis chiffré ?", opts: ["143 / 993", "110 / 995", "25 / 587", "80 / 443"], a: 1, exp: "POP : 110 en clair, 995 sur TLS. (143/993 concernent IMAP.)" },
    { type: "vf", q: "SMTP peut être utilisé pour LIRE le contenu de sa boîte aux lettres.", a: false, exp: "Faux : SMTP ne fait qu'acheminer les envois. La lecture passe par IMAP ou POP." }
  ],
  final: {
    title: "Exercice final — Configurer un compte de messagerie",
    intro: `<p>Nadia installe sa messagerie sur son téléphone ET son ordinateur portable. Elle veut retrouver les mêmes courriels, lus ou non, sur les deux appareils. On lui demande de renseigner un serveur d'envoi et un serveur de relève, tous deux chiffrés (TLS).</p>`,
    questions: [
      { type: "qcm", q: "Quel protocole de relève doit-elle choisir pour synchroniser ses deux appareils ?", opts: ["POP", "IMAP", "SMTP", "FTP"], a: 1, exp: "IMAP laisse les messages sur le serveur et les synchronise entre appareils." },
      { type: "input", q: "Quel port TLS doit-elle indiquer pour la relève IMAP chiffrée ?", a: ["993", "port 993"], ph: "un numéro", exp: "IMAP over TLS = port 993." },
      { type: "qcm", q: "Quel protocole doit-elle configurer pour l'envoi de ses messages ?", opts: ["IMAP", "POP", "SMTP", "HTTP"], a: 2, exp: "L'envoi passe toujours par SMTP." },
      { type: "input", q: "Quel port utilise habituellement un client pour soumettre un message via SMTP ?", a: ["587", "port 587"], ph: "un numéro", exp: "La soumission client se fait sur le port 587." },
      { type: "vf", q: "Si elle avait choisi POP, lire un mail sur le téléphone l'aurait fait disparaître de l'ordinateur.", a: true, exp: "Vrai : POP rapatrie et efface du serveur, l'autre appareil ne le verrait plus. D'où le choix d'IMAP." }
    ],
    solution: `<pre class="pseudo"># Configuration de Nadia (deux appareils synchronisés) :
RELÈVE (consulter)  -> IMAP sur TLS,  port 993   (garde sur le serveur)
ENVOI  (expédier)   -> SMTP soumission, port 587 (authentifié + TLS)
# Pourquoi pas POP ? POP (110/995) rapatrie puis efface :
# un mail lu sur le téléphone disparaîtrait de l'ordinateur.</pre>
<p>IMAP pour lire partout, SMTP pour envoyer : deux serveurs, deux rôles. Le chiffrement TLS protège identifiants et contenus sur un réseau public.</p>`
  }
};
</script>
