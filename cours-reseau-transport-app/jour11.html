<script>
var DAY = {
  num: 11,
  title: "La fermeture d'une connexion TCP (FIN/ACK, four-way)",
  subtitle: "Fermer proprement, c'est prévenir des deux côtés avant de raccrocher.",
  theory: `
<h3>1. Fermer aussi se négocie</h3>
<p>Ouvrir une connexion TCP demandait trois messages (jour 9). La <strong>fermer proprement</strong> en demande généralement <strong>quatre</strong> : c'est le <strong>four-way handshake</strong> (« poignée de main en quatre temps »). Pourquoi quatre ? Parce qu'une connexion TCP est <strong>bidirectionnelle</strong> (full-duplex) : chaque sens doit être fermé <em>séparément</em>. C'est comme deux personnes au téléphone : chacune doit dire « j'ai fini » et entendre l'autre confirmer avant de raccrocher.</p>
<h3>2. Le drapeau FIN</h3>
<p>La fermeture repose sur le drapeau <strong>FIN</strong> (en anglais <em>finish</em>, « terminé »). Quand une extrémité n'a plus rien à envoyer, elle lève FIN : « je n'émettrai plus de données ». L'autre côté <strong>accuse réception</strong> avec ACK, puis, quand il a lui aussi terminé, envoie son propre FIN, à son tour acquitté.</p>
<pre class="pseudo"># Fermeture en 4 temps (le client decide de fermer) :
Client  --FIN-->        Serveur    (1) je n'emets plus
Client  &lt;--ACK--        Serveur    (2) bien recu
Client  &lt;--FIN--        Serveur    (3) moi non plus je n'emets plus
Client  --ACK-->        Serveur    (4) bien recu -> connexion fermee</pre>
<div class="tip">On voit souvent FIN et ACK <strong>combinés</strong> dans un même segment (FIN, ACK), ce qui peut réduire l'échange à trois segments visibles. Le principe reste : <strong>un FIN et un ACK par sens</strong>.</div>
<h3>3. Les états de fermeture</h3>
<p>TCP nomme précisément chaque étape. Celui qui envoie le premier FIN passe par <strong>FIN_WAIT</strong> ; celui qui le reçoit passe par <strong>CLOSE_WAIT</strong> puis <strong>LAST_ACK</strong>. Après le dernier ACK, l'initiateur reste un moment en <strong>TIME_WAIT</strong>.</p>
<pre class="pseudo"># Cote initiateur : ESTABLISHED -> FIN_WAIT_1 -> FIN_WAIT_2 -> TIME_WAIT -> CLOSED
# Cote recepteur  : ESTABLISHED -> CLOSE_WAIT -> LAST_ACK -> CLOSED</pre>
<h3>4. Pourquoi le TIME_WAIT ?</h3>
<p>Après avoir envoyé le dernier ACK, l'initiateur attend (typiquement quelques dizaines de secondes) dans l'état <strong>TIME_WAIT</strong>. Ce délai garantit que le dernier ACK est bien arrivé et que d'anciens segments retardataires ne viendront pas polluer une future connexion réutilisant le même couple de ports. C'est une précaution, pas un bug.</p>
<h3>5. La fermeture brutale : RST</h3>
<p>À l'opposé de cette fermeture polie, le drapeau <strong>RST</strong> (reset) coupe la connexion <strong>immédiatement, sans négociation</strong>. On l'utilise en cas d'erreur (port fermé, connexion invalide, plantage applicatif). C'est raccrocher au nez : plus rapide, mais aucune garantie que les données en transit soient traitées.</p>
<div class="warn">Beaucoup de connexions restées en CLOSE_WAIT côté serveur = souvent une application qui oublie de fermer ses sockets. Un RST reçu en pleine session signale, lui, une coupure brutale (crash, pare-feu, timeout).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Fermeture propre = four-way handshake (chaque sens se ferme) :
#   1. A -> B : FIN        3. B -> A : FIN
#   2. B -> A : ACK        4. A -> B : ACK
# FIN = \"je n'emets plus\" ; chaque FIN est acquitte (ACK).
# TIME_WAIT : attente de securite cote initiateur.
# RST = fermeture BRUTALE, sans negociation (erreur/refus).</pre>`,
  exercises: [
    { type: "qcm", q: "Comment appelle-t-on la fermeture propre d'une connexion TCP ?", opts: ["Le 3-way handshake", "Le four-way handshake (fermeture en 4 temps)", "Le broadcast", "Le reset"], a: 1, exp: "La fermeture propre se fait typiquement en quatre temps." },
    { type: "qcm", q: "Quel drapeau signifie « je n'émettrai plus de données » ?", opts: ["SYN", "ACK", "FIN", "RST"], a: 2, exp: "FIN (finish) annonce la fin de l'émission d'un côté." },
    { type: "vf", q: "Une connexion TCP est bidirectionnelle : chaque sens doit être fermé séparément.", a: true, exp: "Oui : d'où deux FIN (un par sens), chacun acquitté." },
    { type: "input", q: "Quel drapeau ferme brutalement une connexion, sans négociation ? (3 lettres)", a: ["rst", "reset"], ph: "3 lettres", exp: "RST (reset) coupe immédiatement, sans four-way." },
    { type: "qcm", q: "Pourquoi la fermeture demande-t-elle (jusqu'à) quatre segments ?", opts: ["Car TCP est lent", "Car chaque sens de la connexion doit être fermé et acquitté séparément", "Car il faut chiffrer", "Par pure convention"], a: 1, exp: "Full-duplex : un FIN et un ACK pour chaque direction." },
    { type: "qcm", q: "Que fait le récepteur juste après avoir reçu un FIN ?", opts: ["Il envoie un SYN", "Il accuse réception avec ACK", "Il ignore", "Il ouvre un nouveau port"], a: 1, exp: "Il acquitte le FIN avec un ACK, puis fermera son propre sens plus tard." },
    { type: "vf", q: "FIN et ACK peuvent être combinés dans un même segment.", a: true, exp: "Oui : on voit souvent un segment [FIN, ACK]." },
    { type: "input", q: "Dans quel état l'initiateur attend-il quelques instants après le dernier ACK ? (un mot avec tiret bas)", a: ["time_wait", "time wait", "timewait"], ph: "état TCP", exp: "L'état TIME_WAIT sécurise la fin de connexion." },
    { type: "qcm", q: "À quoi sert l'état TIME_WAIT ?", opts: ["À accélérer", "À s'assurer que le dernier ACK a été reçu et écarter d'anciens segments retardataires", "À chiffrer", "À changer d'IP"], a: 1, exp: "C'est une précaution contre les segments en retard et les ACK perdus." },
    { type: "qcm", q: "Un RST reçu en pleine session indique généralement…", opts: ["Une fermeture polie", "Une coupure brutale (crash, refus, pare-feu)", "Une ouverture", "Un acquittement normal"], a: 1, exp: "RST = raccrocher au nez : coupure brutale sans négociation." },
    { type: "vf", q: "Le four-way handshake utilise le drapeau SYN.", a: false, exp: "Non : SYN sert à l'ouverture. La fermeture utilise FIN (et ACK)." },
    { type: "input", q: "Dans quel état passe le côté qui a reçu un FIN mais qui a encore des données à envoyer ? (un mot avec tiret bas)", a: ["close_wait", "close wait", "closewait"], ph: "état TCP", exp: "CLOSE_WAIT : il a reçu le FIN de l'autre et prépare le sien." },
    { type: "qcm", q: "Beaucoup de sockets bloquées en CLOSE_WAIT côté serveur révèlent souvent…", opts: ["Un excès de vitesse", "Une application qui oublie de fermer ses connexions", "Un bon fonctionnement", "Un problème de câble"], a: 1, exp: "CLOSE_WAIT persistant = fermeture applicative manquante." },
    { type: "vf", q: "Fermer avec RST garantit que toutes les données en transit sont traitées.", a: false, exp: "Non : RST est brutal, aucune garantie sur les données en vol." },
    { type: "qcm", q: "Combien de drapeaux FIN circulent lors d'une fermeture propre complète ?", opts: ["Un seul", "Deux (un par sens)", "Quatre", "Aucun"], a: 1, exp: "Un FIN par direction : deux au total, chacun acquitté." }
  ],
  final: {
    title: "Exercice final — Lire une fermeture",
    intro: `<p>Une session TCP entre un client (A) et un serveur (B) touche à sa fin. Wireshark montre : A→B [FIN,ACK], B→A [ACK], puis B→A [FIN,ACK], enfin A→B [ACK]. Analysons.</p>`,
    questions: [
      { type: "qcm", q: "Qui a décidé de fermer en premier ?", opts: ["Le serveur B", "Le client A (il envoie le premier FIN)", "Le routeur", "Personne"], a: 1, exp: "A envoie le premier FIN : c'est l'initiateur de la fermeture." },
      { type: "input", q: "Quel drapeau porte le premier segment de A ? (3 lettres, celui qui ferme)", a: ["fin"], ph: "3 lettres", exp: "A lève FIN : il n'émettra plus de données." },
      { type: "vf", q: "B accuse réception du FIN de A avec un ACK avant d'envoyer son propre FIN.", a: true, exp: "Oui : chaque sens se ferme séparément, chaque FIN est acquitté." },
      { type: "qcm", q: "Après le dernier ACK de A, dans quel état A reste-t-il un moment ?", opts: ["LISTEN", "TIME_WAIT", "SYN_SENT", "ESTABLISHED"], a: 1, exp: "L'initiateur passe en TIME_WAIT par précaution avant CLOSED." },
      { type: "qcm", q: "Si B avait plutôt envoyé un RST en pleine session, cela signifierait…", opts: ["Une fermeture propre", "Une coupure brutale sans négociation", "Une nouvelle connexion", "Un acquittement"], a: 1, exp: "RST = fermeture immédiate, sans four-way, souvent une erreur." }
    ],
    solution: `<pre class="pseudo"># Lecture du four-way handshake :
A -> B : [FIN, ACK]   (1) A ferme son sens
A &lt;- B : [ACK]         (2) B accuse reception
A &lt;- B : [FIN, ACK]   (3) B ferme son sens
A -> B : [ACK]         (4) A accuse -> connexion CLOSED
# A reste en TIME_WAIT quelques instants (securite).
# Alternative brutale : un RST couperait tout sans negociation.</pre>
<p>Ouvrir en trois temps, fermer en quatre : le cycle de vie complet d'une connexion TCP est bouclé. Demain, on tranche entre TCP et UDP.</p>`
  }
};
</script>
