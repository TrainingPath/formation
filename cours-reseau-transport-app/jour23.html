  theory: `
<h3>1. Un protocole par métier</h3>
<p>La couche application ne parle pas une seule langue : elle en compte plusieurs, chacune spécialisée dans une tâche. On appelle chacune un <strong>protocole applicatif</strong>. Comme des corps de métier, chaque protocole a son rôle, son <strong>port</strong> par défaut, et sa manière de dialoguer. Voici les cinq incontournables.</p>
<pre class="pseudo"># Vue d'ensemble (protocole -> role -> port par defaut)
HTTP  -> pages web                       -> port 80  (443 en HTTPS)
FTP   -> transfert de fichiers           -> port 21
SMTP  -> envoi de courriels              -> port 25
DNS   -> traduire un nom en adresse IP   -> port 53
DHCP  -> attribuer une IP automatiquement-> ports 67 / 68</pre>
<h3>2. HTTP : le web</h3>
<p><strong>HTTP</strong> (en anglais <em>HyperText Transfer Protocol</em>) est le protocole du <strong>web</strong>. Ton navigateur l'utilise pour demander des pages à un serveur et recevoir la réponse. Sa version sécurisée, <strong>HTTPS</strong>, chiffre les échanges (port 443). HTTP fonctionne par requête/réponse : tu demandes, le serveur répond. On l'étudiera en détail au prochain jour.</p>
<h3>3. FTP : le transfert de fichiers</h3>
<p><strong>FTP</strong> (en anglais <em>File Transfer Protocol</em>) sert à <strong>transférer des fichiers</strong> entre un client et un serveur : envoyer (upload) ou télécharger (download). C'est un protocole ancien ; comme il n'est pas chiffré, on lui préfère aujourd'hui des versions sécurisées (SFTP, FTPS) pour tout ce qui est sensible.</p>
<h3>4. SMTP : l'envoi de courriels</h3>
<p><strong>SMTP</strong> (en anglais <em>Simple Mail Transfer Protocol</em>) gère l'<strong>envoi</strong> et l'acheminement des courriels entre serveurs de messagerie. Attention : SMTP sert à <strong>envoyer</strong>. Pour <strong>relever</strong> (lire) sa boîte, on utilise d'autres protocoles : <strong>IMAP</strong> ou <strong>POP</strong>. Retiens l'image : SMTP est le facteur qui poste et transporte le courrier ; IMAP/POP, c'est ouvrir sa boîte aux lettres.</p>
<div class="tip">Astuce mnémotechnique : <strong>S</strong>MTP pour <strong>S</strong>ortie (envoi). IMAP/POP pour la réception.</div>
<h3>5. DNS : l'annuaire d'Internet</h3>
<p><strong>DNS</strong> (en anglais <em>Domain Name System</em>) traduit les <strong>noms de domaine</strong> lisibles (comme <code>www.exemple.fr</code>) en <strong>adresses IP</strong> (comme <code>93.184.216.34</code>). Sans lui, il faudrait retenir des suites de chiffres pour chaque site. C'est l'<strong>annuaire</strong> d'Internet : tu donnes un nom, il rend l'adresse. Il utilise principalement le port 53.</p>
<h3>6. DHCP : la distribution automatique d'adresses</h3>
<p><strong>DHCP</strong> (en anglais <em>Dynamic Host Configuration Protocol</em>) attribue <strong>automatiquement</strong> une adresse IP (et d'autres réglages : passerelle, DNS) à chaque appareil qui rejoint le réseau. Sans DHCP, il faudrait configurer chaque machine à la main. Quand ton téléphone se connecte au Wi-Fi et reçoit une adresse sans rien faire, c'est le DHCP qui opère. Il utilise les ports 67 (serveur) et 68 (client).</p>
<div class="warn">Ne confonds pas les rôles : <strong>DNS</strong> traduit un nom en adresse ; <strong>DHCP</strong> distribue les adresses. Deux protocoles différents, deux missions différentes, même s'ils travaillent souvent ensemble.</div>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># HTTP  (80/443) : le web, requete/reponse
# FTP   (21)     : transfert de fichiers (versions securisees preferees)
# SMTP  (25)     : ENVOI de courriels (lecture = IMAP/POP)
# DNS   (53)     : traduit un NOM de domaine -> adresse IP (annuaire)
# DHCP  (67/68)  : attribue AUTOMATIQUEMENT une IP a chaque appareil</pre>`,

    { type: "input", q: "Quel protocole attribue automatiquement une adresse IP aux appareils qui rejoignent le réseau ?", a: ["dhcp", "le dhcp"], ph: "4 lettres", exp: "Le DHCP distribue les adresses IP automatiquement." },

    { type: "input", q: "Quel protocole (3 lettres) est l'annuaire d'Internet, utilisant le port 53 ?", a: ["dns", "le dns"], ph: "3 lettres", exp: "Le DNS, sur le port 53, traduit noms en adresses IP." },

    { type: "input", q: "Quels protocoles (cite-en un) utilise-t-on pour LIRE ses courriels (pas les envoyer) ?", a: ["imap", "pop", "pop3", "imap ou pop", "imap/pop"], ph: "un protocole", exp: "IMAP ou POP servent à relever/lire la boîte ; SMTP sert à envoyer." },
    { type: "qcm", q: "Quelle version de HTTP chiffre les échanges (port 443) ?", opts: ["HTTPX", "HTTPS", "SHTTP", "HTTP2 uniquement"], a: 1, exp: "HTTPS est la version sécurisée/chiffrée de HTTP, sur le port 443." },
    { type: "vf", q: "FTP moderne est toujours chiffré par défaut.", a: false, exp: "Non : FTP n'est pas chiffré ; on lui préfère SFTP ou FTPS pour la sécurité." },
    { type: "input", q: "Quel port par défaut utilise le DNS ?", a: ["53", "port 53"], ph: "un nombre", exp: "Le DNS utilise principalement le port 53." },
    { type: "qcm", q: "Quel protocole utilise ton navigateur pour demander une page web ?", opts: ["SMTP", "DHCP", "HTTP", "FTP"], a: 2, exp: "Le navigateur parle HTTP (ou HTTPS) pour obtenir des pages web." },
    { type: "qcm", q: "Associe correctement : DHCP -> ?", opts: ["Traduit un nom en IP", "Attribue automatiquement une IP", "Envoie des courriels", "Transfère des fichiers"], a: 1, exp: "DHCP distribue automatiquement les adresses IP et réglages réseau." }
  ],
  final: {
    title: "Exercice final — Une journée de connexions",
    intro: `<p>Nadia arrive au bureau. Son ordinateur se connecte au réseau, elle ouvre un site web, envoie un e-mail et récupère un fichier sur un serveur. Identifions les protocoles en jeu à chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "Son PC rejoint le réseau et reçoit une adresse IP automatiquement. Quel protocole ?", opts: ["DNS", "DHCP", "HTTP", "SMTP"], a: 1, exp: "Le DHCP attribue l'adresse IP à la connexion." },
      { type: "input", q: "Elle tape www.exemple.fr. Quel protocole traduit ce nom en adresse IP ?", a: ["dns", "le dns"], ph: "3 lettres", exp: "Le DNS traduit le nom de domaine en adresse IP." },

      { type: "input", q: "Elle récupère un fichier sur un serveur dédié au transfert. Quel protocole (3 lettres) ?", a: ["ftp", "le ftp", "sftp"], ph: "3 lettres", exp: "FTP (ou sa version sécurisée SFTP) sert au transfert de fichiers." }
    ],
    solution: `<pre class="pseudo"># La journee de Nadia, protocole par protocole :
# 1) Connexion au reseau, IP automatique  -> DHCP  (67/68)
# 2) Traduire www.exemple.fr en IP         -> DNS   (53)
# 3) Afficher la page web                  -> HTTP  (80 / 443)
# 4) Envoyer un e-mail                      -> SMTP  (25)  [lire = IMAP/POP]
# 5) Recuperer un fichier                   -> FTP   (21)  [securise : SFTP]</pre>
<p>Tu as la carte des grands protocoles applicatifs. Demain, on zoome sur le plus utilisé du web : HTTP, requête et réponse.</p>`
  }
};
