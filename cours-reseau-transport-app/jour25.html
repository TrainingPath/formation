var DAY = {
  num: 25,
  title: "Les URL et les méthodes HTTP",
  subtitle: "Décoder une adresse web et comprendre ce que le navigateur demande vraiment.",
  theory: `
<h3>1. Anatomie d'une URL</h3>
<p>Une <strong>URL</strong> (en anglais <em>Uniform Resource Locator</em>, « localisateur uniforme de ressource ») est l'adresse complète d'une ressource sur le web. Elle ressemble à une adresse postale très structurée : chaque partie a un rôle précis. Prenons un exemple et découpons-le morceau par morceau.</p>
<pre class="pseudo">https://www.exemple.fr:443/produits/livre?id=42&amp;tri=prix#avis
\_____/   \____________/ \_/ \___________/ \___________/ \___/
schéma        hôte      port    chemin        requête   fragment</pre>
<p>Le <strong>schéma</strong> (<em>scheme</em>) indique le protocole : <code>http</code>, <code>https</code>, <code>ftp</code>, <code>mailto</code>. L'<strong>hôte</strong> (<em>host</em>) est le nom de domaine que le DNS traduira en adresse IP. Le <strong>port</strong> est souvent implicite (80 pour http, 443 pour https) et alors omis. Le <strong>chemin</strong> (<em>path</em>) désigne la ressource sur le serveur, comme un dossier. La <strong>requête</strong> (<em>query string</em>), après le <code>?</code>, transporte des paramètres <code>clé=valeur</code> séparés par <code>&amp;</code>. Le <strong>fragment</strong>, après le <code>#</code>, pointe une ancre dans la page et n'est jamais envoyé au serveur.</p>
<h3>2. HTTP : une conversation requête / réponse</h3>
<p>Le web repose sur <strong>HTTP</strong> (<em>HyperText Transfer Protocol</em>). C'est un dialogue simple : le client (navigateur) envoie une <strong>requête</strong>, le serveur renvoie une <strong>réponse</strong>. Chaque échange est indépendant : on dit qu'HTTP est « sans état » (<em>stateless</em>). Une requête commence par une ligne de commande, suivie d'en-têtes, puis parfois d'un corps.</p>
<pre class="pseudo">GET /produits/livre?id=42 HTTP/1.1
Host: www.exemple.fr
User-Agent: Mozilla/5.0
Accept: text/html</pre>
<h3>3. GET contre POST</h3>
<p>La <strong>méthode</strong> (le premier mot de la requête) dit au serveur quelle action on veut. Les deux plus courantes :</p>
<p><strong>GET</strong> sert à <em>demander</em> une ressource sans la modifier. Les paramètres voyagent dans l'URL (visibles, mis en favori, dans l'historique). À réserver aux lectures.</p>
<p><strong>POST</strong> sert à <em>envoyer</em> des données pour créer ou traiter quelque chose (formulaire d'inscription, paiement). Les données voyagent dans le <strong>corps</strong> de la requête, pas dans l'URL.</p>
<div class="tip">On dit que GET est « sûr » (safe) et « idempotent » : le répéter ne change rien. POST n'est pas idempotent : soumettre deux fois un paiement peut débiter deux fois. C'est pourquoi le navigateur avertit avant de « renvoyer » un POST.</div>
<p>D'autres méthodes existent : <strong>PUT</strong> (remplacer), <strong>DELETE</strong> (supprimer), <strong>HEAD</strong> (comme GET mais sans le corps, juste les en-têtes).</p>
<h3>4. Les en-têtes (headers)</h3>
<p>Les <strong>en-têtes</strong> sont des lignes <code>Nom: valeur</code> qui accompagnent chaque message pour donner du contexte. Côté requête : <code>Host</code> (le site visé, obligatoire en HTTP/1.1), <code>User-Agent</code> (le navigateur), <code>Accept</code> (les formats acceptés), <code>Cookie</code>, <code>Authorization</code>. Côté réponse : <code>Content-Type</code> (le type du contenu, ex. <code>text/html</code>), <code>Content-Length</code>, <code>Set-Cookie</code>, <code>Cache-Control</code>.</p>
<h3>5. Les codes de statut</h3>
<p>Chaque réponse commence par un <strong>code à trois chiffres</strong> : <code>200</code> OK, <code>301/302</code> redirection, <code>404</code> introuvable, <code>403</code> interdit, <code>500</code> erreur serveur. La première chiffre donne la famille : 2xx succès, 3xx redirection, 4xx erreur du client, 5xx erreur du serveur.</p>
<div class="warn">Ne mets jamais un mot de passe ou un jeton secret dans la <em>query string</em> d'un GET : il s'inscrit dans l'historique, les favoris et les journaux du serveur. Ces données sensibles passent par le corps d'un POST, sur une liaison HTTPS.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># URL = schéma://hôte:port/chemin?requête#fragment
# HTTP = requête (client) puis réponse (serveur), sans état
# GET  = lire  (params dans l'URL, sûr, idempotent)
# POST = envoyer (données dans le corps, non idempotent)
# En-têtes = contexte : Host, User-Agent, Content-Type...
# Statut : 200 OK | 301/302 redir | 404 absent | 500 erreur serveur</pre>`,

    { type: "qcm", q: "Que signifie le sigle URL ?", opts: ["Universal Router Link", "Uniform Resource Locator", "User Request Line", "Unified Resource Label"], a: 1, exp: "URL = Uniform Resource Locator, le localisateur uniforme de ressource." },
    { type: "qcm", q: "Dans https://www.exemple.fr/produits?id=42 , que désigne « /produits » ?", opts: ["Le schéma", "L'hôte", "Le chemin (path)", "Le fragment"], a: 2, exp: "Le chemin (path) désigne la ressource sur le serveur, après l'hôte." },
    { type: "input", q: "Comment appelle-t-on la partie d'une URL placée après le « ? » qui transporte des paramètres clé=valeur ?", a: ["query string", "la query string", "chaine de requete", "requete", "la requete", "query"], ph: "un terme", exp: "C'est la query string (chaîne de requête) : des paramètres clé=valeur séparés par &." },

    { type: "qcm", q: "Quelle méthode HTTP sert à demander une ressource sans la modifier ?", opts: ["POST", "GET", "DELETE", "PUT"], a: 1, exp: "GET sert à lire/demander une ressource ; elle est sûre et idempotente." },
    { type: "qcm", q: "Où voyagent les données d'un formulaire envoyé en POST ?", opts: ["Dans l'URL", "Dans le fragment", "Dans le corps de la requête", "Dans le nom de domaine"], a: 2, exp: "En POST, les données sont placées dans le corps du message, pas dans l'URL." },
    { type: "vf", q: "HTTP est un protocole « sans état » (stateless).", a: true, exp: "Vrai : chaque requête est traitée indépendamment, sans mémoire des précédentes." },
    { type: "input", q: "Quel en-tête de requête, obligatoire en HTTP/1.1, indique le site visé ?", a: ["host", "host:", "l'en-tete host"], ph: "nom de l'en-tête", exp: "L'en-tête Host indique le nom d'hôte demandé ; il est requis en HTTP/1.1." },
    { type: "qcm", q: "Que renvoie un serveur avec le code 404 ?", opts: ["Succès", "Redirection", "Ressource introuvable", "Erreur interne du serveur"], a: 2, exp: "404 = Not Found : la ressource demandée n'existe pas à cet emplacement." },
    { type: "qcm", q: "À quelle famille appartient un code de statut commençant par 5 ?", opts: ["Succès", "Redirection", "Erreur du client", "Erreur du serveur"], a: 3, exp: "Les codes 5xx signalent une erreur côté serveur (ex. 500)." },
    { type: "vf", q: "GET est idempotent : le répéter ne change pas l'état du serveur.", a: true, exp: "Vrai : GET est une lecture, la répéter n'a pas d'effet de bord. POST, lui, ne l'est pas." },
    { type: "input", q: "Quel en-tête de réponse indique le type du contenu renvoyé (ex. text/html) ?", a: ["content-type", "content-type:", "le content-type"], ph: "nom de l'en-tête", exp: "Content-Type décrit le format du corps de la réponse (text/html, application/json...)." },
    { type: "qcm", q: "Pourquoi ne pas mettre un mot de passe dans la query string d'un GET ?", opts: ["C'est interdit par la loi", "Il apparaît dans l'historique, les favoris et les journaux", "GET impose une taille maximale trop courte pour un mot de passe", "Le serveur le refuse toujours"], a: 1, exp: "Les paramètres d'un GET sont visibles et enregistrés partout : jamais de secret dedans." },
    { type: "qcm", q: "Quelle méthode agit comme GET mais ne renvoie que les en-têtes, sans le corps ?", opts: ["PUT", "HEAD", "OPTIONS", "TRACE"], a: 1, exp: "HEAD demande uniquement les en-têtes de la réponse, utile pour vérifier sans télécharger." }
  ],
  final: {
    title: "Exercice final — Lire une requête à la loupe",
    intro: `<p>Un site de librairie répond à cette requête. Analysons-la ligne par ligne.</p><pre class="pseudo">POST /panier/valider HTTP/1.1
Host: boutique.exemple.fr
Content-Type: application/x-www-form-urlencoded
Content-Length: 27

article=42&amp;quantite=3</pre>`,
    questions: [
      { type: "qcm", q: "Quelle méthode HTTP est utilisée ici ?", opts: ["GET", "POST", "HEAD", "DELETE"], a: 1, exp: "La première ligne commence par POST : on envoie des données au serveur." },
      { type: "input", q: "Quel est le nom d'hôte (host) visé par cette requête ?", a: ["boutique.exemple.fr"], ph: "un nom de domaine", exp: "L'en-tête Host indique boutique.exemple.fr." },
      { type: "vf", q: "Les données « article=42&quantite=3 » voyagent dans le corps de la requête, pas dans l'URL.", a: true, exp: "Vrai : en POST, le corps (après la ligne vide) transporte les données du formulaire." },
      { type: "qcm", q: "Que faut-il conclure de l'usage de POST pour valider un panier ?", opts: ["C'est une simple lecture", "L'action modifie l'état (créer une commande) et n'est pas idempotente", "L'action est sûre et peut être répétée sans risque", "Cela renvoie seulement des en-têtes"], a: 1, exp: "Valider un panier change l'état du serveur : POST convient, et la répéter pourrait recommander." },
      { type: "input", q: "Combien d'octets fait le corps, d'après l'en-tête Content-Length ?", a: ["27", "27 octets"], ph: "un nombre", exp: "Content-Length: 27 annonce la taille du corps envoyé." }
    ],
    solution: `<pre class="pseudo"># Décomposition de la requête :
Ligne 1 : MÉTHODE=POST  CHEMIN=/panier/valider  VERSION=HTTP/1.1
Host     : boutique.exemple.fr   (site visé, obligatoire)
Content-Type   : format du corps (formulaire encodé)
Content-Length : 27 octets de corps
(ligne vide) puis CORPS : article=42&amp;quantite=3</pre>
<p>POST + corps = on transmet une action qui modifie l'état. Un GET aurait exposé les paramètres dans l'URL, ce qui n'a pas de sens pour valider un achat.</p>`
  }
};
