var DAY = {

  title: "La PAT (surcharge / masquerading)",
  subtitle: "Comment toute une maison partage une seule adresse publique grâce aux numéros de port.",
  theory: `
<h3>1. Le problème que la PAT résout</h3>
<p>Le NAT dynamique reste limité : une adresse publique ne sert qu'à une machine à la fois. Or, chez toi, la box a <strong>une seule adresse publique</strong> et il y a le téléphone, l'ordinateur, la télé, la console… tous connectés en même temps. Comment font-ils pour partager cette unique adresse ? Réponse : la <strong>PAT</strong>.</p>
<p>PAT signifie <em>Port Address Translation</em> (« traduction d'adresse par les ports »). On l'appelle aussi <strong>NAT overload</strong> (« NAT en surcharge »), ou encore <strong>masquerading</strong> (« masquage ») dans le monde Linux. Ces trois noms désignent la même chose : <strong>partager UNE adresse publique entre PLUSIEURS machines en jouant sur les numéros de port</strong>.</p>
<h3>2. L'astuce : ajouter le port au jeu</h3>
<p>Chaque connexion réseau utilise, en plus de l'adresse IP, un <strong>numéro de port</strong> côté source (souvent un port « éphémère » choisi au hasard, par exemple 51000). L'idée de la PAT : quand plusieurs machines sortent avec la même adresse publique, le routeur leur attribue des <strong>ports source différents</strong> pour les distinguer. La combinaison <em>IP publique + port</em> devient unique pour chaque connexion.</p>
<pre class="pseudo"># Table PAT dans la box (IP publique = 203.0.113.5)
# Interne (privee:port)      -> Externe (publique:port)
192.168.1.10 : 51000        -> 203.0.113.5 : 40001
192.168.1.11 : 51000        -> 203.0.113.5 : 40002
192.168.1.12 : 49500        -> 203.0.113.5 : 40003
# Meme IP publique, mais un PORT different par connexion : chacun est identifiable.</pre>
<p>Quand la réponse revient sur <code>203.0.113.5:40002</code>, la box consulte sa table, voit que ce port correspond à <code>192.168.1.11:51000</code>, et renvoie le paquet à la bonne machine. Le port sert d'étiquette de retour.</p>
<div class="tip">Analogie : un grand immeuble a <strong>une seule adresse postale</strong> (l'IP publique), mais chaque appartement a un <strong>numéro</strong> (le port). Le facteur livre à la bonne porte grâce au numéro d'appartement. La box joue le rôle du concierge qui tient le registre.</div>
<h3>3. Le cas domestique : ta box, c'est de la PAT</h3>
<p>C'est <strong>exactement</strong> ce qui se passe chez toi. Ta <strong>box Internet</strong> (Freebox, Livebox, routeur…) reçoit <strong>une seule adresse IPv4 publique</strong> de ton fournisseur. Tous tes appareils ont des adresses privées <code>192.168.1.x</code>, et la box fait de la <strong>PAT</strong> pour que des dizaines d'appareils partagent cette unique adresse publique. Sans PAT, tu ne pourrais connecter qu'un seul appareil à la fois.</p>
<div class="warn">Combien de connexions simultanées ? Les ports vont de 1 à 65535, ce qui laisse un très grand nombre de combinaisons — largement de quoi couvrir une maison, voire un immeuble. La PAT est donc bien plus économe que le NAT dynamique : des <strong>milliers</strong> de connexions sur <strong>une</strong> adresse publique.</p></div>
<h3>4. PAT et sécurité : un effet de bord</h3>
<p>Un effet secondaire pratique : comme les machines internes n'ont pas d'adresse publique propre, elles ne sont <strong>pas directement joignables depuis l'extérieur</strong>. Une connexion venant d'Internet vers un port qui n'est pas dans la table est rejetée. Cela agit comme un pare-feu naturel (attention, ce n'est pas un vrai pare-feu, mais l'effet aide). Le revers : pour exposer volontairement un service interne, il faut configurer une <strong>redirection de port</strong> (vue au prochain jour).</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># PAT = NAT overload = masquerading : 3 noms, une meme idee
# Principe : UNE IP publique partagee par PLUSIEURS machines via les PORTS
# Cle d'identification : (IP publique : port) unique par connexion
# C'est ce que fait TA BOX a la maison (une IP publique, plein d'appareils)
# Effet de bord : l'interieur n'est pas joignable de l'exterieur par defaut</pre>`,

    { type: "qcm", q: "Quand une réponse revient sur 203.0.113.5:40002, comment la box sait-elle à qui la donner ?", opts: ["Au hasard", "Grâce à sa table PAT qui associe ce port à une machine interne", "Elle la jette", "En diffusant le paquet à toutes les machines"], a: 1, exp: "La table PAT relie le port externe à l'IP:port interne d'origine." },
    { type: "vf", q: "La PAT est plus économe en adresses publiques que le NAT dynamique.", a: true, exp: "Oui : des milliers de connexions tiennent sur une seule adresse publique." },
    { type: "input", q: "Par rapport au NAT dynamique, la PAT partage une IP publique entre __ machines (un seul mot : combien à la fois ?).", a: ["plusieurs", "beaucoup", "plusieurs machines", "de nombreuses"], ph: "un mot", exp: "La PAT permet à PLUSIEURS machines de partager simultanément une IP publique." },
    { type: "qcm", q: "Effet de bord de la PAT côté sécurité ?", opts: ["Les machines internes deviennent publiques", "Les machines internes ne sont pas directement joignables depuis l'extérieur", "Elle chiffre tout", "Elle ouvre tous les ports"], a: 1, exp: "Sans entrée dans la table, une connexion entrante est rejetée : effet pare-feu naturel." },
    { type: "qcm", q: "L'analogie de l'immeuble : l'IP publique correspond à…", opts: ["Au numéro d'appartement", "À l'adresse postale de l'immeuble", "Au facteur", "À la boîte aux lettres"], a: 1, exp: "L'IP publique = l'adresse de l'immeuble ; le port = le numéro d'appartement." },
    { type: "vf", q: "PAT, NAT overload et masquerading désignent trois techniques totalement différentes.", a: false, exp: "Faux : ce sont trois noms de la même technique." },
    { type: "input", q: "Quelle information, combinée à l'IP publique, rend chaque connexion PAT unique ?", a: ["le port", "port", "le numero de port", "numero de port", "port source"], ph: "un mot", exp: "Le numéro de port : la paire (IP publique + port) est unique." }
  ],

      { type: "qcm", q: "Comment la box distingue les trois flux qui partent tous depuis 82.65.10.7 ?", opts: ["Par l'adresse MAC de chaque appareil", "Par un numéro de port source différent pour chaque connexion", "Par le numéro de séquence TCP", "Elle ne les distingue pas"], a: 1, exp: "Chaque connexion reçoit un port externe distinct dans la table PAT." },
      { type: "vf", q: "De l'extérieur, un inconnu peut se connecter directement au PC de Sofia sans configuration particulière.", a: false, exp: "Non : derrière la PAT, les machines internes ne sont pas joignables sans redirection de port." },
      { type: "qcm", q: "Une réponse vidéo revient sur 82.65.10.7:40010. La box…", opts: ["La jette", "Consulte sa table PAT et la transmet à la bonne machine interne", "L'envoie à tous", "La renvoie à l'expéditeur"], a: 1, exp: "Le port externe 40010 est associé dans la table à une machine:port interne précise." }
    ],
    solution: `<pre class="pseudo"># Une IP publique (82.65.10.7) pour toute la maison :

# Interieur non joignable de l'exterieur par defaut (il faudra du port forwarding).</pre>
<p>La PAT explique pourquoi tout marche chez toi avec une seule IP publique. Demain : comment, malgré tout, exposer un service interne — le port forwarding.</p>`
  }
};
