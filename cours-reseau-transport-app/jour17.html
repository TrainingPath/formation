<script>
var DAY = {
  num: 17,
  title: "La pénurie d'adresses IPv4",
  subtitle: "Quatre milliards d'adresses, ce n'était pas assez : comment on a tenu le coup.",
  theory: `
<h3>1. Le problème : un stock d'adresses trop petit</h3>
<p>Une adresse <strong>IPv4</strong> est codée sur <strong>32 bits</strong>. Cela offre 2^32 combinaisons, soit environ <strong>4,3 milliards</strong> d'adresses (précisément 4 294 967 296). En 1981, quand le protocole a été conçu, ce nombre paraissait immense : il y avait quelques centaines d'ordinateurs sur le réseau. Mais avec l'explosion d'Internet, des smartphones, des objets connectés (en anglais <em>IoT</em>, « Internet of Things »), chaque humain veut aujourd'hui plusieurs adresses. Le stock est devenu trop petit.</p>
<p>Pire : toutes ces adresses ne sont pas utilisables. De grands blocs ont été réservés très tôt (adresses privées, multicast, usage expérimental) ou attribués de façon peu économe à de grandes organisations. Le nombre réel d'adresses publiques disponibles était donc encore plus faible que 4,3 milliards.</p>
<h3>2. L'épuisement (address exhaustion)</h3>
<p>Les adresses publiques sont distribuées par l'<strong>IANA</strong> (l'autorité mondiale) à cinq registres régionaux (les <em>RIR</em>, comme le <strong>RIPE NCC</strong> pour l'Europe). Le 3 février <strong>2011</strong>, l'IANA a attribué ses <strong>derniers grands blocs</strong> : le réservoir central était vide. Les registres régionaux ont épuisé leurs stocks les uns après les autres dans les années suivantes. On appelle cet événement l'<strong>épuisement</strong> des adresses IPv4 (en anglais <em>IPv4 address exhaustion</em>).</p>
<div class="warn">Épuisement ne veut pas dire « Internet s'arrête ». Les adresses déjà attribuées continuent de fonctionner. Cela veut dire qu'on ne peut plus facilement en obtenir de nouvelles : elles se revendent cher, ou se partagent.</div>
<h3>3. Première parade : les adresses privées + le NAT</h3>
<p>La solution la plus utilisée est le <strong>NAT</strong> (en anglais <em>Network Address Translation</em>, « traduction d'adresse réseau »). L'idée : à l'intérieur d'un réseau local, on utilise des <strong>adresses privées</strong> — gratuites, réutilisables partout, jamais routées sur Internet. Un seul appareil (la box, le routeur) possède une <strong>adresse publique</strong> et <strong>traduit</strong> les adresses privées en adresse publique au moment de sortir vers Internet.</p>
<pre class="pseudo"># Plages privees reservees (RFC 1918) :
10.0.0.0     a 10.255.255.255   (/8   : les grands reseaux)
172.16.0.0   a 172.31.255.255   (/12  : reseaux moyens)
192.168.0.0  a 192.168.255.255  (/16  : la maison, les petites box)
# Ces adresses ne sont JAMAIS routees sur Internet public.</pre>
<p>Grâce au NAT, des millions de foyers utilisent tous <code>192.168.1.x</code> chez eux sans jamais entrer en conflit : ces adresses ne se rencontrent jamais sur le réseau public. C'est la parade qui a permis de « tenir » malgré l'épuisement.</p>
<h3>4. La vraie solution de fond : IPv6</h3>
<p>Le NAT est un pansement. La solution durable est <strong>IPv6</strong>, la version 6 du protocole, qui code les adresses sur <strong>128 bits</strong>. Cela donne 2^128 adresses, soit environ <strong>340 sextillions</strong> (3,4 × 10^38) : un nombre si gigantesque qu'on pourrait attribuer une adresse à chaque grain de sable de la planète et il en resterait. Une adresse IPv6 s'écrit en hexadécimal, par groupes séparés par des deux-points, par exemple <code>2001:0db8:85a3::8a2e:0370:7334</code>.</p>
<div class="tip">IPv4 et IPv6 coexistent aujourd'hui (on parle de <em>double pile</em>, en anglais <em>dual stack</em>). La transition est lente car il faut mettre à jour équipements et logiciels partout. En attendant, NAT reste omniprésent.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IPv4 = 32 bits  -> ~4,3 milliards d'adresses (trop peu)
# Epuisement (exhaustion) : IANA a distribue ses derniers blocs en 2011
# Parade rapide : adresses PRIVEES (RFC 1918) + NAT (une IP publique partagee)
# Solution de fond : IPv6 = 128 bits -> 3,4 x 10^38 adresses
# Aujourd'hui : IPv4 + NAT et IPv6 coexistent (dual stack)</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits une adresse IPv4 est-elle codée ?", opts: ["16 bits", "32 bits", "64 bits", "128 bits"], a: 1, exp: "IPv4 = 32 bits, soit environ 4,3 milliards d'adresses." },
    { type: "qcm", q: "Environ combien d'adresses IPv4 existent au total ?", opts: ["65 000", "16 millions", "4,3 milliards", "340 sextillions"], a: 2, exp: "2^32 ≈ 4,3 milliards. Les 340 sextillions, c'est IPv6." },
    { type: "input", q: "Quel sigle (3 lettres) désigne la traduction d'adresse réseau qui permet de partager une IP publique ?", a: ["nat"], ph: "3 lettres", exp: "NAT = Network Address Translation." },
    { type: "vf", q: "L'épuisement des adresses IPv4 signifie qu'Internet a cessé de fonctionner.", a: false, exp: "Non : les adresses déjà attribuées marchent toujours. On ne peut simplement plus en obtenir facilement de nouvelles." },
    { type: "qcm", q: "Quelle plage est une adresse privée (RFC 1918) ?", opts: ["8.8.8.0/24", "192.168.0.0/16", "1.1.1.0/24", "100.100.0.0/16"], a: 1, exp: "192.168.0.0/16 est privée, comme 10.0.0.0/8 et 172.16.0.0/12." },
    { type: "qcm", q: "Sur combien de bits une adresse IPv6 est-elle codée ?", opts: ["32 bits", "48 bits", "64 bits", "128 bits"], a: 3, exp: "IPv6 = 128 bits, d'où un nombre astronomique d'adresses." },
    { type: "input", q: "Quelle version du protocole IP règle définitivement la pénurie d'adresses ?", a: ["ipv6", "ip v6", "ip version 6"], ph: "IPvX", exp: "IPv6, avec ses adresses sur 128 bits." },
    { type: "vf", q: "Deux foyers différents peuvent tous les deux utiliser 192.168.1.10 chez eux sans conflit.", a: true, exp: "Oui : les adresses privées ne sont jamais routées sur Internet, elles ne se rencontrent donc jamais." },
    { type: "qcm", q: "Le NAT est souvent décrit comme…", opts: ["Une solution définitive au manque d'adresses", "Un pansement / une parade en attendant IPv6", "Un protocole de chiffrement", "Un protocole de routage dynamique"], a: 1, exp: "Le NAT permet de tenir, mais la solution de fond reste IPv6." },
    { type: "qcm", q: "Quel organisme mondial répartit les grands blocs d'adresses IP ?", opts: ["L'IANA", "L'ISO", "L'IEEE", "Le W3C"], a: 0, exp: "L'IANA distribue les blocs aux registres régionaux (RIR)." },
    { type: "input", q: "Comment appelle-t-on (un mot) les adresses comme 10.x.x.x ou 192.168.x.x, non routées sur Internet ?", a: ["privees", "privee", "adresses privees", "prive"], ph: "un adjectif", exp: "Ce sont les adresses privées, définies par la RFC 1918." },
    { type: "vf", q: "IPv4 et IPv6 peuvent fonctionner en même temps sur un même appareil (double pile).", a: true, exp: "Oui : c'est le mode dual stack, très courant pendant la transition." },
    { type: "qcm", q: "Pourquoi les 4,3 milliards d'adresses IPv4 sont-elles devenues insuffisantes ?", opts: ["Chaque site web réserve une adresse à vie", "L'explosion des appareils connectés (smartphones, objets connectés)", "Les registres régionaux en suppriment chaque année", "Le déploiement d'IPv6 a rendu l'IPv4 inutilisable"], a: 1, exp: "Chaque personne possède aujourd'hui plusieurs appareils réclamant des adresses." },
    { type: "input", q: "En quelle année (approx.) l'IANA a-t-elle attribué ses derniers grands blocs IPv4 ?", a: ["2011", "en 2011"], ph: "une année", exp: "En février 2011, le réservoir central de l'IANA a été vidé." },
    { type: "qcm", q: "Un exemple d'adresse écrite en hexadécimal avec des deux-points comme 2001:db8::1 est…", opts: ["Une adresse MAC", "Une adresse IPv4", "Une adresse IPv6", "Un numéro de port"], a: 2, exp: "Les adresses IPv6 s'écrivent en hexadécimal séparé par des deux-points." }
  ],
  final: {
    title: "Exercice final — Le fournisseur d'accès face à la pénurie",
    intro: `<p>Un petit fournisseur d'accès dispose d'un seul bloc de quelques centaines d'adresses publiques, mais doit connecter des dizaines de milliers de clients. Raisonnons sur ses choix.</p>`,
    questions: [
      { type: "qcm", q: "Peut-il donner une adresse publique unique à chaque client ?", opts: ["Oui, facilement", "Non, il n'en a pas assez : c'est le cœur du problème", "Oui, chaque client peut générer sa propre IP publique", "Non, seul IPv6 permet d'attribuer des adresses"], a: 1, exp: "Quelques centaines d'adresses pour des dizaines de milliers de clients : impossible en 1:1." },
      { type: "input", q: "Quelle technique lui permet de partager ses rares adresses publiques entre de nombreux clients ?", a: ["nat", "le nat", "la traduction d'adresse"], ph: "3 lettres", exp: "Le NAT partage une adresse publique entre plusieurs adresses privées." },
      { type: "qcm", q: "Quelles adresses attribuera-t-il en interne à ses clients ?", opts: ["Des adresses publiques achetées à l'unité", "Des adresses privées (RFC 1918)", "Des adresses MAC", "Des adresses multicast (224.0.0.0/4)"], a: 1, exp: "En interne, il utilise des adresses privées, gratuites et réutilisables." },
      { type: "vf", q: "Déployer IPv6 réglerait durablement son manque d'adresses.", a: true, exp: "Oui : IPv6 offre un nombre d'adresses pratiquement illimité." },
      { type: "qcm", q: "Pourquoi ne bascule-t-il pas tout de suite en IPv6 uniquement ?", opts: ["IPv6 n'est pas compatible avec le protocole TCP", "La transition est lente : tous les équipements et sites ne sont pas encore IPv6", "IPv6 offre moins d'adresses que l'IPv4", "IPv6 ne fonctionne qu'à l'intérieur d'un réseau local"], a: 1, exp: "La compatibilité mondiale prend du temps : on garde donc IPv4 + NAT en parallèle (dual stack)." }
    ],
    solution: `<pre class="pseudo"># Situation : peu d'IP publiques, enormement de clients
# 1) Adresses PRIVEES en interne (10.x / 172.16-31.x / 192.168.x)
# 2) NAT pour partager les quelques IP publiques disponibles
# 3) Deploiement IPv6 en parallele (dual stack) = solution durable
# Resultat : on tient malgre l'epuisement des adresses IPv4.</pre>
<p>La pénurie d'IPv4 explique l'omniprésence du NAT dans le monde réel. Demain, on entre dans le détail : NAT statique et dynamique.</p>`
  }
};
</script>
