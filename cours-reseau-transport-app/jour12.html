var DAY = {
  num: 12,
  title: "TCP ou UDP : quand choisir quoi ? (comparatif, cas d'usage)",
  subtitle: "Deux transports, deux philosophies : la fiabilité contre la vitesse.",
  theory: `
<h3>1. Deux transporteurs, deux promesses</h3>
<p>La couche transport propose deux protocoles principaux. <strong>TCP</strong> (« Transmission Control Protocol ») est le <em>transporteur méticuleux</em> : il établit une connexion (handshake), numérote, acquitte, retransmet, remet dans l'ordre. <strong>UDP</strong> (« User Datagram Protocol ») est le <em>coursier express</em> : il envoie le paquet (appelé <strong>datagramme</strong>) sans connexion, sans accusé de réception, sans garantie. L'un privilégie la <strong>fiabilité</strong>, l'autre la <strong>rapidité</strong> et la simplicité.</p>
<h3>2. Le comparatif d'un coup d'œil</h3>
<pre class="pseudo"># Critere            | TCP                       | UDP
# -------------------|---------------------------|---------------------------
# Connexion          | Oui (3-way handshake)     | Non (sans connexion)
# Fiabilite          | Oui (ACK + retransmission)| Non (best effort)
# Ordre garanti      | Oui                       | Non
# Controle de flux   | Oui (fenetre)             | Non
# En-tete            | 20 octets (plus lourd)    | 8 octets (leger)
# Vitesse / latence  | Plus de surcharge         | Tres rapide, faible latence
# Diffusion multiple | Non                       | Oui (broadcast/multicast)</pre>
<div class="tip">Formule à retenir : <strong>TCP = fiable mais bavard</strong> ; <strong>UDP = léger mais sans filet</strong>. Le bon choix dépend de ce qui coûte le plus cher : perdre une donnée, ou perdre du temps.</div>
<h3>3. Quand choisir TCP</h3>
<p>Choisis <strong>TCP</strong> dès que <strong>chaque octet compte</strong> et que l'ordre est vital : pages web (<strong>HTTP/HTTPS</strong>), transfert de fichiers (<strong>FTP</strong>, <strong>SFTP</strong>), courrier (<strong>SMTP</strong>, <strong>IMAP</strong>), bases de données, SSH. Une page HTML à laquelle il manque des octets serait illisible ; un fichier corrompu serait inutilisable. La lenteur relative de TCP est un prix acceptable pour l'intégrité.</p>
<h3>4. Quand choisir UDP</h3>
<p>Choisis <strong>UDP</strong> quand la <strong>rapidité prime</strong> et qu'une perte occasionnelle est tolérable : voix et vidéo en temps réel (<strong>VoIP</strong>, visioconférence), jeux en ligne, streaming live, et surtout le <strong>DNS</strong> (une requête, une réponse, très courtes). En visio, retransmettre une image vieille d'une seconde n'a aucun intérêt : mieux vaut passer à la suivante. La perte se gère au niveau applicatif si besoin.</p>
<pre class="pseudo"># Exemples typiques de ports/services :
# TCP : HTTP(80), HTTPS(443), SSH(22), SMTP(25), FTP(21)
# UDP : DNS(53), DHCP(67/68), NTP(123), streaming, VoIP, jeux</pre>
<div class="warn">Attention aux idées reçues : <strong>DNS utilise surtout UDP</strong> (rapide) mais bascule sur TCP pour les grosses réponses. « UDP = mauvais » est faux : c'est le bon outil pour le temps réel. Le mauvais choix, c'est d'utiliser TCP là où la latence tue l'expérience.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># TCP : oriente CONNEXION, FIABLE, ordonne, controle de flux
#       -> web, fichiers, mail, SSH, BDD  (l'integrite prime)
# UDP : SANS connexion, RAPIDE, leger, best effort
#       -> DNS, VoIP, visio, jeux, streaming  (la latence prime)
# Question cle : perdre un octet coute-t-il plus cher que perdre du temps ?</pre>`,
  exercises: [
    { type: "qcm", q: "Quel protocole est orienté connexion et fiable ?", opts: ["UDP", "TCP", "ICMP", "DNS"], a: 1, exp: "TCP établit une connexion et garantit la livraison." },
    { type: "qcm", q: "Quel protocole envoie des datagrammes sans connexion ni accusé de réception ?", opts: ["TCP", "UDP", "SSH", "FTP"], a: 1, exp: "UDP est sans connexion et en best effort." },
    { type: "vf", q: "TCP garantit que les données arrivent dans l'ordre ; UDP non.", a: true, exp: "Oui : TCP réordonne, UDP livre tel quel, sans garantie d'ordre." },
    { type: "input", q: "Quel protocole choisir pour de la voix ou de la vidéo en temps réel ? (3 lettres)", a: ["udp"], ph: "3 lettres", exp: "UDP : la faible latence prime sur la retransmission." },
    { type: "qcm", q: "Pour télécharger un fichier sans la moindre corruption, on préfère…", opts: ["UDP", "TCP", "Broadcast", "Peu importe"], a: 1, exp: "TCP garantit l'intégrité : chaque octet est acquitté." },
    { type: "qcm", q: "Quel service utilise principalement UDP (avec repli TCP pour les grosses réponses) ?", opts: ["HTTP", "SSH", "DNS", "FTP"], a: 2, exp: "Le DNS privilégie UDP pour sa rapidité." },
    { type: "vf", q: "L'en-tête UDP est plus léger que l'en-tête TCP.", a: true, exp: "Oui : 8 octets pour UDP contre 20 pour TCP (minimum)." },
    { type: "input", q: "Comment appelle-t-on l'unité de données envoyée par UDP ? (un mot)", a: ["datagramme", "datagram", "un datagramme"], ph: "un mot", exp: "UDP transporte des datagrammes." },
    { type: "qcm", q: "Pourquoi la visioconférence tolère-t-elle la perte de quelques paquets ?", opts: ["Parce que l'image est peu importante", "Parce que retransmettre une image en retard est inutile : on passe à la suivante", "Parce que TCP l'interdit", "Parce qu'il n'y a jamais de perte"], a: 1, exp: "En temps réel, une donnée en retard n'a plus de valeur." },
    { type: "qcm", q: "Quel protocole assure le contrôle de flux via une fenêtre ?", opts: ["UDP", "TCP", "Les deux", "Aucun"], a: 1, exp: "Seul TCP offre le contrôle de flux (fenêtre glissante)." },
    { type: "vf", q: "UDP réalise un handshake en trois temps avant d'envoyer.", a: false, exp: "Non : UDP est sans connexion, il n'y a aucun handshake." },
    { type: "input", q: "Nomme un service classique qui utilise TCP (ex : web, transfert de fichiers, mail…). Un mot ou sigle.", a: ["http", "https", "ftp", "sftp", "ssh", "smtp", "imap", "web", "tcp"], ph: "un service TCP", exp: "HTTP, HTTPS, FTP, SSH, SMTP… reposent sur TCP." },
    { type: "qcm", q: "La bonne question pour choisir TCP ou UDP est…", opts: ["Quel port est libre ?", "Perdre un octet coûte-t-il plus cher que perdre du temps ?", "Quelle est la couleur du câble ?", "Combien d'IP ai-je ?"], a: 1, exp: "On arbitre entre intégrité (TCP) et latence (UDP)." },
    { type: "vf", q: "UDP permet la diffusion vers plusieurs destinataires (broadcast/multicast), pas TCP.", a: true, exp: "Oui : TCP est point à point ; UDP autorise broadcast et multicast." },
    { type: "qcm", q: "Un jeu en ligne rapide privilégie généralement…", opts: ["TCP pour tout", "UDP pour la latence, quitte à gérer les pertes côté jeu", "Le broadcast uniquement", "Aucun transport"], a: 1, exp: "UDP réduit la latence ; le jeu compense les pertes lui-même." }
  ],
  final: {
    title: "Exercice final — Choisir le bon transport",
    intro: `<p>Une équipe conçoit trois fonctionnalités : (A) une page web de tableau de bord, (B) un chat vocal en direct, (C) la résolution de noms de domaine. Aide-la à choisir le transport de chacune.</p>`,
    questions: [
      { type: "qcm", q: "Pour (A) la page web du tableau de bord, quel transport ?", opts: ["UDP", "TCP (HTTP/HTTPS)", "Broadcast", "Aucun"], a: 1, exp: "Le web repose sur TCP : chaque octet de la page doit arriver." },

      { type: "input", q: "Pour (C) la résolution de noms, quel protocole de transport surtout ? (3 lettres)", a: ["udp"], ph: "3 lettres", exp: "Le DNS utilise surtout UDP (rapide), avec repli TCP." },
      { type: "vf", q: "Pour (B), retransmettre un paquet audio arrivé en retard améliorerait l'appel.", a: false, exp: "Non : un son en retard est inutile, on préfère continuer en direct." },
      { type: "qcm", q: "Quel critère a guidé ces choix ?", opts: ["La couleur des câbles", "L'arbitrage entre intégrité des données (TCP) et faible latence (UDP)", "Le nombre de ports", "La marque du routeur"], a: 1, exp: "On pèse fiabilité contre latence selon l'usage." }
    ],
    solution: `<pre class="pseudo"># Choix de transport par fonctionnalite :
(A) Page web / dashboard  -> TCP (HTTP/HTTPS) : integrite indispensable
(B) Chat vocal en direct  -> UDP : latence minimale, perte toleree
(C) Resolution de noms    -> UDP (DNS), repli TCP pour grosses reponses
# Regle : integrite prime -> TCP ; temps reel prime -> UDP.</pre>
<p>Tu sais désormais arbitrer entre les deux transports. Place à la pratique : demain, on installe Wireshark pour voir tout cela en vrai.</p>`
  }
};
