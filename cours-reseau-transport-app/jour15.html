<script>
var DAY = {
  num: 15,
  title: "Le suivi des connexions (multiplexage) (une machine, plusieurs connexions simultanées via ports)",
  subtitle: "Comment un seul ordinateur mène des dizaines de conversations à la fois sans les mélanger.",
  theory: `
<h3>1. Le problème : tout arrive par la même porte</h3>
<p>Ton PC n'a qu'une (ou deux) adresse <strong>IP</strong>, mais à un instant donné il télécharge une page, écoute de la musique, met à jour une appli et discute sur une messagerie. Toutes ces données arrivent par la même carte réseau. Comment la machine sait-elle <strong>quel paquet appartient à quelle conversation</strong> ? La réponse tient en un mot : le <strong>multiplexage</strong> (en anglais <em>multiplexing</em>), grâce aux <strong>ports</strong>.</p>
<h3>2. Le socket et le quadruplet</h3>
<p>Une connexion TCP n'est pas identifiée par l'IP seule, mais par un <strong>quadruplet</strong> (en anglais <em>4-tuple</em>) : <strong>IP source + port source + IP destination + port destination</strong>. Chaque extrémité est un <strong>socket</strong> (IP:port). Deux connexions qui diffèrent ne serait-ce que par <em>un seul</em> de ces quatre éléments sont considérées comme <strong>distinctes</strong>. C'est ce qui permet de les suivre séparément.</p>
<pre class="pseudo"># Une connexion = un quadruplet unique :
#   (IP_source : port_source)  &lt;-&gt;  (IP_dest : port_dest)
# Exemple :
#   192.168.1.20:52344  &lt;-&gt;  93.184.216.34:443   (onglet 1)
#   192.168.1.20:52345  &lt;-&gt;  93.184.216.34:443   (onglet 2)
# Meme serveur, meme port 443, MEME IP client :
# seul le PORT SOURCE change -> deux connexions bien distinctes.</pre>
<h3>3. Le rôle des ports éphémères</h3>
<p>Le serveur écoute sur un <strong>port fixe</strong> et bien connu (443 pour HTTPS, 80 pour HTTP…). Mais le client, lui, choisit à chaque nouvelle connexion un <strong>port source différent</strong>, pris dans une plage dite <strong>éphémère</strong> (souvent 49152–65535). C'est ce port source qui distingue tes multiples onglets vers le <em>même</em> site : le serveur répondra à 52344 pour l'un, à 52345 pour l'autre, sans jamais les confondre.</p>
<div class="tip">Analogie : l'immeuble (IP) reçoit tout le courrier, mais chaque appartement (port) a son numéro. Le facteur (la pile réseau) dépose chaque lettre dans la bonne boîte grâce au numéro de port.</div>
<h3>4. Observer les connexions : netstat / ss</h3>
<p>Le système tient une <strong>table des connexions</strong> actives. On la consulte en ligne de commande :</p>
<pre class="pseudo"># Windows :
netstat -ano            # liste connexions + PID du programme
# Linux :
ss -tunap               # sockets TCP/UDP, avec processus
# Colonnes typiques :
# Proto  Adresse locale        Adresse distante       Etat
# TCP    192.168.1.20:52344    93.184.216.34:443      ESTABLISHED
# TCP    192.168.1.20:52345    93.184.216.34:443      ESTABLISHED</pre>
<p>Chaque ligne est une conversation suivie indépendamment : même serveur, même port distant, mais port local différent. C'est le multiplexage en action, rendu visible.</p>
<h3>5. Démultiplexage à la réception</h3>
<p>À l'arrivée, l'opération inverse s'appelle le <strong>démultiplexage</strong> (<em>demultiplexing</em>) : la pile réseau lit le quadruplet du paquet entrant et le remet à la bonne application (le bon socket). Sans ports, impossible de trier ; avec eux, une seule IP suffit pour des milliers de conversations parallèles.</p>
<div class="warn">Ne confonds pas port <strong>d'écoute</strong> du serveur (fixe, ex : 443) et port <strong>source</strong> du client (éphémère, variable). C'est le port source qui différencie plusieurs connexions d'un même client vers un même service.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Multiplexage : plusieurs connexions sur une seule IP, grace aux ports.
# Une connexion = quadruplet : IP_src:port_src  &lt;-&gt;  IP_dst:port_dst
# Serveur : port fixe (80, 443...) ; Client : port source ephemere.
# Observer : netstat -ano (Windows)  |  ss -tunap (Linux)
# Demultiplexage : trier chaque paquet entrant vers le bon socket.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment une machine mène-t-elle plusieurs connexions à la fois sans les mélanger ?", opts: ["Par une adresse MAC différente pour chaque flux", "Par le multiplexage grâce aux ports", "En changeant d'IP à chaque fois", "En ouvrant une carte réseau par connexion"], a: 1, exp: "Le multiplexage via les ports distingue chaque conversation." },
    { type: "qcm", q: "Une connexion TCP est identifiée de façon unique par…", opts: ["L'IP seule", "Le port seul", "Le quadruplet IP source, port source, IP dest, port dest", "L'adresse MAC"], a: 2, exp: "Le 4-tuple (quadruplet) identifie une connexion unique." },
    { type: "vf", q: "Deux connexions qui ne diffèrent que par le port source sont considérées comme distinctes.", a: true, exp: "Oui : un seul élément différent du quadruplet suffit." },
    { type: "input", q: "Combien d'éléments composent le quadruplet identifiant une connexion ? (un chiffre)", a: ["4", "quatre"], ph: "un chiffre", exp: "Quatre : IP src, port src, IP dest, port dest." },
    { type: "qcm", q: "Le serveur écoute généralement sur…", opts: ["Un port éphémère aléatoire", "Un port fixe et bien connu (80, 443…)", "Aucun port", "L'adresse MAC"], a: 1, exp: "Les serveurs utilisent des ports fixes connus." },
    { type: "qcm", q: "Le client choisit son port source dans une plage dite…", opts: ["réservée", "éphémère (dynamique, ex : 49152–65535)", "broadcast", "MAC"], a: 1, exp: "Les ports source du client sont éphémères/dynamiques." },
    { type: "vf", q: "Deux onglets vers le même site HTTPS partagent forcément le même port source.", a: false, exp: "Non : chaque connexion prend un port source différent." },
    { type: "input", q: "Quelle commande Windows liste les connexions et le PID associé ?", a: ["netstat -ano", "netstat", "netstat -ano "], ph: "commande", exp: "netstat -ano affiche connexions et identifiants de processus." },
    { type: "qcm", q: "Quelle commande liste les sockets sous Linux ?", opts: ["ls", "ss -tunap", "cd", "ping"], a: 1, exp: "ss (ou netstat) montre les sockets actifs sous Linux." },
    { type: "input", q: "Comment appelle-t-on l'opération de tri d'un paquet entrant vers le bon socket ? (un mot)", a: ["demultiplexage", "démultiplexage", "demultiplexing", "demux"], ph: "un mot", exp: "Le démultiplexage remet chaque paquet à la bonne application." },
    { type: "vf", q: "Une seule adresse IP peut porter des milliers de connexions simultanées.", a: true, exp: "Oui : les ports permettent ce multiplexage massif." },
    { type: "qcm", q: "Dans l'analogie de l'immeuble, le port correspond à…", opts: ["Le facteur", "Le numéro d'appartement (la boîte aux lettres)", "La ville", "Le camion"], a: 1, exp: "L'IP = l'immeuble, le port = l'appartement." },
    { type: "input", q: "Deux connexions d'un même client vers le même serveur:port sont différenciées par quel élément qui change ? (deux mots)", a: ["port source", "le port source", "port src"], ph: "deux mots", exp: "Le port source (éphémère) change à chaque connexion." },
    { type: "qcm", q: "À l'émission, répartir plusieurs flux sur une IP via les ports s'appelle…", opts: ["le démultiplexage", "le multiplexage", "le broadcast", "le routage"], a: 1, exp: "Le multiplexage regroupe plusieurs flux sur une même IP." },
    { type: "vf", q: "Le port d'écoute du serveur et le port source du client sont la même chose.", a: false, exp: "Non : le serveur a un port fixe, le client un port éphémère variable." }
  ],
  final: {
    title: "Exercice final — Démêler les connexions",
    intro: `<p>Ton PC (192.168.1.20) a deux onglets ouverts vers le même serveur HTTPS (93.184.216.34:443). Tu lances netstat et vois deux lignes ESTABLISHED : locale 192.168.1.20:52344 et 192.168.1.20:52345, toutes deux vers 93.184.216.34:443.</p>`,
    questions: [
      { type: "vf", q: "Ces deux lignes représentent bien deux connexions distinctes.", a: true, exp: "Oui : le port source diffère (52344 vs 52345), donc quadruplets distincts." },
      { type: "input", q: "Quel élément du quadruplet diffère entre les deux connexions ? (deux mots)", a: ["port source", "le port source", "port local", "port src"], ph: "deux mots", exp: "Seul le port source change (52344 / 52345)." },
      { type: "qcm", q: "L'IP destination et le port destination sont…", opts: ["Différents pour chaque onglet", "Identiques (93.184.216.34:443) pour les deux", "Inconnus", "Éphémères"], a: 1, exp: "Même serveur, même port 443 : seuls les ports source changent." },
      { type: "qcm", q: "Comment le serveur renvoie-t-il chaque réponse au bon onglet ?", opts: ["Au hasard", "En s'adressant au bon port source (52344 ou 52345) du client", "Par broadcast", "Il ne peut pas"], a: 1, exp: "Le port source distingue les deux flux : démultiplexage." },
      { type: "input", q: "Quelle commande Windows a produit ce tableau de connexions ?", a: ["netstat -ano", "netstat"], ph: "commande", exp: "netstat -ano liste les connexions actives." }
    ],
    solution: `<pre class="pseudo"># Deux connexions, un seul client, un seul serveur:port :
192.168.1.20:52344  &lt;-&gt;  93.184.216.34:443   ESTABLISHED  (onglet 1)
192.168.1.20:52345  &lt;-&gt;  93.184.216.34:443   ESTABLISHED  (onglet 2)
# Seul le PORT SOURCE differe -> quadruplets distincts.
# Le serveur repond a 52344 ou 52345 : demultiplexage correct.
# Observer : netstat -ano (Windows) | ss -tunap (Linux)</pre>
<p>Une IP, mille conversations : les ports font tout le tri. Demain, on change d'échelle avec la NAT, qui partage une IP publique entre plusieurs machines.</p>`
  }
};
