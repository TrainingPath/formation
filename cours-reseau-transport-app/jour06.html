  title: "Le socket : IP + port",
  subtitle: "Le couple qui désigne exactement une extrémité de communication.",
  theory: `
<h3>1. Réunir la machine et le logiciel</h3>
<p>Nous avons deux informations complémentaires : l'<strong>adresse IP</strong> (quelle machine) et le <strong>port</strong> (quel logiciel). En les réunissant, on obtient une désignation complète et sans ambiguïté d'une extrémité de communication. Ce couple s'appelle un <strong>socket</strong> (mot anglais qui signifie « prise »). On l'écrit sous la forme <strong>IP:port</strong>.</p>
<pre class="pseudo"># Un socket = une adresse IP + un numero de port
192.168.1.20 : 443     -> le service HTTPS sur cette machine
93.184.216.34 : 80     -> le service web sur ce serveur distant
# Format : ADRESSE_IP : PORT</pre>
<p>Analogie : le socket, c'est l'adresse postale <em>complète</em> — pas seulement la rue et l'immeuble (IP), mais aussi l'appartement (port). Avec un socket, on sait exactement à qui remettre les données.</p>
<h3>2. Une communication = deux sockets</h3>
<p>Une conversation réseau relie <strong>deux</strong> extrémités : il y a donc un socket côté client et un socket côté serveur. La <strong>paire de sockets</strong> identifie de façon unique la connexion en cours. C'est ce qui permet à ta machine de suivre des dizaines de connexions simultanées sans les confondre : chacune a sa combinaison unique d'adresses et de ports.</p>
<pre class="pseudo"># Une connexion identifiee par la paire de sockets
Client  198.51.100.7 : 51000   &lt;===&gt;   Serveur  93.184.216.34 : 443
#        ^ IP client   ^ port client        ^ IP serveur   ^ port serveur
# Cette combinaison des 4 valeurs est unique : pas de melange possible.</pre>
<h3>3. Le socket côté programmeur</h3>
<p>Le mot « socket » a aussi un sens pour qui écrit du code : c'est l'<strong>objet logiciel</strong> que le système fournit à un programme pour envoyer et recevoir des données sur le réseau. Le programme « ouvre un socket », le « lie » (en anglais <em>bind</em>) à un port, puis écoute ou se connecte. Mais l'idée reste la même : un socket représente une extrémité de communication.</p>
<div class="tip">Retiens l'équation fondamentale : <strong>socket = adresse IP + port</strong>. IP toute seule = la machine. Port tout seul = un simple numéro. Ensemble = une extrémité précise et joignable.</div>
<h3>4. Pourquoi c'est utile</h3>
<p>Le socket est la brique qui rend possible le multiplexage vu précédemment. Quand un paquet arrive, le système regarde le socket destination (IP:port) pour livrer au bon logiciel, et le socket source pour savoir à qui répondre. Des outils d'administration (comme la commande qui liste les connexions actives) affichent justement ces couples IP:port pour montrer qui parle à qui.</p>
<div class="warn">Ne confonds pas socket et port. Le <strong>port</strong> est juste un numéro. Le <strong>socket</strong> est le couple complet IP:port. Dire « port 443 » ne suffit pas à joindre quelqu'un : il faut aussi savoir sur quelle machine.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Socket = adresse IP + numero de port  (ecrit IP:port)
# Il designe une EXTREMITE precise de communication
# Une connexion = une PAIRE de sockets (client + serveur)
# Les 4 valeurs (IP+port source, IP+port dest) rendent l'echange unique
# Cote code : un socket est l'objet pour emettre/recevoir sur le reseau</pre>`,

    { type: "vf", q: "« Port 443 » suffit à joindre un service, sans connaître la machine.", a: false, exp: "Non : il faut aussi l'IP. Le socket complet est IP:port." },

    { type: "qcm", q: "Pour un développeur, un socket est aussi…", opts: ["Un numéro de port réservé", "L'objet logiciel pour émettre et recevoir sur le réseau", "Un protocole de la couche application", "Une adresse MAC"], a: 1, exp: "Côté code, le socket est l'objet fourni par le système pour communiquer." },

    { type: "vf", q: "IP seule identifie déjà le logiciel destinataire.", a: false, exp: "Non : IP identifie la machine. Il faut le port pour viser le logiciel, d'où le socket." },
    { type: "qcm", q: "Le socket destination sert à…", opts: ["Router le paquet vers la passerelle", "Livrer les données au bon logiciel", "Identifier la machine de destination", "Numéroter les octets envoyés"], a: 1, exp: "Le socket destination (IP:port) désigne le logiciel qui doit recevoir." },
    { type: "qcm", q: "Quelle affirmation est correcte ?", opts: ["Socket = port uniquement", "Socket = IP uniquement", "Socket = IP + port", "Socket = adresse MAC + IP"], a: 2, exp: "Un socket combine l'adresse IP et le port." },
    { type: "input", q: "Dans la notation 198.51.100.7:51000, quel est le numéro de port (nombre) ?", a: ["51000"], ph: "un nombre", exp: "Après les deux-points figure le port : ici 51000 (un port éphémère côté client)." },
    { type: "qcm", q: "Le socket est la brique qui rend possible…", opts: ["Le multiplexage (aiguiller chaque flux)", "Le routage des paquets entre réseaux", "La résolution des noms de domaine", "Le chiffrement de bout en bout"], a: 0, exp: "Grâce au socket, le système livre chaque flux au bon logiciel." }
  ],

    ],

Client  198.51.100.7 : 51000  &lt;===&gt;  Serveur 93.184.216.34 : 443

<p>Un socket, c'est une prise identifiée : IP:port. Maintenant que l'adressage des logiciels est clair, voyons les deux protocoles de transport. Demain : UDP.</p>`
