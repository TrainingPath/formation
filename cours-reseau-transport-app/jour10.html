<script>
var DAY = {
  num: 10,
  title: "Le contrôle de flux et les acquittements (numéros de séquence, ACK, fenêtre glissante)",
  subtitle: "Comment TCP garantit que chaque octet arrive, dans le bon ordre, sans noyer le récepteur.",
  theory: `
<h3>1. Numéroter chaque octet</h3>
<p>Une fois la connexion établie, TCP découpe les données en <strong>segments</strong>. Pour ne rien perdre ni mélanger, il numérote les octets grâce au <strong>numéro de séquence</strong> (en anglais <em>sequence number</em>). C'est comme paginer un long courrier : « page 1, page 2… ». Si une page manque ou arrive en désordre, le destinataire s'en aperçoit et peut tout remettre dans l'ordre.</p>
<h3>2. L'acquittement (ACK)</h3>
<p>Chaque fois que le récepteur reçoit des données, il renvoie un <strong>acquittement</strong> (en anglais <em>acknowledgment</em>, drapeau <strong>ACK</strong>) qui dit « j'ai bien tout reçu jusqu'à tel octet, envoie la suite ». Le <strong>numéro d'acquittement</strong> (ack number) indique le prochain octet attendu. C'est un accusé de réception cumulatif : ack=1461 signifie « j'ai les octets jusqu'à 1460, donne-moi le 1461 ».</p>
<pre class="pseudo"># Emetteur envoie 3 segments de 1460 octets
seq=1     (1..1460)   --&gt;   ACK=1461   (recu jusqu'a 1460)
seq=1461  (1461..2920) --&gt;  ACK=2921   (recu jusqu'a 2920)
seq=2921  (2921..4380) --&gt;  ACK=4381   (recu jusqu'a 4380)</pre>
<div class="tip">Le numéro d'ACK = <strong>le prochain octet attendu</strong>, pas le dernier reçu. C'est la source d'erreur la plus fréquente des débutants.</div>
<h3>3. Perte et retransmission</h3>
<p>Si un segment se perd, le récepteur ne peut pas acquitter la suite : il continue de réclamer le même octet manquant (on parle d'<strong>ACK dupliqués</strong>). L'émetteur, ne recevant pas l'accusé attendu (ou voyant expirer un <strong>délai / timeout</strong>), <strong>retransmet</strong> le segment perdu. C'est ce mécanisme d'acquittement + retransmission qui rend TCP <strong>fiable</strong> : aucune donnée n'est abandonnée en silence.</p>
<h3>4. La fenêtre glissante (sliding window)</h3>
<p>Attendre un ACK après chaque segment serait lent. TCP autorise donc l'émetteur à envoyer <strong>plusieurs segments d'avance</strong> avant d'attendre confirmation : la quantité autorisée s'appelle la <strong>fenêtre</strong> (en anglais <em>window</em>). Le récepteur annonce dans chaque segment la taille de fenêtre qu'il peut absorber (le champ <em>Window Size</em>). Au fur et à mesure que les ACK arrivent, la fenêtre <strong>glisse</strong> vers l'avant : d'où le nom de <strong>fenêtre glissante</strong> (<em>sliding window</em>).</p>
<pre class="pseudo"># Fenetre = 3 segments : on envoie 3 d'avance, sans attendre
[ seg1 seg2 seg3 ] seg4 seg5 ...
   ^ ACK de seg1 recu -> la fenetre glisse :
seg1 [ seg2 seg3 seg4 ] seg5 ...</pre>
<h3>5. Le contrôle de flux</h3>
<p>La fenêtre sert aussi de <strong>contrôle de flux</strong> (en anglais <em>flow control</em>) : un récepteur débordé annonce une fenêtre plus petite (voire 0) pour dire « ralentis, je n'ai plus de place ». L'émetteur s'adapte. On évite ainsi qu'une machine rapide ne noie une machine lente. (À ne pas confondre avec le <em>contrôle de congestion</em>, qui protège le réseau lui-même.)</p>
<div class="warn">Fenêtre annoncée à 0 = « stop, tampon plein ». L'émetteur doit attendre une mise à jour (window update) avant de reprendre. Un débit qui s'effondre s'explique souvent par des fenêtres qui rétrécissent.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># seq (numero de sequence) : numerote les octets envoyes
# ACK (numero d'acquittement) : prochain octet attendu par le recepteur
# Perte -> pas d'ACK / ACK dupliques -> retransmission (fiabilite)
# Fenetre (window) : nb d'octets envoyables sans attendre d'ACK
# Fenetre glissante : elle avance a mesure que les ACK arrivent
# Fenetre = 0 : recepteur sature -> emetteur en pause (controle de flux)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le numéro de séquence (seq) ?", opts: ["À chiffrer les données", "À numéroter les octets pour les remettre dans l'ordre et détecter les pertes", "À choisir le port", "À fermer la connexion"], a: 1, exp: "Le seq numérote les octets : ordre et détection de perte." },
    { type: "qcm", q: "Que signifie un numéro d'acquittement ACK=2921 ?", opts: ["2921 octets ont été perdus", "Le récepteur a tout reçu jusqu'à 2920 et attend l'octet 2921", "Il faut renvoyer l'octet 2921", "La fenêtre vaut 2921"], a: 1, exp: "L'ACK indique le prochain octet attendu : reçu jusqu'à 2920." },
    { type: "vf", q: "Le numéro d'ACK désigne le dernier octet reçu.", a: false, exp: "Non : il désigne le PROCHAIN octet attendu, pas le dernier reçu." },
    { type: "input", q: "Comment appelle-t-on le mécanisme qui permet d'envoyer plusieurs segments d'avance avant d'attendre un ACK ? (deux mots)", a: ["fenetre glissante", "fenêtre glissante", "sliding window", "la fenetre glissante"], ph: "deux mots", exp: "La fenêtre glissante (sliding window)." },
    { type: "qcm", q: "Que fait l'émetteur s'il ne reçoit pas l'ACK attendu (timeout) ?", opts: ["Il ferme la connexion", "Il retransmet le segment", "Il change de port", "Il ignore la perte"], a: 1, exp: "TCP retransmet le segment non acquitté : c'est la fiabilité." },
    { type: "vf", q: "L'acquittement TCP est cumulatif : ACK=1461 confirme tout jusqu'à l'octet 1460.", a: true, exp: "Oui : un seul ACK confirme tous les octets reçus jusque-là." },
    { type: "qcm", q: "Que signifie une fenêtre annoncée à 0 ?", opts: ["Débit maximal", "Le récepteur est saturé : l'émetteur doit s'arrêter", "La connexion est fermée", "Perte totale"], a: 1, exp: "Window=0 : tampon plein, l'émetteur attend une mise à jour." },
    { type: "input", q: "Quel drapeau TCP porte l'accusé de réception ? (3 lettres)", a: ["ack"], ph: "3 lettres", exp: "Le drapeau ACK porte l'acquittement." },
    { type: "qcm", q: "À quoi sert le contrôle de flux (flow control) ?", opts: ["À chiffrer", "À empêcher un émetteur rapide de noyer un récepteur lent", "À router les paquets", "À attribuer les IP"], a: 1, exp: "Le contrôle de flux ajuste le débit à la capacité du récepteur." },
    { type: "qcm", q: "Pourquoi ne pas attendre un ACK après chaque segment ?", opts: ["Ce serait plus fiable", "Ce serait très lent : la fenêtre permet d'en envoyer plusieurs d'avance", "Cela dépasserait la taille maximale d'un segment", "Cela empêcherait le contrôle de flux"], a: 1, exp: "La fenêtre glissante augmente le débit en évitant les attentes." },
    { type: "vf", q: "Des ACK dupliqués (répétés) signalent souvent un segment manquant.", a: true, exp: "Oui : le récepteur redemande le même octet tant qu'il manque." },
    { type: "input", q: "Quel champ de l'en-tête TCP annonce la taille de fenêtre disponible ? (deux mots anglais)", a: ["window size", "window", "fenetre", "taille de fenetre"], ph: "champ TCP", exp: "Le champ Window Size annonce la place disponible." },
    { type: "qcm", q: "La fenêtre « glisse » quand…", opts: ["La connexion se ferme", "Des ACK arrivent, libérant de la place pour de nouveaux octets", "Le port change", "L'IP change"], a: 1, exp: "Chaque ACK reçu fait avancer (glisser) la fenêtre." },
    { type: "vf", q: "Le contrôle de flux et le contrôle de congestion sont exactement la même chose.", a: false, exp: "Non : le flux protège le récepteur ; la congestion protège le réseau." },
    { type: "qcm", q: "Grâce à quel duo de mécanismes TCP est-il « fiable » ?", opts: ["Chiffrement + compression", "Acquittements + retransmissions", "Broadcast + multicast", "NAT + PAT"], a: 1, exp: "ACK + retransmission garantissent que rien n'est perdu." }
  ],
  final: {
    title: "Exercice final — Suivre les numéros",
    intro: `<p>Un serveur envoie un fichier à un client par segments de 1000 octets. Le premier segment part avec seq=1. Suis les échanges et raisonne sur les numéros.</p>`,
    questions: [
      { type: "input", q: "Le client reçoit le segment seq=1 (octets 1 à 1000). Quel numéro d'ACK renvoie-t-il ?", a: ["1001", "ack=1001"], ph: "un nombre", exp: "Il a reçu jusqu'à 1000, il attend 1001 : ACK=1001." },
      { type: "qcm", q: "Le segment seq=1001 se perd en route. Que fait le client ?", opts: ["Il acquitte 2001", "Il continue de renvoyer ACK=1001 (il attend toujours 1001)", "Il ferme la connexion", "Il change de port"], a: 1, exp: "Sans le segment 1001, il redemande 1001 (ACK dupliqués)." },
      { type: "vf", q: "Voyant ces ACK dupliqués (ou un timeout), le serveur retransmet le segment perdu.", a: true, exp: "Oui : c'est la retransmission qui assure la fiabilité." },
      { type: "qcm", q: "Le client annonce soudain Window=0. Que doit faire le serveur ?", opts: ["Envoyer plus vite", "Suspendre l'envoi et attendre une mise à jour de fenêtre", "Fermer avec RST", "Ignorer"], a: 1, exp: "Window=0 = récepteur saturé : le serveur met l'envoi en pause." },
      { type: "qcm", q: "Quel bénéfice apporte une fenêtre plus grande (si le récepteur suit) ?", opts: ["Moins de fiabilité", "Un meilleur débit, car plus de segments partent avant d'attendre un ACK", "Moins de mémoire utilisée par le récepteur", "Une fiabilité accrue grâce à davantage d'acquittements"], a: 1, exp: "Une fenêtre large réduit les attentes et augmente le débit." }
    ],
    solution: `<pre class="pseudo"># Suivi des numeros (segments de 1000 octets) :
seq=1     (1..1000)    -> ACK=1001
seq=1001  PERDU        -> le client renvoie ACK=1001 (redemande)
   => timeout / ACK dupliques : le serveur RETRANSMET seq=1001
Window=0 annonce -> le serveur met l'envoi en PAUSE (controle de flux)
# ACK = prochain octet attendu ; fenetre = octets envoyables d'avance.</pre>
<p>Numéros de séquence, ACK et fenêtre glissante : voilà le moteur de fiabilité de TCP. Demain, on referme proprement la connexion.</p>`
  }
};
</script>
