  title: "Pratique : tester des services (telnet, curl)",
  subtitle: "Parler aux serveurs à la main pour comprendre ce qui se passe vraiment.",
  theory: `
<h3>1. Pourquoi tester à la main</h3>
<p>Un navigateur cache tout : il ouvre la connexion, envoie la requête, lit la réponse, et n'affiche que la page. Pour <em>comprendre</em> et <em>diagnostiquer</em>, on descend d'un cran avec deux outils en ligne de commande : <strong>telnet</strong>, qui ouvre une connexion brute vers un port, et <strong>curl</strong>, qui parle HTTP pour toi tout en montrant les coulisses. Ce sont les stéthoscopes du réseau.</p>
<h3>2. telnet : ouvrir une porte et parler</h3>
<p><strong>telnet</strong> établit une simple connexion TCP vers un <strong>hôte</strong> et un <strong>port</strong> que tu précises. Tout ce que tu tapes est envoyé tel quel au serveur ; tout ce qu'il répond s'affiche. C'est idéal pour vérifier qu'un service <strong>écoute</strong> sur un port et pour lui parler dans sa propre langue.</p>
<pre class="pseudo"># Vérifier qu'un serveur web répond sur le port 80 :
telnet exemple.fr 80
# La connexion s'ouvre ; on tape ensuite une requête HTTP à la main :
GET / HTTP/1.1
Host: exemple.fr
(ligne vide -> on appuie deux fois sur Entrée pour envoyer)</pre>
<p>Ici, la <strong>ligne vide</strong> est capitale : elle signale la fin des en-têtes et déclenche l'envoi. Le serveur répond alors avec sa ligne de statut (ex. <code>HTTP/1.1 200 OK</code>), ses en-têtes, puis le corps HTML.</p>
<div class="warn">telnet transmet tout en clair et sert au diagnostic, pas à l'usage courant. Ne t'en sers jamais pour te connecter à une vraie session distante : pour cela on utilise SSH, chiffré. telnet reste précieux pour « tester si un port répond ».</div>
<h3>3. curl : le couteau suisse d'HTTP</h3>
<p><strong>curl</strong> (« see URL ») envoie des requêtes et affiche les réponses. Utilisé simplement, <code>curl https://exemple.fr</code> récupère et affiche le HTML. Mais ses options révèlent les coulisses :</p>
<pre class="pseudo">curl -I https://exemple.fr      # -I : demander seulement les EN-TÊTES (méthode HEAD)
curl -v https://exemple.fr      # -v : mode verbeux, montre requête + réponse
curl -L https://exemple.fr      # -L : suivre les redirections (301/302)
curl -o page.html https://...   # -o : enregistrer la réponse dans un fichier
curl -X POST -d "n=3" https://... # -X : méthode, -d : données du corps</pre>
<p>L'option <strong>-I</strong> (i majuscule) est la plus utile pour un diagnostic rapide : elle affiche uniquement les en-têtes de la réponse, dont le <strong>code de statut</strong> et le <code>Content-Type</code>, sans télécharger toute la page.</p>
<pre class="pseudo"># Exemple de sortie de : curl -I https://exemple.fr
HTTP/2 200
content-type: text/html; charset=UTF-8
content-length: 1256
server: nginx</pre>
<h3>4. Lire un code de statut au diagnostic</h3>
<p>Les codes vus au jour 25 reviennent ici, bien concrets. Un <code>200</code> : le service répond correctement. Un <code>301</code>/<code>302</code> : redirection (utilise <code>-L</code> pour la suivre). Un <code>404</code> : la ressource demandée n'existe pas. Un <code>500</code> : le serveur plante. Combiné à telnet (le port répond-il ?) et curl (que renvoie-t-il ?), on isole vite l'origine d'un problème.</p>
<div class="tip">Méthode de diagnostic : d'abord <strong>telnet hôte port</strong> pour vérifier que le service écoute ; s'il répond, <strong>curl -I</strong> pour lire le statut et les en-têtes ; enfin <strong>curl -v</strong> si tu veux voir tout l'échange en détail.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># telnet hôte port  -> teste si un service ÉCOUTE ; parle en clair (diagnostic)
#   ex : telnet exemple.fr 80  puis  GET / HTTP/1.1 + Host + ligne vide
# curl -I URL       -> affiche seulement les EN-TÊTES (statut, Content-Type)
# curl -v (verbeux) | -L (suit redirections) | -o (enregistre) | -X/-d (POST)
# Réflexe : telnet (le port répond ?) puis curl -I (que dit le serveur ?)</pre>`,

    { type: "qcm", q: "À quoi sert principalement telnet dans un diagnostic réseau ?", opts: ["Chiffrer une connexion", "Vérifier qu'un service écoute sur un port et lui parler en clair", "Résoudre un nom de domaine", "Compresser des fichiers"], a: 1, exp: "telnet ouvre une connexion TCP brute vers un hôte:port pour tester et dialoguer en clair." },
    { type: "input", q: "Quelle commande ouvre une connexion vers le serveur web « exemple.fr » sur le port 80 ? (écris la ligne complète)", a: ["telnet exemple.fr 80"], ph: "telnet ...", exp: "telnet exemple.fr 80 ouvre une connexion TCP vers le port HTTP." },

    { type: "input", q: "Quelle option de curl enregistre la réponse dans un fichier ?", a: ["-o", "o"], ph: "une option", exp: "curl -o fichier enregistre la réponse au lieu de l'afficher." },
    { type: "vf", q: "curl -v (verbeux) montre à la fois la requête envoyée et la réponse reçue.", a: true, exp: "Vrai : le mode verbeux affiche les coulisses de l'échange HTTP." },
    { type: "qcm", q: "Quel en-tête de réponse, visible avec curl -I, indique le type du contenu ?", opts: ["Host", "Content-Type", "User-Agent", "Referer"], a: 1, exp: "Content-Type décrit le format renvoyé (ex. text/html)." },
    { type: "qcm", q: "Quelle est la bonne séquence de diagnostic ?", opts: ["curl -I puis telnet puis ping", "telnet (le port répond ?) puis curl -I (que dit le serveur ?)", "Redémarrer d'abord la machine", "curl -o puis telnet"], a: 1, exp: "On vérifie d'abord l'écoute du port (telnet), puis on lit le statut/les en-têtes (curl -I)." },
    { type: "input", q: "Quelle méthode HTTP curl -X POST envoie-t-il ? (un mot)", a: ["post", "un post"], ph: "une méthode", exp: "curl -X POST envoie une requête POST ; -d fournit les données du corps." },
    { type: "vf", q: "Un code 404 dans une réponse signifie que la ressource demandée n'existe pas.", a: true, exp: "Vrai : 404 = Not Found, la ressource est introuvable à cet emplacement." },
    { type: "qcm", q: "Pour tester rapidement le statut d'un site sans télécharger toute la page, on utilise…", opts: ["curl -o", "curl -I", "curl -d", "telnet 443"], a: 1, exp: "curl -I affiche uniquement les en-têtes, dont le code de statut : idéal pour un test rapide." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer un site injoignable",
    intro: `<p>Sami trouve que le site <code>boutique.exemple.fr</code> « ne marche pas ». Plutôt que de deviner, il sort ses outils. Il tape d'abord <code>telnet boutique.exemple.fr 80</code>, puis <code>curl -I http://boutique.exemple.fr</code>. curl affiche : <code>HTTP/1.1 301 Moved Permanently</code> et <code>location: https://boutique.exemple.fr/</code>.</p>`,
    questions: [
      { type: "qcm", q: "Que vérifie d'abord Sami avec « telnet boutique.exemple.fr 80 » ?", opts: ["Que le DNS est en panne", "Que le service web écoute bien sur le port 80", "Que le site est chiffré", "La vitesse du disque"], a: 1, exp: "telnet hôte 80 teste si le service web répond sur ce port." },
      { type: "input", q: "Quelle option a-t-il donnée à curl pour n'afficher que les en-têtes ?", a: ["-i", "i", "-I", "I"], ph: "une option", exp: "curl -I affiche seulement les en-têtes de la réponse." },
      { type: "qcm", q: "Que signifie le code 301 renvoyé ?", opts: ["Erreur serveur", "Ressource introuvable", "Redirection permanente vers une autre adresse", "Succès direct"], a: 2, exp: "301 = Moved Permanently : la ressource a changé d'adresse (ici vers https)." },
      { type: "qcm", q: "Vers quelle adresse l'en-tête « location » redirige-t-il ?", opts: ["http://boutique.exemple.fr", "https://boutique.exemple.fr/", "ftp://boutique.exemple.fr", "Nulle part"], a: 1, exp: "L'en-tête Location indique la nouvelle adresse, ici en https." },
      { type: "vf", q: "Pour suivre automatiquement cette redirection avec curl, Sami peut ajouter l'option -L.", a: true, exp: "Vrai : curl -L suit les redirections 301/302 jusqu'à la page finale." }
    ],
    solution: `<pre class="pseudo"># Diagnostic de Sami, étape par étape :
1) telnet boutique.exemple.fr 80   -> le port 80 répond : le service écoute.
2) curl -I http://boutique.exemple.fr
   HTTP/1.1 301 Moved Permanently
   location: https://boutique.exemple.fr/
   -> pas une panne : simple REDIRECTION du http vers le https.
3) curl -L http://boutique.exemple.fr  -> suit la redirection vers https.</pre>
<p>Le site « ne marchait pas » simplement parce qu'il redirige vers sa version HTTPS. telnet a confirmé l'écoute du port, curl -I a révélé le 301 : diagnostic bouclé sans navigateur.</p>`
