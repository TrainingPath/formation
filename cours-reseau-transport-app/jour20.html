  title: "Le port forwarding (redirection de port)",
  subtitle: "Ouvrir une porte précise dans la box pour rendre un service interne accessible depuis Internet.",
  theory: `
<h3>1. Le problème inverse de la PAT</h3>
<p>Grâce à la PAT, tes appareils sortent tous sur Internet avec une seule IP publique — et personne de l'extérieur ne peut les joindre directement. C'est très bien pour naviguer. Mais parfois tu veux exactement l'inverse : rendre un service interne <strong>accessible depuis l'extérieur</strong>. Par exemple, héberger un serveur de jeu chez toi, un petit site web, ou accéder à ta caméra de surveillance quand tu es en déplacement. La PAT bloque ces connexions entrantes. La solution : le <strong>port forwarding</strong>.</p>
<h3>2. Le principe du port forwarding</h3>
<p>Le <strong>port forwarding</strong> (« redirection de port ») est une règle qu'on ajoute dans la box : « <strong>toute connexion arrivant sur MON adresse publique, tel port, doit être redirigée vers telle machine interne, tel port</strong> ». On perce volontairement une porte précise dans le mur de la PAT.</p>
<pre class="pseudo"># Regle de port forwarding dans la box (IP publique = 82.65.10.7)
# Connexion entrante              -> Redirigee vers (interne)
82.65.10.7 : 80    (HTTP)        -> 192.168.1.50 : 80    (serveur web)
82.65.10.7 : 25565 (Minecraft)   -> 192.168.1.60 : 25565 (serveur de jeu)
# Une connexion venue d'Internet sur le port 80 est envoyee au PC 192.168.1.50.</pre>
<div class="tip">On peut aussi <strong>changer de port</strong> au passage : une connexion arrivant sur le port public 8080 peut être redirigée vers le port interne 80. Le port public (« externe ») et le port interne n'ont pas à être identiques.</div>
<h3>3. Comment ça se passe concrètement</h3>
<p>Tu vas dans l'interface d'administration de ta box (souvent à l'adresse <code>192.168.1.1</code> dans le navigateur), section « NAT / Redirection de ports ». Tu indiques : le <strong>port externe</strong>, l'<strong>adresse IP interne</strong> de la machine cible, le <strong>port interne</strong>, et le <strong>protocole</strong> (TCP, UDP, ou les deux). Une fois la règle enregistrée, un visiteur qui tape <code>http://82.65.10.7</code> atteindra ton serveur web interne.</p>
<pre class="pseudo"># Chemin d'une connexion entrante avec port forwarding :
Internet --> 82.65.10.7:80  (adresse publique de la box)
          --> [ box : regle de forwarding ]
          --> 192.168.1.50:80  (ton serveur web interne)
# Sans la regle, la box aurait rejete la connexion (effet PAT).</pre>
<div class="warn">Sécurité : ouvrir un port, c'est exposer une machine interne à Internet entier. N'ouvre que ce qui est nécessaire, garde le service à jour, et protège-le (mot de passe fort). Une porte ouverte et mal gardée est une invitation aux attaques. Beaucoup de piratages de caméras viennent de ports ouverts sans protection.</div>
<h3>4. Port forwarding, DMZ et alternatives</h3>
<p>À ne pas confondre : la <strong>DMZ</strong> (en anglais <em>demilitarized zone</em>) redirige <em>tous</em> les ports vers une seule machine — bien plus risqué, à éviter sauf besoin précis. Il existe aussi l'<strong>UPnP</strong>, un mécanisme qui laisse les applications ouvrir automatiquement des ports (pratique mais parfois dangereux). Pour un accès distant, on préfère souvent aujourd'hui un <strong>VPN</strong> plutôt que d'ouvrir des ports en grand.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Port forwarding = redirection de port
# But : rendre un service INTERNE accessible depuis l'EXTERIEUR
# Regle : (IP publique : port externe) -> (IP interne : port interne)
# Ex : 82.65.10.7:80 -> 192.168.1.50:80  (serveur web maison)
# Port externe et interne peuvent differer
# Prudence : n'ouvrir que le necessaire, service protege et a jour
# A ne pas confondre avec la DMZ (redirige TOUS les ports = plus risque)</pre>`,

    { type: "qcm", q: "La DMZ, comparée au port forwarding…", opts: ["Est identique", "Redirige TOUS les ports vers une machine (plus risqué)", "N'ouvre aucun port", "Chiffre le trafic"], a: 1, exp: "La DMZ expose tout : bien plus dangereux, à réserver aux cas précis." },

    { type: "input", q: "Quel mécanisme (4 lettres) permet à des applications d'ouvrir automatiquement des ports sur la box ?", a: ["upnp", "l'upnp"], ph: "4 lettres", exp: "UPnP ouvre des ports automatiquement : pratique mais parfois risqué." },
    { type: "qcm", q: "Pour héberger un serveur web maison joignable de l'extérieur, quel port externe rediriger classiquement ?", opts: ["Le port 22", "Le port 80 (HTTP)", "Le port 3306", "Le port 161"], a: 1, exp: "HTTP utilise le port 80 ; on le redirige vers le serveur web interne." },
    { type: "qcm", q: "Après avoir créé la règle 82.65.10.7:80 -> 192.168.1.50:80, un visiteur qui tape http://82.65.10.7…", opts: ["Est rejeté", "Atteint le serveur web interne 192.168.1.50", "Atteint la box seulement", "Reçoit une erreur DNS"], a: 1, exp: "La règle redirige la connexion entrante vers la machine interne cible." },
    { type: "vf", q: "Le port forwarding est indispensable quand on veut être JOIGNABLE, alors que la PAT suffit pour seulement SORTIR.", a: true, exp: "Oui : sortir = PAT ; être joint depuis l'extérieur = port forwarding." },
    { type: "input", q: "Quel type de connexion (entrante ou sortante) le port forwarding autorise-t-il spécifiquement ?", a: ["entrante", "entrantes", "les entrantes", "connexion entrante", "entrant"], ph: "un mot", exp: "Le port forwarding autorise des connexions ENTRANTES vers une machine interne." }
  ],
  final: {
    title: "Exercice final — Héberger un serveur de jeu",
    intro: `<p>Karim veut héberger un serveur Minecraft (port 25565) sur son PC <code>192.168.1.60</code> pour que ses amis se connectent depuis Internet. La box a l'adresse publique <code>90.10.20.30</code>.</p>`,
    questions: [

      { type: "qcm", q: "Quelle règle doit-il créer ?", opts: ["90.10.20.30:25565 -> 192.168.1.60:25565", "192.168.1.60:25565 -> Internet", "90.10.20.30:80 -> 192.168.1.1", "Aucune règle nécessaire"], a: 0, exp: "On redirige le port externe 25565 vers son PC interne sur le même port." },
      { type: "qcm", q: "Quelle adresse ses amis devront-ils utiliser pour se connecter ?", opts: ["192.168.1.60", "L'adresse publique 90.10.20.30", "127.0.0.1", "L'adresse de la box 192.168.1.1"], a: 1, exp: "Depuis Internet, on vise l'adresse publique de la box, qui redirige en interne." },
      { type: "vf", q: "Karim devrait garder son serveur à jour et protégé, car il l'expose désormais à Internet.", a: true, exp: "Oui : tout port ouvert est une surface d'attaque à sécuriser." }
    ],
    solution: `<pre class="pseudo"># Objectif : rendre le serveur Minecraft interne joignable de l'exterieur
# 1) Dans la box (192.168.1.1) -> section NAT / Redirection de ports
# 2) Regle : 90.10.20.30:25565 (TCP)  ->  192.168.1.60:25565
# 3) Les amis se connectent a : 90.10.20.30  (l'adresse publique)
# 4) Securite : service a jour, PC protege, n'ouvrir QUE ce port.</pre>
<p>Le port forwarding est la clé pour être joignable derrière une box. Demain, on observe concrètement toutes ces translations : tables NAT et iptables.</p>`
