<script>
var DAY = {
  num: 3,
  title: "La couche 4 : le rôle du transport",
  subtitle: "Bout-en-bout, découpe et aiguillage : le métier oublié qui fait marcher tout le reste.",
  theory: `
<h3>1. Le transport parle « de bout en bout »</h3>
<p>La couche <strong>transport</strong> (couche 4) a une particularité : elle établit un dialogue <strong>de bout en bout</strong> (en anglais <em>end-to-end</em>), c'est-à-dire directement entre le logiciel émetteur et le logiciel récepteur. Les routeurs situés entre les deux ne regardent pas ce niveau : ils s'occupent seulement d'IP (couche 3). Autrement dit, le transport est une conversation privée entre les deux extrémités, comme une lettre scellée que les facteurs transmettent sans l'ouvrir.</p>
<p>C'est une grande différence avec la couche réseau : IP est traité à <em>chaque</em> saut (chaque routeur relit l'adresse), tandis que le transport n'est lu qu'aux <em>deux extrémités</em>. Le réseau route ; le transport dialogue.</p>
<h3>2. La segmentation : découper pour transporter</h3>
<p>Un message applicatif peut être énorme (une vidéo, un fichier). Or on ne peut pas envoyer un bloc géant d'un coup. La couche transport pratique donc la <strong>segmentation</strong> : elle découpe les données en morceaux appelés <strong>segments</strong> (avec TCP) ou <strong>datagrammes</strong> (avec UDP). À l'arrivée, la couche transport de destination les <strong>réassemble</strong> dans le bon ordre pour reconstituer le message d'origine.</p>
<pre class="pseudo"># Un gros message decoupe puis reassemble
Message applicatif  =====================================
Segmentation        [seg1][seg2][seg3][seg4] ...  -> envoi
Reassemblage         seg1 + seg2 + seg3 + seg4  -> message reconstitue</pre>
<h3>3. Le multiplexage : plusieurs conversations sur un seul tuyau</h3>
<p>Sur ta machine, de nombreux logiciels utilisent le réseau <em>en même temps</em>. Comment tout ce trafic voyage-t-il sans se mélanger ? Grâce au <strong>multiplexage</strong> : la couche transport étiquette chaque flux pour le distinguer des autres, puis les fait cohabiter sur la même connexion réseau. À l'arrivée, le <strong>démultiplexage</strong> range chaque flux vers le bon logiciel destinataire.</p>
<p>Image : une autoroute unique où plusieurs files de voitures circulent en parallèle. Chaque voiture porte une plaque ; à la sortie, on aiguille chacune vers sa destination. Cette « plaque » qui identifie l'application, c'est le <strong>numéro de port</strong> — sujet du prochain cours.</p>
<div class="tip">Résumé des trois missions du transport : <strong>découper</strong> (segmentation), <strong>faire cohabiter</strong> les flux (multiplexage), et <strong>livrer au bon logiciel</strong> à l'arrivée (démultiplexage). Selon le protocole choisi, il peut aussi <strong>fiabiliser</strong> (TCP) ou rester <strong>léger</strong> (UDP).</div>
<h3>4. Deux styles : fiable ou rapide</h3>
<p>La couche 4 offre deux protocoles au choix. <strong>TCP</strong> est fiable et ordonné : il vérifie que tout arrive, réémet ce qui se perd et remet dans l'ordre. <strong>UDP</strong> est léger et rapide : il envoie sans garantie ni ordre. Le logiciel choisit selon son besoin : télécharger un fichier réclame la fiabilité de TCP ; un appel vidéo en direct préfère la vitesse d'UDP. Nous détaillerons chacun dans les derniers cours.</p>
<div class="warn">La couche transport ne « transporte » pas physiquement les données : ce sont les couches basses qui le font. Elle <em>organise</em> le dialogue (découpe, ordre, aiguillage, fiabilité). Le nom peut prêter à confusion.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Transport (couche 4) = dialogue de bout en bout (end-to-end)
# Les routeurs ne lisent QUE IP (couche 3), pas le transport
# Segmentation : decouper le message en segments/datagrammes
# Multiplexage : faire cohabiter plusieurs flux sur un lien
# Demultiplexage : livrer chaque flux au bon logiciel (via le port)
# TCP = fiable/ordonne   |   UDP = leger/rapide</pre>`,
  exercises: [
    { type: "qcm", q: "La couche transport établit un dialogue…", opts: ["Saut par saut, à chaque routeur", "De bout en bout (entre les deux logiciels)", "Uniquement local", "Sur le câble seulement"], a: 1, exp: "Le transport est end-to-end : lu seulement aux deux extrémités." },
    { type: "vf", q: "Les routeurs intermédiaires lisent et traitent l'en-tête de la couche transport à chaque saut.", a: false, exp: "Non : ils traitent IP (couche 3). Le transport n'est lu qu'aux extrémités." },
    { type: "input", q: "Comment appelle-t-on le découpage d'un gros message en morceaux par la couche transport ?", a: ["segmentation", "la segmentation"], ph: "un mot", exp: "La segmentation découpe le message ; le réassemblage le reconstitue à l'arrivée." },
    { type: "qcm", q: "Comment nomme-t-on un morceau de données découpé par TCP ?", opts: ["Un paquet", "Une trame", "Un segment", "Un bit"], a: 2, exp: "TCP produit des segments ; UDP produit des datagrammes." },
    { type: "qcm", q: "Le multiplexage permet…", opts: ["De crypter les données", "De faire cohabiter plusieurs flux sur une même connexion", "De supprimer les erreurs", "De choisir la route la plus courte entre routeurs"], a: 1, exp: "Le multiplexage étiquette et fait circuler plusieurs flux ensemble." },
    { type: "input", q: "Comment appelle-t-on l'opération inverse, qui range chaque flux vers le bon logiciel à l'arrivée ?", a: ["demultiplexage", "le demultiplexage", "démultiplexage"], ph: "un mot", exp: "Le démultiplexage aiguille chaque flux vers son application destinataire." },
    { type: "vf", q: "La couche transport peut découper un message trop gros en plusieurs morceaux.", a: true, exp: "Oui, c'est la segmentation ; à l'arrivée on réassemble." },
    { type: "qcm", q: "Quelle « étiquette » identifie l'application dans le multiplexage ?", opts: ["L'adresse MAC", "Le numéro de port", "L'adresse IP seule", "Le numéro de séquence TCP"], a: 1, exp: "Le numéro de port distingue les flux ; c'est le sujet du prochain cours." },
    { type: "qcm", q: "Quel protocole de transport garantit fiabilité et ordre ?", opts: ["UDP", "TCP", "IP", "HTTP"], a: 1, exp: "TCP vérifie, réémet et remet dans l'ordre." },
    { type: "input", q: "Quel protocole de transport est léger et rapide, sans garantie de livraison (sigle) ?", a: ["udp"], ph: "3 lettres", exp: "UDP envoie sans garantie ni ordre : idéal quand la vitesse prime." },
    { type: "vf", q: "La couche transport transporte physiquement les bits sur le câble.", a: false, exp: "Non : ce sont les couches basses. Le transport organise le dialogue (découpe, ordre, aiguillage)." },
    { type: "qcm", q: "Un morceau de données découpé par UDP s'appelle…", opts: ["Un segment", "Un datagramme", "Une trame", "Une session"], a: 1, exp: "UDP parle de datagrammes ; TCP parle de segments." },
    { type: "qcm", q: "Pour télécharger un fichier sans erreur, quel protocole convient le mieux ?", opts: ["UDP", "TCP", "IP", "DNS"], a: 1, exp: "TCP garantit que le fichier arrive complet et dans l'ordre." },
    { type: "input", q: "En anglais, comment dit-on « de bout en bout » (deux mots reliés) ?", a: ["end-to-end", "end to end", "endtoend"], ph: "en anglais", exp: "End-to-end : le dialogue direct entre les deux extrémités." },
    { type: "qcm", q: "Pour un appel vidéo en direct, quel protocole est souvent préféré ?", opts: ["TCP, pour la fiabilité", "UDP, pour la rapidité", "IP seul", "SMTP"], a: 1, exp: "En direct, mieux vaut la vitesse d'UDP qu'attendre des données retransmises." }
  ],
  final: {
    title: "Exercice final — Le transport à l'œuvre",
    intro: `<p>Maya lance un gros téléchargement pendant qu'une visioconférence tourne. Deux flux voyagent en même temps. Voyons comment la couche 4 s'en occupe.</p>`,
    questions: [
      { type: "qcm", q: "Comment les deux flux peuvent-ils cohabiter sur la même connexion réseau ?", opts: ["Grâce au multiplexage", "Grâce au câble seul", "Grâce à l'adresse MAC", "C'est impossible"], a: 0, exp: "Le multiplexage fait circuler plusieurs flux étiquetés ensemble." },
      { type: "input", q: "Quel élément sert d'étiquette pour distinguer chaque application ?", a: ["le port", "port", "numero de port", "le numero de port"], ph: "un terme", exp: "Le numéro de port identifie l'application." },
      { type: "qcm", q: "Le gros téléchargement doit arriver complet et sans erreur. Quel protocole ?", opts: ["UDP", "TCP", "IP", "POP"], a: 1, exp: "TCP fiabilise : idéal pour un fichier." },
      { type: "qcm", q: "La visioconférence en direct privilégie plutôt…", opts: ["TCP, pour tout retransmettre", "UDP, pour rester rapide et fluide", "SMTP", "DNS"], a: 1, exp: "En direct, la vitesse compte plus que la retransmission : UDP." },
      { type: "vf", q: "Les routeurs entre Maya et les serveurs relisent l'en-tête de transport à chaque saut.", a: false, exp: "Non : le transport est end-to-end, lu seulement aux deux extrémités. Les routeurs traitent IP." }
    ],
    solution: `<pre class="pseudo"># Deux flux simultanes geres par la couche 4 :
Multiplexage : les deux flux cohabitent, chacun etiquete par un PORT
Segmentation : chaque flux est decoupe en morceaux, puis reassemble
Choix du protocole :
  telechargement -> TCP  (fiable, ordonne, rien ne manque)
  visio en direct -> UDP (leger, rapide, on privilegie la fluidite)
# Le transport est end-to-end : les routeurs ne lisent que IP.</pre>
<p>Découper, faire cohabiter, aiguiller, fiabiliser ou aller vite : voilà le métier de la couche 4. Demain : la clé de l'aiguillage, le numéro de port.</p>`
  }
};
</script>
