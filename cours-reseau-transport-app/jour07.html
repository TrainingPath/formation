  title: "UDP : le transport léger",
  subtitle: "Sans connexion, sans garantie, mais rapide : le sprinter du transport.",
  theory: `
<h3>1. Le principe : envoyer et oublier</h3>
<p><strong>UDP</strong> (« User Datagram Protocol ») est l'un des deux protocoles de transport. Sa philosophie tient en une phrase : <strong>envoyer et oublier</strong> (en anglais <em>fire and forget</em>). UDP prend les données de l'application, y colle un petit en-tête, et les expédie <em>sans</em> vérifier qu'elles arrivent. Pas d'accusé de réception, pas de retransmission, pas de remise en ordre.</p>
<p>Analogie : jeter une carte postale dans une boîte aux lettres. Tu l'envoies et tu passes à autre chose ; tu ne sais pas si elle arrive, ni quand, ni dans quel ordre par rapport aux autres. C'est simple, léger et rapide — mais sans aucune promesse.</p>
<h3>2. Sans connexion</h3>
<p>UDP est dit <strong>sans connexion</strong> (en anglais <em>connectionless</em>) : il n'y a aucune poignée de main préalable. On n'établit pas de « ligne » entre les deux machines ; chaque <strong>datagramme</strong> est envoyé indépendamment, comme une carte postale autonome. Cela évite tout délai de mise en route : le premier paquet part immédiatement.</p>
<h3>3. Un en-tête minuscule : 8 octets</h3>
<p>La force d'UDP, c'est sa légèreté. Son en-tête ne fait que <strong>8 octets</strong> et contient quatre champs seulement : port source, port destination, longueur et une somme de contrôle (<em>checksum</em>). Comparé à TCP et à ses nombreux champs, c'est minuscule. Moins d'en-tête, c'est moins de données annexes et plus de vitesse.</p>
<pre class="pseudo"># En-tete UDP : 8 octets, 4 champs
+----------------+----------------+
| Port source    | Port dest.     |
+----------------+----------------+
| Longueur       | Checksum       |
+----------------+----------------+
# 8 octets au total : minimaliste et rapide.</pre>
<h3>4. Quand choisir UDP ?</h3>
<p>UDP brille quand la <strong>vitesse</strong> et la <strong>fraîcheur</strong> des données comptent plus que l'exhaustivité. Exemples typiques : le <strong>DNS</strong> (une petite question, une petite réponse : inutile d'ouvrir une connexion lourde), le <strong>streaming</strong> et la <strong>voix/vidéo en direct</strong> (mieux vaut sauter une image perdue que geler l'écran pour la réattendre), et les <strong>jeux en ligne</strong> (la position d'il y a une seconde ne sert plus à rien).</p>
<div class="tip">Règle de choix : si perdre un morceau est moins grave qu'attendre, choisis UDP. Si chaque octet doit arriver, choisis TCP (le prochain cours). Certaines applications ajoutent elles-mêmes, par-dessus UDP, juste ce dont elles ont besoin.</div>
<div class="warn">« Sans garantie » ne veut pas dire « peu fiable en pratique ». Sur un bon réseau local, UDP perd rarement des paquets. Cela signifie simplement qu'UDP ne <em>promet</em> rien : s'il faut une garantie, c'est à l'application (ou à TCP) de la fournir.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># UDP = User Datagram Protocol (couche 4)
# Sans connexion : aucune poignee de main prealable
# Sans garantie : pas d'accuse, pas de retransmission, pas d'ordre
# En-tete minuscule : 8 octets (port src, port dest, longueur, checksum)

    { type: "input", q: "Cite un usage typique d'UDP où la fraîcheur des données prime (un mot).", a: ["streaming", "jeu", "jeux", "voix", "video", "visio", "dns", "voip"], ph: "un exemple", exp: "Streaming, jeux en ligne, voix/vidéo en direct, DNS : tous privilégient la vitesse." },
    { type: "vf", q: "UDP garantit que les datagrammes arrivent dans le même ordre qu'à l'envoi.", a: false, exp: "Non : UDP ne remet pas dans l'ordre. Chaque datagramme est indépendant." }

      { type: "qcm", q: "Son jeu interroge aussi un serveur de noms au démarrage. Ce service utilise souvent…", opts: ["UDP (DNS)", "SMTP", "Le protocole ICMP", "Le protocole FTP"], a: 0, exp: "Le DNS utilise typiquement UDP pour ses petites requêtes rapides." },
      { type: "vf", q: "UDP a ouvert une connexion avec poignée de main avant d'envoyer la première position.", a: false, exp: "Non : UDP est sans connexion, le premier datagramme part directement." }
    ],
    solution: `<pre class="pseudo"># Pourquoi UDP pour un jeu en direct :
Sans connexion  -> premier envoi immediat, pas de mise en route
Sans garantie   -> un datagramme perdu n'est PAS reattendu (tant mieux :
                   la position suivante arrive deja)
En-tete 8 octets-> tres leger, tres rapide
Bonus : le DNS de demarrage passe aussi par UDP.
# Regle : perdre < attendre  =>  UDP.</pre>
<p>UDP mise tout sur la vitesse en renonçant aux garanties. Demain, l'exact opposé : TCP, le transport fiable et ordonné.</p>`
  }
