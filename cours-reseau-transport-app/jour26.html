  title: "HTTPS et TLS : aperçu",
  subtitle: "Le petit cadenas expliqué : pourquoi et comment le web se chiffre.",
  theory: `
<h3>1. Pourquoi HTTP ne suffit pas</h3>
<p>En HTTP « nu », tout circule <strong>en clair</strong>. Chaque équipement traversé (le point Wi-Fi du café, le fournisseur d'accès, un routeur) peut lire ce que tu envoies : mots de passe, numéros de carte, messages. C'est comme envoyer une carte postale : tout le monde sur le trajet peut la lire, et même la réécrire. Pour le web moderne, c'est inacceptable.</p>
<p>La solution s'appelle <strong>HTTPS</strong> (le « S » veut dire <em>Secure</em>, sécurisé). Ce n'est pas un nouveau protocole : c'est <strong>HTTP à l'intérieur d'un tunnel chiffré</strong>. Ce tunnel est fourni par une couche nommée <strong>TLS</strong>.</p>
<h3>2. TLS : la couche de chiffrement</h3>
<p><strong>TLS</strong> (<em>Transport Layer Security</em>, « sécurité de la couche transport ») est le protocole qui chiffre la conversation. C'est le successeur de l'ancien <strong>SSL</strong> (<em>Secure Sockets Layer</em>) : le mot « SSL » reste employé par habitude, mais aujourd'hui on utilise TLS (versions 1.2 et 1.3). TLS s'intercale entre HTTP et TCP : HTTP écrit son message normalement, TLS le met sous enveloppe scellée, puis TCP le transporte.</p>
<pre class="pseudo"># Empilement des couches pour HTTPS :
  HTTP        (la requête : GET, en-têtes, corps)
   |  chiffré par
  TLS         (l'enveloppe scellée : confidentialité + intégrité)
   |  transporté par
  TCP         (livraison fiable, port 443)
   |
  IP          (routage jusqu'à la bonne machine)</pre>
<h3>3. Ce que TLS garantit</h3>
<p>TLS apporte trois protections à retenir. La <strong>confidentialité</strong> : un espion ne voit qu'un charabia illisible. L'<strong>intégrité</strong> : si un octet est modifié en route, c'est détecté et rejeté. L'<strong>authentification</strong> : grâce à un <strong>certificat</strong>, tu as la preuve de parler au vrai serveur (ta banque) et non à un imposteur.</p>
<div class="tip">Le certificat est délivré par une <strong>autorité de certification</strong> (en anglais <em>CA</em>, Certificate Authority) de confiance. Le navigateur vérifie sa signature. S'il est valide, il affiche le <strong>cadenas</strong> ; s'il est expiré ou faux, il affiche un avertissement rouge.</div>
<h3>4. La poignée de main (handshake), en survol</h3>
<p>Avant d'échanger des données, client et serveur négocient en quelques allers-retours : c'est la <strong>poignée de main TLS</strong> (<em>handshake</em>). En résumé : le client dit bonjour et propose des algorithmes ; le serveur répond et envoie son certificat ; les deux se mettent d'accord sur une <strong>clé secrète</strong> partagée ; à partir de là, tout est chiffré. Les détails cryptographiques (clés publiques/privées, algorithmes) seront vus au <strong>cours 5</strong> ; ici, retiens seulement le principe.</p>
<pre class="pseudo"># Poignée de main TLS (idée générale) :
Client  --- "bonjour, voici les algos que je sais" -->  Serveur
Client  &lt;-- "d'accord, voici mon certificat"      ---  Serveur
Client  --- établissement d'une clé secrète commune ->  Serveur
[ à partir d'ici : tout le HTTP est chiffré ]</pre>
<h3>5. Le port et le cadenas</h3>
<p>HTTPS écoute sur le <strong>port 443</strong> (HTTP « nu » utilise le 80). Dans le navigateur, une adresse en <code>https://</code> et un <strong>cadenas</strong> fermé signalent que le tunnel est en place et le certificat valide. Attention : le cadenas prouve que la liaison est chiffrée et que le certificat correspond au domaine, mais <em>pas</em> que le site est honnête. Un site d'arnaque peut aussi avoir un cadenas.</p>
<div class="warn">« Cadenas » n'égale pas « site de confiance ». Il garantit la confidentialité du tuyau et l'identité du domaine, pas les intentions de celui qui le tient. Vérifie toujours le nom de domaine affiché.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># HTTPS = HTTP + tunnel chiffré TLS ; port 443
# TLS (ex-SSL) apporte : confidentialité + intégrité + authentification
# Certificat + autorité de certification (CA) = preuve d'identité
# Handshake = négociation avant les données (détails au cours 5)
# Cadenas = liaison chiffrée + bon domaine, PAS un gage d'honnêteté</pre>`,

    { type: "vf", q: "Le certificat est délivré par une autorité de certification (CA).", a: true, exp: "Vrai : une CA de confiance signe le certificat, que le navigateur vérifie." },

    { type: "qcm", q: "Quelles versions de TLS sont recommandées aujourd'hui ?", opts: ["TLS 1.0 et 1.1", "TLS 1.2 et 1.3", "SSL 2.0 et 3.0", "TLS 0.9"], a: 1, exp: "On utilise TLS 1.2 et 1.3 ; les versions plus anciennes sont obsolètes." },
    { type: "qcm", q: "Que voit un espion qui intercepte du trafic HTTPS correctement chiffré ?", opts: ["Le mot de passe en clair", "Un charabia illisible", "La page web complète", "Les cookies en clair"], a: 1, exp: "Grâce au chiffrement, l'espion ne récupère qu'un contenu illisible." },
    { type: "vf", q: "HTTPS est un protocole entièrement différent de HTTP, sans aucun rapport.", a: false, exp: "Faux : HTTPS, c'est le même HTTP, simplement placé dans un tunnel TLS." }
  ],

      { type: "qcm", q: "Le cadenas suffit-il à garantir que n'importe quel site est honnête ?", opts: ["Oui, toujours", "Non : il garantit le chiffrement et le domaine, pas les intentions", "Oui, si le port est 443", "Non, le cadenas ne sert à rien"], a: 1, exp: "Un site malveillant peut aussi avoir un cadenas : il faut vérifier le domaine." },
      { type: "qcm", q: "Où seront étudiés en détail les mécanismes cryptographiques de TLS ?", opts: ["Ici même", "Au cours 5", "Jamais", "Au cours 1"], a: 1, exp: "Les détails (clés, algorithmes) sont réservés au cours 5 ; ici, on reste en survol." }
    ],
    solution: `<pre class="pseudo"># Situation de Karim, résumée :
Adresse en https:// + cadenas => tunnel TLS actif sur le port 443
- Confidentialité : l'espion du Wi-Fi ne voit qu'un flux chiffré
- Intégrité       : toute altération serait détectée
- Authentification: le certificat prouve l'identité du serveur banque
ATTENTION : le cadenas ne dit rien des intentions du site.
Vérifier toujours le NOM DE DOMAINE (www.mabanque.fr).</pre>
<p>HTTPS protège efficacement Karim sur un réseau public, à condition qu'il ait vérifié le nom de domaine et que le certificat soit valide. Le fonctionnement interne du chiffrement viendra au cours 5.</p>`
  }
};
