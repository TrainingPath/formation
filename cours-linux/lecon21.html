<script>
var DAY = {
  num: 21,
  title: "Récap : droits et processus",
  subtitle: "Assembler la semaine 3 en un scénario réaliste.",
  theory: `
<h3>1. La boîte à outils de la semaine 3</h3>
<pre class="pseudo"># QUI SUIS-JE / QUI EST LÀ (leçon 15)
whoami   id   groups   who
cat /etc/passwd   # comptes    cat /etc/group   # groupes
sudo adduser marc   sudo usermod -aG dev marc

# PERMISSIONS (leçon 16)
ls -l                 # lire les droits rwx (u/g/o)
chmod u+x f           # symbolique      chmod 755 f   # octal
# r=4 w=2 x=1   |   644 données · 755 script/dossier · 600 privé

# PROPRIÉTÉ & PRIVILÈGES (leçon 17)
sudo chown user:groupe f      sudo chgrp groupe f
sudo commande                 # emprunter root ponctuellement

# PROCESSUS (leçon 18)
ps aux | grep nom     top / htop     kill PID   kill -9 PID
commande &amp;   jobs   fg %1   nohup commande &amp;

# LIENS (leçon 19)      RECHERCHE (leçon 20)
ln -s cible nom         find OÙ -name/-type/-size/-mtime
ln cible nom            find ... -exec CMD {} \\;   |   ... | xargs CMD</pre>

<h3>2. Les idées maîtresses</h3>
<pre class="pseudo"># 1. Les droits reposent sur l'identité : utilisateur + groupe + permissions rwx.
# 2. On ne vit pas en root : on emprunte ses pouvoirs avec sudo, au coup par coup.
# 3. Un processus est un programme vivant (PID) : on l'observe (ps/top) et on l'arrête (kill).
# 4. find + xargs/-exec = retrouver des fichiers par critères ET agir sur eux.</pre>
<div class="tip">Ces notions collaborent : pour partager un dossier d'équipe, on combine <strong>groupe</strong> (leçon 15), <strong>chown</strong> (17) et <strong>chmod</strong> (16). Pour faire le ménage automatique, on combine <strong>find</strong> (20) et <strong>permissions</strong> (16). C'est cette combinaison qui fait un administrateur.</div>

<h3>3. Le scénario du jour</h3>
<p>Aurélia prépare un espace de travail partagé pour l'équipe <code>dev</code>, y règle les droits, puis surveille un traitement lancé en arrière-plan.</p>
<pre class="pseudo"># A. Créer l'espace et le confier à l'équipe
sudo mkdir /srv/projet                       # dossier dans la zone système
sudo chown -R aurelia:dev /srv/projet        # propriété : aurelia + groupe dev
sudo chmod -R 2775 /srv/projet               # 775 : le groupe peut écrire (le 2 = setgid, bonus)

# B. Y déposer un script et le rendre exécutable
touch /srv/projet/traite.sh
chmod 755 /srv/projet/traite.sh              # rwx r-x r-x

# C. Lancer le traitement en arrière-plan et le surveiller
/srv/projet/traite.sh &amp;                       # tâche de fond
jobs                                          # la voir dans la liste
ps aux | grep traite.sh                       # retrouver son PID
top                                           # surveiller la charge (q pour sortir)

# D. Faire le ménage des vieux fichiers temporaires
find /srv/projet -name "*.tmp" -mtime +7 -exec rm {} \\;</pre>
<div class="warn">À chaque commande destructrice (<code>rm</code>, <code>chmod -R</code>, <code>chown -R</code>, <code>kill -9</code>), relis le chemin ou le PID <strong>avant</strong> de valider. La puissance de l'administrateur va de pair avec la vérification.</div>

<h3>4. Ce que tu sais faire à la fin de la semaine 3</h3>
<p>Gérer des comptes et des groupes, lire et régler des permissions (symbolique et octal), changer la propriété, emprunter les droits root avec <code>sudo</code>, observer et arrêter des processus, créer des liens, et retrouver n'importe quel fichier par ses critères pour agir dessus. C'est le socle de l'administration au quotidien.</p>
<div class="tip">La semaine 4 va transformer ces gestes manuels en <strong>scripts Bash</strong> : au lieu de retaper les commandes, tu les écriras une fois dans un fichier réutilisable et automatisable.</div>`,
  exercises: [
    { type: "input", q: "Quelle commande résume ton identité : UID, GID et groupes ?", a: "id", ph: "une commande", exp: "id (leçon 15)." },
    { type: "qcm", q: "Ajouter marc au groupe dev sans écraser ses autres groupes :", opts: ["usermod -G dev marc", "sudo usermod -aG dev marc", "adduser marc", "groups marc"], a: 1, exp: "-aG ajoute (append) au groupe." },
    { type: "input", q: "En octal, quel réglage rend un script exécutable façon rwx r-x r-x ?", a: "755", ph: "trois chiffres", exp: "755 = script/dossier." },
    { type: "qcm", q: "<code>chmod 600 secret.txt</code> signifie…", opts: ["Lecture pour tout le monde", "rw- pour le propriétaire, rien pour les autres (privé)", "Exécutable par tous", "Tous les droits pour tous"], a: 1, exp: "600 = fichier privé." },
    { type: "qcm", q: "Changer propriétaire ET groupe de f.txt (marc, dev) :", opts: ["chgrp dev f.txt", "sudo chown marc:dev f.txt", "chmod marc f.txt", "usermod f.txt"], a: 1, exp: "chown user:group change les deux." },
    { type: "qcm", q: "Emprunter les droits root pour UNE commande :", opts: ["su - en permanence", "sudo commande", "chmod 777", "kill -9"], a: 1, exp: "sudo : root ponctuel, avec ton mot de passe." },
    { type: "qcm", q: "Retrouver un processus « python » et son PID :", opts: ["ps aux | grep python", "kill python", "top python", "find python"], a: 0, exp: "ps aux | grep, le réflexe." },
    { type: "qcm", q: "Arrêter POLIMENT le PID 900 :", opts: ["kill 900", "kill -9 900 d'abord", "rm 900", "stop 900"], a: 0, exp: "kill 900 (TERM) avant d'envisager -9." },
    { type: "qcm", q: "Lancer une commande en arrière-plan :", opts: ["commande &amp;", "commande -bg", "background commande", "commande | fond"], a: 0, exp: "Le &amp; final met la tâche en fond." },
    { type: "input", q: "Quelle commande crée un lien symbolique nommé « courant » vers « v2 » ? ln … v2 courant", a: "-s", ph: "une option", exp: "ln -s v2 courant." },
    { type: "qcm", q: "Trouver tous les .log de /var/log modifiés il y a plus de 30 jours :", opts: ["find /var/log -name \"*.log\" -mtime +30", "grep log /var/log", "ls -R /var/log", "locate log"], a: 0, exp: "find + -name + -mtime +30." },
    { type: "qcm", q: "Agir (supprimer) sur chaque résultat d'un find :", opts: ["find ... -exec rm {} \\;  ou  find ... | xargs rm", "rm find", "kill find", "chmod find"], a: 0, exp: "-exec ou xargs appliquent une commande aux résultats." },
    { type: "vf", q: "Pour partager un dossier d'équipe, on combine groupe (15), chown (17) et chmod (16).", a: true, exp: "Les trois notions collaborent pour la collaboration." },
    { type: "qcm", q: "Le bon réflexe avant tout rm/chmod -R/kill -9 :", opts: ["Aller vite", "Relire le chemin ou le PID visé avant de valider", "Passer root", "Fermer le terminal"], a: 1, exp: "Vérifier la cible : la règle d'or de l'administration." },
    { type: "vf", q: "La semaine 4 transformera ces commandes manuelles en scripts Bash réutilisables.", a: true, exp: "Un script = une suite de commandes enregistrée et automatisable." }
  ],
  final: {
    title: "Exercice final — Mettre en place et surveiller un espace d'équipe",
    intro: `<p>Reconstitue, dans le bon ordre, la mise en place d'un dossier partagé <code>/srv/labo</code> pour le groupe <code>dev</code>, puis la surveillance d'un script.</p>`,
    questions: [
      { type: "qcm", q: "1) Créer le dossier dans la zone système :", opts: ["mkdir /srv/labo", "sudo mkdir /srv/labo", "touch /srv/labo", "chown /srv/labo"], a: 1, exp: "/srv nécessite sudo." },
      { type: "qcm", q: "2) Donner propriété et groupe à l'équipe, récursivement :", opts: ["sudo chown -R aurelia:dev /srv/labo", "chmod 777", "chgrp aurelia", "usermod dev"], a: 0, exp: "chown -R aurelia:dev sur tout l'arbre." },
      { type: "qcm", q: "3) Permettre au groupe d'écrire (rwx rwx r-x) :", opts: ["sudo chmod -R 775 /srv/labo", "chmod 644", "chmod 600", "chmod +x"], a: 0, exp: "775 : le groupe dev en écriture." },
      { type: "qcm", q: "4) Lancer analyse.sh en fond et retrouver son PID :", opts: ["./analyse.sh &amp; puis ps aux | grep analyse.sh", "kill analyse.sh", "top analyse", "find analyse"], a: 0, exp: "&amp; met en fond ; ps aux | grep retrouve le PID." },
      { type: "qcm", q: "5) Nettoyer les .tmp de plus de 7 jours :", opts: ["find /srv/labo -name \"*.tmp\" -mtime +7 -exec rm {} \\;", "rm *.tmp", "kill tmp", "chmod tmp"], a: 0, exp: "find par critères + -exec rm sur chaque résultat." }
    ],
    solution: `<pre class="pseudo">sudo mkdir /srv/labo
sudo chown -R aurelia:dev /srv/labo
sudo chmod -R 775 /srv/labo
./analyse.sh &amp;   ;  ps aux | grep analyse.sh   ;  top
find /srv/labo -name "*.tmp" -mtime +7 -exec rm {} \\;

Identité → propriété → droits → processus → recherche :
la chaîne complète de l'administration quotidienne.</pre>
<p>Semaine 3 bouclée ! Demain (leçon 22) : ton tout premier script Bash.</p>`
  }
};
</script>

      ],
      "solution": "sudo mkdir /srv/atelier                                   # 1. créer l'espace\nsudo chown -R aurelia:dev /srv/atelier                    # 2. propriété à l'équipe\nsudo chmod -R 775 /srv/atelier                            # 3. le groupe peut écrire\nsudo touch /srv/atelier/build.sh                          # 4a. script (dans /srv → sudo)\nsudo chmod 755 /srv/atelier/build.sh                      # 4b. rendre exécutable\nfind /srv/atelier -name \"*.bak\" -mtime +14 -exec rm {} \\;  # 5. ménage des vieux .bak",
