var DAY = {

  title: "Liens durs et symboliques",
  subtitle: "Plusieurs noms pour un même fichier, et des raccourcis.",
  theory: `
<h3>1. L'inode : le vrai fichier derrière le nom</h3>
<p>Sous Linux, un nom de fichier n'est qu'une <strong>étiquette</strong> qui pointe vers une structure interne, l'<strong>inode</strong>, laquelle contient les vraies données et leurs métadonnées. Un même inode peut avoir <strong>plusieurs</strong> noms : ce sont les <strong>liens</strong>.</p>
<pre class="pseudo">ls -li fichier.txt    # -i affiche le numéro d'INODE en tête de ligne
# 2 noms qui montrent le MÊME numéro d'inode = deux liens vers le même contenu</pre>

<h3>2. Le lien symbolique (le plus utile) : ln -s</h3>
<p>Un <strong>lien symbolique</strong> (symlink) est un petit fichier spécial qui contient… le <strong>chemin</strong> vers un autre fichier. C'est l'équivalent du « raccourci » de Windows.</p>
<pre class="pseudo">ln -s /chemin/vers/cible.txt raccourci   # crée « raccourci » qui pointe vers cible.txt
ls -l raccourci
# lrwxrwxrwx ... raccourci -&gt; /chemin/vers/cible.txt
#  │                       └─ la flèche montre la cible du lien
#  └─ le « l » initial indique un lien symbolique</pre>
<pre class="pseudo">cat raccourci      # lit en réalité cible.txt (le lien est transparent)
rm raccourci       # supprime SEULEMENT le lien, pas la cible</pre>
<div class="warn">Si on supprime ou déplace la <strong>cible</strong>, le lien symbolique devient « cassé » (dangling) : il pointe vers un chemin qui n'existe plus. Le lien reste, mais ne mène nulle part.</div>

<h3>3. Le lien dur : ln (sans -s)</h3>
<p>Un <strong>lien dur</strong> (hard link) est un deuxième <strong>nom</strong> pour le même inode. Les deux noms sont alors totalement équivalents : aucun n'est « l'original ».</p>
<pre class="pseudo">ln cible.txt autre_nom.txt   # autre_nom.txt partage l'inode de cible.txt
# Modifier l'un modifie l'autre (mêmes données).
# Supprimer cible.txt ne détruit PAS les données : autre_nom.txt y donne encore accès.
# Les données ne disparaissent que lorsque le DERNIER nom est supprimé.</pre>

<h3>4. Symbolique ou dur : les différences clés</h3>
<pre class="pseudo">#                      LIEN SYMBOLIQUE (ln -s)   LIEN DUR (ln)
# Contient…            un CHEMIN vers la cible    le même inode (mêmes données)
# Cible supprimée…     lien cassé                 données toujours accessibles
# Autres disques…      OUI (peut traverser)       NON (même système de fichiers)
# Vers un dossier…     OUI                        NON (interdit en général)
# Usage courant…       raccourcis, versions       rare (sauvegardes, dédup)</pre>
<div class="tip">En pratique, tu utiliseras presque toujours le lien <strong>symbolique</strong> (<code>ln -s</code>) : plus souple, il traverse les disques et pointe vers des dossiers. Le lien dur est un cas plus spécialisé.</div>

<h3>5. À quoi ça sert concrètement ?</h3>
<pre class="pseudo"># Donner un nom court/stable à une version datée :
ln -s app-2.4.1 app-courante        # « app-courante » suit la version active
# Le jour de la mise à jour, on refait juste pointer le lien :
ln -sfn app-2.5.0 app-courante      # -f force, -n évite d'entrer dans le dossier cible

# Rendre un fichier accessible depuis un autre endroit sans le dupliquer :
ln -s /var/www/site/config.php ~/config.php</pre>

<h3>6. À retenir</h3>
<pre class="pseudo">ln -s cible nom    # lien SYMBOLIQUE : un raccourci (un chemin vers la cible)
ln cible nom       # lien DUR : un deuxième nom pour les mêmes données
ls -l              # les liens symboliques s'affichent avec « -&gt; cible »
ls -li             # le numéro d'inode révèle les liens durs (même numéro)
# Supprimer un lien symbolique ≠ supprimer la cible.</pre>`,

    { type: "qcm", q: "Avec un lien dur, si on supprime le nom d'origine…", opts: ["Les données sont perdues", "Les données restent accessibles par l'AUTRE nom", "Le lien casse", "Erreur"], a: 1, exp: "Les données ne disparaissent qu'au dernier nom supprimé." },
    { type: "qcm", q: "Quelle option de ls révèle le numéro d'inode (utile pour repérer les liens durs) ?", opts: ["-l", "-i", "-a", "-s"], a: 1, exp: "ls -li affiche l'inode : même numéro = même contenu." },
    { type: "qcm", q: "Lequel peut pointer vers un fichier sur un AUTRE disque ?", opts: ["Le lien dur", "Le lien symbolique", "Aucun", "Les deux"], a: 1, exp: "Le symlink traverse les systèmes de fichiers ; pas le lien dur." },
    { type: "qcm", q: "Lequel peut pointer vers un DOSSIER ?", opts: ["Le lien dur", "Le lien symbolique", "Aucun", "Les deux sans restriction"], a: 1, exp: "Les liens durs vers dossiers sont interdits ; le symlink, lui, le permet." },
    { type: "vf", q: "En pratique, on utilise bien plus souvent le lien symbolique que le lien dur.", a: true, exp: "Plus souple : disques différents, dossiers, raccourcis de version." },
    { type: "qcm", q: "Un usage classique du lien symbolique :", opts: ["Compter des lignes", "Donner un nom stable (app-courante) à une version datée", "Tuer un processus", "Trier un CSV"], a: 1, exp: "On refait pointer le lien à chaque mise à jour." },
    { type: "input", q: "Complète : pour créer un raccourci nommé « courant » vers dossier « v2 » : ln … v2 courant", a: "-s", ph: "une option", exp: "ln -s v2 courant." }
  ],
  final: {
    title: "Exercice final — Un nom stable pour la version courante",
    intro: `<p>Aurélia déploie une application par versions datées : <code>app-1.0</code>, puis <code>app-1.1</code>. Elle veut que les scripts pointent toujours vers <code>app-courante</code>, sans les modifier à chaque mise à jour.</p>`,
    questions: [
      { type: "qcm", q: "Créer le raccourci app-courante vers app-1.0 :", opts: ["ln app-1.0 app-courante", "ln -s app-1.0 app-courante", "cp app-1.0 app-courante", "mv app-1.0 app-courante"], a: 1, exp: "ln -s crée le lien symbolique vers le dossier de version." },
      { type: "qcm", q: "Quel type de lien FAUT-il ici, puisque app-1.0 est un DOSSIER ?", opts: ["Un lien dur", "Un lien symbolique (seul autorisé vers un dossier)", "Une copie", "Aucun"], a: 1, exp: "Les liens durs vers dossiers sont interdits : symbolique obligatoire." },
      { type: "qcm", q: "La version 1.1 sort. Faire pointer app-courante vers app-1.1 :", opts: ["ln -sfn app-1.1 app-courante", "rm app-courante puis mv", "cp app-1.1", "chmod"], a: 0, exp: "ln -sfn recrée le lien (-f force, -n ne descend pas dans la cible)." },
      { type: "qcm", q: "Avantage de cette approche ?", opts: ["Ça duplique les données", "Les scripts qui utilisent app-courante n'ont JAMAIS à être modifiés", "Ça supprime les anciennes versions", "Ça accélère le disque"], a: 1, exp: "Un seul lien à mettre à jour ; les scripts restent inchangés." },
      { type: "vf", q: "Si on supprime app-courante, les dossiers app-1.0 et app-1.1 sont détruits.", a: false, exp: "Non : supprimer un lien symbolique ne touche pas ses cibles." }
    ],
    solution: `<pre class="pseudo">ln -s app-1.0 app-courante     → raccourci vers la version active
# (symbolique obligatoire : la cible est un DOSSIER)
ln -sfn app-1.1 app-courante   → bascule vers la 1.1 (mise à jour)
rm app-courante                → retire le lien, PAS les versions

Symbolique = raccourci souple (disques, dossiers, versions).
Dur = second nom du même inode, plus rare.</pre>
<p>Tu maîtrises les liens. Demain : rechercher des fichiers avec find et agir dessus avec xargs.</p>`
  }
};
