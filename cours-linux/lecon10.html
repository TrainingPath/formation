var DAY = {

  title: "grep : chercher dans le texte",
  subtitle: "Trouver l'aiguille dans la botte de foin.",
  theory: `
<h3>1. Le principe : filtrer les lignes</h3>
<p><code>grep</code> lit du texte et n'affiche que les <strong>lignes qui contiennent</strong> un motif. C'est l'outil de recherche le plus utilisé du terminal.</p>
<pre class="pseudo">grep "erreur" journal.txt     # affiche les lignes de journal.txt contenant « erreur »
cat journal.txt | grep "erreur"  # même résultat via un tube (utile après une autre commande)</pre>

<h3>2. Les options qui font tout</h3>
<pre class="pseudo">grep -i "erreur" f.txt    # -i : IGNORE la casse (trouve erreur, Erreur, ERREUR)
grep -n "erreur" f.txt    # -n : préfixe chaque résultat par son NUMÉRO de ligne
grep -c "erreur" f.txt    # -c : COMPTE les lignes trouvées (au lieu de les afficher)
grep -v "erreur" f.txt    # -v : INVERSE — affiche les lignes qui NE contiennent PAS le motif
grep -w "chat" f.txt      # -w : le mot ENTIER (« chat » mais pas « chataigne »)
grep -o "erreur" f.txt    # -o : n'affiche QUE la partie qui correspond, pas toute la ligne</pre>

<h3>3. Chercher dans toute une arborescence</h3>
<pre class="pseudo">grep -r "TODO" projet/    # -r : RÉCURSIF, cherche dans tous les fichiers du dossier
grep -r -n "TODO" projet/ # avec le numéro de ligne : indique fichier:ligne:contenu
grep -l "TODO" projet/*   # -l : liste seulement les NOMS de fichiers qui contiennent le motif</pre>
<div class="tip">La combinaison <code>grep -rn "motif" dossier/</code> est le réflexe du développeur pour retrouver où un mot (une fonction, un message) apparaît dans un projet entier.</div>

<h3>4. Un aperçu des expressions régulières</h3>
<p>Le « motif » de grep n'est pas qu'un mot fixe : c'est une <strong>expression régulière</strong> (regex), une mini-grammaire pour décrire des formes de texte.</p>
<pre class="pseudo">grep "^erreur" f.txt      # ^ = DÉBUT de ligne : lignes qui COMMENCENT par « erreur »
grep "fin$" f.txt         # $ = FIN de ligne : lignes qui se TERMINENT par « fin »
grep "b.t" f.txt          # . = n'importe quel caractère : bat, bit, b8t…
grep "ab*" f.txt          # * = le caractère précédent RÉPÉTÉ 0 fois ou plus
grep -E "chat|chien" f.txt # -E (étendu) + | = « chat » OU « chien »
grep -E "[0-9]+" f.txt    # [0-9] = un chiffre ; + = une fois ou plus → au moins un nombre</pre>
<div class="warn">Ne confonds pas le <code>*</code> des regex avec celui du shell (leçon 11). Dans grep, <code>ab*</code> veut dire « a suivi de zéro ou plusieurs b ». Dans le shell, <code>*.txt</code> veut dire « tous les fichiers finissant par .txt ». Même symbole, deux mondes différents.</div>

<h3>5. grep dans une chaîne de tubes</h3>
<pre class="pseudo">ps aux | grep firefox         # filtrer une liste de processus
ls -l | grep "^d"             # ne garder que les DOSSIERS (leur ligne commence par d)
history | grep git            # retrouver toutes tes commandes git passées
dmesg | grep -i usb           # messages du noyau parlant d'USB, casse ignorée</pre>

<h3>6. À retenir</h3>
<pre class="pseudo">grep motif fichier    # lignes contenant le motif
-i  casse ignorée   -n  numéro de ligne   -c  compter
-v  inverser        -w  mot entier        -r  récursif
^ début   $ fin   . un caractère   * répétition   -E pour | et +</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>grep \"erreur\" journal.txt</code> ?", opts: ["Compte les mots", "Affiche les lignes qui contiennent « erreur »", "Supprime « erreur »", "Trie le fichier"], a: 1, exp: "grep filtre les lignes contenant le motif." },
    { type: "input", q: "Quelle option rend la recherche insensible à la casse (erreur, Erreur, ERREUR) ?", a: ["-i", "i"], ph: "une option", exp: "-i ignore majuscules/minuscules." },
    { type: "qcm", q: "<code>grep -n \"chat\" f.txt</code> ajoute…", opts: ["Le nombre total", "Le NUMÉRO de ligne devant chaque résultat", "La casse", "Rien"], a: 1, exp: "-n préfixe par le numéro de ligne." },
    { type: "qcm", q: "<code>grep -v \"erreur\" f.txt</code> affiche…", opts: ["Les lignes AVEC « erreur »", "Les lignes SANS « erreur » (inversion)", "Le nombre de lignes", "La première ligne seulement"], a: 1, exp: "-v inverse : tout sauf le motif." },
    { type: "input", q: "Quelle option COMPTE le nombre de lignes correspondant au motif ?", a: ["-c", "c"], ph: "une option", exp: "-c donne le nombre au lieu du contenu." },
    { type: "qcm", q: "Pour chercher « TODO » dans TOUS les fichiers d'un dossier et ses sous-dossiers :", opts: ["grep TODO", "grep -r TODO dossier/", "grep -v TODO", "grep -c TODO"], a: 1, exp: "-r = récursif dans toute l'arborescence." },
    { type: "qcm", q: "Dans une regex grep, <code>^</code> signifie…", opts: ["Fin de ligne", "Début de ligne", "N'importe quel caractère", "Négation"], a: 1, exp: "^ ancre le motif au début de la ligne." },
    { type: "qcm", q: "Dans une regex grep, <code>$</code> signifie…", opts: ["Une variable", "Fin de ligne", "Début de ligne", "Un chiffre"], a: 1, exp: "$ ancre le motif à la fin de la ligne." },
    { type: "qcm", q: "Le caractère <code>.</code> dans une regex correspond à…", opts: ["Un point littéral seulement", "N'importe quel caractère unique", "La fin de phrase", "Un espace"], a: 1, exp: ". = un caractère quelconque (b.t → bat, bit…)." },
    { type: "qcm", q: "Pour chercher « chat » OU « chien » en une commande :", opts: ["grep chat chien", "grep -E \"chat|chien\"", "grep -v chat", "grep -c"], a: 1, exp: "-E active les regex étendues, dont l'alternative |." },
    { type: "qcm", q: "<code>grep -w \"chat\"</code> trouve…", opts: ["chataigne et chatons aussi", "le mot ENTIER « chat » uniquement", "les lignes en majuscules", "les lignes numérotées"], a: 1, exp: "-w exige un mot complet, pas un fragment." },
    { type: "qcm", q: "<code>ls -l | grep \"^d\"</code> garde…", opts: ["Les fichiers cachés", "Les lignes commençant par d, c'est-à-dire les DOSSIERS", "Les liens", "Les fichiers .d"], a: 1, exp: "En ls -l, une ligne de dossier commence par d ; ^d les isole." },
    { type: "vf", q: "Le <code>*</code> de grep et le <code>*</code> du shell veulent dire la même chose.", a: false, exp: "Non : dans grep, * = répétition du caractère précédent ; dans le shell, * = n'importe quelle suite de caractères de nom de fichier." },
    { type: "input", q: "Pour retrouver dans ton historique toutes les commandes contenant « git » : history | grep …", a: "git", ph: "un mot", exp: "history | grep git filtre l'historique." },
    { type: "qcm", q: "<code>grep -rn \"connexion\" projet/</code> est utile pour…", opts: ["Supprimer le mot", "Localiser où « connexion » apparaît (fichier:ligne) dans tout le projet", "Compter les fichiers", "Trier"], a: 1, exp: "-r (récursif) + -n (numéro) = le réflexe pour retrouver du code." }
  ],
  final: {
    title: "Exercice final — Fouiller un journal de serveur",
    intro: `<p>Un fichier <code>acces.log</code> contient une requête HTTP par ligne, avec le code de statut (200, 404, 500…). Aurélia enquête.</p>`,
    questions: [
      { type: "qcm", q: "Afficher toutes les lignes contenant « 404 » :", opts: ["grep -v 404 acces.log", "grep \"404\" acces.log", "grep -c 404", "grep -w"], a: 1, exp: "grep \"404\" acces.log filtre les lignes avec 404." },
      { type: "input", q: "Compter combien de requêtes ont échoué en 404 : grep … 404 acces.log", a: ["-c", "c"], ph: "une option", exp: "grep -c \"404\" acces.log donne le nombre." },
      { type: "qcm", q: "Afficher les erreurs 404 avec leur numéro de ligne :", opts: ["grep -n \"404\" acces.log", "grep -v \"404\"", "grep -c", "grep -r"], a: 0, exp: "-n ajoute le numéro de ligne." },
      { type: "qcm", q: "Ne garder que les lignes qui NE sont PAS des 200 (les non-succès) :", opts: ["grep \"200\"", "grep -v \"200\" acces.log", "grep -c \"200\"", "grep -w 200"], a: 1, exp: "-v inverse : tout sauf les 200." },
      { type: "qcm", q: "Chercher « 500 » sans se soucier d'éventuelles variantes de casse dans le texte alentour :", opts: ["grep -i \"500\" acces.log", "grep -v \"500\"", "grep -c", "grep -l"], a: 0, exp: "-i ignore la casse (utile si le motif était alphabétique)." }
    ],
    solution: `<pre class="pseudo">grep "404" acces.log        → les requêtes en 404
grep -c "404" acces.log     → combien il y en a
grep -n "404" acces.log     → avec le numéro de ligne
grep -v "200" acces.log     → tout sauf les succès
grep -rn "motif" dossier/   → réflexe pour retrouver dans un projet

grep + options + tubes = ton moteur de recherche du terminal.</pre>
<p>Tu sais chercher dans le texte. Demain : les jokers du shell pour viser plusieurs fichiers d'un coup.</p>`
  }
};
</script>
