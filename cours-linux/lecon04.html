var DAY = {
  num: 4,
  title: "Créer, copier, déplacer, supprimer",
  subtitle: "Agir sur les fichiers et les dossiers.",
  theory: `
<h3>1. Créer des dossiers : mkdir</h3>
<pre class="pseudo">mkdir projet          # crée un dossier « projet » dans le dossier courant
mkdir a b c           # crée trois dossiers d'un coup (a, b et c)
mkdir -p a/b/c        # -p crée toute la CHAÎNE : a, puis a/b, puis a/b/c</pre>
<p>Sans <code>-p</code>, <code>mkdir a/b/c</code> échoue si <code>a</code> ou <code>a/b</code> n'existent pas encore. L'option <code>-p</code> (parents) crée tous les niveaux manquants.</p>

<h3>2. Créer un fichier vide : touch</h3>
<pre class="pseudo">touch notes.txt       # crée un fichier vide notes.txt (s'il existe déjà : met à jour sa date)
touch a.txt b.txt     # crée plusieurs fichiers d'un coup</pre>
<p><code>touch</code> sert surtout à créer rapidement un fichier vide sur lequel travailler ensuite.</p>

<h3>3. Copier : cp</h3>
<pre class="pseudo">cp source destination           # forme générale : cp CE-QU-ON-COPIE VERS-OÙ
cp notes.txt sauvegarde.txt     # duplique notes.txt sous le nom sauvegarde.txt
cp notes.txt Documents/         # copie notes.txt DANS le dossier Documents
cp -r projet projet_backup      # -r (récursif) : OBLIGATOIRE pour copier un DOSSIER et son contenu
cp -i notes.txt sauvegarde.txt  # -i (interactif) : demande confirmation avant d'écraser</pre>
<div class="warn">Copier un dossier SANS <code>-r</code> échoue (« omitting directory »). Un dossier contient d'autres éléments : il faut la copie récursive pour tout embarquer.</div>

<h3>4. Déplacer ET renommer : mv</h3>
<p>Sous Linux, déplacer et renommer sont la <strong>même</strong> opération : <code>mv</code> (move) change simplement le chemin/nom d'un élément.</p>
<pre class="pseudo">mv notes.txt Documents/         # DÉPLACE notes.txt dans le dossier Documents
mv notes.txt compte-rendu.txt   # RENOMME notes.txt en compte-rendu.txt (même dossier)
mv a.txt Documents/b.txt        # déplace ET renomme en une fois
mv -i a.txt b.txt               # -i : confirme avant d'écraser une cible existante</pre>
<div class="tip">Contrairement à <code>cp</code>, <code>mv</code> n'a pas besoin de <code>-r</code> pour un dossier : déplacer un dossier ne fait que changer son chemin, sans recopier son contenu.</div>

<h3>5. Supprimer : rm et rmdir</h3>
<pre class="pseudo">rm notes.txt          # supprime le fichier notes.txt
rm a.txt b.txt        # supprime plusieurs fichiers
rmdir projet          # supprime un dossier, mais SEULEMENT s'il est VIDE
rm -r projet          # supprime un dossier ET tout ce qu'il contient (récursif)
rm -i notes.txt       # demande confirmation avant chaque suppression</pre>
<div class="warn">⚠️ Danger absolu : sous Linux, <code>rm</code> ne met <strong>rien à la corbeille</strong>. Ce qui est supprimé est perdu, immédiatement et définitivement. Redouble de prudence avec <code>rm -r</code>, et ne tape <strong>JAMAIS</strong> <code>rm -rf /</code> ni <code>rm -rf ~</code> : tu effacerais tout le système ou tout ton dossier personnel.</div>

<h3>6. Le réflexe de sécurité</h3>
<pre class="pseudo">ls                    # 1. VÉRIFIE ce qui existe avant d'agir
rm -i vieux.txt       # 2. supprime avec confirmation quand tu hésites
ls                    # 3. VÉRIFIE le résultat après coup</pre>
<p>Prends l'habitude d'un <code>ls</code> avant et après toute opération destructrice. Et souviens-toi de la touche <strong>Tab</strong> : compléter un nom plutôt que le taper évite d'effacer le mauvais fichier.</p>`,
  exercises: [
    { type: "input", q: "Quelle commande crée un dossier nommé projet ?", a: "mkdir projet", ph: "une commande", exp: "mkdir = make directory." },
    { type: "qcm", q: "À quoi sert l'option <code>-p</code> de mkdir dans <code>mkdir -p a/b/c</code> ?", opts: ["À protéger le dossier", "À créer toute la chaîne de dossiers parents manquants", "À afficher le résultat", "À supprimer"], a: 1, exp: "-p crée a, a/b puis a/b/c même s'ils n'existaient pas." },
    { type: "input", q: "Quelle commande crée un fichier vide appelé notes.txt ?", a: "touch notes.txt", ph: "une commande", exp: "touch crée le fichier (ou met à jour sa date)." },
    { type: "qcm", q: "Dans <code>cp source destination</code>, l'ordre est…", opts: ["destination puis source", "source (ce qu'on copie) puis destination (vers où)", "peu importe", "source deux fois"], a: 1, exp: "Toujours : cp CE-QU-ON-COPIE VERS-OÙ." },
    { type: "qcm", q: "Pour copier un DOSSIER et tout son contenu, il faut…", opts: ["cp seul", "cp -r (récursif)", "mv", "touch"], a: 1, exp: "Sans -r, cp refuse de copier un dossier." },
    { type: "qcm", q: "Sous Linux, renommer un fichier se fait avec…", opts: ["rename uniquement", "mv (ancien-nom nouveau-nom)", "cp", "touch"], a: 1, exp: "mv sert à la fois à déplacer et à renommer." },
    { type: "qcm", q: "<code>mv notes.txt Documents/</code> fait…", opts: ["Renomme notes.txt en Documents", "Déplace notes.txt dans le dossier Documents", "Copie notes.txt", "Supprime notes.txt"], a: 1, exp: "La cible est un dossier : c'est un déplacement." },
    { type: "input", q: "Quelle commande supprime le fichier vieux.txt ?", a: "rm vieux.txt", ph: "une commande", exp: "rm supprime — définitivement, sans corbeille." },
    { type: "qcm", q: "<code>rmdir projet</code> réussit seulement si…", opts: ["projet contient des fichiers", "projet est VIDE", "on est root", "projet est caché"], a: 1, exp: "rmdir ne supprime que les dossiers vides. Sinon : rm -r." },
    { type: "qcm", q: "Pour supprimer un dossier ET tout son contenu :", opts: ["rmdir", "rm -r dossier", "mv dossier", "cp -r"], a: 1, exp: "rm -r descend et supprime tout. À manier avec prudence." },
    { type: "vf", q: "Un fichier supprimé avec <code>rm</code> va dans la corbeille et peut être restauré facilement.", a: false, exp: "Non : rm supprime définitivement. Il n'y a pas de corbeille en ligne de commande." },
    { type: "qcm", q: "Que fait l'option <code>-i</code> sur rm, cp ou mv ?", opts: ["Ignore les erreurs", "Rend l'opération interactive : demande confirmation avant d'écraser/supprimer", "Rend l'opération plus rapide", "Force sans question"], a: 1, exp: "-i = interactif : un garde-fou précieux." },
    { type: "qcm", q: "Pourquoi ne JAMAIS taper <code>rm -rf /</code> ?", opts: ["C'est trop lent", "Cela tenterait d'effacer tout le système, sans retour possible", "Ça ne fait rien", "Ça redémarre la machine"], a: 1, exp: "rm -rf / est la commande la plus destructrice qui soit. À bannir." },
    { type: "input", q: "Quelle commande copie notes.txt sous le nom sauvegarde.txt (même dossier) ?", a: "cp notes.txt sauvegarde.txt", ph: "une commande", exp: "cp source destination." },
    { type: "vf", q: "Faire un <code>ls</code> avant et après une suppression est une bonne habitude de sécurité.", a: true, exp: "Vérifier avant/après évite d'effacer le mauvais fichier." }
  ],
  final: {
    title: "Exercice final — Un mini rangement",
    intro: `<p>Aurélia part d'un dossier personnel vide et exécute, dans l'ordre :</p>
<pre class="pseudo">mkdir -p cours/linux
touch cours/linux/notes.txt
cp cours/linux/notes.txt cours/linux/notes_sauvegarde.txt
mv cours/linux/notes.txt cours/linux/journal.txt
rm cours/linux/notes_sauvegarde.txt</pre>`,
    questions: [
      { type: "qcm", q: "Après la 1re ligne, quels dossiers existent ?", opts: ["Seulement cours", "cours ET cours/linux (grâce à -p)", "Rien", "linux à la racine"], a: 1, exp: "mkdir -p crée toute la chaîne : cours puis cours/linux." },
      { type: "input", q: "Après la 2e ligne, quel fichier vient d'être créé ? (chemin relatif)", a: "cours/linux/notes.txt", ph: "un chemin", exp: "touch a créé le fichier vide notes.txt dans cours/linux." },
      { type: "qcm", q: "Après <code>cp … notes_sauvegarde.txt</code>, combien de fichiers dans cours/linux ?", opts: ["1", "2 (notes.txt et notes_sauvegarde.txt)", "3", "0"], a: 1, exp: "La copie ajoute un second fichier ; l'original reste." },
      { type: "qcm", q: "Après <code>mv notes.txt journal.txt</code>, notes.txt…", opts: ["existe encore", "n'existe plus : il a été RENOMMÉ en journal.txt", "a été copié", "est vide"], a: 1, exp: "mv renomme : notes.txt devient journal.txt (pas de doublon)." },
      { type: "input", q: "À la fin, quels fichiers restent dans cours/linux ? (nomme le seul restant)", a: "journal.txt", ph: "un nom de fichier", exp: "notes_sauvegarde.txt a été supprimé ; journal.txt (ex-notes.txt) reste." }
    ],
    solution: `<pre class="pseudo">mkdir -p cours/linux         → dossiers cours et cours/linux
touch …/notes.txt            → notes.txt (vide)
cp …/notes.txt …/notes_sauvegarde.txt → 2 fichiers
mv …/notes.txt …/journal.txt → notes.txt RENOMMÉ (reste : journal.txt + sauvegarde)
rm …/notes_sauvegarde.txt    → il ne reste que journal.txt

Réflexe : ls avant/après, Tab pour compléter, -i quand on hésite.</pre>
<p>Tu sais fabriquer et ranger. Demain : lire le contenu des fichiers.</p>`
  }
};
