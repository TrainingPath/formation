  title: "Redirections : &gt;, &gt;&gt;, stderr",
  subtitle: "Envoyer la sortie d'une commande où on veut.",
  theory: `
<h3>1. Les trois canaux d'une commande</h3>
<p>Chaque commande dispose de trois « tuyaux » standard, identifiés par un numéro :</p>
<pre class="pseudo"># 0 = stdin  (entrée standard)  : d'où la commande LIT (le clavier par défaut)
# 1 = stdout (sortie standard)  : où elle écrit ses RÉSULTATS (l'écran par défaut)
# 2 = stderr (sortie d'erreur)  : où elle écrit ses MESSAGES D'ERREUR (l'écran aussi)</pre>
<p>Par défaut, stdout et stderr s'affichent tous les deux à l'écran, ce qui les mélange. La <strong>redirection</strong> permet de les envoyer ailleurs — typiquement dans un fichier — et surtout de les <strong>séparer</strong>.</p>

<h3>2. Rediriger la sortie vers un fichier : &gt; et &gt;&gt;</h3>
<pre class="pseudo">echo "Bonjour" &gt; salut.txt      # &gt;  ÉCRIT dans salut.txt : ÉCRASE le contenu existant
echo "Encore" &gt;&gt; salut.txt      # &gt;&gt; AJOUTE à la fin, sans rien effacer
date &gt; horodatage.txt           # capture la sortie de date dans un fichier
ls -l &gt; contenu.txt             # range la liste détaillée dans un fichier</pre>
<div class="warn">Piège classique : <code>&gt;</code> écrase <strong>sans prévenir</strong>. Si <code>salut.txt</code> contenait déjà quelque chose, c'est perdu. Quand tu veux compléter un fichier (un journal, par exemple), utilise <code>&gt;&gt;</code>.</div>
<div class="tip">Mémo : un seul chevron <code>&gt;</code> = « remplace » (comme une affectation) ; double chevron <code>&gt;&gt;</code> = « ajoute à la suite ». C'est le même couple écraser/ajouter que <code>WriteAllText</code> vs <code>AppendAllText</code> vu en C#.</div>

<h3>3. Rediriger les ERREURS : 2&gt;</h3>
<p>Le numéro du canal se place devant le chevron. Comme stderr est le canal 2 :</p>
<pre class="pseudo">ls /dossier-inexistant 2&gt; erreurs.txt   # envoie le message d'erreur dans erreurs.txt
ls /etc 1&gt; sortie.txt                    # 1&gt; = rediriger stdout (le 1 est optionnel : &gt; suffit)
commande 2&gt;&gt; journal-erreurs.txt         # AJOUTE les erreurs à un fichier</pre>

<h3>4. Séparer, tout garder, ou tout jeter</h3>
<pre class="pseudo"># Séparer résultats et erreurs dans DEUX fichiers :
find / -name "*.conf" &gt; trouves.txt 2&gt; refus.txt

# Tout (résultats + erreurs) dans le MÊME fichier :
commande &gt; tout.txt 2&gt;&amp;1    # 2&gt;&amp;1 = « envoie le canal 2 là où va le canal 1 »
commande &amp;&gt; tout.txt         # écriture courte équivalente (Bash)

# Jeter une sortie dont on ne veut pas : /dev/null (le « trou noir »)
commande 2&gt; /dev/null       # ignore les erreurs
commande &gt; /dev/null 2&gt;&amp;1    # ignore TOUT (silence complet)</pre>
<div class="tip"><code>/dev/null</code> est un fichier spécial qui avale tout ce qu'on lui envoie et ne renvoie jamais rien. On y jette les sorties dont on se moque, par exemple pour ne garder que les erreurs, ou au contraire pour faire taire une commande bavarde.</div>

<h3>5. Lire DEPUIS un fichier : &lt;</h3>
<pre class="pseudo">wc -l &lt; salut.txt      # &lt; fournit salut.txt comme ENTRÉE (stdin) à wc
sort &lt; noms.txt        # trie les lignes lues depuis noms.txt</pre>
<p>La redirection d'entrée <code>&lt;</code> est moins fréquente (on écrit souvent <code>wc -l salut.txt</code> directement), mais elle devient utile avec les commandes qui ne lisent que sur stdin.</p>

<h3>6. Le tableau à retenir</h3>
<pre class="pseudo">&gt;   fichier   # stdout → fichier (ÉCRASE)
&gt;&gt;  fichier   # stdout → fichier (AJOUTE)
2&gt;  fichier   # stderr → fichier
2&gt;&gt; fichier   # stderr → fichier (AJOUTE)
&gt;   f 2&gt;&amp;1    # stdout ET stderr → même fichier
&lt;   fichier   # fichier → stdin</pre>`,
  exercises: [
    { type: "qcm", q: "Quel canal porte les résultats normaux d'une commande ?", opts: ["stdin (0)", "stdout (1)", "stderr (2)", "/dev/null"], a: 1, exp: "stdout = canal 1 = les résultats." },
    { type: "qcm", q: "Quel canal porte les messages d'ERREUR ?", opts: ["stdin (0)", "stdout (1)", "stderr (2)", "Aucun"], a: 2, exp: "stderr = canal 2, séparé des résultats." },
    { type: "qcm", q: "<code>echo salut &gt; f.txt</code> sur un f.txt qui contient déjà du texte…", opts: ["Ajoute à la fin", "ÉCRASE tout l'ancien contenu", "Refuse", "Crée une copie"], a: 1, exp: "Un seul chevron écrase, sans prévenir." },

    { type: "qcm", q: "<code>commande &gt; /dev/null 2&gt;&amp;1</code> a pour effet…", opts: ["D'afficher tout", "De faire taire COMPLÈTEMENT la commande (résultats + erreurs jetés)", "De sauvegarder", "De trier"], a: 1, exp: "Silence total : stdout et stderr partent au trou noir." },
    { type: "qcm", q: "Quel opérateur fournit un FICHIER comme entrée (stdin) d'une commande ?", opts: ["&gt;", "&gt;&gt;", "&lt;", "2&gt;"], a: 2, exp: "&lt; redirige l'entrée depuis un fichier." },
    { type: "input", q: "Le chevron simple qui redirige stdout en ÉCRASANT s'écrit avec quel caractère ?", a: ">", ph: "un caractère", exp: "&gt; = stdout vers fichier, en écrasant." },
    { type: "qcm", q: "Séparer résultats et erreurs dans deux fichiers distincts :", opts: ["cmd &gt; out.txt 2&gt; err.txt", "cmd &gt;&gt; out.txt", "cmd 2&gt;&amp;1", "cmd &lt; in.txt"], a: 0, exp: "&gt; pour stdout, 2&gt; pour stderr : chacun son fichier." },
    { type: "vf", q: "Par défaut, stdout et stderr s'affichent tous les deux à l'écran.", a: true, exp: "C'est pourquoi ils semblent mélangés tant qu'on ne les redirige pas." },
    { type: "qcm", q: "Pour AJOUTER une ligne de plus à un journal existant journal.txt :", opts: ["echo msg &gt; journal.txt", "echo msg &gt;&gt; journal.txt", "echo msg 2&gt; journal.txt", "echo msg &lt; journal.txt"], a: 1, exp: ">> préserve l'existant et ajoute à la fin." },
    { type: "qcm", q: "Dans <code>ls /rien 2&gt; e.txt</code>, que contiendra e.txt ?", opts: ["La liste des fichiers", "Le message d'erreur « No such file or directory »", "Rien", "Le mot ls"], a: 1, exp: "/rien n'existe pas : l'erreur (stderr) est capturée." },
    { type: "qcm", q: "Le <code>&gt;</code> est à Bash ce que quel duo est à C# pour les fichiers ?", opts: ["Console.WriteLine", "WriteAllText (écrase) / AppendAllText (&gt;&gt;, ajoute)", "ReadAllText", "JsonSerializer"], a: 1, exp: "Même logique écraser vs ajouter que WriteAllText/AppendAllText." }
  ],
  final: {

    intro: `<p>Aurélia veut fabriquer un petit journal et gérer les erreurs :</p>
<pre class="pseudo">echo "=== Journal ===" &gt; log.txt

echo "Sauvegarde lancee" &gt;&gt; log.txt

    questions: [
      { type: "qcm", q: "Après les 3 premières lignes, que contient log.txt ?", opts: ["Seulement la date", "Trois lignes : le titre, la date, puis « Sauvegarde lancee »", "Rien (écrasé à chaque fois)", "Une erreur"], a: 1, exp: "La 1re ligne crée (&gt;), les deux suivantes ajoutent (&gt;&gt;)." },
      { type: "qcm", q: "Pourquoi la 1re ligne utilise <code>&gt;</code> et les suivantes <code>&gt;&gt;</code> ?", opts: ["Au hasard", "&gt; crée/repart à neuf ; &gt;&gt; ajoute sans effacer les lignes déjà écrites", "&gt;&gt; est plus rapide", "&gt; ajoute et &gt;&gt; écrase"], a: 1, exp: "On démarre le fichier avec &gt;, puis on complète avec &gt;&gt;." },
      { type: "input", q: "La 4e ligne échoue (dossier inexistant). Où va le message d'erreur ?", a: "erreurs.txt", ph: "un nom de fichier", exp: "2&gt; erreurs.txt capture stderr." },
      { type: "qcm", q: "Que fait la dernière ligne <code>ls /etc &gt; /dev/null 2&gt;&amp;1</code> ?", opts: ["Affiche /etc", "N'affiche RIEN : résultats et erreurs sont jetés dans /dev/null", "Écrit dans log.txt", "Supprime /etc"], a: 1, exp: "Silence total : tout part au trou noir." },
      { type: "vf", q: "Si on relançait la 1re ligne <code>echo \"=== Journal ===\" &gt; log.txt</code>, le journal repartirait de zéro.", a: true, exp: "&gt; écrase : les lignes précédentes seraient perdues." }
    ],
    solution: `<pre class="pseudo">&gt;  log.txt   → crée le fichier avec le titre (écrase si existait)
&gt;&gt; log.txt   → ajoute la date, puis le message
2&gt; erreurs.txt → capture l'erreur du dossier inexistant
&gt; /dev/null 2&gt;&amp;1 → jette tout : aucun affichage

Règle d'or : &gt; démarre/écrase, &gt;&gt; complète, 2&gt; isole les erreurs,
/dev/null fait le silence.</pre>
<p>Tu contrôles où va chaque sortie. Demain : chaîner les commandes entre elles avec les tubes.</p>`
  }
