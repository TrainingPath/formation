<script>
var DAY = {
  num: 13,
  title: "sed : le remplacement de masse",
  subtitle: "Transformer du texte automatiquement, ligne par ligne.",
  theory: `
<h3>1. L'idée : un éditeur non interactif</h3>
<p><code>sed</code> (<em>stream editor</em>, éditeur de flux) applique des transformations à un texte qui défile, <strong>sans l'ouvrir</strong> dans un éditeur. Son usage n°1, de très loin : le <strong>remplacer/substituer</strong>.</p>
<pre class="pseudo">sed 's/ancien/nouveau/' fichier.txt
# s = substitute (substituer)
# Sur CHAQUE ligne, remplace la 1re occurrence de « ancien » par « nouveau »
# Le résultat s'affiche À L'ÉCRAN ; le fichier n'est PAS modifié (pour l'instant)</pre>
<pre class="pseudo">echo "j'aime les chats" | sed 's/chats/chiens/'
# affiche : j'aime les chiens</pre>

<h3>2. La commande s en détail</h3>
<pre class="pseudo">sed 's/chat/chien/'    # remplace la 1re occurrence de chaque ligne
sed 's/chat/chien/g'   # g = GLOBAL : TOUTES les occurrences de la ligne
sed 's/chat/chien/gi'  # g + i : global ET insensible à la casse (Chat, CHAT…)
sed 's/o/0/g'          # remplace tous les o par des 0</pre>
<p>Le séparateur <code>/</code> peut être remplacé par un autre caractère, très pratique quand le texte contient lui-même des <code>/</code> (des chemins !) :</p>
<pre class="pseudo">sed 's#/usr/local#/opt#g' chemins.txt   # remplace un chemin par un autre, en séparant avec #</pre>

<h3>3. Modifier VRAIMENT le fichier : -i</h3>
<pre class="pseudo">sed 's/chat/chien/g' notes.txt        # AFFICHE le résultat, fichier intact
sed -i 's/chat/chien/g' notes.txt     # -i = IN PLACE : modifie DIRECTEMENT le fichier
sed -i.bak 's/chat/chien/g' notes.txt # -i.bak : modifie ET garde une copie notes.txt.bak</pre>
<div class="warn">⚠️ <code>-i</code> écrit dans le fichier sans confirmation ni corbeille. Prends l'habitude de lancer d'abord la commande <strong>sans</strong> <code>-i</code> pour vérifier le résultat à l'écran, puis d'ajouter <code>-i</code> (ou mieux <code>-i.bak</code>) une fois sûre.</div>

<h3>4. Supprimer et sélectionner des lignes</h3>
<pre class="pseudo">sed '3d' fichier.txt        # d = delete : supprime la ligne 3
sed '2,5d' fichier.txt      # supprime les lignes 2 à 5
sed '/motif/d' fichier.txt  # supprime toutes les lignes contenant « motif »
sed -n '10,20p' fichier.txt # -n silence + p (print) : n'affiche QUE les lignes 10 à 20
sed -n '/erreur/p' f.txt    # n'affiche que les lignes contenant « erreur » (comme grep)</pre>
<p>Les nombres et <code>/motif/</code> devant une commande sont des <strong>adresses</strong> : ils disent à sed <em>sur quelles lignes</em> agir. Sans adresse, sed agit sur toutes les lignes.</p>

<h3>5. Cas d'usage typiques</h3>
<pre class="pseudo">sed 's/  */ /g' f.txt              # écraser les espaces multiples en un seul
sed 's/;/,/g' data.csv             # convertir un CSV à ; en CSV à ,
sed -i 's/localhost/127.0.0.1/g' conf.txt   # remplacer un réglage dans un fichier de config
cat f.txt | sed 's/^/&gt; /'          # préfixer chaque ligne par «&gt; » (^ = début de ligne)</pre>
<div class="tip">sed brille dans les scripts et les tubes pour nettoyer ou reformater du texte en masse : renommer un terme partout, changer un séparateur, retirer des lignes parasites… Ce que tu ferais « à la main » dans un éditeur, sed le fait sur des milliers de lignes en une commande.</div>

<h3>6. À retenir</h3>
<pre class="pseudo">sed 's/x/y/'    # remplacer x par y (1re occurrence par ligne)
sed 's/x/y/g'   # remplacer TOUTES les occurrences
sed -i …        # modifier le fichier sur place (prudence !)
sed 'Nd'        # supprimer la ligne N   ;   sed '/motif/d' supprime par motif
sed -n 'A,Bp'   # n'afficher que les lignes A à B</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>sed 's/chat/chien/'</code> sur chaque ligne ?", opts: ["Supprime le mot chat", "Remplace la 1re occurrence de « chat » par « chien »", "Remplace toutes les occurrences", "Trie les lignes"], a: 1, exp: "s = substitute : remplace le motif par le texte de droite." },
    { type: "qcm", q: "Que change le <code>g</code> dans <code>sed 's/o/0/g'</code> ?", opts: ["Il n'affecte que la 1re ligne", "Il remplace TOUTES les occurrences de la ligne, pas seulement la 1re", "Il ignore la casse", "Il supprime la ligne"], a: 1, exp: "g = global : toutes les occurrences de chaque ligne." },
    { type: "qcm", q: "Par défaut (sans -i), <code>sed 's/a/b/' f.txt</code>…", opts: ["Modifie f.txt", "AFFICHE le résultat sans toucher au fichier", "Supprime f.txt", "Crée f.bak"], a: 1, exp: "Sans -i, sed écrit sur la sortie standard ; le fichier reste intact." },
    { type: "input", q: "Quelle option de sed modifie le fichier DIRECTEMENT (in place) ?", a: ["-i", "i"], ph: "une option", exp: "-i = in place." },
    { type: "qcm", q: "Que fait <code>sed -i.bak 's/a/b/g' f.txt</code> ?", opts: ["Rien de sûr", "Modifie f.txt ET conserve une sauvegarde f.txt.bak", "Supprime f.txt", "Affiche seulement"], a: 1, exp: "-i.bak crée un filet de sécurité avant de modifier." },
    { type: "qcm", q: "Bon réflexe avec sed -i ?", opts: ["Toujours l'utiliser directement", "Tester d'abord SANS -i pour voir le résultat, puis l'ajouter", "Passer root", "Ajouter -f"], a: 1, exp: "Vérifier à l'écran avant d'écrire dans le fichier." },
    { type: "qcm", q: "<code>sed '3d' f.txt</code> fait…", opts: ["Affiche la ligne 3", "SUPPRIME la ligne 3", "Duplique la ligne 3", "Trie"], a: 1, exp: "d = delete ; 3 est l'adresse (la ligne)." },
    { type: "qcm", q: "<code>sed '/erreur/d' f.txt</code> supprime…", opts: ["La ligne « erreur »", "Toutes les lignes contenant « erreur »", "La 1re ligne", "Rien"], a: 1, exp: "/motif/ est une adresse : toutes les lignes correspondantes." },
    { type: "qcm", q: "<code>sed -n '10,20p' f.txt</code> affiche…", opts: ["Tout le fichier", "Seulement les lignes 10 à 20", "La ligne 1020", "Rien"], a: 1, exp: "-n coupe l'affichage auto, p (print) ré-affiche l'intervalle choisi." },
    { type: "input", q: "Dans <code>sed 's/x/y/g'</code>, quelle lettre finale rend le remplacement GLOBAL ?", a: "g", ph: "une lettre", exp: "g = global." },
    { type: "qcm", q: "Pourquoi écrire parfois <code>sed 's#/a#/b#g'</code> avec des # ?", opts: ["Par style", "Pour changer de séparateur quand le texte contient des / (chemins)", "# ignore la casse", "Obligatoire"], a: 1, exp: "Un autre séparateur évite d'échapper tous les / d'un chemin." },
    { type: "qcm", q: "<code>sed 's/;/,/g' data.csv</code> sert à…", opts: ["Supprimer data.csv", "Convertir un CSV à ; en CSV à , (tous les ; deviennent ,)", "Trier", "Compter"], a: 1, exp: "Remplacement global du séparateur." },
    { type: "vf", q: "sed peut, comme grep, n'afficher que les lignes contenant un motif (avec -n et p).", a: true, exp: "sed -n '/motif/p' imite grep motif." },
    { type: "qcm", q: "Sans adresse, une commande sed s'applique…", opts: ["À la 1re ligne", "À TOUTES les lignes", "À la dernière", "À aucune"], a: 1, exp: "Pas d'adresse = toutes les lignes." },
    { type: "input", q: "Quelle commande sed supprime la ligne numéro 1 d'un fichier ? sed '…'", a: ["1d", "'1d'"], ph: "l'adresse+commande", exp: "sed '1d' fichier supprime la 1re ligne." }
  ],
  final: {
    title: "Exercice final — Nettoyer un fichier de configuration",
    intro: `<p>Un fichier <code>app.conf</code> utilise <code>localhost</code> partout et contient des lignes de commentaire commençant par <code>#</code>. Aurélia le prépare pour la production.</p>`,
    questions: [
      { type: "qcm", q: "Remplacer TOUTES les occurrences de localhost par 127.0.0.1, à l'écran (test) :", opts: ["sed 's/localhost/127.0.0.1/g' app.conf", "sed -i '1d'", "sed '/localhost/d'", "grep localhost"], a: 0, exp: "Substitution globale, sans -i pour d'abord vérifier." },
      { type: "qcm", q: "Une fois le résultat validé, comment l'appliquer VRAIMENT au fichier, avec sauvegarde ?", opts: ["sed 's/…/…/g' app.conf", "sed -i.bak 's/localhost/127.0.0.1/g' app.conf", "rm app.conf", "cat app.conf"], a: 1, exp: "-i.bak modifie le fichier et garde app.conf.bak." },
      { type: "qcm", q: "Supprimer toutes les lignes de commentaire (celles contenant #) pour l'affichage :", opts: ["sed '/#/d' app.conf", "sed 's/#/g'", "sed '1d'", "grep -c #"], a: 0, exp: "/#/d supprime les lignes contenant #." },
      { type: "input", q: "N'afficher que les lignes 1 à 5 du fichier : sed -n '…p' app.conf", a: ["1,5", "'1,5'"], ph: "l'intervalle", exp: "sed -n '1,5p' affiche l'intervalle 1 à 5." },
      { type: "vf", q: "Lancer la substitution SANS -i d'abord permet de vérifier avant d'écrire dans le fichier.", a: true, exp: "C'est le garde-fou standard avec sed -i." }
    ],
    solution: `<pre class="pseudo">Test    : sed 's/localhost/127.0.0.1/g' app.conf      (affiche)
Appliquer: sed -i.bak 's/localhost/127.0.0.1/g' app.conf (+ sauvegarde)
Ôter les commentaires : sed '/#/d' app.conf
Voir les lignes 1-5   : sed -n '1,5p' app.conf

Méthode sûre : tester sans -i, valider, puis -i.bak.</pre>
<p>Tu transformes du texte en masse. Demain : awk, pour traiter des colonnes et faire des calculs.</p>`
  }
};
