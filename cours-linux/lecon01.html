<script>
var DAY = {
  num: 1,
  title: "Le terminal : premiers pas",
  subtitle: "Parler à la machine avec des mots, pas des clics.",
  theory: `
<h3>1. Terminal, shell, Bash : qui fait quoi ?</h3>
<p>Le <strong>terminal</strong> est la fenêtre noire dans laquelle tu tapes du texte. Ce n'est qu'un afficheur. Derrière lui tourne le <strong>shell</strong> : le programme qui <strong>lit</strong> ta commande, la <strong>fait exécuter</strong> par le système, puis t'affiche le résultat. Le shell le plus répandu sous Linux s'appelle <strong>Bash</strong> (<em>Bourne Again Shell</em>).</p>
<p>Pourquoi apprendre ça alors qu'il existe des interfaces graphiques ? Parce que sur un <strong>serveur</strong> il n'y a souvent pas d'écran graphique du tout, parce que le terminal est <strong>plus rapide</strong> et <strong>reproductible</strong> (une commande peut être notée, partagée, automatisée), et parce que 100 % des outils de développement modernes s'y pilotent.</p>

<h3>2. Lire le prompt</h3>
<p>Avant le curseur, le shell affiche un <strong>prompt</strong> (invite de commande) qui te renseigne :</p>
<pre class="pseudo">aurelia@portable:~$
# └──┬──┘ └───┬──┘ │ │
#    │        │     │ └─ le symbole : $ = utilisateur normal, # = superutilisateur (root)
#    │        │     └─── le répertoire courant : ~ signifie « mon dossier personnel »
#    │        └───────── le nom de la machine (hostname)
#    └────────────────── le nom de l'utilisateur connecté</pre>
<div class="tip">Le <code>$</code> final signifie « je suis un utilisateur normal ». Un <code>#</code> signifierait que tu es <strong>root</strong> (tous les pouvoirs) : à cet instant, la moindre faute peut casser le système. On y reviendra à la leçon 17.</div>

<h3>3. L'anatomie d'une commande</h3>
<p>Une commande se lit toujours de la même façon : un <strong>nom</strong>, puis d'éventuelles <strong>options</strong>, puis d'éventuels <strong>arguments</strong>, le tout séparé par des espaces.</p>
<pre class="pseudo">ls   -l   /etc
# │    │    └─ argument : SUR QUOI la commande agit (ici, le dossier /etc)
# │    └────── option : COMMENT elle agit (-l = format détaillé, une ligne par fichier)
# └─────────── nom de la commande (ls = « list », lister)</pre>
<p>Les options courtes commencent par un tiret (<code>-l</code>) et se combinent (<code>-la</code> = <code>-l -a</code>). Les options longues commencent par deux tirets (<code>--all</code>). Linux est <strong>sensible à la casse</strong> : <code>ls</code> et <code>LS</code> ne sont pas la même chose.</p>

<h3>4. Tes toutes premières commandes</h3>
<pre class="pseudo">whoami        # affiche ton nom d'utilisateur
hostname      # affiche le nom de la machine
date          # affiche la date et l'heure actuelles
pwd           # « print working directory » : où suis-je dans l'arborescence ?
echo Bonjour  # « écho » : réaffiche le texte qu'on lui donne
clear         # efface l'écran (le prompt remonte en haut)
uname -a      # informations sur le noyau Linux et la machine</pre>
<p><code>echo</code> semble inutile, mais c'est l'une des commandes les plus employées : elle sert à afficher des messages et, plus tard, le contenu des variables.</p>

<h3>5. Les raccourcis qui changent la vie</h3>
<pre class="pseudo"># Flèche HAUT / BAS : rappeler les commandes déjà tapées (l'historique)
# TAB            : compléter automatiquement un nom de commande ou de fichier
# Ctrl + C       : INTERROMPRE la commande en cours (le « stop » universel)
# Ctrl + L       : effacer l'écran (équivaut à clear)
# Ctrl + A / E   : aller au début / à la fin de la ligne
history          # affiche la liste de tes dernières commandes</pre>
<div class="warn">La touche <strong>Tab</strong> n'est pas un gadget : elle t'évite les fautes de frappe et te montre ce qui existe. Prends l'habitude de taper les premières lettres puis Tab, plutôt que d'écrire les noms en entier.</div>

<h3>6. Terminer la session</h3>
<pre class="pseudo">exit          # ferme le shell (et le terminal, ou la connexion à distance)</pre>
<div class="tip">Règle d'or de tout ce cours : <strong>lire ne suffit pas</strong>. Ouvre un vrai terminal (sous Windows : WSL, ou une machine virtuelle Ubuntu) et retape chaque commande. La mémoire des doigts fait le reste.</div>`,
  exercises: [
    { type: "qcm", q: "Le programme qui LIT et exécute tes commandes s'appelle…", opts: ["Le terminal", "Le shell (par exemple Bash)", "Le noyau", "L'écran"], a: 1, exp: "Le terminal n'est que l'affichage ; le shell (Bash) interprète les commandes." },
    { type: "qcm", q: "Dans le prompt <code>aurelia@portable:~$</code>, que signifie le <code>~</code> ?", opts: ["La touche entrée", "Le dossier personnel de l'utilisateur", "La racine du disque", "Une erreur"], a: 1, exp: "~ est un raccourci pour /home/aurelia, ton dossier personnel." },
    { type: "qcm", q: "Un prompt qui se termine par <code>#</code> au lieu de <code>$</code> indique…", opts: ["Une erreur de syntaxe", "Que tu es root (superutilisateur, tous les droits)", "Que le shell est occupé", "Un commentaire"], a: 1, exp: "# = root : prudence maximale, on peut tout casser." },
    { type: "input", q: "Quelle commande affiche le répertoire dans lequel tu te trouves ?", a: "pwd", ph: "une commande", exp: "pwd = print working directory." },
    { type: "input", q: "Quelle commande affiche ton nom d'utilisateur ?", a: "whoami", ph: "une commande", exp: "whoami répond par ton identifiant de connexion." },
    { type: "qcm", q: "Dans <code>ls -l /etc</code>, quel est l'ARGUMENT ?", opts: ["ls", "-l", "/etc", "Il n'y en a pas"], a: 2, exp: "L'argument est ce sur quoi on agit : le dossier /etc. -l est une option." },
    { type: "qcm", q: "Dans <code>ls -l /etc</code>, quel est l'OPTION ?", opts: ["ls", "-l", "/etc", "Aucune"], a: 1, exp: "-l modifie le COMMENT (format long). C'est une option." },
    { type: "vf", q: "Linux est sensible à la casse : <code>ls</code> et <code>LS</code> sont deux choses différentes.", a: true, exp: "Majuscules et minuscules comptent, pour les commandes comme pour les fichiers." },
    { type: "input", q: "Quelle commande efface le contenu de l'écran ? (le mot, pas le raccourci)", a: "clear", ph: "une commande", exp: "clear, ou le raccourci Ctrl+L." },
    { type: "qcm", q: "Quel raccourci INTERROMPT immédiatement la commande en cours ?", opts: ["Ctrl + C", "Ctrl + V", "Entrée", "Échap"], a: 0, exp: "Ctrl+C est le « stop » universel du terminal." },
    { type: "qcm", q: "À quoi sert la touche <strong>Tab</strong> dans le terminal ?", opts: ["À insérer 4 espaces", "À compléter automatiquement les noms de commandes/fichiers", "À valider la commande", "À effacer la ligne"], a: 1, exp: "L'auto-complétion : gain de temps et zéro faute de frappe." },
    { type: "input", q: "Quelle commande affiche la liste de tes dernières commandes tapées ?", a: "history", ph: "une commande", exp: "history conserve ton historique de session." },
    { type: "qcm", q: "<code>echo Bonjour</code> produit…", opts: ["Une erreur", "L'affichage du texte : Bonjour", "Rien", "La date"], a: 1, exp: "echo réaffiche simplement ce qu'on lui donne." },
    { type: "input", q: "Quelle commande ferme la session du shell ?", a: "exit", ph: "une commande", exp: "exit termine le shell (ou la connexion distante)." },
    { type: "vf", q: "On peut rappeler la commande précédente avec la flèche du haut.", a: true, exp: "Les flèches haut/bas parcourent l'historique." }
  ],
  final: {
    title: "Exercice final — Décoder une session",
    intro: `<p>Aurélia ouvre son terminal et voit ceci :</p>
<pre class="pseudo">aurelia@portable:~$ whoami
aurelia
aurelia@portable:~$ pwd
/home/aurelia
aurelia@portable:~$ echo On commence Linux</pre>
<p>Réponds aux questions sur cette session.</p>`,
    questions: [
      { type: "qcm", q: "Qui est l'utilisateur connecté ?", opts: ["portable", "aurelia", "root", "home"], a: 1, exp: "whoami a répondu « aurelia »." },
      { type: "input", q: "Dans quel dossier se trouve-t-elle ? (le chemin complet)", a: "/home/aurelia", ph: "un chemin", exp: "pwd a affiché /home/aurelia, son dossier personnel (le ~)." },
      { type: "qcm", q: "Qu'affichera la dernière commande <code>echo On commence Linux</code> ?", opts: ["Une erreur (3 arguments)", "On commence Linux", "echo", "Rien"], a: 1, exp: "echo réaffiche tous ses arguments séparés par une espace." },
      { type: "qcm", q: "Le prompt finit par <code>$</code> : elle est donc…", opts: ["Superutilisateur (root)", "Une utilisatrice normale", "Déconnectée", "En erreur"], a: 1, exp: "$ = utilisateur normal ; # aurait signifié root." },
      { type: "vf", q: "Taper <code>Whoami</code> (avec un W majuscule) donnerait le même résultat que <code>whoami</code>.", a: false, exp: "Linux est sensible à la casse : Whoami serait « commande introuvable »." }
    ],
    solution: `<pre class="pseudo">Utilisateur : aurelia   (réponse de whoami)
Dossier     : /home/aurelia   (réponse de pwd, c'est le ~)
echo On commence Linux  →  affiche : On commence Linux
Prompt en $  →  utilisatrice normale (pas root)
La casse compte  →  Whoami ≠ whoami</pre>
<p>Tu sais lire un prompt et lancer tes premières commandes. Demain : se déplacer dans l'arborescence.</p>`
  }
};
</script>
