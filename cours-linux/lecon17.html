<script>
var DAY = {
  num: 17,
  title: "Propriété, sudo et root",
  subtitle: "À qui appartient un fichier, et comment emprunter les pouvoirs de root.",
  theory: `
<h3>1. Propriétaire et groupe d'un fichier</h3>
<p>Les permissions (leçon 16) s'appliquent selon la <strong>propriété</strong>. Chaque fichier a un <strong>propriétaire</strong> (un utilisateur) et un <strong>groupe</strong>. On les voit avec <code>ls -l</code> :</p>
<pre class="pseudo">-rw-r--r-- 1 aurelia dev  rapport.txt
#            └──┬──┘ └┬┘
#               │     └─ groupe : dev
#               └─ propriétaire : aurelia</pre>
<p>Le propriétaire est en général celui qui a créé le fichier. C'est lui (et root) qui peut changer les permissions du fichier.</p>

<h3>2. Changer le propriétaire : chown</h3>
<pre class="pseudo">sudo chown marc rapport.txt        # rapport.txt appartient désormais à marc
sudo chown marc:dev rapport.txt    # change le propriétaire (marc) ET le groupe (dev)
sudo chown :dev rapport.txt        # change SEULEMENT le groupe (on garde le propriétaire)
sudo chown -R marc:dev site/       # -R : récursif, tout le dossier site/</pre>
<div class="warn">Changer le propriétaire nécessite <code>sudo</code> : on ne « donne » pas un fichier à quelqu'un d'autre sans les droits d'administration, sinon on pourrait contourner les protections.</div>

<h3>3. Changer seulement le groupe : chgrp</h3>
<pre class="pseudo">sudo chgrp dev rapport.txt     # met le groupe « dev » (équivaut à chown :dev)
groups                         # rappel : voir ses propres groupes</pre>
<p>Combiné aux permissions, cela permet le travail d'équipe : on met un dossier au groupe <code>dev</code>, on donne les droits d'écriture au groupe, et tous les membres de <code>dev</code> peuvent y travailler.</p>

<h3>4. sudo : emprunter les pouvoirs de root, ponctuellement</h3>
<p><code>sudo</code> (<em>substitute user do</em>) exécute <strong>une seule commande</strong> avec les droits de root, après avoir demandé <strong>ton</strong> mot de passe. C'est la manière moderne et sûre d'administrer : on reste soi-même, on n'emprunte les super-pouvoirs que le temps d'une commande.</p>
<pre class="pseudo">sudo apt update            # mettre à jour la liste des paquets (nécessite root)
sudo systemctl restart ssh # redémarrer un service
sudo nano /etc/hosts       # éditer un fichier système protégé
sudo !!                    # relancer la DERNIÈRE commande avec sudo (après un « permission denied »)</pre>
<div class="tip">Le réflexe : tu tapes une commande, tu obtiens « Permission denied », tu la relances préfixée de <code>sudo</code>. Beaucoup d'opérations d'administration ne demandent que ça.</div>

<h3>5. sudo ou su ?</h3>
<pre class="pseudo">sudo commande     # exécute UNE commande en root, avec TON mot de passe (recommandé)
sudo -i           # ouvre un SHELL root complet (le prompt passe à #) — pour plusieurs commandes
su -              # devient root avec le mot de passe DE ROOT (souvent désactivé sur Ubuntu)
exit              # quitter le shell root et redevenir soi-même</pre>
<p>Sur Ubuntu/Debian, le compte root n'a souvent pas de mot de passe défini : on passe donc par <code>sudo</code>. Les personnes autorisées à utiliser <code>sudo</code> sont membres du groupe <code>sudo</code> (fichier de config : <code>/etc/sudoers</code>, à éditer avec <code>visudo</code>).</p>

<h3>6. Prudence : sudo n'annule pas les erreurs</h3>
<div class="warn">Avec <code>sudo</code>, tu redeviens tout-puissant : un <code>sudo rm -rf</code> mal ciblé n'a aucun garde-fou. Avant de valider une commande <code>sudo</code> destructrice, relis-la deux fois. Le pouvoir de root est un outil, pas un mode par défaut.</div>
<pre class="pseudo"># Bon réflexe d'équipe :
sudo chown -R aurelia:dev /partage/projet   # le dossier appartient à l'équipe
sudo chmod -R 775 /partage/projet           # le groupe peut écrire, les autres lire
# → tous les membres de « dev » collaborent, les autres consultent seulement</pre>`,
  exercises: [
    { type: "qcm", q: "Dans <code>ls -l</code>, les deux noms après les droits et le chiffre sont…", opts: ["La date et l'heure", "Le propriétaire et le groupe du fichier", "Deux permissions", "Le chemin"], a: 1, exp: "Ex. « aurelia dev » = propriétaire aurelia, groupe dev." },
    { type: "input", q: "Quelle commande change le PROPRIÉTAIRE d'un fichier ?", a: "chown", ph: "une commande", exp: "chown = change owner." },
    { type: "qcm", q: "<code>sudo chown marc:dev f.txt</code> change…", opts: ["Seulement le groupe", "Le propriétaire (marc) ET le groupe (dev)", "Les permissions", "Rien"], a: 1, exp: "La notation user:group change les deux." },
    { type: "qcm", q: "<code>sudo chown :dev f.txt</code> (avec le deux-points devant) change…", opts: ["Le propriétaire seulement", "Le groupe seulement", "Les deux", "Les droits"], a: 1, exp: "En laissant l'utilisateur vide, on ne change que le groupe." },
    { type: "qcm", q: "Pourquoi chown demande-t-il en général <code>sudo</code> ?", opts: ["Par lenteur", "Donner un fichier à autrui nécessite les droits d'administration", "Pour l'afficher", "Ce n'est pas le cas"], a: 1, exp: "Changer la propriété est une opération privilégiée." },
    { type: "input", q: "Quelle commande change SEULEMENT le groupe d'un fichier ?", a: "chgrp", ph: "une commande", exp: "chgrp = change group (équivaut à chown :groupe)." },
    { type: "qcm", q: "Que fait <code>sudo</code> ?", opts: ["Supprime root", "Exécute UNE commande avec les droits de root, après ton mot de passe", "Change le shell", "Liste les groupes"], a: 1, exp: "sudo = emprunter root ponctuellement, avec TON mot de passe." },
    { type: "qcm", q: "Après un « Permission denied », le réflexe est souvent…", opts: ["Redémarrer", "Relancer la commande préfixée de sudo (ou sudo !!)", "Supprimer le fichier", "Changer d'utilisateur"], a: 1, exp: "sudo !! relance la dernière commande avec les droits root." },
    { type: "qcm", q: "Différence entre <code>sudo commande</code> et <code>sudo -i</code> ?", opts: ["Aucune", "sudo commande = une seule commande en root ; sudo -i = un SHELL root complet", "sudo -i est plus sûr", "sudo -i supprime root"], a: 1, exp: "sudo -i ouvre une session root (prompt #) pour plusieurs commandes." },
    { type: "qcm", q: "Sur Ubuntu, pourquoi passe-t-on par sudo plutôt que par <code>su -</code> ?", opts: ["su n'existe pas", "Le compte root n'a souvent pas de mot de passe défini", "sudo est plus lent", "Par tradition uniquement"], a: 1, exp: "Root étant sans mot de passe, sudo est la voie normale." },
    { type: "qcm", q: "Les utilisateurs autorisés à faire sudo appartiennent au groupe…", opts: ["dev", "sudo", "root", "admin uniquement"], a: 1, exp: "Le groupe sudo (config dans /etc/sudoers)." },
    { type: "qcm", q: "Avec quel outil édite-t-on prudemment le fichier /etc/sudoers ?", opts: ["nano directement", "visudo (qui vérifie la syntaxe)", "cat", "chmod"], a: 1, exp: "visudo empêche d'enregistrer un fichier sudoers cassé." },
    { type: "vf", q: "sudo ajoute des garde-fous : un sudo rm -rf mal ciblé sera bloqué automatiquement.", a: false, exp: "Faux : en root, aucune protection. Prudence maximale." },
    { type: "qcm", q: "<code>sudo chown -R aurelia:dev projet/</code> fait…", opts: ["Change le seul dossier projet", "Change propriétaire et groupe de projet/ et de TOUT son contenu", "Supprime projet", "Change les droits"], a: 1, exp: "-R applique récursivement le changement de propriété." },
    { type: "vf", q: "Bonne pratique : ne pas rester connecté en root, mais utiliser sudo au coup par coup.", a: true, exp: "On limite ainsi les dégâts d'une erreur." }
  ],
  final: {
    title: "Exercice final — Ouvrir un dossier partagé à une équipe",
    intro: `<p>Aurélia (admin) crée un espace <code>/srv/equipe</code> pour que tous les membres du groupe <code>dev</code> puissent y travailler.</p>`,
    questions: [
      { type: "qcm", q: "Créer le dossier (il est dans /srv, zone système) :", opts: ["mkdir /srv/equipe", "sudo mkdir /srv/equipe", "chown /srv/equipe", "touch /srv/equipe"], a: 1, exp: "/srv appartient au système : mkdir y nécessite sudo." },
      { type: "qcm", q: "Attribuer le dossier à aurelia et au groupe dev, récursivement :", opts: ["sudo chown -R aurelia:dev /srv/equipe", "chgrp dev", "chmod 777", "chown aurelia"], a: 0, exp: "chown -R aurelia:dev fixe propriétaire et groupe sur tout l'arbre." },
      { type: "qcm", q: "Donner au groupe le droit d'ÉCRIRE (et lecture aux autres) : rwx rwx r-x en octal :", opts: ["sudo chmod -R 775 /srv/equipe", "chmod 644", "chmod 700", "chmod 600"], a: 0, exp: "775 = rwx (u) rwx (g) r-x (o) : le groupe dev peut écrire." },
      { type: "qcm", q: "Ajouter marc à l'équipe pour qu'il en profite (rappel leçon 15) :", opts: ["sudo usermod -aG dev marc", "chown marc", "chmod +x", "su marc"], a: 0, exp: "L'appartenance au groupe dev donne accès au dossier." },
      { type: "vf", q: "Mettre 777 sur /srv/equipe serait un raccourci acceptable ici.", a: false, exp: "Non : 775 suffit (groupe dev en écriture). 777 ouvrirait à tout le monde inutilement." }
    ],
    solution: `<pre class="pseudo">sudo mkdir /srv/equipe                    → créer dans la zone système
sudo chown -R aurelia:dev /srv/equipe     → propriété à l'équipe (groupe dev)
sudo chmod -R 775 /srv/equipe             → le groupe dev peut écrire
sudo usermod -aG dev marc                 → marc rejoint l'équipe

Propriété (chown) + groupe + droits (chmod) = collaboration maîtrisée.
sudo : le pouvoir root, seulement quand il le faut.</pre>
<p>Tu maîtrises propriété et privilèges. Demain : voir et contrôler les processus.</p>`
  }
};
