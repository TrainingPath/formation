<script>
var DAY = {
  num: 9,
  title: "Les tubes (pipes)",
  subtitle: "Brancher des commandes bout à bout.",
  theory: `
<h3>1. L'idée : la sortie de l'une devient l'entrée de l'autre</h3>
<p>Le <strong>tube</strong> (pipe), noté <code>|</code>, connecte la <strong>sortie</strong> (stdout) d'une commande à l'<strong>entrée</strong> (stdin) de la suivante. Aucune donnée ne passe par un fichier : tout circule en mémoire, à la chaîne.</p>
<pre class="pseudo">commande1 | commande2 | commande3
# La sortie de 1 nourrit 2, dont la sortie nourrit 3.
# On lit ça de gauche à droite, comme une chaîne de montage.</pre>
<pre class="pseudo">ls | wc -l          # ls PRODUIT la liste ; wc -l la COMPTE → nombre de fichiers du dossier</pre>

<h3>2. La philosophie Unix</h3>
<p>C'est le cœur de la puissance de Linux : de petits outils qui font <strong>une seule chose, mais bien</strong>, qu'on <strong>combine</strong> pour résoudre des problèmes complexes. Plutôt qu'un gros programme unique, on assemble <code>ls</code>, <code>grep</code>, <code>sort</code>, <code>wc</code>… comme des briques.</p>
<div class="tip">Redirection <code>&gt;</code> ou tube <code>|</code> ? Le <code>&gt;</code> envoie vers un <strong>fichier</strong> ; le <code>|</code> envoie vers une <strong>autre commande</strong>. On dit souvent : « &gt; parle au disque, | parle à un programme ».</div>

<h3>3. Les combinaisons que tu utiliseras tous les jours</h3>
<pre class="pseudo">ls -l | wc -l                 # compter les éléments d'un dossier
cat fichier | grep "erreur"   # ne garder que les lignes contenant « erreur »
sort noms.txt | uniq          # trier puis retirer les doublons consécutifs
ps aux | grep firefox         # chercher un processus précis dans la liste
ls -l | less                  # paginer une longue sortie (navigation, q pour sortir)
cat gros.log | head -n 20     # ne montrer que les 20 premières lignes du flux</pre>
<p>Remarque : <code>cat fichier | grep motif</code> peut s'écrire plus court <code>grep motif fichier</code>. Mais la forme avec tube reste utile dès que la source n'est pas un simple fichier (par exemple <code>ps aux | grep …</code>).</p>

<h3>4. Enchaîner plusieurs tubes</h3>
<pre class="pseudo"># « Quels sont les 3 mots les plus fréquents d'un texte ? »
cat texte.txt | tr ' ' '\\n' | sort | uniq -c | sort -nr | head -n 3
# tr ' ' '\\n'  : remplace les espaces par des retours à la ligne (un mot par ligne)
# sort          : trie les mots
# uniq -c       : compte les occurrences de chaque mot (lignes identiques adjacentes)
# sort -nr      : trie par nombre décroissant (n = numérique, r = reverse)
# head -n 3     : garde le trio de tête</pre>
<div class="tip">Chaque maillon est trivial ; c'est leur <strong>assemblage</strong> qui résout un vrai problème. On construit ce genre de chaîne pas à pas : on ajoute un tube, on regarde le résultat, on ajoute le suivant.</div>

<h3>5. Voir ET enregistrer en même temps : tee</h3>
<pre class="pseudo">ls -l | tee liste.txt         # affiche la liste À L'ÉCRAN *et* l'écrit dans liste.txt
ls -l | tee -a liste.txt      # -a : ajoute au fichier au lieu de l'écraser</pre>
<p><code>tee</code> est un « T » de plomberie : il duplique le flux, une copie vers l'écran, une copie vers le fichier. Pratique pour garder une trace tout en continuant la chaîne.</p>

<h3>6. À retenir</h3>
<pre class="pseudo">|        # relie la sortie d'une commande à l'entrée de la suivante
commande | wc -l      # combien de lignes ?
commande | grep motif # ne garder que certaines lignes
commande | sort | uniq # trier et dédoublonner
commande | tee f.txt   # voir à l'écran ET enregistrer</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait l'opérateur <code>|</code> (tube) ?", opts: ["Il envoie la sortie vers un fichier", "Il relie la SORTIE d'une commande à l'ENTRÉE de la suivante", "Il supprime des lignes", "Il crée un dossier"], a: 1, exp: "Le tube branche stdout d'une commande sur stdin de la suivante." },
    { type: "input", q: "Quelle chaîne compte le nombre d'éléments du dossier courant ? (deux commandes reliées par |)", a: ["ls | wc -l", "ls|wc -l"], ph: "ls … wc …", exp: "ls produit la liste, wc -l la compte." },
    { type: "qcm", q: "Différence entre <code>&gt;</code> et <code>|</code> ?", opts: ["Aucune", "&gt; envoie vers un FICHIER, | vers une autre COMMANDE", "| écrase, &gt; ajoute", "&gt; est plus lent"], a: 1, exp: "&gt; parle au disque ; | parle à un programme." },
    { type: "qcm", q: "La « philosophie Unix » consiste à…", opts: ["Écrire un seul gros programme", "Combiner de petits outils qui font bien une seule chose", "Éviter le terminal", "Tout faire en graphique"], a: 1, exp: "Petits outils spécialisés + tubes = grande puissance." },
    { type: "qcm", q: "<code>cat log.txt | grep \"erreur\"</code> affiche…", opts: ["Tout le fichier", "Seulement les lignes contenant « erreur »", "Le nombre de lignes", "Une erreur"], a: 1, exp: "grep filtre les lignes qui contiennent le motif." },
    { type: "qcm", q: "<code>sort noms.txt | uniq</code> réalise…", opts: ["Un tri seulement", "Un tri PUIS la suppression des doublons consécutifs", "Un comptage", "Une copie"], a: 1, exp: "uniq supprime les doublons adjacents, d'où le sort avant." },
    { type: "qcm", q: "Pourquoi trier AVANT uniq ?", opts: ["Par esthétique", "Parce que uniq ne retire que les doublons ADJACENTS : le tri les regroupe", "uniq exige un tri obligatoire sinon erreur", "Pour aller plus vite uniquement"], a: 1, exp: "uniq compare des lignes voisines ; sort met les identiques côte à côte." },
    { type: "qcm", q: "<code>ps aux | grep firefox</code> sert à…", opts: ["Lancer firefox", "Retrouver le(s) processus firefox dans la liste des processus", "Fermer firefox", "Compter les fichiers"], a: 1, exp: "ps aux liste les processus, grep isole ceux qui nous intéressent." },
    { type: "qcm", q: "Pour paginer une très longue sortie de commande :", opts: ["commande | wc", "commande | less", "commande &gt; less", "commande | rm"], a: 1, exp: "Envoyer le flux dans less permet de naviguer (q pour sortir)." },
    { type: "input", q: "Pour ne garder que les 20 premières lignes d'un flux, on ajoute au bout : | head …", a: ["head -n 20", "head -20"], ph: "head …", exp: "commande | head -n 20." },
    { type: "qcm", q: "À quoi sert <code>tee</code> dans <code>ls -l | tee liste.txt</code> ?", opts: ["À supprimer liste.txt", "À AFFICHER la sortie et l'ENREGISTRER en même temps", "À trier", "À compter"], a: 1, exp: "tee duplique le flux : écran + fichier." },
    { type: "qcm", q: "Quelle option de tee AJOUTE au fichier au lieu de l'écraser ?", opts: ["-a", "-r", "-n", "-l"], a: 0, exp: "tee -a fonctionne comme &gt;&gt;." },
    { type: "vf", q: "Dans un tube, les données passent par un fichier temporaire sur le disque.", a: false, exp: "Non : elles circulent en mémoire, directement d'une commande à l'autre." },
    { type: "qcm", q: "Dans <code>sort | uniq -c | sort -nr</code>, que fait <code>uniq -c</code> ?", opts: ["Supprime tout", "COMPTE les occurrences de chaque ligne", "Trie", "Affiche la 1re ligne"], a: 1, exp: "-c = count : préfixe chaque ligne unique par son nombre d'occurrences." },
    { type: "qcm", q: "On construit une longue chaîne de tubes…", opts: ["D'un seul coup, sans vérifier", "Progressivement : on ajoute un tube, on regarde le résultat, on continue", "Toujours de droite à gauche", "En un seul programme"], a: 1, exp: "Construction pas à pas : c'est plus sûr et plus clair." }
  ],
  final: {
    title: "Exercice final — Analyser un fichier de connexions",
    intro: `<p>Un fichier <code>connexions.txt</code> contient une ville par ligne (avec des répétitions). Aurélia veut savoir quelles villes reviennent le plus.</p>
<pre class="pseudo">sort connexions.txt | uniq -c | sort -nr | head -n 3</pre>`,
    questions: [
      { type: "qcm", q: "Que fait le premier <code>sort connexions.txt</code> ?", opts: ["Compte les lignes", "Trie les villes pour regrouper les identiques", "Supprime les doublons", "Affiche la fin"], a: 1, exp: "Le tri regroupe les lignes identiques, préparant uniq." },
      { type: "qcm", q: "Rôle de <code>uniq -c</code> ici ?", opts: ["Retirer toutes les villes", "Fusionner les lignes identiques et préfixer chacune par son NOMBRE d'occurrences", "Trier par ordre alphabétique", "Compter les caractères"], a: 1, exp: "uniq -c donne le compte par ville." },
      { type: "qcm", q: "Pourquoi le second <code>sort -nr</code> ?", opts: ["Pour retrier alphabétiquement", "Pour trier par NOMBRE décroissant (n = numérique, r = reverse)", "Pour supprimer", "Inutile"], a: 1, exp: "On veut les villes les plus fréquentes en tête." },
      { type: "input", q: "Que fait le <code>head -n 3</code> final ?", a: ["garde les 3 premieres lignes", "affiche les 3 premieres", "les 3 premieres lignes", "3 premieres"], ph: "en quelques mots", exp: "Il ne garde que le top 3 des villes les plus fréquentes." },
      { type: "vf", q: "Sans le premier <code>sort</code>, <code>uniq -c</code> compterait mal les villes dispersées dans le fichier.", a: true, exp: "uniq ne fusionne que les lignes ADJACENTES : sans tri préalable, les doublons éloignés seraient comptés séparément." }
    ],
    solution: `<pre class="pseudo">sort connexions.txt   → regroupe les villes identiques
| uniq -c             → compte chaque ville (ex. « 42 Paris »)
| sort -nr            → classe du plus grand au plus petit
| head -n 3           → garde le top 3

4 petits outils → une vraie analyse de fréquence. C'est ça, la
philosophie Unix : combiner plutôt que réinventer.</pre>
<p>Tu sais chaîner les commandes. Demain : grep en profondeur, le chercheur de texte.</p>`
  }
};
</script>
