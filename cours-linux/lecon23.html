<script>
var DAY = {
  num: 23,
  title: "Variables et paramètres",
  subtitle: "Rendre un script souple et réutilisable.",
  theory: `
<h3>1. Créer et utiliser une variable</h3>
<pre class="pseudo">nom="Aurelia"          # AFFECTATION : aucun espace autour du =
echo "$nom"            # UTILISATION : le $ récupère la valeur → Aurelia
echo "Bonjour $nom"    # interpolation dans une chaîne → Bonjour Aurelia</pre>
<div class="warn">Piège n°1, le plus fréquent : <strong>pas d'espaces autour du =</strong>. <code>nom = "Aurelia"</code> échoue, car Bash croit alors que <code>nom</code> est une commande. Écris toujours <code>nom="Aurelia"</code> collé.</div>
<p>On lit une variable en préfixant son nom d'un <code>$</code>. Les accolades <code>\${nom}</code> servent à délimiter le nom quand il touche d'autres caractères :</p>
<pre class="pseudo">fichier="rapport"
echo "\${fichier}_2024.txt"   # → rapport_2024.txt (les {} isolent le nom de la variable)
# Sans accolades, echo "$fichier_2024.txt" chercherait une variable « fichier_2024 » !</pre>

<h3>2. Les guillemets changent tout</h3>
<pre class="pseudo">nom="Ana Lea"
echo "$nom"      # GUILLEMETS DOUBLES : interprète les variables → Ana Lea (une seule chaîne)
echo '$nom'      # guillemets SIMPLES : rien n'est interprété → $nom (littéral)
echo $nom        # SANS guillemets : le résultat est redécoupé aux espaces (2 arguments !)</pre>
<div class="tip">Règle de survie : <strong>mets tes variables entre guillemets doubles</strong> (<code>"$nom"</code>). Cela évite les bugs quand la valeur contient une espace (un chemin comme <code>/mes documents/</code>). Guillemets simples = texte brut, sans interprétation.</div>

<h3>3. Capturer le résultat d'une commande</h3>
<pre class="pseudo">aujourdhui=$(date +%F)      # $(...) exécute la commande et RANGE sa sortie dans la variable
echo "Nous sommes le $aujourdhui"
nb_fichiers=$(ls | wc -l)   # combine tout ce que tu sais : ls | wc -l capturé dans une variable
echo "Ce dossier contient $nb_fichiers éléments"</pre>
<p>La <strong>substitution de commande</strong> <code>$(commande)</code> est essentielle en script : elle transforme la sortie d'une commande en valeur manipulable.</p>

<h3>4. Les paramètres : donner des arguments au script</h3>
<p>Un script reçoit ce qu'on tape après son nom. Ces <strong>paramètres</strong> portent des noms spéciaux :</p>
<pre class="pseudo"># Lancement :  ./saluer.sh Ana Lea
# $0  → le nom du script (./saluer.sh)
# $1  → le 1er argument (Ana)
# $2  → le 2e argument (Lea)
# $@  → TOUS les arguments (Ana Lea)
# $#  → le NOMBRE d'arguments (2)</pre>
<pre class="pseudo">#!/bin/bash
# saluer.sh
echo "Bonjour $1 !"                 # utilise le 1er argument
echo "Tu as passé $# argument(s)"   # affiche combien il y en avait</pre>
<pre class="pseudo">./saluer.sh Aurelia
# → Bonjour Aurelia !
# → Tu as passé 1 argument(s)</pre>

<h3>5. Variables d'environnement utiles</h3>
<pre class="pseudo">echo "$HOME"     # ton dossier personnel (/home/toi)
echo "$USER"     # ton nom d'utilisateur
echo "$PWD"      # le dossier courant
echo "$PATH"     # les dossiers où le shell cherche les commandes (leçon 30)</pre>
<p>Ces variables, en MAJUSCULES par convention, sont fournies par le système. Tes propres variables se nomment plutôt en minuscules pour les distinguer.</p>

<h3>6. À retenir</h3>
<pre class="pseudo">nom="valeur"        # affecter (sans espaces autour du =)
"$nom"  \${nom}      # lire (guillemets doubles recommandés)
'$nom'              # littéral, non interprété
$(commande)         # capturer la sortie d'une commande
$1 $2 … $@ $#       # les arguments passés au script
$HOME $USER $PATH   # variables d'environnement</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle affectation est CORRECTE en Bash ?", opts: ["nom = \"Ana\"", "nom=\"Ana\"", "$nom = Ana", "let nom Ana"], a: 1, exp: "Pas d'espaces autour du = : nom=\"Ana\"." },
    { type: "qcm", q: "Pourquoi <code>nom = \"Ana\"</code> (avec espaces) échoue-t-il ?", opts: ["Ana est réservé", "Bash croit que « nom » est une commande à lancer", "Il manque un $", "C'est correct"], a: 1, exp: "Les espaces cassent l'affectation ; Bash interprète nom comme une commande." },
    { type: "input", q: "Quel symbole précède le nom d'une variable pour LIRE sa valeur ?", a: "$", ph: "un symbole", exp: "$nom donne la valeur de nom." },
    { type: "qcm", q: "À quoi servent les accolades dans <code>${fichier}_2024</code> ?", opts: ["À rien", "À délimiter clairement le nom de la variable quand il touche d'autres caractères", "À multiplier", "À commenter"], a: 1, exp: "Sans {}, Bash chercherait la variable « fichier_2024 »." },
    { type: "qcm", q: "<code>echo '$nom'</code> (guillemets SIMPLES) affiche…", opts: ["La valeur de la variable nom", "Le texte littéral $nom (rien n'est interprété)", "Un message d'erreur", "Une ligne vide"], a: 1, exp: "Les guillemets simples n'interprètent pas les variables." },
    { type: "qcm", q: "Pourquoi préférer <code>\"$nom\"</code> (guillemets doubles) ?", opts: ["Pour la couleur", "Pour éviter que la valeur soit redécoupée si elle contient une espace", "C'est obligatoire", "Pour aller plus vite"], a: 1, exp: "Les guillemets doubles protègent les valeurs avec espaces." },
    { type: "qcm", q: "<code>aujourdhui=$(date +%F)</code> fait…", opts: ["Affiche la date", "Exécute date et RANGE sa sortie dans la variable aujourdhui", "Une erreur", "Rien"], a: 1, exp: "$(...) = substitution de commande : la sortie devient une valeur." },
    { type: "input", q: "Quelle syntaxe capture la sortie d'une commande dans une variable ? …(commande)", a: ["$", "$()"], ph: "un symbole", exp: "$(commande) capture la sortie." },
    { type: "qcm", q: "Dans un script lancé par <code>./s.sh Ana Lea</code>, que vaut <code>$1</code> ?", opts: ["./s.sh", "Ana", "Lea", "2"], a: 1, exp: "$1 = premier argument = Ana." },
    { type: "qcm", q: "Que représente <code>$#</code> ?", opts: ["Le nom du script", "Le NOMBRE d'arguments passés", "Le 1er argument", "Tous les arguments"], a: 1, exp: "$# = compte des arguments." },
    { type: "qcm", q: "Que représente <code>$@</code> ?", opts: ["Le nombre d'arguments", "TOUS les arguments", "Le nom du script", "Le code de sortie"], a: 1, exp: "$@ = l'ensemble des arguments." },
    { type: "qcm", q: "Que contient <code>$0</code> ?", opts: ["Le 1er argument", "Le NOM du script lui-même", "Zéro", "Rien"], a: 1, exp: "$0 = le nom du script invoqué." },
    { type: "input", q: "Quelle variable d'environnement contient ton dossier personnel ?", a: ["$HOME", "HOME"], ph: "$…", exp: "$HOME = /home/toi." },
    { type: "vf", q: "Par convention, les variables d'environnement système sont en MAJUSCULES (HOME, USER, PATH).", a: true, exp: "Majuscules pour l'environnement ; minuscules pour tes variables." },
    { type: "qcm", q: "<code>nb=$(ls | wc -l)</code> range dans nb…", opts: ["Le mot « ls »", "Le nombre d'éléments du dossier", "Une erreur", "La liste complète"], a: 1, exp: "La sortie de ls | wc -l (un nombre) est capturée." }
  ],
  final: {
    title: "Exercice final — Un script personnalisable",
    intro: `<p>Aurélia écrit <code>accueil.sh</code> :</p>
<pre class="pseudo">#!/bin/bash
prenom="$1"
date_jour=$(date +%F)
echo "Bonjour \${prenom} !"
echo "Nous sommes le $date_jour."
echo "Tu as fourni $# argument(s)."</pre>
<p>Elle le lance ainsi : <code>./accueil.sh Marc</code></p>`,
    questions: [
      { type: "input", q: "Que vaut la variable <code>prenom</code> ?", a: "Marc", ph: "une valeur", exp: "prenom=\"$1\" et $1 = Marc." },
      { type: "qcm", q: "Que contient <code>date_jour</code> ?", opts: ["Le texte « date +%F »", "La date du jour (ex. 2024-06-01), capturée par $(...)", "Rien", "Le nom du script"], a: 1, exp: "$(date +%F) exécute la commande et range sa sortie." },
      { type: "qcm", q: "Qu'affiche la 1re ligne d'echo ?", opts: ["Bonjour ${prenom} !", "Bonjour Marc !", "Bonjour $1 !", "Une erreur"], a: 1, exp: "${prenom} est remplacé par sa valeur, Marc." },
      { type: "input", q: "Qu'affiche « Tu as fourni … argument(s). » ?", a: "1", ph: "un nombre", exp: "Un seul argument (Marc) → $# = 1." },
      { type: "qcm", q: "Pourquoi <code>\"$1\"</code> et <code>\${prenom}</code> sont-ils entre guillemets/accolades ?", opts: ["Décoration", "Robustesse : guillemets contre les espaces, accolades pour délimiter le nom", "Obligatoire sinon erreur", "Pour la vitesse"], a: 1, exp: "Bonnes pratiques : \"$var\" protège des espaces, ${var} délimite le nom." }
    ],
    solution: `<pre class="pseudo">./accueil.sh Marc
prenom="$1"          → Marc
date_jour=$(date +%F)→ ex. 2024-06-01
echo "Bonjour \${prenom} !"     → Bonjour Marc !
echo "Nous sommes le $date_jour." → Nous sommes le 2024-06-01.
$# = 1 (un seul argument)

Rappels : pas d'espace autour du = · "$var" · $(commande) · $1 $#</pre>
<p>Ton script s'adapte à ses arguments. Demain : les conditions, pour qu'il RÉAGISSE.</p>`
  }
};
</script>
