<script>
var DAY = {
  num: 18,
  title: "Les processus : ps, top, kill",
  subtitle: "Voir et contrôler ce qui tourne.",
  theory: `
<h3>1. Qu'est-ce qu'un processus ?</h3>
<p>Un <strong>processus</strong> est un programme <strong>en cours d'exécution</strong>. Chaque commande que tu lances devient un processus, identifié par un numéro unique : le <strong>PID</strong> (Process ID). Le système en fait tourner des centaines simultanément.</p>
<pre class="pseudo">ps            # les processus de TON terminal actuel (courte liste)
ps aux        # TOUS les processus du système, avec détails
#   a = ceux de tous les utilisateurs, u = format lisible, x = même sans terminal</pre>
<pre class="pseudo">ps aux | head
# USER  PID  %CPU %MEM   ...  COMMAND
# La colonne PID = l'identifiant ; COMMAND = le programme ; %CPU/%MEM = sa consommation</pre>

<h3>2. Retrouver un processus précis</h3>
<pre class="pseudo">ps aux | grep firefox     # filtrer la liste pour ne garder que firefox (tube, leçon 9)
pgrep firefox             # affiche directement le(s) PID de firefox
pidof firefox             # variante : le PID d'un programme par son nom</pre>
<div class="tip">C'est ici que les tubes de la semaine 2 servent au quotidien : <code>ps aux | grep nom</code> est LA façon de retrouver un programme et son PID avant d'agir dessus.</div>

<h3>3. Le tableau de bord en direct : top (et htop)</h3>
<pre class="pseudo">top       # tableau des processus, rafraîchi en continu (les plus gourmands en haut)
# Dans top :  q = quitter,  k = tuer un processus (demande le PID),  M = trier par mémoire
htop      # version plus lisible et colorée (à installer : sudo apt install htop)</pre>
<p><code>top</code> répond à « qu'est-ce qui ralentit ma machine ? » : il montre en temps réel qui consomme le processeur et la mémoire.</p>

<h3>4. Arrêter un processus : kill</h3>
<pre class="pseudo">kill 1234         # envoie au PID 1234 un signal de fin POLIE (TERM) : « termine-toi »
kill -9 1234      # signal KILL : arrêt FORCÉ, immédiat (dernier recours)
killall firefox   # tue tous les processus nommés « firefox »
pkill firefox     # tue par motif de nom (proche de killall)</pre>
<div class="warn"><code>kill</code> n'est pas forcément violent : par défaut il envoie le signal TERM qui demande au programme de s'arrêter proprement (sauvegarder, fermer ses fichiers). On ne recourt à <code>kill -9</code> (KILL, non ignorable, sans nettoyage) que si le programme est vraiment figé et ignore TERM.</div>

<h3>5. Premier plan, arrière-plan, jobs</h3>
<pre class="pseudo">commande &amp;          # lance la commande en ARRIÈRE-PLAN (le terminal reste libre)
jobs                # liste les tâches lancées depuis ce terminal
fg %1               # ramène la tâche n°1 au PREMIER plan (foreground)
bg %1               # relance la tâche n°1 en arrière-plan (background)
# Ctrl + Z          : SUSPEND la tâche en cours (elle se met en pause)
# Ctrl + C          : INTERROMPT (termine) la tâche en cours</pre>
<pre class="pseudo">nohup ./long.sh &amp;   # lance en arrière-plan ET survit à la fermeture du terminal
# (nohup = « no hangup » : la tâche continue même si tu te déconnectes)</pre>

<h3>6. Le mémo</h3>
<pre class="pseudo">ps aux | grep nom   # trouver un processus et son PID
top / htop          # surveiller en direct (q pour quitter)
kill PID            # demander l'arrêt (poli)
kill -9 PID         # forcer l'arrêt (dernier recours)
commande &amp;          # lancer en arrière-plan
Ctrl+C stop | Ctrl+Z pause | fg reprendre</pre>`,
  exercises: [
    { type: "qcm", q: "Un processus, c'est…", opts: ["Un fichier sur le disque", "Un programme EN COURS d'exécution", "Un dossier", "Un utilisateur"], a: 1, exp: "Programme lancé = processus, avec un PID." },
    { type: "input", q: "Comment appelle-t-on l'identifiant numérique unique d'un processus ? (le sigle)", a: "pid", ph: "trois lettres", exp: "PID = Process ID." },
    { type: "qcm", q: "Quelle commande liste TOUS les processus du système avec détails ?", opts: ["ps", "ps aux", "top -1", "jobs"], a: 1, exp: "ps aux : tous les utilisateurs, format lisible, même sans terminal." },
    { type: "qcm", q: "Pour retrouver le processus firefox et son PID :", opts: ["ps aux | grep firefox", "kill firefox", "top firefox", "jobs firefox"], a: 0, exp: "Le tube ps aux | grep filtre la liste." },
    { type: "qcm", q: "À quoi sert <code>top</code> ?", opts: ["Trier des fichiers", "Afficher en DIRECT les processus et leur consommation CPU/mémoire", "Tuer un processus", "Lister les groupes"], a: 1, exp: "top = tableau de bord temps réel (q pour sortir)." },
    { type: "input", q: "Dans top, quelle touche permet de quitter ?", a: "q", ph: "une touche", exp: "q ferme top." },
    { type: "qcm", q: "<code>kill 1234</code> (sans -9) fait…", opts: ["Un arrêt brutal immédiat", "Une demande d'arrêt POLIE (signal TERM) : le programme peut se fermer proprement", "Rien", "Supprime le fichier 1234"], a: 1, exp: "Par défaut kill envoie TERM, pas KILL." },
    { type: "qcm", q: "Quand utiliser <code>kill -9</code> ?", opts: ["Toujours", "En DERNIER recours, quand le programme est figé et ignore l'arrêt poli", "Pour lancer un programme", "Jamais"], a: 1, exp: "-9 (KILL) force l'arrêt sans nettoyage : réservé aux cas bloqués." },
    { type: "qcm", q: "<code>killall firefox</code> fait…", opts: ["Tue le PID 1", "Tue TOUS les processus nommés firefox", "Ferme le terminal", "Redémarre firefox"], a: 1, exp: "killall agit par nom de programme." },
    { type: "qcm", q: "Que fait <code>&amp;</code> à la fin d'une commande ?", opts: ["Provoque une erreur de syntaxe", "Lance la commande en ARRIÈRE-PLAN, libérant le terminal", "Duplique la commande", "L'exécute en root"], a: 1, exp: "&amp; = tâche de fond ; le prompt revient tout de suite." },
    { type: "input", q: "Quel raccourci INTERROMPT (termine) la tâche en cours dans le terminal ?", a: ["ctrl+c", "ctrl c", "ctrl-c"], ph: "un raccourci", exp: "Ctrl+C envoie l'ordre d'interruption." },
    { type: "qcm", q: "Que fait <code>Ctrl+Z</code> ?", opts: ["Annule la frappe", "SUSPEND (met en pause) la tâche en cours", "Ferme le terminal", "Tue le processus"], a: 1, exp: "Ctrl+Z suspend ; fg/bg permettent de reprendre." },
    { type: "qcm", q: "<code>jobs</code> affiche…", opts: ["Tous les processus du système", "Les tâches lancées depuis CE terminal", "Les utilisateurs", "Les fichiers"], a: 1, exp: "jobs liste les tâches de la session courante." },
    { type: "qcm", q: "À quoi sert <code>nohup ./script.sh &amp;</code> ?", opts: ["À tuer le script", "À le lancer en arrière-plan ET le faire SURVIVRE à la fermeture du terminal", "À l'éditer", "À le rendre exécutable"], a: 1, exp: "nohup = no hangup : la tâche continue après déconnexion." },
    { type: "qcm", q: "<code>fg %1</code> fait…", opts: ["Tue la tâche 1", "Ramène la tâche n°1 au PREMIER plan", "La lance en fond", "Rien"], a: 1, exp: "fg = foreground ; bg = background." }
  ],
  final: {
    title: "Exercice final — Dompter un programme récalcitrant",
    intro: `<p>Un script <code>calcul.py</code> tourne et sature le processeur. Aurélia doit l'identifier puis l'arrêter proprement.</p>`,
    questions: [
      { type: "qcm", q: "Trouver le processus et son PID :", opts: ["ps aux | grep calcul.py", "kill calcul.py", "jobs", "top -1"], a: 0, exp: "ps aux | grep localise le processus et affiche son PID." },
      { type: "qcm", q: "Voir en direct s'il consomme vraiment tout le CPU :", opts: ["top (ou htop)", "ls", "cat", "jobs"], a: 0, exp: "top montre la consommation en temps réel." },
      { type: "input", q: "Supposons son PID = 4521. L'arrêter POLIMENT : … 4521", a: ["kill", "kill 4521"], ph: "une commande", exp: "kill 4521 envoie TERM : arrêt propre." },
      { type: "qcm", q: "S'il reste figé et ignore l'arrêt poli, que faire ?", opts: ["kill -9 4521 (arrêt forcé, dernier recours)", "Redémarrer la machine", "rm calcul.py", "Attendre indéfiniment"], a: 0, exp: "kill -9 force l'arrêt quand TERM est ignoré." },
      { type: "vf", q: "Il vaut mieux essayer <code>kill</code> (TERM) avant <code>kill -9</code> (KILL).", a: true, exp: "TERM laisse le programme se fermer proprement ; -9 est le dernier recours." }
    ],
    solution: `<pre class="pseudo">ps aux | grep calcul.py   → repérer le processus + PID (ex. 4521)
top                       → confirmer la consommation CPU (q pour sortir)
kill 4521                 → arrêt poli (TERM)
kill -9 4521              → arrêt forcé SEULEMENT s'il reste figé

Ordre : identifier (ps/grep) → observer (top) → arrêter (kill, puis -9 si besoin).</pre>
<p>Tu contrôles ce qui tourne. Demain : les liens durs et symboliques.</p>`
  }
};
