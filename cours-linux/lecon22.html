  title: "Premier script Bash",
  subtitle: "Enregistrer une suite de commandes réutilisable.",
  theory: `
<h3>1. Qu'est-ce qu'un script ?</h3>
<p>Un <strong>script</strong> est un simple fichier texte qui contient des commandes, exécutées de haut en bas comme si tu les tapais toi-même. Au lieu de retaper dix commandes chaque jour, tu les écris une fois dans un fichier et tu le lances d'un mot. C'est le pont entre « utiliser Linux » et « automatiser Linux ».</p>

<h3>2. Le shebang : la première ligne magique</h3>
<pre class="pseudo">#!/bin/bash
echo "Bonjour, le script fonctionne !"</pre>
<p>La toute première ligne <code>#!/bin/bash</code> s'appelle le <strong>shebang</strong>. Elle indique au système <strong>quel programme</strong> doit interpréter le fichier — ici Bash. Sans elle, le système ne saurait pas que c'est un script Bash.</p>
<div class="tip">Le <code>#</code> introduit un <strong>commentaire</strong> (ligne ignorée par Bash), sauf dans la combinaison spéciale <code>#!</code> de la première ligne. Commente tes scripts : ton « toi » de dans six mois te remerciera.</div>

<h3>3. Créer et lancer un script, étape par étape</h3>
<pre class="pseudo"># 1. Créer le fichier (avec un éditeur : nano, vim… ou touch puis édition)
nano bonjour.sh
# (on y écrit les deux lignes ci-dessus, puis on enregistre)

# 2. Le rendre EXÉCUTABLE (leçon 16 !)
chmod +x bonjour.sh

# 3. Le lancer
./bonjour.sh          # le ./ dit « le script est ICI, dans le dossier courant »</pre>
<div class="warn">Pourquoi <code>./bonjour.sh</code> et pas seulement <code>bonjour.sh</code> ? Par sécurité, le shell ne cherche pas les programmes dans le dossier courant. Le <code>./</code> précise explicitement « exécute le fichier situé ici ». Sans lui : « command not found ».</div>

<h3>4. Deux façons de lancer</h3>
<pre class="pseudo">./bonjour.sh          # exige le droit +x (le shebang choisit l'interpréteur)
bash bonjour.sh       # lance via bash directement : pas besoin de +x ni de shebang</pre>
<p>La forme <code>bash script.sh</code> est pratique pour tester rapidement ; la forme <code>./script.sh</code> (avec <code>+x</code>) est celle d'un « vrai » programme qu'on installe et réutilise.</p>

<h3>5. Un script un peu plus complet</h3>
<pre class="pseudo">#!/bin/bash
# sauvegarde-simple.sh — annonce et prépare une sauvegarde

echo "=== Début de la sauvegarde ==="   # message à l'utilisateur
mkdir -p ~/sauvegardes                    # crée le dossier si absent (leçon 4)
cp ~/notes.txt ~/sauvegardes/             # copie le fichier
echo "Sauvegarde terminée dans ~/sauvegardes"
exit 0                                     # se termine avec le code 0 = SUCCÈS</pre>
<p>Chaque ligne est une commande déjà connue : un script n'invente rien, il <strong>enchaîne</strong> ce que tu sais déjà faire.</p>

<h3>6. Le code de sortie</h3>
<pre class="pseudo">exit 0     # 0 = tout s'est bien passé (succès)
exit 1     # un nombre différent de 0 = une erreur (l'usage : 1, 2… selon le problème)</pre>
<p>Tout programme rend en fin de course un <strong>code de sortie</strong> : <code>0</code> pour « succès », autre chose pour « erreur ». On l'exploitera dans les conditions (leçon 24) via la variable <code>$?</code>.</p>
<div class="tip">Convention : donne à tes scripts un nom clair terminé par <code>.sh</code> (facultatif mais lisible), place-les dans un dossier à toi, et rends-les exécutables une bonne fois avec <code>chmod +x</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Un script Bash, c'est…", opts: ["Un programme compilé", "Un fichier texte contenant des commandes exécutées de haut en bas", "Une image système", "Un processus"], a: 1, exp: "Une suite de commandes enregistrée dans un fichier." },
    { type: "qcm", q: "Que fait la première ligne <code>#!/bin/bash</code> ?", opts: ["Un commentaire ordinaire", "Le shebang : indique l'interpréteur (Bash) du script", "Rien", "Elle lance le script"], a: 1, exp: "Le shebang désigne le programme qui exécute le fichier." },
    { type: "input", q: "Quel caractère introduit un commentaire en Bash ?", a: "#", ph: "un caractère", exp: "# = commentaire (sauf dans #! en 1re ligne)." },

    { type: "qcm", q: "Où placer le shebang ?", opts: ["N'importe où", "Obligatoirement sur la TOUTE PREMIÈRE ligne", "À la fin", "Dans un commentaire au milieu"], a: 1, exp: "Le #! n'est reconnu qu'en première ligne." },
    { type: "vf", q: "Un script n'invente pas de nouvelles commandes : il enchaîne celles que tu connais déjà.", a: true, exp: "echo, mkdir, cp… : le script les automatise." },
    { type: "qcm", q: "Que fait <code>mkdir -p ~/sauvegardes</code> dans un script ?", opts: ["Supprime le dossier", "Crée le dossier s'il n'existe pas (sans erreur s'il existe déjà)", "Le liste", "Le déplace"], a: 0, exp: "-p évite l'erreur si le dossier existe déjà : idéal en script." },
    { type: "input", q: "Quelle instruction termine un script avec un code de succès ?", a: ["exit 0", "exit0"], ph: "exit …", exp: "exit 0." },
    { type: "qcm", q: "Le <code>#</code> de la ligne <code>#!/bin/bash</code> est-il un commentaire ?", opts: ["Oui, ignoré", "Non : #! en 1re ligne est le shebang, un cas spécial", "C'est une erreur", "Ça dépend"], a: 1, exp: "#! en tête n'est pas un commentaire ordinaire." },
    { type: "vf", q: "On peut tester un script rapidement avec <code>bash script.sh</code> sans l'avoir rendu exécutable.", a: true, exp: "bash lit le fichier directement ; +x n'est requis que pour ./script.sh." },
    { type: "qcm", q: "Bonne pratique pour un script réutilisable :", opts: ["Le laisser sans nom", "Nom clair en .sh, dans un dossier à soi, rendu exécutable une fois", "chmod 777", "Le mettre dans /bin"], a: 1, exp: "Clarté + emplacement + +x = script propre." }
  ],
  final: {
    title: "Exercice final — Ton tout premier script",
    intro: `<p>Aurélia écrit ce fichier <code>infos.sh</code> :</p>
<pre class="pseudo">#!/bin/bash
# infos.sh — affiche quelques informations
echo "Utilisateur :"
whoami
echo "Dossier courant :"
pwd
exit 0</pre>`,
    questions: [
      { type: "input", q: "Après avoir écrit le fichier, quelle commande le rend exécutable ? chmod … infos.sh", a: ["+x", "u+x"], ph: "chmod …", exp: "chmod +x infos.sh." },
      { type: "qcm", q: "Comment le lancer une fois rendu exécutable ?", opts: ["infos.sh", "./infos.sh", "run infos.sh", "exec"], a: 1, exp: "./infos.sh depuis le dossier où il se trouve." },
      { type: "qcm", q: "Que fait la 2e ligne <code># infos.sh — affiche...</code> ?", opts: ["Elle s'exécute", "C'est un COMMENTAIRE, ignoré par Bash", "Un second shebang", "Une erreur"], a: 1, exp: "# = commentaire (sauf le #! de la 1re ligne)." },
      { type: "qcm", q: "Qu'affiche le script, dans l'ordre ?", opts: ["Rien", "« Utilisateur : » + ton nom, puis « Dossier courant : » + le chemin", "Seulement le nom", "Une erreur"], a: 1, exp: "Les echo et les commandes s'exécutent de haut en bas." },
      { type: "qcm", q: "À quoi sert la dernière ligne <code>exit 0</code> ?", opts: ["À supprimer le script", "À terminer en signalant un SUCCÈS", "À relancer", "À rien du tout"], a: 1, exp: "exit 0 = fin normale, code succès." }
    ],
    solution: `<pre class="pseudo">chmod +x infos.sh     → rendre exécutable
./infos.sh            → lancer (le ./ = « ici »)

Sortie :
  Utilisateur :
  aurelia
  Dossier courant :
  /home/aurelia

Shebang (#!/bin/bash) + commandes + exit 0 = un script complet.</pre>
<p>Ton premier script tourne ! Demain : lui donner de la souplesse avec des variables et des paramètres.</p>`
  }
};
