  title: "Installer des logiciels : apt",
  subtitle: "Le gestionnaire de paquets de Debian/Ubuntu.",
  theory: `
<h3>1. Paquets et dépôts : la logithèque de Linux</h3>
<p>Sous Windows on télécharge des installeurs un peu partout ; sous Linux, on installe des <strong>paquets</strong> depuis des <strong>dépôts</strong> (repositories) officiels, centralisés et signés. Un <strong>gestionnaire de paquets</strong> s'occupe de tout : téléchargement, installation, <strong>dépendances</strong> et mises à jour. Sur Debian/Ubuntu, c'est <code>apt</code>.</p>
<div class="tip">Avantage énorme : une seule commande met à jour TOUS tes logiciels d'un coup, et les <strong>dépendances</strong> (les bibliothèques dont un programme a besoin) sont gérées automatiquement. Plus de chasse aux installeurs.</div>

<h3>2. Toujours commencer par update</h3>
<pre class="pseudo">sudo apt update      # met à jour la LISTE des paquets disponibles (pas les logiciels eux-mêmes !)
sudo apt upgrade     # installe les nouvelles versions des paquets déjà présents</pre>
<div class="warn">Ne confonds pas : <code>apt update</code> rafraîchit le <strong>catalogue</strong> (ce qui existe et en quelle version) ; <code>apt upgrade</code> applique réellement les <strong>mises à jour</strong>. On fait presque toujours <code>update</code> AVANT <code>install</code> ou <code>upgrade</code>, pour partir d'un catalogue à jour.</div>

<h3>3. Installer, supprimer</h3>
<pre class="pseudo">sudo apt install htop         # installe le paquet htop (et ses dépendances)
sudo apt install htop tree    # plusieurs paquets d'un coup
sudo apt remove htop          # désinstalle htop (garde ses fichiers de configuration)
sudo apt purge htop           # désinstalle ET supprime la configuration
sudo apt autoremove           # retire les dépendances devenues inutiles (ménage)</pre>
<p>Toutes ces opérations modifient le système : elles exigent <code>sudo</code> (leçon 17). La <em>recherche</em>, en revanche, ne demande aucun privilège.</p>

<h3>4. Chercher et se renseigner (sans sudo)</h3>
<pre class="pseudo">apt search éditeur       # cherche des paquets par mot-clé
apt show htop            # fiche détaillée d'un paquet (description, version, taille, dépendances)
apt list --installed     # liste tout ce qui est installé
apt list --upgradable    # ce qui pourrait être mis à jour</pre>

<h3>5. Sous le capot : dpkg</h3>
<p><code>apt</code> s'appuie sur un outil plus bas niveau, <code>dpkg</code>, qui manipule directement les fichiers <code>.deb</code> (le format de paquet Debian) :</p>
<pre class="pseudo">dpkg -l              # lister les paquets installés (façon dpkg)
dpkg -L htop         # lister les FICHIERS qu'un paquet a posés sur le disque
sudo dpkg -i paquet.deb   # installer un .deb téléchargé à la main
# (mais dpkg ne gère PAS les dépendances : apt est presque toujours préférable)</pre>
<div class="tip">Règle simple : utilise <code>apt</code> pour tout au quotidien (il gère les dépendances) ; ne descends à <code>dpkg</code> que pour installer un <code>.deb</code> isolé récupéré hors dépôts, puis corrige d'éventuelles dépendances avec <code>sudo apt install -f</code>.</div>

<h3>6. La routine d'entretien</h3>
<pre class="pseudo">sudo apt update &amp;&amp; sudo apt upgrade    # mettre le système à jour (le duo classique)
sudo apt autoremove                     # nettoyer les dépendances orphelines
# À faire régulièrement : un système à jour est un système plus sûr.</pre>
<p>Note : <code>apt</code> est la commande moderne et lisible ; tu croiseras aussi l'ancienne <code>apt-get</code> (plus verbeuse, dédiée aux scripts). Les deux coexistent ; pour un usage interactif, préfère <code>apt</code>.</p>`,

    { type: "qcm", q: "Sous Ubuntu/Debian, comment installe-t-on normalement un logiciel ?", opts: ["En téléchargeant un .exe", "Via un gestionnaire de paquets (apt) depuis des dépôts officiels", "En copiant des fichiers au hasard", "C'est impossible"], a: 1, exp: "apt installe depuis les dépôts, dépendances comprises." },
    { type: "qcm", q: "Que fait <code>sudo apt update</code> ?", opts: ["Installe les nouvelles versions des logiciels", "Met à jour la LISTE des paquets disponibles (le catalogue)", "Supprime les paquets inutiles", "Redémarre le système"], a: 1, exp: "update rafraîchit le catalogue, pas les logiciels." },
    { type: "qcm", q: "Que fait <code>sudo apt upgrade</code> ?", opts: ["Rafraîchit le catalogue", "Installe les nouvelles versions des paquets déjà présents", "Cherche un paquet", "Liste les fichiers"], a: 1, exp: "upgrade applique réellement les mises à jour." },

    { type: "qcm", q: "Différence entre <code>apt remove</code> et <code>apt purge</code> ?", opts: ["Aucune", "purge supprime AUSSI les fichiers de configuration", "remove est plus violent", "purge garde tout"], a: 1, exp: "remove garde la config ; purge fait table rase." },
    { type: "qcm", q: "À quoi sert <code>sudo apt autoremove</code> ?", opts: ["À tout réinstaller", "À retirer les dépendances devenues inutiles (ménage)", "À chercher un paquet", "À mettre à jour"], a: 1, exp: "autoremove nettoie les dépendances orphelines." },

    { type: "input", q: "Quelle commande affiche la fiche détaillée du paquet htop ?", a: ["apt show htop", "apt show"], ph: "apt …", exp: "apt show htop : version, taille, dépendances…" },
    { type: "qcm", q: "Qu'est-ce qu'une « dépendance » ?", opts: ["Un bug", "Un autre paquet dont un logiciel a besoin pour fonctionner", "Un utilisateur", "Un dossier"], a: 1, exp: "apt installe automatiquement les dépendances nécessaires." },
    { type: "qcm", q: "<code>dpkg -L htop</code> affiche…", opts: ["La version", "La LISTE des fichiers installés par le paquet htop", "Les dépendances", "Le catalogue"], a: 1, exp: "dpkg -L liste les fichiers posés par un paquet." },
    { type: "qcm", q: "Pour installer un fichier <code>.deb</code> téléchargé à la main :", opts: ["apt search", "sudo dpkg -i paquet.deb", "apt update", "rm paquet.deb"], a: 1, exp: "dpkg -i installe un .deb local (dépendances à corriger ensuite)." },
    { type: "qcm", q: "Principal inconvénient de <code>dpkg -i</code> par rapport à apt ?", opts: ["Il est plus lent", "dpkg ne gère PAS les dépendances automatiquement", "Il supprime le système", "Aucun"], a: 1, exp: "apt résout les dépendances ; dpkg non." },
    { type: "qcm", q: "Le duo d'entretien classique du système est :", opts: ["apt remove && apt purge", "sudo apt update && sudo apt upgrade", "dpkg -l && dpkg -L", "apt search && apt show"], a: 1, exp: "update (catalogue) puis upgrade (mises à jour)." },
    { type: "vf", q: "Installer, supprimer ou mettre à jour des paquets nécessite les droits d'administration (sudo).", a: true, exp: "Ces actions modifient le système : sudo requis. La recherche, non." }
  ],
  final: {
    title: "Exercice final — Installer et entretenir",

    questions: [

      { type: "input", q: "Installer le paquet tree : sudo apt … tree", a: "install", ph: "un mot", exp: "sudo apt install tree." },
      { type: "qcm", q: "Voir la fiche du paquet (version, description) sans l'installer :", opts: ["apt show tree", "sudo apt install tree", "dpkg -i tree", "apt remove tree"], a: 0, exp: "apt show tree, sans sudo." },
      { type: "qcm", q: "Mettre à jour tous les logiciels déjà installés :", opts: ["sudo apt upgrade", "apt search", "apt list", "dpkg -L"], a: 0, exp: "apt upgrade applique les mises à jour." },
      { type: "qcm", q: "Nettoyer les dépendances devenues inutiles :", opts: ["sudo apt autoremove", "apt show", "dpkg -i", "apt search"], a: 0, exp: "autoremove retire les paquets orphelins." }
    ],
    solution: `<pre class="pseudo">sudo apt update            → rafraîchir le catalogue
sudo apt install tree      → installer (dépendances gérées)
apt show tree              → sa fiche (sans sudo)
sudo apt upgrade           → mettre à jour l'existant
sudo apt autoremove        → nettoyer les orphelins

apt = quotidien (gère les dépendances) ; dpkg = bas niveau (.deb isolés).</pre>
<p>Tu installes et entretiens ta machine. Demain : les services et les journaux avec systemd.</p>`
