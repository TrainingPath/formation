<script>
var DAY = {
  num: 24,
  title: "Conditions et code de retour",
  subtitle: "Faire réagir un script selon les situations.",
  theory: `
<h3>1. La structure if</h3>
<pre class="pseudo">if [ condition ]           # le test est entre crochets, entourés d'ESPACES
then
    echo "condition vraie"
else
    echo "condition fausse"
fi                         # fi = « if » à l'envers : ferme le bloc</pre>
<div class="warn">Piège classique : les espaces autour des crochets sont OBLIGATOIRES. <code>[ "$x" = "5" ]</code> fonctionne ; <code>["$x"="5"]</code> échoue. Le <code>[</code> est en réalité une commande : il lui faut des arguments séparés par des espaces.</div>

<h3>2. Le code de retour, moteur des conditions</h3>
<p>Chaque commande renvoie un <strong>code de sortie</strong> : <code>0</code> = succès, autre = échec (leçon 22). La variable <code>$?</code> contient le code de la DERNIÈRE commande. <code>if</code> exécute le bloc <code>then</code> quand la commande testée renvoie 0.</p>
<pre class="pseudo">grep "erreur" journal.txt
echo "$?"    # 0 si « erreur » a été trouvé, 1 sinon

if grep -q "erreur" journal.txt   # -q = silencieux : on ne veut que le code de retour
then
    echo "Des erreurs sont présentes"
fi</pre>

<h3>3. Comparer des nombres</h3>
<pre class="pseudo">[ "$a" -eq "$b" ]   # -eq : égal        (EQual)
[ "$a" -ne "$b" ]   # -ne : différent   (Not Equal)
[ "$a" -lt "$b" ]   # -lt : &lt; (Less Than)
[ "$a" -le "$b" ]   # -le : &lt;= (Less or Equal)
[ "$a" -gt "$b" ]   # -gt : &gt; (Greater Than)
[ "$a" -ge "$b" ]   # -ge : &gt;= (Greater or Equal)</pre>

<h3>4. Comparer du texte et tester le vide</h3>
<pre class="pseudo">[ "$nom" = "Ana" ]    # égalité de CHAÎNES (un seul =)
[ "$nom" != "Ana" ]   # différent
[ -z "$nom" ]         # -z : la chaîne est VIDE (Zero length)
[ -n "$nom" ]         # -n : la chaîne est NON vide</pre>
<div class="tip">Pour les nombres on utilise <code>-eq -lt -gt</code>… ; pour le texte, <code>=</code> et <code>!=</code>. Ne les mélange pas : <code>[ "$a" = "5" ]</code> compare des chaînes, <code>[ "$a" -eq 5 ]</code> compare des nombres.</div>

<h3>5. Tester des fichiers (très utile en script)</h3>
<pre class="pseudo">[ -e chemin ]   # -e : le fichier/dossier EXISTE
[ -f chemin ]   # -f : c'est un FICHIER ordinaire
[ -d chemin ]   # -d : c'est un DOSSIER
[ -r chemin ]   # -r : lisible     -w : modifiable     -x : exécutable</pre>
<pre class="pseudo">if [ -f "config.txt" ]
then
    echo "Le fichier existe, on le lit"
else
    echo "Fichier absent, on crée une config par défaut"
fi</pre>

<h3>6. elif, et les enchaînements && ||</h3>
<pre class="pseudo">if [ "$note" -ge 16 ]; then
    echo "Très bien"
elif [ "$note" -ge 10 ]; then     # elif = « sinon, si… »
    echo "Admis"
else
    echo "À revoir"
fi</pre>
<pre class="pseudo"># Raccourcis logiques (sans if) :
mkdir dossier && cd dossier      # && : fait la 2e commande SEULEMENT si la 1re réussit
cat f.txt || echo "lecture impossible"   # || : fait la 2e SEULEMENT si la 1re échoue</pre>
<div class="tip">Le <code>;</code> permet d'écrire <code>then</code> sur la même ligne : <code>if [ … ]; then</code>. Les opérateurs <code>&amp;&amp;</code> (et) et <code>||</code> (ou) enchaînent des commandes selon leur succès — un « if » ultra-compact que tu croiseras partout.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qui ferme un bloc <code>if</code> en Bash ?", opts: ["end", "fi", "endif", "}"], a: 1, exp: "fi = if écrit à l'envers." },
    { type: "qcm", q: "Pourquoi les espaces dans <code>[ \"$x\" = \"5\" ]</code> sont-ils obligatoires ?", opts: ["Pour la lisibilité", "Parce que [ est une commande : ses arguments doivent être séparés par des espaces", "Ce n'est pas obligatoire", "Pour aller plus vite"], a: 1, exp: "[ attend des arguments espacés ; sans espaces, erreur." },
    { type: "input", q: "Quelle variable contient le code de retour de la dernière commande ?", a: ["$?", "?"], ph: "$…", exp: "$? = code de sortie précédent." },
    { type: "qcm", q: "<code>if</code> exécute le bloc <code>then</code> quand la commande testée renvoie…", opts: ["1", "0 (succès)", "n'importe quoi", "-1"], a: 1, exp: "Code 0 = succès = condition « vraie » pour if." },
    { type: "qcm", q: "Pour tester l'égalité de deux NOMBRES, on utilise…", opts: ["=", "-eq", "==", "eq"], a: 1, exp: "-eq pour les nombres ; = pour les chaînes." },
    { type: "qcm", q: "<code>[ \"$a\" -lt \"$b\" ]</code> est vrai si…", opts: ["a &gt; b", "a &lt; b (less than)", "a = b", "a est vide"], a: 1, exp: "-lt = strictement inférieur." },
    { type: "qcm", q: "Pour comparer deux CHAÎNES égales, on écrit…", opts: ["[ \"$x\" -eq \"y\" ]", "[ \"$x\" = \"y\" ]", "[ $x == ]", "[ eq ]"], a: 1, exp: "= compare des chaînes ; -eq compare des nombres." },
    { type: "qcm", q: "<code>[ -z \"$nom\" ]</code> est vrai si…", opts: ["nom vaut zéro", "la chaîne nom est VIDE", "nom existe", "nom est un nombre"], a: 1, exp: "-z = zero length : chaîne vide." },
    { type: "qcm", q: "<code>[ -f \"config.txt\" ]</code> teste si…", opts: ["config.txt est un dossier", "config.txt est un FICHIER ordinaire existant", "config.txt est vide", "config.txt est exécutable"], a: 1, exp: "-f = fichier régulier." },
    { type: "qcm", q: "Quel test vérifie qu'un DOSSIER existe ?", opts: ["[ -f d ]", "[ -d d ]", "[ -z d ]", "[ -x d ]"], a: 1, exp: "-d = directory." },
    { type: "input", q: "Quel mot-clé signifie « sinon, si… » et permet d'enchaîner plusieurs tests ?", a: "elif", ph: "un mot-clé", exp: "elif = else if." },
    { type: "qcm", q: "<code>mkdir d && cd d</code> fait cd…", opts: ["Toujours", "SEULEMENT si mkdir a réussi", "Jamais", "Avant mkdir"], a: 1, exp: "&amp;&amp; enchaîne si la 1re commande réussit (code 0)." },
    { type: "qcm", q: "<code>cat f || echo \"échec\"</code> affiche « échec »…", opts: ["Toujours", "SEULEMENT si cat échoue", "Jamais", "Avant cat"], a: 1, exp: "|| exécute la 2e commande si la 1re échoue." },
    { type: "qcm", q: "À quoi sert <code>grep -q</code> dans une condition ?", opts: ["À afficher plus", "À rester SILENCIEUX : on ne veut que le code de retour (trouvé ou non)", "À compter", "À trier"], a: 1, exp: "-q = quiet : parfait pour un if." },
    { type: "vf", q: "Pour les nombres on utilise -eq/-lt/-gt, pour le texte = et !=.", a: true, exp: "Deux familles d'opérateurs à ne pas mélanger." }
  ],
  final: {
    title: "Exercice final — Un script qui vérifie avant d'agir",
    intro: `<p>Aurélia écrit <code>verifie.sh</code> :</p>
<pre class="pseudo">#!/bin/bash
fichier="$1"
if [ -z "$fichier" ]; then
    echo "Usage : ./verifie.sh &lt;nom_de_fichier&gt;"
    exit 1
fi
if [ -f "$fichier" ]; then
    lignes=$(wc -l &lt; "$fichier")
    echo "$fichier existe et contient $lignes lignes."
else
    echo "$fichier n'existe pas."
    exit 1
fi</pre>`,
    questions: [
      { type: "qcm", q: "Que teste <code>[ -z \"$fichier\" ]</code> au début ?", opts: ["Si le fichier existe", "Si AUCUN argument n'a été fourni (chaîne vide)", "Si le fichier est un dossier", "Si on est root"], a: 1, exp: "-z vrai = pas d'argument : on affiche l'usage et on sort." },
      { type: "qcm", q: "Pourquoi <code>exit 1</code> dans les cas d'erreur ?", opts: ["Pour signaler un SUCCÈS", "Pour signaler une ERREUR (code non nul)", "Pour relancer", "Par décoration"], a: 1, exp: "exit 1 = fin en erreur." },
      { type: "qcm", q: "Que teste ensuite <code>[ -f \"$fichier\" ]</code> ?", opts: ["Si c'est un dossier", "Si le fichier ordinaire existe", "Si le fichier est vide", "Si on peut l'exécuter"], a: 1, exp: "-f = fichier régulier existant." },
      { type: "input", q: "Si on lance <code>./verifie.sh</code> SANS argument, quel code de sortie ? (le nombre)", a: "1", ph: "un nombre", exp: "La 1re condition (-z vrai) déclenche exit 1." },
      { type: "qcm", q: "Si <code>notes.txt</code> existe avec 8 lignes, qu'affiche le script pour <code>./verifie.sh notes.txt</code> ?", opts: ["Une erreur", "« notes.txt existe et contient 8 lignes. »", "Rien", "Usage : ..."], a: 1, exp: "Le fichier existe : la branche -f affiche le compte de lignes." }
    ],
    solution: `<pre class="pseudo">Sans argument   → [ -z "$fichier" ] vrai → message d'usage + exit 1
Fichier absent  → [ -f "$fichier" ] faux → « n'existe pas » + exit 1
Fichier présent → wc -l < fichier → « … contient N lignes. »

Ingrédients : if/elif/else/fi · tests -z/-f · code de sortie $? · exit 1.
Un bon script VÉRIFIE avant d'agir.</pre>
<p>Ton script réagit intelligemment. Demain : les boucles, pour répéter une action.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  "items": [
    {
      "id": "lnx-l24",
      "title": "Le contrôleur de note",
      "level": 2,
      "statement": "Écris un script <code>note.sh</code> qui : (1) récupère une note dans le 1er argument ; (2) si aucun argument n'est fourni, affiche un message d'usage et sort en erreur ; (3) sinon, affiche « Très bien » si la note ≥ 16, « Admis » si elle est ≥ 10, sinon « À revoir ». Utilise if / elif / else et les bons opérateurs numériques.",
      "hints": [
        "Récupérer la note : note=\"$1\". Tester l'absence d'argument : if [ -z \"$note\" ]; then ... exit 1; fi.",
        "Comparaisons numériques : -ge pour « supérieur ou égal ». N'oublie pas les espaces dans les crochets.",
        "Structure : if [ \"$note\" -ge 16 ]; then ... elif [ \"$note\" -ge 10 ]; then ... else ... fi."
      ],
      "solution": "#!/bin/bash\n# note.sh — apprécie une note passée en argument\n\nnote=\"$1\"\n\nif [ -z \"$note\" ]; then                 # aucun argument fourni ?\n    echo \"Usage : ./note.sh <note>\"\n    exit 1\nfi\n\nif [ \"$note\" -ge 16 ]; then             # note >= 16\n    echo \"Très bien\"\nelif [ \"$note\" -ge 10 ]; then           # sinon, note >= 10\n    echo \"Admis\"\nelse                                    # sinon\n    echo \"À revoir\"\nfi\nexit 0",

      "atoi": {
        "cmd": "./note.sh 17\n./note.sh 12\n./note.sh 6\n./note.sh",
        "expected": "Très bien\nAdmis\nÀ revoir\nUsage : ./note.sh <note>\n(sans argument, le script affiche l'usage et sort en erreur)"
      },
      "checklist": [

        "[ -z \"$note\" ] détecte l'absence d'argument (puis exit 1).",
        "Tests du plus exigeant au moins exigeant : -ge 16 avant -ge 10.",
        "Espaces obligatoires dans [ … ] ; -ge compare des nombres."
      ]
    }
  ]
};
