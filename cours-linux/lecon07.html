var DAY = {
  num: 7,
  title: "Récap et mini-projet : arborescence",
  subtitle: "Assembler les briques de la semaine 1.",
  theory: `
<h3>1. La boîte à outils de la semaine 1</h3>
<pre class="pseudo"># SE REPÉRER
pwd            # où suis-je ?
ls  -l -a -lh  # que contient ce dossier ? (long, cachés, tailles lisibles)
cd  ..  ~  -   # se déplacer (parent, maison, dossier précédent)

# CRÉER
mkdir -p a/b/c # créer des dossiers (avec les parents)
touch f.txt    # créer un fichier vide

# DUPLIQUER / DÉPLACER
cp -r src dst  # copier (récursif pour un dossier)
mv src dst     # déplacer OU renommer

# SUPPRIMER (définitif !)
rm f.txt       # supprimer un fichier
rm -r dossier  # supprimer un dossier et son contenu
rmdir vide     # supprimer un dossier vide

# LIRE
cat  less  head  tail  wc -l  file

# COMPRENDRE
man  --help  apropos  which  type</pre>

<h3>2. Les trois idées à ne jamais oublier</h3>
<pre class="pseudo"># 1. Chemin ABSOLU (/home/toi/x) = universel ; RELATIF (x, ../x) = dépend d'où tu es.
# 2. rm ne pardonne pas : pas de corbeille. Vérifie avec ls avant/après.
# 3. Tab complète, man/--help expliquent : tu peux te débrouiller seul.</pre>
<div class="tip">Le terminal n'est pas une suite de commandes à mémoriser par cœur, mais une petite <strong>grammaire</strong> : un verbe (la commande), des adverbes (les options), des compléments (les arguments). Une fois la grammaire comprise, tu combines librement.</div>

<h3>3. Le mini-projet du jour</h3>
<p>Objectif : construire, en partant de ton dossier personnel, l'arborescence d'un petit site, y déposer des fichiers, réorganiser, puis vérifier — uniquement au clavier.</p>
<pre class="pseudo">monsite/
├── pages/
│   ├── accueil.txt
│   └── contact.txt
├── images/
└── archives/</pre>
<pre class="pseudo"># 1. Créer la structure de dossiers en une commande
mkdir -p monsite/pages monsite/images monsite/archives

# 2. Créer les deux pages
touch monsite/pages/accueil.txt monsite/pages/contact.txt

# 3. Vérifier l'arborescence complète
ls -R monsite            # -R = récursif : montre tout l'arbre

# 4. Faire une copie de sauvegarde d'une page dans archives/
cp monsite/pages/accueil.txt monsite/archives/accueil_sauvegarde.txt

# 5. Renommer contact.txt en apropos.txt
mv monsite/pages/contact.txt monsite/pages/apropos.txt

# 6. Compter combien de fichiers/dossiers on a créés
ls -R monsite | wc -l    # (aperçu ; les tubes seront vus en leçon 9)</pre>
<div class="warn">Avant tout <code>rm</code> ou <code>mv</code>, relis le chemin. La touche Tab t'aide à ne pas viser le mauvais fichier. C'est en semaine 1 qu'on prend les bons réflexes.</div>

<h3>4. Et après ?</h3>
<p>Tu sais désormais te repérer, créer, ranger, lire et t'informer. La semaine 2 va donner de la <strong>puissance</strong> à ces bases : rediriger la sortie des commandes vers des fichiers, les enchaîner avec des tubes, et filtrer le texte avec <code>grep</code>, <code>sort</code>, <code>sed</code>, <code>awk</code>.</p>`,
  exercises: [
    { type: "input", q: "Une seule commande pour créer d'un coup les dossiers monsite/pages et monsite/images : commence par…", a: ["mkdir -p", "mkdir"], ph: "mkdir …", exp: "mkdir -p monsite/pages monsite/images." },
    { type: "qcm", q: "Quelle option de ls affiche TOUTE l'arborescence (sous-dossiers inclus) ?", opts: ["-l", "-a", "-R", "-h"], a: 2, exp: "-R = récursif : descend dans les sous-dossiers." },
    { type: "input", q: "Quelle commande crée en une fois deux fichiers vides a.txt et b.txt ?", a: "touch a.txt b.txt", ph: "une commande", exp: "touch accepte plusieurs noms." },
    { type: "qcm", q: "Pour copier le DOSSIER images vers images_backup :", opts: ["cp images images_backup", "cp -r images images_backup", "mv images images_backup", "touch"], a: 1, exp: "Un dossier exige la copie récursive -r." },
    { type: "qcm", q: "Renommer accueil.txt en index.txt se fait avec…", opts: ["cp", "mv accueil.txt index.txt", "rm", "touch"], a: 1, exp: "mv sert aussi à renommer." },
    { type: "qcm", q: "Tu tapes <code>cd Images</code> et obtiens « No such file or directory ». Le meilleur réflexe ?", opts: ["Réinstaller", "pwd puis ls pour voir où tu es et ce qui existe", "rm -rf", "exit"], a: 1, exp: "pwd + ls te resituent : peut-être le dossier s'appelle images (minuscule)." },
    { type: "vf", q: "<code>rm -r monsite</code> supprime monsite et tout ce qu'il contient, sans corbeille.", a: true, exp: "Récursif et définitif : à relire avant de valider." },
    { type: "qcm", q: "<code>/home/aurelia/monsite/pages/accueil.txt</code> est un chemin…", opts: ["Relatif", "Absolu", "Caché", "Invalide"], a: 1, exp: "Il part de / : absolu." },
    { type: "input", q: "Quelle commande compte le nombre de lignes du fichier accueil.txt ?", a: ["wc -l accueil.txt", "wc -l"], ph: "wc …", exp: "wc -l accueil.txt." },
    { type: "qcm", q: "Pour lire un gros fichier de log page par page :", opts: ["cat", "less (q pour sortir)", "touch", "rm"], a: 1, exp: "less pour naviguer confortablement." },
    { type: "qcm", q: "Tu ne sais plus quelle option de cp copie un dossier. Que fais-tu en premier ?", opts: ["cp --help ou man cp", "Tu abandonnes", "rm cp", "reboot"], a: 0, exp: "L'aide locale répond tout de suite (-r / -R)." },
    { type: "qcm", q: "<code>mkdir a/b/c</code> échoue si a n'existe pas. La solution ?", opts: ["Ajouter -r", "Ajouter -p (mkdir -p a/b/c)", "Utiliser touch", "Utiliser cd"], a: 1, exp: "-p crée tous les parents manquants." },
    { type: "vf", q: "Un chemin relatif comme <code>../images</code> donne toujours le même dossier, où qu'on soit.", a: false, exp: "Non : le relatif dépend du dossier courant." },
    { type: "input", q: "Quelle commande te ramène à ton dossier personnel, sans argument ?", a: "cd", ph: "une commande", exp: "cd seul = retour maison." },
    { type: "qcm", q: "La « grammaire » d'une commande, c'est…", opts: ["commande / option(s) / argument(s)", "argument / commande / option", "option / commande seulement", "il n'y a pas de règle"], a: 0, exp: "Nom d'abord, puis options (comment), puis arguments (sur quoi)." }
  ],
  final: {
    title: "Exercice final — Bâtir une arborescence de projet",
    intro: `<p>But : créer cette structure depuis ton dossier personnel, puis la réorganiser.</p>
<pre class="pseudo">tp/
├── code/
│   └── main.txt
└── docs/
    └── lisezmoi.txt</pre>`,
    questions: [
      { type: "input", q: "Une commande pour créer d'un coup tp/code et tp/docs. Commence par…", a: ["mkdir -p", "mkdir"], ph: "mkdir …", exp: "mkdir -p tp/code tp/docs." },
      { type: "input", q: "Créer le fichier vide main.txt dans tp/code : quelle commande ?", a: "touch tp/code/main.txt", ph: "une commande", exp: "touch tp/code/main.txt." },
      { type: "qcm", q: "Copier lisezmoi.txt de tp/docs vers tp/code :", opts: ["mv tp/docs/lisezmoi.txt tp/code/", "cp tp/docs/lisezmoi.txt tp/code/", "rm tp/docs/lisezmoi.txt", "touch"], a: 1, exp: "cp duplique (l'original reste dans docs)." },
      { type: "qcm", q: "Pour vérifier toute l'arborescence de tp d'un coup :", opts: ["ls tp", "ls -R tp", "cat tp", "cd tp"], a: 1, exp: "ls -R tp affiche récursivement tout l'arbre." },
      { type: "qcm", q: "Finalement, supprimer tout le dossier docs et son contenu :", opts: ["rmdir tp/docs", "rm -r tp/docs", "rm tp/docs", "mv tp/docs"], a: 1, exp: "docs contient un fichier : rmdir échouerait, il faut rm -r." }
    ],
    solution: `<pre class="pseudo">mkdir -p tp/code tp/docs                 # structure
touch tp/code/main.txt                   # fichier de code
touch tp/docs/lisezmoi.txt               # doc
cp tp/docs/lisezmoi.txt tp/code/         # copie (original conservé)
ls -R tp                                 # vérification récursive
rm -r tp/docs                            # suppression du dossier docs

Semaine 1 bouclée : repérage, création, copie, déplacement,
suppression, lecture et autonomie. Place à la puissance du texte !</pre>
<p>Bravo, la semaine 1 est complète. Demain (leçon 8) : rediriger la sortie des commandes vers des fichiers.</p>`
  }
};
</script>
