var DAY = {
  num: 15,
  title: "Utilisateurs et groupes",
  subtitle: "Qui est qui sur la machine.",
  theory: `
<h3>1. Linux est multi-utilisateurs</h3>
<p>Un système Linux peut être partagé par plusieurs personnes (et plusieurs services). Chacun est un <strong>utilisateur</strong>, identifié par un nom et un numéro unique, l'<strong>UID</strong> (User ID). Les utilisateurs sont rassemblés en <strong>groupes</strong>, identifiés par un <strong>GID</strong> (Group ID). Tout cela sert de fondation aux <strong>permissions</strong> (leçon 16).</p>
<pre class="pseudo">whoami        # mon nom d'utilisateur
id            # mon UID, mon groupe principal (GID) et tous mes groupes
groups        # la liste de mes groupes
who           # qui est connecté en ce moment sur la machine</pre>

<h3>2. root, le superutilisateur</h3>
<p>Un utilisateur est spécial : <strong>root</strong>, d'UID <strong>0</strong>. Il a <strong>tous les droits</strong> : lire, modifier, supprimer n'importe quoi, installer des logiciels, gérer les autres comptes. C'est l'administrateur absolu.</p>
<div class="warn">Avec root, aucune protection ne s'applique : une faute de frappe peut détruire le système. La règle est de <strong>ne jamais travailler en root au quotidien</strong>, mais d'emprunter ses pouvoirs ponctuellement avec <code>sudo</code> (leçon 17).</div>

<h3>3. Où sont stockés les comptes ?</h3>
<pre class="pseudo">cat /etc/passwd     # la liste des comptes (une ligne par utilisateur)
# aurelia:x:1000:1000:Aurelia:/home/aurelia:/bin/bash
#   │     │  │    │     │          │             └─ le shell de connexion
#   │     │  │    │     │          └─ le dossier personnel
#   │     │  │    │     └─ description (nom complet)
#   │     │  │    └─ GID (groupe principal)
#   │     │  └─ UID (identifiant numérique)
#   │     └─ x : le mot de passe est ailleurs (dans /etc/shadow, protégé)
#   └─ le nom d'utilisateur

cat /etc/group      # la liste des groupes
# Les mots de passe chiffrés sont dans /etc/shadow, lisible par root seulement.</pre>
<div class="tip">Les UID en dessous de 1000 sont en général réservés au système et à ses services ; les vrais comptes humains commencent habituellement à 1000. root, lui, est toujours à 0.</div>

<h3>4. Créer et gérer des comptes (réservé à root)</h3>
<pre class="pseudo">sudo adduser marc        # crée l'utilisateur marc (façon Debian/Ubuntu : interactif, crée /home/marc)
sudo useradd -m marc     # équivalent plus « bas niveau » ; -m crée le dossier personnel
sudo passwd marc         # définir (ou changer) le mot de passe de marc
passwd                   # (sans argument) changer SON PROPRE mot de passe
sudo deluser marc        # supprimer le compte marc</pre>

<h3>5. Les groupes : gérer les droits en équipe</h3>
<pre class="pseudo">sudo groupadd dev            # crée un groupe « dev »
sudo usermod -aG dev marc    # AJOUTE marc au groupe dev
#   -a = append (ajouter sans retirer des autres groupes) ; -G = groupes secondaires
groups marc                  # vérifier les groupes de marc</pre>
<div class="warn">N'oublie jamais le <code>-a</code> dans <code>usermod -aG</code> : sans lui, <code>usermod -G dev marc</code> REMPLACE tous les groupes secondaires de marc par le seul « dev ». On retire ainsi involontairement des accès (par ex. le groupe sudo).</div>

<h3>6. Changer d'identité</h3>
<pre class="pseudo">su marc          # « switch user » : devenir marc (demande son mot de passe)
su -             # devenir root avec son environnement complet (si root a un mot de passe)
sudo -i          # ouvrir un shell root via sudo (méthode recommandée sur Ubuntu)
exit             # revenir à son identité précédente</pre>
<p>Les groupes sont la clé du travail partagé : plutôt que de donner des droits à chaque personne, on donne des droits à un groupe, puis on y ajoute les personnes. C'est ce que la leçon suivante va exploiter avec <code>chmod</code> et <code>chown</code>.</p>`,
  exercises: [
    { type: "input", q: "Quelle commande affiche ton UID, ton GID et tes groupes ?", a: "id", ph: "une commande", exp: "id résume ton identité numérique et tes groupes." },
    { type: "qcm", q: "Quel est l'UID du superutilisateur root ?", opts: ["1", "1000", "0", "999"], a: 2, exp: "root a toujours l'UID 0." },

    { type: "input", q: "Quel fichier contient la liste des comptes (une ligne par utilisateur) ?", a: "/etc/passwd", ph: "un chemin", exp: "/etc/passwd : nom, UID, GID, home, shell…" },
    { type: "qcm", q: "Dans /etc/passwd, pourquoi voit-on un <code>x</code> à la place du mot de passe ?", opts: ["Le compte est bloqué", "Le mot de passe chiffré est ailleurs, dans /etc/shadow (protégé)", "Il n'y a pas de mot de passe", "C'est une erreur"], a: 1, exp: "Les mots de passe sont dans /etc/shadow, lisible par root seul." },
    { type: "qcm", q: "Où sont stockés les mots de passe chiffrés ?", opts: ["/etc/passwd", "/etc/shadow", "/home", "/etc/group"], a: 1, exp: "/etc/shadow, accessible à root uniquement." },
    { type: "qcm", q: "Créer un utilisateur nécessite…", opts: ["Rien de particulier", "Les droits d'administration (sudo/root)", "Un groupe vide", "Un redémarrage"], a: 1, exp: "La gestion des comptes est réservée à l'administrateur." },
    { type: "input", q: "Quelle commande change TON propre mot de passe (sans argument) ?", a: "passwd", ph: "une commande", exp: "passwd seul agit sur ton compte." },
    { type: "qcm", q: "<code>sudo usermod -aG dev marc</code> fait…", opts: ["Remplace tous les groupes de marc", "AJOUTE marc au groupe dev sans retirer les autres", "Supprime marc", "Crée le groupe dev"], a: 1, exp: "-a (append) + -G ajoute un groupe secondaire." },
    { type: "qcm", q: "Pourquoi le <code>-a</code> est-il crucial dans usermod -aG ?", opts: ["Il accélère", "Sans lui, -G REMPLACE tous les groupes secondaires (on perd des accès)", "Il n'a aucun effet", "Il crée le groupe"], a: 1, exp: "usermod -G sans -a écrase la liste des groupes." },
    { type: "qcm", q: "À quoi sert la commande <code>su</code> ?", opts: ["Supprimer un utilisateur", "Changer d'identité (switch user), par ex. devenir un autre compte", "Voir les groupes", "Créer un mot de passe"], a: 1, exp: "su = switch user." },
    { type: "input", q: "Quelle commande liste simplement TES groupes ?", a: "groups", ph: "une commande", exp: "groups affiche tes groupes." },
    { type: "vf", q: "Il est recommandé de travailler en permanence connecté en root.", a: false, exp: "Au contraire : on utilise sudo ponctuellement, jamais root en continu." },
    { type: "qcm", q: "Quel est l'intérêt des GROUPES ?", opts: ["Décorer le système", "Donner des droits à plusieurs personnes d'un coup, via leur appartenance à un groupe", "Accélérer la machine", "Cacher des fichiers"], a: 1, exp: "On attribue des droits au groupe, puis on y ajoute les membres." },
    { type: "qcm", q: "Les comptes humains « normaux » ont généralement un UID…", opts: ["égal à 0", "à partir de 1000", "négatif", "toujours 1"], a: 1, exp: "Les UID &lt; 1000 sont réservés au système ; les humains commencent vers 1000." }
  ],
  final: {
    title: "Exercice final — Mettre en place une équipe",
    intro: `<p>Aurélia (administratrice) doit accueillir un nouveau collègue, marc, et l'intégrer à l'équipe « dev ».</p>`,
    questions: [
      { type: "qcm", q: "Créer le compte marc avec son dossier personnel (façon Debian/Ubuntu) :", opts: ["adduser marc", "sudo adduser marc", "su marc", "groups marc"], a: 1, exp: "La création de compte demande sudo." },
      { type: "qcm", q: "Lui définir un mot de passe :", opts: ["passwd", "sudo passwd marc", "id marc", "su marc"], a: 1, exp: "sudo passwd marc fixe le mot de passe d'un autre compte." },
      { type: "input", q: "Créer le groupe dev : sudo … dev", a: ["groupadd", "groupadd dev"], ph: "une commande", exp: "sudo groupadd dev." },
      { type: "qcm", q: "Ajouter marc au groupe dev SANS lui retirer ses autres groupes :", opts: ["sudo usermod -G dev marc", "sudo usermod -aG dev marc", "sudo deluser marc", "groups marc"], a: 1, exp: "-aG : append (ajoute) au groupe dev." },
      { type: "qcm", q: "Vérifier que marc est bien dans dev :", opts: ["groups marc", "whoami", "who", "passwd marc"], a: 0, exp: "groups marc liste ses groupes." }
    ],
    solution: `<pre class="pseudo">sudo adduser marc          → crée le compte + /home/marc
sudo passwd marc           → lui donne un mot de passe
sudo groupadd dev          → crée le groupe dev
sudo usermod -aG dev marc  → l'ajoute à dev (sans écraser ses groupes)
groups marc                → vérification

Rappels : root = UID 0, /etc/passwd = comptes,
/etc/shadow = mots de passe, -aG = ajouter à un groupe.</pre>
<p>Tu sais qui est qui. Demain : contrôler qui a le droit de faire quoi, avec les permissions.</p>`
  }
};
