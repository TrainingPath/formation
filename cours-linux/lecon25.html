<script>
var DAY = {
  num: 25,
  title: "Les boucles en Bash",
  subtitle: "Répéter une action sans se répéter.",
  theory: `
<h3>1. La boucle for : parcourir une liste</h3>
<pre class="pseudo">for prenom in Ana Bob Zoe      # pour chaque élément de la liste…
do
    echo "Bonjour $prenom"     # …exécuter le corps
done                           # done ferme la boucle</pre>
<pre class="pseudo"># Sortie :
# Bonjour Ana
# Bonjour Bob
# Bonjour Zoe</pre>
<p>La structure est <code>for VAR in LISTE ; do … done</code>. À chaque tour, <code>VAR</code> prend la valeur suivante de la liste.</p>

<h3>2. for sur des fichiers (le cas le plus utile)</h3>
<pre class="pseudo">for f in *.txt                 # les jokers (leçon 11) génèrent la liste des fichiers
do
    echo "Traitement de $f"
    wc -l "$f"                 # ex. compter les lignes de chaque .txt
done</pre>
<div class="tip">C'est LA raison d'être des boucles en administration : appliquer la même opération à tous les fichiers d'un dossier — les renommer, les compresser, les analyser… Toujours entre guillemets <code>"$f"</code> pour gérer les noms à espaces.</div>

<h3>3. for numérique</h3>
<pre class="pseudo">for i in 1 2 3 4 5             # liste explicite
do
    echo "Tour numéro $i"
done

for i in $(seq 1 5)           # seq 1 5 génère 1 2 3 4 5
do
    echo "Ligne $i"
done

for (( i=0; i&lt;5; i++ ))        # forme « à la C » : initialisation ; condition ; incrément
do
    echo "i vaut $i"
done</pre>

<h3>4. La boucle while : tant que la condition tient</h3>
<pre class="pseudo">compteur=1
while [ "$compteur" -le 3 ]    # TANT QUE compteur &lt;= 3
do
    echo "Compteur : $compteur"
    compteur=$(( compteur + 1 ))   # $(( )) = calcul arithmétique
done</pre>
<p><code>while</code> répète <strong>tant que</strong> la condition est vraie. Le nombre de tours peut être inconnu à l'avance — exactement comme le <code>while</code> des langages de programmation.</p>

<h3>5. Lire un fichier ligne par ligne</h3>
<pre class="pseudo">while read ligne               # read lit une ligne à chaque tour
do
    echo "Ligne lue : $ligne"
done &lt; fichier.txt             # &lt; fournit le fichier comme entrée de la boucle</pre>
<div class="tip">Ce motif <code>while read ligne; do … done &lt; fichier</code> est l'équivalent Bash de la lecture de fichier ligne par ligne vue dans les autres cours (StreamReader, BufferedReader, fgets…). C'est le patron pour traiter un fichier ligne à ligne dans un script.</div>

<h3>6. until, break et continue</h3>
<pre class="pseudo">until [ "$x" -ge 10 ]     # until = « jusqu'à ce que » : répète TANT QUE c'est FAUX
do
    x=$(( x + 1 ))
done

for f in *.log
do
    [ -s "$f" ] || continue   # continue : passe au tour suivant (ici : ignore les fichiers vides)
    echo "$f n'est pas vide"
    [ "$f" = "stop.log" ] && break   # break : SORT complètement de la boucle
done</pre>
<pre class="pseudo"># Mémo :
# for VAR in LISTE ; do … done    (nombre de tours connu)
# while [ cond ] ; do … done      (tant que vrai)
# until [ cond ] ; do … done      (jusqu'à ce que vrai)
# break = sortir | continue = tour suivant | $(( )) = calcul</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la structure d'une boucle for ?", opts: ["for VAR in LISTE ; do … done", "for (…) { … }", "loop … end", "repeat … until"], a: 0, exp: "for VAR in LISTE, corps entre do et done." },
    { type: "input", q: "Quel mot-clé ferme une boucle (for/while) en Bash ?", a: "done", ph: "un mot-clé", exp: "do ouvre le corps, done le ferme." },
    { type: "qcm", q: "<code>for f in *.txt</code> parcourt…", opts: ["Le mot « *.txt »", "Tous les fichiers .txt (le shell développe le joker)", "Rien", "Un seul fichier"], a: 1, exp: "Le globbing génère la liste des .txt." },
    { type: "qcm", q: "Pourquoi écrire <code>\"$f\"</code> et non <code>$f</code> dans la boucle ?", opts: ["Décoration", "Pour gérer les noms de fichiers contenant des espaces", "Obligatoire sinon erreur", "Pour trier"], a: 1, exp: "Les guillemets protègent les noms à espaces." },
    { type: "qcm", q: "<code>seq 1 5</code> produit…", opts: ["15", "1 2 3 4 5", "5", "1 5"], a: 1, exp: "seq génère la suite d'entiers de 1 à 5." },
    { type: "qcm", q: "Quelle boucle répète TANT QUE une condition est vraie ?", opts: ["for", "while", "until", "case"], a: 1, exp: "while = tant que vrai." },
    { type: "qcm", q: "<code>until [ \"$x\" -ge 10 ]</code> répète…", opts: ["tant que x ≥ 10", "TANT QUE la condition est FAUSSE (jusqu'à ce que x ≥ 10)", "une seule fois", "jamais"], a: 1, exp: "until répète tant que c'est faux ; s'arrête quand ça devient vrai." },
    { type: "qcm", q: "<code>$(( compteur + 1 ))</code> sert à…", opts: ["Afficher", "Faire un CALCUL arithmétique", "Lire un fichier", "Comparer"], a: 1, exp: "$(( )) évalue une expression arithmétique." },
    { type: "qcm", q: "Le motif <code>while read ligne; do … done &lt; fichier</code> sert à…", opts: ["Écrire dans le fichier", "LIRE le fichier ligne par ligne", "Supprimer le fichier", "Le trier"], a: 1, exp: "read lit une ligne par tour ; &lt; fournit le fichier." },
    { type: "qcm", q: "<code>break</code> dans une boucle…", opts: ["Passe au tour suivant", "SORT complètement de la boucle", "Recommence la boucle au début", "Met la boucle en pause"], a: 1, exp: "break interrompt et quitte la boucle." },
    { type: "qcm", q: "<code>continue</code> dans une boucle…", opts: ["Sort de la boucle", "Passe immédiatement au TOUR SUIVANT", "Termine le script", "Répète le tour"], a: 1, exp: "continue saute le reste du corps et enchaîne l'itération suivante." },
    { type: "qcm", q: "<code>for (( i=0; i&lt;5; i++ ))</code> est…", opts: ["Une erreur", "La forme « à la C » : init ; condition ; incrément", "Une boucle while", "Un test"], a: 1, exp: "Boucle for arithmétique, style langage C." },
    { type: "input", q: "Quel mot-clé ouvre le CORPS d'une boucle (après for/while) ?", a: "do", ph: "un mot-clé", exp: "do … done encadrent le corps." },
    { type: "vf", q: "<code>while</code> convient quand le nombre de tours est inconnu à l'avance.", a: true, exp: "On boucle selon une condition, pas un compte fixe." },
    { type: "qcm", q: "<code>[ -s \"$f\" ] || continue</code> dans une boucle for signifie…", opts: ["Supprime f", "Si f est vide (pas -s), passer au fichier suivant", "Toujours continuer", "Sortir de la boucle"], a: 1, exp: "-s = fichier non vide ; sinon on saute au tour suivant." }
  ],
  final: {
    title: "Exercice final — Renommer et compter en série",
    intro: `<p>Aurélia écrit <code>traiter.sh</code> :</p>
<pre class="pseudo">#!/bin/bash
total=0
for f in *.txt
do
    lignes=$(wc -l &lt; "$f")
    echo "$f : $lignes lignes"
    total=$(( total + lignes ))
done
echo "Total : $total lignes dans tous les .txt"</pre>`,
    questions: [
      { type: "qcm", q: "Sur quoi la boucle itère-t-elle ?", opts: ["Un nombre fixe de fois", "Tous les fichiers .txt du dossier", "Les lignes d'un fichier", "Les utilisateurs"], a: 1, exp: "for f in *.txt parcourt chaque fichier .txt." },
      { type: "qcm", q: "Que fait <code>lignes=$(wc -l < \"$f\")</code> ?", opts: ["Écrit dans f", "Capture le nombre de lignes de f dans la variable lignes", "Supprime f", "Trie f"], a: 1, exp: "$(...) capture la sortie de wc -l pour le fichier courant." },
      { type: "qcm", q: "À quoi sert <code>total=$(( total + lignes ))</code> ?", opts: ["À afficher", "À ACCUMULER le total des lignes tour après tour", "À comparer", "À lire un fichier"], a: 1, exp: "$(( )) additionne : c'est l'accumulateur des cours de prog." },
      { type: "input", q: "S'il y a 3 fichiers de 4, 5 et 6 lignes, qu'affiche « Total : … lignes » ?", a: "15", ph: "un nombre", exp: "4+5+6 = 15, accumulé dans total." },
      { type: "qcm", q: "Pourquoi <code>\"$f\"</code> est entre guillemets ?", opts: ["Décoration", "Pour gérer les noms de fichiers avec espaces", "Obligatoire pour wc", "Pour trier"], a: 1, exp: "Robustesse face aux espaces dans les noms." }
    ],
    solution: `<pre class="pseudo">for f in *.txt        → un tour par fichier .txt
  wc -l &lt; "$f"        → lignes du fichier courant (capturé)
  total=$(( … ))      → accumulateur (jour de l'accumulateur en prog !)
done
→ affiche chaque fichier, puis le total (ex. 4+5+6 = 15)

for/while/until · do…done · $(( )) · "$f" : la boîte à répétitions.</pre>
<p>Tu répètes sans te répéter. Demain : ranger ton code dans des fonctions, et lire l'utilisateur.</p>`
  }
};
</script>

  "items": [
    {
      "id": "lnx-l25",
      "title": "Le compteur et le parcours de fichiers",
      "level": 3,

      "hints": [

        "Ignorer un fichier vide : [ -s \"$f\" ] || continue (—s = non vide ; sinon on saute).",
        "Compter : initialise n=0 avant la boucle, puis n=$(( n + 1 )) à chaque fichier traité."
      ],
      "solution": "#!/bin/bash\n# bilan.sh — compte les lignes des .log non vides\n\nprintf 'erreur 1\\nerreur 2\\n' > app.log     # fichiers d'exemple pour tester\nprintf 'demarrage\\n' > sys.log\n: > vide.log                                 # un .log VIDE (sera ignoré)\n\nn=0                              # compteur de fichiers traités\nfor f in *.log\ndo\n    [ -s \"$f\" ] || continue      # si f est vide, passer au suivant\n    lignes=$(wc -l < \"$f\")        # nombre de lignes du fichier\n    echo \"$f : $lignes lignes\"\n    n=$(( n + 1 ))               # un fichier non vide de plus\ndone\necho \"$n fichier(s) non vide(s) traité(s).\"\nexit 0",
