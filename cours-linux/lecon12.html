<script>
var DAY = {
  num: 12,
  title: "Trier et couper : cut, sort, uniq",
  subtitle: "Extraire des colonnes et organiser des lignes.",
  theory: `
<h3>1. Extraire des colonnes : cut</h3>
<p>Beaucoup de fichiers Linux sont « en colonnes » séparées par un caractère (un CSV avec des <code>;</code>, le fichier <code>/etc/passwd</code> avec des <code>:</code>…). <code>cut</code> en extrait les champs voulus.</p>
<pre class="pseudo">cut -d';' -f1 notes.csv     # -d = DÉLIMITEUR (ici ;) ; -f1 = le champ n°1
cut -d';' -f1,3 notes.csv   # les champs 1 ET 3
cut -d':' -f1 /etc/passwd   # le 1er champ (le nom d'utilisateur) de chaque ligne
cut -c1-5 fichier.txt       # -c = par CARACTÈRES : les colonnes 1 à 5 de chaque ligne</pre>
<p>Sur une ligne <code>Ana;14;Paris</code>, <code>cut -d';' -f2</code> renvoie <code>14</code>. C'est l'équivalent du <code>split(";")</code> vu dans les langages, mais directement au clavier.</p>

<h3>2. Trier : sort</h3>
<pre class="pseudo">sort noms.txt        # tri alphabétique (ordre croissant par défaut)
sort -r noms.txt     # -r : ordre inverse (décroissant)
sort -n nombres.txt  # -n : tri NUMÉRIQUE (sinon « 10 » vient avant « 9 » !)
sort -nr nombres.txt # numérique décroissant : du plus grand au plus petit
sort -u noms.txt     # -u : trie ET retire les doublons (sort + uniq en un)</pre>
<div class="warn">Piège très courant : sans <code>-n</code>, <code>sort</code> compare le texte caractère par caractère. Résultat, « 10 » est classé avant « 9 » (car « 1 » &lt; « 9 »). Pour des nombres, pense TOUJOURS à <code>-n</code>.</div>

<h3>3. Trier sur une colonne précise</h3>
<pre class="pseudo">sort -t';' -k2 -n notes.csv   # -t = séparateur ; -k2 = trier sur le 2e champ ; -n = numérique
# Ex. classer des « nom;note » par note croissante</pre>
<p><code>-t</code> indique le séparateur de colonnes et <code>-k</code> (key) la colonne de tri. On combine avec <code>-n</code> ou <code>-r</code> selon le besoin.</p>

<h3>4. Dédoublonner et compter : uniq</h3>
<pre class="pseudo">sort villes.txt | uniq       # supprime les doublons (le sort les rend ADJACENTS)
sort villes.txt | uniq -c    # -c : compte les occurrences de chaque ligne
sort villes.txt | uniq -d    # -d : n'affiche QUE les lignes en double
sort villes.txt | uniq -u    # -u : n'affiche QUE les lignes uniques (jamais répétées)</pre>
<div class="tip">Retiens la règle d'or : <code>uniq</code> ne compare que des lignes <strong>voisines</strong>. On le fait donc presque toujours précéder d'un <code>sort</code> pour regrouper les identiques. <code>sort | uniq -c | sort -nr</code> est le classique « top des valeurs les plus fréquentes ».</div>

<h3>5. Tout combiner</h3>
<pre class="pseudo"># « Quelles villes reviennent le plus dans un CSV nom;ville ? »
cut -d';' -f2 gens.csv | sort | uniq -c | sort -nr
# cut  : extrait la colonne « ville »
# sort : regroupe les villes identiques
# uniq -c : compte chaque ville
# sort -nr : classe de la plus fréquente à la moins fréquente</pre>
<div class="tip">C'est la suite logique de la leçon 9 : de petits filtres (cut, sort, uniq) branchés par des tubes transforment un fichier brut en véritable analyse — sans écrire une seule ligne de programme.</div>

<h3>6. À retenir</h3>
<pre class="pseudo">cut -d SEP -fN     # extraire la colonne N (séparateur SEP)
cut -cA-B          # extraire les caractères de A à B
sort  -n  -r  -u   # trier : numérique, inverse, unique
sort -t SEP -kN    # trier sur la colonne N
uniq -c  -d  -u    # compter / doublons seuls / uniques seuls</pre>`,
  exercises: [
    { type: "qcm", q: "Sur la ligne <code>Ana;14;Paris</code>, que renvoie <code>cut -d';' -f2</code> ?", opts: ["Ana", "14", "Paris", "Ana;14"], a: 1, exp: "-d';' découpe sur ; et -f2 prend le 2e champ : 14." },
    { type: "input", q: "Quelle option de cut définit le caractère séparateur de colonnes ?", a: ["-d", "d"], ph: "une option", exp: "-d = delimiter." },
    { type: "qcm", q: "<code>cut -c1-5</code> extrait…", opts: ["Les 5 premiers champs", "Les caractères (colonnes) 1 à 5 de chaque ligne", "5 lignes", "Le 5e mot"], a: 1, exp: "-c travaille par positions de caractères." },
    { type: "qcm", q: "Pourquoi <code>sort</code> classe-t-il « 10 » avant « 9 » par défaut ?", opts: ["Une limite d'affichage", "Parce qu'il compare comme du TEXTE : « 1 » vient avant « 9 »", "Parce que 10 est plus petit", "Cela n'arrive jamais"], a: 1, exp: "Sans -n, tri lexicographique. D'où -n pour les nombres." },
    { type: "input", q: "Quelle option de sort force un tri NUMÉRIQUE ?", a: ["-n", "n"], ph: "une option", exp: "-n = tri numérique." },
    { type: "qcm", q: "<code>sort -nr nombres.txt</code> donne…", opts: ["Texte croissant", "Nombres du plus GRAND au plus petit", "Nombres croissants", "Les doublons"], a: 1, exp: "-n numérique, -r inversé : décroissant." },
    { type: "qcm", q: "<code>sort -u</code> équivaut à…", opts: ["sort seulement", "sort PUIS uniq (trier et retirer les doublons)", "uniq seulement", "cut"], a: 1, exp: "-u combine tri et suppression des doublons." },
    { type: "qcm", q: "Dans <code>sort -t';' -k2 -n</code>, à quoi sert <code>-k2</code> ?", opts: ["Garder 2 lignes", "Trier sur le 2e champ (colonne)", "Le délimiteur", "Le mode numérique"], a: 1, exp: "-k = key : la colonne servant de clé de tri." },
    { type: "qcm", q: "Pourquoi fait-on presque toujours <code>sort</code> AVANT <code>uniq</code> ?", opts: ["Par habitude", "Parce que uniq ne fusionne que des lignes ADJACENTES", "uniq trie déjà", "Pour la couleur"], a: 1, exp: "sort regroupe les identiques côte à côte pour que uniq les voie." },
    { type: "input", q: "Quelle option de uniq COMPTE les occurrences de chaque ligne ?", a: ["-c", "c"], ph: "une option", exp: "uniq -c préfixe par le nombre." },
    { type: "qcm", q: "<code>uniq -d</code> affiche…", opts: ["Toutes les lignes", "Seulement les lignes qui apparaissent en DOUBLE", "Les lignes uniques", "Rien"], a: 1, exp: "-d = duplicated : uniquement les répétées." },
    { type: "qcm", q: "<code>uniq -u</code> affiche…", opts: ["Les doublons", "Seulement les lignes JAMAIS répétées", "Tout", "Le compte"], a: 1, exp: "-u = uniques : les lignes présentes une seule fois." },
    { type: "qcm", q: "<code>cut -d';' -f2 gens.csv | sort | uniq -c | sort -nr</code> produit…", opts: ["Une erreur", "Le classement des valeurs de la colonne 2 par fréquence décroissante", "La 1re colonne triée", "Le nombre de lignes"], a: 1, exp: "Extraire → regrouper → compter → classer : un top des fréquences." },
    { type: "vf", q: "cut est au terminal ce que split(\";\") est aux langages de programmation.", a: true, exp: "cut -d';' -fN isole un champ, comme split puis l'accès à un indice." },
    { type: "qcm", q: "Pour extraire le nom d'utilisateur (1er champ) de chaque ligne de /etc/passwd (séparateur :) :", opts: ["cut -d':' -f1 /etc/passwd", "cut -c1", "sort /etc/passwd", "uniq /etc/passwd"], a: 0, exp: "Séparateur : et champ 1 = le login." }
  ],
  final: {
    title: "Exercice final — Exploiter un CSV de ventes",
    intro: `<p>Un fichier <code>ventes.csv</code> a des lignes de la forme <code>produit;quantite;ville</code>, par exemple <code>clavier;3;Lyon</code>.</p>`,
    questions: [
      { type: "qcm", q: "Extraire uniquement la colonne « ville » :", opts: ["cut -d';' -f3 ventes.csv", "cut -c3 ventes.csv", "sort ventes.csv", "uniq -c"], a: 0, exp: "La ville est le 3e champ, séparateur ;." },
      { type: "qcm", q: "Lister les villes distinctes triées :", opts: ["cut -d';' -f3 ventes.csv | sort -u", "cut -c3 | uniq", "sort ventes.csv", "cut -f1"], a: 0, exp: "Extraire la colonne 3, puis sort -u (trie + dédoublonne)." },
      { type: "input", q: "Pour classer les villes de la plus fréquente à la moins fréquente, quelle commande finale ajoute-t-on après uniq -c ? sort …", a: ["-nr", "sort -nr"], ph: "sort …", exp: "sort -nr classe par nombre décroissant." },
      { type: "qcm", q: "Trier les lignes par QUANTITÉ croissante (colonne 2, numérique) :", opts: ["sort -t';' -k2 -n ventes.csv", "sort ventes.csv", "cut -f2", "uniq -c"], a: 0, exp: "-t';' séparateur, -k2 colonne 2, -n numérique." },
      { type: "vf", q: "Sans <code>-n</code>, trier la colonne quantité classerait « 10 » avant « 2 ».", a: true, exp: "Tri texte : « 1 » &lt; « 2 », donc 10 avant 2. -n corrige." }
    ],
    solution: `<pre class="pseudo">Extraire la ville   : cut -d';' -f3 ventes.csv
Villes distinctes   : cut -d';' -f3 ventes.csv | sort -u
Top des villes      : cut -d';' -f3 ventes.csv | sort | uniq -c | sort -nr
Trier par quantité  : sort -t';' -k2 -n ventes.csv

cut découpe, sort ordonne, uniq compte : le trio de l'analyse texte.</pre>
<p>Tu transformes un CSV brut en informations utiles. Demain : sed, le remplaçateur de masse.</p>`
  }
};
</script>
