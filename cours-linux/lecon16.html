<script>
var DAY = {
  num: 16,
  title: "Les permissions : rwx et chmod",
  subtitle: "Décider qui peut lire, écrire, exécuter.",
  theory: `
<h3>1. Lire les permissions avec ls -l</h3>
<p>Chaque fichier porte des <strong>permissions</strong> qui disent qui peut faire quoi. On les voit avec <code>ls -l</code> :</p>
<pre class="pseudo">-rwxr-xr--  1 aurelia dev  2048 mai 3 notes.sh
# │└─┬─┘└┬┘└┬┘        │     │
# │  │   │  │         │     └─ nom du fichier
# │  │   │  │         └─ propriétaire (aurelia) et groupe (dev)
# │  │   │  └─ AUTRES (o) : r-- → lecture seule
# │  │   └─ GROUPE (g)   : r-x → lecture + exécution
# │  └─ PROPRIÉTAIRE (u) : rwx → lecture + écriture + exécution
# └─ type : - fichier, d dossier, l lien</pre>
<p>Les 9 caractères après le type se lisent par groupes de trois : <strong>u</strong>ser (propriétaire), <strong>g</strong>roup (groupe), <strong>o</strong>ther (tous les autres).</p>

<h3>2. Que signifient r, w, x ?</h3>
<pre class="pseudo"># Sur un FICHIER :
# r (read)    : lire le contenu (cat, less…)
# w (write)   : modifier ou effacer le contenu
# x (execute) : LANCER le fichier comme un programme/script

# Sur un DOSSIER (attention, le sens change !) :
# r : lister les noms qu'il contient (ls)
# w : y créer / renommer / supprimer des fichiers
# x : le TRAVERSER (entrer dedans avec cd, accéder à son contenu)</pre>
<div class="warn">Point qui piège tout le monde : sur un dossier, <code>x</code> ne veut pas dire « exécuter » mais « traverser ». Sans <code>x</code> sur un dossier, tu ne peux même pas y entrer, quand bien même tu aurais <code>r</code>.</div>

<h3>3. Modifier avec chmod, version symbolique</h3>
<p><code>chmod</code> (change mode) ajoute ou retire des droits. Forme symbolique : <em>qui</em> (u/g/o/a) + <em>opération</em> (+ - =) + <em>droit</em> (r/w/x).</p>
<pre class="pseudo">chmod u+x notes.sh     # AJOUTE x au propriétaire (rendre un script exécutable)
chmod g-w notes.txt    # RETIRE w au groupe
chmod o=r notes.txt    # met les AUTRES à « lecture seule » exactement (= fixe)
chmod a+r notes.txt    # a = all : ajoute la lecture à tout le monde
chmod u+x,g+x notes.sh # plusieurs changements séparés par une virgule</pre>

<h3>4. La notation octale (les fameux 755, 644)</h3>
<p>On peut aussi exprimer les droits par des chiffres. Chaque droit vaut une valeur, qu'on additionne :</p>
<pre class="pseudo"># r = 4    w = 2    x = 1     (on additionne pour chaque groupe u, g, o)
# rwx = 4+2+1 = 7   rw- = 4+2 = 6   r-x = 4+1 = 5   r-- = 4   --- = 0

chmod 755 script.sh    # rwx r-x r-x : moi tout, les autres lire+exécuter (scripts, programmes)
chmod 644 notes.txt    # rw- r-- r-- : moi lire+écrire, les autres lire (fichiers courants)
chmod 600 secret.txt   # rw- --- --- : moi seul, personne d'autre (fichiers privés)
chmod 700 dossier      # rwx --- --- : dossier privé (moi seul peux entrer)
chmod 777 partage      # rwx rwx rwx : TOUT le monde tout (à éviter, dangereux)</pre>
<div class="tip">Trois valeurs à mémoriser couvrent presque tout : <strong>644</strong> pour un fichier de données, <strong>755</strong> pour un script ou un dossier, <strong>600</strong> pour un fichier privé. Le reste se déduit.</div>

<h3>5. Rendre un script exécutable : le cas classique</h3>
<pre class="pseudo">ls -l sauvegarde.sh          # -rw-r--r-- : pas de x, il ne se lance pas
chmod +x sauvegarde.sh       # ajoute x (raccourci de u+x pour tous)
ls -l sauvegarde.sh          # -rwxr-xr-x : maintenant exécutable
./sauvegarde.sh              # on peut le lancer (le ./ sera vu en leçon 22)</pre>

<h3>6. Récursif et prudence</h3>
<pre class="pseudo">chmod -R 755 site/       # -R : applique récursivement à tout le dossier site/</pre>
<div class="warn">Évite <code>chmod 777</code> : « tout le monde peut tout modifier » est une faille de sécurité, pas une solution. Quand un accès ne marche pas, cherche le bon droit minimal (souvent un simple <code>+x</code> sur un dossier), plutôt que d'ouvrir en grand.</div>`,
  exercises: [
    { type: "qcm", q: "Dans <code>-rwxr-xr--</code>, que valent les droits du GROUPE ?", opts: ["rwx", "r-x (lecture + exécution)", "r-- ", "---"], a: 1, exp: "Les caractères 5-7 (r-x) concernent le groupe." },
    { type: "qcm", q: "Les 9 caractères de droits se lisent en trois groupes :", opts: ["fichier / dossier / lien", "user (propriétaire) / group / other", "read / write / delete", "petit / moyen / grand"], a: 1, exp: "u = propriétaire, g = groupe, o = autres." },
    { type: "qcm", q: "Sur un FICHIER, le droit <code>x</code> permet…", opts: ["De le lire", "De le LANCER comme un programme/script", "De le supprimer", "De le cacher"], a: 1, exp: "x = exécuter le fichier." },
    { type: "qcm", q: "Sur un DOSSIER, le droit <code>x</code> permet…", opts: ["De l'exécuter", "De le TRAVERSER (y entrer avec cd, accéder au contenu)", "Rien", "De le lire"], a: 1, exp: "x sur un dossier = droit de traversée." },
    { type: "input", q: "Quelle commande symbolique rend un script exécutable pour son propriétaire ?", a: ["chmod u+x", "chmod +x"], ph: "chmod …", exp: "chmod u+x (ou +x) ajoute le droit d'exécution." },
    { type: "qcm", q: "En notation octale, combien vaut <code>rwx</code> ?", opts: ["5", "6", "7", "4"], a: 2, exp: "r(4)+w(2)+x(1) = 7." },
    { type: "qcm", q: "Combien vaut <code>rw-</code> ?", opts: ["7", "6", "5", "4"], a: 1, exp: "r(4)+w(2) = 6." },
    { type: "qcm", q: "<code>chmod 644 notes.txt</code> donne…", opts: ["rwx pour tous", "rw- pour le propriétaire, r-- pour groupe et autres", "--- pour tous", "rwx r-x r-x"], a: 1, exp: "6=rw-, 4=r--, 4=r-- : le réglage classique d'un fichier de données." },
    { type: "qcm", q: "Quel réglage octal pour un script exécutable partagé (moi tout, les autres lire+exécuter) ?", opts: ["644", "755", "600", "777"], a: 1, exp: "755 = rwx r-x r-x." },
    { type: "qcm", q: "<code>chmod 600 secret.txt</code> signifie…", opts: ["Tout le monde peut lire", "Le propriétaire lit/écrit, personne d'autre n'a de droit", "Exécutable par tous", "Rien du tout"], a: 1, exp: "600 = rw- --- --- : fichier privé." },
    { type: "input", q: "Quel nombre octal correspond à rwx r-x r-x ?", a: "755", ph: "trois chiffres", exp: "7=rwx, 5=r-x, 5=r-x." },
    { type: "qcm", q: "Pourquoi éviter <code>chmod 777</code> ?", opts: ["C'est plus lent", "Cela donne tous les droits à TOUT LE MONDE : une faille de sécurité", "Ça rend le fichier invisible", "Ça verrouille le fichier"], a: 1, exp: "777 = rwx pour tous : à proscrire." },
    { type: "qcm", q: "<code>chmod -R 755 site/</code> applique les droits…", opts: ["Au seul dossier site", "Récursivement à site/ et tout son contenu", "À la racine", "À aucun fichier"], a: 1, exp: "-R = récursif." },
    { type: "vf", q: "Sans le droit <code>x</code> sur un dossier, on ne peut pas y entrer avec cd, même avec r.", a: true, exp: "x = traversée : indispensable pour accéder au contenu." },
    { type: "input", q: "En symbolique, quelle commande RETIRE le droit d'écriture au groupe sur f.txt ?", a: ["chmod g-w f.txt", "chmod g-w"], ph: "chmod …", exp: "g-w retire w au groupe." }
  ],
  final: {
    title: "Exercice final — Sécuriser un script et un secret",
    intro: `<p>Aurélia a deux fichiers : <code>deploy.sh</code> (un script qu'elle veut lancer) et <code>mot_de_passe.txt</code> (à garder strictement privé). Un <code>ls -l</code> montre :</p>
<pre class="pseudo">-rw-r--r-- 1 aurelia dev deploy.sh
-rw-r--r-- 1 aurelia dev mot_de_passe.txt</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi <code>./deploy.sh</code> échoue-t-il actuellement ?", opts: ["Le fichier est vide", "Il n'a pas le droit x (exécution)", "Il est trop gros", "Il est caché"], a: 1, exp: "-rw-r--r-- : aucun x. Il faut l'ajouter." },
      { type: "input", q: "Rendre deploy.sh exécutable (forme symbolique la plus simple) : chmod … deploy.sh", a: ["+x", "u+x"], ph: "chmod …", exp: "chmod +x deploy.sh ajoute le droit d'exécution." },
      { type: "qcm", q: "En octal, quel réglage pour un script exécutable classique (rwx r-x r-x) ?", opts: ["chmod 644", "chmod 755 deploy.sh", "chmod 600", "chmod 777"], a: 1, exp: "755 = rwx r-x r-x." },
      { type: "qcm", q: "mot_de_passe.txt est lisible par tous (r-- r--). Le rendre STRICTEMENT privé :", opts: ["chmod 644", "chmod 600 mot_de_passe.txt", "chmod 755", "chmod +x"], a: 1, exp: "600 = rw- --- --- : le propriétaire seul." },
      { type: "vf", q: "Mettre <code>chmod 777</code> sur mot_de_passe.txt serait une bonne idée pour « éviter les soucis d'accès ».", a: false, exp: "Ce serait l'inverse : 777 l'ouvrirait à tout le monde. On veut 600." }
    ],
    solution: `<pre class="pseudo">deploy.sh manque de x → chmod +x deploy.sh  (ou chmod 755 deploy.sh)
mot_de_passe.txt trop ouvert → chmod 600 mot_de_passe.txt

Mémo octal : r=4 w=2 x=1
644 = fichier de données | 755 = script/dossier | 600 = privé
Sur un dossier : x = pouvoir y entrer. 777 = à éviter.</pre>
<p>Tu contrôles les droits. Demain : la propriété des fichiers (chown) et le pouvoir de sudo.</p>`
  }
};
</script>
