<script>
var DAY = {
  num: 20,
  title: "Rechercher : find et xargs",
  subtitle: "Retrouver des fichiers par leurs critères, et agir dessus.",
  theory: `
<h3>1. find : chercher par critères</h3>
<p><code>find</code> parcourt une arborescence et retrouve les fichiers selon des <strong>critères</strong> (nom, type, taille, date…). Sa forme : <code>find OÙ CRITÈRES</code>.</p>
<pre class="pseudo">find . -name "notes.txt"     # cherche « notes.txt » à partir du dossier courant (.)
find /etc -name "*.conf"     # tous les fichiers .conf sous /etc (le motif entre guillemets)
find . -iname "*.JPG"        # -iname = comme -name mais insensible à la casse</pre>
<div class="tip">Mets toujours le motif entre guillemets (<code>"*.conf"</code>). Sinon, le shell développerait <code>*</code> AVANT find (globbing, leçon 11), ce qui fausserait la recherche. Les guillemets protègent le motif pour que ce soit find qui l'interprète.</div>

<h3>2. Filtrer par type, taille, date</h3>
<pre class="pseudo">find . -type f          # -type f : seulement les FICHIERS
find . -type d          # -type d : seulement les DOSSIERS
find . -type l          # -type l : seulement les liens symboliques

find . -size +100M      # fichiers de PLUS de 100 Mo (+ = au-dessus ; - = en dessous)
find . -size -1k        # fichiers de moins de 1 Ko

find . -mtime -7        # modifiés il y a MOINS de 7 jours (récents)
find . -mtime +30       # modifiés il y a PLUS de 30 jours (vieux)
find . -mmin -60        # modifiés dans la dernière heure (minutes)</pre>

<h3>3. Combiner les critères</h3>
<pre class="pseudo">find /var/log -type f -name "*.log" -mtime +30
# les FICHIERS .log de /var/log modifiés il y a plus de 30 jours
# Les critères se cumulent : ET implicite entre eux.
find . -type f -size +10M -name "*.mp4"   # les grosses vidéos</pre>

<h3>4. Agir sur les résultats : -exec</h3>
<pre class="pseudo">find . -name "*.tmp" -exec rm {} \\;
# -exec CMD {} \\;  exécute CMD sur CHAQUE résultat
#   {}  est remplacé par le fichier trouvé
#   \\;  marque la fin de la commande (le \\ protège le ; du shell)
find . -name "*.txt" -exec cp {} /sauvegarde/ \\;   # copie chaque .txt trouvé</pre>
<div class="warn">Comme toujours avec une suppression, teste d'abord SANS l'action : lance <code>find . -name "*.tmp"</code> seul pour voir la liste, puis ajoute <code>-exec rm {} \\;</code> une fois sûre de la cible.</div>

<h3>5. xargs : passer les résultats à une autre commande</h3>
<p><code>xargs</code> lit une liste sur son entrée et la transforme en <strong>arguments</strong> pour une commande. Associé à <code>find</code> par un tube, il est souvent plus rapide que <code>-exec</code>.</p>
<pre class="pseudo">find . -name "*.log" | xargs rm          # supprime tous les .log trouvés
find . -name "*.txt" | xargs wc -l       # compte les lignes de tous les .txt d'un coup
find . -name "*.conf" | xargs grep "port" # cherche « port » dans tous les .conf</pre>
<pre class="pseudo"># Sécurité contre les noms contenant des espaces :
find . -name "*.log" -print0 | xargs -0 rm
# -print0 / -0 séparent les fichiers par un caractère nul, robuste aux espaces</pre>

<h3>6. Alternatives rapides</h3>
<pre class="pseudo">locate notes.txt     # cherche dans une BASE indexée : quasi instantané (sudo updatedb pour l'actualiser)
which python3        # le chemin d'une COMMANDE exécutable (leçon 6)
whereis ls           # binaire + sources + manuel d'une commande</pre>
<p><code>find</code> parcourt le disque en temps réel (précis mais plus lent) ; <code>locate</code> interroge un index (rapide mais parfois périmé). Pour chercher une <em>commande</em>, on préfère <code>which</code>.</p>`,
  exercises: [
    { type: "qcm", q: "La structure de find est…", opts: ["find CRITÈRES OÙ", "find OÙ CRITÈRES (ex. find . -name ...)", "find -name seulement", "find FICHIER"], a: 1, exp: "D'abord le point de départ, puis les critères." },
    { type: "input", q: "Quel critère de find recherche par NOM de fichier ?", a: ["-name", "name"], ph: "un critère", exp: "-name \"motif\" filtre par nom." },
    { type: "qcm", q: "Pourquoi mettre le motif entre guillemets dans <code>find . -name \"*.conf\"</code> ?", opts: ["Par style", "Pour empêcher le SHELL de développer * avant find", "C'est obligatoire partout", "Pour aller plus vite"], a: 1, exp: "Sans guillemets, le globbing du shell interviendrait trop tôt." },
    { type: "qcm", q: "<code>find . -type d</code> ne renvoie que…", opts: ["Les fichiers", "Les DOSSIERS", "Les liens", "Les fichiers cachés"], a: 1, exp: "-type d = directories." },
    { type: "qcm", q: "<code>find . -size +100M</code> trouve…", opts: ["Les fichiers de moins de 100 Mo", "Les fichiers de PLUS de 100 Mo", "Exactement 100 fichiers", "Les dossiers"], a: 1, exp: "+ = au-dessus du seuil ; - = en dessous." },
    { type: "qcm", q: "<code>find . -mtime -7</code> sélectionne les fichiers…", opts: ["Vieux de plus de 7 jours", "Modifiés il y a MOINS de 7 jours (récents)", "De 7 Ko", "De type 7"], a: 1, exp: "-mtime -7 = modifiés dans les 7 derniers jours." },
    { type: "qcm", q: "Plusieurs critères sur une même ligne find sont reliés par…", opts: ["Un OU", "Un ET implicite (tous doivent être vrais)", "Rien", "Un tube"], a: 1, exp: "Les critères se cumulent : ET par défaut." },
    { type: "qcm", q: "Dans <code>-exec rm {} \\;</code>, que représente <code>{}</code> ?", opts: ["Un dossier vide", "Chaque fichier trouvé (remplacé à l'exécution)", "Un caractère joker quelconque", "Le point de départ de la recherche"], a: 1, exp: "{} est remplacé par chaque résultat de find." },
    { type: "qcm", q: "À quoi sert le <code>\\;</code> à la fin d'un -exec ?", opts: ["À rien", "À marquer la FIN de la commande exécutée (le \\ protège le ;)", "À trier", "À compter"], a: 1, exp: "\\; termine l'expression -exec." },
    { type: "qcm", q: "Bon réflexe avant <code>find ... -exec rm {} \\;</code> ?", opts: ["Rien", "Lancer d'abord find SANS -exec pour voir la liste ciblée", "Passer root", "Ajouter -type d"], a: 1, exp: "Vérifier la liste avant de supprimer, comme toujours." },
    { type: "qcm", q: "À quoi sert <code>xargs</code> dans <code>find ... | xargs rm</code> ?", opts: ["À trier", "À transformer la liste de find en ARGUMENTS pour rm", "À compter", "À afficher"], a: 1, exp: "xargs construit la commande à partir de l'entrée." },
    { type: "qcm", q: "<code>find . -name \"*.txt\" | xargs wc -l</code> fait…", opts: ["Supprime les .txt", "Compte les lignes de tous les .txt trouvés", "Les renomme", "Les cache"], a: 1, exp: "find fournit la liste, wc -l compte via xargs." },
    { type: "qcm", q: "Pourquoi <code>find ... -print0 | xargs -0</code> ?", opts: ["Pour aller moins vite", "Pour gérer correctement les noms de fichiers contenant des espaces", "Pour trier", "Obligatoire toujours"], a: 1, exp: "Le séparateur nul évite les erreurs sur les espaces." },
    { type: "qcm", q: "Différence entre <code>find</code> et <code>locate</code> ?", opts: ["Aucune", "find parcourt le disque en direct (précis, plus lent) ; locate interroge un index (rapide, parfois périmé)", "locate est plus précis", "find ne cherche que les dossiers"], a: 1, exp: "Temps réel vs base indexée." },
    { type: "input", q: "Quel critère de find ne garde que les FICHIERS (pas les dossiers) ? -type …", a: ["f", "-type f"], ph: "…", exp: "-type f = fichiers." }
  ],
  final: {
    title: "Exercice final — Faire le ménage dans les logs",
    intro: `<p>Le dossier <code>/var/log/app</code> déborde de vieux fichiers <code>.log</code>. Aurélia veut repérer puis nettoyer les plus anciens, prudemment.</p>`,
    questions: [
      { type: "qcm", q: "Lister les fichiers .log de /var/log/app :", opts: ["find /var/log/app -type f -name \"*.log\"", "grep log", "ls -R", "locate log"], a: 0, exp: "find avec -type f et -name \"*.log\"." },
      { type: "qcm", q: "Restreindre à ceux modifiés il y a PLUS de 30 jours :", opts: ["... -mtime -30", "... -mtime +30", "... -size +30", "... -name 30"], a: 1, exp: "-mtime +30 = plus vieux que 30 jours." },
      { type: "qcm", q: "Avant de supprimer, quel est le bon geste ?", opts: ["Ajouter direct -exec rm", "Lancer d'abord le find seul pour VOIR la liste ciblée", "Passer root", "Redémarrer"], a: 1, exp: "On vérifie la cible avant toute suppression." },
      { type: "qcm", q: "Supprimer ces vieux logs avec -exec :", opts: ["find /var/log/app -type f -name \"*.log\" -mtime +30 -exec rm {} \\;", "rm *.log", "find -delete tout", "xargs seul"], a: 0, exp: "-exec rm {} \\; supprime chaque résultat filtré." },
      { type: "qcm", q: "Variante équivalente avec un tube :", opts: ["find ... -mtime +30 | xargs rm", "ls | rm", "grep | rm", "cat | rm"], a: 0, exp: "find ... | xargs rm passe la liste à rm." }
    ],
    solution: `<pre class="pseudo">1. Lister      : find /var/log/app -type f -name "*.log"
2. Filtrer âge : find /var/log/app -type f -name "*.log" -mtime +30
3. VÉRIFIER la liste (toujours) avant d'agir
4. Supprimer   : ... -mtime +30 -exec rm {} \\;
   ou          : find ... -mtime +30 | xargs rm

find = chercher par critères ; -exec / xargs = agir sur les résultats.</pre>
<p>Fin de semaine proche. Demain : on récapitule droits et processus (leçon 21).</p>`
  }
};
</script>
