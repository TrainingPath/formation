var DAY = {
  num: 14,
  title: "awk : colonnes et calculs",
  subtitle: "Le couteau suisse du texte en colonnes (+ récap semaine 2).",
  theory: `
<h3>1. awk voit chaque ligne comme des colonnes</h3>
<p><code>awk</code> découpe automatiquement chaque ligne en <strong>champs</strong> et te laisse les manipuler. Par défaut, le séparateur est l'espace (ou une suite d'espaces/tabulations).</p>
<pre class="pseudo">awk '{print $1}' fichier.txt
# $1 = le 1er champ, $2 = le 2e, … $0 = la LIGNE ENTIÈRE
# print = afficher. Ici : afficher la 1re colonne de chaque ligne.</pre>
<pre class="pseudo">echo "Ana 14 Paris" | awk '{print $3}'   # affiche : Paris (3e champ)
awk '{print $2, $1}' noms.txt            # inverse deux colonnes (la virgule met une espace)</pre>

<h3>2. Changer le séparateur : -F</h3>
<pre class="pseudo">awk -F';' '{print $1}' notes.csv     # -F';' : les champs sont séparés par des ;
awk -F':' '{print $1}' /etc/passwd   # le login de chaque compte (séparateur :)</pre>
<p>C'est le pendant du <code>-d</code> de <code>cut</code>, mais awk va beaucoup plus loin : il calcule, il teste des conditions, il additionne.</p>

<h3>3. Les variables magiques : NR et NF</h3>
<pre class="pseudo">awk '{print NR, $0}' f.txt   # NR = Number of Record : le NUMÉRO de la ligne courante
awk '{print NF}' f.txt       # NF = Number of Fields : le NOMBRE de champs de la ligne
awk '{print $NF}' f.txt      # $NF = le DERNIER champ (quel que soit son numéro)
awk 'END {print NR}' f.txt   # à la fin, NR vaut le nombre total de lignes (comme wc -l)</pre>

<h3>4. Filtrer avec des motifs et des conditions</h3>
<pre class="pseudo">awk '/erreur/' f.txt              # affiche les lignes contenant « erreur » (comme grep)
awk '/erreur/ {print $1}' f.txt   # motif PUIS action : la 1re colonne des lignes « erreur »
awk -F';' '$2 &gt; 10' notes.csv     # n'affiche que les lignes dont le 2e champ dépasse 10
awk -F';' '$2 &gt;= 10 {print $1}' notes.csv  # le nom (col.1) des lignes où la note (col.2) &gt;= 10</pre>
<p>La structure d'un programme awk est <code>motif { action }</code> : si le motif est vrai pour la ligne, l'action s'exécute. Motif seul → afficher la ligne ; action seule → l'exécuter sur toutes les lignes.</p>

<h3>5. Faire des calculs (la vraie force d'awk)</h3>
<pre class="pseudo"># Additionner la colonne 2 (des notes séparées par ;) :
awk -F';' '{somme += $2} END {print somme}' notes.csv
# {somme += $2} : à chaque ligne, on ajoute le 2e champ à un accumulateur
# END { … }     : bloc exécuté UNE FOIS, à la toute fin
# → on obtient le total

# Calculer la MOYENNE :
awk -F';' '{somme += $2; n++} END {print somme / n}' notes.csv
# n++ compte les lignes ; à la fin, somme / n = la moyenne</pre>
<div class="tip">Tu reconnais l'accumulateur + compteur des cours de programmation ! awk est en réalité un petit langage complet (variables, conditions, boucles), mais 90 % du temps on l'utilise pour ces gestes simples : extraire une colonne, filtrer, additionner.</div>

<h3>6. Récap de la semaine 2 — la boîte à outils du texte</h3>
<pre class="pseudo">&gt; &gt;&gt; 2&gt; &lt;     # rediriger sorties, erreurs et entrée (leçon 8)
|              # brancher les commandes en chaîne (leçon 9)
grep motif     # filtrer les lignes (leçon 10)
* ? [ ] { }    # jokers pour viser des fichiers (leçon 11)
cut -d -f      # extraire des colonnes (leçon 12)
sort  uniq     # trier, dédoublonner, compter (leçon 12)
sed 's/x/y/g'  # remplacer en masse (leçon 13)
awk '{...}'    # colonnes, filtres et calculs (leçon 14)</pre>
<div class="tip">Le motif récurrent de la semaine : <strong>une source</strong> (cat, ls, un fichier) → <strong>des filtres</strong> reliés par des tubes (grep, cut, sort, sed, awk) → <strong>une sortie</strong> (écran, ou fichier via &gt;). Avec ces briques, tu traites des données sans écrire de programme.</div>`,
  exercises: [

    { type: "qcm", q: "Que désigne <code>$0</code> dans awk ?", opts: ["Rien", "La LIGNE entière", "Le nombre de champs", "Le 1er caractère"], a: 1, exp: "$0 = toute la ligne courante." },

    { type: "qcm", q: "<code>awk 'END {print NR}' f.txt</code> donne…", opts: ["La 1re ligne", "Le nombre total de lignes (comme wc -l)", "Le dernier champ", "Rien"], a: 1, exp: "À la fin, NR = nombre de lignes traitées." },
    { type: "qcm", q: "La structure d'un programme awk est…", opts: ["action ; motif", "motif { action } : si le motif est vrai, l'action s'exécute", "seulement des motifs", "seulement du texte"], a: 1, exp: "motif { action } : le cœur d'awk." },
    { type: "qcm", q: "<code>awk -F';' '$2 &gt; 10' notes.csv</code> affiche…", opts: ["Toutes les lignes", "Les lignes dont le 2e champ est supérieur à 10", "La colonne 2", "Le total"], a: 1, exp: "Motif conditionnel : filtre selon la valeur du champ." },
    { type: "qcm", q: "<code>awk -F';' '{s += $2} END {print s}'</code> calcule…", opts: ["Le nombre de lignes", "La SOMME de la colonne 2", "La moyenne", "Le maximum"], a: 1, exp: "Accumulateur s += $2, affiché à la fin : le total." },
    { type: "qcm", q: "Pour la MOYENNE de la colonne 2, on ajoute…", opts: ["Rien", "Un compteur n++ et on divise : END {print s/n}", "Un tri", "grep"], a: 1, exp: "Somme / nombre de lignes = moyenne." },
    { type: "input", q: "Quelle action awk affiche le 1er champ de chaque ligne ? awk '{print …}'", a: ["$1", "print $1"], ph: "…", exp: "awk '{print $1}'." },
    { type: "vf", q: "awk peut faire ce que grep fait (filtrer par motif) ET, en plus, calculer sur des colonnes.", a: true, exp: "awk '/motif/' filtre ; awk sait aussi additionner, compter, comparer." },
    { type: "qcm", q: "cut et awk se ressemblent pour extraire une colonne. L'avantage d'awk ?", opts: ["Il est plus court à écrire", "Il peut EN PLUS filtrer, comparer et calculer", "Il trie automatiquement", "Il n'a pas de séparateur"], a: 1, exp: "awk est un mini-langage : colonnes + conditions + calculs." }
  ],
  final: {
    title: "Exercice final — Bulletin de notes en une ligne",
    intro: `<p>Un fichier <code>classe.csv</code> a des lignes <code>nom;note</code>, par exemple <code>Ana;14</code>. Aurélia veut l'exploiter avec awk.</p>`,
    questions: [
      { type: "qcm", q: "Afficher seulement les noms (colonne 1) :", opts: ["awk -F';' '{print $1}' classe.csv", "awk '{print $2}'", "cut -c1", "sort classe.csv"], a: 0, exp: "-F';' puis print $1 = la colonne des noms." },
      { type: "qcm", q: "Afficher le nom des élèves ayant la moyenne (note &gt;= 10) :", opts: ["awk -F';' '$2 &gt;= 10 {print $1}' classe.csv", "grep 10 classe.csv", "cut -f1", "sort -n"], a: 0, exp: "Motif conditionnel $2 &gt;= 10, action print $1." },
      { type: "qcm", q: "Calculer la somme de toutes les notes :", opts: ["awk -F';' '{s+=$2} END{print s}' classe.csv", "wc -l classe.csv", "sort -n", "cut -f2"], a: 0, exp: "Accumulateur sur le champ 2, affiché en END." },
      { type: "input", q: "Pour la MOYENNE, on ajoute un compteur n++ et on affiche à la fin : END{print s/…}", a: "n", ph: "une variable", exp: "s/n = somme divisée par le nombre de lignes." },
      { type: "qcm", q: "Compter le nombre d'élèves (lignes) avec awk :", opts: ["awk 'END{print NR}' classe.csv", "awk '{print $1}'", "cut -f1", "grep -c ;"], a: 0, exp: "NR en END = nombre total de lignes." }
    ],
    solution: `<pre class="pseudo">Noms          : awk -F';' '{print $1}' classe.csv
Reçus (&gt;=10)   : awk -F';' '$2 >= 10 {print $1}' classe.csv
Somme         : awk -F';' '{s+=$2} END{print s}' classe.csv
Moyenne       : awk -F';' '{s+=$2; n++} END{print s/n}' classe.csv
Nombre d'élèves: awk 'END{print NR}' classe.csv

Semaine 2 bouclée : redirections, tubes, grep, jokers,
cut/sort/uniq, sed, awk. Tu manipules le texte comme un pro.</pre>
<p>Fin de la semaine 2. Demain (leçon 15) : les utilisateurs et les groupes — on entre dans l'administration.</p>`
  }
};
