<script>
var DAY = {
  num: 31,
  title: "Examen final et projet : sauvegarde",
  subtitle: "Tout assembler dans un vrai script d'administration.",
  theory: `
<h3>1. Le chemin parcouru en 31 leçons</h3>
<pre class="pseudo"># Semaine 1 — Terminal & fichiers   : pwd ls cd mkdir cp mv rm cat less head tail man
# Semaine 2 — Texte & filtres        : &gt; &gt;&gt; | grep * ? [] cut sort uniq sed awk
# Semaine 3 — Droits & processus     : users/groupes chmod chown sudo ps top kill ln find
# Semaine 4 — Scripting Bash         : script variables conditions boucles fonctions cron
# Semaine 5 — Administration & réseau: apt systemd/journalctl ssh scp curl PATH</pre>
<p>Tu as tout ce qu'il faut pour écrire un vrai <strong>script d'administration</strong>. Le projet du jour rassemble ces briques dans un outil que de vrais serveurs utilisent : une <strong>sauvegarde automatique</strong>.</p>

<h3>2. Compresser une archive : tar</h3>
<p>Un dernier outil, indispensable pour sauvegarder : <code>tar</code> regroupe un dossier entier en un seul fichier d'archive, souvent compressé (<code>.tar.gz</code>).</p>
<pre class="pseudo">tar -czf archive.tar.gz dossier/   # CRÉER : c=create, z=compresser (gzip), f=fichier de sortie
tar -tzf archive.tar.gz            # LISTER le contenu de l'archive (t=list)
tar -xzf archive.tar.gz           # EXTRAIRE (x=extract) le contenu
# Mémo : « czf pour créer, xzf pour extraire »</pre>

<h3>3. Le projet : un script de sauvegarde complet</h3>
<pre class="pseudo">#!/bin/bash
# sauvegarde.sh — archive ~/Documents et purge les vieilles sauvegardes

SOURCE="$HOME/Documents"                 # dossier à sauvegarder (variable, leçon 23)
DEST="$HOME/sauvegardes"                 # où ranger les archives
DATE=$(date +%F_%H-%M)                    # horodatage capturé : ex. 2024-06-01_14-30
ARCHIVE="$DEST/documents_$DATE.tar.gz"    # nom d'archive unique grâce à la date

mkdir -p "$DEST"                          # crée le dossier de destination si absent (leçon 4)

if [ ! -d "$SOURCE" ]; then               # cas limite : la source existe-t-elle ? (leçon 24)
    echo "Erreur : $SOURCE introuvable"
    exit 1                                # sortie en erreur
fi

tar -czf "$ARCHIVE" "$SOURCE"             # créer l'archive compressée
echo "Sauvegarde créée : $ARCHIVE"

# Purge : supprimer les archives de plus de 30 jours (leçon 20)
find "$DEST" -name "documents_*.tar.gz" -mtime +30 -exec rm {} \\;

echo "Sauvegarde terminée."
exit 0                                    # succès</pre>
<div class="tip">Compte les leçons réunies ici : variables (23), <code>$(...)</code> (23), <code>mkdir -p</code> (4), condition et code de sortie (24), <code>tar</code> (31), <code>find … -exec</code> (20). Un script utile n'est qu'un assemblage de gestes que tu connais déjà.</div>

<h3>4. L'automatiser avec cron</h3>
<pre class="pseudo">chmod +x ~/scripts/sauvegarde.sh          # rendre exécutable (leçon 16)

crontab -e                                # puis ajouter la ligne (leçon 27) :
0 2 * * *  /home/aurelia/scripts/sauvegarde.sh &gt;&gt; /home/aurelia/logs/sauvegarde.log 2&gt;&amp;1
# → chaque nuit à 2h00, chemin absolu, sortie et erreurs journalisées</pre>
<p>Voilà une sauvegarde <strong>autonome</strong> : elle tourne seule, garde une trace, et fait le ménage des vieilles archives. C'est exactement ce qu'un administrateur met en place sur un serveur.</p>

<h3>5. Les bonnes habitudes à emporter</h3>
<pre class="pseudo"># 1. Vérifier avant d'agir (ls, [ -d ], -exec après un find de contrôle)
# 2. Chemins absolus dans les scripts et les tâches cron
# 3. Journaliser (&gt;&gt; log 2&gt;&amp;1) pour savoir ce qui s'est passé
# 4. Codes de sortie clairs (exit 0 succès, exit 1 erreur)
# 5. rm est définitif : relire la cible, toujours</pre>

<h3>6. Et après ce cours ?</h3>
<p>Tu maîtrises le terminal, les filtres de texte, l'administration de base et le scripting Bash — le socle réutilisé partout : serveurs, conteneurs Docker, intégration continue, cloud. Les suites naturelles : approfondir Bash, découvrir la conteneurisation (Docker), ou l'automatisation d'infrastructure (Ansible). Mais tout part de ce que tu viens d'apprendre.</p>
<div class="tip">Passe l'examen ci-dessous sans regarder tes notes : c'est le meilleur moyen de mesurer ce qui est acquis. Puis réalise le projet de sauvegarde dans un vrai terminal. Bravo pour ces 31 leçons !</div>`,

    { type: "input", q: "Semaine 1 — Quelle commande affiche le dossier courant ?", a: "pwd", ph: "une commande", exp: "pwd = print working directory." },
    { type: "qcm", q: "Semaine 1 — Supprimer un dossier et tout son contenu :", opts: ["rmdir dossier", "rm -r dossier", "rm dossier", "mv dossier"], a: 1, exp: "rm -r (récursif). rmdir n'agit que sur les dossiers vides." },
    { type: "qcm", q: "Semaine 2 — <code>ls | wc -l</code> utilise…", opts: ["Une redirection vers un fichier", "Un TUBE reliant ls à wc -l", "Un joker", "Une variable"], a: 1, exp: "Le tube | branche la sortie de ls sur wc -l." },
    { type: "qcm", q: "Semaine 2 — Ne garder que les lignes contenant « erreur » :", opts: ["sort erreur", "grep \"erreur\" fichier", "cut erreur", "wc erreur"], a: 1, exp: "grep filtre les lignes par motif." },
    { type: "input", q: "Semaine 2 — Opérateur qui AJOUTE la sortie à la fin d'un fichier (deux caractères) :", a: ">>", ph: "un opérateur", exp: ">> ajoute sans écraser." },
    { type: "input", q: "Semaine 3 — En octal, droits d'un script exécutable rwx r-x r-x :", a: "755", ph: "trois chiffres", exp: "755 = rwx r-x r-x." },
    { type: "qcm", q: "Semaine 3 — Retrouver un processus firefox et son PID :", opts: ["kill firefox", "ps aux | grep firefox", "top firefox", "find firefox"], a: 1, exp: "ps aux | grep firefox." },
    { type: "qcm", q: "Semaine 3 — Trouver les .log de plus de 30 jours et les supprimer :", opts: ["grep -r log", "find . -name \"*.log\" -mtime +30 -exec rm {} \\;", "rm *.log", "ls -R"], a: 1, exp: "find par critères + -exec rm." },
    { type: "qcm", q: "Semaine 4 — Dans un script, que vaut <code>$1</code> ?", opts: ["Le nom du script", "Le 1er argument passé", "Le code de sortie", "Le nombre d'arguments"], a: 1, exp: "$1 = premier argument ; $0 = nom du script ; $# = nombre." },
    { type: "qcm", q: "Semaine 4 — Quelle boucle applique une action à tous les *.txt ?", opts: ["for f in *.txt; do … done", "if [ *.txt ]", "case *.txt", "while true"], a: 0, exp: "for f in *.txt parcourt les fichiers." },
    { type: "input", q: "Semaine 4 — Quel mot-clé ferme un bloc if ?", a: "fi", ph: "un mot-clé", exp: "fi ferme le if ; done ferme les boucles ; esac le case." },
    { type: "qcm", q: "Semaine 4 — <code>0 2 * * *</code> en cron signifie…", opts: ["Toutes les 2 minutes", "Tous les jours à 2h00", "Le 2 du mois", "Au démarrage"], a: 1, exp: "minute 0, heure 2, tous les jours." },
    { type: "input", q: "Semaine 5 — Installer un paquet nommé htop : sudo apt … htop", a: "install", ph: "un mot", exp: "sudo apt install htop." },
    { type: "qcm", q: "Semaine 5 — Se connecter à un serveur distant en tant qu'admin :", opts: ["scp admin@serveur", "ssh admin@serveur", "curl admin", "ping admin"], a: 1, exp: "ssh utilisateur@hôte ouvre une session distante chiffrée." },
    { type: "qcm", q: "Projet — Quelle commande crée une archive compressée d'un dossier ?", opts: ["tar -xzf archive.tar.gz", "tar -czf archive.tar.gz dossier/", "tar -tzf", "zip dossier"], a: 1, exp: "czf = create + gzip + file : créer l'archive." }
  ],
  final: {
    title: "Projet final — Le script de sauvegarde autonome",
    intro: `<p>Étudie ce script <code>sauvegarde.sh</code>, qui archive un dossier puis purge les vieilles archives :</p>
<pre class="pseudo">#!/bin/bash
SOURCE="$HOME/Documents"
DEST="$HOME/sauvegardes"

    questions: [
      { type: "qcm", q: "Que contient la variable <code>DATE</code> ?", opts: ["Le texte « date +%F »", "La date du jour, capturée par $(date +%F)", "Rien", "Le nom du script"], a: 1, exp: "$(...) exécute date +%F et range sa sortie (ex. 2024-06-01)." },
      { type: "qcm", q: "À quoi sert <code>mkdir -p \"$DEST\"</code> ?", opts: ["À supprimer DEST", "À créer le dossier de destination s'il n'existe pas encore", "À l'archiver", "À le lister"], a: 1, exp: "-p crée le dossier sans erreur s'il existe déjà." },
      { type: "qcm", q: "Que teste <code>if [ ! -d \"$SOURCE\" ]</code> ?", opts: ["Si la source est un fichier", "Si le dossier source N'existe PAS (alors on sort en erreur)", "Si on est root", "Si l'archive existe"], a: 1, exp: "! -d = « n'est pas un dossier » : cas limite avant d'agir." },
      { type: "qcm", q: "Rôle de <code>tar -czf \"$ARCHIVE\" \"$SOURCE\"</code> ?", opts: ["Extraire l'archive", "CRÉER l'archive compressée du dossier source", "Lister l'archive", "Supprimer la source"], a: 1, exp: "czf = create + gzip + file." },
      { type: "qcm", q: "Que fait la ligne <code>find \"$DEST\" -name \"docs_*.tar.gz\" -mtime +30 -exec rm {} \\;</code> ?", opts: ["Crée des archives", "Supprime les archives de plus de 30 jours (purge automatique)", "Les liste", "Les renomme"], a: 1, exp: "find + -mtime +30 + -exec rm : ménage des vieilles sauvegardes." }
    ],
    solution: `<pre class="pseudo">Variables (23) + $(date) (23) + mkdir -p (4) + condition/exit (24)
+ tar (31) + find -exec (20) = un outil d'administration réel.

Pour l'automatiser (27) :
