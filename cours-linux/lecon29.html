<script>
var DAY = {
  num: 29,
  title: "Services et journaux : systemd",
  subtitle: "Piloter ce qui tourne en arrière-plan.",
  theory: `
<h3>1. Qu'est-ce qu'un service ?</h3>
<p>Un <strong>service</strong> (ou <em>daemon</em>) est un programme qui tourne en <strong>arrière-plan</strong>, sans interface : un serveur web (nginx, apache), une base de données, le service SSH qui accepte les connexions à distance… Sur les Linux modernes, tous ces services sont gérés par <strong>systemd</strong>, le premier processus lancé au démarrage (PID 1), chef d'orchestre du système.</p>
<p>On pilote systemd avec la commande <code>systemctl</code>. Chaque service est une <strong>unit</strong>, dont le nom finit souvent par <code>.service</code>.</p>

<h3>2. Voir l'état d'un service</h3>
<pre class="pseudo">systemctl status ssh      # état détaillé : actif ou non, PID, dernières lignes de log
systemctl is-active ssh   # réponse courte : active / inactive
systemctl is-enabled ssh  # démarrera-t-il automatiquement au boot ? enabled / disabled
systemctl list-units --type=service   # tous les services et leur état</pre>
<p>La consultation de l'état ne demande pas de privilège ; <strong>agir</strong> sur un service, si.</p>

<h3>3. Démarrer, arrêter, redémarrer</h3>
<pre class="pseudo">sudo systemctl start nginx      # DÉMARRE le service maintenant
sudo systemctl stop nginx       # l'ARRÊTE maintenant
sudo systemctl restart nginx    # l'arrête puis le relance (après un changement de config)
sudo systemctl reload nginx     # recharge la config SANS couper le service (si supporté)</pre>

<h3>4. La distinction cruciale : start ≠ enable</h3>
<pre class="pseudo">sudo systemctl start nginx    # le lance MAINTENANT (mais pas au prochain démarrage)
sudo systemctl enable nginx   # le programme pour démarrer AUTOMATIQUEMENT à chaque boot
sudo systemctl disable nginx  # l'empêche de démarrer au boot (n'agit pas sur l'état actuel)
sudo systemctl enable --now nginx   # enable ET start en une commande</pre>
<div class="warn">Ne confonds pas ces deux plans : <strong>start/stop</strong> agissent sur l'instant présent ; <strong>enable/disable</strong> décident du comportement au <strong>démarrage</strong> de la machine. Un service peut être « démarré maintenant mais pas au boot », ou l'inverse. Pour « qu'il tourne tout de suite ET à chaque redémarrage », c'est <code>enable --now</code>.</div>

<h3>5. Lire les journaux : journalctl</h3>
<p>systemd centralise les logs de tous les services dans un journal, consultable avec <code>journalctl</code> :</p>
<pre class="pseudo">journalctl -u ssh          # les logs du SERVICE ssh uniquement (-u = unit)
journalctl -u ssh -f       # -f = suivre en DIRECT (comme tail -f), Ctrl+C pour sortir
journalctl -u nginx --since "today"       # depuis aujourd'hui
journalctl --since "2024-01-01 08:00"     # depuis une date/heure précise
journalctl -b              # les logs depuis le dernier DÉMARRAGE (boot)
journalctl -p err          # seulement les messages de priorité « erreur » et au-dessus</pre>
<div class="tip">Quand un service refuse de démarrer, le réflexe est : <code>systemctl status nom</code> pour l'état résumé, puis <code>journalctl -u nom</code> pour le détail des erreurs. C'est là que se trouve la cause 9 fois sur 10.</div>

<h3>6. Le mémo</h3>
<pre class="pseudo">systemctl status/start/stop/restart nom   # état et contrôle immédiat
systemctl enable/disable nom              # au démarrage (boot) ou non
systemctl enable --now nom                # les deux d'un coup
journalctl -u nom [-f] [--since …]        # lire les journaux du service
# Diagnostiquer : status → journalctl -u nom</pre>`,
  exercises: [
    { type: "qcm", q: "Un « service » (daemon) est…", opts: ["Une commande interactive", "Un programme qui tourne en ARRIÈRE-PLAN, sans interface (serveur web, ssh…)", "Un fichier de config", "Un utilisateur"], a: 1, exp: "Les daemons tournent en fond ; systemd les gère." },
    { type: "qcm", q: "Quel programme gère les services sur les Linux modernes ?", opts: ["cron", "systemd (via systemctl)", "bash", "apt"], a: 1, exp: "systemd = PID 1, piloté par systemctl." },
    { type: "input", q: "Quelle commande affiche l'état détaillé du service ssh ?", a: ["systemctl status ssh", "systemctl status"], ph: "systemctl …", exp: "systemctl status ssh." },
    { type: "qcm", q: "<code>sudo systemctl start nginx</code> fait…", opts: ["Programme nginx au démarrage", "DÉMARRE nginx maintenant", "Supprime nginx", "Affiche ses logs"], a: 1, exp: "start = lancer immédiatement." },
    { type: "qcm", q: "<code>sudo systemctl enable nginx</code> fait…", opts: ["Démarre nginx maintenant", "Le programme pour démarrer AUTOMATIQUEMENT à chaque boot", "L'arrête", "Le redémarre"], a: 1, exp: "enable = activer au démarrage (pas maintenant)." },
    { type: "qcm", q: "Différence entre start et enable ?", opts: ["Aucune", "start = maintenant ; enable = au prochain démarrage (boot)", "enable est plus rapide", "start agit au boot"], a: 1, exp: "Instant présent vs comportement au démarrage." },
    { type: "qcm", q: "Pour lancer un service MAINTENANT ET à chaque démarrage :", opts: ["systemctl start", "systemctl enable --now nom", "systemctl status", "systemctl disable"], a: 1, exp: "enable --now combine enable et start." },
    { type: "qcm", q: "Après avoir modifié la config d'un service, on fait souvent…", opts: ["systemctl status", "systemctl restart (ou reload) nom", "systemctl disable", "rien"], a: 1, exp: "restart applique la nouvelle config ; reload sans coupure si supporté." },
    { type: "qcm", q: "Quelle commande lit les journaux du service ssh ?", opts: ["journalctl -u ssh", "systemctl logs ssh", "cat ssh", "dmesg ssh"], a: 0, exp: "journalctl -u ssh (-u = unit)." },
    { type: "qcm", q: "À quoi sert <code>journalctl -u nginx -f</code> ?", opts: ["Supprime les logs", "Suit les logs de nginx EN DIRECT (comme tail -f)", "Redémarre nginx", "Compte les lignes"], a: 1, exp: "-f = suivre en temps réel." },
    { type: "qcm", q: "<code>journalctl -b</code> affiche…", opts: ["Tous les logs de l'histoire", "Les logs depuis le dernier DÉMARRAGE (boot)", "Seulement nginx", "Rien"], a: 1, exp: "-b = current boot." },
    { type: "qcm", q: "Un service refuse de démarrer. Le réflexe de diagnostic :", opts: ["Réinstaller Linux", "systemctl status nom, puis journalctl -u nom pour voir l'erreur", "rm -rf", "Ignorer"], a: 1, exp: "status résume, journalctl détaille la cause." },
    { type: "input", q: "Quelle option de journalctl cible UN service précis (une unit) ?", a: ["-u", "u"], ph: "une option", exp: "-u nom = les logs de cette unit." },
    { type: "qcm", q: "<code>systemctl is-enabled ssh</code> répond à la question…", opts: ["Est-il actif maintenant ?", "Démarrera-t-il automatiquement au boot ?", "Combien de logs ?", "Quel PID ?"], a: 1, exp: "is-enabled = comportement au démarrage ; is-active = état actuel." },
    { type: "vf", q: "Consulter l'état d'un service (status) ne demande pas sudo, mais le démarrer/arrêter, si.", a: true, exp: "Lire l'état = anodin ; agir sur le service = privilégié." }
  ],
  final: {
    title: "Exercice final — Mettre en service un serveur web",
    intro: `<p>Aurélia installe nginx et veut qu'il tourne maintenant ET à chaque redémarrage, puis diagnostiquer un souci.</p>`,
    questions: [
      { type: "qcm", q: "Vérifier si nginx est déjà actif :", opts: ["systemctl status nginx", "systemctl disable nginx", "journalctl -b", "apt show nginx"], a: 0, exp: "status (ou is-active) donne l'état." },
      { type: "qcm", q: "Le lancer maintenant ET l'activer au démarrage en une commande :", opts: ["sudo systemctl start nginx", "sudo systemctl enable --now nginx", "sudo systemctl disable nginx", "sudo systemctl stop nginx"], a: 1, exp: "enable --now = start + enable." },
      { type: "qcm", q: "Après avoir modifié sa configuration, appliquer les changements :", opts: ["sudo systemctl restart nginx", "systemctl status", "journalctl", "apt update"], a: 0, exp: "restart relance avec la nouvelle config." },
      { type: "qcm", q: "nginx ne démarre pas : où chercher la cause ?", opts: ["journalctl -u nginx", "ls /home", "apt search nginx", "whoami"], a: 0, exp: "journalctl -u nginx montre les erreurs du service." },
      { type: "input", q: "Suivre EN DIRECT les logs de nginx : journalctl -u nginx …", a: ["-f", "f"], ph: "une option", exp: "-f suit en temps réel." }
    ],
    solution: `<pre class="pseudo">systemctl status nginx            → état actuel
sudo systemctl enable --now nginx → démarre + active au boot
sudo systemctl restart nginx      → après un changement de config
journalctl -u nginx               → diagnostiquer un échec
journalctl -u nginx -f            → suivre en direct

start/stop = maintenant · enable/disable = au boot · journalctl = les logs.</pre>
<p>Tu pilotes les services. Demain : le réseau, se connecter à distance et récupérer des données.</p>`
  }
};
</script>
