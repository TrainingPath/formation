<script>
var DAY = {
  num: 2,
  title: "Naviguer : pwd, ls, cd",
  subtitle: "Se déplacer dans l'arborescence sans jamais se perdre.",
  theory: `
<h3>1. Où suis-je ? pwd</h3>
<p>Le système de fichiers de Linux est un <strong>arbre</strong> : il part d'une racine unique notée <code>/</code>, et chaque dossier peut en contenir d'autres. À tout instant, ton shell est « posé » dans un dossier : le <strong>répertoire courant</strong>.</p>
<pre class="pseudo">pwd           # « print working directory » : affiche le chemin du dossier où tu es</pre>

<h3>2. Que contient ce dossier ? ls</h3>
<p><code>ls</code> (list) affiche le contenu du dossier courant. Ses options changent la quantité de détails :</p>
<pre class="pseudo">ls            # liste simple : juste les noms
ls -l         # format LONG : droits, propriétaire, taille, date, nom (une ligne par élément)
ls -a         # AFFICHE AUSSI les fichiers cachés (ceux dont le nom commence par un point)
ls -h         # tailles « human readable » : 4,0K, 2,3M au lieu d'octets bruts
ls -lh        # on COMBINE : format long + tailles lisibles
ls -lt        # trié par date de modification (le plus récent en haut)
ls -R         # récursif : descend aussi dans les sous-dossiers</pre>
<div class="tip">Un fichier « caché » n'a rien de secret : c'est juste un fichier dont le nom débute par un point, comme <code>.bashrc</code>. On les cache car ce sont en général des fichiers de configuration qu'on ne veut pas voir tout le temps. <code>ls -a</code> les révèle.</div>

<h3>3. Se déplacer : cd</h3>
<p><code>cd</code> (change directory) déplace ton shell dans un autre dossier.</p>
<pre class="pseudo">cd Documents      # entre dans le sous-dossier Documents du dossier courant
cd /etc           # va directement dans /etc (chemin ABSOLU, part de la racine /)
cd ..             # remonte d'un cran vers le dossier PARENT
cd ~              # retourne dans ton dossier personnel (/home/toi)
cd                # (sans rien) fait la même chose : retour maison
cd -              # revient au dossier PRÉCÉDENT (comme « page précédente »)</pre>

<h3>4. Chemin absolu ou chemin relatif ?</h3>
<p>C'est LA notion clé de la navigation. Il existe deux façons de désigner un fichier :</p>
<pre class="pseudo"># ABSOLU : part toujours de la racine /. Fonctionne d'où que tu sois.
cd /home/aurelia/Documents

# RELATIF : part du dossier COURANT. Dépend d'où tu te trouves.
cd Documents          # « le Documents d'ICI »
cd ../Images          # remonte d'un cran, puis descend dans Images</pre>
<p>Trois raccourcis reviennent sans cesse dans les chemins relatifs :</p>
<pre class="pseudo"># .    = le dossier courant (ici même)
# ..   = le dossier parent (un cran au-dessus)
# ~    = mon dossier personnel</pre>
<div class="warn">Erreur classique du débutant : oublier qu'un chemin relatif dépend de l'endroit où l'on est. Si <code>cd Documents</code> répond « No such file or directory », commence par <code>pwd</code> et <code>ls</code> pour vérifier où tu es et ce qui existe autour.</div>

<h3>5. La boucle de survie du terminal</h3>
<p>Perdu ? Trois commandes te resituent toujours :</p>
<pre class="pseudo">pwd           # 1. Où suis-je ?
ls            # 2. Qu'y a-t-il autour de moi ?
cd quelquepart # 3. Je me déplace, puis je recommence à pwd</pre>
<div class="tip">Combine avec la touche <strong>Tab</strong> : tape <code>cd Doc</code> puis Tab, et le shell complète en <code>Documents/</code>. C'est le meilleur antidote aux fautes de frappe.</div>`,
  exercises: [
    { type: "input", q: "Quelle commande affiche le contenu du dossier courant ?", a: "ls", ph: "une commande", exp: "ls = list." },
    { type: "input", q: "Quelle option de ls révèle les fichiers cachés ?", a: ["-a", "a"], ph: "une option", exp: "-a affiche aussi les noms commençant par un point." },
    { type: "qcm", q: "Que fait <code>ls -lh</code> ?", opts: ["Rien de spécial", "Format long AVEC tailles lisibles (K, M, G)", "Liste seulement les dossiers", "Supprime des fichiers"], a: 1, exp: "-l = long, -h = human readable, combinés." },
    { type: "qcm", q: "Un fichier nommé <code>.bashrc</code> est…", opts: ["Un virus", "Un fichier caché (nom qui commence par un point)", "Un dossier système", "Illégal"], a: 1, exp: "Le point initial le rend caché ; ls -a le montre." },
    { type: "input", q: "Quelle commande remonte au dossier parent (un cran au-dessus) ?", a: ["cd ..", "cd.."], ph: "cd …", exp: ".. désigne le dossier parent." },
    { type: "input", q: "Quelle commande te ramène dans ton dossier personnel (sans argument) ?", a: "cd", ph: "une commande", exp: "cd seul, ou cd ~, retourne à la maison." },
    { type: "qcm", q: "<code>/home/aurelia/Documents</code> est un chemin…", opts: ["Relatif", "Absolu (il part de la racine /)", "Caché", "Invalide"], a: 1, exp: "Il commence par / : c'est un chemin absolu, valable de partout." },
    { type: "qcm", q: "<code>cd Documents</code> (sans slash au début) est un chemin…", opts: ["Absolu", "Relatif : « le Documents d'ici »", "Interdit", "Un fichier"], a: 1, exp: "Sans / initial, c'est relatif au dossier courant." },
    { type: "qcm", q: "Que signifie <code>.</code> (un point) dans un chemin ?", opts: ["Le dossier parent", "Le dossier courant (ici même)", "Un fichier caché", "La racine"], a: 1, exp: ". = ici ; .. = le parent." },
    { type: "input", q: "Quel raccourci d'un caractère désigne ton dossier personnel dans un chemin ?", a: "~", ph: "un symbole", exp: "~ correspond à /home/ton-nom." },
    { type: "qcm", q: "<code>cd -</code> (cd tiret) fait…", opts: ["Une erreur", "Revenir au dossier PRÉCÉDENT", "Remonter à la racine", "Effacer l'écran"], a: 1, exp: "cd - bascule vers le dernier dossier visité." },
    { type: "qcm", q: "Tu es dans <code>/home/aurelia</code>. Après <code>cd ..</code>, tu es dans…", opts: ["/home/aurelia/..", "/home", "/", "/root"], a: 1, exp: "Un cran au-dessus de /home/aurelia, c'est /home." },
    { type: "input", q: "Quelle option de ls trie par date, le plus récent en haut ?", a: ["-t", "t"], ph: "une option", exp: "-t = trier par date de modification (souvent avec -l : -lt)." },
    { type: "vf", q: "Un chemin relatif donne le même résultat quel que soit le dossier où l'on se trouve.", a: false, exp: "Non : le relatif DÉPEND du dossier courant. C'est l'absolu qui est universel." },
    { type: "qcm", q: "La « boucle de survie » quand on est perdu, c'est…", opts: ["exit puis reconnexion", "pwd (où suis-je) → ls (quoi autour) → cd (je bouge)", "clear en boucle", "rm -rf"], a: 1, exp: "pwd + ls te resituent toujours avant de te déplacer." }
  ],
  final: {
    title: "Exercice final — Un parcours dans l'arbre",
    intro: `<p>Aurélia part de son dossier personnel et enchaîne :</p>
<pre class="pseudo">aurelia@pc:~$ pwd
/home/aurelia
aurelia@pc:~$ cd Projets
aurelia@pc:~/Projets$ cd ../Documents
aurelia@pc:~/Documents$ cd /etc
aurelia@pc:/etc$ cd ~</pre>`,
    questions: [
      { type: "input", q: "Après <code>cd Projets</code>, quel est le chemin absolu du dossier courant ?", a: "/home/aurelia/Projets", ph: "un chemin", exp: "On est descendu dans Projets depuis /home/aurelia." },
      { type: "input", q: "Après <code>cd ../Documents</code>, où est-elle ? (chemin absolu)", a: "/home/aurelia/Documents", ph: "un chemin", exp: ".. remonte à /home/aurelia, puis on entre dans Documents." },
      { type: "qcm", q: "<code>cd /etc</code> utilise un chemin…", opts: ["Relatif", "Absolu", "Caché", "Invalide"], a: 1, exp: "Il commence par / : absolu. On saute directement dans /etc." },
      { type: "input", q: "Après le dernier <code>cd ~</code>, où se trouve-t-elle ?", a: "/home/aurelia", ph: "un chemin", exp: "~ ramène toujours au dossier personnel." },
      { type: "qcm", q: "Depuis <code>/etc</code>, quelle commande l'aurait aussi ramenée chez elle ?", opts: ["cd ..", "cd (sans argument)", "cd .", "ls"], a: 1, exp: "cd seul = cd ~ = retour maison. cd .. n'aurait donné que /." }
    ],
    solution: `<pre class="pseudo">~ = /home/aurelia
cd Projets        → /home/aurelia/Projets   (relatif : descend)
cd ../Documents   → /home/aurelia/Documents (.. remonte, puis descend)
cd /etc           → /etc                    (absolu : saut direct)
cd ~              → /home/aurelia           (retour maison)

Réflexe : en cas de doute, pwd puis ls avant de bouger.</pre>
<p>Tu navigues sans te perdre. Demain : la carte complète de l'arborescence Linux.</p>`
  }
};
</script>
