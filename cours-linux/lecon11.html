  num: 11,
  title: "Les jokers (globbing)",
  subtitle: "Désigner plusieurs fichiers d'un seul motif.",
  theory: `
<h3>1. Le shell développe les jokers AVANT la commande</h3>
<p>Un <strong>joker</strong> (wildcard) est un caractère spécial que le <strong>shell</strong> remplace par la liste des fichiers correspondants, <em>avant même</em> de lancer la commande. On appelle ce mécanisme le <strong>globbing</strong>.</p>
<pre class="pseudo">ls *.txt
# Le shell voit *.txt, cherche les fichiers correspondants, et REMPLACE :
# ls  devient  ls  notes.txt  rapport.txt  todo.txt
# La commande ls ne voit JAMAIS l'étoile : elle reçoit déjà la vraie liste.</pre>
<div class="tip">Conséquence importante : si aucun fichier ne correspond, le shell laisse le motif tel quel et la commande reçoit littéralement <code>*.txt</code>. D'où des messages parfois surprenants quand un dossier est vide.</div>

<h3>2. Les jokers essentiels</h3>
<pre class="pseudo">*         # zéro, un ou PLUSIEURS caractères quelconques
?         # EXACTEMENT un caractère quelconque
[abc]     # UN caractère parmi a, b ou c
[a-z]     # UN caractère dans l'intervalle a..z (idem [0-9] pour un chiffre)
[!abc]    # UN caractère qui n'est NI a, NI b, NI c (négation)</pre>
<pre class="pseudo">ls *.txt         # tous les fichiers finissant par .txt
ls photo?.jpg    # photo1.jpg, photoA.jpg… (un seul caractère après « photo »)
ls fichier[123].txt   # fichier1.txt, fichier2.txt ou fichier3.txt
ls [A-Z]*        # tous les noms COMMENÇANT par une majuscule
ls *.[jJ]pg      # .jpg ou .Jpg (une lettre parmi j ou J)</pre>

<h3>3. L'accolade : générer des variantes</h3>
<p>L'<strong>expansion d'accolades</strong> ne cherche pas de fichiers existants : elle <strong>génère</strong> du texte.</p>
<pre class="pseudo">touch fichier{1,2,3}.txt     # crée fichier1.txt fichier2.txt fichier3.txt
mkdir projet/{src,docs,test} # crée d'un coup trois sous-dossiers
cp rapport.txt rapport.{txt,bak}  # (astuce) duplique en .bak
echo image.{jpg,png,gif}     # affiche : image.jpg image.png image.gif</pre>
<div class="warn">Différence clé : <code>*</code>, <code>?</code>, <code>[ ]</code> désignent des fichiers qui EXISTENT DÉJÀ ; l'accolade <code>{ }</code> FABRIQUE des noms, qu'ils existent ou non. On combine souvent l'accolade avec <code>touch</code> ou <code>mkdir</code> pour créer en série.</div>

<h3>4. Jokers puissants et prudents</h3>
<pre class="pseudo">cp *.jpg images/         # copier toutes les images .jpg vers images/
mv rapport_2023* archives/  # déplacer tout ce qui commence par « rapport_2023 »
rm *.tmp                 # supprimer tous les fichiers temporaires .tmp</pre>
<div class="warn">⚠️ Avec <code>rm</code>, un joker est à double tranchant. <code>rm *</code> supprime TOUT le dossier. Pire, <code>rm * .txt</code> (avec une espace de trop) est compris comme « supprime tout, puis un fichier nommé .txt » : catastrophe. <strong>Vérifie toujours avec <code>ls</code> d'abord</strong> : remplace mentalement <code>rm</code> par <code>ls</code> pour voir ce qui serait visé.</div>

<h3>5. Joker (shell) ou regex (grep) ?</h3>
<pre class="pseudo"># GLOBBING (shell, sur des NOMS de fichiers) :
ls *.txt          # * = n'importe quelle suite de caractères
# REGEX (grep, dans le CONTENU) :
grep "a.*b" f     # .* = n'importe quelle suite ; * répète le caractère précédent</pre>
<p>Même symbole <code>*</code>, sens différent : côté shell il vaut « n'importe quels caractères » ; côté regex il signifie « le caractère d'avant, répété ». Garde bien les deux mondes séparés dans ta tête.</p>`,
  exercises: [
    { type: "qcm", q: "Qui remplace <code>*.txt</code> par la liste des fichiers ?", opts: ["La commande ls elle-même", "Le shell, AVANT de lancer la commande (globbing)", "Le noyau", "grep"], a: 1, exp: "Le shell développe le joker en amont ; la commande reçoit la vraie liste." },
    { type: "qcm", q: "Le joker <code>*</code> correspond à…", opts: ["Exactement un caractère", "Zéro, un ou plusieurs caractères quelconques", "Un chiffre", "La fin de ligne"], a: 1, exp: "* = n'importe quelle suite (y compris vide) de caractères." },
    { type: "qcm", q: "Le joker <code>?</code> correspond à…", opts: ["Plusieurs caractères", "Exactement UN caractère quelconque", "Un espace", "Rien"], a: 1, exp: "? = un et un seul caractère." },
    { type: "qcm", q: "<code>ls photo?.jpg</code> peut correspondre à…", opts: ["photo.jpg", "photo12.jpg", "photo1.jpg", "photos.png"], a: 2, exp: "? = un caractère : photo1.jpg, photoA.jpg… mais pas photo12.jpg." },

    { type: "qcm", q: "Différence entre <code>{ }</code> et <code>* ? [ ]</code> ?", opts: ["Aucune", "{ } GÉNÈRE des noms (existants ou non) ; * ? [ ] désignent des fichiers EXISTANTS", "{ } est plus lent", "* fabrique des fichiers"], a: 1, exp: "L'accolade fabrique du texte ; les autres jokers filtrent l'existant." },
    { type: "input", q: "Écris la commande qui crée d'un coup a.txt, b.txt et c.txt avec touch et une accolade.", a: ["touch {a,b,c}.txt", "touch{a,b,c}.txt"], ph: "touch …", exp: "touch {a,b,c}.txt génère les trois noms." },
    { type: "qcm", q: "<code>cp *.jpg images/</code> fait…", opts: ["Copier un fichier nommé *.jpg", "Copier TOUS les fichiers .jpg vers images/", "Supprimer les .jpg", "Rien"], a: 1, exp: "Le shell développe *.jpg en la liste des images." },
    { type: "qcm", q: "Pourquoi <code>rm *</code> est-il dangereux ?", opts: ["Il est lent", "Il supprime TOUT le contenu du dossier, sans corbeille", "Il ne supprime que les fichiers cachés", "Il déplace les fichiers ailleurs"], a: 1, exp: "* = tout ; rm est définitif. Vérifie avec ls d'abord." },
    { type: "qcm", q: "Bonne pratique avant un <code>rm</code> avec joker :", opts: ["Fermer le terminal", "Remplacer rm par ls pour VOIR ce qui serait visé", "Ajouter -f", "Se connecter en root"], a: 1, exp: "ls d'abord montre exactement les fichiers qui seraient ciblés." },
    { type: "vf", q: "Si aucun fichier ne correspond à <code>*.xyz</code>, le shell passe le motif littéral à la commande.", a: true, exp: "Sans correspondance, *.xyz reste tel quel : d'où des erreurs parfois déroutantes." },
    { type: "qcm", q: "Le <code>*</code> du shell et le <code>*</code> d'une regex grep…", opts: ["Sont identiques", "Diffèrent : shell = « n'importe quels caractères », regex = « répéter le caractère précédent »", "N'existent pas", "Servent à trier"], a: 1, exp: "Deux univers : globbing (noms) vs regex (contenu)." }
  ],
  final: {
    title: "Exercice final — Faire le tri avec des jokers",
    intro: `<p>Un dossier contient : <code>rapport1.txt rapport2.txt rapport10.txt note.md photo.jpg photo.png</code>. Aurélia range tout ça.</p>`,
    questions: [
      { type: "qcm", q: "<code>ls rapport?.txt</code> liste…", opts: ["Les 3 rapports", "rapport1.txt et rapport2.txt seulement (un caractère)", "rapport10.txt seulement", "Rien"], a: 1, exp: "? = un seul caractère : rapport10.txt (deux chiffres) est exclu." },
      { type: "qcm", q: "<code>ls rapport*.txt</code> liste…", opts: ["rapport1 et rapport2 seulement", "les 3 : rapport1.txt, rapport2.txt et rapport10.txt", "note.md", "photo.jpg"], a: 1, exp: "* accepte plusieurs caractères, donc aussi rapport10.txt." },
      { type: "input", q: "Quel motif désigne les DEUX photos (photo.jpg et photo.png) ? Complète : photo.*", a: ["photo.*", "photo.???", "photo.jpg photo.png"], ph: "un motif", exp: "photo.* correspond aux deux extensions." },
      { type: "qcm", q: "Pour copier les deux images vers un dossier images/ :", opts: ["cp photo.* images/", "cp photo? images/", "mv note.md images/", "rm photo.*"], a: 0, exp: "photo.* vise photo.jpg et photo.png." },
      { type: "qcm", q: "Avant <code>rm rapport*.txt</code>, quel geste de prudence ?", opts: ["Rien", "Taper d'abord ls rapport*.txt pour voir les fichiers visés", "Ajouter -rf", "Passer root"], a: 1, exp: "ls avec le même motif révèle exactement ce que rm supprimerait." }
    ],
    solution: `<pre class="pseudo">rapport?.txt   → rapport1.txt, rapport2.txt        (? = 1 caractère)
rapport*.txt   → + rapport10.txt                    (* = plusieurs)
photo.*        → photo.jpg, photo.png
cp photo.* images/     → copie les deux images
Avant rm : ls MÊME-MOTIF pour vérifier la cible

* = plusieurs   ? = un   [ ] = un parmi   { } = générer</pre>
<p>Tu vises juste avec les jokers. Demain : couper, trier et dédoublonner avec cut, sort et uniq.</p>`
  }
};
