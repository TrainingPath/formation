  num: 26,
  title: "Fonctions, read et case",
  subtitle: "Organiser le code, dialoguer, choisir.",
  theory: `
<h3>1. Les fonctions : donner un nom à un bloc</h3>
<p>Une <strong>fonction</strong> regroupe des commandes sous un nom, qu'on rappelle ensuite autant de fois qu'on veut. C'est le même principe que dans les autres cours : éviter la répétition et clarifier le code.</p>
<pre class="pseudo">saluer() {                 # définition : nom suivi de () puis d'un bloc { … }
    echo "Bonjour !"
}

saluer                     # appel : on écrit juste le nom (sans parenthèses)
saluer                     # on peut l'appeler autant de fois qu'on veut</pre>

<h3>2. Des arguments dans les fonctions</h3>
<p>À l'intérieur d'une fonction, <code>$1</code>, <code>$2</code>… désignent les arguments passés <strong>à la fonction</strong> (pas au script) :</p>
<pre class="pseudo">saluer() {
    echo "Bonjour $1 !"    # $1 = 1er argument reçu par la fonction
}

saluer Ana                 # → Bonjour Ana !
saluer Bob                 # → Bonjour Bob !</pre>
<div class="tip">Déclare les variables internes avec <code>local</code> : <code>local x=5</code>. Sans <code>local</code>, la variable serait globale et pourrait écraser une autre variable du script. C'est une habitude qui évite bien des bugs.</div>

<h3>3. Valeur de retour</h3>
<pre class="pseudo">est_pair() {
    if [ $(( $1 % 2 )) -eq 0 ]; then
        return 0           # 0 = succès (ici : « oui, pair »)
    else
        return 1           # 1 = échec (« non »)
    fi
}

if est_pair 4; then echo "4 est pair"; fi   # on teste le code de retour de la fonction</pre>
<p>Une fonction renvoie un <strong>code</strong> (0 = vrai/succès), pas une valeur comme dans d'autres langages. Pour « renvoyer » une donnée, on l'affiche avec <code>echo</code> et on la capture avec <code>$(ma_fonction)</code>.</p>

<h3>4. read : demander une saisie à l'utilisateur</h3>
<pre class="pseudo">echo "Quel est ton prénom ?"
read prenom                # attend une saisie et la range dans prenom
echo "Bonjour $prenom"

read -p "Ton âge : " age   # -p affiche l'invite sur la même ligne
read -s -p "Mot de passe : " mdp   # -s = silencieux (ne montre pas la frappe)</pre>
<p><code>read</code> est l'équivalent Bash du « lire au clavier » des autres cours (Scanner, Console.ReadLine…). Il rend les scripts interactifs.</p>

<h3>5. case : choisir parmi plusieurs cas</h3>
<p>Quand on doit comparer une valeur à plusieurs possibilités, <code>case</code> est plus lisible qu'une longue chaîne de <code>if/elif</code> :</p>
<pre class="pseudo">read -p "Ton choix (a/b/q) : " choix
case "$choix" in
    a)                     # si choix vaut « a »
        echo "Tu as choisi A"
        ;;                 # ;; termine ce cas (obligatoire)
    b)
        echo "Tu as choisi B"
        ;;
    q)
        echo "Au revoir"
        ;;
    *)                     # * = tous les autres cas (le « sinon »)
        echo "Choix invalide"
        ;;
esac                       # esac = « case » à l'envers : ferme le bloc</pre>
<pre class="pseudo"># Les motifs de case acceptent les jokers :
case "$fichier" in
    *.txt) echo "un fichier texte" ;;
    *.jpg|*.png) echo "une image" ;;      # | = « ou »
    *) echo "type inconnu" ;;
esac</pre>

<h3>6. Un petit menu complet</h3>
<pre class="pseudo">#!/bin/bash
menu() {
    echo "1) Dire bonjour   2) Afficher la date   q) Quitter"
}
menu
read -p "Choix : " c
case "$c" in
    1) echo "Bonjour !" ;;
    2) date ;;
    q) echo "Bye" ;;
    *) echo "Choix inconnu" ;;
esac</pre>
<div class="tip">Fonctions (organiser) + read (dialoguer) + case (choisir) sont les briques d'un script interactif propre. On les combinera dans les projets de la semaine 5.</div>`,
  exercises: [

    { type: "qcm", q: "Comment APPELLE-t-on une fonction nommée saluer ?", opts: ["saluer()", "call saluer", "saluer", "run saluer"], a: 2, exp: "On écrit juste son nom, sans parenthèses." },
    { type: "qcm", q: "À l'intérieur d'une fonction, que désigne <code>$1</code> ?", opts: ["Le 1er argument du SCRIPT", "Le 1er argument passé à la FONCTION", "Le nom de la fonction", "Rien"], a: 1, exp: "Dans la fonction, $1 = son propre 1er argument." },

    { type: "qcm", q: "Une fonction Bash « renvoie »…", opts: ["Une valeur comme en Java", "Un CODE de retour (0 = succès) ; pour une donnée, on echo + $(...)", "Toujours du texte", "Rien du tout"], a: 1, exp: "return donne un code ; on capture une donnée via echo + $(...)." },
    { type: "input", q: "Quelle commande lit une saisie clavier et la range dans une variable ?", a: "read", ph: "une commande", exp: "read var attend une saisie." },
    { type: "qcm", q: "Que fait l'option <code>-p</code> de read ?", opts: ["Cache la saisie", "Affiche une invite (prompt) sur la même ligne", "Lit un fichier", "Répète"], a: 1, exp: "read -p \"Question : \" var affiche l'invite." },
    { type: "qcm", q: "Que fait <code>read -s</code> ?", opts: ["Trie", "Masque la frappe (silencieux) — idéal pour un mot de passe", "Sépare", "Sauvegarde"], a: 1, exp: "-s = silent : la saisie ne s'affiche pas." },
    { type: "qcm", q: "Quel mot-clé ferme un bloc <code>case</code> ?", opts: ["end", "esac", "fi", "done"], a: 1, exp: "esac = case à l'envers." },
    { type: "qcm", q: "Que termine <code>;;</code> dans un case ?", opts: ["Le script", "Un CAS (une branche) du case", "Une boucle", "Rien"], a: 1, exp: "Chaque branche se termine par ;;." },
    { type: "qcm", q: "Dans un case, le motif <code>*)</code> correspond à…", opts: ["Une erreur", "TOUS les autres cas (le « sinon » / défaut)", "Rien", "Le premier cas"], a: 1, exp: "* est le joker attrape-tout : le cas par défaut." },
    { type: "qcm", q: "<code>*.jpg|*.png)</code> dans un case signifie…", opts: ["jpg ET png obligatoires", "jpg OU png (| = ou)", "un fichier nommé jpg|png", "une erreur"], a: 1, exp: "Le | sépare plusieurs motifs pour une même branche." },
    { type: "qcm", q: "Quand préférer <code>case</code> à une suite de <code>if/elif</code> ?", opts: ["Jamais", "Quand on compare UNE valeur à plusieurs possibilités : plus lisible", "Pour les calculs", "Pour lire un fichier"], a: 1, exp: "case clarifie les choix multiples sur une même variable." },
    { type: "input", q: "Quel mot-clé ouvre le bloc de choix (avant les motifs) ? … \"$x\" in", a: "case", ph: "un mot-clé", exp: "case \"$x\" in … esac." },
    { type: "vf", q: "read rend un script interactif, comme le « lire au clavier » des autres langages.", a: true, exp: "read ≈ Scanner (Java) / Console.ReadLine (C#) / readline (PHP CLI)." }
  ],
  final: {
    title: "Exercice final — Un menu interactif",
    intro: `<p>Aurélia écrit <code>menu.sh</code> :</p>
<pre class="pseudo">#!/bin/bash
afficher_menu() {
    echo "=== MENU ==="
    echo "1) Date   2) Utilisateur   q) Quitter"
}

afficher_menu
read -p "Ton choix : " choix
case "$choix" in
    1) date ;;
    2) whoami ;;
    q) echo "À bientôt" ;;
    *) echo "Choix invalide" ;;
esac</pre>`,
    questions: [
      { type: "qcm", q: "Que fait <code>afficher_menu</code> écrit seul (avant le read) ?", opts: ["Définit la fonction", "APPELLE la fonction (affiche le menu)", "Une erreur", "Rien"], a: 1, exp: "Le nom seul appelle la fonction déjà définie plus haut." },
      { type: "qcm", q: "Rôle de <code>read -p \"Ton choix : \" choix</code> ?", opts: ["Affiche un fichier", "Affiche l'invite et range la saisie dans choix", "Trie", "Quitte"], a: 1, exp: "-p montre l'invite ; la réponse va dans choix." },
      { type: "qcm", q: "Si l'utilisateur tape <code>1</code>, que se passe-t-il ?", opts: ["whoami s'exécute", "date s'exécute", "« À bientôt »", "« Choix invalide »"], a: 1, exp: "La branche 1) lance date." },
      { type: "qcm", q: "Si l'utilisateur tape <code>x</code> (non prévu) ?", opts: ["Rien", "La branche *) affiche « Choix invalide »", "date", "Erreur fatale"], a: 1, exp: "*) attrape tous les cas non prévus." },
      { type: "input", q: "Quel mot-clé ferme le bloc case à la fin ?", a: "esac", ph: "un mot-clé", exp: "esac ferme le case." }
    ],
    solution: `<pre class="pseudo">afficher_menu() { … }   → on DÉFINIT la fonction
afficher_menu           → on l'APPELLE (affiche le menu)
read -p "…" choix       → saisie de l'utilisateur
case "$choix" in
  1) date ;;   2) whoami ;;   q) … ;;   *) invalide ;;
esac

Fonction (organiser) + read (dialoguer) + case (choisir) = script interactif.</pre>
<p>Ton script dialogue et choisit. Demain : le faire tourner tout seul, à heure fixe, avec cron.</p>`
  }
};
