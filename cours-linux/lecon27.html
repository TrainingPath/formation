<script>
var DAY = {
  num: 27,
  title: "Automatiser avec cron",
  subtitle: "Faire tourner un script tout seul, à heure fixe.",
  theory: `
<h3>1. À quoi sert cron ?</h3>
<p><code>cron</code> est le <strong>planificateur</strong> de tâches de Linux : un service qui, en permanence, exécute des commandes à des <strong>moments programmés</strong>. Sauvegarde chaque nuit, nettoyage chaque semaine, rapport chaque lundi… Tout ce qui doit se répéter sans intervention humaine passe par cron.</p>

<h3>2. La table cron (crontab)</h3>
<pre class="pseudo">crontab -e     # ÉDITER ta table de tâches planifiées (la première fois : choisir nano)
crontab -l     # LISTER tes tâches actuelles
crontab -r     # TOUT SUPPRIMER (attention : sans confirmation !)</pre>
<p>Chaque utilisateur a sa propre crontab. Une ligne = une tâche planifiée.</p>

<h3>3. Lire les cinq étoiles</h3>
<p>Une ligne de crontab commence par <strong>cinq champs de temps</strong>, suivis de la commande :</p>
<pre class="pseudo"># ┌───────── minute        (0 - 59)
# │ ┌─────── heure         (0 - 23)
# │ │ ┌───── jour du mois  (1 - 31)
# │ │ │ ┌─── mois          (1 - 12)
# │ │ │ │ ┌─ jour semaine  (0 - 7, 0 et 7 = dimanche)
# │ │ │ │ │
# * * * * *  commande à exécuter
# Une * signifie « chaque valeur possible » de ce champ.</pre>

<h3>4. Des exemples parlants</h3>
<pre class="pseudo">0 6 * * *      /home/aurelia/sauvegarde.sh
# → tous les jours à 6 h 00 (minute 0, heure 6, tous les jours/mois)

*/15 * * * *   /home/aurelia/verifier.sh
# → toutes les 15 minutes (*/15 = « tous les 15 » sur le champ minute)

0 0 * * 0      /home/aurelia/hebdo.sh
# → chaque dimanche à minuit (jour de semaine = 0)

30 2 1 * *     /home/aurelia/mensuel.sh
# → le 1er de chaque mois à 2 h 30

0 9-17 * * 1-5 /home/aurelia/ouvre.sh
# → à chaque heure pile de 9h à 17h, du lundi (1) au vendredi (5)</pre>
<div class="tip">Le champ minute à <code>0</code> est important : <code>* * * * *</code> voudrait dire « chaque minute ». Pour « une fois par heure à l'heure pile », c'est <code>0 * * * *</code>. Oublier le premier champ est l'erreur n°1 des débutants.</div>

<h3>5. Les pièges classiques de cron</h3>
<div class="warn">cron s'exécute dans un environnement <strong>minimal</strong> : le <code>PATH</code> est réduit et tu n'es pas « dans » ton dossier personnel. Deux conséquences : (1) utilise des <strong>chemins absolus</strong> pour tes scripts ET les fichiers qu'ils touchent ; (2) ne compte pas sur tes variables ou alias habituels.</div>
<pre class="pseudo"># Mauvais (dépend du dossier courant et du PATH) :
0 6 * * *  sauvegarde.sh
# Bon (chemins absolus partout) :
0 6 * * *  /home/aurelia/scripts/sauvegarde.sh

# Capturer la sortie pour savoir ce qui s'est passé (les tâches cron sont muettes) :
0 6 * * *  /home/aurelia/scripts/sauvegarde.sh &gt;&gt; /home/aurelia/logs/sauvegarde.log 2&gt;&amp;1</pre>
<p>Rediriger la sortie vers un fichier journal (avec <code>&gt;&gt;</code> et <code>2&gt;&amp;1</code>, leçon 8) est indispensable : sinon, une tâche qui échoue le fait en silence.</p>

<h3>6. Les raccourcis nommés</h3>
<pre class="pseudo">@daily    /home/aurelia/sauvegarde.sh   # une fois par jour (équivaut à 0 0 * * *)
@hourly   /home/aurelia/check.sh        # une fois par heure
@weekly   /home/aurelia/menage.sh       # une fois par semaine
@reboot   /home/aurelia/demarrage.sh    # à chaque démarrage de la machine</pre>
<div class="tip">Pour tester sans attendre, planifie temporairement la tâche « toutes les minutes » (<code>* * * * *</code>), vérifie le fichier de log, puis remets le vrai horaire. Un doute sur une expression ? Beaucoup de mémentos en ligne (« crontab guru ») aident à la relire.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert cron ?", opts: ["À compiler du code", "À exécuter des commandes/scripts à des moments PROGRAMMÉS, automatiquement", "À créer des utilisateurs", "À trier des fichiers"], a: 1, exp: "cron = planificateur de tâches récurrentes." },
    { type: "input", q: "Quelle commande ÉDITE ta table cron ?", a: ["crontab -e", "crontab-e"], ph: "crontab …", exp: "crontab -e ouvre l'éditeur." },
    { type: "qcm", q: "Quelle commande LISTE tes tâches cron ?", opts: ["crontab -e", "crontab -l", "crontab -r", "cron list"], a: 1, exp: "-l = list." },
    { type: "qcm", q: "Combien de champs de TEMPS avant la commande dans une ligne cron ?", opts: ["3", "5", "7", "2"], a: 1, exp: "minute, heure, jour du mois, mois, jour de semaine." },
    { type: "qcm", q: "Dans l'ordre, les cinq champs sont…", opts: ["heure minute jour mois semaine", "minute heure jour-du-mois mois jour-de-semaine", "jour mois année heure minute", "seconde minute heure jour mois"], a: 1, exp: "minute, heure, jour du mois, mois, jour de semaine." },
    { type: "qcm", q: "Que signifie une <code>*</code> dans un champ cron ?", opts: ["La valeur zéro uniquement", "« Chaque valeur possible » de ce champ", "Une valeur interdite", "Une seule fois par an"], a: 1, exp: "* = toutes les valeurs (chaque minute/heure/jour…)." },
    { type: "qcm", q: "<code>0 6 * * *</code> planifie une tâche…", opts: ["Toutes les 6 minutes", "Tous les jours à 6 h 00", "Le 6 de chaque mois", "Le dimanche"], a: 1, exp: "minute 0, heure 6, tous les jours/mois/semaines." },
    { type: "qcm", q: "<code>*/15 * * * *</code> exécute la tâche…", opts: ["Une fois par jour", "Toutes les 15 minutes", "Le 15 du mois", "À 15 h"], a: 1, exp: "*/15 sur le champ minute = tous les quarts d'heure." },
    { type: "qcm", q: "Pour « chaque dimanche à minuit », quel champ jour-de-semaine ?", opts: ["1", "0 (ou 7)", "6", "*"], a: 1, exp: "0 (et 7) = dimanche : 0 0 * * 0." },
    { type: "qcm", q: "Erreur n°1 : que voudrait dire <code>* * * * *</code> ?", opts: ["Jamais", "CHAQUE minute (le premier champ oublié)", "Une fois par jour", "Au démarrage"], a: 1, exp: "Ne pas fixer la minute = exécution chaque minute." },
    { type: "qcm", q: "Pourquoi utiliser des chemins ABSOLUS dans une tâche cron ?", opts: ["Par style", "Parce que cron a un environnement minimal (PATH réduit, pas ton dossier courant)", "Pour aller plus vite", "Ce n'est pas nécessaire"], a: 1, exp: "cron ne connaît ni ton PATH ni ton dossier : chemins absolus obligatoires." },
    { type: "qcm", q: "Pourquoi ajouter <code>&gt;&gt; /chemin/log 2&gt;&amp;1</code> à une tâche cron ?", opts: ["Pour la ralentir", "Pour CAPTURER sa sortie et ses erreurs : sinon un échec passe inaperçu", "Pour la chiffrer", "Obligatoire pour cron"], a: 1, exp: "Les tâches cron sont muettes : on journalise pour diagnostiquer." },
    { type: "input", q: "Quel raccourci nommé exécute une tâche une fois par jour ? (avec le @)", a: ["@daily", "daily"], ph: "@…", exp: "@daily = 0 0 * * *." },
    { type: "qcm", q: "<code>@reboot</code> exécute la tâche…", opts: ["Chaque nuit", "À chaque DÉMARRAGE de la machine", "Chaque semaine", "Jamais"], a: 1, exp: "@reboot = au démarrage." },
    { type: "vf", q: "Pour tester une tâche cron sans attendre, on peut la planifier « toutes les minutes » puis surveiller son log.", a: true, exp: "* * * * * + un fichier de log = test rapide, avant de remettre le vrai horaire." }
  ],
  final: {
    title: "Exercice final — Planifier une sauvegarde nocturne",
    intro: `<p>Aurélia a un script <code>/home/aurelia/scripts/backup.sh</code>. Elle veut l'exécuter automatiquement chaque nuit à 2 h 30 et garder une trace.</p>`,
    questions: [
      { type: "qcm", q: "Quelle commande ouvre sa table cron pour ajouter la tâche ?", opts: ["crontab -l", "crontab -e", "crontab -r", "cron backup"], a: 1, exp: "crontab -e pour éditer." },
      { type: "input", q: "Quels sont les deux premiers champs (minute puis heure) pour « 2 h 30 » ? Écris-les séparés d'une espace.", a: ["30 2", "30  2"], ph: "minute heure", exp: "Minute 30, heure 2 → « 30 2 »." },
      { type: "qcm", q: "La ligne complète pour « chaque nuit à 2h30 » est :", opts: ["30 2 * * * /home/aurelia/scripts/backup.sh", "2 30 * * * backup.sh", "* * * * * backup.sh", "@reboot backup.sh"], a: 0, exp: "30 2 * * * + chemin absolu du script." },
      { type: "qcm", q: "Pourquoi le chemin <code>/home/aurelia/scripts/backup.sh</code> (absolu) plutôt que <code>backup.sh</code> ?", opts: ["Esthétique", "cron n'est pas dans son dossier et a un PATH minimal : il faut l'absolu", "C'est plus court", "Pour root"], a: 1, exp: "Environnement minimal de cron : chemins absolus." },
      { type: "qcm", q: "Comment garder une trace des exécutions ?", opts: ["Ajouter >> /home/aurelia/logs/backup.log 2>&1", "Rien à faire", "Ajouter -v", "Mettre @reboot"], a: 0, exp: "Rediriger sortie et erreurs vers un fichier de log." }
    ],
    solution: `<pre class="pseudo">crontab -e   → éditer la table
Ligne à ajouter :
30 2 * * *  /home/aurelia/scripts/backup.sh >> /home/aurelia/logs/backup.log 2>&1

30 2 = 2h30 · * * * = tous les jours/mois/semaines
chemin ABSOLU (environnement minimal de cron)
>> …log 2>&1 = journaliser sortie + erreurs

Semaine 4 bouclée : script, variables, conditions, boucles, fonctions, cron.
Tu sais AUTOMATISER Linux.</pre>
<p>Fin de la semaine 4 ! Demain (leçon 28) : installer des logiciels avec apt.</p>`
  }
};
