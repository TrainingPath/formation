<script>
var DAY = {
  num: 6,
  title: "Obtenir de l'aide : man & co",
  subtitle: "Devenir autonome : trouver soi-même comment ça marche.",
  theory: `
<h3>1. Le manuel intégré : man</h3>
<p>Chaque commande sérieuse est livrée avec son <strong>manuel</strong>. <code>man</code> (manual) l'affiche. C'est le premier réflexe quand on ne sait pas comment fonctionne une commande.</p>
<pre class="pseudo">man ls            # ouvre le manuel de la commande ls
# La navigation est celle de less : Espace = page suivante,
# /motclé = rechercher, q = QUITTER</pre>
<p>Une page de manuel a toujours la même structure : <strong>NAME</strong> (résumé en une ligne), <strong>SYNOPSIS</strong> (la syntaxe), <strong>DESCRIPTION</strong> (le détail), <strong>OPTIONS</strong>, puis <strong>EXAMPLES</strong> et <strong>SEE ALSO</strong>.</p>

<h3>2. Lire un SYNOPSIS</h3>
<pre class="pseudo">SYNOPSIS
     ls [OPTION]... [FILE]...
# Les crochets [ ] = FACULTATIF. Les points … = « on peut en mettre plusieurs ».
# Donc : ls s'utilise seul, ou avec des options, ou avec des fichiers, ou les deux.</pre>
<div class="tip">Apprendre à lire le SYNOPSIS te rend autonome : tu déduis toi-même comment combiner options et arguments, sans chercher un tutoriel.</div>

<h3>3. L'aide rapide : --help</h3>
<pre class="pseudo">ls --help         # affiche un résumé court des options, directement dans le terminal
mkdir --help      # marche pour presque toutes les commandes</pre>
<p><code>--help</code> est plus bref que <code>man</code> et ne quitte pas le terminal : idéal pour vérifier vite le nom d'une option.</p>

<h3>4. Chercher la BONNE commande : apropos</h3>
<p>Et quand on ne connaît même pas le nom de la commande ? On cherche par mot-clé :</p>
<pre class="pseudo">apropos copy      # liste toutes les commandes dont le manuel parle de « copy »
man -k copy       # exactement la même chose (-k = keyword)
whatis ls         # le résumé d'UNE ligne d'une commande connue</pre>

<h3>5. Où est cette commande, et qu'est-ce que c'est ?</h3>
<pre class="pseudo">which ls          # affiche le CHEMIN de l'exécutable utilisé (ex. /usr/bin/ls)
type cd           # dit la NATURE : commande externe, intégrée au shell, alias…
type ls           # ex. « ls is aliased to ls --color=auto »</pre>
<p><code>type</code> est précieux : certaines « commandes » comme <code>cd</code> ne sont pas des programmes sur le disque mais des fonctions <strong>intégrées au shell</strong> (builtins) — c'est pour cela que <code>which cd</code> ne renvoie parfois rien.</p>

<h3>6. Les sections du manuel</h3>
<pre class="pseudo">man 1 printf      # section 1 : la COMMANDE printf (celle du terminal)
man 3 printf      # section 3 : la FONCTION printf (celle du langage C)</pre>
<p>Un même nom peut exister dans plusieurs « sections » du manuel (1 = commandes, 5 = formats de fichiers, 8 = administration…). On précise le numéro quand il y a ambiguïté.</p>
<div class="warn">Le réflexe à ancrer : avant de chercher sur internet, essaie <code>commande --help</code> puis <code>man commande</code>. 90 % des réponses y sont déjà, à jour et pour TA version exacte du système.</div>`,
  exercises: [
    { type: "input", q: "Quelle commande ouvre le manuel complet de la commande ls ?", a: "man ls", ph: "une commande", exp: "man = manual." },
    { type: "input", q: "Dans man (comme dans less), quelle touche permet de QUITTER ?", a: "q", ph: "une touche", exp: "man utilise la navigation de less : q pour sortir." },
    { type: "qcm", q: "Dans un SYNOPSIS, que signifient les crochets <code>[OPTION]</code> ?", opts: ["Obligatoire", "Facultatif", "Interdit", "Une erreur"], a: 1, exp: "Les crochets marquent ce qui est optionnel." },
    { type: "qcm", q: "Quelle est la façon la plus RAPIDE d'avoir un résumé des options sans quitter le terminal ?", opts: ["man commande", "commande --help", "apropos", "which"], a: 1, exp: "--help affiche un résumé court directement." },
    { type: "qcm", q: "Tu ne connais pas le nom de la commande, juste le thème « copy ». Que fais-tu ?", opts: ["man copy", "apropos copy (ou man -k copy)", "which copy", "type copy"], a: 1, exp: "apropos/man -k cherchent par mot-clé dans tous les manuels." },
    { type: "input", q: "Quelle commande donne le résumé d'UNE ligne de la commande ls ?", a: "whatis ls", ph: "une commande", exp: "whatis affiche la description courte." },
    { type: "qcm", q: "À quoi sert <code>which ls</code> ?", opts: ["À supprimer ls", "À afficher le CHEMIN de l'exécutable ls", "À ouvrir son manuel", "À compter ses options"], a: 1, exp: "which localise le programme utilisé (ex. /usr/bin/ls)." },
    { type: "qcm", q: "Pourquoi <code>which cd</code> ne renvoie parfois rien ?", opts: ["cd n'existe pas", "cd est une commande INTÉGRÉE au shell (builtin), pas un fichier sur le disque", "which est cassé", "cd est un alias interdit"], a: 1, exp: "cd est un builtin : type le montre, which ne le trouve pas." },
    { type: "qcm", q: "Quelle commande indique la NATURE d'une commande (builtin, alias, externe) ?", opts: ["type", "man", "wc", "cat"], a: 0, exp: "type cd, type ls… révèlent la nature exacte." },
    { type: "qcm", q: "<code>man -k</code> est équivalent à…", opts: ["whatis", "apropos", "which", "--help"], a: 1, exp: "-k = keyword : man -k et apropos font la même recherche." },
    { type: "vf", q: "Un même nom (comme printf) peut exister dans plusieurs sections du manuel.", a: true, exp: "man 1 printf (commande) vs man 3 printf (fonction C)." },
    { type: "qcm", q: "L'ordre des sections où on trouve les points EXAMPLES et SEE ALSO est…", opts: ["Au tout début", "Vers la fin de la page de manuel", "Jamais présents", "Dans --help seulement"], a: 1, exp: "Une page man finit souvent par EXAMPLES puis SEE ALSO." },
    { type: "qcm", q: "Le bon réflexe avant de chercher sur internet, c'est…", opts: ["Redémarrer", "Essayer commande --help puis man commande", "Réinstaller Linux", "Demander à un collègue"], a: 1, exp: "L'aide locale est à jour et correspond à TA version." },
    { type: "input", q: "Quelle option, ajoutée à presque toute commande, affiche un résumé de l'aide ?", a: "--help", ph: "une option", exp: "commande --help." },
    { type: "qcm", q: "Dans un SYNOPSIS, les points de suspension <code>...</code> après [FILE] signifient…", opts: ["Fin de la commande", "On peut en indiquer plusieurs", "C'est obligatoire", "Erreur d'affichage"], a: 1, exp: "… = répétable : plusieurs fichiers possibles." }
  ],
  final: {
    title: "Exercice final — Se débrouiller seul",
    intro: `<p>Aurélia rencontre la commande <code>tar</code> qu'elle ne connaît pas, et veut aussi retrouver une commande pour « compress ».</p>`,
    questions: [
      { type: "input", q: "Quelle commande ouvre le manuel complet de tar ?", a: "man tar", ph: "une commande", exp: "man tar : le manuel de référence." },
      { type: "qcm", q: "Elle veut juste un résumé rapide des options, sans quitter le terminal :", opts: ["man tar", "tar --help", "which tar", "whatis"], a: 1, exp: "tar --help : bref et sur place." },
      { type: "input", q: "Pour lister les commandes liées au mot « compress », quelle commande (avec apropos) ?", a: "apropos compress", ph: "apropos …", exp: "apropos compress cherche par mot-clé." },
      { type: "qcm", q: "Elle veut savoir OÙ est l'exécutable tar sur le disque :", opts: ["which tar", "man tar", "type -a inutile", "wc tar"], a: 0, exp: "which tar affiche le chemin (ex. /usr/bin/tar)." },
      { type: "vf", q: "Dans le manuel de tar, la partie SYNOPSIS lui montre la syntaxe (options entre crochets = facultatives).", a: true, exp: "Le SYNOPSIS résume la syntaxe ; [ ] = facultatif." }
    ],
    solution: `<pre class="pseudo">man tar            → le manuel complet (q pour sortir)
tar --help         → résumé rapide des options
apropos compress   → commandes liées à « compress »
which tar          → /usr/bin/tar (emplacement)
SYNOPSIS           → syntaxe : [ ] facultatif, … répétable

Autonomie = savoir chercher : --help, man, apropos, which, type.</pre>
<p>Tu peux désormais apprendre n'importe quelle commande par toi-même. Demain : on récapitule la semaine 1 par un mini-projet.</p>`
  }
};
</script>
