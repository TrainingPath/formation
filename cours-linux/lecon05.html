<script>
var DAY = {
  num: 5,
  title: "Lire et explorer des fichiers",
  subtitle: "Afficher un contenu sans l'ouvrir dans un éditeur.",
  theory: `
<h3>1. Tout afficher d'un coup : cat</h3>
<pre class="pseudo">cat notes.txt         # « concatenate » : déverse tout le fichier à l'écran
cat a.txt b.txt       # affiche a.txt PUIS b.txt, à la suite (d'où « concaténer »)
cat -n notes.txt      # -n : numérote chaque ligne</pre>
<p><code>cat</code> est parfait pour un <strong>petit</strong> fichier. Pour un gros fichier, il défile trop vite : on utilise alors un « pageur ».</p>

<h3>2. Lire page par page : less</h3>
<pre class="pseudo">less /var/log/syslog  # ouvre le fichier dans un afficheur navigable</pre>
<p>Dans <code>less</code>, on ne tape plus de commandes shell mais des touches de navigation :</p>
<pre class="pseudo"># Flèches / PgUp / PgDn : se déplacer
# Espace                : page suivante
# /motclé + Entrée      : RECHERCHER « motclé » (n = occurrence suivante)
# g / G                 : aller au début / à la fin du fichier
# q                     : QUITTER less et revenir au shell</pre>
<div class="tip">Retiens surtout la touche <strong>q</strong> pour sortir : beaucoup de débutants se sentent « bloqués » dans less. <code>less</code> est l'évolution de l'ancien <code>more</code> : plus puissant, il peut revenir en arrière.</div>

<h3>3. Le début et la fin : head et tail</h3>
<pre class="pseudo">head notes.txt        # affiche les 10 PREMIÈRES lignes (par défaut)
head -n 5 notes.txt   # les 5 premières lignes
tail notes.txt        # affiche les 10 DERNIÈRES lignes
tail -n 20 notes.txt  # les 20 dernières lignes
tail -f /var/log/syslog  # -f (follow) : SUIT le fichier en direct, affiche chaque nouvelle ligne</pre>
<div class="tip"><code>tail -f</code> est l'outil n°1 pour surveiller un journal en temps réel pendant qu'une application tourne : les nouvelles lignes s'affichent au fur et à mesure. On quitte avec Ctrl+C.</div>

<h3>4. Compter : wc</h3>
<pre class="pseudo">wc notes.txt          # affiche 3 nombres : lignes, mots, octets
wc -l notes.txt       # -l : seulement le nombre de LIGNES
wc -w notes.txt       # -w : seulement le nombre de MOTS</pre>
<p><code>wc -l</code> (word count, option lines) répond à une question très fréquente : « combien de lignes fait ce fichier ? ». On le retrouvera partout, notamment après un tube (leçon 9).</p>

<h3>5. Savoir à quoi on a affaire : file</h3>
<pre class="pseudo">file photo.jpg        # dit le VRAI type du fichier (image JPEG…), pas juste l'extension
file notes.txt        # « ASCII text » : un simple fichier texte
file /bin/ls          # « ELF executable » : un vrai programme</pre>
<div class="warn">Sous Linux, l'extension (<code>.txt</code>, <code>.jpg</code>) n'est qu'une convention pratique : le système, lui, se fie au <strong>contenu</strong>. Un fichier peut n'avoir aucune extension et être parfaitement valide. <code>file</code> examine le contenu pour deviner le type.</div>

<h3>6. La bonne commande selon le besoin</h3>
<pre class="pseudo"># Petit fichier, tout voir       → cat
# Gros fichier, naviguer         → less   (quitter avec q)
# Juste le début / la fin        → head / tail
# Surveiller un log en direct    → tail -f
# Compter les lignes             → wc -l
# Connaître le type réel         → file</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande affiche TOUT le contenu d'un petit fichier notes.txt d'un coup ?", a: "cat notes.txt", ph: "une commande", exp: "cat déverse tout le fichier à l'écran." },
    { type: "qcm", q: "Pourquoi cat s'appelle « cat » (concatenate) ?", opts: ["Il compresse", "Il peut afficher plusieurs fichiers à la suite (les concaténer)", "Il chiffre", "Il compte"], a: 1, exp: "cat a.txt b.txt affiche a puis b, bout à bout." },
    { type: "qcm", q: "Pour lire un GROS fichier page par page, on utilise…", opts: ["cat", "less", "touch", "rm"], a: 1, exp: "less est un « pageur » : navigation confortable." },
    { type: "input", q: "Dans less, quelle touche permet de QUITTER et revenir au shell ?", a: "q", ph: "une touche", exp: "q ferme less." },
    { type: "qcm", q: "Dans less, comment rechercher un mot ?", opts: ["Ctrl+F", "En tapant /motclé puis Entrée", "grep", "F3"], a: 1, exp: "/motclé lance la recherche ; n va à l'occurrence suivante." },
    { type: "qcm", q: "<code>head notes.txt</code> (sans option) affiche…", opts: ["Tout le fichier", "Les 10 premières lignes", "La dernière ligne", "Le nombre de lignes"], a: 1, exp: "head = les 10 premières lignes par défaut." },
    { type: "input", q: "Quelle commande affiche les 10 DERNIÈRES lignes d'un fichier ?", a: "tail", ph: "une commande", exp: "tail = la fin du fichier." },
    { type: "qcm", q: "À quoi sert <code>tail -f /var/log/syslog</code> ?", opts: ["À supprimer le log", "À SUIVRE le fichier en direct, affichant chaque nouvelle ligne", "À compter les lignes", "À le copier"], a: 1, exp: "-f = follow : surveillance en temps réel (Ctrl+C pour sortir)." },
    { type: "qcm", q: "Comment n'afficher que les 5 premières lignes ?", opts: ["head -5 ou head -n 5", "cat -5", "tail 5", "less 5"], a: 0, exp: "head -n 5 (ou head -5) limite le nombre de lignes." },
    { type: "input", q: "Quelle commande (avec option) compte le nombre de LIGNES d'un fichier ?", a: ["wc -l", "wc -l notes.txt"], ph: "wc …", exp: "wc -l = word count, lignes." },
    { type: "qcm", q: "<code>wc notes.txt</code> sans option affiche…", opts: ["Seulement les lignes", "Trois nombres : lignes, mots, octets", "Le contenu du fichier", "La taille en Mo"], a: 1, exp: "wc donne lignes, mots et octets par défaut." },
    { type: "qcm", q: "À quoi sert la commande <code>file</code> ?", opts: ["À créer un fichier", "À déterminer le VRAI type d'un fichier d'après son contenu", "À le supprimer", "À l'ouvrir dans un éditeur"], a: 1, exp: "file lit le contenu et devine le type (texte, image, exécutable…)." },
    { type: "vf", q: "Sous Linux, l'extension d'un fichier (.txt, .jpg) détermine obligatoirement son type.", a: false, exp: "Non : l'extension est une convention. Le système se fie au contenu ; file le confirme." },
    { type: "qcm", q: "Tu ouvres un log de 50 000 lignes. Le meilleur choix ?", opts: ["cat (tout défile)", "less (navigation, recherche, q pour sortir)", "touch", "rm"], a: 1, exp: "cat ferait tout défiler d'un coup ; less permet d'explorer." },
    { type: "qcm", q: "Quelle option numérote les lignes avec cat ?", opts: ["cat -l", "cat -n", "cat -a", "cat -r"], a: 1, exp: "cat -n préfixe chaque ligne de son numéro." }
  ],
  final: {
    title: "Exercice final — Enquêter dans un journal",
    intro: `<p>Un fichier <code>acces.log</code> contient exactement 1 000 lignes. Aurélia veut l'explorer.</p>`,
    questions: [
      { type: "input", q: "Quelle commande compte (et confirme) le nombre de lignes du fichier ?", a: ["wc -l acces.log", "wc -l"], ph: "wc …", exp: "wc -l acces.log affiche 1000." },
      { type: "qcm", q: "Pour voir les toutes dernières entrées (les plus récentes) :", opts: ["head acces.log", "tail acces.log", "cat acces.log", "file acces.log"], a: 1, exp: "tail montre la fin, donc les dernières lignes." },
      { type: "input", q: "Pour n'afficher que les 3 premières lignes, quelle commande ?", a: ["head -n 3 acces.log", "head -3 acces.log"], ph: "head …", exp: "head -n 3 limite aux 3 premières lignes." },
      { type: "qcm", q: "Le fichier grossit pendant qu'une appli tourne : comment suivre les nouvelles lignes en direct ?", opts: ["cat acces.log", "tail -f acces.log", "less une seule fois", "wc -l"], a: 1, exp: "tail -f suit le fichier en temps réel (Ctrl+C pour arrêter)." },
      { type: "qcm", q: "Pour naviguer librement et RECHERCHER un mot dans le fichier :", opts: ["less acces.log puis /mot", "cat acces.log", "touch", "rm"], a: 0, exp: "less permet la navigation et la recherche avec /mot." }
    ],
    solution: `<pre class="pseudo">wc -l acces.log        → 1000 (nombre de lignes)
tail acces.log         → les 10 dernières (les plus récentes)
head -n 3 acces.log    → les 3 premières
tail -f acces.log      → suivi en direct (Ctrl+C pour sortir)
less acces.log + /mot  → navigation + recherche (q pour quitter)

Chaque commande a son usage : petit/gros, début/fin, statique/en direct.</pre>
<p>Tu explores n'importe quel fichier avec le bon outil. Demain : trouver de l'aide sur toutes ces commandes.</p>`
  }
};
</script>
