<script>
var DAY = {
  num: 30,
  title: "Réseau : ssh, curl, environnement",
  subtitle: "Se connecter, transférer, récupérer, configurer.",
  theory: `
<h3>1. Regarder son réseau</h3>
<pre class="pseudo">ip a               # les adresses IP des interfaces réseau (remplace l'ancien ifconfig)
hostname -I        # affiche simplement ton/tes adresse(s) IP
ping google.com    # teste la connectivité : envoie des paquets, mesure le temps (Ctrl+C pour arrêter)
ss -tuln           # les ports en écoute (services qui attendent des connexions)</pre>
<p><code>ping</code> répond à « ai-je accès à cette machine/au net ? » ; <code>ss</code> à « quels services écoutent sur ma machine ? ».</p>

<h3>2. Se connecter à distance : ssh</h3>
<p><code>ssh</code> (Secure SHell) ouvre un terminal <strong>chiffré</strong> sur une machine distante. C'est l'outil n°1 de l'administration de serveurs : tu pilotes un ordinateur à l'autre bout du monde comme s'il était devant toi.</p>
<pre class="pseudo">ssh aurelia@192.168.1.20     # se connecter en tant qu'aurelia sur cette machine
ssh aurelia@serveur.exemple.com   # par nom de domaine
ssh -p 2222 aurelia@serveur       # -p : préciser un port différent du 22 par défaut
exit                              # fermer la session distante et revenir chez soi</pre>
<div class="tip">Pour éviter de taper son mot de passe à chaque fois, on utilise des <strong>clés SSH</strong> : <code>ssh-keygen</code> crée une paire (clé privée gardée secrète, clé publique à déposer sur le serveur avec <code>ssh-copy-id</code>). La connexion devient automatique et plus sûre.</div>

<h3>3. Transférer des fichiers : scp</h3>
<pre class="pseudo">scp fichier.txt aurelia@serveur:/home/aurelia/   # ENVOYER un fichier vers le serveur
scp aurelia@serveur:/var/log/app.log .           # RÉCUPÉRER un fichier du serveur (. = ici)
scp -r dossier/ aurelia@serveur:/tmp/            # -r : un dossier entier</pre>
<p>La syntaxe reprend celle de <code>cp</code>, en préfixant la partie distante par <code>utilisateur@machine:</code>. (Alternative moderne : <code>rsync</code>, plus efficace pour synchroniser.)</p>

<h3>4. Récupérer depuis le web : curl et wget</h3>
<pre class="pseudo">curl https://exemple.com                 # affiche le contenu renvoyé par l'URL
curl -O https://exemple.com/fichier.zip  # -O : TÉLÉCHARGE en gardant le nom du fichier
curl -I https://exemple.com              # -I : seulement les en-têtes (headers) HTTP
wget https://exemple.com/fichier.zip     # wget : téléchargeur simple et robuste</pre>
<p><code>curl</code> est l'outil universel pour dialoguer avec des serveurs web et des <strong>API</strong> (récupérer du JSON, tester un service…). <code>wget</code> est plus orienté « télécharger un fichier ».</p>

<h3>5. Les variables d'environnement</h3>
<p>L'<strong>environnement</strong> est un ensemble de variables que tous les programmes voient. On les liste avec <code>env</code> :</p>
<pre class="pseudo">env                # toutes les variables d'environnement
echo "$HOME"       # ton dossier personnel        echo "$USER"   # ton nom
echo "$PATH"       # la liste des dossiers où le shell cherche les commandes

export EDITOR=nano # DÉFINIR une variable d'environnement pour la session (et ses sous-processus)
export API_URL="https://api.exemple.com"   # ex. une config lue par un script</pre>
<div class="tip"><code>export</code> rend une variable disponible aux programmes lancés ensuite (contrairement à une variable simple, locale au shell). C'est ainsi qu'on passe une configuration à un script ou à un service.</div>

<h3>6. Le PATH : où le shell trouve les commandes</h3>
<pre class="pseudo">echo "$PATH"       # ex. /usr/local/bin:/usr/bin:/bin   (dossiers séparés par des :)
# Quand tu tapes « ls », le shell cherche « ls » dans CHACUN de ces dossiers, dans l'ordre.
which ls           # révèle lequel a été trouvé (leçon 6)

export PATH="$PATH:/home/aurelia/mes-scripts"   # AJOUTER un dossier au PATH
# → tu peux alors lancer tes scripts par leur nom, sans ./ ni chemin complet</pre>
<div class="warn">Pour rendre un réglage <strong>permanent</strong> (PATH, EDITOR…), on l'ajoute à son fichier <code>~/.bashrc</code>, lu à chaque ouverture de terminal. Sinon, l'<code>export</code> est perdu à la fermeture. Après édition : <code>source ~/.bashrc</code> pour l'appliquer sans rouvrir le terminal.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle commande affiche les adresses IP des interfaces réseau ?", opts: ["ping", "ip a", "ssh", "curl"], a: 1, exp: "ip a (ip address) ; hostname -I donne aussi l'IP." },
    { type: "qcm", q: "À quoi sert <code>ping google.com</code> ?", opts: ["À télécharger google", "À tester la connectivité (peut-on joindre cette machine ?)", "À se connecter en SSH", "À lister des ports"], a: 1, exp: "ping vérifie l'accès et mesure le temps de réponse." },
    { type: "qcm", q: "Que fait <code>ssh aurelia@serveur</code> ?", opts: ["Copie un fichier", "Ouvre un terminal CHIFFRÉ sur la machine distante en tant qu'aurelia", "Télécharge une page", "Liste les services"], a: 1, exp: "ssh = shell sécurisé à distance." },
    { type: "input", q: "Quelle option de ssh permet de préciser un PORT différent du 22 ?", a: ["-p", "p"], ph: "une option", exp: "ssh -p 2222 user@hôte." },
    { type: "qcm", q: "Les clés SSH servent à…", opts: ["Chiffrer les fichiers", "Se connecter sans taper son mot de passe, de façon plus sûre", "Accélérer le réseau", "Lister les ports"], a: 1, exp: "ssh-keygen crée une paire clé privée/publique." },
    { type: "qcm", q: "Pour ENVOYER un fichier vers un serveur distant :", opts: ["scp fichier.txt user@serveur:/chemin/", "ssh fichier.txt", "curl fichier.txt", "ping fichier.txt"], a: 0, exp: "scp copie via SSH ; la cible distante s'écrit user@hôte:/chemin." },
    { type: "qcm", q: "Dans <code>scp user@serveur:/var/log/app.log .</code>, que fait le <code>.</code> final ?", opts: ["Cache le fichier", "Indique la destination : le dossier COURANT (ici)", "Supprime le fichier", "Renomme"], a: 1, exp: ". = le dossier courant : on rapatrie le fichier ici." },
    { type: "qcm", q: "Quel outil est idéal pour interroger une API web ou afficher le contenu d'une URL ?", opts: ["ssh", "curl", "ping", "scp"], a: 1, exp: "curl dialogue avec les serveurs web et les API." },
    { type: "qcm", q: "<code>curl -O https://site/fichier.zip</code> fait…", opts: ["Affiche le contenu", "TÉLÉCHARGE le fichier en gardant son nom", "Envoie un fichier", "Ouvre une session"], a: 1, exp: "-O enregistre la ressource sous son nom d'origine." },
    { type: "input", q: "Quelle commande liste TOUTES les variables d'environnement ?", a: "env", ph: "une commande", exp: "env affiche l'environnement." },
    { type: "qcm", q: "À quoi sert <code>export</code> ?", opts: ["À supprimer une variable", "À rendre une variable disponible aux programmes lancés ensuite", "À trier", "À télécharger"], a: 1, exp: "export exporte la variable vers l'environnement des sous-processus." },
    { type: "qcm", q: "Que contient la variable <code>PATH</code> ?", opts: ["L'historique des commandes", "La liste des dossiers où le shell cherche les commandes (séparés par :)", "Le dossier courant", "Les alias définis"], a: 1, exp: "PATH = les chemins de recherche des exécutables." },
    { type: "qcm", q: "Ajouter un dossier de scripts au PATH :", opts: ["export PATH=\"$PATH:/home/aurelia/mes-scripts\"", "cd PATH", "rm PATH", "ping PATH"], a: 0, exp: "On concatène le nouveau dossier à l'ancien PATH." },
    { type: "qcm", q: "Pour rendre un réglage (PATH, EDITOR) PERMANENT, on l'ajoute dans…", opts: ["/tmp", "~/.bashrc (lu à chaque ouverture de terminal)", "/etc/passwd", "/dev/null"], a: 1, exp: "~/.bashrc applique les réglages à chaque session." },
    { type: "vf", q: "Sans export, une variable reste locale au shell et n'est pas vue par les programmes lancés.", a: true, exp: "export la fait passer dans l'environnement des sous-processus." }
  ],
  final: {
    title: "Exercice final — Administrer une machine distante",
    intro: `<p>Aurélia doit se connecter au serveur <code>192.168.1.50</code> (compte <code>ops</code>), y déposer un script, récupérer un log, et configurer son environnement local.</p>`,
    questions: [
      { type: "qcm", q: "Se connecter au serveur en SSH :", opts: ["ssh ops@192.168.1.50", "scp ops@192.168.1.50", "ping ops", "curl 192.168.1.50"], a: 0, exp: "ssh utilisateur@adresse." },
      { type: "qcm", q: "Envoyer deploy.sh vers /home/ops sur le serveur :", opts: ["scp deploy.sh ops@192.168.1.50:/home/ops/", "ssh deploy.sh", "curl -O deploy.sh", "cp deploy.sh serveur"], a: 0, exp: "scp source user@hôte:/chemin/." },
      { type: "qcm", q: "Récupérer /var/log/app.log du serveur dans le dossier courant :", opts: ["scp ops@192.168.1.50:/var/log/app.log .", "ssh app.log", "wget app.log", "ping app.log"], a: 0, exp: "scp distant:chemin . rapatrie ici." },
      { type: "qcm", q: "Tester rapidement une API web depuis le terminal :", opts: ["curl https://api.exemple.com/status", "ssh api", "scp api", "ping api uniquement"], a: 0, exp: "curl interroge l'URL et affiche la réponse." },
      { type: "input", q: "Ajouter durablement ~/mes-scripts au PATH : dans quel fichier écrire l'export ? (chemin)", a: ["~/.bashrc", ".bashrc"], ph: "un fichier", exp: "~/.bashrc, lu à chaque ouverture de terminal." }
    ],
    solution: `<pre class="pseudo">ssh ops@192.168.1.50                              → session distante chiffrée
scp deploy.sh ops@192.168.1.50:/home/ops/         → envoyer un fichier
scp ops@192.168.1.50:/var/log/app.log .           → récupérer un fichier
curl https://api.exemple.com/status               → interroger une API
export PATH="$PATH:~/mes-scripts"  (dans ~/.bashrc) → PATH permanent

ssh (se connecter) · scp (transférer) · curl (récupérer) · export/PATH (configurer).</pre>
<p>Tu administres à distance et configures ton environnement. Demain : l'examen final et le projet de sauvegarde.</p>`
  }
};
</script>
