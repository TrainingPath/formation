<script>
var DAY = {
  num: 3,
  title: "L'arborescence du système",
  subtitle: "Comprendre la carte pour ne plus se perdre.",
  theory: `
<h3>1. Une seule racine pour tout</h3>
<p>Contrairement à Windows et ses lecteurs <code>C:</code>, <code>D:</code>…, Linux n'a <strong>qu'une seule racine</strong> : <code>/</code>. Tout — disques, clés USB, périphériques — vient s'y « accrocher » à un endroit précis. On dit que l'arbre est <strong>unifié</strong>.</p>
<pre class="pseudo">/                    # la racine : le point de départ de TOUT
ls /                 # affiche les grands dossiers du système</pre>
<p>Cette organisation suit une norme, le <strong>FHS</strong> (Filesystem Hierarchy Standard) : chaque dossier a un rôle défini, identique d'une distribution à l'autre. La connaître, c'est savoir où chercher.</p>

<h3>2. Les dossiers que tu rencontreras le plus</h3>
<pre class="pseudo">/home     # les dossiers personnels des utilisateurs (/home/aurelia, /home/marc…)
/root     # le dossier personnel du superutilisateur root (à part, PAS dans /home)
/etc      # la CONFIGURATION du système (fichiers texte : réseau, utilisateurs, services)
/var      # les données VARIABLES : journaux (/var/log), files d'attente, caches
/tmp      # les fichiers TEMPORAIRES : vidés régulièrement, n'y range rien d'important
/usr      # les programmes et données installés (/usr/bin, /usr/share…)
/bin /sbin # les commandes essentielles (bin = utilisateurs, sbin = administration)
/lib      # les bibliothèques partagées dont les programmes ont besoin
/dev      # les PÉRIPHÉRIQUES vus comme des fichiers (/dev/sda le disque…)
/proc /sys # des dossiers « virtuels » : une vue en direct du noyau et du matériel
/mnt /media # points de montage : clés USB, disques externes viennent s'y greffer
/opt      # logiciels tiers optionnels installés « en bloc »
/boot     # le noyau Linux et les fichiers de démarrage</pre>
<div class="tip">À retenir en priorité pour la suite du cours : <strong>/home</strong> (tes fichiers), <strong>/etc</strong> (la config), <strong>/var/log</strong> (les journaux quand ça plante), <strong>/tmp</strong> (le jetable) et <strong>/bin</strong> (les commandes). Les autres viendront naturellement.</div>

<h3>3. « Tout est fichier »</h3>
<p>C'est la philosophie fondatrice d'Unix/Linux : le système présente <strong>presque tout</strong> comme un fichier. Un vrai document est un fichier, bien sûr, mais aussi ton disque dur (<code>/dev/sda</code>), ton clavier, et même des informations du noyau (<code>/proc</code>). Conséquence pratique : les mêmes commandes (<code>cat</code>, <code>ls</code>…) fonctionnent presque partout.</p>
<pre class="pseudo">cat /etc/hostname     # lit un fichier de config : le nom de la machine
ls /var/log           # liste les journaux du système
cat /proc/cpuinfo     # « lit » des infos du processeur exposées comme un fichier</pre>

<h3>4. Où atterrit ce que TU installes ou crées ?</h3>
<pre class="pseudo"># Tes documents, scripts, projets  → dans /home/toi (ton ~)
# Un logiciel installé via apt      → ses commandes dans /usr/bin, sa config dans /etc
# Les messages d'erreur du système  → dans /var/log
# Un fichier de travail jetable      → dans /tmp</pre>
<div class="warn">Ne t'aventure pas à supprimer ou modifier au hasard dans <code>/etc</code>, <code>/bin</code> ou <code>/boot</code> : ce sont les organes vitaux du système. Ton terrain de jeu, c'est <strong>/home/toi</strong> et <strong>/tmp</strong>. Pour toucher au reste, il faudra <code>sudo</code> (leçon 17) — et de bonnes raisons.</div>

<h3>5. Explorer sans rien casser</h3>
<pre class="pseudo">cd /            # aller à la racine
ls -l           # regarder les grands dossiers
cd /var/log     # descendre voir les journaux
ls              # les fichiers .log du système
cd ~            # revenir chez soi, en terrain sûr</pre>
<p>Lire (<code>ls</code>, <code>cat</code>) ne présente aucun risque. C'est <strong>modifier</strong> ou <strong>supprimer</strong> qui demande de la prudence — et c'est justement ce que le système protège par les permissions.</p>`,
  exercises: [
    { type: "qcm", q: "Combien de racines possède un système de fichiers Linux ?", opts: ["Une par disque (C:, D:…)", "Une seule, notée /", "Aucune", "Autant que d'utilisateurs"], a: 1, exp: "Tout part de la racine unique /. Pas de lettres de lecteur." },
    { type: "input", q: "Quel dossier contient les dossiers personnels des utilisateurs ?", a: "/home", ph: "un chemin", exp: "/home/aurelia, /home/marc, etc." },
    { type: "qcm", q: "Où se trouve la CONFIGURATION du système ?", opts: ["/bin", "/etc", "/tmp", "/dev"], a: 1, exp: "/etc contient les fichiers de config (texte)." },
    { type: "qcm", q: "Où chercher les JOURNAUX (logs) quand quelque chose plante ?", opts: ["/var/log", "/home/log", "/etc/log", "/boot"], a: 0, exp: "/var/log : les données variables du système, dont les journaux." },
    { type: "qcm", q: "Le dossier <code>/tmp</code> sert à…", opts: ["Stocker définitivement", "Des fichiers TEMPORAIRES, vidés régulièrement", "La configuration", "Les périphériques"], a: 1, exp: "N'y range jamais rien d'important : c'est le jetable." },
    { type: "qcm", q: "Le dossier personnel de <strong>root</strong> est…", opts: ["/home/root", "/root", "/etc/root", "/usr/root"], a: 1, exp: "root a son propre dossier /root, en dehors de /home." },
    { type: "qcm", q: "La philosophie « tout est fichier » signifie que…", opts: ["Il n'y a pas de dossiers", "Même les périphériques et infos système apparaissent comme des fichiers", "Tous les fichiers sont cachés", "Rien ne peut être supprimé"], a: 1, exp: "Disques (/dev/sda), infos noyau (/proc)… tout se lit comme un fichier." },
    { type: "input", q: "Quel dossier contient les périphériques (comme /dev/sda le disque) ?", a: "/dev", ph: "un chemin", exp: "/dev = devices, les périphériques." },
    { type: "qcm", q: "Les commandes essentielles (ls, cp…) se trouvent notamment dans…", opts: ["/bin", "/home", "/var", "/tmp"], a: 0, exp: "/bin (et /usr/bin) contiennent les exécutables des commandes." },
    { type: "qcm", q: "Quelle norme définit le rôle de chaque dossier, identique d'une distro à l'autre ?", opts: ["HTTP", "FHS (Filesystem Hierarchy Standard)", "POSIX-1", "GNU"], a: 1, exp: "Le FHS standardise l'arborescence." },
    { type: "vf", q: "Sous Linux, une clé USB reçoit une lettre de lecteur comme E: sous Windows.", a: false, exp: "Non : elle est « montée » dans un dossier, souvent sous /media ou /mnt." },
    { type: "qcm", q: "Quel est ton terrain de jeu SANS risque pour créer/supprimer librement ?", opts: ["/etc et /boot", "/home/toi et /tmp", "/bin et /sbin", "/dev et /proc"], a: 1, exp: "Ton dossier personnel et /tmp : tu y es maître, sans danger système." },
    { type: "input", q: "Quel dossier virtuel expose des infos en direct du noyau et du matériel ?", a: "/proc", ph: "un chemin", exp: "/proc (et /sys) : des vues dynamiques du système." },
    { type: "qcm", q: "Où sont installées la plupart des applications et leurs données partagées ?", opts: ["/usr", "/tmp", "/dev", "/boot"], a: 0, exp: "/usr/bin, /usr/share… : le gros des programmes installés." },
    { type: "qcm", q: "<code>cat /etc/hostname</code> fonctionne parce que…", opts: ["hostname est une commande", "la configuration de /etc est faite de simples fichiers texte lisibles", "c'est un dossier caché", "root l'exécute"], a: 1, exp: "La config /etc est en texte : on la lit avec cat, on l'édite avec un éditeur." }
  ],
  final: {
    title: "Exercice final — Ranger au bon endroit",
    intro: `<p>Pour chaque besoin, indique le bon dossier de destination selon le FHS.</p>`,
    questions: [
      { type: "input", q: "Aurélia écrit un script perso pour elle-même : dans quelle grande branche le ranger ?", a: ["/home", "/home/aurelia", "~"], ph: "un chemin", exp: "Ses fichiers vont dans son dossier personnel, sous /home." },
      { type: "input", q: "Le système enregistre ses messages d'erreur : dans quel dossier les lire ?", a: "/var/log", ph: "un chemin", exp: "/var/log centralise les journaux." },
      { type: "qcm", q: "Elle modifie le fichier de configuration réseau du système. Où est-il ?", opts: ["Dans /home", "Dans /etc", "Dans /tmp", "Dans /dev"], a: 1, exp: "Toute la config système vit dans /etc." },
      { type: "qcm", q: "Elle crée un fichier de travail vraiment jetable, le temps d'un test. Le meilleur endroit ?", opts: ["/boot", "/tmp", "/bin", "/root"], a: 1, exp: "/tmp : temporaire par nature, vidé régulièrement." },
      { type: "vf", q: "Supprimer un fichier dans /bin est aussi anodin que d'en supprimer un dans /tmp.", a: false, exp: "Faux : /bin contient des commandes vitales. /tmp est sans danger." }
    ],
    solution: `<pre class="pseudo">Script perso      → /home/aurelia   (tes affaires)
Journaux d'erreur → /var/log        (données variables du système)
Config réseau     → /etc            (toute la configuration)
Fichier jetable   → /tmp            (temporaire)
/bin              → NE PAS toucher au hasard (commandes vitales)

Règle : /home et /tmp = terrain sûr ; /etc, /bin, /boot = zone sensible.</pre>
<p>La carte est en tête. Demain : créer, copier, déplacer et supprimer des fichiers.</p>`
  }
};
</script>
