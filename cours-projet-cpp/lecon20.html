var DAY = {

  title: "Build de release (CMake) et mise en service",
  subtitle: "Compiler pour de vrai : optimisations, options, et un exécutable prêt à livrer.",
  theory: `
<h3>1. Debug vs Release</h3>
<p>Un même programme se compile de deux façons. En <strong>debug</strong> (« mise au point »), on compile avec les <strong>symboles</strong> (des repères qui permettent de suivre le code pas à pas) et sans optimisation, pour chasser les bugs. En <strong>release</strong> (« version de sortie »), on active les <strong>optimisations</strong> (l'option <code>-O2</code> demande au compilateur d'accélérer le code) et on retire les vérifications de développement : l'exécutable devient plus rapide et plus léger, prêt à livrer.</p>

<h3>2. Un CMakeLists lisible</h3>
<pre class="pseudo">cmake_minimum_required(VERSION 3.16)   # exige CMake 3.16 au minimum
project(Ludotheque CXX)                # nom du projet ; CXX = langage C++
set(CMAKE_CXX_STANDARD 17)             # on programme en C++17
set(CMAKE_CXX_STANDARD_REQUIRED ON)    # exige vraiment le C++17 (pas de repli silencieux)

add_executable(ludotheque              # fabrique le programme "ludotheque"...
    src/main.cpp src/JeuRepository.cpp src/services.cpp)   # ...a partir de ces fichiers source

target_compile_options(ludotheque PRIVATE -Wall -Wextra)   # active tous les avertissements
target_link_libraries(ludotheque PRIVATE mysqlcppconn)   # connecteur MySQL</pre>
<p><strong>CMake</strong> est l'outil qui décrit le projet <em>une seule fois</em> ; il génère ensuite les commandes de compilation pour n'importe quelle plateforme (Windows, Linux, macOS). On y liste les fichiers source, les options et les <strong>bibliothèques</strong> à <strong>lier</strong> (à brancher sur notre code, comme le connecteur MySQL).</p>

<h3>3. Configurer et construire en release</h3>
<pre class="pseudo">cmake -S . -B build -DCMAKE_BUILD_TYPE=Release   # configuration
cmake --build build                              # compilation
./build/ludotheque                               # exécution</pre>
<div class="tip">On sépare le dossier <code>build/</code> (où atterrissent les fichiers fabriqués) des fichiers source : il est jetable et <strong>pas versionné</strong> (rangé dans <code>.gitignore</code>). L'option <code>-DCMAKE_BUILD_TYPE=Release</code> demande justement un build optimisé.</div>

<h3>4. Compiler « propre »</h3>
<div class="warn">On compile avec <code>-Wall -Wextra</code> (« tous les avertissements ») et on traite chaque <strong>warning</strong> (avertissement du compilateur) comme une erreur à corriger : un warning cache souvent un vrai bug (variable non initialisée, comparaison douteuse). Avant de livrer, on passe aussi les tests (leçon 18) : jamais de release sur des tests « rouges » (en échec).</div>

<h3>5. La mise en service</h3>
<pre class="pseudo">1. Exporter les secrets :   export LUDO_DB_PASSWORD=...
2. Préparer la base :        mysql &lt; schema.sql
3. Lancer l'exécutable de release
4. Vérifier les logs de démarrage</pre>
<p>La <strong>mise en service</strong> (« livrer et démarrer »), c'est : un <strong>binaire de release</strong> (le programme optimisé), une <strong>base préparée</strong> (le schéma appliqué), des <strong>secrets fournis par l'environnement</strong> et des <strong>logs</strong> qu'on surveille au démarrage. La leçon suivante automatisera tout cela — ici, on maîtrise déjà la chaîne à la main.</p>`,
  exercises: [
    { type: "qcm", q: "Un build release, par rapport au debug…", opts: ["est plus lent", "est optimisé (-O2), plus rapide, prêt à livrer", "garde tous les symboles de debug", "ne compile pas"], a: 1, exp: "Pour la production." },
    { type: "qcm", q: "CMake sert à…", opts: ["exécuter le SQL", "décrire le projet et générer la compilation multiplateforme", "logger", "tester la base"], a: 1, exp: "Système de build." },
    { type: "qcm", q: "CMAKE_CXX_STANDARD 17 fixe…", opts: ["la version de MySQL", "le standard C++ (C++17)", "le -O2", "le nom du binaire"], a: 1, exp: "Norme du langage." },
    { type: "qcm", q: "target_link_libraries(... mysqlcppconn) …", opts: ["compile le SQL", "lie le connecteur MySQL C++", "logge", "teste"], a: 1, exp: "Bibliothèque externe." },
    { type: "qcm", q: "-DCMAKE_BUILD_TYPE=Release demande…", opts: ["un build debug", "un build optimisé", "aucun build", "un test"], a: 1, exp: "Mode release." },
    { type: "qcm", q: "Le dossier build/ est…", opts: ["versionné", "jetable et non versionné (.gitignore)", "le code source", "un secret"], a: 1, exp: "Séparé des sources." },
    { type: "qcm", q: "-Wall -Wextra active…", opts: ["l'optimisation", "les avertissements du compilateur", "le SQL", "les logs"], a: 1, exp: "Compiler propre." },
    { type: "qcm", q: "Un warning est souvent…", opts: ["à ignorer", "un vrai bug à corriger", "une erreur SQL", "un test"], a: 1, exp: "À traiter." },
    { type: "qcm", q: "Avant une release, on…", opts: ["saute les tests", "passe les tests (pas de release sur du rouge)", "supprime les logs", "ignore les warnings"], a: 1, exp: "Qualité d'abord." },
    { type: "qcm", q: "Les secrets à la mise en service viennent…", opts: ["du code", "de l'environnement (export ...)", "des logs", "du binaire"], a: 1, exp: "Variables d'env." },
    { type: "vf", q: "On sépare le dossier build/ des sources et on ne le versionne pas.", a: true, exp: "Jetable." },
    { type: "qcm", q: "Préparer la base se fait avec…", opts: ["un printf", "le script schema.sql (mysql < schema.sql)", "CMake", "un log"], a: 1, exp: "Schéma appliqué." },
    { type: "qcm", q: "cmake --build build …", opts: ["configure", "compile le projet", "exécute le SQL", "teste la base"], a: 1, exp: "Construction." },
    { type: "qcm", q: "Livrer implique de surveiller…", opts: ["rien", "les logs de démarrage", "le prix des jeux", "le CMake"], a: 1, exp: "Mise en service." },
    { type: "qcm", q: "CMake décrit le projet…", opts: ["à chaque compilation à la main", "une fois, et génère les commandes pour chaque plateforme", "jamais", "dans l'UI"], a: 1, exp: "Portable." }
  ],
  final: {
    title: "Exercice final — Un CMakeLists de release",
    intro: `<p>On veut : projet C++17 nommé <code>ludotheque</code>, sources <code>main.cpp</code> et <code>services.cpp</code>, options <code>-Wall -Wextra</code>, liaison du connecteur <code>mysqlcppconn</code>, et build optimisé.</p>`,
    questions: [
      { type: "qcm", q: "Fixer le C++17 :", opts: ["set(CMAKE_CXX_STANDARD 17)", "add_library", "target_link", "un printf"], a: 0, exp: "Standard du langage." },
      { type: "qcm", q: "Déclarer l'exécutable :", opts: ["add_executable(ludotheque src/main.cpp src/services.cpp)", "add_test", "include", "message"], a: 0, exp: "Cible binaire." },
      { type: "qcm", q: "Ajouter -Wall -Wextra :", opts: ["target_compile_options(... PRIVATE -Wall -Wextra)", "un log", "set(BUILD debug)", "rien"], a: 0, exp: "Compiler propre." },
      { type: "qcm", q: "Lier le connecteur :", opts: ["target_link_libraries(ludotheque PRIVATE mysqlcppconn)", "include(mysql)", "add_executable", "message"], a: 0, exp: "Bibliothèque." },
      { type: "qcm", q: "Obtenir un build optimisé :", opts: ["compiler à la main", "cmake -B build -DCMAKE_BUILD_TYPE=Release", "supprimer build/", "sauter CMake"], a: 1, exp: "Mode release." }
    ],
    solution: `<pre class="pseudo">cmake_minimum_required(VERSION 3.16)   # exige CMake 3.16 au minimum
project(Ludotheque CXX)                # nom du projet ; CXX = langage C++
set(CMAKE_CXX_STANDARD 17)             # on programme en C++17
set(CMAKE_CXX_STANDARD_REQUIRED ON)    # exige vraiment le C++17

add_executable(ludotheque src/main.cpp src/services.cpp)   # le programme et ses sources
target_compile_options(ludotheque PRIVATE -Wall -Wextra)   # avertissements du compilateur
target_link_libraries(ludotheque PRIVATE mysqlcppconn)     # lie le connecteur MySQL

# puis, en ligne de commande :
#   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
#   cmake --build build</pre>
<p>Un projet décrit une fois, compilé proprement et optimisé pour la livraison. Demain : le récapitulatif — l'examen de la Ludothèque C++.</p>`
  }
};
