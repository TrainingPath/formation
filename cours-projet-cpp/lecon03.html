<script>
var DAY = {
  num: 3,
  title: "Du MCD Merise au schéma SQL",
  subtitle: "Traduire le modèle conceptuel de la Ludothèque en tables MySQL prêtes à recevoir des objets.",
  theory: `
<h3>1. Du conceptuel au physique</h3>
<p>La méthode <strong>Merise</strong> est une façon de concevoir une base de données avant de l'écrire. Elle produit un <strong>MCD</strong> (Modèle Conceptuel de Données) : un dessin qui recense les <strong>entités</strong> — les grandes choses que l'on veut mémoriser, comme un Jeu, une Catégorie, un Utilisateur — et les <strong>associations</strong> — les liens entre elles (un jeu <em>appartient à</em> une catégorie). Passer du « conceptuel » (l'idée sur le papier) au « physique » (la base réelle), c'est traduire ce dessin en <strong>tables</strong>. Une <strong>table</strong> est un tableau à colonnes et lignes, comme une feuille de tableur : chaque colonne est une information, chaque ligne un enregistrement. Ce schéma est <strong>identique</strong> à celui de la version en langage C ; seul le code C++ qui l'exploite changera.</p>

<h3>2. Les tables categorie et jeu</h3>
<p>On crée les tables avec l'ordre SQL <code>CREATE TABLE</code> (les commentaires SQL commencent par <code>--</code>).</p>
<pre class="pseudo">CREATE TABLE categorie (               -- cree la table "categorie" (les genres de jeux)
  id  INT AUTO_INCREMENT PRIMARY KEY,  -- identifiant unique, genere tout seul par la base
  nom VARCHAR(50) NOT NULL             -- le nom du genre ; NOT NULL = obligatoire
);
CREATE TABLE jeu (                     -- cree la table "jeu"
  id             INT AUTO_INCREMENT PRIMARY KEY,   -- identifiant unique auto-genere
  nom            VARCHAR(100) NOT NULL,            -- nom du jeu (obligatoire)
  prix_achat     DECIMAL(6,2) NOT NULL,            -- prix de vente, en argent (2 decimales)
  prix_location  DECIMAL(6,2) NOT NULL,            -- prix de location, en argent
  stock_vente    INT NOT NULL DEFAULT 0,           -- nombre d'exemplaires a vendre (0 par defaut)
  stock_location INT NOT NULL DEFAULT 0,           -- nombre d'exemplaires a louer (0 par defaut)
  categorie_id   INT,                              -- a quelle categorie appartient ce jeu
  FOREIGN KEY (categorie_id) REFERENCES categorie(id)  -- ce lien doit viser une categorie existante
);</pre>
<p>Une <strong>clé primaire</strong> (<code>PRIMARY KEY</code>) est l'identifiant unique d'une ligne, comme un numéro de dossier : deux lignes ne peuvent jamais partager le même. <code>AUTO_INCREMENT</code> demande à la base de générer ce numéro toute seule (1, 2, 3…). <code>NOT NULL</code> veut dire « obligatoire » (la case ne peut rester vide), et <code>DEFAULT 0</code> fixe une valeur automatique quand on n'en fournit aucune.</p>

<h3>3. Les bons types</h3>
<p>Chaque colonne a un <strong>type</strong> : la nature de ce qu'elle contient (du texte, un nombre entier, de l'argent…). Voici les principaux, en légende (ceci n'est pas du code à exécuter) :</p>
<pre class="pseudo">INT AUTO_INCREMENT  : clé technique auto-générée
VARCHAR(n)          : texte de longueur variable
DECIMAL(6,2)        : de l'argent (JAMAIS float pour un prix)
INT ... DEFAULT 0   : un compteur avec valeur par défaut</pre>
<div class="warn">Les <strong>deux stocks</strong> (vente et location) sont deux colonnes distinctes : c'est une décision du MCD. Un prix se stocke en <code>DECIMAL</code> (nombre à décimales exactes) et jamais en <code>float</code>, car <code>float</code> arrondit et fait « perdre des centimes ». Côté C++, une colonne <code>DECIMAL</code> se lit avec <code>res-&gt;getDouble(...)</code>.</div>

<h3>4. La clé étrangère</h3>
<p>Une <strong>clé étrangère</strong> (<code>FOREIGN KEY</code>) est une colonne qui pointe vers la clé primaire d'une autre table — un renvoi, comme une note de bas de page qui indique « voir tel dossier ». <code>FOREIGN KEY (categorie_id) REFERENCES categorie(id)</code> garantit qu'un jeu ne peut renvoyer que vers une catégorie <strong>qui existe vraiment</strong>. C'est l'<strong>intégrité référentielle</strong> : la base elle-même refuse un lien « orphelin » (qui pointerait dans le vide).</p>

<h3>5. Où vit le schéma</h3>
<div class="tip">On exécute ce script une seule fois (dans un fichier <code>schema.sql</code>, <strong>versionné</strong> — c'est-à-dire conservé dans l'historique du projet, tel un carnet de bord où chaque modification est datée). Côté C++, on retrouvera exactement ces colonnes dans les <strong>classes</strong> du domaine (leçon 4) et dans les requêtes du dépôt (leçon 5). La conception précède toujours le code.</div>`,
  exercises: [
    { type: "qcm", q: "Le MCD Merise fournit…", opts: ["le code C++", "les entités/associations, traduits en tables", "le CMakeLists", "l'UI"], a: 1, exp: "Conception → schéma." },
    { type: "qcm", q: "Quel type pour une clé primaire technique ?", opts: ["VARCHAR", "INT AUTO_INCREMENT PRIMARY KEY", "DECIMAL", "TEXT"], a: 1, exp: "Entier auto-incrémenté." },
    { type: "qcm", q: "Quel type pour un prix ?", opts: ["FLOAT", "DECIMAL(6,2)", "INT", "VARCHAR"], a: 1, exp: "Évite les arrondis." },
    { type: "qcm", q: "Pourquoi deux colonnes de stock ?", opts: ["pour dupliquer la donnée par sécurité", "vente et location indépendantes (MCD)", "pour accélérer les requêtes SELECT", "pour respecter une contrainte NOT NULL"], a: 1, exp: "Deux stocks." },
    { type: "qcm", q: "Une FOREIGN KEY garantit…", opts: ["de meilleures performances de lecture", "qu'une référence pointe vers une ligne existante", "l'unicité des valeurs de la colonne", "le tri automatique des lignes"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "Côté C++, un DECIMAL se lit avec…", opts: ["getInt", "getDouble", "getString obligatoire", "getBlob"], a: 1, exp: "Valeur réelle." },
    { type: "qcm", q: "DEFAULT 0 signifie…", opts: ["une valeur interdite d'être 0", "valeur par défaut 0 si non fournie", "la colonne vaut toujours 0", "déclenche une erreur si non renseignée"], a: 1, exp: "À l'insertion." },
    { type: "qcm", q: "L'intégrité référentielle est assurée par…", opts: ["le C++", "la base (contrainte FK)", "l'UI", "le CMakeLists"], a: 1, exp: "La base refuse l'orphelin." },
    { type: "qcm", q: "Le schéma se crée…", opts: ["à chaque lancement", "une fois (script versionné)", "à chaque connexion d'un client", "à chaque requête"], a: 1, exp: "schema.sql." },
    { type: "qcm", q: "Le schéma C++ vs C est…", opts: ["entièrement différent", "identique (seul le code diffère)", "sans clés étrangères", "stocké en NoSQL"], a: 1, exp: "Même base." },
    { type: "vf", q: "On n'utilise jamais FLOAT pour un prix.", a: true, exp: "DECIMAL." },
    { type: "qcm", q: "categorie_id dans jeu est…", opts: ["une clé primaire", "une clé étrangère vers categorie(id)", "une colonne de texte libre", "un simple index sans contrainte"], a: 1, exp: "FK." },
    { type: "qcm", q: "Les colonnes se retrouveront côté C++ dans…", opts: ["le CMakeLists", "les classes du domaine (leçon 4)", "les tests", "l'UI seule"], a: 1, exp: "Une ligne = un objet." },
    { type: "qcm", q: "AUTO_INCREMENT évite…", opts: ["d'écrire des jointures SQL", "de gérer soi-même les identifiants", "les doublons de noms", "de déclarer une clé primaire"], a: 1, exp: "La base génère l'id." },
    { type: "qcm", q: "Où stocke-t-on ce script ?", opts: ["dans main.cpp", "dans schema.sql (versionné)", "dans le CMakeLists", "dans l'UI"], a: 1, exp: "Fichier SQL." }
  ],
  final: {
    title: "Exercice final — Compléter le schéma",
    intro: `<p>On veut une table location. Analyse :</p>
<pre class="pseudo">CREATE TABLE location (          -- table des locations (version a corriger)
  id           INT AUTO_INCREMENT PRIMARY KEY,   -- identifiant unique auto-genere
  utilisateur  VARCHAR(50),      -- PROBLEME : un nom en texte au lieu d'un lien vers utilisateur(id)
  jeu          INT,              -- PROBLEME : un entier sans FOREIGN KEY (aucune garantie)
  jours        INT,              -- nombre de jours de location
  total        FLOAT             -- PROBLEME : FLOAT pour de l'argent (erreurs d'arrondi)
);</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>utilisateur VARCHAR(50)</code> :", opts: ["c'est correct ainsi", "mieux : utilisateur_id INT avec FK vers utilisateur(id)", "il faut TEXT", "il suffit d'ajouter un index"], a: 1, exp: "On relie par clé, pas par un nom." },
      { type: "qcm", q: "Problème n°2 — <code>jeu INT</code> sans contrainte :", opts: ["c'est correct ainsi", "devrait être jeu_id INT avec FOREIGN KEY", "il faut VARCHAR", "il faut le passer en BIGINT"], a: 1, exp: "Intégrité." },
      { type: "qcm", q: "Problème n°3 — <code>total FLOAT</code> :", opts: ["c'est correct pour un total", "pour de l'argent, DECIMAL(6,2)", "il faut INT", "il faut TEXT"], a: 1, exp: "Jamais FLOAT." },
      { type: "qcm", q: "Les FK apportent…", opts: ["un gain de mémoire", "l'intégrité (pas de location d'un jeu inexistant)", "de la vitesse pure", "moins de tables"], a: 1, exp: "Pas d'orphelins." },
      { type: "qcm", q: "Une date de location serait de type…", opts: ["VARCHAR", "DATE ou DATETIME", "INT", "FLOAT"], a: 1, exp: "Type temporel." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE location (             -- table des locations (version corrigee)
  id              INT AUTO_INCREMENT PRIMARY KEY,   -- identifiant unique auto-genere
  utilisateur_id  INT NOT NULL,     -- lien vers l'utilisateur (par cle, pas par nom)
  jeu_id          INT NOT NULL,     -- lien vers le jeu
  jours           INT NOT NULL,     -- nombre de jours de location
  total           DECIMAL(6,2) NOT NULL,   -- le montant, en argent (DECIMAL, jamais FLOAT)
  date_debut      DATE NOT NULL,    -- date de debut, dans un vrai type temporel
  FOREIGN KEY (utilisateur_id) REFERENCES utilisateur(id),   -- garantit un utilisateur existant
  FOREIGN KEY (jeu_id)         REFERENCES jeu(id)             -- garantit un jeu existant
);</pre>
<p>Des clés étrangères pour relier, du <code>DECIMAL</code> pour l'argent, une <code>DATE</code> pour le temps. Le schéma est prêt. Demain : le modèle en classes.</p>`
  }
};
</script>
