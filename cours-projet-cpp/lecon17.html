<script>
var DAY = {
  num: 17,
  title: "Gestion mémoire : RAII et smart pointers",
  subtitle: "La synthèse : possession claire, libération automatique, zéro fuite — sans new/delete manuels.",
  theory: `
<h3>1. Le principe : RAII</h3>
<p><strong>RAII</strong> (<em>Resource Acquisition Is Initialization</em>, « acquérir une ressource, c'est l'initialiser ») : une <strong>ressource</strong> (mémoire, fichier, connexion…) est <strong>acquise dans le constructeur</strong> d'un objet et <strong>libérée dans son destructeur</strong>. Quand l'objet sort de <strong>portée</strong> — par un retour, une exception ou la fin d'un bloc — le destructeur s'exécute et garantit la libération, comme un parapluie qui se replie tout seul dès qu'on rentre. C'est la colonne vertébrale de tout notre projet.</p>

<h3>2. unique_ptr : une seule propriété</h3>
<pre class="pseudo">std::unique_ptr&lt;sql::Connection&gt; con(driver-&gt;connect(...));   // le driver alloue, le unique_ptr en devient proprietaire
// un seul propriétaire ; non copiable, mais déplaçable
auto autre = std::move(con);   // la possession est TRANSFÉRÉE, con devient nul</pre>
<p><code>std::unique_ptr</code> exprime une propriété <strong>exclusive</strong> : un seul propriétaire à la fois. Il ne se <strong>copie</strong> pas (deux copies voudraient chacune libérer la même ressource → double <code>delete</code>), mais il se <strong>déplace</strong> avec <code>std::move</code> (« transférer », comme passer un témoin de relais). C'est le smart pointer par défaut pour Connection, PreparedStatement et ResultSet.</p>

<h3>3. shared_ptr : propriété partagée</h3>
<pre class="pseudo">std::shared_ptr&lt;Config&gt; cfg = std::make_shared&lt;Config&gt;(lireConfig());   // une config a plusieurs proprietaires
// plusieurs détenteurs ; libéré quand le DERNIER disparaît (compteur de références)</pre>
<div class="warn">Un <code>shared_ptr</code> permet <strong>plusieurs</strong> propriétaires : la ressource n'est libérée que lorsque le <em>dernier</em> disparaît, grâce à un <strong>compteur de références</strong> (le nombre de détenteurs). On ne l'utilise que si la propriété est <strong>réellement</strong> partagée : ce compteur est « atomique » (protégé contre les accès simultanés), donc il coûte un peu. Par défaut, on préfère <code>unique_ptr</code>, plus simple à suivre.</div>

<h3>4. make_unique / make_shared</h3>
<pre class="pseudo">auto j = std::make_unique&lt;Jeu&gt;(id, "Catan", 3.0, 30.0);   // cree un Jeu directement possede par un unique_ptr
// pas de new visible ; exception-safe ; type déduit</pre>
<p>On crée les objets avec <code>std::make_unique</code> / <code>std::make_shared</code> : plus de <code>new</code> nu (l'ancienne façon d'allouer à la main), et une garantie d'absence de fuite même si un argument lance une exception pendant la construction.</p>

<h3>5. La règle : ne jamais gérer la mémoire à la main</h3>
<div class="tip">En C++ moderne, on n'écrit quasiment jamais <code>new</code>/<code>delete</code> : les <strong>conteneurs</strong> (<code>std::vector</code>, <code>std::string</code>) et les smart pointers possèdent et libèrent tout seuls. Une exception peut remonter n'importe où : le RAII garantit qu'aucune connexion, aucun statement, aucune mémoire ne fuit. C'est ce qui rend notre Ludothèque C++ sûre <strong>par construction</strong> (par la structure même du code, pas par un test qu'on pourrait oublier).</div>`,
  exercises: [
    { type: "qcm", q: "RAII signifie :", opts: ["une bibliothèque", "ressource acquise au constructeur, libérée au destructeur", "un pointeur nu", "un mot-clé SQL"], a: 1, exp: "Le cœur du C++ moderne." },
    { type: "qcm", q: "Le destructeur s'exécute…", opts: ["jamais", "quand l'objet sort de portée (retour, exception, fin de bloc)", "sur delete seulement", "au démarrage"], a: 1, exp: "Libération garantie." },
    { type: "qcm", q: "std::unique_ptr exprime une propriété…", opts: ["partagée", "exclusive (un seul propriétaire)", "nulle", "globale"], a: 1, exp: "Non copiable." },
    { type: "qcm", q: "unique_ptr se…", opts: ["copie", "déplace (std::move), pas copie", "duplique librement", "partage"], a: 1, exp: "Transfert de possession." },
    { type: "qcm", q: "Après std::move(con), con…", opts: ["reste valide", "devient nul (possession transférée)", "est copié", "plante"], a: 1, exp: "Déplacé." },
    { type: "qcm", q: "shared_ptr libère la ressource…", opts: ["tout de suite", "quand le dernier détenteur disparaît (compteur)", "jamais", "au premier"], a: 1, exp: "Comptage de références." },
    { type: "qcm", q: "Par défaut on préfère…", opts: ["shared_ptr", "unique_ptr (plus simple, sans compteur)", "un pointeur nu", "une globale"], a: 1, exp: "Propriété exclusive." },
    { type: "qcm", q: "make_unique évite…", opts: ["les objets", "le new nu et les fuites en cas d'exception", "les vector", "le RAII"], a: 1, exp: "Création sûre." },
    { type: "qcm", q: "Dans du C++ moderne, new/delete manuels sont…", opts: ["fréquents", "quasi absents (conteneurs + smart pointers)", "obligatoires", "interdits par le compilateur"], a: 1, exp: "On délègue la mémoire." },
    { type: "qcm", q: "std::vector et std::string…", opts: ["fuient", "possèdent et libèrent leur mémoire seuls", "exigent free()", "sont dangereux"], a: 1, exp: "RAII." },
    { type: "vf", q: "Grâce au RAII, une exception qui remonte ne laisse aucune ressource ouverte.", a: true, exp: "Destruction automatique." },
    { type: "qcm", q: "Pourquoi unique_ptr n'est pas copiable ?", opts: ["par lenteur", "pour éviter deux delete de la même ressource", "sans raison", "bug"], a: 1, exp: "Propriété unique." },
    { type: "qcm", q: "shared_ptr coûte…", opts: ["rien", "un compteur de références atomique", "une fuite", "un delete manuel"], a: 1, exp: "À réserver au partage réel." },
    { type: "qcm", q: "Connection, PreparedStatement, ResultSet sont détenus par…", opts: ["des pointeurs nus", "des unique_ptr", "des globales", "des vecteurs"], a: 1, exp: "RAII sur le connecteur." },
    { type: "qcm", q: "La Ludothèque C++ est sûre par construction grâce…", opts: ["au hasard", "au RAII et aux smart pointers (pas de fuite)", "aux new nus", "aux goto"], a: 1, exp: "Garantie du langage." }
  ],
  final: {
    title: "Exercice final — Supprimer les new/delete",
    intro: `<p>Du code à la mode C, transposé en C++ :</p>
<pre class="pseudo">sql::PreparedStatement* p = con.prepareStatement("SELECT ...");   // POINTEUR BRUT : a liberer soi-meme
sql::ResultSet* r = p-&gt;executeQuery();                            // POINTEUR BRUT : idem
// ... si une exception survient ici, p et r fuient ...
delete r;                                                         // liberation manuelle (fragile, oubliable)
delete p;                                                         // liberation manuelle (fragile, oubliable)</pre>`,
    questions: [
      { type: "qcm", q: "Le problème :", opts: ["aucun", "delete manuels : fuite si une exception survient avant", "trop lent", "trop long"], a: 1, exp: "Pas exception-safe." },
      { type: "qcm", q: "La solution :", opts: ["plus de try", "envelopper p et r dans des unique_ptr", "supprimer la requête", "un goto cleanup"], a: 1, exp: "RAII." },
      { type: "qcm", q: "Avec unique_ptr, la libération est…", opts: ["oubliée", "automatique en fin de portée, même sur exception", "manuelle", "impossible"], a: 1, exp: "Destructeur." },
      { type: "qcm", q: "Combien de delete manuels reste-t-il ?", opts: ["deux", "zéro", "un", "trois"], a: 1, exp: "Aucun." },
      { type: "qcm", q: "Ce style est appelé…", opts: ["fuite contrôlée", "exception-safe (RAII)", "gestion manuelle", "leak"], a: 1, exp: "Sûr par construction." }
    ],
    solution: `<pre class="pseudo">std::unique_ptr&lt;sql::PreparedStatement&gt; p(con.prepareStatement("SELECT ..."));   // possede la requete preparee
std::unique_ptr&lt;sql::ResultSet&gt; r(p-&gt;executeQuery());                            // possede le resultat
// ... même si une exception remonte, p et r sont détruits proprement ...
// aucun delete manuel : RAII s'en charge</pre>
<p>Les <code>unique_ptr</code> possèdent statement et result set : libération automatique, zéro fuite, exception-safe. Plus aucun <code>delete</code>. Demain : les tests unitaires.</p>`
  }
};

  { id: "projcpp-l17", title: "Un type RAII maison", level: 3,
    statement: "Écris une petite classe FichierLog qui ouvre un std::ofstream dans son constructeur (nom de fichier passé en paramètre) et le referme implicitement à la destruction (RAII). Ajoute une méthode ecrire(const std::string&). Interdis la copie.",
    hints: [
      "Membre std::ofstream flux_ ; ouvre-le dans la liste d'initialisation.",
      "ecrire() écrit la ligne dans flux_.",
      "= delete sur le constructeur de copie et l'affectation."
    ],
    solution: "#include <fstream>           // pour std::ofstream (fichier en ecriture)\n#include <string>            // pour std::string\n\nclass FichierLog {           // petite classe RAII autour d'un fichier de log\n    std::ofstream flux_;     // le fichier ouvert (membre prive)\npublic:\n    explicit FichierLog(const std::string& chemin)   // constructeur : recoit le chemin du fichier\n        : flux_(chemin, std::ios::app) {}      // ouverture = acquisition\n    void ecrire(const std::string& ligne) {   // ecrit une ligne dans le fichier\n        flux_ << ligne << '\\n';                // ajoute la ligne puis un retour a la ligne\n    }\n    ~FichierLog() = default;                    // ofstream se ferme seul (RAII)\n    FichierLog(const FichierLog&) = delete;            // interdit la copie (ressource unique)\n    FichierLog& operator=(const FichierLog&) = delete; // interdit l'affectation par copie\n};",
    note: "std::ofstream est déjà RAII : il ferme le fichier dans son propre destructeur, donc ~FichierLog = default suffit. On acquiert la ressource dans le constructeur, on interdit la copie (une ressource a un seul propriétaire), et la libération est garantie même si une exception remonte. C'est le patron réutilisé pour Connection, Statement, ResultSet." }
  ]
