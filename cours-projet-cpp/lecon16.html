<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur, administrateur",
  subtitle: "Un menu par rôle — mais la sécurité reste dans les services, jamais dans l'affichage.",
  theory: `
<h3>1. Trois menus, une seule application</h3>
<p>Selon le rôle chargé à la connexion, l'UI affiche un <strong>menu adapté</strong> : le client voit « parcourir / louer / acheter », le vendeur ajoute « gérer le stock », l'admin ajoute « comptes / statistiques ». Attention : c'est du <strong>confort</strong> (de l'ergonomie, le fait de rendre l'usage agréable), pas de la sécurité. Une seule et même application, mais trois vues différentes.</p>

<h3>2. Router selon le rôle</h3>
<p><strong>Router</strong>, c'est aiguiller vers le bon chemin selon une condition — comme un aiguillage de train.</p>
<pre class="pseudo">void lancerEspace(sql::Connection&amp; con, const Utilisateur&amp; u) {   // choisit l'espace selon le role
    switch (u.role()) {                              // examine le role de l'utilisateur connecte
        case Role::Client:  espaceClient(con, u);  break;   // client : parcourir, louer, acheter
        case Role::Vendeur: espaceVendeur(con, u); break;   // vendeur : + gestion du stock
        case Role::Admin:   espaceAdmin(con, u);   break;   // admin : + comptes et statistiques
    }
}</pre>

<h3>3. La double barrière</h3>
<div class="warn">Afficher le menu vendeur seulement aux vendeurs est agréable, mais <strong>ne protège pas</strong> : chaque service sensible revérifie le rôle (leçon 11) et lance <code>AccesRefuse</code> si besoin. Menu = ergonomie ; service = sécurité. On garde <strong>les deux</strong>, jamais l'un à la place de l'autre : c'est la « double barrière ».</div>

<h3>4. Réutiliser les mêmes services</h3>
<pre class="pseudo">void espaceVendeur(sql::Connection&amp; con, const Utilisateur&amp; u) {   // menu et actions du vendeur
    // ... choix « réapprovisionner » ...
    int jeuId = lireEntier("Jeu : ");          // lit l'identifiant du jeu a reapprovisionner
    int n     = lireEntier("Quantite : ");     // lit la quantite a ajouter
    StockService::reappro(u, con, jeuId, n);   // le service revérifie le rôle
    std::cout &lt;&lt; "Stock mis a jour.\\n";        // affiche la confirmation
}</pre>
<p>Les trois espaces appellent les <strong>mêmes services</strong> : aucune règle n'est dupliquée d'un menu à l'autre. La seule différence entre les espaces est la présentation des choix à l'écran.</p>

<h3>5. Le rôle vient de la session</h3>
<div class="tip">Le rôle testé dans <code>switch (u.role())</code> provient de l'<code>Utilisateur</code> authentifié (leçon 10), pas d'une saisie. On ne demande jamais à l'utilisateur « quel est votre rôle ? » : il est chargé depuis la base, une seule fois, à la connexion. Faire confiance à une saisie pour le rôle serait la porte ouverte à tous les abus.</div>`,
  exercises: [
    { type: "qcm", q: "Le menu affiché dépend…", opts: ["de l'heure", "du rôle de l'utilisateur connecté", "du stock", "des préférences enregistrées"], a: 1, exp: "Un espace par rôle." },
    { type: "qcm", q: "Afficher un menu par rôle est…", opts: ["de la sécurité", "du confort/ergonomie", "inutile", "dangereux"], a: 1, exp: "Pas une barrière." },
    { type: "qcm", q: "La vraie sécurité est…", opts: ["dans le menu", "dans les services (revérification du rôle)", "dans l'affichage", "dans le formulaire de connexion"], a: 1, exp: "Double barrière." },
    { type: "qcm", q: "Les trois espaces appellent…", opts: ["des règles dupliquées", "les mêmes services", "des SQL différents", "des dépôts séparés"], a: 1, exp: "Pas de duplication." },
    { type: "qcm", q: "On route les espaces avec…", opts: ["des if partout", "switch (u.role())", "une variable globale de rôle", "l'UI seule"], a: 1, exp: "Selon le rôle." },
    { type: "qcm", q: "Le rôle testé provient…", opts: ["d'une saisie", "de l'Utilisateur authentifié (session)", "du menu", "d'un champ du formulaire"], a: 1, exp: "Jamais demandé." },
    { type: "qcm", q: "Demande-t-on « quel est votre rôle ? » ?", opts: ["oui", "non : il vient de la base à la connexion", "parfois", "toujours"], a: 1, exp: "Confiance = base." },
    { type: "qcm", q: "Le service reappro, appelé depuis l'espace vendeur…", opts: ["fait confiance au menu", "revérifie le rôle et peut lancer AccesRefuse", "n'a pas de contrôle", "renvoie un code d'erreur silencieux"], a: 1, exp: "Sécurité redondante." },
    { type: "qcm", q: "La différence entre les espaces est…", opts: ["les règles métier", "la présentation des choix", "le SQL", "la base"], a: 1, exp: "UI seulement." },
    { type: "qcm", q: "Cacher le menu vendeur au client…", opts: ["suffit à sécuriser", "améliore l'ergonomie mais ne remplace pas le contrôle service", "est inutile", "est risqué"], a: 1, exp: "Confort." },
    { type: "vf", q: "Un même service est appelé par plusieurs espaces sans réécrire la règle.", a: true, exp: "Source unique." },
    { type: "qcm", q: "espaceAdmin ajoute typiquement…", opts: ["les mêmes options que le client", "gestion des comptes et statistiques", "louer seulement", "moins de choix"], a: 1, exp: "Droits étendus." },
    { type: "qcm", q: "Si un client atteignait le service reappro autrement, il…", opts: ["réussirait", "serait refusé (AccesRefuse) par le service", "modifierait quand même le stock", "verrait le menu"], a: 1, exp: "Le service protège." },
    { type: "qcm", q: "Le routage par rôle rend l'appli…", opts: ["dupliquée", "unifiée : un binaire, trois vues", "plus lente", "moins sûre"], a: 1, exp: "Une seule application." },
    { type: "qcm", q: "L'ergonomie et la sécurité sont…", opts: ["la même chose", "complémentaires : menu + contrôle service", "opposées", "inutiles"], a: 1, exp: "Les deux ensemble." }
  ],
  final: {
    title: "Exercice final — Ne pas confondre menu et sécurité",
    intro: `<p>Un développeur affirme :</p>
<blockquote>« Le client ne voit pas l'option “réapprovisionner” dans son menu, donc l'action est sécurisée. »</blockquote>`,
    questions: [
      { type: "qcm", q: "L'affirmation est…", opts: ["correcte", "fausse : cacher un menu n'est pas une barrière de sécurité", "vraie parfois", "vraie si le menu est masqué côté serveur"], a: 1, exp: "Confort ≠ sécurité." },
      { type: "qcm", q: "Ce qui protège réellement :", opts: ["le menu", "le contrôle de rôle dans StockService::reappro", "l'affichage", "le masquage du bouton"], a: 1, exp: "Côté service." },
      { type: "qcm", q: "Que doit faire reappro pour un client ?", opts: ["accepter", "lancer AccesRefuse", "accepter en journalisant", "ignorer"], a: 1, exp: "Refus." },
      { type: "qcm", q: "Le menu adapté sert quand même à…", opts: ["l'authentification", "l'ergonomie (ne pas montrer l'inutile)", "la sécurité", "la vitesse"], a: 1, exp: "Confort utile." },
      { type: "qcm", q: "La bonne posture :", opts: ["menu OU service", "menu adapté ET contrôle service", "ni l'un ni l'autre", "l'UI décide"], a: 1, exp: "Défense en profondeur." }
    ],
    solution: `<p>Cacher l'option améliore l'expérience, mais la sécurité vit dans le service :</p>
<pre class="pseudo">void espaceVendeur(sql::Connection&amp; con, const Utilisateur&amp; u) {   // espace du vendeur
    // menu vendeur affiché (ergonomie)
    StockService::reappro(u, con, jeuId, n);   // le service REVÉRIFIE u.role()
}
// StockService::reappro : if (!peutGererStock(u)) throw AccesRefuse(...);</pre>
<p>Menu adapté <em>et</em> contrôle dans le service : défense en profondeur. Demain : la gestion mémoire, RAII et smart pointers en synthèse.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "projcpp-l16", title: "Router selon le rôle", level: 2,
    statement: "Écris void lancerEspace(sql::Connection& con, const Utilisateur& u) qui, selon u.role() (enum class Role { Client, Vendeur, Admin }), appelle espaceClient, espaceVendeur ou espaceAdmin (déjà déclarés). Utilise un switch.",
    hints: [
      "switch (u.role()) { case Role::Client: ... }",
      "Chaque case appelle la fonction d'espace correspondante puis break.",
      "N'oublie pas de qualifier Role::."
    ],
    solution: "void lancerEspace(sql::Connection& con, const Utilisateur& u) {   // route vers le bon espace selon le role\n    switch (u.role()) {                              // examine le role (issu de l'authentification)\n        case Role::Client:  espaceClient(con, u);  break;   // client\n        case Role::Vendeur: espaceVendeur(con, u); break;   // vendeur\n        case Role::Admin:   espaceAdmin(con, u);   break;   // administrateur\n    }\n}",
    note: "Le routage lit u.role(), issu de l'authentification (jamais d'une saisie). Il ne fait que choisir la présentation : chaque espace rappelle les mêmes services, qui revérifient les droits. Séparer le confort (menu par rôle) de la sécurité (contrôle dans le service) est le cœur d'une architecture saine." }
  ]
};
