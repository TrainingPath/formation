var DAY = {
  num: 14,
  title: "L'interface console et les smart pointers",
  subtitle: "Une couche UI mince qui délègue tout — et détient la connexion via un smart pointer.",
  theory: `
<h3>1. L'UI ne décide de rien</h3>
<p>L'<strong>UI</strong> (interface utilisateur) en mode <strong>console</strong> (fenêtre de texte) <strong>lit</strong> les saisies, <strong>appelle</strong> les services, <strong>affiche</strong> les résultats et les erreurs. Elle ne contient aucune règle métier ni SQL : c'est un simple guichet. C'est la couche la plus fine et la plus <strong>remplaçable</strong> — demain on pourrait mettre une API (interface pour d'autres programmes), un jour une GUI (interface graphique avec fenêtres et boutons), sans toucher au reste.</p>

<h3>2. La connexion détenue par un smart pointer</h3>
<pre class="pseudo">std::unique_ptr&lt;sql::Connection&gt; con(
    driver-&gt;connect(url, user, motDePasse));   // le driver alloue, on possède
con-&gt;setSchema("ludotheque");                  // choisit la base a utiliser</pre>
<p>Un <strong>smart pointer</strong> (« pointeur intelligent ») est une boîte qui contient un objet et le range automatiquement quand on n'en a plus besoin. Le <code>std::unique_ptr</code> <strong>possède</strong> la connexion : à la fin du programme (ou de la <strong>portée</strong>, c'est-à-dire le bloc où il vit), il la détruit (<code>delete</code>) tout seul. Aucun <code>delete</code> manuel, aucune fuite, même en cas d'exception.</p>

<h3>3. La boucle de menu</h3>
<pre class="pseudo">while (true) {                             // boucle infinie : le menu se rejoue tant qu'on ne sort pas
    afficherMenu(utilisateur);             // affiche les options selon le role
    int choix = lireEntier("Votre choix : ");   // lit le numero choisi (saisie robuste)
    try {                                  // surveille les erreurs venant des services
        switch (choix) {                   // aiguille selon le choix
            case 1: catalogue(*con); break;        // 1 : affiche le catalogue
            case 2: louer(*con, utilisateur); break;   // 2 : lance une location
            case 0: return;                        // 0 : quitte le menu (et la fonction)
            default: std::cout &lt;&lt; "Choix inconnu\\n";   // tout autre nombre : message
        }
    } catch (const std::exception&amp; e) {    // attrape toute exception remontee d'un service
        std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";   // on traduit ici
    }
}</pre>
<div class="tip">La <strong>boucle de menu</strong> répète : afficher les choix, lire, exécuter. Le <code>try/catch</code> autour du menu attrape toute exception d'un service et la présente proprement à l'utilisateur. Le service <strong>lance</strong>, l'UI <strong>traduit</strong> : séparation nette entre le chemin d'erreur et la présentation.</div>

<h3>4. Lire une saisie robuste</h3>
<pre class="pseudo">int lireEntier(const std::string&amp; invite) {   // lit un entier, en insistant jusqu'a reussir
    while (true) {                             // boucle jusqu'a obtenir un nombre valide
        std::cout &lt;&lt; invite;                   // affiche le message d'invite
        int x;                                 // la variable qui recevra le nombre
        if (std::cin &gt;&gt; x) return x;           // si la lecture reussit : renvoie x
        std::cin.clear();                          // efface l'état d'erreur
        std::cin.ignore(10000, '\\n');             // vide la ligne fautive
        std::cout &lt;&lt; "Entrez un nombre.\\n";    // signale l'erreur, puis reboucle
    }
}</pre>
<div class="warn"><code>std::cin</code> est le <strong>flux d'entrée</strong> (le clavier). Une saisie invalide (des lettres au lieu d'un nombre) le met en échec : on le <strong>nettoie</strong> avec <code>clear()</code> (efface l'état d'erreur) et <code>ignore()</code> (jette la ligne fautive) avant de redemander, sinon la boucle s'emballe à l'infini. Toujours valider ce qui vient de l'utilisateur.</div>

<h3>5. Passer *con aux services</h3>
<p>On passe <code>*con</code> (l'étoile « ouvre la boîte » et donne une référence <code>sql::Connection&amp;</code>) aux services : ils utilisent la connexion sans en <strong>prendre possession</strong>. La possession reste au <code>unique_ptr</code> de l'UI, seul responsable de la fermeture — comme prêter sa voiture sans en donner la carte grise.</p>`,

    { type: "qcm", q: "Le service lance, l'UI…", opts: ["ignore", "traduit/affiche l'erreur", "relance", "quitte"], a: 1, exp: "Séparation." },

    { type: "qcm", q: "La couche UI est…", opts: ["la plus complexe", "la plus fine et la plus remplaçable", "irremplaçable", "celle qui décide"], a: 1, exp: "Console → API → GUI." },
    { type: "qcm", q: "lireEntier valide…", opts: ["rien", "que la saisie est bien un nombre", "le stock", "le rôle"], a: 1, exp: "Saisie robuste." },

    { type: "qcm", q: "e.what() dans le catch donne…", opts: ["le type brut", "le message d'erreur à présenter", "la ligne", "rien"], a: 1, exp: "Message lisible." },
    { type: "qcm", q: "std::cin.ignore(10000, '\\n') …", opts: ["lit un nombre", "vide le reste de la ligne fautive", "ferme cin", "affiche"], a: 1, exp: "Nettoyage." },
    { type: "qcm", q: "Demain, remplacer la console par une API demande de…", opts: ["tout réécrire", "changer surtout l'UI, les services restent", "refaire la base", "rien"], a: 1, exp: "Couches découplées." },
    { type: "qcm", q: "L'UI accède aux données…", opts: ["directement en SQL", "via les services (qui délèguent aux dépôts)", "au hasard", "jamais"], a: 1, exp: "Respect des couches." }
  ],
  final: {
    title: "Exercice final — Une boucle de menu sûre",
    intro: `<p>Une boucle sans filet :</p>
<pre class="pseudo">while (true) {                             // boucle de menu (version SANS filet)
    int choix = lireEntier("Choix : ");    // lit le choix

}</pre>`,
    questions: [
      { type: "qcm", q: "Le défaut :", opts: ["aucun", "aucun try/catch : une exception d'un service ferait planter le menu", "trop lent", "trop long"], a: 1, exp: "Erreurs non gérées." },

      { type: "qcm", q: "Où traduit-on l'erreur en message ?", opts: ["dans le service", "dans l'UI (le catch)", "dans le dépôt", "nulle part"], a: 1, exp: "Présentation." },
      { type: "qcm", q: "La connexion doit être détenue par…", opts: ["un pointeur nu", "un std::unique_ptr", "une globale", "rien"], a: 1, exp: "RAII." },
      { type: "qcm", q: "On passe la connexion au service via…", opts: ["*con (référence)", "une copie", "le driver", "un fichier"], a: 0, exp: "Sans transfert de possession." }
    ],
    solution: `<pre class="pseudo">while (true) {                             // boucle de menu (version sure)
    afficherMenu(u);                       // affiche les options
    int choix = lireEntier("Choix : ");    // lit le choix (saisie robuste)
    try {                                  // surveille les erreurs des services
        switch (choix) {                   // aiguille selon le choix
            case 1: louer(*con, u); break;         // 1 : lance une location
            case 0: return;                        // 0 : quitte

        }
    } catch (const std::exception&amp; e) {    // attrape toute exception d'un service
        std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";   // l'UI traduit
    }
}</pre>
<p>Un <code>try/catch</code> autour du menu : les services lancent, l'UI présente, la connexion vit dans un <code>unique_ptr</code>. Demain : recherche, filtres et pagination.</p>`
  }
