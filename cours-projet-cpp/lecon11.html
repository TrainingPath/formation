  title: "Autorisation selon le rôle",
  subtitle: "Authentifié ≠ tout permis : chaque opération sensible vérifie le rôle.",
  theory: `
<h3>1. Authentification vs autorisation</h3>
<p>Ce sont deux questions différentes. L'<strong>authentification</strong> répond à « <em>qui es-tu ?</em> » (elle établit l'identité, leçon 10). L'<strong>autorisation</strong> répond à « <em>as-tu le droit de faire ceci ?</em> ». Passer le portique d'entrée d'un immeuble (authentification) ne donne pas la clé de tous les appartements (autorisation). Une fois connu, l'utilisateur n'a droit qu'à ce que son rôle permet.</p>

<h3>2. Des gardes centralisés</h3>
<pre class="pseudo">bool peutGererStock(const Utilisateur&amp; u) {                    // le vendeur et l'admin peuvent gerer le stock
    return u.role() == Role::Vendeur || u.role() == Role::Admin;   // vrai si le role vaut Vendeur OU Admin
}
bool peutAdministrer(const Utilisateur&amp; u) {                   // seul l'admin peut administrer
    return u.role() == Role::Admin;                           // vrai uniquement si le role vaut Admin
}</pre>
<p>Un <strong>garde</strong> est une petite fonction qui répond par oui ou non à « a-t-on le droit ? ». Ces gardes <strong>centralisent</strong> (rassemblent en un seul endroit) les règles d'accès. On les appelle au début de chaque service sensible, au lieu d'éparpiller partout des <code>if (role == ...)</code> qu'on finirait par écrire différemment.</p>

<h3>3. Vérifier dans le service, pas seulement dans l'UI</h3>
<pre class="pseudo">void StockService::reappro(const Utilisateur&amp; u, sql::Connection&amp; con,   // reapprovisionne : ajoute du stock a un jeu
                           int jeuId, int n) {                           // jeuId = quel jeu ; n = combien ajouter
    if (!peutGererStock(u))                              // si l'utilisateur n'a pas le droit...
        throw AccesRefuse("Reserve au vendeur/admin");   // refuse AVANT toute action
    if (n &lt;= 0)                                          // si la quantite n'est pas positive...
        throw SaisieInvalide("Quantite invalide");       // ...refuse la saisie
    JeuRepository::ajouterStock(con, jeuId, n);          // controles passes : delegue l'ecriture au depot
}</pre>
<div class="warn">Cacher un bouton dans le menu ne suffit PAS : c'est du confort, pas de la sécurité. La vraie barrière est le contrôle dans le <strong>service</strong>, exécuté à chaque appel — car un utilisateur malveillant pourrait déclencher l'action par un autre chemin.</div>

<h3>4. Le principe du moindre privilège</h3>
<p>Le <strong>moindre privilège</strong> : chaque rôle reçoit le <strong>minimum</strong> de droits nécessaires, pas un de plus. Le client ne gère pas le stock ; le vendeur ne gère pas les comptes. En cas de doute, on <strong>refuse</strong> — c'est le « deny by default » (par défaut, aucun droit), comme une porte fermée à clé tant qu'on n'a pas explicitement le droit d'entrer.</p>

<h3>5. Centraliser pour auditer</h3>
<div class="tip">Centraliser les gardes rend l'<strong>audit</strong> (l'inspection de « qui peut quoi ») facile : pour savoir qui peut réapprovisionner, on lit une seule fonction. Ajouter un rôle ou une règle se fait à un seul endroit. Le refus passe par une <strong>exception</strong> (<code>AccesRefuse</code>), attrapée et traduite en message par l'UI.</div>`,
  exercises: [
    { type: "qcm", q: "L'autorisation répond à…", opts: ["qui es-tu ?", "as-tu le droit de faire ceci ?", "quel prix ?", "quel stock ?"], a: 1, exp: "Les droits." },
    { type: "qcm", q: "Un utilisateur authentifié a-t-il tous les droits ?", opts: ["oui", "non : seulement ceux de son rôle", "selon l'heure", "toujours"], a: 1, exp: "Authentifié ≠ tout permis." },
    { type: "qcm", q: "Les gardes (peutGererStock…) servent à…", opts: ["afficher", "centraliser les règles d'accès", "trier", "chiffrer"], a: 1, exp: "Une source pour l'audit." },
    { type: "qcm", q: "Où vérifier l'autorisation ?", opts: ["dans l'UI seulement", "dans le service, à chaque opération sensible", "nulle part", "dans le CMakeLists"], a: 1, exp: "La vraie barrière." },
    { type: "qcm", q: "Cacher un bouton dans le menu…", opts: ["suffit à sécuriser", "est du confort, pas de la sécurité", "remplace le contrôle", "est inutile"], a: 1, exp: "L'action pourrait être déclenchée autrement." },
    { type: "qcm", q: "peutGererStock autorise…", opts: ["le client", "vendeur et admin", "tout le monde", "personne"], a: 1, exp: "Pas le client." },
    { type: "qcm", q: "Le moindre privilège :", opts: ["tout permettre", "donner le minimum de droits nécessaires", "un seul rôle", "aucun contrôle"], a: 1, exp: "Sécurité par défaut." },
    { type: "qcm", q: "En cas de doute sur un droit, on…", opts: ["autorise", "refuse (deny by default)", "demande à l'UI", "ignore"], a: 1, exp: "Refus par défaut." },
    { type: "qcm", q: "Un service refuse un accès en…", opts: ["renvoyant OK", "lançant AccesRefuse (exception)", "affichant", "ignorant"], a: 1, exp: "Exception typée." },
    { type: "qcm", q: "Le contrôle d'accès s'exécute…", opts: ["une fois au démarrage", "à chaque appel du service sensible", "à l'affichage seulement", "jamais"], a: 1, exp: "Systématiquement." },
    { type: "vf", q: "Masquer une option dans le menu remplace le contrôle côté service.", a: false, exp: "Faux : confort, pas sécurité." },
    { type: "qcm", q: "Centraliser les gardes facilite…", opts: ["les fuites", "l'audit et l'ajout de règles", "les injections", "rien"], a: 1, exp: "Un seul endroit." },
    { type: "qcm", q: "peutAdministrer autorise…", opts: ["le client", "le vendeur", "seulement l'admin", "tout le monde"], a: 2, exp: "Gestion des comptes réservée." },
    { type: "qcm", q: "Le contrôle vient…", opts: ["après l'écriture", "avant toute action (refuser tôt)", "à l'affichage", "jamais"], a: 1, exp: "On bloque avant d'agir." },
    { type: "qcm", q: "Un vendeur peut-il gérer les comptes ?", opts: ["oui", "non (réservé admin)", "selon l'heure", "toujours"], a: 1, exp: "Moindre privilège." }
  ],
  final: {
    title: "Exercice final — Protéger une action admin",
    intro: `<p>Supprimer un compte est réservé à l'admin. Analyse :</p>
<pre class="pseudo">void CompteService::supprimer(const Utilisateur&amp; u, sql::Connection&amp; con, int cibleId) {   // version A CORRIGER
    UtilisateurRepository::supprimer(con, cibleId);   // PROBLEME : supprime sans verifier le role (n'importe qui !)
}</pre>`,
    questions: [
      { type: "qcm", q: "Que manque-t-il ?", opts: ["rien", "un contrôle : peutAdministrer(u)", "un printf", "un sleep"], a: 1, exp: "N'importe qui pourrait supprimer." },
      { type: "qcm", q: "Si u n'est pas admin, on…", opts: ["supprime quand même", "lance AccesRefuse", "renvoie 0", "affiche"], a: 1, exp: "Accès refusé." },
      { type: "qcm", q: "Le contrôle vient…", opts: ["après la suppression", "avant, tout au début du service", "dans l'UI seulement", "jamais"], a: 1, exp: "Refuser avant d'agir." },
      { type: "qcm", q: "Suffit-il de cacher l'option dans le menu admin ?", opts: ["oui", "non : le service doit vérifier lui-même", "selon le rôle", "toujours"], a: 1, exp: "Le menu n'est pas une barrière." },
      { type: "qcm", q: "Bonus de sécurité :", opts: ["aucun", "empêcher un admin de se supprimer lui-même", "supprimer plus vite", "logger le mdp"], a: 1, exp: "Cas limite." }
    ],
    solution: `<pre class="pseudo">void CompteService::supprimer(const Utilisateur&amp; u,               // version corrigee
                             sql::Connection&amp; con, int cibleId) {   // cibleId = le compte a supprimer
    if (!peutAdministrer(u))                            // si l'utilisateur n'est pas admin...
        throw AccesRefuse("Reserve a l'administrateur");   // seul l'admin
    if (u.id() == cibleId)                              // s'il tente de se supprimer lui-meme...
        throw SaisieInvalide("Impossible de se supprimer soi-meme");   // ...refuse ce cas limite
    UtilisateurRepository::supprimer(con, cibleId);     // controle passe : delegue la suppression au depot
}</pre>
<p>Contrôle d'autorisation en premier, garde-fou sur soi-même, exception en cas de refus. La sécurité est dans le service, pas dans le menu. Demain : louer avec une transaction.</p>`
  }
