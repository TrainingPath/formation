<script>
var DAY = {
  num: 6,
  title: "Écrire : requêtes préparées (anti-injection)",
  subtitle: "Insérer une saisie utilisateur sans ouvrir la porte à l'injection SQL, avec PreparedStatement.",
  theory: `
<h3>1. Le danger : la concaténation</h3>
<p>Une <strong>saisie</strong> est un texte tapé par l'utilisateur. La <strong>concaténation</strong>, c'est coller des morceaux de texte bout à bout avec <code>+</code>. Coller une saisie directement dans une requête SQL est extrêmement dangereux :</p>
<pre class="pseudo">// À NE JAMAIS FAIRE avec une saisie :
std::string sql = "INSERT INTO jeu(nom) VALUES('" + nomSaisi + "')";   // colle la saisie DANS le texte de la requete
stmt-&gt;executeUpdate(sql);                                              // execute cette requete fabriquee (un INSERT)</pre>
<p>Si <code>nomSaisi</code> vaut <code>x'); DROP TABLE jeu;--</code>, la saisie referme la chaîne et ajoute une commande destructrice (<code>DROP TABLE</code> supprime toute la table) que la base exécute. C'est l'<strong>injection SQL</strong> : l'utilisateur fait passer du <em>code</em> à la place d'une simple <em>donnée</em>. C'est la faille de sécurité n°1 (en tête du classement OWASP des vulnérabilités web).</p>

<h3>2. La parade : le PreparedStatement</h3>
<pre class="pseudo">std::unique_ptr&lt;sql::PreparedStatement&gt; pstmt(       // range la requete preparee dans un unique_ptr (RAII)
    con.prepareStatement(
        "INSERT INTO jeu(nom,prix_location,prix_achat) VALUES(?,?,0)"));   // modele : les ? seront remplis ensuite, le 0 est fixe
pstmt-&gt;setString(1, nom);     // paramètres liés (indices à partir de 1)
pstmt-&gt;setDouble(2, prix);    // lie la 2e valeur : le prix (un reel)
pstmt-&gt;executeUpdate();       // INSERT/UPDATE : executeUpdate</pre>
<p>On envoie un <strong>modèle</strong> de requête troué de <code>?</code>, puis on <strong>lie</strong> (rattache) chaque valeur à sa place avec <code>setString</code>, <code>setInt</code> ou <code>setDouble</code> selon le type. Le SQL (le code) et les données (les valeurs) ne se mélangent jamais.</p>

<h3>3. Pourquoi c'est sûr</h3>
<div class="warn">Une valeur liée est traitée comme une <strong>donnée pure</strong>, jamais comme du SQL. Même le texte <code>'); DROP TABLE...</code> devient un simple nom inséré tel quel dans la colonne. Le <code>?</code> agit comme une <strong>frontière infranchissable</strong> entre le code et les données — comme un guichet blindé où l'on glisse un papier sans jamais pouvoir passer de l'autre côté.</div>

<h3>4. executeQuery vs executeUpdate</h3>
<p>Deux méthodes selon ce qu'on fait (ci-dessous une légende, pas du code) :</p>
<pre class="pseudo">executeQuery()   → renvoie un ResultSet (SELECT)
executeUpdate()  → renvoie le nombre de lignes affectées (INSERT/UPDATE/DELETE)</pre>
<p>On lit (<code>SELECT</code>) avec <code>executeQuery</code>, qui rend un tableau de résultats ; on modifie la base (<code>INSERT</code> pour ajouter, <code>UPDATE</code> pour changer, <code>DELETE</code> pour supprimer) avec <code>executeUpdate</code>, qui rend le nombre de lignes touchées.</p>

<h3>5. Isoler dans le dépôt</h3>
<div class="tip">Toute écriture à partir d'une donnée externe passe par un <strong>PreparedStatement</strong>, encapsulé dans le dépôt : le service demande simplement « ajoute ce jeu » sans voir le SQL. Les requêtes préparées sont <strong>obligatoires</strong> dès qu'une valeur vient de l'extérieur (saisie clavier, fichier, réseau) — la sécurité découle alors de la <strong>conception</strong> elle-même, pas d'un test que l'on pourrait oublier.</div>`,
  exercises: [
    { type: "qcm", q: "L'injection SQL vient de…", opts: ["requêtes préparées", "la concaténation d'une saisie dans le SQL", "MySQL lui-même", "l'UI"], a: 1, exp: "Coller une saisie est dangereux." },
    { type: "qcm", q: "La parade principale est…", opts: ["chiffrer", "le PreparedStatement (avec des ?)", "cacher le SQL", "un mot de passe long"], a: 1, exp: "Séparer code et données." },
    { type: "qcm", q: "Le ? dans une requête préparée représente…", opts: ["un commentaire", "un emplacement de valeur à lier", "une erreur", "une colonne"], a: 1, exp: "On lie ensuite." },
    { type: "qcm", q: "On lie une chaîne avec…", opts: ["setInt", "setString(index, valeur)", "getString", "bind"], a: 1, exp: "Type adapté." },
    { type: "qcm", q: "Les index de paramètres commencent à…", opts: ["0", "1", "-1", "au hasard"], a: 1, exp: "setString(1, ...)." },
    { type: "qcm", q: "Une valeur liée est traitée comme…", opts: ["du code SQL", "une donnée pure", "un commentaire", "une colonne"], a: 1, exp: "Jamais interprétée." },
    { type: "qcm", q: "executeUpdate sert pour…", opts: ["un SELECT", "INSERT/UPDATE/DELETE", "un COMMIT seul", "un CREATE seul"], a: 1, exp: "Renvoie le nb de lignes." },
    { type: "qcm", q: "executeQuery sert pour…", opts: ["INSERT", "SELECT (renvoie un ResultSet)", "DELETE", "COMMIT"], a: 1, exp: "Lecture." },
    { type: "qcm", q: "Quand les requêtes préparées sont-elles obligatoires ?", opts: ["jamais", "dès qu'une valeur vient de l'extérieur", "pour les SELECT seuls", "pour les DROP"], a: 1, exp: "Toute donnée externe." },
    { type: "qcm", q: "La sécurité contre l'injection vient…", opts: ["d'un test", "de la conception (le ?)", "d'un log", "d'un secret"], a: 1, exp: "Structurelle." },
    { type: "vf", q: "Concaténer une saisie dans une requête est acceptable si elle est courte.", a: false, exp: "Faux : toujours un PreparedStatement." },
    { type: "qcm", q: "Le PreparedStatement est encapsulé dans…", opts: ["l'UI", "le dépôt", "le CMakeLists", "main"], a: 1, exp: "Le service demande juste « ajoute »." },
    { type: "qcm", q: "L'injection SQL est classée…", opts: ["anecdotique", "parmi les failles les plus graves (top OWASP)", "obsolète", "impossible en C++"], a: 1, exp: "Faille majeure." },
    { type: "qcm", q: "setDouble(2, prix) lie…", opts: ["une chaîne", "la 2e valeur (un réel)", "un id", "une date"], a: 1, exp: "Type et position." },
    { type: "qcm", q: "Un bénéfice bonus des requêtes préparées :", opts: ["moins de code toujours", "de meilleures perfs si réexécutées", "pas besoin de vérifier", "elles chiffrent"], a: 1, exp: "Plan réutilisé." }
  ],
  final: {
    title: "Exercice final — Repérer la faille",
    intro: `<p>Un vendeur ajoute un jeu dont le nom est saisi. Analyse :</p>
<pre class="pseudo">std::string sql = "INSERT INTO jeu(nom,prix_location) VALUES('"
                  + nom + "', " + std::to_string(prix) + ")";
con.createStatement()-&gt;executeUpdate(sql);</pre>`,
    questions: [
      { type: "qcm", q: "Le risque avec <code>nom</code> saisi :", opts: ["aucun", "injection SQL", "trop lent", "trop long"], a: 1, exp: "Saisie collée." },
      { type: "qcm", q: "Exemple d'attaque via nom :", opts: ["un nom vide", "x'); DROP TABLE jeu;--", "un nombre", "un espace"], a: 1, exp: "Referme la chaîne et injecte." },
      { type: "qcm", q: "La bonne solution :", opts: ["échapper à la main", "un PreparedStatement avec des ?", "raccourcir le nom", "chiffrer"], a: 1, exp: "Paramètres liés." },
      { type: "qcm", q: "Le pointeur brut <code>createStatement()->...</code> est aussi…", opts: ["idéal", "une fuite potentielle : préférer unique_ptr", "rapide", "sûr"], a: 1, exp: "RAII." },
      { type: "qcm", q: "Après executeUpdate, il faut delete le statement ?", opts: ["oui", "non si on utilise un unique_ptr (RAII)", "toujours", "jamais possible"], a: 1, exp: "Fermeture auto." }
    ],
    solution: `<pre class="pseudo">void JeuRepository::ajouter(sql::Connection&amp; con,          // ajoute un jeu dans la base
                           const std::string&amp; nom, double prix) {   // recoit le nom (texte) et le prix
    std::unique_ptr&lt;sql::PreparedStatement&gt; pstmt(          // requete preparee (fermee tout seule : RAII)
        con.prepareStatement(
            "INSERT INTO jeu(nom,prix_location,prix_achat) VALUES(?,?,0)"));   // modele : 2 trous ? et un 0 fixe
    pstmt-&gt;setString(1, nom);     // impossible d'injecter
    pstmt-&gt;setDouble(2, prix);    // lie le prix (2e trou ?)
    pstmt-&gt;executeUpdate();       // execute reellement l'INSERT
}   // pstmt fermé automatiquement (RAII)</pre>
<p>Le <code>?</code> sépare définitivement code et données ; l'<code>unique_ptr</code> gère la ressource. Réflexe non négociable. Demain : la couche service et les règles métier.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "projcpp-l06", title: "Chercher par nom, en sûreté", level: 3,
    statement: "Écris le squelette de JeuRepository::chercherParNom(con, terme) utilisant un PreparedStatement avec « WHERE nom LIKE CONCAT('%', ?, '%') ». Montre la préparation et la liaison du terme (setString), sans lire les résultats en détail.",
    hints: [
      "Le modèle contient un seul ? pour le terme.",
      "pstmt->setString(1, terme) ; le % appartient au SQL (CONCAT), pas à la valeur.",
      "unique_ptr pour le PreparedStatement."
    ],
    solution: "#include <cppconn/prepared_statement.h>   // pour sql::PreparedStatement (requete preparee)\n#include <cppconn/resultset.h>            // pour sql::ResultSet (le resultat)\n#include <memory>                         // pour std::unique_ptr\n#include <vector>                         // pour std::vector (la liste)\n\nstd::vector<Jeu> JeuRepository::chercherParNom(          // cherche les jeux dont le nom contient un terme\n        sql::Connection& con, const std::string& terme) {   // recoit la connexion et le terme cherche\n    std::unique_ptr<sql::PreparedStatement> pstmt(con.prepareStatement(   // requete preparee\n        \"SELECT id,nom FROM jeu WHERE nom LIKE CONCAT('%', ?, '%') ORDER BY nom\"));   // LIKE = ressemblance, % = joker\n    pstmt->setString(1, terme);        // le terme est une DONNEE liee\n    std::unique_ptr<sql::ResultSet> res(pstmt->executeQuery());   // execute et recupere le resultat\n    std::vector<Jeu> jeux;             // la liste a remplir\n    // ... while (res->next()) jeux.emplace_back(...) ...\n    return jeux;                       // renvoie la liste des jeux trouves\n}",
    note: "Le terme de recherche est une donnée liée (setString) : impossible d'injecter, même avec un % ou une apostrophe. Les jokers du LIKE restent côté SQL, dans le CONCAT. Le PreparedStatement encapsulé dans le dépôt sécurise toute recherche." }
  ]
};
