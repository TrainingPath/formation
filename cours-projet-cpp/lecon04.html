<script>
var DAY = {
  num: 4,
  title: "Le modèle en classes : Jeu, Categorie",
  subtitle: "Refléter les tables en classes encapsulées : une ligne de la base = un objet valide.",
  theory: `
<h3>1. Une classe par table</h3>
<p>Rappel : une <strong>classe</strong> est un moule qui regroupe des données et les actions qui vont avec. Chaque table de la base a son miroir en C++ sous forme de classe <strong>encapsulée</strong>. L'<strong>encapsulation</strong> consiste à ranger les données à l'intérieur et à ne laisser sortir que ce qui est utile — comme une capsule de médicament qui protège son contenu. Les colonnes deviennent des <strong>membres privés</strong> (des cases internes, invisibles de l'extérieur), que l'on lit à travers des <strong>getters</strong> (« accesseurs », de petites méthodes qui donnent la valeur) marqués <code>const</code> (qui promettent de ne rien modifier).</p>
<pre class="pseudo">class Jeu {                              // declare une classe "Jeu" (le moule d'un jeu de la base)
    int id_;                             // identifiant du jeu -- prive : cache de l'exterieur
    std::string nom_;                    // nom du jeu (texte)
    double prixAchat_, prixLocation_;    // les deux prix (nombres a virgule)
    int stockVente_, stockLocation_;     // les deux stocks (entiers)
public:                                  // a partir d'ici : la partie visible de l'exterieur
    Jeu(int id, std::string nom, double pa, double pl, int sv, int sl)   // constructeur : fabrique un Jeu complet
        : id_(id), nom_(nom), prixAchat_(pa), prixLocation_(pl),         // liste d'initialisation : remplit chaque membre...
          stockVente_(sv), stockLocation_(sl) {}                         // ...avec la valeur recue (le corps {} reste vide)
    int id() const { return id_; }                          // getter : rend l'id sans modifier l'objet (const)
    const std::string&amp; nom() const { return nom_; }         // getter du nom, rendu par reference (sans copie)
    double prixLocation() const { return prixLocation_; }   // getter du prix de location
    int stockLocation() const { return stockLocation_; }    // getter du stock de location
    bool estDisponibleLocation() const { return stockLocation_ &gt; 0; }   // vrai s'il reste au moins 1 a louer
};</pre>
<p><code>int</code>, <code>double</code> (nombre à virgule) et <code>std::string</code> (texte) sont les <strong>types</strong> des membres. Le tiret bas final (<code>id_</code>, <code>nom_</code>) est une convention pour repérer d'un coup d'œil les membres privés. Le mot <code>public</code> ouvre la partie accessible de l'extérieur.</p>

<h3>2. L'encapsulation, pas une simple struct</h3>
<div class="warn">On aurait pu utiliser une <code>struct</code> (une structure, comme en langage C : une boîte dont toutes les cases sont ouvertes à tous). Mais une <strong>classe</strong> à membres privés garantit qu'un <code>Jeu</code> est toujours <strong>valide</strong> (obligatoirement créé par le constructeur) et ne peut pas être trafiqué n'importe comment de l'extérieur. C'est le grand bénéfice de l'objet : l'<strong>état</strong> (les valeurs internes) est protégé.</div>

<h3>3. Le constructeur garantit la validité</h3>
<p>Le <strong>constructeur</strong> est la méthode spéciale qui « fabrique » l'objet : il porte le nom de la classe et s'exécute à sa naissance. Ici il remplit tous les membres via une <strong>liste d'initialisation</strong> (la partie après les <code>:</code>) : un <code>Jeu</code> naît donc complet, jamais à moitié rempli — pas de « demi-objet » incohérent.</p>

<h3>4. Des méthodes métier légères</h3>
<pre class="pseudo">bool estDisponibleLocation() const { return stockLocation_ &gt; 0; }   // vrai s'il reste du stock a louer
double valeurStock() const { return prixAchat_ * stockVente_; }     // valeur du stock de vente = prix x quantite</pre>
<p>Une <strong>méthode</strong> est une action que sait faire l'objet. La classe peut porter de petites méthodes de calcul qui ne concernent qu'elle-même (« ai-je du stock ? », « quelle est ma valeur ? »). Les règles plus larges (tarifs, transactions entre plusieurs objets) restent, elles, dans les <strong>services</strong>.</p>

<h3>5. Le modèle, vocabulaire commun</h3>
<div class="tip">Les classes du <strong>domaine</strong> (<code>Jeu</code>, <code>Categorie</code>, <code>Utilisateur</code>, <code>Location</code>) — c'est-à-dire les objets du monde réel que l'on représente — forment le <strong>vocabulaire</strong> du projet, partagé par toutes les couches. Le dépôt les construit depuis MySQL, les services les manipulent, l'UI les affiche : tout le monde parle du même <code>Jeu</code>. Un objet précis créé à partir d'une classe s'appelle une <strong>instance</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "En C++, on modélise une table par…", opts: ["une fonction", "une classe encapsulée", "un enum", "un tableau"], a: 1, exp: "Une classe par entité." },
    { type: "qcm", q: "Les colonnes deviennent…", opts: ["des méthodes", "des membres privés (exposés par des getters const)", "des tables", "des fichiers"], a: 1, exp: "Encapsulation." },
    { type: "qcm", q: "Un DECIMAL SQL se mappe en C++ par…", opts: ["int", "double", "std::string obligatoire", "bool"], a: 1, exp: "getDouble." },
    { type: "qcm", q: "Un VARCHAR devient…", opts: ["char[]", "std::string", "int", "double"], a: 1, exp: "Type sûr du C++." },
    { type: "qcm", q: "Pourquoi une classe plutôt qu'une struct ?", opts: ["c'est identique", "l'encapsulation garantit un objet toujours valide", "c'est plus lent", "obligatoire"], a: 1, exp: "État protégé." },
    { type: "qcm", q: "Le constructeur garantit…", opts: ["un objet vide", "un objet complet et valide", "une copie", "rien"], a: 1, exp: "Pas de demi-objet." },
    { type: "qcm", q: "Un getter est déclaré…", opts: ["non-const", "const (il ne modifie pas l'objet)", "private", "static"], a: 1, exp: "Lecture seule." },
    { type: "qcm", q: "estDisponibleLocation() est…", opts: ["un setter", "une petite méthode métier de lecture (const)", "un constructeur", "une erreur"], a: 1, exp: "Calcul propre à l'objet." },
    { type: "qcm", q: "Les règles larges (tarifs, transactions) vivent…", opts: ["dans la classe Jeu", "dans les services", "dans l'UI", "dans le CMakeLists"], a: 1, exp: "Séparation des responsabilités." },
    { type: "qcm", q: "Les classes du domaine forment…", opts: ["le CMakeLists", "le vocabulaire commun du projet", "les tests", "l'UI"], a: 1, exp: "Partagé par les couches." },
    { type: "vf", q: "Une classe protège son état (membres privés) mieux qu'une struct publique.", a: true, exp: "Encapsulation." },
    { type: "qcm", q: "const std::string& nom() const évite…", opts: ["le tri", "une copie du nom à chaque appel", "les exceptions", "rien"], a: 1, exp: "Getter efficace." },
    { type: "qcm", q: "Un objet Jeu se construit avec…", opts: ["Jeu j;", "Jeu j(id, nom, pa, pl, sv, sl);", "new struct", "Jeu = 3"], a: 1, exp: "Le constructeur." },
    { type: "qcm", q: "Le dépôt construit les Jeu depuis…", opts: ["l'UI", "MySQL (ResultSet)", "le CMakeLists", "rien"], a: 1, exp: "Mapping (leçon 5)." },
    { type: "qcm", q: "Un « demi-objet » (à moitié rempli) est…", opts: ["autorisé", "évité par le constructeur (objet toujours complet)", "recommandé", "rapide"], a: 1, exp: "Validité garantie." }
  ],
  final: {
    title: "Exercice final — La classe Utilisateur",
    intro: `<p>On modélise l'utilisateur. Analyse :</p>
<pre class="pseudo">class Utilisateur {                  // version A CORRIGER (tout public, types mal choisis)
public:                             // membres PUBLICS : n'importe qui peut les modifier (probleme)
    int id;                         // identifiant
    char login;                     // PROBLEME : char = UN seul caractere, pas un texte
    int role;                       // le role, ici un simple entier peu lisible
    std::string mot_de_passe;       // PROBLEME : on ne doit jamais stocker le mot de passe en clair
};</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — membres publics :", opts: ["correct", "mieux : membres privés + getters (encapsulation)", "il faut struct", "rien"], a: 1, exp: "Protéger l'état." },
      { type: "qcm", q: "Problème n°2 — <code>char login</code> :", opts: ["correct", "un login est du texte : std::string login_", "il faut int", "rien"], a: 1, exp: "Un char = un caractère." },
      { type: "qcm", q: "Problème n°3 — stocker <code>mot_de_passe</code> :", opts: ["correct", "on ne stocke jamais le mot de passe : seulement son hash", "il faut char", "rien"], a: 1, exp: "Sécurité." },
      { type: "qcm", q: "Le champ role gagnerait à être…", opts: ["un double", "une enum class Role (leçon 9)", "un char", "un pointeur"], a: 1, exp: "Typé et lisible." },
      { type: "qcm", q: "Où placer la classe ?", opts: ["dans l'UI", "dans le modèle (modele/Utilisateur.h)", "dans le CMakeLists", "dans le dépôt seul"], a: 1, exp: "Vocabulaire commun." }
    ],
    solution: `<pre class="pseudo">enum class Role { Client, Vendeur, Admin };   // un type "Role" a 3 valeurs nommees et lisibles

class Utilisateur {                  // version corrigee, encapsulee
    int id_;                         // identifiant (prive)
    std::string login_;              // login en texte (std::string)
    Role role_;                      // role bien type (enum class Role)
public:                              // partie visible
    Utilisateur(int id, std::string login, Role r)   // constructeur : fabrique un utilisateur complet
        : id_(id), login_(login), role_(r) {}        // remplit chaque membre (liste d'initialisation)
    int id() const { return id_; }                   // getter de l'id (const = ne modifie rien)
    const std::string&amp; login() const { return login_; }   // getter du login (par reference, sans copie)
    Role role() const { return role_; }              // getter du role
    // le hash reste géré par le dépôt/auth, pas exposé ici
};</pre>
<p>Membres privés, login en <code>std::string</code>, rôle en <code>enum class</code>, jamais de mot de passe en clair. Le vocabulaire du projet est prêt. Demain : lire ces objets depuis MySQL (le dépôt).</p>`
  }
};
