<script>
var DAY = {
  num: 9,
  title: "Utilisateurs et les trois rôles (enum class)",
  subtitle: "Modéliser les comptes et les profils avec une énumération fortement typée.",
  theory: `
<h3>1. La table utilisateur</h3>
<pre class="pseudo">CREATE TABLE utilisateur (               -- cree la table des comptes utilisateurs
  id                INT AUTO_INCREMENT PRIMARY KEY,   -- identifiant unique auto-genere
  login             VARCHAR(50) UNIQUE NOT NULL,      -- nom de connexion, unique et obligatoire
  mot_de_passe_hash VARCHAR(255) NOT NULL,            -- le hash du mot de passe (jamais en clair)
  role              TINYINT NOT NULL DEFAULT 0   -- 0 client,1 vendeur,2 admin
);</pre>
<p><code>TINYINT</code> est un tout petit entier : il suffit pour coder les trois rôles (0, 1, 2). Le <strong>hash</strong> est une empreinte du mot de passe (un calcul à sens unique) : on ne stocke jamais le mot de passe lui-même, seulement cette empreinte impossible à « remonter ».</p>

<h3>2. enum class Role</h3>
<pre class="pseudo">enum class Role { Client = 0, Vendeur = 1, Admin = 2 };   // un type "Role" a 3 valeurs nommees (et leurs numeros)</pre>
<p>Une <strong>énumération</strong> (<code>enum</code>) est un type dont les valeurs possibles sont des noms au lieu de nombres bruts : au lieu d'écrire <code>2</code>, on écrit <code>Role::Admin</code>, bien plus parlant — comme des boutons étiquetés plutôt qu'une liste de numéros.</p>
<div class="warn">On utilise <code>enum class</code> (énumération <strong>fortement typée</strong>), et non l'<code>enum</code> du C : <code>Role::Admin</code> ne se convertit pas silencieusement en <code>int</code> et n'entre pas en collision de noms avec d'autres énumérations. On écrit toujours <code>Role::Admin</code> de façon explicite — plus sûr et plus lisible.</div>

<h3>3. La classe Utilisateur</h3>
<pre class="pseudo">class Utilisateur {                  // le moule d'un compte utilisateur
    int id_;                         // identifiant (prive)
    std::string login_;              // login en texte
    Role role_;                      // le role : Client, Vendeur ou Admin
public:                              // partie visible de l'exterieur
    Utilisateur(int id, std::string login, Role r)   // constructeur : fabrique un utilisateur complet
        : id_(id), login_(login), role_(r) {}        // remplit chaque membre (liste d'initialisation)
    int id() const { return id_; }                   // getter de l'id (const = lecture seule)
    Role role() const { return role_; }              // getter du role
};</pre>

<h3>4. Convertir depuis la base</h3>
<pre class="pseudo">int r = res-&gt;getInt("role");            // 0, 1 ou 2
Role role = static_cast&lt;Role&gt;(r);       // conversion explicite vers l'enum class</pre>
<p>La colonne <code>role</code> est un entier ; on la transforme en <code>Role</code> par un <strong>static_cast</strong> — une <strong>conversion explicite</strong>, écrite noir sur blanc. Le C++ refuse de convertir tout seul un entier vers une <code>enum class</code> (« conversion implicite ») : cette exigence évite les erreurs de type par distraction.</p>

<h3>5. Ce que chaque rôle peut faire</h3>
<pre class="pseudo">Client   : parcourir, louer, acheter, voir ses locations
Vendeur  : gérer le stock, enregistrer les opérations
Admin    : gérer les jeux et les comptes, voir les statistiques</pre>
<div class="tip">Le rôle est la base de l'<strong>autorisation</strong> (leçon 11) : décider qui a le droit de faire quoi. On ne fait jamais confiance au client pour déclarer son rôle : il vient de la base, chargé au moment de la connexion, et est revérifié à chaque opération sensible.</div>`,
  exercises: [
    { type: "qcm", q: "Le login doit être…", opts: ["quelconque", "unique (UNIQUE NOT NULL)", "un nombre", "optionnel"], a: 1, exp: "Pas deux comptes identiques." },
    { type: "qcm", q: "Le mot de passe est stocké…", opts: ["en clair", "sous forme de hash", "chiffré réversiblement", "encodé en Base64"], a: 1, exp: "Jamais en clair." },
    { type: "qcm", q: "Pourquoi enum class plutôt qu'enum ?", opts: ["c'est identique", "fortement typée : pas de conversion silencieuse en int, pas de collision", "plus lent", "obligatoire"], a: 1, exp: "Plus sûre." },
    { type: "qcm", q: "On écrit une valeur d'enum class…", opts: ["Admin seul", "Role::Admin (qualifiée)", "l'entier 2 directement", "\"Admin\""], a: 1, exp: "Portée explicite." },
    { type: "qcm", q: "Convertir un int en enum class demande…", opts: ["rien (auto)", "un static_cast<Role> explicite", "un reinterpret_cast<Role>", "un cast en string"], a: 1, exp: "Pas de conversion implicite." },
    { type: "qcm", q: "Les trois rôles :", opts: ["Client, Vendeur, Livreur", "Client, Vendeur, Admin", "lecteur, auteur, admin", "Membre, Modérateur, Admin"], a: 1, exp: "Profils de la Ludothèque." },
    { type: "qcm", q: "Fait-on confiance au client pour son rôle ?", opts: ["oui", "non : le rôle vient de la base, vérifié côté serveur", "parfois", "toujours"], a: 1, exp: "Jamais de confiance aveugle." },
    { type: "qcm", q: "Qui peut gérer le stock ?", opts: ["le client", "vendeur et admin", "tout le monde", "personne"], a: 1, exp: "Pas le client." },
    { type: "qcm", q: "Qui gère les comptes ?", opts: ["le client", "le vendeur", "l'admin", "le vendeur et l'admin"], a: 2, exp: "Réservé à l'admin." },
    { type: "qcm", q: "Le rôle sert de base à…", opts: ["l'affichage seul", "l'autorisation (leçon 11)", "au tri des utilisateurs", "au hachage du mot de passe"], a: 1, exp: "Qui a le droit de quoi." },
    { type: "vf", q: "enum class évite les conversions implicites vers int.", a: true, exp: "Plus sûre que l'enum du C." },
    { type: "qcm", q: "Le rôle voyage dans…", opts: ["une variable globale", "l'objet Utilisateur après authentification", "un fichier temporaire", "l'UI seule"], a: 1, exp: "Chargé une fois." },
    { type: "qcm", q: "TINYINT DEFAULT 0 pour role signifie…", opts: ["admin par défaut", "client par défaut (0)", "aucun rôle", "vendeur par défaut"], a: 1, exp: "Nouveau compte = client." },
    { type: "qcm", q: "static_cast<Role>(2) donne…", opts: ["une erreur", "Role::Admin", "une chaîne", "Role::Client"], a: 1, exp: "0→Client, 1→Vendeur, 2→Admin." },
    { type: "qcm", q: "Le rôle est vérifié…", opts: ["une seule fois", "à chaque opération sensible", "jamais", "à l'affichage"], a: 1, exp: "Autorisation systématique." }
  ],
  final: {
    title: "Exercice final — Charger un utilisateur",
    intro: `<p>On lit un utilisateur. Analyse :</p>
<pre class="pseudo">Utilisateur u(res-&gt;getInt("id"),          // 1er argument : l'id (entier)
              res-&gt;getString("login"),    // 2e argument : le login (texte)
              res-&gt;getInt("role"));   // ? PROBLEME : un int, pas un Role (conversion manquante)</pre>`,
    questions: [
      { type: "qcm", q: "Problème — <code>res->getInt(\"role\")</code> passé comme Role :", opts: ["correct", "un int ne se convertit pas en enum class : il faut static_cast<Role>", "il faut getString", "il faut un reinterpret_cast"], a: 1, exp: "Conversion explicite." },
      { type: "qcm", q: "La correction :", opts: ["getString", "static_cast<Role>(res->getInt(\"role\"))", "un cast en C : (Role)res->getInt", "res->getRole()"], a: 1, exp: "Cast explicite." },
      { type: "qcm", q: "Pourquoi le C++ refuse la conversion implicite ?", opts: ["par lenteur", "enum class est fortement typée (sécurité)", "pour économiser la mémoire", "à cause de l'option -Wall"], a: 1, exp: "Évite les erreurs." },
      { type: "qcm", q: "getString(\"login\") renvoie…", opts: ["un int", "un std::string", "un Role", "un double"], a: 1, exp: "Le login." },
      { type: "qcm", q: "Le hash du mot de passe est-il exposé dans cet objet ?", opts: ["oui toujours", "pas nécessairement (on limite l'exposition)", "jamais possible", "seulement à l'affichage"], a: 1, exp: "Sécurité." }
    ],
    solution: `<pre class="pseudo">Utilisateur u(
    res-&gt;getInt("id"),                         // l'id (entier)
    res-&gt;getString("login"),                   // le login (texte)
    static_cast&lt;Role&gt;(res-&gt;getInt("role")));   // int → enum class (explicite)</pre>
<p>Le <code>static_cast&lt;Role&gt;</code> convertit l'entier de la base en <code>enum class</code> : le C++ ne le fait pas tout seul, par sécurité. L'utilisateur est prêt à circuler. Demain : l'authentification.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "projcpp-l09", title: "Libellé d'un rôle", level: 2,
    statement: "Écris une fonction std::string libelleRole(Role r) qui renvoie « client », « vendeur » ou « administrateur » selon le rôle, avec un switch et un cas par défaut « inconnu ». Utilise enum class Role { Client, Vendeur, Admin }.",
    hints: [
      "switch (r) { case Role::Client: return \"client\"; ... }",
      "N'oublie pas de qualifier : Role::Vendeur.",
      "Un default protège des valeurs imprévues."
    ],
    solution: "#include <string>            // pour std::string (le texte)\n\nenum class Role { Client, Vendeur, Admin };   // un type Role a 3 valeurs nommees\n\nstd::string libelleRole(Role r) {   // renvoie le libelle texte d'un role\n    switch (r) {                     // examine la valeur de r\n        case Role::Client:  return \"client\";           // si Client : renvoie client\n        case Role::Vendeur: return \"vendeur\";          // si Vendeur : renvoie vendeur\n        case Role::Admin:   return \"administrateur\";   // si Admin : renvoie administrateur\n        default:            return \"inconnu\";          // valeur imprevue : renvoie inconnu\n    }\n}",
    note: "enum class impose de qualifier les valeurs (Role::Client) : plus verbeux mais sans ambiguïté ni collision de noms. Le switch traduit chaque rôle en libellé, et le default couvre une valeur corrompue. C'est le pendant sûr de l'enum du C." }
  ]
};
