var DAY = {
  num: 18,
  title: "Tests unitaires (GoogleTest / Catch2)",
  subtitle: "Vérifier automatiquement les règles métier — parce qu'elles ont été isolées de la base et de l'écran.",
  theory: `
<h3>1. Pourquoi tester le métier</h3>
<p>Un <strong>test unitaire</strong> est un petit programme qui vérifie automatiquement qu'un morceau de code donne le bon résultat — comme une check-list qu'une machine repasse à chaque modification. Nos règles vivent dans des méthodes <strong>pures</strong> (leçon 7) : <code>tarif</code>, <code>peutLouer</code>, <code>peutAcheter</code>. Pures = pas de base, pas d'écran, juste entrée → sortie. Ce sont les fonctions les plus faciles et les plus utiles à tester : un test qui échoue signale une règle cassée, détectée immédiatement.</p>

<h3>2. Un test avec GoogleTest</h3>
<p><strong>GoogleTest</strong> est un <strong>framework</strong> de test (une boîte à outils prête à l'emploi) pour le C++.</p>
<pre class="pseudo">#include &lt;gtest/gtest.h&gt;                       // apporte le framework de test GoogleTest

TEST(CatalogueService, RemiseDes3Jours) {      // declare un test nomme, dans la suite "CatalogueService"
    Jeu j(1, "Catan", /*prixLoc*/ 4.0, /*prixAchat*/ 30.0);   // ARRANGER : prepare un jeu de test
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 2), 8.0);    // pas de remise
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 3), 10.8);   // -10 % : 12 * 0.9
}</pre>
<p>Un <code>TEST(Suite, Nom)</code> prépare des données, appelle la fonction et <strong>affirme</strong> (« déclare comme devant être vrai ») le résultat attendu avec une <strong>assertion</strong> <code>EXPECT_*</code>. On teste les cas normaux <em>et</em> les cas limites (les valeurs frontière).</p>

<h3>3. La même idée avec Catch2</h3>
<pre class="pseudo">#include &lt;catch2/catch_test_macros.hpp&gt;        // apporte le framework de test Catch2

TEST_CASE("peutLouer suit le stock") {         // declare un cas de test (avec un titre libre)
    Jeu dispo(1, "A", 2, 20); dispo.setStockLocation(1);   // un jeu AVEC stock de location
    Jeu vide (2, "B", 2, 20); vide.setStockLocation(0);    // un jeu SANS stock de location
    REQUIRE(CatalogueService::peutLouer(dispo) == true);   // on exige : dispo => louable
    REQUIRE(CatalogueService::peutLouer(vide)  == false);  // on exige : vide => non louable
}</pre>
<p>Deux frameworks (GoogleTest, Catch2), une même philosophie en trois temps : <strong>arranger</strong> (préparer les données), <strong>agir</strong> (appeler la fonction), <strong>affirmer</strong> (vérifier le résultat).</p>

<h3>4. Tester les exceptions</h3>
<pre class="pseudo">EXPECT_THROW(validerDuree(0),  SaisieInvalide);   // 0 jour → rejeté
EXPECT_NO_THROW(validerDuree(5));                 // 5 jours → accepté</pre>
<div class="tip">On vérifie aussi que le code <strong>lance bien</strong> l'exception attendue quand il le doit (<code>EXPECT_THROW</code>), et qu'il <strong>ne lance pas</strong> pour une entrée valide (<code>EXPECT_NO_THROW</code>). Le comportement d'erreur fait partie du contrat de la fonction : on le teste donc au même titre que le résultat normal.</div>

<h3>5. Ce qu'on teste, ce qu'on ne teste pas (ici)</h3>
<div class="warn">On teste le <strong>métier pur</strong> (services, validations) sans base. Tester les dépôts (le SQL) demande une base de test ou un « <strong>mock</strong> » (un faux composant qui imite la base) — utile, mais plus lourd. La priorité : couvrir les règles qui décident tarifs, refus et droits. Un test rapide qu'on lance souvent vaut mieux qu'un test parfait qu'on n'exécute jamais.</div>`,
  exercises: [
    { type: "qcm", q: "Les fonctions les plus faciles à tester sont…", opts: ["celles qui font du SQL", "les méthodes pures (métier, sans base ni écran)", "l'UI", "les destructeurs"], a: 1, exp: "Entrée → sortie." },
    { type: "qcm", q: "Un test unitaire suit le schéma…", opts: ["afficher/trier/quitter", "arranger, agir, affirmer", "compiler/lier/exécuter", "aucun"], a: 1, exp: "AAA." },
    { type: "qcm", q: "EXPECT_DOUBLE_EQ vérifie…", opts: ["un type", "l'égalité de deux réels attendue", "une exception", "un tri"], a: 1, exp: "Assertion." },
    { type: "qcm", q: "On teste les cas…", opts: ["normaux seulement", "normaux ET limites", "aucun", "au hasard"], a: 1, exp: "Bords compris." },
    { type: "qcm", q: "GoogleTest et Catch2 partagent…", opts: ["le même code", "la même philosophie (arranger/agir/affirmer)", "rien", "la base de données"], a: 1, exp: "Deux outils, une idée." },
    { type: "qcm", q: "EXPECT_THROW vérifie que…", opts: ["rien n'est lancé", "l'exception attendue est bien lancée", "le test est lent", "le SQL marche"], a: 1, exp: "Comportement d'erreur." },
    { type: "qcm", q: "EXPECT_NO_THROW vérifie que…", opts: ["une exception part", "aucune exception pour une entrée valide", "le test échoue", "rien"], a: 1, exp: "Cas nominal." },
    { type: "qcm", q: "Un test qui échoue signale…", opts: ["rien", "une règle métier cassée, tôt", "un succès", "un warning"], a: 1, exp: "Détection immédiate." },
    { type: "qcm", q: "Tester les dépôts (SQL) demande…", opts: ["rien", "une base de test ou un mock (plus lourd)", "impossible", "l'UI"], a: 1, exp: "Au-delà du métier pur." },
    { type: "qcm", q: "La priorité de test :", opts: ["l'affichage", "les règles qui décident tarifs, refus, droits", "les includes", "le CMake"], a: 1, exp: "Le cœur métier." },
    { type: "vf", q: "Le comportement d'erreur (exceptions) fait partie du contrat à tester.", a: true, exp: "EXPECT_THROW." },
    { type: "qcm", q: "tarif(j, 3) avec prixLoc=4 et -10 % dès 3 jours =", opts: ["12", "10.8", "4", "8"], a: 1, exp: "12 * 0.9." },
    { type: "qcm", q: "REQUIRE (Catch2) est comme…", opts: ["un printf", "une assertion (comme EXPECT/ASSERT)", "un include", "un mock"], a: 1, exp: "Vérification." },
    { type: "qcm", q: "Pourquoi le métier est-il testable ?", opts: ["par chance", "parce qu'il est isolé de la base et de l'écran", "grâce à l'UI", "grâce au SQL"], a: 1, exp: "Architecture en couches." },
    { type: "qcm", q: "Un bon test est surtout…", opts: ["parfait mais jamais lancé", "rapide et exécuté souvent", "long", "manuel"], a: 1, exp: "Utile en pratique." }
  ],
  final: {
    title: "Exercice final — Écrire un test de règle",
    intro: `<p>On veut verrouiller la remise de <code>tarif</code> : pas de remise en dessous de 3 jours, -10 % à partir de 3 jours (prix de location = 5).</p>`,
    questions: [
      { type: "qcm", q: "tarif(j, 2) doit valoir…", opts: ["9", "10 (5×2, sans remise)", "5", "0"], a: 1, exp: "Moins de 3 jours." },
      { type: "qcm", q: "tarif(j, 3) doit valoir…", opts: ["15", "13.5 (15 × 0.9)", "5", "0"], a: 1, exp: "-10 %." },
      { type: "qcm", q: "L'assertion adaptée pour des réels :", opts: ["EXPECT_EQ", "EXPECT_DOUBLE_EQ", "EXPECT_THROW", "REQUIRE_FALSE"], a: 1, exp: "Comparaison de doubles." },
      { type: "qcm", q: "On teste aussi le seuil exact (3 jours) car…", opts: ["inutile", "les bornes sont les cas les plus fragiles", "c'est plus joli", "sans raison"], a: 1, exp: "Cas limite." },
      { type: "qcm", q: "Ce test tourne…", opts: ["contre la base réelle", "sans base ni écran (métier pur)", "dans l'UI", "manuellement"], a: 1, exp: "Rapide." }
    ],
    solution: `<pre class="pseudo">#include &lt;gtest/gtest.h&gt;                       // framework de test GoogleTest

TEST(CatalogueService, Remise) {               // un test de la regle de remise
    Jeu j(1, "Catan", /*prixLoc*/ 5.0, /*prixAchat*/ 30.0);   // ARRANGER : un jeu a 5 / jour
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 2), 10.0);   // pas de remise
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 3), 13.5);   // seuil : -10 %
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 5), 22.5);   // au-delà : -10 %
}</pre>
<p>Trois affirmations couvrent avant, au, et après le seuil. La règle est verrouillée : la casser fera échouer le test. Demain : qualité — logs, configuration et secrets.</p>`
  }
};
