<script>
var DAY = {
  num: 15,
  title: "Recherche, filtres et pagination",
  subtitle: "Chercher par nom, filtrer par catégorie, paginer — toujours avec des requêtes préparées.",
  theory: `
<h3>1. Rechercher par nom (LIKE + paramètre)</h3>
<pre class="pseudo">std::vector&lt;Jeu&gt; JeuRepository::rechercher(sql::Connection&amp; con,       // renvoie les jeux dont le nom ressemble au mot-cle
                                          const std::string&amp; motCle) {  // recoit le mot-cle cherche
    std::unique_ptr&lt;sql::PreparedStatement&gt; pstmt(con.prepareStatement(   // requete preparee (RAII)
        "SELECT * FROM jeu WHERE nom LIKE ? ORDER BY nom"));   // LIKE = ressemblance ; ORDER BY = trie par nom
    pstmt-&gt;setString(1, "%" + motCle + "%");     // le % est dans la VALEUR liée
    std::unique_ptr&lt;sql::ResultSet&gt; res(pstmt-&gt;executeQuery());   // execute et recupere le resultat
    return mapperJeux(res.get());                // transforme chaque ligne du resultat en objet Jeu
}</pre>
<p><code>LIKE</code> cherche une <strong>ressemblance</strong> et non l'égalité exacte ; le caractère <code>%</code> est un <strong>joker</strong> qui remplace « n'importe quels caractères ». Ainsi <code>%cata%</code> trouve tout nom qui contient « cata ».</p>
<div class="warn">Le motif <code>%...%</code> se met dans la <strong>valeur liée</strong> (<code>setString</code>), jamais dans la chaîne SQL concaténée. Ainsi un mot-clé contenant une apostrophe ou un <code>%</code> reste une donnée, pas du code : toujours protégé contre l'injection.</div>

<h3>2. Filtrer par catégorie</h3>
<pre class="pseudo">"SELECT * FROM jeu WHERE categorie_id = ? ORDER BY nom"   // filtre : seulement la categorie donnee
pstmt-&gt;setInt(1, categorieId);                           // lie l'identifiant de categorie au ?</pre>
<p><strong>Filtrer</strong>, c'est ne garder que les lignes qui satisfont un <strong>critère</strong>. Chaque critère devient un paramètre lié. Pour combiner nom + catégorie, on ajoute les conditions et on lie chaque valeur dans l'ordre des <code>?</code>.</p>

<h3>3. Paginer avec LIMIT et OFFSET</h3>
<pre class="pseudo">"SELECT * FROM jeu ORDER BY nom LIMIT ? OFFSET ?"   // une "page" : LIMIT lignes, en sautant OFFSET
int page = 2, taille = 10;                          // on veut la page 2, de 10 jeux chacune
pstmt-&gt;setInt(1, taille);              // LIMIT : nombre de lignes
pstmt-&gt;setInt(2, (page - 1) * taille); // OFFSET : lignes sautées</pre>
<p>La <strong>pagination</strong> découpe un long résultat en <strong>pages</strong> pour éviter de charger 10 000 jeux d'un coup : on lit une page à la fois. <code>LIMIT</code> fixe la taille de la page, <code>OFFSET</code> saute les lignes des pages précédentes (pour la page 2 de 10 : sauter les 10 premières).</p>

<h3>4. Toujours un ORDER BY stable</h3>
<div class="tip">Sans <code>ORDER BY</code> (le tri), l'ordre des lignes n'est pas garanti, et la pagination devient incohérente : une même ligne peut réapparaître sur deux pages, ou disparaître. On trie donc toujours sur une colonne <strong>stable</strong> (le nom, ou l'id) avant de paginer.</div>

<h3>5. std::vector, pas de tableau brut</h3>
<pre class="pseudo">std::vector&lt;Jeu&gt; jeux = JeuRepository::rechercher(con, "cata");   // recupere la liste des jeux trouves
for (const Jeu&amp; j : jeux)                       // parcours par référence const
    std::cout &lt;&lt; j.nom() &lt;&lt; "\\n";               // affiche le nom de chaque jeu</pre>
<p>On renvoie un <code>std::vector&lt;Jeu&gt;</code> : une liste qui gère sa taille et sa mémoire toute seule (RAII), se parcourt par <strong>range-for</strong> (« pour chaque j dans jeux »), et se <strong>déplace</strong> (« move ») efficacement au retour, sans recopie coûteuse. Fini le couple pointeur + taille du langage C.</p>`,
  exercises: [
    { type: "qcm", q: "Pour chercher par nom, on utilise…", opts: ["==", "LIKE avec un paramètre lié", "un fichier", "l'UI"], a: 1, exp: "Recherche partielle." },
    { type: "qcm", q: "Le motif %...% se met…", opts: ["dans le SQL concaténé", "dans la valeur liée (setString)", "nulle part", "dans l'UI"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "Un mot-clé avec une apostrophe est…", opts: ["dangereux", "sans danger : c'est une donnée liée", "rejeté", "tronqué"], a: 1, exp: "Requête préparée." },
    { type: "qcm", q: "Filtrer par catégorie :", opts: ["LIKE", "WHERE categorie_id = ? (setInt)", "ORDER BY seul", "rien"], a: 1, exp: "Critère lié." },
    { type: "qcm", q: "LIMIT sert à…", opts: ["trier", "fixer le nombre de lignes d'une page", "filtrer", "supprimer"], a: 1, exp: "Taille de page." },
    { type: "qcm", q: "OFFSET sert à…", opts: ["trier", "sauter les lignes des pages précédentes", "compter", "supprimer"], a: 1, exp: "(page-1)*taille." },
    { type: "qcm", q: "Pourquoi paginer ?", opts: ["c'est joli", "éviter de charger toutes les lignes d'un coup", "obligation SQL", "sans raison"], a: 1, exp: "Performance/mémoire." },
    { type: "qcm", q: "Sans ORDER BY, la pagination…", opts: ["est fiable", "peut être incohérente (ordre non garanti)", "va plus vite", "trie seule"], a: 1, exp: "Tri stable requis." },
    { type: "qcm", q: "On renvoie les résultats dans…", opts: ["un tableau brut + taille", "un std::vector<Jeu> (RAII)", "un pointeur nu", "un fichier"], a: 1, exp: "Conteneur sûr." },
    { type: "qcm", q: "On parcourt le vector avec…", opts: ["des index manuels", "un range-for (for (const Jeu& j : jeux))", "goto", "recursion"], a: 1, exp: "Idiomatique." },
    { type: "vf", q: "Mettre % directement dans la chaîne SQL concaténée expose à l'injection.", a: true, exp: "Le motif va dans la valeur liée." },
    { type: "qcm", q: "Pour la page 2, taille 10, OFFSET vaut…", opts: ["2", "10", "20", "0"], a: 1, exp: "(2-1)*10 = 10." },
    { type: "qcm", q: "Combiner nom + catégorie :", opts: ["impossible", "deux conditions, chaque valeur liée dans l'ordre des ?", "un seul ?", "concaténation"], a: 1, exp: "Plusieurs paramètres." },
    { type: "qcm", q: "for (const Jeu& j : jeux) évite…", opts: ["le tri", "une copie de chaque élément", "le SQL", "la pagination"], a: 1, exp: "Référence const." },
    { type: "qcm", q: "Le std::vector gère sa mémoire…", opts: ["manuellement", "seul (RAII), libérée en fin de portée", "jamais", "via free()"], a: 1, exp: "Pas de fuite." }
  ],
  final: {
    title: "Exercice final — Une recherche sûre et paginée",
    intro: `<p>Une recherche dangereuse et non paginée :</p>
<pre class="pseudo">std::string sql = "SELECT * FROM jeu WHERE nom LIKE '%" + motCle + "%'";   // PROBLEME : mot-cle colle dans le SQL (injection)
auto res = con.createStatement()-&gt;executeQuery(sql);   // tout d'un coup
</pre>`,
    questions: [
      { type: "qcm", q: "Faille n°1 :", opts: ["aucune", "concaténation du mot-clé : injection SQL", "trop lent", "trop court"], a: 1, exp: "Donnée dans le code." },
      { type: "qcm", q: "La correction n°1 :", opts: ["échapper à la main", "requête préparée + setString(1, \"%\"+motCle+\"%\")", "supprimer LIKE", "rien"], a: 1, exp: "Valeur liée." },
      { type: "qcm", q: "Faille n°2 :", opts: ["aucune", "aucune pagination : on peut charger des milliers de lignes", "trop de tri", "rien"], a: 1, exp: "LIMIT/OFFSET." },
      { type: "qcm", q: "Pour paginer :", opts: ["un for en C++", "LIMIT ? OFFSET ? liés", "un fichier", "rien"], a: 1, exp: "Côté base." },
      { type: "qcm", q: "Pour un ordre stable :", opts: ["rien", "ajouter ORDER BY nom", "un tri en C++ après", "au hasard"], a: 1, exp: "Cohérence des pages." }
    ],
    solution: `<pre class="pseudo">std::unique_ptr&lt;sql::PreparedStatement&gt; pstmt(con.prepareStatement(   // requete preparee (RAII)
    "SELECT * FROM jeu WHERE nom LIKE ? ORDER BY nom LIMIT ? OFFSET ?"));   // recherche + tri + pagination
pstmt-&gt;setString(1, "%" + motCle + "%");   // motif dans la valeur liée
pstmt-&gt;setInt(2, taille);                   // LIMIT
pstmt-&gt;setInt(3, (page - 1) * taille);      // OFFSET
std::unique_ptr&lt;sql::ResultSet&gt; res(pstmt-&gt;executeQuery());   // execute et recupere le resultat
return mapperJeux(res.get());               // transforme les lignes en objets Jeu</pre>
<p>Requête préparée (le motif est une valeur liée), tri stable, pagination par <code>LIMIT/OFFSET</code>, résultat dans un <code>std::vector</code>. Demain : les espaces client, vendeur et administrateur.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "projcpp-l15", title: "Rechercher, paginé", level: 3,
    statement: "Écris JeuRepository::rechercher(con, motCle, page, taille) qui renvoie un std::vector<Jeu>. Utilise une requête préparée : SELECT ... WHERE nom LIKE ? ORDER BY nom LIMIT ? OFFSET ?, avec le motif %motCle% en valeur liée et OFFSET = (page-1)*taille. Suppose mapperJeux(res) disponible.",
    hints: [
      "prepareStatement avec les trois ? (LIKE, LIMIT, OFFSET).",

    ],
    solution: "std::vector<Jeu> JeuRepository::rechercher(sql::Connection& con,      // recherche paginee de jeux\n        const std::string& motCle, int page, int taille) {           // mot-cle, numero de page, taille de page\n    std::unique_ptr<sql::PreparedStatement> pstmt(con.prepareStatement(   // requete preparee (RAII)\n        \"SELECT id, nom, categorie_id, prix_location, prix_achat, \"     // colonnes voulues...\n        \"stock_location, stock_vente FROM jeu \"                          // ...suite (chaines collees)...\n        \"WHERE nom LIKE ? ORDER BY nom LIMIT ? OFFSET ?\"));              // filtre + tri + pagination\n    pstmt->setString(1, \"%\" + motCle + \"%\");     // motif dans la valeur liee\n    pstmt->setInt(2, taille);                     // LIMIT\n    pstmt->setInt(3, (page - 1) * taille);        // OFFSET\n    std::unique_ptr<sql::ResultSet> res(pstmt->executeQuery());   // execute et recupere le resultat\n    return mapperJeux(res.get());                 // transforme chaque ligne en objet Jeu\n}",
    note: "Le motif %motCle% est passé en valeur liée : impossible d'injecter du SQL, même avec un mot-clé piégé. ORDER BY garantit un ordre stable indispensable à la pagination, et LIMIT/OFFSET ne rapatrient qu'une page. On renvoie un std::vector par valeur : le move évite toute copie coûteuse." }
  ]
};
