<script>
var DAY = {
  num: 8,
  title: "Validation et gestion des erreurs (exceptions)",
  subtitle: "En C++, on signale les erreurs métier par des exceptions typées — pas des codes de retour.",
  theory: `
<h3>1. Des exceptions métier</h3>
<p>Là où le langage C renvoyait des <strong>codes de retour</strong> (un nombre comme <code>ERR_STOCK</code> qu'il fallait penser à tester), le C++ <strong>lance des exceptions</strong> : des signaux d'alarme qui interrompent le cours normal du programme jusqu'à ce qu'on les rattrape. Une exception <strong>typée</strong> a sa propre classe et <strong>dérive</strong> (hérite) de <code>std::exception</code>, la famille standard des erreurs. « Hériter », en objet, c'est bâtir une classe sur une autre en réutilisant ses capacités. Chaque type d'erreur a ainsi sa classe, ce qui rend le code clair et permet d'attraper précisément la bonne erreur.</p>
<pre class="pseudo">#include &lt;stdexcept&gt;                              // apporte std::runtime_error (base des exceptions a message)
class SaisieInvalide   : public std::runtime_error {   // notre type d'erreur "saisie invalide"
    using std::runtime_error::runtime_error;   // hérite du constructeur (message)
};
class StockInsuffisant : public std::runtime_error {   // notre type d'erreur "stock insuffisant"
    using std::runtime_error::runtime_error;   // reutilise le constructeur qui prend un message
};
class AccesRefuse      : public std::runtime_error {   // notre type d'erreur "acces refuse" (droits manquants)
    using std::runtime_error::runtime_error;   // meme mecanisme : accepte un message texte
};</pre>

<h3>2. Valider en lançant</h3>
<pre class="pseudo">void validerDuree(int jours) {                    // verifie qu'une duree de location est acceptable
    if (jours &lt; 1 || jours &gt; 30)                  // si moins de 1 jour OU plus de 30 jours...
        throw SaisieInvalide("La duree doit etre entre 1 et 30 jours");   // ...leve l'exception (arret propre)
}</pre>
<p>On <strong>valide au plus tôt</strong>, dans le service : une durée absurde est rejetée <strong>avant</strong> tout accès à la base, par une exception. <code>throw</code> veut dire « lancer » : le programme quitte immédiatement la fonction en emportant l'erreur vers le haut.</p>

<h3>3. Attraper là où on sait réagir</h3>
<pre class="pseudo">try {                                             // "essaie" ce bloc ; si une exception surgit, saute au catch
    LocationService::louer(con, uid, jeuId, jours);   // tente la location (peut lever une exception)
} catch (const StockInsuffisant&amp; e) {             // attrape PRECISEMENT le manque de stock
    std::cout &lt;&lt; "Refus : " &lt;&lt; e.what() &lt;&lt; "\\n";   // affiche le message de l'erreur (e.what())
} catch (const std::exception&amp; e) {               // attrape TOUTE autre erreur de la famille standard
    std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";  // affiche son message
}</pre>
<div class="warn"><code>try</code> délimite le bloc « à surveiller » ; <code>catch</code> l'attrape. On peut attraper un type <strong>précis</strong> (StockInsuffisant) pour un message adapté, ou <code>const std::exception&amp;</code> pour tout le reste. <code>e.what()</code> donne le message texte. Attraper par <code>const&amp;</code> (référence constante) évite de recopier l'exception.</div>

<h3>4. Exceptions et RAII : exception-safe</h3>
<p>Quand une exception remonte, tous les objets locaux (dont les <code>unique_ptr</code> du connecteur) sont <strong>détruits correctement</strong> au passage : connexions fermées, mémoire libérée. On dit que le C++ est <em>exception-safe</em> (« sûr face aux exceptions ») sans effort, grâce au RAII — comme des portes qui se referment automatiquement quand on quitte les lieux en urgence.</p>

<h3>5. Le bon usage</h3>
<div class="tip">Les exceptions conviennent aux erreurs <strong>exceptionnelles</strong> (contrat rompu, stock nul, accès refusé), pas au déroulement banal. Elles séparent nettement le chemin correct du chemin d'erreur : le service lance, l'UI attrape et traduit en message. C'est plus expressif que les codes de retour du C, qu'on oubliait parfois de vérifier.</div>`,
  exercises: [
    { type: "qcm", q: "En C++, on signale une erreur métier par…", opts: ["un code de retour", "une exception typée (dérivant de std::exception)", "un assert() qui stoppe le programme", "un log seul"], a: 1, exp: "throw + try/catch." },
    { type: "qcm", q: "Une exception métier dérive de…", opts: ["std::error_code", "std::exception (ex. std::runtime_error)", "std::bad_alloc", "std::system_error"], a: 1, exp: "Famille standard." },
    { type: "qcm", q: "Quand valider une durée ?", opts: ["après l'écriture", "au plus tôt (dans le service), avant la base", "seulement si la base renvoie une erreur", "à l'affichage"], a: 1, exp: "Rejeter tôt." },
    { type: "qcm", q: "e.what() donne…", opts: ["le type", "le message de l'exception", "la ligne", "le code d'erreur numérique"], a: 1, exp: "Description." },
    { type: "qcm", q: "On attrape idéalement par…", opts: ["valeur", "const référence (const std::exception&)", "pointeur", "copie"], a: 1, exp: "Évite une copie." },
    { type: "qcm", q: "Peut-on attraper un type précis ?", opts: ["non", "oui : catch (const StockInsuffisant& e) avant le cas général", "seulement std::exception", "oui, mais après le catch général"], a: 1, exp: "Message adapté." },
    { type: "qcm", q: "Quand une exception remonte, les objets locaux…", opts: ["fuient", "sont correctement détruits (RAII)", "restent", "sont copiés"], a: 1, exp: "Exception-safe." },
    { type: "qcm", q: "Les unique_ptr du connecteur, en cas d'exception…", opts: ["fuient", "ferment connexion/statements automatiquement", "plantent", "se dupliquent"], a: 1, exp: "RAII." },
    { type: "qcm", q: "Les exceptions conviennent…", opts: ["au flux normal", "aux erreurs exceptionnelles (contrat rompu)", "à l'affichage", "à la validation de chaque saisie"], a: 1, exp: "Pas pour un cas banal." },
    { type: "qcm", q: "<code>using std::runtime_error::runtime_error;</code> fait…", opts: ["créer un alias de type", "hériter du constructeur (accepter un message)", "surcharger l'opérateur =", "hériter aussi de what()"], a: 1, exp: "Constructeur hérité." },
    { type: "vf", q: "Grâce au RAII, une exception qui remonte ne laisse aucune fuite.", a: true, exp: "Destruction correcte." },
    { type: "qcm", q: "Le service, en cas d'erreur…", opts: ["affiche", "lance une exception que l'UI attrapera", "quitte le programme", "ignore"], a: 1, exp: "Séparation décision/présentation." },
    { type: "qcm", q: "Attraper const std::exception& capture…", opts: ["seulement std::runtime_error", "toute la famille d'exceptions standard", "seulement les exceptions que l'on a définies", "que StockInsuffisant"], a: 1, exp: "Cas général." },
    { type: "qcm", q: "throw interrompt…", opts: ["l'exécution et renvoie un code d'erreur", "l'exécution normale et remonte jusqu'à un catch", "la pile sans appeler les destructeurs", "uniquement la boucle en cours"], a: 1, exp: "Propagation." },
    { type: "qcm", q: "Par rapport aux codes de retour du C, les exceptions sont…", opts: ["moins claires", "plus expressives (séparent correct et erreur)", "identiques", "réservées au code bas niveau"], a: 1, exp: "Chemin d'erreur distinct." }
  ],
  final: {
    title: "Exercice final — Chaîner les validations",
    intro: `<p>On valide une demande de location. Analyse :</p>
<pre class="pseudo">void LocationService::louer(sql::Connection&amp; con, int uid, int jeuId, int jours) {   // version A COMPLETER
    LocationRepository::inserer(con, uid, jeuId, jours);   // PROBLEME : insere sans rien valider ni verifier
}</pre>`,
    questions: [
      { type: "qcm", q: "Que manque-t-il avant d'insérer ?", opts: ["rien", "valider la durée et vérifier le stock (règles métier)", "un simple log de débogage", "une conversion de type"], a: 1, exp: "On agit sans rien contrôler." },
      { type: "qcm", q: "Si la durée est invalide, on…", opts: ["insère quand même", "lance SaisieInvalide", "renvoie -1", "affiche"], a: 1, exp: "Exception typée." },
      { type: "qcm", q: "Si le stock est nul, on…", opts: ["insère", "lance StockInsuffisant", "renvoie 0", "affiche"], a: 1, exp: "Refus." },
      { type: "qcm", q: "Où attrape-t-on ces exceptions ?", opts: ["dans le constructeur", "dans l'UI (try/catch), là où on peut réagir", "dans le dépôt", "à la compilation"], a: 1, exp: "e.what()." },
      { type: "qcm", q: "L'insertion doit être encadrée par…", opts: ["un simple if", "une transaction (leçon 12)", "un mutex global", "un bloc try seul (sans transaction)"], a: 1, exp: "Atomicité." }
    ],
    solution: `<pre class="pseudo">void LocationService::louer(sql::Connection&amp; con, int uid, int jeuId, int jours) {   // version corrigee
    validerDuree(jours);                       // peut lancer SaisieInvalide
    Jeu j = JeuRepository::findById(con, jeuId);   // charge le jeu concerne depuis la base
    if (!CatalogueService::peutLouer(j))        // si le jeu n'est pas disponible a la location...
        throw StockInsuffisant("Plus de stock de location");   // ...refuse par une exception
    // ... insertion dans une transaction (leçon 12) ...
    LocationRepository::inserer(con, uid, jeuId, jours);   // enfin : ecrit la location dans la base
}</pre>
<p>On valide, on vérifie le stock, et on lance une exception typée en cas de problème. L'UI l'attrapera et la traduira. Demain : les utilisateurs et les trois rôles.</p>`
  }
};
</script>

    statement: "Écris une fonction void validerQuantite(int q, int stockDispo) qui lance SaisieInvalide si q <= 0, StockInsuffisant si q > stockDispo, et ne fait rien sinon. Suppose les classes d'exception déjà définies.",
    hints: [
      "Teste d'abord la saisie (q <= 0), puis la disponibilité (q > stockDispo).",
      "throw SaisieInvalide(\"...\"); / throw StockInsuffisant(\"...\").",

    ],
    solution: "#include <stdexcept>              // apporte std::runtime_error (exceptions standard)\n\nclass SaisieInvalide   : public std::runtime_error {   // type d'exception : saisie invalide\n    using std::runtime_error::runtime_error;           // herite du constructeur (accepte un message)\n};\nclass StockInsuffisant : public std::runtime_error {   // type d'exception : stock insuffisant\n    using std::runtime_error::runtime_error;           // herite du constructeur (accepte un message)\n};\n\nvoid validerQuantite(int q, int stockDispo) {   // verifie une quantite demandee\n    if (q <= 0)                                 // si la quantite n'est pas positive...\n        throw SaisieInvalide(\"Quantite invalide\");     // ...saisie invalide\n    if (q > stockDispo)                         // si on demande plus que le stock disponible...\n        throw StockInsuffisant(\"Stock insuffisant\");   // ...stock insuffisant\n    // sinon : rien, la quantite est valide\n}",
    note: "Deux causes d'échec, deux types d'exception distincts : l'UI pourra attraper précisément (catch StockInsuffisant) ou le cas général (catch std::exception). On valide la saisie avant le stock. Le RAII garantit qu'aucune ressource ne fuit si une exception remonte." }
  ]
