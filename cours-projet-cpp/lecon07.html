var DAY = {
  num: 7,
  title: "La couche service et les règles métier",
  subtitle: "Centraliser les décisions : tarifs, disponibilité, refus — une seule fois, dans les services.",
  theory: `
<h3>1. Le service décide</h3>
<p>Le <strong>service</strong> contient la <strong>logique métier</strong> — les règles propres à l'activité : « peut-on louer ? », « quel tarif ? », « faut-il refuser ? ». Il ne fait ni SQL (rôle du dépôt) ni affichage (rôle de l'UI). Il reçoit des objets, applique les règles et renvoie une <strong>décision</strong>. C'est le cerveau, séparé des mains (le dépôt) et de la bouche (l'UI).</p>

<h3>2. Des méthodes pures, faciles à tester</h3>
<pre class="pseudo">class CatalogueService {                          // le service : il DECIDE (ni SQL, ni affichage)
public:
    static bool peutLouer(const Jeu&amp; j) {         // static = appelable sans creer d'objet ; recoit un Jeu
        return j.estDisponibleLocation();         // règle unique
    }
    static double tarif(const Jeu&amp; j, int jours) {   // calcule le prix d'une location de "jours" jours
        double t = j.prixLocation() * jours;      // prix de base = prix par jour x nombre de jours
        if (jours &gt;= 3) t *= 0.9;                  // -10 % dès 3 jours
        return t;                                 // renvoie le tarif final
    }
};</pre>
<p>Le mot <code>static</code> signifie que la méthode appartient à la classe elle-même, pas à un objet précis : on l'appelle directement, sans « fabriquer » un service. Une méthode dite <strong>pure</strong> ne dépend que de ce qu'on lui donne (aucune base, aucun écran) : on peut donc la <strong>tester</strong> en une ligne (leçon 18). <code>const Jeu&amp; j</code> reçoit le jeu par <strong>référence constante</strong> : on le lit sans le copier ni le modifier. C'est tout l'intérêt de sortir le métier des vues.</p>

<h3>3. Deux stocks, deux règles</h3>
<p>Louer regarde <code>stockLocation()</code> ; acheter regarde <code>stockVente()</code>. Ce sont deux compteurs indépendants : vendre le dernier exemplaire ne doit pas empêcher de louer, et inversement.</p>
<div class="warn">La règle « stock nul → refus » doit exister <strong>une seule fois</strong>. Si l'UI et une future API la recodent chacune de leur côté, un jour l'une refusera et l'autre acceptera : c'est l'incohérence assurée. On parle de « source unique de vérité ».</div>

<h3>4. Le service orchestre le dépôt</h3>
<pre class="pseudo">void StockService::reappro(const Utilisateur&amp; u, sql::Connection&amp; con,   // reapprovisionne : ajoute du stock a un jeu
                           int jeuId, int n) {                           // jeuId = quel jeu ; n = combien ajouter
    if (!peutGererStock(u)) throw AccesRefuse("...");   // autorisation
    if (n &lt;= 0)            throw SaisieInvalide("...");  // validation
    JeuRepository::ajouterStock(con, jeuId, n);         // délégation au dépôt
}</pre>
<p>Le service enchaîne plusieurs contrôles. L'<strong>autorisation</strong> vérifie que la personne a le droit d'agir (<code>throw</code> lance une exception <code>AccesRefuse</code> sinon). La <strong>validation</strong> vérifie que les valeurs sont sensées (un ajout négatif est absurde). Ensuite seulement, il <strong>délègue</strong> l'écriture au dépôt : « orchestrer », c'est coordonner les autres couches sans faire soi-même le travail technique.</p>
<div class="tip">Le service vérifie (autorisation, validation), <strong>décide</strong>, puis délègue l'écriture au dépôt. C'est le cœur de l'application : chaque règle du domaine vit ici, et nulle part ailleurs.</div>`,
  exercises: [
    { type: "qcm", q: "Le service contient…", opts: ["le SQL", "la logique métier (règles, décisions)", "l'affichage", "le CMakeLists"], a: 1, exp: "Il décide." },
    { type: "qcm", q: "Le service fait-il du SQL ?", opts: ["oui, directement", "non : il délègue au dépôt", "parfois, pour les requêtes simples", "toujours, à la place du dépôt"], a: 1, exp: "Le dépôt parle à la base." },
    { type: "qcm", q: "Pourquoi des méthodes de service « pures » ?", opts: ["pour gagner en vitesse d'exécution", "pour les tester sans base ni écran", "c'est obligatoire en C++", "pour réduire le nombre de classes"], a: 1, exp: "Testables en une ligne." },
    { type: "qcm", q: "Louer regarde…", opts: ["stockVente", "stockLocation", "les deux", "aucun"], a: 1, exp: "Stock de location." },
    { type: "qcm", q: "Acheter regarde…", opts: ["stockLocation", "stockVente", "les deux", "le prix"], a: 1, exp: "Stock de vente." },
    { type: "qcm", q: "La règle « stock nul → refus » doit exister…", opts: ["dans chaque couche", "une seule fois, dans le service", "dans l'UI et l'API", "nulle part"], a: 1, exp: "Sinon incohérences." },
    { type: "qcm", q: "tarif applique la remise…", opts: ["toujours", "dès 3 jours (-10 %)", "jamais", "dès 7 jours (-20 %)"], a: 1, exp: "if (jours >= 3)." },
    { type: "qcm", q: "Le service reçoit et renvoie plutôt…", opts: ["du SQL brut", "des objets et des décisions", "des ResultSet", "du HTML"], a: 1, exp: "Le domaine." },
    { type: "qcm", q: "Les deux stocks sont…", opts: ["synchronisés en permanence", "indépendants (vendre n'empêche pas de louer)", "identiques", "regroupés en un seul compteur"], a: 1, exp: "Deux compteurs." },
    { type: "qcm", q: "Avant d'écrire, le service…", opts: ["écrit directement sans contrôle", "vérifie autorisation et validation, puis délègue", "affiche un message de confirmation", "trie les données à insérer"], a: 1, exp: "Contrôles + délégation." },
    { type: "vf", q: "Recoder la règle de stock dans l'UI (au lieu de la garder dans le service) est risqué.", a: true, exp: "Oui : dupliquer une règle mène tôt ou tard à des incohérences." },
    { type: "qcm", q: "peutLouer renvoie…", opts: ["un tarif", "true/false selon le stock", "un Jeu", "void"], a: 1, exp: "Décision booléenne." },
    { type: "qcm", q: "Qui appelle le service ?", opts: ["le dépôt", "l'UI (et de futurs modules)", "MySQL", "le CMakeLists"], a: 1, exp: "Les interfaces délèguent." },
    { type: "qcm", q: "Le service délègue l'écriture à…", opts: ["l'UI", "au dépôt", "au CMakeLists", "à personne"], a: 1, exp: "JeuRepository." },
    { type: "qcm", q: "L'avantage d'un métier centralisé :", opts: ["plus de classes", "une seule source de vérité pour les règles", "moins de tests", "plus de SQL"], a: 1, exp: "Cohérence." }
  ],
  final: {
    title: "Exercice final — Où placer la règle ?",
    intro: `<p>Un développeur écrit, dans l'affichage du catalogue :</p>
<pre class="pseudo">void Ui::afficherJeu(const Jeu&amp; j) {
    double total = j.prixLocation() * 3;
    if (3 &gt;= 3) total *= 0.9;
    std::cout &lt;&lt; j.nom() &lt;&lt; " : 3j = " &lt;&lt; total;
}</pre>`,
    questions: [
      { type: "qcm", q: "Le défaut d'architecture :", opts: ["aucun défaut", "le calcul du tarif (métier) est dans l'UI, dupliqué depuis le service", "l'affichage avec cout est trop lent", "le dépôt fait trop de requêtes"], a: 1, exp: "La règle doit venir du service." },
      { type: "qcm", q: "La bonne correction :", opts: ["copier la formule partout", "appeler CatalogueService::tarif(j, 3)", "supprimer l'affichage", "mettre le calcul dans le dépôt"], a: 1, exp: "L'UI délègue." },
      { type: "qcm", q: "Pourquoi c'est important ?", opts: ["pour un code plus esthétique", "le jour où la remise change, un seul endroit à modifier", "pour gagner en performance", "pour réduire le nombre de fichiers"], a: 1, exp: "Source de vérité." },
      { type: "qcm", q: "Le rôle correct d'afficherJeu :", opts: ["calculer les tarifs", "afficher des valeurs déléguées au service", "faire du SQL", "valider les règles métier"], a: 1, exp: "Présenter, pas décider." },
      { type: "vf", q: "Si l'API et l'UI calculent le tarif différemment, un client peut être mal facturé.", a: true, exp: "Risque de la duplication." }
    ],
    solution: `<pre class="pseudo">// CatalogueService : la règle, une seule fois
static double tarif(const Jeu&amp; j, int jours) {    // calcule le tarif d'une location
    double t = j.prixLocation() * jours;          // prix de base = prix/jour x nombre de jours
    if (jours &gt;= 3) t *= 0.9;                      // remise de 10 % a partir de 3 jours
    return t;                                     // renvoie le tarif calcule
}
// Ui : l'affichage délègue
void Ui::afficherJeu(const Jeu&amp; j) {              // l'UI ne calcule pas : elle DEMANDE au service
    std::cout &lt;&lt; j.nom() &lt;&lt; " : 3j = "            // affiche le nom du jeu...
              &lt;&lt; CatalogueService::tarif(j, 3) &lt;&lt; "\\n";   // ...puis le tarif calcule PAR le service
}</pre>
<p>Le calcul vit dans le service ; l'UI l'appelle. Une règle, un endroit. Demain : valider et gérer les erreurs avec les exceptions.</p>`
  }
};
</script>
