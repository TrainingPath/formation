  subtitle: "Avant d'écrire une ligne, on décide comment l'application C++ est organisée — en classes.",
  theory: `
<h3>1. Le cahier des charges de la Ludothèque</h3>
<p>Commençons par le vocabulaire. Un <strong>programme</strong> (on dit aussi une <strong>application</strong> ou un <strong>logiciel</strong>) est une liste d'ordres écrits que l'ordinateur exécute un par un pour rendre un service — un peu comme une recette de cuisine que l'on suit à la lettre. Ici, le service à rendre est une <strong>ludothèque</strong> : un endroit où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux.</p>
<p>Le <strong>cahier des charges</strong>, c'est la liste écrite de tout ce que l'application doit savoir faire — l'équivalent du bon de commande que l'on remet à un artisan avant qu'il ne construise quoi que ce soit. Le nôtre prévoit trois profils d'utilisateurs : le <strong>client</strong> (qui achète ou loue), le <strong>vendeur</strong> (qui gère la boutique) et l'<strong>administrateur</strong> (le « chef » qui a tous les droits). Chaque jeu possède <strong>deux stocks</strong> séparés : un pour la vente, un pour la location — comme un magasin qui tiendrait deux réserves distinctes. Ce projet, appelé <strong>capstone</strong> (le « projet de synthèse » qui couronne une formation), rassemble dans un seul programme C++ tout ce que les cours précédents ont enseigné séparément.</p>

<h3>2. Une architecture en couches objet</h3>
<p>L'<strong>architecture</strong> d'un programme, c'est son plan d'ensemble : la façon de ranger le code en morceaux, comme les étages et les pièces d'une maison. On choisit ici une organisation « <strong>en couches</strong> » : des tranches empilées où chacune a un rôle précis et ne parle qu'à sa voisine — un peu comme dans un restaurant où le serveur parle au cuisinier, qui parle au commis près du frigo ; jamais le client ne va se servir directement en cuisine.</p>
<pre class="pseudo">Flux d'une action :
UI (console)   →  Service (métier)  →  Dépôt/DAO (MySQL)  →  MySQL
   Ui             CatalogueService     JeuRepository        base
lit / affiche      DÉCIDE               lit/écrit (SQL)</pre>
<p>Décryptons chaque mot de ce schéma (qui est une image, pas du code — on ne le commente donc pas ligne par ligne). L'<strong>UI</strong> (de l'anglais <em>User Interface</em>, « interface utilisateur ») est la partie visible avec laquelle l'humain interagit ; ici c'est la <strong>console</strong>, la fenêtre où l'on tape du texte et où le programme répond par du texte — le comptoir d'accueil. Le <strong>service</strong> est la couche « métier » : le <strong>métier</strong> désigne les règles propres à l'activité (tarifs, stocks, refus) ; c'est le cerveau qui <strong>décide</strong>. Le <strong>dépôt</strong> (aussi nommé <strong>DAO</strong>, <em>Data Access Object</em> = « objet d'accès aux données ») est la couche qui va chercher et ranger les informations : le magasinier. Enfin <strong>MySQL</strong> est la <strong>base de données</strong> : un grand classeur électronique qui range les informations dans des tableaux et les conserve même une fois l'ordinateur éteint ; on lui parle avec le langage <strong>SQL</strong> (un langage spécialisé pour interroger et modifier une base). Chaque couche est une <strong>classe</strong> : en programmation objet, une classe est un moule qui regroupe des données et les actions qui les manipulent (comme le plan d'une machine décrivant ses pièces et ses boutons). Règle d'or : les règles métier vivent <strong>uniquement</strong> dans les services ; l'UI et le dépôt ne décident jamais rien.</p>

<h3>3. L'arborescence en .h/.cpp</h3>
<p>Un programme C++ n'est pas un unique fichier, mais plusieurs, rangés dans des dossiers. L'<strong>arborescence</strong> est cette organisation en branches, comme un meuble à tiroirs étiquetés. Chaque « module » se présente en général en deux fichiers : un fichier <strong>.h</strong> (le « header » ou en-tête, qui <em>annonce</em> ce que le module sait faire — tel le sommaire d'un livre) et un fichier <strong>.cpp</strong> (qui <em>contient</em> réellement le travail — les chapitres). L'astérisque <code>.*</code> ci-dessous signifie « le .h et le .cpp portant ce nom ».</p>
<pre class="pseudo">main.cpp                point d'entrée, boucle de menu
Ui.h / Ui.cpp           affichage et saisies
CatalogueService.*      logique métier
JeuRepository.*         accès MySQL (Connector/C++)
modele/ (Jeu, Utilisateur, Location)   les classes du domaine
Db.*                    connexion MySQL partagée (RAII)
CMakeLists.txt          construction du projet</pre>
<p>Le fichier <code>main.cpp</code> contient le <strong>point d'entrée</strong> : l'endroit exact où le programme démarre quand on le lance, comme la porte d'entrée d'un bâtiment. Le dossier <code>modele/</code> réunit les classes du <strong>domaine</strong> — les objets du monde réel que l'on représente (un Jeu, un Utilisateur, une Location). <code>Db.*</code> gère la <strong>connexion</strong> à MySQL, c'est-à-dire le « fil » ouvert entre le programme et la base. <code>CMakeLists.txt</code> est la <strong>recette de construction</strong> : elle explique à l'outil comment assembler tous ces fichiers en un programme utilisable.</p>

<h3>4. Pourquoi une couche service ?</h3>
<p>Pourquoi se donner la peine d'isoler une couche « service » ? Trois raisons concrètes. D'abord, une règle comme « stock nul → refus » n'est écrite qu'<strong>une seule fois</strong>, à un seul endroit : aucun risque qu'une copie oubliée dise le contraire. Ensuite, le métier devient <strong>testable</strong> — le « tester », c'est l'essayer avec des cas connus pour vérifier qu'il répond juste — sans avoir besoin ni de la base de données ni de l'écran. Enfin, l'UI et de futurs modules <strong>réutilisent</strong> le même code au lieu de le réécrire.</p>
<div class="warn">Une méthode d'affichage qui, en plus d'afficher, calculerait un tarif ou contrôlerait un stock serait un <strong>défaut d'architecture</strong> (une pièce mal placée dans le plan) : le jour où deux endroits calculent différemment, les données se contredisent et « mentent ».</div>

<h3>5. Ce que le C++ apporte ici</h3>
<p>Ce projet est écrit en <strong>C++</strong>, un langage de programmation (une façon d'écrire des ordres pour l'ordinateur) qui prolonge le langage <strong>C</strong> en y ajoutant les <strong>objets</strong>. Par rapport au C, qu'apporte-t-il concrètement ?</p>
<div class="tip">Le C++ ajoute l'<strong>encapsulation</strong> : regrouper dans une classe les données et les actions qui vont ensemble, tout en cachant les détails internes (les membres « privés ») — comme une machine à café dont on ne voit que les boutons, pas les rouages. Il ajoute les <strong>exceptions</strong> : une manière propre de signaler et de gérer les erreurs, telle une alarme qui se déclenche et que l'on rattrape au bon endroit. Il ajoute le <strong>RAII</strong> (<em>Resource Acquisition Is Initialization</em>) et les <strong>smart pointers</strong> (« pointeurs intelligents ») qui gèrent la <strong>mémoire</strong> automatiquement — la mémoire étant l'espace de travail temporaire de l'ordinateur ; ce mécanisme la libère tout seul dès qu'on n'en a plus besoin, comme une lampe à détecteur qui s'éteint d'elle-même. Il fournit enfin un connecteur MySQL <strong>orienté objet</strong> (qui manipule la base via des objets plutôt que des fonctions brutes). Le résultat est un programme plus sûr et plus clair — c'est ce que ce projet met en œuvre.</div>`,

    { type: "qcm", q: "Le RAII et les smart pointers gèrent…", opts: ["l'affichage", "la mémoire automatiquement", "le SQL", "les rôles"], a: 1, exp: "Pas de fuite." }
  ],
