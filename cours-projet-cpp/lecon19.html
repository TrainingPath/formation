<script>
var DAY = {
  num: 19,
  title: "Qualité : logs, configuration et secrets",
  subtitle: "Journaliser sans fuiter, configurer sans coder en dur, garder les secrets hors du code.",
  theory: `
<h3>1. Des logs utiles</h3>
<p>Un <strong>journal</strong> (ou « log ») est le carnet de bord de l'application : il <strong>trace</strong> (note au fil de l'eau) ce qu'elle fait — opérations, erreurs, événements de sécurité. On enregistre <em>quoi</em>, <em>quand</em> et <em>par qui</em>, jamais le contenu sensible. Les logs servent à <strong>diagnostiquer</strong> (comprendre un problème après coup) et à <strong>auditer</strong> (vérifier qui a fait quoi).</p>
<pre class="pseudo">log(Niveau::Info,  "Location creee : user=" + std::to_string(uid) +      // trace une operation reussie (niveau Info)
                   " jeu=" + std::to_string(jeuId));                     // on note QUI et QUOI, sans donnee sensible
log(Niveau::Erreur,"Echec connexion base : " + std::string(e.what()));  // trace une erreur (niveau Erreur)</pre>

<h3>2. Ne JAMAIS journaliser un secret</h3>
<div class="warn">On ne journalise jamais un mot de passe, un <strong>hash</strong> (empreinte d'un mot de passe), un <strong>jeton</strong> (jeton d'accès, une clé temporaire), ni une requête qui contiendrait ces valeurs. Un log qui contient un mot de passe est une fuite de sécurité, même écrit en clair « juste pour déboguer ». On journalise l'<strong>identifiant</strong> de l'utilisateur, pas ses secrets.</div>

<h3>3. La configuration, pas en dur</h3>
<pre class="pseudo">struct Config {                 // regroupe les reglages de connexion
    std::string hote;       // "localhost"
    int         port;       // 3306
    std::string base;       // "ludotheque"
    std::string utilisateur;    // l'identifiant de connexion a la base
};
Config chargerConfig();     // lit un fichier/variables d'env, hors du binaire</pre>
<p>Coder une valeur « <strong>en dur</strong> », c'est l'écrire directement dans le code, figée. Or l'hôte (l'adresse du serveur), le port et le nom de la base changent entre le poste du développeur et le serveur de <strong>production</strong> (la vraie mise en service). On les met donc dans une <strong>configuration externe</strong> (un fichier ou des variables d'environnement), pas dans le programme compilé — ainsi on change d'environnement sans recompiler.</p>

<h3>4. Les secrets par variables d'environnement</h3>
<pre class="pseudo">const char* mdp = std::getenv("LUDO_DB_PASSWORD");   // fourni par l'environnement
if (!mdp) throw std::runtime_error("Secret DB manquant");   // absent : on echoue clairement
auto con = connect(url, utilisateur, mdp);                  // ouvre la connexion avec le secret lu</pre>
<div class="warn">Une <strong>variable d'environnement</strong> est une valeur fournie par le système au démarrage du programme, en dehors du code. Le mot de passe de la base en vient, jamais d'une constante dans le code ni d'un fichier versionné. On ne <strong>committe</strong> (n'enregistre dans l'historique) aucun secret : le dépôt <strong>Git</strong> (l'outil qui garde l'historique du code) ne doit jamais contenir de mot de passe. Un fichier <code>.gitignore</code> liste ce que Git doit ignorer, dont les fichiers de config locaux.</div>

<h3>5. Séparer les niveaux</h3>
<div class="tip">On distingue des <strong>niveaux</strong> de log (Info, Avertissement, Erreur) pour filtrer : en production on ne garde que Info et au-dessus ; en <strong>debug</strong> (mode de mise au point) on descend plus bas pour tout voir. La configuration pilote aussi ce niveau. Objectif : un journal exploitable, une config souple, et zéro secret dans le code ou les logs.</div>`,
  exercises: [
    { type: "qcm", q: "Un journal (log) sert à…", opts: ["accélérer", "tracer opérations, erreurs, événements pour diagnostiquer/auditer", "stocker les mots de passe", "remplacer la base de données"], a: 1, exp: "Diagnostic et audit." },
    { type: "qcm", q: "On journalise…", opts: ["le mot de passe", "l'identifiant de l'utilisateur, pas ses secrets", "le hash", "le jeton"], a: 1, exp: "Jamais de secret." },
    { type: "qcm", q: "Logger un mot de passe « pour déboguer » est…", opts: ["acceptable", "une fuite de sécurité, à proscrire", "recommandé", "sans risque"], a: 1, exp: "Jamais." },
    { type: "qcm", q: "L'hôte, le port, la base se mettent…", opts: ["en dur dans le code", "dans une configuration externe", "dans les logs", "dans le binaire compilé"], a: 1, exp: "Ça change selon l'environnement." },
    { type: "qcm", q: "Le mot de passe de la base vient…", opts: ["d'une constante compilée", "d'une variable d'environnement", "d'un log", "du code source"], a: 1, exp: "Hors du binaire." },
    { type: "qcm", q: "std::getenv sert à…", opts: ["écrire un fichier", "lire une variable d'environnement", "définir une variable d'environnement", "lire un fichier .env"], a: 1, exp: "Secret injecté." },
    { type: "qcm", q: "Committe-t-on un secret dans Git ?", opts: ["oui", "jamais", "parfois", "toujours"], a: 1, exp: "Dépôt sans secret." },
    { type: "qcm", q: ".gitignore sert à…", opts: ["compiler", "exclure les fichiers de config/secrets locaux du dépôt", "chiffrer les fichiers versionnés", "lister les fichiers à committer"], a: 1, exp: "Rien de sensible versionné." },
    { type: "qcm", q: "Les niveaux de log (Info/Avert/Erreur) permettent…", opts: ["de trier les messages par date", "de filtrer selon l'environnement", "d'accélérer le SQL", "de chiffrer"], a: 1, exp: "Verbosité pilotée." },
    { type: "qcm", q: "Si le secret DB est absent, on…", opts: ["continue sans", "échoue clairement (exception)", "logge le secret", "met un défaut"], a: 1, exp: "Pas de démarrage silencieux." },
    { type: "vf", q: "Une config externe évite de recompiler pour changer d'environnement.", a: true, exp: "Souplesse." },
    { type: "qcm", q: "Une requête contenant un mot de passe…", opts: ["se logge", "ne se logge jamais", "se logge en debug", "s'affiche"], a: 1, exp: "Secret." },
    { type: "qcm", q: "Un bon log contient…", opts: ["des secrets", "quoi, quand, par qui (sans données sensibles)", "le code source", "les mots de passe hachés"], a: 1, exp: "Traçable, pas indiscret." },
    { type: "qcm", q: "La config peut aussi piloter…", opts: ["le code source compilé", "le niveau de log", "le prix des jeux", "le rôle"], a: 1, exp: "Verbosité configurable." },
    { type: "qcm", q: "En production, on garde plutôt…", opts: ["tout le debug", "Info et au-dessus", "aucun log", "les secrets"], a: 1, exp: "Journal exploitable." }
  ],
  final: {
    title: "Exercice final — Nettoyer une connexion et un log",
    intro: `<p>Du code à corriger :</p>
<pre class="pseudo">std::string mdp = "S3cr3t!";                     // (1) PROBLEME : secret ecrit EN DUR dans le code
auto con = connect("localhost", "root", mdp);    // hote "localhost" en dur, non configurable
log("Connexion avec mot de passe " + mdp);       // (2)
</pre>`,
    questions: [
      { type: "qcm", q: "Problème (1) :", opts: ["aucun", "secret en dur dans le code (et versionnable)", "un getenv inutile", "un niveau de log trop bas"], a: 1, exp: "Doit venir de l'environnement." },
      { type: "qcm", q: "Correction (1) :", opts: ["le chiffrer dans le code source", "std::getenv(\"LUDO_DB_PASSWORD\")", "le mettre en commentaire", "le lire depuis les logs"], a: 1, exp: "Variable d'env." },
      { type: "qcm", q: "Problème (2) :", opts: ["aucun", "on journalise le mot de passe : fuite", "un niveau de log manquant", "un getenv oublié"], a: 1, exp: "Jamais de secret dans les logs." },
      { type: "qcm", q: "Correction (2) :", opts: ["logger le hash", "logger l'utilisateur/hôte sans le secret", "supprimer tous les logs", "chiffrer le log"], a: 1, exp: "Sans le mdp." },
      { type: "qcm", q: "L'hôte « localhost » en dur :", opts: ["idéal", "à sortir en configuration externe", "à logger", "à chiffrer"], a: 1, exp: "Dépend de l'environnement." }
    ],
    solution: `<pre class="pseudo">Config cfg = chargerConfig();                    // hôte, port, base, utilisateur
const char* mdp = std::getenv("LUDO_DB_PASSWORD");   // le secret vient de l'environnement
if (!mdp) throw std::runtime_error("Secret DB manquant");   // absent : echec clair au demarrage
auto con = connect(cfg.hote, cfg.utilisateur, mdp);         // connexion avec la config + le secret
log(Niveau::Info, "Connexion base OK, user=" + cfg.utilisateur);  // pas de secret</pre>
<p>Config externe, secret par variable d'environnement, log sans mot de passe : une application déployable et sûre. Demain : le build de release et la mise en service.</p>`
  }
};
</script>

    statement: "Écris std::string lireSecret(const std::string& nomVar) qui lit une variable d'environnement avec std::getenv, lance std::runtime_error si elle est absente, et renvoie sa valeur sinon. La fonction ne doit jamais journaliser la valeur.",
    hints: [
      "const char* v = std::getenv(nomVar.c_str());",

    ],
    solution: "#include <cstdlib>           // pour std::getenv (lire une variable d'environnement)\n#include <stdexcept>         // pour std::runtime_error (l'exception)\n#include <string>            // pour std::string\n\nstd::string lireSecret(const std::string& nomVar) {   // lit un secret depuis l'environnement\n    const char* v = std::getenv(nomVar.c_str());       // recupere la valeur de la variable (ou rien)\n    if (!v)                                            // si la variable n'existe pas...\n        throw std::runtime_error(\"Variable d'environnement manquante : \" + nomVar);   // ...echoue (le message donne le NOM, pas la valeur)\n    return std::string(v);   // on retourne la valeur, sans jamais la journaliser\n}",
    note: "Le secret vient de l'environnement, jamais du code source ni d'un fichier versionné. En cas d'absence, on échoue explicitement plutôt que de démarrer avec un secret vide. Le message d'erreur mentionne le NOM de la variable, jamais sa valeur : on ne fait pas fuiter un secret, même dans une exception." }
  ]
