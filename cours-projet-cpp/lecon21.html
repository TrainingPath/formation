  title: "Récapitulatif : la Ludothèque C++ (examen)",
  subtitle: "Tout relier : architecture objet, données, sécurité, transactions, RAII, qualité et livraison.",
  theory: `
<h3>1. L'architecture, de bas en haut</h3>
<p>On a bâti une application organisée en <strong>couches objet</strong> (des tranches empilées ayant chacune un seul rôle) : le <em>modèle</em> (les classes Jeu, Utilisateur — les objets du monde réel), le <em>dépôt/DAO</em> (qui seul parle à la base MySQL, via des requêtes préparées), le <em>service</em> (qui porte les règles métier et décide), et l'<em>UI</em> (la console, qui lit les saisies et affiche). Chaque couche a une responsabilité unique et ne parle qu'à sa voisine, comme une brigade de cuisine bien réglée.</p>

<h3>2. Les données, sûres</h3>
<p>Toute donnée venue de l'extérieur passe par des <strong>requêtes préparées</strong> — des modèles de requête troués de <code>?</code> où l'on glisse les valeurs sans jamais les mêler au code, ce qui bloque l'<strong>injection SQL</strong>. Le MCD (le plan des données issu de la méthode Merise) est devenu un schéma de tables SQL ; chaque ligne de résultat (<code>ResultSet</code>) est <strong>mappée</strong> (transformée) en objet ; et les deux stocks (location et vente) restent deux compteurs indépendants.</p>

<h3>3. La sécurité, en profondeur</h3>
<p>L'<strong>authentification</strong> (« qui es-tu ? ») repose sur un <strong>hash</strong> (empreinte irréversible du mot de passe, jamais stocké en clair). L'<strong>autorisation</strong> (« as-tu le droit ? ») par rôle est revérifiée dans chaque service sensible. Les <strong>secrets</strong> (mots de passe de la base) viennent de variables d'environnement, et les <strong>logs</strong> (le journal de l'application) ne contiennent aucune donnée sensible. Le menu adapté au rôle est un simple confort ; la vraie barrière est le contrôle dans le service.</p>

<h3>4. La robustesse, par le C++</h3>
<p>Les erreurs métier sont signalées par des <strong>exceptions</strong> typées (des alarmes qu'on rattrape au bon endroit). Les <strong>transactions</strong> assurent l'<strong>atomicité</strong> (louer ou acheter = tout ou rien). Le <strong>RAII</strong> et les <strong>smart pointers</strong> (des boîtes qui rangent leur contenu toutes seules) garantissent zéro fuite, même quand une exception remonte. <code>std::optional</code> (« une valeur ou rien »), <code>enum class</code> (des noms au lieu de nombres bruts) et <code>std::vector</code> (une liste sûre) donnent un code expressif et sûr.</p>

<h3>5. La qualité et la livraison</h3>
<div class="tip">Des <strong>tests unitaires</strong> (des vérifications automatiques) verrouillent les règles métier ; un <strong>CMakeLists</strong> décrit comment construire le programme ; une <strong>configuration externe</strong> sépare le code de l'environnement ; un <strong>build de release</strong> optimisé se met en service avec des secrets injectés. Tu sais désormais construire une application C++ complète, orientée objet, de la base de données jusqu'à l'exécutable livré. Bravo !</div>`,
  exercises: [
    { type: "qcm", q: "Les couches, de bas en haut :", opts: ["UI, service, dépôt, modèle", "modèle, dépôt, service, UI", "dépôt, modèle, service, UI", "une seule couche"], a: 1, exp: "Responsabilités séparées." },
    { type: "qcm", q: "Une couche parle…", opts: ["à toutes les autres", "à sa voisine, avec une responsabilité unique", "à la base directement depuis l'UI", "directement à la couche modèle"], a: 1, exp: "Découplage." },
    { type: "qcm", q: "Toute donnée externe passe par…", opts: ["la concaténation", "des requêtes préparées", "l'UI seule", "une conversion en std::string"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "Les mots de passe sont stockés…", opts: ["en clair", "sous forme de hash", "dans les logs", "en config"], a: 1, exp: "Jamais en clair." },
    { type: "qcm", q: "L'autorisation par rôle est vérifiée…", opts: ["dans le menu seul", "dans chaque service sensible", "une seule fois, à la connexion", "à l'affichage"], a: 1, exp: "En profondeur." },
    { type: "qcm", q: "Louer/acheter sont atomiques grâce…", opts: ["à des verrous posés à la main", "aux transactions (tout ou rien)", "aux logs", "à un commit après chaque INSERT"], a: 1, exp: "Cohérence." },
    { type: "qcm", q: "Zéro fuite mémoire grâce…", opts: ["au new/delete manuel", "au RAII et aux smart pointers", "à un ramasse-miettes", "aux globales"], a: 1, exp: "Garantie du langage." },
    { type: "qcm", q: "Les erreurs métier sont signalées par…", opts: ["des codes de retour", "des exceptions typées", "des printf", "des assert()"], a: 1, exp: "throw/catch." },
    { type: "qcm", q: "Les secrets viennent…", opts: ["du code", "de variables d'environnement", "des logs", "du binaire"], a: 1, exp: "Hors du dépôt." },
    { type: "qcm", q: "Les tests unitaires verrouillent surtout…", opts: ["l'UI", "les règles métier (services)", "le CMake", "les logs"], a: 1, exp: "Cœur testable." },
    { type: "vf", q: "Le menu par rôle est de l'ergonomie ; la sécurité vit dans les services.", a: true, exp: "Double barrière." },

    { type: "qcm", q: "enum class a servi pour…", opts: ["les prix", "les rôles (fortement typés)", "les niveaux de log", "les identifiants de jeux"], a: 1, exp: "Sûreté de type." },
    { type: "qcm", q: "Le build de release est…", opts: ["lent et non optimisé", "optimisé et prêt à livrer", "rempli de symboles de debug", "identique au build debug"], a: 1, exp: "Production." },
    { type: "qcm", q: "Le prix d'un achat est…", opts: ["recalculé au prix courant", "figé au moment de l'achat", "la moyenne des prix passés", "recalculé à chaque affichage"], a: 1, exp: "Historique vrai." }
  ],
  final: {
    title: "Examen final — La Ludothèque C++ de bout en bout",
    intro: `<p>Un client authentifié loue un jeu pour 4 jours. Retrace le trajet complet à travers les couches et les garanties.</p>`,
    questions: [
      { type: "qcm", q: "1) L'UI reçoit la saisie et…", opts: ["fait le SQL", "appelle LocationService::louer (dans un try/catch)", "décide du tarif", "écrit en base"], a: 1, exp: "L'UI délègue." },
      { type: "qcm", q: "2) Le service commence par…", opts: ["insérer", "valider la durée et vérifier le stock (peutLouer)", "commit", "faire un commit immédiat"], a: 1, exp: "Règles d'abord." },
      { type: "qcm", q: "3) Les deux écritures se font…", opts: ["séparément", "dans une transaction (TransactionGuard, RAII)", "sans contrôle", "sur deux connexions distinctes"], a: 1, exp: "Atomicité." },
      { type: "qcm", q: "4) Le SQL utilise…", opts: ["la concaténation", "des requêtes préparées (setInt/setString)", "createStatement avec du SQL concaténé", "un sprintf sur la requête"], a: 1, exp: "Anti-injection." },
      { type: "qcm", q: "5) Si le stock manque, le service…", opts: ["insère quand même", "lance StockInsuffisant, la transaction est annulée (rollback auto)", "commit", "ignore"], a: 1, exp: "Exception + RAII." },
      { type: "qcm", q: "6) L'UI, en cas d'exception…", opts: ["plante", "l'attrape et affiche e.what()", "relance", "quitte"], a: 1, exp: "Traduction propre." }
    ],
    solution: `<pre class="pseudo">// UI (try/catch) → LocationService::louer(*con, uid, jeuId, 4)
void LocationService::louer(sql::Connection&amp; con, int uid, int jeuId, int jours) {   // le service qui loue
    validerDuree(jours);                            // 1. validation (SaisieInvalide)
    Jeu j = JeuRepository::findById(con, jeuId);    //    requête préparée
    if (!CatalogueService::peutLouer(j))            // 2. règle métier
        throw StockInsuffisant("Plus de stock");    //    → rollback auto, UI affiche
    TransactionGuard tx(con);                       // 3. transaction (RAII)
    LocationRepository::inserer(con, uid, jeuId, jours);      // requêtes préparées
    JeuRepository::decrementerStockLocation(con, jeuId);     // ecriture 2 : retire un du stock de location
    tx.commit();                                    //    les deux ensemble
}
// L'UI : catch (const std::exception&amp; e) { afficher(e.what()); }</pre>
<p>Validation → règle métier → transaction atomique → requêtes préparées → exceptions typées → RAII qui garantit rollback et absence de fuite → UI qui traduit. Voilà la Ludothèque C++, en une opération : orientée objet, sûre et robuste. Félicitations, tu as terminé le capstone ! 🎉</p>`
  }
};
