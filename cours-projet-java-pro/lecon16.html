<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois portes, trois clés — on assemble les services existants, on n'invente rien.",
  theory: `
<h3>1. Trois espaces, trois rôles</h3>
<pre class="pseudo">/client   -> ses locations, ses achats            (ROLE_CLIENT)
/vendeur  -> stocks, retards, mises en vente        (ROLE_VENDEUR)
/gestion  -> comptes, promotions, catégories        (ROLE_ADMIN)</pre>
<p>Un <strong>espace</strong> est une zone du site réservée à un type d'utilisateur — comme les étages d'un immeuble accessibles selon son badge. <strong>Orchestrer</strong> (ou assembler), c'est faire appeler par un chef d'orchestre des morceaux déjà écrits, sans en composer de nouveaux. Aucune logique métier <strong>nouvelle</strong> ici : chaque espace orchestre les services (leçons 6-12) et les requêtes (leçon 15) déjà écrits et testés.</p>

<h3>2. L'espace client (par ressource)</h3>
<p>« Par ressource » signifie que chaque client ne voit que SES données : on filtre sur l'utilisateur courant (celui qui est connecté), fourni par <code>@AuthenticationPrincipal</code>.</p>
<pre class="pseudo">@GetMapping("/client")                           // repond au GET sur /client
public String espaceClient(@AuthenticationPrincipal Utilisateur u, Model m) {   // u = l'utilisateur connecte ; m = le sac de donnees pour la vue
    m.addAttribute("locations", locationRepo.findByClient(u));   // filtré par l'utilisateur
    m.addAttribute("achats", achatRepo.findByClient(u));   // idem pour ses achats : uniquement les siens
    return "client/espace";                      // affiche le template de l'espace client
}</pre>

<h3>3. L'espace admin (par rôle)</h3>
<p>« Par rôle » signifie qu'on vérifie le droit d'agir : seul un ADMIN peut entrer, quel que soit l'objet visé. <code>@PreAuthorize</code> pose ce videur avant la méthode.</p>
<pre class="pseudo">@PreAuthorize("hasRole('ADMIN')")                // videur : reserve aux ADMIN (sinon 403, avant d'entrer)
@PostMapping("/gestion/promouvoir/{id}")         // POST (ecriture) : promouvoir l'utilisateur d'id {id}
public String promouvoir(@PathVariable Long id) {   // @PathVariable : lit l'id dans l'URL
    utilisateurService.ajouterRole(id, "VENDEUR");   // delegue au service : donne le role VENDEUR a cet utilisateur
    return "redirect:/gestion";                  // apres l'ecriture, on redirige vers la page de gestion
}</pre>

<h3>4. Le test de refus croisé, par espace</h3>
<p>Le <em>refus croisé</em> vérifie qu'un rôle est bien REFUSÉ là où il n'a rien à faire. On EXIGE le code <strong>403</strong> (Forbidden, « interdit »).</p>
<pre class="pseudo">@Test @WithMockUser(roles = "CLIENT")            // test joue comme un utilisateur ayant le role CLIENT
void clientNaccedePasAlaGestion() throws Exception {   // scenario : un CLIENT ne doit PAS voir la gestion
    mockMvc.perform(get("/gestion")).andExpect(status().isForbidden());  // 403   // il tente /gestion ; on exige un 403
}
@Test @WithMockUser(roles = "VENDEUR")           // test joue comme un VENDEUR
void vendeurNaccedePasAuxComptes() throws Exception {   // scenario : un VENDEUR ne doit PAS promouvoir (action admin)
    mockMvc.perform(post("/gestion/promouvoir/1").with(csrf()))   // il tente l'action de promotion (POST + jeton CSRF)
        .andExpect(status().isForbidden());      // on exige un 403 : action reservee a l'ADMIN
}</pre>

<h3>5. Le dividende de l'architecture en couches</h3>
<div class="warn">Chaque espace a son test de refus croisé, verrouillé par la CI : la matrice « qui accède à quoi » est prouvée, pas supposée. Une régression d'autorisation (un @PreAuthorize oublié) redevient rouge immédiatement.</div>
<div class="tip">Les espaces n'ajoutent presque pas de code : ils <strong>assemblent</strong> ce qui existe. C'est le dividende d'une architecture montée proprement dès la semaine 1 — la dernière ligne droite compose des briques testées, elle ne réinvente pas la mécanique. Quand la fondation est saine, la finition est rapide.</div>`,
  exercises: [
    { type: "qcm", q: "Les trois espaces correspondent à…", opts: ["Trois bases", "Trois rôles (client, vendeur, admin)", "Trois serveurs", "Trois langues"], a: 1, exp: "Cloisonnement par profil." },
    { type: "qcm", q: "Les espaces ajoutent…", opts: ["Beaucoup de métier neuf", "Presque aucun métier (ils assemblent)", "Une base", "Un WAF"], a: 1, exp: "Orchestration." },
    { type: "qcm", q: "L'espace client filtre par…", opts: ["L'URL", "L'utilisateur courant (findByClient)", "Le rôle brut", "Le cookie"], a: 1, exp: "Par ressource." },
    { type: "qcm", q: "L'espace admin se protège par…", opts: ["Un menu caché", "@PreAuthorize(hasRole('ADMIN'))", "Rien", "Un cookie"], a: 1, exp: "Par rôle." },
    { type: "qcm", q: "Le test de refus croisé vérifie…", opts: ["Le style de la page","Qu'un rôle n'accède pas à l'espace d'un autre","La rapidité de réponse","Le port réseau"], a: 1, exp: "403 attendu." },
    { type: "qcm", q: "@WithMockUser(roles='CLIENT') simule…", opts: ["Un compte administrateur","Un utilisateur ayant le rôle CLIENT","Aucun utilisateur connecté","Un compte vendeur"], a: 1, exp: "Test d'autorisation." },
    { type: "qcm", q: "Une régression d'autorisation…", opts: ["Passe inaperçue", "Redevient rouge (test croisé en CI)", "Casse la base", "Est ignorée"], a: 1, exp: "Filet permanent." },
    { type: "qcm", q: "Les services réutilisés viennent des leçons…", opts: ["Aucune", "6-12 (déjà écrits et testés)", "20-21", "Externes"], a: 1, exp: "On assemble." },
    { type: "qcm", q: "La matrice « qui accède à quoi » est…", opts: ["Supposée", "Prouvée par les tests", "Aléatoire", "Décorative"], a: 1, exp: "Vérifiée." },
    { type: "qcm", q: "La finition est rapide car…", opts: ["On code vite", "La fondation (couches) est saine", "On saute les tests", "Par chance"], a: 1, exp: "Dividende de l'archi." },
    { type: "vf", q: "Chaque espace a son test de refus croisé.", a: true, exp: "Cloisonnement prouvé." },
    { type: "qcm", q: "promouvoir se fait en…", opts: ["GET (lecture simple)","POST (écriture) + @PreAuthorize","HEAD (en-têtes seuls)","POST sans contrôle d'accès"], a: 1, exp: "Écrire = POST protégé." },
    { type: "qcm", q: "Un @PreAuthorize oublié serait détecté par…", opts: ["Rien", "Le test de refus croisé (rouge)", "Le CSS", "L'utilisateur"], a: 1, exp: "La CI garde la matrice." },
    { type: "qcm", q: "L'espace client ne montre que…", opts: ["Tout", "Les données de l'utilisateur courant", "Les données admin", "Rien"], a: 1, exp: "findByClient(u)." },
    { type: "vf", q: "Une architecture en couches saine rend la dernière ligne droite rapide.", a: true, exp: "Assembler, pas réinventer." }
  ],
  final: {
    title: "Exercice final — Trois espaces cloisonnés",
    intro: `<p>Espaces + protection + refus croisé.</p>`,
    questions: [
      { type: "qcm", q: "L'espace client montre :", opts: ["les données de l'utilisateur courant", "tout", "les comptes", "rien"], a: 0, exp: "findByClient(u)." },
      { type: "qcm", q: "L'espace gestion est protégé par :", opts: ["@PreAuthorize(hasRole('ADMIN'))", "un menu caché", "rien", "un cookie"], a: 0, exp: "Par rôle." },
      { type: "qcm", q: "Le cloisonnement est prouvé par :", opts: ["un test de refus croisé par espace", "un screenshot", "la confiance", "un WAF"], a: 0, exp: "403 attendu." },
      { type: "qcm", q: "Les espaces contiennent :", opts: ["quasiment aucune logique neuve (assemblage)", "tout le métier", "une nouvelle base", "un cache"], a: 0, exp: "Dividende des couches." },
      { type: "vf", q: "Un @PreAuthorize oublié est rattrapé par la CI.", a: true, exp: "Test croisé." }
    ],
    solution: `<pre class="pseudo">@GetMapping("/client") espaceClient(@AuthenticationPrincipal Utilisateur u):   // espace client : filtre sur l'utilisateur connecte
  locations = locationRepo.findByClient(u); achats = achatRepo.findByClient(u);   // ne montre que SES locations et SES achats

@PreAuthorize("hasRole('ADMIN')")                // reserve aux ADMIN
@PostMapping("/gestion/promouvoir/{id}") ... ajouterRole(id,"VENDEUR")   // action admin : donner le role VENDEUR a un compte

@Test @WithMockUser(roles="CLIENT") get("/gestion") -> isForbidden()   // preuve : un CLIENT sur /gestion recoit 403</pre>
<p>Les espaces sont cloisonnés. Demain : l'image de production, durcie.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes espaces et leurs tests de refus…",
  items: [
  { id: "proj6java-l16", title: "Trois espaces cloisonnés, prouvés par refus croisé", level: 2,
    statement: "Écris l'espace client (filtré par l'utilisateur courant), un endpoint admin protégé (@PreAuthorize), et deux tests de refus croisé (un CLIENT sur /gestion, un VENDEUR sur promouvoir). Explique en 2-3 lignes pourquoi les espaces n'ajoutent presque pas de code et ce que le test de refus croisé garantit.",
    hints: [
      "Espace client : @AuthenticationPrincipal + findByClient(u).",
      "Admin : @PreAuthorize(\"hasRole('ADMIN')\") sur un POST.",
      "Tests : @WithMockUser(roles=...) attendant isForbidden()."
    ],
    atoi: { cmd: "./mvnw -q test -Dtest=EspacesAutorisationTest", expected: "Tests run: 2, Failures: 0, Errors: 0, Skipped: 0\n[INFO] BUILD SUCCESS" },
    checklist: ["L'espace client ne montre que les données de l'utilisateur courant (findByClient(u)).","L'endpoint admin est protégé par @PreAuthorize(hasRole('ADMIN')).","Deux tests de refus croisé : un CLIENT sur /gestion, un VENDEUR sur promouvoir, tous deux refusés.","Les espaces assemblent des services déjà écrits et testés (leçons 6-12) : presque aucun code neuf."],
    solution: "@GetMapping(\"/client\")\npublic String espaceClient(@AuthenticationPrincipal Utilisateur u, Model m) {\n    m.addAttribute(\"locations\", locationRepo.findByClient(u));\n    m.addAttribute(\"achats\", achatRepo.findByClient(u));\n    return \"client/espace\";\n}\n\n@PreAuthorize(\"hasRole('VENDEUR')\")\n@GetMapping(\"/vendeur\")\npublic String espaceVendeur(Model m) {\n    m.addAttribute(\"enRetard\", locationRepo.findEnRetard(LocalDate.now()));\n    return \"vendeur/espace\";\n}\n\n@PreAuthorize(\"hasRole('ADMIN')\")\n@PostMapping(\"/gestion/promouvoir/{id}\")\npublic String promouvoir(@PathVariable Long id) {\n    utilisateurService.ajouterRole(id, \"VENDEUR\");\n    return \"redirect:/gestion\";\n}\n\n// Tests de refus croise (verrouilles par la CI)\n@Test @WithMockUser(roles = \"CLIENT\")\nvoid clientNaccedePasAlaGestion() throws Exception {\n    mockMvc.perform(get(\"/gestion\")).andExpect(status().isForbidden());\n}\n@Test @WithMockUser(roles = \"VENDEUR\")\nvoid vendeurNePromeutPas() throws Exception {\n    mockMvc.perform(post(\"/gestion/promouvoir/1\").with(csrf()))\n        .andExpect(status().isForbidden());\n}\n\n// POURQUOI SI PEU DE CODE, CE QUE GARANTIT LE REFUS CROISE\n// Les espaces ne font qu'APPELER des services et des requetes deja ecrits et\n// testes (leçons 6-15) : ils cablent des vues sur des briques existantes. C'est\n// le dividende d'une architecture en couches montee proprement -- la finition\n// assemble, elle ne reinvente pas.\n// Le test de refus croise transforme la matrice 'qui accede a quoi' en propriete\n// VERIFIEE : un @PreAuthorize oublie ou mal ecrit fait echouer la CI. Sans lui,\n// une regression d'autorisation ne se decouvre qu'en... incident de securite.",
    note: "Cette leçon illustre le paiement des intérêts d'un bon investissement : parce que le métier a été construit en couches, testé et sécurisé au fil de l'eau, l'ouverture des trois espaces se réduit à du câblage. La matrice d'autorisation, prouvée espace par espace, est l'un des livrables les plus rassurants d'un projet : elle documente et garantit simultanément qui peut faire quoi. Quand la fondation est saine, la dernière ligne droite est courte." }
  ]
};
</script>
