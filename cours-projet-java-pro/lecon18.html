  subtitle: "Assembler l'usine de bout en bout et verrouiller main.",
  theory: `
<h3>1. Le pipeline de CI, à ce stade</h3>
<p>Un <strong>pipeline</strong> est une chaîne d'étapes automatiques déclenchée à chaque envoi de code, comme une chaîne de montage. Une <strong>PR</strong> (Pull Request, « demande de fusion ») propose d'intégrer des modifications ; <strong>merger</strong>, c'est les fusionner dans la branche principale. Plusieurs jobs tournent <em>en parallèle</em> (en même temps) pour aller vite, et la <strong>barrière</strong> n'autorise la fusion que si tout est vert et qu'un collègue a relu.</p>
<pre class="pseudo">push / PR
   ├─ tests (MySQL) + couverture JaCoCo   ┐
   ├─ qualite (spotless:check)            ┤ en parallèle
   └─ securite (gitleaks)                 ┘
        └─ image (build + trivy + smoke test)   needs: les trois
BARRIÈRE : merge SEULEMENT si tout est vert + 1 revue.</pre>

<h3>2. Le workflow de release (sur tag)</h3>
<p>Une <strong>release</strong> (« livraison ») est la publication officielle d'une version. On la déclenche par un <strong>tag Git</strong> : une étiquette posée sur un point précis de l'historique, nommée selon <strong>semver</strong> (versionnage sémantique, ex. <code>v1.0.0</code>). Le <strong>registre</strong> (ici <code>ghcr.io</code>) est l'entrepôt d'images en ligne ; <code>docker push</code> y dépose l'image, après s'être authentifié avec un <strong>secret</strong> (jeton) via <code>docker login</code>.</p>
<pre class="pseudo"># .github/workflows/release.yml
on: { push: { tags: ["v*"] } }            # SEUL un tag de version déclenche
jobs:                                     # les taches de ce workflow
  publier:                                # le job qui construit et publie la release
    steps:                                # ses etapes, dans l'ordre
      - uses: actions/checkout@v4         # recupere le code du depot
      - run: echo "VERSION=\${GITHUB_REF_NAME#v}" >> "\$GITHUB_ENV"   # v1.0.0 -> 1.0.0
      - run: echo "\${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # connexion au registre avec le jeton secret
      - run: |                            # etape multi-lignes (un script shell)
          docker build -t ghcr.io/toi/ludotheque:\$VERSION .   # construit l'image, taguee avec le numero de version
          trivy image --exit-code 1 --severity CRITICAL ghcr.io/toi/ludotheque:\$VERSION   # re-scanne l'image : arret si CVE critique
          docker push ghcr.io/toi/ludotheque:\$VERSION   # depose l'image versionnee dans le registre</pre>
<p>Le tag Git (aligné sur semver) déclenche build + scan + push d'un artefact <strong>versionné et immuable</strong>. Code et image racontent la même histoire.</p>

<h3>3. La protection de branche</h3>
<pre class="pseudo">Settings -> Branches -> main :
✔ Require PR + 1 approbation
✔ Require status checks : tests, qualite, securite, image
✔ Require branches up to date ; ✔ no bypass (admins compris)</pre>

<h3>4. Le graphe complet</h3>
<pre class="pseudo">-- ci.yml --------  (~6-9 min)
push/PR -> tests+qualite+securite (parallèle) -> image -> [si main] staging
-- release.yml ---  (~4-6 min + approbation)
git tag v1.0.0 -> publier (build+scan+push) -> approbation -> production</pre>

<h3>5. La durée compte</h3>
<div class="warn">Un pipeline de 40 minutes se contourne (« je merge, on verra ») ; un pipeline de 8 minutes est utilisé. Les caches (Maven, build Docker), le parallélisme et des jobs minimaux ne sont pas du confort — ils protègent l'adoption. Un pipeline lent est un pipeline mort.</div>
<div class="tip">Le pipeline réunit les trois cours d'outillage : CI/CD (structure, protection), Docker (image), Sécurité (scans). Un commit tagué déclenche un artefact versionné et scanné ; la barrière de branche garantit que main est toujours déployable — une propriété mécanique, plus une intention.</div>`,

  ],

      { type: "vf", q: "Le pipeline reste sous 10 min grâce aux caches et au parallélisme.", a: true, exp: "Adoption." }
    ],
    solution: `<pre class="pseudo"># release.yml

  publier:                                # job de publication
    steps:

          docker push ghcr.io/toi/ludotheque:\$VERSION   # publie l'image dans le registre

# Protection de main : tests+qualite+securite+image verts + 1 revue</pre>
<p>L'usine est complète. Demain : le déploiement automatisé (Actuator).</p>`
