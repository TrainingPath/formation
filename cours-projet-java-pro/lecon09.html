<h3>1. Les trois rôles</h3>
<p>Avant tout, un mot sur l'outil du jour. <strong>Spring Security</strong> est le « service de sécurité » du framework Spring : un ensemble de briques toutes prêtes qui décident qui a le droit d'entrer et qui a le droit de faire quoi — comme le gardiennage d'un immeuble, avec ses badges, ses portes et son registre. On ne réécrit pas ces mécanismes, on les branche et on les règle.</p>
<p>La Ludothèque a trois <strong>rôles</strong>. Un rôle est une étiquette décrivant ce qu'un utilisateur a le droit de faire, comme les badges « visiteur », « employé » et « directeur » d'une entreprise : <strong>CLIENT</strong>, <strong>VENDEUR</strong>, <strong>ADMIN</strong>. On les <strong>modélise en base</strong> — c'est-à-dire qu'on les range dans la <strong>base de données</strong>, le grand classeur où le programme conserve durablement ses informations — via une table utilisateur reliée à ses rôles. Au moment de la connexion, un <code>UserDetailsService</code> (l'objet qui, à partir d'un email, va chercher le mot de passe et les rôles de la personne) les charge depuis cette base.</p>
<p>Une <strong>entité</strong> est une classe dont chaque objet correspond à une ligne d'une table : ici, un <code>Utilisateur</code> = une ligne de la table des utilisateurs. Les mots précédés d'un <code>@</code> sont des <strong>annotations</strong> : des étiquettes collées sur le code pour lui donner un comportement automatique, comme un tampon « FRAGILE » sur un colis.</p>
<pre class="pseudo">@Entity public class Utilisateur {                              // @Entity : cette classe EST une table en base ; chaque objet = une ligne
    @Id @GeneratedValue(strategy = IDENTITY) private Long id;   // @Id : la cle primaire (identifiant unique) ; IDENTITY : la base l'attribue seule (1, 2, 3…)
    @Column(unique = true, nullable = false) private String email;   // colonne email : unique (pas deux comptes pareils) et obligatoire (jamais vide)
    @Column(nullable = false) private String motDePasseHache;   // JAMAIS en clair : on ne stocke que l'empreinte, pas le vrai mot de passe
    @ElementCollection(fetch = EAGER) private Set<String> roles;  // la liste des roles (ROLE_CLIENT…), chargee EN MEME TEMPS que l'utilisateur (EAGER)
}</pre>

<h3>2. Le hachage du mot de passe</h3>
<p><strong>Hacher</strong> un mot de passe, c'est le passer dans une moulinette <em>à sens unique</em> qui produit une empreinte illisible : impossible de remonter de l'empreinte au mot de passe, comme on ne reconstitue pas une pomme à partir de la compote. Un <code>PasswordEncoder</code> est l'objet qui fabrique cette empreinte puis vérifie une saisie. <strong>BCrypt</strong> est un algorithme de hachage rendu <em>volontairement lent</em> : imperceptible pour qui se connecte une fois, cette lenteur ruine les attaques par <strong>force brute</strong> (essayer des millions de mots de passe à la chaîne).</p>
<pre class="pseudo">@Bean PasswordEncoder encoder() { return new BCryptPasswordEncoder(12); }   // @Bean : objet fabrique et gere par Spring, reutilisable partout ; BCrypt de cout 12
// (ou Argon2PasswordEncoder) — jamais de MD5/SHA1, jamais de clair          // MD5/SHA1 sont trop rapides donc cassables ; stocker en clair est interdit
String hache = encoder.encode(motDePasseClair);   // encode() : fabrique l'empreinte a l'INSCRIPTION (c'est elle qu'on range en base)
encoder.matches(saisi, hache);                    // matches() : a la CONNEXION, compare la saisie a l'empreinte stockee (renvoie vrai/faux)</pre>
<p>Le <code>12</code> est le <strong>facteur de coût</strong> : chaque unité double le travail à fournir, un curseur qu'on augmente au fil des années à mesure que les machines accélèrent. BCrypt ajoute aussi tout seul un <strong>sel</strong> — une petite valeur aléatoire mélangée au mot de passe avant hachage — pour que deux personnes au même mot de passe obtiennent des empreintes différentes.</p>

<h3>3. La chaîne de sécurité</h3>
<p>La <strong>chaîne de sécurité</strong> (<code>SecurityFilterChain</code>) est la suite de filtres que chaque requête traverse avant d'atteindre l'application, comme les portiques successifs à l'entrée d'un aéroport. C'est là qu'on déclare quelles adresses (URL) sont ouvertes à tous et lesquelles exigent d'être connecté. Une <strong>requête</strong> est une demande qu'un navigateur envoie au serveur (« montre-moi le catalogue »).</p>
<pre class="pseudo">@Configuration @EnableMethodSecurity                            // @Configuration : classe de reglages ; @EnableMethodSecurity : autorise les verrous par methode (@PreAuthorize, lecon 10)
public class SecuriteConfig {
    @Bean SecurityFilterChain chaine(HttpSecurity http) throws Exception {   // http = l'objet ou l'on decrit toutes les regles de securite
        http.authorizeHttpRequests(a -> a                        // on commence a definir QUI a le droit d'acceder a QUOI
                .requestMatchers("/", "/catalogue", "/api/jeux").permitAll()   // ces adresses publiques : permitAll = accessibles SANS etre connecte
                .anyRequest().authenticated())                   // toutes les AUTRES adresses : authenticated = reservees aux personnes connectees
            .formLogin(Customizer.withDefaults())                // active le formulaire de connexion standard fourni par Spring
            .logout(Customizer.withDefaults());                  // active la deconnexion standard (le bouton « se deconnecter »)
        return http.build();                                     // build() : assemble toutes ces regles en une chaine prete a l'emploi
    }
}</pre>

<h3>4. Durcir les cookies de session</h3>
<p>Une <strong>session</strong> est la mémoire qu'un serveur garde d'un visiteur connecté, comme le vestiaire qui vous remet un jeton après avoir pris votre manteau. Ce jeton est un <strong>cookie</strong> : un petit fichier que le navigateur renvoie à chaque requête pour prouver « c'est toujours moi ». Comme ce cookie vaut votre identité, on le <strong>durcit</strong> (on le rend dur à voler). <strong>XSS</strong> (injection d'un script dans une page) et <strong>CSRF</strong> (requête forgée à votre insu) sont deux attaques classiques ; <strong>HTTPS</strong> est la version chiffrée du web, qui empêche d'espionner ce qui circule.</p>
<pre class="pseudo"># application.yml                                                # fichier de configuration (format YAML : des cles imbriquees par l'indentation)
server:                                                          # reglages du serveur web
  servlet:                                                       # de la couche servlet (le moteur qui traite les requetes)
    session:                                                     # de la gestion des sessions
      cookie:                                                    # et precisement du cookie qui identifie la session
        http-only: true      # inaccessible au JavaScript (anti-vol par XSS)
        secure: true         # transmis uniquement en HTTPS
        same-site: lax       # anti-CSRF de base</pre>

<h3>5. Politique de mot de passe</h3>
<p>Le <strong>NIST</strong> (l'institut américain des standards) recommande de privilégier la <strong>longueur</strong> d'un mot de passe plutôt que la complexité artificielle (les fameux « au moins un chiffre et un caractère spécial », qui poussent surtout aux mots de passe faciles à deviner). On refuse aussi ceux qui figurent dans les <em>listes de mots de passe courants</em> déjà connues des attaquants.</p>
<pre class="pseudo">// à l'inscription : longueur >= 12, refus des mots de passe courants (listes connues)
// NIST : privilégier la LONGUEUR à la complexité artificielle
if (mdp.length() < 12 || motsDePasseCourants.contains(mdp))   // SI le mot de passe fait moins de 12 caracteres OU figure dans la liste des courants…
    throw new MotDePasseFaibleException();                    // …on rejette l'inscription en levant une exception « mot de passe trop faible »</pre>
<div class="warn">Au Niveau 6, la sécurité des sessions arrivait en fin de parcours et le hachage était bricolé. Ici, dès le premier utilisateur : BCrypt (facteur de coût 12), politique NIST, cookies durcis. Sécuriser au moment où l'on crée la fonctionnalité coûte quelques lignes ; le faire après coup coûte un audit.</div>
<div class="tip">Spring Security fournit gratuitement l'essentiel (formulaire de login, protection CSRF, gestion de session). Notre travail : brancher les utilisateurs, choisir un bon encodeur, durcir les cookies. Le « par conception » n'est pas plus de code — c'est le bon réflexe au bon moment.</div>`,

  ],
  final: {

@Bean SecurityFilterChain chaine(HttpSecurity http){                        // la chaine de filtres que traverse chaque requete
  http.authorizeHttpRequests(a -> a                                         // on definit qui accede a quoi
       .requestMatchers("/","/catalogue","/api/jeux").permitAll()           // adresses publiques : accessibles sans etre connecte

relire le mot de passe, seulement de le VERIFIER.\n// BCrypt est volontairement lent (cout 12) pour ruiner le brute-force. Et on\n// durcit DES le premier compte : rajouter http-only/secure/BCrypt apres coup,\n// c'est un audit et une migration de tous les mots de passe existants.",
