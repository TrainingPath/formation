<script>
var DAY = {
  num: 19,
  title: "Déploiement automatisé : staging, production, santé (Actuator)",
  subtitle: "Le serveur se met à jour tout seul — et on le vérifie.",
  theory: `
<h3>1. La vue de santé, offerte par Actuator</h3>
<p><strong>Actuator</strong> est un module de Spring Boot qui ajoute des <strong>endpoints</strong> (points d'accès) de supervision, sans code à écrire. La <strong>sonde de santé</strong> <code>/actuator/health</code> est comme un panneau « ouvert / fermé » : le serveur y annonce s'il va bien (UP) ou non (DOWN), après avoir vérifié que la base répond, que le disque n'est pas plein, etc.</p>
<pre class="pseudo"># application.yml
management:                                # reglages de supervision (Actuator)
  endpoints: { web: { exposure: { include: health } } }   # n'expose sur le web QUE l'endpoint health (rien d'autre)
  endpoint: { health: { probes: { enabled: true } } }     # active les sondes de vie/preparation (utiles en orchestration)
# /actuator/health traverse jusqu'à la base (DataSourceHealthIndicator)
# -> {"status":"UP"} (200) ou {"status":"DOWN"} (503)</pre>
<p>Pas de code à écrire : Spring Boot fournit une sonde de santé qui vérifie la base, l'espace disque, etc.</p>

<h3>2. Le job de déploiement (SSH)</h3>
<p><strong>SSH</strong> est le tunnel chiffré par lequel on se connecte à distance à un serveur, ouvert avec une <strong>clé privée</strong> (un fichier secret qui prouve l'identité, comme une clé physique). Le robot du pipeline utilise cette clé pour dire au serveur : « récupère la nouvelle image et redémarre ». <strong>Flyway</strong> est l'outil qui applique automatiquement les changements de structure de la base (les <em>migrations</em>) au démarrage.</p>
<pre class="pseudo">  deployer-production:                     # job qui deploie en production
    needs: publier                         # ne demarre qu'apres la publication de l'image au registre
    environment: production                # approbation humaine requise
    steps:
      - run: echo "\${{ secrets.SSH_PRIVATE_KEY }}" > cle && chmod 600 cle   # ecrit la cle SSH secrete dans un fichier a acces restreint (600)
      - run: |
          ssh -i cle -o StrictHostKeyChecking=accept-new deploy@ludotheque.example.com '
            cd /srv/ludotheque &&
            echo "VERSION=\${GITHUB_REF_NAME#v}" > .env.version &&
            docker compose pull &&
            docker compose up -d'          # Flyway migre au démarrage de l'app
      - run: sleep 15 && curl -fs https://ludotheque.example.com/actuator/health   # attend 15s puis verifie que le site repond (sinon job rouge)</pre>
<p>Le serveur ne fait que <code>pull</code>, <code>up -d</code> — ce que tu ferais à la main, exécuté par un robot avec une clé qui ne sait <strong>que</strong> déployer.</p>

<h3>3. Deux environnements</h3>
<pre class="pseudo">merge sur main -> deployer-staging (automatique) -> recette
tag v1.0.0     -> publier -> ⏸ approbation -> deployer-production
# staging reçoit tout, tout de suite ; la prod exige un tag ET un clic humain.</pre>

<h3>4. Vérifier — sinon ce n'est pas déployé</h3>
<pre class="pseudo">curl -fs .../actuator/health     # -f échoue si != 2xx -> le job devient rouge
# un déploiement raté n'est pas silencieux : l'équipe est notifiée.</pre>

<h3>5. Le serveur n'a besoin que de peu</h3>
<pre class="pseudo">serveur/  compose.yaml (image: ghcr.io/...:\${VERSION})  +  .env.prod (chmod 600)
# ni Java, ni le code source : l'image du registre contient tout.</pre>
<div class="warn"><code>StrictHostKeyChecking=accept-new</code> accepte la clé du serveur au premier contact mais refuse tout changement ultérieur (anti-« man in the middle »). La clé SSH appartient à un utilisateur <code>deploy</code> qui ne peut que lancer compose — pas root. Flyway applique les migrations au démarrage de l'app : le schéma suit le code, automatiquement.</div>
<div class="tip">De <code>git push origin v1.0.0</code> au site à jour et vérifié : zéro connexion manuelle au serveur. Le déploiement rejoue au robot le geste du cours Docker (pull, up), avec la vérification <code>/actuator/health</code> qui transforme « c'est parti » en « c'est en ligne et ça répond ».</div>`,
  exercises: [
    { type: "qcm", q: "/actuator/health est…", opts: ["À coder à la main", "Fourni par Spring Boot Actuator", "Un fichier statique", "Un cron"], a: 1, exp: "Sonde intégrée." },
    { type: "qcm", q: "La sonde de santé vérifie…", opts: ["Le CSS", "Que la base répond (et plus) -> UP/DOWN", "Le hachage", "Le registre"], a: 1, exp: "Traverse jusqu'à la base." },
    { type: "qcm", q: "Le job de déploiement dépend de…", opts: ["Rien", "needs: publier (image au registre d'abord)", "needs: tests", "main"], a: 1, exp: "L'ordre." },
    { type: "qcm", q: "Sur le serveur, le job fait…", opts: ["Un rebuild complet", "pull, up -d", "rm -rf", "git clone"], a: 1, exp: "Le geste Docker, robotisé." },
    { type: "qcm", q: "La clé SSH appartient à…", opts: ["root", "un utilisateur deploy limité à compose", "l'admin GitHub", "tout le monde"], a: 1, exp: "Moindre privilège." },
    { type: "qcm", q: "Les migrations sont appliquées…", opts: ["À la main sur le serveur", "Par Flyway au démarrage de l'app", "Jamais", "Par le DBA"], a: 1, exp: "Schéma suit le code." },
    { type: "qcm", q: "StrictHostKeyChecking=accept-new…", opts: ["Accepte tout, toujours", "Accepte la clé au 1er contact, refuse tout changement", "Refuse tout", "Désactive SSH"], a: 1, exp: "Anti-MITM." },
    { type: "qcm", q: "Staging se déploie…", opts: ["Sur approbation", "Automatiquement au merge sur main", "Sur tag", "Jamais"], a: 1, exp: "Répétition générale." },
    { type: "qcm", q: "La production se déploie…", opts: ["À chaque commit", "Sur tag, APRÈS approbation humaine", "Jamais", "La nuit"], a: 1, exp: "environment production." },
    { type: "qcm", q: "curl -fs /actuator/health …", opts: ["Ignore l'échec", "Échoue si != 2xx -> job rouge", "Chiffre", "Accélère"], a: 1, exp: "Déployé = vérifié." },
    { type: "vf", q: "Un déploiement raté par le pipeline passe inaperçu.", a: false, exp: "Job rouge + notification." },
    { type: "qcm", q: "Le serveur a besoin de…", opts: ["Java + code source", "Docker + compose.yaml + .env.prod (l'image vient du registre)", "Un IDE", "Le dépôt complet"], a: 1, exp: "pull + up -d." },
    { type: "qcm", q: "La version déployée change en…", opts: ["Rebuild serveur", "Changeant .env.version (lu par le compose) + pull/up", "Éditant l'image", "Reboot"], a: 1, exp: "image: ...:${VERSION}." },
    { type: "qcm", q: "De git push origin v1.0.0 au site à jour :", opts: ["Une soirée", "Zéro connexion manuelle au serveur", "Un admin la nuit", "Un ftp"], a: 1, exp: "Automatisé." },
    { type: "vf", q: "Le déploiement rejoue au robot le geste du cours Docker (pull, up).", a: true, exp: "Automatisation." }
  ],
  final: {
    title: "Exercice final — Le serveur qui se met à jour seul",
    intro: `<p>Le tag poussé, l'image publiée, et le serveur suit — tout seul.</p>`,
    questions: [
      { type: "qcm", q: "La sonde de santé :", opts: ["/actuator/health (fournie par Actuator)", "un ping", "le CSS", "rien"], a: 0, exp: "Base incluse." },
      { type: "qcm", q: "Le job dépend de :", opts: ["needs: publier", "rien", "needs: tests", "main"], a: 0, exp: "Image d'abord." },
      { type: "qcm", q: "Sur le serveur :", opts: ["pull -> up -d (Flyway migre)", "rebuild", "rsync du code", "réinstallation"], a: 0, exp: "Le geste Docker." },
      { type: "qcm", q: "La preuve du succès :", opts: ["curl -fs /actuator/health en 200", "l'absence d'erreur ssh", "un sentiment", "les logs du lendemain"], a: 0, exp: "Vérifié." },
      { type: "vf", q: "La prod exige un tag ET une approbation ; staging se met à jour au merge.", a: true, exp: "Deux environnements." }
    ],
    solution: `<pre class="pseudo"># application.yml : management.endpoints.web.exposure.include: health

  deployer-production:                # job de deploiement en production
    needs: publier                    # apres la publication de l'image
    environment: production        # approbation requise
    steps:
      - run: echo "\${{ secrets.SSH_PRIVATE_KEY }}" > cle && chmod 600 cle   # cle SSH privee en acces restreint
      - run: ssh -i cle deploy@... 'cd /srv/ludotheque && docker compose pull &&
             docker compose up -d'     # Flyway migre au démarrage
      - run: sleep 15 && curl -fs https://ludotheque.example.com/actuator/health   # verifie la sante apres deploiement</pre>
<p>Le site suit les tags, tout seul. Demain : observer, sauvegarder, protéger, revenir.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton déploiement et sa vérification…",
  items: [
  { id: "proj6java-l19", title: "Le déploiement à deux environnements", level: 3,
    statement: "Écris l'exposition d'Actuator (application.yml), le job deployer-staging (auto au merge sur main) et deployer-production (sur tag, avec approbation), et la vérification curl avec retries (pas un sleep aveugle). Explique pourquoi staging reçoit tout automatiquement mais la prod exige un tag ET une approbation.",
    hints: [
      "if: github.ref == 'refs/heads/main' pour staging.",
      "environment: production avec required reviewers pour l'approbation.",
      "Retry : for i in seq 1 12; curl && break; sleep 5 (patient, pas aveugle)."
    ],
    solution: "# application.yml — sonde de sante (fournie par Actuator)\nmanagement:\n  endpoints: { web: { exposure: { include: health } } }\n  endpoint: { health: { probes: { enabled: true }, show-details: never } }\n\n# ci.yml — staging au merge\n  deployer-staging:\n    if: github.ref == 'refs/heads/main'\n    environment: staging\n    needs: [tests, qualite, securite, image]\n    steps: [ ...ssh staging.ludotheque... 'docker compose pull && up -d'... ]\n\n# release.yml — production sur tag + approbation\n  deployer-production:\n    needs: publier\n    environment: production          # required reviewers -> approbation humaine\n    steps:\n      - run: echo \"${{ secrets.SSH_PRIVATE_KEY }}\" > cle && chmod 600 cle\n      - run: |\n          ssh -i cle -o StrictHostKeyChecking=accept-new deploy@ludotheque.example.com '\n            cd /srv/ludotheque && echo \"VERSION=${GITHUB_REF_NAME#v}\" > .env.version &&\n            docker compose pull && docker compose up -d'\n      - name: Verifier la sante (patient, pas aveugle)\n        run: |\n          for i in $(seq 1 12); do\n            curl -fs https://ludotheque.example.com/actuator/health && exit 0\n            sleep 5\n          done\n          exit 1        # rouge seulement apres ~60 s d'echecs repetes\n\n# POURQUOI CETTE ASYMETRIE STAGING/PROD\n# Staging est la scene de REPETITION : il recoit chaque merge automatiquement,\n# pour que les surprises s'y produisent AVANT les clients. La production, elle,\n# touche de vrais utilisateurs et de vraies donnees : elle exige une DECISION\n# (un tag = 'cette version est prete') ET une APPROBATION ('deployons\n# maintenant, quelqu'un surveille'). L'automatisation execute ; l'humain decide\n# du moment.",
    note: "Le retry patient (boucle curl) plutôt qu'un sleep aveugle évite le faux positif qui ruine la confiance dans le pipeline : l'app met parfois quelques secondes de plus à répondre (migration Flyway, démarrage de la JVM). L'asymétrie staging/production incarne le principe : automatiser tout ce qui peut l'être, réserver à l'humain les seules VRAIES décisions — le moment de livrer aux clients. Actuator offre la sonde gratuitement, ce qui rend la vérification triviale à câbler." }
  ]
};
