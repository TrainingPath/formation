<script>
var DAY = {
  num: 3,
  title: "Git, branches et première CI (Maven, dès le départ)",
  subtitle: "Le garde-fou avant le métier : chaque commit est vérifié sur une machine neutre.",
  theory: `
<h3>1. Un dépôt propre dès le premier commit</h3>
<pre class="pseudo">git init                              # cree un depot Git vide dans le dossier (demarre le suivi des versions)
# .gitignore : target/, *.env, application-local.yml, .idea/   (les fichiers a NE JAMAIS versionner : builds, secrets, reglages perso)
git add . && git commit -m "feat: squelette Spring Boot + Compose"   # enregistre une 1re version avec un message norme
git branch -M main && git remote add origin ... && git push -u origin main   # nomme la branche 'main', la relie au serveur, l'y envoie</pre>
<p><code>git init</code> crée le dépôt local (le carnet de versions du projet). Le fichier <code>.gitignore</code> liste ce qu'on ne versionne <em>jamais</em> : les fichiers reconstructibles comme <code>target/</code> et les secrets. Un <strong>remote</strong> (nommé « origin ») est la copie du dépôt sur un serveur partagé, et <code>push</code> l'y envoie. Enfin, des messages de commit <strong>normés</strong> (<code>feat:</code> nouveauté, <code>fix:</code> correction, <code>chore:</code> entretien, <code>test:</code> tests) rendent l'historique lisible, et un jour ils génèrent le changelog — le journal des changements (cours CI/CD leçon 1).</p>

<h3>2. Le workflow de CI</h3>
<pre class="pseudo"># .github/workflows/ci.yml            # fichier decrivant le pipeline automatique (le "robot" de verification)
name: CI                              # nom affiche du pipeline
on:                                   # evenements qui reveillent le robot
  push: { branches: [main] }          # a chaque envoi de code sur main
  pull_request: { branches: [main] }  # et a chaque demande d'integration visant main
jobs:                                 # liste des travaux a executer
  verifier:                           # notre unique travail, nomme "verifier"
    runs-on: ubuntu-latest            # tourne sur une machine Linux neuve fournie par GitHub
    steps:                            # etapes executees dans l'ordre
      - uses: actions/checkout@v4     # 1) recupere le code du depot sur la machine
      - uses: actions/setup-java@v4   # 2) installe Java...
        with: { distribution: "temurin", java-version: "21", cache: "maven" }   # ...version 21 (distribution Temurin), en gardant les dependances en cache
      - run: mvn -B spotless:check    # 3) verifie le format du code (echoue si mal formate)
      - run: mvn -B -DskipITs verify  # 4) compile et lance les tests (sauf les tests d'integration, plus lents)</pre>
<p>Traduisons ce fichier <strong>YAML</strong> (un format texte où l'indentation — le décalage vers la droite — indique ce qui appartient à quoi, comme les tirets d'une liste à puces). Un <strong>workflow</strong> est la recette complète du robot ; un <strong>job</strong> est un travail de cette recette ; un <strong>runner</strong> est la machine jetable (ici Linux, « ubuntu-latest ») que GitHub allume pour l'exécuter, puis éteint. <strong>setup-java</strong> installe le <strong>JDK</strong> (<em>Java Development Kit</em>, la trousse à outils pour construire du Java) dans sa version « Temurin ». Côté vitesse : <code>-B</code> (batch) coupe les logs interactifs ; <code>cache: maven</code> évite de retélécharger les dépendances à chaque exécution — un pipeline rapide est un pipeline utilisé.</p>

<h3>3. Spotless : le format tranché une fois pour toutes</h3>
<pre class="pseudo"><!-- pom.xml : plugin spotless (Google Java Format) -->
mvn spotless:apply     # reformate en local
mvn spotless:check     # échoue si un fichier n'est pas au format (CI)</pre>
<p>Le style n'est plus un sujet de revue : la machine le tranche. Les humains relisent la <strong>logique</strong>, pas les espaces.</p>

<h3>4. La protection de main</h3>
<pre class="pseudo">GitHub -> Settings -> Branches -> main :
✔ Require a pull request before merging (+ 1 approbation)
✔ Require status checks to pass : verifier
✔ Require branches to be up to date</pre>

<h3>5. Pourquoi AVANT le métier</h3>
<div class="warn">Si le pipeline arrive après trois semaines de code, on découvre d'un coup 200 problèmes de format et 40 tests à écrire : décourageant, souvent abandonné. Posé au premier commit, il ne juge jamais qu'un tout petit incrément — indolore. La CI n'est pas un juge de fin de parcours, c'est un filet permanent.</div>
<div class="tip">À partir de maintenant, un commit qui casse <code>mvn verify</code> ou le format est rouge <strong>immédiatement</strong> et ne peut pas entrer dans main. La première fonctionnalité métier, demain, naîtra donc déjà sous surveillance.</div>`,
  exercises: [
    { type: "qcm", q: "Les messages de commit sont…", opts: ["Libres", "Normés (feat:, fix:, chore:…)", "Absents", "En majuscules"], a: 1, exp: "Historique lisible + changelog." },
    { type: "qcm", q: "La CI se déclenche sur…", opts: ["La prod", "push et pull_request vers main", "Un cron seul", "Rien"], a: 1, exp: "Chaque commit vérifié." },
    { type: "qcm", q: "setup-java avec cache: maven…", opts: ["Ralentit", "Évite de retélécharger les dépendances", "Chiffre", "Est inutile"], a: 1, exp: "Pipeline rapide = adopté." },
    { type: "qcm", q: "mvn -B signifie…", opts: ["Build seulement", "Mode batch (logs non interactifs)", "Bytecode", "Rien"], a: 1, exp: "Adapté à la CI." },
    { type: "qcm", q: "Spotless sert à…", opts: ["Compiler", "Trancher le format automatiquement", "Déployer", "Chiffrer"], a: 1, exp: "Le style n'est plus débattu." },
    { type: "qcm", q: "spotless:check en CI…", opts: ["Reformate", "Échoue si un fichier n'est pas au format", "Ignore", "Déploie"], a: 1, exp: "spotless:apply reformate en local." },
    { type: "qcm", q: "La protection de main exige…", opts: ["Rien", "PR + status checks verts + revue", "Un mot de passe", "Un tag"], a: 1, exp: "main reste sain." },
    { type: "qcm", q: "Poser la CI au premier commit…", opts: ["Est prématuré", "Rend chaque vérification indolore (petit incrément)", "Est impossible", "Ralentit tout"], a: 1, exp: "Filet permanent." },
    { type: "qcm", q: "Un commit qui casse mvn verify…", opts: ["Passe quand même", "Est rouge et bloqué avant main", "Est ignoré", "Casse la prod"], a: 1, exp: "Barrière mécanique." },
    { type: "qcm", q: "target/ est dans .gitignore car…", opts: ["C'est le code source", "Ce sont des artefacts de build (régénérables)", "C'est secret", "Par erreur"], a: 1, exp: "On ne versionne pas le build." },
    { type: "vf", q: "Le pipeline existe avant la première fonctionnalité métier.", a: true, exp: "Le fil du Niveau 8." },
    { type: "qcm", q: "La revue humaine porte désormais sur…", opts: ["Les espaces", "La logique (le format est automatisé)", "Rien", "Le CSS"], a: 1, exp: "Spotless libère la revue." },
    { type: "qcm", q: "actions/checkout@v4 …", opts: ["Déploie", "Récupère le code du dépôt dans le runner", "Compile", "Chiffre"], a: 1, exp: "Première étape." },
    { type: "qcm", q: "« Require branches up to date » évite…", opts: ["Les conflits", "Qu'une PR verte mais périmée casse main après merge", "Le lint", "Les tests"], a: 1, exp: "main toujours cohérente." },
    { type: "vf", q: "Un pipeline posé tardivement révèle 200 problèmes d'un coup — décourageant.", a: true, exp: "D'où : dès le jour 1." }
  ],
  final: {
    title: "Exercice final — Le garde-fou en place",
    intro: `<p>Git normé + CI + protection de main.</p>`,
    questions: [
      { type: "qcm", q: "La CI vérifie à chaque commit :", opts: ["Spotless + mvn verify", "juste la compilation", "le CSS", "rien"], a: 0, exp: "Format + tests." },
      { type: "qcm", q: "Le style du code est tranché par :", opts: ["Spotless (machine)", "des débats en revue", "le chef", "personne"], a: 0, exp: "Automatisé." },
      { type: "qcm", q: "main est protégée par :", opts: ["PR + status checks + revue", "la bonne volonté", "un mot de passe", "rien"], a: 0, exp: "Mécanique." },
      { type: "qcm", q: "Poser la CI dès le jour 1 :", opts: ["rend chaque check indolore", "est prématuré", "ralentit", "est impossible"], a: 0, exp: "Petits incréments." },
      { type: "vf", q: "Un commit rouge (verify KO) ne peut pas entrer dans main.", a: true, exp: "Barrière de branche." }
    ],
    solution: `<pre class="pseudo"># .github/workflows/ci.yml
on: { push: {branches:[main]}, pull_request: {branches:[main]} }   # se declenche sur push ET PR vers main
jobs:
  verifier:                                                        # le travail de verification
    steps:
      - uses: actions/checkout@v4                                  # recupere le code du depot
      - uses: actions/setup-java@v4                                # installe Java 21 (Temurin) + cache Maven
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B spotless:check                                 # verifie le format
      - run: mvn -B -DskipITs verify                               # compile + lance les tests

# Protection de main : PR + verifier vert + 1 revue</pre>
<p>Le garde-fou est là. Demain : le schéma versionné (Flyway) migré en conteneur.</p>`
  }
};
</script>
