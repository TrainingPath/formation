<script>
var DAY = {
  num: 10,
  title: "Autorisation par rôle et par ressource (anti-IDOR)",
  subtitle: "Qui peut agir ? Sur SON objet ? Les deux, dès la création — et testés.",
  theory: `
<h3>1. Deux questions, pas une</h3>
<p>Deux mots à ne pas confondre. <strong>Authentifié</strong> veut dire « on sait qui tu es » (tu as prouvé ton identité en te connectant), comme montrer sa carte d'identité à l'entrée. <strong>Autorisé</strong> veut dire « tu as le droit de faire ceci » — deux choses différentes : entrer dans un hôtel ne donne pas le droit d'ouvrir toutes les chambres. La sécurité repose donc sur deux contrôles distincts :</p>
<pre class="pseudo">RÔLE      cet utilisateur a-t-il le DROIT d'effectuer cette action ?  (vendeur ?)
RESSOURCE agit-il bien sur SON objet à lui, pas celui d'un autre ?    (SA location ?)</pre>
<p>Oublier le second contrôle, c'est ouvrir la faille <strong>IDOR</strong> (<em>Insecure Direct Object Reference</em>, « référence directe à un objet non sécurisée ») : accéder à l'objet d'un autre simplement en changeant un numéro dans l'adresse. C'est la faille n°1 du classement <strong>OWASP</strong> — la liste de référence des dix risques web les plus graves — au rang A01.</p>

<h3>2. Autorisation par rôle (@PreAuthorize)</h3>
<p>Un <strong>endpoint</strong> (« point d'accès ») est une adresse que le serveur expose et à laquelle une méthode répond, comme un guichet numéroté. L'annotation <code>@PreAuthorize</code> (« vérifier avant ») pose un videur devant ce guichet : la condition entre guillemets doit être vraie, sinon la requête est rejetée avec le code <strong>403</strong> (Forbidden, « interdit »), sans même exécuter la méthode.</p>
<pre class="pseudo">@PreAuthorize("hasRole('VENDEUR')")                             // videur : n'entre ici QUE si l'utilisateur a le role VENDEUR
@PostMapping("/gestion/jeux")                                  // @PostMapping : cette methode repond aux POST (creation) sur /gestion/jeux
public JeuDto creerJeu(@Valid @RequestBody JeuForm form) { ... }   // @RequestBody : JSON recu -> objet ; @Valid : valide l'entree avant le corps
// un CLIENT qui poste ici -> 403, sans même entrer dans la méthode   // un role insuffisant est bloque EN AMONT (403 Forbidden)</pre>

<h3>3. Autorisation par ressource</h3>
<p>Vérifier le rôle ne suffit pas : deux clients ont le même rôle, mais chacun ne doit voir que SES locations. On filtre donc sur l'<strong>utilisateur courant</strong> — celui qui est connecté maintenant. L'annotation <code>@AuthenticationPrincipal</code> injecte cet utilisateur dans la méthode. Un <code>repository</code> (« dépôt ») est l'objet qui parle à la base de données : ses méthodes <code>findBy…</code> se traduisent en requêtes de recherche.</p>
<pre class="pseudo">@GetMapping("/mes-locations")                                  // @GetMapping : repond aux GET (lecture) sur /mes-locations
public List<Location> mesLocations(@AuthenticationPrincipal Utilisateur u) {   // u = l'utilisateur ACTUELLEMENT connecte (injecte par Spring)
    return locationRepo.findByClient(u);        // filtré par l'utilisateur COURANT   // cherche en base les locations dont le client EST u : impossible de voir celles d'autrui
}
// JAMAIS : locationRepo.findById(idVenantDeL_URL) sans vérifier le propriétaire   // chercher par un id venu de l'URL sans verifier a qui il appartient = faille IDOR</pre>

<h3>4. Le piège de l'id d'URL</h3>
<p>Le numéro (<code>id</code>) dans une adresse comme <code>/locations/42</code> vient du client : il peut le changer à volonté. <code>findById(id)</code> va chercher l'objet portant ce numéro <em>sans se soucier de son propriétaire</em> — d'où la faille. La parade : <code>findByIdAndClient(id, u)</code> exige que l'objet porte ce numéro ET appartienne à l'utilisateur courant. <code>orElseThrow()</code> signifie « sinon, lève une erreur » : ici, rien trouvé, on renvoie un 404.</p>
<pre class="pseudo">// VULNÉRABLE : /locations/42 -> renvoie la location 42 quel qu'en soit le client   // le numero vient de l'URL, donc controle par l'attaquant
Location loc = locationRepo.findById(id).orElseThrow();   // IDOR !   // cherche l'objet par son seul numero, sans verifier le proprietaire : FAILLE
// SÛR : on vérifie l'appartenance
Location loc = locationRepo.findByIdAndClient(id, u).orElseThrow(); // 404 si pas à lui   // exige numero ET proprietaire = u ; sinon orElseThrow -> 404</pre>

<h3>5. Le test d'accès croisé — le plus important</h3>
<p>Un <strong>test automatique</strong> est un petit programme qui vérifie tout seul une promesse du code et vire au rouge si elle est violée. <code>@Test</code> marque une telle méthode ; <code>@WithMockUser</code> fait comme si un utilisateur donné (ici A) était connecté. <code>mockMvc</code> est un faux navigateur qui envoie des requêtes sans passer par le réseau. Le <em>test d'accès croisé</em> fait tenter à A d'ouvrir l'objet de B, et exige un 404.</p>
<pre class="pseudo">@Test @WithMockUser(username = "a@ludo.fr")                    // @Test : test automatique ; @WithMockUser : on se fait passer pour le client A
void clientNeVoitPasLesLocationsDautrui() throws Exception {   // scenario : A ne doit PAS voir les locations de B
    mockMvc.perform(get("/locations/" + locationDeB.getId()))  // faux navigateur : A demande l'URL de la location appartenant a B
        .andExpect(status().isNotFound());     // A ne voit pas l'objet de B   // on EXIGE un 404 : le test rougit si A parvient a lire l'objet de B
}</pre>
<div class="warn">Le test d'accès croisé (A tente l'objet de B) est le seul qui prouve l'absence d'IDOR. Écrit AVEC la fonctionnalité, il tourne à chaque commit : la faille ne peut plus s'installer sans un job rouge. Masquer le bouton dans l'interface ne protège rien — la protection est côté serveur, sur la donnée.</div>
<div class="tip">Renvoyer 404 (et non 403) sur une ressource qui n'appartient pas à l'utilisateur évite en plus de révéler qu'elle existe. Rôle ET ressource, contrôlés côté serveur, testés par accès croisé : c'est la parade complète à la faille la plus répandue du web.</div>`,
  exercises: [
    { type: "qcm", q: "Authentifié signifie…", opts: ["Autorisé à tout", "Identifié — mais pas forcément autorisé", "Admin", "Rien"], a: 1, exp: "Deux notions distinctes." },
    { type: "qcm", q: "L'IDOR, c'est…", opts: ["Un chiffrement", "Accéder à l'objet d'un autre via son id", "Un rôle", "Un cookie"], a: 1, exp: "OWASP A01." },
    { type: "qcm", q: "@PreAuthorize(\"hasRole('VENDEUR')\") contrôle…", opts: ["La ressource", "Le rôle (le droit d'agir)", "Le CSS", "La base"], a: 1, exp: "403 sinon." },
    { type: "qcm", q: "findByClient(u) contrôle…", opts: ["Le rôle", "La ressource (filtrée par l'utilisateur courant)", "Le cache", "Rien"], a: 1, exp: "SON objet." },
    { type: "qcm", q: "findById(idDeL_URL) sans vérif est…", opts: ["Sûr", "Vulnérable à l'IDOR", "Rapide", "Chiffré"], a: 1, exp: "N'importe qui lit n'importe quoi." },
    { type: "qcm", q: "La parade : findByIdAndClient(id, u) renvoie…", opts: ["Toujours l'objet", "404 si l'objet n'est pas à lui", "Une erreur 500", "Le rôle"], a: 1, exp: "Appartenance vérifiée." },
    { type: "qcm", q: "Le test d'accès croisé vérifie…", opts: ["Le CSS", "Que A ne voit pas l'objet de B", "La vitesse", "Le port"], a: 1, exp: "Preuve anti-IDOR." },
    { type: "qcm", q: "Masquer le bouton dans l'UI…", opts: ["Protège la donnée", "Ne protège rien (contrôle côté serveur)", "Suffit", "Chiffre"], a: 1, exp: "Sécurité serveur." },
    { type: "qcm", q: "Renvoyer 404 plutôt que 403 évite…", opts: ["Rien", "De révéler que la ressource existe", "Le login", "Le cache"], a: 1, exp: "Discrétion." },
    { type: "qcm", q: "Rôle ET ressource, c'est…", opts: ["Redondant", "Les deux contrôles nécessaires", "Un seul suffit", "Décoratif"], a: 1, exp: "Peut-il agir ? sur SON objet ?" },
    { type: "vf", q: "Le contrôle d'accès cassé est la faille n°1 (OWASP A01).", a: true, exp: "Très répandue." },
    { type: "qcm", q: "@AuthenticationPrincipal fournit…", opts: ["L'URL", "L'utilisateur connecté", "Le rôle brut", "Le cookie"], a: 1, exp: "Le principal courant." },
    { type: "qcm", q: "Le test croisé tourne…", opts: ["Une fois", "À chaque commit (CI)", "En prod seulement", "Jamais"], a: 1, exp: "Filet permanent." },
    { type: "qcm", q: "@PreAuthorize bloque…", opts: ["Après la méthode", "Avant même d'entrer dans la méthode", "En base", "Jamais"], a: 1, exp: "403 en amont." },
    { type: "vf", q: "Écrire le test d'accès croisé avec la fonctionnalité empêche l'IDOR de s'installer.", a: true, exp: "Par conception." }
  ],
  final: {
    title: "Exercice final — Rôle + ressource, testés",
    intro: `<p>Les deux contrôles + le test croisé.</p>`,
    questions: [
      { type: "qcm", q: "Le droit d'agir se contrôle par :", opts: ["@PreAuthorize(hasRole)", "un if dans le template", "le menu masqué", "rien"], a: 0, exp: "Par rôle." },
      { type: "qcm", q: "L'appartenance se contrôle par :", opts: ["findByIdAndClient(id, u)", "findById(id)", "l'id d'URL de confiance", "un cookie"], a: 0, exp: "Par ressource." },
      { type: "qcm", q: "L'IDOR se prouve absent par :", opts: ["un test d'accès croisé", "un screenshot", "la bonne foi", "un WAF"], a: 0, exp: "A tente l'objet de B." },
      { type: "qcm", q: "Sur un objet qui n'est pas à lui, on renvoie :", opts: ["404 (ne révèle pas l'existence)", "200", "le SQL", "500"], a: 0, exp: "Discret." },
      { type: "vf", q: "Rôle ET ressource sont tous deux nécessaires.", a: true, exp: "Peut-il agir ? sur SON objet ?" }
    ],
    solution: `<pre class="pseudo">@PreAuthorize("hasRole('VENDEUR')")             // par ROLE : n'entre ici que si l'utilisateur est VENDEUR (sinon 403)
@PostMapping("/gestion/jeux") ... creerJeu(...)   // creation d'un jeu, reservee au vendeur

@GetMapping("/mes-locations")                    // par RESSOURCE : lecture de SES propres locations
List<Location> mes(@AuthenticationPrincipal Utilisateur u){   // u = l'utilisateur connecte, injecte par Spring
  return locationRepo.findByClient(u);           // ne renvoie que les locations dont le client est u
}
// findByIdAndClient(id, u) -> 404 si pas à lui (anti-IDOR)   // acces par id securise : exige numero ET proprietaire

@Test @WithMockUser("a@ludo.fr")                 // test : on se fait passer pour le client A
void aNeVoitPasB(){ get("/locations/"+locB.getId()) -> isNotFound(); }   // A tente l'objet de B -> on exige 404 (preuve anti-IDOR)</pre>
<p>L'IDOR est fermé. Demain : louer — transaction et test d'intégration.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton autorisation et son test croisé…",
  items: [
  { id: "proj6java-l10", title: "Autorisation par rôle et par ressource, prouvée", level: 3,
    statement: "Écris un endpoint réservé au VENDEUR (@PreAuthorize), un endpoint 'mes locations' filtré par l'utilisateur courant, la version SÛRE d'un accès par id (findByIdAndClient), et le test d'accès croisé qui prouve l'absence d'IDOR. Explique en 3-4 lignes pourquoi masquer le bouton ne suffit pas et pourquoi 404 plutôt que 403.",
    hints: [
      "@PreAuthorize(\"hasRole('VENDEUR')\") pour le rôle ; @AuthenticationPrincipal pour l'utilisateur.",
      "SÛR : findByIdAndClient(id, u).orElseThrow() -> 404 si l'objet n'est pas à lui.",
      "Test : @WithMockUser d'un client A qui tente l'objet de B -> isNotFound()."
    ],
    solution: "// PAR ROLE : le droit d'agir\n@PreAuthorize(\"hasRole('VENDEUR')\")\n@PostMapping(\"/gestion/jeux\")\npublic JeuDto creerJeu(@Valid @RequestBody JeuForm form) {\n    return jeuService.creer(form);       // un CLIENT ici -> 403 avant d'entrer\n}\n\n// PAR RESSOURCE : sur SON objet\n@GetMapping(\"/mes-locations\")\npublic List<Location> mesLocations(@AuthenticationPrincipal Utilisateur u) {\n    return locationRepo.findByClient(u); // filtre par l'utilisateur COURANT\n}\n\n// Acces par id, version SURE (anti-IDOR)\n@GetMapping(\"/locations/{id}\")\npublic Location voir(@PathVariable Long id, @AuthenticationPrincipal Utilisateur u) {\n    return locationRepo.findByIdAndClient(id, u)   // 404 si pas a lui\n        .orElseThrow(EntityNotFoundException::new);\n}\n\n// LE TEST QUI COMPTE : acces croise\n@Test @WithMockUser(username = \"a@ludo.fr\")\nvoid clientNeVoitPasLesLocationsDautrui() throws Exception {\n    mockMvc.perform(get(\"/locations/\" + locationDeB.getId()))\n        .andExpect(status().isNotFound());\n}\n\n// POURQUOI MASQUER LE BOUTON NE SUFFIT PAS, POURQUOI 404\n// Le bouton cache n'existe que dans le HTML : un attaquant appelle l'URL\n// directement (curl, Postman) sans passer par l'interface. La seule vraie\n// protection est cote SERVEUR, sur la donnee (findByIdAndClient). On renvoie\n// 404 et non 403 car un 403 confirmerait que la location 42 EXISTE (elle\n// appartient a quelqu'un) : le 404 ne revele meme pas son existence.\n// Rôle + ressource + test croise = parade complete a l'IDOR (OWASP A01).",
    note: "L'IDOR est à la fois la faille la plus répandue et la plus facile à ignorer, parce qu'en test manuel avec son propre compte, tout fonctionne. Seul le test d'accès CROISÉ (un utilisateur qui tente l'objet d'un autre) la révèle. En l'écrivant avec la fonctionnalité, on le rend permanent : la CI relance ce test à chaque commit, et personne ne peut réintroduire la faille sans casser le build. C'est le cœur du secure by design appliqué à l'autorisation." }
  ]
};
</script>
