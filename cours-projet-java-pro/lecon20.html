<script>
var DAY = {
  num: 20,
  title: "Observabilité, sauvegardes, RGPD et rollback",
  subtitle: "Les filets de la vie en production — un logiciel exploité, pas juste livré.",
  theory: `
<h3>1. Observer</h3>
<p><strong>Observer</strong>, c'est savoir ce que fait le programme une fois en ligne, puisqu'on ne peut plus l'inspecter pas à pas. On <strong>journalise</strong> (on écrit dans un <em>journal</em>) les événements importants via un <code>Logger</code>, comme le carnet de bord d'un navire. Règle d'or : jamais de secret ni de donnée personnelle brute dans ces journaux. En conteneur, le journal part sur la <strong>sortie standard</strong> (<em>stdout</em>, la sortie texte par défaut) que Docker collecte.</p>
<pre class="pseudo">private static final Logger log = LoggerFactory.getLogger(JeuService.class);   // cree le journal (logger) pour cette classe
// événements de sécurité et métier, SANS secret ni donnée perso brute
log.info("location jeu={} client={}", jeuId, client.getId());   // après commit
log.warn("echec de connexion ip={}", ip);   // niveau WARN : un evenement anormal (echec de connexion) a surveiller
// Actuator : /actuator/health, /actuator/metrics (exposition RESTREINTE en prod)
// en conteneur : logs sur stdout, collectés par Docker</pre>

<h3>2. Sauvegarder (chiffré, testé)</h3>
<p>Une <strong>sauvegarde</strong> (backup) est une copie de la base mise de côté pour survivre à une perte. <code>mysqldump</code> exporte tout le contenu de la base dans un fichier. On le <strong>chiffre</strong> aussitôt avec <code>gpg</code> (rendre illisible sans la clé), et l'on range la clé de déchiffrement <em>ailleurs</em>. Surtout : on <strong>teste</strong> régulièrement la restauration — une sauvegarde jamais restaurée n'est qu'un espoir.</p>
<pre class="pseudo">docker compose exec bdd mysqldump -uroot -p... ludotheque \\
  | gpg --encrypt --recipient sauvegarde@ludo > backup-\$(date +%F).sql.gpg   # exporte toute la base, la chiffre, et l'ecrit dans un fichier date
# clé de déchiffrement stockée SÉPARÉMENT ; restauration TESTÉE régulièrement
# une sauvegarde jamais restaurée n'est qu'un espoir.</pre>

<h3>3. Respecter les données (RGPD)</h3>
<p>Le <strong>RGPD</strong> est la loi européenne sur la protection des données personnelles. Elle donne des droits qui se traduisent en <em>code</em> : le droit d'accès/<strong>portabilité</strong> (récupérer ses données dans un format réutilisable), le droit à l'<strong>effacement</strong>, et la <strong>minimisation</strong> (ne stocker que le strict nécessaire). <strong>Anonymiser</strong>, c'est retirer l'identité tout en gardant les statistiques.</p>
<pre class="pseudo">public String exporterMesDonnees(Utilisateur u) {        // droit d'accès / portabilité
    return json(donneesPersonnelles(u));                 // renvoie les donnees de l'utilisateur au format JSON (reutilisable)
}
@Transactional                                           // tout ou rien : anonymisation ET suppression ensemble
public void supprimerMonCompte(Utilisateur u) {          // droit à l'effacement
    locationService.anonymiser(u);    // garder les stats, retirer l'identité
    utilisateurRepo.delete(u);                           // supprime definitivement le compte de la base
}
// minimisation (pas de carte stockée) + durées de conservation (purge planifiée)</pre>

<h3>4. Pouvoir revenir (rollback)</h3>
<pre class="pseudo"># la version déployée se comporte mal :
# .env.version : VERSION=1.0.0 (précédente) ; docker compose pull && up -d
# l'image 1.0.0 existe toujours au registre (immuable) -> < 5 min
# ⚠ migrations compatibles N-1 : le schéma de N reste lisible par le code N-1</pre>

<h3>5. La production est un état à tenir</h3>
<pre class="pseudo">observer (logs, santé) · sauvegarder (chiffré, testé) ·
respecter (RGPD) · revenir (rollback N-1)
Ces filets, appris séparément (Docker/CI-CD/Sécurité), tous en place ici.</pre>
<div class="warn">Le rollback applicatif est trivial grâce à l'immuabilité des images ; le vrai sujet est le <strong>schéma</strong>. Avec Flyway, la règle N-1 (le schéma de la version N reste compatible avec le code N-1) se traduit en migrations additives : on ajoute une colonne (V+1), on bascule (V+2), on supprime l'ancienne (V+3). Une rupture se fait alors en trois versions, jamais d'un coup.</div>
<div class="tip">Livrer n'est pas la fin : un logiciel se tient. Observer pour comprendre, sauvegarder pour survivre à une perte, respecter les données par obligation et par éthique, revenir vite quand ça dérape. Ces réflexes, disséminés dans les cours d'outillage, forment ici un tout cohérent sur un même projet.</div>`,
  exercises: [
    { type: "qcm", q: "En production, on comprend ce qui se passe grâce…", opts: ["Au debugger", "Aux logs (sur stdout, collectés) + Actuator", "À la RAM", "Au hasard"], a: 1, exp: "Le debugger n'existe plus en prod." },
    { type: "qcm", q: "On ne journalise JAMAIS…", opts: ["L'événement", "Mots de passe, jetons, données perso brutes", "L'horodatage", "L'IP"], a: 1, exp: "Fuite par les logs." },
    { type: "qcm", q: "Le log de succès d'une location se place…", opts: ["Avant la transaction", "Après le commit", "Dans le template", "Jamais"], a: 1, exp: "Pas de location annulée journalisée." },
    { type: "qcm", q: "Une sauvegarde doit être…", opts: ["En clair sur un partage", "Chiffrée, clé séparée, restauration testée", "Supprimée", "Publique"], a: 1, exp: "Autant de soin que la base." },
    { type: "qcm", q: "Une sauvegarde jamais restaurée est…", opts: ["Fiable", "Un espoir, pas une garantie", "Chiffrée", "Inutile"], a: 1, exp: "Tester la restauration." },
    { type: "qcm", q: "Le droit d'accès (RGPD) se traduit par…", opts: ["Une mention CGU", "Une fonction d'export des données", "Rien", "Un cookie"], a: 1, exp: "Du code." },
    { type: "qcm", q: "Le droit à l'effacement demande souvent…", opts: ["La suppression brute toujours", "L'anonymisation (retirer l'identité, garder les stats)", "De chiffrer", "De publier"], a: 1, exp: "Intégrité préservée." },
    { type: "qcm", q: "Le rollback applicatif consiste à…", opts: ["Rebuild en urgence", "Redéployer le tag précédent (image immuable)", "Restaurer le serveur", "Éteindre"], a: 1, exp: "< 5 min." },
    { type: "qcm", q: "Le vrai sujet du rollback :", opts: ["Le code", "Le schéma déjà migré (règle N-1)", "Le DNS", "Les secrets"], a: 1, exp: "Découpler code et base." },
    { type: "qcm", q: "La règle N-1 avec Flyway :", opts: ["Ne jamais migrer", "Migrations additives : ajouter, basculer, supprimer", "Deux bases", "Un backup par heure"], a: 1, exp: "Reculer d'une version ne casse rien." },
    { type: "vf", q: "Une rupture de schéma se fait en plusieurs versions, jamais d'un coup.", a: true, exp: "Additif puis bascule." },
    { type: "qcm", q: "En conteneur, les logs vont…", opts: ["Dans un fichier", "Sur stdout, collectés par Docker", "En base", "Nulle part"], a: 1, exp: "docker logs les lit." },
    { type: "qcm", q: "La minimisation (RGPD) :", opts: ["Tout stocker", "Ne pas stocker l'inutile (ex. pas de carte)", "Chiffrer tout", "Dupliquer"], a: 1, exp: "Moins de surface." },
    { type: "qcm", q: "La production est…", opts: ["La fin", "Un état à tenir (observer, sauvegarder, respecter, revenir)", "Optionnelle", "Un test"], a: 1, exp: "Logiciel exploité." },
    { type: "vf", q: "Ces filets, appris séparément, sont tous en place sur un même projet.", a: true, exp: "L'aboutissement du Niveau 8." }
  ],
  final: {
    title: "Exercice final — Les filets de la production",
    intro: `<p>On installe observabilité, sauvegardes, RGPD et rollback.</p>`,
    questions: [
      { type: "qcm", q: "Les logs :", opts: ["Événements sans secret, après commit", "avec les mots de passe", "en fichier local éditable", "aucun"], a: 0, exp: "Utile sans trahir." },
      { type: "qcm", q: "Les sauvegardes :", opts: ["Chiffrées, clé séparée, restauration testée", "en clair", "supprimées", "publiques"], a: 0, exp: "Base complète sinon." },
      { type: "qcm", q: "Le droit à l'effacement :", opts: ["Anonymiser + supprimer l'identité", "tout garder", "chiffrer", "rien"], a: 0, exp: "Stats préservées." },
      { type: "qcm", q: "Le rollback :", opts: ["Redéployer le tag précédent (< 5 min)", "rebuild", "restaurer le serveur", "prier"], a: 0, exp: "Image immuable." },
      { type: "vf", q: "La règle N-1 découple le rollback du code de celui du schéma.", a: true, exp: "Rupture en plusieurs versions." }
    ],
    solution: `<pre class="pseudo">// Observabilité : logs structurés (après commit, sans secret)
log.info("location jeu={} client={}", jeuId, client.getId());   // journalise l'evenement metier (identifiants, pas de donnee sensible)

# Sauvegarde chiffrée, clé séparée, restauration testée
docker compose exec bdd mysqldump ... | gpg --encrypt -r sauvegarde@ludo > backup.sql.gpg   # exporte la base puis la chiffre dans un fichier

// RGPD
@Transactional void supprimerMonCompte(Utilisateur u){   // droit a l'effacement (transaction : tout ou rien)
  locationService.anonymiser(u); utilisateurRepo.delete(u);   // retire l'identite (garde les stats) puis supprime le compte
}
# Rollback : VERSION=1.0.0 (précédent) + pull + up -d (migrations Flyway N-1)</pre>
<p>Les filets sont en place. Demain : l'examen — le projet professionnel de bout en bout.</p>`
  }
};

    solution: "PLAN D'EXPLOITATION — Ludothèque pro\n\nOBSERVABILITE\n- Journaliser (SLF4J) : connexions (reussies/echouees), changements de role,\n  actions sensibles (achat, suppression), erreurs. Sur stdout (collecte par Docker).\n- JAMAIS : mots de passe, jetons, cookies, donnees personnelles brutes.\n- Actuator : /actuator/health (sonde), /actuator/metrics (exposition restreinte).\n- Surveiller : taux d'erreurs, temps de reponse, memoire JVM.\n\nSAUVEGARDES\n- mysqldump chiffre (gpg), cle stockee SEPAREMENT de la sauvegarde.\n- Planifiees (quotidiennes) + restauration TESTEE une fois par mois sur un\n  environnement jetable (une sauvegarde non restauree n'est qu'un espoir).\n\nRGPD (3 fonctions implementees)\n1. exporterMesDonnees(u) -> JSON reutilisable (acces + portabilite)\n2. supprimerMonCompte(u) -> anonymise les locations, retire l'identite\n3. purgePlanifiee() -> anonymise/purge au-dela des durees de conservation\n+ minimisation : pas de carte bancaire stockee (paiement delegue).\n\nROLLBACK + REGLE N-1 (via Flyway)\n- Rollback : .env.version -> tag precedent, docker compose pull && up -d\n  (l'image precedente existe toujours au registre). < 5 min.\n- Migrations compatibles N-1 : le schema de la version N reste lisible par le\n  code N-1. Exemple — renommer nb_jours en duree_jours :\n    V12 : AJOUTER duree_jours (nullable), le code ecrit les DEUX champs\n    V13 : LIRE duree_jours (les deux restent synchrones)\n    V14 : SUPPRIMER nb_jours (plus aucune version deployee ne le lit)\n  -> a chaque etape, reculer d'UNE version ne casse rien.\n\nLa production est un ETAT (a observer, sauvegarder, proteger, restaurer),\npas un evenement ponctuel qu'on oublie apres le deploiement.",
