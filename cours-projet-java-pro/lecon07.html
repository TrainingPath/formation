<script>
var DAY = {

  title: "L'API REST (Spring MVC) et le job de tests au vert",
  subtitle: "On ouvre le catalogue en API — et l'usine de tests devient complète.",
  theory: `
<h3>1. Un DTO, pas l'entité</h3>
<pre class="pseudo">public record JeuDto(Long id, String titre, BigDecimal prixLocation, boolean louable) {}   // record = petite fiche immuable de transport ; ne montre QUE ces 4 informations</pre>
<p>Avant tout, deux mots. Une <strong>API REST</strong> est la porte d'entrée par laquelle d'autres programmes (un site, une appli mobile) demandent des données à notre serveur, le plus souvent au format <strong>JSON</strong> — un texte structuré fait de paires « nom : valeur ». Un <strong>DTO</strong> (<em>Data Transfer Object</em>, objet de transfert) est une fiche sur mesure décrivant exactement ce qu'on veut envoyer ; un <strong>record</strong> est la façon courte, en Java, d'écrire une telle fiche immuable. On n'expose <strong>jamais</strong> l'entité JPA directement : le DTO choisit ce qui sort (pas de champ interne, pas de relation lourde) et découple le contrat d'API du schéma de base.</p>

<h3>2. Le contrôleur</h3>
<pre class="pseudo">@RestController                                              // etiquette : cette classe repond aux requetes web en renvoyant du JSON
@RequestMapping("/api/jeux")                                 // toutes ses URL commencent par /api/jeux
public class JeuController {
    private final JeuRepository repo;                        // dependance vers la base
    public JeuController(JeuRepository repo) { this.repo = repo; }   // injection par constructeur

    @GetMapping                                              // repond aux requetes GET (lecture) sur /api/jeux
    public List<JeuDto> lister() {                           // renvoie la liste des jeux, transformes en DTO
        return repo.findAllWithCategorie().stream()          // recupere jeux + categorie en 1 requete, puis ouvre un flux (stream)
            .map(j -> new JeuDto(j.getId(), j.getTitre(), j.getPrixLocation(), j.estLouable()))   // transforme chaque entite en fiche DTO
            .toList();                                       // rassemble le tout en une liste
    }
}</pre>
<p>Décryptons le contrôleur. <code>@RestController</code> désigne la classe qui répond aux requêtes web en renvoyant directement des données. <code>@RequestMapping("/api/jeux")</code> fixe l'adresse commune, et <code>@GetMapping</code> précise qu'on répond aux demandes de <em>lecture</em> (le verbe HTTP GET). Le <code>stream()</code> ouvre un « tapis roulant » sur la liste, <code>map(...)</code> transforme chaque élément au vol (ici entité → DTO), et <code>toList()</code> récupère le résultat final.</p>

<h3>3. Éviter le N+1 dès l'API</h3>
<pre class="pseudo">@Query("select j from Jeu j join fetch j.categorie order by j.titre")   // requete ecrite a la main : charge le jeu ET sa categorie ensemble (join fetch)
List<Jeu> findAllWithCategorie();                                       // methode qui execute cette requete</pre>
<p>Petite définition : le <strong>N+1</strong> est un piège de performance où obtenir une liste de N éléments déclenche 1 requête pour la liste, puis 1 requête <em>par</em> élément — soit N+1 allers-retours vers la base, très lents. <code>@Query</code> permet d'écrire soi-même la requête (en JPQL, un langage proche du SQL mais orienté objets). Sans <code>join fetch</code>, chaque accès à <code>j.getCategorie()</code> déclencherait une requête (le fameux N+1). On charge donc tout en une seule — réflexe posé dès l'ouverture de l'API.</p>

<h3>4. Le test d'intégration MockMvc</h3>
<pre class="pseudo">@SpringBootTest                                             // demarre l'application complete pour le test
@AutoConfigureMockMvc                                       // prepare un faux navigateur (MockMvc) pour taper l'API sans reseau reel
class JeuApiTest {
    @Autowired MockMvc mockMvc;                             // @Autowired = Spring fournit l'outil MockMvc tout pret
    @Test void listeLesJeux() throws Exception {            // scenario : lister les jeux
        mockMvc.perform(get("/api/jeux"))                  // envoie une requete GET sur /api/jeux
            .andExpect(status().isOk())                    // on EXIGE le code 200 (succes)
            .andExpect(jsonPath("$[0].titre").exists());   // on EXIGE que le 1er jeu du JSON possede bien un champ "titre"
    }
}</pre>
<p><code>MockMvc</code> est un faux navigateur : il envoie des requêtes à l'API et vérifie les réponses sans passer par le vrai réseau. <code>@SpringBootTest</code> démarre l'application entière pour le test, et <code>jsonPath</code> pointe un endroit précis dans le JSON reçu (ici le titre du premier jeu) afin de l'inspecter.</p>

<h3>5. Le job de tests complet, avec MySQL</h3>
<pre class="pseudo"># ci.yml
  tests:                                    # 2e travail du pipeline : les tests avec une vraie base
    runs-on: ubuntu-latest                  # sur une machine Linux neuve
    services:                               # conteneurs annexes lances a cote du job
      mysql:                                # une base MySQL jetable, le temps des tests
        image: mysql:8.4                    # image officielle MySQL 8.4
        env: { MYSQL_DATABASE: ludotheque, MYSQL_ROOT_PASSWORD: ci }   # base a creer + mot de passe (jetable, non secret ici)
        ports: ["3306:3306"]               # rend la base joignable sur le port 3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=10   # attend qu'elle soit PRETE avant les tests
    steps:
      - uses: actions/checkout@v4           # recupere le code du depot
      - uses: actions/setup-java@v4         # installe Java 21 (Temurin) + cache Maven
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify                  # compile et lance TOUS les tests (unitaires + integration)
        env: { SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/ludotheque" }   # dit a l'app d'utiliser la base jetable du job</pre>
<div class="warn">Le service MySQL de la CI (cours CI/CD leçon 10) rejoue les migrations Flyway sur une base neuve à chaque commit : les tests d'intégration s'exécutent contre le vrai moteur, pas une base mémoire qui divergerait. La base est jetable, recréée à chaque exécution.</div>
<div class="tip"><strong>Fin de semaine 1.</strong> L'usine est complète AVANT que l'application ne soit finie : entités, service et API existent, chacun sous tests, et le pipeline (compile + Spotless + tests avec MySQL) tourne au vert à chaque commit. On peut désormais empiler le métier en confiance — chaque ajout naîtra testé et surveillé.</div>`,

    { type: "qcm", q: "La base de la CI est…", opts: ["La prod", "Jetable, recréée à chaque exécution", "Permanente", "Manuelle"], a: 1, exp: "Migrations rejouées de zéro." },
    { type: "qcm", q: "Le record JeuDto est…", opts: ["Une entité", "Un type immuable de transport", "Un service", "Un test"], a: 1, exp: "Contrat de sortie." },
    { type: "qcm", q: "En fin de semaine 1, l'usine est…", opts: ["Inexistante", "Complète avant que l'app soit finie", "En prod", "Optionnelle"], a: 1, exp: "Outillage d'abord." },

    { type: "qcm", q: "@GetMapping sur /api/jeux répond à…", opts: ["POST", "GET (lecture)", "DELETE", "Rien"], a: 1, exp: "Lister le catalogue." },

  ],
