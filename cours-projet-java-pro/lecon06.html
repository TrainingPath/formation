  title: "La couche service et les règles métier, sous CI",
  subtitle: "Les décisions du métier, isolées et testées en millisecondes (Mockito).",
  theory: `
<h3>1. Pourquoi une couche service</h3>
<p>Les entités portent l'état, les repositories l'accès aux données. Les <strong>décisions</strong> (peut-on louer ? quel tarif ?) vivent dans une couche <code>@Service</code> : testable isolément, réutilisable par l'API et le frontend, indépendante de la base.</p>
<p>Une <strong>couche</strong> est un étage de l'application aux responsabilités bien délimitées, comme les rayons d'un magasin : on sait où trouver quoi. <code>@Service</code> est l'étiquette qui range une classe dans l'étage des décisions métier. Y isoler les règles les rend faciles à tester (sans la base) et partageables par l'API et le frontend.</p>

<h3>2. Une exception métier explicite</h3>
<pre class="pseudo">public class StockInsuffisantException extends RuntimeException {   // notre erreur metier ; "extends" = herite du modele d'erreur Java
    public StockInsuffisantException(String message) { super(message); }   // constructeur : transmet le message au parent (super)
}</pre>
<p>Une <strong>exception</strong> est un signal d'alerte qu'un code lance lorsqu'il rencontre une situation anormale ; il interrompt le cours normal jusqu'à ce que quelqu'un le rattrape. Ici on crée notre propre exception au nom parlant, plutôt qu'un <code>IllegalStateException</code> anonyme : l'intention se lit, et le <code>@RestControllerAdvice</code> (leçon 8) la traduira en code d'erreur HTTP 409.</p>

<h3>3. Le service</h3>
<pre class="pseudo">@Service                                                        // etiquette : classe qui porte les decisions metier (couche service)
public class JeuService {
    private final JeuRepository repo;                           // le repository dont le service a besoin (final = fixe une fois pour toutes)
    public JeuService(JeuRepository repo) { this.repo = repo; } // injection : Spring fournit le repository via le constructeur

    public void verifierStockLocation(Jeu jeu) {                // regle : refuser la location s'il n'y a plus de stock
        if (jeu.getStockLocation() <= 0)                       // si le stock location est nul ou negatif...
            throw new StockInsuffisantException("Plus de stock pour " + jeu.getTitre());   // ...on leve (declenche) l'erreur metier
    }
    public BigDecimal prixLocation(Jeu jeu, int nbJours) {      // calcule le prix pour une duree donnee
        BigDecimal base = jeu.getPrixLocation();               // tarif de base du jeu
        return nbJours <= 7 ? base                             // jusqu'a 7 jours : prix de base (? : = "si...alors...sinon")
             : base.add(BigDecimal.valueOf(nbJours - 7).multiply(new BigDecimal("0.50")));   // au-dela : +0,50 par jour supplementaire
    }
}</pre>
<p><strong>L'injection par constructeur</strong> consiste à recevoir ses dépendances de l'extérieur (Spring les « injecte ») au lieu de les fabriquer soi-même avec <code>new</code>. Avantage décisif : en test, on peut injecter une fausse version. Le mot <code>final</code> garantit que cette dépendance, une fois reçue, ne changera plus. L'opérateur <code>? :</code> (ternaire) est un « si… alors… sinon » condensé sur une seule ligne.</p>

<h3>4. Le test unitaire rapide (Mockito)</h3>
<pre class="pseudo">@ExtendWith(MockitoExtension.class)                            // active Mockito, l'outil qui fabrique de faux objets pour les tests
class JeuServiceTest {
    @Mock JeuRepository repo;                                  // faux repository (une doublure : ne touche pas la base)
    @InjectMocks JeuService service;                           // le service a tester, avec la doublure injectee dedans

    @Test void tarifProlongation() {                           // scenario : verifier le calcul de prolongation
        Jeu j = new Jeu(); j.setPrixLocation(new BigDecimal("5.00"));   // un jeu a 5,00 de base
        assertThat(service.prixLocation(j, 10)).isEqualByComparingTo("6.50");   // 10 jours -> 5 + 3x0,50 = 6,50 (compareTo, pas equals)
    }
    @Test void refuseSiStockNul() {                            // scenario : verifier le refus quand stock = 0
        Jeu j = new Jeu(); j.setStockLocation(0);             // un jeu sans stock location
        assertThatThrownBy(() -> service.verifierStockLocation(j))   // on execute la methode et on capture l'erreur (() -> = mini-fonction)
            .isInstanceOf(StockInsuffisantException.class);   // on EXIGE que ce soit bien notre exception metier
    }
}</pre>
<p>Un <strong>mock</strong> (« doublure ») est un faux objet qui imite un vrai composant le temps du test, comme une doublure au cinéma ; <strong>Mockito</strong> est l'outil qui les fabrique. Ici le repository est mocké : aucune base, aucun démarrage de Spring. Ces tests tournent donc en <strong>millisecondes</strong>.</p>

<h3>5. Comparer des BigDecimal</h3>
<div class="warn">Piège classique : <code>new BigDecimal("6.50").equals(new BigDecimal("6.5"))</code> est <strong>faux</strong> (les échelles diffèrent). Toujours comparer avec <code>compareTo</code> — ou, en test, <code>isEqualByComparingTo</code>. Pour l'argent, on ne prend jamais de raccourci.</div>
<div class="tip">Des tests unitaires en millisecondes, c'est la condition d'une CI < 10 min (cours CI/CD) : plus le projet grossit, plus il est vital que la majorité des tests soient rapides et sans base. On garde les tests d'intégration (avec MySQL) pour ce qui l'exige vraiment (leçon 11).</div>`,

  ],

    ],
    solution: `<pre class="pseudo">@Service class JeuService {                                    // couche des decisions metier

<p>Le métier est isolé et testé. Demain : l'API REST et le job de tests avec MySQL.</p>`
