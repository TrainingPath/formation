<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "Ce qui change au Niveau 8 : on pose les outils AVANT d'écrire la première ligne métier.",
  theory: `
<h3>1. La différence avec le Niveau 6</h3>
<p>Au Niveau 6, tu as construit la Ludothèque « à la main » : l'app d'abord, puis (aux cours d'outillage) les conteneurs, le pipeline et la sécurité. Ici, on inverse : le <strong>dépôt Git</strong>, le <strong>Docker Compose</strong>, le <strong>pipeline CI (Maven)</strong> et la règle « rien n'entre dans main sans CI verte » existent <strong>dès le jour 1</strong>. Chaque fonctionnalité naîtra outillée.</p>
<p>Définissons ces mots-outils, car ils reviendront à chaque leçon. Un <strong>dépôt Git</strong> (ou <em>repository</em>) est l'armoire à archives du projet : il garde chaque version du code et se souvient de qui a changé quoi, comme l'historique des modifications d'un document partagé — on peut toujours revenir en arrière. Un <strong>conteneur</strong> est une boîte-repas scellée qui contient l'application ET tout ce dont elle a besoin pour tourner (bibliothèques, réglages) ; où qu'on l'ouvre, le contenu est identique, ce qui règle le fameux « ça marche chez moi ». <strong>Docker Compose</strong> est la recette qui décrit quelles boîtes lancer ensemble (ici l'app et sa base de données) et comment elles communiquent. <strong>Maven</strong> est le chef de chantier du monde Java : il télécharge les briques nécessaires, assemble le programme et lance les tests, en suivant une liste de courses (le fichier <code>pom.xml</code>). Un <strong>pipeline CI</strong> (<em>intégration continue</em>) est une chaîne de montage automatique : à chaque envoi de code, un robot rejoue tous les tests et refuse le travail s'il casse quelque chose. Enfin <strong>main</strong> est la branche principale, la version « officielle » du projet — comme le manuscrit maître qu'on ne rature jamais directement.</p>

<h3>2. L'arborescence du projet pro</h3>
<pre class="pseudo">src/main/java/fr/ludo/     code : entity, repository, service, web, config
src/main/resources/        application.yml, db/migration (Flyway), templates
src/test/java/fr/ludo/     tests unitaires + intégration
pom.xml                    dépendances + plugins (spotless, jacoco, spring-boot)
Dockerfile                 l'image (multi-stage : build JAR puis runtime JRE)
compose.yaml               app + MySQL, réseau, volume (dev)
.github/workflows/ci.yml   tests + Spotless + build à chaque commit
.gitignore .dockerignore   target/, *.env, application-local.yml</pre>
<p>Quelques mots du tableau ci-dessus méritent leur définition. Un <strong>JAR</strong> est le programme Java empaqueté en un seul fichier prêt à lancer, comme un plat cuisiné mis sous vide. La <strong>JRE</strong> (<em>Java Runtime Environment</em>) est le four minimal capable de réchauffer ce plat : juste ce qu'il faut pour exécuter du Java, sans les ustensiles du développeur. Une <strong>image</strong> Docker est le moule figé à partir duquel on fabrique des conteneurs identiques ; <em>multi-stage</em> (multi-étapes) signifie qu'on cuisine dans une grande cuisine équipée (avec Maven) puis qu'on ne garde que l'assiette finale, pour une image légère. <strong>MySQL</strong> est la base de données : le grand classeur où l'application range durablement ses informations. Un <strong>volume</strong> est un tiroir externe branché sur le conteneur pour que les données survivent même si la boîte est jetée. <strong>Flyway</strong> tient le carnet des modifications de ce classeur (les « migrations »), afin que sa structure évolue de façon ordonnée. L'application n'est donc qu'un dossier parmi d'autres : l'infrastructure (Docker, CI) est elle-même du <strong>code</strong>, versionnée avec le reste.</p>

<h3>3. La « Definition of Done »</h3>
<pre class="pseudo">Une fonctionnalité n'est « faite » que si :
  ✔ le code est écrit
  ✔ ses tests passent (unitaires + intégration)
  ✔ le format est propre (Spotless / Checkstyle)
  ✔ l'image build (rien de cassé côté emballage)
  ✔ la PR est relue et la CI verte
« Ça marche chez moi » ne fait pas partie de la définition.</pre>

<h3>4. Le flux Git d'équipe (GitHub Flow)</h3>
<pre class="pseudo">main toujours déployable — personne n'y committe en direct
1 branche courte par changement (feature/…, fix/…)
push tôt -> pull request -> CI verte + revue -> merge -> branche supprimée</pre>
<p>Traduisons ce vocabulaire d'équipe. Une <strong>branche</strong> est une copie de travail parallèle où l'on bricole un changement sans toucher à la version officielle, comme un brouillon mis de côté. <strong>Committer</strong>, c'est enregistrer une étape de son travail avec une étiquette qui explique ce qu'on a fait. <strong>Pousser</strong> (<em>push</em>), c'est envoyer ces enregistrements sur le serveur partagé pour que l'équipe les voie. Une <strong>pull request</strong> (PR) est une demande officielle : « voici mon brouillon, relisez-le avant de l'intégrer ». <strong>Fusionner</strong> (<em>merge</em>), c'est, une fois la relecture faite et la CI verte, recopier le brouillon validé dans la version officielle <code>main</code>.</p>

<h3>5. Les trois disciplines en parallèle</h3>
<pre class="pseudo">CONSTRUIRE     le métier (entités, services, API, frontend)
INDUSTRIALISER conteneurs, tests, CI, image, pipeline
SÉCURISER      entrées, secrets, auth, RGPD — par conception
À chaque leçon, les trois avancent ENSEMBLE, jamais l'une sans les autres.</pre>
<div class="warn">La tentation reste de « coder d'abord, outiller après ». C'est précisément ce que ce niveau corrige : ajouter les tests, la sécurité ou la conteneurisation à la fin coûte dix fois plus cher (rétrofit) que de les poser au fil de l'eau. Le setup pro du jour 1 est un investissement, pas une perte de temps.</div>
<div class="tip">Prérequis assumés : tu maîtrises déjà Spring Boot (capstone N4), Docker, la CI/CD et la sécurité (N5). Ce cours ne réexplique pas ces briques — il les fait <strong>travailler ensemble</strong> sur un vrai projet.</div>`,
  exercises: [
    { type: "qcm", q: "Au Niveau 8, on pose les outils…", opts: ["À la fin, comme au Niveau 6", "Dès le jour 1, avant le métier", "Jamais", "Seulement en prod"], a: 1, exp: "Construire EN outillant." },
    { type: "qcm", q: "L'infrastructure (Docker, CI) est…", opts: ["Un réglage propre à chaque poste","Du code versionné avec le projet","Une suite d'actions manuelles à répéter","Un paramétrage secret du serveur"], a: 1, exp: "Dockerfile, compose.yaml, ci.yml dans le dépôt." },
    { type: "qcm", q: "Le fichier du pipeline se trouve dans…", opts: [".github/workflows/", "/etc/ci", "le pom.xml", "la base"], a: 0, exp: "Versionné, revu en PR." },
    { type: "qcm", q: "Les secrets (.env, mots de passe) sont…", opts: ["Committés dans le dépôt Git","Hors Git ET hors image","Copiés dans l'image Docker","Écrits en dur dans le code"], a: 1, exp: ".gitignore + .dockerignore + variables d'env." },
    { type: "qcm", q: "La Definition of Done inclut…", opts: ["Le code seul", "Code + tests + Spotless + image + PR relue", "Juste que ça compile", "Rien"], a: 1, exp: "Contrat d'équipe." },
    { type: "qcm", q: "« Ça marche chez moi »…", opts: ["Suffit", "Ne fait pas partie de la définition de fait", "Est un test", "Est la CI"], a: 1, exp: "La CI tranche sur une machine neutre." },
    { type: "qcm", q: "Dans GitHub Flow, main est…", opts: ["Une branche de brouillon", "Toujours déployable, jamais committée en direct", "Supprimée souvent", "Facultative"], a: 1, exp: "Le pivot." },
    { type: "qcm", q: "Un changement part…", opts: ["Directement sur main", "D'une branche courte + PR", "Sans branche", "En prod"], a: 1, exp: "PR obligatoire." },
    { type: "qcm", q: "Les trois disciplines menées en parallèle :", opts: ["Construire, industrialiser, sécuriser", "Coder, tester, dormir", "Analyser, coder, livrer", "Aucune"], a: 0, exp: "Ensemble, à chaque leçon." },
    { type: "qcm", q: "Ajouter la sécurité à la fin (rétrofit)…", opts: ["Ne change presque rien au coût","Coûte bien plus cher que par conception","Reste tout aussi simple à mettre en place","Donne un meilleur résultat qu'en amont"], a: 1, exp: "D'où le « par conception »." },
    { type: "vf", q: "Le Docker Compose et le pipeline existent avant la première fonctionnalité métier.", a: true, exp: "Le setup pro du jour 1." },
    { type: "qcm", q: "L'app Spring Boot, dans l'arborescence, est…", opts: ["Le seul élément du dépôt","Un dossier parmi d'autres (à côté de Dockerfile, ci.yml…)","Rangée en dehors du dépôt","Présente uniquement dans l'image"], a: 1, exp: "L'infra l'entoure." },
    { type: "qcm", q: "Ce cours suppose acquis…", opts: ["Rien", "Spring Boot (N4), Docker, CI/CD et Sécurité (N5)", "Le CSS seul", "L'assembleur"], a: 1, exp: "Il les fait travailler ensemble." },
    { type: "qcm", q: "Les versions de dépendances (pom.xml) doivent être…", opts: ["Figées / gérées (reproductibles)","Choisies au hasard à chaque build","Toujours laissées en 'latest'","Tenues secrètes"], a: 0, exp: "Reproductibilité du build." },
    { type: "vf", q: "Au Niveau 8, chaque fonctionnalité naît testée et surveillée.", a: true, exp: "Le pipeline est là dès le départ." }
  ],
  final: {
    title: "Exercice final — Les fondations posées",
    intro: `<p>On vérifie que le projet démarre « à la pro ».</p>`,
    questions: [
      { type: "qcm", q: "Avant d'écrire du métier, on met en place :", opts: ["Dépôt Git + Compose + pipeline + secrets hors Git", "juste l'app", "un zip", "rien"], a: 0, exp: "Le setup du jour 1." },
      { type: "qcm", q: "Une fonctionnalité est « faite » quand :", opts: ["Code + tests verts + Spotless + image build + PR relue", "elle compile", "on l'a poussée", "on le décide"], a: 0, exp: "Definition of Done." },
      { type: "qcm", q: "main se modifie :", opts: ["Via PR (branche courte, CI verte, revue)", "en direct", "par email", "en prod"], a: 0, exp: "GitHub Flow." },
      { type: "qcm", q: "Les secrets vivent :", opts: ["Hors Git et hors image (variables d'environnement)", "dans le code", "dans l'image", "dans le README"], a: 0, exp: "Par conception." },
      { type: "vf", q: "Métier, industrialisation et sécurité avancent ensemble, à chaque étape.", a: true, exp: "Le fil du Niveau 8." }
    ],
    solution: `<pre class="pseudo">src/main/java/fr/ludo/  src/main/resources/  Dockerfile  compose.yaml
.github/workflows/ci.yml   pom.xml (versions gérées)
secrets hors Git/image     .gitignore  .dockerignore

Definition of Done : code + tests + Spotless + image + PR relue
Flux : branche courte -> PR -> CI verte + revue -> merge sur main
Trois disciplines en parallèle : construire, industrialiser, sécuriser</pre>
<p>Les fondations pro sont posées. Demain : le squelette Spring Boot dans Docker Compose.</p>`
  }
};
</script>
