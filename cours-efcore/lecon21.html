<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : l'ORM maîtrisé (examen)",
  subtitle: "Vingt leçons, une seule épreuve : prouve que tu tiens EF Core de bout en bout, puis franchis la porte du Niveau 6.",
  theory: `
<h3>1. Ce que tu sais faire maintenant</h3>
<p>Cette dernière leçon n'apporte aucune notion neuve : c'est l'<strong>examen récapitulatif</strong> de tout le cours. Recule un instant et mesure le chemin. Tu es entré en sachant écrire du SQL au Niveau 4 ; tu ressors capable de piloter un ORM complet. Tu sais désormais <strong>mapper</strong> des classes vers des tables (leçons 1 à 7), <strong>modéliser toutes les relations</strong> (8 à 12), <strong>interroger</strong> en LINQ et en SQL natif (13 à 16), et <strong>maîtriser transactions et performances</strong> (17 à 20). L'examen balaie ces quatre blocs.</p>
<pre class="pseudo">Bloc 1 — Mapper (1-7)   : ORM, DbContext, DbSet, annotations, migrations,
                          CRUD, change tracker, Fluent API
Bloc 2 — Relier (8-12)  : N-1, 1-N, N-N, 1-1 / owned, Include / ThenInclude
Bloc 3 — Interroger (13-16) : LINQ (Where/OrderBy/Select), agrégats/GroupBy,
                          SQL natif (FromSqlInterpolated), pagination (Skip/Take)
Bloc 4 — Maîtriser (17-20)  : transactions ACID, N+1/AsNoTracking, états/AsSplitQuery,
                          synthèse de la couche de persistance</pre>

<h3>2. Bloc 1 — Mapper : des classes aux tables</h3>
<p>Un <strong>ORM</strong> traduit tes objets en SQL et inversement, pour t'épargner le code répétitif tout en gardant le SQL sous les yeux. Le <strong>DbContext</strong> est la session de travail : il expose un <strong>DbSet&lt;T&gt;</strong> par table, suit les changements et exécute <strong>SaveChanges</strong>. Les <strong>conventions</strong> proposent (Id = clé), les <strong>annotations</strong> corrigent, la <strong>Fluent API</strong> tranche. Toute modification du modèle se propage à la base par une <strong>migration</strong> (dotnet ef migrations add / database update). Le CRUD passe par Add/Find/Remove et une affectation de propriété que le <strong>change tracker</strong> transforme en UPDATE partiel.</p>

<h3>3. Bloc 2 & 3 — Relier et interroger</h3>
<p>Une <strong>relation</strong> se lit des deux côtés : référence (N-1) et collection (1-N), la FK vivant toujours côté « N ». Le N-N se déclare par deux collections croisées (skip navigations) et une table de jointure implicite ; le 1-1 et les owned types complètent le tableau. On charge les relations avec <strong>Include / ThenInclude</strong>. Côté requêtes, <strong>LINQ to Entities</strong> traduit Where, OrderBy, Select et les agrégats/GroupBy en SQL exécuté côté serveur ; l'<strong>exécution différée</strong> (IQueryable) veut qu'on ne matérialise qu'à la fin (ToList). Quand LINQ ne suffit pas, <strong>FromSqlInterpolated</strong> ouvre la porte du SQL natif — paramétré, jamais concaténé. Et on sert les longues listes vingt par vingt avec <strong>Skip / Take</strong> + un OrderBy obligatoire.</p>

<h3>4. Bloc 4 — Maîtriser : transactions et performances</h3>
<p>Un <strong>SaveChanges</strong> est déjà une transaction atomique ; <strong>BeginTransaction</strong> couvre les enchaînements multi-unités (louer un jeu). Le <strong>problème N+1</strong> — une requête plus une par élément dans une boucle — se soigne par Include ou projection ; <strong>AsNoTracking</strong> allège les lectures seules ; <strong>AsSplitQuery</strong> désamorce l'explosion cartésienne. Les <strong>états</strong> du change tracker (Detached, Added, Unchanged, Modified, Deleted) expliquent chaque UPDATE, et le rattachement d'une entité détachée (PUT d'API) exige de choisir sa stratégie pour ne rien écraser. Tout cela s'assemble en une <strong>couche de persistance</strong> propre et étanche.</p>

<h3>5. La passerelle vers le Niveau 6</h3>
<p>Tu tiens maintenant les huit niveaux de ta formation par le milieu : le Niveau 4 t'a donné le SQL et SQL Server, le Niveau 5 (ce cours) t'a donné l'ORM. Le <strong>Niveau 6 — projet full-stack</strong> va tout brancher ensemble : ce LudothequeContext, ces entités et ces requêtes deviendront le cœur d'une <strong>API ASP.NET Core</strong>, avec un front qui consomme le JSON. Chaque endpoint que tu écriras réutilisera ce que tu viens de maîtriser — pagination, projection DTO, transactions, sécurité anti-injection. Et parce que tu as croisé à chaque leçon les équivalents <strong>Hibernate/JPA</strong>, <strong>Eloquent</strong> et <strong>ORM Django</strong>, tu n'es pas seulement un développeur EF Core : tu es un développeur qui comprend <strong>l'idée d'ORM</strong>, transposable partout. Un ORM appris, tous compris.</p>
<div class="warn">Un dernier réflexe à ne jamais perdre, celui qui traverse tout le cours : <strong>regarde le SQL généré</strong>. LogTo et ToQueryString restent tes meilleurs alliés en production. Un développeur qui lit le SQL de son ORM détecte les N+1, les requêtes obèses et les injections avant qu'elles ne coûtent cher. C'est la différence entre subir l'ORM et le maîtriser.</div>
<div class="tip">Réussis cet examen à 20/20, puis relis ta fiche recto-verso de la leçon 20 une dernière fois avant d'ouvrir le Niveau 6. Tu y arriveras avec une couche de persistance déjà en tête — la moitié du projet full-stack est un terrain que tu connais déjà.</div>`,
  exercises: [
    { type: "qcm", q: "Le rôle central du DbContext est…", opts: ["De dessiner l'interface", "D'être la session de travail : exposer les DbSet, suivre les changements, exécuter SaveChanges", "De compiler le C#", "De remplacer SQL Server"], a: 1, exp: "Leçon 2 : le pont entre objets et base, non thread-safe et à courte durée de vie." },
    { type: "qcm", q: "Face à un conflit, la hiérarchie de configuration EF Core est…", opts: ["Conventions &gt; annotations &gt; Fluent", "Fluent API &gt; annotations &gt; conventions", "Annotations &gt; Fluent &gt; conventions", "Tout à égalité"], a: 1, exp: "Leçon 7 : la Fluent API a toujours le dernier mot, les conventions ne sont qu'un défaut." },
    { type: "input", q: "Quelle commande applique les migrations en attente à la base ?", a: ["dotnet ef database update", "database update", "dotnet ef database update "], ph: "La commande…", exp: "Leçon 4 : add crée la migration, database update la joue sur SQL Server." },
    { type: "qcm", q: "Dans une relation 1-N (Jeu → Locations), la clé étrangère vit…", opts: ["Dans la table Jeux", "Dans la table Locations (côté « N »), colonne JeuId", "Dans une table de jointure", "Nulle part, elle est calculée"], a: 1, exp: "Leçons 8-9 : la FK est toujours du côté « plusieurs », comme au Niveau 4." },
    { type: "qcm", q: "ctx.Jeux.Where(j =&gt; j.EstDisponible) renvoie…", opts: ["Une liste de jeux déjà chargée", "Un IQueryable : la requête n'est exécutée qu'à la matérialisation (ToList, First, foreach)", "Une exception", "Le nombre de jeux"], a: 1, exp: "Leçon 13 : exécution différée. Rien ne part avant ToList/First/Count/foreach." },
    { type: "qcm", q: "Pour compter les avis par jeu, la bonne approche est…", opts: ["Une boucle avec jeu.Avis.Count (N+1)", "GroupBy(a =&gt; a.JeuId).Select(g =&gt; new { g.Key, g.Count() })", "Un ToList() de tous les avis puis un tri C#", "FromSqlRaw concaténé"], a: 1, exp: "Leçon 14 : GroupBy + agrégats = ton GROUP BY du Niveau 4, exécuté côté serveur." },
    { type: "vf", q: "FromSqlInterpolated transforme chaque {variable} de la chaîne en paramètre SQL, empêchant l'injection.", a: true, exp: "Leçon 15 : la valeur voyage à part, jamais concaténée dans le texte. La concaténation, elle, injecte." },
    { type: "qcm", q: "Skip((p-1)*t).Take(t) SANS OrderBy préalable…", opts: ["Fonctionne parfaitement", "Produit un ordre non garanti : doublons et trous possibles entre pages", "Est plus rapide", "Trie automatiquement par Id"], a: 1, exp: "Leçon 16 : une table est un ensemble ; sans ORDER BY, la pagination est instable." },
    { type: "vf", q: "Un seul appel à SaveChanges enveloppe toutes ses écritures dans une transaction atomique implicite.", a: true, exp: "Leçon 17 : tout ou rien sans code en plus. Le multiplier casse cette garantie." },
    { type: "qcm", q: "Le problème N+1 se caractérise par…", opts: ["Une erreur de migration", "1 requête pour la liste + N requêtes (une par élément) via une boucle sur une navigation", "Un index dupliqué", "Une injection SQL"], a: 1, exp: "Leçon 18 : 500 éléments → 501 requêtes. Parade : Include ou projection." },
    { type: "input", q: "Quelle méthode désactive le suivi des entités pour accélérer une lecture seule ?", a: ["AsNoTracking", "AsNoTracking()"], ph: "Nom de la méthode…", exp: "Leçon 18 : pas d'instantané du tracker → plus léger et plus rapide, en lecture pure." },
    { type: "qcm", q: "Une entité Jeu désérialisée du JSON dans un PUT d'API est dans l'état…", opts: ["Unchanged", "Detached (le contexte scoped ne l'a jamais vue)", "Modified", "Added"], a: 1, exp: "Leçon 19 : Detached ; il faut la rattacher (Attach/Update/relire) avant SaveChanges." },
    { type: "qcm", q: "AsSplitQuery sert à…", opts: ["Paginer", "Découper un chargement à plusieurs Include de collections en requêtes séparées, contre l'explosion cartésienne", "Chiffrer les données", "Créer un index"], a: 1, exp: "Leçon 19 : plusieurs SELECT légers au lieu d'un JOIN géant multiplicatif." },
    { type: "qcm", q: "La couche de persistance de la Ludothèque regroupe…", opts: ["Le CSS et le HTML", "Entités POCO + LudothequeContext + config Fluent + requêtes", "Uniquement les contrôleurs", "Uniquement les migrations"], a: 1, exp: "Leçon 20 : le socle que consommera l'API du Niveau 6." },
    { type: "vf", q: "Les concepts d'ORM appris ici (entités, contexte, relations, requêtes) se transposent à Hibernate/JPA, Eloquent et Django.", a: true, exp: "Fil rouge du cours : un ORM appris, tous compris. Seule la syntaxe change." }
  ],
  final: {
    title: "Examen final — De l'objet à la couche complète",
    intro: `<p>Cinq questions transversales qui relient plusieurs leçons : c'est le cœur de l'épreuve. Réponds sans revenir en arrière, comme en conditions réelles.</p>`,
    questions: [
      { type: "qcm", q: "Tu dois afficher un catalogue paginé (titre + note moyenne) SANS le ralentir. Tu combines…", opts: ["Include + boucle + trois SaveChanges", "Projection DTO (AVG côté SQL) + Skip/Take + OrderBy stable", "FromSqlRaw concaténé + AsNoTracking", "BeginTransaction + Attach"], a: 1, exp: "Leçons 14+16+18 : la projection agrège côté serveur, la pagination borne le volume, l'OrderBy stabilise." },
      { type: "qcm", q: "Louer le dernier exemplaire d'un jeu, en évitant Stock = -1 avec deux clics simultanés :", opts: ["Trois SaveChanges séparés", "Un SaveChanges atomique + concurrence (UPDATE ... AND Stock &gt; 0, ou rowversion)", "Un FromSqlRaw concaténé", "AsNoTracking sur le jeu"], a: 1, exp: "Leçons 17+19 : atomicité (un SaveChanges) + gestion de la concurrence sur le stock." },
      { type: "vf", q: "Une recherche par titre saisie par l'utilisateur doit passer par un paramètre (LINQ Contains ou FromSqlInterpolated), jamais par une concaténation.", a: true, exp: "Leçon 15 : la concaténation ouvre l'injection SQL ; le paramètre neutralise apostrophes et OR 1=1." },
      { type: "input", q: "Quel réflexe, martelé tout le cours, permet de repérer un N+1 ou une requête obèse avant la production ?", a: ["LogTo", "lire le SQL", "regarder le SQL généré", "ToQueryString", "LogTo()"], ph: "Le réflexe…", exp: "Regarder le SQL généré (LogTo / ToQueryString) : la différence entre subir l'ORM et le maîtriser." },
      { type: "qcm", q: "Le Niveau 6 (projet full-stack) réutilisera cette couche de persistance en…", opts: ["La réécrivant entièrement", "L'injectant (LudothequeContext scoped) dans une API ASP.NET Core dont les endpoints appellent ces requêtes", "La remplaçant par du SQL brut partout", "La supprimant"], a: 1, exp: "Leçons 2+20 : le contexte injecté, les requêtes réutilisées telles quelles derrière des endpoints JSON." }
    ],
    solution: `<pre class="pseudo">RÉCAPITULATIF DU COURS EF CORE — les 20 leçons d'un coup d'œil

MAPPER (1-7)    ORM = pont objets↔SQL · DbContext = session · DbSet par table
                conventions &lt; annotations &lt; Fluent · migrations (add/update)
                CRUD : Add/Find/Remove · change tracker → UPDATE partiel
RELIER (8-12)   FK côté « N » · N-1 (référence) · 1-N (collection)
                N-N (skip navigations + jointure) · 1-1/owned · Include/ThenInclude
INTERROGER (13-16)  LINQ : Where/OrderBy/Select · agrégats/GroupBy (côté serveur)
                IQueryable = exécution différée (ToList matérialise)
                SQL natif : FromSqlInterpolated (paramétré, jamais concaténé)
                pagination : Skip/Take + OrderBy OBLIGATOIRE
MAÎTRISER (17-20)   SaveChanges = transaction atomique · BeginTransaction (multi-unités)
                N+1 → Include/projection · AsNoTracking (lecture seule)
                états du tracker · AsSplitQuery (explosion cartésienne)
                couche de persistance étanche, DbContext scoped

RÉFLEXE PERMANENT : lire le SQL généré (LogTo / ToQueryString)
UNIVERSEL : Hibernate/JPA · Eloquent · Django — un ORM appris, tous compris

═══════════════════════════════════════════════════════════════
FÉLICITATIONS ! Tu as terminé le Niveau 5 — l'ORM est maîtrisé.
Direction le NIVEAU 6 : projet full-stack. Ce LudothequeContext,
ces entités et ces requêtes deviennent le cœur d'une API ASP.NET Core.
Tu n'y arrives pas les mains vides : tu apportes une couche de
persistance complète, propre et performante. À toi de jouer.
═══════════════════════════════════════════════════════════════</pre>
<p>Bravo d'être allé au bout des 21 leçons. Tu es passé de « je sais écrire du SQL » à « je maîtrise un ORM de production » — mapping, relations, requêtes, transactions, performances et sécurité. Range ta fiche de la Ludothèque : au Niveau 6, elle devient ton plan de bataille. Bonne route, développeur full-stack.</p>`
  }
};
</script>

    statement: "Épreuve de synthèse finale. Rédige, comme si tu le présentais à un jury de fin de niveau, ton bilan de maîtrise d'EF Core structuré en quatre blocs : (1) MAPPER — explique avec tes mots ce qu'apporte un ORM par rapport au SQL brut du Niveau 4, et le trio DbContext / DbSet / migrations ; (2) RELIER — décris les quatre types de relations de la Ludothèque et où vit la FK dans chacun ; (3) INTERROGER — oppose LINQ, SQL natif et pagination, en donnant pour chacun un cas d'usage et son piège ; (4) MAÎTRISER — expose transactions, N+1 et AsNoTracking comme les trois piliers de la robustesse. Termine par un paragraphe « et ailleurs » qui montre que ces concepts se transposent à un autre ORM de ton choix, puis un mot sur la façon dont cette couche servira ton projet full-stack du Niveau 6.",

    solution: "BILAN DE MAÎTRISE — EF CORE (NIVEAU 5)\n\n1. MAPPER\n   Au Niveau 4 j'écrivais chaque requête et je transformais à la main les\n   lignes en objets (ADO.NET, DataReader). L'ORM supprime ce code\n   répétitif : je décris des classes, EF génère le SQL et matérialise les\n   objets — sans me cacher le SQL, que je lis au LogTo. Le DbContext est\n   ma session de travail (il suit les changements et exécute SaveChanges),\n   chaque DbSet<T> représente une table, et les migrations (add / database\n   update) propagent toute évolution du modèle vers la base sans que je\n   touche au SQL DDL. La règle de config : conventions < annotations < Fluent.\n\n2. RELIER\n   La FK vit toujours côté « N ».\n   - N-1 : Location → Jeu et Location → Membre (FK JeuId, MembreId dans Location).\n   - 1-N : Jeu → Locations, Jeu → Avis (la même FK, vue depuis le « un »).\n   - N-N : Jeu ↔ Categorie, via une table de jointure (FK des deux côtés,\n     clé primaire composée) que les skip navigations rendent invisible.\n   - 1-1 / owned : un Profil ou une Adresse appartenant à un Membre.\n   On charge ces relations avec Include / ThenInclude.\n\n3. INTERROGER\n   - LINQ (Where/OrderBy/Select, GroupBy) : le cas normal, typé, traduit en\n     SQL côté serveur. Piège : le ToList() prématuré qui bascule le filtre\n     en mémoire (IQueryable → IEnumerable).\n   - SQL natif (FromSqlInterpolated) : pour les rapports complexes et les\n     procédures stockées. Piège : la concaténation = injection SQL ;\n     toujours des paramètres.\n   - Pagination (Skip/Take) : servir les longues listes. Piège : oublier\n     l'OrderBy stable → doublons et trous entre pages.\n\n4. MAÎTRISER\n   Trois piliers de robustesse. Transactions : un SaveChanges est déjà\n   atomique ; BeginTransaction pour les enchaînements multi-unités (louer\n   un jeu). Performance : le N+1 (une requête + N dans une boucle) se\n   repère au LogTo et se corrige par Include ou projection. AsNoTracking\n   allège toute lecture seule. Réflexe transversal : lire le SQL généré.\n\n   ET AILLEURS\n   En Django, ces mêmes idées deviennent models.py + QuerySets :\n   filter() (Where), select_related/prefetch_related (contre le N+1),\n   Paginator (Skip/Take), @transaction.atomic (transactions), raw()\n   (SQL natif). Chez Hibernate/JPA : @Entity, JPQL, JOIN FETCH,\n   @Transactional. La structure de couche est identique, seule la\n   syntaxe change — un ORM appris, tous compris.\n\n   NIVEAU 6\n   Cette couche (LudothequeContext scoped, entités, requêtes) devient le\n   cœur d'une API ASP.NET Core : chaque endpoint réutilisera pagination,\n   projection DTO, transactions et sécurité anti-injection. J'arrive au\n   projet full-stack avec la persistance déjà maîtrisée.",
    note: "Cet exercice est ta soutenance de fin de niveau : il prouve que tu ne connais pas seulement des méthodes EF Core, mais que tu comprends l'ARCHITECTURE d'un accès aux données — la compétence qui te suivra sur tous les langages et tous les frameworks. Garde ce bilan : c'est le résumé que tu réviseras avant un entretien technique, et le plan que tu appliqueras au Niveau 6. Félicitations pour le parcours accompli." }
