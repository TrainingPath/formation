<script>
var DAY = {
  num: 1,
  title: "Pourquoi un ORM ? Du SQL aux objets",
  subtitle: "Quarante lignes d'ADO.NET pour lire trois colonnes ? Il y a mieux.",
  theory: `
<h3>1. Deux mondes qui ne parlent pas la même langue</h3>
<p>Au Niveau 4, tu as conçu le schéma SQL Server de la <strong>Ludothèque</strong> : des tables <em>Jeux</em>, <em>Membres</em>, <em>Locations</em>, <em>Avis</em>, des clés étrangères, des JOIN. En C#, tu manipules tout autre chose : des <strong>classes</strong> (des moules à objets), des <strong>objets</strong> (les exemplaires fabriqués avec ces moules), des <strong>références</strong> (des liens vers un objet), des <strong>listes</strong>. Une base relationnelle pense en tables et en tuples (les lignes) ; ton programme pense en objets et en navigation (passer d'un objet à un autre en suivant un lien). Ce fossé porte un nom : le <strong>décalage objet-relationnel</strong> (impedance mismatch). Imagine un traducteur entre deux langues qui n'ont ni la même grammaire ni le même alphabet : c'est exactement la situation.</p>
<pre class="pseudo">MONDE RELATIONNEL             MONDE OBJET (C#)
table Jeux              ←→    class Jeu
colonne Titre           ←→    propriété Titre
ligne (un tuple)        ←→    objet (une instance)
clé étrangère JeuId     ←→    référence jeu / List&lt;Location&gt;
JOIN Jeux–Avis          ←→    navigation : jeu.Avis</pre>
<p>Ce tableau se lit de gauche à droite : à chaque notion du monde des bases de données (à gauche) correspond une notion du monde C# (à droite). Tant que quelqu'un doit traduire à la main d'un monde à l'autre, ce quelqu'un… c'est toi.</p>

<h3>2. La vie sans ORM : ADO.NET à la main</h3>
<p>Tu l'as entrevu au Niveau 4 : pour lire les jeux disponibles avec <strong>ADO.NET</strong> pur (la bibliothèque bas niveau de .NET pour parler aux bases de données), il faut ouvrir une <strong>SqlConnection</strong> (un tuyau ouvert vers le serveur SQL Server), préparer une <strong>SqlCommand</strong> contenant du SQL écrit dans une chaîne de caractères, parcourir un <strong>SqlDataReader</strong> ligne par ligne (comme un curseur qui avance dans le résultat), et recopier chaque colonne dans un objet. À la main. Pour chaque table. Pour chaque requête.</p>
<pre class="pseudo">// ADO.NET : lire les jeux disponibles… à la main
using var cnx = new SqlConnection(chaine);            // ouvre un tuyau vers SQL Server ; "using" garantit qu'il sera refermé automatiquement à la fin
cnx.Open();                                           // établit réellement la connexion au serveur de base de données
var cmd = new SqlCommand(                             // prépare une commande SQL à envoyer au serveur
    "SELECT Id, Titre, Prix FROM Jeux WHERE EstDisponible = 1", cnx);  // le SQL, tapé à la main dans une chaîne : aucune vérification par le compilateur
using var reader = cmd.ExecuteReader();              // exécute la requête et récupère un lecteur qui va parcourir les lignes du résultat
var jeux = new List&lt;Jeu&gt;();                           // crée une liste vide qui contiendra les objets Jeu construits à la main
while (reader.Read())                                // TANT QU'il reste une ligne à lire dans le résultat…
{
    jeux.Add(new Jeu {                               // …fabriquer un nouvel objet Jeu et l'ajouter à la liste
        Id    = (int)reader["Id"],                   // recopier la colonne "Id" en la convertissant (cast) en int
        Titre = (string)reader["Titre"],             // recopier la colonne "Titre" en la convertissant en string
        Prix  = (decimal)reader["Prix"]              // recopier la colonne "Prix" en la convertissant en decimal
    });
}</pre>
<p>Quinze lignes répétitives, du SQL non vérifié par le compilateur (une faute de frappe dans <em>Titre</em> ? plantage à l'exécution), des conversions de types fragiles. Et on n'a pas encore parlé des INSERT, UPDATE, DELETE, ni des jointures.</p>

<h3>3. Ce qu'un ORM fait pour toi</h3>
<p>Un <strong>ORM</strong> (Object-Relational Mapper, littéralement « cartographe objet-relationnel ») est un traducteur automatique entre les deux mondes : c'est un interprète qui parle couramment le SQL et le C# et fait la conversion à ta place. <strong>EF Core</strong> (Entity Framework Core), l'ORM officiel de .NET, t'apporte quatre services majeurs : le <strong>mapping automatique</strong> (le mot <em>mapping</em> = « mise en correspondance » : une table ↔ une classe, une colonne ↔ une propriété), des <strong>requêtes typées</strong> écrites en <strong>LINQ</strong> (Language Integrated Query, un langage de requêtes intégré directement au C# — l'équivalent du SQL mais que le compilateur vérifie), le <strong>suivi des changements</strong> (le <em>change tracking</em> : EF surveille tes objets comme un carnet de brouillon, repère lesquels ont changé et génère l'UPDATE au SaveChanges), et les <strong>migrations</strong> (faire évoluer le schéma SQL depuis ton code C#, leçon 4).</p>
<pre class="pseudo">// EF Core : exactement la même lecture
var jeux = context.Jeux              // context.Jeux = un DbSet : la table Jeux vue comme une collection d'objets C#
    .Where(j =&gt; j.EstDisponible)     // filtre en LINQ : ne garder que les jeux dont EstDisponible vaut vrai (EF le traduira en WHERE)
    .ToList();                       // exécute la requête et matérialise le résultat sous forme de liste d'objets Jeu

// Modifier ? EF suit les changements :
var jeu = context.Jeux.First(j =&gt; j.Titre == "Catan");  // récupère le premier jeu dont le Titre vaut "Catan"
jeu.Prix = 34.90m;                                      // on modifie la propriété Prix de l'objet en mémoire (le suffixe m = nombre decimal)
context.SaveChanges();   // EF génère l'UPDATE tout seul // EF compare l'état avant/après et envoie l'UPDATE correspondant en base</pre>
<p>Trois lignes au lieu de quinze, et si tu renommes la propriété <em>Titre</em>, le compilateur signale immédiatement toutes les requêtes à corriger.</p>

<h3>4. Ce qu'un ORM ne fait PAS</h3>
<p>Un ORM n'est <strong>pas magique</strong>. Derrière chaque requête LINQ, EF Core <strong>génère du SQL</strong> — et ce SQL peut être excellent ou catastrophique selon la façon dont tu écris ta requête (le fameux problème N+1, où une requête en déclenche des centaines d'autres, leçon 18). Un ORM ne te dispense donc jamais de <strong>maîtriser le SQL</strong> : tu dois savoir lire ce qu'il génère, le juger, et parfois reprendre la main avec du SQL natif (leçon 15). Il ne conçoit pas non plus ton schéma à ta place : Merise et le Niveau 4 restent tes fondations.</p>

<h3>5. Panorama des ORM et fil rouge du cours</h3>
<p>Le concept est universel : <strong>Hibernate/JPA</strong> joue ce rôle en Java/Spring, <strong>Eloquent</strong> dans Laravel (PHP), et Django (Python) embarque son <strong>ORM intégré</strong>. Apprendre EF Core, c'est apprendre un patron que tu retrouveras dans toutes les piles. Notre fil rouge : construire la <strong>couche de persistance de la Ludothèque</strong> (la partie du programme qui range et relit les données en base), en repartant du schéma SQL Server conçu au Niveau 4.</p>
<pre class="pseudo">SCHÉMA NIVEAU 4 (SQL Server)      COUCHE EF CORE (ce cours)
table Jeux            →   class Jeu       + DbSet&lt;Jeu&gt;
table Membres         →   class Membre    + DbSet&lt;Membre&gt;
table Locations       →   class Location  + DbSet&lt;Location&gt;
table Avis            →   class Avis      + DbSet&lt;Avis&gt;
                          le tout orchestré par LudothequeContext (leçon 2)</pre>
<p>Chaque ligne de ce tableau montre une table du Niveau 4 (à gauche) et la classe C# + son DbSet qui la représenteront (à droite). Un <strong>DbSet</strong> est simplement la table vue comme une collection d'objets manipulable en C#.</p>
<div class="warn">L'ORM <strong>cache</strong> le SQL, il ne le <strong>supprime</strong> pas. Un développeur qui utilise EF Core sans comprendre le SQL généré écrit des applications lentes sans le savoir. Tout ce cours t'apprendra à garder un œil sous le capot.</div>
<div class="tip">EF Core est demandé dans la quasi-totalité des offres .NET, et les concepts (entités, contexte, migrations, lazy loading) se transposent tels quels à Hibernate ou Eloquent : un seul apprentissage, quatre écosystèmes.</div>`,
  exercises: [
    { type: "qcm", q: "ORM signifie…", opts: ["Object-Request Manager", "Online Relational Model", "Object-Relational Mapping", "Open Resource Machine"], a: 2, exp: "Un traducteur entre le monde objet et le monde relationnel." },
    { type: "qcm", q: "Le décalage objet-relationnel désigne…", opts: ["La différence de représentation entre tables/tuples et classes/objets", "Une panne du moteur SQL Server pendant un JOIN", "La latence réseau entre l'application et la base", "Une incompatibilité de types signalée par le compilateur C#"], a: 0, exp: "Deux mondes, deux façons de modéliser les données." },
    { type: "qcm", q: "Dans ADO.NET manuel, la classe qui parcourt les résultats ligne par ligne est…", opts: ["SqlConnection", "SqlDataReader", "SqlCommand", "SqlAdapter"], a: 1, exp: "while (reader.Read()) { … } : la boucle que l'ORM t'épargne." },
    { type: "vf", q: "Avec EF Core, il n'est plus nécessaire de connaître le SQL.", a: false, exp: "EF génère du SQL qu'il faut savoir lire et juger — leçons 15 et 18." },
    { type: "qcm", q: "Lequel de ces services n'est PAS rendu par un ORM ?", opts: ["Le mapping table ↔ classe", "Le suivi des changements", "La génération des migrations", "La conception du schéma relationnel à ta place"], a: 3, exp: "Merise et le Niveau 4 restent ta responsabilité : l'ORM traduit, il ne conçoit pas." },
    { type: "input", q: "Comment s'appelle l'ORM officiel de l'écosystème .NET ?", a: ["EF Core", "Entity Framework Core", "Entity Framework"], ph: "Nom de l'ORM…", exp: "Entity Framework Core, abrégé EF Core." },
    { type: "qcm", q: "L'équivalent d'EF Core dans le monde Java/Spring est…", opts: ["Eloquent", "Hibernate/JPA", "Doctrine", "Sequelize"], a: 1, exp: "Hibernate implémente le standard JPA ; Eloquent est côté Laravel." },
    { type: "qcm", q: "Eloquent est l'ORM de…", opts: ["Django", "Spring", "Laravel", "ASP.NET Core"], a: 2, exp: "Le framework PHP Laravel ; Django (Python) a son propre ORM intégré." },
    { type: "vf", q: "Django (Python) intègre son propre ORM.", a: true, exp: "Modèles Django : le même concept qu'une entité EF Core." },
    { type: "qcm", q: "Le suivi des changements (change tracking) permet…", opts: ["De détecter les objets modifiés et de générer les UPDATE au SaveChanges", "De sauvegarder automatiquement l'historique du code avec Git", "De chiffrer les colonnes sensibles de la base de données", "D'optimiser le débit réseau vers le serveur SQL Server"], a: 0, exp: "Tu modifies jeu.Prix, EF sait quoi mettre à jour — détails leçon 19." },
    { type: "qcm", q: "Dans la Ludothèque, la table Locations du Niveau 4 deviendra…", opts: ["Un fichier JSON", "Une procédure stockée", "Une vue SQL", "Une classe Location exposée via un DbSet"], a: 3, exp: "Chaque table du schéma correspond à une classe C# et son DbSet." },
    { type: "input", q: "Quelle classe ADO.NET représente la connexion à SQL Server ?", a: ["SqlConnection"], ph: "Sql…", exp: "SqlConnection, à ouvrir et fermer soi-même en ADO.NET pur." },
    { type: "qcm", q: "Le principal risque d'un ORM mal utilisé est…", opts: ["La perte irrémédiable du code source du projet", "Un SQL généré inefficace (ex. problème N+1)", "L'impossibilité totale de compiler le projet C#", "La suppression accidentelle des tables de la base"], a: 1, exp: "D'où le réflexe central du cours : surveiller le SQL généré." },
    { type: "vf", q: "Avec EF Core, les requêtes s'écrivent en LINQ et sont vérifiées par le compilateur.", a: true, exp: "Une propriété renommée = erreurs de compilation immédiates, pas un plantage en production." },
    { type: "qcm", q: "Les migrations (leçon 4) servent à…", opts: ["Sauvegarder la base sur le cloud", "Traduire l'application en plusieurs langues", "Faire évoluer le schéma SQL depuis le code C#", "Migrer de MySQL vers SQL Server automatiquement"], a: 2, exp: "Le schéma suit tes classes, version après version." }
  ],
  final: {
    title: "Exercice final — L'ORM en perspective",
    intro: `<p>Avant d'installer quoi que ce soit, on vérifie que le pourquoi est limpide.</p>`,
    questions: [
      { type: "qcm", q: "Le trio ADO.NET que remplace EF Core pour lire des données :", opts: ["SqlConnection, SqlCommand, SqlDataReader", "HttpClient, HttpRequest, HttpResponse", "StreamReader, StreamWriter, File", "Task, Thread, Lock"], a: 0, exp: "Connexion, commande SQL en chaîne, lecture ligne par ligne : tout ça devient automatique." },
      { type: "qcm", q: "Les quatre apports majeurs d'un ORM :", opts: ["Compilation, débogage, tests, déploiement", "Mapping auto, requêtes typées, suivi des changements, migrations", "HTML, CSS, JS, SQL", "Chiffrement, cache, logs, réseau"], a: 1, exp: "Le résumé de la section 3." },
      { type: "vf", q: "Le SQL généré par EF Core est toujours optimal, inutile de le vérifier.", a: false, exp: "Il dépend de tes requêtes LINQ : on apprendra à le lire dès la leçon 2 (LogTo)." },
      { type: "input", q: "Quelle méthode d'EF Core déclenche l'écriture des modifications en base ?", a: ["SaveChanges", "SaveChanges()"], ph: "Nom de la méthode…", exp: "SaveChanges transforme les changements suivis en INSERT/UPDATE/DELETE." },
      { type: "qcm", q: "Le fil rouge de ce cours est…", opts: ["Un blog", "Un carnet de recettes", "La couche de persistance de la Ludothèque", "Un jeu vidéo 3D"], a: 2, exp: "Jeux, Membres, Locations, Avis : le schéma du Niveau 4 passe côté C#." }
    ],
    solution: `<pre class="pseudo">Problème  : décalage objet-relationnel (tables/tuples vs classes/objets)
Avant     : ADO.NET manuel — SqlConnection + SqlCommand + SqlDataReader
            + mapping colonne par colonne, SQL en chaîne non vérifiée
ORM       : mapping auto, LINQ typé, suivi des changements, migrations
Limites   : le SQL généré doit être surveillé ; l'ORM ne conçoit pas le schéma
Panorama  : EF Core (.NET) ≈ Hibernate/JPA (Java) ≈ Eloquent (Laravel) ≈ ORM Django

Fil rouge : la Ludothèque — Jeux, Membres, Locations, Avis (schéma Niveau 4)
            → classes C# orchestrées par LudothequeContext.</pre>
<p>Le pourquoi est posé. Prochaine leçon : créer le <strong>LudothequeContext</strong>, le connecter à SQL Server et voir passer le tout premier SQL généré.</p>`
  }
};
</script>
