  theory: `
<h3>1. Les paquets NuGet : outiller le projet</h3>
<p>EF Core est découpé en <strong>paquets NuGet</strong> (des briques logicielles téléchargeables, comme des applications qu'on installe sur un téléphone). Pour parler à <strong>SQL Server</strong>, il faut le <strong>fournisseur</strong> (provider) dédié : <strong>Microsoft.EntityFrameworkCore.SqlServer</strong>. Un provider est l'adaptateur qui sait parler le dialecte SQL d'un moteur précis — il tire automatiquement le cœur d'EF Core avec lui. Pour les migrations de la leçon 4, ajoute dès maintenant <strong>Microsoft.EntityFrameworkCore.Design</strong> (et <strong>Microsoft.EntityFrameworkCore.Tools</strong> si tu utilises la console du gestionnaire de package de Visual Studio).</p>
<pre class="pseudo">dotnet add package Microsoft.EntityFrameworkCore.SqlServer   # installe le provider SQL Server (+ le cœur d'EF Core)
dotnet add package Microsoft.EntityFrameworkCore.Design      # installe l'outillage nécessaire aux migrations (leçon 4)

// Un provider par SGBD : il suffirait de changer de paquet
// pour viser MySQL (Pomelo), PostgreSQL (Npgsql) ou SQLite.</pre>

<h3>2. LudothequeContext : hériter de DbContext</h3>
<p>Le <strong>DbContext</strong> est LA classe centrale d'EF Core : il représente une <strong>session de travail</strong> avec la base — pense à un guichet ouvert le temps d'une opération. Il ouvre la connexion, suit les changements de tes objets (comme un carnet de brouillon qui note tout ce que tu modifies), traduit tes requêtes LINQ en SQL et exécute le SaveChanges. Pour la Ludothèque, on crée une classe <strong>LudothequeContext</strong> qui hérite de DbContext et expose (dès la leçon 3) un <strong>DbSet</strong> par table — un DbSet étant la table vue comme une collection d'objets C#.</p>
<pre class="pseudo">public class LudothequeContext : DbContext        // notre contexte hérite de DbContext (le ": DbContext" = "est un" DbContext)
{
    public DbSet&lt;Jeu&gt; Jeux { get; set; }          // expose la table Jeux comme une collection d'objets Jeu (détaillé leçon 3)
    // Membres, Locations, Avis suivront (leçons 8 à 11)
}</pre>
<p>Un DbContext est un objet <strong>léger et à courte durée de vie</strong> : on le crée, on travaille, on le libère. Il n'est <strong>pas thread-safe</strong> (« sûr en multitâche ») : jamais une même instance partagée entre plusieurs threads (plusieurs fils d'exécution en parallèle).</p>

<h3>3. Projet console : OnConfiguring + UseSqlServer</h3>
<p>Dans un petit projet console (parfait pour expérimenter pendant ce cours), la configuration la plus directe consiste à <strong>surcharger</strong> (redéfinir) la méthode <strong>OnConfiguring</strong> et à appeler <strong>UseSqlServer</strong> avec la <strong>chaîne de connexion</strong> (l'adresse + les identifiants pour joindre ta base) du Niveau 4.</p>
<pre class="pseudo">public class LudothequeContext : DbContext                              // notre session de travail avec la base
{
    public DbSet&lt;Jeu&gt; Jeux { get; set; }                               // la table Jeux vue comme une collection d'objets

    protected override void OnConfiguring(DbContextOptionsBuilder options)  // EF appelle cette méthode pour se configurer
    {
        options.UseSqlServer(                                          // on choisit le provider SQL Server…
            "Server=localhost;Database=Ludotheque;Trusted_Connection=True;TrustServerCertificate=True");  // …avec la chaîne de connexion vers la base
    }
}

// Utilisation :
using var context = new LudothequeContext();                          // crée le contexte ; "using" le libérera automatiquement à la fin
Console.WriteLine(context.Jeux.Count());                              // compte les jeux en base et affiche le nombre (EF génère un SELECT COUNT(*))</pre>
<p>Décortiquons la chaîne : <em>Server</em> désigne l'instance SQL Server, <em>Database</em> la base Ludotheque, <em>Trusted_Connection=True</em> active l'authentification Windows (celle de SSMS au Niveau 4), et <em>TrustServerCertificate=True</em> accepte le certificat auto-signé du serveur local — acceptable en développement uniquement.</p>

<h3>4. Projet ASP.NET Core : AddDbContext + appsettings.json</h3>
<p>En ASP.NET Core, tu as appris l'<strong>injection de dépendances</strong> (un système qui te livre les objets dont tu as besoin au lieu de les fabriquer toi-même, comme un serveur qui t'apporte ton plat plutôt que de te faire aller en cuisine) : on ne « new » pas ses services, on les demande. Le contexte suit la règle. La chaîne de connexion vit dans <strong>appsettings.json</strong> (jamais en dur dans le code), et <strong>AddDbContext</strong> enregistre LudothequeContext dans le conteneur avec une durée de vie <strong>scoped</strong> : une instance par requête HTTP, détruite à la fin de la requête. Exactement la bonne durée de vie pour une session de base de données.</p>
<pre class="pseudo">// appsettings.json
{                                                                     // fichier de configuration au format JSON
  "ConnectionStrings": {                                             // section réservée aux chaînes de connexion
    "Ludotheque": "Server=localhost;Database=Ludotheque;Trusted_Connection=True;TrustServerCertificate=True"  // notre chaîne, nommée "Ludotheque"
  }
}

// Program.cs
builder.Services.AddDbContext&lt;LudothequeContext&gt;(options =&gt;          // enregistre le contexte dans le conteneur d'injection de dépendances
    options.UseSqlServer(                                            // configure le provider SQL Server…
        builder.Configuration.GetConnectionString("Ludotheque")));   // …en lisant la chaîne "Ludotheque" depuis appsettings.json

// Puis dans un contrôleur : le contexte arrive par le constructeur
public JeuxController(LudothequeContext context) { _context = context; }  // l'injection livre l'instance ; on la garde dans un champ privé</pre>
<p>Règle simple : <strong>OnConfiguring</strong> pour un exercice console vite monté, <strong>AddDbContext</strong> partout ailleurs — testable, configurable par environnement, aligné sur l'injection de dépendances.</p>

<h3>5. Voir le SQL généré : LogTo, ton meilleur réflexe</h3>
<p>Conseil central de tout ce cours : <strong>regarde toujours le SQL que génère EF Core</strong>. La méthode <strong>LogTo</strong> branche la <strong>journalisation</strong> (le fait d'écrire un journal de tout ce qui se passe) sur la console — chaque requête LINQ affiche le SQL réellement envoyé à SQL Server, comme un mouchard qui te montre ce qui part sous le capot. Prends l'habitude dès aujourd'hui : c'est elle qui te fera repérer les requêtes monstrueuses bien avant la leçon performance. Côté autres piles, le rôle du DbContext est tenu par la <strong>Session/SessionFactory</strong> d'Hibernate, et la configuration de connexion vit dans <em>config/database.php</em> chez Laravel ou <em>settings.py</em> (DATABASES) chez Django.</p>
<pre class="pseudo">protected override void OnConfiguring(DbContextOptionsBuilder options)                                  // méthode de configuration du contexte
{
    options.UseSqlServer("Server=localhost;Database=Ludotheque;Trusted_Connection=True;TrustServerCertificate=True")  // provider + chaîne de connexion
           .LogTo(Console.WriteLine, LogLevel.Information);                                             // branche la journalisation : chaque SQL sera écrit dans la console
}

// Sortie console lors de context.Jeux.Count() :
// Executed DbCommand (12ms)                                                                            // EF indique la durée réelle de la commande
// SELECT COUNT(*) FROM [Jeux] AS [j]                                                                   // le SQL exact qu'EF a généré et envoyé à SQL Server</pre>
<div class="warn">Ne mets <strong>jamais</strong> une chaîne de connexion en dur dans du code destiné à la production, et encore moins dans un dépôt Git : appsettings.json par environnement, variables d'environnement ou secrets. TrustServerCertificate=True est un confort de développement local, pas un réglage de production.</div>
<div class="tip">Active LogTo dès maintenant et garde la console ouverte pendant tout le cours : chaque leçon (CRUD, Include, LINQ, pagination…) prendra un autre relief quand tu verras le SQL défiler en direct. C'est l'équivalent du show_sql d'Hibernate ou du DEBUG des requêtes Django.</div>`,
  exercises: [

    { type: "qcm", q: "Où doit vivre la chaîne de connexion d'une application ASP.NET Core ?", opts: ["Dans appsettings.json, section ConnectionStrings", "En dur dans le contrôleur", "Dans un commentaire du code", "Dans le HTML de la page"], a: 0, exp: "Configurable par environnement, hors du code compilé." },

    { type: "qcm", q: "Trusted_Connection=True dans la chaîne de connexion signifie…", opts: ["Connexion sans mot de passe pour tous", "Connexion en lecture seule", "Authentification Windows (compte de la session)", "Connexion chiffrée de bout en bout"], a: 2, exp: "La même authentification intégrée que dans SSMS au Niveau 4." },
    { type: "qcm", q: "L'équivalent Hibernate du couple DbContext/session EF Core est…", opts: ["Session et SessionFactory", "SqlDataReader", "EntityManagerFactoryBuilderPro", "Le fichier .htaccess"], a: 0, exp: "Mêmes responsabilités : session de travail, suivi, traduction en SQL." },
    { type: "qcm", q: "Un DbContext doit être…", opts: ["Un singleton global gardé toute la vie de l'appli", "Partagé entre tous les threads", "Créé une fois par machine", "Léger, à courte durée de vie, non partagé entre threads"], a: 3, exp: "On le crée, on travaille, on le libère — jamais thread-safe." },
    { type: "vf", q: "Une même instance de DbContext peut être utilisée par plusieurs threads en parallèle.", a: false, exp: "Le DbContext n'est pas thread-safe : une instance par unité de travail." },
    { type: "qcm", q: "builder.Configuration.GetConnectionString(« Ludotheque ») lit…", opts: ["Une variable C# globale", "L'entrée Ludotheque de la section ConnectionStrings de la configuration", "Le registre Windows", "La table Jeux"], a: 1, exp: "appsettings.json, surchargé au besoin par environnement ou variables d'environnement." }
  ],

<p>Ton contexte sait maintenant où est la base. Prochaine leçon : lui donner sa première entité — la classe <strong>Jeu</strong>, son DbSet, les conventions et les data annotations.</p>`
