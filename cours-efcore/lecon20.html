<h3>1. La vue d'ensemble : ce qu'est devenue la Ludothèque</h3>
<p>Il est temps de reculer et de regarder la cathédrale entière. Depuis la leçon 1, on a bâti pièce par pièce la <strong>couche de persistance</strong> (la partie du programme chargée de ranger et relire les données en base) de la Ludothèque : les <strong>entités</strong> (les classes qui représentent les tables : Jeu, Membre, Location, Avis, Categorie), le <strong>LudothequeContext</strong> qui les expose, la <strong>configuration Fluent</strong> qui gouverne le mapping (la mise en correspondance classe ↔ table), et les <strong>requêtes</strong> qui alimentent l'application. C'est exactement la couche que consommera ton API ASP.NET Core au Niveau 6. Aucune notion neuve aujourd'hui : on assemble, on relit, on consolide.</p>
<pre class="pseudo">Ludotheque.Data/
  Entities/        Jeu · Membre · Location · Avis · Categorie   (POCO)
  Configurations/  JeuConfiguration · MembreConfiguration · ...  (Fluent)
  LudothequeContext.cs      (DbSet + OnModelCreating)
  Migrations/               (dotnet ef migrations add / database update)
Consommée par : Ludotheque.Api (contrôleurs, services) — Niveau 6</pre>

<h3>2. Les entités : cinq POCO et leurs relations</h3>
<p>Nos classes restent des <strong>POCO</strong> (Plain Old CLR Objects : de simples objets métier, sans dépendance à EF Core). Elles portent leurs propriétés scalaires et leurs <strong>navigations</strong> (les propriétés qui pointent vers les objets liés) : références (côté « N ») et collections (côté « un »). On relit ici les quatre types de relations construits aux leçons 8 à 11.</p>
<pre class="pseudo">public class Jeu {                                          // entité Jeu : le moule d'une ligne de la table Jeux
    public int Id { get; set; }                            // clé primaire du jeu
    public string Titre { get; set; }                      // titre du jeu
    public decimal Prix { get; set; }                      // prix (montant décimal)
    public bool EstDisponible { get; set; }                // le jeu est-il disponible à la location ?
    public int Stock { get; set; }                         // nombre d'exemplaires en stock
    public List&lt;Location&gt; Locations { get; set; } = new();   // 1-N : un jeu a plusieurs locations (collection)
    public List&lt;Avis&gt; Avis { get; set; } = new();           // 1-N : un jeu a plusieurs avis
    public List&lt;Categorie&gt; Categories { get; set; } = new(); // N-N : un jeu a plusieurs catégories (et inversement)
}
public class Membre {                                      // entité Membre : une ligne de la table Membres
    public int Id { get; set; }                            // clé primaire du membre
    public string Pseudo { get; set; }                     // pseudonyme du membre
    public string Email { get; set; }                      // email (rendu unique par un index en config)
    public DateTime DateInscription { get; set; }          // date d'inscription
    public List&lt;Location&gt; Locations { get; set; } = new();   // 1-N : un membre a plusieurs locations
}
public class Location {                                     // N-1 (jeu, membre) : entité Location, le côté « plusieurs »
    public int Id { get; set; }                            // clé primaire de la location
    public DateTime DateDebut { get; set; }                // date de début de la location
    public DateTime? DateRetour { get; set; }              // date de retour (nullable : null tant que non rendu)
    public decimal Prix { get; set; }                      // prix de cette location
    public int JeuId { get; set; }      public Jeu Jeu { get; set; }        // FK JeuId + navigation vers le jeu loué
    public int MembreId { get; set; }   public Membre Membre { get; set; }  // FK MembreId + navigation vers le membre
}
public class Avis {                                         // N-1 (jeu, membre) : entité Avis
    public int Id { get; set; }        public int Note { get; set; }        // clé primaire + note attribuée au jeu
    public string Commentaire { get; set; }  public DateTime DateAvis { get; set; }  // texte de l'avis + date de rédaction
    public int JeuId { get; set; }     public int MembreId { get; set; }    // FK vers le jeu et FK vers le membre
}</pre>

<h3>3. Le LudothequeContext final : DbSet + OnModelCreating</h3>
<p>Le contexte (leçons 2, 3, 7) expose <strong>un DbSet par entité</strong> (un DbSet = la table vue comme une collection d'objets C#) et centralise la configuration. Comme le OnModelCreating grossirait avec 5 entités, on a sorti chaque config dans une classe <strong>IEntityTypeConfiguration</strong> (leçon 7) et on les enregistre toutes en une ligne.</p>
<pre class="pseudo">public class LudothequeContext : DbContext                          // le contexte : notre session de travail avec la base
{
    public LudothequeContext(DbContextOptions&lt;LudothequeContext&gt; options)   // constructeur recevant les options de config…
        : base(options) { }                 // injecté par AddDbContext (leçon 2)   // …transmises à la classe de base DbContext

    public DbSet&lt;Jeu&gt; Jeux { get; set; }                            // expose la table Jeux comme une collection d'objets
    public DbSet&lt;Membre&gt; Membres { get; set; }                      // table Membres
    public DbSet&lt;Location&gt; Locations { get; set; }                  // table Locations
    public DbSet&lt;Avis&gt; Avis { get; set; }                           // table Avis
    public DbSet&lt;Categorie&gt; Categories { get; set; }                // table Categories

    protected override void OnModelCreating(ModelBuilder modelBuilder)   // EF appelle cette méthode pour construire le modèle
    {
        modelBuilder.ApplyConfigurationsFromAssembly(               // enregistre d'un coup toutes les configs Fluent…
            typeof(LudothequeContext).Assembly);   // scanne toutes les configs   // …trouvées dans l'assembly du contexte
    }
}</pre>

<h3>4. La config Fluent : le mapping en un coup d'œil</h3>
<p>Chaque configuration (leçon 7) est la <strong>carte d'identité SQL</strong> de son entité : contraintes de colonnes, index, précision décimale, et les relations (leçons 8-11). On relit ci-dessous les décisions clés — dont l'<strong>OnDelete(Restrict)</strong> qui empêche de supprimer un jeu encore loué, et l'index unique sur l'email d'un membre.</p>
<pre class="pseudo">public class JeuConfiguration : IEntityTypeConfiguration&lt;Jeu&gt; {         // config Fluent dédiée à l'entité Jeu
    public void Configure(EntityTypeBuilder&lt;Jeu&gt; builder) {             // méthode où l'on décrit le mapping du Jeu
        builder.Property(j =&gt; j.Titre).IsRequired().HasMaxLength(200);  // Titre obligatoire (NOT NULL), 200 caractères max
        builder.Property(j =&gt; j.Prix).HasColumnType("decimal(8,2)");    // Prix stocké en decimal(8,2) : précision monétaire
        builder.Property(j =&gt; j.EstDisponible).HasDefaultValue(true);   // valeur par défaut true côté base
        builder.HasMany(j =&gt; j.Locations).WithOne(l =&gt; l.Jeu)           // un Jeu a plusieurs Locations, chacune a un Jeu (1-N)…
               .HasForeignKey(l =&gt; l.JeuId)                             // …reliées par la clé étrangère JeuId
               .OnDelete(DeleteBehavior.Restrict);     // pas de suppression en cascade   // interdit de supprimer un jeu encore loué
        builder.HasMany(j =&gt; j.Categories).WithMany(c =&gt; c.Jeux)        // relation N-N entre Jeu et Categorie…
               .UsingEntity(join =&gt; join.ToTable("JeuCategorie"));  // N-N   // …matérialisée par la table de jointure JeuCategorie
    }
}
public class MembreConfiguration : IEntityTypeConfiguration&lt;Membre&gt; {   // config Fluent dédiée à l'entité Membre
    public void Configure(EntityTypeBuilder&lt;Membre&gt; builder) {          // méthode de mapping du Membre
        builder.HasIndex(m =&gt; m.Email).IsUnique();      // email unique   // index unique : pas deux membres avec le même email
        builder.Property(m =&gt; m.Pseudo).IsRequired().HasMaxLength(50);   // Pseudo obligatoire, 50 caractères max
    }
}</pre>

<h3>5. Les requêtes clés : le catalogue complet des gestes</h3>
<p>Toute l'application se ramène à un petit vocabulaire de requêtes, chacune vue en détail dans une leçon. Voici le récapitulatif que tu garderas sous les yeux au Niveau 6. Une ligne pour la culture générale : cette architecture (entités POCO + contexte + config + requêtes) est <strong>universelle</strong> — c'est l'@Entity + EntityManager d'Hibernate, le Model + Eloquent de Laravel, le models.py + ORM de Django. Un ORM appris, tous compris.</p>
<pre class="pseudo">// LIRE
ctx.Jeux.FindAsync(5)                                    // lit un jeu par sa clé primaire (leçon 5)
ctx.Jeux.Where(j =&gt; j.EstDisponible).OrderBy(j =&gt; j.Titre)  // filtre les disponibles puis trie par titre (leçon 13)
ctx.Jeux.Include(j =&gt; j.Avis).ThenInclude(...)           // charge les jeux avec leurs avis (et au-delà) : relations (leçon 12)
ctx.Jeux.Select(j =&gt; new JeuDto { ... })                 // projette vers un DTO léger pour l'affichage (leçon 14)
ctx.Avis.GroupBy(a =&gt; a.JeuId).Select(g =&gt; new { g.Key, g.Count() })  // regroupe par jeu et compte : agrégats (leçon 14)
query.Skip((p-1)*t).Take(t)                              // saute puis prend une page : pagination (leçon 16)
ctx.Jeux.AsNoTracking().ToListAsync()                    // lecture seule sans suivi : plus rapide (leçon 18)
ctx.Jeux.FromSqlInterpolated($"...{x}...")               // SQL natif paramétré, donc sûr (leçon 15)
// ÉCRIRE
ctx.Jeux.Add(jeu); await ctx.SaveChangesAsync();         // insère un jeu ; SaveChanges est atomique (leçons 5, 17)
jeu.Prix = 4.5m; await ctx.SaveChangesAsync();           // modifie une propriété : le tracker génère l'UPDATE (leçon 6)
using var tx = ctx.Database.BeginTransactionAsync();     // transaction explicite : enchaînements multi-unités (leçon 17)</pre>
