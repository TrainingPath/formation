  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test automatique</strong> est un petit programme qui vérifie tout seul qu'une méthode fait ce qu'on attend, et qu'on relance à chaque modification — comme une check-list de sécurité rejouée avant chaque décollage. Il documente les règles et attrape les <strong>régressions</strong> (une régression = une fonctionnalité qui marchait et qu'un changement a cassée sans qu'on le remarque) <em>avant</em> les utilisateurs. En .NET, on utilise <strong>xUnit</strong> (l'outil qui exécute les tests) et <strong>Moq</strong> (l'outil qui simule les dépendances).</p>

<h3>2. Un test xUnit : Arrange / Act / Assert</h3>
<p>Un test se lit toujours en trois temps : <strong>Arrange</strong> (préparer), <strong>Act</strong> (agir) et <strong>Assert</strong> (vérifier) :</p>
<pre class="pseudo">public class TarifServiceTests {                     // classe regroupant des tests du TarifService
    [Fact]                                           // [Fact] : un test simple, sans paramètre
    public void Prolongation_AjouteLeBonMontant() {  // le nom décrit ce qui est vérifié
        // Arrange                                    // 1) préparer le terrain
        var service = new TarifService();            // on crée l'objet à tester
        // Act                                        // 2) exécuter la méthode testée
        var prix = service.PrixLocation(nbJours: 10);   // 7 j + 3 j de prolongation
        // Assert                                     // 3) vérifier le résultat
        Assert.Equal(5.00m + 3 * 0.50m, prix);       // le prix obtenu est-il celui attendu ?
    }
}</pre>
<p><code>[Fact]</code> marque une méthode comme un test. <code>Assert.Equal(attendu, obtenu)</code> compare le résultat à la valeur espérée : s'ils diffèrent, le test échoue. La commande <code>dotnet test</code> exécute tous les tests et affiche <span style="color:green">vert</span> (tout va bien) ou <span style="color:red">rouge</span> (un problème).</p>

<h3>3. Tester sans la base : Moq</h3>
<p>Un test <strong>unitaire</strong> vérifie une seule « unité » (ici un service) de façon <em>isolée</em> : pas de vraie base SQL Server. On remplace les dépendances par des <strong>mocks</strong> (des doublures, comme une fausse façade de décor de cinéma qui imite le vrai bâtiment) :</p>
<pre class="pseudo">[Fact]                                               // un test unitaire
public async Task Louer_StockNul_LeveUneException() {   // vérifie qu'un stock nul provoque bien une erreur
    var repo = new Mock&lt;IJeuRepository&gt;();            // crée une doublure du dépôt de jeux
    repo.Setup(r =&gt; r.TrouverAsync(1))               // quand on demandera le jeu n°1 à la doublure…
        .ReturnsAsync(new Jeu { Id = 1, StockLocation = 0 });   // scénario forcé

    var service = new LocationService(repo.Object);  // on injecte la doublure dans le vrai service

    await Assert.ThrowsAsync&lt;StockInsuffisantException&gt;(   // on s'attend à CETTE exception précise…
        () =&gt; service.LouerAsync("client@ludo.fr", 1));   // …en tentant de louer un jeu sans stock
}</pre>
<p><code>Setup(...).ReturnsAsync(...)</code> programme la doublure : « quand on t'appelle ainsi, réponds ceci ». On force ainsi le scénario voulu (un stock à zéro) sans toucher une vraie base. <code>Assert.ThrowsAsync&lt;...&gt;</code> vérifie que l'exception attendue est bien levée — car un <em>refus</em> métier se teste comme un succès. Pour pouvoir être remplacée par un mock, la dépendance doit être décrite par une <strong>interface</strong> (<code>IJeuRepository</code> : un contrat qui liste les méthodes sans dire comment elles marchent).</p>

<h3>4. Plusieurs cas d'un coup : [Theory]</h3>
<pre class="pseudo">[Theory]                                             // [Theory] : un test rejoué avec plusieurs jeux de données
[InlineData(0, false)]                               // cas : stock 0 → pas louable
[InlineData(1, true)]                                // cas : stock 1 → louable
[InlineData(5, true)]                                // cas : stock 5 → louable
public void EstLouable_DependDuStock(int stock, bool attendu) =&gt;   // reçoit chaque paire (stock, résultat attendu)
    Assert.Equal(attendu, new Jeu { StockLocation = stock }.EstLouable);   // vérifie EstLouable pour ce stock</pre>
<div class="warn">Un bon test unitaire est <strong>rapide</strong> (quelques millisecondes), <strong>isolé</strong> (pas de base, pas de réseau) et <strong>déterministe</strong> (même résultat à chaque exécution, jamais « ça dépend »). S'il a besoin de SQL Server, ce n'est plus un test unitaire mais un <strong>test d'intégration</strong> — sujet de demain.</div>
<div class="tip">On teste en priorité les <strong>règles métier</strong> : stock nul refusé, prix figé à l'achat, double-rendu interdit. C'est là que les bugs coûtent le plus cher.</div>
`,

    { type: "qcm", q: "[Theory] + [InlineData] permettent…", opts: ["Un seul cas", "Le même test sur plusieurs jeux de données", "De déployer", "De mocker"], a: 1, exp: "Cas multiples, code unique." },
    { type: "qcm", q: "Un bon test unitaire est…", opts: ["Lent et complet", "Rapide, isolé, déterministe", "Aléatoire", "Manuel"], a: 1, exp: "Les 3 qualités." },

    { type: "vf", q: "Un test qui passe parfois et échoue parfois est acceptable.", a: false, exp: "Non déterministe = inutilisable." }
  ],

    questions: [
      { type: "qcm", q: "La dépendance du service est remplacée par :", opts: ["Un Mock<IJeuRepository>", "SQL Server", "un fichier", "l'API"], a: 0, exp: "Isolation." },

      { type: "qcm", q: "Ce test s'exécute :", opts: ["En millisecondes, sans base", "En 30 s avec SQL Server", "En prod", "À la main"], a: 0, exp: "Unitaire." },
      { type: "vf", q: "Si quelqu'un supprime le contrôle de stock, ce test devient rouge.", a: true, exp: "C'est sa raison d'être." }
    ],
    solution: `<pre class="pseudo">[Fact]                                               // un test unitaire
public async Task Louer_StockNul_LeveUneException() {   // vérifie le refus quand le stock est nul
    var repo = new Mock&lt;IJeuRepository&gt;();            // doublure du dépôt de jeux
    repo.Setup(r =&gt; r.TrouverAsync(1))               // quand on demande le jeu n°1…

        () =&gt; service.LouerAsync("client@ludo.fr", 1));   // …en tentant de louer sans stock
}</pre>
<p>La règle la plus importante de la Ludothèque est verrouillée. Demain : tester l'assemblage complet.</p>`
  }

    solution: "[Fact]                                       // un test unitaire\npublic async Task Acheter_FigeLePrixDuMoment() {   // verifie que le montant est fige a l'achat\n    // Arrange\n    var jeu = new Jeu { Id = 1, StockVente = 3, PrixAchat = 29.99m };   // un jeu a 29,99\n    var repo = new Mock<IJeuRepository>();    // doublure du depot de jeux\n    repo.Setup(r => r.TrouverAsync(1)).ReturnsAsync(jeu);   // renvoyer ce jeu pour l'id 1\n    var service = new AchatService(repo.Object);   // injecte la doublure dans le service\n\n    // Act\n    var achat = await service.AcheterAsync(\"client@ludo.fr\", 1);   // on achete le jeu\n\n    // Assert : le prix est figé au moment de l'achat\n    Assert.Equal(29.99m, achat.Montant);      // le montant enregistre vaut bien 29,99\n    jeu.PrixAchat = 39.99m;                 // le vendeur change le prix\n    Assert.Equal(29.99m, achat.Montant);    // l'achat passé ne bouge pas\n}",
