  theory: `
<h3>1. API JSON ou pages HTML ?</h3>
<p>Rappel : l'API REST (leçon 7) renvoie du <strong>JSON</strong> (données brutes en texte) destiné à un front séparé ou à une appli mobile. Pour un site web classique consulté dans un navigateur, on préfère fabriquer directement le <strong>HTML</strong> (le langage des pages web) <strong>côté serveur</strong> — c'est-à-dire que le serveur assemble la page finie avant de l'envoyer. En ASP.NET Core, cet outil s'appelle <strong>Razor Pages</strong>. Point fort : le même service métier alimente aussi bien l'API que les pages.</p>

<h3>2. Le PageModel : le code de la page</h3>
<p>Chaque page Razor a deux fichiers : un fichier de code (le <strong>PageModel</strong>, en C#) et un fichier d'affichage (le template <code>.cshtml</code>). Le PageModel prépare les données :</p>
<pre class="pseudo">// Pages/Catalogue.cshtml.cs                          // fichier de code de la page Catalogue
public class CatalogueModel : PageModel {             // le PageModel hérite de PageModel (outils Razor)
    private readonly CatalogueService _service;       // le service métier, injecté
    public CatalogueModel(CatalogueService s) =&gt; _service = s;   // constructeur : reçoit le service
    public List&lt;Jeu&gt; Jeux { get; private set; } = new();   // les jeux à afficher (remplis plus bas)

    public async Task OnGetAsync() =&gt;                 // méthode appelée quand on OUVRE la page (requête GET)
        Jeux = await _service.JeuxLouablesAsync();     // charge les jeux louables et les range dans la propriété Jeux
}</pre>
<p><code>OnGetAsync</code> répond automatiquement au GET de la page (le simple fait de la visiter) : il charge les données via le service et les expose dans des propriétés que le template pourra lire.</p>

<h3>3. Le template .cshtml</h3>
<p>Le template mélange du HTML (la structure visible) et du code C# précédé de <code>@</code> :</p>
<pre class="pseudo">@page                                        @* directive : ce fichier est une Razor Page *@
@model CatalogueModel                        @* indique quel PageModel alimente la page *@

@foreach (var jeu in Model.Jeux) {           @* pour chaque jeu de la liste préparée… *@
    &lt;tr&gt;                                     @* …ouvre une ligne de tableau *@
        &lt;td&gt;@jeu.Titre&lt;/td&gt;                  @* cellule : le titre du jeu (échappé) *@
        &lt;td&gt;@jeu.PrixLocation €&lt;/td&gt;         @* cellule : le prix de location *@
        &lt;td&gt;&lt;form method="post" asp-page-handler="Louer" asp-route-id="@jeu.Id"&gt;   @* formulaire visant le handler "Louer" *@
            &lt;button&gt;Louer&lt;/button&gt;&lt;/form&gt;&lt;/td&gt;   @* bouton qui envoie le formulaire *@
    &lt;/tr&gt;                                     @* ferme la ligne *@
}                                            @* fin de la boucle *@</pre>
<p><code>@</code> insère une valeur en l'<strong>échappant</strong> : le HTML dangereux qu'elle contiendrait est neutralisé (affiché comme texte). <code>@foreach</code> répète un bloc pour chaque élément. Les <strong>tag helpers</strong> (<code>asp-page-handler</code>, <code>asp-route-id</code>) sont des attributs spéciaux qui génèrent tout seuls la bonne URL et le <strong>jeton anti-forgery</strong> du formulaire (une protection anti-CSRF : elle empêche un site pirate de soumettre le formulaire à votre place).</p>

<h3>4. Le handler POST</h3>
<pre class="pseudo">public async Task&lt;IActionResult&gt; OnPostLouerAsync(int id) {   // répond au POST du bouton "Louer" (handler nommé "Louer")
    await _locationService.LouerAsync(User.Identity!.Name!, id);  // loue le jeu "id" au nom de l'utilisateur connecté
    return RedirectToPage();   // Post-Redirect-Get                // recharge la page via une redirection (voir ci-dessous)
}</pre>
<p>Un <strong>handler</strong> est une méthode qui traite une action de la page. <code>RedirectToPage()</code> après un POST met en œuvre le motif <strong>Post-Redirect-Get</strong> : au lieu de réafficher la page directement, on redirige vers une nouvelle visite (GET). Ainsi, si l'utilisateur appuie sur « Rafraîchir » (F5), il ne <em>rejoue</em> pas la location — sans cela, le navigateur renverrait le formulaire et louerait une seconde fois.</p>

<h3>5. Le layout</h3>
<p>Le <strong>layout</strong> est le gabarit commun (en-tête, menu, pied de page) partagé par toutes les pages, pour ne pas le recopier partout :</p>
<pre class="pseudo">@* Pages/Shared/_Layout.cshtml *@            @* gabarit commun à toutes les pages *@
&lt;body&gt;
  &lt;nav&gt;…menu commun…&lt;/nav&gt;                   @* barre de navigation identique partout *@
  @RenderBody()                              @* emplacement où s'insère le contenu propre à chaque page *@
&lt;/body&gt;</pre>
<div class="warn">Le <code>@</code> de Razor <strong>échappe</strong> automatiquement : un titre de jeu malicieux (contenant du code) s'affiche en simple texte, sans s'exécuter — c'est la protection contre le <strong>XSS</strong> (Cross-Site Scripting, l'injection de script pirate dans une page). <code>Html.Raw()</code>, qui désactive cette protection, ne se justifie que sur du contenu de confiance.</div>
<div class="tip">Le même <code>CatalogueService</code> sert l'API et les pages Razor : une seule logique métier, deux présentations. L'utilisateur voit enfin la Ludothèque à l'écran.</div>
`,

  ],
