var DAY = {

  title: "Louer un jeu : transaction, stock, réservation",
  subtitle: "Le cœur métier : deux écritures indissociables dans SQL Server.",
  theory: `
<h3>1. Que se passe-t-il quand on loue ?</h3>
<p>Louer un jeu, c'est faire <strong>deux écritures</strong> en base : créer la ligne <code>Location</code> (la trace « ce client a loué ce jeu ») ET <strong>décrémenter</strong> (diminuer de 1) le <code>StockLocation</code>. Si l'une réussit sans l'autre, la base <em>ment</em> : soit un stock faux, soit une location fantôme. Il faut donc une <strong>transaction</strong> : un groupe d'écritures « <strong>tout ou rien</strong> » (soit tout est validé ensemble, soit rien) — exactement comme un virement bancaire qui débite un compte et crédite l'autre : les deux ou aucun.</p>

<h3>2. La transaction EF Core</h3>
<pre class="pseudo">public async Task LouerAsync(string idClient, int idJeu) {          // loue le jeu idJeu au client idClient
    using var tx = await _db.Database.BeginTransactionAsync();       // ouvre une transaction ("tout ou rien")
    var jeu = await _db.Jeux.FindAsync(idJeu)                        // récupère le jeu par sa clé primaire
        ?? throw new KeyNotFoundException("Jeu introuvable");        // absent : lève une erreur (→ 404)
    if (jeu.StockLocation &lt;= 0)                                      // s'il ne reste aucun exemplaire à louer…
        throw new StockInsuffisantException("Plus de stock de location");  // …refuser (erreur métier → 409)
    _db.Locations.Add(new Location {                                 // 1re écriture : créer la ligne de location
        ClientId = idClient, JeuId = idJeu,                          // qui loue, et quel jeu
        DateDebut = DateTime.UtcNow, NbJours = 7                     // date de début (temps universel), durée 7 jours
    });
    jeu.StockLocation--;                                             // 2e écriture : un exemplaire de moins en stock
    await _db.SaveChangesAsync();                                    // envoie les deux écritures à la base
    await tx.CommitAsync();                                          // valide (commit) définitivement la transaction
}</pre>
<p><code>using</code> signifie « range automatiquement cet objet quand on quitte le bloc ». Toute exception avant <code>CommitAsync</code> fait sortir de la méthode ; le <code>using</code> libère alors la transaction <em>non validée</em>, ce qui provoque un <strong>rollback automatique</strong> (annulation : retour à l'état d'avant). <code>Commit</code> = valider, <code>rollback</code> = tout défaire. <code>jeu.StockLocation--</code> retire 1 (le <code>--</code> est un raccourci pour « enlever un »). C'est la transaction SQL Server du cours de base de données, pilotée depuis le C# par EF Core.</p>

<h3>3. La règle métier vit dans le service</h3>
<p>« Pas de location si le stock est nul » est une décision <strong>métier</strong> (une règle du commerce) : elle vit dans <code>LocationService</code>, pas dans le contrôleur (qui ne fait que traduire en HTTP) ni dans la vue (l'écran). Chaque responsabilité à sa place.</p>

<h3>4. Le contrôleur traduit en HTTP</h3>
<pre class="pseudo">[Authorize]                                          // l'utilisateur doit être connecté
[HttpPost("/api/locations/{idJeu}")]                 // répond à POST /api/locations/{idJeu}
public async Task&lt;IActionResult&gt; Louer(int idJeu) {
    var email = User.FindFirstValue(ClaimTypes.Name);   // identité du loueur, lue dans le jeton
    await _service.LouerAsync(email, idJeu);     // exceptions → middleware (leçon 8)
    return Created($"/api/mes-locations", null); // 201
}</pre>
<p>Le contrôleur récupère l'identité dans le jeton, délègue tout le travail au service, et renvoie <strong>201 Created</strong> (« créé ») en cas de succès. Si le service lève une exception, le middleware d'erreurs (leçon 8) la traduit tout seul en 404 ou 409.</p>
<div class="warn">Deux clients qui louent le <em>dernier</em> exemplaire exactement en même temps : c'est un problème de <strong>concurrence</strong> (deux actions simultanées sur la même donnée). La transaction combinée à la vérification du stock côté base empêche le stock de devenir négatif. Sans transaction, les deux locations « réussiraient » et le stock tomberait à -1.</div>
<div class="tip">On enregistre la date en <code>DateTime.UtcNow</code> (temps universel, le même partout dans le monde, indépendant du <strong>fuseau horaire</strong>) : les conversions vers l'heure locale se font au dernier moment, à l'affichage, côté vue.</div>
`,
  exercises: [
    { type: "qcm", q: "Louer un jeu implique…", opts: ["Une seule écriture", "Deux écritures : la location + le stock", "Une lecture", "Un DELETE"], a: 1, exp: "Indissociables." },
    { type: "qcm", q: "Le mécanisme qui rend les deux écritures « tout ou rien » :", opts: ["Le DTO", "La transaction", "Le claim", "La pagination"], a: 1, exp: "Atomicité." },
    { type: "qcm", q: "Démarrer une transaction EF Core :", opts: ["_db.Database.BeginTransactionAsync()", "_db.Start()", "new Transaction()", "BEGIN dans le C#"], a: 0, exp: "Sur Database." },

    { type: "qcm", q: "« Stock nul → refuser la location » est une règle qui vit…", opts: ["Dans le contrôleur", "Dans le service (métier)", "Dans la vue", "Dans appsettings"], a: 1, exp: "Le métier au centre." },
    { type: "qcm", q: "Stock insuffisant → le service…", opts: ["Renvoie -1", "Lève StockInsuffisantException", "Renvoie null", "Décrémente quand même"], a: 1, exp: "Exception métier explicite." },
    { type: "qcm", q: "Le contrôleur transforme cette exception en HTTP grâce…", opts: ["Au middleware d'erreurs (leçon 8)", "À un if partout", "Au frontend", "À SQL Server"], a: 0, exp: "Gestion centralisée." },
    { type: "vf", q: "Le contrôleur doit contenir la logique de stock.", a: false, exp: "Il traduit en HTTP ; le métier est dans le service." },
    { type: "qcm", q: "Après une location réussie, l'API renvoie…", opts: ["200 sans corps obligatoire ou 201 Created", "404", "500", "302"], a: 0, exp: "201 = ressource créée." },
    { type: "qcm", q: "L'identité du loueur vient…", opts: ["Du corps JSON", "Du jeton (claims)", "De l'URL", "D'un cookie tiers"], a: 1, exp: "Leçon 11 : jamais de la requête." },
    { type: "qcm", q: "Deux clients louent le dernier exemplaire en même temps :", opts: ["Les deux réussissent", "La transaction garantit qu'un seul réussit", "Le stock devient -1", "SQL Server plante"], a: 1, exp: "Concurrence maîtrisée." },
    { type: "vf", q: "jeu.StockLocation-- suivi de SaveChangesAsync génère un UPDATE en base.", a: true, exp: "EF Core suit les modifications." },
    { type: "qcm", q: "FindAsync(idJeu) qui ne trouve rien → on…", opts: ["Continue", "Lève KeyNotFoundException (→ 404)", "Crée le jeu", "Renvoie 200"], a: 1, exp: "?? throw." },
    { type: "qcm", q: "DateTime.UtcNow plutôt que DateTime.Now :", opts: ["C'est plus court", "Temps universel, sans ambiguïté de fuseau", "C'est obligatoire en C#", "Aucune différence"], a: 1, exp: "Conversion à l'affichage." },
    { type: "vf", q: "Sans transaction, une panne entre les deux écritures laisserait la base incohérente.", a: true, exp: "Location sans décrément, ou l'inverse." }
  ],
  final: {
    title: "Exercice final — La location atomique",
    intro: `<p>On écrit le trajet complet d'une location.</p>`,
    questions: [
      { type: "qcm", q: "La transaction commence par :", opts: ["using var tx = await _db.Database.BeginTransactionAsync();", "tx.Commit()", "SaveChanges", "un lock"], a: 0, exp: "Avant les écritures." },
      { type: "qcm", q: "Stock nul →", opts: ["throw new StockInsuffisantException(...)", "return", "stock = 0", "Commit"], a: 0, exp: "Refus métier." },
      { type: "qcm", q: "Les deux écritures sont :", opts: ["Add(location) et jeu.StockLocation--", "deux SELECT", "un DELETE", "un seul INSERT"], a: 0, exp: "Puis SaveChanges + Commit." },
      { type: "qcm", q: "L'ordre final :", opts: ["SaveChangesAsync puis CommitAsync", "Commit puis SaveChanges", "Commit seul", "aucun"], a: 0, exp: "Écrire, puis valider." },
      { type: "vf", q: "Une exception avant le commit annule tout.", a: true, exp: "Rollback automatique." }
    ],
    solution: `<pre class="pseudo">public async Task LouerAsync(string idClient, int idJeu) {   // loue le jeu au client
    using var tx = await _db.Database.BeginTransactionAsync();  // ouvre la transaction (tout ou rien)
    var jeu = await _db.Jeux.FindAsync(idJeu)                // récupère le jeu par sa clé
        ?? throw new KeyNotFoundException("Jeu introuvable");  // absent → 404
    if (jeu.StockLocation &lt;= 0)                              // plus d'exemplaire disponible ?
        throw new StockInsuffisantException("Plus de stock de location");  // → refus (409)
    _db.Locations.Add(new Location {                         // 1re écriture : la ligne de location
        ClientId = idClient, JeuId = idJeu,                  // qui loue, quel jeu
        DateDebut = DateTime.UtcNow, NbJours = 7             // début (UTC), durée 7 jours
    });
    jeu.StockLocation--;                                     // 2e écriture : un exemplaire de moins
    await _db.SaveChangesAsync();                            // envoie les deux écritures
    await tx.CommitAsync();                                  // valide la transaction
}</pre>
<p>Le cœur de la Ludothèque bat. Demain : l'achat, sur l'autre stock.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton service de location…",
  items: [
  { id: "projcsharp-l12", title: "Rendre un jeu", level: 3,
    statement: "Écris LocationService.RendreAsync(int idLocation) : dans une transaction, charger la location (KeyNotFoundException si absente), refuser si elle a déjà une DateRetour (InvalidOperationException), sinon poser DateRetour = DateTime.UtcNow, ré-incrémenter le StockLocation du jeu, sauvegarder et commiter.",
    hints: [
      "var loc = await _db.Locations.Include(l => l.Jeu).FirstOrDefaultAsync(l => l.Id == idLocation) ?? throw ...",
      "if (loc.DateRetour is not null) throw new InvalidOperationException(\"Déjà rendue\");",
      "loc.DateRetour = DateTime.UtcNow; loc.Jeu.StockLocation++;"
    ],
    solution: "public async Task RendreAsync(int idLocation) {         // enregistre le retour d'une location\n    using var tx = await _db.Database.BeginTransactionAsync();   // transaction (tout ou rien)\n    var loc = await _db.Locations                       // cherche la location…\n        .Include(l => l.Jeu)                            // …en chargeant aussi son jeu\n        .FirstOrDefaultAsync(l => l.Id == idLocation)   // par son identifiant\n        ?? throw new KeyNotFoundException(\"Location introuvable\");   // absente → 404\n    if (loc.DateRetour is not null)                     // deja une date de retour ?\n        throw new InvalidOperationException(\"Location déjà rendue\");   // refuser le double-rendu\n\n    loc.DateRetour = DateTime.UtcNow;                   // pose la date de retour (maintenant, UTC)\n    loc.Jeu.StockLocation++;                            // le stock de location remonte de 1\n    await _db.SaveChangesAsync();                       // envoie les écritures\n    await tx.CommitAsync();                             // valide la transaction\n}",
    note: "Le retour est le miroir de la location : mêmes garanties transactionnelles, dans l'autre sens (le stock remonte). Le double-rendu est refusé par une règle métier explicite — sans elle, rendre deux fois gonflerait le stock. Include(l => l.Jeu) charge le jeu pour pouvoir le modifier dans la même transaction." }
  ]
