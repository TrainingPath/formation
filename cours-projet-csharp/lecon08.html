<h3>1. Valider les entrées : DataAnnotations</h3>
<p><strong>Valider</strong>, c'est vérifier que les données reçues sont correctes avant de les utiliser — comme un vigile qui contrôle les billets à l'entrée. On ne fait <em>jamais</em> confiance aux données envoyées par l'extérieur (un utilisateur, ou un pirate, peut envoyer n'importe quoi). Les <strong>DataAnnotations</strong> sont des <strong>attributs de validation</strong> (les étiquettes entre crochets) posés sur les propriétés du DTO d'entrée pour dire quelles valeurs sont acceptables.</p>
<pre class="pseudo">public class CreationJeuDto {                        // DTO d'entrée : les données envoyées pour créer un jeu
    [Required] public string Titre { get; set; } = "";  // Titre obligatoire (ne doit pas être vide)
    [Range(0.01, 9999)] public decimal PrixLocation { get; set; }  // prix compris entre 0,01 et 9999
    [Range(0, int.MaxValue)] public int StockLocation { get; set; }  // stock positif ou nul (jamais négatif)
    [Required] public int CategorieId { get; set; }  // la catégorie doit être fournie
}</pre>

<h3>2. La validation automatique</h3>
<pre class="pseudo">[HttpPost]                                           // répond à POST /api/jeux (créer un jeu)
public async Task&lt;ActionResult&lt;JeuDto&gt;&gt; Creer(CreationJeuDto dto) {  // les données reçues arrivent dans dto
    // si dto est invalide, [ApiController] a DÉJÀ renvoyé 400 : on n'arrive pas ici
    ...                                              // (ici : enregistrer le jeu, puis renvoyer son DTO)
}</pre>
<p>Grâce à <code>[ApiController]</code>, une requête invalide déclenche <strong>automatiquement une réponse 400</strong> (« Bad Request », mauvaise demande) avec le détail des erreurs, <em>sans une seule ligne à écrire</em>. Le code de la méthode ne s'exécute donc que si les données sont saines.</p>

<h3>3. Les attributs courants</h3>
<p>Voici les étiquettes de validation les plus utilisées (à gauche l'attribut, à droite ce qu'il vérifie) :</p>
<pre class="pseudo">[Required]          non nul / non vide
[StringLength(120)] longueur maximale
[Range(min, max)]   intervalle
[EmailAddress]      format d'email
[RegularExpression] motif</pre>
<p>Un <strong>motif</strong> (RegularExpression, ou « expression régulière ») est une formule qui décrit la forme attendue d'un texte, par exemple « un code postal = 5 chiffres ».</p>

<h3>4. Gérer les erreurs métier : un middleware</h3>
<p>Un <strong>middleware</strong> est un morceau de code inséré dans le trajet de chaque requête, comme un poste de contrôle sur une route par lequel tout le monde passe. Celui-ci attrape les <strong>exceptions</strong> (les erreurs signalées par le code) et les traduit en codes HTTP :</p>
<pre class="pseudo">// Program.cs                                        // fichier de démarrage
app.UseExceptionHandler(a =&gt; a.Run(async ctx =&gt; {    // installe un gestionnaire global d'erreurs
    var ex = ctx.Features.Get&lt;IExceptionHandlerFeature&gt;()?.Error;   // récupère l'exception qui a été levée
    ctx.Response.StatusCode = ex switch {            // choisit le code HTTP selon le TYPE d'exception
        KeyNotFoundException =&gt; 404,                 // ressource introuvable → 404
        StockInsuffisantException =&gt; 409,            // conflit d'état (stock épuisé) → 409
        _ =&gt; 500                                     // tout autre cas (_) → 500 (erreur serveur)
    };
    await ctx.Response.WriteAsJsonAsync(new { erreur = "requête non aboutie" });  // renvoie un message JSON maîtrisé
}));</pre>
<p>Le <code>switch</code> ici est une « expression switch » : selon le type de l'erreur, il produit le bon numéro. Le tiret bas <code>_</code> signifie « tous les autres cas ». <code>WriteAsJsonAsync</code> écrit la réponse au format <strong>JSON</strong> (le format texte standard d'échange sur le web). Ce <strong>middleware d'exceptions</strong> centralise en un seul endroit la traduction des erreurs métier en codes HTTP.</p>

<h3>5. Pourquoi centraliser ?</h3>
<div class="tip">Un seul endroit décide comment une exception devient une réponse : le code des contrôleurs reste propre, et les réponses sont cohérentes partout. La <strong>validation</strong> protège la base (des données saines y entrent), le <strong>middleware</strong> protège le client (des réponses claires en sortent).</div>
<div class="warn">En production, on ne renvoie jamais la <strong>trace technique</strong> complète (la longue liste des lignes de code où l'erreur est passée) au client : elle dévoile des détails internes utiles à un attaquant. On renvoie un message maîtrisé et le bon code HTTP.</div>
`,
