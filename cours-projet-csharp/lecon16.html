<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois profils, trois interfaces cloisonnées.",
  theory: `
<h3>1. Un espace par rôle</h3>
<p>Un <strong>espace</strong> est une zone du site réservée à un type d'utilisateur. Chaque profil a le sien : <strong>/client</strong> (ses locations et achats), <strong>/vendeur</strong> (gérer le catalogue et les stocks), <strong>/admin</strong> (gérer les comptes). <strong>Cloisonner</strong>, c'est isoler ces zones pour qu'un client ne puisse pas entrer dans l'espace vendeur, comme des portes badgées dans un bâtiment. Chaque dossier de pages est réservé au bon rôle.</p>

<h3>2. Cloisonner par convention de dossier</h3>
<p>Plutôt que de protéger chaque page une par une, on protège tout un <strong>dossier</strong> d'un coup :</p>
<pre class="pseudo">// Program.cs — autorisation par dossier de Razor Pages          // dans le fichier de démarrage
builder.Services.AddRazorPages(o =&gt; {                             // configure les Razor Pages
    o.Conventions.AuthorizeFolder("/Client");                     // dossier /Client : réservé aux utilisateurs connectés
    o.Conventions.AuthorizeFolder("/Vendeur", "PolitiqueVendeur"); // dossier /Vendeur : soumis à "PolitiqueVendeur"
    o.Conventions.AuthorizeFolder("/Admin",   "PolitiqueAdmin");   // dossier /Admin : soumis à "PolitiqueAdmin"
});
builder.Services.AddAuthorization(o =&gt; {                          // définit les règles d'autorisation nommées
    o.AddPolicy("PolitiqueVendeur", p =&gt; p.RequireRole(Roles.Vendeur, Roles.Administrateur));  // exige le rôle Vendeur OU Admin
    o.AddPolicy("PolitiqueAdmin",   p =&gt; p.RequireRole(Roles.Administrateur));                  // exige le rôle Admin
});</pre>
<p>Une <strong>policy</strong> (« politique ») est une exigence d'autorisation portant un nom (« être vendeur ou admin ») que l'on peut réutiliser. <code>AuthorizeFolder</code> l'applique à tout un dossier : <strong>impossible d'oublier</strong> une page, y compris celles ajoutées plus tard. <code>RequireRole</code> liste les rôles acceptés.</p>

<h3>3. L'espace client : « mes » données</h3>
<pre class="pseudo">public async Task OnGetAsync() {                     // au chargement de l'espace client (GET)
    var email = User.Identity!.Name!;                // identité du connecté (issue de l'authentification, jamais de l'URL)
    Locations = await _locationService.LocationsDeAsync(email);  // charge SES locations
    Achats    = await _achatService.AchatsDeAsync(email);        // charge SES achats
}</pre>
<p>Le filtre s'appuie sur <code>User.Identity.Name</code> (l'identité vérifiée), et non sur un paramètre modifiable de l'URL : un client ne peut donc voir que ses propres données.</p>

<h3>4. L'espace vendeur : stocks et catalogue</h3>
<pre class="pseudo">// Pages/Vendeur/Stocks.cshtml.cs                    // page de gestion des stocks (espace vendeur)
public async Task&lt;IActionResult&gt; OnPostAjusterAsync(int id, int stockLocation, int stockVente) {  // handler du formulaire "Ajuster"
    await _catalogueService.ModifierStockAsync(id, stockLocation, stockVente);  // applique les nouveaux stocks via le service
    return RedirectToPage();                          // Post-Redirect-Get : recharge proprement après l'action
}</pre>

<h3>5. L'espace admin : les comptes</h3>
<pre class="pseudo">// promouvoir un client en vendeur                   // action réservée à l'administrateur
public async Task&lt;IActionResult&gt; OnPostPromouvoirAsync(string id) {  // handler du bouton "Promouvoir"
    var user = await _userManager.FindByIdAsync(id); // retrouve le compte par son identifiant
    if (user is not null) await _userManager.AddToRoleAsync(user, Roles.Vendeur);  // s'il existe : lui donner le rôle Vendeur
    return RedirectToPage();                          // recharge la page
}</pre>
<p><strong>Promouvoir</strong> quelqu'un, c'est lui accorder un rôle plus élevé (ici Client → Vendeur), en l'ajoutant au rôle via <code>UserManager</code>.</p>
<div class="warn">Le menu s'adapte au rôle (<code>User.IsInRole(...)</code>) pour n'afficher que les liens utiles, mais ce n'est que du <strong>confort</strong> : la vraie barrière reste la <strong>policy</strong> côté serveur. Les deux vont ensemble — l'un guide, l'autre protège.</div>
<div class="tip">Trois espaces, <strong>zéro logique métier nouvelle</strong> : ils ne font qu'<strong>orchestrer</strong> (coordonner) les services déjà écrits aux leçons 6, 12 et 13. C'est ici que l'architecture en couches est payante : on assemble sans réécrire.</div>
`,
  exercises: [
    { type: "qcm", q: "L'espace /vendeur permet de…", opts: ["Gérer les comptes", "Gérer catalogue et stocks", "Louer pour soi", "Rien"], a: 1, exp: "Le métier du vendeur." },
    { type: "qcm", q: "Protéger tout un dossier de pages :", opts: ["AuthorizeFolder(\"/Vendeur\", \"PolitiqueVendeur\")", "un if par page", "du CSS", "un cookie"], a: 0, exp: "Convention au démarrage." },
    { type: "qcm", q: "Une policy est…", opts: ["Un fichier CSS", "Une exigence d'autorisation nommée et réutilisable", "Une migration", "Un DTO"], a: 1, exp: "RequireRole(…) nommé." },
    { type: "qcm", q: "PolitiqueVendeur accepte…", opts: ["Vendeur et Administrateur", "Vendeur seul", "Client", "Anonyme"], a: 0, exp: "L'admin peut tout." },
    { type: "qcm", q: "L'avantage du dossier protégé vs l'attribut par page :", opts: ["C'est plus joli", "Impossible d'oublier une page du dossier", "C'est plus rapide", "Aucun"], a: 1, exp: "Sécurité par défaut." },
    { type: "qcm", q: "L'espace client liste…", opts: ["Toutes les locations", "Les locations/achats du connecté seulement", "Les comptes", "Les logs"], a: 1, exp: "Filtre par identité du jeton/cookie." },
    { type: "vf", q: "Un client peut voir les locations d'un autre client en changeant l'URL.", a: false, exp: "Le filtre serveur s'appuie sur User, pas sur l'URL." },
    { type: "qcm", q: "Promouvoir un client en vendeur :", opts: ["AddToRoleAsync(user, Roles.Vendeur)", "user.Role = 2", "un UPDATE brut", "un claim frontend"], a: 0, exp: "Via UserManager." },
    { type: "qcm", q: "Qui peut promouvoir ?", opts: ["Le client lui-même", "L'administrateur", "Le vendeur", "Tout le monde"], a: 1, exp: "Gestion des comptes = admin." },
    { type: "qcm", q: "Adapter le menu au rôle :", opts: ["User.IsInRole(Roles.Vendeur)", "un cookie manuel", "du JavaScript seul", "impossible"], a: 0, exp: "Dans le layout." },
    { type: "vf", q: "Adapter le menu suffit comme sécurité.", a: false, exp: "Confort ; la policy serveur est la barrière." },
    { type: "qcm", q: "Les espaces réutilisent…", opts: ["De nouveaux services", "Les services métier existants (leçons 6, 12, 13)", "Du SQL brut", "Une autre base"], a: 1, exp: "L'architecture paie." },
    { type: "qcm", q: "Après OnPostAjusterAsync, on renvoie…", opts: ["RedirectToPage()", "un JSON", "un throw", "rien"], a: 0, exp: "Post-Redirect-Get." },
    { type: "qcm", q: "Un vendeur qui tape /admin/comptes reçoit…", opts: ["La page", "403 (ou redirection accès refusé)", "500", "Le catalogue"], a: 1, exp: "PolitiqueAdmin le refuse." },
    { type: "vf", q: "Les trois espaces correspondent aux trois profils définis dans le modèle Merise.", a: true, exp: "De la conception à l'interface." }
  ],
  final: {
    title: "Exercice final — Cloisonner les espaces",
    intro: `<p>On met en place les trois espaces et leurs protections.</p>`,
    questions: [
      { type: "qcm", q: "Le dossier /Admin est protégé par :", opts: ["AuthorizeFolder(\"/Admin\", \"PolitiqueAdmin\")", "rien", "du CSS", "un if dans chaque vue"], a: 0, exp: "Convention + policy." },
      { type: "qcm", q: "PolitiqueAdmin exige :", opts: ["RequireRole(Roles.Administrateur)", "RequireRole(Roles.Client)", "AllowAnonymous", "un mot de passe en URL"], a: 0, exp: "Admin seul." },
      { type: "qcm", q: "L'espace client identifie l'utilisateur via :", opts: ["User.Identity.Name", "?email= dans l'URL", "un champ caché", "l'IP"], a: 0, exp: "Jamais l'URL." },
      { type: "qcm", q: "La promotion en vendeur passe par :", opts: ["UserManager.AddToRoleAsync", "un UPDATE SQL manuel", "le frontend", "un claim forgé"], a: 0, exp: "Identity gère la table des rôles." },
      { type: "vf", q: "Les espaces n'introduisent pas de nouvelle logique métier.", a: true, exp: "Ils orchestrent les services existants." }
    ],
    solution: `<pre class="pseudo">builder.Services.AddRazorPages(o =&gt; {                 // configure les Razor Pages
    o.Conventions.AuthorizeFolder("/Client");         // /Client : réservé aux connectés
    o.Conventions.AuthorizeFolder("/Vendeur", "PolitiqueVendeur");  // /Vendeur : policy vendeur
    o.Conventions.AuthorizeFolder("/Admin",   "PolitiqueAdmin");    // /Admin : policy admin
});
builder.Services.AddAuthorization(o =&gt; {              // règles d'autorisation nommées
    o.AddPolicy("PolitiqueVendeur", p =&gt; p.RequireRole(Roles.Vendeur, Roles.Administrateur));  // Vendeur OU Admin
    o.AddPolicy("PolitiqueAdmin",   p =&gt; p.RequireRole(Roles.Administrateur));                  // Admin seul
});</pre>
<p>Chacun chez soi. Demain : prouver que le métier est juste, avec les tests unitaires.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris tes policies et ton espace client…",
  items: [
  { id: "projcsharp-l16", title: "L'espace client", level: 3,
    statement: "Écris le PageModel MonEspaceModel (dossier /Client) : OnGetAsync charge dans deux propriétés les locations en cours et les achats du client connecté (identifié par User.Identity.Name), via LocationService.LocationsDeAsync et AchatService.AchatsDeAsync. Ajoute la configuration AuthorizeFolder(\"/Client\") dans Program.cs.",
    hints: [
      "Deux propriétés : public List<Location> Locations ... ; public List<Achat> Achats ...",
      "var email = User.Identity!.Name!;",
      "o.Conventions.AuthorizeFolder(\"/Client\"); — connecté suffit, pas de rôle particulier."
    ],
    solution: "// Program.cs\nbuilder.Services.AddRazorPages(o => {\n    o.Conventions.AuthorizeFolder(\"/Client\");     // tout /Client exige d'etre connecte\n});\n\n// Pages/Client/MonEspace.cshtml.cs\npublic class MonEspaceModel : PageModel {           // code de la page \\\"Mon espace\\\"\n    private readonly LocationService _locations;    // service des locations, injecte\n    private readonly AchatService _achats;          // service des achats, injecte\n    public MonEspaceModel(LocationService l, AchatService a) {   // constructeur : recoit les deux services\n        _locations = l; _achats = a;\n    }\n\n    public List<Location> Locations { get; private set; } = new();   // les locations a afficher\n    public List<Achat> Achats { get; private set; } = new();         // les achats a afficher\n\n    public async Task OnGetAsync() {                // au chargement de la page (GET)\n        var email = User.Identity!.Name!;           // identite du connecte (pas l'URL)\n        Locations = await _locations.LocationsDeAsync(email);   // SES locations\n        Achats    = await _achats.AchatsDeAsync(email);         // SES achats\n    }\n}",
    note: "AuthorizeFolder garantit qu'aucune page du dossier /Client n'est accessible sans connexion — même une page ajoutée dans six mois. Le PageModel ne filtre jamais sur un paramètre d'URL : l'identité vient de User, posée par l'authentification. Les deux services réutilisés datent des leçons 12 et 13 : rien de nouveau à écrire côté métier." }
  ]
};
