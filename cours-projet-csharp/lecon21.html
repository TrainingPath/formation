  title: "Récapitulatif : la Ludothèque assemblée (examen)",
  subtitle: "Tout le projet en une épreuve : de l'architecture au déploiement.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, une application complète. Le langage (<strong>C#</strong>), le framework (<strong>ASP.NET Core</strong>, la boîte à outils web) et la base de données (<strong>SQL Server</strong>, le grand classeur électronique) ne sont plus des cours séparés : ils forment un seul logiciel, la Ludothèque. Récapitulons chaque étage avant les 20 questions.</p>

<h3>1. Architecture et données</h3>
<p>Une <strong>architecture en couches</strong> (des étages qui se parlent de proche en proche : contrôleurs → services → EF Core → SQL Server), un schéma — le plan des tables — issu de la méthode <strong>Merise</strong> (le dessin des données sur papier) et appliqué par des <strong>migrations</strong> (des fichiers versionnés qui construisent la base pas à pas), des <strong>entités</strong> (les fiches décrivant jeux, catégories, etc.) reflétant les tables avec leurs relations, et <strong>LINQ</strong> (les requêtes écrites en C#) pour interroger la base sans taper de SQL à la main.</p>

<h3>2. Métier et sécurité</h3>
<p>Les <strong>règles métier</strong> (les décisions du commerce) vivent dans les <strong>services</strong> : deux stocks étanches (vente et location), location et achat <strong>transactionnels</strong> (« tout ou rien »), prix figé au moment de l'achat. <strong>Identity</strong> (le module de comptes) gère utilisateurs et rôles avec des mots de passe <strong>hachés</strong> (rendus illisibles), le <strong>JWT</strong> (le jeton signé) transporte l'identité à chaque requête, et <code>[Authorize]</code> avec les <strong>policies</strong> (les règles d'accès nommées) appliquent la matrice des droits des trois profils (client, vendeur, administrateur).</p>

<h3>3. Interface, qualité, production</h3>
<p><strong>Razor Pages</strong> (les pages HTML fabriquées côté serveur) affiche le catalogue et les trois espaces ; la recherche est <strong>paginée</strong> — découpée en pages — (<code>Skip/Take</code> devient OFFSET/FETCH côté SQL Server). Les <strong>tests unitaires</strong> (xUnit, Moq) verrouillent chaque règle isolément, les <strong>tests d'intégration</strong> (WebApplicationFactory) prouvent l'assemblage complet. Journaux (logs) structurés, <code>Include</code> contre le <strong>problème N+1</strong> (l'explosion du nombre de requêtes), index ciblés pour accélérer, secrets tenus hors du code — puis <code>dotnet publish</code> (la compilation finale), les migrations de production et le <strong>tag Git</strong> (l'étiquette de version).</p>

<h3>Le trajet d'une location</h3>
<p>Voici le chemin complet d'une location, de la requête jusqu'à la base (ceci est un schéma de flux, pas du code à exécuter) :</p>
<pre class="pseudo">POST /api/locations/12  (Bearer JWT)
  → Authentification (jeton signé) → Autorisation ([Authorize])
  → LocationsController.Louer (identité = claim)
  → LocationService.LouerAsync : transaction
      stock ? → Location créée + StockLocation--
  → SaveChanges → COMMIT (SQL Server)
  → 201 Created — et un log structuré</pre>
<div class="tip">Ce trajet traverse TOUTE la formation : HTTP, C#, l'injection de dépendances, le métier, EF Core, la transaction SQL Server née du modèle Merise. Bonne épreuve !</div>
`,
  exercises: [
    { type: "qcm", q: "L'ordre des couches traversées par une requête :", opts: ["Contrôleur → Service → EF Core → SQL Server", "Service → Contrôleur → base", "Vue → base → contrôleur", "EF → contrôleur → service"], a: 0, exp: "L'architecture de la leçon 1." },
    { type: "qcm", q: "Le schéma de la base vient…", opts: ["D'un DBA improvisé", "Du MCD Merise traduit en migrations EF Core", "Du frontend", "Du hasard"], a: 1, exp: "Conception → migrations → SQL Server." },

    { type: "qcm", q: "Skip((page-1)*t).Take(t) devient en SQL Server…", opts: ["LIMIT", "OFFSET … FETCH NEXT …", "TOP", "HAVING"], a: 1, exp: "La pagination du dialecte." },

    { type: "qcm", q: "Les dossiers /Vendeur et /Admin sont protégés par…", opts: ["Du CSS", "AuthorizeFolder + policies (RequireRole)", "un if par page", "rien"], a: 1, exp: "Sécurité par convention." },
    { type: "qcm", q: "Dans Razor, @jeu.Titre…", opts: ["Exécute le HTML", "Affiche en échappant (protection XSS)", "Plante", "Est ignoré"], a: 1, exp: "Échappement par défaut." },
    { type: "qcm", q: "Après un POST réussi en Razor Pages :", opts: ["return Page()", "RedirectToPage() (Post-Redirect-Get)", "un throw", "rien"], a: 1, exp: "F5 ne rejoue pas l'action." },
    { type: "qcm", q: "Un test unitaire du service utilise…", opts: ["SQL Server de prod", "Des mocks (Moq) : rapide, isolé, déterministe", "Le navigateur", "l'API"], a: 1, exp: "xUnit + Moq." },
    { type: "qcm", q: "WebApplicationFactory sert à…", opts: ["Mocker une méthode", "Démarrer l'app en mémoire et la tester en HTTP réel", "Compiler", "Déployer"], a: 1, exp: "Intégration de bout en bout." },
    { type: "qcm", q: "La parade au N+1 :", opts: ["Plus de RAM", "Include(...) → JOIN unique", "ToList() partout", "supprimer les relations"], a: 1, exp: "Une requête au lieu de N+1." },
    { type: "qcm", q: "Les secrets de production arrivent par…", opts: ["appsettings.json commité", "Variables d'environnement (user-secrets en dev)", "le code", "Git"], a: 1, exp: "Hors dépôt, toujours." },
    { type: "qcm", q: "Avant la mise en ligne :", opts: ["On supprime les tests", "dotnet test vert, publish Release, migrations, tag Git", "On copie la base de dev", "On désactive HTTPS"], a: 1, exp: "La check-list de la leçon 20." }
  ],
  final: {

    intro: `<p>Un client connecté clique « Louer » sur le dernier exemplaire de Catan. Déroulez ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "La requête arrive avec :", opts: ["L'en-tête Authorization: Bearer <JWT>", "un mot de passe en URL", "rien", "un id client dans le JSON"], a: 0, exp: "L'identité voyage dans le jeton." },
      { type: "qcm", q: "Avant le contrôleur, le pipeline :", opts: ["Authentifie (signature du JWT) puis autorise ([Authorize])", "Autorise puis authentifie", "Va direct au service", "Appelle SQL Server"], a: 0, exp: "Qui, puis quel droit." },
      { type: "qcm", q: "Le service, dans une transaction :", opts: ["Vérifie le stock, crée la Location, décrémente, commit", "Décrémente sans vérifier", "Envoie un email", "Modifie le prix"], a: 0, exp: "Le cœur métier." },
      { type: "qcm", q: "Si un 2e client louait au même instant :", opts: ["Les deux réussissent", "La transaction garantit qu'un seul obtient le dernier exemplaire", "Le stock devient -1", "SQL Server plante"], a: 1, exp: "Atomicité." },
      { type: "vf", q: "Ce trajet réutilise Merise, SQL Server, C#, ASP.NET Core et les tests écrits cette semaine.", a: true, exp: "Toute la formation dans un clic. 🎓" }
    ],
    solution: `<pre class="pseudo">POST /api/locations/12 (Bearer JWT)
  → signature vérifiée → [Authorize] ok
  → contrôleur : email = claim du jeton
  → LocationService.LouerAsync :
        BEGIN TRANSACTION

<p>🎓 <strong>Félicitations !</strong> Tu as construit la Ludothèque de bout en bout : conçue en Merise, stockée dans SQL Server, écrite en C#, servie par ASP.NET Core, testée et déployée. C'est un projet full-stack complet — le couronnement de la pile C#.</p>`
  }
};
