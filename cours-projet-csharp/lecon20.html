  title: "Déploiement : publish, variables d'environnement",
  subtitle: "Transformer le projet en application en ligne.",
  theory: `
<h3>1. Compiler pour la production</h3>
<p><strong>Compiler</strong>, c'est traduire le code écrit par l'humain (C#) en un programme que la machine peut exécuter. Pour la mise en ligne, on compile en mode <strong>Release</strong> (« version finale ») :</p>
<pre class="pseudo">dotnet publish -c Release -o ./publish        # compile en mode Release (optimisé) vers le dossier ./publish</pre>
<p><code>-c Release</code> compile avec <strong>optimisations</strong> et sans les <strong>symboles de debug</strong> (les repères qui servent à déboguer, inutiles et alourdissants en production). Le dossier <code>publish</code> contient alors tout le nécessaire pour exécuter l'application : les <strong>DLL</strong> (les fichiers de programme compilés), les <strong>dépendances</strong> (les bibliothèques utilisées) et les fichiers statiques (images, CSS…).</p>

<h3>2. Les environnements</h3>
<p>Un <strong>environnement</strong> est un contexte d'exécution avec ses propres réglages : la machine du développeur, un serveur de test, le serveur réel. On le choisit avec une variable :</p>
<pre class="pseudo">ASPNETCORE_ENVIRONMENT=Production   # choisit l'environnement d'exécution (ici Production ; sinon Development, Staging)</pre>
<p>En <code>Development</code> (développement) : pages d'erreur détaillées et <strong>Swagger</strong> (une page qui documente et teste l'API). En <code>Production</code> : erreurs sobres et <strong>HTTPS</strong> forcé (la connexion chiffrée, cadenas du navigateur). <code>appsettings.Production.json</code> <strong>surcharge</strong> (remplace) <code>appsettings.json</code> ; et les <strong>variables d'environnement</strong> surchargent tout le reste — c'est par elles qu'arrivent les secrets (leçon 19).</p>

<h3>3. Migrer la base de production</h3>
<pre class="pseudo">dotnet ef database update --connection "$CHAINE_PROD"   # applique les migrations sur la base de production
# ou : appliquer le script SQL généré par
dotnet ef migrations script --idempotent               # génère un script SQL rejouable sans risque de doublon</pre>
<p>Les migrations écrites depuis la leçon 3 rejouent <strong>exactement</strong> le même schéma sur le SQL Server de production : la base de prod devient identique à celle de dev. <strong>Idempotent</strong> signifie « qu'on l'exécute une fois ou plusieurs, le résultat est le même » : le script vérifie ce qui existe déjà avant d'agir. Il peut être relu et validé par un <strong>DBA</strong> (Database Administrator, l'administrateur de bases de données) avant application.</p>

<h3>4. Servir l'application</h3>
<pre class="pseudo"># l'app écoute sur le port fourni par l'hébergeur
ASPNETCORE_URLS=http://0.0.0.0:$PORT dotnet Ludotheque.dll   # lance l'app en écoutant sur toutes les interfaces, au port $PORT</pre>
<p>Un <strong>port</strong> est un « numéro de porte » réseau par lequel l'application reçoit les connexions ; <code>0.0.0.0</code> veut dire « écoute sur toutes les interfaces réseau ». Kestrel (le serveur intégré) exécute l'app, généralement derrière un <strong>reverse proxy</strong> (un intermédiaire placé devant, comme nginx, IIS ou celui de l'hébergeur) qui gère le HTTPS et répartit la charge entre plusieurs instances.</p>

<h3>5. La check-list de mise en ligne</h3>
<p>Une <strong>check-list</strong> (liste de vérification) évite d'oublier une étape critique :</p>
<pre class="pseudo">✔ dotnet test          → tout est vert
✔ dotnet publish -c Release
✔ variables d'environnement posées (chaîne SQL, clé JWT)
✔ migrations appliquées sur la base de prod
✔ ASPNETCORE_ENVIRONMENT=Production
✔ tag Git de la version déployée (v1.0.0)</pre>
<div class="warn">On ne déploie jamais ce qui n'est pas commité (enregistré dans Git) : le <strong>tag Git</strong> (une étiquette de version, ici <code>v1.0.0</code>) permet de savoir exactement quel code tourne en production — et d'y revenir si la v1.0.1 se passe mal.</div>
<div class="tip">Le déploiement réunit toute la formation : le code (C#), le schéma (des migrations Merise jusqu'à SQL Server), la configuration (les secrets) et Git. La Ludothèque est en ligne.</div>
`,

    { type: "vf", q: "Les migrations de prod sont les mêmes fichiers que celles jouées en dev depuis la leçon 3.", a: true, exp: "Même histoire, même schéma." },
    { type: "qcm", q: "Le serveur web intégré d'ASP.NET Core s'appelle…", opts: ["Apache", "Kestrel", "nginx", "IIS"], a: 1, exp: "Souvent derrière un proxy." },
    { type: "qcm", q: "Le reverse proxy gère typiquement…", opts: ["Les migrations de schéma", "HTTPS et la répartition", "L'exécution des tests", "La création des DTO"], a: 1, exp: "Devant Kestrel." },
    { type: "qcm", q: "La clé JWT de production arrive par…", opts: ["appsettings.json commité", "Variable d'environnement", "une valeur en dur dans le code", "un paramètre de l'URL"], a: 1, exp: "Secret hors dépôt (leçon 19)." },
    { type: "qcm", q: "Avant de déployer, on vérifie que…", opts: ["dotnet test est vert", "le CSS est bien présenté", "la batterie du PC est chargée", "on ne vérifie rien"], a: 0, exp: "Jamais de déploiement rouge." },
    { type: "qcm", q: "Le tag Git v1.0.0 sert à…", opts: ["Décorer le dépôt", "Savoir exactement quel code tourne en prod (et y revenir)", "Compiler le projet", "Lancer une migration"], a: 1, exp: "Traçabilité." },
    { type: "vf", q: "On peut déployer du code non commité si on est pressé.", a: false, exp: "Introuvable et irréproductible." },
    { type: "qcm", q: "ASPNETCORE_URLS=http://0.0.0.0:$PORT signifie…", opts: ["Écouter sur le port fourni par l'hébergeur", "Une erreur de configuration", "Du HTTPS uniquement", "localhost uniquement"], a: 0, exp: "0.0.0.0 = toutes interfaces." }
  ],
  final: {
    title: "Exercice final — La mise en ligne",
    intro: `<p>On déroule la check-list de déploiement de la Ludothèque.</p>`,
    questions: [
      { type: "qcm", q: "Première étape :", opts: ["dotnet test (tout vert)", "supprimer tous les tests", "copier la base de développement", "éteindre le serveur de prod"], a: 0, exp: "On ne déploie pas du rouge." },
      { type: "qcm", q: "Le binaire de prod vient de :", opts: ["dotnet publish -c Release", "dotnet run", "une archive zip du code source", "Visual Studio F5"], a: 0, exp: "Build optimisé." },
      { type: "qcm", q: "Le schéma de prod est mis à jour par :", opts: ["Les migrations EF Core", "des CREATE TABLE à la main", "une copie de la base de développement", "rien du tout"], a: 0, exp: "Reproductible." },
      { type: "qcm", q: "Chaîne SQL et clé JWT arrivent par :", opts: ["Variables d'environnement", "appsettings commité", "le code HTML", "une note écrite à part"], a: 0, exp: "Secrets." },
      { type: "vf", q: "On pose un tag Git sur le commit déployé.", a: true, exp: "v1.0.0 : traçabilité et retour arrière." }
    ],
    solution: `<pre class="pseudo">dotnet test                                   # 1) lancer les tests : tout doit être vert
dotnet publish -c Release -o ./publish        # 2) compiler en Release (optimisé) vers ./publish
dotnet ef migrations script --idempotent      # 3) générer le script SQL du schéma (validé puis appliqué)

export ASPNETCORE_ENVIRONMENT=Production                  # 4) environnement de production
export ConnectionStrings__Ludotheque="Server=prod;..."   # chaîne de connexion (secret)
export Jwt__Cle="une-longue-cle-aleatoire"               # clé de signature JWT (secret)

ASPNETCORE_URLS=http://0.0.0.0:$PORT dotnet Ludotheque.dll   # 5) lancer l'app sur le port fourni
git tag v1.0.0 && git push --tags             # 6) marquer la version déployée dans Git</pre>
<p>La Ludothèque est en ligne. Demain : l'examen final — toute l'application en 20 questions.</p>`
  }
};
