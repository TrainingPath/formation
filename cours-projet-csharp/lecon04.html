var DAY = {
  num: 4,
  title: "Le catalogue : entités Jeu, Categorie, Fournisseur",
  subtitle: "Compléter les entités et leurs relations.",
  theory: `
<h3>1. Une entité = une table</h3>
<p>Rappel : une <strong>entité</strong> est la fiche décrivant une chose (un jeu, une catégorie). Chaque classe rangée dans le dossier <code>Models</code> devient une <strong>table</strong> de la base — un grand tableau où chaque ligne est une fiche — grâce à son <code>DbSet</code> (la propriété du DbContext qui représente cette table). Les <strong>relations</strong> (les liens entre tables) se déclarent par des <strong>propriétés de navigation</strong> : des propriétés qui pointent d'une fiche vers une autre.</p>

<h3>2. Categorie et sa collection</h3>
<pre class="pseudo">public class Categorie {                          // entité Categorie : un genre/rayon de jeux
    public int Id { get; set; }                   // clé primaire (identifiant unique)
    public string Libelle { get; set; } = "";     // nom affiché de la catégorie (ex. "Stratégie")
    public List&lt;Jeu&gt; Jeux { get; set; } = new();   // relation 1:N
}</pre>
<p>Une catégorie possède plusieurs jeux. Une <strong>List&lt;Jeu&gt;</strong> est une <strong>collection</strong> : une boîte qui contient plusieurs objets Jeu, comme un panier qui contient plusieurs articles. Elle matérialise le côté « plusieurs » de la relation. On parle de relation <strong>1:N</strong> (« un à plusieurs ») : UNE catégorie pour N jeux ; ce « 1:N » est la <strong>cardinalité</strong>, c'est-à-dire le nombre d'éléments que chaque côté peut avoir. Le <code>= new()</code> crée une liste vide dès le départ, pour éviter qu'elle soit « nulle » (inexistante) et provoque une erreur quand on essaie d'y ajouter un jeu.</p>

<h3>3. Fournisseur</h3>
<pre class="pseudo">public class Fournisseur {                     // entité Fournisseur : qui approvisionne les jeux
    public int Id { get; set; }                // clé primaire
    public string Nom { get; set; } = "";      // nom du fournisseur
    public string? Telephone { get; set; }   // optionnel
}</pre>
<p>Le point d'interrogation de <code>string?</code> rend le téléphone <strong>nullable</strong> (facultatif) : un fournisseur peut ne pas en avoir renseigné, la case reste alors vide.</p>

<h3>4. Les deux côtés d'une relation</h3>
<p>Une relation se voit toujours des deux côtés à la fois — comme un pont a deux rives :</p>
<pre class="pseudo">// côté « un » (dans Jeu)                       // un jeu appartient à UNE seule catégorie
public int CategorieId { get; set; }            // clé étrangère : le numéro de sa catégorie
public Categorie? Categorie { get; set; }       // navigation : accès direct à l'objet Categorie

// côté « plusieurs » (dans Categorie)          // une catégorie regroupe PLUSIEURS jeux
public List&lt;Jeu&gt; Jeux { get; set; } = new();    // la liste des jeux de cette catégorie</pre>
<p>EF Core relie automatiquement les deux navigations : c'est la <strong>même relation</strong>, vue depuis Jeu (« ma catégorie ») et depuis Categorie (« mes jeux »). On dit qu'elle est <strong>bidirectionnelle</strong>.</p>

<h3>5. Enregistrer les DbSet</h3>
<p>Pour que la base connaisse ces tables, on déclare un <code>DbSet</code> par entité dans le DbContext :</p>
<pre class="pseudo">public DbSet&lt;Jeu&gt; Jeux =&gt; Set&lt;Jeu&gt;();                          // expose la table des jeux
public DbSet&lt;Categorie&gt; Categories =&gt; Set&lt;Categorie&gt;();          // expose la table des catégories
public DbSet&lt;Fournisseur&gt; Fournisseurs =&gt; Set&lt;Fournisseur&gt;();    // expose la table des fournisseurs</pre>
<div class="tip">Les entités reflètent fidèlement le MCD Merise : mêmes relations, mêmes cardinalités. Après avoir ajouté ou modifié une entité, on crée une nouvelle <strong>migration</strong> (<code>dotnet ef migrations add ...</code>) pour synchroniser le schéma SQL Server — sans quoi le code et la base ne seraient plus d'accord.</div>
`,
  exercises: [
    { type: "qcm", q: "Une classe du dossier Models devient…", opts: ["Un contrôleur", "Une table (via son DbSet)", "Un test", "Un DTO"], a: 1, exp: "Entité ↔ table." },
    { type: "qcm", q: "Une catégorie possède plusieurs jeux :", opts: ["public Jeu Jeu", "public List<Jeu> Jeux", "public int Jeu", "public string Jeux"], a: 1, exp: "Collection = 1:N." },
    { type: "qcm", q: "Le côté « un » dans Jeu :", opts: ["List<Categorie>", "CategorieId + Categorie", "un string", "rien"], a: 1, exp: "FK + navigation." },
    { type: "qcm", q: "Un téléphone optionnel :", opts: ["string Telephone", "string? Telephone", "int Telephone", "bool Telephone"], a: 1, exp: "Nullable." },

    { type: "qcm", q: "Exposer la table Categories :", opts: ["DbSet<Categorie> Categories => Set<Categorie>()", "List<Categorie>", "new Table()", "rien"], a: 0, exp: "DbSet." },
    { type: "qcm", q: "Après avoir ajouté une entité, on…", opts: ["Ne fait rien", "Crée une nouvelle migration", "Supprime la base", "Change le CSS"], a: 1, exp: "Synchroniser le schéma." },
    { type: "qcm", q: "La collection List<Jeu> représente…", opts: ["Le côté « un »", "Le côté « plusieurs » (1:N)", "Une clé", "Un index"], a: 1, exp: "Cardinalité N." },
    { type: "qcm", q: "Les entités reflètent…", opts: ["Le CSS", "Le MCD Merise (relations, cardinalités)", "Les tests", "Le réseau"], a: 1, exp: "Le modèle." },
    { type: "qcm", q: "Id dans chaque entité est…", opts: ["Optionnel", "La clé primaire par convention", "Un texte", "Ignoré"], a: 1, exp: "PK." },
    { type: "vf", q: "La même relation se voit des deux côtés (Jeu.Categorie et Categorie.Jeux).", a: true, exp: "Navigation bidirectionnelle." },
    { type: "qcm", q: "= new() sur List<Jeu> Jeux évite…", opts: ["La compilation", "Une collection null", "Un index", "Un test"], a: 1, exp: "Initialisée." },
    { type: "vf", q: "Un Fournisseur peut avoir un téléphone null.", a: true, exp: "string? = nullable." },
    { type: "qcm", q: "FournisseurId int? dans Jeu signifie…", opts: ["Fournisseur obligatoire", "Fournisseur optionnel", "Interdit", "Un doublon"], a: 1, exp: "Relation optionnelle." },
    { type: "qcm", q: "Combien de DbSet pour le catalogue ici :", opts: ["Un", "Trois (Jeux, Categories, Fournisseurs)", "Zéro", "Dix"], a: 1, exp: "Trois tables." }
  ],
  final: {
    title: "Exercice final — Compléter le catalogue",
    intro: `<p>On finalise les entités et leurs relations.</p>`,
    questions: [
      { type: "qcm", q: "La collection de jeux dans Categorie :", opts: ["public List<Jeu> Jeux { get; set; } = new()", "public Jeu Jeu", "public int Jeux", "rien"], a: 0, exp: "1:N." },
      { type: "qcm", q: "Le fournisseur dans Jeu (optionnel) :", opts: ["int? FournisseurId + Fournisseur?", "int obligatoire", "string", "rien"], a: 0, exp: "FK nullable." },
      { type: "qcm", q: "Exposer Fournisseurs :", opts: ["DbSet<Fournisseur> Fournisseurs => Set<Fournisseur>()", "List<Fournisseur>", "new Table()", "rien"], a: 0, exp: "DbSet." },
      { type: "qcm", q: "Après modification d'entité :", opts: ["dotnet ef migrations add ...", "rien", "supprimer la base", "changer le CSS"], a: 0, exp: "Nouvelle migration." },
      { type: "vf", q: "Les deux stocks (StockVente, StockLocation) sont deux propriétés int distinctes.", a: true, exp: "Modèle Ludothèque." }
    ],
    solution: `<pre class="pseudo">public class Categorie {                       // entité Categorie
    public int Id { get; set; }                // clé primaire
    public string Libelle { get; set; } = "";  // nom de la catégorie
    public List&lt;Jeu&gt; Jeux { get; set; } = new();  // ses jeux (relation 1:N), liste initialisée vide
}
public class Fournisseur {                     // entité Fournisseur
    public int Id { get; set; }                // clé primaire
    public string Nom { get; set; } = "";      // nom du fournisseur
    public string? Telephone { get; set; }     // téléphone optionnel (nullable)
}
// AppDbContext
public DbSet&lt;Categorie&gt; Categories =&gt; Set&lt;Categorie&gt;();       // expose la table des catégories
public DbSet&lt;Fournisseur&gt; Fournisseurs =&gt; Set&lt;Fournisseur&gt;();  // expose la table des fournisseurs</pre>
<p>Le catalogue existe en entités. Demain : le DbContext et les requêtes LINQ.</p>`
  }
};
</script>
