<script>
var DAY = {
  num: 9,
  title: "Utilisateurs et les trois rôles (Identity)",
  subtitle: "Client, vendeur, administrateur : les profils du modèle Merise entrent dans l'application.",
  theory: `
<h3>1. Qui utilise la Ludothèque ?</h3>
<p>Le modèle Merise définit trois <strong>profils</strong> : le <strong>client</strong> (consulte, loue, achète), le <strong>vendeur</strong> (gère le catalogue et les stocks) et l'<strong>administrateur</strong> (gère les comptes et tout le reste). Il faut donc des <strong>comptes utilisateurs</strong> (une identité par personne, avec mot de passe)… et un <strong>rôle</strong> par compte. Un rôle est une étiquette qui dit « ce que la personne a le droit de faire », comme un badge d'accès dans une entreprise.</p>

<h3>2. ASP.NET Core Identity</h3>
<p><strong>Identity</strong> est le module tout prêt d'ASP.NET Core qui gère comptes et rôles. On l'active au démarrage :</p>
<pre class="pseudo">// Program.cs                                                   // fichier de démarrage
builder.Services
    .AddIdentityCore&lt;IdentityUser&gt;(o =&gt; o.Password.RequiredLength = 8)  // active Identity ; mot de passe : 8 caractères minimum
    .AddRoles&lt;IdentityRole&gt;()                                    // ajoute la gestion des rôles
    .AddEntityFrameworkStores&lt;AppDbContext&gt;();                   // range utilisateurs et rôles dans notre base via EF Core</pre>
<p><strong>Identity</strong> fournit tout le socle : les tables des utilisateurs et des rôles (créées par migration dans SQL Server), le <strong>hachage des mots de passe</strong>, l'<strong>unicité de l'email</strong> (deux comptes ne peuvent pas partager la même adresse) et les règles de complexité. Le <strong>hachage</strong> transforme un mot de passe en une empreinte illisible et impossible à inverser — comme passer un texte au mixeur : on ne peut pas reconstituer l'original.</p>

<h3>3. Les trois rôles en constantes</h3>
<pre class="pseudo">public static class Roles {                          // classe "boîte à constantes" regroupant les noms de rôles
    public const string Client = "Client";           // constante : le rôle Client
    public const string Vendeur = "Vendeur";         // constante : le rôle Vendeur
    public const string Administrateur = "Administrateur";  // constante : le rôle Administrateur
}</pre>
<p>Une <strong>constante</strong> (<code>const</code>) est une valeur fixée une fois pour toutes, avec un nom. On préfère des constantes plutôt que de retaper la chaîne <code>"Vendeur"</code> partout : une faute de frappe dans <code>"Vendeur"</code> ne serait pas détectée et deviendrait un bug de sécurité silencieux (l'accès serait accordé à un rôle qui n'existe pas vraiment).</p>

<h3>4. Créer les rôles au démarrage</h3>
<pre class="pseudo">var roleManager = scope.ServiceProvider.GetRequiredService&lt;RoleManager&lt;IdentityRole&gt;&gt;();  // récupère l'outil de gestion des rôles
foreach (var r in new[] { Roles.Client, Roles.Vendeur, Roles.Administrateur })            // pour chacun des trois rôles…
    if (!await roleManager.RoleExistsAsync(r))                                             // …s'il n'existe pas encore en base…
        await roleManager.CreateAsync(new IdentityRole(r));                                // …le créer</pre>
<p><code>foreach</code> (« pour chaque ») parcourt la liste des trois rôles. Le <code>!</code> signifie « non » (« s'il n'existe PAS »). C'est un <strong>seed</strong> (« amorçage » : garnir la base de données de départ) <strong>idempotent</strong> : idempotent veut dire « qu'on l'exécute une fois ou dix fois, le résultat est le même ». Au premier démarrage il crée les trois rôles ; ensuite il constate qu'ils existent et ne fait rien.</p>

<h3>5. Inscrire un utilisateur</h3>
<pre class="pseudo">var user = new IdentityUser { UserName = dto.Email, Email = dto.Email };  // crée l'objet utilisateur (identifiant = son email)
var res = await userManager.CreateAsync(user, dto.MotDePasse); // haché ici
if (res.Succeeded)                                                        // si la création a réussi (mot de passe valide, email libre)…
    await userManager.AddToRoleAsync(user, Roles.Client);      // rôle par défaut</pre>
<div class="warn">Un mot de passe ne se stocke <strong>jamais</strong> en clair : <code>CreateAsync</code> enregistre uniquement un <strong>hachage</strong> (impossible à inverser). Même l'administrateur de la base de données ne peut pas lire les mots de passe des utilisateurs — il ne voit que des empreintes.</div>
<div class="tip">Les tables d'Identity (<code>AspNetUsers</code>, <code>AspNetRoles</code>, <code>AspNetUserRoles</code>) arrivent par une migration EF Core, comme le reste du schéma. La table <code>AspNetUserRoles</code> est une <strong>table de liaison</strong> : elle relie utilisateurs et rôles, ce qui permet à une personne d'avoir plusieurs rôles. La base de la Ludothèque reste entièrement versionnée.</div>
`,
  exercises: [
    { type: "qcm", q: "Les trois profils de la Ludothèque sont…", opts: ["Admin, root, invité", "Client, Vendeur, Administrateur", "Lecteur, auteur", "Dev, test, prod"], a: 1, exp: "Définis dès le modèle Merise." },
    { type: "qcm", q: "Le socle utilisateurs/rôles d'ASP.NET Core s'appelle…", opts: ["EF Core", "Identity", "Kestrel", "LINQ"], a: 1, exp: "ASP.NET Core Identity." },
    { type: "qcm", q: "Identity stocke le mot de passe…", opts: ["En clair", "Sous forme de hachage", "Dans un cookie", "Dans appsettings.json"], a: 1, exp: "Hachage irréversible." },
    { type: "qcm", q: "AddEntityFrameworkStores<AppDbContext>() sert à…", opts: ["Créer l'API", "Stocker utilisateurs et rôles via EF Core dans SQL Server", "Paginer", "Logger"], a: 1, exp: "Le store Identity = la base." },
    { type: "qcm", q: "Pourquoi des constantes de rôles (Roles.Vendeur) ?", opts: ["C'est plus rapide", "Éviter les fautes de frappe dans des chaînes de sécurité", "C'est obligatoire", "Pour le style"], a: 1, exp: "Une typo = un trou de sécurité." },
    { type: "qcm", q: "Ajouter la gestion des rôles :", opts: [".AddRoles<IdentityRole>()", ".AddMvc()", ".AddDbContext()", ".AddSwagger()"], a: 0, exp: "Sur la chaîne Identity." },
    { type: "qcm", q: "Créer un rôle au démarrage s'il n'existe pas :", opts: ["roleManager.CreateAsync après RoleExistsAsync", "INSERT manuel", "un DTO", "un middleware"], a: 0, exp: "Seed idempotent." },
    { type: "vf", q: "Le seed des rôles peut s'exécuter à chaque démarrage sans créer de doublons.", a: true, exp: "On teste RoleExistsAsync : idempotent." },
    { type: "qcm", q: "Créer un compte avec mot de passe :", opts: ["userManager.CreateAsync(user, motDePasse)", "db.Users.Add", "new IdentityRole", "SignInAsync"], a: 0, exp: "UserManager hache et valide." },
    { type: "qcm", q: "Donner le rôle Client à un nouvel inscrit :", opts: ["AddToRoleAsync(user, Roles.Client)", "user.Role = 1", "AddClaimAsync seul", "rien"], a: 0, exp: "AddToRoleAsync." },
    { type: "vf", q: "L'administrateur de la base peut lire les mots de passe des utilisateurs.", a: false, exp: "Seul le hachage est stocké." },
    { type: "qcm", q: "L'unicité de l'email est garantie par…", opts: ["Le contrôleur", "Identity (et son index unique en base)", "Le frontend", "Le DTO"], a: 1, exp: "Config + contrainte SQL." },
    { type: "qcm", q: "Les tables AspNetUsers, AspNetRoles… arrivent…", opts: ["À la main", "Par une migration EF Core", "Par un script PowerShell", "Automatiquement sans migration"], a: 1, exp: "Schéma versionné, comme le reste." },
    { type: "qcm", q: "o.Password.RequiredLength = 8 configure…", opts: ["La taille des pages", "La longueur minimale des mots de passe", "Le nombre de rôles", "Le timeout"], a: 1, exp: "Règle de complexité." },
    { type: "vf", q: "Un utilisateur peut techniquement avoir plusieurs rôles avec Identity.", a: true, exp: "Table de liaison AspNetUserRoles (n-n)." }
  ],
  final: {
    title: "Exercice final — Les comptes de la Ludothèque",
    intro: `<p>On met en place Identity et les trois rôles.</p>`,
    questions: [
      { type: "qcm", q: "Enregistrer Identity avec rôles et stockage EF Core :", opts: ["AddIdentityCore + AddRoles + AddEntityFrameworkStores", "AddDbContext seul", "AddAuthorization seul", "AddControllers"], a: 0, exp: "La chaîne complète." },
      { type: "qcm", q: "Les trois rôles sont définis…", opts: ["En constantes (classe Roles)", "En dur partout", "Dans le frontend", "Dans un cookie"], a: 0, exp: "Constantes centralisées." },
      { type: "qcm", q: "Le mot de passe est haché par…", opts: ["userManager.CreateAsync", "le contrôleur", "SQL Server", "le navigateur"], a: 0, exp: "Identity s'en charge." },
      { type: "qcm", q: "Le rôle par défaut d'un inscrit :", opts: ["Client", "Administrateur", "Vendeur", "Aucun"], a: 0, exp: "Le moins privilégié." },
      { type: "vf", q: "Le seed crée les rôles seulement s'ils n'existent pas.", a: true, exp: "Idempotence." }
    ],
    solution: `<pre class="pseudo">builder.Services
    .AddIdentityCore&lt;IdentityUser&gt;(o =&gt; o.Password.RequiredLength = 8)  // active Identity ; 8 caractères mini
    .AddRoles&lt;IdentityRole&gt;()                          // gestion des rôles
    .AddEntityFrameworkStores&lt;AppDbContext&gt;();         // stockage dans notre base via EF Core

public static class Roles {                            // boîte à constantes des rôles
    public const string Client = "Client";             // rôle Client
    public const string Vendeur = "Vendeur";           // rôle Vendeur
    public const string Administrateur = "Administrateur";  // rôle Administrateur
}

// inscription
var res = await userManager.CreateAsync(user, dto.MotDePasse);   // crée le compte (mot de passe haché)
if (res.Succeeded) await userManager.AddToRoleAsync(user, Roles.Client);  // si OK, rôle Client par défaut</pre>
<p>Les comptes existent, les rôles aussi. Demain : la connexion et le jeton JWT.</p>`
  }
};
</script>

    hints: [
      "public static class Roles { public const string Client = \"Client\"; ... }",

      "var res = await _userManager.CreateAsync(user, dto.MotDePasse); puis AddToRoleAsync."
    ],
    solution: "public static class Roles {                       // boite a constantes des noms de roles\n    public const string Client = \"Client\";           // role Client\n    public const string Vendeur = \"Vendeur\";         // role Vendeur\n    public const string Administrateur = \"Administrateur\";   // role Administrateur\n}\n\npublic async Task<IdentityResult> InscrireAsync(InscriptionDto dto) {   // inscrit un nouveau compte\n    var user = new IdentityUser { UserName = dto.Email, Email = dto.Email };   // cree l'objet utilisateur (identifiant = email)\n    var res = await _userManager.CreateAsync(user, dto.MotDePasse);   // cree le compte ; le mot de passe est hache\n    if (res.Succeeded)                            // si la creation a reussi…\n        await _userManager.AddToRoleAsync(user, Roles.Client);   // …lui donner le role Client par defaut\n    return res;                                   // renvoie le resultat (succes ou erreurs)\n}",
    note: "CreateAsync valide la complexité du mot de passe, vérifie l'unicité de l'email et stocke un hachage — jamais le mot de passe. Le nouvel inscrit reçoit le rôle le moins privilégié (Client) ; vendeur et administrateur seront attribués par un administrateur. Les constantes évitent qu'une faute de frappe crée un rôle fantôme." }
  ]
