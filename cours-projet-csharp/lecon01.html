var DAY = {
  num: 1,
  title: "Du cahier des charges à l'architecture en couches",
  subtitle: "Avant d'écrire une ligne, on décide comment l'application est organisée.",
  theory: `
<h3>1. Le projet : assembler ce qu'on sait déjà</h3>
<p>Un mot d'abord sur le vocabulaire, car ce cours s'adresse à une personne qui part de zéro. Une <strong>application</strong> (ou « appli ») est un <strong>programme</strong>, c'est-à-dire une suite d'ordres que l'ordinateur exécute pour rendre un service — un peu comme une recette de cuisine que le cuisinier suit pas à pas. <strong>Coder</strong> (ou programmer), c'est écrire ces ordres dans un langage que la machine comprend.</p>
<p>Ce cours ne réapprend pas les outils un par un — le langage <strong>C#</strong> (prononcé « C sharp », un langage de programmation créé par Microsoft), le framework <strong>ASP.NET Core</strong> (une boîte à outils toute prête pour fabriquer des sites et services web), la méthode <strong>Merise</strong> (une façon de dessiner sur papier l'organisation des données avant de coder) ou <strong>SQL Server</strong> (un logiciel qui range et retrouve d'énormes quantités de données). Il les fait <strong>travailler ensemble</strong> pour construire une seule application complète — <strong>La Ludothèque</strong>. Un <strong>framework</strong> est un ensemble d'outils et de règles déjà écrits qui évitent de tout refaire soi-même : comme une cuisine déjà équipée (four, casseroles, plan de travail) où l'on n'a plus qu'à cuisiner. On conçoit l'appli, on la code, on la teste, puis on la <strong>déploie</strong> (on la met en ligne pour que de vraies personnes puissent l'utiliser).</p>

<h3>2. Le cahier des charges (rappel du domaine)</h3>
<p>Le <strong>cahier des charges</strong> est le document qui décrit ce que l'application doit faire, avant même d'écrire du code — comme le plan d'un architecte avant de bâtir une maison. Notre appli est une ludothèque de jeux de société où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux, avec trois <strong>profils</strong> d'utilisateurs (trois types de personnes qui s'en servent) : le <strong>client</strong> (parcourt le catalogue, loue, achète), le <strong>vendeur</strong> (gère les stocks) et l'<strong>administrateur</strong> (gère les jeux et les comptes). Chaque jeu possède deux stocks distincts : un pour la vente, un pour la location.</p>

<h3>3. L'architecture en couches</h3>
<p>L'<strong>architecture</strong> d'un logiciel, c'est sa façon d'être organisé en grands morceaux, comme les étages d'un immeuble où chacun a sa fonction. Ici on empile des <strong>couches</strong>, chacune avec un seul rôle, et chaque couche ne parle qu'à sa voisine juste en dessous. Voici ces couches, du haut (côté utilisateur) vers le bas (côté données) :</p>
<pre class="pseudo">Controller  ([ApiController]) reçoit les requêtes HTTP, renvoie les réponses
Service     contient les règles (louer, acheter, gérer le stock)
DbContext   EF Core : lit et écrit dans SQL Server
Models      les entités du domaine (Jeu, Categorie, Utilisateur…)
DTOs        objets d'échange avec le client (pas les entités brutes)</pre>
<p>Définissons chaque mot. Une <strong>requête HTTP</strong> est un message qu'un navigateur (ou une appli mobile) envoie sur Internet pour demander quelque chose au serveur — comme un client au comptoir qui passe commande ; la <strong>réponse</strong> est ce que le serveur renvoie. HTTP est simplement la « langue » que parlent les navigateurs et les serveurs pour se comprendre. Le <strong>Controller</strong> (contrôleur) est la couche d'accueil qui reçoit ces demandes et renvoie les réponses : c'est le comptoir. Le <strong>Service</strong> contient les <strong>règles métier</strong> (la logique du commerce : a-t-on le droit de louer ? reste-t-il du stock ?) : c'est l'employé en cuisine qui applique les règles de la maison. Le <strong>DbContext</strong> est la couche qui lit et écrit dans la <strong>base de données</strong> (le grand classeur électronique où sont rangées les informations) ; il s'appuie sur <strong>EF Core</strong> (Entity Framework Core, un « traducteur » automatique entre les objets du code et les tables de la base). Les <strong>Models</strong> (modèles) sont les <strong>entités</strong> du domaine, c'est-à-dire les objets réels que l'appli manipule (un Jeu, une Catégorie, un Utilisateur) — une entité, c'est la fiche descriptive d'une chose. Enfin les <strong>DTO</strong> (Data Transfer Objects, « objets de transfert de données ») sont des versions simplifiées de ces fiches, préparées spécialement pour être envoyées au client, sans dévoiler l'intérieur de la base — comme le menu remis au client plutôt que les fiches techniques de la cuisine.</p>

<h3>4. Le flux d'une requête</h3>
<p>Un <strong>flux</strong> est le trajet que suit une demande à travers les couches, de l'utilisateur jusqu'aux données et retour :</p>
<pre class="pseudo">HTTP → Controller → Service → DbContext (EF Core) → SQL Server
                     (règles)   (accès)              (données)</pre>
<p>Règle d'or : le <strong>Controller ne parle jamais directement à la base</strong> de données. Il passe toujours par le Service, qui lui-même utilise le DbContext. C'est comme au restaurant : le serveur (Controller) ne va pas cuisiner lui-même ; il transmet la commande à la cuisine (Service), qui va chercher les ingrédients au frigo (la base de données). Ce respect strict des rôles évite le désordre.</p>

<h3>5. L'organisation du projet</h3>
<p>Concrètement, le code est rangé dans des <strong>dossiers</strong> (des classeurs sur le disque de l'ordinateur), un par couche. <code>Ludotheque.Api</code> est le nom du projet ; les branches en dessous sont ses sous-dossiers :</p>
<pre class="pseudo">Ludotheque.Api
├── Controllers   les contrôleurs d'API
├── Services      la logique métier
├── Data          AppDbContext (EF Core)
├── Models        les entités
└── DTOs          objets d'échange</pre>
<div class="tip">Cette séparation rend le code <strong>testable</strong> (on peut vérifier le service sans vraie base de données), <strong>évolutif</strong> (changer de base n'oblige pas à réécrire la partie web) et <strong>clair</strong> (chaque fichier a un rôle unique). C'est le squelette de tout le projet. L'<strong>injection de dépendances</strong> d'ASP.NET Core — un mécanisme qui fournit automatiquement à chaque couche les outils dont elle a besoin, au lieu qu'elle les fabrique elle-même, un peu comme un intendant qui livre à chaque cuisinier ses ustensiles — reliera ces couches toute seule.</div>
`,
  exercises: [

    { type: "qcm", q: "L'application construite est…", opts: ["Un jeu vidéo en 3D temps réel", "La Ludothèque (achat et location de jeux)", "Un réseau social de partage de photos", "Un système d'exploitation complet"], a: 1, exp: "Le fil rouge commun." },
    { type: "qcm", q: "Combien de profils utilisateurs ?", opts: ["Deux", "Trois : client, vendeur, administrateur", "Un seul", "Cinq"], a: 1, exp: "Trois rôles." },

    { type: "qcm", q: "La couche qui reçoit les requêtes HTTP :", opts: ["DbContext", "Controller", "Model", "Service"], a: 1, exp: "Le web/controller." },
    { type: "qcm", q: "La couche des règles métier :", opts: ["Controller", "Service", "DbContext", "DTO"], a: 1, exp: "Le service." },
    { type: "qcm", q: "La couche qui lit/écrit en base :", opts: ["Service", "DbContext (EF Core)", "Controller", "DTO"], a: 1, exp: "Persistance." },
    { type: "qcm", q: "La règle d'or des couches :", opts: ["Le controller écrit en base directement", "Le controller passe par le service, jamais par la base", "Tout dans une classe", "Pas de service"], a: 1, exp: "Chaque couche ne connaît que la suivante." },
    { type: "qcm", q: "Un DTO sert à…", opts: ["Ranger directement les données en base", "Échanger avec le client sans exposer les entités", "Trier les résultats d'une requête", "Chiffrer les échanges réseau du serveur"], a: 1, exp: "Objet d'échange." },
    { type: "qcm", q: "Un avantage des couches :", opts: ["Beaucoup de code dupliqué un peu partout", "Code testable, évolutif et clair", "Aucun bénéfice réel pour la maintenance", "Une application sensiblement plus lente"], a: 1, exp: "Séparation des responsabilités." },
    { type: "vf", q: "Le flux typique est HTTP → Controller → Service → DbContext → base.", a: true, exp: "Le trajet d'une requête." },
    { type: "qcm", q: "Les entités sont dans le dossier…", opts: ["Controllers", "Models", "Data", "DTOs"], a: 1, exp: "Le modèle." },
    { type: "vf", q: "Séparer les couches permet de tester le service sans base réelle.", a: true, exp: "Testabilité." },
    { type: "qcm", q: "Le vendeur, dans la Ludothèque…", opts: ["Gère les stocks", "Supprime les comptes des autres utilisateurs", "N'a aucune action dans l'application", "Paie lui-même les jeux du catalogue"], a: 0, exp: "Gestion du stock." },
    { type: "qcm", q: "Ce qui relie les couches automatiquement :", opts: ["Un branchement écrit à la main dans chaque classe", "L'injection de dépendances d'ASP.NET Core", "Un fichier XML de configuration édité à la main", "Les feuilles de style CSS de l'interface"], a: 1, exp: "DI intégrée." }
  ],
  final: {
    title: "Exercice final — Placer chaque responsabilité",
    intro: `<p>On répartit les responsabilités dans les bonnes couches.</p>`,
    questions: [
      { type: "qcm", q: "« Vérifier que le stock est suffisant » va dans…", opts: ["Le controller", "Le service (règle métier)", "Le DbContext", "Le DTO"], a: 1, exp: "Logique métier." },
      { type: "qcm", q: "« Répondre à GET /api/jeux » va dans…", opts: ["Le service", "Le controller", "Le DbContext", "Le model"], a: 1, exp: "Le web." },
      { type: "qcm", q: "« _db.Jeux.Where(...) » relève de…", opts: ["Le controller", "Le DbContext / la couche données", "Le DTO", "Les feuilles de style CSS de la page"], a: 1, exp: "Accès aux données." },
      { type: "qcm", q: "« La classe Jeu avec ses propriétés » est…", opts: ["Un controller", "Une entité du dossier Models", "Un test", "Un service"], a: 1, exp: "Le model." },
      { type: "vf", q: "Un DTO évite d'exposer directement l'entité au client.", a: true, exp: "Découplage." }
    ],
    solution: `<pre class="pseudo">Ludotheque.Api
├── Controllers/JeuxController   → GET /api/jeux
├── Services/CatalogueService    → règles (stock, disponibilité)
├── Data/AppDbContext            → LINQ/SQL sur SQL Server
├── Models/Jeu                   → l'entité
└── DTOs/JeuDto                  → ce qu'on renvoie au client

// Flux : HTTP → Controller → Service → DbContext → SQL Server</pre>
<p>L'architecture est posée. Demain : créer le projet et le connecter à SQL Server.</p>`
  }
};
</script>
