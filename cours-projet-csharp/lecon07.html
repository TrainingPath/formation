  theory: `
<h3>1. Le contrôleur d'API</h3>
<p>Un <strong>contrôleur</strong> (controller) est la classe qui reçoit les requêtes web et renvoie les réponses : le comptoir de l'application. Une <strong>API REST</strong> est une façon standard d'offrir des services sur le web, où chaque « chose » (un jeu, une catégorie) est une <strong>ressource</strong> accessible à une adresse. Les lignes entre crochets comme <code>[ApiController]</code> sont des <strong>attributs</strong> : de petites étiquettes posées sur le code pour lui donner un comportement spécial.</p>
<pre class="pseudo">[ApiController]                                      // attribut : active les comportements d'API (validation, binding)
[Route("api/[controller]")]                          // fixe l'URL de base ; [controller] devient "jeux" → /api/jeux
public class JeuxController : ControllerBase {        // contrôleur des jeux ; hérite de ControllerBase (outils d'API)
    private readonly CatalogueService _service;       // le service métier, injecté et fixé
    public JeuxController(CatalogueService s) =&gt; _service = s;   // constructeur : reçoit le service
}</pre>
<p><code>[ApiController]</code> active la <strong>validation automatique</strong> (vérifier que les données reçues sont correctes) et le <strong>binding</strong> (« liaison » : remplir automatiquement les paramètres de la méthode à partir de la requête). <code>[Route("api/[controller]")]</code> fixe l'<strong>URL</strong> (l'adresse web) du contrôleur : le mot <code>[controller]</code> est remplacé par le nom sans le suffixe, donnant ici <code>/api/jeux</code>.</p>

<h3>2. Les verbes et attributs</h3>
<p>Chaque <strong>verbe HTTP</strong> exprime une intention (lire, créer, modifier, supprimer) ; on l'associe à une méthode via un attribut :</p>
<pre class="pseudo">[HttpGet]           lister
[HttpGet("{id}")]   consulter
[HttpPost]          créer
[HttpPut("{id}")]   modifier
[HttpDelete("{id}")] supprimer</pre>
<p>La partie <code>{id}</code> dans l'adresse est un <strong>paramètre de route</strong> : un emplacement variable dans l'URL (par exemple <code>/api/jeux/5</code>), dont la valeur (5) sera transmise à la méthode. C'est comme un numéro de chambre dans une adresse d'hôtel.</p>

<h3>3. Le DTO : ne pas exposer l'entité</h3>
<pre class="pseudo">public record JeuDto(int Id, string Titre, decimal PrixLocation, bool Disponible);  // DTO : vue simplifiée d'un jeu, exposée par l'API</pre>
<p>Rappel : un <strong>DTO</strong> (Data Transfer Object) est une version épurée de la fiche, faite pour le client. Un <strong>record</strong> est un type C# léger et <strong>immuable</strong> (une fois créé, on ne le modifie plus), idéal pour transporter des données. Le <strong>DTO</strong> choisit précisément ce que l'API montre — ici une disponibilité <em>calculée</em> — sans divulguer les stocks internes ni le prix d'achat.</p>

<h3>4. Les actions</h3>
<p>Une <strong>action</strong> est une méthode du contrôleur qui répond à une requête :</p>
<pre class="pseudo">[HttpGet]                                            // répond à GET /api/jeux (lister tous les jeux)
public async Task&lt;IEnumerable&lt;JeuDto&gt;&gt; Lister() =&gt;    // renvoie une collection de JeuDto
    (await _service.TousLesJeuxAsync())              // récupère tous les jeux via le service
    .Select(j =&gt; new JeuDto(j.Id, j.Titre, j.PrixLocation, j.StockLocation &gt; 0));  // convertit chaque jeu en DTO (Disponible = stock>0)

[HttpGet("{id}")]                                    // répond à GET /api/jeux/{id} (consulter un jeu)
public async Task&lt;ActionResult&lt;JeuDto&gt;&gt; Un(int id) {  // le {id} de l'URL arrive dans le paramètre id
    var j = await _service.ParIdAsync(id);           // récupère le jeu (erreur s'il est introuvable)
    return new JeuDto(j.Id, j.Titre, j.PrixLocation, j.StockLocation &gt; 0);  // renvoie sa version DTO
}</pre>
<p><code>IEnumerable&lt;JeuDto&gt;</code> désigne « une série de JeuDto que l'on peut parcourir » (une collection). <code>ActionResult&lt;JeuDto&gt;</code> permet de renvoyer soit un DTO, soit un code d'erreur (comme 404). <code>Select</code> transforme chaque jeu en son DTO, comme une chaîne de montage qui emballe chaque produit.</p>

<h3>5. Les bons codes HTTP</h3>
<p>À chaque réponse, le serveur joint un <strong>code HTTP</strong> : un numéro normalisé qui résume le résultat, compris par tous les navigateurs :</p>
<pre class="pseudo">Ok(data)                 200
CreatedAtAction(...)     201 (après une création)
NotFound()               404
BadRequest()             400
Forbid()                 403</pre>
<div class="tip">200 = « tout va bien », 201 = « créé », 400 = « ta demande est mal formée », 403 = « interdit », 404 = « introuvable ». Une API REST bien faite parle par ses <strong>codes HTTP</strong> et ses <strong>DTO stables</strong> : le client (page web, appli mobile…) sait toujours à quoi s'attendre, quels que soient les changements internes. On gérera les erreurs (400/404) proprement demain.</div>
`,
