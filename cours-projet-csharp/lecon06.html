<h3>1. Le rôle du service</h3>
<p>Le <strong>service</strong> est la couche qui contient la <strong>logique métier</strong> : les décisions et les règles propres à l'activité (peut-on louer ? reste-t-il du stock ? quel prix ?), indépendamment de la façon dont elles sont demandées (web) ou stockées (base). C'est le cerveau de l'application. Il utilise le <code>DbContext</code> pour lire/écrire et applique les règles de la Ludothèque.</p>
<pre class="pseudo">public class CatalogueService {                     // classe service : le cerveau du catalogue
    private readonly AppDbContext _db;              // référence vers la base ; "readonly" = fixée une fois, ne change plus
    public CatalogueService(AppDbContext db) =&gt; _db = db;  // constructeur : reçoit le DbContext et le range dans _db
    // méthodes métier…                             // (les décisions viendront ici)
}</pre>
<p>Le <strong>constructeur</strong> est la méthode spéciale exécutée à la création de l'objet, comme le formulaire rempli à l'ouverture d'un compte. Ici il reçoit le <code>AppDbContext</code> tout prêt et le garde dans le champ <code>_db</code>. Le mot <code>private</code> veut dire « réservé à l'intérieur de la classe » (personne dehors n'y touche) ; <code>readonly</code> (« en lecture seule ») garantit qu'une fois reçu, ce lien vers la base ne sera plus remplacé.</p>

<h3>2. L'injection de dépendances</h3>
<p>On ne fabrique pas le service à la main : on le déclare une fois, et ASP.NET Core le fournit automatiquement là où il faut (c'est l'<strong>injection de dépendances</strong>).</p>
<pre class="pseudo">// Program.cs                                       // fichier de démarrage de l'application
builder.Services.AddScoped&lt;CatalogueService&gt;();     // enregistre le service dans le conteneur d'injection</pre>
<p>On enregistre le service ; ASP.NET Core l'injecte ensuite dans les contrôleurs qui en ont besoin. <code>AddScoped</code> signifie « <strong>une instance par requête HTTP</strong> » (une <strong>instance</strong> = un exemplaire de l'objet créé en mémoire) : chaque demande d'un utilisateur reçoit son propre service tout neuf, réutilisé pendant toute la durée de cette demande, exactement comme le DbContext.</p>

<h3>3. Des méthodes qui portent le sens métier</h3>
<p>On nomme les méthodes avec le vocabulaire du métier, pour que le code se lise comme une phrase :</p>
<pre class="pseudo">public Task&lt;List&lt;Jeu&gt;&gt; JeuxLouablesAsync() =&gt;                 // méthode "les jeux louables" ; renvoie (plus tard) une liste de Jeu
    _db.Jeux.Where(j =&gt; j.StockLocation &gt; 0).ToListAsync();  // filtre ceux dont le stock de location > 0, puis exécute

public async Task&lt;Jeu&gt; ParIdAsync(int id) =&gt;                 // méthode "le jeu par son numéro (id)"
    await _db.Jeux.FindAsync(id)                            // cherche le jeu par sa clé primaire
        ?? throw new KeyNotFoundException("Jeu introuvable");  // s'il n'existe pas (résultat vide), lève une erreur explicite</pre>
<p>Un <strong>Task</strong> est une « promesse de résultat » pour un travail asynchrone : la méthode promet de fournir plus tard une <code>List&lt;Jeu&gt;</code> ou un <code>Jeu</code>. La flèche <code>=&gt;</code> ici est un raccourci d'écriture (méthode « sur une expression ») : le corps de la méthode tient en une seule expression. <code>FindAsync(id)</code> cherche une fiche par sa <strong>clé primaire</strong> et renvoie « rien » (null) si elle n'existe pas. L'opérateur <code>??</code> se lit « sinon » : « prends le jeu trouvé, <em>sinon</em> lève une exception ». Une <strong>exception</strong> est un signal d'erreur qui interrompt le cours normal, comme tirer la sonnette d'alarme quand quelque chose cloche.</p>

<h3>4. Une transaction quand plusieurs écritures sont liées</h3>
<pre class="pseudo">public async Task AjouterStockLocationAsync(int id, int quantite) {   // ajoute "quantite" au stock de location du jeu "id"
    var jeu = await _db.Jeux.FindAsync(id) ?? throw new KeyNotFoundException();  // récupère le jeu, ou erreur s'il est absent
    jeu.StockLocation += quantite;                                   // augmente son stock de location (+= : ajoute à l'existant)
    await _db.SaveChangesAsync();   // transaction implicite                     // enregistre le changement en base
}</pre>
<p>Une <strong>transaction</strong> regroupe des écritures qui doivent réussir ensemble ou pas du tout. Pour une seule opération, <code>SaveChangesAsync</code> suffit (il crée une transaction <em>implicite</em>, automatique). <code>+=</code> est un raccourci : <code>jeu.StockLocation += quantite</code> veut dire <code>jeu.StockLocation = jeu.StockLocation + quantite</code>. Pour plusieurs écritures liées (louer, acheter), on ouvrira une transaction <strong>explicite</strong> (leçon 12).</p>

<h3>5. Pourquoi pas dans le controller ?</h3>
<div class="warn">Mettre la logique dans le <strong>controller</strong> (la couche d'accueil des requêtes web) le rendrait gros, non réutilisable et difficile à tester. En isolant les règles dans le service, on peut le tester sans passer par le web (leçon 17) et le réutiliser depuis l'API <em>et</em> depuis les pages du site.</div>
<div class="tip">Règle simple : le controller traduit HTTP ↔ appels de méthodes ; le service décide ; le DbContext persiste (enregistre durablement). Les durées de vie (<code>Scoped</code> = « par requête ») garantissent une cohérence à l'intérieur de chaque requête.</div>

  ],

        await _db.Jeux.FindAsync(id) ?? throw new KeyNotFoundException();  // trouvé, sinon erreur

}
// Program.cs : builder.Services.AddScoped&lt;CatalogueService&gt;();   // enregistre le service (une instance par requête)</pre>
<p>Le cœur métier est en place. Demain : l'exposer via une API REST.</p>`
