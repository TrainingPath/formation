<script>
var DAY = {
  num: 11,
  title: "LET et LAMBDA : créer ses propres fonctions",
  subtitle: "Nommer ses calculs intermédiaires et fabriquer de vraies fonctions maison, sans une ligne de VBA.",
  theory: `
<h3>1. Le problème : la formule illisible</h3>
<p>Tôt ou tard, une formule ressemble à ça :</p>
<pre class="pseudo">=SI(ESTERREUR(RECHERCHEX(A2;Base[Ref];Base[Prix]));0;
     RECHERCHEX(A2;Base[Ref];Base[Prix])*1,21)
   // le RECHERCHEX est ecrit DEUX fois : illisible ET calcule deux fois</pre>
<p>Deux défauts : on ne comprend plus rien, et Excel refait deux fois le même travail. C'est exactement ce que LET corrige.</p>

<h3>2. LET : donner un nom à un calcul intermédiaire</h3>
<p><span class="tag">365</span> <strong>LET</strong> (Excel 365 et 2021) déclare des <strong>variables</strong> internes à la formule. Une variable est simplement un nom qui remplace un morceau de calcul. Le dernier argument est toujours le <strong>résultat renvoyé</strong>.</p>
<pre class="pseudo">=LET(nom1 ; valeur1 ; [nom2 ; valeur2 ; ...] ; resultat)
   nom1      un nom que tu inventes (sans espace, ne doit pas ressembler a A1)
   valeur1   le calcul que ce nom represente
   resultat  l'expression finale, qui peut utiliser tous les noms declares</pre>
<pre class="pseudo">=LET(
    prix ; RECHERCHEX(A2 ; Base[Ref] ; Base[Prix]) ;
    SI(ESTNA(prix) ; 0 ; prix * 1,21)
)
   prix      calcule UNE SEULE FOIS
   ligne 3   le resultat, qui reutilise "prix" deux fois sans le recalculer
   // plus lisible ET plus rapide</pre>
<div class="tip">Un nom déclaré peut servir à déclarer le suivant : <code>=LET(ht;B2*C2 ; tva;ht*0,21 ; ht+tva)</code>. On construit son calcul par étapes, comme un raisonnement.</div>
<div class="warn">LET compte toujours un nombre <strong>impair</strong> d'arguments : des paires nom/valeur, puis le résultat seul. Un nombre pair provoque une erreur. Attention aussi aux noms choisis : un nom qui ressemble à une référence de cellule (<code>A1</code>, <code>C4</code>) est refusé. Préfère des noms parlants comme <code>total</code> ou <code>tauxTVA</code>.</div>

<h3>3. LAMBDA : fabriquer une fonction personnalisée</h3>
<p>Une <strong>fonction personnalisée</strong> est une formule à laquelle tu donnes un nom et des <strong>paramètres</strong>, pour la réutiliser partout comme SOMME ou RECHERCHEX. <span class="tag">365</span> <strong>LAMBDA</strong> permet de la créer sans VBA, sans macro, dans un fichier .xlsx classique.</p>
<pre class="pseudo">=LAMBDA(param1 ; [param2 ; ...] ; calcul)
   param1   un nom de parametre (l'argument que l'utilisateur fournira)
   calcul   ce que la fonction doit faire avec ces parametres</pre>
<p>Écrite seule dans une cellule, LAMBDA renvoie <code>#CALC!</code> : c'est normal, une fonction sans arguments ne produit rien. Deux façons de l'utiliser.</p>
<pre class="pseudo">Test immediat (appel direct) : on ajoute les arguments entre parentheses
=LAMBDA(x ; y ; x*y)(3 ; 4)      // renvoie 12
   LAMBDA(x;y;x*y)   la definition
   (3;4)             les valeurs donnees a x et y</pre>

<h3>4. Enregistrer sa fonction dans le Gestionnaire de noms</h3>
<p>Pour l'utiliser vraiment, il faut la <strong>nommer</strong> : <code>Formules ▸ Gestionnaire de noms ▸ Nouveau</code>, puis dans <em>Fait référence à</em>, coller la LAMBDA (sans arguments d'appel).</p>
<pre class="pseudo">Nom          : TVA
Fait ref. a  : =LAMBDA(montant ; taux ; montant * (1 + taux))

Utilisation dans n'importe quelle cellule :
=TVA(B2 ; 0,21)      // exactement comme une fonction native</pre>
<div class="tip">Renseigne le champ <em>Commentaire</em> du Gestionnaire de noms : ce texte apparaîtra en infobulle quand tu tapes le nom de ta fonction. Ta fonction maison devient auto-documentée.</div>
<div class="warn">Une LAMBDA nommée vit dans <strong>le classeur</strong> où elle est définie. Pour la partager, il faut copier la feuille dans l'autre classeur, ou passer par un fichier modèle. Les collègues sur Excel 2019 ou antérieur verront <code>#NOM?</code> : LAMBDA n'existe que sur 365 et 2021. Pour eux, il faut réécrire la formule complète ou passer par VBA.</div>

<h3>5. LET et LAMBDA ensemble</h3>
<p>Le duo naturel : LAMBDA définit l'enveloppe, LET organise le calcul à l'intérieur.</p>
<pre class="pseudo">Nom : REMISE
=LAMBDA(prix ; qte ;
    LET(
        total   ; prix * qte ;
        taux    ; SI(qte &gt;= 100 ; 0,15 ; SI(qte &gt;= 50 ; 0,10 ; 0)) ;
        total * (1 - taux)
    )
)
   prix, qte   les parametres de la fonction
   total       calcul intermediaire nomme
   taux        remise par paliers
   derniere ligne = le resultat renvoye

=REMISE(12 ; 120)     // 12 x 120 = 1440, remise 15% -> 1224</pre>

<h3>6. Les fonctions compagnes : BYROW, BYCOL, MAP, REDUCE, SCAN</h3>
<p><span class="tag">365</span> Ces fonctions prennent une LAMBDA en argument et l'appliquent à toute une plage. Elles suppriment le besoin de recopier une formule ligne par ligne.</p>
<pre class="pseudo">=BYROW(plage ; LAMBDA(ligne ; calcul))   // un resultat par LIGNE
=BYCOL(plage ; LAMBDA(col ; calcul))     // un resultat par COLONNE
=MAP(plage ; LAMBDA(v ; calcul))         // transforme chaque cellule
=REDUCE(depart ; plage ; LAMBDA(acc ; v ; calcul))  // cumule en une valeur unique
=SCAN(depart ; plage ; LAMBDA(acc ; v ; calcul))    // comme REDUCE mais garde
                                                     // toutes les etapes</pre>
<pre class="pseudo">=BYROW(B2:D10 ; LAMBDA(l ; SOMME(l)))
   B2:D10          la plage traitee
   LAMBDA(l;...)   "l" represente chaque ligne, une par une
   SOMME(l)        le calcul applique a cette ligne
   // renvoie 9 totaux, en plage renversante (spill)

=SCAN(0 ; B2:B10 ; LAMBDA(cumul ; v ; cumul + v))
   0        la valeur de depart de l'accumulateur
   cumul    le total accumule jusqu'ici
   v        la valeur courante
   // produit un CUMUL PROGRESSIF sur toute la colonne</pre>
<div class="warn">Une LAMBDA peut s'appeler elle-même (<strong>récursivité</strong>) si elle est nommée. C'est puissant mais risqué : sans condition d'arrêt, Excel boucle jusqu'à saturer la mémoire. Prévois toujours un <code>SI</code> qui met fin à la récursion.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert principalement LET ?", opts: ["À trier des données", "À nommer des calculs intermédiaires dans une formule", "À créer un graphique", "À protéger une cellule"], a: 1, exp: "LET déclare des variables : formule plus lisible et calculée une seule fois." },
    { type: "input", q: "Écris un LET qui nomme « ht » le produit B2*C2 et renvoie ht*1,21.", a: ["=LET(ht;B2*C2;ht*1,21)"], ph: "=LET(ht;B2*C2;...)", exp: "Paires nom/valeur, puis le résultat en dernier argument." },
    { type: "qcm", q: "Combien d'arguments compte toujours un LET ?", opts: ["Un nombre pair", "Un nombre impair", "Exactement 3", "Au maximum 4"], a: 1, exp: "N paires nom/valeur + 1 résultat final = nombre impair." },
    { type: "vf", q: "Dans LET, une variable déjà déclarée peut être réutilisée pour en définir une autre.", a: true, exp: "Les déclarations se lisent de gauche à droite : on construit par étapes." },
    { type: "input", q: "Écris une LAMBDA qui multiplie deux paramètres x et y, appelée directement avec 3 et 4.", a: ["=LAMBDA(x;y;x*y)(3;4)"], ph: "=LAMBDA(x;y;x*y)(3;4)", exp: "Les arguments d'appel se placent entre parenthèses juste après la définition." },
    { type: "qcm", q: "Que renvoie une LAMBDA écrite seule dans une cellule, sans arguments d'appel ?", opts: ["0", "#CALC!", "#NOM?", "VRAI"], a: 1, exp: "#CALC! : la définition existe mais aucun argument ne lui a été fourni." },
    { type: "qcm", q: "Où enregistre-t-on une LAMBDA pour l'utiliser comme une fonction native ?", opts: ["Dans l'éditeur VBA", "Dans Formules ▸ Gestionnaire de noms", "Dans les options d'Excel", "Dans un TCD"], a: 1, exp: "On lui donne un nom, et la formule s'utilise ensuite partout dans le classeur." },
    { type: "vf", q: "Créer une LAMBDA nommée oblige à enregistrer le fichier au format .xlsm.", a: false, exp: "Aucune macro n'est impliquée : un .xlsx classique suffit." },
    { type: "input", q: "Écris la formule qui somme chaque LIGNE de B2:D10 avec BYROW.", a: ["=BYROW(B2:D10;LAMBDA(l;SOMME(l)))"], ph: "=BYROW(plage;LAMBDA(...))", exp: "BYROW applique la LAMBDA à chaque ligne et renvoie une plage renversante." },
    { type: "qcm", q: "Quelle fonction produit un cumul progressif en conservant toutes les étapes ?", opts: ["REDUCE", "SCAN", "MAP", "BYCOL"], a: 1, exp: "REDUCE ne renvoie que le résultat final ; SCAN renvoie chaque étape intermédiaire." },
    { type: "input", q: "Écris la formule qui calcule le cumul progressif de B2:B10 avec SCAN (départ 0).", a: ["=SCAN(0;B2:B10;LAMBDA(cumul;v;cumul+v))"], ph: "=SCAN(0;B2:B10;LAMBDA(...))", exp: "L'accumulateur part de 0 et s'incrémente de chaque valeur." },
    { type: "vf", q: "Un collègue sur Excel 2019 pourra utiliser ta fonction LAMBDA normalement.", a: false, exp: "Il verra #NOM? : LAMBDA n'existe que sur Microsoft 365 et Excel 2021." },
    { type: "qcm", q: "Quel est le second bénéfice de LET, en plus de la lisibilité ?", opts: ["Il transforme automatiquement les formules en valeurs", "Il évite de recalculer plusieurs fois la même expression", "Il trie automatiquement", "Il empêche toute erreur de saisie"], a: 1, exp: "Un calcul nommé n'est évalué qu'une fois, même s'il sert dix fois." },
    { type: "input", q: "Écris la formule qui transforme chaque valeur de A2:A10 en son carré avec MAP.", a: ["=MAP(A2:A10;LAMBDA(v;v^2))"], ph: "=MAP(A2:A10;LAMBDA(v;...))", exp: "MAP applique la LAMBDA cellule par cellule." },
    { type: "qcm", q: "Quel danger guette une LAMBDA récursive ?", opts: ["Elle corrompt le fichier", "Sans condition d'arrêt, elle boucle et sature la mémoire", "Elle supprime des lignes", "Elle renvoie automatiquement 0"], a: 1, exp: "Toute récursivité doit contenir un SI qui met fin à l'appel." }
  ],
  final: {
    title: "Exercice final — Une fonction maison de calcul de commission",
    intro: `<p>Le service commercial applique des commissions par paliers sur le chiffre d'affaires, avec un bonus si l'objectif est atteint. La règle est utilisée dans dix classeurs différents : il faut en faire une fonction.</p>
<pre class="pseudo">      A          B         C          D
  1  Vendeur    CA        Objectif   Commission
  2  Alice      120000    100000
  3  Bruno       45000     60000
  4  Chloe       82000     80000

  Regle : 3 % jusqu'a 50 000 ; 5 % au-dela ;
          + 1 000 EUR de bonus si CA >= Objectif.</pre>`,
    questions: [
      { type: "input", q: "En D2, écris un LET qui nomme « base » le calcul SI(B2>50000;B2*0,05;B2*0,03) et renvoie base + le bonus de 1000 si B2>=C2.", a: ["=LET(base;SI(B2>50000;B2*0,05;B2*0,03);base+SI(B2>=C2;1000;0))"], ph: "=LET(base;SI(...);base+SI(...))", exp: "Le calcul du taux est nommé une fois, puis réutilisé dans le résultat final." },
      { type: "qcm", q: "Quel avantage LET apporte-t-il ici par rapport à une formule imbriquée classique ?", opts: ["Il convertit automatiquement le résultat en texte", "Il rend la logique lisible et n'évalue « base » qu'une fois", "Il verrouille la cellule", "Il crée un graphique"], a: 1, exp: "Lisibilité et performance : les deux bénéfices de LET." },
      { type: "input", q: "Transforme ce calcul en LAMBDA à deux paramètres ca et obj (formule à coller dans le Gestionnaire de noms).", a: ["=LAMBDA(ca;obj;LET(base;SI(ca>50000;ca*0,05;ca*0,03);base+SI(ca>=obj;1000;0)))"], ph: "=LAMBDA(ca;obj;LET(...))", exp: "LAMBDA fournit l'enveloppe et les paramètres, LET organise le calcul interne." },
      { type: "qcm", q: "Une fois cette LAMBDA enregistrée sous le nom COMMISSION, comment l'appelle-t-on en D2 ?", opts: ["=LAMBDA(COMMISSION;B2;C2)", "=COMMISSION(B2;C2)", "=LET(COMMISSION;B2;C2)", "=APPLIQUER(COMMISSION)"], a: 1, exp: "Elle s'utilise exactement comme une fonction native d'Excel." },
      { type: "vf", q: "Pour appliquer cette fonction aux trois lignes d'un coup sur 365, on peut écrire =COMMISSION(B2:B4;C2:C4).", a: true, exp: "La formule renverse (spill) sur les trois lignes, sans recopie." }
    ],
    solution: `<p>On procède en trois temps : écrire, nommer, appeler.</p>
<pre class="pseudo">Etape 1 -- la formule lisible avec LET, en D2 :
=LET(
    base ; SI(B2 &gt; 50000 ; B2 * 0,05 ; B2 * 0,03) ;
    base + SI(B2 &gt;= C2 ; 1000 ; 0)
)
   base    la commission par palier, calculee UNE fois
   ligne 3 le resultat : base + le bonus eventuel

Etape 2 -- la generaliser en LAMBDA :
=LAMBDA(ca ; obj ;
    LET(
        base ; SI(ca &gt; 50000 ; ca * 0,05 ; ca * 0,03) ;
        base + SI(ca &gt;= obj ; 1000 ; 0)
    )
)
   ca, obj   les parametres : on remplace B2 par ca et C2 par obj
   // c'est la SEULE modification a faire

Etape 3 -- l'enregistrer :
   Formules > Gestionnaire de noms > Nouveau
   Nom          : COMMISSION
   Commentaire  : Commission 3%/5% + bonus 1000 si objectif atteint
   Fait ref. a  : (coller la LAMBDA ci-dessus)

Etape 4 -- l'utiliser :
=COMMISSION(B2 ; C2)                  ligne par ligne
=COMMISSION(B2:B4 ; C2:C4)            365 : une formule, 3 resultats (spill)

Resultats attendus :
  Alice  120000 &gt; 50000 -> 6000 ; CA &gt;= objectif -> +1000 = 7000
  Bruno   45000 &lt;= 50000 -> 1350 ; CA &lt; objectif -> +0    = 1350
  Chloe   82000 &gt; 50000 -> 4100 ; CA &gt;= objectif -> +1000 = 5100</pre>
<p>Si la règle change (5 % devient 6 %), tu modifies la LAMBDA <strong>à un seul endroit</strong> et toutes les cellules du classeur se mettent à jour. C'est le vrai gain : le calcul métier n'est plus dispersé dans des centaines de formules. Pour un collègue sur Excel 2019, il faudra en revanche coller la formule LET complète (ou même la version SI imbriquée), car ni LET ni LAMBDA n'y existent.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta formule / ton code ici…",
  items: [
  { id: "excelpro-j11", lab: {"title":"À reproduire","intro":"Créer une fonction maison PORT(poids;montant) avec LAMBDA et le Gestionnaire de noms.","steps":"1) Formules > Gestionnaire de noms > Nouveau. Nom : PORT.\n2) Fait référence à : «ta formule (voir la consigne)»\n3) Saisis A2=1, B2=50 puis en C2 saisis ta formule (voir la consigne). Teste aussi «ta formule (voir la consigne)» et «ta formule (voir la consigne)».","check":"PORT(1;50) renvoie 5,9 ; PORT(5;50) renvoie 9,9 ; PORT(1;200) renvoie 0 (franco de port)."}, title: "Une fonction maison : frais de port", level: 3,
    statement: "Recopie ce tableau de commandes. Crée une fonction personnalisée PORT(poids ; montant) qui applique la règle suivante : franco de port (0 EUR) si le montant est supérieur ou égal à 150 EUR ; sinon 5,90 EUR jusqu'à 2 kg, 9,90 EUR jusqu'à 10 kg, et au-delà 9,90 EUR plus 0,80 EUR par kilo supplémentaire. Écris d'abord la version LET en D2, puis transforme-la en LAMBDA nommée.<pre class=\"pseudo\">      A        B        C         D\n  1  Cmd      Poids    Montant   Port\n  2  C-001    1,2      89\n  3  C-002    7,5      210\n  4  C-003    14       120\n  5  C-004    0,5      150</pre>",
    hints: [
      "Commence par le cas qui court-circuite tout le reste : le franco de port. Un SI en tête suffit.",
      "Pour le barème au poids, imbrique deux SI. Le troisième cas (au-delà de 10 kg) se calcule : 9,90 + (poids - 10) * 0,80.",
      "Une fois la formule juste avec B2 et C2, remplace B2 par « poids » et C2 par « montant », enveloppe le tout dans LAMBDA(poids ; montant ; ...) et enregistre-la dans le Gestionnaire de noms."
    ],
    solution: "Etape 1 -- la version lisible avec LET, en D2 :\n=LET(\n    franco  ; C2 >= 150 ;\n    bareme  ; SI(B2 <= 2 ; 5,9 ; SI(B2 <= 10 ; 9,9 ; 9,9 + (B2 - 10) * 0,8)) ;\n    SI(franco ; 0 ; bareme)\n)\n   franco   VRAI/FAUX : la commande depasse-t-elle le seuil de gratuite\n   bareme   le tarif calcule selon le poids, en trois paliers\n            SI(B2<=2 ; 5,9 ; ...)              palier 1\n            SI(B2<=10 ; 9,9 ; ...)             palier 2\n            9,9 + (B2-10)*0,8                  palier 3, progressif\n   derniere ligne   le resultat : la gratuite l'emporte sur le bareme\n\nEtape 2 -- la LAMBDA (a coller dans le Gestionnaire de noms) :\n=LAMBDA(poids ; montant ;\n    LET(\n        franco ; montant >= 150 ;\n        bareme ; SI(poids <= 2 ; 5,9 ; SI(poids <= 10 ; 9,9 ; 9,9 + (poids - 10) * 0,8)) ;\n        SI(franco ; 0 ; bareme)\n    )\n)\n   // seule modification : B2 devient poids, C2 devient montant\n\nEtape 3 -- l'enregistrer :\n   Formules > Gestionnaire de noms > Nouveau\n   Nom          : PORT\n   Commentaire  : Frais de port. Franco des 150 EUR, sinon bareme au poids.\n   Fait ref. a  : (coller la LAMBDA)\n\nEtape 4 -- l'utiliser :\n=PORT(B2 ; C2)                 une ligne\n=PORT(B2:B5 ; C2:C5)           365 : une seule formule pour les 4 lignes (spill)\n\nResultats attendus :\n  C-001  1,2 kg / 89 EUR   -> pas franco, poids <= 2   -> 5,90\n  C-002  7,5 kg / 210 EUR  -> FRANCO                   -> 0,00\n  C-003  14 kg / 120 EUR   -> pas franco, > 10 kg      -> 9,9 + 4*0,8 = 13,10\n  C-004  0,5 kg / 150 EUR  -> FRANCO (>= 150, pas >)   -> 0,00\n\nVerification de l'appel direct, sans rien enregistrer :\n=LAMBDA(poids;montant;SI(montant>=150;0;SI(poids<=2;5,9;SI(poids<=10;9,9;9,9+(poids-10)*0,8))))(14;120)\n   // renvoie 13,1 : pratique pour tester avant d'enregistrer",
    note: "Trois pieges. (1) L'ORDRE des tests : le franco doit etre teste EN PREMIER, sinon la commande C-002 paierait le port malgre ses 210 EUR. (2) La ligne C-004 a exactement 150 EUR : la regle dit \"superieur ou egal\", donc >= et non >. Un seul caractere change le resultat. (3) Teste toujours ta LAMBDA par appel direct -- LAMBDA(...)(valeurs) -- AVANT de l'enregistrer : deboguer une formule cachee dans le Gestionnaire de noms est nettement plus penible, car Excel n'affiche qu'un #VALEUR! sans indiquer ou." }
  ]
};
