<script>
var DAY = {
  num: 21,
  title: "Introduction à DAX (mesures et colonnes calculées)",
  subtitle: "Le langage de calcul du modèle : des formules réutilisables et intelligentes.",
  theory: `
<h3>1. Qu'est-ce que DAX ?</h3>
<p><strong>DAX</strong> (<em>Data Analysis Expressions</em>) est le <strong>langage de formules du modèle de données</strong> (Power Pivot dans Excel, et aussi Power BI). Il ressemble aux formules Excel — il y a <code>SUM</code>, <code>AVERAGE</code>, <code>IF</code>… — mais il ne travaille pas sur des cellules : il travaille sur des <strong>colonnes et des tables entières</strong>. On le commente ici avec <code>//</code>.</p>
<div class="warn">Différence de fond : une formule Excel classique dit « prends la cellule A2 ». Une formule DAX dit « prends toute la colonne Ventes[Montant] ». Il n'y a pas de référence de cellule en DAX.</div>
<h3>2. Deux objets à ne pas confondre : colonne calculée vs mesure</h3>
<p>DAX sert à créer deux choses très différentes :</p>
<pre class="pseudo">COLONNE CALCULEE  // calculee LIGNE PAR LIGNE, stockee dans la table, comme une colonne normale
                  // ex. une colonne Marge = prix - cout pour CHAQUE ligne
MESURE            // calculee A LA DEMANDE selon le contexte du TCD (agregation)
                  // ex. Total des ventes, qui se recalcule pour chaque region affichee</pre>
<div class="tip">Règle simple : si tu veux une valeur <strong>par ligne</strong> (à réutiliser comme un champ), fais une <strong>colonne calculée</strong>. Si tu veux un <strong>total qui s'adapte</strong> aux filtres et aux lignes du TCD (somme, moyenne, ratio), fais une <strong>mesure</strong>. En pratique, on privilégie les mesures : plus légères, plus souples.</div>
<h3>3. Créer une mesure</h3>
<p>Dans Power Pivot (<strong>Power Pivot ▸ Mesures ▸ Nouvelle mesure</strong>) ou dans la liste des champs du TCD. Une mesure a un <strong>nom</strong>, un signe <code>:=</code>, puis la formule :</p>
<pre class="pseudo">Total Ventes := SUM(Ventes[Montant])          // somme de toute la colonne Montant
Nb Commandes := COUNTROWS(Ventes)             // nombre de lignes de la table Ventes
Ticket Moyen := AVERAGE(Ventes[Montant])      // montant moyen d'une ligne
Total Ventes := SUM ( Ventes[Montant] )       // syntaxe : NomTable[NomColonne]</pre>
<div class="warn">Notation DAX : une colonne s'écrit toujours <code>Table[Colonne]</code> (le nom de la table, puis la colonne entre crochets). Une mesure, elle, se cite entre crochets seuls : <code>[Total Ventes]</code>.</div>
<h3>4. Le contexte de filtre : la clé de DAX</h3>
<p>Une mesure ne renvoie pas un seul chiffre figé : elle se recalcule dans le <strong>contexte</strong> où tu la places. Mets <code>[Total Ventes]</code> dans un TCD avec Région en lignes : DAX filtre automatiquement les ventes de chaque région et affiche le bon total sur chaque ligne. C'est le <strong>contexte de filtre</strong> — le TCD, les segments et les lignes/colonnes définissent quelles données la mesure « voit ».</p>
<h3>5. CALCULATE : modifier le contexte</h3>
<p><strong>CALCULATE</strong> est la fonction reine de DAX : elle évalue une expression <em>en changeant le filtre</em>. Elle prend l'expression, puis des conditions de filtre :</p>
<pre class="pseudo">Ventes Nord := CALCULATE ( [Total Ventes] , Clients[Ville] = "Nord" )
   [Total Ventes]           l'expression a calculer
   Clients[Ville]="Nord"    le filtre impose : on force la ville a Nord
CA 2024 := CALCULATE ( SUM(Ventes[Montant]) , Calendrier[Annee] = 2024 )  // somme filtree sur 2024</pre>
<div class="tip">Avec CALCULATE, on fabrique des indicateurs comparatifs : ventes d'une catégorie, d'une année, hors promotions… tout en gardant une seule table de faits.</div>
<h3>6. Fonctions utiles pour débuter</h3>
<pre class="pseudo">DIVIDE ( a , b )              // division SURE : renvoie vide (ou 0) au lieu d'une erreur si b = 0
Taux Marge := DIVIDE ( [Marge] , [Total Ventes] )   // ratio propre, sans #DIV/0
SUMX ( table , expression )  // somme LIGNE PAR LIGNE puis additionne (calcul exact des ratios)
CA Reel := SUMX ( Ventes , Ventes[Qte] * Ventes[PrixUnit] )   // qte x prix pour chaque ligne, puis somme
COUNTROWS, DISTINCTCOUNT     // compter des lignes / des valeurs distinctes</pre>
<div class="warn">DIVIDE règle proprement la division par zéro — préfère-le à l'opérateur <code>/</code>. Et SUMX est LA réponse au piège du champ calculé vu au jour 19 : il calcule qté × prix sur chaque ligne <em>avant</em> d'additionner, donnant le vrai total.</div>
<p>DAX est un grand langage ; ces briques (SUM, mesures, contexte, CALCULATE, DIVIDE, SUMX) suffisent déjà à bâtir des tableaux de bord solides, dans Excel comme dans Power BI (jour 29).</p>`,
  exercises: [
    { type: "qcm", q: "DAX est le langage de formules…", opts: ["Des cellules d'une feuille", "Du modèle de données (Power Pivot / Power BI)", "Des macros VBA", "De Word"], a: 1, exp: "DAX travaille sur les colonnes et tables du modèle, pas sur des cellules." },
    { type: "qcm", q: "Différence clé entre DAX et une formule Excel classique ?", opts: ["DAX ne fait pas de somme", "DAX travaille sur des colonnes/tables, pas sur des références de cellules", "DAX est plus lent toujours", "Aucune différence"], a: 1, exp: "Pas de A2 en DAX : on manipule des colonnes entières." },
    { type: "input", q: "Écris une mesure DAX « Total Ventes » qui somme la colonne Montant de la table Ventes.", a: ["Total Ventes := SUM(Ventes[Montant])", "Total Ventes:=SUM(Ventes[Montant])", "SUM(Ventes[Montant])", "=SUM(Ventes[Montant])"], ph: "Nom := …", exp: "Total Ventes := SUM(Ventes[Montant])." },
    { type: "qcm", q: "Une colonne calculée est…", opts: ["Calculée à la demande selon le TCD", "Calculée ligne par ligne et stockée dans la table", "Un segment", "Un graphique"], a: 1, exp: "La colonne calculée produit une valeur par ligne, stockée dans la table." },
    { type: "qcm", q: "Une mesure est…", opts: ["Stockée ligne par ligne", "Calculée à la demande selon le contexte de filtre du TCD", "Une couleur", "Un fichier"], a: 1, exp: "La mesure s'adapte aux filtres et aux lignes/colonnes affichées." },
    { type: "vf", q: "En DAX, une colonne s'écrit Table[Colonne] et une mesure se cite [Nom de la mesure].", a: true, exp: "Colonne : Table[Colonne] ; mesure : entre crochets seuls." },
    { type: "input", q: "Fonction DAV… la fonction DAX qui compte le nombre de lignes d'une table ?", a: ["COUNTROWS", "countrows", "COUNTROWS()"], ph: "un mot", exp: "COUNTROWS(Table) renvoie le nombre de lignes de la table." },
    { type: "qcm", q: "Le « contexte de filtre » d'une mesure, c'est…", opts: ["La couleur de la cellule", "L'ensemble des filtres (lignes, colonnes, segments) qui décident des données vues", "Le nom du fichier", "Un type de graphique"], a: 1, exp: "Le contexte définit quelles données la mesure prend en compte." },
    { type: "input", q: "La fonction DAX reine qui évalue une expression EN CHANGEANT le filtre s'appelle… ?", a: ["CALCULATE", "calculate", "CALCULATE()"], ph: "un mot", exp: "CALCULATE modifie le contexte de filtre autour d'une expression." },
    { type: "qcm", q: "À quoi sert DIVIDE(a; b) plutôt que a/b ?", opts: ["C'est plus rapide", "Elle évite l'erreur #DIV/0 quand b vaut 0", "Elle trie", "Elle arrondit"], a: 1, exp: "DIVIDE gère la division par zéro en renvoyant vide (ou une valeur choisie)." },
    { type: "input", q: "Écris une mesure « Taux Marge » = Marge divisée par Total Ventes, avec la division sûre.", a: ["Taux Marge := DIVIDE([Marge],[Total Ventes])", "Taux Marge := DIVIDE([Marge], [Total Ventes])", "DIVIDE([Marge],[Total Ventes])", "DIVIDE([Marge], [Total Ventes])"], ph: "Nom := DIVIDE(…)", exp: "Taux Marge := DIVIDE([Marge], [Total Ventes])." },
    { type: "vf", q: "SUMX calcule une expression ligne par ligne, puis additionne le tout.", a: true, exp: "SUMX(Ventes; Qte*PrixUnit) fait qté×prix par ligne avant de sommer : total exact." },
    { type: "qcm", q: "Pour un CA = quantité × prix unitaire calculé exactement par ligne puis sommé, on utilise…", opts: ["SUM", "SUMX", "COUNTROWS", "IF"], a: 1, exp: "SUMX fait le produit sur chaque ligne avant d'additionner." },
    { type: "qcm", q: "Dans un TCD, on privilégie généralement…", opts: ["Les colonnes calculées partout", "Les mesures (plus légères et souples)", "Aucun calcul", "Uniquement le VBA"], a: 1, exp: "Les mesures s'adaptent au contexte et n'alourdissent pas le modèle." },
    { type: "input", q: "Complète : CALCULATE(SUM(Ventes[Montant]) ; Calendrier[Annee] = ____ ) pour le CA de 2024.", a: ["2024"], ph: "une année", exp: "Le filtre Calendrier[Annee]=2024 restreint la somme à l'année 2024." }
  ],
  final: {
    title: "Exercice final — Premières mesures DAX",
    intro: `<p>Le modèle contient une table de faits Ventes reliée à une table Clients (par CodeClient) et une table Calendrier (par Date).</p>
<pre class="pseudo">Ventes    : Date | CodeClient | Qte | PrixUnit | Montant
Clients   : CodeClient | Nom | Ville
Calendrier: Date | Mois | Trimestre | Annee</pre>
<p>On veut : le total des ventes, le nombre de commandes, le ticket moyen, le CA de la ville Nord, et le CA 2024.</p>`,
    questions: [
      { type: "input", q: "Mesure « Total Ventes » : somme de Ventes[Montant].", a: ["Total Ventes := SUM(Ventes[Montant])", "Total Ventes:=SUM(Ventes[Montant])", "SUM(Ventes[Montant])"], ph: "Nom := …", exp: "Total Ventes := SUM(Ventes[Montant])." },
      { type: "input", q: "Mesure « Nb Commandes » : nombre de lignes de la table Ventes.", a: ["Nb Commandes := COUNTROWS(Ventes)", "Nb Commandes:=COUNTROWS(Ventes)", "COUNTROWS(Ventes)"], ph: "Nom := …", exp: "Nb Commandes := COUNTROWS(Ventes)." },
      { type: "input", q: "Mesure « Ticket Moyen » : moyenne de Ventes[Montant].", a: ["Ticket Moyen := AVERAGE(Ventes[Montant])", "Ticket Moyen:=AVERAGE(Ventes[Montant])", "AVERAGE(Ventes[Montant])"], ph: "Nom := …", exp: "Ticket Moyen := AVERAGE(Ventes[Montant])." },
      { type: "input", q: "Mesure « CA Nord » : le Total Ventes forcé sur Clients[Ville] = Nord (avec CALCULATE).", a: ["CA Nord := CALCULATE([Total Ventes],Clients[Ville]=\"Nord\")", "CA Nord := CALCULATE([Total Ventes], Clients[Ville]=\"Nord\")", "CALCULATE([Total Ventes],Clients[Ville]=\"Nord\")"], ph: "Nom := CALCULATE(…)", exp: "CA Nord := CALCULATE([Total Ventes]; Clients[Ville]=\"Nord\")." },
      { type: "qcm", q: "Pour un CA exact = Qte × PrixUnit sommé sur chaque ligne, quelle fonction ?", opts: ["SUM", "SUMX(Ventes; Ventes[Qte]*Ventes[PrixUnit])", "COUNTROWS", "AVERAGE"], a: 1, exp: "SUMX multiplie par ligne avant de sommer : le vrai total." }
    ],
    solution: `<p>Le jeu de mesures complet (à créer dans Power Pivot ▸ Mesures) :</p>
<pre class="pseudo">Total Ventes := SUM ( Ventes[Montant] )                       // somme de la colonne Montant
Nb Commandes := COUNTROWS ( Ventes )                          // nombre de lignes (commandes)
Ticket Moyen := AVERAGE ( Ventes[Montant] )                   // montant moyen par ligne

CA Nord := CALCULATE ( [Total Ventes] , Clients[Ville] = "Nord" )
   // reutilise Total Ventes, mais force le filtre Ville = Nord

CA 2024 := CALCULATE ( [Total Ventes] , Calendrier[Annee] = 2024 )
   // meme total, filtre sur l'annee 2024

CA Reel := SUMX ( Ventes , Ventes[Qte] * Ventes[PrixUnit] )   // qte x prix par LIGNE puis somme
Taux Marge := DIVIDE ( [Marge] , [Total Ventes] )             // ratio sur, sans #DIV/0</pre>
<p>Points clés : une mesure se recalcule selon le <strong>contexte</strong> (mets [Total Ventes] avec Ville en lignes, il se ventile tout seul) ; <strong>CALCULATE</strong> impose un filtre ; <strong>SUMX</strong> calcule ligne par ligne ; <strong>DIVIDE</strong> sécurise les ratios. Ces mêmes mesures se réutilisent tels quels dans Power BI (jour 29).</p>`
  }
};
</script>
