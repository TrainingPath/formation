<script>
var DAY = {
  num: 17,
  title: "Power Query : fusionner et ajouter des requêtes",
  subtitle: "Combiner plusieurs tableaux automatiquement, sans copier-coller.",
  theory: `
<h3>1. Qu'est-ce qu'une requête ?</h3>
<p><strong>Power Query</strong> est l'outil intégré d'Excel qui sert à <em>récupérer, nettoyer et transformer</em> des données avant de les poser dans une feuille. Une <strong>requête</strong> (en anglais <em>query</em>) est une <strong>suite d'étapes enregistrées</strong> : « va chercher ce fichier, supprime cette colonne, filtre ces lignes… ». Tu la définis une fois ; ensuite, d'un simple clic sur <strong>Actualiser</strong>, Power Query rejoue toutes les étapes sur les données à jour. C'est la grande différence avec un copier-coller : le copier-coller est figé, une requête est <strong>rejouable</strong>.</p>
<p>On ouvre l'éditeur par <strong>Données ▸ Récupérer des données</strong> (ou <strong>Données ▸ Requêtes et connexions</strong> pour revoir les requêtes existantes). Chaque transformation ajoute une ligne dans le volet <strong>Étapes appliquées</strong>, à droite.</p>
<div class="tip">Sous le capot, Power Query écrit un petit langage appelé <strong>M</strong>. Tu n'as pas besoin de le taper : les boutons du ruban le génèrent pour toi. On le commente ici avec <code>//</code>.</div>
<h3>2. Ajouter (Append) : empiler des lignes</h3>
<p><strong>Ajouter</strong> des requêtes, c'est <strong>empiler</strong> deux tableaux qui ont les <em>mêmes colonnes</em> pour n'en faire qu'un plus long. Exemple typique : les ventes de janvier et les ventes de février, dans deux tableaux identiques, que tu veux réunir en un seul.</p>
<pre class="pseudo">Ventes_Janvier :  Date | Produit | Montant       // 40 lignes
Ventes_Fevrier :  Date | Produit | Montant       // 35 lignes
--> Ajouter --> Ventes_Total : 75 lignes empilees // mêmes colonnes, lignes cumulees</pre>
<p>Chemin ruban : <strong>Données ▸ Récupérer des données ▸ Combiner les requêtes ▸ Ajouter</strong> (ou, dans l'éditeur : <strong>Accueil ▸ Ajouter des requêtes</strong>). On choisit « deux tables » ou « trois tables ou plus ».</p>
<div class="warn">Pour un Ajouter propre, les colonnes doivent porter le <strong>même nom</strong> dans les deux requêtes. Si une colonne existe d'un seul côté, Power Query la garde mais la remplit avec <code>null</code> (valeur vide) pour les lignes de l'autre table.</div>
<h3>3. Fusionner (Merge) : accoler des colonnes par une clé</h3>
<p><strong>Fusionner</strong>, c'est tout autre chose : on <strong>rapproche deux tableaux différents</strong> grâce à une <strong>clé commune</strong> (une colonne partagée, comme un code client). C'est l'équivalent Power Query d'une RECHERCHEX, mais pour des tables entières. On parle de <strong>jointure</strong> (en anglais <em>join</em>).</p>
<pre class="pseudo">Commandes : CodeClient | Montant           // la clé = CodeClient
Clients   : CodeClient | Nom | Ville       // même clé
--> Fusionner sur CodeClient -->
Commandes enrichies : CodeClient | Montant | Nom | Ville   // colonnes accolees</pre>
<p>Chemin ruban : <strong>Données ▸ Combiner les requêtes ▸ Fusionner</strong>. On sélectionne la colonne clé dans chaque table, puis le <strong>type de jointure</strong>.</p>
<h3>4. Les types de jointure</h3>
<p>Le type de jointure décide <em>quelles lignes on garde</em> quand une clé n'a pas de correspondance de l'autre côté :</p>
<pre class="pseudo">Externe gauche  // TOUTES les lignes de gauche + les correspondances de droite (le plus courant)
Externe droite  // toutes les lignes de droite + les correspondances de gauche
Interne         // SEULEMENT les lignes qui existent des DEUX côtés
Anti gauche     // seulement les lignes de gauche SANS correspondance à droite (utile pour trouver les manquants)</pre>
<div class="tip">Après une fusion, la colonne ajoutée apparaît « repliée » (une table dans une cellule). Clique sur l'icône <strong>⇔ (Développer)</strong> en haut de cette colonne pour choisir quelles colonnes de la table de droite afficher.</div>
<h3>5. Charger le résultat</h3>
<p>Une fois les étapes prêtes, <strong>Accueil ▸ Fermer et charger</strong> renvoie le résultat dans Excel. <strong>Fermer et charger dans…</strong> laisse choisir la destination : un tableau dans une feuille, un simple <em>Tableau croisé dynamique</em>, ou une <strong>connexion seule</strong> (les données restent dans le modèle sans occuper de feuille). Ensuite, <strong>Données ▸ Actualiser tout</strong> rejoue la requête quand les sources changent.</p>
<div class="warn">Ajouter empile des LIGNES (tables de même structure) ; Fusionner accole des COLONNES (tables reliées par une clé). Confondre les deux est l'erreur classique du débutant en Power Query.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une requête Power Query ?", opts: ["Une simple copie de cellules", "Une suite d'étapes enregistrées et rejouables à l'actualisation", "Un graphique", "Une macro VBA"], a: 1, exp: "Une requête mémorise les transformations et les rejoue sur les données à jour." },
    { type: "qcm", q: "« Ajouter » (Append) deux requêtes sert à…", opts: ["Accoler des colonnes par une clé", "Empiler des lignes de tables de même structure", "Trier les données", "Créer un TCD"], a: 1, exp: "Ajouter = empiler des lignes ; les colonnes doivent avoir les mêmes noms." },
    { type: "qcm", q: "« Fusionner » (Merge) deux requêtes sert à…", opts: ["Empiler des lignes", "Rapprocher deux tables par une clé commune (jointure)", "Supprimer des doublons", "Convertir les types de données"], a: 1, exp: "Fusionner accole des colonnes en reliant les tables par une clé." },
    { type: "vf", q: "Pour un « Ajouter » propre, les colonnes des deux tables doivent porter le même nom.", a: true, exp: "Sinon Power Query crée des colonnes séparées remplies de null." },
    { type: "qcm", q: "Quel type de jointure garde TOUTES les lignes de gauche plus les correspondances de droite ?", opts: ["Interne", "Externe gauche", "Anti droite", "Externe droite"], a: 1, exp: "La jointure externe gauche est la plus courante pour enrichir une table." },
    { type: "qcm", q: "Quelle jointure ne garde que les lignes présentes des DEUX côtés ?", opts: ["Externe gauche", "Interne", "Anti gauche", "Externe droite"], a: 1, exp: "La jointure interne ne conserve que les clés communes aux deux tables." },
    { type: "input", q: "Quel bouton du ruban Excel rejoue toutes les requêtes du classeur ? (Données ▸ …)", a: ["Actualiser tout", "Actualiser Tout"], ph: "Données ▸ …", exp: "Données ▸ Actualiser tout rejoue les étapes sur les sources à jour." },
    { type: "vf", q: "Un copier-coller classique se met à jour automatiquement quand la source change.", a: false, exp: "Le copier-coller est figé ; c'est une requête qui se rejoue à l'actualisation." },
    { type: "input", q: "Comment s'appelle le langage généré automatiquement par Power Query ? (une lettre)", a: ["M", "langage M", "le M"], ph: "une lettre", exp: "Power Query écrit du langage M ; les boutons le génèrent pour toi." },
    { type: "qcm", q: "Après une fusion, la nouvelle colonne est repliée. Que fait-on pour voir les colonnes de droite ?", opts: ["On la supprime", "On clique sur l'icône Développer (⇔) en haut de la colonne", "On trie", "Rien, elles apparaissent seules"], a: 1, exp: "Développer laisse choisir quelles colonnes de la table jointe afficher." },
    { type: "input", q: "Dans l'éditeur, quel volet liste chaque transformation dans l'ordre ? (deux mots)", a: ["Étapes appliquées", "Etapes appliquées", "étapes appliquées"], ph: "deux mots", exp: "Le volet Étapes appliquées, à droite, retrace toute la requête." },
    { type: "qcm", q: "« Fermer et charger dans… ▸ Connexion seule » signifie que…", opts: ["Les données remplissent une feuille", "Les données restent en mémoire sans occuper de feuille", "La requête est supprimée", "On imprime le résultat"], a: 1, exp: "Une connexion seule garde le résultat disponible sans le poser dans une feuille." },
    { type: "input", q: "Type de jointure pour lister les lignes de gauche SANS correspondance à droite ? (deux mots)", a: ["Anti gauche", "anti gauche", "Anti-gauche"], ph: "deux mots", exp: "L'anti-jointure gauche isole les clés présentes à gauche mais absentes à droite." },
    { type: "vf", q: "Fusionner est l'équivalent d'une RECHERCHEX appliquée à des tables entières.", a: true, exp: "Les deux relient des données par une clé ; la fusion le fait pour toute la table." },
    { type: "input", q: "Ventes_Janvier a 40 lignes, Ventes_Fevrier 35 lignes, mêmes colonnes. Combien de lignes après un Ajouter ?", a: ["75"], ph: "un nombre", exp: "Ajouter empile : 40 + 35 = 75 lignes." }
  ],
  final: {
    title: "Exercice final — Réunir puis enrichir des ventes",
    intro: `<p>Deux fichiers mensuels ont la même structure, et une table de référence donne la région de chaque commercial.</p>
<pre class="pseudo">Ventes_Jan :  Vendeur | Montant        // 3 lignes
Ventes_Fev :  Vendeur | Montant        // 2 lignes
Vendeurs   :  Vendeur | Region         // table de reference
              Ali -> Nord ; Bea -> Sud ; Chris -> Nord</pre>
<p>Objectif : un seul tableau des ventes de l'année, avec la région de chaque vendeur.</p>`,
    questions: [
      { type: "qcm", q: "Pour réunir Ventes_Jan et Ventes_Fev (mêmes colonnes) en un seul tableau, on utilise…", opts: ["Fusionner", "Ajouter", "RECHERCHEV", "un TCD"], a: 1, exp: "Mêmes colonnes, on empile les lignes : c'est Ajouter." },
      { type: "input", q: "Ventes_Jan a 3 lignes, Ventes_Fev 2 lignes. Combien de lignes après l'Ajouter ?", a: ["5"], ph: "un nombre", exp: "3 + 2 = 5 lignes empilées." },
      { type: "qcm", q: "Pour ajouter la colonne Region à ce tableau réuni, via la clé Vendeur, on utilise…", opts: ["Ajouter", "Fusionner (jointure sur Vendeur)", "Trier", "Supprimer les doublons"], a: 1, exp: "On relie deux tables par une clé : c'est une Fusion." },
      { type: "qcm", q: "On veut garder TOUTES les ventes même si un vendeur manquait dans la table Vendeurs. Quelle jointure ?", opts: ["Interne", "Externe gauche (ventes à gauche)", "Anti gauche", "Externe droite"], a: 1, exp: "L'externe gauche garde toutes les lignes de gauche (les ventes)." },
      { type: "input", q: "Une fois les étapes prêtes, quel menu renvoie le résultat dans Excel ? (Accueil ▸ …)", a: ["Fermer et charger", "Fermer et Charger"], ph: "Accueil ▸ …", exp: "Accueil ▸ Fermer et charger dépose le résultat dans le classeur." }
    ],
    solution: `<p>Démarche complète en deux temps, sans une seule formule :</p>
<pre class="pseudo">// ETAPE 1 — Empiler les deux mois (Ajouter)
Donnees > Combiner les requetes > Ajouter
   Table du haut : Ventes_Jan          // 3 lignes
   Table du bas  : Ventes_Fev          // 2 lignes
   --> Ventes_Annee : 5 lignes (Vendeur | Montant)

// ETAPE 2 — Enrichir avec la region (Fusionner)
Donnees > Combiner les requetes > Fusionner
   Table gauche : Ventes_Annee   cle = Vendeur
   Table droite : Vendeurs       cle = Vendeur
   Type : Externe gauche         // on garde TOUTES les ventes
   --> colonne repliee "Vendeurs"
   Clic sur l'icone Developper (⇔) > cocher Region seulement
   --> Ventes_Annee : Vendeur | Montant | Region

// ETAPE 3 — Charger
Accueil > Fermer et charger      // resultat dans une feuille
Ensuite : Donnees > Actualiser tout a chaque nouveau mois</pre>
<p>Retiens la règle : <strong>Ajouter</strong> pour empiler des lignes de même structure, <strong>Fusionner</strong> pour accoler des colonnes via une clé. Et tout est rejouable d'un clic.</p>`
  }
};
</script>
