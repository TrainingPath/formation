<script>
var DAY = {
  num: 3,
  title: "RECHERCHEX approfondie",
  subtitle: "Exploiter tous les arguments de la fonction de recherche moderne : défaut, sens, correspondance approchée et jokers.",
  theory: `
<h3>1. Rappel express et cadre de version</h3>
<p><strong>RECHERCHEX</strong> est la fonction de recherche moderne. <span class="tag">365</span> <strong>Attention version : RECHERCHEX n'existe qu'à partir d'Excel 2021 et dans Microsoft 365.</strong> Sur 2019 et antérieur, utilise INDEX/EQUIV (jour 2). Aujourd'hui, on va bien au-delà de l'usage de base.</p>
<pre class="pseudo">=RECHERCHEX(valeur_cherchee ; plage_cles ; plage_resultats)
   valeur_cherchee   la cle a retrouver
   plage_cles        la colonne (ou ligne) des cles
   plage_resultats   la colonne (ou ligne) dont on veut la valeur
   // correspondance EXACTE par defaut, dans les deux sens</pre>

<h3>2. Les arguments complets</h3>
<p>RECHERCHEX possède en réalité <strong>6 arguments</strong>, dont 3 facultatifs très puissants.</p>
<pre class="pseudo">=RECHERCHEX(cle ; plage_cles ; plage_resultats ; [si_absent] ; [mode_correspondance] ; [mode_recherche])
   si_absent            texte/valeur a afficher si rien n'est trouve (remplace SIERREUR)
   mode_correspondance  0 = exact (defaut) ; -1 = exact ou inferieur ; 1 = exact ou superieur ; 2 = jokers
   mode_recherche       1 = du debut a la fin (defaut) ; -1 = de la fin au debut</pre>

<h3>3. Gérer l'absence : le 4e argument</h3>
<p>Fini d'entourer de SIERREUR : le 4e argument affiche directement un message si la clé est absente.</p>
<pre class="pseudo">=RECHERCHEX(E2 ; A2:A10 ; B2:B10 ; "Introuvable")
   "Introuvable"   affiche si E2 n'est dans aucune cle (au lieu de #N/A)</pre>
<div class="tip">Avantage sur SIERREUR : le 4e argument n'intercepte QUE l'absence de correspondance. SIERREUR, lui, masquerait aussi une vraie erreur de formule (#REF!, #VALEUR!…) que tu voudrais voir.</div>

<h3>4. Correspondance approchée : le 5e argument</h3>
<p>Le <strong>mode de correspondance</strong> gère les cas « pas de valeur exacte ». Très utile pour des barèmes (tranches).</p>
<pre class="pseudo">=RECHERCHEX(950 ; A2:A10 ; B2:B10 ; ; -1)
   -1   si 950 n'existe pas, prend la cle EXACTE ou juste INFERIEURE
        // ideal pour un bareme par tranches (ex : remises par palier)</pre>
<div class="warn">Pour -1 (inférieur) ou 1 (supérieur), la colonne des clés doit être triée dans le bon ordre, sinon le résultat peut être faux. Le point-virgule vide « ;; » saute l'argument si_absent.</div>

<h3>5. Recherche avec jokers : mode 2</h3>
<p>Le mode 2 active les <strong>caractères génériques</strong> : <code>*</code> (n'importe quelle suite) et <code>?</code> (un seul caractère).</p>
<pre class="pseudo">=RECHERCHEX("Dur*" ; A2:A10 ; B2:B10 ; ; 2)
   "Dur*"   trouve la 1re cle commencant par "Dur" (Durand, Durin...)
   2        active les jokers * et ?</pre>

<h3>6. Sens de recherche : le 6e argument</h3>
<p>Le <strong>mode de recherche</strong> choisit le sens de balayage. <code>-1</code> part de la FIN : pratique pour retrouver la <em>dernière</em> occurrence (ex : dernier prix enregistré d'un produit).</p>
<pre class="pseudo">=RECHERCHEX(E2 ; A2:A100 ; B2:B100 ; ; ; -1)
   -1   balaye de bas en haut -> renvoie la DERNIERE correspondance</pre>

<h3>7. Renvoyer plusieurs colonnes d'un coup</h3>
<p>Comme RECHERCHEX renvoie une plage, on peut lui donner une plage de résultats sur <strong>plusieurs colonnes</strong> : elle « déverse » toutes les colonnes correspondantes (voir les tableaux dynamiques, jour 7).</p>
<pre class="pseudo">=RECHERCHEX(E2 ; A2:A10 ; B2:D10)
   B2:D10   3 colonnes -> renvoie d'un coup les valeurs des colonnes B, C et D
            // le resultat "se deverse" (spill) sur 3 cellules</pre>
<div class="tip">La recherche horizontale (l'ancienne RECHERCHEH) se fait avec la même RECHERCHEX : il suffit de donner des plages de clés/résultats en LIGNES au lieu de colonnes.</div>`,
  exercises: [
    { type: "qcm", q: "À partir de quelle version RECHERCHEX est-elle disponible ?", opts: ["Toutes les versions", "Excel 2021 et Microsoft 365", "Excel 2010", "Mac uniquement"], a: 1, exp: "RECHERCHEX est récente : 2021 et 365. Avant, on utilise INDEX/EQUIV." },
    { type: "qcm", q: "Quel est le comportement de correspondance PAR DÉFAUT de RECHERCHEX ?", opts: ["Approximatif", "Exact", "Avec jokers", "Aléatoire"], a: 1, exp: "Exact par défaut, contrairement à RECHERCHEV." },
    { type: "input", q: "Écris une RECHERCHEX qui affiche « Introuvable » si E2 n'existe pas dans A2:A10 (résultat B2:B10).", a: ["=RECHERCHEX(E2;A2:A10;B2:B10;\"Introuvable\")"], ph: "=RECHERCHEX(...)", exp: "Le 4e argument remplace SIERREUR pour le cas d'absence." },
    { type: "vf", q: "Le 4e argument de RECHERCHEX (si_absent) n'intercepte que l'absence de correspondance, pas les autres erreurs.", a: true, exp: "C'est plus fin que SIERREUR qui masquerait toutes les erreurs." },
    { type: "qcm", q: "Le 5e argument à -1 signifie…", opts: ["exact uniquement", "correspondance exacte ou immédiatement inférieure", "jokers", "de la fin au début"], a: 1, exp: "-1 prend la valeur exacte ou juste inférieure : idéal pour un barème." },
    { type: "input", q: "Écris une RECHERCHEX qui cherche 950 dans A2:A10 (triée) et renvoie B2:B10, en prenant la valeur exacte ou inférieure.", a: ["=RECHERCHEX(950;A2:A10;B2:B10;;-1)"], ph: "=RECHERCHEX(...;;-1)", exp: "Le double point-virgule saute si_absent ; -1 = exact ou inférieur." },
    { type: "qcm", q: "Quel mode de correspondance active les jokers * et ?", opts: ["0", "-1", "1", "2"], a: 3, exp: "Le mode 2 active les caractères génériques." },
    { type: "input", q: "Écris une RECHERCHEX qui trouve la 1re clé commençant par « Dur » dans A2:A10 (résultat B2:B10), avec jokers.", a: ["=RECHERCHEX(\"Dur*\";A2:A10;B2:B10;;2)"], ph: "=RECHERCHEX(\"Dur*\";...;;2)", exp: "* = suite de caractères ; le mode 2 active les jokers." },
    { type: "qcm", q: "Le 6e argument à -1 sert à…", opts: ["chercher exact", "balayer de la fin vers le début (dernière occurrence)", "activer les jokers", "afficher une erreur"], a: 1, exp: "mode_recherche -1 renvoie la dernière correspondance." },
    { type: "input", q: "Écris une RECHERCHEX qui renvoie la DERNIÈRE occurrence de E2 dans A2:A100 (résultat B2:B100).", a: ["=RECHERCHEX(E2;A2:A100;B2:B100;;;-1)"], ph: "=RECHERCHEX(...;;;-1)", exp: "Trois arguments sautés (;;;) puis -1 pour partir de la fin." },
    { type: "vf", q: "RECHERCHEX peut renvoyer plusieurs colonnes à la fois si la plage de résultats en contient plusieurs.", a: true, exp: "Le résultat se déverse (spill) sur autant de cellules que de colonnes." },
    { type: "vf", q: "Pour une recherche horizontale, il faut absolument RECHERCHEH, RECHERCHEX ne le fait pas.", a: false, exp: "RECHERCHEX gère les deux sens : il suffit de donner des plages en lignes." },
    { type: "qcm", q: "Sur Excel 2019, quelle alternative fiable à RECHERCHEX ?", opts: ["RECHERCHEX quand même", "INDEX/EQUIV", "SOMME", "RECHERCHEV"], a: 1, exp: "2019 n'a pas RECHERCHEX : INDEX/EQUIV est l'équivalent universel." },
    { type: "input", q: "Écris une RECHERCHEX de base : cherche E2 dans A2:A10, renvoie C2:C10.", a: ["=RECHERCHEX(E2;A2:A10;C2:C10)"], ph: "=RECHERCHEX(...)", exp: "Clé, plage des clés, plage des résultats : exact par défaut." },
    { type: "qcm", q: "Pour un barème de remise par tranches de chiffre d'affaires, quel argument utilise-t-on ?", opts: ["le mode de correspondance -1 (exact ou inférieur)", "les jokers", "le sens -1", "aucun"], a: 0, exp: "Une tranche = valeur exacte ou immédiatement inférieure → mode -1." }
  ],
  final: {
    title: "Exercice final — Un barème de remise par paliers",
    intro: `<p>La remise dépend du montant de la commande, par paliers. La table des seuils est triée croissant. On veut, pour un montant en E2, retrouver le taux de remise du bon palier.</p>
<pre class="pseudo">      A          B          E          F
  1  Seuil      Remise     Montant ?  Remise
  2  0          0%         950        (a calculer)
  3  500        5%
  4  1000       10%
  5  2000       15%</pre>
<p>Pour 950, aucun seuil exact : il faut prendre le seuil exact OU immédiatement inférieur (ici 500 → 5 %).</p>`,
    questions: [
      { type: "input", q: "En F2, écris la RECHERCHEX qui trouve la remise du bon palier pour E2 (seuils A2:A5, remises B2:B5), exact ou inférieur.", a: ["=RECHERCHEX(E2;A2:A5;B2:B5;;-1)"], ph: "=RECHERCHEX(...;;-1)", exp: "Mode -1 : prend le seuil exact ou juste en dessous de 950 → 500." },
      { type: "input", q: "Quel taux de remise obtient une commande de 950 ?", a: ["5%", "0,05", "5"], ph: "un taux", exp: "950 tombe dans le palier 500 → 5 %." },
      { type: "input", q: "Et pour une commande de 2500 ?", a: ["15%", "0,15", "15"], ph: "un taux", exp: "2500 dépasse 2000 → dernier palier = 15 %." },
      { type: "qcm", q: "Pourquoi le mode 0 (exact) échouerait ici ?", opts: ["Il est trop lent", "950 n'est pas un seuil exact → #N/A", "Il faut trier", "Aucun problème"], a: 1, exp: "En exact, 950 introuvable renvoie #N/A ; il faut -1 pour les tranches." },
      { type: "input", q: "Ajoute un message « Montant invalide » si aucun palier ne convient (montant négatif).", a: ["=RECHERCHEX(E2;A2:A5;B2:B5;\"Montant invalide\";-1)"], ph: "=RECHERCHEX(...;\"...\";-1)", exp: "Le 4e argument gère l'absence, le 5e (-1) la correspondance." }
    ],
    solution: `<p>Un barème par tranches se résout avec le mode de correspondance -1 :</p>
<pre class="pseudo">=RECHERCHEX(E2 ; A2:A5 ; B2:B5 ; ; -1)
   E2         le montant (950)
   A2:A5      les seuils (tries croissant)
   B2:B5      les remises correspondantes
   ;          on saute l'argument si_absent
   -1         correspondance EXACTE ou INFERIEURE
              -> 950 : pas de seuil exact -> prend 500 -> remise 5 %

Version avec message d'absence :
=RECHERCHEX(E2 ; A2:A5 ; B2:B5 ; "Montant invalide" ; -1)
   // affiche le message si E2 est en dessous de tous les seuils</pre>
<p>À retenir : pour un barème, mode -1 et seuils triés croissant. Sur Excel 2019, ce serait RECHERCHEV(...;VRAI) ou INDEX/EQUIV avec type 1.</p>`
  }
};
</script>

var ECRITURE = {

  { id: "excelpro-j03", lab: {"title":"À reproduire","intro":"Afficher Nom, Prix et Stock d'un seul coup grâce à une RECHERCHEX qui se déverse, avec message si code inconnu.","steps":"1) Saisis A2=C01 B2=Stylo C2=2 D2=50 ; A3=C02 B3=Cahier C3=3 D3=30 ; A4=C03 B4=Gomme C4=1 D4=10.\n2) En H1 tape : C02.\n3) En H2 saisis ta formule (voir la consigne)","check":"Avec H1=C02, H2:J2 se déversent en Cahier | 3 | 30 ; avec un code absent, H2 affiche Inconnu."}, title: "Fiche produit complète en une formule", level: 3,
    statement: "Recopie ce catalogue. En H1 l'utilisateur tape un code ; en H2, affiche d'un coup le Nom, le Prix ET le Stock (3 colonnes) grâce à une seule RECHERCHEX qui se déverse. Prévois aussi un message si le code est inconnu.<pre class=\"pseudo\">      A       B         C       D          H\n  1  Code    Nom       Prix    Stock   1  Code : P03\n  2  P01     Casque    49      12      2  -> Nom / Prix / Stock\n  3  P02     Clavier   29      5\n  4  P03     Souris    15      40\n  5  P04     Ecran     120     3</pre>",
    hints: [

    ],
