<script>
var DAY = {
  num: 27,
  title: "De Excel à Power BI Desktop : importer et modéliser",
  subtitle: "Franchir la marche : quand le tableau croisé ne suffit plus, on passe au modèle de données.",
  theory: `
<h3>1. Qu'est-ce que Power BI Desktop ?</h3>
<p><strong>Power BI Desktop</strong> est un <em>logiciel séparé</em>, distinct d'Excel : il ne fait pas partie de la suite Office et ne s'ouvre pas depuis Excel. Il se télécharge <strong>gratuitement</strong> sur le Microsoft Store ou sur le site de Microsoft, et fonctionne sous Windows uniquement. Il sert à importer des données, les modéliser, puis construire des rapports interactifs.</p>
<div class="tip">Attention à ne pas confondre trois choses : <strong>Power BI Desktop</strong> (le logiciel de création, gratuit) ; le <strong>service Power BI</strong> (le site web app.powerbi.com où l'on publie et partage, qui exige une licence Pro ou une capacité pour le partage) ; et <strong>Power BI Mobile</strong> (l'application de consultation). Créer un rapport est gratuit ; le <em>partager</em> ne l'est pas.</div>
<h3>2. Pourquoi quitter Excel ?</h3>
<p>Excel reste imbattable pour le calcul libre, la saisie, l'analyse ponctuelle. Mais il montre ses limites :</p>
<pre class="pseudo">Excel                              Power BI Desktop
1 048 576 lignes maximum           des dizaines de millions de lignes
actualisation manuelle             actualisation planifiee automatique
partage = envoyer un fichier       partage = un lien vers un rapport en ligne
graphiques statiques               visuels croises et interactifs
mise en page libre                 mise en page orientee tableau de bord</pre>
<p>Bonne nouvelle : tu connais déjà l'essentiel. <strong>Power Query</strong> (l'éditeur d'importation) et le <strong>modèle de données</strong> sont exactement les mêmes moteurs que dans Excel. Power BI Desktop, c'est Power Query + Power Pivot + une couche de visualisation, réunis dans une seule application.</p>
<h3>3. L'interface : trois vues</h3>
<p>À gauche de la fenêtre, trois icônes commutent entre trois modes de travail :</p>
<pre class="pseudo">Vue Rapport   ' la page blanche ou l'on depose les visuels (graphiques, cartes)
Vue Donnees   ' les tables importees, ligne par ligne, comme une feuille Excel
Vue Modele    ' le schema des tables et des relations entre elles</pre>
<h3>4. Importer : Obtenir les données</h3>
<p>Tout commence par <strong>Accueil ▸ Obtenir les données</strong>. Power BI propose des centaines de <strong>connecteurs</strong> (un connecteur = un module qui sait lire une source précise) :</p>
<pre class="pseudo">Classeur Excel        ' un .xlsx ou .xlsm : on choisit les feuilles ou les tableaux
Texte/CSV             ' fichiers plats
Dossier               ' TOUS les fichiers d'un dossier, combines automatiquement
Base de donnees SQL Server, Oracle, MySQL, PostgreSQL
Web                   ' une page ou une API
SharePoint, Dataverse, Salesforce, Google Analytics...</pre>
<p>Après le choix de la source, une fenêtre <strong>Navigateur</strong> liste ce qu'elle contient. Deux boutons décisifs :</p>
<pre class="pseudo">Charger        ' importe les donnees telles quelles, directement
Transformer les donnees   ' ouvre Power Query pour nettoyer AVANT de charger</pre>
<div class="tip">Choisis presque toujours <strong>Transformer les données</strong>. Charger d'abord et nettoyer ensuite fait perdre du temps : le nettoyage se fait en amont, une fois pour toutes, et se rejoue automatiquement à chaque actualisation.</div>
<h3>5. Power Query : nettoyer avant de modéliser</h3>
<p><strong>Power Query</strong> est l'éditeur de requêtes. Chaque manipulation devient une <strong>étape appliquée</strong>, listée à droite dans un volet. Cette liste est une recette rejouée intégralement à chaque actualisation : c'est là toute la puissance de l'outil.</p>
<pre class="pseudo">Etapes typiques (volet Etapes appliquees)
Source                        ' connexion au fichier
Navigation                    ' choix de la feuille ou du tableau
En-tetes promus               ' Accueil > Utiliser la premiere ligne pour les en-tetes
Type modifie                  ' chaque colonne recoit son type (texte, entier, date)
Colonnes supprimees           ' Accueil > Supprimer les colonnes
Lignes filtrees               ' filtre sur les valeurs, comme un filtre Excel
Valeurs remplacees            ' Transformer > Remplacer les valeurs
Colonne personnalisee ajoutee ' Ajouter une colonne > Colonne personnalisee</pre>
<p>Le langage sous-jacent s'appelle <strong>M</strong> ; on le voit dans la <strong>barre de formule</strong> ou via <strong>Affichage ▸ Éditeur avancé</strong>. On peut travailler des mois sans en écrire une ligne : les boutons du ruban le génèrent.</p>
<div class="warn">Le <strong>type de données</strong> de chaque colonne est capital. Une date restée en texte empêchera de créer une hiérarchie temporelle ; un montant en texte rendra toute somme impossible. Vérifie l'icône à gauche de chaque nom de colonne avant de cliquer sur <strong>Fermer et appliquer</strong>.</div>
<h3>6. Le modèle en étoile : faits et dimensions</h3>
<p>Un <strong>modèle de données</strong> est un ensemble de tables reliées entre elles. La bonne pratique universelle est le <strong>schéma en étoile</strong> :</p>
<pre class="pseudo">           Dim_Client        Dim_Produit
                 \\              /
                  \\            /
                   Fait_Ventes            <- la table de FAITS (au centre)
                  /            \\
                 /              \\
           Dim_Date          Dim_Magasin   <- les tables de DIMENSIONS</pre>
<p>Une <strong>table de faits</strong> contient les événements mesurables : une ligne = une vente, avec des quantités et des montants. Elle est longue (des millions de lignes) et étroite. Une <strong>table de dimensions</strong> contient les descriptifs par lesquels on veut analyser : la liste des clients, des produits, des dates. Elle est courte et large.</p>
<div class="tip">Le réflexe Excel « tout mettre dans un seul grand tableau avec des RECHERCHEX » est contre-productif ici. Séparer faits et dimensions rend le modèle plus léger, plus rapide et beaucoup plus lisible.</div>
<h3>7. Les relations</h3>
<p>Une <strong>relation</strong> relie une colonne d'une table à une colonne d'une autre : elle permet de filtrer les ventes par client sans aucune formule de recherche. On la crée en <strong>Vue Modèle</strong> en faisant glisser un champ sur l'autre, ou par <strong>Accueil ▸ Gérer les relations</strong>.</p>
<pre class="pseudo">Cardinalite (le "combien pour combien")
Un a plusieurs (1:*)   ' LE CAS NORMAL : 1 client -> plusieurs ventes
Plusieurs a un (*:1)   ' le meme cas, vu depuis l'autre table
Un a un (1:1)          ' rare, souvent signe de deux tables a fusionner
Plusieurs a plusieurs  ' a eviter tant qu'on peut : source d'ambiguites

Sens du filtre croise
Simple  ' RECOMMANDE : la dimension filtre les faits, pas l'inverse
Bidirectionnel  ' pratique mais dangereux : peut creer des boucles de filtre</pre>
<p>Une relation apparaît en <strong>trait plein</strong> si elle est active, en <strong>pointillés</strong> si elle est inactive (deux relations entre les mêmes tables : une seule peut être active à la fois).</p>
<h3>8. La table de dates : incontournable</h3>
<p>Toute analyse temporelle sérieuse exige une <strong>table de dates</strong> dédiée : une ligne par jour, avec les colonnes Année, Trimestre, Mois, Nom du mois, Jour de la semaine. On la relie à la colonne date de la table de faits, puis on la déclare avec <strong>Outils de table ▸ Marquer comme table de dates</strong>.</p>
<pre class="pseudo">// Creation rapide en DAX : Modelisation > Nouvelle table
Calendrier =                                   // nom de la nouvelle table
CALENDAR(DATE(2024,1,1), DATE(2026,12,31))     // une ligne par jour sur 3 ans</pre>
<p>Sans elle, impossible de comparer un mois à l'année précédente ou de cumuler depuis le début de l'année.</p>
<h3>9. Import ou DirectQuery ?</h3>
<pre class="pseudo">Import        ' les donnees sont COPIEES dans le fichier .pbix : tres rapide,
              ' toutes les fonctions DAX disponibles, mais il faut actualiser
DirectQuery   ' les donnees restent dans la source, interrogee a chaque clic :
              ' toujours a jour, mais plus lent et fonctions limitees
Mode composite ' melange des deux, table par table</pre>
<p>Le mode <strong>Import</strong> convient à la grande majorité des cas. Le fichier produit porte l'extension <strong>.pbix</strong> : il contient à la fois les données importées, le modèle et les rapports.</p>
<div class="tip">Chemin complet d'un premier projet : <strong>Accueil ▸ Obtenir les données ▸ Classeur Excel ▸</strong> cocher les tableaux <strong>▸ Transformer les données ▸</strong> nettoyer <strong>▸ Fermer et appliquer ▸ Vue Modèle ▸</strong> créer les relations <strong>▸ Vue Rapport</strong> pour les visuels.</div>`,
  exercises: [
    { type: "qcm", q: "Power BI Desktop est…", opts: ["Un onglet d'Excel", "Un logiciel séparé, téléchargeable gratuitement", "Un complément payant d'Office", "Un site web uniquement"], a: 1, exp: "C'est une application Windows distincte d'Office, gratuite au téléchargement." },
    { type: "input", q: "Quel bouton de l'onglet Accueil lance l'importation d'une source de données ?", a: ["Obtenir les données", "obtenir les données", "Obtenir les donnees"], ph: "Obtenir …", exp: "Accueil ▸ Obtenir les données ouvre la liste des connecteurs." },
    { type: "qcm", q: "Dans la fenêtre Navigateur, quel bouton faut-il préférer pour nettoyer avant chargement ?", opts: ["Charger", "Transformer les données", "Annuler", "Actualiser"], a: 1, exp: "Transformer les données ouvre Power Query et permet de nettoyer en amont." },
    { type: "input", q: "Comment s'appelle l'éditeur de requêtes qui enregistre chaque manipulation sous forme d'étape ?", a: ["Power Query", "power query", "l'éditeur Power Query"], ph: "Power …", exp: "Power Query : ses étapes appliquées se rejouent à chaque actualisation." },
    { type: "input", q: "Quelle extension porte un fichier Power BI Desktop ?", a: [".pbix", "pbix", ".PBIX", "Pbix"], ph: ".p…", exp: "Le .pbix contient les données, le modèle et les rapports." },
    { type: "qcm", q: "Dans un schéma en étoile, la table de faits contient…", opts: ["La liste des clients", "Les événements mesurables (ventes, quantités, montants)", "Les couleurs du rapport", "Les relations"], a: 1, exp: "Les faits sont les mesures ; les dimensions sont les axes d'analyse." },
    { type: "input", q: "Comment nomme-t-on la table courte et descriptive (clients, produits, dates) d'un modèle en étoile ?", a: ["dimension", "table de dimensions", "Dimension", "une dimension", "table de dimension"], ph: "table de …", exp: "Les dimensions décrivent les axes par lesquels on analyse les faits." },
    { type: "qcm", q: "Quelle cardinalité est la plus courante entre une dimension et une table de faits ?", opts: ["Un à un", "Un à plusieurs", "Plusieurs à plusieurs", "Aucune"], a: 1, exp: "Un client a plusieurs ventes : relation un à plusieurs (1:*)." },
    { type: "vf", q: "Le sens de filtre croisé bidirectionnel est recommandé par défaut pour toutes les relations.", a: false, exp: "Le sens simple est recommandé ; le bidirectionnel peut créer des boucles de filtre ambiguës." },
    { type: "input", q: "Quelle fonction DAX crée une table de dates continue entre deux bornes ?", a: ["CALENDAR", "calendar", "CALENDAR()"], ph: "CAL…", exp: "CALENDAR(date_debut, date_fin) génère une ligne par jour ; CALENDARAUTO le fait automatiquement." },
    { type: "qcm", q: "Quel mode de connexion copie les données dans le fichier .pbix ?", opts: ["DirectQuery", "Import", "Composite", "Live"], a: 1, exp: "Import copie et compresse les données : c'est le mode le plus rapide et le plus complet." },
    { type: "vf", q: "Une relation en pointillés dans la Vue Modèle est une relation inactive.", a: true, exp: "Entre deux tables, une seule relation peut être active ; les autres sont en pointillés." },
    { type: "input", q: "Quel bouton de Power Query valide toutes les étapes et charge les données dans le modèle ?", a: ["Fermer et appliquer", "fermer et appliquer", "Fermer & appliquer"], ph: "Fermer …", exp: "Accueil ▸ Fermer et appliquer referme Power Query et charge le résultat." },
    { type: "qcm", q: "Combien de vues principales propose Power BI Desktop à gauche de la fenêtre ?", opts: ["Une", "Deux", "Trois : Rapport, Données, Modèle", "Cinq"], a: 2, exp: "Vue Rapport (visuels), Vue Données (tables), Vue Modèle (relations)." },
    { type: "input", q: "Comment s'appelle le langage de requête généré par les boutons de Power Query ?", a: ["M", "m", "le langage M", "langage M"], ph: "une lettre", exp: "Le langage M est visible dans la barre de formule et l'Éditeur avancé." }
  ],
  final: {
    title: "Exercice final — Construire un modèle en étoile",
    intro: `<p>Tu disposes d'un classeur Excel <em>Ventes2026.xlsx</em> contenant trois tableaux :</p>
<pre class="pseudo">tblVentes    : IDVente | DateVente | IDClient | IDProduit | Quantite | Montant
tblClients   : IDClient | NomClient | Ville | Segment
tblProduits  : IDProduit | NomProduit | Categorie | PrixUnitaire</pre>
<p>Objectif : importer ces trois tables dans Power BI Desktop, les nettoyer, créer une table de dates et relier le tout en schéma en étoile.</p>`,
    questions: [
      { type: "input", q: "Quel chemin du ruban permet de démarrer l'import du classeur Excel ?", a: ["Accueil ▸ Obtenir les données ▸ Classeur Excel", "Accueil > Obtenir les données > Classeur Excel", "Obtenir les données"], ph: "Accueil ▸ …", exp: "Accueil ▸ Obtenir les données ▸ Classeur Excel, puis Navigateur pour cocher les tableaux." },
      { type: "qcm", q: "Parmi ces trois tables, laquelle est la table de faits ?", opts: ["tblClients", "tblProduits", "tblVentes", "Aucune"], a: 2, exp: "tblVentes contient les événements mesurables : quantités et montants." },
      { type: "input", q: "Quelle fonction DAX utiliser pour créer la table Calendrier du 01/01/2024 au 31/12/2026 ?", a: ["CALENDAR", "calendar", "CALENDAR(DATE(2024,1,1), DATE(2026,12,31))"], ph: "CAL…", exp: "Modélisation ▸ Nouvelle table, puis Calendrier = CALENDAR(DATE(2024,1,1), DATE(2026,12,31))." },
      { type: "qcm", q: "Quelle cardinalité relie Calendrier[Date] à tblVentes[DateVente] ?", opts: ["Un à un", "Un à plusieurs (du Calendrier vers les ventes)", "Plusieurs à plusieurs", "Aucune relation possible"], a: 1, exp: "Une date du calendrier correspond à plusieurs ventes : relation 1:*." },
      { type: "input", q: "Quelle commande déclare officiellement la table Calendrier comme table de dates ?", a: ["Marquer comme table de dates", "marquer comme table de dates", "Outils de table ▸ Marquer comme table de dates"], ph: "Marquer …", exp: "Outils de table ▸ Marquer comme table de dates, en désignant la colonne Date." }
    ],
    solution: `<p><strong>Étape 1 — Import.</strong> <strong>Accueil ▸ Obtenir les données ▸ Classeur Excel</strong>, sélectionner <em>Ventes2026.xlsx</em>. Dans le <strong>Navigateur</strong>, cocher tblVentes, tblClients et tblProduits, puis cliquer sur <strong>Transformer les données</strong> (et non Charger).</p>
<p><strong>Étape 2 — Nettoyage dans Power Query.</strong> Pour chaque requête :</p>
<pre class="pseudo">Utiliser la premiere ligne pour les en-tetes   ' si les titres sont dans les donnees
Verifier le type de chaque colonne :
   IDVente, IDClient, IDProduit  -> Nombre entier
   DateVente                     -> Date
   Quantite                      -> Nombre entier
   Montant, PrixUnitaire         -> Nombre decimal
Supprimer les colonnes inutiles                ' Accueil > Supprimer les colonnes
Supprimer les lignes vides                     ' Accueil > Supprimer les lignes
Renommer les requetes : Ventes, Clients, Produits
Puis : Accueil > Fermer et appliquer</pre>
<p><strong>Étape 3 — Table de dates.</strong> <strong>Modélisation ▸ Nouvelle table</strong> :</p>
<pre class="pseudo">Calendrier =                                        // nom de la table
CALENDAR(DATE(2024,1,1), DATE(2026,12,31))          // une ligne par jour

// Puis Modelisation > Nouvelle colonne, sur la table Calendrier :
Annee = YEAR(Calendrier[Date])                      // extrait l'annee
Mois = MONTH(Calendrier[Date])                      // numero du mois, pour le tri
NomMois = FORMAT(Calendrier[Date], "mmmm")          // libelle du mois en toutes lettres
Trimestre = "T" &amp; QUARTER(Calendrier[Date])         // T1, T2, T3, T4</pre>
<p>Sélectionner la table Calendrier puis <strong>Outils de table ▸ Marquer comme table de dates ▸</strong> colonne <em>Date</em>. Trier ensuite NomMois par Mois via <strong>Outils de colonne ▸ Trier par colonne</strong>, sinon les mois s'afficheraient par ordre alphabétique.</p>
<p><strong>Étape 4 — Relations.</strong> Passer en <strong>Vue Modèle</strong> et glisser :</p>
<pre class="pseudo">Clients[IDClient]      ->  Ventes[IDClient]      // 1 client   -> plusieurs ventes  (1:*)
Produits[IDProduit]    ->  Ventes[IDProduit]     // 1 produit  -> plusieurs ventes  (1:*)
Calendrier[Date]       ->  Ventes[DateVente]     // 1 date     -> plusieurs ventes  (1:*)
// Sens du filtre croise : Simple (la dimension filtre les faits)</pre>
<p>Le schéma final montre <strong>Ventes</strong> au centre, entourée de <strong>Clients</strong>, <strong>Produits</strong> et <strong>Calendrier</strong> : c'est l'étoile. Toute analyse « CA par catégorie de produit et par mois » devient alors possible sans la moindre formule de recherche.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "excelpro-j27", title: "Modéliser un suivi de tickets support", level: 2,
    statement: "Tu importes dans Power BI Desktop un dossier de fichiers CSV mensuels de tickets support : <em>Ticket_ID ; Date_Ouverture ; Date_Cloture ; ID_Agent ; Categorie ; Duree_Minutes</em>, plus un fichier <em>Agents.xlsx</em> (ID_Agent ; Nom ; Equipe ; Site). Décris la démarche complète : (1) les étapes Power Query pour importer le dossier et fiabiliser les types, (2) le code DAX de la table de dates avec ses colonnes Annee, Mois, NomMois, (3) les relations à créer et leur cardinalité, (4) une colonne calculée donnant le délai de résolution en jours.",
    hints: [

      "Une colonne calculée s'écrit ligne par ligne dans la table (Modélisation ▸ Nouvelle colonne) ; DATEDIFF(debut, fin, DAY) donne un écart en jours."
    ],
    solution: "// ================= 1. POWER QUERY =================\n// Accueil > Obtenir les donnees > Dossier > choisir le dossier des CSV\n// Puis bouton Combiner et transformer les donnees\n// Etapes appliquees a verifier dans le volet de droite :\n//   Source                     -> liste des fichiers du dossier\n//   Fichiers combines          -> tous les CSV empiles en une table\n//   En-tetes promus            -> Accueil > Utiliser la 1re ligne pour les en-tetes\n//   Type modifie               -> Ticket_ID entier, Date_Ouverture date,\n//                                 Date_Cloture date, Duree_Minutes decimal\n//   Lignes filtrees            -> retirer les Ticket_ID vides\n//   Colonnes supprimees        -> retirer la colonne Source.Name si inutile\n//   Renommer la requete en \"Tickets\"\n// Importer aussi Agents.xlsx (Obtenir les donnees > Classeur Excel), requete \"Agents\"\n// Enfin : Accueil > Fermer et appliquer\n\n// ================= 2. TABLE DE DATES (DAX) =================\n// Modelisation > Nouvelle table\nCalendrier =                                    // table de dates dediee\nCALENDAR(                                       // une ligne par jour\n    MIN(Tickets[Date_Ouverture]),               // borne basse = 1er ticket\n    MAX(Tickets[Date_Cloture])                  // borne haute = dernier ticket clos\n)\n\n// Modelisation > Nouvelle colonne (sur la table Calendrier)\nAnnee = YEAR(Calendrier[Date])                  // 2026\nMois = MONTH(Calendrier[Date])                  // 1 a 12, sert au tri\nNomMois = FORMAT(Calendrier[Date], \"mmmm\")      // janvier, fevrier...\n// Puis Outils de colonne > Trier par colonne : NomMois trie par Mois\n// Puis Outils de table > Marquer comme table de dates > colonne Date\n\n// ================= 3. RELATIONS (Vue Modele) =================\n// Agents[ID_Agent]      -> Tickets[ID_Agent]         // 1 agent -> plusieurs tickets (1:*)\n// Calendrier[Date]      -> Tickets[Date_Ouverture]   // 1 date  -> plusieurs tickets (1:*)\n// Sens du filtre croise : Simple dans les deux cas\n// Modele en etoile : Tickets = table de faits ; Agents et Calendrier = dimensions\n\n// ================= 4. COLONNE CALCULEE =================\n// Modelisation > Nouvelle colonne (sur la table Tickets)\nDelai_Jours =                                   // duree de resolution en jours\nDATEDIFF(                                       // ecart entre deux dates\n    Tickets[Date_Ouverture],                    // debut\n    Tickets[Date_Cloture],                      // fin\n    DAY                                         // unite : jours\n)\n\nResultat attendu :\n   Une table Tickets alimentee par tous les CSV du dossier, actualisable d'un clic\n   Une colonne Delai_Jours : ticket ouvert le 03/02 et clos le 06/02 -> 3\n   Un modele en etoile permettant \"delai moyen par equipe et par mois\"",
