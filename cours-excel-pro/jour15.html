<script>
var DAY = {
  num: 15,
  title: "Découvrir Power Query : importer et transformer",
  subtitle: "L'outil qui remplace le copier-coller mensuel : on décrit le traitement une fois, on l'actualise d'un clic.",
  theory: `
<h3>1. Ce qu'est Power Query, et pourquoi ça change tout</h3>
<p><strong>Power Query</strong> est le moteur d'importation et de transformation intégré à Excel. Son principe est radicalement différent des formules : au lieu de calculer, il <strong>enregistre une suite d'opérations</strong>. Tu nettoies un fichier une fois, à la souris ; Power Query mémorise chaque geste. Le mois suivant, un seul bouton <em>Actualiser</em> rejoue tout le traitement sur les nouvelles données.</p>
<p>Vocabulaire de base, à fixer tout de suite :</p>
<pre class="pseudo">Requête (query)      un traitement complet : une source + des transformations
Étape appliquée      UNE operation enregistree (supprimer une colonne,
                     filtrer, renommer...). Elles s'enchainent dans l'ordre.
Langage M            le langage genere automatiquement derriere chaque etape
Éditeur Power Query  la fenetre separee ou l'on travaille
Connexion            une requete chargee sans etre affichee dans une feuille
Actualiser           rejouer toutes les etapes sur les donnees a jour</pre>
<div class="tip">La règle qui résume tout : <strong>si tu fais la même manipulation tous les mois, elle appartient à Power Query</strong>. Il est disponible nativement depuis Excel 2016 (onglet Données ▸ Récupérer et transformer), et en complément téléchargeable pour 2010 et 2013.</div>

<h3>2. Importer : les sources et le chemin du ruban</h3>
<pre class="pseudo">Données ▸ Obtenir des données ▸ ...

   ▸ À partir d'un fichier ▸ À partir d'un classeur Excel
   ▸ À partir d'un fichier ▸ À partir d'un fichier texte/CSV
   ▸ À partir d'un fichier ▸ À partir d'un dossier
        // LE cas d'usage vedette : consolide TOUS les fichiers
        // d'un dossier en une seule table
   ▸ À partir d'une base de données ▸ SQL Server, Access...
   ▸ À partir d'autres sources ▸ À partir du Web
   ▸ À partir d'autres sources ▸ À partir d'un tableau ou d'une plage
        // pour transformer des donnees deja presentes dans le classeur</pre>
<p>Après le choix de la source, une fenêtre d'aperçu propose deux boutons. <strong>Charger</strong> envoie les données telles quelles dans une feuille. <strong>Transformer les données</strong> ouvre l'éditeur : c'est presque toujours le bon choix, car il permet de nettoyer avant de charger.</p>
<div class="warn">L'import depuis un dossier est le plus puissant mais le plus exigeant : tous les fichiers doivent avoir la <strong>même structure de colonnes</strong>. Power Query ajoute automatiquement une colonne <code>Source.Name</code> contenant le nom du fichier d'origine — précieuse pour retrouver la provenance d'une ligne, ou pour extraire le mois d'un nom comme <code>ventes_2025_03.csv</code>.</div>

<h3>3. L'éditeur Power Query : les quatre zones</h3>
<pre class="pseudo">1. Le ruban        Accueil, Transformer, Ajouter une colonne, Affichage
2. Requêtes        a gauche : la liste de toutes les requetes du classeur
3. Aperçu          au centre : les 1000 premieres lignes (un APERCU,
                   pas la totalite des donnees)
4. Paramètres      a droite : Nom de la requete et la liste des
   d'une requête   ÉTAPES APPLIQUÉES</pre>
<p>Le volet des <strong>étapes appliquées</strong> est le cœur de l'outil. Chaque étape est cliquable : tu remontes dans l'historique et l'aperçu se replace dans l'état correspondant. L'icône en forme d'engrenage à droite d'une étape permet de <strong>modifier ses paramètres</strong> sans la refaire ; la croix la supprime.</p>
<div class="warn">Les étapes sont <strong>ordonnées et dépendantes</strong>. Supprimer une étape du milieu casse souvent celles qui suivent, car elles font référence à des colonnes ou des noms créés entre-temps. Excel affiche alors une erreur du type « La colonne 'X' de la table est introuvable ». Modifie plutôt l'étape fautive au lieu de la supprimer.</div>

<h3>4. Le langage M : la couche sous les clics</h3>
<p>Chaque étape génère une ligne de code <strong>M</strong>, le langage de Power Query. On peut travailler sans jamais l'écrire, mais savoir le <em>lire</em> permet de comprendre et de corriger. Deux accès : <code>Accueil ▸ Éditeur avancé</code> pour voir tout le code, ou la barre de formule (à activer via <code>Affichage ▸ Barre de formule</code>) pour l'étape courante.</p>
<pre class="pseudo">let
    Source = Excel.CurrentWorkbook(){[Name="Ventes"]}[Content],
    // lit le tableau structure nomme "Ventes" du classeur courant

    Type = Table.TransformColumnTypes(Source,
              {{"Date", type date}, {"Montant", type number}}),
    // definit le TYPE de chaque colonne : date, nombre, texte...

    Filtre = Table.SelectRows(Type, each [Montant] > 100),
    // ne garde que les lignes dont Montant depasse 100
    // "each" = pour chaque ligne ; [Montant] = la colonne Montant

    SansCol = Table.RemoveColumns(Filtre, {"Commentaire"})
    // supprime la colonne Commentaire
in
    SansCol
    // la valeur finale renvoyee par la requete</pre>
<pre class="pseudo">Structure a retenir :
   let              ouvre le bloc
     Nom = calcul,  chaque etape porte un nom et s'appuie sur la precedente
     ...
   in
     DerniereEtape  ce que la requete renvoie</pre>
<div class="warn">Le langage M est <strong>sensible à la casse</strong> : <code>Table.SelectRows</code> fonctionne, <code>table.selectrows</code> non. Et les noms d'étapes contenant un espace s'écrivent entre guillemets précédés d'un dièse : <code>#"Type modifié"</code>. C'est pourquoi le code généré automatiquement est parfois lourd à lire.</div>

<h3>5. Les transformations essentielles</h3>
<pre class="pseudo">PROMOUVOIR LES EN-TETES
   Accueil ▸ Utiliser la première ligne pour les en-têtes
   M : Table.PromoteHeaders(Source, [PromoteAllScalars=true])

DEFINIR LES TYPES
   Clic sur l'icone ABC/123 a gauche du nom de colonne
   ou Transformer ▸ Type de données
   M : Table.TransformColumnTypes(Source, {{"Date", type date}})

SUPPRIMER DES COLONNES
   Clic droit sur l'en-tete ▸ Supprimer
   ou selectionner puis Accueil ▸ Supprimer les colonnes
   M : Table.RemoveColumns(Etape, {"Colonne1", "Colonne2"})

CHOISIR LES COLONNES A GARDER (plus robuste)
   Accueil ▸ Choisir les colonnes
   M : Table.SelectColumns(Etape, {"Date", "Client", "Montant"})

FILTRER DES LIGNES
   Menu deroulant de l'en-tete ▸ Filtres numeriques / de texte
   M : Table.SelectRows(Etape, each [Montant] > 100)

SUPPRIMER LES LIGNES VIDES
   Accueil ▸ Supprimer les lignes ▸ Supprimer les lignes vides
   M : Table.SelectRows(Etape, each not List.IsEmpty(
          List.RemoveMatchingItems(Record.FieldValues(_), {"", null})))

RENOMMER UNE COLONNE
   Double-clic sur l'en-tete
   M : Table.RenameColumns(Etape, {{"Col1", "Date de vente"}})

TRIER
   Menu deroulant de l'en-tete ▸ Tri croissant
   M : Table.Sort(Etape, {{"Montant", Order.Descending}})</pre>
<div class="tip">Préfère <strong>Choisir les colonnes</strong> à <strong>Supprimer les colonnes</strong>. Si la source gagne une colonne le mois suivant, « Supprimer » la laissera passer et polluera le résultat, tandis que « Choisir » garantit exactement la liste voulue. C'est le réflexe qui rend une requête durable.</div>

<h3>6. Charger le résultat : les trois destinations</h3>
<pre class="pseudo">Accueil ▸ Fermer et charger  (charge directement dans une feuille)
Accueil ▸ Fermer et charger dans...  ▸ boite de dialogue :

   ▸ Tableau                          dans une feuille, en tableau structure
   ▸ Rapport de tableau croise dynamique   directement en TCD
   ▸ Ne créer que la connexion        la requete existe mais n'affiche rien
                                      // pour les etapes intermediaires
   ▸ Cocher "Ajouter ces données au modèle de données"
                                      // pour Power Pivot, au-dela de
                                      // la limite du million de lignes</pre>
<div class="warn">Une feuille Excel plafonne à 1 048 576 lignes. Power Query peut traiter bien davantage, à condition de charger vers le <strong>modèle de données</strong> plutôt que vers une feuille. Charger 3 millions de lignes dans une feuille échouera quoi qu'il arrive.</div>

<h3>7. Actualiser et gérer les requêtes</h3>
<pre class="pseudo">Données ▸ Actualiser tout            (ou Ctrl+Alt+F5)
Clic droit sur le tableau resultat ▸ Actualiser
Données ▸ Requêtes et connexions     ouvre le volet lateral
   Double-clic sur une requete ▸ rouvre l'editeur
   Clic droit ▸ Modifier / Dupliquer / Reference / Supprimer

Actualisation automatique :
   Clic droit sur la requete ▸ Propriétés
   ▸ Actualiser lors de l'ouverture du fichier
   ▸ Actualiser toutes les N minutes</pre>
<div class="warn">Le piège du <strong>chemin absolu</strong>. Une requête mémorise le chemin complet du fichier source (<code>C:\\Users\\moi\\Documents\\ventes.csv</code>). Envoyé à un collègue, le classeur échouera à l'actualisation. Remède : stocker le chemin dans une cellule du classeur, la charger comme paramètre, et l'utiliser dans la source. On peut aussi corriger le chemin dans <code>Source ▸ Paramètres de la source de données</code>.</div>

<h3>8. Duplication contre référence</h3>
<p>Deux commandes voisines mais très différentes, sur le clic droit d'une requête.</p>
<pre class="pseudo">Dupliquer   copie INDEPENDANTE : les etapes sont recopiees.
            Modifier l'originale ne change rien a la copie.

Référence   nouvelle requete qui PART DU RESULTAT de la premiere.
            Modifier l'originale se repercute sur toutes ses references.
            // le bon outil pour : une requete de base "Nettoyage",
            // puis plusieurs requetes filtrees qui s'en nourrissent</pre>
<div class="tip">Organisation professionnelle : une requête <em>Base</em> chargée en <strong>connexion seule</strong> qui fait tout le nettoyage, puis des requêtes <em>Référence</em> qui filtrent par région ou par année. Le nettoyage n'est écrit qu'une fois ; le corriger corrige tout le classeur.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le principe fondamental de Power Query ?", opts: ["Il calcule plus vite que les formules", "Il enregistre une suite d'étapes rejouables sur des données mises à jour", "Il compresse les fichiers", "Il remplace les graphiques"], a: 1, exp: "On décrit le traitement une fois, puis on actualise d'un clic." },
    { type: "input", q: "Écris le chemin de ruban pour importer un fichier CSV avec Power Query.", a: ["Données ▸ Obtenir des données ▸ À partir d'un fichier ▸ À partir d'un fichier texte/CSV"], ph: "Données ▸ Obtenir des données ▸ …", exp: "Tout part de l'onglet Données, groupe Récupérer et transformer." },
    { type: "qcm", q: "Qu'est-ce qu'une « étape appliquée » ?", opts: ["Une formule Excel", "Une opération de transformation enregistrée dans la requête", "Un onglet du classeur", "Un filtre temporaire"], a: 1, exp: "Elles s'enchaînent dans l'ordre et forment le traitement complet." },
    { type: "qcm", q: "Comment s'appelle le langage généré derrière chaque étape ?", opts: ["VBA", "DAX", "M", "SQL"], a: 2, exp: "M est le langage de Power Query ; DAX est celui de Power Pivot." },
    { type: "vf", q: "Le langage M est sensible à la casse.", a: true, exp: "Table.SelectRows fonctionne, table.selectrows renvoie une erreur." },
    { type: "input", q: "Écris les deux mots-clés qui ouvrent et ferment un bloc de code M.", a: ["let et in", "let in", "let / in"], ph: "… et …", exp: "let ouvre la liste des étapes, in désigne la valeur renvoyée." },
    { type: "qcm", q: "Quelle fonction M filtre les lignes d'une table ?", opts: ["Table.RemoveColumns", "Table.SelectRows", "Table.PromoteHeaders", "Table.Sort"], a: 1, exp: "Table.SelectRows(Etape, each [Montant] > 100) conserve les lignes voulues." },
    { type: "qcm", q: "Pourquoi préférer « Choisir les colonnes » à « Supprimer les colonnes » ?", opts: ["C'est plus rapide", "Une nouvelle colonne dans la source ne polluera pas le résultat", "Cela réduit la taille du fichier", "Il n'y a pas de différence"], a: 1, exp: "Choisir fige la liste voulue ; Supprimer laisse passer tout ce qui est nouveau." },
    { type: "input", q: "Écris la fonction M qui promeut la première ligne en en-têtes de colonnes.", a: ["Table.PromoteHeaders"], ph: "Table.…", exp: "Elle correspond à Accueil ▸ Utiliser la première ligne pour les en-têtes." },
    { type: "vf", q: "Supprimer une étape au milieu du volet des étapes appliquées est sans risque.", a: false, exp: "Les étapes suivantes peuvent référencer ce qu'elle créait : elles casseront." },
    { type: "qcm", q: "Que fait l'option de chargement « Ne créer que la connexion » ?", opts: ["Elle annule la requête", "La requête existe sans afficher de données dans une feuille", "Elle protège le fichier", "Elle charge les données deux fois"], a: 1, exp: "Idéal pour une requête intermédiaire servant de base à d'autres." },
    { type: "qcm", q: "Quelle est la différence entre Dupliquer et Référence ?", opts: ["Aucune", "Référence part du résultat de la requête d'origine et en dépend", "Dupliquer est plus rapide", "Référence supprime l'originale"], a: 1, exp: "Modifier l'originale se répercute sur ses références, jamais sur ses duplicatas." },
    { type: "input", q: "Écris le raccourci clavier qui actualise toutes les requêtes du classeur.", a: ["Ctrl+Alt+F5"], ph: "Ctrl+…", exp: "Équivalent du bouton Données ▸ Actualiser tout." },
    { type: "vf", q: "Un classeur Power Query envoyé par mail s'actualisera sans problème chez le destinataire.", a: false, exp: "Le chemin absolu du fichier source ne sera pas valide sur son poste." },
    { type: "qcm", q: "Comment dépasser la limite du million de lignes d'une feuille Excel ?", opts: ["Compresser le fichier", "Charger vers le modèle de données au lieu d'une feuille", "Utiliser plusieurs onglets", "C'est impossible"], a: 1, exp: "Le modèle de données (Power Pivot) n'a pas cette contrainte." }
  ],
  final: {
    title: "Exercice final — Automatiser un import CSV mensuel",
    intro: `<p>Chaque mois, le service commercial dépose un CSV brut dans un dossier. Aujourd'hui, quelqu'un le nettoie à la main pendant vingt minutes. On va décrire le traitement une seule fois.</p>
<pre class="pseudo">Fichier ventes_2025_03.csv (extrait) :

Export du 31/03/2025          <- ligne parasite
                              <- ligne vide
Date;Client;Region;Montant;Note
01/03/2025;Dupont;Nord;1440;
02/03/2025;;Sud;640;a verifier
03/03/2025;Martin;Nord;0;
                              <- ligne vide
04/03/2025;Durand;Est;2000;

Objectif : une table propre Date / Client / Region / Montant,
sans lignes vides, sans montant nul, sans la colonne Note.</pre>`,
    questions: [
      { type: "input", q: "Écris le chemin de ruban complet pour démarrer l'import de ce fichier CSV.", a: ["Données ▸ Obtenir des données ▸ À partir d'un fichier ▸ À partir d'un fichier texte/CSV"], ph: "Données ▸ Obtenir des données ▸ …", exp: "Puis cliquer sur Transformer les données plutôt que sur Charger." },
      { type: "qcm", q: "Comment se débarrasser de la ligne « Export du 31/03/2025 » et de la ligne vide qui la suit ?", opts: ["Les filtrer une par une", "Accueil ▸ Supprimer les lignes ▸ Supprimer les premières lignes ▸ 2", "Supprimer la colonne", "Trier les données"], a: 1, exp: "On retire les lignes parasites AVANT de promouvoir les en-têtes." },
      { type: "qcm", q: "Après avoir supprimé ces deux lignes, quelle étape rend « Date;Client;Region… » utilisable comme en-têtes ?", opts: ["Trier", "Accueil ▸ Utiliser la première ligne pour les en-têtes", "Fractionner la colonne", "Grouper par"], a: 1, exp: "Cela génère Table.PromoteHeaders dans le code M." },

    ],
    solution: `<p>Le traitement complet, étape par étape, avec le code M correspondant.</p>
<pre class="pseudo">ETAPE 0 -- importer
   Données ▸ Obtenir des données ▸ À partir d'un fichier
            ▸ À partir d'un fichier texte/CSV
   Selectionner ventes_2025_03.csv
   Verifier : Origine du fichier = Unicode (UTF-8) si les accents sont casses
              Delimiteur = Point-virgule
   Cliquer sur TRANSFORMER LES DONNÉES (surtout pas sur Charger)

ETAPE 1 -- retirer les lignes parasites du haut
   Accueil ▸ Supprimer les lignes ▸ Supprimer les premières lignes ▸ 2
   M : Table.Skip(Source, 2)
       // Skip = ignorer les n premieres lignes

ETAPE 2 -- promouvoir les en-tetes
   Accueil ▸ Utiliser la première ligne pour les en-têtes
   M : Table.PromoteHeaders(Etape1, [PromoteAllScalars=true])
       // la ligne Date;Client;Region;Montant;Note devient les en-tetes

ETAPE 3 -- selectionner les colonnes utiles
   Accueil ▸ Choisir les colonnes ▸ cocher Date, Client, Region, Montant
   M : Table.SelectColumns(Etape2, {"Date","Client","Region","Montant"})
       // "Choisir" plutot que "Supprimer" : si le CSV gagne une colonne
       // le mois prochain, elle ne polluera pas le resultat

ETAPE 4 -- definir les types
   Clic sur l'icone a gauche de chaque en-tete
   M : Table.TransformColumnTypes(Etape3, {
           {"Date", type date},
           {"Client", type text},
           {"Region", type text},
           {"Montant", type number}
       })
       // etape CRUCIALE : sans elle, Montant reste du texte
       // et aucun calcul ne fonctionnera en aval

ETAPE 5 -- supprimer les lignes vides
   Accueil ▸ Supprimer les lignes ▸ Supprimer les lignes vides

ETAPE 6 -- filtrer les montants nuls
   Menu deroulant de Montant ▸ Filtres numériques ▸ Supérieur à ▸ 0
   M : Table.SelectRows(Etape5, each [Montant] &gt; 0)
       // each   = pour chaque ligne
       // [Montant] = la valeur de la colonne Montant sur cette ligne

ETAPE 7 -- nommer et charger
   Volet de droite ▸ Nom : Ventes_Propres
   Accueil ▸ Fermer et charger dans... ▸ Tableau ▸ Nouvelle feuille

Le code M complet (Accueil ▸ Éditeur avancé) :
let
    Source = Csv.Document(File.Contents("C:\\Data\\ventes_2025_03.csv"),
                          [Delimiter=";", Encoding=65001]),
    Saut   = Table.Skip(Source, 2),
    EnTetes = Table.PromoteHeaders(Saut, [PromoteAllScalars=true]),
    Colonnes = Table.SelectColumns(EnTetes,
                 {"Date","Client","Region","Montant"}),
    Types = Table.TransformColumnTypes(Colonnes,
              {{"Date", type date}, {"Montant", type number}}),
    SansVides = Table.SelectRows(Types, each [Montant] &lt;&gt; null),
    Filtre = Table.SelectRows(SansVides, each [Montant] &gt; 0)
in
    Filtre

Resultat attendu : 2 lignes
   01/03/2025 | Dupont | Nord | 1440
   04/03/2025 | Durand | Est  | 2000
   // la ligne du 02/03 passe le filtre montant mais a un client vide
   // (a traiter au jour 16) ; celle du 03/03 est exclue par Montant &gt; 0</pre>
<p>Le mois suivant : remplacer le fichier dans le dossier, ouvrir le classeur, <code>Données ▸ Actualiser tout</code>. Les vingt minutes de nettoyage manuel deviennent trois secondes. Mieux encore : importer <strong>le dossier entier</strong> plutôt qu'un fichier unique consolide automatiquement tous les mois passés et futurs, sans aucune intervention. Encore faut-il savoir gérer les valeurs manquantes et les doublons — c'est l'objet du jour 16.</p>`
  }
};

    solution: "ETAPE 0 -- charger la plage dans Power Query\n   Selectionner A1:E9\n   Données ▸ Obtenir des données ▸ À partir d'autres sources\n            ▸ À partir d'un tableau ou d'une plage\n   DECOCHER \"Mon tableau comporte des en-têtes\"\n   // sinon Excel prendrait \"EXPORT SYSTEME\" comme en-tete de colonne\n   Excel convertit la plage en tableau structure (ex. Tableau1)\n   M : Source = Excel.CurrentWorkbook(){[Name=\"Tableau1\"]}[Content]\n\nETAPE 1 -- supprimer les 2 lignes parasites\n   Accueil ▸ Supprimer les lignes ▸ Supprimer les premières lignes ▸ 2\n   M : Saut = Table.Skip(Source, 2)\n       // Table.Skip ignore les n premieres lignes\n\nETAPE 2 -- promouvoir la ligne d'en-tetes\n   Accueil ▸ Utiliser la première ligne pour les en-têtes\n   M : EnTetes = Table.PromoteHeaders(Saut, [PromoteAllScalars=true])\n       // Date / Produit / Region / Montant / Interne deviennent\n       // de vrais noms de colonnes\n\nETAPE 3 -- garder les colonnes utiles\n   Accueil ▸ Choisir les colonnes ▸ cocher Date, Produit, Region, Montant\n   M : Colonnes = Table.SelectColumns(EnTetes,\n                    {\"Date\",\"Produit\",\"Region\",\"Montant\"})\n       // POURQUOI \"Choisir\" et pas \"Supprimer la colonne Interne\" :\n       // si l'export gagne une colonne \"Commentaire\" le mois prochain,\n       // Supprimer la laisserait passer, Choisir la bloque.\n\nETAPE 4 -- definir les types (indispensable AVANT tout filtre)\n   Clic sur l'icone ABC/123 a gauche de chaque en-tete\n   M : Types = Table.TransformColumnTypes(Colonnes, {\n                 {\"Date\", type date},\n                 {\"Produit\", type text},\n                 {\"Region\", type text},\n                 {\"Montant\", Int64.Type}\n               })\n       // sans cette etape, Montant reste du TEXTE : le tri serait\n       // alphabetique (1440 avant 360) et les filtres numeriques absents\n\nETAPE 5 -- supprimer les lignes vides\n   Accueil ▸ Supprimer les lignes ▸ Supprimer les lignes vides\n   // elimine la ligne 6 du tableau d'origine\n\nETAPE 6 -- ne garder que 2025\n   Methode A (la plus lisible) :\n     Ajouter une colonne ▸ Date ▸ Année ▸ Année\n     puis menu deroulant de la colonne Annee ▸ decocher 2024\n     M : Annee = Table.AddColumn(SansVides, \"Annee\",\n                   each Date.Year([Date]), Int64.Type),\n         Filtre = Table.SelectRows(Annee, each [Annee] = 2025)\n\n   Methode B (sans colonne supplementaire, plus directe) :\n     M : Filtre = Table.SelectRows(SansVides, each Date.Year([Date]) = 2025)\n         // each          pour chaque ligne\n         // [Date]        la valeur de la colonne Date sur cette ligne\n         // Date.Year(..) en extrait l'annee\n\nETAPE 7 -- trier par montant decroissant\n   Menu deroulant de Montant ▸ Tri décroissant\n   M : Tri = Table.Sort(Filtre, {{\"Montant\", Order.Descending}})\n\nETAPE 8 -- nommer et charger\n   Volet de droite ▸ Nom : Ventes2025\n   Accueil ▸ Fermer et charger dans... ▸ Tableau ▸ Nouvelle feuille\n\nCODE M COMPLET (Accueil ▸ Éditeur avancé) :\nlet\n    Source    = Excel.CurrentWorkbook(){[Name=\"Tableau1\"]}[Content],\n    Saut      = Table.Skip(Source, 2),\n    EnTetes   = Table.PromoteHeaders(Saut, [PromoteAllScalars=true]),\n    Colonnes  = Table.SelectColumns(EnTetes,\n                  {\"Date\",\"Produit\",\"Region\",\"Montant\"}),\n    Types     = Table.TransformColumnTypes(Colonnes,\n                  {{\"Date\", type date}, {\"Montant\", Int64.Type}}),\n    SansVides = Table.SelectRows(Types, each not List.IsEmpty(\n                  List.RemoveMatchingItems(Record.FieldValues(_), {\"\", null}))),\n    Filtre    = Table.SelectRows(SansVides, each Date.Year([Date]) = 2025),\n    Tri       = Table.Sort(Filtre, {{\"Montant\", Order.Descending}})\nin\n    Tri\n\nRESULTAT ATTENDU (3 lignes) :\n   03/02/2025 | Ecran   | Nord | 2500\n   15/01/2025 | Casque  | Nord | 1440\n   18/03/2025 | Souris  | Est  |  360\n   // les 2 lignes de 2024 et la ligne vide ont disparu,\n   // la colonne Interne aussi",
    note: "Trois pieges dans cet exercice. (1) DECOCHER \"Mon tableau comporte des en-têtes\" a l'import : la vraie ligne d'en-tetes est la troisieme, pas la premiere. Si tu l'oublies, Power Query nomme la colonne \"EXPORT SYSTEME\" et tout le reste devient bancal. (2) L'ORDRE des etapes : le typage doit venir APRES la promotion des en-tetes (sinon les colonnes s'appellent Column1, Column2) et AVANT le filtre sur l'annee (sinon Date.Year echoue sur du texte). C'est la logique de fond de Power Query : chaque etape travaille sur le RESULTAT de la precedente. (3) La date au format francais : si Power Query lit 15/01/2025 comme le 1er mars a l'americaine, va dans l'etape Type modifie, choisis \"Utiliser les parametres régionaux\" et selectionne Francais (France) ou (Belgique)." }
