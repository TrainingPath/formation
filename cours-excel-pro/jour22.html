<script>
var DAY = {
  num: 22,
  title: "Enregistrer une macro et lire le code VBA",
  subtitle: "Laisser Excel écrire du code à ta place, puis apprendre à le relire.",
  theory: `
<h3>1. Qu'est-ce qu'une macro ?</h3>
<p>Une <strong>macro</strong> est une <strong>suite d'actions Excel enregistrées</strong> que l'on peut rejouer d'un clic. Tu répètes chaque lundi la même mise en forme ? Enregistre-la une fois, puis lance la macro : Excel refait tout, à l'identique et en un instant. C'est l'automatisation des gestes répétitifs.</p>
<h3>2. VBA : le langage derrière les macros</h3>
<p>Sous le capot, une macro est du <strong>code VBA</strong> (<em>Visual Basic for Applications</em>), le langage de programmation intégré à Office. L'enregistreur de macro <strong>écrit ce code pour toi</strong> pendant que tu cliques. Apprendre à le relire (puis à le modifier) est la première marche vers l'automatisation avancée.</p>
<div class="tip">L'onglet <strong>Développeur</strong> n'est pas visible par défaut. Active-le : <strong>Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur</strong>.</div>
<h3>3. Enregistrer une macro</h3>
<p>Chemin : <strong>Développeur ▸ Enregistrer une macro</strong> (ou le petit bouton en bas à gauche de la barre d'état). Une boîte demande :</p>
<pre class="pseudo">Nom de la macro       // sans espace ni accent (ex. MiseEnFormeLundi)
Touche de raccourci   // optionnel : Ctrl+Maj+L par exemple
Enregistrer dans      // "Ce classeur" ou "Classeur de macros personnelles" (dispo partout)
Description           // note libre</pre>
<p>Ensuite, chaque action (clic, saisie, mise en forme) est traduite en VBA. On clique <strong>Arrêter l'enregistrement</strong> pour terminer.</p>
<div class="warn">Un classeur contenant des macros doit être enregistré au format <strong>.xlsm</strong> (« classeur prenant en charge les macros »). Le format .xlsx <em>supprime</em> le code à l'enregistrement.</div>
<h3>4. Ouvrir l'éditeur et lire le code</h3>
<p><strong>Développeur ▸ Visual Basic</strong> (ou <strong>Alt+F11</strong>) ouvre l'<strong>éditeur VBA</strong> (VBE). À gauche, l'<strong>Explorateur de projets</strong> liste les objets ; les macros vivent dans des <strong>Modules</strong>. Double-clique un module pour voir le code. Une macro enregistrée ressemble à ceci :</p>
<pre class="pseudo">Sub MiseEnFormeLundi()                 ' debut de la procedure (la macro), nom entre parentheses vides
'                                      ' une apostrophe demarre un COMMENTAIRE (ignore a l'execution)
    Range("A1").Select                 ' selectionne la cellule A1
    Selection.Font.Bold = True         ' met en gras ce qui est selectionne
    Range("A1").Value = "Rapport"      ' ecrit Rapport dans A1
    Columns("A:A").ColumnWidth = 20    ' fixe la largeur de la colonne A a 20
End Sub                                ' fin de la procedure</pre>
<h3>5. Décoder la structure Objet.Propriété / Objet.Méthode</h3>
<p>VBA manipule des <strong>objets</strong> (le classeur, une feuille, une cellule…). Sur un objet, on agit de deux façons :</p>
<pre class="pseudo">Objet.Propriete = valeur    ' PROPRIETE : une caracteristique qu'on lit ou modifie
   Range("A1").Value = 10   ' la valeur de A1 devient 10 (Value est une propriete)
   Range("A1").Font.Bold = True   ' la propriete Bold (gras) passe a True

Objet.Methode               ' METHODE : une ACTION que l'objet sait faire
   Range("A1").Select       ' Select est une methode : "selectionne-toi"
   Worksheets("Feuil1").Delete   ' Delete est une methode : "supprime-toi"</pre>
<div class="tip">Moyen mnémotechnique : une <strong>propriété</strong> est un <em>adjectif</em> (gras, largeur, valeur) ; une <strong>méthode</strong> est un <em>verbe</em> (sélectionne, supprime, copie). Le point <code>.</code> Le point <code>.</code> relie l'objet à ce qu'on en fait.</div>
<h3>6. Nettoyer le code enregistré</h3>
<p>L'enregistreur écrit un code verbeux : il « sélectionne » sans arrêt (<code>Select</code>) car il imite tes clics. On peut simplifier — souvent, <code>Select</code> est inutile :</p>
<pre class="pseudo">' Version enregistree (verbeuse)
Range("A1").Select
Selection.Font.Bold = True
' Version nettoyee (directe, plus rapide)
Range("A1").Font.Bold = True     ' on agit directement sur A1, sans le selectionner</pre>
<div class="warn">Pour lancer une macro : <strong>Développeur ▸ Macros</strong> (ou <strong>Alt+F8</strong>), choisir la macro, <strong>Exécuter</strong>. Attention : une action de macro n'est en général <strong>pas annulable</strong> par Ctrl+Z. Teste toujours sur une copie.</div>`,
  exercises: [
    { type: "qcm", q: "Une macro, c'est…", opts: ["Un graphique animé", "Une suite d'actions Excel enregistrées et rejouables", "Une formule matricielle", "Un type de fichier image"], a: 1, exp: "Elle rejoue des gestes répétitifs d'un clic." },
    { type: "input", q: "Comment s'appelle le langage de programmation derrière les macros Excel ? (trois lettres)", a: ["VBA", "vba", "le VBA"], ph: "trois lettres", exp: "VBA (Visual Basic for Applications) est le langage des macros Office." },
    { type: "qcm", q: "Quel onglet faut-il activer pour enregistrer/exécuter des macros ?", opts: ["Insertion", "Développeur", "Révision", "Affichage"], a: 1, exp: "Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur." },
    { type: "input", q: "Quel raccourci clavier ouvre l'éditeur VBA (VBE) ?", a: ["Alt+F11", "alt+f11", "ALT+F11", "Alt F11"], ph: "Alt+…", exp: "Alt+F11 ouvre l'éditeur Visual Basic." },
    { type: "qcm", q: "Un classeur contenant des macros doit être enregistré au format…", opts: [".xlsx", ".xlsm", ".pdf", ".csv"], a: 1, exp: ".xlsm prend en charge les macros ; .xlsx supprime le code." },
    { type: "vf", q: "Enregistrer un classeur avec macros en .xlsx conserve le code VBA.", a: false, exp: "Le format .xlsx supprime les macros à l'enregistrement : il faut .xlsm." },
    { type: "input", q: "Quel mot-clé VBA marque le DÉBUT d'une macro (procédure) ?", a: ["Sub", "sub", "SUB"], ph: "un mot", exp: "Sub NomDeLaMacro() ouvre la procédure ; End Sub la ferme." },
    { type: "input", q: "Quel caractère commence un commentaire en VBA (ignoré à l'exécution) ?", a: ["'", "apostrophe", "l'apostrophe", "une apostrophe"], ph: "un caractère", exp: "L'apostrophe ' démarre un commentaire en VBA." },
    { type: "qcm", q: "Dans Range(\"A1\").Value = 10, que représente Value ?", opts: ["Une méthode (action)", "Une propriété (caractéristique lue/modifiée)", "Un objet", "Un commentaire"], a: 1, exp: "Value est une propriété : la valeur de la cellule, ici fixée à 10." },
    { type: "qcm", q: "Dans Range(\"A1\").Select, que représente Select ?", opts: ["Une propriété", "Une méthode (une action que l'objet sait faire)", "Un objet", "Une variable"], a: 1, exp: "Select est une méthode : l'action « sélectionne-toi »." },
    { type: "vf", q: "Une propriété est comme un adjectif (gras, largeur) ; une méthode est comme un verbe (copie, supprime).", a: true, exp: "Bon repère : propriété = caractéristique, méthode = action." },
    { type: "qcm", q: "L'enregistreur de macro produit souvent du code…", opts: ["Parfait et minimal", "Verbeux, plein de Select qu'on peut simplifier", "En langage M", "En DAX"], a: 1, exp: "Il imite les clics, d'où beaucoup de Select souvent inutiles." },
    { type: "input", q: "Quel raccourci ouvre la liste des macros à exécuter ?", a: ["Alt+F8", "alt+f8", "ALT+F8", "Alt F8"], ph: "Alt+…", exp: "Alt+F8 (ou Développeur ▸ Macros) liste les macros." },
    { type: "vf", q: "Une action réalisée par une macro peut toujours s'annuler avec Ctrl+Z.", a: false, exp: "Les macros ne sont généralement pas annulables : teste sur une copie." },
    { type: "input", q: "Écris la ligne VBA qui met en gras la cellule A1 (sans la sélectionner d'abord).", a: ["Range(\"A1\").Font.Bold = True", "Range(\"A1\").Font.Bold=True", "range(\"a1\").font.bold = true"], ph: "Range(\"A1\")…", exp: "Range(\"A1\").Font.Bold = True agit directement sur A1." }
  ],
  final: {
    title: "Exercice final — Enregistrer, lire et nettoyer",
    intro: `<p>Tu veux automatiser une mise en forme d'en-tête : écrire « Bilan » en A1, le mettre en gras, et élargir la colonne A. Tu enregistres la macro, puis tu lis et allèges le code.</p>
<pre class="pseudo">Objectif : A1 = "Bilan", A1 en gras, colonne A large de 18</pre>`,
    questions: [
      { type: "input", q: "Quel menu du ruban démarre l'enregistrement ? (Développeur ▸ …)", a: ["Enregistrer une macro", "Enregistrer une Macro"], ph: "Développeur ▸ …", exp: "Développeur ▸ Enregistrer une macro ouvre la boîte de dialogue." },
      { type: "input", q: "Ligne VBA qui écrit « Bilan » dans A1 (propriété Value).", a: ["Range(\"A1\").Value = \"Bilan\"", "Range(\"A1\").Value=\"Bilan\"", "range(\"a1\").value = \"bilan\""], ph: "Range(\"A1\")…", exp: "Range(\"A1\").Value = \"Bilan\" écrit le texte dans A1." },
      { type: "input", q: "Ligne VBA qui met A1 en gras, sans Select.", a: ["Range(\"A1\").Font.Bold = True", "Range(\"A1\").Font.Bold=True", "range(\"a1\").font.bold = true"], ph: "Range(\"A1\")…", exp: "Range(\"A1\").Font.Bold = True passe A1 en gras." },
      { type: "qcm", q: "Dans Columns(\"A:A\").ColumnWidth = 18, ColumnWidth est…", opts: ["Une méthode", "Une propriété (la largeur, qu'on fixe à 18)", "Un objet", "Un commentaire"], a: 1, exp: "ColumnWidth est une propriété : on lui affecte la valeur 18." },
      { type: "qcm", q: "Au moment d'enregistrer le fichier, quel format choisir pour garder la macro ?", opts: [".xlsx", ".xlsm (prenant en charge les macros)", ".txt", ".pdf"], a: 1, exp: "Seul .xlsm conserve le code VBA." }
    ],
    solution: `<p>Le code enregistré, puis sa version nettoyée :</p>
<pre class="pseudo">' === Version brute (enregistreur) — verbeuse, pleine de Select ===
Sub EnTete()
    Range("A1").Select
    Selection.Value = "Bilan"
    Selection.Font.Bold = True
    Columns("A:A").Select
    Selection.ColumnWidth = 18
End Sub

' === Version nettoyee — directe et lisible ===
Sub EnTete()                              ' debut de la macro
    Range("A1").Value = "Bilan"           ' ecrit Bilan dans A1 (Value = propriete)
    Range("A1").Font.Bold = True          ' A1 en gras (Bold = propriete)
    Columns("A:A").ColumnWidth = 18       ' largeur de la colonne A (ColumnWidth = propriete)
End Sub                                   ' fin de la macro</pre>
<p>Retiens : <strong>Sub … End Sub</strong> encadre la macro ; le point relie l'objet à sa <strong>propriété</strong> (adjectif : Value, Bold, ColumnWidth) ou à sa <strong>méthode</strong> (verbe : Select). On supprime les Select inutiles, et on enregistre en <strong>.xlsm</strong>.</p>`
  }
};
