<script>
var DAY = {
  num: 12,
  title: "Mise en forme conditionnelle avancée",
  subtitle: "Piloter la couleur par une formule : surligner des lignes entières, comparer des colonnes, signaler les doublons.",
  theory: `
<h3>1. Rappel et vocabulaire</h3>
<p>La <strong>mise en forme conditionnelle</strong> (MFC) applique un format (couleur, bordure, police) uniquement quand une condition est remplie. Le format n'est pas stocké dans la cellule : il est <em>recalculé</em> en permanence. Les règles prédéfinies (Supérieur à, Barres de données, Nuances de couleurs) suffisent au niveau débutant. Au-delà, une seule option compte vraiment : <strong>Utiliser une formule pour déterminer pour quelles cellules le format sera appliqué</strong>.</p>
<pre class="pseudo">Chemin : Accueil ▸ Mise en forme conditionnelle ▸ Nouvelle règle
         ▸ Utiliser une formule pour déterminer pour quelles cellules...</pre>

<h3>2. La règle par formule : le principe</h3>
<p>Une <strong>règle de MFC par formule</strong> est une formule qui doit renvoyer VRAI ou FAUX. Si elle renvoie VRAI, le format s'applique. Point crucial : on écrit la formule <strong>du point de vue de la première cellule de la plage sélectionnée</strong> (la cellule active, en haut à gauche). Excel la recopie ensuite sur toute la plage, exactement comme on tire une poignée de recopie.</p>
<pre class="pseudo">Plage selectionnee : A2:D50   (cellule active : A2)
Formule saisie     : =\$C2 &lt; 0
   // pour A2 la regle teste C2 ; pour A3 elle testera C3 ; etc.</pre>

<h3>3. Le cœur du sujet : les références absolues et relatives</h3>
<p>Tout se joue sur les <code>\$</code>. Un <code>\$</code> devant la lettre fige la colonne, un <code>\$</code> devant le chiffre fige la ligne.</p>
<pre class="pseudo">\$C2   colonne figee, ligne libre   -> la regle regarde TOUJOURS la colonne C,
                                     mais suit la ligne courante
                                     >>> LE CAS DES LIGNES ENTIERES
C\$2   colonne libre, ligne figee   -> pour colorier des colonnes entieres
\$C\$2  tout fige                    -> toutes les cellules testent la seule C2
C2    rien de fige                 -> chaque cellule se teste elle-meme</pre>
<div class="warn">L'erreur numéro un en MFC : oublier le <code>\$</code> devant la colonne quand on veut surligner une ligne entière. Sans lui, chaque colonne teste sa propre valeur et le résultat est un damier incohérent.</div>

<h3>4. Surligner une LIGNE entière selon la valeur d'une colonne</h3>
<p>C'est la demande la plus fréquente. Sélectionne toute la plage de données (sans les en-têtes), puis écris la formule en visant la colonne de test avec un <code>\$</code>.</p>
<pre class="pseudo">Selection : A2:E100      (cellule active A2)
Formule   : =\$D2 = "Annule"
   \$D    la colonne testee est toujours D
   2     la ligne suit : A2 teste D2, A57 testera D57
   // toute la ligne se colore quand D contient "Annule"</pre>
<pre class="pseudo">Autres formules classiques pour une ligne entiere :
=\$E2 &gt; \$F2                        // depassement de budget
=\$C2 = ""                          // ligne incomplete
=ET(\$D2 = "Urgent" ; \$E2 &gt; 1000)   // deux conditions cumulees
=\$B2 &lt; AUJOURDHUI()                // echeance depassee</pre>

<h3>5. Comparer deux colonnes, repérer les doublons</h3>
<pre class="pseudo">=NB.SI(\$F:\$F ; \$A2) = 0
   NB.SI compte combien de fois A2 apparait dans la colonne F
   = 0   -> A2 est ABSENT de F : on le signale en rouge

=NB.SI(\$A\$2:\$A\$100 ; A2) &gt; 1
   compte les occurrences de A2 dans toute la plage
   &gt; 1   -> c'est un doublon
   // \$ sur la plage (fixe) mais pas sur A2 (glissante) : essentiel

=NB.SI(\$A\$2:A2 ; A2) &gt; 1
   plage qui GRANDIT ligne apres ligne (\$A\$2 fige, A2 libre)
   // ne colore que les occurrences a partir de la DEUXIEME :
   // le premier exemplaire reste blanc</pre>
<div class="tip">La règle prédéfinie « Valeurs en double » colore <em>toutes</em> les occurrences, original compris. La formule <code>=NB.SI(\$A\$2:A2;A2)&gt;1</code> est presque toujours ce qu'on veut réellement : elle ne signale que les répétitions.</div>

<h3>6. Une ligne sur deux, sans tableau structuré</h3>
<pre class="pseudo">=MOD(LIGNE() ; 2) = 0
   LIGNE()      numero de la ligne courante
   MOD(x ; 2)   reste de la division par 2 : 0 = ligne paire
   // colore une ligne sur deux, et le zebrage se recalcule
   // automatiquement apres un tri ou une suppression

=MOD(LIGNE() - LIGNE(\$A\$2) ; 2) = 0
   // variante qui demarre le zebrage a la premiere ligne de donnees
   // quel que soit l'endroit ou commence le tableau</pre>

<h3>7. Gérer les règles : ordre, priorité et « Arrêter si VRAI »</h3>
<p>Plusieurs règles peuvent viser la même cellule. Excel les applique <strong>de haut en bas</strong> dans le Gestionnaire de règles ; la première rencontrée l'emporte pour chaque attribut de format. La case <strong>Arrêter si VRAI</strong> interrompt l'examen des règles suivantes dès qu'une règle est satisfaite.</p>
<pre class="pseudo">Chemin : Accueil ▸ Mise en forme conditionnelle ▸ Gérer les règles
   Les fleches Haut/Bas changent la PRIORITE
   La colonne "S'applique à" corrige la plage sans refaire la regle
   La case "Arrêter si VRAI" bloque les regles situees en dessous</pre>
<div class="warn">Les formats ne s'écrasent pas totalement : si la règle 1 change la couleur de police et la règle 2 le fond, les deux s'appliquent. Seuls les attributs <em>concurrents</em> sont arbitrés par l'ordre.</div>

<h3>8. Le piège de la plage éclatée</h3>
<p>Copier-coller, insérer ou supprimer des lignes finit par <strong>fragmenter</strong> une règle : dans le Gestionnaire, la zone « S'applique à » affiche alors une liste interminable de plages (<code>=\$A\$2:\$E\$7;\$A\$9:\$E\$14;...</code>). Le classeur gonfle et ralentit.</p>
<div class="tip">Remède : supprime toutes les règles de la feuille (<code>Effacer les règles ▸ de la feuille entière</code>) et recrée-les une fois, proprement, sur la plage complète. Colle systématiquement en <strong>Valeurs uniquement</strong> (Ctrl+Alt+V) pour éviter de recréer le problème.</div>

<h3>9. Barres, nuances et jeux d'icônes affinés</h3>
<p>Ces trois règles graphiques acceptent des réglages fins souvent ignorés : bornes Minimum/Maximum en valeur fixe, en centile ou <strong>par formule</strong>, sens de la barre, et surtout <strong>Afficher la barre uniquement</strong> (masque le nombre, pour un mini-graphique dans la cellule).</p>
<pre class="pseudo">Barres de données ▸ Autres règles :
   Minimum : Nombre  0
   Maximum : Formule  =MAX(\$B\$2:\$B\$100)
   // les barres restent comparables meme si les donnees changent
   // cocher "Afficher la barre uniquement" pour masquer les chiffres</pre>
<p><span class="tag">365</span> Sur Excel moderne, le référencement d'une plage renversante (<code>=\$B\$2#</code>) est accepté dans la zone « S'applique à » — la MFC suit alors automatiquement une formule qui grandit. Sur les versions antérieures, il faut étendre la plage à la main.</p>`,
  exercises: [
    { type: "qcm", q: "Que doit renvoyer une formule de règle de MFC ?", opts: ["Un texte", "VRAI ou FAUX", "Une référence de cellule", "Un nombre entre 0 et 100"], a: 1, exp: "Le format s'applique uniquement quand la formule renvoie VRAI." },
    { type: "qcm", q: "Du point de vue de quelle cellule écrit-on la formule d'une règle ?", opts: ["De la dernière cellule", "De la première cellule de la plage sélectionnée", "De A1 toujours", "De la cellule la plus à droite"], a: 1, exp: "Excel recopie ensuite la règle sur toute la plage, comme une poignée de recopie." },
    { type: "input", q: "Écris la formule de MFC qui surligne toute la ligne quand la colonne D vaut « Annule » (plage A2:E100).", a: ["=$D2=\"Annule\""], ph: "=$D2=\"Annule\"", exp: "Le $ fige la colonne D ; la ligne reste libre pour suivre chaque ligne." },
    { type: "qcm", q: "Dans =$D2=\"Annule\", à quoi sert exactement le symbole $ ?", opts: ["À afficher une devise", "À figer la colonne D pour que toutes les colonnes testent D", "À arrondir", "À rendre la règle prioritaire"], a: 1, exp: "Sans lui, chaque colonne testerait sa propre valeur : le résultat serait un damier." },
    { type: "vf", q: "Pour surligner une ligne entière, il faut créer une règle par colonne.", a: false, exp: "Une seule règle suffit si la plage couvre toutes les colonnes et si la formule fige la colonne testée." },
    { type: "input", q: "Écris la formule de MFC qui colore une ligne sur deux.", a: ["=MOD(LIGNE();2)=0"], ph: "=MOD(LIGNE();2)=0", exp: "MOD renvoie le reste de la division par 2 : 0 pour les lignes paires." },
    { type: "qcm", q: "Quel avantage du zébrage par MOD(LIGNE();2) par rapport à un remplissage manuel ?", opts: ["Il est plus coloré", "Il se recalcule seul après un tri ou une suppression de ligne", "Il est plus rapide à imprimer", "Il verrouille les cellules"], a: 1, exp: "Le zébrage manuel suit les cellules ; celui par formule suit la position." },
    { type: "input", q: "Écris la formule qui ne colore que les doublons à partir de la deuxième occurrence (plage démarrant en A2).", a: ["=NB.SI($A$2:A2;A2)>1"], ph: "=NB.SI($A$2:A2;A2)>1", exp: "La plage grandit ligne après ligne : le premier exemplaire n'est jamais compté deux fois." },
    { type: "qcm", q: "En quoi =NB.SI($A$2:$A$100;A2)>1 diffère-t-elle de la formule précédente ?", opts: ["Elle est plus rapide", "Elle colore TOUTES les occurrences, original compris", "Elle ne fonctionne pas", "Elle ignore les textes"], a: 1, exp: "La plage étant entièrement figée, chaque occurrence voit toutes les autres." },
    { type: "vf", q: "Quand deux règles visent la même cellule, c'est la dernière de la liste qui l'emporte.", a: false, exp: "C'est la première, en partant du haut du Gestionnaire de règles." },
    { type: "qcm", q: "À quoi sert la case « Arrêter si VRAI » ?", opts: ["À supprimer la règle", "À empêcher l'examen des règles situées en dessous quand celle-ci est vraie", "À figer les $", "À imprimer la mise en forme"], a: 1, exp: "Elle interrompt la chaîne d'évaluation dès qu'une règle est satisfaite." },
    { type: "input", q: "Écris la formule de MFC qui signale une échéance dépassée, la date étant en colonne B.", a: ["=$B2<AUJOURDHUI()"], ph: "=$B2<AUJOURDHUI()", exp: "On fige la colonne B et on compare à la date du jour." },
    { type: "qcm", q: "La zone « S'applique à » affiche une liste interminable de petites plages. Que s'est-il passé ?", opts: ["Un bug d'Excel", "La règle s'est fragmentée à force de copier-coller et d'insertions", "Le fichier est corrompu", "Il manque un $"], a: 1, exp: "Il faut effacer les règles de la feuille et les recréer proprement en une fois." },
    { type: "input", q: "Écris la formule qui signale une valeur de A2 absente de la colonne F.", a: ["=NB.SI($F:$F;$A2)=0"], ph: "=NB.SI($F:$F;$A2)=0", exp: "NB.SI renvoie 0 quand la valeur n'apparaît nulle part dans F." },
    { type: "vf", q: "L'option « Afficher la barre uniquement » masque le nombre et ne laisse que la barre de données.", a: true, exp: "Pratique pour transformer une colonne en mini-graphique lisible." }
  ],
  final: {
    title: "Exercice final — Un tableau de bord de projets qui s'éclaire tout seul",
    intro: `<p>Un suivi de projets doit signaler visuellement les situations à risque, sans qu'on ait à colorier quoi que ce soit à la main.</p>
<pre class="pseudo">      A          B         C          D           E
  1  Projet     Statut    Echeance   Budget      Depense
  2  Alpha      En cours  15/08/2025  10000       12500
  3  Beta       Annule    30/06/2025   5000        4200
  4  Gamma      En cours  01/07/2025   8000        7900
  5  Alpha      Termine   10/09/2025   3000        2800

  Les donnees occupent A2:E200.
  Objectifs : ligne grisee si Annule ; depense en rouge si elle
  depasse le budget ; echeance en orange si depassee et projet non
  termine ; nom de projet en double signale.</pre>`,
    questions: [
      { type: "input", q: "Règle 1 — plage A2:E200 : grise toute la ligne quand le statut (colonne B) vaut « Annule ».", a: ["=$B2=\"Annule\""], ph: "=$B2=\"Annule\"", exp: "Colonne figée par le $, ligne libre : la règle suit chaque ligne du tableau." },
      { type: "input", q: "Règle 2 — plage E2:E200 : colore la dépense en rouge quand elle dépasse le budget de la colonne D.", a: ["=$E2>$D2"], ph: "=$E2>$D2", exp: "Comparaison de deux colonnes, ligne à ligne." },
      { type: "input", q: "Règle 3 — plage C2:C200 : colore l'échéance en orange si elle est passée ET que le statut n'est pas « Termine ».", a: ["=ET($C2<AUJOURDHUI();$B2<>\"Termine\")"], ph: "=ET($C2<AUJOURDHUI();$B2<>\"Termine\")", exp: "ET combine les deux conditions ; les deux colonnes sont figées, les lignes libres." },
      { type: "qcm", q: "Le projet Alpha apparaît deux fois. Quelle règle sur A2:A200 ne signale QUE la seconde occurrence ?", opts: ["=NB.SI($A$2:$A$200;A2)>1", "=NB.SI($A$2:A2;A2)>1", "=NB.SI(A2;A2)>1", "La règle prédéfinie Valeurs en double"], a: 1, exp: "La plage à borne mobile ne voit que les lignes précédentes : le premier Alpha reste blanc." },
      { type: "vf", q: "Si la règle « Annule » est placée en haut et que la case « Arrêter si VRAI » est cochée, les lignes annulées ne recevront aucune autre mise en forme.", a: true, exp: "L'évaluation s'interrompt : c'est le moyen propre de neutraliser les alertes sur un projet abandonné." }
    ],
    solution: `<p>Quatre règles, créées dans cet ordre de priorité (Gestionnaire de règles, de haut en bas).</p>
<pre class="pseudo">Regle 1 -- ligne grisee pour les projets annules
   S'applique a : =\$A\$2:\$E\$200
   Formule      : =\$B2 = "Annule"
   Format       : fond gris clair, police grisee, barre
   Cocher       : Arreter si VRAI
   \$B    la colonne testee est toujours B
   2     la ligne suit la ligne courante
   // "Arreter si VRAI" empeche les alertes rouges/orange
   // de s'afficher sur un projet abandonne

Regle 2 -- depassement de budget
   S'applique a : =\$E\$2:\$E\$200
   Formule      : =\$E2 &gt; \$D2
   Format       : police rouge gras
   // compare deux colonnes ligne a ligne
   // ici Alpha : 12500 &gt; 10000 -> rouge

Regle 3 -- echeance depassee sur un projet actif
   S'applique a : =\$C\$2:\$C\$200
   Formule      : =ET(\$C2 &lt; AUJOURDHUI() ; \$B2 &lt;&gt; "Termine")
   Format       : fond orange
   ET(...)              les deux conditions doivent etre vraies
   \$C2 &lt; AUJOURDHUI()   la date est passee
   \$B2 &lt;&gt; "Termine"     le projet n'est pas cloture
   // sans la 2e condition, tous les projets livres passeraient en orange

Regle 4 -- doublons de nom de projet
   S'applique a : =\$A\$2:\$A\$200
   Formule      : =NB.SI(\$A\$2:A2 ; A2) &gt; 1
   Format       : police orange
   \$A\$2:A2   plage a borne MOBILE : elle s'arrete a la ligne courante
   &gt; 1        la valeur est deja apparue plus haut
   // seul le 2e "Alpha" (ligne 5) est signale ; le 1er reste blanc

Bonus -- zebrage de fond, a placer en DERNIERE priorite :
   Formule : =MOD(LIGNE() ; 2) = 0
   // etant la derniere, il ne masque aucune alerte</pre>
<p>Vérifie toujours ton travail dans <strong>Gérer les règles</strong> : contrôle l'ordre, la zone « S'applique à » (elle doit rester une plage unique et continue), et teste en modifiant une valeur — si rien ne bouge, le coupable est neuf fois sur dix un <code>\$</code> mal placé.</p>`
  }
};
</script>

<script>

  items: [
  { id: "excelpro-j12", lab: {"title":"À reproduire","intro":"Poser plusieurs règles de mise en forme conditionnelle par formule sur un même tableau.","steps":"1) Saisis en A1:D4 : en-têtes Produit, Stock, Seuil, Actif ; P1 5 10 Oui ; P2 20 10 Oui ; P3 8 10 Non.\n2) Sélectionne A2:D4. Accueil > Mise en forme conditionnelle > Nouvelle règle > Utiliser une formule.\n3) Règle 1 : =$B2<$C2 > Format remplissage rouge clair.\n4) Règle 2 (nouvelle) : =$D2=\"Non\" > Format police grise + barré.","check":"La ligne P1 (5<10) devient rouge, la ligne P3 (Actif=Non) devient grise barrée, P2 reste normale."}, title: "Alerte stock : trois règles sur un même tableau", level: 2,
    statement: "Recopie ce tableau de stock en A1:E6. Crée trois règles de mise en forme conditionnelle par formule : (1) toute la ligne en rouge clair quand le stock est strictement inférieur au seuil ; (2) toute la ligne en gris barré quand la colonne Actif vaut NON ; (3) la référence en orange si elle apparaît plusieurs fois, sans colorer la première occurrence. Précise pour chaque règle la plage, la formule et l'ordre de priorité.<pre class=\"pseudo\">      A       B          C       D       E\n  1  Ref     Produit    Stock   Seuil   Actif\n  2  R-100   Casque     4       10      OUI\n  3  R-200   Clavier    45      20      OUI\n  4  R-100   Casque BT  2       10      OUI\n  5  R-300   Souris     8       15      NON\n  6  R-400   Ecran      30      12      OUI</pre>",
    hints: [
      "Pour colorer une LIGNE entière, sélectionne A2:E6 en entier et fige la colonne testée avec un $ (la ligne reste libre).",
      "La règle « inactif » doit passer AVANT la règle « stock bas », sinon la ligne R-300 s'affichera en rouge alors que le produit n'est plus vendu. Coche « Arrêter si VRAI ».",
      "Pour ne pas colorer la première occurrence d'un doublon, la plage de NB.SI doit grandir : borne de départ figée, borne de fin libre."
    ],
    solution: "Selection commune aux regles 1 et 2 : A2:E6 (cellule active A2)\nChemin : Accueil > Mise en forme conditionnelle > Nouvelle regle\n         > Utiliser une formule pour determiner pour quelles cellules...\n\nREGLE 1 (priorite 1) -- produit inactif\n   S'applique a : =$A$2:$E$6\n   Formule      : =$E2 = \"NON\"\n   Format       : fond gris clair, police grisee, attribut Barre\n   Cocher       : Arreter si VRAI\n   $E   la colonne testee est TOUJOURS E (le $ fige la colonne)\n   2    la ligne suit : A2 teste E2, A5 testera E5\n   // \"Arreter si VRAI\" est la cle : la ligne R-300 (stock 8 < seuil 15)\n   // remplit aussi la condition de la regle 2, mais l'evaluation\n   // s'arrete ici et elle reste grise au lieu de virer au rouge\n\nREGLE 2 (priorite 2) -- stock sous le seuil\n   S'applique a : =$A$2:$E$6\n   Formule      : =$C2 < $D2\n   Format       : fond rouge clair, police rouge fonce\n   $C2 < $D2   compare stock et seuil sur la MEME ligne\n   // les deux colonnes sont figees, les lignes restent libres\n\nREGLE 3 (priorite 3) -- reference en double\n   S'applique a : =$A$2:$A$6\n   Formule      : =NB.SI($A$2:A2 ; A2) > 1\n   Format       : police orange gras\n   $A$2   borne de depart FIGEE\n   A2      borne de fin LIBRE : la plage grandit ligne apres ligne\n           en A2 -> NB.SI(A2:A2;A2) = 1  -> pas colore\n           en A4 -> NB.SI(A2:A4;A4) = 2  -> colore\n   // seule la 2e apparition de R-100 est signalee\n\nResultat attendu ligne par ligne :\n  L2  R-100  stock 4 < 10   -> LIGNE ROUGE (ref R-100 non coloree, 1re occurrence)\n  L3  R-200  stock 45 >= 20 -> aucune mise en forme\n  L4  R-100  stock 2 < 10   -> LIGNE ROUGE + ref R-100 EN ORANGE (doublon)\n  L5  R-300  Actif = NON    -> LIGNE GRISE BARREE (le stock bas est ignore)\n  L6  R-400  stock 30 >= 12 -> aucune mise en forme\n\nVerification : Accueil > Mise en forme conditionnelle > Gerer les regles\n   Les fleches Haut/Bas reordonnent les regles.\n   La colonne \"S'applique a\" doit afficher UNE seule plage continue par regle.",
    note: "Trois pieges concentres. (1) Le $ manquant : si tu ecris =C2<D2 au lieu de =$C2<$D2 sur une plage de 5 colonnes, chaque colonne decale la comparaison d'un cran (la colonne B comparerait D a E) et tu obtiens un damier absurde. (2) L'ORDRE des regles : sans \"Arreter si VRAI\" sur la regle inactif, la ligne R-300 recevrait le fond gris ET le fond rouge -- et le rouge de la regle superieure gagnerait. (3) La plage a borne mobile $A$2:A2 : c'est la difference entre \"signaler les repetitions\" et \"signaler toutes les occurrences\". La regle predefinie Valeurs en double ferait la seconde, ce qui est rarement le besoin reel." }
