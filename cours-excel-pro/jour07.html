<script>
var DAY = {
  num: 7,
  title: "Les tableaux dynamiques (FILTRE, UNIQUE, TRIER, SEQUENCE)",
  subtitle: "Les fonctions matricielles modernes qui « déversent » automatiquement leurs résultats sur plusieurs cellules.",
  theory: `
<h3>1. Le concept de « spill » (plage renversante)</h3>
<p><span class="tag">365</span> <strong>Réservé à Excel 2021 et Microsoft 365.</strong> Ces fonctions renvoient un <em>tableau</em> de résultats, pas une seule valeur. Excel les affiche dans la cellule où tu écris la formule PUIS <strong>déverse</strong> automatiquement le reste dans les cellules voisines. On appelle ça une <strong>plage renversante</strong> (ou « spill »). Tu écris UNE formule, et plusieurs cellules se remplissent.</p>
<pre class="pseudo">// Une formule unique dont le resultat "deborde" :
E2 : =TRIER(A2:A10)
   // E2, E3, E4... se remplissent tout seuls avec les valeurs triees</pre>
<div class="warn">Si une cellule de destination est déjà occupée, Excel affiche l'erreur <code>#PROPAGATION!</code> (SPILL) : libère l'espace nécessaire.</div>

<h3>2. L'opérateur # (référence à toute la plage déversée)</h3>
<p>Pour désigner TOUTE la plage déversée depuis E2, on écrit <code>E2#</code>. Elle s'ajuste toute seule si le nombre de résultats change.</p>
<pre class="pseudo">=NBVAL(E2#)   // compte toutes les valeurs de la plage deversee depuis E2</pre>

<h3>3. FILTRE : extraire les lignes qui respectent un critère</h3>
<pre class="pseudo">=FILTRE(plage ; condition ; [si_vide])
   plage        les donnees a extraire
   condition    un test qui renvoie VRAI/FAUX ligne par ligne
   si_vide      (facultatif) valeur si aucune ligne ne correspond</pre>
<pre class="pseudo">=FILTRE(A2:C10 ; B2:B10="Paris" ; "Aucun")
   A2:C10           les colonnes a renvoyer
   B2:B10="Paris"   ne garde que les lignes ou la ville = Paris
   "Aucun"          affiche si rien ne correspond (evite #CALC!)
   // deverse toutes les lignes de Paris</pre>
<pre class="pseudo">=FILTRE(A2:C10 ; (B2:B10="Paris")*(C2:C10>500))
   *   combine deux conditions en ET (comme SOMMEPROD)
   +   combinerait en OU</pre>

<h3>4. UNIQUE : la liste sans doublons</h3>
<pre class="pseudo">=UNIQUE(plage ; [par_colonne] ; [une_seule_fois])
   plage           les valeurs a dedoublonner
   une_seule_fois  VRAI = ne garde que les valeurs apparaissant EXACTEMENT une fois</pre>
<pre class="pseudo">=UNIQUE(A2:A100)   // la liste des valeurs distinctes de A2:A100 (chaque valeur une fois)</pre>

<h3>5. TRIER et TRIER.PAR</h3>
<pre class="pseudo">=TRIER(plage ; [colonne] ; [ordre])
   ordre   1 = croissant (defaut) ; -1 = decroissant
=TRIER(A2:A10 ; ; -1)   // A2:A10 trie decroissant</pre>
<pre class="pseudo">=TRIER.PAR(plage_a_trier ; plage_cle1 ; ordre1 ; ...)
   // trie une plage SELON une autre colonne (ex : noms selon les scores)
=TRIER.PAR(A2:A10 ; B2:B10 ; -1)   // les noms tries par score decroissant</pre>

<h3>6. SEQUENCE : générer une suite de nombres</h3>
<pre class="pseudo">=SEQUENCE(lignes ; [colonnes] ; [debut] ; [pas])
   lignes    nombre de lignes a generer
   debut     premiere valeur (defaut 1)
   pas       increment (defaut 1)</pre>
<pre class="pseudo">=SEQUENCE(5)          // 1;2;3;4;5 (en colonne)
=SEQUENCE(12;1;1;1)   // 1 a 12 : utile pour generer des mois, des numeros...</pre>

<h3>7. Combiner ces fonctions (la vraie puissance)</h3>
<pre class="pseudo">=TRIER(UNIQUE(FILTRE(A2:A100 ; B2:B100="Ventes")))
   FILTRE(...)   les vendeurs du service Ventes
   UNIQUE(...)   sans doublons
   TRIER(...)    triee alphabetiquement
   // un rapport dynamique qui se recalcule quand les donnees changent</pre>
<div class="tip">Avantage majeur : ces listes se mettent à jour TOUTES SEULES quand la source change. Fini de re-tirer les formules. Alternative en versions anciennes : Supprimer les doublons (menu), tri manuel, ou SOMMEPROD/matricielles Ctrl+Maj+Entrée — beaucoup moins souple.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie qu'une formule « déverse » (spill) ?", opts: ["Elle plante", "Elle remplit automatiquement plusieurs cellules voisines avec son résultat", "Elle supprime des données", "Elle affiche uniquement le premier résultat, sans se répandre"], a: 1, exp: "Un tableau de résultats se répand dans les cellules à côté." },
    { type: "qcm", q: "Ces fonctions (FILTRE, UNIQUE, TRIER, SEQUENCE) sont disponibles…", opts: ["partout", "sur Excel 2021 et Microsoft 365 uniquement", "sur 2016", "sur Mac seulement"], a: 1, exp: "Fonctions matricielles dynamiques récentes." },
    { type: "qcm", q: "Que signifie l'erreur #PROPAGATION! (SPILL) ?", opts: ["La formule est fausse", "Une cellule de destination est déjà occupée", "Il manque un argument", "Le fichier est corrompu"], a: 1, exp: "Le déversement est bloqué par une cellule non vide." },
    { type: "input", q: "Écris la formule qui extrait toutes les lignes de A2:C10 où la ville (B2:B10) = « Paris ».", a: ["=FILTRE(A2:C10;B2:B10=\"Paris\")"], ph: "=FILTRE(...)", exp: "FILTRE renvoie les lignes respectant la condition." },
    { type: "input", q: "Écris la liste sans doublons de A2:A100.", a: ["=UNIQUE(A2:A100)"], ph: "=UNIQUE(...)", exp: "UNIQUE ne garde chaque valeur qu'une fois." },
    { type: "qcm", q: "Comment désigner toute la plage déversée depuis E2 ?", opts: ["E2*", "E2#", "E2!", "PLAGE(E2)"], a: 1, exp: "L'opérateur # renvoie la plage renversante entière." },
    { type: "input", q: "Trie A2:A10 en ordre décroissant.", a: ["=TRIER(A2:A10;;-1)"], ph: "=TRIER(...;;-1)", exp: "Le 3e argument -1 impose l'ordre décroissant." },
    { type: "input", q: "Trie les noms A2:A10 selon les scores B2:B10, du plus haut au plus bas.", a: ["=TRIER.PAR(A2:A10;B2:B10;-1)"], ph: "=TRIER.PAR(...)", exp: "TRIER.PAR trie une plage selon une autre colonne." },
    { type: "input", q: "Génère une suite de 5 nombres (1 à 5) avec SEQUENCE.", a: ["=SEQUENCE(5)"], ph: "=SEQUENCE(...)", exp: "SEQUENCE(5) produit 1;2;3;4;5 en colonne." },
    { type: "qcm", q: "Dans FILTRE, comment combiner deux conditions en ET ?", opts: ["avec le mot ET", "en les multipliant : (cond1)*(cond2)", "avec une virgule", "impossible"], a: 1, exp: "* = ET, + = OU, comme dans SOMMEPROD." },
    { type: "vf", q: "Une liste faite avec UNIQUE se met à jour toute seule quand la source change.", a: true, exp: "C'est l'avantage des fonctions dynamiques : recalcul automatique." },
    { type: "input", q: "Extrais les lignes A2:C10 où ville=« Paris » ET montant (C2:C10) > 500.", a: ["=FILTRE(A2:C10;(B2:B10=\"Paris\")*(C2:C10>500))"], ph: "=FILTRE(A2:C10;(...)*(...))", exp: "Le produit des conditions = ET." },
    { type: "qcm", q: "Le 3e argument de FILTRE (si_vide) sert à…", opts: ["trier", "afficher une valeur si aucune ligne ne correspond", "compter", "limiter le nombre de lignes renvoyées"], a: 1, exp: "Il évite l'erreur #CALC! quand le filtre ne retient rien." },
    { type: "input", q: "Combine : liste triée et sans doublons des vendeurs (A2:A100) du service « Ventes » (B2:B100).", a: ["=TRIER(UNIQUE(FILTRE(A2:A100;B2:B100=\"Ventes\")))"], ph: "=TRIER(UNIQUE(FILTRE(...)))", exp: "FILTRE puis UNIQUE puis TRIER : un rapport dynamique." },
    { type: "vf", q: "Sur Excel 2016, on peut utiliser FILTRE directement.", a: false, exp: "Non : sur 2016 il faut passer par le menu, des matricielles Ctrl+Maj+Entrée ou SOMMEPROD." }
  ],
  final: {
    title: "Exercice final — Un rapport dynamique des ventes",
    intro: `<p>À partir de cette table, on veut construire des vues qui se recalculent seules. Les données :</p>
<pre class="pseudo">      A         B        C
  1  Vendeur   Ville    Montant
  2  Ali       Paris    800
  3  Bea       Lyon     300
  4  Ali       Paris    1200
  5  Chris     Paris    400
  6  Bea       Lyon     600</pre>
<p>Objectifs : la liste des villes sans doublons, les lignes de Paris, et les vendeurs triés.</p>`,
    questions: [
      { type: "input", q: "Liste des villes sans doublons (B2:B6).", a: ["=UNIQUE(B2:B6)"], ph: "=UNIQUE(...)", exp: "UNIQUE renvoie Paris et Lyon, une fois chacune." },
      { type: "input", q: "Extrais toutes les lignes A2:C6 où la ville est « Paris » (B2:B6).", a: ["=FILTRE(A2:C6;B2:B6=\"Paris\")"], ph: "=FILTRE(...)", exp: "FILTRE déverse les 3 lignes de Paris." },
      { type: "input", q: "Combien de lignes le filtre « Paris » renvoie-t-il ?", a: ["3"], ph: "un nombre", exp: "Ali(800), Ali(1200), Chris(400) → 3 lignes." },
      { type: "input", q: "Liste des vendeurs sans doublons (A2:A6), triée par ordre alphabétique.", a: ["=TRIER(UNIQUE(A2:A6))"], ph: "=TRIER(UNIQUE(...))", exp: "UNIQUE dédoublonne, TRIER classe : Ali, Bea, Chris." },
      { type: "input", q: "Extrais les lignes de Paris (B2:B6) dont le Montant (C2:C6) dépasse 500.", a: ["=FILTRE(A2:C6;(B2:B6=\"Paris\")*(C2:C6>500))"], ph: "=FILTRE(A2:C6;(...)*(...))", exp: "Deux conditions en ET via le produit." }
    ],
    solution: `<p>Trois vues dynamiques qui se recalculent quand la table change :</p>
<pre class="pseudo">Villes distinctes :
=UNIQUE(B2:B6)
-> Paris ; Lyon

Lignes de Paris :
=FILTRE(A2:C6 ; B2:B6="Paris")
   B2:B6="Paris"   {V;F;V;V;F}
-> Ali/Paris/800 ; Ali/Paris/1200 ; Chris/Paris/400  (3 lignes)

Vendeurs uniques tries :
=TRIER(UNIQUE(A2:A6))
-> Ali ; Bea ; Chris

Paris ET montant > 500 :
=FILTRE(A2:C6 ; (B2:B6="Paris")*(C2:C6>500))
   *   combine les deux conditions en ET
-> Ali/800 ; Ali/1200</pre>
<p>À retenir : ces fonctions déversent leurs résultats et se mettent à jour toutes seules. Réserve-les à 365/2021.</p>`
  }
};
</script>

  { id: "excelpro-j07", lab: {"title":"À reproduire","intro":"Construire trois formules dynamiques qui se déversent : UNIQUE, FILTRE+TRIER et SEQUENCE.","steps":"1) Saisis Ana Excel, Bob Word, Cid Excel, Dan Excel (colonnes A=Nom, B=Formation, à partir de la ligne 2).\n2) En F1 tape : =UNIQUE(B2:B5)\n3) En F3 tape : =TRIER(FILTRE(A2:A5;B2:B5=\"Excel\"))\n4) En H1 tape : =SEQUENCE(3)","check":"F1 se déverse en Excel puis Word (2 valeurs), F3 affiche Ana, Cid, Dan (triés), H1 affiche 1, 2, 3."}, title: "Tableau de bord auto-actualisé", level: 3,
    statement: "Recopie ce journal d'inscriptions. Construis trois formules dynamiques : en F1, la liste sans doublons des formations ; en F3, toutes les lignes de la formation « Excel » triées par nom ; en H1, une numérotation 1..N générée avec SEQUENCE en face du filtre.<pre class=\"pseudo\">      A        B          C\n  1  Nom      Formation  Ville\n  2  Ali      Excel      Paris\n  3  Bea      Word       Lyon\n  4  Chris    Excel      Paris\n  5  Dora     Excel      Lyon</pre>",
    hints: [

    solution: "En F1, la liste des formations distinctes :\n=UNIQUE(B2:B5)\n-> Excel ; Word\n\nEn F3, les inscrits \"Excel\" tries par nom :\n=TRIER(FILTRE(A2:C5 ; B2:B5=\"Excel\") ; 1 ; 1)\n   FILTRE(A2:C5;B2:B5=\"Excel\")   garde les 3 lignes Excel (Ali, Chris, Dora)\n   TRIER(... ; 1 ; 1)             trie sur la 1re colonne (Nom), croissant\n-> Ali/Excel/Paris ; Chris/Excel/Paris ; Dora/Excel/Lyon\n\nEn H1, la numerotation en face du filtre :\n=SEQUENCE(NBVAL(F3#) ; 1 ; 1 ; 1)\n   NBVAL(F3#)   compte les lignes deversees par le filtre (ici 3)\n   SEQUENCE(3)  genere 1 ; 2 ; 3\n-> 1 ; 2 ; 3 (s'ajuste si le nombre d'inscrits Excel change)\n\nResultat attendu : F1 deverse Excel/Word ; F3 deverse 3 lignes triees ; H1 deverse 1;2;3.",
    note: "F3# designe TOUTE la plage deversee par la formule en F3 : NBVAL(F3#) suit automatiquement le nombre de lignes filtrees. Toute cette mecanique exige 365/2021 ; sur une version plus ancienne, il faudrait un tableau croise dynamique ou un filtre manuel a re-appliquer a la main." }
