<body>
<script>
var DAY = {
  num: 9,
  title: "Les fonctions texte avancées",
  subtitle: "Découper, nettoyer et reconstruire des chaînes de caractères : la boîte à outils indispensable avant toute analyse.",
  theory: `
<h3>1. Pourquoi les fonctions texte ?</h3>
<p>Les données arrivent rarement propres : « DUPONT jean », « ref-2024-0087 », « paris ». Avant de trier, filtrer ou faire un TCD, il faut <strong>normaliser</strong>. Une <strong>chaîne de caractères</strong> est simplement une suite de caractères (lettres, chiffres, espaces) ; chaque caractère occupe une <strong>position</strong> numérotée à partir de 1.</p>

<h3>2. Les trois fonctions de découpe : GAUCHE, DROITE, STXT</h3>
<pre class="pseudo">=GAUCHE(texte ; nb)     // les nb premiers caracteres, en partant de la gauche
=DROITE(texte ; nb)     // les nb derniers caracteres
=STXT(texte ; depart ; nb)   // nb caracteres a partir de la position depart</pre>
<pre class="pseudo">=GAUCHE("REF-2024-0087" ; 3)      // renvoie "REF"
=DROITE("REF-2024-0087" ; 4)      // renvoie "0087"
=STXT("REF-2024-0087" ; 5 ; 4)    // renvoie "2024"
   5   on demarre au 5e caractere (le "2")
   4   on prend 4 caracteres</pre>

<h3>3. Localiser un caractère : CHERCHE et TROUVE</h3>
<p>Le plus souvent on ne connaît pas la position à l'avance : on la <strong>calcule</strong>. <strong>TROUVE</strong> respecte la casse (majuscules/minuscules), <strong>CHERCHE</strong> ne la respecte pas et accepte les jokers <code>*</code> et <code>?</code>.</p>
<pre class="pseudo">=CHERCHE(texte_cherche ; dans_texte ; [position_depart])
   // renvoie la POSITION (un nombre) de la premiere occurrence
   // renvoie #VALEUR! si le texte n'est pas trouve</pre>
<pre class="pseudo">=STXT(A2 ; CHERCHE(" " ; A2) + 1 ; 10)
   CHERCHE(" ";A2)      position du 1er espace, ex. 7
   + 1                  on demarre juste APRES l'espace, ex. 8
   10                   on extrait 10 caracteres
   // extrait le prenom apres le nom de famille</pre>
<div class="tip">Pour extraire « tout ce qui reste » sans compter, utilise NBCAR (longueur totale) : <code>=STXT(A2 ; CHERCHE(" ";A2)+1 ; NBCAR(A2))</code>. Demander plus de caractères qu'il n'en reste ne provoque aucune erreur.</div>

<h3>4. Mesurer et nettoyer : NBCAR, SUPPRESPACE, EPURAGE</h3>
<pre class="pseudo">=NBCAR(A2)         // nombre de caracteres, espaces compris
=SUPPRESPACE(A2)   // supprime les espaces en trop (debut, fin, doubles)
=EPURAGE(A2)       // supprime les caracteres non imprimables (issus de copies web)</pre>
<div class="warn">SUPPRESPACE ne supprime PAS l'espace insécable (caractère 160), très fréquent quand on copie depuis un site web. Combine alors : <code>=SUPPRESPACE(SUBSTITUE(A2 ; CAR(160) ; " "))</code>.</div>

<h3>5. Remplacer : SUBSTITUE et REMPLACER</h3>
<p>Deux logiques différentes. <strong>SUBSTITUE</strong> travaille sur le <em>contenu</em> (« remplace ce texte par celui-là »). <strong>REMPLACER</strong> travaille sur la <em>position</em> (« remplace 3 caractères à partir du 5e »).</p>
<pre class="pseudo">=SUBSTITUE(texte ; ancien ; nouveau ; [no_occurrence])
   // sans no_occurrence : remplace TOUTES les occurrences
=SUBSTITUE("01.02.03" ; "." ; "-")    // renvoie "01-02-03"
=SUBSTITUE("a-b-c" ; "-" ; "" ; 2)    // renvoie "a-bc" : seul le 2e tiret saute

=REMPLACER(texte ; depart ; nb_car ; nouveau)
=REMPLACER("FR7612345" ; 1 ; 2 ; "BE")   // renvoie "BE7612345"</pre>
<div class="tip">Astuce de comptage : pour compter combien de fois un caractère apparaît, on mesure la longueur avant/après suppression.
<code>=NBCAR(A2)-NBCAR(SUBSTITUE(A2;";";""))</code> donne le nombre de points-virgules.</div>

<h3>6. Changer la casse : MAJUSCULE, MINUSCULE, NOMPROPRE</h3>
<pre class="pseudo">=MAJUSCULE("dupont")    // "DUPONT"
=MINUSCULE("DUPONT")    // "dupont"
=NOMPROPRE("jean dupont")  // "Jean Dupont" : 1re lettre de chaque mot en majuscule</pre>

<h3>7. Assembler : CONCAT, JOINDRE.TEXTE et l'esperluette</h3>
<p><span class="tag">365</span> <strong>JOINDRE.TEXTE</strong> (TEXTJOIN) assemble une plage entière avec un <strong>séparateur</strong>, et peut ignorer les cellules vides. Elle date de 2019/365 ; avant, il fallait enchaîner les <code>&amp;</code> à la main.</p>
<pre class="pseudo">=JOINDRE.TEXTE(separateur ; ignorer_vide ; plage)
=JOINDRE.TEXTE(", " ; VRAI ; A2:A6)
   ", "    le separateur insere entre chaque valeur
   VRAI    les cellules vides sont ignorees (pas de ", ," parasite)
   A2:A6   la plage a assembler

Alternative toutes versions :  =A2&", "&A3&", "&A4</pre>
<p><strong>CONCAT</strong> (2019/365) colle une plage sans séparateur ; l'ancienne <strong>CONCATENER</strong> reste acceptée mais n'accepte pas les plages.</p>

<h3>8. Formater un nombre dans du texte : TEXTE</h3>
<pre class="pseudo">=TEXTE(valeur ; format)
="Total : " &amp; TEXTE(B2 ; "# ##0,00 €")
   "# ##0,00 €"   format d'affichage : separateur de milliers, 2 decimales
   // sans TEXTE, on obtiendrait "Total : 1234,5" sans mise en forme
=TEXTE(A2 ; "jjjj jj mmmm aaaa")   // "lundi 03 mars 2025"</pre>
<div class="warn">TEXTE renvoie du <strong>texte</strong> : le résultat n'est plus calculable. Ne l'utilise que pour l'affichage, jamais au milieu d'une chaîne de calculs.</div>

<h3>9. <span class="tag">365</span> La nouvelle génération : SEPARATETEXTE et les fonctions AVANT/APRES</h3>
<p>Sur Microsoft 365 uniquement, trois fonctions rendent tout ce qui précède beaucoup plus simple.</p>
<pre class="pseudo">=TEXTE.AVANT(texte ; delimiteur)     // tout ce qui precede le delimiteur
=TEXTE.APRES(texte ; delimiteur)     // tout ce qui suit
=SEPARATETEXTE(texte ; sep_colonne)  // eclate en plusieurs cellules

=TEXTE.AVANT("Dupont Jean" ; " ")    // "Dupont"
=TEXTE.APRES("Dupont Jean" ; " ")    // "Jean"
=SEPARATETEXTE(A2 ; " ")             // renvoie 2 cellules : Dupont | Jean</pre>
<p>SEPARATETEXTE produit une <strong>plage renversante</strong> (spill) : une seule formule remplit plusieurs cellules voisines (jour 7). Sur une version antérieure à 365, remplace TEXTE.AVANT par <code>=GAUCHE(A2;CHERCHE(" ";A2)-1)</code> et TEXTE.APRES par <code>=STXT(A2;CHERCHE(" ";A2)+1;NBCAR(A2))</code>, ou utilise le remplissage instantané (Ctrl+E).</p>`,
  exercises: [
    { type: "input", q: "Écris la formule qui extrait les 3 premiers caractères de A2.", a: ["=GAUCHE(A2;3)"], ph: "=GAUCHE(...)", exp: "GAUCHE prend les n premiers caractères en partant de la gauche." },
    { type: "qcm", q: "Quelle est la différence entre CHERCHE et TROUVE ?", opts: ["CHERCHE est plus rapide", "TROUVE respecte la casse, pas CHERCHE", "CHERCHE ne marche que sur les nombres", "Aucune différence"], a: 1, exp: "TROUVE est sensible à la casse ; CHERCHE ne l'est pas et accepte les jokers." },
    { type: "input", q: "Écris la formule qui extrait 4 caractères de A2 à partir de la position 5.", a: ["=STXT(A2;5;4)"], ph: "=STXT(A2;...)", exp: "STXT(texte ; départ ; nombre de caractères)." },
    { type: "qcm", q: "Que renvoie =CHERCHE(\" \";\"Jean Dupont\") ?", opts: ["1", "5", "\" \"", "#VALEUR!"], a: 1, exp: "L'espace est le 5e caractère : CHERCHE renvoie sa position, 5." },
    { type: "vf", q: "SUPPRESPACE supprime tous les espaces d'une chaîne, y compris ceux entre les mots.", a: false, exp: "Elle ne supprime que les espaces en trop : début, fin et doublons internes." },
    { type: "input", q: "Écris la formule qui remplace tous les points de A2 par des tirets.", a: ["=SUBSTITUE(A2;\".\";\"-\")"], ph: "=SUBSTITUE(A2;...)", exp: "Sans 4e argument, SUBSTITUE remplace toutes les occurrences." },
    { type: "qcm", q: "Quelle fonction remplace un texte en se basant sur une POSITION plutôt que sur un contenu ?", opts: ["SUBSTITUE", "REMPLACER", "CHERCHE", "EPURAGE"], a: 1, exp: "REMPLACER(texte ; départ ; nb_car ; nouveau) travaille par position." },
    { type: "input", q: "Écris la formule qui assemble A2:A6 séparés par « , » en ignorant les cellules vides.", a: ["=JOINDRE.TEXTE(\", \";VRAI;A2:A6)"], ph: "=JOINDRE.TEXTE(...)", exp: "JOINDRE.TEXTE(séparateur ; ignorer_vide ; plage), disponible depuis 2019/365." },
    { type: "vf", q: "Le résultat de la fonction TEXTE reste un nombre utilisable dans un calcul.", a: false, exp: "TEXTE renvoie du texte : la valeur n'est plus calculable directement." },
    { type: "qcm", q: "Que fait =NBCAR(A2)-NBCAR(SUBSTITUE(A2;\";\";\"\")) ?", opts: ["Compte les caractères de A2", "Compte le nombre de points-virgules dans A2", "Supprime les points-virgules", "Renvoie une erreur"], a: 1, exp: "La différence de longueur avant/après suppression donne le nombre d'occurrences." },
    { type: "input", q: "Écris la formule qui met la première lettre de chaque mot de A2 en majuscule.", a: ["=NOMPROPRE(A2)"], ph: "=NOMPROPRE(A2)", exp: "NOMPROPRE capitalise l'initiale de chaque mot." },
    { type: "qcm", q: "SEPARATETEXTE et TEXTE.AVANT sont disponibles :", opts: ["Depuis Excel 2010", "Sur Microsoft 365 uniquement", "Uniquement sur Mac", "Dans toutes les versions"], a: 1, exp: "Ce sont des fonctions 365 ; sinon on utilise GAUCHE/STXT/CHERCHE ou Ctrl+E." },
    { type: "input", q: "Écris la formule qui extrait tout ce qui suit le premier espace de A2 (version 365).", a: ["=TEXTE.APRES(A2;\" \")"], ph: "=TEXTE.APRES(...)", exp: "TEXTE.APRES coupe au délimiteur et renvoie la partie droite." },
    { type: "vf", q: "SUPPRESPACE ne supprime pas l'espace insécable CAR(160) copié depuis une page web.", a: true, exp: "Il faut d'abord le convertir : SUPPRESPACE(SUBSTITUE(A2;CAR(160);\" \"))." },
    { type: "qcm", q: "Que renvoie =GAUCHE(\"Dupont Jean\" ; CHERCHE(\" \";\"Dupont Jean\")-1) ?", opts: ["Dupont ", "Dupont", "Jean", "D"], a: 1, exp: "On prend les caractères jusqu'à la position de l'espace moins 1 : « Dupont »." }
  ],
  final: {
    title: "Exercice final — Nettoyer un fichier client importé",
    intro: `<p>Un export d'un vieux logiciel arrive en colonne A. Les noms sont collés en un seul bloc, avec des espaces parasites et une casse anarchique. Il faut produire un fichier propre.</p>
<pre class="pseudo">      A                          B          C
  1  Nom complet                 Nom        Prenom
  2  "  DUPONT jean  "
  3  "MARTIN sophie"
  4  "  bernard LUC "

  Objectif : B = nom en majuscules, C = prenom avec initiale majuscule.</pre>`,
    questions: [
      { type: "input", q: "En B2, extrais le nom (avant le premier espace) de la valeur NETTOYÉE de A2. Utilise SUPPRESPACE.", a: ["=GAUCHE(SUPPRESPACE(A2);CHERCHE(\" \";SUPPRESPACE(A2))-1)"], ph: "=GAUCHE(SUPPRESPACE(A2);...)", exp: "On nettoie d'abord, sinon l'espace de début fausse la position du premier espace." },
      { type: "qcm", q: "Pourquoi appliquer SUPPRESPACE AVANT de chercher l'espace ?", opts: ["Pour accélérer le calcul", "Sinon CHERCHE trouve l'espace parasite du début et renvoie 1", "Pour éviter une erreur #REF!", "Ce n'est pas nécessaire"], a: 1, exp: "Avec «   DUPONT », le premier espace est en position 1 : l'extraction serait vide." },
      { type: "input", q: "En C2, extrais le prénom (tout ce qui suit le premier espace) de la valeur nettoyée de A2.", a: ["=STXT(SUPPRESPACE(A2);CHERCHE(\" \";SUPPRESPACE(A2))+1;NBCAR(A2))"], ph: "=STXT(SUPPRESPACE(A2);...)", exp: "On démarre après l'espace ; demander NBCAR(A2) caractères prend simplement tout le reste." },
      { type: "qcm", q: "Comment forcer le prénom en « Jean » alors que la source contient « jean » ou « LUC » ?", opts: ["=MAJUSCULE(...)", "=NOMPROPRE(...) autour de l'extraction", "=SUPPRESPACE(...)", "=TEXTE(...)"], a: 1, exp: "NOMPROPRE met l'initiale en majuscule et le reste en minuscules." },
      { type: "vf", q: "Sur Microsoft 365, ces deux formules peuvent se résumer à TEXTE.AVANT et TEXTE.APRES.", a: true, exp: "Elles remplacent avantageusement le couple GAUCHE/STXT + CHERCHE." }
    ],
    solution: `<p>La règle d'or : <strong>nettoyer d'abord, découper ensuite</strong>.</p>
<pre class="pseudo">B2 (le nom, en majuscules) :
=MAJUSCULE(GAUCHE(SUPPRESPACE(A2) ; CHERCHE(" " ; SUPPRESPACE(A2)) - 1))
   SUPPRESPACE(A2)        retire les espaces de debut/fin -> "DUPONT jean"
   CHERCHE(" ";...)       position du 1er espace -> 7
   - 1                    on s'arrete juste avant -> 6 caracteres
   GAUCHE(...;6)          "DUPONT"
   MAJUSCULE(...)         force la casse haute

C2 (le prenom, initiale majuscule) :
=NOMPROPRE(STXT(SUPPRESPACE(A2) ; CHERCHE(" " ; SUPPRESPACE(A2)) + 1 ; NBCAR(A2)))
   + 1          on demarre juste APRES l'espace -> position 8
   NBCAR(A2)    on demande "tout le reste" (aucun risque de depassement)
   NOMPROPRE    "jean" -> "Jean" ; "LUC" -> "Luc"

Version Microsoft 365, bien plus lisible :
B2 : =MAJUSCULE(TEXTE.AVANT(SUPPRESPACE(A2) ; " "))
C2 : =NOMPROPRE(TEXTE.APRES(SUPPRESPACE(A2) ; " "))

Resultats attendus :
  ligne 2 -> DUPONT  |  Jean
  ligne 3 -> MARTIN  |  Sophie
  ligne 4 -> BERNARD |  Luc</pre>
<p>Si les données viennent d'un site web, ajoute une couche : <code>=SUPPRESPACE(SUBSTITUE(A2;CAR(160);" "))</code> pour neutraliser les espaces insécables avant tout traitement.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta formule / ton code ici…",
  items: [
  { id: "excelpro-j09", title: "Décoder une référence produit", level: 2,
    statement: "Recopie ce tableau de références. Chaque code suit le schéma FAMILLE-ANNEE-NUMERO. En B2 extrais la famille, en C2 l'année, en D2 le numéro (sans les zéros de tête, donc en nombre). Les longueurs de famille varient : ne code JAMAIS de position en dur.<pre class=\"pseudo\">      A                  B         C       D\n  1  Reference          Famille   Annee   Numero\n  2  CAS-2024-0087\n  3  CLAVIER-2023-0012\n  4  SOU-2025-0450</pre>",
    hints: [
      "La famille est tout ce qui précède le PREMIER tiret : GAUCHE + CHERCHE.",
      "L'année est encadrée par deux tirets. Pour trouver le 2e tiret, donne un 3e argument à CHERCHE : CHERCHE(\"-\";A2;CHERCHE(\"-\";A2)+1).",
      "Le numéro est à droite : DROITE(A2;4). Pour le convertir en nombre, multiplie par 1 ou utilise CNUM."
    ],
    solution: "B2 -- la famille (avant le 1er tiret) :\n=GAUCHE(A2 ; CHERCHE(\"-\" ; A2) - 1)\n   CHERCHE(\"-\";A2)   position du 1er tiret (4 pour CAS-, 8 pour CLAVIER-)\n   - 1               on s'arrete juste avant le tiret\n   // fonctionne quelle que soit la longueur de la famille\n\nC2 -- l'annee (entre les deux tirets) :\n=STXT(A2 ; CHERCHE(\"-\";A2) + 1 ; 4)\n   CHERCHE(\"-\";A2)+1   on demarre juste apres le 1er tiret\n   4                   l'annee fait toujours 4 caracteres\n\nVersion generique si l'annee pouvait changer de longueur :\n=STXT(A2 ; CHERCHE(\"-\";A2)+1 ; CHERCHE(\"-\";A2;CHERCHE(\"-\";A2)+1) - CHERCHE(\"-\";A2) - 1)\n   CHERCHE(\"-\";A2;depart)   le 3e argument dit ou COMMENCER a chercher\n                            -> localise ainsi le 2e tiret\n   difference des positions - 1 = longueur du morceau du milieu\n\nD2 -- le numero, converti en nombre :\n=CNUM(DROITE(A2 ; 4))\n   DROITE(A2;4)   \"0087\" (du texte, avec zeros de tete)\n   CNUM(...)      convertit en nombre -> 87\n   // =DROITE(A2;4)*1 donne le meme resultat\n\nVersion Microsoft 365 (beaucoup plus courte) :\nB2 : =TEXTE.AVANT(A2 ; \"-\")\nC2 : =TEXTE.AVANT(TEXTE.APRES(A2 ; \"-\") ; \"-\")\nD2 : =CNUM(TEXTE.APRES(A2 ; \"-\" ; -1))\n     le -1 en 3e argument = \"a partir du DERNIER delimiteur\"\nOu tout d'un coup : =SEPARATETEXTE(A2 ; \"-\")  -> remplit B2:D2 (plage renversante)\n\nResultats attendus :\n  ligne 2 -> CAS      | 2024 | 87\n  ligne 3 -> CLAVIER  | 2023 | 12\n  ligne 4 -> SOU      | 2025 | 450",
    note: "Le piege classique : ecrire =GAUCHE(A2;3) parce que la 1re ligne fait 3 lettres. Des la ligne CLAVIER-2023-0012, tout casse. Regle a retenir : dans une formule texte, une POSITION doit toujours etre CALCULEE (par CHERCHE ou TROUVE), jamais ecrite en dur. Autre piege : DROITE renvoie du TEXTE ; \"0087\" ne se trie pas et ne s'additionne pas comme un nombre, d'ou le CNUM." }
  ]
};
</script>
