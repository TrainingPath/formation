<body>
<script>
var DAY = {
  num: 14,
  title: "Consolider et analyser rapidement",
  subtitle: "Regrouper plusieurs feuilles, sommer en 3D, sous-totaliser et sortir un diagnostic en quelques secondes.",
  theory: `
<h3>1. Le problème : les données éparpillées</h3>
<p>Un classeur avec une feuille par mois, par agence ou par vendeur : la structure est identique partout, mais aucun total global n'existe. Excel propose plusieurs réponses, de la plus rapide à la plus robuste. Il faut savoir laquelle choisir.</p>

<h3>2. La référence 3D : sommer la même cellule sur plusieurs feuilles</h3>
<p>Une <strong>référence 3D</strong> désigne la même plage à travers un ensemble de feuilles consécutives. La syntaxe utilise deux points entre le nom de la première et de la dernière feuille.</p>
<pre class="pseudo">=SOMME(Janvier:Decembre!B5)
   Janvier:Decembre   toutes les feuilles SITUEES ENTRE ces deux onglets
   !B5                la cellule B5 de chacune d'elles
   // additionne les 12 valeurs en une formule

=MOYENNE(Janvier:Decembre!B5:B20)
=MAX(Agence1:Agence8!D10)</pre>
<div class="tip">Astuce d'insertion : tape <code>=SOMME(</code>, clique sur l'onglet Janvier, maintiens <strong>Maj</strong> et clique sur l'onglet Décembre, puis sélectionne B5. Excel écrit la syntaxe 3D tout seul.</div>
<div class="warn">Une référence 3D est <strong>positionnelle</strong> : elle prend tout ce qui se trouve entre les deux onglets. Insérer une feuille au milieu l'inclut automatiquement — pratique, mais dangereux si on y glisse une feuille de notes. Astuce de professionnel : encadrer la plage par deux feuilles vides nommées <code>DEBUT</code> et <code>FIN</code>, et écrire <code>=SOMME(DEBUT:FIN!B5)</code>. Toute feuille ajoutée entre les deux est comptée sans retoucher la formule.</div>
<div class="warn">Limite majeure : la 3D exige une structure <strong>strictement identique</strong> sur toutes les feuilles. Si en février un produit est inséré en ligne 7, tous les totaux deviennent faux, silencieusement.</div>

<h3>3. L'outil Consolider</h3>
<p><strong>Consolider</strong> regroupe plusieurs plages en un tableau de synthèse, y compris quand les libellés ne sont pas dans le même ordre : le regroupement se fait alors <em>par étiquette</em>, pas par position.</p>
<pre class="pseudo">Chemin : Données ▸ Consolider
   Fonction   : Somme (ou Moyenne, Nombre, Max...)
   Reference  : selectionner chaque plage puis cliquer Ajouter
   Cocher     : Ligne du haut  ET  Colonne de gauche
                -> le regroupement se fait par ETIQUETTE
   Cocher     : Lier aux donnees source
                -> cree un plan avec le detail, mis a jour automatiquement</pre>
<div class="warn">Sans « Lier aux données source », la consolidation est un <strong>instantané figé</strong> : modifier une source ne change rien au résultat. Il faut relancer l'outil. Avec la liaison, Excel insère des lignes de détail masquées dans un plan — le tableau devient vivant mais moins lisible.</div>

<h3>4. Les sous-totaux automatiques</h3>
<p>La commande <strong>Sous-total</strong> insère des lignes de synthèse à chaque changement de valeur dans une colonne, et génère un <strong>plan</strong> (les boutons 1, 2, 3 à gauche qui replient les détails).</p>
<pre class="pseudo">Prealable OBLIGATOIRE : trier sur la colonne de regroupement
Chemin : Données ▸ Sous-total
   A chaque changement de : Region
   Utiliser la fonction    : Somme
   Ajouter un sous-total a : Montant
   Cocher : Synthese sous les donnees</pre>
<div class="warn">Deux contraintes. (1) Sans <strong>tri préalable</strong>, Excel crée un sous-total à chaque alternance : le résultat est inutilisable. (2) La commande est <strong>grisée sur un tableau structuré</strong> : il faut le reconvertir en plage (Création de tableau ▸ Convertir en plage) ou passer par un TCD.</div>

<h3>5. SOUS.TOTAL et AGREGAT : compter ce qui est visible</h3>
<p><strong>SOUS.TOTAL</strong> a deux qualités : elle ignore les autres lignes de sous-total (pas de double comptage), et surtout elle peut <strong>ignorer les lignes filtrées ou masquées</strong> selon le numéro de fonction employé.</p>
<pre class="pseudo">=SOUS.TOTAL(no_fonction ; plage)
   1 a 11    ignore les lignes filtrees, mais COMPTE les lignes
             masquees manuellement
   101 a 111 ignore les filtres ET les lignes masquees a la main

   1/101 MOYENNE   2/102 NB      3/103 NBVAL
   4/104 MAX       5/105 MIN     9/109 SOMME

=SOUS.TOTAL(9 ; B2:B100)      // somme des lignes visibles apres filtre
=SOUS.TOTAL(109 ; B2:B100)    // idem + ignore les masquages manuels
=SOUS.TOTAL(3 ; A2:A100)      // NBVAL : compte les lignes filtrees affichees</pre>
<p><span class="tag">2010+</span> <strong>AGREGAT</strong> va plus loin : elle ajoute un troisième paramètre d'options permettant d'ignorer aussi les <strong>valeurs d'erreur</strong>, et donne accès à des fonctions absentes de SOUS.TOTAL (GRANDE.VALEUR, PETITE.VALEUR, MEDIANE).</p>
<pre class="pseudo">=AGREGAT(no_fonction ; options ; plage ; [k])
   no_fonction   9 = SOMME, 14 = GRANDE.VALEUR, 15 = PETITE.VALEUR
   options       6 = ignorer les erreurs
                 5 = ignorer les lignes masquees
                 7 = ignorer les deux
   k             le rang, pour les fonctions 14 a 19

=AGREGAT(9 ; 6 ; B2:B100)
   // somme la colonne MEME si elle contient des #N/A ou des #DIV/0!
   // la ou =SOMME(B2:B100) renverrait une erreur

=AGREGAT(14 ; 6 ; B2:B100 ; 3)
   // la 3e plus grande valeur, en ignorant les erreurs</pre>
<div class="tip">Le réflexe à garder : dans une ligne de total sous un tableau filtrable, n'écris jamais <code>=SOMME(...)</code> mais <code>=SOUS.TOTAL(109;...)</code>. Le total suivra les filtres. C'est d'ailleurs exactement ce qu'écrit la ligne de total automatique d'un tableau structuré.</div>

<h3>6. Les fonctions de synthèse conditionnelles</h3>
<p>Pour agréger sans TCD, les fonctions à suffixe <strong>.SI.ENS</strong> restent l'outil le plus direct. Leur syntaxe place la plage à calculer <em>en premier</em>, contrairement à NB.SI.ENS.</p>
<pre class="pseudo">=SOMME.SI.ENS(plage_somme ; plage_crit1 ; crit1 ; [plage_crit2 ; crit2] ; ...)
=NB.SI.ENS(plage_crit1 ; crit1 ; ...)          // pas de plage a sommer
=MOYENNE.SI.ENS(plage_moyenne ; plage_crit ; crit ; ...)
=MAX.SI.ENS(...) =MIN.SI.ENS(...)              // depuis Excel 2019

=SOMME.SI.ENS(D:D ; A:A ; "Nord" ; B:B ; "&gt;="&amp;DATE(2025;1;1))
   D:D                      la colonne a additionner
   A:A ; "Nord"             1er critere
   B:B ; "&gt;="&amp;DATE(2025;1;1) 2e critere : un operateur en TEXTE
                            concatene a la valeur
   // les guillemets autour de l'operateur sont OBLIGATOIRES</pre>

<h3>7. L'analyse rapide et les statistiques descriptives</h3>
<pre class="pseudo">Selectionner une plage ▸ icone "Analyse rapide" en bas a droite
   (ou Ctrl+Q)
   Mise en forme   barres, nuances, jeux d'icones en un clic
   Graphiques      suggestions adaptees a la forme des donnees
   Totaux          somme/moyenne en ligne OU en colonne
   Tableaux        creation d'un TCD ou d'un tableau structure
   Graphiques sparkline   mini-courbes dans la cellule</pre>
<p>Pour un diagnostic chiffré, l'<strong>Utilitaire d'analyse</strong> ajoute des outils statistiques : <code>Fichier ▸ Options ▸ Compléments ▸ Compléments Excel ▸ Atteindre ▸ cocher Utilitaire d'analyse</code>. Un bouton <em>Analyse de données</em> apparaît dans l'onglet Données, avec notamment <em>Statistiques descriptives</em> (moyenne, médiane, écart-type, asymétrie en un seul tableau).</p>

<h3>8. <span class="tag">365</span> Consolider avec les fonctions dynamiques</h3>
<pre class="pseudo">=EMPILERV(Janvier!A2:D50 ; Fevrier!A2:D50 ; Mars!A2:D50)
   // empile les trois plages l'une sous l'autre, en une formule
=EMPILERH(...)   // cote a cote

=LET(
    base ; EMPILERV(Janvier!A2:D50 ; Fevrier!A2:D50) ;
    reg  ; UNIQUE(FILTRE(PRENDRE(base;;1) ; PRENDRE(base;;1) &lt;&gt; "")) ;
    ASSEMB.H(reg ; SOMME.SI.ENS(PRENDRE(base;;4) ; PRENDRE(base;;1) ; reg))
)
   EMPILERV    fusionne les feuilles
   PRENDRE(base;;1)   la 1re colonne du bloc
   UNIQUE+FILTRE      la liste des regions distinctes, sans vides
   ASSEMB.H           colle les libelles et les totaux cote a cote
   // une synthese entierement automatique, sans TCD a actualiser</pre>
<p>EMPILERV, PRENDRE et ASSEMB.H sont réservées à Microsoft 365. Sur une version antérieure, la consolidation multi-feuilles passe par l'outil Consolider, un TCD multi-plages, ou — de loin la meilleure solution — Power Query, au programme des jours 15 et 16.</p>`,
  exercises: [
    { type: "input", q: "Écris la formule qui somme la cellule B5 de toutes les feuilles situées entre Janvier et Decembre.", a: ["=SOMME(Janvier:Decembre!B5)"], ph: "=SOMME(Janvier:Decembre!B5)", exp: "Les deux points désignent une plage de feuilles : c'est une référence 3D." },
    { type: "qcm", q: "Que se passe-t-il si on insère une nouvelle feuille entre Janvier et Decembre ?", opts: ["La formule 3D renvoie une erreur", "La nouvelle feuille est automatiquement incluse dans le calcul", "Rien du tout", "La formule se supprime"], a: 1, exp: "La référence 3D est positionnelle : tout ce qui est entre les deux onglets compte." },
    { type: "vf", q: "Une référence 3D fonctionne même si les feuilles ont des structures différentes.", a: false, exp: "Elle prend la même cellule partout : la structure doit être strictement identique." },
    { type: "qcm", q: "Dans l'outil Consolider, à quoi servent les cases « Ligne du haut » et « Colonne de gauche » ?", opts: ["À figer les volets", "À regrouper par étiquette plutôt que par position", "À masquer les en-têtes", "À trier"], a: 1, exp: "Cochées, elles permettent de consolider des tableaux dont l'ordre des lignes diffère." },
    { type: "vf", q: "Sans l'option « Lier aux données source », une consolidation est un instantané figé.", a: true, exp: "Modifier une source ne met rien à jour : il faut relancer l'outil." },
    { type: "qcm", q: "Que faut-il faire OBLIGATOIREMENT avant d'utiliser Données ▸ Sous-total ?", opts: ["Filtrer", "Trier sur la colonne de regroupement", "Créer un TCD", "Figer les volets"], a: 1, exp: "Sans tri, un sous-total est créé à chaque alternance de valeur." },
    { type: "input", q: "Écris la formule qui somme B2:B100 en ne comptant que les lignes visibles après filtrage.", a: ["=SOUS.TOTAL(109;B2:B100)"], ph: "=SOUS.TOTAL(109;B2:B100)", exp: "Le code 109 correspond à SOMME et ignore filtres et masquages manuels." },
    { type: "qcm", q: "Quelle différence entre SOUS.TOTAL(9;...) et SOUS.TOTAL(109;...) ?", opts: ["Aucune", "109 ignore aussi les lignes masquées manuellement", "9 est plus rapide", "109 ne fonctionne que sur 365"], a: 1, exp: "Les codes 101 à 111 excluent en plus les lignes masquées à la main." },
    { type: "input", q: "Écris la formule qui somme B2:B100 en ignorant les valeurs d'erreur qu'elle contient.", a: ["=AGREGAT(9;6;B2:B100)"], ph: "=AGREGAT(9;6;B2:B100)", exp: "Le code fonction 9 est SOMME, l'option 6 ignore les erreurs." },
    { type: "qcm", q: "Quel avantage AGREGAT a-t-elle sur SOUS.TOTAL ?", opts: ["Elle est plus courte", "Elle peut ignorer les erreurs et accède à GRANDE.VALEUR ou MEDIANE", "Elle trie les données", "Elle crée un graphique"], a: 1, exp: "Le paramètre options et les fonctions 12 à 19 sont propres à AGREGAT." },
    { type: "input", q: "Écris la formule qui somme la colonne D quand la colonne A vaut « Nord ».", a: ["=SOMME.SI.ENS(D:D;A:A;\"Nord\")"], ph: "=SOMME.SI.ENS(D:D;A:A;\"Nord\")", exp: "Dans SOMME.SI.ENS, la plage à additionner vient en premier." },
    { type: "vf", q: "La commande Données ▸ Sous-total est disponible sur un tableau structuré.", a: false, exp: "Elle est grisée : il faut convertir le tableau en plage ou utiliser un TCD." },
    { type: "qcm", q: "Quel raccourci ouvre l'Analyse rapide sur une plage sélectionnée ?", opts: ["Ctrl+L", "Ctrl+Q", "Ctrl+T", "F5"], a: 1, exp: "Ctrl+Q ouvre le menu contextuel de mise en forme, graphiques et totaux." },
    { type: "qcm", q: "Où active-t-on l'Utilitaire d'analyse et ses statistiques descriptives ?", opts: ["Dans l'onglet Insertion", "Fichier ▸ Options ▸ Compléments ▸ Compléments Excel", "Dans le ruban Révision", "Il est actif par défaut"], a: 1, exp: "C'est un complément à cocher ; il ajoute ensuite un bouton dans l'onglet Données." },
    { type: "input", q: "Écris la formule 365 qui empile verticalement les plages Janvier!A2:D50 et Fevrier!A2:D50.", a: ["=EMPILERV(Janvier!A2:D50;Fevrier!A2:D50)"], ph: "=EMPILERV(...)", exp: "EMPILERV est réservée à Microsoft 365 ; sinon, il faut Power Query." }
  ],
  final: {
    title: "Exercice final — Consolider quatre trimestres",
    intro: `<p>Un classeur contient quatre feuilles trimestrielles à structure identique, plus une feuille Synthese. Il faut produire les totaux annuels et une analyse filtrable.</p>
<pre class="pseudo">Feuilles T1, T2, T3, T4 -- structure identique :
      A          B         C         D
  1  Region     Produit   Qte       Montant
  2  Nord       Casque    12        1440
  3  Sud        Clavier    8         640
  ...  (jusqu'a la ligne 200)

Feuille Synthese, a construire.
Les onglets sont ranges dans l'ordre : T1, T2, T3, T4.</pre>`,
    questions: [
      { type: "input", q: "Sur Synthese, somme la cellule D2 des quatre feuilles trimestrielles avec une référence 3D.", a: ["=SOMME(T1:T4!D2)"], ph: "=SOMME(T1:T4!D2)", exp: "La syntaxe 3D parcourt toutes les feuilles situées entre T1 et T4." },
      { type: "qcm", q: "Quel risque si un collègue insère une feuille « Notes » entre T2 et T3 ?", opts: ["La formule renvoie #REF!", "La feuille Notes est incluse dans le total sans avertissement", "Rien ne change", "Excel refuse l'insertion"], a: 1, exp: "La référence 3D est positionnelle : d'où l'astuce des feuilles bornes DEBUT et FIN." },
      { type: "input", q: "Sur T1, écris le total de la colonne D qui suivra les filtres appliqués au tableau.", a: ["=SOUS.TOTAL(109;D2:D200)"], ph: "=SOUS.TOTAL(109;D2:D200)", exp: "Contrairement à SOMME, SOUS.TOTAL n'additionne que les lignes visibles." },
      { type: "input", q: "Sur T1, calcule le montant total de la région Nord pour le produit Casque.", a: ["=SOMME.SI.ENS(D2:D200;A2:A200;\"Nord\";B2:B200;\"Casque\")"], ph: "=SOMME.SI.ENS(D2:D200;A2:A200;...)", exp: "Deux couples plage/critère se cumulent avec un ET implicite." },
      { type: "vf", q: "Pour consolider quatre feuilles dont l'ordre des régions diffère, l'outil Données ▸ Consolider avec « Colonne de gauche » cochée est plus sûr qu'une référence 3D.", a: true, exp: "Le regroupement se fait par étiquette et non par position de cellule." }
    ],
    solution: `<p>Trois approches, de la plus rapide à la plus robuste.</p>
<pre class="pseudo">APPROCHE 1 -- la reference 3D (rapide, mais fragile)
=SOMME(T1:T4!D2)
   T1:T4   toutes les feuilles entre ces deux onglets
   !D2     la cellule D2 de chacune
   // exige une structure STRICTEMENT identique partout

   Version securisee : creer deux feuilles vides DEBUT et FIN
   encadrant T1..T4, puis ecrire
=SOMME(DEBUT:FIN!D2)
   // toute feuille trimestrielle ajoutee entre les bornes
   // est comptee sans retoucher la formule

APPROCHE 2 -- l'outil Consolider (robuste sur libelles desordonnes)
   Se placer sur Synthese!A1
   Données ▸ Consolider
      Fonction   : Somme
      Reference  : T1!\$A\$1:\$D\$200  ▸ Ajouter
                   T2!\$A\$1:\$D\$200  ▸ Ajouter
                   T3!\$A\$1:\$D\$200  ▸ Ajouter
                   T4!\$A\$1:\$D\$200  ▸ Ajouter
      Cocher     : Ligne du haut, Colonne de gauche
                   -> regroupement par ETIQUETTE, l'ordre des regions
                      peut differer d'une feuille a l'autre
      Cocher     : Lier aux donnees source
                   -> le resultat se met a jour et un plan replie le detail

APPROCHE 3 -- les totaux filtrables sur chaque feuille
=SOUS.TOTAL(109 ; D2:D200)
   109   SOMME, en ignorant filtres ET lignes masquees manuellement
   // a placer en D201 : le total suit les filtres de l'utilisateur
   // /!\ ne JAMAIS ecrire =SOMME(D2:D200) sur un tableau filtrable

=AGREGAT(9 ; 6 ; D2:D200)
   9 = SOMME, 6 = ignorer les erreurs
   // indispensable si la colonne contient des #N/A issus d'un RECHERCHEX

Les analyses ciblees :
=SOMME.SI.ENS(D2:D200 ; A2:A200 ; "Nord" ; B2:B200 ; "Casque")
   D2:D200          la colonne additionnee
   A2:A200 ; "Nord" 1er critere : la region
   B2:B200 ; "Casque" 2e critere : le produit
   // les criteres se cumulent (ET logique)

=NB.SI.ENS(A2:A200 ; "Nord" ; D2:D200 ; "&gt;1000")
   // combien de ventes Nord depassent 1000 EUR
   // l'operateur est ENTRE GUILLEMETS, colle a la valeur</pre>
<p>Le verdict pratique : la référence 3D pour un besoin ponctuel sur des feuilles maîtrisées, Consolider quand les libellés ne s'alignent pas, SOUS.TOTAL et les fonctions .SI.ENS pour l'analyse au quotidien. Mais dès que les feuilles se multiplient ou changent de forme, la vraie réponse s'appelle Power Query : elle empile les sources, se rafraîchit d'un clic et ne casse pas quand une colonne bouge. C'est l'objet des deux prochains jours.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta formule / ton code ici…",
  items: [
  { id: "excelpro-j14", title: "Un tableau de bord ventes filtrable", level: 2,
    statement: "Recopie ce tableau en A1:D9 puis construis un petit tableau de bord en F1:G6. Il doit contenir : le total général qui suit les filtres, le nombre de ventes visibles, le total de la région Nord, le total Nord pour le produit Casque, le nombre de ventes supérieures à 1000 EUR, et la deuxième plus grosse vente. Précise pour chaque cellule pourquoi tu choisis cette fonction plutôt qu'une autre.<pre class=\"pseudo\">      A        B          C      D\n  1  Region   Produit    Qte    Montant\n  2  Nord     Casque     12     1440\n  3  Sud      Clavier     8      640\n  4  Nord     Clavier    25     2000\n  5  Est      Casque      5      600\n  6  Nord     Casque      3      360\n  7  Sud      Ecran      10     2500\n  8  Est      Clavier    15     1200\n  9  Ouest    Casque      7      840</pre>",
    hints: [
      "Le tableau sera filtré par l'utilisateur : une SOMME classique en bas continuerait d'additionner les lignes masquées.",
      "Pour compter les lignes visibles, c'est encore SOUS.TOTAL mais avec le code de NBVAL, pas celui de SOMME.",
      "SOUS.TOTAL n'a pas de fonction GRANDE.VALEUR. Pour un classement, il faut AGREGAT et son quatrième argument."
    ],
    solution: "G1 -- total general, qui suit les filtres :\n=SOUS.TOTAL(109 ; D2:D9)\n   109   code SOMME, version qui ignore filtres ET lignes masquees a la main\n   // POURQUOI PAS =SOMME(D2:D9) : la somme classique continue d'additionner\n   // les lignes masquees par un filtre. Le total afficherait 9580 meme\n   // en ne montrant que la region Nord.\n   Sans filtre -> 9580\n   Filtre Nord -> 3800\n\nG2 -- nombre de ventes visibles :\n=SOUS.TOTAL(103 ; A2:A9)\n   103   code NBVAL (compte les cellules non vides)\n   // on compte sur une colonne TEXTE (A) : NBVAL convient.\n   // Le code 102 (NB) ne compterait que les nombres et renverrait 0 ici.\n   Sans filtre -> 8\n   Filtre Nord -> 3\n\nG3 -- total de la region Nord :\n=SOMME.SI.ENS(D2:D9 ; A2:A9 ; \"Nord\")\n   D2:D9         la colonne a additionner, TOUJOURS en premier argument\n   A2:A9;\"Nord\"  couple plage de critere / critere\n   // POURQUOI PAS SOUS.TOTAL : on veut un total fixe de la region Nord,\n   // independant du filtre en cours. Les deux repondent a des besoins\n   // differents : SOUS.TOTAL suit l'ecran, SOMME.SI.ENS suit un critere.\n   -> 1440 + 2000 + 360 = 3800\n\nG4 -- total Nord pour le produit Casque :\n=SOMME.SI.ENS(D2:D9 ; A2:A9 ; \"Nord\" ; B2:B9 ; \"Casque\")\n   // les deux couples plage/critere se cumulent (ET logique)\n   -> 1440 + 360 = 1800\n\nG5 -- nombre de ventes superieures a 1000 EUR :\n=NB.SI.ENS(D2:D9 ; \">1000\")\n   \">1000\"   l'operateur est ENTRE GUILLEMETS, colle a la valeur\n   // /!\\ NB.SI.ENS n'a PAS de plage a sommer en premier argument :\n   // la syntaxe demarre directement par le couple plage/critere.\n   // Si le seuil etait en F10 : =NB.SI.ENS(D2:D9 ; \">\"&F10)\n   //   -> l'operateur reste en texte, concatene a la reference\n   -> 1440, 2000, 2500, 1200 = 4 ventes\n\nG6 -- la 2e plus grosse vente :\n=AGREGAT(14 ; 6 ; D2:D9 ; 2)\n   14   code GRANDE.VALEUR\n   6    option : ignorer les valeurs d'erreur\n   D2:D9  la plage\n   2    le rang demande (le 4e argument, propre aux fonctions 14 a 19)\n   // POURQUOI PAS =GRANDE.VALEUR(D2:D9;2) : elle fonctionnerait ici,\n   // mais renverrait une erreur si la colonne contenait un #N/A.\n   // POURQUOI PAS SOUS.TOTAL : elle ne propose aucune fonction de rang.\n   -> 2500 (1er) puis 2000 (2e)  =>  2000\n\nResultats attendus, tableau non filtre :\n   G1 total general   9580\n   G2 nb de ventes    8\n   G3 total Nord      3800\n   G4 Nord + Casque   1800\n   G5 ventes > 1000   4\n   G6 2e plus grosse  2000",
    note: "Le piege recurrent : melanger SOUS.TOTAL et SOMME.SI.ENS. Elles ne repondent pas a la meme question. SOUS.TOTAL repond a \"que vois-je a l'ecran\" -- son resultat change avec les filtres. SOMME.SI.ENS repond a \"que vaut ce critere\" -- son resultat est stable, filtre ou pas. Un tableau de bord bien concu utilise les deux, mais jamais l'une a la place de l'autre. Deuxieme piege, plus subtil : le code 103 (NBVAL) contre 102 (NB). Sur une colonne de texte, 102 renvoie 0 -- une erreur silencieuse, sans message, qu'on ne remarque qu'en verifiant le chiffre a la main." }
  ]
