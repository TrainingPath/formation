<script>
var DAY = {
  num: 5,
  title: "SOMME.SI.ENS, NB.SI.ENS, MOYENNE.SI.ENS",
  subtitle: "Additionner, compter et moyenner selon PLUSIEURS critères, sans passer par un TCD.",
  theory: `
<h3>1. Du « SI » simple au « SI.ENS » multiple</h3>
<p>Tu connais SOMME.SI (une condition). Les versions <strong>.ENS</strong> (« ensemble ») acceptent <em>plusieurs</em> critères combinés en ET : la ligne compte seulement si elle respecte TOUS les critères. C'est l'outil idéal pour synthétiser des données sans TCD. Disponibles dans <strong>toutes les versions modernes</strong> (depuis Excel 2007).</p>

<h3>2. SOMME.SI.ENS : additionner selon des critères</h3>
<p><strong>Attention à l'ordre des arguments</strong> : ici, la plage à additionner vient EN PREMIER (contrairement à SOMME.SI où elle est en dernier).</p>
<pre class="pseudo">=SOMME.SI.ENS(plage_somme ; plage_critere1 ; critere1 ; plage_critere2 ; critere2 ; ...)
   plage_somme      la colonne des valeurs a additionner (EN PREMIER !)
   plage_critere1   la colonne ou tester le 1er critere
   critere1         la condition (ex : "Ventes", ">100", "<>0")
   ...              on peut enchainer plusieurs paires plage/critere</pre>
<pre class="pseudo">=SOMME.SI.ENS(C2:C100 ; A2:A100 ; "Ventes" ; B2:B100 ; "Paris")
   C2:C100    les montants a additionner
   A2:A100 ; "Ventes"   ne garde que les lignes du service "Ventes"
   B2:B100 ; "Paris"    ET de la ville "Paris"
   // somme des montants pour Ventes ET Paris uniquement</pre>

<h3>3. Les critères : opérateurs et jokers</h3>
<pre class="pseudo">"Paris"        egal a "Paris" (texte exact)
">100"         superieur a 100 (operateur entre guillemets)
">="&F1        superieur ou egal a la valeur de la cellule F1 (concatenation avec &)
"<>Paris"      different de "Paris"
"Dur*"         commence par "Dur" (joker * = suite de caracteres)
"<>"           non vide      "="  vide</pre>
<div class="warn">Piège classique : pour comparer à une CELLULE, on colle l'opérateur au contenu avec <strong>&</strong> : <code>">="&F1</code>. Écrire <code>">=F1"</code> chercherait littéralement le texte « F1 » !</div>

<h3>4. NB.SI.ENS : compter selon des critères</h3>
<p><strong>NB.SI.ENS</strong> compte le nombre de lignes qui respectent tous les critères. Pas de plage à sommer : que des paires plage/critère.</p>
<pre class="pseudo">=NB.SI.ENS(plage_critere1 ; critere1 ; plage_critere2 ; critere2 ; ...)
   // compte les lignes remplissant TOUS les criteres</pre>
<pre class="pseudo">=NB.SI.ENS(A2:A100 ; "Ventes" ; C2:C100 ; ">500")
   A2:A100;"Ventes"    lignes du service Ventes
   C2:C100;">500"      ET dont le montant depasse 500
   // combien de ventes superieures a 500 ?</pre>

<h3>5. MOYENNE.SI.ENS : moyenner selon des critères</h3>
<p>Même logique que SOMME.SI.ENS, mais renvoie la moyenne. La plage à moyenner est aussi en premier.</p>
<pre class="pseudo">=MOYENNE.SI.ENS(plage_moyenne ; plage_critere1 ; critere1 ; ...)</pre>
<pre class="pseudo">=MOYENNE.SI.ENS(C2:C100 ; A2:A100 ; "Ventes" ; B2:B100 ; "Paris")
   // montant MOYEN des lignes Ventes ET Paris</pre>
<div class="warn">Si aucune ligne ne correspond, MOYENNE.SI.ENS renvoie <code>#DIV/0!</code> (moyenne de rien). Entoure de SIERREUR au besoin : <code>=SIERREUR(MOYENNE.SI.ENS(...);0)</code>.</div>

<h3>6. Critères dynamiques via des cellules</h3>
<p>Le vrai intérêt : mettre les critères dans des cellules pour un mini tableau de bord interactif.</p>
<pre class="pseudo">=SOMME.SI.ENS(C:C ; A:A ; F1 ; B:B ; F2)
   F1   contient le service choisi par l'utilisateur
   F2   contient la ville choisie
   // la synthese se met a jour quand on change F1/F2</pre>
<div class="tip">On peut référencer des colonnes entières (A:A) : pratique et lisible, et Excel n'analyse que les cellules utilisées. Encore mieux : utilise des tableaux structurés (jour 1) pour des plages qui s'étendent seules.</div>`,
  exercises: [
    { type: "qcm", q: "Dans SOMME.SI.ENS, où se place la plage à additionner ?", opts: ["En dernier", "En premier argument", "Peu importe", "Elle n'existe pas"], a: 1, exp: "Contrairement à SOMME.SI, la plage_somme est en PREMIER." },
    { type: "input", q: "Additionne C2:C100 pour les lignes où A2:A100 = « Ventes ».", a: ["=SOMME.SI.ENS(C2:C100;A2:A100;\"Ventes\")"], ph: "=SOMME.SI.ENS(...)", exp: "plage_somme, puis plage_critère et critère." },
    { type: "input", q: "Additionne C2:C100 pour Ventes (A2:A100) ET Paris (B2:B100).", a: ["=SOMME.SI.ENS(C2:C100;A2:A100;\"Ventes\";B2:B100;\"Paris\")"], ph: "=SOMME.SI.ENS(...)", exp: "Les critères se combinent en ET." },
    { type: "qcm", q: "Comment écrire « supérieur à 100 » comme critère ?", opts: [">100 sans guillemets", "\">100\" (opérateur entre guillemets)", "SUP(100)", "100+"], a: 1, exp: "L'opérateur et la valeur sont dans des guillemets : \">100\"." },
    { type: "input", q: "Compte les lignes où A2:A100 = « Ventes » ET C2:C100 > 500.", a: ["=NB.SI.ENS(A2:A100;\"Ventes\";C2:C100;\">500\")"], ph: "=NB.SI.ENS(...)", exp: "NB.SI.ENS ne prend que des paires plage/critère." },
    { type: "qcm", q: "Pour comparer à la valeur d'une cellule F1 (≥ F1), on écrit…", opts: ["\">=F1\"", "\">=\"&F1", "F1>=", ">=F1 sans rien"], a: 1, exp: "On concatène l'opérateur au contenu : \">=\"&F1." },
    { type: "vf", q: "Écrire le critère \">=F1\" compare bien à la valeur de la cellule F1.", a: false, exp: "Non : cela cherche le texte « F1 ». Il faut \">=\"&F1." },
    { type: "input", q: "Calcule la moyenne de C2:C100 pour les lignes où A2:A100 = « Info ».", a: ["=MOYENNE.SI.ENS(C2:C100;A2:A100;\"Info\")"], ph: "=MOYENNE.SI.ENS(...)", exp: "Plage à moyenner en premier, puis critères." },
    { type: "qcm", q: "Que renvoie MOYENNE.SI.ENS si aucune ligne ne correspond ?", opts: ["0", "#DIV/0!", "vide", "VRAI"], a: 1, exp: "Moyenne de rien = division par zéro." },
    { type: "input", q: "Sécurise une MOYENNE.SI.ENS pour afficher 0 s'il n'y a aucune correspondance.", a: ["=SIERREUR(MOYENNE.SI.ENS(C2:C100;A2:A100;\"Info\");0)"], ph: "=SIERREUR(MOYENNE.SI.ENS(...);0)", exp: "SIERREUR remplace le #DIV/0! par 0." },
    { type: "qcm", q: "Le critère \"Dur*\" dans NB.SI.ENS compte les valeurs…", opts: ["égales à « Dur* »", "commençant par « Dur »", "finissant par « Dur »", "vides"], a: 1, exp: "Le joker * = n'importe quelle suite de caractères." },
    { type: "vf", q: "On peut mettre les critères dans des cellules (ex : F1) pour un tableau de bord interactif.", a: true, exp: "Les critères dynamiques recalculent la synthèse quand on change les cellules." },
    { type: "input", q: "Additionne C:C selon le service en F1 et la ville en F2 (colonnes A:A et B:B).", a: ["=SOMME.SI.ENS(C:C;A:A;F1;B:B;F2)"], ph: "=SOMME.SI.ENS(...)", exp: "Les cellules F1/F2 fournissent les critères dynamiques." },
    { type: "qcm", q: "Le critère \"<>\" signifie…", opts: ["vide", "non vide", "égal à zéro", "différent de zéro"], a: 1, exp: "\"<>\" = différent de rien = cellule non vide." },
    { type: "input", q: "Compte les cellules NON vides de la plage A2:A100.", a: ["=NB.SI.ENS(A2:A100;\"<>\")"], ph: "=NB.SI.ENS(...;\"<>\")", exp: "\"<>\" retient uniquement les cellules non vides." }
  ],
  final: {
    title: "Exercice final — Synthèse des ventes par service et ville",
    intro: `<p>Table de ventes à synthétiser. On veut des totaux et des comptes selon des critères, éventuellement pilotés par des cellules.</p>
<pre class="pseudo">      A         B        C
  1  Service   Ville    Montant
  2  Ventes    Paris    800
  3  Ventes    Lyon     300
  4  Compta    Paris    500
  5  Ventes    Paris    1200
  6  Info      Lyon     600</pre>
<p>On cherche : le total des ventes de Paris pour le service Ventes, le nombre de grosses ventes, etc.</p>`,
    questions: [
      { type: "input", q: "Total des Montants (C2:C6) pour Service=« Ventes » (A2:A6) ET Ville=« Paris » (B2:B6).", a: ["=SOMME.SI.ENS(C2:C6;A2:A6;\"Ventes\";B2:B6;\"Paris\")"], ph: "=SOMME.SI.ENS(...)", exp: "Deux critères combinés en ET." },
      { type: "input", q: "Combien vaut ce total ?", a: ["2000"], ph: "un nombre", exp: "Lignes Ventes+Paris : 800 + 1200 = 2000." },
      { type: "input", q: "Compte le nombre de lignes où Montant > 500 (C2:C6).", a: ["=NB.SI.ENS(C2:C6;\">500\")"], ph: "=NB.SI.ENS(...)", exp: "800, 1200 et 600 dépassent 500." },
      { type: "input", q: "Combien de lignes ce compte renvoie-t-il ?", a: ["3"], ph: "un nombre", exp: "800, 1200, 600 → trois lignes > 500." },
      { type: "input", q: "Moyenne des Montants du service « Ventes » (A2:A6).", a: ["=MOYENNE.SI.ENS(C2:C6;A2:A6;\"Ventes\")"], ph: "=MOYENNE.SI.ENS(...)", exp: "Moyenne de 800, 300, 1200." }
    ],
    solution: `<p>Trois synthèses multi-critères sans TCD :</p>
<pre class="pseudo">Total Ventes ET Paris :
=SOMME.SI.ENS(C2:C6 ; A2:A6;"Ventes" ; B2:B6;"Paris")
   C2:C6        les montants a additionner (en PREMIER)
   A2:A6;"Ventes"   garde le service Ventes
   B2:B6;"Paris"    ET la ville Paris
-> 800 + 1200 = 2000

Nombre de ventes > 500 :
=NB.SI.ENS(C2:C6 ; ">500")
-> 800, 1200, 600 -> 3

Montant moyen du service Ventes :
=MOYENNE.SI.ENS(C2:C6 ; A2:A6;"Ventes")
-> (800 + 300 + 1200) / 3 = 766,67</pre>
<p>À retenir : plage à agréger EN PREMIER pour SOMME/MOYENNE.SI.ENS ; pour comparer à une cellule, colle l'opérateur avec &.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excelpro-j05", lab: {"title":"À reproduire","intro":"Piloter un tableau de bord par deux critères avec SOMME.SI.ENS et NB.SI.ENS.","steps":"1) Saisis : Repas Janvier 120, Repas Janvier 80, Transport Janvier 200, Repas Février 150 (colonnes A=Catégorie, B=Mois, C=Montant, à partir de la ligne 2).\n2) En G1 tape Repas, en G2 tape Janvier.\n3) En G3 tape : =SOMME.SI.ENS(C2:C5;A2:A5;G1;B2:B5;G2)\n4) En G4 tape : =NB.SI.ENS(C2:C5;\">100\";A2:A5;G1)","check":"G3 affiche 200 (120+80) et G4 affiche 2 (les Repas > 100 : 120 et 150)."}, title: "Mini tableau de bord des dépenses", level: 3,

    hints: [

      "Pour « > 100 » comparé à une constante, le critère s'écrit \">100\" entre guillemets."
    ],

  ]
};
</script>
