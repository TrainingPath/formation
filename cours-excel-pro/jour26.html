<script>
var DAY = {
  num: 26,
  title: "Déboguer, sécuriser et distribuer ses macros",
  subtitle: "Trouver l'erreur, protéger le code, et livrer un classeur que les autres pourront ouvrir sans risque.",
  theory: `
<h3>1. Débogage : comprendre au lieu de deviner</h3>
<p><strong>Déboguer</strong>, c'est chercher méthodiquement pourquoi un code ne fait pas ce qu'on attend. VBA offre pour cela un petit atelier complet dans l'éditeur (<strong>Alt+F11</strong>). Le réflexe de débutant est de relancer la macro en espérant ; le réflexe de pro est de la <em>ralentir</em> pour l'observer.</p>
<h3>2. Le pas à pas (F8)</h3>
<p>Le <strong>pas à pas détaillé</strong> exécute le code <em>une instruction à la fois</em>. On appuie sur <strong>F8</strong> : la ligne surlignée en jaune est celle qui va s'exécuter au prochain appui. Menu : <strong>Débogage ▸ Pas à pas détaillé</strong>.</p>
<pre class="pseudo">F8         ' Pas a pas detaille : entre dans les procedures appelees
Maj+F8     ' Pas a pas principal : execute l'appel d'un coup, sans y entrer
Ctrl+Maj+F8 ' Pas a pas sortant : termine la procedure courante et revient
F5         ' Continuer : reprend l'execution normale jusqu'au bout</pre>
<h3>3. Le point d'arrêt (F9)</h3>
<p>Un <strong>point d'arrêt</strong> (breakpoint) est un marqueur posé sur une ligne : l'exécution s'arrête <em>juste avant</em> de l'exécuter. On le pose en cliquant dans la marge grise à gauche de la ligne, ou avec <strong>F9</strong> ; un gros point rouge apparaît. Utile quand le bug est à la ligne 300 : on lance normalement, et le code s'arrête pile où on veut.</p>
<div class="tip"><strong>Ctrl+Maj+F9</strong> supprime tous les points d'arrêt d'un coup. Les points d'arrêt ne sont pas enregistrés dans le fichier : ils disparaissent à la fermeture du classeur.</div>
<h3>4. Espions, variables locales et fenêtre Exécution</h3>
<p>Une fois le code arrêté, il faut <em>voir</em> le contenu des variables :</p>
<pre class="pseudo">' 1. Survoler une variable a la souris : une info-bulle affiche sa valeur
' 2. Affichage > Fenetre Variables locales : toutes les variables de la procedure
' 3. Affichage > Fenetre Espions (clic droit > Ajouter un espion) : suivre une
'    expression precise, ou arreter le code quand elle devient Vraie
' 4. Fenetre Execution (Ctrl+G) : taper une question au code, en direct
?  derniere            ' affiche la valeur de derniere
?  Cells(2, 1).Value   ' affiche le contenu de A2
Debug.Print i, montant ' depuis le code : trace des valeurs dans la fenetre Execution</pre>
<p><code>Debug.Print</code> écrit dans la fenêtre Exécution sans interrompre la macro : c'est le « journal de bord » du code, bien plus pratique qu'une avalanche de MsgBox.</p>
<h3>5. Option Explicit : le garde-fou n°1</h3>
<p>Écrire <strong>Option Explicit</strong> tout en haut de chaque module oblige à déclarer toute variable avec <code>Dim</code>. Sans lui, une faute de frappe (<code>montnat</code> au lieu de <code>montant</code>) crée silencieusement une variable vide et le résultat est faux sans message d'erreur. Pour l'ajouter automatiquement partout : <strong>Outils ▸ Options ▸ Déclaration explicite des variables</strong>.</p>
<h3>6. Gérer les erreurs d'exécution</h3>
<p>Une <strong>erreur d'exécution</strong> interrompt la macro avec une boîte « Erreur 1004 » et le bouton Débogage. Chez l'utilisateur final, c'est inacceptable. On l'intercepte :</p>
<pre class="pseudo">Sub Traiter()
    On Error GoTo Gestion          ' en cas d'erreur, sauter a l'etiquette Gestion
    Application.ScreenUpdating = False

    ' ... traitement qui peut echouer ...

Sortie:                            ' etiquette de sortie propre
    Application.ScreenUpdating = True   ' on remet toujours l'ecran
    Exit Sub                       ' IMPORTANT : sinon on tombe dans Gestion

Gestion:                           ' etiquette de gestion d'erreur
    MsgBox "Erreur " &amp; Err.Number &amp; " : " &amp; Err.Description, vbCritical
    Resume Sortie                  ' repart au nettoyage puis sort
End Sub</pre>
<pre class="pseudo">On Error Resume Next   ' ignore l'erreur et passe a la ligne suivante
On Error GoTo 0        ' desactive la gestion d'erreur (retour au comportement normal)</pre>
<div class="warn"><strong>On Error Resume Next</strong> est un piège : il masque TOUTES les erreurs, y compris celles que tu n'avais pas prévues. Réserve-le à une ou deux lignes précises (ex. supprimer une feuille qui n'existe peut-être pas) et referme aussitôt avec <code>On Error GoTo 0</code>.</div>
<h3>7. Sécurité des macros : un vrai vecteur d'attaque</h3>
<p>Une macro est du <em>code exécutable</em>. Elle peut lire tes fichiers, en télécharger d'autres, chiffrer ton disque. Les macros Office restent l'un des vecteurs d'infection les plus utilisés au monde, via des pièces jointes « facture.xlsm » ou « CV.xlsm ».</p>
<div class="warn"><strong>Règle absolue : n'active JAMAIS les macros d'un fichier dont tu ne connais pas l'origine</strong>, même si le document affiche « ce document a été créé dans une version antérieure, activez les macros pour le voir ». Ce message est précisément l'appât classique. En cas de doute : ne pas cliquer sur « Activer le contenu », fermer le fichier.</div>
<p>Les réglages sont dans <strong>Fichier ▸ Options ▸ Centre de gestion de la confidentialité ▸ Paramètres du Centre de gestion de la confidentialité ▸ Paramètres des macros</strong> :</p>
<pre class="pseudo">Desactiver toutes les macros sans notification      ' le plus sur, mais tes propres macros ne tournent pas
Desactiver toutes les macros avec notification      ' RECOMMANDE (reglage par defaut) : barre d'avertissement
Desactiver toutes sauf les macros signees numeriquement  ' seules les macros signees s'executent
Activer toutes les macros                           ' A NE JAMAIS UTILISER</pre>
<p>Depuis Microsoft 365, les fichiers contenant des macros <strong>téléchargés depuis Internet ou reçus par mail</strong> sont bloqués par défaut : Excel affiche un bandeau rouge « Microsoft a bloqué l'exécution des macros… ». Ce blocage vient de la <strong>Marque du Web</strong> (Mark of the Web), un marqueur posé par Windows sur les fichiers venus de l'extérieur. Il ne se retire que via <strong>clic droit sur le fichier ▸ Propriétés ▸ cocher Débloquer</strong> — à ne faire que si tu es certain de la source.</p>
<h3>8. Emplacements approuvés et signature numérique</h3>
<p>Un <strong>emplacement approuvé</strong> est un dossier déclaré de confiance : les classeurs qui s'y trouvent ouvrent leurs macros sans avertissement. On le définit dans le <strong>Centre de gestion de la confidentialité ▸ Emplacements approuvés ▸ Ajouter un nouvel emplacement</strong>. Ne jamais approuver un dossier de téléchargements ou un dossier partagé ouvert à tous.</p>
<p>Une <strong>macro signée</strong> porte une <strong>signature numérique</strong> : un certificat qui garantit deux choses — l'identité de l'auteur, et le fait que le code n'a pas été modifié depuis la signature. Dans l'éditeur VBA : <strong>Outils ▸ Signature électronique ▸ Choisir</strong>. Pour s'entraîner, l'outil <strong>SelfCert.exe</strong> livré avec Office crée un certificat auto-signé, valable uniquement sur ta machine ; pour une diffusion réelle en entreprise, il faut un certificat émis par une autorité de certification.</p>
<div class="tip">Modifier une seule ligne de code <strong>invalide</strong> la signature : il faut resigner. C'est justement le but — la signature prouve que le code livré est bien celui qui a été validé.</div>
<h3>9. Protéger et distribuer son projet</h3>
<p>Pour empêcher la lecture du code : dans l'éditeur, <strong>Outils ▸ Propriétés de VBAProject ▸ onglet Protection ▸ Verrouiller le projet pour l'affichage</strong> + mot de passe. Attention : cette protection est faible et se contourne — elle décourage le curieux, elle ne protège pas un secret industriel.</p>
<pre class="pseudo">' Formats de distribution
.xlsm   ' classeur avec macros : le format standard a livrer
.xlsb   ' binaire : plus compact et rapide, accepte aussi les macros
.xlam   ' complement (add-in) Excel : macros disponibles dans TOUS les classeurs
.xltm   ' modele avec macros : sert de moule pour creer de nouveaux fichiers</pre>
<p>Le <strong>.xlam</strong> (complément) est la forme la plus élégante pour distribuer des outils : l'utilisateur l'installe une fois par <strong>Fichier ▸ Options ▸ Compléments ▸ Atteindre ▸ Parcourir</strong>, et les macros deviennent disponibles partout.</p>
<div class="tip">Avant de livrer : retirer les points d'arrêt, activer <code>Option Explicit</code>, compiler avec <strong>Débogage ▸ Compiler VBAProject</strong> (détecte les fautes de syntaxe sans exécuter), ajouter une gestion d'erreur sur les procédures publiques, et tester sur une <em>copie</em> des données réelles.</div>`,
  exercises: [
    { type: "input", q: "Quelle touche exécute le code une instruction à la fois (pas à pas détaillé) ?", a: ["F8", "f8", "Touche F8"], ph: "F…", exp: "F8 lance le pas à pas détaillé ; la ligne jaune est la prochaine à s'exécuter." },
    { type: "input", q: "Quelle touche pose ou retire un point d'arrêt sur la ligne courante ?", a: ["F9", "f9", "Touche F9"], ph: "F…", exp: "F9 (ou un clic dans la marge grise) pose le point rouge." },
    { type: "qcm", q: "Un point d'arrêt sert à…", opts: ["Supprimer une ligne de code", "Stopper l'exécution juste avant la ligne marquée", "Accélérer la macro", "Protéger le projet"], a: 1, exp: "L'exécution s'interrompt avant la ligne pour qu'on inspecte les variables." },
    { type: "input", q: "Quelle instruction en haut d'un module oblige à déclarer toutes les variables ?", a: ["Option Explicit", "option explicit"], ph: "Option …", exp: "Option Explicit transforme les fautes de frappe en erreurs de compilation." },
    { type: "qcm", q: "Quel raccourci ouvre la fenêtre Exécution de l'éditeur VBA ?", opts: ["Ctrl+G", "Ctrl+E", "Alt+F8", "Ctrl+P"], a: 0, exp: "Ctrl+G ouvre la fenêtre Exécution, où l'on tape ?variable pour voir une valeur." },
    { type: "input", q: "Quelle instruction affiche une valeur dans la fenêtre Exécution sans interrompre la macro ?", a: ["Debug.Print", "debug.print", "Debug.Print "], ph: "Debug…", exp: "Debug.Print sert de journal de bord pendant l'exécution." },
    { type: "qcm", q: "On Error GoTo Gestion signifie…", opts: ["Ignorer toutes les erreurs", "Sauter à l'étiquette Gestion en cas d'erreur", "Arrêter Excel", "Compiler le projet"], a: 1, exp: "Le code est dérouté vers l'étiquette de gestion d'erreur." },
    { type: "vf", q: "On Error Resume Next est dangereux car il masque toutes les erreurs, y compris imprévues.", a: true, exp: "À réserver à une ou deux lignes précises, refermées par On Error GoTo 0." },
    { type: "input", q: "Quelle propriété de l'objet Err donne le numéro de l'erreur survenue ?", a: ["Err.Number", "err.number", "Number"], ph: "Err…", exp: "Err.Number donne le code, Err.Description le message." },
    { type: "qcm", q: "Quel paramètre de macro est recommandé par défaut ?", opts: ["Activer toutes les macros", "Désactiver toutes les macros avec notification", "Désactiver toutes les macros sans notification", "Aucun réglage"], a: 1, exp: "Avec notification : rien ne s'exécute, mais tu peux activer en connaissance de cause." },
    { type: "vf", q: "Il est prudent d'activer les macros d'un classeur reçu par mail d'un expéditeur inconnu si le document affiche « activez les macros pour voir le contenu ».", a: false, exp: "C'est exactement l'appât des campagnes malveillantes : ne jamais activer une macro d'origine inconnue." },
    { type: "input", q: "Quel chemin du menu Fichier mène aux paramètres de sécurité des macros (3 mots après Options) ?", a: ["Centre de gestion de la confidentialité", "centre de gestion de la confidentialité", "Fichier ▸ Options ▸ Centre de gestion de la confidentialité"], ph: "Fichier ▸ Options ▸ …", exp: "Fichier ▸ Options ▸ Centre de gestion de la confidentialité ▸ Paramètres des macros." },
    { type: "qcm", q: "Une macro signée numériquement garantit…", opts: ["Que la macro est rapide", "L'identité de l'auteur et l'intégrité du code", "Que la macro n'a pas de bug", "Que le fichier est en .xlsx"], a: 1, exp: "La signature prouve qui a écrit le code et qu'il n'a pas été modifié depuis." },
    { type: "input", q: "Quelle extension de fichier correspond à un complément Excel contenant des macros ?", a: [".xlam", "xlam", "Xlam", ".XLAM"], ph: ".xl…", exp: "Le .xlam s'installe une fois et rend les macros disponibles dans tous les classeurs." },
    { type: "vf", q: "Modifier une ligne de code après avoir signé le projet invalide la signature numérique.", a: true, exp: "C'est le principe même de la signature : toute modification la rompt, il faut resigner." }
  ],
  final: {
    title: "Exercice final — Fiabiliser une macro avant livraison",
    intro: `<p>Un collègue te donne cette macro qui plante chez la moitié des utilisateurs :</p>
<pre class="pseudo">Sub Nettoyer()
    Application.ScreenUpdating = False
    Sheets("Temp").Delete             ' plante si la feuille Temp n'existe pas
    total = Range("B2").Value / Range("C2").Value   ' plante si C2 vaut 0
    Range("D2").Value = total
    Application.ScreenUpdating = True
End Sub</pre>
<p>Tu dois la rendre robuste : déclarations obligatoires, gestion d'erreur, écran toujours restauré, et un classeur livrable.</p>`,
    questions: [
      { type: "input", q: "Quelle ligne ajouter tout en haut du module pour forcer la déclaration des variables ?", a: ["Option Explicit", "option explicit"], ph: "Option …", exp: "Option Explicit oblige à déclarer total avec Dim et supprime les fautes de frappe silencieuses." },
      { type: "input", q: "Écris la première ligne de la procédure qui déroute vers l'étiquette Gestion en cas d'erreur.", a: ["On Error GoTo Gestion", "on error goto gestion", "On Error Goto Gestion"], ph: "On Error …", exp: "On Error GoTo Gestion installe le filet de sécurité dès l'entrée dans la procédure." },
      { type: "input", q: "Quelle instruction placer avant l'étiquette Gestion pour ne pas y tomber en exécution normale ?", a: ["Exit Sub", "exit sub"], ph: "Exit …", exp: "Sans Exit Sub, le code continue et exécute le bloc d'erreur même quand tout va bien." },
      { type: "qcm", q: "Pour supprimer la feuille Temp sans planter ni afficher de confirmation, il faut…", opts: ["Ne rien faire", "Encadrer par Application.DisplayAlerts = False et On Error Resume Next / On Error GoTo 0", "Utiliser Debug.Print", "Signer la macro"], a: 1, exp: "DisplayAlerts évite la question de confirmation ; le On Error local encaisse l'absence de la feuille." },
      { type: "qcm", q: "Sous quel format faut-il enregistrer le classeur pour le livrer avec sa macro ?", opts: [".xlsx", ".csv", ".xlsm", ".txt"], a: 2, exp: "Le .xlsm est le format standard d'un classeur prenant en charge les macros." }
    ],
    solution: `<p>Version fiabilisée, prête à livrer :</p>
<pre class="pseudo">Option Explicit                      ' toute variable devra etre declaree

Sub Nettoyer()
    Dim total As Double              ' declaration explicite du resultat
    Dim diviseur As Double

    On Error GoTo Gestion            ' filet de securite pour toute la procedure
    Application.ScreenUpdating = False

    ' --- suppression toleree de la feuille Temp ---
    Application.DisplayAlerts = False    ' pas de demande de confirmation
    On Error Resume Next                 ' on tolere l'absence de la feuille...
    Sheets("Temp").Delete
    On Error GoTo Gestion                ' ...et on referme aussitot le parachute
    Application.DisplayAlerts = True

    ' --- calcul protege ---
    diviseur = Range("C2").Value
    If diviseur = 0 Then                 ' on teste AVANT de diviser
        MsgBox "C2 vaut 0 : division impossible.", vbExclamation
        GoTo Sortie                      ' sortie propre, sans erreur
    End If
    total = Range("B2").Value / diviseur
    Range("D2").Value = total
    Debug.Print "Total calcule : "; total    ' trace dans la fenetre Execution

Sortie:                                  ' point de sortie unique et propre
    Application.DisplayAlerts = True      ' on restaure TOUJOURS l'environnement
    Application.ScreenUpdating = True
    Exit Sub                             ' indispensable : sinon on tombe dans Gestion

Gestion:                                 ' bloc de gestion d'erreur
    MsgBox "Erreur " &amp; Err.Number &amp; " : " &amp; Err.Description, vbCritical
    Resume Sortie                        ' repart au nettoyage puis sort
End Sub</pre>
<p><strong>Check-list avant livraison :</strong> compiler (<strong>Débogage ▸ Compiler VBAProject</strong>), retirer les points d'arrêt (<strong>Ctrl+Maj+F9</strong>), enregistrer en <strong>.xlsm</strong>, signer le projet (<strong>Outils ▸ Signature électronique</strong>) et indiquer aux utilisateurs de placer le fichier dans un <strong>emplacement approuvé</strong> plutôt que de baisser le niveau de sécurité global d'Excel.</p>`
  }
};
</script>

<script>

    statement: "Écris une macro <strong>ImporterCA</strong> qui ouvre le classeur <em>C:\\Data\\ventes.xlsx</em>, copie la valeur de sa cellule B2 dans la cellule A1 de la feuille active du classeur courant, puis referme le fichier source sans enregistrer. Le fichier peut être absent, verrouillé ou déplacé : la macro ne doit JAMAIS afficher la fenêtre jaune « Erreur d'exécution » mais un message clair, et doit toujours restaurer ScreenUpdating et DisplayAlerts.",
    hints: [
      "Structure en quatre blocs : On Error GoTo Gestion en tête, le traitement, une étiquette Sortie: avec Exit Sub, puis l'étiquette Gestion:.",
      "Teste l'existence du fichier avant de l'ouvrir : If Dir(chemin) = \"\" Then … Dir renvoie une chaîne vide si le fichier n'existe pas.",

    solution: "Option Explicit                          ' declaration obligatoire des variables\n\nSub ImporterCA()\n    Dim wbSource As Workbook                 ' le classeur que l'on va ouvrir\n    Dim chemin As String                     ' chemin complet du fichier source\n    Dim valeur As Variant                    ' valeur recuperee en B2\n\n    chemin = \"C:\\Data\\ventes.xlsx\"\n    On Error GoTo Gestion                    ' filet de securite des le depart\n    Application.ScreenUpdating = False       ' fige l'ecran : plus rapide\n    Application.DisplayAlerts = False        ' pas de boite de confirmation\n\n    If Dir(chemin) = \"\" Then                 ' Dir renvoie \"\" si le fichier est absent\n        MsgBox \"Fichier introuvable : \" & chemin, vbExclamation\n        GoTo Sortie                          ' sortie propre, sans erreur d'execution\n    End If\n\n    Set wbSource = Workbooks.Open(chemin, ReadOnly:=True)  ' ouverture en lecture seule\n    valeur = wbSource.Worksheets(1).Range(\"B2\").Value      ' lit B2 de la 1re feuille\n    wbSource.Close SaveChanges:=False        ' referme sans enregistrer\n    Set wbSource = Nothing                   ' libere la reference\n\n    ActiveSheet.Range(\"A1\").Value = valeur    ' colle la valeur dans le classeur courant\n    Debug.Print \"Import OK : \"; valeur        ' trace dans la fenetre Execution (Ctrl+G)\n\nSortie:                                      ' point de sortie unique\n    Application.DisplayAlerts = True          ' on restaure TOUJOURS l'environnement\n    Application.ScreenUpdating = True\n    Exit Sub                                 ' sans ceci, on tomberait dans Gestion\n\nGestion:                                     ' bloc de gestion d'erreur\n    If Not wbSource Is Nothing Then          ' le fichier est-il reste ouvert ?\n        wbSource.Close SaveChanges:=False    ' on le referme pour ne rien laisser trainer\n    End If\n    MsgBox \"Import impossible.\" & vbCrLf & _\n           \"Erreur \" & Err.Number & \" : \" & Err.Description, vbCritical\n    Resume Sortie                            ' repart au nettoyage puis sort\nEnd Sub\n\nResultat attendu :\n   Fichier present   -> A1 recoit la valeur de B2, message dans la fenetre Execution\n   Fichier absent    -> \"Fichier introuvable : C:\\Data\\ventes.xlsx\" et rien ne plante\n   Fichier verrouille -> message \"Erreur 1004 : ...\" propre, ecran restaure",
    note: "Le patron On Error GoTo / Sortie: / Exit Sub / Gestion: / Resume Sortie garantit qu'aucun chemin d'execution ne laisse ScreenUpdating a False. Teste toujours l'existence du fichier avec Dir plutot que de compter sur la gestion d'erreur seule." }
