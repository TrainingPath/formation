<script>
var DAY = {
  num: 28,
  title: "Visualisations et tableaux de bord Power BI",
  subtitle: "Transformer un modèle de données en un rapport que l'on comprend en cinq secondes.",
  theory: `
<h3>1. Le vocabulaire à poser d'abord</h3>
<p>Quatre mots reviennent sans cesse, et on les confond souvent :</p>
<pre class="pseudo">Visuel     ' UN element graphique : un histogramme, une carte, un tableau
Page       ' un onglet du rapport, contenant plusieurs visuels
Rapport    ' l'ensemble des pages, construit dans Power BI Desktop (.pbix)
Tableau de bord (dashboard)  ' une page unique creee EN LIGNE (service Power BI),
           ' faite de vignettes epinglees depuis un ou plusieurs rapports</pre>
<div class="tip">Dans Power BI Desktop tu crées des <strong>rapports</strong>, pas des tableaux de bord : le tableau de bord n'existe que dans le service en ligne. Dans le langage courant on dit « tableau de bord » pour toute page de synthèse — sache simplement que Microsoft distingue les deux.</div>
<h3>2. Les trois volets de la Vue Rapport</h3>
<p>À droite de la zone de dessin, trois volets travaillent ensemble :</p>
<pre class="pseudo">Volet Donnees        ' la liste des tables et de leurs champs (a cocher ou glisser)
Volet Visualisations ' la galerie d'icones de visuels + les puits de champs
Volet Filtres        ' filtres sur un visuel, sur une page, ou sur tout le rapport</pre>
<p>Un <strong>puits de champs</strong> (field well) est un emplacement du volet Visualisations dans lequel on dépose un champ : <em>Axe X</em>, <em>Axe Y</em>, <em>Légende</em>, <em>Valeurs</em>, <em>Info-bulles</em>. Créer un visuel se résume donc à : cliquer sur une icône, puis glisser les bons champs dans les bons puits.</p>
<h3>3. Choisir le bon visuel</h3>
<p>Le choix n'est pas décoratif : chaque visuel répond à une question différente.</p>
<pre class="pseudo">Question posee                     Visuel adapte
Comparer des categories            Histogramme groupe / Barres groupees
Suivre une evolution dans le temps Courbe (graphique en courbes)
Montrer une composition            Barres empilees (mieux que le camembert)
Afficher UN chiffre cle            Carte (Card)
Chiffre + evolution + objectif     Carte multiligne, Jauge, KPI
Croiser deux mesures               Nuage de points
Detail ligne par ligne             Table ou Matrice
Repartition geographique           Carte (Map) ou Carte choroplethe
Poids relatif de sous-ensembles    Treemap</pre>
<div class="warn">Le <strong>camembert</strong> (secteurs) est le visuel le plus mal utilisé. L'œil humain compare mal des angles : au-delà de 4 ou 5 parts, il devient illisible. Un histogramme trié fait presque toujours mieux le travail.</div>
<h3>4. Table et matrice</h3>
<p>La <strong>table</strong> affiche des lignes de détail, comme une plage Excel. La <strong>matrice</strong> est l'équivalent du tableau croisé dynamique : lignes, colonnes et valeurs croisées, avec possibilité de <strong>descendre dans la hiérarchie</strong> (drill down) : Année ▸ Trimestre ▸ Mois. Les flèches de forage apparaissent en haut à droite du visuel.</p>
<h3>5. Filtrer : segments, filtres, interactions</h3>
<p>Un <strong>segment</strong> (slicer) est un filtre visible et cliquable posé sur la page : liste, cases à cocher, curseur numérique, plage de dates. C'est l'équivalent exact du segment d'Excel.</p>
<p>Le <strong>volet Filtres</strong> propose trois portées :</p>
<pre class="pseudo">Filtres sur ce visuel   ' n'affecte qu'un seul visuel
Filtres sur cette page  ' affecte tous les visuels de la page
Filtres sur toutes les pages ' affecte le rapport entier</pre>
<p>Enfin, les visuels se filtrent entre eux : cliquer sur une barre filtre les autres visuels. Ce comportement se règle par <strong>Format ▸ Modifier les interactions</strong>, qui propose trois modes par visuel cible :</p>
<pre class="pseudo">Filtrer      ' le visuel cible ne montre plus que la selection
Mettre en surbrillance  ' la selection est surlignee, le reste reste visible en pale
Aucun        ' le visuel cible ignore la selection</pre>
<h3>6. Mise en forme d'un visuel</h3>
<p>Le volet Visualisations comporte deux onglets : <strong>Générer le visuel</strong> (les champs) et <strong>Mettre en forme le visuel</strong> (le pinceau). On y règle le titre, les étiquettes de données, les axes, la légende, la bordure, l'arrière-plan.</p>
<pre class="pseudo">Reglages qui changent tout
Titre           ' formuler une PHRASE : "CA mensuel 2026" plutot que "Somme de Montant"
Etiquettes de donnees  ' afficher les valeurs directement sur les barres
Axe Y           ' commencer a zero (sinon les ecarts sont visuellement mensongers)
Tri             ' menu ... du visuel > Trier l'axe > par valeur decroissante
Info-bulles     ' champs supplementaires affiches au survol</pre>
<h3>7. Mise en forme conditionnelle et petits multiples</h3>
<p>Dans <strong>Mettre en forme le visuel</strong>, la plupart des couleurs portent une icône <em>fx</em> : elle ouvre la <strong>mise en forme conditionnelle</strong> (couleur selon la valeur, échelle de dégradé, règles, barres de données dans une table). Le champ <strong>Petits multiples</strong> découpe un visuel en une grille de mini-graphiques, un par catégorie : idéal pour comparer 8 régions d'un coup d'œil.</p>
<h3>8. Signets, info-bulles de page et forage</h3>
<pre class="pseudo">Signet (bookmark)   ' Affichage > Signets : memorise l'etat complet d'une page
                    ' (filtres, selections, visuels visibles) pour y revenir d'un clic
Bouton              ' Insertion > Boutons : declenche un signet, un lien, un forage
Info-bulle de page  ' une page entiere servant d'info-bulle au survol d'un visuel
Extraction (drillthrough)  ' clic droit sur une valeur > Extraire : ouvre une page
                    ' de detail filtree sur l'element clique</pre>
<h3>9. Concevoir la page : les règles qui comptent</h3>
<pre class="pseudo">1. Une page = une question. Si tu hesites, cree une deuxieme page.
2. Le regard va en haut a gauche : y placer les indicateurs cles (cartes KPI).
3. Milieu : les graphiques d'analyse. Bas : les tables de detail.
4. Segments regroupes au meme endroit (bandeau haut ou colonne gauche).
5. Maximum 6 a 8 visuels par page : au-dela, plus personne ne lit.
6. Une palette de 3 couleurs suffit. La couleur doit SIGNIFIER quelque chose.
7. Aligner les visuels : Format > Aligner, et activer le quadrillage.</pre>
<div class="tip">Test de validation : montre ta page à quelqu'un qui ne connaît pas le sujet. S'il ne peut pas dire en cinq secondes « ça va bien » ou « ça va mal », la page est à revoir.</div>
<h3>10. Accessibilité et thèmes</h3>
<p>Un <strong>thème</strong> (<strong>Affichage ▸ Thèmes</strong>) applique une palette et une typographie cohérentes à tout le rapport, et s'importe au format JSON pour respecter une charte graphique. Côté accessibilité : ne jamais coder une information par la seule couleur (ajouter une étiquette ou une forme), vérifier le contraste, et renseigner le <strong>texte de remplacement</strong> de chaque visuel dans les options de mise en forme.</p>`,
  exercises: [
    { type: "input", q: "Comment appelle-t-on un élément graphique unique posé sur une page de rapport ?", a: ["visuel", "un visuel", "Visuel", "visual"], ph: "un mot", exp: "Un visuel = un graphique, une carte, une table. Plusieurs visuels forment une page." },
    { type: "qcm", q: "Quel visuel convient le mieux pour suivre une évolution dans le temps ?", opts: ["Le camembert", "La courbe", "Le treemap", "La carte KPI"], a: 1, exp: "Le graphique en courbes montre la tendance d'une mesure au fil du temps." },
    { type: "qcm", q: "Quel visuel afficher pour UN seul chiffre clé bien lisible ?", opts: ["La matrice", "Le nuage de points", "La carte (Card)", "Le segment"], a: 2, exp: "La carte affiche une valeur unique en grand : idéal pour un KPI." },
    { type: "input", q: "Comment s'appelle le filtre visible et cliquable que l'on pose directement sur une page ?", a: ["segment", "un segment", "Segment", "slicer"], ph: "s…", exp: "Le segment (slicer) est l'équivalent Power BI du segment d'Excel." },
    { type: "qcm", q: "Quel visuel est l'équivalent du tableau croisé dynamique d'Excel ?", opts: ["La table", "La matrice", "La jauge", "Le treemap"], a: 1, exp: "La matrice croise lignes et colonnes avec des valeurs, et permet le forage." },
    { type: "vf", q: "Dans Power BI Desktop, on crée des rapports ; les tableaux de bord (dashboards) se créent dans le service en ligne.", a: true, exp: "Le dashboard est une page de vignettes épinglées, propre au service Power BI." },
    { type: "input", q: "Quelle commande du ruban Format permet de choisir si un visuel filtre ou surligne les autres ?", a: ["Modifier les interactions", "modifier les interactions", "Format ▸ Modifier les interactions"], ph: "Modifier …", exp: "Format ▸ Modifier les interactions propose Filtrer, Mettre en surbrillance ou Aucun." },
    { type: "qcm", q: "Combien de portées propose le volet Filtres ?", opts: ["Une seule", "Deux", "Trois : visuel, page, toutes les pages", "Cinq"], a: 2, exp: "Filtres sur ce visuel, sur cette page, sur toutes les pages." },
    { type: "input", q: "Comment appelle-t-on la fonctionnalité qui mémorise l'état complet d'une page pour y revenir d'un clic ?", a: ["signet", "un signet", "Signet", "bookmark"], ph: "s…", exp: "Affichage ▸ Signets mémorise filtres, sélections et visibilité des visuels." },
    { type: "vf", q: "Le camembert est le meilleur visuel pour comparer une dizaine de catégories.", a: false, exp: "L'œil compare mal les angles ; au-delà de 4-5 parts, préférer un histogramme trié." },
    { type: "qcm", q: "Le champ Petits multiples sert à…", opts: ["Réduire la taille du texte", "Découper un visuel en une grille de mini-graphiques, un par catégorie", "Ajouter une info-bulle", "Créer un signet"], a: 1, exp: "Les petits multiples permettent de comparer plusieurs catégories d'un seul coup d'œil." },
    { type: "input", q: "Quelle action (clic droit sur une valeur) ouvre une page de détail filtrée sur l'élément cliqué ?", a: ["Extraire", "extraire", "extraction", "drillthrough", "Extraction"], ph: "Extr…", exp: "L'extraction (drillthrough) mène à une page de détail filtrée automatiquement." },
    { type: "qcm", q: "Quel réglage évite qu'un graphique exagère visuellement les écarts ?", opts: ["Masquer la légende", "Faire commencer l'axe Y à zéro", "Ajouter un signet", "Changer de police"], a: 1, exp: "Un axe tronqué transforme un écart de 2 % en falaise visuelle." },
    { type: "input", q: "Quel menu du ruban applique une palette et une typographie cohérentes à tout le rapport ?", a: ["Affichage ▸ Thèmes", "Thèmes", "themes", "Affichage > Thèmes", "thèmes"], ph: "Affichage ▸ …", exp: "Affichage ▸ Thèmes ; un thème personnalisé s'importe au format JSON." },
    { type: "vf", q: "Il est déconseillé de coder une information uniquement par la couleur.", a: true, exp: "Accessibilité : ajouter une étiquette, une forme ou un libellé en complément de la couleur." }
  ],
  final: {
    title: "Exercice final — Une page de synthèse commerciale",
    intro: `<p>Ton modèle du jour 27 (Ventes, Clients, Produits, Calendrier) est chargé. On te demande une page unique répondant à la question : <em>« Où en est notre chiffre d'affaires cette année, et qui le porte ? »</em></p>
<pre class="pseudo">Attendu sur la page
   - 3 indicateurs cles en haut : CA total, Nombre de commandes, Panier moyen
   - l'evolution mensuelle du CA
   - le classement des 10 meilleurs clients
   - la repartition par categorie de produit
   - des segments Annee et Ville</pre>`,
    questions: [
      { type: "qcm", q: "Quel visuel utiliser pour les trois indicateurs clés du haut de page ?", opts: ["Trois matrices", "Trois cartes (Card)", "Un camembert", "Un nuage de points"], a: 1, exp: "La carte affiche une valeur unique en grand, parfaite pour un KPI." },
      { type: "input", q: "Quel visuel choisir pour l'évolution mensuelle du CA ?", a: ["courbe", "graphique en courbes", "une courbe", "Courbe", "graphique en ligne"], ph: "un visuel", exp: "La courbe met en évidence la tendance sur l'axe du temps." },
      { type: "input", q: "Pour ne garder que les 10 meilleurs clients, quel type de filtre appliquer dans le volet Filtres ?", a: ["N premiers", "Top N", "top n", "filtre N premiers", "N supérieurs"], ph: "N …", exp: "Le filtre N premiers (Top N) garde les 10 clients selon la mesure CA." },
      { type: "qcm", q: "Où placer les segments Année et Ville pour une page lisible ?", opts: ["Éparpillés entre les graphiques", "Regroupés dans un bandeau haut ou une colonne gauche", "En bas à droite, isolés", "Sur une autre page"], a: 1, exp: "Regrouper les segments au même endroit rend leur usage évident." },
      { type: "input", q: "Quelle commande du menu ... d'un visuel permet de classer les barres de la plus grande à la plus petite ?", a: ["Trier l'axe", "trier l'axe", "Trier par", "Trier l'axe par valeur décroissante"], ph: "Trier …", exp: "Menu ... ▸ Trier l'axe ▸ choisir la mesure ▸ Tri décroissant." }
    ],
    solution: `<p><strong>Construction pas à pas de la page.</strong></p>
<pre class="pseudo">1. BANDEAU HAUT : les segments
   Volet Visualisations > icone Segment
   Champ Calendrier[Annee]   -> style Liste horizontale
   Second segment : Clients[Ville] -> style Liste deroulante
   Les placer cote a cote en haut de page

2. LIGNE DES KPI : trois cartes
   Visuel Carte + champ [CA Total]              -> titre "CA total 2026"
   Visuel Carte + champ [Nb Commandes]          -> titre "Commandes"
   Visuel Carte + champ [Panier Moyen]          -> titre "Panier moyen"
   Mise en forme > Valeur : 0 decimale, separateur de milliers

3. EVOLUTION : graphique en courbes
   Axe X      : Calendrier[NomMois]  (trie par Calendrier[Mois])
   Axe Y      : [CA Total]
   Titre      : "Evolution mensuelle du CA"
   Mise en forme > Axe Y > demarrer a zero ; activer les etiquettes de donnees

4. CLASSEMENT : barres groupees horizontales
   Axe Y      : Clients[NomClient]
   Axe X      : [CA Total]
   Volet Filtres > Filtre sur ce visuel > Type : N premiers
                 > Afficher les elements : Haut 10 > Par valeur : [CA Total] > Appliquer
   Menu ... > Trier l'axe > [CA Total] > Tri decroissant

5. REPARTITION : barres empilees (et non un camembert)
   Axe X : Produits[Categorie]   Axe Y : [CA Total]
   Mise en forme conditionnelle (icone fx) sur la couleur, en degrade selon la valeur

6. FINITIONS
   Format > Modifier les interactions : le classement des clients
      met en SURBRILLANCE la courbe au lieu de la filtrer
   Affichage > Themes : appliquer une palette de 3 couleurs
   Chaque visuel : renseigner le Texte de remplacement (accessibilite)
   Insertion > Zone de texte : titre de page "Synthese commerciale 2026"</pre>
<p><strong>Pour aller plus loin :</strong> crée une page <em>Détail client</em> et déclare <strong>Clients[NomClient]</strong> dans le puits <strong>Extraction</strong>. Un clic droit sur un client du classement ▸ <strong>Extraire</strong> ouvrira alors une page de détail entièrement filtrée sur lui. Ajoute un <strong>signet</strong> « Vue par défaut » et un bouton pour réinitialiser tous les filtres d'un clic : c'est ce genre de détail qui fait la différence entre un rapport correct et un rapport utilisé tous les jours.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "excelpro-j28", title: "Page de pilotage RH", level: 2,
    statement: "Modèle chargé dans Power BI Desktop : table de faits <em>Absences</em> (ID_Salarie ; Date_Debut ; Nb_Jours ; Motif), dimension <em>Salaries</em> (ID_Salarie ; Nom ; Service ; Site ; Date_Entree) et table <em>Calendrier</em>. Conçois une page de pilotage répondant à « quel service absorbe le plus d'absences, et depuis quand ? ». Décris précisément : les visuels choisis et pourquoi, les champs déposés dans chaque puits, les filtres et segments, le réglage des interactions, et deux finitions d'accessibilité.",

    solution: "// ============ STRUCTURE DE LA PAGE : une question, six visuels ============\n\n// --- 1. BANDEAU DE SEGMENTS (en haut, regroupes) ---\n// Segment 1 : champ Calendrier[Annee]      -> style Liste horizontale\n// Segment 2 : champ Salaries[Site]         -> style Liste deroulante\n// Segment 3 : champ Calendrier[Date]       -> style Entre (curseur de dates)\n// Regrouper les trois : l'utilisateur sait ou chercher ses filtres\n\n// --- 2. LIGNE DE KPI (haut gauche : le regard y va en premier) ---\n// Visuel Carte -> Champ : [Total Jours Absence]   titre \"Jours d'absence\"\n// Visuel Carte -> Champ : [Taux Absenteisme]      titre \"Taux d'absenteisme\"\n// Visuel Carte -> Champ : [Nb Salaries Concernes] titre \"Salaries concernes\"\n// Pourquoi la Carte : un seul chiffre, lisible a distance, sans decoration\n\n// --- 3. CLASSEMENT DES SERVICES (barres groupees horizontales) ---\n// Axe Y  : Salaries[Service]\n// Axe X  : [Total Jours Absence]\n// Menu ... > Trier l'axe > [Total Jours Absence] > decroissant\n// Pourquoi des barres horizontales : les noms de service sont longs et restent lisibles\n// Mise en forme (icone fx) : couleur en degrade selon la valeur\n\n// --- 4. EVOLUTION DANS LE TEMPS (graphique en courbes) ---\n// Axe X    : Calendrier[NomMois]  (trie par Calendrier[Mois])\n// Axe Y    : [Total Jours Absence]\n// Legende  : Salaries[Service]\n// Variante conseillee : vider la Legende et utiliser le puits Petits multiples\n//   avec Salaries[Service] -> une mini-courbe par service, comparaison immediate\n// Mise en forme > Axe Y > demarrer a zero (sinon les ecarts sont trompeurs)\n\n// --- 5. REPARTITION PAR MOTIF (barres empilees, PAS un camembert) ---\n// Axe X : Absences[Motif]   Axe Y : [Total Jours Absence]\n// Justification : au-dela de 4 parts, l'oeil compare mal les angles d'un secteur\n\n// --- 6. DETAIL (matrice, en bas de page) ---\n// Lignes   : Salaries[Service] puis Salaries[Nom]  -> hierarchie, forage possible\n// Colonnes : Cal };
