<script>
var DAY = {
  num: 4,
  title: "Les fonctions logiques avancées (SI.CONDITIONS, SI.MULTIPLE)",
  subtitle: "Remplacer les SI imbriqués illisibles par des fonctions claires, et combiner les conditions avec ET, OU, NON.",
  theory: `
<h3>1. Le problème des SI imbriqués</h3>
<p>Tu sais imbriquer des SI, mais au-delà de deux niveaux, ça devient illisible : <code>=SI(...;...;SI(...;...;SI(...)))</code>. On compte les parenthèses, on se perd. Excel propose des fonctions plus lisibles : <strong>SI.CONDITIONS</strong> et <strong>SI.MULTIPLE</strong>. <span class="tag">365</span> Elles existent depuis <strong>Excel 2019 et Microsoft 365</strong> (pas sur 2016).</p>

<h3>2. ET, OU, NON : combiner des conditions</h3>
<p>Ces fonctions renvoient VRAI ou FAUX et se glissent dans le test d'un SI.</p>
<pre class="pseudo">=ET(cond1 ; cond2 ; ...)   // VRAI seulement si TOUTES les conditions sont vraies
=OU(cond1 ; cond2 ; ...)   // VRAI si AU MOINS UNE condition est vraie
=NON(cond)                 // inverse : VRAI devient FAUX</pre>
<pre class="pseudo">=SI(ET(B2>=10 ; C2>=10) ; "Admis" ; "Recale")
   ET(B2>=10;C2>=10)   VRAI seulement si les DEUX notes sont >= 10
   // "Admis" uniquement si les deux moyennes passent</pre>
<pre class="pseudo">=SI(OU(B2="VIP" ; C2>1000) ; "Remise" ; "Standard")
   OU(...)   VRAI si le client est VIP OU s'il a commande > 1000</pre>

<h3>3. SI.CONDITIONS : tester plusieurs cas dans l'ordre</h3>
<p><strong>SI.CONDITIONS</strong> teste une série de conditions <em>de gauche à droite</em> et renvoie la valeur du <strong>premier</strong> test VRAI. Fini les SI imbriqués.</p>
<pre class="pseudo">=SI.CONDITIONS(test1 ; valeur1 ; test2 ; valeur2 ; ... ; VRAI ; valeur_par_defaut)
   test1 ; valeur1   si test1 est VRAI -> valeur1, et on s'arrete
   ...               sinon on passe au test suivant
   VRAI ; ...        VRAI est toujours vrai -> sert de "sinon" final</pre>
<pre class="pseudo">=SI.CONDITIONS(A2>=16;"Tres bien" ; A2>=14;"Bien" ; A2>=10;"Passable" ; VRAI;"Insuffisant")
   A2>=16 -> "Tres bien"        premier test vrai renvoye
   A2>=14 -> "Bien"            (sinon)
   A2>=10 -> "Passable"        (sinon)
   VRAI   -> "Insuffisant"     tous les autres cas (le "sinon" final)</pre>
<div class="warn">L'ORDRE compte : les conditions sont évaluées de gauche à droite. Mets les plus restrictives d'abord. Si aucun test n'est vrai et qu'il n'y a pas de « VRAI ; … » final, la fonction renvoie l'erreur <code>#N/A</code>.</div>

<h3>4. SI.MULTIPLE : comparer UNE valeur à une liste</h3>
<p><strong>SI.MULTIPLE</strong> (comme le « switch » d'autres langages) compare une <em>même</em> valeur à une liste de cas et renvoie le résultat associé. Plus simple que SI.CONDITIONS quand on teste l'égalité d'une seule cellule.</p>
<pre class="pseudo">=SI.MULTIPLE(valeur ; cas1;res1 ; cas2;res2 ; ... ; [defaut])
   valeur   la cellule a comparer
   cas1     si valeur = cas1 -> res1
   defaut   (facultatif) valeur si aucun cas ne correspond</pre>
<pre class="pseudo">=SI.MULTIPLE(B2 ; "L";"Lundi" ; "M";"Mardi" ; "J";"Jeudi" ; "Inconnu")
   B2 = "L" -> "Lundi"
   B2 = "M" -> "Mardi"
   "Inconnu"  valeur par defaut si B2 ne vaut aucun des cas</pre>
<div class="tip">SI.MULTIPLE ne teste que des ÉGALITÉS exactes (=). Pour des comparaisons (>=, <), il faut SI.CONDITIONS. Astuce : <code>SI.MULTIPLE(VRAI ; test1;res1 ; ...)</code> permet quand même des tests, mais SI.CONDITIONS est plus naturel dans ce cas.</div>

<h3>5. Compatibilité et alternative</h3>
<pre class="pseudo">Sur Excel 2016 ou anterieur (pas de SI.CONDITIONS) :
=SI(A2>=16;"Tres bien";SI(A2>=14;"Bien";SI(A2>=10;"Passable";"Insuffisant")))
   // meme resultat avec des SI imbriques classiques</pre>
<div class="warn">Rappelle-toi : SI.CONDITIONS et SI.MULTIPLE ne fonctionnent pas sur Excel 2016 et avant. Pour un fichier partagé avec de vieilles versions, reste sur des SI imbriqués.</div>`,
  exercises: [
    { type: "qcm", q: "Que renvoie ET(vrai ; faux) ?", opts: ["VRAI", "FAUX", "une erreur", "0"], a: 1, exp: "ET exige que TOUTES les conditions soient vraies." },
    { type: "qcm", q: "Que renvoie OU(faux ; vrai ; faux) ?", opts: ["FAUX", "VRAI", "erreur", "vide"], a: 1, exp: "OU est vrai dès qu'au moins une condition est vraie." },
    { type: "input", q: "Écris un SI qui affiche « Admis » si B2 ET C2 sont tous deux ≥ 10, sinon « Recalé ».", a: ["=SI(ET(B2>=10;C2>=10);\"Admis\";\"Recale\")"], ph: "=SI(ET(...);...)", exp: "ET impose les deux conditions vraies." },
    { type: "qcm", q: "SI.CONDITIONS renvoie…", opts: ["la valeur du dernier test vrai", "la valeur du PREMIER test vrai (gauche à droite)", "toujours la 1re valeur", "une somme"], a: 1, exp: "Elle s'arrête au premier test VRAI rencontré." },
    { type: "input", q: "Écris SI.CONDITIONS : A2≥16 → « Très bien », A2≥10 → « Passable », sinon « Insuffisant ».", a: ["=SI.CONDITIONS(A2>=16;\"Tres bien\";A2>=10;\"Passable\";VRAI;\"Insuffisant\")"], ph: "=SI.CONDITIONS(...)", exp: "VRAI ; ... joue le rôle du sinon final." },
    { type: "qcm", q: "Dans SI.CONDITIONS, à quoi sert « VRAI ; valeur » à la fin ?", opts: ["À rien", "À servir de cas « sinon » qui capte tous les cas restants", "À trier", "À afficher une erreur"], a: 1, exp: "VRAI est toujours vrai : c'est le fourre-tout final." },
    { type: "vf", q: "Si aucun test de SI.CONDITIONS n'est vrai et qu'il n'y a pas de cas VRAI final, la fonction renvoie #N/A.", a: true, exp: "Sans « sinon », un cas non couvert donne #N/A." },
    { type: "vf", q: "Dans SI.CONDITIONS, l'ordre des conditions n'a aucune importance.", a: false, exp: "L'ordre est crucial : la première condition vraie l'emporte." },
    { type: "qcm", q: "SI.MULTIPLE sert surtout à…", opts: ["comparer une valeur à une liste de cas exacts", "faire des additions", "trier", "tester des inégalités >=, <"], a: 0, exp: "SI.MULTIPLE teste des égalités exactes, comme un switch." },
    { type: "input", q: "Écris SI.MULTIPLE : B2=« L » → « Lundi », B2=« M » → « Mardi », sinon « Inconnu ».", a: ["=SI.MULTIPLE(B2;\"L\";\"Lundi\";\"M\";\"Mardi\";\"Inconnu\")"], ph: "=SI.MULTIPLE(...)", exp: "Le dernier argument seul est la valeur par défaut." },
    { type: "vf", q: "SI.MULTIPLE peut tester directement B2>=10.", a: false, exp: "SI.MULTIPLE ne teste que l'égalité ; pour >= il faut SI.CONDITIONS." },
    { type: "qcm", q: "SI.CONDITIONS et SI.MULTIPLE sont disponibles…", opts: ["dans toutes les versions", "à partir d'Excel 2019 et Microsoft 365", "seulement sur Mac", "jamais"], a: 1, exp: "Elles n'existent pas sur Excel 2016 et antérieur." },
    { type: "input", q: "Écris un SI qui affiche « Remise » si le client est « VIP » (B2) OU si C2 dépasse 1000, sinon « Standard ».", a: ["=SI(OU(B2=\"VIP\";C2>1000);\"Remise\";\"Standard\")"], ph: "=SI(OU(...);...)", exp: "OU suffit qu'une seule condition soit vraie." },
    { type: "qcm", q: "Sur Excel 2016, comment remplacer SI.CONDITIONS ?", opts: ["Par SI.MULTIPLE", "Par des SI imbriqués", "Par SOMME", "Par RECHERCHEX"], a: 1, exp: "Les SI imbriqués donnent le même résultat, en moins lisible." },
    { type: "input", q: "Écris NON(B2=\"\") pour tester que B2 n'est PAS vide.", a: ["=NON(B2=\"\")"], ph: "=NON(...)", exp: "NON inverse le test : vrai si B2 n'est pas vide." }
  ],
  final: {
    title: "Exercice final — Mention d'un examen",
    intro: `<p>On attribue une mention selon la moyenne, et un statut selon deux notes. Voici les données :</p>
<pre class="pseudo">      A        B        C          D          E
  1  Eleve    Moy      Note1      Note2      Mention
  2  Ali      15,5     12         14         (a calculer)
  3  Bea      9        8          11
  4  Chris    17       16         18</pre>
<p>Barème des mentions : ≥16 « Très bien », ≥14 « Bien », ≥12 « Assez bien », ≥10 « Passable », sinon « Ajourné ».</p>`,
    questions: [
      { type: "input", q: "En E2, écris SI.CONDITIONS pour la mention selon B2 (barème ci-dessus, sinon « Ajourné »).", a: ["=SI.CONDITIONS(B2>=16;\"Tres bien\";B2>=14;\"Bien\";B2>=12;\"Assez bien\";B2>=10;\"Passable\";VRAI;\"Ajourne\")"], ph: "=SI.CONDITIONS(...)", exp: "Conditions de la plus haute à la plus basse, VRAI en dernier." },
      { type: "input", q: "Quelle mention obtient Ali (moyenne 15,5) ?", a: ["Bien"], ph: "une mention", exp: "15,5 ≥ 14 mais < 16 → « Bien »." },
      { type: "input", q: "Dans une colonne F, écris un SI qui affiche « Admis » si Note1 ET Note2 sont ≥ 10, sinon « Recalé » (ligne 2).", a: ["=SI(ET(C2>=10;D2>=10);\"Admis\";\"Recale\")"], ph: "=SI(ET(...);...)", exp: "ET impose les deux notes ≥ 10." },
      { type: "qcm", q: "Pour Bea (Note1=8, Note2=11), que renvoie ce SI(ET(...)) ?", opts: ["Admis", "Recalé", "#N/A", "Vide"], a: 1, exp: "8 < 10 : une note échoue, donc ET est faux → « Recalé »." },
      { type: "qcm", q: "Pourquoi mettre B2>=16 AVANT B2>=14 dans SI.CONDITIONS ?", opts: ["Pour la vitesse", "Parce que la 1re condition vraie l'emporte : sinon 17 renverrait « Bien »", "Aucune raison", "Pour trier"], a: 1, exp: "L'ordre décroissant garantit la bonne mention." }
    ],
    solution: `<p>La mention se lit clairement avec SI.CONDITIONS :</p>
<pre class="pseudo">=SI.CONDITIONS(B2>=16;"Tres bien" ; B2>=14;"Bien" ; B2>=12;"Assez bien" ; B2>=10;"Passable" ; VRAI;"Ajourne")
   B2>=16 -> "Tres bien"    on teste du plus haut au plus bas
   B2>=14 -> "Bien"         Ali (15,5) : 1er test vrai = celui-ci -> "Bien"
   ...
   VRAI   -> "Ajourne"      capte tout le reste (moyenne < 10)

Statut selon les deux notes :
=SI(ET(C2>=10 ; D2>=10) ; "Admis" ; "Recale")
   ET(...)   VRAI seulement si les DEUX notes passent
   Bea (8 et 11) -> ET faux -> "Recale"</pre>
<p>À retenir : l'ordre décroissant des seuils est vital, et « VRAI ; … » sert de sinon. Sur Excel 2016, remplace par des SI imbriqués.</p>`
  }
};
</script>
