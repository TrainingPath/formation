<script>
var DAY = {
  num: 13,
  title: "La validation de données avancée (listes en cascade)",
  subtitle: "Empêcher les saisies fausses et construire des listes déroulantes qui dépendent les unes des autres.",
  theory: `
<h3>1. Ce que fait vraiment la validation de données</h3>
<p>La <strong>validation de données</strong> contrôle ce qu'un utilisateur a le droit de taper dans une cellule. Elle ne corrige rien : elle <em>refuse</em> au moment de la saisie. C'est le premier rempart contre les fichiers pollués par « Bruxelles », « bruxelles » et « Bxl ».</p>
<pre class="pseudo">Chemin : Données ▸ Validation des données ▸ Validation des données
   Onglet Options    ce qui est autorise
   Onglet Message de saisie   l'infobulle affichee a la selection
   Onglet Alerte d'erreur     le message et le niveau de blocage</pre>
<div class="warn">Trois niveaux d'alerte d'erreur, et la nuance est capitale. <strong>Arrêt</strong> interdit la saisie. <strong>Avertissement</strong> et <strong>Informations</strong> affichent un message mais laissent passer la valeur si l'utilisateur insiste. Pour une vraie contrainte, il faut <em>Arrêt</em>.</div>
<div class="warn">La validation ne s'applique qu'à la <strong>frappe</strong>. Un <strong>copier-coller</strong> écrase la règle sans aucun avertissement, et efface même la validation de la cellule cible. C'est la limite structurelle à connaître : la validation guide les gens honnêtes, elle ne protège pas un fichier.</div>

<h3>2. Les types de contrôle utiles</h3>
<pre class="pseudo">Nombre entier / Decimal   comprise entre 0 et 100, superieure a...
Date / Heure              entre deux bornes, ou >= AUJOURDHUI()
Longueur du texte         par ex. un code postal de 4 caracteres exactement
Liste                     la liste deroulante
Personnalise              une FORMULE qui doit renvoyer VRAI</pre>

<h3>3. La liste déroulante : trois façons de fournir les valeurs</h3>
<pre class="pseudo">1. Saisie directe (Source)
   Nord;Sud;Est;Ouest
   // separateur = point-virgule (parametres francais)
   // pratique mais fige : modifier la liste oblige a rouvrir la boite

2. Une plage
   =\$H\$2:\$H\$10
   // les \$ sont indispensables : sans eux, la plage se decale
   // quand on recopie la validation vers le bas

3. Une plage NOMMEE ou une colonne de tableau structure
   =Regions
   // le nom est defini dans Formules ▸ Gestionnaire de noms</pre>
<div class="tip">La bonne pratique : place les listes de référence sur une feuille dédiée (« Parametres »), convertis-la en <strong>tableau structuré</strong> (Ctrl+L) et nomme la colonne. La liste déroulante s'étend alors automatiquement quand on ajoute une valeur, sans retoucher la validation.</div>
<div class="warn">Subtilité : une validation ne peut pas pointer <em>directement</em> une référence de tableau structuré (<code>=Table1[Region]</code> est refusé). Il faut créer un nom intermédiaire dans le Gestionnaire de noms qui, lui, pointe vers <code>=Table1[Region]</code>, puis utiliser ce nom dans la source.</div>

<h3>4. Les listes en cascade : le principe</h3>
<p>Une <strong>liste en cascade</strong> (ou liste dépendante) est une liste déroulante dont le contenu change selon le choix fait dans une autre cellule : on choisit un pays, et la seconde liste ne propose que les villes de ce pays.</p>
<p>La méthode classique repose sur deux ingrédients : des <strong>plages nommées</strong> portant exactement le nom des choix de la première liste, et la fonction <strong>INDIRECT</strong> (vue au jour 8) qui transforme le texte de la cellule en référence de plage.</p>
<pre class="pseudo">Preparation des donnees (feuille Parametres) :
      H          I          J
  1  France     Belgique   Suisse
  2  Paris      Bruxelles  Geneve
  3  Lyon       Liege      Berne
  4  Lille      Namur

Etape 1 : selectionner H1:J4
          Formules ▸ Depuis selection ▸ cocher "Ligne du haut" ▸ OK
   // cree d'un coup 3 plages nommees : France, Belgique, Suisse

Etape 2 : validation de la cellule A2 (le pays)
   Autoriser : Liste
   Source    : =\$H\$1:\$J\$1

Etape 3 : validation de la cellule B2 (la ville)
   Autoriser : Liste
   Source    : =INDIRECT(\$A2)
   INDIRECT   transforme le TEXTE "France" en la plage nommee France
   \$A2        colonne figee, ligne libre -> la regle suit chaque ligne</pre>
<div class="warn">Contraintes d'INDIRECT à connaître. (1) Un nom de plage ne peut contenir ni <strong>espace</strong> ni <strong>tiret</strong> : « Pays Bas » est impossible. On remplace l'espace par un underscore et on ajuste la formule : <code>=INDIRECT(SUBSTITUE(\$A2;" ";"_"))</code>. (2) Un nom ne peut pas commencer par un chiffre. (3) Si A2 est vide ou contient une valeur sans plage correspondante, la liste renvoie une erreur et reste vide.</div>
<div class="warn">Le piège du changement d'avis : si l'utilisateur choisit « France », puis « Paris », puis revient sur « Belgique », la cellule B2 <strong>conserve « Paris »</strong> — une valeur devenue incohérente. La validation ne re-contrôle pas les valeurs déjà saisies. Le remède le plus simple : une mise en forme conditionnelle qui signale l'incohérence, <code>=ET(\$B2&lt;&gt;"" ; NB.SI(INDIRECT(\$A2);\$B2)=0)</code>.</div>

<h3>5. <span class="tag">365</span> La cascade moderne avec FILTRE</h3>
<p>Sur Microsoft 365, une approche bien plus souple évite les plages nommées : on construit la liste des valeurs autorisées avec <strong>FILTRE</strong>, dans une zone de travail, puis on pointe la <strong>plage renversante</strong> (spill) avec l'opérateur <code>#</code>.</p>
<pre class="pseudo">Donnees a plat (feuille Parametres, tableau structure "Villes") :
      A          B
  1  Pays       Ville
  2  France     Paris
  3  France     Lyon
  4  Belgique   Bruxelles

En N2, la liste calculee :
=UNIQUE(FILTRE(Villes[Ville] ; Villes[Pays] = \$A2))
   FILTRE(...)   ne garde que les villes du pays choisi en A2
   UNIQUE(...)   supprime les eventuels doublons
   // le resultat "renverse" sur autant de lignes que necessaire

Source de la validation de B2 :
   =\$N\$2#
   #   l'operateur de plage renversante : designe TOUT le resultat,
       quelle que soit sa taille</pre>
<p>Avantage majeur : les données restent <strong>à plat</strong> (une colonne Pays, une colonne Ville), donc faciles à maintenir et à alimenter par Power Query. Aucune plage nommée à créer, aucune contrainte sur les espaces dans les noms. Sur une version antérieure à 365, ni FILTRE ni l'opérateur <code>#</code> n'existent : il faut revenir à la méthode INDIRECT.</p>

<h3>6. La validation personnalisée : contrôler par formule</h3>
<p>Le type <strong>Personnalisé</strong> accepte n'importe quelle formule renvoyant VRAI (saisie acceptée) ou FAUX (saisie refusée). On l'écrit du point de vue de la première cellule sélectionnée, comme en MFC.</p>
<pre class="pseudo">=NB.SI(\$A\$2:\$A\$100 ; A2) = 1
   // interdit les doublons dans la colonne : la valeur tapee
   // ne doit apparaitre qu'une seule fois

=ESTNUM(A2) * (NBCAR(A2) = 4)
   // exige exactement 4 chiffres (ex : un code postal belge)

=GAUCHE(A2 ; 3) = "REF"
   // impose un prefixe obligatoire

=B2 &gt;= A2
   // la date de fin ne peut pas preceder la date de debut

=ET(A2 &gt; 0 ; A2 &lt;= \$F\$1)
   // valeur positive et plafonnee par un seuil parametrable

=ESTVIDE(\$C2) = FAUX
   // interdit de remplir cette cellule tant que C n'est pas renseignee</pre>

<h3>7. Retrouver et auditer les validations</h3>
<pre class="pseudo">Accueil ▸ Rechercher et sélectionner ▸ Validation des données
   // selectionne d'un coup toutes les cellules qui portent une regle

Données ▸ Validation des données ▸ Entourer les données non valides
   // cercle rouge sur les valeurs devenues invalides (collees, ou
   // devenues fausses apres modification de la liste source)
   // ▸ Effacer les cercles de validation pour les retirer</pre>
<div class="tip">« Entourer les données non valides » est l'outil d'audit indispensable après un import ou un collage massif : il révèle en une seconde tout ce que la validation n'a pas pu bloquer.</div>`,
  exercises: [
    { type: "qcm", q: "Quel niveau d'alerte d'erreur empêche réellement une saisie interdite ?", opts: ["Informations", "Avertissement", "Arrêt", "Aucun"], a: 2, exp: "Avertissement et Informations laissent passer la valeur si l'utilisateur confirme." },
    { type: "vf", q: "Un copier-coller respecte les règles de validation de la cellule cible.", a: false, exp: "Il les contourne et écrase même la validation en place : c'est la faille structurelle." },
    { type: "qcm", q: "Quel séparateur utilise-t-on pour une liste saisie directement dans Source (paramètres français) ?", opts: ["La virgule", "Le point-virgule", "L'espace", "Le tiret"], a: 1, exp: "Nord;Sud;Est;Ouest — la virgule est le séparateur des versions anglaises." },
    { type: "input", q: "Écris la source de validation de la liste des villes en B2, dépendante du pays en A2 (méthode classique).", a: ["=INDIRECT($A2)"], ph: "=INDIRECT($A2)", exp: "INDIRECT convertit le texte du pays en la plage nommée du même nom." },
    { type: "qcm", q: "Quelle commande crée d'un coup plusieurs plages nommées à partir des en-têtes ?", opts: ["Données ▸ Convertir", "Formules ▸ Depuis sélection", "Accueil ▸ Trier", "Insertion ▸ Tableau"], a: 1, exp: "En cochant « Ligne du haut », chaque colonne devient une plage nommée." },
    { type: "vf", q: "Une plage nommée peut contenir un espace, par exemple « Pays Bas ».", a: false, exp: "Espaces et tirets sont interdits : on utilise un underscore et SUBSTITUE dans INDIRECT." },
    { type: "input", q: "Écris la formule de validation personnalisée qui interdit les doublons dans A2:A100.", a: ["=NB.SI($A$2:$A$100;A2)=1"], ph: "=NB.SI($A$2:$A$100;A2)=1", exp: "La saisie n'est acceptée que si la valeur n'apparaît qu'une seule fois." },
    { type: "qcm", q: "Que doit renvoyer une formule de validation personnalisée pour que la saisie soit acceptée ?", opts: ["0", "VRAI", "Un texte", "Une plage"], a: 1, exp: "VRAI accepte, FAUX refuse — même logique que la mise en forme conditionnelle." },
    { type: "input", q: "Écris la formule de validation qui impose que la date de fin en B2 ne précède pas la date de début en A2.", a: ["=B2>=A2"], ph: "=B2>=A2", exp: "La formule est écrite du point de vue de la première cellule sélectionnée." },
    { type: "qcm", q: "Sur Microsoft 365, quelle formule construit dynamiquement la liste des villes d'un pays ?", opts: ["=INDIRECT(A2)", "=UNIQUE(FILTRE(Villes[Ville];Villes[Pays]=$A2))", "=RECHERCHEV(A2;Villes;2)", "=NB.SI(Villes;A2)"], a: 1, exp: "FILTRE sélectionne les lignes du pays, UNIQUE dédoublonne le résultat." },
    { type: "qcm", q: "Que désigne l'opérateur # dans la source de validation =$N$2# ?", opts: ["Un commentaire", "Toute la plage renversante produite par la formule en N2", "Une erreur", "Le nombre de lignes"], a: 1, exp: "L'opérateur de plage renversante suit automatiquement la taille du résultat." },
    { type: "vf", q: "Si l'utilisateur change le pays après avoir choisi la ville, Excel efface automatiquement la ville devenue incohérente.", a: false, exp: "La valeur incohérente reste : il faut une MFC de contrôle ou une macro pour la détecter." },
    { type: "input", q: "Écris la formule de validation qui impose une valeur numérique de 4 caractères exactement.", a: ["=ESTNUM(A2)*(NBCAR(A2)=4)"], ph: "=ESTNUM(A2)*(NBCAR(A2)=4)", exp: "La multiplication de deux conditions équivaut à un ET logique." },
    { type: "qcm", q: "Quel outil révèle les valeurs devenues invalides après un collage massif ?", opts: ["Entourer les données non valides", "Figer les volets", "Analyse rapide", "Le vérificateur d'orthographe"], a: 0, exp: "Données ▸ Validation des données ▸ Entourer les données non valides." },
    { type: "vf", q: "Pointer une liste vers une colonne de tableau structuré nécessite de passer par une plage nommée intermédiaire.", a: true, exp: "La source de validation refuse =Table1[Colonne] écrit directement." }
  ],
  final: {
    title: "Exercice final — Un formulaire de saisie de commandes verrouillé",
    intro: `<p>Un formulaire doit guider la saisie : catégorie puis produit dépendant, quantité plafonnée et date de livraison cohérente.</p>
<pre class="pseudo">Feuille "Parametres" :
      H            I            J
  1  Informatique Mobilier     Papeterie
  2  Casque       Chaise       Ramette
  3  Clavier      Bureau       Stylo
  4  Ecran        Armoire

Feuille "Saisie" (les donnees vont de la ligne 2 a la ligne 50) :
      A          B         C          D
  1  Categorie  Produit   Quantite   Livraison</pre>`,
    questions: [
      { type: "qcm", q: "Quelle commande crée en une fois les trois plages nommées Informatique, Mobilier et Papeterie ?", opts: ["Données ▸ Convertir", "Sélectionner H1:J4 puis Formules ▸ Depuis sélection ▸ Ligne du haut", "Insertion ▸ Nom", "Accueil ▸ Mise sous forme de tableau"], a: 1, exp: "Chaque colonne devient une plage nommée portant l'intitulé de sa première cellule." },
      { type: "input", q: "En B2 (le produit), écris la source de validation dépendante de la catégorie choisie en A2.", a: ["=INDIRECT($A2)"], ph: "=INDIRECT($A2)", exp: "Le $ fige la colonne A pour que la règle recopiée suive chaque ligne du formulaire." },
      { type: "input", q: "En C2, écris la validation personnalisée qui exige un entier strictement positif et au plus égal au plafond stocké en F1.", a: ["=ET(C2>0;C2<=$F$1)"], ph: "=ET(C2>0;C2<=$F$1)", exp: "Le plafond est figé en absolu pour rester le même sur toutes les lignes." },
      { type: "input", q: "En D2, écris la validation personnalisée qui refuse une date de livraison antérieure à aujourd'hui.", a: ["=D2>=AUJOURDHUI()"], ph: "=D2>=AUJOURDHUI()", exp: "La formule renvoie FAUX pour toute date passée, ce qui bloque la saisie." },
      { type: "vf", q: "Sur Microsoft 365, on peut remplacer toute la mécanique INDIRECT par FILTRE et l'opérateur # de plage renversante.", a: true, exp: "Les données restent à plat et aucune plage nommée n'est nécessaire." }
    ],
    solution: `<p>Quatre règles à poser, dans l'ordre logique du formulaire.</p>
<pre class="pseudo">Preparation -- creer les plages nommees
   Selectionner Parametres!H1:J4
   Formules ▸ Depuis selection ▸ cocher "Ligne du haut" ▸ OK
   // 3 plages nommees creees : Informatique, Mobilier, Papeterie
   // chacune couvre les produits sous son en-tete

A2:A50 -- la categorie
   Donnees ▸ Validation des donnees ▸ Autoriser : Liste
   Source : =Parametres!\$H\$1:\$J\$1
   // les \$ empechent la plage de glisser lors de la recopie

B2:B50 -- le produit (liste en cascade)
   Autoriser : Liste
   Source    : =INDIRECT(\$A2)
   \$A2        colonne figee, ligne libre : B7 lira A7
   INDIRECT   convertit le texte "Mobilier" en la plage nommee Mobilier
   // si A2 est vide, la liste est vide : c'est le comportement normal

C2:C50 -- la quantite
   Autoriser : Personnalise
   Formule   : =ET(C2 &gt; 0 ; C2 &lt;= \$F\$1)
   C2 &gt; 0        refuse zero et les negatifs
   C2 &lt;= \$F\$1   plafond parametrable, fige en absolu
   Alerte d'erreur : Arret, message "Quantite entre 1 et le plafond autorise"

D2:D50 -- la date de livraison
   Autoriser : Personnalise
   Formule   : =D2 &gt;= AUJOURDHUI()
   // refuse toute date deja passee

Controle de coherence (mise en forme conditionnelle sur B2:B50) :
=ET(\$B2 &lt;&gt; "" ; NB.SI(INDIRECT(\$A2) ; \$B2) = 0)
   \$B2 &lt;&gt; ""                   la cellule est remplie
   NB.SI(INDIRECT(\$A2);\$B2)=0   le produit n'appartient PAS a la categorie
   // signale en rouge le cas "l'utilisateur a change de categorie
   // apres avoir choisi son produit" -- que la validation ne detecte pas

Version Microsoft 365, sans plages nommees :
   Mettre les parametres a plat, en tableau structure "Catalogue" :
      Categorie | Produit
   En N2 : =UNIQUE(FILTRE(Catalogue[Produit] ; Catalogue[Categorie] = \$A2))
   Source de la validation de B2 : =\$N\$2#
   // le # suit automatiquement la taille du resultat</pre>
<p>Dernier réflexe, une fois le formulaire diffusé : <code>Données ▸ Validation des données ▸ Entourer les données non valides</code>. Comme un copier-coller passe outre toutes ces règles, c'est le seul moyen de repérer ce qui s'est glissé dans le fichier.</p>`
  }
};
</script>

  { id: "excelpro-j13", lab: {"title":"À reproduire","intro":"Construire une double liste déroulante en cascade : la ville dépend de la région choisie (INDIRECT).","steps":"1) Sur une feuille Parametres, saisis les villes par région : Nord : Lille, Lens ; Sud : Nice, Cannes. Écris aussi la liste des régions.\n2) Sélectionne le bloc de villes du Nord et tape Nord dans la Zone Nom ; fais de même pour Sud.\n3) Sur la feuille Saisie, en A2 : Données > Validation > Liste > source = la liste des régions.\n4) En B2 : Validation > Liste > source : =INDIRECT(A2)","check":"Choisir Nord en A2 limite B2 à Lille et Lens ; choisir Sud limite B2 à Nice et Cannes."}, title: "Cascade à deux niveaux : région puis ville", level: 3,

      "Formules ▸ Depuis sélection avec « Ligne du haut » crée les plages nommées d'un coup — mais observe ce qu'Excel fait du nom « Region Bruxelles ».",
      "Excel remplace automatiquement l'espace par un underscore dans le nom de plage, alors que la cellule H1 affiche toujours l'espace. INDIRECT($A2) échouera donc sur cette région.",

    solution: "ETAPE 1 -- creer les plages nommees\n   Selectionner Parametres!H1:J5\n   Formules > Depuis selection > cocher \"Ligne du haut\" > OK\n   Excel cree : Wallonie, Flandre, Region_Bruxelles\n   /!\\ le nom de la 3e plage est Region_Bruxelles avec un UNDERSCORE :\n       les espaces sont interdits dans un nom, Excel les convertit seul.\n       La cellule H1, elle, affiche toujours \"Region Bruxelles\".\n   Verifier dans Formules > Gestionnaire de noms.\n\nETAPE 2 -- la liste des regions, en A2:A100 (feuille Saisie)\n   Donnees > Validation des donnees > Autoriser : Liste\n   Source : =Parametres!$H$1:$J$1\n   $H$1:$J$1   plage figee en absolu : la validation recopiee vers le bas\n               doit toujours pointer la meme ligne d'en-tetes\n\nETAPE 3 -- la liste des villes, en B2:B100\n   Autoriser : Liste\n   Source : =INDIRECT(SUBSTITUE($A2 ; \" \" ; \"_\"))\n   $A2                      colonne figee, ligne libre\n                            -> B2 lit A2, B15 lira A15\n   SUBSTITUE($A2;\" \";\"_\")   \"Region Bruxelles\" devient \"Region_Bruxelles\"\n                            -> le texte correspond enfin au nom de plage\n   INDIRECT(...)            convertit ce texte en vraie reference de plage\n   // =INDIRECT($A2) tout court fonctionnerait pour Wallonie et Flandre,\n   // mais renverrait une liste VIDE pour Region Bruxelles.\n\nETAPE 4 -- signaler les incoherences (mise en forme conditionnelle sur B2:B100)\n   Formule : =ET($B2 <> \"\" ; NB.SI(INDIRECT(SUBSTITUE($A2;\" \";\"_\")) ; $B2) = 0)\n   Format  : fond rouge clair\n   $B2 <> \"\"      la cellule contient quelque chose\n   NB.SI(...) = 0 cette ville n'existe pas dans la region choisie\n   // couvre le cas : l'utilisateur choisit Wallonie, puis Namur,\n   // puis change pour Flandre -> \"Namur\" reste affiche sans alerte\n\nVARIANTE MICROSOFT 365 -- donnees a plat, sans plages nommees\n   Sur Parametres, remettre les donnees en 2 colonnes,\n   converties en tableau structure nomme \"Geo\" :\n      Region            Ville\n      Wallonie          Namur\n      Wallonie          Liege\n      Region Bruxelles  Ixelles\n      ...\n\n   En Saisie!N2 : =UNIQUE(FILTRE(Geo[Ville] ; Geo[Region] = $A2))\n      FILTRE   ne garde que les lignes de la region choisie\n      UNIQUE   dedoublonne\n      // le resultat \"renverse\" (spill) sur autant de lignes que necessaire\n\n   Source de la validation de B2 : =$N$2#\n      #   operateur de plage renversante : designe tout le resultat,\n          quelle que soit sa hauteur\n\n   Avantages : aucune plage nommee, aucun probleme d'espace dans les noms,\n   et il suffit d'ajouter une ligne au tableau Geo pour enrichir la liste.\n\nResultat attendu :\n   A2 = Wallonie          -> B2 propose Namur, Liege, Mons, Charleroi\n   A2 = Flandre           -> B2 propose Anvers, Gand, Bruges\n   A2 = Region Bruxelles  -> B2 propose Ixelles, Uccle, Schaerbeek",
    note: "Le piege central de cet exercice est l'espace dans \"Region Bruxelles\". Excel accepte de creer la plage mais la renomme silencieusement en Region_Bruxelles, si bien que la formule =INDIRECT($A2) marche pour deux regions sur trois -- le genre de bug qu'on ne decouvre qu'apres diffusion du fichier. Deux parades : soit SUBSTITUE dans INDIRECT, soit -- plus propre -- bannir les espaces des libelles des le depart. Second point a retenir : INDIRECT est une fonction VOLATILE (jour 8). Sur un formulaire de quelques centaines de lignes c'est indolore, mais sur des milliers de lignes la version 365 avec FILTRE est nettement plus performante." }

};
