<script>
var DAY = {
  num: 1,
  title: "Passer au niveau supérieur : rappels et bonnes pratiques",
  subtitle: "Consolider les fondations avant d'attaquer les formules avancées : références, tableaux structurés, noms et méthode de travail.",
  theory: `
<h3>1. Pourquoi ce jour de rappels ?</h3>
<p>Tu maîtrises déjà les formules de base, SI, RECHERCHEV, les graphiques et les TCD. Avant de monter en puissance, on solidifie quelques réflexes qui font la différence entre un classeur « bricolé » et un classeur <strong>pro</strong> : maîtrise des références, tableaux structurés, plages nommées et une vraie méthode. Ces bases reviendront dans TOUS les jours suivants.</p>

<h3>2. Les trois types de références (le rôle du \$)</h3>
<p>Une <strong>référence</strong> désigne une cellule (A1) ou une plage (A1:C10). Le signe <strong>\$</strong> sert à <em>verrouiller</em> une coordonnée quand on recopie la formule. La touche <strong>F4</strong> fait défiler les quatre combinaisons.</p>
<pre class="pseudo">A1      // reference RELATIVE : colonne ET ligne bougent quand on recopie
\$A\$1   // reference ABSOLUE : colonne ET ligne figees (F4 une fois)
A\$1    // reference MIXTE : la LIGNE est figee, la colonne bouge
\$A1    // reference MIXTE : la COLONNE est figee, la ligne bouge</pre>
<div class="tip">Astuce de conversion des taux : dans <code>=B2*\$F\$1</code>, on multiplie chaque montant B2 (relatif) par le taux en F1 (absolu). En recopiant vers le bas, B2 devient B3, B4… mais \$F\$1 reste fixe.</div>

<h3>3. Le tableau structuré (Ctrl + L)</h3>
<p>Un <strong>tableau structuré</strong> (ou « tableau Excel ») est une plage transformée en objet nommé via <strong>Insertion ▸ Tableau</strong> ou <strong>Ctrl + L</strong>. Excel lui donne un nom (Tableau1, ou un nom que tu choisis dans <em>Création de tableau ▸ Nom du tableau</em>). Ses atouts : mise en forme automatique, filtres, <strong>ligne de total</strong>, et surtout il <strong>s'étend tout seul</strong> quand tu ajoutes une ligne.</p>
<p>Une <strong>référence structurée</strong> est une manière d'écrire une plage en utilisant les NOMS du tableau et de ses colonnes, au lieu des coordonnées A1.</p>
<pre class="pseudo">=SOMME(Ventes[Montant])          // somme de toute la colonne "Montant" du tableau "Ventes"
=[@Montant]*[@Taux]              // @ = "sur la ligne courante" : Montant x Taux de cette ligne
=SOMME(Ventes[[#Totaux];[Montant]])   // reference a la ligne de total</pre>
<div class="tip">Avantage clé : si tu ajoutes des lignes, <code>Ventes[Montant]</code> englobe automatiquement les nouvelles. Plus besoin de corriger tes plages. C'est LA bonne pratique moderne.</div>

<h3>4. Les plages nommées (Gestionnaire de noms)</h3>
<p>Un <strong>nom défini</strong> est une étiquette que tu donnes à une cellule ou une plage. Au lieu de <code>\$F\$1</code>, tu écris <code>TauxTVA</code>. On les crée dans <strong>Formules ▸ Gestionnaire de noms ▸ Nouveau</strong>, ou en tapant le nom dans la <em>Zone Nom</em> (à gauche de la barre de formule).</p>
<pre class="pseudo">=B2*TauxTVA        // beaucoup plus lisible que =B2*\$F\$1
                   // un nom est absolu par nature : pas besoin de \$</pre>

<h3>5. SIERREUR : habiller les erreurs</h3>
<p><strong>SIERREUR</strong> renvoie une valeur de secours si le calcul produit une erreur (#N/A, #DIV/0!, #VALEUR!…). Indispensable pour des tableaux propres.</p>
<pre class="pseudo">=SIERREUR(A2/B2 ; 0)                     // si B2 vaut 0 (division impossible), affiche 0
=SIERREUR(RECHERCHEV(E2;T;3;FAUX) ; "Introuvable")   // remplace #N/A par un texte</pre>

<h3>6. Méthode de travail « pro »</h3>
<p>Quelques principes qui évitent 90 % des galères :</p>
<pre class="pseudo">1. SEPARER les zones : donnees brutes | calculs | resultats/graphiques
2. Ne JAMAIS ecrire une constante en dur dans une formule -> la mettre dans une cellule nommee
3. Une seule formule par colonne, recopiee (coherence)
4. Nommer feuilles et tableaux clairement
5. Documenter avec des commentaires / une feuille "Notice"</pre>
<div class="warn">Le pire réflexe de débutant : taper un taux (0,2) directement dans 50 formules. Le jour où il change, c'est l'enfer. Mets-le UNE fois dans une cellule nommée et référence-la.</div>

<h3>7. Raccourcis et outils de vérification</h3>
<pre class="pseudo">F4        // bascule relatif / absolu / mixte dans une formule
Ctrl+L    // creer un tableau structure
F9        // dans la barre de formule : evalue le morceau selectionne
Ctrl+~    // afficher toutes les formules (au lieu des resultats)</pre>
<p>Pour déboguer une grosse formule : sélectionne un morceau dans la barre de formule et appuie sur <strong>F9</strong> pour voir son résultat, ou utilise <strong>Formules ▸ Évaluer la formule</strong> pas à pas.</p>`,
  exercises: [
    { type: "qcm", q: "Que fait la touche F4 quand le curseur est sur une référence dans une formule ?", opts: ["Elle supprime la référence", "Elle fait défiler relatif / absolu / mixte", "Elle valide la formule", "Elle ouvre le Gestionnaire de noms"], a: 1, exp: "F4 bascule entre A1, \$A\$1, A\$1 et \$A1." },
    { type: "input", q: "Complète : pour figer la ligne 1 mais laisser la colonne bouger, on écrit A puis… (donne la référence complète pour la cellule A1).", a: ["A\$1"], ph: "une référence mixte", exp: "A\$1 fige la ligne, la colonne reste relative." },
    { type: "vf", q: "Une plage nommée (nom défini) se comporte comme une référence absolue : pas besoin d'ajouter des \$.", a: true, exp: "Un nom pointe toujours vers la même plage, il est absolu par nature." },
    { type: "qcm", q: "Quel raccourci transforme une plage sélectionnée en tableau structuré ?", opts: ["Ctrl+T seulement en anglais", "Ctrl+L", "Ctrl+Maj+F", "Alt+E"], a: 1, exp: "Ctrl+L (ou Insertion ▸ Tableau) crée un tableau structuré." },
    { type: "input", q: "Écris la formule qui additionne toute la colonne « Montant » du tableau structuré nommé « Ventes ».", a: ["=SOMME(Ventes[Montant])"], ph: "=SOMME(...)", exp: "=SOMME(Ventes[Montant]) : référence structurée à la colonne entière." },
    { type: "qcm", q: "Principal avantage d'un tableau structuré pour tes formules ?", opts: ["Il ajoute automatiquement une ligne de totaux", "Il s'étend automatiquement aux nouvelles lignes ajoutées", "Il empêche les erreurs", "Il calcule plus vite"], a: 1, exp: "Les références structurées englobent d'office les lignes ajoutées." },
    { type: "input", q: "Dans une colonne calculée d'un tableau, écris le produit de la colonne Montant par la colonne Taux, sur la ligne courante (référence structurée avec @).", a: ["=[@Montant]*[@Taux]"], ph: "=[@...]*[@...]", exp: "[@Colonne] désigne la valeur de cette colonne sur la ligne en cours." },
    { type: "vf", q: "Il est recommandé de taper une constante comme un taux de TVA directement dans chaque formule.", a: false, exp: "Au contraire : on met la constante UNE fois dans une cellule (idéalement nommée) et on la référence." },
    { type: "input", q: "Écris une formule qui divise A2 par B2 mais affiche 0 en cas d'erreur (ex : division par zéro).", a: ["=SIERREUR(A2/B2;0)"], ph: "=SIERREUR(...)", exp: "=SIERREUR(A2/B2;0) renvoie 0 si le calcul échoue." },
    { type: "qcm", q: "À quoi sert F9 quand on a sélectionné un morceau de formule dans la barre de formule ?", opts: ["À enregistrer", "À évaluer ce morceau et voir son résultat", "À figer la référence", "À insérer une fonction"], a: 1, exp: "F9 calcule le fragment sélectionné : très utile pour déboguer." },
    { type: "qcm", q: "Où crée-t-on et gère-t-on les noms définis ?", opts: ["Accueil ▸ Styles", "Formules ▸ Gestionnaire de noms", "Données ▸ Trier", "Insertion ▸ Graphique"], a: 1, exp: "Formules ▸ Gestionnaire de noms (ou la Zone Nom à gauche de la barre de formule)." },
    { type: "vf", q: "Dans =B2*\$F\$1, en recopiant vers le bas, B2 devient B3 mais \$F\$1 reste fixe.", a: true, exp: "B2 est relatif (il suit), \$F\$1 est absolu (il est verrouillé)." },
    { type: "input", q: "Réécris =B2*\$F\$1 de façon lisible, sachant que F1 a été nommée « TauxTVA ».", a: ["=B2*TauxTVA"], ph: "=B2*...", exp: "Le nom remplace la référence absolue et se lit tout seul." },
    { type: "qcm", q: "Quelle est une bonne pratique d'organisation d'un classeur pro ?", opts: ["Tout mélanger sur une feuille", "Séparer données brutes, calculs et résultats", "Ne jamais nommer les feuilles", "Coder les taux en dur partout"], a: 1, exp: "Séparer les zones rend le classeur maintenable et fiable." },
    { type: "qcm", q: "Quel raccourci affiche toutes les formules au lieu de leurs résultats ?", opts: ["Ctrl+~ (Ctrl et la touche du tilde)", "Ctrl+P", "Ctrl+B", "F2"], a: 0, exp: "Ctrl+~ bascule l'affichage des formules ; très pratique pour auditer." }
  ],
  final: {
    title: "Exercice final — Un tableau de ventes propre",
    intro: `<p>Voici une petite table de ventes. Le taux de commission (10 %) est saisi UNE seule fois en F1, que l'on a nommée « Taux ». On veut calculer la commission de chaque ligne, puis le total.</p>
<pre class="pseudo">      A         B          C            F
  1  Vendeur   Montant    Commission   0,1   (nomme "Taux")
  2  Ali       1000       (a calculer)
  3  Bea       2000
  4  Chris     1500</pre>
<p>On souhaite aussi transformer A1:C4 en tableau structuré nommé « Ventes ».</p>`,
    questions: [
      { type: "input", q: "En C2, écris la commission = Montant × Taux, avec Taux nommé (recopiable vers le bas).", a: ["=B2*Taux"], ph: "=B2*...", exp: "Le nom Taux est absolu : la formule se recopie sans souci." },
      { type: "input", q: "Sans utiliser le nom, écris la même commission en C2 avec une référence absolue vers F1.", a: ["=B2*\$F\$1"], ph: "=B2*\$F\$1", exp: "\$F\$1 fige la cellule du taux pour la recopie." },
      { type: "input", q: "Quelle commission obtient Bea (Montant 2000, taux 10 %) ?", a: ["200"], ph: "un nombre", exp: "2000 × 0,1 = 200." },
      { type: "input", q: "Une fois A1:C4 converti en tableau « Ventes », écris la somme de la colonne Commission en référence structurée.", a: ["=SOMME(Ventes[Commission])"], ph: "=SOMME(...)", exp: "La référence structurée englobera aussi les futures lignes." },
      { type: "qcm", q: "Pourquoi nommer la cellule du taux plutôt que taper 0,1 dans chaque formule ?", opts: ["Pour faire joli", "Pour pouvoir le changer à un seul endroit et gagner en lisibilité", "Pour calculer plus vite", "Pour protéger la cellule contre toute modification"], a: 1, exp: "Un seul point de vérité : on modifie le taux une fois, tout se met à jour." }
    ],
    solution: `<p>Les deux écritures de la commission donnent le même résultat :</p>
<pre class="pseudo">Avec un nom (recommande) :
=B2*Taux
   B2      le montant de la ligne (relatif : suit la recopie)
   Taux    la cellule F1 nommee (absolue par nature)
-> Ali : 1000 x 0,1 = 100 ; Bea : 200 ; Chris : 150

Sans nom, avec reference absolue :
=B2*\$F\$1
   \$F\$1   la cellule du taux, verrouillee avec F4 pour recopier

Total en reference structuree (apres Ctrl+L, tableau "Ventes") :
=SOMME(Ventes[Commission])
-> 100 + 200 + 150 = 450, et englobe toute nouvelle ligne ajoutee</pre>
<p>À retenir : une constante = une cellule (nommée), pas un chiffre en dur. Et un tableau structuré s'étend tout seul.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excelpro-j01", title: "Nettoyer un budget bricolé", level: 2,

    hints: [
      "Nomme E1 : sélectionne E1, tape TVA dans la Zone Nom (à gauche de la barre de formule), Entrée.",

      "Après Ctrl+L sur A1:C4, renomme le tableau « Achats » dans Création de tableau, puis =SOMME(Achats[TTC])."
    ],
    solution: "1) Nommer le taux : selectionne E1, tape \"TVA\" dans la Zone Nom, Entree. E1 vaut 0,2.\n\n2) En C2, le TTC :\n=B2*(1+TVA)\n   B2       le montant HT de la ligne (relatif)\n   TVA      la cellule E1 nommee (absolue) = 0,2\n   (1+TVA)  = 1,2 -> ajoute 20 %\n-> Clavier : 30 x 1,2 = 36 ; Souris : 18 ; Ecran : 144\nRecopie vers le bas : le nom TVA ne bouge pas.\n\n3) Selectionne A1:C4, Ctrl+L (Ma table comporte des en-tetes), puis Creation de tableau ▸ Nom du tableau : \"Achats\".\nSomme des TTC :\n=SOMME(Achats[TTC])\n-> 36 + 18 + 144 = 198\n\nResultat attendu : C2=36, C3=18, C4=144 ; total TTC = 198.",
    note: "En codant 0,2 en dur, changer la TVA obligerait a corriger chaque formule. Avec un nom, tu modifies E1 une seule fois et tout se recalcule. Et le tableau \"Achats\" integrera automatiquement toute nouvelle ligne d'article." }
  ]
};
</script>
