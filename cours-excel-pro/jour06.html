<script>
var DAY = {
  num: 6,
  title: "SOMMEPROD : le couteau suisse",
  subtitle: "Multiplier puis additionner des plages, et l'utiliser pour compter/sommer sous conditions dans toutes les versions.",
  theory: `
<h3>1. L'idée de base : multiplier puis additionner</h3>
<p><strong>SOMMEPROD</strong> (« somme des produits ») multiplie des plages <em>terme à terme</em>, puis additionne tous les produits. C'est une fonction très ancienne (toutes versions) mais redoutable : elle gère des calculs conditionnels que SOMME.SI.ENS ne sait pas faire.</p>
<pre class="pseudo">=SOMMEPROD(plage1 ; plage2 ; ...)
   // multiplie plage1[i] x plage2[i] pour chaque ligne i, puis additionne le tout</pre>
<pre class="pseudo">=SOMMEPROD(B2:B5 ; C2:C5)
   B2:B5   les quantites
   C2:C5   les prix unitaires
   // = B2*C2 + B3*C3 + B4*C4 + B5*C5  (le total d'une facture en UNE formule)</pre>
<div class="warn">Les plages doivent avoir la <strong>même taille</strong> (même nombre de lignes/colonnes), sinon <code>#VALEUR!</code>.</div>

<h3>2. Le secret : les conditions deviennent des 1 et des 0</h3>
<p>Une condition comme <code>(A2:A5="Paris")</code> renvoie un tableau de <strong>VRAI/FAUX</strong>. En le multipliant (ou avec <code>--</code>), VRAI devient 1 et FAUX devient 0. On peut donc « filtrer » un calcul.</p>
<pre class="pseudo">(A2:A5="Paris")        -> {VRAI ; FAUX ; VRAI ; FAUX}
--(A2:A5="Paris")      -> {1 ; 0 ; 1 ; 0}   // le double moins (--) force le 0/1
   // multiplier par ce tableau annule (x0) les lignes non voulues</pre>
<div class="tip">La <strong>double négation</strong> <code>--</code> convertit VRAI/FAUX en 1/0. On peut aussi multiplier les conditions entre elles : le produit vaut 1 seulement si toutes valent 1.</div>

<h3>3. Compter sous condition(s)</h3>
<pre class="pseudo">=SOMMEPROD(--(A2:A5="Paris"))
   --(A2:A5="Paris")   {1;0;1;0} : 1 par ligne Paris
   SOMMEPROD(...)      additionne -> le NOMBRE de lignes "Paris"
   // equivalent a NB.SI(A2:A5;"Paris")</pre>
<pre class="pseudo">=SOMMEPROD((A2:A5="Paris")*(B2:B5="Ventes"))
   (A2:A5="Paris")   condition ville
   (B2:B5="Ventes")  condition service
   * entre elles     1 seulement si Paris ET Ventes
   // compte les lignes Paris ET Ventes (le * remplace le -- ici)</pre>

<h3>4. Sommer sous condition(s)</h3>
<pre class="pseudo">=SOMMEPROD((A2:A5="Paris")*(C2:C5))
   (A2:A5="Paris")   1 pour Paris, 0 sinon
   *(C2:C5)          multiplie par le montant -> garde le montant si Paris, sinon 0
   // somme des montants de Paris (comme SOMME.SI)</pre>
<pre class="pseudo">=SOMMEPROD((A2:A5="Paris")*(B2:B5="Ventes")*(C2:C5))
   // somme des montants Paris ET Ventes (comme SOMME.SI.ENS)</pre>

<h3>5. Ce que SOMMEPROD fait de plus</h3>
<p>Sa force : des critères que SOMME.SI.ENS ne gère pas, comme comparer DEUX colonnes entre elles, ou utiliser des fonctions (MOIS, GAUCHE…) dans le critère.</p>
<pre class="pseudo">=SOMMEPROD((B2:B5>C2:C5)*1)
   (B2:B5>C2:C5)   compare deux colonnes ligne a ligne
   // compte les lignes ou la colonne B depasse la colonne C
   // impossible directement avec NB.SI.ENS !</pre>
<pre class="pseudo">=SOMMEPROD((MOIS(A2:A50)=3)*(C2:C50))
   MOIS(A2:A50)=3   vrai pour les dates de mars
   // somme des montants de mars, calcul du mois a la volee</pre>
<div class="warn">Compatibilité : SOMMEPROD marche PARTOUT (même Excel 2003), sans validation matricielle spéciale. C'est pourquoi on l'aime pour des fichiers partagés. Depuis 365, FILTRE et les fonctions matricielles dynamiques offrent une alternative plus lisible (jour 7), mais SOMMEPROD reste universel.</div>
<div class="tip">Évite <code>A:A</code> (colonne entière) dans SOMMEPROD : il calcule sur TOUTES les lignes et peut ralentir. Limite tes plages (A2:A1000).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait SOMMEPROD(B2:B5 ; C2:C5) ?", opts: ["Additionne B et C séparément", "Multiplie chaque Bi par Ci puis additionne les produits", "Compte les lignes", "Trie les données"], a: 1, exp: "Produit terme à terme, puis somme : idéal pour un total quantité × prix." },
    { type: "input", q: "Écris le total d'une facture : quantités B2:B5 × prix unitaires C2:C5.", a: ["=SOMMEPROD(B2:B5;C2:C5)"], ph: "=SOMMEPROD(...)", exp: "SOMMEPROD fait B2*C2 + B3*C3 + … en une formule." },
    { type: "qcm", q: "Que se passe-t-il si les plages de SOMMEPROD n'ont pas la même taille ?", opts: ["Ça marche quand même", "Erreur #VALEUR!", "Ça renvoie 0", "Ça complète avec des 0"], a: 1, exp: "Les plages doivent avoir des dimensions identiques." },
    { type: "qcm", q: "À quoi sert la double négation -- devant une condition ?", opts: ["À rien", "À convertir VRAI/FAUX en 1/0", "À négativer les nombres", "À arrondir"], a: 1, exp: "-- transforme VRAI→1 et FAUX→0 pour pouvoir sommer." },
    { type: "input", q: "Compte le nombre de lignes « Paris » dans A2:A5 avec SOMMEPROD.", a: ["=SOMMEPROD(--(A2:A5=\"Paris\"))"], ph: "=SOMMEPROD(--(...))", exp: "-- convertit les VRAI en 1, la somme donne le compte." },
    { type: "input", q: "Compte les lignes « Paris » (A2:A5) ET « Ventes » (B2:B5).", a: ["=SOMMEPROD((A2:A5=\"Paris\")*(B2:B5=\"Ventes\"))"], ph: "=SOMMEPROD((...)*(...))", exp: "Le produit des deux conditions vaut 1 seulement si les deux sont vraies." },
    { type: "vf", q: "Multiplier deux conditions entre elles équivaut à un ET logique dans SOMMEPROD.", a: true, exp: "1×1=1 (les deux vraies), sinon 0 : c'est un ET." },
    { type: "input", q: "Somme des montants C2:C5 pour les lignes « Paris » (A2:A5).", a: ["=SOMMEPROD((A2:A5=\"Paris\")*(C2:C5))", "=SOMMEPROD((A2:A5=\"Paris\")*C2:C5)"], ph: "=SOMMEPROD((...)*(C2:C5))", exp: "La condition (0/1) multiplie le montant : garde Paris, annule le reste." },
    { type: "qcm", q: "Un avantage de SOMMEPROD sur SOMME.SI.ENS ?", opts: ["Il est plus lent", "Il peut comparer deux colonnes entre elles ou utiliser des fonctions dans le critère", "Il se calcule plus rapidement sur de gros tableaux", "Aucun"], a: 1, exp: "SOMME.SI.ENS ne compare pas deux colonnes ; SOMMEPROD oui." },
    { type: "input", q: "Compte les lignes où B2:B5 est supérieur à C2:C5.", a: ["=SOMMEPROD((B2:B5>C2:C5)*1)", "=SOMMEPROD(--(B2:B5>C2:C5))"], ph: "=SOMMEPROD((B2:B5>C2:C5)*1)", exp: "On compare colonne à colonne, ce que NB.SI.ENS ne sait pas faire." },
    { type: "vf", q: "SOMMEPROD ne fonctionne que dans Excel 365.", a: false, exp: "Elle fonctionne dans TOUTES les versions, sans validation matricielle spéciale." },
    { type: "qcm", q: "Pourquoi éviter A:A (colonne entière) dans SOMMEPROD ?", opts: ["C'est interdit", "Ça calcule sur toutes les lignes et peut ralentir", "Ça donne une erreur", "Aucune raison"], a: 1, exp: "Limite les plages (A2:A1000) pour les performances." },
    { type: "input", q: "Somme des montants C2:C50 uniquement pour le mois de mars (dates en A2:A50).", a: ["=SOMMEPROD((MOIS(A2:A50)=3)*(C2:C50))", "=SOMMEPROD((MOIS(A2:A50)=3)*C2:C50)"], ph: "=SOMMEPROD((MOIS(...)=3)*(...))", exp: "MOIS() calcule le mois à la volée dans le critère." },
    { type: "qcm", q: "SOMMEPROD(--(A2:A5=\"X\")) équivaut à quelle fonction plus simple ?", opts: ["SOMME", "NB.SI(A2:A5;\"X\")", "MOYENNE", "RECHERCHEV"], a: 1, exp: "C'est un comptage conditionnel, donc l'équivalent de NB.SI." },
    { type: "input", q: "Somme des montants C2:C5 pour Paris (A2:A5) ET Ventes (B2:B5).", a: ["=SOMMEPROD((A2:A5=\"Paris\")*(B2:B5=\"Ventes\")*(C2:C5))", "=SOMMEPROD((A2:A5=\"Paris\")*(B2:B5=\"Ventes\")*C2:C5)"], ph: "=SOMMEPROD((...)*(...)*(C2:C5))", exp: "Deux conditions + la colonne des montants." }
  ],
  final: {
    title: "Exercice final — Chiffre d'affaires pondéré",
    intro: `<p>Une table de ventes avec quantité et prix. On veut le chiffre d'affaires total, puis celui limité à certaines conditions, avec SOMMEPROD.</p>
<pre class="pseudo">      A          B      C        D
  1  Region     Qte    Prix     Promo
  2  Nord       10     5        Oui
  3  Sud        4      8        Non
  4  Nord       6      5        Oui
  5  Sud        3      8        Non</pre>
<p>Le CA d'une ligne = Qte × Prix. On veut le total, puis le CA du Nord, puis le nombre de lignes en promo.</p>`,
    questions: [
      { type: "input", q: "CA total = somme des (Qte × Prix) pour toutes les lignes (B2:B5, C2:C5).", a: ["=SOMMEPROD(B2:B5;C2:C5)"], ph: "=SOMMEPROD(...)", exp: "Produit terme à terme puis somme." },
      { type: "input", q: "Combien vaut ce CA total ?", a: ["136"], ph: "un nombre", exp: "10×5 + 4×8 + 6×5 + 3×8 = 50+32+30+24 = 136." },
      { type: "input", q: "CA du Nord uniquement (Region A2:A5).", a: ["=SOMMEPROD((A2:A5=\"Nord\")*(B2:B5)*(C2:C5))", "=SOMMEPROD((A2:A5=\"Nord\")*B2:B5*C2:C5)"], ph: "=SOMMEPROD((A2:A5=\"Nord\")*...)", exp: "La condition Nord (0/1) multiplie Qte×Prix." },
      { type: "input", q: "Nombre de lignes en promo (Promo=« Oui », D2:D5).", a: ["=SOMMEPROD(--(D2:D5=\"Oui\"))"], ph: "=SOMMEPROD(--(...))", exp: "-- convertit en 1/0, la somme compte les « Oui »." },
      { type: "qcm", q: "Pourquoi SOMMEPROD est-il pratique ici plutôt qu'une colonne CA + SOMME.SI ?", opts: ["Il est plus lent", "Il calcule Qte×Prix ET filtre en une seule formule, sans colonne intermédiaire", "Il se calcule plus vite", "Aucune raison"], a: 1, exp: "Pas besoin de colonne auxiliaire : tout se fait d'un coup." }
    ],
    solution: `<p>SOMMEPROD combine produit et filtre :</p>
<pre class="pseudo">CA total :
=SOMMEPROD(B2:B5 ; C2:C5)
-> 10*5 + 4*8 + 6*5 + 3*8 = 50 + 32 + 30 + 24 = 136

CA du Nord :
=SOMMEPROD((A2:A5="Nord") * (B2:B5) * (C2:C5))
   (A2:A5="Nord")   {1;0;1;0}
   *(B2:B5)*(C2:C5) garde Qte*Prix seulement pour le Nord
-> 10*5 + 6*5 = 80

Nombre de lignes en promo :
=SOMMEPROD(--(D2:D5="Oui"))
-> {1;0;1;0} -> 2</pre>
<p>À retenir : (condition) donne des 0/1, on les multiplie par les colonnes voulues. SOMMEPROD évite toute colonne intermédiaire et marche partout.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "excelpro-j06", lab: {"title":"À reproduire","intro":"Faire trois calculs d'un panier avec SOMMEPROD : total, total d'une catégorie, comptage conditionnel.","steps":"1) Saisis Eau Boisson 3 1, Pain Alim 1 2, Jus Boisson 4 2 (colonnes A=Article, B=Cat, C=Qte, D=Prix, à partir de la ligne 2).\n2) En F1 saisis ta formule (voir la consigne)\n3) En F2 saisis ta formule (voir la consigne)\n4) En F3 saisis ta formule (voir la consigne)","check":"F1=13 (3+2+8), F2=11 (Boissons : 3+8), F3=2 (Eau et Jus ont Qte>2)."}, title: "Total pondéré d'un panier", level: 3,
    statement: "Recopie ce panier. En F1, calcule le montant total (Qte × Prix, toutes lignes) avec SOMMEPROD. En F2, calcule uniquement le total des articles de la catégorie « Boisson ». En F3, compte les articles dont la quantité dépasse 2.<pre class=\"pseudo\">      A          B          C       D\n  1  Article    Categorie  Qte     Prix\n  2  Eau        Boisson    6       1\n  3  Pain       Epicerie   1       2\n  4  Jus        Boisson    2       3\n  5  Pates      Epicerie   3       2</pre>",

      "F3 : SOMMEPROD(--(C2:C5>2)) transforme les VRAI en 1 et compte."
