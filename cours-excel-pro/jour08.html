<script>
var DAY = {
  num: 8,
  title: "DECALER, INDIRECT et les plages dynamiques",
  subtitle: "Construire des plages qui bougent ou se désignent par du texte : puissant, mais à manier avec prudence.",
  theory: `
<h3>1. Les fonctions « volatiles » : de quoi parle-t-on ?</h3>
<p>DECALER et INDIRECT sont dites <strong>volatiles</strong> : elles se recalculent à chaque modification du classeur, même sans rapport. Utiles pour des <strong>plages dynamiques</strong>, mais gourmandes : on les emploie avec parcimonie. Elles existent dans <strong>toutes les versions</strong>. <span class="tag">365</span> Sur Excel moderne, préfère souvent les tableaux structurés ou les fonctions dynamiques (jour 7), plus simples et non volatiles.</p>

<h3>2. DECALER : une plage définie par un point de départ + un déplacement</h3>
<p><strong>DECALER</strong> (OFFSET) renvoie une référence obtenue en partant d'une cellule, puis en se déplaçant de N lignes et M colonnes, avec éventuellement une hauteur/largeur.</p>
<pre class="pseudo">=DECALER(depart ; lignes ; colonnes ; [hauteur] ; [largeur])
   depart     la cellule de reference
   lignes     de combien de lignes descendre (negatif = monter)
   colonnes   de combien de colonnes aller a droite (negatif = gauche)
   hauteur    (facultatif) nombre de lignes de la plage renvoyee
   largeur    (facultatif) nombre de colonnes</pre>
<pre class="pseudo">=DECALER(A1 ; 2 ; 1)
   A1     point de depart
   2      descend de 2 lignes  -> ligne 3
   1      avance de 1 colonne  -> colonne B
   // renvoie donc la valeur de B3</pre>

<h3>3. DECALER pour une plage qui s'étend automatiquement</h3>
<p>Combiné à NBVAL (qui compte les cellules non vides), DECALER crée une plage dont la <strong>hauteur suit</strong> le nombre de données : idéal pour une somme qui englobe les lignes ajoutées.</p>
<pre class="pseudo">=SOMME(DECALER(A2 ; 0 ; 0 ; NBVAL(A2:A1000) ; 1))
   DECALER(A2;0;0;hauteur;1)   plage partant de A2, hauteur = nb de valeurs
   NBVAL(A2:A1000)             compte les cellules remplies (la hauteur)
   // la somme s'ajuste quand on ajoute des lignes sous A</pre>
<div class="tip">Aujourd'hui, un simple <strong>tableau structuré</strong> (jour 1) fait la même chose sans volatilité : <code>=SOMME(Ventes[Montant])</code>. Réserve DECALER aux cas où le tableau structuré ne convient pas.</div>

<h3>4. INDIRECT : transformer du TEXTE en référence</h3>
<p><strong>INDIRECT</strong> prend une chaîne de texte (ex : « B3 » ou « Janvier!A1 ») et la traite comme une vraie référence. Cela permet de construire une adresse « à la volée ».</p>
<pre class="pseudo">=INDIRECT(texte_reference)
   // interprete le texte comme une reference de cellule/plage</pre>
<pre class="pseudo">=INDIRECT("B" & C1)
   "B" & C1   si C1 vaut 3, cela construit le texte "B3"
   INDIRECT   -> renvoie la valeur de la cellule B3
   // le numero de ligne est pilote par C1</pre>

<h3>5. INDIRECT pour référencer une autre FEUILLE par son nom</h3>
<p>Cas classique : une cellule contient un nom de feuille (« Janvier »), et on veut lire une valeur de cette feuille.</p>
<pre class="pseudo">=INDIRECT("'" & A1 & "'!B2")
   A1              contient le nom de la feuille (ex : Janvier)
   "'" ... "'!B2"  construit le texte 'Janvier'!B2
   // les apostrophes gerent les noms de feuille avec espaces
   // -> lit B2 de la feuille dont le nom est en A1</pre>
<div class="warn">Dangers d'INDIRECT : (1) elle est <strong>volatile</strong> (recalcul permanent). (2) Comme la référence est du texte, si tu <strong>renommes</strong> une feuille ou déplaces une cellule, INDIRECT ne suit PAS et peut casser sans prévenir. (3) Elle renvoie <code>#REF!</code> si le texte ne correspond à aucune référence valide.</div>

<h3>6. INDIRECT et les listes en cascade (aperçu)</h3>
<p>INDIRECT sert souvent à faire dépendre une liste déroulante d'une autre (ex : choisir un pays, puis une ville de ce pays). On en reparle au jour 13. L'idée : le nom d'une plage nommée est fourni par une cellule, et INDIRECT la « résout ».</p>
<pre class="pseudo">=INDIRECT(A1)   // si A1 vaut "France", renvoie la plage nommee "France"</pre>`,
  exercises: [
    { type: "qcm", q: "Que veut dire qu'une fonction est « volatile » ?", opts: ["Elle est instable et donne des erreurs", "Elle se recalcule à chaque modification du classeur", "Elle disparaît", "Elle ne marche qu'une fois"], a: 1, exp: "Recalcul permanent : coûteux sur gros fichiers." },
    { type: "input", q: "Écris DECALER qui part de A1, descend de 2 lignes et avance de 1 colonne (renvoie B3).", a: ["=DECALER(A1;2;1)"], ph: "=DECALER(...)", exp: "2 lignes + 1 colonne à partir de A1 = B3." },
    { type: "qcm", q: "Dans DECALER(A1;2;1), que valent respectivement 2 et 1 ?", opts: ["hauteur et largeur", "lignes à descendre et colonnes à droite", "deux valeurs à additionner", "des adresses"], a: 1, exp: "Décalage de 2 lignes et 1 colonne depuis A1." },
    { type: "input", q: "Écris DECALER qui renvoie une plage partant de A2, de hauteur NBVAL(A2:A1000) et 1 colonne.", a: ["=DECALER(A2;0;0;NBVAL(A2:A1000);1)"], ph: "=DECALER(A2;0;0;...;1)", exp: "Hauteur pilotée par NBVAL : plage extensible." },
    { type: "qcm", q: "À quoi sert NBVAL dans une plage dynamique avec DECALER ?", opts: ["À trier", "À compter les cellules non vides pour fixer la hauteur", "À convertir le texte en nombre", "À arrondir"], a: 1, exp: "NBVAL fournit la hauteur = nombre de données présentes." },
    { type: "qcm", q: "Que fait INDIRECT ?", opts: ["Elle additionne", "Elle transforme un texte en référence de cellule/plage", "Elle trie", "Elle compte"], a: 1, exp: "INDIRECT interprète une chaîne comme une vraie référence." },
    { type: "input", q: "Écris INDIRECT qui lit la cellule de la colonne B dont la ligne est dans C1 (ex : C1=3 → B3).", a: ["=INDIRECT(\"B\"&C1)"], ph: "=INDIRECT(\"B\"&C1)", exp: "On concatène « B » et le numéro de ligne C1." },
    { type: "vf", q: "INDIRECT est volatile : elle se recalcule en permanence.", a: true, exp: "Comme DECALER, à utiliser avec parcimonie." },
    { type: "vf", q: "Si tu renommes une feuille, INDIRECT(\"'\"&A1&\"'!B2\") continue de suivre automatiquement.", a: false, exp: "Non : la référence est du texte, elle ne suit pas le renommage." },
    { type: "input", q: "Écris INDIRECT qui lit B2 de la feuille dont le nom est en A1.", a: ["=INDIRECT(\"'\"&A1&\"'!B2\")"], ph: "=INDIRECT(\"'\"&A1&\"'!B2\")", exp: "On construit le texte 'NomFeuille'!B2." },
    { type: "qcm", q: "Que renvoie INDIRECT si le texte ne correspond à aucune référence valide ?", opts: ["0", "#REF!", "vide", "VRAI"], a: 1, exp: "Référence invalide → erreur #REF!." },
    { type: "qcm", q: "Aujourd'hui, quelle alternative non volatile à DECALER pour une plage extensible ?", opts: ["INDIRECT", "un tableau structuré (Ctrl+L)", "RECHERCHEV", "NON"], a: 1, exp: "Le tableau structuré s'étend seul, sans volatilité." },
    { type: "input", q: "Écris la somme d'une plage extensible partant de A2 (hauteur NBVAL(A2:A1000)) avec DECALER.", a: ["=SOMME(DECALER(A2;0;0;NBVAL(A2:A1000);1))"], ph: "=SOMME(DECALER(...))", exp: "DECALER fournit la plage, SOMME l'additionne." },
    { type: "vf", q: "INDIRECT est souvent utilisé pour les listes déroulantes en cascade.", a: true, exp: "Il résout le nom d'une plage fourni par une autre cellule." },
    { type: "qcm", q: "Pourquoi limiter l'usage de DECALER/INDIRECT sur un gros classeur ?", opts: ["Elles sont interdites", "Leur volatilité ralentit le recalcul", "Elles effacent des données", "Elles sont limitées à quelques centaines de cellules"], a: 1, exp: "Le recalcul permanent pèse sur les performances." }
  ],
  final: {
    title: "Exercice final — Lire la bonne feuille et sommer une plage extensible",
    intro: `<p>Un classeur a une feuille par mois (« Janvier », « Février »…). Sur une feuille de synthèse, A1 contient le nom du mois choisi. On veut lire une valeur de cette feuille, et sommer une colonne qui grandit.</p>
<pre class="pseudo">Feuille "Synthese" :
      A          B
  1  Janvier    (mois choisi)
  2  Total      (a calculer)

Sur chaque feuille mensuelle, le total du mois est en B2.
Sur "Synthese", la colonne D contient une liste de montants qui s'allonge.</pre>`,
    questions: [
      { type: "input", q: "En B2, lis la cellule B2 de la feuille dont le nom est en A1 (avec INDIRECT).", a: ["=INDIRECT(\"'\"&A1&\"'!B2\")"], ph: "=INDIRECT(\"'\"&A1&\"'!B2\")", exp: "On assemble 'Janvier'!B2 en texte, INDIRECT le résout." },
      { type: "qcm", q: "Si on renomme la feuille « Janvier » en « Jan », que se passe-t-il pour cette formule ?", opts: ["Elle se met à jour", "Elle renvoie #REF! car le texte ne correspond plus", "Rien", "Elle se supprime"], a: 1, exp: "INDIRECT ne suit pas les renommages : le texte devient invalide." },
      { type: "input", q: "Somme extensible de la colonne D à partir de D2 (hauteur = NBVAL(D2:D1000)) avec DECALER.", a: ["=SOMME(DECALER(D2;0;0;NBVAL(D2:D1000);1))"], ph: "=SOMME(DECALER(D2;0;0;...;1))", exp: "La hauteur suit le nombre de valeurs saisies." },
      { type: "qcm", q: "Quelle alternative plus simple et non volatile à cette somme extensible ?", opts: ["INDIRECT", "convertir D en tableau structuré et faire =SOMME(Table[Montant])", "RECHERCHEV", "aucune"], a: 1, exp: "Le tableau structuré s'étend tout seul, sans DECALER." },
      { type: "vf", q: "DECALER et INDIRECT sont volatiles et peuvent ralentir un gros classeur.", a: true, exp: "Leur recalcul permanent est coûteux : à réserver aux cas utiles." }
    ],
    solution: `<p>Deux usages classiques, à manier avec prudence :</p>
<pre class="pseudo">Lire une feuille par son nom :
=INDIRECT("'" & A1 & "'!B2")
   A1               le nom du mois (ex : Janvier)
   "'" & A1 & "'!B2"  construit le texte 'Janvier'!B2
   INDIRECT          resout ce texte en vraie reference
   // ATTENTION : casse si on renomme la feuille

Somme d'une plage extensible :
=SOMME(DECALER(D2 ; 0 ; 0 ; NBVAL(D2:D1000) ; 1))
   DECALER(D2;0;0;h;1)   plage a partir de D2, hauteur h
   NBVAL(D2:D1000)       h = nombre de cellules remplies
   // s'ajuste quand on ajoute des montants</pre>
<p>À retenir : puissant mais volatile et fragile (INDIRECT ne suit pas les renommages). Sur Excel moderne, préfère les tableaux structurés et les fonctions dynamiques quand c'est possible.</p>`
  }
};
</script>
