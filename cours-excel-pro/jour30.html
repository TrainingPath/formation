  theory: `
<h3>1. Trois outils, trois rôles</h3>
<p>VBA reste irremplaçable sur le poste de travail, mais il ne fonctionne ni dans le navigateur, ni dans le cloud, ni sur Mac de façon fiable. Microsoft 365 propose trois compléments qu'il faut savoir distinguer :</p>
<pre class="pseudo">Office Script    ' le "VBA du cloud" : automatise DANS Excel, en TypeScript
Power Automate   ' l'orchestrateur : declenche des actions ENTRE applications
Copilot          ' l'assistant IA : ecrit, resume et analyse en langage naturel</pre>
<h3>2. Office Scripts : le VBA du navigateur</h3>
<p>Un <strong>Office Script</strong> est un script d'automatisation écrit en <strong>TypeScript</strong> (un JavaScript typé), stocké dans <strong>OneDrive Entreprise</strong> ou SharePoint, et exécuté par Excel pour le web comme par Excel bureau.</p>
<p>Conditions d'accès : il faut un <strong>abonnement Microsoft 365 professionnel ou scolaire</strong> (Business Standard, E3, E5…). Les comptes Microsoft 365 <strong>personnels et familiaux ne donnent pas accès</strong> aux Office Scripts. Le ruban est <strong>Automatiser ▸ Nouveau script</strong> ou <strong>Automatiser ▸ Enregistrer les actions</strong>.</p>
<pre class="pseudo">Office Script                     VBA
TypeScript                        Basic
stocke dans OneDrive/SharePoint   stocke dans le classeur .xlsm
tourne dans Excel web et bureau   tourne uniquement sur le poste
appelable depuis Power Automate   non appelable depuis le cloud
pas d'acces aux autres logiciels  pilote Word, Outlook, le systeme de fichiers
pas de UserForm, pas d'evenement  UserForms et evenements disponibles</pre>
<p>Comme en VBA, un <strong>enregistreur d'actions</strong> génère le premier code. Structure d'un script :</p>
<pre class="pseudo">function main(workbook: ExcelScript.Workbook) {   // point d'entree obligatoire
  // workbook represente le classeur : tout part de lui
  let feuille = workbook.getWorksheet("Ventes");  // recupere la feuille par son nom
  let plage = feuille.getRange("A1:D100");        // cible une plage
  plage.getFormat().autofitColumns();             // ajuste la largeur des colonnes

  let cellule = feuille.getRange("F1");
  cellule.setValue("Total");                      // ecrit une valeur (equivaut a .Value)
  feuille.getRange("F2").setFormula("=SUM(D2:D100)");  // ecrit une formule

  let table = feuille.getTables()[0];             // premier tableau structure de la feuille
  table.getSort().apply([{ key: 3, ascending: false }]);  // trie sur la 4e colonne, desc
}</pre>
<div class="tip">Correspondance mentale rapide : <code>Range("A1").Value = 5</code> en VBA devient <code>feuille.getRange("A1").setValue(5)</code> en Office Script. La logique est identique, la syntaxe change : des <strong>getXxx()</strong> pour lire, des <strong>setXxx()</strong> pour écrire, et le point-virgule en fin d'instruction.</div>
<pre class="pseudo">// Boucle et condition en Office Script
let valeurs = feuille.getRange("A2:A50").getValues();   // lit tout d'un coup (rapide)
for (let i = 0; i &lt; valeurs.length; i++) {              // parcourt le tableau lu
  if (valeurs[i][0] &lt; 10) {                             // si la quantite est faible...
    feuille.getRange(i + 2, 1).getFormat().getFill()
           .setColor("FFC7CE");                         // ...fond rouge pale
  }
}</pre>
<div class="warn">Performance : lis et écris par <strong>blocs</strong> (<code>getValues()</code> / <code>setValues()</code>) plutôt que cellule par cellule. Chaque aller-retour avec le classeur coûte cher, encore plus dans le navigateur qu'en VBA.</div>
<h3>3. Power Automate : relier les applications</h3>
<p><strong>Power Automate</strong> (anciennement Microsoft Flow) est un service en ligne, à l'adresse <em>make.powerautomate.com</em>, qui exécute des <strong>flux</strong>. Un flux est une suite d'actions déclenchée par un événement.</p>
<pre class="pseudo">Vocabulaire
Declencheur (trigger)  ' l'evenement qui lance le flux : mail recu, heure, fichier ajoute
Action                 ' une etape : envoyer un mail, executer un script, creer une ligne
Connecteur             ' le module qui parle a une application (Excel, Outlook, Teams...)
Flux (flow)            ' declencheur + suite d'actions
Expression             ' une petite formule, ex. utcNow(), formatDateTime(...)</pre>
<pre class="pseudo">Types de flux
Flux automatise   ' declenche par un evenement (nouveau fichier dans un dossier)
Flux instantane   ' declenche par un bouton, a la demande
Flux planifie     ' declenche a heure fixe (tous les lundis a 7 h)
Flux de processus ' pilote par un formulaire metier</pre>
<p>Exemple concret de flux, en français dans l'interface :</p>
<pre class="pseudo">Declencheur : Periodicite - tous les lundis a 07:00
Action 1    : Excel Online > Executer le script  (le script consolide et met en forme)
Action 2    : Excel Online > Lister les lignes presentes dans un tableau
Action 3    : Condition - si le total &lt; objectif
Action 4    : Outlook > Envoyer un e-mail  (rapport en piece jointe)
Action 5    : Teams > Publier un message dans le canal Direction</pre>
<div class="tip">La combinaison gagnante : <strong>Office Script</strong> fait le travail <em>dans</em> le classeur, <strong>Power Automate</strong> le déclenche à heure fixe et distribue le résultat <em>hors</em> du classeur. Ce que VBA ne saura jamais faire depuis un serveur.</div>
<p>Licences : un usage standard est inclus dans la plupart des abonnements Microsoft 365 professionnels. Les <strong>connecteurs premium</strong> (SQL Server, Salesforce, HTTP…) et les flux <strong>de processus de bureau (RPA)</strong> exigent un plan Power Automate payant.</p>
<h3>4. Copilot dans Excel</h3>
<p><strong>Copilot</strong> est l'assistant à intelligence artificielle intégré à Microsoft 365. Dans Excel, il apparaît par le bouton <strong>Accueil ▸ Copilot</strong> et dialogue en français dans un volet latéral.</p>
<div class="warn">Copilot dans Excel n'est <strong>pas inclus</strong> dans un abonnement Microsoft 365 standard : il requiert la licence complémentaire <strong>Microsoft 365 Copilot</strong>, facturée par utilisateur et par mois, en plus de l'abonnement. Ne promets jamais Copilot à un client ou un collègue sans avoir vérifié sa licence.</div>
<p>Ce que Copilot sait faire dans Excel :</p>
<pre class="pseudo">"Ajoute une colonne qui calcule la marge en pourcentage"   -> propose la formule
"Quelles sont les 3 tendances principales de ces ventes ?" -> analyse et resume
"Cree un graphique du CA par region"                       -> insere le graphique
"Mets en surbrillance les valeurs superieures a la moyenne"-> MFC automatique
"Explique-moi cette formule"                               -> traduit en francais courant
"Cree un tableau croise dynamique par mois et par produit" -> genere le TCD</pre>
<p>Conditions techniques : les données doivent être dans un <strong>tableau structuré</strong> (Insertion ▸ Tableau) avec des en-têtes clairs, et le classeur doit être <strong>enregistré sur OneDrive ou SharePoint</strong> avec l'enregistrement automatique activé.</p>
<div class="warn">Trois précautions non négociables. <strong>Un.</strong> Copilot se trompe : il produit parfois des formules plausibles mais fausses. <strong>Vérifie toujours</strong> le résultat sur un cas dont tu connais la réponse. <strong>Deux.</strong> Confidentialité : ne soumets pas de données personnelles ou sensibles sans connaître la politique de ton organisation. <strong>Trois.</strong> Copilot ne remplace pas la compréhension : il accélère celui qui sait déjà ce qu'il veut, il égare celui qui ne sait pas.</div>
<h3>5. Bien formuler une demande à Copilot</h3>
<pre class="pseudo">Faible  : "analyse mes donnees"
Bonne   : "Dans le tableau tblVentes, calcule le CA moyen par region pour 2026
           et signale les regions sous la moyenne generale"
-> Precise : la source (nom du tableau), l'operation, le perimetre, le resultat attendu.</pre>
<h3>6. Que choisir, et quand ?</h3>
<pre class="pseudo">Besoin                                        Outil
Automatiser dans un classeur, sur mon poste   VBA
Piloter Word, Outlook, des fichiers locaux    VBA
Automatiser dans Excel web / cloud            Office Script
Executer a heure fixe sans ouvrir Excel       Power Automate (+ Office Script)
Reagir a un mail, un formulaire, un fichier   Power Automate
Notifier Teams, archiver, approuver           Power Automate
Explorer, resumer, rediger une formule        Copilot
Analyser des millions de lignes, publier      Power BI</pre>
<div class="tip">Ces outils ne se remplacent pas, ils s'empilent. Un projet mature ressemble souvent à : Power Query importe, un Office Script met en forme, Power Automate déclenche et distribue, Power BI visualise, Copilot aide à explorer. VBA garde le poste de travail.</div>`,

    intro: `<p>Chaque lundi matin, la direction veut recevoir par e-mail l'état des ventes de la semaine écoulée, et un message dans Teams si l'objectif n'est pas atteint. Le classeur <em>Ventes.xlsx</em> est sur SharePoint, alimenté en continu, avec un tableau structuré <strong>tblVentes</strong>.</p>
<pre class="pseudo">tblVentes : Date | Region | Vendeur | Montant
Objectif hebdomadaire : 50 000</pre>`,
    questions: [
      { type: "qcm", q: "Quel outil doit mettre en forme et calculer DANS le classeur, sans qu'Excel soit ouvert ?", opts: ["VBA", "Un Office Script", "Copilot", "Power Query"], a: 1, exp: "Un Office Script s'exécute côté cloud, appelé par Power Automate." },
      { type: "input", q: "Quel déclencheur Power Automate choisir pour un lancement tous les lundis à 7 h ?", a: ["Périodicité", "Recurrence", "périodicité", "Periodicite", "flux planifié"], ph: "P…", exp: "Le déclencheur Périodicité (Recurrence) crée un flux planifié." },
      { type: "input", q: "Quelle action Power Automate lance un Office Script sur le classeur ?", a: ["Exécuter le script", "Excel Online ▸ Exécuter le script", "Executer le script", "Run script"], ph: "Exécuter …", exp: "Excel Online (Business) ▸ Exécuter le script, en pointant le fichier et le script." },
      { type: "input", q: "Quelle est la signature obligatoire de la fonction principale d'un Office Script ?", a: ["function main(workbook: ExcelScript.Workbook)", "main(workbook: ExcelScript.Workbook)", "function main(workbook)"], ph: "function main(…", exp: "C'est le point d'entrée que Power Automate appelle." },
      { type: "qcm", q: "Que faut-il faire avant d'envoyer à la direction une analyse rédigée par Copilot ?", opts: ["Rien, l'IA est fiable", "Vérifier les chiffres sur un cas dont on connaît la réponse", "La traduire en anglais", "La convertir en PDF"], a: 1, exp: "Copilot peut produire des résultats plausibles mais faux : le contrôle humain reste obligatoire." }

    solution: `<p><strong>Étape 1 — L'Office Script.</strong> Dans Excel pour le web : <strong>Automatiser ▸ Nouveau script</strong>, nommé <em>RapportHebdo</em>.</p>
<pre class="pseudo">function main(workbook: ExcelScript.Workbook): number {   // renvoie le total au flux
  // --- recuperation de la feuille et du tableau ---
  let feuille = workbook.getWorksheet("Ventes");          // feuille de donnees
  let table = workbook.getTable("tblVentes");             // tableau structure

  // --- lecture en bloc : rapide, un seul aller-retour ---
  let donnees = table.getRangeBetweenHeaderAndTotal().getValues();

  // --- calcul du total de la semaine ecoulee ---
  let total = 0;                                          // accumulateur
  let limite = new Date();                                // date du jour
  limite.setDate(limite.getDate() - 7);                   // il y a 7 jours

  for (let i = 0; i &lt; donnees.length; i++) {              // parcourt chaque ligne
    let dateLigne = new Date(Math.round((Number(donnees[i][0]) - 25569) * 86400000));
    if (dateLigne >= limite) {                            // si la vente est recente...
      total += Number(donnees[i][3]);                     // ...on cumule le montant
    }
  }

  // --- ecriture du resultat et mise en forme ---
  feuille.getRange("G1").setValue("Total semaine");       // etiquette
  feuille.getRange("G2").setValue(total);                 // valeur calculee
  feuille.getRange("G2").setNumberFormat("# ##0 EUR");     // format monetaire
  table.getRange().getFormat().autofitColumns();           // colonnes ajustees

  return total;   // le total est renvoye : Power Automate pourra le tester
}</pre>
<p><strong>Étape 2 — Le flux Power Automate</strong> (sur make.powerautomate.com, <em>Créer ▸ Flux de cloud planifié</em>) :</p>
<pre class="pseudo">DECLENCHEUR
  Periodicite : toutes les 1 semaine, le lundi, a 07:00, fuseau Bruxelles

ACTION 1  Excel Online (Business) > Executer le script
  Emplacement : SharePoint       Bibliotheque : Documents
  Fichier : /Ventes/Ventes.xlsx  Script : RapportHebdo
  -> sortie disponible : result (le total renvoye par le script)

ACTION 2  Outlook > Envoyer un e-mail (V2)
  A       : direction@societe.be
  Objet   : Rapport hebdomadaire des ventes
  Corps   : Total de la semaine : @{outputs('Executer_le_script')?['body/result']} EUR
  Piece jointe : le classeur (action SharePoint > Obtenir le contenu du fichier)

ACTION 3  Controle > Condition
  Si  result  est inferieur a  50000
     SI OUI  -> Microsoft Teams > Publier un message dans un canal
                Canal : Direction
                Message : Alerte - objectif hebdomadaire non atteint (total ci-dessus)
     SI NON  -> ne rien faire</pre>
<p><strong>Étape 3 — L'apport de Copilot.</strong> Une fois le rapport reçu, ouvre le classeur et demande dans le volet Copilot : « <em>Dans tblVentes, compare le CA de cette semaine à la moyenne des huit semaines précédentes, par région, et signale les régions en baisse</em> ». Copilot produit l'analyse en quelques secondes — puis <strong>tu la vérifies</strong> sur une région dont tu connais les chiffres avant de la transmettre.</p>
<p><strong>Pourquoi pas VBA ?</strong> Une macro VBA aurait exigé qu'un poste reste allumé, Excel ouvert et le fichier déverrouillé chaque lundi à 7 h. Le trio Office Script + Power Automate + Copilot fait le même travail côté serveur, sans intervention humaine — à condition d'avoir les licences correspondantes.</p>`

    solution: "// ==================== OFFICE SCRIPT : ControleStock ====================\n// Excel pour le web > Automatiser > Nouveau script\n\nfunction main(workbook: ExcelScript.Workbook): number {\n  // Le type de retour number permet a Power Automate de recuperer le compteur\n\n  // --- 1. Recuperation des objets de travail ---\n  let feuille = workbook.getWorksheet(\"Stock\");        // la feuille de donnees\n  let table = workbook.getTable(\"tblStock\");           // le tableau structure\n  let corps = table.getRangeBetweenHeaderAndTotal();   // les lignes sans l'en-tete\n\n  // --- 2. Lecture EN BLOC (un seul aller-retour : performance) ---\n  let donnees = corps.getValues();                     // tableau a deux dimensions\n  let nbRuptures = 0;                                  // compteur d'articles en rupture\n\n  // --- 3. Remise a zero des couleurs precedentes ---\n  corps.getFormat().getFill().clear();                 // repart d'un fond neutre\n\n  // --- 4. Parcours ligne par ligne ---\n  for (let i = 0; i < donnees.length; i++) {\n    let quantite = Number(donnees[i][1]);              // colonne 2 : Quantite\n    let seuil = Number(donnees[i][2]);                 // colonne 3 : Seuil\n\n    if (quantite < seuil) {                            // article en rupture ?\n      corps.getRow(i).getFormat().getFill()\n           .setColor(\"FFC7CE\");                        // rouge pale sur toute la ligne\n      nbRuptures++;                                    // on incremente le compteur\n    }\n  }\n\n  // --- 5. Restitution du resultat dans la feuille ---\n  feuille.getRange(\"F1\").setValue(\"Articles en rupture\");   // etiquette\n  feuille.getRange(\"F2\").setValue(nbRuptures);              // valeur calculee\n  feuille.getRange(\"F1:F2\").getFormat().autofitColumns();   // colonne ajustee\n  table.getRange().getFormat().autofitColumns();            // tableau ajuste\n\n  // --- 6. Renvoi au flux appelant ---\n  return nbRuptures;                                   // exploitable dans Power Automate\n}\n\n// ==================== FLUX POWER AUTOMATE ====================\n// make.powerautomate.com > Creer > Flux de cloud planifie\n//\n// DECLENCHEUR\n//   Periodicite : tous les jours a 06:30, fuseau horaire Bruxelles\n//\n// ACTION 1 : Excel Online (Business) > Executer le script\n//   Emplacement  : SharePoint\n//   Bibliotheque : Documents\n//   Fichier      : /Logistique/Stock.xlsx\n//   Script       : ControleStock\n//   -> sortie disponible : result  (le nombre renvoye par le script)\n//\n// ACTION 2 : Controle > Condition\n//   Si  result  est superieur a  0\n//\n//   SI OUI :\n//     2a. SharePoint > Obtenir le contenu du fichier  (Stock.xlsx)\n//     2b. Outlook > Envoyer un e-mail (V2)\n//         A      : achats@societe.be\n//         Objet  : Alerte stock - @{outputs('Executer_le_script')?['body/result']} article(s) en rupture\n//         Corps  : Les lignes concernees sont surlignees en rouge dans le fichier joint.\n//         Piece jointe : le contenu obtenu en 2a\n//     2c. Microsoft Teams > Publier un message dans un canal (canal Logistique)\n//\n//   SI NON :\n//     ne rien faire  -> pas de mail inutile les jours ou tout va bien\n\nResultat attendu :\n   tblStock contient 40 articles, 3 sous leur seuil\n   -> 3 lignes en rouge pale, F2 affiche 3\n   -> un mail part vers achats@societe.be avec le classeur en piece jointe\n   -> aucune notification les jours sans rupture",
