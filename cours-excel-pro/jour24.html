<script>
var DAY = {
  num: 24,
  title: "Conditions et boucles en VBA",
  subtitle: "Faire prendre des décisions au code et répéter des actions sans effort.",
  theory: `
<h3>1. Pourquoi conditions et boucles ?</h3>
<p>Un code linéaire fait toujours la même chose. Pour qu'il <em>décide</em> (« si la note est &lt; 10, écris Échec ») et qu'il <em>répète</em> (« pour chaque ligne du tableau… »), il faut deux outils fondamentaux : les <strong>conditions</strong> et les <strong>boucles</strong>. Ce sont les mêmes idées qu'en algorithmique, ici en syntaxe VBA.</p>
<h3>2. La condition If … Then … Else</h3>
<p>Une <strong>condition</strong> exécute des instructions <em>seulement si</em> un test est vrai. Structure :</p>
<pre class="pseudo">If note >= 10 Then                 ' SI la condition est vraie...
    Range("B1").Value = "Reussi"   '   ...on fait ceci
Else                               ' SINON...
    Range("B1").Value = "Echec"    '   ...on fait cela
End If                             ' fin de la condition</pre>
<p>Pour plusieurs cas, on enchaîne avec <strong>ElseIf</strong> :</p>
<pre class="pseudo">If note >= 16 Then
    mention = "Bien"
ElseIf note >= 10 Then             ' SINON SI (teste un autre cas)
    mention = "Passable"
Else
    mention = "Insuffisant"
End If</pre>
<div class="tip">Les opérateurs de comparaison : <code>=</code> égal, <code>&lt;&gt;</code> différent, <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>. Pour combiner des tests : <strong>And</strong> (et), <strong>Or</strong> (ou), <strong>Not</strong> (non). Ex. <code>If age &gt;= 18 And actif Then</code>.</div>
<h3>3. La boucle For … Next : répéter un nombre connu de fois</h3>
<p>La <strong>boucle For</strong> répète un bloc en faisant varier un <strong>compteur</strong> de i (départ) à une valeur finale, par pas de 1 :</p>
<pre class="pseudo">Dim i As Integer                   ' le compteur de boucle
For i = 1 To 5                     ' i prend les valeurs 1, 2, 3, 4, 5
    Cells(i, 1).Value = i * 10     ' ecrit 10, 20, 30, 40, 50 en A1..A5
Next i                             ' passe a la valeur suivante de i</pre>
<div class="tip">C'est ici que <strong>Cells(i, 1)</strong> brille : à chaque tour, <code>i</code> change, donc la cellule ciblée descend d'une ligne. On parcourt ainsi une colonne entière. On peut ajouter <code>Step 2</code> pour avancer de 2 en 2, ou <code>Step -1</code> pour compter à rebours.</div>
<h3>4. Parcourir jusqu'à la dernière ligne remplie</h3>
<p>On ne connaît pas toujours le nombre de lignes. On calcule la <strong>dernière ligne utilisée</strong> d'une colonne, puis on boucle jusqu'à elle :</p>
<pre class="pseudo">Dim derniere As Long               ' Long = grand entier (pour de gros tableaux)
derniere = Cells(Rows.Count, 1).End(xlUp).Row   ' derniere ligne remplie de la colonne A
Dim i As Long
For i = 2 To derniere              ' de la ligne 2 (apres l'en-tete) jusqu'a la fin
    Cells(i, 3).Value = Cells(i, 1).Value * Cells(i, 2).Value   ' colonne C = A x B
Next i</pre>
<h3>5. La boucle Do … Loop : répéter tant qu'une condition tient</h3>
<pre class="pseudo">Dim i As Long
i = 2
Do While Cells(i, 1).Value <> ""   ' TANT QUE la cellule n'est pas vide...
    Cells(i, 2).Value = "OK"       '   ...on agit
    i = i + 1                      '   ...et on descend d'une ligne (sinon boucle infinie !)
Loop                               ' on remonte tester la condition</pre>
<div class="warn">Danger n°1 des boucles : la <strong>boucle infinie</strong>. Dans un Do While, si rien ne fait avancer la condition vers Faux (ici <code>i = i + 1</code>), le code tourne sans fin. En cas de blocage, <strong>Ctrl+Pause (Ctrl+Break)</strong> interrompt l'exécution.</div>
<h3>6. La boucle For Each : parcourir une collection</h3>
<p><strong>For Each</strong> parcourt chaque élément d'un ensemble (les cellules d'une plage, les feuilles d'un classeur) sans gérer d'indice :</p>
<pre class="pseudo">Dim c As Range                     ' c representera tour a tour chaque cellule
For Each c In Range("A1:A10")      ' pour chaque cellule de la plage...
    If c.Value < 0 Then            '   si sa valeur est negative...
        c.Interior.Color = 255     '   ...la colorer en rouge (255 = rouge)
    End If
Next c                             ' cellule suivante</pre>
<div class="tip">Combiner <strong>boucle</strong> (parcourir) et <strong>condition</strong> (décider au cas par cas) est le cœur de presque toutes les macros utiles : « pour chaque ligne, si telle valeur, alors telle action ».</div>`,
  exercises: [
    { type: "qcm", q: "Une condition If … Then sert à…", opts: ["Répéter une action", "Exécuter des instructions seulement si un test est vrai", "Déclarer une variable", "Colorer une cellule"], a: 1, exp: "If teste une condition et exécute le bloc seulement si elle est vraie." },
    { type: "input", q: "Quels deux mots-clés ferment une condition et le sinon ? (l'un ferme, l'autre = sinon)", a: ["End If", "end if", "Else et End If", "Else, End If"], ph: "…", exp: "Else introduit le sinon ; End If ferme la condition." },
    { type: "input", q: "Quel mot-clé teste un cas supplémentaire (sinon si) dans un If ?", a: ["ElseIf", "elseif", "Else If"], ph: "un mot", exp: "ElseIf ajoute un cas intermédiaire entre If et Else." },
    { type: "qcm", q: "Quel opérateur VBA signifie « différent de » ?", opts: ["!=", "<>", "==", "=/="], a: 1, exp: "En VBA, « différent » s'écrit <> (le != c'est d'autres langages)." },
    { type: "input", q: "Écris l'en-tête d'une boucle qui fait varier i de 1 à 5.", a: ["For i = 1 To 5", "for i = 1 to 5", "For i=1 To 5"], ph: "For …", exp: "For i = 1 To 5 fait prendre à i les valeurs 1 à 5." },
    { type: "qcm", q: "Quel mot-clé referme une boucle For ?", opts: ["End For", "Next", "Loop", "End If"], a: 1, exp: "Next (souvent Next i) referme la boucle For." },
    { type: "qcm", q: "Que fait Cells(i, 1) quand i varie dans une boucle ?", opts: ["Rien", "Cible une cellule différente de la colonne A à chaque tour", "Toujours A1", "Une erreur"], a: 1, exp: "i change la ligne : on parcourt la colonne A ligne par ligne." },
    { type: "input", q: "Ajoute à une boucle For le fragment qui la fait avancer de 2 en 2.", a: ["Step 2", "step 2"], ph: "…", exp: "For i = 1 To 10 Step 2 avance par pas de 2." },
    { type: "vf", q: "Dans un Do While, oublier de faire avancer la condition provoque une boucle infinie.", a: true, exp: "Sans i = i + 1 (ou équivalent), la condition reste vraie pour toujours." },
    { type: "input", q: "Quel raccourci interrompt une macro bloquée dans une boucle infinie ?", a: ["Ctrl+Pause", "Ctrl+Break", "ctrl+pause", "ctrl+break", "Ctrl + Pause", "Ctrl + Break"], ph: "Ctrl+…", exp: "Ctrl+Pause (Ctrl+Break) stoppe l'exécution." },
    { type: "qcm", q: "Do While Cells(i,1).Value <> \"\" boucle…", opts: ["10 fois", "tant que la cellule n'est pas vide", "une seule fois", "jamais"], a: 1, exp: "La boucle continue tant que la cellule courante contient quelque chose." },
    { type: "qcm", q: "For Each c In Range(\"A1:A10\") sert à…", opts: ["Compter jusqu'à 10", "Parcourir chaque cellule de la plage sans gérer d'indice", "Trier la plage", "Supprimer la plage"], a: 1, exp: "For Each parcourt les éléments d'une collection un à un." },
    { type: "input", q: "Complète : la dernière ligne remplie de la colonne A = Cells(Rows.Count, 1).____.Row", a: ["End(xlUp)", "End(xlup)", "end(xlUp)"], ph: "…", exp: "End(xlUp) remonte depuis le bas jusqu'à la dernière cellule remplie." },
    { type: "vf", q: "And, Or et Not permettent de combiner plusieurs conditions.", a: true, exp: "Ex. If age >= 18 And actif Then combine deux tests." },
    { type: "input", q: "Écris la condition VBA : si note est inférieure à 10, sur une ligne d'en-tête If.", a: ["If note < 10 Then", "if note < 10 then", "If note<10 Then"], ph: "If …", exp: "If note < 10 Then ouvre la condition." }
  ],
  final: {
    title: "Exercice final — Étiqueter des résultats en boucle",
    intro: `<p>La colonne A (à partir de la ligne 2) contient des notes. Pour chaque note, on veut écrire en colonne B « Reussi » si elle vaut 10 ou plus, sinon « Echec », jusqu'à la dernière note saisie.</p>
<pre class="pseudo">      A        B
  1  Note     Resultat
  2  14       (a remplir)
  3  8        (a remplir)
  4  17       ...</pre>`,
    questions: [
      { type: "input", q: "Calcule la dernière ligne remplie de la colonne A dans une variable derniere.", a: ["derniere = Cells(Rows.Count, 1).End(xlUp).Row", "derniere = Cells(Rows.Count,1).End(xlUp).Row", "derniere=Cells(Rows.Count, 1).End(xlUp).Row"], ph: "derniere = …", exp: "Cells(Rows.Count, 1).End(xlUp).Row donne la dernière ligne utilisée." },
      { type: "input", q: "Écris l'en-tête de boucle qui parcourt de la ligne 2 à derniere.", a: ["For i = 2 To derniere", "for i = 2 to derniere", "For i=2 To derniere"], ph: "For …", exp: "For i = 2 To derniere saute l'en-tête et va jusqu'au bout." },
      { type: "input", q: "Écris la condition testant si la note de la ligne i (colonne A) est >= 10.", a: ["If Cells(i, 1).Value >= 10 Then", "If Cells(i,1).Value >= 10 Then", "if cells(i, 1).value >= 10 then"], ph: "If …", exp: "Cells(i, 1).Value >= 10 teste la note de la ligne courante." },
      { type: "input", q: "Écris la ligne qui met « Reussi » en colonne B de la ligne i.", a: ["Cells(i, 2).Value = \"Reussi\"", "Cells(i,2).Value = \"Reussi\"", "cells(i, 2).value = \"reussi\""], ph: "Cells(i, 2)…", exp: "Cells(i, 2).Value = \"Reussi\" écrit le résultat en colonne B." },
      { type: "qcm", q: "Quel mot-clé referme la boucle après le End If ?", opts: ["Loop", "Next i", "End Sub", "End For"], a: 1, exp: "Next i passe à la ligne suivante et referme la boucle For." }
    ],
    solution: `<p>La macro complète, combinant boucle et condition :</p>
<pre class="pseudo">Sub Etiqueter()
    Dim derniere As Long                          ' derniere ligne remplie
    Dim i As Long                                 ' compteur de boucle
    derniere = Cells(Rows.Count, 1).End(xlUp).Row ' derniere note de la colonne A

    For i = 2 To derniere                         ' de la ligne 2 (apres l'en-tete) a la fin
        If Cells(i, 1).Value >= 10 Then           ' SI la note >= 10...
            Cells(i, 2).Value = "Reussi"          '   ...ecrire Reussi en colonne B
        Else                                      ' SINON...
            Cells(i, 2).Value = "Echec"           '   ...ecrire Echec
        End If                                     ' fin de la condition
    Next i                                         ' note suivante
End Sub</pre>
<p>Pour les notes 14, 8, 17, la colonne B affichera Reussi, Echec, Reussi. Le duo <strong>For</strong> (parcourir toutes les lignes) + <strong>If/Else</strong> (décider ligne par ligne) est le patron de la majorité des macros de traitement de données.</p>`
  }
};
</script>

    solution: "Option Explicit\n\nSub CalculerPrime()\n    Dim derniere As Long                          ' derniere ligne remplie de la colonne A\n    Dim i As Long                                 ' compteur de boucle\n    derniere = Cells(Rows.Count, 1).End(xlUp).Row ' calcule la fin du tableau\n\n    For i = 2 To derniere                         ' parcourt chaque vendeur\n        If Cells(i, 1).Value > 1000 Then          ' SI le CA depasse 1000...\n            Cells(i, 2).Value = Cells(i, 1).Value * 0.1   ' prime = 10 % du CA\n            Cells(i, 2).Interior.Color = 5296274  ' fond vert pour les primes a 10 %\n        Else                                      ' SINON...\n            Cells(i, 2).Value = Cells(i, 1).Value * 0.05  ' prime = 5 % du CA\n        End If                                     ' fin de la condition\n    Next i                                         ' vendeur suivant\nEnd Sub\n\nResultat attendu :\n   CA 1500 -> prime 150 (cellule verte)\n   CA 800  -> prime 40  (fond normal)\n   CA 2000 -> prime 200 (cellule verte)",
    note: "Patron classique : For (parcourir les lignes) + If/Else (decider). Cells(i, c) permet de viser la bonne ligne a chaque tour. Le separateur decimal dans le code est le point (0.1)." }
  ]
};
