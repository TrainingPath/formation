<body>
<script>
var DAY = {
  num: 25,
  title: "Créer des macros utiles (formulaires, événements)",
  subtitle: "Passer du code qui s'exécute à la demande à une application Excel qui réagit toute seule.",
  theory: `
<h3>1. Trois façons de déclencher une macro</h3>
<p>Jusqu'ici tu lançais tes macros par <strong>Développeur ▸ Macros ▸ Exécuter</strong>. Une macro <em>utile</em> se déclenche autrement : par un <strong>bouton</strong> posé sur la feuille, par un <strong>formulaire</strong> (UserForm) que l'utilisateur remplit, ou toute seule par un <strong>événement</strong> (ouverture du classeur, modification d'une cellule).</p>
<p>Rappel : l'onglet <strong>Développeur</strong> n'est pas affiché par défaut. On l'active par <strong>Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur</strong>. L'éditeur de code s'ouvre par <strong>Développeur ▸ Visual Basic</strong> ou <strong>Alt+F11</strong>.</p>
<h3>2. Le classeur .xlsm : indispensable</h3>
<p>Un classeur <strong>.xlsx</strong> ne peut <em>pas</em> contenir de macros : si tu enregistres du code dedans, Excel le supprime sans pitié. Il faut choisir <strong>Fichier ▸ Enregistrer sous ▸ Classeur Excel (prenant en charge les macros) (*.xlsm)</strong>. Le <strong>.xlsm</strong> est donc un classeur normal qui accepte en plus un projet VBA.</p>
<div class="warn">Le format <strong>.xlsb</strong> (binaire) accepte aussi les macros. Le <strong>.xlsx</strong> jamais. Si tes macros « disparaissent » après fermeture, c'est presque toujours ce piège.</div>
<h3>3. Un bouton pour lancer la macro</h3>
<p>Le déclencheur le plus simple : <strong>Développeur ▸ Insérer ▸ Contrôles de formulaire ▸ Bouton</strong>. On dessine le bouton sur la feuille, Excel demande aussitôt quelle macro lui affecter. Un clic droit sur le bouton permet ensuite <strong>Modifier le texte</strong> ou <strong>Affecter une macro</strong>.</p>
<div class="tip">Deux familles de contrôles cohabitent. Les <strong>contrôles de formulaire</strong> (simples, on leur affecte une macro) et les <strong>contrôles ActiveX</strong> (plus riches : ils ont des propriétés et déclenchent des événements comme <code>CommandButton1_Click</code>). Pour un bouton « lance ma macro », les contrôles de formulaire suffisent et sont plus stables.</div>
<h3>4. Le UserForm : une vraie boîte de dialogue</h3>
<p>Un <strong>UserForm</strong> (formulaire utilisateur) est une fenêtre que tu dessines toi-même : zones de saisie, listes, boutons. C'est l'interface de ton mini-programme. Elle évite que l'utilisateur tape n'importe quoi directement dans les cellules.</p>
<p>Création : dans l'éditeur VBA, <strong>Insertion ▸ UserForm</strong>. La <strong>Boîte à outils</strong> apparaît ; on y glisse des contrôles sur le formulaire :</p>
<pre class="pseudo">TextBox    ' zone de texte : l'utilisateur tape une valeur
Label      ' etiquette : texte fixe qui explique la zone
ComboBox   ' liste deroulante : on choisit dans une liste
CheckBox   ' case a cocher : vrai / faux
CommandButton  ' bouton qui declenche du code</pre>
<p>Chaque contrôle a un <strong>nom</strong> (propriété <code>Name</code>, ex. <code>txtNom</code>) visible dans la fenêtre <strong>Propriétés (F4)</strong>. C'est par ce nom qu'on lit sa valeur dans le code.</p>
<pre class="pseudo">Private Sub cmdValider_Click()        ' code execute au clic sur le bouton Valider
    Dim derniere As Long
    derniere = Cells(Rows.Count, 1).End(xlUp).Row + 1  ' premiere ligne libre
    Cells(derniere, 1).Value = txtNom.Value     ' recopie la zone de texte en colonne A
    Cells(derniere, 2).Value = txtCA.Value      ' et la seconde zone en colonne B
    txtNom.Value = ""                  ' vide la zone pour la saisie suivante
    txtCA.Value = ""
End Sub

Private Sub cmdFermer_Click()         ' clic sur le bouton Fermer
    Unload Me                          ' ferme et decharge le formulaire de la memoire
End Sub</pre>
<p>Pour afficher le formulaire depuis une macro classique :</p>
<pre class="pseudo">Sub OuvrirSaisie()
    frmSaisie.Show      ' affiche le UserForm nomme frmSaisie
End Sub</pre>
<div class="tip"><strong>Me</strong> désigne le formulaire lui-même dans son propre code. <code>Unload Me</code> le ferme et libère la mémoire ; <code>Me.Hide</code> le masque seulement (les valeurs saisies restent lisibles).</div>
<h3>5. Valider la saisie</h3>
<p>Un formulaire sans contrôle de saisie ne sert à rien. On teste avant d'écrire :</p>
<pre class="pseudo">If Trim(txtNom.Value) = "" Then                 ' Trim enleve les espaces autour
    MsgBox "Le nom est obligatoire.", vbExclamation   ' message d'alerte
    txtNom.SetFocus                              ' remet le curseur dans la zone
    Exit Sub                                     ' sort de la procedure sans ecrire
End If
If Not IsNumeric(txtCA.Value) Then              ' IsNumeric teste si c'est un nombre
    MsgBox "Le CA doit etre un nombre.", vbCritical
    Exit Sub
End If</pre>
<h3>6. Les événements : du code qui se lance tout seul</h3>
<p>Un <strong>événement</strong> est un fait qui se produit dans Excel (on ouvre le classeur, on change une cellule, on change de feuille). VBA permet d'attacher une procédure à cet événement : elle s'exécutera <em>automatiquement</em>. On ne l'écrit pas dans un module standard, mais dans le <strong>module de la feuille</strong> ou dans <strong>ThisWorkbook</strong> (double-clic dessus dans l'explorateur de projet).</p>
<p>Événements de classeur, dans <strong>ThisWorkbook</strong> :</p>
<pre class="pseudo">Private Sub Workbook_Open()                 ' a chaque ouverture du classeur
    Worksheets("Accueil").Activate           ' revient toujours sur la feuille Accueil
    MsgBox "Bienvenue !", vbInformation
End Sub

Private Sub Workbook_BeforeSave(ByVal SaveAsUI As Boolean, Cancel As Boolean)
    Range("Z1").Value = Now                  ' horodate le classeur avant enregistrement
End Sub</pre>
<p>Événements de feuille, dans le module de la feuille concernée :</p>
<pre class="pseudo">Private Sub Worksheet_Change(ByVal Target As Range)   ' une cellule vient d'etre modifiee
    If Target.Column = 1 Then                        ' Target = la cellule modifiee
        Application.EnableEvents = False              ' coupe les evenements (anti-boucle)
        Target.Offset(0, 1).Value = Now               ' horodate a droite de la saisie
        Application.EnableEvents = True               ' remet les evenements
    End If
End Sub

Private Sub Worksheet_SelectionChange(ByVal Target As Range)  ' on change de selection
    Range("A1").Value = "Vous etes en " &amp; Target.Address
End Sub</pre>
<div class="warn">Piège classique : dans <strong>Worksheet_Change</strong>, écrire dans une cellule déclenche… un nouveau <strong>Worksheet_Change</strong>. D'où la boucle infinie. On l'évite avec <code>Application.EnableEvents = False</code> avant l'écriture et <code>= True</code> après. Si Excel semble « ne plus réagir aux événements », c'est souvent qu'un plantage a laissé EnableEvents à False : relance-le à la main dans la fenêtre Exécution (Ctrl+G).</div>
<h3>7. Rendre l'exécution propre et rapide</h3>
<pre class="pseudo">Application.ScreenUpdating = False   ' fige l'ecran : la macro va beaucoup plus vite
Application.DisplayAlerts = False    ' supprime les demandes de confirmation
' ... traitement ...
Application.DisplayAlerts = True     ' TOUJOURS remettre a True
Application.ScreenUpdating = True    ' TOUJOURS remettre a True</pre>
<div class="tip">Le trio gagnant d'une macro « produit fini » : un <strong>bouton ou un formulaire</strong> pour la lancer, des <strong>tests de saisie</strong> pour éviter les erreurs, et des <strong>événements</strong> pour les automatismes discrets. Le tout enregistré en <strong>.xlsm</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Quel format de fichier faut-il pour conserver des macros ?", opts: [".xlsx", ".xlsm", ".csv", ".pdf"], a: 1, exp: "Le .xlsm (prenant en charge les macros) conserve le projet VBA ; le .xlsx supprime le code." },
    { type: "input", q: "Comment appelle-t-on la fenêtre personnalisée que l'on dessine soi-même en VBA (zones de saisie, boutons) ?", a: ["UserForm", "userform", "un UserForm", "Formulaire utilisateur"], ph: "un mot", exp: "Le UserForm est une boîte de dialogue personnalisée, créée par Insertion ▸ UserForm." },
    { type: "qcm", q: "Où écrit-on la procédure Workbook_Open ?", opts: ["Dans un module standard", "Dans le module ThisWorkbook", "Dans le module d'une feuille", "Dans un UserForm"], a: 1, exp: "Les événements de classeur vivent dans ThisWorkbook." },
    { type: "input", q: "Quelle instruction affiche le formulaire nommé frmSaisie ?", a: ["frmSaisie.Show", "frmsaisie.show", "frmSaisie.Show()"], ph: "frmSaisie…", exp: ".Show affiche le UserForm à l'écran." },
    { type: "input", q: "Quelle instruction ferme le formulaire courant et le décharge de la mémoire ?", a: ["Unload Me", "unload me", "Unload me"], ph: "Unload …", exp: "Unload Me ferme le formulaire ; Me.Hide se contente de le masquer." },
    { type: "vf", q: "Un événement est du code qui se déclenche automatiquement quand quelque chose se produit dans Excel.", a: true, exp: "Ouverture du classeur, modification d'une cellule, changement de sélection : autant d'événements." },
    { type: "qcm", q: "Dans Worksheet_Change, que représente Target ?", opts: ["La feuille entière", "La cellule (ou plage) qui vient d'être modifiée", "Le classeur", "Le bouton cliqué"], a: 1, exp: "Target est la plage modifiée qui a déclenché l'événement." },
    { type: "input", q: "Quelle propriété faut-il mettre à False pour éviter qu'un Worksheet_Change se rappelle lui-même ?", a: ["Application.EnableEvents", "EnableEvents", "application.enableevents"], ph: "Application…", exp: "Application.EnableEvents = False suspend les événements le temps de l'écriture." },
    { type: "qcm", q: "Quelle propriété accélère une macro en figeant l'affichage ?", opts: ["Application.DisplayAlerts", "Application.ScreenUpdating", "Application.Calculation", "Application.Visible"], a: 1, exp: "ScreenUpdating = False empêche Excel de redessiner l'écran à chaque instruction." },
    { type: "input", q: "Quelle fonction VBA teste si une valeur saisie est bien un nombre ?", a: ["IsNumeric", "isnumeric", "IsNumeric()"], ph: "Is…", exp: "IsNumeric(valeur) renvoie True si la valeur peut être interprétée comme un nombre." },
    { type: "vf", q: "Les contrôles ActiveX et les contrôles de formulaire sont exactement la même chose.", a: false, exp: "Les contrôles de formulaire reçoivent une macro affectée ; les ActiveX ont des propriétés et leurs propres événements." },
    { type: "qcm", q: "Quel chemin du ruban affiche l'onglet Développeur ?", opts: ["Accueil ▸ Développeur", "Fichier ▸ Options ▸ Personnaliser le ruban", "Insertion ▸ Compléments", "Données ▸ Outils"], a: 1, exp: "Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur." },
    { type: "input", q: "Quel mot-clé désigne le formulaire lui-même à l'intérieur de son propre code ?", a: ["Me", "me"], ph: "deux lettres", exp: "Me désigne l'objet courant : le UserForm dans son module." },
    { type: "qcm", q: "cmdValider_Click est le nom d'une procédure qui s'exécute…", opts: ["à l'ouverture du classeur", "au clic sur le bouton nommé cmdValider", "à chaque calcul", "à la fermeture"], a: 1, exp: "La convention NomDuControle_Evenement lie la procédure au contrôle." },
    { type: "input", q: "Quelle fonction supprime les espaces au début et à la fin d'un texte saisi ?", a: ["Trim", "trim", "Trim()"], ph: "T…", exp: "Trim(txtNom.Value) évite qu'un simple espace passe pour une saisie valide." }
  ],
  final: {
    title: "Exercice final — Un formulaire de saisie de commandes",
    intro: `<p>La feuille <strong>Commandes</strong> contient un tableau : colonne A le client, colonne B le montant, colonne C la date d'enregistrement. Tu veux un formulaire <strong>frmCommande</strong> avec deux zones de texte (<code>txtClient</code>, <code>txtMontant</code>) et un bouton <code>cmdValider</code> qui ajoute la commande à la première ligne libre, avec la date du jour, après avoir vérifié la saisie.</p>
<pre class="pseudo">      A          B         C
  1  Client     Montant   Date
  2  Dupont     1200      12/03/2026
  3  (a ajouter par le formulaire...)</pre>`,
    questions: [
      { type: "input", q: "Écris la ligne qui calcule dans derniere la première ligne LIBRE de la colonne A.", a: ["derniere = Cells(Rows.Count, 1).End(xlUp).Row + 1", "derniere = Cells(Rows.Count,1).End(xlUp).Row + 1", "derniere = Cells(Rows.Count, 1).End(xlUp).Row+1"], ph: "derniere = …", exp: "On prend la dernière ligne remplie et on ajoute 1 pour écrire en dessous." },
      { type: "input", q: "Écris le test qui vérifie que txtClient n'est pas vide (utilise Trim), sur la ligne d'en-tête If.", a: ["If Trim(txtClient.Value) = \"\" Then", "If Trim(txtClient.Value)=\"\" Then", "if trim(txtclient.value) = \"\" then"], ph: "If Trim(…", exp: "Trim élimine les espaces : une saisie d'espaces est alors considérée comme vide." },
      { type: "input", q: "Écris l'instruction qui sort immédiatement de la procédure après le message d'erreur.", a: ["Exit Sub", "exit sub"], ph: "Exit …", exp: "Exit Sub interrompt la procédure sans écrire dans la feuille." },
      { type: "input", q: "Quelle fonction VBA renvoie la date du jour (sans l'heure) ?", a: ["Date", "date", "Date()"], ph: "un mot", exp: "Date renvoie la date du jour ; Now renvoie la date ET l'heure." },
      { type: "qcm", q: "Après l'ajout, quelle instruction remet la zone txtClient à vide pour la saisie suivante ?", opts: ["txtClient.Clear", "txtClient.Value = \"\"", "Unload txtClient", "txtClient.Delete"], a: 1, exp: "On réaffecte une chaîne vide à la propriété Value du contrôle." }
    ],
    solution: `<p>Code du bouton, placé dans le module du UserForm frmCommande :</p>
<pre class="pseudo">Private Sub cmdValider_Click()
    Dim derniere As Long                       ' premiere ligne libre du tableau
    Dim ws As Worksheet
    Set ws = Worksheets("Commandes")           ' on vise explicitement la bonne feuille

    ' --- controles de saisie ---
    If Trim(txtClient.Value) = "" Then         ' le nom du client est obligatoire
        MsgBox "Le client est obligatoire.", vbExclamation
        txtClient.SetFocus                     ' curseur remis dans la zone fautive
        Exit Sub                               ' on arrete tout
    End If
    If Not IsNumeric(txtMontant.Value) Then    ' le montant doit etre un nombre
        MsgBox "Le montant doit etre un nombre.", vbCritical
        txtMontant.SetFocus
        Exit Sub
    End If

    ' --- ecriture dans la feuille ---
    derniere = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row + 1  ' premiere ligne libre
    ws.Cells(derniere, 1).Value = Trim(txtClient.Value)      ' colonne A : client
    ws.Cells(derniere, 2).Value = CDbl(txtMontant.Value)     ' colonne B : montant numerique
    ws.Cells(derniere, 3).Value = Date                       ' colonne C : date du jour

    ' --- remise a zero du formulaire ---
    txtClient.Value = ""                       ' vide les zones pour la saisie suivante
    txtMontant.Value = ""
    txtClient.SetFocus                         ' pret pour la commande suivante
End Sub

Private Sub cmdFermer_Click()
    Unload Me                                  ' ferme le formulaire
End Sub</pre>
<p>Et pour ouvrir le formulaire automatiquement, dans <strong>ThisWorkbook</strong> :</p>
<pre class="pseudo">Private Sub Workbook_Open()
    frmCommande.Show      ' le formulaire s'affiche des l'ouverture du .xlsm
End Sub</pre>
<p>Note la conversion <code>CDbl</code> : une TextBox renvoie toujours du <em>texte</em>. Sans conversion, le montant serait stocké comme chaîne et les sommes seraient fausses. Enregistre bien le classeur en <strong>.xlsm</strong>, sinon tout ce travail disparaît à la fermeture.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code VBA (formulaire ou événement)…",
  items: [
  { id: "excelpro-j25", lab: {"title":"À reproduire","intro":"Écrire un événement Worksheet_Change qui horodate chaque modification de la colonne B.","steps":"1) Clic droit sur l'onglet de la feuille Stock > Visualiser le code.\n2) Saisis :\n   Private Sub Worksheet_Change(ByVal Target As Range)\n     If Target.Column = 2 And Target.Row >= 2 Then\n       Cells(Target.Row, 4).Value = Now\n     End If\n   End Sub\n3) Reviens sur la feuille et modifie une quantité en colonne B.","check":"Modifier une cellule de la colonne B (ligne ≥ 2) inscrit automatiquement la date et l'heure dans la colonne D de la même ligne."}, title: "Journal automatique des modifications", level: 3,
    statement: "Sur la feuille <strong>Stock</strong>, la colonne B contient les quantités en stock. Écris l'événement <strong>Worksheet_Change</strong> qui, dès qu'une quantité de la colonne B (lignes 2 et suivantes) est modifiée, écrit en colonne D la date et l'heure de la modification, et colore la cellule B en rouge (couleur 255) si la nouvelle quantité est inférieure à 10. Pense à neutraliser les événements pendant l'écriture.<pre class=\"pseudo\">      A          B     C        D\n  1  Article   Qte   Seuil    Derniere modif\n  2  Vis       50    10       ?\n  3  Ecrous    4     10       ?</pre>",
    hints: [
      "Le code va dans le module de la feuille Stock (double-clic sur Stock dans l'explorateur de projet), pas dans un module standard.",
      "Filtre avec If Target.Column = 2 And Target.Row >= 2 Then pour ignorer les autres colonnes et l'en-tête.",
      "Encadre l'écriture par Application.EnableEvents = False … = True, sinon ton propre code redéclenche l'événement."
    ],
    solution: "Option Explicit\n\n' A placer dans le module de la feuille Stock\nPrivate Sub Worksheet_Change(ByVal Target As Range)\n    ' Target = la cellule qui vient d'etre modifiee\n    If Target.Count > 1 Then Exit Sub            ' ignore les collages multiples\n    If Target.Column <> 2 Then Exit Sub          ' on ne reagit qu'a la colonne B\n    If Target.Row < 2 Then Exit Sub              ' on ignore la ligne d'en-tete\n\n    Application.EnableEvents = False             ' coupe les evenements : anti-boucle infinie\n\n    Cells(Target.Row, 4).Value = Now             ' colonne D : date + heure de la modif\n    Cells(Target.Row, 4).NumberFormat = \"jj/mm/aaaa hh:mm\"   ' format lisible\n\n    If IsNumeric(Target.Value) And Target.Value < 10 Then    ' stock critique ?\n        Target.Interior.Color = 255              ' fond rouge = alerte\n    Else\n        Target.Interior.ColorIndex = xlNone      ' sinon on enleve la couleur\n    End If\n\n    Application.EnableEvents = True              ' TOUJOURS remettre les evenements\nEnd Sub\n\nResultat attendu :\n   On tape 4 en B3  -> B3 devient rouge, D3 affiche 19/07/2026 14:32\n   On tape 50 en B3 -> B3 redevient blanche, D3 est mise a jour",
    note: "Trois reflexes des evenements : filtrer Target (colonne, ligne, Target.Count), couper EnableEvents avant d'ecrire, le remettre a True a la fin. Le classeur doit etre enregistre en .xlsm." }
  ]
};
</script>
