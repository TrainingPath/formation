<script>
var DAY = {
  num: 18,
  title: "Power Query : actualiser et automatiser",
  subtitle: "Rejouer, planifier et fiabiliser ses requêtes sans y penser.",
  theory: `
<h3>1. Le principe : une requête se rejoue</h3>
<p>La force de Power Query, vue hier, c'est qu'une requête est une <strong>suite d'étapes rejouable</strong>. <strong>Actualiser</strong> (en anglais <em>refresh</em>), c'est demander à Power Query de <strong>relancer toutes les étapes</strong> sur les données actuelles de la source. Si le fichier source a gagné 200 lignes, un clic sur Actualiser suffit : tout le nettoyage, les fusions et les ajouts se rejouent automatiquement.</p>
<pre class="pseudo">Actualiser une requete = relire la source + rejouer chaque etape appliquee
   Donnees > Actualiser tout        // rejoue TOUTES les requetes du classeur
   Clic droit sur la requete > Actualiser   // une seule requete</pre>
<h3>2. Actualiser au bon moment</h3>
<p>Dans <strong>Données ▸ Requêtes et connexions</strong>, clique droit sur une requête ▸ <strong>Propriétés</strong> pour régler quand elle se met à jour :</p>
<pre class="pseudo">Actualiser toutes les N minutes     // rafraichissement periodique automatique
Actualiser lors de l'ouverture      // met a jour des l'ouverture du fichier
Actualiser en arriere-plan          // Excel reste utilisable pendant le calcul</pre>
<div class="tip">« Actualiser les données lors de l'ouverture du fichier » est le réglage le plus utile pour un tableau de bord : celui qui ouvre le classeur voit toujours les chiffres à jour, sans rien faire.</div>
<h3>3. Sources de données et chemins</h3>
<p>Une requête pointe vers une <strong>source</strong> : un fichier Excel, un CSV, un <strong>dossier entier</strong>, une page web, une base de données… Le cas très pratique du <strong>dossier</strong> (<strong>Données ▸ Récupérer des données ▸ À partir d'un fichier ▸ À partir d'un dossier</strong>) combine automatiquement TOUS les fichiers d'un dossier : dépose le rapport du mois dans le dossier, actualise, et il est intégré. Aucune manipulation de plus.</p>
<div class="warn">Piège fréquent : le <strong>chemin d'accès</strong> (l'emplacement du fichier source) est enregistré « en dur ». Si tu déplaces le fichier source ou envoies le classeur à un collègue, la source devient introuvable. On corrige via <strong>Données ▸ Modifier les paramètres de la source de données</strong>, ou avec un paramètre (voir plus bas).</div>
<h3>4. Fiabiliser : types, en-têtes, erreurs</h3>
<p>Une requête robuste résiste aux changements de la source. Trois réflexes :</p>
<pre class="pseudo">1) Definir le TYPE de chaque colonne (Texte, Nombre, Date)   // evite les surprises de format
2) "Utiliser la premiere ligne comme en-tetes"              // les vrais noms de colonnes
3) Gerer les erreurs : clic droit colonne > Remplacer les erreurs
   ou Accueil > Conserver les lignes / Supprimer les lignes > Supprimer les erreurs</pre>
<div class="warn">Évite l'étape « Colonnes supprimées » qui liste les colonnes à jeter par leur nom exact : si la source en renomme une, la requête casse. Préfère « <strong>Choisir les colonnes</strong> » (celles à garder) ou « Supprimer les autres colonnes ».</div>
<h3>5. Les paramètres : rendre une requête souple</h3>
<p>Un <strong>paramètre</strong> est une valeur nommée et modifiable (un chemin de dossier, une année, un seuil) que la requête utilise au lieu d'une valeur figée. On le crée par <strong>Accueil ▸ Gérer les paramètres ▸ Nouveau paramètre</strong>. Changer le paramètre, puis actualiser, suffit à réorienter la requête — idéal pour partager un classeur : chacun met son propre chemin.</p>
<pre class="pseudo">Parametre CheminDossier = "C:\\Rapports"     // valeur modifiable en un endroit
Source = Folder.Files(CheminDossier)         // la requete lit ce parametre (langage M)</pre>
<h3>6. Automatiser plus loin</h3>
<p>Sur le bureau, l'automatisation totale (actualiser sans ouvrir Excel) passe par une <strong>macro VBA</strong> qui appelle <code>ThisWorkbook.RefreshAll</code> (on verra VBA dès le jour 22) ou par le <strong>Planificateur de tâches Windows</strong>. Dans le cloud, un classeur publié sur <strong>Power BI</strong> ou <strong>SharePoint/OneDrive</strong> peut être actualisé automatiquement par une <strong>passerelle</strong> ou par <strong>Power Automate</strong> (jour 30). Retiens que « actualiser » est le geste central, et que plusieurs outils peuvent le déclencher à ta place.</p>`,
  exercises: [
    { type: "qcm", q: "Actualiser une requête, c'est…", opts: ["Supprimer la requête", "Relire la source et rejouer chaque étape appliquée", "Changer les couleurs", "Créer un graphique"], a: 1, exp: "L'actualisation rejoue toutes les étapes sur les données actuelles." },
    { type: "input", q: "Quel bouton du ruban rejoue TOUTES les requêtes du classeur ? (Données ▸ …)", a: ["Actualiser tout", "Actualiser Tout"], ph: "Données ▸ …", exp: "Données ▸ Actualiser tout relance l'ensemble des requêtes." },
    { type: "qcm", q: "Pour qu'un tableau de bord soit à jour à chaque ouverture, on coche dans les Propriétés…", opts: ["Actualiser lors de l'ouverture du fichier", "Supprimer la requête", "Masquer la feuille", "Protéger le classeur"], a: 0, exp: "Ce réglage met les données à jour dès l'ouverture, sans action manuelle." },
    { type: "vf", q: "Le chemin d'accès de la source est enregistré en dur : déplacer le fichier source peut casser la requête.", a: true, exp: "On corrige via Modifier les paramètres de la source de données, ou un paramètre." },
    { type: "qcm", q: "Récupérer « À partir d'un dossier » permet de…", opts: ["Combiner automatiquement tous les fichiers d'un dossier", "Supprimer un dossier", "Créer un TCD", "Trier une colonne"], a: 0, exp: "Un nouveau fichier déposé dans le dossier est intégré à la prochaine actualisation." },
    { type: "input", q: "Comment appelle-t-on une valeur nommée et modifiable (chemin, année…) utilisée par une requête ?", a: ["paramètre", "parametre", "un paramètre", "un parametre"], ph: "un mot", exp: "Un paramètre remplace une valeur figée et rend la requête souple." },
    { type: "qcm", q: "Pourquoi préférer « Choisir les colonnes » à « Colonnes supprimées » ?", opts: ["C'est plus joli", "Si la source renomme une colonne à jeter, la suppression par nom casse la requête", "Ça trie plus vite", "Aucune raison"], a: 1, exp: "Lister les colonnes à garder est plus robuste que lister celles à supprimer par nom." },
    { type: "vf", q: "Cocher « Actualiser en arrière-plan » bloque Excel pendant tout le calcul.", a: false, exp: "L'arrière-plan laisse justement Excel utilisable pendant l'actualisation." },
    { type: "input", q: "Instruction VBA (vue plus tard) qui actualise toutes les requêtes du classeur : ThisWorkbook.____", a: ["RefreshAll", "RefreshAll()", ".RefreshAll", "refreshall"], ph: "ThisWorkbook.____", exp: "ThisWorkbook.RefreshAll relance toutes les connexions du classeur." },
    { type: "qcm", q: "Un réflexe pour fiabiliser une requête est…", opts: ["Ne jamais définir de types", "Définir le type de chaque colonne (Texte, Nombre, Date)", "Tout mettre en couleur", "Supprimer les en-têtes"], a: 1, exp: "Fixer les types évite les mauvaises surprises de format à l'actualisation." },
    { type: "qcm", q: "Où règle-t-on la fréquence d'actualisation d'une requête ?", opts: ["Insertion ▸ Graphique", "Clic droit sur la requête ▸ Propriétés", "Fichier ▸ Imprimer", "Accueil ▸ Coller"], a: 1, exp: "Les Propriétés de la requête contiennent les options d'actualisation." },
    { type: "vf", q: "Un classeur publié sur SharePoint/Power BI peut être actualisé automatiquement via une passerelle ou Power Automate.", a: true, exp: "Dans le cloud, plusieurs services déclenchent l'actualisation à ta place." },
    { type: "input", q: "Dans le langage M, la fonction qui lit tous les fichiers d'un dossier est Folder.____", a: ["Files", "Files()", "files"], ph: "Folder.____", exp: "Folder.Files(chemin) renvoie la liste des fichiers d'un dossier." },
    { type: "qcm", q: "Sur un poste, quel outil Windows peut lancer Excel pour actualiser sans intervention ?", opts: ["Le Bloc-notes", "Le Planificateur de tâches", "La Calculatrice", "Paint"], a: 1, exp: "Le Planificateur de tâches Windows peut déclencher une macro d'actualisation." },
    { type: "input", q: "Où corriger l'emplacement d'un fichier source déplacé ? Données ▸ Modifier les paramètres de la ____ de données.", a: ["source", "Source"], ph: "un mot", exp: "Données ▸ Modifier les paramètres de la source de données répare le chemin." }
  ],
  final: {
    title: "Exercice final — Un tableau des ventes toujours à jour",
    intro: `<p>Chaque mois, un fichier CSV de ventes est déposé dans un dossier partagé. Ton classeur doit intégrer tout nouveau fichier et afficher des données à jour dès son ouverture, même quand un collègue l'ouvre depuis un autre poste.</p>
<pre class="pseudo">Dossier "Ventes\\" :  ventes_jan.csv, ventes_fev.csv, ...   // un CSV par mois, même structure
Objectif : requete unique + actualisation automatique + chemin partageable</pre>`,
    questions: [
      { type: "qcm", q: "Quelle source choisir pour intégrer automatiquement chaque nouveau CSV du dossier ?", opts: ["À partir d'un fichier unique", "À partir d'un dossier", "À partir du web", "Saisie manuelle"], a: 1, exp: "« À partir d'un dossier » combine tous les fichiers et prend les nouveaux à l'actualisation." },
      { type: "input", q: "Un collègue dépose ventes_mars.csv. Quel bouton met le tableau à jour ? (Données ▸ …)", a: ["Actualiser tout", "Actualiser Tout"], ph: "Données ▸ …", exp: "Données ▸ Actualiser tout rejoue la requête et intègre le nouveau fichier." },
      { type: "qcm", q: "Pour que les données soient à jour dès l'ouverture, on coche dans les Propriétés…", opts: ["Masquer la requête", "Actualiser les données lors de l'ouverture du fichier", "Protéger la feuille", "Supprimer les erreurs"], a: 1, exp: "Ce réglage évite d'avoir à cliquer Actualiser à chaque ouverture." },
      { type: "qcm", q: "Le classeur est ouvert depuis un autre poste où le chemin du dossier diffère. La meilleure parade ?", opts: ["Recréer la requête à chaque fois", "Utiliser un paramètre pour le chemin du dossier", "Copier-coller les données", "Renommer le fichier"], a: 1, exp: "Un paramètre de chemin permet à chacun d'indiquer son emplacement sans toucher aux étapes." },
      { type: "input", q: "Pour actualiser sans ouvrir Excel, une macro appellerait ThisWorkbook.____", a: ["RefreshAll", "RefreshAll()", "refreshall"], ph: "ThisWorkbook.____", exp: "ThisWorkbook.RefreshAll lance toutes les actualisations par code." }
    ],
    solution: `<p>Chaîne d'automatisation complète, du dossier au tableau de bord :</p>
<pre class="pseudo">// 1 — SOURCE evolutive : le dossier entier
Donnees > Recuperer des donnees > A partir d'un fichier > A partir d'un dossier
   --> Power Query combine tous les CSV de meme structure

// 2 — CHEMIN partageable : un parametre
Accueil > Gerer les parametres > Nouveau parametre
   CheminDossier = "\\\\Serveur\\Ventes"   // chacun met le sien, une seule fois
   Source = Folder.Files(CheminDossier)     // la requete lit le parametre (langage M)

// 3 — FIABILITE
Definir le type de chaque colonne (Date, Texte, Nombre)
Choisir les colonnes a garder (plutot que supprimer par nom)
Supprimer les erreurs eventuelles

// 4 — ACTUALISATION automatique
Clic droit sur la requete > Proprietes :
   [x] Actualiser les donnees lors de l'ouverture du fichier
   [x] Actualiser en arriere-plan
Au besoin : Donnees > Actualiser tout (manuel)
Sans ouvrir Excel : macro ThisWorkbook.RefreshAll + Planificateur de taches</pre>
<p>Le mois suivant, il suffit de déposer le nouveau CSV : à l'ouverture, tout est à jour. C'est ça, une requête « qui se rejoue toute seule ».</p>`
  }
};
</script>
