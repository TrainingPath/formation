var DAY = {
  num: 23,
  title: "Les bases du langage VBA",
  subtitle: "Procédures, variables, cellules et messages : écrire son propre code.",
  theory: `
<h3>1. Écrire du code, pas seulement l'enregistrer</h3>
<p>Hier, l'enregistreur écrivait le VBA pour nous. Aujourd'hui, on tape nous-mêmes. On travaille dans l'éditeur (<strong>Alt+F11</strong>), dans un <strong>Module</strong> qu'on insère par <strong>Insertion ▸ Module</strong>. Le code s'organise en <strong>procédures</strong>.</p>
<h3>2. La procédure Sub</h3>
<p>Une <strong>procédure Sub</strong> est un bloc d'instructions nommé, qui <em>fait</em> quelque chose (mais ne renvoie pas de valeur). C'est l'unité de base d'une macro :</p>
<pre class="pseudo">Sub Bonjour()                      ' debut de la procedure nommee Bonjour
    MsgBox "Bonjour !"             ' affiche une boite de message a l'ecran
End Sub                             ' fin de la procedure</pre>
<div class="tip">Il existe aussi les <strong>Function</strong>, qui <em>renvoient</em> une valeur (comme une formule). On les verra plus tard ; pour l'instant, on manipule des <strong>Sub</strong>.</div>
<h3>3. Les variables : ranger une valeur</h3>
<p>Une <strong>variable</strong> est une boîte nommée qui retient une valeur. On la déclare avec <strong>Dim</strong> (de l'anglais <em>dimension</em>), en précisant son <strong>type</strong> :</p>
<pre class="pseudo">Dim age As Integer          ' age contiendra un nombre ENTIER
Dim prix As Double          ' prix contiendra un nombre a virgule (decimal)
Dim nom As String           ' nom contiendra du TEXTE (String = chaine de caracteres)
Dim actif As Boolean        ' actif contiendra Vrai/Faux (True/False)

age = 30                     ' on RANGE 30 dans la variable age
nom = "Ada"                 ' le texte doit etre entre guillemets
prix = age * 1.5            ' on peut calculer et stocker le resultat</pre>
<div class="warn">Écris <strong>Option Explicit</strong> tout en haut du module : VBA t'obligera alors à déclarer chaque variable avec Dim. Cela évite les fautes de frappe silencieuses (une variable mal orthographiée deviendrait une nouvelle boîte vide).</div>
<h3>4. Lire et écrire dans les cellules</h3>
<p>L'objet <strong>Range</strong> représente une cellule (ou une plage). Sa propriété <strong>Value</strong> est son contenu. On l'utilise pour lire ET pour écrire :</p>
<pre class="pseudo">Range("A1").Value = "Total"          ' ECRIRE : met le texte Total dans A1
Range("B1").Value = 100              ' ECRIRE : met le nombre 100 dans B1
Dim x As Double                      ' une boite pour un nombre
x = Range("B1").Value                ' LIRE : copie le contenu de B1 dans x
Range("B2").Value = x * 1.2          ' calcul puis ecriture dans B2

Cells(1, 1).Value = "Coin"           ' Cells(ligne, colonne) : ici ligne 1, colonne 1 = A1</pre>
<div class="tip"><strong>Range("A1")</strong> désigne par le nom ; <strong>Cells(1, 1)</strong> désigne par numéro de ligne et de colonne. Cells est très pratique dans les boucles (jour 24), où le numéro varie.</div>
<h3>5. Dialoguer avec l'utilisateur : MsgBox et InputBox</h3>
<pre class="pseudo">MsgBox "Traitement termine !"        ' AFFICHE un message a l'utilisateur
MsgBox "Le total est " & total       ' & COLLE (concatene) du texte et une variable

Dim reponse As String
reponse = InputBox("Ton prenom ?")   ' DEMANDE une saisie et la range dans reponse
MsgBox "Bonjour " & reponse           ' reutilise la reponse</pre>
<div class="warn">L'opérateur pour coller deux textes en VBA est l'esperluette <strong>&amp;</strong> (et non +). <code>"Bonjour " &amp; nom</code> donne « Bonjour Ada ».</div>
<h3>6. Commentaires et lisibilité</h3>
<p>Un <strong>commentaire</strong> commence par une <strong>apostrophe</strong> <code>'</code> : tout ce qui suit sur la ligne est ignoré à l'exécution. Il sert à expliquer le code à un humain. Indente (décale) tes instructions à l'intérieur du Sub pour rendre la structure visible.</p>
<pre class="pseudo">Sub Resume()
    ' --- Cette macro remplit un petit resume ---
    Dim tva As Double                 ' taux de TVA
    tva = 0.21                        ' 21 %
    Range("A1").Value = "TVA"         ' etiquette
    Range("B1").Value = tva           ' valeur
End Sub</pre>
<div class="tip">Pour tester une procédure : place le curseur dedans et appuie sur <strong>F5</strong> (Exécuter), ou <strong>F8</strong> pour l'exécuter pas à pas, ligne après ligne — idéal pour comprendre ce qui se passe.</div>`,

    { type: "qcm", q: "Cells(1, 1) désigne la cellule…", opts: ["B1", "A1 (ligne 1, colonne 1)", "A2", "aucune"], a: 1, exp: "Cells(ligne, colonne) : (1,1) = colonne 1, ligne 1 = A1." },
    { type: "vf", q: "Cells(ligne, colonne) est plus pratique que Range dans une boucle où le numéro varie.", a: true, exp: "On y injecte facilement une variable de boucle : Cells(i, 1)." },

    { type: "input", q: "Quelle fonction DEMANDE une saisie à l'utilisateur et renvoie sa réponse ?", a: ["InputBox", "inputbox", "InputBox()"], ph: "un mot", exp: "InputBox(\"question\") récupère la saisie de l'utilisateur." },
    { type: "vf", q: "Un commentaire VBA commence par un double slash //.", a: false, exp: "En VBA le commentaire commence par une apostrophe ' (le // c'est M/DAX)." },
    { type: "qcm", q: "Pour exécuter la procédure où se trouve le curseur, on appuie sur…", opts: ["F1", "F5", "Suppr", "Entrée"], a: 1, exp: "F5 exécute ; F8 exécute pas à pas." },
    { type: "input", q: "Déclare une variable entière nommée total.", a: ["Dim total As Integer", "dim total as integer", "Dim total as Integer"], ph: "Dim …", exp: "Dim total As Integer crée une boîte pour un nombre entier." }
  ],
  final: {
    title: "Exercice final — Une petite facture par code",
    intro: `<p>On veut une macro qui demande une quantité, la range dans une variable, calcule le prix total à 12 € l'unité, écrit le résultat en B2 et affiche un message récapitulatif.</p>
<pre class="pseudo">Prix unitaire fixe : 12
Demander la quantite -> calculer total -> ecrire en B2 -> message</pre>`,
    questions: [
      { type: "input", q: "Déclare une variable entière qte et une variable Double total.", a: ["Dim qte As Integer, total As Double", "Dim qte As Integer\nDim total As Double", "Dim qte as integer, total as double"], ph: "Dim …", exp: "Dim qte As Integer, total As Double (ou sur deux lignes)." },
      { type: "input", q: "Demande la quantité à l'utilisateur et range-la dans qte (via InputBox).", a: ["qte = InputBox(\"Quantité ?\")", "qte = InputBox(\"Quantite ?\")", "qte=InputBox(\"Quantité ?\")"], ph: "qte = …", exp: "qte = InputBox(\"Quantité ?\") récupère la saisie." },
      { type: "input", q: "Calcule total = qte multiplié par 12.", a: ["total = qte * 12", "total=qte*12", "total = qte*12"], ph: "total = …", exp: "total = qte * 12 applique le prix unitaire." },
      { type: "input", q: "Écris total dans la cellule B2.", a: ["Range(\"B2\").Value = total", "Range(\"B2\").Value=total", "range(\"b2\").value = total"], ph: "Range(\"B2\")…", exp: "Range(\"B2\").Value = total pose le résultat." },
      { type: "qcm", q: "Pour afficher « Total : 60 » avec la variable total, quelle écriture ?", opts: ["MsgBox \"Total : \" + total", "MsgBox \"Total : \" & total", "MsgBox Total", "MsgBox(total, \"Total\")"], a: 1, exp: "On colle texte et variable avec &, pas avec +." }
    ],
    solution: `<p>La macro complète, commentée :</p>
<pre class="pseudo">Option Explicit                          ' oblige a declarer les variables

Sub Facture()                            ' debut de la procedure
    Dim qte As Integer                   ' boite pour la quantite (entier)
    Dim total As Double                  ' boite pour le total (decimal)

    qte = InputBox("Quantite ?")         ' DEMANDE la quantite et la range dans qte
    total = qte * 12                     ' calcul : quantite x prix unitaire (12)
    Range("B2").Value = total            ' ECRIT le total dans la cellule B2
    MsgBox "Total : " & total & " EUR"   ' AFFICHE le recap (& colle texte et variable)
End Sub                                  ' fin de la procedure</pre>
<p>Si l'utilisateur saisit 5, alors <code>total = 5 * 12 = 60</code>, B2 affiche 60 et le message dit « Total : 60 EUR ». Points clés : <strong>Dim</strong> pour les variables, <strong>InputBox</strong> pour saisir, <strong>Range().Value</strong> pour écrire, <strong>&amp;</strong> pour concaténer dans le message.</p>`
  }
