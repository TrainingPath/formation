<script>
var DAY = {
  num: 20,
  title: "Le modèle de données et les relations (Power Pivot)",
  subtitle: "Relier plusieurs tables entre elles au lieu de tout écraser en RECHERCHEX.",
  theory: `
<h3>1. Le problème : une seule grande table, c'est lourd</h3>
<p>Jusqu'ici, pour croiser plusieurs tables, on rapatriait tout dans une seule (RECHERCHEX à répétition, fusions). Ça gonfle le fichier et multiplie les erreurs. Le <strong>modèle de données</strong> propose l'inverse : garder les tables <strong>séparées</strong> et les <strong>relier</strong> par des relations. Excel les croise alors à la demande, sans duplication.</p>
<h3>2. Qu'est-ce que le modèle de données ?</h3>
<p>Le <strong>modèle de données</strong> est un espace <em>en mémoire</em>, dans le classeur, où l'on range plusieurs tables et les <strong>relations</strong> qui les lient. Le moteur qui l'anime s'appelle <strong>Power Pivot</strong> (un complément gratuit intégré à Excel). On y ajoute une table en cochant « <strong>Ajouter ces données au modèle de données</strong> » à la création d'un TCD, ou depuis Power Query (Fermer et charger dans… ▸ connexion + ajouter au modèle).</p>
<div class="tip">Active l'onglet <strong>Power Pivot</strong> par <strong>Fichier ▸ Options ▸ Compléments ▸ Compléments COM ▸ Microsoft Power Pivot for Excel</strong>. Le bouton <strong>Power Pivot ▸ Gérer</strong> ouvre la fenêtre du modèle, avec la <strong>vue de diagramme</strong> pour dessiner les relations.</div>
<h3>3. Tables de faits et tables de dimensions</h3>
<p>Un bon modèle distingue deux rôles :</p>
<pre class="pseudo">Table de FAITS      // les evenements mesurables : Ventes (Date, CodeProduit, CodeClient, Montant)
Table de DIMENSION  // les descripteurs : Produits (CodeProduit, Nom, Categorie)
                    //                    Clients  (CodeClient, Nom, Ville)
                    //                    Calendrier (Date, Mois, Trimestre, Annee)</pre>
<p>La table de faits est longue (une ligne par vente) ; les dimensions sont courtes et décrivent les « axes » d'analyse. Ce montage en étoile — une table de faits au centre, les dimensions autour — s'appelle un <strong>schéma en étoile</strong> et c'est le format idéal.</p>
<h3>4. Une relation, c'est quoi ?</h3>
<p>Une <strong>relation</strong> relie une colonne d'une table à une colonne d'une autre table qui contiennent les <strong>mêmes valeurs de clé</strong>. La plus courante est la relation <strong>un-à-plusieurs</strong> (en anglais <em>one-to-many</em>) : <em>un</em> produit du côté Produits correspond à <em>plusieurs</em> lignes du côté Ventes.</p>
<pre class="pseudo">Produits[CodeProduit]  1 -------- *  Ventes[CodeProduit]
   cote "1" : chaque code apparait UNE fois (cle unique)   // table de dimension
   cote "*" : le meme code revient PLUSIEURS fois          // table de faits</pre>
<div class="warn">Côté « 1 » (la dimension), la colonne clé doit être <strong>unique</strong> et sans doublon, sinon la relation est refusée. Côté « * » (les faits), les répétitions sont normales.</div>
<h3>5. Créer et gérer les relations</h3>
<p>Deux façons : glisser une clé sur l'autre dans la <strong>vue de diagramme</strong> de Power Pivot, ou par <strong>Données ▸ Relations ▸ Nouveau</strong> (choisir table, colonne, table liée, colonne liée). Une fois les relations posées, un TCD basé sur le modèle peut mélanger des champs de <em>plusieurs</em> tables : Catégorie (de Produits) en lignes, Somme de Montant (de Ventes) en valeurs — Excel suit les relations tout seul.</p>
<div class="tip">La <strong>table Calendrier</strong> dédiée (une ligne par date, avec Mois/Trimestre/Année) reliée à la date des faits est une bonne pratique universelle : elle rend les analyses temporelles propres et prépare les fonctions de temps en DAX (jour 21).</div>
<h3>6. Pourquoi c'est mieux que RECHERCHEX partout</h3>
<pre class="pseudo">Sans modele : 1 grande table + 15 colonnes RECHERCHEX   // lourd, fragile, recopie partout
Avec modele : tables separees + relations                // leger, clair, croisement a la demande</pre>
<p>Le modèle évite la duplication, réduit la taille du fichier, et surtout ouvre la porte au langage <strong>DAX</strong> pour créer des mesures de calcul réutilisables — le sujet de demain.</p>`,
  exercises: [
    { type: "qcm", q: "Le modèle de données sert à…", opts: ["Fusionner toutes les tables en une seule feuille", "Garder plusieurs tables séparées et les relier par des relations", "Imprimer plus vite", "Trier une colonne"], a: 1, exp: "On relie les tables au lieu de tout rapatrier en une seule." },
    { type: "input", q: "Comment s'appelle le moteur/complément qui gère le modèle de données dans Excel ?", a: ["Power Pivot", "PowerPivot", "power pivot"], ph: "deux mots", exp: "Power Pivot est le complément qui anime le modèle de données." },
    { type: "qcm", q: "La table de FAITS contient…", opts: ["Les descripteurs (noms, catégories)", "Les événements mesurables (ex. les ventes)", "Uniquement des dates", "Les clés primaires uniquement"], a: 1, exp: "Les faits sont les événements chiffrés ; les dimensions les décrivent." },
    { type: "qcm", q: "La relation la plus courante entre dimension et faits est…", opts: ["plusieurs-à-plusieurs", "un-à-plusieurs (one-to-many)", "aucune", "un-à-un obligatoire"], a: 1, exp: "Un élément de dimension correspond à plusieurs lignes de faits." },
    { type: "vf", q: "Côté « 1 » (la dimension), la colonne clé doit être unique, sans doublon.", a: true, exp: "Sinon Excel refuse la relation : la clé du côté 1 doit être unique." },
    { type: "input", q: "Comment nomme-t-on le montage « une table de faits au centre, les dimensions autour » ? (schéma en …)", a: ["étoile", "etoile", "schéma en étoile", "schema en etoile"], ph: "schéma en …", exp: "Le schéma en étoile est le format idéal du modèle." },
    { type: "qcm", q: "Où dessine-t-on visuellement les relations ?", opts: ["Insertion ▸ Graphique", "La vue de diagramme de Power Pivot", "Fichier ▸ Imprimer", "Accueil ▸ Coller"], a: 1, exp: "La vue de diagramme permet de glisser une clé sur l'autre." },
    { type: "vf", q: "Un TCD basé sur le modèle peut mélanger des champs venant de plusieurs tables reliées.", a: true, exp: "Excel suit les relations pour croiser Catégorie (Produits) et Montant (Ventes)." },
    { type: "qcm", q: "Menu du ruban Excel pour créer une relation sans passer par Power Pivot ?", opts: ["Insertion ▸ Segment", "Données ▸ Relations ▸ Nouveau", "Accueil ▸ Trier", "Révision ▸ Protéger"], a: 1, exp: "Données ▸ Relations ▸ Nouveau ouvre l'assistant de relation." },
    { type: "qcm", q: "Une bonne pratique universelle pour les analyses temporelles est…", opts: ["Supprimer les dates", "Une table Calendrier dédiée reliée à la date des faits", "Écrire les mois à la main", "Ne jamais trier"], a: 1, exp: "Une table Calendrier propre prépare aussi les fonctions de temps DAX." },
    { type: "vf", q: "Le modèle de données oblige à dupliquer toutes les colonnes dans la table de faits.", a: false, exp: "C'est justement l'inverse : il évite la duplication grâce aux relations." },
    { type: "input", q: "Dans la relation Produits[CodeProduit] — Ventes[CodeProduit], quelle table est côté « * » (plusieurs) ?", a: ["Ventes", "ventes", "la table Ventes"], ph: "un nom de table", exp: "Un code produit revient plusieurs fois dans Ventes : côté « * »." },
    { type: "qcm", q: "Pour ajouter une table au modèle en créant un TCD, on coche…", opts: ["« Ajouter ces données au modèle de données »", "« Supprimer les doublons »", "« Figer les volets »", "« Masquer la feuille »"], a: 0, exp: "Cette case ajoute la table au modèle au lieu d'une simple plage." },
    { type: "qcm", q: "Un avantage majeur du modèle par rapport aux RECHERCHEX partout est…", opts: ["Une meilleure compatibilité avec les anciennes versions d'Excel", "Fichier plus léger, moins d'erreurs, et accès aux mesures DAX", "Impression automatique", "Une exécution plus rapide des macros VBA"], a: 1, exp: "Moins de duplication, plus de fiabilité, et la porte ouverte à DAX." },
    { type: "input", q: "Le langage de calcul du modèle de données (mesures réutilisables) s'appelle… ? (trois lettres)", a: ["DAX", "dax", "le DAX"], ph: "trois lettres", exp: "DAX est le langage des mesures et colonnes calculées du modèle." }
  ],
  final: {
    title: "Exercice final — Construire un modèle en étoile",
    intro: `<p>Tu disposes de trois tables. Ventes est la table de faits ; Produits et Clients décrivent les axes d'analyse. Chaque vente référence un produit et un client par leur code.</p>
<pre class="pseudo">Ventes   : Date | CodeProduit | CodeClient | Montant   // FAITS (longue)
Produits : CodeProduit | Nom | Categorie              // DIMENSION (codes uniques)
Clients  : CodeClient  | Nom | Ville                  // DIMENSION (codes uniques)</pre>`,
    questions: [
      { type: "qcm", q: "Quelle table est la table de faits ?", opts: ["Produits", "Clients", "Ventes", "Aucune"], a: 2, exp: "Ventes contient les événements mesurables (Montant) : c'est la table de faits." },
      { type: "input", q: "Dans la relation Produits — Ventes, quelle table est côté « 1 » (clé unique) ?", a: ["Produits", "produits", "la table Produits"], ph: "un nom de table", exp: "CodeProduit est unique dans Produits : côté « 1 »." },
      { type: "qcm", q: "Que doit vérifier CodeClient dans la table Clients pour que la relation soit acceptée ?", opts: ["Être trié", "Être unique, sans doublon", "Être en majuscules", "Contenir des dates"], a: 1, exp: "La clé du côté « 1 » (dimension) doit être unique." },
      { type: "input", q: "Quel menu du ruban crée une relation ? (Données ▸ … ▸ Nouveau)", a: ["Relations", "relations"], ph: "Données ▸ … ▸ Nouveau", exp: "Données ▸ Relations ▸ Nouveau relie deux tables par leurs clés." },
      { type: "qcm", q: "Une fois le modèle relié, un TCD peut afficher…", opts: ["Seulement les champs de Ventes", "Catégorie (de Produits) en lignes et Somme de Montant (de Ventes) en valeurs", "Rien de plus qu'avant", "Uniquement des dates"], a: 1, exp: "Le TCD croise plusieurs tables en suivant les relations." }
    ],
    solution: `<p>Montage d'un schéma en étoile propre :</p>
<pre class="pseudo">// 1 — Ajouter les trois tables au modele
Chaque table en Tableau structure (Insertion > Tableau)
A la creation du TCD : cocher "Ajouter ces donnees au modele de donnees"
(ou Power Pivot > Ajouter au modele de donnees)

// 2 — Creer les relations (Donnees > Relations > Nouveau, ou vue de diagramme)
Produits[CodeProduit] 1 ---- * Ventes[CodeProduit]   // cote 1 = Produits (cle unique)
Clients[CodeClient]   1 ---- * Ventes[CodeClient]     // cote 1 = Clients  (cle unique)
Ventes = table de FAITS au centre ; Produits et Clients = DIMENSIONS autour

// 3 — Verifier
Cote "1" : CodeProduit unique dans Produits, CodeClient unique dans Clients
Cote "*" : ces codes se repetent librement dans Ventes

// 4 — Analyser
TCD base sur le modele :
   Lignes  : Categorie (table Produits) ou Ville (table Clients)
   Valeurs : Somme de Montant (table Ventes)
   --> Excel croise les tables en suivant les relations, sans une seule RECHERCHEX</pre>
<p>Bonus recommandé : ajoute une table <strong>Calendrier</strong> reliée à Ventes[Date] pour des analyses temporelles propres. Ton modèle est prêt à recevoir des mesures <strong>DAX</strong> dès demain.</p>`
  }
};
</script>
