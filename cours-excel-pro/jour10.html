<script>
var DAY = {
  num: 10,
  title: "Les fonctions date et heure avancées",
  subtitle: "Calculer des échéances, des anciennetés et des durées : comprendre enfin comment Excel stocke le temps.",
  theory: `
<h3>1. Une date est un NOMBRE</h3>
<p>C'est la clé de tout. Excel stocke une date comme un <strong>numéro de série</strong> : le nombre de jours écoulés depuis le 1er janvier 1900 (qui vaut 1). Le 01/01/2025 vaut 45658. L'heure est la <strong>partie décimale</strong> de ce nombre : 0,5 = midi, 0,75 = 18h00.</p>
<pre class="pseudo">01/01/2025 12:00  est stocke comme  45658,5
   45658   le jour
   ,5      la fraction de journee (12h sur 24h)</pre>
<p>Conséquence directe : on peut <strong>additionner et soustraire</strong> des dates comme des nombres. <code>=B2-A2</code> donne un nombre de jours. Si le résultat s'affiche en date, c'est juste un problème de format : passe la cellule en <em>Standard</em>.</p>
<div class="warn">Une date importée peut être du <strong>texte</strong> déguisé (alignée à gauche, non calculable). Test rapide : <code>=ESTNUM(A2)</code>. Si c'est FAUX, convertis avec <code>=DATEVAL(A2)</code> ou via Données ▸ Convertir.</div>

<h3>2. Construire et décomposer une date</h3>
<pre class="pseudo">=DATE(annee ; mois ; jour)      // assemble une vraie date
=ANNEE(A2)   =MOIS(A2)   =JOUR(A2)    // extraient chaque morceau
=AUJOURDHUI()      // la date du jour (volatile, se met a jour seule)
=MAINTENANT()      // date + heure</pre>
<p><strong>DATE</strong> gère intelligemment les débordements : <code>=DATE(2025;13;1)</code> renvoie le 01/01/2026, et <code>=DATE(2025;3;0)</code> renvoie le dernier jour de février. C'est la base de tous les calculs de fin de période.</p>
<pre class="pseudo">=DATE(ANNEE(A2) ; MOIS(A2) + 1 ; 0)
   MOIS(A2)+1   on vise le mois SUIVANT
   jour = 0     le "jour zero" du mois suivant = dernier jour du mois de A2
   // equivalent moderne : =FIN.MOIS(A2 ; 0)</pre>

<h3>3. Se déplacer dans le calendrier : MOIS.DECALER et FIN.MOIS</h3>
<pre class="pseudo">=MOIS.DECALER(date ; nb_mois)   // meme jour, n mois plus tard (ou plus tot si negatif)
=FIN.MOIS(date ; nb_mois)       // DERNIER jour du mois situe n mois plus loin

=MOIS.DECALER("31/01/2025" ; 1)   // 28/02/2025 : Excel ajuste au jour existant
=FIN.MOIS(A2 ; 0)                 // fin du mois en cours
=FIN.MOIS(A2 ; -1) + 1            // PREMIER jour du mois en cours</pre>
<div class="tip">Le premier jour du mois s'obtient très souvent par <code>=FIN.MOIS(A2;-1)+1</code> : on prend la fin du mois précédent et on ajoute un jour. Plus court que DATE(ANNEE(A2);MOIS(A2);1), et sans risque d'erreur.</div>

<h3>4. Les jours ouvrés : SERIE.JOUR.OUVRE et NB.JOURS.OUVRES</h3>
<p>Ces deux fonctions ignorent les samedis et dimanches, et acceptent une <strong>plage de jours fériés</strong> à exclure. Les versions suffixées <code>.INTL</code> permettent de choisir quels jours sont chômés (semaine du vendredi-samedi, etc.).</p>
<pre class="pseudo">=SERIE.JOUR.OUVRE(date_depart ; nb_jours ; [feries])
   // renvoie la date situee n JOURS OUVRES plus loin
=SERIE.JOUR.OUVRE(A2 ; 10 ; Feries)   // echeance a 10 jours ouvres

=NB.JOURS.OUVRES(debut ; fin ; [feries])
   // compte les jours ouvres entre deux dates, bornes INCLUSES

=NB.JOURS.OUVRES.INTL(debut ; fin ; 7 ; feries)
   7   code week-end = vendredi + samedi</pre>

<h3>5. DATEDIF : la fonction cachée des anciennetés</h3>
<p><strong>DATEDIF</strong> calcule un écart en années, mois ou jours <em>complets</em>. Particularité : elle n'apparaît PAS dans l'assistant de fonctions (héritage de Lotus 1-2-3) et n'a pas d'infobulle, mais elle fonctionne dans toutes les versions.</p>
<pre class="pseudo">=DATEDIF(date_debut ; date_fin ; unite)
   "y"   nombre d'ANNEES completes
   "m"   nombre de MOIS complets
   "d"   nombre de JOURS
   "ym"  mois restants une fois les annees retirees
   "md"  jours restants une fois les mois retires

=DATEDIF(A2 ; AUJOURDHUI() ; "y")   // age exact en annees revolues</pre>
<pre class="pseudo">Anciennete detaillee :
=DATEDIF(A2;AUJOURDHUI();"y") &amp; " an(s) " &amp; DATEDIF(A2;AUJOURDHUI();"ym") &amp; " mois"
   "y"    les annees pleines
   "ym"   le reste en mois (sans recompter les annees)</pre>
<div class="warn">DATEDIF exige <strong>date_debut &lt;= date_fin</strong>, sinon elle renvoie <code>#NOMBRE!</code>. Et attention : <code>(B2-A2)/365</code> est une approximation fausse (années bissextiles) — utilise DATEDIF pour un âge.</div>

<h3>6. Le jour de la semaine et le numéro de semaine</h3>
<pre class="pseudo">=JOURSEM(date ; type)
   type 2   lundi = 1 ... dimanche = 7  (la convention europeenne)
   type 1   dimanche = 1 (convention par defaut, americaine)

=JOURSEM(A2;2) &gt; 5      // VRAI si samedi ou dimanche
=NO.SEMAINE.ISO(A2)     // numero de semaine selon la norme ISO 8601 (europeenne)</pre>
<div class="tip">Pour afficher le nom du jour sans changer la valeur, ne calcule rien : applique un <strong>format personnalisé</strong> <code>jjjj jj/mm/aaaa</code> (Ctrl+1 ▸ Personnalisée). La cellule reste une vraie date, calculable.</div>

<h3>7. Les heures et les durées</h3>
<p>Une durée qui dépasse 24 h s'affiche mal par défaut : Excel « repart à zéro ». La solution est le format personnalisé <code>[h]:mm</code> — les crochets disent « ne remets pas le compteur à zéro ».</p>
<pre class="pseudo">=B2-A2                  // duree entre deux heures (format [h]:mm)
=(B2-A2)*24             // la meme duree en NOMBRE d'heures decimales
   *24    on convertit la fraction de journee en heures
   // 0,25 -> 6 heures ; indispensable pour multiplier par un taux horaire

=(B2-A2)*24*TauxHoraire  // le cout de l'intervention</pre>
<pre class="pseudo">=TEMPS(heures ; minutes ; secondes)   // construit une heure
=A2 + TEMPS(1;30;0)                   // ajoute 1h30</pre>

<h3>8. <span class="tag">365</span> Les nouveautés utiles</h3>
<p><strong>SEQUENCE</strong> permet de générer un calendrier d'un seul coup, sous forme de <strong>plage renversante</strong> (une formule qui remplit plusieurs cellules).</p>
<pre class="pseudo">=SEQUENCE(31 ; 1 ; DATE(2025;1;1) ; 1)
   31              nombre de lignes a generer
   1               une seule colonne
   DATE(2025;1;1)  valeur de depart
   1               pas de +1 jour
   // remplit 31 cellules avec tout le mois de janvier

Alternative toutes versions : ecrire la 1re date puis tirer la poignee vers le bas.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment Excel stocke-t-il réellement une date ?", opts: ["Comme du texte", "Comme un nombre de jours depuis le 01/01/1900", "Comme une chaîne de caractères formatée", "Comme trois cellules séparées"], a: 1, exp: "C'est un numéro de série : d'où la possibilité de faire des soustractions." },
    { type: "input", q: "Écris la formule qui renvoie la date du jour (sans l'heure).", a: ["=AUJOURDHUI()"], ph: "=AUJOURDHUI()", exp: "AUJOURDHUI() est volatile : elle se met à jour à chaque recalcul." },
    { type: "qcm", q: "Que représente la partie décimale du nombre 45658,75 ?", opts: ["Les centimes", "L'heure : 18h00", "Le numéro de semaine", "Le fuseau horaire local"], a: 1, exp: "0,75 de journée = 18 heures sur 24." },
    { type: "input", q: "Écris la formule qui renvoie le dernier jour du mois de la date en A2.", a: ["=FIN.MOIS(A2;0)"], ph: "=FIN.MOIS(A2;...)", exp: "Le second argument 0 signifie « le mois en cours »." },
    { type: "qcm", q: "Comment obtenir le PREMIER jour du mois de A2 le plus simplement ?", opts: ["=FIN.MOIS(A2;0)+1", "=FIN.MOIS(A2;-1)+1", "=A2-30", "=MOIS(A2)"], a: 1, exp: "Fin du mois précédent + 1 jour = premier jour du mois en cours." },
    { type: "input", q: "Écris la formule qui donne la date 10 jours OUVRÉS après A2, en excluant les fériés de la plage nommée Feries.", a: ["=SERIE.JOUR.OUVRE(A2;10;Feries)"], ph: "=SERIE.JOUR.OUVRE(...)", exp: "Elle saute automatiquement les week-ends et les dates fournies en 3e argument." },
    { type: "vf", q: "NB.JOURS.OUVRES compte les jours ouvrés en incluant les deux dates bornes.", a: true, exp: "Les bornes sont incluses si elles tombent un jour ouvré." },
    { type: "input", q: "Écris la formule qui calcule l'âge en années révolues d'une personne née en A2.", a: ["=DATEDIF(A2;AUJOURDHUI();\"y\")"], ph: "=DATEDIF(A2;...;\"y\")", exp: "L'unité « y » renvoie le nombre d'années complètes." },
    { type: "qcm", q: "Pourquoi DATEDIF est-elle particulière ?", opts: ["Elle nécessite d'activer un complément", "Elle n'apparaît pas dans l'assistant de fonctions", "Elle ne marche que sur 365", "Elle est volatile"], a: 1, exp: "Héritage de Lotus 1-2-3 : non documentée, sans infobulle, mais fonctionnelle." },
    { type: "vf", q: "Calculer un âge avec =(AUJOURDHUI()-A2)/365 donne un résultat toujours exact.", a: false, exp: "Les années bissextiles faussent le calcul : il faut DATEDIF." },
    { type: "qcm", q: "Dans =JOURSEM(A2;2), à quoi sert le 2 ?", opts: ["À ajouter 2 jours", "À définir lundi = 1 (convention européenne)", "À arrondir", "À compter 2 semaines"], a: 1, exp: "Le type 2 fait démarrer la semaine le lundi." },
    { type: "input", q: "Écris la formule qui convertit la durée B2-A2 en nombre d'heures décimales.", a: ["=(B2-A2)*24"], ph: "=(B2-A2)*24", exp: "La durée est une fraction de journée : ×24 donne des heures utilisables dans un calcul." },
    { type: "qcm", q: "Quel format personnalisé affiche correctement une durée de plus de 24 heures ?", opts: ["hh:mm", "[h]:mm", "jj:mm", "h:mm:ss AM/PM"], a: 1, exp: "Les crochets empêchent le compteur de repartir à zéro à 24 h." },
    { type: "vf", q: "=DATE(2025;13;1) renvoie une erreur.", a: false, exp: "Non : DATE gère le débordement et renvoie le 01/01/2026." },
    { type: "input", q: "Écris la formule qui décale la date A2 de 3 mois en avant (même jour du mois).", a: ["=MOIS.DECALER(A2;3)"], ph: "=MOIS.DECALER(A2;3)", exp: "MOIS.DECALER ajuste automatiquement si le jour n'existe pas dans le mois cible." }
  ],
  final: {
    title: "Exercice final — Un échéancier de factures",
    intro: `<p>Un tableau de factures avec une date d'émission et un délai de paiement. Il faut calculer les échéances et détecter les retards.</p>
<pre class="pseudo">      A          B            C          D         E
  1  Facture    Emission     Delai(j)   Echeance  Retard(j)
  2  F-001      05/03/2025   30
  3  F-002      28/02/2025   45
  4  F-003      15/01/2025   30

  Une plage nommee "Feries" contient les jours feries de l'annee.
  La date du jour sert de reference pour le retard.</pre>`,
    questions: [
      { type: "input", q: "En D2, calcule l'échéance à B2 + C2 JOURS OUVRÉS, en excluant les fériés.", a: ["=SERIE.JOUR.OUVRE(B2;C2;Feries)"], ph: "=SERIE.JOUR.OUVRE(B2;C2;Feries)", exp: "SERIE.JOUR.OUVRE saute week-ends et fériés et renvoie une vraie date." },
      { type: "qcm", q: "Si on écrivait simplement =B2+C2, quel serait le défaut ?", opts: ["Une erreur #VALEUR!", "L'échéance pourrait tomber un samedi ou un jour férié", "Le résultat serait du texte", "Aucun défaut"], a: 1, exp: "L'addition simple compte les jours calendaires, sans tenir compte des jours chômés." },
      { type: "input", q: "En E2, calcule le nombre de jours ouvrés de retard, ou 0 si l'échéance n'est pas dépassée.", a: ["=MAX(0;NB.JOURS.OUVRES(D2;AUJOURDHUI();Feries)-1)"], ph: "=MAX(0;NB.JOURS.OUVRES(...)-1)", exp: "MAX(0;...) neutralise les valeurs négatives ; le -1 évite de compter le jour d'échéance lui-même." },
      { type: "qcm", q: "Le résultat de D2 s'affiche « 45810 » au lieu d'une date. Que faire ?", opts: ["Refaire la formule", "Appliquer un format Date à la cellule", "Ajouter DATEVAL", "Multiplier par 24"], a: 1, exp: "La valeur est correcte : c'est le numéro de série. Seul le format d'affichage manque." },
      { type: "vf", q: "Pour connaître l'ancienneté d'une facture en mois complets, on utilise DATEDIF avec l'unité « m ».", a: true, exp: "DATEDIF(B2;AUJOURDHUI();\"m\") donne les mois révolus." }
    ],
    solution: `<p>Le réflexe : ne jamais additionner des jours « à la main » quand des week-ends sont en jeu.</p>
<pre class="pseudo">D2 -- l'echeance en jours ouvres :
=SERIE.JOUR.OUVRE(B2 ; C2 ; Feries)
   B2       date d'emission
   C2       nombre de jours OUVRES a ajouter
   Feries   plage des jours feries a sauter
   // le resultat tombe toujours un jour travaille
   // /!\ mettre la cellule au format Date, sinon on voit le numero de serie

E2 -- le retard, jamais negatif :
=MAX(0 ; NB.JOURS.OUVRES(D2 ; AUJOURDHUI() ; Feries) - 1)
   NB.JOURS.OUVRES(D2;AUJOURDHUI())   jours ouvres entre echeance et aujourd'hui
   - 1                                 les bornes sont INCLUSES : on retire
                                       le jour d'echeance lui-meme
   MAX(0 ; ...)                        si l'echeance est future, on affiche 0
                                       au lieu d'un nombre negatif

Bonus -- un indicateur lisible :
=SI(AUJOURDHUI()&gt;D2 ; "EN RETARD" ; "OK")

Bonus -- l'anciennete detaillee de la facture :
=DATEDIF(B2;AUJOURDHUI();"y") &amp; " an(s) " &amp; DATEDIF(B2;AUJOURDHUI();"ym") &amp; " mois"
   "y"    annees pleines
   "ym"   mois restants apres retrait des annees</pre>
<p>Sur Microsoft 365, tu peux générer tout l'échéancier d'un coup avec <code>=SERIE.JOUR.OUVRE(B2:B4 ; C2:C4 ; Feries)</code> : une seule formule qui « renverse » (spill) sur les trois lignes. En version antérieure, il faut recopier la formule ligne par ligne.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta formule / ton code ici…",
  items: [
  { id: "excelpro-j10", title: "Feuille de pointage : heures travaillées et coût", level: 2,
    statement: "Recopie ce relevé d'interventions. En D2 calcule la durée travaillée (heure de fin moins heure de début), en E2 cette durée convertie en heures décimales, en F2 le coût au taux de 45 €/h. En D5 affiche le TOTAL des durées. Indique aussi le format de cellule à appliquer à chaque colonne.<pre class=\"pseudo\">      A        B       C      D        E          F\n  1  Tache    Debut   Fin    Duree    Heures     Cout\n  2  Audit    08:30   12:15\n  3  Dev      13:00   18:45\n  4  Reunion  19:00   21:30\n  5  TOTAL</pre>",
    hints: [
      "Une heure est une fraction de journée : 12:15 vaut 0,510416... La soustraction fonctionne donc directement.",
      "Pour transformer une fraction de journée en heures utilisables dans un calcul, multiplie par 24.",
      "Le total dépasse 24 heures : le format hh:mm repartirait à zéro. Les crochets règlent le problème."
    ],
    solution: "D2 -- la duree brute :\n=C2-B2\n   // 12:15 - 08:30 = 0,15625 de journee, affiche 03:45\n   // Format a appliquer : Personnalise  hh:mm\n\nD5 -- le total des durees :\n=SOMME(D2:D4)\n   // total reel : 3h45 + 5h45 + 2h30 = 12h00\n   // Format OBLIGATOIRE : Personnalise  [h]:mm\n   // sans les crochets, un total de 26h s'afficherait 02:00\n\nE2 -- la duree en heures decimales :\n=(C2-B2)*24\n   (C2-B2)   fraction de journee (0,15625)\n   *24       conversion en heures (3,75)\n   // Format : Standard ou Nombre a 2 decimales\n   // NE PAS laisser un format Heure ici, sinon on relit 3,75 comme une heure\n\nF2 -- le cout :\n=(C2-B2)*24*45\n   *45   le taux horaire\n   // 3,75 h x 45 = 168,75 EUR\n   // Format : Monetaire\n   // version propre : mettre 45 dans une cellule, ex. \\$H\\$1, et ecrire\n   // =(C2-B2)*24*\\$H\\$1  -> le taux se change en un seul endroit\n\nCas d'une equipe de nuit (fin apres minuit, ex. 22:00 -> 06:00) :\n=MOD(C2-B2 ; 1)\n   MOD(...;1)   ramene le resultat negatif dans l'intervalle 0-1\n   // sans MOD, 06:00 - 22:00 = -0,666 et Excel affiche ########\n\nResultats attendus :\n  Audit    03:45 | 3,75 | 168,75 EUR\n  Dev      05:45 | 5,75 | 258,75 EUR\n  Reunion  02:30 | 2,50 | 112,50 EUR\n  TOTAL    12:00 | 12,00| 540,00 EUR",
    note: "Deux pieges concentres ici. (1) Le format [h]:mm : des que la somme des durees depasse 24 h, hh:mm affiche 02:00 pour 26 heures. Les crochets desactivent le retour a zero. (2) La multiplication par 24 : un taux horaire s'applique a un NOMBRE d'heures, pas a une fraction de journee. Oublier le *24 divise le resultat par 24 -- l'erreur la plus courante sur les feuilles de pointage." }
  ]
};
</script>
