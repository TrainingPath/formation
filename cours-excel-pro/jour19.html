<script>
var DAY = {
  num: 19,
  title: "TCD avancés : champs calculés et segments",
  subtitle: "Pousser les tableaux croisés dynamiques : calculs sur mesure et filtres visuels.",
  theory: `
<h3>1. Rappel express : le TCD</h3>
<p>Un <strong>tableau croisé dynamique</strong> (TCD) résume une grande table en la « croisant » : on glisse des champs dans quatre zones — <strong>Lignes</strong>, <strong>Colonnes</strong>, <strong>Valeurs</strong> (les nombres agrégés : somme, moyenne…) et <strong>Filtres</strong>. On l'insère par <strong>Insertion ▸ Tableau croisé dynamique</strong>. Aujourd'hui, on va au-delà : calculs personnalisés et filtres visuels.</p>
<h3>2. Changer le calcul d'un champ de valeurs</h3>
<p>Par défaut, un champ numérique est <em>sommé</em>. Clique droit sur une valeur ▸ <strong>Synthétiser les valeurs par</strong> pour choisir Moyenne, Nombre, Max… Et surtout ▸ <strong>Afficher les valeurs</strong> pour des calculs relatifs très pratiques :</p>
<pre class="pseudo">% du total general       // part de chaque ligne dans le grand total
% du total de la colonne // repartition a l'interieur d'une colonne
Difference par rapport a  // ecart avec une ligne de reference
Total cumule             // somme qui s'accumule (ventes cumulees mois apres mois)</pre>
<div class="tip">Ces options « Afficher les valeurs » évitent d'écrire des formules à côté du TCD : le calcul suit le TCD quand il change ou qu'on l'actualise.</div>
<h3>3. Le champ calculé : une formule DANS le TCD</h3>
<p>Un <strong>champ calculé</strong> ajoute une nouvelle colonne de résultats <em>calculée à partir des autres champs</em>, directement dans le TCD. Exemple : à partir de <code>CA</code> et <code>Cout</code>, créer <code>Marge = CA - Cout</code>. On l'ajoute par <strong>Analyse du tableau croisé dynamique ▸ Champs, éléments et jeux ▸ Champ calculé</strong>.</p>
<pre class="pseudo">Champ calcule "Marge"
   Formule : = CA - Cout        // utilise les NOMS des champs de la source
Champ calcule "Taux_marge"
   Formule : = Marge / CA       // un champ calcule peut en reutiliser un autre</pre>
<div class="warn">Un champ calculé opère sur les <strong>totaux</strong> de chaque cellule, pas ligne par ligne. Pour <code>= CA / Quantite</code>, le TCD calcule (somme des CA) / (somme des Quantités), pas la moyenne des ratios. Pour des calculs fins et fiables, on préfère aujourd'hui une <strong>mesure DAX</strong> via le modèle de données (jours 20-21).</div>
<h3>4. L'élément calculé : un calcul entre lignes</h3>
<p>Plus rare : l'<strong>élément calculé</strong> crée un nouvel élément <em>à l'intérieur d'un champ</em>, en combinant des éléments existants (ex. un poste « Écart T2−T1 » dans le champ Trimestre). Même menu : <strong>Champs, éléments et jeux ▸ Élément calculé</strong>. Utile mais à manier avec prudence, car il perturbe les totaux.</p>
<h3>5. Les segments (slicers) : filtrer d'un clic</h3>
<p>Un <strong>segment</strong> (en anglais <em>slicer</em>) est un <strong>filtre visuel</strong> : une boîte de gros boutons cliquables pour filtrer le TCD sans ouvrir de menu. On l'ajoute par <strong>Insertion ▸ Segment</strong> (ou <strong>Analyse du TCD ▸ Insérer un segment</strong>), en cochant le ou les champs voulus.</p>
<div class="tip">Un même segment peut piloter <strong>plusieurs TCD à la fois</strong> : clic droit sur le segment ▸ <strong>Connexions de rapport</strong> (ou Connexions), puis coche les TCD concernés. C'est la base d'un tableau de bord cohérent : un clic filtre tous les tableaux et graphiques en même temps.</p>
<h3>6. La chronologie : un segment spécial dates</h3>
<p>Pour un champ de type date, la <strong>chronologie</strong> (<strong>Insertion ▸ Chronologie</strong>) est un curseur temporel : on filtre par jour, mois, trimestre ou année en glissant, bien plus lisible qu'une liste de dates. Comme un segment, elle se connecte à plusieurs TCD.</p>
<div class="warn">Segments et chronologies exigent que le TCD soit basé sur un vrai <strong>tableau structuré</strong> (Insertion ▸ Tableau) ou sur le <strong>modèle de données</strong>. Sur une plage brute non structurée, certaines options seront grisées.</div>`,
  exercises: [
    { type: "qcm", q: "Un champ calculé dans un TCD sert à…", opts: ["Filtrer par bouton", "Ajouter une colonne calculée à partir des autres champs", "Changer les couleurs", "Trier les lignes"], a: 1, exp: "Il crée un nouveau résultat, ex. Marge = CA - Cout, dans le TCD." },
    { type: "qcm", q: "Un segment (slicer) est…", opts: ["Une formule", "Un filtre visuel à boutons cliquables", "Un type de graphique", "Une macro"], a: 1, exp: "Le segment filtre le TCD d'un clic, sans ouvrir de menu déroulant." },
    { type: "input", q: "Quel menu du ruban insère un segment ? (Insertion ▸ …)", a: ["Segment", "segment"], ph: "Insertion ▸ …", exp: "Insertion ▸ Segment ajoute un filtre visuel au TCD." },
    { type: "vf", q: "Un même segment peut piloter plusieurs TCD à la fois via les Connexions de rapport.", a: true, exp: "Clic droit ▸ Connexions de rapport pour relier le segment à plusieurs TCD." },
    { type: "qcm", q: "Pour afficher la part de chaque ligne dans le grand total, on utilise…", opts: ["Champ calculé", "Afficher les valeurs ▸ % du total général", "Un segment", "Une chronologie"], a: 1, exp: "« % du total général » donne directement la répartition, sans formule externe." },
    { type: "input", q: "À partir des champs CA et Cout, écris la formule d'un champ calculé « Marge ».", a: ["=CA-Cout", "= CA - Cout", "=CA - Cout", "CA-Cout"], ph: "= …", exp: "Le champ calculé Marge vaut = CA - Cout (on utilise les noms des champs)." },
    { type: "vf", q: "Un champ calculé travaille ligne par ligne de la source.", a: false, exp: "Il opère sur les totaux de chaque cellule (somme CA / somme Quantité), pas ligne à ligne." },
    { type: "qcm", q: "Pour filtrer un TCD par période de façon visuelle (dates), on insère…", opts: ["Un champ calculé", "Une chronologie", "Un élément calculé", "Un graphique"], a: 1, exp: "La chronologie est un curseur temporel dédié aux champs date." },
    { type: "input", q: "Menu du ruban pour un curseur temporel de dates ? (Insertion ▸ …)", a: ["Chronologie", "chronologie"], ph: "Insertion ▸ …", exp: "Insertion ▸ Chronologie crée le filtre temporel." },
    { type: "qcm", q: "Où crée-t-on un champ calculé ?", opts: ["Insertion ▸ Graphique", "Analyse du TCD ▸ Champs, éléments et jeux ▸ Champ calculé", "Accueil ▸ Coller", "Données ▸ Trier"], a: 1, exp: "Le menu Champs, éléments et jeux regroupe champs et éléments calculés." },
    { type: "vf", q: "Segments et chronologies fonctionnent mieux sur un tableau structuré ou le modèle de données.", a: true, exp: "Sur une plage brute non structurée, certaines options sont grisées." },
    { type: "qcm", q: "Pour des calculs fins et fiables sur un TCD, la méthode moderne recommandée est…", opts: ["L'élément calculé", "Une mesure DAX via le modèle de données", "Un segment", "Un graphique 3D"], a: 1, exp: "Les mesures DAX (jours 20-21) évitent les pièges des totaux du champ calculé." },
    { type: "input", q: "Option « Afficher les valeurs » qui accumule les valeurs mois après mois ? (deux mots)", a: ["Total cumulé", "Total cumule", "total cumulé"], ph: "deux mots", exp: "« Total cumulé » additionne progressivement les valeurs." },
    { type: "qcm", q: "Un élément calculé crée…", opts: ["Une nouvelle colonne de valeurs", "Un nouvel élément à l'intérieur d'un champ (ex. Écart T2−T1)", "Un segment", "Un graphique"], a: 1, exp: "L'élément calculé combine des éléments existants d'un même champ." },
    { type: "input", q: "En réutilisant le champ calculé Marge et le champ CA, écris la formule du champ « Taux_marge ».", a: ["=Marge/CA", "= Marge / CA", "=Marge / CA", "Marge/CA"], ph: "= …", exp: "Un champ calculé peut en réutiliser un autre : = Marge / CA." }
  ],
  final: {
    title: "Exercice final — Tableau de bord des ventes par région",
    intro: `<p>Un tableau structuré <code>Ventes</code> regroupe les colonnes Date, Region, Vendeur, CA, Cout. On veut un TCD qui affiche, par région, le CA total, la marge et la part de chaque région dans le total — le tout filtrable par vendeur et par période.</p>
<pre class="pseudo">Ventes : Date | Region | Vendeur | CA | Cout   // tableau structure (Insertion > Tableau)</pre>`,
    questions: [
      { type: "qcm", q: "Pour afficher la marge (CA − Cout) directement dans le TCD, on crée…", opts: ["Un segment", "Un champ calculé", "Une chronologie", "Un graphique"], a: 1, exp: "Le champ calculé ajoute la colonne Marge à partir de CA et Cout." },
      { type: "input", q: "Écris la formule du champ calculé « Marge ».", a: ["=CA-Cout", "= CA - Cout", "=CA - Cout", "CA-Cout"], ph: "= …", exp: "Marge = CA - Cout, avec les noms des champs de la source." },
      { type: "qcm", q: "Pour montrer la part de chaque région dans le CA total, on choisit sur le champ CA…", opts: ["Synthétiser par Max", "Afficher les valeurs ▸ % du total général", "Trier de Z à A", "Élément calculé"], a: 1, exp: "% du total général donne la répartition sans formule externe." },
      { type: "input", q: "Pour filtrer d'un clic par vendeur, on insère un ____ sur le champ Vendeur.", a: ["segment", "Segment"], ph: "un mot", exp: "Un segment sur Vendeur filtre le TCD par de gros boutons." },
      { type: "qcm", q: "On veut que le filtre Vendeur agisse sur DEUX TCD du tableau de bord. On utilise…", opts: ["Deux segments séparés", "Connexions de rapport du segment", "Un élément calculé", "Une macro obligatoire"], a: 1, exp: "Connexions de rapport relie un même segment à plusieurs TCD." }
    ],
    solution: `<p>Montage d'un mini tableau de bord, sans quitter le TCD :</p>
<pre class="pseudo">// 1 — Le TCD
Insertion > Tableau croise dynamique (source = tableau Ventes)
   Lignes  : Region
   Valeurs : Somme de CA

// 2 — La marge (champ calcule)
Analyse du TCD > Champs, elements et jeux > Champ calcule
   Nom : Marge     Formule : = CA - Cout     // noms des champs source
   (bonus) Taux_marge : = Marge / CA

// 3 — La part de chaque region
Clic droit sur la colonne CA > Afficher les valeurs > % du total general
   --> chaque region affiche son poids dans le CA total

// 4 — Les filtres visuels
Insertion > Segment  > Vendeur      // gros boutons cliquables
Insertion > Chronologie > Date      // curseur par mois/trimestre
Clic droit sur le segment Vendeur > Connexions de rapport
   --> cocher tous les TCD du tableau de bord : un clic filtre tout</pre>
<p>Résultat : une vue par région (CA, marge, part), pilotée par un segment Vendeur et une chronologie qui filtrent tous les tableaux ensemble. Pour des ratios parfaitement exacts, on basculera vers une mesure DAX dès le jour 21.</p>`
  }
};
</script>

<script>
var ECRITURE = {

    hints: [
      "La marge se crée avec un champ calculé : Analyse du TCD ▸ Champs, éléments et jeux ▸ Champ calculé.",

    ],
    solution: "1) TCD : Insertion > Tableau croise dynamique (source = Achats)\n   Zone LIGNES   : Categorie\n   Zone VALEURS  : le champ calcule Marge (voir 2)\n\n2) CHAMP CALCULE (la marge)\n   Analyse du TCD > Champs, elements et jeux > Champ calcule\n   Nom : Marge     Formule : = Prix_vente - Prix_achat   // noms des champs source\n   --> glisser Marge dans la zone Valeurs (Somme de Marge)\n\n3) PART DE CHAQUE CATEGORIE\n   Clic droit sur la colonne de marge > Afficher les valeurs > % du total general\n   (astuce : ajouter DEUX fois Marge dans Valeurs -> une colonne en euros, une en %)\n\n4) FILTRE VISUEL PAR MOIS\n   Insertion > Segment > cocher Mois\n   Un clic sur un bouton (ex. Mars) filtre tout le TCD\n\nResultat attendu : par categorie, la marge en euros et son poids en % ; cliquer un mois dans le segment recalcule instantanement le tableau.",
    note: "Le champ calcule Marge opere sur les totaux (somme des ventes - somme des achats), ce qui convient ici. Pour un taux de marge moyen fiable, on passerait par une mesure DAX (jour 21)." }
  ]
};
