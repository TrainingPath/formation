<script>
var DAY = {
  num: 2,
  title: "INDEX et EQUIV : l'alternative à RECHERCHEV",
  subtitle: "Le duo souple qui cherche dans tous les sens, sans les limites de RECHERCHEV.",
  theory: `
<h3>1. Pourquoi apprendre INDEX / EQUIV ?</h3>
<p>Tu connais RECHERCHEV, mais elle a deux défauts : elle ne cherche que vers la <em>droite</em> (la clé doit être en 1re colonne) et son numéro de colonne codé en dur casse dès qu'on insère une colonne. Le duo <strong>INDEX + EQUIV</strong> résout ces deux problèmes. Il fonctionne dans <strong>TOUTES les versions</strong> d'Excel (c'est l'alternative universelle à RECHERCHEX).</p>

<h3>2. INDEX : renvoyer la valeur d'une position</h3>
<p><strong>INDEX</strong> renvoie la valeur située à une <em>position</em> (numéro de ligne, et éventuellement de colonne) dans une plage. C'est un « va me chercher la case n° … ».</p>
<pre class="pseudo">=INDEX(plage ; no_ligne ; [no_colonne])
   plage        la zone dans laquelle on pioche
   no_ligne     le rang de la ligne DANS la plage (1 = 1re ligne de la plage)
   no_colonne   (facultatif) le rang de la colonne, si la plage a plusieurs colonnes</pre>
<pre class="pseudo">=INDEX(C2:C10 ; 4)      // renvoie la 4e valeur de la colonne C2:C10
=INDEX(A2:D10 ; 4 ; 3)  // renvoie la valeur ligne 4, colonne 3 de la plage</pre>

<h3>3. EQUIV : trouver la position d'une valeur</h3>
<p><strong>EQUIV</strong> (en anglais MATCH) fait l'inverse : il renvoie la <em>position</em> (un numéro) d'une valeur cherchée dans une ligne ou une colonne.</p>
<pre class="pseudo">=EQUIV(valeur_cherchee ; plage ; type)
   valeur_cherchee   la cle a retrouver
   plage             une SEULE ligne ou une SEULE colonne
   type              0 = correspondance EXACTE (a utiliser presque toujours)</pre>
<pre class="pseudo">=EQUIV("Durand" ; A2:A10 ; 0)   // renvoie 5 si "Durand" est la 5e valeur de A2:A10</pre>
<div class="warn">Le 3e argument de EQUIV : mets <strong>0</strong> pour l'exact. Les valeurs 1 ou -1 font une recherche approximative sur des données triées : source d'erreurs si tu ne maîtrises pas.</div>

<h3>4. Le duo gagnant : INDEX(…; EQUIV(…))</h3>
<p>L'idée : EQUIV trouve le <strong>numéro de ligne</strong>, et INDEX renvoie la valeur de ce rang dans la colonne voulue. C'est exactement ce que fait RECHERCHEV, mais sans ses limites.</p>
<pre class="pseudo">=INDEX(B2:B10 ; EQUIV("Durand" ; A2:A10 ; 0))
   EQUIV("Durand";A2:A10;0)   trouve la LIGNE de "Durand" dans la colonne A (ex : 5)
   INDEX(B2:B10 ; 5)          renvoie la 5e valeur de la colonne B = le resultat
   // resultat : la valeur de la colonne B en face de "Durand"</pre>
<div class="tip">Grand avantage : la colonne des clés (A) et la colonne du résultat (B) sont indépendantes. On peut donc chercher « vers la gauche » : la clé peut être à DROITE du résultat, impossible avec RECHERCHEV.</div>

<h3>5. Recherche à deux dimensions (croisée)</h3>
<p>On peut utiliser DEUX EQUIV : un pour la ligne, un pour la colonne. Idéal pour lire une valeur à l'intersection d'un tableau (ex : ventes par produit ET par mois).</p>
<pre class="pseudo">=INDEX(B2:E10 ; EQUIV("Souris";A2:A10;0) ; EQUIV("Mars";B1:E1;0))
   EQUIV("Souris";A2:A10;0)   le rang de la LIGNE du produit "Souris"
   EQUIV("Mars";B1:E1;0)      le rang de la COLONNE du mois "Mars"
   INDEX(...)                 renvoie la valeur a l'intersection ligne/colonne</pre>

<h3>6. Gérer l'absence de résultat</h3>
<p>Si la clé n'existe pas, EQUIV renvoie <code>#N/A</code>, ce qui fait échouer INDEX. On habille avec SIERREUR :</p>
<pre class="pseudo">=SIERREUR(INDEX(B2:B10;EQUIV(E2;A2:A10;0)) ; "Introuvable")
   // si E2 n'est pas trouve, affiche "Introuvable" au lieu de #N/A</pre>
<div class="warn">Compatibilité : INDEX/EQUIV existe depuis toujours (même Excel 2007). C'est le choix sûr pour partager un fichier. Sur 365/2021 tu peux préférer RECHERCHEX (jour 3), mais INDEX/EQUIV reste incontournable.</div>`,
  exercises: [
    { type: "qcm", q: "Que renvoie la fonction INDEX ?", opts: ["Une position (un numéro)", "La valeur située à une position donnée dans une plage", "Un tri", "Une somme"], a: 1, exp: "INDEX pioche la valeur au rang indiqué (ligne, et éventuellement colonne)." },
    { type: "qcm", q: "Que renvoie la fonction EQUIV ?", opts: ["La valeur cherchée", "La position (le rang) d'une valeur dans une ligne ou colonne", "Une moyenne", "Un graphique"], a: 1, exp: "EQUIV renvoie un numéro d'ordre, pas une valeur." },
    { type: "input", q: "Écris la formule qui renvoie la position de « Durand » dans la colonne A2:A10, en correspondance exacte.", a: ["=EQUIV(\"Durand\";A2:A10;0)"], ph: "=EQUIV(...)", exp: "=EQUIV(\"Durand\";A2:A10;0) : le 0 impose l'exact." },
    { type: "input", q: "Écris la formule qui renvoie la 4e valeur de la plage C2:C10.", a: ["=INDEX(C2:C10;4)"], ph: "=INDEX(...)", exp: "=INDEX(C2:C10;4) renvoie la valeur du 4e rang." },
    { type: "qcm", q: "Le 3e argument de EQUIV, pour une correspondance exacte, doit valoir…", opts: ["1", "0", "-1", "VRAI"], a: 1, exp: "0 = exact. 1 et -1 servent aux recherches approximatives sur données triées." },
    { type: "input", q: "Complète le duo : renvoie la valeur de B2:B10 en face de « Durand » cherché dans A2:A10 (exact).", a: ["=INDEX(B2:B10;EQUIV(\"Durand\";A2:A10;0))"], ph: "=INDEX(...;EQUIV(...))", exp: "EQUIV trouve la ligne, INDEX renvoie la valeur de B au même rang." },
    { type: "vf", q: "Contrairement à RECHERCHEV, INDEX/EQUIV peut chercher « vers la gauche » (clé à droite du résultat).", a: true, exp: "Les plages des clés et des résultats sont indépendantes." },
    { type: "qcm", q: "Un avantage d'INDEX/EQUIV sur RECHERCHEV face à l'insertion d'une colonne ?", opts: ["Aucun", "Pas de numéro de colonne codé en dur qui se décale", "Il trie automatiquement", "Il est plus rapide à calculer"], a: 1, exp: "On désigne directement la colonne de résultat, rien à recompter." },
    { type: "vf", q: "INDEX/EQUIV ne fonctionne que sur Excel 365.", a: false, exp: "Au contraire : il fonctionne dans toutes les versions, même anciennes." },
    { type: "input", q: "Habille le duo pour afficher « Introuvable » si E2 n'existe pas dans A2:A10 (résultat en B2:B10).", a: ["=SIERREUR(INDEX(B2:B10;EQUIV(E2;A2:A10;0));\"Introuvable\")"], ph: "=SIERREUR(INDEX(...);...)", exp: "SIERREUR remplace le #N/A d'EQUIV par un texte." },
    { type: "qcm", q: "Que renvoie EQUIV si la valeur cherchée est absente (type 0) ?", opts: ["0", "#N/A", "la 1re valeur", "VRAI"], a: 1, exp: "#N/A : valeur non disponible. INDEX échoue alors aussi." },
    { type: "input", q: "Recherche croisée : valeur à l'intersection de la ligne « Souris » (A2:A10) et colonne « Mars » (B1:E1) dans B2:E10.", a: ["=INDEX(B2:E10;EQUIV(\"Souris\";A2:A10;0);EQUIV(\"Mars\";B1:E1;0))"], ph: "=INDEX(...;EQUIV(...);EQUIV(...))", exp: "Un EQUIV pour la ligne, un pour la colonne." },
    { type: "vf", q: "Dans =INDEX(A2:D10;4;3), le 3 désigne la 3e colonne de la plage.", a: true, exp: "Le 3e argument d'INDEX est le rang de colonne dans la plage." },
    { type: "qcm", q: "Pour partager un fichier avec un collègue sous Excel 2016, quel choix est le plus sûr ?", opts: ["RECHERCHEX", "INDEX/EQUIV (compatible partout)", "Aucune recherche possible", "SOMMEPROD"], a: 1, exp: "INDEX/EQUIV existe depuis longtemps ; RECHERCHEX planterait." },
    { type: "qcm", q: "Dans =INDEX(B2:B10;EQUIV(E2;A2:A10;0)), quel est le rôle d'EQUIV ?", opts: ["Renvoyer le prix", "Fournir à INDEX le numéro de ligne du résultat", "Trier la colonne A", "Compter les lignes"], a: 1, exp: "EQUIV calcule le rang, INDEX s'en sert pour piocher la bonne valeur." }
  ],
  final: {
    title: "Exercice final — Récupérer un salaire vers la gauche",
    intro: `<p>Dans cette table RH, le nom est en colonne B et le matricule (la clé) en colonne C, à DROITE. On veut retrouver le nom à partir du matricule : RECHERCHEV en est incapable (clé à droite), INDEX/EQUIV oui.</p>
<pre class="pseudo">      A        B        C          E          F
  1  Service  Nom      Matr.      Matr. ?    Nom
  2  Ventes   Ali      M1         M3         (a calculer)
  3  Compta   Bea      M2
  4  Info     Chris    M3
  5  Ventes   Dora     M4</pre>
<p>La clé (matricule) est en C, le résultat voulu (nom) en B.</p>`,
    questions: [
      { type: "input", q: "En F2, écris le duo qui trouve le Nom (B2:B5) correspondant au matricule tapé en E2, cherché dans C2:C5 (exact).", a: ["=INDEX(B2:B5;EQUIV(E2;C2:C5;0))"], ph: "=INDEX(...;EQUIV(...))", exp: "EQUIV cherche E2 dans C, INDEX renvoie le Nom au même rang." },
      { type: "input", q: "Que renvoie cette formule pour le matricule M3 ?", a: ["Chris"], ph: "un nom", exp: "M3 est le 3e matricule → 3e nom = Chris." },
      { type: "input", q: "Quelle position EQUIV(E2;C2:C5;0) renvoie-t-il pour M3 ?", a: ["3"], ph: "un nombre", exp: "M3 est en 3e position dans C2:C5." },
      { type: "qcm", q: "Pourquoi RECHERCHEV échoue-t-elle ici ?", opts: ["Le tableau est trop petit", "La clé (matricule) est à droite du résultat (nom)", "Il manque des données", "Le matricule est un texte"], a: 1, exp: "RECHERCHEV ne cherche que vers la droite ; la clé doit être en 1re colonne." },
      { type: "input", q: "Habille la formule pour afficher « Inconnu » si le matricule n'existe pas.", a: ["=SIERREUR(INDEX(B2:B5;EQUIV(E2;C2:C5;0));\"Inconnu\")"], ph: "=SIERREUR(...)", exp: "SIERREUR intercepte le #N/A d'un matricule absent." }
    ],
    solution: `<p>Le duo INDEX/EQUIV gère la recherche « vers la gauche » :</p>
<pre class="pseudo">=INDEX(B2:B5 ; EQUIV(E2 ; C2:C5 ; 0))
   EQUIV(E2;C2:C5;0)   cherche le matricule E2 (M3) dans la colonne C
                        -> renvoie 3 (M3 est en 3e position)
   INDEX(B2:B5 ; 3)     renvoie le 3e nom de la colonne B = Chris
-> resultat : Chris

Version robuste :
=SIERREUR(INDEX(B2:B5;EQUIV(E2;C2:C5;0)) ; "Inconnu")
   // si le matricule n'existe pas, affiche "Inconnu" au lieu de #N/A</pre>
<p>À retenir : EQUIV donne la ligne, INDEX pioche la valeur. Comme les colonnes clé et résultat sont libres, on cherche dans n'importe quel sens.</p>`
  }
};
</script>
