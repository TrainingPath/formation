<script>
var DAY = {
  num: 1,
  title: "Le present perfect continuous",
  subtitle: "Have been + verbe-ing : insister sur la durée d'une action commencée dans le passé.",
  theory: `
<h3>1. À quoi sert ce temps ?</h3>
<p>Le <strong>present perfect continuous</strong> (aussi appelé <em>present perfect progressive</em>) décrit une action qui a <strong>commencé dans le passé</strong> et qui, soit <strong>continue au moment où l'on parle</strong>, soit <strong>vient tout juste de s'arrêter</strong> avec un effet visible dans le présent. Ce temps met l'accent sur la <strong>durée</strong> ou le <strong>caractère continu</strong> de l'action, plus que sur son résultat. On le traduit souvent en français par « ça fait ... que » ou par un présent accompagné de « depuis ».</p>
<pre class="pseudo">I have been waiting for an hour.   // Ca fait une heure que j'attends. (et j'attends encore)
It has been raining all day.       // Il pleut depuis ce matin. (la pluie continue)</pre>
<h3>2. La construction</h3>
<p>Il se forme en trois briques : l'auxiliaire <strong>have</strong> (ou <strong>has</strong> à la 3e personne du singulier), suivi de <strong>been</strong> (le participe passé de <em>be</em>), suivi du verbe principal en <strong>-ing</strong>.</p>
<pre class="pseudo">Sujet + have/has + been + verbe-ing

I / you / we / they   have been   working
he / she / it         has been    working</pre>
<p>À la forme négative, on ajoute <strong>not</strong> après l'auxiliaire (haven't been / hasn't been). Pour poser une question, on place l'auxiliaire devant le sujet.</p>
<pre class="pseudo">She has not been sleeping well.    // Elle ne dort pas bien ces temps-ci.
Have you been studying English?    // Est-ce que tu apprends l'anglais (ces temps-ci) ?
How long has he been living here?  // Depuis combien de temps vit-il ici ?</pre>
<h3>3. For et since : deux mots essentiels</h3>
<p>Ce temps s'accompagne très souvent d'un complément de durée. On utilise <strong>for</strong> devant une <strong>durée</strong> (combien de temps) et <strong>since</strong> devant un <strong>point de départ</strong> (depuis quand).</p>
<pre class="pseudo">for + duree :   for two hours, for three days, for a long time   // depuis + duree
since + debut : since Monday, since 2020, since I arrived        // depuis + moment precis</pre>
<div class="tip">Astuce : <strong>for a week</strong> (pendant une semaine, une durée) mais <strong>since last week</strong> (depuis la semaine dernière, un point de départ). Si tu peux répondre « combien de temps ? » c'est <em>for</em> ; si tu réponds « depuis quand ? » c'est <em>since</em>.</div>
<h3>4. Différence avec le present perfect simple</h3>
<p>Le present perfect <strong>simple</strong> (have + participe passé, vu en A2) insiste sur le <strong>résultat</strong> ou la quantité (l'action est finie, on regarde le bilan). Le present perfect <strong>continuous</strong> insiste sur l'<strong>activité elle-même</strong> et sa durée.</p>
<pre class="pseudo">I have painted three rooms.        // J'ai peint trois pieces. (resultat : elles sont finies)
I have been painting all morning.  // Je peins depuis ce matin. (l'activite, la duree)</pre>
<div class="warn">Le continu répond à « depuis combien de temps ? » ou « qu'as-tu fait pour être dans cet état ? ». Le simple répond à « combien ? » ou « c'est fait ou non ? ».</div>
<h3>5. Les verbes qui refusent le -ing</h3>
<p>Certains verbes, appelés <strong>verbes d'état</strong> (stative verbs), décrivent un état et non une action : <em>know</em> (savoir), <em>believe</em> (croire), <em>love</em> (aimer), <em>want</em> (vouloir), <em>be</em> (être), <em>have</em> au sens de posséder. On ne les met normalement <strong>pas</strong> au continu.</p>
<pre class="pseudo">I have known her for ten years.    // CORRECT : Je la connais depuis dix ans.
I have been knowing her...         // INCORRECT : know est un verbe d'etat</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la construction correcte du present perfect continuous ?", opts: ["have + verbe-ing", "have/has + been + verbe-ing", "has + being + verbe", "am/is/are + been + verbe-ing"], a: 1, exp: "Auxiliaire have/has, puis been, puis le verbe en -ing." },
    { type: "input", q: "Complète : « They ___ been playing football for two hours. » (auxiliaire)", a: ["have"], ph: "un mot", exp: "They est pluriel : on utilise have, pas has." },
    { type: "input", q: "Mets le verbe à la bonne forme : « She has been ___ (cook) all afternoon. »", a: ["cooking"], ph: "verbe en -ing", exp: "Après has been, le verbe prend -ing : cooking." },
    { type: "qcm", q: "Complète : « I have been waiting ___ 20 minutes. »", opts: ["since", "for", "during", "from"], a: 1, exp: "20 minutes est une durée : on utilise for. Since sert pour un point de départ." },
    { type: "qcm", q: "Complète : « He has been living in Paris ___ 2019. »", opts: ["for", "since", "during", "ago"], a: 1, exp: "2019 est un point de départ précis : on utilise since." },
    { type: "input", q: "Complète avec un seul mot : « How long ___ you been studying? » (auxiliaire)", a: ["have"], ph: "un mot", exp: "you se conjugue avec have : Have you been...?" },
    { type: "vf", q: "On peut dire « I have been knowing him for years » en anglais correct.", a: false, exp: "know est un verbe d'état : il ne se met pas à la forme continue. On dit I have known him." },
    { type: "qcm", q: "« I have read three books » et « I have been reading all day » : quelle différence ?", opts: ["Aucune, c'est identique", "La première insiste sur le résultat (3 livres), la seconde sur l'activité et sa durée", "La première est fausse", "La seconde parle du futur"], a: 1, exp: "Le simple donne un bilan chiffré ; le continu insiste sur l'activité en cours et sa durée." },
    { type: "input", q: "Forme négative : « It ___ not been raining today. » (auxiliaire, 3e pers.)", a: ["has"], ph: "un mot", exp: "It prend has : It has not been raining." },
    { type: "vf", q: "« since Monday » indique un point de départ, alors que « for three days » indique une durée.", a: true, exp: "since + moment de départ (Monday) ; for + durée (three days)." },
    { type: "qcm", q: "Lis : « My eyes are red and I feel tired. » Quelle phrase explique le mieux cette situation ?", opts: ["I have been crying.", "I have cried three tears.", "I cry every year.", "I will cry tomorrow."], a: 0, exp: "Le present perfect continuous explique un état présent visible (yeux rouges) par une activité récente et prolongée." },
    { type: "input", q: "Complète : « We have ___ waiting since 8 o'clock. »", a: ["been"], ph: "un mot", exp: "have + been + verbe-ing : le mot manquant est been." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["She has been work here for a year.", "She has been working here for a year.", "She have been working here for a year.", "She has working here for a year."], a: 1, exp: "has + been + working, et has (3e pers. singulier)." },
    { type: "input", q: "Traduis en anglais : « Ça fait deux heures qu'il pleut. » → « It ___ ___ ___ for two hours. » (3 mots)", a: ["has been raining"], ph: "3 mots", exp: "has been raining : has (it) + been + raining." },
    { type: "vf", q: "Le present perfect continuous peut décrire une action qui vient de s'arrêter mais dont on voit encore l'effet.", a: true, exp: "Ex : The ground is wet because it has been raining. La pluie s'est peut-être arrêtée, mais l'effet reste." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text carefully, then answer the questions.</p>
<p>Tom looks exhausted this evening. He has been training for the city marathon since January. Every morning, he has been running before work, and in the evenings he has been going to the gym. He has already run more than three hundred kilometres this year. His sister, Lucy, has been helping him with his diet for two months. She has been cooking healthy meals every day. Tom has not been sleeping very well recently because he is nervous about the race. The marathon is next Sunday, and the whole family has been waiting for this moment for a long time.</p>`,
    questions: [
      { type: "qcm", q: "How long has Tom been training for the marathon?", opts: ["For three days", "Since January", "Since Sunday", "For a year and a half"], a: 1, exp: "The text says: he has been training since January." },
      { type: "vf", q: "Lucy has been helping Tom with his diet for two months.", a: true, exp: "The text states: His sister has been helping him with his diet for two months." },
      { type: "qcm", q: "Why hasn't Tom been sleeping well?", opts: ["He drinks too much coffee", "He is nervous about the race", "He works at night", "The gym is too far"], a: 1, exp: "He has not been sleeping well because he is nervous about the race." },
      { type: "input", q: "Complete from the text: « He has been ___ before work every morning. »", a: ["running"], ph: "un mot", exp: "He has been running before work." },
      { type: "qcm", q: "When is the marathon?", opts: ["Next Sunday", "In January", "Tomorrow", "Next month"], a: 0, exp: "The marathon is next Sunday." }
    ],
    solution: `<p>Réponses : Since January ; Vrai ; He is nervous about the race ; « running » ; Next Sunday.</p>
<p>Remarque comme le texte enchaîne les formes <em>has/have been + verbe-ing</em> pour décrire des activités prolongées et récentes : <em>has been training, has been running, has been helping, has not been sleeping</em>. Le present perfect simple apparaît une seule fois (<em>has already run more than three hundred kilometres</em>) pour donner un résultat chiffré. C'est exactement la différence à retenir.</p>`
  }
};
</script>
