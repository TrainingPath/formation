<script>
var DAY = {
  num: 17,
  title: "Le vocabulaire du travail et le CV",
  subtitle: "Parler de son parcours et rédiger un CV en anglais.",
  theory: `
<h3>1. Le monde du travail : mots de base</h3>
<p>Voici le vocabulaire incontournable pour parler d'emploi. Attention aux faux amis !</p>
<pre class="pseudo">a job / a position   // un emploi, un poste
a career            // une carriere (tout un parcours)
an employer         // un employeur
an employee         // un employe
a colleague         // un/une collegue
a manager / a boss  // un chef, un responsable
a salary / wages    // un salaire (mensuel / a l'heure)
to hire / to recruit // embaucher
to fire / to lay off // licencier
to resign / to quit  // demissionner
full-time / part-time // a plein temps / a temps partiel
a permanent contract  // un CDI</pre>
<div class="warn">Faux ami : « to apply » = poser sa candidature (et NON « appliquer »). « an application » = une candidature. « to attend a meeting » = assister a une reunion (et NON « attendre »).</div>
<h3>2. Le CV en anglais</h3>
<p>En anglais britannique on dit <strong>CV</strong> (curriculum vitae) ; en anglais americain on dit <strong>resume</strong>. Un bon CV contient ces rubriques :</p>
<pre class="pseudo">Personal details      // coordonnees (nom, telephone, e-mail)
Personal statement    // un court paragraphe de presentation
Work experience       // experience professionnelle
Education             // formation, diplomes
Skills               // competences
Languages            // langues
References           // references (personnes a contacter)</pre>
<h3>3. Parler de son experience</h3>
<p>Pour decrire ce qu'on a fait, on utilise beaucoup de <strong>verbes d'action</strong> forts.</p>
<pre class="pseudo">I worked as a waiter for two years.   // J'ai travaille comme serveur pendant deux ans.
I managed a team of five people.      // J'ai dirige une equipe de cinq personnes.
I was responsible for the accounts.   // J'etais responsable de la comptabilite.
I developed new products.             // J'ai developpe de nouveaux produits.
I dealt with customers every day.     // Je gerais les clients chaque jour.</pre>
<div class="tip">Verbes d'action utiles sur un CV : <em>achieved</em> (accompli), <em>created</em> (cree), <em>improved</em> (ameliore), <em>organised</em> (organise), <em>led</em> (dirige), <em>increased</em> (augmente).</div>
<h3>4. Les competences (skills)</h3>
<p>On distingue deux types de competences :</p>
<pre class="pseudo">hard skills   // competences techniques (Excel, coding, driving)
soft skills   // qualites humaines (teamwork, communication)
I am good at solving problems.   // Je suis bon pour resoudre les problemes.
I have strong communication skills. // J'ai de solides competences en communication.</pre>
<div class="warn">Apres « good at » et « experienced in », le verbe se met en <strong>-ing</strong> : <em>good at working in a team</em>, <em>experienced in managing projects</em>.</div>
<h3>5. Les qualites recherchees</h3>
<pre class="pseudo">hard-working   // travailleur
reliable      // fiable
motivated     // motive
flexible      // souple, adaptable
organised     // organise
a team player  // quelqu'un qui aime le travail d'equipe</pre>
<div class="tip">Sur un CV, on evite le « I » a repetition dans le personal statement bref : on peut ecrire <em>Reliable and motivated assistant with three years of experience.</em></div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « to apply for a job » ?", opts: ["Appliquer un emploi", "Poser sa candidature a un emploi", "Refuser un emploi", "Quitter un emploi"], a: 1, exp: "to apply = poser sa candidature ; c'est un faux ami classique." },
    { type: "qcm", q: "Comment appelle-t-on son CV en anglais americain ?", opts: ["a CV", "a resume", "a letter", "a diploma"], a: 1, exp: "resume (americain) = CV (britannique)." },
    { type: "input", q: "Complete : « I ___ as a nurse for five years. » (verbe travailler, passe)", a: ["worked"], ph: "un verbe", exp: "worked as = j'ai travaille comme." },
    { type: "qcm", q: "Quel mot signifie « fiable » ?", opts: ["reliable", "flexible", "part-time", "salary"], a: 0, exp: "reliable = fiable ; c'est une qualite tres appreciee." },
    { type: "qcm", q: "« to hire » signifie…", opts: ["licencier", "embaucher", "demissionner", "augmenter"], a: 1, exp: "to hire / to recruit = embaucher ; le contraire est to fire." },
    { type: "input", q: "Complete avec un verbe en -ing : « I am good at ___ problems. » (resoudre)", a: ["solving"], ph: "verbe -ing", exp: "Apres good at, le verbe est en -ing : good at solving." },
    { type: "vf", q: "« a permanent contract » correspond a un CDI.", a: true, exp: "permanent contract = contrat a duree indeterminee (CDI)." },
    { type: "qcm", q: "Quelle rubrique du CV liste tes diplomes ?", opts: ["Skills", "Education", "References", "Languages"], a: 1, exp: "Education = formation et diplomes." },
    { type: "qcm", q: "« soft skills » designe…", opts: ["des competences techniques", "des qualites humaines comme la communication", "des logiciels", "des langues"], a: 1, exp: "soft skills = qualites humaines ; hard skills = competences techniques." },
    { type: "input", q: "Complete : « I was ___ for the accounts. » (responsable de)", a: ["responsible"], ph: "un adjectif", exp: "responsible for = responsable de." },
    { type: "vf", q: "« to attend a meeting » signifie « attendre une reunion ».", a: false, exp: "Faux ami : to attend = assister a. Attendre se dit to wait." },
    { type: "qcm", q: "Quel verbe d'action signifie « diriger » (passe) ?", opts: ["led", "hired", "applied", "resigned"], a: 0, exp: "led (de to lead) = dirige. I led a team = j'ai dirige une equipe." },
    { type: "qcm", q: "« part-time » veut dire…", opts: ["a plein temps", "a temps partiel", "en CDI", "au chomage"], a: 1, exp: "part-time = temps partiel ; full-time = plein temps." },
    { type: "input", q: "Complete : « She wants to ___ from her job next month. » (demissionner)", a: ["resign", "quit"], ph: "un verbe", exp: "to resign / to quit = demissionner." },
    { type: "vf", q: "Apres « experienced in », on met le verbe en -ing.", a: true, exp: "experienced in managing projects = experimente en gestion de projets." }
  ],
  final: {
    title: "Exercice final — Lire un CV",
    intro: `<p>Read this short CV extract and answer the questions.</p>
<p>Name: Thomas Lefevre. Personal statement: Reliable and motivated assistant with four years of experience in customer service. Work experience: I worked as a shop assistant for two years, then as a team leader for a large supermarket. I managed a team of six people and I was responsible for training new staff. I improved the customer feedback score by twenty per cent. Education: I studied business at college. Skills: I am good at solving problems and working under pressure. Languages: French (native), English (fluent), Spanish (basic). I am now looking for a full-time position in a dynamic company.</p>`,
    questions: [
      { type: "qcm", q: "How many years of experience does Thomas have?", opts: ["Two years", "Four years", "Six years", "Twenty years"], a: 1, exp: "The statement says four years of experience in customer service." },
      { type: "qcm", q: "What was his second job?", opts: ["Shop assistant", "Team leader", "Manager", "Trainer"], a: 1, exp: "He worked as a shop assistant, then as a team leader." },
      { type: "input", q: "Complete from the text: « I was responsible for ___ new staff. »", a: ["training"], ph: "verbe -ing", exp: "responsible for training : verbe en -ing apres for." },
      { type: "vf", q: "Thomas speaks fluent Spanish.", a: false, exp: "His Spanish is basic; his English is fluent." },
      { type: "qcm", q: "What kind of position is he looking for now?", opts: ["A part-time job", "A full-time position", "A temporary contract", "An internship"], a: 1, exp: "He is looking for a full-time position in a dynamic company." }
    ],
    solution: `<p>Reponses : 2 (four years), 2 (team leader), « training », Faux (Spanish is basic), 2 (full-time).</p>
<p>Remarque le style d'un CV : phrases courtes, verbes d'action au passe (<em>worked, managed, improved</em>), chiffres concrets (<em>twenty per cent</em>). C'est exactement ce qu'un recruteur veut voir.</p>`
  }
};
</script>

    solution: "Personal statement: Motivated and reliable assistant with three years of experience in retail. Work experience: I worked as a sales assistant for two years and then as a shift supervisor. I managed a small team and I was responsible for the daily accounts. I improved our sales by fifteen per cent. Skills: I am good at working in a team and dealing with customers. Languages: French (native), English (fluent). I am now looking for a full-time position in an international company.\n\nTraduction : Presentation : assistant motive et fiable avec trois ans d'experience dans la vente. Experience : j'ai travaille comme vendeur pendant deux ans puis comme chef d'equipe. J'ai dirige une petite equipe et j'etais responsable de la comptabilite quotidienne. J'ai augmente nos ventes de quinze pour cent. Competences : je suis bon pour le travail d'equipe et la relation client. Langues : francais (langue maternelle), anglais (courant). Je recherche maintenant un poste a plein temps dans une entreprise internationale.",

  ]
};
