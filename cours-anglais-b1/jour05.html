<script>
var DAY = {
  num: 5,
  title: "Le conditionnel de type 2",
  subtitle: "If + prétérit, would + verbe : imaginer une situation irréelle ou improbable au présent.",
  theory: `
<h3>1. Rappel : les phrases avec if</h3>
<p>Une <strong>phrase conditionnelle</strong> exprime une condition (« si... ») et sa conséquence. L'anglais distingue plusieurs types selon que la situation est réelle, imaginaire ou impossible. Tu connais déjà le <strong>type 1</strong> (situation réelle, possible dans le futur) : <em>If it rains, I will stay home</em> (S'il pleut, je resterai à la maison). Aujourd'hui, on découvre le <strong>type 2</strong>, qui sert à imaginer l'irréel.</p>
<h3>2. À quoi sert le conditionnel de type 2 ?</h3>
<p>Le <strong>conditionnel de type 2</strong> (second conditional) décrit une situation <strong>hypothétique, imaginaire ou improbable dans le présent</strong> : quelque chose qui n'est pas vrai maintenant, ou qui a peu de chances de se réaliser. On l'utilise pour rêver, donner un conseil, ou imaginer « et si... ».</p>
<pre class="pseudo">If I won the lottery, I would travel the world.
// Si je gagnais a la loterie, je voyagerais dans le monde entier. (mais je ne gagne pas)
If I were you, I would accept the job.
// A ta place, j'accepterais le travail. (conseil)</pre>
<h3>3. La construction</h3>
<p>La formule comporte deux parties. La condition (avec <strong>if</strong>) se met au <strong>prétérit</strong> (past simple). La conséquence se construit avec <strong>would</strong> + verbe (base sans <em>to</em>).</p>
<pre class="pseudo">If + sujet + preterit , sujet + would + verbe

If I had more time,   I would learn Spanish.   // Si j'avais plus de temps, j'apprendrais l'espagnol.
I would learn Spanish   if I had more time.     // (les deux ordres sont possibles)</pre>
<div class="tip">Quand la condition est en premier, on met une virgule avant la conséquence. Quand la conséquence est en premier (<em>I would... if...</em>), pas de virgule. Le sens ne change pas.</div>
<h3>4. Le cas particulier de « were »</h3>
<p>Dans le conditionnel de type 2, le verbe <strong>be</strong> devient <strong>were</strong> à <strong>toutes les personnes</strong>, y compris <em>I, he, she, it</em>. C'est une forme spéciale, différente du passé habituel (<em>I was</em>). L'expression <strong>If I were you</strong> (à ta place) est très fréquente.</p>
<pre class="pseudo">If I were rich, I would help everyone.   // Si j'etais riche, j'aiderais tout le monde.
If she were here, she would know.         // Si elle etait la, elle saurait.</pre>
<div class="warn">En anglais soutenu, on dit <em>If I were</em>, pas « If I was ». À l'oral familier, « If I was » s'entend, mais pour bien écrire, utilise <strong>were</strong> à toutes les personnes.</div>
<h3>5. Would, could, might</h3>
<p>Dans la conséquence, on peut remplacer <strong>would</strong> par <strong>could</strong> (pourrais, serait capable de) ou <strong>might</strong> (pourrais peut-être) pour nuancer.</p>
<pre class="pseudo">If I had a car, I could drive to work.       // Si j'avais une voiture, je pourrais aller au travail en voiture.
If we left now, we might catch the train.    // Si on partait maintenant, on pourrait peut-etre avoir le train.</pre>
<div class="warn">Ne mets jamais <em>would</em> dans la partie <strong>if</strong> : on ne dit pas « If I would have... ». La condition reste au prétérit : <em>If I had...</em>.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la structure du conditionnel de type 2 ?", opts: ["If + présent, will + verbe", "If + prétérit, would + verbe", "If + would, past perfect", "If + will, would + verbe"], a: 1, exp: "Condition au prétérit, conséquence avec would + verbe." },
    { type: "input", q: "Complète la conséquence : « If I had more money, I ___ buy a house. »", a: ["would"], ph: "un mot", exp: "Conséquence du type 2 : would + verbe (would buy)." },
    { type: "input", q: "Mets le verbe au prétérit : « If she ___ (know) the answer, she would tell us. »", a: ["knew"], ph: "verbe au passé", exp: "La condition est au prétérit : know / knew." },
    { type: "qcm", q: "Complète correctement : « If I ___ you, I would say sorry. »", opts: ["was", "am", "were", "would be"], a: 2, exp: "Au type 2, be devient were à toutes les personnes : If I were you." },
    { type: "vf", q: "Le conditionnel de type 2 décrit une situation réelle et certaine.", a: false, exp: "Au contraire : il décrit une situation hypothétique, imaginaire ou improbable au présent." },
    { type: "input", q: "Complète : « If we lived near the sea, we ___ swim every day. »", a: ["would", "could"], ph: "un mot", exp: "would swim (ou could swim) : conséquence du type 2." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["If I would have time, I would help.", "If I had time, I would help.", "If I have time, I would help.", "If I had time, I will help."], a: 1, exp: "Condition au prétérit (had), conséquence avec would. Jamais would dans la partie if." },
    { type: "input", q: "Complète : « If he ___ (be) taller, he would play basketball. » (forme du type 2)", a: ["were", "was"], ph: "forme de be", exp: "Au type 2, on préfère were à toutes les personnes : If he were taller." },
    { type: "qcm", q: "« If I won the lottery... » Que suggère cette condition ?", opts: ["Je gagne souvent", "C'est une situation imaginaire et improbable", "C'est déjà arrivé", "C'est certain pour demain"], a: 1, exp: "Le type 2 imagine une situation irréelle ou peu probable : gagner à la loterie." },
    { type: "input", q: "Remplace would par un modal de possibilité : « If we left now, we ___ catch the bus. » (peut-être)", a: ["might", "could"], ph: "un mot", exp: "might (ou could) exprime une possibilité dans la conséquence." },
    { type: "qcm", q: "Lis : « If people were kinder, the world would be a better place. » Que fait cette phrase ?", opts: ["Elle décrit un fait certain", "Elle imagine une situation hypothétique et son résultat", "Elle donne un ordre", "Elle parle du passé"], a: 1, exp: "Type 2 : on imagine une condition irréelle (were kinder) et sa conséquence (would be)." },
    { type: "vf", q: "Dans « I would travel if I had time », l'absence de virgule est normale car la conséquence est en premier.", a: true, exp: "Quand la conséquence précède le if, on ne met pas de virgule." },
    { type: "input", q: "Traduis la conséquence : « À ta place, je partirais. » → « If I were you, I ___ ___. » (2 mots)", a: ["would leave", "would go"], ph: "2 mots", exp: "would leave (ou would go) : conséquence après If I were you." },
    { type: "qcm", q: "« If I ___ a bird, I would fly away. »", opts: ["am", "was", "were", "will be"], a: 2, exp: "Type 2 avec be : were à toutes les personnes (If I were a bird)." },
    { type: "vf", q: "On peut utiliser could ou might à la place de would dans la conséquence du type 2.", a: true, exp: "could (capacité/possibilité) et might (possibilité incertaine) sont des variantes de would." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>Emma often dreams about a different life. If she had more free time, she would learn three languages and paint every day. She says that if she were braver, she would leave her office job and open a small bookshop by the sea. Her friend Paul is more careful. He tells her: If I were you, I would not take such a big risk without a plan. But Emma answers that if people never followed their dreams, the world would be a sad place. If she could choose any life, she would spend her days reading, writing and meeting interesting people. For now, she keeps dreaming, but she knows that one day she might find the courage to change.</p>`,
    questions: [
      { type: "qcm", q: "What would Emma do if she had more free time?", opts: ["She would sleep all day", "She would learn three languages and paint", "She would travel to Canada", "She would buy a car"], a: 1, exp: "If she had more free time, she would learn three languages and paint every day." },
      { type: "vf", q: "Paul thinks Emma should take a big risk without a plan.", a: false, exp: "Paul says: If I were you, I would NOT take such a big risk without a plan." },
      { type: "input", q: "Complete from the text: « If she ___ braver, she would open a small bookshop. » (forme de be)", a: ["were", "was"], ph: "forme de be", exp: "Type 2 : If she were braver." },
      { type: "qcm", q: "Which structure is used all through the text?", opts: ["If + present, will + verb", "If + past simple, would + verb (second conditional)", "Past perfect", "Present perfect continuous"], a: 1, exp: "Le texte enchaîne les conditionnels de type 2 : if + prétérit, would + verbe." },
      { type: "qcm", q: "What does the text suggest about Emma's dream?", opts: ["It is already real", "It is imaginary but she might act on it one day", "It is impossible forever", "She has forgotten it"], a: 1, exp: "Ce sont des hypothèses (type 2), mais elle pourrait un jour trouver le courage de changer." }
    ],
    solution: `<p>Réponses : She would learn three languages and paint ; Faux ; « were » ; If + past simple, would + verb ; It is imaginary but she might act on it one day.</p>
<p>Le texte illustre parfaitement le type 2 : chaque phrase imagine une situation irréelle (<em>if she had, if she were, if people never followed, if she could</em>) suivie d'une conséquence en <em>would</em>. Remarque aussi la formule de conseil <em>If I were you, I would not...</em>, très fréquente à l'oral.</p>`
  }
};
</script>
