var DAY = {

  title: "Raconter un événement en détail",
  subtitle: "Enchaîner les temps du passé pour un récit vivant.",
  theory: `
<h3>1. Les trois temps du récit</h3>
<p>Pour raconter, l'anglais combine trois temps du passe, chacun avec un role precis :</p>
<pre class="pseudo">Past simple    // l'action principale, ce qui se passe :  I opened the door.
Past continuous // le decor, l'action en cours :          The sun was shining.
Past perfect   // ce qui s'etait passe AVANT :            I had locked the door before I left.</pre>
<div class="tip">Image : le <strong>past continuous</strong> peint le decor de fond (« il pleuvait »), le <strong>past simple</strong> fait avancer l'histoire (« soudain le telephone a sonne »), le <strong>past perfect</strong> revient en arriere (« j'avais oublie mon parapluie »).</div>
<h3>2. Past simple vs past continuous</h3>
<pre class="pseudo">While I was cooking, the phone rang.
   // Pendant que je cuisinais, le telephone a sonne.
When she arrived, we were watching a film.
   // Quand elle est arrivee, nous regardions un film.</pre>
<div class="warn">Regle : l'action longue/de fond est au past continuous (was cooking), l'action courte qui l'interrompt est au past simple (rang). « while » va souvent avec le continuous, « when » avec le simple.</div>
<h3>3. Le past perfect : revenir en arrière</h3>
<pre class="pseudo">When we got to the station, the train had already left.
   // Quand nous sommes arrives a la gare, le train etait deja parti.
She was sad because she had failed the exam.
   // Elle etait triste parce qu'elle avait rate l'examen.</pre>
<p>Le past perfect (<strong>had</strong> + participe passe) montre qu'une action s'est produite <strong>avant</strong> une autre action passee.</p>
<h3>4. Les marqueurs de temps du récit</h3>
<pre class="pseudo">first / at first     // d'abord / au debut
then / after that    // ensuite / apres cela
suddenly             // soudain
a moment later       // un instant plus tard
in the end / finally // finalement / a la fin
as soon as           // des que</pre>
<h3>5. Rendre le récit vivant</h3>
<pre class="pseudo">It was a cold winter morning.        // decor
I was walking to work when...        // action en cours + interruption
Suddenly, I heard a strange noise.   // rebondissement
I had never seen anything like it.   // retour en arriere (past perfect)
In the end, everything was fine.     // conclusion</pre>
<div class="tip">Ajoute des adjectifs et des adverbes (slowly, quietly, terrified) et des emotions pour captiver le lecteur. Un bon recit ne dit pas seulement CE qui s'est passe, mais COMMENT on l'a vecu.</div>
<h3>6. Un exemple complet</h3>
<pre class="pseudo">Last summer, I was hiking in the mountains. The weather was
beautiful and the birds were singing. Suddenly, dark clouds
appeared and it started to rain. I realised that I had forgotten
my map. While I was looking for shelter, I met an old shepherd.
He kindly showed me the way back. In the end, I arrived home
safely, but I had learned an important lesson.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel temps decrit le decor ou l'action en cours ?", opts: ["past simple", "past continuous", "past perfect", "present"], a: 1, exp: "Le past continuous (was/were + -ing) peint le decor de fond." },
    { type: "input", q: "Complete au past continuous : « While I ___ cooking, the phone rang. » (was/were + cook)", a: ["was"], ph: "un mot", exp: "was cooking : action longue de fond." },
    { type: "qcm", q: "« When she arrived, we ___ a film. »", opts: ["were watching", "watch", "had watch", "watches"], a: 0, exp: "action en cours interrompue : past continuous, were watching." },
    { type: "qcm", q: "Quel temps exprime une action ANTERIEURE a une autre action passee ?", opts: ["past simple", "past continuous", "past perfect", "present perfect"], a: 2, exp: "Le past perfect (had + participe passe)." },
    { type: "input", q: "Complete au past perfect : « The train ___ already left when we arrived. » (had + leave)", a: ["had"], ph: "un mot", exp: "had already left : action anterieure a l'arrivee." },
    { type: "qcm", q: "« While I was reading, the lights ___ off. »", opts: ["were going", "went", "had gone", "go"], a: 1, exp: "L'action courte qui interrompt est au past simple : went off." },
    { type: "vf", q: "« while » va souvent avec le past continuous.", a: true, exp: "while + past continuous (action de fond)." },
    { type: "input", q: "Complete : « ___ , I heard a strange noise. » (soudain)", a: ["Suddenly"], ph: "un adverbe", exp: "Suddenly = soudain : marque un rebondissement." },
    { type: "qcm", q: "« She was sad because she ___ the exam. » (rater, action anterieure)", opts: ["fails", "was failing", "had failed", "fail"], a: 2, exp: "past perfect : had failed (avant d'etre triste)." },
    { type: "input", q: "Complete : « ___ as I opened the door, the cat ran out. » (des que : As s...)", a: ["As soon", "as soon"], ph: "deux mots", exp: "As soon as = des que." },
    { type: "qcm", q: "Dans « I had forgotten my map », que montre le past perfect ?", opts: ["une action future", "que j'avais oublie la carte AVANT", "une action en cours", "une habitude"], a: 1, exp: "J'avais oublie la carte avant le moment du recit." },
    { type: "vf", q: "Le past continuous se forme avec « had + participe passe ».", a: false, exp: "Faux : past continuous = was/were + -ing ; had + participe = past perfect." },
    { type: "input", q: "Complete au past continuous : « The sun ___ shining and the birds were singing. » (was/were)", a: ["was"], ph: "un mot", exp: "The sun was shining : decor de fond." },
    { type: "qcm", q: "Quel marqueur sert a conclure un recit ?", opts: ["at first", "suddenly", "in the end", "as soon as"], a: 2, exp: "in the end / finally = a la fin, pour conclure." },
    { type: "vf", q: "Un bon recit combine past continuous (decor), past simple (actions) et past perfect (retour en arriere).", a: true, exp: "C'est exactement l'alternance qui rend un recit vivant et clair." }
  ],
  final: {
    title: "Exercice final — Analyser un récit",
    intro: `<p>Read this story and answer the questions about the events and the tenses.</p>
<p>It was a rainy evening in November. Sarah was driving home from work when her car suddenly stopped. She had forgotten to check the petrol that morning, and now the tank was empty. At first, she felt worried, because the road was dark and quiet. While she was looking for her phone, a car stopped behind her. A kind woman, who had seen the problem, offered to help. They drove together to the nearest petrol station, which had just closed. Luckily, the owner had not gone home yet and agreed to open again. A moment later, Sarah had enough petrol to continue. In the end, she arrived home safely, but she never forgot to check her tank again.</p>`,
    questions: [
      { type: "qcm", q: "What was Sarah doing when her car stopped?", opts: ["Sleeping", "Driving home from work", "Cooking", "Reading"], a: 1, exp: "Sarah was driving home from work (past continuous)." },
      { type: "qcm", q: "Why was the tank empty?", opts: ["The car was old", "She had forgotten to check the petrol that morning", "Someone stole the petrol", "It was cold"], a: 1, exp: "She had forgotten to check the petrol (past perfect: action anterieure)." },
      { type: "input", q: "Complete: « While she ___ looking for her phone, a car stopped. » (was/were)", a: ["was"], ph: "un mot", exp: "past continuous : she was looking." },
      { type: "vf", q: "The petrol station was still open when they arrived.", a: false, exp: "The station had just closed; the owner agreed to open again." },
      { type: "qcm", q: "What does « the owner had not gone home yet » tell us?", opts: ["He was about to leave in the future", "He had already gone", "He was still there, he had not left before that moment", "He never went home"], a: 2, exp: "Past perfect negatif : il n'etait pas encore parti, donc il etait encore la." }
    ],
    solution: `<p>Reponses : 2 (driving home), 2 (had forgotten), « was », Faux (had just closed), 3 (still there).</p>
<p>Observe l'alternance : le decor au past continuous (was driving, was looking), les actions au past simple (stopped, offered, arrived), et les retours en arriere au past perfect (had forgotten, had seen, had not gone). C'est cette combinaison qui rend le recit clair et vivant.</p>`
  }
};
