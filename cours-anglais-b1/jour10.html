<script>
var DAY = {
  num: 10,
  title: "Used to et would : habitudes passées",
  subtitle: "Parler de ce qu'on faisait avant et qui n'existe plus aujourd'hui.",
  theory: `
<h3>1. Décrire le passé lointain qui a changé</h3>
<p>Pour parler d'<strong>habitudes ou d'états passés qui ne sont plus vrais aujourd'hui</strong>, l'anglais dispose de deux outils : <strong>used to</strong> et <strong>would</strong>. Ils traduisent souvent l'imparfait français d'habitude : « Quand j'étais petit, je jouais... », « Il y avait autrefois... ». L'idée centrale : c'était vrai <strong>avant</strong>, mais <strong>ce n'est plus le cas maintenant</strong>.</p>
<h3>2. USED TO : habitudes ET états passés</h3>
<p><strong>Used to</strong> + verbe (base) exprime une habitude passée <strong>ou</strong> un état passé qui a changé. C'est la forme la plus souple : elle marche avec les actions comme avec les états.</p>
<pre class="pseudo">I used to play football every weekend.   // Avant, je jouais au foot tous les week-ends. (plus maintenant)
There used to be a cinema here.          // Il y avait autrefois un cinema ici. (etat : il n'y en a plus)
She used to have long hair.              // Elle avait les cheveux longs avant. (etat)</pre>
<div class="warn">Attention à l'orthographe : c'est <strong>used to</strong> (avec un d), et non « use to ». Mais à la forme négative et interrogative, le d disparaît : <em>didn't use to</em>, <em>Did you use to...?</em></div>
<h3>3. Négation et question de used to</h3>
<pre class="pseudo">Affirmatif : I used to smoke.            // Avant, je fumais.
Negatif    : I didn't use to smoke.      // Avant, je ne fumais pas. (use, sans d)
Question   : Did you use to smoke?       // Est-ce que tu fumais avant ?</pre>
<h3>4. WOULD : habitudes passées répétées (actions seulement)</h3>
<p><strong>Would</strong> + verbe exprime aussi une habitude passée, mais uniquement pour des <strong>actions répétées</strong>, jamais pour des états. On l'utilise beaucoup dans les récits de souvenirs.</p>
<pre class="pseudo">Every summer, we would visit our grandparents.   // Chaque ete, on rendait visite a nos grands-parents.
My father would read us a story every night.      // Mon pere nous lisait une histoire chaque soir.</pre>
<div class="warn">Piège majeur : <strong>would NE s'emploie PAS avec les verbes d'état</strong> (be, have au sens de posséder, know, like...). On dit <em>I used to have a dog</em>, mais jamais « I would have a dog » (au sens d'habitude passée). Pour les états, seul <strong>used to</strong> convient.</div>
<h3>5. Comparaison rapide</h3>
<pre class="pseudo">                       Actions repetees   Etats passes
used to                   OUI                OUI
would                     OUI                NON</pre>
<pre class="pseudo">I used to live in Spain.   // CORRECT (etat : habiter)
I would live in Spain.     // INCORRECT au sens d'habitude passee (live est un etat ici)
We would go swimming.      // CORRECT (action repetee)</pre>
<div class="tip">Règle de sécurité : dans le doute, utilise <strong>used to</strong>, qui marche dans tous les cas. Réserve <strong>would</strong> aux actions clairement répétées, souvent avec un marqueur comme <em>every day, every summer, on Sundays</em>.</div>`,
  exercises: [
    { type: "qcm", q: "« Used to » sert à exprimer...", opts: ["une action future", "une habitude ou un état passés qui ne sont plus vrais", "une obligation présente", "un ordre"], a: 1, exp: "used to marque une habitude ou un état du passé, qui a changé depuis." },
    { type: "input", q: "Complète : « I ___ to play tennis when I was young. » (forme affirmative)", a: ["used"], ph: "un mot", exp: "Affirmatif : used to (avec un d)." },
    { type: "qcm", q: "Quelle est la forme négative correcte ?", opts: ["I didn't used to smoke.", "I didn't use to smoke.", "I don't used to smoke.", "I usedn't smoke."], a: 1, exp: "Au négatif, le d disparaît : didn't use to smoke." },
    { type: "input", q: "Complète la question : « ___ you use to live in London? » (auxiliaire)", a: ["did"], ph: "un mot", exp: "Question : Did you use to...? (use sans d)." },
    { type: "qcm", q: "« Would » (habitude passée) s'emploie...", opts: ["avec les états seulement", "avec les actions répétées seulement", "avec tout", "avec le futur"], a: 1, exp: "would ne convient qu'aux actions répétées, pas aux états." },
    { type: "vf", q: "On peut dire « I would have a dog when I was a child » pour parler d'une habitude passée.", a: false, exp: "Faux : have (posséder) est un état. would ne marche pas avec les états. On dit I used to have a dog." },
    { type: "input", q: "Complète avec used ou would : « Every summer we ___ go to the beach. » (les deux marchent, donne l'un)", a: ["would", "used"], ph: "un mot", exp: "Action répétée : would go (ou used to go) conviennent." },
    { type: "qcm", q: "Choisis la phrase correcte pour un état passé.", opts: ["There would be a shop here.", "There used to be a shop here.", "There use to be a shop here.", "There would to be a shop here."], a: 1, exp: "État passé (there be) : seul used to convient. There used to be a shop here." },
    { type: "input", q: "Corrige l'orthographe : forme affirmative de « ___ to ». (un mot)", a: ["used"], ph: "un mot", exp: "L'affirmatif s'écrit used to, avec un d." },
    { type: "vf", q: "Dans le doute, « used to » est un choix sûr car il marche pour les actions comme pour les états.", a: true, exp: "used to convient dans tous les cas ; would est limité aux actions répétées." },
    { type: "qcm", q: "Lis : « When I was a child, we would spend every August by the sea. » Que décrit cette phrase ?", opts: ["Un projet futur", "Une action répétée dans le passé (habitude)", "Un état permanent actuel", "Une obligation"], a: 1, exp: "would + action répétée : une habitude passée (chaque mois d'août)." },
    { type: "input", q: "Complète avec used : « She ___ to have very long hair. » (état passé)", a: ["used"], ph: "un mot", exp: "État passé (have = posséder) : used to (would serait incorrect ici)." },
    { type: "qcm", q: "Pourquoi « I would be shy when I was young » est-il incorrect au sens d'habitude passée ?", opts: ["be est un verbe d'action", "be est un verbe d'état, et would ne s'emploie pas avec les états", "would n'existe pas", "il manque to"], a: 1, exp: "be est un état : on doit dire I used to be shy, pas I would be shy." },
    { type: "input", q: "Traduis : « Avant, je ne buvais pas de café. » → « I ___ ___ to drink coffee. » (2 mots)", a: ["didn't use", "did not use"], ph: "2 mots", exp: "Négatif : didn't use to (use sans d)." },
    { type: "vf", q: "« would » et « used to » peuvent tous les deux décrire une action répétée du passé comme « every Sunday we would/used to go to church ».", a: true, exp: "Pour une action répétée, les deux formes fonctionnent. La différence n'apparaît que pour les états." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this text about someone's childhood, then answer the questions.</p>
<p>When I was a child, my family used to live in a small village in the mountains. Life was very different then. There used to be only one shop, and everybody knew everybody. Every morning, my grandmother would wake up at five o'clock to bake bread. My brother and I would run to the river after school and spend hours there. We didn't use to have a television, so in the evenings my father would tell us old stories by the fire. I used to be quite shy, and I would rarely speak to strangers. The village used to be full of life, but many young people have moved to the city since then. Today, the old house is empty, but I still remember those happy days.</p>`,
    questions: [
      { type: "qcm", q: "Where did the family use to live?", opts: ["In a big city", "In a small mountain village", "By the sea", "Abroad"], a: 1, exp: "My family used to live in a small village in the mountains." },
      { type: "vf", q: "The family used to have a television.", a: false, exp: "The text says: We didn't use to have a television." },
      { type: "input", q: "Complete from the text: « Every morning, my grandmother ___ wake up at five o'clock. »", a: ["would"], ph: "un mot", exp: "Action répétée : my grandmother would wake up (habitude passée)." },
      { type: "qcm", q: "Why does the text use « used to be » and not « would be » for the shy narrator?", opts: ["It is a mistake", "Because be is a state verb, and would does not work with states", "Because it is the future", "Because there is no difference"], a: 1, exp: "be est un verbe d'état : on dit I used to be shy, jamais I would be shy." },
      { type: "qcm", q: "Which idea runs through the whole text?", opts: ["Things that are still true today", "Past habits and states that have changed", "Plans for the future", "Orders and rules"], a: 1, exp: "Tout le texte décrit des habitudes et états passés qui ne sont plus vrais (le village a changé)." }
    ],
    solution: `<p>Réponses : In a small mountain village ; Faux ; « would » ; Because be is a state verb ; Past habits and states that have changed.</p>
<p>Remarque la répartition : <em>used to live, used to be, didn't use to have, used to be shy</em> (états et habitudes, avec used to), et <em>would wake up, would run, would tell, would rarely speak</em> (actions répétées, avec would). Les états passent toujours par used to ; les actions répétées acceptent les deux.</p>`
  }
};
</script>
