<script>
var DAY = {
  num: 23,
  title: "Rédiger un e-mail formel",
  subtitle: "Les formules et la structure d'un courriel professionnel.",
  theory: `
<h3>1. Formel ou informel ?</h3>
<p>Un e-mail a un ami (informel) et un e-mail a un employeur (formel) n'utilisent pas les memes mots. Comparons :</p>
<pre class="pseudo">Informel : Hi Tom, ... Thanks! Bye.
Formel :   Dear Mr Smith, ... Yours sincerely, ...</pre>
<div class="warn">Dans un e-mail formel, on evite les formes contractees : ecris <em>I would</em> et non « I'd », <em>I am writing</em> et non « I'm writing », <em>do not</em> et non « don't ».</div>
<h3>2. La formule d'appel (greeting)</h3>
<pre class="pseudo">Dear Sir or Madam,   // quand on ne connait pas le nom
Dear Mr Smith,       // homme, nom connu
Dear Ms Jones,       // femme, nom connu (neutre)
Dear Hiring Manager, // au responsable du recrutement</pre>
<div class="tip">« Ms » convient pour toute femme (marie ou non). Apres l'appel, on met une virgule et on saute une ligne.</div>
<h3>3. La phrase d'introduction (pourquoi vous écrivez)</h3>
<pre class="pseudo">I am writing to apply for the position of ...
   // Je vous ecris pour poser ma candidature au poste de ...
I am writing to ask for some information about ...
   // Je vous ecris pour demander des renseignements sur ...
I am writing with regard to your advertisement ...
   // Je vous ecris au sujet de votre annonce ...
I am writing to complain about ...
   // Je vous ecris pour me plaindre de ...</pre>
<h3>4. Le corps du message</h3>
<pre class="pseudo">I would be grateful if you could ...
   // Je vous serais reconnaissant de bien vouloir ...
Could you please send me ... ?
   // Pourriez-vous m'envoyer ... ?
Please find attached my CV.
   // Veuillez trouver ci-joint mon CV.
I look forward to hearing from you.
   // Dans l'attente de votre reponse.</pre>
<div class="warn">Apres « I would be grateful if you could » et « Could you please », le verbe est a la base (sans « to ») : <em>could you please confirm</em>, <em>could you send</em>.</div>
<h3>5. La formule de politesse finale (closing)</h3>
<pre class="pseudo">Yours sincerely,   // quand on a nomme le destinataire (Dear Mr Smith)
Yours faithfully,  // quand on a ecrit « Dear Sir or Madam »
Kind regards,      // un peu moins formel, tres courant en e-mail
Best regards,      // idem, professionnel et poli</pre>
<div class="tip">Regle britannique classique : <em>Dear Sir or Madam</em> se termine par <em>Yours faithfully</em> ; <em>Dear Mr Smith</em> se termine par <em>Yours sincerely</em>. En e-mail moderne, <em>Kind regards</em> passe partout.</div>
<h3>6. Un exemple complet</h3>
<pre class="pseudo">Dear Hiring Manager,

I am writing to apply for the position of sales assistant
advertised on your website. I have three years of experience
in retail and I am available immediately. Please find attached
my CV. I would be grateful if you could consider my application.

I look forward to hearing from you.

Kind regards,
Marie Dubois</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle formule d'appel utiliser si on ne connait pas le nom ?", opts: ["Hi there,", "Dear Sir or Madam,", "Hey,", "Dear friend,"], a: 1, exp: "Dear Sir or Madam = quand on ignore le nom du destinataire." },
    { type: "qcm", q: "Dans un e-mail formel, il faut…", opts: ["utiliser des contractions (I'm, don't)", "eviter les contractions (I am, do not)", "ecrire en majuscules", "utiliser des emojis"], a: 1, exp: "On evite les formes contractees dans un registre formel." },
    { type: "input", q: "Complete : « I am writing to ___ for the position of manager. » (poser sa candidature)", a: ["apply"], ph: "un verbe", exp: "to apply for = poser sa candidature a." },
    { type: "qcm", q: "« Please find attached my CV. » signifie…", opts: ["Attachez mon CV", "Veuillez trouver ci-joint mon CV", "J'ai perdu mon CV", "Envoyez-moi un CV"], a: 1, exp: "find attached = veuillez trouver ci-joint." },
    { type: "vf", q: "« Dear Mr Smith » se termine idealement par « Yours sincerely ».", a: true, exp: "Nom connu -> Yours sincerely ; Sir or Madam -> Yours faithfully." },
    { type: "input", q: "Complete : « Yours ___ , » (formule de fin quand on a ecrit Dear Sir or Madam)", a: ["faithfully"], ph: "un mot", exp: "Dear Sir or Madam -> Yours faithfully." },
    { type: "qcm", q: "Quelle phrase est la plus formelle pour demander quelque chose ?", opts: ["Send me the info.", "I would be grateful if you could send me the information.", "Gimme the details.", "Info please."], a: 1, exp: "I would be grateful if you could... est tres poli et formel." },
    { type: "input", q: "Complete : « I look forward to ___ from you. » (avoir des nouvelles)", a: ["hearing"], ph: "verbe -ing", exp: "look forward to + -ing : hearing from you." },
    { type: "qcm", q: "« Ms » est utilise pour…", opts: ["un homme", "toute femme, mariee ou non", "une entreprise", "un enfant"], a: 1, exp: "Ms convient pour toute femme, sans preciser le statut marital." },
    { type: "vf", q: "« Kind regards » est une formule de fin acceptable en e-mail professionnel.", a: true, exp: "Kind regards / Best regards : polies et tres courantes en e-mail." },
    { type: "qcm", q: "Quelle introduction pour une reclamation ?", opts: ["I am writing to apply...", "I am writing to complain about...", "I am writing to congratulate...", "I am writing to invite..."], a: 1, exp: "to complain about = se plaindre de." },
    { type: "input", q: "Complete : « Could you please ___ the meeting time? » (confirmer)", a: ["confirm"], ph: "un verbe", exp: "Apres Could you please, verbe a la base : confirm." },
    { type: "qcm", q: "Que remplace-t-on par « I would » dans un e-mail formel ?", opts: ["I'd", "I will", "I am", "I have"], a: 0, exp: "On evite « I'd » : on ecrit la forme complete I would." },
    { type: "input", q: "Complete : « I am writing with ___ to your advertisement. » (au sujet de : with r...)", a: ["regard"], ph: "un mot", exp: "with regard to = au sujet de, concernant." },
    { type: "vf", q: "On peut mettre des emojis dans un e-mail formel de candidature.", a: false, exp: "Jamais d'emoji dans un e-mail formel : cela nuit au serieux." }
  ],
  final: {
    title: "Exercice final — Analyser un e-mail formel",
    intro: `<p>Read this formal email and answer the questions.</p>
<p>Dear Ms Carter, I am writing to apply for the position of receptionist advertised on your website. I have two years of experience in a busy hotel, where I welcomed guests, answered the phone and managed bookings. I am reliable, organised and I speak both French and English fluently. I am available to start immediately. Please find attached my CV and a reference letter from my previous manager. I would be grateful if you could consider my application. I look forward to hearing from you. Yours sincerely, Julien Moreau.</p>`,
    questions: [
      { type: "qcm", q: "What position is Julien applying for?", opts: ["Manager", "Receptionist", "Waiter", "Cook"], a: 1, exp: "He is applying for the position of receptionist." },
      { type: "qcm", q: "Where did he get his experience?", opts: ["In a school", "In a busy hotel", "In a hospital", "In a shop"], a: 1, exp: "He has two years of experience in a busy hotel." },
      { type: "input", q: "Complete from the email: « Please find ___ my CV. »", a: ["attached"], ph: "un mot", exp: "Please find attached = veuillez trouver ci-joint." },
      { type: "vf", q: "Julien needs one month before he can start.", a: false, exp: "He is available to start immediately." },
      { type: "qcm", q: "Which closing does he use, and why is it correct?", opts: ["Yours faithfully, because the name is unknown", "Yours sincerely, because he named the person (Ms Carter)", "Hey, because it is casual", "No closing at all"], a: 1, exp: "He named the recipient (Ms Carter), so Yours sincerely is correct." }
    ],
    solution: `<p>Reponses : 2 (receptionist), 2 (busy hotel), « attached », Faux (available immediately), 2 (Yours sincerely).</p>
<p>Remarque la structure complete : appel nomme -> introduction (I am writing to apply) -> experience et qualites -> piece jointe -> demande polie -> formule de fin (I look forward to...) -> Yours sincerely. C'est le modele a reproduire.</p>`
  }
};
</script>

      "Introduction : I am writing to apply for the position of ...",

    solution: "Dear Hiring Manager,\n\nI am writing to apply for the position of sales assistant advertised on your website. I have three years of experience in retail, where I served customers, managed the till and organised the shelves. I am reliable, hard-working and good at working in a team. I am available to start next month. Please find attached my CV. I would be grateful if you could consider my application. I look forward to hearing from you.\n\nKind regards,\nCamille Petit\n\nTraduction : Madame, Monsieur (Cher responsable du recrutement), je vous ecris pour poser ma candidature au poste de vendeur annonce sur votre site web. J'ai trois ans d'experience dans la vente, ou je servais les clients, tenais la caisse et rangeais les rayons. Je suis fiable, travailleur et bon pour le travail d'equipe. Je suis disponible a partir du mois prochain. Veuillez trouver ci-joint mon CV. Je vous serais reconnaissant de bien vouloir examiner ma candidature. Dans l'attente de votre reponse. Cordialement, Camille Petit.",

  ]
};
