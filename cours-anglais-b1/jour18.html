<script>
var DAY = {
  num: 18,
  title: "L'entretien d'embauche : questions clés",
  subtitle: "Comprendre et répondre aux grandes questions d'un entretien.",
  theory: `
<h3>1. Une banque de questions et de réponses</h3>
<p>Voici les questions les plus frequentes en entretien, avec une reponse modele. Apprends les structures : elles se reutilisent presque telles quelles.</p>
<h3>2. Se presenter et parler de soi</h3>
<pre class="pseudo">Q: Tell me about yourself.            // Parlez-moi de vous.
R: I am a reliable person with three years of experience in sales.
   // Je suis quelqu'un de fiable avec trois ans d'experience dans la vente.

Q: What are your strengths?           // Quelles sont vos qualites ?
R: I am hard-working and I am good at solving problems.
   // Je suis travailleur et bon pour resoudre les problemes.

Q: What is your greatest weakness?    // Quel est votre plus grand defaut ?
R: Sometimes I am too demanding, but I am learning to delegate.
   // Parfois je suis trop exigeant, mais j'apprends a deleguer.</pre>
<div class="tip">Pour le defaut, choisis un vrai defaut mais montre que tu progresses (« but I am learning to... » = mais j'apprends a...).</div>
<h3>3. Motivation et parcours</h3>
<pre class="pseudo">Q: Why do you want this job?          // Pourquoi voulez-vous ce poste ?
R: I want to join a dynamic team and develop my skills.
   // Je veux rejoindre une equipe dynamique et developper mes competences.

Q: Why should we hire you?            // Pourquoi devrions-nous vous embaucher ?
R: Because I have the right experience and I learn quickly.
   // Parce que j'ai la bonne experience et j'apprends vite.

Q: What do you know about our company? // Que savez-vous de notre entreprise ?
R: I know you are a leader in your field and you value teamwork.
   // Je sais que vous etes un leader dans votre domaine et que vous valorisez le travail d'equipe.</pre>
<h3>4. Le futur et les questions pratiques</h3>
<pre class="pseudo">Q: Where do you see yourself in five years?  // Ou vous voyez-vous dans cinq ans ?
R: I hope to have more responsibilities and to manage a team.
   // J'espere avoir plus de responsabilites et diriger une equipe.

Q: When can you start?                       // Quand pouvez-vous commencer ?
R: I am available from the first of next month.
   // Je suis disponible a partir du premier du mois prochain.

Q: What are your salary expectations?        // Quelles sont vos pretentions salariales ?
R: I am looking for a salary in line with the market.
   // Je recherche un salaire conforme au marche.</pre>
<div class="warn">Ne reponds jamais juste « yes » ou « no ». Developpe avec une phrase complete et un exemple concret.</div>
<h3>5. Poser des questions au recruteur</h3>
<p>A la fin, le recruteur demande souvent : <em>Do you have any questions?</em> (Avez-vous des questions ?) Il faut TOUJOURS en avoir.</p>
<pre class="pseudo">What would a typical day look like?     // A quoi ressemble une journee type ?
Are there opportunities to grow?        // Y a-t-il des possibilites d'evolution ?
What are the next steps?                // Quelles sont les prochaines etapes ?</pre>
<div class="tip">Termine par une phrase de politesse : <em>Thank you for your time. I look forward to hearing from you.</em> = Merci pour votre temps. J'attends de vos nouvelles avec impatience.</div>`,
  exercises: [
    { type: "qcm", q: "Que demande « Tell me about yourself. » ?", opts: ["Votre adresse", "De vous presenter", "Votre salaire", "Vos vacances"], a: 1, exp: "C'est l'invitation a se presenter brievement." },
    { type: "qcm", q: "« What are your strengths? » demande vos…", opts: ["defauts", "qualites", "diplomes", "loisirs"], a: 1, exp: "strengths = points forts, qualites. Le contraire : weaknesses." },
    { type: "input", q: "Complete : « Why do you want this ___ ? » (poste/emploi)", a: ["job", "position"], ph: "un mot", exp: "Why do you want this job = pourquoi voulez-vous ce poste." },
    { type: "vf", q: "Pour parler de son defaut, il vaut mieux montrer qu'on progresse.", a: true, exp: "On choisit un vrai defaut mais on ajoute « but I am learning to... »." },
    { type: "qcm", q: "« Where do you see yourself in five years? » parle du…", opts: ["passe", "present", "futur", "salaire actuel"], a: 2, exp: "Question sur vos projets et votre avenir professionnel." },
    { type: "input", q: "Complete : « I am ___ from the first of next month. » (disponible)", a: ["available"], ph: "un adjectif", exp: "available = disponible ; reponse a « When can you start? »." },
    { type: "qcm", q: "Que signifie « salary expectations » ?", opts: ["expectatives de vacances", "pretentions salariales", "horaires souhaites", "diplomes requis"], a: 1, exp: "salary expectations = pretentions salariales." },
    { type: "vf", q: "Il vaut mieux repondre juste « yes » aux questions du recruteur.", a: false, exp: "Il faut developper avec une phrase complete et un exemple." },
    { type: "qcm", q: "Quelle bonne question poser au recruteur a la fin ?", opts: ["What is your name?", "Are there opportunities to grow?", "Can I leave now?", "Do you like me?"], a: 1, exp: "« Are there opportunities to grow? » montre ta motivation a evoluer." },
    { type: "input", q: "Complete la formule de fin : « I look forward to ___ from you. » (avoir des nouvelles)", a: ["hearing"], ph: "verbe -ing", exp: "look forward to + verbe en -ing : hearing from you." },
    { type: "qcm", q: "« Why should we hire you? » demande…", opts: ["pourquoi vous partir", "pourquoi vous embaucher", "quel est votre defaut", "quand commencer"], a: 1, exp: "hire = embaucher ; on demande vos atouts." },
    { type: "vf", q: "« What are your weaknesses? » demande vos points forts.", a: false, exp: "weaknesses = points faibles, defauts ; strengths = points forts." },
    { type: "qcm", q: "Une bonne fin d'entretien polie est…", opts: ["Bye.", "Thank you for your time.", "Give me the job.", "That's all."], a: 1, exp: "« Thank you for your time. » est poli et professionnel." },
    { type: "input", q: "Complete : « I want to develop my ___ . » (competences)", a: ["skills"], ph: "un nom", exp: "develop my skills = developper mes competences." },
    { type: "vf", q: "Il faut toujours preparer au moins une question a poser au recruteur.", a: true, exp: "Ne jamais dire « No, I have no questions. » : cela parait desinteresse." }
  ],
  final: {
    title: "Exercice final — Un extrait d'entretien",
    intro: `<p>Read this short interview and answer the questions.</p>
<p>Recruiter: Good morning, Sara. Tell me about yourself. Sara: Good morning. I am a motivated marketing assistant with two years of experience. Recruiter: Why do you want this job? Sara: I want to join a creative team and develop my digital skills. Recruiter: What is your greatest weakness? Sara: Sometimes I focus too much on details, but I am learning to see the bigger picture. Recruiter: Where do you see yourself in five years? Sara: I hope to become a marketing manager and lead my own projects. Recruiter: When can you start? Sara: I am available from the first of September. Recruiter: Do you have any questions? Sara: Yes, are there opportunities to grow in your company? Recruiter: Absolutely. Thank you for coming. Sara: Thank you for your time. I look forward to hearing from you.</p>`,
    questions: [
      { type: "qcm", q: "What is Sara's job?", opts: ["Sales assistant", "Marketing assistant", "Manager", "Teacher"], a: 1, exp: "She is a motivated marketing assistant with two years of experience." },
      { type: "qcm", q: "Why does she want this job?", opts: ["For a higher salary", "To join a creative team and develop digital skills", "To work part-time", "To travel"], a: 1, exp: "She wants to join a creative team and develop her digital skills." },
      { type: "input", q: "Complete: « Sometimes I focus too much on ___ . »", a: ["details"], ph: "un mot", exp: "She admits she focuses too much on details." },
      { type: "vf", q: "Sara can start from the first of September.", a: true, exp: "She says she is available from the first of September." },
      { type: "qcm", q: "What question does Sara ask the recruiter?", opts: ["What is the salary?", "Are there opportunities to grow?", "Can I leave early?", "Do you like me?"], a: 1, exp: "She asks about opportunities to grow in the company." }
    ],
    solution: `<p>Reponses : 2 (marketing assistant), 2 (creative team / digital skills), « details », Vrai (first of September), 2 (opportunities to grow).</p>
<p>Observe la structure des reponses de Sara : jamais un simple « yes », toujours une phrase complete avec un detail. C'est le secret d'un bon entretien.</p>`
  }
};
</script>

    ],
    solution: "Tell me about yourself: I am a reliable and organised assistant with three years of experience in customer service. What are your strengths? I am hard-working and I am good at working under pressure. Why do you want this job? I want to join a dynamic team and develop my skills in a growing company. Where do you see yourself in five years? I hope to have more responsibilities and to lead a small team.\n\nTraduction : Parlez-moi de vous : je suis un assistant fiable et organise avec trois ans d'experience dans le service client. Quelles sont vos qualites ? Je suis travailleur et bon pour travailler sous pression. Pourquoi voulez-vous ce poste ? Je veux rejoindre une equipe dynamique et developper mes competences dans une entreprise en croissance. Ou vous voyez-vous dans cinq ans ? J'espere avoir plus de responsabilites et diriger une petite equipe.",
