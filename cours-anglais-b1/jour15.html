<script>
var DAY = {
  num: 15,
  title: "Les articles : usages avancés",
  subtitle: "A, an, the ou rien : le choix qui trahit souvent les francophones.",
  theory: `
<h3>1. Trois possibilités, pas deux</h3>
<p>En anglais, devant un nom, on a le choix entre trois options : l'article <strong>indéfini</strong> (a / an), l'article <strong>défini</strong> (the), ou <strong>aucun article</strong> (l'article « zéro »). Le français utilise presque toujours un article (le, la, un, des...), mais l'anglais s'en passe souvent, surtout au pluriel et avec les notions générales. Ce chapitre affine ces choix.</p>
<h3>2. A / an : première mention, catégorie</h3>
<p>On utilise <strong>a</strong> (devant un son consonne) ou <strong>an</strong> (devant un son voyelle) pour un nom <strong>singulier dénombrable</strong>, quand on en parle pour la <strong>première fois</strong> ou de façon générale (un parmi d'autres). C'est le choix par défaut du son, pas de la lettre.</p>
<pre class="pseudo">a car, a house, a university        // "university" commence par un son [y] : a, pas an
an apple, an hour, an honest man     // "hour, honest" : le h est muet, donc son voyelle : an</pre>
<div class="warn">Le choix a/an dépend du <strong>son</strong>, pas de la lettre : <em>a university</em> (son [you]), <em>an hour</em> (h muet). Ne te fie pas à la première lettre écrite.</div>
<h3>3. The : quand on sait de quoi on parle</h3>
<p>On utilise <strong>the</strong> quand le nom est <strong>identifié</strong> : on en a déjà parlé, il est unique, ou le contexte le rend évident. C'est l'article de « celui-là, qu'on connaît ».</p>
<pre class="pseudo">I saw a dog. The dog was barking.    // J'ai vu un chien. Le chien aboyait. (2e mention : the)
the sun, the moon, the president     // objets uniques : the
Close the door, please.               // la porte qu'on voit tous les deux : the</pre>
<h3>4. L'article zéro : notions générales et pluriels</h3>
<p>On n'utilise <strong>aucun article</strong> pour parler de choses <strong>en général</strong>, avec les noms <strong>pluriels</strong> ou <strong>indénombrables</strong> pris au sens global, et devant beaucoup de noms propres.</p>
<pre class="pseudo">Dogs are loyal animals.       // Les chiens sont des animaux fideles. (chiens en general : rien)
I love music.                 // J'aime la musique. (notion generale : rien, pas "the music")
Water is essential.           // L'eau est essentielle. (indenombrable general : rien)</pre>
<div class="warn">Piège francophone majeur : « I like the music » signifie « j'aime CETTE musique-là (precise) ». Pour dire « j'aime la musique en général », on dit <strong>I like music</strong>, sans article.</div>
<h3>5. Cas particuliers à connaître</h3>
<pre class="pseudo">Repas :        have breakfast, lunch, dinner   // pas d'article : have lunch
Moyens :       go to school / work / bed / hospital  // sans article (l'idee, l'activite)
              go to the school (le batiment precis)  // avec the si c'est le lieu concret
Langues :      speak English, learn French     // pas d'article
Pays :         France, Japan  MAIS  the USA, the UK, the Netherlands  // pluriels/etats : the
Instruments :  play the piano, play the guitar  // the devant les instruments de musique
Sports :       play football, play tennis       // pas d'article devant les sports</pre>
<div class="tip">Retiens ces oppositions frequentes : <em>go to school</em> (etudier, l'activite) vs <em>go to the school</em> (aller au batiment) ; <em>play football</em> (sport, sans the) vs <em>play the piano</em> (instrument, avec the).</div>`,
  exercises: [
    { type: "qcm", q: "Quel article devant « hour » ? (le h est muet)", opts: ["a", "an", "the seulement", "aucun"], a: 1, exp: "hour commence par un son voyelle (h muet) : an hour." },
    { type: "qcm", q: "Quel article devant « university » ? (son [you])", opts: ["a", "an", "the toujours", "aucun"], a: 0, exp: "university commence par un son consonne [you] : a university, pas an." },
    { type: "input", q: "Complète : « I saw a cat. ___ cat was black. » (2e mention)", a: ["the"], ph: "un mot", exp: "À la deuxième mention, le nom est identifié : the cat." },
    { type: "qcm", q: "« I love ___ music » pour dire « j'aime la musique en général ». Que met-on ?", opts: ["the", "a", "an", "aucun article"], a: 3, exp: "Notion générale : aucun article. I love music. (I love the music = cette musique précise.)" },
    { type: "input", q: "Complète : « ___ dogs are loyal animals. » (les chiens en général)", a: ["aucun", "rien", "-", "no article", "0"], ph: "article ou 'aucun'", exp: "Notion générale au pluriel : pas d'article. Dogs are loyal animals." },
    { type: "qcm", q: "Choisis : « She plays ___ piano beautifully. »", opts: ["a", "the", "an", "aucun article"], a: 1, exp: "Devant les instruments de musique : the. She plays the piano." },
    { type: "qcm", q: "Choisis : « They play ___ football every weekend. »", opts: ["the", "a", "an", "aucun article"], a: 3, exp: "Devant les sports : pas d'article. They play football." },
    { type: "input", q: "Complète : « My son goes to ___ school every morning. » (l'activité d'étudier)", a: ["aucun", "rien", "-", "no article", "0"], ph: "article ou 'aucun'", exp: "go to school (l'activité) : pas d'article. Avec the, ce serait le bâtiment précis." },
    { type: "vf", q: "« I like the music » et « I like music » ont exactement le même sens.", a: false, exp: "Non : I like the music = cette musique précise ; I like music = la musique en général." },
    { type: "input", q: "Complète : « We had ___ lunch at noon. » (repas)", a: ["aucun", "rien", "-", "no article", "0"], ph: "article ou 'aucun'", exp: "Devant les repas : pas d'article. We had lunch." },
    { type: "qcm", q: "Lis : « She comes from the Netherlands but her husband is from Japan. » Pourquoi « the » devant Netherlands mais rien devant Japan ?", opts: ["C'est une erreur", "Les noms de pays pluriels ou d'États (the Netherlands, the USA) prennent the, les autres non", "the est optionnel partout", "Japan est un adjectif"], a: 1, exp: "the Netherlands, the USA, the UK (pluriels/états) prennent the ; France, Japan, Spain n'en prennent pas." },
    { type: "input", q: "Complète : « ___ sun rises in the east. » (objet unique)", a: ["the"], ph: "un mot", exp: "Objet unique : the sun." },
    { type: "qcm", q: "Choisis la phrase correcte pour une généralité.", opts: ["The water is essential for life.", "Water is essential for life.", "A water is essential for life.", "An water is essential for life."], a: 1, exp: "Indénombrable au sens général : pas d'article. Water is essential." },
    { type: "input", q: "Complète : « He speaks ___ English and ___ Spanish. » (langues)", a: ["aucun", "rien", "-", "no article", "0"], ph: "article ou 'aucun'", exp: "Devant les langues : pas d'article. He speaks English and Spanish." },
    { type: "vf", q: "Le choix entre « a » et « an » dépend du son qui suit, pas de la lettre écrite.", a: true, exp: "a university (son consonne), an hour (h muet, son voyelle). C'est le son qui décide." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>Sophie is a student who lives in Spain, but she comes from the United Kingdom. Every morning she has breakfast quickly and goes to university by bus. She is studying music, and she plays the violin in a small orchestra. In her free time, she loves art and often visits museums. Last week she saw an exhibition about the sun and the stars. She told me that education is very important to her, and that she wants to become a teacher. She speaks English, French and a little Spanish. On Sundays, she plays tennis with her friends, and in the evening they usually have dinner together in a small restaurant near the river.</p>`,
    questions: [
      { type: "qcm", q: "Which is correct in the text: does Sophie play « the violin » or « violin »?", opts: ["violin (no article)", "the violin (instruments take the)", "a violin", "an violin"], a: 1, exp: "Devant les instruments de musique : the violin." },
      { type: "vf", q: "The text says « She is studying the music » with the article « the ».", a: false, exp: "Non : la notion générale prend l'article zéro : She is studying music." },
      { type: "input", q: "Complete from the text: « She comes from ___ United Kingdom. »", a: ["the"], ph: "un mot", exp: "the United Kingdom (état/nom composé) prend the, contrairement à Spain." },
      { type: "qcm", q: "Why is there no article in « she plays tennis »?", opts: ["It is a mistake", "Sports take no article (play tennis, play football)", "tennis is uncountable and needs the", "It should be a tennis"], a: 1, exp: "Devant les sports, pas d'article : play tennis, play football." },
      { type: "qcm", q: "Why does the text say « education is very important » with no article?", opts: ["Because it is plural", "Because it is a general, uncountable idea", "Because it is a country", "By mistake"], a: 1, exp: "education pris au sens général (indénombrable) : article zéro." }
    ],
    solution: `<p>Réponses : the violin ; Faux ; « the » ; Sports take no article ; Because it is a general, uncountable idea.</p>
<p>Ce texte réunit les principaux cas : article zéro pour les généralités et repas (<em>music, art, education, breakfast, dinner</em>), <em>the</em> pour l'unique et les états composés (<em>the sun, the stars, the United Kingdom, the river</em>), <em>the</em> devant les instruments (<em>the violin</em>) mais rien devant les sports (<em>tennis</em>), et pas d'article devant les langues (<em>English, French, Spanish</em>). Ces choix sont le reflet le plus fin de ton niveau en anglais.</p>`
  }
};
</script>

  ]
};
