<body>
<script>
var DAY = {
  num: 22,
  title: "Donner son opinion, être d'accord ou non",
  subtitle: "Exprimer, nuancer et défendre un point de vue.",
  theory: `
<h3>1. Donner son opinion</h3>
<pre class="pseudo">In my opinion, ...        // A mon avis, ...
I think (that) ...        // Je pense que ...
I believe (that) ...      // Je crois que ...
As far as I am concerned, ... // En ce qui me concerne, ...
It seems to me that ...   // Il me semble que ...
Personally, I feel that ... // Personnellement, je trouve que ...</pre>
<div class="warn">Faux ami : « I am agree » est FAUX. On dit <em>I agree</em> (agree est un verbe, pas un adjectif). De meme, on dit <em>I disagree</em>, pas « I am not agree ».</div>
<h3>2. Être d'accord</h3>
<pre class="pseudo">I agree (with you).          // Je suis d'accord (avec toi).
I completely agree.          // Je suis tout a fait d'accord.
That's a good point.         // C'est un bon argument.
You are right.               // Tu as raison.
Exactly! / That's true.      // Exactement ! / C'est vrai.</pre>
<h3>3. Ne pas être d'accord (poliment)</h3>
<pre class="pseudo">I disagree.                  // Je ne suis pas d'accord.
I don't think so.            // Je ne crois pas.
I see your point, but ...    // Je comprends ton point de vue, mais ...
I am not sure about that.    // Je n'en suis pas sur.
That may be true, but ...    // C'est peut-etre vrai, mais ...</pre>
<div class="tip">Pour rester poli, commence par reconnaitre l'autre : <em>I see your point, but I think...</em> C'est plus diplomate qu'un « no » sec.</div>
<h3>4. Structurer un argument</h3>
<pre class="pseudo">Firstly, ... / First of all, ...  // Premierement, ...
Secondly, ...                      // Deuxiemement, ...
For example, ...                   // Par exemple, ...
On the one hand, ... on the other hand, ... // D'un cote, ... de l'autre, ...
However, ...                       // Cependant, ...
In conclusion, ... / To sum up, ... // Pour conclure, ...</pre>
<h3>5. Nuancer et donner une raison</h3>
<pre class="pseudo">I think so because ...       // Je le pense parce que ...
The main reason is that ...  // La raison principale est que ...
It depends on ...            // Cela depend de ...
In some ways, ...            // D'une certaine maniere, ...
To be honest, ...            // Pour etre honnete, ...</pre>
<pre class="pseudo">In my opinion, homework is useful because it helps you practise.
   // A mon avis, les devoirs sont utiles parce qu'ils aident a s'exercer.
I see your point, but too much homework is stressful.
   // Je comprends ton point de vue, mais trop de devoirs est stressant.</pre>
<div class="warn">Apres « because » on met une phrase complete (sujet + verbe) ; apres « because of » on met un nom : <em>because it rains</em> vs <em>because of the rain</em>.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I am agree with you.", "I agree with you.", "I am agree.", "I have agree."], a: 1, exp: "agree est un verbe : I agree (jamais « I am agree »)." },
    { type: "input", q: "Complete : « ___ my opinion, cats are better pets. » (a mon avis)", a: ["In"], ph: "un mot", exp: "In my opinion = a mon avis." },
    { type: "qcm", q: "« I see your point, but... » sert a…", opts: ["etre tout a fait d'accord", "exprimer un desaccord poli", "poser une question", "conclure"], a: 1, exp: "On reconnait l'autre avant d'exprimer son desaccord : c'est diplomate." },
    { type: "input", q: "Complete : « I don't ___ so. » (je ne crois pas)", a: ["think"], ph: "un verbe", exp: "I don't think so = je ne crois pas." },
    { type: "qcm", q: "Pour introduire le premier argument, on dit…", opts: ["In conclusion", "Firstly", "However", "For example"], a: 1, exp: "Firstly / First of all introduit le premier point." },
    { type: "qcm", q: "« To sum up » sert a…", opts: ["donner un exemple", "conclure", "commencer", "nuancer"], a: 1, exp: "To sum up / In conclusion = pour conclure." },
    { type: "vf", q: "« I am not agree » est une phrase correcte.", a: false, exp: "Faux : on dit « I disagree » ou « I don't agree »." },
    { type: "input", q: "Choisis because ou because of : « We stayed home ___ the rain. »", a: ["because of"], ph: "because / because of", exp: "Suivi d'un nom (the rain) : because of." },
    { type: "input", q: "Choisis because ou because of : « We stayed home ___ it was raining. »", a: ["because"], ph: "because / because of", exp: "Suivi d'une phrase (sujet + verbe) : because." },
    { type: "qcm", q: "« That's a good point. » signifie…", opts: ["Tu as tort", "C'est un bon argument", "Je ne comprends pas", "Change de sujet"], a: 1, exp: "That's a good point = c'est un bon argument (accord)." },
    { type: "qcm", q: "Pour presenter deux cotes d'un debat, on utilise…", opts: ["For example", "On the one hand... on the other hand...", "In my opinion", "Firstly"], a: 1, exp: "On the one hand... on the other hand... oppose deux points de vue." },
    { type: "input", q: "Complete : « The main ___ is that it saves time. » (raison)", a: ["reason"], ph: "un nom", exp: "The main reason is that... = la raison principale est que..." },
    { type: "vf", q: "« However » sert a introduire une idee qui contraste avec ce qui precede.", a: true, exp: "However = cependant ; il marque une opposition." },
    { type: "qcm", q: "« It depends. » veut dire…", opts: ["C'est certain", "Cela depend", "Je suis d'accord", "C'est faux"], a: 1, exp: "It depends = cela depend (nuance)." },
    { type: "input", q: "Complete : « Personally, I ___ that sport is important. » (trouver/estimer)", a: ["feel", "think", "believe"], ph: "un verbe", exp: "Personally, I feel/think that... = personnellement, je trouve que..." }
  ],
  final: {
    title: "Exercice final — Un débat sur les smartphones à l'école",
    intro: `<p>Read this short debate and answer the questions.</p>
<p>Teacher: Should students be allowed to use smartphones at school? Anna: In my opinion, yes. Firstly, phones are useful for research. Secondly, students can take photos of the board. Ben: I see your point, but I disagree. The main reason is that phones are very distracting. Many students check social media instead of listening. Anna: That may be true, but we could allow phones only during breaks. Ben: That's a good point. On the one hand, phones help learning; on the other hand, they can reduce concentration. Teacher: So what is your conclusion? Anna: To sum up, I believe phones should be allowed with clear rules. Ben: Personally, I still think the classroom should be a phone-free zone, but I agree that a few rules would help.</p>`,
    questions: [
      { type: "qcm", q: "What is Anna's opinion at the start?", opts: ["Phones should be banned", "Phones should be allowed", "She has no opinion", "Only teachers should have phones"], a: 1, exp: "In my opinion, yes: she thinks phones should be allowed." },
      { type: "qcm", q: "What is Ben's main reason against phones?", opts: ["They are expensive", "They are very distracting", "They are heavy", "They are old"], a: 1, exp: "The main reason is that phones are very distracting." },
      { type: "input", q: "Complete: « I see your point, but I ___ . »", a: ["disagree"], ph: "un verbe", exp: "Ben says: I see your point, but I disagree." },
      { type: "vf", q: "Anna suggests allowing phones only during breaks.", a: true, exp: "She says: we could allow phones only during breaks." },
      { type: "qcm", q: "What is Anna's conclusion?", opts: ["Phones should be banned", "Phones should be allowed with clear rules", "Phones are useless", "The debate is pointless"], a: 1, exp: "To sum up, phones should be allowed with clear rules." }
    ],
    solution: `<p>Reponses : 2 (allowed), 2 (distracting), « disagree », Vrai (only during breaks), 2 (allowed with clear rules).</p>
<p>Analyse la politesse du desaccord : Ben dit « I see your point, but I disagree » et Anna « That may be true, but... ». On reconnait l'autre avant d'objecter : c'est la cle d'un debat courtois.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b1-j22", title: "Défends ton opinion sur un sujet", level: 3,
    statement: "Choisis un sujet (par exemple : « Faut-il interdire les voitures en ville ? ») et ecris un paragraphe de 6 a 8 phrases qui donne ton opinion, deux arguments avec exemples, une objection possible, puis une conclusion.",
    hints: [
      "Ouvre avec In my opinion / I believe that...",
      "Structure : Firstly... Secondly... For example... However... To sum up...",
      "Reste poli face a l'objection : I see your point, but..."
    ],
    solution: "In my opinion, cars should be banned from the city centre. Firstly, there are too many cars, and they cause a lot of pollution. Secondly, the streets would be safer for children and cyclists. For example, in some European cities, the centre is already car-free and people are happier. I see the point that some drivers need their car for work; however, we could allow deliveries in the early morning. To sum up, I believe a car-free centre would make the city cleaner and more pleasant, as long as public transport is good.\n\nTraduction : A mon avis, les voitures devraient etre interdites dans le centre-ville. Premierement, il y a trop de voitures, et elles provoquent beaucoup de pollution. Deuxiemement, les rues seraient plus sures pour les enfants et les cyclistes. Par exemple, dans certaines villes europeennes, le centre est deja sans voiture et les gens sont plus heureux. Je comprends que certains conducteurs aient besoin de leur voiture pour le travail ; cependant, on pourrait autoriser les livraisons tot le matin. Pour conclure, je crois qu'un centre sans voiture rendrait la ville plus propre et plus agreable, a condition que les transports en commun soient bons.",
    note: "Un bon paragraphe d'opinion suit toujours ce fil : position -> arguments -> exemple -> objection reconnue -> conclusion. Les connecteurs sont ton squelette." }
  ]
};
</script>
