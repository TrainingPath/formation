<script>
var DAY = {
  num: 13,
  title: "Les phrasal verbs courants",
  subtitle: "Verbe + particule : quand un petit mot change tout le sens.",
  theory: `
<h3>1. Qu'est-ce qu'un phrasal verb ?</h3>
<p>Un <strong>phrasal verb</strong> (verbe à particule) est un verbe suivi d'un petit mot appelé <strong>particule</strong> (up, down, on, off, out, in, away...). Ensemble, ils forment une expression dont le sens est souvent <strong>différent</strong> du verbe seul. Par exemple, <em>look</em> = regarder, mais <em>look after</em> = s'occuper de, et <em>look for</em> = chercher. Impossible de deviner : il faut les apprendre comme du vocabulaire.</p>
<pre class="pseudo">give up   = abandonner, arreter        // I gave up smoking. (J'ai arrete de fumer.)
find out  = decouvrir, apprendre        // I found out the truth. (J'ai decouvert la verite.)
look after= s'occuper de                 // She looks after her sister. (Elle s'occupe de sa soeur.)</pre>
<h3>2. Une liste de phrasal verbs très utiles</h3>
<pre class="pseudo">get up      = se lever              turn on / off = allumer / eteindre
get on with = bien s'entendre avec  put on / take off = mettre / enlever (vetement)
give up     = abandonner            look for    = chercher
find out    = decouvrir             look after  = s'occuper de
pick up     = ramasser, aller chercher   throw away = jeter
put off     = reporter              carry on / go on = continuer
run out of  = etre a court de       deal with   = gerer, s'occuper de
come across = tomber sur (par hasard)   set off    = partir (en voyage)</pre>
<h3>3. Phrasal verbs séparables ou non</h3>
<p>Certains phrasal verbs sont <strong>séparables</strong> : le complément peut se placer <strong>entre</strong> le verbe et la particule. Si le complément est un <strong>pronom</strong> (it, them...), il DOIT se mettre au milieu.</p>
<pre class="pseudo">Turn off the light.   /   Turn the light off.    // les deux sont corrects (nom)
Turn it off.                                       // OBLIGATOIRE avec un pronom : jamais "turn off it"</pre>
<div class="warn">Avec un pronom, la particule passe après : <em>Turn it off</em> (correct), « Turn off it » (incorrect). Ce piège revient sans arrêt.</div>
<h3>4. Phrasal verbs inséparables</h3>
<p>D'autres sont <strong>inséparables</strong> : le complément reste toujours <strong>après</strong> la particule, même si c'est un pronom. C'est souvent le cas de ceux avec <em>after, for, into, across</em>.</p>
<pre class="pseudo">She looks after them.        // CORRECT : le complement reste apres
She looks them after.        // INCORRECT
I'm looking for it.          // CORRECT : looking for est inseparable</pre>
<h3>5. Comment les apprendre efficacement ?</h3>
<p>Les phrasal verbs sont partout dans l'anglais courant : à l'oral, ils sont souvent préférés à leurs équivalents plus « savants » (<em>find out</em> plutôt que <em>discover</em>, <em>put off</em> plutôt que <em>postpone</em>). Le meilleur moyen de les mémoriser est de les rencontrer <strong>en contexte</strong>, dans des phrases complètes, plutôt qu'en listes isolées.</p>
<div class="tip">Astuce : regroupe-les par verbe (get up, get on, get off, get over...) ou par thème (voyage : set off, check in, get on ; travail : carry on, deal with, take over). Le contexte aide la mémoire.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie le phrasal verb « give up » ?", opts: ["Donner", "Abandonner, arrêter", "Se lever", "Recevoir"], a: 1, exp: "give up = abandonner / arrêter (I gave up smoking)." },
    { type: "input", q: "Complète : « I need to ___ up early tomorrow. » (se lever)", a: ["get"], ph: "un mot", exp: "get up = se lever : I need to get up early." },
    { type: "qcm", q: "Que signifie « look after » ?", opts: ["Chercher", "Regarder derrière", "S'occuper de", "Ressembler à"], a: 2, exp: "look after = s'occuper de (She looks after her sister)." },
    { type: "qcm", q: "Que signifie « find out » ?", opts: ["Sortir", "Découvrir, apprendre", "Chercher partout", "Perdre"], a: 1, exp: "find out = découvrir / apprendre une information." },
    { type: "input", q: "Complète : « Please turn ___ the lights, it's too dark. » (allumer)", a: ["on"], ph: "un mot", exp: "turn on = allumer : turn on the lights." },
    { type: "qcm", q: "Avec un pronom, comment place-t-on la particule d'un phrasal verb séparable ? Ex : allume-la.", opts: ["Turn on it", "Turn it on", "It turn on", "On turn it"], a: 1, exp: "Avec un pronom, la particule passe après : Turn it on. Jamais Turn on it." },
    { type: "input", q: "Complète : « I'm looking ___ my keys, I can't find them. » (chercher)", a: ["for"], ph: "un mot", exp: "look for = chercher : looking for my keys." },
    { type: "vf", q: "On peut dire « Turn off it » quand le complément est un pronom.", a: false, exp: "Faux : avec un pronom, on dit Turn it off. La particule passe après le pronom." },
    { type: "input", q: "Complète : « We had to put ___ the meeting until Friday. » (reporter)", a: ["off"], ph: "un mot", exp: "put off = reporter : put off the meeting." },
    { type: "qcm", q: "Que signifie « run out of » ?", opts: ["Courir dehors", "Être à court de", "Traverser", "Éviter"], a: 1, exp: "run out of = être à court de : We've run out of milk." },
    { type: "qcm", q: "Lis : « When I was cleaning the attic, I came across some old photos. » Que signifie « came across » ?", opts: ["A traversé la rue", "Est tombé dessus par hasard", "A jeté", "A caché"], a: 1, exp: "come across = tomber sur quelque chose par hasard." },
    { type: "input", q: "Complète : « Don't throw ___ that box, I still need it. » (jeter)", a: ["away"], ph: "un mot", exp: "throw away = jeter : throw away the box." },
    { type: "qcm", q: "Choisis la phrase correcte avec le pronom.", opts: ["I picked up it.", "I picked it up.", "I up picked it.", "I it picked up."], a: 1, exp: "pick up est séparable : avec un pronom, I picked it up." },
    { type: "input", q: "Complète : « How do you ___ on with your new colleagues? » (bien s'entendre)", a: ["get"], ph: "un mot", exp: "get on with = bien s'entendre avec : get on with your colleagues." },
    { type: "vf", q: "À l'oral, l'anglais préfère souvent « find out » à « discover » et « put off » à « postpone ».", a: true, exp: "Les phrasal verbs sont très courants et souvent préférés à leurs équivalents plus formels." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>Last month, I decided to give up my job in the city and move to the countryside. At first, my friends tried to talk me out of it, but I had already made up my mind. I had to deal with a lot of paperwork, and I nearly ran out of money during the move. On the first morning, I got up at six and set off to explore my new village. While I was walking, I came across a friendly old farmer who offered to help me. He is now teaching me how to look after chickens and grow vegetables. Sometimes things go wrong, and I have to carry on even when I'm tired. But I have never regretted my decision, and I find out something new about country life every single day.</p>`,
    questions: [
      { type: "qcm", q: "What did the narrator give up?", opts: ["Their job in the city", "Their car", "Their studies", "Their friends"], a: 0, exp: "I decided to give up my job in the city (give up = abandonner)." },
      { type: "vf", q: "The narrator came across a friendly old farmer while walking.", a: true, exp: "come across = tomber sur par hasard : the text says this directly." },
      { type: "input", q: "Complete from the text: « He is teaching me how to look ___ chickens. » (s'occuper de)", a: ["after"], ph: "un mot", exp: "look after = s'occuper de : look after chickens." },
      { type: "qcm", q: "What does « carry on » mean in the text?", opts: ["To carry bags", "To continue", "To stop", "To complain"], a: 1, exp: "carry on = continuer : I have to carry on even when I'm tired." },
      { type: "qcm", q: "Why is this text full of phrasal verbs?", opts: ["It is a mistake", "Because phrasal verbs are very natural in everyday English", "Because it is very formal", "Because it is a poem"], a: 1, exp: "Les phrasal verbs sont typiques de l'anglais quotidien et rendent le texte naturel." }
    ],
    solution: `<p>Réponses : Their job in the city ; Vrai ; « after » ; To continue ; Because phrasal verbs are very natural in everyday English.</p>
<p>Compte les phrasal verbs de ce texte : <em>give up, talk out of, make up (one's mind), deal with, run out of, get up, set off, come across, look after, carry on, find out</em>. Ils sont partout dans l'anglais courant. N'oublie pas la règle du pronom : avec un pronom, la particule d'un verbe séparable passe après (turn it off).</p>`
  }
};
</script>
