  title: "Les questions indirectes",
  subtitle: "Poser une question poliment, sans inversion ni auxiliaire do.",
  theory: `
<h3>1. Question directe et question indirecte</h3>
<p>Une <strong>question directe</strong> est la question normale, avec inversion : <em>Where is the station?</em> (Où est la gare ?). Une <strong>question indirecte</strong> intègre cette question dans une phrase plus longue et plus <strong>polie</strong> : <em>Could you tell me where the station is?</em> (Pourriez-vous me dire où se trouve la gare ?). C'est très utile pour être poli avec un inconnu ou dans un contexte formel.</p>
<h3>2. Les phrases d'introduction</h3>
<p>La question indirecte commence par une formule d'introduction polie, puis contient la vraie question.</p>
<pre class="pseudo">Could you tell me...        // Pourriez-vous me dire...
Do you know...              // Savez-vous...
I wonder...                 // Je me demande...
Would you mind telling me...  // Cela vous derangerait-il de me dire...
Can you tell me...          // Pouvez-vous me dire...</pre>
<h3>3. La règle d'or : plus d'inversion !</h3>
<p>Dans la partie « question » de la phrase indirecte, on revient à l'<strong>ordre normal</strong> : sujet + verbe. On <strong>supprime l'inversion</strong> et on <strong>supprime l'auxiliaire do/does/did</strong>.</p>
<pre class="pseudo">Direct   : Where is the station?
Indirect : Could you tell me where the station is?     // is passe APRES le sujet

Direct   : What time does the shop open?
Indirect : Do you know what time the shop opens?       // plus de does, verbe conjugue : opens</pre>
<div class="warn">Erreur classique : « Do you know where is the station? ». C'est FAUX. La bonne forme est <em>Do you know where the station is?</em> (sujet + verbe, pas d'inversion).</div>
<h3>4. Les questions fermées (oui/non) : if / whether</h3>
<p>Si la question directe attend une réponse <strong>oui ou non</strong> (elle commence par un auxiliaire, pas par un mot en wh-), on introduit la partie question par <strong>if</strong> ou <strong>whether</strong> (si).</p>
<pre class="pseudo">Direct   : Is the museum open on Sundays?
Indirect : Do you know if the museum is open on Sundays?   // if + ordre normal

Direct   : Did she call?
Indirect : I wonder whether she called.                    // whether + ordre normal, sans did</pre>
<div class="tip">Pour les questions en <strong>wh-</strong> (where, what, when, who, why, how), on garde le mot interrogatif. Pour les questions <strong>oui/non</strong>, on met <strong>if</strong> ou <strong>whether</strong> à la place.</div>
<h3>5. Récapitulatif de la transformation</h3>
<pre class="pseudo">1. Ajouter une introduction polie (Could you tell me..., Do you know...)
2. Garder le mot en wh-, OU mettre if/whether pour une question oui/non
3. Remettre l'ordre normal : sujet + verbe
4. Supprimer do / does / did (et conjuguer le verbe normalement)
5. Enlever le point d'interrogation SAUF si toute la phrase est une question</pre>
<pre class="pseudo">Where does he live?  ->  Do you know where he lives?     // le "?" reste (Do you know... est une question)
Where does he live?  ->  I wonder where he lives.         // pas de "?" (I wonder... est une affirmation)</pre>
<div class="warn">Le point d'interrogation dépend de l'introduction : <em>Could you tell me...?</em> et <em>Do you know...?</em> sont des questions (avec « ? »), mais <em>I wonder...</em> est une affirmation (sans « ? »).</div>`,
  exercises: [
    { type: "qcm", q: "Dans une question indirecte, l'ordre des mots dans la partie question est...", opts: ["inversion (verbe avant sujet)", "ordre normal (sujet + verbe)", "sans verbe", "toujours au passif"], a: 1, exp: "On revient à l'ordre normal sujet + verbe, sans inversion." },
    { type: "qcm", q: "Transforme : « Where is the bank? » → « Could you tell me... »", opts: ["where is the bank?", "where the bank is?", "where does the bank is?", "is where the bank?"], a: 1, exp: "Ordre normal : where the bank is (le verbe is passe après le sujet)." },
    { type: "input", q: "Complète : « Do you know what time the film ___? » (start, 3e pers.)", a: ["starts"], ph: "un mot", exp: "Plus de does : on conjugue directement le verbe (the film starts)." },
    { type: "qcm", q: "Pour une question oui/non, on introduit la partie question par...", opts: ["what", "where", "if ou whether", "who"], a: 2, exp: "Question fermée (oui/non) : if ou whether." },
    { type: "input", q: "Transforme : « Is the shop open? » → « Do you know ___ the shop is open? » (un mot)", a: ["if", "whether"], ph: "un mot", exp: "Question oui/non : if (ou whether) the shop is open." },
    { type: "vf", q: "« Do you know where is the station? » est correct.", a: false, exp: "Faux : pas d'inversion. La bonne forme est Do you know where the station is?" },
    { type: "input", q: "Complète sans auxiliaire : « I wonder where she ___ (live). »", a: ["lives"], ph: "un mot", exp: "Ordre normal, verbe conjugué, sans does : where she lives." },
    { type: "qcm", q: "Choisis la question indirecte correcte.", opts: ["Can you tell me what does he want?", "Can you tell me what he wants?", "Can you tell me what wants he?", "Can you tell me does what he want?"], a: 1, exp: "Ordre normal sans does : what he wants." },
    { type: "input", q: "Transforme : « Did she call? » → « I wonder ___ she called. » (un mot)", a: ["if", "whether"], ph: "un mot", exp: "Question oui/non rapportée : if/whether, sans did (she called)." },
    { type: "qcm", q: "Quelle phrase indirecte se termine par un point d'interrogation ?", opts: ["I wonder where he lives", "Could you tell me where he lives?", "I don't know where he lives", "I'm not sure where he lives"], a: 1, exp: "Could you tell me...? est une question, donc « ? ». I wonder... est une affirmation, sans « ? »." },
    { type: "input", q: "Complète : « Do you know how much this ___ (cost)? »", a: ["costs"], ph: "un mot", exp: "Ordre normal, verbe conjugué : how much this costs." },
    { type: "vf", q: "« I wonder if the museum is open » n'a pas besoin de point d'interrogation.", a: true, exp: "I wonder... est une affirmation : pas de point d'interrogation, même si le sens est interrogatif." },
    { type: "qcm", q: "Lis : « A tourist stops you and says: Excuse me, do you know where the nearest pharmacy is? » Cette question est...", opts: ["directe et impolie", "indirecte et polie", "grammaticalement fausse", "au passif"], a: 1, exp: "C'est une question indirecte polie : Do you know where... is? (ordre normal, sans inversion interne)." },
    { type: "input", q: "Transforme : « What is your name? » → « May I ask what your name ___? »", a: ["is"], ph: "un mot", exp: "Ordre normal : what your name is." },
    { type: "qcm", q: "Pourquoi utilise-t-on les questions indirectes ?", opts: ["Pour aller plus vite", "Pour être plus poli, surtout avec des inconnus ou dans un contexte formel", "Pour poser des questions au passé", "Elles sont obligatoires"], a: 1, exp: "Les questions indirectes adoucissent la demande et la rendent plus polie." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short dialogue between a tourist and a local, then answer the questions.</p>
<p>Tourist: Excuse me, could you tell me where the train station is? Local: Yes, it's just around the corner. Tourist: Thank you. Do you also know what time the next train to London leaves? Local: I'm not sure, but I think it leaves every hour. Tourist: I see. And do you know if there is a ticket machine at the station? Local: Yes, there are two of them near the entrance. Tourist: Great. One last thing: I wonder whether the trains are usually crowded in the morning. Local: They can be, so I'd arrive early if I were you. Tourist: That's very helpful. May I ask how long the journey takes? Local: About an hour. Have a good trip!</p>`,
    questions: [
      { type: "qcm", q: "How does the tourist ask about the station?", opts: ["Where is the train station?", "Could you tell me where the train station is?", "Train station where?", "Is where the station?"], a: 1, exp: "Question indirecte polie : Could you tell me where the train station is?" },
      { type: "vf", q: "The tourist asks « do you know if there is a ticket machine at the station? ».", a: true, exp: "C'est une question indirecte oui/non introduite par if." },
      { type: "input", q: "Complete from the text: « Do you also know what time the next train to London ___? »", a: ["leaves"], ph: "un mot", exp: "Ordre normal, verbe conjugué sans does : the train leaves." },
      { type: "qcm", q: "Which sentence does NOT end with a question mark?", opts: ["Could you tell me where the station is?", "Do you know if there is a ticket machine?", "I wonder whether the trains are crowded", "May I ask how long the journey takes?"], a: 2, exp: "I wonder... est une affirmation : pas de point d'interrogation." },
      { type: "qcm", q: "Why does the tourist use indirect questions?", opts: ["To sound polite with a stranger", "Because he is angry", "Because the questions are about the past", "By mistake"], a: 0, exp: "Les questions indirectes rendent les demandes plus polies, idéal avec un inconnu." }
    ],
    solution: `<p>Réponses : Could you tell me where the train station is? ; Vrai ; « leaves » ; I wonder whether the trains are crowded ; To sound polite with a stranger.</p>
<p>Chaque question du touriste suit la règle : introduction polie (<em>Could you tell me, Do you know, I wonder, May I ask</em>), ordre normal sujet + verbe, plus d'auxiliaire do/does, et <em>if/whether</em> pour les questions oui/non. Seule la phrase avec <em>I wonder</em> ne prend pas de point d'interrogation.</p>`
  }
};
</script>
