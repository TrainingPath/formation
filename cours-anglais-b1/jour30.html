<script>
var DAY = {
  num: 30,
  title: "Bilan B1 : conversation de 10 minutes",
  subtitle: "Une trame complète pour tenir une conversation naturelle.",
  theory: `
<h3>1. Tenir une conversation de dix minutes</h3>
<p>Une vraie conversation n'est pas un interrogatoire : on pose des questions, on repond, puis on <strong>relance</strong> (on rebondit) pour garder l'echange vivant. Voici une trame en cinq etapes, avec des questions et des relances. Entraine-toi a jouer les deux roles.</p>
<div class="tip">Le secret d'une conversation fluide : apres avoir repondu, renvoie la question avec <em>What about you?</em> (Et toi ?) ou <em>And you?</em>. Ainsi la parole circule.</div>
<h3>2. Étape 1 : Se présenter (2 min)</h3>
<pre class="pseudo">Q: Can you introduce yourself?      // Peux-tu te presenter ?
Q: Where are you from?              // D'ou viens-tu ?
Q: What do you do?                  // Que fais-tu (dans la vie) ?
Relance: How long have you done that?  // Depuis combien de temps ?
Relance: That sounds interesting! Why did you choose it?
   // Ca a l'air interessant ! Pourquoi ce choix ?</pre>
<h3>3. Étape 2 : Le quotidien et les loisirs (2 min)</h3>
<pre class="pseudo">Q: What do you usually do at the weekend?  // Que fais-tu le week-end ?
Q: What are your hobbies?                   // Quels sont tes loisirs ?
Q: Do you prefer the city or the countryside? // Ville ou campagne ?
Relance: Really? How often do you do that?   // Vraiment ? A quelle frequence ?
Relance: Me too! / Oh, I don't. What about you?
   // Moi aussi ! / Oh, pas moi. Et toi ?</pre>
<h3>4. Étape 3 : Le passé, une expérience (2 min)</h3>
<pre class="pseudo">Q: Tell me about your last holiday.     // Parle-moi de tes dernieres vacances.
Q: What did you do there?               // Qu'as-tu fait la-bas ?
Q: Would you recommend it?              // Le recommanderais-tu ?
Relance: What was the best moment?      // Quel a ete le meilleur moment ?
Relance: Did anything go wrong?         // Y a-t-il eu un souci ?</pre>
<h3>5. Étape 4 : Une opinion, un débat léger (2 min)</h3>
<pre class="pseudo">Q: What do you think about social media?  // Que penses-tu des reseaux sociaux ?
Q: Do you think we should protect the environment more?
   // Penses-tu qu'il faut proteger davantage l'environnement ?
Relance: Why do you think so?             // Pourquoi penses-tu cela ?
Relance: I see your point, but...         // Je comprends, mais...
Relance: Can you give me an example?      // Peux-tu donner un exemple ?</pre>
<h3>6. Étape 5 : Les projets et la clôture (2 min)</h3>
<pre class="pseudo">Q: What are your plans for the future?   // Quels sont tes projets ?
Q: If you had more free time, what would you do?
   // Si tu avais plus de temps libre, que ferais-tu ?
Cloture: It was really nice talking to you. // C'etait vraiment sympa de parler avec toi.
Cloture: We should do this again. Take care!
   // On devrait recommencer. Prends soin de toi !</pre>
<div class="warn">Pour garder le rythme, evite les blancs : utilise des mots de remplissage naturels comme <em>Well, ...</em> (Eh bien...), <em>Let me think...</em> (Voyons...), <em>Actually, ...</em> (En fait...).</div>
<div class="tip">Relances universelles a memoriser : <em>Really? / That's interesting! / Why? / What about you? / Tell me more.</em> Elles marchent dans n'importe quelle conversation.</div>`,
  exercises: [
    { type: "qcm", q: "Comment relancer la conversation apres avoir repondu ?", opts: ["The end.", "What about you?", "Goodbye.", "Nothing."], a: 1, exp: "What about you ? / And you ? renvoie la question et fait circuler la parole." },
    { type: "input", q: "Complete : « Where are you ___ ? » (d'ou viens-tu)", a: ["from"], ph: "un mot", exp: "Where are you from ? = d'ou viens-tu." },
    { type: "qcm", q: "« What do you do? » demande…", opts: ["ce que tu fais maintenant, tout de suite", "ton metier / occupation", "ton adresse", "ton age"], a: 1, exp: "What do you do ? = quel est ton metier." },
    { type: "input", q: "Relance sur la duree : « How ___ have you done that? » (depuis combien de temps)", a: ["long"], ph: "un mot", exp: "How long...? = depuis combien de temps." },
    { type: "qcm", q: "Bonne relance pour montrer de l'interet :", opts: ["So what.", "Really? That's interesting!", "I don't care.", "Stop."], a: 1, exp: "Really? That's interesting! encourage l'autre a continuer." },
    { type: "qcm", q: "« Would you recommend it? » demande…", opts: ["si tu le recommanderais", "combien ca coute", "quand tu pars", "avec qui"], a: 0, exp: "Would you recommend it ? = le recommanderais-tu ?" },
    { type: "input", q: "Relance sur un exemple : « Can you give me an ___ ? » (exemple)", a: ["example"], ph: "un nom", exp: "Can you give me an example ? = peux-tu donner un exemple ?" },
    { type: "vf", q: "« I see your point, but... » sert a exprimer un desaccord poli dans un debat.", a: true, exp: "On reconnait l'autre avant d'objecter : c'est courtois." },
    { type: "qcm", q: "Conditionnel type 2 : « If you had more free time, what ___ you do? »", opts: ["will", "would", "did", "do"], a: 1, exp: "If + past, ... would : hypothese (type 2)." },
    { type: "input", q: "Complete la cloture : « It was really nice ___ to you. » (parler)", a: ["talking"], ph: "verbe -ing", exp: "nice talking to you : verbe en -ing." },
    { type: "qcm", q: "Quel mot de remplissage evite un blanc pendant qu'on reflechit ?", opts: ["Silence.", "Well, ... / Let me think...", "The end.", "No."], a: 1, exp: "Well... / Let me think... comblent naturellement une pause." },
    { type: "input", q: "Complete : « What are your ___ for the future? » (projets)", a: ["plans"], ph: "un nom", exp: "plans for the future = projets d'avenir." },
    { type: "qcm", q: "Comment clore poliment la conversation ?", opts: ["Bye, whatever.", "We should do this again. Take care!", "Finally over.", "Leave me alone."], a: 1, exp: "We should do this again. Take care ! est chaleureux et poli." },
    { type: "vf", q: "Dans une bonne conversation, on ne fait que poser des questions sans jamais rebondir.", a: false, exp: "Faux : il faut relancer (Really? Tell me more.) pour garder l'echange vivant." },
    { type: "qcm", q: "« Tell me more. » signifie…", opts: ["Change de sujet", "Raconte-m'en plus", "Tais-toi", "Repete tout"], a: 1, exp: "Tell me more = raconte-m'en plus (relance)." }
  ],
  final: {
    title: "Exercice final — Une conversation à analyser",
    intro: `<p>Read this conversation between two people who have just met and answer the questions.</p>
<p>Anna: Hi, I'm Anna. Nice to meet you. Ben: Nice to meet you too. I'm Ben. Where are you from? Anna: I'm from Lyon, but I live in London now. What about you? Ben: I'm from Manchester. So, what do you do? Anna: I'm a nurse. I've done that for six years. Ben: That sounds interesting! Do you enjoy it? Anna: Yes, I love helping people, although it can be tiring. What are your hobbies? Ben: Well, I play football and I like hiking. Last summer, I hiked in Scotland. Anna: Really? How was it? Ben: Amazing, but the weather was terrible! If I had more time, I would go back. Anna: I see. Do you think people should travel more? Ben: Yes, I think travelling opens your mind. What about you? Anna: I agree. It was really nice talking to you, Ben. Ben: Same here. We should do this again. Take care!</p>`,
    questions: [
      { type: "qcm", q: "Where does Anna live now?", opts: ["Lyon", "London", "Manchester", "Scotland"], a: 1, exp: "She is from Lyon, but she lives in London now." },
      { type: "input", q: "Complete: « I've done that ___ six years. » (for/since)", a: ["for"], ph: "for / since", exp: "for + duree (six years)." },
      { type: "qcm", q: "What did Ben do last summer?", opts: ["He played football in Lyon", "He hiked in Scotland", "He worked as a nurse", "He stayed home"], a: 1, exp: "Last summer, he hiked in Scotland." },
      { type: "qcm", q: "How does Ben relaunch the conversation after giving his opinion?", opts: ["Goodbye.", "What about you?", "Stop.", "The end."], a: 1, exp: "He says: What about you? to give Anna the floor." },
      { type: "vf", q: "They agree to meet again.", a: true, exp: "We should do this again. Take care! : ils se quittent chaleureusement." }
    ],
    solution: `<p>Reponses : 2 (London), « for », 2 (hiked in Scotland), 2 (What about you?), Vrai (do this again).</p>
<p>Observe le rythme : question -> reponse developpee -> relance (Really? How was it? What about you?). Anna et Ben ne s'interrogent pas froidement : ils reagissent (That sounds interesting!, I agree, I see). C'est exactement ce qui fait une conversation de niveau B1 reussie. Felicitations, tu as termine les 30 jours !</p>`
  }
};
</script>

  { id: "en-b1-j30", title: "Écris ta conversation de 10 minutes", level: 3,
    statement: "Redige une conversation naturelle entre deux personnes (A et B) qui se rencontrent, de 12 a 16 repliques. Passe par la presentation, les loisirs, une experience passee, une opinion et la cloture. Utilise au moins trois relances (Really?, What about you?, Tell me more...).",
    hints: [
      "Chaque personne repond PUIS relance : ...  What about you?",
      "Glisse un past simple (une experience), une opinion (I think...) et un conditionnel (If I had...).",

    ],
    solution: "A: Hi, I'm Sam. Nice to meet you. B: Nice to meet you too. I'm Lea. Where are you from? A: I'm from Paris, but I work in Brussels now. What about you? B: I'm from Madrid. So, what do you do? A: I'm a teacher. I've done that for four years. B: That sounds interesting! Do you enjoy it? A: Yes, although it can be tiring. What are your hobbies? B: Well, I love photography. Last year, I visited Iceland and took hundreds of photos. A: Really? How was it? B: Amazing! If I had more money, I would go back. A: I understand. Do you think travelling is important? B: Yes, I think it opens your mind. What about you? A: I agree completely. It was really nice talking to you, Lea. B: Same here. We should do this again. Take care!\n\nTraduction : A : Salut, je suis Sam. Enchante. B : Enchantee aussi. Je suis Lea. D'ou viens-tu ? A : Je viens de Paris, mais je travaille a Bruxelles maintenant. Et toi ? B : Je viens de Madrid. Alors, que fais-tu dans la vie ? A : Je suis enseignant. Je fais ca depuis quatre ans. B : Ca a l'air interessant ! Tu aimes ca ? A : Oui, meme si c'est parfois fatigant. Quels sont tes loisirs ? B : Eh bien, j'adore la photographie. L'an dernier, j'ai visite l'Islande et pris des centaines de photos. A : Vraiment ? C'etait comment ? B : Genial ! Si j'avais plus d'argent, j'y retournerais. A : Je comprends. Penses-tu que voyager est important ? B : Oui, je pense que ca ouvre l'esprit. Et toi ? A : Je suis tout a fait d'accord. C'etait vraiment sympa de parler avec toi, Lea. B : Pareil. On devrait recommencer. Prends soin de toi !",
    note: "Une conversation reussie alterne questions, reponses developpees et relances. Joue-la a voix haute avec un partenaire : c'est le meilleur entrainement pour valider ton niveau B1." }
  ]
};
