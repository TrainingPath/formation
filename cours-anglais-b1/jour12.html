  title: "Gérondif ou infinitif ?",
  subtitle: "Verbe-ing ou to + verbe : savoir quelle forme employer après un verbe.",
  theory: `
<h3>1. Deux façons de relier deux verbes</h3>
<p>Quand un verbe est suivi d'un autre verbe, l'anglais choisit entre deux formes. Le <strong>gérondif</strong> est le verbe en <strong>-ing</strong> employé comme un nom (<em>swimming</em>, le fait de nager). L'<strong>infinitif</strong> est la forme <strong>to + verbe</strong> (<em>to swim</em>). Le choix dépend du <strong>premier verbe</strong> : chaque verbe « préfère » l'une ou l'autre forme. Il faut apprendre ces préférences.</p>
<h3>2. Verbes suivis du GÉRONDIF (-ing)</h3>
<p>Certains verbes sont toujours suivis du gérondif : <strong>enjoy</strong> (aimer), <strong>finish</strong> (finir), <strong>avoid</strong> (éviter), <strong>mind</strong> (voir un inconvénient), <strong>suggest</strong> (suggérer), <strong>keep</strong> (continuer), <strong>practise</strong> (s'entraîner).</p>
<pre class="pseudo">I enjoy reading before bed.        // J'aime lire avant de dormir.
She finished writing the report.    // Elle a fini d'ecrire le rapport.
We avoid driving at night.          // On evite de conduire la nuit.</pre>
<div class="tip">Le gérondif s'emploie aussi <strong>après une préposition</strong> (in, on, at, of, about, without, after, before...). Ex : <em>She's good at cooking</em> (Elle est douée pour cuisiner), <em>Thanks for helping</em> (Merci d'avoir aidé).</div>
<h3>3. Verbes suivis de l'INFINITIF (to + verbe)</h3>
<p>D'autres verbes sont suivis de l'infinitif avec <em>to</em> : <strong>want</strong> (vouloir), <strong>decide</strong> (décider), <strong>hope</strong> (espérer), <strong>need</strong> (avoir besoin), <strong>promise</strong> (promettre), <strong>learn</strong> (apprendre), <strong>would like</strong> (aimerait).</p>
<pre class="pseudo">I want to travel next year.        // Je veux voyager l'annee prochaine.
She decided to change jobs.         // Elle a decide de changer de travail.
We hope to see you soon.            // On espere te voir bientot.</pre>
<h3>4. Verbes qui acceptent les DEUX (avec ou sans changement de sens)</h3>
<p>Certains verbes acceptent les deux formes. Parfois le sens ne change pas (<strong>start, begin, continue</strong>). Mais pour <strong>remember, forget, stop</strong>, le sens change vraiment.</p>
<pre class="pseudo">stop + -ing : She stopped smoking.    // Elle a arrete de fumer. (elle ne fume plus)
stop + to   : She stopped to smoke.    // Elle s'est arretee POUR fumer. (elle fait une pause pour fumer)

remember + -ing : I remember locking the door.   // Je me souviens d'avoir ferme la porte. (souvenir)
remember + to   : Remember to lock the door.      // N'oublie pas de fermer la porte. (tache a faire)</pre>
<div class="warn">Ne confonds pas : <em>stop doing</em> = cesser de faire ; <em>stop to do</em> = s'arrêter afin de faire. Le sens est complètement différent.</div>
<h3>5. Comment mémoriser ?</h3>
<pre class="pseudo">Toujours -ing : enjoy, finish, avoid, mind, suggest, keep, practise, + apres preposition
Toujours to  : want, decide, hope, need, promise, learn, would like, offer, refuse
Les deux     : start, begin, continue (meme sens) ; remember, forget, stop (sens different)</pre>
<div class="tip">Astuce : après une <strong>préposition</strong>, c'est TOUJOURS le gérondif (-ing), jamais l'infinitif. <em>interested in learning</em>, <em>tired of waiting</em>, <em>before leaving</em>.</div>`,
  exercises: [
    { type: "qcm", q: "Après le verbe « enjoy », on emploie...", opts: ["to + verbe", "le gérondif (-ing)", "le prétérit", "un modal"], a: 1, exp: "enjoy est toujours suivi du gérondif : I enjoy reading." },
    { type: "input", q: "Complète : « I want ___ (learn) Spanish. »", a: ["to learn"], ph: "2 mots", exp: "want est suivi de l'infinitif avec to : to learn." },

    { type: "input", q: "Complète : « We decided ___ (move) to another city. »", a: ["to move"], ph: "2 mots", exp: "decide est suivi de l'infinitif : to move." },
    { type: "qcm", q: "« She stopped smoking » signifie...", opts: ["Elle s'est arrêtée pour fumer", "Elle a cessé de fumer", "Elle veut fumer", "Elle fume encore"], a: 1, exp: "stop + -ing = cesser de faire quelque chose : elle ne fume plus." },

    { type: "input", q: "Complète : « I'm interested in ___ (join) the club. » (après préposition)", a: ["joining"], ph: "un mot", exp: "Après la préposition in : gérondif joining." },
    { type: "vf", q: "Le verbe « avoid » est suivi de l'infinitif avec to.", a: false, exp: "Faux : avoid est suivi du gérondif : avoid driving at night." },

    { type: "input", q: "Complète : « He's good at ___ (draw). » (après préposition)", a: ["drawing"], ph: "un mot", exp: "Après at : gérondif drawing." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["I enjoy to swim.", "I enjoy swimming.", "I want swimming.", "I decided swimming."], a: 1, exp: "enjoy + gérondif : I enjoy swimming. (want et decide prennent to.)" },
    { type: "input", q: "Complète : « We continued ___ (walk) despite the rain. » (les deux formes marchent, donne le gérondif)", a: ["walking"], ph: "un mot", exp: "continue accepte les deux : continued walking (ou to walk)." },
    { type: "vf", q: "« I remember meeting her » (je me souviens de l'avoir rencontrée) et « Remember to meet her » (n'oublie pas de la rencontrer) n'ont pas le même sens.", a: true, exp: "remember + -ing = souvenir du passé ; remember + to = tâche à ne pas oublier." }
  ],

<p>Nadia has decided to change her lifestyle this year. She wants to become healthier, so she has started going to the gym three times a week. At first, she couldn't stop complaining about the early mornings, but now she enjoys exercising before work. She has also given up eating too much sugar. Her doctor suggested drinking more water and avoiding fast food. Nadia is not very good at cooking, so she has promised to learn some new recipes. She always remembers to prepare her meals the night before. Last week, she even stopped to help an old man carry his bags, and she felt proud of the person she is becoming.</p>`,

      { type: "vf", q: "Nadia now enjoys exercising before work.", a: true, exp: "The text says: now she enjoys exercising before work (enjoy + -ing)." },

      { type: "qcm", q: "In « she stopped to help an old man », what does it mean?", opts: ["She stopped helping him", "She paused in order to help him", "She refused to help", "She never helped him"], a: 1, exp: "stop + to = s'arrêter afin de faire quelque chose : elle s'est arrêtée pour l'aider." },
      { type: "qcm", q: "Why does « avoiding » follow the verb « avoid ... » and « to learn » follow « promised »?", opts: ["It is random", "Because each verb has a fixed preference: avoid + -ing, promise + to", "Because of the tense", "Because they are questions"], a: 1, exp: "Chaque verbe impose sa forme : avoid + gérondif, promise + infinitif." }
    ],
    solution: `<p>Réponses : to change her lifestyle ; Vrai ; « drinking » ; She paused in order to help him ; Because each verb has a fixed preference.</p>
<p>Repère les préférences : <em>decided to change, wants to become, promised to learn</em> (infinitif) ; <em>started going, enjoys exercising, given up eating, suggested drinking, avoiding fast food</em> (gérondif). Note le contraste <em>couldn't stop complaining</em> (cesser de) et <em>stopped to help</em> (s'arrêter pour). C'est tout l'enjeu du chapitre.</p>`
  }
};
