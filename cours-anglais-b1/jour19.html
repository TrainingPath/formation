<script>
var DAY = {
  num: 19,
  title: "Les émotions et la personnalité",
  subtitle: "Décrire ce que l'on ressent et le caractère des gens.",
  theory: `
<h3>1. Les émotions de base</h3>
<pre class="pseudo">happy       // heureux
sad         // triste
angry       // en colere
scared / afraid // effraye
surprised   // surpris
worried     // inquiet
excited     // enthousiaste, tout excite
bored       // qui s'ennuie
proud       // fier
disappointed // decu
nervous     // anxieux, stresse
relieved    // soulage</pre>
<div class="tip">Pour dire l'intensite : <em>a bit</em> (un peu), <em>quite</em> (assez), <em>really / very</em> (vraiment), <em>extremely</em> (extremement). Ex : <em>I am a bit tired but really happy.</em></div>
<h3>2. -ED ou -ING : le piege classique</h3>
<p>Beaucoup d'adjectifs d'emotion existent en deux versions. La difference est essentielle :</p>
<pre class="pseudo">-ED = ce que JE ressens :   I am bored.       // Je m'ennuie.
-ING = ce qui PROVOQUE l'emotion : The film is boring.  // Le film est ennuyeux.</pre>
<pre class="pseudo">I am interested. / The book is interesting.   // Je suis interesse. / Le livre est interessant.
I am tired. / The journey was tiring.          // Je suis fatigue. / Le voyage etait fatigant.
I am excited. / The news is exciting.          // Je suis enthousiaste. / La nouvelle est excitante.</pre>
<div class="warn">Erreur frequente : « I am boring » veut dire « je suis ennuyeux (pour les autres) », PAS « je m'ennuie ». Pour dire qu'on s'ennuie : <em>I am bored</em>.</div>
<h3>3. Les prépositions des émotions</h3>
<pre class="pseudo">afraid OF spiders      // avoir peur des araignees
worried ABOUT the exam // inquiet a propos de l'examen
happy WITH the result  // content du resultat
angry WITH someone     // en colere contre quelqu'un
excited ABOUT the trip // impatient pour le voyage
proud OF you           // fier de toi</pre>
<h3>4. Décrire la personnalité (traits de caractère)</h3>
<pre class="pseudo">kind        // gentil
generous    // genereux
shy         // timide
confident   // sur de lui, assure
funny       // drole
honest      // honnete
patient     // patient
selfish     // egoiste
lazy        // paresseux
ambitious   // ambitieux
easy-going  // detendu, facile a vivre
stubborn    // tetu</pre>
<h3>5. Les contraires utiles</h3>
<pre class="pseudo">generous <-> mean (avare)
patient <-> impatient
honest <-> dishonest
confident <-> shy
hard-working <-> lazy</pre>
<div class="tip">Beaucoup de contraires se forment avec un prefixe : <strong>un-</strong> (unkind, unhappy), <strong>im-</strong> (impatient, impolite), <strong>dis-</strong> (dishonest). Retiens-les par familles.</div>`,
  exercises: [
    { type: "qcm", q: "« I am bored. » signifie…", opts: ["Je suis ennuyeux", "Je m'ennuie", "Je suis occupe", "Je suis fatigant"], a: 1, exp: "-ED = ce que je ressens : je m'ennuie." },
    { type: "qcm", q: "« The film is boring. » signifie…", opts: ["Le film m'ennuie / est ennuyeux", "Le film s'ennuie", "Le film est court", "Le film est fini"], a: 0, exp: "-ING = ce qui provoque l'emotion : un film ennuyeux." },
    { type: "input", q: "Choisis -ed ou -ing : « I was very ___ by the news. » (interesse)", a: ["interested"], ph: "adjectif", exp: "C'est ce que je ressens : -ed, interested." },
    { type: "input", q: "Choisis -ed ou -ing : « The journey was ___ . » (fatigant)", a: ["tiring"], ph: "adjectif", exp: "C'est ce qui provoque l'emotion : -ing, tiring." },
    { type: "qcm", q: "Quelle preposition ? « She is afraid ___ dogs. »", opts: ["about", "of", "with", "on"], a: 1, exp: "afraid OF something = avoir peur de quelque chose." },
    { type: "input", q: "Complete : « I am worried ___ the exam. »", a: ["about"], ph: "preposition", exp: "worried ABOUT = inquiet a propos de." },
    { type: "qcm", q: "Quel adjectif signifie « timide » ?", opts: ["confident", "shy", "funny", "kind"], a: 1, exp: "shy = timide ; son contraire est confident." },
    { type: "qcm", q: "Le contraire de « generous » est…", opts: ["kind", "mean", "honest", "lazy"], a: 1, exp: "mean = avare, mesquin ; contraire de generous (genereux)." },
    { type: "input", q: "Forme le contraire avec un prefixe : « patient » -> ___", a: ["impatient"], ph: "un mot", exp: "im- + patient = impatient." },
    { type: "vf", q: "« I am boring » et « I am bored » veulent dire la meme chose.", a: false, exp: "I am boring = je suis ennuyeux (pour les autres) ; I am bored = je m'ennuie." },
    { type: "qcm", q: "« relieved » signifie…", opts: ["fier", "soulage", "decu", "surpris"], a: 1, exp: "relieved = soulage." },
    { type: "input", q: "Complete : « He is proud ___ his daughter. »", a: ["of"], ph: "preposition", exp: "proud OF someone = fier de quelqu'un." },
    { type: "qcm", q: "Quelqu'un de « easy-going » est…", opts: ["stresse", "detendu, facile a vivre", "egoiste", "tetu"], a: 1, exp: "easy-going = detendu, facile a vivre." },
    { type: "vf", q: "« excited about the trip » exprime de l'enthousiasme pour le voyage.", a: true, exp: "excited about = impatient / enthousiaste a propos de." },
    { type: "input", q: "Choisis -ed ou -ing : « The news was ___ . » (surprenant)", a: ["surprising"], ph: "adjectif", exp: "Ce qui provoque l'emotion : -ing, surprising." }
  ],
  final: {
    title: "Exercice final — Une lettre d'un ami",
    intro: `<p>Read this message from a friend and answer the questions.</p>
<p>Hi Léa, I have some exciting news! I got the job in London. I was so nervous before the interview that I could not sleep, but now I am really relieved and very proud. My new manager seems kind and patient, and my future colleagues are friendly. Of course, I am a bit worried about moving to a new city, because I am quite shy and I do not know anyone there. My family is happy for me, but my little brother is sad that I am leaving. The journey will be tiring, but I am excited about this new chapter. I am not afraid of hard work, so I think everything will be fine. Write soon! Marco.</p>`,
    questions: [
      { type: "qcm", q: "How did Marco feel before the interview?", opts: ["Relaxed", "So nervous he could not sleep", "Bored", "Angry"], a: 1, exp: "He was so nervous before the interview that he could not sleep." },
      { type: "qcm", q: "How does he describe his new manager?", opts: ["Lazy and mean", "Kind and patient", "Shy and stubborn", "Selfish"], a: 1, exp: "His new manager seems kind and patient." },
      { type: "input", q: "Complete: « I am a bit ___ about moving to a new city. »", a: ["worried"], ph: "adjectif", exp: "worried about = inquiet a propos de." },
      { type: "vf", q: "Marco is afraid of hard work.", a: false, exp: "He says he is NOT afraid of hard work." },
      { type: "qcm", q: "Why is he a bit worried about the move?", opts: ["He is quite shy and knows no one there", "The job is boring", "The salary is low", "He hates London"], a: 0, exp: "He is quite shy and does not know anyone in the new city." }
    ],
    solution: `<p>Reponses : 2 (so nervous), 2 (kind and patient), « worried », Faux (not afraid of hard work), 1 (shy, knows no one).</p>
<p>Repere les adjectifs en -ed (ses emotions : nervous, relieved, proud, worried, excited) et en -ing (ce qui les provoque : exciting news, tiring journey). Repere aussi les prepositions : worried ABOUT, afraid OF, excited ABOUT.</p>`
  }
};
</script>
<script src="engine.js"></script>

  { id: "en-b1-j19", title: "Décris tes émotions et ta personnalité", level: 3,

      "-ED pour ce que tu ressens (I was excited) ; -ING pour la cause (the news was exciting).",
      "N'oublie pas les prepositions : worried ABOUT, afraid OF, proud OF, happy WITH.",
      "Pour la personnalite : I am quite shy but hard-working / easy-going / patient."
    ],
    solution: "Last month I passed my driving test, and I was really excited about it. The exam was quite frightening because the examiner was very serious, and I was so nervous that my hands were shaking. When I heard the result, I was extremely relieved and proud of myself. My family was happy with the news too. In general, I am a bit shy and I am afraid of making mistakes, but I am also patient and hard-working, so I never give up.\n\nTraduction : Le mois dernier j'ai reussi mon permis de conduire, et j'etais vraiment enthousiaste. L'examen etait assez effrayant parce que l'examinateur etait tres serieux, et j'etais si nerveux que mes mains tremblaient. Quand j'ai entendu le resultat, j'etais extremement soulage et fier de moi. Ma famille etait contente de la nouvelle aussi. En general, je suis un peu timide et j'ai peur de faire des erreurs, mais je suis aussi patient et travailleur, donc je n'abandonne jamais.",
    note: "Le contraste -ed / -ing est la faute la plus corrigee a ce niveau. Relis-toi en te demandant : est-ce ce que je ressens (-ed) ou ce qui le provoque (-ing) ?" }
  ]
};
</script>
