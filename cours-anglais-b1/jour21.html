<script>
var DAY = {
  num: 21,
  title: "Les médias et la technologie",
  subtitle: "Parler d'Internet, des réseaux sociaux et des appareils.",
  theory: `
<h3>1. Le vocabulaire du numérique</h3>
<pre class="pseudo">a device       // un appareil
a screen       // un ecran
a laptop       // un ordinateur portable
a smartphone   // un smartphone
an app         // une application
a website      // un site web
the cloud      // le cloud (stockage en ligne)
a password     // un mot de passe
an account     // un compte
a file         // un fichier</pre>
<div class="warn">Faux amis : « to download » = telecharger (vers soi) ; « to upload » = televerser (vers le serveur). « actually » = en fait (et NON « actuellement », qui se dit « currently »).</div>
<h3>2. Les verbes du numérique</h3>
<pre class="pseudo">to click (on)      // cliquer (sur)
to download        // telecharger
to upload          // televerser, mettre en ligne
to log in / log out // se connecter / se deconnecter
to post            // publier
to share           // partager
to update          // mettre a jour
to charge          // recharger (une batterie)
to browse          // naviguer, surfer</pre>
<pre class="pseudo">I posted a photo and shared it with my friends.
   // J'ai publie une photo et je l'ai partagee avec mes amis.
Please log in with your password.
   // Connectez-vous avec votre mot de passe.</pre>
<h3>3. Les réseaux sociaux et les médias</h3>
<pre class="pseudo">social media       // les reseaux sociaux
a follower         // un abonne
to follow          // suivre
a post             // une publication
to go viral        // devenir viral
fake news          // les fausses informations
the media          // les medias
a channel          // une chaine (TV, YouTube)
a subscriber       // un abonne (a une chaine)</pre>
<div class="tip">« social media » et « the media » prennent en general un verbe au singulier en anglais courant : <em>Social media is very powerful.</em></div>
<h3>4. Avantages et inconvénients</h3>
<pre class="pseudo">an advantage       // un avantage
a disadvantage / a drawback // un inconvenient
convenient         // pratique
time-consuming     // qui prend beaucoup de temps
addictive          // qui rend accro
useful <-> useless // utile / inutile</pre>
<pre class="pseudo">One advantage of smartphones is that they are convenient.
   // Un avantage des smartphones est qu'ils sont pratiques.
One drawback is that social media can be addictive.
   // Un inconvenient est que les reseaux sociaux peuvent rendre accro.</pre>
<h3>5. Parler de ses habitudes numériques</h3>
<pre class="pseudo">I spend two hours a day on my phone.
   // Je passe deux heures par jour sur mon telephone.
I am used to reading the news online.
   // J'ai l'habitude de lire les infos en ligne.
I can't live without my laptop.
   // Je ne peux pas vivre sans mon ordinateur portable.</pre>
<div class="warn">« to spend time DOING something » : le verbe apres est en -ing. <em>I spend time watching videos.</em> = Je passe du temps a regarder des videos.</div>`,

    { type: "qcm", q: "Un « laptop » est…", opts: ["une application", "un ordinateur portable", "un mot de passe", "un site web"], a: 1, exp: "a laptop = ordinateur portable." },
    { type: "input", q: "Complete : « Please ___ in with your password. » (se connecter)", a: ["log"], ph: "un verbe", exp: "to log in = se connecter." },

    { type: "qcm", q: "« addictive » veut dire…", opts: ["pratique", "qui rend accro", "utile", "gratuit"], a: 1, exp: "addictive = qui rend accro ; un drawback frequent." },
    { type: "input", q: "Complete : « One ___ of smartphones is that they are convenient. » (avantage)", a: ["advantage"], ph: "un nom", exp: "an advantage = un avantage." },
    { type: "vf", q: "« fake news » designe de fausses informations.", a: true, exp: "fake news = fausses informations, infox." },
    { type: "qcm", q: "Quel mot est le contraire de « useful » ?", opts: ["convenient", "useless", "addictive", "viral"], a: 1, exp: "useless = inutile ; contraire de useful (utile)." },
    { type: "input", q: "Complete : « She wants to ___ a new photo on her account. » (publier)", a: ["post"], ph: "un verbe", exp: "to post = publier." },
    { type: "qcm", q: "« time-consuming » veut dire…", opts: ["rapide", "qui prend beaucoup de temps", "pratique", "gratuit"], a: 1, exp: "time-consuming = qui prend beaucoup de temps." },
    { type: "input", q: "Complete : « I need to ___ my phone, the battery is empty. » (recharger)", a: ["charge"], ph: "un verbe", exp: "to charge = recharger une batterie." },
    { type: "vf", q: "En anglais courant, « social media is powerful » (verbe au singulier) est accepte.", a: true, exp: "social media / the media prennent souvent un verbe au singulier." }
  ],
  final: {
    title: "Exercice final — Les réseaux sociaux : pour et contre",
    intro: `<p>Read this short opinion text and answer the questions.</p>
<p>Social media has changed our lives in many ways. There are real advantages. First, it is very convenient: we can share photos, follow the news and stay in touch with friends abroad. Small businesses can also reach new customers when a post goes viral. However, there are drawbacks too. Social media can be addictive, and many people spend hours scrolling instead of sleeping. Another problem is fake news, which spreads very fast and is hard to stop. Some users also feel anxious when they compare their lives to others. In my opinion, the technology itself is not bad, but we must learn to use it carefully. If we set clear limits, we will enjoy the advantages without the worst drawbacks. Actually, the biggest challenge is not the app, but our own habits.</p>`,
    questions: [
      { type: "qcm", q: "What is one advantage of social media in the text?", opts: ["It is free", "It is convenient for staying in touch", "It is silent", "It is old"], a: 1, exp: "It is convenient: we can stay in touch with friends abroad." },
      { type: "input", q: "Complete from the text: « Social media can be ___ . »", a: ["addictive"], ph: "un adjectif", exp: "The text names being addictive as a drawback." },
      { type: "vf", q: "According to the text, fake news spreads slowly.", a: false, exp: "The text says fake news spreads very fast and is hard to stop." },
      { type: "qcm", q: "What does the writer think the biggest challenge is?", opts: ["The apps themselves", "Our own habits", "The internet speed", "The price"], a: 1, exp: "Actually, the biggest challenge is not the app, but our own habits." },
      { type: "qcm", q: "What is the writer's overall opinion?", opts: ["Technology is bad and should be banned", "Technology is not bad, but we must use it carefully", "Everyone should quit social media", "Social media has no drawbacks"], a: 1, exp: "The technology itself is not bad, but we must learn to use it carefully." }
    ],
    solution: `<p>Reponses : 2 (convenient / stay in touch), « addictive », Faux (spreads fast), 2 (our own habits), 2 (use it carefully).</p>
<p>Repere la structure « pour et contre » : <em>There are real advantages. First... However, there are drawbacks... In my opinion...</em>. C'est le plan ideal pour un texte argumente.</p>`
  }
};
