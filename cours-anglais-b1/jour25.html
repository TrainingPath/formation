<script>
var DAY = {
  num: 25,
  title: "Compréhension : un fait divers court",
  subtitle: "Comprendre une brève et repérer la chronologie des événements.",
  theory: `
<h3>1. Qu'est-ce qu'un fait divers ?</h3>
<p>Un <strong>fait divers</strong> (en anglais <em>a news story</em> ou <em>a report</em>) raconte un evenement precis : un accident, un vol, un sauvetage, une decouverte. Il est court et se lit au <strong>passe</strong>. La cle est de reperer la <strong>chronologie</strong> : ce qui s'est passe en premier, puis ensuite, enfin.</p>
<div class="tip">Repere les marqueurs de temps : <em>first</em> (d'abord), <em>then</em> (ensuite), <em>after that</em> (apres cela), <em>finally</em> (enfin), <em>a few minutes later</em> (quelques minutes plus tard).</div>
<h3>2. Vocabulaire du fait divers</h3>
<pre class="pseudo">a witness      // un temoin
the police     // la police
a firefighter  // un pompier
to rescue      // secourir, sauver
to escape      // s'echapper
to catch (caught) // attraper
to arrest      // arreter (police)
to injure      // blesser
safe and sound  // sain et sauf
luckily        // heureusement</pre>
<h3>3. Lis ce fait divers</h3>
<pre class="pseudo">DOG RESCUES SLEEPING FAMILY FROM FIRE

Late on Sunday night, a small dog woke up a whole family and
saved their lives. The Turner family were asleep when a fire
started in the kitchen. The dog, called Max, began to bark
loudly and jumped on the parents' bed. At first, they were
annoyed, but then they smelled smoke. The father quickly woke
the two children and they all ran outside. A neighbour called
the fire brigade, and firefighters arrived a few minutes later.
Luckily, everyone was safe and sound, including the dog. The
kitchen was badly damaged, but the rest of the house was saved.
"Max is a hero," said Mrs Turner. The family now plan to give
him a very big dinner.</pre>
<h3>4. Traduction des passages clés</h3>
<pre class="pseudo">The family were asleep when a fire started.
   // La famille dormait quand un incendie s'est declare.
The dog began to bark loudly.
   // Le chien s'est mis a aboyer fort.
Everyone was safe and sound, including the dog.
   // Tout le monde etait sain et sauf, y compris le chien.</pre>
<div class="warn">Attention au temps : le fait divers utilise le <strong>past simple</strong> (woke, started, ran, arrived). Le mot « when » relie souvent deux actions passees : <em>They were asleep WHEN a fire started.</em></div>
<h3>5. Stratégie : reconstituer l'ordre</h3>
<p>Apres avoir lu, remets les evenements dans l'ordre dans ta tete : 1) l'incendie demarre, 2) le chien aboie, 3) la famille sent la fumee, 4) ils sortent, 5) les pompiers arrivent. Les questions testent souvent cette chronologie.</p>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet du fait divers ?", opts: ["Un chien qui sauve une famille d'un incendie", "Un vol dans une banque", "Un accident de voiture", "Un match de foot"], a: 0, exp: "Le titre : un chien reveille et sauve la famille." },
    { type: "qcm", q: "Quand l'evenement a-t-il eu lieu ?", opts: ["Lundi matin", "Dimanche soir tard", "Samedi midi", "Vendredi"], a: 1, exp: "Late on Sunday night = tard dimanche soir." },
    { type: "input", q: "Comment s'appelle le chien ? « ___ »", a: ["Max"], ph: "un nom", exp: "The dog, called Max." },
    { type: "vf", q: "Au debut, les parents etaient contents que le chien aboie.", a: false, exp: "At first, they were annoyed (agaces), puis ils ont senti la fumee." },
    { type: "qcm", q: "Ou l'incendie a-t-il commence ?", opts: ["Dans le salon", "Dans la cuisine", "Dans le garage", "Dans le jardin"], a: 1, exp: "A fire started in the kitchen." },
    { type: "qcm", q: "Qui a appele les pompiers ?", opts: ["Le pere", "Un voisin", "Les enfants", "La police"], a: 1, exp: "A neighbour called the fire brigade." },
    { type: "input", q: "Complete : « Everyone was safe and ___ . » (sauf)", a: ["sound"], ph: "un mot", exp: "safe and sound = sain et sauf." },
    { type: "vf", q: "Toute la maison a ete detruite.", a: false, exp: "The kitchen was badly damaged, but the rest of the house was saved." },
    { type: "qcm", q: "Dans l'ordre, que s'est-il passe EN PREMIER ?", opts: ["Les pompiers sont arrives", "L'incendie a demarre dans la cuisine", "La famille est sortie", "Le chien a eu un grand diner"], a: 1, exp: "1) l'incendie demarre, 2) le chien aboie, etc." },
    { type: "input", q: "Complete : « The dog began to ___ loudly. » (aboyer)", a: ["bark"], ph: "un verbe", exp: "to bark = aboyer." },
    { type: "qcm", q: "Que veut dire « luckily » ?", opts: ["malheureusement", "heureusement", "rapidement", "lentement"], a: 1, exp: "luckily = heureusement." },
    { type: "vf", q: "Le mot « when » relie deux actions passees dans « They were asleep when a fire started ».", a: true, exp: "when relie l'action de fond (were asleep) et l'evenement (started)." },
    { type: "input", q: "Complete : « Firefighters ___ a few minutes later. » (arriver, passe)", a: ["arrived"], ph: "verbe passe", exp: "arrived = sont arrives (past simple)." },
    { type: "qcm", q: "Comment Mrs Turner qualifie-t-elle le chien ?", opts: ["A problem", "A hero", "A thief", "A witness"], a: 1, exp: "Max is a hero, said Mrs Turner." },
    { type: "qcm", q: "Que compte faire la famille pour le chien ?", opts: ["Le vendre", "Lui donner un tres grand diner", "Le laisser dehors", "Rien"], a: 1, exp: "The family plan to give him a very big dinner." }
  ],
  final: {
    title: "Exercice final — Un second fait divers",
    intro: `<p>Read this second short news story and answer the questions.</p>
<p>On Monday morning, a ten-year-old boy became a local hero in the town of Ashby. Tom was walking to school when he saw an old man fall near the river. First, Tom shouted for help, but nobody was near. Then he ran to a nearby shop and asked the owner to call an ambulance. After that, he stayed with the man and kept him warm with his own coat. A few minutes later, the paramedics arrived and took the man to hospital. Luckily, the man was not badly injured and left the hospital the same day. "That boy was very brave," the doctor said. The school gave Tom a special prize on Friday.</p>`,
    questions: [
      { type: "qcm", q: "What did Tom see on his way to school?", opts: ["A car accident", "An old man fall near the river", "A fire", "A thief"], a: 1, exp: "He saw an old man fall near the river." },
      { type: "input", q: "What did Tom do FIRST? « He ___ for help. »", a: ["shouted"], ph: "verbe passe", exp: "First, Tom shouted for help." },
      { type: "qcm", q: "How did Tom keep the man warm?", opts: ["With a blanket", "With his own coat", "With a fire", "With hot tea"], a: 1, exp: "He kept him warm with his own coat." },
      { type: "vf", q: "The old man was badly injured and stayed in hospital for a week.", a: false, exp: "The man was not badly injured and left the same day." },
      { type: "qcm", q: "When did the school give Tom a prize?", opts: ["On Monday", "On Wednesday", "On Friday", "On Sunday"], a: 2, exp: "The school gave Tom a special prize on Friday." }
    ],
    solution: `<p>Reponses : 2 (old man fall), « shouted », 2 (his own coat), Faux (not badly injured, left same day), 3 (Friday).</p>
<p>Suis les marqueurs de temps pour reconstituer l'ordre : First -> Then -> After that -> A few minutes later. Le past simple (saw, shouted, ran, arrived) rythme tout le recit.</p>`
  }
};
