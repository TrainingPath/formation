  subtitle: "Un entretien complet, du bonjour à la conclusion.",
  theory: `
<h3>1. Le déroulement d'un entretien</h3>
<p>Un entretien suit toujours les memes etapes : l'<strong>accueil</strong> (greeting), la <strong>presentation</strong>, les <strong>questions sur le parcours</strong>, les <strong>questions sur la motivation</strong>, les <strong>questions du candidat</strong>, puis la <strong>conclusion</strong>. Voici un entretien complet a etudier et a rejouer.</p>
<h3>2. Le dialogue complet</h3>
<pre class="pseudo">1. ACCUEIL
Recruiter: Good morning. Please, take a seat.
Candidate: Good morning. Thank you very much.
   // Bonjour. Asseyez-vous. / Bonjour. Merci beaucoup.

2. PRESENTATION
Recruiter: So, tell me a little about yourself.
Candidate: Of course. I am a reliable and organised assistant
           with three years of experience in customer service.
           I enjoy working in a team and solving problems.
   // Parlez-moi un peu de vous. / Je suis un assistant fiable...

3. PARCOURS
Recruiter: Why did you leave your last job?
Candidate: I left because I was looking for new challenges
           and more responsibilities.
   // Pourquoi avez-vous quitte votre dernier poste ? / Pour de nouveaux defis.

Recruiter: What are your main strengths?
Candidate: I am hard-working and I learn quickly. I am also
           good at communicating with customers.
   // Quels sont vos points forts ? / Je suis travailleur...

Recruiter: And what about your weaknesses?
Candidate: Sometimes I am too demanding with myself, but I
           am learning to be more patient.
   // Et vos points faibles ? / Parfois trop exigeant, mais je progresse.

4. MOTIVATION
Recruiter: Why do you want to work for our company?
Candidate: Because you are a leader in your field, and I would
           love to develop my skills in a dynamic team.
   // Pourquoi notre entreprise ? / Parce que vous etes un leader...

Recruiter: Where do you see yourself in five years?
Candidate: I hope to have more responsibilities and to manage
           a small team.
   // Ou vous voyez-vous dans cinq ans ? / Diriger une petite equipe.

5. QUESTIONS DU CANDIDAT
Recruiter: Do you have any questions for me?
Candidate: Yes, thank you. What would a typical day look like,
           and are there opportunities to grow?
   // Avez-vous des questions ? / A quoi ressemble une journee type ?

6. CONCLUSION
Recruiter: Thank you for coming. We will contact you next week.
Candidate: Thank you for your time. I look forward to hearing
           from you. Have a good day.
   // Merci d'etre venu. / Merci pour votre temps. Bonne journee.</pre>
<div class="tip">Astuce d'oral : parle lentement et clairement, souris, et developpe toujours tes reponses avec un exemple. Ne reponds jamais par un simple « yes » ou « no ».</div>
<div class="warn">Erreurs a eviter : « I am agree », « I have 25 years » (dis <em>I am 25</em>), « I am here since 3 years » (dis <em>I have been here for 3 years</em>).</div>
<h3>3. Phrases de secours</h3>
<pre class="pseudo">Could you repeat the question, please?   // Pourriez-vous repeter la question ?
Let me think for a moment.               // Laissez-moi reflechir un instant.
That is a good question.                 // C'est une bonne question.
What I mean is ...                       // Ce que je veux dire, c'est ...</pre>`,

    { type: "qcm", q: "Corrige : au lieu de « I have 25 years », on dit…", opts: ["I have 25 age", "I am 25", "I am 25 years", "I have 25"], a: 1, exp: "L'age : I am 25 (years old)." },
    { type: "input", q: "Complete : « I have ___ here for three years. » (etre, present perfect : been)", a: ["been"], ph: "un mot", exp: "I have been here FOR three years (jamais « since 3 years »)." },

    { type: "vf", q: "« I am agree with you » est une bonne reponse en entretien.", a: false, exp: "Faux : on dit I agree (agree est un verbe)." },
    { type: "input", q: "Complete la conclusion : « I look forward to ___ from you. »", a: ["hearing"], ph: "verbe -ing", exp: "look forward to + -ing : hearing from you." },

    { type: "qcm", q: "Comment cloturer poliment l'entretien ?", opts: ["Bye.", "Thank you for your time. Have a good day.", "Finally!", "See ya."], a: 1, exp: "Thank you for your time. Have a good day = poli et professionnel." },
    { type: "input", q: "Complete : « Why do you want to work for our ___ ? » (entreprise)", a: ["company"], ph: "un nom", exp: "company = entreprise ; question sur la motivation." }

    intro: `<p>Read this interview and answer the questions.</p>
<p>Recruiter: Good afternoon, Mr Adams. Please sit down. Candidate: Good afternoon. Thank you. Recruiter: Tell me about yourself. Candidate: I am a motivated engineer with five years of experience. I enjoy solving technical problems and working in a team. Recruiter: Why did you leave your last job? Candidate: I left because I wanted new challenges and a chance to lead projects. Recruiter: What is your greatest weakness? Candidate: Sometimes I focus too much on details, but I am learning to see the bigger picture. Recruiter: Why do you want to join us? Candidate: Because your company is a leader in green technology, and I care deeply about the environment. Recruiter: Do you have any questions? Candidate: Yes, are there opportunities to grow within the company? Recruiter: Absolutely. Thank you, we will be in touch. Candidate: Thank you for your time. I look forward to hearing from you.</p>`,

    ],

<p>Remarque comment le candidat structure chaque reponse : une phrase complete, une raison, et parfois un exemple. Rejoue ce dialogue a voix haute en changeant les details pour t'entrainer avant un vrai entretien.</p>`
