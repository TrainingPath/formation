  title: "Les propositions relatives",
  subtitle: "Who, which, that, where : relier deux idées et préciser de quoi on parle.",
  theory: `
<h3>1. À quoi servent les relatives ?</h3>
<p>Une <strong>proposition relative</strong> permet de donner des informations sur un nom sans commencer une nouvelle phrase. Elle relie deux idées à l'aide d'un <strong>pronom relatif</strong> (who, which, that, where...). Au lieu de dire « J'ai un ami. Il vit à Rome. », on dit « J'ai un ami <strong>qui</strong> vit à Rome ». Le pronom relatif remplace le nom et évite de le répéter.</p>
<pre class="pseudo">I have a friend. He lives in Rome.  ->  I have a friend who lives in Rome.
// J'ai un ami qui vit a Rome.</pre>
<h3>2. Les pronoms relatifs de base</h3>
<pre class="pseudo">who    = qui  (pour les PERSONNES)        The man who called...     // L'homme qui a appele...
which  = qui/que (pour les CHOSES)         The book which I read...  // Le livre que j'ai lu...
that   = qui/que (personnes OU choses)     The car that broke down...
where  = ou (pour les LIEUX)               The town where I grew up... // La ville ou j'ai grandi...
whose  = dont, de qui (POSSESSION)         The girl whose dog...     // La fille dont le chien...
when   = ou/quand (pour le TEMPS)          The day when we met...    // Le jour ou on s'est rencontres...</pre>
<div class="tip"><strong>that</strong> peut remplacer <em>who</em> ou <em>which</em> dans la plupart des cas courants. C'est le pronom relatif le plus polyvalent à l'oral.</div>
<h3>3. Sujet ou complément ? Le pronom qu'on peut supprimer</h3>
<p>Quand le pronom relatif est le <strong>complément</strong> du verbe qui suit (il y a déjà un autre sujet juste après), on peut le <strong>supprimer</strong>. Quand il est le <strong>sujet</strong> du verbe qui suit, on ne peut pas le supprimer.</p>
<pre class="pseudo">The book that I read was great.   ->  The book I read was great.     // OK : that est complement (I = sujet)
The man who called is my uncle.   ->  The man called is my uncle.    // FAUX : who est sujet, on le garde</pre>
<div class="warn">Test simple : si un sujet suit immédiatement le pronom (that <strong>I</strong> read), le pronom est complément et peut disparaître. Si un verbe suit directement (who <strong>called</strong>), le pronom est sujet et doit rester.</div>
<h3>4. Relatives déterminatives et explicatives</h3>
<p>Il existe deux types. La relative <strong>déterminative</strong> (defining) est <strong>essentielle</strong> : elle identifie de quel nom on parle, et ne prend <strong>pas de virgule</strong>. La relative <strong>explicative</strong> (non-defining) ajoute une info <strong>secondaire</strong>, entre <strong>virgules</strong>, et n'accepte pas <em>that</em>.</p>
<pre class="pseudo">Determinative : The woman who lives next door is a doctor.
// La femme QUI habite a cote est medecin. (essentiel : quelle femme ?)
Explicative :   My sister, who lives in Paris, is a doctor.
// Ma soeur, qui habite a Paris, est medecin. (info en plus : j'ai une seule soeur)</pre>
<div class="warn">Dans une relative explicative (entre virgules), on n'emploie <strong>jamais that</strong> : on utilise who ou which. Et on ne supprime jamais le pronom.</div>
<h3>5. Where, whose, when</h3>
<p><strong>Where</strong> remplace « dans lequel / où » pour un lieu. <strong>Whose</strong> exprime la possession (« dont le/la »). <strong>When</strong> s'emploie pour un moment.</p>
<pre class="pseudo">This is the house where I was born.       // C'est la maison ou je suis ne.
That's the man whose car was stolen.       // C'est l'homme dont la voiture a ete volee.
I remember the day when we first met.      // Je me souviens du jour ou on s'est rencontres.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel pronom relatif utilise-t-on pour les PERSONNES ?", opts: ["which", "who", "where", "whose"], a: 1, exp: "who = qui, pour les personnes (The man who called)." },
    { type: "qcm", q: "Quel pronom relatif utilise-t-on pour les CHOSES ?", opts: ["who", "which", "where", "when"], a: 1, exp: "which = qui/que, pour les choses (The book which I read)." },
    { type: "input", q: "Complète : « This is the town ___ I grew up. » (lieu)", a: ["where"], ph: "un mot", exp: "where = où, pour un lieu : the town where I grew up." },
    { type: "input", q: "Complète : « That's the girl ___ dog is very friendly. » (possession)", a: ["whose"], ph: "un mot", exp: "whose = dont, pour la possession : the girl whose dog." },
    { type: "qcm", q: "Le pronom relatif « that » peut remplacer...", opts: ["seulement who", "seulement which", "who et which dans la plupart des cas", "where et when"], a: 2, exp: "that est polyvalent : il remplace who ou which dans les relatives déterminatives." },
    { type: "input", q: "Complète : « The man ___ called you is my uncle. » (personne, sujet)", a: ["who", "that"], ph: "un mot", exp: "who (ou that) : the man who called (who est sujet du verbe called)." },
    { type: "vf", q: "Dans « The book that I read was great », on peut supprimer « that ».", a: true, exp: "that est complément (I = sujet juste après) : The book I read was great est correct." },
    { type: "vf", q: "Dans « The man who called is my uncle », on peut supprimer « who ».", a: false, exp: "Non : who est sujet du verbe called. On ne supprime pas un pronom relatif sujet." },
    { type: "qcm", q: "Dans une relative explicative (entre virgules), quel pronom est INTERDIT ?", opts: ["who", "which", "that", "whose"], a: 2, exp: "On n'emploie jamais that dans une relative explicative : My sister, who lives in Paris,..." },
    { type: "input", q: "Complète : « She showed me the photos ___ she took in Italy. » (choses, complément)", a: ["which", "that"], ph: "un mot", exp: "which (ou that) : the photos which she took (complément, on pourrait même le supprimer)." },
    { type: "qcm", q: "Lis : « My grandfather, who is 90, still drives every day. » Cette relative est...", opts: ["déterminative (essentielle, sans virgule)", "explicative (info secondaire, entre virgules)", "une question", "au passif"], a: 1, exp: "Entre virgules, avec who : c'est une relative explicative qui ajoute une info secondaire." },
    { type: "input", q: "Complète : « I'll never forget the day ___ we met. » (temps)", a: ["when"], ph: "un mot", exp: "when = où/quand, pour un moment : the day when we met." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["The car who broke down is mine.", "The car which broke down is mine.", "The car where broke down is mine.", "The car whose broke down is mine."], a: 1, exp: "Pour une chose (car) : which (ou that), pas who." },
    { type: "input", q: "Relie les deux phrases avec un pronom : « The house ___ we bought is old. » (chose, complément)", a: ["that", "which"], ph: "un mot", exp: "that/which : the house that we bought (complément, supprimable)." },
    { type: "vf", q: "« where » s'emploie pour introduire une relative qui parle d'un lieu.", a: true, exp: "where = où : the place where I live, the office where she works." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>The village where my grandparents live is very small and quiet. My grandfather, who is eighty-five, still tends the garden that he planted fifty years ago. The house, which was built by his own father, has thick stone walls and a red roof. In the centre of the village there is an old church whose bells ring every Sunday. My grandmother, who loves cooking, makes the best apple pie that I have ever tasted. I remember the summer when we spent two whole months there. The people who live in the village all know each other, and the shop that sells bread is also the post office. It is a place that I will always love.</p>`,
    questions: [
      { type: "qcm", q: "Which relative pronoun introduces « the village ___ my grandparents live »?", opts: ["who", "which", "where", "whose"], a: 2, exp: "where, car il s'agit d'un lieu : the village where my grandparents live." },
      { type: "vf", q: "In « My grandfather, who is eighty-five, ... », the relative clause is non-defining (extra information).", a: true, exp: "Entre virgules, avec who : c'est une relative explicative (info secondaire)." },
      { type: "input", q: "Complete from the text: « an old church ___ bells ring every Sunday. » (possession)", a: ["whose"], ph: "un mot", exp: "whose = dont : the church whose bells ring." },
      { type: "qcm", q: "In « the best apple pie that I have ever tasted », could « that » be left out?", opts: ["No, it is the subject", "Yes, because it is the object (I is the subject that follows)", "No, it is a place", "No, it needs a comma"], a: 1, exp: "that est complément (I = sujet juste après) : on pourrait dire the best apple pie I have ever tasted." },
      { type: "qcm", q: "Why does the text use so many relative clauses?", opts: ["To ask questions", "To add precise information about people, places and things", "To describe the future", "By mistake"], a: 1, exp: "Les relatives permettent de préciser et d'enrichir la description sans multiplier les phrases courtes." }
    ],
    solution: `<p>Réponses : where ; Vrai ; « whose » ; Yes, because it is the object ; To add precise information about people, places and things.</p>
<p>Ce texte enchaîne tous les pronoms relatifs : <em>where</em> (lieu), <em>who</em> (personnes), <em>which/that</em> (choses), <em>whose</em> (possession), <em>when</em> (temps). Repère les relatives explicatives entre virgules (<em>who is eighty-five, which was built by his own father, who loves cooking</em>) et les déterminatives sans virgule (<em>the garden that he planted, the shop that sells bread</em>).</p>`
  }
};
