  title: "Le conditionnel de type 3",
  subtitle: "If + past perfect, would have + participe passé : les regrets et le passé irréel.",
  theory: `
<h3>1. Regarder le passé « si les choses avaient été différentes »</h3>
<p>Le <strong>conditionnel de type 3</strong> (third conditional) parle d'une situation <strong>passée qui ne s'est pas produite</strong>. On imagine un passé différent de la réalité, et sa conséquence, elle aussi imaginaire. C'est le temps des <strong>regrets</strong> et des « et si j'avais... ». Comme le passé est terminé, rien ne peut plus le changer : la situation est totalement <strong>irréelle</strong>.</p>
<pre class="pseudo">If I had studied harder, I would have passed the exam.
// Si j'avais travaille plus dur, j'aurais reussi l'examen. (mais je n'ai pas travaille, et j'ai echoue)</pre>
<h3>2. La construction</h3>
<p>Deux parties. La condition (avec <strong>if</strong>) se met au <strong>past perfect</strong> (had + participe passé). La conséquence se construit avec <strong>would have</strong> + participe passé.</p>
<pre class="pseudo">If + sujet + had + participe passe , sujet + would have + participe passe

If you had called me,   I would have helped you.   // Si tu m'avais appele, je t'aurais aide.
I would have helped you   if you had called me.     // (les deux ordres sont possibles)</pre>
<div class="tip">Repère mémoire : type 2 = présent irréel (<em>would + verbe</em>) ; type 3 = passé irréel (<em>would have + participe passé</em>). Le « have » signale qu'on est dans le passé.</div>
<h3>3. Différence avec le type 2</h3>
<p>Compare bien les deux : le <strong>type 2</strong> imagine le <strong>présent</strong> ; le <strong>type 3</strong> imagine le <strong>passé</strong>.</p>
<pre class="pseudo">Type 2 : If I had money, I would buy a car.
         // Si j'avais de l'argent (maintenant), j'acheterais une voiture.
Type 3 : If I had had money, I would have bought a car.
         // Si j'avais eu de l'argent (a l'epoque), j'aurais achete une voiture.</pre>
<div class="warn">Ne mélange pas les deux : au type 3, la partie if est au <strong>past perfect</strong> (had + participe passé), pas au simple prétérit. Et la conséquence est <strong>would have + participe passé</strong>, pas juste <em>would</em>.</div>
<h3>4. Would have, could have, might have</h3>
<p>Comme au type 2, on peut nuancer la conséquence avec <strong>could have</strong> (aurait pu) ou <strong>might have</strong> (aurait peut-être).</p>
<pre class="pseudo">If we had left earlier, we could have caught the train.   // Si on etait partis plus tot, on aurait pu avoir le train.
If she had asked, I might have said yes.                   // Si elle avait demande, j'aurais peut-etre dit oui.</pre>
<h3>5. Exprimer un regret</h3>
<p>Le type 3 est le temps naturel du <strong>regret</strong> : on repense à ce qu'on aurait dû faire différemment. Les formes contractées sont fréquentes : <strong>would have</strong> devient souvent <strong>would've</strong> à l'oral, et <strong>hadn't</strong> = had not.</p>
<pre class="pseudo">If I hadn't missed the bus, I wouldn't have been late.
// Si je n'avais pas rate le bus, je n'aurais pas ete en retard.</pre>
<div class="warn">Erreur fréquente : « If I would have known... ». On ne met JAMAIS <em>would</em> dans la partie if. On dit : <em>If I had known...</em>.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la structure du conditionnel de type 3 ?", opts: ["If + prétérit, would + verbe", "If + past perfect, would have + participe passé", "If + présent, will + verbe", "If + would have, past perfect"], a: 1, exp: "Condition au past perfect (had + p.p.), conséquence en would have + p.p." },
    { type: "input", q: "Complète la conséquence : « If you had asked, I ___ have helped you. »", a: ["would"], ph: "un mot", exp: "Conséquence du type 3 : would have + participe passé." },
    { type: "input", q: "Mets au past perfect : « If she ___ (study) more, she would have passed. »", a: ["had studied"], ph: "2 mots", exp: "La condition du type 3 est au past perfect : had studied." },
    { type: "qcm", q: "Le type 3 parle...", opts: ["du présent hypothétique", "du passé irréel (qui ne s'est pas produit)", "du futur certain", "d'une habitude"], a: 1, exp: "Il imagine un passé différent de la réalité : le passé irréel, souvent avec regret." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["If I would have known, I would have called.", "If I had known, I would have called.", "If I knew, I would have called.", "If I have known, I will call."], a: 1, exp: "Partie if au past perfect (had known), conséquence en would have. Jamais would dans le if." },
    { type: "input", q: "Complète : « If we ___ left earlier, we would have caught the train. » (auxiliaire)", a: ["had"], ph: "un mot", exp: "past perfect dans la condition : If we had left earlier." },
    { type: "vf", q: "Au type 3, on peut encore changer le résultat car la situation est présente.", a: false, exp: "Non : le passé est terminé, la situation est totalement irréelle. On ne peut plus rien changer, d'où le regret." },
    { type: "input", q: "Complète avec un participe passé : « If they had known, they would have ___ (come). »", a: ["come"], ph: "participe passé", exp: "come / came / come : would have come." },
    { type: "qcm", q: "Quelle phrase imagine le PASSÉ (type 3) ?", opts: ["If I had money, I would buy a car.", "If I had had money, I would have bought a car.", "If I have money, I will buy a car.", "If I get money, I buy a car."], a: 1, exp: "had had + would have bought = passé irréel (type 3)." },
    { type: "input", q: "Remplace would have par un modal de possibilité passée : « If she had asked, I ___ have said yes. » (peut-être)", a: ["might", "could"], ph: "un mot", exp: "might have said (ou could have said) : possibilité dans le passé." },
    { type: "qcm", q: "Lis : « If Tom hadn't forgotten his passport, he would have travelled with us. » Que s'est-il réellement passé ?", opts: ["Tom a voyagé avec eux", "Tom a oublié son passeport et n'a pas voyagé avec eux", "Tom n'a pas de passeport", "Tom voyage demain"], a: 1, exp: "hadn't forgotten est irréel : en réalité, Tom A oublié son passeport, donc il n'a PAS voyagé avec eux." },
    { type: "vf", q: "« would've » est la contraction de « would have ».", a: true, exp: "À l'oral et à l'écrit familier, would have devient souvent would've." },
    { type: "input", q: "Traduis la conséquence : « je n'aurais pas été en retard » → « I ___ ___ ___ late. » (3 mots)", a: ["wouldn't have been", "would not have been"], ph: "3 mots", exp: "wouldn't have been late : négation de would have + been (participe passé de be)." },
    { type: "qcm", q: "« If I ___ known you were ill, I would have visited you. »", opts: ["would have", "had", "have", "did"], a: 1, exp: "Partie if au past perfect : If I had known." },
    { type: "vf", q: "La différence entre type 2 et type 3 tient surtout à la présence de « have » dans le type 3.", a: true, exp: "Type 2 : would + verbe (présent). Type 3 : would HAVE + participe passé (passé)." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>Last year, Daniel had the chance to study abroad, but he said no. Now he often thinks about it. If he had accepted the offer, he would have learned a new language and met people from all over the world. If he had been braver, he would not have stayed in his small town. His teacher told him: If you had asked me for advice, I would have encouraged you to go. Daniel knows that if he had saved more money, he could have paid for the trip easily. He also thinks that if his parents had not worried so much, he might have felt more confident. He does not want to repeat the same mistake: next time, if he gets an opportunity, he will take it.</p>`,
    questions: [
      { type: "qcm", q: "Did Daniel study abroad last year?", opts: ["Yes, he did", "No, he said no to the offer", "He is studying now", "He will study next year"], a: 1, exp: "He had the chance but he said no. Les phrases en type 3 imaginent ce qui ne s'est pas produit." },
      { type: "vf", q: "If he had accepted the offer, he would have learned a new language.", a: true, exp: "C'est exactement ce que dit le texte (conditionnel de type 3)." },
      { type: "input", q: "Complete from the text: « If he had ___ more money, he could have paid for the trip. »", a: ["saved"], ph: "participe passé", exp: "If he had saved more money (past perfect)." },
      { type: "qcm", q: "What tense does the teacher use in « If you had asked me... I would have encouraged you »?", opts: ["First conditional", "Second conditional", "Third conditional", "Present perfect"], a: 2, exp: "Type 3 : if + past perfect, would have + participe passé." },
      { type: "qcm", q: "How does the last sentence differ from the rest?", opts: ["It is also a type 3", "It uses a type 1 (real future): if he gets an opportunity, he will take it", "It uses the past perfect", "It has no verb"], a: 1, exp: "La dernière phrase parle d'un futur réel et possible : type 1 (if + présent, will + verbe)." }
    ],
    solution: `<p>Réponses : No, he said no to the offer ; Vrai ; « saved » ; Third conditional ; It uses a type 1 (real future).</p>
<p>Tout le texte exprime des regrets au type 3 : <em>if he had accepted... would have learned</em>, <em>if he had been braver... would not have stayed</em>, <em>if you had asked... would have encouraged</em>. La dernière phrase bascule en type 1 (<em>if he gets... he will take it</em>) car elle parle d'une possibilité réelle dans le futur. Distingue bien le passé irréel (type 3) du futur possible (type 1).</p>`
  }
};
