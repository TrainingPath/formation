<script>
var DAY = {
  num: 2,
  title: "Le past continuous et le passé simple",
  subtitle: "Was/were + verbe-ing : le décor du passé et l'action qui l'interrompt.",
  theory: `
<h3>1. Deux temps qui travaillent ensemble</h3>
<p>Pour raconter une histoire au passé, l'anglais combine souvent deux temps. Le <strong>past simple</strong> (le passé simple, ou prétérit) décrit une action <strong>terminée et ponctuelle</strong> : elle a eu lieu, elle est finie. Le <strong>past continuous</strong> (le passé continu ou progressif) décrit une action <strong>en cours de déroulement</strong> à un moment donné du passé : c'est le <em>décor</em>, l'arrière-plan de la scène.</p>
<pre class="pseudo">The phone rang.              // Le telephone a sonne. (action ponctuelle, past simple)
I was sleeping.              // Je dormais. (action en cours, past continuous)
I was sleeping when the phone rang.   // Je dormais quand le telephone a sonne.</pre>
<h3>2. Construire le past continuous</h3>
<p>Il se forme avec l'auxiliaire <strong>be</strong> conjugué au passé (<strong>was</strong> ou <strong>were</strong>) suivi du verbe principal en <strong>-ing</strong>.</p>
<pre class="pseudo">Sujet + was/were + verbe-ing

I / he / she / it     was    working
you / we / they       were   working</pre>
<p>Négation : on ajoute <strong>not</strong> (wasn't / weren't). Question : on inverse sujet et auxiliaire.</p>
<pre class="pseudo">She was not listening.       // Elle n'ecoutait pas.
Were you watching TV?        // Est-ce que tu regardais la television ?</pre>
<h3>3. L'action longue interrompue par l'action courte</h3>
<p>Le schéma le plus fréquent : une action longue (past continuous) sert de décor, et une action courte (past simple) vient l'<strong>interrompre</strong>. Le mot <strong>when</strong> (quand) introduit généralement l'action courte, et <strong>while</strong> (pendant que) introduit l'action longue.</p>
<pre class="pseudo">While I was cooking, the doorbell rang.   // Pendant que je cuisinais, on a sonne a la porte.
I was cooking when the doorbell rang.     // Je cuisinais quand on a sonne.</pre>
<div class="tip">Règle simple : <strong>while</strong> + action longue (past continuous) ; <strong>when</strong> + action courte (past simple). L'action longue est le décor, l'action courte est l'événement.</div>
<h3>4. Deux actions longues en parallèle</h3>
<p>Quand deux actions se déroulent <strong>en même temps</strong> sur une durée, on met les deux au past continuous, reliées par <strong>while</strong>.</p>
<pre class="pseudo">She was reading while he was cooking.   // Elle lisait pendant qu'il cuisinait. (les deux en parallele)</pre>
<h3>5. Planter le décor d'un récit</h3>
<p>On utilise aussi le past continuous seul, au début d'une histoire, pour décrire l'ambiance et le contexte avant que l'action ne commence.</p>
<pre class="pseudo">It was getting dark. The wind was blowing and the rain was falling.
// Il commencait a faire nuit. Le vent soufflait et la pluie tombait.</pre>
<div class="warn">Attention aux verbes d'état (know, want, love, be...) : comme au present perfect continuous, ils ne se mettent pas au continu. On dit <em>I knew the answer</em> (past simple), jamais « I was knowing ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment se construit le past continuous ?", opts: ["did + verbe-ing", "was/were + verbe-ing", "had + verbe-ing", "was/were + verbe + ed"], a: 1, exp: "Auxiliaire be au passé (was/were) + verbe en -ing." },
    { type: "input", q: "Complète avec was ou were : « They ___ playing in the garden. »", a: ["were"], ph: "was ou were", exp: "They (pluriel) prend were." },
    { type: "input", q: "Complète avec was ou were : « She ___ reading a book. »", a: ["was"], ph: "was ou were", exp: "She (3e pers. singulier) prend was." },
    { type: "qcm", q: "« I ___ a shower when the lights went out. »", opts: ["was having", "had", "have been having", "was had"], a: 0, exp: "Action longue interrompue : past continuous (was having) + past simple (went out)." },
    { type: "qcm", q: "Quel mot introduit d'habitude l'action LONGUE (le décor) ?", opts: ["when", "while", "then", "as soon as"], a: 1, exp: "while + action longue (past continuous) ; when + action courte." },
    { type: "input", q: "Mets le verbe à la bonne forme : « While we ___ (walk), it started to rain. »", a: ["were walking"], ph: "2 mots", exp: "Action longue avec while : were walking (we + were + walking)." },
    { type: "vf", q: "Dans « I was watching TV when the phone rang », c'est le fait de regarder la télé qui interrompt la sonnerie.", a: false, exp: "C'est l'inverse : la sonnerie (action courte, past simple) interrompt le fait de regarder la télé (action longue, past continuous)." },
    { type: "input", q: "Complète la question : « What ___ you doing at 8 o'clock? » (auxiliaire)", a: ["were"], ph: "un mot", exp: "you prend were : What were you doing?" },
    { type: "qcm", q: "Deux actions longues en parallèle : « She was cooking ___ he was cleaning. »", opts: ["when", "while", "since", "as soon as"], a: 1, exp: "Deux actions longues simultanées : on les relie avec while." },
    { type: "qcm", q: "Lis : « At 9 p.m. yesterday, the children were sleeping and their parents were watching a film. » Que décrit cette phrase ?", opts: ["Des actions ponctuelles finies", "Le décor : ce qui était en cours à un moment précis du passé", "Un projet pour le futur", "Une habitude passée"], a: 1, exp: "Le past continuous plante le décor : ce qui se déroulait à 21 h hier." },
    { type: "input", q: "Mets au past simple : « The phone ___ (ring) while I was cooking. »", a: ["rang"], ph: "verbe au passé", exp: "ring est irrégulier : ring / rang / rung. Action courte = past simple = rang." },
    { type: "vf", q: "« I was knowing the answer » est une phrase correcte.", a: false, exp: "know est un verbe d'état : il ne se met pas au continu. On dit I knew the answer." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["We was watching a film.", "We were watching a film.", "We were watch a film.", "We was watch a film."], a: 1, exp: "We prend were, suivi du verbe en -ing : were watching." },
    { type: "input", q: "Complète : « The sun ___ shining and the birds were singing. » (was ou were)", a: ["was"], ph: "was ou were", exp: "The sun est singulier : was shining." },
    { type: "vf", q: "On peut utiliser le past continuous pour décrire l'ambiance au début d'une histoire.", a: true, exp: "Ex : It was raining and the streets were empty. Le continu plante le décor du récit." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short story, then answer the questions.</p>
<p>Yesterday afternoon, Sophie was walking home from school when she saw something strange. It was raining hard, and the streets were almost empty. While she was crossing the park, she noticed a small dog under a tree. The dog was shaking because it was cold and wet. Sophie was carrying an umbrella, so she stopped and covered the animal. As she was looking for the owner, an old man appeared. He was running towards them and shouting the dog's name. He was very happy, because he had lost his pet an hour before. Sophie smiled while the man was thanking her again and again.</p>`,
    questions: [
      { type: "qcm", q: "What was the weather like?", opts: ["It was sunny", "It was raining hard", "It was snowing", "It was windy but dry"], a: 1, exp: "The text says: it was raining hard." },
      { type: "vf", q: "The dog was shaking because it was cold and wet.", a: true, exp: "The text states this directly." },
      { type: "input", q: "Complete from the text: « While she was ___ the park, she noticed a small dog. »", a: ["crossing"], ph: "un mot", exp: "While she was crossing the park." },
      { type: "qcm", q: "What was the old man doing when he appeared?", opts: ["He was sleeping", "He was running and shouting the dog's name", "He was reading", "He was driving a car"], a: 1, exp: "He was running towards them and shouting the dog's name." },
      { type: "qcm", q: "Why was the man happy?", opts: ["He won a prize", "He found his lost pet", "It stopped raining", "He met Sophie's family"], a: 1, exp: "He was happy because he had lost his pet an hour before and now it was found." }
    ],
    solution: `<p>Réponses : It was raining hard ; Vrai ; « crossing » ; He was running and shouting the dog's name ; He found his lost pet.</p>
<p>Observe l'alternance des deux temps : le <em>past continuous</em> (was walking, was crossing, was shaking, was running) plante le décor et les actions en cours, tandis que le <em>past simple</em> (saw, noticed, stopped, appeared, smiled) marque les événements ponctuels qui font avancer l'histoire. C'est la mécanique de tout récit en anglais.</p>`
  }
};
</script>
