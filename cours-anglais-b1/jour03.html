  title: "Le past perfect",
  subtitle: "Had + participe passé : le passé du passé, pour dire ce qui s'était produit avant.",
  theory: `
<h3>1. Le passé avant le passé</h3>
<p>Le <strong>past perfect</strong> (le plus-que-parfait) sert à parler d'une action qui s'est produite <strong>avant une autre action passée</strong>. Quand on raconte une histoire au passé et qu'on veut faire un « retour en arrière » vers un événement encore plus ancien, on utilise le past perfect. Il situe clairement l'ordre des événements dans le temps.</p>
<pre class="pseudo">When I arrived, the train had already left.
// Quand je suis arrive, le train etait deja parti. (le depart est AVANT mon arrivee)</pre>
<div class="tip">Image : imagine une flèche du temps. Le past simple marque un point ; le past perfect marque un point <strong>encore plus à gauche</strong>, plus ancien. C'est le « passé du passé ».</div>
<h3>2. La construction</h3>
<p>Le past perfect se forme avec l'auxiliaire <strong>had</strong> (identique à toutes les personnes) suivi du <strong>participe passé</strong> du verbe. Le participe passé est la forme en <strong>-ed</strong> pour les verbes réguliers (worked, played) ou la troisième colonne pour les verbes irréguliers (go / went / <strong>gone</strong>, see / saw / <strong>seen</strong>).</p>
<pre class="pseudo">Sujet + had + participe passe

I / you / he / she / we / they   had   finished
I / you / he / she / we / they   had   gone</pre>
<p>Négation : <strong>had not</strong> (hadn't). Question : <strong>Had</strong> + sujet + participe passé.</p>
<pre class="pseudo">She had not eaten anything.        // Elle n'avait rien mange.
Had you seen the film before?      // Avais-tu deja vu le film avant ?</pre>
<h3>3. L'ordre des événements</h3>
<p>Le past perfect marque toujours l'événement <strong>le plus ancien</strong>, et le past simple marque l'événement <strong>le plus récent</strong>. Peu importe l'ordre dans lequel on écrit la phrase : la grammaire dit lequel a eu lieu en premier.</p>
<pre class="pseudo">The film had started when we got to the cinema.
// Le film avait commence quand nous sommes arrives au cinema. (1. le film commence  2. on arrive)
After she had finished her work, she went home.
// Apres avoir fini son travail, elle est rentree. (1. finir  2. rentrer)</pre>
<h3>4. Les mots qui accompagnent le past perfect</h3>
<p>Certains mots signalent souvent le past perfect : <strong>already</strong> (déjà), <strong>just</strong> (juste, à peine), <strong>never</strong> (jamais), <strong>yet</strong> (encore, pas encore), <strong>before</strong> (avant), <strong>after</strong> (après), <strong>by the time</strong> (au moment où).</p>
<pre class="pseudo">By the time we arrived, they had already gone.   // Quand on est arrives, ils etaient deja partis.
It was the first time I had ever seen snow.       // C'etait la premiere fois que je voyais de la neige.</pre>
<h3>5. Ne pas en abuser</h3>
<p>Le past perfect ne s'emploie que lorsqu'il y a <strong>deux moments passés distincts</strong> et qu'il faut préciser lequel vient en premier. Pour une simple suite d'actions dans l'ordre chronologique, le past simple suffit.</p>
<pre class="pseudo">I got up, had breakfast and left.   // Je me suis leve, j'ai dejeune et je suis parti. (ordre naturel : past simple)</pre>
<div class="warn">Ne mets pas tout au past perfect « pour faire ancien ». Réserve-le au retour en arrière : une action antérieure à une autre action déjà passée.</div>`,
  exercises: [
    { type: "qcm", q: "Comment se construit le past perfect ?", opts: ["was/were + participe passé", "had + participe passé", "have + participe passé", "did + participe passé"], a: 1, exp: "L'auxiliaire had (à toutes les personnes) suivi du participe passé." },
    { type: "input", q: "Complète : « When we arrived, the concert ___ already started. » (auxiliaire)", a: ["had"], ph: "un mot", exp: "past perfect : had already started (le concert avait commencé avant notre arrivée)." },
    { type: "input", q: "Mets au participe passé : « She had ___ (finish) her homework before dinner. »", a: ["finished"], ph: "participe passé", exp: "finish est régulier : had finished." },
    { type: "input", q: "Mets au participe passé irrégulier : « They had ___ (go) home when I called. »", a: ["gone"], ph: "participe passé", exp: "go / went / gone : had gone." },
    { type: "qcm", q: "« When I got to the station, the train ___. » Quelle suite marque que le train est parti AVANT mon arrivée ?", opts: ["left", "was leaving", "had left", "leaves"], a: 2, exp: "had left = le train était déjà parti avant mon arrivée (past perfect)." },
    { type: "qcm", q: "Dans « After she had eaten, she went out », quel événement a eu lieu EN PREMIER ?", opts: ["Elle est sortie", "Elle a mangé", "Les deux en même temps", "On ne peut pas savoir"], a: 1, exp: "Le past perfect (had eaten) marque l'action la plus ancienne : manger d'abord, sortir ensuite." },
    { type: "vf", q: "L'auxiliaire du past perfect change selon la personne (I have, he has...).", a: false, exp: "Non : c'est toujours had, à toutes les personnes." },
    { type: "input", q: "Forme négative : « He ___ not seen the sea before that trip. » (auxiliaire)", a: ["had"], ph: "un mot", exp: "had not seen : il n'avait jamais vu la mer avant ce voyage." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["I had went to bed when the storm began.", "I had gone to bed when the storm began.", "I have gone to bed when the storm began.", "I had go to bed when the storm began."], a: 1, exp: "had + participe passé : had gone (go/went/gone)." },
    { type: "input", q: "Complète : « By the time the film ended, I ___ already fallen asleep. » (auxiliaire)", a: ["had"], ph: "un mot", exp: "past perfect : had already fallen asleep." },
    { type: "vf", q: "Pour une simple suite d'actions dans l'ordre (je me lève, je déjeune, je pars), on doit tout mettre au past perfect.", a: false, exp: "Non : dans l'ordre chronologique naturel, le past simple suffit. Le past perfect sert au retour en arrière." },
    { type: "qcm", q: "Lis : « When Mark opened the door, his guests had already arrived. » Que comprend-on ?", opts: ["Les invités arrivent après l'ouverture de la porte", "Les invités étaient déjà là avant que Mark ouvre la porte", "Mark n'a pas ouvert la porte", "Les invités arrivent en même temps"], a: 1, exp: "had already arrived = les invités étaient là avant l'ouverture de la porte." },
    { type: "input", q: "Traduis : « Elle avait perdu ses clés. » → « She ___ ___ her keys. » (2 mots)", a: ["had lost"], ph: "2 mots", exp: "had lost : lose / lost / lost." },
    { type: "qcm", q: "« It was the first time she ___ ever flown. »", opts: ["has", "had", "was", "did"], a: 1, exp: "Après « the first time » dans un récit au passé, on utilise le past perfect : had ever flown." },
    { type: "vf", q: "Dans « The rain had stopped when we went out », il a plu et s'est arrêté AVANT qu'on sorte.", a: true, exp: "had stopped (past perfect) = la pluie s'était arrêtée avant la sortie (past simple)." }
  ],

    intro: `<p>Read this short story, then answer the questions.</p>
<p>When Julia got home on Friday evening, she immediately felt that something was wrong. Someone had opened the window in the living room, and the curtains were moving in the wind. She remembered that she had closed everything before leaving in the morning. On the table, she saw a cup of coffee that she had not made. Her heart started beating fast. Then she noticed a pair of muddy shoes near the door. Suddenly she smiled: her brother had arrived early from his trip. He had used his old key, had made himself a coffee, and had fallen asleep on the sofa. Julia had worried for nothing.</p>`,
    questions: [
      { type: "qcm", q: "What had Julia done before leaving in the morning?", opts: ["She had left the window open", "She had closed everything", "She had made a coffee", "She had called her brother"], a: 1, exp: "She remembered that she had closed everything before leaving." },
      { type: "vf", q: "Julia had made the cup of coffee on the table.", a: false, exp: "The text says it was a coffee that she had NOT made." },
      { type: "qcm", q: "Who had really entered the house?", opts: ["A thief", "A neighbour", "Her brother", "Nobody"], a: 2, exp: "Her brother had arrived early from his trip." },
      { type: "input", q: "Complete from the text: « He had used his old ___ to enter. »", a: ["key"], ph: "un mot", exp: "He had used his old key." },
      { type: "qcm", q: "Why does the past perfect appear so often in this text?", opts: ["To describe the future", "To show actions that happened before Julia got home", "To give orders", "To describe the weather only"], a: 1, exp: "Le past perfect marque tout ce qui s'était produit avant le moment où Julia rentre chez elle." }
    ],
    solution: `<p>Réponses : She had closed everything ; Faux ; Her brother ; « key » ; To show actions that happened before Julia got home.</p>
<p>Repère la logique du texte : l'événement de référence est « Julia got home » (past simple). Tout ce qui s'était passé AVANT ce moment est au past perfect : <em>had opened, had closed, had not made, had arrived, had used, had made, had fallen asleep, had worried</em>. Le past perfect est l'outil du retour en arrière.</p>`
  }
};
