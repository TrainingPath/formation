<script>
var DAY = {
  num: 8,
  title: "Le discours indirect (reported speech)",
  subtitle: "Rapporter les paroles de quelqu'un sans les citer mot pour mot.",
  theory: `
<h3>1. Citer ou rapporter</h3>
<p>Il y a deux façons de rapporter ce que quelqu'un a dit. Le <strong>discours direct</strong> cite les mots exacts entre guillemets : <em>She said, I am tired</em>. Le <strong>discours indirect</strong> (reported speech) rapporte le sens sans guillemets, en intégrant les paroles dans la phrase : <em>She said that she was tired</em>. Cette transformation demande quelques changements précis.</p>
<h3>2. Le recul des temps (backshift)</h3>
<p>Quand le verbe introducteur est au <strong>passé</strong> (said, told), les temps de la phrase rapportée <strong>reculent</strong> d'un cran vers le passé. C'est la règle la plus importante.</p>
<pre class="pseudo">Direct                          ->  Indirect
present simple (work)           ->  preterit (worked)
present continu (am working)    ->  past continu (was working)
preterit (worked)               ->  past perfect (had worked)
will                            ->  would
can                             ->  could
must                            ->  had to</pre>
<pre class="pseudo">"I live in London."      ->  He said that he lived in London.   // present -> preterit
"I will call you."       ->  She said that she would call me.   // will -> would</pre>
<div class="tip">Le mot <strong>that</strong> (que) est souvent facultatif : <em>He said he was tired</em> = <em>He said that he was tired</em>.</div>
<h3>3. Say ou tell ?</h3>
<p>Deux verbes introduisent souvent le discours indirect. <strong>Tell</strong> est suivi directement de la personne à qui l'on parle (<em>tell me, tell him</em>). <strong>Say</strong> ne prend pas de personne juste après (ou alors avec <em>to</em> : say to me).</p>
<pre class="pseudo">She told me that she was happy.     // Elle m'a dit qu'elle etait heureuse. (tell + personne)
She said that she was happy.        // Elle a dit qu'elle etait heureuse. (say sans personne)</pre>
<div class="warn">On ne dit pas « She said me » ni « She told that... » (sans personne). Retiens : <strong>tell</strong> + quelqu'un, <strong>say</strong> (+ to quelqu'un).</div>
<h3>4. Les changements de pronoms et de repères</h3>
<p>Les <strong>pronoms</strong> changent selon le point de vue (I devient he/she, my devient his/her). Les <strong>repères de temps et de lieu</strong> changent aussi.</p>
<pre class="pseudo">now      -> then            today    -> that day
tomorrow -> the next day    yesterday-> the day before
here     -> there           this     -> that</pre>
<pre class="pseudo">"I saw you here yesterday."  ->  He said he had seen me there the day before.</pre>
<h3>5. Rapporter les questions</h3>
<p>Pour rapporter une question, on utilise souvent <strong>asked</strong>. La question redevient une phrase dans l'<strong>ordre normal</strong> (sujet + verbe), sans point d'interrogation. Pour une question fermée (oui/non), on introduit par <strong>if</strong> ou <strong>whether</strong> (si).</p>
<pre class="pseudo">"Where do you live?"   ->  She asked me where I lived.        // ordre normal, pas d'inversion
"Are you ready?"       ->  He asked if I was ready.            // question fermee : if / whether</pre>
<div class="warn">Attention : dans la question rapportée, plus d'inversion et plus d'auxiliaire do/does/did. On ne dit pas « She asked where did I live » mais « She asked where I lived ».</div>`,
  exercises: [
    { type: "qcm", q: "Au discours indirect (verbe introducteur au passé), le présent simple devient...", opts: ["présent continu", "prétérit", "past perfect", "will"], a: 1, exp: "Recul des temps : présent simple -> prétérit (I live -> he lived)." },
    { type: "input", q: "Transforme : « I am tired » → « She said she ___ tired. »", a: ["was"], ph: "un mot", exp: "présent continu am -> was : she was tired." },
    { type: "qcm", q: "« I will help you » devient au discours indirect...", opts: ["He said he will help me.", "He said he would help me.", "He said he helped me.", "He said he can help me."], a: 1, exp: "will -> would : He said he would help me." },
    { type: "input", q: "Complète avec tell ou say : « She ___ me that she was busy. »", a: ["told"], ph: "un mot", exp: "tell + personne (me) : She told me. (Say ne prend pas la personne directement.)" },
    { type: "input", q: "Complète avec tell ou say : « He ___ that the shop was closed. »", a: ["said"], ph: "un mot", exp: "Pas de personne juste après : say (He said that...)." },
    { type: "qcm", q: "« I can swim » devient...", opts: ["He said he can swim.", "He said he could swim.", "He said he swam.", "He said he will swim."], a: 1, exp: "can -> could au discours indirect passé." },
    { type: "vf", q: "Dans une question rapportée, on garde l'inversion sujet-auxiliaire (Where did I live).", a: false, exp: "Non : la question rapportée reprend l'ordre normal, sans inversion : She asked where I lived." },
    { type: "input", q: "Transforme la question fermée : « Are you ready? » → « He asked ___ I was ready. » (un mot)", a: ["if", "whether"], ph: "un mot", exp: "Question oui/non rapportée : if ou whether (He asked if I was ready)." },
    { type: "qcm", q: "« I saw you yesterday » devient...", opts: ["He said he saw me yesterday.", "He said he had seen me the day before.", "He said he has seen me yesterday.", "He said he sees me the day before."], a: 1, exp: "prétérit -> past perfect (saw -> had seen) et yesterday -> the day before." },
    { type: "input", q: "Transforme : « We live here » → « They said they lived ___. » (changement de lieu)", a: ["there"], ph: "un mot", exp: "here -> there au discours indirect." },
    { type: "qcm", q: "Lis : « Mia said, I must finish my homework tonight. » Quelle version indirecte est correcte ?", opts: ["Mia said she must finish her homework that night.", "Mia said she had to finish her homework that night.", "Mia said she must finished her homework tonight.", "Mia told she had to finish her homework."], a: 1, exp: "must -> had to, my -> her, tonight -> that night. (Et tell exige une personne, donc pas Mia told that.)" },
    { type: "input", q: "Transforme la question : « Where do you work? » → « She asked me where I ___. »", a: ["worked"], ph: "un mot", exp: "Ordre normal, présent -> prétérit, sans do : where I worked." },
    { type: "vf", q: "Le mot « that » après say/tell est souvent facultatif.", a: true, exp: "He said he was tired = He said that he was tired : that peut s'omettre." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["She told me she will come.", "She told me she would come.", "She said me she would come.", "She told that she would come."], a: 1, exp: "tell + personne (me), et will -> would : She told me she would come." },
    { type: "input", q: "Transforme : « I can't come tomorrow » → « He said he couldn't come the next ___. »", a: ["day"], ph: "un mot", exp: "tomorrow -> the next day (ou the following day)." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text, then answer the questions.</p>
<p>Yesterday, my neighbour Mr Grant came to my door. He told me that he was going on holiday the next day. He said that he would be away for two weeks. He asked me if I could water his plants and feed his cat. He also asked me where the nearest post office was, because he wanted to send a letter before leaving. I said that I would help him with pleasure. He explained that he had already given a spare key to another neighbour, but that he trusted me more. Before leaving, he told me that he had left some money on the kitchen table for the cat food. I promised him that everything would be fine.</p>`,
    questions: [
      { type: "qcm", q: "When was Mr Grant going on holiday?", opts: ["The same day", "The next day", "Two weeks before", "He was not going"], a: 1, exp: "He told me that he was going on holiday the next day (tomorrow -> the next day)." },
      { type: "vf", q: "Mr Grant asked the narrator if he could water the plants and feed the cat.", a: true, exp: "The text reports this request in indirect speech." },
      { type: "input", q: "Complete from the text: « He said that he ___ be away for two weeks. » (will -> ?)", a: ["would"], ph: "un mot", exp: "Discours indirect : will -> would (he would be away)." },
      { type: "qcm", q: "Which verb introduces the reported yes/no question?", opts: ["said + that", "told + that", "asked + if", "explained + that"], a: 2, exp: "He asked me IF I could water his plants : question fermée rapportée avec if." },
      { type: "qcm", q: "Why does the text use « had already given » and « had left »?", opts: ["To describe the future", "Because the original past tense shifts to past perfect in reported speech", "To ask a question", "By mistake"], a: 1, exp: "Recul des temps : le prétérit du discours direct devient past perfect au discours indirect." }
    ],
    solution: `<p>Réponses : The next day ; Vrai ; « would » ; asked + if ; Because the original past tense shifts to past perfect.</p>
<p>Ce texte est entièrement au discours indirect : remarque le recul des temps (<em>was going, would be, had given, had left</em>), le choix de <em>told me</em> (tell + personne) et <em>said that</em> (say sans personne), la question rapportée avec <em>asked if</em> et l'ordre normal <em>asked where the post office was</em> (sans inversion).</p>`
  }
};
</script>
