  title: "So, such, too, enough",
  subtitle: "Insister, exagérer, dire qu'il y en a assez ou trop.",
  theory: `
<h3>1. Pourquoi ces quatre mots ?</h3>
<p>Ces quatre petits mots servent à <strong>renforcer</strong> ou à <strong>nuancer</strong> un adjectif. Ils traduisent nos « si », « tellement », « trop » et « assez » du français. Le piège, c'est qu'ils ne se placent pas au même endroit dans la phrase. On les étudie ensemble pour bien voir leurs différences.</p>
<h3>2. SO + adjectif ou adverbe (« si », « tellement »)</h3>
<p><strong>So</strong> se met devant un adjectif ou un adverbe seul, sans nom juste après.</p>
<pre class="pseudo">This film is so boring.        // Ce film est tellement ennuyeux.
She sings so well.            // Elle chante si bien.
I was so tired that I slept.  // J'etais si fatigue que j'ai dormi.</pre>
<div class="tip">On peut prolonger avec « so ... that ... » (« si ... que ... ») pour exprimer une consequence : <em>It was so cold that the lake froze.</em> = Il faisait si froid que le lac a gele.</div>
<h3>3. SUCH + (a/an) + adjectif + NOM (« un tel », « tellement de »)</h3>
<p><strong>Such</strong> s'emploie quand il y a un <strong>nom</strong>. On garde l'article « a/an » pour un nom singulier denombrable.</p>
<pre class="pseudo">It is such a boring film.     // C'est un film tellement ennuyeux.
They are such nice people.    // Ce sont des gens tellement gentils.
It was such good weather.     // Il faisait un temps si agreable.</pre>
<div class="warn">Ne dis jamais « so a boring film » ni « such boring » tout seul. Regle simple : <strong>so</strong> + adjectif SEUL ; <strong>such</strong> + adjectif + NOM.</div>
<h3>4. TOO + adjectif (« trop », sens negatif)</h3>
<p><strong>Too</strong> exprime un exces genant : c'est <em>trop</em>, donc c'est un probleme.</p>
<pre class="pseudo">This coffee is too hot.       // Ce cafe est trop chaud (je ne peux pas le boire).
You drive too fast.          // Tu conduis trop vite.
It is too expensive for me.  // C'est trop cher pour moi.</pre>
<div class="warn">Attention : « too » n'est PAS « very ». <em>Very hot</em> = tres chaud (constat neutre) ; <em>too hot</em> = trop chaud (c'est un exces qui pose probleme).</div>
<h3>5. ENOUGH (« assez ») : sa place change</h3>
<p><strong>Enough</strong> se place <strong>APRES</strong> l'adjectif ou l'adverbe, mais <strong>AVANT</strong> le nom.</p>
<pre class="pseudo">Adjectif + enough : She is old enough to vote.   // Elle est assez agee pour voter.
Enough + nom :      I don't have enough money.    // Je n'ai pas assez d'argent.
Adverbe + enough :  You didn't run fast enough.   // Tu n'as pas couru assez vite.</pre>
<h3>6. Too ... to ... et ... enough to ...</h3>
<p>Ces deux structures se completent souvent avec <strong>to + verbe</strong> pour dire le resultat.</p>
<pre class="pseudo">He is too young to drive.        // Il est trop jeune pour conduire.
She is tall enough to reach it.  // Elle est assez grande pour l'atteindre.</pre>
<div class="tip">Memo : <strong>so</strong>/<strong>too</strong> + adjectif SEUL ; <strong>such</strong> + nom ; <strong>enough</strong> APRES l'adjectif mais AVANT le nom.</div>`,
  exercises: [

    { type: "qcm", q: "Complete : « The music is ___ loud. »", opts: ["such", "so", "enough", "a lot"], a: 1, exp: "Adjectif seul (loud), sans nom : on utilise so." },
    { type: "qcm", q: "« This box is ___ heavy to carry. » (impossible a porter)", opts: ["so", "such", "too", "enough"], a: 2, exp: "too + adjectif + to : exces qui empeche l'action." },
    { type: "input", q: "Complete avec un seul mot : « She is old ___ to drive. »", a: ["enough"], ph: "un mot", exp: "enough se place APRES l'adjectif : old enough." },
    { type: "input", q: "Complete : « I don't have ___ time. » (assez de temps)", a: ["enough"], ph: "un mot", exp: "enough se place AVANT le nom : enough time." },
    { type: "qcm", q: "« They are ___ friendly people. »", opts: ["so", "such", "too", "very much"], a: 1, exp: "friendly people = adjectif + nom : such." },
    { type: "vf", q: "« very hot » et « too hot » veulent dire exactement la meme chose.", a: false, exp: "very hot = tres chaud (neutre) ; too hot = trop chaud (exces genant)." },
    { type: "qcm", q: "« It was ___ cold that we stayed home. »", opts: ["such", "so", "enough", "too"], a: 1, exp: "so ... that ... exprime la consequence, avec adjectif seul (cold)." },

    { type: "qcm", q: "Ou place-t-on « enough » avec un nom ?", opts: ["Apres le nom", "Avant le nom", "Au debut de la phrase", "A la fin"], a: 1, exp: "enough money, enough time : enough AVANT le nom." },
    { type: "vf", q: "On peut dire « such interesting » tout seul, sans nom.", a: false, exp: "such a besoin d'un nom : such an interesting book." },
    { type: "qcm", q: "« She speaks English ___ well. » (tellement bien)", opts: ["such", "so", "too much", "enough"], a: 1, exp: "well est un adverbe : so + adverbe." },

    { type: "qcm", q: "« We had ___ a wonderful holiday. »", opts: ["so", "too", "such", "enough"], a: 2, exp: "a wonderful holiday = article + adjectif + nom : such." },
    { type: "vf", q: "Dans « fast enough », enough se place apres l'adverbe.", a: true, exp: "enough se met APRES l'adjectif ou l'adverbe : fast enough, well enough." }
  ],

    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text and answer the questions.</p>
<p>Last summer, Marta wanted to climb a famous mountain. On the first day, the weather was so bad that she could not start. It was such a stormy morning that even the guides stayed inside. The next day was better, but the path was too steep for beginners. Marta was strong enough, but her friend was too tired to continue. They did not have enough water for a long walk, so they decided to turn back. It was such a difficult trip that they laughed about it later. In the end, Marta was happy enough with the view from the middle of the mountain.</p>`,
    questions: [

      { type: "vf", q: "The morning was calm and sunny.", a: false, exp: "It was such a stormy morning that the guides stayed inside." },
      { type: "qcm", q: "Why was the path a problem for beginners?", opts: ["It was too long", "It was too steep", "It was too dark", "It was too narrow"], a: 1, exp: "The path was too steep for beginners." },
      { type: "input", q: "Complete from the text: « They did not have ___ water for a long walk. »", a: ["enough"], ph: "un mot", exp: "enough + nom (water)." },
      { type: "qcm", q: "How did Marta feel at the end?", opts: ["Angry", "Disappointed", "Happy enough with the view", "Too tired to walk"], a: 2, exp: "She was happy enough with the view from the middle of the mountain." }
    ],
    solution: `<p>Reponses : 2 (so bad), Faux (stormy morning), 2 (too steep), « enough », 3 (happy enough).</p>
<p>Retiens les structures du texte : <em>so + adjectif + that</em>, <em>such + (a) + adjectif + nom</em>, <em>too + adjectif + for/to</em>, <em>adjectif + enough</em>, <em>enough + nom</em>. Elles reviennent sans arret a l'ecrit comme a l'oral.</p>`
  }
