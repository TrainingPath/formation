var DAY = {
  num: 4,
  title: "Will, going to ou présent continu ?",
  subtitle: "Trois façons de parler du futur, et comment choisir la bonne.",
  theory: `
<h3>1. L'anglais n'a pas un seul futur</h3>
<p>Là où le français a surtout un futur (« je partirai »), l'anglais dispose de <strong>plusieurs formes</strong> pour parler de l'avenir, et le choix dépend de la <strong>nuance</strong> : est-ce une décision prise à l'instant ? un projet déjà planifié ? une prédiction fondée sur des indices ? Nous étudions ici les trois formes les plus courantes : <strong>will</strong>, <strong>be going to</strong> et le <strong>présent continu</strong>.</p>
<h3>2. WILL : décision immédiate, prédiction, promesse</h3>
<p><strong>Will</strong> + verbe (base sans <em>to</em>) sert pour : une décision prise <strong>au moment où l'on parle</strong>, une <strong>prédiction</strong> ou une opinion sur le futur, une <strong>promesse</strong> ou une proposition d'aide.</p>
<pre class="pseudo">The phone is ringing. I'll answer it.   // Le telephone sonne. Je reponds. (decision immediate)
I think it will rain tomorrow.          // Je pense qu'il pleuvra demain. (prediction)
I'll help you, don't worry.             // Je vais t'aider, ne t'inquiete pas. (promesse)</pre>
<p>Forme contractée : <strong>I'll, you'll, he'll...</strong> ; négation : <strong>won't</strong> (will not).</p>
<h3>3. BE GOING TO : intention déjà décidée et prédiction visible</h3>
<p><strong>Be going to</strong> + verbe s'emploie pour une <strong>intention ou un projet déjà décidés avant de parler</strong>, et pour une prédiction fondée sur des <strong>indices présents</strong> que l'on voit.</p>
<pre class="pseudo">We are going to buy a new car.          // On va acheter une nouvelle voiture. (decision deja prise)
Look at those clouds! It's going to rain.  // Regarde ces nuages ! Il va pleuvoir. (indice visible)</pre>
<div class="tip">Différence clé : <strong>will</strong> = décision à l'instant même (« Ok, I'll do it ») ; <strong>going to</strong> = décision déjà prise avant (« I'm going to do it, I decided yesterday »).</div>
<h3>4. Le PRÉSENT CONTINU pour un rendez-vous fixé</h3>
<p>Le <strong>présent continu</strong> (am/is/are + verbe-ing) sert à parler d'un <strong>arrangement précis</strong> pour le futur : un rendez-vous, un billet réservé, une heure et un lieu déjà fixés avec d'autres personnes.</p>
<pre class="pseudo">I am meeting Sarah at 6 tomorrow.       // Je vois Sarah a 18 h demain. (rendez-vous fixe)
We are flying to Rome on Monday.        // On s'envole pour Rome lundi. (billet reserve)</pre>
<div class="warn">Le présent continu futur s'utilise surtout avec un complément de temps futur (tomorrow, next week, at 6). Sans lui, la phrase parle du présent.</div>
<h3>5. Comment choisir ? Un mini-guide</h3>
<pre class="pseudo">Decision prise a l'instant      -> will        (I'll get it!)
Prediction (opinion, I think)   -> will        (It will be fine.)
Intention deja decidee          -> going to    (I'm going to study tonight.)
Prediction avec indice visible  -> going to    (She's going to fall!)
Rendez-vous / arrangement fixe  -> present continu  (I'm seeing the doctor at 3.)</pre>
<div class="tip">Dans la conversation courante, <em>going to</em> et le présent continu sont souvent proches pour les projets. Le présent continu insiste sur l'arrangement concret (heure, lieu, personnes) ; <em>going to</em> insiste sur l'intention.</div>`,
  exercises: [
    { type: "qcm", q: "Le téléphone sonne. Tu décides à l'instant d'y répondre. Que dis-tu ?", opts: ["I'm going to answer it.", "I'll answer it.", "I answer it.", "I'm answering it now for tomorrow."], a: 1, exp: "Décision prise au moment où l'on parle : will (I'll answer it)." },
    { type: "qcm", q: "Tu vois de gros nuages noirs. Que dis-tu ?", opts: ["It will maybe stay dry.", "It's going to rain.", "It rains.", "It is raining next week."], a: 1, exp: "Prédiction fondée sur un indice visible : be going to." },
    { type: "input", q: "Complète avec la forme contractée de will : « Don't worry, I ___ help you. »", a: ["will", "'ll"], ph: "will ou 'll", exp: "Promesse / offre d'aide : will (I will help you / I'll help you)." },
    { type: "qcm", q: "« I ___ the dentist at 4 o'clock tomorrow. » (rendez-vous déjà fixé)", opts: ["will see", "see", "am seeing", "am going see"], a: 2, exp: "Rendez-vous précis fixé : présent continu (am seeing) avec un complément de temps futur." },
    { type: "input", q: "Complète : « We are ___ to visit our grandparents next weekend. »", a: ["going"], ph: "un mot", exp: "Intention déjà décidée : be going to (are going to visit)." },
    { type: "qcm", q: "« Look out! You ___ drop that glass! » (prédiction avec indice visible)", opts: ["will", "are going to", "see", "would"], a: 1, exp: "Ce qui va se produire d'après un indice présent : be going to." },
    { type: "vf", q: "« I'll call you » et « I'm going to call you » ont exactement le même sens dans tous les cas.", a: false, exp: "Nuance : I'll call you = décision à l'instant ; I'm going to call you = intention déjà prise avant." },
    { type: "input", q: "Négation de will en un mot : « It ___ rain today, the sky is clear. »", a: ["won't"], ph: "un mot", exp: "won't = will not : It won't rain today." },
    { type: "qcm", q: "« A: The bags are heavy. B: ___ » Quelle réponse est naturelle ?", opts: ["I'm going to carry them, I decided.", "I'll carry them for you.", "I carry them.", "I am carrying them last week."], a: 1, exp: "Offre d'aide spontanée, décidée à l'instant : I'll carry them." },
    { type: "qcm", q: "Lis : « Next Saturday I'm playing tennis with Ben at 10 a.m. » Que signifie cette phrase ?", opts: ["Une prédiction incertaine", "Un arrangement précis déjà fixé pour samedi prochain", "Une action présente en cours", "Une habitude régulière"], a: 1, exp: "Présent continu à valeur future : un rendez-vous fixé (heure, personne, jour)." },
    { type: "input", q: "Complète : « I think our team ___ win the match. » (prédiction, opinion)", a: ["will", "'ll"], ph: "un mot", exp: "Prédiction / opinion introduite par I think : will." },
    { type: "qcm", q: "Choisis la phrase correcte pour une intention décidée hier.", opts: ["I will start a diet, I decided yesterday.", "I'm going to start a diet, I decided yesterday.", "I start a diet yesterday.", "I am start a diet."], a: 1, exp: "Décision prise avant de parler (hier) : be going to." },
    { type: "vf", q: "On emploie souvent le présent continu futur avec une indication de temps comme tomorrow ou next week.", a: true, exp: "Ex : We are leaving tomorrow. Sans complément de temps, la phrase parlerait du présent." },
    { type: "input", q: "Complète : « She ___ going to study medicine after school. » (auxiliaire be)", a: ["is"], ph: "un mot", exp: "She + is going to : intention future déjà décidée." },
    { type: "vf", q: "Pour une prédiction basée sur un indice que l'on voit (elle glisse !), on préfère « be going to » à « will ».", a: true, exp: "L'indice présent visible appelle be going to : She's going to fall!" }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this dialogue, then answer the questions.</p>
<p>Anna: I'm so excited! Next month I'm flying to Canada to see my cousins. I bought the tickets last week. Ben: That sounds great. What are you going to do there? Anna: We're going to travel across the country by train. My cousins have already planned everything. Ben: The weather can be cold. Look, it says here that it will probably snow in the mountains. Anna: I know, so I'm going to buy a warm coat this weekend. Ben: Do you need help with your bags at the airport? Anna: Oh, thank you. Ben: No problem, I'll drive you there. Anna: You're very kind. I think this trip is going to be amazing.</p>`,
    questions: [
      { type: "qcm", q: "Why does Anna use « I'm flying to Canada next month »?", opts: ["It is a spontaneous decision", "It is a fixed arrangement: she already bought the tickets", "It is only a prediction", "It is a habit"], a: 1, exp: "Présent continu futur : un arrangement fixé, les billets sont déjà achetés." },
      { type: "vf", q: "Anna and her cousins are going to travel by train.", a: true, exp: "The text says: We're going to travel across the country by train." },
      { type: "qcm", q: "How does Ben talk about the snow?", opts: ["With the present continuous", "With will (a prediction)", "With the past simple", "With the past perfect"], a: 1, exp: "It will probably snow in the mountains : prédiction avec will." },
      { type: "input", q: "Complete from the text: « I'm going to buy a warm ___ this weekend. »", a: ["coat"], ph: "un mot", exp: "Intention déjà décidée : I'm going to buy a warm coat." },
      { type: "qcm", q: "Why does Ben say « I'll drive you there »?", opts: ["It is a planned arrangement from last week", "It is a spontaneous offer of help", "It is a prediction about the weather", "It is a past action"], a: 1, exp: "Offre d'aide spontanée, décidée à l'instant : will." }
    ],
    solution: `<p>Réponses : It is a fixed arrangement ; Vrai ; With will (a prediction) ; « coat » ; It is a spontaneous offer of help.</p>
<p>Ce dialogue montre les trois formes en action : le <em>présent continu</em> pour l'arrangement fixé (I'm flying, tickets achetés), <em>be going to</em> pour les intentions et projets décidés (we're going to travel, I'm going to buy), et <em>will</em> pour la prédiction (it will snow) et l'offre spontanée (I'll drive you). Retiens la nuance derrière chaque forme.</p>`
  }
};
</script>
