<script>
var DAY = {
  num: 28,
  title: "Révisions B1",
  subtitle: "Faire le point sur toute la grammaire et le vocabulaire du niveau.",
  theory: `
<h3>1. Les temps du passé</h3>
<pre class="pseudo">Past simple : I worked yesterday.        // action passee terminee
Past continuous : I was working at 8pm.  // action en cours dans le passe
Past perfect : I had worked before that. // action anterieure a une autre
Present perfect : I have worked here for years. // lien passe-present</pre>
<div class="tip">Rappel jour 27 : le recit combine ces temps. Rappel present perfect : « for » + duree, « since » + point de depart, « already / yet » pour le bilan.</div>
<h3>2. Le futur et les conditionnels</h3>
<pre class="pseudo">will + verbe   // decision, prediction : It will rain.
going to       // intention, plan : I am going to travel.
Type 1 : If it rains, I will stay home.       // reel, probable
Type 2 : If I had money, I would travel.       // hypothetique
Type 3 : If I had known, I would have come.    // regret sur le passe</pre>
<h3>3. Le passif et le discours indirect</h3>
<pre class="pseudo">Passif : The house was built in 1900.   // on met en avant l'objet
Discours indirect : She said (that) she was tired.  // on rapporte les paroles
Question indirecte : Could you tell me where the station is?</pre>
<div class="warn">Au discours indirect, les temps « reculent » : present -> past, will -> would. <em>"I am busy" -> He said he was busy.</em></div>
<h3>4. Verbes, adjectifs et petits mots</h3>
<pre class="pseudo">Gerondif / infinitif : I enjoy reading. / I want to read.
Phrasal verbs : give up (abandonner), look after (s'occuper de)
So / such / too / enough : so hot, such a day, too cold, old enough
Connecteurs : because, so, although, despite, in order to, however</pre>
<h3>5. Le vocabulaire thématique du niveau</h3>
<pre class="pseudo">Travail : job, salary, to apply, skills, reliable
Emotions : excited, worried, proud (attention -ed / -ing)
Environnement : pollution, recycling, climate change
Medias : download, upload, social media, addictive
Opinion : in my opinion, I agree, I see your point but...</pre>
<h3>6. Les pièges à ne pas oublier</h3>
<pre class="pseudo">I agree (jamais "I am agree")
because + phrase / because of + nom
although + phrase / despite + nom
less + indenombrable / fewer + denombrable
I am bored (je m'ennuie) / it is boring (c'est ennuyeux)
to apply = poser sa candidature (faux ami)</pre>
<div class="tip">Cette page est ta feuille de revision : relis-la avant les bilans des jours 29 et 30. Les exercices ci-dessous mélangent tous les points du niveau.</div>`,
  exercises: [
    { type: "qcm", q: "Type de conditionnel : « If I ___ rich, I would buy a house. »", opts: ["am", "was / were", "will be", "have been"], a: 1, exp: "Type 2 (hypothetique) : If + past simple, ... would." },
    { type: "input", q: "Present perfect : « I have lived here ___ 2010. » (for ou since ?)", a: ["since"], ph: "for / since", exp: "since + point de depart (2010) ; for + duree." },
    { type: "qcm", q: "Discours indirect : « She said she ___ tired. » (\"I am tired\")", opts: ["is", "was", "will be", "has been"], a: 1, exp: "Recul des temps : present -> past, is -> was." },
    { type: "qcm", q: "Passif : « The bridge ___ in 1950. »", opts: ["built", "was built", "has build", "is building"], a: 1, exp: "Passif passe : was + participe passe (built)." },
    { type: "input", q: "Choisis because ou because of : « We stayed in ___ the storm. »", a: ["because of"], ph: "because / because of", exp: "because of + nom (the storm)." },
    { type: "qcm", q: "So / such / too / enough : « It was ___ a nice day. »", opts: ["so", "such", "too", "enough"], a: 1, exp: "such + (a) + adjectif + nom." },
    { type: "input", q: "Gerondif ou infinitif : « I enjoy ___ books. » (read)", a: ["reading"], ph: "verbe", exp: "enjoy + verbe en -ing : enjoy reading." },
    { type: "qcm", q: "Phrasal verb : « She had to ___ smoking. » (arreter/abandonner)", opts: ["give up", "look after", "turn on", "take off"], a: 0, exp: "give up = abandonner, arreter." },
    { type: "input", q: "Choisis less ou fewer : « There are ___ cars in the village. »", a: ["fewer", "Fewer"], ph: "less / fewer", exp: "cars est denombrable : fewer." },
    { type: "qcm", q: "-ed ou -ing : « The film was ___ . » (ennuyeux)", opts: ["bored", "boring", "bore", "bores"], a: 1, exp: "Ce qui provoque l'emotion : -ing, boring." },
    { type: "vf", q: "« I am agree with you » est correct.", a: false, exp: "Faux : on dit I agree (agree est un verbe)." },
    { type: "input", q: "Future : « Look at those clouds! It ___ rain. » (going to)", a: ["is going to", "is going"], ph: "3 mots", exp: "Preuve visible = going to : it is going to rain." },
    { type: "qcm", q: "Question indirecte correcte :", opts: ["Could you tell me where is the station?", "Could you tell me where the station is?", "Could you tell me where the station?", "Could you tell where is station?"], a: 1, exp: "Ordre sujet-verbe : where the station IS (pas d'inversion)." },
    { type: "input", q: "Complete : « ___ it was raining, we went out. » (bien que : Alt...)", a: ["Although"], ph: "un mot", exp: "although + phrase = bien que." },
    { type: "qcm", q: "Vocabulaire travail : « to apply for a job » signifie…", opts: ["appliquer un emploi", "poser sa candidature", "quitter un emploi", "diriger un emploi"], a: 1, exp: "to apply = poser sa candidature (faux ami)." }
  ],
  final: {
    title: "Exercice final — Un texte de révision complet",
    intro: `<p>Read this text, which uses many points from the whole level, and answer the questions.</p>
<p>Two years ago, Léa decided to apply for a job in London. Although she was nervous, she sent her CV and got an interview. She said that she was reliable and hard-working, and the manager was impressed. If she had not prepared her answers, she would have failed; however, she had practised for a week, so she felt confident. The job was offered to her the next day. She has lived in London since then, and she loves it. In her opinion, the city is exciting, but it is too expensive. She often tells her friends that they should visit her, because London is such a beautiful place. Recently, she has been thinking about her future, and she is going to ask for a promotion soon.</p>`,
    questions: [
      { type: "qcm", q: "Why did Léa feel confident at the interview?", opts: ["She was lucky", "She had practised for a week", "The manager was her friend", "The job was easy"], a: 1, exp: "She had practised for a week (past perfect), so she felt confident." },
      { type: "input", q: "Complete: « She has lived in London ___ then. » (for/since)", a: ["since"], ph: "for / since", exp: "since + point de depart." },
      { type: "qcm", q: "What is her opinion of the city?", opts: ["Boring and cheap", "Exciting but too expensive", "Small and quiet", "Ugly"], a: 1, exp: "The city is exciting, but it is too expensive." },
      { type: "qcm", q: "In « London is such a beautiful place », why « such »?", opts: ["Because there is an adjective + noun (beautiful place)", "Because it is a question", "Because it is negative", "Because it is a plural"], a: 0, exp: "such + (a) + adjectif + nom (a beautiful place)." },
      { type: "vf", q: "Léa is going to ask for a promotion soon.", a: true, exp: "She is going to ask for a promotion soon (going to = intention)." }
    ],
    solution: `<p>Reponses : 2 (had practised), « since », 2 (exciting but too expensive), 1 (adjectif + nom), Vrai (going to ask).</p>
<p>Ce texte concentre presque tout le niveau : to apply, although, past perfect, conditionnel type 3, present perfect + since, in my opinion, such + nom, going to. Si tu as tout compris, tu es pret pour les bilans !</p>`
  }
};
</script>
