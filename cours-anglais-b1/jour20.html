<body>
<script>
var DAY = {
  num: 20,
  title: "L'environnement et l'actualité",
  subtitle: "Le vocabulaire pour parler de la planète et des grands sujets.",
  theory: `
<h3>1. L'environnement : le vocabulaire clé</h3>
<pre class="pseudo">the environment      // l'environnement
climate change       // le changement climatique
global warming       // le rechauffement climatique
pollution            // la pollution
greenhouse gases     // les gaz a effet de serre
renewable energy     // les energies renouvelables
waste                // les dechets
recycling            // le recyclage
endangered species   // les especes menacees
sea level            // le niveau de la mer</pre>
<div class="warn">Faux ami : « pollution » se dit pareil, mais attention a « waste » qui signifie a la fois « le dechet » (nom) et « gaspiller » (verbe) : <em>Don't waste water.</em> = Ne gaspille pas l'eau.</div>
<h3>2. Les verbes de l'écologie</h3>
<pre class="pseudo">to pollute        // polluer
to recycle        // recycler
to reduce         // reduire
to save (energy)  // economiser (l'energie)
to protect        // proteger
to waste          // gaspiller
to throw away     // jeter
to cause          // provoquer</pre>
<pre class="pseudo">We should reduce our waste and recycle more.
   // Nous devrions reduire nos dechets et recycler davantage.
Cars cause a lot of pollution.
   // Les voitures provoquent beaucoup de pollution.</pre>
<h3>3. Parler de l'actualité (the news)</h3>
<pre class="pseudo">the news           // les informations
a headline         // un gros titre
a newspaper        // un journal
an event           // un evenement
a government       // un gouvernement
an election        // une election
the economy        // l'economie
a crisis           // une crise
a protest / a demonstration // une manifestation</pre>
<div class="tip">« the news » est toujours <strong>singulier</strong> : on dit <em>The news is good</em> (et non « are »). De meme, « information » est indenombrable : jamais « informations » ni « an information ».</div>
<h3>4. Exprimer un problème et une solution</h3>
<pre class="pseudo">One of the biggest problems is pollution.
   // L'un des plus gros problemes est la pollution.
A possible solution is to use public transport.
   // Une solution possible est d'utiliser les transports en commun.
If we don't act now, the situation will get worse.
   // Si nous n'agissons pas maintenant, la situation empirera.</pre>
<div class="tip">Structure utile (conditionnel de type 1) : <em>If we recycle more, we will produce less waste.</em> = Si nous recyclons plus, nous produirons moins de dechets.</div>
<h3>5. Donner des chiffres et comparer</h3>
<pre class="pseudo">Temperatures have risen by two degrees.
   // Les temperatures ont augmente de deux degres.
There is more pollution than ten years ago.
   // Il y a plus de pollution qu'il y a dix ans.
Fewer people recycle than we think.
   // Moins de gens recyclent qu'on ne le pense.</pre>
<div class="warn">« fewer » s'emploie avec les noms denombrables (fewer cars, fewer people) ; « less » avec les indenombrables (less pollution, less energy).</div>`,
  exercises: [
    { type: "qcm", q: "« climate change » signifie…", opts: ["le climat local", "le changement climatique", "le beau temps", "la meteo du jour"], a: 1, exp: "climate change = changement climatique." },
    { type: "qcm", q: "Que sont les « renewable energies » ?", opts: ["les energies fossiles", "les energies renouvelables", "les dechets", "les gaz a effet de serre"], a: 1, exp: "renewable energy = energie renouvelable (solaire, eolien...)." },
    { type: "input", q: "Complete : « We should ___ more paper and plastic. » (recycler)", a: ["recycle"], ph: "un verbe", exp: "to recycle = recycler." },
    { type: "qcm", q: "« Don't waste water. » veut dire…", opts: ["Ne bois pas d'eau", "Ne gaspille pas l'eau", "Recycle l'eau", "Chauffe l'eau"], a: 1, exp: "to waste = gaspiller." },
    { type: "vf", q: "« The news is good. » est correct (news est singulier).", a: true, exp: "the news prend toujours un verbe au singulier." },
    { type: "qcm", q: "Quel mot signifie « une manifestation » ?", opts: ["a headline", "a protest", "a government", "an election"], a: 1, exp: "a protest / a demonstration = une manifestation." },
    { type: "input", q: "Choisis less ou fewer : « There is ___ pollution in the countryside. »", a: ["less"], ph: "less/fewer", exp: "pollution est indenombrable : less pollution." },
    { type: "input", q: "Choisis less ou fewer : « ___ cars means cleaner air. »", a: ["fewer", "Fewer"], ph: "less/fewer", exp: "cars est denombrable : fewer cars." },
    { type: "qcm", q: "« greenhouse gases » sont…", opts: ["des serres de jardin", "les gaz a effet de serre", "des energies vertes", "des dechets verts"], a: 1, exp: "greenhouse gases = gaz a effet de serre." },
    { type: "vf", q: "On peut dire « an information » en anglais.", a: false, exp: "information est indenombrable : « some information », jamais « an information »." },
    { type: "qcm", q: "« endangered species » designe…", opts: ["des especes dangereuses", "des especes menacees", "des especes nouvelles", "des animaux domestiques"], a: 1, exp: "endangered species = especes menacees d'extinction." },
    { type: "input", q: "Complete (conditionnel type 1) : « If we recycle more, we ___ produce less waste. »", a: ["will"], ph: "un modal", exp: "If + present, ... will + verbe : type 1." },
    { type: "qcm", q: "Quel mot signifie « un gros titre » (de journal) ?", opts: ["a headline", "a crisis", "an event", "the economy"], a: 0, exp: "a headline = un gros titre." },
    { type: "input", q: "Complete : « Cars ___ a lot of pollution. » (provoquer, present)", a: ["cause"], ph: "un verbe", exp: "to cause = provoquer ; cars cause pollution." },
    { type: "vf", q: "« to save energy » signifie « economiser l'energie ».", a: true, exp: "to save = economiser ; save energy, save water, save money." }
  ],
  final: {
    title: "Exercice final — Un article sur l'environnement",
    intro: `<p>Read this short text and answer the questions.</p>
<p>Climate change is one of the biggest problems of our time. Every year, temperatures rise and the sea level gets higher. Scientists say that greenhouse gases are the main cause. Cars and factories produce a lot of pollution, and we waste too much energy at home. However, there are solutions. If we use renewable energy, we will reduce our emissions. We can also recycle more and throw away fewer things. Cities are building bike lanes so that fewer people drive. The news is not all bad: many young people now protest and ask governments to act. Experts believe that small daily actions can make a real difference. If we do not act now, the situation will get worse, but it is not too late to protect our planet.</p>`,
    questions: [
      { type: "qcm", q: "What is the main cause of climate change, according to scientists?", opts: ["The rain", "Greenhouse gases", "The wind", "The moon"], a: 1, exp: "Scientists say greenhouse gases are the main cause." },
      { type: "vf", q: "According to the text, there are no solutions to the problem.", a: false, exp: "The text says: However, there are solutions." },
      { type: "input", q: "Complete from the text: « If we use renewable energy, we will ___ our emissions. »", a: ["reduce"], ph: "un verbe", exp: "reduce our emissions = reduire nos emissions." },
      { type: "qcm", q: "Why are cities building bike lanes?", opts: ["To sell more bikes", "So that fewer people drive", "To make money", "For tourists"], a: 1, exp: "Bike lanes are built so that fewer people drive." },
      { type: "vf", q: "The text says it is too late to protect the planet.", a: false, exp: "It says it is NOT too late to protect our planet." }
    ],
    solution: `<p>Reponses : 2 (greenhouse gases), Faux (there are solutions), « reduce », 2 (fewer people drive), Faux (not too late).</p>
<p>Note le vocabulaire de l'argumentation : <em>one of the biggest problems</em>, <em>the main cause</em>, <em>however, there are solutions</em>, <em>if we ... will ...</em>. Ces formules te serviront pour donner ton opinion (jour 22).</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b1-j20", title: "Décris un problème environnemental et sa solution", level: 3,
    statement: "En 5 a 7 phrases, presente un probleme d'environnement de ton choix, explique sa cause et propose au moins deux solutions.",
    hints: [
      "Ouvre avec : One of the biggest problems is... / The main cause is...",
      "Utilise le conditionnel de type 1 : If we ... , we will ...",
      "Attention : less + indenombrable (less energy), fewer + denombrable (fewer cars)."
    ],
    solution: "One of the biggest problems in my city is air pollution. The main cause is the traffic, because there are too many cars in the centre. People also waste a lot of energy and throw away too much plastic. However, there are solutions. If we use public transport, we will reduce pollution. We can also recycle more and produce less waste at home. If everyone makes a small effort, the situation will get better.\n\nTraduction : L'un des plus gros problemes de ma ville est la pollution de l'air. La cause principale est la circulation, parce qu'il y a trop de voitures dans le centre. Les gens gaspillent aussi beaucoup d'energie et jettent trop de plastique. Cependant, il y a des solutions. Si nous utilisons les transports en commun, nous reduirons la pollution. Nous pouvons aussi recycler davantage et produire moins de dechets a la maison. Si chacun fait un petit effort, la situation s'ameliorera.",
    note: "Structure ton texte : probleme -> cause -> solutions. C'est exactement ce qu'on attend d'un paragraphe argumente au niveau B1." }
  ]
};
</script>
<script src="exo-ecriture.js"></script>
