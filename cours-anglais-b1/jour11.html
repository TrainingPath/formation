<script>
var DAY = {
  num: 11,
  title: "Les modaux de déduction",
  subtitle: "Must, might, can't : exprimer la certitude, la possibilité et l'impossibilité.",
  theory: `
<h3>1. Deviner à partir d'indices</h3>
<p>Quand on ne connaît pas une information avec certitude, mais qu'on la <strong>déduit à partir d'indices</strong>, l'anglais utilise des <strong>modaux de déduction</strong>. Ce sont des petits mots (must, might, can't...) placés devant un verbe pour dire à quel point on est <strong>sûr</strong> de ce qu'on avance. Un <strong>modal</strong> est un auxiliaire spécial : il ne prend jamais de <em>s</em> à la 3e personne et il est suivi d'un verbe à la base (sans <em>to</em>).</p>
<h3>2. MUST : la certitude positive (« ça doit être »)</h3>
<p><strong>Must</strong> exprime une quasi-certitude que quelque chose <strong>est vrai</strong>, d'après la logique.</p>
<pre class="pseudo">The lights are on. Someone must be home.   // Les lumieres sont allumees. Il doit y avoir quelqu'un.
You must be tired after that long trip.    // Tu dois etre fatigue apres ce long voyage.</pre>
<h3>3. CAN'T : la certitude négative (« ça ne peut pas être »)</h3>
<p>Pour exprimer la <strong>certitude que quelque chose est faux</strong> ou impossible, on n'utilise PAS « must not » mais <strong>can't</strong> (cannot). C'est l'opposé logique de must.</p>
<pre class="pseudo">He can't be at work, it's Sunday.          // Il ne peut pas etre au travail, c'est dimanche.
She's just eaten. She can't be hungry.     // Elle vient de manger. Elle ne peut pas avoir faim.</pre>
<div class="warn">Pour dire « c'est sûrement faux », on emploie <strong>can't</strong>, jamais « mustn't » (qui signifie une interdiction, pas une déduction).</div>
<h3>4. MIGHT, MAY, COULD : la possibilité (« ça se peut »)</h3>
<p>Pour exprimer une <strong>possibilité incertaine</strong> (c'est peut-être vrai, mais on n'en est pas sûr), on utilise <strong>might</strong>, <strong>may</strong> ou <strong>could</strong>. Ces trois modaux sont proches en sens.</p>
<pre class="pseudo">She might be at home.       // Elle est peut-etre chez elle.
It may rain later.          // Il se peut qu'il pleuve plus tard.
They could be lost.         // Ils sont peut-etre perdus.</pre>
<h3>5. L'échelle de certitude</h3>
<pre class="pseudo">100% sur que OUI    ->  must     (It must be true.)
peut-etre           ->  might / may / could   (It might be true.)
100% sur que NON    ->  can't    (It can't be true.)</pre>
<div class="tip">Résumé : <strong>must</strong> = j'en suis sûr (positif) ; <strong>can't</strong> = j'en suis sûr (négatif) ; <strong>might/may/could</strong> = je ne suis pas sûr, c'est possible.</div>
<h3>6. La déduction sur le passé</h3>
<p>Pour déduire quelque chose sur le <strong>passé</strong>, on ajoute <strong>have + participe passé</strong> après le modal.</p>
<pre class="pseudo">must have + participe passe :  She must have forgotten.   // Elle a du oublier.
can't have + participe passe : He can't have seen us.     // Il n'a pas pu nous voir.
might have + participe passe : They might have left.      // Ils sont peut-etre partis.</pre>
<div class="warn">Ne mets jamais de <em>s</em> ni de <em>to</em> après un modal : on dit <em>She must be</em> (pas « must to be » ni « must is »).</div>`,
  exercises: [
    { type: "qcm", q: "Pour exprimer une quasi-certitude que quelque chose est vrai, on utilise...", opts: ["might", "must", "can't", "may"], a: 1, exp: "must = certitude positive (ça doit être vrai)." },
    { type: "qcm", q: "Pour dire « c'est sûrement faux, impossible », on utilise...", opts: ["mustn't", "can't", "might not", "may not"], a: 1, exp: "can't = certitude négative. Pas mustn't (qui est une interdiction)." },
    { type: "input", q: "Complète : « The lights are on. Someone ___ be home. » (certitude positive)", a: ["must"], ph: "un mot", exp: "must be home : on en est presque sûr d'après l'indice." },
    { type: "qcm", q: "« She just ate a big meal. She ___ be hungry. »", opts: ["must", "can't", "might", "may"], a: 1, exp: "Certitude négative : elle vient de manger, elle ne peut pas avoir faim (can't be hungry)." },
    { type: "input", q: "Complète avec un modal de possibilité : « I'm not sure where she is. She ___ be at home. » (peut-être)", a: ["might", "may", "could"], ph: "un mot", exp: "Possibilité incertaine : might/may/could be at home." },
    { type: "vf", q: "« mustn't » sert à exprimer la certitude que quelque chose est faux.", a: false, exp: "Non : mustn't = interdiction. Pour la certitude négative, on utilise can't." },
    { type: "qcm", q: "Après un modal, le verbe se met...", opts: ["à la base, sans to (must be)", "à l'infinitif avec to (must to be)", "en -ing (must being)", "au passé (must was)"], a: 0, exp: "Un modal est suivi de la base verbale sans to : must be, might go." },
    { type: "input", q: "Déduction sur le passé : « She isn't answering. She ___ have forgotten. » (certitude positive)", a: ["must"], ph: "un mot", exp: "must have forgotten : elle a dû oublier (déduction sur le passé)." },
    { type: "qcm", q: "Choisis la phrase correcte.", opts: ["He must to be tired.", "He must be tired.", "He must is tired.", "He musts be tired."], a: 1, exp: "Modal + base sans to, sans s : He must be tired." },
    { type: "input", q: "Complète : « It's raining. They ___ have taken an umbrella. » (peut-être, passé)", a: ["might", "may", "could"], ph: "un mot", exp: "might/may/could have taken : possibilité dans le passé." },
    { type: "qcm", q: "Lis : « The car is in the driveway and the TV is on, but nobody answers the door. » Quelle déduction est la plus logique ?", opts: ["They can't be home.", "They must be home but they can't hear the bell.", "They must have sold the car.", "Nobody lives here."], a: 1, exp: "Les indices (voiture, télé allumée) suggèrent une forte probabilité qu'ils soient là : must be home." },
    { type: "input", q: "Complète : « He ___ have seen us; he was looking the other way. » (certitude négative, passé)", a: ["can't", "cannot", "couldn't"], ph: "un mot", exp: "can't have seen : il n'a pas pu nous voir (certitude négative sur le passé)." },
    { type: "vf", q: "« might », « may » et « could » expriment tous les trois une possibilité incertaine.", a: true, exp: "Ces trois modaux servent à dire « c'est peut-être vrai »." },
    { type: "qcm", q: "« You've been working all day. You ___ be exhausted. »", opts: ["can't", "must", "might not", "may not"], a: 1, exp: "Forte certitude positive d'après l'indice (travail toute la journée) : must be exhausted." },
    { type: "input", q: "Traduis : « Elle a dû oublier. » → « She ___ ___ forgotten. » (2 mots)", a: ["must have"], ph: "2 mots", exp: "must have forgotten : déduction quasi certaine sur le passé." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short mystery, then answer the questions.</p>
<p>When Laura got home, she noticed that the front door was slightly open. That's strange, she thought. My husband must still be at work, and the children can't be back yet, because school finishes at four. She heard a noise in the kitchen. It might be the cat, she said to herself, but the cat was sleeping on the sofa. Someone must have come in. She saw wet footprints on the floor. They can't have been there this morning, because the floor was dry when she left. Then she smelt coffee. Her mother might have decided to visit, she thought, feeling calmer. Indeed, a moment later, her mother appeared with two cups. You must be surprised, she laughed. I found the spare key under the plant.</p>`,
    questions: [
      { type: "qcm", q: "Why does Laura think her children can't be back yet?", opts: ["Because they are on holiday", "Because school finishes at four", "Because they are ill", "Because they moved away"], a: 1, exp: "The children can't be back yet, because school finishes at four (certitude négative)." },
      { type: "vf", q: "Laura is certain that the noise in the kitchen is the cat.", a: false, exp: "She says it MIGHT be the cat (possibilité), but the cat was actually on the sofa." },
      { type: "input", q: "Complete from the text: « Someone ___ have come in. » (near certainty)", a: ["must"], ph: "un mot", exp: "must have come in : déduction quasi certaine sur le passé." },
      { type: "qcm", q: "Why does she say « They can't have been there this morning »?", opts: ["It is a possibility", "It is a certain negative deduction: the floor was dry", "It is an order", "It is a question"], a: 1, exp: "can't have been = certitude négative : impossible, car le sol était sec ce matin." },
      { type: "qcm", q: "What is the function of « must », « might » and « can't » in this text?", opts: ["To give orders", "To show how sure the speaker is about her deductions", "To talk about the future only", "To describe habits"], a: 1, exp: "Ces modaux marquent le degré de certitude des déductions de Laura." }
    ],
    solution: `<p>Réponses : Because school finishes at four ; Faux ; « must » ; It is a certain negative deduction ; To show how sure the speaker is about her deductions.</p>
<p>Cette petite énigme fait défiler toute l'échelle de certitude : <em>must be / must have come</em> (quasi sûr que oui), <em>might be / might have decided</em> (possible), <em>can't be / can't have been</em> (sûr que non). Les modaux de déduction sont l'outil idéal pour raisonner à partir d'indices.</p>`
  }
};
</script>
