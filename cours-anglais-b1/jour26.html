var DAY = {

  title: "Les connecteurs logiques avancés",
  subtitle: "Relier ses idées avec précision : cause, conséquence, opposition, but.",
  theory: `
<h3>1. Pourquoi les connecteurs ?</h3>
<p>Les <strong>connecteurs</strong> (linking words) relient les idees et montrent le raisonnement. Au niveau B1, on ne se contente plus de « and », « but », « because » : on ajoute des mots plus precis. Attention, chacun a sa grammaire propre.</p>
<h3>2. La cause (pourquoi ?)</h3>
<pre class="pseudo">because + phrase   // parce que : He stayed home because he was ill.
because of + nom   // a cause de : He stayed home because of his illness.
as / since + phrase // comme, puisque : As it was late, we left.
due to + nom       // en raison de : The delay was due to the snow.</pre>
<div class="warn">Ne confonds pas : <em>because</em> + sujet + verbe ; <em>because of</em> + nom. « because of he was ill » est FAUX.</div>
<h3>3. La conséquence (résultat)</h3>
<pre class="pseudo">so + phrase        // donc : It was raining, so we stayed in.
therefore          // par consequent (plus formel) : The road was closed; therefore, we turned back.
that's why         // c'est pourquoi : He was late, that's why he ran.
as a result        // en consequence : Sales fell; as a result, prices dropped.</pre>
<h3>4. L'opposition et le contraste</h3>
<pre class="pseudo">but                // mais
however            // cependant (en debut de phrase, suivi d'une virgule)
although / even though + phrase // bien que : Although it was cold, we swam.
despite / in spite of + nom     // malgre : Despite the cold, we swam.
on the other hand  // d'un autre cote</pre>
<div class="warn">Piege classique : <em>although</em> est suivi d'une phrase (sujet + verbe), mais <em>despite / in spite of</em> est suivi d'un NOM ou d'un verbe en -ing. « Although the rain » est FAUX ; dis <em>Although it was raining</em> ou <em>Despite the rain</em>.</div>
<h3>5. Le but (dans quel objectif ?)</h3>
<pre class="pseudo">to + verbe         // pour : I went out to buy bread.
in order to + verbe // afin de : She woke up early in order to catch the train.
so that + phrase   // afin que : He spoke slowly so that everyone could understand.</pre>
<h3>6. L'addition et l'exemple</h3>
<pre class="pseudo">moreover / in addition // de plus, en outre
also                   // aussi
for example / for instance // par exemple
such as                // tel que : fruits such as apples and pears</pre>
<div class="tip">Un texte B1 reussi combine plusieurs familles : une cause, une consequence, une opposition et un but. Varie tes connecteurs pour eviter de repeter « and » et « but ».</div>`,
  exercises: [
    { type: "input", q: "Choisis because ou because of : « The match was cancelled ___ the storm. »", a: ["because of"], ph: "because / because of", exp: "Suivi d'un nom (the storm) : because of." },
    { type: "input", q: "Choisis because ou because of : « We left early ___ it was late. »", a: ["because"], ph: "because / because of", exp: "Suivi d'une phrase (it was late) : because." },
    { type: "qcm", q: "« Although it was cold, we went out. » Quel mot pourrait remplacer « Although » ?", opts: ["Because", "Even though", "So", "Therefore"], a: 1, exp: "although = even though : bien que (opposition + phrase)." },
    { type: "input", q: "Choisis although ou despite : « ___ the rain, we played football. » (suivi d'un nom)", a: ["Despite"], ph: "although / despite", exp: "Suivi d'un nom (the rain) : Despite." },
    { type: "input", q: "Choisis although ou despite : « ___ it was raining, we played. » (suivi d'une phrase)", a: ["Although"], ph: "although / despite", exp: "Suivi d'une phrase (it was raining) : Although." },
    { type: "qcm", q: "« It was raining, ___ we stayed in. » (consequence)", opts: ["because", "although", "so", "despite"], a: 2, exp: "so = donc : introduit la consequence." },
    { type: "qcm", q: "Quel connecteur est le plus formel pour la consequence ?", opts: ["so", "therefore", "and", "but"], a: 1, exp: "therefore = par consequent, registre formel." },
    { type: "input", q: "Complete : « She woke up early in order ___ catch the train. » (afin de)", a: ["to"], ph: "un mot", exp: "in order to + verbe = afin de." },
    { type: "qcm", q: "« so that » est suivi de…", opts: ["un nom", "une phrase (sujet + verbe)", "un verbe en -ing", "rien"], a: 1, exp: "so that + sujet + verbe : so that everyone could understand." },
    { type: "vf", q: "« because of he was ill » est correct.", a: false, exp: "Faux : because of + nom. Il faut « because he was ill » ou « because of his illness »." },
    { type: "qcm", q: "« Moreover » sert a…", opts: ["ajouter une idee", "opposer", "conclure", "donner une cause"], a: 0, exp: "moreover / in addition = de plus (addition)." },
    { type: "input", q: "Complete : « He was late; ___ , he ran to the station. » (c'est pourquoi : that's w...)", a: ["that's why", "thats why"], ph: "deux mots", exp: "that's why = c'est pourquoi (consequence)." },
    { type: "qcm", q: "« fruits such as apples » : « such as » signifie…", opts: ["a cause de", "tel que / comme", "malgre", "donc"], a: 1, exp: "such as = tel que, pour introduire un exemple." },
    { type: "input", q: "Complete : « The delay was ___ to the snow. » (en raison de : d...)", a: ["due"], ph: "un mot", exp: "due to + nom = en raison de." },
    { type: "vf", q: "« However » se place souvent en debut de phrase, suivi d'une virgule.", a: true, exp: "However, ... = cependant (au debut, avec une virgule)." }
  ],
  final: {
    title: "Exercice final — Repérer les connecteurs",
    intro: `<p>Read this text and answer the questions about the linking words.</p>
<p>Last year, our town decided to build a new cycle path. The main reason was pollution: because there were too many cars, the air quality was poor. Therefore, the council chose to encourage cycling. Although the project was expensive, most people supported it. Despite some complaints from a few drivers, the work started in spring. The path was designed so that children could ride safely to school. Moreover, several shops along the route reported more customers. As a result, the council now plans a second path. In order to reduce traffic even further, the town will also make buses cheaper. In spite of the cost, everyone agrees that the change was worth it.</p>`,
    questions: [
      { type: "qcm", q: "Why was the air quality poor?", opts: ["Because there were too many cars", "Because of the rain", "Because of the shops", "Because of the buses"], a: 0, exp: "because there were too many cars, the air quality was poor." },
      { type: "qcm", q: "In « Although the project was expensive, most people supported it », what does « Although » express?", opts: ["A cause", "A contrast", "A result", "A purpose"], a: 1, exp: "although exprime le contraste (bien que)." },
      { type: "input", q: "Complete: « The path was designed ___ that children could ride safely. »", a: ["so"], ph: "un mot", exp: "so that = afin que (but)." },
      { type: "vf", q: "« As a result » in the text introduces a result (consequence).", a: true, exp: "As a result = en consequence ; il introduit un resultat." },
      { type: "qcm", q: "« In order to reduce traffic » expresses…", opts: ["a cause", "a contrast", "a purpose (goal)", "an addition"], a: 2, exp: "in order to = afin de : c'est un but." }
    ],
    solution: `<p>Reponses : 1 (too many cars), 2 (contrast), « so », Vrai (result), 3 (purpose).</p>
<p>Le texte utilise chaque famille : cause (because), consequence (therefore, as a result), opposition (although, despite, in spite of), but (so that, in order to), addition (moreover). Savoir les identifier t'aide a suivre le raisonnement, et savoir les employer rend ton anglais precis.</p>`
  }
};
</script>
