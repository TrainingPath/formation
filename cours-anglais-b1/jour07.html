  title: "Le passif : présent et passé",
  subtitle: "Be + participe passé : quand l'action compte plus que celui qui la fait.",
  theory: `
<h3>1. Voix active et voix passive</h3>
<p>À la <strong>voix active</strong>, le sujet fait l'action : <em>The cook prepares the meal</em> (Le cuisinier prépare le repas). À la <strong>voix passive</strong>, le sujet <strong>subit</strong> l'action : <em>The meal is prepared by the cook</em> (Le repas est préparé par le cuisinier). Le passif met en avant <strong>ce qui subit l'action</strong> plutôt que celui qui la fait.</p>
<h3>2. Pourquoi utiliser le passif ?</h3>
<p>On choisit le passif quand : on ne sait <strong>pas qui fait l'action</strong>, ou que ce n'est <strong>pas important</strong> ; quand on veut insister sur le <strong>résultat</strong> ou l'objet ; ou dans un style <strong>formel</strong> (textes officiels, scientifiques, informations).</p>
<pre class="pseudo">My bike was stolen last night.        // On m'a vole mon velo cette nuit. (on ne sait pas qui)
English is spoken all over the world. // On parle anglais dans le monde entier.</pre>
<h3>3. La construction : be + participe passé</h3>
<p>Le passif se forme toujours avec l'auxiliaire <strong>be</strong> (au temps voulu) suivi du <strong>participe passé</strong> du verbe. C'est le temps de <em>be</em> qui indique quand se situe l'action.</p>
<pre class="pseudo">Passif present : am / is / are + participe passe
The room is cleaned every day.        // La chambre est nettoyee tous les jours.

Passif passe : was / were + participe passe
The letters were sent yesterday.      // Les lettres ont ete envoyees hier.</pre>
<div class="tip">Le participe passé est le même qu'au past perfect : -ed pour les réguliers (cleaned, opened), 3e colonne pour les irréguliers (make/made, build/built, take/taken, write/written).</div>
<h3>4. Transformer une phrase active en passive</h3>
<p>Trois étapes : le <strong>complément d'objet</strong> de la phrase active devient le <strong>sujet</strong> de la passive ; on met le verbe à <strong>be + participe passé</strong> (au même temps) ; l'ancien sujet peut être introduit par <strong>by</strong> (par) si on veut le préciser.</p>
<pre class="pseudo">Actif  : Shakespeare wrote this play.          // Shakespeare a ecrit cette piece.
Passif : This play was written by Shakespeare.  // Cette piece a ete ecrite par Shakespeare.</pre>
<h3>5. Le complément d'agent avec « by »</h3>
<p>Le mot <strong>by</strong> introduit celui qui fait réellement l'action (l'<strong>agent</strong>). On ne le met que si l'information est <strong>utile</strong>. Très souvent, on l'omet parce qu'on ne sait pas ou que ça n'a pas d'importance.</p>
<pre class="pseudo">The bridge was built in 1890.               // Le pont a ete construit en 1890. (par qui ? peu importe)
The bridge was built by a famous engineer.  // ...par un ingenieur celebre. (info utile : on la garde)</pre>
<div class="warn">Ne confonds pas le participe passé du passif avec un passé actif. <em>The window broke</em> (actif : la fenêtre s'est cassée) est différent de <em>The window was broken</em> (passif : la fenêtre a été cassée, par quelqu'un).</div>`,
  exercises: [
    { type: "qcm", q: "Comment se construit le passif ?", opts: ["have + participe passé", "be + participe passé", "do + verbe", "will + verbe"], a: 1, exp: "Auxiliaire be (au temps voulu) + participe passé." },
    { type: "qcm", q: "À la voix passive, le sujet...", opts: ["fait l'action", "subit l'action", "n'existe pas", "est toujours une personne"], a: 1, exp: "Le sujet du passif subit l'action au lieu de la faire." },
    { type: "input", q: "Mets au passif présent : « The room ___ cleaned every day. » (auxiliaire be)", a: ["is"], ph: "un mot", exp: "Passif présent, sujet singulier : is cleaned." },
    { type: "input", q: "Mets au passif passé : « The letters ___ sent yesterday. » (auxiliaire be)", a: ["were"], ph: "un mot", exp: "Passif passé, sujet pluriel : were sent." },
    { type: "qcm", q: "Transforme au passif : « They build houses here. »", opts: ["Houses build here.", "Houses are built here.", "Houses were build here.", "Houses is built here."], a: 1, exp: "Passif présent : are + built (participe passé de build)." },
    { type: "input", q: "Complète avec le participe passé : « This song was ___ (write) in 1975. »", a: ["written"], ph: "participe passé", exp: "write / wrote / written : was written." },
    { type: "qcm", q: "Quel mot introduit celui qui fait réellement l'action (l'agent) ?", opts: ["with", "by", "from", "of"], a: 1, exp: "by + agent : written by Shakespeare, built by an engineer." },
    { type: "vf", q: "On utilise le passif quand on ne sait pas qui fait l'action ou que ce n'est pas important.", a: true, exp: "C'est l'un des usages principaux du passif : My bike was stolen (on ignore qui)." },
    { type: "qcm", q: "Choisis la phrase passive correcte au passé.", opts: ["The cake was eat by the children.", "The cake was eaten by the children.", "The cake is eaten yesterday.", "The cake were eaten by the children."], a: 1, exp: "was + eaten (participe passé de eat), sujet singulier cake." },
    { type: "input", q: "Transforme : « Millions of people watch this show. » → « This show ___ watched by millions of people. »", a: ["is"], ph: "un mot", exp: "Passif présent, sujet singulier show : is watched." },
    { type: "qcm", q: "Lis : « The Mona Lisa was painted by Leonardo da Vinci. » Que met en avant cette phrase ?", opts: ["Le peintre avant tout", "Le tableau (l'objet), avec l'auteur en information secondaire", "Le musée", "La date"], a: 1, exp: "Le passif place le tableau en sujet ; l'agent (by Leonardo) vient après, comme complément." },
    { type: "input", q: "Complète : « These cars ___ made in Germany. » (passif présent, pluriel)", a: ["are"], ph: "un mot", exp: "Sujet pluriel cars : are made." },
    { type: "vf", q: "« The window broke » et « The window was broken » ont exactement le même sens.", a: false, exp: "The window broke = actif (elle s'est cassée). The window was broken = passif (elle a été cassée par quelqu'un)." },
    { type: "input", q: "Traduis : « Ce pont a été construit en 1890. » → « This bridge ___ ___ in 1890. » (2 mots)", a: ["was built"], ph: "2 mots", exp: "was built : passif passé (build / built / built)." },
    { type: "qcm", q: "Quand omet-on souvent le complément avec « by » ?", opts: ["Jamais, il est obligatoire", "Quand l'agent est inconnu ou sans importance", "Uniquement au présent", "Seulement dans les questions"], a: 1, exp: "On omet by + agent quand on ne sait pas qui fait l'action ou que ce n'est pas utile." }
  ],
  final: {
    title: "Exercice final — Lire et comprendre",
    intro: `<p>Read this short text about a factory, then answer the questions.</p>
<p>This chocolate factory was opened more than a hundred years ago. Today, thousands of bars are produced here every day. First, the cocoa beans are brought from Africa and South America. Then they are cleaned, roasted and ground into a smooth paste. Sugar and milk are added, and the mixture is poured into moulds. When the chocolate is cold, it is wrapped by fast machines and packed into boxes. The boxes are sent to shops all over the country. Last year, a new building was added, and many new workers were hired. The company is known for its quality, and its products are loved by children and adults alike.</p>`,
    questions: [
      { type: "qcm", q: "When was the factory opened?", opts: ["Last year", "More than a hundred years ago", "In 1975", "Ten days ago"], a: 1, exp: "This chocolate factory was opened more than a hundred years ago." },
      { type: "vf", q: "The cocoa beans are brought from Africa and South America.", a: true, exp: "The text states this directly, in the passive." },
      { type: "input", q: "Complete from the text: « The chocolate is ___ by fast machines. »", a: ["wrapped"], ph: "participe passé", exp: "it is wrapped by fast machines (passif présent)." },
      { type: "qcm", q: "Which two sentences are in the passive PAST?", opts: ["Bars are produced / beans are cleaned", "A new building was added / many workers were hired", "The boxes are sent / products are loved", "The factory is known / children love it"], a: 1, exp: "was added et were hired sont au passif passé (was/were + participe passé)." },
      { type: "qcm", q: "Why is the passive used so often in this text?", opts: ["To describe feelings", "Because the process and the products matter more than who does each action", "To ask questions", "To talk about the future"], a: 1, exp: "Le passif convient aux descriptions de procédés : l'important est l'action et le produit, pas qui l'exécute." }
    ],
    solution: `<p>Réponses : More than a hundred years ago ; Vrai ; « wrapped » ; A new building was added / many workers were hired ; Because the process and the products matter more than who does each action.</p>
<p>Ce texte illustre l'usage typique du passif pour décrire un procédé de fabrication : <em>are produced, are brought, are cleaned, is poured, is wrapped, are sent</em> (passif présent) et <em>was opened, was added, were hired</em> (passif passé). L'agent (by...) est presque toujours omis car il n'a pas d'importance ici.</p>`
  }
};
