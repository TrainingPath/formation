<script>
var DAY = {
  num: 24,
  title: "Compréhension : un article de presse",
  subtitle: "Lire un article et en dégager les informations clés.",
  theory: `
<h3>1. Comment lire un article de presse</h3>
<p>On ne lit pas un article comme un roman. On repere d'abord le <strong>headline</strong> (le titre), puis on cherche les reponses aux questions essentielles : <strong>Who? What? Where? When? Why?</strong> (Qui ? Quoi ? Ou ? Quand ? Pourquoi ?). Ne t'arrete pas sur chaque mot inconnu : devine le sens grace au contexte.</p>
<div class="tip">Les journalistes placent l'essentiel au debut (c'est la « pyramide inversee ») : le premier paragraphe resume deja le plus important.</div>
<h3>2. Vocabulaire de la presse</h3>
<pre class="pseudo">a headline    // un titre
an article    // un article
a journalist / a reporter // un journaliste
a source      // une source
to report     // rapporter, relater
according to  // selon, d'apres
to claim      // affirmer
to announce   // annoncer
a survey      // un sondage, une enquete</pre>
<h3>3. Lis cet article</h3>
<pre class="pseudo">CITY OPENS ITS FIRST CAR-FREE DISTRICT

Greenford, 12 May. The city of Greenford has opened its first
car-free district this week. According to the mayor, the goal
is to reduce pollution and make the streets safer for families.
The new area covers ten streets in the city centre. Cars are
no longer allowed there, but buses, bikes and delivery vans
can still enter at certain hours. Local shops were worried at
first, because they feared they would lose customers. However,
a recent survey shows that most visitors are happy with the
change. "The streets are quieter and the air is cleaner," said
Mrs Patel, who owns a small bakery. Some drivers still complain
about parking, and the council admits that more work is needed.
The mayor announced that two more districts will follow next
year if the project succeeds. Experts believe other cities will
soon copy the idea. For now, residents seem proud of their new,
greener neighbourhood.</pre>
<h3>4. Traduction des passages clés</h3>
<pre class="pseudo">The city has opened its first car-free district.
   // La ville a ouvert son premier quartier sans voiture.
The goal is to reduce pollution.
   // Le but est de reduire la pollution.
Local shops were worried they would lose customers.
   // Les commerces locaux craignaient de perdre des clients.
Two more districts will follow next year if the project succeeds.
   // Deux autres quartiers suivront l'an prochain si le projet reussit.</pre>
<div class="warn">« according to the mayor » = selon le maire. On ne dit jamais « according to me » pour donner SON avis : pour soi, on dit « in my opinion ».</div>
<h3>5. Stratégie pour répondre</h3>
<p>Pour chaque question, retrouve la phrase exacte de l'article qui contient la reponse. Les reponses fausses (les « pieges ») utilisent souvent des mots du texte mais changent un detail. Lis toujours l'option jusqu'au bout.</p>`,
  exercises: [
    { type: "qcm", q: "De quoi parle l'article ?", opts: ["D'un nouveau stade", "Du premier quartier sans voiture de la ville", "D'une greve des bus", "D'une nouvelle ecole"], a: 1, exp: "Le titre et le premier paragraphe : un quartier sans voiture." },
    { type: "qcm", q: "Selon le maire, quel est le but du projet ?", opts: ["Gagner de l'argent", "Reduire la pollution et securiser les rues", "Attirer des touristes", "Construire des parkings"], a: 1, exp: "The goal is to reduce pollution and make the streets safer." },
    { type: "vf", q: "Les bus et les velos peuvent encore entrer dans la zone a certaines heures.", a: true, exp: "Buses, bikes and delivery vans can still enter at certain hours." },
    { type: "input", q: "Complete depuis le texte : « The new area covers ten ___ in the city centre. »", a: ["streets"], ph: "un mot", exp: "covers ten streets = couvre dix rues." },
    { type: "qcm", q: "Pourquoi les commerces etaient-ils inquiets au depart ?", opts: ["Ils craignaient de perdre des clients", "Ils voulaient plus de voitures", "Ils fermaient boutique", "Ils changeaient d'adresse"], a: 0, exp: "They feared they would lose customers." },
    { type: "qcm", q: "Que montre le sondage recent ?", opts: ["La plupart des visiteurs sont mecontents", "La plupart des visiteurs sont contents du changement", "Personne ne vient plus", "Les prix ont baisse"], a: 1, exp: "A recent survey shows that most visitors are happy." },
    { type: "input", q: "Qui possede une petite boulangerie ? « Mrs ___ »", a: ["Patel"], ph: "un nom", exp: "Mrs Patel, who owns a small bakery." },
    { type: "vf", q: "Plus aucun conducteur ne se plaint dans l'article.", a: false, exp: "Some drivers still complain about parking." },
    { type: "qcm", q: "Que signifie « according to the mayor » ?", opts: ["contre le maire", "selon le maire", "avec le maire", "sans le maire"], a: 1, exp: "according to = selon, d'apres." },
    { type: "qcm", q: "Combien de quartiers supplementaires suivront l'an prochain si le projet reussit ?", opts: ["Un", "Deux", "Cinq", "Dix"], a: 1, exp: "Two more districts will follow next year." },
    { type: "input", q: "Complete : « Experts believe other cities will soon ___ the idea. » (copier)", a: ["copy"], ph: "un verbe", exp: "other cities will soon copy the idea." },
    { type: "vf", q: "Le conseil municipal reconnait qu'il reste du travail a faire.", a: true, exp: "The council admits that more work is needed." },
    { type: "qcm", q: "Selon la strategie du cours, ou trouve-t-on l'essentiel d'un article ?", opts: ["A la fin", "Dans le premier paragraphe", "Dans les publicites", "Nulle part"], a: 1, exp: "Pyramide inversee : l'essentiel est au debut." },
    { type: "qcm", q: "Comment se sentent les habitants a la fin de l'article ?", opts: ["En colere", "Fiers de leur nouveau quartier plus vert", "Indifferents", "Tristes"], a: 1, exp: "Residents seem proud of their new, greener neighbourhood." },
    { type: "input", q: "Complete : « The streets are quieter and the air is ___ . » (plus propre)", a: ["cleaner"], ph: "un adjectif", exp: "the air is cleaner = l'air est plus propre." }
  ],
  final: {
    title: "Exercice final — Un second article",
    intro: `<p>Read this second article and answer the questions.</p>
<p>A local library has become the most popular place in town, according to a new report. Last year, the old building was almost empty and the council thought about closing it. Instead, a young librarian named Sofia decided to change everything. She created a free coding club for teenagers, organised story time for children, and opened a small cafe inside the library. Now, more than five hundred people visit every week. "Books are only the beginning," Sofia explained. "A library should be a place where the whole community meets." The council was surprised by the success and has promised more money for next year. Some older readers complained that the library is now too noisy, but most people are delighted. Other towns have already asked Sofia for advice.</p>`,
    questions: [
      { type: "qcm", q: "What did the council first think about doing with the library?", opts: ["Making it bigger", "Closing it", "Selling books", "Painting it"], a: 1, exp: "The council thought about closing it because it was almost empty." },
      { type: "qcm", q: "Who changed the library?", opts: ["The mayor", "A young librarian named Sofia", "The teenagers", "An old reader"], a: 1, exp: "A young librarian named Sofia decided to change everything." },
      { type: "input", q: "Complete: « Now, more than five hundred people ___ every week. »", a: ["visit"], ph: "un verbe", exp: "more than five hundred people visit every week." },
      { type: "vf", q: "Everyone is happy about the changes.", a: false, exp: "Some older readers complained it is now too noisy." },
      { type: "qcm", q: "What does Sofia believe a library should be?", opts: ["Only for books", "A place where the whole community meets", "A silent room", "A shop"], a: 1, exp: "A library should be a place where the whole community meets." }
    ],
    solution: `<p>Reponses : 2 (closing it), 2 (Sofia), « visit », Faux (some readers complained), 2 (community meets).</p>
<p>Meme methode que pour le premier article : cherche la phrase qui contient la reponse, mefie-toi des options qui reprennent des mots du texte mais changent un detail. Le Who/What/Where/When/Why reste ton guide.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b1-j24", title: "Résume un article de presse", level: 3,
    statement: "Redige un court resume (5 a 7 phrases) de l'article sur le quartier sans voiture, en repondant aux questions Who? What? Where? When? Why? Termine par ta propre opinion.",
    hints: [
      "Commence par l'essentiel : The city of Greenford has opened...",
      "Utilise according to the mayor pour rapporter une source.",
      "Ajoute ton avis a la fin : In my opinion, this is a good idea because..."
    ],
    solution: "This article reports that the city of Greenford has opened its first car-free district. According to the mayor, the goal is to reduce pollution and make the streets safer. Cars are no longer allowed in ten streets in the centre, but buses and bikes can still enter at certain hours. At first, local shops were worried, but a survey now shows that most visitors are happy. The mayor announced that two more districts will follow if the project succeeds. In my opinion, this is a good idea, because cleaner air and quieter streets are good for everyone.\n\nTraduction : Cet article rapporte que la ville de Greenford a ouvert son premier quartier sans voiture. Selon le maire, le but est de reduire la pollution et de securiser les rues. Les voitures ne sont plus autorisees dans dix rues du centre, mais les bus et les velos peuvent encore entrer a certaines heures. Au depart, les commerces etaient inquiets, mais un sondage montre maintenant que la plupart des visiteurs sont contents. Le maire a annonce que deux autres quartiers suivront si le projet reussit. A mon avis, c'est une bonne idee, car un air plus propre et des rues plus calmes sont bons pour tout le monde.",
    note: "Un bon resume ne recopie pas l'article : il reformule l'essentiel avec tes propres mots et distingue les faits de ton opinion." }
  ]
};
</script>
