<script>
var DAY = {
  num: 30,
  title: "Maintenir sa certification et l'après-CCIE",
  subtitle: "Décrocher le CCIE est un sommet ; y rester demande de continuer à grimper.",
  theory: `
<h3>1. Une certification qui ne dure pas éternellement</h3>
<p>Le CCIE, comme la plupart des certifications Cisco, a une <strong>durée de validité</strong> : elle expire après <strong>trois ans</strong> si l'on ne fait rien. La logique est simple : les technologies évoluent vite, et une certification doit rester la preuve d'un savoir <strong>à jour</strong>. Il faut donc, avant l'échéance, <strong>recertifier</strong> (en anglais <em>recertify</em>) pour prolonger sa validité de trois années supplémentaires.</p>
<div class="warn">Si tu laisses ta certification expirer sans agir, elle devient <strong>inactive</strong>. Anticipe : lance ta démarche de recertification bien avant la date limite, pas la veille.</div>
<h3>2. Deux chemins pour recertifier</h3>
<p>Cisco offre deux voies pour maintenir sa certification active. La première, classique, consiste à <strong>repasser un examen</strong> Cisco éligible (par exemple un examen de niveau professionnel ou expert). La seconde, plus souple, est le programme de <strong>formation continue</strong> : le <strong>Continuing Education</strong> (CE). On y gagne des <strong>crédits CE</strong> (<em>Continuing Education credits</em>) en suivant des formations autorisées, en participant à des sessions, ou en menant certaines activités reconnues par Cisco.</p>
<pre class="pseudo"># Deux voies de recertification (validité 3 ans)
Voie 1 : réussir un examen Cisco éligible
Voie 2 : accumuler des crédits Continuing Education (CE)
         → formations autorisées, sessions, activités reconnues
On peut aussi COMBINER examen + crédits CE selon les règles en vigueur.</pre>
<div class="tip">Le programme Continuing Education est apprécié des experts : il permet de rester certifié <strong>en apprenant du neuf</strong> (automatisation, sécurité, cloud…) plutôt qu'en re-passant un examen déjà connu.</p>
<h3>3. Le statut CCIE Emeritus : honorer les vétérans</h3>
<p>Cisco reconnaît la fidélité par un statut particulier : le <strong>CCIE Emeritus</strong>. Un CCIE qui a maintenu sa certification active pendant de nombreuses années (historiquement autour de dix ans cumulés) peut demander ce statut. Il permet de <strong>conserver son titre et son numéro CCIE</strong> à titre honorifique <strong>sans avoir à recertifier</strong> chaque cycle. En contrepartie, le statut Emeritus est <strong>honorifique</strong> : il n'équivaut pas à une certification active pour les exigences qui l'imposent (par exemple certaines exigences de partenariat). C'est une reconnaissance de la carrière, pas un raccourci pour rester « actif ».</p>
<pre class="pseudo"># CCIE Emeritus (en résumé)
Condition   : avoir maintenu le CCIE actif de longues années (env. 10 ans)
Avantage    : garder titre + numéro CCIE SANS recertifier
Nature      : statut HONORIFIQUE (≠ certification pleinement active)
Réversible  : on peut redevenir 'actif' en recertifiant si besoin</pre>
<h3>4. L'après-CCIE : faire fructifier le titre</h3>
<p>Le CCIE ouvre des portes : <strong>architecte réseau</strong>, ingénieur principal, consultant expert, expert avant-vente, formateur, ou évolution vers le management technique. Beaucoup poursuivent en se <strong>spécialisant</strong> (sécurité, data center, service provider, automatisation/DevNet) ou visent l'échelon ultime, le <strong>CCDE</strong> (design expert) voire le très rare <strong>CCAr</strong> (Cisco Certified Architect), le plus haut niveau de l'échelle Cisco. La certification n'est pas une fin : c'est un socle sur lequel bâtir une expertise durable et une veille technologique permanente.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Validité du CCIE : 3 ans → il faut RECERTIFIER avant l'échéance
# Deux voies : (1) réussir un examen éligible, (2) crédits Continuing Education (CE)
#   → on peut aussi combiner examen + crédits CE
# CCIE Emeritus : après ~10 ans d'activité, garder titre+numéro SANS recertifier
#   → statut HONORIFIQUE (pas une certification pleinement active), réversible
# L'après-CCIE : architecte, spécialisation, CCDE, CCAr — veille permanente</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la durée de validité d'une certification CCIE avant expiration ?", opts: ["1 an", "2 ans", "3 ans", "5 ans"], a: 2, exp: "Le CCIE est valide 3 ans ; il faut recertifier avant l'échéance." },
    { type: "vf", q: "Une certification Cisco reste valable à vie une fois obtenue.", a: false, exp: "Non : elle expire après 3 ans si l'on ne recertifie pas." },
    { type: "qcm", q: "Pourquoi les certifications Cisco ont-elles une durée de validité ?", opts: ["Pour faire payer davantage", "Parce que les technologies évoluent : la certif doit rester à jour", "Par obligation légale", "Pour limiter le nombre de certifiés"], a: 1, exp: "L'objectif est de garantir un savoir à jour face à l'évolution rapide des technologies." },
    { type: "input", q: "Comment appelle-t-on l'action de prolonger la validité de sa certification ? (un verbe)", a: ["recertifier", "recertification", "se recertifier", "recertify"], ph: "un verbe", exp: "Recertifier prolonge la validité de trois années supplémentaires." },
    { type: "qcm", q: "Quelles sont les deux grandes voies pour recertifier ?", opts: ["Payer des frais de prolongation", "Réussir un examen éligible OU accumuler des crédits Continuing Education", "Repasser le niveau CCNP", "Rien, c'est automatique"], a: 1, exp: "On recertifie en repassant un examen ou via le programme Continuing Education (CE)." },
    { type: "input", q: "Comment nomme-t-on le programme de formation continue qui donne des crédits pour recertifier ? (deux mots anglais)", a: ["continuing education", "continuing education program", "ce", "continuing education credits"], ph: "programme…", exp: "Le Continuing Education (CE) : on gagne des crédits CE par des formations autorisées." },
    { type: "qcm", q: "Que gagne-t-on en suivant des formations autorisées dans le programme CE ?", opts: ["De l'argent", "Des crédits Continuing Education (CE credits)", "Un nouveau numéro CCIE", "Une exemption de tout examen à vie"], a: 1, exp: "On accumule des crédits CE qui permettent de recertifier." },
    { type: "vf", q: "On peut parfois combiner un examen et des crédits CE pour recertifier.", a: true, exp: "Oui : selon les règles en vigueur, la combinaison est possible." },
    { type: "qcm", q: "Qu'est-ce que le statut CCIE Emeritus ?", opts: ["Un examen plus difficile", "Un statut honorifique permettant de garder titre et numéro sans recertifier", "Une certification débutant", "Une amende pour retard"], a: 1, exp: "Emeritus honore les vétérans : on conserve titre et numéro sans recertifier." },
    { type: "input", q: "Après environ combien d'années d'activité peut-on prétendre au statut CCIE Emeritus ? (un nombre)", a: ["10", "dix", "10 ans", "dix ans", "environ 10", "~10"], ph: "un nombre d'années", exp: "Historiquement autour de dix ans de CCIE actif cumulés." },
    { type: "vf", q: "Le statut CCIE Emeritus équivaut en tout point à une certification pleinement active.", a: false, exp: "Non : c'est un statut honorifique, distinct d'une certification active pour certaines exigences." },
    { type: "vf", q: "Un CCIE Emeritus peut redevenir 'actif' en recertifiant s'il le souhaite.", a: true, exp: "Oui : le statut est réversible, on peut retrouver le statut actif via la recertification." },
    { type: "qcm", q: "Quelle est une évolution de carrière classique après le CCIE ?", opts: ["Technicien de maintenance", "Architecte réseau / ingénieur principal / consultant expert", "Un poste sans lien avec le réseau", "Administrateur de helpdesk"], a: 1, exp: "Le CCIE ouvre vers l'architecture, l'expertise, le conseil, la spécialisation." },
    { type: "qcm", q: "Quel est le niveau de certification Cisco le plus élevé, au-dessus des experts ?", opts: ["CCNA", "CCNP", "CCAr (Cisco Certified Architect)", "CCST"], a: 2, exp: "Le CCAr (Cisco Certified Architect) est le plus haut niveau, au-dessus des experts." },
    { type: "input", q: "Quelle certification Cisco de niveau expert est dédiée au DESIGN ? (sigle 4 lettres)", a: ["ccde", "cisco ccde"], ph: "sigle", exp: "Le CCDE (Cisco Certified Design Expert) est l'expert orienté design." }
  ],
  final: {
    title: "Exercice final — Piloter l'après-CCIE",
    intro: `<p>Tu es CCIE depuis presque trois ans. L'échéance approche et tu veux rester certifié tout en apprenant du neuf (automatisation, sécurité). Plus tard, tu envisages de lever le pied. Planifie ta stratégie.</p>`,
    questions: [
      { type: "qcm", q: "Ton CCIE expire dans quelques mois. Que dois-tu faire ?", opts: ["Rien, il se renouvelle seul", "Recertifier avant l'échéance (examen ou crédits CE)", "Attendre qu'il expire puis recommencer à zéro", "Changer de métier"], a: 1, exp: "Il faut recertifier avant l'échéance des 3 ans, par examen ou crédits CE." },
      { type: "qcm", q: "Tu veux rester certifié EN APPRENANT du neuf plutôt qu'en repassant un examen connu. Quelle voie ?", opts: ["Le programme Continuing Education (crédits CE)", "Ne rien faire", "Laisser expirer", "Le statut Emeritus tout de suite"], a: 0, exp: "Le Continuing Education permet de recertifier via des formations sur des sujets nouveaux." },
      { type: "input", q: "Comment s'appellent les points gagnés dans ce programme de formation continue ? (deux mots + credits)", a: ["ce credits", "credits ce", "continuing education credits", "credits continuing education", "crédits ce"], ph: "…credits", exp: "Ce sont les CE credits (Continuing Education credits)." },
      { type: "vf", q: "Après une dizaine d'années de CCIE actif, tu pourras demander le statut Emeritus pour garder ton titre sans recertifier.", a: true, exp: "Oui : c'est justement l'objet du statut CCIE Emeritus, honorifique et réversible." },
      { type: "qcm", q: "Vers quelle certification experte t'orienter si tu vises le DESIGN d'architectures ?", opts: ["CCNA", "CCDE", "CCST", "DevNet Associate"], a: 1, exp: "Le CCDE (Cisco Certified Design Expert) est la voie experte orientée design." }
    ],
    solution: `<pre class="pseudo"># Stratégie de l'après-CCIE
Échéance à 3 ans → RECERTIFIER avant la date limite :
   Voie 1 : réussir un examen Cisco éligible
   Voie 2 : accumuler des crédits Continuing Education (CE credits)
            → idéal pour apprendre du neuf (automatisation, sécurité, cloud)
   (combinaison examen + crédits CE possible)
Plus tard, après ~10 ans d'activité → demander CCIE EMERITUS :
   garder titre + numéro SANS recertifier, statut HONORIFIQUE et réversible
Évolution : architecte réseau, consultant, spécialisation (sécurité, DC, SP, DevNet),
   puis viser CCDE (design expert) voire CCAr (le plus haut niveau).</pre>
<p>Une certification se <strong>maintient</strong> autant qu'elle se décroche. Recertifier par le Continuing Education garde le savoir à jour ; le statut Emeritus honore les vétérans ; et le CCIE reste un socle sur lequel bâtir toute une carrière d'expert.</p>`
  }
};
</script>
