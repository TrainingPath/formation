<script>
var DAY = {
  num: 29,
  title: "Construire un labo d'entraînement (CML, EVE-NG)",
  subtitle: "On ne devient pas CCIE en lisant : on le devient en simulant, encore et encore.",
  theory: `
<h3>1. Pourquoi un labo virtuel plutôt que du matériel physique</h3>
<p>Le CCIE se prépare par des <strong>centaines d'heures de labo</strong>. Acheter des routeurs et commutateurs physiques coûte cher, prend de la place, consomme de l'électricité et se recâble lentement. La <strong>simulation</strong> (ou plus exactement l'<em>émulation</em>) résout tout cela : on fait tourner de vrais systèmes d'exploitation réseau dans des machines virtuelles, sur un simple ordinateur ou un serveur. On monte une topologie en quelques clics, on la casse, on la reconstruit à l'infini.</p>
<div class="tip">Nuance de vocabulaire : un <strong>simulateur</strong> imite le comportement (ex. Packet Tracer, limité), tandis qu'un <strong>émulateur</strong> exécute la vraie image logicielle de l'équipement (IOS, IOS XE, NX-OS…), donc bien plus fidèle. Pour le CCIE, on veut de l'émulation.</p>
<h3>2. Cisco Modeling Labs (CML) : la solution officielle</h3>
<p><strong>Cisco Modeling Labs</strong> (abrégé <strong>CML</strong>, anciennement VIRL) est l'outil <strong>officiel de Cisco</strong>. Son gros avantage : les <strong>images logicielles sont fournies et licenciées légalement</strong> avec le produit (IOSv, IOSvL2, IOS XE / CSR1000v, NX-OSv 9000, etc.). C'est une plateforme web, gérée depuis le navigateur, qui permet de dessiner la topologie, démarrer les nœuds et se connecter à la console de chacun. Comme l'environnement du labo réel s'appuie sur des équipements virtualisés, s'entraîner sur CML rapproche des conditions de l'examen.</p>
<pre class="pseudo"># Écosystème d'un labo CML
Navigateur ─► CML (serveur d'émulation) ─► nœuds virtuels
   IOSv      : routeur (plan de contrôle IOS)
   IOSvL2    : commutateur (fonctions L2 : VLAN, trunk, STP)
   IOS XE / CSR1000v : routeur XE (automatisation, NETCONF/RESTCONF)
   NX-OSv 9000 : commutateur Nexus (data center)
# Avantage clé : images légalement incluses avec la licence CML</pre>
<h3>3. EVE-NG et GNS3 : les alternatives populaires</h3>
<p>Deux autres plateformes dominent la communauté. <strong>EVE-NG</strong> (Emulated Virtual Environment - Next Generation) est très prisé car il est <strong>multi-fournisseurs</strong> : il émule non seulement du Cisco, mais aussi Juniper, Arista, Palo Alto, Fortinet… idéal pour des topologies hétérogènes. Il existe en version communautaire gratuite et en version Pro payante. <strong>GNS3</strong> (Graphical Network Simulator 3) est un logiciel libre historique, gratuit, très souple, qui s'appuie souvent sur un serveur distant (« GNS3 VM ») pour les images lourdes.</p>
<pre class="pseudo"># Comparatif express
CML     : officiel Cisco, images incluses & légales, proche du labo réel
EVE-NG  : multi-fournisseurs (Cisco, Juniper, Arista, Palo Alto…), gratuit + Pro
GNS3    : libre et gratuit, très souple, souvent adossé à une 'GNS3 VM'
# Point commun : ce sont des ÉMULATEURS (vraies images), pas de simples simulateurs</pre>
<div class="warn">Les images (IOS, IOS XE, NX-OS…) sont soumises à <strong>licence</strong>. Avec CML, elles sont fournies légalement. Sur EVE-NG et GNS3, l'utilisateur doit se procurer ses propres images de façon licite : ne jamais utiliser d'images obtenues illégalement.</div>
<h3>4. Dimensionner sa machine et organiser ses labos</h3>
<p>L'émulation est gourmande : chaque nœud consomme de la <strong>RAM</strong> et du <strong>CPU</strong>. Une topologie CCIE (une douzaine de nœuds ou plus) réclame beaucoup de mémoire — d'où l'usage fréquent d'un serveur dédié ou d'une VM costaud. Organise tes labos par thème (OSPF, BGP, MPLS, redistribution, sécurité, automatisation), sauvegarde les topologies, et rejoue-les en te chronométrant pour t'entraîner à la gestion du temps du jour J.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># On s'entraîne au CCIE par l'ÉMULATION (vraies images), pas par la simulation
# CML (Cisco Modeling Labs) : outil OFFICIEL Cisco, images incluses & légales
#   nœuds : IOSv, IOSvL2, IOS XE/CSR1000v, NX-OSv 9000
# EVE-NG : multi-fournisseurs (Cisco/Juniper/Arista/Palo Alto), gratuit + Pro
# GNS3   : libre, gratuit, souple (souvent via une 'GNS3 VM')
# Images sous LICENCE : légales avec CML ; à fournir légalement ailleurs
# Émulation gourmande en RAM/CPU → serveur/VM dédié ; se chronométrer</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est l'outil de labo virtuel OFFICIEL de Cisco ?", opts: ["EVE-NG", "GNS3", "Cisco Modeling Labs (CML)", "Packet Tracer Pro"], a: 2, exp: "CML (Cisco Modeling Labs), anciennement VIRL, est la solution officielle de Cisco." },
    { type: "input", q: "Quel était l'ancien nom de Cisco Modeling Labs ? (4 lettres)", a: ["virl", "cisco virl"], ph: "ancien nom", exp: "CML s'appelait auparavant VIRL." },
    { type: "qcm", q: "Quel est l'avantage clé de CML concernant les images logicielles ?", opts: ["Elles sont plus rapides", "Elles sont fournies et licenciées légalement avec le produit", "Elles sont inutiles", "Elles ne consomment aucune RAM"], a: 1, exp: "Avec CML, les images (IOSv, IOS XE, NX-OSv…) sont incluses de façon légale." },
    { type: "vf", q: "Un émulateur exécute la vraie image logicielle de l'équipement, contrairement à un simple simulateur.", a: true, exp: "Oui : l'émulateur est plus fidèle car il fait tourner le vrai OS (IOS, XE, NX-OS)." },
    { type: "qcm", q: "Quelle plateforme est réputée MULTI-FOURNISSEURS (Cisco, Juniper, Arista, Palo Alto…) ?", opts: ["CML", "EVE-NG", "Packet Tracer", "Wireshark"], a: 1, exp: "EVE-NG émule de nombreux fournisseurs, pas seulement Cisco." },
    { type: "input", q: "Que signifie le sigle GNS3 ? (le mot principal, en anglais)", a: ["graphical network simulator", "graphical network simulator 3", "network simulator"], ph: "développe le sigle", exp: "GNS3 = Graphical Network Simulator 3, un émulateur libre et gratuit." },
    { type: "qcm", q: "Dans CML, quel nœud émule un COMMUTATEUR de couche 2 ?", opts: ["IOSv", "IOSvL2", "CSR1000v", "NX-OSv routeur"], a: 1, exp: "IOSvL2 fournit les fonctions L2 (VLAN, trunk, STP)." },
    { type: "qcm", q: "Quel nœud CML correspond à un commutateur Nexus (data center) ?", opts: ["IOSv", "IOSvL2", "NX-OSv 9000", "CSR1000v"], a: 2, exp: "NX-OSv 9000 émule la plateforme Nexus (NX-OS)." },
    { type: "vf", q: "Les images IOS/IOS XE/NX-OS sont libres de droit et peuvent être obtenues n'importe où.", a: false, exp: "Non : elles sont sous licence. Légales avec CML ; à se procurer licitement ailleurs." },
    { type: "qcm", q: "GNS3 s'appuie souvent sur quel composant pour faire tourner les images lourdes ?", opts: ["Une 'GNS3 VM' (machine virtuelle)", "Un simulateur cloud gratuit", "Un routeur physique obligatoire", "Aucun, tout tourne dans le navigateur"], a: 0, exp: "La 'GNS3 VM' héberge l'émulation des images gourmandes." },
    { type: "input", q: "Quelles sont les deux ressources principalement consommées par chaque nœud émulé ? (deux mots)", a: ["ram et cpu", "cpu et ram", "ram cpu", "cpu ram", "memoire et cpu", "mémoire et processeur"], ph: "deux ressources", exp: "Chaque nœud consomme de la RAM et du CPU : l'émulation est gourmande." },
    { type: "qcm", q: "Pourquoi préférer l'émulation au matériel physique pour préparer le CCIE ?", opts: ["C'est moins fidèle mais joli", "Coût, place et électricité réduits, topologies reconstruites à l'infini", "Parce que le matériel est interdit", "Parce que l'émulation ne consomme rien"], a: 1, exp: "L'émulation est économique, souple et rapide à recâbler virtuellement." },
    { type: "vf", q: "S'entraîner sur CML rapproche des conditions du labo réel, car il s'appuie sur des équipements virtualisés.", a: true, exp: "Oui : l'environnement d'examen repose sur de la virtualisation, comme CML." },
    { type: "qcm", q: "Quel nœud CML est un routeur IOS XE orienté automatisation (NETCONF/RESTCONF) ?", opts: ["IOSvL2", "CSR1000v (IOS XE)", "NX-OSv 9000", "Packet Tracer"], a: 1, exp: "Le CSR1000v (IOS XE) sert souvent aux labos d'automatisation." },
    { type: "vf", q: "EVE-NG n'existe qu'en version payante.", a: false, exp: "Non : EVE-NG propose une édition communautaire gratuite et une édition Pro payante." }
  ],
  final: {
    title: "Exercice final — Monter son environnement d'entraînement",
    intro: `<p>Tu veux t'entraîner au CCIE Enterprise chez toi : topologies Cisco, images légales, conditions proches de l'examen, avec parfois un équipement Juniper à mêler. Fais tes choix d'outils et de dimensionnement.</p>`,
    questions: [
      { type: "qcm", q: "Quel outil choisir pour des images Cisco légales et des conditions proches de l'examen ?", opts: ["Packet Tracer", "Cisco Modeling Labs (CML)", "Un simulateur web gratuit non officiel", "Aucun outil, que du papier"], a: 1, exp: "CML est officiel Cisco, avec images incluses et légales, proche du labo réel." },
      { type: "qcm", q: "Tu veux aussi intégrer un nœud Juniper à ta topologie. Quel outil est le plus adapté ?", opts: ["CML uniquement", "EVE-NG (multi-fournisseurs)", "Packet Tracer", "Aucun"], a: 1, exp: "EVE-NG émule plusieurs fournisseurs, dont Juniper." },
      { type: "vf", q: "Tu peux télécharger n'importe quelle image IOS trouvée sur Internet pour EVE-NG.", a: false, exp: "Non : les images sont sous licence ; il faut se les procurer légalement." },
      { type: "input", q: "Ta topologie a 12 nœuds et rame. Quelle ressource faut-il surtout augmenter ? (un mot)", a: ["ram", "la ram", "memoire", "mémoire"], ph: "une ressource", exp: "La RAM (et le CPU) : chaque nœud émulé en consomme beaucoup." },
      { type: "qcm", q: "Comment t'entraîner à la gestion du temps du jour J avec ton labo ?", opts: ["En lisant seulement la théorie", "En rejouant les topologies chronomètre en main", "En laissant les labos ouverts sans les faire", "En achetant plus de matériel"], a: 1, exp: "Se chronométrer sur des labos rejoués prépare à la contrainte de temps du labo réel." }
    ],
    solution: `<pre class="pseudo"># Environnement d'entraînement recommandé
Objectif principal (Cisco, légal, proche examen) → CML (Cisco Modeling Labs)
   nœuds : IOSv, IOSvL2, CSR1000v (IOS XE), NX-OSv 9000 — images INCLUSES & légales
Besoin multi-fournisseurs (Juniper, Arista, Palo Alto…) → EVE-NG
Alternative libre et souple → GNS3 (souvent via 'GNS3 VM')
# Règles :
# - Émulateurs = vraies images (fidèles), pas de simple simulation
# - Images sous LICENCE : légales avec CML, à obtenir licitement ailleurs
# - Dimensionner RAM/CPU (serveur ou VM dédié) pour ~12+ nœuds
# - Organiser les labos par thème, sauvegarder, REJOUER CHRONOMÈTRE EN MAIN</pre>
<p>Le bon environnement, c'est <strong>CML</strong> pour coller à l'examen (images légales incluses), complété par <strong>EVE-NG</strong> ou <strong>GNS3</strong> selon les besoins. Et surtout : on s'entraîne en se chronométrant, pour que le jour J la méthode soit un réflexe.</p>`
  }
};
</script>
