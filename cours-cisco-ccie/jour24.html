<script>
var DAY = {
  num: 24,
  title: "Le dépannage expert sous contrainte de temps",
  subtitle: "Au labo CCIE, on ne cherche pas la panne : on l'encercle, on la prouve, on la corrige — vite.",
  theory: `
<h3>1. La contrainte de temps change tout</h3>
<p>À l'examen CCIE comme en production critique, le dépannage n'est pas un exercice de curiosité : c'est une <strong>course contre la montre</strong>. Une section de <em>troubleshooting</em> impose de résoudre une dizaine de tickets en un temps serré. Le piège numéro un n'est pas de ne pas savoir : c'est de <strong>s'enliser</strong> sur un problème pendant que le chronomètre engloutit les points des autres. La compétence experte, ici, est autant méthodologique que technique : savoir <em>quand</em> chercher, <em>quand</em> abandonner temporairement, et <em>comment</em> prouver une hypothèse en un minimum d'actions.</p>
<div class="tip">Mantra du labo : <strong>isoler</strong> (réduire l'espace du problème), <strong>prouver</strong> (vérifier par un show, jamais deviner), <strong>corriger</strong>, <strong>vérifier</strong>. Et surtout : <strong>chronométrer</strong> chaque ticket pour ne jamais dépasser son budget de temps.</p></div>
<h3>2. Isoler : réduire l'espace du problème</h3>
<p>Isoler, c'est diviser pour régner. Plusieurs méthodes structurées existent, à choisir selon l'indice : <strong>suivre le chemin</strong> (<em>follow-the-path</em>) — tracer le trajet du paquet de la source à la destination pour trouver où il meurt ; <strong>diviser par deux</strong> (<em>divide-and-conquer</em>) — tester au milieu du chemin pour éliminer d'un coup la moitié de la topologie ; l'approche par <strong>couches OSI</strong> — remonter du bas (câble, interface up ?) vers le haut (application), ou l'inverse ; <strong>repérer la différence</strong> (<em>spot-the-difference</em>) — comparer un élément qui marche à un identique qui ne marche pas. Chaque méthode a le même but : passer de « quelque part dans le réseau » à « ce routeur, cette interface, cette ligne de config ».</p>
<pre class="pseudo"># Isoler un flux qui ne passe pas de A vers D (A-B-C-D)
ping D source A            ! echoue
traceroute D source A      ! s'arrete apres B -&gt; le probleme est entre B et C
! divide-and-conquer : tester depuis B directement
ping C source B            ! si OK, isoler B-C control-plane vs data-plane</pre>
<h3>3. Prouver plutôt que deviner</h3>
<p>L'erreur du débutant est de <em>supposer</em> et de configurer au jugé. L'expert <strong>prouve</strong> chaque hypothèse par une commande de vérification avant de toucher à quoi que ce soit. On lit d'abord : <code>show ip route</code>, <code>show ip ospf neighbor</code>, <code>show ip bgp summary</code>, <code>show interface</code>, <code>show running-config | section</code>. On confirme la couche 2 avant la 3, le control-plane avant le data-plane. Le <strong>debug</strong> est puissant mais coûteux (CPU, bruit) : on le réserve au dernier recours, ciblé et borné. Chaque action de lecture doit <em>réduire l'incertitude</em> ; si un show ne t'apprend rien de décisif, tu as perdu du temps.</p>
<pre class="pseudo"># Enchainement de preuve pour une adjacence OSPF absente
show ip ospf neighbor            ! le voisin manque-t-il ?
show ip ospf interface Gi0/1     ! aire, type de reseau, hello/dead, MTU
show interface Gi0/1             ! l'interface est-elle UP/UP ?
! causes classiques : mismatch d'aire, de subnet, de hello/dead, de MTU, auth</pre>
<h3>4. Prioriser : jouer les points, pas l'ego</h3>
<p>Sous contrainte, la stratégie prime sur la perfection. Règles d'or : <strong>survoler tous les tickets</strong> d'abord pour repérer les « victoires rapides » (fort rapport points/effort) ; attaquer le <strong>facile et bien payé</strong> en premier ; se fixer un <strong>budget de temps</strong> par ticket et le respecter ; si tu bloques, <strong>marquer et passer</strong> (revenir plus tard avec un œil neuf) ; et se méfier des <strong>dépendances</strong> — un ticket peut en débloquer plusieurs, ou au contraire une panne en cascade peut avoir une seule cause racine. Résoudre la <em>cause racine</em> (root cause) peut faire tomber trois tickets d'un coup.</p>
<div class="warn">Le piège mortel du labo : le « trou de lapin » (<em>rabbit hole</em>). Tu es sûr d'avoir presque trouvé, tu insistes, et 40 minutes disparaissent. Fixe une limite dure par ticket. Quand elle sonne, tu notes où tu en es et tu passes. Un ticket non fini vaut zéro point ; trois tickets faciles ratés par manque de temps valent bien plus.</p></div>
<h3>5. Corriger proprement et savoir revenir en arrière</h3>
<p>Une fois la cause prouvée, on corrige <strong>au minimum</strong> : la modification la plus petite qui règle le problème, pas une refonte. On <strong>vérifie immédiatement</strong> que le symptôme a disparu (le même ping/traceroute qui échouait doit maintenant passer) et qu'on n'a rien cassé d'autre. Si un changement aggrave la situation, on <strong>l'annule sans hésiter</strong> — d'où l'intérêt d'avoir noté l'état initial. En production, le <strong>commit/rollback</strong> (NETCONF/NAPALM, jours 20-21) et le revert Git (jour 23) sont les filets ; au labo, la discipline mentale « je sais exactement ce que j'ai changé » joue le même rôle.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Boucle experte : ISOLER -&gt; PROUVER -&gt; CORRIGER -&gt; VERIFIER (et CHRONOMETRER)
# Isoler : follow-the-path, divide-and-conquer, couches OSI, spot-the-difference
# Prouver : show avant tout (route, neighbor, interface) ; debug = dernier recours, borne
#           couche 2 avant 3, control-plane avant data-plane
# Prioriser : survoler, gains rapides d'abord, budget/ticket, marquer et passer,
#             viser la CAUSE RACINE (peut regler plusieurs tickets)
# Corriger : changement minimal, verifier tout de suite, rollback si ca empire
# Piege : le rabbit hole -&gt; limite de temps dure, on note et on passe</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le principal piège du dépannage sous contrainte de temps ?", opts: ["Utiliser trop de show", "S'enliser sur un ticket pendant que le temps engloutit les autres", "Vérifier la couche 2", "Corriger la cause racine"], a: 1, exp: "Le rabbit hole : rester bloqué fait perdre les points faciles des autres tickets." },
    { type: "qcm", q: "En quoi consiste la méthode divide-and-conquer ?", opts: ["Tester au milieu du chemin pour éliminer la moitié de la topologie", "Rebooter tous les équipements", "Deviner la panne", "Lire toute la config de A à Z"], a: 0, exp: "On teste à mi-parcours pour écarter d'un coup la moitié du réseau à investiguer." },
    { type: "qcm", q: "Avant de modifier quoi que ce soit, l'expert…", opts: ["Configure au jugé", "Prouve son hypothèse avec une commande show", "Lance tous les debug possibles", "Reboot le routeur"], a: 1, exp: "On prouve par la lecture (show) avant d'agir : on ne devine pas." },
    { type: "qcm", q: "Dans quel ordre vérifier logiquement ?", opts: ["Data-plane avant control-plane", "Couche 2 avant couche 3, control-plane avant data-plane", "Application d'abord, toujours", "Peu importe l'ordre"], a: 1, exp: "On confirme les fondations (L2, adjacences) avant les couches hautes et le transfert." },
    { type: "qcm", q: "Pourquoi viser la cause racine (root cause) est stratégique au labo ?", opts: ["Ça impressionne l'examinateur", "Une seule correction peut faire tomber plusieurs tickets liés", "C'est plus long mais joli", "Ça évite d'utiliser show"], a: 1, exp: "Des symptômes multiples partagent parfois une cause unique : la régler débloque plusieurs tickets." },
    { type: "qcm", q: "Que faire quand le budget de temps d'un ticket est épuisé sans solution ?", opts: ["Continuer coûte que coûte", "Noter où on en est, marquer le ticket et passer au suivant", "Rebooter tout le labo", "Abandonner l'examen"], a: 1, exp: "On marque et on passe ; un œil neuf plus tard est plus efficace que l'acharnement." },
    { type: "vf", q: "Le debug doit être le premier réflexe de diagnostic.", a: false, exp: "Faux : le debug est coûteux (CPU, bruit) et reste un dernier recours, ciblé et borné." },
    { type: "vf", q: "Un ticket laissé inachevé rapporte quand même des points partiels au CCIE.", a: false, exp: "Faux : en général un objectif non atteint vaut zéro ; d'où l'intérêt de finir des tickets entiers." },
    { type: "vf", q: "Si une correction aggrave la situation, il faut l'annuler sans hésiter.", a: true, exp: "Vrai : on revient à l'état initial connu, d'où l'importance d'avoir noté ce qu'on a changé." },
    { type: "vf", q: "La méthode follow-the-path suit le trajet du paquet de la source à la destination pour trouver où il meurt.", a: true, exp: "Vrai : traceroute et ping ciblés localisent le point de rupture le long du chemin." },
    { type: "vf", q: "Corriger au minimum (le plus petit changement qui règle le symptôme) est préférable à une refonte.", a: true, exp: "Vrai : le changement minimal réduit le risque d'effets de bord et se vérifie vite." },
    { type: "input", q: "Quelle commande trace le trajet d'un paquet saut par saut pour localiser où il s'arrête ?", a: ["traceroute", "trace"], ph: "trace…", exp: "traceroute révèle le dernier saut atteint, donc la zone de la panne." },
    { type: "input", q: "Comment appelle-t-on (expression anglaise) le fait de s'enfermer trop longtemps sur un problème ?", a: ["rabbit hole", "rabbit-hole", "trou de lapin"], ph: "rabbit …", exp: "Le rabbit hole : le piège de temps numéro un du labo." },
    { type: "input", q: "Quelle commande affiche la liste des voisins OSPF pour vérifier une adjacence ?", a: ["show ip ospf neighbor", "show ip ospf neighbors", "sh ip ospf nei"], ph: "show ip ospf …", exp: "show ip ospf neighbor confirme (ou non) la présence de l'adjacence attendue." },
    { type: "input", q: "Quel terme (2 mots) désigne la cause unique et profonde derrière plusieurs symptômes ?", a: ["cause racine", "root cause", "causeracine"], ph: "cause …", exp: "La cause racine (root cause) : la régler peut faire tomber plusieurs tickets." }
  ],
  final: {
    title: "Exercice final — Un ticket, 8 minutes au chrono",
    intro: `<p>Ticket : « Le serveur en 10.4.4.10 (derrière R4) est injoignable depuis le client en 10.1.1.10 (derrière R1). Chemin R1-R2-R3-R4, OSPF partout. Tu as 8 minutes. » Applique la boucle isoler / prouver / corriger / vérifier, sans tomber dans le rabbit hole.</p>`,
    questions: [
      { type: "qcm", q: "Premier geste le plus rentable ?", opts: ["Rebooter R2 et R3", "traceroute 10.4.4.10 source 10.1.1.10 pour localiser où ça meurt", "Lire toute la config des 4 routeurs", "Activer debug ip packet partout"], a: 1, exp: "Le traceroute isole immédiatement la zone de rupture : on réduit l'espace du problème." },
      { type: "qcm", q: "Le traceroute s'arrête après R2. Que fais-tu ensuite ?", opts: ["Corriger R1 au hasard", "Vérifier l'adjacence et les routes entre R2 et R3 (show ip ospf neighbor, show ip route)", "Passer au ticket suivant", "Rebooter R4"], a: 1, exp: "On prouve la panne autour du point de rupture (R2-R3) avant d'agir." },
      { type: "vf", q: "Découvrir que 10.4.4.0/24 n'est pas dans la table de R2 oriente vers un problème de propagation OSPF (adjacence, aire ou réseau non annoncé).", a: true, exp: "Vrai : une route absente signale un souci control-plane à prouver (voisin manquant, area/network mal configuré)." },
      { type: "qcm", q: "Tu corriges la cause prouvée. Comment valides-tu ?", opts: ["Tu passes directement au ticket suivant", "Tu rejoues le ping/traceroute qui échouait : il doit maintenant réussir", "Tu supposes que c'est bon", "Tu actives plus de debug"], a: 1, exp: "On vérifie avec le test initial : le symptôme doit disparaître, sans rien casser d'autre." },
      { type: "qcm", q: "À 8 minutes, tu n'as toujours pas trouvé. La bonne décision ?", opts: ["Continuer 20 minutes de plus", "Noter l'état, marquer le ticket et passer, quitte à revenir", "Abandonner l'examen", "Effacer toute la config"], a: 1, exp: "Respecter le budget de temps : marquer et passer protège les points des autres tickets." }
    ],
    solution: `<pre class="pseudo"># Boucle sous chrono (8 min)
# 1. ISOLER
traceroute 10.4.4.10 source 10.1.1.10   ! s'arrete apres R2 -&gt; zone R2-R3
# 2. PROUVER (autour du point de rupture)
show ip route 10.4.4.0                    ! absente sur R2 ? -&gt; probleme control-plane
show ip ospf neighbor                     ! voisin R3 present ? aire correcte ?
show ip ospf interface Gi0/1              ! network/hello/MTU coherents ?
# 3. CORRIGER (minimal, cause prouvee) - ex : reseau non annonce dans OSPF
router ospf 1
 network 10.23.0.0 0.0.0.255 area 0
# 4. VERIFIER
show ip route 10.4.4.0                    ! route apprise ?
ping 10.4.4.10 source 10.1.1.10           ! le test initial doit PASSER
# Budget epuise sans preuve ? -&gt; noter l'etat, marquer, passer, revenir plus tard.</pre>
<p>Isoler d'abord (traceroute), prouver ensuite (show route/neighbor), corriger au minimum, vérifier avec le test qui échouait. Et si le chrono l'exige, marquer et passer : au CCIE, la gestion du temps rapporte autant que la maîtrise technique.</p>`
  }
};
</script>
