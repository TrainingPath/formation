var DAY = {
  num: 28,
  title: "Étude de cas : incident complexe à résoudre",
  subtitle: "Une panne qui traverse plusieurs couches : la méthode bat l'intuition.",
  theory: `
<h3>1. Le scénario : « le site B ne répond plus »</h3>
<p>Un utilisateur du site B ne joint plus une application hébergée au site A. Le ticket est vague : « ça ne marche pas ». En expert, tu sais qu'un tel symptôme peut venir de <strong>n'importe quelle couche</strong> : câble débranché (couche physique), VLAN mal taggé (liaison), route absente (réseau), session BGP tombée (transport de contrôle), ou access-list qui bloque (sécurité). Sans méthode, on tâtonne ; avec méthode, on converge.</p>
<div class="warn">Le piège de l'expert pressé : « supposer » la cause et sauter directement à une hypothèse favorite (ex. « c'est sûrement le BGP »). On perd un temps précieux à corriger ce qui n'était pas cassé.</div>
<h3>2. La démarche structurée : le modèle OSI comme boussole</h3>
<p>La méthode la plus fiable suit le <strong>modèle OSI</strong>, couche par couche, généralement de bas en haut (<em>bottom-up</em>) quand la panne semble matérielle, ou de haut en bas (<em>top-down</em>) quand l'application est en cause. On peut aussi <strong>diviser pour régner</strong> (<em>divide and conquer</em>) : partir d'une couche du milieu (la couche 3, le routage) et remonter ou descendre selon le résultat.</p>
<pre class="pseudo"># Grille de dépannage par couche (bottom-up)
L1 Physique   : câble, interface up/up ?      show ip interface brief
L2 Liaison    : VLAN, trunk, ARP, STP ?       show vlan / show interfaces trunk / show mac address-table
L3 Réseau     : adresse, route présente ?      show ip route / ping / traceroute
   Contrôle   : IGP/BGP voisins établis ?      show ip ospf neighbor / show ip bgp summary
L4-7 + Sécu   : ACL, NAT, pare-feu, appli ?    show access-lists / show ip nat translations</pre>
<h3>3. Isoler : où la connectivité se casse-t-elle ?</h3>
<p>Le geste central du dépannage est l'<strong>isolation</strong>. Avec <code>ping</code> et <code>traceroute</code>, on avance saut par saut jusqu'à trouver l'endroit exact où le paquet meurt. Si le ping fonctionne jusqu'à R2 mais échoue au-delà, la panne est entre R2 et la destination : on a réduit un immense problème à un segment. On teste toujours dans les <strong>deux sens</strong> (aller ET retour), car une route peut exister à l'aller mais manquer au retour — cause classique d'un problème « asymétrique ».</p>
<pre class="pseudo"># Isolation par traceroute
CE-B# traceroute 10.1.1.10
 1  10.2.2.1     2 ms   ← PE2 OK
 2  10.0.0.1     3 ms   ← cœur OK
 3  * * *                ← le paquet meurt ici : panne entre ce saut et la cible
# Conclusion : investiguer le nœud suivant (route retour ? ACL ? interface down ?)</pre>
<h3>4. Formuler et tester une hypothèse à la fois</h3>
<p>Une fois le segment isolé, on émet <strong>une hypothèse vérifiable</strong> et on ne change <strong>qu'une variable à la fois</strong>. Modifier cinq choses d'un coup rend impossible de savoir laquelle a corrigé (ou aggravé) la panne. Après chaque changement, on re-teste. Cette discipline évite d'introduire de nouveaux problèmes en cherchant à réparer l'ancien.</p>
<div class="tip">Documente chaque étape : symptôme observé, hypothèse, action, résultat. Ce journal évite de tourner en rond et sert de preuve de vérification à la fin.</div>
<h3>5. Confirmer la résolution et vérifier l'absence d'effets de bord</h3>
<p>Réparer, ce n'est pas seulement rétablir le ping : c'est <strong>confirmer que l'exigence complète est satisfaite</strong> et que rien d'autre n'a été cassé. Après correction, on rejoue les tests de bout en bout dans les deux sens, on vérifie les tâches voisines, puis on sauvegarde. Un incident bien résolu se prouve, il ne se suppose pas.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Ne jamais 'supposer' la cause : suivre une méthode couche par couche (OSI)
# Approches : bottom-up, top-down, ou divide and conquer (couche 3 d'abord)
# Isoler avec ping / traceroute → trouver le saut exact où le paquet meurt
# Tester dans les DEUX sens (aller/retour) → détecte les routes asymétriques
# Une hypothèse et UNE variable à la fois ; re-tester après chaque changement
# Confirmer l'exigence complète + pas d'effet de bord + sauvegarder</pre>`,
  exercises: [
    { type: "qcm", q: "Face à un symptôme vague (« ça ne marche pas »), quelle est la meilleure première réaction en expert ?", opts: ["Supposer que c'est le BGP et le reconfigurer", "Suivre une méthode structurée, couche par couche", "Redémarrer tous les équipements", "Ignorer le ticket"], a: 1, exp: "On applique une méthode (OSI) plutôt que de sauter à une hypothèse favorite." },
    { type: "qcm", q: "Quel modèle sert de boussole pour dépanner couche par couche ?", opts: ["Le modèle OSI", "Le modèle RGB", "Le modèle client-serveur uniquement", "Le modèle en cascade"], a: 0, exp: "Le modèle OSI structure le diagnostic de la couche physique à l'application." },
    { type: "input", q: "Comment nomme-t-on l'approche qui part d'une couche du milieu et remonte ou descend selon le résultat ? (expression anglaise, 3 mots)", a: ["divide and conquer", "divide-and-conquer", "diviser pour regner", "diviser pour régner"], ph: "expression", exp: "Divide and conquer : on part de la couche 3 et on remonte/descend selon le test." },
    { type: "qcm", q: "Quel est le geste central du dépannage ?", opts: ["Tout reconfigurer", "Isoler l'endroit exact où la connectivité se casse", "Changer les câbles", "Effacer les configs"], a: 1, exp: "L'isolation réduit un grand problème à un segment précis." },
    { type: "qcm", q: "Quelles commandes servent à avancer saut par saut jusqu'au point de rupture ?", opts: ["show vlan et show clock", "ping et traceroute", "reload et erase", "banner et hostname"], a: 1, exp: "ping teste l'accessibilité, traceroute révèle le saut où le paquet meurt." },
    { type: "vf", q: "Il faut toujours tester la connectivité dans les deux sens (aller et retour).", a: true, exp: "Oui : une route peut exister à l'aller mais manquer au retour (problème asymétrique)." },
    { type: "input", q: "Comment qualifie-t-on un problème où la route existe à l'aller mais pas au retour ? (un adjectif)", a: ["asymetrique", "asymétrique", "asymmetric", "routage asymetrique"], ph: "un adjectif", exp: "C'est un routage asymétrique : présent dans un sens, absent dans l'autre." },
    { type: "qcm", q: "Combien de variables faut-il changer à la fois pendant le dépannage ?", opts: ["Autant que possible pour aller vite", "Une seule", "Au moins trois", "Aucune"], a: 1, exp: "Une seule variable à la fois : sinon on ne sait pas ce qui a corrigé la panne." },
    { type: "vf", q: "Changer cinq paramètres d'un coup est efficace car cela couvre plus de causes.", a: false, exp: "Non : on ne saurait pas lequel a agi, et on risque d'introduire de nouveaux bugs." },
    { type: "qcm", q: "Un ping fonctionne jusqu'à R2 puis échoue au-delà. Qu'a-t-on appris ?", opts: ["La panne est chez l'utilisateur", "La panne est localisée entre R2 et la destination", "Tout le réseau est en panne", "Le câble de R1 est coupé"], a: 1, exp: "On a isolé le problème à un segment précis, au-delà de R2." },
    { type: "input", q: "Quelle commande vérifie rapidement l'état up/up des interfaces (couche 1/2) ?", a: ["show ip interface brief", "show ip int brief", "sh ip int br"], ph: "commande IOS", exp: "show ip interface brief révèle une interface down ou sans adresse." },
    { type: "qcm", q: "Après avoir corrigé la panne, que faut-il faire avant de clore l'incident ?", opts: ["Rien, le ping suffit", "Confirmer l'exigence complète, vérifier l'absence d'effet de bord, sauvegarder", "Redémarrer l'équipement", "Supprimer le journal"], a: 1, exp: "Un incident se prouve : test de bout en bout, tâches voisines OK, puis sauvegarde." },
    { type: "vf", q: "Documenter chaque étape (symptôme, hypothèse, action, résultat) aide à ne pas tourner en rond.", a: true, exp: "Oui : le journal de dépannage structure la démarche et prouve la vérification." },
    { type: "qcm", q: "Quelle commande révèle qu'une access-list bloque du trafic (couche sécurité) ?", opts: ["show clock", "show access-lists", "show version", "show hostname"], a: 1, exp: "show access-lists montre les ACL et leurs compteurs de correspondances." },
    { type: "qcm", q: "Quand privilégier l'approche top-down (de l'application vers le physique) ?", opts: ["Quand le câble est coupé", "Quand le symptôme est clairement au niveau applicatif", "Jamais", "Uniquement pour OSPF"], a: 1, exp: "Top-down convient quand l'application est en cause ; bottom-up quand ça sent le matériel." }
  ],
  final: {
    title: "Exercice final — Résoudre l'incident multi-couche",
    intro: `<p>CE-B ne joint pas le serveur 10.1.1.10 du site A. Un traceroute depuis CE-B s'arrête après le cœur : les deux premiers sauts répondent, le troisième donne « * * * ». Applique la démarche structurée.</p>`,
    questions: [
      { type: "qcm", q: "Qu'indique le « * * * » au 3e saut du traceroute ?", opts: ["Le réseau est parfait", "Le paquet meurt à cet endroit : on a isolé le segment fautif", "Le câble de CE-B est coupé", "Le serveur est éteint, c'est certain"], a: 1, exp: "L'isolation localise la rupture : on investigue le nœud suivant." },
      { type: "input", q: "Pour savoir si le problème est un défaut de route retour, que faut-il tester ?", a: ["dans les deux sens", "le retour", "l'aller et le retour", "aller-retour", "les deux sens", "le sens retour"], ph: "quel test ?", exp: "Tester dans les deux sens révèle un éventuel routage asymétrique (retour manquant)." },
      { type: "qcm", q: "Sur le nœud fautif, tu trouves une interface en 'down'. Que fais-tu ?", opts: ["Changer aussi le BGP, l'OSPF et les ACL en même temps", "Corriger UNIQUEMENT l'interface (no shutdown) puis re-tester", "Recharger tous les routeurs", "Effacer la config"], a: 1, exp: "Une variable à la fois : on remonte l'interface, puis on re-teste avant d'aller plus loin." },
      { type: "vf", q: "Une fois le ping rétabli, l'incident est clos sans autre vérification.", a: false, exp: "Non : il faut confirmer l'exigence complète dans les deux sens, vérifier les effets de bord, puis sauvegarder." },
      { type: "qcm", q: "Quelle est la dernière étape d'un incident bien résolu ?", opts: ["Supprimer le journal de dépannage", "Prouver le bout-en-bout, contrôler l'absence d'effet de bord et sauvegarder", "Débrancher les câbles", "Ne rien documenter"], a: 1, exp: "On prouve la résolution complète, on vérifie qu'on n'a rien cassé, puis copy run start." }
    ],
    solution: `<pre class="pseudo"># Résolution structurée de l'incident
1) Symptôme : CE-B → 10.1.1.10 échoue ; traceroute meurt au 3e saut.
2) Isolation : la panne est APRÈS le cœur, sur le nœud suivant le 2e saut.
3) Grille OSI sur ce nœud :
   L1/L2 : show ip interface brief → interface down détectée !
4) Hypothèse : interface down = pas de chemin ; UNE variable :
   interface Gi0/1 → no shutdown
5) Re-test : ping CE-B → 10.1.1.10 dans les DEUX sens (aller et retour)
   + vérifier route retour (routage symétrique)
6) Clôture : confirmer l'exigence, contrôler les tâches voisines,
   copy running-config startup-config, documenter le journal.</pre>
<p>La panne semblait « complexe et multi-couche », mais la méthode l'a réduite à une interface down. L'expertise CCIE, c'est cette <strong>discipline</strong> : isoler, une hypothèse à la fois, tester dans les deux sens, prouver la résolution.</p>`
  }
};
</script>
