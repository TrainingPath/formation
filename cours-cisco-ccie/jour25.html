<script>
var DAY = {
  num: 25,
  title: "La gestion du temps le jour du labo",
  subtitle: "Huit heures, pas une minute de plus : ta vraie épreuve, c'est l'horloge.",
  theory: `
<h3>1. Une course contre la montre, pas contre la difficulté</h3>
<p>Le labo CCIE dure <strong>8 heures</strong> et se déroule en deux grands modules qui se suivent : d'abord le module <strong>Design</strong> (environ 3 heures), puis un module combiné <strong>Deploy, Operate and Optimize</strong> (environ 5 heures). Beaucoup de candidats connaissent parfaitement OSPF, BGP ou MPLS et échouent malgré tout, non par manque de savoir mais par mauvaise <strong>gestion du temps</strong> (en anglais <em>time management</em>). Le labo est calibré pour être trop long à finir en flânant : chaque minute perdue sur une tâche mineure est une tâche majeure non traitée.</p>
<p>Pense au labo comme à un marathon chronométré, pas à un sprint : tu ne gagnes pas en courant plus vite sur les premiers kilomètres, mais en tenant un rythme régulier et en refusant de t'épuiser sur un obstacle isolé.</p>
<h3>2. Le module Design : lire, décider, justifier</h3>
<p>Le module <strong>Design</strong> ne se configure pas sur des équipements : il évalue ta capacité à analyser des besoins, choisir une architecture, comparer des options et justifier des décisions à partir de documents (schémas, e-mails, contraintes client). Le piège classique est de vouloir « configurer » alors qu'on te demande de <strong>raisonner</strong>. Réserve un budget de temps ferme à ce module et n'y reviens pas : une fois le module Design terminé, tu passes au reste et tu ne peux plus y revenir.</p>
<div class="tip">Sur le Design, lis toutes les pièces jointes AVANT de répondre : une contrainte cachée dans un e-mail peut invalider la solution qui semblait évidente au premier schéma.</div>
<h3>3. Le module Deploy / Operate / Optimize : découper et prioriser</h3>
<p>Ce module vaut le plus de points et t'occupe environ 5 heures. La bonne méthode tient en trois gestes. D'abord, <strong>survoler l'ensemble</strong> des tâches (10 à 15 minutes) pour repérer les dépendances : une tâche de sous-couche (adressage, IGP) conditionne souvent des tâches ultérieures (BGP, MPLS, services). Ensuite, <strong>attaquer les tâches à fort rendement</strong> d'abord — beaucoup de points, faible risque — avant les tâches coûteuses en temps. Enfin, <strong>time-boxer</strong> : fixe un plafond de temps par tâche et, s'il est dépassé, marque la tâche et passe à la suivante.</p>
<pre class="pseudo"># Répartition indicative sur 8 heures
Design                 ~3 h   (raisonner, choisir, justifier - pas de config)
Deploy / Operate / Optimize  ~5 h
  ├─ Survol + repérage des dépendances   10-15 min
  ├─ Sous-couche (adressage, IGP)        priorité 1 (débloque le reste)
  ├─ Services (BGP, MPLS, redistribution) priorité 2
  ├─ Optimisation / sécurité / fine-tuning priorité 3
  └─ Vérification finale + relecture      30-45 min réservées</pre>
<h3>4. Le budget de vérification, non négociable</h3>
<p>Une configuration qui « a l'air bonne » ne rapporte rien : seul le comportement vérifié compte. Réserve donc, dès le départ, un bloc de <strong>30 à 45 minutes en fin de module</strong> pour re-tester chaque exigence avec des commandes de contrôle (<code>show</code>, <code>ping</code>, <code>traceroute</code>). Ce budget ne se dépense jamais ailleurs, même si tu es en retard : mieux vaut cinq tâches vérifiées que huit tâches douteuses.</p>
<div class="warn">Ne reste jamais bloqué plus que ton plafond sur une tâche. Une tâche à 3 points qui t'engloutit 40 minutes te coûte deux autres tâches. Marque, avance, reviens à la fin s'il reste du temps.</div>
<h3>5. Rythme, énergie et sauvegardes</h3>
<p>Huit heures d'attention soutenue épuisent. Prends de courtes respirations mentales entre les tâches, hydrate-toi, et <strong>sauvegarde régulièrement</strong> tes configurations. Note sur un brouillon les tâches laissées de côté pour ne pas les oublier lors de la relecture. La régularité bat toujours la précipitation.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Le vrai adversaire du labo = l'horloge, pas la théorie
# Design (~3h) : raisonner/justifier, pas de config, sans retour arrière
# Deploy/Operate/Optimize (~5h) : survol → dépendances → priorités → time-box
# Ordre : sous-couche d'abord (adressage, IGP), puis services, puis optimisation
# Réserver 30-45 min de VÉRIFICATION intouchables en fin de module
# Bloqué ? Plafond atteint → marquer, avancer, revenir à la fin</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la durée du labo CCIE ?", opts: ["4 heures", "6 heures", "8 heures", "12 heures"], a: 2, exp: "Le labo CCIE dure 8 heures au total." },
    { type: "qcm", q: "Dans quel ordre s'enchaînent les modules du labo ?", opts: ["Deploy puis Design", "Design puis Deploy/Operate/Optimize", "Optimize puis Design", "Operate puis Design"], a: 1, exp: "On commence par le module Design, puis le module combiné Deploy/Operate/Optimize." },
    { type: "vf", q: "On peut revenir au module Design après avoir commencé le module Deploy/Operate/Optimize.", a: false, exp: "Non : une fois le module Design terminé, il n'y a pas de retour arrière." },
    { type: "qcm", q: "Le module Design évalue avant tout ta capacité à…", opts: ["Taper des configurations vite", "Raisonner, choisir et justifier une architecture", "Câbler des équipements", "Mémoriser des adresses IP"], a: 1, exp: "Le Design ne se configure pas : il teste l'analyse, le choix et la justification." },
    { type: "input", q: "Quelle technique consiste à fixer un plafond de temps par tâche et à passer à la suite s'il est dépassé ? (terme en deux mots, tiret accepté)", a: ["time-box", "timebox", "time boxing", "time-boxing", "timeboxing", "time box"], ph: "terme anglais", exp: "Le time-boxing : un plafond par tâche pour ne jamais s'enliser." },
    { type: "qcm", q: "Quelle catégorie de tâches faut-il traiter en priorité dans Deploy/Operate/Optimize ?", opts: ["L'optimisation fine", "La sous-couche : adressage et IGP", "La sécurité avancée", "La télémétrie"], a: 1, exp: "La sous-couche (adressage, IGP) débloque les tâches suivantes : c'est la priorité 1." },
    { type: "vf", q: "Une configuration qui semble correcte rapporte des points même sans vérification.", a: false, exp: "Non : seul le comportement vérifié compte. D'où le budget de vérification." },
    { type: "input", q: "Combien de temps, environ, faut-il réserver à la vérification finale (en minutes, plage) ?", a: ["30-45", "30 à 45", "30-45 min", "30 a 45", "3045"], ph: "ex : 30-45", exp: "On réserve 30 à 45 minutes intouchables pour re-tester chaque exigence." },
    { type: "qcm", q: "Que faire d'une tâche qui dépasse largement son plafond de temps ?", opts: ["S'acharner jusqu'à la finir", "La marquer, avancer, y revenir à la fin s'il reste du temps", "L'abandonner définitivement", "Recommencer tout le module"], a: 1, exp: "Marquer, avancer, revenir plus tard : on ne sacrifie pas deux tâches pour une." },
    { type: "qcm", q: "Environ combien de temps dure le module Deploy/Operate/Optimize ?", opts: ["1 heure", "3 heures", "5 heures", "8 heures"], a: 2, exp: "Environ 5 heures pour ce module, contre ~3 h pour le Design." },
    { type: "vf", q: "Survoler l'ensemble des tâches avant de commencer aide à repérer les dépendances.", a: true, exp: "Oui : un survol de 10 à 15 minutes révèle l'ordre logique des tâches." },
    { type: "input", q: "Quelle commande IOS de base sert à vérifier l'accessibilité de bout en bout d'une adresse ?", a: ["ping", "ping ip"], ph: "commande IOS", exp: "ping teste l'accessibilité ; traceroute révèle le chemin." },
    { type: "qcm", q: "Pourquoi lire toutes les pièces jointes du Design avant de répondre ?", opts: ["Pour gagner du temps de câblage", "Parce qu'une contrainte cachée peut invalider la solution évidente", "Parce que c'est obligatoire de tout imprimer", "Pour recopier les schémas"], a: 1, exp: "Une contrainte dissimulée dans un e-mail change souvent la bonne réponse." },
    { type: "vf", q: "Sauvegarder régulièrement ses configurations pendant le labo est une bonne pratique.", a: true, exp: "Oui : cela protège contre les pertes et fait partie de la discipline du labo." },
    { type: "qcm", q: "Quel est le vrai adversaire du candidat le jour du labo ?", opts: ["La difficulté théorique", "L'horloge et la gestion du temps", "Le matériel", "Le nombre de câbles"], a: 1, exp: "Le labo est calibré long : la gestion du temps départage plus que la théorie." }
  ],
  final: {
    title: "Exercice final — Planifier ses 8 heures",
    intro: `<p>Tu ouvres ton labo à 9h00. Il comporte un module Design puis un module Deploy/Operate/Optimize riche en tâches (adressage, OSPF, BGP, MPLS L3VPN, redistribution, puis QoS et durcissement). Établis un plan de bataille horaire.</p>`,
    questions: [
      { type: "qcm", q: "Par quel module commences-tu et pour combien de temps environ ?", opts: ["Deploy, ~5 h", "Design, ~3 h", "Optimize, ~1 h", "Peu importe l'ordre"], a: 1, exp: "Le Design d'abord, environ 3 heures, sans retour arrière ensuite." },
      { type: "qcm", q: "Dans le module Deploy, par quoi attaques-tu concrètement ?", opts: ["La QoS fine", "L'adressage et l'IGP (sous-couche)", "Le durcissement final", "La télémétrie"], a: 1, exp: "La sous-couche débloque BGP, MPLS et les services : priorité 1." },
      { type: "input", q: "Une tâche BGP te retient 35 minutes alors que ton plafond était 15. Que fais-tu ? (un verbe)", a: ["marquer", "je la marque", "passer", "avancer", "marque", "je passe", "je marque et j'avance", "skip"], ph: "un verbe", exp: "Tu marques la tâche et tu avances : ne pas sacrifier deux tâches pour une." },
      { type: "vf", q: "Comme tu es en retard, tu supprimes le bloc de vérification finale pour gagner du temps.", a: false, exp: "Non : le budget de vérification (30-45 min) est intouchable ; il valide tes points." },
      { type: "qcm", q: "Il reste 40 minutes avant la fin. Quelle est la meilleure décision ?", opts: ["Commencer une grosse tâche neuve", "Vérifier les exigences déjà traitées et corriger les erreurs", "Recommencer le Design", "Éteindre les équipements"], a: 1, exp: "En fin de labo, la vérification et la correction rapportent plus qu'une tâche neuve non testée." }
    ],
    solution: `<pre class="pseudo"># Plan de bataille sur 8 heures (départ 9h00)
09h00-12h00  Design (~3h) : lire TOUTES les pièces, raisonner, justifier
12h00-12h15  Survol Deploy/Operate/Optimize : repérer les dépendances
12h15-...    Sous-couche : adressage + OSPF (priorité 1, débloque tout)
             puis BGP, MPLS L3VPN, redistribution (priorité 2)
             puis QoS + durcissement (priorité 3, si le temps le permet)
Time-box chaque tâche : plafond dépassé → marquer, avancer
Dernières 30-45 min : VÉRIFICATION (show / ping / traceroute) intouchable</pre>
<p>La clé n'est pas de tout finir, mais de sécuriser un maximum de tâches <strong>vérifiées</strong>. Régularité, priorités, time-box et vérification : voilà ce qui fait passer le labo.</p>`
  }
};
</script>
