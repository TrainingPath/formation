<script>
var DAY = {
  num: 26,
  title: "Les erreurs classiques et pièges du labo",
  subtitle: "La plupart des points perdus ne viennent pas d'un manque de savoir, mais d'inattention.",
  theory: `
<h3>1. Le premier piège : lire trop vite les consignes</h3>
<p>La cause numéro un d'échec au labo n'est pas la difficulté technique : c'est la <strong>mauvaise lecture des consignes</strong> (en anglais <em>requirements</em>). Une exigence précise « sans utiliser de route statique », « uniquement en IPv6 », « avec exactement deux voisins », et le candidat pressé configure une solution qui marche… mais qui ne respecte pas la contrainte. Une tâche techniquement fonctionnelle mais hors consigne rapporte <strong>zéro point</strong>. Lis chaque énoncé deux fois et surligne les mots-clés restrictifs : <em>only</em>, <em>must not</em>, <em>without</em>, <em>exactly</em>.</p>
<div class="tip">Reformule mentalement chaque tâche en « ce que je dois obtenir » ET « ce que je n'ai pas le droit de faire ». Les deux comptent pour la notation.</div>
<h3>2. Le piège des dépendances entre tâches</h3>
<p>Les tâches d'un labo ne sont pas indépendantes : elles forment une <strong>chaîne de dépendances</strong>. Si l'adressage IP est faux, l'IGP ne converge pas ; si l'IGP est cassé, les voisinages BGP ne montent pas ; si BGP est cassé, le L3VPN MPLS ne transporte rien. Une seule erreur en amont fait échouer une cascade de tâches en aval — et tu perds beaucoup de points pour une petite faute. D'où la règle : <strong>stabiliser et vérifier la sous-couche avant de bâtir dessus</strong>.</p>
<pre class="pseudo"># Chaîne typique de dépendances (une erreur en haut casse tout en bas)
Adressage IP  →  IGP (OSPF/EIGRP)  →  BGP  →  MPLS L3VPN  →  Services (QoS, etc.)
# Vérifie chaque étage AVANT de monter à l'étage supérieur.</pre>
<h3>3. Les fautes de configuration qui piègent tout le monde</h3>
<p>Certaines erreurs reviennent sans cesse : oublier un <code>no shutdown</code> sur une interface, se tromper de <strong>wildcard mask</strong> OSPF, poser un <code>network</code> BGP sans route correspondante dans la table, inverser une <em>access-list</em>, oublier <code>switchport trunk allowed vlan</code>, ou négliger l'<strong>ordre des séquences</strong> dans une route-map. Beaucoup ne coûteraient rien si elles étaient détectées : c'est la vérification qui les rattrape.</p>
<div class="warn">Attention à la sauvegarde : une config parfaite en mémoire vive (running-config) mais jamais copiée dans la config de démarrage (startup-config) peut disparaître. Fais <code>copy running-config startup-config</code> régulièrement.</div>
<h3>4. La vérification systématique : ton filet de sécurité</h3>
<p>La discipline qui sauve, c'est de <strong>vérifier chaque tâche juste après l'avoir faite</strong>, avec les commandes de contrôle, plutôt que de tout tester à la fin. On appelle cela le principe « configure puis prouve ». Le tableau ci-dessous liste les commandes réflexes :</p>
<pre class="pseudo"># Boîte à outils de vérification (réflexes)
show ip interface brief        # interfaces up/up et adresses
show ip ospf neighbor          # voisinages OSPF établis
show ip bgp summary            # sessions BGP + préfixes reçus
show ip route                  # table de routage réelle
show mpls forwarding-table     # labels MPLS distribués
ping / traceroute              # accessibilité et chemin de bout en bout</pre>
<h3>5. Les pièges psychologiques et de temps</h3>
<p>Deux ennemis invisibles : la <strong>panique</strong> (qui pousse à retaper au hasard) et l'<strong>entêtement</strong> (rester bloqué une heure sur une tâche mineure). La parade est méthodique : quand une tâche résiste, on isole le problème couche par couche (physique, liaison, réseau…) au lieu de tout retaper. Et si le plafond de temps est atteint, on marque la tâche et on avance. Enfin, <strong>ne casse pas ce qui marche</strong> : une « amélioration » de dernière minute non vérifiée peut faire échouer une tâche déjà réussie.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Piège n°1 : lire trop vite → une tâche hors consigne = 0 point
# Repère les mots restrictifs : only / must not / without / exactly
# Dépendances : adressage → IGP → BGP → MPLS → services (vérifie chaque étage)
# Fautes fréquentes : no shutdown oublié, wildcard OSPF, ACL inversée, ordre route-map
# Vérifie chaque tâche APRÈS l'avoir faite (configure puis prouve)
# Sauvegarde : copy running-config startup-config
# Ne panique pas, ne t'entête pas, ne casse pas ce qui marche déjà</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la cause numéro un d'échec au labo CCIE ?", opts: ["Le manque de connaissances théoriques", "La mauvaise lecture des consignes", "Un matériel défaillant", "Le trac"], a: 1, exp: "La plupart des points perdus viennent d'une lecture trop rapide des consignes." },
    { type: "vf", q: "Une tâche techniquement fonctionnelle mais qui ne respecte pas la contrainte rapporte quand même des points.", a: false, exp: "Non : hors consigne = 0 point, même si la solution fonctionne." },
    { type: "input", q: "Cite un mot-clé anglais restrictif à surligner dans une consigne (un seul).", a: ["only", "must not", "without", "exactly", "must"], ph: "un mot anglais", exp: "only, must not, without, exactly : ces mots changent la solution attendue." },
    { type: "qcm", q: "Pourquoi une seule erreur d'adressage peut faire perdre beaucoup de points ?", opts: ["Parce que l'adressage vaut le plus de points", "À cause de la chaîne de dépendances : elle casse l'IGP, puis BGP, puis MPLS", "Parce que l'examinateur pénalise l'adressage", "Parce que l'adressage est noté deux fois"], a: 1, exp: "Les tâches sont enchaînées : une faute en amont casse une cascade en aval." },
    { type: "qcm", q: "Dans la chaîne de dépendances, qu'est-ce qui doit fonctionner AVANT que BGP monte ses voisinages ?", opts: ["Le MPLS L3VPN", "La QoS", "L'IGP et l'adressage", "La télémétrie"], a: 2, exp: "Adressage → IGP → BGP : la sous-couche conditionne les voisinages BGP." },
    { type: "input", q: "Quelle commande IOS active une interface administrativement désactivée ?", a: ["no shutdown", "no shut"], ph: "commande IOS", exp: "no shutdown : oublier cette commande est une faute très fréquente." },
    { type: "vf", q: "Il vaut mieux vérifier chaque tâche juste après l'avoir configurée plutôt que tout tester à la fin.", a: true, exp: "Oui : le principe « configure puis prouve » attrape les erreurs au plus tôt." },
    { type: "qcm", q: "Quelle commande vérifie l'état des voisinages OSPF ?", opts: ["show ip bgp summary", "show ip ospf neighbor", "show mpls forwarding-table", "show running-config"], a: 1, exp: "show ip ospf neighbor liste les voisins OSPF et leur état." },
    { type: "qcm", q: "Une erreur classique sur OSPF concerne souvent…", opts: ["Le masque générique (wildcard mask)", "La description de l'interface", "Le nom d'hôte", "La bannière de connexion"], a: 0, exp: "Un wildcard mask erroné empêche l'interface d'être annoncée dans la bonne aire." },
    { type: "input", q: "Quelle commande copie la configuration active vers la configuration de démarrage ?", a: ["copy running-config startup-config", "copy run start", "copy running startup", "wr", "write memory", "write"], ph: "commande IOS", exp: "copy running-config startup-config (ou write) sauvegarde durablement." },
    { type: "vf", q: "Une config présente uniquement dans la running-config peut être perdue si elle n'est pas sauvegardée.", a: true, exp: "Oui : sans copie vers la startup-config, un rechargement l'efface." },
    { type: "qcm", q: "Que faut-il éviter dans les dernières minutes du labo ?", opts: ["Vérifier les tâches faites", "Introduire une « amélioration » non vérifiée qui casse ce qui marche", "Sauvegarder la config", "Relire les consignes"], a: 1, exp: "Ne casse pas ce qui marche : une modif de dernière minute non testée est risquée." },
    { type: "qcm", q: "Face à une tâche qui résiste, la bonne démarche est de…", opts: ["Tout retaper au hasard en panique", "Isoler le problème couche par couche", "Passer directement à la tâche suivante sans noter", "Redémarrer tous les équipements"], a: 1, exp: "On isole méthodiquement (physique, liaison, réseau…) au lieu de retaper à l'aveugle." },
    { type: "input", q: "Quelle commande affiche rapidement l'état up/up et les adresses de toutes les interfaces ?", a: ["show ip interface brief", "show ip int brief", "sh ip int br"], ph: "commande IOS", exp: "show ip interface brief donne une vue synthétique des interfaces." },
    { type: "vf", q: "S'entêter une heure sur une tâche mineure est une bonne stratégie de temps.", a: false, exp: "Non : l'entêtement fait perdre d'autres tâches. On marque et on avance." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer les pièges",
    intro: `<p>Un candidat a « fini » plusieurs tâches mais son labo échoue à la vérification. Une exigence disait : « établir la connectivité entre R1 et R3 <strong>sans route statique</strong> ». Il a pourtant obtenu la connectivité avec une route statique. Aide-le à comprendre.</p>`,
    questions: [
      { type: "qcm", q: "Combien de points rapporte sa solution ?", opts: ["Tous, la connectivité marche", "Zéro, car la contrainte « sans route statique » n'est pas respectée", "La moitié", "Cela dépend de l'examinateur"], a: 1, exp: "Hors consigne = 0 point, même si le ping passe." },
      { type: "vf", q: "Le problème vient d'un manque de connaissances techniques.", a: false, exp: "Non : la connectivité fonctionne. Le problème est la lecture de la consigne." },
      { type: "input", q: "Quel mot-clé de la consigne aurait dû l'alerter ? (deux mots)", a: ["sans route statique", "sans", "without", "no static", "sans statique"], ph: "mot-clé", exp: "« sans route statique » impose une solution dynamique (IGP ou BGP)." },
      { type: "qcm", q: "Une autre tâche BGP échoue aussi. Quelle vérification faire d'abord ?", opts: ["show ip bgp summary pour l'état des sessions", "Rien, refaire toute la config", "Changer le nom d'hôte", "Débrancher les câbles"], a: 0, exp: "show ip bgp summary révèle si les sessions montent et si des préfixes arrivent." },
      { type: "qcm", q: "Quelle leçon générale retenir de ce labo raté ?", opts: ["Configurer plus vite", "Lire les consignes deux fois et vérifier chaque tâche après l'avoir faite", "Ignorer les mots restrictifs", "Ne jamais sauvegarder"], a: 1, exp: "Lecture attentive + vérification systématique : le duo qui sauve des points." }
    ],
    solution: `<pre class="pseudo"># Anatomie de l'échec
Symptôme  : le ping R1→R3 passe, mais 0 point à la tâche.
Cause     : contrainte « sans route statique » ignorée (mauvaise lecture).
# Ce qu'il fallait faire :
# 1) Surligner « sans route statique » → solution dynamique obligatoire.
# 2) Utiliser un IGP (OSPF/EIGRP) ou BGP pour apprendre la route de R3.
# 3) Vérifier : show ip route (route apprise dynamiquement, pas 'S' statique).
# 4) Prouver : ping R1→R3 ET show pour confirmer l'origine dynamique.</pre>
<p>Le savoir était là ; c'est la <strong>rigueur de lecture</strong> et la <strong>vérification</strong> qui manquaient. Au labo, on gagne des points en évitant les pièges autant qu'en maîtrisant les protocoles.</p>`
  }
};
</script>
