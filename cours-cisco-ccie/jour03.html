  subtitle: "Un seul titre, plusieurs spécialités : choisir son terrain d'expertise.",
  theory: `
<h3>1. Un CCIE, plusieurs pistes</h3>
<p>Le CCIE n'est pas monolithique : c'est une <strong>famille de pistes</strong> (en anglais <em>tracks</em>), chacune ciblant un domaine d'expertise. Tu ne passes pas « le CCIE » en général, tu passes le CCIE d'<strong>une piste précise</strong>. Le titre, le numéro et le prestige sont communs ; le contenu technique, lui, est propre à la piste.</p>
<p>Analogie : la médecine délivre un même diplôme de docteur, mais on se spécialise (cardiologie, chirurgie…). Le CCIE fonctionne pareil : même sommet, spécialités différentes.</p>
<h3>2. Les pistes actuelles</h3>
<pre class="pseudo"># Pistes CCIE actuelles :
CCIE Enterprise Infrastructure  -&gt; coeur du reseau d'entreprise :
     routage/commutation, WAN, SD-WAN, services IP
CCIE Enterprise Wireless        -&gt; conception et exploitation
     des reseaux sans-fil d'entreprise (Wi-Fi)
CCIE Security                   -&gt; pare-feux, VPN, controle d'acces,
     securite des infrastructures
CCIE Data Center                -&gt; commutation datacenter (Nexus),
     stockage, calcul, automatisation, fabric
CCIE Service Provider           -&gt; reseaux des operateurs :
     MPLS, BGP a grande echelle, coeur SP
CCIE Collaboration              -&gt; voix, video, messagerie,
     communications unifiees (UC)</pre>
<div class="tip">La piste <strong>Enterprise Infrastructure</strong> est la plus « généraliste » et la plus courante comme premier CCIE : elle capitalise directement sur les fondamentaux de routage et de commutation. C'est aussi la piste dont ce cours prépare le socle (OSPF, EIGRP, BGP, redistribution).</p></div>
<h3>3. Comment choisir sa piste ?</h3>
<p>Le bon critère n'est pas « laquelle est la plus prestigieuse » — elles partagent le même prestige — mais « laquelle correspond à <strong>ton métier</strong> et à <strong>tes projets</strong> ». Trois questions utiles : sur quelles technologies travailles-tu déjà au quotidien ? Vers quel type de poste veux-tu évoluer ? Quel environnement te motive (entreprise, opérateur, datacenter, sécurité, sans-fil, collaboration) ?</p>
<p>Un ingénieur qui opère un cœur de réseau d'entreprise s'orientera naturellement vers <strong>Enterprise Infrastructure</strong> ; celui qui travaille chez un opérateur télécom vers <strong>Service Provider</strong> ; un spécialiste pare-feu/VPN vers <strong>Security</strong> ; un architecte de datacenter vers <strong>Data Center</strong>.</p>
<div class="warn">Ne choisis pas une piste juste parce qu'elle « a l'air rare ». Une piste éloignée de ton travail quotidien te prive de la pratique de terrain qui alimente la préparation. La meilleure piste est celle que tu peux <strong>manipuler tous les jours</strong>.</p></div>
<h3>4. Cumuler et évoluer</h3>
<p>Rien n'empêche de viser plusieurs pistes au fil de la carrière : elles s'ajoutent à un <strong>même numéro CCIE</strong>. Beaucoup d'experts commencent par Enterprise Infrastructure puis élargissent (Security, Service Provider…). Chaque piste additionnelle démontre une largeur d'expertise, sans jamais dupliquer le numéro.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Pistes CCIE actuelles :
#  - Enterprise Infrastructure (routage/commutation, WAN, SD-WAN)

#  - Collaboration             (voix, video, UC)

# Cumul possible : plusieurs pistes -&gt; un seul numero CCIE.</pre>`,

    { type: "qcm", q: "Un ingénieur opérant chez un fournisseur d'accès télécom s'orientera vers…", opts: ["Enterprise Wireless", "Collaboration", "Service Provider", "Data Center"], a: 2, exp: "Le cœur opérateur (MPLS, BGP à grande échelle) relève de Service Provider." },
    { type: "qcm", q: "Le socle technique préparé par ce cours (OSPF, EIGRP, BGP, redistribution) sert d'abord quelle piste ?", opts: ["Collaboration", "Enterprise Infrastructure", "Data Center", "Enterprise Wireless"], a: 1, exp: "Ce socle de routage alimente directement Enterprise Infrastructure." },
    { type: "input", q: "Combien de pistes CCIE sont citées dans cette leçon ? (un chiffre)", a: ["6", "six"], ph: "nombre", exp: "Six : Enterprise Infrastructure, Enterprise Wireless, Security, Data Center, Service Provider, Collaboration." },
    { type: "qcm", q: "Quelle question guide le mieux le choix d'une piste ?", opts: ["Laquelle a le plus beau logo ?", "Sur quelles technologies je travaille et vers quel poste je veux évoluer ?", "Laquelle est la plus ancienne ?", "Laquelle a le nom le plus court ?"], a: 1, exp: "Le choix se fonde sur ton métier actuel et tes objectifs de carrière." }
  ],

      { type: "qcm", q: "Sami administre le cœur routage/commutation et le WAN d'une grande entreprise. Piste ?", opts: ["Collaboration", "Enterprise Infrastructure", "Data Center", "Enterprise Wireless"], a: 1, exp: "Cœur d'entreprise = Enterprise Infrastructure." },
