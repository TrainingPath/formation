var DAY = {

  title: "Projet final : concevoir et valider une architecture experte",
  subtitle: "Le grand oral : rassembler concevoir, sécuriser, automatiser et valider en une seule architecture.",
  theory: `
<h3>1. Le projet : une entreprise multi-sites de bout en bout</h3>
<p>Voici l'aboutissement de tout le parcours Cisco. Une entreprise possède un <strong>siège</strong>, deux <strong>sites régionaux</strong> et des <strong>télétravailleurs</strong>. Elle veut une architecture <strong>de bout en bout</strong> (en anglais <em>end-to-end</em>) : robuste, sécurisée, automatisée et surtout <strong>vérifiée</strong>. Ton rôle d'architecte CCIE est de tout assembler — routage, WAN, sécurité, automatisation, télémétrie — en un ensemble cohérent, exactement comme le module <strong>Design</strong> puis <strong>Deploy/Operate/Optimize</strong> du labo l'exigent.</p>
<pre class="pseudo"># Vue d'ensemble de l'architecture cible
        [Siège / Data Center]
        Cœur OSPF + BGP, services, sécurité
              │  WAN (SD-WAN / MPLS)
     ┌────────┴─────────┐
 [Site régional 1]  [Site régional 2]     +  [Télétravailleurs (VPN)]
 accès SD-Access     accès SD-Access
# Quatre piliers : Concevoir · Sécuriser · Automatiser · Valider</pre>
<h3>2. Concevoir : la structure avant la configuration</h3>
<p>On commence toujours par le <strong>design</strong>, pas par la ligne de commande. On définit un <strong>plan d'adressage IP</strong> hiérarchique et résumable, on choisit les protocoles (<strong>OSPF</strong> comme IGP interne, <strong>BGP</strong> pour l'interconnexion et le WAN), on planifie la <strong>segmentation</strong> (VLAN/VRF par usage), la <strong>redondance</strong> (liens et équipements en double, HSRP/convergence rapide) et le <strong>WAN</strong> (SD-WAN pour piloter plusieurs transports, ou MPLS L3VPN). Un bon design est <strong>modulaire</strong> : chaque brique peut évoluer sans casser les autres.</p>
<div class="tip">Justifie chaque choix par un besoin (coût, résilience, sécurité, évolutivité). Le module Design du labo note le raisonnement autant que la solution.</div>
<h3>3. Sécuriser : défendre chaque plan</h3>
<p>La sécurité n'est pas une option ajoutée à la fin : elle traverse toute l'architecture. On protège le <strong>plan de gestion</strong> (SSH au lieu de Telnet, AAA, rôles), le <strong>plan de contrôle</strong> (authentification des protocoles OSPF/BGP, CoPP pour limiter le trafic vers le CPU) et le <strong>plan de données</strong> (ACL, segmentation, chiffrement des VPN pour les télétravailleurs). On applique le principe du <strong>moindre privilège</strong> et de la <strong>défense en profondeur</strong>.</p>
<pre class="pseudo"># Sécuriser les trois plans
Gestion : ssh only, aaa, comptes nominatifs, logging
Contrôle: authentification OSPF/BGP, CoPP (Control Plane Policing)
Données : ACL, segmentation VRF/VLAN, VPN chiffré (télétravail)
# Principe : moindre privilège + défense en profondeur</pre>
<h3>4. Automatiser et valider : la marque de l'expert</h3>
<p>Un réseau expert se <strong>déploie et se contrôle par le code</strong>. On automatise avec <strong>Python</strong> et des outils comme <strong>Ansible</strong>, on décrit la configuration via des modèles <strong>YANG</strong> poussés en <strong>NETCONF/RESTCONF</strong>, et on surveille l'état en continu grâce à la <strong>télémétrie</strong> (streaming telemetry, gNMI). Mais rien n'est terminé sans <strong>validation</strong> : chaque exigence doit être <strong>prouvée</strong> par des tests (show, ping, traceroute, tests automatisés). C'est le fil rouge de tout le parcours : <em>configure puis prouve</em>, de bout en bout, dans les deux sens.</p>
<pre class="pseudo"># Automatiser & valider
Automatiser : Python, Ansible, YANG + NETCONF/RESTCONF
Observer    : télémétrie streaming, gNMI, journaux
Valider     : show / ping / traceroute + tests automatisés
              chaque exigence PROUVÉE (aller ET retour)</pre>
<div class="warn">Un projet non validé n'existe pas. Réserve, comme au labo, un temps ferme de vérification de bout en bout : c'est la preuve que l'architecture répond réellement au besoin.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Projet final = synthèse : Concevoir · Sécuriser · Automatiser · Valider
# Concevoir  : adressage hiérarchique, OSPF+BGP, segmentation, redondance, WAN (SD-WAN/MPLS)
#              design MODULAIRE, chaque choix justifié par un besoin
# Sécuriser  : 3 plans (gestion/contrôle/données), moindre privilège, défense en profondeur
# Automatiser: Python, Ansible, YANG+NETCONF/RESTCONF, télémétrie/gNMI
# Valider    : configure puis prouve — show/ping/traceroute, tests, aller ET retour
# Méthode labo : Design d'abord, puis Deploy/Operate/Optimize, time-box + vérif finale</pre>`,
  exercises: [
    { type: "qcm", q: "Quels sont les quatre piliers du projet final ?", opts: ["Câbler, configurer, documenter, archiver", "Concevoir, sécuriser, automatiser, valider", "Planifier, acheter, installer, facturer", "Superviser, sauvegarder, mettre à jour, auditer"], a: 1, exp: "Concevoir, sécuriser, automatiser et valider : la synthèse du parcours Cisco." },
    { type: "vf", q: "On commence un projet expert par la configuration, avant de penser au design.", a: false, exp: "Non : on conçoit d'abord (adressage, protocoles, segmentation), puis on configure." },

    { type: "input", q: "Quelle qualité d'un design permet de faire évoluer une brique sans casser les autres ? (un adjectif)", a: ["modulaire", "modularite", "modularité", "modulaire"], ph: "un adjectif", exp: "Un design modulaire isole les briques et facilite l'évolution." },
    { type: "qcm", q: "La sécurité dans une architecture experte doit être…", opts: ["Ajoutée seulement à la fin", "Présente sur toute l'architecture (gestion, contrôle, données)", "Réservée au data center", "Facultative"], a: 1, exp: "La sécurité traverse les trois plans : gestion, contrôle, données." },
    { type: "qcm", q: "Comment protège-t-on le plan de gestion des équipements ?", opts: ["Telnet en clair", "SSH, AAA, comptes nominatifs, journalisation", "Aucun mot de passe", "En désactivant les logs"], a: 1, exp: "SSH (pas Telnet), AAA, comptes nominatifs et logging sécurisent le plan de gestion." },
    { type: "input", q: "Quel mécanisme limite le trafic envoyé vers le CPU pour protéger le plan de contrôle ? (sigle 4 lettres)", a: ["copp", "control plane policing", "control-plane policing"], ph: "sigle", exp: "CoPP (Control Plane Policing) protège le CPU du plan de contrôle." },
    { type: "vf", q: "Le principe du moindre privilège et la défense en profondeur guident la sécurisation.", a: true, exp: "Oui : n'accorder que le nécessaire et empiler les protections." },

    { type: "input", q: "Quel langage de modélisation décrit la configuration, poussé via NETCONF/RESTCONF ? (4 lettres)", a: ["yang", "modele yang", "modèle yang"], ph: "sigle", exp: "YANG modélise les données de configuration, transportées par NETCONF/RESTCONF." },
    { type: "qcm", q: "Comment surveille-t-on l'état du réseau en continu, de façon moderne ?", opts: ["Par des captures d'écran manuelles", "Par la télémétrie (streaming telemetry, gNMI)", "En lisant les logs à la main chaque jour", "Avec des pings ponctuels manuels"], a: 1, exp: "La télémétrie streaming (gNMI) fournit un flux d'état continu." },
    { type: "vf", q: "Un projet non validé (non prouvé par des tests) peut être considéré comme terminé.", a: false, exp: "Non : un projet non validé n'existe pas ; chaque exigence doit être prouvée." },
    { type: "qcm", q: "Quel est le fil rouge de tout le parcours en matière de vérification ?", opts: ["Supposer que ça marche", "Configure puis prouve, de bout en bout, dans les deux sens", "Ne jamais tester", "Tester une seule fois au hasard"], a: 1, exp: "Configure puis prouve : on valide chaque exigence, aller et retour." },
    { type: "qcm", q: "Pour le WAN multi-sites, quelles options sont pertinentes ?", opts: ["SD-WAN ou MPLS L3VPN", "Uniquement des VLAN étendus", "Un seul lien Internet sans redondance", "Des tunnels GRE non chiffrés uniquement"], a: 0, exp: "SD-WAN (pilote plusieurs transports) ou MPLS L3VPN conviennent au WAN d'entreprise." },
    { type: "input", q: "Comment sécurise-t-on la connexion des télétravailleurs au siège ? (deux mots)", a: ["vpn chiffre", "vpn chiffré", "vpn", "tunnel vpn", "vpn securise", "vpn sécurisé"], ph: "deux mots", exp: "Un VPN chiffré protège le trafic des télétravailleurs vers le siège." }
  ],
  final: {
    title: "Exercice final — Livrer l'architecture de bout en bout",
    intro: `<p>Le client valide ton design : siège + 2 sites + télétravailleurs, OSPF/BGP, SD-WAN, sécurité multi-plans, automatisation Python/YANG et télémétrie. Il te demande maintenant de dérouler le déploiement et la validation comme au labo (Design terminé, place au Deploy/Operate/Optimize).</p>`,

      { type: "qcm", q: "Comment sécurises-tu le plan de contrôle des protocoles de routage ?", opts: ["En les laissant sans mot de passe", "Par l'authentification OSPF/BGP et CoPP", "En désactivant OSPF", "Par du Telnet"], a: 1, exp: "Authentification des voisins + CoPP protègent le plan de contrôle." },
      { type: "vf", q: "Tu peux livrer le projet dès que les configs sont saisies, sans phase de validation.", a: false, exp: "Non : configure puis prouve. Chaque exigence doit être testée de bout en bout." },
      { type: "qcm", q: "Comment prouves-tu que l'architecture répond au besoin de bout en bout ?", opts: ["En supposant que tout marche", "Par des tests (show/ping/traceroute + tests automatisés), aller et retour", "En éteignant le réseau", "En lisant seulement la doc"], a: 1, exp: "La validation par tests, dans les deux sens, prouve la conformité au besoin." }
    ],
    solution: `<pre class="pseudo"># Déroulé du projet final (méthode labo)
DESIGN (déjà validé) : adressage hiérarchique, OSPF+BGP, segmentation,
   redondance, WAN (SD-WAN/MPLS), sécurité multi-plans, automatisation, télémétrie
DEPLOY / OPERATE / OPTIMIZE :
  1) Sous-couche : adressage + OSPF (priorité 1, débloque tout)
  2) Interconnexion : BGP + WAN (SD-WAN / MPLS L3VPN)
  3) Sécuriser : gestion (ssh/aaa), contrôle (auth OSPF/BGP + CoPP),
     données (ACL, segmentation, VPN chiffré télétravail)
  4) Automatiser : Python/Ansible, YANG + NETCONF/RESTCONF, télémétrie/gNMI
  5) VALIDER : configure puis prouve — show / ping / traceroute + tests auto,
     chaque exigence vérifiée de bout en bout, aller ET retour
  Time-box les tâches + réserver la vérification finale (comme au labo).</pre>
<p>Tu viens de rassembler tout le parcours Cisco en une seule livraison : <strong>concevoir, sécuriser, automatiser, valider</strong>. C'est exactement l'état d'esprit du CCIE — non pas empiler des commandes, mais livrer une architecture cohérente, défendue, pilotée par le code et <strong>prouvée</strong>. Bravo : tu tiens la carte du sommet.</p>`
  }
};
</script>
