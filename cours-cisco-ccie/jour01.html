  title: "La certification CCIE : le sommet Cisco",
  subtitle: "Le titre d'expert le plus reconnu du réseau — une reconnaissance, pas un raccourci.",
  theory: `
<h3>1. Qu'est-ce que le CCIE ?</h3>
<p>Le <strong>CCIE</strong> (« Cisco Certified Internetwork Expert ») est le niveau <strong>Expert</strong> du programme de certification Cisco, au-dessus des niveaux Associate (CCNA) et Professional (CCNP). Créé en 1993, il est considéré depuis plus de trente ans comme l'une des certifications techniques les plus exigeantes de toute l'industrie informatique. On ne « révise » pas un CCIE en un week-end : les candidats sérieux y consacrent souvent <strong>douze à dix-huit mois</strong> d'étude et, surtout, des <strong>centaines d'heures de laboratoire</strong> pratique.</p>
<p>Vois le CCIE comme le brevet de pilote de ligne du réseau. Un passionné peut lire tous les manuels du monde ; tant qu'il n'a pas passé des centaines d'heures aux commandes, il ne pilote pas un long-courrier. Le CCIE certifie précisément cette maîtrise des commandes, sous pression, en temps réel.</p>
<h3>2. Le numéro CCIE : une identité à vie</h3>
<p>Quand tu réussis, Cisco t'attribue un <strong>numéro CCIE unique</strong>, séquentiel, qui t'accompagne toute ta carrière. Les premiers titulaires portent des numéros à trois ou quatre chiffres ; on en compte aujourd'hui plusieurs dizaines de milliers dans le monde. Ce numéro est un marqueur de séniorité : plus il est bas, plus tu fais partie des pionniers.</p>
<div class="tip">Un même individu peut détenir <strong>plusieurs pistes CCIE</strong> (Enterprise, Security, Data Center…) tout en conservant un <strong>seul et même numéro</strong>. Le numéro identifie la personne, pas la piste.</div>
<h3>3. Pourquoi l'industrie le respecte autant</h3>
<p>La valeur du CCIE tient à une réputation de <strong>rigueur impossible à contourner</strong>. On ne peut pas « bachoter » un CCIE : l'épreuve reine est un <strong>laboratoire pratique</strong> où l'on construit et dépanne de vrais réseaux, pas un QCM. Un employeur qui voit « CCIE #XXXXX » sait que la personne a démontré, mains sur le clavier, qu'elle sait concevoir, déployer et réparer des infrastructures complexes.</p>
<p>Concrètement, le titre ouvre les postes d'<strong>architecte réseau</strong>, d'ingénieur de haut niveau, de consultant expert, et pèse fortement dans les négociations salariales. Cisco entretient aussi une communauté de titulaires (événements, reconnaissance publique de la liste des CCIE).</p>
<div class="warn">Le prestige du CCIE ne vient pas d'un badge : il vient de ce qu'il est <strong>très difficile à obtenir</strong>. Aborder ce cours en cherchant un raccourci est un contresens. Ce cours est une <strong>carte</strong> et une <strong>méthode</strong> ; les kilomètres de labo, c'est toi qui devras les parcourir.</p></div>
<h3>4. Ce que ce cours va t'apporter</h3>
<p>Nous n'allons pas « te donner » le CCIE — personne ne le peut. Nous allons te fournir une <strong>vision claire du terrain</strong> : le format des épreuves, les pistes existantes, la méthodologie de préparation, puis un socle technique expert sur le routage (OSPF, EIGRP, BGP, redistribution). Considère chaque leçon comme le briefing avant l'entraînement réel.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CCIE = Cisco Certified Internetwork Expert (niveau Expert)
# Hierarchie Cisco : CCNA (Associate) &lt; CCNP (Professional) &lt; CCIE (Expert)

# Reconnaissance   : reference mondiale d'expertise reseau depuis 1993
# Effort reel      : 12-18 mois, des CENTAINES d'heures de labo pratique

  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme CCIE ?", opts: ["Cisco Certified Internet Engineer", "Cisco Certified Internetwork Expert", "Cisco Central Infrastructure Expert", "Cisco Certified Instructor Examiner"], a: 1, exp: "CCIE = Cisco Certified Internetwork Expert, le niveau Expert du programme." },

    { type: "input", q: "Combien (ordre de grandeur, un mot) d'heures de labo un candidat sérieux investit-il typiquement : des dizaines, des centaines ou des millions ?", a: ["des centaines", "centaines"], ph: "des …", exp: "On parle de centaines d'heures de laboratoire pratique." },
    { type: "qcm", q: "Le CCIE certifie avant tout la capacité à…", opts: ["Réciter des définitions", "Concevoir, déployer et dépanner des réseaux complexes en pratique", "Vendre des routeurs", "Installer Windows"], a: 1, exp: "C'est une certification de compétence pratique de haut niveau." },
    { type: "vf", q: "Le CCIE est reconnu comme une référence d'expertise réseau à l'échelle mondiale.", a: true, exp: "Vrai : c'est l'une des certifications techniques les plus respectées de l'industrie." },
    { type: "qcm", q: "Peut-on détenir plusieurs pistes CCIE ?", opts: ["Non, une seule est autorisée à vie", "Oui, plusieurs pistes sous un même numéro", "Oui, mais on perd le numéro d'origine", "Non, seul CCNP autorise le cumul"], a: 1, exp: "On peut cumuler des pistes (Enterprise, Security, DC…) tout en gardant un numéro unique." }
  ],
