  title: "La méthodologie de préparation au labo",

  theory: `
<h3>1. Un projet, pas une révision</h3>
<p>Préparer un labo CCIE ne se « révise » pas comme un examen scolaire : cela se <strong>pilote comme un projet</strong> de plusieurs mois. Les candidats structurent typiquement leur préparation sur <strong>6 à 18 mois</strong>, avec des objectifs hebdomadaires, un suivi de progression et des points d'étape réguliers. Sans plan, l'immensité du programme décourage ; avec un plan, elle devient une série de petites victoires.</p>
<p>Pense à un marathon. Personne ne court 42 km « d'un coup » : on suit un plan progressif sur des mois, on augmente la charge graduellement, on planifie récupération et pics d'entraînement. Le labo CCIE est le marathon de l'ingénieur réseau.</p>
<h3>2. Bâtir le plan d'étude</h3>
<pre class="pseudo"># Squelette d'un plan d'etude CCIE (exemple)
Phase 1 (fondations)   : revoir en profondeur chaque techno du blueprint
Phase 2 (construction) : monter des labos par theme, isoles
Phase 3 (integration)  : labos combines, plusieurs technos ensemble
Phase 4 (simulation)   : mock labs chronometres de 8 h, conditions reelles
Boucle continue        : identifier les faiblesses -&gt; y retourner</pre>
<p>Le fil conducteur est le <strong>blueprint</strong> officiel de la piste (la liste des sujets évalués). Chaque sujet doit passer du statut « je connais » à « je configure de mémoire, vite et sans erreur ». Un <strong>journal de labo</strong> (ce que tu montes, les erreurs rencontrées, les corrections) accélère énormément l'apprentissage.</p>
<div class="tip">Mesure ta progression par la <strong>vitesse et la fiabilité</strong>, pas par le nombre d'heures passées. Savoir refaire une tâche en 10 minutes sans hésitation vaut mieux que l'avoir lue dix fois.</p></div>
<h3>3. Le labo intensif : le cœur de la préparation</h3>
<p>La compétence CCIE se forge <strong>les mains sur le clavier</strong>. On s'entraîne sur des <strong>topologies virtualisées</strong> (émulateurs et environnements de labo) qui reproduisent le comportement des équipements réels. L'objectif : rendre la configuration <strong>réflexe</strong>, pour libérer ton cerveau et le consacrer au <strong>dépannage</strong> et à l'<strong>optimisation</strong>, là où se gagnent les points difficiles.</p>
<p>Les <strong>mock labs</strong> (labos blancs chronométrés sur 8 heures) sont indispensables : ils entraînent l'endurance, la gestion du temps et la prise de décision sous pression, exactement comme le jour réel.</p>
<div class="warn">Éviter le piège du « tutoriel infini » : regarder des vidéos sans jamais taper les commandes crée une <strong>illusion de compétence</strong>. Au labo, on ne note pas ce que tu as vu, mais ce que tu sais <strong>faire</strong>.</p></div>
<h3>4. La gestion mentale</h3>
<p>Huit heures de concentration intense sont une épreuve <strong>physique et mentale</strong>. Il faut s'y préparer : sommeil, rythme de pauses, alimentation, et surtout une stratégie face au blocage. La règle d'or : si une tâche résiste trop, <strong>marque-la, passe à la suivante, reviens plus tard</strong>. S'acharner par ego coûte des points ailleurs. La gestion du stress et l'acceptation de l'imperfection font partie de la compétence évaluée.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Preparation labo = PROJET de 6 a 18 mois, piloté par le blueprint
# Plan en phases : fondations -&gt; construction -&gt; integration -&gt; simulation
# Coeur : LABO INTENSIF, config devenue REFLEXE (topologies virtualisees)
# Mock labs 8 h : endurance + gestion du temps + decisions sous pression
# Mental : sommeil, pauses, et surtout SAVOIR PASSER un point bloquant
# Mesure = vitesse + fiabilite, pas le nombre d'heures</pre>`,

    { type: "vf", q: "Le blocage doit se gérer par ego, en refusant de passer à la suite.", a: false, exp: "Faux : l'ego coûte des points ; il faut savoir passer et revenir." },
    { type: "qcm", q: "Quelle phase vient logiquement en dernier dans un plan d'étude ?", opts: ["Fondations", "Construction par thème", "Intégration", "Simulation (mock labs chronométrés)"], a: 3, exp: "On termine par des simulations en conditions réelles avant l'épreuve." },
    { type: "input", q: "Quel outil de suivi personnel (deux mots) aide à consigner labos, erreurs et corrections ?", a: ["journal de labo", "un journal de labo", "journal"], ph: "journal de …", exp: "Un journal de labo accélère l'apprentissage." },
    { type: "qcm", q: "Pourquoi la gestion mentale est-elle une compétence évaluée ?", opts: ["Parce que le labo dure 8 h et exige endurance et décisions sous pression", "Parce qu'il n'y a pas de technique à connaître", "Parce que le stress n'existe pas", "Parce que l'examen est très court"], a: 0, exp: "Huit heures intenses testent l'endurance et la prise de décision sous pression." },
    { type: "qcm", q: "Une durée typique de préparation au labo est de l'ordre de…", opts: ["Quelques jours", "6 à 18 mois", "3 à 4 ans", "2 à 3 semaines"], a: 1, exp: "On compte généralement 6 à 18 mois de préparation." },
    { type: "vf", q: "Un plan structuré transforme un programme énorme en série de petites victoires.", a: true, exp: "Vrai : découper le programme rend l'effort mesurable et soutenable." }
  ],
