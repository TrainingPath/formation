<script>
var DAY = {
  num: 2,
  title: "Le format : examen qualifiant + labo de 8 heures",
  subtitle: "Deux portes à franchir : un examen écrit, puis une journée entière les mains dans le réseau.",
  theory: `
<h3>1. Deux épreuves, dans l'ordre</h3>
<p>Obtenir un CCIE se fait en <strong>deux étapes obligatoires</strong>. D'abord l'<strong>examen qualifiant</strong> (en anglais <em>qualifying exam</em>, ou « written exam ») : un examen théorique à passer et à réussir <strong>avant</strong> de pouvoir réserver la seconde épreuve. Ensuite le <strong>laboratoire pratique</strong> (en anglais <em>lab exam</em> ou <em>lab practical</em>) : une épreuve de <strong>8 heures</strong>, mains sur le clavier, sur des équipements réels ou virtualisés.</p>
<p>Image utile : l'examen qualifiant est le <strong>théorique du permis de conduire</strong> (le code) ; le labo est la <strong>conduite</strong>, en conditions réelles, notée par la performance. Réussir le code ne fait pas de toi un conducteur ; c'est juste le droit d'aller passer la conduite.</p>
<h3>2. L'examen qualifiant</h3>
<p>Le qualifiant valide la <strong>largeur des connaissances</strong> sur la piste choisie : protocoles, architectures, technologies, bonnes pratiques. Il faut le réussir pour <strong>débloquer l'inscription au labo</strong>, et il a une <strong>durée de validité</strong> : si tu ne passes pas le labo dans la fenêtre autorisée, le qualifiant peut expirer et devra être repassé. Il sert donc de « ticket d'entrée » daté.</p>
<div class="tip">Ne néglige pas le qualifiant : au-delà d'ouvrir la porte, il structure les fondations théoriques que le labo suppose déjà acquises. Un candidat qui « passe en force » le qualifiant se fait rattraper par les lacunes le jour du labo.</div>
<h3>3. Le labo de 8 heures : Design, Deploy, Operate, Optimize</h3>
<p>Le labo actuel est organisé en <strong>modules chronométrés</strong> sur une journée de <strong>8 heures</strong>. La structure moderne comprend deux grands moments :</p>
<pre class="pseudo"># Journee de labo CCIE (~8 heures)
Module 1 : DESIGN
  -&gt; concevoir / analyser une architecture, choix de conception,
     questions basees sur des scenarios (pas de config libre)
Module 2 : DEPLOY, OPERATE &amp; OPTIMIZE
  -&gt; construire la configuration reelle,
     exploiter le reseau, depanner, puis optimiser
     (haute disponibilite, performance, securite)</pre>
<p>Le module <strong>Design</strong> teste ta capacité à <strong>raisonner</strong> une architecture (contraintes, compromis) ; le module <strong>Deploy / Operate / Optimize</strong> teste ta capacité à <strong>faire</strong> : configurer, vérifier, dépanner et améliorer un réseau qui doit fonctionner à la fin.</p>
<div class="warn">La gestion du temps est décisive. Sur 8 heures, chaque minute perdue à s'acharner sur un point bloquant est une minute volée aux points encore gagnables. Savoir <strong>abandonner temporairement</strong> une tâche fait partie de la compétence évaluée.</div>
<h3>4. Ce que le format implique pour ta préparation</h3>
<p>Puisque le labo note un réseau qui <strong>fonctionne</strong>, on ne s'y prépare pas en lisant : on s'y prépare en <strong>construisant</strong>. Il faut atteindre une vitesse et une fiabilité telles que la configuration devienne réflexe, pour garder ton énergie mentale au dépannage et à l'optimisation. C'est pourquoi les leçons suivantes insistent autant sur la méthode et sur les technologies de routage manipulées en labo.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Etape 1 : EXAMEN QUALIFIANT (written / qualifying exam)
#   -&gt; theorique, valide la largeur ; ouvre le droit au labo ; a une validite
# Etape 2 : LABO PRATIQUE (lab exam), ~8 HEURES, mains sur le clavier
#   Module DESIGN  : concevoir / analyser (scenarios)
#   Module DEPLOY / OPERATE / OPTIMIZE : configurer, exploiter, depanner, optimiser
# Cle du succes : gestion du temps + config devenue reflexe</pre>`,
  exercises: [
    { type: "qcm", q: "Quelles sont les deux étapes pour obtenir un CCIE, dans l'ordre ?", opts: ["Labo puis examen qualifiant", "Examen qualifiant puis labo pratique", "Deux labos successifs", "Un oral puis un QCM"], a: 1, exp: "D'abord l'examen qualifiant (théorique), puis le labo pratique de 8 heures." },
    { type: "input", q: "Combien d'heures dure le labo pratique CCIE ? (un chiffre)", a: ["8", "8 heures", "huit"], ph: "nombre d'heures", exp: "Le labo dure 8 heures." },
    { type: "qcm", q: "À quoi sert l'examen qualifiant ?", opts: ["À remplacer le labo", "À valider la théorie et débloquer l'inscription au labo", "À noter la configuration finale", "À choisir son numéro CCIE"], a: 1, exp: "Il valide la largeur théorique et donne le droit de s'inscrire au labo." },
    { type: "vf", q: "On peut réserver le labo pratique sans avoir réussi l'examen qualifiant.", a: false, exp: "Faux : le qualifiant est un prérequis pour débloquer le labo." },
    { type: "qcm", q: "Le module « Design » du labo demande surtout de…", opts: ["Configurer des équipements en direct", "Raisonner une architecture via des scénarios (conception/analyse)", "Réciter des définitions", "Câbler physiquement des routeurs"], a: 1, exp: "Design est basé sur des scénarios de conception et d'analyse, sans config libre." },
    { type: "input", q: "Comment appelle-t-on en anglais l'examen théorique préalable ? (deux mots possibles)", a: ["qualifying exam", "written exam", "written", "qualifying"], ph: "… exam", exp: "On parle de qualifying exam (ou written exam)." },
    { type: "qcm", q: "Le second module du labo couvre principalement…", opts: ["Design uniquement", "Deploy, Operate et Optimize", "La facturation", "L'oral de motivation"], a: 1, exp: "Le module Deploy/Operate/Optimize : configurer, exploiter, dépanner, optimiser." },
    { type: "vf", q: "L'examen qualifiant a une durée de validité limitée.", a: true, exp: "Vrai : s'il expire avant que tu passes le labo, il faut le repasser." },
    { type: "qcm", q: "Pourquoi la gestion du temps est-elle décisive au labo ?", opts: ["Parce que l'épreuve est un QCM rapide", "Parce que s'acharner sur un blocage vole du temps aux points gagnables", "Parce qu'il n'y a pas de limite de temps", "Parce que le temps ne compte pas dans la note"], a: 1, exp: "Sur 8 heures, chaque minute perdue sur un blocage réduit les points accessibles ailleurs." },
    { type: "vf", q: "Le labo note principalement ta capacité à obtenir un réseau qui fonctionne réellement.", a: true, exp: "Vrai : c'est une épreuve pratique ; le résultat opérationnel compte." },
    { type: "qcm", q: "Quelle analogie décrit le mieux qualifiant vs labo ?", opts: ["Le code vs la conduite du permis", "La liste de courses vs le repas cuisiné", "L'aller vs le retour", "La théorie sans pratique"], a: 0, exp: "Le qualifiant = le code (théorie) ; le labo = la conduite (pratique notée)." },
    { type: "input", q: "Dans le second module, après Deploy et Operate, quel troisième verbe (en anglais) complète la structure ?", a: ["optimize", "optimise", "optimiser"], ph: "Op…", exp: "Deploy, Operate, Optimize : la dernière étape est Optimize (optimiser)." },
    { type: "qcm", q: "Comment se prépare-t-on le mieux au labo ?", opts: ["En lisant uniquement", "En construisant réellement, jusqu'à ce que la config devienne réflexe", "En regardant des vidéos sans pratiquer", "En mémorisant le qualifiant"], a: 1, exp: "Le labo étant pratique, il faut construire jusqu'à automatiser la configuration." },
    { type: "vf", q: "Réussir l'examen qualifiant garantit à lui seul le titre CCIE.", a: false, exp: "Faux : le qualifiant n'ouvre que le droit au labo ; c'est le labo qui décerne le titre." },
    { type: "qcm", q: "Dans le module Optimize, on cherche notamment à améliorer…", opts: ["La documentation du projet", "La haute disponibilité, la performance, la sécurité", "Le nombre de lignes de configuration", "Le temps de démarrage des équipements"], a: 1, exp: "Optimiser = renforcer disponibilité, performance et sécurité du réseau construit." }
  ],
  final: {
    title: "Exercice final — Reconstituer le parcours d'épreuves",
    intro: `<p>Nadia veut planifier son année CCIE. Aide-la à mettre les étapes et les modules dans le bon ordre.</p>`,
    questions: [
      { type: "qcm", q: "Première épreuve à réussir ?", opts: ["Le labo de 8 h", "L'examen qualifiant (théorique)", "Le module Optimize", "Un oral"], a: 1, exp: "On commence par l'examen qualifiant." },
      { type: "input", q: "Durée totale du labo pratique, en heures ?", a: ["8", "8 heures", "huit"], ph: "nombre", exp: "8 heures." },
      { type: "qcm", q: "Premier module du labo ?", opts: ["Deploy", "Design", "Operate", "Optimize"], a: 1, exp: "Le labo commence par le module Design (conception/analyse)." },
      { type: "vf", q: "Si son qualifiant expire avant le labo, elle devra le repasser.", a: true, exp: "Vrai : le qualifiant a une validité limitée." },
      { type: "qcm", q: "Dans le second module, l'ordre des activités est…", opts: ["Optimize, Operate, Deploy", "Deploy, Operate, Optimize", "Design, Deploy, Design", "Operate seulement"], a: 1, exp: "Deploy (construire), Operate (exploiter/dépanner), Optimize (améliorer)." }
    ],
    solution: `<pre class="pseudo"># Parcours CCIE de Nadia :
1) EXAMEN QUALIFIANT (theorique) -&gt; obligatoire, ouvre le droit au labo
   (attention a sa validite dans le temps)
2) LABO PRATIQUE ~8 h :
     - Module DESIGN  : concevoir / analyser (scenarios)
     - Module DEPLOY / OPERATE / OPTIMIZE : configurer, exploiter,
       depanner puis optimiser un reseau qui doit fonctionner
# Cle : gerer le temps, savoir laisser un blocage de cote.</pre>
<p>Nadia a maintenant une feuille de route claire. Demain : quelle piste CCIE choisir ?</p>`
  }
};
</script>
