<script>
var DAY = {
  num: 13,
  title: "Le SD-WAN en profondeur",
  subtitle: "OMP, politiques centralisées, TLOC et service chaining : le WAN piloté par logiciel.",
  theory: `
<h3>1. Pourquoi SD-WAN ?</h3>
<p>Le WAN d'entreprise reposait sur des liens MPLS coûteux et une intelligence répartie sur chaque routeur. Le <strong>SD-WAN</strong> Cisco (issu de Viptela) sépare le <strong>plan de contrôle</strong> et le <strong>plan de gestion</strong> des routeurs, et les centralise. Les routeurs de sites (les <strong>Edge / vEdge / cEdge</strong>) ne gardent que le <strong>plan de données</strong> ; ils reçoivent leur politique d'un contrôleur central. On combine plusieurs transports (MPLS, Internet, LTE) en un overlay chiffré unique, avec sélection de chemin par application.</p>
<h3>2. Les quatre plans et composants</h3>
<pre class="pseudo"># vManage      : plan de GESTION (GUI, API, templates, monitoring)
# vSmart       : plan de CONTROLE (distribue OMP et les politiques)
# vBond        : plan d'ORCHESTRATION (authentifie et met en relation, NAT traversal)
# vEdge/cEdge  : plan de DONNEES (routeurs de site, tunnels IPsec chiffres)
# (cEdge = IOS-XE SD-WAN ; vEdge = OS Viptela)</pre>
<p>Analogie : le <strong>vBond</strong> est le videur qui vérifie l'identité et présente les invités ; le <strong>vSmart</strong> est le chef d'orchestre qui donne les partitions (routes et politiques) ; le <strong>vManage</strong> est la régie qui configure et surveille tout ; les <strong>Edges</strong> jouent la musique (transportent le trafic).</p>
<h3>3. OMP : le protocole de contrôle</h3>
<p>Le cœur du SD-WAN est <strong>OMP</strong> (<em>Overlay Management Protocol</em>). C'est un protocole inspiré de BGP qui tourne <strong>entre les Edges et les vSmart</strong> (dans des sessions TLS/DTLS), jamais directement entre Edges. Chaque Edge annonce au vSmart ce qu'il sait ; le vSmart réfléchit ces informations (comme un route reflector) et applique la politique. OMP transporte trois grands types de routes :</p>
<pre class="pseudo"># Routes OMP :
#   OMP routes    : les prefixes accessibles derriere chaque site (avec next-hop = TLOC)
#   TLOC routes   : les points d'attache au transport (voir section 4)
#   Service routes : les services disponibles (pare-feu, IPS...) pour le service chaining</pre>
<div class="tip">Retenez : les Edges ne s'échangent pas de routes en direct. Ils parlent tous au vSmart, qui centralise le contrôle. C'est ce qui permet d'appliquer une politique cohérente d'un seul point.</div>
<h3>4. Le TLOC : l'identité d'un point d'attache</h3>
<p>Un <strong>TLOC</strong> (<em>Transport Locator</em>) identifie de façon unique un point d'ancrage d'un Edge sur un transport. Il est défini par un triplet : <strong>System IP</strong> (identité du routeur) + <strong>color</strong> (le type de transport : mpls, biz-internet, lte…) + <strong>encapsulation</strong> (IPsec ou GRE). Une route OMP pointe vers un TLOC comme next-hop. Grâce aux colors, un Edge avec deux liens (mpls et biz-internet) expose deux TLOC, et la politique peut préférer l'un ou basculer sur l'autre. Les <strong>colors publiques</strong> (biz-internet, public-internet) supposent une IP routable ; les <strong>privées</strong> (mpls, private1) restent derrière NAT.</p>
<h3>5. Les politiques centralisées</h3>
<p>Toute l'intelligence se configure sur le vManage puis s'applique via le vSmart. On distingue :</p>
<pre class="pseudo"># Politique CENTRALISEE (appliquee au vSmart, agit sur le plan de controle/donnees) :
#   - control policy : manipule les routes OMP/TLOC (topologie : hub-spoke, full-mesh,
#     preferences, filtrage). Ne touche pas au paquet, mais a ce que les Edges apprennent.
#   - data policy    : agit sur le trafic (par prefixe/appli) : NAT, chemins, service chaining.
#   - app-aware routing (AAR) : choisit le chemin selon des SLA (latence, gigue, perte)
#     mesures par BFD sur chaque tunnel. Ex : la voix exige perte&lt;1%, latence&lt;150ms.
# Politique LOCALE (appliquee sur l'Edge) : ACL, QoS, marquage a l'interface.</pre>
<div class="warn">Distinguez control policy et data policy. La <strong>control policy</strong> modifie la <em>topologie logique</em> (quelles routes un Edge voit) au niveau du vSmart. La <strong>data policy</strong> agit sur le <em>trafic réel</em> (quels paquets vont où). App-aware routing s'appuie sur les mesures BFD des tunnels.</div>
<h3>6. Service chaining et sécurité</h3>
<p>Le <strong>service chaining</strong> force le trafic à traverser un ou plusieurs services réseau (pare-feu, IPS, proxy) hébergés sur un site donné, avant d'atteindre sa destination. Un Edge annonce en OMP les services qu'il offre (service routes) ; une data policy sur le vSmart redirige alors le trafic concerné vers ce service. Exemple typique : tout le trafic Internet des succursales est « chaîné » vers le pare-feu mutualisé du datacenter (modèle hub sécurisé), plutôt que d'ouvrir Internet partout.</p>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SD-WAN Cisco : separer et centraliser controle/gestion ; Edges = data plane
# vManage (gestion) / vSmart (controle) / vBond (orchestration) / vEdge-cEdge (donnees)
# OMP : protocole type BGP entre Edges et vSmart (jamais Edge-Edge direct)
#   -> OMP routes, TLOC routes, service routes
# TLOC = System IP + color + encapsulation : identifie un point d'attache transport
# Control policy (topologie/routes au vSmart) vs Data policy (trafic reel)
# App-aware routing : choix de chemin selon SLA mesures par BFD
# Service chaining : forcer le passage par un service (pare-feu, IPS) via OMP + data policy</pre>`,
  exercises: [
    { type: "qcm", q: "Quel composant SD-WAN assure le plan de contrôle et distribue OMP ?", opts: ["vManage", "vSmart", "vBond", "cEdge"], a: 1, exp: "Le vSmart distribue OMP et applique les politiques centralisées." },
    { type: "qcm", q: "Quel composant orchestre l'authentification et le NAT traversal (mise en relation) ?", opts: ["vBond", "vManage", "vSmart", "vEdge"], a: 0, exp: "Le vBond authentifie les éléments et les met en relation (orchestration)." },
    { type: "qcm", q: "OMP s'échange…", opts: ["Directement entre les Edges", "Entre les Edges et les vSmart", "Entre vManage et vBond seulement", "Entre les CE et les PE"], a: 1, exp: "OMP tourne entre les Edges et les vSmart (jamais Edge à Edge en direct)." },
    { type: "qcm", q: "Un TLOC est défini par quel triplet ?", opts: ["IP, VLAN, MTU", "System IP, color, encapsulation", "RD, RT, label", "EID, RLOC, SGT"], a: 1, exp: "TLOC = System IP + color + encapsulation." },
    { type: "qcm", q: "À quoi sert la 'color' d'un TLOC ?", opts: ["À chiffrer le tunnel", "À identifier le type de transport (mpls, biz-internet, lte...)", "À définir la QoS", "À numéroter les routes"], a: 1, exp: "La color décrit le transport ; elle distingue les liens (mpls vs biz-internet...)." },
    { type: "qcm", q: "Quelle politique choisit le chemin selon des SLA (latence, gigue, perte) mesurés par BFD ?", opts: ["Control policy", "Data policy locale", "App-aware routing (AAR)", "Le protocole LDP"], a: 2, exp: "App-aware routing utilise les mesures BFD des tunnels pour respecter les SLA applicatifs." },
    { type: "vf", q: "Dans le SD-WAN Cisco, les routeurs de site conservent surtout le plan de données.", a: true, exp: "Vrai : contrôle et gestion sont centralisés ; l'Edge transporte le trafic." },
    { type: "vf", q: "La control policy modifie la topologie logique en manipulant les routes OMP/TLOC au vSmart.", a: true, exp: "Vrai : elle agit sur ce que les Edges apprennent (topologie), pas sur le paquet." },
    { type: "vf", q: "Le service chaining force le trafic à traverser un service (pare-feu, IPS) avant destination.", a: true, exp: "Vrai : via les service routes OMP et une data policy de redirection." },
    { type: "vf", q: "Une color 'public' comme biz-internet suppose une IP routable, contrairement aux colors privées.", a: true, exp: "Vrai : les colors publiques utilisent l'IP publique ; les privées (mpls) restent derrière NAT." },
    { type: "input", q: "Quel sigle désigne le protocole de contrôle du SD-WAN Cisco (type BGP) ?", a: ["OMP", "omp", "overlay management protocol"], ph: "3 lettres", exp: "OMP = Overlay Management Protocol." },
    { type: "input", q: "Sigle (4 lettres) du point d'attache d'un Edge sur un transport ?", a: ["TLOC", "tloc"], ph: "4 lettres", exp: "TLOC = Transport Locator." },
    { type: "input", q: "Quel composant héberge le plan de gestion (GUI, templates, monitoring) ?", a: ["vManage", "vmanage"], ph: "un composant", exp: "vManage = plan de gestion." },
    { type: "input", q: "Quel mécanisme mesure en continu latence/gigue/perte sur chaque tunnel pour l'AAR ?", a: ["BFD", "bfd"], ph: "3 lettres", exp: "BFD (Bidirectional Forwarding Detection) mesure les SLA des tunnels." },
    { type: "input", q: "Comment nomme-t-on le fait de forcer le trafic à traverser un pare-feu/IPS distant ?", a: ["service chaining", "service-chaining", "chainage de service", "chainage de services"], ph: "deux mots", exp: "Le service chaining insère des services réseau sur le chemin." }
  ],
  final: {
    title: "Exercice final — Politique WAN pour la voix et Internet",
    intro: `<p>Une entreprise a des succursales dotées de deux liens : <strong>MPLS</strong> (color mpls) et <strong>Internet</strong> (color biz-internet). Objectifs : la <strong>voix</strong> doit emprunter le meilleur lien selon la qualité en temps réel ; tout le <strong>trafic Internet</strong> des succursales doit passer par le pare-feu du datacenter.</p>`,
    questions: [
      { type: "qcm", q: "Quel outil garantit que la voix bascule vers le lien respectant perte<1% / latence<150ms ?", opts: ["Control policy", "App-aware routing (SLA via BFD)", "Un RT dédié", "STP"], a: 1, exp: "L'app-aware routing choisit le tunnel qui respecte le SLA, mesuré par BFD." },
      { type: "qcm", q: "Chaque succursale expose deux TLOC. Qu'est-ce qui les différencie ?", opts: ["Leur System IP", "Leur color (mpls vs biz-internet)", "Leur RD", "Leur VNI"], a: 1, exp: "Même System IP, colors différentes : un TLOC mpls et un TLOC biz-internet." },
      { type: "qcm", q: "Comment forcer le trafic Internet des sites vers le pare-feu du DC ?", opts: ["Une control policy hub-spoke seulement", "Une data policy de service chaining vers le service du DC", "Un tunnel GRE manuel par site", "Désactiver OMP"], a: 1, exp: "Le DC annonce le service (firewall) en OMP ; une data policy y redirige le trafic Internet." },
      { type: "vf", q: "Ces politiques se configurent sur vManage et sont appliquées par le vSmart.", a: true, exp: "Vrai : on définit sur vManage, le vSmart les distribue/applique via OMP." },
      { type: "vf", q: "Les Edges échangent ces routes directement entre eux sans passer par le vSmart.", a: false, exp: "Faux : OMP passe par le vSmart ; les Edges ne s'échangent pas d'OMP en direct." }
    ],
    solution: `<pre class="pseudo"># Objectif 1 : qualite de la voix
#   App-aware routing (AAR) : SLA class VOICE (perte&lt;1%, latence&lt;150ms, gigue faible)
#   BFD mesure chaque tunnel ; la voix suit le TLOC (mpls ou biz-internet) qui respecte le SLA.
# Objectif 2 : Internet via le pare-feu du DC
#   Le DC annonce un service (FW) en OMP (service route).
#   Data policy centralisee (vSmart) : trafic Internet des succursales -&gt; service chaining vers FW du DC.
# Rappels :
#   - TLOC succursale : System IP + color(mpls | biz-internet) + encap(ipsec)
#   - Config sur vManage, distribution/application par vSmart via OMP
#   - Les Edges ne s'echangent jamais OMP directement</pre>
<p>Un seul point de contrôle, deux transports, une politique par application : c'est la promesse du SD-WAN. Demain : la multidiffusion (multicast) au niveau expert.</p>`
  }
};
</script>
