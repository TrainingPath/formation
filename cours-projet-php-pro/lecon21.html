<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : le projet professionnel de bout en bout (examen)",
  subtitle: "Construire, industrialiser, sécuriser — les trois disciplines, en même temps.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et la Ludothèque pro (PHP · Laravel) a été construite, conteneurisée, testée, sécurisée, livrée et surveillée — comme en entreprise. Récapitulons.</p>
<p>Comme ce récapitulatif condense beaucoup de sigles vus au fil du cours, voici un rappel express : <strong>CI</strong> = intégration continue (les vérifications automatiques déclenchées à chaque envoi de code) ; <strong>Pint</strong> = le formateur de code ; <strong>PHPUnit</strong> = l'outil de tests automatiques ; <strong>Form Request</strong> = la classe qui valide les entrées avant le contrôleur ; <strong>Gate</strong> = contrôle d'accès par rôle, <strong>Policy</strong> = par ressource ; <strong>IDOR</strong> = consulter la donnée d'autrui en changeant un identifiant dans l'URL ; <strong>N+1</strong> = le piège des requêtes en cascade qui écroule une page sous le volume ; <strong>trivy</strong> = le scanner de failles d'image, <strong>gitleaks</strong> = le scanner de secrets oubliés ; <strong>/health</strong> = la route qui indique si le serveur va bien ; <strong>rollback</strong> = revenir à la version précédente ; <strong>RGPD</strong> = la loi européenne sur les données personnelles. Chacun est détaillé dans sa leçon d'origine.</p>

<h3>1. Fondations outillées (semaine 1)</h3>
<p>Le dépôt, le Compose et le <strong>pipeline Composer posés avant le métier</strong> ; « Definition of Done » (code + tests + Pint + image) ; schéma migré par les migrations Laravel en conteneur, index anticipés ; modèles et services <strong>testés dès l'écriture</strong> (PHPUnit) ; API Resource et job de tests avec MySQL, au vert.</p>

<h3>2. Le métier, sécurisé et testé (semaine 2)</h3>
<p>Validation (Form Request) en liste d'autorisation ; auth <strong>durcie dès le premier compte</strong> (argon2id, cookies) ; autorisation rôle (Gate) + ressource (Policy), <strong>anti-IDOR testé</strong> ; louer/acheter transactionnels (lockForUpdate), prix figé, couverture-cliquet ; frontend Blade échappé + en-têtes ; secrets hors du code, scannés.</p>

<h3>3. La livraison professionnelle (semaine 3)</h3>
<p>Recherche/pagination sans N+1 (<strong>testé</strong>, with()) ; espaces cloisonnés (refus croisé) ; image de prod <strong>multi-stage, non-root, scannée</strong> ; pipeline complet + protection de branche ; déploiement automatisé staging/prod + /health ; observabilité, sauvegardes, RGPD, rollback N-1.</p>

<h3>Le trajet d'une fonctionnalité</h3>
<pre class="pseudo">branche -> code + test écrits ENSEMBLE + validation + autorisation
  -> CI (tests MySQL, Pint, gitleaks, image+scan) -> revue -> merge
  -> staging auto -> recette -> tag -> build+scan+push -> approbation -> prod -> /health</pre>
<div class="tip">À aucun moment le métier n'avance sans son test ni sa protection. C'est la vraie différence avec le Niveau 6 — et le quotidien d'une équipe pro. Bonne épreuve, la dernière de la formation !</div>`,
  exercises: [
    { type: "qcm", q: "La différence clé du Niveau 8 :", opts: ["L'usage d'un autre langage", "Construire EN outillant (les 3 disciplines ensemble)", "Une autre base de données", "Davantage de CSS"], a: 1, exp: "Pas « construire puis outiller »." },
    { type: "qcm", q: "Le pipeline est posé…", opts: ["À la toute fin", "Avant le métier (jour 1)", "Une fois en prod", "Jamais vraiment"], a: 1, exp: "Setup pro." },
    { type: "qcm", q: "La Definition of Done inclut…", opts: ["Le code écrit seul", "Code + tests + Pint + image + PR relue", "Que la page s'affiche", "Rien de particulier"], a: 1, exp: "« Non testé = non fait »." },
    { type: "qcm", q: "Le schéma est géré par…", opts: ["Du SQL tapé à la main", "Les migrations Laravel versionnées", "Eloquent qui devine les tables", "Un peu de chance"], a: 1, exp: "Versionné, rejouable." },
    { type: "qcm", q: "Les modèles/services sont testés…", opts: ["Bien plus tard, en fin de projet", "Dès l'écriture (même commit)", "Jamais durant le dev", "Directement en prod"], a: 1, exp: "TDD léger." },
    { type: "qcm", q: "La couche service se teste…", opts: ["Seulement avec un vrai MySQL", "Sans base (Jeu en mémoire), en millisecondes", "Uniquement en production", "Jamais automatiquement"], a: 1, exp: "Pipeline rapide." },
    { type: "qcm", q: "L'auth est durcie…", opts: ["En toute fin de parcours", "Dès le premier compte (argon2id, cookies)", "Jamais réellement", "Seulement en prod"], a: 1, exp: "Par conception." },
    { type: "qcm", q: "L'anti-IDOR se garantit par…", opts: ["Un menu simplement masqué", "Gate + Policy + test d'accès croisé", "Des identifiants UUID", "Le passage en HTTPS"], a: 1, exp: "Rôle ET ressource." },
    { type: "qcm", q: "Louer/acheter sont…", opts: ["Écrits sans aucun test", "Transactionnels (lockForUpdate), écrits avec leur test", "Codés en prod seulement", "Purement optionnels"], a: 1, exp: "Verrouillés en CI." },
    { type: "qcm", q: "Le montant d'un achat…", opts: ["Vient du corps POST", "Est figé (copié de $jeu->prix_achat)", "Est toujours nul", "Change avec le prix courant"], a: 1, exp: "Une facture ne change pas." },
    { type: "qcm", q: "Le frontend hérite gratuitement de…", opts: ["Rien du tout", "L'échappement Blade + les en-têtes de sécurité", "Une seconde base de données", "Un pare-feu applicatif (WAF)"], a: 1, exp: "Sécurité du rendu." },
    { type: "qcm", q: "Les secrets vivent…", opts: ["Directement dans le code", "Hors code/image (.env), scannés par gitleaks", "En clair dans un fichier", "Committés dans Git"], a: 1, exp: "Config par environnement." },
    { type: "qcm", q: "La performance (N+1) est…", opts: ["Simplement espérée", "Testée (compte de requêtes)", "Totalement ignorée", "Vérifiée en prod seulement"], a: 1, exp: "Comportement vérifié." },
    { type: "qcm", q: "Chaque espace a…", opts: ["Aucun test", "Son test de refus croisé", "Un pare-feu (WAF)", "Un cache dédié"], a: 1, exp: "Matrice verrouillée." },
    { type: "qcm", q: "L'image de prod est…", opts: ["Le Dockerfile de dev", "Multi-stage, non-root, scannée (trivy), --no-dev", "Taguée en latest mouvant", "Poussée sans aucun tag"], a: 1, exp: "Objet de confiance." },
    { type: "qcm", q: "Un tag v* déclenche…", opts: ["Les tests seuls", "Build + scan + push d'un artefact versionné", "L'envoi d'un email", "Rien du tout"], a: 1, exp: "Release." },
    { type: "qcm", q: "main est protégée par…", opts: ["La bonne volonté de chacun", "tests+qualite+securite+image verts + revue, sans bypass", "un mot de passe partagé", "aucune règle"], a: 1, exp: "Mécanique." },
    { type: "qcm", q: "Le déploiement en prod…", opts: ["À chaque commit poussé", "Sur tag + approbation, puis /health vérifié", "À la main sur le serveur", "Jamais en automatique"], a: 1, exp: "Décision humaine du moment." },
    { type: "qcm", q: "Le rollback est trivial grâce…", opts: ["À un peu de chance", "Aux images immuables + migrations N-1", "À un pare-feu (WAF)", "À la feuille de style"], a: 1, exp: "Retour < 5 min." },
    { type: "qcm", q: "Le principe directeur du cours :", opts: ["Construire puis outiller", "Construire, industrialiser, sécuriser EN MÊME TEMPS", "Outiller puis construire", "S'en remettre au hasard"], a: 1, exp: "Les trois disciplines ensemble." }
  ],
  final: {
    title: "Épreuve de synthèse — Le trajet complet",
    intro: `<p>Une fonctionnalité « réservation » part de zéro et arrive en production. Déroulez.</p>`,
    questions: [
      { type: "qcm", q: "Le développement :", opts: ["Branche courte ; code + test + validation + autorisation écrits ensemble", "du code direct sur main", "du code sans aucun test", "du code sans branche dédiée"], a: 0, exp: "Les 3 disciplines dès le code." },
      { type: "qcm", q: "La PR est mergeable quand :", opts: ["tests+qualite+securite+image verts + 1 revue", "l'auteur insiste pour merger", "on est vendredi soir", "le chef le décide seul"], a: 0, exp: "Barrière mécanique." },
      { type: "qcm", q: "Après le merge :", opts: ["Staging se déploie seul, recette", "la prod part directement", "rien ne se passe", "un rebuild manuel"], a: 0, exp: "Répétition générale." },
      { type: "qcm", q: "git push origin v1.3.0 enchaîne :", opts: ["Build+scan+push -> approbation -> prod -> /health", "rien du tout", "les tests seuls", "l'envoi d'un email"], a: 0, exp: "Livraison automatisée." },
      { type: "vf", q: "À aucun moment le métier n'avance sans son test ni sa protection.", a: true, exp: "🎓 La marque du Niveau 8." }
    ],
    solution: `<pre class="pseudo">git switch -c feature/reservation
  code métier (service) + test + validation + autorisation ENSEMBLE
  push -> CI : tests(MySQL) + qualite(Pint) + securite(gitleaks) + image(scan)
  revue -> merge (protection de branche)
  -> STAGING auto -> recette
git tag v1.3.0
  -> build + scan CVE + push registre
  -> approbation -> déploiement prod (pull/up/migrate --force)
  -> curl /health 200 ; logs et sauvegardes en place ; rollback prêt (N-1)</pre>
<p>🎓 <strong>Félicitations — et bravo pour toute la formation !</strong> Tu as mené un projet full-stack PHP · Laravel comme une vraie équipe : construit, conteneurisé, testé, sécurisé, livré par un pipeline et exploité. Non plus « d'abord l'app, puis les outils », mais les trois disciplines d'un même pas. C'est exactement le métier.</p>`
  }
};
</script>
