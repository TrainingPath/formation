<script>
var DAY = {
  num: 17,
  title: "L'image de production : multi-stage (PHP-FPM), non-root, scan",
  subtitle: "Fabriquer l'artefact qui partira en prod — léger, non-root, scanné.",
  theory: `
<h3>1. Le Dockerfile multi-stage</h3>
<p>Un <strong>Dockerfile</strong> est la recette qui construit l'<strong>image</strong> — le « moule » figé d'où l'on lance des conteneurs. <strong>Multi-stage</strong> (« en plusieurs étapes ») veut dire qu'on la construit en deux temps : un premier étage <em>atelier</em> qui installe les dépendances, un second étage <em>final</em>, léger, qui ne récupère que le résultat utile. <code>FROM … AS build</code> ouvre un étage nommé « build » ; <code>WORKDIR</code> fixe le dossier de travail ; <code>COPY</code> copie des fichiers dans l'image ; <code>RUN</code> exécute une commande pendant la construction. <code>composer install --no-dev --optimize-autoloader</code> installe les dépendances <em>de production</em> uniquement, en optimisant le chargement des classes.</p>
<pre class="pseudo">FROM composer:2 AS build              # étage 1 "build" : image contenant Composer
WORKDIR /app                          # dossier de travail dans l'image
COPY composer.json composer.lock ./   # copie d'abord la liste des dépendances (pour profiter du cache)
RUN composer install --no-dev --no-scripts --optimize-autoloader --no-interaction   # installe les dépendances de PROD uniquement
COPY . .                              # puis copie tout le code du projet
RUN composer dump-autoload --optimize # optimise le chargement des classes

FROM php:8.5-fpm-alpine                    # runtime : léger, sans Composer
RUN docker-php-ext-install pdo_mysql opcache   # ajoute les extensions PHP : accès MySQL + cache de bytecode
WORKDIR /var/www                      # dossier de l'app dans l'image finale
COPY --from=build --chown=www-data:www-data /app .   # récupère le résultat de l'étage build, propriété de www-data
USER www-data                             # non-root
EXPOSE 9000                           # déclare le port par lequel PHP-FPM écoute
CMD ["php-fpm"]                        # commande lancée au démarrage du conteneur</pre>

<h3>2. Pourquoi multi-stage et --no-dev</h3>
<p>L'étage <code>build</code> contient Composer et tous les outils ; l'option <strong>--no-dev</strong> exclut les paquets réservés au développement (phpunit, pint, faker). L'étage final, lui, ne copie que le code et le <code>vendor</code> de production sur une base <code>alpine</code> (une distribution Linux minuscule). Résultat : une image plus légère et une <strong>surface d'attaque</strong> réduite — moins d'outils embarqués, moins de portes potentielles.</p>
<pre class="pseudo">// L'étage 'build' contient Composer et les outils de dev
// --no-dev : on N'installe PAS phpunit, pint, faker en production
//   -> vendor/ plus léger, surface d'attaque réduite (pas d'outils de dev exposés)
// L'étage final ne garde QUE le code + vendor de prod sur une base alpine</pre>

<h3>3. Non-root : le moindre privilège</h3>
<p>Par défaut, un conteneur s'exécute en <strong>root</strong> (le super-utilisateur tout-puissant). Si une faille de l'application est exploitée, l'attaquant hérite alors des pleins pouvoirs. La directive <code>USER www-data</code> fait tourner l'app sous un compte <strong>non privilégié</strong> : c'est le principe du <strong>moindre privilège</strong> — n'accorder que le strict nécessaire. Même compromise, l'application ne donne que les maigres droits de <code>www-data</code>.</p>
<pre class="pseudo">// Par défaut un conteneur tourne en root -> une faille applicative devient root
// USER www-data : même compromise, l'attaquant n'a que les droits de www-data
// (cours Sécurité : moindre privilège ; cours Docker : non-root)</pre>

<h3>4. Le scan d'image (trivy)</h3>
<p><strong>trivy</strong> est un scanner d'images : il compare les composants de l'image à une base de <strong>CVE</strong> (failles de sécurité publiques répertoriées) et signale les vulnérabilités connues. <code>--severity CRITICAL --exit-code 1</code> fait échouer le build en cas de faille critique. <code>needs: [tests, qualite, securite]</code> impose que ce job ne démarre qu'après la réussite des trois autres.</p>
<pre class="pseudo"># ci.yml — job image
  image:                              # un job nommé "image"
    needs: [tests, qualite, securite] # ne démarre qu'après ces trois jobs (tous verts)
    steps:                            # ses étapes
      - run: docker build -t ludotheque:ci .   # construit l'image à partir du Dockerfile
      - run: trivy image --exit-code 1 --severity CRITICAL ludotheque:ci   # scanne l'image ; échoue s'il trouve une faille CRITIQUE</pre>
<p>Une faille <strong>critique</strong> dans une couche de base bloque la construction : on ne publie jamais une image vulnérable.</p>

<h3>5. Dev vs prod</h3>
<div class="warn">Le compose de développement monte le code en volume (pratique pour l'itération) et installe les dépendances de dev ; la <strong>production</strong> utilise cette image immuable construite par la CI, avec <code>--no-dev</code>, <code>opcache</code>, config et routes en cache. On ne déploie jamais l'environnement de dev : on déploie un artefact figé, scanné, non-root, qu'on peut redéployer à l'identique (rollback — leçon 20).</div>
<div class="tip">L'image de prod réunit d'un coup le cours Docker (multi-stage, non-root) et le cours Sécurité (moindre privilège, scan CVE, pas d'outils de dev). Elle est plus légère, plus sûre, et vérifiée par trivy à chaque build : l'artefact qui part en prod est un <strong>objet de confiance</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Un Dockerfile multi-stage sépare…", opts: ["Rien de particulier", "La construction (composer) du runtime final", "Deux bases de données", "Les feuilles de style CSS"], a: 1, exp: "build puis PHP-FPM." },
    { type: "qcm", q: "L'étage final contient…", opts: ["Composer + les outils de dev", "Le code + vendor de prod (--no-dev)", "La base de données", "phpunit et ses dépendances"], a: 1, exp: "Léger, sûr." },
    { type: "qcm", q: "--no-dev évite d'installer…", opts: ["l'extension pdo_mysql", "phpunit, pint, faker en prod", "l'extension opcache", "aucune dépendance"], a: 1, exp: "Surface réduite." },
    { type: "qcm", q: "USER www-data signifie…", opts: ["L'utilisateur root", "Un utilisateur non privilégié", "Un compte administrateur", "Aucun utilisateur défini"], a: 1, exp: "Moindre privilège." },
    { type: "qcm", q: "Sans USER, une faille applicative donne…", opts: ["Aucun privilège", "Les droits root dans le conteneur", "Un accès au cache", "Un rôle utilisateur"], a: 1, exp: "D'où non-root." },
    { type: "qcm", q: "trivy scanne…", opts: ["Le code source du projet", "L'image (CVE des couches)", "Les feuilles de style CSS", "La base de données"], a: 1, exp: "Failles connues." },
    { type: "qcm", q: "Une CVE critique…", opts: ["Est publiée quand même", "Bloque la construction (job rouge)", "Est simplement ignorée", "Chiffre l'image produite"], a: 1, exp: "Jamais d'image vulnérable." },
    { type: "qcm", q: "Le job image dépend de…", opts: ["Aucun autre job", "needs: [tests, qualite, securite]", "La base de production", "la branche main"], a: 1, exp: "Après les verts." },
    { type: "qcm", q: "En prod on déploie…", opts: ["L'environnement de dev", "L'image immuable de la CI", "Les sources brutes", "Une archive zip"], a: 1, exp: "Artefact figé." },
    { type: "qcm", q: "--optimize-autoloader sert à…", opts: ["Déployer l'application", "Accélérer le chargement des classes en prod", "Chiffrer les classes", "Lancer les tests"], a: 1, exp: "Perf." },
    { type: "vf", q: "Une image immuable permet de revenir en arrière facilement.", a: true, exp: "Rollback (leçon 20)." },
    { type: "qcm", q: "php:8.5-fpm-alpine plutôt qu'une image lourde car…", opts: ["C'est plus lourd au final", "Base minimale = surface réduite", "C'est strictement obligatoire", "C'est plus lent à lancer"], a: 1, exp: "Léger et sûr." },
    { type: "qcm", q: "opcache en prod…", opts: ["Ralentit l'exécution", "Met le bytecode PHP en cache (perf)", "Chiffre le bytecode", "Déclenche le déploiement"], a: 1, exp: "Compilation évitée." },
    { type: "qcm", q: "L'image de prod réunit…", opts: ["Merise et du SQL brut", "Docker (multi-stage, non-root) + Sécurité (scan)", "Les feuilles de style CSS", "Rien de particulier"], a: 1, exp: "Deux cours d'outillage." },
    { type: "vf", q: "L'artefact de prod est un objet de confiance (scanné, non-root, léger).", a: true, exp: "Par conception." }
  ],
  final: {
    title: "Exercice final — L'image de prod durcie",
    intro: `<p>Multi-stage + non-root + --no-dev + scan.</p>`,
    questions: [
      { type: "qcm", q: "L'image finale contient :", opts: ["code + vendor de prod (--no-dev)", "Composer + phpunit + sources", "la base de données", "les outils de dev"], a: 0, exp: "Léger." },
      { type: "qcm", q: "Le conteneur tourne en :", opts: ["utilisateur non-root (www-data)", "utilisateur root", "compte administrateur", "aucun utilisateur"], a: 0, exp: "Moindre privilège." },
      { type: "qcm", q: "La sécurité de l'image est vérifiée par :", opts: ["trivy (CVE critiques bloquantes)", "un rapide coup d'œil", "aucune vérification", "une revue du CSS"], a: 0, exp: "Scan." },
      { type: "qcm", q: "En prod on déploie :", opts: ["l'image immuable de la CI", "l'environnement de dev", "les sources brutes", "une archive zip"], a: 0, exp: "Artefact figé." },
      { type: "vf", q: "--no-dev retire les outils de dev de l'image de prod.", a: true, exp: "Surface réduite." }
    ],
    solution: `<pre class="pseudo">FROM composer:2 AS build                          # étage build (avec Composer)
... composer install --no-dev --optimize-autoloader ...   # dépendances de prod, chargement optimisé
FROM php:8.5-fpm-alpine                           # étage final léger
RUN docker-php-ext-install pdo_mysql opcache      # extensions : MySQL + cache bytecode
COPY --from=build --chown=www-data:www-data /app .   # récupère le code depuis l'étage build
USER www-data                                     # non-root (moindre privilège)
CMD ["php-fpm"]                                    # démarre PHP-FPM

# ci.yml job image : build -> trivy (CRITICAL) -> smoke test</pre>
<p>L'artefact est un objet de confiance. Demain : le pipeline complet et la protection de branche.</p>`
  }
};
</script>
