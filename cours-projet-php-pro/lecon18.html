  title: "Le pipeline complet : build, push, scan, protection",
  subtitle: "Assembler l'usine de bout en bout et verrouiller main.",
  theory: `
<h3>1. Le pipeline de CI, à ce stade</h3>
<p>Un <strong>pipeline</strong> est l'enchaînement automatique des vérifications déclenchées à chaque envoi de code. Ici trois jobs tournent <strong>en parallèle</strong> (en même temps, pour gagner du temps) : les tests, la qualité (Pint) et la sécurité (gitleaks). Le job <em>image</em> attend leur réussite (<code>needs</code>) avant de construire et scanner l'image. Enfin, la <strong>barrière</strong> : le merge dans main n'est possible que si tout est vert et qu'une personne a relu.</p>
<pre class="pseudo">push / PR
   ├─ tests (MySQL) + couverture         ┐
   ├─ qualite (pint --test)              ┤ en parallèle
   └─ securite (gitleaks)                ┘
        └─ image (build + trivy + smoke test)   needs: les trois
BARRIÈRE : merge SEULEMENT si tout est vert + 1 revue.</pre>

<h3>2. Le workflow de release (sur tag)</h3>
<p>Une <strong>release</strong> (« livraison ») est le workflow qui <em>publie</em> une version. Il ne se déclenche que sur un <strong>tag</strong> Git commençant par <code>v</code> — une étiquette posée sur un commit précis (ex. <code>v1.0.0</code>, suivant la convention <strong>semver</strong> : majeur.mineur.correctif). Le job se connecte au <strong>registre</strong> d'images (<code>ghcr.io</code>, l'entrepôt où l'on range les images Docker) via <code>docker login</code> ; l'option <code>--password-stdin</code> passe le jeton par l'entrée standard pour qu'il n'apparaisse pas dans l'historique du shell. Puis il construit, scanne et <code>push</code> (envoie) une image <strong>versionnée et immuable</strong> : code et image portent le même numéro.</p>
<pre class="pseudo"># .github/workflows/release.yml
on: { push: { tags: ["v*"] } }            # SEUL un tag de version déclenche
jobs:                                     # les travaux
  publier:                                # un job "publier"
    steps:                                # ses étapes
      - uses: actions/checkout@v4         # récupère le code
      - run: echo "VERSION=\${GITHUB_REF_NAME#v}" >> "\$GITHUB_ENV"   # v1.0.0 -> 1.0.0
      - run: echo "\${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # connexion au registre (jeton via stdin)
      - run: |                            # bloc de plusieurs commandes shell
          docker build -t ghcr.io/toi/ludotheque:\$VERSION .   # construit l'image versionnée
          trivy image --exit-code 1 --severity CRITICAL ghcr.io/toi/ludotheque:\$VERSION   # scanne (rouge si faille critique)
          docker push ghcr.io/toi/ludotheque:\$VERSION</pre>
<p>Le tag Git (aligné sur semver) déclenche build + scan + push d'un artefact <strong>versionné et immuable</strong>. Code et image racontent la même histoire.</p>

<h3>3. La protection de branche</h3>
<p>La <strong>protection de branche</strong> impose des règles à main : passer par une <strong>PR</strong> relue, exiger que tous les <strong>status checks</strong> (les résultats des jobs de CI) soient verts, forcer la branche à être à jour, et interdire tout <strong>bypass</strong> (contournement) — y compris pour les administrateurs.</p>
<pre class="pseudo">Settings -> Branches -> main :
✔ Require PR + 1 approbation
✔ Require status checks : tests, qualite, securite, image
✔ Require branches up to date ; ✔ no bypass (admins compris)</pre>

<h3>4. Le graphe complet</h3>
<p>Deux fichiers cohabitent : <code>ci.yml</code> vérifie chaque push/PR — avec un <em>smoke test</em>, un test rapide confirmant que l'app démarre — et peut déployer en <strong>staging</strong> (un environnement de préproduction, réplique de la prod pour valider) ; <code>release.yml</code>, lui, ne s'active que sur un tag et mène à la <strong>production</strong> après approbation humaine.</p>
<pre class="pseudo">-- ci.yml --------  (~5-8 min)
push/PR -> tests+qualite+securite (parallèle) -> image -> [si main] staging
-- release.yml ---  (~4-6 min + approbation)
git tag v1.0.0 -> publier (build+scan+push) -> approbation -> production</pre>

<h3>5. La durée compte</h3>
<div class="warn">Un pipeline de 40 minutes se contourne (« je merge, on verra ») ; un pipeline de 7 minutes est utilisé. Les caches (Composer, build Docker), le parallélisme et des jobs minimaux ne sont pas du confort — ils protègent l'adoption. Un pipeline lent est un pipeline mort.</div>
<div class="tip">Le pipeline réunit les trois cours d'outillage : CI/CD (structure, protection), Docker (image), Sécurité (scans). Un commit tagué déclenche un artefact versionné et scanné ; la barrière de branche garantit que main est toujours déployable — une propriété mécanique, plus une intention.</div>`,

    { type: "qcm", q: "Un pipeline de 40 min…", opts: ["Est jugé plus rigoureux", "Se contourne", "Est parfaitement idéal", "Ne peut pas exister"], a: 1, exp: "La durée protège l'adoption." },
    { type: "qcm", q: "Les caches et le parallélisme sont…", opts: ["Du luxe superflu", "Une protection de l'adoption du pipeline", "Plutôt dangereux", "Purement décoratifs"], a: 1, exp: "Vitesse = usage." },
    { type: "vf", q: "Un tag Git déclenche un artefact versionné et scanné.", a: true, exp: "Code et image, même histoire." },
    { type: "qcm", q: "Le pipeline réunit…", opts: ["Merise et du SQL", "CI/CD + Docker + Sécurité", "Les feuilles de style CSS", "Rien de tout cela"], a: 1, exp: "Les trois cours d'outillage." },
    { type: "qcm", q: "« main toujours déployable » est désormais…", opts: ["Un simple vœu pieux", "Une propriété mécanique (protection de branche)", "Un slogan d'équipe", "Une option facultative"], a: 1, exp: "Verrouillé." },
    { type: "qcm", q: "Le registre reçoit…", opts: ["Chaque commit poussé", "Les versions taguées (immuables)", "Rien du tout", "Le code source brut"], a: 1, exp: "Artefacts choisis." },
    { type: "vf", q: "L'artefact de release est immuable (on ne re-pousse pas un tag existant).", a: true, exp: "Contrat des versions." }
  ],
  final: {
    title: "Exercice final — L'usine complète",
    intro: `<p>On assemble CI + release et on verrouille main.</p>`,
    questions: [
      { type: "qcm", q: "Un push sur PR déclenche :", opts: ["tests + qualite + securite, puis image", "le déploiement en production", "aucun job", "une release taguée"], a: 0, exp: "La CI protège." },
      { type: "qcm", q: "Un tag v* déclenche :", opts: ["publier (build + scan + push registre)", "les tests seuls", "un déploiement en staging", "l'ajout d'un badge"], a: 0, exp: "La livraison." },
      { type: "qcm", q: "L'image poussée :", opts: ["ghcr.io/...:VERSION (immuable, scannée)", "un tag latest muté", "poussée sans tag", "stockée en clair"], a: 0, exp: "Versionnée." },
      { type: "qcm", q: "main est protégée par :", opts: ["checks + revue + up to date, sans bypass", "la bonne volonté de chacun", "un mot de passe partagé", "aucune règle"], a: 0, exp: "Mécanique." },
      { type: "vf", q: "Le pipeline reste sous 10 min grâce aux caches et au parallélisme.", a: true, exp: "Adoption." }
    ],
    solution: `<pre class="pseudo"># release.yml

          docker push ghcr.io/toi/ludotheque:\$VERSION   # publie l'image versionnée

# Protection de main : tests+qualite+securite+image verts + 1 revue</pre>
<p>L'usine est complète. Demain : le déploiement automatisé.</p>`
