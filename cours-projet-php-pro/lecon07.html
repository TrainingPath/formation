  title: "L'API REST (Laravel) et le job de tests au vert",
  subtitle: "On ouvre le catalogue en API — et l'usine de tests devient complète.",
  theory: `
<h3>1. Une API Resource, pas le modèle brut</h3>
<p>Une <strong>API REST</strong> est une porte d'entrée standardisée par laquelle d'autres programmes demandent ou envoient des données via des URL, en recevant du <strong>JSON</strong>. Une <strong>API Resource</strong> (classe <code>JsonResource</code>) est un <em>traducteur de sortie</em> : sa méthode <code>toArray()</code> choisit exactement quels champs du modèle deviennent visibles dans la réponse. On ne renvoie jamais le modèle brut, pour ne pas divulguer de données internes et pour garder le <em>contrat</em> d'API indépendant de la structure de la base.</p>
<pre class="pseudo">// app/Http/Resources/JeuResource.php
class JeuResource extends JsonResource {          // "traducteur de sortie" : décide ce que l'API renvoie
    public function toArray($request): array {    // construit le tableau JSON à partir du jeu ($this)
        return [
            'id' => $this->id,                    // on expose l'identifiant
            'titre' => $this->titre,              // et le titre
            'prix_location' => $this->prix_location,   // et le prix de location
            'louable' => $this->est_louable,      // et la règle calculée "louable" (accesseur)
        ];                                        // tout le reste (champs internes) reste caché
    }
}</pre>
<p>On n'expose <strong>jamais</strong> le modèle Eloquent directement (<code>toJson()</code>) : la Resource choisit ce qui sort (pas de champ interne, pas de relation lourde) et découple le contrat d'API du schéma.</p>

<h3>2. La route</h3>
<p>Le fichier <code>routes/api.php</code> déclare les routes de l'API. <code>Route::get('/jeux', …)</code> répond aux demandes de <em>lecture</em> (GET) sur <code>/api/jeux</code>. <code>Jeu::with('categorie')</code> charge d'avance la catégorie de chaque jeu (voir le N+1 ci-dessous), <code>orderBy('titre')</code> trie par titre, <code>get()</code> exécute la requête, et <code>JeuResource::collection(…)</code> emballe la liste au format JSON standardisé (sous une clé <code>data</code>).</p>
<pre class="pseudo">// routes/api.php
Route::get('/jeux', function () {                 // GET /api/jeux : lister le catalogue
    return JeuResource::collection(               // emballe la liste au format JSON standard (clé "data")
        Jeu::with('categorie')->orderBy('titre')->get()   // charge les jeux + leur catégorie (with = anti-N+1), triés par titre
    );
});</pre>

<h3>3. Éviter le N+1 dès l'API</h3>
<p>Le <strong>problème N+1</strong> est un piège de performance classique : pour afficher N jeux avec leur catégorie, un code naïf fait 1 requête pour les jeux, puis 1 requête par jeu pour aller chercher sa catégorie — soit N+1 requêtes qui écroulent la base. L'<strong>eager loading</strong> (« chargement anticipé », via <code>with('categorie')</code>) récupère toutes les catégories d'un coup : 2 requêtes au total, quel que soit N.</p>
<pre class="pseudo">// SANS with('categorie') : 1 requête pour les jeux + 1 par jeu pour sa catégorie
//   = N+1 requêtes. Avec with() : 2 requêtes au total (eager loading).</pre>

<h3>4. Le test fonctionnel</h3>
<p>Un <strong>test fonctionnel</strong> vérifie le comportement <em>de bout en bout</em> : il appelle une vraie URL et inspecte la réponse. <code>getJson('/api/jeux')</code> simule une requête HTTP GET. <code>assertOk()</code> exige un code 200 (succès), et <code>assertJsonStructure([...])</code> vérifie que le JSON renvoyé a bien la forme attendue (les bonnes clés), sans se soucier des valeurs exactes.</p>
<pre class="pseudo">class JeuApiTest extends TestCase {
    use RefreshDatabase;                          // base propre et migrée avant le test
    public function test_liste_les_jeux(): void { // teste que l'API liste bien les jeux
        Jeu::factory()->count(3)->create();       // enregistre 3 jeux de test
        $this->getJson('/api/jeux')               // appelle l'URL de l'API en GET
            ->assertOk()                          // vérifie un code HTTP 200 (succès)
            ->assertJsonStructure(['data' => [['id','titre','prix_location','louable']]]);   // vérifie la FORME du JSON (les bonnes clés)
    }
}</pre>

<h3>5. Le job de tests complet, avec MySQL</h3>
<p>Dans la CI, un <strong>job</strong> peut démarrer des <strong>services</strong> annexes le temps de ses tests : ici un conteneur <code>mysql:8.4</code> jetable. Les <code>options: --health-cmd…</code> jouent le même rôle que le healthcheck vu en leçon 2 : attendre que MySQL soit réellement prêt. La variable <code>DB_HOST: 127.0.0.1</code> dit à Laravel de se connecter à ce MySQL local du runner. <strong>SQLite</strong> — une petite base de données rangée dans un simple fichier — serait plus rapide, mais elle n'obéit pas aux mêmes règles que MySQL : tester contre le vrai moteur évite le « vert en CI, rouge en prod ».</p>
<pre class="pseudo"># ci.yml
  tests:                          # un job nommé "tests"
    runs-on: ubuntu-latest        # machine Linux neuve
    services:                     # conteneurs annexes démarrés pour ce job
      mysql:                      # un service MySQL jetable
        image: mysql:8.4          # image MySQL 8.4
        env: { MYSQL_DATABASE: ludotheque, MYSQL_ROOT_PASSWORD: ci }   # base et mot de passe root de test
        ports: ["3306:3306"]      # expose le port MySQL au runner
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=10   # attend que MySQL soit PRÊT
    steps:                        # étapes du job
      - uses: actions/checkout@v4         # récupérer le code
      - uses: shivammathur/setup-php@v2   # installer PHP + Composer
        with: { php-version: "8.5", tools: composer }   # PHP 8.5, outil composer
      - run: composer install --no-interaction          # installer les dépendances
      - run: php artisan test               # lancer tous les tests
        env: { DB_HOST: 127.0.0.1, DB_DATABASE: ludotheque }   # pointer Laravel vers le MySQL local du runner</pre>
<div class="warn">Le service MySQL de la CI (cours CI/CD leçon 10) rejoue les migrations sur une base neuve à chaque commit (RefreshDatabase) : les tests s'exécutent contre le vrai moteur, pas SQLite qui divergerait. La base est jetable, recréée à chaque exécution.</div>
<div class="tip"><strong>Fin de semaine 1.</strong> L'usine est complète AVANT que l'application ne soit finie : modèles, service et API existent, chacun sous tests, et le pipeline (Pint + tests avec MySQL) tourne au vert à chaque commit. On peut désormais empiler le métier en confiance — chaque ajout naîtra testé et surveillé.</div>`,

    { type: "qcm", q: "Le job tests CI a un service…", opts: ["Redis", "mysql:8.4", "Nginx", "Aucun service annexe"], a: 1, exp: "Vrai moteur pour l'intégration." },
    { type: "qcm", q: "La base de la CI est…", opts: ["La base de production", "Jetable, recréée à chaque exécution", "Permanente d'un run à l'autre", "Créée à la main avant le job"], a: 1, exp: "RefreshDatabase." },
    { type: "qcm", q: "La collection de Resources encapsule…", opts: ["La requête SQL générée", "La liste sous une clé 'data'", "Le rôle de l'utilisateur", "Le cache des réponses"], a: 1, exp: "Format standard Laravel." },
    { type: "qcm", q: "Tester contre MySQL plutôt que SQLite…", opts: ["Est plus lent sans intérêt", "Évite le 'vert en CI, rouge en prod'", "Est interdit par Laravel", "Chiffre les données de test"], a: 1, exp: "Comportement SQL réel." },
    { type: "qcm", q: "En fin de semaine 1, l'usine est…", opts: ["Encore inexistante", "Complète avant que l'app soit finie", "Déjà déployée en prod", "Optionnelle à ce stade"], a: 1, exp: "Outillage d'abord." },
    { type: "vf", q: "with() charge la relation en une requête au lieu de N.", a: true, exp: "Anti-N+1." },
    { type: "qcm", q: "Route::get('/jeux') répond à…", opts: ["POST", "GET (lecture)", "DELETE", "aucune requête HTTP"], a: 1, exp: "Lister le catalogue." },
    { type: "qcm", q: "Le pipeline de fin de semaine 1 fait…", opts: ["Aucune vérification", "Pint + tests avec MySQL", "Un déploiement en prod", "L'envoi d'un email"], a: 1, exp: "Vert à chaque commit." },
    { type: "qcm", q: "DB_HOST en CI pointe vers…", opts: ["La base de production", "Le service mysql du job (127.0.0.1)", "Aucune base configurée", "Un fichier SQLite local"], a: 1, exp: "Base jetable du runner." },
    { type: "vf", q: "Chaque nouvel ajout métier naîtra désormais testé et surveillé.", a: true, exp: "L'usine est prête." }
  ],
  final: {
    title: "Exercice final — L'API et l'usine au vert",
    intro: `<p>API + Resource + test + job MySQL.</p>`,
    questions: [
      { type: "qcm", q: "L'API expose :", opts: ["une API Resource", "le modèle Eloquent brut", "le SQL des tables", "le HTML rendu"], a: 0, exp: "Contrat découplé." },
      { type: "qcm", q: "Le N+1 est évité par :", opts: ["with('categorie') (eager loading)", "davantage de mémoire RAM", "un cache manuel", "un peu de chance"], a: 0, exp: "2 requêtes." },
      { type: "qcm", q: "Le test d'API utilise :", opts: ["getJson", "un vrai navigateur", "la base de prod", "un mock total du framework"], a: 0, exp: "Test HTTP." },
      { type: "qcm", q: "Le job de tests CI a :", opts: ["un service mysql:8.4 jetable", "la base de production", "aucune base de données", "SQLite uniquement"], a: 0, exp: "Vrai moteur." },
      { type: "vf", q: "Fin de semaine 1 : l'usine tourne avant que l'app soit finie.", a: true, exp: "Outillage d'abord." }
    ],
    solution: `<pre class="pseudo">class JeuResource extends JsonResource {                     // traducteur de sortie de l'API

    return ['id'=>$this->id, 'titre'=>$this->titre,          // id + titre
            'prix_location'=>$this->prix_location, 'louable'=>$this->est_louable];   // prix + règle "louable"
  }
}
// routes/api.php
Route::get('/jeux', fn() =>                                  // GET /api/jeux
  JeuResource::collection(Jeu::with('categorie')->orderBy('titre')->get()));   // liste triée, catégorie préchargée (anti-N+1)

# ci.yml job tests : service mysql:8.4 + php artisan test (DB_HOST=127.0.0.1)</pre>
<p>Semaine 1 bouclée : usine complète, au vert. Demain : valider les entrées et refuser proprement.</p>`
  }
};
</script>
