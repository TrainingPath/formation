<script>
var DAY = {
  num: 3,
  title: "Git, branches et première CI (Composer, dès le départ)",
  subtitle: "Le garde-fou avant le métier : chaque commit est vérifié sur une machine neutre.",
  theory: `
<h3>1. Un dépôt propre dès le premier commit</h3>
<p>Un <strong>dépôt Git</strong> (<em>repository</em>) est le dossier du projet suivi par Git, avec tout l'historique de ses versions. <code>git init</code> le crée. Un <strong>commit</strong> est une « photo » enregistrée de l'état du code à un instant, accompagnée d'un message — comme un point de sauvegarde dans un jeu vidéo. Le <strong>.gitignore</strong> liste les fichiers que Git doit ignorer (ne jamais enregistrer) : dépendances régénérables, secrets, caches. Une <strong>branche</strong> est une ligne de travail parallèle ; <code>main</code> est la branche principale. Un <strong>remote</strong> (<code>origin</code>) est la copie du dépôt hébergée sur un serveur partagé comme GitHub ; <strong>pousser</strong> (<code>git push</code>) y envoie tes commits.</p>
<pre class="pseudo">git init                        # crée un dépôt Git vide dans le dossier courant
# .gitignore : /vendor, /node_modules, .env, /storage/*.key, .phpunit.cache   # fichiers que Git doit ignorer (dépendances, secrets, caches)
git add . && git commit -m "feat: squelette Laravel + Compose"   # prépare tous les fichiers puis enregistre un commit avec son message
git branch -M main && git remote add origin ... && git push -u origin main   # renomme la branche en "main", relie le serveur distant "origin", puis y envoie le code</pre>
<p>Messages <strong>normés</strong> (<code>feat:</code> = nouvelle fonctionnalité, <code>fix:</code> = correction, <code>chore:</code> = tâche technique, <code>test:</code> = tests) : l'historique se lit d'un coup d'œil, et un jour il génère le <strong>changelog</strong> — le journal listant, version par version, ce qui a été ajouté ou corrigé (cours CI/CD leçon 1).</p>

<h3>2. Le workflow de CI</h3>
<p>La <strong>CI</strong> (intégration continue) est décrite dans un fichier <em>workflow</em> lu par <strong>GitHub Actions</strong>, le service qui exécute automatiquement des tâches à chaque envoi de code. Un <strong>job</strong> est un groupe d'étapes ; il tourne sur un <strong>runner</strong>, une machine neuve et jetable fournie par GitHub (<code>ubuntu-latest</code> = un Linux tout propre). Chaque <strong>step</strong> (étape) fait une action : <code>checkout</code> récupère le code, <code>setup-php</code> installe PHP et Composer, <code>composer install</code> télécharge les <strong>dépendances</strong> — les bibliothèques externes que ton projet réutilise au lieu de tout réécrire.</p>
<pre class="pseudo"># .github/workflows/ci.yml
name: CI                        # nom du workflow, affiché dans l'onglet Actions de GitHub
on:                             # ÉVÉNEMENTS qui déclenchent la CI
  push: { branches: [main] }        # à chaque envoi (push) sur la branche main
  pull_request: { branches: [main] }   # et à chaque pull request visant main
jobs:                           # liste des travaux à exécuter
  verifier:                     # un job nommé "verifier"
    runs-on: ubuntu-latest      # tourne sur une machine Linux neuve fournie par GitHub
    steps:                      # les étapes, exécutées dans l'ordre
      - uses: actions/checkout@v4     # étape 1 : récupérer le code du dépôt
      - uses: shivammathur/setup-php@v2   # étape 2 : installer PHP et Composer
        with: { php-version: "8.5", tools: composer, coverage: pcov }   # options : PHP 8.5, outil composer, mesure de couverture
      - run: composer install --no-interaction --prefer-dist    # étape 3 : télécharger les dépendances (rapide, sans questions)
      - run: ./vendor/bin/pint --test    # étape 4 : vérifier le format (échoue si non conforme)
      - run: php artisan test            # étape 5 : lancer tous les tests (PHPUnit)</pre>
<p><code>--prefer-dist</code> et le cache Composer évitent de retélécharger les dépendances à chaque exécution — un pipeline rapide est un pipeline utilisé.</p>

<h3>3. Pint : le format tranché une fois pour toutes</h3>
<pre class="pseudo">./vendor/bin/pint          # reformate les fichiers en local (style Laravel par défaut)
./vendor/bin/pint --test   # ne modifie rien : échoue seulement si un fichier n'est pas au format (utilisé en CI)</pre>
<p>Le style n'est plus un sujet de revue : la machine le tranche. Les humains relisent la <strong>logique</strong>, pas les espaces.</p>

<h3>4. La protection de main</h3>
<p>La <strong>protection de branche</strong> est un ensemble de règles imposées par GitHub sur <code>main</code>. Un <strong>status check</strong> est le résultat (vert ou rouge) d'un job de CI ; exiger qu'il soit vert bloque tout code cassé. « Require a pull request » impose de passer par une <strong>PR</strong> relue — au moins une <strong>approbation</strong> d'un collègue — avant de fusionner. « Up to date » force la branche à intégrer les derniers changements de main avant le merge, pour éviter qu'une PR verte mais périmée ne casse main.</p>
<pre class="pseudo">GitHub -> Settings -> Branches -> main :
✔ Require a pull request before merging (+ 1 approbation)
✔ Require status checks to pass : verifier
✔ Require branches to be up to date</pre>

<h3>5. Pourquoi AVANT le métier</h3>
<div class="warn">Si le pipeline arrive après trois semaines de code, on découvre d'un coup 200 problèmes de format et 40 tests à écrire : décourageant, souvent abandonné. Posé au premier commit, il ne juge jamais qu'un tout petit incrément — indolore. La CI n'est pas un juge de fin de parcours, c'est un filet permanent.</div>
<div class="tip">À partir de maintenant, un commit qui casse <code>php artisan test</code> ou le format est rouge <strong>immédiatement</strong> et ne peut pas entrer dans main. La première fonctionnalité métier, demain, naîtra donc déjà sous surveillance.</div>`,
  exercises: [
    { type: "qcm", q: "Les messages de commit sont…", opts: ["Libres, chacun écrit ce qu'il veut", "Normés (feat:, fix:, chore:…)", "Absents, on committe sans texte", "Rédigés uniquement en majuscules"], a: 1, exp: "Historique lisible + changelog." },
    { type: "qcm", q: "La CI se déclenche sur…", opts: ["Le déploiement en production seul", "push et pull_request vers main", "Un planning cron une fois par nuit", "Un lancement manuel décidé par le dev"], a: 1, exp: "Chaque commit vérifié." },
    { type: "qcm", q: "/vendor est dans .gitignore car…", opts: ["C'est le code source principal du projet", "Ce sont des dépendances régénérables (composer install)", "Il contient des secrets à protéger", "C'est une exclusion ajoutée par erreur"], a: 1, exp: "composer.lock suffit." },
    { type: "qcm", q: "setup-php + cache Composer…", opts: ["Ralentit chaque exécution de la CI", "Évite de retélécharger les dépendances", "Chiffre les dépendances téléchargées", "N'a aucun effet sur la durée du build"], a: 1, exp: "Pipeline rapide = adopté." },
    { type: "qcm", q: "Pint sert à…", opts: ["Compiler le code PHP en binaire", "Trancher le format automatiquement (style Laravel)", "Déployer l'application en production", "Chiffrer les secrets du fichier .env"], a: 1, exp: "Le style n'est plus débattu." },
    { type: "qcm", q: "pint --test en CI…", opts: ["Reformate directement les fichiers concernés", "Échoue si un fichier n'est pas au format", "Ignore les fichiers mal formatés", "Déploie le code une fois formaté"], a: 1, exp: "pint (sans --test) reformate en local." },
    { type: "qcm", q: "La protection de main exige…", opts: ["Aucune condition particulière", "PR + status checks verts + revue", "Un mot de passe saisi avant le merge", "Un tag de version posé sur le commit"], a: 1, exp: "main reste sain." },
    { type: "qcm", q: "Poser la CI au premier commit…", opts: ["Est prématuré tant que le code est réduit", "Rend chaque vérification indolore (petit incrément)", "Est techniquement impossible si tôt", "Ralentit inutilement tout le projet"], a: 1, exp: "Filet permanent." },
    { type: "qcm", q: "Un commit qui casse php artisan test…", opts: ["Passe quand même en revue sans blocage", "Est rouge et bloqué avant main", "Est ignoré par la chaîne de la CI", "Atteint la prod puis y est corrigé"], a: 1, exp: "Barrière mécanique." },
    { type: "qcm", q: ".env est dans .gitignore car…", opts: ["Il ne sert qu'en développement local", "Il contient des secrets", "C'est un fichier de code versionné", "Il a été ignoré par erreur"], a: 1, exp: "Secrets hors Git." },
    { type: "vf", q: "Le pipeline existe avant la première fonctionnalité métier.", a: true, exp: "Le fil du Niveau 8." },
    { type: "qcm", q: "La revue humaine porte désormais sur…", opts: ["L'indentation et les espaces du code", "La logique (le format est automatisé)", "Plus rien, tout est automatisé", "La mise en forme des feuilles CSS"], a: 1, exp: "Pint libère la revue." },
    { type: "qcm", q: "shivammathur/setup-php prépare…", opts: ["Le déploiement de l'app en production", "PHP + Composer dans le runner CI", "La base de données du projet", "La compilation des feuilles de style"], a: 1, exp: "Environnement de test." },
    { type: "qcm", q: "« Require branches up to date » évite…", opts: ["Tout conflit de fusion sur les fichiers", "Qu'une PR verte mais périmée casse main après merge", "L'exécution du linter sur la branche", "Le lancement des tests automatisés"], a: 1, exp: "main toujours cohérente." },
    { type: "vf", q: "Un pipeline posé tardivement révèle 200 problèmes d'un coup — décourageant.", a: true, exp: "D'où : dès le jour 1." }
  ],
  final: {
    title: "Exercice final — Le garde-fou en place",
    intro: `<p>Git normé + CI + protection de main.</p>`,
    questions: [
      { type: "qcm", q: "La CI vérifie à chaque commit :", opts: ["Pint + php artisan test", "juste que la page s'affiche", "seulement le style des feuilles CSS", "rien, elle se contente de logger"], a: 0, exp: "Format + tests." },
      { type: "qcm", q: "Le style du code est tranché par :", opts: ["Pint (machine)", "des débats lors de la revue", "le chef d'équipe à la main", "personne, chacun son style"], a: 0, exp: "Automatisé." },
      { type: "qcm", q: "main est protégée par :", opts: ["PR + status checks + revue", "la bonne volonté des développeurs", "un mot de passe partagé", "rien de particulier"], a: 0, exp: "Mécanique." },
      { type: "qcm", q: "Poser la CI dès le jour 1 :", opts: ["rend chaque check indolore", "est prématuré à ce stade", "ralentit tout le projet", "est techniquement impossible"], a: 0, exp: "Petits incréments." },
      { type: "vf", q: "Un commit rouge (test KO) ne peut pas entrer dans main.", a: true, exp: "Barrière de branche." }
    ],
    solution: `<pre class="pseudo"># .github/workflows/ci.yml
on: { push: {branches:[main]}, pull_request: {branches:[main]} }   # déclenché par push et pull request sur main
jobs:                              # travaux à exécuter
  verifier:                        # le job de vérification
    steps:                         # ses étapes, dans l'ordre
      - uses: actions/checkout@v4      # récupérer le code
      - uses: shivammathur/setup-php@v2    # installer PHP + Composer
        with: { php-version: "8.5", tools: composer }   # PHP 8.5 avec l'outil composer
      - run: composer install --no-interaction --prefer-dist   # installer les dépendances
      - run: ./vendor/bin/pint --test    # vérifier le format
      - run: php artisan test            # lancer les tests

# Protection de main : PR + verifier vert + 1 revue</pre>
<p>Le garde-fou est là. Demain : le schéma versionné (migrations Laravel) migré en conteneur.</p>`
  }
};
</script>

    hints: [
      "shivammathur/setup-php@v2 pour PHP + Composer ; --prefer-dist pour la vitesse.",

    checklist: [

est tranche par la machine, au standard\n# Laravel. Les humains ne discutent plus de mise en forme : ils relisent la\n# LOGIQUE. La revue gagne en valeur, et les diffs restent propres (pas de bruit\n# de reformatage).",
    note: "Ce workflow tient en dix lignes mais il change la culture du projet : à partir de là, la qualité n'est plus une intention mais une propriété vérifiée à chaque commit. Le cache Composer et --prefer-dist ne sont pas des détails — un pipeline lent se contourne (« je merge, on verra »), un pipeline rapide se respecte. La vitesse protège l'adoption." }
