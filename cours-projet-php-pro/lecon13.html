<script>
var DAY = {
  num: 13,
  title: "Le frontend Blade : templates échappés et en-têtes de sécurité",
  subtitle: "Donner un visage au métier — avec XSS et clickjacking fermés d'office.",
  theory: `
<h3>1. Blade échappe par défaut</h3>
<p><strong>Blade</strong> est le langage de gabarit (<em>template</em>) de Laravel : un fichier HTML dans lequel on insère des données grâce à des balises spéciales. La double accolade <code>{{ … }}</code> affiche une valeur en l'<strong>échappant</strong> — c'est-à-dire en neutralisant les caractères spéciaux du HTML (<code>&lt;</code>, <code>&gt;</code>) pour qu'ils s'affichent comme du texte au lieu d'être interprétés. C'est la parade au <strong>XSS</strong> (<em>Cross-Site Scripting</em>) : une attaque où un pirate glisse du code dans une saisie (un faux commentaire, un pseudo) pour qu'il s'exécute chez les autres visiteurs. Avec Blade, cette parade est gratuite et active par défaut.</p>
<pre class="pseudo">{{-- catalogue.blade.php --}}
@foreach ($jeux as $jeu)              {{-- pour chaque jeu de la liste… --}}
  <tr>                                {{-- une ligne de tableau --}}
    <td>{{ $jeu->titre }}</td>           {{-- {{ }} ÉCHAPPE le HTML --}}
    <td>{{ $jeu->prix_location }} €</td> {{-- affiche le prix, échappé lui aussi --}}
  </tr>                               {{-- fin de la ligne --}}
@endforeach                           {{-- fin de la boucle --}}</pre>
<p><code>{{ }}</code> transforme <code>&lt;script&gt;</code> en texte inoffensif : une saisie malveillante s'affiche, ne s'exécute jamais. C'est la parade au <strong>XSS</strong>, gratuite et par défaut.</p>

<h3>2. Le piège des accolades non échappées</h3>
<p>La syntaxe <code>{!! … !!}</code> fait l'inverse : elle affiche le contenu <em>brut</em>, sans échapper. Pratique pour du HTML que vous avez vous-même produit et en qui vous avez confiance, mais catastrophique sur une donnée venue d'un utilisateur : c'est exactement la porte d'entrée du XSS. Règle d'or : <code>{!! !!}</code> uniquement sur du HTML sûr, jamais sur une saisie.</p>
<pre class="pseudo">{{-- DANGER : {!! !!} n'échappe PAS --}}
<td>{!! $jeu->description !!}</td>   {{-- XSS si description vient d'un utilisateur --}}
{{-- Règle : {!! !!} UNIQUEMENT sur du HTML de confiance, jamais sur une saisie --}}</pre>

<h3>3. Le formulaire porte le jeton CSRF</h3>
<p>Un <strong>formulaire</strong> (<code>&lt;form&gt;</code>) envoie des données au serveur ; <code>method="POST"</code> car il <em>écrit</em>. La directive <code>@csrf</code> insère un champ caché contenant un <strong>jeton</strong> (<em>token</em>) secret : Laravel le vérifie à réception pour s'assurer que la requête provient bien de votre page, et non d'un site tiers malveillant. C'est la protection contre le <strong>CSRF</strong> (requête forgée à votre insu).</p>
<pre class="pseudo"><form method="POST" action="{{ route('louer', $jeu) }}">   {{-- formulaire d'écriture (POST) vers la route "louer" --}}
    @csrf                              {{-- injecte le champ _token (anti-CSRF) --}}
    <button>Louer</button>             {{-- le bouton qui envoie le formulaire --}}
</form>                                {{-- fin du formulaire --}}
{{-- Laravel vérifie automatiquement le jeton sur toute requête POST/PUT/DELETE --}}</pre>

<h3>4. Les en-têtes de sécurité (middleware)</h3>
<p>Un <strong>middleware</strong> est un filtre traversé par chaque requête et chaque réponse : idéal pour ajouter partout des <strong>en-têtes HTTP</strong> — des lignes d'information que le serveur renvoie au navigateur en plus de la page. Trois en-têtes de sécurité : la <strong>CSP</strong> (<em>Content-Security-Policy</em>) dit au navigateur d'où il a le droit de charger des scripts (<code>'self'</code> = ce site uniquement), réduisant fortement le risque XSS ; <code>X-Frame-Options: DENY</code> interdit d'insérer la page dans un cadre invisible, ce qui bloque le <strong>clickjacking</strong> (piéger un clic sur une page cachée) ; <code>X-Content-Type-Options: nosniff</code> empêche le navigateur de « deviner » le type d'un fichier (son <strong>MIME</strong>) et de l'exécuter par erreur.</p>
<pre class="pseudo">// app/Http/Middleware/SecurityHeaders.php
public function handle($request, Closure $next) {   // filtre traversé par chaque requête
    $response = $next($request);                    // laisse l'app produire la réponse, puis on la complète
    $response->headers->set('Content-Security-Policy', "default-src 'self'");   // n'autorise que les ressources du même site (anti-XSS)
    $response->headers->set('X-Frame-Options', 'DENY');          // anti-clickjacking
    $response->headers->set('X-Content-Type-Options', 'nosniff');   // interdit au navigateur de deviner le type d'un fichier
    return $response;                               // renvoie la réponse enrichie des en-têtes
}
// enregistré globalement dans bootstrap/app.php</pre>

<h3>5. La CSP, adoptée en douceur</h3>
<div class="warn">On peut démarrer la CSP en <code>Content-Security-Policy-Report-Only</code> : elle observe les violations sans rien casser, on ajuste, puis on passe en mode bloquant. La grande majorité des XSS viennent d'un <code>{!! !!}</code> sur une donnée non fiable : <code>grep "{!!" resources/views</code> avant chaque merge suffit à éliminer cette classe de failles.</div>
<div class="tip">Le frontend hérite <strong>gratuitement</strong> de l'échappement Blade et des en-têtes posés d'office : XSS et clickjacking fermés avant même d'exister. On ne « rajoute pas la sécurité du rendu » à la fin : elle est présente dès le premier template. C'est ça, construire en sécurisant.</div>`,
  exercises: [
    { type: "qcm", q: "{{ }} en Blade…", opts: ["N'échappe pas le HTML", "Échappe le HTML (anti-XSS)", "Chiffre le contenu affiché", "Déploie la vue en prod"], a: 1, exp: "Saisie affichée, jamais exécutée." },
    { type: "qcm", q: "{!! !!} en Blade…", opts: ["Échappe toujours le HTML", "N'échappe PAS (danger sur saisie)", "Chiffre la sortie HTML", "Est obligatoire partout"], a: 1, exp: "Seulement du HTML de confiance." },
    { type: "qcm", q: "Le XSS est fermé par…", opts: ["Un pare-feu applicatif (WAF)", "L'échappement du template ({{ }})", "Un cookie sécurisé", "Un index en base"], a: 1, exp: "Par défaut." },
    { type: "qcm", q: "@csrf dans le formulaire…", opts: ["N'a qu'un rôle décoratif", "Injecte le jeton _token (vérifié auto)", "Chiffre les champs du formulaire", "Ralentit l'envoi du formulaire"], a: 1, exp: "Anti-CSRF." },
    { type: "qcm", q: "X-Frame-Options: DENY protège contre…", opts: ["Le XSS", "Le clickjacking", "L'injection SQL", "Le CSRF"], a: 1, exp: "Pas d'iframe." },
    { type: "qcm", q: "X-Content-Type-Options: nosniff empêche…", opts: ["Une nouvelle connexion", "Le navigateur de deviner un type MIME", "Le chargement du CSS", "La mise en cache"], a: 1, exp: "Anti-confusion de type." },
    { type: "qcm", q: "La CSP peut démarrer en…", opts: ["Mode bloquant direct", "Report-Only (observe sans casser)", "Complètement désactivée", "Sur HTTP simple"], a: 1, exp: "Adoption en douceur." },
    { type: "qcm", q: "default-src 'self' autorise…", opts: ["Toutes les origines", "Les ressources du même domaine", "Aucune ressource", "Les scripts de domaines tiers"], a: 1, exp: "Réduit la surface XSS." },
    { type: "qcm", q: "Avant chaque merge on vérifie…", opts: ["Le rendu CSS de la page", "Qu'aucun {!! !!} ne traîne sur une saisie", "La mémoire RAM utilisée", "Le port d'écoute du serveur"], a: 1, exp: "grep '{!!'." },
    { type: "qcm", q: "L'échappement Blade est…", opts: ["Payant en supplément", "Gratuit et par défaut", "Optionnel à activer", "Lent à l'exécution"], a: 1, exp: "Hérité d'office." },
    { type: "vf", q: "Une saisie malveillante affichée via {{ }} s'affiche mais ne s'exécute pas.", a: true, exp: "Neutralisée." },
    { type: "qcm", q: "Laravel vérifie le jeton CSRF…", opts: ["Jamais de lui-même", "Automatiquement sur POST/PUT/DELETE", "À la main dans le code", "En production uniquement"], a: 1, exp: "Middleware VerifyCsrfToken." },
    { type: "qcm", q: "Les en-têtes de sécurité sont posés via…", opts: ["Chaque vue individuelle", "Un middleware global", "La base de données", "Le cache applicatif"], a: 1, exp: "Une fois pour tout le site." },
    { type: "qcm", q: "{!! !!} sur une description utilisateur est…", opts: ["Parfaitement sûr", "Une porte à XSS", "Une pratique recommandée", "Plus rapide à afficher"], a: 1, exp: "Ne jamais dé-échapper une saisie." },
    { type: "vf", q: "Le frontend hérite de la sécurité dès le premier template.", a: true, exp: "Construire en sécurisant." }
  ],
  final: {
    title: "Exercice final — Le rendu, sécurisé d'office",
    intro: `<p>Templates échappés + en-têtes + CSRF.</p>`,
    questions: [
      { type: "qcm", q: "Le contenu utilisateur s'affiche via :", opts: ["{{ }} (échappé)", "{!! !!} (brut)", "innerHTML", "eval"], a: 0, exp: "Anti-XSS." },
      { type: "qcm", q: "Le clickjacking est bloqué par :", opts: ["X-Frame-Options: DENY", "un cookie sécurisé", "un index en base", "aucun en-tête"], a: 0, exp: "Pas d'iframe." },
      { type: "qcm", q: "La CSP se déploie d'abord en :", opts: ["Report-Only", "bloquant direct", "désactivée", "HTTP only"], a: 0, exp: "Observer sans casser." },
      { type: "qcm", q: "Le jeton CSRF est :", opts: ["injecté par @csrf, vérifié auto", "à écrire à la main", "transmis dans l'URL", "totalement absent"], a: 0, exp: "Laravel." },
      { type: "vf", q: "{!! !!} ne doit jamais afficher une saisie utilisateur.", a: true, exp: "XSS sinon." }
    ],
    solution: `<pre class="pseudo">{{-- catalogue.blade.php --}}
<td>{{ $jeu->titre }}</td>                          {{-- échappé (anti-XSS) --}}
<form method="POST" action="{{ route('louer', $jeu) }}">@csrf ...</form>   {{-- POST + jeton CSRF --}}

// SecurityHeaders middleware
$response->headers->set('Content-Security-Policy', "default-src 'self'");   // sources autorisées : ce site
$response->headers->set('X-Frame-Options', 'DENY');                          // anti-clickjacking
$response->headers->set('X-Content-Type-Options', 'nosniff');                // pas de devinette de type MIME
// CSP en Report-Only d'abord, puis bloquant</pre>
<p>Le rendu est sécurisé d'office. Demain : les secrets et la configuration par environnement.</p>`
  }
};
