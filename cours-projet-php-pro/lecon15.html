  title: "Recherche, pagination et qualité (Pint, couverture)",
  subtitle: "Soigner l'expérience — sans N+1, avec la performance prouvée.",
  theory: `
<h3>1. Recherche + pagination</h3>
<p>La <strong>recherche</strong> filtre la liste selon un mot-clé ; la <strong>pagination</strong> découpe une longue liste en pages de taille fixe (ici 10) pour ne pas tout charger d'un coup. <code>when($r->q, …)</code> n'applique le filtre que <em>si</em> une recherche a été saisie. <code>where('titre', 'like', "%{$q}%")</code> cherche les titres <em>contenant</em> le mot ; le <code>%</code> signifie « n'importe quoi » avant et après. <code>paginate(10)</code> renvoie une page de 10 résultats, et <code>withQueryString()</code> reporte la recherche dans les liens de pages, si bien que l'URL <code>/catalogue?q=catan&amp;page=2</code> reste partageable et rechargeable.</p>
<pre class="pseudo">// app/Http/Controllers/CatalogueController.php
public function index(Request $r) {                            // affiche le catalogue (recherche + pagination)
    $jeux = Jeu::louables()->with('categorie')                 // eager load : pas de N+1
        ->when($r->q, fn($query, $q) => $query->where('titre', 'like', "%{$q}%"))   // filtre par titre SEULEMENT si une recherche est saisie
        ->orderBy('titre')                                     // trie par titre
        ->paginate(10)->withQueryString();                     // état dans l'URL
    return view('catalogue', compact('jeux'));                 // envoie les résultats à la vue
}</pre>
<p><code>paginate()->withQueryString()</code> conserve la recherche dans les liens de pagination : <code>/catalogue?q=catan&amp;page=2</code> est partageable, rechargeable.</p>

<h3>2. Le problème N+1</h3>
<p>Le <strong>N+1</strong> est le piège de performance le plus courant avec Eloquent. Par défaut, Eloquent charge une relation seulement quand on y accède (<strong>lazy loading</strong>, « chargement paresseux ») : afficher 10 jeux avec leur catégorie déclenche 1 requête pour les jeux, puis 1 par jeu — 11 en tout. L'<strong>eager loading</strong> (via <code>with('categorie')</code>) charge tout d'avance en 2 requêtes, quel que soit le nombre de lignes.</p>
<pre class="pseudo">// SANS with('categorie') : 1 requête pour les 10 jeux + 10 requêtes pour leurs catégories
//   = 11 requêtes (N+1). Sur 100 lignes -> 101 requêtes : la page rame.
// AVEC with('categorie') : 2 requêtes au total (eager loading).</pre>

<h3>3. La performance devient testable</h3>
<p><code>DB::enableQueryLog()</code> demande à Laravel d'enregistrer toutes les requêtes SQL exécutées ; <code>DB::getQueryLog()</code> les récupère et <code>count(…)</code> les compte. <code>assertLessThanOrEqual(3, …)</code> exige au plus 3 requêtes : si un N+1 se réintroduisait, ce nombre exploserait et le test deviendrait rouge. La performance devient ainsi une garantie <em>vérifiée</em>, pas espérée.</p>
<pre class="pseudo">public function test_catalogue_sans_n_plus_un(): void {        // prouve l'absence de N+1
    Jeu::factory()->count(5)->create();                       // crée 5 jeux de test
    DB::enableQueryLog();                                      // commence à enregistrer les requêtes SQL
    $this->get('/catalogue');                                 // affiche le catalogue
    $this->assertLessThanOrEqual(3, count(DB::getQueryLog()));  // pas 1 requête par jeu
}</pre>
<p>C'est l'équivalent Laravel de <code>assertNumQueries</code> : « pas de N+1 » n'est plus un espoir, c'est une <strong>garantie vérifiée</strong> par la CI.</p>

<h3>4. Pint resserre le style</h3>
<p><strong>Pint</strong> est le formateur de code de Laravel. Lancé sans option, il réaligne le code ; avec <code>--test</code> (en CI), il ne modifie rien mais échoue si un fichier n'est pas au format. Le style est ainsi tranché par la machine, une fois pour toutes.</p>
<pre class="pseudo">./vendor/bin/pint          # en local : reformate les fichiers avant de committer
./vendor/bin/pint --test   # en CI : rouge si un fichier n'est pas au format
# le format est tranché une fois pour toutes ; la revue porte sur la logique</pre>

<h3>5. Un pipeline qui garde tout</h3>
<div class="warn">Compter les requêtes SQL en test transforme la performance en propriété vérifiable, au même titre que la correction (tests) ou la sécurité (accès croisé). Le N+1 est le piège de performance le plus courant avec Eloquent : il passe inaperçu sur 3 lignes de données de test et écroule la prod sur 10 000. Le test le fige pour de bon.</div>
<div class="tip">À ce stade, le pipeline garde le code <strong>correct</strong> (tests), <strong>sûr</strong> (accès croisé, gitleaks), <strong>rapide</strong> (compte de requêtes) ET <strong>propre</strong> (Pint) — sans effort humain répété. C'est le dividende de l'outillage posé dès la semaine 1.</div>`,

    { type: "qcm", q: "Le N+1 passe inaperçu…", opts: ["Absolument toujours", "Sur peu de données de test, puis écroule la prod", "À aucun moment", "Seulement dans la CI"], a: 1, exp: "D'où le test." },
    { type: "qcm", q: "DB::enableQueryLog() sert à…", opts: ["Chiffrer les requêtes SQL", "Enregistrer les requêtes exécutées (pour les compter)", "Déployer l'application", "Mettre en forme le CSS"], a: 1, exp: "Équivalent assertNumQueries." },
    { type: "qcm", q: "Pint en CI…", opts: ["Reformate discrètement le code", "Échoue si le format n'est pas respecté", "Déploie l'application", "Chiffre les fichiers source"], a: 1, exp: "pint (sans --test) reformate." },

    { type: "vf", q: "Compter les requêtes rend la performance vérifiable, comme la correction.", a: true, exp: "Propriété testée." },
    { type: "qcm", q: "when($r->q, ...) applique le filtre…", opts: ["Dans tous les cas", "Seulement si une recherche est fournie", "À aucun moment", "Uniquement en production"], a: 1, exp: "Requête conditionnelle." },
    { type: "qcm", q: "Sans with(), 100 jeux = …", opts: ["1 seule requête", "101 requêtes (N+1)", "aucune requête", "10 requêtes"], a: 1, exp: "La page rame." },
    { type: "qcm", q: "La revue humaine, grâce à Pint, porte sur…", opts: ["Les espaces et l'indentation", "La logique", "Plus rien du tout", "La mise en forme CSS"], a: 1, exp: "Format automatisé." },
    { type: "vf", q: "Le N+1 est le piège de performance le plus courant avec Eloquent.", a: true, exp: "Fréquent et sournois." }
  ],
  final: {

    questions: [

      { type: "qcm", q: "Le format est garanti par :", opts: ["Pint en CI", "la relecture manuelle", "personne en particulier", "une tâche cron"], a: 0, exp: "Tranché." },
      { type: "vf", q: "À ce stade le pipeline garde correct, sûr, rapide et propre.", a: true, exp: "Dividende." }
    ],
    solution: `<pre class="pseudo">public function index(Request $r) {                            // catalogue : recherche + pagination
  $jeux = Jeu::louables()->with('categorie')                   // eager load (anti-N+1)
    ->when($r->q, fn($query,$q) => $query->where('titre','like',"%{$q}%"))   // filtre si recherche
