  title: "Louer un jeu : transaction et test de fonctionnalité",
  subtitle: "Le cœur métier, écrit atomique et verrouillé — et prouvé de bout en bout.",
  theory: `
<h3>1. Pourquoi une transaction</h3>
<p>Louer = deux écritures (créer la location, décrémenter le stock) qui doivent réussir <strong>ensemble ou pas du tout</strong>. Et deux clients simultanés ne doivent pas louer le dernier exemplaire tous les deux (course au stock).</p>
<p>Une <strong>transaction</strong> est un groupe d'écritures en base traité comme un tout indivisible : soit elles réussissent <em>toutes</em>, soit aucune n'est conservée (on parle d'opération <strong>atomique</strong>, du grec « insécable »). Si une étape échoue, la base <em>annule</em> les précédentes — un <strong>rollback</strong>, « retour en arrière » — comme un virement bancaire qui, s'il ne peut créditer le destinataire, ne débite pas non plus l'émetteur. La <strong>concurrence</strong> désigne le fait que plusieurs utilisateurs agissent en même temps : sans précaution, deux clients pourraient louer le dernier exemplaire simultanément.</p>

<h3>2. La transaction + le verrou</h3>
<p>Un <strong>verrou</strong> (<em>lock</em>) réserve temporairement une ligne pour un seul utilisateur à la fois. <code>lockForUpdate()</code> génère un <code>SELECT … FOR UPDATE</code> : tant que la transaction du premier client n'est pas finie, le second attend son tour — impossible de vendre deux fois le dernier stock. <code>firstOrFail()</code> récupère la ligne ou lève une erreur si elle n'existe pas ; <code>decrement('stock_location')</code> retire 1 au stock en une seule opération sûre.</p>
<pre class="pseudo">public function louer(User $client, int $jeuId, int $nbJours = 7): Location {   // louer un jeu pour un client, renvoie la location créée
    return DB::transaction(function () use ($client, $jeuId, $nbJours) {   // tout ce bloc réussit ENSEMBLE ou est annulé
        $jeu = Jeu::where('id', $jeuId)->lockForUpdate()->firstOrFail();  // SELECT ... FOR UPDATE : verrouille la ligne du jeu
        if ($jeu->stock_location <= 0)                                    // s'il n'y a plus de stock de location…
            throw new StockInsuffisantException("Plus de stock de location");   // …on lève l'exception (déclenche l'annulation)
        $jeu->decrement('stock_location');                               // retire 1 au stock, de façon atomique
        return Location::create([                                        // crée la location
            'client_id' => $client->id, 'jeu_id' => $jeu->id,            // à qui, quel jeu
            'date_debut' => now(), 'nb_jours' => $nbJours,               // date de début (maintenant) et durée
        ]);
    });
}</pre>
<p><code>lockForUpdate()</code> pose un verrou SQL : le second client attend la fin de la transaction du premier — pas de survente. Si l'exception est levée, <code>DB::transaction</code> annule <strong>tout</strong>.</p>

<h3>3. La route protégée</h3>
<p>La route utilise <strong>POST</strong> (et non GET) car elle <em>écrit</em> des données. Le <strong>middleware</strong> <code>'auth'</code> est un filtre placé avant le contrôleur : il n'autorise que les utilisateurs connectés. Le <strong>Post-Redirect-Get</strong> consiste à rediriger après un POST réussi, pour qu'un rafraîchissement de page ne renvoie pas le formulaire deux fois. <code>@csrf</code> insère dans le formulaire un <strong>jeton anti-CSRF</strong> — un code secret que Laravel vérifie pour s'assurer que la requête vient bien de votre site.</p>
<pre class="pseudo">// routes/web.php
Route::post('/louer/{jeu}', [LocationController::class, 'louer'])   // POST /louer/{jeu} -> méthode louer du contrôleur
    ->middleware('auth');       // POST, jamais GET, pour écrire ; 'auth' = réservé aux connectés
// contrôleur : redirige vers /mes-locations (Post-Redirect-Get)
// @csrf dans le formulaire : Laravel vérifie le jeton automatiquement</pre>

<h3>4. Le test de fonctionnalité</h3>
<p>Ce test de fonctionnalité rejoue une vraie requête. <code>fresh()</code> relit le jeu depuis la base pour obtenir son stock à jour. <code>assertEquals(2, …)</code> vérifie que le stock est bien tombé à 2. <code>assertDatabaseCount('locations', 1)</code> vérifie qu'exactement une location a été enregistrée (et 0 quand le stock est nul : aucune « location fantôme »).</p>
<pre class="pseudo">public function test_louer_decremente_le_stock(): void {                  // test : louer réduit bien le stock
    $this->actingAs($this->client)->post("/louer/{$this->jeu->id}");     // un client connecté loue le jeu (POST)
    $this->assertEquals(2, $this->jeu->fresh()->stock_location);         // le stock relu vaut 2 (3 - 1)
    $this->assertDatabaseCount('locations', 1);                          // une location a bien été enregistrée
}
public function test_stock_nul_refuse_sans_location_fantome(): void {    // test : stock nul -> refus, sans rien créer
    $this->jeu->update(['stock_location' => 0]);                         // on met le stock à 0
    $this->actingAs($this->client)->post("/louer/{$this->jeu->id}");     // le client tente de louer
    $this->assertDatabaseCount('locations', 0);   // rien créé
}</pre>

<h3>5. POST, jamais GET</h3>
<div class="warn">Écrire (louer, acheter) se fait toujours en <strong>POST</strong>, jamais en GET : un GET est rejouable, indexable, préchargeable — un lien qui loue tout seul serait un désastre. Le Post-Redirect-Get évite en plus la double soumission au rafraîchissement. Laravel vérifie le jeton CSRF automatiquement sur toute requête POST/PUT/DELETE.</div>
<div class="tip">Le test de fonctionnalité traverse toute la chaîne (HTTP -> middleware -> contrôleur -> service -> transaction -> base). Écrit avec la fonctionnalité, il tourne en CI sur un vrai MySQL : la règle métier la plus précieuse du projet est verrouillée dès sa naissance — impossible de la casser sans un job rouge.</div>`,

    { type: "qcm", q: "Le jeton CSRF est vérifié…", opts: ["Jamais par le framework", "Automatiquement par Laravel sur POST/PUT/DELETE", "À la main dans le contrôleur", "En production uniquement"], a: 1, exp: "@csrf dans le form." },
    { type: "qcm", q: "Le Post-Redirect-Get évite…", opts: ["Une nouvelle connexion", "La double soumission au rafraîchissement", "Un problème de mise en forme", "Un défaut de cache"], a: 1, exp: "Redirection après POST." },
    { type: "qcm", q: "Le test de fonctionnalité traverse…", opts: ["Le CSS de la page seul", "HTTP -> contrôleur -> service -> transaction -> base", "Aucune couche réelle", "Le cache applicatif seul"], a: 1, exp: "Toute la chaîne." },
    { type: "vf", q: "Le test tourne en CI sur un vrai MySQL.", a: true, exp: "Règle verrouillée." },
    { type: "qcm", q: "$jeu->fresh() dans le test…", opts: ["Chiffre l'objet Jeu", "Relit le jeu depuis la base (stock à jour)", "Ralentit l'exécution du test", "Déploie l'application"], a: 1, exp: "Vérifier l'effet." },
    { type: "qcm", q: "Sur stock nul, le test vérifie…", opts: ["Aucune assertion", "assertDatabaseCount('locations', 0)", "Un statut HTTP 200", "Le rendu CSS"], a: 1, exp: "Pas de fantôme." },
    { type: "qcm", q: "decrement('stock_location')…", opts: ["Chiffre la colonne stock", "Décrémente le stock atomiquement", "Supprime le jeu du catalogue", "Ne fait rien en base"], a: 1, exp: "Une écriture." },
    { type: "vf", q: "La règle métier la plus précieuse est verrouillée dès sa naissance par son test.", a: true, exp: "Par conception." }
  ],
  final: {
    title: "Exercice final — Louer, atomique et prouvé",
    intro: `<p>Transaction + verrou + POST + test de fonctionnalité.</p>`,
    questions: [
      { type: "qcm", q: "L'atomicité vient de :", opts: ["DB::transaction", "un simple try/catch", "un peu de chance", "un cache applicatif"], a: 0, exp: "Tout ou rien." },
      { type: "qcm", q: "La course au stock est bloquée par :", opts: ["lockForUpdate() (FOR UPDATE)", "davantage de mémoire RAM", "un index sur la table", "aucun mécanisme"], a: 0, exp: "Second client en attente." },
      { type: "qcm", q: "L'écriture se fait en :", opts: ["POST (+ redirect)", "GET", "HEAD", "OPTIONS"], a: 0, exp: "Jamais en GET." },
      { type: "qcm", q: "La preuve : le test vérifie :", opts: ["stock -1, et 0 location sur stock nul", "le rendu CSS de la page", "le port du serveur", "aucune assertion"], a: 0, exp: "Toute la chaîne." },
      { type: "vf", q: "Sur stock nul, aucune location fantôme n'est créée.", a: true, exp: "Rollback." }
    ],
    solution: `<pre class="pseudo">public function louer(User $c, int $id, int $n = 7): Location {          // louer un jeu (client, id du jeu, nb jours)
  return DB::transaction(function () use ($c, $id, $n) {                 // atomique : tout ou rien
    $jeu = Jeu::where('id', $id)->lockForUpdate()->firstOrFail();        // verrouille la ligne (anti-survente)
    if ($jeu->stock_location <= 0) throw new StockInsuffisantException(...);   // plus de stock -> exception (rollback)
    $jeu->decrement('stock_location');                                  // -1 au stock
    return Location::create(['client_id'=>$c->id,'jeu_id'=>$jeu->id,'nb_jours'=>$n]);   // enregistre la location
  });
}
// Route::post('/louer/{jeu}')->middleware('auth');                      // écriture en POST, réservée aux connectés
// test : post -> stock -1 ; stock 0 -> assertDatabaseCount('locations', 0)   // vérifie l'effet et l'absence de fantôme</pre>
<p>Louer est verrouillé. Demain : acheter — prix figé et couverture (PHPUnit).</p>`
  }
