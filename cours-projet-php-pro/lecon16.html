<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois portes, trois clés — on assemble les services existants, on n'invente rien.",
  theory: `
<h3>1. Trois espaces, trois rôles</h3>
<p>Un <strong>espace</strong> est une zone de l'application réservée à un profil : le client voit ses locations et achats, le vendeur gère les stocks, l'administrateur gère comptes et catégories. C'est du <strong>cloisonnement</strong> : trois portes, trois clés. Point important : ces espaces n'inventent <em>aucune</em> logique métier neuve — ils <em>orchestrent</em> (assemblent) les services et requêtes déjà écrits et testés dans les leçons précédentes.</p>
<pre class="pseudo">/client   -> ses locations, ses achats            (role client)
/vendeur  -> stocks, retards, mises en vente        (gate gerer-catalogue)
/gestion  -> comptes, promotions, catégories        (gate administrer)</pre>
<p>Aucune logique métier <strong>nouvelle</strong> : chaque espace orchestre les services (leçons 6-12) et les requêtes (leçon 15) déjà écrits et testés.</p>

<h3>2. Les routes protégées par groupe</h3>
<p>Un <strong>groupe de routes</strong> (<code>Route::middleware('auth')->group(…)</code>) applique un même filtre à plusieurs routes d'un coup. Le middleware <code>'auth'</code> exige d'être connecté ; <code>can:gerer-catalogue</code> et <code>can:administrer</code> exigent en plus la permission correspondante (les Gates de la leçon 10). On <em>imbrique</em> les groupes pour empiler les conditions : pour atteindre <code>/gestion</code>, il faut être connecté ET administrateur.</p>
<pre class="pseudo">// routes/web.php
Route::middleware('auth')->group(function () {                     // toutes ces routes exigent d'être connecté
    Route::get('/client', [EspaceClientController::class, 'index']);   // espace client (tout utilisateur connecté)
    Route::middleware('can:gerer-catalogue')->group(function () {  // sous-groupe : en plus, permission "gerer-catalogue"
        Route::get('/vendeur', [EspaceVendeurController::class, 'index']);   // espace vendeur
    });
    Route::middleware('can:administrer')->group(function () {      // sous-groupe : en plus, permission "administrer"
        Route::post('/gestion/promouvoir/{user}', [GestionController::class, 'promouvoir']);   // promouvoir un compte (POST, écriture)
    });
});</pre>

<h3>3. L'espace client (par ressource)</h3>
<p>L'espace client ne montre que les données de l'utilisateur courant : <code>auth()->id()</code> donne son identifiant, et <code>Location::where('client_id', auth()->id())</code> ne récupère que SES locations. <code>with('jeu')</code> précharge le jeu de chaque location (anti-N+1), <code>get()</code> exécute la requête. C'est le contrôle par <em>ressource</em> vu en leçon 10, appliqué à un espace entier.</p>
<pre class="pseudo">public function index() {                                          // affiche l'espace du client connecté
    return view('client.espace', [                                // envoie deux listes à la vue
        'locations' => Location::where('client_id', auth()->id())->with('jeu')->get(),   // SES locations seulement (jeu préchargé)
        'achats' => Achat::where('client_id', auth()->id())->with('jeu')->get(),         // SES achats seulement
    ]);
}</pre>

<h3>4. Le test de refus croisé, par espace</h3>
<p>Le <strong>test de refus croisé</strong> vérifie qu'un rôle ne peut pas entrer dans l'espace d'un autre : on connecte un client (ou un vendeur) et on tente une action réservée à l'admin. <code>assertForbidden()</code> exige un refus (code 403). Un tel test par espace transforme la matrice « qui accède à quoi » en garantie vérifiée à chaque commit.</p>
<pre class="pseudo">public function test_client_naccede_pas_a_la_gestion(): void {    // un client ne doit pas entrer dans /gestion
    $this->actingAs($this->client)->get('/gestion')->assertForbidden();      // 403
}
public function test_vendeur_ne_promeut_pas(): void {             // un vendeur ne doit pas promouvoir de compte
    $this->actingAs($this->vendeur)->post('/gestion/promouvoir/1')->assertForbidden();   // 403 attendu
}</pre>

<h3>5. Le dividende de l'architecture en couches</h3>
<div class="warn">Chaque espace a son test de refus croisé, verrouillé par la CI : la matrice « qui accède à quoi » est prouvée, pas supposée. Une régression d'autorisation (un <code>middleware('can:...')</code> oublié) redevient rouge immédiatement.</div>
<div class="tip">Les espaces n'ajoutent presque pas de code : ils <strong>assemblent</strong> ce qui existe. C'est le dividende d'une architecture montée proprement dès la semaine 1 — la dernière ligne droite compose des briques testées, elle ne réinvente pas la mécanique. Quand la fondation est saine, la finition est rapide.</div>`,
  exercises: [
    { type: "qcm", q: "Les trois espaces correspondent à…", opts: ["Trois bases", "Trois rôles (client, vendeur, admin)", "Trois serveurs", "Trois langues"], a: 1, exp: "Cloisonnement par profil." },
    { type: "qcm", q: "Les espaces ajoutent…", opts: ["Beaucoup de métier neuf", "Presque aucun métier (ils assemblent)", "Une nouvelle base de données", "Un pare-feu applicatif (WAF)"], a: 1, exp: "Orchestration." },
    { type: "qcm", q: "L'espace client filtre par…", opts: ["L'identifiant dans l'URL", "auth()->id() (l'utilisateur courant)", "Le rôle brut envoyé", "Le cookie du navigateur"], a: 1, exp: "Par ressource." },
    { type: "qcm", q: "L'espace admin se protège par…", opts: ["Un menu simplement caché", "middleware('can:administrer')", "Aucune protection", "Un cookie de session"], a: 1, exp: "Par rôle (Gate)." },
    { type: "qcm", q: "Le test de refus croisé vérifie…", opts: ["Le rendu CSS de la page", "Qu'un rôle n'accède pas à l'espace d'un autre", "La vitesse de réponse", "Le port d'écoute du serveur"], a: 1, exp: "403 attendu." },
    { type: "qcm", q: "actingAs($this->client) simule…", opts: ["Un administrateur connecté", "Un utilisateur client connecté", "Aucun utilisateur connecté", "Un vendeur connecté"], a: 1, exp: "Test d'autorisation." },
    { type: "qcm", q: "Une régression d'autorisation…", opts: ["Passe totalement inaperçue", "Redevient rouge (test croisé en CI)", "Corrompt la base de données", "Est simplement ignorée"], a: 1, exp: "Filet permanent." },
    { type: "qcm", q: "Les services réutilisés viennent des leçons…", opts: ["D'aucune leçon précédente", "6-15 (déjà écrits et testés)", "Des leçons 20-21", "De bibliothèques externes"], a: 1, exp: "On assemble." },
    { type: "qcm", q: "La matrice « qui accède à quoi » est…", opts: ["Simplement supposée", "Prouvée par les tests", "Laissée au hasard", "Purement décorative"], a: 1, exp: "Vérifiée." },
    { type: "qcm", q: "La finition est rapide car…", opts: ["On code très vite", "La fondation (couches) est saine", "On saute tous les tests", "Par pure chance"], a: 1, exp: "Dividende de l'archi." },
    { type: "vf", q: "Chaque espace a son test de refus croisé.", a: true, exp: "Cloisonnement prouvé." },
    { type: "qcm", q: "promouvoir se fait en…", opts: ["une requête GET simple", "POST + can:administrer", "une requête HEAD", "un POST sans protection"], a: 1, exp: "Écrire = POST protégé." },
    { type: "qcm", q: "Un middleware('can:...') oublié serait détecté par…", opts: ["Aucun mécanisme", "Le test de refus croisé (rouge)", "Le rendu CSS", "L'utilisateur final lui-même"], a: 1, exp: "La CI garde la matrice." },
    { type: "qcm", q: "L'espace client ne montre que…", opts: ["Absolument tout", "Les données de l'utilisateur courant", "Les données de l'admin", "Rien du tout"], a: 1, exp: "where('client_id', auth()->id())." },
    { type: "vf", q: "Une architecture en couches saine rend la dernière ligne droite rapide.", a: true, exp: "Assembler, pas réinventer." }
  ],
  final: {
    title: "Exercice final — Trois espaces cloisonnés",
    intro: `<p>Espaces + protection + refus croisé.</p>`,
    questions: [
      { type: "qcm", q: "L'espace client montre :", opts: ["les données de l'utilisateur courant", "absolument tout", "tous les comptes", "rien du tout"], a: 0, exp: "auth()->id()." },
      { type: "qcm", q: "L'espace gestion est protégé par :", opts: ["middleware('can:administrer')", "un menu simplement caché", "aucune protection", "un cookie de session"], a: 0, exp: "Par rôle." },
      { type: "qcm", q: "Le cloisonnement est prouvé par :", opts: ["un test de refus croisé par espace", "une capture d'écran", "la confiance dans le code", "un pare-feu applicatif (WAF)"], a: 0, exp: "403 attendu." },
      { type: "qcm", q: "Les espaces contiennent :", opts: ["quasiment aucune logique neuve (assemblage)", "tout le métier réécrit", "une nouvelle base de données", "un cache applicatif"], a: 0, exp: "Dividende des couches." },
      { type: "vf", q: "Un middleware oublié est rattrapé par la CI.", a: true, exp: "Test croisé." }
    ],
    solution: `<pre class="pseudo">Route::middleware('auth')->group(function () {                    // routes réservées aux connectés
  Route::get('/client', [EspaceClientController::class, 'index']);   // espace client
  Route::middleware('can:gerer-catalogue')->group(fn() =>          // + permission "gerer-catalogue"
    Route::get('/vendeur', [EspaceVendeurController::class, 'index']));   // espace vendeur
  Route::middleware('can:administrer')->group(fn() =>              // + permission "administrer"
    Route::post('/gestion/promouvoir/{user}', [GestionController::class, 'promouvoir']));   // action admin (POST)
});
// client : Location::where('client_id', auth()->id())->with('jeu')->get()   // ses données seulement
// test : actingAs($client)->get('/gestion')->assertForbidden();             // refus croisé (403)</pre>
<p>Les espaces sont cloisonnés. Demain : l'image de production, durcie.</p>`
  }
};
</script>
