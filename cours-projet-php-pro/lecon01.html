<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "Ce qui change au Niveau 8 : on pose les outils AVANT d'écrire la première ligne métier.",
  theory: `
<h3>1. La différence avec le Niveau 6</h3>
<p>Au Niveau 6, tu as construit la Ludothèque « à la main » : l'app d'abord, puis (aux cours d'outillage) les conteneurs, le pipeline et la sécurité. Ici, on inverse : le <strong>dépôt Git</strong>, le <strong>Docker Compose</strong>, le <strong>pipeline CI (Composer)</strong> et la règle « rien n'entre dans main sans CI verte » existent <strong>dès le jour 1</strong>. Chaque fonctionnalité naîtra outillée.</p>
<p>Beaucoup de mots techniques vont revenir : définissons-les tout de suite avec une image simple. <strong>Git</strong> est un logiciel qui enregistre l'<em>historique</em> de toutes les versions du code — comme un carnet où chaque modification est notée et où l'on peut revenir en arrière à tout moment ; le <strong>dépôt Git</strong> (ou <em>repository</em>) est le classeur qui contient le projet et cet historique. <strong>Docker</strong> emballe l'application dans un <strong>conteneur</strong> : une boîte hermétique renfermant le programme ET tout ce dont il a besoin pour tourner (langage, bibliothèques), afin qu'il fonctionne à l'identique sur n'importe quel ordinateur — comme un plat préparé sous vide qu'on réchauffe partout de la même façon. <strong>Docker Compose</strong> est le fichier-recette qui lance plusieurs conteneurs ensemble (l'application + sa base de données). Le <strong>pipeline CI</strong> (<em>intégration continue</em>) est une chaîne de vérifications automatiques déclenchée à chaque envoi de code, comme un tapis de contrôle qualité en usine : si un test échoue, le voyant passe au rouge ; quand tout réussit, la <strong>CI est « verte »</strong>. <strong>Composer</strong> est le gestionnaire de dépendances de PHP : l'outil qui télécharge et installe automatiquement les bibliothèques externes, tel un commis qui va chercher les ingrédients réclamés par la recette. Enfin <strong>main</strong> est la version officielle du projet (toujours livrable) et une <strong>branche</strong> est une copie de travail à part où l'on bricole sans risquer d'abîmer l'officielle — comme un brouillon posé à côté du document propre.</p>

<h3>2. L'arborescence du projet pro</h3>
<pre class="pseudo">app/Models  app/Services  app/Http   Eloquent, services métier, contrôleurs/requests
database/migrations                    schéma versionné (+ factories, seeders)
routes/ (web.php, api.php)             les routes
resources/views                        templates Blade
tests/ (Unit, Feature)                 PHPUnit : unitaires + fonctionnels
composer.json                          dépendances + scripts (pint, phpunit)
Dockerfile                             l'image (multi-stage : build puis PHP-FPM)
compose.yaml                           app + MySQL, réseau, volume (dev)
.github/workflows/ci.yml               tests + Pint + build à chaque commit
.env / .env.example                    config et secrets — HORS Git</pre>
<p>Décryptons les éléments de cette arborescence. <strong>Eloquent</strong> est l'outil de Laravel qui fait le pont entre le code et la base de données (un <em>ORM</em>, mapping objet-relationnel) : il transforme chaque ligne d'une table en objet manipulable, tel un traducteur entre deux langues. Un <strong>service métier</strong> est une classe qui regroupe une règle de gestion (le « métier », par exemple « calculer une remise »), séparée de l'affichage. Un <strong>contrôleur</strong> est le chef d'orchestre qui reçoit une demande venue du navigateur et décide quoi renvoyer. Une <strong>migration</strong> est un fichier décrivant une modification de la structure de la base (créer une table, ajouter une colonne), datée et versionnée comme un plan de construction. <strong>Blade</strong> est le langage de gabarit (<em>template</em>) de Laravel : des pages HTML percées de « trous » à remplir par des données. <strong>PHPUnit</strong> est l'outil qui exécute les <strong>tests</strong> automatiques — de petits programmes qui vérifient que le code fait bien ce qu'on attend. Le <strong>Dockerfile</strong> est la recette qui fabrique l'<strong>image</strong> (le moule figé d'où l'on sort des conteneurs) ; « multi-stage » signifie qu'on la construit en deux temps : un grand atelier pour bâtir, puis une petite boîte finale légère animée par <strong>PHP-FPM</strong>, le moteur qui exécute le code PHP pour servir les pages. <strong>MySQL</strong> est le logiciel de base de données, l'armoire à fiches où sont rangées les informations ; un <strong>volume</strong> est un espace de stockage qui survit à l'arrêt du conteneur, pour que les données ne disparaissent pas. Le <strong>.env</strong> enfin est le fichier de configuration qui contient les <strong>secrets</strong> (mots de passe, clés) ; il reste <em>hors</em> du dépôt Git pour ne jamais être publié. Bref, l'application n'est qu'un ensemble de dossiers parmi d'autres, et l'infrastructure (Docker, CI) est elle aussi du <strong>code</strong>, versionné avec le reste.</p>

<h3>3. La « Definition of Done »</h3>
<pre class="pseudo">Une fonctionnalité n'est « faite » que si :
  ✔ le code est écrit
  ✔ ses tests passent (unitaires + fonctionnels)
  ✔ le format est propre (Laravel Pint)
  ✔ l'image build (rien de cassé côté emballage)
  ✔ la PR est relue et la CI verte
« Ça marche chez moi » ne fait pas partie de la définition.</pre>
<p><strong>Laravel Pint</strong> est un <em>formateur</em> de code : un outil qui réaligne automatiquement le code selon un style commun (espaces, indentation), pour que toute l'équipe écrive de la même façon — comme une mise en page imposée. Une <strong>PR</strong> (<em>pull request</em>, « demande de fusion ») est le moment où l'on dit à l'équipe « voici mon travail, relisez-le avant de l'intégrer à main » : c'est le point de contrôle humain qui complète la vérification automatique de la CI.</p>

<h3>4. Le flux Git d'équipe (GitHub Flow)</h3>
<pre class="pseudo">main toujours déployable — personne n'y committe en direct
1 branche courte par changement (feature/…, fix/…)
push tôt -> pull request -> CI verte + revue -> merge -> branche supprimée</pre>
<p>Concrètement : <strong>pousser</strong> (<em>push</em>), c'est envoyer ses modifications sur le serveur partagé (GitHub) ; <strong>fusionner</strong> (<em>merge</em>), c'est intégrer le travail relu dans main ; une fois fusionnée, la branche courte est <strong>supprimée</strong> car elle a joué son rôle. Ainsi main reste propre et l'on sait toujours qui a changé quoi et pourquoi.</p>

<h3>5. Les trois disciplines en parallèle</h3>
<pre class="pseudo">CONSTRUIRE     le métier (modèles Eloquent, services, API, frontend)
INDUSTRIALISER conteneurs, tests, CI, image, pipeline
SÉCURISER      entrées, secrets, auth, RGPD — par conception
À chaque leçon, les trois avancent ENSEMBLE, jamais l'une sans les autres.</pre>
<p>Deux derniers mots croisés ici : une <strong>API</strong> (<em>interface de programmation</em>) est une « prise » standardisée par laquelle d'autres programmes (une appli mobile, un autre site) viennent demander des données à ton application, sans passer par des pages web ; le <strong>frontend</strong> est la partie visible, l'écran avec lequel l'utilisateur interagit, par opposition au <em>backend</em> (les coulisses, côté serveur). Le <strong>RGPD</strong> est la loi européenne qui protège les données personnelles : elle impose, dès la conception, de ne collecter que le nécessaire et de sécuriser ce que l'on garde.</p>
<div class="warn">La tentation reste de « coder d'abord, outiller après ». C'est précisément ce que ce niveau corrige : ajouter les tests, la sécurité ou la conteneurisation à la fin coûte dix fois plus cher (rétrofit) que de les poser au fil de l'eau. Le setup pro du jour 1 est un investissement, pas une perte de temps.</div>
<div class="tip">Prérequis assumés : tu maîtrises déjà Laravel (capstone N4), Docker, la CI/CD et la sécurité (N5). Ce cours ne réexplique pas ces briques — il les fait <strong>travailler ensemble</strong> sur un vrai projet.</div>`,
  exercises: [
    { type: "qcm", q: "Au Niveau 8, on pose les outils…", opts: ["À la fin, comme au Niveau 6", "Dès le jour 1, avant le métier", "Jamais", "Seulement en prod"], a: 1, exp: "Construire EN outillant." },
    { type: "qcm", q: "L'infrastructure (Docker, CI) est…", opts: ["Un réglage externe", "Du code versionné avec le projet", "Manuelle", "Secrète"], a: 1, exp: "Dockerfile, compose.yaml, ci.yml dans le dépôt." },
    { type: "qcm", q: "Le fichier du pipeline se trouve dans…", opts: [".github/workflows/", "/etc/ci", "composer.json", "la base"], a: 0, exp: "Versionné, revu en PR." },
    { type: "qcm", q: "Les secrets (.env) sont…", opts: ["Dans le dépôt", "Hors Git ET hors image", "Dans l'image", "Dans le code"], a: 1, exp: ".gitignore + .dockerignore." },
    { type: "qcm", q: "La Definition of Done inclut…", opts: ["Le code seul", "Code + tests + Pint + image + PR relue", "Juste que ça compile", "Rien"], a: 1, exp: "Contrat d'équipe." },
    { type: "qcm", q: "« Ça marche chez moi »…", opts: ["Suffit", "Ne fait pas partie de la définition de fait", "Est un test", "Est la CI"], a: 1, exp: "La CI tranche sur une machine neutre." },
    { type: "qcm", q: "Dans GitHub Flow, main est…", opts: ["Une branche de brouillon", "Toujours déployable, jamais committée en direct", "Supprimée souvent", "Facultative"], a: 1, exp: "Le pivot." },
    { type: "qcm", q: "Un changement part…", opts: ["Directement sur main", "D'une branche courte + PR", "Sans branche", "En prod"], a: 1, exp: "PR obligatoire." },
    { type: "qcm", q: "Les trois disciplines menées en parallèle :", opts: ["Construire, industrialiser, sécuriser", "Coder, tester, dormir", "Analyser, coder, livrer", "Aucune"], a: 0, exp: "Ensemble, à chaque leçon." },
    { type: "qcm", q: "Ajouter la sécurité à la fin (rétrofit)…", opts: ["Est gratuit", "Coûte bien plus cher que par conception", "Est impossible", "Est mieux"], a: 1, exp: "D'où le « par conception »." },
    { type: "vf", q: "Le Docker Compose et le pipeline existent avant la première fonctionnalité métier.", a: true, exp: "Le setup pro du jour 1." },
    { type: "qcm", q: "L'app Laravel, dans l'arborescence, est…", opts: ["Le seul élément", "Entourée de l'infra (Dockerfile, ci.yml…)", "Absente", "Dans l'image seule"], a: 1, exp: "L'infra l'entoure." },
    { type: "qcm", q: "Ce cours suppose acquis…", opts: ["Rien", "Laravel (N4), Docker, CI/CD et Sécurité (N5)", "Le CSS seul", "L'assembleur"], a: 1, exp: "Il les fait travailler ensemble." },
    { type: "qcm", q: "composer.lock doit être…", opts: ["Versionné (versions figées)", "Ignoré", "Généré au hasard", "Secret"], a: 0, exp: "Reproductibilité du build." },
    { type: "vf", q: "Au Niveau 8, chaque fonctionnalité naît testée et surveillée.", a: true, exp: "Le pipeline est là dès le départ." }
  ],
  final: {
    title: "Exercice final — Les fondations posées",
    intro: `<p>On vérifie que le projet démarre « à la pro ».</p>`,
    questions: [
      { type: "qcm", q: "Avant d'écrire du métier, on met en place :", opts: ["Dépôt Git + Compose + pipeline + .env hors Git", "juste l'app", "un zip", "rien"], a: 0, exp: "Le setup du jour 1." },
      { type: "qcm", q: "Une fonctionnalité est « faite » quand :", opts: ["Code + tests verts + Pint + image build + PR relue", "elle s'affiche", "on l'a poussée", "on le décide"], a: 0, exp: "Definition of Done." },
      { type: "qcm", q: "main se modifie :", opts: ["Via PR (branche courte, CI verte, revue)", "en direct", "par email", "en prod"], a: 0, exp: "GitHub Flow." },
      { type: "qcm", q: "Les secrets vivent :", opts: ["Hors Git et hors image (.env)", "dans le code", "dans l'image", "dans le README"], a: 0, exp: "Par conception." },
      { type: "vf", q: "Métier, industrialisation et sécurité avancent ensemble, à chaque étape.", a: true, exp: "Le fil du Niveau 8." }
    ],
    solution: `<pre class="pseudo">app/  database/migrations/  routes/  resources/views/  tests/
Dockerfile  compose.yaml  .github/workflows/ci.yml  composer.json (lock versionné)
.env (hors Git/image)  .env.example (clés sans valeurs)

Definition of Done : code + tests + Pint + image + PR relue
Flux : branche courte -> PR -> CI verte + revue -> merge sur main
Trois disciplines en parallèle : construire, industrialiser, sécuriser</pre>
<p>Les fondations pro sont posées. Demain : le squelette Laravel dans Docker Compose.</p>`
  }
};
</script>
