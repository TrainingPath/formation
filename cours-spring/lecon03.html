var DAY = {
  num: 3,
  title: "Les beans : @Component, @Service et la configuration",
  subtitle: "Comment dire à Spring : « cette classe, c'est toi qui la gères ».",
  theory: `
<h3>1. Les annotations stéréotypes</h3>
<p>Rappel : un <strong>bean</strong> est un objet fabriqué et géré par Spring. Pour qu'une classe devienne un bean, on la marque d'une annotation <strong>stéréotype</strong> (un « stéréotype » est ici une étiquette de rôle, comme un badge indiquant le métier d'un employé). Toutes font la même chose techniquement, mais chacune documente un RÔLE différent :</p>
<pre class="pseudo">@Component      // bean générique, sans rôle particulier (l'étiquette de base)
@Service        // logique métier : calculs, règles de gestion
@Repository     // accès aux données, la base de données (leçon 9)
@Controller     // reçoit les requêtes web, les pages (leçon 4)
@RestController // idem, mais pour une API qui renvoie du JSON (leçon 4)</pre>
<div class="tip">@Service, @Repository et @Controller SONT des @Component spécialisés. Choisir la bonne annotation, c'est documenter ton architecture gratuitement.</div>
<h3>2. Le component scan</h3>
<p>Le <strong>component scan</strong> (« balayage des composants ») est l'étape où Spring parcourt tes fichiers pour repérer les classes annotées. Un <strong>paquet</strong> (package) est un dossier qui regroupe des classes. Au démarrage, Spring scanne le paquet de la classe principale <strong>et tous ses sous-paquets</strong>. Toute classe annotée y est détectée et devient un bean.</p>
<pre class="pseudo">com.exemple.biblio            ← BiblioApplication (@SpringBootApplication), le paquet RACINE
com.exemple.biblio.service    ← scanné ✅ (c'est un sous-paquet de la racine)
com.exemple.biblio.web        ← scanné ✅ (encore un sous-paquet)
com.exemple.autre             ← PAS scanné ❌ (hors du paquet racine !)</pre>
<h3>3. @Bean : déclarer un objet qu'on ne peut pas annoter</h3>
<p>Comment faire un bean d'une classe qui vient d'une <strong>bibliothèque externe</strong> (du code écrit par quelqu'un d'autre, dans lequel tu ne peux pas ajouter <code>@Component</code>) ? On utilise une classe de <strong>configuration</strong> : une classe dont le seul rôle est de fabriquer des beans à la main.</p>
<pre class="pseudo">@Configuration                                   // classe qui regroupe des définitions de beans
public class AppConfig {                          // une classe Java ordinaire, marquée @Configuration
    @Bean                                         // la méthode ci-dessous fabrique et enregistre un bean
    public ObjetExterne objetExterne() {          // le nom de la méthode devient le nom du bean
        return new ObjetExterne("paramètre");     // ICI le new est légitime : on construit l'objet à la main
    }                                             // fin de la méthode
}                                                 // fin de la classe</pre>
<p>Spring appelle cette méthode une fois, garde l'objet retourné dans le conteneur, et peut l'injecter partout.</p>
<h3>4. Plusieurs implémentations : @Primary et @Qualifier</h3>
<p>Rappel (leçon 15 Java) : une <strong>interface</strong> est un contrat listant des méthodes, qu'une classe promet de fournir en l'<code>implements</code> (implémentant). Si DEUX classes implémentent la même interface, Spring ne sait plus laquelle injecter : il faut l'aider avec <code>@Primary</code> (« la principale, par défaut ») ou <code>@Qualifier</code> (« celle qui porte tel nom »).</p>
<pre class="pseudo">public interface Notification { void envoyer(String msg); }  // interface : un contrat (une méthode à fournir)

@Service @Primary                                            // bean + choisi PAR DÉFAUT en cas d'ambiguïté
public class EmailNotification implements Notification { ... }  // implémentation e-mail (choisie par défaut)

@Service("sms")                                              // bean explicitement nommé "sms"
public class SmsNotification implements Notification { ... }   // implémentation SMS

// Pour forcer l'implémentation SMS :
public RappelService(@Qualifier("sms") Notification notif) { ... }  // @Qualifier cible le bean nommé "sms"</pre>
<h3>5. @Value : injecter de la configuration</h3>
<p>Le fichier <code>application.properties</code> contient des réglages sous forme <strong>clé=valeur</strong> (comme une liste de préférences). L'annotation <code>@Value</code> permet d'injecter une de ces valeurs directement dans un champ Java, sans la coder « en dur » dans le programme.</p>
<pre class="pseudo"># application.properties                          # fichier de configuration (format clé=valeur)
biblio.max-emprunts=5                             # on définit la propriété biblio.max-emprunts et on lui donne la valeur 5

// Dans un service :                              // côté code Java
@Value("\${biblio.max-emprunts}")                 // injecte la valeur de la propriété dans le champ ci-dessous
private int maxEmprunts;                          // ce champ vaut donc 5 au démarrage</pre>
<div class="warn">Erreur classique du débutant : créer un service avec new (MonService s = new MonService()) puis s'étonner que ses champs @Value ou ses dépendances soient null. Les annotations n'agissent QUE sur les beans créés par Spring !</div>`,
  exercises: [
    { type: "qcm", q: "Quelle annotation marque une classe de logique métier ?", opts: ["@Repository", "@Service", "@Value", "@Bean"], a: 1, exp: "@Service = les règles de gestion de l'application." },
    { type: "qcm", q: "Quelle annotation est la « mère » de @Service, @Repository et @Controller ?", opts: ["@SpringBootApplication", "@Component", "@Bean", "@Autowired"], a: 1, exp: "Les trois sont des spécialisations de @Component." },
    { type: "qcm", q: "Quels paquets sont scannés par le component scan ?", opts: ["Tous les paquets du classpath complet", "Le paquet de la classe @SpringBootApplication et ses sous-paquets", "Uniquement le paquet service", "Aucun, il faut tout lister"], a: 1, exp: "D'où l'importance de placer la classe principale à la racine du projet." },
    { type: "qcm", q: "Une classe @Service placée dans un paquet FRÈRE (hors racine) n'est pas injectée. Pourquoi ?", opts: ["Elle est privée", "Elle est hors du champ du component scan", "Il manque un point-virgule", "Un paquet frère doit être final"], a: 1, exp: "Hors du paquet racine = invisible pour Spring. La déplacer résout le problème." },
    { type: "qcm", q: "À quoi sert @Bean dans une classe @Configuration ?", opts: ["À injecter automatiquement une dépendance", "À déclarer comme bean un objet qu'on construit soi-même (ex. classe externe)", "À accélérer le démarrage", "À enregistrer un contrôleur web"], a: 1, exp: "Indispensable pour les classes de bibliothèques externes qu'on ne peut pas annoter." },
    { type: "vf", q: "Dans une méthode @Bean, utiliser new est une pratique normale.", a: true, exp: "C'est même le principe : tu construis l'objet, Spring le gère ensuite." },
    { type: "qcm", q: "Deux beans implémentent la même interface. Sans indication, que fait Spring à l'injection ?", opts: ["Il choisit au hasard", "Il refuse de démarrer : ambiguïté", "Il injecte les deux", "Il injecte null"], a: 1, exp: "« required a single bean, but 2 were found » — il faut @Primary ou @Qualifier." },
    { type: "qcm", q: "Comment désigner l'implémentation à injecter par défaut parmi plusieurs ?", opts: ["@Default", "@Primary sur l'implémentation préférée", "@First", "L'ordre alphabétique"], a: 1, exp: "@Primary règle l'ambiguïté globalement ; @Qualifier la règle au cas par cas." },
    { type: "input", q: "Quelle annotation injecte une valeur d'application.properties dans un champ ?", a: ["@Value", "Value"], ph: "@...", exp: "@Value(\"${cle.propriete}\")." },
    { type: "qcm", q: "Que vaut maxEmprunts si la propriété biblio.max-emprunts n'existe pas dans application.properties ?", opts: ["0", "L'application refuse de démarrer (placeholder non résolu)", "5", "null"], a: 1, exp: "Spring exige que la propriété existe — ou qu'on fournisse un défaut : @Value(\"${biblio.max-emprunts:3}\")." },
    { type: "qcm", q: "Tu crées un service avec <code>new MonService()</code> dans un test rapide : ses champs @Value valent…", opts: ["Leur valeur de configuration", "null/0 : les annotations n'agissent que sur les beans gérés par Spring", "Une erreur de compilation", "Des valeurs aléatoires"], a: 1, exp: "new = objet hors conteneur = aucune injection." },
    { type: "qcm", q: "Quelle annotation choisir pour une classe qui accédera à la base de données ?", opts: ["@Repository", "@Controller", "@Value", "@Entity"], a: 0, exp: "@Repository documente la couche d'accès aux données (et améliore la gestion des erreurs SQL)." },
    { type: "qcm", q: "Le rôle d'une classe @Configuration est de…", opts: ["Remplacer application.properties", "Regrouper des méthodes @Bean qui fabriquent des objets pour le conteneur", "Générer les fichiers de log", "Compiler les classes du projet"], a: 1, exp: "C'est la version « code Java » de la configuration." },
    { type: "vf", q: "@Service et @Component sont interchangeables techniquement, mais @Service documente mieux le rôle de la classe.", a: true, exp: "Même effet, meilleure lisibilité : on comprend l'architecture en lisant les annotations." },
    { type: "qcm", q: "Comment injecter précisément le bean nommé « sms » ?", opts: ["@Qualifier(\"sms\") sur le paramètre du constructeur", "@Primary(\"sms\")", "@Value(\"sms\")", "@Autowired(\"sms\") sur le champ"], a: 0, exp: "@Qualifier cible un bean par son nom quand plusieurs candidats existent." }
  ],
  final: {
    title: "Exercice final — La chasse aux beans",
    intro: `<p>Le projet bibliothèque contient ces classes. L'application refuse de démarrer ou se comporte mal. Analyse :</p>
<pre class="pseudo">// com.exemple.biblio.BiblioApplication  → @SpringBootApplication  (paquet RACINE)
// com.exemple.outils.CalculAmende      → @Service          (paquet com.exemple.outils : hors racine !)
// com.exemple.biblio.service.PretService → AUCUNE annotation  (donc pas un bean)
// com.exemple.biblio.service.EmailNotif  → @Service implements Notification
// com.exemple.biblio.service.SmsNotif    → @Service implements Notification  (2e implémentation : ambiguïté)

@Service                                                        // service géré par Spring
public class EmpruntService {                                   // il a besoin d'un PretService et d'une Notification
    public EmpruntService(PretService prets, Notification notif) { ... }  // injection par constructeur
}                                                               // fin de la classe</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi CalculAmende n'est-il jamais trouvé par Spring ?", opts: ["Il manque @Bean", "Son paquet com.exemple.outils est hors du paquet racine com.exemple.biblio", "La classe est déclarée abstraite", "Il manque le constructeur d'injection"], a: 1, exp: "Le scan part de com.exemple.biblio : com.exemple.outils est un paquet frère, invisible." },
      { type: "qcm", q: "Que se passe-t-il à l'injection de PretService ?", opts: ["Tout va bien", "Échec : « required a bean of type 'PretService' » — la classe n'a pas d'annotation", "Spring le crée quand même", "PretService devient null silencieusement"], a: 1, exp: "Sans stéréotype, pas de bean. Il faut ajouter @Service." },
      { type: "qcm", q: "Et pour le paramètre Notification ?", opts: ["Erreur : deux beans candidats (EmailNotif, SmsNotif), ambiguïté", "Spring injecte les deux", "Spring prend le premier par ordre alphabétique", "Aucune erreur possible"], a: 0, exp: "Deux implémentations sans @Primary ni @Qualifier = refus de démarrer." },
      { type: "qcm", q: "Tu veux que l'email soit le canal par défaut. Solution la plus propre :", opts: ["Supprimer SmsNotif", "@Primary sur EmailNotif", "Renommer SmsNotif en ZmsNotif", "Fusionner les deux classes"], a: 1, exp: "@Primary désigne le candidat par défaut sans rien casser." },
      { type: "qcm", q: "Le plafond d'emprunts (5) doit être configurable sans recompiler. Tu utilises…", opts: ["Une constante en dur", "biblio.max-emprunts=5 dans application.properties + @Value dans le service", "Une variable globale", "Une constante déclarée dans le code"], a: 1, exp: "Configuration externalisée : on change le fichier, pas le code." }
    ],
    solution: `<pre class="pseudo">// 1. Déplacer CalculAmende dans com.exemple.biblio.service
//    (ou un autre sous-paquet de com.exemple.biblio) pour qu'il soit scanné

// 2. Annoter la classe manquante :
@Service                                          // sans ça, PretService n'est pas un bean
public class PretService { ... }

// 3. Régler l'ambiguïté (2 implémentations de Notification) :
@Service @Primary                                 // @Primary = candidat par défaut
public class EmailNotif implements Notification { ... }

// 4. Externaliser le plafond :
//    application.properties → biblio.max-emprunts=5
@Service
public class EmpruntService {
    @Value("\${biblio.max-emprunts}")             // injecte la valeur 5 depuis la configuration
    private int maxEmprunts;                      // au lieu de coder 5 en dur
    ...
}</pre>
<p>Quatre pannes, quatre réflexes : vérifier le paquet, vérifier l'annotation, lever l'ambiguïté, externaliser la configuration. Ce sont les 4 bugs Spring les plus fréquents chez les débutants.</p>`
  }
};
var ECRITURE = {
  placeholder: "Écris ton code Java/Spring ici…",
  items: [
  { id: "spring-bean-config", title: "Déclarer un bean externe avec @Bean", level: 2,
    atoi: {"cmd":"./mvnw spring-boot:run","expected":"Démarrage sans erreur : la méthode @Bean moteurRecherche() est appelée UNE seule\nfois par Spring (new MoteurRecherche(\"fr\")), et l'objet obtenu est injecté dans\nCatalogueService. Aucune NoSuchBeanDefinitionException pour MoteurRecherche.\nTest rapide : catalogueService.chercher(\"dune\") renvoie exactement le résultat de\nmoteur.rechercher(\"dune\"). Si tu tentais new MoteurRecherche(...) dans le service,\ntu perdrais la gestion Spring : c'est le rôle de la classe @Configuration."},
    checklist: ["RechercheConfig porte @Configuration et contient une méthode annotée @Bean.","Le new MoteurRecherche(\"fr\") est UNIQUEMENT dans la méthode @Bean (classe externe).","CatalogueService est un @Service : private final + injection par constructeur.","chercher(mot) délègue à moteur.rechercher(mot), sans logique supplémentaire."],
    statement: "La bibliothèque utilise une classe externe <code>MoteurRecherche</code> (fournie par une dépendance, non modifiable) dont le constructeur attend une langue : <code>new MoteurRecherche(\"fr\")</code>. Écris une classe de configuration <code>RechercheConfig</code> qui expose ce moteur comme bean, puis un service <code>CatalogueService</code> qui le reçoit par injection et propose <code>chercher(String mot)</code> appelant <code>moteur.rechercher(mot)</code>.",
    hints: [
      "Une classe @Configuration contient des méthodes annotées @Bean qui retournent l'objet à gérer.",
      "Dans la méthode @Bean, le new est légitime : c'est le seul endroit où tu construis l'objet toi-même.",
      "Le service est un @Service classique : private final + injection par constructeur, comme à la leçon 2."
    ],
    solution: "@Configuration                                   // classe de configuration Spring\npublic class RechercheConfig {\n    @Bean                                        // l'objet retourné devient un bean\n    public MoteurRecherche moteurRecherche() {\n        return new MoteurRecherche(\"fr\");      // new légitime : classe externe\n    }\n}\n\n@Service                                         // service métier géré par Spring\npublic class CatalogueService {\n    private final MoteurRecherche moteur;        // la dépendance injectée\n\n    public CatalogueService(MoteurRecherche moteur) {\n        this.moteur = moteur;                    // fournie par le conteneur\n    }\n\n    public List<String> chercher(String mot) {\n        return moteur.rechercher(mot);           // délégation au moteur\n    }\n}",
    note: "Retiens la frontière : tes classes → annotations stéréotypes ; classes externes → méthode @Bean dans une @Configuration." }
  ]
};
