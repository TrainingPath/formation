  title: "L'architecture en couches",

<h3>1. Pourquoi des couches ?</h3>
<p>Une <strong>couche</strong> est un étage de l'application regroupant des classes qui jouent le même rôle. Tu as vu apparaître trois familles de classes. Ce n'est pas un hasard : c'est LE modèle d'<strong>architecture</strong> (l'organisation générale du code) des applications Spring. <strong>Analogie</strong> : un restaurant a une salle (le serveur prend la commande), une cuisine (le chef décide et cuisine) et un garde-manger (on y range et on y prend les ingrédients). Chacun son rôle, personne ne fait le travail de l'autre.</p>
<pre class="pseudo">        REQUÊTE HTTP                            // une requête arrive du navigateur
             ↓
┌───────────────────────────┐
│  CONTROLLER (couche web)  │  reçoit, valide la forme, répond   // le "serveur" de salle
└─────────────┬─────────────┘
              ↓
┌───────────────────────────┐
│  SERVICE (couche métier)  │  règles de gestion, décisions      // le "chef" en cuisine
└─────────────┬─────────────┘
              ↓
┌───────────────────────────┐
│ REPOSITORY (couche données)│ lit/écrit la base de données      // le "magasinier"
└───────────────────────────┘</pre>
<h3>2. La règle d'or : chacun son métier</h3>
<ul>
<li><strong>Controller</strong> : traduit HTTP ↔ Java. AUCUNE règle métier. Pas de SQL. Mince comme une feuille.</li>
<li><strong>Service</strong> : le cerveau. « Un membre ne peut pas emprunter plus de 5 livres », « un livre indisponible ne peut pas être emprunté ». Ne connaît RIEN de HTTP (pas de ResponseEntity ici !).</li>
<li><strong>Repository</strong> : le magasinier. Stocke et retrouve. AUCUNE décision.</li>
</ul>
<h3>3. Exemple complet : emprunter un livre</h3>
<pre class="pseudo">// CONTROLLER — traduit la requête, délègue, traduit la réponse
@PostMapping("/{livreId}/emprunts")                      // POST /api/livres/{livreId}/emprunts
public ResponseEntity&lt;Emprunt&gt; emprunter(@PathVariable int livreId,      // livre concerné (dans le chemin)
                                         @RequestBody EmpruntDto dto) {  // données de l'emprunt (dans le corps)
    Emprunt e = empruntService.emprunter(dto.getMembreId(), livreId);   // le contrôleur DÉLÈGUE au service
    return ResponseEntity.status(201).body(e);           // 201 Created + l'emprunt créé
}                                                        // fin de la méthode

// SERVICE — les règles, et rien que les règles
@Service                                                 // classe de logique métier
public class EmpruntService {
    public Emprunt emprunter(int membreId, int livreId) {  // la vraie logique de l'emprunt
        Membre m = membreRepo.parId(membreId);           // on récupère le membre depuis le repository
        Livre l = livreRepo.parId(livreId);              // on récupère le livre
        if (!l.estDisponible())              // règle 1 : le livre doit être disponible
            throw new LivreIndisponibleException(livreId);  // sinon on lève une exception métier
        if (m.nbEmpruntsEnCours() >= 5)      // règle 2 : pas plus de 5 emprunts par membre
            throw new PlafondAtteintException(membreId);    // sinon exception métier
        l.setDisponible(false);                          // le livre devient indisponible
        return empruntRepo.enregistrer(new Emprunt(m, l));  // on enregistre et on renvoie l'emprunt
    }                                                    // fin de la méthode
}                                                        // fin de la classe</pre>
<h3>4. Le sens unique des dépendances</h3>
<p>Une <strong>dépendance</strong> va toujours vers le bas : une couche peut appeler celle du dessous, jamais celle du dessus.</p>
<pre class="pseudo">Controller → Service → Repository       ✅ toujours vers le bas
Repository → Service                    ❌ JAMAIS vers le haut
Controller → Repository (direct)        ❌ on ne saute pas d'étage</pre>
<h3>5. Les paquets du projet</h3>
<pre class="pseudo">com.exemple.biblio                                     // paquet racine
├── controller/   LivreController, MembreController    // couche web
├── service/      CatalogueService, EmpruntService     // couche métier
├── repository/   LivreRepository, MembreRepository    // couche données
├── model/        Livre, Membre, Emprunt               // les objets du domaine
└── dto/          CreationLivreDto, InscriptionDto      // les contrats d'échange</pre>
<div class="warn">Le test infaillible : si tu vois ResponseEntity dans un service, ou un calcul de plafond dans un contrôleur, ou un if métier dans un repository — quelque chose est au mauvais étage.</div>
<div class="tip">Pourquoi tant d'efforts ? Parce que demain tu remplaceras le repository « en mémoire » par une vraie base (leçon 9) SANS TOUCHER ni au service ni au contrôleur. C'est ça, la récompense du découplage.</div>`,

<pre class="pseudo">@RestController                                          // contrôleur d'API JSON
@RequestMapping("/api/emprunts")                         // préfixe commun
public class EmpruntController {

    solution: `<pre class="pseudo">// SERVICE : les règles déménagent ici
@Service                                                 // couche métier
public class EmpruntService {
    private final LivreRepository livreRepo;             // dépendances (repositories) injectées
    private final MembreRepository membreRepo;
    private final EmpruntRepository empruntRepo;
    // ... constructeur d'injection ...

    public Emprunt emprunter(int membreId, int livreId) {  // toute la logique est ICI, réutilisable
        Livre l = livreRepo.parId(livreId);              // lecture des données
        Membre m = membreRepo.parId(membreId);           // lecture des données
        if (!l.estDisponible()) throw new LivreIndisponibleException(livreId);       // règle 1 → exception métier
        if (m.nbEmpruntsEnCours() >= 5) throw new PlafondAtteintException(membreId);  // règle 2 → exception métier
        l.setDisponible(false);                          // mise à jour de l'état
        return empruntRepo.enregistrer(new Emprunt(m, l));  // enregistrement
    }                                                    // fin de la méthode
}                                                        // fin de la classe

// CONTROLLER : mince à nouveau
@RestController                                          // couche web
@RequestMapping("/api/emprunts")                         // préfixe commun
public class EmpruntController {
    private final EmpruntService service;                // UNE seule dépendance : le service
    public EmpruntController(EmpruntService service) { this.service = service; }  // injection

    @PostMapping                                         // POST /api/emprunts
    public ResponseEntity&lt;Emprunt&gt; emprunter(@RequestBody EmpruntDto dto) {  // données de l'emprunt
        Emprunt e = service.emprunter(dto.getMembreId(), dto.getLivreId());  // délégation totale au service
        return ResponseEntity.status(201).body(e);       // 201 Created + emprunt
    }                                                    // fin de la méthode
}                                                        // fin de la classe</pre>
<p>Semaine 1 terminée ! Tu sais créer un projet, injecter des dépendances, exposer une API CRUD et l'organiser en couches. Semaine 2 : on branche une vraie base de données.</p>`
