<script>
var DAY = {
  num: 15,
  title: "Tester son application : MockMvc",
  subtitle: "Des tests qui appellent ton API sans démarrer de serveur.",
  theory: `
<h3>1. Pourquoi tester automatiquement ?</h3>
<p>Vérifier à la main avec curl après chaque modification ? Impossible à tenir. Un <strong>test automatisé</strong> est du code qui vérifie ton code : il se relance en une seconde, à chaque changement, et hurle dès qu'une <strong>régression</strong> (un bug réintroduit par une modification) apparaît. Spring Boot inclut <code>spring-boot-starter-test</code> qui apporte <em>JUnit 5</em> (le moteur de tests), <em>MockMvc</em> (le faux client HTTP), <em>Mockito</em> (pour fabriquer de faux objets) et <em>AssertJ</em> (pour écrire les vérifications).</p>
<h3>2. Tester un service : le test unitaire pur</h3>
<p>Un <strong>test unitaire</strong> teste une seule classe isolée. Grâce à l'injection par constructeur (leçon 2), un service se teste SANS Spring :</p>
<pre class="pseudo">class CatalogueServiceTest {                                      // classe de test du service

    LivreRepository repoFactice = mock(LivreRepository.class);   // Mockito : un FAUX repository
    CatalogueService service = new CatalogueService(repoFactice);  // service testé, construit à la main

    @Test                                                        // @Test = méthode de test (JUnit l'exécute)
    void parId_leveExceptionSiAbsent() {                          // le nom décrit le scénario testé
        when(repoFactice.findById(99L)).thenReturn(Optional.empty());  // le faux : pour 99, renvoie une boîte vide

        assertThrows(LivreIntrouvableException.class,             // on vérifie que l'exception attendue…
                     () -> service.parId(99L));                   // …est bien levée par cet appel
    }                                                            // fin du test
}                                                                // fin de la classe</pre>
<ul>
<li><code>mock(...)</code> crée un FAUX repository : pas de base, pas de Spring.</li>
<li><code>when(...).thenReturn(...)</code> programme le faux : « si on te demande 99, réponds boîte vide ».</li>
<li><code>assertThrows</code> vérifie que l'exception attendue est bien levée.</li>
</ul>
<h3>3. Tester un contrôleur : @WebMvcTest et MockMvc</h3>
<p><code>@WebMvcTest</code> ne charge que la couche web (léger). <code>MockMvc</code> est un faux client HTTP : il envoie des requêtes simulées à ton contrôleur. <code>@MockBean</code> remplace un bean réel (le service) par un faux.</p>
<pre class="pseudo">@WebMvcTest(LivreController.class)      // charge SEULEMENT la couche web (ce contrôleur)
class LivreControllerTest {

    @Autowired MockMvc mvc;             // le faux client HTTP (injecté par Spring)
    @MockBean CatalogueService service; // le service réel est remplacé par un faux

    @Test
    void getLivre_renvoie200EtLeJson() throws Exception {        // scénario nominal
        when(service.parId(1L)).thenReturn(new Livre("Dune", "Herbert"));  // le faux service répond un livre

        mvc.perform(get("/api/livres/1"))                        // on simule GET /api/livres/1
           .andExpect(status().isOk())                           // on attend un statut 200
           .andExpect(jsonPath("$.titre").value("Dune"));        // et un JSON dont titre = Dune
    }                                                            // fin du test

    @Test
    void getLivre_renvoie404SiInconnu() throws Exception {       // scénario "introuvable"
        when(service.parId(99L)).thenThrow(new LivreIntrouvableException(99L));  // le faux lève l'exception

        mvc.perform(get("/api/livres/99"))                       // GET /api/livres/99
           .andExpect(status().isNotFound());                    // on attend un 404
    }                                                            // fin du test
}                                                                // fin de la classe</pre>
<p>MockMvc simule les requêtes HTTP <strong>sans démarrer Tomcat</strong> : rapide, et il traverse le vrai routage, la vraie validation, le vrai @RestControllerAdvice.</p>
<h3>4. Tester un POST avec corps JSON</h3>
<pre class="pseudo">mvc.perform(post("/api/livres")                                  // on simule POST /api/livres
       .contentType(MediaType.APPLICATION_JSON)                 // on précise que le corps est du JSON
       .content("{\\"titre\\":\\"Dune\\",\\"auteur\\":\\"Herbert\\"}"))  // le corps JSON envoyé
   .andExpect(status().isCreated());                            // on attend un 201 Created

// Et le cas invalide (leçon 12 en action) :
mvc.perform(post("/api/livres")                                  // POST avec un corps incomplet
       .contentType(MediaType.APPLICATION_JSON)                 // toujours du JSON
       .content("{\\"auteur\\":\\"Herbert\\"}"))          // titre manquant !
   .andExpect(status().isBadRequest());                         // on attend un 400 Bad Request</pre>
<h3>5. Le test d'intégration complet : @SpringBootTest</h3>
<p>Un <strong>test d'intégration</strong> vérifie que plusieurs couches fonctionnent ensemble. <code>@SpringBootTest</code> démarre l'application entière :</p>
<pre class="pseudo">@SpringBootTest    // démarre TOUTE l'application (avec la base H2)
class BibliothequeIntegrationTest {
    // vrais beans, vraie base H2 : on teste le circuit complet
}                                                                // fin de la classe</pre>
<pre class="pseudo">Pyramide des tests :   beaucoup d'unitaires (rapides)
                        quelques @WebMvcTest (couche web)
                        peu de @SpringBootTest (lents mais complets)</pre>
<div class="warn">Nomme tes tests comme des phrases : parId_leveExceptionSiAbsent(). Quand il échoue dans 6 mois, le nom seul te dira QUOI est cassé. Un test nommé test1() est une énigme cruelle pour ton futur toi.</div>
<div class="tip">Prends le réflexe des trois cas pour chaque endpoint : le cas nominal (200/201), le cas absent (404), le cas invalide (400). Trois tests par route = une API sous surveillance complète.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'intérêt principal des tests automatisés ?", opts: ["Documenter le code source", "Détecter immédiatement les régressions, à chaque modification", "Remplacer la documentation", "Accélérer l'application"], a: 1, exp: "Le filet de sécurité qui permet de modifier sans peur." },
    { type: "qcm", q: "Que fait mock(LivreRepository.class) ?", opts: ["Ouvre la base", "Crée un faux repository programmable, sans base ni Spring", "Supprime le repository", "Teste le repository"], a: 1, exp: "Le mock isole le service de ses dépendances réelles." },
    { type: "qcm", q: "Que programme when(repo.findById(99L)).thenReturn(Optional.empty()) ?", opts: ["Une vraie requête", "La réponse du faux : « pour 99, renvoie une boîte vide »", "Une exception", "Un délai"], a: 1, exp: "On scénarise le comportement de la dépendance pour tester NOTRE logique." },
    { type: "qcm", q: "Pourquoi peut-on tester CatalogueService sans Spring ?", opts: ["On ne peut pas", "Injection par constructeur : new CatalogueService(fauxRepo) suffit", "Les services sont statiques", "Grâce à Tomcat"], a: 1, exp: "La récompense de la leçon 2 : les dépendances se remplacent à la main." },
    { type: "qcm", q: "Que vérifie assertThrows(LivreIntrouvableException.class, () -> service.parId(99L)) ?", opts: ["Que la méthode réussit", "Que l'appel lève EXACTEMENT cette exception", "Que l'exception est évitée", "Le temps d'exécution"], a: 1, exp: "Tester les cas d'erreur est aussi important que les cas de succès." },
    { type: "qcm", q: "Que charge @WebMvcTest(LivreController.class) ?", opts: ["Toute l'application", "Seulement la couche web autour de ce contrôleur", "La base H2", "Le navigateur"], a: 1, exp: "Léger et rapide : ni services réels, ni base." },
    { type: "qcm", q: "À quoi sert @MockBean dans un @WebMvcTest ?", opts: ["À créer un vrai bean", "À remplacer un bean du contexte (le service) par un faux", "À supprimer le bean", "À le renommer"], a: 1, exp: "Le contrôleur reçoit le faux service — on maîtrise ses réponses." },
    { type: "qcm", q: "MockMvc démarre-t-il un vrai serveur Tomcat ?", opts: ["Oui", "Non : il simule les requêtes en interne, d'où sa rapidité", "Uniquement au premier démarrage", "Oui, un Tomcat éphémère"], a: 1, exp: "Pas de réseau, pas de port — mais le vrai routage et la vraie validation." },
    { type: "qcm", q: "Que vérifie jsonPath(\"$.titre\").value(\"Dune\") ?", opts: ["Le statut", "Que le champ titre du JSON de réponse vaut Dune", "L'en-tête", "Le temps de réponse"], a: 1, exp: "$ = racine du JSON ; $.titre = le champ titre." },
    { type: "qcm", q: "Pour tester un POST, que faut-il fournir à MockMvc ?", opts: ["Rien", "contentType(APPLICATION_JSON) + content(le corps JSON)", "Un fichier", "Un mot de passe"], a: 1, exp: "Comme un vrai client : type de contenu + corps." },
    { type: "qcm", q: "Le test du POST sans titre attend status().isBadRequest(). Quelle chaîne est ainsi testée ?", opts: ["Seulement le contrôleur", "DTO + @Valid + le handler de validation du @RestControllerAdvice (leçons 12-13)", "La base", "Le CSS"], a: 1, exp: "MockMvc traverse la vraie mécanique de validation et d'erreurs." },
    { type: "qcm", q: "Que fait @SpringBootTest ?", opts: ["Un test rapide", "Démarre le contexte complet : vrais beans, vraie base H2 — test d'intégration", "Un test du CSS", "Rien"], a: 1, exp: "Le plus réaliste, le plus lent : à réserver aux parcours critiques." },
    { type: "qcm", q: "Selon la pyramide des tests, quels tests doivent être les PLUS nombreux ?", opts: ["Les @SpringBootTest", "Les tests unitaires : rapides et ciblés", "Les tests manuels", "Aucun"], a: 1, exp: "Base large d'unitaires, sommet étroit d'intégration." },
    { type: "vf", q: "Un bon nom de test décrit le scénario et le résultat attendu, comme creerLivre_renvoie400SiTitreManquant.", a: true, exp: "Le nom EST la documentation : en cas d'échec, on sait quoi chercher." },
    { type: "qcm", q: "Quels sont les « trois cas » à tester pour chaque endpoint ?", opts: ["GET, POST, DELETE", "Nominal (200/201), absent (404), invalide (400)", "Compilation, exécution, déploiement", "Un seul suffit"], a: 1, exp: "Le tiercé gagnant de la couverture utile." }
  ],
  final: {
    title: "Exercice final — La suite de tests de l'emprunt",
    intro: `<p>Les tests du POST /api/emprunts, le cœur métier du projet :</p>
<pre class="pseudo">@WebMvcTest(EmpruntController.class)                             // teste seulement la couche web
class EmpruntControllerTest {
    @Autowired MockMvc mvc;                                     // faux client HTTP
    @MockBean EmpruntService service;                          // service simulé

    @Test
    void emprunter_renvoie201() throws Exception {              // scénario nominal
        when(service.emprunter(12L, 3L))                        // quand on emprunte le livre 3 pour le membre 12…
            .thenReturn(new EmpruntDto(1L, "Dune", "Diallo", LocalDate.now()));  // …le faux renvoie ce DTO

        mvc.perform(post("/api/emprunts")                       // simule POST /api/emprunts
               .contentType(MediaType.APPLICATION_JSON)        // corps JSON
               .content("{\\"membreId\\":12,\\"livreId\\":3}"))  // le corps envoyé
           .andExpect(status().isCreated())                    // on attend 201
           .andExpect(jsonPath("$.titreLivre").value("Dune")); // et titreLivre = Dune
    }                                                          // fin du test

    @Test
    void emprunter_renvoie409SiIndisponible() throws Exception {  // scénario conflit
        when(service.emprunter(12L, 3L))                        // quand on emprunte…
            .thenThrow(new LivreIndisponibleException(3L));     // …le faux lève l'exception

        mvc.perform(post("/api/emprunts")                       // POST /api/emprunts
               .contentType(MediaType.APPLICATION_JSON)        // corps JSON
               .content("{\\"membreId\\":12,\\"livreId\\":3}"))  // le corps
           .andExpect(status().isConflict());                  // on attend 409 Conflict
    }                                                          // fin du test
}                                                              // fin de la classe</pre>`,
    questions: [
      { type: "qcm", q: "Dans le premier test, pourquoi le service est-il simulé (@MockBean) ?", opts: ["Le vrai est trop lent", "On teste LA COUCHE WEB isolément : le service est scénarisé, pas exécuté", "Le vrai n'existe pas", "Pour éviter les 404"], a: 1, exp: "Chaque test cible une couche ; la logique du service a ses PROPRES tests unitaires." },
      { type: "qcm", q: "Que vérifie andExpect(jsonPath(\"$.titreLivre\").value(\"Dune\")) ?", opts: ["Le statut 201", "Que le DTO renvoyé au client contient bien titreLivre = Dune", "Le contenu de la base", "La date"], a: 1, exp: "On valide le contrat JSON exact que recevront les clients." },
      { type: "qcm", q: "Le second test vérifie status().isConflict(). Quelle mécanique est traversée pour produire ce 409 ?", opts: ["Aucune", "L'exception simulée remonte au @RestControllerAdvice qui la traduit en 409 (leçon 13)", "MockMvc invente le 409", "Le service renvoie 409 lui-même"], a: 1, exp: "MockMvc teste le VRAI circuit exception → advice → statut." },
      { type: "qcm", q: "Il manque un test important selon le « tiercé » de la leçon. Lequel ?", opts: ["Le cas 200", "Le cas invalide : POST sans membreId → 400 (validation)", "Le cas du succès partiel", "Aucun ne manque"], a: 1, exp: "Nominal ✅ (201), conflit ✅ (409)… reste l'invalide (400) et l'introuvable (404)." },
      { type: "qcm", q: "Après un refactoring du service, emprunter_renvoie201 échoue soudain. Qu'as-tu gagné ?", opts: ["Du temps perdu", "La régression est détectée AVANT la production — le test a fait son travail", "Rien", "Un bug de test"], a: 1, exp: "C'est exactement pour ce moment-là que les tests existent." }
    ],
    solution: `<pre class="pseudo">// Le test manquant (le cas invalide) :
@Test
void emprunter_renvoie400SiMembreIdManquant() throws Exception {
    mvc.perform(post("/api/emprunts")                          // POST /api/emprunts
           .contentType(MediaType.APPLICATION_JSON)           // corps JSON
           .content("{\\"livreId\\":3}"))              // membreId absent
       .andExpect(status().isBadRequest())                    // on attend 400
       .andExpect(jsonPath("$.membreId").exists());  // le message de validation présent

    // Remarque : aucun when(...) nécessaire — la validation
    // rejette la requête AVANT d'atteindre le service.
}

// Et le 404 :
@Test
void emprunter_renvoie404SiMembreInconnu() throws Exception {
    when(service.emprunter(99L, 3L))                           // le faux service…
        .thenThrow(new MembreIntrouvableException(99L));       // …lève "membre introuvable"
    mvc.perform(post("/api/emprunts")                          // POST /api/emprunts
           .contentType(MediaType.APPLICATION_JSON)           // corps JSON
           .content("{\\"membreId\\":99,\\"livreId\\":3}"))     // membre inexistant
       .andExpect(status().isNotFound());                     // on attend 404
}</pre>
<p>Quatre tests, quatre statuts (201, 400, 404, 409) : l'endpoint le plus important du projet est sous alarme permanente.</p>`
  }
};
var ECRITURE = {
  placeholder: "Écris ton code Java/Spring ici…",
  items: [
  { id: "spring-test-service", title: "Tester le plafond d'emprunts", level: 3,
    atoi: {"cmd":"./mvnw test -Dtest=EmpruntServiceTest","expected":"Le test s'exécute SANS démarrer Spring (repositories simulés par Mockito), donc en\nune fraction de seconde. Sortie attendue :\n  Tests run: 1, Failures: 0, Errors: 0, Skipped: 0\n  BUILD SUCCESS\nSi tu retires la garde du plafond dans le service, le test échoue : assertThrows ne\nvoit pas l'exception, OU verify(never()).save(any()) détecte un save() interdit."},
    checklist: ["Les trois repositories sont des mock(...) et le service est construit à la main avec eux.","Le décor est programmé : findById(12L) -> Optional.of(membre) et count... -> 5L.","assertThrows(PlafondEmpruntsAtteintException.class, () -> service.emprunter(12L, 3L)).","verify(empruntRepo, never()).save(any()) prouve qu'aucun emprunt n'a été enregistré."],
    statement: "Écris le test unitaire (sans Spring) de la règle du plafond : dans <code>EmpruntServiceTest</code>, la méthode <code>emprunter_leveExceptionSiPlafondAtteint()</code>. Simule les repositories avec Mockito : le membre 12 existe, et <code>countByMembreIdAndDateRetourIsNull(12L)</code> renvoie 5 (le plafond). Vérifie que <code>PlafondEmpruntsAtteintException</code> est levée et que <code>empruntRepo.save(...)</code> n'a JAMAIS été appelé (<code>verify(empruntRepo, never()).save(any())</code>).",
    hints: [
      "Trois mocks : membreRepo, livreRepo, empruntRepo — puis new EmpruntService(les trois).",
      "Programme les deux comportements : findById(12L) → Optional.of(membre), count... → 5L.",
      "assertThrows d'abord, puis verify(empruntRepo, never()).save(any()) pour prouver qu'on n'a rien enregistré."
    ],
    solution: "class EmpruntServiceTest {\n\n    MembreRepository membreRepo = mock(MembreRepository.class);\n    LivreRepository livreRepo = mock(LivreRepository.class);\n    EmpruntRepository empruntRepo = mock(EmpruntRepository.class);\n\n    // le service testé, construit À LA MAIN avec les faux (merci la leçon 2)\n    EmpruntService service =\n        new EmpruntService(membreRepo, livreRepo, empruntRepo);\n\n    @Test\n    void emprunter_leveExceptionSiPlafondAtteint() {\n        // ARRANGE : le décor\n        Membre m = new Membre(\"Diallo\", \"a@b.be\");\n        when(membreRepo.findById(12L)).thenReturn(Optional.of(m));\n        when(empruntRepo.countByMembreIdAndDateRetourIsNull(12L))\n            .thenReturn(5L);                        // déjà 5 emprunts en cours\n\n        // ACT + ASSERT : l'exception attendue\n        assertThrows(PlafondEmpruntsAtteintException.class,\n                     () -> service.emprunter(12L, 3L));\n\n        // ASSERT bonus : RIEN n'a été enregistré\n        verify(empruntRepo, never()).save(any());\n    }\n}",
    note: "Le schéma Arrange-Act-Assert (préparer, agir, vérifier) structure tous les tests du monde. Et verify(never()) prouve le non-événement : aussi précieux que l'exception elle-même." }
  ]
};
