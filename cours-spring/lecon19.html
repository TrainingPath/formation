<h3>1. Les logs : le journal de bord</h3>
<p>Un <strong>log</strong> (« journal ») est une trace écrite de ce que fait l'application. <strong>Journaliser</strong>, c'est enregistrer ces traces. Fini les <code>System.out.println</code> ! En production, on journalise avec <strong>SLF4J</strong> (la bibliothèque de journalisation intégrée à Spring Boot) :</p>
<pre class="pseudo">@Service                                         // couche métier
public class EmpruntService {
    private static final Logger log = LoggerFactory.getLogger(EmpruntService.class);  // le journal de cette classe

    public EmpruntDto emprunter(Long membreId, Long livreId) {  // méthode métier
        log.info("Emprunt demandé : membre={}, livre={}", membreId, livreId);  // trace INFO (événement normal)
        ...
        log.warn("Plafond atteint pour le membre {}", membreId);  // trace WARN (anormal mais géré)
        ...
        log.error("Échec inattendu de l'emprunt", exception);   // trace ERROR (avec la stack !)
    }                                            // fin de la méthode
}                                                // fin de la classe</pre>
<pre class="pseudo">Niveaux :  TRACE &lt; DEBUG &lt; INFO &lt; WARN &lt; ERROR   // du plus bavard au plus grave
# application.properties :
logging.level.root=INFO                          # niveau par défaut de toute l'application
logging.level.com.exemple.biblio=DEBUG      ← ton code, plus bavard
logging.file.name=logs/biblio.log                # écrit aussi les logs dans ce fichier</pre>
<ul>
<li>Les <code>{}</code> sont remplacés par les arguments : pas de concaténation coûteuse.</li>
<li>INFO : événements normaux notables ; WARN : anormal mais géré ; ERROR : il faut regarder.</li>
</ul>
<h3>2. Spring Boot Actuator : l'application s'ausculte</h3>
<p><strong>Actuator</strong> ajoute des <strong>endpoints</strong> techniques (des URL spéciales) pour surveiller l'application : sa santé, ses statistiques, sa version.</p>
<pre class="pseudo">Dépendance : spring-boot-starter-actuator        // apporte les endpoints de supervision

GET /actuator/health   → {"status":"UP"}      ← la base répond ? le disque va ?
GET /actuator/info     → version, description    // informations sur l'application
GET /actuator/metrics  → mémoire, requêtes HTTP, temps de réponse...   // mesures chiffrées

# Exposer prudemment :
management.endpoints.web.exposure.include=health,info,metrics   # on n'expose QUE ces 3 endpoints</pre>
<p><code>/actuator/health</code> est LA sonde des orchestrateurs et des supervisions : « l'application est-elle vivante ? ». Elle agrège l'état de la base, du disque, etc.</p>
<h3>3. Empaqueter et lancer</h3>
<pre class="pseudo">./mvnw package                                   # compile et empaquette toute l'application
→ target/biblio-0.0.1-SNAPSHOT.jar    ← le « fat jar » : TOUT dedans (Tomcat compris)

java -jar biblio-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod   # lance le jar avec le profil prod</pre>
<p>Un <strong>fat jar</strong> (« gros jar ») est un fichier unique contenant ton code, ses dépendances et le serveur Tomcat. Un seul fichier à déployer sur n'importe quelle machine avec Java. C'est aussi ce jar qu'on met dans une image Docker.</p>
<h3>4. Les transactions : @Transactional</h3>
<p>Une <strong>transaction</strong> regroupe plusieurs écritures en un bloc « tout ou rien » : soit tout réussit, soit tout est annulé (<em>rollback</em>). Emprunter = modifier le livre ET créer l'emprunt. Si le deuxième échoue, le premier doit être annulé !</p>
<pre class="pseudo">@Transactional                    // tout ou rien (une seule transaction)
public EmpruntDto emprunter(Long membreId, Long livreId) {  // méthode métier
    l.setDisponible(false);       // modification 1 : le livre devient indisponible
    empruntRepo.save(e);          // modification 2 : on enregistre l'emprunt
    // exception ici → TOUT est annulé (rollback), le livre reste disponible
}                                 // fin de la méthode</pre>
<p>Pose <code>@Transactional</code> sur les méthodes de service qui font PLUSIEURS écritures liées.</p>

<div class="tip">log.debug(\"Détail : {}\", objetCouteux) avec le niveau INFO actif : le message n'est pas construit du tout. C'est pour ça qu'on utilise les {} au lieu de la concaténation — la paresse de SLF4J est une optimisation.</div>`,
