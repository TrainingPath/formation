  { id: "spring-exam-reserver", title: "Synthèse : la méthode reserver()", level: 3,
    atoi: {"cmd":"./mvnw spring-boot:run\ncurl -i -u membre@club.be:motdepasse -X POST http://localhost:8080/api/reservations \\\n  -H \"Content-Type: application/json\" -d '{\"seanceId\":7}'","expected":"Cas nominal : HTTP/1.1 201 Created + le ReservationDto en JSON.\nConsole : \"Réservation demandée ...\" puis \"Réservation N créée\".\nSelon l'état : adhérent/séance inconnu -> 404 ; déjà réservé pour cette séance ->\n409 (DejaReserveException) ; séance complète -> 409 (SeanceCompleteException).\nL'ordre : adhérent(404) -> séance(404) -> doublon R2(409) -> capacité R1(409) -> save."},
    checklist: ["La méthode est @Transactional et démarre par un log.info(adhérent, séance).","Ordre des vérifications : charger l'adhérent (404) -> la séance (404) -> R2 doublon (409) -> R1 capacité (409).","R2 utilise existsByAdherentIdAndSeanceId ; R1 compare countBySeanceId(...) à s.getCapacite().","Fin : reservationRepo.save(new Reservation(...)) puis ReservationDto.depuis(r)."],

    solution: "@Service\npublic class ReservationService {\n    private static final Logger log =\n        LoggerFactory.getLogger(ReservationService.class);\n    private final AdherentRepository adherentRepo;\n    private final SeanceRepository seanceRepo;\n    private final ReservationRepository reservationRepo;\n    // ... constructeur d'injection ...\n\n    @Transactional\n    public ReservationDto reserver(String emailAdherent, Long seanceId) {\n        log.info(\"Réservation demandée : adhérent={}, séance={}\",\n                 emailAdherent, seanceId);\n\n        Adherent a = adherentRepo.findByEmail(emailAdherent)\n            .orElseThrow(() -> new AdherentIntrouvableException(emailAdherent));\n\n        Seance s = seanceRepo.findById(seanceId)\n            .orElseThrow(() -> new SeanceIntrouvableException(seanceId));\n\n        // R2 : pas deux réservations pour la même séance\n        if (reservationRepo.existsByAdherentIdAndSeanceId(a.getId(), seanceId))\n            throw new DejaReserveException(seanceId);\n\n        // R1 : capacité de la séance\n        long occupees = reservationRepo.countBySeanceId(seanceId);\n        if (occupees >= s.getCapacite())\n            throw new SeanceCompleteException(seanceId);\n\n        Reservation r = reservationRepo.save(\n            new Reservation(a, s, LocalDateTime.now()));\n        log.info(\"Réservation {} créée\", r.getId());\n        return ReservationDto.depuis(r);\n    }\n}",
    note: "Compare avec ta version : ordre des vérifications, exceptions parlantes, transaction, logs, DTO. Si tout y est, tu viens d'écrire du Spring professionnel sans filet." },
  { id: "spring-exam-advice", title: "Synthèse : l'advice du nouveau domaine", level: 2,
    atoi: {"cmd":"# provoque chaque famille d'erreur :\ncurl -i http://localhost:8080/api/seances/9999          # séance inconnue -> 404\ncurl -i -X POST http://localhost:8080/api/reservations -H \"Content-Type: application/json\" -d '{\"seanceId\":7}'   # séance complète/doublon -> 409","expected":"Séance/adhérent inconnu : HTTP/1.1 404 + {\"status\":404,\"message\":\"...\"} (message métier).\nSéance complète ou doublon : HTTP/1.1 409 + {\"status\":409,\"message\":\"...\"}.\nErreur imprévue : HTTP/1.1 500 + {\"status\":500,\"message\":\"Une erreur interne est\nsurvenue\"} — message NEUTRE côté client, alors que le détail complet part dans\nlog.error côté serveur (aucune fuite d'information)."},
    checklist: ["Un même @ExceptionHandler groupe les classes proches : @ExceptionHandler({A.class, B.class}).","404 pour Seance/Adherent Introuvable ; 409 pour SeanceComplete/DejaReserve.","Le filet @ExceptionHandler(Exception.class) renvoie 500 avec un message NEUTRE (pas ex.getMessage()).","Le détail de l'erreur 500 va dans log.error(...) côté serveur, jamais dans la réponse."],
    statement: "Écris le <code>@RestControllerAdvice</code> de la salle de sport : <code>SeanceIntrouvableException</code> et <code>AdherentIntrouvableException</code> → 404 ; <code>SeanceCompleteException</code> et <code>DejaReserveException</code> → 409 ; le filet <code>Exception</code> → 500 générique (sans fuite d'information). Réutilise un record <code>ErreurDto(int status, String message)</code>.",
    hints: [
      "Un @ExceptionHandler peut attraper plusieurs classes : @ExceptionHandler({A.class, B.class}).",
      "Le paramètre du handler groupé : RuntimeException ex suffit (leur ancêtre commun).",
      "Le handler 500 renvoie un message NEUTRE — les détails vont dans log.error."
    ],
    solution: "@RestControllerAdvice\npublic class GestionErreurs {\n    private static final Logger log =\n        LoggerFactory.getLogger(GestionErreurs.class);\n\n    @ExceptionHandler({SeanceIntrouvableException.class,\n                       AdherentIntrouvableException.class})\n    @ResponseStatus(HttpStatus.NOT_FOUND)                     // 404\n    public ErreurDto introuvable(RuntimeException ex) {\n        return new ErreurDto(404, ex.getMessage());\n    }\n\n    @ExceptionHandler({SeanceCompleteException.class,\n                       DejaReserveException.class})\n    @ResponseStatus(HttpStatus.CONFLICT)                      // 409\n    public ErreurDto conflit(RuntimeException ex) {\n        return new ErreurDto(409, ex.getMessage());\n    }\n\n    @ExceptionHandler(Exception.class)                        // le filet\n    @ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)         // 500\n    public ErreurDto imprevu(Exception ex) {\n        log.error(\"Erreur inattendue\", ex);                 // TOUT en interne\n        return new ErreurDto(500, \"Une erreur interne est survenue\"); // RIEN dehors\n    }\n}\n\npublic record ErreurDto(int status, String message) {}",
    note: "Trois handlers, deux familles métier, un filet : le squelette d'erreurs de TOUTES tes futures API Spring. Recopie-le sans honte — les professionnels le font aussi." }
