  theory: `
<h3>1. Rappel express : HTTP et REST</h3>
<p>Le web fonctionne par <strong>requêtes/réponses HTTP</strong>. <strong>HTTP</strong> est le « langage » que parlent les navigateurs et les serveurs. Un <strong>client</strong> (navigateur, application mobile…) envoie une <strong>requête</strong> vers une <strong>URL</strong> (l'adresse d'une ressource, comme <code>/livres</code>) en précisant une <strong>méthode</strong> (le verbe qui dit ce qu'on veut faire) :</p>
<pre class="pseudo">GET     → lire une ressource        GET /livres        // je veux LIRE la liste des livres
POST    → créer une ressource       POST /livres       // je veux CRÉER un nouveau livre
PUT     → remplacer une ressource   PUT /livres/3      // je veux REMPLACER le livre n°3
DELETE  → supprimer une ressource   DELETE /livres/3   // je veux SUPPRIMER le livre n°3</pre>
<p>Une <strong>API REST</strong> (API = « interface de programmation », la porte par laquelle d'autres programmes parlent au tien ; REST = un style d'organisation) expose ainsi des ressources (livres, membres…) via des URL, et répond généralement en <strong>JSON</strong> (un format texte universel pour représenter des données, ex. <code>{"titre":"Dune"}</code>).</p>
<h3>2. Le premier contrôleur</h3>
<p>Un <strong>contrôleur</strong> est la classe qui reçoit les requêtes web et décide quoi répondre — comme un standardiste qui reçoit les appels et les oriente.</p>
<pre class="pseudo">@RestController                                     // cette classe reçoit des requêtes HTTP et renvoie des données (pas des pages HTML)
public class LivreController {                       // le contrôleur des livres : la porte d'entrée web

    @GetMapping("/hello")                            // cette méthode répond aux requêtes GET sur l'URL /hello
    public String hello() {                          // le texte renvoyé deviendra le corps de la réponse
        return "Bienvenue dans la bibliothèque !";   // ce texte est envoyé au client
    }                                                // fin de la méthode
}                                                    // fin de la classe</pre>
<ul>
<li><code>@RestController</code> : cette classe reçoit des requêtes HTTP et renvoie directement des données (pas des pages HTML).</li>
<li><code>@GetMapping("/hello")</code> : la méthode répond aux requêtes <strong>GET</strong> sur l'URL <code>/hello</code>. On appelle ce couple (URL + méthode Java) un <strong>endpoint</strong> (« point de terminaison »).</li>
<li>Lance l'application → <code>http://localhost:8080/hello</code> affiche le texte. Magique ? Non : component scan + inversion de contrôle, c'est Spring qui appelle ta méthode !</li>
</ul>
<h3>3. Renvoyer du JSON</h3>
<p>Renvoie un objet Java : Spring le convertit automatiquement en JSON (grâce à la bibliothèque <strong>Jackson</strong>, incluse d'office). Jackson lit les <strong>getters</strong> (les méthodes <code>getXxx()</code>) pour savoir quels champs mettre dans le JSON.</p>
<pre class="pseudo">public class Livre {                    // la classe du cours Java !
    private int id;                     // + getters (obligatoires pour que le champ apparaisse dans le JSON)
    private String titre;               // le titre du livre
    private String auteur;              // l'auteur du livre
}                                       // fin de la classe

@GetMapping("/livres")                  // GET /livres : renvoie la liste des livres
public List&lt;Livre&gt; tous() {             // le type de retour est une liste de Livre
    return List.of(new Livre(1, "Dune", "Herbert"),        // on construit une liste de 2 livres
                   new Livre(2, "Fondation", "Asimov"));   // Spring la convertira automatiquement en JSON
}                                       // fin de la méthode</pre>
<pre class="pseudo">→ GET /livres répond :                                   // ce que le client reçoit en retour :
[{"id":1,"titre":"Dune","auteur":"Herbert"},              // premier livre, au format JSON
 {"id":2,"titre":"Fondation","auteur":"Asimov"}]          // second livre (les crochets [] = une liste)</pre>
<h3>4. Organiser les URL : @RequestMapping</h3>
<p><code>@RequestMapping</code> posé sur la classe définit un <strong>préfixe</strong> commun à toutes ses routes : on évite de répéter <code>/livres</code> partout.</p>
<pre class="pseudo">@RestController                         // contrôleur d'API JSON
@RequestMapping("/livres")              // préfixe commun à TOUTES les URL de cette classe
public class LivreController {
    @GetMapping                         // pas de chemin → GET /livres (le préfixe seul)
    public List&lt;Livre&gt; tous() { ... }   // renvoie tous les livres

    @GetMapping("/nouveautes")          // GET /livres/nouveautes (préfixe + /nouveautes)
    public List&lt;Livre&gt; nouveautes() { ... }  // renvoie les nouveautés
}                                       // fin de la classe</pre>
<h3>5. Les codes de statut HTTP</h3>
<p>Chaque réponse HTTP porte un <strong>code de statut</strong> : un nombre à trois chiffres qui résume le résultat (comme une note sur un bulletin).</p>
<pre class="pseudo">200 OK           → tout va bien (valeur par défaut)
201 Created      → une ressource a été créée
404 Not Found    → ressource introuvable
400 Bad Request  → requête invalide (le client a mal demandé)
500 Internal Server Error → bug côté serveur</pre>
<div class="warn">@Controller (sans Rest) sert aux pages HTML (leçon 18) : ses méthodes renvoient des NOMS DE VUES. Pour une API JSON, c'est bien @RestController qu'il faut — le mélange des deux est l'erreur classique qui produit une erreur « Circular view path ».</div>
<div class="tip">Teste tes API avec ton navigateur (pour les GET) puis avec un outil comme curl, Postman ou Bruno (pour POST/PUT/DELETE). Le navigateur seul ne suffit plus dès la leçon 6.</div>`,

<pre class="pseudo">@RestController                                     // contrôleur d'API JSON
