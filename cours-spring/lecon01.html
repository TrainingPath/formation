  theory: `
<h3>1. C'est quoi, un « framework » ?</h3>
<p>Dans le cours Java, tu as tout écrit toi-même : la lecture au clavier, les boucles de menu, la sauvegarde dans des fichiers. Un <strong>framework</strong> (mot anglais, prononcé « fraime-work », qui veut dire « cadre de travail ») est un ensemble de code déjà écrit qui te fournit tout ce travail répétitif : tu écris uniquement la logique propre à TON application, le framework s'occupe du reste (serveur web, connexion à la base de données, sécurité…).</p>
<p>Une <strong>analogie</strong> : construire une application sans framework, c'est bâtir une maison en fabriquant soi-même chaque brique, chaque fil électrique, chaque tuyau. Avec un framework, la maison est déjà construite (murs, électricité, plomberie) : tu n'as plus qu'à décorer les pièces à ta façon.</p>
<p>Différence clé avec une simple <strong>bibliothèque</strong> (un lot d'outils réutilisables que l'on appelle quand on en a besoin) : avec une bibliothèque, <em>ton code appelle</em> la bibliothèque. Avec un framework, <em>c'est le framework qui appelle ton code</em> au bon moment. On appelle ça l'<strong>inversion de contrôle</strong> : ce n'est plus toi le chef d'orchestre, c'est le framework (on y revient dès demain).</p>
<h3>2. Spring et Spring Boot</h3>
<p><strong>Spring</strong> est LE framework Java des entreprises (banques, assurances, e-commerce…). <strong>Spring Boot</strong> (« boot » = démarrage) est sa version « prête à l'emploi » : configuration automatique, serveur web <strong>Tomcat intégré</strong> (Tomcat est le logiciel qui reçoit les requêtes du navigateur ; « intégré » veut dire fourni à l'intérieur, sans installation séparée), démarrage en une commande. En 2 minutes tu as une application web qui tourne.</p>
<h3>3. Créer le projet : Spring Initializr</h3>
<p>Rendez-vous sur <code>start.spring.io</code> (le générateur officiel, appelé <strong>Spring Initializr</strong>) : tu choisis <strong>Maven</strong> (l'outil qui gère le projet, voir plus bas), <strong>Java</strong>, la dépendance <strong>Spring Web</strong>, et tu télécharges un projet tout prêt. Voici la <strong>structure</strong> (l'arborescence des dossiers) obtenue :</p>
<pre class="pseudo">mon-projet/                              // le dossier racine (le sommet) de ton projet
├── pom.xml                              // la liste des dépendances, lue par Maven
└── src/main/                            // src = source : le dossier du code principal
    ├── java/com/exemple/demo/           // tes fichiers Java, rangés par « paquets » (packages)
    │   └── DemoApplication.java         // le point d'entrée : il contient la méthode main
    └── resources/                       // les fichiers qui ne sont PAS du Java (configuration, images…)
        └── application.properties       // le fichier de configuration (port, base de données…)</pre>
<h3>4. Le point d'entrée</h3>
<pre class="pseudo">@SpringBootApplication                                   // annotation (étiquette) qui active toute la configuration automatique de Spring
public class DemoApplication {                           // une classe Java normale, comme dans le cours Java (public = visible partout)
    public static void main(String[] args) {             // main = LA méthode par où le programme démarre (tu la connais déjà en Java)
        SpringApplication.run(DemoApplication.class, args);  // cette seule ligne allume tout Spring : serveur web, configuration, tout
    }                                                    // fin de la méthode main
}                                                        // fin de la classe</pre>
<ul>
<li>Le <code>main</code> que tu connais est toujours là — mais il ne fait qu'une chose : démarrer Spring.</li>
<li><code>@SpringBootApplication</code> est une <strong>annotation</strong> : une étiquette (elle commence toujours par <code>@</code>) posée sur une classe ou une méthode, que Spring lit pour savoir quoi faire. Tu en as déjà croisé une : <code>@Override</code> (leçon 14 de Java).</li>
<li>Au lancement, Spring démarre Tomcat sur le <strong>port 8080</strong> (le port est un « numéro de porte » par lequel les programmes échangent sur le réseau) : ouvre <code>http://localhost:8080</code> dans ton navigateur (<em>localhost</em> = ta propre machine).</li>
</ul>
<h3>5. pom.xml et Maven</h3>
<p><strong>Maven</strong> est l'outil qui <strong>gère le projet</strong> : il télécharge les bibliothèques listées dans <code>pom.xml</code> (ces bibliothèques s'appellent les <strong>dépendances</strong>, car ton projet « dépend » d'elles pour fonctionner) et compile le tout. Plus besoin de lancer <code>javac</code> à la main ! Une dépendance se déclare ainsi :</p>
<pre class="pseudo">&lt;dependency&gt;                                         // début d'UNE dépendance (une brique à télécharger)
    &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;      // groupId = l'organisation qui publie la brique
    &lt;artifactId&gt;spring-boot-starter-web&lt;/artifactId&gt; // artifactId = le nom précis de la brique : ici le « starter web »
&lt;/dependency&gt;                                        // fin de la dépendance</pre>
<pre class="pseudo"># Lancer l'application depuis le terminal :
./mvnw spring-boot:run                               # mvnw = le « wrapper » Maven fourni avec le projet ; il compile puis démarre l'appli</pre>
<div class="warn">Si le port 8080 est déjà occupé, l'application refuse de démarrer (« Port 8080 was already in use »). Soit tu fermes l'autre programme, soit tu changes le port dans application.properties : <code>server.port=8081</code>.</div>
<div class="tip">Un starter (<code>spring-boot-starter-web</code>, <code>spring-boot-starter-data-jpa</code>…) est un paquet de dépendances cohérentes. C'est la grande idée de Spring Boot : une ligne dans le pom = une capacité complète.</div>`,

    { type: "qcm", q: "Qu'est-ce qu'un « starter » Spring Boot ?", opts: ["Un tutoriel", "Un lot de dépendances cohérentes qui active une capacité (web, JPA…)", "Un bouton de démarrage", "Une classe abstraite"], a: 1, exp: "spring-boot-starter-web apporte d'un coup Spring MVC + Tomcat + JSON." },
    { type: "qcm", q: "Quelle commande lance l'application depuis le terminal ?", opts: ["javac DemoApplication.java", "./mvnw spring-boot:run", "run spring", "start.spring.io"], a: 1, exp: "Le wrapper Maven (mvnw) compile puis démarre l'application." },
