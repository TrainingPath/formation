<script>
var DAY = {
  num: 12,
  title: "Valider les données : Bean Validation",
  subtitle: "On bouche enfin le trou de la leçon 6 : plus jamais de titre null.",
  theory: `
<h3>1. Ne jamais faire confiance au client</h3>
<p><strong>Valider</strong>, c'est vérifier que les données reçues respectent des règles avant de les utiliser. Rappel de la leçon 6 : un POST avec un champ manquant crée un objet à moitié vide, sans erreur. Règle absolue du développement web : <strong>tout ce qui vient de l'extérieur est suspect</strong>. La validation doit être systématique.</p>
<h3>2. Les annotations de validation</h3>
<p><strong>Bean Validation</strong> est le standard Java qui permet d'exprimer ces règles avec des annotations (chaque règle s'appelle une <strong>contrainte</strong>). Ajoute la dépendance <code>spring-boot-starter-validation</code>, puis annote le DTO :</p>
<pre class="pseudo">public class CreationLivreDto {                  // DTO de création d'un livre

    @NotBlank(message = "Le titre est obligatoire")          // titre : ni null, ni vide, ni que des espaces
    @Size(max = 200, message = "Titre trop long (200 caractères max)")  // longueur maximale : 200 caractères
    private String titre;                        // le titre proposé

    @NotBlank(message = "L'auteur est obligatoire")          // auteur : ni null ni vide
    private String auteur;                       // l'auteur proposé

    @Min(value = 1450, message = "Année invalide (avant l'imprimerie !)")  // année >= 1450
    @Max(value = 2100, message = "Année invalide")           // année <= 2100
    private int annee;                           // l'année de parution

    // getters/setters                           // requis (par Jackson et la validation)
}                                                // fin du DTO</pre>
<pre class="pseudo">@NotNull      pas null
@NotBlank     pas null, pas vide, pas que des espaces (pour les String)
@NotEmpty     pas null ni vide (collections, String)
@Size(min, max)   longueur ou taille
@Min / @Max       bornes numériques
@Email            format d'adresse email
@Positive @PositiveOrZero  nombres positifs
@Past / @Future   dates passées / futures
@Pattern(regexp)  expression régulière (motif de texte)</pre>
<h3>3. Déclencher la validation : @Valid</h3>
<pre class="pseudo">@PostMapping                                     // POST /api/livres
public ResponseEntity&lt;Livre&gt; creer(@Valid @RequestBody CreationLivreDto dto) {  // @Valid ACTIVE la validation du dto
    ...                                          // ici, dto est déjà garanti conforme aux contraintes
}                                                // fin de la méthode</pre>
<p>Sans <code>@Valid</code>, les annotations du DTO sont DÉCORATIVES ! Avec lui, un DTO invalide déclenche une <code>MethodArgumentNotValidException</code> → réponse <strong>400 Bad Request</strong> automatique, avant même d'entrer dans ta méthode.</p>
<h3>4. Des messages d'erreur exploitables</h3>
<p>Par défaut le corps du 400 est technique. On le rendra propre à la leçon 13, mais voici la cible :</p>
<pre class="pseudo">{
  "status": 400,
  "erreurs": {
    "titre": "Le titre est obligatoire",
    "annee": "Année invalide (avant l'imprimerie !)"
  }
}</pre>
<h3>5. Valider où ?</h3>
<pre class="pseudo">Couche web (DTO + @Valid)   → la FORME : champs présents, formats, bornes
Couche service              → le FOND : « cet ISBN existe déjà »,
                              « ce membre a atteint son plafond »
Base de données             → le filet final : NOT NULL, UNIQUE (leçon 8)</pre>
<p>Trois lignes de défense — chacune attrape ce que la précédente ne peut pas voir.</p>
<div class="warn">@NotBlank ne s'applique qu'aux String. Pour un objet (LocalDate, Integer…), utilise @NotNull. Et attention : un int primitif ne peut JAMAIS être null (il vaut 0 par défaut) — un @NotNull dessus ne sert à rien ; utilise Integer si « absent » doit être détectable.</div>
<div class="tip">Écris des messages d'erreur pour des HUMAINS : « Le titre est obligatoire » vaut mieux que « must not be blank ». C'est le client de ton API (souvent toi-même dans 3 mois) qui te remerciera.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la règle d'or concernant les données envoyées par un client ?", opts: ["Leur faire confiance", "Ne jamais leur faire confiance : tout valider", "Les ignorer", "Les stocker d'abord, vérifier ensuite"], a: 1, exp: "Toute donnée externe est suspecte jusqu'à validation." },
    { type: "qcm", q: "Différence entre @NotNull et @NotBlank ?", opts: ["Aucune", "@NotBlank refuse aussi les chaînes vides ou faites d'espaces (String uniquement)", "@NotNull est pour les String", "@NotBlank accepte null"], a: 1, exp: "\"   \" passe @NotNull mais pas @NotBlank." },
    { type: "qcm", q: "Quelle annotation valide un format d'adresse email ?", opts: ["@Courriel", "@Email", "@Valid", "@Contact"], a: 1, exp: "@Email vérifie la forme générale de l'adresse." },
    { type: "qcm", q: "Sans @Valid sur le paramètre du contrôleur, que font les annotations du DTO ?", opts: ["Elles valident quand même", "Rien : elles sont ignorées", "Elles ralentissent", "Elles créent des erreurs 500"], a: 1, exp: "L'oubli n°1 : @Valid est l'interrupteur qui active la validation." },
    { type: "qcm", q: "Un DTO invalide avec @Valid produit automatiquement…", opts: ["500", "400 Bad Request, sans exécuter ta méthode", "404", "201"], a: 1, exp: "MethodArgumentNotValidException → 400 : la requête est refusée en amont." },
    { type: "qcm", q: "Comment limiter un titre à 200 caractères ?", opts: ["@Max(200)", "@Size(max = 200)", "@Length", "@MaxSize(200)"], a: 1, exp: "@Size pour les longueurs de String/collections ; @Max pour les valeurs numériques." },
    { type: "qcm", q: "@Min(1450) sur annee refuse…", opts: ["1449 et moins", "1450", "1451", "Rien"], a: 0, exp: "@Min est inclusif : 1450 passe, 1449 est refusé." },
    { type: "qcm", q: "Pourquoi @NotNull sur un champ int est-il inutile ?", opts: ["Les int sont toujours valides", "Un int primitif ne peut pas être null : absent, il vaut 0 — utiliser Integer pour détecter l'absence", "@NotNull est réservé aux String", "C'est utile en fait"], a: 1, exp: "Le JSON sans le champ → int = 0, indétectable. Integer = null, détectable." },
    { type: "qcm", q: "« Cet ISBN existe déjà en base » : quelle ligne de défense ?", opts: ["DTO + @Valid", "La couche service (règle de fond, nécessite la base)", "Le CSS", "Le navigateur"], a: 1, exp: "La forme au DTO, le fond au service, le filet en base." },
    { type: "qcm", q: "Quel rôle jouent les contraintes NOT NULL / UNIQUE de la base dans ce dispositif ?", opts: ["Aucun", "Le filet de sécurité final si les couches du dessus laissent passer", "Elles remplacent tout", "Elles valident les emails"], a: 1, exp: "Dernière ligne de défense : même un bug applicatif ne corrompt pas les données." },
    { type: "vf", q: "Valider uniquement côté interface (formulaire web/mobile) suffit à protéger l'API.", a: false, exp: "N'importe qui peut appeler l'API sans passer par ton interface (curl !). La validation serveur est non négociable." },
    { type: "qcm", q: "Quelle annotation pour exiger une date d'échéance dans le futur ?", opts: ["@Past", "@Future", "@After", "@FutureOrPresent"], a: 1, exp: "@Future refuse aujourd'hui et le passé." },
    { type: "input", q: "Quelle annotation place-t-on sur le paramètre @RequestBody pour activer la validation ?", a: ["@Valid", "Valid"], ph: "@...", exp: "@Valid @RequestBody CreationLivreDto dto." },
    { type: "qcm", q: "Comment personnaliser le message d'une contrainte ?", opts: ["Impossible", "L'attribut message : @NotBlank(message = \"Le titre est obligatoire\")", "Dans le contrôleur", "Avec un commentaire"], a: 1, exp: "Chaque annotation accepte message = \"...\" — écris-les pour des humains." },
    { type: "qcm", q: "Un @Pattern(regexp = \"^[0-9]{13}$\") sur isbn valide…", opts: ["Exactement 13 chiffres", "Au moins 13 caractères", "Des lettres", "Un email"], a: 0, exp: "Regex : début ^, 13 chiffres, fin $. Parfait pour un ISBN-13." }
  ],
  final: {
    title: "Exercice final — L'inscription blindée",
    intro: `<p>Le DTO d'inscription des membres, maintenant sous protection :</p>
<pre class="pseudo">public class InscriptionDto {                    // DTO d'inscription d'un membre
    @NotBlank(message = "Le nom est obligatoire") // nom : ni null ni vide
    @Size(min = 2, max = 100, message = "Le nom doit faire entre 2 et 100 caractères")  // longueur 2 à 100
    private String nom;                          // le nom proposé

    @NotBlank(message = "L'email est obligatoire") // email : ni null ni vide
    @Email(message = "Format d'email invalide")   // format d'email correct
    private String email;                        // l'email proposé
    // getters/setters
}                                                // fin du DTO

@PostMapping                                     // POST /api/membres
public ResponseEntity&lt;Membre&gt; inscrire(@Valid @RequestBody InscriptionDto dto) {  // @Valid = validation de forme
    if (membreService.emailExiste(dto.getEmail())) {  // validation de FOND : cet email est-il déjà pris ?
        return ResponseEntity.status(409).build();   // 409 Conflict (conflit : doublon)
    }                                            // fin du if
    return ResponseEntity.status(201).body(membreService.inscrire(dto));  // 201 Created + membre
}                                                // fin de la méthode</pre>`,
    questions: [
      { type: "qcm", q: "POST {\"nom\":\"\", \"email\":\"a@b.be\"} : réponse ?", opts: ["201", "400 : le nom vide viole @NotBlank (et @Size)", "409", "500"], a: 1, exp: "La validation de forme bloque avant l'entrée dans la méthode." },
      { type: "qcm", q: "POST {\"nom\":\"Diallo\", \"email\":\"pas-un-email\"} : réponse ?", opts: ["201", "400 : @Email refuse le format", "409", "204"], a: 1, exp: "Le format d'email est vérifié par la contrainte." },
      { type: "qcm", q: "POST valide mais avec un email déjà utilisé : réponse ?", opts: ["400", "409 Conflict : la vérification de FOND, dans le code", "201", "500"], a: 1, exp: "@Valid ne peut pas connaître la base : le doublon est détecté par le service → 409." },
      { type: "qcm", q: "Pourquoi la vérification du doublon n'est-elle pas une annotation sur le DTO ?", opts: ["Par paresse", "Elle nécessite d'interroger la base : c'est une règle de fond, pas de forme", "C'est possible avec @Unique", "Les annotations sont lentes"], a: 1, exp: "Forme (hors contexte) → annotations ; fond (contexte, base) → service." },
      { type: "qcm", q: "Un bug contourne un jour ces deux contrôles. Qu'est-ce qui empêche ENCORE le doublon ?", opts: ["Rien", "La contrainte UNIQUE sur la colonne email (leçon 8)", "Le navigateur", "Jackson"], a: 1, exp: "Troisième ligne de défense : la base refuse l'insertion. Défense en profondeur." }
    ],
    solution: `<pre class="pseudo">// Les trois lignes de défense de l'inscription :

// 1. FORME — le DTO (@Valid déclenche) :
//    nom présent, 2-100 caractères ; email présent, bien formé.
//    → sinon 400 + messages clairs.

// 2. FOND — le service :
//    l'email n'est pas déjà pris (existsByEmail, leçon 10).
//    → sinon 409 Conflict.

// 3. FILET — la base :
//    email UNIQUE, nom NOT NULL (leçon 8).
//    → même un bug ne corrompt pas les données.

// Une attaque, trois murs. C'est la « défense en profondeur ».</pre>
<p>Il reste un détail qui fâche : les réponses d'erreur (400, 409…) ont des corps peu lisibles ou vides. Demain : des erreurs propres et uniformes pour toute l'API.</p>`
  }
};
