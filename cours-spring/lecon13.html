  title: "Gérer les erreurs : @ControllerAdvice",
  subtitle: "Transformer les exceptions métier en réponses HTTP propres — une fois pour toutes.",
  theory: `
<h3>1. Le problème : des exceptions qui fuient</h3>
<p>Rappel : une <strong>exception</strong> est un objet représentant une erreur ; la « lever » (<code>throw</code>), c'est signaler qu'un problème empêche de continuer. Depuis la leçon 7, nos services lèvent des <strong>exceptions métier</strong> (<code>LivreIntrouvableException</code>…). Non gérées, elles remontent jusqu'à Spring qui répond un <strong>500</strong> avec la <em>stack trace</em> (la liste technique des appels) — moche, imprécis, et ça révèle l'intérieur de ton application (mauvais pour la sécurité).</p>
<h3>2. Les exceptions métier du projet</h3>
<pre class="pseudo">public class LivreIntrouvableException extends RuntimeException {  // exception métier (non vérifiée)
    public LivreIntrouvableException(Long id) {                   // reçoit l'id du livre concerné
        super("Livre introuvable : " + id);                      // construit le message affichable
    }                                                            // fin du constructeur
}                                                                // fin de la classe
// De même : MembreIntrouvableException, LivreIndisponibleException,
//           PlafondEmpruntsAtteintException, EmailDejaUtiliseException...</pre>
<p>Des <code>RuntimeException</code> (exceptions « non vérifiées », leçon Java 16) : les services les lèvent librement, sans <code>throws</code> en cascade dans les signatures.</p>
<h3>3. Le gestionnaire global : @RestControllerAdvice</h3>
<p><code>@RestControllerAdvice</code> désigne une classe qui « conseille » tous les contrôleurs : un endroit unique pour attraper les exceptions. Chaque méthode <code>@ExceptionHandler</code> traite un type d'exception, et <code>@ResponseStatus</code> fixe le code HTTP renvoyé.</p>
<pre class="pseudo">@RestControllerAdvice          // « conseille » TOUS les contrôleurs (gestion d'erreurs centralisée)
public class GestionErreurs {

    @ExceptionHandler(LivreIntrouvableException.class)    // attrape ce type d'exception, partout
    @ResponseStatus(HttpStatus.NOT_FOUND)                  // → 404
    public ErreurDto livreIntrouvable(LivreIntrouvableException ex) {  // reçoit l'exception attrapée
        return new ErreurDto(404, ex.getMessage());       // fabrique le corps de la réponse
    }                                                     // fin du handler

    @ExceptionHandler(LivreIndisponibleException.class)   // autre type d'exception
    @ResponseStatus(HttpStatus.CONFLICT)                   // → 409
    public ErreurDto indisponible(LivreIndisponibleException ex) {  // reçoit l'exception
        return new ErreurDto(409, ex.getMessage());       // corps : statut + message
    }                                                     // fin du handler
}                                                         // fin de la classe

public record ErreurDto(int status, String message) {}   // format d'erreur renvoyé (un record simple)</pre>
<p>Chaque méthode <code>@ExceptionHandler</code> attrape UN type d'exception, où qu'elle soit levée dans l'application, et fabrique la réponse. Les contrôleurs restent purs : plus un seul try/catch chez eux.</p>
<h3>4. Le cas spécial : les erreurs de validation</h3>
<p>On tient la promesse de la leçon 12 — un joli corps pour les 400 :</p>
<pre class="pseudo">@ExceptionHandler(MethodArgumentNotValidException.class)  // exception levée quand un @Valid échoue
@ResponseStatus(HttpStatus.BAD_REQUEST)                   // → 400
public Map&lt;String, String&gt; validation(MethodArgumentNotValidException ex) {  // renvoie une map champ→message
    Map&lt;String, String&gt; erreurs = new HashMap&lt;&gt;();       // dictionnaire des erreurs (champ → message)
    ex.getBindingResult().getFieldErrors().forEach(err -&gt;  // pour chaque champ en erreur…
        erreurs.put(err.getField(), err.getDefaultMessage()));  // …on note champ → message
    return erreurs;                                       // renvoyé au client en JSON
}                                                         // fin du handler
// → {"titre": "Le titre est obligatoire", "annee": "Année invalide"}</pre>
<h3>5. Le filet final</h3>
<pre class="pseudo">@ExceptionHandler(Exception.class)      // tout le reste (le filet de sécurité attrape-tout)
@ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)        // → 500
public ErreurDto imprevu(Exception ex) {                 // attrape n'importe quelle exception imprévue
    // journaliser ex EN INTERNE (leçon 19)... mais ne rien révéler au client :
    return new ErreurDto(500, "Une erreur interne est survenue");  // message générique, sans détail technique
}                                                         // fin du handler</pre>
<div class="warn">Ne renvoie JAMAIS ex.getMessage() d'une exception TECHNIQUE au client : les messages SQL ou de stack peuvent révéler la structure de ta base. Message générique dehors, détails dans les logs dedans.</div>
<div class="tip">La table de traduction à retenir : Introuvable→404, Règle métier violée (conflit d'état)→409, Donnée invalide→400, Imprévu→500. Une exception métier = un code HTTP, toujours le même, partout.</div>`,

    { type: "vf", q: "Un @ExceptionHandler défini dans le @RestControllerAdvice n'agit que sur les exceptions du contrôleur où l'erreur est survenue.", a: false, exp: "Advice = global : il couvre tous les contrôleurs de l'application." },

    { type: "qcm", q: "Où placer la classe ErreurDto ?", opts: ["Dans controller/", "Dans dto/ : elle fait partie du contrat de l'API", "Dans model/", "Dans la base"], a: 1, exp: "Le format d'erreur EST un contrat : les clients s'appuient dessus." },
    { type: "qcm", q: "Quel est LE bénéfice d'un format d'erreur uniforme sur toute l'API ?", opts: ["C'est joli", "Les clients traitent toutes les erreurs avec le même code, quel que soit l'endpoint", "Ça compresse mieux", "Aucun"], a: 1, exp: "Prévisibilité = une API agréable à consommer." }

<pre class="pseudo">POST /api/emprunts  {"membreId": 12, "livreId": 3}       // la requête envoyée

      { type: "qcm", q: "Le développeur du client mobile te remercie lundi. Pourquoi ?", opts: ["Tu as payé le café", "Chaque erreur a désormais un statut fiable et un corps exploitable : il affiche des messages précis à l'utilisateur", "Tu as supprimé les erreurs", "L'API ne renvoie plus que des 200"], a: 1, exp: "Une API aux erreurs prévisibles, c'est la moitié de la qualité perçue." }

    solution: `<pre class="pseudo">// Le GestionErreurs complet du projet bibliothèque :
@RestControllerAdvice                                            // gestion d'erreurs globale
public class GestionErreurs {

    @ExceptionHandler({LivreIntrouvableException.class,          // un handler pour PLUSIEURS types
                       MembreIntrouvableException.class,
                       EmpruntIntrouvableException.class})
    @ResponseStatus(HttpStatus.NOT_FOUND)                          // 404
    public ErreurDto introuvable(RuntimeException ex) {           // reçoit l'exception attrapée
        return new ErreurDto(404, ex.getMessage());              // corps : statut + message métier
    }

    @ExceptionHandler({LivreIndisponibleException.class,         // les conflits d'état métier
                       PlafondEmpruntsAtteintException.class,
                       EmailDejaUtiliseException.class})
    @ResponseStatus(HttpStatus.CONFLICT)                           // 409
    public ErreurDto conflit(RuntimeException ex) {
        return new ErreurDto(409, ex.getMessage());
    }

    @ExceptionHandler(MethodArgumentNotValidException.class)      // 400 (échec de @Valid)
    @ResponseStatus(HttpStatus.BAD_REQUEST)
    public Map&lt;String, String&gt; validation(MethodArgumentNotValidException ex) {
        Map&lt;String, String&gt; erreurs = new HashMap&lt;&gt;();           // dictionnaire champ→message
        ex.getBindingResult().getFieldErrors().forEach(e -&gt;      // pour chaque champ invalide…
            erreurs.put(e.getField(), e.getDefaultMessage()));   // …on note l'erreur
        return erreurs;                                          // renvoyé en JSON
    }

    @ExceptionHandler(Exception.class)                             // 500 (le filet final)
    @ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)
    public ErreurDto imprevu(Exception ex) {
        return new ErreurDto(500, "Une erreur interne est survenue");  // message générique
    }
}</pre>
<p>Remarque : un handler peut attraper PLUSIEURS types ({A.class, B.class}). Quatre méthodes couvrent toute l'API — et chaque nouvelle exception métier trouvera sa place en une ligne.</p>`
