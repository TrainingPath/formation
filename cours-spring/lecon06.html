<h3>1. Recevoir du JSON : @RequestBody</h3>
<p>Jusqu'ici, l'API ne faisait que LIRE (des GET). Pour <strong>créer</strong> un livre, le client envoie un <strong>POST</strong> (le verbe HTTP « je crée ») avec un <strong>corps</strong> (le « body » : les données jointes à la requête) au format JSON. L'en-tête <code>Content-Type: application/json</code> prévient le serveur que ce corps est du JSON. Spring le convertit automatiquement en objet Java :</p>
<pre class="pseudo">POST /api/livres                              // méthode POST vers l'URL /api/livres (je veux CRÉER)
Content-Type: application/json                // en-tête : le corps envoyé est du JSON

{"titre": "Dune", "auteur": "Herbert"}        // le CORPS de la requête : les données du nouveau livre

@PostMapping                                              // cette méthode répond aux requêtes POST
public ResponseEntity&lt;Livre&gt; creer(@RequestBody Livre livre) {  // @RequestBody = convertir le JSON reçu en objet Livre
    Livre cree = catalogue.ajouter(livre);               // on demande au service d'enregistrer le livre
    return ResponseEntity.status(201).body(cree);        // 201 Created + le livre créé (avec son id) en JSON
}                                                        // fin de la méthode</pre>
<p><code>@RequestBody</code> = « le corps JSON de la requête, converti en objet ». C'est le symétrique de la conversion sortante de la leçon 4.</p>
<h3>2. Le DTO : ne pas exposer ses entités</h3>
<p>Un <strong>DTO</strong> (<em>Data Transfer Object</em> = « objet de transfert de données ») est une classe dédiée aux échanges avec l'extérieur — une sorte de formulaire officiel qui liste exactement les champs autorisés. Pourquoi ne pas utiliser directement la classe métier ?</p>
<ul>
<li>Le client ne doit pas pouvoir fixer certains champs (l'<code>id</code>, <code>dateInscription</code>…).</li>
<li>On ne veut pas exposer certains champs (mot de passe !).</li>
<li>L'API garde un <strong>contrat</strong> stable (une promesse sur les champs échangés) même si la classe interne change.</li>
</ul>
<pre class="pseudo">// Ce que le client a le droit d'envoyer, et rien d'autre :
public class CreationLivreDto {              // un DTO : simple boîte de données pour les échanges
    private String titre;                    // le titre proposé
    private String auteur;                   // l'auteur proposé — pas d'id, pas de champ "disponible" !
    // getters/setters                       // Jackson en a besoin pour lire et écrire les champs
}                                            // fin du DTO

@PostMapping                                             // POST /api/livres
public ResponseEntity&lt;Livre&gt; creer(@RequestBody CreationLivreDto dto) {  // le JSON reçu devient un DTO
    Livre cree = catalogue.ajouter(dto.getTitre(), dto.getAuteur());     // on ne passe QUE les champs autorisés
    return ResponseEntity.status(201).body(cree);        // 201 Created + le livre créé
}                                                        // fin de la méthode</pre>
<h3>3. PUT : modifier</h3>
<p><strong>PUT</strong> est le verbe « je remplace » : le chemin dit QUELLE ressource, le corps dit son NOUVEL état.</p>
<pre class="pseudo">@PutMapping("/{id}")                                     // PUT /api/livres/{id} : remplacer le livre {id}
public ResponseEntity&lt;Livre&gt; modifier(@PathVariable int id,      // id du livre à modifier (dans le chemin)
                                      @RequestBody CreationLivreDto dto) {  // nouvelles données (dans le corps)
    Livre maj = catalogue.mettreAJour(id, dto);          // on demande la mise à jour au service
    if (maj == null) return ResponseEntity.notFound().build();  // livre introuvable → 404
    return ResponseEntity.ok(maj);                       // sinon : 200 + le livre modifié
}                                                        // fin de la méthode</pre>
<h3>4. DELETE : supprimer</h3>
<p><strong>DELETE</strong> est le verbe « je supprime ». Après une suppression, il n'y a rien à renvoyer : le statut idéal est <strong>204 No Content</strong>.</p>
<pre class="pseudo">@DeleteMapping("/{id}")                                  // DELETE /api/livres/{id} : supprimer le livre {id}
public ResponseEntity&lt;Void&gt; supprimer(@PathVariable int id) {  // Void = aucun corps à renvoyer
    boolean ok = catalogue.supprimer(id);                // true si la suppression a bien eu lieu
    if (!ok) return ResponseEntity.notFound().build();   // rien à supprimer → 404
    return ResponseEntity.noContent().build();           // 204 No Content : supprimé, rien à renvoyer
}                                                        // fin de la méthode</pre>
<h3>5. Tester avec curl</h3>
<p><code>curl</code> est un petit programme en ligne de commande qui envoie des requêtes HTTP — parfait pour tester une API sans navigateur.</p>
<pre class="pseudo">curl -X POST http://localhost:8080/api/livres \\         # -X POST : envoyer une requête de type POST
     -H "Content-Type: application/json" \\              # -H : ajouter un en-tête (ici : le corps est du JSON)
     -d '{"titre":"Dune","auteur":"Herbert"}'            # -d : les données (le corps) à envoyer

curl -X DELETE http://localhost:8080/api/livres/3        # supprimer le livre n°3</pre>
<div class="warn">Si le JSON reçu ne correspond pas à la classe (champ mal orthographié), Jackson met simplement le champ à null — sans erreur ! Un livre créé avec titre=null passe inaperçu… jusqu'à la leçon 12 (validation), qui bouchera ce trou.</div>
<div class="tip">Le CRUD complet en REST : POST=Créer, GET=Lire, PUT=Modifier, DELETE=Supprimer. Compare avec la leçon 20 du cours Java : la bibliothèque en console faisait déjà tout ça — seule l'interface change !</div>`,

    { type: "qcm", q: "Correspondance CRUD → REST correcte :", opts: ["Créer=GET, Lire=POST", "Créer=POST, Lire=GET, Modifier=PUT, Supprimer=DELETE", "Tout se fait en POST", "Créer=PUT, Supprimer=GET"], a: 1, exp: "Le quatuor du REST — à connaître par cœur." },
    { type: "qcm", q: "Pourquoi renvoyer l'objet créé (avec son id) dans la réponse du POST ?", opts: ["Pour alourdir la réponse", "Le client a besoin de l'id généré pour manipuler la ressource ensuite", "C'est obligatoire en Java", "Pour déboguer uniquement"], a: 1, exp: "Sans l'id retourné, le client ne peut pas faire GET/PUT/DELETE sur sa création." }

    intro: `<p>Voici le contrôleur complété. Repère les subtilités :</p>
<pre class="pseudo">@RestController                              // contrôleur d'API JSON
@RequestMapping("/api/livres")               // préfixe commun à toutes les routes
public class LivreController {
    private final CatalogueService catalogue; // service métier injecté
    public LivreController(CatalogueService catalogue) { this.catalogue = catalogue; }  // injection par constructeur

    @GetMapping                 public List&lt;Livre&gt; tous() { return catalogue.tous(); }  // GET /api/livres → la liste
    @GetMapping("/{id}")        public ResponseEntity&lt;Livre&gt; un(@PathVariable int id) { ... }  // GET /api/livres/{id}

    @PostMapping                                             // POST /api/livres : créer un livre
    public ResponseEntity&lt;Livre&gt; creer(@RequestBody CreationLivreDto dto) {  // JSON reçu → DTO
        Livre cree = catalogue.ajouter(dto.getTitre(), dto.getAuteur());     // on n'utilise que les champs du DTO
        return ResponseEntity.status(201).body(cree);        // 201 Created + livre créé
    }                                                        // fin de creer

    @DeleteMapping("/{id}")                                  // DELETE /api/livres/{id}
    public ResponseEntity&lt;Void&gt; supprimer(@PathVariable int id) {  // id du livre à supprimer
        return catalogue.supprimer(id)                       // la suppression a-t-elle réussi ?
            ? ResponseEntity.noContent().build()             // oui → 204 No Content
            : ResponseEntity.notFound().build();             // non → 404 Not Found
    }                                                        // fin de supprimer
}                                                            // fin de la classe</pre>`,

      { type: "qcm", q: "La réponse du POST contient {\"id\":7,\"titre\":\"Dune\",...}. D'où vient le 7 ?", opts: ["Du client", "Attribué par le serveur lors de l'ajout", "C'est aléatoire", "Du DTO"], a: 1, exp: "Le serveur attribue l'id — c'est exactement pour ça que le DTO n'en a pas." },
      { type: "qcm", q: "Un POST avec le corps {\"auteur\":\"Herbert\"} (sans titre) crée quoi, en l'état ?", opts: ["Rien, erreur 400 automatique", "Un livre avec titre null : le trou sera bouché par la validation (leçon 12)", "Un livre au titre vide \"\"", "Une exception Jackson"], a: 1, exp: "Sans validation, Jackson accepte le champ manquant → null." },

      { type: "qcm", q: "Que renverrait un deuxième DELETE /api/livres/7 immédiatement après ?", opts: ["204 encore", "404 : le livre n'existe plus", "500", "201"], a: 1, exp: "La première suppression a réussi ; la ressource est partie → 404." }
    ],
    solution: `<pre class="pseudo">// L'API des livres parle maintenant le CRUD complet :
// POST   /api/livres      + JSON  → 201 + livre créé (id serveur)
// GET    /api/livres              → 200 + liste
// GET    /api/livres/7            → 200 + livre, ou 404
// PUT    /api/livres/7    + JSON  → 200 + livre modifié, ou 404
// DELETE /api/livres/7            → 204, ou 404

// Et les leçons de sécurité du jour :
// - DTO : le client n'envoie QUE ce qu'il a le droit d'envoyer.
// - Statuts honnêtes : 201, 204, 404 — jamais un 200 mensonger.
// - JSON silencieusement incomplet → la validation arrive leçon 12 !</pre>
<p>Il ne manque plus qu'une vraie base de données pour que tout survive au redémarrage : c'est la mission de la semaine 2.</p>`
