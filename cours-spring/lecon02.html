<script>
var DAY = {
  num: 2,
  title: "L'inversion de contrôle et l'injection de dépendances",
  subtitle: "Le cœur de Spring : ce n'est plus toi qui crées les objets avec new.",
  theory: `
<h3>1. Le problème du new</h3>
<p>Rappel : en Java, le mot-clé <code>new</code> sert à <strong>fabriquer un objet</strong> à partir d'une classe (le « moule »). Une <strong>classe</strong> décrit un type d'objet ; un <strong>objet</strong> est un exemplaire concret. Dans le cours Java (leçon 12), tu créais tes objets toi-même :</p>
<pre class="pseudo">public class Bibliotheque {                                     // une classe Java classique
    private CatalogueService catalogue = new CatalogueService(); // elle FABRIQUE elle-même sa dépendance avec new → couplage fort !
}                                                               // fin de la classe</pre>
<p>Problème : <code>Bibliotheque</code> est <strong>soudée</strong> à <code>CatalogueService</code>. Impossible de la remplacer par une version de test, ou une version connectée à une autre base, sans modifier le code. On dit que les classes sont <strong>fortement couplées</strong> (le « couplage » mesure à quel point deux classes sont attachées l'une à l'autre : fort = soudées, faible = facilement séparables).</p>
<h3>2. L'inversion de contrôle (IoC)</h3>
<p>L'idée de Spring : <strong>ce n'est plus toi qui crées les objets, c'est le conteneur Spring</strong>. Au démarrage, Spring parcourt (« scanne ») tes classes, crée les objets nécessaires (appelés <strong>beans</strong> — un <em>bean</em> est simplement « un objet fabriqué et géré par Spring »), et les range dans son <strong>conteneur IoC</strong> (appelé l'<em>ApplicationContext</em> : c'est la grande boîte qui contient tous les beans). <strong>IoC</strong> = <em>Inversion of Control</em>, inversion de contrôle.</p>
<h3>3. L'injection de dépendances (DI)</h3>
<p>Une <strong>dépendance</strong> d'une classe est simplement un autre objet dont elle a besoin pour travailler. Quand une classe a besoin d'une autre, elle ne fait plus <code>new</code> : elle la <strong>demande</strong>, et Spring la lui <strong>injecte</strong> (la fournit toute prête). <strong>DI</strong> = <em>Dependency Injection</em>. Une <strong>analogie</strong> : au restaurant, le cuisinier ne va pas cultiver ses légumes ; on les lui livre. Ici, Spring est le fournisseur qui livre les dépendances. La méthode recommandée : l'<strong>injection par constructeur</strong> (le constructeur est la méthode spéciale appelée au moment du <code>new</code>).</p>
<pre class="pseudo">@Service                                     // annotation : Spring gère cette classe comme un bean
public class BibliothequeService {           // une classe de service (contient de la logique métier)
    private final CatalogueService catalogue;   // la dépendance (final = fournie une fois, jamais remplacée)

    // Spring voit ce constructeur et fournit AUTOMATIQUEMENT un CatalogueService
    public BibliothequeService(CatalogueService catalogue) {  // le constructeur reçoit la dépendance en paramètre
        this.catalogue = catalogue;          // on range la dépendance reçue dans l'attribut de la classe (this = l'objet courant)
    }                                        // fin du constructeur
}                                            // fin de la classe</pre>
<ul>
<li><code>final</code> : la dépendance est fournie une fois pour toutes — impossible de l'oublier ou de la changer par accident.</li>
<li>Aucun <code>new CatalogueService()</code> nulle part : Spring s'en charge.</li>
<li>Il existe aussi <code>@Autowired</code> (« câblé automatiquement ») posé sur un champ, mais l'injection par constructeur est la bonne pratique (testable, explicite).</li>
</ul>
<h3>4. Pourquoi c'est génial ?</h3>
<pre class="pseudo">// SANS Spring                    // AVEC Spring
new partout                       // → le conteneur crée les beans à ta place
couplage fort                     // → couplage faible (on passe par des interfaces)
tests difficiles                  // → on injecte une fausse dépendance de test
ordre de création à gérer         // → Spring calcule l'ordre de création tout seul</pre>
<h3>5. Un seul exemplaire : le singleton</h3>
<p>Par défaut, Spring crée <strong>UN SEUL objet</strong> de chaque bean (on parle de portée <em>singleton</em>, du latin « single » = unique) et l'injecte partout où il est demandé. Ton <code>CatalogueService</code> est donc partagé par toute l'application, comme une caisse commune utilisée par tous les employés d'un magasin.</p>
<div class="warn">Si Spring ne trouve aucun bean à injecter, l'application refuse de démarrer avec « required a bean of type '...' that could not be found ». C'est presque toujours une annotation manquante (@Service, @Component…) sur la classe à injecter — on les voit en détail demain.</div>
<div class="tip">Relis la leçon 15 de Java (interfaces) : la DI prend tout son sens avec les interfaces. On injecte une INTERFACE, et Spring fournit l'implémentation — changer d'implémentation ne casse rien.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « inversion de contrôle » ?", opts: ["Le programme s'exécute à l'envers", "La création et le cycle de vie des objets sont confiés au framework, pas à ton code", "Les variables sont inversées", "Le main disparaît"], a: 1, exp: "Spring crée, connecte et gère les objets à ta place." },
    { type: "qcm", q: "Comment appelle-t-on un objet créé et géré par le conteneur Spring ?", opts: ["Un thread", "Un bean", "Un module", "Un paquet"], a: 1, exp: "Les beans vivent dans l'ApplicationContext, le conteneur IoC." },
    { type: "qcm", q: "Quel est le problème du code <code>catalogue = new CatalogueService()</code> à l'intérieur d'une classe ?", opts: ["Il ne compile pas", "Couplage fort : impossible de remplacer la dépendance sans modifier la classe", "new est interdit en Java", "C'est trop lent"], a: 1, exp: "La classe décide elle-même de son implémentation : dur à tester, dur à faire évoluer." },
    { type: "qcm", q: "Quelle est la méthode d'injection RECOMMANDÉE ?", opts: ["Par variable globale", "Par constructeur", "Par fichier texte", "Par copier-coller"], a: 1, exp: "Explicite, compatible avec final, et facile à tester sans Spring." },
    { type: "input", q: "Quelle annotation historique permet d'injecter directement dans un champ (pratique déconseillée) ?", a: ["@Autowired", "Autowired"], ph: "@...", exp: "@Autowired sur un champ fonctionne, mais cache les dépendances et complique les tests." },
    { type: "qcm", q: "Par défaut, combien d'instances d'un bean Spring existe-t-il dans l'application ?", opts: ["Une par requête", "Une seule : la portée singleton", "Dix", "Une par classe qui l'utilise"], a: 1, exp: "Le même objet est injecté partout — d'où l'importance de ne pas y stocker d'état propre à un utilisateur." },
    { type: "qcm", q: "Pourquoi déclarer la dépendance <code>final</code> dans l'injection par constructeur ?", opts: ["Pour la rendre plus rapide", "Pour garantir qu'elle est fournie à la création et jamais remplacée", "C'est obligatoire en Java", "Pour économiser la mémoire"], a: 1, exp: "final + constructeur = dépendance toujours présente, jamais null par oubli." },
    { type: "qcm", q: "L'application ne démarre pas : « required a bean of type 'CatalogueService' that could not be found ». Cause la plus probable ?", opts: ["Le port 8080 est occupé", "La classe CatalogueService n'a pas d'annotation (@Service, @Component…)", "Il manque un point-virgule", "Tomcat est absent"], a: 1, exp: "Sans annotation, Spring ne connaît pas la classe et ne peut pas l'injecter." },
    { type: "vf", q: "Avec l'injection de dépendances, on peut fournir une fausse implémentation pour les tests sans toucher au code de la classe.", a: true, exp: "C'est l'un des grands bénéfices : on injecte un objet factice (mock) à la place du vrai." },
    { type: "qcm", q: "Le conteneur qui héberge les beans s'appelle…", opts: ["La JVM", "L'ApplicationContext", "Le pom.xml", "Le garbage collector"], a: 1, exp: "L'ApplicationContext est le conteneur IoC de Spring." },
    { type: "qcm", q: "Pourquoi la DI se marie-t-elle si bien avec les interfaces (leçon 15 de Java) ?", opts: ["Elle ne fonctionne qu'avec les interfaces", "On dépend d'une interface, et Spring injecte l'implémentation : on peut en changer sans modifier le code client", "Les interfaces sont plus rapides", "Aucun rapport"], a: 1, exp: "Programmer contre l'interface + laisser Spring choisir l'implémentation = couplage minimal." },
    { type: "vf", q: "Avec Spring, le mot-clé new devient interdit dans tout le projet.", a: false, exp: "new reste normal pour les objets « données » (un Livre, une date, une liste). C'est pour les objets « services » que Spring prend le relais." },
    { type: "qcm", q: "Qu'est-ce qu'une « dépendance » d'une classe ?", opts: ["Un bug", "Un autre objet dont elle a besoin pour faire son travail", "Une variable locale", "Un fichier de configuration"], a: 1, exp: "BibliothequeService dépend de CatalogueService : sans lui, il ne peut pas fonctionner." },
    { type: "qcm", q: "Que fait Spring au démarrage de l'application ?", opts: ["Il compile le code", "Il scanne les classes annotées, crée les beans et les connecte entre eux", "Il télécharge Java", "Il vide la base de données"], a: 1, exp: "Le « component scan » détecte tes classes et construit le graphe des dépendances." },
    { type: "qcm", q: "Deux services utilisent le même bean CompteurService (singleton). Le service A incrémente un compteur. Que voit le service B ?", opts: ["Rien : chacun a sa copie", "La valeur incrémentée : c'est LE MÊME objet partagé", "Une erreur", "Zéro, toujours"], a: 1, exp: "Singleton = un seul objet partagé par toute l'application." }
  ],
  final: {
    title: "Exercice final — Refactorer vers l'injection",
    intro: `<p>Voici du code « à l'ancienne » repéré dans le projet bibliothèque. À toi d'analyser comment le mettre aux normes Spring :</p>
<pre class="pseudo">public class EmpruntService {                                       // classe NON gérée par Spring (aucune annotation)
    private CatalogueService catalogue = new CatalogueService();     // dépendance créée à la main → couplage fort
    private MembreService membres = new MembreService();             // idem : encore un new soudé

    public boolean emprunter(int membreId, int livreId) {            // méthode métier : emprunter un livre
        // ... vérifie le membre, la disponibilité, enregistre l'emprunt
        return true;                                                 // renvoie true si l'emprunt a réussi
    }                                                               // fin de la méthode
}                                                                   // fin de la classe</pre>`,
    questions: [
      { type: "qcm", q: "Quel est LE défaut principal de cette classe du point de vue de Spring ?", opts: ["Elle est trop courte", "Elle crée ses dépendances avec new : couplage fort, pas de bean géré", "Elle a deux dépendances", "Le nom est mal choisi"], a: 1, exp: "Les deux new soudent EmpruntService à des implémentations précises." },
      { type: "qcm", q: "Première étape de la correction :", opts: ["Supprimer les dépendances", "Annoter la classe (@Service) pour que Spring la gère", "Renommer le fichier", "Passer les attributs en public"], a: 1, exp: "Sans annotation, la classe n'existe pas aux yeux du conteneur." },
      { type: "qcm", q: "Comment réécrire les dépendances proprement ?", opts: ["private final + injection par constructeur", "Des variables statiques", "Un new dans chaque méthode", "Des variables globales"], a: 0, exp: "private final CatalogueService catalogue; + un constructeur qui les reçoit." },
      { type: "qcm", q: "Après refactoring, qui appelle le constructeur d'EmpruntService ?", opts: ["Toi, dans le main", "Spring, au démarrage, en fournissant les beans nécessaires", "Tomcat", "Personne : il disparaît"], a: 1, exp: "Le conteneur crée EmpruntService et lui passe automatiquement les deux services." },
      { type: "qcm", q: "Pour tester emprunter() sans vraie base de données, tu peux maintenant…", opts: ["C'est impossible", "Construire EmpruntService à la main en lui passant de faux services", "Supprimer les tests", "Tester en production"], a: 1, exp: "new EmpruntService(fauxCatalogue, fauxMembres) dans le test : c'est ça, le découplage." }
    ],
    solution: `<pre class="pseudo">@Service                                     // la classe devient un bean géré par Spring
public class EmpruntService {                // service métier des emprunts
    private final CatalogueService catalogue;   // dépendances finales,
    private final MembreService membres;        // jamais null, jamais new

    // Spring appelle ce constructeur et injecte les deux beans
    public EmpruntService(CatalogueService catalogue, MembreService membres) {  // constructeur qui reçoit les dépendances
        this.catalogue = catalogue;          // on range le catalogue injecté
        this.membres = membres;              // on range le service des membres injecté
    }                                        // fin du constructeur

    public boolean emprunter(int membreId, int livreId) {  // la méthode métier
        // ... même logique métier qu'avant, rien ne change ici
        return true;                         // renvoie true si l'emprunt a réussi
    }                                        // fin de la méthode
}                                            // fin de la classe</pre>
<p>Trois changements seulement : @Service, final, constructeur. La logique métier n'a pas bougé, mais la classe est devenue testable, découplée et gérée par Spring.</p>`
  }
};
var ECRITURE = {
  placeholder: "Écris ton code Java/Spring ici…",
  items: [
  { id: "spring-di-notification", title: "Injecter un service de notification", level: 1,
    statement: "Écris une classe <code>RappelService</code> gérée par Spring qui dépend d'un <code>NotificationService</code> (déjà existant et annoté). Elle expose une méthode <code>envoyerRappel(String membre)</code> qui appelle <code>notification.envoyer(membre, \"Retour du livre attendu\")</code>. Utilise l'injection par constructeur.",
    hints: [
      "Il faut une annotation sur la classe pour que Spring la gère (la même que pour EmpruntService).",
      "Déclare la dépendance en private final, sans jamais écrire new.",
      "Le constructeur reçoit le NotificationService en paramètre et l'affecte avec this."
    ],
    solution: "@Service                                          // la classe devient un bean géré par Spring\npublic class RappelService {\n    private final NotificationService notification; // dépendance : finale, jamais new\n\n    // Spring appelle ce constructeur au démarrage\n    // et fournit automatiquement le bean NotificationService\n    public RappelService(NotificationService notification) {\n        this.notification = notification;            // on garde la référence injectée\n    }\n\n    public void envoyerRappel(String membre) {\n        // on délègue au service injecté\n        notification.envoyer(membre, \"Retour du livre attendu\");\n    }\n}",
    note: "Le trio gagnant : @Service + private final + constructeur. Tu l'écriras des centaines de fois — autant qu'il devienne un réflexe." }
  ]
};
