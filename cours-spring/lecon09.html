  title: "JpaRepository : le CRUD sans SQL",
  subtitle: "Une interface vide qui fait tout le travail — la magie expliquée.",
  theory: `
<h3>1. Le repository nouvelle génération</h3>
<p>Un <strong>repository</strong> (« entrepôt ») est la classe qui range et retrouve les données. À la leçon 7, il fallait l'écrire. Avec Spring Data JPA, tu déclares une <strong>interface</strong> (un simple contrat, sans code) qui <code>extends</code> (hérite de) <code>JpaRepository</code>… et c'est tout :</p>
<pre class="pseudo">public interface LivreRepository extends JpaRepository&lt;Livre, Long&gt; {  // hérite de tout le CRUD
}                                             // corps vide : rien à écrire à l'intérieur !
//                                            ↑ entité  ↑ type de l'id</pre>
<p>Spring génère l'implémentation À TA PLACE au démarrage. Pas de classe, pas de SQL, et pourtant tu disposes de :</p>
<pre class="pseudo">livreRepo.save(livre)        → INSERT ou UPDATE (enregistre ou met à jour)
livreRepo.findAll()          → SELECT * (renvoie List&lt;Livre&gt;, la liste complète)
livreRepo.findById(3L)       → SELECT ... WHERE id = 3 (cherche par identifiant)
livreRepo.deleteById(3L)     → DELETE ... WHERE id = 3 (supprime par identifiant)
livreRepo.count()            → SELECT COUNT(*) (compte les lignes)
livreRepo.existsById(3L)     → l'entité 3 existe-t-elle ? (true/false)</pre>
<h3>2. Optional : la fin des null (leçon Java 16, souviens-toi des exceptions !)</h3>
<p><code>findById</code> ne renvoie pas l'entité directement, mais un <code>Optional&lt;Livre&gt;</code> : une <strong>boîte</strong> qui contient un livre… ou rien. Fini le null sournois qui plante plus loin :</p>
<pre class="pseudo">Optional&lt;Livre&gt; boite = livreRepo.findById(3L);  // une boîte qui contient un Livre… ou rien

// Trois façons de l'ouvrir :
if (boite.isPresent()) { Livre l = boite.get(); ... }        // basique : on vérifie puis on ouvre

Livre l = boite.orElseThrow(                                  // recommandé : présent → le livre
    () -> new LivreIntrouvableException(3L));                 // absent → on lève une exception claire

Livre l = boite.orElse(null);                                 // si tu tiens vraiment au null (déconseillé)</pre>
<h3>3. Le service branché sur le repository</h3>
<pre class="pseudo">@Service                                             // couche métier
public class CatalogueService {
    private final LivreRepository repo;              // le repository injecté
    public CatalogueService(LivreRepository repo) { this.repo = repo; }  // injection par constructeur

    public List&lt;Livre&gt; tous() { return repo.findAll(); }  // renvoie tous les livres

    public Livre parId(Long id) {                    // cherche un livre par son id
        return repo.findById(id)                     // Optional&lt;Livre&gt; (boîte pleine ou vide)
                   .orElseThrow(() -> new LivreIntrouvableException(id));  // absent → exception
    }                                                // fin de la méthode

    public Livre ajouter(String titre, String auteur) {  // crée un nouveau livre
        return repo.save(new Livre(titre, auteur));   // save renvoie l'entité AVEC son id
    }                                                // fin de la méthode
}                                                    // fin de la classe</pre>
<h3>4. save : créer OU modifier</h3>
<p>La même méthode <code>save</code> sert aux deux : elle regarde l'id pour décider.</p>
<pre class="pseudo">Livre l = new Livre("Dune", "Herbert");   // objet neuf : id == null
repo.save(l);                             // id null  → INSERT (l.getId() vaut maintenant 1)

l.setTitre("Dune (édition révisée)");     // on modifie un champ
repo.save(l);                             // id != null → UPDATE (met à jour la ligne 1)</pre>
<h3>5. Données de départ : CommandLineRunner</h3>
<p>Un <code>CommandLineRunner</code> est un bout de code que Spring exécute une fois, juste après le démarrage — pratique pour remplir la base d'exemples.</p>
<pre class="pseudo">@Bean                                                // méthode qui fabrique un bean
CommandLineRunner initDonnees(LivreRepository repo) {  // reçoit le repository par injection
    return args -> {                                 // lambda exécutée une fois l'appli prête
        repo.save(new Livre("Dune", "Herbert"));     // insère un premier livre
        repo.save(new Livre("Fondation", "Asimov")); // insère un second livre
    };   // exécuté une fois au démarrage : la base n'est plus vide
}                                                    // fin de la méthode</pre>
<div class="warn">Ne fais JAMAIS boite.get() sans vérifier isPresent() : si la boîte est vide, NoSuchElementException — exactement le genre de plantage qu'Optional devait éviter. Prends le réflexe orElseThrow.</div>
<div class="tip">Active spring.jpa.show-sql=true dans application.properties : chaque requête SQL générée s'affiche dans la console. Tu VERRAS le INSERT du save et le SELECT du findAll — la magie devient de la mécanique.</div>`,

    { type: "qcm", q: "Quelle méthode compte les entités ?", opts: ["size()", "count()", "length()", "total()"], a: 1, exp: "repo.count() → SELECT COUNT(*)." },
    { type: "qcm", q: "À quoi sert un CommandLineRunner ici ?", opts: ["À lancer Tomcat", "À exécuter du code au démarrage, par exemple insérer des données de test", "À compiler", "À exposer une nouvelle route web"], a: 1, exp: "Pratique pour peupler H2 à chaque lancement." },
    { type: "input", q: "Quelle propriété affiche dans la console le SQL généré par Hibernate ?", a: ["spring.jpa.show-sql=true", "spring.jpa.show-sql"], ph: "spring.jpa...", exp: "spring.jpa.show-sql=true — à activer pendant tout l'apprentissage." },
    { type: "vf", q: "Avec Spring Data JPA, il faut quand même écrire le SQL des opérations CRUD de base.", a: false, exp: "save, findAll, findById, deleteById… tout est généré." },
    { type: "qcm", q: "deleteById(99L) alors que l'entité 99 n'existe pas :", opts: ["Supprime toutes les entités de la table", "Selon la version : exception ou silence — d'où l'intérêt de vérifier existsById avant", "Supprime l'entité 98", "Crée l'entité 99"], a: 1, exp: "Le service doit gérer le cas « absent » explicitement (existsById ou findById d'abord)." },
    { type: "qcm", q: "Le repository doit-il être annoté @Repository ?", opts: ["Oui, obligatoirement", "Non : les interfaces qui étendent JpaRepository sont détectées automatiquement", "Oui, sinon erreur de compilation", "Seulement en production"], a: 1, exp: "Spring Data les repère tout seul — l'annotation est superflue ici." }

    title: "Exercice final — Le service catalogue passe en base",
    intro: `<p>Le CatalogueService abandonne sa liste en mémoire pour le repository :</p>
<pre class="pseudo">@Service                                             // couche métier
public class CatalogueService {
    private final LivreRepository repo;              // repository injecté
    public CatalogueService(LivreRepository repo) { this.repo = repo; }  // injection

    public List&lt;Livre&gt; tous() { return repo.findAll(); }  // tous les livres

    public Livre parId(Long id) {                    // un livre par id
        return repo.findById(id)                     // Optional&lt;Livre&gt;
                   .orElseThrow(() -> new LivreIntrouvableException(id));  // absent → exception
    }

    public Livre ajouter(String titre, String auteur) {  // créer un livre
        return repo.save(new Livre(titre, auteur));   // INSERT + id attribué
    }

    public void supprimer(Long id) {                 // supprimer un livre
        if (!repo.existsById(id)) throw new LivreIntrouvableException(id);  // absent → exception
        repo.deleteById(id);                         // DELETE en base
    }
}                                                    // fin de la classe</pre>`,

    ],
    solution: `<pre class="pseudo">// La chaîne complète, de la requête à la base :
