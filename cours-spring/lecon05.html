<script>
var DAY = {
  num: 5,
  title: "Paramètres de requête : @PathVariable et @RequestParam",
  subtitle: "« Le livre n°3 », « les livres de Herbert » : rendre l'API dynamique.",
  theory: `
<h3>1. Deux façons de passer une information dans une URL</h3>
<p>Une URL peut transporter des informations de deux manières. Comparons-les :</p>
<pre class="pseudo">GET /api/livres/3                    ← 3 fait partie du CHEMIN (l'adresse elle-même)
GET /api/livres?auteur=Herbert       ← auteur=Herbert est un PARAMÈTRE de requête (après le ?)</pre>
<ul>
<li><strong>Dans le chemin</strong> : pour identifier UNE ressource précise (l'id, le numéro).</li>
<li><strong>En paramètre</strong> (après le <code>?</code>) : pour filtrer, trier, chercher — des options. Une <strong>analogie</strong> : le chemin est l'adresse d'une maison ; les paramètres sont des consignes de livraison (« sonner deux fois »).</li>
</ul>
<h3>2. @PathVariable : capturer un morceau du chemin</h3>
<p><code>@PathVariable</code> (« variable de chemin ») recopie un segment variable de l'URL dans un paramètre de ta méthode.</p>
<pre class="pseudo">@GetMapping("/{id}")                          // {id} = partie variable du chemin (les accolades marquent un « trou » à remplir)
public Livre unLivre(@PathVariable int id) {  // @PathVariable recopie ce morceau du chemin dans le paramètre id
    return catalogue.parId(id);               // on demande au service le livre portant cet id
}                                             // fin de la méthode
// GET /api/livres/3  → id vaut 3 (conversion du texte "3" en nombre int automatique)</pre>
<h3>3. @RequestParam : lire après le « ? »</h3>
<p><code>@RequestParam</code> (« paramètre de requête ») lit une valeur écrite après le <code>?</code> dans l'URL.</p>
<pre class="pseudo">@GetMapping("/recherche")                                       // GET /api/livres/recherche
public List&lt;Livre&gt; recherche(@RequestParam String auteur) {     // @RequestParam lit la valeur écrite après le ?
    return catalogue.parAuteur(auteur);                         // on filtre les livres par cet auteur
}                                                               // fin de la méthode
// GET /api/livres/recherche?auteur=Herbert  → auteur vaut "Herbert"</pre>
<p>Paramètre facultatif avec valeur par défaut (grâce à <code>defaultValue</code>) :</p>
<pre class="pseudo">@GetMapping                                                              // GET /api/livres
public List&lt;Livre&gt; tous(@RequestParam(defaultValue = "titre") String tri) { ... }  // tri facultatif : vaut "titre" si absent
// GET /api/livres            → tri vaut "titre"  (la valeur par défaut)
// GET /api/livres?tri=auteur → tri vaut "auteur"</pre>
<p>Plusieurs paramètres se combinent avec <code>&amp;</code> : <code>?auteur=Herbert&amp;annee=1965</code>.</p>
<h3>4. Répondre 404 proprement : ResponseEntity</h3>
<p>Que faire si le livre n°999 n'existe pas ? Renvoyer <code>null</code> donnerait un corps vide en 200 — trompeur ! On contrôle le <strong>statut</strong> avec <code>ResponseEntity</code> (une « réponse HTTP dont on choisit soi-même le code de statut et le contenu ») :</p>
<pre class="pseudo">@GetMapping("/{id}")                              // GET /api/livres/{id}
public ResponseEntity&lt;Livre&gt; unLivre(@PathVariable int id) {  // ResponseEntity = réponse dont on choisit le statut
    Livre l = catalogue.parId(id);                // on cherche le livre correspondant à l'id
    if (l == null) {                              // s'il n'existe pas…
        return ResponseEntity.notFound().build(); // …renvoyer 404 Not Found, avec un corps vide
    }                                             // fin du if
    return ResponseEntity.ok(l);                  // sinon : 200 OK + le livre converti en JSON
}                                                 // fin de la méthode</pre>
<h3>5. Récapitulatif des routes de la bibliothèque</h3>
<pre class="pseudo">GET /api/livres                     → liste complète
GET /api/livres/3                   → le livre n°3 (ou 404 s'il n'existe pas)
GET /api/livres/recherche?auteur=X  → filtre par auteur
GET /api/livres?tri=auteur          → liste triée par auteur</pre>
<div class="warn">Si un @RequestParam obligatoire est absent de l'URL, Spring répond 400 Bad Request sans même appeler ta méthode. Pour le rendre facultatif : required = false ou defaultValue.</div>
<div class="tip">Règle de conception REST : le chemin identifie (« QUEL objet »), les paramètres modulent (« COMMENT je le veux »). /livres/3?format=court : le livre 3, en version courte.</div>`,
  exercises: [
    { type: "qcm", q: "Dans GET /api/livres/7, comment récupérer le 7 ?", opts: ["@RequestParam", "@PathVariable sur un chemin /{id}", "@Value", "Impossible"], a: 1, exp: "Le 7 fait partie du chemin → @PathVariable." },
    { type: "qcm", q: "Dans GET /api/livres?auteur=Verne, comment récupérer « Verne » ?", opts: ["@PathVariable", "@RequestParam String auteur", "@Autowired", "@RequestBody"], a: 1, exp: "Après le ? → @RequestParam." },
    { type: "qcm", q: "Que désigne {id} dans @GetMapping(\"/{id}\") ?", opts: ["Un commentaire", "Une partie variable du chemin, capturée par @PathVariable", "Une erreur de syntaxe", "Un paramètre de requête"], a: 1, exp: "Les accolades déclarent un segment dynamique de l'URL." },
    { type: "qcm", q: "GET /api/livres/abc arrive sur unLivre(@PathVariable int id). Résultat ?", opts: ["id vaut 0", "400 Bad Request : « abc » n'est pas convertible en int", "id vaut \"abc\"", "500"], a: 1, exp: "La conversion échoue → requête invalide, faute du client : 400." },
    { type: "qcm", q: "Comment rendre un @RequestParam facultatif avec une valeur de repli ?", opts: ["On ne peut pas", "@RequestParam(defaultValue = \"titre\")", "@Optional", "En le déclarant final"], a: 1, exp: "defaultValue rend le paramètre facultatif ET fournit la valeur par défaut." },
    { type: "input", q: "Quel symbole sépare deux paramètres de requête dans une URL ?", a: ["&"], ph: "un caractère", exp: "?auteur=Herbert&annee=1965 — le ? ouvre, le & enchaîne." },
    { type: "qcm", q: "Pourquoi éviter de renvoyer null quand le livre n'existe pas ?", opts: ["null fait planter Java", "Le client recevrait un 200 avec un corps vide : statut mensonger", "C'est plus lent", "Jackson refuse null"], a: 1, exp: "200 = « tout va bien ». Pour une ressource absente, la vérité est 404." },
    { type: "qcm", q: "Que renvoie ResponseEntity.notFound().build() ?", opts: ["200 avec 'not found'", "Une réponse 404 sans corps", "Une exception", "500"], a: 1, exp: "Le statut est 404, le corps est vide : exactement ce qu'attend un client REST." },
    { type: "qcm", q: "Que permet ResponseEntity par rapport au renvoi direct d'un objet ?", opts: ["Rien de plus", "Contrôler le code de statut (et les en-têtes) de la réponse", "Éviter le JSON", "Accélérer la réponse"], a: 1, exp: "ResponseEntity.ok(...), .notFound(), .status(201)... : maîtrise complète de la réponse." },
    { type: "qcm", q: "URL pour « les livres de Verne parus en 1870 » selon nos routes ?", opts: ["/api/livres/Verne/1870", "/api/livres/recherche?auteur=Verne&annee=1870", "/api/livres#Verne", "/api/recherche/Verne"], a: 1, exp: "Deux filtres = deux paramètres de requête combinés par &." },
    { type: "vf", q: "Un @RequestParam obligatoire absent de l'URL provoque un 400 avant même l'exécution de ta méthode.", a: true, exp: "Spring valide les paramètres requis en amont." },
    { type: "qcm", q: "Choix de conception : l'identifiant d'une ressource va plutôt…", opts: ["En paramètre : ?id=3", "Dans le chemin : /livres/3", "Dans un en-tête", "Peu importe, c'est pareil"], a: 1, exp: "Convention REST : le chemin identifie la ressource, les paramètres la modulent." },
    { type: "qcm", q: "GET /api/livres/3/exemplaires : que représente probablement cette URL ?", opts: ["Une erreur", "Les exemplaires du livre n°3 : une sous-ressource", "3 exemplaires au hasard", "Un paramètre mal placé"], a: 1, exp: "On peut imbriquer : ressource/id/sous-ressource. Très courant en REST." },
    { type: "qcm", q: "Dans quelle méthode ce filtre doit-il être implémenté : contrôleur ou service ?", opts: ["Contrôleur : c'est lui qui reçoit le paramètre", "Service : le contrôleur transmet le paramètre, le service applique la logique", "Les deux", "Ni l'un ni l'autre"], a: 1, exp: "Le contrôleur lit auteur=... et le passe au service. Le filtrage est de la logique métier." },
    { type: "qcm", q: "Deux méthodes annotées @GetMapping(\"/{id}\") et @GetMapping(\"/recherche\") : GET /api/livres/recherche appelle laquelle ?", opts: ["Celle avec {id}", "La plus précise : /recherche (les chemins exacts gagnent sur les variables)", "Les deux", "Erreur de démarrage"], a: 1, exp: "Spring privilégie le chemin littéral sur le segment variable." }
  ],
  final: {
    title: "Exercice final — Le détail d'un membre",
    intro: `<p>On complète MembreController. Analyse cette méthode :</p>
<pre class="pseudo">@GetMapping("/{id}")                              // GET /api/membres/{id}
public ResponseEntity&lt;Membre&gt; unMembre(@PathVariable int id) {  // id capturé dans le chemin
    Membre m = service.parId(id);                 // on cherche le membre correspondant
    if (m == null) {                              // s'il n'existe pas…
        return ResponseEntity.notFound().build(); // …renvoyer 404 Not Found
    }                                             // fin du if
    return ResponseEntity.ok(m);                  // sinon : 200 + le membre en JSON
}                                                 // fin de la méthode

@GetMapping("/recherche")                                                    // GET /api/membres/recherche
public List&lt;Membre&gt; parNom(@RequestParam(defaultValue = "") String nom) {    // nom facultatif : "" si absent
    return service.parNom(nom);                                              // filtre par nom (ou tout si "")
}                                                                            // fin de la méthode</pre>`,
    questions: [
      { type: "qcm", q: "GET /api/membres/12 avec un membre 12 existant renvoie…", opts: ["404", "200 + le membre en JSON", "400", "201"], a: 1, exp: "ResponseEntity.ok(m) = 200 avec le corps JSON." },
      { type: "qcm", q: "GET /api/membres/999 (inexistant) renvoie…", opts: ["200 avec corps vide", "404 Not Found", "500", "null"], a: 1, exp: "Le if traite le cas absent : notFound()." },
      { type: "qcm", q: "GET /api/membres/recherche (sans paramètre nom) renvoie…", opts: ["400 Bad Request", "La liste obtenue avec nom = \"\" grâce à defaultValue", "404", "Une exception"], a: 1, exp: "defaultValue = \"\" rend le paramètre facultatif." },
      { type: "input", q: "Écris l'URL (chemin + paramètre) qui cherche les membres nommés « Diallo ». (commence par /)", a: ["/api/membres/recherche?nom=Diallo"], ph: "/api/...", exp: "/api/membres/recherche?nom=Diallo." },
      { type: "qcm", q: "GET /api/membres/douze renvoie…", opts: ["Le membre 12", "400 : « douze » ne se convertit pas en int", "404", "200 vide"], a: 1, exp: "Échec de conversion du @PathVariable → Bad Request." }
    ],
    solution: `<pre class="pseudo">// Les routes membres, récapitulées :
// GET /api/membres                        → liste complète (leçon 4)
// GET /api/membres/12                     → 200 + membre, ou 404
// GET /api/membres/recherche?nom=Diallo   → filtre par nom
// GET /api/membres/recherche              → nom = "" (defaultValue)

// Les trois réflexes de la leçon :
// 1. Chemin = identité (/12), paramètre = option (?nom=...).
// 2. Ressource absente → ResponseEntity.notFound(), jamais null en 200.
// 3. Conversion automatique des types, et 400 si elle échoue.</pre>
<p>L'API sait maintenant répondre finement. Prochaine étape : recevoir des données pour CRÉER un livre — place au POST et au JSON entrant.</p>`
  }
};
var ECRITURE = {
  placeholder: "Écris ton code Java/Spring ici…",
  items: [
  { id: "spring-pathvar-emprunts", title: "Les emprunts d'un membre", level: 2,
    atoi: {"cmd":"curl -i http://localhost:8080/api/membres/12/emprunts\ncurl -i \"http://localhost:8080/api/membres/12/emprunts?enCours=true\"\ncurl -i http://localhost:8080/api/membres/999/emprunts","expected":"Membre existant (12) : HTTP/1.1 200 + la liste JSON des emprunts.\nAvec ?enCours=true : la même route mais la liste est filtrée (emprunts en cours).\nSans le paramètre, enCours vaut false par défaut (aucune erreur).\nMembre inconnu (999) : HTTP/1.1 404 Not Found avec un corps vide."},
    checklist: ["@GetMapping(\"/{id}/emprunts\") combine un segment variable et un segment fixe.","id est capturé par @PathVariable ; enCours par @RequestParam(defaultValue=\"false\").","service.parId(id) == null renvoie ResponseEntity.notFound().build() (404).","Le cas normal renvoie ResponseEntity.ok(service.empruntsDe(id, enCours))."],
    statement: "Dans <code>MembreController</code>, écris la méthode qui répond à <code>GET /api/membres/{id}/emprunts</code> : elle renvoie <code>ResponseEntity&lt;List&lt;Emprunt&gt;&gt;</code>. Si <code>service.parId(id)</code> renvoie null → 404 ; sinon 200 avec <code>service.empruntsDe(id)</code>. Ajoute un paramètre facultatif <code>enCours</code> (booléen, défaut <code>false</code>) transmis au service : <code>service.empruntsDe(id, enCours)</code>.",
    hints: [
      "Le chemin contient un segment variable {id} ET un segment fixe /emprunts.",
      "Deux annotations de paramètres différentes : @PathVariable pour id, @RequestParam pour enCours.",
      "Pour le booléen facultatif : @RequestParam(defaultValue = \"false\") boolean enCours."
    ],
    solution: "@GetMapping(\"/{id}/emprunts\")               // GET /api/membres/12/emprunts?enCours=true\npublic ResponseEntity<List<Emprunt>> emprunts(\n        @PathVariable int id,                    // capturé dans le chemin\n        @RequestParam(defaultValue = \"false\") boolean enCours) { // option après le ?\n\n    if (service.parId(id) == null) {             // le membre existe-t-il ?\n        return ResponseEntity.notFound().build(); // non → 404, corps vide\n    }\n    // oui → 200 + la liste (filtrée ou non) en JSON\n    return ResponseEntity.ok(service.empruntsDe(id, enCours));\n}",
    note: "Remarque l'URL /membres/{id}/emprunts : une sous-ressource. Le chemin raconte l'histoire : « les emprunts DU membre 12 »." }
  ]
};
</script>
