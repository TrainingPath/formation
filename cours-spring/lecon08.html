var DAY = {
  num: 8,
  title: "Spring Data JPA : les entités",
  subtitle: "Tes classes Java deviennent des tables de base de données.",
  theory: `
<h3>1. Le problème : objets d'un côté, tables de l'autre</h3>
<p>Java pense en <strong>objets</strong> (un Livre, avec des attributs). Une <strong>base de données relationnelle</strong> (un logiciel qui range les informations dans des tableaux) pense en <strong>tables</strong> (des lignes et des colonnes, comme un tableur). Faire la traversée à la main (écrire du <strong>SQL</strong> — le langage des bases de données — puis convertir) est long et répétitif. Un <strong>ORM</strong> (<em>Object-Relational Mapping</em>, « correspondance objet-relationnel ») fait le pont automatiquement. En Java, le standard s'appelle <strong>JPA</strong> (<em>Jakarta Persistence API</em>), son implémentation la plus connue <strong>Hibernate</strong> (le moteur qui fait le travail réel), et <strong>Spring Data JPA</strong> les intègre à Spring.</p>
<h3>2. Préparer le projet</h3>
<pre class="pseudo">pom.xml :
  spring-boot-starter-data-jpa     ← JPA + Hibernate (le nécessaire pour parler à une base)
  h2                               ← base de données en mémoire, idéale pour apprendre

application.properties :
  spring.datasource.url=jdbc:h2:mem:biblio        # adresse de la base H2 en mémoire, nommée "biblio"
  spring.jpa.hibernate.ddl-auto=update    ← Hibernate crée/ajuste les tables tout seul
  spring.h2.console.enabled=true          ← active la console web accessible sur /h2-console</pre>
<p><strong>H2</strong> est une base légère qui vit dans la mémoire de l'application : parfaite pour apprendre (mais tout disparaît à l'arrêt — en production on branchera PostgreSQL ou MySQL, leçon 14).</p>
<h3>3. Transformer Livre en entité</h3>
<p>Une <strong>entité</strong> est une classe Java reliée à une table : chaque objet devient une ligne, chaque attribut une colonne.</p>
<pre class="pseudo">@Entity                          // « cette classe correspond à une table »
public class Livre {             // la classe métier devient une entité
    @Id                                          // ce champ est la clé primaire (l'identifiant unique de la ligne)
    @GeneratedValue(strategy = GenerationType.IDENTITY)  // la base attribue l'id toute seule (auto-incrément)
    private Long id;                             // Long (objet) : peut valoir null tant que non enregistré

    private String titre;        // → colonne titre
    private String auteur;       // → colonne auteur
    private boolean disponible = true;           // → colonne disponible (true par défaut)

    protected Livre() {}         // constructeur vide OBLIGATOIRE pour JPA

    public Livre(String titre, String auteur) {  // constructeur normal, utilisé par ton code
        this.titre = titre;                      // on range le titre reçu
        this.auteur = auteur;                    // on range l'auteur reçu
    }                                            // fin du constructeur
    // getters et setters...                     // requis pour lire/écrire les champs
}                                                // fin de la classe</pre>
<ul>
<li><code>@Entity</code> : Hibernate crée (et gère) une table <code>livre</code>.</li>
<li><code>@Id</code> + <code>@GeneratedValue</code> : la base attribue les id (1, 2, 3…) — souviens-toi de la leçon 6 : le client n'envoie jamais l'id !</li>
<li>Le <strong>constructeur sans argument</strong> est exigé par JPA (il peut être protected).</li>
<li>L'id devient <code>Long</code> (objet) : il peut valoir <code>null</code> tant que l'entité n'est pas enregistrée.</li>
</ul>
<h3>4. Personnaliser le mapping</h3>
<p>Le <strong>mapping</strong> est la correspondance entre les champs Java et les colonnes SQL. On l'ajuste avec <code>@Table</code> (nom de la table) et <code>@Column</code> (règles sur une colonne).</p>
<pre class="pseudo">@Entity                                          // classe persistée
@Table(name = "livres")                    // nom de table personnalisé (sinon Hibernate mettrait "livre")
public class Livre {
    @Column(nullable = false, length = 200)   // colonne NOT NULL (obligatoire), type VARCHAR(200)
    private String titre;                        // le titre : obligatoire, 200 caractères max

    @Column(unique = true)                       // contrainte UNIQUE : aucun doublon autorisé
    private String isbn;                       // pas deux fois le même ISBN
}                                                // fin de la classe</pre>
<h3>5. ddl-auto : qui crée les tables ?</h3>
<pre class="pseudo">update    → Hibernate ajuste les tables (pratique en apprentissage)
create    → tables recréées à chaque démarrage (données perdues !)
validate  → vérifie sans toucher (production)
none      → Hibernate ne touche à rien</pre>
<div class="warn">Erreur au démarrage « No default constructor for entity » = tu as écrit un constructeur avec paramètres et oublié de garder le constructeur vide. JPA en a besoin pour reconstruire les objets depuis la base.</div>
<div class="tip">Ouvre http://localhost:8080/h2-console pendant que l'application tourne : tu peux voir la table LIVRE, ses colonnes, et exécuter du vrai SQL. Vérifier de ses yeux vaut tous les cours.</div>`,

    { type: "qcm", q: "Quelle annotation transforme une classe en table ?", opts: ["@Table seule", "@Entity", "@Repository", "@Component"], a: 1, exp: "@Entity : la classe est désormais persistée par JPA." },

    { type: "qcm", q: "Pourquoi une entité doit-elle avoir un constructeur sans argument ?", opts: ["Pour faire joli", "JPA en a besoin pour instancier l'objet quand il le reconstruit depuis la base", "C'est une règle de style", "Pour Jackson uniquement"], a: 1, exp: "Hibernate crée l'objet vide puis remplit les champs — sans constructeur vide, échec au démarrage." },

    { type: "qcm", q: "Quelle base utilise-t-on pour apprendre, et pourquoi ?", opts: ["Oracle, pour le réalisme", "H2 en mémoire : zéro installation, console web intégrée", "Excel", "MongoDB"], a: 1, exp: "H2 démarre avec l'application — parfait en développement." },
    { type: "qcm", q: "Inconvénient de H2 en mémoire ?", opts: ["Trop lente", "Les données disparaissent à l'arrêt de l'application", "Elle coûte cher", "Pas de SQL"], a: 1, exp: "jdbc:h2:mem = mémoire vive. Pour persister : fichier ou vraie base (leçon 14)." },
    { type: "input", q: "Quelle valeur de spring.jpa.hibernate.ddl-auto laisse Hibernate ajuster les tables sans les détruire ?", a: ["update"], ph: "une valeur", exp: "update : idéal en apprentissage. validate en production." },
    { type: "qcm", q: "Que fait @Column(nullable = false) ?", opts: ["Cache la colonne", "Génère une contrainte NOT NULL : la base refusera une valeur absente", "Rend la colonne unique", "Supprime la colonne"], a: 1, exp: "La contrainte est posée au niveau de la base elle-même." },
    { type: "qcm", q: "Comment imposer qu'aucun ISBN n'apparaisse deux fois ?", opts: ["Un if dans le contrôleur", "@Column(unique = true) sur le champ isbn", "Un commentaire", "Impossible"], a: 1, exp: "Contrainte UNIQUE en base : la garantie la plus solide." },
    { type: "vf", q: "Avec ddl-auto=create, les données survivent au redémarrage.", a: false, exp: "create détruit et recrée les tables à chaque démarrage : tout est perdu." },
    { type: "qcm", q: "L'application démarre avec « No default constructor for entity Livre ». Correction ?", opts: ["Supprimer @Entity", "Ajouter un constructeur sans argument (protected Livre() {})", "Renommer la classe", "Changer de base"], a: 1, exp: "Le constructeur vide a été éclipsé par le constructeur avec paramètres." },
    { type: "qcm", q: "À quoi sert la console H2 (/h2-console) ?", opts: ["À jouer", "À inspecter les tables et exécuter du SQL sur la base pendant que l'app tourne", "À compiler", "À gérer Git"], a: 1, exp: "Ton hublot sur la base : vérifie ce que Hibernate a réellement créé." }
  ],
  final: {
    title: "Exercice final — L'entité Membre passe en base",
    intro: `<p>On transforme la classe Membre du projet en entité JPA :</p>
<pre class="pseudo">@Entity                                          // classe persistée par JPA
@Table(name = "membres")                         // table nommée "membres"
public class Membre {
    @Id                                          // clé primaire
    @GeneratedValue(strategy = GenerationType.IDENTITY)  // id auto-incrémenté par la base
    private Long id;                             // null tant que non enregistré

    @Column(nullable = false, length = 100)      // colonne NOT NULL, VARCHAR(100)
    private String nom;                          // le nom : obligatoire

    @Column(nullable = false, unique = true)     // NOT NULL + UNIQUE
    private String email;                        // l'email : obligatoire et unique

    private boolean actif = true;                // → colonne actif (true par défaut)

    protected Membre() {}                        // constructeur vide exigé par JPA

    public Membre(String nom, String email) {    // constructeur normal
        this.nom = nom;                          // on range le nom
        this.email = email;                      // on range l'email
    }                                            // fin du constructeur
    // getters/setters...                        // requis par JPA
}                                                // fin de la classe</pre>`,
    questions: [
      { type: "qcm", q: "Quelle table Hibernate va-t-il créer ?", opts: ["membre", "membres (imposé par @Table)", "MEMBRE_TABLE", "Aucune"], a: 1, exp: "@Table(name = \"membres\") fixe le nom." },
      { type: "qcm", q: "Que garantit @Column(unique = true) sur email ?", opts: ["L'email est chiffré", "Deux membres ne peuvent pas partager le même email — la base le refuse", "L'email est facultatif", "L'email est en majuscules"], a: 1, exp: "Contrainte UNIQUE : l'insertion d'un doublon échoue." },
      { type: "qcm", q: "On enregistre un membre avec nom = null. Résultat ?", opts: ["Enregistré avec null", "Erreur : la contrainte NOT NULL le refuse", "nom devient \"\"", "L'application redémarre"], a: 1, exp: "nullable = false protège l'intégrité au niveau le plus bas." },
      { type: "qcm", q: "Avant enregistrement, membre.getId() vaut null. Après save, il vaut 4. Qui a décidé ?", opts: ["Le constructeur", "La base, via l'auto-incrément (GenerationType.IDENTITY)", "Jackson", "Le hasard"], a: 1, exp: "L'id est attribué à l'insertion — c'est le signe que l'entité est persistée." },
      { type: "qcm", q: "Pourquoi le constructeur vide est-il protected et non public ?", opts: ["Erreur du développeur", "Il suffit à JPA, tout en décourageant son usage dans le reste du code", "protected est plus rapide", "public est interdit"], a: 1, exp: "On force le reste du code à passer par le constructeur complet — JPA, lui, y a accès." }
    ],
    solution: `<pre class="pseudo">// Vérification dans la console H2 (http://localhost:8080/h2-console) :
// JDBC URL : jdbc:h2:mem:biblio

SELECT * FROM membres;                           -- lire toutes les lignes de la table membres
-- ID | NOM     | EMAIL           | ACTIF
-- 1  | Diallo  | a.diallo@ex.be  | TRUE

// Ce que Hibernate a généré tout seul :
CREATE TABLE membres (                           -- création de la table (faite par Hibernate)
    id BIGINT AUTO_INCREMENT PRIMARY KEY,        -- id : entier auto-incrémenté, clé primaire
    nom VARCHAR(100) NOT NULL,                   -- nom : texte obligatoire (max 100 caractères)
    email VARCHAR(255) NOT NULL UNIQUE,          -- email : obligatoire et unique
    actif BOOLEAN                                -- actif : vrai/faux
);                                               -- fin de la définition de la table</pre>
<p>Ta classe Java EST devenue la table — sans écrire une ligne de SQL. Demain : lire et écrire dedans avec les repositories.</p>`
  }

      "LocalDate est géré nativement par JPA : déclare les champs normalement.",

    solution: "@Entity                                          // classe persistée par JPA\n@Table(name = \"emprunts\")                      // nom explicite de la table\npublic class Emprunt {\n    @Id                                          // clé primaire\n    @GeneratedValue(strategy = GenerationType.IDENTITY) // auto-incrément\n    private Long id;\n\n    @Column(nullable = false)                    // toujours renseignée\n    private LocalDate dateEmprunt;\n\n    private LocalDate dateRetour;                // null = pas encore rendu\n\n    protected Emprunt() {}                       // exigé par JPA\n\n    public Emprunt(LocalDate dateEmprunt) {\n        this.dateEmprunt = dateEmprunt;\n    }\n\n    public static Emprunt maintenant() {\n        return new Emprunt(LocalDate.now());     // emprunt daté d'aujourd'hui\n    }\n\n    public boolean estEnCours() {\n        return dateRetour == null;               // pas de date de retour = en cours\n    }\n\n    // getters/setters...\n}",
