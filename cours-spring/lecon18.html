  title: "Thymeleaf : générer des pages HTML",
  subtitle: "L'autre visage de Spring : des pages web rendues par le serveur.",
  theory: `
<h3>1. API JSON ou pages HTML ?</h3>
<p>Jusqu'ici, notre application renvoie du JSON (API REST) : parfait pour un front JavaScript ou une app mobile. Mais Spring sait aussi générer des <strong>pages HTML côté serveur</strong>, avec le <strong>moteur de templates</strong> <strong>Thymeleaf</strong>. Un <em>template</em> est un modèle de page HTML à trous, que le serveur remplit avec des données avant de l'envoyer. Dépendance : <code>spring-boot-starter-thymeleaf</code>.</p>
<pre class="pseudo">API REST (@RestController)          Pages serveur (@Controller)
renvoie des DONNÉES (JSON)          renvoie des PAGES (HTML)
le client construit l'affichage     le serveur construit l'affichage</pre>
<h3>2. Le duo @Controller + template</h3>
<pre class="pseudo">@Controller                              // SANS Rest ! (renvoie des pages, pas du JSON)
public class CataloguePageController {   // contrôleur de pages HTML

    private final CatalogueService catalogue;  // le service métier, injecté
    // ... constructeur ...              // injection par constructeur

    @GetMapping("/catalogue")            // GET /catalogue
    public String catalogue(Model model) {  // Model = la « valise » de données vers la page
        model.addAttribute("livres", catalogue.tous());  // on range la liste des livres dans le Model
        return "catalogue";     // → src/main/resources/templates/catalogue.html
    }                                    // fin de la méthode
}                                        // fin de la classe</pre>
<p>La méthode renvoie le NOM du template (on parle de <strong>vue</strong>) ; le <code>Model</code> transporte les données vers la page.</p>
<h3>3. Le template Thymeleaf</h3>
<pre class="pseudo">&lt;!-- templates/catalogue.html --&gt;
&lt;html xmlns:th="http://www.thymeleaf.org"&gt;    &lt;!-- xmlns:th active les attributs Thymeleaf --&gt;
&lt;body&gt;
  &lt;h1&gt;Catalogue de la bibliothèque&lt;/h1&gt;    &lt;!-- titre de la page --&gt;

  &lt;table&gt;                                   &lt;!-- un tableau HTML --&gt;
    &lt;tr th:each="livre : \${livres}"&gt;         &lt;!-- la boucle : une ligne par livre --&gt;
      &lt;td th:text="\${livre.titre}"&gt;Titre&lt;/td&gt;    &lt;!-- cellule : le titre --&gt;
      &lt;td th:text="\${livre.auteur}"&gt;Auteur&lt;/td&gt;   &lt;!-- cellule : l'auteur --&gt;
      &lt;td th:if="\${livre.disponible}"&gt;Disponible&lt;/td&gt;    &lt;!-- affichée SI disponible --&gt;
      &lt;td th:unless="\${livre.disponible}"&gt;Emprunté&lt;/td&gt;   &lt;!-- affichée SINON --&gt;
    &lt;/tr&gt;                                    &lt;!-- fin de la ligne --&gt;
  &lt;/table&gt;                                   &lt;!-- fin du tableau --&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
<pre class="pseudo">th:text="\${...}"    remplace le contenu du tag
th:each="x : \${liste}"   répète l'élément pour chaque x
th:if / th:unless    affiche ou non l'élément
th:href="@{/livres/\${id}}"   construit une URL</pre>
<h3>4. Les formulaires</h3>
<pre class="pseudo">&lt;form th:action="@{/catalogue/ajouter}" th:object="\${nouveauLivre}" method="post"&gt;  &lt;!-- formulaire lié à l'objet nouveauLivre --&gt;
  &lt;input type="text" th:field="*{titre}" /&gt;    &lt;!-- champ relié au titre --&gt;
  &lt;input type="text" th:field="*{auteur}" /&gt;   &lt;!-- champ relié à l'auteur --&gt;
  &lt;button type="submit"&gt;Ajouter&lt;/button&gt;        &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;

@PostMapping("/catalogue/ajouter")                                    // POST /catalogue/ajouter
public String ajouter(@Valid @ModelAttribute("nouveauLivre") CreationLivreDto dto,  // @ModelAttribute : données du FORMULAIRE
                      BindingResult erreurs) {                        // BindingResult recueille les erreurs de validation
    if (erreurs.hasErrors()) return "formulaire";    // réafficher avec erreurs
    catalogue.ajouter(dto.getTitre(), dto.getAuteur());  // création du livre
    return "redirect:/catalogue";                    // Post/Redirect/Get !
}                                                                     // fin de la méthode</pre>
<ul>
<li><code>@ModelAttribute</code> remplace @RequestBody : les champs viennent d'un FORMULAIRE, pas d'un JSON.</li>
<li><code>redirect:</code> après un POST réussi : le refresh du navigateur ne re-soumettra pas le formulaire (motif <strong>Post/Redirect/Get</strong>).</li>
</ul>
<h3>5. Et le CSRF revient !</h3>
<p>Avec des pages et des sessions, la protection <strong>CSRF</strong> (leçon 16) reprend tout son sens : Thymeleaf ajoute automatiquement le jeton caché dans les formulaires <code>th:action</code>. Ne désactive PAS le CSRF sur la partie pages !</p>
<div class="warn">Erreur classique : renvoyer "catalogue" depuis un @RestController — le texte « catalogue » part tel quel au client au lieu d'afficher la page ! Le duo indissociable : @Controller + return "nomDeVue" ; @RestController + return données.</div>
<div class="tip">Thymeleaf échappe automatiquement le HTML avec th:text : si un titre de livre contient &lt;script&gt;, il s'affichera comme du texte inoffensif au lieu de s'exécuter. Protection XSS gratuite — n'utilise th:utext (non échappé) qu'en connaissance de cause.</div>`,

    { type: "qcm", q: "Dans un POST de formulaire, quelle annotation remplace @RequestBody ?", opts: ["@FormBody", "@ModelAttribute", "@RequestParam", "@Valid"], a: 1, exp: "Les champs du formulaire remplissent l'objet via @ModelAttribute." },
    { type: "qcm", q: "Que fait return \"redirect:/catalogue\" ?", opts: ["Affiche le template redirect", "Demande au navigateur de refaire un GET /catalogue", "Une erreur 500", "Recharge le CSS"], a: 1, exp: "Redirection HTTP : la clé du motif Post/Redirect/Get." },
    { type: "qcm", q: "Pourquoi rediriger après un POST réussi (Post/Redirect/Get) ?", opts: ["Pour la vitesse", "Un refresh (F5) ne re-soumettra pas le formulaire : pas de double ajout", "C'est obligatoire", "Pour les logs"], a: 1, exp: "Sans redirection, F5 = « re-poster » = livre ajouté deux fois." },
    { type: "qcm", q: "Si la validation échoue (BindingResult.hasErrors()), on…", opts: ["Redirige quand même", "Réaffiche le formulaire avec les messages d'erreur", "Lève une exception 500", "Vide la base"], a: 1, exp: "L'utilisateur corrige ses saisies sans rien perdre." },
    { type: "qcm", q: "Sur la partie formulaires/sessions, le CSRF doit être…", opts: ["Désactivé comme pour l'API", "Actif : Thymeleaf insère le jeton automatiquement dans les form th:action", "Ignoré", "Configuré manuellement dans chaque page"], a: 1, exp: "Le choix de la leçon 16 s'inverse ici : sessions → CSRF indispensable." },
    { type: "qcm", q: "Un titre de livre contient &lt;script&gt;alert(1)&lt;/script&gt;. Avec th:text, la page…", opts: ["Exécute le script", "Affiche le texte inoffensif : Thymeleaf échappe le HTML (anti-XSS)", "Plante", "Supprime le livre"], a: 1, exp: "Échappement automatique = protection XSS par défaut." },
    { type: "vf", q: "Une même application Spring peut avoir DES @RestController (API JSON) ET des @Controller (pages HTML).", a: true, exp: "Très courant : l'API sous /api/**, les pages ailleurs." },
    { type: "qcm", q: "Où placer les templates Thymeleaf ?", opts: ["src/main/java", "src/main/resources/templates/", "Dans src/main/java", "Dans le contrôleur"], a: 1, exp: "L'emplacement conventionnel scanné par Spring Boot." },
    { type: "qcm", q: "th:href=\"@{/livres/\${livre.id}}\" génère…", opts: ["Un texte", "Un lien vers /livres/3 (l'URL construite avec l'id)", "Un formulaire", "Une image"], a: 1, exp: "@{...} est la syntaxe de construction d'URL de Thymeleaf." }
  ],
  final: {
    title: "Exercice final — La page d'accueil de la bibliothèque",
    intro: `<p>La bibliothèque veut une vitrine web servie par l'application elle-même :</p>
<pre class="pseudo">@Controller                              // contrôleur de pages HTML
public class AccueilController {
    private final CatalogueService catalogue;  // service catalogue injecté
    private final EmpruntService emprunts;     // service emprunts injecté
    // ... constructeur ...

    @GetMapping("/")                     // GET / (la page d'accueil)
    public String accueil(Model model) {  // Model = données vers la page
        model.addAttribute("nbLivres", catalogue.compter());  // nombre total de livres
        model.addAttribute("nouveautes", catalogue.dernieresAcquisitions(5));  // 5 dernières acquisitions
        model.addAttribute("nbEmpruntsEnCours", emprunts.nbEnCours());  // emprunts en cours
        return "accueil";                // → templates/accueil.html
    }                                    // fin de la méthode
}                                        // fin de la classe

&lt;!-- templates/accueil.html (extrait) --&gt;
&lt;p&gt;Notre catalogue compte &lt;span th:text="\${nbLivres}"&gt;0&lt;/span&gt; livres.&lt;/p&gt;    &lt;!-- affiche le nombre --&gt;
&lt;ul&gt;
  &lt;li th:each="l : \${nouveautes}"&gt;                       &lt;!-- une ligne par nouveauté --&gt;
    &lt;a th:href="@{/livres/\${l.id}}" th:text="\${l.titre}"&gt;titre&lt;/a&gt;    &lt;!-- lien cliquable vers le livre --&gt;
  &lt;/li&gt;
&lt;/ul&gt;</pre>`,
    questions: [
      { type: "qcm", q: "Que voit le visiteur à la place de &lt;span th:text=\"\${nbLivres}\"&gt;0&lt;/span&gt; ?", opts: ["0", "Le nombre réel de livres (ex. 1247), le 0 n'étant qu'un placeholder", "\${nbLivres}", "Une erreur"], a: 1, exp: "th:text remplace le contenu statique par la valeur du Model." },
      { type: "qcm", q: "La liste des nouveautés affiche 5 liens. D'où viennent les données ?", opts: ["Du template", "Du Model : dernieresAcquisitions(5) appelée par le contrôleur, th:each les déroule", "Du navigateur", "D'un fichier JSON"], a: 1, exp: "Contrôleur → Model → template : le circuit du rendu serveur." },
      { type: "qcm", q: "Ce contrôleur appelle les MÊMES services que l'API REST. Est-ce normal ?", opts: ["Non, il faut dupliquer", "Oui : la logique vit dans les services, les deux « visages » (JSON, HTML) la partagent — merci les couches", "C'est interdit", "Seulement en test"], a: 1, exp: "L'architecture en couches paie encore : un métier, plusieurs interfaces." },

      { type: "qcm", q: "Un @RestController aurait renvoyé quoi pour return \"accueil\" ?", opts: ["La page accueil.html", "La chaîne « accueil » brute en corps de réponse", "Une redirection", "Une erreur de compilation"], a: 1, exp: "Le piège de la leçon : @RestController sérialise le retour, il ne résout pas de vue." }

//   NAVIGATEUR ── GET / ──────────→ @Controller ─→ Model + template ─→ HTML

// Et en dessous, les MÊMES services, les MÊMES repositories,

// accueil.html complet minimal :
&lt;html xmlns:th="http://www.thymeleaf.org"&gt;               &lt;!-- namespace Thymeleaf --&gt;
&lt;body&gt;
  &lt;h1&gt;📚 Bibliothèque municipale&lt;/h1&gt;                    &lt;!-- titre --&gt;

  &lt;/li&gt;&lt;/ul&gt;
&lt;/body&gt;&lt;/html&gt;</pre>
<p>Tu sais maintenant servir les humains (HTML) et les machines (JSON) depuis le même projet. Demain : rendre l'application observable et prête pour la production.</p>`

    statement: "Écris (1) la méthode de contrôleur <code>GET /membres</code> (réservée aux bibliothécaires — l'annotation de la leçon 17 !) qui met la liste <code>membreService.actifs()</code> dans le Model et affiche le template <code>membres</code> ; (2) le template <code>membres.html</code> : un tableau avec nom et email de chaque membre, et la mention « Aucun membre actif » si la liste est vide (attribut <code>th:if=&quot;\${membres.isEmpty()}&quot;</code>).",

    solution: "// --- CONTROLLER ---\n@Controller\npublic class MembrePageController {\n    private final MembreService membreService;\n\n    public MembrePageController(MembreService membreService) {\n        this.membreService = membreService;\n    }\n\n    @GetMapping(\"/membres\")\n    @PreAuthorize(\"hasAnyRole('BIBLIOTHECAIRE','ADMIN')\") // page réservée\n    public String membres(Model model) {\n        model.addAttribute(\"membres\", membreService.actifs());\n        return \"membres\";               // → templates/membres.html\n    }\n}\n\n<!-- --- TEMPLATE templates/membres.html --- -->\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<body>\n  <h1>Membres actifs</h1>\n\n  <!-- cas liste vide -->\n  <p th:if=\"${membres.isEmpty()}\">Aucun membre actif.</p>\n\n  <table th:unless=\"${membres.isEmpty()}\">\n    <tr><th>Nom</th><th>Email</th></tr>\n    <tr th:each=\"m : ${membres}\">          <!-- une ligne par membre -->\n      <td th:text=\"${m.nom}\">nom</td>      <!-- échappé : anti-XSS -->\n      <td th:text=\"${m.email}\">email</td>\n    </tr>\n  </table>\n</body>\n</html>",
