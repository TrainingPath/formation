<h3>1. Les loisirs — de vrije tijd</h3>
<p>« Le temps libre » se dit <strong>de vrije tijd</strong>. Voici des activités courantes :</p>
<pre class="pseudo">lezen           lire            muziek luisteren   écouter de la musique

tekenen         dessiner        dansen             danser
wandelen        se promener     reizen             voyager
fotograferen    photographier   gamen              jouer aux jeux vidéo</pre>
<p><strong>In mijn vrije tijd lees ik graag.</strong> = Pendant mon temps libre j'aime lire.</p>
<h3>2. Le sport — de sport</h3>
<p>Pour « faire du sport » on dit <strong>sporten</strong> ou <strong>aan sport doen</strong>. Beaucoup de sports utilisent le verbe <strong>spelen</strong> (jouer) :</p>
<pre class="pseudo">voetballen      jouer au foot   voetbal        le football
tennissen       jouer au tennis zwemmen        nager
fietsen         faire du vélo   hardlopen      courir
basketbal spelen jouer au basket schaatsen     patiner</pre>
<p><strong>Ik speel elke week voetbal.</strong> = Je joue au foot chaque semaine. · <strong>Zij zwemt twee keer per week.</strong> = Elle nage deux fois par semaine.</p>
<h3>3. Dire ce qu'on aime : graag et houden van</h3>
<p>Deux façons d'exprimer le goût. <strong>graag</strong> se place après le verbe conjugué : <strong>Ik dans graag.</strong> (J'aime danser.) L'expression <strong>houden van</strong> = aimer : <strong>Ik hou van muziek.</strong> (J'aime la musique.)</p>
<pre class="pseudo">Ik voetbal graag.            J'aime jouer au foot.
Ik hou van lezen.            J'aime lire.
Ik vind tennis leuk.         Je trouve le tennis sympa.
Ik heb een hekel aan gamen.  Je déteste les jeux vidéo.</pre>
<h3>4. La fréquence</h3>
<pre class="pseudo">altijd   toujours   vaak     souvent   soms     parfois
zelden   rarement   nooit    jamais
één keer per week   une fois par semaine
elke dag            chaque jour</pre>
