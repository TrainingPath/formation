var DAY = {

  title: "Le conditionnel avec zou",
  subtitle: "Exprimer un souhait, une hypothèse ou une demande polie avec zou / zouden.",
  theory: `
<h3>1. Le conditionnel : zou + infinitif</h3>
<p>Le conditionnel se forme avec l'auxiliaire <strong>zou / zouden</strong> et un infinitif rejeté à la fin. Il correspond au français « je ferais, je voudrais ».</p>
<pre class="pseudo">Ik zou graag een koffie drinken.   Je voudrais bien boire un café.
Wij zouden naar Spanje reizen.     Nous voyagerions en Espagne.</pre>
<h3>2. Les formes de zou</h3>
<pre class="pseudo">ik zou        wij zouden
jij zou       jullie zouden
hij/zij zou   zij zouden</pre>
<p>« zou » pour le singulier, « zouden » pour le pluriel. L'infinitif va toujours à la fin.</p>
<h3>3. La politesse</h3>
<p>« zou » rend une demande plus polie.</p>
<pre class="pseudo">Zou je het raam kunnen openen?     Pourrais-tu ouvrir la fenêtre ?
Ik zou graag willen betalen.       Je voudrais payer.
Zou u mij kunnen helpen?           Pourriez-vous m'aider ?</pre>
<h3>4. L'hypothèse avec « als »</h3>
<p>Pour une condition irréelle : <strong>Als</strong> + prétérit, puis <strong>zou</strong> + infinitif.</p>
<pre class="pseudo">Als ik tijd had, zou ik meer lezen.   Si j'avais le temps, je lirais plus.
Als het niet regende, zouden we gaan wandelen.</pre>
<div class="tip">Pour donner un conseil poliment : <strong>Ik zou het niet doen.</strong> (Je ne le ferais pas / À ta place, je ne le ferais pas.)</div>
<div class="warn">Après « zou », le verbe principal reste à l'<strong>infinitif</strong> et se place à la fin : « Ik zou graag komen », jamais « Ik zou graag kom ».</div>`,
  exercises: [
    { type: "qcm", q: "« Ik zou graag komen » signifie…", opts: ["Je viens", "Je voudrais bien venir", "Je suis venu", "Je viendrai sûrement"], a: 1, exp: "zou + infinitif = conditionnel : je voudrais venir." },
    { type: "input", q: "Complète : « Wij ___ naar Spanje reizen. » (conditionnel pluriel de zou)", a: ["zouden"], ph: "un mot", exp: "pluriel : wij zouden." },
    { type: "qcm", q: "La forme de « zou » pour « jij » est…", opts: ["zouden", "zou", "zult", "zal"], a: 1, exp: "jij zou (singulier)." },
    { type: "vf", q: "Après « zou », le verbe principal se met à l'infinitif à la fin.", a: true, exp: "Ik zou graag komen." },
    { type: "input", q: "Complète : « Ik zou graag een koffie ___ . » (boire, infinitif)", a: ["drinken"], ph: "un verbe", exp: "infinitif à la fin : drinken." },
    { type: "qcm", q: "« Zou je het raam kunnen openen? » est…", opts: ["un ordre", "une demande polie", "une question au passé", "une négation"], a: 1, exp: "zou rend la demande polie." },
    { type: "input", q: "Complète l'hypothèse : « Als ik tijd ___, zou ik meer lezen. » (avoir, prétérit)", a: ["had"], ph: "un verbe", exp: "als + prétérit : als ik tijd had." },
    { type: "vf", q: "« zouden » s'emploie au pluriel.", a: true, exp: "wij / jullie / zij zouden." },
    { type: "qcm", q: "« Ik zou het niet doen » sert à…", opts: ["raconter le passé", "donner un conseil", "poser une question", "exprimer une certitude"], a: 1, exp: "C'est un conseil poli : à ta place, je ne le ferais pas." },
    { type: "input", q: "Traduis « je voudrais » (avec graag) : « ik ___ graag »", a: ["zou"], ph: "un mot", exp: "ik zou graag = je voudrais bien." },
    { type: "input", q: "L'hypothèse irréelle utilise « als » + le ___ (temps du passé simple).", a: ["prétérit", "preterit"], ph: "un mot", exp: "Als ik tijd had, zou ik… : als + prétérit." },
    { type: "vf", q: "On dit « Ik zou graag kom ».", a: false, exp: "Il faut l'infinitif : Ik zou graag komen." },
    { type: "input", q: "Compréhension : « Als ik rijk was, zou ik een huis kopen. » Que ferait-il ? een huis ___ (acheter)", a: ["kopen"], ph: "un verbe", exp: "zou ik een huis kopen = j'achèterais une maison." },
    { type: "qcm", q: "Compréhension : « Zou u mij kunnen helpen? » Que fait la personne ?", opts: ["elle refuse", "elle demande poliment de l'aide", "elle donne un ordre", "elle remercie"], a: 1, exp: "demande polie d'aide." },
    { type: "qcm", q: "Compréhension : « Ik zou graag willen betalen. » Que veut faire la personne ?", opts: ["partir", "payer", "manger", "commander"], a: 1, exp: "willen betalen = vouloir payer." }
  ],
  final: {
    title: "Exercice final — Als ik veel geld had",
    intro: `<p>Lis ce texte au conditionnel, puis réponds :</p>
<pre class="pseudo">Wat zou ik doen met veel geld?
Eerst zou ik een groot huis kopen bij de zee.
Ik zou elke dag zwemmen en lange wandelingen maken.
Ik zou ook veel reizen, want ik hou van andere landen.
Mijn familie zou met mij mee mogen komen.
Maar ik zou blijven werken, want ik vind mijn werk leuk.</pre>`,
    questions: [

      { type: "input", q: "Où serait la maison ? bij de ___ (mer, en néerlandais)", a: ["zee"], ph: "un mot", exp: "bij de zee = près de la mer." },
      { type: "qcm", q: "Que ferait-il chaque jour ?", opts: ["travailler", "nager", "dormir", "cuisiner"], a: 1, exp: "elke dag zwemmen = nager chaque jour." },
      { type: "vf", q: "Il arrêterait de travailler.", a: false, exp: "Ik zou blijven werken = je continuerais à travailler." },
      { type: "input", q: "Pourquoi aime-t-il voyager ? Hij houdt van andere ___ (pays, en néerlandais)", a: ["landen"], ph: "un mot", exp: "ik hou van andere landen = j'aime les autres pays." }
    ],
    solution: `<p>Traduction : « Que ferais-je avec beaucoup d'argent ? D'abord j'achèterais une grande maison près de la mer. Je nagerais chaque jour et je ferais de longues promenades. Je voyagerais aussi beaucoup, car j'aime les autres pays. Ma famille pourrait venir avec moi. Mais je continuerais à travailler, car j'aime mon travail. »</p>
<p>Remarque : chaque « zou / zouden » est suivi d'un infinitif rejeté à la fin (kopen, zwemmen, reizen, blijven werken).</p>`
  }
};
</script>
