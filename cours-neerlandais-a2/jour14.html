<script>
var DAY = {

  title: "Les prépositions de temps",
  subtitle: "Om, op, in, na, voor : situer une action dans le temps.",
  theory: `
<h3>1. Choisir la bonne préposition</h3>
<p>Les <strong>prépositions de temps</strong> précisent quand une action se passe. Le néerlandais choisit une préposition selon qu'il s'agit d'une heure, d'un jour, d'un mois ou d'une saison.</p>
<pre class="pseudo">om    -> une heure precise   : om drie uur (a trois heures)
op    -> un jour / une date  : op maandag (le lundi)
in    -> mois, saison, annee : in juni, in de zomer, in 2025
na    -> apres               : na het eten (apres le repas)
voor  -> avant               : voor de les (avant le cours)</pre>
<h3>2. « om » pour l'heure</h3>
<p>Pour une heure précise, on emploie toujours <code>om</code> :</p>
<pre class="pseudo">De trein vertrekt om acht uur.   // Le train part a huit heures.
Wij eten om zeven uur.           // Nous mangeons a sept heures.</pre>
<h3>3. « op » pour les jours</h3>
<p>Pour un jour de la semaine ou une date, on emploie <code>op</code> :</p>
<pre class="pseudo">Op zaterdag werk ik niet.        // Le samedi je ne travaille pas.
De vergadering is op 3 mei.      // La reunion est le 3 mai.</pre>
<h3>4. « in » pour mois, saisons, années</h3>
<pre class="pseudo">In augustus ga ik op vakantie.   // En aout je pars en vacances.
In de winter is het koud.        // En hiver il fait froid.</pre>
<div class="warn">Piège fréquent : ne dis pas <em>in maandag</em> ni <em>op augustus</em>. C'est <strong>op maandag</strong> (jour) mais <strong>in augustus</strong> (mois). Jour = op, mois/saison = in.</div>
<h3>5. « na » et « voor » : après et avant</h3>
<pre class="pseudo">Na het werk ga ik sporten.       // Apres le travail je fais du sport.
Voor het slapen lees ik.         // Avant de dormir je lis.</pre>
<div class="tip">Mémo rapide : <strong>om</strong> l'heure, <strong>op</strong> le jour, <strong>in</strong> le mois/la saison, <strong>na</strong> = après, <strong>voor</strong> = avant.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle préposition pour une heure précise ?", opts: ["op", "in", "om", "na"], a: 2, exp: "om acht uur = a huit heures." },
    { type: "input", q: "« Le train part à huit heures » : De trein vertrekt ___ acht uur.", a: ["om"], ph: "préposition", exp: "Heure precise -> om." },
    { type: "qcm", q: "Quelle préposition pour un jour de la semaine ?", opts: ["in", "op", "om", "voor"], a: 1, exp: "op maandag, op zaterdag = jour." },
    { type: "input", q: "« Le samedi je ne travaille pas » : ___ zaterdag werk ik niet.", a: ["op"], ph: "préposition", exp: "Jour -> op zaterdag." },
    { type: "vf", q: "On dit « in augustus » pour « en août ».", a: true, exp: "Mois -> in : in augustus." },
    { type: "qcm", q: "« En hiver il fait froid » : quelle préposition ?", opts: ["op de winter", "om de winter", "in de winter", "na de winter"], a: 2, exp: "Saison -> in de winter." },
    { type: "input", q: "« Après le travail je fais du sport » : ___ het werk ga ik sporten.", a: ["na"], ph: "préposition", exp: "apres -> na het werk." },
    { type: "qcm", q: "Que signifie <code>voor</code> comme préposition de temps ?", opts: ["après", "avant", "pendant", "à"], a: 1, exp: "voor = avant (voor de les = avant le cours)." },
    { type: "input", q: "« Avant de dormir je lis » : ___ het slapen lees ik.", a: ["voor"], ph: "préposition", exp: "avant -> voor het slapen." },
    { type: "vf", q: "On peut dire « in maandag » pour « le lundi ».", a: false, exp: "Faux : jour -> op maandag, pas in." },
    { type: "qcm", q: "« Nous mangeons à sept heures » : quelle préposition ?", opts: ["op zeven uur", "in zeven uur", "om zeven uur", "na zeven uur"], a: 2, exp: "Heure -> om zeven uur." },
    { type: "input", q: "« En août je pars en vacances » : ___ augustus ga ik op vakantie.", a: ["in"], ph: "préposition", exp: "Mois -> in augustus." },
    { type: "qcm", q: "Quelle préposition pour une année (2025) ?", opts: ["op", "om", "in", "na"], a: 2, exp: "Annee -> in 2025." },
    { type: "input", q: "« La réunion est le 3 mai » : De vergadering is ___ 3 mei.", a: ["op"], ph: "préposition", exp: "Date precise -> op 3 mei." },
    { type: "vf", q: "<code>na</code> signifie « après » et <code>voor</code> signifie « avant ».", a: true, exp: "na = apres, voor = avant." }
  ],
  final: {
    title: "Exercice final — L'agenda de Karel",
    intro: `<p>Karel organise sa semaine.</p>
<pre class="pseudo">Op maandag begin ik om negen uur. In de winter werk ik meer. De vergadering is op 5 maart. Na het werk ga ik naar de sportschool. Voor het eten bel ik mijn moeder. In augustus ben ik op vakantie.</pre>
<p>(vergadering = réunion, sportschool = salle de sport, moeder = mère, vakantie = vacances)</p>`,
    questions: [
      { type: "input", q: "Complète : ___ maandag begin ik om negen uur. (jour)", a: ["op"], ph: "préposition", exp: "Jour -> op maandag." },
      { type: "qcm", q: "Pourquoi « om negen uur » ?", opts: ["Erreur", "om s'emploie pour une heure précise", "Par hasard", "Parce que maandag"], a: 1, exp: "Heure -> om." },
      { type: "input", q: "Complète : ___ het werk ga ik naar de sportschool. (après)", a: ["na"], ph: "préposition", exp: "apres -> na het werk." },
      { type: "vf", q: "Dans « In augustus ben ik op vakantie », « in » est correct pour un mois.", a: true, exp: "Mois -> in augustus." },
      { type: "qcm", q: "« De vergadering is op 5 maart » : pourquoi « op » ?", opts: ["Pour une saison", "Pour une date précise", "Pour une heure", "Pour une année"], a: 1, exp: "Date -> op 5 maart." }
    ],
    solution: `<p>Prépositions de temps du texte : <code>op</code> (maandag, 5 maart), <code>om</code> (negen uur), <code>in</code> (de winter, augustus), <code>na</code> (het werk), <code>voor</code> (het eten).</p>
<pre class="pseudo">om   -> heure precise (om negen uur)
op   -> jour / date   (op maandag, op 5 maart)
in   -> mois / saison / annee (in augustus, in de winter)
na   -> apres (na het werk)
voor -> avant (voor het eten)</pre>
<p>Retiens la répartition : heure = om, jour = op, mois/saison = in. C'est le choix le plus souvent testé.</p>`
  }
};
</script>
