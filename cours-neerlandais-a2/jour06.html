var DAY = {
  num: 6,
  title: "Le futur : gaan et zullen",
  subtitle: "Parler de demain : deux auxiliaires, l'infinitif rejeté à la fin.",
  theory: `
<h3>1. Deux façons de dire le futur</h3>
<p>Le néerlandais exprime le futur avec deux auxiliaires : <code>gaan</code> (aller) et <code>zullen</code> (« vouloir/devoir » ~ le futur). Dans les deux cas, l'auxiliaire est conjugué en <strong>deuxième position</strong> et le <strong>verbe principal reste à l'infinitif, rejeté à la fin</strong> — exactement comme le participe au perfectum.</p>
<pre class="pseudo">Ik ga morgen werken.        // Je vais travailler demain.
Ik zal je helpen.           // Je t'aiderai. / Je vais t'aider.</pre>
<h3>2. Le futur avec gaan (intention, projet)</h3>
<p><code>gaan</code> + infinitif exprime un <strong>projet</strong>, une intention proche, comme le français « je vais faire ». C'est la forme la plus courante à l'oral. Rappel de la conjugaison de gaan :</p>
<pre class="pseudo">ik ga            wij gaan
jij gaat         jullie gaan
hij/zij gaat     zij gaan</pre>
<pre class="pseudo">Wij gaan volgend jaar naar Spanje reizen.   // Nous allons voyager en Espagne l'an prochain.
Zij gaat een nieuwe auto kopen.             // Elle va acheter une nouvelle voiture.</pre>
<div class="warn">Avec un verbe de mouvement, on n'empile pas deux « gaan ». On ne dit pas « Ik ga naar huis gaan » mais simplement « Ik ga naar huis » (le gaan de mouvement suffit).</div>
<h3>3. Le futur avec zullen (promesse, prévision)</h3>
<p><code>zullen</code> + infinitif exprime une <strong>promesse</strong>, une prévision ou une proposition. Il est un peu plus formel. Sa conjugaison est irrégulière :</p>
<pre class="pseudo">ik zal           wij zullen
jij zult / zal   jullie zullen
hij/zij zal      zij zullen</pre>
<pre class="pseudo">Ik zal morgen bellen.         // J'appellerai demain. (promesse)
Het zal wel regenen.          // Il va probablement pleuvoir. (prevision)
Zullen wij samen eten ?       // Si on mangeait ensemble ? (proposition)</pre>
<div class="tip">« Zullen we... ? » est LA formule pour proposer quelque chose : « Zullen we gaan ? » = « On y va ? ». Très utile au quotidien.</div>
<h3>4. Le présent suffit souvent !</h3>
<p>Comme en français (« demain je pars »), le néerlandais utilise très souvent le <strong>présent</strong> avec un mot de temps futur (morgen, volgende week...). Pas besoin d'auxiliaire.</p>
<pre class="pseudo">Morgen werk ik thuis.            // Demain je travaille (= travaillerai) a la maison.
Volgende week ga ik op reis.     // La semaine prochaine je pars en voyage.</pre>
<h3>5. La place des mots : infinitif à la fin</h3>
<p>Retiens bien la structure. L'auxiliaire (ga/zal) est en 2e place ; l'infinitif (le vrai verbe) ferme la phrase. Tout le reste se met au milieu.</p>
<pre class="pseudo">Ik  zal  morgen mijn oma  bezoeken.        // Je rendrai visite a ma grand-mere demain.
     ^                       ^
 auxiliaire (place 2)    infinitif (fin)</pre>`,
  exercises: [
    { type: "qcm", q: "Où se place le verbe principal (infinitif) dans un futur avec gaan/zullen ?", opts: ["En place 2", "À la fin de la phrase", "Avant le sujet", "Juste après le sujet"], a: 1, exp: "L'auxiliaire est en place 2 ; l'infinitif est rejete a la fin." },
    { type: "input", q: "Complète avec l'auxiliaire gaan : Ik ___ morgen werken.", a: ["ga"], ph: "conjugaison de gaan", exp: "ik ga (+ infinitif werken a la fin)." },
    { type: "qcm", q: "Quelle nuance exprime souvent <code>gaan</code> + infinitif ?", opts: ["Une obligation", "Une intention, un projet proche", "Le passé", "Une hypothèse irréelle"], a: 1, exp: "gaan + inf. = 'je vais faire', un projet." },
    { type: "input", q: "Complète : Wij ___ volgend jaar naar Spanje reizen. (gaan, nous)", a: ["gaan"], ph: "conjugaison de gaan", exp: "wij gaan." },
    { type: "qcm", q: "Conjugaison de <code>zullen</code> à « ik » ?", opts: ["ik zul", "ik zal", "ik zullt", "ik zalt"], a: 1, exp: "ik zal (irregulier)." },
    { type: "input", q: "Complète : Ik ___ je morgen helpen. (zullen, promesse)", a: ["zal"], ph: "conjugaison de zullen", exp: "ik zal + infinitif helpen a la fin." },
    { type: "qcm", q: "Comment propose-t-on « on mange ensemble ? » ?", opts: ["Wij eten samen ?", "Zullen wij samen eten ?", "Gaan wij eten samen ?", "Wij zullen eten samen ?"], a: 1, exp: "Zullen we... ? = proposition ; l'infinitif eten ferme la phrase." },
    { type: "input", q: "Complète : Zij ___ een nieuwe auto kopen. (gaan, elle)", a: ["gaat"], ph: "conjugaison de gaan", exp: "hij/zij gaat." },
    { type: "vf", q: "« Ik ga naar huis gaan » est correct.", a: false, exp: "On n'empile pas deux gaan : on dit simplement Ik ga naar huis." },
    { type: "qcm", q: "Quelle phrase respecte l'ordre des mots ?", opts: ["Ik zal helpen je morgen.", "Ik zal morgen je helpen.", "Ik morgen zal je helpen.", "Zal ik morgen je helpen."], a: 1, exp: "zal en place 2, infinitif helpen a la fin." },
    { type: "vf", q: "On peut exprimer le futur avec le présent + un mot de temps (morgen, volgende week).", a: true, exp: "Comme en francais : 'Morgen werk ik thuis' = demain je travaillerai chez moi." },
    { type: "input", q: "Complète : Het ___ wel regenen. (zullen, prévision, il)", a: ["zal"], ph: "conjugaison de zullen", exp: "het zal wel regenen : prevision." },
    { type: "qcm", q: "Traduction de « Nous allons acheter une maison » ?", opts: ["Wij gaan een huis kopen.", "Wij kopen gaan een huis.", "Wij een huis gaan kopen.", "Gaan wij een huis kopen."], a: 0, exp: "gaan en place 2, infinitif kopen a la fin." },
    { type: "input", q: "Complète : Morgen ___ ik thuis. (présent de werken, futur par le temps)", a: ["werk"], ph: "present", exp: "Morgen werk ik thuis : le present suffit avec 'morgen'." },
    { type: "qcm", q: "Quel auxiliaire pour une PROMESSE formelle ?", opts: ["gaan", "zullen", "hebben", "worden"], a: 1, exp: "zullen exprime plutot la promesse / prevision ; gaan plutot le projet." }
  ],
  final: {
    title: "Exercice final — Les projets du week-end",
    intro: `<p>Lis les projets de Nina.</p>
<pre class="pseudo">Dit weekend ga ik veel doen. Zaterdag ga ik met mijn zus winkelen. Daarna zullen wij samen koken. 's Avonds zal ik een film kijken. Zondag ga ik mijn oma bezoeken. Ik zal haar bloemen geven. Het wordt een leuk weekend !</pre>
<p>(winkelen = faire les courses, bezoeken = rendre visite, leuk = sympa)</p>`,
    questions: [
      { type: "input", q: "Complète : Zaterdag ___ ik met mijn zus winkelen. (gaan, je)", a: ["ga"], ph: "gaan", exp: "ik ga + infinitif winkelen a la fin." },
      { type: "qcm", q: "Dans « zullen wij samen koken », où est l'infinitif koken ?", opts: ["En place 2", "À la fin", "Avant zullen", "Avant wij"], a: 1, exp: "L'infinitif est rejete a la fin ; zullen est en place 2." },
      { type: "input", q: "Complète : 's Avonds ___ ik een film kijken. (zullen, je)", a: ["zal"], ph: "zullen", exp: "ik zal + infinitif kijken a la fin." },
      { type: "qcm", q: "« Ik zal haar bloemen geven » : quelle nuance ?", opts: ["Un fait passé", "Une intention/promesse pour le futur", "Une obligation présente", "Une question"], a: 1, exp: "zullen + infinitif exprime le futur (promesse)." },
      { type: "vf", q: "L'infinitif du verbe principal ferme la phrase dans tous ces exemples.", a: true, exp: "doen, winkelen, koken, kijken, bezoeken, geven : tous rejetes a la fin." }
    ],
    solution: `<p>Structures futures du texte : <code>ga ... doen</code>, <code>ga ... winkelen</code>, <code>zullen ... koken</code>, <code>zal ... kijken</code>, <code>ga ... bezoeken</code>, <code>zal ... geven</code>.</p>
<pre class="pseudo">gaan  + infinitif -> projet, intention proche
zullen + infinitif -> promesse, prevision, proposition (Zullen we...?)
place : auxiliaire en 2, infinitif a la FIN</pre>
<p>Que tu choisisses <strong>gaan</strong> ou <strong>zullen</strong>, la mécanique est la même que le perfectum : un auxiliaire en place 2 et le vrai verbe rejeté à la fin. C'est le grand principe du néerlandais.</p>`
  }
};
</script>
