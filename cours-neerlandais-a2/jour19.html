<script>
var DAY = {
  num: 19,
  title: "Décrire une ville et des lieux",
  subtitle: "Parler des bâtiments, indiquer un chemin et situer les endroits.",
  theory: `
<h3>1. Les lieux de la ville — de stad</h3>
<pre class="pseudo">het plein       la place        de straat     la rue
de kerk         l'église        het museum    le musée
het park        le parc         de markt      le marché
het station     la gare         de winkel     le magasin
de brug         le pont         de gracht     le canal</pre>
<p><strong>In het centrum is er een groot plein.</strong> = Dans le centre il y a une grande place.</p>
<h3>2. Décrire : il y a / c'est</h3>
<p>Pour dire « il y a », on utilise <strong>er is</strong> (singulier) / <strong>er zijn</strong> (pluriel) :</p>
<pre class="pseudo">Er is een mooie kerk.        Il y a une belle église.
Er zijn veel winkels.        Il y a beaucoup de magasins.
De stad is groot en druk.    La ville est grande et animée.</pre>
<p>Adjectifs utiles : <strong>groot</strong> (grand), <strong>klein</strong> (petit), <strong>mooi</strong> (beau), <strong>oud</strong> (vieux), <strong>modern</strong> (moderne), <strong>druk</strong> (animé), <strong>rustig</strong> (calme).</p>
<h3>3. Les prépositions de lieu</h3>
<pre class="pseudo">naast     à côté de       tegenover   en face de
tussen    entre           achter      derrière
voor      devant          in het midden van  au milieu de
links     à gauche        rechts      à droite
rechtdoor tout droit      om de hoek  au coin</pre>
<p><strong>Het museum is naast de kerk.</strong> = Le musée est à côté de l'église. · <strong>De winkel is tegenover het station.</strong> = Le magasin est en face de la gare.</p>
<h3>4. Demander et indiquer le chemin</h3>
<p>Pour demander : <strong>Hoe kom ik bij het museum?</strong> (Comment aller au musée ?) · <strong>Waar is de markt?</strong> (Où est le marché ?)</p>
<pre class="pseudo">Ga rechtdoor.            Va tout droit.
Sla linksaf.             Tourne à gauche.
Sla rechtsaf.            Tourne à droite.
Het is aan het einde van de straat.  C'est au bout de la rue.</pre>
<div class="tip">Le verbe <strong>slaan</strong> (linksaf / rechtsaf slaan) = tourner. À l'impératif : « Sla linksaf » = « Tourne à gauche ».</div>
<div class="warn">« er is / er zijn » se traduit toujours par « il y a », mais l'accord change : <strong>er is</strong> + singulier, <strong>er zijn</strong> + pluriel. « Er zijn twee bruggen » (il y a deux ponts), pas « er is ».</div>`,

    { type: "qcm", q: "« naast » signifie…", opts: ["derrière", "à côté de", "en face de", "entre"], a: 1, exp: "naast = à côté de." },
    { type: "qcm", q: "Que veut dire « tegenover » ?", opts: ["à côté de", "en face de", "au coin", "entre"], a: 1, exp: "tegenover = en face de." },

    { type: "qcm", q: "« Sla linksaf » veut dire…", opts: ["Va tout droit", "Tourne à gauche", "Tourne à droite", "Arrête-toi"], a: 1, exp: "linksaf slaan = tourner à gauche." },
    { type: "input", q: "Complète : « Ga ___ » (Va tout droit)", a: ["rechtdoor"], ph: "un mot", exp: "rechtdoor = tout droit." },

    { type: "vf", q: "« Hoe kom ik bij het museum? » demande le chemin vers le musée.", a: true, exp: "Hoe kom ik bij… = comment aller à…" },
    { type: "input", q: "Traduis « à droite » : ___", a: ["rechts"], ph: "un mot", exp: "rechts = à droite." },
    { type: "qcm", q: "« tussen » signifie…", opts: ["entre", "devant", "derrière", "au coin"], a: 0, exp: "tussen = entre." },
    { type: "qcm", q: "Compréhension : « Het museum is tegenover het park, naast de kerk. » Où se trouve le musée ?", opts: ["dans le parc", "en face du parc et à côté de l'église", "derrière la gare", "au bout de la rue"], a: 1, exp: "tegenover het park + naast de kerk." },
    { type: "vf", q: "Compréhension : « De oude stad is rustig, maar het centrum is heel druk. » Le centre est calme.", a: false, exp: "Le centre est très animé (heel druk) ; c'est la vieille ville qui est calme." },
    { type: "qcm", q: "Compréhension : « Ga rechtdoor en sla dan rechtsaf; de markt is aan het einde van de straat. » Où est le marché ?", opts: ["au coin à gauche", "au bout de la rue après avoir tourné à droite", "en face de l'église", "à côté de la gare"], a: 1, exp: "Tout droit, à droite, puis au bout de la rue." }
  ],
  final: {
    title: "Exercice final — De weg vragen",
    intro: `<p>Lis ces indications dans une ville, puis réponds :</p>
<pre class="pseudo">Toerist: Pardon, hoe kom ik bij het museum?

         Bij de kerk slaat u linksaf.

    questions: [

      { type: "qcm", q: "Le musée est situé…", opts: ["à côté de la gare", "en face du parc", "derrière l'église", "au bout du canal"], a: 1, exp: "tegenover het park." },
      { type: "input", q: "Qu'y a-t-il à côté du musée ? een mooi ___", a: ["café", "cafe"], ph: "un mot", exp: "een mooi café naast het museum." },
      { type: "input", q: "Combien de minutes de marche ? (nombre)", a: ["5", "vijf"], ph: "nombre", exp: "ongeveer vijf minuten lopen." }
    ],
    solution: `<p>Traduction : « Pardon, comment aller au musée ? — Allez tout droit jusqu'à la grande place. À l'église, tournez à gauche. Le musée est en face du parc. Il y a aussi un joli café à côté du musée. — Merci beaucoup ! Est-ce loin ? — Non, environ cinq minutes à pied. »</p>
<p>Décrire un lieu combine trois outils : les noms de bâtiments (<strong>kerk, museum, park</strong>), les prépositions (<strong>tegenover, naast</strong>) et les directions (<strong>rechtdoor, linksaf</strong>).</p>`
  }
