<script>
var DAY = {
  num: 20,
  title: "Le temps qu'il fait",
  subtitle: "Décrire la météo, les saisons et réagir au temps.",
  theory: `
<h3>1. Le temps : het weer</h3>
<p>Pour parler de la météo, on commence souvent par <strong>Het is…</strong> ou <strong>Het weer is…</strong> :</p>
<pre class="pseudo">Het is mooi weer.        Il fait beau.
Het is slecht weer.      Il fait mauvais.
Het is warm / koud.      Il fait chaud / froid.
Het is zonnig.           Il y a du soleil.
Het is bewolkt.          Le ciel est nuageux.</pre>
<h3>2. La pluie, la neige, le vent</h3>
<p>Certains phénomènes s'expriment avec le verbe impersonnel <strong>het regent</strong> (il pleut), <strong>het sneeuwt</strong> (il neige), <strong>het waait</strong> (il y a du vent) :</p>
<pre class="pseudo">Het regent.        Il pleut.       de regen    la pluie
Het sneeuwt.       Il neige.       de sneeuw   la neige
Het waait hard.    Il vente fort.  de wind     le vent
Het is mistig.     Il y a du brouillard.   de mist  le brouillard
Het onweert.       Il y a de l'orage.       de zon   le soleil</pre>
<h3>3. Les saisons — de seizoenen</h3>
<pre class="pseudo">de lente      le printemps    de zomer    l'été
de herfst     l'automne       de winter   l'hiver</pre>
<p><strong>In de zomer is het warm en zonnig.</strong> = En été il fait chaud et ensoleillé. · <strong>In de winter sneeuwt het soms.</strong> = En hiver il neige parfois.</p>
<h3>4. La température et les prévisions</h3>
<p>La température se dit avec <strong>graden</strong> (degrés) : <strong>Het is twintig graden.</strong> (Il fait vingt degrés.) Pour les prévisions, on emploie souvent le futur avec <strong>gaan</strong> ou <strong>worden</strong> :</p>
<pre class="pseudo">Morgen wordt het kouder.       Demain il fera plus froid.
Het gaat regenen.              Il va pleuvoir.
Wat voor weer wordt het?       Quel temps va-t-il faire ?</pre>
<div class="tip">Question courante : <strong>Wat voor weer is het?</strong> = Quel temps fait-il ? On répond simplement par « Het is… ».</div>
<div class="warn">Les verbes météo sont impersonnels : le sujet est toujours <strong>het</strong>. On dit « Het regent », jamais « De regen regent ». De même : het sneeuwt, het waait, het vriest (il gèle).</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « Il fait beau » ?", opts: ["Het is koud", "Het is mooi weer", "Het regent", "Het waait"], a: 1, exp: "mooi weer = beau temps." },
    { type: "input", q: "Complète : « Het ___ » (Il pleut)", a: ["regent"], ph: "un verbe", exp: "regenen → het regent." },
    { type: "qcm", q: "« Het sneeuwt » veut dire…", opts: ["Il pleut", "Il neige", "Il vente", "Il gèle"], a: 1, exp: "sneeuwen = neiger." },
    { type: "qcm", q: "Quelle saison est « de herfst » ?", opts: ["le printemps", "l'été", "l'automne", "l'hiver"], a: 2, exp: "de herfst = l'automne." },
    { type: "input", q: "Traduis « le vent » : de ___", a: ["wind"], ph: "un mot", exp: "de wind = le vent." },
    { type: "vf", q: "« Het is bewolkt » veut dire « Le ciel est nuageux ».", a: true, exp: "bewolkt = nuageux." },
    { type: "qcm", q: "Comment dit-on « Il fait vingt degrés » ?", opts: ["Het is twintig graden", "Het is twintig uur", "Het regent twintig", "Het waait twintig"], a: 0, exp: "graden = degrés." },
    { type: "input", q: "Complète : « In de ___ is het warm en zonnig. » (été)", a: ["zomer"], ph: "une saison", exp: "de zomer = l'été." },
    { type: "qcm", q: "« Het waait hard » signifie…", opts: ["Il fait très chaud", "Il vente fort", "Il pleut beaucoup", "Il gèle"], a: 1, exp: "waaien = venter." },
    { type: "vf", q: "Les verbes météo prennent toujours le sujet « het ».", a: true, exp: "Het regent, het sneeuwt, het waait : impersonnels." },
    { type: "input", q: "Traduis « le soleil » : de ___", a: ["zon"], ph: "un mot", exp: "de zon = le soleil." },
    { type: "qcm", q: "« Morgen wordt het kouder » veut dire…", opts: ["Hier il faisait froid", "Demain il fera plus froid", "Aujourd'hui il fait chaud", "Il ne fait jamais froid"], a: 1, exp: "worden = devenir → il fera plus froid." },
    { type: "qcm", q: "Compréhension : « Vandaag is het bewolkt en het gaat regenen, maar morgen wordt het zonnig. » Quel temps demain ?", opts: ["nuageux", "pluvieux", "ensoleillé", "neigeux"], a: 2, exp: "morgen wordt het zonnig = demain ensoleillé." },
    { type: "vf", q: "Compréhension : « In de winter vriest het vaak en soms sneeuwt het. » En hiver il gèle souvent.", a: true, exp: "het vriest vaak = il gèle souvent." },
    { type: "qcm", q: "Compréhension : « Het is 28 graden, de zon schijnt: perfect strandweer! » Quel temps fait-il ?", opts: ["froid et pluvieux", "chaud et ensoleillé", "venteux", "brumeux"], a: 1, exp: "28 graden + de zon schijnt = chaud et ensoleillé." }
  ],
  final: {
    title: "Exercice final — Het weerbericht",
    intro: `<p>Lis ce bulletin météo, puis réponds :</p>
<pre class="pseudo">Goedemorgen! Hier is het weerbericht voor vandaag.
In het noorden is het bewolkt en het regent soms.
In het zuiden schijnt de zon en wordt het warm, tot 24 graden.
Er waait een zwakke wind. Morgen wordt het overal zonnig.
Een fijne dag!</pre>`,
    questions: [
      { type: "qcm", q: "Quel temps fait-il dans le nord ?", opts: ["ensoleillé", "nuageux avec de la pluie", "neigeux", "orageux"], a: 1, exp: "bewolkt en het regent soms." },
      { type: "qcm", q: "Dans le sud, le temps est…", opts: ["pluvieux", "froid", "ensoleillé et chaud", "venteux et froid"], a: 2, exp: "de zon schijnt en wordt het warm." },
      { type: "input", q: "Quelle température maximale dans le sud ? (nombre de degrés)", a: ["24"], ph: "nombre", exp: "tot 24 graden." },
      { type: "qcm", q: "Comment est le vent ?", opts: ["fort", "faible", "nul", "glacial"], a: 1, exp: "een zwakke wind = un vent faible." },
      { type: "qcm", q: "Quel temps fera-t-il demain partout ?", opts: ["pluvieux", "nuageux", "ensoleillé", "neigeux"], a: 2, exp: "Morgen wordt het overal zonnig." }
    ],
    solution: `<p>Traduction : « Bonjour ! Voici le bulletin météo pour aujourd'hui. Dans le nord, le ciel est nuageux et il pleut parfois. Dans le sud, le soleil brille et il fera chaud, jusqu'à 24 degrés. Un vent faible souffle. Demain, il fera ensoleillé partout. Bonne journée ! »</p>
<p>Un bulletin météo combine l'état du ciel (<strong>bewolkt, zonnig</strong>), les précipitations (<strong>het regent</strong>), la température (<strong>graden</strong>) et le vent (<strong>de wind</strong>), souvent au futur avec <strong>wordt</strong>.</p>`
  }
};
</script>
