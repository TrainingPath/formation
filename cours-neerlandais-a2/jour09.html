<script>
var DAY = {
  num: 9,
  title: "Les adverbes de fréquence",
  subtitle: "Altijd, vaak, soms, nooit : dire à quelle fréquence on fait quelque chose.",
  theory: `
<h3>1. À quoi servent les adverbes de fréquence ?</h3>
<p>Les <strong>adverbes de fréquence</strong> répondent à la question <em>hoe vaak?</em> (à quelle fréquence ?). Ils précisent si une action se répète toujours, souvent, parfois ou jamais.</p>
<pre class="pseudo">altijd     // toujours       (100%)
meestal    // le plus souvent
vaak       // souvent
dikwijls   // souvent (synonyme de vaak)
soms       // parfois
zelden     // rarement
nooit      // jamais         (0%)</pre>
<h3>2. La place dans la phrase</h3>
<p>L'adverbe de fréquence se place normalement <strong>juste après le verbe conjugué</strong> (et après le sujet). C'est la position centrale de la phrase.</p>
<pre class="pseudo">Ik drink altijd koffie.        // Je bois toujours du café.
Wij eten vaak vis.             // Nous mangeons souvent du poisson.
Zij is soms moe.               // Elle est parfois fatiguee.</pre>
<h3>3. Mettre l'adverbe en tête pour insister</h3>
<p>On peut placer l'adverbe <strong>en début de phrase</strong> pour le mettre en relief. Attention : le verbe reste alors en deuxième position, donc le sujet passe après le verbe (inversion).</p>
<pre class="pseudo">Soms drink ik thee.            // Parfois je bois du the.
Meestal werkt hij thuis.      // Le plus souvent il travaille a la maison.</pre>
<div class="warn">Après un adverbe placé en tête, le verbe reste toujours en 2e position : <code>Soms + verbe + sujet</code>. On dit <em>Soms drink ik...</em> et jamais <em>Soms ik drink...</em>.</div>
<h3>4. Nooit = jamais (sans autre négation)</h3>
<p>Le mot <code>nooit</code> contient déjà la négation. On n'ajoute donc <strong>pas</strong> de <code>niet</code> ni de <code>geen</code>.</p>
<pre class="pseudo">Ik rook nooit.                // Je ne fume jamais.
Hij komt nooit te laat.       // Il n'arrive jamais en retard.</pre>
<div class="tip">Ordre logique du plus au moins fréquent : <strong>altijd &gt; meestal &gt; vaak &gt; soms &gt; zelden &gt; nooit</strong>. Apprends-les comme une échelle.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie <code>altijd</code> ?", opts: ["Parfois", "Jamais", "Toujours", "Rarement"], a: 2, exp: "altijd = toujours (100%)." },
    { type: "input", q: "« Je bois toujours du café » : Ik drink ___ koffie.", a: ["altijd"], ph: "adverbe", exp: "altijd = toujours, apres le verbe drink." },
    { type: "qcm", q: "Où se place normalement l'adverbe de fréquence ?", opts: ["À la fin de la phrase", "Juste après le verbe conjugué", "Avant le sujet toujours", "Entre deux noms"], a: 1, exp: "Position centrale : apres le verbe conjugue et le sujet." },
    { type: "input", q: "« Nous mangeons souvent du poisson » : Wij eten ___ vis.", a: ["vaak", "dikwijls"], ph: "adverbe", exp: "vaak (ou dikwijls) = souvent." },
    { type: "vf", q: "Le mot <code>nooit</code> signifie « jamais » et se combine sans « niet ».", a: true, exp: "nooit contient deja la negation, pas de niet en plus." },
    { type: "qcm", q: "Quelle phrase est correcte après un adverbe en tête ?", opts: ["Soms ik drink thee.", "Soms drink ik thee.", "Soms drinken ik thee.", "Soms ik thee drink."], a: 1, exp: "Adverbe en tete -> verbe en 2e position -> Soms drink ik thee." },
    { type: "input", q: "« Parfois je bois du thé » (adverbe en tête) : Soms ___ ik thee.", a: ["drink"], ph: "verbe", exp: "Inversion : Soms + drink + ik." },
    { type: "qcm", q: "Classe du plus fréquent au moins fréquent :", opts: ["nooit, soms, altijd", "altijd, vaak, nooit", "soms, altijd, vaak", "vaak, altijd, nooit"], a: 1, exp: "altijd (toujours) > vaak (souvent) > nooit (jamais)." },
    { type: "input", q: "« Il n'arrive jamais en retard » : Hij komt ___ te laat.", a: ["nooit"], ph: "adverbe", exp: "nooit = jamais, sans autre negation." },
    { type: "vf", q: "<code>zelden</code> signifie « rarement ».", a: true, exp: "zelden = rarement (proche de nooit)." },
    { type: "qcm", q: "Que signifie <code>meestal</code> ?", opts: ["Jamais", "Le plus souvent", "Parfois", "Rarement"], a: 1, exp: "meestal = le plus souvent, la plupart du temps." },
    { type: "input", q: "« Elle est parfois fatiguée » : Zij is ___ moe.", a: ["soms"], ph: "adverbe", exp: "soms = parfois, apres le verbe is." },
    { type: "qcm", q: "Synonyme de <code>vaak</code> ?", opts: ["nooit", "zelden", "dikwijls", "altijd"], a: 2, exp: "dikwijls = souvent, synonyme de vaak." },
    { type: "vf", q: "On peut dire « Ik rook nooit niet » pour insister.", a: false, exp: "Faux : nooit suffit, on n'ajoute jamais niet." },
    { type: "input", q: "« Le plus souvent il travaille à la maison » (adverbe en tête) : Meestal ___ hij thuis.", a: ["werkt"], ph: "verbe", exp: "Inversion apres l'adverbe : Meestal werkt hij." }
  ],
  final: {
    title: "Exercice final — La semaine de Lisa",
    intro: `<p>Lisa raconte ses habitudes.</p>
<pre class="pseudo">Ik sta altijd vroeg op. 's Morgens drink ik meestal thee, soms koffie. Ik ga vaak met de fiets naar het werk. Ik neem zelden de bus. Op zondag werk ik nooit.</pre>
<p>(opstaan = se lever, vroeg = tôt, fiets = vélo, zondag = dimanche)</p>`,
    questions: [
      { type: "input", q: "Complète : Ik sta ___ vroeg op (toujours).", a: ["altijd"], ph: "adverbe", exp: "altijd = toujours." },
      { type: "qcm", q: "Que boit Lisa le plus souvent le matin ?", opts: ["Du café", "Du thé", "De l'eau", "Du lait"], a: 1, exp: "'s Morgens drink ik meestal thee -> du the le plus souvent." },
      { type: "input", q: "Complète : Ik neem ___ de bus (rarement).", a: ["zelden"], ph: "adverbe", exp: "zelden = rarement." },
      { type: "vf", q: "Le dimanche, Lisa ne travaille jamais.", a: true, exp: "Op zondag werk ik nooit = jamais le dimanche." },
      { type: "qcm", q: "Dans « Op zondag werk ik nooit », pourquoi « werk » avant « ik » ?", opts: ["Erreur", "Op zondag est en tête, le verbe reste en 2e position", "Par hasard", "Parce que nooit"], a: 1, exp: "Element en tete -> inversion verbe-sujet." }
    ],
    solution: `<p>Adverbes du texte : <code>altijd</code> (toujours), <code>meestal</code> (le plus souvent), <code>soms</code> (parfois), <code>vaak</code> (souvent), <code>zelden</code> (rarement), <code>nooit</code> (jamais).</p>
<pre class="pseudo">position normale : sujet + verbe + adverbe   (Ik drink altijd koffie)
adverbe en tete  : adverbe + verbe + sujet    (Soms drink ik thee)
nooit            : deja negatif, pas de niet
echelle          : altijd > meestal > vaak > soms > zelden > nooit</pre>
<p>Retiens la place centrale de l'adverbe et l'inversion quand il passe en tête.</p>`
  }
};
</script>
