  title: "Les vêtements et le shopping",
  subtitle: "Nommer ses habits, choisir une taille et faire ses achats en néerlandais.",
  theory: `
<h3>1. Le vocabulaire des vêtements</h3>
<p>Le mot général pour « les vêtements » est <strong>de kleren</strong> ou <strong>de kleding</strong>. Voici les pièces les plus utiles (attention à l'article, de ou het) :</p>
<pre class="pseudo">de broek        le pantalon        de jas          le manteau
het hemd        la chemise         de trui         le pull
de jurk         la robe            de rok          la jupe
de schoenen     les chaussures     de sokken       les chaussettes
de muts         le bonnet          de sjaal        l'écharpe
de handschoenen les gants          de T-shirt      le t-shirt</pre>
<p>Exemple : <strong>Ik draag een blauwe broek en een witte trui.</strong> (Je porte un pantalon bleu et un pull blanc.) Le verbe <strong>dragen</strong> signifie « porter ».</p>
<h3>2. Les couleurs</h3>
<p>Les couleurs se placent devant le nom et prennent souvent un <strong>-e</strong> (revoir l'accord de l'adjectif) :</p>
<pre class="pseudo">rood    rouge      blauw   bleu       groen   vert
geel    jaune      zwart   noir       wit     blanc
bruin   brun       grijs   gris       roze    rose</pre>
<p><strong>een rode jas</strong> = un manteau rouge · <strong>zwarte schoenen</strong> = des chaussures noires.</p>
<h3>3. Faire du shopping : les phrases clés</h3>
<p>Le verbe <strong>winkelen</strong> (ou <strong>shoppen</strong>) veut dire « faire les magasins ». Dans un magasin (<strong>de winkel</strong>), on entend et on utilise :</p>
<pre class="pseudo">Kan ik u helpen?              Puis-je vous aider ?
Ik zoek een jas.              Je cherche un manteau.
Welke maat heeft u?           Quelle taille faites-vous ?
Hoeveel kost het?             Combien ça coûte ?
Mag ik dit passen?            Puis-je essayer ceci ?
Waar is de paskamer?          Où est la cabine d'essayage ?</pre>
<p>Mots utiles : <strong>de maat</strong> (la taille), <strong>de kleur</strong> (la couleur), <strong>de kassa</strong> (la caisse), <strong>de korting</strong> (la réduction), <strong>de kassabon</strong> (le ticket).</p>
<h3>4. Essayer : passen et staan</h3>
<p>Deux verbes se ressemblent mais ne veulent pas dire la même chose. <strong>passen</strong> = « être à la bonne taille » ; <strong>staan</strong> = « aller bien, seoir ».</p>
<pre class="pseudo">Deze broek past niet.        Ce pantalon ne me va pas (taille).
Dat staat je goed!           Ça te va bien ! (allure)</pre>
<div class="tip">Pour dire qu'un article est cher : <strong>duur</strong>. Bon marché : <strong>goedkoop</strong>. En solde : <strong>in de uitverkoop</strong>.</div>
<div class="warn">Ne confonds pas <strong>passen</strong> (la taille convient) et <strong>staan</strong> (le style flatte). « Het past, maar het staat me niet » = « C'est ma taille, mais ça ne me va pas ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le pantalon » en néerlandais ?", opts: ["de jas", "de broek", "de trui", "de rok"], a: 1, exp: "de broek = le pantalon." },
    { type: "qcm", q: "Que signifie « Mag ik dit passen? »", opts: ["Combien ça coûte ?", "Puis-je essayer ceci ?", "Où est la caisse ?", "Avez-vous ma taille ?"], a: 1, exp: "passen = essayer / être à la bonne taille." },
    { type: "input", q: "Complète : « Welke ___ heeft u? » (Quelle taille faites-vous ?)", a: ["maat"], ph: "un mot", exp: "de maat = la taille." },
    { type: "qcm", q: "« een rode jas » veut dire…", opts: ["un manteau vert", "un manteau rouge", "une robe rouge", "un pull rouge"], a: 1, exp: "rood = rouge, de jas = le manteau." },
    { type: "vf", q: "Le verbe « dragen » signifie « porter (un vêtement) ».", a: true, exp: "Ik draag een trui = je porte un pull." },
    { type: "input", q: "Traduis « les chaussures » : de ___", a: ["schoenen"], ph: "un mot", exp: "de schoenen = les chaussures." },
    { type: "qcm", q: "Quelle phrase demande le prix ?", opts: ["Waar is de paskamer?", "Hoeveel kost het?", "Kan ik u helpen?", "Welke kleur?"], a: 1, exp: "Hoeveel kost het? = Combien ça coûte ?" },
    { type: "vf", q: "« goedkoop » signifie « cher ».", a: false, exp: "goedkoop = bon marché ; duur = cher." },
    { type: "qcm", q: "Un vendeur dit « Kan ik u helpen? ». Il demande :", opts: ["Puis-je vous aider ?", "Quelle est votre taille ?", "Voulez-vous payer ?", "Où habitez-vous ?"], a: 0, exp: "helpen = aider." },
    { type: "input", q: "Complète : « Deze broek ___ niet » (Ce pantalon ne me va pas, taille)", a: ["past"], ph: "un verbe", exp: "passen → past (il/elle va)." },
    { type: "qcm", q: "« Dat staat je goed! » se dit quand…", opts: ["le prix est correct", "le vêtement te va bien (allure)", "la cabine est libre", "il y a une réduction"], a: 1, exp: "staan = aller bien, seoir." },
    { type: "input", q: "Traduis « la réduction » : de ___", a: ["korting"], ph: "un mot", exp: "de korting = la réduction." },
    { type: "qcm", q: "Compréhension : « Ik zoek een groene trui, maat M. » La personne cherche :", opts: ["un manteau vert taille L", "un pull vert taille M", "une jupe verte", "un pantalon vert taille M"], a: 1, exp: "trui = pull, groen = vert, maat M." },
    { type: "vf", q: "Compréhension : « De schoenen zijn te duur, maar er is korting. » Il y a une réduction sur les chaussures.", a: true, exp: "korting = réduction ; te duur = trop cher." },
    { type: "qcm", q: "Compréhension : « De jurk past goed, maar de kleur staat me niet. » Quel est le problème ?", opts: ["La taille", "La couleur", "Le prix", "La longueur"], a: 1, exp: "La taille va (past goed), mais la couleur ne flatte pas (staat me niet)." }
  ],
  final: {
    title: "Exercice final — In de kledingwinkel",
    intro: `<p>Lis ce court dialogue dans un magasin de vêtements, puis réponds :</p>
<pre class="pseudo">Verkoper: Goedemorgen, kan ik u helpen?
Klant:    Ja, ik zoek een blauwe jas.
Verkoper: Welke maat heeft u?
Klant:    Maat L. Mag ik hem passen?
Verkoper: Natuurlijk, de paskamer is daar. Hij kost 60 euro,
          maar vandaag is er 20% korting.</pre>`,
    questions: [
      { type: "qcm", q: "Que cherche la cliente ?", opts: ["une robe bleue", "un manteau bleu", "un pull vert", "des chaussures"], a: 1, exp: "een blauwe jas = un manteau bleu." },
      { type: "input", q: "Quelle taille demande-t-elle ? Maat ___", a: ["L", "l"], ph: "lettre", exp: "Maat L." },
      { type: "qcm", q: "Que veut-elle faire avec le manteau ?", opts: ["le payer tout de suite", "l'essayer", "l'échanger", "le commander"], a: 1, exp: "Mag ik hem passen? = Puis-je l'essayer ?" },
      { type: "input", q: "Combien coûte le manteau (en euros) avant réduction ?", a: ["60"], ph: "nombre", exp: "Hij kost 60 euro." },
      { type: "qcm", q: "Que se passe-t-il aujourd'hui ?", opts: ["Le magasin est fermé", "Il y a 20% de réduction", "La cabine est occupée", "Il n'y a plus la taille L"], a: 1, exp: "vandaag is er 20% korting = aujourd'hui il y a 20% de réduction." }
    ],
    solution: `<p>Traduction du dialogue : « Bonjour, puis-je vous aider ? — Oui, je cherche un manteau bleu. — Quelle taille faites-vous ? — Taille L. Puis-je l'essayer ? — Bien sûr, la cabine est là. Il coûte 60 euros, mais aujourd'hui il y a 20% de réduction. »</p>
<p>Retiens les quatre réflexes du shopping : nommer l'article (<strong>jas, maat L</strong>), demander à essayer (<strong>passen</strong>), demander le prix (<strong>kost</strong>) et repérer une bonne affaire (<strong>korting</strong>).</p>`
  }
};
