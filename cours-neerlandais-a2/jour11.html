<script>
var DAY = {
  num: 11,
  title: "Les subordonnées (omdat, dat, als)",
  subtitle: "La règle capitale : dans une subordonnée, le verbe part à la fin.",
  theory: `
<h3>1. Qu'est-ce qu'une subordonnée ?</h3>
<p>Une <strong>subordonnée</strong> est une phrase introduite par un mot de liaison (une conjonction) et qui dépend d'une phrase principale. En néerlandais, ces conjonctions déclenchent une règle capitale.</p>
<pre class="pseudo">omdat   // parce que
dat     // que
als     // si / quand
omdat / dat / als  ->  le VERBE va a la FIN</pre>
<h3>2. La règle d'or : le verbe à la fin</h3>
<p>Dans une subordonnée, le <strong>verbe conjugué se place tout à la fin</strong> de la subordonnée. C'est LA différence la plus importante avec la phrase principale (où le verbe est en 2e position).</p>
<pre class="pseudo">Principale : Ik blijf thuis. Ik ben ziek.
Subordonnee: Ik blijf thuis omdat ik ziek ben.
// Je reste a la maison parce que je suis malade.  (ben a la fin !)</pre>
<pre class="pseudo">Ik weet dat hij morgen komt.   // Je sais qu'il vient demain. (komt a la fin)
Ik ga wandelen als het mooi is.// Je vais me promener s'il fait beau. (is a la fin)</pre>
<div class="warn">Le piège classique : ne dis pas <em>omdat ik ben ziek</em>. Le verbe conjugué (<code>ben</code>) doit filer tout à la fin : <strong>omdat ik ziek ben</strong>.</div>
<h3>3. Omdat vs want</h3>
<p><code>want</code> et <code>omdat</code> veulent tous deux dire « parce que / car », mais ils ne se construisent PAS pareil :</p>
<pre class="pseudo">Ik blijf thuis, want ik ben ziek.   // want -> ordre normal (verbe en 2e)
Ik blijf thuis omdat ik ziek ben.   // omdat -> verbe a la fin</pre>
<h3>4. Subordonnée en tête : inversion dans la principale</h3>
<p>Si la subordonnée commence la phrase, elle compte comme un seul bloc en 1re position ; la principale fait alors l'inversion (verbe avant le sujet).</p>
<pre class="pseudo">Als het mooi is, ga ik wandelen.
// S'il fait beau, je vais me promener.  (ga ik = inversion)</pre>
<div class="tip">Réflexe : dès que tu écris <strong>omdat, dat ou als</strong>, cherche le verbe conjugué et envoie-le à la fin de la subordonnée.</div>`,
  exercises: [
    { type: "qcm", q: "Dans une subordonnée avec omdat/dat/als, où va le verbe conjugué ?", opts: ["En 1re position", "En 2e position", "À la fin", "N'importe où"], a: 2, exp: "Regle d'or : le verbe conjugue part a la fin." },
    { type: "input", q: "« parce que je suis malade » : ... omdat ik ziek ___ .", a: ["ben"], ph: "verbe à la fin", exp: "omdat -> verbe (ben) a la fin : omdat ik ziek ben." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ik weet dat hij komt morgen.", "Ik weet dat hij morgen komt.", "Ik weet dat komt hij morgen.", "Ik weet dat morgen hij komt."], a: 1, exp: "dat -> verbe komt a la fin : dat hij morgen komt." },
    { type: "input", q: "« Je sais qu'il vient demain » : Ik weet dat hij morgen ___ .", a: ["komt"], ph: "verbe à la fin", exp: "dat -> komt a la fin." },
    { type: "vf", q: "Avec <code>want</code>, l'ordre reste normal (verbe en 2e position).", a: true, exp: "want ne rejette pas le verbe, contrairement a omdat." },
    { type: "qcm", q: "Que signifie <code>als</code> ici ?", opts: ["parce que", "que", "si / quand", "mais"], a: 2, exp: "als = si / quand (condition)." },
    { type: "input", q: "« s'il fait beau » : ... als het mooi ___ .", a: ["is"], ph: "verbe à la fin", exp: "als -> verbe is a la fin : als het mooi is." },
    { type: "qcm", q: "Quelle différence entre want et omdat ?", opts: ["Aucune", "want = verbe en 2e ; omdat = verbe à la fin", "want = verbe à la fin ; omdat = verbe en 2e", "Ils sont interchangeables partout"], a: 1, exp: "Meme sens, mais want garde l'ordre normal, omdat rejette le verbe." },
    { type: "input", q: "Complète : Ik blijf thuis, want ik ___ ziek. (verbe en 2e, want)", a: ["ben"], ph: "verbe", exp: "want -> ordre normal : ik ben ziek." },
    { type: "vf", q: "On peut dire « omdat ik ben ziek ».", a: false, exp: "Faux : le verbe doit aller a la fin -> omdat ik ziek ben." },
    { type: "qcm", q: "Si la subordonnée est en tête (Als het mooi is, ...), que se passe-t-il dans la principale ?", opts: ["Rien de spécial", "Le verbe passe avant le sujet (inversion)", "Le verbe disparaît", "Le sujet double"], a: 1, exp: "Subordonnee = 1re position -> principale fait l'inversion : ga ik." },
    { type: "input", q: "« S'il fait beau, je vais me promener » : Als het mooi is, ___ ik wandelen.", a: ["ga"], ph: "verbe (inversion)", exp: "Principale apres subordonnee -> inversion : ga ik." },
    { type: "qcm", q: "Que signifie <code>omdat</code> ?", opts: ["si", "que", "parce que", "quand seulement"], a: 2, exp: "omdat = parce que." },
    { type: "input", q: "« Je pense que c'est bon » : Ik denk dat het goed ___ .", a: ["is"], ph: "verbe à la fin", exp: "dat -> is a la fin : dat het goed is." },
    { type: "vf", q: "Dans « Ik ga wandelen als het mooi is », le verbe « is » est bien à la fin de la subordonnée.", a: true, exp: "als het mooi is : is en position finale, correct." }
  ],
  final: {
    title: "Exercice final — Les projets de Sara",
    intro: `<p>Sara explique ses choix.</p>
<pre class="pseudo">Ik blijf vandaag thuis omdat ik moe ben. Ik denk dat het morgen mooi weer is. Als de zon schijnt, ga ik naar het park. Ik neem een boek mee, want ik lees graag buiten.</pre>
<p>(moe = fatigué, weer = temps qu'il fait, schijnen = briller, buiten = dehors)</p>`,
    questions: [
      { type: "input", q: "Complète : ... omdat ik moe ___ .", a: ["ben"], ph: "verbe à la fin", exp: "omdat -> ben a la fin." },
      { type: "qcm", q: "Dans « Ik denk dat het morgen mooi weer is », où est le verbe « is » ?", opts: ["En 2e position", "À la fin de la subordonnée", "Au début", "Avant het"], a: 1, exp: "dat -> verbe is a la fin." },
      { type: "vf", q: "Dans « Als de zon schijnt, ga ik naar het park », la principale fait l'inversion (ga ik).", a: true, exp: "Subordonnee en tete -> inversion dans la principale." },
      { type: "qcm", q: "Pourquoi « want ik lees graag buiten » garde-t-il l'ordre normal ?", opts: ["Erreur", "Parce que want ne rejette pas le verbe (contrairement à omdat)", "Par hasard", "Parce que buiten"], a: 1, exp: "want = ordre normal, verbe en 2e position." },
      { type: "input", q: "Complète : Als de zon ___, ga ik naar het park. (verbe à la fin de la subordonnée)", a: ["schijnt"], ph: "verbe à la fin", exp: "als -> schijnt a la fin de la subordonnee." }
    ],
    solution: `<p>Repère les conjonctions et le verbe rejeté à la fin : <code>omdat ik moe ben</code>, <code>dat het morgen mooi weer is</code>, <code>als de zon schijnt</code>. Avec <code>want</code>, l'ordre reste normal.</p>
<pre class="pseudo">omdat / dat / als  -> VERBE conjugue a la FIN
want               -> ordre normal (verbe en 2e)
subordonnee en tete -> inversion dans la principale (ga ik)</pre>
<p>Le réflexe à garder : conjonction de subordination = verbe à la fin. C'est la règle la plus importante de la grammaire néerlandaise.</p>`
  }
};
