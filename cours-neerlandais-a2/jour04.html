<script>
var DAY = {
  num: 4,
  title: "Le prétérit (imperfectum) régulier",
  subtitle: "Le passé simple néerlandais : radical + -te(n) ou -de(n).",
  theory: `
<h3>1. Un deuxième temps du passé</h3>
<p>Le <strong>prétérit</strong> (ou <em>imperfectum</em>, « onvoltooid verleden tijd ») est l'autre grand temps du passé. Il correspond à l'imparfait et au passé simple français : « je travaillais », « il jouait ». On l'emploie surtout à l'<strong>écrit</strong> et dans les <strong>récits</strong> (contes, histoires), tandis que le perfectum domine à l'oral.</p>
<p>Bonne nouvelle : contrairement au perfectum, le prétérit est un temps <strong>simple</strong> (un seul mot conjugué), donc pas de participe à rejeter à la fin.</p>
<h3>2. Former le prétérit régulier</h3>
<p>On part du <strong>radical</strong> (infinitif sans -en) et on ajoute :</p>
<pre class="pseudo">singulier : radical + -te  ou  -de
pluriel   : radical + -ten ou  -den</pre>
<p>Le choix entre <code>-te(n)</code> et <code>-de(n)</code> obéit à la <strong>même règle de 't kofschip</strong> que le participe (jour 1) : radical finissant par <code>t-k-f-s-ch-p</code> → <code>-te(n)</code> ; sinon → <code>-de(n)</code>.</p>
<pre class="pseudo">werken -> werk (k) -> werkte / werkten     // travaillait / travaillaient
spelen -> speel (l) -> speelde / speelden  // jouait / jouaient
maken  -> maak (k) -> maakte / maakten     // faisait
horen  -> hoor (r) -> hoorde / hoorden     // entendait</pre>
<div class="tip">Astuce : si tu connais le participe (gewerkt → -t), tu connais le prétérit (werkte → -te). Même consonne sourde ou sonore, même choix.</div>
<h3>3. La conjugaison complète</h3>
<p>Au prétérit, le singulier a <strong>une seule forme</strong> (ik = jij = hij), et le pluriel en a une autre. C'est plus simple que le présent !</p>
<pre class="pseudo">werken (travailler)          spelen (jouer)
ik werkte                    ik speelde
jij werkte                   jij speelde
hij/zij werkte               hij/zij speelde
wij werkten                  wij speelden
jullie werkten               jullie speelden
zij werkten                  zij speelden</pre>
<h3>4. Le verbe conjugué reste en place 2</h3>
<p>Comme au présent, le verbe conjugué du prétérit occupe la <strong>deuxième position</strong>. Rien n'est rejeté à la fin (il n'y a pas de participe).</p>
<pre class="pseudo">Vroeger  woonde  ik in Gent.        // Avant, j'habitais a Gand.
Elke dag  speelden  de kinderen buiten.   // Chaque jour les enfants jouaient dehors.</pre>
<h3>5. Petit piège : la lettre finale du radical</h3>
<p>Attention aux verbes dont l'infinitif se termine par <code>-ven</code> ou <code>-zen</code> : à l'infinitif, la lettre est v/z, mais le radical prend f/s (sourdes) → donc <code>-de(n)</code> quand même, car on regarde le son d'origine.</p>
<pre class="pseudo">leven  -> radical leef, mais son d'origine v -> leefde   (vivait)
reizen -> radical reis, mais son d'origine z -> reisde   (voyageait)</pre>
<div class="warn">Règle fine : pour leven et reizen, on entend f/s mais l'infinitif a v/z (sons sonores), donc terminaison <strong>-de</strong> : leefde, reisde. Retiens-les comme des cas à part.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi correspond le prétérit néerlandais en français ?", opts: ["Au futur", "À l'imparfait / passé simple", "Au conditionnel", "Au présent"], a: 1, exp: "L'imperfectum correspond a l'imparfait et au passe simple : il travaillait, il joua." },
    { type: "input", q: "Prétérit singulier de <code>werken</code> : Vroeger ___ ik in een fabriek. (je travaillais)", a: ["werkte"], ph: "radical + te/de", exp: "werk (k) -> werkte." },
    { type: "input", q: "Prétérit singulier de <code>spelen</code> : Het kind ___ in de tuin. (jouait)", a: ["speelde"], ph: "radical + te/de", exp: "speel (l) -> speelde." },
    { type: "input", q: "Prétérit PLURIEL de <code>maken</code> : Wij ___ samen huiswerk. (faisions)", a: ["maakten"], ph: "radical + ten/den", exp: "maak (k) -> maakten (pluriel)." },
    { type: "qcm", q: "Pourquoi <code>horen</code> donne <code>hoorde</code> et non « hoorte » ?", opts: ["Par hasard", "Le radical hoor finit par r, une consonne sonore hors de 't kofschip -> -de", "hoorte est trop long", "Les verbes en -oren sont irréguliers"], a: 1, exp: "r n'est pas dans 't kofschip -> terminaison -de." },
    { type: "input", q: "Prétérit singulier de <code>wonen</code> : Ik ___ vroeger in Brussel. (habitais)", a: ["woonde"], ph: "radical + te/de", exp: "woon (n) -> woonde." },
    { type: "qcm", q: "Combien de formes différentes a le prétérit régulier au singulier (ik/jij/hij) ?", opts: ["Trois formes", "Une seule forme", "Deux formes", "Aucune"], a: 1, exp: "ik/jij/hij ont la MEME forme : werkte. Plus simple que le present." },
    { type: "input", q: "Prétérit PLURIEL de <code>spelen</code> : De kinderen ___ buiten. (jouaient)", a: ["speelden"], ph: "radical + ten/den", exp: "speel -> speelden (pluriel)." },
    { type: "vf", q: "Le prétérit est un temps simple : un seul verbe, pas de participe à la fin.", a: true, exp: "Contrairement au perfectum (auxiliaire + participe), le preterit est un seul mot." },
    { type: "qcm", q: "Prétérit correct de <code>koken</code> (cuisiner) au singulier ?", opts: ["kookde", "kookte", "koken", "gekookt"], a: 1, exp: "kook (k, van 't kofschip) -> kookte." },
    { type: "input", q: "Prétérit singulier de <code>luisteren</code> : Zij ___ naar de radio. (écoutait)", a: ["luisterde"], ph: "radical + te/de", exp: "luister (r) -> luisterde." },
    { type: "qcm", q: "Quelle phrase est correcte au prétérit ?", opts: ["Vroeger ik woonde in Gent.", "Vroeger woonde ik in Gent.", "Ik vroeger woonde in Gent.", "Woonde vroeger ik in Gent."], a: 1, exp: "Le verbe conjugue reste en place 2 : Vroeger woonde ik..." },
    { type: "vf", q: "Le prétérit de <code>leven</code> (vivre) est « leefte ».", a: false, exp: "C'est leefde : l'infinitif a v (son sonore) -> terminaison -de." },
    { type: "input", q: "Prétérit PLURIEL de <code>werken</code> : Zij ___ hard. (travaillaient)", a: ["werkten"], ph: "radical + ten/den", exp: "werk (k) -> werkten (pluriel)." },
    { type: "qcm", q: "Le choix -te/-de au prétérit suit quelle règle ?", opts: ["Le nombre de lettres", "La règle de 't kofschip (t-k-f-s-ch-p -> -te)", "L'ordre alphabétique", "Le genre du sujet"], a: 1, exp: "Meme regle qu'au participe : 't kofschip -> -te ; sinon -de." }
  ],
  final: {
    title: "Exercice final — Le village d'autrefois",
    intro: `<p>Un texte de récit, tout au prétérit.</p>
<pre class="pseudo">Vroeger woonde mijn oma in een klein dorp. Elke dag werkte zij in de tuin. De kinderen speelden op straat en luisterden naar de oude verhalen. 's Avonds kookte oma soep voor iedereen. Het leven was rustig en mooi.</pre>
<p>(oma = grand-mère, dorp = village, op straat = dans la rue, verhalen = histoires, rustig = calme)</p>`,
    questions: [
      { type: "input", q: "Complète : Elke dag ___ zij in de tuin (werken, singulier).", a: ["werkte"], ph: "radical + te/de", exp: "werk -> werkte (singulier)." },
      { type: "input", q: "Complète : De kinderen ___ op straat (spelen, pluriel).", a: ["speelden"], ph: "radical + ten/den", exp: "speel -> speelden (pluriel)." },
      { type: "qcm", q: "Pourquoi « luisterden » prend -den et non -ten ?", opts: ["Erreur", "Radical luister finit par r (sonore), hors 't kofschip -> -den", "Parce que pluriel", "Par hasard"], a: 1, exp: "r n'est pas dans 't kofschip -> -de(n)." },
      { type: "input", q: "Complète : 's Avonds ___ oma soep (koken, singulier).", a: ["kookte"], ph: "radical + te/de", exp: "kook (k) -> kookte." },
      { type: "vf", q: "Le prétérit convient bien à ce récit du passé.", a: true, exp: "L'imperfectum est le temps du recit ecrit ; il pose le decor du passe." }
    ],
    solution: `<p>Prétérits réguliers du texte : <code>woonde</code> (wonen, -de), <code>werkte</code> (werken, -te), <code>speelden</code> (spelen, -den), <code>luisterden</code> (luisteren, -den), <code>kookte</code> (koken, -te).</p>
<pre class="pseudo">singulier : radical + -te / -de
pluriel   : radical + -ten / -den
choix -t/-d : regle de 't kofschip (comme le participe)</pre>
<p>Le prétérit régulier est très logique : <strong>si tu sais faire le participe, tu sais faire le prétérit</strong>, car le choix -te/-de suit exactement la même règle sonore.</p>`
  }
};
</script>
