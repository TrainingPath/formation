var DAY = {
  num: 13,
  title: "Les pronoms compléments",
  subtitle: "Me, je, hem, haar, ons : remplacer une personne complément.",
  theory: `
<h3>1. À quoi servent-ils ?</h3>
<p>Les <strong>pronoms compléments</strong> remplacent une personne qui subit l'action (complément d'objet). Au lieu de répéter le nom, on dit « je LE vois », « il NOUS aide ».</p>
<h3>2. Le tableau des pronoms compléments</h3>
<pre class="pseudo">sujet   complement    sens
ik   -> mij / me      moi, me
jij  -> jou / je      toi, te
hij  -> hem           lui, le
zij  -> haar          elle, la
het  -> het           le/la (chose)
wij  -> ons           nous
jullie -> jullie      vous
zij  -> hen / ze      eux, les</pre>
<pre class="pseudo">Ik zie hem.        // Je le vois.
Hij helpt ons.     // Il nous aide.
Zij belt mij.      // Elle m'appelle.
Ik ken haar.       // Je la connais.</pre>
<h3>3. Formes pleines et formes réduites</h3>
<p>Certains pronoms ont une forme <strong>pleine</strong> (accentuée) et une forme <strong>réduite</strong> (non accentuée, courante à l'oral) :</p>
<pre class="pseudo">mij = me     jou = je     hen/hun = ze
Ik zie je.        // Je te vois.  (je = forme reduite de jou)
Ik zie jou, niet hem.  // forme pleine pour insister</pre>
<div class="tip">Utilise la forme pleine (mij, jou) quand tu veux <strong>insister</strong> ; la forme réduite (me, je) est plus naturelle dans la conversation ordinaire.</div>
<h3>4. La place du pronom complément</h3>
<p>Le pronom complément se place généralement <strong>juste après le verbe conjugué</strong> (et le sujet). Il vient avant les autres compléments.</p>
<pre class="pseudo">Ik geef hem morgen het boek.   // Je lui donne le livre demain.
Zij helpt ons altijd.          // Elle nous aide toujours.</pre>
<div class="warn">Ne confonds pas le pronom sujet et le pronom complément : <code>hij</code> (il, sujet) devient <code>hem</code> (le/lui, complément) ; <code>zij</code> (elle) devient <code>haar</code> (la/elle).</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le pronom complément de <code>hij</code> (il) ?", opts: ["hij", "hem", "hij zelf", "zijn"], a: 1, exp: "hij (sujet) -> hem (complement)." },
    { type: "input", q: "« Je le vois » : Ik zie ___ .", a: ["hem"], ph: "pronom complément", exp: "le (masculin personne) = hem." },
    { type: "qcm", q: "Complément de <code>zij</code> (elle) ?", opts: ["zij", "ze", "haar", "hun"], a: 2, exp: "zij (elle, sujet) -> haar (la/elle, complement)." },
    { type: "input", q: "« Il nous aide » : Hij helpt ___ .", a: ["ons"], ph: "pronom complément", exp: "nous = ons." },
    { type: "vf", q: "<code>mij</code> et <code>me</code> désignent tous deux « moi/me ».", a: true, exp: "mij = forme pleine, me = forme reduite." },
    { type: "qcm", q: "« Elle m'appelle » se dit :", opts: ["Zij belt ik.", "Zij belt mij.", "Zij belt hem.", "Zij belt ons."], a: 1, exp: "me/moi = mij : Zij belt mij." },
    { type: "input", q: "« Je la connais » : Ik ken ___ .", a: ["haar"], ph: "pronom complément", exp: "la (elle) = haar." },
    { type: "qcm", q: "Quand utilise-t-on la forme pleine (mij, jou) plutôt que réduite (me, je) ?", opts: ["Jamais", "Pour insister", "Seulement à l'écrit administratif", "Au pluriel uniquement"], a: 1, exp: "Forme pleine pour l'insistance ; forme reduite en conversation." },
    { type: "input", q: "« Je te vois » (forme réduite) : Ik zie ___ .", a: ["je"], ph: "forme réduite de jou", exp: "jou -> je (forme reduite)." },
    { type: "vf", q: "Le pronom complément se place généralement juste après le verbe conjugué.", a: true, exp: "Oui : Ik zie hem, Hij helpt ons." },
    { type: "qcm", q: "Complément de <code>wij</code> (nous) ?", opts: ["wij", "ons", "onze", "wijzelf"], a: 1, exp: "wij (sujet) -> ons (complement)." },
    { type: "input", q: "« Je vous aide » (jullie) : Ik help ___ .", a: ["jullie"], ph: "pronom complément", exp: "vous (pluriel) = jullie (identique au sujet)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ik zie hij.", "Ik zie hem.", "Ik zie zij.", "Ik zie ik."], a: 1, exp: "Complement de hij = hem : Ik zie hem." },
    { type: "input", q: "« Je lui donne le livre demain » : Ik geef ___ morgen het boek. (lui = hem)", a: ["hem"], ph: "pronom complément", exp: "lui = hem, juste apres le verbe." },
    { type: "vf", q: "Le pronom sujet <code>hij</code> reste identique quand il devient complément.", a: false, exp: "Faux : hij (sujet) devient hem (complement)." }
  ],
  final: {
    title: "Exercice final — Un bon ami",
    intro: `<p>Nina parle de son ami Tom.</p>
<pre class="pseudo">Tom is mijn beste vriend. Ik ken hem al tien jaar. Hij helpt mij altijd. Als ik hem bel, komt hij meteen. Ik zie hem elke week, en hij vindt ons erg aardig.</pre>
<p>(vriend = ami, kennen = connaître, meteen = tout de suite, aardig = gentil)</p>`,
    questions: [
      { type: "input", q: "Complète : Ik ken ___ al tien jaar. (lui = Tom)", a: ["hem"], ph: "pronom complément", exp: "le/lui = hem." },
      { type: "qcm", q: "Dans « Hij helpt mij altijd », que signifie « mij » ?", opts: ["il", "moi/me", "nous", "lui"], a: 1, exp: "mij = moi/me (complement)." },
      { type: "input", q: "Complète : Als ik ___ bel, komt hij meteen. (lui = Tom)", a: ["hem"], ph: "pronom complément", exp: "le/lui = hem." },
      { type: "vf", q: "Dans « hij vindt ons erg aardig », « ons » signifie « nous ».", a: true, exp: "ons = nous (complement)." },
      { type: "qcm", q: "Pourquoi dit-on « hem » et non « hij » dans « Ik zie hem » ?", opts: ["Erreur", "hem est le pronom complément (il subit l'action)", "Par hasard", "Parce que Tom"], a: 1, exp: "Complement -> hem, pas le sujet hij." }
    ],
    solution: `<p>Pronoms compléments du texte : <code>hem</code> (le/lui), <code>mij</code> (moi/me), <code>ons</code> (nous). Ils remplacent la personne qui subit l'action.</p>
<pre class="pseudo">sujet -> complement
ik -> mij/me   jij -> jou/je   hij -> hem
zij -> haar    wij -> ons      jullie -> jullie   zij(pl) -> hen/ze
place : juste apres le verbe conjugue</pre>
<p>Distingue toujours le sujet (hij, zij) du complément (hem, haar), et choisis la forme pleine pour insister.</p>`
  }
};
</script>
