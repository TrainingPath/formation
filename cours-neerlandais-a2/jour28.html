<script>
var DAY = {
  num: 28,
  title: "Écrire un message et une carte postale",
  subtitle: "Rédiger un court message (SMS, e-mail) et une carte postale.",
  theory: `
<h3>1. Un message court (SMS, chat)</h3>
<p>Un message est bref et direct. On saute souvent le sujet « ik ».</p>
<pre class="pseudo">Hoi Sara! Ben je vanavond vrij?        Salut Sara ! Es-tu libre ce soir ?
Zullen we samen eten? Laat maar weten! On mange ensemble ? Dis-moi !
Tot straks!                            À tout à l'heure !</pre>
<h3>2. La structure d'une carte postale</h3>
<pre class="pseudo">Lieve oma,          formule d'appel affectueuse
... corps ...       où tu es, ce que tu fais, le temps
Groetjes uit ...    salutations depuis ...
Kus, Emma           signature</pre>
<h3>3. Un modèle de carte postale</h3>
<pre class="pseudo">Lieve oma,

Groetjes uit Spanje! Het weer is hier fantastisch.
We liggen elke dag op het strand en we zwemmen veel.
Het eten is heerlijk en de mensen zijn heel vriendelijk.
Morgen bezoeken we een oud kasteel.
Ik mis je! Tot volgende week.

Kus, Emma</pre>
<h3>4. Formules utiles</h3>
<pre class="pseudo">Groetjes uit ...   salutations de ...   Ik mis je.    Tu me manques.
Tot snel!          à bientôt            Veel liefs    bises (affectueux)
Het weer is ...    le temps est ...     Hoe gaat het? Comment vas-tu ?</pre>
<div class="tip">Sur une carte postale, écris au présent ce que tu fais pendant tes vacances : « We zwemmen », « We bezoeken ». Reste simple et positif.</div>
<div class="warn">« Lieve » (cher / chère, affectueux) s'emploie pour la famille et les amis proches. Pour une lettre formelle, on écrit plutôt « Beste ».</div>`,
  exercises: [
    { type: "qcm", q: "Pour commencer une carte à sa grand-mère, on écrit…", opts: ["Beste mevrouw", "Lieve oma", "Geachte heer", "Hallo team"], a: 1, exp: "Lieve oma = formule affectueuse." },
    { type: "input", q: "Complète : « Groetjes ___ Spanje! » (depuis)", a: ["uit"], ph: "un mot", exp: "Groetjes uit Spanje = salutations d'Espagne." },
    { type: "qcm", q: "« Ik mis je » signifie…", opts: ["Je t'aime", "Tu me manques", "Je pars", "À bientôt"], a: 1, exp: "Ik mis je = tu me manques." },
    { type: "vf", q: "Un message (SMS) est bref et direct.", a: true, exp: "On y saute souvent le « ik »." },
    { type: "input", q: "Traduis « à bientôt » : « tot ___ ! »", a: ["snel"], ph: "un mot", exp: "Tot snel! = à bientôt !" },
    { type: "input", q: "Sur une carte de vacances, on décrit ses activités au ___ (temps du moment présent).", a: ["présent", "present"], ph: "un mot", exp: "On écrit au présent : We zwemmen, We bezoeken." },
    { type: "input", q: "Complète : « Het ___ is hier fantastisch. » (le temps qu'il fait)", a: ["weer"], ph: "un mot", exp: "het weer = le temps qu'il fait." },
    { type: "vf", q: "« Lieve » est plus affectueux que « Beste ».", a: true, exp: "Lieve = affectueux ; Beste = plus neutre / formel." },
    { type: "qcm", q: "« Tot straks! » veut dire…", opts: ["À l'année prochaine", "À tout à l'heure", "Bonne nuit", "Merci"], a: 1, exp: "Tot straks = à tout à l'heure." },
    { type: "input", q: "Traduis « bises » (affectueux, 2 mots) : « veel ___ »", a: ["liefs"], ph: "un mot", exp: "Veel liefs = bises affectueuses." },
    { type: "qcm", q: "Pour une lettre formelle, on commence par…", opts: ["Lieve", "Kus", "Beste", "Groetjes"], a: 2, exp: "Beste = cher / chère (formel)." },
    { type: "vf", q: "« Groetjes » convient pour une carte à un ami.", a: true, exp: "Groetjes = amical." },
    { type: "input", q: "Compréhension : dans la carte d'Emma, où est-elle ? « in ___ » (Espagne, en néerlandais)", a: ["spanje"], ph: "un mot", exp: "Groetjes uit Spanje = elle est en Espagne." },
    { type: "qcm", q: "Compréhension : que font-ils chaque jour selon la carte ?", opts: ["ils travaillent", "ils vont à la plage", "ils font du ski", "ils visitent des musées"], a: 1, exp: "We liggen elke dag op het strand = à la plage chaque jour." },
    { type: "qcm", q: "Compréhension : que vont-ils visiter demain ?", opts: ["un musée", "un château", "une église", "un marché"], a: 1, exp: "Morgen bezoeken we een oud kasteel = un vieux château." }
  ],
  final: {
    title: "Exercice final — Een berichtje van Nina",
    intro: `<p>Lis ce court message, puis réponds :</p>
<pre class="pseudo">Hoi Lucas,

Ben je zaterdag vrij? Ik geef een klein feestje bij mij thuis.
Het begint om zeven uur en er komen ook Sara en Tom.
We gaan pizza eten en films kijken.
Kun je iets lekkers meenemen?
Laat me morgen weten of je komt. Tot snel!

Groetjes, Nina</pre>`,
    questions: [
      { type: "qcm", q: "Quel jour Nina organise-t-elle sa fête ?", opts: ["vendredi", "samedi", "dimanche", "lundi"], a: 1, exp: "Ben je zaterdag vrij? = samedi." },
      { type: "input", q: "À quelle heure commence la fête ? « om ___ uur » (sept, en néerlandais)", a: ["zeven"], ph: "un mot", exp: "om zeven uur = à sept heures." },
      { type: "qcm", q: "Que vont-ils faire ?", opts: ["danser", "manger une pizza et regarder des films", "jouer au foot", "étudier"], a: 1, exp: "pizza eten en films kijken." },
      { type: "vf", q: "Nina demande à Lucas d'apporter quelque chose de bon.", a: true, exp: "Kun je iets lekkers meenemen?" },
      { type: "input", q: "Quand Lucas doit-il répondre ? ___ (demain, en néerlandais)", a: ["morgen"], ph: "un mot", exp: "Laat me morgen weten = fais-moi savoir demain." }
    ],
    solution: `<p>Traduction : « Salut Lucas, es-tu libre samedi ? J'organise une petite fête chez moi. Ça commence à sept heures et Sara et Tom viennent aussi. On va manger une pizza et regarder des films. Peux-tu apporter quelque chose de bon ? Fais-moi savoir demain si tu viens. À bientôt ! Salutations, Nina. »</p>
<p>Un message garde une structure simple : appel (Hoi Lucas), invitation, détails (heure, activité), demande et formule de fin (Tot snel! Groetjes).</p>`
  }
};
</script>
