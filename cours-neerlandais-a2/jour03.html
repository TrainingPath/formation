<script>
var DAY = {
  num: 3,
  title: "Auxiliaire : hebben ou zijn ?",
  subtitle: "Choisir le bon auxiliaire au perfectum, comme « avoir » ou « être » en français.",
  theory: `
<h3>1. Deux auxiliaires possibles</h3>
<p>Au perfectum, le participe passé est précédé d'un auxiliaire. La plupart du temps c'est <code>hebben</code> (avoir), mais certains verbes exigent <code>zijn</code> (être) — exactement comme le français « je suis allé », « il est parti ».</p>
<pre class="pseudo">Ik heb gewerkt.        // J'ai travaille.   (hebben)
Ik ben gegaan.         // Je suis alle(e).  (zijn)</pre>
<h3>2. Rappel : conjuguer hebben et zijn au présent</h3>
<p>L'auxiliaire se conjugue au présent ; c'est le participe qui porte le sens du passé.</p>
<pre class="pseudo">hebben (avoir)        zijn (etre)
ik heb                ik ben
jij hebt              jij bent
hij/zij heeft         hij/zij is
wij hebben            wij zijn
jullie hebben         jullie zijn
zij hebben            zij zijn</pre>
<h3>3. Quand utilise-t-on zijn ?</h3>
<p>On emploie <code>zijn</code> pour deux grandes catégories :</p>
<p><strong>a) Les verbes de mouvement AVEC changement de lieu</strong> (aller d'un point A à un point B) : <code>gaan</code> (aller), <code>komen</code> (venir), <code>lopen</code> (marcher, vers un but), <code>fietsen</code> (aller à vélo), <code>reizen</code> (voyager), <code>vertrekken</code> (partir).</p>
<pre class="pseudo">Ik ben naar Brussel gegaan.        // Je suis alle a Bruxelles.
Zij is naar huis gekomen.          // Elle est venue a la maison.</pre>
<p><strong>b) Les verbes de changement d'état</strong> (on devient autre) : <code>worden</code> (devenir), <code>beginnen</code> (commencer), <code>stoppen</code> (s'arrêter), <code>sterven</code> (mourir), <code>blijven</code> (rester), et les verbes <code>zijn</code> (être) et <code>gebeuren</code> (se passer).</p>
<pre class="pseudo">De les is begonnen.       // Le cours a commence.
Hij is ziek geworden.     // Il est tombe malade (devenu malade).
Ik ben thuis gebleven.    // Je suis reste a la maison.</pre>
<div class="tip">Truc mnémo : <strong>zijn</strong> = « je bouge d'un endroit à un autre » ou « je change d'état ». Tout le reste prend <strong>hebben</strong>.</div>
<h3>4. Attention : mouvement sans destination = hebben</h3>
<p>Si le verbe de mouvement décrit une <strong>activité</strong> (sans dire où l'on va), on repasse à <code>hebben</code>. Comparez :</p>
<pre class="pseudo">Ik heb gelopen.                  // J'ai couru (activite, sport).      -> hebben
Ik ben naar school gelopen.      // Je suis alle a l'ecole a pied.     -> zijn (destination)</pre>
<div class="warn">La destination fait toute la différence. « fietsen » seul (faire du vélo) prend hebben ; « naar het werk fietsen » (aller au travail à vélo) prend zijn.</div>
<h3>5. La place ne change pas</h3>
<p>Quel que soit l'auxiliaire, il occupe la <strong>deuxième position</strong> et le participe est <strong>rejeté à la fin</strong>. Seul le mot hebben/zijn change.</p>
<pre class="pseudo">Wij  zijn  gisteren naar zee  gefietst.     // Nous sommes alles a la mer a velo hier.
Hij  heeft de hele dag  gewerkt.           // Il a travaille toute la journee.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire pour un verbe de mouvement avec destination (ex. naar huis gaan) ?", opts: ["hebben", "zijn", "worden", "les deux au choix"], a: 1, exp: "Mouvement d'un lieu a un autre -> zijn." },
    { type: "input", q: "Complète avec l'auxiliaire : Ik ___ naar Brussel gegaan.", a: ["ben"], ph: "heb / ben", exp: "gaan avec destination -> zijn ; ik -> ben." },
    { type: "input", q: "Complète : Zij ___ de hele dag gewerkt.", a: ["heeft"], ph: "heeft / is", exp: "werken -> hebben ; zij -> heeft." },
    { type: "qcm", q: "Participe et auxiliaire de <code>beginnen</code> (commencer) ?", opts: ["heeft begonnen", "is begonnen", "heeft begint", "is begint"], a: 1, exp: "Changement d'etat -> zijn ; De les is begonnen." },
    { type: "input", q: "Complète : Hij ___ ziek geworden.", a: ["is"], ph: "heeft / is", exp: "worden (changement d'etat) -> zijn ; hij -> is." },
    { type: "qcm", q: "« Ik heb gelopen » et « Ik ben naar school gelopen » : pourquoi deux auxiliaires ?", opts: ["C'est une erreur", "Sans destination = activité (hebben) ; avec destination = déplacement (zijn)", "hebben est plus poli", "lopen a deux sens contraires"], a: 1, exp: "La presence d'une destination fait basculer vers zijn." },
    { type: "input", q: "Complète : Wij ___ naar zee gefietst.", a: ["zijn"], ph: "hebben / zijn", exp: "fietsen avec destination (naar zee) -> zijn ; wij -> zijn." },
    { type: "qcm", q: "Quel verbe prend zijn au perfectum ?", opts: ["werken", "koken", "komen", "lezen"], a: 2, exp: "komen (venir) est un mouvement avec deplacement -> zijn (is gekomen)." },
    { type: "vf", q: "Le verbe <code>blijven</code> (rester) prend zijn au perfectum.", a: true, exp: "Ik ben thuis gebleven : blijven prend zijn." },
    { type: "input", q: "Complète : De trein ___ te laat vertrokken.", a: ["is"], ph: "heeft / is", exp: "vertrekken (partir, deplacement) -> zijn ; de trein -> is." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ik heb naar huis gegaan.", "Ik ben naar huis gegaan.", "Ik ben gewerkt.", "Ik heb ziek geworden."], a: 1, exp: "gaan avec destination -> zijn : Ik ben naar huis gegaan." },
    { type: "input", q: "Complète : Jij ___ een boek gelezen.", a: ["hebt"], ph: "hebt / bent", exp: "lezen -> hebben ; jij -> hebt." },
    { type: "vf", q: "« De les heeft begonnen » est correct.", a: false, exp: "beginnen prend zijn : De les IS begonnen." },
    { type: "qcm", q: "Auxiliaire de <code>gebeuren</code> (se passer, arriver) ?", opts: ["hebben", "zijn", "worden", "gaan"], a: 1, exp: "gebeuren prend zijn : Wat is er gebeurd ? (Que s'est-il passe ?)" },
    { type: "input", q: "Complète : Zij ___ 's morgens naar het werk gefietst.", a: ["is"], ph: "heeft / is", exp: "fietsen avec destination -> zijn ; zij -> is." }
  ],
  final: {
    title: "Exercice final — Le voyage de Tom",
    intro: `<p>Lis le texte et repère les auxiliaires.</p>
<pre class="pseudo">Gisteren is Tom vroeg vertrokken. Hij is met de trein naar Amsterdam gegaan. Onderweg heeft hij een boek gelezen en koffie gedronken. In de stad is hij veel gelopen. 's Avonds is hij moe geworden en naar huis gekomen.</pre>
<p>(vroeg = tôt, met de trein = en train, onderweg = en chemin, moe = fatigué)</p>`,
    questions: [
      { type: "input", q: "Complète : Gisteren ___ Tom vroeg vertrokken.", a: ["is"], ph: "heeft / is", exp: "vertrekken (partir) -> zijn ; Tom -> is." },
      { type: "qcm", q: "Pourquoi « heeft hij een boek gelezen » utilise hebben ?", opts: ["Erreur", "lezen n'est ni mouvement ni changement d'état : hebben", "Parce que hij", "Parce que onderweg"], a: 1, exp: "lezen est une activite ordinaire -> hebben." },
      { type: "input", q: "Complète : In de stad ___ hij veel gelopen.", a: ["is", "heeft"], ph: "heeft / is", exp: "Ici lopen dans la ville : les deux se rencontrent, mais avec l'idee de deplacement dans le texte on lit 'is'. hebben est aussi accepte pour l'activite." },
      { type: "qcm", q: "« is hij moe geworden » : quel type de verbe ?", opts: ["Mouvement", "Changement d'état (worden)", "Activité", "État permanent"], a: 1, exp: "worden = devenir, changement d'etat -> zijn." },
      { type: "vf", q: "Dans « naar huis gekomen », komen prend zijn parce qu'il y a déplacement.", a: true, exp: "komen (venir) avec destination naar huis -> zijn." }
    ],
    solution: `<p>Auxiliaires du texte : <code>is vertrokken</code>, <code>is gegaan</code>, <code>heeft gelezen</code>, <code>heeft gedronken</code>, <code>is gelopen</code>, <code>is geworden</code>, <code>is gekomen</code>.</p>
<pre class="pseudo">zijn : mouvement AVEC destination (gaan, komen, vertrekken)
       + changement d'etat (worden)
hebben : toutes les autres activites (lezen, drinken)</pre>
<p>Le seul cas délicat est le mouvement <strong>sans</strong> destination (« gelopen ») : il peut alors prendre hebben. Retiens la question clé : <strong>« est-ce que je vais quelque part ou est-ce que je change d'état ? »</strong> Si oui → zijn.</p>`
  }
};
</script>
