<script>
var DAY = {
  num: 22,
  title: "Raconter une histoire au passé",
  subtitle: "Utiliser le parfait et le prétérit pour raconter une suite d'événements.",
  theory: `
<h3>1. Deux temps pour le passé</h3>
<p>En néerlandais, on raconte le passé avec deux temps. Le <strong>parfait</strong> (voltooid tegenwoordige tijd) sert surtout à l'oral et pour un fait isolé. Le <strong>prétérit</strong> (onvoltooid verleden tijd) sert à raconter une suite d'événements, comme dans une histoire.</p>
<pre class="pseudo">Ik heb gisteren gewerkt.     J'ai travaillé hier.        (parfait)
Ik werkte elke dag.          Je travaillais chaque jour. (prétérit)</pre>
<h3>2. Le prétérit des verbes faibles</h3>
<p>On part du radical. Si la dernière lettre du radical est dans « 't kofschip » (t, k, f, s, ch, p), on ajoute <strong>-te(n)</strong> ; sinon <strong>-de(n)</strong>.</p>
<pre class="pseudo">werken  -> werkte / werkten    (k -> te)
maken   -> maakte / maakten    (k -> te)
horen   -> hoorde / hoorden    (r -> de)
wonen   -> woonde / woonden    (n -> de)</pre>
<h3>3. Les verbes forts</h3>
<p>Beaucoup de verbes courants changent de voyelle. Il faut les apprendre par cœur.</p>
<pre class="pseudo">zijn   -> was / waren     être
hebben -> had / hadden    avoir
gaan   -> ging / gingen   aller
zien   -> zag / zagen     voir
komen  -> kwam / kwamen   venir
zeggen -> zei / zeiden    dire</pre>
<h3>4. Raconter dans l'ordre : les connecteurs de temps</h3>
<pre class="pseudo">eerst       d'abord      toen         alors / quand
daarna      ensuite      later        plus tard
plotseling  soudain      uiteindelijk finalement</pre>
<p><strong>Eerst stond ik op, daarna ontbeet ik en toen ging ik naar het werk.</strong> = D'abord je me suis levé, ensuite j'ai déjeuné et alors je suis allé au travail.</p>
<div class="tip">« toen » (= quand, dans le passé) entraîne le rejet du verbe : <strong>Toen ik jong was, woonde ik in Gent.</strong> (Quand j'étais jeune, j'habitais à Gand.)</div>
<div class="warn">Ne confonds pas « toen » (passé, une seule fois) et « als / wanneer » (présent ou répétition). Pour un souvenir précis on dit « Toen ik klein was… », jamais « Als ik klein was… ».</div>`,
  exercises: [
    { type: "qcm", q: "Le prétérit de « werken » (singulier) est…", opts: ["werkt", "werkte", "werken", "gewerkt"], a: 1, exp: "werken -> werkte (radical + -te car k appartient à 't kofschip)." },
    { type: "input", q: "Complète : « Vroeger ___ ik in Gent. » (wonen au prétérit)", a: ["woonde"], ph: "un verbe", exp: "wonen -> woonde (n -> -de)." },
    { type: "qcm", q: "Le prétérit de « zijn » (singulier) est…", opts: ["had", "was", "werd", "ging"], a: 1, exp: "zijn -> was / waren." },
    { type: "vf", q: "« Toen ik jong was » signifie « Quand j'étais jeune ».", a: true, exp: "toen = quand, dans le passé." },
    { type: "input", q: "Traduis « d'abord » : ___", a: ["eerst"], ph: "un mot", exp: "eerst = d'abord." },
    { type: "qcm", q: "« Ik heb gewerkt » est au…", opts: ["présent", "parfait", "prétérit", "futur"], a: 1, exp: "hebben + participe = parfait." },
    { type: "input", q: "Complète : « maken » -> ik ___ (prétérit singulier)", a: ["maakte"], ph: "un verbe", exp: "maken -> maakte (k -> -te)." },
    { type: "vf", q: "« gaan » au prétérit donne « ging ».", a: true, exp: "gaan -> ging / gingen (verbe fort)." },
    { type: "qcm", q: "« daarna » veut dire…", opts: ["d'abord", "ensuite", "soudain", "jamais"], a: 1, exp: "daarna = ensuite." },
    { type: "input", q: "Traduis « avoir » au prétérit singulier : ___", a: ["had"], ph: "un verbe", exp: "hebben -> had / hadden." },
    { type: "input", q: "Pour un souvenir précis au passé, on emploie ___ (et non « als »).", a: ["toen"], ph: "un mot", exp: "toen = quand, pour un fait passé unique." },
    { type: "input", q: "« Gisteren ging ik naar de markt. » Quand ? ___ (en néerlandais)", a: ["gisteren"], ph: "un mot", exp: "gisteren = hier." },
    { type: "qcm", q: "Compréhension : « Eerst kocht ze brood, daarna ging ze naar huis. » Que fait-elle en premier ?", opts: ["rentrer", "acheter du pain", "cuisiner", "dormir"], a: 1, exp: "eerst kocht ze brood = elle achète d'abord du pain." },
    { type: "vf", q: "Compréhension : « Toen het regende, bleef ik thuis. » Il pleuvait et la personne est restée à la maison.", a: true, exp: "regende = il pleuvait ; bleef thuis = est resté à la maison." },
    { type: "qcm", q: "Compréhension : « We hadden honger, dus we aten in een restaurant. » Pourquoi mangent-ils au restaurant ?", opts: ["ils avaient soif", "ils avaient faim", "ils étaient fatigués", "il pleuvait"], a: 1, exp: "hadden honger = avaient faim." }
  ],
  final: {
    title: "Exercice final — Een dag uit het verleden",
    intro: `<p>Lis ce petit récit au passé, puis réponds :</p>
<pre class="pseudo">Vorige zomer ging ik met mijn familie naar de zee.
We stonden vroeg op en pakten onze tassen.
De reis duurde drie uur, maar het weer was mooi.
Op het strand zwommen we en aten we ijsjes.
's Avonds waren we moe, maar heel blij.
Het was een perfecte dag.</pre>`,
    questions: [
      { type: "input", q: "Où sont-ils allés ? naar de ___ (en néerlandais)", a: ["zee"], ph: "un mot", exp: "naar de zee = à la mer." },
      { type: "qcm", q: "Combien de temps a duré le voyage ?", opts: ["une heure", "deux heures", "trois heures", "quatre heures"], a: 2, exp: "de reis duurde drie uur = trois heures." },
      { type: "qcm", q: "Quel temps faisait-il ?", opts: ["il pleuvait", "il faisait beau", "il neigeait", "il faisait froid"], a: 1, exp: "het weer was mooi = il faisait beau." },
      { type: "vf", q: "Ils ont nagé à la plage.", a: true, exp: "op het strand zwommen we = nous avons nagé à la plage." },
      { type: "input", q: "Le soir ils étaient ___ (fatigués, en néerlandais)", a: ["moe"], ph: "un mot", exp: "'s avonds waren we moe = le soir nous étions fatigués." }
    ],
    solution: `<p>Traduction : « L'été dernier je suis allé à la mer avec ma famille. Nous nous sommes levés tôt et avons préparé nos sacs. Le voyage a duré trois heures, mais il faisait beau. Sur la plage nous avons nagé et mangé des glaces. Le soir nous étions fatigués, mais très contents. C'était une journée parfaite. »</p>
<p>Pour raconter, combine le prétérit (<strong>ging, stonden op, zwommen, aten</strong>) et des connecteurs de temps (<strong>eerst, daarna, 's avonds</strong>).</p>`
  }
};
</script>
