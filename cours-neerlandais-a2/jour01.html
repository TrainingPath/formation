<script>
var DAY = {
  num: 1,
  title: "Le passé composé (perfectum) : réguliers",
  subtitle: "Raconter ce qui est terminé : hebben + participe passé rejeté à la fin.",
  theory: `
<h3>1. À quoi sert le perfectum ?</h3>
<p>Le <strong>perfectum</strong> (le « passé composé » néerlandais) sert à raconter une action <strong>terminée</strong>. C'est le temps du passé le plus utilisé à l'oral, exactement comme le passé composé français. « J'ai travaillé », « nous avons joué » : voilà du perfectum.</p>
<p>Il se construit avec deux morceaux, comme en français : un <strong>auxiliaire</strong> conjugué (le plus souvent <code>hebben</code> = avoir) et un <strong>participe passé</strong> (en néerlandais : <em>voltooid deelwoord</em>).</p>
<pre class="pseudo">Ik heb gewerkt.            // J'ai travaille.
Wij hebben gespeeld.      // Nous avons joue.</pre>
<h3>2. La règle d'or : le participe part à la fin</h3>
<p>Point capital du néerlandais : l'auxiliaire <code>hebben</code> reste à la <strong>deuxième place</strong> de la phrase, mais le participe passé est <strong>rejeté tout à la fin</strong>. Tout ce qui complète la phrase se glisse ENTRE les deux.</p>
<pre class="pseudo">Ik  heb  gisteren in de tuin  gewerkt.        // J'ai travaille hier dans le jardin.
     ^                          ^
 auxiliaire (place 2)       participe (fin)</pre>
<div class="warn">Ne colle jamais le participe juste après l'auxiliaire quand il y a des compléments. On ne dit pas « Ik heb gewerkt in de tuin gisteren », mais « Ik heb gisteren in de tuin gewerkt ». Le participe ferme la phrase.</div>
<h3>3. Fabriquer un participe régulier : ge- + radical + -t ou -d</h3>
<p>Le <strong>radical</strong> (ou <em>stam</em>) est l'infinitif sans la terminaison <code>-en</code>. Ex. : <code>werken</code> → radical <code>werk</code>. On ajoute le préfixe <code>ge-</code> devant et une terminaison <code>-t</code> ou <code>-d</code> à la fin.</p>
<pre class="pseudo">infinitif   radical    participe
werken      werk       gewerkt      // travaille
spelen      speel      gespeeld     // joue
maken       maak       gemaakt      // fait
horen       hoor       gehoord      // entendu</pre>
<h3>4. -t ou -d ? La règle de 't kofschip</h3>
<p>Comment savoir s'il faut <code>-t</code> ou <code>-d</code> ? On regarde la <strong>dernière lettre du radical</strong>. Si c'est une consonne « sourde » (prononcée sans faire vibrer la gorge), on met <code>-t</code>. Sinon, <code>-d</code>.</p>
<p>Pour retenir les consonnes sourdes, les Néerlandais utilisent le mot magique <strong>'t kofschip</strong> (un vieux bateau) : ses consonnes sont <code>t - k - f - s - ch - p</code>. Si le radical finit par l'une d'elles → <code>-t</code>.</p>
<pre class="pseudo">radical finit par t k f s ch p  ->  -t   (werk -> gewerkt, maak -> gemaakt)
sinon (l, r, n, m, voyelle...)  ->  -d   (speel -> gespeeld, hoor -> gehoord)</pre>
<div class="tip">Astuce de prononciation : dis le radical à voix haute. Si la dernière consonne « souffle » sans voix (comme k, s, p), c'est du 't kofschip → -t. Si elle « sonne » (comme l, r, m, n), c'est -d.</div>
<h3>5. Un petit piège d'orthographe</h3>
<p>Le radical suit les règles d'orthographe néerlandaises : on ne double jamais une consonne en fin de mot et on garde le son de la voyelle. C'est pourquoi <code>maken</code> donne le radical <code>maak</code> (avec deux a) et non « mak ».</p>
<pre class="pseudo">wonen  -> woon  -> gewoond     // habite (oo garde le son long)
praten -> praat -> gepraat     // parle (t final -> -t, pas de double t)</pre>
<p>Note : un radical qui finit déjà par <code>-t</code> ne prend pas un second <code>t</code> : <code>praat</code> + t = <code>gepraat</code> (un seul t).</p>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire utilise-t-on le plus souvent pour former le perfectum ?", opts: ["zijn", "hebben", "worden", "zullen"], a: 1, exp: "Le perfectum se forme surtout avec hebben (avoir) + participe passe." },
    { type: "qcm", q: "Dans « Ik heb gisteren gewerkt », où se place le participe passé ?", opts: ["Juste après le sujet", "À la fin de la phrase", "Avant hebben", "N'importe où"], a: 1, exp: "Le participe est rejete tout a la fin ; l'auxiliaire reste en deuxieme position." },
    { type: "input", q: "Participe passé de <code>werken</code> (travailler) : Ik heb hard ___ .", a: ["gewerkt"], ph: "ge...t / ge...d", exp: "Radical werk finit par k (van 't kofschip) -> gewerkt." },
    { type: "input", q: "Participe passé de <code>spelen</code> (jouer) : De kinderen hebben ___ .", a: ["gespeeld"], ph: "ge...t / ge...d", exp: "Radical speel finit par l (voisee) -> gespeeld." },
    { type: "input", q: "Participe passé de <code>maken</code> (faire) : Zij heeft koffie ___ .", a: ["gemaakt"], ph: "ge...t / ge...d", exp: "Radical maak finit par k -> gemaakt." },
    { type: "qcm", q: "Radical de <code>horen</code> (entendre) ?", opts: ["hor", "hoor", "hore", "gehoor"], a: 1, exp: "On enleve -en et on garde le son long : hoor. Participe : gehoord (r voisee -> -d)." },
    { type: "input", q: "Participe passé de <code>wonen</code> (habiter) : Ik heb in Gent ___ .", a: ["gewoond"], ph: "ge...t / ge...d", exp: "Radical woon finit par n (voisee) -> gewoond." },
    { type: "qcm", q: "Pourquoi <code>werken</code> donne-t-il -t et non -d ?", opts: ["Parce que c'est un verbe court", "Parce que le radical finit par k, une consonne de 't kofschip", "Par hasard", "Parce qu'il commence par w"], a: 1, exp: "k appartient a 't kofschip (t-k-f-s-ch-p) -> terminaison -t." },
    { type: "vf", q: "Dans le perfectum, l'auxiliaire hebben se place en deuxième position de la phrase.", a: true, exp: "Regle du verbe conjugue en place 2 ; le participe, lui, ferme la phrase." },
    { type: "input", q: "Participe passé de <code>luisteren</code> (écouter) : Wij hebben naar muziek ___ .", a: ["geluisterd"], ph: "ge...t / ge...d", exp: "Radical luister finit par r (voisee) -> geluisterd." },
    { type: "qcm", q: "Quelle phrase respecte l'ordre des mots du perfectum ?", opts: ["Ik heb gemaakt het huiswerk.", "Ik heb het huiswerk gemaakt.", "Ik gemaakt heb het huiswerk.", "Het huiswerk ik heb gemaakt."], a: 1, exp: "Auxiliaire en place 2, participe (gemaakt) rejete a la fin." },
    { type: "qcm", q: "Participe correct de <code>poetsen</code> (nettoyer) ?", opts: ["gepoetsd", "gepoetst", "poetst", "gepoetsen"], a: 1, exp: "Radical poets finit par s (van 't kofschip) -> gepoetst." },
    { type: "vf", q: "Le participe de <code>praten</code> (parler) est « gepraatt » avec deux t.", a: false, exp: "Le radical praat finit deja par t : on n'ajoute pas un second t -> gepraat." },
    { type: "input", q: "Participe passé de <code>koken</code> (cuisiner) : Hij heeft soep ___ .", a: ["gekookt"], ph: "ge...t / ge...d", exp: "Radical kook finit par k -> gekookt." },
    { type: "vf", q: "« Ik heb gespeeld voetbal buiten. » est une phrase correcte.", a: false, exp: "Le participe doit fermer la phrase : Ik heb buiten voetbal gespeeld." }
  ],
  final: {
    title: "Exercice final — Le week-end de Lotte",
    intro: `<p>Lis le petit texte, puis réponds aux questions.</p>
<pre class="pseudo">Lotte heeft dit weekend hard gewerkt in de tuin. Zaterdag heeft zij bloemen geplant. Daarna heeft zij koffie gemaakt voor haar buurman. Zij hebben samen in de zon gepraat. Zondag heeft Lotte lekker gekookt. Het was een fijn weekend.</pre>
<p>(planten = planter, buurman = voisin, samen = ensemble, lekker = bon/agréable, fijn = chouette)</p>`,
    questions: [
      { type: "qcm", q: "Quel auxiliaire revient dans tout le texte ?", opts: ["zijn", "hebben", "worden", "gaan"], a: 1, exp: "heeft / hebben : ce sont les formes de hebben au present." },
      { type: "input", q: "Complète : Zaterdag heeft zij bloemen ___ (planten).", a: ["geplant"], ph: "ge...t / ge...d", exp: "Radical plant finit par t -> geplant (un seul t)." },
      { type: "qcm", q: "Dans « Zij hebben samen in de zon gepraat », que fait le participe gepraat ?", opts: ["Il est en place 2", "Il ferme la phrase", "Il est avant hebben", "Il est le sujet"], a: 1, exp: "Le participe est toujours rejete a la fin de la phrase." },
      { type: "input", q: "Complète : Zondag heeft Lotte lekker ___ (koken).", a: ["gekookt"], ph: "ge...t / ge...d", exp: "Radical kook finit par k -> gekookt." },
      { type: "vf", q: "Le perfectum sert ici à raconter des actions terminées du week-end.", a: true, exp: "C'est exactement son role : des actions passees et achevees." }
    ],
    solution: `<p>Les participes réguliers du texte : <code>gewerkt</code> (werken, k → -t), <code>geplant</code> (planten, t → -t, un seul t), <code>gemaakt</code> (maken, k → -t), <code>gepraat</code> (praten, t → -t), <code>gekookt</code> (koken, k → -t).</p>
<pre class="pseudo">recette : ge- + radical + (-t si 't kofschip, sinon -d)
place  : hebben en 2e position, participe rejete a la FIN</pre>
<p>Retiens ces deux automatismes : la règle de <strong>'t kofschip</strong> pour choisir -t/-d, et le <strong>rejet du participe</strong> en fin de phrase. Ce sont les bases de tout le passé néerlandais.</p>`
  }
};
</script>
