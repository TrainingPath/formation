<script>
var DAY = {
  num: 23,
  title: "Les connecteurs : en, maar, want, dus",
  subtitle: "Relier ses phrases avec les conjonctions de coordination.",
  theory: `
<h3>1. Relier deux phrases</h3>
<p>Les <strong>conjonctions de coordination</strong> relient deux phrases principales sans changer l'ordre des mots : le verbe conjugué reste en 2e position dans chaque partie.</p>
<pre class="pseudo">en    et       maar   mais
want  car      dus    donc
of    ou</pre>
<h3>2. en, maar, of</h3>
<pre class="pseudo">Ik lees een boek en ik luister naar muziek.  Je lis un livre et j'écoute de la musique.
Ik wil komen, maar ik heb geen tijd.         Je veux venir, mais je n'ai pas le temps.
Drink je koffie of thee?                      Bois-tu du café ou du thé ?</pre>
<h3>3. want = car (la cause)</h3>
<p><strong>want</strong> introduit une explication. L'ordre des mots ne change pas.</p>
<pre class="pseudo">Ik blijf thuis, want ik ben ziek.   Je reste à la maison, car je suis malade.</pre>
<h3>4. dus = donc (la conséquence)</h3>
<p><strong>dus</strong> exprime le résultat. Après « dus », le verbe peut passer devant le sujet (inversion).</p>
<pre class="pseudo">Ik ben ziek, dus ik blijf thuis.    Je suis malade, donc je reste à la maison.
Ik ben ziek, dus blijf ik thuis.    (même sens, avec inversion)</pre>
<div class="tip">Astuce : « want » répond à « pourquoi ? » (la cause vient après), tandis que « dus » annonce la conclusion (le résultat vient après).</div>
<div class="warn">Ne confonds pas « want » (car, coordination, pas de rejet) et « omdat » (parce que, subordination, verbe à la fin) : « Ik blijf thuis omdat ik ziek ben. »</div>`,
  exercises: [
    { type: "qcm", q: "« maar » signifie…", opts: ["et", "mais", "car", "donc"], a: 1, exp: "maar = mais." },
    { type: "input", q: "Complète : « Ik ben moe, ___ ik ga slapen. » (donc)", a: ["dus"], ph: "un mot", exp: "dus = donc (conséquence)." },
    { type: "qcm", q: "« want » veut dire…", opts: ["mais", "ou", "car", "et"], a: 2, exp: "want = car." },
    { type: "vf", q: "« en » signifie « et ».", a: true, exp: "en = et." },
    { type: "input", q: "Complète : « Ik wil komen, ___ ik heb geen tijd. » (mais)", a: ["maar"], ph: "un mot", exp: "maar = mais." },
    { type: "input", q: "La conjonction qui signifie « car » et n'entraîne pas de rejet du verbe est ___", a: ["want"], ph: "un mot", exp: "want = car ; c'est une coordination, donc pas de rejet." },
    { type: "input", q: "Traduis « ou » : ___", a: ["of"], ph: "un mot", exp: "of = ou." },
    { type: "vf", q: "« dus » peut provoquer l'inversion (verbe avant le sujet).", a: true, exp: "Ik ben ziek, dus blijf ik thuis." },
    { type: "qcm", q: "« Ik blijf thuis, want ik ben ziek » — pourquoi reste-t-il ?", opts: ["il est fatigué", "il est malade", "il pleut", "il travaille"], a: 1, exp: "want ik ben ziek = car je suis malade." },
    { type: "input", q: "Complète : « Drink je koffie ___ thee? » (ou)", a: ["of"], ph: "un mot", exp: "of = ou." },
    { type: "qcm", q: "Quelle conjonction exprime la conséquence (donc) ?", opts: ["want", "maar", "dus", "of"], a: 2, exp: "dus = donc." },
    { type: "vf", q: "« want » et « omdat » suivent le même ordre des mots.", a: false, exp: "omdat rejette le verbe à la fin, want non." },
    { type: "qcm", q: "Compréhension : « Ik heb honger, dus ik ga koken. » Que va-t-il faire ?", opts: ["dormir", "cuisiner", "sortir", "manger dehors"], a: 1, exp: "ik ga koken = je vais cuisiner." },
    { type: "input", q: "Compréhension : « Ze studeert hard, want ze wil slagen. » Pourquoi étudie-t-elle ? Ze wil ___ (réussir)", a: ["slagen"], ph: "un verbe", exp: "want ze wil slagen = car elle veut réussir." },
    { type: "qcm", q: "Compréhension : « Hij wil sporten, maar hij is ziek. » Peut-il faire du sport ?", opts: ["oui", "non, car il est malade", "oui chaque jour", "on ne sait pas"], a: 1, exp: "maar hij is ziek = mais il est malade." }
  ],
  final: {
    title: "Exercice final — Een zieke dag",
    intro: `<p>Lis ce texte plein de connecteurs, puis réponds :</p>
<pre class="pseudo">Vandaag bleef ik thuis, want ik was ziek.
Ik wilde naar mijn werk gaan, maar ik had koorts.
Ik dronk thee en ik las een boek.
's Middags belde mijn collega, dus ik voelde me minder alleen.
Ik nam een pil en ik ging vroeg slapen.
Morgen ben ik hopelijk weer beter.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi est-il resté à la maison ?", opts: ["il était fatigué", "il était malade", "il pleuvait", "il n'avait pas envie"], a: 1, exp: "want ik was ziek = car j'étais malade." },
      { type: "input", q: "Il voulait aller au travail, mais il avait de la ___ (fièvre, en néerlandais)", a: ["koorts"], ph: "un mot", exp: "maar ik had koorts = mais j'avais de la fièvre." },
      { type: "qcm", q: "Qu'a-t-il bu ?", opts: ["du café", "du thé", "de l'eau", "du lait"], a: 1, exp: "ik dronk thee = j'ai bu du thé." },
      { type: "vf", q: "Un collègue l'a appelé l'après-midi.", a: true, exp: "'s middags belde mijn collega = l'après-midi mon collègue a appelé." },
      { type: "input", q: "Complète : « dus ik voelde me minder ___ » (seul)", a: ["alleen"], ph: "un mot", exp: "minder alleen = moins seul." }
    ],
    solution: `<p>Traduction : « Aujourd'hui je suis resté à la maison, car j'étais malade. Je voulais aller au travail, mais j'avais de la fièvre. J'ai bu du thé et lu un livre. L'après-midi mon collègue a appelé, donc je me suis senti moins seul. J'ai pris un cachet et je suis allé me coucher tôt. Demain j'irai j'espère à nouveau mieux. »</p>
<p>Retiens le rôle de chaque connecteur : <strong>en</strong> (addition), <strong>maar</strong> (opposition), <strong>want</strong> (cause), <strong>dus</strong> (conséquence). Aucun de ces mots ne rejette le verbe à la fin.</p>`
  }
};
</script>
