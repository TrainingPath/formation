<script>
var DAY = {
  num: 30,
  title: "Bilan A2 : conversation et mini-entretien",
  subtitle: "S'entraîner à une conversation et à un mini-entretien en néerlandais.",
  theory: `
<h3>1. Se présenter dans un entretien</h3>
<p>Dans un entretien (« een sollicitatiegesprek ») ou une conversation, on se présente clairement : nom, âge, ce qu'on fait, ses qualités.</p>
<pre class="pseudo">Ik heet ... en ik ben ... jaar oud.   Je m'appelle ... et j'ai ... ans.
Ik werk als ... / Ik studeer ...      Je travaille comme ... / J'étudie ...
Ik ben vriendelijk en hardwerkend.    Je suis aimable et travailleur.</pre>
<h3>2. Un mini-entretien</h3>
<pre class="pseudo">- Goedemorgen! Kunt u zich even voorstellen?
- Natuurlijk. Ik heet Karim en ik ben achtentwintig jaar.
- Wat doet u nu?
- Ik werk als kok in een restaurant.
- Waarom wilt u deze baan?
- Ik zou graag nieuwe dingen leren en met mensen werken.
- Bedankt, we nemen contact op!</pre>
<h3>3. Questions fréquentes</h3>
<pre class="pseudo">Kunt u zich voorstellen?   Pouvez-vous vous présenter ?
Wat zijn uw kwaliteiten?   Quelles sont vos qualités ?
Waarom wilt u deze baan?   Pourquoi voulez-vous ce poste ?
Heeft u nog vragen?        Avez-vous des questions ?</pre>
<h3>4. Bien réagir</h3>
<pre class="pseudo">Natuurlijk / Zeker           Bien sûr        Dat klopt.   C'est exact.
Kunt u dat herhalen?         Pouvez-vous répéter ?
Sorry, ik begrijp het niet.  Désolé, je ne comprends pas.</pre>
<div class="tip">Utilise le vouvoiement « u » dans un entretien : « Kunt u… », « Wat doet u… ». Reste poli, même à l'écrit.</div>
<div class="warn">Ne réponds pas seulement par « ja » ou « nee » : ajoute une phrase. À « Waarom wilt u deze baan? », donne une vraie raison avec « want » ou « omdat ».</div>`,
  exercises: [
    { type: "qcm", q: "« Kunt u zich voorstellen? » demande de…", opts: ["répéter", "vous présenter", "partir", "payer"], a: 1, exp: "zich voorstellen = se présenter." },
    { type: "input", q: "Complète : « Ik heet Karim en ik ben achtentwintig jaar ___ . » (âgé)", a: ["oud"], ph: "un mot", exp: "... jaar oud = ... ans." },
    { type: "qcm", q: "Dans un entretien, on utilise le pronom poli…", opts: ["jij", "u", "hij", "ze"], a: 1, exp: "u = vouvoiement poli." },
    { type: "vf", q: "Il vaut mieux répondre par une phrase que par un simple « ja ».", a: true, exp: "Ajoute une explication : c'est plus clair et plus poli." },
    { type: "input", q: "Traduis « bien sûr » : ___", a: ["natuurlijk"], ph: "un mot", exp: "natuurlijk = bien sûr." },
    { type: "input", q: "Traduis « qualités » : ___ (uw ___ )", a: ["kwaliteiten"], ph: "un mot", exp: "uw kwaliteiten = vos qualités." },
    { type: "input", q: "Complète : « Ik werk ___ kok in een restaurant. » (comme)", a: ["als"], ph: "un mot", exp: "werken als = travailler comme." },
    { type: "vf", q: "« Dat klopt » signifie « C'est exact ».", a: true, exp: "Dat klopt = c'est exact / c'est juste." },
    { type: "qcm", q: "Pour dire qu'on n'a pas compris, on dit…", opts: ["Dat klopt", "Sorry, ik begrijp het niet", "Natuurlijk", "Bedankt"], a: 1, exp: "Sorry, ik begrijp het niet = désolé, je ne comprends pas." },
    { type: "input", q: "Traduis « travailleur / assidu » : ___", a: ["hardwerkend"], ph: "un mot", exp: "hardwerkend = travailleur, assidu." },
    { type: "qcm", q: "« Heeft u nog vragen? » signifie…", opts: ["Avez-vous des questions ?", "Quel âge avez-vous ?", "Où habitez-vous ?", "Êtes-vous prêt ?"], a: 0, exp: "Heeft u nog vragen? = avez-vous encore des questions ?" },
    { type: "vf", q: "On peut demander « Kunt u dat herhalen? » pour faire répéter.", a: true, exp: "herhalen = répéter." },
    { type: "input", q: "Compréhension : dans le dialogue, quel est le métier de Karim ? « Ik werk als ___ » (cuisinier, en néerlandais)", a: ["kok"], ph: "un mot", exp: "Ik werk als kok = je travaille comme cuisinier." },
    { type: "qcm", q: "Compréhension : pourquoi Karim veut-il ce poste ?", opts: ["pour gagner beaucoup", "pour apprendre et travailler avec des gens", "pour voyager", "pour travailler seul"], a: 1, exp: "nieuwe dingen leren en met mensen werken." },
    { type: "qcm", q: "Compréhension : comment se termine l'entretien ?", opts: ["par un refus", "« we nemen contact op »", "par un contrat signé", "par une pause"], a: 1, exp: "we nemen contact op = nous vous recontactons." }
  ],
  final: {
    title: "Exercice final — Een sollicitatiegesprek",
    intro: `<p>Lis ce mini-entretien, puis réponds :</p>
<pre class="pseudo">- Goedemiddag, komt u binnen. Stelt u zich even voor.
- Dank u. Ik heet Sofie en ik ben vijfentwintig jaar oud.
- Wat voor werk zoekt u?
- Ik zoek een baan als verkoopster in een winkel.
- Wat zijn uw sterke punten?
- Ik ben vriendelijk, geduldig en ik werk graag met mensen.
- Prima, we bellen u volgende week.</pre>`,
    questions: [
      { type: "input", q: "Comment s'appelle la candidate ? « Ik heet ___ »", a: ["sofie"], ph: "un prénom", exp: "Ik heet Sofie." },
      { type: "qcm", q: "Quel âge a-t-elle ?", opts: ["vingt ans", "vingt-cinq ans", "trente ans", "trente-cinq ans"], a: 1, exp: "vijfentwintig jaar = vingt-cinq ans." },
      { type: "qcm", q: "Quel travail cherche-t-elle ?", opts: ["cuisinière", "vendeuse", "infirmière", "professeure"], a: 1, exp: "een baan als verkoopster = un poste de vendeuse." },
      { type: "vf", q: "Elle dit être aimable et patiente.", a: true, exp: "Ik ben vriendelijk, geduldig = aimable, patiente." },
      { type: "input", q: "Quand vont-ils l'appeler ? « ___ week » (la semaine prochaine -> premier mot, en néerlandais)", a: ["volgende"], ph: "un mot", exp: "volgende week = la semaine prochaine." }
    ],
    solution: `<p>Traduction : « Bonjour, entrez. Présentez-vous. — Merci. Je m'appelle Sofie et j'ai vingt-cinq ans. — Quel travail cherchez-vous ? — Je cherche un poste de vendeuse dans un magasin. — Quels sont vos points forts ? — Je suis aimable, patiente et j'aime travailler avec les gens. — Très bien, nous vous appelons la semaine prochaine. »</p>
<p>Félicitations, tu as terminé le niveau A2 ! Pour un entretien : vouvoie (u), présente-toi clairement, cite tes qualités et donne une vraie raison. Continue à parler et à écrire pour progresser.</p>`
  }
};
</script>

    solution: "Goedemorgen. Ik heet Nora en ik ben negenentwintig jaar oud. Ik werk nu als serveerster, maar ik zoek een nieuwe baan. Ik ben vriendelijk, geduldig en hardwerkend. Ik zou graag met mensen werken en nieuwe dingen leren. Ik wil deze baan, want uw bedrijf heeft een goede naam.\n\nTraduction : Bonjour. Je m'appelle Nora et j'ai vingt-neuf ans. Je travaille actuellement comme serveuse, mais je cherche un nouvel emploi. Je suis aimable, patiente et travailleuse. Je voudrais travailler avec des gens et apprendre de nouvelles choses. Je veux ce poste, car votre entreprise a une bonne réputation.",
