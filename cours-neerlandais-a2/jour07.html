<script>
var DAY = {
  num: 7,
  title: "Le comparatif des adjectifs",
  subtitle: "Plus grand, aussi grand, moins grand : comparer avec -er et dan.",
  theory: `
<h3>1. Comparer deux choses</h3>
<p>Le <strong>comparatif</strong> sert à comparer : « ce livre est plus intéressant que l'autre ». En néerlandais, on ne met pas « plus » devant l'adjectif : on ajoute la terminaison <code>-er</code> à l'adjectif lui-même, comme l'anglais « big → bigger ».</p>
<pre class="pseudo">groot   -> groter    // grand -> plus grand
klein   -> kleiner   // petit -> plus petit
snel    -> sneller   // rapide -> plus rapide</pre>
<h3>2. La règle de base : adjectif + -er</h3>
<p>On ajoute <code>-er</code> à l'adjectif. Les règles d'orthographe néerlandaises s'appliquent (on double parfois la consonne pour garder la voyelle courte).</p>
<pre class="pseudo">adjectif   comparatif   remarque
klein      kleiner      -er simple
snel       sneller      double la l (voyelle courte)
groot      groter       -oo- devient -o- (voyelle longue conservee)
mooi       mooier       -er simple</pre>
<h3>3. Le mot « que » se dit dan</h3>
<p>Pour introduire le second élément de la comparaison, on utilise <code>dan</code> (= que).</p>
<pre class="pseudo">Piet is groter dan Jan.              // Piet est plus grand que Jan.
Deze auto is sneller dan die bus.    // Cette voiture est plus rapide que ce bus.</pre>
<div class="warn">On dit <strong>dan</strong> (et non « als ») après un comparatif. « groter als » est une faute fréquente, même chez les néerlandophones : la norme correcte est « groter dan ».</div>
<h3>4. Le cas spécial : adjectifs en -r → -der</h3>
<p>Si l'adjectif se termine déjà par <code>-r</code>, on n'ajoute pas simplement -er (ce serait imprononçable) : on insère un <strong>-d-</strong> → <code>-der</code>.</p>
<pre class="pseudo">duur   -> duurder    // cher -> plus cher
lekker -> lekkerder  // bon -> meilleur (au gout)
ver    -> verder     // loin -> plus loin</pre>
<h3>5. Les irréguliers à connaître</h3>
<p>Quelques adjectifs très courants ont un comparatif irrégulier, à mémoriser :</p>
<pre class="pseudo">goed   -> beter      // bon -> meilleur
veel   -> meer       // beaucoup -> plus
weinig -> minder     // peu -> moins
graag  -> liever     // volontiers -> preferer (plus volontiers)</pre>
<h3>6. Dire « aussi... que » et « moins... que »</h3>
<p>Pour l'égalité, on utilise <code>even ... als</code> ou <code>net zo ... als</code> (aussi... que). Pour l'infériorité, on utilise <code>minder ... dan</code> (moins... que).</p>
<pre class="pseudo">Anna is even groot als Lisa.        // Anna est aussi grande que Lisa.
Dit boek is net zo duur als dat.    // Ce livre est aussi cher que celui-la.
De film is minder leuk dan het boek. // Le film est moins sympa que le livre.</pre>
<div class="tip">Retiens la paire : comparatif de supériorité/infériorité → <strong>dan</strong> ; égalité (even / net zo) → <strong>als</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on le comparatif d'un adjectif court en néerlandais ?", opts: ["Avec « meer » devant", "En ajoutant -er à l'adjectif", "En doublant l'adjectif", "Avec -st"], a: 1, exp: "On ajoute -er : klein -> kleiner (pas de 'meer' devant)." },
    { type: "input", q: "Comparatif de <code>klein</code> (petit) : Mijn huis is ___ dan jouw huis.", a: ["kleiner"], ph: "adjectif + er", exp: "klein -> kleiner." },
    { type: "input", q: "Comparatif de <code>snel</code> (rapide) : De trein is ___ dan de bus.", a: ["sneller"], ph: "adjectif + er", exp: "snel -> sneller (on double la l)." },
    { type: "qcm", q: "Quel mot signifie « que » après un comparatif ?", opts: ["als", "dan", "dat", "of"], a: 1, exp: "groter DAN Jan : on emploie dan apres le comparatif." },
    { type: "input", q: "Comparatif de <code>groot</code> (grand) : Piet is ___ dan Jan.", a: ["groter"], ph: "adjectif + er", exp: "groot -> groter." },
    { type: "qcm", q: "Comparatif de <code>duur</code> (cher) ?", opts: ["duurer", "duurder", "meer duur", "durer"], a: 1, exp: "Adjectif en -r -> on insere -d- : duurder." },
    { type: "input", q: "Comparatif de <code>lekker</code> (bon) : Deze soep is ___ dan die.", a: ["lekkerder"], ph: "adjectif en -r", exp: "lekker (en -r) -> lekkerder." },
    { type: "qcm", q: "Comparatif irrégulier de <code>goed</code> (bon) ?", opts: ["goeder", "gceder", "beter", "meer goed"], a: 2, exp: "goed -> beter (irregulier), comme l'anglais good -> better." },
    { type: "vf", q: "« Piet is groter als Jan » est la forme correcte.", a: false, exp: "Apres un comparatif on dit DAN : Piet is groter dan Jan." },
    { type: "input", q: "Comparatif irrégulier de <code>veel</code> (beaucoup) : Ik heb ___ tijd dan gisteren.", a: ["meer"], ph: "irregulier", exp: "veel -> meer." },
    { type: "qcm", q: "Comment dit-on « aussi grand que » ?", opts: ["groter dan", "even groot als", "meest groot", "groot dan"], a: 1, exp: "even ... als (ou net zo ... als) exprime l'egalite." },
    { type: "qcm", q: "Quelle phrase exprime l'infériorité correctement ?", opts: ["De film is minder leuk dan het boek.", "De film is leuker dan het boek.", "De film is even leuk dan het boek.", "De film is leukst het boek."], a: 0, exp: "minder ... dan = moins ... que." },
    { type: "input", q: "Comparatif de <code>ver</code> (loin) : Zijn huis is ___ dan het mijne.", a: ["verder"], ph: "adjectif en -r", exp: "ver (en -r) -> verder." },
    { type: "vf", q: "Le comparatif de <code>weinig</code> (peu) est « minder ».", a: true, exp: "weinig -> minder (irregulier)." },
    { type: "qcm", q: "Traduction de « Ce livre est meilleur que le film » ?", opts: ["Dit boek is goeder dan de film.", "Dit boek is beter dan de film.", "Dit boek is beter als de film.", "Dit boek is meest goed dan de film."], a: 1, exp: "goed -> beter, et on emploie dan." }
  ],
  final: {
    title: "Exercice final — Deux appartements",
    intro: `<p>Nina compare deux appartements.</p>
<pre class="pseudo">Het eerste appartement is groter dan het tweede, maar het is ook duurder. Het tweede is kleiner en goedkoper. De buurt van het tweede is rustiger en mooier. Voor mij is het tweede appartement beter dan het eerste, want het is even licht als het eerste maar minder duur.</pre>
<p>(goedkoop = bon marché, buurt = quartier, licht = lumineux, want = car)</p>`,
    questions: [
      { type: "input", q: "Complète : Het eerste is ___ dan het tweede (groot).", a: ["groter"], ph: "adjectif + er", exp: "groot -> groter." },
      { type: "qcm", q: "Pourquoi « duurder » et non « duurer » ?", opts: ["Erreur du texte", "duur finit par -r, on insère -d- : duurder", "Parce que c'est cher", "Par hasard"], a: 1, exp: "Adjectif en -r -> -der : duurder." },
      { type: "input", q: "Complète : Voor mij is het tweede ___ dan het eerste (goed, irrégulier).", a: ["beter"], ph: "irregulier", exp: "goed -> beter." },
      { type: "qcm", q: "« even licht als het eerste » exprime…", opts: ["une supériorité", "une égalité", "une infériorité", "un futur"], a: 1, exp: "even ... als = aussi ... que (egalite)." },
      { type: "vf", q: "« minder duur » signifie « moins cher ».", a: true, exp: "minder ... = moins ... : minder duur = moins cher." }
    ],
    solution: `<p>Comparatifs du texte : <code>groter</code>, <code>duurder</code> (-der), <code>kleiner</code>, <code>goedkoper</code>, <code>rustiger</code>, <code>mooier</code>, <code>beter</code> (irrégulier), <code>even licht als</code> (égalité), <code>minder duur</code> (infériorité).</p>
<pre class="pseudo">superiorite : adjectif + -er ... dan   (groter dan)
adjectif en -r : + -der                (duur -> duurder)
egalite : even / net zo ... als        (even licht als)
inferiorite : minder ... dan           (minder duur dan)
irreguliers : goed->beter, veel->meer, weinig->minder</pre>
<p>Le comparatif néerlandais est proche de l'anglais : <strong>-er + dan</strong>. Les deux pièges à retenir : dire <strong>dan</strong> (pas « als ») et penser au <strong>-der</strong> pour les adjectifs en -r.</p>`
  }
};
</script>
