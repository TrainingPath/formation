<script>
var DAY = {
  num: 29,
  title: "Révisions A2",
  subtitle: "Revoir la grammaire et le vocabulaire clés du niveau A2.",
  theory: `
<h3>1. Les temps du passé</h3>
<p>Parfait = <strong>hebben / zijn + participe</strong> (fait isolé). Prétérit = radical + <strong>-te / -de</strong> ou verbe fort (récit).</p>
<pre class="pseudo">Ik heb gegeten.    J'ai mangé.        Ik at brood.   Je mangeais du pain.
Wij zijn gegaan.   Nous sommes allés. Wij gingen.    Nous allions.</pre>
<h3>2. Relier ses phrases</h3>
<pre class="pseudo">en et · maar mais · want car · dus donc · of ou   (pas de rejet)
omdat parce que · toen quand · als si             (verbe à la fin)</pre>
<h3>3. er + préposition et le conditionnel</h3>
<pre class="pseudo">Ik denk eraan.                    J'y pense.
Ik zou graag komen.               Je voudrais bien venir.
Als ik tijd had, zou ik reizen.   Si j'avais le temps, je voyagerais.</pre>
<h3>4. L'ordre des mots</h3>
<p>Verbe conjugué en 2e position. Compléments : <strong>Temps – Manière – Lieu</strong>. Infinitif et participe à la fin.</p>
<pre class="pseudo">Ik ga morgen met de fiets naar school.
Zij heeft gisteren hard gewerkt.</pre>
<div class="tip">Pour progresser : relis chaque leçon, refais les exercices, et surtout parle ! L'erreur fait partie de l'apprentissage.</div>
<div class="warn">Attention aux pièges fréquents : « toen » (passé unique) vs « als » (répétition / présent), « want » (pas de rejet) vs « omdat » (rejet), et l'infinitif après « zou ».</div>`,
  exercises: [
    { type: "qcm", q: "Le prétérit de « gaan » (singulier) est…", opts: ["gaat", "ging", "gegaan", "gaan"], a: 1, exp: "gaan -> ging / gingen (verbe fort)." },
    { type: "input", q: "Complète : « Ik denk ___ . » (j'y pense, er + aan)", a: ["eraan"], ph: "un mot", exp: "er + aan = eraan." },
    { type: "qcm", q: "Quelle conjonction rejette le verbe à la fin ?", opts: ["want", "en", "omdat", "dus"], a: 2, exp: "omdat rejette le verbe à la fin." },
    { type: "vf", q: "Après « zou », le verbe principal est à l'infinitif.", a: true, exp: "Ik zou graag komen." },
    { type: "input", q: "Complète : « Wij ___ graag reizen. » (conditionnel pluriel)", a: ["zouden"], ph: "un mot", exp: "pluriel : wij zouden." },
    { type: "qcm", q: "L'ordre habituel des compléments est…", opts: ["Lieu-Temps-Manière", "Temps-Manière-Lieu", "Manière-Lieu-Temps", "Temps-Lieu-Manière"], a: 1, exp: "TMP : Temps, Manière, Lieu." },
    { type: "input", q: "Traduis « car » : ___", a: ["want"], ph: "un mot", exp: "want = car." },
    { type: "vf", q: "« Ik heb gegeten » est au parfait.", a: true, exp: "hebben + participe = parfait." },
    { type: "qcm", q: "Pour un souvenir précis au passé (« quand j'étais petit »), on utilise…", opts: ["als", "toen", "wanneer", "dan"], a: 1, exp: "toen = quand, fait passé unique." },
    { type: "input", q: "Complète : « Zij heeft gisteren hard ___ . » (participe de werken)", a: ["gewerkt"], ph: "un participe", exp: "werken -> gewerkt." },
    { type: "input", q: "Traduis « avec cela » (er + mee) : ___", a: ["ermee"], ph: "un mot", exp: "met devient mee : ermee." },
    { type: "vf", q: "« maar » entraîne le rejet du verbe à la fin.", a: false, exp: "maar est une coordination : pas de rejet." },
    { type: "input", q: "Compréhension : « Toen ik jong was, woonde ik in Gent. » Où habitait-il ? « in ___ »", a: ["gent"], ph: "un mot", exp: "in Gent = à Gand." },
    { type: "qcm", q: "Compréhension : « Ik zou graag komen, maar ik heb geen tijd. » Vient-il ?", opts: ["oui", "non, il n'a pas le temps", "oui demain", "on ne sait pas"], a: 1, exp: "maar ik heb geen tijd = mais je n'ai pas le temps." },
    { type: "qcm", q: "Compréhension : « Ik ben ziek, dus ik blijf thuis. » Pourquoi reste-t-il chez lui ?", opts: ["il travaille", "il est malade", "il est fatigué", "il fait froid"], a: 1, exp: "ik ben ziek = je suis malade." }
  ],
  final: {
    title: "Exercice final — Nederlands leren",
    intro: `<p>Lis ce bilan d'apprentissage, puis réponds :</p>
<pre class="pseudo">Vorig jaar leerde ik Nederlands in een avondschool.
In het begin was het moeilijk, want de grammatica is anders dan het Frans.
Maar ik studeerde elke dag en ik oefende met apps.
Toen ik op reis ging naar Amsterdam, kon ik al veel begrijpen.
Ik bestelde eten en ik vroeg de weg in het Nederlands.
Nu zou ik graag een boek in het Nederlands lezen.</pre>`,
    questions: [
      { type: "qcm", q: "Où a-t-il appris le néerlandais ?", opts: ["à l'université", "dans une école du soir", "en ligne seulement", "au travail"], a: 1, exp: "in een avondschool = dans une école du soir." },
      { type: "input", q: "Pourquoi était-ce difficile au début ? « de ___ is anders » (la grammaire, en néerlandais)", a: ["grammatica"], ph: "un mot", exp: "de grammatica is anders = la grammaire est différente." },
      { type: "qcm", q: "Comment s'entraînait-il ?", opts: ["avec des livres", "avec des applis", "avec la télé", "avec la radio"], a: 1, exp: "ik oefende met apps = je m'entraînais avec des applis." },
      { type: "vf", q: "Pendant son voyage à Amsterdam, il pouvait déjà comprendre beaucoup.", a: true, exp: "kon ik al veel begrijpen = je pouvais déjà comprendre beaucoup." },
      { type: "input", q: "Que voudrait-il lire maintenant ? « een ___ in het Nederlands » (livre, en néerlandais)", a: ["boek"], ph: "un mot", exp: "een boek lezen = lire un livre." }
    ],
    solution: `<p>Traduction : « L'année dernière j'ai appris le néerlandais dans une école du soir. Au début c'était difficile, car la grammaire est différente du français. Mais j'ai étudié chaque jour et je me suis entraîné avec des applis. Quand je suis parti en voyage à Amsterdam, je pouvais déjà comprendre beaucoup. J'ai commandé à manger et demandé mon chemin en néerlandais. Maintenant je voudrais lire un livre en néerlandais. »</p>
<p>Ce texte réunit les points A2 : prétérit (leerde, studeerde, ging), connecteurs (want, maar, toen), et conditionnel (zou … lezen). Révise-les ensemble.</p>`
  }
};
</script>
