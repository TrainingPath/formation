var DAY = {

  title: "Le prétérit irrégulier",
  subtitle: "Les verbes forts au passé simple : une voyelle qui change, à mémoriser.",
  theory: `
<h3>1. Rappel : forts contre faibles</h3>
<p>Au jour 4, tu as vu le prétérit <strong>régulier</strong> (radical + -te/-de). Les verbes <strong>forts</strong>, eux, ne prennent pas ces terminaisons : ils forment leur prétérit en <strong>changeant la voyelle</strong> du radical, comme l'anglais « sing → sang », « drink → drank ».</p>
<pre class="pseudo">infinitif   preterit sing.   preterit plur.   traduction
drinken     dronk            dronken          buvait / buvaient
lezen       las              lazen            lisait / lisaient
schrijven   schreef          schreven         ecrivait / ecrivaient</pre>
<h3>2. Singulier et pluriel : attention à la voyelle</h3>
<p>Beaucoup de verbes forts ont une voyelle <strong>courte au singulier</strong> et <strong>longue au pluriel</strong> (ou l'inverse). Il faut donc mémoriser deux formes.</p>
<pre class="pseudo">ik las (court)      ->   wij lazen (long)     // lire
ik gaf (court)      ->   wij gaven (long)     // donner
ik zat (court)      ->   wij zaten (long)     // etre assis</pre>
<div class="warn">Ne dis pas « wij lasen » ni « ik lazen » : c'est las au singulier, lazen au pluriel. Chaque verbe fort s'apprend avec ses DEUX formes.</div>
<h3>3. Les prétérits forts indispensables</h3>
<p>Voici les plus fréquents au niveau A2 (singulier / pluriel) :</p>
<pre class="pseudo">infinitif   sing.    plur.     traduction
zijn        was      waren     etait / etaient
hebben      had      hadden    avait / avaient
gaan        ging     gingen    allait
doen        deed     deden     faisait
zien        zag      zagen     voyait
komen       kwam     kwamen    venait
geven       gaf      gaven     donnait
eten        at       aten      mangeait
nemen       nam      namen     prenait
staan       stond    stonden   etait debout
kunnen      kon      konden    pouvait
moeten      moest    moesten   devait</pre>
<h3>4. Deux verbes à connaître absolument : was et had</h3>
<p><code>zijn</code> → <code>was/waren</code> (était) et <code>hebben</code> → <code>had/hadden</code> (avait) sont les plus utilisés de toute la langue. Ils servent partout dans les récits.</p>
<pre class="pseudo">Het was koud en ik had honger.        // Il faisait froid et j'avais faim.
Wij waren moe, maar zij hadden tijd.  // Nous etions fatigues, mais ils avaient le temps.</pre>
<h3>5. La place ne change pas</h3>
<p>Comme tout verbe conjugué, le prétérit fort reste en <strong>deuxième position</strong>. Le prétérit est un temps simple : rien à rejeter à la fin.</p>
<pre class="pseudo">Gisteren  ging  ik naar de markt.        // Hier, j'allais / je suis alle au marche.
Toen  zag  hij een oude vriend.          // Alors, il vit un vieil ami.</pre>
<div class="tip">Ces verbes forts sont exactement les mêmes qu'au participe (jour 2). Apprends chaque verbe fort en bloc : infinitif / prétérit sing. / prétérit plur. / participe. Ex. : lezen – las – lazen – gelezen.</div>`,
  exercises: [
    { type: "qcm", q: "Comment un verbe fort forme-t-il son prétérit ?", opts: ["Radical + -te", "En changeant la voyelle du radical", "En doublant la consonne", "Avec ge-"], a: 1, exp: "Les verbes forts changent de voyelle : drinken -> dronk." },
    { type: "input", q: "Prétérit singulier de <code>zijn</code> : Het ___ koud gisteren. (il faisait)", a: ["was"], ph: "preterit fort", exp: "zijn -> was (singulier)." },
    { type: "input", q: "Prétérit singulier de <code>hebben</code> : Ik ___ honger. (j'avais)", a: ["had"], ph: "preterit fort", exp: "hebben -> had (singulier)." },
    { type: "input", q: "Prétérit singulier de <code>gaan</code> : Zij ___ naar huis. (allait)", a: ["ging"], ph: "preterit fort", exp: "gaan -> ging (singulier)." },
    { type: "qcm", q: "Prétérit PLURIEL de <code>zijn</code> ?", opts: ["was", "wasen", "waren", "zijnden"], a: 2, exp: "zijn -> was (sing.) / waren (plur.)." },
    { type: "input", q: "Prétérit singulier de <code>lezen</code> : Hij ___ een boek. (lisait)", a: ["las"], ph: "preterit fort", exp: "lezen -> las (sing.), lazen (plur.)." },
    { type: "qcm", q: "Quelle est la forme plurielle correcte de <code>lezen</code> au prétérit ?", opts: ["lasen", "lazen", "lezen", "lasten"], a: 1, exp: "wij lazen (voyelle longue au pluriel)." },
    { type: "input", q: "Prétérit singulier de <code>zien</code> : Ik ___ een film. (voyais)", a: ["zag"], ph: "preterit fort", exp: "zien -> zag (sing.), zagen (plur.)." },
    { type: "vf", q: "Le prétérit de <code>komen</code> est « kwam » au singulier et « kwamen » au pluriel.", a: true, exp: "komen -> kwam / kwamen, verbe fort." },
    { type: "input", q: "Prétérit PLURIEL de <code>hebben</code> : Wij ___ geen tijd. (nous n'avions pas)", a: ["hadden"], ph: "preterit fort", exp: "hebben -> had (sing.) / hadden (plur.)." },
    { type: "qcm", q: "Prétérit singulier de <code>doen</code> ?", opts: ["deed", "doede", "dede", "did"], a: 0, exp: "doen -> deed (sing.), deden (plur.)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Gisteren ik ging naar de markt.", "Gisteren ging ik naar de markt.", "Ik gisteren ging naar de markt.", "Ging gisteren ik naar de markt."], a: 1, exp: "Le verbe conjugue reste en place 2 : Gisteren ging ik..." },
    { type: "vf", q: "« Ik had honger en het was koud » utilise deux prétérits forts.", a: true, exp: "had (hebben) et was (zijn) sont bien deux preterits forts." },
    { type: "input", q: "Prétérit singulier de <code>geven</code> : Zij ___ mij een cadeau. (donnait)", a: ["gaf"], ph: "preterit fort", exp: "geven -> gaf (sing.), gaven (plur.)." },
    { type: "qcm", q: "Prétérit singulier de <code>eten</code> ?", opts: ["eet", "atte", "at", "gegeten"], a: 2, exp: "eten -> at (sing.), aten (plur.)." }
  ],
  final: {
    title: "Exercice final — Un souvenir d'enfance",
    intro: `<p>Récit au prétérit ; repère les formes fortes.</p>
<pre class="pseudo">Toen ik klein was, had ik een hond. Elke dag ging ik met hem naar het park. Daar zag ik mijn vrienden en samen speelden wij. 's Avonds at ik met mijn familie en gaf mijn moeder ons warme melk. Het waren mooie dagen.</pre>
<p>(toen = quand/lorsque, hond = chien, warme melk = lait chaud)</p>`,
    questions: [
      { type: "input", q: "Complète : Toen ik klein ___ , had ik een hond (zijn, singulier).", a: ["was"], ph: "preterit fort", exp: "zijn -> was (singulier)." },
      { type: "input", q: "Complète : Elke dag ___ ik naar het park (gaan, singulier).", a: ["ging"], ph: "preterit fort", exp: "gaan -> ging." },
      { type: "qcm", q: "Forme de <code>zien</code> dans « Daar zag ik... » ?", opts: ["zie", "zag", "zien", "gezien"], a: 1, exp: "zien -> zag (singulier)." },
      { type: "input", q: "Complète : Het ___ mooie dagen (zijn, pluriel).", a: ["waren"], ph: "preterit fort", exp: "zijn -> waren (pluriel), car 'dagen' est pluriel." },
      { type: "vf", q: "« gaf » est le prétérit singulier de geven.", a: true, exp: "geven -> gaf (sing.), gaven (plur.)." }
    ],
    solution: `<p>Prétérits forts du texte : <code>was/waren</code> (zijn), <code>had</code> (hebben), <code>ging</code> (gaan), <code>zag</code> (zien), <code>at</code> (eten), <code>gaf</code> (geven).</p>
<pre class="pseudo">apprends chaque verbe fort en bloc :
lezen - las - lazen - gelezen
zijn  - was - waren - geweest
attention : voyelle courte (sing.) / longue (plur.)</pre>
<p>Il n'y a pas de règle magique : les verbes forts se <strong>mémorisent</strong>. Concentre-toi sur les plus fréquents (was, had, ging, zag, kwam) : ils reviennent dans presque tous les récits.</p>`
  }
};
