  subtitle: "Former et placer les adverbes de temps, de manière, de lieu et de degré.",
  theory: `
<h3>1. Pas de « -ment » : l'adjectif devient adverbe</h3>
<p>En néerlandais, l'adverbe de manière a souvent la même forme que l'adjectif : pas de terminaison « -ment ».</p>
<pre class="pseudo">Hij is snel.     Il est rapide.   Hij loopt snel.   Il marche vite.
Zij is mooi.     Elle est belle.  Zij zingt mooi.   Elle chante bien / joliment.</pre>
<h3>2. Adverbes de temps, de lieu, de manière</h3>
<pre class="pseudo">TEMPS    nu maintenant   vandaag aujourd'hui  altijd toujours
LIEU     hier ici        daar là             overal partout
MANIERE  goed bien       snel vite           samen ensemble</pre>
<h3>3. L'ordre : Temps – Manière – Lieu</h3>
<p>Quand plusieurs compléments se suivent, l'ordre habituel est <strong>Temps, Manière, Lieu</strong> (TMP).</p>
<pre class="pseudo">Ik ga morgen met de trein naar Brussel.
   morgen (temps)  met de trein (manière)  naar Brussel (lieu)
Wij eten vaak samen thuis.   Nous mangeons souvent ensemble à la maison.</pre>
<h3>4. Les adverbes de degré</h3>
<pre class="pseudo">heel  très      erg   très / fort   te   trop
zo    si        bijna presque       heel erg  vraiment</pre>
<p><strong>Het is heel koud.</strong> = Il fait très froid. · <strong>De koffie is te warm.</strong> = Le café est trop chaud.</p>
<div class="tip">« goed » (bien) est l'adverbe de « goed » (bon) : « Zij spreekt goed Nederlands. » (Elle parle bien néerlandais.)</div>
<div class="warn">Ne traduis pas « vite » par un mot à part : c'est le même que « rapide » (snel). De même, l'adverbe « bien » se dit « goed », pas « goede ».</div>`,

    { type: "input", q: "Traduis « maintenant » : ___", a: ["nu"], ph: "un mot", exp: "nu = maintenant." },

    { type: "vf", q: "En néerlandais, l'adverbe de manière n'a pas de terminaison « -ment ».", a: true, exp: "On utilise la forme de l'adjectif : snel, mooi, goed." },
    { type: "input", q: "Complète : « Zij zingt ___ . » (bien)", a: ["goed"], ph: "un mot", exp: "goed = bien (adverbe)." },
    { type: "qcm", q: "« te warm » signifie…", opts: ["très chaud", "trop chaud", "assez chaud", "presque chaud"], a: 1, exp: "te = trop." },

    { type: "vf", q: "« heel » veut dire « très ».", a: true, exp: "heel koud = très froid." },
    { type: "qcm", q: "Dans « Ik ga morgen met de trein naar Brussel », quel est le complément de temps ?", opts: ["met de trein", "naar Brussel", "morgen", "ga"], a: 2, exp: "morgen = demain (temps)." },

    { type: "input", q: "Traduis « ensemble » : ___", a: ["samen"], ph: "un mot", exp: "samen = ensemble." },
    { type: "vf", q: "« goede » est la bonne forme de l'adverbe « bien ».", a: false, exp: "L'adverbe est « goed », sans -e." },
    { type: "input", q: "Compréhension : « Wij eten vaak samen thuis. » Où mangent-ils ? ___ (à la maison, en néerlandais)", a: ["thuis"], ph: "un mot", exp: "thuis = à la maison." },
    { type: "qcm", q: "Compréhension : « De koffie is te warm, dus ik wacht even. » Pourquoi attend-il ?", opts: ["le café est froid", "le café est trop chaud", "il n'a pas de tasse", "il est pressé"], a: 1, exp: "te warm = trop chaud." },
    { type: "qcm", q: "Compréhension : « Zij spreekt heel goed Nederlands. » Comment parle-t-elle néerlandais ?", opts: ["mal", "très bien", "un peu", "rarement"], a: 1, exp: "heel goed = très bien." }

    title: "Exercice final — Mijn ochtend",

Daarna fiets ik rustig naar het werk.

's Avonds kook ik samen met mijn partner thuis.

      { type: "input", q: "Où mangent-ils le soir ? ___ (à la maison, en néerlandais)", a: ["thuis"], ph: "un mot", exp: "thuis = à la maison." }
    ],
    solution: `<p>Traduction : « Chaque matin ma journée commence pareil. Je me lève tôt et je déjeune vite dans la cuisine. Ensuite je vais tranquillement au travail à vélo. Je travaille dur, mais j'aime aussi parler avec mes collègues. Le soir je cuisine à la maison avec mon / ma partenaire. Nous mangeons généralement tard et allons ensuite dormir tôt. »</p>
<p>Repère les adverbes de manière (snel, rustig, hard, samen), de temps (elke ochtend, daarna, 's avonds, laat) et de degré (vroeg).</p>`
  }
