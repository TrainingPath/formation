<script>
var DAY = {
  num: 2,
  title: "Le passé composé : participes irréguliers",
  subtitle: "Les verbes forts changent de voyelle et finissent souvent en -en.",
  theory: `
<h3>1. Deux familles de participes</h3>
<p>Au jour 1, tu as vu les participes <strong>réguliers</strong> (verbes « faibles ») : <code>ge-</code> + radical + <code>-t/-d</code>. Aujourd'hui, place aux <strong>verbes forts</strong> (irréguliers). Ils sont très fréquents et il faut les apprendre par cœur, un peu comme « pris, mis, écrit » en français.</p>
<p>La construction de la phrase ne change pas : <code>hebben</code> (ou <code>zijn</code>, voir jour 3) reste en deuxième position et le participe est toujours <strong>rejeté à la fin</strong>.</p>
<h3>2. La marque des verbes forts : -en et changement de voyelle</h3>
<p>Les participes forts se terminent le plus souvent par <code>-en</code> (et non -t/-d), et la <strong>voyelle du radical change</strong> souvent. Comparez avec l'anglais « sing → sung », « drink → drunk ».</p>
<pre class="pseudo">infinitif   participe     traduction
drinken     gedronken     bu        (i -> o)
lezen       gelezen       lu        (voyelle stable)
schrijven   geschreven    ecrit     (ij -> e)
zingen      gezongen      chante    (i -> o)
nemen       genomen       pris      (e -> o)</pre>
<div class="tip">Un bon réflexe : quand un participe finit par <code>-en</code>, c'est presque toujours un verbe fort à mémoriser. Quand il finit par <code>-t/-d</code>, c'est un verbe régulier (jour 1).</div>
<h3>3. Les incontournables à connaître</h3>
<p>Voici les participes forts les plus utiles au niveau A2. Apprends-les avec leur auxiliaire.</p>
<pre class="pseudo">infinitif   participe     traduction
hebben      gehad         eu
zijn        geweest       ete (etat)
doen        gedaan        fait
gaan        gegaan        alle
zien        gezien        vu
eten        gegeten       mange
geven       gegeven       donne
komen       gekomen       venu
lopen       gelopen       marche/couru
vinden      gevonden      trouve</pre>
<h3>4. Le préfixe ge- disparaît parfois</h3>
<p>Certains verbes ne prennent <strong>pas</strong> le préfixe <code>ge-</code>. C'est le cas des verbes commençant par les préfixes inaccentués <code>be-, ver-, ont-, ge-, her-, er-</code>.</p>
<pre class="pseudo">betalen   -> betaald    (paye)   -- pas de ge- : deja be-
vertellen -> verteld    (raconte) -- pas de ge- : deja ver-
begrijpen -> begrepen   (compris) -- fort, mais sans ge-
verliezen -> verloren   (perdu)   -- fort, sans ge-</pre>
<div class="warn">Attention : « begrijpen » et « verliezen » sont FORTS (voyelle qui change, fin en -en) mais ne prennent pas ge-. Le préfixe be-/ver- occupe déjà la place du ge-.</div>
<h3>5. Récapitulatif de la construction</h3>
<pre class="pseudo">Ik  heb  gisteren een boek  gelezen.       // J'ai lu un livre hier.
Wij hebben de rekening  betaald.          // Nous avons paye l'addition.
Hij heeft een film  gezien.               // Il a vu un film.</pre>
<p>Le mécanisme reste identique : seul le participe change de forme. La place, elle, ne bouge pas.</p>`,
  exercises: [
    { type: "qcm", q: "Comment reconnaît-on souvent un participe de verbe fort ?", opts: ["Il finit par -t", "Il finit par -en et la voyelle change souvent", "Il commence par on-", "Il n'a jamais de ge-"], a: 1, exp: "Les verbes forts font leur participe en -en avec un changement de voyelle." },
    { type: "input", q: "Participe passé de <code>drinken</code> (boire) : Ik heb water ___ .", a: ["gedronken"], ph: "participe fort", exp: "drinken -> gedronken (i -> o), verbe fort en -en." },
    { type: "input", q: "Participe passé de <code>lezen</code> (lire) : Zij heeft een boek ___ .", a: ["gelezen"], ph: "participe fort", exp: "lezen -> gelezen, verbe fort en -en." },
    { type: "input", q: "Participe passé de <code>schrijven</code> (écrire) : Wij hebben een brief ___ .", a: ["geschreven"], ph: "participe fort", exp: "schrijven -> geschreven (ij -> e)." },
    { type: "qcm", q: "Participe passé de <code>doen</code> (faire) ?", opts: ["gedoet", "gedaan", "gedoen", "gedaant"], a: 1, exp: "doen -> gedaan, tres irregulier, a memoriser." },
    { type: "input", q: "Participe passé de <code>eten</code> (manger) : Hij heeft pizza ___ .", a: ["gegeten"], ph: "participe fort", exp: "eten -> gegeten, verbe fort." },
    { type: "qcm", q: "Pourquoi <code>betalen</code> donne <code>betaald</code> sans ge- ?", opts: ["C'est une faute", "Le préfixe inaccentué be- occupe déjà la place du ge-", "betalen est court", "Les verbes en -alen n'ont jamais ge-"], a: 1, exp: "Les verbes en be-, ver-, ont-, her-... ne prennent pas ge-." },
    { type: "input", q: "Participe passé de <code>zien</code> (voir) : Ik heb een film ___ .", a: ["gezien"], ph: "participe fort", exp: "zien -> gezien, verbe fort." },
    { type: "vf", q: "Le participe <code>vertellen → verteld</code> ne prend pas de préfixe ge-.", a: true, exp: "ver- est un prefixe inaccentue : pas de ge-. (Ici verteld est meme regulier : ver + tel + d.)" },
    { type: "qcm", q: "Participe passé de <code>vinden</code> (trouver) ?", opts: ["gevind", "gevindt", "gevonden", "gevindd"], a: 2, exp: "vinden -> gevonden (i -> o), verbe fort." },
    { type: "input", q: "Participe passé de <code>komen</code> (venir) : De trein is ___ .", a: ["gekomen"], ph: "participe fort", exp: "komen -> gekomen, verbe fort (ici avec zijn, voir jour 3)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ik heb gelezen een boek gisteren.", "Ik heb gisteren een boek gelezen.", "Ik gelezen heb een boek.", "Een boek heb gelezen ik."], a: 1, exp: "Auxiliaire en place 2, participe (gelezen) rejete a la fin." },
    { type: "vf", q: "Le participe de <code>begrijpen</code> (comprendre) est « gebegrepen ».", a: false, exp: "C'est begrepen : verbe fort mais sans ge-, car be- occupe la place." },
    { type: "input", q: "Participe passé de <code>geven</code> (donner) : Zij heeft mij een cadeau ___ .", a: ["gegeven"], ph: "participe fort", exp: "geven -> gegeven, verbe fort." },
    { type: "qcm", q: "Participe passé de <code>zijn</code> (être) ?", opts: ["gezijn", "geweest", "gezijnd", "gewees"], a: 1, exp: "zijn -> geweest, tres irregulier, a apprendre par coeur." }
  ],
  final: {
    title: "Exercice final — La journée de Sam",
    intro: `<p>Lis le texte et réponds.</p>
<pre class="pseudo">Vandaag heeft Sam veel gedaan. Hij heeft eerst een boek gelezen. Daarna heeft hij koffie gedronken en een brief geschreven. 's Middags heeft hij een oude vriend gezien. Samen hebben zij pizza gegeten. Het is een drukke dag geweest.</pre>
<p>(vandaag = aujourd'hui, eerst = d'abord, daarna = ensuite, 's middags = l'après-midi, druk = chargé)</p>`,
    questions: [
      { type: "input", q: "Complète : Hij heeft eerst een boek ___ (lezen).", a: ["gelezen"], ph: "participe fort", exp: "lezen -> gelezen." },
      { type: "input", q: "Complète : Daarna heeft hij koffie ___ (drinken).", a: ["gedronken"], ph: "participe fort", exp: "drinken -> gedronken (i -> o)." },
      { type: "qcm", q: "Participe de <code>schrijven</code> dans le texte ?", opts: ["geschrijft", "geschreven", "geschrijven", "schreef"], a: 1, exp: "schrijven -> geschreven (ij -> e)." },
      { type: "input", q: "Complète : Samen hebben zij pizza ___ (eten).", a: ["gegeten"], ph: "participe fort", exp: "eten -> gegeten." },
      { type: "vf", q: "« geweest » est le participe passé du verbe zijn.", a: true, exp: "zijn -> geweest, irregulier a memoriser." }
    ],
    solution: `<p>Participes forts du texte : <code>gedaan</code> (doen), <code>gelezen</code> (lezen), <code>gedronken</code> (drinken), <code>geschreven</code> (schrijven), <code>gezien</code> (zien), <code>gegeten</code> (eten), <code>geweest</code> (zijn).</p>
<pre class="pseudo">verbe fort  -> participe en -en, voyelle qui change souvent
prefixe be-/ver-/ont-... -> PAS de ge-</pre>
<p>Ces participes ne suivent pas de règle simple : il faut les <strong>mémoriser</strong>. La bonne nouvelle : ce sont toujours les mêmes verbes très courants qui reviennent.</p>`
  }
};
</script>

    hints: [
