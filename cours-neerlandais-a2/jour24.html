<script>
var DAY = {
  num: 24,
  title: "Er + préposition (erover, ermee...)",
  subtitle: "Utiliser les adverbes pronominaux : erover, ermee, ervan, eraan…",
  theory: `
<h3>1. À quoi sert « er + préposition » ?</h3>
<p>Pour renvoyer à une <strong>chose</strong> (pas une personne) après une préposition, le néerlandais n'utilise pas « het » mais fusionne <strong>er</strong> avec la préposition.</p>
<pre class="pseudo">Waar denk je aan?  -> Ik denk eraan.    À quoi penses-tu ? -> J'y pense.
Ben je blij met het cadeau? -> Ja, ik ben er blij mee.</pre>
<h3>2. Les formes courantes</h3>
<pre class="pseudo">over  -> erover    (à ce sujet)   op   -> erop   (dessus)
in    -> erin      (dedans)       aan  -> eraan  (y, à cela)
van   -> ervan     (en, de cela)  mee  -> ermee  (avec cela)
naar  -> ernaar    (vers cela)    voor -> ervoor (pour cela)</pre>
<p>Attention : <strong>met</strong> devient <strong>mee</strong> et <strong>tot</strong> devient <strong>toe</strong>.</p>
<h3>3. « er » peut se séparer de la préposition</h3>
<p>Dans une phrase, « er » se place souvent tôt et la préposition part plus loin (avant l'infinitif ou à la fin).</p>
<pre class="pseudo">Ik denk er niet aan.          Je n'y pense pas.
We praten er morgen over.     Nous en parlerons demain.
Hij is er niet blij mee.      Il n'en est pas content.</pre>
<h3>4. Les variantes « hier- » et « daar- »</h3>
<pre class="pseudo">hierover   à ce sujet-ci    daarover   à ce sujet-là
hiermee    avec ceci        daarmee    avec cela</pre>
<div class="tip">« er + préposition » sert surtout pour les choses. Pour une personne, on garde la préposition + pronom : « Ik denk aan hem » (Je pense à lui).</div>
<div class="warn">N'oublie pas les formes spéciales : « met » devient « mee » (ermee, hiermee) et « tot » devient « toe » (ertoe). On ne dit jamais « ermet ».</div>`,
  exercises: [
    { type: "qcm", q: "« over » combiné avec « er » donne…", opts: ["ermee", "erover", "ervan", "eraan"], a: 1, exp: "er + over = erover." },
    { type: "input", q: "Complète : dans « ermee », « met » devient ___ .", a: ["mee"], ph: "un mot", exp: "met -> mee : ermee." },
    { type: "qcm", q: "Pour une chose, à « Waar denk je aan? » on répond…", opts: ["Ik denk aan hem", "Ik denk eraan", "Ik denk het", "Ik denk aan"], a: 1, exp: "eraan renvoie à une chose." },
    { type: "vf", q: "« er + préposition » s'emploie surtout pour les choses, pas les personnes.", a: true, exp: "Pour une personne : aan hem, met haar…" },
    { type: "input", q: "Traduis « dedans » (er + in) : ___", a: ["erin"], ph: "un mot", exp: "er + in = erin." },
    { type: "input", q: "Complète : « Ik ben er blij ___ . » (met -> ?)", a: ["mee"], ph: "un mot", exp: "met devient mee : er ... mee." },
    { type: "input", q: "Traduis « avec ceci » (hier + mee) : ___", a: ["hiermee"], ph: "un mot", exp: "hier + mee = hiermee." },
    { type: "vf", q: "« met » se combine en « ermet ».", a: false, exp: "met devient mee : on dit ermee." },
    { type: "qcm", q: "Dans « Ik denk er niet aan », la préposition est…", opts: ["niet", "aan", "er", "denk"], a: 1, exp: "La préposition « aan » est séparée de « er »." },
    { type: "input", q: "Pour « je pense à lui » (personne), on garde la préposition : « Ik denk ___ hem. » (à)", a: ["aan"], ph: "un mot", exp: "Personne = préposition + pronom : aan hem." },
    { type: "qcm", q: "« ermee » veut dire…", opts: ["dessus", "avec cela", "dedans", "pour cela"], a: 1, exp: "ermee = avec cela." },
    { type: "vf", q: "« er » peut être séparé de sa préposition dans la phrase.", a: true, exp: "Ik denk er niet aan." },
    { type: "input", q: "Compréhension : « Ik heb een nieuwe fiets en ik ben er heel blij mee. » De quoi est-il content ? van zijn nieuwe ___", a: ["fiets"], ph: "un mot", exp: "er ... mee renvoie au vélo (de fiets)." },
    { type: "qcm", q: "Compréhension : « We praten er morgen over. » Quand vont-ils en parler ?", opts: ["aujourd'hui", "demain", "ce soir", "jamais"], a: 1, exp: "morgen = demain." },
    { type: "qcm", q: "Compréhension : « Denk je aan de vergadering? — Nee, ik denk er niet aan. » Pense-t-il à la réunion ?", opts: ["oui", "non", "parfois", "il ne sait pas"], a: 1, exp: "ik denk er niet aan = je n'y pense pas." }
  ],
  final: {
    title: "Exercice final — Een nieuwe telefoon",
    intro: `<p>Lis ce texte rempli d'adverbes pronominaux, puis réponds :</p>
<pre class="pseudo">Ik heb gisteren een nieuwe telefoon gekocht.
Ik ben er heel blij mee, want de oude was kapot.
Mijn zus vroeg ernaar, dus ik liet hem zien.
We praatten er lang over.
Zij wil er ook een, maar zij heeft nu geen geld.
Volgende maand denkt ze eraan om er een te kopen.</pre>`,
    questions: [
      { type: "qcm", q: "Qu'a-t-il acheté ?", opts: ["un ordinateur", "un téléphone", "une voiture", "un vélo"], a: 1, exp: "een nieuwe telefoon = un nouveau téléphone." },
      { type: "input", q: "Il en est très content : « Ik ben er heel ___ mee. » (content)", a: ["blij"], ph: "un mot", exp: "er heel blij mee = très content de cela." },
      { type: "qcm", q: "Pourquoi a-t-il acheté un nouveau téléphone ? Parce que l'ancien était…", opts: ["cher", "cassé", "lent", "perdu"], a: 1, exp: "de oude was kapot = l'ancien était cassé." },
      { type: "vf", q: "Sa sœur veut aussi un téléphone.", a: true, exp: "Zij wil er ook een = elle en veut un aussi." },
      { type: "input", q: "Quand pense-t-elle en acheter un ? Volgende ___ (mois, en néerlandais)", a: ["maand"], ph: "un mot", exp: "volgende maand = le mois prochain." }
    ],
    solution: `<p>Traduction : « J'ai acheté un nouveau téléphone hier. J'en suis très content, car l'ancien était cassé. Ma sœur m'a posé des questions dessus, donc je le lui ai montré. Nous en avons parlé longtemps. Elle en veut un aussi, mais elle n'a pas d'argent maintenant. Le mois prochain elle pense en acheter un. »</p>
<p>Remarque comment « er » se combine (ermee, ernaar, eraan) et se sépare parfois de sa préposition (er ... over, er ... mee).</p>`
  }
};
</script>

    statement: "Décris un objet que tu aimes (5 à 6 phrases) : ce que c'est, pourquoi tu l'aimes, ce que tu en fais. Utilise au moins deux fois « er + préposition » (ermee, erover, eraan…).",
    hints: [
      "Commence par présenter l'objet : « Ik heb een… ».",
      "Exprime le goût : « Ik ben er heel blij mee » ou « Ik hou ervan ».",
      "Rappelle-toi : met devient mee (ermee) et tot devient toe (ertoe)."
    ],
    solution: "Ik heb een oude gitaar en ik ben er heel blij mee. Mijn opa gaf hem aan mij, dus hij is bijzonder. Ik speel er elke avond op. Soms praat ik erover met mijn vrienden. Ik denk vaak eraan om nieuwe liedjes te leren. Ik zou nooit zonder hem willen zijn.\n\nTraduction : J'ai une vieille guitare et j'en suis très content. Mon grand-père me l'a donnée, donc elle est spéciale. J'en joue chaque soir. Parfois j'en parle avec mes amis. Je pense souvent à apprendre de nouvelles chansons. Je ne voudrais jamais être sans elle.",
    note: "Vérifie les formes fusionnées (ermee, erover, eraan) et n'oublie pas que « er » peut se détacher de la préposition." }
  ]
};
