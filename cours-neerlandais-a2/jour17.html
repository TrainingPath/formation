<script>
var DAY = {
  num: 17,
  title: "Voyager : gare, aéroport, hôtel",
  subtitle: "Acheter un billet, prendre l'avion et réserver une chambre.",
  theory: `
<h3>1. À la gare — op het station</h3>
<p>Le voyage en train est courant aux Pays-Bas et en Belgique. Vocabulaire de base :</p>
<pre class="pseudo">de trein        le train         het station     la gare
het spoor       la voie / quai   het perron      le quai
het kaartje     le billet        de reis         le voyage
enkele reis     aller simple     retour          aller-retour
het vertrek     le départ        de aankomst     l'arrivée</pre>
<p>Phrases utiles : <strong>Een kaartje naar Amsterdam, alstublieft.</strong> (Un billet pour Amsterdam, s'il vous plaît.) · <strong>Hoe laat vertrekt de trein?</strong> (À quelle heure part le train ?) · <strong>Van welk perron?</strong> (De quel quai ?)</p>
<h3>2. À l'aéroport — op de luchthaven</h3>
<pre class="pseudo">het vliegtuig   l'avion          de vlucht       le vol
de koffer       la valise        de bagage       les bagages
inchecken       enregistrer      de gate         la porte
het paspoort    le passeport     de douane       la douane</pre>
<p><strong>Ik moet inchecken voor mijn vlucht naar Madrid.</strong> = Je dois m'enregistrer pour mon vol vers Madrid.</p>
<h3>3. À l'hôtel — in het hotel</h3>
<pre class="pseudo">de kamer             la chambre        reserveren     réserver
een eenpersoonskamer une chambre simple de sleutel     la clé
een tweepersoonskamer une chambre double het ontbijt   le petit-déjeuner
de receptie          la réception      overnachten    passer la nuit</pre>
<p><strong>Ik heb een kamer gereserveerd voor twee nachten.</strong> = J'ai réservé une chambre pour deux nuits. · <strong>Is het ontbijt inbegrepen?</strong> = Le petit-déjeuner est-il compris ?</p>
<h3>4. Demander son chemin et l'heure</h3>
<p>Pour se repérer : <strong>Waar is het perron?</strong> (Où est le quai ?) · <strong>Hoe laat is het?</strong> (Quelle heure est-il ?) · <strong>Hoe lang duurt de reis?</strong> (Combien de temps dure le voyage ?)</p>
<div class="tip">Le verbe <strong>reizen</strong> = voyager. « Ik reis met de trein » = Je voyage en train. On utilise <strong>met</strong> pour le moyen de transport : met de bus, met het vliegtuig, met de auto.</div>
<div class="warn">Attention : <strong>het perron</strong> (le quai où l'on monte) et <strong>het spoor</strong> (la voie) apparaissent ensemble sur les panneaux. « Spoor 5 » indique le numéro de voie.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le billet » (de train) ?", opts: ["de reis", "het kaartje", "het spoor", "de kamer"], a: 1, exp: "het kaartje = le billet." },
    { type: "input", q: "Complète : « Hoe laat ___ de trein? » (À quelle heure part le train ?)", a: ["vertrekt"], ph: "un verbe", exp: "vertrekken → vertrekt = partir." },
    { type: "qcm", q: "« een enkele reis » signifie…", opts: ["un aller-retour", "un aller simple", "un long voyage", "un billet gratuit"], a: 1, exp: "enkele reis = aller simple ; retour = aller-retour." },
    { type: "qcm", q: "Que veut dire « inchecken » ?", opts: ["réserver", "s'enregistrer (aéroport)", "payer", "atterrir"], a: 1, exp: "inchecken = enregistrer ses bagages / se présenter." },
    { type: "input", q: "Traduis « l'avion » : het ___", a: ["vliegtuig"], ph: "un mot", exp: "het vliegtuig = l'avion." },
    { type: "vf", q: "« de koffer » veut dire « la valise ».", a: true, exp: "de koffer = la valise." },
    { type: "qcm", q: "À l'hôtel, « een tweepersoonskamer » est…", opts: ["une chambre simple", "une chambre double", "une suite", "un dortoir"], a: 1, exp: "twee = deux, chambre pour deux personnes." },
    { type: "input", q: "Complète : « Is het ontbijt ___? » (Le petit-déjeuner est-il compris ?)", a: ["inbegrepen"], ph: "un mot", exp: "inbegrepen = compris / inclus." },
    { type: "qcm", q: "« de sleutel » désigne…", opts: ["la clé", "la chambre", "la réception", "la nuit"], a: 0, exp: "de sleutel = la clé." },
    { type: "vf", q: "On dit « Ik reis met de trein » pour « Je voyage en train ».", a: true, exp: "met + moyen de transport." },
    { type: "input", q: "Traduis « réserver » : ___", a: ["reserveren"], ph: "un verbe", exp: "reserveren = réserver." },
    { type: "qcm", q: "« Van welk perron? » demande…", opts: ["quel prix", "de quel quai", "quelle heure", "quelle destination"], a: 1, exp: "perron = quai." },
    { type: "qcm", q: "Compréhension : « Ik neem de trein van 9 uur naar Brussel, spoor 4. » Quel est le numéro de voie ?", opts: ["9", "4", "Brussel", "aucun"], a: 1, exp: "spoor 4 = voie 4." },
    { type: "vf", q: "Compréhension : « Ik heb een kamer voor drie nachten gereserveerd. » La réservation est pour trois nuits.", a: true, exp: "drie nachten = trois nuits." },
    { type: "qcm", q: "Compréhension : « Mijn vlucht vertrekt om 14 uur van gate 12. » Où faut-il aller ?", opts: ["au quai 12", "à la porte 12", "à la chambre 12", "au guichet 12"], a: 1, exp: "gate 12 = porte d'embarquement 12." }
  ],
  final: {
    title: "Exercice final — Aan de receptie",
    intro: `<p>Lis ce dialogue à la réception d'un hôtel, puis réponds :</p>
<pre class="pseudo">Gast:         Goedenavond, ik heb een kamer gereserveerd.
Receptionist: Op welke naam?
Gast:         Op naam van De Vries, voor twee nachten.
Receptionist: Een tweepersoonskamer, klopt dat?
Gast:         Ja. Is het ontbijt inbegrepen?
Receptionist: Ja, van 7 tot 10 uur. Hier is uw sleutel, kamer 21.</pre>`,
    questions: [
      { type: "qcm", q: "Que fait le client à la réception ?", opts: ["il annule", "il confirme sa réservation", "il paie l'addition", "il demande un taxi"], a: 1, exp: "Il a réservé et se présente : ik heb een kamer gereserveerd." },
      { type: "input", q: "À quel nom est la réservation ? De ___", a: ["Vries", "vries"], ph: "un nom", exp: "Op naam van De Vries." },
      { type: "input", q: "Pour combien de nuits ? (nombre)", a: ["2", "twee"], ph: "nombre", exp: "voor twee nachten = deux nuits." },
      { type: "qcm", q: "À quelle heure sert-on le petit-déjeuner ?", opts: ["de 6 à 9 h", "de 7 à 10 h", "de 8 à 11 h", "il n'est pas compris"], a: 1, exp: "van 7 tot 10 uur." },
      { type: "input", q: "Quel est le numéro de la chambre ?", a: ["21"], ph: "nombre", exp: "kamer 21." }
    ],
    solution: `<p>Traduction : « Bonsoir, j'ai réservé une chambre. — À quel nom ? — Au nom de De Vries, pour deux nuits. — Une chambre double, c'est bien ça ? — Oui. Le petit-déjeuner est-il compris ? — Oui, de 7 à 10 h. Voici votre clé, chambre 21. »</p>
<p>Le réflexe voyage : donner son nom (<strong>op naam van</strong>), préciser la durée (<strong>twee nachten</strong>) et vérifier les détails pratiques (<strong>ontbijt, sleutel, kamer</strong>).</p>`
  }
};
</script>
