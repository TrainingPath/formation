<h3>1. Les parties du corps</h3>
<p>Voici le <strong>vocabulaire de base du corps</strong> (het lichaam) :</p>
<pre class="pseudo">het hoofd    // la tete
het haar     // les cheveux
het oog      // l'oeil   (pluriel : de ogen)
het oor      // l'oreille
de neus      // le nez
de mond      // la bouche
de keel      // la gorge
de arm       // le bras
de hand      // la main
het been     // la jambe
de voet      // le pied
de buik      // le ventre
de rug       // le dos</pre>
<h3>2. Dire qu'on a mal : « pijn »</h3>
<p>Pour exprimer une douleur, on utilise le mot <code>pijn</code> (douleur). La structure la plus courante est <strong>partie du corps + pijn</strong> comme un mot composé.</p>
<pre class="pseudo">Ik heb hoofdpijn.      // J'ai mal a la tete.
Ik heb keelpijn.       // J'ai mal a la gorge.
Ik heb buikpijn.       // J'ai mal au ventre.
Ik heb rugpijn.        // J'ai mal au dos.</pre>
<p>Autre structure : <code>pijn hebben aan</code> + partie du corps :</p>
<pre class="pseudo">Ik heb pijn aan mijn arm.   // J'ai mal au bras.
Hij heeft pijn aan zijn voet. // Il a mal au pied.</pre>
<h3>3. Chez le médecin</h3>
<pre class="pseudo">de dokter / de arts   // le medecin
ziek                  // malade
de koorts             // la fievre
verkouden             // enrhume
hoesten               // tousser
het medicijn          // le medicament
Ik ben ziek.          // Je suis malade.
Ik heb koorts.        // J'ai de la fievre.</pre>
<div class="warn">Attention au genre : on dit <strong>het hoofd, het oog, het oor, het been</strong> (neutres) mais <strong>de neus, de mond, de arm, de hand, de voet</strong>. Apprends l'article avec le mot.</div>
<div class="tip">Astuce : pour les douleurs courantes, colle simplement la partie du corps devant <code>pijn</code> : hoofd + pijn = hoofdpijn, keel + pijn = keelpijn.</div>`,

    intro: `<p>Emma est chez le docteur.</p>
<pre class="pseudo">Emma is ziek. Zij heeft koorts en hoofdpijn. Ook heeft ze pijn aan haar keel. De dokter zegt: "U bent verkouden." Emma moet een medicijn nemen en veel rusten. Na een week is zij weer beter.</pre>

<pre class="pseudo">avoir mal : partie + pijn      (hoofdpijn, keelpijn, buikpijn)
autre structure : pijn hebben aan + partie (pijn aan mijn arm)
etre malade : ik ben ziek / ik heb koorts
chez le medecin : de dokter, verkouden, hoesten, medicijn</pre>
<p>Retiens les deux façons de dire qu'on a mal (mot composé avec pijn, ou pijn aan), et le vocabulaire de base pour une visite médicale.</p>`
