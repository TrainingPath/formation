  subtitle: "Réserver une table, lire le menu et commander poliment.",
  theory: `
<h3>1. Réserver et s'installer</h3>
<p>Au restaurant (<strong>het restaurant</strong>), on commence par réserver ou demander une table :</p>
<pre class="pseudo">Ik wil graag een tafel voor twee.   Je voudrais une table pour deux.
Heeft u een tafel vrij?             Avez-vous une table de libre ?
Mag ik de kaart, alstublieft?       Puis-je avoir la carte, s'il vous plaît ?</pre>
<p><strong>de ober</strong> = le serveur · <strong>de kaart / het menu</strong> = la carte / le menu · <strong>de tafel</strong> = la table.</p>
<h3>2. Le menu — de gerechten</h3>
<pre class="pseudo">het voorgerecht  l'entrée         de soep       la soupe
het hoofdgerecht le plat principal het vlees    la viande
de vis           le poisson       de groenten   les légumes
het nagerecht    le dessert       het toetje    le dessert (familier)</pre>
<p>Boissons (<strong>de drankjes</strong>) : <strong>het water</strong> (l'eau), <strong>het bier</strong> (la bière), <strong>de wijn</strong> (le vin), <strong>de koffie</strong> (le café), <strong>de thee</strong> (le thé).</p>
<h3>3. Commander poliment — bestellen</h3>
<p>Le verbe clé est <strong>bestellen</strong> (commander). La formule la plus polie utilise <strong>graag</strong> (volontiers) ou <strong>Ik wil graag…</strong> / <strong>Voor mij…</strong> :</p>
<pre class="pseudo">Ik wil graag de soep en daarna de vis.
= Je voudrais la soupe puis le poisson.
Voor mij een glas water, alstublieft.
= Pour moi un verre d'eau, s'il vous plaît.
Wat kunt u aanbevelen?  = Que pouvez-vous recommander ?</pre>
<h3>4. Payer — de rekening</h3>
<p>À la fin : <strong>De rekening, alstublieft.</strong> (L'addition, s'il vous plaît.) · <strong>Kan ik met de kaart betalen?</strong> (Puis-je payer par carte ?) · <strong>Het was heerlijk!</strong> (C'était délicieux !)</p>
<div class="tip">« Eet smakelijk! » se dit avant de manger, comme « Bon appétit ! ». On peut répondre « Dank u, insgelijks » (Merci, de même).</div>
<div class="warn">Ne confonds pas <strong>de kaart</strong>, qui veut dire à la fois « la carte (menu) » et « la carte (bancaire) ». Le contexte fait la différence : « de kaart, alstublieft » (menu) vs « met de kaart betalen » (paiement).</div>`,

    { type: "input", q: "Complète : « Ik wil graag een ___ voor twee. » (une table pour deux)", a: ["tafel"], ph: "un mot", exp: "de tafel = la table." },

    { type: "qcm", q: "Le verbe « bestellen » signifie…", opts: ["payer", "commander", "réserver", "goûter"], a: 1, exp: "bestellen = commander." },

    { type: "vf", q: "On dit « Eet smakelijk! » avant de commencer à manger.", a: true, exp: "Équivalent de « Bon appétit ! »." },
    { type: "input", q: "Traduis « le café » : de ___", a: ["koffie"], ph: "un mot", exp: "de koffie = le café." },

<pre class="pseudo">Ober:  Goedenavond. Heeft u gereserveerd?
Gast:  Ja, een tafel voor twee, op naam van Jansen.
Ober:  Prima. Wilt u iets drinken?
Gast:  Twee glazen water, graag. En als hoofdgerecht de vis.

    ],
    solution: `<p>Traduction : « Bonsoir. Avez-vous réservé ? — Oui, une table pour deux, au nom de Jansen. — Parfait. Voulez-vous boire quelque chose ? — Deux verres d'eau, volontiers. Et comme plat principal le poisson. — Excellent. Et comme dessert ? — Une glace, s'il vous plaît. L'addition peut se faire par carte. »</p>
<p>La logique d'un repas : accueil (<strong>Heeft u gereserveerd?</strong>), boissons (<strong>drinken</strong>), plats (<strong>voorgerecht / hoofdgerecht / nagerecht</strong>) et paiement (<strong>de rekening</strong>).</p>`
  }
