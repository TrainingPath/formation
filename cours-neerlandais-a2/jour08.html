var DAY = {
  num: 8,
  title: "Le superlatif des adjectifs",
  subtitle: "Le plus grand de tous : la terminaison -st et l'article het.",
  theory: `
<h3>1. Exprimer le maximum</h3>
<p>Le <strong>superlatif</strong> désigne le degré le plus élevé : « le plus grand », « le meilleur ». Là où le français ajoute « le plus », le néerlandais ajoute la terminaison <code>-st</code> à l'adjectif, comme l'anglais « big → biggest ».</p>
<pre class="pseudo">groot   -> grootst    // grand -> le plus grand
klein   -> kleinst    // petit -> le plus petit
snel    -> snelst     // rapide -> le plus rapide</pre>
<h3>2. La forme avec het ... -ste (attribut)</h3>
<p>Quand le superlatif est employé seul après le verbe (attribut), on utilise très souvent la structure <code>het + adjectif + -ste</code>, quelle que soit la chose comparée.</p>
<pre class="pseudo">Deze berg is het hoogst.            // Cette montagne est la plus haute.
In de winter zijn de dagen het kortst.   // En hiver les jours sont les plus courts.</pre>
<p>Devant un nom, le superlatif prend un <code>-e</code> final et l'article du nom (de/het) :</p>
<pre class="pseudo">de grootste stad       // la plus grande ville
het snelste dier       // l'animal le plus rapide
de mooiste bloemen     // les plus belles fleurs</pre>
<h3>3. Adjectifs en -s : simplement -st</h3>
<p>Si l'adjectif finit déjà par <code>-s</code>, on n'ajoute qu'un <code>-t</code> (pas de double s) :</p>
<pre class="pseudo">fris   -> frist      // frais -> le plus frais
vies   -> viest      // sale -> le plus sale</pre>
<h3>4. Les irréguliers à connaître</h3>
<p>Les mêmes adjectifs irréguliers qu'au comparatif (jour 7) le sont aussi au superlatif :</p>
<pre class="pseudo">adjectif   comparatif   superlatif
goed       beter        best        (bon / meilleur / le meilleur)
veel       meer         meest       (beaucoup / plus / le plus)
weinig     minder       minst       (peu / moins / le moins)
graag      liever       liefst      (volontiers / preferer / de preference)</pre>
<h3>5. Le cas des adjectifs longs : meest</h3>
<p>Pour quelques adjectifs longs (souvent d'origine étrangère), on préfère <code>meest</code> + adjectif, comme le français « le plus... ».</p>
<pre class="pseudo">interessant -> het meest interessante boek    // le livre le plus interessant
belangrijk  -> het meest belangrijke punt     // le point le plus important</pre>
<div class="tip">Résumé des trois degrés : <strong>positif</strong> (groot), <strong>comparatif</strong> (groter + dan), <strong>superlatif</strong> (grootst / de grootste). Une famille logique : -er pour comparer, -st pour le maximum.</div>
<div class="warn">Ne confonds pas « het grootst » (attribut : cette chose est la plus grande) et « de grootste stad » (devant un nom : la plus grande ville). Devant un nom, ajoute toujours le -e final.</div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on le superlatif d'un adjectif court ?", opts: ["Avec « meest » devant", "En ajoutant -st à l'adjectif", "En ajoutant -er", "En doublant l'adjectif"], a: 1, exp: "groot -> grootst : on ajoute -st." },
    { type: "input", q: "Superlatif de <code>klein</code> (petit) : Dit is de ___ kamer van het huis. (+ -ste devant un nom)", a: ["kleinste"], ph: "adjectif + ste", exp: "klein -> kleinst -> de kleinste (nom -> +e)." },
    { type: "input", q: "Superlatif de <code>snel</code> (rapide) : De cheetah is het ___ dier. (+ -ste)", a: ["snelste"], ph: "adjectif + ste", exp: "snel -> snelst -> het snelste dier." },
    { type: "qcm", q: "Superlatif attribut de <code>hoog</code> (haut) : « Cette montagne est la plus haute » ?", opts: ["Deze berg is hoger.", "Deze berg is het hoogst.", "Deze berg is hoogst dan.", "Deze berg is meest hoog."], a: 1, exp: "Attribut : het + adjectif + st -> het hoogst." },
    { type: "input", q: "Superlatif de <code>groot</code> : Amsterdam is de ___ stad van Nederland. (+ -ste)", a: ["grootste"], ph: "adjectif + ste", exp: "groot -> grootst -> de grootste stad." },
    { type: "qcm", q: "Superlatif irrégulier de <code>goed</code> (bon) ?", opts: ["goedst", "goedste", "best", "meest goed"], a: 2, exp: "goed -> beter -> best (irregulier)." },
    { type: "input", q: "Superlatif de <code>mooi</code> (beau) : Dit zijn de ___ bloemen. (+ -ste)", a: ["mooiste"], ph: "adjectif + ste", exp: "mooi -> mooist -> de mooiste bloemen." },
    { type: "qcm", q: "Superlatif de <code>fris</code> (frais), qui finit par -s ?", opts: ["frisst", "frist", "frisste", "meest fris"], a: 1, exp: "Adjectif en -s : on ajoute juste -t -> frist (pas de double s)." },
    { type: "vf", q: "Devant un nom, le superlatif prend un -e final (de grootste stad).", a: true, exp: "Oui : het/de + adjectif + -ste devant un nom." },
    { type: "input", q: "Superlatif irrégulier de <code>veel</code> : Hij heeft de ___ punten. (le plus de points)", a: ["meeste"], ph: "irregulier + e", exp: "veel -> meer -> meest -> de meeste punten." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Dit is de grootst stad.", "Dit is de grootste stad.", "Dit is grootst stad.", "Dit is meest groot stad."], a: 1, exp: "Devant un nom : de grootste stad (avec -e)." },
    { type: "qcm", q: "Comment forme-t-on le superlatif de <code>interessant</code> (long) ?", opts: ["interessantst", "het meest interessante", "interessanter", "het interessantst dan"], a: 1, exp: "Adjectif long -> meest + adjectif : het meest interessante." },
    { type: "input", q: "Superlatif attribut de <code>kort</code> : In de winter zijn de dagen het ___ .", a: ["kortst"], ph: "adjectif + st", exp: "kort -> kortst ; attribut : het kortst." },
    { type: "vf", q: "Le superlatif de <code>weinig</code> (peu) est « minst ».", a: true, exp: "weinig -> minder -> minst (irregulier)." },
    { type: "qcm", q: "Les trois degrés de <code>groot</code> sont…", opts: ["groot / grooter / grootst", "groot / groter / grootst", "groot / groter / grootste dan", "groter / grootst / meest"], a: 1, exp: "positif groot, comparatif groter, superlatif grootst." }
  ],
  final: {
    title: "Exercice final — Le concours de cuisine",
    intro: `<p>Trois plats ont été notés.</p>
<pre class="pseudo">Er waren drie gerechten. De soep was lekker, de pizza was lekkerder, maar de taart was het lekkerst. De taart was ook het mooiste gerecht van de dag. De kok van de taart is de beste kok van het dorp. Iedereen vond de taart het meest bijzonder.</pre>
<p>(gerecht = plat, taart = tarte/gâteau, kok = cuisinier, bijzonder = spécial)</p>`,
    questions: [
      { type: "input", q: "Complète (attribut) : de taart was het ___ (lekker, superlatif).", a: ["lekkerst"], ph: "adjectif + st", exp: "lekker -> lekkerst ; attribut : het lekkerst." },
      { type: "qcm", q: "« het mooiste gerecht » : pourquoi -ste avec -e ?", opts: ["Erreur", "Le superlatif est devant un nom (gerecht) : il prend -e", "Parce que mooi", "Par hasard"], a: 1, exp: "Devant un nom -> superlatif + -e : het mooiste gerecht." },
      { type: "input", q: "Complète : de ___ kok van het dorp (goed, superlatif + e).", a: ["beste"], ph: "irregulier + e", exp: "goed -> best -> de beste kok." },
      { type: "qcm", q: "Superlatif de <code>bijzonder</code> (long) dans le texte ?", opts: ["bijzonderst", "het meest bijzonder", "bijzonderder", "bijzonderste dan"], a: 1, exp: "Adjectif long -> meest + adjectif : het meest bijzonder." },
      { type: "vf", q: "Le texte montre les trois degrés : lekker, lekkerder, het lekkerst.", a: true, exp: "positif / comparatif / superlatif du meme adjectif." }
    ],
    solution: `<p>Superlatifs du texte : <code>het lekkerst</code> (attribut), <code>het mooiste gerecht</code> (devant un nom, +e), <code>de beste kok</code> (irrégulier + e), <code>het meest bijzonder</code> (adjectif long).</p>
<pre class="pseudo">attribut          : het + adjectif + -st   (het lekkerst)
devant un nom     : de/het + adjectif + -ste  (de beste kok)
adjectif en -s    : + -t seulement (frist)
adjectif long     : meest + adjectif (het meest bijzonder)
irreguliers       : goed->best, veel->meest, weinig->minst</pre>
<p>Le superlatif complète la famille : <strong>-er</strong> pour comparer, <strong>-st</strong> pour le maximum. Souviens-toi du <strong>-e</strong> quand il précède un nom.</p>`
  }
};
</script>
