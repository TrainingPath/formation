<script>
var ATELIER = {
  prefix: "at-nl-a2",
  titre: "🇳🇱 Atelier — Néerlandais A2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour consolider le niveau A2.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Op het station en in het hotel", perso:"Lotte (reizigster), de loketbediende, de receptionist",
      lignes:[
        {qui:"Lotte", txt:"Goedendag, ik wil graag een treinkaartje naar Amsterdam.", fr:"Bonjour, je voudrais un billet de train pour Amsterdam."},
        {qui:"Loket", txt:"Enkele reis of retour, mevrouw?", fr:"Aller simple ou aller-retour, madame ?"},
        {qui:"Lotte", txt:"Een retour, alstublieft. Ik kom morgenavond terug.", fr:"Un aller-retour, s'il vous plaît. Je reviens demain soir."},
        {qui:"Loket", txt:"Dat is achtentwintig euro vijftig. De trein vertrekt om tien over negen van spoor vijf.", fr:"Cela fait 28,50 euros. Le train part à 9h10 de la voie 5."},
        {qui:"Lotte", txt:"Moet ik overstappen?", fr:"Est-ce que je dois changer de train ?"},
        {qui:"Loket", txt:"Nee, deze trein is rechtstreeks. U bent er om elf uur.", fr:"Non, ce train est direct. Vous y êtes à 11 heures."},
        {qui:"Lotte", txt:"Goedemiddag, ik heb een kamer gereserveerd op naam van Peeters.", fr:"Bonjour, j'ai réservé une chambre au nom de Peeters."},
        {qui:"Receptie", txt:"Een eenpersoonskamer voor één nacht, klopt dat?", fr:"Une chambre simple pour une nuit, c'est bien cela ?"},
        {qui:"Lotte", txt:"Dat klopt. Is het ontbijt inbegrepen?", fr:"C'est exact. Le petit-déjeuner est-il compris ?"},
        {qui:"Receptie", txt:"Ja, van zeven tot tien uur. Uw kamer is nummer tweehonderdvier, op de tweede verdieping.", fr:"Oui, de 7h à 10h. Votre chambre est la 204, au deuxième étage."}
      ] },
    { num:"2", titre:"In het restaurant", perso:"Lotte, Tom (haar vriend), de ober",
      lignes:[
        {qui:"Ober", txt:"Goedenavond, hebt u gereserveerd?", fr:"Bonsoir, avez-vous réservé ?"},
        {qui:"Tom", txt:"Ja, een tafel voor twee personen op naam van Tom.", fr:"Oui, une table pour deux personnes au nom de Tom."},
        {qui:"Ober", txt:"Deze kant op, alstublieft. Wilt u iets drinken?", fr:"Par ici, s'il vous plaît. Voulez-vous boire quelque chose ?"},
        {qui:"Lotte", txt:"Voor mij een glas witte wijn en voor mijn vriend een pils.", fr:"Pour moi un verre de vin blanc et pour mon ami une bière."},
        {qui:"Ober", txt:"En wat wilt u eten? Het dagmenu is stoofvlees met frieten.", fr:"Et que voulez-vous manger ? Le menu du jour, c'est de la carbonade avec des frites."},
        {qui:"Tom", txt:"Ik neem het dagmenu. Ik heb dat nog nooit gegeten.", fr:"Je prends le menu du jour. Je n'ai encore jamais mangé cela."},
        {qui:"Lotte", txt:"Ik ben vegetariër. Hebt u een gerecht zonder vlees?", fr:"Je suis végétarienne. Avez-vous un plat sans viande ?"},
        {qui:"Ober", txt:"Zeker, de groenteschotel is heel lekker.", fr:"Certainement, le plat de légumes est très bon."},
        {qui:"Lotte", txt:"Prima, dat neem ik. Kunnen we ook een kan water krijgen?", fr:"Parfait, je prends cela. Pouvons-nous aussi avoir une carafe d'eau ?"},
        {qui:"Ober", txt:"Natuurlijk, ik breng het meteen. Eet smakelijk!", fr:"Bien sûr, je l'apporte tout de suite. Bon appétit !"}
      ] },
    { num:"3", titre:"Bij de dokter", perso:"Lotte, de assistente, dokter Jansen",
      lignes:[
        {qui:"Assistente", txt:"Goedemorgen, hebt u een afspraak?", fr:"Bonjour, avez-vous un rendez-vous ?"},
        {qui:"Lotte", txt:"Ja, om half elf bij dokter Jansen.", fr:"Oui, à 10h30 chez le docteur Jansen."},
        {qui:"Dokter", txt:"Komt u binnen. Wat scheelt eraan?", fr:"Entrez. Qu'est-ce qui ne va pas ?"},
        {qui:"Lotte", txt:"Ik heb sinds twee dagen keelpijn en ik voel me heel moe.", fr:"J'ai mal à la gorge depuis deux jours et je me sens très fatiguée."},
        {qui:"Dokter", txt:"Hebt u koorts gehad?", fr:"Avez-vous eu de la fièvre ?"},
        {qui:"Lotte", txt:"Ja, gisteren had ik achtendertig graden.", fr:"Oui, hier j'avais 38 degrés."},
        {qui:"Dokter", txt:"Doe uw mond open, alstublieft. Uw keel is rood en ontstoken.", fr:"Ouvrez la bouche, s'il vous plaît. Votre gorge est rouge et enflammée."},
        {qui:"Lotte", txt:"Is het ernstig, dokter?", fr:"Est-ce grave, docteur ?"},
        {qui:"Dokter", txt:"Nee, het is niet ernstig, maar u moet rusten. Ik schrijf een siroop voor.", fr:"Non, ce n'est pas grave, mais vous devez vous reposer. Je prescris un sirop."},
        {qui:"Lotte", txt:"Dank u wel. Ik ga meteen naar de apotheek naast het station.", fr:"Merci beaucoup. Je vais tout de suite à la pharmacie à côté de la gare."}
      ] }
  ],
  types: [
  { id:"vf", nom:"Vrai / Faux", consigne:"Lis les dialogues, puis dis si l'affirmation est vraie (Vrai) ou fausse (Faux).",
    exercices:[
      {type:"vf", q:"Lotte koopt een enkele reis naar Amsterdam.", a:false, exp:"Faux : elle achète <b>een retour</b> (un aller-retour), car elle revient demain soir."},
      {type:"vf", q:"De trein vertrekt van spoor vijf.", a:true, exp:"Vrai : <i>van spoor vijf</i>. Attention : <b>het spoor</b> (mot neutre, pluriel <i>de sporen</i>)."},
      {type:"vf", q:"Lotte moet in Rotterdam overstappen.", a:false, exp:"Faux : <i>deze trein is rechtstreeks</i> = ce train est direct, elle ne change pas."},
      {type:"vf", q:"Het ontbijt in het hotel is inbegrepen.", a:true, exp:"Vrai : la réception répond <i>Ja, van zeven tot tien uur</i>. <b>Het ontbijt</b> est un mot neutre."},
      {type:"vf", q:"Lotte krijgt een kamer op de eerste verdieping.", a:false, exp:"Faux : <i>op de tweede verdieping</i> (2e étage). <b>De verdieping</b> est un mot commun."},
      {type:"vf", q:"Tom heeft een tafel voor twee personen gereserveerd.", a:true, exp:"Vrai : <i>een tafel voor twee personen op naam van Tom</i>. Notez le perfectum <i>heeft gereserveerd</i>."},
      {type:"vf", q:"Tom heeft al vaak stoofvlees gegeten.", a:false, exp:"Faux : il dit <i>Ik heb dat nog nooit gegeten</i> (jamais encore). Participe irrégulier : eten → <b>gegeten</b>."},
      {type:"vf", q:"Lotte bestelt een gerecht zonder vlees.", a:true, exp:"Vrai : elle est <i>vegetariër</i> et prend <b>de groenteschotel</b>."},
      {type:"vf", q:"Lotte heeft al drie weken keelpijn.", a:false, exp:"Faux : <i>sinds twee dagen</i> = depuis deux jours. <b>De keelpijn</b> (mot commun)."},
      {type:"vf", q:"De dokter schrijft een siroop voor.", a:true, exp:"Vrai : <i>Ik schrijf een siroop voor</i> — verbe séparable <b>voorschrijven</b>, la particule part à la fin."}
    ] },
  { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisis la seule bonne réponse d'après les trois dialogues.",
    exercices:[
      {type:"qcm", q:"Hoeveel kost het treinkaartje van Lotte?", opts:["18,50 euro","28,50 euro","38,50 euro","28,15 euro"], a:1, exp:"<i>achtentwintig euro vijftig</i> = 28,50. En néerlandais on dit d'abord l'unité : acht-en-twintig."},
      {type:"qcm", q:"Hoe laat vertrekt de trein?", opts:["negen uur","tien voor negen","tien over negen","half tien"], a:2, exp:"<i>tien over negen</i> = 9h10 (over = après l'heure)."},
      {type:"qcm", q:"Wanneer komt Lotte in Amsterdam aan?", opts:["om tien uur","om elf uur","om twaalf uur","om negen uur"], a:1, exp:"<i>U bent er om elf uur</i>. Le petit mot <b>er</b> remplace ici le lieu."},
      {type:"qcm", q:"Wat voor kamer heeft Lotte gereserveerd?", opts:["een tweepersoonskamer","een eenpersoonskamer","een suite","een kamer met keuken"], a:1, exp:"<i>een eenpersoonskamer voor één nacht</i>. <b>De kamer</b> (mot commun)."},
      {type:"qcm", q:"Wat drinkt Lotte in het restaurant?", opts:["een pils","water met bubbels","een glas witte wijn","koffie"], a:2, exp:"Elle commande <i>een glas witte wijn</i> ; la bière (<i>een pils</i>) est pour Tom."},
      {type:"qcm", q:"Wat is het dagmenu?", opts:["vis met rijst","stoofvlees met frieten","soep met brood","groenteschotel"], a:1, exp:"<i>Het dagmenu is stoofvlees met frieten</i>. <b>Het menu</b> et <b>het vlees</b> sont neutres."},
      {type:"qcm", q:"Waarom neemt Lotte het dagmenu niet?", opts:["Ze houdt niet van frieten.","Ze is vegetariër.","Het is te duur.","Ze heeft geen honger."], a:1, exp:"<i>Ik ben vegetariër</i> : elle demande un plat <i>zonder vlees</i>."},
      {type:"qcm", q:"Hoe laat is de afspraak bij de dokter?", opts:["om tien uur","om half elf","om elf uur","om half tien"], a:1, exp:"<i>half elf</i> = 10h30 : en néerlandais <b>half</b> annonce l'heure suivante !"},
      {type:"qcm", q:"Welke klacht heeft Lotte?", opts:["hoofdpijn","buikpijn","keelpijn","rugpijn"], a:2, exp:"<i>Ik heb keelpijn</i> = j'ai mal à la gorge (de keel = la gorge)."},
      {type:"qcm", q:"Wat moet Lotte vooral doen?", opts:["sporten","rusten","werken","reizen"], a:1, exp:"<i>u moet rusten</i> : après le modal <b>moeten</b>, l'infinitif va à la fin."}
    ] },
  { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase contient une erreur. Écris le mot correct (un seul mot, en néerlandais).",
    exercices:[
      {type:"input", q:"Lotte koopt een enkele reis. → Ze koopt een … .", a:["retour","een retour"], ph:"le mot correct", exp:"<i>Een retour</i> = un aller-retour ; <i>een enkele reis</i> = un aller simple."},
      {type:"input", q:"De trein vertrekt van spoor twee. → van spoor … .", a:["vijf","5"], ph:"le chiffre en toutes lettres", exp:"<i>spoor vijf</i>. <b>Het spoor</b> est neutre."},
      {type:"input", q:"De kamer is op de derde verdieping. → op de … verdieping.", a:["tweede","2de","2e"], ph:"l'ordinal", exp:"Ordinaux : eerste, <b>tweede</b>, derde, vierde."},
      {type:"input", q:"Het ontbijt is van acht tot tien uur. → van … tot tien uur.", a:["zeven","7"], ph:"le chiffre", exp:"<i>van zeven tot tien uur</i> : de 7h à 10h."},
      {type:"input", q:"Tom reserveert een tafel voor drie personen. → voor … personen.", a:["twee","2"], ph:"le chiffre", exp:"<i>een tafel voor twee personen</i>. <b>De tafel</b> est un mot commun."},
      {type:"input", q:"Lotte drinkt rode wijn. → Ze drinkt … wijn.", a:["witte"], ph:"l'adjectif", exp:"<i>witte wijn</i> : adjectif en -e après un nom commun déterminé ; <b>de wijn</b>."},
      {type:"input", q:"Tom heeft stoofvlees al vaak gegeten. → Hij heeft dat nog … gegeten.", a:["nooit"], ph:"un adverbe", exp:"<i>nog nooit</i> = jamais encore. Le participe <b>gegeten</b> reste à la fin."},
      {type:"input", q:"Lotte heeft sinds twee weken keelpijn. → sinds twee … .", a:["dagen","dag"], ph:"le nom", exp:"<i>twee dagen</i>. Pluriel de <b>de dag</b> : dagen."},
      {type:"input", q:"Gisteren had Lotte veertig graden koorts. → … graden.", a:["achtendertig","38"], ph:"le nombre", exp:"38 = <i>achtendertig</i> (unité + en + dizaine)."},
      {type:"input", q:"De dokter schrijft een zalf voor. → Hij schrijft een … voor.", a:["siroop","een siroop"], ph:"le nom", exp:"<i>een siroop</i> = un sirop. <b>De siroop</b> (mot commun)."}
    ] },
  { id:"texte", nom:"Texte + questions", consigne:"Lis le texte, puis réponds. TEXTE : Sanne woont in Gent. Vorig jaar heeft ze een nieuwe baan gevonden in Antwerpen. Nu neemt ze elke ochtend de trein van kwart voor zeven. De reis duurt ongeveer een uur. Ze vindt het niet erg, omdat ze in de trein rustig kan lezen. Op vrijdag werkt ze thuis. Vroeger ging ze met de auto, maar dat was te duur en te druk. Volgend jaar wil ze een fiets kopen voor het laatste stuk.",
    exercices:[
      {type:"qcm", q:"Waar woont Sanne?", opts:["in Antwerpen","in Gent","in Brussel","in Amsterdam"], a:1, exp:"<i>Sanne woont in Gent</i> ; elle <b>travaille</b> à Anvers."},
      {type:"qcm", q:"Wanneer heeft ze een nieuwe baan gevonden?", opts:["vorige week","vorig jaar","volgend jaar","vandaag"], a:1, exp:"<i>Vorig jaar</i> = l'an dernier. Perfectum : <b>heeft gevonden</b> (vinden est irrégulier)."},
      {type:"input", q:"Hoe laat neemt ze de trein? (in letters)", a:["kwart voor zeven","om kwart voor zeven"], ph:"kwart …", exp:"<i>kwart voor zeven</i> = 6h45. <i>kwart over zeven</i> serait 7h15."},
      {type:"vf", q:"De reis duurt ongeveer twee uur.", a:false, exp:"Faux : <i>ongeveer een uur</i> = environ une heure."},
      {type:"qcm", q:"Waarom vindt ze de reis niet erg?", opts:["omdat de trein snel is","omdat ze kan lezen","omdat het gratis is","omdat ze slaapt"], a:1, exp:"<i>omdat ze in de trein rustig kan lezen</i> : après <b>omdat</b>, les verbes vont à la fin."},
      {type:"input", q:"Op welke dag werkt ze thuis?", a:["op vrijdag","vrijdag"], ph:"op …", exp:"<i>Op vrijdag werkt ze thuis</i> : quand la phrase commence par un complément, le verbe reste en 2e position (inversion)."},
      {type:"vf", q:"Vroeger ging Sanne met de auto naar het werk.", a:true, exp:"Vrai. <i>Ging</i> est le prétérit de <b>gaan</b> (gaan – ging – gegaan)."},
      {type:"qcm", q:"Waarom neemt ze de auto niet meer?", opts:["Hij is kapot.","Het was te duur en te druk.","Ze heeft geen rijbewijs.","Het is te ver."], a:1, exp:"<i>dat was te duur en te druk</i> : <b>was</b> est le prétérit de zijn."},
      {type:"input", q:"Wat wil ze volgend jaar kopen?", a:["een fiets","fiets"], ph:"een …", exp:"<i>een fiets</i> = un vélo. <b>De fiets</b> est un mot commun."},
      {type:"qcm", q:"Welke zin staat in het perfectum?", opts:["Sanne woont in Gent.","Ze neemt de trein.","Ze heeft een baan gevonden.","Vroeger ging ze met de auto."], a:2, exp:"Perfectum = hebben/zijn + participe (<b>gevonden</b>) rejeté à la fin. <i>Ging</i> est un prétérit."}
    ] },
  { id:"doc", nom:"Document authentique", consigne:"Étudie le document, puis réponds. VERTREKSTAAT — Station Gent-Sint-Pieters : 09.10 IC Amsterdam CS, spoor 5, rechtstreeks · 09.25 IC Brussel-Zuid, spoor 2, 10 minuten vertraging · 09.48 S Kortrijk, spoor 7, stopt in alle stations. HOTEL DE ZWAAN : kamer vanaf 89 euro · ontbijt 07.00–10.00 · wifi gratis · receptie 24 uur · huisdieren niet toegelaten · uitchecken vóór 11.00.",
    exercices:[
      {type:"qcm", q:"Van welk spoor vertrekt de trein naar Amsterdam?", opts:["spoor 2","spoor 5","spoor 7","spoor 10"], a:1, exp:"Ligne 09.10 : <i>spoor 5</i>. <b>Het spoor</b> est neutre."},
      {type:"vf", q:"De trein naar Brussel heeft vertraging.", a:true, exp:"Vrai : <i>10 minuten vertraging</i>. <b>De vertraging</b> = le retard."},
      {type:"input", q:"Hoe laat vertrekt de trein naar Kortrijk? (cijfers, bv. 09.10)", a:["09.48","9.48","09:48","9:48"], ph:"09.__", exp:"La ligne S de 09.48 dessert toutes les gares (<i>stopt in alle stations</i>)."},
      {type:"qcm", q:"Welke trein stopt in alle stations?", opts:["de IC naar Amsterdam","de IC naar Brussel","de S naar Kortrijk","geen enkele"], a:2, exp:"IC = intercity (rapide), S = omnibus."},
      {type:"input", q:"Wat kost de goedkoopste kamer? (in cijfers, met euro)", a:["89 euro","89","89euro"], ph:"__ euro", exp:"<i>vanaf 89 euro</i> = à partir de 89 euros."},
      {type:"vf", q:"Je mag een hond meenemen naar het hotel.", a:false, exp:"Faux : <i>huisdieren niet toegelaten</i> = animaux non admis."},
      {type:"qcm", q:"Tot hoe laat kun je ontbijten?", opts:["tot 09.00","tot 10.00","tot 11.00","tot 07.00"], a:1, exp:"<i>ontbijt 07.00–10.00</i>."},
      {type:"input", q:"Hoe laat moet je uitchecken?", a:["voor 11.00","vóór 11.00","11.00","om 11.00","voor elf uur"], ph:"vóór __", exp:"<i>uitchecken vóór 11.00</i> — verbe séparable <b>uitchecken</b>."},
      {type:"vf", q:"De wifi in het hotel is gratis.", a:true, exp:"Vrai : <i>wifi gratis</i>."},
      {type:"qcm", q:"De receptie is open …", opts:["alleen 's ochtends","van 7 tot 10 uur","dag en nacht","alleen in het weekend"], a:2, exp:"<i>receptie 24 uur</i> = 24 heures sur 24, donc jour et nuit."}
    ] },
  { id:"syn", nom:"Synonymes", consigne:"Choisis le mot ou l'expression de sens le plus proche.",
    exercices:[
      {type:"qcm", q:"beginnen =", opts:["stoppen","starten","wachten","sluiten"], a:1, exp:"<i>beginnen</i> = <b>starten</b> (commencer)."},
      {type:"qcm", q:"lekker =", opts:["vies","duur","smakelijk","zout"], a:2, exp:"<i>lekker</i> = <b>smakelijk</b> (bon, savoureux)."},
      {type:"qcm", q:"ongeveer =", opts:["precies","circa","nooit","altijd"], a:1, exp:"<i>ongeveer</i> = <b>circa</b> / environ."},
      {type:"qcm", q:"meteen =", opts:["later","direct","gisteren","misschien"], a:1, exp:"<i>meteen</i> = <b>direct</b> (tout de suite)."},
      {type:"qcm", q:"de baan =", opts:["het werk","de reis","de kamer","de rekening"], a:0, exp:"<i>de baan</i> = <b>het werk</b> (l'emploi). Attention aux genres : <b>de</b> baan mais <b>het</b> werk."},
      {type:"qcm", q:"vervelend =", opts:["leuk","naar","gratis","groot"], a:1, exp:"<i>vervelend</i> = <b>naar</b> (désagréable, ennuyeux)."},
      {type:"input", q:"Synonyme de <i>de arts</i> : de d…", a:["dokter","de dokter"], ph:"de d…", exp:"<b>De arts</b> et <b>de dokter</b> sont synonymes (le médecin)."},
      {type:"input", q:"Synonyme de <i>bijna nooit</i> : z…", a:["zelden"], ph:"z…", exp:"<i>zelden</i> = rarement."},
      {type:"input", q:"Synonyme de <i>proberen</i> : p…", a:["pogen","proberen te"], ph:"p…", exp:"<i>pogen</i> est un synonyme plus formel de <b>proberen</b> (essayer)."},
      {type:"qcm", q:"heel (moe) =", opts:["een beetje","erg","niet","bijna"], a:1, exp:"<i>heel moe</i> = <b>erg moe</b> = très fatigué."}
    ] },
  { id:"ant", nom:"Antonymes", consigne:"Choisis (ou écris) le contraire du mot proposé.",
    exercices:[
      {type:"qcm", q:"Contraire de <i>duur</i> :", opts:["goedkoop","rijk","zwaar","mooi"], a:0, exp:"<i>duur</i> (cher) ↔ <b>goedkoop</b> (bon marché)."},
      {type:"qcm", q:"Contraire de <i>vertrekken</i> :", opts:["reizen","aankomen","lopen","stoppen"], a:1, exp:"<i>vertrekken</i> (partir) ↔ <b>aankomen</b> (arriver)."},
      {type:"qcm", q:"Contraire de <i>altijd</i> :", opts:["vaak","nooit","soms","meestal"], a:1, exp:"<i>altijd</i> ↔ <b>nooit</b>."},
      {type:"qcm", q:"Contraire de <i>ziek</i> :", opts:["moe","gezond","koud","oud"], a:1, exp:"<i>ziek</i> (malade) ↔ <b>gezond</b> (en bonne santé)."},
      {type:"qcm", q:"Contraire de <i>vroeg</i> :", opts:["laat","snel","lang","dicht"], a:0, exp:"<i>vroeg</i> (tôt) ↔ <b>laat</b> (tard)."},
      {type:"input", q:"Contraire de <i>open</i> : d…", a:["dicht","gesloten"], ph:"d…", exp:"<i>dicht</i> ou <i>gesloten</i> = fermé."},
      {type:"input", q:"Contraire de <i>moeilijk</i> : m… / g…", a:["makkelijk","gemakkelijk","eenvoudig"], ph:"m…", exp:"<i>makkelijk</i> (= gemakkelijk) : facile."},
      {type:"input", q:"Contraire de <i>de vraag</i> : het a…", a:["antwoord","het antwoord"], ph:"het a…", exp:"<b>De vraag</b> (la question) ↔ <b>het antwoord</b> (la réponse) : attention, l'un est <i>de</i>, l'autre <i>het</i>."},
      {type:"qcm", q:"Contraire de <i>iemand</i> :", opts:["iedereen","niemand","iets","ergens"], a:1, exp:"<i>iemand</i> (quelqu'un) ↔ <b>niemand</b> (personne)."},
      {type:"qcm", q:"Contraire de <i>binnen</i> :", opts:["buiten","boven","onder","achter"], a:0, exp:"<i>binnen</i> (dedans) ↔ <b>buiten</b> (dehors)."}
    ] },
  { id:"motjuste", nom:"Le mot juste", consigne:"Complète la phrase avec le mot qui convient.",
    exercices:[
      {type:"qcm", q:"Ik wil graag een treinkaartje … Amsterdam.", opts:["voor","naar","aan","op"], a:1, exp:"On voyage <b>naar</b> une ville (direction)."},
      {type:"qcm", q:"Het ontbijt is … in de prijs.", opts:["inbegrepen","gereserveerd","betaald","geopend"], a:0, exp:"<i>inbegrepen</i> = compris."},
      {type:"input", q:"Mag ik de … , alstublieft? (au restaurant, on veut payer)", a:["rekening","de rekening"], ph:"de r…", exp:"<b>De rekening</b> = l'addition."},
      {type:"qcm", q:"Ik heb een … bij de dokter om half elf.", opts:["kaartje","afspraak","kamer","recept"], a:1, exp:"<b>De afspraak</b> = le rendez-vous."},
      {type:"qcm", q:"De trein heeft twintig minuten … .", opts:["vertraging","vertrek","reis","spoor"], a:0, exp:"<b>De vertraging</b> = le retard."},

      {type:"input", q:"reizen (voyager) → de r… (le voyage)", a:["reis","de reis"], ph:"de r…", exp:"<b>De reis</b>, pluriel <i>de reizen</i> (le z revient au pluriel)."},
      {type:"qcm", q:"Le nom formé sur <i>vragen</i> est …", opts:["de vraag","het vraagsel","de vrager","het vragen"], a:0, exp:"<b>De vraag</b> (la question), pluriel <i>vragen</i>."},
      {type:"qcm", q:"L'adjectif formé sur <i>de ziekte</i> est …", opts:["ziekelijk","ziek","gezond","zieken"], a:1, exp:"<b>ziek</b> (malade) → <b>de ziekte</b> (la maladie)."},
      {type:"input", q:"koken (cuisiner) → de k… (le cuisinier)", a:["kok","de kok"], ph:"de k…", exp:"<b>De kok</b> = le cuisinier ; <b>de keuken</b> = la cuisine (la pièce)."},

      {type:"input", q:"betalen (payer) → de b… (le paiement)", a:["betaling","de betaling"], ph:"de b…", exp:"Les noms en <b>-ing</b> sont toujours des mots en <i>de</i> : de betaling."},
      {type:"qcm", q:"Famille de <i>de trein</i> :", opts:["het treinkaartje","de treinreis","het treinstation","alle drie"], a:3, exp:"Les trois sont des composés de <i>trein</i> ; le genre suit le dernier élément (het kaartje, de reis, het station)."},
      {type:"input", q:"gezond (sain) → de g… (la santé)", a:["gezondheid","de gezondheid"], ph:"de g…", exp:"Les noms en <b>-heid</b> sont des mots en <i>de</i> ; pluriel en <i>-heden</i>."}

  { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux ressemblances trompeuses avec le français : choisis la bonne traduction ou le bon emploi.",
    exercices:[
      {type:"qcm", q:"<i>Het menu</i> (le dagmenu) betekent in het Frans :", opts:["la carte complète","le menu du jour, le plat proposé","le serveur","la note"], a:1, exp:"<i>Het dagmenu</i> = le menu du jour ; la carte se dit <b>de kaart</b>."},
      {type:"qcm", q:"<i>Eventueel</i> betekent :", opts:["éventuellement","finalement","toujours","immédiatement"], a:0, exp:"Piège classique avec l'anglais <i>eventually</i> : en néerlandais, <b>eventueel</b> = éventuellement."},
      {type:"qcm", q:"<i>Brutaal</i> betekent :", opts:["brutal, violent","insolent, effronté","brut (poids)","rapide"], a:1, exp:"<b>Brutaal</b> = insolent. Brutal se dit <i>ruw</i> ou <i>gewelddadig</i>."},
      {type:"qcm", q:"<i>De trein neemt</i> is fout. Correct is :", opts:["Ik neem de trein.","De trein neemt mij.","Ik pak de trein op.","Ik doe de trein."], a:0, exp:"On dit <b>de trein nemen</b> ou <i>de trein pakken</i>, avec la personne comme sujet."},
      {type:"vf", q:"<i>Ik ben warm</i> is de juiste vertaling van « j'ai chaud ».", a:false, exp:"Faux : on dit <b>Ik heb het warm</b>. <i>Ik ben warm</i> signifierait que votre corps est chaud au toucher."},
      {type:"qcm", q:"« J'ai 20 ans » =", opts:["Ik heb twintig jaar.","Ik ben twintig jaar.","Ik ben twintig jaar oud.","B en C"], a:3, exp:"En néerlandais on utilise <b>zijn</b> : <i>Ik ben twintig (jaar oud)</i>, jamais <i>hebben</i>."},
      {type:"qcm", q:"<i>Slim</i> betekent :", opts:["mince","intelligent","lent","triste"], a:1, exp:"<b>Slim</b> = malin, intelligent (mince = <i>slank</i>)."},
      {type:"qcm", q:"« Je suis d'accord » =", opts:["Ik ben akkoord.","Ik ga akkoord.","Ik heb akkoord.","Ik doe akkoord."], a:1, exp:"On dit <b>Ik ga akkoord</b> ou <i>Ik ben het ermee eens</i>."},
      {type:"vf", q:"<i>Het is koud</i> et <i>Ik heb het koud</i> ont exactement le même sens.", a:false, exp:"Faux : <i>Het is koud</i> = il fait froid (temps) ; <b>Ik heb het koud</b> = j'ai froid (personne)."},
      {type:"qcm", q:"<i>Bellen</i> betekent :", opts:["sonner à la porte uniquement","téléphoner","crier","chanter"], a:1, exp:"<b>Bellen</b> = téléphoner : <i>Ik bel je morgen.</i>"}
    ] },
  { id:"qr", nom:"Question ↔ réponse", consigne:"Associe : quelle réponse correspond à la question ?",
    exercices:[
      {type:"qcm", q:"Waar woon je?", opts:["Om acht uur.","In Gent.","Met de trein.","Omdat ik moe ben."], a:1, exp:"<b>Waar</b> = où → un lieu."},
      {type:"qcm", q:"Hoe laat vertrekt de trein?", opts:["Van spoor vijf.","Om tien over negen.","Naar Amsterdam.","Twee uur."], a:1, exp:"<b>Hoe laat</b> = à quelle heure → <i>om + heure</i>."},
      {type:"qcm", q:"Hoe lang duurt de reis?", opts:["Ongeveer een uur.","Om zes uur.","In de trein.","Met Tom."], a:0, exp:"<b>Hoe lang</b> = combien de temps → une durée."},
      {type:"qcm", q:"Waarom neem je de trein?", opts:["Naar Antwerpen.","Om zeven uur.","Omdat de auto te duur is.","Ja, graag."], a:2, exp:"<b>Waarom</b> appelle <i>omdat</i> + verbe à la FIN de la subordonnée."},
      {type:"qcm", q:"Hebt u gereserveerd?", opts:["Ja, op naam van Tom.","In het restaurant.","Twee personen.","Om acht uur."], a:0, exp:"Question fermée (verbe en tête) → réponse par ja/nee."},
      {type:"qcm", q:"Wat scheelt eraan?", opts:["Om half elf.","Ik heb keelpijn.","Bij dokter Jansen.","Nee, hoor."], a:1, exp:"<i>Wat scheelt eraan?</i> = qu'est-ce qui ne va pas ? → un symptôme."},
      {type:"qcm", q:"Met wie ga je naar het restaurant?", opts:["Met de bus.","Met Tom.","Om acht uur.","In Gent."], a:1, exp:"<b>Met wie</b> = avec qui → une personne ; <i>waarmee/met wat</i> pour une chose."},
      {type:"qcm", q:"Hoeveel kost het kaartje?", opts:["Achtentwintig euro vijftig.","Twee kaartjes.","Spoor vijf.","Een retour."], a:0, exp:"<b>Hoeveel</b> = combien → un prix ou une quantité."},
      {type:"qcm", q:"Wanneer heb je die baan gevonden?", opts:["In Antwerpen.","Vorig jaar.","Met de trein.","Ja, natuurlijk."], a:1, exp:"<b>Wanneer</b> = quand → un moment. Perfectum : <i>heb gevonden</i>."},
      {type:"qcm", q:"Welke kamer heeft mevrouw Peeters?", opts:["Nummer tweehonderdvier.","Ja, één nacht.","Het ontbijt.","Op naam van Peeters."], a:0, exp:"<b>Welke</b> (mot en <i>de</i>) / <b>welk</b> (mot en <i>het</i>) = quel."}
    ] },
  { id:"poserq", nom:"Poser la question", consigne:"Écris le mot interrogatif qui convient (un seul mot).",

      {type:"input", q:"… vertrekt de trein? — Van spoor vijf.", a:["waarvandaan","van waar","waar"], ph:"w…", exp:"On demande le lieu de départ : <b>Van waar</b> / <i>Waarvandaan</i>."},

      {type:"input", q:"… is uw kamernummer? — Tweehonderdvier.", a:["wat","welk"], ph:"w…", exp:"<b>Wat</b> pour demander une information ; <i>welk nummer</i> aussi (het nummer, donc <b>welk</b>)."},
      {type:"input", q:"… bent u vegetariër? — Omdat ik geen dieren wil eten.", a:["waarom"], ph:"w…", exp:"<b>Waarom</b> → réponse en <i>omdat</i> + verbe à la fin."},

      {type:"input", q:"… hebt u al keelpijn? — Sinds twee dagen.", a:["hoe lang","sinds wanneer"], ph:"hoe …", exp:"<b>Hoe lang</b> ou <i>Sinds wanneer</i> pour une durée."},
      {type:"input", q:"… gerecht neemt u? — De groenteschotel.", a:["welk"], ph:"w…", exp:"<b>Het gerecht</b> est neutre → <b>welk</b> gerecht (et <i>welke</i> devant un mot en <i>de</i>)."},
      {type:"input", q:"… komt u aan in Amsterdam? — Om elf uur.", a:["hoe laat","wanneer"], ph:"hoe …", exp:"<b>Hoe laat</b> pour une heure précise ; <i>wanneer</i> est plus général."}
    ] },

      {type:"qcm", q:"— Wat scheelt eraan? — …", opts:["Ik heb sinds twee dagen keelpijn.","Om half elf, graag.","Een retour.","Ja, dat klopt."], a:0, exp:"Le médecin demande le motif de la consultation."},

      {type:"qcm", q:"— Mag ik de rekening, alstublieft? — …", opts:["Natuurlijk, ik breng hem meteen.","Nee, ik heb geen honger.","Op naam van Tom.","Van spoor vijf."], a:0, exp:"<b>De rekening</b> est un mot en <i>de</i>, donc on le reprend par <b>hem</b>."},
      {type:"qcm", q:"— Is het ernstig, dokter? — …", opts:["Nee, maar u moet rusten.","Ja, om half elf.","Nee, ik heb koorts.","Bij de apotheek."], a:0, exp:"Après <b>moeten</b>, l'infinitif <i>rusten</i> va à la fin."},
      {type:"qcm", q:"— Kan ik u helpen? — …", opts:["Ja, ik zoek de apotheek.","Nee, dank u, u ook.","Om tien over negen.","Dat klopt niet."], a:0, exp:"On formule sa demande après cette offre d'aide."}

  { id:"substitution", nom:"Substitution", consigne:"Refais la phrase en remplaçant l'élément indiqué. Écris la phrase complète.",
    exercices:[
      {type:"input", q:"Ik neem de trein. (de bus) →", a:["ik neem de bus","ik neem de bus."], ph:"Ik neem …", exp:"On ne change que le complément : <b>de bus</b> (mot en <i>de</i>)."},
      {type:"input", q:"Hij drinkt een pils. (ik) →", a:["ik drink een pils","ik drink een pils."], ph:"Ik …", exp:"Avec <b>ik</b>, le verbe perd le -t : ik drink."},
      {type:"input", q:"Ik heb keelpijn. (hoofdpijn) →", a:["ik heb hoofdpijn","ik heb hoofdpijn."], ph:"Ik heb …", exp:"<b>De hoofdpijn</b> = le mal de tête (het hoofd = la tête)."},
      {type:"input", q:"Wij gaan naar het restaurant. (het hotel) →", a:["wij gaan naar het hotel","we gaan naar het hotel","wij gaan naar het hotel."], ph:"Wij gaan …", exp:"<b>Het hotel</b> est neutre, comme <i>het restaurant</i>."},
      {type:"input", q:"Zij werkt in Antwerpen. (hij) →", a:["hij werkt in antwerpen","hij werkt in antwerpen."], ph:"Hij …", exp:"3e personne du singulier : radical + <b>-t</b> (hij werkt)."},
      {type:"input", q:"Ik heb de trein genomen. (de bus) →", a:["ik heb de bus genomen","ik heb de bus genomen."], ph:"Ik heb …", exp:"Au perfectum, le participe <b>genomen</b> reste tout à la fin."},
      {type:"input", q:"De kamer is groot. (klein) →", a:["de kamer is klein","de kamer is klein."], ph:"De kamer is …", exp:"Adjectif attribut (après <i>zijn</i>) : jamais de -e."},
      {type:"input", q:"Wij eten om zeven uur. (om acht uur) →", a:["wij eten om acht uur","we eten om acht uur","wij eten om acht uur."], ph:"Wij eten …", exp:"L'indication de temps garde sa place après le verbe."},
      {type:"input", q:"Ik ga met de auto. (met de fiets) →", a:["ik ga met de fiets","ik ga met de fiets."], ph:"Ik ga …", exp:"Moyen de transport : <b>met de/het</b> + moyen."},
      {type:"input", q:"Zij heeft een baan gevonden. (wij) →", a:["wij hebben een baan gevonden","we hebben een baan gevonden","wij hebben een baan gevonden."], ph:"Wij …", exp:"L'auxiliaire s'accorde (<b>hebben</b>), le participe reste invariable et final."}
    ] },
  { id:"conj", nom:"Conjugaison", consigne:"Écris le verbe à la forme demandée (présent, prétérit ou perfectum).",
    exercices:[
      {type:"input", q:"Présent : Hij (werken) … in Antwerpen.", a:["werkt"], ph:"le verbe", exp:"Présent : radical + <b>-t</b> à la 3e personne (ik werk, jij werkt, hij werkt)."},
      {type:"input", q:"Présent : Jij (nemen) … de trein van kwart voor zeven.", a:["neemt"], ph:"le verbe", exp:"<i>Nemen</i> a un radical long : neem + t = <b>neemt</b>."},
      {type:"input", q:"Perfectum : Ik (reserveren) een tafel … . (participe)", a:["gereserveerd","heb gereserveerd"], ph:"le participe", exp:"Verbe régulier en -eren : pas de <i>ge-</i>… si ! <b>gereserveerd</b> (le préfixe ge- s'ajoute car reserveren n'a pas de préfixe inaccentué)."},
      {type:"input", q:"Perfectum : Wij … gisteren naar Gent gegaan. (auxiliaire)", a:["zijn"], ph:"hebben ou zijn ?", exp:"Les verbes de déplacement avec but (<b>gaan</b>, komen, vertrekken) prennent <b>zijn</b>."},
      {type:"input", q:"Perfectum : Zij (eten) heeft nog nooit stoofvlees … .", a:["gegeten"], ph:"le participe", exp:"Irrégulier : eten – at – <b>gegeten</b>. Le participe se rejette à la fin."},
      {type:"input", q:"Prétérit : Vroeger (gaan) … ik met de auto.", a:["ging"], ph:"le verbe", exp:"gaan – <b>ging</b> – gegaan. Après un complément en tête, inversion : <i>ging ik</i>."},
      {type:"input", q:"Prétérit : Gisteren (hebben) … ze koorts.", a:["had"], ph:"le verbe", exp:"hebben – <b>had</b> / hadden – gehad."},
      {type:"input", q:"Prétérit : Het (zijn) … te duur en te druk.", a:["was"], ph:"le verbe", exp:"zijn – <b>was</b> / waren – geweest."},
      {type:"input", q:"Prétérit régulier : Ik (werken) … vroeger in een restaurant.", a:["werkte"], ph:"le verbe", exp:"Radical en consonne sourde (t k f s ch p) → <b>-te</b> : werkte. Sinon <i>-de</i> (woonde)."},
      {type:"input", q:"Perfectum : Hij (bellen) heeft mij gisteren … .", a:["gebeld"], ph:"le participe", exp:"Régulier : ge + radical + d (le radical <i>bel</i> finit par une sonore) → <b>gebeld</b>."}
    ] },

      {type:"input", q:"lezen → ik heb de krant …", a:["gelezen"], ph:"ge…", exp:"lezen – las – <b>gelezen</b>. <b>De krant</b> = le journal."},
      {type:"input", q:"betalen → wij hebben de rekening …", a:["betaald"], ph:"…", exp:"Attention : préfixe inaccentué <b>be-</b> → PAS de <i>ge-</i> : betaald."},
      {type:"input", q:"begrijpen → ik heb het niet …", a:["begrepen"], ph:"…", exp:"Irrégulier + préfixe be- : begrijpen – begreep – <b>begrepen</b> (sans ge-)."}
    ] },
  { id:"interro", nom:"Mots interrogatifs", consigne:"Complète avec le mot interrogatif correct.",
    exercices:[
      {type:"qcm", q:"… is de apotheek? — Naast het station.", opts:["Wanneer","Waar","Wie","Wat"], a:1, exp:"<b>Waar</b> = où (lieu)."},
      {type:"qcm", q:"… komt er vanavond? — Tom en Lotte.", opts:["Wie","Wat","Welke","Hoe"], a:0, exp:"<b>Wie</b> = qui (personnes)."},
      {type:"qcm", q:"… kamer is van u? — De kamer met het balkon.", opts:["Welk","Welke","Wat voor een","Wie"], a:1, exp:"<b>De kamer</b> → <b>welke</b> ; devant un mot en <i>het</i> on écrit <b>welk</b>."},
      {type:"qcm", q:"… gerecht neemt u? — De groenteschotel.", opts:["Welke","Welk","Wie","Waar"], a:1, exp:"<b>Het gerecht</b> est neutre → <b>welk</b>."},
      {type:"qcm", q:"… gaat het met u? — Niet zo goed.", opts:["Wat","Hoe","Waar","Wanneer"], a:1, exp:"<b>Hoe gaat het?</b> = comment allez-vous."},
      {type:"qcm", q:"… mes eet je? (le couteau avec lequel)", opts:["Met welk","Waarmee","Met wie","Allebei mogelijk: A of B"], a:3, exp:"Pour une chose : <b>waarmee</b> ou <i>met welk mes</i> (het mes est neutre)."},
      {type:"qcm", q:"… ben je zo moe? — Omdat ik slecht geslapen heb.", opts:["Waarom","Wanneer","Waar","Hoeveel"], a:0, exp:"<b>Waarom</b> ; la réponse en <i>omdat</i> rejette les verbes à la fin."},
      {type:"qcm", q:"… mensen komen er? — Ongeveer twintig.", opts:["Hoe veel keer","Hoeveel","Hoe lang","Welke"], a:1, exp:"<b>Hoeveel</b> s'écrit en un mot devant un nom."},
      {type:"qcm", q:"… boek is dat? — Van mij.", opts:["Wiens","Wie","Welke","Wat"], a:0, exp:"<b>Wiens</b> = à qui (possession), langue soutenue ; à l'oral : <i>Van wie is dat boek?</i>"},
      {type:"qcm", q:"… soort wijn wilt u? — Een droge witte wijn.", opts:["Welk","Wat voor","Hoe","Waarom"], a:1, exp:"<b>Wat voor (een)</b> = quelle sorte de."}
    ] },
  { id:"prep", nom:"Prépositions", consigne:"Complète avec la préposition qui convient.",
    exercices:[
      {type:"qcm", q:"Ik ga … het station.", opts:["in","naar","op","aan"], a:1, exp:"<b>Naar</b> exprime la direction ; <i>in het station</i> = à l'intérieur."},
      {type:"qcm", q:"De trein vertrekt … spoor vijf.", opts:["in","op","van","aan"], a:2, exp:"On part <b>van</b> une voie ; le train se trouve <i>op spoor vijf</i>."},
      {type:"qcm", q:"Ik heb een afspraak … dokter Jansen.", opts:["bij","aan","met","naar"], a:0, exp:"<b>Bij</b> + personne = chez ; <i>een afspraak met</i> est aussi possible mais bij est standard pour le médecin."},
      {type:"qcm", q:"De apotheek is … het station.", opts:["naast","naar","tot","sinds"], a:0, exp:"<b>Naast</b> = à côté de."},
      {type:"qcm", q:"Ik heb keelpijn … twee dagen.", opts:["voor","sinds","tot","tijdens"], a:1, exp:"<b>Sinds</b> = depuis (point de départ dans le passé)."},
      {type:"qcm", q:"Het ontbijt is … zeven … tien uur.", opts:["van … tot","in … op","om … naar","tussen … en ook"], a:0, exp:"<b>van … tot</b> = de … à (horaires)."},
      {type:"input", q:"De kamer is … de tweede verdieping.", a:["op"], ph:"préposition", exp:"On dit <b>op de … verdieping</b> pour un étage."},
      {type:"input", q:"Wij gaan … de fiets naar het werk.", a:["met"], ph:"préposition", exp:"<b>Met</b> + moyen de transport : met de fiets, met de trein."},
      {type:"qcm", q:"Ik wacht … de bus.", opts:["voor","op","naar","aan"], a:1, exp:"Verbe à préposition fixe : <b>wachten op</b> = attendre."},
      {type:"qcm", q:"Ik denk vaak … mijn vakantie. — Ik denk er vaak … .", opts:["over / eraan","aan / aan","op / erop","van / ervan"], a:1, exp:"<b>denken aan</b> ; avec <i>er</i> on soude : <b>eraan</b>, mais après <i>er … vaak</i> la préposition reste seule à la fin."}
    ] },
  { id:"det", nom:"Articles et démonstratifs", consigne:"Choisis l'article ou le démonstratif correct (de/het, deze/dit, die/dat).",
    exercices:[
      {type:"qcm", q:"… station is groot.", opts:["De","Het","Een de","Dat de"], a:1, exp:"<b>Het station</b> : mot neutre (tous les mots en - station le sont)."},
      {type:"qcm", q:"… kamer is klein.", opts:["De","Het","Dat","Dit"], a:0, exp:"<b>De kamer</b> : mot commun."},
      {type:"qcm", q:"… trein vertrekt om negen uur. (celui-ci)", opts:["Dit","Deze","Dat","Die"], a:1, exp:"<b>De trein</b> → <b>deze</b> (proche) / die (éloigné)."},
      {type:"qcm", q:"… kaartje is te duur. (celui-ci)", opts:["Deze","Dit","Die","Dezelfde"], a:1, exp:"<b>Het kaartje</b> (diminutif en -je = toujours neutre) → <b>dit</b>."},
      {type:"qcm", q:"Alle mots au pluriel prennent …", opts:["het","de","een","dat"], a:1, exp:"Au pluriel, l'article défini est toujours <b>de</b> : de stations, de kamers."},
      {type:"qcm", q:"… meisje eet een broodje.", opts:["De","Het","Deze","Die"], a:1, exp:"<b>Het meisje</b> : diminutif → neutre, même si c'est une personne."},
      {type:"qcm", q:"Ik neem … dagmenu, niet … soep.", opts:["het … de","de … het","het … het","de … de"], a:0, exp:"<b>Het (dag)menu</b> est neutre, <b>de soep</b> est commun."},
      {type:"input", q:"… rekening, alstublieft. (article défini)", a:["de"], ph:"de ou het ?", exp:"<b>De rekening</b> ; les noms en <i>-ing</i> sont toujours des mots en <i>de</i>."},
      {type:"input", q:"… hotel is heel comfortabel. (article défini)", a:["het"], ph:"de ou het ?", exp:"<b>Het hotel</b> est neutre."},
      {type:"qcm", q:"… gerechten zijn vegetarisch. (ces plats-là)", opts:["Dat","Dit","Die","Deze zijn"], a:2, exp:"Au pluriel : <b>deze</b> (proche) ou <b>die</b> (éloigné) — jamais dit/dat."}
    ] },
  { id:"pluriels", nom:"Pluriels", consigne:"Écris le pluriel du nom proposé.",
    exercices:[
      {type:"input", q:"de kamer →", a:["kamers","de kamers"], ph:"…", exp:"Mots de plusieurs syllabes non accentuées sur la finale → <b>-s</b> : kamers."},
      {type:"input", q:"de trein →", a:["treinen","de treinen"], ph:"…", exp:"<b>-en</b> : treinen."},
      {type:"input", q:"het station →", a:["stations","de stations"], ph:"…", exp:"Les mots en -ion prennent <b>-s</b> : stations. Article pluriel : <i>de</i>."},
      {type:"input", q:"de dag →", a:["dagen","de dagen"], ph:"…", exp:"Voyelle brève + <b>-en</b> : dagen (le g reste simple, la voyelle s'allonge à l'écrit)."},
      {type:"input", q:"het kaartje →", a:["kaartjes","de kaartjes"], ph:"…", exp:"Tous les diminutifs en <b>-je</b> font <b>-jes</b>."},
      {type:"input", q:"de reis →", a:["reizen","de reizen"], ph:"…", exp:"s → <b>z</b> entre voyelles : reis → reizen."},
      {type:"input", q:"de brief →", a:["brieven","de brieven"], ph:"…", exp:"f → <b>v</b> : brief → brieven."},
      {type:"input", q:"het kind →", a:["kinderen","de kinderen"], ph:"…", exp:"Pluriel irrégulier en <b>-eren</b> : kinderen (comme ei → eieren)."},
      {type:"input", q:"de stad →", a:["steden","de steden"], ph:"…", exp:"Irrégulier avec changement de voyelle : stad → <b>steden</b>."},
      {type:"input", q:"de auto →", a:["auto's","autos","de auto's"], ph:"…", exp:"Après une voyelle simple finale, apostrophe : <b>auto's</b>, foto's, taxi's."}
    ] },
  { id:"adj", nom:"Adjectifs (accord, comparatif)", consigne:"Écris ou choisis la forme correcte de l'adjectif.",
    exercices:[
      {type:"qcm", q:"een … kamer (klein)", opts:["klein","kleine","kleinen","kleiner"], a:1, exp:"Devant un mot en <b>de</b>, l'adjectif prend toujours <b>-e</b>, même avec <i>een</i>."},
      {type:"qcm", q:"een … hotel (mooi)", opts:["mooie","mooi","mooier","mooist"], a:1, exp:"<b>Een + mot en het</b> = PAS de -e : een mooi hotel (mais <i>het mooie hotel</i>)."},
      {type:"qcm", q:"het … station (groot)", opts:["groot","grote","groter","grootste"], a:1, exp:"Avec l'article défini <b>het</b>, l'adjectif prend le -e : het grote station."},
      {type:"input", q:"De kamer is … (klein — adjectif attribut)", a:["klein"], ph:"…", exp:"Après <i>zijn/worden/blijven</i>, l'adjectif est attribut : <b>jamais</b> de -e."},
      {type:"input", q:"Comparatif de <i>duur</i> :", a:["duurder"], ph:"…er", exp:"Comparatif = adjectif + <b>-er</b> : duurder (dan)."},
      {type:"input", q:"Comparatif de <i>groot</i> :", a:["groter"], ph:"…er", exp:"<b>Groter</b> : la voyelle longue s'écrit avec un seul o en syllabe ouverte."},
      {type:"input", q:"Superlatif de <i>goed</i> :", a:["best","het best","de beste","beste"], ph:"…", exp:"Irrégulier : goed – beter – <b>best</b> (het best / de beste)."},
      {type:"qcm", q:"De trein is … dan de auto.", opts:["snel","sneller","snelst","snelle"], a:1, exp:"Comparaison de supériorité : comparatif + <b>dan</b>."},
      {type:"qcm", q:"Dit is de … kamer van het hotel.", opts:["duur","duurder","duurste","duurst"], a:2, exp:"Superlatif épithète : <b>de duurste</b> (toujours avec -e après de/het)."},
      {type:"qcm", q:"Deze wijn is … lekker … die van gisteren.", opts:["zo … als","meer … dan","zo … dan","als … zo"], a:0, exp:"Égalité : <b>even/zo … als</b>."}
    ] },
  { id:"pronoms", nom:"Pronoms compléments", consigne:"Remplace le complément par le pronom qui convient.",
    exercices:[
      {type:"qcm", q:"Ik zie <i>Tom</i>. → Ik zie …", opts:["hij","hem","het","ze"], a:1, exp:"Complément masculin : <b>hem</b> (sujet : hij)."},
      {type:"qcm", q:"Ik bel <i>Lotte</i>. → Ik bel …", opts:["zij","haar","hem","ze"], a:1, exp:"Complément féminin : <b>haar</b>."},
      {type:"qcm", q:"Ik neem <i>de trein</i>. → Ik neem …", opts:["hem","het","haar","die"], a:0, exp:"Un objet en <b>de</b> se reprend par <b>hem</b> ; un objet en <i>het</i> par <b>het</b>."},
      {type:"qcm", q:"Ik lees <i>het boek</i>. → Ik lees …", opts:["hem","het","haar","ze"], a:1, exp:"<b>Het boek</b> est neutre → <b>het</b>."},
      {type:"qcm", q:"Hij helpt <i>ons</i> niet. Le pronom <i>ons</i> correspond au sujet …", opts:["jullie","wij","zij","u"], a:1, exp:"wij → <b>ons</b> (nous, complément)."},
      {type:"qcm", q:"Ik geef het boek … . (à toi)", opts:["jij","jou","jouw","je bent"], a:1, exp:"Complément 2e personne : <b>jou</b> (forme accentuée) ou <i>je</i>."},
      {type:"input", q:"Ik zie <i>de kinderen</i>. → Ik zie … .", a:["ze","hen","hun"], ph:"…", exp:"Pluriel : <b>ze</b> (courant) ou <i>hen</i> (COD soigné)."},
      {type:"input", q:"De ober brengt de rekening naar <i>Tom en mij</i>. → De ober brengt … de rekening.", a:["ons"], ph:"…", exp:"<b>Ons</b> = nous (complément)."},
      {type:"qcm", q:"Ik denk aan <i>mijn vakantie</i>. → Ik denk …", opts:["aan het","eraan","daaraan het","het aan"], a:1, exp:"Pour une CHOSE après préposition : <b>er + préposition</b> = eraan."},
      {type:"qcm", q:"Wacht je op <i>de bus</i>? — Ja, ik wacht …", opts:["op hem","erop","op het","A ou B"], a:3, exp:"Avec un objet, on emploie normalement <b>erop</b> ; <i>op hem</i> reste possible à l'oral pour un objet en <i>de</i>."}
    ] },
  { id:"negation", nom:"Négation", consigne:"Choisis ou écris la négation correcte : niet ou geen ?",
    exercices:[
      {type:"qcm", q:"Ik heb … honger.", opts:["niet","geen","niets","nooit"], a:1, exp:"<b>Geen</b> devant un nom sans article (ou avec <i>een</i>) : geen honger."},
      {type:"qcm", q:"De trein is … rechtstreeks.", opts:["geen","niet","niets","nog"], a:1, exp:"<b>Niet</b> devant un adjectif attribut."},
      {type:"qcm", q:"Ik ken die man … .", opts:["geen","niet","niets","nooit"], a:1, exp:"<b>Niet</b> avec un complément déterminé (die man) ; il se place à la fin."},
      {type:"qcm", q:"Wij hebben … tafel gereserveerd.", opts:["niet","geen","niets","niemand"], a:1, exp:"<i>een tafel</i> → <b>geen tafel</b>."},
      {type:"qcm", q:"Hij komt vandaag … .", opts:["geen","niet","niets","geen een"], a:1, exp:"<b>Niet</b> se place après le complément de temps, en fin de phrase."},
      {type:"input", q:"Ik drink koffie. → négatif : Ik drink … koffie.", a:["geen"], ph:"…", exp:"Nom sans article → <b>geen</b>."},
      {type:"input", q:"Ik ga naar het feest. → négatif : Ik ga … naar het feest.", a:["niet"], ph:"…", exp:"<b>Niet</b> se place devant le groupe prépositionnel."},
      {type:"qcm", q:"Er is … in de kamer. (personne)", opts:["niets","niemand","nergens","nooit"], a:1, exp:"<b>Niemand</b> = personne ; <i>niets</i> = rien ; <i>nergens</i> = nulle part."},
      {type:"qcm", q:"Ik heb dat … gegeten. (jamais encore)", opts:["nog niet nooit","nog nooit","niet nooit","geen nooit"], a:1, exp:"<b>Nog nooit</b> = jamais encore ; le participe reste à la fin."},
      {type:"qcm", q:"Ik heb de rekening … betaald.", opts:["geen","niet","niets","niemand"], a:1, exp:"<b>Niet</b> se place avant le participe rejeté : … niet betaald."}
    ] },
  { id:"ordremots", nom:"Ordre des mots", consigne:"Choisis la phrase correctement construite (place du verbe, ordre temps – manière – lieu).",
    exercices:[
      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["Morgen ik ga naar Gent.","Morgen ga ik naar Gent.","Ik morgen ga naar Gent.","Ga ik morgen naar Gent."], a:1, exp:"Le verbe conjugué reste en <b>2e position</b> : le complément en tête provoque l'inversion."},
      {type:"qcm", q:"Ordre temps – manière – lieu :", opts:["Ik ga naar het werk met de trein elke dag.","Ik ga elke dag met de trein naar het werk.","Ik ga met de trein naar het werk elke dag.","Ik elke dag ga naar het werk."], a:1, exp:"Ordre standard : <b>temps (elke dag) – manière (met de trein) – lieu (naar het werk)</b>."},
      {type:"qcm", q:"Subordonnée avec <i>omdat</i> :", opts:["… omdat ik ben moe.","… omdat ik moe ben.","… omdat ben ik moe.","… omdat moe ik ben."], a:1, exp:"Après <b>omdat</b>, tous les verbes vont à la FIN."},
      {type:"qcm", q:"Perfectum correct :", opts:["Ik heb gisteren gegeten stoofvlees.","Ik heb gisteren stoofvlees gegeten.","Ik gegeten heb stoofvlees gisteren.","Ik heb stoofvlees gisteren gegeten niet."], a:1, exp:"Le participe <b>gegeten</b> est rejeté tout à la fin."},
      {type:"qcm", q:"Verbe modal :", opts:["Ik moet naar de apotheek gaan.","Ik moet gaan naar de apotheek.","Ik gaan moet naar de apotheek.","Ik moet naar gaan de apotheek."], a:0, exp:"Après un modal, l'infinitif se place à la <b>fin</b>."},
      {type:"qcm", q:"Verbe séparable :", opts:["Ik overstap in Rotterdam.","Ik stap in Rotterdam over.","Ik stap over in Rotterdam niet.","Over ik stap in Rotterdam."], a:1, exp:"<b>Overstappen</b> est séparable : la particule <i>over</i> part en fin de phrase."},
      {type:"qcm", q:"Subordonnée en tête :", opts:["Als het regent, ik neem de bus.","Als het regent, neem ik de bus.","Als regent het, neem ik de bus.","Als het regent, ik de bus neem."], a:1, exp:"La subordonnée occupe la 1re place → inversion dans la principale : <b>neem ik</b>."},
      {type:"qcm", q:"Question fermée :", opts:["Je hebt gereserveerd?","Hebt u gereserveerd?","U hebt gereserveerd hebben?","Gereserveerd u hebt?"], a:1, exp:"Question sans mot interrogatif : le <b>verbe conjugué en 1re position</b>."},
      {type:"qcm", q:"Place de <i>niet</i> :", opts:["Ik ken niet die man.","Ik ken die man niet.","Ik niet ken die man.","Niet ik ken die man."], a:1, exp:"<b>Niet</b> se place après le complément déterminé."},
      {type:"qcm", q:"Phrase avec <i>dat</i> :", opts:["Ik denk dat hij komt morgen.","Ik denk dat hij morgen komt.","Ik denk dat komt hij morgen.","Ik denk dat morgen hij komt."], a:1, exp:"Après <b>dat</b>, le verbe conjugué va à la fin : <i>… dat hij morgen komt</i>."}
    ] },
  { id:"transfo", nom:"Transformation", consigne:"Transforme la phrase comme demandé et écris la phrase complète.",
    exercices:[
      {type:"input", q:"Au perfectum : Ik neem de trein. →", a:["ik heb de trein genomen","ik heb de trein genomen."], ph:"Ik heb …", exp:"hebben + participe <b>genomen</b> à la fin."},
      {type:"input", q:"Au perfectum : Zij werkt in Antwerpen. →", a:["zij heeft in antwerpen gewerkt","ze heeft in antwerpen gewerkt","zij heeft in antwerpen gewerkt."], ph:"Zij heeft …", exp:"Régulier : ge + werk + t (radical en k, consonne sourde) = <b>gewerkt</b>."},
      {type:"input", q:"Au perfectum : Wij gaan naar Gent. →", a:["wij zijn naar gent gegaan","we zijn naar gent gegaan","wij zijn naar gent gegaan."], ph:"Wij zijn …", exp:"Déplacement avec destination → auxiliaire <b>zijn</b> + gegaan."},
      {type:"input", q:"Au négatif : Ik heb honger. →", a:["ik heb geen honger","ik heb geen honger."], ph:"Ik heb …", exp:"Nom sans article → <b>geen</b>."},
      {type:"input", q:"Au négatif : De trein is rechtstreeks. →", a:["de trein is niet rechtstreeks","de trein is niet rechtstreeks."], ph:"De trein is …", exp:"Adjectif attribut → <b>niet</b>."},
      {type:"input", q:"Au négatif : Ik ken die man. →", a:["ik ken die man niet","ik ken die man niet."], ph:"Ik ken …", exp:"<b>Niet</b> après le complément déterminé."},
      {type:"input", q:"En subordonnée : Ik neem de bus. (… omdat) → Ik ga te voet, omdat …", a:["ik de bus neem","omdat ik de bus neem","ik neem de bus niet"], ph:"ik …", exp:"Après <b>omdat</b>, le verbe conjugué se met à la FIN : <i>omdat ik de bus neem</i>."},
      {type:"input", q:"En subordonnée : Hij komt morgen. (Ik denk dat …) →", a:["ik denk dat hij morgen komt","dat hij morgen komt","ik denk dat hij morgen komt."], ph:"Ik denk dat …", exp:"Après <b>dat</b>, verbe conjugué en dernier."},
      {type:"input", q:"Au prétérit : Ik ben ziek. →", a:["ik was ziek","ik was ziek."], ph:"Ik …", exp:"zijn – <b>was</b> (sg) / waren (pl)."},
      {type:"input", q:"Au futur avec <i>gaan</i> : Ik koop een fiets. →", a:["ik ga een fiets kopen","ik ga een fiets kopen."], ph:"Ik ga …", exp:"<b>gaan</b> + infinitif rejeté à la fin = intention future."}
    ] },

      {type:"input", q:"J'ai réservé une chambre.", a:["ik heb een kamer gereserveerd","ik heb een kamer gereserveerd."], ph:"Ik heb …", exp:"Perfectum : participe <b>gereserveerd</b> tout à la fin."},
      {type:"input", q:"Le petit-déjeuner est-il compris ?", a:["is het ontbijt inbegrepen","is het ontbijt inbegrepen?"], ph:"Is het …", exp:"Question fermée : verbe en 1re position. <b>Het ontbijt</b> est neutre."},
      {type:"input", q:"Nous voudrions une table pour deux personnes.", a:["wij willen graag een tafel voor twee personen","we willen graag een tafel voor twee personen","wij willen graag een tafel voor twee personen."], ph:"Wij willen graag …", exp:"<b>De tafel</b> ; <i>voor twee personen</i>."},
      {type:"input", q:"Je suis végétarien(ne).", a:["ik ben vegetarier","ik ben vegetariër","ik ben vegetarier."], ph:"Ik ben …", exp:"Pas d'article devant une profession ou une catégorie : <i>Ik ben vegetariër</i>."},
      {type:"input", q:"L'addition, s'il vous plaît.", a:["de rekening alstublieft","de rekening, alstublieft","mag ik de rekening alstublieft"], ph:"De rekening …", exp:"<b>De rekening</b> ; <i>alstublieft</i> (vouvoiement) / alsjeblieft (tutoiement)."},
      {type:"input", q:"J'ai mal à la gorge depuis deux jours.", a:["ik heb sinds twee dagen keelpijn","ik heb al twee dagen keelpijn","ik heb sinds twee dagen keelpijn."], ph:"Ik heb …", exp:"<b>keelpijn hebben</b> ; <i>sinds</i> = depuis."},

      {type:"qcm", q:"Dans <i>de dokter</i>, le <b>e</b> de <i>de</i> se prononce …", opts:["[é]","[e] muet, comme le « e » de « petit »","[i]","[a]"], a:1, exp:"L'article <b>de</b> est atone : voyelle schwa."},
