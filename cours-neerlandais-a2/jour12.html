<script>
var DAY = {
  num: 12,
  title: "Les modaux au passé",
  subtitle: "Kon, moest, wilde, mocht : parler de ce qu'on pouvait, devait ou voulait.",
  theory: `
<h3>1. Rappel : les verbes modaux</h3>
<p>Les <strong>verbes modaux</strong> expriment la possibilité, l'obligation, la volonté ou la permission. Au présent tu connais déjà : <code>kunnen</code> (pouvoir), <code>moeten</code> (devoir), <code>willen</code> (vouloir), <code>mogen</code> (avoir la permission).</p>
<h3>2. Leur forme au passé (imparfait)</h3>
<p>Au passé (imparfait, <em>onvoltooid verleden tijd</em>), ces modaux sont irréguliers. Voici les formes à connaître par cœur :</p>
<pre class="pseudo">present   passe (ik/hij)   sens
kunnen -> kon             pouvoir (pouvais/pouvait)
moeten -> moest           devoir (devais/devait)
willen -> wilde / wou     vouloir (voulais/voulait)
mogen  -> mocht           avoir le droit de</pre>
<pre class="pseudo">Ik kon niet komen.        // Je ne pouvais pas venir.
Wij moesten hard werken.  // Nous devions travailler dur.
Zij wilde naar huis.      // Elle voulait rentrer.
Hij mocht niet roken.     // Il n'avait pas le droit de fumer.</pre>
<h3>3. Le pluriel</h3>
<p>Au pluriel on ajoute <code>-en</code> (sauf wilde -> wilden) :</p>
<pre class="pseudo">ik kon      -> wij konden
ik moest    -> wij moesten
ik wilde    -> wij wilden
ik mocht    -> wij mochten</pre>
<h3>4. La place du verbe à l'infinitif</h3>
<p>Comme au présent, l'autre verbe reste à <strong>l'infinitif et part à la fin</strong> de la phrase.</p>
<pre class="pseudo">Ik kon gisteren niet komen.        // komen (infinitif) a la fin
Wij moesten om acht uur beginnen.  // beginnen a la fin</pre>
<div class="warn">Ne confonds pas <code>kon</code> (pouvais) et <code>kan</code> (peux, présent), ni <code>moest</code> (devais) et <code>moet</code> (dois, présent). Une seule lettre change tout le temps de la phrase.</div>
<div class="tip">Astuce mémoire : <strong>kon, moest, wilde, mocht</strong> — quatre formes courtes à répéter comme une liste. Le reste suit la logique du pluriel en -en.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le passé de <code>kunnen</code> (pouvoir) au singulier ?", opts: ["kan", "kon", "kunde", "konde"], a: 1, exp: "kunnen -> kon (ik/hij kon)." },
    { type: "input", q: "« Je ne pouvais pas venir » : Ik ___ niet komen.", a: ["kon"], ph: "modal au passé", exp: "kunnen -> kon." },
    { type: "qcm", q: "Passé de <code>moeten</code> (devoir) au singulier ?", opts: ["moet", "moest", "moette", "moetde"], a: 1, exp: "moeten -> moest." },
    { type: "input", q: "« Elle voulait rentrer » : Zij ___ naar huis. (willen)", a: ["wilde", "wou"], ph: "modal au passé", exp: "willen -> wilde (ou wou)." },
    { type: "vf", q: "Le passé de <code>mogen</code> est « mocht ».", a: true, exp: "mogen -> mocht (avoir le droit de)." },
    { type: "qcm", q: "Quel est le pluriel de « ik kon » ?", opts: ["wij kon", "wij konnen", "wij konden", "wij kunnen"], a: 2, exp: "Pluriel : wij konden (+ -en)." },
    { type: "input", q: "« Nous devions travailler dur » : Wij ___ hard werken. (moeten, pluriel)", a: ["moesten"], ph: "modal passé pluriel", exp: "moeten -> moesten (pluriel)." },
    { type: "qcm", q: "Où se place le verbe à l'infinitif avec un modal ?", opts: ["Juste après le modal", "À la fin de la phrase", "Avant le sujet", "Au début"], a: 1, exp: "L'infinitif (komen, werken) part a la fin." },
    { type: "input", q: "« Il n'avait pas le droit de fumer » : Hij ___ niet roken. (mogen)", a: ["mocht"], ph: "modal au passé", exp: "mogen -> mocht." },
    { type: "vf", q: "« Ik moet » et « Ik moest » ont le même sens.", a: false, exp: "Faux : moet = present (je dois), moest = passe (je devais)." },
    { type: "qcm", q: "Quelle phrase est au passé ?", opts: ["Ik kan komen.", "Ik kon komen.", "Ik moet komen.", "Ik wil komen."], a: 1, exp: "kon = passe de kunnen ; les autres sont au present." },
    { type: "input", q: "« Nous voulions rester » : Wij ___ blijven. (willen, pluriel)", a: ["wilden"], ph: "modal passé pluriel", exp: "willen -> wilden (pluriel)." },
    { type: "qcm", q: "Passé de <code>willen</code> au singulier ?", opts: ["wil", "wilt", "wilde", "willde"], a: 2, exp: "willen -> wilde (ou wou)." },
    { type: "input", q: "« Nous avions le droit de rester plus longtemps » : Wij ___ langer blijven. (mogen, pluriel)", a: ["mochten"], ph: "modal passé pluriel", exp: "mogen -> mochten (pluriel)." },
    { type: "vf", q: "Au pluriel, la plupart des modaux passés ajoutent -en (konden, moesten, mochten).", a: true, exp: "Oui : kon->konden, moest->moesten, mocht->mochten." }
  ],
  final: {
    title: "Exercice final — La journée compliquée",
    intro: `<p>Ben raconte sa mauvaise journée.</p>
<pre class="pseudo">Gisteren kon ik niet slapen. Ik moest om zes uur opstaan. Ik wilde met de trein gaan, maar de trein was er niet. Ik mocht van mijn baas later beginnen. 's Avonds konden wij eindelijk rusten.</pre>
<p>(slapen = dormir, opstaan = se lever, baas = patron, rusten = se reposer)</p>`,
    questions: [
      { type: "input", q: "Complète : Gisteren ___ ik niet slapen. (kunnen, passé)", a: ["kon"], ph: "modal au passé", exp: "kunnen -> kon." },
      { type: "qcm", q: "Que signifie « Ik moest om zes uur opstaan » ?", opts: ["Je veux me lever à 6h", "Je devais me lever à 6h", "Je peux me lever à 6h", "J'avais le droit de me lever à 6h"], a: 1, exp: "moest = devais (moeten au passe)." },
      { type: "input", q: "Complète : Ik ___ met de trein gaan. (willen, passé singulier)", a: ["wilde", "wou"], ph: "modal au passé", exp: "willen -> wilde / wou." },
      { type: "vf", q: "« konden » dans « konden wij rusten » est le pluriel de kon.", a: true, exp: "kon -> konden au pluriel." },
      { type: "qcm", q: "Dans « Ik moest om zes uur opstaan », où est l'infinitif « opstaan » ?", opts: ["Après moest directement", "À la fin de la phrase", "Avant ik", "Au début"], a: 1, exp: "L'infinitif opstaan part a la fin." }
    ],
    solution: `<p>Formes du passé dans le texte : <code>kon</code> (pouvais), <code>moest</code> (devais), <code>wilde</code> (voulais), <code>mocht</code> (avais le droit), <code>konden</code> (pluriel de kon).</p>
<pre class="pseudo">kunnen -> kon / konden
moeten -> moest / moesten
willen -> wilde (wou) / wilden
mogen  -> mocht / mochten
infinitif toujours a la fin (slapen, opstaan, gaan)</pre>
<p>Retiens les quatre formes courtes (kon, moest, wilde, mocht) et n'oublie pas l'infinitif rejeté à la fin.</p>`
  }
};
</script>

    note: "Vérifie que tu utilises bien les formes du passé (moest, kon, wilde) et non celles du présent (moet, kan, wil), et que l'infinitif (werken, komen, gaan) est à la fin." }
  ]
};
