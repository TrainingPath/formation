<script>
var DAY = {
  num: 10,
  title: "L'ordre des mots : temps-manière-lieu",
  subtitle: "TMP : la règle d'or pour ranger les compléments dans une phrase néerlandaise.",
  theory: `
<h3>1. Le grand principe : le verbe en 2e position</h3>
<p>Dans une phrase néerlandaise principale, le <strong>verbe conjugué occupe toujours la deuxième position</strong>. Ce qui vient avant peut être le sujet, mais aussi un complément. Ce qui vient après doit être rangé dans un ordre précis.</p>
<pre class="pseudo">Ik ga vandaag met de trein naar Brussel.
// Je vais aujourd'hui en train a Bruxelles.</pre>
<h3>2. La règle TMP : Temps - Manière - Lieu</h3>
<p>Quand plusieurs compléments se suivent, l'ordre néerlandais est presque toujours : <strong>Temps</strong> (quand ?), puis <strong>Manière</strong> (comment ?), puis <strong>Lieu</strong> (où ?). Retiens le sigle <code>TMP</code>.</p>
<pre class="pseudo">           TEMPS      MANIERE        LIEU
Ik ga      vandaag    met de trein   naar Brussel.
Wij eten   's avonds  samen          in de keuken.
Zij werkt  elke dag   hard           op kantoor.</pre>
<p>En français l'ordre est souvent l'inverse (lieu puis temps). Il faut donc bien renverser sa logique.</p>
<div class="warn">Attention : le français dit « Je vais à Bruxelles en train aujourd'hui » (Lieu-Manière-Temps). Le néerlandais fait l'inverse : <strong>Temps-Manière-Lieu</strong>. Ne calque pas le français !</div>
<h3>3. L'inversion si un complément passe en tête</h3>
<p>Si on met un complément (souvent le temps) en début de phrase, le verbe reste en 2e position et le sujet passe après le verbe.</p>
<pre class="pseudo">Vandaag ga ik met de trein naar Brussel.
// Aujourd'hui je vais en train a Bruxelles.</pre>
<h3>4. Où se met la négation ?</h3>
<p><code>niet</code> se place généralement à la fin, mais avant le complément de lieu quand on veut nier l'ensemble.</p>
<pre class="pseudo">Ik ga vandaag niet naar Brussel.   // Je ne vais pas a Bruxelles aujourd'hui.</pre>
<div class="tip">Mémo : <strong>T - M - P</strong> = Temps, Manière, Place (lieu). Récite-le à chaque fois que tu as plusieurs compléments.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle TMP pour l'ordre des mots ?", opts: ["Temps-Manière-Personne", "Temps-Manière-Place (lieu)", "Total-Moyen-Pluriel", "Temps-Moment-Passé"], a: 1, exp: "TMP = Temps, Maniere, Place (lieu)." },
    { type: "qcm", q: "Dans la phrase principale, le verbe conjugué est en…", opts: ["1re position", "2e position", "dernière position", "position libre"], a: 1, exp: "Regle d'or : verbe conjugue en 2e position." },
    { type: "input", q: "Range dans l'ordre TMP : Ik ga ___ met de trein naar Brussel. (temps = vandaag)", a: ["vandaag"], ph: "temps", exp: "Le temps vient en premier : vandaag met de trein naar Brussel." },
    { type: "vf", q: "L'ordre néerlandais Temps-Manière-Lieu est l'inverse du français.", a: true, exp: "Le francais dit souvent lieu puis temps ; le neerlandais fait l'inverse." },
    { type: "qcm", q: "Quel est le bon ordre ?", opts: ["Ik ga naar Brussel met de trein vandaag.", "Ik ga vandaag met de trein naar Brussel.", "Ik ga met de trein vandaag naar Brussel.", "Ik ga naar Brussel vandaag met de trein."], a: 1, exp: "Temps (vandaag) - Maniere (met de trein) - Lieu (naar Brussel)." },
    { type: "input", q: "Complète (manière) : Wij eten 's avonds ___ in de keuken. (ensemble = samen)", a: ["samen"], ph: "manière", exp: "Ordre TMP : 's avonds (T) samen (M) in de keuken (L)." },
    { type: "qcm", q: "Si « Vandaag » est en tête, quelle phrase est correcte ?", opts: ["Vandaag ik ga naar Brussel.", "Vandaag ga ik naar Brussel.", "Vandaag gaan ik naar Brussel.", "Vandaag ik naar Brussel ga."], a: 1, exp: "Element en tete -> verbe 2e position -> Vandaag ga ik." },
    { type: "input", q: "Complète (lieu) : Zij werkt elke dag hard ___ kantoor. (préposition op)", a: ["op"], ph: "préposition de lieu", exp: "Lieu en dernier : op kantoor." },
    { type: "vf", q: "En néerlandais, le complément de lieu se place avant le complément de temps.", a: false, exp: "Faux : le temps vient AVANT le lieu (TMP)." },
    { type: "qcm", q: "Où se place souvent « niet » dans « Je ne vais pas à Bruxelles » ?", opts: ["Au début", "Avant le complément de lieu", "Entre le sujet et le verbe", "Nulle part"], a: 1, exp: "Ik ga niet naar Brussel : niet avant le lieu." },
    { type: "input", q: "Mets le temps en tête : ___ ga ik met de fiets naar school. (aujourd'hui = vandaag)", a: ["vandaag"], ph: "temps en tête", exp: "Vandaag ga ik... (inversion verbe-sujet)." },
    { type: "qcm", q: "Dans « Zij werkt elke dag hard op kantoor », que représente « hard » ?", opts: ["Le temps", "La manière", "Le lieu", "Le sujet"], a: 1, exp: "hard = comment ? -> maniere." },
    { type: "input", q: "Complète (temps) : Wij gaan ___ samen naar de bioscoop. (ce soir = vanavond)", a: ["vanavond"], ph: "temps", exp: "vanavond (T) samen (M) naar de bioscoop (L)." },
    { type: "vf", q: "Après un complément placé en tête, le sujet passe après le verbe.", a: true, exp: "Inversion : verbe reste 2e, sujet apres." },
    { type: "qcm", q: "Quelle phrase respecte l'ordre TMP ?", opts: ["Hij rijdt in de stad snel morgen.", "Hij rijdt morgen snel in de stad.", "Hij rijdt snel in de stad morgen.", "Hij rijdt in de stad morgen snel."], a: 1, exp: "morgen (T) snel (M) in de stad (L)." }
  ],
  final: {
    title: "Exercice final — Le voyage de Tom",
    intro: `<p>Tom décrit son trajet.</p>
<pre class="pseudo">Ik ga morgen met de trein naar Gent. Daar werk ik elke dag rustig op kantoor. 's Avonds fiets ik samen met een collega naar huis. Vandaag ga ik niet naar het werk.</pre>
<p>(Gent = Gand, rustig = tranquillement, collega = collègue, naar huis = à la maison)</p>`,
    questions: [
      { type: "qcm", q: "Dans « Ik ga morgen met de trein naar Gent », quel est l'ordre ?", opts: ["Lieu-Manière-Temps", "Temps-Manière-Lieu", "Manière-Temps-Lieu", "Lieu-Temps-Manière"], a: 1, exp: "morgen (T) met de trein (M) naar Gent (L)." },
      { type: "input", q: "Complète (manière) : 's Avonds fiets ik ___ met een collega naar huis. (ensemble)", a: ["samen"], ph: "manière", exp: "'s Avonds (T) samen (M) naar huis (L)." },
      { type: "vf", q: "Dans « Daar werk ik elke dag... », le verbe est en 2e position après « Daar ».", a: true, exp: "Daar en tete -> verbe werk en 2e position -> inversion." },
      { type: "qcm", q: "Où est placé « niet » dans « Vandaag ga ik niet naar het werk » ?", opts: ["Avant le verbe", "Avant le complément de lieu", "À la fin absolue", "Après le sujet seul"], a: 1, exp: "niet avant naar het werk (le lieu)." },
      { type: "input", q: "Complète (temps) : Ik ga ___ met de trein naar Gent. (demain)", a: ["morgen"], ph: "temps", exp: "morgen = demain, en premier (TMP)." }
    ],
    solution: `<p>Ordre correct des compléments : <strong>Temps</strong> (morgen, elke dag, 's avonds) puis <strong>Manière</strong> (met de trein, rustig, samen) puis <strong>Lieu</strong> (naar Gent, op kantoor, naar huis).</p>
<pre class="pseudo">TMP : Temps  -  Maniere  -  Lieu
Ik ga  morgen  met de trein  naar Gent.
verbe conjugue toujours en 2e position
complement en tete -> inversion verbe-sujet
niet -> avant le complement de lieu</pre>
<p>Récite « Temps-Manière-Lieu » dès que tu as plusieurs compléments : c'est la clé de l'ordre des mots.</p>`
  }
};
</script>
