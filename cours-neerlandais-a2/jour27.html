<script>
var DAY = {
  num: 27,
  title: "Compréhension : un e-mail, un article court",
  subtitle: "Lire et comprendre un e-mail et un court texte informatif en néerlandais.",
  theory: `
<h3>1. Lire un e-mail en néerlandais</h3>
<p>Un e-mail suit une structure claire : formule d'appel, corps, formule de politesse, signature. Lis d'abord le sujet (onderwerp) pour saisir le thème.</p>
<pre class="pseudo">Beste / Hallo + prénom      formule d'appel
Met vriendelijke groet      formule de politesse (formel)
Groetjes                    salutations (amical)</pre>
<h3>2. Un exemple d'e-mail</h3>
<pre class="pseudo">Onderwerp: Uitnodiging verjaardag

Hallo Tom,

Volgende zaterdag word ik dertig jaar en ik geef een feest.
Het feest begint om acht uur bij mij thuis.
Er komen veel vrienden en we gaan samen eten en dansen.
Kun je iets te drinken meenemen?
Laat me voor donderdag weten of je komt.
Ik hoop je te zien!

Groetjes,
Lisa</pre>
<h3>3. Comprendre un court article</h3>
<p>Dans un article, cherche les mots-clés : qui ? quoi ? où ? quand ? Ne traduis pas chaque mot ; devine le sens grâce au contexte.</p>
<pre class="pseudo">De nieuwe fietsenstalling in het centrum is open.
Er is plaats voor duizend fietsen.
Het parkeren is gratis voor iedereen.</pre>
<h3>4. Mots utiles pour la lecture</h3>
<pre class="pseudo">onderwerp    le sujet        meenemen   apporter
uitnodiging  l'invitation    gratis     gratuit
laten weten  faire savoir    plaats     la place</pre>
<div class="tip">Repère les dates et les heures (« volgende zaterdag », « om acht uur ») : elles répondent souvent aux questions de compréhension.</div>
<div class="warn">« Laat me weten » = « fais-moi savoir » : c'est un impératif poli. Ne le confonds pas avec « laat » (tard), qui a un tout autre sens.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet de l'e-mail de Lisa ?", opts: ["un déménagement", "une invitation d'anniversaire", "une réunion de travail", "des vacances"], a: 1, exp: "Onderwerp: Uitnodiging verjaardag." },
    { type: "input", q: "À quelle heure commence la fête ? « om ___ uur » (huit, en néerlandais)", a: ["acht"], ph: "un mot", exp: "om acht uur = à huit heures." },
    { type: "qcm", q: "Où a lieu la fête ?", opts: ["au restaurant", "chez Lisa", "au parc", "à l'école"], a: 1, exp: "bij mij thuis = chez moi (Lisa)." },
    { type: "vf", q: "Lisa demande à Tom d'apporter quelque chose à boire.", a: true, exp: "Kun je iets te drinken meenemen?" },
    { type: "input", q: "Jusqu'à quand Tom doit-il répondre ? « voor ___ » (jeudi, en néerlandais)", a: ["donderdag"], ph: "un mot", exp: "voor donderdag = avant jeudi." },
    { type: "input", q: "Traduis « invitation » : ___", a: ["uitnodiging"], ph: "un mot", exp: "uitnodiging = invitation." },
    { type: "input", q: "Traduis « faire savoir » (2 mots) : « laten ___ »", a: ["weten"], ph: "un verbe", exp: "laten weten = faire savoir." },
    { type: "vf", q: "« Met vriendelijke groet » est une formule de politesse formelle.", a: true, exp: "C'est l'équivalent de « cordialement »." },
    { type: "qcm", q: "Dans l'article, combien de vélos peut accueillir le nouveau parking ?", opts: ["cent", "cinq cents", "mille", "deux mille"], a: 2, exp: "plaats voor duizend fietsen = mille vélos." },
    { type: "input", q: "Complète : « Het parkeren is ___ voor iedereen. » (gratuit, en néerlandais)", a: ["gratis"], ph: "un mot", exp: "gratis = gratuit." },
    { type: "qcm", q: "« meenemen » signifie…", opts: ["oublier", "apporter", "acheter", "perdre"], a: 1, exp: "meenemen = apporter / emporter." },
    { type: "vf", q: "« Groetjes » est une formule amicale.", a: true, exp: "Groetjes = salutations amicales." },
    { type: "input", q: "Compréhension : quel âge va avoir Lisa ? (nombre)", a: ["30", "dertig"], ph: "nombre", exp: "word ik dertig jaar = j'aurai trente ans." },
    { type: "qcm", q: "Compréhension : que vont faire les invités à la fête ?", opts: ["travailler", "manger et danser", "regarder un film", "dormir"], a: 1, exp: "we gaan samen eten en dansen." },
    { type: "qcm", q: "Compréhension : « Laat me weten of je komt » demande à Tom de…", opts: ["venir sans prévenir", "faire savoir s'il vient", "apporter un cadeau", "arriver tôt"], a: 1, exp: "faire savoir s'il vient." }
  ],
  final: {
    title: "Exercice final — Een e-mail van de school",
    intro: `<p>Lis cet e-mail de l'école, puis réponds :</p>
<pre class="pseudo">Beste ouders,

Volgende week gaat onze klas op schoolreis naar Antwerpen.
We vertrekken maandag om negen uur met de bus.
De kinderen bezoeken het museum en de dierentuin.
Geef uw kind een lunchpakket en goede schoenen mee.
We zijn om vijf uur weer terug op school.

Met vriendelijke groet,
de leerkracht</pre>`,
    questions: [
      { type: "qcm", q: "Où va la classe ?", opts: ["Bruxelles", "Anvers", "Gand", "Amsterdam"], a: 1, exp: "schoolreis naar Antwerpen = voyage scolaire à Anvers." },
      { type: "input", q: "À quelle heure partent-ils ? « om ___ uur » (neuf, en néerlandais)", a: ["negen"], ph: "un mot", exp: "om negen uur = à neuf heures." },
      { type: "qcm", q: "Que visitent les enfants ?", opts: ["le musée et le zoo", "le stade", "le cinéma", "la piscine"], a: 0, exp: "het museum en de dierentuin = le musée et le zoo." },
      { type: "vf", q: "Les parents doivent donner un pique-nique et de bonnes chaussures.", a: true, exp: "een lunchpakket en goede schoenen." },
      { type: "input", q: "À quelle heure reviennent-ils ? « om ___ uur » (cinq, en néerlandais)", a: ["vijf"], ph: "un mot", exp: "om vijf uur weer terug = de retour à cinq heures." }
    ],
    solution: `<p>Traduction : « Chers parents, la semaine prochaine notre classe part en voyage scolaire à Anvers. Nous partons lundi à neuf heures en bus. Les enfants visitent le musée et le zoo. Donnez à votre enfant un pique-nique et de bonnes chaussures. Nous sommes de retour à l'école à cinq heures. Cordialement, l'enseignant. »</p>
<p>Pour bien comprendre un e-mail, repère le destinataire (Beste ouders), l'événement, le lieu, les heures et la consigne (Geef … mee).</p>`
  }
};
