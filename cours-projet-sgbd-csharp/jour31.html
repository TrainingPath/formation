  theory: `
<h3>1. Vue d'ensemble : ce que l'on a construit</h3>
<p>En 31 jours, on a bâti une application de gestion de bibliothèque de bout en bout. Le projet final consiste à <strong>tout assembler</strong> et à vérifier que chaque couche communique proprement avec les autres.</p>
<pre class="pseudo">Base de données  →  library_db (tables, contraintes, trigger, procédure, vue)
Connexion        →  DatabaseConnection (Singleton) + App.config (chaîne de connexion)
Modèle           →  classes modèles (Livre, Auteur, Client…) + Repositories (LivreRepository…)
Contrôleur       →  logique métier, gestion des erreurs (MessageBox), validation
Vue              →  Windows Forms (DataGridView, TextBox, Button, FlowLayoutPanel)</pre>

<h3>2. L'architecture en couches</h3>
<p>Chaque couche ne connaît que sa voisine directe. La Vue parle au Contrôleur ; le Contrôleur parle au Repository ; le Repository parle à la base via le Singleton. Ce <strong>découplage</strong> est ce qui a permis de passer de la console à Windows Forms en ne changeant quasiment que la Vue.</p>
<div class="tip">Le fil conducteur de tout le cours : <em>séparation des responsabilités</em>. Une classe = un rôle. C'est ce qui rend l'application testable, maintenable et évolutive.</div>

<h3>3. Le scénario métier complet</h3>
<p>Un parcours utilisateur type, qui traverse toutes les couches :</p>
<pre class="pseudo">1. Créer un Livre (choisir sa section/collection existantes)   -- CRUD + FK
2. Créer un Auteur                                             -- CRUD
3. Lier livre ↔ auteur avec un pourcentage de commission       -- relation N:M
4. Enregistrer une Vente (dans une transaction)                -- le trigger crée la commission
5. Consulter l'état des commissions                            -- vue v_etat_commissions
6. Régler un auteur                                            -- procédure sp_regler_commissions_auteur</pre>
<div class="warn">Ordre des dépendances : on ne peut vendre un livre qui n'existe pas, ni lier un auteur absent. L'intégrité référentielle (FK) impose cet enchaînement — et la base le fait respecter.</div>

<h3>4. La checklist de qualité</h3>
<ul>
<li><strong>Sécurité</strong> : partout des <code>MySqlCommand</code> paramétrés (anti-injection), identifiants dans <code>App.config</code>.</li>
<li><strong>Robustesse</strong> : le Repository laisse remonter les <code>MySqlException</code>, le Contrôleur affiche des <code>MessageBox</code>, la saisie est validée (regex).</li>
<li><strong>Cohérence</strong> : transactions (<code>MySqlTransaction</code>, Commit/Rollback) pour les opérations multi-étapes ; connexion Singleton non fermée dans les Repository.</li>
<li><strong>Découplage</strong> : aucun SQL dans la Vue ni le Contrôleur ; aucune logique d'affichage dans le Repository.</li>
</ul>

<h3>5. L'énoncé du projet final</h3>
<p>Objectif : livrer une application Windows Forms qui gère <strong>livres</strong>, <strong>auteurs</strong> et <strong>ventes</strong>, et affiche l'<strong>état des commissions</strong>.</p>
<pre class="pseudo">Écrans attendus (un TabControl à 4 onglets) :
  • Onglet Livres   : DataGridView + formulaire (Ajouter / Modifier / Supprimer), validation
  • Onglet Auteurs  : DataGridView + formulaire CRUD
  • Onglet Ventes   : sélection client + livre, bouton « Enregistrer » (transaction)
  • Onglet Commissions : DataGridView (lecture de v_etat_commissions) + bouton « Régler »
Contraintes :
  • MVC + Repository strict (aucun SQL hors Repository)
  • MySqlCommand paramétré partout, CommandType.StoredProcedure pour la procédure
  • Gestion d'erreurs par MessageBox, validation regex des saisies</pre>
<div class="tip">Ce n'est pas un exercice « de plus » : c'est la synthèse de tout le cours. Prends le temps de relire les jours 17 à 30 comme autant de briques à emboîter. Les deux exercices d'écriture ci-dessous te guident sur les deux morceaux les plus intégrateurs : le scénario de vente complet et l'onglet de reporting.</div>`,

      { type: "qcm", q: "L'onglet Commissions est essentiellement…", opts: ["en écriture (CRUD)", "en lecture (vue) + un bouton d'action (procédure)", "sans base", "un simple Label"], a: 1, exp: "Vue = consulter, procédure = agir." },

    ],
    solution: `<pre class="pseudo">// PLAN DE CORRIGÉ — Application bibliothèque complète (C# / WinForms)

// 1. Connexion (déjà en place)
//    DatabaseConnection (Singleton) lit App.config → GetConnection()

// 2. Modèle : une classe modèle + un Repository par table

//    LivreAuteurRepository (N:M), VenteRepository (transaction), CommissionRepository (procédure + vue)

//    Livres / Auteurs / Ventes / Commissions
//    chaque onglet : DataGridView + formulaire (FlowLayoutPanel)

// 5. Scénario de vente (le plus intégrateur)
btnEnregistrerVente.Click += (s, e) =&gt; {
    if (!VenteValide()) return;                         // validation
    try {
        venteRepo.EnregistrerVente(clientId, livreId, prix);   // transaction → trigger → commission
        RafraichirCommissions();                        // relit v_etat_commissions
        MessageBox.Show("Vente enregistrée, commissions calculées.");
    } catch (MySqlException ex) {
        MessageBox.Show("Erreur : " + ex.Message);
    }
};

// 6. Reporting + règlement
//    grilleComm.DataSource = new BindingList&lt;EtatCommission&gt;(commRepo.EtatCommissions());  // vue SQL
//    btnRegler → commRepo.ReglerCommissions(auteurId);        // procédure stockée</pre>
<p>Félicitations : tu as parcouru toute la chaîne, de la table SQL à l'écran Windows Forms. Tu sais désormais concevoir, sécuriser et faire évoluer une vraie application C# connectée à une base de données.</p>`

  { id: "projsgbdcs-j31",

    checklist: ["Récupères-tu le client (SelectedItem) et le livre (DataBoundItem) ?","Valides-tu que client, livre et prix sont renseignés (decimal.TryParse) ?","Appelles-tu venteRepo.EnregistrerVente(...) dans une transaction ?","Rafraîchis-tu l'onglet Commissions et gères-tu MySqlException ?"], title: "Le scénario de vente complet (contrôleur)", level: 3,
    statement: "Écris la méthode EnregistrerVente() du contrôleur WinForms : elle lit le client (ComboBox) et le livre (DataGridView) sélectionnés et le prix saisi, valide que tout est renseigné, appelle venteRepo.EnregistrerVente(clientId, livreId, prix) (dans une transaction, laisse remonter MySqlException), rafraîchit l'onglet Commissions, et affiche une MessageBox de succès ou d'erreur.",

      "Client client = comboClients.SelectedItem as Client; Livre livre = grilleLivres.CurrentRow?.DataBoundItem as Livre;",

    solution: "public void EnregistrerVente() {                        // scenario de vente complet\n    Client client = comboClients.SelectedItem as Client;          // client choisi (ou null)\n    Livre livre = grilleLivres.CurrentRow?.DataBoundItem as Livre; // livre choisi (ou null)\n    if (client == null || livre == null) {              // selections obligatoires\n        MessageBox.Show(\"Choisis un client ET un livre.\", \"Info\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        return;                                         // on arrete l'action\n    }\n    decimal prix;\n    if (!decimal.TryParse(champPrix.Text, out prix)) {  // texte -> decimal, sans planter\n        MessageBox.Show(\"Prix invalide (ex : 18.50).\", \"Erreur\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Error);\n        return;\n    }\n    try {\n        // la methode Repository ouvre une transaction ; le trigger cree les commissions\n        venteRepo.EnregistrerVente(client.ClientId, livre.Id, prix);\n        RafraichirCommissions();                        // relit v_etat_commissions\n        MessageBox.Show(\"Vente enregistree, commissions calculees.\", \"Succes\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Information);\n    } catch (MySqlException ex) {                        // erreur base (FK, transaction...)\n        MessageBox.Show(\"Erreur base : \" + ex.Message, \"Erreur\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n}",
