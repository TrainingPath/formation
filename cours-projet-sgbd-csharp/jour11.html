  theory: `
<h3>1. Créer le projet dans Visual Studio</h3>
<p>On lance <strong>Visual Studio</strong> et on crée un projet. Pour débuter, une <strong>application console</strong> suffit (on passera à Windows Forms plus tard dans le parcours).</p>
<pre class="pseudo">1. Visual Studio -> "Creer un projet"
2. Choisir le modele "Application console" (C#)
3. Nommer le projet, par exemple  BibliothequeApp
4. Choisir le framework (.NET propose par defaut) puis "Creer"</pre>
<div class="tip">Un projet Visual Studio est décrit par un fichier <code>.csproj</code>. Les paquets NuGet installés y sont référencés automatiquement : le projet reste <strong>portable</strong>, comme le chemin relatif d'un driver côté Java.</div>

<h3>2. Installer le provider avec NuGet</h3>
<p>Le provider ne sert à rien tant que le projet ne le référence pas. On l'ajoute avec <strong>NuGet</strong> :</p>
<pre class="pseudo">1. Clic droit sur le projet -> "Gerer les paquets NuGet..."
2. Onglet "Parcourir"
3. Rechercher :  MySqlConnector
4. Selectionner le paquet, puis "Installer" (accepter la licence)
5. NuGet ajoute la reference dans le fichier .csproj</pre>
<p>Ensuite, en haut du fichier, on rend ses classes visibles : <code>using MySqlConnector;</code>.</p>

<h3>3. Pourquoi ne pas coder les identifiants « en dur »</h3>
<p>Écrire la chaîne de connexion (avec l'utilisateur et le mot de passe) directement dans le code C# est une mauvaise pratique : c'est une <strong>faille de sécurité</strong> (les identifiants traînent dans le code) et un cauchemar à maintenir (il faut recompiler pour changer un mot de passe).</p>
<div class="warn">Ne jamais mettre un mot de passe de base de données « en dur » dans le code source. On l'externalise dans un fichier de configuration, tenu hors du code compilé.</div>

<h3>4. Le fichier appsettings.json</h3>
<p>La bonne pratique en .NET est un fichier <strong>appsettings.json</strong> : un fichier texte au format JSON où l'on place les paramètres. On y range la chaîne de connexion à la bibliothèque, dans une section <code>ConnectionStrings</code> :</p>
<pre class="pseudo">// appsettings.json  -- parametres de connexion a library_db
{
  "ConnectionStrings": {
    "LibraryDb": "Server=localhost;Port=3306;Database=library_db;Uid=root;Pwd=motdepasse;"
  }
}</pre>
<p>On ajoute ce fichier au projet (clic droit sur le projet &gt; Ajouter &gt; Nouvel élément &gt; Fichier de configuration JSON), et on le règle pour qu'il soit copié dans le dossier de sortie (propriété « Copier dans le répertoire de sortie »).</p>
<div class="tip">Sous .NET Framework classique, l'équivalent est le fichier <strong>App.config</strong> avec sa section <code>&lt;connectionStrings&gt;</code>, lue par <code>ConfigurationManager</code>. Le principe (externaliser) est le même.</div>

<h3>5. Charger la config une seule fois (constructeur statique)</h3>
<p>Une classe <code>DatabaseConfig</code> lira ce fichier <strong>une seule fois</strong>. On utilise un <strong>constructeur statique</strong> : un bloc exécuté automatiquement la première fois que la classe est utilisée (l'équivalent C# du bloc <code>static</code> de Java).</p>
<pre class="pseudo">using Microsoft.Extensions.Configuration;             // ConfigurationBuilder (paquet NuGet)
public static class DatabaseConfig {                   // classe de configuration
    private static readonly IConfigurationRoot config; // stocke la configuration lue
    static DatabaseConfig() {                           // constructeur statique : execute une seule fois
        config = new ConfigurationBuilder()             // construit la configuration
            .AddJsonFile("appsettings.json")            // lit le fichier JSON
            .Build();                                   // finalise
    }
    public static string ConnectionString =>            // propriete d'acces a la chaine
        config.GetConnectionString("LibraryDb");        // renvoie la chaine "LibraryDb"
}</pre>
<div class="tip">Le constructeur statique s'exécute <strong>une fois</strong> : le fichier disque est lu une seule fois, puis tout vient de la mémoire (rapide et partagé par toute l'application). C'est la base d'un chargement de configuration propre. Demain, on ouvre réellement la connexion.</div>`,
