  title: "Transactions et gestion des erreurs",

  theory: `
<h3>1. Le problème : une opération en deux étapes</h3>
<p>Modifier les auteurs d'un livre se fait souvent en deux temps : <strong>supprimer</strong> les anciennes associations, puis <strong>insérer</strong> les nouvelles. Si le programme s'arrête <em>entre</em> les deux, le livre se retrouve <strong>sans aucun auteur</strong>. Il faut donc que les deux requêtes forment un bloc indivisible.</p>

<h3>2. La transaction et l'ACID</h3>
<p>Une <strong>transaction</strong> est un groupe d'opérations traitées comme une seule : soit toutes réussissent, soit aucune n'est appliquée. Elle respecte les propriétés <strong>ACID</strong> :</p>
<ul>
<li><strong>Atomicité</strong> : « tout ou rien ». On ne veut pas de suppression sans l'ajout qui suit.</li>
<li><strong>Cohérence</strong> : la base passe d'un état valide à un autre, en respectant les contraintes (clés étrangères).</li>
<li><strong>Isolation</strong> : les autres utilisateurs ne voient pas l'état intermédiaire.</li>
<li><strong>Durabilité</strong> : une fois validé (<code>Commit</code>), les données sont sauvées définitivement.</li>
</ul>

<h3>3. En ADO.NET : la classe MySqlTransaction</h3>
<p>En C#, on démarre une transaction avec <code>conn.BeginTransaction()</code>, qui renvoie un objet <strong>MySqlTransaction</strong>. On valide avec <code>tx.Commit()</code> ou on annule avec <code>tx.Rollback()</code>. Point crucial : chaque <code>MySqlCommand</code> participant doit être <strong>rattaché</strong> à la transaction via <code>cmd.Transaction = tx</code>.</p>
<pre class="pseudo">MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
MySqlTransaction tx = c.BeginTransaction();            // début de transaction
try {
    SupprimerAnciensAuteurs(livreId, tx);              // étape 1 : DELETE (rattaché à tx)
    AjouterNouvelAuteur(livreId, auteurId, pct, tx);   // étape 2 : INSERT (rattaché à tx)
    tx.Commit();                                        // les DEUX étapes validées ENSEMBLE
} catch (MySqlException) {
    tx.Rollback();                                      // une erreur : on annule TOUT
    throw;                                              // on propage vers le contrôleur
}</pre>
<div class="warn">Chaque <code>MySqlCommand</code> d'une transaction doit préciser <code>cmd.Transaction = tx</code> (en plus de sa connexion). Sinon la commande s'exécute <em>hors</em> transaction et ne sera pas annulée par un <code>Rollback</code>.</div>

<h3>4. Commit et Rollback</h3>
<ul>
<li><code>tx.Commit()</code> : valide définitivement toutes les opérations depuis le début de la transaction.</li>
<li><code>tx.Rollback()</code> : annule toutes les opérations et ramène la base à son état d'avant la transaction.</li>
</ul>
<div class="tip">Le <code>Rollback()</code> se place dans le <code>catch</code> : dès qu'une requête échoue, on annule le lot entier plutôt que de laisser la base à moitié modifiée. Contrairement au JDBC, il n'y a pas d'« auto-commit » à réactiver : une fois <code>Commit</code> ou <code>Rollback</code> appelé, la transaction est terminée et la connexion repart en mode normal.</div>

<h3>5. Gérer les erreurs : laisser remonter l'exception</h3>
<p>En vue d'une future interface graphique, le Repository ne doit <em>pas</em> avaler les erreurs en silence (pas de <code>catch</code> vide). On préfère qu'il <strong>propage</strong> l'exception avec <code>throw</code> : ainsi le Contrôleur peut décider comment l'afficher (message clair, boîte de dialogue…). En C#, aucune clause <code>throws</code> n'est nécessaire : les exceptions se propagent automatiquement si on ne les capture pas (ou si on les relance).</p>
<pre class="pseudo">public void ModifierAuteurs(int livreId, int auteurId, decimal pct) {
    // le Repository relance l'erreur (throw) : c'est le contrôleur qui décidera de l'affichage
}</pre>
<div class="tip">Une <code>MySqlException</code> fréquente : violer une contrainte (clé étrangère, CHECK). Bien gérée, elle devient un message utile pour l'utilisateur plutôt qu'un plantage.</div>`,

      { type: "qcm", q: "Après les deux requêtes réussies…", opts: ["tx.Rollback()", "tx.Commit()", "rien", "c.Close()"], a: 1, exp: "On valide l'ensemble." },

      { type: "vf", q: "Chaque commande de la transaction précise cmd.Transaction = tx.", a: true, exp: "Indispensable pour être annulée par le Rollback." },
      { type: "vf", q: "Sans transaction, un plantage entre DELETE et INSERT laisse le livre sans auteur.", a: true, exp: "C'est le risque évité." }
    ],
    solution: `<pre class="pseudo">public void ModifierAuteurs(int livreId, int nouvelAuteurId, decimal pct) {
    MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
    MySqlTransaction tx = c.BeginTransaction();         // ouverture de la transaction
    try {
        // étape 1 : DELETE des anciennes associations
        MySqlCommand d = new MySqlCommand("DELETE FROM livre_auteur WHERE livre_id = @id", c);
        d.Transaction = tx;                             // rattachement à la transaction
        d.Parameters.AddWithValue("@id", livreId);
        d.ExecuteNonQuery();
        // étape 2 : INSERT de la nouvelle association
        MySqlCommand i = new MySqlCommand(
            "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) VALUES (@l, @a, @p)", c);
        i.Transaction = tx;                             // rattachement à la transaction
        i.Parameters.AddWithValue("@l", livreId);
        i.Parameters.AddWithValue("@a", nouvelAuteurId);
        i.Parameters.AddWithValue("@p", pct);
        i.ExecuteNonQuery();
        tx.Commit();                                    // tout réussit → on valide le lot
    } catch (MySqlException) {
        tx.Rollback();                                  // une erreur → on annule tout
        throw;                                          // on propage pour l'affichage
    }
}</pre>
<p>Atomicité garantie : le livre n'est jamais laissé sans auteur. Demain : on quitte la console pour Windows Forms.</p>`
  }
