<script>
var DAY = {
  num: 14,
  title: "Requêtes paramétrées : la clé de la sécurité",
  subtitle: "Sécurité, performance, lisibilité : pourquoi la commande paramétrée gagne.",
  theory: `
<h3>1. La différence fondamentale</h3>
<p>Le choix entre une commande <strong>concaténée</strong> et une commande <strong>paramétrée</strong> impacte la sécurité et la performance. Tout se joue au <strong>moment où la requête est analysée</strong> par la base :</p>
<pre class="pseudo">Commande concatenee -- la saisie est collee dans le texte SQL ; code et donnees sont melanges
Commande parametree -- le texte SQL contient des marqueurs (@nom) ; la saisie est envoyee a part</pre>
<p>Avec une <strong>requête paramétrée</strong>, des marqueurs nommés comme <code>@nom</code> tiennent la place des futures valeurs. La base reçoit d'abord le « plan » de la requête, puis les données pour « remplir les trous ». En ADO.NET, on associe chaque marqueur à une valeur avec <code>cmd.Parameters.AddWithValue("@nom", valeur)</code>.</p>
<div class="tip">Détail C# : là où JDBC utilise des points d'interrogation <code>?</code> numérotés, ADO.NET / MySqlConnector utilise des <strong>paramètres nommés</strong> <code>@nom</code>. C'est plus lisible : on nomme chaque valeur.</div>

<h3>2. Sécurité : l'argument numéro un</h3>
<p>C'est l'argument décisif. Avec une commande construite par concaténation, une saisie malveillante peut modifier la structure de la commande :</p>
<pre class="pseudo">// DANGEREUX : concatenation
"SELECT * FROM clients WHERE nom = '" + saisie + "'"
// si saisie = ' OR '1'='1  ->  la condition devient toujours vraie -> injection SQL</pre>
<p>La <strong>commande paramétrée</strong> traite la saisie comme une <strong>valeur littérale</strong>, jamais comme du code. Même si l'utilisateur tape <code>'; DROP TABLE clients; --</code>, le provider l'envoie comme une donnée : ce texte est cherché tel quel comme un nom, il n'est pas exécuté.</p>
<div class="warn">La concaténation garde les apostrophes de l'attaquant et les exécute. Le paramètre les neutralise seul. C'est pourquoi il est <strong>impossible</strong> d'injecter du SQL au travers d'un paramètre <code>@nom</code>.</div>

<h3>3. Performance : préparer une fois</h3>
<p>Si vous insérez 1000 lignes, une commande recompilée à chaque fois fait travailler le serveur 1000 fois. Une commande paramétrée peut être <strong>préparée</strong> (méthode <code>Prepare()</code>) : le plan est réutilisé, et l'on ne change que les valeurs des paramètres à chaque tour de boucle.</p>
<pre class="pseudo">Boucle de 1000 INSERT
  Concatenation (texte different a chaque fois)  -> 1000 analyses   (lent)
  Commande parametree preparee, on change @nom   -> plan reutilise  (rapide)</pre>

<h3>4. Lisibilité : la fin de « l'enfer des guillemets »</h3>
<p>Avec la concaténation et plusieurs variables, le code devient illisible (le fameux « enfer des guillemets »). La commande paramétrée reste propre quel que soit le nombre de paramètres. Et le typage est automatique : on passe des objets C# (int, string, decimal) sans se soucier des <code>' '</code> autour des valeurs.</p>
<pre class="pseudo">// Concatenation : enfer des guillemets
"INSERT INTO clients (nom, email) VALUES ('" + nom + "', '" + email + "')"
// Commande parametree : squelette clair
"INSERT INTO clients (nom, email) VALUES (@nom, @email)"</pre>

<h3>5. Le tableau de synthèse</h3>
<pre class="pseudo">Caracteristique    Concatenation                Commande parametree
Marqueurs          Aucun (collage de texte)     @nom (nommes, propres)
Performance        Analyse a chaque fois        Plan reutilisable (Prepare)
Securite           Vulnerable aux injections    Securise contre les injections
Lisibilite         Illisible avec des variables Tres propre et maintenable</pre>
<div class="tip">Règle à retenir : commande <strong>sans paramètre</strong> uniquement pour des requêtes fixes, sans variable (ex. un SELECT * global). <strong>Requête paramétrée</strong> dès qu'il y a une valeur venant de l'utilisateur : c'est le <strong>standard moderne</strong>. Demain, on l'utilise pour insérer, modifier et supprimer.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'argument numéro un en faveur de la requête paramétrée ?", opts: ["La couleur du code", "La sécurité (anti-injection SQL)", "La taille du fichier", "Le nom des variables"], a: 1, exp: "La commande paramétrée protège contre les injections SQL." },
    { type: "input", q: "Quel préfixe marque un paramètre nommé dans une requête ADO.NET/MySQL ?", a: ["@"], ph: "un caractère", exp: "Le préfixe @ (ex. @nom) marque un paramètre nommé." },
    { type: "qcm", q: "Comment la commande paramétrée traite-t-elle la saisie utilisateur ?", opts: ["Comme du code exécutable", "Comme une valeur littérale (donnée), jamais comme du code", "Elle l'ignore", "Elle la chiffre"], a: 1, exp: "La saisie reste une simple donnée, pas du code." },
    { type: "input", q: "Quelle méthode associe une valeur à un paramètre nommé ?", a: ["addwithvalue", "parameters.addwithvalue", "addwithvalue()"], ph: "méthode", exp: "cmd.Parameters.AddWithValue(\"@nom\", valeur)." },
    { type: "qcm", q: "Pour insérer 1000 lignes, une commande paramétrée préparée…", opts: ["réanalyse 1000 fois", "réutilise le plan et ne change que les valeurs", "n'analyse jamais", "double le temps"], a: 1, exp: "Prepare() puis réutilisation : gain de performance." },
    { type: "vf", q: "Une saisie ' OR '1'='1 dans une commande concaténée peut provoquer une injection.", a: true, exp: "La concaténation mélange code et données." },
    { type: "input", q: "Comment appelle-t-on la difficulté d'écrire des guillemets en concaténant plusieurs variables ?", a: ["enfer des guillemets", "l'enfer des guillemets"], ph: "expression du cours", exp: "L'« enfer des guillemets »." },
    { type: "qcm", q: "Peut-on injecter du SQL à travers un paramètre @nom bien utilisé ?", opts: ["Oui, facilement", "Non, c'est impossible", "Parfois", "Oui, si le paramètre contient une apostrophe"], a: 1, exp: "Le provider envoie le paramètre comme donnée : injection impossible." },
    { type: "vf", q: "La commande paramétrée gère automatiquement le typage (int, string, decimal).", a: true, exp: "On passe des objets C#, sans gérer les ' ' manuellement." },
    { type: "qcm", q: "Quand une commande sans paramètre suffit-elle ?", opts: ["Toujours", "Pour une requête fixe sans variable (ex. SELECT * global)", "Pour toute saisie utilisateur", "Jamais"], a: 1, exp: "Requêtes fixes uniquement." },
    { type: "input", q: "En ADO.NET/MySQL, les paramètres sont-ils positionnels (?) ou nommés ? (un mot)", a: ["nommes", "nommés", "nomme"], ph: "positionnels/nommés", exp: "Nommés : @nom (contrairement aux ? de JDBC)." },
    { type: "vf", q: "La requête paramétrée est le standard moderne dès qu'il y a une valeur utilisateur.", a: true, exp: "Plus sûr, plus propre, plus performant." },
    { type: "qcm", q: "Face à '; DROP TABLE clients; -- passé en paramètre @nom, le résultat est…", opts: ["La table est supprimée", "Le texte est cherché tel quel comme un nom, sans être exécuté", "Une injection réussie", "Un plantage garanti"], a: 1, exp: "Le paramètre est une donnée, pas une commande." },
    { type: "qcm", q: "La commande paramétrée rend le code…", opts: ["plus illisible", "plus propre et maintenable", "impossible à compiler", "plus lent en boucle"], a: 1, exp: "Le squelette avec @nom reste lisible." },
    { type: "vf", q: "Un nom contenant une apostrophe (O'BRIEN) casse une commande concaténée, mais pas une commande paramétrée.", a: true, exp: "L'apostrophe ferme prématurément la chaîne dans la concaténation." }
  ],
  final: {
    title: "Exercice final — Choisir le bon outil",
    intro: `<p>On tranche entre commande concaténée et commande paramétrée selon le cas.</p>`,
    questions: [
      { type: "qcm", q: "SELECT * FROM livres (aucune variable) :", opts: ["commande paramétrée obligatoire", "commande sans paramètre suffit", "impossible", "ni l'un ni l'autre"], a: 1, exp: "Requête fixe : une commande sans paramètre convient." },
      { type: "qcm", q: "SELECT ... WHERE nom = saisie_utilisateur :", opts: ["concaténation", "commande paramétrée avec @nom", "aucun", "un trigger"], a: 1, exp: "Saisie utilisateur = requête paramétrée." },
      { type: "input", q: "Préfixe d'un paramètre nommé :", a: ["@"], ph: "caractère", exp: "@ (ex. @nom)." },
      { type: "vf", q: "La commande paramétrée rend l'injection SQL impossible via ses paramètres.", a: true, exp: "Données envoyées séparément du code." },
      { type: "vf", q: "En boucle d'insertions, une commande paramétrée préparée est plus performante.", a: true, exp: "Plan réutilisé, on ne change que les valeurs." }
    ],
    solution: `<pre class="pseudo">// Requete FIXE, sans variable -> commande sans parametre
using var cmd = new MySqlCommand("SELECT * FROM livres", conn);
using var reader = cmd.ExecuteReader();

// Requete avec une SAISIE utilisateur -> commande parametree
string sql = "SELECT * FROM clients WHERE nom = @nom";  // @nom = parametre nomme
using var cmd2 = new MySqlCommand(sql, conn);
cmd2.Parameters.AddWithValue("@nom", saisieUtilisateur);   // la saisie devient une simple valeur
using var reader2 = cmd2.ExecuteReader();              // execution sure

// Bilan : commande simple pour le fixe ; commande parametree partout ailleurs.</pre>
<p>Le choix est clair. Demain : insérer, modifier et supprimer avec des paramètres.</p>`
  }
};
</script>

var ECRITURE = {

  { id: "projsgbdcs-j14",

    checklist: ["La version sûre utilise-t-elle un paramètre @nom (pas de concaténation) ?","As-tu expliqué la faille de la version dangereuse (' OR '1'='1) ?","AddWithValue transforme-t-il la saisie en simple valeur ?","Une saisie malveillante est-elle cherchée telle quelle, sans injection ?"], title: "Rechercher un client par son nom, en sécurité", level: 3,
    statement: "On veut rechercher un client de la bibliothèque par son nom saisi par l'utilisateur. Écris d'abord la version DANGEREUSE avec une concaténation (en commentaire, explique la faille), puis la version SÛRE avec une commande paramétrée et un paramètre @nom.",
    hints: [
      "La version concaténée colle la saisie dans la chaîne SQL : montre l'attaque ' OR '1'='1.",
      "La version sûre utilise un @nom dans le WHERE.",
      "Lie la valeur avec cmd.Parameters.AddWithValue(\"@nom\", nomSaisi) avant ExecuteReader()."
    ],
    solution: "using MySqlConnector;\n\n// VERSION DANGEREUSE (a ne PAS utiliser) : concatenation\nstring sqlDanger = \"SELECT * FROM clients WHERE nom = '\" + nomSaisi + \"'\";\n// Faille : si nomSaisi = ' OR '1'='1  ->\n//   SELECT * FROM clients WHERE nom = '' OR '1'='1'\n//   La condition est toujours vraie : la base renvoie TOUS les clients (fuite de donnees).\n\n// VERSION SURE : commande parametree avec @nom\nstring sql = \"SELECT * FROM clients WHERE nom = @nom\";       // @nom = parametre nomme\nusing var cmd = new MySqlCommand(sql, conn);                // la commande\ncmd.Parameters.AddWithValue(\"@nom\", nomSaisi);             // la saisie devient une simple valeur\nusing var reader = cmd.ExecuteReader();                     // execution securisee\nwhile (reader.Read()) {                                    // parcourt les resultats\n    Console.WriteLine(reader.GetInt32(\"client_id\") + \" - \" + reader.GetString(\"nom\"));\n}\n// Resultat : meme si nomSaisi = ' OR '1'='1, il est cherche tel quel comme un nom -> aucune injection.",
    note: "La seule différence de code (un @nom et AddWithValue au lieu d'une concaténation) fait toute la différence de sécurité : la commande paramétrée sépare définitivement le code SQL des données. C'est la parade de référence contre les injections vues aux jours 5-6." }
