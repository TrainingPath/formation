  theory: `
<h3>1. Qu'est-ce que le patron MVC ?</h3>
<p><strong>MVC</strong> (Modèle-Vue-Contrôleur) est une <strong>architecture logicielle</strong> qui sépare l'application en trois composants distincts, pour faciliter la maintenance et l'évolution. Chaque partie a un rôle précis et ne déborde pas sur les autres.</p>
<pre class="pseudo">M (Modele)      -- gere les donnees et l'acces SQL a la base (ADO.NET)
V (Vue)         -- gere l'interface : affichage et saisies (Console.WriteLine / Console.ReadLine)
C (Controleur)  -- fait le lien entre la Vue et le Modele</pre>

<h3>2. Le Modèle : l'entité « intelligente »</h3>
<p>Le <strong>Modèle</strong> gère les données et la logique d'accès à la base. Ici, chaque <strong>classe entité</strong> représente une table de <code>library_db</code> : elle porte ses colonnes sous forme de <strong>propriétés</strong> (<code>{ get; set; }</code>) et encapsule ses propres méthodes CRUD. La Vue et le Contrôleur n'écrivent jamais de SQL.</p>
<pre class="pseudo">public class Section {                                 // entite = table sections
    public int SectionId { get; set; }                // colonne section_id
    public string NomSection { get; set; }            // colonne nom_section
    // Methodes CRUD : Creer(), LireTout(), MettreAJour(), Supprimer()
    public bool Creer() {                              // le modele encapsule le SQL
        string sql = "INSERT INTO sections (nom_section) VALUES (@nom)";   // requete parametree
        // ... new MySqlCommand + AddWithValue + ExecuteNonQuery ...
        return true;                                   // succes
    }
}</pre>
<div class="tip">L'entité connaît sa table SQL et utilise la fabrique <code>DatabaseConnection.CreerConnexion()</code> pour parler à MySQL. On déclare connexion, commande et lecteur avec <code>using</code> : tout se ferme automatiquement.</div>

<h3>3. Le Contrôleur : le médiateur</h3>
<p>Le <strong>Contrôleur</strong> ne contient <strong>pas de SQL</strong>. Il reçoit les ordres de la Vue et pilote le Modèle : il crée un objet, lui affecte des valeurs, appelle sa méthode, puis renvoie le résultat (un booléen, une liste) à la Vue.</p>
<pre class="pseudo">public class SectionController {                       // le mediateur
    public bool Ajouter(string nom) {                  // recoit un nom depuis la Vue
        Section s = new Section();                      // cree l'entite
        s.NomSection = nom;                             // affecte la donnee (propriete)
        return s.Creer();                               // demande au Modele d'agir
    }
    public List&lt;Section&gt; GetListe() {                   // renvoie les donnees a la Vue
        return Section.LireTout();                       // delegue la lecture au Modele
    }
}</pre>

<h3>4. La Vue : l'interface console</h3>
<p>La <strong>Vue</strong> gère l'interface. En mode console, elle s'occupe des <code>Console.WriteLine()</code> et des saisies <code>Console.ReadLine()</code>. Elle est « muette » concernant la base : elle ne connaît que le Contrôleur, jamais le SQL.</p>
<pre class="pseudo">public class SectionView {                             // la seule classe avec Console.ReadLine et WriteLine
    private SectionController ctrl = new SectionController();   // elle connait le controleur
    public void MenuAjouter() {
        Console.Write("Nom de la section : ");          // affichage
        string nom = Console.ReadLine();                // lecture (saisie utilisateur)
        if (ctrl.Ajouter(nom)) {                         // appel du controleur
            Console.WriteLine("Section ajoutee.");       // retour a l'utilisateur
        }
    }
}</pre>
<div class="warn">La Vue ne doit jamais écrire de SQL ni ouvrir de connexion. Si l'on passait de la console à une interface graphique (Windows Forms), seule la Vue changerait : c'est tout l'intérêt de MVC.</div>

<h3>5. Le flux de travail</h3>
<p>Une action de l'utilisateur traverse les trois couches, dans un sens puis dans l'autre :</p>
<pre class="pseudo">1. Vue        -- l'utilisateur choisit "Afficher les livres"
2. Controleur -- la Vue appelle GetListeLivres() du controleur
3. Modele     -- le controleur demande a l'entite Livre d'executer SELECT * FROM livres
4. Modele     -- l'entite ouvre une connexion via DatabaseConnection.CreerConnexion()
5. Modele     -- transforme les lignes SQL en objets C#, les renvoie au controleur
6. Controleur -- recoit la liste et demande a la Vue de l'afficher
7. Vue        -- parcourt la liste et affiche les titres</pre>
<div class="tip">Bilan des 16 jours : d'une base de données (library_db) jusqu'à une application C# structurée, sécurisée (validation regex, commandes paramétrées) et bien organisée (MVC). Vous tenez tous les maillons de la chaîne. Bravo !</div>`,

  ],

      { type: "input", q: "Les trois lettres de MVC :", a: ["modele vue controleur", "modèle vue contrôleur", "modele-vue-controleur"], ph: "M V C", exp: "Modèle, Vue, Contrôleur." },
      { type: "qcm", q: "Écrire SELECT * FROM livres est le rôle…", opts: ["de la Vue", "du Modèle", "du Contrôleur", "de la Console"], a: 1, exp: "Le Modèle seul écrit le SQL." },
      { type: "qcm", q: "Afficher un menu et lire un choix :", opts: ["Modèle", "Vue", "Contrôleur", "provider"], a: 1, exp: "La Vue gère l'interface." },
      { type: "vf", q: "Le Contrôleur relie la Vue au Modèle sans écrire de SQL.", a: true, exp: "Il délègue le SQL au Modèle." },
      { type: "vf", q: "MVC facilite le changement d'interface sans toucher au Modèle.", a: true, exp: "Découplage des couches." }
    ],
    solution: `<pre class="pseudo">// MODELE : l'entite Section (connait le SQL de la table sections)
public class Section {
    public int SectionId { get; set; }
    public string NomSection { get; set; }
    public bool Creer() {                              // encapsule l'INSERT
        string sql = "INSERT INTO sections (nom_section) VALUES (@nom)";
        using var conn = DatabaseConnection.CreerConnexion();
        conn.Open();
        using var cmd = new MySqlCommand(sql, conn);
        cmd.Parameters.AddWithValue("@nom", NomSection);
        return cmd.ExecuteNonQuery() == 1;
    }
}
// CONTROLEUR : pilote le Modele, aucun SQL
public class SectionController {
    public bool Ajouter(string nom) {
        Section s = new Section();
        s.NomSection = nom;
        return s.Creer();
    }
}
// VUE : interface console, connait seulement le Controleur
public class SectionView {
    private SectionController ctrl = new SectionController();
    public void Ajouter() {
        Console.Write("Nom : ");
        string nom = Console.ReadLine();
        if (ctrl.Ajouter(nom)) Console.WriteLine("Ajoute !");
    }
}</pre>
<p>Félicitations : de la base library_db à une application C# sécurisée et bien architecturée, vous avez bouclé les 16 premiers jours.</p>`
