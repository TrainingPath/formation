<script>
var DAY = {
  num: 3,
  title: "Créer la base : schéma, contraintes, clés étrangères",
  subtitle: "Écrire le script SQL qui donne vie à library_db.",
  theory: `
<h3>1. Créer la base et la sélectionner</h3>
<p>Un <strong>schéma</strong> est l'ensemble des tables et des règles d'une base. On commence toujours par créer la base puis par la « choisir » avec <code>USE</code>. Ce script SQL s'exécute dans un outil comme <strong>MySQL Workbench</strong>, <strong>HeidiSQL</strong> ou la console <code>mysql</code> — indépendamment de C# :</p>
<pre class="pseudo">DROP DATABASE IF EXISTS library_db;   -- supprime l'ancienne base si elle existe deja
CREATE DATABASE IF NOT EXISTS library_db;   -- cree la base
USE library_db;                       -- toutes les commandes suivantes visent cette base</pre>
<div class="tip"><code>DROP DATABASE IF EXISTS</code> permet de repartir de zéro proprement pendant le développement, sans erreur si la base n'existe pas encore.</div>

<h3>2. CREATE TABLE et les contraintes</h3>
<p>Une <strong>contrainte</strong> est une règle que le SGBD fait respecter automatiquement. Les principales :</p>
<pre class="pseudo">PRIMARY KEY   -- identifiant unique de la ligne
UNIQUE        -- interdit les doublons dans une colonne
NOT NULL      -- valeur obligatoire
CHECK         -- verifie une condition (ex : prix >= 0)
DEFAULT       -- valeur par defaut si rien n'est fourni
FOREIGN KEY   -- lien vers une autre table</pre>
<p>On <strong>nomme</strong> les contraintes avec <code>CONSTRAINT nom ...</code> : les messages d'erreur deviennent lisibles et on peut les modifier plus tard.</p>

<h3>3. Créer les tables « parents » d'abord</h3>
<p>Une clé étrangère ne peut pointer que vers une table qui existe déjà. On crée donc les tables référencées <strong>avant</strong> celles qui les référencent : d'abord <code>sections</code> et <code>editions</code>, puis <code>collections</code>, puis <code>livres</code>.</p>
<pre class="pseudo">CREATE TABLE sections (
    section_id INT AUTO_INCREMENT,                 -- identifiant auto
    nom_section VARCHAR(100) NOT NULL,             -- nom du rayon, obligatoire
    CONSTRAINT pk_sections PRIMARY KEY (section_id),   -- cle primaire nommee
    CONSTRAINT uq_section_nom UNIQUE (nom_section)     -- deux sections ne peuvent avoir le meme nom
);

CREATE TABLE editions (
    edition_id INT AUTO_INCREMENT,                 -- identifiant auto
    nom_editeur VARCHAR(100) NOT NULL,             -- nom de l'editeur, obligatoire
    CONSTRAINT pk_editions PRIMARY KEY (edition_id),
    CONSTRAINT uq_nom_editeur UNIQUE (nom_editeur)
);</pre>

<h3>4. Déclarer une clé étrangère</h3>
<p>La table <code>collections</code> dépend de <code>editions</code>. On y déclare une clé étrangère, avec une <strong>action référentielle</strong> qui dit quoi faire si l'éditeur est supprimé :</p>
<pre class="pseudo">CREATE TABLE collections (
    collection_id INT AUTO_INCREMENT,              -- identifiant auto
    nom_collection VARCHAR(100) NOT NULL,          -- nom de la collection
    edition_id INT NOT NULL,                        -- vers quel editeur (obligatoire)
    CONSTRAINT pk_collections PRIMARY KEY (collection_id),
    CONSTRAINT fk_col_edition FOREIGN KEY (edition_id)
        REFERENCES editions(edition_id) ON DELETE CASCADE   -- si l'editeur part, ses collections partent aussi
);</pre>
<p><code>ON DELETE CASCADE</code> supprime en cascade les collections d'un éditeur effacé. À l'inverse, <code>ON DELETE SET NULL</code> met la clé étrangère à NULL (le livre reste, mais sans section) — c'est le choix retenu pour <code>livres</code>.</p>

<h3>5. La contrainte CHECK</h3>
<p>Une contrainte <strong>CHECK</strong> refuse toute ligne qui viole une condition. Dans <code>livres</code>, on garantit ainsi des données saines :</p>
<pre class="pseudo">CREATE TABLE livres (
    livre_id INT AUTO_INCREMENT,
    titre VARCHAR(255) NOT NULL,
    nb_pages INT,
    prix_unitaire DECIMAL(10, 2) NOT NULL,
    section_id INT,
    collection_id INT,
    CONSTRAINT pk_livres PRIMARY KEY (livre_id),
    CONSTRAINT fk_livres_section FOREIGN KEY (section_id)
        REFERENCES sections(section_id) ON DELETE SET NULL,   -- livre conserve, section a NULL
    CONSTRAINT chk_livre_pages CHECK (nb_pages &gt; 0),          -- le nombre de pages doit etre positif
    CONSTRAINT chk_livre_prix CHECK (prix_unitaire &gt;= 0)      -- le prix ne peut pas etre negatif
);</pre>
<div class="warn">L'ordre de création compte : si vous créez <code>livres</code> avant <code>sections</code>, la clé étrangère échoue car la table cible n'existe pas encore.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle commande sélectionne la base sur laquelle travailler ?", opts: ["OPEN library_db;", "USE library_db;", "SELECT library_db;", "GO library_db;"], a: 1, exp: "USE library_db; rend cette base active pour les commandes suivantes." },
    { type: "input", q: "Quel mot-clé SQL crée une table ? (deux mots)", a: ["create table"], ph: "XXXX XXXX", exp: "CREATE TABLE crée une table." },
    { type: "qcm", q: "Quelle contrainte interdit les doublons dans une colonne ?", opts: ["DEFAULT", "UNIQUE", "CHECK", "NOT NULL"], a: 1, exp: "UNIQUE empêche deux lignes d'avoir la même valeur." },
    { type: "vf", q: "On doit créer les tables référencées avant celles qui les référencent.", a: true, exp: "Une clé étrangère ne peut viser qu'une table déjà existante." },
    { type: "qcm", q: "Que fait ON DELETE CASCADE ?", opts: ["Bloque toute suppression", "Supprime aussi les lignes liées de la table enfant", "Met la clé étrangère à NULL", "Duplique les lignes"], a: 1, exp: "La suppression se propage aux lignes enfants." },
    { type: "input", q: "Quelle contrainte garantit qu'une colonne a une valeur obligatoire ? (deux mots)", a: ["not null"], ph: "XXX XXXX", exp: "NOT NULL rend la valeur obligatoire." },
    { type: "vf", q: "ON DELETE SET NULL met la clé étrangère à NULL au lieu de supprimer la ligne enfant.", a: true, exp: "C'est le choix fait pour livres.section_id." },
    { type: "qcm", q: "À quoi sert la contrainte CHECK (prix_unitaire >= 0) ?", opts: ["Trier les prix", "Refuser tout prix négatif", "Arrondir le prix", "Convertir en euros"], a: 1, exp: "CHECK refuse les lignes qui violent la condition." },
    { type: "input", q: "Quel mot-clé donne une valeur par défaut à une colonne ?", a: ["default"], ph: "MOT_CLE", exp: "DEFAULT fournit une valeur si aucune n'est donnée." },
    { type: "qcm", q: "Pourquoi nommer ses contraintes avec CONSTRAINT nom ?", opts: ["C'est obligatoire", "Pour des messages d'erreur lisibles et pouvoir les modifier", "Pour aller plus vite", "Pour chiffrer les données"], a: 1, exp: "Un nom clair facilite le diagnostic et la maintenance." },
    { type: "vf", q: "DROP DATABASE IF EXISTS échoue si la base n'existe pas.", a: false, exp: "Grâce à IF EXISTS, aucune erreur si la base est absente." },
    { type: "qcm", q: "Le mot-clé pour déclarer un lien vers une autre table :", opts: ["LINK KEY", "FOREIGN KEY", "REFER KEY", "JOIN KEY"], a: 1, exp: "FOREIGN KEY ... REFERENCES ... déclare la clé étrangère." },
    { type: "input", q: "Quel mot-clé numérote automatiquement une colonne entière ?", a: ["auto_increment"], ph: "MOT_CLE", exp: "AUTO_INCREMENT." },
    { type: "qcm", q: "Dans library_db, quelle table faut-il créer AVANT collections ?", opts: ["livres", "ventes", "editions", "commissions_historique"], a: 2, exp: "collections référence editions, donc editions doit exister d'abord." },
    { type: "vf", q: "REFERENCES sections(section_id) indique la colonne cible de la clé étrangère.", a: true, exp: "REFERENCES précise table et colonne pointées." }
  ],
  final: {
    title: "Exercice final — Créer une table avec contraintes",
    intro: `<p>On assemble tout : clé primaire, UNIQUE, NOT NULL et clé étrangère.</p>`,
    questions: [
      { type: "qcm", q: "Pour repartir de zéro proprement, on écrit :", opts: ["DELETE DATABASE", "DROP DATABASE IF EXISTS library_db;", "CLEAR library_db;", "RESET library_db;"], a: 1, exp: "DROP DATABASE IF EXISTS supprime sans erreur." },
      { type: "input", q: "Mot-clé qui rend une colonne unique :", a: ["unique"], ph: "MOT_CLE", exp: "UNIQUE." },
      { type: "vf", q: "CHECK (nb_pages > 0) refuse un livre à 0 page.", a: true, exp: "La condition impose un nombre de pages strictement positif." },
      { type: "qcm", q: "collections.edition_id utilise :", opts: ["ON DELETE CASCADE", "ON DELETE SET NULL", "aucune action", "ON UPDATE only"], a: 0, exp: "CASCADE : supprimer un éditeur supprime ses collections." },
      { type: "vf", q: "On peut nommer une contrainte avec CONSTRAINT nom_contrainte.", a: true, exp: "Nommer facilite lecture des erreurs et modifications." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE clients (
    client_id INT AUTO_INCREMENT,                  -- identifiant auto
    nom VARCHAR(100) NOT NULL,                     -- nom obligatoire
    email VARCHAR(150),                            -- email facultatif
    CONSTRAINT pk_clients PRIMARY KEY (client_id), -- cle primaire nommee
    CONSTRAINT uq_client_email UNIQUE (email)      -- pas deux fois le meme email
);

CREATE TABLE exemplaires (
    exemplaire_id INT AUTO_INCREMENT,
    livre_id INT NOT NULL,                          -- vers quel livre (obligatoire)
    code_inventaire VARCHAR(50) NOT NULL,           -- code unique en rayon
    est_disponible BOOLEAN DEFAULT TRUE,            -- disponible par defaut
    CONSTRAINT pk_exemplaires PRIMARY KEY (exemplaire_id),
    CONSTRAINT uq_code_inventaire UNIQUE (code_inventaire),
    CONSTRAINT fk_exemplaires_livre FOREIGN KEY (livre_id)
        REFERENCES livres(livre_id) ON DELETE CASCADE   -- copies supprimees avec le livre
);</pre>
<p>Le schéma tient debout. Demain : on peuple la base et on vérifie l'intégrité.</p>`
  }
};
</script>
