  subtitle: "Comprendre la couche ADO.NET, le provider et la chaîne de connexion.",
  theory: `
<h3>1. ADO.NET, la couche d'accès standard</h3>
<p><strong>ADO.NET</strong> est l'ensemble de classes de la plateforme .NET qui permet à une application C# de « parler » à une base de données. C'est l'équivalent de JDBC côté Java : une couche standard qui définit <em>comment</em> ouvrir une connexion, exécuter une requête et lire un résultat. Que vous utilisiez MySQL, MariaDB, SQL Server ou PostgreSQL, votre code C# reste presque identique.</p>
<div class="tip">Les briques centrales d'ADO.NET sont des classes abstraites : <code>DbConnection</code> (la connexion), <code>DbCommand</code> (la requête), <code>DbDataReader</code> (le lecteur de résultat). Chaque base fournit sa version concrète de ces classes.</div>

<h3>2. Pourquoi ADO.NET est-il important ?</h3>
<pre class="pseudo">Abstraction     -- pas besoin de savoir comment MySQL gere ses fichiers reseau
Standardisation -- changer de SGBD = changer le provider et la chaine de connexion, pas tout le code
Fondation       -- meme Entity Framework Core utilise ADO.NET "sous le capot"</pre>
<p>Grâce à cette abstraction, votre logique métier (vendre un livre, calculer une commission) ne dépend pas de la marque du SGBD.</p>

<h3>3. Le provider (fournisseur de données)</h3>
<p>Un <strong>provider</strong> (fournisseur de données) est le composant qui traduit les appels ADO.NET génériques en dialecte propre à un SGBD. C'est l'équivalent du driver JDBC. Pour MySQL/MariaDB, on utilise le provider <strong>MySqlConnector</strong>, qui fournit des classes préfixées <code>MySql</code> :</p>
<pre class="pseudo">ADO.NET (couche generique)  ->  Provider MySqlConnector  ->  MySQL / MariaDB
// Classes fournies par le provider :
MySqlConnection   -- la connexion (herite de DbConnection)
MySqlCommand      -- la requete    (herite de DbCommand)
MySqlDataReader   -- le lecteur    (herite de DbDataReader)</pre>
<div class="warn">Pour SQL Server, on utiliserait le provider <strong>Microsoft.Data.SqlClient</strong> et ses classes <code>SqlConnection</code>, <code>SqlCommand</code>, <code>SqlDataReader</code>. Le principe est identique : seul le préfixe change.</div>

<h3>4. Installer le provider avec NuGet</h3>
<p>Là où Java télécharge un fichier <code>.jar</code>, C# installe un <strong>paquet NuGet</strong>. <strong>NuGet</strong> est le gestionnaire de paquets de .NET : il télécharge la bibliothèque et l'ajoute automatiquement au projet.</p>
<pre class="pseudo">// Dans Visual Studio : clic droit sur le projet -> "Gerer les paquets NuGet"
// Onglet "Parcourir", chercher :  MySqlConnector
// puis cliquer sur "Installer".
//
// Equivalent en ligne de commande (console du gestionnaire de paquets) :
Install-Package MySqlConnector
// ou avec la CLI dotnet :
dotnet add package MySqlConnector</pre>
<p>Une fois installé, on rend ses classes visibles dans le code avec la directive <code>using MySqlConnector;</code> en haut du fichier. On détaillera l'installation demain, sous Visual Studio.</p>

<h3>5. Anatomie d'une chaîne de connexion</h3>
<p>Contrairement à l'URL JDBC, ADO.NET utilise une <strong>chaîne de connexion</strong> (connection string) : une suite de paramètres <code>cle=valeur</code> séparés par des points-virgules.</p>
<pre class="pseudo">// Chaine de connexion vers notre base fil rouge :
Server=localhost;Port=3306;Database=library_db;Uid=root;Pwd=motdepasse;
// Server=localhost  -> serveur (ici la machine locale)
// Port=3306         -> port par defaut de MySQL/MariaDB
// Database=library_db -> nom de la base a ouvrir
// Uid=root          -> utilisateur
// Pwd=motdepasse    -> mot de passe</pre>
<p>Aujourd'hui, on comprend les pièces du puzzle : couche ADO.NET, provider MySqlConnector, paquet NuGet, chaîne de connexion. Demain, on crée concrètement le projet dans Visual Studio et on installe le paquet.</p>`,
