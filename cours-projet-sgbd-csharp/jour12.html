<h3>1. MySqlConnection : l'ouvreur de connexion</h3>
<p><strong>MySqlConnection</strong> (fourni par le provider MySqlConnector) représente une <strong>connexion</strong> vers la base — le « tunnel » ouvert. On la construit avec la chaîne de connexion, puis on l'ouvre avec <code>Open()</code> :</p>
<pre class="pseudo">using MySqlConnector;                                  // MySqlConnection, MySqlException
var conn = new MySqlConnection(                        // on cree l'objet connexion
    "Server=localhost;Port=3306;Database=library_db;Uid=root;Pwd=motdepasse;");
conn.Open();                                           // on ouvre reellement la connexion
Console.WriteLine("Connexion etablie !");             // si on arrive ici, tout va bien
conn.Close();                                          // on referme (voir plus bas : using le fait pour nous)</pre>
<div class="tip"><strong>MySqlConnection</strong> représente une session avec la base. Tout passe par elle : requêtes de lecture, d'écriture, transactions.</div>

<h3>2. Utiliser la config plutôt que des valeurs en dur</h3>
<p>On ne réécrit pas la chaîne partout : on interroge la classe <code>DatabaseConfig</code> d'hier.</p>
<pre class="pseudo">var conn = new MySqlConnection(          // connexion sans identifiants "en dur"
    DatabaseConfig.ConnectionString);    // chaine lue depuis appsettings.json</pre>

<h3>3. Toujours fermer : le bloc using (MySqlException)</h3>
<p>Une connexion non fermée est une ressource gaspillée. En C#, la fermeture automatique se fait avec <strong>using</strong> : à la fin du bloc, <code>Dispose()</code> est appelé (qui ferme la connexion), <strong>même en cas d'erreur</strong>. Comme une connexion peut échouer, on capture <strong>MySqlException</strong> (l'erreur propre au provider).</p>
<pre class="pseudo">try {
    // using : la connexion est fermee automatiquement a la fin du bloc
    using var conn = new MySqlConnection(DatabaseConfig.ConnectionString);
    conn.Open();                                       // ouverture
    Console.WriteLine("Connecte a library_db.");       // travail avec la base ici
}                                                      // ici, Dispose() ferme conn automatiquement
catch (MySqlException e) {                             // en cas d'echec cote base
    Console.WriteLine("Erreur : " + e.Message);        // message d'erreur du provider
}
// pas besoin de conn.Close() : le using s'en charge</pre>
<div class="warn">Le <code>using</code> C# est l'équivalent du <em>try-with-resources</em> de Java : il garantit la libération de la ressource. Réflexe : toute connexion, commande ou lecteur ADO.NET se déclare avec <code>using</code>.</div>

<h3>4. Le pooling : pas besoin de Singleton manuel</h3>
<p>Ouvrir une vraie connexion réseau à chaque opération serait lent. ADO.NET résout cela tout seul grâce au <strong>pool de connexions</strong> (connection pooling) : un réservoir de connexions physiques déjà ouvertes.</p>
<pre class="pseudo">// Open() ne cree pas forcement une connexion reseau :
//   il EMPRUNTE une connexion libre au pool.
// Dispose()/Close() ne detruit pas la connexion physique :
//   il la REND au pool pour la prochaine operation.
// -> ouvrir/fermer souvent est bon marche : on n'a PAS besoin
//    d'un Singleton fait main (contrairement au cours Java).</pre>
<p>On se contente donc d'une petite <strong>fabrique</strong> qui renvoie une nouvelle connexion configurée, à utiliser dans un <code>using</code> :</p>
<pre class="pseudo">public static class DatabaseConnection {               // fabrique de connexions
    public static MySqlConnection CreerConnexion() {   // renvoie une connexion prete (non ouverte)
        return new MySqlConnection(DatabaseConfig.ConnectionString);
    }
}
// Usage : using var conn = DatabaseConnection.CreerConnexion(); conn.Open();</pre>

<h3>5. Ne pas garder une connexion ouverte inutilement</h3>
<p>La bonne pratique ADO.NET est l'inverse de celle de Java : on ouvre la connexion <strong>au dernier moment</strong>, on l'utilise, et on la ferme <strong>vite</strong> (le <code>using</code> le fait). Le pool se charge de la réutiliser efficacement.</p>
<div class="tip">Résumé : en C#, on n'entretient pas une connexion unique ouverte en permanence ; on ouvre/ferme par opération grâce au <code>using</code>, et le pooling rend l'opération rapide. C'est plus simple et plus robuste que le Singleton manuel.</div>`,
