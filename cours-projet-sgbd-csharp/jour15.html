  subtitle: "Les trois étapes d'une commande paramétrée et ExecuteNonQuery.",
  theory: `
<h3>1. Les trois étapes d'une commande paramétrée</h3>
<p>Toute modification de données suit le même rituel en trois temps :</p>
<pre class="pseudo">A. Squelette   -- on ecrit la requete avec des marqueurs @nom
B. Liage       -- on remplit chaque @nom avec cmd.Parameters.AddWithValue("@nom", valeur)
C. Execution   -- on lance ExecuteNonQuery() (ou ExecuteReader pour un SELECT)</pre>
<div class="tip">Le <strong>liage</strong> associe chaque marqueur <code>@nom</code> à une valeur C#. Le nom du paramètre doit correspondre exactement à celui écrit dans le SQL (<code>@nom</code>, <code>@email</code>...).</div>

<h3>2. ExecuteNonQuery pour INSERT, UPDATE, DELETE</h3>
<p>On distingue trois méthodes d'exécution :</p>
<pre class="pseudo">ExecuteReader()   -- pour un SELECT  -> renvoie un MySqlDataReader
ExecuteNonQuery() -- pour INSERT / UPDATE / DELETE -> renvoie un int (nb de lignes affectees)
ExecuteScalar()   -- pour lire UNE seule valeur (ex. un COUNT(*) ou un SUM)</pre>
<p>Le nombre renvoyé par <code>ExecuteNonQuery()</code> permet de vérifier que l'opération a eu lieu : si <code>n == 0</code>, c'est que rien n'a été modifié (par ex. l'identifiant cherché n'existait pas).</p>

<h3>3. Insérer un client (CREATE)</h3>
<pre class="pseudo">string sql = "INSERT INTO clients (nom, email) VALUES (@nom, @email)";   // A. squelette
using var cmd = new MySqlCommand(sql, conn);
cmd.Parameters.AddWithValue("@nom", nom);        // B. liage : @nom recoit le nom
cmd.Parameters.AddWithValue("@email", email);    // B. liage : @email recoit l'email
int n = cmd.ExecuteNonQuery();                    // C. execution ; n = nombre de lignes inserees
Console.WriteLine(n + " client(s) ajoute(s).");  // vaut 1 si succes
// Si le nom est O'BRIEN, aucun probleme : l'apostrophe est geree automatiquement.</pre>

<h3>4. Modifier et supprimer (UPDATE, DELETE)</h3>
<p>Même mécanique. Pour une mise à jour du prix d'un livre :</p>
<pre class="pseudo">string sql = "UPDATE livres SET prix_unitaire = @prix WHERE livre_id = @id";   // 2 parametres
using var cmd = new MySqlCommand(sql, conn);
cmd.Parameters.AddWithValue("@prix", nouveauPrix);   // nouveau prix (decimal)
cmd.Parameters.AddWithValue("@id", idLivre);         // identifiant du livre (int)
int n = cmd.ExecuteNonQuery();                        // nombre de livres modifies
if (n == 0) Console.WriteLine("Aucun livre avec cet id.");   // rien modifie</pre>
<div class="warn">La suppression est sensible : une erreur dans une commande concaténée (ex. <code>1 OR 1=1</code>) pourrait vider toute la table. Le paramètre empêche cela : il reste une simple valeur.</div>
<pre class="pseudo">string sql = "DELETE FROM clients WHERE client_id = @id";   // suppression ciblee
using var cmd = new MySqlCommand(sql, conn);
cmd.Parameters.AddWithValue("@id", idClient);       // liage de l'identifiant
int n = cmd.ExecuteNonQuery();                       // n = 1 si un client a ete supprime, 0 sinon</pre>

<h3>5. AddWithValue et le typage</h3>
<p><code>AddWithValue</code> déduit le type du paramètre à partir de la valeur C# passée : un <code>int</code> devient un INT, un <code>string</code> un VARCHAR, un <code>decimal</code> un DECIMAL. Le provider fait la conversion :</p>
<pre class="pseudo">cmd.Parameters.AddWithValue("@id", 3);          // int    -> INT (ex. livre_id)
cmd.Parameters.AddWithValue("@titre", "SQL");   // string -> VARCHAR (ex. titre, email)
cmd.Parameters.AddWithValue("@prix", 29.00m);   // decimal -> DECIMAL (le suffixe m = decimal)
cmd.Parameters.AddWithValue("@dispo", true);    // bool   -> BOOLEAN / TINYINT(1)</pre>
<div class="tip">Récapitulatif ADO.NET : lecture = <code>ExecuteReader()</code> (renvoie un DataReader) ; insertion / mise à jour / suppression = <code>ExecuteNonQuery()</code> (renvoie le nombre de lignes affectées) ; une valeur unique = <code>ExecuteScalar()</code>. Avec ces briques, votre application maîtrise le CRUD complet en toute sécurité.</div>`,

    { type: "qcm", q: "AddWithValue(\"@prix\", 29.00m) : le suffixe m indique…", opts: ["un mètre", "un littéral decimal", "un modulo", "un million"], a: 1, exp: "Le suffixe m marque un littéral decimal en C#." },
    { type: "vf", q: "Une commande paramétrée empêche qu'une saisie 1 OR 1=1 vide toute une table lors d'un DELETE.", a: true, exp: "Le paramètre reste une valeur, pas une condition." },
    { type: "qcm", q: "Dans UPDATE livres SET prix_unitaire = @prix WHERE livre_id = @id, @id correspond à…", opts: ["au prix", "à l'identifiant du livre", "au titre", "à la date"], a: 1, exp: "@id est livre_id (WHERE)." },
    { type: "input", q: "Quel type C# passe-t-on pour un booléen (est_disponible) via AddWithValue ?", a: ["bool", "boolean"], ph: "type C#", exp: "Un bool (true/false) -> BOOLEAN/TINYINT(1)." },
    { type: "vf", q: "AddWithValue déduit le type du paramètre à partir de la valeur C# passée.", a: true, exp: "int -> INT, string -> VARCHAR, decimal -> DECIMAL." },
    { type: "qcm", q: "Pourquoi préférer une commande paramétrée pour un DELETE ?", opts: ["Elle est plus jolie", "Elle évite qu'une saisie détourne la condition et supprime trop", "Elle est obligatoire pour SELECT", "Elle ferme la connexion"], a: 1, exp: "Sécurité : la valeur ne peut pas modifier la structure de la requête." }
  ],
  final: {
    title: "Exercice final — CRUD sécurisé",

    questions: [
      { type: "input", q: "Méthode pour INSERT/UPDATE/DELETE :", a: ["executenonquery", "executenonquery()"], ph: "méthode", exp: "ExecuteNonQuery()." },
      { type: "input", q: "Méthode pour lier un paramètre nommé :", a: ["addwithvalue", "parameters.addwithvalue"], ph: "méthode", exp: "AddWithValue(\"@nom\", ...)." },

      { type: "vf", q: "La commande paramétrée gère l'apostrophe des noms (O'BRIEN) automatiquement.", a: true, exp: "Pas d'enfer des guillemets, pas d'injection." }
    ],
    solution: `<pre class="pseudo">using MySqlConnector;

// INSERT securise d'un client
string sql = "INSERT INTO clients (nom, email) VALUES (@nom, @email)";   // A. squelette
using var cmd = new MySqlCommand(sql, conn);

cmd2.Parameters.AddWithValue("@prix", 19.90m);         // nouveau prix (decimal)
cmd2.Parameters.AddWithValue("@id", 1);                // livre concerne
cmd2.ExecuteNonQuery();</pre>
<p>Le CRUD est complet et sécurisé. Demain : organiser tout ce code avec le patron MVC.</p>`
  }

    ],
    solution: "using System;\nusing MySqlConnector;                                      // MySqlCommand, MySqlException\n\npublic static bool AjouterAuteur(MySqlConnection conn, string nom, string prenom) {\n    string sql = \"INSERT INTO auteurs (nom, prenom) VALUES (@nom, @prenom)\";   // A. squelette\n    try {\n        using var cmd = new MySqlCommand(sql, conn);        // la commande\n        cmd.Parameters.AddWithValue(\"@nom\", nom);           // B. liage : @nom -> nom (VARCHAR)\n        cmd.Parameters.AddWithValue(\"@prenom\", prenom);     // B. liage : @prenom -> prenom (VARCHAR)\n        int n = cmd.ExecuteNonQuery();                      // C. execution ; n = lignes inserees\n        return n == 1;                                     // true si exactement une ligne ajoutee\n    }\n    catch (MySqlException e) {                             // erreur d'insertion\n        Console.WriteLine(\"Erreur : \" + e.Message);\n        return false;\n    }\n}\n// Resultat attendu :\n//   AjouterAuteur(conn, \"Asimov\", \"Isaac\") -> true (une ligne inseree)\n//   Meme un nom comme O'Neil passe sans casser la requete.",
