<h3>1. Le problème des ID « nus »</h3>
<p>Afficher <em>« Section : 1 »</em> n'a aucun sens pour l'utilisateur. On préfère <em>« Section : Informatique »</em>. Or le nom vit dans une <strong>autre table</strong> (<code>sections</code>), reliée à <code>livres</code> par la clé étrangère <code>section_id</code>. La solution : une <strong>jointure</strong> (<code>JOIN</code>) dans le Repository.</p>
<div class="tip">C'est la force du Modèle : masquer la complexité SQL. La Vue appelle une méthode simple et reçoit un objet déjà « augmenté » des libellés.</div>

<h3>2. Enrichir le modèle : propriétés de confort</h3>
<p>On ajoute au modèle <code>Livre</code> des propriétés <code>string</code> pour stocker les noms récupérés par la jointure.</p>
<pre class="pseudo">public class Livre {
    public int Id { get; set; }
    public string Titre { get; set; }
    public decimal Prix { get; set; }
    public int SectionId { get; set; }                  // la FK (technique)
    public string NomSection { get; set; }              // propriété de confort (le libellé)
    public string NomCollection { get; set; }           // idem pour la collection
}</pre>

<h3>3. La jointure dans le Repository : LEFT JOIN</h3>
<p>Une <strong>jointure</strong> combine des lignes de plusieurs tables selon une condition. Deux variantes utiles :</p>
<ul>
<li><strong>INNER JOIN</strong> : n'affiche que les livres qui ont bien une section ET une collection valides (plus rigoureux).</li>
<li><strong>LEFT JOIN</strong> : affiche <em>tous</em> les livres, même « orphelins » (section ou collection nulle). Plus permissif — on le privilégie ici.</li>
</ul>
<pre class="pseudo">public List&lt;Livre&gt; ListeLivreAvecDetails() {            // livres + libellés
    string sql = "SELECT l.*, s.nom_section, c.nom_collection "
               + "FROM livres l "
               + "LEFT JOIN sections s ON l.section_id = s.section_id "        // relie la section
               + "LEFT JOIN collections c ON l.collection_id = c.collection_id"; // relie la collection
    List&lt;Livre&gt; liste = new List&lt;Livre&gt;();
    try {
        MySqlConnection cx = DatabaseConnection.GetInstance().GetConnection();
        MySqlCommand cmd = new MySqlCommand(sql, cx);
        MySqlDataReader rs = cmd.ExecuteReader();
        while (rs.Read()) {
            Livre l = new Livre();
            l.Id = rs.GetInt32("livre_id");
            l.Titre = rs.GetString("titre");
            l.NomSection = rs.GetString("nom_section");       // le libellé, pas l'ID
            liste.Add(l);
        }
        rs.Close();
    } catch (MySqlException) { }
    return liste;
}</pre>

<h3>4. La relation N:M : la table de jointure</h3>
<p>Un livre peut avoir plusieurs auteurs, et un auteur plusieurs livres : c'est une relation <strong>N:M</strong> (plusieurs-à-plusieurs). Elle est portée par la table <code>livre_auteur</code>, dont la <strong>clé primaire composée</strong> est le couple <code>(livre_id, auteur_id)</code>. Cette table porte aussi une donnée propre : <code>pourcentage_commission</code>.</p>
<pre class="pseudo">public bool Lier(int livreId, int auteurId, decimal pct) {   // crée l'association
    string sql = "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) "
               + "VALUES (@livre, @auteur, @pct)";
    // AddWithValue("@livre", livreId); AddWithValue("@auteur", auteurId); AddWithValue("@pct", pct);
}</pre>
<div class="warn">La commission n'appartient ni au livre seul ni à l'auteur seul, mais à leur <em>relation</em> : c'est pourquoi elle est stockée dans la table de jointure (un auteur peut toucher 10 % sur un livre et 15 % sur un autre).</div>

<h3>5. Agréger les auteurs d'un livre</h3>
<p>Pour lister les auteurs d'un livre sans dupliquer son titre, le Repository fait une deuxième lecture et regroupe les noms dans une <code>List&lt;string&gt;</code> à l'intérieur de l'objet <code>Livre</code>. La Vue appelle simplement <code>ListerLivresComplets()</code> : elle ignore qu'une requête supplémentaire a été exécutée.</p>
<div class="tip">Intégrité : grâce à l'<code>INNER JOIN</code> sur les trois tables (livres, auteurs, livre_auteur), on n'affiche que des données cohérentes. Une FK invalide (livre inexistant) est rejetée par la contrainte <code>fk_la_livre</code>.</div>`,

// LivreAuteurRepository : associer un auteur à un livre (N:M)
public bool Lier(int livreId, int auteurId, decimal pct) {
    string sql = "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) VALUES (@livre, @auteur, @pct)";
    try {
        MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
        MySqlCommand p = new MySqlCommand(sql, c);
        p.Parameters.AddWithValue("@livre", livreId);
        p.Parameters.AddWithValue("@auteur", auteurId);
        p.Parameters.AddWithValue("@pct", pct);
        return p.ExecuteNonQuery() &gt; 0;
    } catch (MySqlException) { return false; }
}</pre>
