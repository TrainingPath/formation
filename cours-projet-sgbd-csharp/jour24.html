<h3>1. Pourquoi Windows Forms ?</h3>
<p><strong>Windows Forms</strong> (ou <strong>WinForms</strong>) est la boîte à outils graphique historique de .NET. Au lieu de <code>Console.ReadLine()</code> et <code>Console.WriteLine()</code>, on manipule des <strong>contrôles</strong> : <code>DataGridView</code> (tableau de données), <code>TextBox</code> (champ de saisie), <code>Button</code> (bouton). L'architecture MVC + Repository reste identique : <em>seule la Vue change</em>.</p>
<div class="tip">Grâce au découpage des jours précédents, le Modèle (classe modèle + Repository) et le Contrôleur ne bougent presque pas. On récolte ici les fruits de la séparation des responsabilités.</div>

<h3>2. Créer le projet dans Visual Studio</h3>
<p>Dans Visual Studio : <em>Fichier → Nouveau → Projet</em>, puis choisir le modèle <strong>« Application Windows Forms (.NET) »</strong> en C#. Visual Studio crée automatiquement une première fenêtre <code>Form1</code>. Pour parler à MySQL, on ajoute le paquet <strong>NuGet</strong> <code>MySql.Data</code> (<em>Outils → Gestionnaire de packages NuGet → Gérer les packages NuGet</em>).</p>
<div class="tip">Un <strong>paquet NuGet</strong> est une bibliothèque réutilisable téléchargée depuis internet. <code>MySql.Data</code> fournit les classes <code>MySqlConnection</code>, <code>MySqlCommand</code>, etc., déjà utilisées dans nos Repository.</div>

<h3>3. La classe Form et le point d'entrée Program.cs</h3>
<p>Une fenêtre est une classe qui <strong>hérite de <code>Form</code></strong>. Le fichier <code>Program.cs</code> contient la méthode <strong><code>Main</code></strong>, point d'entrée de l'application, qui affiche la fenêtre via <code>Application.Run(...)</code>.</p>
<pre class="pseudo">public partial class MainForm : Form {                 // notre fenêtre hérite de Form
    public MainForm() {                                 // constructeur : appelé à la création
        InitializeComponent();                          // méthode générée par le concepteur
        Label titre = new Label();                      // un contrôle simple
        titre.Text = "Bibliothèque";
        this.Controls.Add(titre);                       // on ajoute le contrôle à la fenêtre
        this.Text = "Gestion de la bibliothèque";       // titre de la fenêtre (barre de titre)
        this.Size = new Size(800, 600);                 // dimensions en pixels
    }
}</pre>
<pre class="pseudo">static class Program {                                  // classe du point d'entrée
    [STAThread]                                         // requis par WinForms (modèle de threading)
    static void Main() {                                // point d'entrée du programme
        Application.EnableVisualStyles();               // style visuel moderne
        Application.Run(new MainForm());                // affiche la fenêtre et lance la boucle
    }
}</pre>
<div class="tip">Vocabulaire : <strong>Form</strong> = la fenêtre ; <strong>contrôles</strong> = les éléments (boutons, tableaux…) placés dessus ; <code>Application.Run</code> = l'équivalent du <code>launch()</code> de JavaFX : il affiche la fenêtre et démarre la <em>boucle de messages</em> (l'attente des clics et saisies).</div>

<h3>4. Le concepteur visuel (Designer)</h3>
<p>Plutôt que d'écrire les contrôles à la main, Visual Studio offre un <strong>concepteur visuel</strong>. En double-cliquant sur <code>Form1.cs</code>, on ouvre la vue <em>[Design]</em> : on <strong>glisse-dépose</strong> les contrôles depuis la <strong>Boîte à outils</strong> (Toolbox) sur la fenêtre, on ajuste leurs <strong>propriétés</strong> dans la fenêtre <em>Propriétés</em> (Text, Name, Size…), et on associe des <strong>événements</strong> (double-clic sur un bouton = créer son gestionnaire de clic).</p>
<div class="tip">Chaque fenêtre est répartie en <strong>deux fichiers</strong> : <code>Form1.cs</code> (votre code : la logique, les événements) et <code>Form1.Designer.cs</code> (généré automatiquement par le concepteur : la création et le placement des contrôles). On ne modifie normalement pas le fichier <code>.Designer.cs</code> à la main.</div>

<h3>5. Lancer l'application</h3>
<p>On appuie sur <strong>F5</strong> (Démarrer) : Visual Studio compile puis exécute. La fenêtre <code>MainForm</code> s'ouvre. La propriété <code>Text</code> du Form définit le titre affiché en haut, <code>Size</code> ses dimensions, et <code>StartPosition = CenterScreen</code> la centre à l'écran.</p>
<div class="warn">Si le projet ne trouve pas <code>MySql.Data</code> à l'exécution, vérifiez que le paquet NuGet est bien installé et que la version cible de .NET est compatible. C'est l'équivalent du « chemin des bibliothèques » qu'il fallait configurer en JavaFX.</div>`,
