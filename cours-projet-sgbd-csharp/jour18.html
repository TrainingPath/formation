  theory: `
<h3>1. Le Contrôleur : le médiateur</h3>
<p>Le <strong>Contrôleur</strong> fait le pont entre la Vue et le Modèle. Sa règle d'or : <em>il ne contient aucune ligne de SQL</em>. Son rôle est de <strong>piloter le Modèle</strong>.</p>
<p>Concrètement : si la Vue lui transmet un nom de section, le contrôleur crée un objet <code>Section</code>, lui affecte le nom, appelle <code>Creer()</code> sur le modèle, puis récupère le résultat (souvent un <code>bool</code> ou une <code>List</code>) et le prépare pour la Vue.</p>
<pre class="pseudo">public class SectionController {                        // le médiateur (aucun SQL ici)
    private Section modele = new Section();             // objet « pivot » pour appeler le CRUD

    public bool AjouterSection(string nom) {            // reçoit une saisie de la Vue
        Section s = new Section(nom);                   // configure une entité
        return s.Creer();                               // demande au Modèle de s'enregistrer
    }
    public List&lt;Section&gt; GetListeSections() {           // fournit les données à la Vue
        return modele.LireTout();                       // délègue la lecture au Modèle
    }
}</pre>
<div class="tip">Le contrôleur est un <em>traducteur d'intentions</em> : il transforme les souhaits de l'utilisateur (« ajouter cette section ») en actions concrètes sur le Modèle.</div>

<h3>2. La Vue console : l'interface texte</h3>
<p>La <strong>Vue</strong> est la seule classe qui utilise <code>Console.ReadLine()</code> (pour lire le clavier) et <code>Console.WriteLine()</code> (pour afficher). Elle est <em>« muette »</em> vis-à-vis de la base : elle ne connaît que le Contrôleur.</p>
<pre class="pseudo">public class SectionView {                              // interface console
    private SectionController ctrl = new SectionController();   // la Vue ne connaît que le contrôleur

    public void MenuSections() {                        // affiche le menu et réagit
        Console.WriteLine("1. Lister   2. Ajouter");    // options proposées
        string saisie = Console.ReadLine();             // lit la ligne tapée (une chaîne)
        int choix = int.Parse(saisie);                  // convertit la chaîne en entier
        if (choix == 1) Afficher();                     // route vers l'action
        else if (choix == 2) FormulaireAjout();
    }
}</pre>

<h3>3. Afficher : boucler sur les objets</h3>
<p>Pour lister, la Vue demande la liste au Contrôleur, puis boucle avec <code>foreach</code> et affiche chaque objet.</p>
<pre class="pseudo">private void Afficher() {                               // liste les sections
    List&lt;Section&gt; liste = ctrl.GetListeSections();      // demande au contrôleur
    foreach (Section s in liste) {                      // pour chaque objet reçu
        Console.WriteLine(s.SectionId + " - " + s.NomSection);  // formate l'affichage
    }
}</pre>

<h3>4. Saisir : le formulaire</h3>
<p>Le formulaire collecte les données au clavier, puis les transmet au Contrôleur — jamais directement au Modèle.</p>
<pre class="pseudo">private void FormulaireAjout() {                        // saisie d'une nouvelle section
    Console.Write("Nom de la section : ");              // invite (sans retour à la ligne)
    string nom = Console.ReadLine();                    // lit la ligne saisie
    bool ok = ctrl.AjouterSection(nom);                 // transmet au contrôleur
    if (ok) Console.WriteLine("Section ajoutée.");      // feedback à l'utilisateur
    else Console.WriteLine("Échec de l'ajout.");
}</pre>

<h3>5. De la chaîne à l'entier : Parse et TryParse</h3>
<p>En C#, <code>Console.ReadLine()</code> renvoie <strong>toujours une <code>string</code></strong>. Pour obtenir un nombre, il faut <em>convertir</em> cette chaîne. Deux méthodes : <code>int.Parse(s)</code> renvoie l'entier mais <strong>lève une exception</strong> si la chaîne n'est pas un nombre ; <code>int.TryParse(s, out n)</code> est plus sûre : elle renvoie <code>true</code>/<code>false</code> et range le résultat dans <code>n</code>.</p>
<pre class="pseudo">Console.Write("Votre choix : ");
string saisie = Console.ReadLine();          // toujours une chaîne (string)
int choix;
if (int.TryParse(saisie, out choix)) {       // conversion sûre : true si réussie
    // choix contient le nombre saisi
} else {
    Console.WriteLine("Veuillez entrer un nombre valide.");  // pas de plantage
}</pre>
<div class="warn">C'est l'équivalent C# du fameux « nettoyage de tampon » du <code>Scanner</code> en Java : ici pas de tampon résiduel, mais il faut penser à convertir la chaîne. Préférez <code>int.TryParse</code> à <code>int.Parse</code> pour ne jamais planter sur une saisie erronée (<code>FormatException</code>).</div>
<div class="tip">Découplage : si l'on remplaçait la console par Windows Forms, seule la Vue changerait. Le Contrôleur et le Modèle resteraient intacts.</div>`,

    ],
    solution: `<pre class="pseudo">public class SectionController {                        // médiateur sans SQL

public class SectionView {                              // interface console

}</pre>
<p>Trois couches, trois responsabilités. Demain : on assemble tout dans un CRUD complet avec un Main.</p>`
  }
