<script>
var DAY = {
  num: 6,
  title: "Simuler une injection SQL en C# (la requête fantôme)",
  subtitle: "Coder le simulateur, jouer l'attaquant, puis nettoyer les saisies.",
  theory: `
<h3>1. Coder le simulateur</h3>
<p>Sans connexion à la base, on écrit un petit programme console qui lit deux saisies et affiche la requête <strong>fantôme</strong> (celle qu'il aurait envoyée). C'est le point de départ du TP « le Garde-Barrière ».</p>
<pre class="pseudo">using System;                                         // pour Console
class Simulateur {                                    // classe du simulateur
    static void Main() {                              // point d'entree du programme
        Console.Write("Nom : ");                      // invite de saisie
        string nom = Console.ReadLine();              // lecture du nom
        Console.Write("Mot de passe : ");             // invite
        string mdp = Console.ReadLine();              // lecture du mot de passe
        string req = "SELECT * FROM clients WHERE nom = '" + nom   // concatenation dangereuse
                   + "' AND motdepasse = '" + mdp + "';";          // suite de la requete
        Console.WriteLine("Requete envoyee : " + req);            // on affiche la requete fantome
    }                                                 // fin de Main
}                                                     // fin de la classe</pre>

<h3>2. Jouer l'attaquant</h3>
<p>On teste les trois attaques sur une requête de recherche <code>SELECT * FROM produits WHERE nom = '...' AND disponible = 1;</code> :</p>
<pre class="pseudo">Pomme' OR '1'='1        -- Challenge 1 : afficher meme les produits indisponibles
Banane' --              -- Challenge 2 : commenter la fin (AND disponible = 1 ignore)
Velo'; DROP TABLE produits; --   -- Challenge 3 : tenter de supprimer la table</pre>
<div class="warn">Le point-virgule <code>;</code> peut enchaîner plusieurs commandes. Combiné à <code>DROP TABLE</code>, il vise la destruction pure et simple d'une table. C'est l'attaque la plus grave.</div>

<h3>3. Défense A : la sanitization (liste interdite)</h3>
<p>Faute de commande paramétrée ici, on code à la main une méthode <strong>Sanitize</strong> (nettoyage). Approche <strong>liste interdite</strong> (blacklist) : on repère les mots-clés dangereux et on supprime les apostrophes.</p>
<pre class="pseudo">public static string Sanitize(string input) {         // nettoie une saisie
    string s = input.ToUpper();                       // on compare en majuscules
    if (s.Contains("DROP") || s.Contains("DELETE")    // mots-cles interdits
        || s.Contains("--")  || s.Contains("OR")) {   // -- et OR aussi
        throw new ArgumentException("Tentative d'injection detectee !");   // on alerte
    }
    return input.Replace("'", "");                    // on supprime les apostrophes
}                                                     // fin de la methode</pre>
<div class="tip">La liste interdite est fragile : on oublie toujours un mot-clé ou une variante (espaces, casse mixte). Elle sert de première alerte, jamais de protection unique.</div>

<h3>4. Défense B : la liste autorisée (whitelist)</h3>
<p>La meilleure pratique est la <strong>liste autorisée</strong> (whitelist) : au lieu d'énumérer l'interdit, on définit strictement ce qui est <strong>permis</strong>. Pour un nom d'utilisateur, on n'accepte que des caractères alphanumériques, via une expression régulière (regex) et <code>Regex.IsMatch</code> :</p>
<pre class="pseudo">using System.Text.RegularExpressions;                 // pour Regex
public static bool EstValide(string nom) {            // valide un nom d'utilisateur
    return Regex.IsMatch(nom, @"^[a-zA-Z0-9]+$");     // uniquement lettres et chiffres, au moins un
}                                                     // fin de la methode</pre>
<p>Tout ce qui n'est pas dans la liste autorisée est rejeté. Une apostrophe, un espace, un <code>;</code> : refusés d'office. On approfondira les regex les jours 8 et 9.</p>
<div class="tip">Astuce C# : la chaîne <strong>verbatim</strong> <code>@"..."</code> évite de doubler les antislash des regex. Là où Java écrit <code>"\\d"</code>, C# écrit simplement <code>@"\d"</code>. C'est plus lisible.</div>

<h3>5. Échapper : Replace("'", "''")</h3>
<p>Troisième technique : l'<strong>échappement</strong>. On double les apostrophes pour qu'elles restent de simples caractères. En C# :</p>
<pre class="pseudo">string sur = saisie.Replace("'", "''");   // L'info devient L''info : l'apostrophe est neutralisee</pre>
<p>Bilan des approches : <strong>échappement</strong> (<code>Replace("'","''")</code>), <strong>nettoyage</strong> (<code>Replace(";","")</code>), <strong>validation</strong> (<code>Regex.IsMatch(s, @"^[a-z]+$")</code>). La validation par whitelist est la plus sûre. Et la vraie solution industrielle, la <strong>commande paramétrée</strong>, arrive au jour 14.</p>`,
  exercises: [
    { type: "input", q: "Quelle méthode de la classe Regex applique une whitelist par expression régulière ?", a: ["ismatch", "regex.ismatch", "ismatch()"], ph: "méthode C#", exp: "Regex.IsMatch(chaine, motif) vérifie qu'une chaîne respecte le motif." },
    { type: "qcm", q: "L'attaque Velo'; DROP TABLE produits; -- vise à…", opts: ["Afficher les produits", "Supprimer la table produits", "Ralentir le serveur", "Changer un prix"], a: 1, exp: "Le ; enchaîne une commande DROP TABLE destructrice." },
    { type: "qcm", q: "La liste interdite (blacklist) consiste à…", opts: ["Définir ce qui est autorisé", "Énumérer et bloquer ce qui est interdit", "Chiffrer la base", "Créer un index"], a: 1, exp: "On bloque des mots-clés dangereux ; approche fragile." },
    { type: "vf", q: "La liste autorisée (whitelist) est en général plus sûre que la liste interdite.", a: true, exp: "On n'accepte que le connu-bon ; tout le reste est rejeté." },
    { type: "input", q: "Que devient la saisie L'info après saisie.Replace(\"'\", \"''\") ?", a: ["l''info", "L''info"], ph: "résultat", exp: "L'apostrophe est doublée : L''info." },
    { type: "qcm", q: "Quel caractère l'attaque ' OR '1'='1 exploite-t-elle pour sortir de la chaîne ?", opts: ["Le point-virgule", "L'apostrophe", "Le dièse", "Le tiret bas"], a: 1, exp: "L'apostrophe ferme la chaîne ouverte par le code." },
    { type: "input", q: "Quelle regex n'autorise que des lettres minuscules (au moins une) ?", a: ["^[a-z]+$"], ph: "^[...]+$", exp: "^[a-z]+$ : uniquement des minuscules." },
    { type: "vf", q: "La méthode Sanitize par blacklist suffit à elle seule à sécuriser une application.", a: false, exp: "Elle est incomplète ; la whitelist et surtout la commande paramétrée sont nécessaires." },
    { type: "qcm", q: "Que fait saisie.Replace(\";\", \"\") ?", opts: ["Ajoute un point-virgule", "Supprime les points-virgules (nettoyage)", "Chiffre la saisie", "Vérifie la longueur"], a: 1, exp: "Nettoyage : on retire le caractère ; dangereux." },
    { type: "input", q: "Quelle méthode C# lit une saisie au clavier dans le simulateur console ?", a: ["console.readline", "readline", "console.readline()"], ph: "méthode C#", exp: "Console.ReadLine() lit une ligne saisie." },
    { type: "vf", q: "Le symbole -- dans Banane' -- neutralise la fin de la requête (AND disponible = 1).", a: true, exp: "Tout ce qui suit -- est ignoré par la base." },
    { type: "qcm", q: "Pourquoi la blacklist est-elle fragile ?", opts: ["Elle est trop lente", "On oublie toujours des variantes (casse, espaces, mots)", "Elle chiffre trop", "Elle bloque tout"], a: 1, exp: "Impossible d'énumérer toutes les attaques possibles." },
    { type: "qcm", q: "Regex.IsMatch(nom, @\"^[a-zA-Z0-9]+$\") accepte…", opts: ["Toute saisie", "Seulement lettres et chiffres, au moins un caractère", "Seulement les apostrophes", "Les chaînes vides"], a: 1, exp: "Whitelist alphanumérique, non vide." },
    { type: "vf", q: "En C#, la chaîne verbatim @\"...\" évite de doubler les antislash d'une regex.", a: true, exp: "@\"\\d\" en C# équivaut à \"\\\\d\" en Java." },
    { type: "input", q: "Quelle méthode de string remplace une sous-chaîne par une autre en C# ?", a: ["replace", "replace()"], ph: "méthode C#", exp: "Replace(ancien, nouveau)." }
  ],
  final: {
    title: "Exercice final — Le Garde-Barrière",
    intro: `<p>On applique les défenses vues sur les trois challenges d'attaque.</p>`,
    questions: [
      { type: "input", q: "Méthode Regex qui applique une regex de whitelist :", a: ["ismatch", "regex.ismatch"], ph: "méthode", exp: "Regex.IsMatch(chaine, motif)." },
      { type: "qcm", q: "L'attaque la plus destructrice utilise :", opts: ["OR '1'='1", "; DROP TABLE ... ;", "un espace", "un chiffre"], a: 1, exp: "Le ; enchaîne un DROP TABLE." },
      { type: "input", q: "Résultat de Replace(\"'\",\"''\") sur L'info :", a: ["l''info", "L''info"], ph: "résultat", exp: "L''info." },
      { type: "vf", q: "La whitelist rejette tout ce qui n'est pas explicitement autorisé.", a: true, exp: "Principe : n'accepter que le connu-bon." },
      { type: "vf", q: "La vraie solution industrielle reste la commande paramétrée (vue plus tard).", a: true, exp: "La commande paramétrée sépare code et données automatiquement." }
    ],
    solution: `<pre class="pseudo">using System;
using System.Text.RegularExpressions;

public static string Garde(string saisie) {            // Garde-Barriere : valide + normalise
    string s = saisie.Trim().ToLower();                // normalisation : Trim + minuscules
    if (s.Contains(";") || s.Contains("--")) {         // detection d'injection evidente
        throw new ArgumentException("Alerte : caractere SQL interdit !");   // alerte
    }
    if (!Regex.IsMatch(s, @"^[a-z0-9 ]+$")) {          // whitelist : lettres, chiffres, espace
        throw new ArgumentException("Saisie non autorisee.");   // rejet strict
    }
    return s;                                          // saisie propre et sure
}
// Pomme' OR '1'='1  -> rejete (apostrophe hors whitelist)
// Banane' --        -> rejete (-- detecte)
// Velo'; DROP...    -> rejete (; detecte)</pre>
<p>Le garde-barrière tient. Mais valider « à la main » a des limites : place aux expressions régulières, les vraies (jours 8-9).</p>`
  }
};
</script>

  ]
};
