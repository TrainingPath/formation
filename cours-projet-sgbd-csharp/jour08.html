  num: 8,
  title: "Les expressions régulières (regex) en C#",
  subtitle: "Regex, Match, IsMatch, Matches : le langage des motifs.",
  theory: `
<h3>1. Qu'est-ce qu'une regex ?</h3>
<p>Une <strong>expression régulière</strong> (regex) est un <strong>motif</strong> (pattern) qui décrit une forme de texte. Au lieu de dire « lettres puis chiffres », on l'écrit avec des symboles. C'est l'outil idéal pour valider une saisie : email, code, date, montant. En C#, tout passe par la classe <code>Regex</code> de l'espace de noms <code>System.Text.RegularExpressions</code>.</p>

<h3>2. La syntaxe de base</h3>
<p>Quelques briques essentielles pour composer un motif (elles sont universelles) :</p>
<pre class="pseudo">\d    -- un chiffre (0-9)
\D    -- tout sauf un chiffre
\w    -- un caractere de mot (lettre, chiffre, underscore)
\s    -- un espace blanc ; \S : tout sauf un espace
.     -- n'importe quel caractere
[a-z] -- une lettre minuscule ; [A-Z0-9] : majuscule ou chiffre
[^..] -- negation : tout SAUF ce qui est entre crochets
^     -- debut de chaine ; $ : fin de chaine
+     -- 1 fois ou plus ; * : 0 fois ou plus ; ? : 0 ou 1 fois
{n}   -- exactement n fois ; {n,} : au moins n ; {n,m} : entre n et m</pre>

<h3>3. La chaîne verbatim @"..." en C#</h3>
<p>Avantage majeur de C# sur Java : la <strong>chaîne verbatim</strong>, préfixée par <code>@</code>, prend l'antislash <code>\</code> au pied de la lettre. On n'a donc <strong>pas</strong> à le doubler dans une regex.</p>
<pre class="pseudo">// C# : chaine verbatim -> on ecrit la regex telle quelle
string motif = @"\d+";      // \d+ = un ou plusieurs chiffres
// (En Java il aurait fallu ecrire "\\d+" avec double antislash.)</pre>
<div class="warn">Sans le <code>@</code>, C# interpréterait <code>"\d"</code> comme une séquence d'échappement inconnue. Réflexe : pour une regex en C#, écrivez toujours une chaîne verbatim <code>@"..."</code>.</div>

<h3>4. La classe Regex et l'objet Match</h3>
<p>La classe <strong>Regex</strong> représente le motif ; la méthode <strong>Match</strong> le confronte à une chaîne et renvoie un objet <strong>Match</strong> qui décrit ce qui a été trouvé :</p>
<pre class="pseudo">using System.Text.RegularExpressions;                 // Regex, Match
Regex re = new Regex(@"\d+");                          // on compile le motif une fois
Match m = re.Match("commande 2024");                  // on l'applique a une chaine
if (m.Success) {                                       // Success : le motif apparait-il quelque part ?
    Console.WriteLine("Trouve : " + m.Value);          // Value : la portion trouvee (ici 2024)
}</pre>

<h3>5. IsMatch vs Matches</h3>
<p>Deux usages à ne pas confondre :</p>
<pre class="pseudo">Regex.IsMatch("abc123", @"^[a-z]+\d+$");   // IsMatch + ancres ^ et $ : TOUTE la chaine correspond -> validation
Regex.Matches(texte, @"\d+");              // Matches : toutes les occurrences trouvees -> extraction</pre>
<p>Pour <strong>valider</strong> une saisie, on utilise <code>IsMatch</code> avec <code>^</code> et <code>$</code>. Pour <strong>extraire</strong> des morceaux d'un long texte, on parcourt <code>Matches</code>. Autre méthode utile : <code>Regex.Replace</code>, qui remplace via regex :</p>
<pre class="pseudo">string phrase = "L'annee 2024 sera 2024 fois mieux.";   // texte de depart
string r = Regex.Replace(phrase, @"\d+", "2025");        // remplace chaque nombre par 2025</pre>
<div class="tip">Bonne pratique : si vous validez des milliers de chaînes dans une boucle, créez l'objet <code>Regex</code> une seule fois <em>en dehors</em> de la boucle (ou utilisez <code>RegexOptions.Compiled</code>). C'est plus performant.</div>`,
  exercises: [
    { type: "input", q: "Quel symbole regex représente un chiffre ? (notation à taper telle quelle)", a: ["\\d"], ph: "symbole", exp: "\\d correspond à un chiffre 0-9." },
    { type: "qcm", q: "En C#, comment écrit-on proprement une regex contenant \\d ?", opts: ["\"\\d\"", "@\"\\d\" (chaîne verbatim)", "\"\\\\d\"", "'/d/'"], a: 1, exp: "La chaîne verbatim @\"\\d\" évite de doubler l'antislash." },
    { type: "qcm", q: "Quelle classe C# représente le motif de regex ?", opts: ["Match", "Regex", "String", "Pattern"], a: 1, exp: "La classe Regex (System.Text.RegularExpressions)." },
    { type: "input", q: "Quelle méthode de Regex valide que TOUTE la chaîne correspond au motif (avec ^ et $) ?", a: ["ismatch", "ismatch()", "regex.ismatch"], ph: "méthode", exp: "Regex.IsMatch vérifie la chaîne (anchors ^ et $)." },
    { type: "vf", q: "La propriété Success d'un Match indique si le motif a été trouvé.", a: true, exp: "m.Success vaut true si une correspondance existe." },
    { type: "input", q: "Quel symbole marque le début d'une chaîne dans une regex ?", a: ["^"], ph: "symbole", exp: "^ = début de chaîne." },
    { type: "qcm", q: "Que signifie [^0-9] ?", opts: ["Un chiffre", "Tout SAUF un chiffre", "Un espace", "Une majuscule"], a: 1, exp: "[^...] est une classe de négation." },
    { type: "input", q: "Quel symbole marque la fin d'une chaîne dans une regex ?", a: ["$"], ph: "symbole", exp: "$ = fin de chaîne." },
    { type: "qcm", q: "Le quantificateur + signifie…", opts: ["0 ou 1 fois", "1 fois ou plus", "exactement 1 fois", "0 fois ou plus"], a: 1, exp: "+ = une ou plusieurs occurrences." },
    { type: "input", q: "Quelle méthode de Regex remplace via une regex ?", a: ["replace", "regex.replace", "replace()"], ph: "méthode", exp: "Regex.Replace(entree, motif, remplacement)." },
    { type: "vf", q: "Pour valider une saisie, on encadre le motif de ^ et $ avec IsMatch.", a: true, exp: "^...$ impose que toute la chaîne corresponde." },
    { type: "qcm", q: "Que renvoie la propriété Value d'un Match réussi ?", opts: ["Le motif", "La portion de texte trouvée", "La longueur", "Un booléen"], a: 1, exp: "Value renvoie le texte capturé." },
    { type: "input", q: "Quelle notation regex signifie « exactement 4 chiffres » ?", a: ["\\d{4}"], ph: "\\d{...}", exp: "\\d{4} = quatre chiffres." },
    { type: "vf", q: "Créer l'objet Regex hors d'une boucle améliore les performances.", a: true, exp: "On évite de recompiler le motif à chaque tour." },
    { type: "qcm", q: "Que renvoie Regex.IsMatch(\"abc123\", @\"^[a-z]+\\d+$\") ?", opts: ["false", "true (lettres puis chiffres)", "une erreur", "null"], a: 1, exp: "Des minuscules suivies de chiffres : correspond." }
  ],
  final: {
    title: "Exercice final — Manier Regex et Match",
    intro: `<p>On distingue validation et extraction.</p>`,
    questions: [
      { type: "input", q: "Symbole regex d'un chiffre :", a: ["\\d"], ph: "symbole", exp: "\\d." },
      { type: "qcm", q: "Pour valider toute la chaîne :", opts: ["Regex.Match(...).NextMatch()", "Regex.IsMatch(...) avec ^ et $", "m.Value", "Regex.Replace(...)"], a: 1, exp: "IsMatch encadré de ^ et $." },
      { type: "input", q: "En C#, préfixe d'une chaîne verbatim pour écrire une regex :", a: ["@"], ph: "un caractère", exp: "@ (chaîne verbatim : @\"\\d\")." },
      { type: "vf", q: "new Regex(motif) crée le motif ; Match(chaine) l'applique.", a: true, exp: "Séparation motif / confrontation." },
      { type: "qcm", q: "Extraire tous les nombres d'un texte :", opts: ["Regex.IsMatch(...)", "boucle sur Regex.Matches(...)", "Trim()", "ToUpper()"], a: 1, exp: "Matches renvoie toutes les occurrences." }
    ],
    solution: `<pre class="pseudo">using System;
using System.Text.RegularExpressions;                   // Regex, Match

// 1) VALIDER : le code d'inventaire ne contient que majuscules, chiffres, tirets
bool ok = Regex.IsMatch("SQL-001", @"^[A-Z0-9-]+$");     // true

// 2) EXTRAIRE : tous les nombres d'un texte
Regex re = new Regex(@"\d+");                            // motif compile une fois
foreach (Match m in re.Matches("Vente 3 du livre 5 pour 29 euros")) {
    Console.WriteLine(m.Value);                          // affiche 3, puis 5, puis 29
}</pre>
<p>Les bases sont posées. Demain : des regex concrètes pour emails, dates et montants de la bibliothèque.</p>`
  }
