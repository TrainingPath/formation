<h3>1. Ce qui change… et ce qui ne change pas</h3>
<p>En passant à Windows Forms, la logique SQL du Repository reste <strong>strictement identique</strong> (mêmes SELECT, INSERT, UPDATE). Ce qui change, c'est la <strong>gestion des erreurs</strong> et le <strong>déclenchement</strong> des actions (par événement, plus par saisie clavier).</p>
<ul>
<li>Inchangé : la logique SQL, la structure des tables, <code>DatabaseConnection</code>.</li>
<li>Modifié : le Repository <em>laisse remonter</em> les erreurs, le Contrôleur <em>réagit</em> aux clics et <em>affiche</em> des <code>MessageBox</code>.</li>
</ul>

<h3>2. Le Repository propage l'exception</h3>
<p>En console, on pouvait afficher l'erreur dans le terminal. En WinForms, une erreur avalée en silence (un <code>catch</code> vide) donnerait un clic « sans effet » — l'utilisateur ne verrait rien. On <strong>ne capture donc plus l'exception dans le Repository</strong> : on la laisse remonter jusqu'au contrôleur. En C#, aucune clause <code>throws</code> n'est nécessaire : l'exception se propage automatiquement.</p>
<pre class="pseudo">public List&lt;Livre&gt; ListeLivreAvecDetails() {            // l'erreur remonte au contrôleur
    // … même SQL qu'avant, mais SANS catch silencieux qui masque le problème …
}</pre>
<div class="tip">Le Repository ne décide plus comment afficher l'erreur : il dit seulement « je n'ai pas réussi, voici l'exception ». C'est au Contrôleur de choisir l'affichage.</div>

<h3>3. La classe modèle : rien à changer</h3>
<p>Le modèle <code>Livre</code> n'a <strong>aucune modification</strong> à subir : ses propriétés, écrites pour la version console, sont exactement ce dont le <code>DataGridView</code> a besoin (liaison via <code>DataPropertyName</code>). Le Repository non plus n'a pas de nouvelle requête à écrire.</p>

<h3>4. Le contrôleur réagit : MessageBox et rafraîchissement</h3>
<p>Le Contrôleur intercepte l'exception avec un <code>try-catch</code> et affiche une <strong>MessageBox</strong> (boîte de dialogue WinForms) en cas de problème. La méthode <code>RafraichirListe()</code> recharge les données depuis le Repository et les réaffecte au <code>DataSource</code>.</p>
<pre class="pseudo">public void RafraichirListe() {                         // recharge le tableau
    try {
        grille.DataSource = new BindingList&lt;Livre&gt;(repo.ListeLivreAvecDetails());  // recharge
    } catch (MySqlException ex) {                        // la base est coupée ? contrainte violée ?
        MessageBox.Show(ex.Message,                      // message technique lisible
                        "Erreur base de données",        // titre de la boîte
                        MessageBoxButtons.OK,
                        MessageBoxIcon.Error);            // icône d'erreur (rouge)
    }
}</pre>
<div class="warn">Sans ce <code>try-catch</code> au niveau du contrôleur, si la base est éteinte, l'utilisateur cliquerait « Rafraîchir » et… rien (ou un plantage). Avec, une boîte d'erreur s'ouvre et explique le problème.</div>

<h3>5. Réagir à un clic : l'événement Click</h3>
<p>Un <strong>événement</strong> est un signal émis par un contrôle (un clic, une frappe…). Un <strong>gestionnaire d'événement</strong> est la méthode exécutée en réponse. En WinForms, on <em>abonne</em> une méthode à l'événement <code>Click</code> d'un bouton avec l'opérateur <code>+=</code>. Le contrôleur devient <strong>réactif</strong> : il attend l'événement plutôt qu'une saisie <code>Console.ReadLine()</code>.</p>
<pre class="pseudo">btnRafraichir.Click += (s, e) =&gt; RafraichirListe();     // au clic → recharge la liste</pre>
<div class="tip">Dans le concepteur, double-cliquer sur un bouton génère automatiquement un gestionnaire nommé <code>btnRafraichir_Click(object sender, EventArgs e)</code> et l'abonnement <code>+=</code> correspondant. Bilan : le Repository fournit la donnée (ou l'exception), et le contrôleur — lui seul — gère l'affichage des messages et le rafraîchissement du <code>DataGridView</code>.</div>`,

public List&lt;Livre&gt; ListeLivreAvecDetails() {
    List&lt;Livre&gt; liste = new List&lt;Livre&gt;();

    while (rs.Read()) { /* mapping … */ liste.Add(new Livre()); }

    return liste;                                        // l'exception éventuelle remonte

// Contrôleur : réagit et affiche
private DataGridView grille;

    }
}
// btnRafraichir.Click += (s, e) =&gt; RafraichirListe();</pre>
