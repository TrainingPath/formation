<h3>1. Le modèle Livre et ses clés étrangères</h3>
<p>La table <code>livres</code> est reliée à <code>sections</code> et <code>collections</code> par des <strong>clés étrangères</strong> (<code>section_id</code>, <code>collection_id</code>). Le modèle stocke donc aussi ces identifiants techniques. Attention au type du prix : une colonne SQL <code>DECIMAL(10,2)</code> se traduit par le type C# <strong><code>decimal</code></strong> (précis pour l'argent), et non <code>double</code>.</p>
<pre class="pseudo">public class Livre {                                    // modèle de la table livres
    public int LivreId { get; set; }                    // livre_id (clé primaire)
    public string Titre { get; set; }                   // titre
    public int Annee { get; set; }                      // annee
    public decimal PrixUnitaire { get; set; }           // prix_unitaire (DECIMAL → decimal)
    public int SectionId { get; set; }                  // section_id (clé étrangère)
    public int CollectionId { get; set; }               // collection_id (clé étrangère)
    // constructeur complet + CRUD…
}</pre>

<h3>2. Le CRUD complet : les 4 méthodes</h3>
<p>On complète le patron d'hier avec la mise à jour et la suppression. Chaque commande est paramétrée.</p>
<pre class="pseudo">public bool Creer() {                                   // CREATE
    string sql = "INSERT INTO livres (titre, annee, prix_unitaire, section_id, collection_id) "
               + "VALUES (@titre, @annee, @prix, @sec, @col)";   // 5 paramètres
    // cmd.Parameters.AddWithValue("@titre", Titre); ... AddWithValue("@prix", PrixUnitaire);
    // return cmd.ExecuteNonQuery() &gt; 0;
}
public bool Modifier() {                                // UPDATE (nécessite l'id)
    string sql = "UPDATE livres SET titre=@titre, annee=@annee, prix_unitaire=@prix WHERE livre_id=@id";
    // … WHERE livre_id = this.LivreId
}
public bool Supprimer() {                               // DELETE (seul l'id suffit)
    string sql = "DELETE FROM livres WHERE livre_id = @id";
    // cmd.Parameters.AddWithValue("@id", this.LivreId);
}</pre>
<div class="warn">Ne jamais oublier la clause <code>WHERE</code> dans un UPDATE ou un DELETE : sans elle, l'opération s'applique à <em>toutes</em> les lignes de la table.</div>
<div class="tip">Pour UPDATE et DELETE, l'objet doit porter le bon <code>LivreId</code> (récupéré depuis la base) : c'est lui qui cible la ligne dans le <code>WHERE</code>.</div>

<h3>3. L'intégrité référentielle</h3>
<p>Si l'utilisateur saisit un <code>section_id</code> qui n'existe pas, la contrainte <code>FOREIGN KEY</code> de la base fait échouer <code>Creer()</code> : une <code>MySqlException</code> est levée, capturée dans le <code>catch</code>, et la méthode renvoie <code>false</code>. Le Contrôleur affiche alors un message clair : « Vérifiez les ID de section/collection ».</p>

<h3>4. La classe principale : le Main</h3>
<p>La classe <code>Program</code> contient la méthode <code>Main</code>, le <strong>point d'entrée unique</strong> de l'application console. Elle instancie les Vues et fait tourner une <strong>boucle <code>do-while</code></strong> qui maintient l'application active jusqu'à la sortie.</p>
<pre class="pseudo">static void Main(string[] args) {                       // point d'entrée
    LivreView livreView = new LivreView();              // instancie la couche Vue
    int choix;
    do {                                                // boucle du menu principal
        Console.WriteLine("=== SYSTÈME DE GESTION BIBLIOTHÈQUE ===");
        Console.WriteLine("1. Livres   3. Quitter");
        try {                                           // robustesse : saisie non numérique
            choix = int.Parse(Console.ReadLine());      // lit la ligne et la convertit
            switch (choix) {                            // aiguille vers le module
                case 1: livreView.MenuLivres(); break;
                case 3: Console.WriteLine("Au revoir."); break;
            }
        } catch (FormatException) {                     // texte au lieu d'un nombre
            Console.WriteLine("Saisie invalide.");
            choix = -1;                                 // valeur neutre : on reboucle
        }
    } while (choix != 3);                               // continue tant que ≠ 3
}</pre>

<h3>5. Robustesse : le bloc try-catch</h3>
<p>Un <code>try-catch</code> autour de la lecture intercepte les <strong>mauvaises saisies</strong> (du texte au lieu d'un nombre) et évite un <em>plantage brutal</em> de la console : <code>int.Parse("abc")</code> lève une <code>FormatException</code> que l'on capture.</p>
<div class="tip">Alternative plus idiomatique en C# : <code>int.TryParse(Console.ReadLine(), out choix)</code> qui renvoie <code>false</code> au lieu de lever une exception — on évite alors le try-catch. Contrairement au Java, il n'y a ici aucun « tampon » à vider.</div>
<div class="tip">Bilan des points forts : (1) <strong>Active Record</strong> — aucun SQL dans le contrôleur ; (2) <strong>intégrité référentielle</strong> — erreurs FK interceptées proprement ; (3) <strong>connexion Singleton</strong> — gardée ouverte entre les appels.</div>`,

    solution: `<pre class="pseudo">public bool Modifier() {                                // UPDATE d'un livre existant
    string sql = "UPDATE livres SET titre=@titre, annee=@annee, prix_unitaire=@prix WHERE livre_id=@id";
    try {
        MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
        MySqlCommand cmd = new MySqlCommand(sql, c);
        cmd.Parameters.AddWithValue("@titre", Titre);   // nouvelles valeurs
        cmd.Parameters.AddWithValue("@annee", Annee);
        cmd.Parameters.AddWithValue("@prix", PrixUnitaire);
        cmd.Parameters.AddWithValue("@id", LivreId);    // cible : la clé primaire
        return cmd.ExecuteNonQuery() &gt; 0;               // vrai si 1 ligne modifiée
    } catch (MySqlException) { return false; }
}

public bool Supprimer() {                               // DELETE (id seul)
    string sql = "DELETE FROM livres WHERE livre_id = @id";
    try {
        MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
        MySqlCommand cmd = new MySqlCommand(sql, c);
        cmd.Parameters.AddWithValue("@id", LivreId);    // cible la ligne
        return cmd.ExecuteNonQuery() &gt; 0;
    } catch (MySqlException) { return false; }
}

// Main : boucle do-while + switch + try-catch (voir théorie)</pre>
