<h3>1. Pourquoi valider dans l'IHM ?</h3>
<p>La base a ses contraintes (<code>CHECK</code>, <code>NOT NULL</code>, FK), mais mieux vaut <strong>prévenir</strong> que guérir : valider côté application donne un <em>retour immédiat</em> à l'utilisateur, évite des allers-retours réseau inutiles et des messages d'erreur techniques. On vérifie donc chaque <code>TextBox</code> <em>avant</em> d'appeler le Repository.</p>
<div class="tip">Deux barrières complémentaires : la validation applicative (rapide, conviviale) et les contraintes SQL (dernière garantie d'intégrité). Les deux se renforcent.</div>

<h3>2. Les expressions régulières (regex)</h3>
<p>Une <strong>expression régulière</strong> (regex) est un <em>motif</em> qui décrit la forme attendue d'un texte. Symboles de base : <code>\\d</code> (un chiffre), <code>[A-Z]</code> (une majuscule), <code>+</code> (un ou plusieurs), <code>{2,}</code> (au moins 2), <code>^</code> (début), <code>$</code> (fin).</p>
<div class="tip">En C#, deux écritures possibles pour un motif : la <strong>chaîne verbatim</strong> préfixée par <code>@</code>, où l'antislash est littéral — on écrit <code>@"\\d"</code> —, ou la chaîne classique où il faut le doubler — <code>"\\\\d"</code>. La chaîne verbatim <code>@"..."</code> est recommandée : plus lisible, moins d'erreurs.</div>

<h3>3. La classe Regex et IsMatch</h3>
<p>Les regex vivent dans l'espace de noms <code>System.Text.RegularExpressions</code>. Deux classes : <strong>Regex</strong> (le motif) et <strong>Match</strong> (le résultat). Pour valider une chaîne entière, le plus simple est la méthode statique <code>Regex.IsMatch(chaine, motif)</code>.</p>
<pre class="pseudo">string email = champEmail.Text;
string motif = @"^[\\w.-]+@[\\w.-]+\\.[a-z]{2,}$";     // motif d'un e-mail simple (chaîne verbatim)
if (!Regex.IsMatch(email, motif)) {                     // la chaîne ne correspond pas
    Alerte("E-mail invalide.");                         // on prévient
    return;                                             // et on stoppe l'insertion
}</pre>
<div class="tip">Décodage du motif e-mail : des caractères, un <code>@</code>, un domaine, un point, puis au moins deux lettres. Grâce aux ancres <code>^</code> et <code>$</code>, <code>IsMatch</code> exige que <em>toute</em> la chaîne colle au motif (sans elles, il suffirait qu'un fragment corresponde).</div>

<h3>4. Valider avant d'insérer</h3>
<p>On regroupe les vérifications dans une méthode qui renvoie <code>true</code> si tout est correct. Le bouton n'appelle le Repository que si la validation passe.</p>
<pre class="pseudo">private bool SaisieValide() {                           // renvoie true si tout est bon
    if (string.IsNullOrWhiteSpace(champTitre.Text)) {   // titre obligatoire
        Alerte("Le titre est obligatoire."); return false;
    }
    if (!Regex.IsMatch(champPrix.Text, @"^\\d+(\\.\\d{1,2})?$")) {   // prix : nombre, 2 décimales max
        Alerte("Prix invalide (ex : 18.50)."); return false;
    }
    return true;                                         // toutes les règles respectées
}
// btnAjouter : if (!SaisieValide()) return;  puis repo.Creer(...)</pre>

<h3>5. Cas classiques et bonnes pratiques</h3>
<ul>
<li><strong>Champ obligatoire</strong> : <code>string.IsNullOrWhiteSpace(champ.Text)</code> détecte un champ vide.</li>
<li><strong>Nombre positif</strong> : motif <code>@"^\\d+(\\.\\d{1,2})?$"</code> pour un prix.</li>
<li><strong>Année</strong> : <code>@"^\\d{4}$"</code> pour exactement quatre chiffres.</li>
</ul>
<div class="tip">Bonnes pratiques : pré-compiler un <code>new Regex(motif)</code> réutilisé dans une boucle ; tester ses motifs sur un outil comme Regex101 ; se méfier du <code>.*</code> « gourmand » (préférer <code>.*?</code> « paresseux » au besoin).</div>`,

}

btnAjouter.Click += (s, e) =&gt; {

};</pre>
<p>Les données sales sont arrêtées à la porte. Demain : les requêtes métier (commissions) qui donnent tout son sens au projet.</p>`
