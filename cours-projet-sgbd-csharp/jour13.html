<h3>1. La commande (MySqlCommand)</h3>
<p>Une <strong>MySqlCommand</strong> est l'objet qui porte une requête SQL et l'envoie à la base. On la construit avec le texte SQL et la connexion. Pour une lecture, on appelle <code>ExecuteReader()</code>, qui renvoie un <strong>MySqlDataReader</strong>.</p>
<pre class="pseudo">using var conn = DatabaseConnection.CreerConnexion();  // fabrique (jour 12)
conn.Open();                                           // ouverture
using var cmd = new MySqlCommand("SELECT * FROM livres", conn);   // la commande + la connexion
using var reader = cmd.ExecuteReader();                // ExecuteReader pour un SELECT</pre>
<div class="tip"><code>ExecuteReader</code> sert aux lectures (SELECT) et renvoie un lecteur. Pour modifier des données (INSERT, UPDATE, DELETE), on utilisera <code>ExecuteNonQuery</code> (jour 15). Avec le provider SQL Server, ces classes s'appellent <code>SqlCommand</code> et <code>SqlDataReader</code> : même principe.</div>

<h3>2. Le DataReader : un curseur sur les lignes</h3>
<p>Un <strong>MySqlDataReader</strong> est un <strong>flux</strong> de résultats en lecture seule, parcouru vers l'avant. Il agit comme un <strong>curseur</strong> qui pointe sur les lignes. La méthode <code>Read()</code> avance d'une ligne et renvoie <code>false</code> quand il n'y en a plus.</p>
<pre class="pseudo">while (reader.Read()) {                                // avance ligne par ligne tant qu'il y en a
    // ici, reader pointe sur une ligne : on peut lire ses colonnes
}</pre>

<h3>3. Extraire les colonnes avec le bon type</h3>
<p>On lit chaque colonne avec la méthode <code>GetXxx</code> correspondant à son type SQL, par nom de colonne :</p>
<pre class="pseudo">reader.GetInt32("livre_id")         // colonne INT     -> int C#
reader.GetString("titre")           // colonne VARCHAR -> string
reader.GetDecimal("prix_unitaire")  // colonne DECIMAL -> decimal (ideal pour l'argent)
reader.GetBoolean("est_disponible") // colonne BOOLEAN/TINYINT(1) -> bool (0=false, 1=true)</pre>
<div class="warn">Utilisez la méthode qui correspond au type SQL de la colonne. Un DECIMAL se lit avec <code>GetDecimal</code>, pas <code>GetDouble</code> ; un TINYINT(1) avec <code>GetBoolean</code>. Se tromper de type provoque une exception de lecture.</div>

<h3>4. Un exemple complet de lecture</h3>
<p>Lisons tous les livres de la bibliothèque et affichons-les :</p>
<pre class="pseudo">try {
    using var conn = DatabaseConnection.CreerConnexion();  // connexion (using = fermeture auto)
    conn.Open();
    using var cmd = new MySqlCommand(                       // la commande
        "SELECT livre_id, titre, prix_unitaire FROM livres", conn);
    using var reader = cmd.ExecuteReader();                 // le lecteur (using aussi)
    while (reader.Read()) {                                 // parcourt chaque ligne
        int id = reader.GetInt32("livre_id");              // lit l'identifiant
        string titre = reader.GetString("titre");          // lit le titre
        decimal prix = reader.GetDecimal("prix_unitaire"); // lit le prix
        Console.WriteLine(id + " - " + titre + " : " + prix + " EUR");   // affiche la ligne
    }
}
catch (MySqlException e) {                                  // erreur de lecture
    Console.WriteLine("Erreur : " + e.Message);
}</pre>

<h3>5. Fermer les outils avec using</h3>
<p>La connexion, la commande et le lecteur se déclarent tous avec <strong>using</strong> : ils sont fermés automatiquement en fin de bloc, ce qui évite les <strong>fuites de ressources</strong>.</p>
<pre class="pseudo">// using sur conn, cmd et reader : tout est ferme automatiquement,
// et la connexion est rendue au pool a la sortie du bloc.</pre>
<div class="tip">Pour une simple lecture totale (SELECT * sans filtre saisi par l'utilisateur), une commande sans paramètre suffit. Dès qu'un filtre vient d'une saisie (WHERE ... = valeur_utilisateur), il faudra une <strong>requête paramétrée</strong> — c'est le sujet de demain.</div>`,

}
