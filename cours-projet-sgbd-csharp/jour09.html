  theory: `
<h3>1. Valider un e-mail de client</h3>
<p>La table <code>clients</code> a une colonne <code>email</code>. Avant d'insérer, on valide sa forme avec une regex : du texte, un <code>@</code>, un domaine, un point, une extension.</p>
<pre class="pseudo">// Motif email (simple mais efficace) :  utilisateur@domaine.ext
string motif = @"^[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}$";   // en C# : chaine verbatim, pas de double antislash
bool ok = Regex.IsMatch("alice@email.com", motif);    // true
// ^          debut
// [\w.+-]+  partie locale (lettres, chiffres, . + -)
// @          arobase obligatoire
// [\w-]+    nom de domaine
// \.        un point (echappe, sinon . = n'importe quel caractere)
// [a-zA-Z]{2,}  extension d'au moins 2 lettres
// $          fin</pre>
<div class="tip">On échappe le point avec <code>\.</code> car, seul, le point signifie « n'importe quel caractère ». Dans un email, on veut un vrai point.</div>

<h3>2. Le lookahead : vérifier sans consommer</h3>
<p>Pour un mot de passe fort, il faut plusieurs conditions <em>en même temps</em> : une majuscule, un chiffre, un caractère spécial, une longueur. Le <strong>lookahead positif</strong> <code>(?=...)</code> vérifie une condition sans avancer dans la chaîne :</p>
<pre class="pseudo">@"^(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!])(?=\S+$).{8,}$"
// ^                debut
// (?=.*[A-Z])      il existe au moins une majuscule quelque part
// (?=.*\d)         il existe au moins un chiffre
// (?=.*[@#...])     il existe au moins un caractere special
// (?=\S+$)         aucun espace blanc
// .{8,}            au moins 8 caracteres au total
// $                fin</pre>
<p>Chaque <code>(?=...)</code> « regarde en avant » puis revient au point de départ : les conditions s'empilent sur la même chaîne.</p>

<h3>3. Les groupes de capture</h3>
<p>Les parenthèses <code>()</code> forment des <strong>groupes de capture</strong> : elles isolent des parties du motif pour les récupérer une à une via la collection <code>Groups</code> : <code>m.Groups[1].Value</code>, <code>m.Groups[2].Value</code>...</p>
<pre class="pseudo">Match m = Regex.Match("Vendu le 26/07/2024", @"(\d{2})/(\d{2})/(\d{4})");   // jour / mois / annee
if (m.Success) {
    string jour  = m.Groups[1].Value;   // 26
    string mois  = m.Groups[2].Value;   // 07
    string annee = m.Groups[3].Value;   // 2024
}</pre>

<h3>4. Convertir une date pour la base</h3>
<p>La base attend les dates au format SQL <code>AAAA-MM-JJ</code>, mais l'utilisateur saisit <code>JJ/MM/AAAA</code>. Les groupes de capture permettent la conversion avec <code>Regex.Replace</code> et les références <code>$1</code>, <code>$2</code>, <code>$3</code> :</p>
<pre class="pseudo">string saisie = "26/07/2024";                               // format europeen
string sql = Regex.Replace(saisie, @"(\d{2})/(\d{2})/(\d{4})", "$3-$2-$1");
// $3-$2-$1 remet annee-mois-jour  ->  2024-07-26  (format SQL)</pre>
<div class="warn">Ne jamais insérer une date au petit bonheur : une date mal formée sera rejetée ou mal interprétée par la base. On valide et on convertit d'abord.</div>

<h3>5. Nettoyer un montant</h3>
<p>Les prix (<code>prix_unitaire</code>, <code>prix_final</code>) doivent partir en base avec un point décimal, sans symbole. On extrait le montant, on remplace la virgule par un point et on retire l'euro :</p>
<pre class="pseudo">string brut = "89,90 EUR";                                   // saisie desordonnee
string propre = Regex.Replace(brut, @"[^\d,]", "")           // on ne garde que chiffres et virgule
                     .Replace(",", ".");                     // virgule -> point decimal
// propre = "89.90"  -> pret pour un DECIMAL(10,2)</pre>
<p><code>[^\d,]</code> signifie « tout sauf un chiffre ou une virgule » : on efface espaces, lettres et symbole monétaire d'un coup. Ces trois recettes — email, date, montant — couvrent l'essentiel des saisies de la bibliothèque.</p>`,

    { type: "qcm", q: "Dans un motif d'email, @ est…", opts: ["Optionnel", "Obligatoire", "Interdit", "Un groupe de capture"], a: 1, exp: "L'arobase sépare la partie locale du domaine." },

    { type: "vf", q: "(?=.*\\d) vérifie qu'il existe au moins un chiffre quelque part.", a: true, exp: "Lookahead : présence d'un chiffre, sans consommer." },
    { type: "qcm", q: "Pourquoi valider un email avant l'insertion en base ?", opts: ["Pour aller plus vite", "Pour garantir une forme correcte et respecter la contrainte UNIQUE proprement", "Pour chiffrer", "Pour créer un index"], a: 1, exp: "On évite d'insérer des adresses invalides dans clients.email." },
    { type: "input", q: "Écris la notation regex pour « exactement 4 chiffres ».", a: ["\\d{4}"], ph: "\\d{...}", exp: "\\d{4}." },
    { type: "vf", q: "$3-$2-$1 dans Regex.Replace réordonne les groupes capturés.", a: true, exp: "On réutilise les captures dans un nouvel ordre." },
    { type: "qcm", q: ".{8,} dans un motif de mot de passe impose…", opts: ["exactement 8 caractères", "au moins 8 caractères", "au plus 8 caractères", "aucun caractère"], a: 1, exp: "{8,} = 8 occurrences minimum." }
  ],
  final: {
    title: "Exercice final — Trois validations clés",

<p>Vos saisies sont propres et prêtes pour la base. Demain, on connecte enfin C# à MySQL avec ADO.NET.</p>`
