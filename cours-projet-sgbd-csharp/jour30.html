<h3>1. La logique métier : les commissions</h3>
<p>Le cœur « métier » de la bibliothèque : chaque <strong>vente</strong> génère une <strong>commission</strong> pour les auteurs du livre vendu. Cette logique vit en partie dans la base (<code>library_db</code>) : un <strong>trigger</strong>, une <strong>procédure stockée</strong> et une <strong>vue SQL</strong>. Notre code C# n'a plus qu'à les appeler.</p>

<h3>2. Le trigger : calcul automatique</h3>
<p>Un <strong>trigger</strong> (déclencheur) est un bloc SQL exécuté <em>automatiquement</em> à un événement. Ici, <code>trg_apres_vente_commission</code> s'exécute <code>AFTER INSERT ON ventes</code> : dès qu'une vente est insérée, il calcule et enregistre la commission de chaque auteur du livre.</p>
<pre class="pseudo">-- Côté C#, on insère juste la vente : le trigger fait le reste tout seul
INSERT INTO ventes (client_id, livre_id, prix_final) VALUES (@c, @l, @p);
-- → le trigger remplit automatiquement commissions_historique</pre>
<div class="tip">Avantage : la règle de calcul (prix × pourcentage / 100) est centralisée dans la base. Le code C# ne recalcule rien : il fait confiance au trigger.</div>

<h3>3. La procédure stockée : régler les commissions</h3>
<p>Une <strong>procédure stockée</strong> est un programme SQL nommé, stocké dans la base, qu'on appelle avec des paramètres. <code>sp_regler_commissions_auteur(p_auteur_id)</code> passe les commissions d'un auteur de <em>EN_ATTENTE</em> à <em>PAYE</em> et renvoie un rapport. En ADO.NET, on l'appelle avec un <code>MySqlCommand</code> dont la propriété <strong><code>CommandType</code></strong> vaut <code>CommandType.StoredProcedure</code>.</p>
<pre class="pseudo">public void ReglerAuteur(int auteurId) {                // règle les commissions d'un auteur
    MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
    MySqlCommand cs = new MySqlCommand("sp_regler_commissions_auteur", c);  // nom de la procédure
    cs.CommandType = CommandType.StoredProcedure;       // on précise : c'est une procédure stockée
    cs.Parameters.AddWithValue("@p_auteur_id", auteurId);   // paramètre d'entrée
    MySqlDataReader rs = cs.ExecuteReader();            // la procédure renvoie un rapport
    // … lire le rapport (nom, montant réglé) …
    rs.Close();                                         // on ferme le lecteur, pas la connexion
}</pre>
<div class="warn">La logique de calcul reste dans MariaDB : le passage à « PAYE » et la somme se font côté serveur, pas en C#. Moins de données transitent sur le réseau, et un seul appel remplace plusieurs requêtes.</div>

<h3>4. La vue SQL : le reporting</h3>
<p>Une <strong>vue SQL</strong> est une « table virtuelle » : une requête <code>SELECT</code> enregistrée sous un nom. Elle ne stocke rien — elle recalcule à la demande. <code>v_etat_commissions</code> synthétise, par auteur, le total à payer et le total déjà payé.</p>
<pre class="pseudo">public List&lt;EtatCommission&gt; EtatCommissions() {         // lecture du reporting
    string sql = "SELECT * FROM v_etat_commissions";    // aussi simple qu'une table réelle
    // … mapping des colonnes calculées (total_a_payer, total_deja_paye) …
}</pre>
<div class="tip">On l'intègre au MVC comme une table, mais <em>sans</em> Creer/Modifier/Supprimer : une vue avec des <code>SUM</code>/<code>GROUP BY</code> est en <strong>lecture seule</strong>. Table = objet CRUD complet ; Vue SQL = objet de synthèse (lecture).</div>

<h3>5. Vue vs procédure : consulter ou agir</h3>
<ul>
<li>La <strong>vue</strong> <code>v_etat_commissions</code> sert à <em>consulter</em> : une fenêtre sur l'état des dettes.</li>
<li>La <strong>procédure</strong> <code>sp_regler_commissions_auteur</code> sert à <em>agir</em> : le bouton qui déclenche le paiement.</li>
</ul>
<div class="tip">Force de l'abstraction : si la formule de calcul change, on modifie la vue ou la procédure côté SQL — <em>aucune recompilation C#</em>. Le code C# se contente d'envoyer un ID et de recevoir un résultat propre.</div>`,

public List&lt;EtatCommission&gt; EtatCommissions() {
    List&lt;EtatCommission&gt; liste = new List&lt;EtatCommission&gt;();

        liste.Add(ec);
    }
    rs.Close();
    return liste;
}</pre>
