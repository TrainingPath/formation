var DAY = {

  title: "La validation des données côté application",
  subtitle: "Normaliser, filtrer, rejeter : bâtir un vrai garde-barrière.",
  theory: `
<h3>1. Valider côté application</h3>
<p><strong>Valider côté application</strong>, c'est vérifier chaque donnée dans le code C# <strong>avant</strong> qu'elle n'atteigne la base. La base a ses propres contraintes (NOT NULL, CHECK...), mais elles arrivent trop tard et donnent des erreurs peu claires. La première ligne de défense, c'est votre programme.</p>
<div class="tip">Deux protections complémentaires : la <strong>validation applicative</strong> (C#, aujourd'hui) et la <strong>commande paramétrée</strong> (base, plus tard). Les deux ensemble forment une défense solide.</div>

<h3>2. Normaliser la saisie</h3>
<p><strong>Normaliser</strong>, c'est mettre la saisie dans une forme standard avant de la contrôler. Trois gestes classiques du TP « Garde-Barrière » :</p>
<pre class="pseudo">string s = saisie.Trim();          // Trim() : enleve les espaces en debut et fin
s = s.ToLower();                   // ToLower() : passe tout en minuscules
// (parfois ToUpper() selon le champ, ex. un code d'inventaire)</pre>
<p>La normalisation évite qu'une même valeur (« Alice », «  alice  », « ALICE ») soit traitée de trois façons différentes.</p>

<h3>3. Détecter et alerter</h3>
<p>On repère les signatures évidentes d'injection et on affiche une <strong>alerte</strong> :</p>
<pre class="pseudo">if (s.Contains(";") || s.Contains("--")) {                       // caracteres SQL suspects
    Console.WriteLine("ALERTE : tentative d'injection detectee !");   // message d'alerte
    return false;                                                // on rejette la saisie
}</pre>

<h3>4. Filtrer par whitelist et lever une exception</h3>
<p>Le cœur de la validation : n'accepter que ce qui correspond à une <strong>liste autorisée</strong>. Si un caractère spécial arrive, on lève une <strong>exception</strong> (un objet qui signale une erreur et interrompt le traitement) :</p>
<pre class="pseudo">using System.Text.RegularExpressions;                            // pour Regex
public static string Valider(string nom) {                       // valide un nom de produit/livre
    string s = nom.Trim();                                       // normalisation
    if (!Regex.IsMatch(s, @"^[a-zA-Z0-9 ]+$")) {                 // whitelist : lettres, chiffres, espace
        throw new ArgumentException("Caractere non autorise dans : " + nom);   // on lance une exception
    }
    return s;                                                    // saisie validee
}</pre>
<p>Lever une exception force l'appelant à gérer le cas d'erreur : la donnée invalide n'ira jamais jusqu'à la base.</p>

<h3>5. Choisir la bonne technique</h3>
<p>On résume trois approches et leur efficacité :</p>
<pre class="pseudo">Echappement   : Replace("'", "''")              // neutralise l'apostrophe
Nettoyage     : Replace(";", "")                // retire un caractere dangereux
Validation    : Regex.IsMatch(s, @"^[a-z]+$")   // n'accepte que le connu-bon (whitelist) -- le plus sur</pre>
<div class="warn">La règle d'or, répétée : <strong>ne faites jamais confiance à l'utilisateur</strong>. Pour un champ « nom de produit », autorisez uniquement <code>[a-zA-Z0-9 ]</code> ; si un caractère spécial arrive, lancez une exception. La validation applicative complète, mais ne remplace pas, la <strong>commande paramétrée</strong>.</div>
<p>Aujourd'hui, on structure ce garde-barrière avec du texte fixe (<code>Contains</code>, <code>Trim</code>, <code>Regex.IsMatch</code>). Demain, on approfondit les <strong>expressions régulières</strong>, bien plus précises que de simples <code>Contains</code>.</p>`,
  exercises: [
    { type: "input", q: "Quelle méthode string enlève les espaces en début et fin de saisie en C# ?", a: ["trim", "trim()"], ph: "méthode C#", exp: "Trim() supprime les espaces de bordure." },
    { type: "qcm", q: "Pourquoi valider côté application et pas seulement côté base ?", opts: ["Pour aller plus lentement", "Pour arrêter les données invalides au plus tôt, avec des messages clairs", "Pour éviter d'écrire du SQL", "Pour chiffrer la base"], a: 1, exp: "La validation applicative est la première ligne de défense." },
    { type: "vf", q: "Normaliser une saisie, c'est la mettre dans une forme standard avant de la contrôler.", a: true, exp: "Ex. Trim + ToLower pour uniformiser." },
    { type: "input", q: "Quelle méthode passe une chaîne entièrement en minuscules en C# ?", a: ["tolower", "tolower()"], ph: "méthode C#", exp: "ToLower()." },
    { type: "qcm", q: "Que fait throw new ArgumentException(...) ?", opts: ["Affiche un menu", "Lève une exception pour signaler une donnée invalide", "Ferme la base", "Crée une table"], a: 1, exp: "Elle signale l'erreur et interrompt le traitement." },
    { type: "vf", q: "La validation par whitelist est considérée comme la plus sûre.", a: true, exp: "On n'accepte que le connu-bon ; tout le reste est rejeté." },
    { type: "input", q: "Quelle méthode teste si une chaîne contient une sous-chaîne (ex. \";\") en C# ?", a: ["contains", "contains()"], ph: "méthode C#", exp: "Contains(...) renvoie true si la sous-chaîne est présente." },
    { type: "qcm", q: "Une exception sert à…", opts: ["Accélérer la base", "Signaler une erreur et interrompre le traitement", "Trier des données", "Chiffrer un mot de passe"], a: 1, exp: "L'exception force la prise en charge de l'erreur." },
    { type: "input", q: "Écris la regex qui n'autorise que lettres, chiffres et espaces (au moins un caractère).", a: ["^[a-za-z0-9 ]+$", "^[a-z0-9 ]+$"], ph: "^[...]+$", exp: "^[a-zA-Z0-9 ]+$." },
    { type: "vf", q: "La validation applicative remplace totalement la commande paramétrée.", a: false, exp: "Elle la complète ; la commande paramétrée reste indispensable." },
    { type: "qcm", q: "L'approche « nettoyage » correspond à…", opts: ["Regex.IsMatch(...)", "Replace(\";\", \"\")", "Trim()", "ToUpper()"], a: 1, exp: "Le nettoyage retire des caractères dangereux." },
    { type: "qcm", q: "Pourquoi normaliser avant de valider ?", opts: ["Pour rendre le code plus long", "Pour qu'une même valeur écrite différemment soit traitée pareil", "Pour supprimer la base", "Pour créer un index"], a: 1, exp: "Uniformiser évite les incohérences (espaces, casse)." },
    { type: "input", q: "L'approche « échappement » double les apostrophes : Replace(\"'\", \"??\"). Complète les deux caractères.", a: ["''"], ph: "deux caractères", exp: "Replace(\"'\", \"''\") double l'apostrophe." },
    { type: "vf", q: "Un message d'alerte doit prévenir en cas de caractères SQL suspects (; ou --).", a: true, exp: "Détecter et alerter fait partie du garde-barrière." },
    { type: "qcm", q: "La règle d'or de la validation :", opts: ["Faire confiance à l'utilisateur", "Ne jamais faire confiance à l'utilisateur", "Tout autoriser", "Désactiver les contraintes"], a: 1, exp: "Ne jamais faire confiance à l'utilisateur." }
  ],
  final: {
    title: "Exercice final — Structurer la validation",
    intro: `<p>On assemble normalisation, alerte et whitelist.</p>`,
    questions: [
      { type: "input", q: "Méthode qui enlève les espaces de bordure :", a: ["trim", "trim()"], ph: "méthode", exp: "Trim()." },
      { type: "qcm", q: "Le filtre le plus sûr est :", opts: ["l'échappement", "le nettoyage", "la validation par whitelist", "aucun"], a: 2, exp: "La whitelist n'accepte que le connu-bon." },
      { type: "input", q: "Instruction C# qui signale une donnée invalide :", a: ["throw", "throw new argumentexception"], ph: "mot-clé", exp: "throw (lève une exception)." },
      { type: "vf", q: "On normalise (Trim, casse) avant de contrôler la saisie.", a: true, exp: "Normaliser d'abord, valider ensuite." },
      { type: "vf", q: "Validation applicative et commande paramétrée sont complémentaires.", a: true, exp: "Deux couches de défense qui se renforcent." }
    ],
    solution: `<pre class="pseudo">using System;
using System.Text.RegularExpressions;

public static string ValiderNomClient(string saisie) {   // valide un nom de client
    if (saisie == null) throw new ArgumentException("Saisie vide.");  // garde-fou null
    string s = saisie.Trim();                             // 1) normaliser : espaces de bordure
    if (s.Contains(";") || s.Contains("--")) {            // 2) alerter : caracteres SQL suspects
        throw new ArgumentException("Alerte injection : " + saisie);
    }
    if (!Regex.IsMatch(s, @"^[a-zA-Z '-]+$")) {           // 3) whitelist : lettres, espace, apostrophe, tiret
        throw new ArgumentException("Caractere non autorise.");
    }
    return s;                                             // saisie propre, prete a etre traitee
}</pre>
<p>Le garde-barrière est structuré. Demain : les expressions régulières, l'outil de précision pour ces validations.</p>`
  }
};
