<h3>1. DataGridView : le tableau de données</h3>
<p>Le <strong>DataGridView</strong> affiche une liste d'objets sous forme de tableau (l'équivalent du <code>TableView</code> de JavaFX). On lui fournit ses données via la propriété <strong><code>DataSource</code></strong>. Par défaut, il crée automatiquement une colonne par propriété publique de l'objet.</p>
<pre class="pseudo">DataGridView grille = new DataGridView();              // tableau de données
grille.DataSource = liste;                             // la source : une liste d'objets Livre
// une colonne est générée pour chaque propriété publique (Id, Titre, Prix…)</pre>

<h3>2. La liaison de données (data binding) et les colonnes</h3>
<p>La <strong>liaison de données</strong> (data binding) connecte l'affichage aux objets. Le DataGridView lit les <strong>propriétés publiques</strong> par <em>réflexion</em> (l'introspection C#). Pour maîtriser les colonnes, on met <code>AutoGenerateColumns = false</code> et on relie chaque colonne à une propriété via <code>DataPropertyName</code>.</p>
<pre class="pseudo">grille.AutoGenerateColumns = false;                    // on choisit nous-mêmes les colonnes
DataGridViewTextBoxColumn colTitre = new DataGridViewTextBoxColumn();
colTitre.HeaderText = "Titre";                          // en-tête affiché
colTitre.DataPropertyName = "Titre";                    // lié à la propriété Titre du modèle
grille.Columns.Add(colTitre);                           // on ajoute la colonne au tableau</pre>
<div class="warn">Si la classe modèle n'a pas de propriété publique correspondant au <code>DataPropertyName</code>, la colonne reste <strong>vide</strong>. Chaque colonne liée exige sa propriété dans le modèle — exactement comme le TableView de JavaFX exigeait un getter.</div>

<h3>3. BindingList : la liste « surveillée »</h3>
<p>Une <code>List&lt;Livre&gt;</code> ordinaire ne prévient pas la grille quand elle change. La <strong>BindingList&lt;Livre&gt;</strong> est une liste <em>observable</em> (l'équivalent de l'ObservableList JavaFX) : dès qu'on y ajoute ou retire un élément, le DataGridView se met à jour automatiquement.</p>
<pre class="pseudo">BindingList&lt;Livre&gt; donnees = new BindingList&lt;Livre&gt;(repo.LireTout());  // liste observable
grille.DataSource = donnees;                            // liaison (rafraîchissement auto)</pre>
<div class="tip">Avec une simple <code>List&lt;Livre&gt;</code>, ajouter un objet ne rafraîchit pas l'affichage. La <code>BindingList</code>, elle, notifie la grille : c'est tout l'intérêt du « observable ».</div>

<h3>4. TextBox et Label : la saisie</h3>
<p>Le <strong>TextBox</strong> est un champ de saisie d'une ligne ; sa valeur se lit avec la propriété <code>.Text</code>. Le <strong>Label</strong> affiche un texte fixe (souvent une étiquette devant un champ).</p>
<pre class="pseudo">TextBox champTitre = new TextBox();                     // champ de saisie
champTitre.PlaceholderText = "Titre du livre";          // texte d'invite grisé
string saisie = champTitre.Text;                        // récupère ce que l'utilisateur a tapé</pre>

<h3>5. Button et disposition (FlowLayoutPanel / TableLayoutPanel)</h3>
<p>Le <strong>Button</strong> déclenche une action au clic (nous relierons l'événement <code>Click</code> demain). Pour organiser les contrôles, on utilise des <strong>conteneurs de disposition</strong> : <code>FlowLayoutPanel</code> (aligne automatiquement les contrôles, en ligne ou en colonne), <code>TableLayoutPanel</code> (grille de cellules), ou les propriétés <code>Dock</code>/<code>Anchor</code>.</p>
<pre class="pseudo">Button btnAjouter = new Button();                       // un bouton d'action
btnAjouter.Text = "Ajouter";
FlowLayoutPanel formulaire = new FlowLayoutPanel();     // ligne : champ + bouton
formulaire.Controls.Add(champTitre);
formulaire.Controls.Add(btnAjouter);
grille.Dock = DockStyle.Fill;                           // le tableau remplit l'espace restant
this.Controls.Add(grille);
this.Controls.Add(formulaire);                          // formulaire en haut, tableau dessous</pre>
<div class="tip">Assemblage typique d'un écran de gestion : en haut un <code>FlowLayoutPanel</code> de saisie (champs + boutons), en dessous un <code>DataGridView</code> qui liste les données. Dans le concepteur, on glisse-dépose ces contrôles depuis la Boîte à outils.</div>`,
