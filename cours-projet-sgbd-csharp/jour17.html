  theory: `
<h3>1. Rappel : l'architecture MVC</h3>
<p>Le <strong>MVC</strong> (Modèle-Vue-Contrôleur) est une <em>architecture logicielle</em> : elle découpe l'application en trois responsabilités séparées, pour faciliter la maintenance et l'évolution.</p>
<ul>
<li><strong>M — Modèle</strong> : gère les données et la logique d'accès à la base (le SQL).</li>
<li><strong>V — Vue</strong> : gère l'interface. En mode console, ce sont les <code>Console.WriteLine()</code> et les saisies <code>Console.ReadLine()</code>.</li>
<li><strong>C — Contrôleur</strong> : fait le lien entre la Vue et le Modèle. Il reçoit les ordres de la Vue et pilote le Modèle.</li>
</ul>
<p>Aujourd'hui, nous commençons par le <strong>Modèle</strong>, appliqué à notre fil rouge : la base <code>library_db</code> (livres, auteurs, ventes, commissions), via <strong>ADO.NET</strong> et le connecteur <code>MySql.Data</code>.</p>

<h3>2. La classe modèle (entité) « intelligente »</h3>
<p>Une <strong>classe modèle</strong> (ou <em>entité</em>) est une classe C# ordinaire qui représente une <em>ligne d'une table</em> de la base : à chaque colonne correspond une <strong>propriété</strong>. Une propriété est un membre public exposant une donnée avec un accesseur de lecture <code>get</code> et d'écriture <code>set</code> : on écrit <code>public string Nom { get; set; }</code> et le compilateur génère le champ privé pour nous.</p>
<p>Dans ce cours, notre entité est <strong>intelligente</strong> : contrairement à un simple sac de données, elle <em>connaît sa table SQL</em> et porte ses propres méthodes CRUD. Ce style s'appelle <strong>Active Record</strong> : l'objet sait se lire, se sauvegarder et se supprimer tout seul. La Vue et le Contrôleur n'écrivent jamais de SQL.</p>
<div class="tip">CRUD = les quatre opérations de base sur des données : <strong>C</strong>reate (créer), <strong>R</strong>ead (lire), <strong>U</strong>pdate (mettre à jour), <strong>D</strong>elete (supprimer).</div>

<h3>3. Propriétés et constructeur : le modèle Section</h3>
<p>Commençons par la table la plus simple, <code>sections</code> (colonnes <code>section_id</code>, <code>nom_section</code>). Chaque colonne devient une propriété.</p>
<pre class="pseudo">public class Section {                                  // modèle : représente la table sections
    public int SectionId { get; set; }                  // colonne section_id (clé primaire)
    public string NomSection { get; set; }              // colonne nom_section

    public Section() { }                                // constructeur vide : utile pour la lecture
    public Section(string nomSection) {                 // constructeur de création
        this.NomSection = nomSection;                   // on mémorise le nom reçu
    }
}</pre>
<div class="tip">En C#, on n'écrit pas de <code>getNom()</code>/<code>setNom()</code> : la <strong>propriété auto-implémentée</strong> <code>{ get; set; }</code> remplace le couple getter/setter du Java.</div>

<h3>4. Les quatre méthodes CRUD</h3>
<p>L'entité encapsule les requêtes SQL. Voici la création et la lecture. La connexion est obtenue par le <strong>Singleton</strong> <code>DatabaseConnection</code> (une instance unique, partagée par toute l'application). On utilise un <strong>MySqlCommand</strong> (commande SQL) avec des <strong>paramètres</strong> nommés (<code>@nom</code>) pour se protéger des injections SQL.</p>
<pre class="pseudo">public bool Creer() {                                   // insère l'objet courant dans la base
    string sql = "INSERT INTO sections (nom_section) VALUES (@nom)";  // requête paramétrée
    try {
        MySqlConnection conn = DatabaseConnection.GetInstance().GetConnection();  // connexion unique
        MySqlCommand cmd = new MySqlCommand(sql, conn);        // commande liée à la connexion
        cmd.Parameters.AddWithValue("@nom", this.NomSection);  // on injecte le nom à la place de @nom
        int lignes = cmd.ExecuteNonQuery();             // exécute l'INSERT ; renvoie le nb de lignes
        return lignes &gt; 0;                              // vrai si une ligne a bien été insérée
    } catch (MySqlException) {                           // en cas d'erreur SQL
        return false;                                   // on signale l'échec au contrôleur
    }
}

public List&lt;Section&gt; LireTout() {                       // renvoie toutes les sections
    List&lt;Section&gt; liste = new List&lt;Section&gt;();          // liste résultat (vide au départ)
    string sql = "SELECT * FROM sections";              // on lit toute la table
    try {
        MySqlConnection conn = DatabaseConnection.GetInstance().GetConnection();
        MySqlCommand cmd = new MySqlCommand(sql, conn);
        MySqlDataReader rs = cmd.ExecuteReader();       // exécute le SELECT ; renvoie un lecteur de lignes
        while (rs.Read()) {                             // pour chaque ligne du résultat
            Section s = new Section();                  // on crée un objet vide
            s.SectionId = rs.GetInt32("section_id");    // on remplit depuis la colonne
            s.NomSection = rs.GetString("nom_section");
            liste.Add(s);                               // on ajoute l'objet à la liste
        }
        rs.Close();                                     // on ferme le lecteur (PAS la connexion)
    } catch (MySqlException) { }
    return liste;                                       // on renvoie la liste d'objets C#
}</pre>
<p><code>MettreAJour()</code> (UPDATE … SET … WHERE section_id = @id) et <code>Supprimer()</code> (DELETE … WHERE section_id = @id) suivent le même schéma : un <code>MySqlCommand</code> paramétré, puis <code>ExecuteNonQuery()</code>.</p>

<h3>5. Le Singleton : ne pas fermer la connexion</h3>
<p>Puisque la connexion est un <strong>Singleton</strong> (instance unique), la « porte » de la base doit rester ouverte tant que l'application tourne. On ferme le <strong>MySqlDataReader</strong> (le lecteur de lignes) après chaque lecture, mais jamais la <code>MySqlConnection</code>.</p>
<div class="warn">En ADO.NET, tant qu'un <code>MySqlDataReader</code> est ouvert, la connexion est occupée : impossible de lancer une autre commande. Il faut donc appeler <code>rs.Close()</code> (ou l'entourer d'un bloc <code>using</code>) avant l'opération suivante — mais on ne ferme pas la connexion partagée.</div>
<div class="tip">Le grand avantage : la Vue et le Contrôleur ignorent totalement le SQL. Si demain on passe de la console à Windows Forms, seule la Vue change — le Modèle reste identique.</div>`,

    ],
    solution: `<pre class="pseudo">public class Section {                                  // modèle de la table sections
    public int SectionId { get; set; }                  // colonne section_id
    public string NomSection { get; set; }              // colonne nom_section

    public Section() { }                                // constructeur vide (lecture)
    public Section(string nom) { this.NomSection = nom; }  // constructeur de création

    public bool Creer() {                               // CREATE
        string sql = "INSERT INTO sections (nom_section) VALUES (@nom)";
        try {
            MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
            MySqlCommand cmd = new MySqlCommand(sql, c);

            return n &gt; 0;                               // vrai si insertion réussie
        } catch (MySqlException) { return false; }      // échec signalé au contrôleur
    }

    public List&lt;Section&gt; LireTout() {                   // READ
        List&lt;Section&gt; l = new List&lt;Section&gt;();
        try {
            MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();

                l.Add(x);
            }
            rs.Close();                                 // lecteur fermé, connexion gardée
        } catch (MySqlException) { }
        return l;
    }
}</pre>
<p>L'entité porte ses données ET son CRUD. Demain : le Contrôleur et la Vue console qui l'utilisent.</p>`
