  title: "CRUD graphique : modifier et supprimer",
  subtitle: "Sélectionner une ligne, la modifier ou la retirer en toute sécurité.",
  theory: `
<h3>1. Récupérer la ligne sélectionnée</h3>
<p>Modifier ou supprimer suppose de savoir <em>quelle</em> ligne. Dans un <code>DataGridView</code>, la ligne active est <code>CurrentRow</code>, et l'objet qui lui est lié s'obtient par <strong><code>DataBoundItem</code></strong> (à convertir dans le bon type avec <code>as</code>).</p>
<pre class="pseudo">Livre selection = grille.CurrentRow?.DataBoundItem as Livre;   // le livre cliqué (ou null)
if (selection == null) {                                // aucune ligne choisie
    Alerte("Sélectionne d'abord un livre.");            // on prévient l'utilisateur
    return;                                             // et on arrête l'action
}</pre>
<div class="warn">Toujours tester <code>== null</code> : si l'utilisateur clique « Modifier » sans avoir sélectionné de ligne, la sélection vaut <code>null</code> et l'on éviterait une <code>NullReferenceException</code>. L'opérateur <code>?.</code> (accès conditionnel) protège aussi si <code>CurrentRow</code> est nul.</div>

<h3>2. Pré-remplir le formulaire</h3>
<p>Pour modifier, on recopie d'abord les valeurs de la ligne sélectionnée dans les <code>TextBox</code>, grâce aux propriétés de l'objet. L'utilisateur voit l'existant, puis corrige.</p>
<pre class="pseudo">champTitre.Text = selection.Titre;                      // affiche le titre actuel
champAnnee.Text = selection.Annee.ToString();           // int → texte
champPrix.Text = selection.Prix.ToString();             // decimal → texte</pre>
<div class="tip"><code>x.ToString()</code> convertit un nombre en texte : l'opération inverse de <code>int.Parse</code>/<code>decimal.Parse</code>.</div>

<h3>3. Le bouton Modifier</h3>
<p>Au clic, on reporte les nouvelles saisies dans l'objet, dont l'<code>Id</code> cible déjà le <code>WHERE</code>, puis on appelle <code>repo.Update(livre)</code>.</p>
<pre class="pseudo">btnModifier.Click += (s, e) =&gt; {
    Livre sel = grille.CurrentRow?.DataBoundItem as Livre;
    if (sel == null) { Alerte("Sélectionne un livre."); return; }
    try {
        sel.Titre = champTitre.Text;                    // nouvelles valeurs
        sel.Annee = int.Parse(champAnnee.Text);
        sel.Prix = decimal.Parse(champPrix.Text);
        repo.Update(sel);                               // UPDATE ... WHERE livre_id = sel.Id
        RafraichirListe();                              // le tableau reflète le changement
    } catch (FormatException) { Alerte("Année/prix invalides."); }
      catch (MySqlException ex) { Alerte("Erreur base : " + ex.Message); }
};</pre>

<h3>4. Le bouton Supprimer + confirmation</h3>
<p>La suppression est irréversible : on demande d'abord <strong>confirmation</strong> avec une <code>MessageBox</code> à deux boutons (<code>MessageBoxButtons.YesNo</code>), qui renvoie un <strong><code>DialogResult</code></strong>, puis on appelle <code>repo.Supprimer(id)</code>.</p>
<pre class="pseudo">btnSupprimer.Click += (s, e) =&gt; {
    Livre sel = grille.CurrentRow?.DataBoundItem as Livre;
    if (sel == null) { Alerte("Sélectionne un livre."); return; }
    DialogResult rep = MessageBox.Show("Supprimer « " + sel.Titre + " » ?",   // question
                       "Confirmation", MessageBoxButtons.YesNo, MessageBoxIcon.Question);
    if (rep == DialogResult.Yes) {                       // l'utilisateur a confirmé
        try {
            repo.Supprimer(sel.Id);                     // DELETE ... WHERE livre_id = @id
            RafraichirListe();                          // la ligne disparaît
        } catch (MySqlException ex) { Alerte("Erreur : " + ex.Message); }
    }
};</pre>

<h3>5. Attention aux dépendances</h3>
<p>Supprimer un livre lié à des ventes peut être refusé par la base (clé étrangère). Selon la contrainte (<code>ON DELETE CASCADE</code> ou non), l'opération réussit ou lève une <code>MySqlException</code>. Le contrôleur affiche alors un message clair.</p>
<div class="tip">Bilan du CRUD graphique : <em>afficher</em> (rafraîchir), <em>ajouter</em> (formulaire + Creer), <em>modifier</em> (sélection + pré-remplissage + Update), <em>supprimer</em> (sélection + confirmation + Supprimer). Le Repository reste inchangé : tout se joue dans la Vue et le Contrôleur.</div>`,

    { type: "vf", q: "Supprimer un livre lié à des ventes peut être refusé par une contrainte FK.", a: true, exp: "Selon ON DELETE CASCADE ou non." },
    { type: "input", q: "Méthode du Repository appelée à la suppression : _____(id)", a: ["Supprimer", "Supprimer()"], exp: "repo.Supprimer(id) → DELETE." },
    { type: "vf", q: "Après un Update ou un Delete, on appelle RafraichirListe().", a: true, exp: "Le tableau reflète le changement." },
    { type: "qcm", q: "Le Repository, pour le CRUD graphique…", opts: ["Doit être réécrit", "Reste inchangé", "Perd ses méthodes", "Devient une Vue"], a: 1, exp: "Tout se joue dans Vue + Contrôleur." },
    { type: "qcm", q: "selection.Annee.ToString() sert à…", opts: ["Convertir l'année (int) en texte pour le TextBox", "Supprimer l'année", "Valider le prix", "Ouvrir la base"], a: 0, exp: "int → string." },
    { type: "vf", q: "La suppression est irréversible, d'où la demande de confirmation.", a: true, exp: "Sécurité utilisateur." }
  ],
  final: {
    title: "Exercice final — Modifier et supprimer",
    intro: `<p>On câble les boutons Modifier et Supprimer d'un livre sélectionné.</p>`,
    questions: [
      { type: "qcm", q: "La ligne sélectionnée s'obtient par…", opts: ["grille.CurrentRow.DataBoundItem", "grille.Text", "grille.Columns", "grille.Rows.Add()"], a: 0, exp: "L'objet lié à la ligne active." },
      { type: "qcm", q: "Si aucune ligne n'est sélectionnée, on…", opts: ["insère quand même", "affiche un message et return", "supprime la 1re ligne", "ferme l'appli"], a: 1, exp: "On arrête l'action proprement." },
      { type: "qcm", q: "Update(sel) modifie la ligne dont l'id est…", opts: ["toujours 1", "sel.Id", "le titre", "aléatoire"], a: 1, exp: "Ciblage par clé primaire." },
      { type: "vf", q: "On demande confirmation (MessageBox YesNo) avant un DELETE.", a: true, exp: "Sécurité utilisateur." },
      { type: "vf", q: "Après suppression confirmée, la ligne disparaît via RafraichirListe().", a: true, exp: "Mise à jour du DataGridView." }
    ],
    solution: `<pre class="pseudo">// --- Modifier ---
btnModifier.Click += (s, e) =&gt; {
    Livre sel = grille.CurrentRow?.DataBoundItem as Livre;
    if (sel == null) { Alerte("Sélectionne un livre."); return; }
    try {
        sel.Titre = champTitre.Text;
        sel.Annee = int.Parse(champAnnee.Text);
        sel.Prix = decimal.Parse(champPrix.Text);
        repo.Update(sel);                               // WHERE livre_id = sel.Id
        RafraichirListe();
    } catch (FormatException) { Alerte("Année/prix invalides."); }
      catch (MySqlException ex) { Alerte("Erreur : " + ex.Message); }
};

// --- Supprimer avec confirmation ---
btnSupprimer.Click += (s, e) =&gt; {
    Livre sel = grille.CurrentRow?.DataBoundItem as Livre;
    if (sel == null) { Alerte("Sélectionne un livre."); return; }

        catch (MySqlException ex) { Alerte("Erreur : " + ex.Message); }
    }
};</pre>
<p>Le CRUD graphique est complet. Demain : valider les saisies avant même d'atteindre la base.</p>`
  }
