<script>
var DAY = {
  num: 27,
  title: "CRUD graphique : afficher et ajouter",
  subtitle: "Un formulaire de saisie, un bouton Ajouter, un tableau qui se rafraîchit.",
  theory: `
<h3>1. L'écran de gestion</h3>
<p>On assemble l'écran complet : en haut un <strong>formulaire</strong> (des <code>TextBox</code> + un bouton <em>Ajouter</em>), en dessous le <strong>DataGridView</strong> qui liste les livres. Au démarrage (dans le constructeur ou l'événement <code>Load</code> du Form), on appelle <code>RafraichirListe()</code> pour afficher l'existant.</p>
<pre class="pseudo">TextBox champTitre = new TextBox();  champTitre.PlaceholderText = "Titre";
TextBox champAnnee = new TextBox();  champAnnee.PlaceholderText = "Année";
TextBox champPrix  = new TextBox();  champPrix.PlaceholderText = "Prix";
Button btnAjouter = new Button();    btnAjouter.Text = "Ajouter";
FlowLayoutPanel form = new FlowLayoutPanel();          // aligne champs + bouton
form.Controls.Add(champTitre); form.Controls.Add(champAnnee);
form.Controls.Add(champPrix);  form.Controls.Add(btnAjouter);</pre>

<h3>2. Lire les TextBox et convertir</h3>
<p>Les <code>TextBox</code> renvoient toujours du <strong>texte</strong> (propriété <code>.Text</code>). Pour l'année et le prix, il faut <strong>convertir</strong> : <code>int.Parse(...)</code> et <code>decimal.Parse(...)</code>.</p>
<pre class="pseudo">string titre = champTitre.Text;                         // texte brut
int annee = int.Parse(champAnnee.Text);                 // texte → entier
decimal prix = decimal.Parse(champPrix.Text);           // texte → decimal</pre>
<div class="warn">Si l'utilisateur tape « abc » dans le champ Prix, <code>decimal.Parse</code> lève une <code>FormatException</code>. On l'entoure d'un <code>try-catch</code> pour afficher une MessageBox plutôt que de planter (validation approfondie au jour 29).</div>

<h3>3. Le clic Ajouter : du champ au Repository</h3>
<p>Au clic, le contrôleur construit un <code>Livre</code>, appelle <code>repo.Creer(livre)</code>, puis rafraîchit le tableau et vide les champs.</p>
<pre class="pseudo">btnAjouter.Click += (s, e) =&gt; {                         // au clic sur « Ajouter »
    try {
        Livre l = new Livre();                          // on construit l'objet modèle
        l.Titre = champTitre.Text;
        l.Annee = int.Parse(champAnnee.Text);
        l.Prix = decimal.Parse(champPrix.Text);
        repo.Creer(l);                                  // on insère via le Repository
        RafraichirListe();                              // le tableau se met à jour
        ViderChamps();                                  // on nettoie le formulaire
    } catch (FormatException) {                          // saisie non numérique
        Alerte("Année et prix doivent être des nombres.");
    } catch (MySqlException ex) {                        // erreur base (ex : FK invalide)
        Alerte("Erreur base : " + ex.Message);
    }
};</pre>

<h3>4. Rafraîchir et vider</h3>
<p>Après un ajout réussi, on recharge le <code>DataSource</code> (le nouveau livre apparaît) et on remet les champs à vide avec <code>.Clear()</code>.</p>
<pre class="pseudo">private void ViderChamps() {                            // remet le formulaire à zéro
    champTitre.Clear(); champAnnee.Clear(); champPrix.Clear();
}</pre>

<h3>5. Un feedback clair</h3>
<p>On informe toujours l'utilisateur : MessageBox d'<strong>information</strong> en cas de succès, MessageBox d'<strong>erreur</strong> sinon. Une méthode utilitaire évite de répéter le code.</p>
<pre class="pseudo">private void Alerte(string message) {                   // helper d'affichage
    MessageBox.Show(message, "Information",
                    MessageBoxButtons.OK, MessageBoxIcon.Information);
}</pre>
<div class="tip">Rappel : une FK invalide (section_id inexistant) déclenche une <code>MySqlException</code> à l'INSERT. Comme le Repository laisse remonter l'exception, le contrôleur l'attrape et affiche un message plutôt que de laisser un clic sans effet.</div>`,
  exercises: [
    { type: "input", q: "La propriété .Text d'un TextBox renvoie une valeur de type _____", a: ["string"], exp: "Toujours du texte (string)." },
    { type: "input", q: "Méthode pour convertir un texte en entier : int._____()", a: ["Parse", "Parse()"], exp: "int.Parse(s)." },
    { type: "input", q: "Méthode pour convertir un texte en nombre à virgule (prix) : decimal._____()", a: ["Parse", "Parse()"], exp: "decimal.Parse(s)." },
    { type: "qcm", q: "Taper « abc » dans le champ Prix lève…", opts: ["Une MySqlException", "Une FormatException", "Rien", "Une NullReferenceException"], a: 1, exp: "Conversion impossible." },
    { type: "qcm", q: "Au clic Ajouter, l'ordre logique est…", opts: ["rafraîchir puis lire les champs", "lire les champs, Creer(), RafraichirListe(), ViderChamps()", "vider puis Creer()", "Creer() sans lire"], a: 1, exp: "Saisie → insertion → mise à jour → nettoyage." },
    { type: "input", q: "Méthode qui vide un TextBox : ._____()", a: ["Clear", "Clear()"], exp: "champ.Clear() (ou champ.Text = \"\")." },
    { type: "vf", q: "Après un ajout, on rafraîchit le DataGridView pour voir la nouvelle ligne.", a: true, exp: "Le tableau se met à jour." },
    { type: "qcm", q: "Un section_id inexistant à l'INSERT provoque…", opts: ["Une FormatException", "Une MySqlException (FK)", "Rien", "Un rollback automatique du Main"], a: 1, exp: "Contrainte de clé étrangère." },
    { type: "input", q: "Événement du Button déclenché lorsqu'on clique : _____", a: ["Click"], exp: "btn.Click += (s, e) => ..." },
    { type: "vf", q: "On peut entourer la conversion + l'INSERT d'un même try-catch.", a: true, exp: "On attrape FormatException et MySqlException." },
    { type: "qcm", q: "En cas de succès, on affiche…", opts: ["Rien", "Une MessageBox d'information", "Un rollback", "Un Console.WriteLine"], a: 1, exp: "Feedback positif." },
    { type: "input", q: "Conteneur pour aligner champs + bouton en ligne : Flow_____", a: ["LayoutPanel", "FlowLayoutPanel"], exp: "FlowLayoutPanel pour le formulaire." },
    { type: "vf", q: "Le contrôleur construit un Livre puis appelle repo.Creer(livre).", a: true, exp: "Le Repository fait l'INSERT." },
    { type: "qcm", q: "Pourquoi une méthode utilitaire Alerte(string) ?", opts: ["Pour aller plus vite en SQL", "Pour éviter de répéter le code de MessageBox", "Pour convertir un texte", "Pour ouvrir la base"], a: 1, exp: "Factorisation." },
    { type: "vf", q: "Le DataGridView affiche l'existant dès le démarrage via RafraichirListe().", a: true, exp: "Chargement initial." }
  ],
  final: {
    title: "Exercice final — Le bouton Ajouter",
    intro: `<p>On câble le formulaire de saisie et le bouton Ajouter d'un livre.</p>`,
    questions: [
      { type: "qcm", q: "Pour lire l'année saisie, on écrit…", opts: ["champAnnee.Text", "int.Parse(champAnnee.Text)", "champAnnee.GetInt()", "new int()"], a: 1, exp: "Texte converti en entier." },
      { type: "qcm", q: "Après repo.Creer(l), on appelle…", opts: ["Rollback()", "RafraichirListe() puis ViderChamps()", "Application.Exit()", "Application.Run()"], a: 1, exp: "Mise à jour + nettoyage." },
      { type: "qcm", q: "Une saisie non numérique est attrapée par…", opts: ["catch(MySqlException)", "catch(FormatException)", "catch(IOException)", "rien"], a: 1, exp: "Conversion invalide." },
      { type: "vf", q: "Le bouton réagit via btnAjouter.Click += (s, e) => ...", a: true, exp: "Événementiel." },
      { type: "vf", q: "Une FK invalide est attrapée par catch(MySqlException).", a: true, exp: "Erreur base à l'INSERT." }
    ],
    solution: `<pre class="pseudo">btnAjouter.Click += (s, e) =&gt; {                         // clic « Ajouter »
    try {
        Livre l = new Livre();                          // construit l'objet modèle
        l.Titre = champTitre.Text;                      // texte brut
        l.Annee = int.Parse(champAnnee.Text);           // texte → int
        l.Prix = decimal.Parse(champPrix.Text);         // texte → decimal
        l.SectionId = int.Parse(champSection.Text);
        repo.Creer(l);                                  // INSERT via le Repository
        RafraichirListe();                              // la nouvelle ligne apparaît
        ViderChamps();                                  // formulaire remis à zéro
        MessageBox.Show("Livre ajouté.", "Succès",
                        MessageBoxButtons.OK, MessageBoxIcon.Information);
    } catch (FormatException) {                          // saisie non numérique
        MessageBox.Show("Année, prix et section doivent être des nombres.",
                        "Erreur", MessageBoxButtons.OK, MessageBoxIcon.Error);
    } catch (MySqlException ex) {                         // ex : FK section invalide
        MessageBox.Show("Erreur base : " + ex.Message,
                        "Erreur", MessageBoxButtons.OK, MessageBoxIcon.Error);
    }
};

private void ViderChamps() {
    champTitre.Clear(); champAnnee.Clear();
    champPrix.Clear(); champSection.Clear();
}</pre>
<p>Ajouter fonctionne en graphique. Demain : modifier et supprimer une ligne sélectionnée.</p>`
  }
};
</script>
