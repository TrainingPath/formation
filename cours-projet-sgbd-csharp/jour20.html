<h3>1. Du « tout-en-un » au Repository</h3>
<p>Jusqu'ici, notre entité était <em>intelligente</em> : elle portait à la fois ses données ET son SQL (style Active Record). Le pattern <strong>DAO</strong> (<em>Data Access Object</em>, « objet d'accès aux données »), appelé en C# / .NET un <strong>Repository</strong> (« dépôt »), pousse la séparation plus loin en découpant le Modèle en <strong>deux classes</strong> :</p>
<ul>
<li>La <strong>classe modèle</strong> (un <em>POCO</em>, <em>Plain Old CLR Object</em>, l'équivalent du POJO Java) : un objet <em>purement de données</em> (des propriétés). Il ne contient plus aucun SQL.</li>
<li>Le <strong>Repository</strong> : la <em>seule</em> classe qui « parle » SQL. Elle contient les méthodes d'accès (lire, créer, modifier, supprimer).</li>
</ul>
<div class="tip">Le Modèle du MVC devient donc : <strong>classe modèle</strong> (les données) + <strong>Repository</strong> (l'accès). La Vue et le Contrôleur gardent leur rôle. Dans ce cours, « DAO » et « Repository » désignent la même idée.</div>

<h3>2. La classe modèle : Livre.cs (données pures)</h3>
<p>La classe modèle suit une convention simple : uniquement des <strong>propriétés</strong>. Elle représente une ligne de la table <code>livres</code>, sans savoir qu'une base existe.</p>
<pre class="pseudo">public class Livre {                                    // classe modèle : données d'un livre
    public int Id { get; set; }                         // livre_id
    public string Titre { get; set; }                   // titre
    public decimal Prix { get; set; }                   // prix_unitaire (DECIMAL → decimal)

    public Livre() { }                                  // constructeur vide
    public Livre(string titre, decimal prix) {          // constructeur pratique
        this.Titre = titre; this.Prix = prix;
    }
}</pre>

<h3>3. Le Repository : LivreRepository.cs (le seul à parler SQL)</h3>
<p>Le Repository utilise le Singleton <code>DatabaseConnection</code>. C'est ici — et nulle part ailleurs — que vit le SQL.</p>
<pre class="pseudo">public class LivreRepository {                          // objet d'accès aux données (DAO)
    public List&lt;Livre&gt; LireTout() {                     // renvoie tous les livres
        List&lt;Livre&gt; liste = new List&lt;Livre&gt;();
        string sql = "SELECT * FROM livres";
        try {
            MySqlConnection c = DatabaseConnection.GetInstance().GetConnection();
            MySqlCommand cmd = new MySqlCommand(sql, c);
            MySqlDataReader rs = cmd.ExecuteReader();
            while (rs.Read()) {                         // mapping ligne → objet
                Livre l = new Livre();                  // on crée un objet vide
                l.Id = rs.GetInt32("livre_id");         // on le remplit
                l.Titre = rs.GetString("titre");
                l.Prix = rs.GetDecimal("prix_unitaire");
                liste.Add(l);                           // on l'ajoute à la liste
            }
            rs.Close();                                 // lecteur fermé, connexion gardée
        } catch (MySqlException) { }
        return liste;
    }
}</pre>
<p>Le passage du <code>MySqlDataReader</code> vers des objets <code>Livre</code> s'appelle le <strong>mapping</strong> : on transforme des lignes SQL en objets C#.</p>

<h3>4. Vue et Contrôleur : inchangés dans leur esprit</h3>
<p>La <strong>Vue</strong> affiche ce qu'on lui donne (elle ne connaît pas la base). Le <strong>Contrôleur</strong> demande les données au Repository et les transmet à la Vue.</p>
<pre class="pseudo">public class LivreController {                          // chef d'orchestre
    private LivreRepository repo = new LivreRepository();  // il connaît le Repository
    public List&lt;Livre&gt; GetLivres() {                    // fournit les données
        return repo.LireTout();                         // délègue au Repository
    }
}</pre>

<h3>5. Pourquoi le Repository est-il si flexible ?</h3>
<ul>
<li><strong>Indépendance</strong> : si le nom de la table change, on ne modifie que le Repository.</li>
<li><strong>Flexibilité</strong> : si l'on passe de la console à Windows Forms, on ne modifie que la Vue.</li>
<li><strong>Logique</strong> : le Contrôleur porte les règles métier (« si la liste est vide, afficher un message »).</li>
</ul>
<div class="warn">Différence clé avec l'Active Record : ici un <code>Livre</code> ne sait plus se sauvegarder. C'est <code>repo.Creer(livre)</code> qui l'enregistre. Les données et l'accès sont deux responsabilités distinctes.</div>`,
