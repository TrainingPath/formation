  title: "Le registre : du ou Sie",
  subtitle: "Tutoyer ou vouvoyer : choisir le bon niveau de langue.",
  theory: `
<h3>1. Deux façons de dire « vous »</h3>
<p>Comme le français, l'allemand distingue le <strong>tutoiement</strong> (du) et le <strong>vouvoiement</strong> (Sie). Choisir le mauvais registre peut sembler impoli ou, au contraire, trop distant. C'est une compétence sociale essentielle au niveau B1.</p>
<pre class="pseudo">du    tu     (une personne qu'on tutoie)
ihr   vous   (plusieurs personnes qu'on tutoie — pluriel de du)
Sie   vous   (vouvoiement, singulier ET pluriel, toujours majuscule)</pre>
<div class="warn">Ne confonds pas les trois « sie » : <em>sie</em> (elle), <em>sie</em> (ils/elles) et <em>Sie</em> (vous de politesse, avec majuscule). Le verbe et le contexte les distinguent : <em>Sie kommen</em> peut vouloir dire « vous venez » (politesse) ou « ils viennent ».</p></div>
<h3>2. Quand tutoyer (du) ?</h3>
<pre class="pseudo">- la famille et les amis
- les enfants et les adolescents
- entre étudiants, entre jeunes
- entre collègues proches (selon l'entreprise)
- sur les réseaux sociaux, dans les pubs pour jeunes</pre>
<h3>3. Quand vouvoyer (Sie) ?</h3>
<pre class="pseudo">- les inconnus adultes (dans la rue, un magasin)
- le contexte professionnel formel, les clients
- les supérieurs, les personnes âgées
- l'administration, les e-mails formels</pre>
<div class="tip">Règle de prudence : en cas de doute avec un adulte inconnu, commence toujours par <strong>Sie</strong>. C'est la personne la plus âgée ou la plus haute en hiérarchie qui propose de passer au du : « <em>Wollen wir uns duzen?</em> » (On se tutoie ?) ou « <em>Sag doch du zu mir.</em> »</p></div>
<h3>4. Les formes qui changent</h3>
<p>Passer de du à Sie change le pronom, la terminaison du verbe et le possessif :</p>
<pre class="pseudo">                du (tutoiement)          Sie (vouvoiement)
verbe           Wie heißt du?            Wie heißen Sie?
                Woher kommst du?         Woher kommen Sie?
impératif       Komm! / Warte!           Kommen Sie! / Warten Sie!
possessif       dein Name                Ihr Name
datif/accusatif  Ich helfe dir.          Ich helfe Ihnen.
                Ich sehe dich.           Ich sehe Sie.</pre>
<p>Les verbes <strong>duzen</strong> (tutoyer) et <strong>siezen</strong> (vouvoyer) existent : <em>Wir duzen uns.</em> (Nous nous tutoyons.)</p>
<h3>5. Deux salutations selon le registre</h3>
<pre class="pseudo">Informel (du)          Formel (Sie)
Hallo! / Hi!           Guten Tag! / Guten Morgen!
Tschüss! / Ciao!       Auf Wiedersehen!
Wie geht's?            Wie geht es Ihnen?
Liebe Grüße (LG)       Mit freundlichen Grüßen</pre>
<p>Exemple formel : <em>Guten Tag, Herr Meyer. Wie geht es Ihnen? Kann ich Ihnen helfen?</em> — Exemple informel : <em>Hey Tom! Wie geht's dir? Kann ich dir helfen?</em></p>`,
  exercises: [
    { type: "qcm", q: "Quel pronom pour le vouvoiement (politesse) ?", opts: ["du", "ihr", "Sie (majuscule)", "es"], a: 2, exp: "Sie (majuscule) = vouvoiement, singulier et pluriel." },

    { type: "qcm", q: "Salutation FORMELLE parmi ces options :", opts: ["Hi!", "Tschüss!", "Guten Tag!", "Ciao!"], a: 2, exp: "Guten Tag / Auf Wiedersehen = formel ; Hi/Tschüss/Ciao = informel." },

    { type: "qcm", q: "Dans quel contexte tutoie-t-on normalement (du) ?", opts: ["avec un client au travail", "entre amis et en famille", "à l'administration", "avec un inconnu âgé"], a: 1, exp: "du = famille, amis, enfants, jeunes entre eux." },

  ],

    title: "Exercice final — Zwei Gespräche",
    intro: `<p>Lis ces deux courts dialogues (le même contenu, deux registres) et réponds.</p>
<pre class="pseudo">Gespräch A (im Büro):
— Guten Morgen, Frau Wagner. Wie geht es Ihnen?
— Danke, gut. Und Ihnen, Herr Klein?
— Auch gut, danke. Könnten Sie mir bitte den Bericht schicken?
— Natürlich. Ich schicke Ihnen die Datei sofort. Auf Wiedersehen!

Gespräch B (unter Freunden):
— Hey Nina! Wie geht's dir?
— Super, und dir? Sag mal, kannst du mir deinen Bericht schicken?
— Klar, ich schick dir gleich die Datei. Bis später, tschüss!

Später am Tag:
— Herr Klein, wir arbeiten jetzt schon lange zusammen.
  Wollen wir uns nicht duzen?
— Gern! Ich bin der Thomas.</pre>
<p>(der Bericht = le rapport · die Datei = le fichier · gleich = tout de suite)</p>`,
    questions: [
      { type: "qcm", q: "Le dialogue A se passe…", opts: ["entre amis", "au bureau, en vouvoiement (Sie)", "en famille", "à l'école primaire"], a: 1, exp: "« im Büro », vouvoiement : Ihnen, Sie, Herr/Frau." },
      { type: "input", q: "Forme du datif de politesse dans A : « Könnten Sie mir bitte den Bericht schicken? » — réponse : « Ich schicke ___ die Datei. » (à vous)", a: ["Ihnen"], ph: "pronom", exp: "Ihnen = à vous (formel)." },
      { type: "qcm", q: "Dans le dialogue B (entre amis), quel possessif emploie-t-on pour « ton rapport » ?", opts: ["Ihren Bericht", "deinen Bericht", "seinen Bericht", "euren Bericht"], a: 1, exp: "Tutoiement : dein → deinen Bericht." },
      { type: "vf", q: "À la fin, Herr Klein propose de se tutoyer (« Wollen wir uns nicht duzen? »).", a: true, exp: "Il propose de passer au du : duzen = se tutoyer." },
      { type: "qcm", q: "Comment Herr Klein révèle-t-il son prénom en acceptant le tutoiement ?", opts: ["Ich bin Herr Klein.", "Ich bin der Thomas.", "Mein Nachname ist Klein.", "Nennen Sie mich Herr Klein."], a: 1, exp: "« Ich bin der Thomas » : il donne son prénom, marque du tutoiement." }
    ],
    solution: `<p>Les deux dialogues disent la même chose dans deux registres :</p>
<pre class="pseudo">FORMEL (A) :   Guten Morgen · Sie / Ihnen · Frau Wagner, Herr Klein
               Könnten Sie ... schicken? · Auf Wiedersehen
INFORMEL (B) : Hey · du / dir · deinen Bericht · ich schick dir
               Bis später, tschüss</pre>
<p>Le passage du vouvoiement au tutoiement (« Wollen wir uns duzen? ») est un moment social important en allemand : c'est le supérieur/le plus âgé qui le propose, et on révèle souvent son prénom (« Ich bin der Thomas »). Sache adapter pronoms, verbes, possessifs et salutations au registre.</p>`
  }
