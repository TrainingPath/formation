<script>
var DAY = {
  num: 7,
  title: "Les propositions infinitives (um...zu)",
  subtitle: "Exprimer le but : « pour apprendre », « afin de réussir ».",
  theory: `
<h3>1. La construction zu + infinitif</h3>
<p>Beaucoup de verbes et d'expressions sont suivis d'un infinitif précédé de <strong>zu</strong>. C'est l'équivalent du « de/à + infinitif » français.</p>
<pre class="pseudo">Ich habe vergessen, die Tuer zu schliessen.
J'ai oublié de fermer la porte.
Es ist wichtig, jeden Tag zu ueben.
Il est important de s'exercer chaque jour.</pre>
<div class="tip">L'infinitif avec zu se met à la fin du groupe, et on place une virgule avant le groupe infinitif quand il a des compléments.</div>
<h3>2. um ... zu : exprimer le but</h3>
<p>Pour dire « <strong>pour / afin de</strong> » faire quelque chose, on utilise <strong>um ... zu + infinitif</strong>. Le um ouvre le groupe, le zu + infinitif le ferme.</p>
<pre class="pseudo">Ich lerne Deutsch, um in Deutschland zu arbeiten.
J'apprends l'allemand pour travailler en Allemagne.
Sie spart Geld, um ein Auto zu kaufen.
Elle économise pour acheter une voiture.</pre>
<div class="warn">Condition : um...zu ne s'emploie que si le sujet est LE MÊME dans les deux parties (ici « je » apprends et « je » travaille). Si les sujets diffèrent, on utilise damit (jour 8).</div>
<h3>3. La place de zu avec les verbes à particule</h3>
<p>Avec un verbe séparable, le <strong>zu se glisse ENTRE la particule et le verbe</strong> : an|rufen -> anzurufen ; ein|kaufen -> einzukaufen.</p>
<pre class="pseudo">Ich habe keine Zeit, dich anzurufen.
Je n'ai pas le temps de t'appeler.
Wir gehen in die Stadt, um einzukaufen.
Nous allons en ville pour faire les courses.</pre>
<h3>4. ohne...zu et (an)statt...zu</h3>
<p>Deux autres constructions infinitives très utiles :</p>
<pre class="pseudo">ohne ... zu    : sans faire qqch
statt ... zu   : au lieu de faire qqch

Er ging weg, ohne etwas zu sagen.
Il est parti sans rien dire.
Statt zu arbeiten, spielt er den ganzen Tag.
Au lieu de travailler, il joue toute la journée.</pre>
<h3>5. Quand PAS de zu ?</h3>
<p>Après les <strong>modaux</strong> (können, müssen, wollen...) et quelques verbes (gehen, sehen, hören, lassen), l'infinitif se met <strong>SANS zu</strong>.</p>
<pre class="pseudo">Ich muss arbeiten.        (pas de zu après müssen)
Ich will schlafen gehen.  Je veux aller dormir.
Ich höre ihn singen.      Je l'entends chanter.</pre>
<div class="tip">Retiens le contraste : Ich versuche zu lernen (verbe ordinaire -> zu) mais Ich will lernen (modal -> pas de zu).</div>`,
  exercises: [
    { type: "qcm", q: "Comment exprime-t-on le but « pour faire qqch » ?", opts: ["zu + infinitif seul", "um ... zu + infinitif", "damit + infinitif", "für + infinitif"], a: 1, exp: "um ... zu + infinitif = pour / afin de." },
    { type: "input", q: "Complète : « Ich lerne Deutsch, ___ in Deutschland zu arbeiten. » (pour)", a: ["um"], ph: "conjonction de but", exp: "um ... zu : pour travailler en Allemagne." },
    { type: "qcm", q: "Quelle condition pour utiliser um ... zu ?", opts: ["les deux sujets doivent différer", "le sujet doit être le même dans les deux parties", "il faut un modal", "il faut un passé"], a: 1, exp: "um...zu exige un sujet identique. Sinon on emploie damit." },
    { type: "input", q: "Complète : « Es ist wichtig, jeden Tag ___ üben. » (particule zu de l'infinitif)", a: ["zu"], ph: "particule", exp: "zu üben = de s'exercer (zu + infinitif)." },
    { type: "qcm", q: "Avec un verbe séparable comme anrufen, où va le zu ?", opts: ["avant la particule (zu anrufen)", "entre la particule et le verbe (anzurufen)", "après le verbe", "on l'omet"], a: 1, exp: "an|rufen -> anzurufen : le zu s'insère au milieu." },
    { type: "input", q: "Complète : « Wir gehen in die Stadt, um ___. » (einkaufen avec zu inséré)", a: ["einzukaufen"], ph: "verbe séparable + zu", exp: "ein|kaufen -> einzukaufen." },
    { type: "vf", q: "Après un verbe de modalité (müssen, wollen), l'infinitif se met sans zu.", a: true, exp: "Vrai : Ich muss arbeiten (pas de zu)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich will zu schlafen.", "Ich will schlafen.", "Ich will schlafen zu.", "Ich will zu schlaf."], a: 1, exp: "Après will (modal), pas de zu : Ich will schlafen." },
    { type: "input", q: "Complète : « Er ging weg, ___ etwas zu sagen. » (sans)", a: ["ohne"], ph: "conjonction", exp: "ohne ... zu = sans faire : ohne etwas zu sagen (sans rien dire)." },
    { type: "qcm", q: "« Statt zu arbeiten, spielt er » signifie…", opts: ["Pour travailler, il joue", "Au lieu de travailler, il joue", "Sans travailler ni jouer", "Il travaille et joue"], a: 1, exp: "statt ... zu = au lieu de." },
    { type: "input", q: "Complète : « Ich habe keine Zeit, dich ___. » (anrufen avec zu)", a: ["anzurufen"], ph: "séparable + zu", exp: "an|rufen -> anzurufen : je n'ai pas le temps de t'appeler." },
    { type: "vf", q: "« Ich habe vergessen, die Tür zu schließen » est correct.", a: true, exp: "Vrai : vergessen + zu-infinitif : oublier DE fermer." },
    { type: "qcm", q: "Que met-on avant l'infinitif après « Ich höre ihn ... » (chanter) ?", opts: ["zu singen", "singen (sans zu)", "gesungen", "zu gesungen"], a: 1, exp: "hören + infinitif sans zu : Ich höre ihn singen." },
    { type: "qcm", q: "Traduis le but « pour rester en forme » : « Ich mache Sport, ... »", opts: ["um fit zu bleiben", "damit fit bleiben", "für fit bleiben", "zu fit bleiben"], a: 0, exp: "um fit zu bleiben = pour rester en forme (même sujet)." },
    { type: "qcm", q: "Compréhension : « Sie steht früh auf, um zu joggen. » Pourquoi se lève-t-elle tôt ?", opts: ["parce qu'elle travaille", "pour faire du jogging", "sans raison", "au lieu de dormir"], a: 1, exp: "um zu joggen = pour faire du jogging (but)." }
  ],
  final: {
    title: "Exercice final — Meine Ziele",
    intro: `<p>Lis ce texte sur les objectifs de Nina (constructions infinitives) et réponds.</p>
<pre class="pseudo">Nina lernt jeden Tag Deutsch, um spaeter in Berlin zu studieren.
Sie steht frueh auf, um genug Zeit zum Lernen zu haben. Es ist ihr
wichtig, jeden Tag zu ueben. Manchmal geht sie ins Cafe, um dort in
Ruhe zu arbeiten. Sie versucht, ohne Woerterbuch zu lesen. Statt
fernzusehen, hoert sie deutsche Podcasts. Am Wochenende trifft sie
Freunde, um Deutsch zu sprechen.</pre>
<p>(studieren = faire des études · in Ruhe = tranquillement · fernsehen = regarder la télé)</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi Nina apprend-elle l'allemand ?", opts: ["pour voyager", "pour étudier à Berlin (um in Berlin zu studieren)", "pour travailler", "sans raison"], a: 1, exp: "« um später in Berlin zu studieren »." },
      { type: "input", q: "Complète : « Sie steht früh auf, ___ genug Zeit zu haben. » (pour)", a: ["um"], ph: "conjonction de but", exp: "um ... zu haben = pour avoir assez de temps." },
      { type: "input", q: "Complète l'infinitif séparable : « Statt ___, hört sie Podcasts. » (fernsehen + zu)", a: ["fernzusehen"], ph: "séparable + zu", exp: "fern|sehen -> fernzusehen (au lieu de regarder la télé)." },
      { type: "vf", q: "Nina essaie de lire sans dictionnaire.", a: true, exp: "« Sie versucht, ohne Wörterbuch zu lesen. »" },
      { type: "qcm", q: "Pourquoi retrouve-t-elle des amis le week-end ?", opts: ["pour manger", "pour parler allemand (um Deutsch zu sprechen)", "pour dormir", "pour travailler"], a: 1, exp: "« um Deutsch zu sprechen »." }
    ],
    solution: `<p>Le texte enchaîne les constructions infinitives : le but avec <strong>um...zu</strong> (um zu studieren, um zu haben, um zu arbeiten, um zu sprechen), la simple construction <strong>zu + infinitif</strong> (wichtig, zu üben ; versucht, zu lesen), <strong>ohne...zu</strong> (ohne Wörterbuch zu lesen) et <strong>statt...zu</strong> (statt fernzusehen).</p>
<p>Rappels : sujet identique pour um...zu ; avec un séparable, le zu se glisse au milieu (fernzusehen, einzukaufen) ; après un modal, pas de zu.</p>`
  }
};
</script>

      "But : « Ich ..., um ... zu + infinitif » (sujet identique).",
