<script>
var DAY = {
  num: 23,
  title: "Raconter un événement en détail",
  subtitle: "Donner de la vie à un récit : temps, ordre, descriptions et émotions.",
  theory: `
<h3>1. Choisir le bon temps</h3>
<p>Pour raconter un événement personnel, on utilise surtout le <strong>Perfekt</strong> (haben/sein + participe). On garde au <strong>Präteritum</strong> les verbes <em>sein</em> (war), <em>haben</em> (hatte) et les modaux (konnte, wollte, musste) — c'est plus naturel.</p>
<pre class="pseudo">Ich habe eine Reise gemacht.       J'ai fait un voyage.  (Perfekt)
Das Wetter war fantastisch.        Le temps était fantastique.  (war)
Wir hatten viel Glück.             Nous avons eu beaucoup de chance.  (hatten)
Wir konnten alles besichtigen.     Nous avons pu tout visiter.  (konnten)</pre>
<h3>2. Structurer la chronologie</h3>
<p>Un récit détaillé enchaîne les étapes. Ces mots de temps, placés en tête, déclenchent l'<strong>inversion</strong> (verbe en 2e position) :</p>
<pre class="pseudo">zuerst      d'abord       dann / danach   ensuite / après
zunächst    tout d'abord  anschließend    à la suite
plötzlich   soudain       schließlich     finalement
am Anfang   au début      am Ende         à la fin
kurz danach peu après     einige Zeit später   quelque temps plus tard</pre>
<pre class="pseudo">Zuerst sind wir angekommen. Dann haben wir das Hotel gesucht.
Plötzlich hat es angefangen zu regnen.</pre>
<h3>3. Ajouter des détails : la description</h3>
<p>Ce qui transforme une liste d'actions en récit vivant, ce sont les <strong>détails</strong> : où, comment, avec qui, dans quelle ambiance.</p>
<pre class="pseudo">Lieu :      in einem kleinen Dorf, mitten in den Bergen
Manière :   langsam, plötzlich, zum Glück, leider
Compagnie : mit meiner Familie, zusammen mit Freunden
Ambiance :  Die Stimmung war toll. Es war sehr gemütlich.</pre>
<div class="tip">Le B1 récompense la richesse : ajoute des adjectifs (<em>ein alter, schöner Marktplatz</em>), des compléments de lieu/temps, et une émotion. « Wir haben gegessen » devient « Am Abend haben wir in einem gemütlichen Restaurant typische Spezialitäten gegessen. »</p></div>
<h3>4. Exprimer les émotions et réactions</h3>
<pre class="pseudo">Ich war begeistert / überrascht.   J'étais enthousiasmé / surpris.
Ich habe mich sehr gefreut.        Je me suis beaucoup réjoui.
Ich hatte ein bisschen Angst.      J'avais un peu peur.
Zum Glück ...                      Heureusement ...
Leider ...                         Malheureusement ...
Das war ein unvergessliches Erlebnis.  C'était une expérience inoubliable.</pre>
<h3>5. Un récit détaillé modèle</h3>
<pre class="pseudo">Letzten Sommer habe ich eine Reise nach Österreich gemacht.
Zuerst sind wir mit dem Zug nach Wien gefahren. Die Stadt war
wunderschön, und wir hatten perfektes Wetter.
Am zweiten Tag haben wir eine Wanderung in den Bergen gemacht.
Plötzlich hat es angefangen zu regnen, und wir mussten schnell
zurückgehen. Zum Glück haben wir eine kleine Hütte gefunden.
Dort haben wir heißen Tee getrunken und gelacht.
Am Ende war es ein unvergessliches Erlebnis.</pre>
<p>(die Wanderung = la randonnée · die Hütte = le refuge · lachen = rire)</p>`,
  exercises: [
    { type: "qcm", q: "Pour raconter un événement personnel, quel temps domine ?", opts: ["le Präteritum", "le Perfekt", "le futur", "le présent"], a: 1, exp: "Le Perfekt est le temps du récit personnel ; sein/haben/modaux restent au Präteritum." },
    { type: "input", q: "Complète : « Das Wetter ___ fantastisch. » (était — Präteritum de sein)", a: ["war"], ph: "verbe", exp: "sein → war." },
    { type: "input", q: "Complète : « Wir ___ viel Glück. » (avoir eu — Präteritum de haben, wir)", a: ["hatten"], ph: "verbe", exp: "haben → hatten (nous avions / avons eu)." },
    { type: "qcm", q: "Que signifie « plötzlich » ?", opts: ["lentement", "soudain / tout à coup", "d'abord", "à la fin"], a: 1, exp: "plötzlich = soudain." },

    { type: "qcm", q: "Qu'est-ce qui rend un récit VIVANT au niveau B1 ?", opts: ["Des phrases toutes identiques", "Des détails : lieu, manière, ambiance, émotions", "Uniquement des verbes", "Le moins de mots possible"], a: 1, exp: "Détails et émotions transforment une liste d'actions en vrai récit." },

    { type: "qcm", q: "« Zum Glück » signifie…", opts: ["malheureusement", "heureusement", "soudain", "à la fin"], a: 1, exp: "zum Glück = heureusement ; leider = malheureusement." },
    { type: "qcm", q: "Quel groupe de mots est le plus détaillé (donc le plus B1) ?", opts: ["Wir haben gegessen.", "Am Abend haben wir in einem gemütlichen Restaurant typische Spezialitäten gegessen.", "Essen gut.", "Ich esse."], a: 1, exp: "Compléments de temps, de lieu, adjectifs : le récit devient riche." },
    { type: "vf", q: "« schließlich » veut dire « finalement / enfin ».", a: true, exp: "schließlich = finalement, pour conclure un récit." },
    { type: "input", q: "Complète : « Wir mussten schnell ___. » (verbe zurückgehen à l'infinitif, après modal)", a: ["zurückgehen","zurueckgehen"], ph: "infinitif", exp: "Après un modal (mussten), l'infinitif va à la fin : zurückgehen." },
    { type: "qcm", q: "« Das war ein unvergessliches Erlebnis » signifie…", opts: ["C'était un mauvais moment", "C'était une expérience inoubliable", "C'était ennuyeux", "C'était trop cher"], a: 1, exp: "unvergesslich = inoubliable ; das Erlebnis = l'expérience vécue." },
    { type: "qcm", q: "Compréhension : « Plötzlich hat es angefangen zu regnen, und wir mussten schnell zurückgehen. » Que s'est-il passé ?", opts: ["Il a fait beau", "Il s'est mis à pleuvoir soudain et ils ont dû rentrer vite", "Ils ont continué la randonnée", "Ils ont pris un bus"], a: 1, exp: "anfangen zu regnen = se mettre à pleuvoir ; zurückgehen = rentrer." },
    { type: "vf", q: "Placer « am zweiten Tag » en tête de phrase provoque l'inversion (verbe en 2e position).", a: true, exp: "Tout complément en 1re position déclenche l'inversion en allemand." }
  ],

    title: "Exercice final — Ein besonderer Tag",
    intro: `<p>Lis ce récit détaillé d'une journée mémorable, puis réponds.</p>
<pre class="pseudo">Letztes Jahr habe ich meinen Geburtstag nie vergessen. Am Morgen
bin ich früh aufgestanden, weil ich aufgeregt war. Zuerst haben
meine Eltern mir ein Geschenk gegeben: eine Reise nach Paris!

Am Nachmittag sind meine besten Freunde plötzlich vor der Tür
gestanden. Sie hatten eine Überraschungsparty organisiert. Die
Stimmung war fantastisch, und wir haben zusammen gelacht und
getanzt.

Am Abend sind wir in ein kleines Restaurant gegangen. Das Essen
war ausgezeichnet, und der Kellner hat sogar einen Kuchen mit
Kerzen gebracht. Ich war so glücklich und ein bisschen gerührt.
Schließlich bin ich spät, aber sehr zufrieden nach Hause gekommen.
Das war der schönste Geburtstag meines Lebens.</pre>
<p>(aufgeregt = excité · das Geschenk = le cadeau · die Überraschung = la surprise · der Kellner = le serveur · die Kerze = la bougie · gerührt = ému · zufrieden = satisfait)</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi la personne s'est-elle levée tôt ?", opts: ["Pour aller travailler", "Parce qu'elle était excitée", "À cause du bruit", "Pour prendre un train"], a: 1, exp: "« weil ich aufgeregt war »." },
      { type: "qcm", q: "Quel cadeau ses parents lui ont-ils offert ?", opts: ["Un livre", "Un voyage à Paris", "Un vélo", "De l'argent"], a: 1, exp: "« ein Geschenk gegeben: eine Reise nach Paris! »." },
      { type: "input", q: "Qu'avaient organisé ses amis ? « Sie hatten eine ___ organisiert. » (une fête surprise, 1 mot composé)", a: ["Überraschungsparty","Ueberraschungsparty"], ph: "nom", exp: "die Überraschungsparty = la fête surprise." },
      { type: "vf", q: "Le soir, le serveur a apporté un gâteau avec des bougies.", a: true, exp: "« der Kellner hat sogar einen Kuchen mit Kerzen gebracht »." },
      { type: "qcm", q: "Comment la personne conclut-elle son récit ?", opts: ["C'était une journée ratée", "C'était le plus bel anniversaire de sa vie", "Elle était déçue", "Elle veut oublier ce jour"], a: 1, exp: "« Das war der schönste Geburtstag meines Lebens. »" }
    ],
    solution: `<p>Ce récit est riche parce qu'il combine tout ce qu'on a vu : le <strong>Perfekt</strong> pour les actions (<em>bin aufgestanden, haben gegeben, sind gegangen</em>), le <strong>Präteritum</strong> pour l'état et les modaux (<em>war, hatten</em>), les <strong>marqueurs de temps</strong> (<em>am Morgen, zuerst, am Nachmittag, am Abend, schließlich</em>) et surtout les <strong>émotions</strong> (<em>aufgeregt, glücklich, gerührt, zufrieden</em>).</p>
<p>Note les <strong>détails</strong> qui donnent vie au texte : « ein kleines Restaurant », « einen Kuchen mit Kerzen », « spät, aber sehr zufrieden ». C'est exactement cette densité qu'on attend d'un récit détaillé B1.</p>`
  }
};
