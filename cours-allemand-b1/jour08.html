  title: "Les subordonnées : obwohl, damit, trotzdem",
  subtitle: "Nuancer : concession, but et opposition.",
  theory: `
<h3>1. Trois façons de nuancer</h3>
<p>Aujourd'hui, trois connecteurs qui expriment l'opposition ou le but. Attention : ils ne se construisent PAS de la même façon. Le secret, c'est la <strong>place du verbe</strong>.</p>
<pre class="pseudo">obwohl   = bien que / quoique   -> SUBORDONNANT (verbe à la fin)
damit    = pour que / afin que  -> SUBORDONNANT (verbe à la fin)
trotzdem = malgré cela / pourtant -> ADVERBE (verbe en 2e position)</pre>
<h3>2. obwohl : la concession (verbe à la fin)</h3>
<p><strong>obwohl</strong> introduit une subordonnée : le verbe conjugué part <strong>à la fin</strong>. Sens : « bien que, malgré le fait que ».</p>
<pre class="pseudo">Ich gehe spazieren, obwohl es regnet.
Je vais me promener bien qu'il pleuve.
Obwohl er müde ist, arbeitet er weiter.
Bien qu'il soit fatigué, il continue de travailler.</pre>
<div class="tip">Si la subordonnée avec obwohl est en tête, la principale commence par le verbe (inversion) : Obwohl es regnet, gehe ich spazieren.</div>
<h3>3. damit : le but avec deux sujets différents (verbe à la fin)</h3>
<p><strong>damit</strong> = « pour que / afin que ». On l'emploie quand les <strong>deux sujets sont différents</strong> (sinon, on utilise um...zu, vu au jour 7). Verbe à la fin.</p>
<pre class="pseudo">Ich erkläre es langsam, damit du es verstehst.
Je l'explique lentement pour que tu comprennes.
Sie gibt mir das Buch, damit ich es lese.
Elle me donne le livre pour que je le lise.</pre>
<div class="warn">um...zu (même sujet) vs damit (sujets différents) : Ich lerne, um zu bestehen (je lerne / je réussis = moi). Ich helfe dir, damit du bestehst (moi j'aide / toi tu réussis).</div>
<h3>4. trotzdem : l'opposition (verbe en 2e position)</h3>
<p><strong>trotzdem</strong> = « malgré cela, pourtant ». Ce n'est PAS un subordonnant mais un <strong>adverbe</strong> : la phrase reste principale, le verbe reste en <strong>2e position</strong>. Souvent en tête -> inversion.</p>
<pre class="pseudo">Es regnet. Trotzdem gehe ich spazieren.
Il pleut. Malgré cela, je vais me promener.
Er ist krank, trotzdem arbeitet er.
Il est malade, pourtant il travaille.</pre>
<h3>5. Comparaison : obwohl vs trotzdem</h3>
<p>Ils expriment la même idée d'opposition, mais se construisent différemment :</p>
<pre class="pseudo">obwohl (verbe à la fin) :
Ich arbeite, obwohl ich krank bin.

trotzdem (verbe en 2e position) :
Ich bin krank. Trotzdem arbeite ich.</pre>
<div class="tip">Astuce : trotzdem est proche de « trotz » (malgré) + demonstratif. Comme deshalb ou deswegen, c'est un adverbe : il provoque l'inversion, il ne rejette pas le verbe.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « obwohl » ?", opts: ["parce que", "bien que / quoique", "pour que", "malgré cela"], a: 1, exp: "obwohl = bien que (concession)." },
    { type: "qcm", q: "Où va le verbe après « obwohl » ?", opts: ["en 2e position", "juste après obwohl", "à la fin de la subordonnée", "au début"], a: 2, exp: "obwohl est un subordonnant : verbe à la fin." },
    { type: "input", q: "Complète : « Ich gehe spazieren, obwohl es ___. » (pleuvoir, verbe à la fin)", a: ["regnet"], ph: "verbe à la fin", exp: "obwohl es regnet : le verbe conjugué part à la fin." },

    { type: "qcm", q: "« trotzdem » est…", opts: ["un subordonnant (verbe à la fin)", "un adverbe (verbe en 2e position)", "une préposition", "un pronom"], a: 1, exp: "trotzdem = adverbe : la phrase reste principale, verbe en 2e position." },
    { type: "input", q: "Complète : « Es regnet. Trotzdem ___ ich spazieren. » (gehen, en 2e position)", a: ["gehe"], ph: "verbe en 2e position", exp: "Trotzdem gehe ich : adverbe en tête -> inversion, verbe en 2e position." },
    { type: "vf", q: "Après « trotzdem » en tête de phrase, il y a inversion (verbe en 2e position).", a: true, exp: "Vrai : Trotzdem gehe ich... (comme deshalb)." },
    { type: "qcm", q: "Quelle phrase est correcte avec obwohl ?", opts: ["Obwohl er ist müde, arbeitet er.", "Obwohl er müde ist, arbeitet er.", "Obwohl arbeitet er müde.", "Er obwohl müde ist."], a: 1, exp: "obwohl -> verbe (ist) à la fin de la subordonnée." },
    { type: "input", q: "Choisis le bon connecteur (sujets différents) : « Ich spreche laut, ___ alle mich hören. »", a: ["damit"], ph: "connecteur de but", exp: "damit (pour que) car les sujets diffèrent : je parle / tous entendent." },
    { type: "vf", q: "« Ich lerne, damit ich bestehe » et « Ich lerne, um zu bestehen » ont le même sujet, donc um...zu est préférable.", a: true, exp: "Vrai : même sujet -> um...zu est la forme naturelle." },
    { type: "qcm", q: "Traduis « bien qu'il soit malade, il travaille » :", opts: ["Trotzdem er krank ist, arbeitet er.", "Obwohl er krank ist, arbeitet er.", "Damit er krank ist, arbeitet er.", "Obwohl er ist krank, arbeitet er."], a: 1, exp: "Obwohl + verbe (ist) à la fin ; puis principale avec inversion (arbeitet er)." },
    { type: "qcm", q: "Compréhension : « Sie hat wenig Geld, trotzdem hilft sie anderen. » Que fait-elle ?", opts: ["Elle refuse d'aider", "Elle aide les autres malgré son peu d'argent", "Elle demande de l'aide", "Elle est riche"], a: 1, exp: "trotzdem hilft sie = malgré cela, elle aide." },
    { type: "qcm", q: "Compréhension : « Ich schreibe es auf, damit ich es nicht vergesse. » Pourquoi l'écrit-elle ?", opts: ["parce qu'elle a oublié", "pour ne pas l'oublier", "bien qu'elle l'oublie", "malgré l'oubli"], a: 1, exp: "damit ich es nicht vergesse = pour que je ne l'oublie pas (but)." }
  ],

    intro: `<p>Lis ce texte sur le quotidien de Tom (obwohl, damit, trotzdem) et réponds.</p>
<pre class="pseudo">Tom steht jeden Morgen frueh auf, obwohl er gern lange schlaeft.
Er macht das, damit er genug Zeit fuer das Fruehstueck hat. Heute
ist er sehr muede, trotzdem geht er zur Arbeit. Er nimmt das Fahrrad,

Abend ist er erschoepft, trotzdem lernt er noch eine Stunde Deutsch,

<p>(erschöpft = épuisé · fallen = tomber · bestehen = réussir un examen)</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi Tom se lève-t-il tôt, alors qu'il aime dormir ?", opts: ["parce qu'il déteste dormir", "pour avoir assez de temps pour le petit-déjeuner", "sans raison", "parce qu'il est en retard"], a: 1, exp: "« damit er genug Zeit für das Frühstück hat »." },
      { type: "input", q: "Complète : « Heute ist er müde, trotzdem ___ er zur Arbeit. » (gehen, 2e position)", a: ["geht"], ph: "verbe en 2e position", exp: "trotzdem geht er : adverbe -> inversion, verbe en 2e position." },
      { type: "input", q: "Complète : « Er nimmt das Fahrrad, obwohl es kalt ___. » (sein, verbe à la fin)", a: ["ist"], ph: "verbe à la fin", exp: "obwohl es kalt ist : verbe à la fin." },
      { type: "qcm", q: "Pourquoi roule-t-il lentement ?", opts: ["pour arriver en retard", "pour ne pas tomber (damit er nicht fällt)", "bien qu'il tombe", "malgré le froid"], a: 1, exp: "« damit er nicht fällt » = pour qu'il ne tombe pas." },
      { type: "vf", q: "Le soir, bien qu'épuisé, Tom apprend encore l'allemand.", a: true, exp: "« ist er erschöpft, trotzdem lernt er noch eine Stunde Deutsch »." }
    ],
    solution: `<p>Le texte oppose deux constructions. Les <strong>subordonnants</strong> obwohl (concession) et damit (but, sujets différents) rejettent le verbe <strong>à la fin</strong> : obwohl er ... schläft / ist ; damit er ... hat / fällt / besteht. L'<strong>adverbe</strong> trotzdem garde le verbe en <strong>2e position</strong> et provoque l'inversion : trotzdem geht er / trotzdem lernt er.</p>
<p>Résumé : obwohl et damit = verbe à la fin ; trotzdem = verbe en 2e position. Et damit s'emploie quand les deux sujets diffèrent (sinon um...zu).</p>`
  }
};
