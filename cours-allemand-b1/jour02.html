<script>
var DAY = {
  num: 2,
  title: "Les propositions relatives (Relativsätze)",
  subtitle: "Relier deux idées : « l'homme QUI parle », « le livre QUE je lis ».",
  theory: `
<h3>1. À quoi sert une relative ?</h3>
<p>Une <strong>proposition relative</strong> ajoute une information sur un nom, sans faire une nouvelle phrase. En français, elle commence par « qui, que, dont, où ». En allemand, elle commence par un <strong>pronom relatif</strong> (der, die, das...) et rejette le <strong>verbe conjugué tout à la fin</strong>.</p>
<pre class="pseudo">Der Mann, der dort steht, ist mein Lehrer.
L'homme qui est là-bas est mon professeur.
Das Buch, das ich lese, ist spannend.
Le livre que je lis est passionnant.</pre>
<div class="warn">Règle d'or : dans la relative, le verbe conjugué part À LA FIN. Et on met toujours une virgule avant le pronom relatif.</div>
<h3>2. Les pronoms relatifs</h3>
<p>Ils ressemblent aux articles définis. Leur forme dépend de deux choses : le <strong>genre/nombre</strong> du nom auquel ils renvoient (l'antécédent), et leur <strong>fonction</strong> (cas) DANS la relative.</p>
<pre class="pseudo">Cas          masculin   féminin   neutre   pluriel
Nominatif    der        die       das      die
Accusatif    den        die       das      die
Datif        dem        der       dem      denen
Génitif      dessen     deren     dessen   deren</pre>
<div class="tip">Presque identiques aux articles ! Les seules surprises : datif pluriel = <strong>denen</strong>, et le génitif = <strong>dessen / deren</strong>.</div>
<h3>3. Comment choisir le bon pronom ?</h3>
<p>Deux questions, dans l'ordre :</p>
<pre class="pseudo">1) De QUEL nom je parle ? -> donne le genre et le nombre
2) Quelle FONCTION dans la relative ? -> donne le cas
   sujet -> nominatif · COD -> accusatif · datif -> datif</pre>
<pre class="pseudo">Der Film, der mir gefaellt, ...   (der Film = masc ; sujet -> der)
Der Film, den ich sehe, ...       (masc ; COD -> den)
Der Mann, dem ich helfe, ...      (masc ; datif de helfen -> dem)</pre>
<h3>4. Avec une préposition</h3>
<p>Si le verbe de la relative demande une préposition, la <strong>préposition passe devant le pronom</strong>, et c'est elle qui fixe le cas.</p>
<pre class="pseudo">Die Frau, mit der ich spreche, ist nett.
La femme avec qui je parle est gentille.
Das Haus, in dem wir wohnen, ist alt.
La maison dans laquelle nous habitons est vieille.</pre>
<h3>5. « où » et « dont »</h3>
<p>Pour un lieu, on peut utiliser <strong>wo</strong> (où) ; pour l'idée de « dont » (possession), on utilise le génitif <strong>dessen / deren</strong>.</p>
<pre class="pseudo">Die Stadt, wo ich geboren bin, ...    la ville où je suis né
Der Mann, dessen Auto rot ist, ...    l'homme dont la voiture est rouge
Die Frau, deren Kinder hier sind, ... la femme dont les enfants sont ici</pre>
<div class="warn">Après dessen/deren, le nom qui suit n'a PAS d'article : dessen Auto (et non dessen das Auto).</div>`,
  exercises: [
    { type: "qcm", q: "Où se place le verbe conjugué dans une relative allemande ?", opts: ["en 2e position", "juste après le pronom", "à la fin de la relative", "au début"], a: 2, exp: "Comme toute subordonnée, le verbe conjugué part à la fin." },
    { type: "qcm", q: "Pronom relatif pour un antécédent masculin, sujet de la relative :", opts: ["den", "der", "dem", "dessen"], a: 1, exp: "Masculin + fonction sujet (nominatif) = der." },
    { type: "input", q: "Complète : « Das Buch, ___ ich lese, ist gut. » (das Buch, COD -> accusatif neutre)", a: ["das"], ph: "pronom relatif", exp: "Neutre + COD (accusatif) = das." },
    { type: "input", q: "Complète : « Der Mann, ___ dort steht, ist mein Lehrer. » (masc, sujet)", a: ["der"], ph: "pronom relatif", exp: "Masculin + sujet = der." },
    { type: "qcm", q: "Antécédent masculin, COD dans la relative. Pronom ?", opts: ["der", "den", "dem", "dessen"], a: 1, exp: "Masculin + accusatif (COD) = den. Ex : Der Film, den ich sehe." },
    { type: "input", q: "Complète : « Die Frau, mit ___ ich spreche, ist nett. » (mit + datif, féminin)", a: ["der"], ph: "pronom relatif", exp: "mit exige le datif ; féminin datif = der." },
    { type: "vf", q: "On met toujours une virgule avant le pronom relatif.", a: true, exp: "Vrai : la relative est une subordonnée, toujours séparée par une virgule." },
    { type: "qcm", q: "Datif pluriel du pronom relatif :", opts: ["die", "der", "denen", "deren"], a: 2, exp: "Le datif pluriel est la forme surprise : denen." },
    { type: "input", q: "Complète : « Das Haus, in ___ wir wohnen, ist alt. » (in + datif, neutre)", a: ["dem"], ph: "pronom relatif", exp: "in (lieu) + datif ; neutre datif = dem." },
    { type: "qcm", q: "Quel pronom pour « dont » (possession) au masculin ?", opts: ["den", "dem", "dessen", "deren"], a: 2, exp: "Génitif masculin/neutre = dessen. Der Mann, dessen Auto..." },
    { type: "vf", q: "Après « dessen » ou « deren », le nom qui suit garde son article défini.", a: false, exp: "Faux : dessen Auto, deren Kinder — sans article." },
    { type: "input", q: "Complète : « Der Mann, ___ Auto rot ist, wohnt hier. » (dont la voiture, masc)", a: ["dessen"], ph: "pronom relatif génitif", exp: "dont (possession) + antécédent masculin = dessen." },
    { type: "qcm", q: "« Die Frau, deren Kinder hier sind » — deren renvoie à…", opts: ["un masculin", "un féminin ou un pluriel", "un neutre seulement", "rien"], a: 1, exp: "deren = génitif féminin ou pluriel. Ici die Frau (fém)." },
    { type: "qcm", q: "Compréhension : « Das ist der Kollege, dem ich oft helfe. » Que fait le locuteur ?", opts: ["Il aide souvent ce collègue", "Ce collègue l'aide", "Il déteste ce collègue", "Il ne connaît pas ce collègue"], a: 0, exp: "helfen + datif : dem ich helfe = à qui j'apporte de l'aide." },
    { type: "qcm", q: "Comment relier : « Die Stadt ist schön. Ich bin dort geboren. » (la ville où je suis né) ?", opts: ["Die Stadt, die schön ist, bin ich geboren.", "Die Stadt, wo ich geboren bin, ist schön.", "Die Stadt, den ich geboren bin, ist schön.", "Die Stadt ist schön, wo."], a: 1, exp: "wo = où (lieu) ; verbe (bin) à la fin de la relative." }
  ],
  final: {
    title: "Exercice final — Meine Nachbarn",
    intro: `<p>Lis ce texte plein de relatives, puis réponds.</p>
<pre class="pseudo">Ich habe nette Nachbarn. Herr Klein, der im ersten Stock wohnt,
ist Lehrer. Die Frau, die neben mir wohnt, heisst Frau Berg.
Ihr Hund, den ich oft sehe, ist sehr freundlich. Das Kind,
mit dem ich manchmal spiele, heisst Tim. Die Familie, deren
Auto immer vor dem Haus steht, faehrt bald in Urlaub. Das ist
die Strasse, wo ich seit zehn Jahren lebe.</pre>
<p>(der Nachbar = le voisin · der Stock = l'étage · in Urlaub fahren = partir en vacances)</p>`,
    questions: [
      { type: "qcm", q: "Qui habite au premier étage ?", opts: ["Frau Berg", "Herr Klein (der im ersten Stock wohnt)", "Tim", "personne"], a: 1, exp: "« Herr Klein, der im ersten Stock wohnt »." },
      { type: "input", q: "Complète : « Die Frau, ___ neben mir wohnt, heisst Frau Berg. » (fém, sujet)", a: ["die"], ph: "pronom relatif", exp: "Féminin + sujet (nominatif) = die." },
      { type: "qcm", q: "Le pronom dans « den ich oft sehe » (le chien) est à quel cas ?", opts: ["nominatif", "accusatif (COD)", "datif", "génitif"], a: 1, exp: "sehen + COD : den = accusatif masculin (der Hund)." },
      { type: "input", q: "Complète : « Das Kind, mit ___ ich spiele, heisst Tim. » (mit + datif, neutre)", a: ["dem"], ph: "pronom relatif", exp: "mit + datif ; neutre datif = dem." },
      { type: "vf", q: "« Die Familie, deren Auto vor dem Haus steht » signifie : la famille dont la voiture est devant la maison.", a: true, exp: "deren = dont (génitif, ici antécédent fém/collectif)." }
    ],
    solution: `<p>Le texte enchaîne plusieurs relatives. Analyse : <strong>der</strong> im ersten Stock wohnt (masc, sujet) ; <strong>die</strong> neben mir wohnt (fém, sujet) ; <strong>den</strong> ich oft sehe (masc, COD) ; mit <strong>dem</strong> ich spiele (neutre, datif après mit) ; <strong>deren</strong> Auto (génitif = dont) ; <strong>wo</strong> ich lebe (lieu).</p>
<p>Méthode : (1) genre/nombre de l'antécédent, (2) fonction dans la relative -> cas. Et n'oublie jamais : virgule avant le pronom, verbe à la fin.</p>`
  }
};
</script>

    hints: [
      "Sujet -> der/die/das ; COD -> den/die/das ; datif -> dem/der/dem/denen.",

      "Varie : « ..., der hier wohnt », « ..., den ich gut kenne », « ..., mit dem ich arbeite »."
    ],
    solution: "Mein Freund Max, der in Berlin wohnt, ist Ingenieur. Die Kollegin, mit der ich jeden Tag arbeite, heisst Sabine. Der Nachbar, den ich oft im Garten sehe, ist sehr freundlich. Meine Lehrerin, deren Kurse ich liebe, spricht vier Sprachen. Das Kind, das nebenan wohnt, spielt gern Fussball.\n\n(Traduction : Mon ami Max, qui habite à Berlin, est ingénieur. La collègue avec qui je travaille chaque jour s'appelle Sabine. Le voisin que je vois souvent dans le jardin est très aimable. Mon enseignante, dont j'adore les cours, parle quatre langues. L'enfant qui habite à côté aime jouer au football.)",

  ]
};
</script>
