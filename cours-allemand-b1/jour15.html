  theory: `
<h3>1. Le vocabulaire de l'environnement</h3>
<p>Le thème de l'écologie (die Umwelt) revient souvent aux examens B1. Voici le lexique essentiel :</p>
<pre class="pseudo">die Umwelt              l'environnement
der Umweltschutz        la protection de l'environnement
der Klimawandel         le changement climatique
die Erderwärmung        le réchauffement de la Terre
die Verschmutzung       la pollution
der Müll / der Abfall   les déchets
die erneuerbare Energie l'énergie renouvelable
die Nachhaltigkeit      la durabilité
der CO2-Ausstoß         les émissions de CO2</pre>
<h3>2. Les gestes écologiques (verbes)</h3>
<pre class="pseudo">recyceln / trennen      recycler / trier
Energie sparen          économiser l'énergie
den Müll trennen        trier les déchets
die Umwelt schützen     protéger l'environnement
verschmutzen            polluer
Wasser sparen           économiser l'eau
zu Fuß gehen / Rad fahren  aller à pied / à vélo</pre>
<pre class="pseudo">Wir sollten mehr Rad fahren und weniger fliegen.
Nous devrions faire plus de vélo et moins prendre l'avion.
Man muss den Müll richtig trennen.
Il faut trier correctement les déchets.</pre>
<h3>3. Donner son opinion (Meinung äußern)</h3>
<p>Pour débattre d'un sujet d'actualité, apprends ces formules d'opinion :</p>
<pre class="pseudo">Ich denke, dass...        Je pense que...
Ich finde, dass...        Je trouve que...
Meiner Meinung nach...    À mon avis...
Ich bin der Meinung, dass...  Je suis d'avis que...
Ich bin dafür / dagegen.  Je suis pour / contre.
Einerseits... andererseits...  D'une part... d'autre part...</pre>
<div class="warn">Après « dass » (que), le verbe conjugué part À LA FIN : Ich denke, dass der Klimawandel ein großes Problem ist. Avec « Meiner Meinung nach » (adverbe en tête), il y a inversion : Meiner Meinung nach ist Recycling wichtig.</div>
<h3>4. Nuancer et argumenter</h3>
<pre class="pseudo">einerseits ... andererseits   d'une part ... d'autre part
zum einen ... zum anderen     d'un côté ... de l'autre
trotzdem                      malgré cela (jour 8)
deshalb / deswegen            c'est pourquoi
zum Beispiel                  par exemple
außerdem                      de plus</pre>
<pre class="pseudo">Einerseits ist Fliegen praktisch, andererseits schadet es der Umwelt.
D'une part l'avion est pratique, d'autre part il nuit à l'environnement.</pre>
<h3>5. L'actualité et la société</h3>
<pre class="pseudo">die Nachrichten          les informations / actualités
die Zeitung              le journal
das Ereignis             l'événement
die Gesellschaft         la société
die Politik              la politique
die Wirtschaft           l'économie
die Digitalisierung      la numérisation
die soziale Medien       les réseaux sociaux</pre>
<pre class="pseudo">In den Nachrichten geht es oft um den Klimawandel.
Dans les infos, il est souvent question du changement climatique.</pre>
<div class="tip">Pour un exposé ou un débat B1, structure ton propos : introduis le thème, donne ton opinion (Ich finde, dass...), un ou deux arguments (einerseits... andererseits...), un exemple (zum Beispiel), puis une conclusion.</div>`,

    { type: "input", q: "Complète : « Ich bin ___ Atomkraft. » (contre)", a: ["gegen"], ph: "préposition", exp: "Ich bin dagegen / gegen etwas = je suis contre." },

    { type: "qcm", q: "Compréhension : « Einerseits ist Fliegen praktisch, andererseits schadet es der Umwelt. » Que dit-on de l'avion ?", opts: ["Il est uniquement pratique", "Il est pratique mais nuit à l'environnement", "Il est interdit", "Il est bon pour l'environnement"], a: 1, exp: "einerseits praktisch, andererseits schadet der Umwelt = pratique mais nuisible." }
  ],

      { type: "qcm", q: "Que pense l'auteur de la protection de l'environnement ?", opts: ["que c'est inutile", "que c'est très important et que chacun peut agir", "que c'est impossible", "que c'est trop cher"], a: 1, exp: "« sehr wichtig ... jeder etwas tun kann »." },
      { type: "input", q: "Complète : « Ich denke, ___ jeder etwas tun kann. » (que -> verbe à la fin)", a: ["dass"], ph: "conjonction", exp: "dass + verbe (kann) à la fin." },
      { type: "qcm", q: "Quels gestes cite l'auteur ?", opts: ["il gaspille l'énergie", "il trie ses déchets, économise l'énergie et fait du vélo", "il prend souvent l'avion", "il ne fait rien"], a: 1, exp: "« trenne ich meinen Müll, spare Energie und fahre oft mit dem Rad »." },
      { type: "vf", q: "L'auteur trouve qu'il n'est pas toujours facile de vivre de façon durable.", a: true, exp: "« Trotzdem ist es nicht immer einfach, nachhaltig zu leben. »" }
    ],
    solution: `<p>Ce texte est un modèle d'opinion structurée B1 : il commence par l'avis (<strong>Meiner Meinung nach ist... / Ich denke, dass...</strong>), nuance avec <strong>einerseits... andererseits...</strong>, illustre avec <strong>zum Beispiel</strong> (trier, économiser, faire du vélo), ajoute un argument avec <strong>außerdem... weil...</strong>, et conclut avec <strong>trotzdem</strong>.</p>
<p>Note la syntaxe : après <strong>dass</strong> et <strong>weil</strong>, le verbe part à la fin ; après <strong>Meiner Meinung nach</strong> et <strong>trotzdem</strong> (adverbes en tête), il y a inversion. Le vocabulaire clé : <strong>Umweltschutz, Müll trennen, Energie sparen, nachhaltig</strong>.</p>`
  }
