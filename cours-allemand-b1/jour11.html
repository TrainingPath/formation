<script>
var DAY = {
  num: 11,
  title: "Les prépositions avec génitif",
  subtitle: "während, wegen, trotz, statt : un langage plus soutenu.",
  theory: `
<h3>1. Des prépositions qui commandent le génitif</h3>
<p>Tu connais les prépositions avec accusatif (für, ohne...) et datif (mit, bei...). Il existe aussi un petit groupe de prépositions qui exigent le <strong>génitif</strong>. Elles donnent un ton plus soutenu, fréquent à l'écrit et dans les textes officiels.</p>
<pre class="pseudo">während  = pendant (durée)
wegen    = à cause de
trotz    = malgré
statt / anstatt = au lieu de</pre>
<div class="tip">Rappel : au génitif, l'article devient des (masc./neutre, + nom en -(e)s) ou der (fém./pluriel). Voir jour 1.</div>
<h3>2. während : pendant</h3>
<p><strong>während</strong> exprime une durée : « pendant, au cours de ».</p>
<pre class="pseudo">während des Tages       pendant la journée (der Tag -> des Tages)
während der Woche       pendant la semaine (die Woche -> der Woche)
während der Ferien      pendant les vacances (pluriel -> der)</pre>
<pre class="pseudo">Während des Films hat er geschlafen.
Pendant le film, il a dormi.</pre>
<h3>3. wegen : à cause de</h3>
<p><strong>wegen</strong> exprime la cause : « à cause de, en raison de ».</p>
<pre class="pseudo">wegen des Wetters       à cause du temps (das Wetter -> des Wetters)
wegen der Verspätung    à cause du retard (die Verspätung -> der)
wegen eines Fehlers     à cause d'une erreur</pre>
<pre class="pseudo">Wegen des Regens bleiben wir zu Hause.
À cause de la pluie, nous restons à la maison.</pre>
<h3>4. trotz : malgré</h3>
<p><strong>trotz</strong> exprime la concession : « malgré ». À ne pas confondre avec trotzdem (adverbe, jour 8) !</p>
<pre class="pseudo">trotz des Regens        malgré la pluie
trotz der Kälte         malgré le froid
trotz der Probleme      malgré les problèmes</pre>
<pre class="pseudo">Trotz des schlechten Wetters gehen wir spazieren.
Malgré le mauvais temps, nous allons nous promener.</pre>
<div class="warn">trotz + génitif = préposition (trotz DES Regens). trotzdem = adverbe (Es regnet. Trotzdem gehen wir.). Ne les confonds pas.</div>
<h3>5. statt / anstatt : au lieu de</h3>
<p><strong>statt</strong> (ou anstatt) = « au lieu de, à la place de ».</p>
<pre class="pseudo">statt des Autos         au lieu de la voiture
statt eines Briefes     au lieu d'une lettre
Statt des Kuchens nehme ich einen Salat.
Au lieu du gâteau, je prends une salade.</pre>
<div class="tip">À l'oral familier, on entend souvent ces prépositions avec le datif (wegen dem Wetter, trotz dem Regen). C'est toléré, mais pour l'écrit et l'examen B1, garde le GÉNITIF (wegen des Wetters, trotz des Regens).</div>`,
  exercises: [
    { type: "qcm", q: "Quel cas exigent während, wegen, trotz, statt ?", opts: ["l'accusatif", "le datif", "le génitif", "le nominatif"], a: 2, exp: "Ce sont des prépositions à génitif." },
    { type: "qcm", q: "Que signifie « während » ?", opts: ["à cause de", "pendant", "malgré", "au lieu de"], a: 1, exp: "während = pendant (durée)." },
    { type: "input", q: "Complète : « während ___ Films » (das/der Film au génitif : pendant le film)", a: ["des"], ph: "article génitif", exp: "der Film (masc) -> des Films : während des Films." },
    { type: "qcm", q: "Que signifie « wegen » ?", opts: ["pendant", "à cause de", "malgré", "sans"], a: 1, exp: "wegen = à cause de (cause)." },
    { type: "input", q: "Complète : « wegen ___ Wetters » (das Wetter au génitif : à cause du temps)", a: ["des"], ph: "article génitif", exp: "das Wetter (neutre) -> des Wetters." },
    { type: "qcm", q: "Que signifie « trotz » ?", opts: ["grâce à", "malgré", "pendant", "au lieu de"], a: 1, exp: "trotz = malgré (concession)." },
    { type: "vf", q: "« trotz » (préposition + génitif) et « trotzdem » (adverbe) sont interchangeables.", a: false, exp: "Faux : trotz + génitif (trotz des Regens) ; trotzdem = adverbe (Es regnet. Trotzdem...)." },
    { type: "input", q: "Complète : « trotz ___ Kälte » (die Kälte au génitif : malgré le froid)", a: ["der"], ph: "article génitif", exp: "die Kälte (fém) -> der Kälte : trotz der Kälte." },
    { type: "qcm", q: "Que signifie « statt / anstatt » ?", opts: ["au lieu de", "à cause de", "pendant", "malgré"], a: 0, exp: "statt = au lieu de." },
    { type: "input", q: "Complète : « statt ___ Autos » (das Auto au génitif : au lieu de la voiture)", a: ["des"], ph: "article génitif", exp: "das Auto -> des Autos : statt des Autos." },
    { type: "qcm", q: "« Wegen des Regens bleiben wir zu Hause » signifie…", opts: ["Malgré la pluie, on sort", "À cause de la pluie, on reste à la maison", "Pendant la pluie, on marche", "Au lieu de la pluie"], a: 1, exp: "wegen des Regens = à cause de la pluie." },
    { type: "input", q: "Complète : « während ___ Ferien » (les vacances, pluriel au génitif)", a: ["der"], ph: "article génitif", exp: "Pluriel au génitif -> der : während der Ferien." },
    { type: "vf", q: "Pour l'examen B1 et l'écrit, on garde le génitif (wegen des Wetters).", a: true, exp: "Vrai : le datif (wegen dem Wetter) reste familier/oral." },
    { type: "qcm", q: "Quelle phrase est correcte à l'écrit soutenu ?", opts: ["trotz dem schlechten Wetter", "trotz das schlechte Wetter", "trotz des schlechten Wetters", "trotz der schlechtes Wetter"], a: 2, exp: "trotz + génitif neutre : des schlechten Wetters." },
    { type: "qcm", q: "Compréhension : « Statt eines Briefes hat er eine E-Mail geschickt. » Qu'a-t-il fait ?", opts: ["Il a envoyé une lettre", "Il a envoyé un e-mail au lieu d'une lettre", "Il n'a rien envoyé", "Il a téléphoné"], a: 1, exp: "statt eines Briefes = au lieu d'une lettre ; il a envoyé un e-mail." }
  ],
  final: {
    title: "Exercice final — Der verregnete Ausflug",
    intro: `<p>Lis ce texte (prépositions avec génitif) et réponds.</p>
<pre class="pseudo">Waehrend der Sommerferien wollten wir einen Ausflug in die Berge
machen. Doch wegen des schlechten Wetters mussten wir umplanen.
Trotz des Regens sind wir trotzdem losgefahren. Statt der Wanderung
haben wir ein Museum besucht. Waehrend des Besuchs hat es stark
geregnet. Wegen der Kaelte haben wir heissen Tee getrunken. Trotz
der Aenderung war der Tag am Ende sehr schoen.</pre>
<p>(der Ausflug = l'excursion · umplanen = changer de plan · die Wanderung = la randonnée)</p>`,
    questions: [
      { type: "input", q: "Complète : « Während ___ Sommerferien » (les vacances d'été, pluriel génitif)", a: ["der"], ph: "article génitif", exp: "Pluriel au génitif -> der : während der Sommerferien." },
      { type: "qcm", q: "Pourquoi ont-ils dû changer de plan ?", opts: ["à cause du mauvais temps (wegen des schlechten Wetters)", "à cause du travail", "à cause de l'argent", "sans raison"], a: 0, exp: "« wegen des schlechten Wetters mussten wir umplanen »." },
      { type: "input", q: "Complète : « Statt ___ Wanderung haben wir ein Museum besucht. » (die Wanderung, génitif)", a: ["der"], ph: "article génitif", exp: "die Wanderung (fém) -> der : statt der Wanderung." },
      { type: "vf", q: "Le texte utilise à la fois « trotz » (préposition) et « trotzdem » (adverbe).", a: true, exp: "« Trotz des Regens sind wir trotzdem losgefahren » : les deux formes cohabitent." },
      { type: "qcm", q: "Comment était finalement la journée ?", opts: ["ennuyeuse", "très belle malgré le changement (trotz der Änderung)", "annulée", "trop courte"], a: 1, exp: "« Trotz der Änderung war der Tag am Ende sehr schön »." }
    ],
    solution: `<p>Le texte enchaîne les quatre prépositions à génitif : <strong>während der Sommerferien / während des Besuchs</strong> (pendant), <strong>wegen des schlechten Wetters / wegen der Kälte</strong> (à cause de), <strong>trotz des Regens / trotz der Änderung</strong> (malgré), <strong>statt der Wanderung</strong> (au lieu de).</p>
<p>Chaque fois, l'article est au génitif : <strong>des</strong> (masc./neutre + nom en -(e)s), <strong>der</strong> (féminin/pluriel). Et ne confonds pas trotz (préposition + génitif) avec trotzdem (adverbe).</p>`
  }
};
</script>
