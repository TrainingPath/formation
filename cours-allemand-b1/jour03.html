<script>
var DAY = {
  num: 3,
  title: "Le passif (werden)",
  subtitle: "Mettre l'action au centre : « la maison EST construite ».",
  theory: `
<h3>1. Actif ou passif ?</h3>
<p>À la voix <strong>active</strong>, le sujet fait l'action : « L'ouvrier construit la maison ». À la voix <strong>passive</strong>, on met l'<strong>action</strong> (ou l'objet) au premier plan, et l'auteur devient secondaire, voire disparaît : « La maison EST construite ».</p>
<pre class="pseudo">Actif :   Der Arbeiter baut das Haus.   L'ouvrier construit la maison.
Passif :  Das Haus wird gebaut.         La maison est construite.</pre>
<div class="tip">On utilise le passif quand l'auteur de l'action est inconnu, évident ou sans importance. Très fréquent dans les notices, les règles, les informations.</div>
<h3>2. La formule du passif au présent</h3>
<p>Passif = <strong>werden</strong> (conjugué) + <strong>participe passé</strong> (Partizip II), rejeté à la fin.</p>
<pre class="pseudo">ich werde   wir werden
du wirst    ihr werdet
er/sie wird sie/Sie werden

Das Auto wird repariert.       La voiture est réparée.
Die Briefe werden geschrieben. Les lettres sont écrites.</pre>
<div class="warn">Ne confonds pas ! werden a trois emplois : (1) verbe seul = devenir ; (2) werden + infinitif = futur ; (3) werden + PARTICIPE PASSÉ = passif. Ici c'est le participe passé qui compte.</div>
<h3>3. Exprimer l'auteur : von / durch</h3>
<p>Si on veut nommer l'auteur, on l'introduit par une préposition + datif :</p>
<pre class="pseudo">von + datif   : l'auteur (personne, agent actif)
durch + accus. : le moyen, la cause

Das Haus wird von dem Arbeiter gebaut.
La maison est construite PAR l'ouvrier.
Die Stadt wurde durch das Feuer zerstoert.
La ville a été détruite PAR le feu.</pre>
<h3>4. De l'actif au passif : la transformation</h3>
<p>Le COD (accusatif) de la phrase active devient le <strong>sujet</strong> (nominatif) de la phrase passive.</p>
<pre class="pseudo">Actif :  Die Firma  produziert  neue Autos.
                                  (COD, accusatif)
Passif : Neue Autos  werden  produziert.
         (sujet, nominatif)</pre>
<pre class="pseudo">Der Lehrer korrigiert die Tests.   -> actif
Die Tests werden korrigiert.        -> passif</pre>
<h3>5. Passif sans sujet précis : man</h3>
<p>Souvent, plutôt que le passif, l'allemand utilise <strong>man</strong> (« on ») à l'actif. Les deux se traduisent souvent pareil en français.</p>
<pre class="pseudo">Hier wird Deutsch gesprochen.  = Man spricht hier Deutsch.
Ici on parle allemand.</pre>
<div class="tip">Pour reconnaître un passif, cherche toujours le duo werden + participe passé. Si tu vois werden seul + infinitif, c'est du futur, pas du passif.</div>`,
  exercises: [
    { type: "qcm", q: "Comment se forme le passif au présent ?", opts: ["sein + participe", "haben + infinitif", "werden + participe passé", "werden + infinitif"], a: 2, exp: "Passif = werden conjugué + Partizip II à la fin." },
    { type: "input", q: "Complète : « Das Auto ___ repariert. » (passif présent, 3e sing. de werden)", a: ["wird"], ph: "werden conjugué", exp: "er/sie/es wird : Das Auto wird repariert." },
    { type: "qcm", q: "« Die Briefe werden geschrieben » signifie…", opts: ["Les lettres vont écrire", "Les lettres sont écrites", "Les lettres deviennent", "On écrira des lettres"], a: 1, exp: "werden + geschrieben (participe) = passif : sont écrites." },
    { type: "input", q: "Complète au pluriel : « Die Tests ___ korrigiert. » (werden)", a: ["werden"], ph: "werden conjugué", exp: "Pluriel : Die Tests werden korrigiert." },
    { type: "qcm", q: "Quelle préposition introduit l'AUTEUR (personne) au passif ?", opts: ["durch", "von", "mit", "für"], a: 1, exp: "von + datif pour l'agent : von dem Arbeiter." },
    { type: "qcm", q: "Quelle préposition introduit le MOYEN ou la cause ?", opts: ["von", "durch", "bei", "zu"], a: 1, exp: "durch + accusatif : durch das Feuer (par le feu)." },
    { type: "vf", q: "Dans « Das Haus wird von dem Arbeiter gebaut », l'auteur est l'ouvrier.", a: true, exp: "von dem Arbeiter = par l'ouvrier (agent)." },
    { type: "input", q: "Transforme au passif : « Der Lehrer korrigiert die Tests. » -> « Die Tests ___ korrigiert. »", a: ["werden"], ph: "werden conjugué", exp: "Le COD die Tests devient sujet pluriel : werden." },
    { type: "qcm", q: "Au passif, l'ancien COD (accusatif) devient…", opts: ["le datif", "le sujet (nominatif)", "un génitif", "il disparaît toujours"], a: 1, exp: "Le COD actif devient sujet au nominatif dans le passif." },
    { type: "input", q: "Complète : « Hier ___ Deutsch gesprochen. » (passif, 3e sing.)", a: ["wird"], ph: "werden conjugué", exp: "Hier wird Deutsch gesprochen = ici on parle allemand." },
    { type: "qcm", q: "Quel équivalent actif remplace souvent le passif en allemand ?", opts: ["es gibt", "man + verbe actif", "haben + zu", "sein + Adjektiv"], a: 1, exp: "man spricht = on parle, équivaut à wird gesprochen." },
    { type: "vf", q: "« Er wird morgen kommen » est une phrase au passif.", a: false, exp: "Faux : werden + infinitif (kommen) = FUTUR, pas passif. Le passif exige un participe passé." },
    { type: "qcm", q: "Quelle phrase est au passif ?", opts: ["Er wird Arzt.", "Sie wird singen.", "Das Zimmer wird geputzt.", "Wir werden alt."], a: 2, exp: "geputzt est un participe passé -> passif. Les autres : devenir / futur." },
    { type: "input", q: "Complète : « Neue Autos ___ hier produziert. » (passif pluriel)", a: ["werden"], ph: "werden conjugué", exp: "Pluriel : werden produziert (sont produites)." },
    { type: "qcm", q: "Compréhension : « In dieser Fabrik werden Schokoladen hergestellt. » Que se passe-t-il ?", opts: ["On vend des chocolats", "Des chocolats sont fabriqués", "On mange des chocolats", "La fabrique ferme"], a: 1, exp: "werden hergestellt = sont fabriqués (herstellen = fabriquer)." }
  ],
  final: {
    title: "Exercice final — In der Fabrik",
    intro: `<p>Lis cette description d'une usine (beaucoup de passifs), puis réponds.</p>
<pre class="pseudo">In dieser Fabrik werden Autos produziert. Jeden Tag werden Hunderte
Teile geliefert. Zuerst wird der Motor gebaut, dann wird die Karosserie
montiert. Die Autos werden von Robotern lackiert. Am Ende wird jedes
Auto genau kontrolliert. Die fertigen Wagen werden durch einen grossen
Tunnel zum Parkplatz gefahren. Auch am Wochenende wird hier gearbeitet.</pre>
<p>(das Teil = la pièce · liefern = livrer · lackieren = peindre · fertig = terminé)</p>`,
    questions: [
      { type: "qcm", q: "Que produit-on dans cette usine ?", opts: ["des motos", "des voitures (Autos)", "des robots", "du chocolat"], a: 1, exp: "« werden Autos produziert » = des voitures sont produites." },
      { type: "input", q: "Complète : « Zuerst ___ der Motor gebaut. » (passif présent, 3e sing.)", a: ["wird"], ph: "werden conjugué", exp: "der Motor (sing.) wird gebaut." },
      { type: "qcm", q: "Qui peint les voitures ?", opts: ["des ouvriers", "des robots (von Robotern)", "le patron", "personne"], a: 1, exp: "« von Robotern lackiert » = peintes par des robots (agent : von)." },
      { type: "vf", q: "On travaille aussi le week-end dans cette usine.", a: true, exp: "« Auch am Wochenende wird hier gearbeitet. » (passif impersonnel)." },
      { type: "input", q: "Complète au pluriel : « Die fertigen Wagen ___ zum Parkplatz gefahren. »", a: ["werden"], ph: "werden conjugué", exp: "Pluriel die Wagen : werden gefahren." }
    ],
    solution: `<p>Toute la description est au passif présent, car ce qui compte est l'action, pas l'auteur : <strong>werden produziert, wird gebaut, wird montiert, werden lackiert, wird kontrolliert, werden gefahren, wird gearbeitet</strong>. On repère chaque fois le duo <strong>werden + participe passé</strong>.</p>
<p>L'agent apparaît une fois : <strong>von Robotern</strong> (par des robots) ; le moyen une fois : <strong>durch einen Tunnel</strong> (par un tunnel). Retiens : von = auteur, durch = moyen/cause.</p>`
  }
};
</script>

      "Structure les étapes avec zuerst, dann, danach, am Ende.",

    solution: "Zuerst werden die Zutaten gekauft. Dann wird das Gemuese gewaschen und geschnitten. Danach wird das Fleisch in der Pfanne gebraten. Die Sauce wird von meiner Mutter vorbereitet. Am Ende wird alles zusammen gekocht und serviert. Der Tisch wird schoen dekoriert.\n\n(Traduction : D'abord les ingrédients sont achetés. Ensuite les légumes sont lavés et coupés. Puis la viande est cuite à la poêle. La sauce est préparée par ma mère. À la fin tout est cuit ensemble et servi. La table est joliment décorée.)",
