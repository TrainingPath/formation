  theory: `
<h3>1. Qu'est-ce que la nominalisation ?</h3>
<p>La <strong>nominalisation</strong> (die Nominalisierung), c'est transformer un verbe ou un adjectif en <strong>nom</strong>. C'est très fréquent en allemand écrit (presse, administration, textes soignés) : cela condense l'information. En allemand, tout nom prend une <strong>majuscule</strong> et un <strong>genre</strong>.</p>
<pre class="pseudo">Verbe                 Nom
lesen (lire)      →   das Lesen (la lecture / le fait de lire)
essen (manger)    →   das Essen (le repas / le manger)
Adjectif              Nom
schön (beau)      →   das Schöne (le beau, ce qui est beau)
gut (bon)         →   das Gute (le bien)</pre>
<h3>2. Nominaliser un verbe : l'infinitif substantivé</h3>
<p>Le plus simple : on prend l'infinitif tel quel, on met une majuscule, il devient un nom <strong>neutre</strong> (das).</p>
<pre class="pseudo">Rauchen ist verboten.            Fumer est interdit. (das Rauchen)
Das Lernen macht mir Spaß.       Apprendre me plaît. (das Lernen)
Beim Kochen höre ich Musik.      En cuisinant, j'écoute de la musique.</pre>
<div class="tip">Après une préposition, l'infinitif substantivé est très courant : <em>beim Essen</em> (en mangeant), <em>zum Lernen</em> (pour apprendre), <em>vor dem Schlafen</em> (avant de dormir).</p></div>
<h3>3. Les suffixes qui fabriquent des noms</h3>
<p>Beaucoup de noms se forment avec des suffixes réguliers. Connaître le suffixe donne souvent le genre :</p>
<pre class="pseudo">-ung   (féminin, die)   verbe → nom d'action
   bilden → die Bildung (l'éducation)   ·   lösen → die Lösung (la solution)
-heit / -keit  (féminin, die)   adjectif → nom de qualité
   frei → die Freiheit (la liberté)   ·   möglich → die Möglichkeit (la possibilité)
-er    (masculin, der)   verbe → celui qui fait
   lehren → der Lehrer (l'enseignant)   ·   fahren → der Fahrer (le conducteur)</pre>
<div class="warn">Retiens les genres par suffixe : <strong>-ung, -heit, -keit → die (féminin)</strong> ; <strong>-er (agent) → der (masculin)</strong> ; <strong>infinitif substantivé → das (neutre)</strong>. C'est une aide précieuse pour deviner l'article.</p></div>
<h3>4. Nominaliser un adjectif</h3>
<p>Un adjectif peut devenir un nom, souvent précédé d'un article. Il garde une terminaison d'adjectif et prend une majuscule.</p>
<pre class="pseudo">der/die Deutsche      l'Allemand(e)      der Kranke   le malade
etwas Neues           quelque chose de nouveau
nichts Besonderes     rien de particulier
das Wichtigste        le plus important</pre>
<h3>5. Comparaison : verbe vs nominalisation</h3>
<pre class="pseudo">Style verbal (oral)          Style nominal (écrit soigné)
Weil die Preise steigen, ...  →  Wegen des Preisanstiegs, ...
                                 (à cause de la hausse des prix)
Nachdem wir angekommen sind   →  Nach unserer Ankunft
(après que nous sommes arrivés)  (après notre arrivée)</pre>
<p>(der Anstieg = la hausse · die Ankunft = l'arrivée)</p>`,

    { type: "vf", q: "L'adjectif nominalisé « das Wichtigste » signifie « le plus important ».", a: true, exp: "wichtig → das Wichtigste = le plus important." },

    intro: `<p>Lis ce texte au style nominal (typique de l'écrit soigné) et repère les nominalisations, puis réponds.</p>
<pre class="pseudo">Das Lernen einer Fremdsprache bringt viele Vorteile. Die Bildung
verbessert die Chancen auf dem Arbeitsmarkt, und das Reisen wird

Das Wichtigste ist die Regelmäßigkeit: Ein tägliches Üben von zehn
Minuten bringt mehr als eine lange Sitzung pro Woche. Die Freiheit,
sich in einer neuen Sprache auszudrücken, ist die Mühe wert.</pre>
<p>(die Fremdsprache = la langue étrangère · der Arbeitsmarkt = le marché du travail · die Geduld = la patience · die Angst = la peur · die Regelmäßigkeit = la régularité · die Sitzung = la séance · die Mühe = l'effort)</p>`,

      { type: "qcm", q: "« die Bildung » (nom en -ung) vient du verbe…", opts: ["bilden (former/éduquer)", "bitten", "bleiben", "binden"], a: 0, exp: "bilden → die Bildung = l'éducation." },
      { type: "qcm", q: "Selon le texte, qu'est-ce qui est le plus important pour progresser ?", opts: ["Le talent", "La régularité (das Wichtigste ist die Regelmäßigkeit)", "L'argent", "Le professeur"], a: 1, exp: "« Das Wichtigste ist die Regelmäßigkeit »." },
      { type: "vf", q: "« die Freiheit » est un nom formé sur l'adjectif « frei » avec le suffixe -heit.", a: true, exp: "frei → die Freiheit (suffixe -heit, féminin)." },
      { type: "qcm", q: "Que veut dire « die Angst vor Fehlern ist groß » ?", opts: ["Il n'y a pas de fautes", "La peur des fautes est grande", "Les fautes sont interdites", "Les fautes sont petites"], a: 1, exp: "die Angst = la peur ; vor Fehlern = des fautes." }
    ],
    solution: `<p>Le texte est truffé de nominalisations, ce qui lui donne son style écrit soigné :</p>
<pre class="pseudo">das Lernen, das Reisen, das Sprechen, das Üben   → infinitifs substantivés (das)
die Bildung, die Kommunikation, die Verbesserung, die Regelmäßigkeit   → suffixe -ung (die)
die Freiheit   → suffixe -heit (die), de frei
das Wichtigste   → adjectif nominalisé (le plus important)</pre>
<p>Chaque nominalisation condense une idée : au lieu de « wenn man eine Sprache lernt » on écrit « das Lernen einer Fremdsprache ». Ce style est fréquent dans les textes formels — sache le reconnaître et l'employer avec mesure.</p>`
