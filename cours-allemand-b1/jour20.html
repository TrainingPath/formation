<script>
var DAY = {
  num: 20,
  title: "Les particules modales (doch, mal, ja, denn)",
  subtitle: "Ces petits mots qui donnent le ton et rendent l'allemand naturel.",
  theory: `
<h3>1. Qu'est-ce qu'une particule modale ?</h3>
<p>Les <strong>Modalpartikeln</strong> (particules modales) sont de petits mots (doch, mal, ja, denn, halt, eben...) qui n'ajoutent presque pas de sens dictionnaire, mais qui expriment une <strong>attitude</strong> du locuteur : surprise, impatience, gentillesse, évidence. On ne peut souvent pas les traduire mot à mot en français : on rend la nuance par le ton ou par un mot comme « donc », « quand même », « voyons ».</p>
<div class="tip">Bonne nouvelle : tu n'as pas besoin de toutes les maîtriser pour parler. Mais les reconnaître te fait comprendre l'intention réelle de ton interlocuteur — c'est un vrai marqueur de niveau B1/B2.</p></div>
<h3>2. denn — l'intérêt dans les questions</h3>
<p>Dans une <strong>question</strong>, <em>denn</em> rend le ton plus aimable, moins sec, marque l'intérêt (comme « donc / alors » en français).</p>
<pre class="pseudo">Was machst du?            Que fais-tu ?  (neutre, peut sembler sec)
Was machst du denn?       Qu'est-ce que tu fais donc ?  (curieux, chaleureux)
Wo warst du denn?         Mais où étais-tu donc ?</pre>
<div class="warn">Ne confonds pas ce <em>denn</em> (particule, dans une question) avec le coordonnant <em>denn</em> = « car » (jour 19). Le contexte les distingue : une question → particule ; une explication → « car ».</p></div>
<h3>3. mal — adoucir un ordre</h3>
<p><em>mal</em> (forme courte de <em>einmal</em>) adoucit un impératif : la demande devient une invitation décontractée, comme « donc / voir » en français.</p>
<pre class="pseudo">Komm her!          Viens ici !  (ordre)
Komm mal her!      Viens voir un peu !  (plus doux, amical)
Warte mal!         Attends voir !
Kannst du mir mal helfen?   Tu peux m'aider un instant ?</pre>
<h3>4. doch — contredire, insister, encourager</h3>
<p><em>doch</em> est la plus riche. Trois emplois fréquents :</p>
<pre class="pseudo">1) Réponse positive à une question NÉGATIVE :
   — Du kommst nicht?  (Tu ne viens pas ?)
   — Doch!             (Si ! [au contraire, je viens])
2) Insistance / évidence :
   Das weißt du doch!   Mais tu le sais bien !
3) Encouragement (avec impératif) :
   Komm doch mit!       Allez, viens donc avec nous !</pre>
<div class="tip">Le <strong>doch</strong> de réponse (« Si ! ») n'existe pas en anglais mais correspond exactement au « Si ! » français après une question négative. Très utile.</p></div>
<h3>5. ja — l'évidence partagée</h3>
<p>Dans une affirmation, <em>ja</em> (non accentué, au milieu de la phrase) signale que l'information est <strong>évidente</strong> ou déjà connue, un peu comme « comme tu sais / bien sûr ».</p>
<pre class="pseudo">Das ist ja toll!         Mais c'est génial ! (surprise agréable)
Du weißt ja, dass ...    Tu sais bien que ...
Es ist ja spät.          Il est vrai qu'il est tard.</pre>
<h3>6. Comparaison rapide</h3>
<pre class="pseudo">denn   question aimable      Warum lachst du denn?
mal    ordre adouci          Zeig mal!
doch   « si ! » / insistance  Doch! / Das stimmt doch!
ja     évidence / surprise    Das ist ja unglaublich!</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi servent les particules modales (Modalpartikeln) ?", opts: ["À conjuguer le verbe", "À exprimer une attitude / une nuance du locuteur", "À former le pluriel", "À poser l'accent tonique"], a: 1, exp: "Elles expriment surprise, intérêt, insistance... plus qu'un sens précis." },
    { type: "qcm", q: "Dans « Was machst du denn? », le mot « denn » exprime…", opts: ["une cause (car)", "de l'intérêt / un ton aimable dans la question", "une négation", "le futur"], a: 1, exp: "Dans une question, denn = ton curieux et chaleureux." },
    { type: "vf", q: "Le « denn » de « Was machst du denn? » signifie « car » comme dans « ich bleibe, denn ich bin krank ».", a: false, exp: "Non : ici denn est une particule modale (question aimable), pas le coordonnant « car »." },
    { type: "qcm", q: "« Komm mal her! » par rapport à « Komm her! » est…", opts: ["plus sec", "plus doux, plus amical", "au passé", "une question"], a: 1, exp: "mal adoucit l'impératif : « viens voir un peu »." },
    { type: "input", q: "Adoucis l'ordre « Warte! » avec une particule : « Warte ___! »", a: ["mal"], ph: "particule", exp: "Warte mal! = attends voir (plus doux)." },
    { type: "qcm", q: "— « Du kommst nicht? » Réponse pour dire « Si ! (je viens) » :", opts: ["Ja!", "Nein!", "Doch!", "Denn!"], a: 2, exp: "Après une question négative, on répond « Doch! » pour contredire (= Si !)." },
    { type: "vf", q: "« Doch! » sert à répondre positivement à une question posée à la forme négative.", a: true, exp: "C'est l'équivalent du « Si ! » français." },
    { type: "qcm", q: "« Das weißt du doch! » exprime…", opts: ["une question", "une insistance : « mais tu le sais bien ! »", "un ordre", "un doute"], a: 1, exp: "doch marque ici l'évidence / l'insistance." },
    { type: "input", q: "Encourage quelqu'un à venir : « Komm ___ mit! » (particule d'encouragement)", a: ["doch"], ph: "particule", exp: "Komm doch mit! = allez, viens donc avec nous." },
    { type: "qcm", q: "« Das ist ja toll! » — que marque « ja » ici ?", opts: ["une négation", "une surprise / une évidence agréable", "le passé", "une question"], a: 1, exp: "ja au milieu d'une affirmation = surprise ou évidence (« mais c'est génial ! »)." },
    { type: "qcm", q: "Quelle particule adoucit surtout l'IMPÉRATIF ?", opts: ["denn", "mal", "ja", "ob"], a: 1, exp: "mal adoucit l'ordre : Komm mal!, Zeig mal!" },
    { type: "input", q: "Rends la question plus aimable : « Wo warst du ___? » (particule d'intérêt)", a: ["denn"], ph: "particule", exp: "Wo warst du denn? = mais où étais-tu donc ?" },
    { type: "vf", q: "On peut cumuler deux particules, comme dans « Komm doch mal her! ».", a: true, exp: "Oui : doch + mal se combinent souvent (encouragement + adoucissement)." },
    { type: "qcm", q: "Compréhension : ton ami dit « Das weißt du doch!». Il veut dire…", opts: ["Il te pose une question", "Il te reproche gentiment de faire semblant de ne pas savoir", "Il ne sait pas", "Il te remercie"], a: 1, exp: "doch = « voyons, tu le sais bien ! »." },
    { type: "qcm", q: "Laquelle de ces phrases utilise « ja » comme particule modale (et non comme « oui ») ?", opts: ["Ja, ich komme.", "Das ist ja unglaublich!", "Ja oder nein?", "Ja bitte."], a: 1, exp: "« Das ist ja unglaublich! » : ja au milieu = surprise. Les autres = « oui »." }
  ],
  final: {
    title: "Exercice final — Ein lebendiger Dialog",
    intro: `<p>Lis ce dialogue naturel entre deux amis. Repère les particules modales, puis réponds.</p>
<pre class="pseudo">Lisa: Was machst du denn hier? Ich dachte, du bist im Urlaub!
Tom:  Ach, der Flug wurde gestrichen. Das ist ja ärgerlich, oder?
Lisa: Oh nein! Aber komm doch mal rein, ich mache uns einen Kaffee.
Tom:  Danke. Du weißt ja, ich trinke ihn gern stark.
Lisa: Klar. Erzähl mal, was ist genau passiert?
Tom:  Kommst du morgen nicht zur Party?
Lisa: Doch, natürlich komme ich! Ich habe es dir doch versprochen.</pre>
<p>(streichen = annuler · ärgerlich = agaçant · reinkommen = entrer · versprechen = promettre)</p>`,
    questions: [
      { type: "qcm", q: "Dans « Was machst du denn hier? », « denn » exprime…", opts: ["une cause", "la surprise / l'intérêt de Lisa", "un ordre", "une négation"], a: 1, exp: "denn dans la question = surprise chaleureuse : « qu'est-ce que tu fais donc ici ? »." },
      { type: "qcm", q: "« Das ist ja ärgerlich » — que marque « ja » ?", opts: ["une question", "l'évidence / le partage d'un sentiment (c'est vraiment agaçant)", "une négation", "le futur"], a: 1, exp: "ja souligne que l'agacement est évident et partagé." },
      { type: "input", q: "Lisa invite Tom à entrer avec encouragement : « Aber komm ___ mal rein! » (particule)", a: ["doch"], ph: "particule", exp: "komm doch mal rein = allez, entre donc." },
      { type: "vf", q: "Quand Tom demande « Kommst du morgen nicht zur Party? », Lisa répond « Doch! » pour dire qu'elle vient bien.", a: true, exp: "Question négative → réponse « Doch! » = Si, je viens !" },
      { type: "qcm", q: "« Ich habe es dir doch versprochen » — que veut dire Lisa avec « doch » ?", opts: ["Elle n'a rien promis", "Elle insiste : « je te l'avais quand même promis »", "Elle pose une question", "Elle a oublié"], a: 1, exp: "doch = insistance / rappel d'une évidence." }
    ],
    solution: `<p>Le dialogue est truffé de particules qui le rendent vivant :</p>
<pre class="pseudo">denn   « Was machst du denn hier? »   surprise / intérêt
ja     « Das ist ja ärgerlich »        évidence, sentiment partagé
doch + mal  « komm doch mal rein »     encouragement + douceur
ja     « Du weißt ja »                 « comme tu sais »
mal    « Erzähl mal »                  ordre adouci
Doch!  réponse à question négative     « Si, bien sûr ! »
doch   « Ich habe es dir doch versprochen »  insistance / rappel</pre>
<p>Sans ces particules, le dialogue serait grammaticalement correct mais froid et mécanique. Les maîtriser (même passivement) est la clé pour sonner naturel.</p>`
  }
};
</script>
