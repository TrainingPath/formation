  title: "Rédiger un e-mail formel",
  subtitle: "Les formules de politesse et la structure d'un mail professionnel allemand.",
  theory: `
<h3>1. La structure d'un e-mail formel</h3>
<p>Un e-mail formel allemand (eine formelle E-Mail) suit un ordre très codifié :</p>
<pre class="pseudo">1. Betreff (objet)        court et précis
2. Anrede (formule d'appel)   Sehr geehrte(r) ...
3. Einleitung (introduction)  la raison de l'écriture
4. Hauptteil (corps)          le contenu, la demande
5. Schluss (conclusion)       remerciements, attente d'une réponse
6. Grußformel (salutation)    Mit freundlichen Grüßen
7. Name (nom)</pre>
<h3>2. La formule d'appel (die Anrede)</h3>
<pre class="pseudo">Sehr geehrte Damen und Herren,      Madame, Monsieur, (destinataire inconnu)
Sehr geehrte Frau Müller,           Chère Madame Müller,
Sehr geehrter Herr Schmidt,         Cher Monsieur Schmidt,</pre>
<div class="warn">Après l'Anrede, on met une <strong>virgule</strong>, puis on passe à la ligne et le premier mot commence par une <strong>minuscule</strong> (sauf si c'est un nom). Ex. : <em>Sehr geehrte Frau Müller,</em> puis <em>ich schreibe Ihnen ...</em> (avec i minuscule).</p></div>
<h3>3. L'introduction (die Einleitung)</h3>
<pre class="pseudo">Ich schreibe Ihnen, weil ...        Je vous écris parce que ...
Ich wende mich an Sie, weil ...     Je m'adresse à vous parce que ...
Ich interessiere mich für ...       Je m'intéresse à ...
Mit großem Interesse habe ich ... gelesen.  J'ai lu avec grand intérêt ...
Vielen Dank für Ihre E-Mail.        Merci pour votre e-mail.</pre>
<h3>4. Formules utiles dans le corps</h3>
<pre class="pseudo">Ich möchte Sie fragen, ob ...       Je voudrais vous demander si ...
Könnten Sie mir bitte ... schicken? Pourriez-vous m'envoyer ... ?
Ich hätte eine Frage zu ...         J'aurais une question au sujet de ...
Leider muss ich Ihnen mitteilen, dass ...  Je dois malheureusement vous informer que ...
Anbei finden Sie ...                Vous trouverez ci-joint ...</pre>
<div class="tip">Le vouvoiement formel utilise <strong>Sie</strong> (vous) et ses formes <strong>Ihnen</strong> (à vous), <strong>Ihr/Ihre</strong> (votre) — toujours avec une <strong>majuscule</strong>. On y revient au jour 27.</p></div>
<h3>5. La conclusion et la salutation</h3>
<pre class="pseudo">Ich freue mich auf Ihre Antwort.        Je me réjouis de votre réponse.
Vielen Dank im Voraus.                  Merci d'avance.
Für weitere Fragen stehe ich zur Verfügung.  Je reste à disposition.

Mit freundlichen Grüßen                 Cordialement (standard)
Freundliche Grüße                       (un peu plus léger)</pre>
<pre class="pseudo">Betreff: Anfrage zu Ihrem Deutschkurs

Sehr geehrte Damen und Herren,

ich interessiere mich für Ihren Deutschkurs im September.
Könnten Sie mir bitte weitere Informationen zum Preis schicken?
Vielen Dank im Voraus.

Mit freundlichen Grüßen
Anna Berger</pre>`,
  exercises: [
    { type: "qcm", q: "Comment commencer un mail quand on ne connaît pas le destinataire ?", opts: ["Hallo!", "Sehr geehrte Damen und Herren,", "Liebe Freunde,", "Tschüss,"], a: 1, exp: "Sehr geehrte Damen und Herren = Madame, Monsieur (destinataire inconnu)." },
    { type: "qcm", q: "Formule d'appel correcte pour Madame Müller (formel) ?", opts: ["Hallo Müller,", "Liebe Müller,", "Sehr geehrte Frau Müller,", "Sehr geehrter Frau Müller,"], a: 2, exp: "Féminin : Sehr geehrte Frau Müller (geehrte, sans r)." },
    { type: "vf", q: "Après l'Anrede (« Sehr geehrte Frau Müller, »), le premier mot de la phrase suivante commence par une minuscule.", a: true, exp: "Virgule après l'Anrede, puis minuscule : « ... , ich schreibe ... »." },
    { type: "input", q: "Complète la salutation standard : « Mit freundlichen ___ » (salutations)", a: ["Grüßen","Gruessen","Gruessen","Grüssen"], ph: "nom", exp: "Mit freundlichen Grüßen = cordialement." },
    { type: "qcm", q: "« Ich wende mich an Sie, weil ... » signifie…", opts: ["Je vous remercie", "Je m'adresse à vous parce que ...", "Je vous quitte", "Je vous félicite"], a: 1, exp: "sich an jemanden wenden = s'adresser à quelqu'un." },
    { type: "qcm", q: "Quelle forme du vouvoiement pour « à vous » (datif) ?", opts: ["dir", "euch", "Ihnen", "sie"], a: 2, exp: "Sie (vous) → datif Ihnen (à vous), toujours avec majuscule." },
    { type: "input", q: "Complète : « Könnten Sie mir bitte weitere Informationen ___? » (envoyer, infinitif)", a: ["schicken"], ph: "verbe", exp: "Könnten Sie mir ... schicken? = pourriez-vous m'envoyer ... ?" },
    { type: "qcm", q: "« Vielen Dank im Voraus » veut dire…", opts: ["Merci beaucoup pour tout", "Merci d'avance", "Désolé du retard", "À bientôt"], a: 1, exp: "im Voraus = à l'avance." },
    { type: "vf", q: "« Mit freundlichen Grüßen » est une formule de salutation informelle entre amis.", a: false, exp: "C'est la formule FORMELLE standard. Entre amis, on écrit plutôt « Liebe Grüße » ou « LG »." },
    { type: "qcm", q: "Que met-on dans le « Betreff » ?", opts: ["sa signature", "l'objet du message, court et précis", "l'adresse postale", "la date de naissance"], a: 1, exp: "der Betreff = l'objet du mail." },
    { type: "input", q: "Complète : « Ich freue mich auf Ihre ___. » (réponse)", a: ["Antwort"], ph: "nom", exp: "die Antwort = la réponse : Ich freue mich auf Ihre Antwort." },
    { type: "qcm", q: "« Anbei finden Sie ... » introduit…", opts: ["une excuse", "une pièce jointe (ci-joint)", "un reproche", "une question"], a: 1, exp: "anbei = ci-joint ; « Anbei finden Sie mein Motivationsschreiben »." },
    { type: "qcm", q: "Pour une mauvaise nouvelle, quelle formule ?", opts: ["Herzlichen Glückwunsch!", "Leider muss ich Ihnen mitteilen, dass ...", "Alles Gute!", "Bis bald!"], a: 1, exp: "Leider muss ich Ihnen mitteilen, dass ... = je dois malheureusement vous informer que ..." },
    { type: "vf", q: "Les pronoms de politesse Sie, Ihnen, Ihr prennent toujours une majuscule.", a: true, exp: "Le vouvoiement s'écrit avec une majuscule en allemand." },
    { type: "input", q: "Complète l'introduction : « Vielen Dank für Ihre ___. » (e-mail — nom féminin)", a: ["E-Mail","Email","Mail"], ph: "nom", exp: "die E-Mail : Vielen Dank für Ihre E-Mail." }
  ],
  final: {
    title: "Exercice final — Eine Anfrage (une demande)",
    intro: `<p>Lis cet e-mail formel de demande d'informations, puis réponds.</p>
<pre class="pseudo">Betreff: Anfrage zu Ihrem Sprachkurs

Sehr geehrte Damen und Herren,

mit großem Interesse habe ich auf Ihrer Webseite gelesen, dass Sie im
Herbst einen Deutschkurs anbieten. Ich möchte mein Deutsch verbessern
und wende mich deshalb an Sie.

Könnten Sie mir bitte mitteilen, wann der Kurs beginnt und wie viel er
kostet? Außerdem hätte ich eine Frage zum Niveau: Der Kurs sollte für
Fortgeschrittene sein.

Für weitere Informationen stehe ich Ihnen gern zur Verfügung.
Ich freue mich auf Ihre Antwort und danke Ihnen im Voraus.

Mit freundlichen Grüßen
Julia Wagner</pre>
<p>(anbieten = proposer · verbessern = améliorer · mitteilen = communiquer · Fortgeschrittene = les avancés · zur Verfügung stehen = être à disposition)</p>`,
    questions: [
      { type: "qcm", q: "Quel est l'objet de ce mail ?", opts: ["Une réclamation", "Une demande d'informations sur un cours de langue", "Une candidature", "Une invitation"], a: 1, exp: "Betreff: Anfrage zu Ihrem Sprachkurs = demande au sujet du cours de langue." },
      { type: "qcm", q: "Où Julia a-t-elle vu l'annonce du cours ?", opts: ["Dans le journal", "Sur leur site web", "À la radio", "Par un ami"], a: 1, exp: "« auf Ihrer Webseite gelesen »." },
      { type: "input", q: "Julia veut ___ son allemand. « Ich möchte mein Deutsch ___ » (améliorer)", a: ["verbessern"], ph: "verbe", exp: "verbessern = améliorer." },
      { type: "vf", q: "Julia demande quand le cours commence et combien il coûte.", a: true, exp: "« wann der Kurs beginnt und wie viel er kostet »." },
      { type: "qcm", q: "Pour quel niveau le cours devrait-il être ?", opts: ["Débutants", "Avancés (Fortgeschrittene)", "Enfants", "Professeurs"], a: 1, exp: "« Der Kurs sollte für Fortgeschrittene sein »." }
    ],
    solution: `<p>Ce mail respecte toutes les étapes du courrier formel : <strong>Betreff</strong> clair (Anfrage zu Ihrem Sprachkurs), <strong>Anrede</strong> (Sehr geehrte Damen und Herren), <strong>Einleitung</strong> (mit großem Interesse habe ich ... gelesen), <strong>Hauptteil</strong> avec deux demandes polies (Könnten Sie mir bitte mitteilen ...? / hätte ich eine Frage), <strong>Schluss</strong> (Ich freue mich auf Ihre Antwort) et <strong>Grußformel</strong> (Mit freundlichen Grüßen).</p>
<p>Note l'emploi constant du vouvoiement avec majuscule : <em>Ihrer Webseite, Ihnen, Ihre Antwort</em>. C'est la marque du registre formel (jour 27).</p>`
  }
};
