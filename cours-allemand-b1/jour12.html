<script>
var DAY = {
  num: 12,
  title: "Le vocabulaire du travail et le Lebenslauf",
  subtitle: "Métiers, expérience professionnelle et rédaction du CV allemand.",
  theory: `
<h3>1. Le vocabulaire du monde du travail</h3>
<p>Voici le lexique de base pour parler de sa vie professionnelle en allemand :</p>
<pre class="pseudo">die Arbeit / der Job     le travail / le job
der Beruf                le métier / la profession
die Stelle / der Job     le poste / l'emploi
der Arbeitgeber          l'employeur
der Arbeitnehmer         le salarié / l'employé
der Kollege / die Kollegin  le/la collègue
der Chef / die Chefin    le/la chef
das Gehalt / der Lohn    le salaire
die Erfahrung            l'expérience
die Ausbildung           la formation
das Praktikum            le stage
die Vollzeit / die Teilzeit  temps plein / temps partiel</pre>
<h3>2. Verbes clés du travail</h3>
<pre class="pseudo">arbeiten (als)           travailler (comme/en tant que)
sich bewerben (um/bei)   postuler (à/chez)
verdienen                gagner (de l'argent)
kündigen                 démissionner / licencier
einstellen               embaucher
leiten                   diriger
zusammenarbeiten         collaborer</pre>
<pre class="pseudo">Ich arbeite als Krankenpfleger.   Je travaille comme infirmier.
Ich bewerbe mich um die Stelle.   Je postule pour le poste.
Sie verdient gut.                 Elle gagne bien sa vie.</pre>
<h3>3. Qu'est-ce que le Lebenslauf ?</h3>
<p>Le <strong>Lebenslauf</strong> est le CV allemand. Il est généralement <strong>tabellarisch</strong> (sous forme de tableau), clair et chronologique. Structure typique :</p>
<pre class="pseudo">Persönliche Daten     Données personnelles (nom, adresse, date de naissance)
Berufserfahrung       Expérience professionnelle
Ausbildung            Formation / Études
Kenntnisse            Compétences (langues, informatique)
Sprachen              Langues
Hobbys / Interessen   Loisirs / Centres d'intérêt</pre>
<div class="tip">En Allemagne, le CV est souvent daté et signé à la fin (Ort, Datum, Unterschrift = lieu, date, signature). On y joint une lettre de motivation (das Anschreiben).</div>
<h3>4. Formuler ses expériences</h3>
<p>On utilise souvent des dates (von... bis...) et des noms de postes :</p>
<pre class="pseudo">2018 - 2021: Studium der Informatik an der Universität Köln
             Études d'informatique à l'université de Cologne
seit 2021:   Softwareentwickler bei der Firma XY
             Développeur logiciel chez l'entreprise XY
2020:        Praktikum bei einer Marketingagentur
             Stage dans une agence de marketing</pre>
<h3>5. Parler de ses compétences</h3>
<pre class="pseudo">Ich spreche fließend Englisch.     Je parle couramment anglais.
Ich habe gute Deutschkenntnisse.   J'ai un bon niveau d'allemand.
Ich bin teamfähig und zuverlässig. Je sais travailler en équipe et je suis fiable.
Ich kann gut mit Computern umgehen. Je maîtrise bien l'informatique.</pre>
<div class="warn">Attention aux adjectifs de qualité prisés des employeurs : zuverlässig (fiable), teamfähig (esprit d'équipe), flexibel (flexible), motiviert (motivé), pünktlich (ponctuel). Apprends-les : ils reviennent dans tout entretien.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « der Beruf » ?", opts: ["le bureau", "le métier / la profession", "le collègue", "le salaire"], a: 1, exp: "der Beruf = le métier, la profession." },
    { type: "input", q: "Complète : « Ich arbeite ___ Krankenpfleger. » (comme / en tant que)", a: ["als"], ph: "préposition", exp: "arbeiten als = travailler comme : als Krankenpfleger." },
    { type: "qcm", q: "Que veut dire « sich bewerben » ?", opts: ["démissionner", "postuler", "embaucher", "diriger"], a: 1, exp: "sich bewerben (um/bei) = postuler (à/chez)." },
    { type: "input", q: "Complète : « Ich bewerbe ___ um die Stelle. » (pronom réfléchi, 1re sing.)", a: ["mich"], ph: "pronom réfléchi", exp: "sich bewerben : ich bewerbe mich." },
    { type: "qcm", q: "Que signifie « das Gehalt » ?", opts: ["la formation", "le salaire", "le stage", "le poste"], a: 1, exp: "das Gehalt = le salaire (mensuel, fixe)." },
    { type: "qcm", q: "Qu'est-ce que le « Lebenslauf » ?", opts: ["la lettre de motivation", "le CV allemand", "le contrat", "l'entretien"], a: 1, exp: "der Lebenslauf = le curriculum vitae." },
    { type: "input", q: "Complète : « das ___ » (le stage : mot allemand)", a: ["Praktikum"], ph: "nom allemand", exp: "das Praktikum = le stage." },
    { type: "vf", q: "Le Lebenslauf allemand est souvent tabellarisch (sous forme de tableau).", a: true, exp: "Vrai : clair, chronologique, en tableau." },
    { type: "qcm", q: "Que signifie « die Ausbildung » ?", opts: ["l'expérience", "la formation / l'apprentissage", "le loisir", "l'employeur"], a: 1, exp: "die Ausbildung = la formation professionnelle." },
    { type: "input", q: "Complète : « Ich spreche ___ Englisch. » (couramment)", a: ["fliessend","fließend"], ph: "adverbe", exp: "fließend = couramment : Ich spreche fließend Englisch." },
    { type: "qcm", q: "Que veut dire « zuverlässig » ?", opts: ["paresseux", "fiable", "en retard", "timide"], a: 1, exp: "zuverlässig = fiable (qualité prisée des employeurs)." },
    { type: "input", q: "Complète : « Ich bin ___ und pünktlich. » (esprit d'équipe : adjectif)", a: ["teamfaehig","teamfähig"], ph: "adjectif", exp: "teamfähig = capable de travailler en équipe." },
    { type: "vf", q: "« verdienen » signifie démissionner.", a: false, exp: "Faux : verdienen = gagner (de l'argent). Démissionner = kündigen." },
    { type: "qcm", q: "Comment traduit-on « le/la collègue » ?", opts: ["der Chef", "der Kollege / die Kollegin", "der Arbeitgeber", "der Beruf"], a: 1, exp: "der Kollege (m.) / die Kollegin (f.)." },
    { type: "qcm", q: "Compréhension : « Seit 2021 arbeite ich als Softwareentwickler bei einer Bank. » Que fait la personne ?", opts: ["Elle cherche un emploi", "Elle est développeuse dans une banque depuis 2021", "Elle a démissionné", "Elle fait un stage"], a: 1, exp: "seit 2021... als Softwareentwickler bei einer Bank = développeuse dans une banque depuis 2021." }
  ],
  final: {
    title: "Exercice final — Ein Lebenslauf",
    intro: `<p>Lis cet extrait de Lebenslauf, puis réponds.</p>
<pre class="pseudo">Name: Julia Wagner
Geboren: 12. Mai 1995 in Muenchen

Berufserfahrung:
seit 2022:   Projektmanagerin bei der Firma TechPlus
2019 - 2022: Marketingassistentin bei einer Werbeagentur
2018:        Praktikum in einem Verlag

Ausbildung:
2014 - 2018: Studium der Betriebswirtschaft an der Uni Muenchen

Sprachen: Deutsch (Muttersprache), Englisch (fliessend), Franzoesisch (gut)
Kenntnisse: sehr gute Computerkenntnisse, teamfaehig, zuverlaessig</pre>
<p>(die Betriebswirtschaft = la gestion d'entreprise · der Verlag = la maison d'édition · die Muttersprache = la langue maternelle)</p>`,
    questions: [
      { type: "qcm", q: "Quel poste Julia occupe-t-elle depuis 2022 ?", opts: ["assistante marketing", "cheffe de projet (Projektmanagerin)", "stagiaire", "développeuse"], a: 1, exp: "« seit 2022: Projektmanagerin bei der Firma TechPlus »." },
      { type: "input", q: "Complète d'après le CV : « Julia hat ein ___ in einem Verlag gemacht. » (un stage)", a: ["Praktikum"], ph: "nom allemand", exp: "« 2018: Praktikum in einem Verlag »." },
      { type: "qcm", q: "Qu'a étudié Julia ?", opts: ["l'informatique", "la gestion d'entreprise (Betriebswirtschaft)", "le droit", "la médecine"], a: 1, exp: "« Studium der Betriebswirtschaft »." },
      { type: "vf", q: "Julia parle couramment anglais.", a: true, exp: "« Englisch (fließend) »." },
      { type: "qcm", q: "Quelles qualités mentionne-t-elle ?", opts: ["paresseuse et lente", "esprit d'équipe et fiable (teamfähig, zuverlässig)", "timide", "en retard"], a: 1, exp: "« teamfähig, zuverlässig »." }
    ],
    solution: `<p>Ce Lebenslauf suit la structure classique : <strong>persönliche Daten</strong> (nom, date et lieu de naissance), <strong>Berufserfahrung</strong> présentée du plus récent au plus ancien (seit 2022, 2019-2022, 2018), <strong>Ausbildung</strong>, puis <strong>Sprachen</strong> et <strong>Kenntnisse</strong>.</p>
<p>Vocabulaire à retenir : <strong>seit</strong> + datif pour une activité en cours, <strong>von...bis</strong> ou une plage d'années pour le passé, <strong>Praktikum</strong> (stage), <strong>Muttersprache</strong> (langue maternelle), et les adjectifs de qualité <strong>teamfähig, zuverlässig</strong>.</p>`
  }
};
</script>
