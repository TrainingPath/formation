  title: "Les médias et la technologie",
  subtitle: "Parler d'Internet, des appareils et de ses habitudes numériques en allemand.",
  theory: `
<h3>1. Le vocabulaire des médias (die Medien)</h3>
<p>Le mot allemand <strong>die Medien</strong> (les médias) est un pluriel ; le singulier <em>das Medium</em> est rare. Voici le lexique de base à connaître au niveau B1 :</p>
<pre class="pseudo">die Nachrichten     les informations / les nouvelles
die Zeitung         le journal (papier)
die Zeitschrift     le magazine
der Fernseher       le téléviseur   ·   das Fernsehen   la télévision
das Radio           la radio
die Sendung         l'émission
die Werbung         la publicité
der Artikel         l'article</pre>
<div class="tip">Attention au faux ami : <strong>die Nachricht</strong> au singulier = un message (un SMS, un mail). Au pluriel, <strong>die Nachrichten</strong> = les informations (le journal télévisé). Le contexte tranche.</div>
<h3>2. Internet et les appareils (die Geräte)</h3>
<pre class="pseudo">das Internet / das Netz   Internet / le réseau
die Webseite / die Seite  le site / la page web
das Handy                 le portable   ·   das Smartphone
der Computer / der Rechner  l'ordinateur
das Tablet · der Laptop   la tablette · le portable
das soziale Netzwerk      le réseau social
die App (die Anwendung)   l'application
das Passwort              le mot de passe
das Konto                 le compte</pre>
<p>Exemple : <em>Ich habe mein Passwort vergessen und komme nicht in mein Konto.</em> = J'ai oublié mon mot de passe et je n'arrive pas à entrer dans mon compte.</p>
<h3>3. Les verbes du numérique</h3>
<p>Beaucoup sont des verbes séparables (préfixe qui part à la fin) ou des anglicismes régularisés :</p>
<pre class="pseudo">herunterladen    télécharger   ·   hochladen    téléverser / mettre en ligne
speichern        enregistrer   ·   löschen      supprimer
teilen           partager      ·   posten       poster
sich anmelden    se connecter / s'inscrire
sich abmelden    se déconnecter
surfen           surfer        ·   chatten      chatter
klicken (auf)    cliquer (sur)</pre>
<pre class="pseudo">Ich lade das Foto herunter.        Je télécharge la photo.  (herunter... à la fin)
Ich melde mich bei Instagram an.   Je m'inscris sur Instagram.
Kannst du den Link teilen?         Peux-tu partager le lien ?</pre>
<div class="warn">Les verbes séparables rejettent leur préfixe à la fin : <em>Ich lade das Video <strong>hoch</strong></em> (je téléverse la vidéo), et non « Ich hochlade ». On y revient en détail au jour 25.</div>
<h3>4. Parler de ses habitudes numériques</h3>
<pre class="pseudo">Ich verbringe zu viel Zeit am Handy.   Je passe trop de temps sur mon portable.
Ich lese die Nachrichten online.       Je lis les infos en ligne.
Ich bin ständig erreichbar.            Je suis joignable en permanence.
Ich mache eine Digitalpause.           Je fais une pause numérique.</pre>
<p>Adjectifs utiles : <em>süchtig</em> (accro), <em>praktisch</em> (pratique), <em>gefährlich</em> (dangereux), <em>zuverlässig</em> (fiable).</p>
<h3>5. Un mini-texte modèle</h3>
<pre class="pseudo">Morgens lese ich die Nachrichten auf meinem Smartphone.
Ich benutze soziale Netzwerke, um mit Freunden in Kontakt zu bleiben.
Manchmal verbringe ich zu viel Zeit online, deshalb mache ich abends eine Pause.
Ich finde die Technik praktisch, aber auch ein bisschen gefährlich.</pre>
<p>(benutzen = utiliser · in Kontakt bleiben = rester en contact · deshalb = c'est pourquoi)</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « die Nachrichten » (au pluriel) ?", opts: ["les messages privés", "les informations / le journal télévisé", "les magazines", "la publicité"], a: 1, exp: "Au pluriel, die Nachrichten = les informations. Au singulier, un message." },
    { type: "qcm", q: "« herunterladen » veut dire…", opts: ["téléverser", "télécharger", "supprimer", "partager"], a: 1, exp: "herunterladen = télécharger ; hochladen = téléverser." },
    { type: "input", q: "Complète : « Ich ___ das Foto herunter. » (télécharger, présent, ich)", a: ["lade"], ph: "verbe conjugué", exp: "herunterladen est séparable : ich lade ... herunter." },
    { type: "qcm", q: "Quel verbe signifie « supprimer » ?", opts: ["speichern", "teilen", "löschen", "posten"], a: 2, exp: "löschen = supprimer ; speichern = enregistrer." },
    { type: "vf", q: "« das Handy » désigne le téléphone portable en allemand.", a: true, exp: "das Handy (faux anglicisme allemand) = le portable, comme das Smartphone." },
    { type: "input", q: "Complète : « Kannst du den Link ___? » (partager)", a: ["teilen"], ph: "infinitif", exp: "teilen = partager." },

    { type: "qcm", q: "Que veut dire « das Passwort » ?", opts: ["le compte", "le mot de passe", "le réseau", "la page"], a: 1, exp: "das Passwort = le mot de passe ; das Konto = le compte." },
    { type: "input", q: "Complète : « Ich melde ___ bei Instagram an. » (pronom réfléchi, ich)", a: ["mich"], ph: "pronom", exp: "sich anmelden : ich melde mich an." },
    { type: "qcm", q: "« die Werbung », c'est…", opts: ["l'émission", "la publicité", "l'article", "le réseau social"], a: 1, exp: "die Werbung = la publicité." },

    { type: "input", q: "Complète : « Ich verbringe zu viel ___ am Handy. » (le temps)", a: ["Zeit"], ph: "nom", exp: "die Zeit = le temps : zu viel Zeit = trop de temps." },
    { type: "qcm", q: "« süchtig » se traduit par…", opts: ["fiable", "pratique", "accro / dépendant", "dangereux"], a: 2, exp: "süchtig = accro, dépendant." },
    { type: "qcm", q: "Compréhension : « Ich bin ständig erreichbar. » Cela veut dire que la personne…", opts: ["ne répond jamais", "est joignable en permanence", "n'a pas de téléphone", "travaille dans un magasin"], a: 1, exp: "ständig erreichbar = joignable en permanence." },
    { type: "vf", q: "Dans « Ich lade das Video hoch », le préfixe « hoch » se place à la fin de la phrase.", a: true, exp: "Verbe séparable : le préfixe part à la fin (hoch)." }
  ],
  final: {
    title: "Exercice final — Mein digitaler Alltag (mon quotidien numérique)",
    intro: `<p>Lis ce texte sur les habitudes numériques de Lena, puis réponds.</p>
<pre class="pseudo">Ich heiße Lena und bin sehr oft online. Morgens lese ich zuerst die Nachrichten
auf meinem Smartphone. Danach schaue ich meine Mails und antworte den Kollegen.
Ich benutze soziale Netzwerke jeden Tag, vor allem um Fotos zu teilen.
Am Nachmittag lade ich oft Videos für die Arbeit herunter.
Manchmal finde ich, dass ich zu viel Zeit am Handy verbringe.
Deshalb mache ich am Wochenende eine Digitalpause: ich schalte das Handy aus.
Ich finde die Technik sehr praktisch, aber man muss auch vorsichtig sein.</pre>
<p>(antworten = répondre · vor allem = surtout · ausschalten = éteindre · vorsichtig = prudent)</p>`,
    questions: [
      { type: "qcm", q: "Que fait Lena en premier le matin ?", opts: ["Elle regarde des vidéos", "Elle lit les informations sur son smartphone", "Elle éteint son portable", "Elle appelle ses collègues"], a: 1, exp: "« Morgens lese ich zuerst die Nachrichten »." },
      { type: "qcm", q: "Pourquoi utilise-t-elle surtout les réseaux sociaux ?", opts: ["Pour travailler", "Pour partager des photos", "Pour lire le journal", "Pour télécharger des jeux"], a: 1, exp: "« vor allem um Fotos zu teilen »." },
      { type: "input", q: "Que télécharge-t-elle l'après-midi (en allemand) ? « Am Nachmittag lade ich oft ___ herunter. »", a: ["Videos"], ph: "nom pluriel", exp: "« lade ich oft Videos ... herunter »." },
      { type: "vf", q: "Le week-end, Lena fait une pause numérique et éteint son portable.", a: true, exp: "« ich mache eine Digitalpause: ich schalte das Handy aus »." },
      { type: "qcm", q: "Quelle est l'opinion finale de Lena sur la technologie ?", opts: ["Elle la trouve inutile", "Elle la trouve pratique mais pense qu'il faut être prudent", "Elle la déteste", "Elle ne l'utilise jamais"], a: 1, exp: "« sehr praktisch, aber man muss auch vorsichtig sein »." }
    ],
    solution: `<p>Lena est très souvent en ligne. Le matin, elle lit d'abord les <strong>Nachrichten</strong> (les infos), puis ses mails. Elle utilise les <strong>soziale Netzwerke</strong> chaque jour surtout pour partager des photos (<em>Fotos teilen</em>). L'après-midi, elle télécharge (<em>herunterladen</em>) des vidéos pour le travail. Comme elle passe trop de temps au portable, elle fait le week-end une <strong>Digitalpause</strong> et éteint (<em>ausschalten</em>) son téléphone. Elle trouve la technique pratique mais recommande la prudence.</p>
<p>Repère bien les verbes séparables : <em>lade ... herunter</em>, <em>schalte ... aus</em> — le préfixe file à la fin.</p>`
  }
};
