<script>
var DAY = {
  num: 9,
  title: "Les verbes réfléchis",
  subtitle: "« Je me lave », « je me réjouis », « je m'intéresse à... ».",
  theory: `
<h3>1. Qu'est-ce qu'un verbe réfléchi ?</h3>
<p>Un <strong>verbe réfléchi</strong> (reflexives Verb) se construit avec un <strong>pronom réfléchi</strong> (mich, dich, sich...) qui renvoie au sujet. En français : « se laver, se réjouir, s'intéresser ».</p>
<pre class="pseudo">Ich wasche mich.        Je me lave.
Er freut sich.          Il se réjouit.
Wir treffen uns.        Nous nous rencontrons.</pre>
<h3>2. Les pronoms réfléchis</h3>
<p>La plupart sont à l'<strong>accusatif</strong> (comme le COD). Seul « sich » (3e personne) est particulier ; les autres ressemblent aux pronoms personnels.</p>
<pre class="pseudo">Personne   accusatif   datif
ich        mich        mir
du         dich        dir
er/sie/es  sich        sich
wir        uns         uns
ihr        euch        euch
sie/Sie    sich        sich</pre>
<div class="tip">L'accusatif et le datif ne diffèrent qu'à la 1re et 2e personne du singulier : mich/mir, dich/dir. Partout ailleurs, la forme est identique (uns, euch, sich).</div>
<h3>3. Accusatif ou datif ?</h3>
<p>Le pronom est à l'<strong>accusatif</strong> quand il est le seul complément. Il passe au <strong>datif</strong> quand il y a DÉJÀ un COD à l'accusatif dans la phrase.</p>
<pre class="pseudo">Ich wasche mich.            Je me lave.        (mich = accusatif)
Ich wasche mir die Hände.   Je me lave les mains. (mir = datif, car die Hände = COD)
Ich putze mir die Zähne.    Je me brosse les dents.</pre>
<div class="warn">Astuce : « je me lave LES MAINS » -> il y a un objet (les mains), donc le pronom passe au datif (mir). Sans objet (« je me lave »), c'est l'accusatif (mich).</div>
<h3>4. La place du pronom réfléchi</h3>
<p>Le pronom réfléchi suit le verbe conjugué. Après le sujet inversé ou dans une subordonnée, il se place juste après le sujet.</p>
<pre class="pseudo">Ich freue mich auf das Wochenende.
Heute freue ich mich besonders.        (après inversion)
..., weil ich mich freue.               (subordonnée)</pre>
<h3>5. Verbes réfléchis fréquents (à mémoriser)</h3>
<pre class="pseudo">sich freuen auf (+A)     se réjouir de (à venir)
sich freuen über (+A)    se réjouir de (arrivé)
sich interessieren für   s'intéresser à
sich erinnern an (+A)    se souvenir de
sich treffen (mit)       se rencontrer / retrouver
sich fühlen              se sentir
sich beeilen             se dépêcher
sich entschuldigen       s'excuser
sich setzen              s'asseoir</pre>
<pre class="pseudo">Ich interessiere mich für Musik.   Je m'intéresse à la musique.
Erinnerst du dich an ihn?          Te souviens-tu de lui ?
Beeil dich!                        Dépêche-toi !</pre>
<div class="tip">Beaucoup de ces verbes vont avec une préposition fixe (freuen AUF, interessieren FÜR, erinnern AN). Apprends le verbe et sa préposition ensemble, comme un bloc.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un verbe réfléchi ?", opts: ["un verbe sans sujet", "un verbe avec un pronom qui renvoie au sujet", "un verbe au passé", "un verbe modal"], a: 1, exp: "Il se construit avec un pronom réfléchi (mich, dich, sich...)." },
    { type: "input", q: "Complète : « Ich wasche ___. » (je me lave, pronom réfléchi accusatif, 1re sing.)", a: ["mich"], ph: "pronom réfléchi", exp: "ich -> mich (accusatif)." },
    { type: "qcm", q: "Pronom réfléchi de la 3e personne (er/sie/es et sie/Sie) :", opts: ["ihn", "sich", "ihm", "es"], a: 1, exp: "La 3e personne (et le pluriel sie/Sie) utilise sich." },
    { type: "input", q: "Complète : « Wir treffen ___. » (nous nous rencontrons)", a: ["uns"], ph: "pronom réfléchi", exp: "wir -> uns." },
    { type: "qcm", q: "Quand le pronom réfléchi passe-t-il au datif ?", opts: ["jamais", "quand il y a déjà un COD à l'accusatif", "toujours au pluriel", "avec sein"], a: 1, exp: "Ex : Ich wasche mir die Hände (die Hände = COD -> mir au datif)." },
    { type: "input", q: "Complète : « Ich putze ___ die Zähne. » (datif, car die Zähne est COD)", a: ["mir"], ph: "pronom réfléchi datif", exp: "die Zähne = COD -> pronom au datif : mir." },
    { type: "vf", q: "« Ich wasche mich » et « Ich wasche mir die Hände » utilisent le même cas de pronom.", a: false, exp: "Faux : mich (accusatif) sans objet ; mir (datif) car « die Hände » est COD." },
    { type: "qcm", q: "Quelle préposition va avec « sich interessieren » (s'intéresser) ?", opts: ["auf", "für", "an", "über"], a: 1, exp: "sich interessieren FÜR + accusatif : für Musik." },
    { type: "input", q: "Complète : « Ich interessiere mich ___ Musik. » (préposition fixe)", a: ["fuer","für"], ph: "préposition", exp: "sich interessieren für : für Musik." },
    { type: "qcm", q: "« Ich freue mich auf das Wochenende » signifie…", opts: ["Je me réjouis du week-end (à venir)", "Je regrette le week-end", "Je travaille le week-end", "Je déteste le week-end"], a: 0, exp: "sich freuen auf = se réjouir de qqch à venir." },
    { type: "input", q: "Complète l'impératif : « ___ dich! » (dépêche-toi, sich beeilen)", a: ["Beeil"], ph: "impératif du verbe", exp: "Beeil dich! = Dépêche-toi ! (sich beeilen)." },
    { type: "vf", q: "Beaucoup de verbes réfléchis vont avec une préposition fixe (freuen auf, erinnern an).", a: true, exp: "Vrai : on apprend le verbe et sa préposition ensemble." },
    { type: "qcm", q: "Où se place le pronom réfléchi après une inversion : « Heute freue ich ... besonders. » ?", opts: ["avant ich", "juste après le sujet (ich mich)", "à la fin", "après besonders"], a: 1, exp: "Heute freue ich mich besonders : pronom après le sujet." },
    { type: "input", q: "Complète : « Erinnerst du ___ an ihn? » (pronom réfléchi, 2e sing.)", a: ["dich"], ph: "pronom réfléchi", exp: "du -> dich : Erinnerst du dich...?" },
    { type: "qcm", q: "Compréhension : « Ich fühle mich heute nicht wohl. » Que veut dire la personne ?", opts: ["Elle se sent bien", "Elle ne se sent pas bien aujourd'hui", "Elle est en retard", "Elle a faim"], a: 1, exp: "sich fühlen = se sentir ; nicht wohl = pas bien." }
  ],
  final: {
    title: "Exercice final — Ein Tag von Laura",
    intro: `<p>Lis cette journée de Laura (verbes réfléchis) et réponds.</p>
<pre class="pseudo">Laura steht auf und waescht sich. Dann putzt sie sich die Zaehne
und zieht sich an. Sie beeilt sich, weil sie sich nicht verspaeten
moechte. Im Bus trifft sie eine Freundin. Sie freuen sich ueber das
Wiedersehen. Laura interessiert sich sehr fuer Kunst, deshalb geht
sie am Abend ins Museum. Danach fuehlt sie sich muede, aber zufrieden.
Sie erinnert sich gern an diesen schoenen Tag.</pre>
<p>(sich anziehen = s'habiller · sich verspäten = être en retard · das Wiedersehen = les retrouvailles)</p>`,
    questions: [
      { type: "input", q: "Complète : « Laura steht auf und wäscht ___. » (pronom réfléchi, 3e pers.)", a: ["sich"], ph: "pronom réfléchi", exp: "sie -> sich : wäscht sich (elle se lave)." },
      { type: "input", q: "Complète (datif car die Zähne est COD) : « Dann putzt sie ___ die Zähne. »", a: ["sich"], ph: "pronom réfléchi datif", exp: "3e pers. datif = sich (identique) : sie putzt sich die Zähne." },
      { type: "qcm", q: "Pourquoi Laura se dépêche-t-elle ?", opts: ["parce qu'elle est fatiguée", "parce qu'elle ne veut pas être en retard", "parce qu'il pleut", "sans raison"], a: 1, exp: "« weil sie sich nicht verspäten möchte »." },
      { type: "qcm", q: "À quoi Laura s'intéresse-t-elle beaucoup ?", opts: ["au sport", "à l'art (für Kunst)", "à la cuisine", "à la musique"], a: 1, exp: "« Laura interessiert sich sehr für Kunst »." },
      { type: "vf", q: "À la fin, Laura se souvient avec plaisir de cette belle journée.", a: true, exp: "« Sie erinnert sich gern an diesen schönen Tag. »" }
    ],
    solution: `<p>Le texte enchaîne des verbes réfléchis : <strong>wäscht sich</strong> (accusatif), <strong>putzt sich die Zähne</strong> (datif, car die Zähne est COD), <strong>zieht sich an, beeilt sich, freuen sich über, interessiert sich für, fühlt sich, erinnert sich an</strong>.</p>
<p>Points clés : à la 3e personne, le pronom est toujours <strong>sich</strong> (accusatif comme datif) ; le datif apparaît quand il y a déjà un COD (sich die Zähne putzen) ; beaucoup de ces verbes gardent une <strong>préposition fixe</strong> (freuen über, interessieren für, erinnern an).</p>`
  }
};
</script>
