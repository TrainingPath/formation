  num: 19,
  title: "Les Konnektoren (position du verbe)",
  subtitle: "Relier ses phrases : trois groupes de connecteurs, trois places du verbe.",
  theory: `
<h3>1. Le problème : où va le verbe ?</h3>
<p>En allemand, la difficulté des connecteurs (die Konnektoren) n'est pas leur sens, mais leur <strong>influence sur la place du verbe conjugué</strong>. Il existe trois grands groupes, chacun avec sa règle. Retenir le groupe, c'est retenir la position du verbe.</p>
<h3>2. Groupe 1 : les coordonnants (position 0)</h3>
<p>Ils relient deux phrases sans changer l'ordre des mots. On les appelle position 0 (ou « zéro ») car ils ne comptent pas comme une place : le sujet reste devant le verbe.</p>
<pre class="pseudo">und    et        aber   mais        oder   ou
denn   car       sondern  mais (au contraire)</pre>
<pre class="pseudo">Ich bleibe zu Hause, denn ich bin krank.
Je reste à la maison, car je suis malade.  (sujet ich + verbe bin : ordre normal)</pre>
<div class="tip">Moyen mnémotechnique : les 5 coordonnants sont <strong>ADUSO</strong> — <em>aber, denn, und, sondern, oder</em>. Après eux : sujet + verbe, comme d'habitude.</p></div>
<h3>3. Groupe 2 : les adverbes-connecteurs (position 1 → inversion)</h3>
<p>Placés en tête de phrase, ils occupent la position 1 et provoquent l'<strong>inversion</strong> : le verbe conjugué reste en 2e position, donc AVANT le sujet.</p>
<pre class="pseudo">deshalb / deswegen   c'est pourquoi     trotzdem   pourtant / malgré tout
dann                 ensuite            außerdem   en outre
sonst                sinon              also       donc</pre>
<pre class="pseudo">Ich bin krank. Deshalb bleibe ich zu Hause.
Je suis malade. C'est pourquoi je reste à la maison.  (deshalb + verbe bleibe + sujet ich)</pre>
<div class="warn">Erreur classique : « Deshalb ich bleibe ... ». FAUX. Après ces adverbes, le verbe passe AVANT le sujet : <em>Deshalb <strong>bleibe ich</strong></em>.</p></div>
<h3>4. Groupe 3 : les subordonnants (verbe à la fin)</h3>
<p>Ils introduisent une subordonnée et rejettent le verbe conjugué <strong>tout à la fin</strong> de celle-ci.</p>
<pre class="pseudo">weil     parce que      dass    que          wenn   si / quand
obwohl   bien que       damit   pour que      als    quand (passé)
ob       si (question)  während pendant que   bevor  avant que</pre>
<pre class="pseudo">Ich bleibe zu Hause, weil ich krank bin.
Je reste à la maison parce que je suis malade.  (weil ... bin à la fin)</pre>
<div class="tip">Astuce : si la subordonnée est en TÊTE, toute la subordonnée compte pour la position 1, donc la principale commence par son verbe : <em>Weil ich krank bin, <strong>bleibe ich</strong> zu Hause.</em> (verbe contre verbe au milieu).</p></div>
<h3>5. Tableau de synthèse</h3>
<pre class="pseudo">Groupe                 Exemples              Place du verbe
Coordonnants (ADUSO)   und, aber, denn       normale (sujet + verbe)
Adverbes-connecteurs   deshalb, trotzdem     inversion (verbe en 2e)
Subordonnants          weil, dass, obwohl    verbe à la FIN</pre>
<p>Même sens, trois constructions : <em>Ich bin krank, deshalb bleibe ich zu Hause</em> = <em>Ich bleibe zu Hause, weil ich krank bin</em> = <em>Ich bin krank, denn ich bleibe zu Hause</em>.</p>`,
  exercises: [
    { type: "qcm", q: "Après un coordonnant comme « denn », l'ordre des mots est…", opts: ["verbe en 2e (inversion)", "normal : sujet + verbe", "verbe à la fin", "sans verbe"], a: 1, exp: "Les coordonnants (ADUSO) ne changent pas l'ordre : sujet + verbe." },
    { type: "input", q: "Quel moyen mnémotechnique regroupe aber, denn, und, sondern, oder ? (5 lettres)", a: ["ADUSO","aduso"], ph: "acronyme", exp: "ADUSO = aber, denn, und, sondern, oder." },
    { type: "qcm", q: "« Deshalb ___ ich zu Hause. » Quelle suite est correcte ?", opts: ["Deshalb ich bleibe", "Deshalb bleibe ich", "Deshalb zu Hause bleibe ich", "Deshalb bleibe"], a: 1, exp: "deshalb en tête → inversion : verbe bleibe avant le sujet ich." },
    { type: "input", q: "Complète (inversion) : « Ich bin krank. Deshalb ___ ich zu Hause. » (bleiben, ich)", a: ["bleibe"], ph: "verbe", exp: "deshalb + verbe en 2e position : bleibe ich." },
    { type: "qcm", q: "Avec « weil », le verbe conjugué se place…", opts: ["en 1re position", "en 2e position", "à la fin de la subordonnée", "juste après weil"], a: 2, exp: "weil est un subordonnant : verbe à la fin." },
    { type: "input", q: "Complète : « Ich bleibe zu Hause, weil ich krank ___. » (sein, à la fin)", a: ["bin"], ph: "verbe", exp: "Subordonnée en weil : bin à la fin." },
    { type: "qcm", q: "Que signifie « trotzdem » et quel est son groupe ?", opts: ["parce que — subordonnant", "pourtant / malgré tout — adverbe-connecteur (inversion)", "et — coordonnant", "que — subordonnant"], a: 1, exp: "trotzdem = pourtant ; adverbe-connecteur → inversion." },
    { type: "qcm", q: "Quelle phrase est CORRECTE ?", opts: ["Ich lerne viel, weil ich habe eine Prüfung.", "Ich lerne viel, weil ich eine Prüfung habe.", "Ich lerne viel, weil habe ich eine Prüfung.", "Ich lerne viel, weil eine Prüfung ich habe."], a: 1, exp: "weil → verbe habe à la fin : « weil ich eine Prüfung habe »." },
    { type: "vf", q: "« obwohl » (bien que) envoie le verbe conjugué à la fin de la subordonnée.", a: true, exp: "obwohl est un subordonnant : verbe à la fin." },
    { type: "input", q: "Complète : « Es regnet, ___ gehe ich nicht spazieren. » (c'est pourquoi — 1 mot, inversion)", a: ["deshalb","deswegen","darum"], ph: "connecteur", exp: "deshalb / deswegen / darum + inversion : gehe ich." },
    { type: "qcm", q: "Dans « Weil ich krank bin, bleibe ich zu Hause », pourquoi la principale commence-t-elle par « bleibe » ?", opts: ["C'est une faute", "La subordonnée en tête occupe la position 1, donc le verbe de la principale suit directement", "weil est un coordonnant", "Le hasard"], a: 1, exp: "Subordonnée en position 1 → verbe de la principale en 2e (contre verbe)." },
    { type: "qcm", q: "« aber » appartient à quel groupe ?", opts: ["subordonnant (verbe à la fin)", "adverbe-connecteur (inversion)", "coordonnant (ordre normal)", "aucun"], a: 2, exp: "aber = coordonnant (ADUSO) : ordre normal après lui." },
    { type: "vf", q: "« Ich bin müde, trotzdem ich arbeite weiter » est correct.", a: false, exp: "FAUX : trotzdem demande l'inversion → « trotzdem arbeite ich weiter »." },
    { type: "input", q: "Complète : « Ich weiß nicht, ___ er kommt. » (si — question indirecte, verbe à la fin)", a: ["ob"], ph: "subordonnant", exp: "ob = si (dans une question indirecte) → verbe à la fin." },
    { type: "qcm", q: "Compréhension : « Obwohl es regnet, gehen wir spazieren. » Que fait-on ?", opts: ["On reste à la maison à cause de la pluie", "On se promène malgré la pluie", "On attend que la pluie s'arrête", "On prend le bus"], a: 1, exp: "obwohl = bien que : on se promène malgré la pluie." }
  ],
  final: {
    title: "Exercice final — Konnektoren erkennen",
    intro: `<p>Lis ce court texte et observe les trois types de connecteurs (soulignés par le sens), puis réponds.</p>
<pre class="pseudo">Anna möchte im Sommer nach Deutschland fahren, denn sie liebt die Sprache.
Sie lernt jeden Tag, weil sie die Prüfung bestehen will.
Das Lernen ist manchmal schwer. Trotzdem gibt sie nicht auf.
Sie hat wenig Geld, deshalb sucht sie einen Ferienjob.
Obwohl sie viel arbeitet, bleibt sie optimistisch.</pre>
<p>(bestehen = réussir · aufgeben = abandonner · der Ferienjob = le job de vacances · optimistisch = optimiste)</p>`,
    questions: [
      { type: "qcm", q: "Dans « ..., denn sie liebt die Sprache », quel est l'ordre après denn ?", opts: ["verbe à la fin", "normal : sujet (sie) + verbe (liebt)", "inversion", "sans sujet"], a: 1, exp: "denn = coordonnant : ordre normal sie liebt." },
      { type: "qcm", q: "Dans « weil sie die Prüfung bestehen will », où est le verbe conjugué (will) ?", opts: ["en 2e position", "à la fin de la subordonnée", "juste après weil", "en 1re position"], a: 1, exp: "weil = subordonnant : will à la fin." },
      { type: "input", q: "Complète l'inversion : « Sie hat wenig Geld, deshalb ___ sie einen Ferienjob. » (suchen)", a: ["sucht"], ph: "verbe", exp: "deshalb → inversion : sucht sie." },
      { type: "vf", q: "Dans « Trotzdem gibt sie nicht auf », il y a inversion (verbe avant le sujet).", a: true, exp: "trotzdem = adverbe-connecteur → inversion : gibt sie." },
      { type: "qcm", q: "« Obwohl sie viel arbeitet, bleibt sie optimistisch. » Pourquoi la 2e partie commence par « bleibt » ?", opts: ["Faute de frappe", "La subordonnée (obwohl...) occupe la position 1, le verbe de la principale suit", "obwohl est un coordonnant", "Il manque le sujet"], a: 1, exp: "Subordonnée en tête → verbe principal en 2e : bleibt sie." }
    ],
    solution: `<p>Le texte illustre les trois groupes :</p>
<pre class="pseudo">denn        coordonnant     → sie liebt (ordre normal)
weil        subordonnant    → ... bestehen will (verbe à la fin)
trotzdem    adverbe-conn.   → gibt sie (inversion)
deshalb     adverbe-conn.   → sucht sie (inversion)
obwohl      subordonnant    → sie viel arbeitet (verbe à la fin)</pre>
<p>La clé du B1 : identifier le groupe du connecteur AVANT de placer le verbe. Coordonnant → ordre normal ; adverbe-connecteur en tête → inversion ; subordonnant → verbe à la fin.</p>`
  }
};
