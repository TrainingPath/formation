  title: "Compréhension : un fait divers court",
  subtitle: "Comprendre un bref récit d'événement : qui, quoi, où, quand, comment.",
  theory: `
<h3>1. Qu'est-ce qu'un fait divers ?</h3>
<p>Un <strong>fait divers</strong> (die Meldung / der Vorfall) est une courte nouvelle qui raconte un événement précis : un accident, un vol, un sauvetage, un incident insolite. Le texte répond aux fameuses questions journalistiques, les <strong>W-Fragen</strong> :</p>
<pre class="pseudo">Wer?      qui ?          Was?     quoi ?
Wann?     quand ?        Wo?      où ?
Wie?      comment ?      Warum?   pourquoi ?</pre>
<div class="tip">Ta stratégie de lecture : après avoir lu, repère les réponses aux W-Fragen. Si tu peux répondre à qui / quoi / où / quand, tu as compris l'essentiel — même sans connaître chaque mot.</p></div>
<h3>2. Le vocabulaire du fait divers</h3>
<pre class="pseudo">die Polizei       la police       der Zeuge      le témoin
der Dieb          le voleur       stehlen        voler
der Unfall        l'accident      verletzen      blesser
retten            sauver          festnehmen     arrêter (interpeller)
der Brand / das Feuer   l'incendie  löschen       éteindre
die Feuerwehr     les pompiers    verletzt       blessé</pre>
<h3>3. Les temps du récit</h3>
<p>Le fait divers écrit utilise souvent le <strong>Präteritum</strong> (prétérit), le passé simple du journalisme : <em>Ein Mann stahl ...</em> (un homme vola...), <em>Die Polizei kam ...</em> (la police vint...). À l'oral, on préférerait le Perfekt. Reconnais ces formes fréquentes :</p>
<pre class="pseudo">war        était        kam        vint
gab        donnait/y avait   fand   trouva
sah        vit          nahm ... fest   arrêta
konnte     pouvait      musste     devait</pre>
<h3>4. Le fait divers à lire</h3>
<pre class="pseudo">Hund rettet schlafende Familie vor Feuer

Köln. In der Nacht zum Sonntag hat ein Hund eine Familie das Leben
gerettet. Gegen drei Uhr morgens brach in der Küche ein Feuer aus.
Die vier Bewohner schliefen tief und bemerkten nichts.

Doch der Hund der Familie, ein junger Labrador, wurde unruhig.
Er bellte laut und weckte seinen Besitzer. Der Mann sah den Rauch
und alarmierte sofort seine Frau und die beiden Kinder. Alle konnten
rechtzeitig das Haus verlassen.

Die Feuerwehr löschte den Brand nach etwa einer Stunde. Niemand wurde
verletzt. Nur die Küche wurde stark beschädigt. Die Ursache war
wahrscheinlich ein defektes Elektrogerät.</pre>
<pre class="pseudo">ausbrechen = se déclarer  ·  der Bewohner = l'habitant  ·  bemerken = remarquer
unruhig = agité  ·  bellen = aboyer  ·  wecken = réveiller  ·  der Rauch = la fumée
rechtzeitig = à temps  ·  beschädigen = endommager  ·  die Ursache = la cause  ·  defekt = défectueux</pre>
<div class="warn">Le passif du passé apparaît souvent : <em>Niemand wurde verletzt</em> (personne ne fut blessé), <em>die Küche wurde beschädigt</em> (la cuisine fut endommagée). <strong>wurde + participe</strong> = passif au passé (revois le jour 4).</p></div>`,
  exercises: [
    { type: "qcm", q: "Que racontent les W-Fragen d'un fait divers ?", opts: ["L'opinion du journaliste", "Qui, quoi, où, quand, comment, pourquoi", "Le prix des objets", "La météo"], a: 1, exp: "Wer? Was? Wann? Wo? Wie? Warum? = les questions de base." },
    { type: "qcm", q: "Qui a sauvé la famille dans le fait divers ?", opts: ["Un voisin", "Le chien de la famille (un labrador)", "La police", "Un enfant"], a: 1, exp: "« ein Hund ... ein junger Labrador ... weckte seinen Besitzer »." },

    { type: "qcm", q: "À quelle heure environ le feu a-t-il commencé ?", opts: ["À midi", "Vers trois heures du matin", "Le soir à 20h", "À l'aube (6h)"], a: 1, exp: "« Gegen drei Uhr morgens »." },

    { type: "vf", q: "Une personne a été gravement blessée.", a: false, exp: "FAUX : « Niemand wurde verletzt » = personne ne fut blessé." },

    { type: "qcm", q: "« Niemand wurde verletzt » est une phrase au…", opts: ["présent actif", "passif du passé (wurde + participe)", "futur", "impératif"], a: 1, exp: "wurde verletzt = passif au passé : « ne fut blessé »." },
    { type: "input", q: "Que signifie « die Feuerwehr » ? (en français)", a: ["les pompiers","pompiers","la caserne des pompiers"], ph: "traduction", exp: "die Feuerwehr = les pompiers." },

    intro: `<p>Applique la méthode des W-Fragen à ce fait divers, puis réponds.</p>
<pre class="pseudo">Junge findet Geldbörse und gibt sie zurück

Dresden. Ein zehnjähriger Junge hat am Montag in einem Park eine
Geldbörse gefunden. Darin waren 500 Euro und mehrere wichtige
Dokumente. Der Junge, Tim, überlegte nicht lange und brachte die
Geldbörse sofort zur Polizei.

Die Polizei fand schnell den Besitzer, einen älteren Mann aus der
Nachbarschaft. Der Mann war sehr glücklich und dankte dem Jungen.
Als Belohnung schenkte er Tim fünfzig Euro. Tim sagte, er habe nur
das Richtige tun wollen.

Die Polizei lobte das ehrliche Verhalten des Jungen. Solche
Geschichten, sagte ein Sprecher, gebe es leider nicht oft genug.</pre>
<p>(die Geldbörse = le portefeuille · zurückgeben = rendre · überlegen = réfléchir · der Besitzer = le propriétaire · die Belohnung = la récompense · loben = féliciter · ehrlich = honnête · das Verhalten = le comportement · der Sprecher = le porte-parole)</p>`,
    questions: [
      { type: "input", q: "Quel âge a le garçon ? (chiffre)", a: ["10","zehn"], ph: "âge", exp: "« Ein zehnjähriger Junge » = un garçon de dix ans." },
      { type: "qcm", q: "Qu'a-t-il trouvé et où ?", opts: ["Un téléphone dans la rue", "Un portefeuille dans un parc", "Un chien à la gare", "Des clés à l'école"], a: 1, exp: "« in einem Park eine Geldbörse gefunden »." },
      { type: "qcm", q: "Combien d'argent y avait-il dans le portefeuille ?", opts: ["50 euros", "500 euros", "5000 euros", "15 euros"], a: 1, exp: "« Darin waren 500 Euro »." },
      { type: "vf", q: "Tim a rapporté tout de suite le portefeuille à la police.", a: true, exp: "« brachte die Geldbörse sofort zur Polizei »." },
      { type: "qcm", q: "Comment le propriétaire a-t-il remercié Tim ?", opts: ["Il l'a ignoré", "Il lui a offert cinquante euros en récompense", "Il a appelé ses parents", "Il lui a donné le portefeuille"], a: 1, exp: "« Als Belohnung schenkte er Tim fünfzig Euro »." }
    ],
    solution: `<p>Réponds aux W-Fragen : <strong>Wer?</strong> un garçon de 10 ans, Tim. <strong>Was?</strong> il a trouvé un portefeuille (eine Geldbörse) avec 500 euros et des documents. <strong>Wo?</strong> dans un parc à Dresde. <strong>Wann?</strong> lundi. <strong>Wie?</strong> il l'a aussitôt apporté à la police (<em>brachte ... sofort zur Polizei</em>), qui a retrouvé le propriétaire. En récompense (<em>als Belohnung</em>), l'homme lui a offert 50 euros. La police a salué son comportement honnête (<em>ehrliches Verhalten</em>).</p>
<p>Remarque le Präteritum du récit (<em>fand, brachte, schenkte, lobte</em>) et le discours indirect au Konjunktiv I à la fin (<em>er habe ... wollen</em>, <em>gebe es</em>) — le style typique de la presse (jour 5).</p>`
  }
