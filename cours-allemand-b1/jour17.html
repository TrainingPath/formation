  theory: `
<h3>1. Exprimer son opinion</h3>
<p>Au niveau B1, on attend de toi que tu prennes position. Voici les formules de base ; toutes sont suivies d'une subordonnée en <strong>dass</strong> (que) qui envoie le verbe conjugué à la fin :</p>
<pre class="pseudo">Ich denke, dass ...        Je pense que ...
Ich glaube, dass ...       Je crois que ...
Ich finde, dass ...        Je trouve que ...
Ich meine, dass ...        Je suis d'avis que ...
Meiner Meinung nach ...    À mon avis ...
Ich bin der Meinung, dass ...  Je suis d'avis que ...</pre>
<pre class="pseudo">Ich denke, dass Technik unser Leben leichter macht.
Je pense que la technologie rend notre vie plus facile.  (macht à la fin)</pre>
<div class="tip"><strong>Meiner Meinung nach</strong> (à mon avis) est très utile car il NE déclenche PAS de subordonnée : c'est un simple complément. En tête de phrase, il provoque l'inversion : <em>Meiner Meinung nach <strong>ist</strong> das falsch.</em> (À mon avis, c'est faux.)</p></div>
<h3>2. Être d'accord (Zustimmung)</h3>
<pre class="pseudo">Ich bin (ganz) deiner Meinung.   Je suis (tout à fait) de ton avis.
Da hast du recht.                Là, tu as raison.
Das stimmt (genau).             C'est (exactement) vrai.
Genau! / Eben!                  Exactement ! / Justement !
Das sehe ich auch so.           Je vois les choses de la même façon.</pre>
<h3>3. Ne pas être d'accord (Widerspruch)</h3>
<pre class="pseudo">Ich bin nicht deiner Meinung.    Je ne suis pas de ton avis.
Da bin ich anderer Meinung.      Là, je suis d'un autre avis.
Das stimmt nicht.                Ce n'est pas vrai.
Das sehe ich anders.             Je vois les choses autrement.
Ich bin dagegen. / Ich bin dafür.  Je suis contre. / Je suis pour.</pre>
<div class="warn">Pour contredire poliment, on commence souvent par <em>Das mag sein, aber ...</em> (C'est possible, mais ...) ou <em>Einerseits ..., andererseits ...</em> (D'une part ..., d'autre part ...). Contredire brutalement (<em>Das ist falsch!</em>) passe pour agressif.</div>
<h3>4. Nuancer et structurer</h3>
<pre class="pseudo">einerseits ... andererseits ...   d'une part ... d'autre part ...
zwar ... aber ...                 certes ... mais ...
trotzdem                          malgré tout / pourtant
außerdem                          en outre / de plus
zum Beispiel                      par exemple
insgesamt                         dans l'ensemble</pre>
<pre class="pseudo">Zwar ist das Auto praktisch, aber es ist auch teuer.
Certes la voiture est pratique, mais elle est aussi chère.</pre>
<h3>5. Un mini-débat modèle</h3>

— Einerseits stimmt das, andererseits kann man sie kontrollieren.</pre>
<p>(gefährlich = dangereux · süchtig = accro · kontrollieren = contrôler)</p>`,

    { type: "input", q: "Complète : « Ich denke, dass Technik unser Leben leichter ___. » (verbe machen, à la fin)", a: ["macht"], ph: "verbe conjugué", exp: "Dans la subordonnée en dass, macht se place à la fin." },

      { type: "vf", q: "À la fin, Tom est d'accord avec Sara : un mélange est probablement le mieux.", a: true, exp: "« Da hast du recht. Eine Mischung ist wahrscheinlich am besten. »" }

    solution: `<p>Tom défend le <strong>Homeoffice</strong> (télétravail) : on économise temps et argent (<em>man spart Zeit und Geld</em>). Sara nuance : elle est <em>nur teilweise deiner Meinung</em> (seulement en partie d'accord). Elle utilise <strong>zwar ... aber ...</strong> (certes on économise le trajet, mais on se sent seul) puis <strong>einerseits ... andererseits ...</strong>. Sa conclusion : <em>man braucht beides</em> (on a besoin des deux). Tom conclut par une marque d'accord : <em>Da hast du recht</em>.</p>
<p>Remarque comment le débat reste courtois grâce aux formules de nuance (<em>Das mag sein, aber ...</em>) plutôt qu'aux contradictions frontales.</p>`
  }
