<script>
var DAY = {
  num: 14,
  title: "Les émotions et la personnalité",
  subtitle: "Décrire ce qu'on ressent et comment on est.",
  theory: `
<h3>1. Les émotions de base</h3>
<p>Voici le vocabulaire pour exprimer ce que l'on ressent. La plupart s'emploient avec <strong>sein</strong> (être) :</p>
<pre class="pseudo">glücklich       heureux         traurig        triste
froh            content         wütend / böse  en colère / fâché
zufrieden       satisfait       enttäuscht     déçu
aufgeregt       excité/nerveux  nervös         nerveux
entspannt       détendu         gestresst      stressé
überrascht      surpris         ängstlich      anxieux/craintif
stolz           fier            eifersüchtig   jaloux</pre>
<pre class="pseudo">Ich bin heute sehr glücklich.   Je suis très heureux aujourd'hui.
Er ist enttäuscht.              Il est déçu.</pre>
<h3>2. Exprimer une émotion avec un verbe</h3>
<p>Certaines émotions se disent avec des verbes (souvent réfléchis, jour 9) :</p>
<pre class="pseudo">sich freuen (über/auf)   se réjouir
sich ärgern (über)       s'énerver / se fâcher
sich fürchten (vor)      avoir peur (de)
sich langweilen          s'ennuyer
sich aufregen (über)     s'énerver / s'exciter
Angst haben (vor)        avoir peur (de)</pre>
<pre class="pseudo">Ich ärgere mich über den Lärm.   Je m'énerve à cause du bruit.
Sie hat Angst vor Spinnen.       Elle a peur des araignées.</pre>
<h3>3. Décrire la personnalité (Charaktereigenschaften)</h3>
<p>Les <strong>traits de caractère</strong> s'emploient aussi avec sein. Beaucoup sont utiles pour un entretien (jour 13) :</p>
<pre class="pseudo">Qualités positives           Traits plus difficiles
freundlich   aimable         schüchtern   timide
hilfsbereit  serviable       stur         têtu
geduldig     patient         faul         paresseux
ehrgeizig    ambitieux       egoistisch   égoïste
ordentlich   ordonné         chaotisch    désordonné
humorvoll    plein d'humour  arrogant     arrogant
ehrlich      honnête         nervös       nerveux</pre>
<pre class="pseudo">Meine Schwester ist sehr geduldig und hilfsbereit.
Ma soeur est très patiente et serviable.</pre>
<h3>4. Nuancer avec des adverbes</h3>
<p>Pour graduer l'intensité, on ajoute un adverbe devant l'adjectif :</p>
<pre class="pseudo">sehr        très            ziemlich    assez
ein bisschen un peu         etwas       un peu
total / echt vraiment        gar nicht   pas du tout
manchmal    parfois         oft         souvent</pre>
<pre class="pseudo">Ich bin manchmal etwas schüchtern, aber meistens offen.
Je suis parfois un peu timide, mais généralement ouvert.</pre>
<h3>5. Parler des émotions des autres</h3>
<p>Pour décrire ou deviner l'état de quelqu'un :</p>
<pre class="pseudo">Du siehst müde aus.        Tu as l'air fatigué.
Er wirkt nervös.           Il semble nerveux.
Was ist los mit dir?       Qu'est-ce qui ne va pas ?
Mir geht es nicht gut.     Je ne vais pas bien.</pre>
<div class="tip">aussehen (avoir l'air) et wirken (sembler, faire l'effet de) sont très utiles : Du siehst glücklich aus. / Sie wirkt gestresst.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « glücklich » ?", opts: ["triste", "heureux", "fâché", "fatigué"], a: 1, exp: "glücklich = heureux ; traurig = triste." },
    { type: "input", q: "Complète : « Ich bin heute sehr ___. » (heureux)", a: ["gluecklich","glücklich"], ph: "adjectif", exp: "glücklich = heureux." },
    { type: "qcm", q: "Que signifie « wütend » ?", opts: ["content", "en colère", "surpris", "détendu"], a: 1, exp: "wütend / böse = en colère, fâché." },
    { type: "qcm", q: "Que signifie « enttäuscht » ?", opts: ["excité", "déçu", "fier", "jaloux"], a: 1, exp: "enttäuscht = déçu." },
    { type: "input", q: "Complète : « Sie hat ___ vor Spinnen. » (peur : nom)", a: ["Angst"], ph: "nom", exp: "Angst haben vor = avoir peur de : Angst vor Spinnen." },
    { type: "qcm", q: "« Ich ärgere mich über den Lärm » signifie…", opts: ["Je me réjouis du bruit", "Je m'énerve à cause du bruit", "J'aime le bruit", "Je dors malgré le bruit"], a: 1, exp: "sich ärgern über = s'énerver à cause de." },
    { type: "vf", q: "« sich freuen » et « sich ärgern » sont des verbes réfléchis.", a: true, exp: "Vrai : ils se construisent avec un pronom réfléchi (mich, dich, sich)." },
    { type: "qcm", q: "Que signifie « geduldig » (trait de caractère) ?", opts: ["paresseux", "patient", "égoïste", "timide"], a: 1, exp: "geduldig = patient ; ungeduldig = impatient." },
    { type: "input", q: "Complète : « Meine Schwester ist sehr ___ und hilfsbereit. » (patiente)", a: ["geduldig"], ph: "adjectif", exp: "geduldig = patient(e)." },
    { type: "qcm", q: "Que signifie « schüchtern » ?", opts: ["arrogant", "timide", "honnête", "ambitieux"], a: 1, exp: "schüchtern = timide." },
    { type: "input", q: "Complète : « Ich bin manchmal etwas schüchtern, aber ___ offen. » (généralement)", a: ["meistens"], ph: "adverbe", exp: "meistens = la plupart du temps, généralement." },
    { type: "qcm", q: "Quel adverbe signifie « pas du tout » ?", opts: ["sehr", "ziemlich", "gar nicht", "oft"], a: 2, exp: "gar nicht = pas du tout." },
    { type: "vf", q: "« Du siehst müde aus » signifie « tu as l'air fatigué ».", a: true, exp: "Vrai : aussehen = avoir l'air. Du siehst müde aus." },
    { type: "input", q: "Complète : « Er ___ nervös. » (il semble, verbe wirken)", a: ["wirkt"], ph: "verbe", exp: "wirken = sembler : Er wirkt nervös." },
    { type: "qcm", q: "Compréhension : « Mir geht es heute nicht gut, ich bin ziemlich gestresst. » Comment se sent la personne ?", opts: ["détendue et heureuse", "pas bien, assez stressée", "en colère", "fière"], a: 1, exp: "nicht gut + ziemlich gestresst = pas bien, assez stressée." }
  ],
  final: {
    title: "Exercice final — Ein schwieriger Tag",
    intro: `<p>Lis ce texte sur les émotions de Max, puis réponds.</p>
<pre class="pseudo">Heute war ein schwieriger Tag fuer Max. Am Morgen war er noch froh
und entspannt. Aber im Buero hat er sich ueber einen Kollegen
geaergert, der immer zu spaet kommt. Mittags war Max ziemlich
gestresst, weil er viel Arbeit hatte. Am Nachmittag bekam er
gute Nachrichten und war ploetzlich sehr glaecklich und stolz.
Seine Chefin sagte, er sei zuverlaessig und geduldig. Am Abend
fuehlte er sich zufrieden, aber auch ein bisschen muede.</pre>
<p>(das Büro = le bureau · die Nachricht = la nouvelle · plötzlich = soudain)</p>`,
    questions: [
      { type: "qcm", q: "Comment Max se sentait-il le matin ?", opts: ["stressé", "content et détendu (froh und entspannt)", "en colère", "triste"], a: 1, exp: "« Am Morgen war er noch froh und entspannt »." },
      { type: "input", q: "Complète : « Er hat sich über einen Kollegen ___. » (s'énerver, participe : geärgert)", a: ["geaergert","geärgert"], ph: "participe passé", exp: "sich ärgern über -> hat sich geärgert." },
      { type: "qcm", q: "Pourquoi était-il stressé à midi ?", opts: ["il avait faim", "il avait beaucoup de travail", "il était en retard", "il s'ennuyait"], a: 1, exp: "« weil er viel Arbeit hatte »." },
      { type: "vf", q: "L'après-midi, de bonnes nouvelles l'ont rendu heureux et fier.", a: true, exp: "« war plötzlich sehr glücklich und stolz »." },
      { type: "qcm", q: "Comment la cheffe décrit-elle Max ?", opts: ["paresseux et arrogant", "fiable et patient (zuverlässig und geduldig)", "timide", "chaotique"], a: 1, exp: "« er sei zuverlässig und geduldig » (discours indirect, Konj. I)." }
    ],
    solution: `<p>Le texte suit la « courbe émotionnelle » de Max : d'abord <strong>froh und entspannt</strong> (content et détendu), puis il <strong>ärgert sich</strong> (s'énerve) et devient <strong>gestresst</strong> (stressé), avant de redevenir <strong>glücklich und stolz</strong> (heureux et fier), et enfin <strong>zufrieden aber müde</strong> (satisfait mais fatigué).</p>
<p>On y trouve les deux façons d'exprimer une émotion : avec <strong>sein + adjectif</strong> (war froh, war gestresst) et avec un <strong>verbe réfléchi</strong> (hat sich geärgert, fühlte er sich). Les traits de caractère (<strong>zuverlässig, geduldig</strong>) décrivent la personnalité.</p>`
  }
};
</script>

};
</script>
