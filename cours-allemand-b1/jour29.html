<script>
var DAY = {
  num: 29,
  title: "Bilan B1 : entretien d'embauche simulé",
  subtitle: "Se présenter, répondre aux questions clés et convaincre un recruteur.",
  theory: `
<h3>1. Le contexte</h3>
<p>L'entretien d'embauche (das Vorstellungsgespräch) est une épreuve classique du B1. On te demande de te présenter, de parler de ton parcours, de tes qualités et de tes motivations. Voici un <strong>entretien complet</strong> commenté à étudier comme modèle.</p>
<h3>2. Le vocabulaire indispensable</h3>
<pre class="pseudo">die Stelle / der Job    le poste        die Bewerbung   la candidature
der Lebenslauf          le CV           die Erfahrung   l'expérience
die Ausbildung          la formation    die Stärke      la force / qualité
die Schwäche            le défaut       das Gehalt      le salaire
sich bewerben (um)      postuler (à)    einstellen      embaucher
die Kenntnisse          les connaissances  belastbar    résistant au stress</pre>
<h3>3. L'entretien complet (dialogue modèle)</h3>
<pre class="pseudo">Frau Berg (Personalchefin): Guten Tag, schön, dass Sie da sind.
                            Erzählen Sie doch kurz etwas über sich.
Herr Roth (Bewerber):       Guten Tag. Mein Name ist Daniel Roth, ich bin
                            28 Jahre alt und komme aus Lyon. Ich habe
                            Betriebswirtschaft studiert und arbeite seit
                            drei Jahren im Marketing.

Frau Berg: Warum haben Sie sich bei uns beworben?
Herr Roth: Ich interessiere mich sehr für Ihre Firma, weil sie
           international arbeitet. Ich möchte meine Erfahrung erweitern
           und neue Herausforderungen annehmen.

Frau Berg: Was sind Ihre Stärken?
Herr Roth: Ich bin sehr organisiert und teamfähig. Außerdem bin ich
           belastbar und lerne schnell.

Frau Berg: Und Ihre Schwächen?
Herr Roth: Manchmal bin ich zu perfektionistisch. Aber ich arbeite daran
           und versuche, auch praktisch zu bleiben.

Frau Berg: Sprechen Sie Fremdsprachen?
Herr Roth: Ja, ich spreche fließend Französisch und Englisch, und mein
           Deutsch ist auf Niveau B1. Ich lerne jeden Tag weiter.

Frau Berg: Haben Sie noch Fragen an uns?
Herr Roth: Ja, wie sieht ein typischer Arbeitstag in Ihrem Team aus?
           Und gibt es Möglichkeiten zur Weiterbildung?

Frau Berg: Sehr gute Fragen. Wir melden uns nächste Woche bei Ihnen.
           Vielen Dank für das Gespräch!
Herr Roth: Ich danke Ihnen. Auf Wiedersehen!</pre>
<div class="tip">Structure gagnante pour « Erzählen Sie über sich » : nom + âge + origine + formation + expérience actuelle. Trois ou quatre phrases suffisent — reste concret et positif.</p></div>
<h3>4. Transformer une faiblesse en atout</h3>
<pre class="pseudo">Ne dis jamais un défaut « fatal ». Choisis-en un léger et montre que tu travailles dessus :
« Ich bin manchmal zu perfektionistisch, aber ich arbeite daran. »
« Ich rede nicht gern vor großen Gruppen, aber ich übe es regelmäßig. »</pre>
<div class="warn">À éviter : répondre « Ich habe keine Schwächen » (je n'ai aucun défaut) — cela sonne arrogant. Et n'oublie pas de POSER une question à la fin : cela montre ton intérêt.</p></div>
<h3>5. Formules de politesse de l'entretien</h3>
<pre class="pseudo">Vielen Dank für die Einladung.        Merci pour l'invitation.
Ich freue mich auf die Zusammenarbeit.  Je me réjouis de la collaboration.
Ich bin überzeugt, dass ich gut passe.  Je suis convaincu de bien convenir.
Wann könnte ich anfangen?             Quand pourrais-je commencer ?</pre>`,
  exercises: [
    { type: "qcm", q: "« das Vorstellungsgespräch » signifie…", opts: ["le CV", "l'entretien d'embauche", "le contrat de travail", "le salaire"], a: 1, exp: "das Vorstellungsgespräch = l'entretien d'embauche." },
    { type: "input", q: "Complète : « Ich habe mich um die ___ beworben. » (le poste)", a: ["Stelle"], ph: "nom", exp: "sich um die Stelle bewerben = postuler au poste." },
    { type: "qcm", q: "Bonne structure pour « Erzählen Sie über sich » ?", opts: ["Parler de son salaire idéal", "Nom, âge, origine, formation, expérience", "Critiquer son ancien patron", "Raconter ses vacances"], a: 1, exp: "Présentation concise : identité + parcours + poste actuel." },
    { type: "qcm", q: "Pourquoi Herr Roth postule-t-il dans cette entreprise ?", opts: ["Pour le salaire uniquement", "Parce qu'elle travaille à l'international et il veut de nouveaux défis", "Parce qu'elle est près de chez lui", "Sans raison précise"], a: 1, exp: "« weil sie international arbeitet ... neue Herausforderungen annehmen »." },
    { type: "input", q: "Complète une qualité : « Ich bin sehr organisiert und ___. » (qui aime le travail en équipe)", a: ["teamfähig","teamfaehig"], ph: "adjectif", exp: "teamfähig = capable de travailler en équipe." },
    { type: "qcm", q: "« belastbar » veut dire…", opts: ["paresseux", "résistant au stress", "timide", "en retard"], a: 1, exp: "belastbar = résistant à la pression / au stress." },
    { type: "vf", q: "Il est conseillé de répondre « Ich habe keine Schwächen » (je n'ai aucun défaut).", a: false, exp: "Non : cela paraît arrogant. Cite un défaut léger et montre que tu travailles dessus." },
    { type: "qcm", q: "Comment bien présenter une faiblesse ?", opts: ["La cacher totalement", "Citer un défaut léger et dire qu'on travaille dessus", "Citer un défaut grave", "Dire qu'on en a beaucoup"], a: 1, exp: "« zu perfektionistisch, aber ich arbeite daran »." },
    { type: "input", q: "Complète : « Ich spreche ___ Französisch und Englisch. » (couramment)", a: ["fließend","fliessend"], ph: "adverbe", exp: "fließend = couramment." },
    { type: "qcm", q: "Pourquoi est-il important de poser une question à la fin ?", opts: ["Pour gagner du temps", "Pour montrer son intérêt pour le poste", "Pour partir plus vite", "Ce n'est pas important"], a: 1, exp: "Poser une question montre la motivation et l'intérêt." },
    { type: "qcm", q: "« der Lebenslauf » désigne…", opts: ["la lettre de motivation", "le CV (curriculum vitae)", "l'entretien", "le salaire"], a: 1, exp: "der Lebenslauf = le CV." },
    { type: "input", q: "Complète : « Ich möchte meine ___ erweitern. » (l'expérience)", a: ["Erfahrung"], ph: "nom", exp: "die Erfahrung erweitern = élargir son expérience." },
    { type: "qcm", q: "« einstellen » signifie…", opts: ["licencier", "embaucher", "démissionner", "postuler"], a: 1, exp: "einstellen = embaucher ; sich bewerben = postuler." },
    { type: "vf", q: "« Ich freue mich auf die Zusammenarbeit » est une bonne formule pour conclure positivement.", a: true, exp: "= Je me réjouis de la collaboration : ton positif et motivé." },
    { type: "qcm", q: "Compréhension : à la fin, que dit Frau Berg ?", opts: ["Vous êtes embauché aujourd'hui", "Nous vous recontacterons la semaine prochaine", "Vous êtes refusé", "Revenez demain"], a: 1, exp: "« Wir melden uns nächste Woche bei Ihnen »." }
  ],
  final: {
    title: "Exercice final — Ein weiteres Gespräch",
    intro: `<p>Lis ce second extrait d'entretien (une candidate, Frau Klein), puis réponds.</p>
<pre class="pseudo">Personalchef: Guten Tag, Frau Klein. Warum möchten Sie als
              Projektleiterin bei uns arbeiten?
Frau Klein:   Guten Tag. Ich habe fünf Jahre Erfahrung im
              Projektmanagement, und ich suche eine neue
              Herausforderung. Ihre Firma ist bekannt für innovative
              Projekte, deshalb passt die Stelle sehr gut zu mir.

Personalchef: Wie würden Ihre Kollegen Sie beschreiben?
Frau Klein:   Sie würden sagen, dass ich zuverlässig und kommunikativ
              bin. Ich behalte auch in stressigen Situationen den
              Überblick.

Personalchef: Wo sehen Sie sich in fünf Jahren?
Frau Klein:   Ich möchte mehr Verantwortung übernehmen und vielleicht
              ein größeres Team leiten. Ich bin bereit, mich
              weiterzubilden.

Personalchef: Haben Sie Fragen?
Frau Klein:   Ja, wie ist die Arbeitsatmosphäre im Team, und bietet die
              Firma Homeoffice an?</pre>
<p>(die Projektleiterin = la cheffe de projet · die Herausforderung = le défi · zuverlässig = fiable · den Überblick behalten = garder la vue d'ensemble · die Verantwortung = la responsabilité · sich weiterbilden = se perfectionner)</p>`,
    questions: [
      { type: "qcm", q: "Pour quel poste Frau Klein postule-t-elle ?", opts: ["Secrétaire", "Cheffe de projet (Projektleiterin)", "Comptable", "Vendeuse"], a: 1, exp: "« als Projektleiterin bei uns arbeiten »." },
      { type: "input", q: "Combien d'années d'expérience a-t-elle ? « Ich habe ___ Jahre Erfahrung. » (chiffre)", a: ["fünf","5","fuenf"], ph: "nombre", exp: "« fünf Jahre Erfahrung im Projektmanagement »." },
      { type: "qcm", q: "Comment ses collègues la décriraient-ils ?", opts: ["Paresseuse et distraite", "Fiable et communicative (zuverlässig und kommunikativ)", "Timide", "Souvent absente"], a: 1, exp: "« zuverlässig und kommunikativ »." },
      { type: "vf", q: "Dans cinq ans, elle aimerait avoir plus de responsabilités et diriger une équipe plus grande.", a: true, exp: "« mehr Verantwortung übernehmen ... ein größeres Team leiten »." },
      { type: "qcm", q: "Quelles questions pose-t-elle à la fin ?", opts: ["Le salaire et les congés", "L'ambiance de travail et la possibilité de télétravail", "Rien", "L'adresse de l'entreprise"], a: 1, exp: "« wie ist die Arbeitsatmosphäre ... bietet die Firma Homeoffice an? »." }
    ],
    solution: `<p>Frau Klein applique toutes les bonnes pratiques : elle justifie sa motivation (<em>Herausforderung</em> + <em>deshalb passt die Stelle zu mir</em>), décrit ses qualités via le regard des autres (<em>zuverlässig, kommunikativ, behält den Überblick</em>), projette son avenir (<em>mehr Verantwortung, Team leiten, sich weiterbilden</em>) et pose des questions pertinentes à la fin.</p>
<p>Remarque le Konjunktiv II pour la politesse et l'hypothèse : <em>Wie würden Ihre Kollegen Sie beschreiben? — Sie würden sagen, dass ...</em>. Réutilise cette structure : elle sonne professionnelle et nuancée.</p>`
  }
};
</script>

    hints: [
      "Présentation concise : « Mein Name ist ..., ich bin ... Jahre alt und habe ... studiert / gelernt. ».",

    ],
    solution: "Guten Tag. Mein Name ist Julia Martin, ich bin 30 Jahre alt und komme aus Brüssel. Ich habe Informatik studiert und arbeite seit vier Jahren als Softwareentwicklerin. Ich bewerbe mich um diese Stelle, weil Ihre Firma für moderne Technologien bekannt ist und ich neue Herausforderungen suche. Meine Stärken sind, dass ich sehr genau arbeite und gut im Team bin. Außerdem bin ich belastbar und lerne schnell neue Programme. Eine Schwäche von mir ist, dass ich manchmal zu perfektionistisch bin, aber ich arbeite daran und versuche, auch effizient zu bleiben. Ich spreche fließend Französisch und Englisch, und mein Deutsch ist auf Niveau B1. In fünf Jahren möchte ich gern mehr Verantwortung übernehmen. Zum Schluss hätte ich eine Frage: Wie sieht ein typischer Arbeitstag in Ihrem Team aus? Vielen Dank für das Gespräch.\n\n(Traduction : Bonjour. Je m'appelle Julia Martin, j'ai 30 ans et je viens de Bruxelles. J'ai étudié l'informatique et je travaille depuis quatre ans comme développeuse de logiciels. Je postule à ce poste parce que votre entreprise est connue pour ses technologies modernes et que je cherche de nouveaux défis. Mes points forts sont que je travaille avec précision et que je suis douée pour le travail en équipe. De plus, je résiste au stress et j'apprends vite de nouveaux programmes. Un de mes défauts est que je suis parfois trop perfectionniste, mais j'y travaille et j'essaie de rester efficace. Je parle couramment français et anglais, et mon allemand est de niveau B1. Dans cinq ans, j'aimerais assumer plus de responsabilités. Pour finir, j'aurais une question : à quoi ressemble une journée type dans votre équipe ? Merci pour cet entretien.)",
    note: "Un entretien réussi est structuré et positif : présente-toi en 3-4 phrases, justifie ta motivation avec un connecteur (weil/deshalb), transforme ta faiblesse en atout, et termine TOUJOURS par une question. Le vouvoiement (Sie/Ihnen/Ihr) est de rigueur." }

};
