<script>
var DAY = {
  num: 6,
  title: "Le Konjunktiv II (hypothèse, politesse)",
  subtitle: "« Je voudrais... », « si j'avais le temps... ».",
  theory: `
<h3>1. À quoi sert le Konjunktiv II ?</h3>
<p>Le <strong>Konjunktiv II</strong> est le mode de l'<strong>irréel</strong> et de la <strong>politesse</strong>. Il correspond au conditionnel français. Trois emplois principaux :</p>
<pre class="pseudo">1) Hypothèse / irréel : Wenn ich Zeit haette, ...  Si j'avais le temps...
2) Politesse :          Ich haette gern...          Je voudrais...
3) Souhait / conseil :  Du solltest mehr schlafen.  Tu devrais dormir plus.</pre>
<h3>2. La forme « würde » (la plus simple)</h3>
<p>Pour la plupart des verbes, on forme le Konjunktiv II avec <strong>würde</strong> (conjugué) + <strong>infinitif</strong>. C'est l'équivalent de « je ferais, tu ferais... ».</p>
<pre class="pseudo">ich würde   wir würden
du würdest  ihr würdet
er/sie würde sie/Sie würden

Ich würde gern nach Italien fahren.  J'aimerais aller en Italie.
Was würdest du machen?               Que ferais-tu ?</pre>
<h3>3. Les formes irrégulières à connaître</h3>
<p>Certains verbes très fréquents ont une forme propre (plus élégante que würde). À mémoriser absolument :</p>
<pre class="pseudo">Infinitif   Konj. II       sens
sein        ich wäre       je serais
haben       ich hätte      j'aurais
werden      ich würde      je deviendrais / je -rais
können      ich könnte     je pourrais
müssen      ich müsste     je devrais (obligation)
sollen      ich sollte     je devrais (conseil)
mögen       ich möchte     j'aimerais (bien)</pre>
<div class="tip">Ces formes irrégulières viennent du prétérit + un Umlaut (war -> wäre, hatte -> hätte, konnte -> könnte). On les préfère à würde pour sein, haben et les modaux.</div>
<h3>4. Les phrases hypothétiques avec wenn</h3>
<p>Structure : <strong>Wenn</strong> + sujet + ... + verbe au Konj. II (à la fin) , [virgule] verbe principal au Konj. II en 2e position.</p>
<pre class="pseudo">Wenn ich reich wäre, würde ich viel reisen.
Si j'étais riche, je voyagerais beaucoup.
Wenn ich mehr Zeit hätte, würde ich Deutsch lernen.
Si j'avais plus de temps, j'apprendrais l'allemand.</pre>
<div class="warn">Dans les deux moitiés on met le Konjunktiv II. Astuce de style : on évite souvent deux würde de suite ; on garde wäre/hätte dans la partie « wenn » et würde dans la partie principale.</div>
<h3>5. La politesse au quotidien</h3>
<p>Le Konjunktiv II rend une demande beaucoup plus polie que le présent :</p>
<pre class="pseudo">présent (direct) : Ich will einen Kaffee.        Je veux un café.
poli (Konj. II) : Ich hätte gern einen Kaffee.  Je voudrais un café.
                  Könnten Sie mir helfen?         Pourriez-vous m'aider ?
                  Ich möchte bezahlen.            Je voudrais payer.</pre>
<div class="tip">« möchte » (de mögen) est LA forme polie pour exprimer un désir : ich möchte, du möchtest, er möchte... Indispensable au restaurant et dans les magasins.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi correspond le Konjunktiv II en français ?", opts: ["à l'impératif", "au conditionnel", "au futur simple", "au passé composé"], a: 1, exp: "Konjunktiv II = conditionnel (irréel, politesse)." },
    { type: "input", q: "Konjunktiv II de haben, 1re sing. : « Ich ___ gern einen Kaffee. » (je voudrais)", a: ["haette","hätte"], ph: "haben au Konj. II", exp: "ich hätte gern = je voudrais (poli)." },
    { type: "input", q: "Konjunktiv II de sein, 1re sing. : « Wenn ich reich ___, ... » (si j'étais)", a: ["waere","wäre"], ph: "sein au Konj. II", exp: "ich wäre = je serais (war + Umlaut)." },
    { type: "qcm", q: "Comment former le Konjunktiv II de la plupart des verbes ?", opts: ["haben + participe", "würde + infinitif", "werden + participe", "sein + infinitif"], a: 1, exp: "würde conjugué + infinitif : ich würde machen." },
    { type: "input", q: "Complète : « Was ___ du machen? » (que ferais-tu, würde à la 2e sing.)", a: ["wuerdest","würdest"], ph: "würde conjugué", exp: "du würdest : Was würdest du machen ?" },
    { type: "qcm", q: "Forme polie de « je voudrais » (mögen) :", opts: ["ich will", "ich möchte", "ich mag", "ich muss"], a: 1, exp: "ich möchte = j'aimerais / je voudrais (poli)." },
    { type: "input", q: "Konjunktiv II de können, 1re sing. : « ___ Sie mir helfen? » (pourriez-vous)", a: ["Koennten","Könnten","koennten","könnten"], ph: "können au Konj. II", exp: "Könnten Sie...? = Pourriez-vous ? (poli)." },
    { type: "vf", q: "Le Konjunktiv II rend une demande plus polie que le présent.", a: true, exp: "Vrai : Könnten Sie...? est plus poli que Können Sie...?" },
    { type: "input", q: "Complète l'hypothèse : « Wenn ich Zeit ___, würde ich reisen. » (haben au Konj. II)", a: ["haette","hätte"], ph: "haben au Konj. II", exp: "Wenn ich Zeit hätte = si j'avais le temps." },
    { type: "qcm", q: "Dans une phrase avec wenn (hypothèse), quel mode utilise-t-on ?", opts: ["l'indicatif présent", "le Konjunktiv II dans les deux parties", "l'impératif", "le Konjunktiv I"], a: 1, exp: "Les deux moitiés sont au Konjunktiv II." },
    { type: "qcm", q: "« Du solltest mehr schlafen » exprime…", opts: ["une obligation absolue", "un conseil (tu devrais)", "une interdiction", "un ordre du passé"], a: 1, exp: "solltest = conseil poli : tu devrais." },
    { type: "input", q: "Konjunktiv II de werden pour un souhait : « Ich ___ gern nach Italien fahren. »", a: ["wuerde","würde"], ph: "würde", exp: "Ich würde gern... fahren = j'aimerais aller..." },
    { type: "vf", q: "« Ich will einen Kaffee » est plus poli que « Ich hätte gern einen Kaffee ».", a: false, exp: "Faux : hätte gern (Konj. II) est la forme polie ; will est direct." },
    { type: "qcm", q: "D'où viennent les formes wäre, hätte, könnte ?", opts: ["de l'infinitif + e", "du prétérit + un Umlaut", "du participe passé", "du futur"], a: 1, exp: "war->wäre, hatte->hätte, konnte->könnte (prétérit + Umlaut)." },
    { type: "qcm", q: "Compréhension : « An deiner Stelle würde ich einen Arzt anrufen. » Que fait le locuteur ?", opts: ["Il appelle un médecin", "Il conseille d'appeler un médecin (à ta place, j'appellerais)", "Il refuse d'appeler", "Il est médecin"], a: 1, exp: "An deiner Stelle würde ich... = à ta place je... (conseil hypothétique)." }
  ],
  final: {
    title: "Exercice final — Wenn ich könnte...",
    intro: `<p>Lis ce petit texte de rêves et de politesse, puis réponds.</p>
<pre class="pseudo">Wenn ich mehr Geld haette, wuerde ich eine lange Reise machen.
Ich wuerde gern nach Japan fliegen. Wenn ich dort waere, wuerde ich
jeden Tag etwas Neues lernen. Meine Freundin sagt, an meiner Stelle
wuerde sie zuerst Sprachen lernen. Sie meint, ich sollte mehr sparen.
Im Restaurant sind wir immer hoeflich: Wir sagen Ich haette gern...
und Koennten Sie uns bitte die Karte bringen?</pre>
<p>(das Geld = l'argent · sparen = économiser · höflich = poli · die Karte = le menu)</p>`,
    questions: [
      { type: "input", q: "Complète l'hypothèse : « Wenn ich mehr Geld ___, würde ich reisen. »", a: ["haette","hätte"], ph: "haben au Konj. II", exp: "Wenn ich Geld hätte = si j'avais de l'argent." },
      { type: "qcm", q: "Où le locuteur aimerait-il aller ?", opts: ["en Chine", "au Japon (nach Japan)", "en Italie", "nulle part"], a: 1, exp: "« Ich würde gern nach Japan fliegen. »" },
      { type: "qcm", q: "Que conseille l'amie ?", opts: ["de dépenser plus", "d'économiser davantage (mehr sparen)", "de rester à la maison", "de changer de travail"], a: 1, exp: "« Sie meint, ich sollte mehr sparen » (conseil au Konj. II)." },
      { type: "vf", q: "« Ich hätte gern... » est une formule polie au restaurant.", a: true, exp: "Vrai : hätte gern = je voudrais (poli)." },
      { type: "input", q: "Forme polie : « ___ Sie uns bitte die Karte bringen? » (können au Konj. II)", a: ["Koennten","Könnten","koennten","könnten"], ph: "können au Konj. II", exp: "Könnten Sie...? = Pourriez-vous...? (demande polie)." }
    ],
    solution: `<p>Le texte illustre les trois emplois : l'<strong>hypothèse</strong> (Wenn ich Geld hätte, würde ich...), le <strong>souhait</strong> (ich würde gern... fliegen), le <strong>conseil</strong> (ich sollte mehr sparen ; an meiner Stelle würde sie...) et la <strong>politesse</strong> (Ich hätte gern..., Könnten Sie...?).</p>
<p>Retiens la répartition : <strong>wäre / hätte / könnte / sollte / möchte</strong> pour sein, haben et les modaux ; <strong>würde + infinitif</strong> pour tous les autres verbes.</p>`
  }
};
</script>
