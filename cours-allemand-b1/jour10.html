<script>
var DAY = {
  num: 10,
  title: "La déclinaison de l'adjectif (sans article)",
  subtitle: "« bon vin », « fraîche eau » : quand l'adjectif porte tout le poids.",
  theory: `
<h3>1. Trois cas de déclinaison, un rappel</h3>
<p>Un adjectif <strong>épithète</strong> (placé devant le nom) prend une terminaison qui dépend de l'article qui le précède. Il y a trois situations :</p>
<pre class="pseudo">1) après article défini (der/die/das)   -> déclinaison faible (-e / -en)
2) après article indéfini (ein/kein/mein) -> déclinaison mixte
3) SANS article                          -> déclinaison forte (aujourd'hui !)</pre>
<div class="tip">Aujourd'hui, on se concentre sur le 3e cas : quand il n'y a AUCUN article, l'adjectif doit à lui seul montrer le genre et le cas. Il prend donc les terminaisons... de l'article défini (der, das, die...).</div>
<h3>2. La déclinaison forte (sans article)</h3>
<p>Sans article, l'adjectif « remplace » l'article : il en prend presque toutes les terminaisons.</p>
<pre class="pseudo">Cas          masculin    neutre     féminin    pluriel
Nominatif    -er         -es        -e         -e
Accusatif    -en         -es        -e         -e
Datif        -em         -em        -er        -en
Génitif      -en         -en        -er        -er</pre>
<pre class="pseudo">guter Wein          bon vin (masc, nom.)
kaltes Wasser       eau froide (neutre, nom./acc.)
frische Milch       lait frais (fém, nom./acc.)
grüne Äpfel         des pommes vertes (pluriel)</pre>
<h3>3. Comparaison avec l'article défini</h3>
<p>Compare : sans article, l'adjectif prend la terminaison que porterait « der/das/die ».</p>
<pre class="pseudo">der gute Wein     -> guter Wein     (l'adjectif prend le -r de der)
das kalte Wasser  -> kaltes Wasser  (l'adjectif prend le -s de das)
die frische Milch -> frische Milch  (le -e de die)</pre>
<div class="warn">Exception au génitif masculin/neutre : le nom porte déjà -s, donc l'adjectif prend simplement -en (guten Weines, kalten Wassers) et non -es.</div>
<h3>4. Quand cette déclinaison apparaît-elle ?</h3>
<p>La déclinaison forte (sans article) est très fréquente pour parler de <strong>quantités, de matières, de nourriture</strong> et avec les <strong>pluriels indéterminés</strong>.</p>
<pre class="pseudo">Ich trinke gern kalten Kaffee.   J'aime le café froid. (masc, acc. -> -en)
Sie kauft frisches Brot.         Elle achète du pain frais. (neutre acc. -> -es)
Wir essen italienische Pizza.    Nous mangeons de la pizza italienne. (fém acc. -> -e)
Er hat nette Kollegen.           Il a des collègues sympas. (pluriel -> -e)</pre>
<h3>5. Avec datif et prépositions</h3>
<p>Beaucoup d'expressions sans article apparaissent au datif (après mit, aus, bei...) :</p>
<pre class="pseudo">mit heissem Wasser     avec de l'eau chaude (neutre datif -> -em)
aus frischer Milch     à partir de lait frais (fém datif -> -er)
mit netten Leuten      avec des gens sympas (pluriel datif -> -en)</pre>
<div class="tip">Repère : sans article, adjectif au datif -> masculin/neutre -em, féminin -er, pluriel -en. C'est exactement dem/dem/der/den sans le d-.</div>`,
  exercises: [
    { type: "qcm", q: "Sans article, l'adjectif prend les terminaisons…", opts: ["de l'article indéfini", "de l'article défini (der/das/die)", "aucune terminaison", "toujours -e"], a: 1, exp: "Déclinaison forte : l'adjectif porte la marque que porterait l'article défini." },
    { type: "input", q: "Complète : « ___ Wein » (bon vin, masc. nominatif, sans article : gut + terminaison)", a: ["guter"], ph: "adjectif décliné", exp: "Masc. nom. sans article -> -er : guter Wein (comme der)." },
    { type: "input", q: "Complète : « ___ Wasser » (eau froide, neutre nom./acc. : kalt + terminaison)", a: ["kaltes"], ph: "adjectif décliné", exp: "Neutre nom./acc. -> -es : kaltes Wasser (comme das)." },
    { type: "qcm", q: "Terminaison de l'adjectif féminin au nominatif, sans article :", opts: ["-er", "-es", "-e", "-en"], a: 2, exp: "Féminin nom. -> -e : frische Milch (comme die)." },
    { type: "input", q: "Complète : « ___ Milch » (lait frais, fém. nom./acc. : frisch + terminaison)", a: ["frische"], ph: "adjectif décliné", exp: "Féminin -> -e : frische Milch." },
    { type: "qcm", q: "« Ich trinke gern kalten Kaffee. » Pourquoi -en ?", opts: ["féminin datif", "masculin accusatif", "neutre nominatif", "pluriel"], a: 1, exp: "der Kaffee (masc), COD -> accusatif masc sans article = -en (comme den)." },
    { type: "vf", q: "Sans article, l'adjectif au pluriel nominatif/accusatif prend -e (nette Kollegen).", a: true, exp: "Vrai : pluriel nom./acc. -> -e (comme die)." },
    { type: "input", q: "Complète : « Sie kauft ___ Brot. » (pain frais, neutre acc. : frisch)", a: ["frisches"], ph: "adjectif décliné", exp: "Neutre acc. sans article -> -es : frisches Brot." },
    { type: "qcm", q: "« mit heißem Wasser » : pourquoi -em ?", opts: ["neutre datif", "masculin accusatif", "féminin nominatif", "génitif"], a: 0, exp: "mit + datif ; das Wasser (neutre) datif sans article -> -em." },
    { type: "input", q: "Complète : « aus ___ Milch » (à partir de lait frais, fém. datif : frisch)", a: ["frischer"], ph: "adjectif décliné", exp: "Féminin datif sans article -> -er : aus frischer Milch." },
    { type: "qcm", q: "Terminaison de l'adjectif au datif pluriel, sans article :", opts: ["-e", "-em", "-er", "-en"], a: 3, exp: "Datif pluriel -> -en : mit netten Leuten." },
    { type: "vf", q: "Au génitif masculin sans article, l'adjectif prend -es (gutes Weines).", a: false, exp: "Faux : le nom porte déjà -s, l'adjectif prend -en : guten Weines." },
    { type: "input", q: "Complète : « Wir essen ___ Pizza. » (pizza italienne, fém. acc. : italienisch)", a: ["italienische"], ph: "adjectif décliné", exp: "Féminin acc. sans article -> -e : italienische Pizza." },
    { type: "qcm", q: "Quelle expression est correcte (pluriel accusatif sans article) ?", opts: ["grüne Äpfel", "grünen Äpfel", "grünem Äpfel", "grünes Äpfel"], a: 0, exp: "Pluriel nom./acc. -> -e : grüne Äpfel (des pommes vertes)." },
    { type: "qcm", q: "Compréhension : « Er kocht mit frischen Zutaten. » Comment cuisine-t-il ?", opts: ["avec des ingrédients surgelés", "avec des ingrédients frais", "sans ingrédients", "avec de vieux ingrédients"], a: 1, exp: "frischen Zutaten (pluriel datif après mit) = avec des ingrédients frais." }
  ],
  final: {
    title: "Exercice final — Auf dem Markt",
    intro: `<p>Lis ce texte sur un marché (adjectifs sans article) et réponds.</p>
<pre class="pseudo">Auf dem Markt gibt es frisches Obst und knackiges Gemuese. Ich kaufe
gern roten Apfel, gruenen Salat und suesse Erdbeeren. Der Baecker
verkauft warmes Brot und leckere Broetchen. An einem Stand gibt es
italienischen Kaese aus frischer Milch. Meine Mutter kocht am liebsten
mit frischen Zutaten. Zu Hause trinken wir dann kalten Saft und
essen selbstgemachten Kuchen.</pre>
<p>(knackig = croquant · der Bäcker = le boulanger · selbstgemacht = fait maison)</p>`,
    questions: [
      { type: "input", q: "Complète : « Auf dem Markt gibt es ___ Obst. » (fruits frais, neutre acc. : frisch)", a: ["frisches"], ph: "adjectif décliné", exp: "Neutre acc. sans article -> -es : frisches Obst." },
      { type: "qcm", q: "« roten Apfel » est à quel cas/genre ?", opts: ["féminin datif", "masculin accusatif (COD)", "neutre nominatif", "pluriel"], a: 1, exp: "der Apfel (masc), COD -> accusatif -> -en : roten Apfel." },
      { type: "input", q: "Complète : « Der Bäcker verkauft ___ Brot. » (pain chaud, neutre acc. : warm)", a: ["warmes"], ph: "adjectif décliné", exp: "Neutre acc. sans article -> -es : warmes Brot." },
      { type: "qcm", q: "Avec quoi la mère cuisine-t-elle de préférence ?", opts: ["avec des surgelés", "avec des ingrédients frais (mit frischen Zutaten)", "sans rien", "avec du sucre"], a: 1, exp: "« mit frischen Zutaten » (pluriel datif -> -en)." },
      { type: "vf", q: "« aus frischer Milch » est correct (féminin datif sans article -> -er).", a: true, exp: "Vrai : fém. datif sans article -> -er : aus frischer Milch." }
    ],
    solution: `<p>Le texte multiplie les adjectifs sans article : au nominatif/accusatif on voit <strong>frisches Obst</strong> (neutre -es), <strong>roten Apfel</strong> et <strong>grünen Salat</strong> (masc. acc. -en), <strong>süße Erdbeeren</strong> (pluriel -e), <strong>warmes Brot</strong> (neutre -es), <strong>italienischen Käse</strong> (masc. acc. -en). Au datif : <strong>frischer Milch</strong> (fém. -er), <strong>frischen Zutaten</strong> (pluriel -en).</p>
<p>Le principe : sans article, l'adjectif prend la terminaison de l'article défini correspondant (der -> -er, das -> -es, die -> -e...). Seule exception : génitif masc./neutre en -en.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en allemand…",
  items: [
  { id: "de-b1-j10", title: "Décris un repas ou des courses", level: 3,
    statement: "Décris un repas, un panier de courses ou un marché en 6 à 7 phrases. Utilise beaucoup d'adjectifs SANS article (frisches Brot, roten Apfel, mit frischen Zutaten...) à différents cas.",
    hints: [
      "Nominatif/accusatif : masc -er/-en, neutre -es, fém -e, pluriel -e.",
      "Datif (après mit, aus...) : masc/neutre -em, fém -er, pluriel -en.",
      "Sans article, l'adjectif prend la terminaison de der/das/die."
    ],
    solution: "Auf dem Markt kaufe ich gern frisches Obst und knackiges Gemuese. Ich nehme roten Apfel, gruenen Salat und suesse Erdbeeren. Der Baecker verkauft warmes Brot und leckere Broetchen. Ich koche am liebsten mit frischen Zutaten und gutem Olivenoel. Zum Fruehstueck trinke ich schwarzen Kaffee und esse selbstgemachte Marmelade. Am Abend gibt es italienische Pasta mit frischer Tomatensauce.\n\n(Traduction : Au marché, j'aime acheter des fruits frais et des légumes croquants. Je prends une pomme rouge, de la salade verte et des fraises sucrées. Le boulanger vend du pain chaud et de délicieux petits pains. Je cuisine de préférence avec des ingrédients frais et de la bonne huile d'olive. Au petit-déjeuner, je bois du café noir et je mange de la confiture faite maison. Le soir, il y a des pâtes italiennes avec une sauce tomate fraîche.)",

  ]
};
