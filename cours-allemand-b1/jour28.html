<h3>1. La grammaire clé du B1 (rappel)</h3>
<p>Ce jour rassemble l'essentiel des 27 jours précédents. Relis chaque point à voix haute, puis teste-toi avec les exercices.</p>
<pre class="pseudo">Génitif :          das Auto meines Vaters (la voiture de mon père)
Relatives :        der Mann, der dort steht (l'homme qui est là)
Passif :           Das Haus wird gebaut. (La maison est construite.)
Konjunktiv II :    Ich würde gern reisen. / Wenn ich Zeit hätte, ...
um ... zu :        Ich lerne, um zu bestehen. (pour réussir)</pre>
<h3>2. La place du verbe (le point le plus important)</h3>
<pre class="pseudo">Coordonnants (und, aber, denn)   → ordre normal (sujet + verbe)
Adverbes (deshalb, trotzdem)     → inversion (verbe en 2e)
Subordonnants (weil, dass, obwohl, wenn)  → verbe à la FIN
Question / complément en tête    → inversion</pre>
<div class="tip">Si tu ne dois retenir qu'une chose du B1 : identifie le connecteur, il te dit où mettre le verbe. C'est la faute la plus surveillée à l'examen.</p></div>
<h3>3. Cause, but, conséquence (rappel)</h3>
<pre class="pseudo">CAUSE :       weil (+ verbe fin) · denn (ordre normal) · wegen + génitif
BUT :         um ... zu (même sujet) · damit (sujets différents)
CONSÉQUENCE : deshalb (inversion) · sodass (+ verbe fin)</pre>
<h3>4. Les verbes à préfixe (rappel)</h3>
<pre class="pseudo">Séparables (an-, auf-, ein-, mit-...)   → préfixe à la fin ; participe -ge- au milieu
   Ich rufe an. → Ich habe angerufen.
Inséparables (be-, er-, ver-, ent-...)  → préfixe collé ; participe SANS -ge-
   Ich verstehe. → Ich habe verstanden.</pre>
<h3>5. Le vocabulaire des grands thèmes</h3>
<pre class="pseudo">Travail :   die Bewerbung, der Lebenslauf, das Vorstellungsgespräch, die Erfahrung
Médias :    die Nachrichten, herunterladen, teilen, das soziale Netzwerk
Opinion :   Meiner Meinung nach ..., einerseits ... andererseits ..., ich finde, dass ...
Récit :     zuerst, dann, plötzlich, schließlich, Perfekt + war/hatte</pre>
<h3>6. Registres et politesse (rappel)</h3>
<pre class="pseudo">Formel (Sie) :   Sehr geehrte Damen und Herren, ... Mit freundlichen Grüßen
Informel (du) :  Hallo! ... Liebe Grüße
Passer au du :   Wollen wir uns duzen?</pre>
