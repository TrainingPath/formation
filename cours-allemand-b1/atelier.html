<body>
<script>
var ATELIER = {
  prefix: "at-de-b1",
  titre: "🇩🇪 Atelier — Allemand B1",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour atteindre l'autonomie B1.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Ein Vorstellungsgespräch vereinbaren", perso:"Frau Berger (Personalabteilung) · Herr Lemaire (Bewerber aus Belgien)", lignes:[
      {qui:"Frau Berger", txt:"Nordtech GmbH, Personalabteilung, Berger, guten Morgen.", fr:"Nordtech SARL, service du personnel, Berger, bonjour."},
      {qui:"Herr Lemaire", txt:"Guten Morgen, Frau Berger. Mein Name ist Paul Lemaire. Ich habe mich vor zwei Wochen bei Ihnen beworben.", fr:"Bonjour, Madame Berger. Je m'appelle Paul Lemaire. J'ai posé ma candidature chez vous il y a deux semaines."},
      {qui:"Frau Berger", txt:"Einen Moment bitte, ich suche Ihre Unterlagen heraus. Ah ja, Ihre Bewerbung liegt mir vor. Sie interessieren sich für die Stelle als Netzwerkadministrator, nicht wahr?", fr:"Un instant s'il vous plaît, je sors votre dossier. Ah oui, votre candidature est devant moi. Vous vous intéressez au poste d'administrateur réseau, n'est-ce pas ?"},
      {qui:"Herr Lemaire", txt:"Genau. Ich wollte fragen, ob meine Unterlagen vollständig angekommen sind.", fr:"Exactement. Je voulais demander si mon dossier est bien arrivé complet."},
      {qui:"Frau Berger", txt:"Ja, alles ist da. Ihr Lebenslauf hat uns überzeugt, deshalb würden wir Sie gern persönlich kennenlernen.", fr:"Oui, tout y est. Votre CV nous a convaincus, c'est pourquoi nous aimerions faire votre connaissance en personne."},
      {qui:"Herr Lemaire", txt:"Das freut mich sehr. Wann würde es Ihnen denn passen?", fr:"Cela me fait très plaisir. Quand cela vous conviendrait-il ?"},
      {qui:"Frau Berger", txt:"Hätten Sie am Donnerstag, dem 14. März, um zehn Uhr Zeit? Das Gespräch dauert ungefähr eine Stunde.", fr:"Auriez-vous le temps jeudi 14 mars à dix heures ? L'entretien dure environ une heure."},
      {qui:"Herr Lemaire", txt:"Donnerstag passt mir gut. Könnten Sie mir bitte sagen, welche Dokumente ich mitbringen soll?", fr:"Jeudi me convient bien. Pourriez-vous me dire quels documents je dois apporter ?"},
      {qui:"Frau Berger", txt:"Bringen Sie bitte Ihre Zeugnisse im Original mit, außerdem Ihr Sprachzertifikat, falls Sie eines besitzen.", fr:"Apportez s'il vous plaît vos certificats en original, ainsi que votre certificat de langue, si vous en possédez un."},
      {qui:"Herr Lemaire", txt:"Selbstverständlich. Ich habe ein B1-Zertifikat, das ich im Januar erworben habe.", fr:"Bien entendu. J'ai un certificat B1 que j'ai obtenu en janvier."},
      {qui:"Frau Berger", txt:"Wunderbar. Die Firma befindet sich in der Hafenstraße 12; wegen der Bauarbeiten sollten Sie besser mit der U-Bahn kommen.", fr:"Parfait. L'entreprise se trouve au 12 de la Hafenstraße ; en raison des travaux, vous feriez mieux de venir en métro."},
      {qui:"Herr Lemaire", txt:"Vielen Dank für den Hinweis. Bis Donnerstag, Frau Berger!", fr:"Merci beaucoup pour l'information. À jeudi, Madame Berger !"}
    ]},
    { num:"2", titre:"Am Empfang der Firma", perso:"Frau Schulz (Empfang) · Herr Lemaire · Herr Krüger (Abteilungsleiter)", lignes:[
      {qui:"Herr Lemaire", txt:"Guten Tag. Mein Name ist Lemaire. Ich bin um zehn Uhr mit Frau Berger verabredet.", fr:"Bonjour. Je m'appelle Lemaire. J'ai rendez-vous à dix heures avec Madame Berger."},
      {qui:"Frau Schulz", txt:"Guten Tag, Herr Lemaire. Sie sind sogar etwas zu früh, das ist kein Problem. Dürfte ich bitte Ihren Ausweis sehen?", fr:"Bonjour, Monsieur Lemaire. Vous êtes même un peu en avance, ce n'est pas un problème. Pourrais-je voir votre carte d'identité ?"},
      {qui:"Herr Lemaire", txt:"Hier, bitte schön.", fr:"Tenez, je vous en prie."},
      {qui:"Frau Schulz", txt:"Danke. Ich drucke Ihnen einen Besucherausweis aus, der während des ganzen Besuchs sichtbar getragen werden muss.", fr:"Merci. Je vous imprime un badge visiteur, qui doit être porté de manière visible pendant toute la visite."},
      {qui:"Herr Lemaire", txt:"Verstanden. Darf ich meinen Mantel irgendwo ablegen?", fr:"Compris. Puis-je déposer mon manteau quelque part ?"},
      {qui:"Frau Schulz", txt:"Die Garderobe ist links neben dem Aufzug. Nehmen Sie danach bitte im Wartebereich Platz; ich melde Frau Berger, dass Sie da sind.", fr:"Le vestiaire est à gauche à côté de l'ascenseur. Ensuite, asseyez-vous dans l'espace d'attente ; je préviens Madame Berger que vous êtes là."},
      {qui:"Herr Lemaire", txt:"Vielen Dank. Könnte ich vielleicht ein Glas Wasser bekommen?", fr:"Merci beaucoup. Pourrais-je peut-être avoir un verre d'eau ?"},
      {qui:"Frau Schulz", txt:"Natürlich, der Wasserspender steht gleich hinter Ihnen. Bedienen Sie sich ruhig.", fr:"Bien sûr, la fontaine à eau est juste derrière vous. Servez-vous tranquillement."},
      {qui:"Herr Krüger", txt:"Herr Lemaire? Krüger, mein Name, ich leite die IT-Abteilung. Schön, dass Sie den Weg trotz der Bauarbeiten gefunden haben.", fr:"Monsieur Lemaire ? Krüger, je m'appelle, je dirige le service informatique. Content que vous ayez trouvé le chemin malgré les travaux."},
      {qui:"Herr Lemaire", txt:"Freut mich, Sie kennenzulernen, Herr Krüger. Die U-Bahn war zum Glück pünktlich.", fr:"Enchanté de faire votre connaissance, Monsieur Krüger. Le métro était heureusement à l'heure."},
      {qui:"Herr Krüger", txt:"Kommen Sie bitte mit in den dritten Stock. Das Besprechungszimmer, in dem wir sprechen, liegt am Ende des Flurs.", fr:"Venez avec moi au troisième étage, s'il vous plaît. La salle de réunion dans laquelle nous allons parler se trouve au bout du couloir."},
      {qui:"Herr Lemaire", txt:"Gern. Nach Ihnen.", fr:"Volontiers. Après vous."}
    ]},
    { num:"3", titre:"Das Vorstellungsgespräch", perso:"Frau Berger · Herr Krüger · Herr Lemaire", lignes:[
      {qui:"Frau Berger", txt:"Herr Lemaire, erzählen Sie uns bitte kurz etwas über Ihren bisherigen Werdegang.", fr:"Monsieur Lemaire, racontez-nous brièvement votre parcours jusqu'à présent."},
      {qui:"Herr Lemaire", txt:"Gern. Ich habe Informatik studiert und arbeite seit drei Jahren bei einem mittelständischen Unternehmen, wo ich für die Serverwartung zuständig bin.", fr:"Volontiers. J'ai étudié l'informatique et je travaille depuis trois ans dans une entreprise de taille moyenne, où je suis responsable de la maintenance des serveurs."},
      {qui:"Herr Krüger", txt:"Warum möchten Sie Ihre jetzige Stelle aufgeben?", fr:"Pourquoi souhaitez-vous quitter votre poste actuel ?"},
      {qui:"Herr Lemaire", txt:"Obwohl mir die Arbeit gefällt, sind die Aufgaben sehr eintönig geworden. Ich möchte mich weiterentwickeln und mehr Verantwortung übernehmen.", fr:"Bien que le travail me plaise, les tâches sont devenues très monotones. Je souhaite évoluer et prendre plus de responsabilités."},
      {qui:"Frau Berger", txt:"Bei uns werden die Netzwerke gerade komplett modernisiert. Wären Sie bereit, sich in neue Technologien einzuarbeiten?", fr:"Chez nous, les réseaux sont justement en train d'être entièrement modernisés. Seriez-vous prêt à vous former à de nouvelles technologies ?"},
      {qui:"Herr Lemaire", txt:"Auf jeden Fall. Ich besuche regelmäßig Fortbildungen, um auf dem neuesten Stand zu bleiben.", fr:"Absolument. Je suis régulièrement des formations continues afin de rester à jour."},
      {qui:"Herr Krüger", txt:"Was würden Sie sagen, ist Ihre größte Schwäche?", fr:"Que diriez-vous être votre plus grande faiblesse ?"},
      {qui:"Herr Lemaire", txt:"Früher habe ich zu viel selbst gemacht, statt Aufgaben abzugeben. Inzwischen habe ich gelernt, im Team zu delegieren.", fr:"Autrefois, je faisais trop de choses moi-même au lieu de déléguer des tâches. Entre-temps, j'ai appris à déléguer en équipe."},
      {qui:"Frau Berger", txt:"Haben Sie noch Fragen an uns?", fr:"Avez-vous encore des questions à nous poser ?"},
      {qui:"Herr Lemaire", txt:"Ja: Wie sieht ein typischer Arbeitstag in Ihrer Abteilung aus, und gibt es die Möglichkeit, teilweise im Homeoffice zu arbeiten?", fr:"Oui : à quoi ressemble une journée de travail typique dans votre service, et existe-t-il la possibilité de travailler partiellement en télétravail ?"},
      {qui:"Herr Krüger", txt:"Zwei Tage pro Woche sind möglich, sobald die Probezeit vorbei ist. Wir melden uns bis Ende der Woche bei Ihnen.", fr:"Deux jours par semaine sont possibles, dès que la période d'essai est terminée. Nous vous recontacterons d'ici la fin de la semaine."},
      {qui:"Herr Lemaire", txt:"Herzlichen Dank für das Gespräch. Ich freue mich auf Ihre Rückmeldung.", fr:"Merci beaucoup pour cet entretien. Je me réjouis de votre retour."}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Ces affirmations portent sur les trois dialogues. Indiquez si elles sont vraies ou fausses.", exercices:[
      {type:"vf", q:"Herr Lemaire hat sich vor zwei Wochen bei der Nordtech GmbH beworben.", a:true, exp:"Il le dit lui-même dans le dialogue 1 : « Ich habe mich vor zwei Wochen bei Ihnen beworben. »"},
      {type:"vf", q:"Das Vorstellungsgespräch soll am Dienstag stattfinden.", a:false, exp:"Faux : Frau Berger propose le jeudi 14 mars (Donnerstag, dem 14. März)."},
      {type:"vf", q:"Herr Lemaire soll seine Zeugnisse im Original mitbringen.", a:true, exp:"Frau Berger le demande explicitement : « Bringen Sie bitte Ihre Zeugnisse im Original mit. »"},
      {type:"vf", q:"Wegen der Bauarbeiten empfiehlt Frau Berger, mit dem Auto zu kommen.", a:false, exp:"Faux : elle recommande le métro (mit der U-Bahn), justement à cause des travaux."},
      {type:"vf", q:"Am Empfang muss Herr Lemaire seinen Ausweis zeigen.", a:true, exp:"Frau Schulz demande : « Dürfte ich bitte Ihren Ausweis sehen? »"},
      {type:"vf", q:"Herr Lemaire kommt zu spät zum Termin.", a:false, exp:"Faux : il arrive même un peu en avance (« Sie sind sogar etwas zu früh »)."},
      {type:"vf", q:"Herr Krüger leitet die IT-Abteilung der Firma.", a:true, exp:"Il se présente ainsi : « ich leite die IT-Abteilung »."},
      {type:"vf", q:"Herr Lemaire arbeitet seit fünf Jahren in seiner jetzigen Firma.", a:false, exp:"Faux : il y travaille depuis trois ans (seit drei Jahren)."},
      {type:"vf", q:"Homeoffice ist erst nach der Probezeit möglich.", a:true, exp:"Herr Krüger précise : « sobald die Probezeit vorbei ist »."},
      {type:"vf", q:"Die Firma will sich erst in einem Monat bei Herrn Lemaire melden.", a:false, exp:"Faux : « Wir melden uns bis Ende der Woche bei Ihnen » — d'ici la fin de la semaine."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la réponse correcte d'après les dialogues.", exercices:[
      {type:"qcm", q:"Für welche Stelle bewirbt sich Herr Lemaire?", opts:["Als Buchhalter","Als Netzwerkadministrator","Als Empfangsdame","Als Fahrer"], a:1, exp:"Frau Berger dit : « Sie interessieren sich für die Stelle als Netzwerkadministrator »."},
      {type:"qcm", q:"Wie lange soll das Vorstellungsgespräch ungefähr dauern?", opts:["Zehn Minuten","Eine halbe Stunde","Ungefähr eine Stunde","Den ganzen Tag"], a:2, exp:"« Das Gespräch dauert ungefähr eine Stunde. »"},
      {type:"qcm", q:"Welches Zertifikat besitzt Herr Lemaire?", opts:["Ein A2-Zertifikat","Ein B1-Zertifikat","Ein C1-Zertifikat","Gar keines"], a:1, exp:"Il précise avoir obtenu un certificat B1 en janvier."},
      {type:"qcm", q:"Wo befindet sich die Firma?", opts:["In der Bahnhofstraße 2","In der Hafenstraße 12","Am Marktplatz 5","In der Gartenstraße 12"], a:1, exp:"« Die Firma befindet sich in der Hafenstraße 12. »"},
      {type:"qcm", q:"Was bekommt Herr Lemaire am Empfang?", opts:["Einen Schlüssel","Einen Besucherausweis","Einen Vertrag","Eine Fahrkarte"], a:1, exp:"Frau Schulz imprime un « Besucherausweis » (badge visiteur)."},
      {type:"qcm", q:"Wo liegt die Garderobe?", opts:["Rechts vom Eingang","Links neben dem Aufzug","Im dritten Stock","Hinter dem Wasserspender"], a:1, exp:"« Die Garderobe ist links neben dem Aufzug. »"},
      {type:"qcm", q:"In welchem Stock findet das Gespräch statt?", opts:["Im Erdgeschoss","Im ersten Stock","Im dritten Stock","Im Keller"], a:2, exp:"Herr Krüger invite le candidat au troisième étage (in den dritten Stock)."},
      {type:"qcm", q:"Warum will Herr Lemaire seine Stelle wechseln?", opts:["Weil er zu wenig verdient","Weil die Aufgaben eintönig geworden sind","Weil er umziehen muss","Weil sein Chef unfreundlich ist"], a:1, exp:"« ... sind die Aufgaben sehr eintönig geworden. Ich möchte mich weiterentwickeln. »"},
      {type:"qcm", q:"Welche Schwäche nennt Herr Lemaire?", opts:["Er kommt oft zu spät","Er hat zu viel selbst gemacht, statt zu delegieren","Er spricht kein Englisch","Er arbeitet nicht gern im Team"], a:1, exp:"Il évoque son ancienne difficulté à déléguer (statt Aufgaben abzugeben)."},
      {type:"qcm", q:"Was fragt Herr Lemaire am Ende des Gesprächs?", opts:["Nach dem Gehalt","Nach dem Arbeitstag und dem Homeoffice","Nach dem Urlaub","Nach der Kantine"], a:1, exp:"Il pose deux questions : la journée type et la possibilité de télétravail."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase contient une erreur. Tapez le mot correct d'après les dialogues.", exercices:[
      {type:"input", q:"Herr Lemaire hat sich vor zwei MONATEN beworben. → Korrektes Wort statt MONATEN:", a:["Wochen","wochen"], ph:"un nom", exp:"Il dit « vor zwei Wochen » (il y a deux semaines)."},
      {type:"input", q:"Der Termin ist am FREITAG, dem 14. März. → Korrekter Wochentag:", a:["Donnerstag","donnerstag"], ph:"jour de la semaine", exp:"Le rendez-vous est fixé au jeudi (Donnerstag)."},
      {type:"input", q:"Das Gespräch beginnt um NEUN Uhr. → Korrekte Uhrzeit (Wort):", a:["zehn","Zehn"], ph:"un nombre en lettres", exp:"« um zehn Uhr » — à dix heures."},
      {type:"input", q:"Frau Berger empfiehlt, mit dem BUS zu kommen. → Korrektes Verkehrsmittel:", a:["U-Bahn","der U-Bahn","U-bahn","U Bahn"], ph:"moyen de transport", exp:"Elle recommande « mit der U-Bahn », le métro."},
      {type:"input", q:"Herr Lemaire soll seine Zeugnisse als KOPIE mitbringen. → Korrektes Wort:", a:["Original","im Original","Originale"], ph:"un nom", exp:"« Ihre Zeugnisse im Original » — les originaux."},
      {type:"input", q:"Am Empfang arbeitet Frau BERGER. → Korrekter Name:", a:["Schulz","Frau Schulz"], ph:"un nom propre", exp:"C'est Frau Schulz qui est à l'accueil ; Frau Berger travaille aux ressources humaines."},
      {type:"input", q:"Herr Krüger leitet die VERKAUFSABTEILUNG. → Korrekte Abteilung:", a:["IT-Abteilung","IT Abteilung","die IT-Abteilung"], ph:"un service", exp:"Il dit : « ich leite die IT-Abteilung »."},
      {type:"input", q:"Herr Lemaire arbeitet seit drei MONATEN bei seiner Firma. → Korrektes Wort:", a:["Jahren","jahren","drei Jahren"], ph:"un nom", exp:"« seit drei Jahren » — depuis trois ans."},
      {type:"input", q:"Homeoffice ist DREI Tage pro Woche möglich. → Korrekte Zahl (Wort):", a:["zwei","Zwei"], ph:"un nombre en lettres", exp:"« Zwei Tage pro Woche sind möglich »."},
      {type:"input", q:"Die Firma meldet sich bis Ende des MONATS. → Korrektes Wort:", a:["Woche","der Woche","Ende der Woche"], ph:"un nom", exp:"« bis Ende der Woche » — d'ici la fin de la semaine."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lisez l'article de presse, puis répondez aux questions.\n\nARBEITSMARKT — Fachkräfte dringend gesucht\n(1) In Deutschland fehlen in vielen Branchen qualifizierte Mitarbeiterinnen und Mitarbeiter. (2) Besonders betroffen sind die Pflege, das Handwerk und die Informationstechnologie. (3) Nach Angaben der Handelskammer konnten im vergangenen Jahr über 300.000 Stellen nicht besetzt werden. (4) Viele Betriebe suchen deshalb im Ausland nach Personal. (5) Wegen des demografischen Wandels wird sich die Lage in den nächsten Jahren weiter verschärfen. (6) Immer mehr Unternehmen bieten Bewerbern Sprachkurse an, damit diese sich schneller einleben. (7) Ein Handwerksmeister aus Bremen erklärt: Wir haben zwei Kollegen aus Spanien eingestellt, und es funktioniert hervorragend. (8) Trotzdem klagen Fachleute über die langen Verfahren bei der Anerkennung ausländischer Diplome. (9) Ein Antrag dauert manchmal mehr als sechs Monate. (10) Die Regierung hat angekündigt, die Verfahren zu vereinfachen. (11) Außerdem sollen die Löhne in einigen Branchen erhöht werden. (12) Fachleute betonen jedoch, dass Geld allein nicht reiche. (13) Wichtig seien auch flexible Arbeitszeiten und die Möglichkeit, im Homeoffice zu arbeiten. (14) Wer heute eine Stelle sucht, hat in vielen Regionen die freie Wahl. (15) Die Zeiten, in denen Bewerber lange warten mussten, sind vorbei.", exercices:[
      {type:"qcm", q:"Welche Branchen sind laut Text besonders betroffen?", opts:["Tourismus, Landwirtschaft, Presse","Pflege, Handwerk, Informationstechnologie","Banken, Versicherungen, Handel","Schule, Polizei, Post"], a:1, exp:"Phrase (2) : « die Pflege, das Handwerk und die Informationstechnologie »."},
      {type:"qcm", q:"Wie viele Stellen blieben im vergangenen Jahr unbesetzt?", opts:["Über 30.000","Über 300.000","Genau 3.000","Weniger als 100.000"], a:1, exp:"Phrase (3) : plus de 300 000 postes n'ont pas pu être pourvus."},
      {type:"vf", q:"Wegen des demografischen Wandels wird sich die Lage verbessern.", a:false, exp:"Faux : phrase (5), la situation va encore s'aggraver (sich verschärfen)."},
      {type:"input", q:"Was bieten immer mehr Unternehmen ihren Bewerbern an? (ein Wort)", a:["Sprachkurse","sprachkurse","Sprachkurs"], ph:"un nom pluriel", exp:"Phrase (6) : « bieten Bewerbern Sprachkurse an »."},
      {type:"qcm", q:"Woher kommen die zwei neuen Kollegen des Handwerksmeisters?", opts:["Aus Italien","Aus Spanien","Aus Polen","Aus Portugal"], a:1, exp:"Phrase (7) : « zwei Kollegen aus Spanien »."},
      {type:"vf", q:"Die Anerkennung ausländischer Diplome geht sehr schnell.", a:false, exp:"Faux : phrases (8)-(9), les procédures sont longues, parfois plus de six mois."},
      {type:"input", q:"Wie lange dauert ein Antrag manchmal? (Zahl + Wort, z.B. sechs Monate)", a:["sechs Monate","mehr als sechs Monate","6 Monate"], ph:"durée", exp:"Phrase (9) : « mehr als sechs Monate »."},
      {type:"qcm", q:"Was hat die Regierung angekündigt?", opts:["Die Verfahren zu verlängern","Die Verfahren zu vereinfachen","Die Löhne zu senken","Die Grenzen zu schließen"], a:1, exp:"Phrase (10) : « die Verfahren zu vereinfachen »."},
      {type:"qcm", q:"Was ist laut Fachleuten außer Geld noch wichtig?", opts:["Große Büros","Flexible Arbeitszeiten und Homeoffice","Firmenwagen","Lange Ferien"], a:1, exp:"Phrase (13) : horaires flexibles et télétravail."},
      {type:"vf", q:"Laut Text haben Bewerber heute in vielen Regionen die freie Wahl.", a:true, exp:"Vrai : phrase (14) « hat in vielen Regionen die freie Wahl »."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Lisez cette offre d'emploi, puis répondez.\n\nSTELLENANZEIGE — Nordtech GmbH, Hamburg\nWir suchen zum 1. September eine/n Netzwerkadministrator/in (m/w/d) in Vollzeit (38,5 Stunden/Woche).\nIhre Aufgaben: Betreuung und Modernisierung unserer Netzwerke; Unterstützung der Kolleginnen und Kollegen bei technischen Problemen; Dokumentation der Systeme.\nIhr Profil: abgeschlossene Ausbildung oder Studium im Bereich Informatik; mindestens zwei Jahre Berufserfahrung; sehr gute Deutschkenntnisse (mindestens B1) sowie Grundkenntnisse in Englisch; Führerschein von Vorteil.\nWir bieten: einen unbefristeten Vertrag nach der Probezeit von sechs Monaten; 30 Urlaubstage; zwei Tage Homeoffice pro Woche; regelmäßige Fortbildungen; ein Jobticket für den öffentlichen Nahverkehr.\nBewerbung: Bitte senden Sie Ihre vollständigen Unterlagen (Anschreiben, Lebenslauf, Zeugnisse) bis zum 30. Juni per E-Mail an bewerbung@nordtech.de. Ansprechpartnerin: Frau Berger, Tel. 040/55 12 30.", exercices:[
      {type:"qcm", q:"Ab wann ist die Stelle zu besetzen?", opts:["Ab dem 1. Juni","Ab dem 1. September","Ab dem 30. Juni","Sofort"], a:1, exp:"« Wir suchen zum 1. September »."},
      {type:"input", q:"Wie viele Stunden pro Woche umfasst die Vollzeitstelle? (Zahl)", a:["38,5","38.5","38,5 Stunden"], ph:"nombre", exp:"L'annonce indique 38,5 Stunden/Woche."},
      {type:"vf", q:"Für die Stelle wird mindestens das Niveau B1 in Deutsch verlangt.", a:true, exp:"Vrai : « sehr gute Deutschkenntnisse (mindestens B1) »."},
      {type:"qcm", q:"Wie lange dauert die Probezeit?", opts:["Drei Monate","Sechs Monate","Ein Jahr","Es gibt keine Probezeit"], a:1, exp:"« nach der Probezeit von sechs Monaten »."},
      {type:"input", q:"Wie viele Urlaubstage bietet die Firma? (Zahl)", a:["30","30 Tage","dreißig","dreissig"], ph:"nombre", exp:"L'annonce mentionne 30 Urlaubstage."},
      {type:"vf", q:"Der Führerschein ist zwingend notwendig.", a:false, exp:"Faux : « Führerschein von Vorteil » signifie que c'est un plus, pas une obligation."},
      {type:"qcm", q:"Welche Unterlagen muss man schicken?", opts:["Nur den Lebenslauf","Anschreiben, Lebenslauf und Zeugnisse","Nur die Zeugnisse","Ein Foto und ein Video"], a:1, exp:"« Ihre vollständigen Unterlagen (Anschreiben, Lebenslauf, Zeugnisse) »."},
      {type:"input", q:"Bis wann muss die Bewerbung eingehen? (Datum, z.B. 30. Juni)", a:["30. Juni","30 Juni","bis zum 30. Juni","30.06."], ph:"date", exp:"La date limite est le 30 juin."},
      {type:"qcm", q:"Was bedeutet ein Jobticket?", opts:["Eine Eintrittskarte fürs Kino","Eine Fahrkarte für den öffentlichen Nahverkehr","Ein Gutschein für die Kantine","Ein Parkplatz"], a:1, exp:"Le Jobticket est un titre de transport public financé par l'employeur."},
      {type:"vf", q:"Man kann sich telefonisch bei Herrn Krüger informieren.", a:false, exp:"Faux : l'interlocutrice indiquée est Frau Berger (Tel. 040/55 12 30)."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Trouvez le synonyme du mot ou de l'expression proposé(e).", exercices:[
      {type:"qcm", q:"Synonym für « die Stelle » (im beruflichen Sinn):", opts:["der Arbeitsplatz","die Straße","die Pause","der Urlaub"], a:0, exp:"Die Stelle = der Arbeitsplatz / der Job : le poste, l'emploi."},
      {type:"qcm", q:"Synonym für « sich bewerben um »:", opts:["sich beschweren über","sich interessieren für eine Stelle und sie beantragen","sich verabschieden","sich beeilen"], a:1, exp:"Sich bewerben um = poser sa candidature pour un poste."},

      {type:"qcm", q:"Gegenteil von « pünktlich »:", opts:["unpünktlich","zuverlässig","freundlich","fleißig"], a:0, exp:"Pünktlich ↔ unpünktlich (en retard, pas ponctuel)."},

      {type:"qcm", q:"Gegenteil von « die Stärke »:", opts:["die Schwäche","die Stelle","die Stimme","die Steuer"], a:0, exp:"Die Stärke (le point fort) ↔ die Schwäche (la faiblesse)."},

    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux mots qui ressemblent au français mais ne signifient pas la même chose.", exercices:[
      {type:"qcm", q:"Was bedeutet « der Chef » im Deutschen?", opts:["der Küchenchef ausschließlich","der Vorgesetzte, der Leiter","der Kellner","der Kunde"], a:1, exp:"Attention : der Chef = le patron, le supérieur (et non pas seulement le chef cuisinier, qui est der Küchenchef)."},
      {type:"qcm", q:"Was bedeutet « der Termin »?", opts:["das Ende","der Bahnhof","die Verabredung, der vereinbarte Zeitpunkt","der Vertrag"], a:2, exp:"Der Termin = le rendez-vous / l'échéance, PAS le terme (Ende, Frist)."},
      {type:"vf", q:"« sensibel » bedeutet auf Französisch « sensé, raisonnable ».", a:false, exp:"Faux : sensibel = sensible (émotif). L'anglais sensible se dit vernünftig."},
      {type:"qcm", q:"Was bedeutet « die Konkurrenz »?", opts:["die Zusammenarbeit","der Wettbewerb, die Mitbewerber","das Konzert","die Konferenz"], a:1, exp:"Die Konkurrenz = la concurrence ; ne pas confondre avec die Konferenz (la conférence)."},
      {type:"qcm", q:"Was bedeutet « das Gymnasium »?", opts:["die Sporthalle","eine weiterführende Schule","das Fitnessstudio","die Universität"], a:1, exp:"Piège classique : das Gymnasium = le lycée, pas le gymnase (die Turnhalle)."},
      {type:"vf", q:"« bekommen » bedeutet « devenir ».", a:false, exp:"Faux : bekommen = recevoir, obtenir. Devenir se dit werden."},
      {type:"qcm", q:"Was bedeutet « der Rat » (in: um Rat fragen)?", opts:["die Ratte","der Ratschlag","das Rathaus","der Vertrag"], a:1, exp:"Der Rat = le conseil (Ratschlag). Ne pas confondre avec die Ratte (le rat)."},
      {type:"vf", q:"« eventuell » bedeutet « éventuellement, peut-être ».", a:true, exp:"Vrai en allemand : eventuell = peut-être. Attention : l'anglais eventually signifie schließlich."},
      {type:"qcm", q:"Was bedeutet « die Kaution » bei einer Wohnung?", opts:["die Miete","die Sicherheitsleistung, die man am Anfang zahlt","die Nebenkosten","der Vertrag"], a:1, exp:"Die Kaution = la caution / le dépôt de garantie ; utile lors d'un déménagement professionnel."},
      {type:"qcm", q:"Was bedeutet « brav » bei einem Kind?", opts:["mutig","artig, gehorsam","stark","laut"], a:1, exp:"Piège : brav = sage, obéissant (et non brave/courageux, qui se dit mutig)."}

      {type:"qcm", q:"Satz mit Modalverb im Nebensatz:", opts:["Er sagt, dass er länger arbeiten muss.","Er sagt, dass er muss länger arbeiten.","Er sagt, dass länger arbeiten er muss.","Er sagt, dass er länger muss arbeiten heute."], a:0, exp:"Infinitif + verbe modal conjugué en dernière position."},
      {type:"qcm", q:"Frage im Nebensatz:", opts:["Ich frage mich, ob die Firma sich meldet.","Ich frage mich, ob meldet sich die Firma.","Ich frage mich, ob sich die Firma meldet nicht ob.","Ich frage mich, ob die Firma meldet sich."], a:0, exp:"Ob + sujet + ... + verbe conjugué en fin."}

      {type:"qcm", q:"Passiv mit Modalverb: Man muss den Ausweis tragen. →", opts:["Der Ausweis muss getragen werden.","Der Ausweis muss getragen sein.","Der Ausweis wird tragen müssen.","Der Ausweis muss werden getragen."], a:0, exp:"Modal + participe II + werden à l'infinitif."},
      {type:"input", q:"Höflichkeit (Konjunktiv II): Ich ______ gern einen Termin. (haben)", a:["hätte","haette"], ph:"verbe", exp:"Ich hätte gern : formule de politesse au Konjunktiv II."},
      {type:"qcm", q:"Irrealer Wunsch: Wenn ich mehr Zeit ______, ______ ich einen Kurs besuchen.", opts:["hätte / würde","habe / werde","hatte / wurde","hätte / werde"], a:0, exp:"Irréel du présent : hätte + würde + infinitif."},
      {type:"input", q:"Infinitivsatz: Ich besuche Fortbildungen. Ich will aktuell bleiben. → Ich besuche Fortbildungen, ______ aktuell zu bleiben. (Zweck)", a:["um"], ph:"conjonction", exp:"Um ... zu + infinitif exprime le but (sujet identique)."},
      {type:"qcm", q:"Er ging, ohne sich zu verabschieden. Was bedeutet das?", opts:["Il est parti sans dire au revoir.","Il est parti pour dire au revoir.","Il est parti au lieu de partir.","Il est parti après avoir dit au revoir."], a:0, exp:"Ohne ... zu + infinitif = sans faire quelque chose."},
      {type:"input", q:"Er machte alles selbst, ______ Aufgaben abzugeben. (au lieu de)", a:["statt","anstatt"], ph:"conjonction", exp:"Statt / anstatt ... zu + infinitif = au lieu de."},
      {type:"qcm", q:"Indirekte Rede (Konjunktiv I): Er sagte: Ich bin sehr motiviert. →", opts:["Er sagte, er sei sehr motiviert.","Er sagte, er ist sehr motiviert sei.","Er sagte, er wäre gewesen motiviert.","Er sagte, dass er sei motiviert war."], a:0, exp:"Discours indirect soutenu : Konjunktiv I de sein = sei."}
