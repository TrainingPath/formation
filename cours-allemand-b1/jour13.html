<script>
var DAY = {
  num: 13,
  title: "L'entretien d'embauche : questions clés",
  subtitle: "Comprendre et répondre aux questions du Vorstellungsgespräch.",
  theory: `
<h3>1. Le Vorstellungsgespräch</h3>
<p>Le <strong>Vorstellungsgespräch</strong> est l'entretien d'embauche. L'employeur cherche à connaître ton parcours, ta motivation et ta personnalité. Voici une <strong>banque de questions</strong> fréquentes et des réponses modèles à apprendre.</p>
<h3>2. Questions sur toi et ton parcours</h3>
<pre class="pseudo">Erzählen Sie etwas über sich.      Parlez-nous un peu de vous.
-> Ich heiße... Ich bin... Jahre alt und arbeite als...
   Je m'appelle... J'ai... ans et je travaille comme...

Welche Ausbildung haben Sie?       Quelle est votre formation ?
-> Ich habe ... studiert / eine Ausbildung als ... gemacht.

Welche Berufserfahrung haben Sie?  Quelle expérience avez-vous ?
-> Ich habe drei Jahre bei ... gearbeitet.
   J'ai travaillé trois ans chez...</pre>
<h3>3. Questions sur la motivation</h3>
<pre class="pseudo">Warum bewerben Sie sich bei uns?   Pourquoi postulez-vous chez nous ?
-> Ihre Firma ist bekannt für... und ich möchte...
   Votre entreprise est connue pour... et je souhaite...

Warum sind Sie der/die Richtige?   Pourquoi êtes-vous la bonne personne ?
-> Ich bin motiviert, zuverlässig und lerne schnell.

Was sind Ihre Stärken?             Quelles sont vos forces ?
-> Ich bin teamfähig und arbeite sehr genau.
   J'ai l'esprit d'équipe et je travaille avec précision.

Was sind Ihre Schwächen?           Quelles sont vos faiblesses ?
-> Manchmal bin ich zu ungeduldig, aber ich arbeite daran.
   Parfois je suis trop impatient, mais j'y travaille.</pre>
<div class="tip">Pour les faiblesses (Schwächen), choisis un défaut « raisonnable » et ajoute toujours que tu progresses : « ... aber ich arbeite daran » (mais j'y travaille).</div>
<h3>4. Questions pratiques</h3>
<pre class="pseudo">Wann können Sie anfangen?          Quand pouvez-vous commencer ?
-> Ich kann ab dem ersten März anfangen.
   Je peux commencer à partir du 1er mars.

Welche Gehaltsvorstellung haben Sie?  Quelle est votre prétention salariale ?
-> Ich stelle mir etwa ... Euro brutto vor.
   J'imagine environ ... euros bruts.

Haben Sie noch Fragen?             Avez-vous encore des questions ?
-> Ja, wie sieht ein typischer Arbeitstag aus?
   Oui, à quoi ressemble une journée de travail type ?</pre>
<div class="warn">Ne réponds jamais « Ich habe keine Fragen » (je n'ai pas de questions) : cela paraît désintéressé. Prépare toujours une ou deux questions sur l'équipe, les missions ou les horaires.</div>
<h3>5. Formules utiles et politesse</h3>
<pre class="pseudo">Vielen Dank für die Einladung.     Merci pour l'invitation.
Ich interessiere mich sehr für diese Stelle.
                                   Ce poste m'intéresse beaucoup.
Ich freue mich auf die Zusammenarbeit.
                                   Je me réjouis de collaborer.
Ich bin flexibel und belastbar.    Je suis flexible et résistant au stress.</pre>
<div class="tip">Utilise le Konjunktiv II de politesse (jour 6) : « Ich würde gern... », « Könnten Sie mir sagen...? ». Cela fait très bonne impression.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « Vorstellungsgespräch » ?", opts: ["le contrat", "l'entretien d'embauche", "le salaire", "le CV"], a: 1, exp: "das Vorstellungsgespräch = l'entretien d'embauche." },
    { type: "qcm", q: "« Erzählen Sie etwas über sich » demande…", opts: ["votre salaire", "de parler un peu de vous", "vos vacances", "votre adresse"], a: 1, exp: "= Parlez-nous un peu de vous." },
    { type: "input", q: "Réponds : « Ich ___ als Ingenieur. » (je travaille comme)", a: ["arbeite"], ph: "verbe", exp: "arbeiten als : Ich arbeite als Ingenieur." },
    { type: "qcm", q: "« Warum bewerben Sie sich bei uns? » signifie…", opts: ["Quand commencez-vous ?", "Pourquoi postulez-vous chez nous ?", "Quelles études ?", "Où habitez-vous ?"], a: 1, exp: "= Pourquoi postulez-vous chez nous ? (motivation)." },
    { type: "qcm", q: "« Was sind Ihre Stärken? » demande…", opts: ["vos faiblesses", "vos forces / points forts", "votre salaire", "vos horaires"], a: 1, exp: "die Stärken = les forces ; die Schwächen = les faiblesses." },
    { type: "input", q: "Réponds sur tes forces : « Ich bin ___ und zuverlässig. » (esprit d'équipe)", a: ["teamfaehig","teamfähig"], ph: "adjectif", exp: "teamfähig = capable de travailler en équipe." },
    { type: "vf", q: "Pour parler d'une faiblesse, il vaut mieux ajouter « aber ich arbeite daran ».", a: true, exp: "Vrai : on montre qu'on progresse (mais j'y travaille)." },
    { type: "qcm", q: "« Wann können Sie anfangen? » demande…", opts: ["combien vous gagnez", "quand vous pouvez commencer", "où vous habitez", "quelle formation"], a: 1, exp: "anfangen = commencer : quand pouvez-vous commencer ?" },
    { type: "input", q: "Réponds : « Ich kann ___ dem ersten März anfangen. » (à partir de)", a: ["ab"], ph: "préposition", exp: "ab + datif : ab dem ersten März = à partir du 1er mars." },
    { type: "qcm", q: "« Welche Gehaltsvorstellung haben Sie? » porte sur…", opts: ["vos loisirs", "votre prétention salariale", "vos diplômes", "votre équipe"], a: 1, exp: "die Gehaltsvorstellung = la prétention salariale." },
    { type: "vf", q: "À la question « Haben Sie noch Fragen? », il vaut mieux répondre « Nein, keine ».", a: false, exp: "Faux : cela paraît désintéressé. Prépare toujours une ou deux questions." },
    { type: "input", q: "Formule polie : « ___ Sie mir mehr über das Team sagen? » (können au Konj. II)", a: ["Koennten","Könnten","koennten","könnten"], ph: "können au Konj. II", exp: "Könnten Sie...? = Pourriez-vous...? (politesse)." },
    { type: "qcm", q: "Que signifie « belastbar » ?", opts: ["paresseux", "résistant au stress", "en retard", "timide"], a: 1, exp: "belastbar = résistant à la pression / au stress." },
    { type: "qcm", q: "Comment remercier de l'invitation à l'entretien ?", opts: ["Vielen Dank für die Einladung.", "Auf Wiedersehen.", "Ich habe Hunger.", "Wie geht es?"], a: 0, exp: "Vielen Dank für die Einladung = merci pour l'invitation." },
    { type: "qcm", q: "Compréhension : « Ich freue mich auf die Zusammenarbeit » exprime…", opts: ["un refus", "l'envie de collaborer", "une plainte", "une question de salaire"], a: 1, exp: "= je me réjouis de la collaboration (formule positive de clôture)." }
  ],
  final: {
    title: "Exercice final — Das Gespräch mit Herrn Meier",
    intro: `<p>Lis cet extrait d'entretien, puis réponds.</p>
<pre class="pseudo">Chef: Guten Tag, Frau Klein. Erzaehlen Sie etwas ueber sich.
Klein: Gern. Ich heisse Anna Klein, bin 30 Jahre alt und arbeite seit
       fuenf Jahren als Buchhalterin.
Chef: Warum bewerben Sie sich bei uns?
Klein: Ihre Firma ist bekannt fuer gute Arbeitsbedingungen. Ich moechte
       neue Herausforderungen und mehr Verantwortung.
Chef: Was sind Ihre Staerken?
Klein: Ich bin sehr genau, zuverlaessig und teamfaehig.
Chef: Wann koennten Sie anfangen?
Klein: Ich koennte ab dem ersten April anfangen.
Chef: Haben Sie noch Fragen?
Klein: Ja, wie gross ist das Team, mit dem ich arbeiten wuerde?</pre>
<p>(die Buchhalterin = la comptable · die Herausforderung = le défi · die Verantwortung = la responsabilité)</p>`,
    questions: [
      { type: "qcm", q: "Quel métier exerce Anna Klein ?", opts: ["ingénieure", "comptable (Buchhalterin)", "vendeuse", "professeure"], a: 1, exp: "« ich ... arbeite seit fünf Jahren als Buchhalterin »." },
      { type: "qcm", q: "Pourquoi postule-t-elle ?", opts: ["pour gagner moins", "pour de nouveaux défis et plus de responsabilité", "pour rester à la maison", "sans raison"], a: 1, exp: "« Ich möchte neue Herausforderungen und mehr Verantwortung »." },
      { type: "input", q: "Complète sa réponse : « Ich bin sehr genau, ___ und teamfähig. » (fiable)", a: ["zuverlaessig","zuverlässig"], ph: "adjectif", exp: "zuverlässig = fiable." },
      { type: "input", q: "Complète : « Ich könnte ___ dem ersten April anfangen. » (à partir de)", a: ["ab"], ph: "préposition", exp: "ab dem ersten April = à partir du 1er avril." },
      { type: "vf", q: "À la fin, Anna pose une question sur la taille de l'équipe.", a: true, exp: "« wie groß ist das Team, mit dem ich arbeiten würde? » (bonne pratique)." }
    ],
    solution: `<p>L'entretien suit un ordre classique : présentation (<strong>Erzählen Sie etwas über sich</strong>), motivation (<strong>Warum bewerben Sie sich bei uns?</strong>), forces (<strong>Was sind Ihre Stärken?</strong>), disponibilité (<strong>Wann könnten Sie anfangen?</strong>), et questions du candidat (<strong>Haben Sie noch Fragen?</strong>).</p>
<p>Anna réutilise le vocabulaire clé : <strong>als Buchhalterin, seit fünf Jahren, genau, zuverlässig, teamfähig, ab dem ersten April</strong>, et le Konjunktiv II de politesse (<strong>könnte, würde</strong>). Elle termine par une question : c'est exactement ce qu'attend un recruteur.</p>`
  }
};
</script>
