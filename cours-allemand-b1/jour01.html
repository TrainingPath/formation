<script>
var DAY = {
  num: 1,
  title: "Le génitif (Genitiv)",
  subtitle: "Exprimer l'appartenance : « la voiture de mon père », « le titre du livre ».",
  theory: `
<h3>1. À quoi sert le génitif ?</h3>
<p>Le génitif est le 4e cas allemand (après le nominatif, l'accusatif et le datif). Il exprime surtout l'<strong>appartenance</strong> et le lien « <strong>de</strong> » entre deux noms. Il répond à la question <strong>wessen?</strong> (« de qui ? à qui ? »).</p>
<pre class="pseudo">das Auto meines Vaters        la voiture de mon père
der Titel des Buches          le titre du livre
die Farbe der Blume           la couleur de la fleur
die Namen der Kinder          les noms des enfants</pre>
<div class="tip">Ordre typique : le nom « possédé » vient d'abord, puis le nom « possesseur » au génitif. En français on dit « la voiture DE mon père » ; en allemand le complément se met simplement au génitif, sans préposition.</div>
<h3>2. Les articles au génitif</h3>
<p>C'est le tableau à mémoriser. Attention : au masculin et au neutre, l'article devient <strong>des</strong> ET le nom prend une terminaison <strong>-s</strong> ou <strong>-es</strong>.</p>
<pre class="pseudo">Genre        défini      indéfini      possessif (mein)
masculin     des         eines         meines      + nom -(e)s
neutre       des         eines         meines      + nom -(e)s
féminin      der         einer         meiner      (nom inchangé)
pluriel      der         ---           meiner      (nom inchangé)</pre>
<pre class="pseudo">der Mann  -> des Mannes       das Kind -> des Kindes
die Frau  -> der Frau          die Autos -> der Autos</pre>
<h3>3. La terminaison -s ou -es du nom masculin/neutre</h3>
<p>Seuls les noms masculins et neutres reçoivent une terminaison au génitif :</p>
<pre class="pseudo">-es : mots courts d'une syllabe, ou finissant par -s, -ss, -z, -x
      des Mannes, des Kindes, des Hauses, des Platzes
-s  : mots plus longs et la plupart des autres
      des Lehrers, des Computers, des Autos</pre>
<div class="warn">Le féminin et le pluriel ne prennent JAMAIS de -s au génitif. On ne change QUE l'article : die Frau devient der Frau, die Kinder devient der Kinder.</div>
<h3>4. Les noms propres</h3>
<p>Avec un prénom ou un nom de personne, on ajoute simplement un <strong>-s</strong> (sans apostrophe !) et on le place devant le nom possédé :</p>
<pre class="pseudo">Annas Buch          le livre d'Anna
Peters Auto         la voiture de Peter
Deutschlands Hauptstadt   la capitale de l'Allemagne</pre>
<h3>5. Le génitif recule à l'oral</h3>
<p>Dans la langue parlée, on remplace souvent le génitif par <strong>von + datif</strong>. C'est plus familier mais très courant.</p>
<pre class="pseudo">écrit / soutenu : das Haus meiner Eltern
oral / familier : das Haus von meinen Eltern
                  (la maison de mes parents)</pre>
<div class="tip">Pour l'examen B1, sache reconnaître et former le génitif « propre » (des/der + terminaison), mais n'aie pas peur d'utiliser von + datif quand tu parles.</div>`,
  exercises: [
    { type: "qcm", q: "À quelle question répond le génitif ?", opts: ["wer? (qui ?)", "wessen? (de qui ?)", "wann? (quand ?)", "wo? (où ?)"], a: 1, exp: "Le génitif exprime l'appartenance : wessen Auto? = la voiture de qui ?" },
    { type: "qcm", q: "Article défini masculin au génitif :", opts: ["der", "dem", "des", "den"], a: 2, exp: "Masculin et neutre : des (+ nom en -(e)s)." },
    { type: "input", q: "Complète : « das Auto ___ Vaters » (article défini masculin, de mon père -> du père)", a: ["des"], ph: "article génitif", exp: "der Vater -> des Vaters (masculin : des + -s)." },
    { type: "input", q: "Complète : « der Titel des ___ » (das Buch au génitif)", a: ["Buches","buches"], ph: "nom au génitif", exp: "das Buch -> des Buches (neutre, mot court : -es)." },
    { type: "qcm", q: "Article défini féminin au génitif :", opts: ["die", "der", "des", "dem"], a: 1, exp: "Féminin : der (et le nom ne change pas). die Frau -> der Frau." },
    { type: "input", q: "Complète : « die Farbe ___ Blume » (die Blume, féminin)", a: ["der"], ph: "article génitif", exp: "Féminin : der Blume (article der, nom inchangé)." },
    { type: "vf", q: "Au génitif, les noms féminins prennent aussi une terminaison -s.", a: false, exp: "Faux : seuls le masculin et le neutre prennent -(e)s. Le féminin ne change que l'article." },
    { type: "input", q: "Complète : « des ___ » (der Mann au génitif, mot d'une syllabe)", a: ["Mannes","mannes"], ph: "nom au génitif", exp: "der Mann -> des Mannes (une syllabe : -es)." },
    { type: "qcm", q: "Quel nom prend la terminaison -es ?", opts: ["der Lehrer (long)", "das Kind (court)", "der Computer", "das Auto"], a: 1, exp: "Les mots courts ou en -s/-ss/-z/-x prennent -es : des Kindes." },
    { type: "input", q: "Traduis « le livre d'Anna » avec un nom propre : « ___ Buch »", a: ["Annas"], ph: "nom propre + s", exp: "Nom propre : on ajoute -s sans apostrophe : Annas Buch." },
    { type: "qcm", q: "Comment forme-t-on le génitif d'un nom propre ?", opts: ["nom + apostrophe + s", "des + nom", "nom + s (sans apostrophe)", "von + nom"], a: 2, exp: "Peters Auto, Annas Buch : juste -s, pas d'apostrophe comme en anglais." },
    { type: "qcm", q: "À l'oral, par quoi remplace-t-on souvent le génitif ?", opts: ["par le datif seul", "par von + datif", "par mit + accusatif", "par l'accusatif"], a: 1, exp: "Oral familier : das Haus von meinen Eltern au lieu de meiner Eltern." },
    { type: "vf", q: "« das Haus von meinen Eltern » est une tournure orale correcte pour « la maison de mes parents ».", a: true, exp: "Vrai : von + datif remplace le génitif à l'oral." },
    { type: "input", q: "Complète : « die Namen ___ Kinder » (pluriel : les noms des enfants)", a: ["der"], ph: "article génitif pluriel", exp: "Pluriel : der (article), Kinder inchangé -> der Kinder." },
    { type: "qcm", q: "Compréhension : « das Auto meines Vaters » signifie…", opts: ["la voiture pour mon père", "la voiture de mon père", "mon père en voiture", "la voiture avec mon père"], a: 1, exp: "meines Vaters = de mon père (génitif possessif)." }
  ],
  final: {
    title: "Exercice final — Die Familie von Lukas",
    intro: `<p>Lis ce court texte puis réponds.</p>
<pre class="pseudo">Das ist das Haus meiner Familie. Der Garten des Hauses ist sehr groess.
Das Auto meines Vaters steht vor der Tuer. Der Hund meiner Schwester
schlaeft im Garten. Die Farbe der Blumen ist rot und gelb.
Der Name unseres Hundes ist Rex. Am Wochenende besuchen wir die Eltern
meiner Mutter. Das ist die Lieblingszeit der ganzen Familie.</pre>
<p>(der Garten = le jardin · schlaeft = dort · die Lieblingszeit = le moment préféré · ganz = entier)</p>`,
    questions: [
      { type: "qcm", q: "À qui appartient la maison ?", opts: ["au père", "à la famille (meiner Familie)", "à la soeur", "au chien"], a: 1, exp: "« das Haus meiner Familie » = la maison de ma famille." },
      { type: "input", q: "Complète d'après le texte : « Das Auto ___ Vaters steht vor der Tür. »", a: ["meines"], ph: "possessif génitif masc.", exp: "mein Vater -> meines Vaters (masculin : meines + -s)." },
      { type: "qcm", q: "Le chien de qui dort dans le jardin ?", opts: ["du père", "de la mère", "de ma soeur (meiner Schwester)", "des voisins"], a: 2, exp: "« Der Hund meiner Schwester » = le chien de ma soeur." },
      { type: "vf", q: "Le nom du chien est Rex.", a: true, exp: "« Der Name unseres Hundes ist Rex. »" },
      { type: "input", q: "Complète : « die Eltern ___ Mutter » (les parents de ma mère, féminin)", a: ["meiner"], ph: "possessif génitif fém.", exp: "meine Mutter -> meiner Mutter (féminin : meiner, nom inchangé)." }
    ],
    solution: `<p>Le texte décrit la maison de la famille de Lukas. On y trouve plusieurs génitifs : <strong>meiner Familie</strong> (fém. : article/possessif en -er), <strong>des Hauses</strong> et <strong>meines Vaters</strong> et <strong>unseres Hundes</strong> (masc./neutre : -es + nom en -es/-s), <strong>meiner Schwester</strong> et <strong>meiner Mutter</strong> (fém. : -er), <strong>der Blumen</strong> et <strong>der ganzen Familie</strong> (pluriel/fém. : der).</p>
<p>Retiens la logique : masculin/neutre -> <strong>des/eines/meines + nom -(e)s</strong> ; féminin/pluriel -> <strong>der/einer/meiner</strong>, nom inchangé.</p>`
  }
};
</script>
