  title: "Compréhension : un article de presse",
  subtitle: "Lire un texte journalistique authentique et repérer l'essentiel.",
  theory: `
<h3>1. Méthode : lire un article efficacement</h3>
<p>Au niveau B1, on ne lit pas un article mot à mot. On procède par étapes :</p>
<pre class="pseudo">1. Titre (die Überschrift)   → deviner le sujet
2. Première phrase           → l'idée principale (souvent tout est là)
3. Lecture globale           → comprendre le sens général
4. Lecture ciblée            → chercher une information précise (un chiffre, un nom)</pre>
<div class="tip">Ne bloque pas sur chaque mot inconnu. Devine par le contexte et les mots transparents (internationaux) : <em>Klima, Energie, Kilometer, Prozent, Auto, Ticket</em>. Tu comprendras 80% du sens sans dictionnaire.</p></div>
<h3>2. Le vocabulaire de la presse</h3>
<pre class="pseudo">die Überschrift    le titre         die Schlagzeile   le gros titre
der Bericht        le reportage     die Studie        l'étude
laut / nach        selon            die Umfrage       le sondage
steigen            augmenter        sinken            baisser
die Regierung      le gouvernement  der Bürger        le citoyen
ankündigen         annoncer         fordern           réclamer</pre>
<h3>3. Comprendre les chiffres et statistiques</h3>
<pre class="pseudo">um 20 Prozent steigen     augmenter de 20 pour cent
rund / etwa 5000          environ 5000
mehr als / weniger als    plus de / moins de
im Vergleich zu           par rapport à
die Mehrheit              la majorité</pre>
<h3>4. L'article à lire</h3>
<p>Lis lentement cet article authentique (adapté). Le lexique difficile est traduit dessous.</p>
<pre class="pseudo">Immer mehr Menschen fahren mit dem Fahrrad zur Arbeit

Berlin. Laut einer neuen Studie fahren immer mehr Deutsche mit dem
Fahrrad zur Arbeit. Im Vergleich zum letzten Jahr ist die Zahl um
15 Prozent gestiegen. Besonders in den großen Städten wie Berlin,
Hamburg und München nutzen viele Bürger das Rad.

Die Gründe sind unterschiedlich. Viele Menschen wollen Geld sparen,
denn die Preise für Benzin und Tickets steigen. Andere möchten etwas
für ihre Gesundheit tun oder das Klima schützen. Eine Umfrage zeigt,
dass rund 60 Prozent der Radfahrer sich fitter fühlen.

Die Regierung will das Radfahren weiter fördern. Sie kündigte an,
in den nächsten Jahren mehr Radwege zu bauen. Kritiker fordern
allerdings, dass die Städte auch sicherer werden. Denn die Zahl der
Unfälle mit Fahrrädern ist ebenfalls leicht gestiegen.</pre>
<pre class="pseudo">der Grund = la raison   ·   sparen = économiser   ·   das Benzin = l'essence
schützen = protéger     ·   fördern = encourager   ·   der Radweg = la piste cyclable
der Unfall = l'accident ·   ebenfalls = également   ·   allerdings = cependant</pre>
<div class="warn">Attention aux mots-outils qui changent le sens : <em>allerdings</em> (cependant), <em>ebenfalls</em> (également), <em>im Vergleich zu</em> (par rapport à). Ils nuancent l'information : ne les saute pas.</p></div>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet principal de l'article ?", opts: ["Le prix de l'essence", "De plus en plus de gens vont au travail à vélo", "Les accidents de voiture", "Le climat en Bavière"], a: 1, exp: "Titre : « Immer mehr Menschen fahren mit dem Fahrrad zur Arbeit »." },
    { type: "input", q: "De combien de pour cent le nombre a-t-il augmenté par rapport à l'an dernier ? (chiffre)", a: ["15","15 Prozent","15%"], ph: "nombre", exp: "« ist die Zahl um 15 Prozent gestiegen »." },
    { type: "qcm", q: "Dans quelles villes le vélo est-il particulièrement utilisé ?", opts: ["Les petits villages", "Les grandes villes comme Berlin, Hambourg et Munich", "À la campagne", "En Autriche"], a: 1, exp: "« Besonders in den großen Städten wie Berlin, Hamburg und München »." },

    { type: "vf", q: "Selon l'article, le nombre d'accidents de vélo a aussi légèrement augmenté.", a: true, exp: "« die Zahl der Unfälle mit Fahrrädern ist ebenfalls leicht gestiegen »." },
    { type: "qcm", q: "« Laut einer neuen Studie » signifie…", opts: ["Contre une étude", "Selon une nouvelle étude", "Sans étude", "Avant l'étude"], a: 1, exp: "laut = selon ; « selon une nouvelle étude »." },
    { type: "qcm", q: "Le mot « steigen » veut dire…", opts: ["baisser", "augmenter / monter", "rester stable", "disparaître"], a: 1, exp: "steigen = augmenter, monter ; sinken = baisser." },
    { type: "input", q: "Complète : « Sie kündigte ___, mehr Radwege zu bauen. » (annoncer, séparable : préfixe à la fin)", a: ["an"], ph: "préfixe", exp: "ankündigen : sie kündigte ... an = elle a annoncé." },
    { type: "qcm", q: "« allerdings » dans le texte introduit…", opts: ["un accord total", "une nuance / une objection (cependant)", "un exemple", "une date"], a: 1, exp: "allerdings = cependant : il nuance l'information précédente." },
    { type: "qcm", q: "Comment lire efficacement un article au niveau B1 ?", opts: ["Traduire chaque mot", "Titre + 1re phrase + lecture globale, puis chercher l'info précise", "Lire seulement la fin", "Chercher tous les mots dans le dictionnaire"], a: 1, exp: "Méthode par étapes : deviner par le contexte, ne pas bloquer sur chaque mot." }
  ],
  final: {
    title: "Exercice final — Ein zweiter Artikel",
    intro: `<p>Applique la méthode à ce nouvel article, puis réponds aux questions.</p>
<pre class="pseudo">Deutsche lesen wieder mehr Bücher

Frankfurt. Eine aktuelle Umfrage zeigt ein überraschendes Ergebnis:
Die Deutschen lesen wieder mehr Bücher. Im letzten Jahr ist die Zahl
der verkauften Bücher um acht Prozent gestiegen. Besonders junge
Menschen zwischen 18 und 30 Jahren greifen häufiger zum Buch.

Viele Leser sagen, dass sie eine Pause vom Bildschirm brauchen.
Nach einem langen Tag am Computer möchten sie sich entspannen.
Gedruckte Bücher sind dabei beliebter als E-Books. Laut der Studie
kaufen rund 70 Prozent lieber ein Buch aus Papier.

Die Buchhändler freuen sich über diese Entwicklung. Trotzdem bleibt
ein Problem: In kleinen Städten schließen weiter viele Buchläden,
weil die Mieten zu hoch sind.</pre>
<p>(das Ergebnis = le résultat · verkaufen = vendre · greifen zu = se saisir de · der Bildschirm = l'écran · sich entspannen = se détendre · gedruckt = imprimé · die Entwicklung = l'évolution · die Miete = le loyer)</p>`,
    questions: [
      { type: "qcm", q: "Quelle est l'information principale de l'article ?", opts: ["Les Allemands lisent moins", "Les Allemands lisent de nouveau plus de livres", "Les librairies ferment toutes", "Les e-books gagnent du terrain"], a: 1, exp: "Titre : « Deutsche lesen wieder mehr Bücher »." },
      { type: "input", q: "De combien de pour cent les ventes de livres ont-elles augmenté ? (chiffre)", a: ["8","acht","8 Prozent","8%"], ph: "nombre", exp: "« um acht Prozent gestiegen »." },
      { type: "qcm", q: "Quel groupe lit particulièrement plus ?", opts: ["Les retraités", "Les jeunes de 18 à 30 ans", "Les enfants", "Les enseignants"], a: 1, exp: "« Besonders junge Menschen zwischen 18 und 30 Jahren »." },
      { type: "vf", q: "Selon l'étude, environ 70 % préfèrent un livre en papier plutôt qu'un e-book.", a: true, exp: "« kaufen rund 70 Prozent lieber ein Buch aus Papier »." },
      { type: "qcm", q: "Quel problème demeure malgré cette bonne nouvelle ?", opts: ["Les livres sont trop chers", "Des librairies ferment dans les petites villes à cause des loyers trop élevés", "Il n'y a plus d'auteurs", "Les gens ne savent plus lire"], a: 1, exp: "« schließen weiter viele Buchläden, weil die Mieten zu hoch sind »." }
    ],
    solution: `<p>L'idée principale est dans le titre et la première phrase : les Allemands lisent de nouveau davantage (<em>wieder mehr</em>). Les ventes ont augmenté de <strong>8 %</strong> ; ce sont surtout les <strong>jeunes de 18 à 30 ans</strong> qui lisent plus. Ils veulent une pause loin de l'écran (<em>eine Pause vom Bildschirm</em>) et préfèrent le papier (70 %) aux e-books. La nuance finale, introduite par <strong>trotzdem</strong>, signale un problème : des librairies ferment dans les petites villes à cause des loyers (<em>weil die Mieten zu hoch sind</em>).</p>
<p>Tu as appliqué la méthode : titre → 1re phrase → chiffres ciblés → nuance finale (trotzdem, weil). C'est exactement ce qu'attend l'examen de compréhension B1.</p>`
  }
