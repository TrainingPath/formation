<script>
var DAY = {
  num: 4,
  title: "Le passif au passé et avec modaux",
  subtitle: "« La maison A ÉTÉ construite », « la maison DOIT ÊTRE construite ».",
  theory: `
<h3>1. Rappel : le passif présent</h3>
<p>Passif présent = <strong>werden</strong> (conjugué) + participe passé. « Das Haus wird gebaut » = La maison est construite. Aujourd'hui, on met ce passif au passé et on le combine aux modaux.</p>
<h3>2. Passif au prétérit (Präteritum)</h3>
<p>C'est le passé le plus courant du passif. On conjugue simplement werden au prétérit : <strong>wurde</strong>.</p>
<pre class="pseudo">ich wurde   wir wurden
du wurdest  ihr wurdet
er/sie wurde sie/Sie wurden

Das Haus wurde 1990 gebaut.       La maison a été / fut construite en 1990.
Die Briefe wurden geschrieben.    Les lettres furent écrites.</pre>
<div class="tip">wurde = « était/fut construit ». C'est la forme reine du passif passé, surtout à l'écrit et dans les récits.</div>
<h3>3. Passif au Perfekt</h3>
<p>Plus rare, mais utile à l'oral. Formule : <strong>sein</strong> (conjugué) + participe passé + <strong>worden</strong>. Attention : au passif, le participe de werden n'est pas « geworden » mais <strong>worden</strong> (sans ge-).</p>
<pre class="pseudo">Das Haus ist gebaut worden.       La maison a été construite.
Die Tests sind korrigiert worden. Les tests ont été corrigés.</pre>
<div class="warn">Ne dis jamais « ist gebaut geworden ». Au passif, le participe de werden se réduit à WORDEN, toujours en dernier.</div>
<h3>4. Passif avec un verbe de modalité</h3>
<p>Formule : <strong>modal conjugué</strong> + participe passé + <strong>werden</strong> (à l'infinitif, en dernier).</p>
<pre class="pseudo">Das Haus muss gebaut werden.        La maison doit être construite.
Die Arbeit kann heute gemacht werden. Le travail peut être fait aujourd'hui.
Das Auto sollte repariert werden.   La voiture devrait être réparée.</pre>
<pre class="pseudo">Ordre : [modal] ... [participe passé] [werden]
        muss   ...  gebaut            werden</pre>
<h3>5. Tableau récapitulatif</h3>
<pre class="pseudo">Temps / cadre      Formule                         Exemple
Présent            werden + Part.II                wird gebaut
Prétérit           wurde + Part.II                 wurde gebaut
Perfekt            ist ... Part.II + worden         ist gebaut worden
Avec modal         modal + Part.II + werden         muss gebaut werden</pre>
<div class="tip">Astuce mémoire : dans TOUS ces cas, le participe passé de l'action ne bouge pas (gebaut). Ce qui change, c'est ce qui l'entoure : wird / wurde / ist...worden / muss...werden.</div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on le passif au prétérit ?", opts: ["wird + participe", "wurde + participe passé", "ist + participe", "hatte + participe"], a: 1, exp: "Prétérit du passif = werden au prétérit (wurde) + participe passé." },
    { type: "input", q: "Complète : « Das Haus ___ 1990 gebaut. » (passif prétérit, 3e sing.)", a: ["wurde"], ph: "werden au prétérit", exp: "er/es wurde : Das Haus wurde gebaut." },
    { type: "input", q: "Complète au pluriel : « Die Briefe ___ geschrieben. » (passif prétérit)", a: ["wurden"], ph: "werden au prétérit", exp: "Pluriel : Die Briefe wurden geschrieben." },
    { type: "qcm", q: "Passif au Perfekt : quelle est la fin correcte ?", opts: ["... gebaut geworden", "... gebaut worden", "... gebaut werden", "... gebaut sein"], a: 1, exp: "Au passif Perfekt, le participe de werden est worden (sans ge-)." },
    { type: "input", q: "Complète : « Das Haus ist gebaut ___. » (participe de werden au passif)", a: ["worden"], ph: "participe de werden", exp: "ist gebaut worden = a été construite. Jamais geworden au passif." },
    { type: "vf", q: "Au passif Perfekt, on dit « ist gebaut geworden ».", a: false, exp: "Faux : c'est « ist gebaut worden » (worden, sans ge-)." },
    { type: "qcm", q: "Passif avec modal : quel verbe se met en dernier, à l'infinitif ?", opts: ["sein", "haben", "werden", "le modal"], a: 2, exp: "muss gebaut werden : werden à l'infinitif, tout à la fin." },
    { type: "input", q: "Complète : « Das Haus muss gebaut ___. » (passif avec modal)", a: ["werden"], ph: "infinitif final", exp: "modal + participe + werden : muss gebaut werden." },
    { type: "qcm", q: "« Die Arbeit kann heute gemacht werden » signifie…", opts: ["Le travail fait aujourd'hui", "Le travail peut être fait aujourd'hui", "Le travail doit finir", "On a fait le travail"], a: 1, exp: "kann ... gemacht werden = peut être fait (passif + modal)." },
    { type: "input", q: "Complète : « Das Auto sollte repariert ___. » (passif avec modal)", a: ["werden"], ph: "infinitif final", exp: "sollte repariert werden = devrait être réparée." },
    { type: "qcm", q: "Passif prétérit ou Perfekt ? « Die Stadt wurde 1945 zerstört. »", opts: ["présent", "prétérit", "Perfekt", "futur"], a: 1, exp: "wurde = prétérit du passif." },
    { type: "vf", q: "« Die Tests sind korrigiert worden » est un passif au Perfekt.", a: true, exp: "sein + participe + worden = passif Perfekt : ont été corrigés." },
    { type: "input", q: "Mets au prétérit passif : « Das Auto ___ gestern repariert. »", a: ["wurde"], ph: "werden au prétérit", exp: "Das Auto wurde gestern repariert = fut réparée hier." },
    { type: "qcm", q: "Quelle phrase est un passif AVEC modal ?", opts: ["Das wurde gemacht.", "Das ist gemacht worden.", "Das muss gemacht werden.", "Das wird gemacht."], a: 2, exp: "muss ... werden = passif + verbe de modalité." },
    { type: "qcm", q: "Compréhension : « Der Vertrag musste noch unterschrieben werden. » Que fallait-il faire ?", opts: ["Le contrat était signé", "Le contrat devait encore être signé", "Le contrat était annulé", "On a lu le contrat"], a: 1, exp: "musste ... unterschrieben werden = devait encore être signé (passif + modal au prétérit)." }
  ],
  final: {
    title: "Exercice final — Die Renovierung",
    intro: `<p>Lis ce texte sur la rénovation d'une école (passifs variés) et réponds.</p>
<pre class="pseudo">Unsere alte Schule wurde letztes Jahr renoviert. Zuerst mussten die
alten Fenster ausgetauscht werden. Die Waende sind neu gestrichen worden.
Ein moderner Computerraum wurde eingerichtet. Die Toiletten mussten
komplett erneuert werden. Auch der Sportplatz ist repariert worden.
Heute kann die Schule wieder normal benutzt werden. Alle Arbeiten
wurden von einer lokalen Firma durchgefuehrt.</pre>
<p>(austauschen = remplacer · streichen = peindre · einrichten = aménager · erneuern = rénover)</p>`,
    questions: [
      { type: "input", q: "Complète : « Unsere Schule ___ letztes Jahr renoviert. » (passif prétérit)", a: ["wurde"], ph: "werden au prétérit", exp: "wurde renoviert = a été rénovée (prétérit)." },
      { type: "qcm", q: "« Die Waende sind neu gestrichen worden » est un passif au…", opts: ["présent", "prétérit", "Perfekt", "futur"], a: 2, exp: "sind ... gestrichen worden = passif Perfekt." },
      { type: "qcm", q: "Que fallait-il faire avec les fenêtres ?", opts: ["Les nettoyer", "Les remplacer (mussten ausgetauscht werden)", "Les fermer", "Rien"], a: 1, exp: "« mussten ausgetauscht werden » = devaient être remplacées (passif + modal)." },
      { type: "vf", q: "L'école peut de nouveau être utilisée normalement aujourd'hui.", a: true, exp: "« Heute kann die Schule wieder normal benutzt werden. »" },
      { type: "qcm", q: "Qui a réalisé les travaux ?", opts: ["les élèves", "une entreprise locale (von einer lokalen Firma)", "la ville", "les professeurs"], a: 1, exp: "« von einer lokalen Firma durchgeführt » = réalisés par une entreprise locale." }
    ],
    solution: `<p>Le texte mélange les formes du passif passé : <strong>wurde renoviert / wurde eingerichtet / wurden durchgeführt</strong> (prétérit), <strong>sind gestrichen worden / ist repariert worden</strong> (Perfekt, avec worden), <strong>mussten ausgetauscht/erneuert werden</strong> (modal au prétérit + werden), <strong>kann benutzt werden</strong> (modal présent + werden).</p>
<p>Le participe de l'action reste stable ; seul l'entourage change : wurde / ist...worden / muss(te)...werden. L'agent est nommé une fois : <strong>von einer lokalen Firma</strong>.</p>`
  }
};
</script>

    solution: "Letztes Jahr wurde unsere Wohnung renoviert. Zuerst mussten die alten Boeden ausgetauscht werden. Die Waende sind neu gestrichen worden. Eine moderne Kueche wurde eingebaut. Das Badezimmer sollte auch erneuert werden, aber es war zu teuer. Alle Arbeiten wurden von einer kleinen Firma gemacht. Jetzt kann die Wohnung wieder komfortabel benutzt werden.\n\n(Traduction : L'an dernier, notre appartement a été rénové. D'abord, les vieux sols ont dû être remplacés. Les murs ont été repeints. Une cuisine moderne a été installée. La salle de bain aurait aussi dû être rénovée, mais c'était trop cher. Tous les travaux ont été réalisés par une petite entreprise. Maintenant l'appartement peut de nouveau être utilisé confortablement.)",

  ]
};
