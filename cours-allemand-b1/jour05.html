<script>
var DAY = {
  num: 5,
  title: "Le discours indirect (Konjunktiv I)",
  subtitle: "Rapporter les paroles d'autrui : « Il dit QU'il est malade ».",
  theory: `
<h3>1. Rapporter des paroles</h3>
<p>Le <strong>discours indirect</strong> sert à rapporter ce que quelqu'un a dit, sans le citer mot pour mot. En allemand soutenu (journaux, informations, rapports), on emploie un mode spécial : le <strong>Konjunktiv I</strong>. Il signale : « ce sont les paroles de l'autre, je ne les prends pas à mon compte ».</p>
<pre class="pseudo">Discours direct :   Er sagt: Ich bin krank.        Il dit : je suis malade.
Discours indirect : Er sagt, er sei krank.         Il dit qu'il est malade.</pre>
<div class="tip">En français, on garde l'indicatif (« il dit qu'il EST malade »). En allemand journalistique, on passe au Konjunktiv I (sei). C'est une marque de distance et de neutralité.</div>
<h3>2. Comment former le Konjunktiv I</h3>
<p>Base : le radical de l'<strong>infinitif</strong> + les terminaisons -e, -est, -e, -en, -et, -en. La forme la plus utilisée est la <strong>3e personne du singulier</strong>, en <strong>-e</strong> (facile à reconnaître).</p>
<pre class="pseudo">Verbe       3e sing. Konj. I   sens
kommen      er komme            il vient / viendrait
gehen       er gehe             il va
haben       er habe             il a
machen      er mache            il fait</pre>
<h3>3. Le cas spécial de sein</h3>
<p>sein est irrégulier et très fréquent au Konjunktiv I. Apprends-le par coeur :</p>
<pre class="pseudo">ich sei      wir seien
du sei(e)st  ihr seiet
er/sie sei   sie/Sie seien</pre>
<pre class="pseudo">Sie sagt, sie sei muede.       Elle dit qu'elle est fatiguée.
Er sagt, es seien viele Leute da.  Il dit qu'il y a beaucoup de monde.</pre>
<h3>4. Quand le Konjunktiv I se confond, on prend le Konjunktiv II</h3>
<p>Parfois, la forme du Konjunktiv I ressemble trop au présent normal (surtout au pluriel : sie machen = sie machen). Pour rester clair, on utilise alors le <strong>Konjunktiv II</strong> (le « würde » ou les formes en -e du prétérit).</p>
<pre class="pseudo">Sie sagen, sie haetten keine Zeit.   Ils disent qu'ils n'ont pas le temps.
(haben -> Konj. I sie haben = présent : on prend Konj. II haetten)
Sie sagen, sie wuerden bald kommen.  Ils disent qu'ils viendront bientôt.</pre>
<h3>5. Les questions et ordres indirects</h3>
<p>Pour rapporter une question : on utilise <strong>ob</strong> (« si ») ou le mot interrogatif, et le verbe part à la fin.</p>
<pre class="pseudo">Direct :   Bist du muede?            Es-tu fatigué ?
Indirect : Er fragt, ob ich muede sei.   Il demande si je suis fatigué.
Direct :   Wo wohnst du?            Où habites-tu ?
Indirect : Sie fragt, wo ich wohne.   Elle demande où j'habite.</pre>
<div class="warn">Après le verbe introducteur (sagen, fragen, meinen...), on met une virgule. Et dans la subordonnée, le verbe conjugué (au Konjunktiv) va à la fin, sauf s'il n'y a pas de conjonction (er sei krank : verbe en 2e position).</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le Konjunktiv I ?", opts: ["à donner un ordre", "à rapporter les paroles d'autrui (discours indirect)", "à faire une hypothèse", "à conjuguer le futur"], a: 1, exp: "Konjunktiv I = discours indirect soutenu (journaux, rapports)." },
    { type: "input", q: "Konjunktiv I de sein, 3e sing. : « Er sagt, er ___ krank. »", a: ["sei"], ph: "sein au Konj. I", exp: "er sei krank = il dit qu'il est malade." },
    { type: "qcm", q: "« Er sagt, er sei krank » se traduit par…", opts: ["Il dit : sois malade", "Il dit qu'il est malade", "Il était malade", "Il devient malade"], a: 1, exp: "sei = Konjunktiv I de sein, discours indirect." },
    { type: "input", q: "Konjunktiv I de kommen, 3e sing. : « Sie sagt, er ___ morgen. »", a: ["komme"], ph: "kommen au Konj. I", exp: "er komme (radical komm- + e)." },
    { type: "qcm", q: "Quelle est la forme la plus reconnaissable du Konjunktiv I ?", opts: ["1re pl. en -en", "3e sing. en -e", "2e sing. en -st", "1re sing."], a: 1, exp: "La 3e personne du singulier en -e (er komme, er habe) est la plus claire." },
    { type: "input", q: "Konjunktiv I de haben, 3e sing. : « Er sagt, sie ___ keine Zeit. »", a: ["habe"], ph: "haben au Konj. I", exp: "3e sing. : sie habe (radical hab- + e)." },
    { type: "vf", q: "En allemand journalistique, on utilise le Konjunktiv I pour rester neutre.", a: true, exp: "Vrai : il marque que ce sont les propos rapportés d'un tiers." },
    { type: "qcm", q: "Pourquoi utilise-t-on parfois le Konjunktiv II à la place du Konjunktiv I ?", opts: ["par élégance", "quand la forme du Konj. I se confond avec le présent", "toujours au singulier", "jamais"], a: 1, exp: "Ex : sie haben (présent) = sie haben (Konj. I) -> on prend hätten pour être clair." },
    { type: "input", q: "Rapporte : « Wir haben keine Zeit. » -> « Sie sagen, sie ___ keine Zeit. » (Konj. II de haben, pour éviter la confusion)", a: ["haetten","hätten"], ph: "haben au Konj. II", exp: "sie hätten : Konj. II car sie haben se confondrait avec le présent." },
    { type: "qcm", q: "Comment rapporte-t-on une question fermée (oui/non) ?", opts: ["avec dass", "avec ob (si)", "avec weil", "sans conjonction"], a: 1, exp: "ob = si : Er fragt, ob ich müde sei." },
    { type: "input", q: "Rapporte : « Bist du müde? » -> « Er fragt, ___ ich müde sei. »", a: ["ob"], ph: "conjonction", exp: "ob = si (question fermée)." },
    { type: "vf", q: "Après le verbe introducteur (sagen, fragen), on met une virgule.", a: true, exp: "Vrai : Er sagt, ... / Sie fragt, ..." },
    { type: "qcm", q: "« Sie fragt, wo ich wohne » rapporte quelle question directe ?", opts: ["Wohnst du hier?", "Wo wohnst du?", "Warum wohnst du?", "Wann kommst du?"], a: 1, exp: "wo (où) est conservé ; verbe wohne à la fin." },
    { type: "input", q: "Konjunktiv I de gehen, 3e sing. : « Er sagt, es ___ ihm gut. »", a: ["gehe"], ph: "gehen au Konj. I", exp: "es gehe ihm gut = il dit qu'il va bien." },
    { type: "qcm", q: "Compréhension : « Der Minister sagte, die Lage sei ernst. » Que rapporte-t-on ?", opts: ["La situation est joyeuse selon lui", "Selon le ministre, la situation est grave", "Le ministre est grave", "La situation change"], a: 1, exp: "sei ernst (Konj. I) = la situation est grave, propos rapportés du ministre." }
  ],
  final: {
    title: "Exercice final — Der Nachrichtenbericht",
    intro: `<p>Lis ce bulletin d'information (discours indirect au Konjunktiv I), puis réponds.</p>
<pre class="pseudo">Der Buergermeister sagte gestern, die Stadt plane ein neues Museum.
Er erklaerte, das Projekt sei sehr wichtig fuer den Tourismus. Die
Kosten, so sagte er, betruegen etwa zehn Millionen Euro. Er fuegte
hinzu, die Arbeiten begaennen naechstes Jahr. Eine Sprecherin sagte,
viele Buerger haetten Fragen zum Projekt. Der Buergermeister
antwortete, alle Informationen wuerden bald veroeffentlicht.</pre>
<p>(der Bürgermeister = le maire · die Kosten = les coûts · hinzufügen = ajouter · veröffentlichen = publier)</p>`,
    questions: [
      { type: "qcm", q: "Que prévoit la ville, selon le maire ?", opts: ["un nouveau stade", "un nouveau musée (ein neues Museum)", "un parking", "une école"], a: 1, exp: "« die Stadt plane ein neues Museum »." },
      { type: "input", q: "Konjunktiv I de sein dans le texte : « das Projekt ___ sehr wichtig ».", a: ["sei"], ph: "sein au Konj. I", exp: "sei = Konjunktiv I de sein (discours indirect)." },
      { type: "qcm", q: "Combien coûterait le projet ?", opts: ["un million", "dix millions d'euros", "cent millions", "on ne sait pas"], a: 1, exp: "« die Kosten ... beträgen etwa zehn Millionen Euro »." },
      { type: "vf", q: "Selon la porte-parole, beaucoup de citoyens ont des questions.", a: true, exp: "« viele Bürger hätten Fragen » (Konj. II pour éviter la confusion)." },
      { type: "qcm", q: "Pourquoi « hätten » et « würden » plutôt que le Konjunktiv I ?", opts: ["par erreur", "parce que la forme Konj. I se confondrait avec le présent", "c'est du futur", "c'est un ordre"], a: 1, exp: "Au pluriel, Konj. I = présent : on choisit le Konj. II pour rester clair." }
    ],
    solution: `<p>Tout le bulletin est au discours indirect. Formes clés : <strong>plane, sei, betragen (betrügen), begännen</strong> (Konjunktiv I, marquant les propos rapportés) et <strong>hätten, würden</strong> (Konjunktiv II, choisis quand le Konj. I se confondrait avec le présent).</p>
<p>Retiens : verbe introducteur + virgule ; la 3e personne du singulier en <strong>-e</strong> (sei, plane) est la signature du Konjunktiv I ; au pluriel on bascule souvent vers <strong>hätten / würden</strong>.</p>`
  }
};
</script>
