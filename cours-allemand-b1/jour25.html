var DAY = {
  num: 25,
  title: "Verbes séparables ou inséparables",
  subtitle: "Reconnaître le préfixe qui part... et celui qui reste collé.",
  theory: `
<h3>1. Le principe</h3>
<p>Beaucoup de verbes allemands ont un <strong>préfixe</strong> (une petite particule devant). Certains préfixes se <strong>détachent</strong> du verbe (verbes séparables, <em>trennbare Verben</em>), d'autres restent <strong>collés</strong> (verbes inséparables, <em>untrennbare Verben</em>). Le sens et la construction en dépendent.</p>
<pre class="pseudo">Séparable :   aufstehen (se lever)   →  Ich stehe um 7 Uhr auf.
Inséparable : verstehen (comprendre) →  Ich verstehe die Frage.</pre>
<h3>2. Les verbes séparables : le préfixe part à la fin</h3>
<p>Dans une phrase principale au présent ou au prétérit, le préfixe se détache et file <strong>à la fin</strong>. Le préfixe est souvent accentué à l'oral.</p>
<pre class="pseudo">aufstehen   se lever      →  Ich stehe früh auf.
einkaufen   faire les courses  →  Wir kaufen im Supermarkt ein.
anrufen     appeler       →  Er ruft seine Mutter an.
mitkommen   venir avec    →  Kommst du mit?
fernsehen   regarder la télé   →  Sie sieht gern fern.</pre>
<div class="tip">Préfixes typiquement <strong>séparables</strong> (accentués) : <em>ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, fern-, weg-, los-, her-, hin-</em>. Ils ont un sens concret (direction, position).</p></div>
<h3>3. Les verbes inséparables : le préfixe reste collé</h3>
<p>Ces préfixes ne se détachent JAMAIS. Ils ne sont pas accentués et n'ont pas de sens propre.</p>
<pre class="pseudo">verstehen   comprendre    →  Ich verstehe dich.
bekommen    recevoir      →  Sie bekommt ein Geschenk.
erklären    expliquer     →  Er erklärt die Regel.
entscheiden décider       →  Wir entscheiden heute.
gefallen    plaire        →  Das Buch gefällt mir.</pre>
<div class="warn">Préfixes toujours <strong>inséparables</strong> (non accentués) : <em>be-, emp-, ent-, er-, ge-, ver-, zer-, miss-</em>. Moyen mnémotechnique : « <strong>be- ge- er- ver- zer- ent- emp- miss-</strong> » — apprends-les par cœur, ils ne bougent jamais.</p></div>
<h3>4. Au participe passé (Perfekt)</h3>
<p>La différence saute aux yeux au Perfekt :</p>
<pre class="pseudo">Séparable   : le -ge- se glisse ENTRE le préfixe et le verbe
   aufstehen → aufgestanden   ·   einkaufen → eingekauft
   Ich bin früh aufgestanden.  ·  Wir haben eingekauft.
Inséparable : PAS de -ge-
   verstehen → verstanden   ·   bekommen → bekommen
   Ich habe die Frage verstanden.  ·  Ich habe ein Paket bekommen.</pre>
<h3>5. Avec zu (infinitif)</h3>
<pre class="pseudo">Séparable   : zu s'insère au milieu → aufzustehen, einzukaufen
   Es ist Zeit, aufzustehen.   (Il est temps de se lever.)
Inséparable : zu devant → zu verstehen, zu bekommen
   Es ist wichtig, das zu verstehen.  (Il est important de comprendre cela.)</pre>
<p>Certains préfixes (durch-, über-, um-, unter-, wider-) sont <strong>variables</strong> : séparables ou non selon le sens. Ex. : <em>umziehen</em> (déménager, séparable : ich ziehe um) vs <em>umarmen</em> (embrasser, inséparable : ich umarme).</p>`,
  exercises: [
    { type: "qcm", q: "Dans un verbe SÉPARABLE au présent, où va le préfixe ?", opts: ["il reste collé au verbe", "il se détache et part à la fin de la phrase", "il disparaît", "il se met en tête"], a: 1, exp: "Ich stehe früh auf : le préfixe auf part à la fin." },
    { type: "input", q: "Complète : « Ich ___ um 7 Uhr ___. » (aufstehen, présent, ich) — donne le préfixe qui part à la fin", a: ["auf"], ph: "préfixe", exp: "aufstehen : ich stehe ... auf." },
    { type: "qcm", q: "Lequel de ces verbes est INSÉPARABLE ?", opts: ["anrufen", "verstehen", "mitkommen", "einkaufen"], a: 1, exp: "ver- est un préfixe toujours inséparable : verstehen." },
    { type: "vf", q: "Le préfixe « ver- » (verstehen, verkaufen) ne se détache jamais.", a: true, exp: "be-, ge-, er-, ver-, zer-, ent-, emp-, miss- sont toujours inséparables." },
    { type: "input", q: "Complète l'appel : « Er ___ seine Mutter an. » (anrufen, présent, er)", a: ["ruft"], ph: "verbe", exp: "anrufen : er ruft ... an." },
    { type: "qcm", q: "Participe passé de « einkaufen » (faire les courses) ?", opts: ["einkauft", "geeinkauft", "eingekauft", "einkaufen"], a: 2, exp: "Séparable : le -ge- se glisse au milieu → eingekauft." },
    { type: "qcm", q: "Participe passé de « verstehen » (comprendre) ?", opts: ["geverstanden", "verstanden", "verstehet", "vergestanden"], a: 1, exp: "Inséparable : PAS de -ge- → verstanden." },
    { type: "input", q: "Complète le Perfekt (séparable) : « Ich bin früh ___. » (participe de aufstehen)", a: ["aufgestanden"], ph: "participe", exp: "aufstehen → aufgestanden (ge au milieu)." },
    { type: "input", q: "Complète le Perfekt (inséparable) : « Ich habe ein Paket ___. » (participe de bekommen)", a: ["bekommen"], ph: "participe", exp: "bekommen → bekommen (pas de ge-)." },
    { type: "qcm", q: "Quel préfixe est SÉPARABLE (accentué) ?", opts: ["be-", "er-", "mit-", "ver-"], a: 2, exp: "mit- est séparable (mitkommen, mitbringen)." },
    { type: "vf", q: "« Kommst du mit? » est correct pour le verbe séparable mitkommen.", a: true, exp: "mitkommen : le préfixe mit part à la fin, même dans la question." },
    { type: "qcm", q: "Forme avec zu de « aufstehen » ?", opts: ["zu aufstehen", "aufzustehen", "aufstehen zu", "zuaufstehen"], a: 1, exp: "Séparable : zu s'insère → aufzustehen." },
    { type: "qcm", q: "Forme avec zu de « verstehen » ?", opts: ["verzustehen", "zu verstehen", "verstehen zu", "gezuverstehen"], a: 1, exp: "Inséparable : zu devant → zu verstehen." },
    { type: "input", q: "Complète : « Es ist Zeit, ___. » (se lever — forme zu de aufstehen)", a: ["aufzustehen"], ph: "infinitif avec zu", exp: "aufstehen (séparable) → aufzustehen." },
    { type: "qcm", q: "Compréhension : « Ich ziehe nächste Woche um. » Que fait la personne ?", opts: ["Elle s'habille", "Elle déménage (umziehen, séparable)", "Elle embrasse quelqu'un", "Elle tourne"], a: 1, exp: "umziehen (séparable) = déménager : ich ziehe ... um." }
  ],
  final: {
    title: "Exercice final — Trennbar oder untrennbar?",
    intro: `<p>Lis ce texte et observe les verbes à préfixe (séparables ou inséparables), puis réponds.</p>
<pre class="pseudo">Jeden Morgen stehe ich um sechs Uhr auf. Zuerst rufe ich meinen
Bruder an, dann bereite ich das Frühstück vor. Nach dem Essen räume
ich die Küche auf und ziehe mich schnell an.

Gestern habe ich etwas Wichtiges erlebt: Ich habe an einem Wettbewerb
teilgenommen und tatsächlich gewonnen! Zuerst habe ich es gar nicht
verstanden. Die Jury hat mir einen Preis überreicht, und ich habe
mich riesig gefreut.

Heute rufe ich alle meine Freunde an und lade sie zu einer kleinen
Feier ein. Ich hoffe, dass viele mitkommen. Es ist schön, so einen
Erfolg mit anderen zu teilen.</pre>
<p>(vorbereiten = préparer · aufräumen = ranger · sich anziehen = s'habiller · erleben = vivre (une expérience) · teilnehmen = participer · überreichen = remettre · einladen = inviter)</p>`,
    questions: [
      { type: "input", q: "À quelle heure la personne se lève-t-elle ? « stehe ich um ___ Uhr auf » (chiffre)", a: ["sechs","6"], ph: "heure", exp: "« um sechs Uhr auf » (aufstehen, séparable)." },
      { type: "qcm", q: "« teilgenommen » (de teilnehmen) est un participe…", opts: ["de verbe séparable (ge au milieu)", "de verbe inséparable", "d'un adjectif", "irrégulier sans préfixe"], a: 0, exp: "teilnehmen est séparable : teil-ge-nommen → teilgenommen." },
      { type: "qcm", q: "« verstanden » (de verstehen) n'a pas de -ge- parce que…", opts: ["c'est une faute", "ver- est un préfixe inséparable", "le verbe est au présent", "c'est un nom"], a: 1, exp: "Inséparable ver- → participe sans ge-." },
      { type: "vf", q: "Dans « lade sie zu einer kleinen Feier ein », le verbe est einladen (séparable), préfixe ein à la fin.", a: true, exp: "einladen : ich lade ... ein." },
      { type: "qcm", q: "Que veut dire « Ich hoffe, dass viele mitkommen » ?", opts: ["J'espère que beaucoup viendront (avec moi)", "J'espère que peu viendront", "Je pars seul", "Je reste chez moi"], a: 0, exp: "mitkommen = venir avec ; « que beaucoup viennent »." }
    ],
    solution: `<p>Repère le tri des verbes à préfixe :</p>
<pre class="pseudo">SÉPARABLES (préfixe à la fin / ge au milieu au participe) :
   aufstehen → stehe ... auf   ·   anrufen → rufe ... an
   vorbereiten → bereite ... vor   ·   aufräumen → räume ... auf
   sich anziehen → ziehe mich ... an   ·   teilnehmen → teilgenommen
   einladen → lade ... ein   ·   mitkommen → mitkommen
INSÉPARABLES (préfixe collé, pas de ge-) :
   erleben → erlebt   ·   verstehen → verstanden   ·   überreichen → überreicht</pre>
<p>La règle d'or : préfixe accentué et concret (auf-, an-, mit-, ein-...) = séparable ; préfixe atone (be-, er-, ver-, ent-...) = inséparable, sans -ge- au participe.</p>`
  }
};
