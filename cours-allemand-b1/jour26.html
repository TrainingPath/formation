  num: 26,
  title: "But, cause, conséquence",
  subtitle: "Exprimer pourquoi, dans quel but et avec quel résultat.",
  theory: `
<h3>1. La cause : pourquoi ? (die Ursache)</h3>
<p>Pour dire POURQUOI, deux outils fréquents : <strong>weil</strong> (subordonnant, verbe à la fin) et <strong>denn</strong> (coordonnant, ordre normal). Même sens (parce que / car), constructions différentes.</p>
<pre class="pseudo">Ich bleibe zu Hause, weil ich krank bin.     (weil → bin à la fin)
Ich bleibe zu Hause, denn ich bin krank.     (denn → ordre normal)
Je reste à la maison parce que / car je suis malade.</pre>
<p>Style écrit : <strong>wegen + génitif</strong> (à cause de) exprime la cause avec un nom :</p>
<pre class="pseudo">Wegen des Regens bleiben wir zu Hause.   À cause de la pluie, nous restons.
Wegen der Krankheit fehlt er.            À cause de la maladie, il est absent.</pre>
<h3>2. La conséquence : et alors ? (die Folge)</h3>
<p>Pour dire le RÉSULTAT, on emploie surtout <strong>deshalb / deswegen / darum</strong> (c'est pourquoi) : ce sont des adverbes-connecteurs → <strong>inversion</strong> (verbe en 2e).</p>
<pre class="pseudo">Ich bin krank. Deshalb bleibe ich zu Hause.
Je suis malade. C'est pourquoi je reste à la maison.  (deshalb + bleibe ich)</pre>
<p>Autres : <strong>also</strong> (donc), <strong>so dass / sodass</strong> (si bien que, subordonnant, verbe à la fin) :</p>
<pre class="pseudo">Es hat stark geregnet, sodass die Straße überschwemmt war.
Il a beaucoup plu, si bien que la rue était inondée.</pre>
<div class="warn">Ne confonds pas <strong>cause</strong> et <strong>conséquence</strong> : elles disent la même relation dans les deux sens. « Ich bin krank, <strong>deshalb</strong> bleibe ich zu Hause » (conséquence) = « Ich bleibe zu Hause, <strong>weil</strong> ich krank bin » (cause). Le fait et le résultat changent de place.</p></div>
<h3>3. Le but : dans quel but ? (die Absicht)</h3>
<p>Pour dire l'OBJECTIF visé, deux constructions selon les sujets :</p>
<pre class="pseudo">um ... zu + infinitif   (quand le sujet est LE MÊME dans les deux parties)
   Ich lerne Deutsch, um in Deutschland zu arbeiten.
   J'apprends l'allemand pour travailler en Allemagne.

damit + subordonnée     (quand les sujets sont DIFFÉRENTS)
   Ich erkläre es langsam, damit alle mich verstehen.
   Je l'explique lentement pour que tous me comprennent.</pre>
<div class="tip">Test rapide : même sujet des deux côtés ? → <strong>um ... zu</strong> (« pour + infinitif »). Sujets différents ? → <strong>damit</strong> (« pour que » + subordonnée, verbe à la fin). C'est LA distinction à retenir.</p></div>
<h3>4. Tableau de synthèse</h3>
<pre class="pseudo">Relation      Connecteur        Construction
CAUSE         weil              verbe à la fin
              denn              ordre normal
              wegen + génitif   + nom
CONSÉQUENCE   deshalb/darum     inversion (verbe en 2e)
              sodass            verbe à la fin
BUT           um ... zu         + infinitif (même sujet)
              damit             verbe à la fin (sujets différents)</pre>
<h3>5. Exemples croisés</h3>
<pre class="pseudo">CAUSE :        Ich spare Geld, weil ich reisen will.
CONSÉQUENCE :  Ich will reisen, deshalb spare ich Geld.
BUT :          Ich spare Geld, um zu reisen.</pre>`,
  exercises: [
    { type: "qcm", q: "« weil » exprime… et place le verbe…", opts: ["le but — en 2e", "la cause — à la fin de la subordonnée", "la conséquence — en 1re", "le temps — au début"], a: 1, exp: "weil = cause (parce que), verbe à la fin." },
    { type: "input", q: "Complète (cause) : « Ich bleibe zu Hause, weil ich krank ___. » (sein, à la fin)", a: ["bin"], ph: "verbe", exp: "weil → bin à la fin." },
    { type: "qcm", q: "« denn » (car) impose quel ordre des mots ?", opts: ["verbe à la fin", "ordre normal : sujet + verbe", "inversion", "sans verbe"], a: 1, exp: "denn = coordonnant : ordre normal après lui." },
    { type: "qcm", q: "« deshalb » exprime… et déclenche…", opts: ["la cause — verbe à la fin", "la conséquence — l'inversion (verbe en 2e)", "le but — l'infinitif", "le temps — rien"], a: 1, exp: "deshalb = c'est pourquoi (conséquence) → inversion." },
    { type: "input", q: "Complète (conséquence) : « Ich bin krank. Deshalb ___ ich zu Hause. » (bleiben, ich)", a: ["bleibe"], ph: "verbe", exp: "deshalb → inversion : bleibe ich." },
    { type: "qcm", q: "Quand utilise-t-on « um ... zu » plutôt que « damit » ?", opts: ["quand les sujets sont différents", "quand le sujet est LE MÊME dans les deux parties", "toujours", "jamais"], a: 1, exp: "um ... zu = même sujet ; damit = sujets différents." },
    { type: "input", q: "Complète (but, même sujet) : « Ich lerne Deutsch, ___ in Deutschland zu arbeiten. » (pour)", a: ["um"], ph: "connecteur", exp: "um ... zu + infinitif : um ... zu arbeiten." },
    { type: "qcm", q: "Phrase correcte avec « damit » ?", opts: ["Ich spreche laut, damit alle mich zu verstehen.", "Ich spreche laut, damit alle mich verstehen.", "Ich spreche laut, damit verstehen alle mich.", "Ich spreche laut, damit alle verstehen mich."], a: 1, exp: "damit = subordonnant : verbe verstehen à la fin, pas de zu." },
    { type: "vf", q: "Avec « um ... zu », on n'utilise PAS de sujet dans la partie infinitive.", a: true, exp: "um ... zu + infinitif : pas de nouveau sujet (c'est le même)." },
    { type: "qcm", q: "« Wegen des Regens » signifie…", opts: ["malgré la pluie", "à cause de la pluie", "pour la pluie", "après la pluie"], a: 1, exp: "wegen + génitif = à cause de : wegen des Regens." },
    { type: "input", q: "Complète (conséquence, subordonnant) : « Es regnete stark, ___ die Straße überschwemmt war. » (si bien que, 1 mot)", a: ["sodass","so dass"], ph: "connecteur", exp: "sodass = si bien que, verbe à la fin." },
    { type: "qcm", q: "« Ich spare Geld, um zu reisen » exprime…", opts: ["une cause", "une conséquence", "un but (pour voyager)", "une condition"], a: 2, exp: "um ... zu = but : pour voyager." },
    { type: "vf", q: "« Ich will reisen, deshalb spare ich Geld » exprime une conséquence.", a: true, exp: "deshalb = c'est pourquoi (conséquence)." },
    { type: "qcm", q: "Transforme la cause « weil ich reisen will » en BUT équivalent :", opts: ["deshalb reise ich", "um zu reisen", "weil ich reise", "damit ich krank bin"], a: 1, exp: "But (même sujet) : um zu reisen (pour voyager)." },
    { type: "qcm", q: "Compréhension : « Ich schließe das Fenster, damit die Kinder nicht frieren. » Pourquoi ferme-t-on la fenêtre ?", opts: ["Parce qu'il fait chaud", "Pour que les enfants n'aient pas froid", "Parce que les enfants dorment", "Sans raison"], a: 1, exp: "damit (sujets différents) : pour que les enfants n'aient pas froid." }
  ],
  final: {
    title: "Exercice final — Ursache, Folge, Ziel",
    intro: `<p>Lis ce texte et repère les relations de cause, conséquence et but, puis réponds.</p>
<pre class="pseudo">Lukas möchte im Ausland studieren. Deshalb lernt er jeden Tag fleißig
Englisch. Er nimmt auch Nachhilfe, um schneller Fortschritte zu machen.

Er spart außerdem viel Geld, weil ein Auslandsjahr sehr teuer ist.
Wegen der hohen Kosten arbeitet er am Wochenende in einem Café.
Seine Eltern unterstützen ihn, damit er sich voll auf das Studium
konzentrieren kann.

Letztes Jahr hat Lukas eine wichtige Prüfung bestanden, sodass er sich
jetzt an mehreren Universitäten bewerben kann. Er ist sehr motiviert,
denn sein Traum ist ein Studium in Kanada.</pre>
<p>(im Ausland = à l'étranger · fleißig = assidûment · die Nachhilfe = le soutien scolaire · der Fortschritt = le progrès · unterstützen = soutenir · sich bewerben = postuler · der Traum = le rêve)</p>`,
    questions: [
      { type: "qcm", q: "« Deshalb lernt er jeden Tag Englisch » exprime…", opts: ["une cause", "une conséquence de son projet d'étudier à l'étranger", "un but avec um...zu", "une condition"], a: 1, exp: "deshalb = conséquence (c'est pourquoi il apprend l'anglais)." },
      { type: "qcm", q: "Pourquoi prend-il du soutien scolaire ? « Er nimmt Nachhilfe, um ... »", opts: ["parce qu'il est malade", "pour faire des progrès plus vite (but)", "à cause de ses parents", "si bien qu'il réussit"], a: 1, exp: "um schneller Fortschritte zu machen = but (même sujet)." },
      { type: "input", q: "Pourquoi économise-t-il ? « ... , weil ein Auslandsjahr sehr ___ ist. » (cher)", a: ["teuer"], ph: "adjectif", exp: "weil ... teuer ist = cause (parce que c'est cher)." },
      { type: "vf", q: "« Seine Eltern unterstützen ihn, damit er sich konzentrieren kann » utilise damit car les sujets sont différents (les parents / il).", a: true, exp: "Sujets différents → damit + verbe à la fin." },
      { type: "qcm", q: "« ..., sodass er sich jetzt bewerben kann » exprime…", opts: ["un but", "une conséquence (si bien qu'il peut postuler)", "une cause", "une comparaison"], a: 1, exp: "sodass = conséquence : si bien qu'il peut maintenant postuler." }
    ],
    solution: `<p>Le texte combine les trois relations :</p>
<pre class="pseudo">CAUSE :        weil ein Auslandsjahr teuer ist   ·   denn sein Traum ist ...
               wegen der hohen Kosten (+ génitif)
CONSÉQUENCE :  deshalb lernt er (inversion)   ·   sodass er sich bewerben kann (verbe à la fin)
BUT :          um schneller Fortschritte zu machen (même sujet → um...zu)
               damit er sich konzentrieren kann (sujets différents → damit)</pre>
<p>La compétence clé : choisir la bonne construction. Cause avec nom → wegen + génitif ; but même sujet → um ... zu ; but sujets différents → damit ; conséquence → deshalb (inversion) ou sodass (verbe à la fin).</p>`
  }
};
