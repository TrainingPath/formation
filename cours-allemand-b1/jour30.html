<body>
<script>
var DAY = {
  num: 30,
  title: "Bilan B1 : conversation de 10 minutes",
  subtitle: "Tenir une vraie conversation : prendre la parole, réagir, relancer.",
  theory: `
<h3>1. L'objectif final</h3>
<p>Le dernier bilan du B1 : soutenir une <strong>conversation de dix minutes</strong> sur des sujets du quotidien. Il ne s'agit plus de réciter, mais d'<strong>interagir</strong> : écouter, réagir, poser des questions, donner son avis, raconter. Voici une trame minute par minute à t'approprier.</p>
<h3>2. La trame de la conversation (10 minutes)</h3>
<pre class="pseudo">Min 0-1  : Se saluer et briser la glace
   Hallo! Schön, dich/Sie zu sehen. Wie geht es dir/Ihnen?
Min 1-3  : Se présenter / parler de soi
   Ich heiße ..., ich komme aus ..., ich arbeite als ...
   In meiner Freizeit ...
Min 3-5  : Parler de ses goûts et de son quotidien
   Ich interessiere mich für ..., am liebsten ...
   Normalerweise stehe ich um ... auf und ...
Min 5-7  : Raconter une expérience (Perfekt)
   Letztes Wochenende habe ich ... Am Anfang ..., dann ...
Min 7-9  : Donner son opinion / discuter un sujet
   Meiner Meinung nach ... Einerseits ..., andererseits ...
   Was denkst du/denken Sie darüber?
Min 9-10 : Conclure et prendre congé
   Es war schön, mit dir/Ihnen zu sprechen. Bis bald! / Auf Wiedersehen!</pre>
<h3>3. Les outils pour INTERAGIR (le coeur du B1 oral)</h3>
<pre class="pseudo">Relancer :        Und du? / Was meinst du? / Wie war das für dich?
Réagir :          Wirklich? / Ach so! / Das ist ja interessant! / Echt?
Montrer qu'on écoute :  Ja, genau. / Verstehe. / Stimmt.
Gagner du temps : Also, ... / Ähm, lass mich überlegen ... / Wie soll ich sagen ...
Demander de répéter :  Wie bitte? / Kannst du das wiederholen? / Was bedeutet ...?</pre>
<div class="tip">Le secret d'une bonne conversation : ne réponds jamais par un seul mot. Ajoute un détail, puis <strong>renvoie la balle</strong> avec une question (« Und du? »). C'est ce va-et-vient qui montre le niveau B1.</p></div>
<h3>4. Un extrait de conversation modèle</h3>
<pre class="pseudo">A: Hallo Mia! Schön, dich zu sehen. Wie geht's dir?
B: Hallo! Danke, mir geht's gut. Und dir?
A: Auch gut, danke. Was hast du am Wochenende gemacht?
B: Ich war wandern in den Bergen. Es war anstrengend, aber wunderschön!
   Und du?
A: Ach, interessant! Ich bin zu Hause geblieben und habe viel gelesen.
   Liest du auch gern?
B: Ja, sehr! Im Moment lese ich einen Krimi. Was liest du denn gerade?
A: Einen Roman über Berlin. Meiner Meinung nach ist Lesen die beste
   Art zu entspannen. Was meinst du?
B: Da bin ich ganz deiner Meinung. Aber ich mache auch gern Sport.</pre>
<div class="warn">Erreurs qui cassent la conversation : répondre seulement « ja » ou « nein » ; ne jamais poser de question en retour ; rester silencieux quand on cherche un mot (utilise plutôt « Also ... » ou reformule). Mieux vaut une phrase simple et fluide qu'une phrase parfaite jamais finie.</p></div>
<h3>5. Stratégies quand on est bloqué</h3>
<pre class="pseudo">Tu ne connais pas un mot ? → décris-le :
   « Wie sagt man ...? » / « Das ist ein Ding, mit dem man ... »
Tu n'as pas compris ?     → demande :
   « Entschuldigung, das habe ich nicht verstanden. Kannst du es anders sagen? »
Tu cherches une idée ?    → gagne du temps :
   « Das ist eine gute Frage. Also, ich denke ... »</pre>
<p>Bravo : arrivé au jour 30, tu as tous les outils pour converser en allemand au niveau B1. La clé désormais, c'est la <strong>pratique régulière</strong> : parle, ose, fais des erreurs et continue !</p>`,
  exercises: [
    { type: "qcm", q: "Quel est l'objectif d'une conversation B1 ?", opts: ["Réciter un texte par coeur", "Interagir : écouter, réagir, relancer, donner son avis", "Écrire vite", "Traduire mot à mot"], a: 1, exp: "Le B1 oral, c'est l'interaction, pas la récitation." },
    { type: "input", q: "Pour relancer ton interlocuteur, tu ajoutes souvent : « Und ___? » (et toi ? — tutoiement)", a: ["du"], ph: "pronom", exp: "« Und du? » renvoie la balle." },
    { type: "qcm", q: "Quelle expression sert à RÉAGIR avec intérêt ?", opts: ["Auf Wiedersehen!", "Das ist ja interessant!", "Ich heiße Tom.", "Guten Morgen."], a: 1, exp: "« Das ist ja interessant! / Ach so! / Wirklich? » = réactions d'écoute." },
    { type: "input", q: "Pour gagner du temps quand tu réfléchis : « ___, lass mich überlegen ... » (mot de remplissage courant)", a: ["Also","Ähm","Aehm","Naja"], ph: "mot", exp: "« Also, ... » ou « Ähm, ... » = gagner du temps." },
    { type: "qcm", q: "Comment demander poliment de répéter ?", opts: ["Tschüss!", "Wie bitte? / Kannst du das wiederholen?", "Genau!", "Ich weiß."], a: 1, exp: "« Wie bitte? » ou « Kannst du das wiederholen? »." },
    { type: "vf", q: "Répondre seulement par « ja » ou « nein » est une bonne stratégie de conversation.", a: false, exp: "Non : ajoute un détail et pose une question en retour, sinon la conversation s'arrête." },
    { type: "qcm", q: "Que fait-on entre les minutes 5 et 7 selon la trame ?", opts: ["Se saluer", "Raconter une expérience au Perfekt", "Prendre congé", "Épeler son nom"], a: 1, exp: "Min 5-7 : raconter une expérience (Letztes Wochenende habe ich ...)." },
    { type: "input", q: "Formule pour conclure : « Es war schön, mit dir zu ___. » (parler)", a: ["sprechen"], ph: "verbe", exp: "« Es war schön, mit dir zu sprechen. »" },
    { type: "qcm", q: "Pour montrer que tu écoutes activement, tu dis…", opts: ["Ja, genau. / Verstehe. / Stimmt.", "Nein.", "Ich gehe jetzt.", "Wie heißt du?"], a: 0, exp: "« Ja, genau / Verstehe / Stimmt » montrent l'écoute." },
    { type: "qcm", q: "Tu ne connais pas un mot. Meilleure stratégie ?", opts: ["Se taire", "Décrire l'objet : « Das ist ein Ding, mit dem man ... »", "Parler français", "Abandonner"], a: 1, exp: "Contourner en décrivant : « Wie sagt man ...? / Das ist ein Ding, mit dem ... »." },
    { type: "input", q: "Demander la signification d'un mot : « Was ___ das? » (signifier)", a: ["bedeutet"], ph: "verbe", exp: "« Was bedeutet das? » = que signifie cela ?" },
    { type: "qcm", q: "Pour donner ton opinion dans la discussion (min 7-9), tu commences par…", opts: ["Auf Wiedersehen", "Meiner Meinung nach ... / Ich finde, dass ...", "Guten Tag", "Wie bitte?"], a: 1, exp: "« Meiner Meinung nach ... » introduit ton avis." },
    { type: "vf", q: "Il vaut mieux une phrase simple et fluide qu'une phrase parfaite jamais terminée.", a: true, exp: "La fluidité et l'interaction priment sur la perfection grammaticale." },
    { type: "qcm", q: "Compréhension : ton partenaire dit « Da bin ich ganz deiner Meinung. » Il…", opts: ["n'est pas d'accord", "est tout à fait d'accord avec toi", "n'a pas compris", "veut partir"], a: 1, exp: "« Da bin ich ganz deiner Meinung » = je suis tout à fait d'accord." },
    { type: "qcm", q: "Quelle est LA clé pour progresser à l'oral après le jour 30 ?", opts: ["Ne plus jamais faire d'erreurs", "La pratique régulière : parler, oser, continuer", "Apprendre le dictionnaire par coeur", "Éviter de parler"], a: 1, exp: "La pratique régulière et le fait d'oser sont essentiels." }
  ],
  final: {
    title: "Exercice final — Eine ganze Unterhaltung",
    intro: `<p>Lis cette conversation complète entre deux personnes qui se rencontrent à une fête, puis réponds.</p>
<pre class="pseudo">Jan:  Hallo! Ich glaube, wir kennen uns noch nicht. Ich bin Jan.
Eva:  Hallo Jan, ich bin Eva. Schön, dich kennenzulernen! Woher kommst du?
Jan:  Ich komme aus Hamburg, aber ich wohne seit zwei Jahren hier in
      München. Und du?
Eva:  Ich bin von hier. Und was machst du beruflich?
Jan:  Ich arbeite als Ingenieur. Es macht mir Spaß, aber es ist manchmal
      stressig. Was machst du denn?
Eva:  Ich bin Lehrerin. Ach, interessant, ein Ingenieur! Was hast du am
      Wochenende gemacht?
Jan:  Ich war auf einem Konzert. Es war fantastisch! Hörst du auch gern
      Musik?
Eva:  Ja, sehr gern, vor allem Jazz. Meiner Meinung nach ist Musik das
      beste Mittel gegen Stress. Was meinst du?
Jan:  Da bin ich ganz deiner Meinung. Also, es war wirklich schön, mit
      dir zu reden. Vielleicht sehen wir uns bald wieder?
Eva:  Gern! Hier ist meine Nummer. Bis bald, Jan!</pre>
<p>(kennenlernen = faire connaissance · beruflich = professionnellement · das Mittel = le moyen / remède · die Nummer = le numéro)</p>`,
    questions: [
      { type: "qcm", q: "Comment Jan brise-t-il la glace au début ?", opts: ["Il parle du temps", "Il se présente : « Ich glaube, wir kennen uns noch nicht. Ich bin Jan. »", "Il pose une question sur le travail", "Il dit au revoir"], a: 1, exp: "Il se présente pour engager la conversation." },
      { type: "input", q: "D'où vient Jan à l'origine ? « Ich komme aus ___. »", a: ["Hamburg"], ph: "ville", exp: "« Ich komme aus Hamburg »." },
      { type: "qcm", q: "Comment Eva relance-t-elle la conversation plusieurs fois ?", opts: ["En restant silencieuse", "En posant des questions (Und du? / Was machst du beruflich? / Was hast du gemacht?)", "En parlant seulement d'elle", "En répétant « ja »"], a: 1, exp: "Elle renvoie la balle avec des questions : c'est l'interaction B1." },
      { type: "vf", q: "Jan et Eva sont d'accord sur le fait que la musique est un bon remède contre le stress.", a: true, exp: "« Meiner Meinung nach ist Musik das beste Mittel gegen Stress. » — « Da bin ich ganz deiner Meinung. »" },
      { type: "qcm", q: "Comment se termine la conversation ?", opts: ["Ils se disputent", "Ils prennent congé positivement et échangent leur numéro", "Jan part sans rien dire", "Eva refuse de parler"], a: 1, exp: "« es war schön, mit dir zu reden ... Hier ist meine Nummer. Bis bald! »." }
    ],
    solution: `<p>Cette conversation applique parfaitement la trame des 10 minutes :</p>
<pre class="pseudo">Salutation / glace :  Ich bin Jan. — Schön, dich kennenzulernen!
Se présenter :        Woher kommst du? · Was machst du beruflich?
Quotidien / goûts :   als Ingenieur ... Hörst du gern Musik?
Expérience (Perfekt): Was hast du am Wochenende gemacht? — Ich war auf einem Konzert.
Opinion :             Meiner Meinung nach ... — Da bin ich ganz deiner Meinung.
Prendre congé :       es war schön, mit dir zu reden ... Bis bald!</pre>
<p>Observe l'INTERACTION : chacun ajoute un détail PUIS relance avec une question (Und du? / Was meinst du?). Les réactions (Ach, interessant!) et l'accord (Da bin ich ganz deiner Meinung) entretiennent le dialogue. C'est exactement ce qu'on attend d'une conversation B1 réussie. Félicitations, tu as terminé le niveau B1 : continue à parler régulièrement !</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en allemand…",
  items: [
  { id: "de-b1-j30", title: "Écris une conversation complète", level: 3,
    statement: "Écris une conversation complète (12 à 16 répliques, deux personnes) qui suit la trame des 10 minutes : salutation, présentation, goûts/quotidien, une expérience au Perfekt, une opinion partagée, et une prise de congé. Utilise des relances (Und du? / Was meinst du?) et des réactions (Wirklich? / Ach so!).",
    hints: [
      "Alterne : chaque personne ajoute un détail PUIS pose une question (Und du? / Was machst du?).",
      "Glisse une expérience au Perfekt : « Was hast du am Wochenende gemacht? — Ich habe / bin ... ».",
      "Insère une opinion et un accord : « Meiner Meinung nach ... — Da bin ich ganz deiner Meinung. » et conclus (Bis bald!)."
    ],
    solution: "A: Hallo! Ich glaube, wir haben uns noch nicht kennengelernt. Ich bin Sarah.\nB: Hallo Sarah, ich bin Tom. Schön, dich kennenzulernen! Woher kommst du?\nA: Ich komme aus Köln, aber ich studiere hier in Leipzig. Und du?\nB: Ich bin aus Leipzig. Was studierst du denn?\nA: Ich studiere Medizin. Es ist anstrengend, aber sehr interessant. Was machst du beruflich?\nB: Ich arbeite als Grafiker. Ach, Medizin, das ist bestimmt schwer! Was hast du am Wochenende gemacht?\nA: Ich war mit Freunden im Kino. Wir haben einen tollen Film gesehen. Und du?\nB: Wirklich? Ich bin zu Hause geblieben und habe ein Buch gelesen. Liest du auch gern?\nA: Ja, sehr! Meiner Meinung nach ist Lesen die beste Art zu entspannen. Was meinst du?\nB: Da bin ich ganz deiner Meinung. Aber ich koche auch gern.\nA: Ach so, interessant! Also, es war wirklich schön, mit dir zu reden.\nB: Ja, finde ich auch. Vielleicht sehen wir uns bald wieder. Bis bald, Sarah!\nA: Gern! Bis bald, Tom!\n\n(Traduction : A : Salut ! Je crois qu'on ne se connaît pas encore. Je suis Sarah. B : Salut Sarah, je suis Tom. Ravi de faire ta connaissance ! D'où viens-tu ? A : Je viens de Cologne, mais j'étudie ici à Leipzig. Et toi ? B : Je suis de Leipzig. Qu'est-ce que tu étudies ? A : J'étudie la médecine. C'est fatigant, mais très intéressant. Que fais-tu comme métier ? B : Je travaille comme graphiste. Ah, la médecine, c'est sûrement difficile ! Qu'as-tu fait ce week-end ? A : Je suis allée au cinéma avec des amis. On a vu un super film. Et toi ? B : Vraiment ? Je suis resté à la maison et j'ai lu un livre. Tu aimes lire aussi ? A : Oui, beaucoup ! À mon avis, lire est la meilleure façon de se détendre. Qu'en penses-tu ? B : Je suis tout à fait d'accord. Mais j'aime aussi cuisiner. A : Ah, intéressant ! Bon, c'était vraiment agréable de discuter avec toi. B : Oui, je trouve aussi. On se reverra peut-être bientôt. À bientôt, Sarah ! A : Avec plaisir ! À bientôt, Tom !)",
    note: "Une conversation vivante repose sur le va-et-vient : ne laisse jamais une réplique sans relance. Varie les réactions (Wirklich?, Ach so!, interessant!) et n'oublie pas d'ouvrir ET de clore proprement (salutation / prise de congé). C'est ton dernier exercice : tu maîtrises désormais les bases du B1. Weiter so!" }
  ]
};
