<script>
var DAY = {
  num: 15,
  title: "Recherche, pagination et qualité (dotnet format, couverture)",
  subtitle: "Soigner l'expérience — sans N+1, avec la performance prouvée.",
  theory: `
<h3>1. Recherche + pagination</h3>
<p>Deux besoins très concrets d'un catalogue : la <strong>recherche</strong> (ne montrer que les jeux dont le titre contient un mot) et la <strong>pagination</strong> (afficher les résultats par paquets — 10 par « page » — au lieu de tout charger d'un coup). Le code ci-dessous est une <strong>action</strong> : la méthode C# du serveur qui répond quand on visite une adresse.</p>
<pre class="pseudo">public async Task&lt;IActionResult&gt; Index(string? q, int page = 1) {   // action : q = texte cherché (optionnel), page = n° de page (défaut 1)
    var query = _db.Jeux.Include(j => j.Categorie).AsQueryable();   // Include = charge la catégorie AVEC les jeux (eager) → pas de N+1
    if (!string.IsNullOrEmpty(q)) query = query.Where(j => j.Titre.Contains(q));   // si un texte est saisi : ne garder que les titres qui le contiennent
    var jeux = await query.OrderBy(j => j.Titre)                    // trier les résultats par titre, puis…
        .Skip((page - 1) * 10).Take(10).ToListAsync();             // …sauter les pages précédentes, prendre 10 résultats, exécuter la requête
    return View(new CatalogueVm(jeux, q, page));                    // envoyer à la vue les jeux + l'état (recherche, page)
}                                                                  // fin de l'action</pre>
<p>Décryptons le vocabulaire. <code>_db.Jeux</code> est la table des jeux ; <strong>EF Core</strong> (Entity Framework Core) est l'outil qui traduit ces manipulations C# en <strong>requêtes SQL</strong> (les ordres envoyés à la base de données). <code>.Where(…)</code>, <code>.OrderBy(…)</code>, <code>.Skip(…)</code>, <code>.Take(…)</code> sont des briques <strong>LINQ</strong> (le langage de requêtes intégré à C#) : filtrer, trier, sauter, prendre. <code>Skip((page-1)*10).Take(10)</code> est le cœur de la pagination : sauter les pages déjà vues, puis prendre les 10 suivants. <code>await</code> attend la réponse de la base sans figer le serveur. Enfin, l'état (recherche, page) vit dans l'<strong>URL</strong> (l'adresse de la page) : <code>/catalogue?q=catan&amp;page=2</code> est partageable, rechargeable, indexable par un moteur de recherche. Un <strong>ViewModel</strong> (ici <code>CatalogueVm</code>) est un petit sac de données taillé sur mesure pour la page.</p>

<h3>2. Le problème N+1</h3>
<p>Le <strong>N+1</strong> est le piège de performance le plus courant. Imaginez afficher 10 jeux avec leur catégorie : une requête ramène les 10 jeux, puis — sans précaution — une requête <em>de plus</em> par jeu pour aller chercher sa catégorie. Soit 1 + 10 = 11 requêtes. C'est comme aller au marché et refaire tout le trajet une fois par légume, au lieu de tout rapporter dans un seul panier.</p>
<pre class="pseudo">// SANS Include : 1 requête pour les 10 jeux + 10 requêtes pour leurs catégories
//   = 11 requêtes (N+1). Sur 100 lignes -> 101 requêtes : la page rame.
// AVEC Include(j => j.Categorie) : une jointure, une requête.</pre>
<p>La parade est <code>Include(j =&gt; j.Categorie)</code>, appelée <strong>chargement eager</strong> (« impatient ») : EF ramène jeux ET catégories en une seule <strong>jointure</strong> (une requête qui assemble deux tables d'un coup). Une requête au lieu de onze.</p>

<h3>3. La performance devient testable</h3>
<p>Éviter le N+1 ne suffit pas : il faut le <strong>prouver</strong>, sinon quelqu'un le réintroduira sans le voir. On branche un <strong>intercepteur</strong> (<code>DbCommandInterceptor</code>) — un mouchard qui compte les requêtes SQL réellement envoyées — et un test vérifie que ce nombre reste petit.</p>
<pre class="pseudo">// un DbCommandInterceptor compte les commandes SQL exécutées
[Fact] public async Task Catalogue_sans_n_plus_un() {     // [Fact] = une méthode marquée comme test automatique
    _compteur.Reset();                                    // remettre le compteur de requêtes à zéro
    await _client.GetAsync("/catalogue");                 // demander la page catalogue (comme un vrai navigateur)
    _compteur.Requetes.Should().BeLessThanOrEqualTo(2);   // exiger au plus 2 requêtes SQL : pas 1 par jeu
}                                                         // fin du test</pre>
<p>C'est l'équivalent .NET de <code>assertNumQueries</code> : « pas de N+1 » n'est plus un espoir, c'est une <strong>garantie vérifiée</strong> par la CI (le robot qui rejoue les tests à chaque envoi de code).</p>

<h3>4. dotnet format resserre le style</h3>
<p><code>dotnet format</code> est un <strong>formateur</strong> : un outil qui réécrit le code selon des règles fixes (indentation, espaces, retours à la ligne), pour que tout le monde produise le même style sans en débattre.</p>
<pre class="pseudo">dotnet format                      # en local, avant de committer : range le code
dotnet format --verify-no-changes  # en CI : rouge si un fichier n'est pas au format
# le style est tranché une fois pour toutes ; la revue porte sur la logique</pre>
<p>Le style étant réglé par la machine, la <strong>revue de code</strong> humaine (la relecture par un collègue) se concentre sur la logique, pas sur les espaces.</p>

<h3>5. Un pipeline qui garde tout</h3>
<div class="warn">Compter les requêtes SQL en test transforme la performance en propriété vérifiable, au même titre que la correction (tests) ou la sécurité (accès croisé). Le N+1 est le piège de performance le plus courant avec EF Core (lazy/lazy proxies) : il passe inaperçu sur 3 lignes de données de test et écroule la prod sur 10 000. Le test le fige pour de bon.</div>
<div class="tip">À ce stade, le pipeline garde le code <strong>correct</strong> (tests), <strong>sûr</strong> (accès croisé, gitleaks), <strong>rapide</strong> (compte de requêtes) ET <strong>propre</strong> (dotnet format) — sans effort humain répété. C'est le dividende de l'outillage posé dès la semaine 1.</div>`,
  exercises: [
    { type: "qcm", q: "L'état de recherche/page vit dans…", opts: ["La session", "L'URL (?q=&page=)", "Un cookie", "La RAM"], a: 1, exp: "Partageable, rechargeable." },
    { type: "qcm", q: "Le problème N+1, c'est…", opts: ["Une surconsommation de RAM", "1 requête + N requêtes filles au lieu d'une", "Un problème de chiffrement", "Un défaut de cache"], a: 1, exp: "Explose avec le volume." },
    { type: "qcm", q: "Include(j => j.Categorie)…", opts: ["Ralentit la requête", "Charge la catégorie en une jointure (anti-N+1)", "Chiffre les données", "Pagine les résultats"], a: 1, exp: "Eager loading." },
    { type: "qcm", q: "Skip/Take servent à…", opts: ["Tout charger d'un coup", "Paginer (10 par page)", "Trier via l'URL", "Chiffrer la liste"], a: 1, exp: "Pas de scan complet." },
    { type: "qcm", q: "Where(j => j.Titre.Contains(q)) fait…", opts: ["Un simple tri", "Une recherche par titre", "Une suppression", "Une mise en cache"], a: 1, exp: "Filtre (traduit en LIKE)." },
    { type: "qcm", q: "On PROUVE l'absence de N+1 en…", opts: ["En regardant l'écran", "Comptant les requêtes SQL (intercepteur)", "En espérant que ça tienne", "En chiffrant les requêtes"], a: 1, exp: "assertLessThanOrEqual." },
    { type: "qcm", q: "Le N+1 passe inaperçu…", opts: ["Toujours, quoi qu'il arrive", "Sur peu de données de test, puis écroule la prod", "Jamais visible", "Seulement en CI"], a: 1, exp: "D'où le test." },
    { type: "qcm", q: "Un DbCommandInterceptor…", opts: ["Chiffre les commandes", "Intercepte et compte les commandes SQL", "Déploie l'application", "Applique la feuille de style"], a: 1, exp: "Équivalent assertNumQueries." },
    { type: "qcm", q: "dotnet format --verify-no-changes en CI…", opts: ["Reformate silencieusement", "Échoue si le format n'est pas respecté", "Déploie l'application", "Chiffre le code"], a: 1, exp: "dotnet format reformate en local." },
    { type: "qcm", q: "Le pipeline garde le code…", opts: ["Juste correct", "Correct, sûr, rapide ET propre", "Rien de particulier", "Bon seulement en prod"], a: 1, exp: "Dividende de l'outillage." },
    { type: "vf", q: "Compter les requêtes rend la performance vérifiable, comme la correction.", a: true, exp: "Propriété testée." },
    { type: "qcm", q: "AsQueryable() permet…", opts: ["De tout charger puis filtrer", "De composer la requête (Where conditionnel) avant exécution", "De chiffrer la requête", "De déployer l'app"], a: 1, exp: "Requête différée." },
    { type: "qcm", q: "Sans Include, 100 jeux = …", opts: ["1 seule requête", "101 requêtes (N+1)", "Aucune requête", "10 requêtes"], a: 1, exp: "La page rame." },
    { type: "qcm", q: "La revue humaine, grâce à dotnet format, porte sur…", opts: ["Les espaces et l'indentation", "La logique", "Rien de précis", "La feuille de style"], a: 1, exp: "Format automatisé." },
    { type: "vf", q: "Le N+1 est le piège de performance le plus courant avec EF Core.", a: true, exp: "Fréquent et sournois." }
  ],
  final: {
    title: "Exercice final — Recherche paginée, sans N+1",
    intro: `<p>Pagination + anti-N+1 prouvé + dotnet format.</p>`,
    questions: [
      { type: "qcm", q: "La recherche paginée met l'état :", opts: ["dans l'URL (?q=&page=)", "en session", "dans un cookie", "en RAM"], a: 0, exp: "Partageable." },
      { type: "qcm", q: "Le N+1 est évité par :", opts: ["Include(j => j.Categorie)", "davantage de RAM", "un cache maison", "un peu de chance"], a: 0, exp: "Une jointure." },
      { type: "qcm", q: "On le PROUVE par :", opts: ["un test qui compte les requêtes (intercepteur)", "une capture d'écran", "une ligne de log", "rien du tout"], a: 0, exp: "Vérifié." },
      { type: "qcm", q: "Le format est garanti par :", opts: ["dotnet format en CI", "une relecture manuelle", "personne en particulier", "une tâche cron"], a: 0, exp: "Tranché." },
      { type: "vf", q: "À ce stade le pipeline garde correct, sûr, rapide et propre.", a: true, exp: "Dividende." }
    ],
    solution: `<pre class="pseudo">public async Task<IActionResult> Index(string? q, int page = 1) {   // action : q = recherche, page = n° de page
  var query = _db.Jeux.Include(j => j.Categorie).AsQueryable();      // Include = catégorie chargée en une jointure (anti-N+1)
  if (!string.IsNullOrEmpty(q)) query = query.Where(j => j.Titre.Contains(q));   // filtrer par titre si un texte est saisi
  var jeux = await query.OrderBy(j => j.Titre).Skip((page-1)*10).Take(10).ToListAsync();   // trier, paginer, exécuter
  return View(new CatalogueVm(jeux, q, page));                       // rendre la vue avec les jeux et l'état
}
[Fact] async Task Sans_n_plus_un() {                                 // test automatique
  _compteur.Reset(); await _client.GetAsync("/catalogue");           // compteur à zéro, puis appeler la page
  _compteur.Requetes.Should().BeLessThanOrEqualTo(2);                // exiger au plus 2 requêtes SQL
}
// dotnet format --verify-no-changes en CI</pre>
<p>Recherche rapide et prouvée. Demain : les trois espaces client/vendeur/admin, cloisonnés.</p>`
  }
};
</script>
