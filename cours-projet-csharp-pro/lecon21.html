  title: "Récapitulatif : le projet professionnel de bout en bout (examen)",
  subtitle: "Construire, industrialiser, sécuriser — les trois disciplines, en même temps.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et la Ludothèque pro (en <strong>C#</strong> avec <strong>ASP.NET Core</strong>, le cadre de développement web de Microsoft) a été construite, mise en conteneur, testée, sécurisée, livrée et surveillée — comme en entreprise. Récapitulons ; chaque terme technique ci-dessous a été défini, avec son analogie, dans sa leçon.</p>

<h3>1. Fondations outillées (semaine 1)</h3>
<p>Le <strong>dépôt</strong> (l'entrepôt où l'équipe range et versionne le code), le <strong>Compose</strong> (le fichier qui démarre l'application et sa base d'un seul geste) et le <strong>pipeline</strong> (la chaîne de montage automatique) posés <strong>avant le métier</strong> ; la « Definition of Done » (« définition de terminé » : code + tests + format + image) ; le <strong>schéma</strong> de la base (sa structure) migré par <strong>EF Core</strong> (l'outil qui traduit le C# en SQL) dans un conteneur, index anticipés ; entités et services <strong>testés dès l'écriture</strong> (<strong>xUnit</strong> pour écrire les tests, <strong>Moq</strong> pour simuler la base) ; API et job de tests avec MySQL, au vert.</p>

<h3>2. Le métier, sécurisé et testé (semaine 2)</h3>
<p>Validation des saisies (<strong>DataAnnotations</strong>) en liste d'autorisation (n'accepter que le prévu) ; authentification <strong>durcie dès le premier compte</strong> (<strong>Identity</strong> + <strong>PBKDF2</strong>, l'algorithme qui hache les mots de passe, et cookies) ; autorisation par policy et par ressource, <strong>anti-IDOR testé</strong> (empêcher de lire les données d'autrui en changeant un numéro dans l'URL) ; louer/acheter <strong>transactionnels</strong> (tout ou rien, avec un verrou <code>FOR UPDATE</code> sur le stock), prix figé, couverture-cliquet (<strong>coverlet</strong> mesure la part de code testée) ; frontend <strong>Razor</strong> échappé + en-têtes de sécurité ; secrets hors du code, scannés par <strong>gitleaks</strong>.</p>

<h3>3. La livraison professionnelle (semaine 3)</h3>
<p>Recherche et pagination sans <strong>N+1</strong> (le piège des requêtes en cascade, <strong>testé</strong>, corrigé par <code>Include</code>) ; espaces cloisonnés (chaque rôle a son test de refus croisé) ; image de prod <strong>multi-stage, non-root, scannée</strong> (fabriquée en deux temps, tournant sans privilèges, inspectée par <strong>trivy</strong>) ; pipeline complet + protection de branche ; déploiement automatisé staging/prod + <code>/health</code> (la sonde de santé, <strong>Health Checks</strong>) ; observabilité, sauvegardes, RGPD, rollback N-1 (retour à la version précédente sans casser la base).</p>

<h3>Le trajet d'une fonctionnalité</h3>
<pre class="pseudo">branche -> code + test écrits ENSEMBLE + validation + autorisation
  -> CI (tests MySQL, dotnet format, gitleaks, image+scan) -> revue -> merge
  -> staging auto -> recette -> tag -> build+scan+push -> approbation -> prod -> /health</pre>
<div class="tip">À aucun moment le métier n'avance sans son test ni sa protection. C'est la vraie différence avec le Niveau 6 — et le quotidien d'une équipe pro. Bonne épreuve, la dernière de la formation !</div>`,

    { type: "qcm", q: "Louer/acheter sont…", opts: ["Non testés", "Transactionnels (FOR UPDATE), écrits avec leur test", "En prod seulement", "Optionnels"], a: 1, exp: "Verrouillés en CI." },
    { type: "qcm", q: "Le montant d'un achat…", opts: ["Vient du POST", "Est figé (copié de jeu.PrixAchat)", "Est nul", "Change avec le prix"], a: 1, exp: "Une facture ne change pas." },

    { type: "qcm", q: "Les secrets vivent…", opts: ["Dans le code", "Hors code/image (env/user-secrets), scannés par gitleaks", "En clair", "Dans Git"], a: 1, exp: "Config par environnement." },
    { type: "qcm", q: "La performance (N+1) est…", opts: ["Espérée", "Testée (compte de requêtes)", "Ignorée", "En prod seulement"], a: 1, exp: "Comportement vérifié." },
    { type: "qcm", q: "Chaque espace a…", opts: ["Rien", "Son test de refus croisé", "Un WAF", "Un cache"], a: 1, exp: "Matrice verrouillée." },
    { type: "qcm", q: "L'image de prod est…", opts: ["Le Dockerfile de dev", "Multi-stage (aspnet), non-root, scannée (trivy)", "En latest", "Sans tag"], a: 1, exp: "Objet de confiance." },
    { type: "qcm", q: "Un tag v* déclenche…", opts: ["Les tests seuls", "Build + scan + push d'un artefact versionné", "Un email", "Rien"], a: 1, exp: "Release." },
    { type: "qcm", q: "main est protégée par…", opts: ["La bonne volonté", "tests+qualite+securite+image verts + revue, sans bypass", "un mot de passe", "rien"], a: 1, exp: "Mécanique." },
    { type: "qcm", q: "Le déploiement en prod…", opts: ["À chaque commit", "Sur tag + approbation, puis /health vérifié", "À la main", "Jamais"], a: 1, exp: "Décision humaine du moment." },
    { type: "qcm", q: "Le rollback est trivial grâce…", opts: ["À la chance", "Aux images immuables + migrations N-1", "À un WAF", "Au CSS"], a: 1, exp: "Retour < 5 min." },
    { type: "qcm", q: "Le principe directeur du cours :", opts: ["Construire puis outiller", "Construire, industrialiser, sécuriser EN MÊME TEMPS", "Outiller puis construire", "Le hasard"], a: 1, exp: "Les trois disciplines ensemble." }
  ],
  final: {

      { type: "qcm", q: "Le développement :", opts: ["Branche courte ; code + test + validation + autorisation écrits ensemble", "code sur main", "sans test", "sans branche"], a: 0, exp: "Les 3 disciplines dès le code." },
      { type: "qcm", q: "La PR est mergeable quand :", opts: ["tests+qualite+securite+image verts + 1 revue", "l'auteur insiste", "vendredi", "le chef décide"], a: 0, exp: "Barrière mécanique." },
      { type: "qcm", q: "Après le merge :", opts: ["Staging se déploie seul, recette", "la prod direct", "rien", "un rebuild manuel"], a: 0, exp: "Répétition générale." },
      { type: "qcm", q: "git push origin v1.3.0 enchaîne :", opts: ["Build+scan+push -> approbation -> prod -> /health", "rien", "les tests seuls", "un email"], a: 0, exp: "Livraison automatisée." },
      { type: "vf", q: "À aucun moment le métier n'avance sans son test ni sa protection.", a: true, exp: "🎓 La marque du Niveau 8." }
    ],
    solution: `<pre class="pseudo">git switch -c feature/reservation
  service métier + test + validation + autorisation ENSEMBLE
  push -> CI : tests(MySQL) + qualite(dotnet format) + securite(gitleaks) + image(scan)
  revue -> merge (protection de branche)
  -> STAGING auto -> recette
git tag v1.3.0
  -> build + scan CVE + push registre
  -> approbation -> déploiement prod (pull/up, EF migre)
  -> curl /health 200 ; logs et sauvegardes en place ; rollback prêt (N-1)</pre>
<p>🎓 <strong>Félicitations — et bravo pour toute la formation !</strong> Tu as mené un projet full-stack C# · ASP.NET comme une vraie équipe : construit, conteneurisé, testé, sécurisé, livré par un pipeline et exploité. Non plus « d'abord l'app, puis les outils », mais les trois disciplines d'un même pas. C'est exactement le métier.</p>`
  }
};
