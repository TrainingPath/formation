<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "Ce qui change au Niveau 8 : on pose les outils AVANT d'écrire la première ligne métier.",
  theory: `
<h3>1. La différence avec le Niveau 6</h3>
<p>Avant tout, posons le vocabulaire, car chaque mot compte. Un <strong>programme</strong> est une suite d'instructions (des ordres) que l'ordinateur exécute ; une <strong>application</strong> (ou « app ») est un programme complet destiné à des utilisateurs — ici la « Ludothèque », qui gère une collection de jeux. Un <strong>projet</strong>, lui, ne se limite pas au programme : c'est l'ensemble du code ET des outils qui servent à le fabriquer, le vérifier et le livrer.</p>
<p>Quelques termes reviennent sans cesse ; définissons-les une bonne fois. Un <strong>dépôt Git</strong> (en anglais « repository », abrégé « repo ») est un classeur qui conserve l'historique de toutes les versions du code — imagine un « annuler / rétablir » géant qui n'oublie jamais rien et permet à plusieurs personnes de travailler ensemble sans écraser le travail des autres ; <em>Git</em> est l'outil qui gère ce classeur. <strong>Docker</strong> est un outil qui range une application dans une « boîte » autonome appelée <strong>conteneur</strong> : la boîte contient l'app et tout ce dont elle a besoin pour tourner, comme un plat surgelé contient le repas et sa notice — il se réchauffe pareil dans n'importe quel four. <strong>Docker Compose</strong> décrit, dans un fichier, plusieurs de ces boîtes qui fonctionnent ensemble (par exemple l'app et sa base de données) et les démarre d'une seule commande. Un <strong>pipeline CI</strong> (« CI » = intégration continue) est un robot qui, à chaque modification envoyée, reconstruit le projet et lance automatiquement tous les tests, comme un contrôle qualité en bout de chaîne d'usine. « <strong>dotnet</strong> » est la ligne de commande de l'écosystème .NET (la technologie dans laquelle on code, ici en langage C#).</p>
<p>Au Niveau 6, tu as construit la Ludothèque « à la main » : l'app d'abord, puis (aux cours d'outillage) les conteneurs, le pipeline et la sécurité. Ici, on inverse : le <strong>dépôt Git</strong>, le <strong>Docker Compose</strong>, le <strong>pipeline CI (dotnet)</strong> et la règle « rien n'entre dans <code>main</code> sans CI verte » existent <strong>dès le jour 1</strong> — <code>main</code> est la branche principale, la version officielle du code, et « CI verte » signifie que tous les tests automatiques ont réussi. Chaque fonctionnalité naîtra ainsi outillée, testée et surveillée dès sa première ligne.</p>

<h3>2. L'arborescence du projet pro</h3>
<p>L'<strong>arborescence</strong> est la liste des dossiers et fichiers du projet, dessinée comme un arbre (d'où le nom). Voici celle de notre projet ; chaque ligne donne un fichier ou un dossier, puis son rôle en quelques mots.</p>
<pre class="pseudo">Ludotheque.sln
src/Ludotheque/            projet web (Domain, Data, Services, Controllers, Views)
tests/Ludotheque.Tests/    xUnit : unitaires + intégration
Dockerfile                 l'image (multi-stage : build SDK puis runtime aspnet)
compose.yaml               app + MySQL, réseau, volume (dev)
.github/workflows/ci.yml   tests + format + build à chaque commit
appsettings.json           config NON sensible (versionnée)
.gitignore .dockerignore   bin/, obj/, *.user, appsettings.*.local.json</pre>
<p>Décodons les nouveaux mots. Un fichier <code>.sln</code> (« solution ») est le sommaire qui regroupe les différents sous-projets. <strong>xUnit</strong> est un outil qui exécute des <strong>tests</strong> : de petits programmes qui vérifient automatiquement que le code fait bien ce qu'on attend, comme une check-list de sécurité avant décollage (un test « unitaire » vérifie une brique isolée, un test « d'intégration » vérifie que plusieurs briques marchent ensemble). Un <strong>Dockerfile</strong> est la recette écrite qui explique comment fabriquer l'<strong>image</strong> — le « moule » figé à partir duquel on crée des conteneurs identiques ; « multi-stage » veut dire que la recette se fait en deux temps : on construit avec la grosse trousse à outils du développeur (le <em>SDK</em>) puis on ne garde que le strict nécessaire pour faire tourner l'app (le <em>runtime</em>). <strong>MySQL</strong> est une <strong>base de données</strong> : un grand cahier organisé où l'app range durablement ses informations. Un <strong>volume</strong> est un espace de stockage qui survit à l'extinction du conteneur (sinon les données s'effaceraient à chaque arrêt, comme un tableau blanc essuyé). <code>appsettings.json</code> contient la <strong>configuration</strong> non sensible (des réglages), et le <code>.gitignore</code> liste les fichiers à ne PAS mettre dans le dépôt (fichiers temporaires, secrets…).</p>
<p>L'application n'est qu'un projet parmi d'autres : l'infrastructure (Docker, CI) est du <strong>code</strong> à part entière, versionnée avec le reste.</p>

<h3>3. La « Definition of Done »</h3>
<p>La <strong>Definition of Done</strong> (« définition de ce qui est terminé ») est la liste des conditions à remplir pour déclarer une tâche vraiment finie — un contrat d'équipe qui remplace le vague « je crois que c'est bon ».</p>
<pre class="pseudo">Une fonctionnalité n'est « faite » que si :
  ✔ le code est écrit
  ✔ ses tests passent (unitaires + intégration)
  ✔ le format est propre (dotnet format)
  ✔ l'image build (rien de cassé côté emballage)
  ✔ la PR est relue et la CI verte
« Ça marche chez moi » ne fait pas partie de la définition.</pre>
<p>Chaque point est <strong>vérifiable</strong> par une machine ou une personne : les tests passent, le <strong>format</strong> du code est propre (l'outil <code>dotnet format</code> réaligne la présentation, comme un correcteur de mise en page), l'<strong>image</strong> se construit sans erreur, et la <strong>PR</strong> (« pull request », la demande de fusionner son travail) est relue. La phrase « ça marche chez moi » est bannie : seule une machine neutre — la CI — fait foi.</p>

<h3>4. Le flux Git d'équipe (GitHub Flow)</h3>
<p>Un <strong>flux</strong> (« workflow ») est la façon convenue de faire circuler les modifications. Le <strong>GitHub Flow</strong> repose sur des <strong>branches</strong> : une branche est une copie de travail parallèle où l'on modifie le code sans toucher à la version officielle, comme un brouillon qu'on ne recopie au propre qu'une fois validé.</p>
<pre class="pseudo">main toujours déployable — personne n'y committe en direct
1 branche courte par changement (feature/…, fix/…)
push tôt -> pull request -> CI verte + revue -> merge -> branche supprimée</pre>
<p>La branche <code>main</code> reste toujours « déployable » (prête à être mise en service). Pour chaque changement, on crée une petite branche (<code>feature/…</code> pour une nouveauté, <code>fix/…</code> pour une correction), on « pousse » (envoie) son travail tôt, on ouvre une <strong>pull request</strong>, la CI et un collègue la relisent, puis on <strong>fusionne</strong> (« merge ») dans <code>main</code> avant de supprimer la branche devenue inutile. Un <strong>commit</strong> est un instantané enregistré du code à un moment donné, comme une sauvegarde nommée.</p>

<h3>5. Les trois disciplines en parallèle</h3>
<p>Le cours mène de front trois métiers complémentaires, décrits ci-dessous.</p>
<pre class="pseudo">CONSTRUIRE     le métier (entités EF, services, API, frontend Razor)
INDUSTRIALISER conteneurs, tests, CI, image, pipeline
SÉCURISER      entrées, secrets, auth, RGPD — par conception
À chaque leçon, les trois avancent ENSEMBLE, jamais l'une sans les autres.</pre>
<p>« Construire », c'est écrire le <strong>métier</strong> — la logique propre à l'application : les <strong>entités</strong> (comme un Jeu ou un Membre) gérées par <strong>EF</strong> (Entity Framework, l'outil qui relie le code à la base de données), les <strong>services</strong> qui contiennent les règles, l'<strong>API</strong> (l'ensemble des fonctions que l'app offre à l'extérieur) et le <strong>frontend Razor</strong> qui produit les pages web affichées à l'utilisateur. « Industrialiser », c'est mettre en place conteneurs, tests, CI et image pour fabriquer de façon fiable et répétable. « Sécuriser », c'est protéger dès la conception : valider les <strong>entrées</strong> (ce que tape l'utilisateur), cacher les <strong>secrets</strong> (mots de passe, clés), gérer l'<strong>authentification</strong> (vérifier qui est qui) et respecter le <strong>RGPD</strong> (la loi européenne sur les données personnelles). À chaque leçon, les trois avancent ENSEMBLE, jamais l'une sans les autres.</p>
<div class="warn">La tentation reste de « coder d'abord, outiller après ». C'est précisément ce que ce niveau corrige : ajouter les tests, la sécurité ou la conteneurisation à la fin coûte dix fois plus cher (rétrofit) que de les poser au fil de l'eau. Le setup pro du jour 1 est un investissement, pas une perte de temps.</div>
<div class="tip">Prérequis assumés : tu maîtrises déjà ASP.NET Core (capstone N4), Docker, la CI/CD et la sécurité (N5). Ce cours ne réexplique pas ces briques — il les fait <strong>travailler ensemble</strong> sur un vrai projet.</div>`,
  exercises: [
    { type: "qcm", q: "Au Niveau 8, on pose les outils…", opts: ["À la fin, comme au Niveau 6", "Dès le jour 1, avant le métier", "Jamais", "Seulement en prod"], a: 1, exp: "Construire EN outillant." },
    { type: "qcm", q: "L'infrastructure (Docker, CI) est…", opts: ["Un réglage externe", "Du code versionné avec le projet", "Manuelle", "Secrète"], a: 1, exp: "Dockerfile, compose.yaml, ci.yml dans le dépôt." },
    { type: "qcm", q: "Le fichier du pipeline se trouve dans…", opts: [".github/workflows/", "/etc/ci", "le .csproj", "la base"], a: 0, exp: "Versionné, revu en PR." },
    { type: "qcm", q: "Les secrets sont…", opts: ["Dans le dépôt", "Hors Git ET hors image", "Dans l'image", "Dans appsettings.json commité"], a: 1, exp: "Variables d'env / user-secrets." },
    { type: "qcm", q: "La Definition of Done inclut…", opts: ["Le code seul", "Code + tests + format + image + PR relue", "Juste que ça compile", "Rien"], a: 1, exp: "Contrat d'équipe." },
    { type: "qcm", q: "« Ça marche chez moi »…", opts: ["Suffit", "Ne fait pas partie de la définition de fait", "Est un test", "Est la CI"], a: 1, exp: "La CI tranche sur une machine neutre." },
    { type: "qcm", q: "Dans GitHub Flow, main est…", opts: ["Une branche de brouillon", "Toujours déployable, jamais committée en direct", "Supprimée souvent", "Facultative"], a: 1, exp: "Le pivot." },
    { type: "qcm", q: "Un changement part…", opts: ["Directement sur main", "D'une branche courte + PR", "Sans branche", "En prod"], a: 1, exp: "PR obligatoire." },
    { type: "qcm", q: "Les trois disciplines menées en parallèle :", opts: ["Construire, industrialiser, sécuriser", "Coder, tester, dormir", "Analyser, coder, livrer", "Aucune"], a: 0, exp: "Ensemble, à chaque leçon." },
    { type: "qcm", q: "Ajouter la sécurité à la fin (rétrofit)…", opts: ["Est gratuit", "Coûte bien plus cher que par conception", "Est impossible", "Est mieux"], a: 1, exp: "D'où le « par conception »." },
    { type: "vf", q: "Le Docker Compose et le pipeline existent avant la première fonctionnalité métier.", a: true, exp: "Le setup pro du jour 1." },
    { type: "qcm", q: "L'app ASP.NET, dans l'arborescence, est…", opts: ["Le seul élément", "Un projet parmi d'autres (à côté de Dockerfile, ci.yml…)", "Absente", "Dans l'image seule"], a: 1, exp: "L'infra l'entoure." },
    { type: "qcm", q: "Ce cours suppose acquis…", opts: ["Rien", "ASP.NET Core (N4), Docker, CI/CD et Sécurité (N5)", "Le CSS seul", "L'assembleur"], a: 1, exp: "Il les fait travailler ensemble." },
    { type: "qcm", q: "Les versions de paquets (NuGet) doivent être…", opts: ["Figées / gérées (reproductibles)", "Aléatoires", "En 'latest'", "Secrètes"], a: 0, exp: "Reproductibilité du build." },
    { type: "vf", q: "Au Niveau 8, chaque fonctionnalité naît testée et surveillée.", a: true, exp: "Le pipeline est là dès le départ." }
  ],
  final: {
    title: "Exercice final — Les fondations posées",
    intro: `<p>On vérifie que le projet démarre « à la pro ».</p>`,
    questions: [
      { type: "qcm", q: "Avant d'écrire du métier, on met en place :", opts: ["Dépôt Git + Compose + pipeline + secrets hors Git", "juste l'app", "un zip", "rien"], a: 0, exp: "Le setup du jour 1." },
      { type: "qcm", q: "Une fonctionnalité est « faite » quand :", opts: ["Code + tests verts + format + image build + PR relue", "elle compile", "on l'a poussée", "on le décide"], a: 0, exp: "Definition of Done." },
      { type: "qcm", q: "main se modifie :", opts: ["Via PR (branche courte, CI verte, revue)", "en direct", "par email", "en prod"], a: 0, exp: "GitHub Flow." },
      { type: "qcm", q: "Les secrets vivent :", opts: ["Hors Git et hors image (variables d'env)", "dans le code", "dans l'image", "dans appsettings commité"], a: 0, exp: "Par conception." },
      { type: "vf", q: "Métier, industrialisation et sécurité avancent ensemble, à chaque étape.", a: true, exp: "Le fil du Niveau 8." }
    ],
    solution: `<pre class="pseudo">Ludotheque.sln  src/Ludotheque/  tests/  Dockerfile  compose.yaml
.github/workflows/ci.yml   appsettings.json (non sensible)
secrets hors Git/image     .gitignore  .dockerignore

Definition of Done : code + tests + format + image + PR relue
Flux : branche courte -> PR -> CI verte + revue -> merge sur main
Trois disciplines en parallèle : construire, industrialiser, sécuriser</pre>
<p>Les fondations pro sont posées. Demain : le squelette ASP.NET Core dans Docker Compose.</p>`
  }
};
</script>
