<script>
var DAY = {
  num: 14,
  title: "Secrets et configuration par environnement (appsettings, env)",
  subtitle: "Rien de sensible dans le dépôt ni l'image — et un scan qui le prouve.",
  theory: `
<h3>1. La config par couches</h3>
<p>La <strong>configuration</strong> (« config ») regroupe tous les réglages d'une application : adresse de la base de données, niveau de détail des journaux, options diverses. Un <strong>secret</strong> est un réglage sensible — mot de passe, clé, chaîne de connexion — qui ne doit JAMAIS tomber sous les yeux d'un inconnu. La règle d'or : le code source va dans le <strong>dépôt</strong> (le « repo », l'entrepôt partagé où l'équipe range et versionne le code), mais les secrets, eux, restent dehors.</p>
<p>ASP.NET lit la config par <strong>couches</strong> empilées : il part d'un fichier de base, puis chaque couche suivante peut écraser la précédente, comme des calques transparents posés l'un sur l'autre — le dernier posé masque ce qu'il recouvre.</p>
<pre class="pseudo">// ASP.NET fusionne, dans l'ordre :
//   appsettings.json  ->  appsettings.{Environment}.json  ->  variables d'env  ->  user-secrets (dev)
// le dernier gagne. Les SECRETS ne vivent QUE dans env (prod) ou user-secrets (dev)
var cs = builder.Configuration.GetConnectionString("Default");   // lit la couche gagnante</pre>
<p>Une <strong>variable d'environnement</strong> est un réglage fourni par le système qui fait tourner le programme (le serveur, le conteneur), en dehors du code. C'est le canal idéal pour les secrets : ils n'apparaissent dans aucun fichier versionné. <code>GetConnectionString("Default")</code> lit simplement la valeur gagnante, sans savoir de quelle couche elle provient.</p>

<h3>2. En dev : user-secrets, hors dépôt</h3>
<p><strong>Dev</strong> (développement) désigne votre machine de travail ; <strong>prod</strong> (production) le serveur réel qui sert les vrais utilisateurs. <strong>Committer</strong>, c'est enregistrer une version du code dans Git (un <em>commit</em> = un instantané daté du projet). L'outil <code>user-secrets</code> range vos secrets de dev dans un fichier situé HORS du dossier du projet, donc jamais committé par accident.</p>
<pre class="pseudo">$ dotnet user-secrets init                                          # active le coffre user-secrets pour ce projet
$ dotnet user-secrets set "ConnectionStrings:Default" "Server=..."  # y range la chaine de connexion (un secret)
# stocké HORS du dossier du projet (jamais commité)</pre>

<h3>3. En prod : variables d'environnement</h3>
<p>En production, la chaîne de connexion arrive par une variable d'environnement. Un <strong>conteneur</strong> est une boîte légère et autonome qui emballe l'application et tout ce qu'il lui faut pour tourner à l'identique partout (comme un conteneur maritime standardisé) ; on lui passe ses secrets au démarrage. Le double tiret bas de <code>ConnectionStrings__Default</code> est la façon d'écrire une clé « imbriquée » (<code>ConnectionStrings:Default</code>) sous forme de variable d'environnement.</p>
<pre class="pseudo"># le conteneur reçoit ConnectionStrings__Default par l'environnement
# appsettings.json NE contient QUE du non sensible (niveaux de log, options)</pre>

<h3>4. Le scan de secrets dans la CI</h3>
<p>La <strong>CI</strong> (<em>Continuous Integration</em>, « intégration continue ») est un robot qui, à chaque envoi de code, relance automatiquement tests et vérifications — un contrôle qualité de bout de chaîne. On la décrit dans un fichier <strong>YAML</strong> (un format texte où le décalage à gauche, l'<em>indentation</em>, marque l'imbrication). Un <strong>job</strong> est une tâche confiée à ce robot. Ici, le job <code>securite</code> lance <code>gitleaks</code>, un outil qui fouille le code à la recherche de secrets oubliés.</p>
<pre class="pseudo"># ci.yml — job securite
  securite:                                     # un job nomme "securite"
    steps:                                      # la liste de ses etapes, dans l'ordre
      - uses: actions/checkout@v4               # etape 1 : recuperer le code du depot
        with: { fetch-depth: 0 }              # tout l'historique (pas seulement le dernier commit)
      - run: gitleaks detect --source . --redact --exit-code 1   # etape 2 : scanner ; --exit-code 1 = echouer si un secret est trouve</pre>
<p><code>gitleaks</code> parcourt le code ET l'historique : une chaîne de connexion ou une clé committée (même supprimée depuis) rend le job <strong>rouge</strong> (en échec). <code>fetch-depth: 0</code> demande de récupérer tout le passé, pas seulement le dernier instantané.</p>

<h3>5. La procédure de rotation</h3>
<p>La <strong>rotation</strong> d'un secret, c'est le remplacer par un neuf et rendre l'ancien inutilisable — comme changer la serrure après avoir perdu une clé. Les étapes se lisent comme une checklist, pas comme du code :</p>
<pre class="pseudo">Un secret a fuité (commit, log, capture) ? Il est COMPROMIS, point.
1. RÉVOQUER l'ancien (le désactiver côté fournisseur)
2. RÉGÉNÉRER un nouveau
3. REPOSER dans le coffre / les variables d'environnement
4. VÉRIFIER que tout fonctionne
5. AUDITER : qui a pu le voir, sur quelle période ?</pre>
<div class="warn">Un secret dans l'historique Git n'est PAS effacé par un simple commit de suppression : il reste dans les commits passés, clonables par quiconque. La seule réponse sûre est la <strong>rotation</strong>, pas la réécriture d'historique. D'où <code>fetch-depth: 0</code> : gitleaks scanne tout le passé.</div>
<div class="tip"><strong>Fin de semaine 2.</strong> L'application est complète, testée ET sécurisée : entrées validées, auth durcie (Identity), autorisation anti-IDOR, transactions verrouillées, rendu échappé, secrets hors du code et scannés. On n'a jamais eu à « rattraper » la sécurité — elle a poussé avec le code.</div>`,
  exercises: [
    { type: "qcm", q: "Les secrets vivent…", opts: ["Dans appsettings.json commité", "Dans les variables d'env (prod) / user-secrets (dev)", "Dans le code", "Dans l'image"], a: 1, exp: "Jamais de valeur dans le dépôt." },
    { type: "qcm", q: "La config ASP.NET fusionne des couches ; la gagnante est…", opts: ["appsettings.json", "La dernière (env / user-secrets)", "Le code", "Le cache"], a: 1, exp: "L'env surcharge le fichier." },
    { type: "qcm", q: "dotnet user-secrets stocke…", opts: ["Dans le projet (commité)", "HORS du dossier du projet (dev)", "Dans l'image", "En clair dans Git"], a: 1, exp: "Secrets de dev hors dépôt." },
    { type: "qcm", q: "appsettings.json commité doit contenir…", opts: ["Les mots de passe", "Uniquement du NON sensible", "Les clés", "Les secrets chiffrés"], a: 1, exp: "Log levels, options." },
    { type: "qcm", q: "gitleaks scanne…", opts: ["Le CSS", "Le code ET l'historique Git", "La RAM", "Le réseau"], a: 1, exp: "fetch-depth: 0." },
    { type: "qcm", q: "Un secret commité puis supprimé…", opts: ["Est effacé", "Reste dans l'historique (compromis)", "Est chiffré", "Disparaît"], a: 1, exp: "Clonable dans les vieux commits." },
    { type: "qcm", q: "La seule réponse sûre à une fuite :", opts: ["Réécrire l'historique", "La rotation (révoquer + régénérer)", "Ignorer", "Chiffrer après coup"], a: 1, exp: "Le secret est compromis." },
    { type: "qcm", q: "La rotation commence par…", opts: ["Régénérer", "Révoquer l'ancien", "Auditer", "Reposer"], a: 1, exp: "Désactiver d'abord." },
    { type: "qcm", q: "gitleaks rouge signifie…", opts: ["Tout va bien", "Un secret détecté -> merge bloqué", "Un déploiement", "Un cache"], a: 1, exp: "Barrière." },
    { type: "qcm", q: "En prod, la chaîne de connexion arrive par…", opts: ["appsettings.json commité", "Une variable d'environnement", "Le code", "Le cookie"], a: 1, exp: "ConnectionStrings__Default." },
    { type: "vf", q: "Écrire la rotation avant d'en avoir besoin est un bon réflexe.", a: true, exp: "Prêt le jour J." },
    { type: "qcm", q: "La même image tourne dev/prod car…", opts: ["On rebuild", "Seule la config d'environnement change", "Le code change", "Par hasard"], a: 1, exp: "Config externalisée." },
    { type: "qcm", q: "fetch-depth: 0 permet à gitleaks…", opts: ["D'aller plus vite", "De scanner tout l'historique", "De déployer", "De chiffrer"], a: 1, exp: "Pas juste le dernier commit." },
    { type: "qcm", q: "En fin de semaine 2, l'app est…", opts: ["À sécuriser plus tard", "Complète, testée ET sécurisée", "Sans tests", "En prod"], a: 1, exp: "Sécurité intégrée." },
    { type: "vf", q: "On n'a jamais eu à « rattraper » la sécurité.", a: true, exp: "Elle a poussé avec le code." }
  ],
  final: {
    title: "Exercice final — Secrets dehors, scannés",
    intro: `<p>Config par couches + gitleaks + rotation.</p>`,
    questions: [
      { type: "qcm", q: "Les secrets vivent :", opts: ["dans l'env (prod) / user-secrets (dev)", "dans appsettings commité", "dans le code", "dans l'image"], a: 0, exp: "Hors dépôt." },
      { type: "qcm", q: "appsettings.json commité contient :", opts: ["uniquement du non sensible", "les mots de passe", "les clés", "les secrets chiffrés"], a: 0, exp: "Log/options." },
      { type: "qcm", q: "Un secret commité est :", opts: ["compromis (à faire tourner)", "effaçable par un commit", "sûr", "chiffré"], a: 0, exp: "Rotation obligatoire." },
      { type: "qcm", q: "La rotation :", opts: ["révoquer + régénérer + reposer + vérifier + auditer", "réécrire l'historique", "ignorer", "chiffrer"], a: 0, exp: "5 étapes." },
      { type: "vf", q: "Fin de semaine 2 : l'app est complète, testée et sécurisée.", a: true, exp: "Sécurité intégrée." }
    ],
    solution: `<pre class="pseudo"># couches : appsettings.json -> appsettings.{Env}.json -> env -> user-secrets (dev)
# dev : dotnet user-secrets set "ConnectionStrings:Default" "..."
# prod : ConnectionStrings__Default fourni par variable d'environnement
# appsettings.json commité = NON sensible seulement

# ci.yml job securite :

    with: { fetch-depth: 0 }                 # tout l'historique, pas juste le dernier commit
  - run: gitleaks detect --source . --redact --exit-code 1   # scanner ; echoue si un secret est trouve
# Rotation : révoquer -> régénérer -> reposer -> vérifier -> auditer</pre>
<p>Semaine 2 bouclée : app sécurisée par conception. Demain : recherche, pagination et qualité.</p>`
  }
};

ble dans\n// les commits passes par quiconque clone. Comme on ne peut garantir que personne ne\n// l'a copie, il est DEFINITIVEMENT compromis -> rotation, pas nettoyage.",
