  title: "Le pipeline complet : build, push, scan, protection",
  subtitle: "Assembler l'usine de bout en bout et verrouiller main.",
  theory: `
<h3>1. Le pipeline de CI, à ce stade</h3>
<p>Un <strong>pipeline</strong> (« chaîne de montage ») est la suite automatique d'étapes que subit chaque envoi de code : compiler, tester, vérifier, emballer. « <strong>Push</strong> » = envoyer ses commits sur le dépôt distant ; « <strong>PR</strong> » (<em>Pull Request</em>, « demande de fusion ») = proposer d'intégrer son travail dans la branche principale, où il sera relu. Voici la forme du pipeline à ce stade :</p>
<pre class="pseudo">push / PR
   ├─ tests (MySQL) + couverture         ┐
   ├─ qualite (dotnet format)            ┤ en parallèle
   └─ securite (gitleaks)                ┘
        └─ image (build + trivy + smoke test)   needs: les trois
BARRIÈRE : merge SEULEMENT si tout est vert + 1 revue.</pre>
<p>Les trois premiers <strong>jobs</strong> (tâches) tournent <strong>en parallèle</strong> (en même temps) pour gagner du temps ; le job <code>image</code> attend qu'ils soient tous verts (<code>needs</code>). Une <strong>branche</strong> est une ligne de développement ; <code>main</code> est la branche principale, celle qu'on déploie. La barrière : on ne fusionne (<em>merge</em>) dans <code>main</code> que si tout est vert ET qu'un collègue a relu.</p>

<h3>2. Le workflow de release (sur tag)</h3>
<p>Un <strong>tag</strong> Git est une étiquette posée sur un commit pour marquer une version (par ex. <code>v1.0.0</code>). Le numéro suit la convention <strong>semver</strong> (<em>Semantic Versioning</em> : majeur.mineur.correctif). Poser un tag <code>v*</code> déclenche le <strong>workflow de release</strong> (« mise en production »), décrit dans ce fichier YAML :</p>
<pre class="pseudo"># .github/workflows/release.yml
on: { push: { tags: ["v*"] } }            # SEUL un tag de version déclenche
jobs:                                     # les taches de ce workflow
  publier:                                # le job qui publie l'image
    steps:                                # ses etapes, dans l'ordre
      - uses: actions/checkout@v4         # recuperer le code du depot
      - run: echo "VERSION=\${GITHUB_REF_NAME#v}" >> "\$GITHUB_ENV"   # v1.0.0 -> 1.0.0
      - run: echo "\${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # se connecter au registre via un secret
      - run: |                            # enchainer plusieurs commandes shell
          docker build -t ghcr.io/toi/ludotheque:\$VERSION .   # construire l'image taguee avec la version
          trivy image --exit-code 1 --severity CRITICAL ghcr.io/toi/ludotheque:\$VERSION   # scanner ; echoue si faille CRITICAL
          docker push ghcr.io/toi/ludotheque:\$VERSION   # publier l'image au registre</pre>
<p><code>GITHUB_REF_NAME#v</code> retire le <code>v</code> du tag (<code>v1.0.0</code> → <code>1.0.0</code>). <code>secrets.REGISTRY_TOKEN</code> est un mot de passe rangé dans le coffre du dépôt, injecté sans jamais apparaître en clair. <code>--password-stdin</code> passe ce jeton par l'entrée standard plutôt que sur la ligne de commande, pour qu'il ne traîne pas dans l'historique. Le <strong>registre</strong> (<code>ghcr.io</code>) est l'entrepôt d'images ; <code>docker push</code> y publie l'image versionnée et immuable. Code et image racontent la même histoire.</p>

<h3>3. La protection de branche</h3>
<p>La <strong>protection de branche</strong> est un réglage du dépôt qui verrouille <code>main</code> : impossible d'y pousser directement, tout passe par une PR qui doit cocher toutes les cases.</p>
<pre class="pseudo">Settings -> Branches -> main :
✔ Require PR + 1 approbation
✔ Require status checks : tests, qualite, securite, image
✔ Require branches up to date ; ✔ no bypass (admins compris)</pre>

<h3>4. Le graphe complet</h3>
<p>Vue d'ensemble des deux chaînes — la CI (à chaque push) et la release (sur tag) — avec leurs durées :</p>
<pre class="pseudo">-- ci.yml --------  (~5-8 min)
push/PR -> tests+qualite+securite (parallèle) -> image -> [si main] staging
-- release.yml ---  (~4-6 min + approbation)
git tag v1.0.0 -> publier (build+scan+push) -> approbation -> production</pre>

<h3>5. La durée compte</h3>
<div class="warn">Un pipeline de 40 minutes se contourne (« je merge, on verra ») ; un pipeline de 7 minutes est utilisé. Les caches (NuGet, build Docker), le parallélisme et des jobs minimaux ne sont pas du confort — ils protègent l'adoption. Un pipeline lent est un pipeline mort.</div>
<div class="tip">Le pipeline réunit les trois cours d'outillage : CI/CD (structure, protection), Docker (image), Sécurité (scans). Un commit tagué déclenche un artefact versionné et scanné ; la barrière de branche garantit que main est toujours déployable — une propriété mécanique, plus une intention.</div>`,
  exercises: [
    { type: "qcm", q: "Les jobs tests/qualite/securite tournent…", opts: ["En série, l'un après l'autre", "En parallèle", "Directement en prod", "Jamais"], a: 1, exp: "Pipeline rapide." },
    { type: "qcm", q: "Le job image dépend de…", opts: ["Aucune dépendance", "needs: [tests, qualite, securite]", "needs: [deploy]", "needs: [main]"], a: 1, exp: "Après les verts." },

    { type: "qcm", q: "La protection de main exige…", opts: ["Aucune règle", "PR + checks (tests/qualite/securite/image) + revue, sans bypass", "Un mot de passe partagé", "Une tâche cron"], a: 1, exp: "main toujours déployable." },
    { type: "qcm", q: "--password-stdin sert à…", opts: ["Gagner en vitesse", "Éviter le jeton dans la ligne de commande", "Chiffrer le dépôt", "Rien de précis"], a: 1, exp: "Pas d'historique shell." },
    { type: "qcm", q: "Un pipeline de 40 min…", opts: ["Est plus rigoureux", "Se contourne", "Est idéal", "N'existe pas"], a: 1, exp: "La durée protège l'adoption." },
    { type: "qcm", q: "Les caches et le parallélisme sont…", opts: ["Du luxe superflu", "Une protection de l'adoption du pipeline", "Quelque chose de dangereux", "Purement décoratifs"], a: 1, exp: "Vitesse = usage." },
    { type: "vf", q: "Un tag Git déclenche un artefact versionné et scanné.", a: true, exp: "Code et image, même histoire." },
    { type: "qcm", q: "Le pipeline réunit…", opts: ["Merise + SQL", "CI/CD + Docker + Sécurité", "La feuille de style", "Rien de précis"], a: 1, exp: "Les trois cours d'outillage." },
    { type: "qcm", q: "« main toujours déployable » est désormais…", opts: ["Un simple vœu", "Une propriété mécanique (protection de branche)", "Un slogan d'équipe", "Une option facultative"], a: 1, exp: "Verrouillé." },
    { type: "qcm", q: "Le registre reçoit…", opts: ["Chaque commit", "Les versions taguées (immuables)", "Rien de particulier", "Le code source"], a: 1, exp: "Artefacts choisis." },
    { type: "vf", q: "L'artefact de release est immuable (on ne re-pousse pas un tag existant).", a: true, exp: "Contrat des versions." }
  ],
  final: {
    title: "Exercice final — L'usine complète",
    intro: `<p>On assemble CI + release et on verrouille main.</p>`,
    questions: [
      { type: "qcm", q: "Un push sur PR déclenche :", opts: ["tests + qualite + securite, puis image", "le déploiement en prod", "rien du tout", "une simple release"], a: 0, exp: "La CI protège." },
      { type: "qcm", q: "Un tag v* déclenche :", opts: ["publier (build + scan + push registre)", "les tests seuls", "staging", "un badge"], a: 0, exp: "La livraison." },
      { type: "qcm", q: "L'image poussée :", opts: ["ghcr.io/...:VERSION (immuable, scannée)", "latest muté", "sans tag", "en clair"], a: 0, exp: "Versionnée." },
      { type: "qcm", q: "main est protégée par :", opts: ["checks + revue + up to date, sans bypass", "la seule bonne volonté", "un mot de passe partagé", "aucune règle"], a: 0, exp: "Mécanique." },
      { type: "vf", q: "Le pipeline reste sous 10 min grâce aux caches et au parallélisme.", a: true, exp: "Adoption." }
    ],
    solution: `<pre class="pseudo"># release.yml
on: { push: { tags: ["v*"] } }            # seul un tag v* declenche la release
jobs:                                     # les taches
  publier:                                # le job de publication
    steps:                                # ses etapes
      - uses: actions/checkout@v4         # recuperer le code
      - run: echo "VERSION=\${GITHUB_REF_NAME#v}" >> "\$GITHUB_ENV"   # v1.0.0 -> 1.0.0
      - run: echo "\${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u toi --password-stdin   # login au registre (secret)
      - run: |                            # enchainer plusieurs commandes
          docker build -t ghcr.io/toi/ludotheque:\$VERSION .   # construire l'image versionnee
          trivy image --exit-code 1 --severity CRITICAL ghcr.io/toi/ludotheque:\$VERSION   # scanner (CRITICAL bloquant)
          docker push ghcr.io/toi/ludotheque:\$VERSION   # publier au registre

# Protection de main : tests+qualite+securite+image verts + 1 revue</pre>
<p>L'usine est complète. Demain : le déploiement automatisé.</p>`
  }
};

securite, image  (+ 1 revue, up to date, no bypass)\n\n# POURQUOI LA RELEASE NE RELANCE PAS TOUTE LA SUITE\n# Le tag est pose sur un commit de MAIN, or main est protegee : ce commit a DEJA\n// passe tests+qualite+securite+image avant d'y entrer. La release EMBALLE et\n// PUBLIE un commit certifie -- elle ne re-verifie pas ce qui l'est deja. Elle\n// re-scanne quand meme l'image publiee (defense en profondeur : une CVE peut\n// etre apparue entre-temps dans une couche de base).",
