<script>
var DAY = {
  num: 20,
  title: "Observabilité, sauvegardes, RGPD et rollback",
  subtitle: "Les filets de la vie en production — un logiciel exploité, pas juste livré.",
  theory: `
<h3>1. Observer</h3>
<p>L'<strong>observabilité</strong>, c'est la capacité à comprendre ce qui se passe dans un programme en marche, sans pouvoir l'arrêter pour l'inspecter. En production il n'y a plus de débogueur : on lit les <strong>logs</strong> (les journaux), la trace écrite des événements. <code>ILogger</code> est l'outil de journalisation de .NET.</p>
<pre class="pseudo">// logs structurés (ILogger), après commit, sans secret
_logger.LogInformation("Location jeu={JeuId} client={ClientId}", jeuId, client.Id);   // journaliser une location réussie (champs nommés)
_logger.LogWarning("Echec de connexion ip={Ip}", ip);   // journaliser un échec de connexion (événement de sécurité)
// en conteneur : logs sur stdout, collectés par Docker ; /health surveillé</pre>
<p>Ce sont des <strong>logs structurés</strong> : au lieu de coller des morceaux de texte, on écrit un message à trous avec des champs nommés (<code>{JeuId}</code>, <code>{ClientId}</code>) — on peut ensuite chercher « toutes les locations du client 42 ». On journalise APRÈS le commit (jamais une action annulée) et JAMAIS de secret (mot de passe, jeton, donnée personnelle brute). <strong>stdout</strong> (« sortie standard ») est le flux de texte par défaut d'un programme ; en conteneur, Docker y récupère les logs automatiquement.</p>

<h3>2. Sauvegarder (chiffré, testé)</h3>
<p>Une <strong>sauvegarde</strong> (<em>backup</em>) est une copie des données mise de côté pour survivre à une perte. <code>mysqldump</code> exporte toute la base dans un fichier texte ; <code>gpg</code> le <strong>chiffre</strong> (le rend illisible sans la clé).</p>
<pre class="pseudo"># sauvegarde : exporter la base (mysqldump) puis la chiffrer (gpg)
docker compose exec bdd mysqldump -uroot -p... ludotheque \\
  | gpg --encrypt --recipient sauvegarde@ludo > backup-\$(date +%F).sql.gpg
# clé de déchiffrement stockée SÉPARÉMENT ; restauration TESTÉE régulièrement
# une sauvegarde jamais restaurée n'est qu'un espoir.</pre>
<p>Deux règles vitales : la <strong>clé de déchiffrement</strong> est stockée SÉPARÉMENT de la sauvegarde (sinon voler l'une donne l'autre), et la <strong>restauration</strong> (remettre la sauvegarde en service) est testée régulièrement. Une sauvegarde jamais restaurée n'est qu'un espoir : on ignore si elle fonctionne.</p>

<h3>3. Respecter les données (RGPD)</h3>
<p>Le <strong>RGPD</strong> (Règlement Général sur la Protection des Données) est la loi européenne qui encadre les données personnelles. Il se traduit par du <strong>code</strong> concret : donner à chaque personne le droit de voir, d'emporter et d'effacer ses données.</p>
<pre class="pseudo">public async Task&lt;object&gt; ExporterMesDonneesAsync(Utilisateur u)   // accès / portabilité
    => await DonneesPersonnellesAsync(u);   // renvoyer toutes les données personnelles de u (droit d'accès)
public async Task SupprimerMonCompteAsync(Utilisateur u) {          // effacement
    await AnonymiserLocationsAsync(u);   // garder les stats, retirer l'identité
    await _userManager.DeleteAsync(u);   // supprimer le compte utilisateur
}                                        // fin de la méthode
// minimisation (pas de carte stockée) + durées de conservation (purge planifiée)</pre>
<p><strong>Portabilité</strong> = exporter ses données dans un format réutilisable. <strong>Effacement</strong> = le droit à l'oubli. On préfère souvent l'<strong>anonymisation</strong> (retirer l'identité mais garder les statistiques) à la suppression brute, pour ne pas casser les comptes liés. La <strong>minimisation</strong> consiste à ne stocker que le strict nécessaire (ici, aucune carte bancaire), et les <strong>durées de conservation</strong> déclenchent une purge planifiée des vieilles données.</p>

<h3>4. Pouvoir revenir (rollback)</h3>
<p>Un <strong>rollback</strong> (« retour arrière ») consiste à redéployer la version précédente quand la nouvelle se comporte mal. C'est trivial pour le CODE grâce aux images immuables — l'ancienne existe toujours au registre.</p>
<pre class="pseudo"># la version déployée se comporte mal :
# .env.version : VERSION=1.0.0 (précédente) ; docker compose pull && up -d
# l'image 1.0.0 existe toujours au registre (immuable) -> < 5 min
# ⚠ migrations compatibles N-1 : le schéma de N reste lisible par le code N-1</pre>
<p>Le vrai sujet est le <strong>schéma</strong> de la base (sa structure : tables et colonnes). D'où la règle <strong>N-1</strong> détaillée plus bas.</p>

<h3>5. La production est un état à tenir</h3>
<pre class="pseudo">observer (logs, /health) · sauvegarder (chiffré, testé) ·
respecter (RGPD) · revenir (rollback N-1)
Ces filets, appris séparément (Docker/CI-CD/Sécurité), tous en place ici.</pre>
<div class="warn">Le rollback applicatif est trivial grâce à l'immuabilité des images ; le vrai sujet est le <strong>schéma</strong>. La règle N-1 (le schéma de la version N reste compatible avec le code N-1) se traduit en migrations additives : on ajoute une colonne, on bascule le code, on supprime l'ancienne — en plusieurs déploiements, jamais d'un coup.</div>
<div class="tip">Livrer n'est pas la fin : un logiciel se tient. Observer pour comprendre, sauvegarder pour survivre à une perte, respecter les données par obligation et par éthique, revenir vite quand ça dérape. Ces réflexes, disséminés dans les cours d'outillage, forment ici un tout cohérent sur un même projet.</div>`,
  exercises: [
    { type: "qcm", q: "En production, on comprend ce qui se passe grâce…", opts: ["Au débogueur en direct", "Aux logs structurés (ILogger, sur stdout)", "À la mémoire vive", "Au hasard"], a: 1, exp: "Le debugger n'existe plus en prod." },
    { type: "qcm", q: "On ne journalise JAMAIS…", opts: ["L'événement", "Mots de passe, jetons, données perso brutes", "L'horodatage", "L'IP"], a: 1, exp: "Fuite par les logs." },
    { type: "qcm", q: "Le log de succès d'une location se place…", opts: ["Avant la transaction", "Après le commit", "Dans la vue", "Jamais"], a: 1, exp: "Pas de location annulée journalisée." },
    { type: "qcm", q: "Une sauvegarde doit être…", opts: ["En clair sur un partage réseau", "Chiffrée, clé séparée, restauration testée", "Aussitôt supprimée", "Rendue publique"], a: 1, exp: "Autant de soin que la base." },
    { type: "qcm", q: "Une sauvegarde jamais restaurée est…", opts: ["Parfaitement fiable", "Un espoir, pas une garantie", "Systématiquement chiffrée", "Totalement inutile"], a: 1, exp: "Tester la restauration." },
    { type: "qcm", q: "Le droit d'accès (RGPD) se traduit par…", opts: ["Une simple mention aux CGU", "Une fonction d'export des données", "Rien de particulier", "Un cookie de consentement"], a: 1, exp: "Du code." },
    { type: "qcm", q: "Le droit à l'effacement demande souvent…", opts: ["La suppression brute systématique", "L'anonymisation (retirer l'identité, garder les stats)", "Le chiffrement des données", "La publication des données"], a: 1, exp: "Intégrité préservée." },
    { type: "qcm", q: "Le rollback applicatif consiste à…", opts: ["Reconstruire en urgence", "Redéployer le tag précédent (image immuable)", "Restaurer tout le serveur", "Éteindre l'application"], a: 1, exp: "< 5 min." },
    { type: "qcm", q: "Le vrai sujet du rollback :", opts: ["Le code applicatif", "Le schéma déjà migré (règle N-1)", "La configuration DNS", "Les secrets"], a: 1, exp: "Découpler code et base." },
    { type: "qcm", q: "La règle N-1 :", opts: ["Ne jamais migrer le schéma", "Migrations additives (ajouter, basculer, supprimer)", "Maintenir deux bases", "Un backup toutes les heures"], a: 1, exp: "Reculer d'une version ne casse rien." },
    { type: "vf", q: "Une rupture de schéma se fait en plusieurs déploiements, jamais d'un coup.", a: true, exp: "Additif puis bascule." },
    { type: "qcm", q: "Les logs structurés (ILogger) utilisent…", opts: ["Des chaînes concaténées à la main", "Des templates avec paramètres nommés ({JeuId})", "Des valeurs au hasard", "La feuille de style"], a: 1, exp: "Recherchables." },
    { type: "qcm", q: "La minimisation (RGPD) :", opts: ["Tout stocker par précaution", "Ne pas stocker l'inutile (ex. pas de carte)", "Chiffrer absolument tout", "Dupliquer les données"], a: 1, exp: "Moins de surface." },
    { type: "qcm", q: "La production est…", opts: ["La fin du travail", "Un état à tenir (observer, sauvegarder, respecter, revenir)", "Une étape optionnelle", "Un simple test"], a: 1, exp: "Logiciel exploité." },
    { type: "vf", q: "Ces filets, appris séparément, sont tous en place sur un même projet.", a: true, exp: "L'aboutissement du Niveau 8." }
  ],
  final: {
    title: "Exercice final — Les filets de la production",
    intro: `<p>On installe observabilité, sauvegardes, RGPD et rollback.</p>`,
    questions: [
      { type: "qcm", q: "Les logs :", opts: ["Événements structurés sans secret, après commit", "avec les mots de passe", "en fichier local éditable", "aucun journal"], a: 0, exp: "Utile sans trahir." },
      { type: "qcm", q: "Les sauvegardes :", opts: ["Chiffrées, clé séparée, restauration testée", "stockées en clair", "aussitôt supprimées", "rendues publiques"], a: 0, exp: "Base complète sinon." },
      { type: "qcm", q: "Le droit à l'effacement :", opts: ["Anonymiser + supprimer l'identité", "tout conserver", "seulement chiffrer", "ne rien faire"], a: 0, exp: "Stats préservées." },
      { type: "qcm", q: "Le rollback :", opts: ["Redéployer le tag précédent (< 5 min)", "reconstruire l'image", "restaurer tout le serveur", "espérer que ça passe"], a: 0, exp: "Image immuable." },
      { type: "vf", q: "La règle N-1 découple le rollback du code de celui du schéma.", a: true, exp: "Rupture en plusieurs déploiements." }
    ],
    solution: `<pre class="pseudo">// Observabilité : logs structurés (après commit, sans secret)
_logger.LogInformation("Location jeu={JeuId} client={ClientId}", jeuId, client.Id);   // journaliser une location (champs nommés)

# Sauvegarde chiffrée, clé séparée, restauration testée
docker compose exec bdd mysqldump ... | gpg --encrypt -r sauvegarde@ludo > backup.sql.gpg   // exporter la base puis la chiffrer

// RGPD
public async Task SupprimerMonCompteAsync(Utilisateur u) {   // droit à l'effacement
  await AnonymiserLocationsAsync(u); await _userManager.DeleteAsync(u);   // anonymiser les locations, puis supprimer le compte
}                                                             // fin de la méthode
# Rollback : VERSION=1.0.0 (précédent) + pull + up -d (migrations N-1)</pre>
<p>Les filets sont en place. Demain : l'examen — le projet professionnel de bout en bout.</p>`
  }
};

    solution: "PLAN D'EXPLOITATION — Ludotheque pro\n\nOBSERVABILITE\n- Journaliser (ILogger, templates structures) : connexions (reussies/echouees),\n  changements de role, actions sensibles (achat, suppression), erreurs. Sur stdout.\n- JAMAIS : mots de passe, jetons, cookies, donnees personnelles brutes.\n- Surveiller : /health, taux d'erreurs, temps de reponse, memoire.\n\nSAUVEGARDES\n- mysqldump chiffre (gpg), cle stockee SEPAREMENT de la sauvegarde.\n- Planifiees (quotidiennes) + restauration TESTEE une fois par mois sur un\n  environnement jetable (une sauvegarde non restauree n'est qu'un espoir).\n\nRGPD (3 fonctions implementees)\n1. ExporterMesDonneesAsync(u) -> JSON reutilisable (acces + portabilite)\n2. SupprimerMonCompteAsync(u) -> anonymise les locations, retire l'identite\n3. PurgePlanifieeAsync() -> anonymise/purge au-dela des durees de conservation\n+ minimisation : pas de carte bancaire stockee (paiement delegue).\n\nROLLBACK + REGLE N-1 (via migrations EF)\n- Rollback : .env.version -> tag precedent, docker compose pull && up -d\n  (l'image precedente existe toujours au registre). < 5 min.\n- Migrations compatibles N-1 : le schema de la version N reste lisible par le\n  code N-1. Exemple — renommer NbJours en DureeJours :\n    migration +1 : AJOUTER DureeJours (nullable), le code ecrit les DEUX champs\n    migration +2 : LIRE DureeJours (les deux restent synchrones)\n    migration +3 : SUPPRIMER NbJours (plus aucune version deployee ne le lit)\n  -> a chaque etape, reculer d'UNE version ne casse rien.\n\nLa production est un ETAT (a observer, sauvegarder, proteger, restaurer),\npas un evenement ponctuel qu'on oublie apres le deploiement.",
