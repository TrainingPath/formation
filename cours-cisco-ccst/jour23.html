  theory: `
<h3>1. Deux outils pour enquêter sur le réseau</h3>
<p>Quand « ça ne marche pas », on ne devine pas : on <strong>teste</strong>. Deux commandes universelles sont tes premiers réflexes de diagnostic : <strong>ping</strong>, pour vérifier qu'une machine répond, et <strong>traceroute</strong> (nommée <strong>tracert</strong> sous Windows), pour suivre le chemin emprunté par les paquets. Elles existent sur Windows, Linux, macOS et sur IOS Cisco.</p>
<h3>2. ping : « es-tu là ? »</h3>
<p>La commande <strong>ping</strong> envoie de petits messages à une machine et mesure si — et en combien de temps — elle répond. C'est le test de connectivité le plus simple. Une réponse signifie que le chemin fonctionne dans les deux sens ; une absence de réponse (« délai d'attente dépassé », en anglais <em>request timed out</em>) signale un problème à investiguer.</p>
<pre class="pseudo">C:\\&gt; ping 8.8.8.8
Reponse de 8.8.8.8 : octets=32 temps=14 ms TTL=115
Reponse de 8.8.8.8 : octets=32 temps=13 ms TTL=115
# -> la machine repond : la connectivite est bonne
# temps = duree de l'aller-retour (plus c'est bas, mieux c'est)</pre>
<div class="tip">Interpréter ping : des <strong>réponses régulières</strong> = liaison OK. Des <strong>timeouts</strong> = pas de réponse (machine éteinte, coupée, ou bloquée par un pare-feu).</div>
<h3>3. Ping et les noms : tester aussi le DNS</h3>
<p>Astuce de dépannage : si <strong>ping 8.8.8.8</strong> (une adresse IP) fonctionne mais que <strong>ping www.exemple.com</strong> (un nom) échoue, le réseau va bien mais la <strong>résolution DNS</strong> est en panne. Un même outil te renseigne ainsi sur deux couches différentes.</p>
<h3>4. traceroute / tracert : suivre le chemin</h3>
<p>La commande <strong>traceroute</strong> (Linux/macOS/IOS) ou <strong>tracert</strong> (Windows) révèle <strong>chaque routeur traversé</strong> (chaque <em>saut</em>, en anglais <em>hop</em>) entre toi et la destination, avec le temps de réponse à chaque étape. Très utile pour localiser <em>où</em> une communication se bloque : le dernier saut qui répond te montre jusqu'où le paquet est allé.</p>
<pre class="pseudo">C:\\&gt; tracert www.exemple.com
1    1 ms   192.168.1.1      # ta passerelle (le routeur local)
2   12 ms   10.20.0.1        # routeur du fournisseur d'acces
3    *   *   Delai d'attente  # ce saut ne repond pas -> a surveiller
4   25 ms   93.184.216.34    # destination atteinte
# Chaque ligne = un saut (hop) = un routeur traverse</pre>
<div class="warn">Un astérisque <strong>*</strong> dans traceroute ne veut pas toujours dire « panne » : certains routeurs sont configurés pour ne pas répondre. Regarde si les sauts <em>suivants</em> répondent avant de conclure.</div>
<h3>5. Sur un équipement Cisco</h3>
<p>Sur IOS, ces commandes s'utilisent en mode privilégié (invite #). On tape simplement <strong>ping</strong> ou <strong>traceroute</strong> suivi de l'adresse. C'est le même principe que sur un PC : d'abord on vérifie la connectivité de proche en proche (sa passerelle, puis plus loin).</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ping        -> la machine repond-elle ? (connectivite + temps aller-retour)
#   reponses = OK  |  timeout = pas de reponse
# traceroute (tracert sous Windows) -> LE CHEMIN, saut par saut
#   chaque ligne = 1 routeur traverse (1 hop)
# Astuce : ping IP OK mais ping NOM KO -> probleme de DNS</pre>`,

  ],

    solution: `<pre class="pseudo"># Methode de diagnostic (du plus proche au plus loin) :
1. ping 192.168.1.1     -> ma passerelle repond-elle ?  (liaison locale)
