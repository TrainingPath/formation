  title: "Les types de réseaux",
  subtitle: "LAN, WAN, cloud, PAN, MAN : classer les réseaux par leur étendue.",
  theory: `
<h3>1. Classer les réseaux par leur taille</h3>
<p>Tous les réseaux ne se ressemblent pas : certains tiennent dans une pièce, d'autres relient des continents. On les classe surtout selon leur <strong>étendue géographique</strong>. La CCST attend que tu saches reconnaître les grands types : <strong>PAN</strong>, <strong>LAN</strong>, <strong>MAN</strong> et <strong>WAN</strong>, ainsi que la notion de <strong>cloud</strong>.</p>
<pre class="pseudo"># Types de reseaux, du plus petit au plus grand
PAN  : autour d'une personne (quelques metres)
LAN  : un batiment, une maison, un bureau
MAN  : une ville, une agglomeration
WAN  : un pays, un continent, le monde entier</pre>
<h3>2. Le LAN (réseau local)</h3>
<p>Le <strong>LAN</strong> (<em>Local Area Network</em>, « réseau local ») couvre une <strong>zone limitée</strong> : une maison, un bureau, une école. C'est le type le plus courant. Les appareils y sont reliés par des switchs et du Wi-Fi. Un LAN appartient généralement à une seule organisation qui en a le contrôle total.</p>
<div class="tip">Ton réseau à la maison (box, ordinateurs, téléphones, imprimante) est un LAN. Il est rapide et privé.</div>
<h3>3. Le WAN (réseau étendu)</h3>
<p>Le <strong>WAN</strong> (<em>Wide Area Network</em>, « réseau étendu ») couvre de <strong>grandes distances</strong> : il relie des LAN situés dans des villes, des pays, voire des continents différents. <strong>Internet est le plus grand WAN du monde.</strong> Les WAN utilisent souvent des liaisons louées à des opérateurs télécoms, car ils traversent le domaine public.</p>
<pre class="pseudo"># LAN vs WAN
LAN : petite zone, prive, rapide, une seule organisation
WAN : grande zone, relie des LAN, souvent via un operateur
Internet = le WAN mondial reliant des milliards d'appareils</pre>
<h3>4. Le PAN et le MAN</h3>
<p>Le <strong>PAN</strong> (<em>Personal Area Network</em>, « réseau personnel ») est minuscule : il entoure <strong>une personne</strong>, sur quelques mètres. Exemple typique : ton téléphone relié à des écouteurs <strong>Bluetooth</strong> ou à une montre connectée. Le <strong>MAN</strong> (<em>Metropolitan Area Network</em>, « réseau métropolitain ») couvre une <strong>ville</strong> ou une agglomération, par exemple le réseau qui relie les bâtiments d'une administration municipale.</p>
<h3>5. Le cloud</h3>
<p>Le <strong>cloud</strong> (« nuage ») n'est pas défini par une taille mais par un <strong>mode de fonctionnement</strong> : des serveurs et services hébergés à distance, dans des centres de données, et accessibles par Internet. Au lieu d'acheter ses propres serveurs, une entreprise <strong>loue</strong> de la puissance et du stockage chez un fournisseur cloud. Tu utilises le cloud quand tu stockes des photos en ligne ou utilises une application web.</p>
<div class="warn">Ne réduis pas le cloud à « Internet ». Le cloud, ce sont des <strong>ressources informatiques louées à distance</strong> (serveurs, stockage, applications), auxquelles on accède le plus souvent via Internet. Internet est le chemin ; le cloud est la ressource.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># PAN : autour d'une personne (Bluetooth, montre)
# LAN : un batiment (maison, bureau) - prive et rapide
# MAN : une ville / agglomeration
# WAN : grande distance - Internet est le plus grand WAN
# Cloud : serveurs/services loues a distance, via Internet</pre>`,

    { type: "input", q: "Que signifie l'acronyme MAN ? (traduis : réseau ...)", a: ["metropolitain", "métropolitain", "reseau metropolitain", "réseau métropolitain", "metropolitan area network"], ph: "réseau ...", exp: "MAN = Metropolitan Area Network, réseau métropolitain (une ville)." }

    intro: `<p>Une entreprise possède : un réseau dans chacun de ses bureaux, un lien reliant ses bureaux de Paris et Lyon, des applications hébergées chez un fournisseur en ligne, et des employés qui relient leur casque Bluetooth à leur téléphone. Classons chaque cas.</p>`,

# Un reseau a l'echelle d'une ville serait un MAN

<p>Tu sais désormais classer un réseau selon son étendue. Demain, dernière leçon : les topologies réseau, la forme que prennent ces réseaux.</p>`
