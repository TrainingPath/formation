<script>
var DAY = {
  num: 30,
  title: "Pratique : un petit réseau dans Packet Tracer",
  subtitle: "Monter 2 PC, un switch et un routeur, puis tester la connectivité.",
  theory: `
<h3>1. Packet Tracer : un labo réseau sans matériel</h3>
<p><strong>Packet Tracer</strong> est le <strong>simulateur de réseau</strong> gratuit conçu par Cisco pour l'apprentissage. Il permet de <strong>construire un réseau virtuel</strong> — PC, switches, routeurs, câbles — et de le faire fonctionner comme s'il était réel, sans acheter le moindre équipement. On y glisse les appareils depuis une bibliothèque, on les relie avec des câbles, on configure les adresses, puis on teste avec des commandes comme <code>ping</code>. C'est l'outil idéal pour s'entraîner sans risque : une erreur ne casse rien de physique.</p>
<div class="tip">Packet Tracer distingue deux modes : le mode <strong>Realtime</strong> (temps réel, le réseau se comporte normalement) et le mode <strong>Simulation</strong>, où l'on voit les paquets avancer pas à pas dans le réseau — génial pour comprendre <em>ce qui se passe</em> à l'intérieur.</div>
<h3>2. Les briques de notre petit réseau</h3>
<p>Nous allons monter la topologie la plus classique : <strong>deux PC</strong> reliés à un <strong>switch</strong>, lui-même relié à un <strong>routeur</strong>. Rappel des rôles : le <strong>switch</strong> (commutateur) relie les machines d'un même réseau local et aiguille les trames grâce aux adresses <strong>MAC</strong> ; le <strong>routeur</strong> relie des réseaux différents et sert de <strong>passerelle</strong> vers l'extérieur. Le bon câble entre un PC/routeur et un switch est un câble <strong>Ethernet droit</strong> (straight-through).</p>
<pre class="pseudo"># Notre topologie
[ PC0 ]---.                     .---[ Routeur ]
          +---[ Switch ]-------+
[ PC1 ]---'
# 2 PC + 1 switch + 1 routeur, tous cables en Ethernet.</pre>
<h3>3. Configurer les adresses IP</h3>
<p>Pour que les machines se parlent, chacune a besoin d'une <strong>adresse IP</strong>, d'un <strong>masque de sous-réseau</strong> et d'une <strong>passerelle par défaut</strong> (l'adresse du routeur). On choisit un réseau privé, par exemple <strong>192.168.1.0 / 255.255.255.0</strong>. Tous les appareils du réseau partagent le même début d'adresse et le même masque ; seul le dernier nombre change.</p>
<pre class="pseudo"># Plan d'adressage (reseau 192.168.1.0/24)
PC0      : 192.168.1.10   masque 255.255.255.0   passerelle 192.168.1.1
PC1      : 192.168.1.11   masque 255.255.255.0   passerelle 192.168.1.1
Routeur  : 192.168.1.1    (interface reliee au switch)
# Sur un PC : onglet Desktop -&gt; IP Configuration -&gt; saisir les valeurs.</pre>
<p>Le switch, lui, n'a généralement pas besoin d'adresse IP pour ce test simple : il travaille en couche 2 et transmet les trames sans configuration. Sur le routeur, on active l'interface et on lui donne l'adresse <em>192.168.1.1</em> ; en ligne de commande Cisco IOS, cela ressemble à ceci :</p>
<pre class="pseudo"># Configuration minimale de l'interface du routeur (IOS)
Router&gt; enable
Router# configure terminal
Router(config)# interface gigabitEthernet 0/0
Router(config-if)# ip address 192.168.1.1 255.255.255.0
Router(config-if)# no shutdown
Router(config-if)# end</pre>
<div class="warn">Piège fréquent : oublier <code>no shutdown</code>. Par défaut, une interface de routeur Cisco est <strong>éteinte</strong> (administratively down). Sans <code>no shutdown</code>, elle ne transmet rien, même bien câblée et bien adressée.</div>
<h3>4. Tester la connectivité</h3>
<p>Le montage terminé, on vérifie. Sur PC0, on ouvre l'invite de commande (onglet <em>Desktop -&gt; Command Prompt</em>) et on lance un <code>ping</code> vers PC1, puis vers la passerelle. Une réponse (<em>Reply from…</em>) confirme que tout communique ; un <em>Request timed out</em> signale un problème à diagnostiquer avec la méthode connue : câble, IP, masque, passerelle.</p>
<pre class="pseudo"># Tests depuis PC0
ping 192.168.1.11   # vers PC1  -&gt; Reply = les deux PC se parlent
ping 192.168.1.1    # vers le routeur (passerelle) -&gt; Reply = sortie OK
# Reply from ... = succes | Request timed out = a diagnostiquer</pre>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Packet Tracer = simulateur reseau gratuit de Cisco (Realtime / Simulation).
# Topologie type : 2 PC -&gt; switch -&gt; routeur.
# Chaque PC : IP + masque + passerelle (= adresse du routeur).
# Routeur : configurer l'interface + ne pas oublier "no shutdown".
# Tester avec ping (Reply = OK ; timed out = a diagnostiquer).</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que Packet Tracer ?", opts: ["Un antivirus", "Un simulateur de réseau gratuit conçu par Cisco", "Un navigateur web", "Un pare-feu matériel"], a: 1, exp: "Packet Tracer simule des réseaux pour l'apprentissage, sans matériel réel." },
    { type: "qcm", q: "Dans notre topologie, à quoi sert le switch ?", opts: ["À relier des réseaux différents", "À relier les machines d'un même réseau local (couche 2, adresses MAC)", "À chiffrer les mots de passe", "À fournir l'électricité"], a: 1, exp: "Le switch commute les trames dans un même LAN grâce aux adresses MAC." },
    { type: "input", q: "Quel équipement relie des réseaux différents et sert de passerelle vers l'extérieur ?", a: ["le routeur", "routeur", "router"], ph: "un mot", exp: "Le routeur interconnecte les réseaux et fait office de passerelle." },
    { type: "qcm", q: "De quoi chaque PC a-t-il besoin pour communiquer ?", opts: ["Seulement d'une adresse IP", "D'une IP, d'un masque de sous-réseau et d'une passerelle par défaut", "D'un mot de passe uniquement", "D'un câble USB"], a: 1, exp: "IP + masque + passerelle forment la configuration minimale." },
    { type: "vf", q: "La passerelle par défaut d'un PC correspond à l'adresse du routeur.", a: true, exp: "Oui : la passerelle est la porte de sortie, portée par le routeur." },
    { type: "input", q: "Quelle commande, tapée sur un PC, teste la connectivité vers une autre machine ?", a: ["ping"], ph: "une commande", exp: "ping envoie une requête d'écho et attend la réponse (Reply)." },
    { type: "qcm", q: "Sur un routeur Cisco, que fait la commande « no shutdown » sur une interface ?", opts: ["Elle éteint l'interface", "Elle active (allume) l'interface", "Elle efface la configuration", "Elle redémarre le PC"], a: 1, exp: "Par défaut l'interface est éteinte ; no shutdown l'active." },
    { type: "qcm", q: "Quel masque correspond au réseau privé 192.168.1.0/24 ?", opts: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"], a: 2, exp: "/24 équivaut au masque 255.255.255.0." },
    { type: "vf", q: "Pour ce test simple, le switch a besoin d'une adresse IP pour transmettre les trames.", a: false, exp: "Non : le switch travaille en couche 2 et transmet sans configuration IP." },
    { type: "input", q: "Quel type de câble Ethernet relie un PC (ou un routeur) à un switch ? (deux mots)", a: ["cable droit", "droit", "straight through", "straight-through", "cable ethernet droit"], ph: "câble …", exp: "Un câble droit (straight-through) relie des équipements de types différents (PC-switch)." },
    { type: "qcm", q: "Un ping renvoie « Request timed out ». Que faut-il faire ?", opts: ["Ignorer, c'est normal", "Diagnostiquer : câble, IP, masque, passerelle", "Éteindre l'ordinateur", "Changer de couleur de câble"], a: 1, exp: "Timed out = pas de réponse : on applique la méthode de diagnostic." },
    { type: "qcm", q: "Dans quel mode de Packet Tracer voit-on les paquets avancer pas à pas ?", opts: ["Realtime", "Simulation", "Sleep", "Turbo"], a: 1, exp: "Le mode Simulation montre le cheminement des paquets étape par étape." },
    { type: "vf", q: "Oublier « no shutdown » sur une interface de routeur peut empêcher toute communication, même bien câblé.", a: true, exp: "Oui : l'interface reste administrativement éteinte et ne transmet rien." },
    { type: "input", q: "Sur un PC dans Packet Tracer, quel onglet permet de saisir l'adresse IP (IP Configuration) ?", a: ["desktop", "l'onglet desktop", "onglet desktop"], ph: "un onglet", exp: "L'onglet Desktop d'un PC contient IP Configuration et Command Prompt." },
    { type: "qcm", q: "Deux PC ont 192.168.1.10 et 192.168.1.11, même masque. Peuvent-ils se pinguer via le switch ?", opts: ["Non, jamais", "Oui : même réseau, même masque, reliés au switch", "Seulement avec un routeur entre eux", "Seulement en HTTPS"], a: 1, exp: "Même sous-réseau + switch = communication directe en couche 2." }
  ],
  final: {
    title: "Exercice final — Monter et tester le réseau de l'atelier",
    intro: `<p>On te demande de reproduire dans Packet Tracer : PC-A, PC-B, un switch et un routeur, sur le réseau 192.168.1.0/24. Déroule la marche à suivre.</p>`,
    questions: [
      { type: "qcm", q: "Après avoir placé les appareils, par quoi relies-tu PC-A au switch ?", opts: ["Un câble d'alimentation", "Un câble Ethernet droit", "Un câble HDMI", "Rien, le Wi-Fi suffit toujours"], a: 1, exp: "PC vers switch = câble Ethernet droit (straight-through)." },
      { type: "input", q: "Quelle passerelle par défaut donnes-tu à PC-A et PC-B si le routeur est en 192.168.1.1 ?", a: ["192.168.1.1"], ph: "une adresse", exp: "La passerelle est l'adresse de l'interface du routeur : 192.168.1.1." },
      { type: "vf", q: "Sur le routeur, après avoir mis l'adresse sur l'interface, il faut taper « no shutdown ».", a: true, exp: "Oui : sinon l'interface reste éteinte et ne route rien." },
      { type: "qcm", q: "Quelle commande, depuis PC-A, vérifie que PC-B (192.168.1.11) répond ?", opts: ["ipconfig 192.168.1.11", "ping 192.168.1.11", "nslookup 192.168.1.11", "shutdown 192.168.1.11"], a: 1, exp: "ping 192.168.1.11 teste la joignabilité de PC-B." },
      { type: "qcm", q: "Le ping vers le routeur échoue mais celui entre les deux PC réussit. Piste ?", opts: ["Les PC sont en panne", "L'interface du routeur : adresse ou no shutdown oublié", "Le switch est cassé", "Internet est coupé"], a: 1, exp: "PC-PC OK = LAN bon ; c'est côté routeur qu'il faut vérifier (IP / no shutdown)." }
    ],
    solution: `<pre class="pseudo"># Marche a suivre complete :
1. Placer PC-A, PC-B, Switch, Routeur ; relier en cables Ethernet droits.
2. PC-A : 192.168.1.10 / 255.255.255.0 / passerelle 192.168.1.1
   PC-B : 192.168.1.11 / 255.255.255.0 / passerelle 192.168.1.1
3. Routeur :
   interface gigabitEthernet 0/0
   ip address 192.168.1.1 255.255.255.0
   no shutdown
4. Tester : depuis PC-A -&gt; ping 192.168.1.11 puis ping 192.168.1.1
   Reply from ... = reussite. Timed out = diagnostiquer (cable/IP/masque/no shutdown).</pre>
<p>Ce petit labo réunit tout le cours : adressage, rôle des équipements, config IOS de base et test par ping.</p>`
  }
};
</script>
