  theory: `
<h3>1. Le câble à paire torsadée (cuivre)</h3>
<p>Le câble réseau le plus répandu est la <strong>paire torsadée</strong> (<em>twisted pair</em>). Il contient 8 fils de cuivre regroupés en 4 paires. Chaque paire est <strong>torsadée</strong> (enroulée sur elle-même) : ce torsadage n'est pas décoratif, il réduit les <strong>interférences</strong> et le bruit entre les paires. Plus les fils sont torsadés serrés, mieux le câble résiste aux perturbations.</p>
<div class="tip">Deux grandes familles : <strong>UTP</strong> (<em>Unshielded Twisted Pair</em>, non blindé, le plus courant) et <strong>STP</strong> (<em>Shielded Twisted Pair</em>, blindé, pour les environnements très bruités).</div>
<h3>2. Le connecteur RJ45</h3>
<p>À chaque bout du câble cuivre se trouve un connecteur <strong>RJ45</strong> : la petite fiche en plastique transparent avec un ergot qui « clique » dans la prise. C'est ce connecteur que tu branches sur un ordinateur, un switch ou une box. Les 8 fils y sont rangés dans un ordre précis.</p>
<h3>3. Les catégories de câbles</h3>
<p>Les câbles à paire torsadée sont classés par <strong>catégories</strong> (<em>Category</em>, abrégé <strong>Cat</strong>). Plus la catégorie est élevée, plus le câble supporte de débit :</p>
<pre class="pseudo"># Categories courantes (debit indicatif, 100 m max) :
Cat 5e  ->  jusqu'a 1 Gbit/s
Cat 6   ->  jusqu'a 1 Gbit/s (10 Gbit/s sur courte distance)
Cat 6a  ->  jusqu'a 10 Gbit/s
Cat 7 / Cat 8 -> tres hauts debits, usages specifiques</pre>
<div class="warn">La longueur maximale d'un lien en paire torsadée est d'environ <strong>100 mètres</strong>. Au-delà, le signal s'atténue trop : il faut de la fibre ou un équipement intermédiaire.</div>
<h3>4. La fibre optique</h3>
<p>La <strong>fibre optique</strong> transporte l'information sous forme de <strong>lumière</strong> dans un fil de verre très fin. Elle a d'énormes avantages : débits très élevés, distances beaucoup plus longues (des centaines de mètres à plusieurs kilomètres) et <strong>immunité au bruit électrique</strong> (la lumière n'est pas perturbée par les champs électromagnétiques).</p>
<h3>5. Monomode et multimode</h3>
<p>Il existe deux grands types de fibre :</p>
<pre class="pseudo"># Deux types de fibre optique :
Multimode (MMF) : coeur plus large, laser/LED, courtes distances
                  (batiment, campus). Souvent moins chere.
Monomode  (SMF) : coeur tres fin, laser, tres longues distances
                  (operateurs, liaisons entre villes).</pre>
<p>Retiens l'idée simple : <strong>multimode</strong> pour les distances plus courtes (à l'intérieur d'un bâtiment ou d'un campus), <strong>monomode</strong> pour les très longues distances.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Cuivre : paire torsadee (UTP/STP), connecteur RJ45
#   torsadage = reduit les interferences
#   categories Cat5e / Cat6 / Cat6a ... (plus haut = plus de debit)
#   longueur max ~ 100 m
# Fibre : lumiere dans du verre, tres rapide, longue distance,
#   immunisee au bruit electrique
#   Multimode = distances courtes | Monomode = tres longues distances</pre>`,

    { type: "input", q: "Comment appelle-t-on le classement des câbles (Cat5e, Cat6...) ?", a: ["catégorie", "categorie", "categories", "catégories", "cat", "category"], ph: "un mot", exp: "Ce sont les catégories (Category / Cat)." },
    { type: "vf", q: "La fibre optique transporte l'information sous forme de lumière.", a: true, exp: "Oui : la fibre utilise des impulsions lumineuses dans du verre." },
    { type: "qcm", q: "Quelle est la longueur maximale approximative d'un lien en paire torsadée ?", opts: ["10 m", "100 m", "1 km", "10 km"], a: 1, exp: "Environ 100 mètres pour un lien cuivre Ethernet." },
    { type: "qcm", q: "Quel type de fibre est utilisé pour les très longues distances ?", opts: ["Multimode", "Monomode", "UTP", "Cat6"], a: 1, exp: "La fibre monomode (SMF) convient aux très longues distances." },
    { type: "vf", q: "La fibre optique est immunisée contre le bruit électrique.", a: true, exp: "Oui : la lumière n'est pas perturbée par les champs électromagnétiques." },
    { type: "qcm", q: "Que signifie « UTP » ?", opts: ["Ultra Twisted Protocol", "Unshielded Twisted Pair (non blindé)", "Universal Transfer Port", "United Test Pair"], a: 1, exp: "UTP = paire torsadée non blindée, la plus courante." },
    { type: "input", q: "Quel type de fibre convient aux distances plus courtes (bâtiment, campus) ?", a: ["multimode", "mmf", "la multimode"], ph: "un mot", exp: "La fibre multimode (MMF) pour les distances courtes." },
    { type: "qcm", q: "Quelle catégorie de câble supporte jusqu'à 10 Gbit/s sur 100 m ?", opts: ["Cat3", "Cat5", "Cat6a", "Cat1"], a: 2, exp: "La Cat6a supporte 10 Gbit/s sur 100 m." },
    { type: "vf", q: "Plus la catégorie d'un câble est élevée, plus il supporte de débit.", a: true, exp: "Oui : Cat6/Cat6a supportent plus de débit que Cat5e." },
    { type: "qcm", q: "Un avantage majeur de la fibre par rapport au cuivre ?", opts: ["Elle est plus lourde", "Elle va plus loin et plus vite, sans bruit électrique", "Elle est toujours moins chère", "Elle n'a pas besoin de connecteurs"], a: 1, exp: "Fibre : longues distances, très hauts débits, immunité au bruit." },
    { type: "vf", q: "STP désigne une paire torsadée blindée.", a: true, exp: "Oui : STP = Shielded Twisted Pair (blindée)." }
  ],
  final: {
    title: "Exercice final — Choisir le bon câble",

      { type: "input", q: "Quel connecteur mettras-tu au bout de ce câble cuivre ?", a: ["rj45", "rj-45"], ph: "un nom", exp: "Le RJ45." },

      { type: "input", q: "Quelle est la longueur maximale approximative d'un lien cuivre ? (en mètres, un nombre)", a: ["100", "100 m", "100m"], ph: "un nombre", exp: "Environ 100 mètres." },

    ],
    solution: "<pre class=\"pseudo\"># Choisir le support :\n# Courte distance (bureau) : paire torsadee UTP + RJ45, ~100 m max\n#   categories : Cat5e / Cat6 / Cat6a (plus haut = plus de debit)\n# Longue distance / entre batiments : FIBRE\n#   multimode = distances courtes | monomode = tres longues distances\n# Environnement tres bruite : fibre (immunisee au bruit electrique)</pre><p>Tu sais choisir un câble adapté. Demain : se passer de câble avec le WiFi.</p>"
  }
