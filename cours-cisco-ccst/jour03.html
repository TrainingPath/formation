<script>
var DAY = {
  num: 3,
  title: "Les composants d'un réseau",
  subtitle: "Hôtes, serveurs, équipements intermédiaires et médias : qui fait quoi.",
  theory: `
<h3>1. Vue d'ensemble : quatre familles de composants</h3>
<p>Un réseau se construit avec quatre grandes familles d'éléments. Les <strong>hôtes</strong> (les appareils des utilisateurs), les <strong>serveurs</strong> (qui fournissent des services), les <strong>équipements intermédiaires</strong> (qui relient et aiguillent), et les <strong>médias</strong> (le chemin physique par lequel voyagent les données). Comprendre ces catégories est indispensable pour la certification CCST.</p>
<pre class="pseudo"># Les 4 familles de composants d'un reseau
Hotes                  : PC, telephones, tablettes, imprimantes
Serveurs               : machines qui fournissent des services
Equipements intermed.  : switchs, routeurs, points d'acces
Medias                 : cables cuivre, fibre optique, ondes Wi-Fi</pre>
<h3>2. Les hôtes (end devices)</h3>
<p>Un <strong>hôte</strong> (en anglais <em>host</em> ou <em>end device</em>, « périphérique final ») est un appareil qui se trouve à l'<strong>extrémité</strong> du réseau : il produit ou consomme des données. Ton ordinateur, ton smartphone, une imprimante réseau, une caméra IP sont des hôtes. Chaque hôte possède une <strong>adresse IP</strong> pour être identifié.</p>
<div class="tip">Astuce de vocabulaire : un « end device » est un point de départ ou d'arrivée d'un message. Les données partent d'un hôte et arrivent à un autre hôte.</div>
<h3>3. Les serveurs</h3>
<p>Un <strong>serveur</strong> est un hôte particulier : c'est un ordinateur (souvent puissant) dont le rôle est de <strong>fournir des services</strong> aux autres. On parle de serveur <strong>web</strong> (héberge des sites), de serveur de <strong>fichiers</strong> (stocke des documents partagés), de serveur de <strong>messagerie</strong> (gère les e-mails), etc. Un serveur peut être une grosse machine dans un centre de données, mais aussi un simple logiciel qui rend un service.</p>
<h3>4. Les équipements intermédiaires</h3>
<p>Ce sont les appareils qui <strong>relient</strong> les hôtes et <strong>aiguillent</strong> les données. Les deux plus importants à connaître pour la CCST sont le <strong>commutateur</strong> et le <strong>routeur</strong>.</p>
<pre class="pseudo"># Equipements intermediaires cles (materiel Cisco typique)
Commutateur (switch)   : relie les appareils d'un MEME reseau local (LAN)
Routeur (router)       : relie des reseaux DIFFERENTS entre eux
Point d'acces (AP)     : donne un acces Wi-Fi sans fil aux hotes
Pare-feu (firewall)    : filtre le trafic pour la securite</pre>
<p>Retiens la distinction essentielle : le <strong>switch</strong> connecte les appareils <strong>à l'intérieur</strong> d'un réseau local ; le <strong>routeur</strong> relie <strong>plusieurs réseaux</strong> (par exemple ton réseau domestique à Internet). Cisco est mondialement connu pour ses switchs et ses routeurs.</p>
<h3>5. Les médias (le support de transmission)</h3>
<p>Les <strong>médias</strong> (en anglais <em>media</em>) sont le <strong>chemin physique</strong> emprunté par les données. Il en existe trois grandes sortes :</p>
<pre class="pseudo"># Types de medias
Cuivre (cable Ethernet) : signaux electriques, courant et peu couteux
Fibre optique           : signaux lumineux, tres rapide, longues distances
Sans fil (Wi-Fi)        : ondes radio, pratique mais partage l'air ambiant</pre>
<div class="warn">Ne confonds pas un média (le câble ou les ondes, le « chemin ») avec un équipement intermédiaire (le switch, le routeur, l'« aiguilleur »). Le média transporte ; l'équipement décide où envoyer.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Hote (end device) : PC, telephone, imprimante (extremite du reseau)
# Serveur           : hote qui fournit un service (web, fichiers, mail)
# Switch            : relie les appareils d'un MEME reseau local
# Routeur           : relie des reseaux DIFFERENTS
# Media             : cuivre, fibre optique ou Wi-Fi (le chemin)</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un hôte (end device) ?", opts: ["Un câble réseau", "Un appareil situé à l'extrémité du réseau, qui produit ou consomme des données", "Un protocole", "Une adresse IP"], a: 1, exp: "Un hôte est un périphérique final : PC, smartphone, imprimante, etc." },
    { type: "qcm", q: "Quel équipement relie les appareils d'un MÊME réseau local ?", opts: ["Le routeur", "Le commutateur (switch)", "La fibre optique", "Le serveur web"], a: 1, exp: "Le switch connecte les appareils à l'intérieur d'un même réseau local (LAN)." },
    { type: "qcm", q: "Quel équipement relie des réseaux DIFFÉRENTS entre eux ?", opts: ["Le routeur", "Le switch", "L'imprimante", "Le câble cuivre"], a: 0, exp: "Le routeur relie plusieurs réseaux (ex : ton réseau à Internet)." },
    { type: "input", q: "Comment appelle-t-on un hôte dont le rôle est de fournir des services aux autres ?", a: ["serveur", "un serveur", "le serveur", "server"], ph: "un mot", exp: "Un serveur est un hôte qui fournit des services (web, fichiers, mail...)." },
    { type: "vf", q: "Un média désigne le chemin physique emprunté par les données (câble, fibre ou ondes).", a: true, exp: "Vrai : le média est le support de transmission (cuivre, fibre optique, Wi-Fi)." },
    { type: "qcm", q: "Lequel de ces médias transmet les données sous forme de lumière ?", opts: ["Le câble cuivre", "La fibre optique", "Le Wi-Fi", "Le switch"], a: 1, exp: "La fibre optique transporte des signaux lumineux, très rapides et sur longue distance." },
    { type: "input", q: "Quel équipement intermédiaire donne un accès Wi-Fi sans fil aux hôtes ? (deux mots)", a: ["point d'acces", "point d acces", "point d'accès", "ap", "access point"], ph: "point d'...", exp: "Le point d'accès (Access Point, AP) fournit la connexion Wi-Fi." },
    { type: "vf", q: "Un switch et un routeur font exactement la même chose.", a: false, exp: "Faux : le switch relie les appareils d'un même réseau, le routeur relie des réseaux différents." },
    { type: "qcm", q: "Lequel est un exemple de serveur ?", opts: ["Un câble Ethernet", "Un serveur web qui héberge des sites", "Une prise électrique", "Une souris"], a: 1, exp: "Un serveur web héberge des sites : c'est un hôte qui fournit un service." },
    { type: "input", q: "Comment appelle-t-on le média qui utilise des ondes radio, sans câble ? (un mot)", a: ["wi-fi", "wifi", "sans fil", "sans-fil"], ph: "un mot", exp: "Le Wi-Fi (sans fil) transmet par ondes radio." },
    { type: "qcm", q: "Quel composant sert principalement à FILTRER le trafic pour la sécurité ?", opts: ["Le pare-feu (firewall)", "Le câble cuivre", "L'imprimante", "Le point d'accès"], a: 0, exp: "Le pare-feu (firewall) filtre le trafic à des fins de sécurité." },
    { type: "vf", q: "Un média transporte les données, tandis qu'un équipement intermédiaire décide où les envoyer.", a: true, exp: "Vrai : le média est le chemin, l'équipement (switch/routeur) aiguille les données." },
    { type: "qcm", q: "Parmi ces éléments, lequel est un hôte (end device) ?", opts: ["Un routeur", "Un smartphone", "Un switch", "Une fibre optique"], a: 1, exp: "Un smartphone est un hôte : il se trouve à l'extrémité du réseau." },
    { type: "qcm", q: "Pour relier ton réseau domestique à Internet, quel équipement est nécessaire ?", opts: ["Un switch seul", "Un routeur", "Une imprimante", "Un câble seul"], a: 1, exp: "Le routeur relie ton réseau local à un autre réseau : Internet." },
    { type: "input", q: "Quelle famille de composants regroupe les switchs, routeurs et points d'accès ? (deux mots)", a: ["equipements intermediaires", "équipements intermédiaires", "equipement intermediaire", "intermediaires", "intermédiaires"], ph: "équipements ...", exp: "Ce sont les équipements intermédiaires : ils relient et aiguillent." }
  ],
  final: {
    title: "Exercice final — Identifier les composants d'une maison connectée",
    intro: `<p>Chez Nadia, un ordinateur portable et un smartphone se connectent en Wi-Fi. Une box relie la maison à Internet, et un petit ordinateur héberge un serveur de fichiers familial. Un câble Ethernet relie ce serveur à la box. Identifions chaque composant.</p>`,
    questions: [
      { type: "qcm", q: "L'ordinateur portable et le smartphone sont des…", opts: ["Serveurs", "Hôtes (end devices)", "Routeurs", "Médias"], a: 1, exp: "Ce sont des périphériques finaux, donc des hôtes." },
      { type: "qcm", q: "La box qui relie la maison à Internet joue surtout le rôle de…", opts: ["Routeur", "Imprimante", "Câble", "Serveur web"], a: 0, exp: "Elle relie deux réseaux (maison et Internet) : c'est un rôle de routeur." },
      { type: "input", q: "Le petit ordinateur qui stocke et partage les fichiers de la famille est un… (un mot)", a: ["serveur", "un serveur", "le serveur", "server"], ph: "un mot", exp: "Il fournit un service de fichiers : c'est un serveur." },
      { type: "qcm", q: "Le câble Ethernet entre le serveur et la box est un exemple de…", opts: ["Hôte", "Média (support de transmission)", "Serveur", "Point d'accès"], a: 1, exp: "Le câble est un média : il transporte les données." },
      { type: "vf", q: "Le Wi-Fi utilisé par le portable et le smartphone est aussi un média.", a: true, exp: "Vrai : le Wi-Fi (ondes radio) est un média sans fil." }
    ],
    solution: `<pre class="pseudo"># Composants de la maison de Nadia :
Hotes    : ordinateur portable, smartphone (extremites du reseau)
Serveur  : le petit ordinateur qui partage les fichiers familiaux
Routeur  : la box (relie la maison a Internet)
Medias   : le cable Ethernet (cuivre) et le Wi-Fi (ondes radio)</pre>
<p>Tu sais maintenant classer chaque appareil dans la bonne famille. Demain, nous plongeons dans le modèle OSI et ses 7 couches, un pilier de la certification.</p>`
  }
};
