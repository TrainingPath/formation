  subtitle: "Fiable ou rapide ? Et comment une machine sait à quel service livrer les données.",
  theory: `
<h3>1. Deux façons de transporter les données</h3>
<p>Au niveau du <strong>transport</strong> (couche 4 du modèle OSI), deux protocoles se partagent le travail : <strong>TCP</strong> et <strong>UDP</strong>. Ils répondent à un même besoin — acheminer les données entre deux applications — mais avec deux philosophies opposées : l'un privilégie la <strong>fiabilité</strong>, l'autre la <strong>rapidité</strong>.</p>
<h3>2. TCP : fiable, avec accusé de réception</h3>
<p>Le <strong>TCP</strong> (« Transmission Control Protocol ») est le protocole <strong>fiable</strong>. Avant d'échanger, les deux machines établissent une <strong>connexion</strong> (la fameuse « poignée de main » en trois temps). Ensuite, chaque donnée envoyée est <strong>confirmée</strong> par un accusé de réception ; si un morceau se perd, il est <strong>renvoyé</strong>. TCP garantit que tout arrive, complet et dans le bon ordre.</p>
<p>Image : TCP, c'est le courrier recommandé avec signature. Plus lent, mais tu es certain que la lettre est arrivée. On l'utilise pour le web, le mail, le transfert de fichiers.</p>
<div class="tip"><strong>TCP = Fiable</strong> : connexion, accusés de réception, retransmission, ordre garanti. À privilégier quand aucune donnée ne doit se perdre.</div>
<h3>3. UDP : rapide, sans garantie</h3>
<p>Le <strong>UDP</strong> (« User Datagram Protocol ») est le protocole <strong>rapide</strong>. Pas de connexion préalable, pas d'accusé de réception : il envoie les données et n'attend rien en retour. C'est plus léger et plus vif, mais sans garantie : un paquet perdu est perdu. Idéal quand la vitesse compte plus que la perfection : appels vidéo, jeux en ligne, streaming.</p>
<p>Image : UDP, c'est la carte postale. Tu l'envoies sans savoir si elle arrivera, mais c'est rapide et sans formalités.</p>
<div class="warn">Erreur classique : croire qu'UDP est « moins bon ». Non : pour la voix ou la vidéo en direct, retransmettre un paquet en retard serait inutile. La rapidité d'UDP est un choix, pas un défaut.</div>
<h3>4. Les ports : une porte par service</h3>
<p>Une même machine héberge souvent plusieurs services (un site web, un serveur mail...). Comment savoir à quel service livrer les données qui arrivent ? Grâce au <strong>numéro de port</strong> : une sorte de numéro de porte. L'adresse IP identifie la machine ; le <strong>port</strong> identifie le <strong>service</strong> sur cette machine. Certains ports sont réservés à des usages précis : les <strong>ports bien connus</strong> (en anglais <em>well-known ports</em>, de 0 à 1023).</p>
<pre class="pseudo"># Ports bien connus a memoriser
Port 80   -> HTTP  (pages web en clair)
Port 443  -> HTTPS (pages web chiffrees)
Port 22   -> SSH   (administration a distance securisee)
Port 53   -> DNS   (traduction nom -> adresse IP)</pre>
<div class="tip">Association IP + port = un <strong>socket</strong>. Exemple : 192.168.1.10:443 désigne le service HTTPS de la machine 192.168.1.10.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># TCP = FIABLE : connexion + accuses de reception + retransmission + ordre

# UDP = RAPIDE : sans connexion, sans garantie, plus leger
#   -> voix, video en direct, jeux, streaming
# PORT = numero identifiant le SERVICE sur une machine
#   80 HTTP | 443 HTTPS | 22 SSH | 53 DNS</pre>`,

    { type: "input", q: "Quel numéro de port utilise HTTPS ?", a: ["443", "port 443", "le 443"], ph: "un nombre", exp: "HTTPS = port 443." },
