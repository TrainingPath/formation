var DAY = {
  num: 11,
  title: "Notion de sous-réseau (subnet)",
  subtitle: "Découper un grand réseau en plusieurs petits quartiers.",
  theory: `
<h3>1. Pourquoi découper un réseau ?</h3>
<p>Imagine une entreprise avec un seul grand réseau où tous les postes se parlent. C'est comme une ville sans quartiers : tout le monde reçoit tout, c'est bruyant et peu sûr. On préfère donc <strong>découper</strong> ce réseau en morceaux plus petits appelés <strong>sous-réseaux</strong> (en anglais <em>subnets</em>). Chaque sous-réseau regroupe un ensemble d'appareils qui partagent la même partie réseau.</p>
<p>Les avantages sont concrets : moins de trafic inutile dans chaque quartier, une meilleure organisation (un sous-réseau par service, par étage...) et davantage de sécurité, car on peut filtrer les échanges entre sous-réseaux.</p>
<h3>2. Rappel : réseau = partie commune</h3>
<p>Un sous-réseau est défini par une <strong>adresse réseau</strong> et un <strong>masque</strong>. Tous les appareils d'un même sous-réseau partagent la partie réseau. Par exemple, dans <code>192.168.1.0/24</code>, tous les hôtes commencent par <code>192.168.1</code> et se distinguent seulement par le dernier octet.</p>
<h3>3. Adresse réseau et adresse de broadcast</h3>
<p>Dans chaque sous-réseau, deux adresses sont toujours <strong>réservées</strong> et ne peuvent pas être données à une machine :</p>
<pre class="pseudo"># Sous-reseau : 192.168.1.0/24
# Adresse RESEAU    = tous les bits d'hote a 0  -> 192.168.1.0
# Adresse BROADCAST = tous les bits d'hote a 1  -> 192.168.1.255
# Hotes utilisables : 192.168.1.1 ... 192.168.1.254
# Nombre d'hotes : 256 - 2 = 254</pre>
<p>L'<strong>adresse réseau</strong> nomme le sous-réseau lui-même (le panneau à l'entrée du quartier). L'<strong>adresse de broadcast</strong> (diffusion) sert à envoyer un message à <strong>tous</strong> les appareils du sous-réseau d'un seul coup.</p>
<div class="tip">Astuce mémoire : dans un sous-réseau, la <strong>première</strong> adresse = réseau, la <strong>dernière</strong> = broadcast. Entre les deux se trouvent les hôtes utilisables.</div>
<h3>4. Un découpage simple : passer d'un /24 à deux /25</h3>
<p>Pour créer plusieurs sous-réseaux, on « emprunte » des bits à la partie hôte. Prendre 1 bit de plus transforme un <code>/24</code> en deux <code>/25</code>. Chaque /25 possède 128 adresses (dont 126 utilisables).</p>
<pre class="pseudo"># Un /24 (256 adresses) coupe en deux /25 :
# Sous-reseau A : 192.168.1.0/25    (hotes .1 a .126, broadcast .127)
# Sous-reseau B : 192.168.1.128/25  (hotes .129 a .254, broadcast .255)</pre>
<div class="warn">Plus tu ajoutes de sous-réseaux, plus tu perds d'adresses en route : chaque sous-réseau « coûte » 2 adresses réservées (réseau + broadcast). Il faut donc découper selon les besoins réels.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Subnet = petit reseau decoupe dans un plus grand
# Chaque sous-reseau : 1 adresse RESEAU + 1 adresse BROADCAST (reservees)
# Premiere adresse = reseau, derniere = broadcast
# /24 : 254 hotes | /25 : 126 hotes
# Decouper apporte : moins de trafic, organisation, securite</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un sous-réseau (subnet) ?", opts: ["Un regroupement de plusieurs réseaux en un seul", "Un découpage d'un réseau en parties plus petites", "Un type de pare-feu", "Un protocole de chiffrement"], a: 1, exp: "Un subnet est une portion découpée d'un réseau plus grand." },
    { type: "qcm", q: "Quelle adresse nomme le sous-réseau lui-même ?", opts: ["L'adresse de broadcast", "L'adresse réseau", "La passerelle", "Le masque"], a: 1, exp: "L'adresse réseau (bits d'hôte à 0) identifie le sous-réseau." },
    { type: "input", q: "Dans 192.168.1.0/24, quelle est l'adresse de broadcast ?", a: ["192.168.1.255"], ph: "a.b.c.d", exp: "Bits d'hôte tout à 1 : 192.168.1.255." },
    { type: "qcm", q: "À quoi sert l'adresse de broadcast ?", opts: ["À identifier le sous-réseau lui-même", "À envoyer un message à tous les appareils du sous-réseau", "À chiffrer les données", "À nommer le routeur"], a: 1, exp: "Le broadcast diffuse un message à tous les hôtes du sous-réseau." },
    { type: "vf", q: "L'adresse réseau et l'adresse de broadcast peuvent être attribuées à un poste.", a: false, exp: "Non : elles sont réservées, jamais données à une machine." },
    { type: "input", q: "Combien d'hôtes utilisables dans un /24 ? (un nombre)", a: ["254"], ph: "un nombre", exp: "256 - 2 réservées = 254." },
    { type: "qcm", q: "Dans un sous-réseau, quelle est la première adresse ?", opts: ["L'adresse de broadcast", "L'adresse réseau", "La passerelle", "Un hôte quelconque"], a: 1, exp: "La première adresse est toujours l'adresse réseau." },
    { type: "vf", q: "Découper un réseau en sous-réseaux peut améliorer la sécurité.", a: true, exp: "Oui : on peut filtrer les échanges entre sous-réseaux." },
    { type: "qcm", q: "Combien d'adresses réservées dans chaque sous-réseau ?", opts: ["0", "1", "2", "4"], a: 2, exp: "Deux : l'adresse réseau et le broadcast." },
    { type: "input", q: "Dans 192.168.1.0/24, quelle est l'adresse réseau ?", a: ["192.168.1.0"], ph: "a.b.c.d", exp: "Bits d'hôte à 0 : 192.168.1.0." },
    { type: "qcm", q: "En coupant un /24 en deux parties égales, quel préfixe obtient-on ?", opts: ["/23", "/24", "/25", "/26"], a: 2, exp: "On emprunte 1 bit : /24 devient deux /25." },
    { type: "vf", q: "Chaque sous-réseau supplémentaire consomme des adresses réservées.", a: true, exp: "Oui : chaque subnet coûte 2 adresses (réseau + broadcast)." },
    { type: "input", q: "Combien d'hôtes utilisables dans un /25 ? (un nombre)", a: ["126"], ph: "un nombre", exp: "128 - 2 = 126." },
    { type: "qcm", q: "Pourquoi découper un grand réseau ?", opts: ["Pour augmenter la vitesse de chaque câble", "Pour réduire le trafic inutile et mieux organiser", "Pour connecter directement plusieurs réseaux à Internet", "Pour désactiver le broadcast"], a: 1, exp: "Moins de trafic, meilleure organisation et sécurité." },
    { type: "vf", q: "Dans un sous-réseau, la dernière adresse est le broadcast.", a: true, exp: "Oui : bits d'hôte tout à 1 = broadcast." }
  ],
  final: {
    title: "Exercice final — Analyser un sous-réseau",
    intro: "<p>Le service comptabilité utilise le sous-réseau <code>192.168.1.0/24</code>. Tu dois documenter ses adresses clés avant d'y brancher les postes.</p>",
    questions: [
      { type: "input", q: "Quelle est l'adresse réseau de ce sous-réseau ?", a: ["192.168.1.0"], ph: "a.b.c.d", exp: "Bits d'hôte à 0 : 192.168.1.0." },
      { type: "input", q: "Quelle est l'adresse de broadcast ?", a: ["192.168.1.255"], ph: "a.b.c.d", exp: "Bits d'hôte à 1 : 192.168.1.255." },
      { type: "qcm", q: "Quelle plage d'adresses peut-on donner aux postes ?", opts: ["192.168.1.0 à 192.168.1.255", "192.168.1.1 à 192.168.1.254", "192.168.1.1 à 192.168.1.255", "192.168.1.0 à 192.168.1.254"], a: 1, exp: "On exclut réseau (.0) et broadcast (.255)." },
      { type: "input", q: "Combien de postes au maximum ? (un nombre)", a: ["254"], ph: "un nombre", exp: "256 - 2 = 254." },
      { type: "vf", q: "On peut donner l'adresse 192.168.1.255 au poste du comptable.", a: false, exp: "Non : c'est l'adresse de broadcast, réservée." }
    ],
    solution: "<pre class=\"pseudo\"># Sous-reseau 192.168.1.0/24\n# Adresse reseau    : 192.168.1.0    (reservee)\n# Broadcast         : 192.168.1.255  (reservee)\n# Hotes utilisables : 192.168.1.1 a 192.168.1.254\n# Nombre de postes max : 254</pre><p>Tu sais délimiter un sous-réseau. Demain : une toute nouvelle famille d'adresses, l'IPv6.</p>"
  }
};
