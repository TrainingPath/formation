<script>
var DAY = {
  num: 10,
  title: "Le masque de sous-réseau et le préfixe (/24, partie réseau/hôte)",
  subtitle: "Séparer, dans l'adresse, ce qui désigne le quartier et ce qui désigne la maison.",
  theory: `
<h3>1. Deux informations dans une seule adresse</h3>
<p>Une adresse IPv4 ne dit pas seulement « qui » tu es : elle cache aussi « où » tu es. En réalité, elle se coupe en deux morceaux : une <strong>partie réseau</strong> (le quartier commun à tout un groupe d'appareils) et une <strong>partie hôte</strong> (le numéro unique de chaque appareil dans ce quartier). Comparaison postale : dans « 12 rue des Lilas », la rue est la partie réseau (partagée par tous les voisins) et le numéro 12 est la partie hôte (propre à une maison).</p>
<h3>2. Le masque de sous-réseau</h3>
<p>Comment savoir où s'arrête le quartier et où commence la maison ? Grâce au <strong>masque de sous-réseau</strong> (<em>subnet mask</em>). Le masque a la même forme qu'une adresse IPv4 (32 bits, notation décimale pointée). Ses bits à <strong>1</strong> marquent la partie réseau, ses bits à <strong>0</strong> marquent la partie hôte. Le masque le plus courant est <code>255.255.255.0</code>.</p>
<pre class="pseudo"># Adresse : 192.168.1.10
# Masque  : 255.255.255.0
# En binaire, le masque = 24 bits a 1 puis 8 bits a 0
11111111.11111111.11111111.00000000
# Les 24 premiers bits = partie RESEAU (192.168.1)
# Les 8 derniers bits  = partie HOTE   (.10)</pre>
<h3>3. La notation CIDR : le préfixe /24</h3>
<p>Écrire tout le masque est long. On utilise donc un raccourci appelé <strong>notation CIDR</strong> : on compte le nombre de bits à 1 du masque et on l'écrit après une barre oblique. Ainsi <code>255.255.255.0</code> s'écrit <strong>/24</strong> (24 bits de réseau). L'adresse complète devient <code>192.168.1.10/24</code>. Ce nombre après la barre s'appelle le <strong>préfixe</strong> (<em>prefix length</em>).</p>
<div class="tip">Correspondances utiles à mémoriser : /8 = 255.0.0.0 ; /16 = 255.255.0.0 ; /24 = 255.255.255.0. Chaque « 255 » complet vaut 8 bits de réseau.</div>
<h3>4. Combien de machines dans un /24 ?</h3>
<p>Dans un /24, il reste 8 bits pour la partie hôte, soit 256 combinaisons. Mais deux adresses sont réservées : la première (partie hôte tout à 0) est l'<strong>adresse réseau</strong>, et la dernière (partie hôte tout à 1) est l'<strong>adresse de diffusion</strong> (broadcast). Il reste donc <strong>256 moins 2 = 254</strong> adresses utilisables pour de vraies machines.</p>
<div class="warn">Ne jamais attribuer à un appareil l'adresse réseau (ex. 192.168.1.0/24) ni l'adresse de broadcast (ex. 192.168.1.255/24) : elles sont réservées.</div>
<h3>5. À quoi ça sert concrètement ?</h3>
<p>Le masque permet à un appareil de savoir si un destinataire est <strong>dans le même réseau local</strong> (il lui parle directement) ou <strong>ailleurs</strong> (il passe par la passerelle/routeur). Sans masque, impossible de faire cette distinction. C'est pour cela qu'une configuration IP comporte toujours au moins une adresse ET un masque.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Adresse IPv4 = partie RESEAU + partie HOTE
# Masque : bits a 1 = reseau, bits a 0 = hote
# 255.255.255.0  =  /24  (notation CIDR / prefixe)
# /8 = 255.0.0.0   /16 = 255.255.0.0   /24 = 255.255.255.0
# Dans un /24 : 254 adresses utilisables (256 - reseau - broadcast)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le masque de sous-réseau ?", opts: ["À chiffrer les données", "À séparer la partie réseau de la partie hôte", "À accélérer le WiFi", "À compter les paquets"], a: 1, exp: "Le masque indique quels bits sont réseau (1) et lesquels sont hôte (0)." },
    { type: "qcm", q: "Que valent les bits à 1 dans un masque ?", opts: ["La partie hôte", "La partie réseau", "Le broadcast", "La passerelle"], a: 1, exp: "Bits à 1 = partie réseau ; bits à 0 = partie hôte." },
    { type: "input", q: "Quel masque décimal correspond au préfixe /24 ?", a: ["255.255.255.0"], ph: "a.b.c.d", exp: "/24 = 24 bits à 1 = 255.255.255.0." },
    { type: "qcm", q: "Comment nomme-t-on l'écriture « /24 » après une adresse ?", opts: ["Notation binaire", "Notation CIDR (préfixe)", "Notation hexadécimale", "Notation octale"], a: 1, exp: "C'est la notation CIDR ; le nombre est le préfixe." },
    { type: "input", q: "Combien de bits de réseau indique le préfixe /24 ? (un nombre)", a: ["24"], ph: "un nombre", exp: "/24 = 24 bits à 1 dans le masque." },
    { type: "vf", q: "Dans un masque, un bit à 0 correspond à la partie hôte.", a: true, exp: "Exact : 0 = hôte, 1 = réseau." },
    { type: "qcm", q: "Combien d'adresses utilisables dans un réseau /24 ?", opts: ["256", "254", "255", "128"], a: 1, exp: "256 - adresse réseau - broadcast = 254." },
    { type: "qcm", q: "Quel masque correspond à /16 ?", opts: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"], a: 1, exp: "/16 = 16 bits à 1 = 255.255.0.0." },
    { type: "vf", q: "Dans 192.168.1.10/24, la partie réseau est 192.168.1.", a: true, exp: "Oui : /24 réserve les 3 premiers octets au réseau." },
    { type: "input", q: "Quel masque décimal correspond au préfixe /8 ?", a: ["255.0.0.0"], ph: "a.b.c.d", exp: "/8 = 8 bits à 1 = 255.0.0.0." },
    { type: "vf", q: "L'adresse 192.168.1.0/24 peut être attribuée à un ordinateur.", a: false, exp: "Non : c'est l'adresse réseau, réservée." },
    { type: "qcm", q: "Comment appelle-t-on la dernière adresse d'un réseau /24 (ex. 192.168.1.255) ?", opts: ["L'adresse réseau", "L'adresse de diffusion (broadcast)", "La passerelle", "Le masque"], a: 1, exp: "La dernière adresse est le broadcast, réservée." },
    { type: "input", q: "Sur combien de bits est écrit un masque de sous-réseau ? (un nombre)", a: ["32"], ph: "un nombre", exp: "Comme une IPv4 : 32 bits." },
    { type: "qcm", q: "Pourquoi un appareil a-t-il besoin du masque ?", opts: ["Pour savoir si le destinataire est dans le même réseau ou non", "Pour choisir sa couleur", "Pour compresser les fichiers", "Pour régler l'heure"], a: 0, exp: "Le masque permet de distinguer local et distant (passerelle)." },
    { type: "vf", q: "La notation CIDR /24 et le masque 255.255.255.0 désignent la même chose.", a: true, exp: "Oui : /24 est l'écriture abrégée de 255.255.255.0." }
  ],
  final: {
    title: "Exercice final — Découper une adresse avec son masque",
    intro: "<p>Un poste est configuré avec l'adresse <code>192.168.1.10</code> et le masque <code>255.255.255.0</code>. Analyse cette configuration.</p>",
    questions: [
      { type: "input", q: "Écris le préfixe CIDR correspondant à 255.255.255.0.", a: ["/24", "24"], ph: "/nn", exp: "255.255.255.0 = /24." },
      { type: "qcm", q: "Quelle est la partie réseau de 192.168.1.10/24 ?", opts: ["192.168", "192.168.1", "192.168.1.10", "10"], a: 1, exp: "/24 réserve les 3 premiers octets : 192.168.1." },
      { type: "qcm", q: "Quelle est l'adresse réseau de ce /24 ?", opts: ["192.168.1.1", "192.168.1.0", "192.168.1.255", "192.168.1.10"], a: 1, exp: "Partie hôte à 0 : 192.168.1.0." },
      { type: "qcm", q: "Quelle est l'adresse de broadcast de ce /24 ?", opts: ["192.168.1.0", "192.168.1.1", "192.168.1.254", "192.168.1.255"], a: 3, exp: "Partie hôte tout à 1 : 192.168.1.255." },
      { type: "input", q: "Combien de machines peut-on adresser dans ce /24 ? (un nombre)", a: ["254"], ph: "un nombre", exp: "256 - 2 = 254 adresses utilisables." }
    ],
    solution: "<pre class=\"pseudo\"># 192.168.1.10 / 255.255.255.0  ->  /24\n# Partie reseau  : 192.168.1\n# Partie hote    : .10\n# Adresse reseau : 192.168.1.0   (reservee)\n# Broadcast      : 192.168.1.255 (reservee)\n# Hotes utilisables : 192.168.1.1 a 192.168.1.254  = 254</pre><p>Tu sais lire un masque et distinguer réseau et hôte. Demain : découper un réseau en plusieurs sous-réseaux.</p>"
  }
};
</script>
