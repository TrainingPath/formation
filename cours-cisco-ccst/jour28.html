  title: "Pare-feu, chiffrement et bonnes pratiques",
  subtitle: "Le rôle du pare-feu, pourquoi HTTPS chiffre, et l'importance des mises à jour.",
  theory: `
<h3>1. Le pare-feu : un filtre à la frontière</h3>
<p>Le <strong>pare-feu</strong> (en anglais <em>firewall</em>) est le garde à l'entrée du réseau. Il examine chaque paquet qui veut entrer ou sortir et décide de le <strong>laisser passer</strong> ou de le <strong>bloquer</strong>, selon des <strong>règles</strong>. Ces règles s'appuient surtout sur les adresses IP et les <strong>numéros de port</strong> (le port identifie le service : 80 pour le web HTTP, 443 pour HTTPS, 22 pour SSH). L'image juste est celle d'un videur à l'entrée d'un bâtiment : il ne connaît pas les gens personnellement, mais il applique une liste d'autorisations.</p>
<pre class="pseudo"># Un pare-feu applique des regles (autoriser / bloquer)
Autoriser  TCP  port 443  (HTTPS)  -&gt; le web securise passe
Autoriser  TCP  port 22   (SSH)    depuis le reseau admin seulement
Bloquer    tout le reste par defaut
# Principe sain : "tout est interdit, sauf ce qui est explicitement permis"</pre>
<div class="tip">Bonne pratique universelle : le <strong>refus par défaut</strong> (en anglais <em>default deny</em>). On bloque tout, puis on ouvre uniquement les ports vraiment nécessaires. C'est le principe de moindre privilège appliqué au trafic réseau.</div>
<h3>2. Le chiffrement : rendre les données illisibles en transit</h3>
<p>Sur internet, un message voyage à travers de nombreux équipements. Sans protection, n'importe qui sur le trajet pourrait le lire. Le <strong>chiffrement</strong> (en anglais <em>encryption</em>) transforme les données en un charabia indéchiffrable pour tout le monde, sauf le destinataire légitime qui possède la <strong>clé</strong>. Attention à ne pas confondre : <strong>chiffrer</strong> protège la confidentialité (personne d'autre ne lit), tandis que le <strong>hachage</strong> (que l'on verra pour les mots de passe) est une empreinte à sens unique.</p>
<h3>3. HTTPS : le web chiffré</h3>
<p>Quand une adresse commence par <strong>HTTPS</strong> (le « S » veut dire <em>Secure</em>) et qu'un cadenas s'affiche, la communication entre ton navigateur et le site est <strong>chiffrée</strong> grâce au protocole <strong>TLS</strong> (en anglais <em>Transport Layer Security</em>, l'évolution de l'ancien SSL). Concrètement, si tu tapes ton mot de passe sur une page HTTPS, personne sur le réseau ne peut le lire au passage. Le simple <strong>HTTP</strong> (sans S), lui, envoie tout en clair : à éviter dès qu'il y a des données sensibles.</p>
<pre class="pseudo"># HTTP vs HTTPS
http://site.fr    -&gt; port 80,  EN CLAIR (lisible sur le reseau)
https://site.fr   -&gt; port 443, CHIFFRE par TLS (cadenas)
# Regle : jamais de mot de passe ni de paiement sur du simple HTTP.</pre>
<div class="warn">Le cadenas HTTPS garantit que la liaison est chiffrée, PAS que le site est honnête. Un site d'arnaque peut aussi avoir un cadenas. Vérifie toujours le vrai nom de domaine, pas seulement la présence du cadenas.</div>
<h3>4. Les mises à jour : boucher les trous</h3>
<p>Les logiciels contiennent des failles (des <strong>vulnérabilités</strong>) découvertes au fil du temps. Les éditeurs publient des <strong>mises à jour</strong> (en anglais <em>updates</em>, ou <em>patches</em>, « rustines ») pour les corriger. Un système non mis à jour est une porte laissée ouverte alors qu'on connaît la serrure défectueuse. Beaucoup d'attaques réussissent uniquement parce qu'un correctif disponible depuis des mois n'a pas été appliqué. Activer les mises à jour automatiques est l'un des gestes de sécurité les plus rentables.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Pare-feu : filtre le trafic par regles (IP + ports). Default deny.
# Chiffrement : rend les donnees illisibles sauf pour qui a la cle.
# HTTPS (port 443, TLS) : web chiffre = cadenas. HTTP (port 80) = en clair.
# Le cadenas prouve le chiffrement, PAS l'honnetete du site.
# Mises a jour (patches) : corrigent les failles. A activer, sans tarder.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le rôle principal d'un pare-feu (firewall) ?", opts: ["Accélérer internet", "Filtrer le trafic et autoriser ou bloquer selon des règles", "Stocker les mots de passe", "Chiffrer le disque dur"], a: 1, exp: "Le pare-feu applique des règles pour laisser passer ou bloquer les paquets." },

    { type: "input", q: "Comment appelle-t-on l'opération qui rend des données illisibles sauf pour qui possède la clé ? (un mot)", a: ["chiffrement", "le chiffrement", "encryption", "chiffrage"], ph: "un mot", exp: "Le chiffrement (encryption) protège la confidentialité des données." },
    { type: "qcm", q: "Quelle bonne pratique décrit « bloquer tout, puis n'ouvrir que le nécessaire » ?", opts: ["Default allow", "Default deny (refus par défaut)", "Open bar", "No firewall"], a: 1, exp: "Le default deny bloque tout par défaut et n'ouvre que l'indispensable." },
    { type: "qcm", q: "Un correctif de sécurité qui bouche une faille s'appelle aussi…", opts: ["Un cookie", "Un patch (rustine) / une mise à jour", "Un port", "Un cadenas"], a: 1, exp: "Un patch (mise à jour) corrige une vulnérabilité connue." },
    { type: "vf", q: "La présence du cadenas HTTPS prouve que le site est honnête et digne de confiance.", a: false, exp: "Non : le cadenas prouve le chiffrement, pas l'honnêteté. Un site d'arnaque peut l'avoir aussi." },
    { type: "input", q: "Quel numéro de port est utilisé par le simple HTTP (en clair) ?", a: ["80"], ph: "un nombre", exp: "HTTP utilise le port 80 ; HTTPS utilise le 443." },
    { type: "qcm", q: "Sur quoi le pare-feu s'appuie-t-il surtout pour ses règles ?", opts: ["La couleur des paquets", "Les adresses IP et les numéros de port", "La marque du PC", "L'heure de la journée uniquement"], a: 1, exp: "Les règles se basent principalement sur adresses IP et ports (services)." },
    { type: "vf", q: "Un système non mis à jour peut rester vulnérable à une faille déjà corrigée ailleurs.", a: true, exp: "Oui : si le patch n'est pas appliqué, la porte reste ouverte." },
    { type: "qcm", q: "Quel port est typiquement associé à l'administration distante sécurisée SSH ?", opts: ["22", "80", "443", "53"], a: 0, exp: "SSH utilise le port 22 pour l'accès distant chiffré." },
    { type: "qcm", q: "Pourquoi ne jamais saisir un mot de passe sur une page en simple HTTP ?", opts: ["C'est trop lent", "Il circule en clair et peut être lu sur le réseau", "Le cadenas est vert", "HTTP n'existe plus"], a: 1, exp: "Sans chiffrement, le mot de passe est lisible en transit." },
    { type: "input", q: "Quel geste de sécurité très rentable consiste à laisser le système installer seul ses correctifs ? (deux mots)", a: ["mises a jour automatiques", "mise a jour automatique", "maj automatiques", "updates automatiques"], ph: "mises à jour …", exp: "Les mises à jour automatiques appliquent les correctifs sans oubli." }
  ],
  final: {

    questions: [
      { type: "qcm", q: "Elle va payer en ligne. Que doit-elle vérifier dans la barre d'adresse ?", opts: ["Que l'adresse est en http://", "Que l'adresse est en https:// (cadenas) ET que le domaine est le bon", "La couleur du fond", "Rien de spécial"], a: 1, exp: "HTTPS pour le chiffrement, plus le bon nom de domaine pour l'authenticité." },
      { type: "input", q: "Quel port doit être ouvert sur le pare-feu pour naviguer sur des sites sécurisés ?", a: ["443"], ph: "un nombre", exp: "Le port 443 (HTTPS) permet le web chiffré." },
      { type: "vf", q: "Configurer le pare-feu en « default deny » puis n'ouvrir que le nécessaire est une bonne pratique.", a: true, exp: "Oui : refus par défaut, on n'ouvre que les ports utiles." },
      { type: "qcm", q: "Windows propose d'installer des mises à jour. Que conseilles-tu ?", opts: ["Les ignorer, c'est inutile", "Les installer et activer les mises à jour automatiques", "Désinstaller l'antivirus", "Désactiver le pare-feu"], a: 1, exp: "Appliquer les correctifs bouche les failles connues." },
      { type: "qcm", q: "Un site affiche un cadenas mais son domaine est « paypaI-secure-login.xyz ». Verdict ?", opts: ["C'est sûr, il y a le cadenas", "Méfiance : le cadenas ne prouve pas l'honnêteté, le domaine est suspect", "Aucune importance", "C'est le vrai PayPal"], a: 1, exp: "Le cadenas = chiffrement seulement ; le domaine trafiqué trahit l'arnaque." }
    ],
    solution: `<pre class="pseudo"># Check-list de durcissement du poste de Nadia :
1. Naviguer/payer en HTTPS (port 443, cadenas) ET verifier le domaine exact.

<p>Trois réflexes simples — HTTPS, pare-feu restrictif, mises à jour — écartent déjà la grande majorité des attaques opportunistes.</p>`
