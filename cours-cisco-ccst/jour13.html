  title: "Adresses privées, publiques et spéciales",
  subtitle: "RFC 1918, loopback et APIPA : savoir de quelle adresse on parle.",
  theory: `
<h3>1. Adresses publiques vs adresses privées</h3>
<p>Toutes les adresses IPv4 ne jouent pas le même rôle. Une <strong>adresse publique</strong> est unique sur Internet : c'est comme un numéro de téléphone joignable depuis le monde entier. Une <strong>adresse privée</strong>, elle, n'est utilisable que <strong>dans un réseau local</strong> (maison, entreprise) et n'est pas routable sur Internet. Plusieurs réseaux privés peuvent réutiliser les mêmes adresses privées, comme plusieurs immeubles peuvent chacun avoir un « appartement 1 ».</p>
<h3>2. Les plages privées de la RFC 1918</h3>
<p>Les adresses privées sont définies par le document <strong>RFC 1918</strong>. Il faut connaître ses trois plages par cœur :</p>
<pre class="pseudo"># Plages privees (RFC 1918) :
10.0.0.0     a 10.255.255.255    ->  10.0.0.0/8      (1 reseau /8)
172.16.0.0   a 172.31.255.255    ->  172.16.0.0/12   (16 reseaux /16)
192.168.0.0  a 192.168.255.255   ->  192.168.0.0/16  (256 reseaux /24)</pre>
<div class="tip">Moyen mnémotechnique : « <strong>dix</strong>, <strong>cent-soixante-douze-seize</strong>, <strong>cent-quatre-vingt-douze-cent-soixante-huit</strong> » soit 10/8, 172.16/12 et 192.168/16. Ce sont les adresses que tu vois chez toi (souvent 192.168.x.x).</div>
<h3>3. Le loopback : se parler à soi-même</h3>
<p>L'adresse de <strong>bouclage</strong> (loopback) <code>127.0.0.1</code> désigne toujours <strong>la machine elle-même</strong>. Quand un programme s'adresse à 127.0.0.1, le message ne sort pas de l'ordinateur : il revient à l'expéditeur. On l'utilise pour tester qu'une pile réseau fonctionne, sans dépendre d'aucun câble. Tout le bloc <code>127.0.0.0/8</code> est réservé à cet usage. On l'appelle aussi <code>localhost</code>.</p>
<h3>4. APIPA : l'adresse de secours</h3>
<p>Quand un appareil est configuré pour obtenir une adresse automatiquement (via DHCP) mais qu'<strong>aucun serveur DHCP ne répond</strong>, il s'attribue tout seul une adresse dans la plage <strong>169.254.0.0/16</strong> (169.254.x.x). Ce mécanisme s'appelle <strong>APIPA</strong> (<em>Automatic Private IP Addressing</em>), aussi nommé « link-local ». Une adresse en 169.254 est donc souvent le signe d'un <strong>problème</strong> : le DHCP n'a pas fonctionné.</p>
<div class="warn">Voir une adresse <code>169.254.x.x</code> sur un poste est presque toujours un symptôme : câble débranché, serveur DHCP en panne ou injoignable. L'appareil n'a pas pu obtenir de vraie adresse.</div>
<h3>5. Comment un privé accède à Internet ?</h3>
<p>Puisque les adresses privées ne circulent pas sur Internet, un routeur traduit les adresses privées en une adresse publique unique grâce au <strong>NAT</strong> (<em>Network Address Translation</em>). C'est pourquoi tous les appareils de ta maison partagent une seule adresse publique vue de l'extérieur.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Privees (RFC 1918) : 10/8, 172.16/12, 192.168/16  -> reseau local
# Publiques : uniques et routables sur Internet
# Loopback : 127.0.0.1 (soi-meme, localhost), bloc 127.0.0.0/8
# APIPA : 169.254.x.x  -> pas de DHCP (signe d'un probleme)
# NAT : traduit prive <-> public pour sortir sur Internet</pre>`,
  exercises: [
    { type: "qcm", q: "Quel document définit les plages d'adresses privées ?", opts: ["RFC 791", "RFC 1918", "RFC 2616", "RFC 1149"], a: 1, exp: "La RFC 1918 définit les adresses privées." },
    { type: "qcm", q: "Laquelle de ces adresses est privée ?", opts: ["8.8.8.8", "192.168.1.10", "1.1.1.1", "93.184.216.34"], a: 1, exp: "192.168.x.x fait partie des plages privées RFC 1918." },
    { type: "input", q: "Quelle est l'adresse de bouclage (loopback) IPv4 la plus connue ?", a: ["127.0.0.1"], ph: "a.b.c.d", exp: "127.0.0.1 désigne la machine elle-même (localhost)." },
    { type: "qcm", q: "Que signifie une adresse 169.254.x.x sur un poste ?", opts: ["Une adresse publique valide", "Le poste n'a pas obtenu d'adresse par DHCP (APIPA)", "Une adresse de loopback", "Une adresse IPv6"], a: 1, exp: "169.254 = APIPA : aucun serveur DHCP n'a répondu." },
    { type: "input", q: "Quel sigle désigne l'auto-attribution d'une adresse 169.254.x.x ?", a: ["apipa"], ph: "un sigle", exp: "APIPA = Automatic Private IP Addressing." },

    { type: "qcm", q: "Quelle plage privée correspond à /8 ?", opts: ["10.0.0.0", "172.16.0.0", "192.168.0.0", "169.254.0.0"], a: 0, exp: "10.0.0.0/8 est la grande plage privée." },
    { type: "qcm", q: "Quelle plage privée s'écrit 172.16.0.0/12 ?", opts: ["172.0.0.0 à 172.255.255.255", "172.16.0.0 à 172.31.255.255", "172.16.0.0 à 172.16.255.255", "172.0.0.0 à 172.16.0.0"], a: 1, exp: "172.16.0.0/12 va de 172.16 à 172.31." },
    { type: "vf", q: "127.0.0.1 permet à une machine de communiquer avec elle-même.", a: true, exp: "Oui : le loopback renvoie le trafic à la machine locale." },
    { type: "input", q: "Quel autre nom donne-t-on à 127.0.0.1 ?", a: ["localhost"], ph: "un mot", exp: "127.0.0.1 correspond à localhost." },
    { type: "qcm", q: "Quel mécanisme traduit adresses privées en adresse publique ?", opts: ["DNS", "NAT", "APIPA", "DHCP"], a: 1, exp: "Le NAT (Network Address Translation) fait cette traduction." },
    { type: "vf", q: "192.168.0.0/16 est une plage d'adresses privées.", a: true, exp: "Oui : c'est l'une des trois plages RFC 1918." },
    { type: "input", q: "Dans quelle plage (préfixe) tombe l'APIPA ? (ex. a.b.0.0/nn)", a: ["169.254.0.0/16", "169.254/16", "169.254.0.0 /16"], ph: "a.b.0.0/nn", exp: "APIPA = 169.254.0.0/16." },
    { type: "qcm", q: "Une adresse publique se caractérise par le fait qu'elle est…", opts: ["Réutilisable dans chaque maison", "Unique et joignable sur Internet", "Toujours en 192.168", "Réservée au loopback"], a: 1, exp: "Une adresse publique est unique et routable sur Internet." },
    { type: "vf", q: "Le bloc 127.0.0.0/8 entier est réservé au loopback.", a: true, exp: "Oui : tout 127.x.x.x est réservé au bouclage." }
  ],
  final: {
    title: "Exercice final — Identifier des adresses",
    intro: "<p>Tu diagnostiques plusieurs postes. Pour chacun, tu relèves l'adresse IPv4 affichée et tu dois dire de quel type d'adresse il s'agit.</p>",
    questions: [
      { type: "qcm", q: "Poste A affiche 192.168.1.42. C'est une adresse…", opts: ["Publique", "Privée (RFC 1918)", "Loopback", "APIPA"], a: 1, exp: "192.168.x.x est une plage privée RFC 1918." },
      { type: "qcm", q: "Poste B affiche 169.254.13.7. Que conclure ?", opts: ["Tout va bien, adresse publique", "APIPA : le DHCP n'a pas répondu", "C'est le loopback", "C'est une adresse IPv6"], a: 1, exp: "169.254 = APIPA, signe d'un problème DHCP." },
      { type: "input", q: "Poste C teste sa pile réseau sur lui-même. Quelle adresse utilise-t-il ?", a: ["127.0.0.1"], ph: "a.b.c.d", exp: "Le loopback 127.0.0.1 (localhost)." },
      { type: "qcm", q: "Poste D affiche 8.8.8.8. C'est une adresse…", opts: ["Privée", "Publique", "APIPA", "Loopback"], a: 1, exp: "8.8.8.8 est publique (routable sur Internet)." },
      { type: "vf", q: "Le poste B (169.254.x.x) pourra sortir sur Internet sans rien changer.", a: false, exp: "Non : une adresse APIPA ne permet pas d'accéder à Internet." }
    ],
    solution: "<pre class=\"pseudo\"># Reperes rapides :\n# 10.x / 172.16-31.x / 192.168.x  -> PRIVEE (RFC 1918)\n# 127.0.0.1 (127.0.0.0/8)         -> LOOPBACK (soi-meme, localhost)\n# 169.254.x.x (169.254.0.0/16)    -> APIPA (pas de DHCP = probleme)\n# Tout le reste routable          -> PUBLIQUE</pre><p>Tu sais reconnaître le type d'une adresse au premier coup d'oeil. Demain : on descend au niveau physique, celui des signaux.</p>"
  }
};
