  theory: `
<h3>1. Un protocole, c'est une langue commune</h3>
<p>Pour que deux machines se comprennent, elles doivent parler la même <strong>langue</strong> et suivre les mêmes règles : c'est un <strong>protocole</strong>. Chaque service d'Internet a le sien. En voici quatre à connaître absolument pour la certification : <strong>DHCP</strong>, <strong>DNS</strong>, <strong>HTTP/HTTPS</strong> et <strong>FTP</strong>. Ils rendent chacun un service différent, mais coopèrent en permanence.</p>
<h3>2. DHCP : obtenir une adresse automatiquement</h3>
<p>Quand tu connectes ton téléphone au Wi-Fi, il n'a aucune adresse IP. Le <strong>DHCP</strong> (« Dynamic Host Configuration Protocol ») la lui attribue <strong>automatiquement</strong>. Un serveur DHCP prête à chaque nouvel appareil une adresse IP, le masque, la passerelle et le serveur DNS. Sans DHCP, il faudrait configurer chaque machine à la main.</p>
<div class="tip">Moyen mnémotechnique : <strong>DHCP</strong> = « Distribue les adresses ». C'est lui qui donne une IP à ton appareil dès qu'il arrive sur le réseau.</div>
<h3>3. DNS : traduire les noms en adresses</h3>
<p>Les humains retiennent des noms (www.cisco.com), les machines ont besoin d'adresses IP. Le <strong>DNS</strong> (« Domain Name System ») est <strong>l'annuaire d'Internet</strong> : il traduit un nom de domaine en adresse IP. Quand tu tapes une adresse dans ton navigateur, une requête DNS part d'abord chercher l'IP correspondante.</p>
<pre class="pseudo"># Roles en une ligne
DHCP -> attribue automatiquement les adresses IP
DNS  -> traduit un nom (www.cisco.com) en adresse IP
HTTP -> transporte les pages web
FTP  -> transfere des fichiers</pre>
<h3>4. HTTP / HTTPS : afficher les pages web</h3>
<p>Le <strong>HTTP</strong> (« HyperText Transfer Protocol ») transporte les <strong>pages web</strong> entre le serveur et ton navigateur. Sa version sécurisée, le <strong>HTTPS</strong>, chiffre les échanges : personne ne peut lire au passage ton mot de passe ou ton numéro de carte. Le petit cadenas du navigateur signale une connexion HTTPS. Aujourd'hui, HTTPS est la norme pour tout site sérieux.</p>
<div class="warn">Ne confonds pas : <strong>HTTP</strong> = pages web en clair ; <strong>HTTPS</strong> = pages web <em>chiffrées</em> (le S signifie « Secure »). Ne saisis jamais de mot de passe sur une page en HTTP simple.</div>
<h3>5. FTP : transférer des fichiers</h3>
<p>Le <strong>FTP</strong> (« File Transfer Protocol ») sert à <strong>transférer des fichiers</strong> entre deux machines : envoyer (upload) ou télécharger (download). Il est ancien et, dans sa forme de base, transmet tout en clair ; on lui préfère aujourd'hui des versions sécurisées (SFTP, FTPS). Mais pour l'examen, retiens le principe : <strong>FTP = transfert de fichiers</strong>.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Les 4 protocoles a connaitre :
DHCP  -> attribue AUTOMATIQUEMENT une adresse IP a un appareil
DNS   -> ANNUAIRE : traduit un nom de domaine en adresse IP
HTTP  -> transporte les PAGES WEB (HTTPS = version chiffree/securisee)
FTP   -> TRANSFERT DE FICHIERS entre deux machines</pre>`,

    { type: "vf", q: "Le DNS sert à transférer des fichiers.", a: false, exp: "Non : le DNS traduit les noms en adresses IP. Le transfert de fichiers, c'est FTP." },

    { type: "input", q: "Quel protocole (sigle) sert au transfert de fichiers ?", a: ["ftp", "le ftp"], ph: "un sigle", exp: "FTP = File Transfer Protocol." },
    { type: "input", q: "Version sécurisée et chiffrée du HTTP (sigle) ?", a: ["https", "le https"], ph: "un sigle", exp: "HTTPS : le S signifie Secure (chiffrement)." }
  ],

    intro: `<p>Marie arrive au bureau, allume son portable, le connecte au Wi-Fi, puis ouvre son navigateur pour consulter un site et enfin envoie un gros fichier à un serveur. Identifions le protocole utilisé à chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "Le portable reçoit une adresse IP dès la connexion au Wi-Fi. Quel protocole ?", opts: ["DNS", "DHCP", "HTTP", "FTP"], a: 1, exp: "Le DHCP lui attribue automatiquement une adresse IP." },
      { type: "qcm", q: "Elle tape « www.cisco.com ». Quel protocole trouve l'adresse IP correspondante ?", opts: ["DHCP", "DNS", "FTP", "HTTPS"], a: 1, exp: "Le DNS traduit le nom en adresse IP." },
      { type: "qcm", q: "La page s'affiche avec un cadenas et une connexion chiffrée. Quel protocole ?", opts: ["HTTP", "HTTPS", "FTP", "DHCP"], a: 1, exp: "Le cadenas = HTTPS, la version chiffrée de HTTP." },
      { type: "qcm", q: "Enfin, elle envoie un gros fichier vers un serveur. Quel protocole convient ?", opts: ["DNS", "DHCP", "FTP", "HTTP simple"], a: 2, exp: "FTP est fait pour le transfert de fichiers." },
      { type: "vf", q: "Le DHCP a aussi pu lui indiquer quel serveur DNS utiliser.", a: true, exp: "Oui : le DHCP fournit IP, masque, passerelle ET serveur DNS." }
    ],
    solution: `<pre class="pseudo"># La journee de Marie, protocole par protocole :
1. Connexion Wi-Fi  -> DHCP  (recoit IP, masque, passerelle, DNS)

3. Page chiffree    -> HTTPS (cadenas = HTTP securise)
4. Envoi de fichier -> FTP   (transfert de fichiers)</pre>
<p>Chaque service a son protocole. Demain : sous le capot, TCP, UDP et les numéros de port.</p>`
