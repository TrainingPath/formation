<script>
var DAY = {
  num: 29,
  title: "La sécurité des accès (mots de passe, MFA)",
  subtitle: "Des mots de passe forts et l'authentification multifacteur : la serrure et le double verrou.",
  theory: `
<h3>1. Authentification : prouver qui l'on est</h3>
<p>L'<strong>authentification</strong> est l'étape où un système vérifie ton identité avant de t'ouvrir la porte. On la distingue de l'<strong>autorisation</strong>, qui décide ensuite ce que tu as le droit de faire. Traditionnellement, on prouve son identité par un <strong>mot de passe</strong> : un secret que seul le bon utilisateur est censé connaître. Le problème, c'est qu'un secret peut être deviné, volé ou réutilisé. D'où deux réponses complémentaires : rendre le mot de passe <strong>fort</strong>, et ajouter un <strong>second facteur</strong>.</p>
<h3>2. Qu'est-ce qu'un mot de passe fort ?</h3>
<p>Un bon mot de passe est avant tout <strong>long</strong> et <strong>difficile à deviner</strong>. La longueur compte plus que les symboles compliqués : une phrase de passe comme <em>« cheval-bleu-tasse-Lundi7 »</em> est à la fois longue, mémorisable et très résistante. À l'inverse, <em>« Motdepasse123! »</em> paraît complexe mais figure dans toutes les listes d'attaque. Les règles saines : de la <strong>longueur</strong> (12 caractères et plus), un mot de passe <strong>unique par service</strong> (jamais le même partout), et rien de personnel (nom, date de naissance, prénom de l'animal).</p>
<pre class="pseudo"># Faible vs fort
"julie1990"        -&gt; FAIBLE : court, personnel, devinable
"P@ssw0rd!"        -&gt; FAIBLE : motif connu, present dans les dictionnaires
"cheval-bleu-tasse-Lundi7" -&gt; FORT : long, aleatoire pour un attaquant, memorisable
# Regle d'or : LONG + UNIQUE par service.</pre>
<div class="tip">Retenir des dizaines de mots de passe uniques est impossible de tête : c'est le rôle d'un <strong>gestionnaire de mots de passe</strong> (en anglais <em>password manager</em>). Il génère et stocke des secrets forts et différents pour chaque site ; tu ne retiens qu'un seul mot de passe maître.</div>
<h3>3. L'authentification multifacteur (MFA)</h3>
<p>Un mot de passe, même excellent, peut fuiter. La parade la plus efficace est le <strong>MFA</strong> (en anglais <em>Multi-Factor Authentication</em>, authentification multifacteur), aussi appelé <strong>2FA</strong> quand il y a deux facteurs. L'idée : combiner <strong>plusieurs preuves de types différents</strong>. On classe les facteurs en trois familles :</p>
<pre class="pseudo"># Les trois familles de facteurs
1. Ce que je SAIS      -&gt; mot de passe, code PIN
2. Ce que je POSSEDE   -&gt; telephone (code SMS ou appli), cle de securite
3. Ce que je SUIS      -&gt; empreinte, visage (biometrie)
# MFA = combiner AU MOINS DEUX familles differentes.</pre>
<p>La force du MFA vient de là : un attaquant qui vole ton mot de passe (« ce que tu sais ») ne possède pas ton téléphone (« ce que tu possèdes »). Il lui manque un facteur, donc il reste dehors. C'est pourquoi activer le MFA sur les comptes importants (mail, banque) est l'un des gestes les plus protecteurs qui soient.</p>
<div class="warn">Combiner deux mots de passe n'est PAS du MFA : ce sont deux fois « ce que je sais », la même famille. Le multifacteur exige des <strong>familles différentes</strong> (par exemple un mot de passe ET un code sur le téléphone).</div>
<h3>4. Quelques bonnes habitudes</h3>
<p>Ne jamais réutiliser un mot de passe d'un site à l'autre (une fuite en contaminerait plusieurs), ne jamais le partager, se méfier du phishing qui vise justement à le voler, et préférer une application d'authentification (TOTP) au SMS quand c'est possible, le SMS étant plus facile à intercepter.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Mot de passe fort = LONG + UNIQUE par service + rien de personnel.
# Un gestionnaire de mots de passe stocke des secrets forts et differents.
# MFA / 2FA = combiner plusieurs FAMILLES de facteurs :
#   ce que je SAIS + ce que je POSSEDE + ce que je SUIS.
# Deux mots de passe = PAS du MFA (meme famille).
# Activer le MFA sur les comptes sensibles (mail, banque).</pre>`,
  exercises: [
    { type: "qcm", q: "Que vérifie l'authentification ?", opts: ["Ce que tu as le droit de faire", "Ton identité (que tu es bien qui tu prétends être)", "La force du mot de passe choisi", "Le nombre de tentatives de connexion"], a: 1, exp: "L'authentification prouve l'identité ; l'autorisation gère les droits ensuite." },
    { type: "qcm", q: "Quelle caractéristique compte le plus pour un mot de passe robuste ?", opts: ["Sa longueur", "Qu'il contienne le prénom de l'utilisateur", "Qu'il soit court pour être tapé vite", "Qu'il soit identique partout"], a: 0, exp: "La longueur est le facteur numéro un de résistance." },
    { type: "input", q: "Que signifie le sigle MFA ? (trois mots en français, avec « authentification »)", a: ["authentification multifacteur", "authentification multi facteur", "authentification a plusieurs facteurs", "multi factor authentication"], ph: "authentification …", exp: "MFA = authentification multifacteur (Multi-Factor Authentication)." },
    { type: "qcm", q: "Parmi ces exemples, lequel appartient à la famille « ce que je possède » ?", opts: ["Un mot de passe", "Un code PIN", "Un code envoyé sur le téléphone", "Une empreinte digitale"], a: 2, exp: "Le téléphone (code SMS ou appli) est quelque chose que l'on possède." },
    { type: "vf", q: "Combiner deux mots de passe différents constitue une authentification multifacteur.", a: false, exp: "Non : deux mots de passe = deux fois « ce que je sais », la même famille." },
    { type: "input", q: "Comment appelle-t-on l'outil qui génère et stocke un mot de passe fort et unique par site ? (deux mots)", a: ["gestionnaire de mots de passe", "gestionnaire de mot de passe", "password manager", "un gestionnaire de mots de passe"], ph: "gestionnaire de …", exp: "Un gestionnaire de mots de passe stocke des secrets forts et différents." },
    { type: "qcm", q: "À quelle famille appartient une empreinte digitale ou la reconnaissance du visage ?", opts: ["Ce que je sais", "Ce que je possède", "Ce que je suis (biométrie)", "Ce que je vois"], a: 2, exp: "La biométrie relève de « ce que je suis »." },
    { type: "qcm", q: "Pourquoi le MFA protège-t-il même si le mot de passe fuite ?", opts: ["Parce qu'il rend le mot de passe plus long", "Parce qu'il manque à l'attaquant le second facteur (ex. le téléphone)", "Parce qu'il chiffre le disque", "Parce qu'il verrouille le compte dès qu'une fuite est détectée"], a: 1, exp: "Sans le facteur possédé, le mot de passe volé ne suffit pas." },
    { type: "vf", q: "Il faut utiliser un mot de passe différent pour chaque service.", a: true, exp: "Oui : une fuite sur un site ne doit pas compromettre les autres comptes." },
    { type: "input", q: "Combien de familles de facteurs différentes le MFA doit-il combiner au minimum ?", a: ["2", "deux"], ph: "un nombre", exp: "Au moins deux familles différentes (savoir, posséder, être)." },
    { type: "qcm", q: "Lequel de ces mots de passe est le plus solide ?", opts: ["azerty", "P@ssw0rd!", "cheval-bleu-tasse-Lundi7", "prenom2010"], a: 2, exp: "Long et imprévisible : la phrase de passe l'emporte largement." },
    { type: "vf", q: "Une application d'authentification (TOTP) est généralement préférable au SMS pour le second facteur.", a: true, exp: "Oui : le SMS est plus facile à intercepter qu'un code généré par appli." },
    { type: "qcm", q: "Quel est l'autre nom du MFA quand il n'utilise que deux facteurs ?", opts: ["1FA", "2FA", "DNS", "TLS"], a: 1, exp: "Deux facteurs = 2FA (cas particulier du MFA)." },
    { type: "qcm", q: "Que ne doit-on JAMAIS inclure dans un mot de passe ?", opts: ["Des lettres", "Des informations personnelles (nom, date de naissance)", "De la longueur", "Des chiffres"], a: 1, exp: "Les données personnelles sont faciles à deviner : à proscrire." },
    { type: "input", q: "Comment nomme-t-on l'étape qui décide ce qu'un utilisateur A LE DROIT de faire, après l'authentification ? (un mot)", a: ["autorisation", "l'autorisation", "authorization"], ph: "un mot", exp: "L'autorisation attribue les droits une fois l'identité vérifiée." }
  ],
  final: {
    title: "Exercice final — Sécuriser le compte de Théo",
    intro: `<p>Théo utilise « theo2001 » sur tous ses sites et n'a activé aucune protection supplémentaire. Aide-le à corriger le tir.</p>`,
    questions: [
      { type: "qcm", q: "Premier défaut de « theo2001 » ?", opts: ["Il est trop long", "Il est court, personnel et donc devinable", "Il contient trop de symboles", "Il ne contient pas assez de symboles"], a: 1, exp: "Court + prénom + année : facilement deviné." },
      { type: "vf", q: "Réutiliser le même mot de passe partout est risqué : une seule fuite compromet tous ses comptes.", a: true, exp: "Oui : l'unicité par service limite la casse en cas de fuite." },
      { type: "input", q: "Quel type d'outil lui conseilles-tu pour gérer un mot de passe unique par site ? (deux mots)", a: ["gestionnaire de mots de passe", "gestionnaire de mot de passe", "password manager"], ph: "gestionnaire de …", exp: "Un gestionnaire de mots de passe génère et retient les secrets forts." },
      { type: "qcm", q: "Il active un code envoyé sur son téléphone en plus du mot de passe. Comment appelle-t-on cela ?", opts: ["Un antivirus", "Le MFA / 2FA (deux familles de facteurs)", "Un pare-feu", "Un VPN"], a: 1, exp: "Mot de passe (savoir) + téléphone (posséder) = MFA." },
      { type: "qcm", q: "Pour le second facteur, que vaut-il mieux privilégier ?", opts: ["Le SMS toujours", "Une application d'authentification (TOTP), plus difficile à intercepter", "Une seconde question secrète", "Un mot de passe encore plus long"], a: 1, exp: "L'appli TOTP est plus sûre que le SMS." }
    ],
    solution: `<pre class="pseudo"># Plan de securisation du compte de Theo :
1. Remplacer "theo2001" par une phrase de passe LONGUE (12+), sans info perso.
2. Un mot de passe UNIQUE par service, gere par un gestionnaire de mots de passe.
3. Activer le MFA/2FA : mot de passe (ce que je sais) + code sur le telephone
   (ce que je possede) = deux familles differentes.
4. Preferer une appli d'authentification (TOTP) au SMS.</pre>
<p>Avec un secret fort et unique plus un second facteur, même un mot de passe volé ne suffit plus à entrer.</p>`
  }
};
</script>
