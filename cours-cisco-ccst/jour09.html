  title: "L'adresse IPv4 (structure, notation décimale pointée)",
  subtitle: "Le numéro de rue de chaque appareil sur le réseau.",
  theory: `
<h3>1. À quoi sert une adresse IP ?</h3>
<p>Pour qu'un appareil parle à un autre sur un réseau, il lui faut une <strong>adresse</strong>. C'est exactement comme le courrier postal : pour envoyer une lettre, il faut connaître l'adresse du destinataire. Sur Internet et dans les réseaux locaux, cette adresse s'appelle l'<strong>adresse IP</strong> (<em>Internet Protocol address</em>). La version la plus répandue depuis des décennies est la <strong>version 4</strong>, l'<strong>IPv4</strong>. Chaque carte réseau qui participe à un réseau IP possède au moins une adresse IPv4.</p>
<h3>2. Une adresse IPv4 fait 32 bits</h3>
<p>Une adresse IPv4 est un nombre codé sur <strong>32 bits</strong>, c'est-à-dire 32 chiffres binaires (des 0 et des 1). Pour un ordinateur, une adresse ressemble donc à une longue suite comme <code>11000000.10101000.00000001.00001010</code>. Comme 32 zéros ou uns sont illisibles pour un humain, on découpe ces 32 bits en <strong>4 groupes de 8 bits</strong>. Un groupe de 8 bits s'appelle un <strong>octet</strong> (en anglais <em>octet</em> ou <em>byte</em>).</p>
<div class="tip">32 bits = 4 octets de 8 bits chacun. Comme 8 bits permettent d'écrire des valeurs de 0 à 255, chaque octet vaut entre <strong>0 et 255</strong>.</div>
<h3>3. La notation décimale pointée</h3>
<p>Pour rendre l'adresse lisible, on convertit chaque octet en nombre décimal (base 10) et on sépare les quatre nombres par des points. C'est la <strong>notation décimale pointée</strong> (<em>dotted decimal notation</em>). L'adresse binaire ci-dessus devient ainsi <code>192.168.1.10</code>. C'est cette forme, familière, que tu vois partout.</p>
<pre class="pseudo"># De 4 octets binaires vers la notation decimale pointee
11000000 . 10101000 . 00000001 . 00001010   (binaire)
   192   .   168    .    1     .    10       (decimal pointe)
# Chaque nombre entre les points = un octet = 0 a 255</pre>
<h3>4. Pourquoi 0 à 255 par octet ?</h3>
<p>Avec 8 bits, il existe 2 puissance 8 combinaisons, soit <strong>256 valeurs</strong> possibles. Elles vont de 0 (00000000) à 255 (11111111). Un nombre comme <code>192.168.1.300</code> est donc <strong>impossible</strong> : 300 dépasse 255. Retenir cette borne permet de repérer immédiatement une adresse invalide.</p>
<div class="warn">Piège fréquent : croire qu'un octet peut aller jusqu'à 999 ou 256. La valeur maximale d'un octet est <strong>255</strong>, et le nombre total de valeurs distinctes est <strong>256</strong> (de 0 à 255). Ne confonds pas 255 (la plus grande valeur) et 256 (le nombre de valeurs).</div>
<h3>5. Combien d'adresses IPv4 au total ?</h3>
<p>Avec 32 bits, on peut former environ <strong>4,3 milliards</strong> d'adresses (2 puissance 32). Cela paraît énorme, mais avec des milliards d'objets connectés, ces adresses sont devenues rares. C'est l'une des raisons qui ont poussé à créer l'IPv6, que tu verras plus tard.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IPv4 = adresse sur 32 bits
# 32 bits = 4 octets de 8 bits
# Notation decimale pointee : 4 nombres separes par des points
#   exemple : 192.168.1.10
# Chaque octet va de 0 a 255 (256 valeurs possibles)
# Total IPv4 : environ 4,3 milliards d'adresses (2^32)</pre>`,

    { type: "qcm", q: "Comment s'appelle la forme d'écriture « 192.168.1.10 » ?", opts: ["Notation hexadécimale", "Notation binaire", "Notation décimale pointée", "Notation scientifique"], a: 2, exp: "Quatre décimales séparées par des points : la notation décimale pointée." },

    { type: "qcm", q: "Combien de valeurs 8 bits permettent-ils au total ?", opts: ["128", "255", "256", "512"], a: 2, exp: "2^8 = 256 valeurs (de 0 à 255)." },

    { type: "vf", q: "IPv4 et IPv6 sont codées sur le même nombre de bits.", a: false, exp: "Non : IPv4 = 32 bits, IPv6 = 128 bits." },
    { type: "qcm", q: "Environ combien d'adresses IPv4 existe-t-il au total ?", opts: ["65 000", "environ 4,3 milliards", "environ 4,3 millions", "un nombre infini"], a: 1, exp: "2^32 ≈ 4,3 milliards d'adresses." },
    { type: "input", q: "Quelle est la plus grande valeur qu'un octet peut prendre ? (un nombre)", a: ["255"], ph: "un nombre", exp: "255 = 11111111 en binaire." },
    { type: "qcm", q: "Parmi ces adresses, laquelle est INVALIDE ?", opts: ["10.0.0.1", "172.16.5.4", "192.168.256.1", "8.8.8.8"], a: 2, exp: "256 dépasse la valeur maximale d'un octet (255)." },
    { type: "vf", q: "Chaque octet d'une adresse IPv4 peut valoir de 0 à 255.", a: true, exp: "Oui : 8 bits donnent 256 valeurs, de 0 à 255." }
  ],
  final: {
    title: "Exercice final — Lire et vérifier des adresses IPv4",

      { type: "qcm", q: "Laquelle de ces adresses est invalide ?", opts: ["192.168.1.1", "10.10.10.10", "172.300.0.1", "8.8.4.4"], a: 2, exp: "300 dépasse 255 : octet impossible." },
      { type: "vf", q: "L'adresse 0.0.0.0 respecte la règle « chaque octet de 0 à 255 ».", a: true, exp: "0 est bien dans l'intervalle 0-255, même si cette adresse a un usage particulier." },
      { type: "qcm", q: "Comment nomme-t-on l'écriture 192.168.1.10 ?", opts: ["Binaire", "Décimale pointée", "Hexadécimale", "Octale"], a: 1, exp: "C'est la notation décimale pointée." }
    ],
    solution: "<pre class=\"pseudo\"># Rappels verifies :\n# IPv4 = 32 bits = 4 octets\n# Chaque octet : 0 a 255 (256 valeurs)\n# 172.300.0.1 est INVALIDE (300 > 255)\n# Ecriture normale = notation decimale pointee : a.b.c.d</pre><p>Tu sais maintenant lire une adresse IPv4 et repérer une valeur impossible. Demain : le masque de sous-réseau, qui explique quelle partie de l'adresse désigne le réseau.</p>"
  }
