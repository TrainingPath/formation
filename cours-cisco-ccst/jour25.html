<script>
var DAY = {
  num: 25,
  title: "Diagnostiquer un problème de connectivité",
  subtitle: "Quand « ça ne marche pas », on remonte la piste dans l'ordre : câble, IP, passerelle, DNS.",
  theory: `
<h3>1. « Je n'ai plus internet » : par où commencer ?</h3>
<p>Un utilisateur t'appelle : « Ça ne marche plus ». Cette phrase ne dit rien de précis. Le rôle du technicien est de transformer ce ressenti en un <strong>diagnostic</strong> (en anglais <em>troubleshooting</em>). La bonne nouvelle : un réseau est un empilement de couches très logiques. Si on les vérifie <strong>dans l'ordre</strong>, du plus simple au plus complexe, on trouve presque toujours la panne. On suit une chaîne : le <strong>câble</strong> (ou le Wi-Fi), puis l'<strong>adresse IP</strong> de la machine, puis la <strong>passerelle</strong> (la porte de sortie), puis enfin le <strong>DNS</strong> (l'annuaire des noms). Un maillon casse la chaîne : dès qu'on le trouve, on tient la cause.</p>
<h3>2. Étape 1 et 2 : le câble et l'adresse IP</h3>
<p>On vérifie d'abord la <strong>couche physique</strong> : le câble est-il branché des deux côtés ? La LED du port clignote-t-elle ? Le Wi-Fi est-il activé ? Une prise débranchée est la panne la plus fréquente, et la plus vexante à oublier. Ensuite, on regarde si la machine a bien reçu une <strong>adresse IP</strong>. Sous Windows on tape <code>ipconfig</code>, sous Linux/macOS <code>ip a</code> (ou l'ancien <code>ifconfig</code>). Piège classique : une adresse qui commence par <strong>169.254.x.x</strong> signifie que le PC n'a PAS reçu d'adresse du serveur DHCP : il s'en est attribué une tout seul (adresse dite <em>APIPA</em>). Autrement dit, le DHCP ne répond pas.</p>
<pre class="pseudo"># Voir sa configuration IP
ipconfig            # Windows  (ipconfig /all pour tout voir)
ip a                # Linux / macOS moderne
ifconfig            # ancienne commande equivalente

# Signes a repC3rer :
#  - Adresse en 169.254.x.x  -&gt; pas de DHCP (probleme reseau local)
#  - Aucune adresse          -&gt; carte desactivee ou cable debranche</pre>
<div class="tip">La commande reine du diagnostic est <code>ping</code> : elle envoie un petit paquet et attend l'écho. <code>ping 127.0.0.1</code> teste ta propre carte réseau (la <em>loopback</em>) ; si même ça échoue, le problème est dans la machine elle-même.</div>
<h3>3. Étape 3 : la passerelle</h3>
<p>La <strong>passerelle par défaut</strong> (en anglais <em>default gateway</em>) est l'adresse du routeur, la « porte de sortie » du réseau local vers le reste du monde. On la trouve dans <code>ipconfig</code>. Le test : <code>ping</code> vers cette passerelle. Si elle répond, ton réseau local fonctionne ; si elle ne répond pas, le problème est entre ton PC et le routeur (câble, switch, Wi-Fi, mauvaise IP). On teste ainsi, de proche en proche : d'abord soi-même, puis la passerelle, puis une adresse sur internet.</p>
<pre class="pseudo"># Remonter la chaine avec ping
ping 127.0.0.1      # ma propre carte (loopback) fonctionne ?
ping 192.168.1.1    # ma passerelle (routeur) repond ?
ping 8.8.8.8        # une IP publique sur internet repond ?</pre>
<h3>4. Étape 4 : le DNS</h3>
<p>Dernier maillon : le <strong>DNS</strong> (Domain Name System), l'annuaire qui traduit un nom comme <em>cisco.com</em> en adresse IP. Le test qui isole ce cas est révélateur : si <code>ping 8.8.8.8</code> (une IP) fonctionne mais que <code>ping cisco.com</code> (un nom) échoue, alors le réseau va bien, mais la <strong>résolution des noms</strong> est cassée. C'est un problème de DNS. On le confirme avec <code>nslookup cisco.com</code>, qui interroge directement l'annuaire.</p>
<pre class="pseudo"># Isoler un probleme de DNS
ping 8.8.8.8        # OK  -&gt; le reseau marche
ping cisco.com      # ECHEC -&gt; ce n'est PAS le reseau, c'est le DNS
nslookup cisco.com  # interroge l'annuaire des noms directement</pre>
<div class="warn">Ne saute jamais d'étape. Reconfigurer le DNS alors que le vrai problème est un câble débranché fait perdre des heures. La méthode ordonnée « câble → IP → passerelle → DNS » évite ce piège.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># La chaine de diagnostic, dans l'ordre :
1. Cable / Wi-Fi   -&gt; branche ? LED ? Wi-Fi active ?
2. Adresse IP      -&gt; ipconfig / ip a  (attention au 169.254.x.x = pas de DHCP)
3. Passerelle      -&gt; ping vers le routeur (ex. 192.168.1.1)
4. DNS             -&gt; ping IP OK mais ping nom KO = DNS ; nslookup pour confirmer
# Outils : ping, ipconfig/ip a, tracert/traceroute, nslookup</pre>`,
  exercises: [
    { type: "qcm", q: "Dans quel ordre logique diagnostique-t-on une panne de connectivité ?", opts: ["DNS, puis IP, puis câble", "Câble, puis IP, puis passerelle, puis DNS", "Passerelle, puis câble, puis DNS", "Peu importe l'ordre"], a: 1, exp: "On remonte du plus simple/physique au plus abstrait : câble, IP, passerelle, DNS." },
    { type: "qcm", q: "Quelle commande affiche la configuration IP sous Windows ?", opts: ["ip a", "ipconfig", "ifconfig", "nslookup"], a: 1, exp: "ipconfig (Windows). Sous Linux/macOS on utilise ip a ou ifconfig." },
    { type: "input", q: "Quelle commande, suivie d'une adresse, envoie un paquet et attend l'écho pour tester la joignabilité ?", a: ["ping"], ph: "une commande", exp: "ping envoie une requête d'écho et mesure la réponse." },
    { type: "qcm", q: "Une machine affiche une adresse en 169.254.x.x. Que faut-il en déduire ?", opts: ["Tout va bien", "Elle n'a pas reçu d'adresse du serveur DHCP", "Le DNS est cassé", "Le pare-feu bloque"], a: 1, exp: "169.254.x.x (APIPA) = auto-attribution car aucun DHCP n'a répondu." },
    { type: "vf", q: "ping 127.0.0.1 permet de tester la propre carte réseau de la machine (la loopback).", a: true, exp: "127.0.0.1 est l'adresse de bouclage : elle teste la pile réseau locale." },
    { type: "input", q: "Comment appelle-t-on l'adresse du routeur, la « porte de sortie » du réseau local (deux mots) ?", a: ["passerelle par defaut", "passerelle", "default gateway", "la passerelle"], ph: "deux mots", exp: "La passerelle par défaut (default gateway) est l'adresse du routeur." },
    { type: "qcm", q: "ping 8.8.8.8 fonctionne, mais ping cisco.com échoue. Où est le problème ?", opts: ["Le câble", "L'adresse IP", "Le DNS (résolution des noms)", "La passerelle par défaut"], a: 2, exp: "L'IP passe mais pas le nom : la résolution DNS est en cause." },
    { type: "qcm", q: "Quelle commande interroge directement l'annuaire des noms pour un domaine ?", opts: ["ping", "nslookup", "ipconfig", "netstat"], a: 1, exp: "nslookup interroge le DNS pour traduire un nom en adresse IP." },
    { type: "vf", q: "Il vaut mieux reconfigurer le DNS en premier, avant de vérifier le câble.", a: false, exp: "Non : on commence par le plus simple (le câble). Sauter des étapes fait perdre du temps." },
    { type: "qcm", q: "À quoi sert la passerelle par défaut ?", opts: ["À attribuer les adresses IP", "À sortir du réseau local vers les autres réseaux", "À traduire les noms en IP", "À filtrer les connexions dangereuses"], a: 1, exp: "C'est la porte de sortie du LAN, gérée par le routeur." },
    { type: "input", q: "Quelle commande Linux/macOS moderne affiche les interfaces et adresses (deux caractères après « ip ») ?", a: ["ip a", "ip addr", "ip address"], ph: "ip …", exp: "ip a (raccourci de ip address) liste les interfaces et leurs adresses." },
    { type: "vf", q: "Le DNS traduit un nom de domaine (cisco.com) en une adresse IP.", a: true, exp: "Oui : le Domain Name System est l'annuaire nom -> adresse." },
    { type: "qcm", q: "La passerelle répond au ping mais internet est injoignable. Quelle piste privilégier ensuite ?", opts: ["Le câble entre PC et prise", "Le lien du routeur vers internet (FAI) et/ou le DNS", "La carte réseau du PC", "Le serveur DHCP local"], a: 1, exp: "Le LAN est bon (passerelle OK) : on regarde vers le routeur/FAI puis le DNS." },
    { type: "qcm", q: "Que signifie « troubleshooting » ?", opts: ["Installer un réseau", "Diagnostiquer et résoudre une panne", "Configurer un pare-feu", "Sauvegarder des fichiers"], a: 1, exp: "Troubleshooting = démarche de diagnostic et de dépannage." },
    { type: "input", q: "Quelle option ajoute-t-on à ipconfig sous Windows pour voir TOUS les détails (DNS, DHCP, MAC) ?", a: ["/all", "all", "ipconfig /all"], ph: "/…", exp: "ipconfig /all affiche la configuration complète, y compris DNS et DHCP." }
  ],
  final: {
    title: "Exercice final — Retrouver la panne de Karim",
    intro: `<p>Karim ne peut plus ouvrir aucun site. Tu prends la main. <code>ipconfig</code> affiche une adresse <strong>169.254.12.7</strong> et aucune passerelle. Applique la méthode.</p>`,
    questions: [
      { type: "qcm", q: "Que t'apprend l'adresse 169.254.12.7 ?", opts: ["Tout est normal", "Le PC n'a pas reçu d'IP du DHCP", "Le DNS est en panne", "Le site est fermé"], a: 1, exp: "169.254.x.x = APIPA : aucun serveur DHCP n'a répondu." },
      { type: "qcm", q: "Quelle est la première vérification physique à faire ?", opts: ["Changer le DNS", "Vérifier le câble/Wi-Fi et la LED du port", "Redémarrer le routeur", "Reconfigurer l'adresse IP manuellement"], a: 1, exp: "On commence toujours par la couche physique : câble, LED, Wi-Fi." },
      { type: "vf", q: "Comme il n'a pas de passerelle, tester ping vers un site par son nom est la priorité.", a: false, exp: "Sans IP valide ni passerelle, le DNS n'est pas le sujet : on répare d'abord le lien local." },
      { type: "input", q: "Après avoir rebranché le câble, quelle commande Windows force le renouvellement d'adresse ? (donne la commande complète)", a: ["ipconfig /renew", "ipconfig/renew"], ph: "ipconfig /…", exp: "ipconfig /renew redemande une adresse au serveur DHCP." },
      { type: "qcm", q: "Le PC obtient 192.168.1.50 et une passerelle 192.168.1.1. Quel test valide le réseau local ?", opts: ["nslookup", "ping 192.168.1.1", "ipconfig /all", "tracert 8.8.8.8"], a: 1, exp: "Un ping vers la passerelle confirme que le LAN fonctionne." }
    ],
    solution: `<pre class="pseudo"># Deroule complet du cas Karim :
1. 169.254.12.7  -&gt; pas de DHCP. On NE touche PAS au DNS.
2. Cable / Wi-Fi -&gt; on rebranche, la LED s'allume.
3. ipconfig /renew -&gt; le PC obtient 192.168.1.50, passerelle 192.168.1.1
4. ping 192.168.1.1 -&gt; repond : le LAN est bon
5. ping 8.8.8.8 puis ping cisco.com -&gt; les deux repondent : resolu.</pre>
<p>La cause était un câble débranché ayant coupé le DHCP. En suivant l'ordre câble -&gt; IP -&gt; passerelle -&gt; DNS, on l'a trouvée sans détour.</p>`
  }
};
</script>
