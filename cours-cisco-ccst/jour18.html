var DAY = {

  title: "Le rôle du commutateur",
  subtitle: "Couche 2, table MAC et domaines de collision : comment le switch aiguille les trames.",
  theory: `
<h3>1. Le commutateur, chef de gare de la couche 2</h3>
<p>Le <strong>commutateur</strong> (en anglais <em>switch</em>) travaille au <strong>niveau 2</strong> du modèle OSI, la <strong>couche liaison de données</strong>. À ce niveau, les données voyagent sous forme de <strong>trames</strong> (en anglais <em>frames</em>) et l'adresse qui compte n'est pas l'adresse IP mais l'<strong>adresse MAC</strong> : un numéro unique gravé sur chaque carte réseau, comme une plaque d'immatriculation d'usine.</p>
<p>Le rôle du switch est simple à formuler : recevoir une trame sur un port, regarder à qui elle est destinée, et l'envoyer <strong>uniquement au bon port</strong>. C'est un aiguilleur intelligent, contrairement à l'ancien <strong>hub</strong> (concentrateur) qui recopiait bêtement chaque signal sur tous ses ports.</p>
<h3>2. La table MAC : le carnet d'adresses du switch</h3>
<p>Pour aiguiller correctement, le switch tient à jour une <strong>table d'adresses MAC</strong> (aussi appelée <em>table CAM</em>). Cette table associe chaque <strong>adresse MAC</strong> au <strong>port</strong> derrière lequel elle se trouve. Le switch la construit tout seul, par <strong>apprentissage</strong> : chaque fois qu'une trame arrive, il note l'adresse MAC de l'expéditeur et le port d'entrée.</p>
<pre class="pseudo"># Exemple de table MAC apprise par le switch
Adresse MAC          Port
00:11:22:AA:BB:CC    Fa0/1
00:11:22:DD:EE:FF    Fa0/2
00:11:22:33:44:55    Fa0/3
# -> pour joindre 00:11:22:DD:EE:FF, le switch envoie SEULEMENT sur Fa0/2</pre>
<div class="tip">Le switch <strong>apprend l'adresse source</strong> (l'expéditeur) et <strong>décide sur l'adresse destination</strong>. C'est la clé pour comprendre son fonctionnement.</div>
<h3>3. Et si l'adresse est inconnue ?</h3>
<p>Quand le switch reçoit une trame pour une adresse MAC qu'il <strong>ne connaît pas encore</strong>, il ne la jette pas : il l'envoie sur <strong>tous les ports</strong> sauf celui d'origine. C'est ce qu'on appelle une <strong>inondation</strong> (en anglais <em>flooding</em>). Dès que le destinataire répond, le switch apprend son port et n'aura plus besoin d'inonder. Les trames de <strong>diffusion</strong> (<em>broadcast</em>, destinées à tout le monde) sont, elles, toujours envoyées partout.</p>
<h3>4. Domaines de collision et domaines de diffusion</h3>
<p>Sur un vieux hub, si deux machines parlaient en même temps, leurs signaux se percutaient : c'était une <strong>collision</strong>. Toutes les prises d'un hub formaient un seul <strong>domaine de collision</strong>. Le switch change tout : <strong>chaque port est son propre domaine de collision</strong>. Résultat, en mode <em>full-duplex</em>, il n'y a plus de collisions du tout.</p>
<div class="warn">Ne confonds pas les deux : le switch <strong>découpe</strong> les domaines de collision (un par port), mais il <strong>ne découpe pas</strong> les domaines de diffusion. Séparer les domaines de diffusion, c'est le travail du routeur (ou des VLAN).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Switch = couche 2 (liaison), travaille avec les ADRESSES MAC
# Table MAC : associe chaque adresse MAC au PORT correspondant
#   -> apprend l'adresse SOURCE, decide sur l'adresse DESTINATION
# Adresse destination inconnue -> inondation (flooding) sur tous les ports
# 1 port = 1 domaine de COLLISION (le switch les separe)
# Le switch NE separe PAS les domaines de diffusion (c'est le routeur)</pre>`,

    { type: "qcm", q: "Comment le switch remplit-il sa table MAC ?", opts: ["On la saisit à la main", "En apprenant l'adresse MAC source des trames reçues", "En interrogeant le serveur DNS", "En recopiant la table du routeur"], a: 1, exp: "Le switch apprend automatiquement l'adresse source et le port d'entrée." },
    { type: "qcm", q: "Que fait le switch d'une trame dont l'adresse MAC de destination est inconnue ?", opts: ["Il la supprime", "Il l'envoie sur tous les ports sauf celui d'origine (inondation)", "Il la renvoie à l'expéditeur", "Il demande l'adresse au routeur"], a: 1, exp: "Adresse inconnue = inondation (flooding) sur tous les ports sauf l'entrée." },

    { type: "qcm", q: "Quel ancien appareil recopiait le signal sur tous ses ports sans réfléchir ?", opts: ["Le routeur", "Le hub (concentrateur)", "Le pare-feu", "Le modem"], a: 1, exp: "Le hub diffusait tout partout ; le switch, lui, aiguille intelligemment." },
    { type: "vf", q: "Le switch décide où envoyer une trame en regardant l'adresse MAC de destination.", a: true, exp: "Oui : il décide sur l'adresse destination et apprend sur l'adresse source." },

    { type: "vf", q: "Une trame de diffusion (broadcast) est envoyée sur tous les ports du switch.", a: true, exp: "Oui : un broadcast est destiné à tout le monde, donc envoyé partout." },
    { type: "vf", q: "Le switch utilise les adresses IP pour aiguiller les trames.", a: false, exp: "Non : le switch travaille en couche 2 avec les adresses MAC, pas les adresses IP." },
    { type: "input", q: "Comment appelle-t-on la table qui associe adresses MAC et ports dans un switch ?", a: ["table mac", "la table mac", "table d'adresses mac", "table cam", "table des adresses mac"], ph: "deux mots", exp: "C'est la table MAC (ou table CAM)." },
    { type: "input", q: "Quel type d'adresse (3 lettres) le switch utilise-t-il pour aiguiller ?", a: ["mac", "adresse mac", "l'adresse mac"], ph: "3 lettres", exp: "L'adresse MAC, gravée sur chaque carte réseau." },
    { type: "input", q: "Comment nomme-t-on le fait d'envoyer une trame sur tous les ports quand la destination est inconnue ?", a: ["inondation", "l'inondation", "flooding", "le flooding"], ph: "un mot", exp: "L'inondation (flooding) : diffusion sur tous les ports sauf l'origine." },
    { type: "input", q: "Le switch découpe le réseau en plusieurs domaines de … (un mot) : un par port.", a: ["collision", "collisions", "de collision"], ph: "un mot", exp: "Chaque port est un domaine de collision distinct." },
    { type: "input", q: "Sur quelle adresse le switch APPREND-il pour remplir sa table (source ou destination) ?", a: ["source", "l'adresse source", "adresse source", "la source"], ph: "un mot", exp: "Il apprend sur l'adresse source et décide sur l'adresse destination." }
  ],
  final: {
    title: "Exercice final — Le switch apprend",
    intro: `<p>Un switch neuf vient d'être allumé, sa table MAC est vide. Le PC-A (MAC 00:11:22:AA:BB:CC, port Fa0/1) envoie une trame au PC-B (MAC 00:11:22:DD:EE:FF, port Fa0/2). Suivons ce qui se passe.</p>`,
    questions: [
      { type: "vf", q: "En recevant la trame de PC-A, le switch note l'association 00:11:22:AA:BB:CC ↔ Fa0/1.", a: true, exp: "Oui : il apprend l'adresse source (PC-A) et son port d'entrée." },
      { type: "qcm", q: "Comme l'adresse de PC-B n'est pas encore connue, le switch…", opts: ["Supprime la trame", "L'envoie sur tous les ports sauf Fa0/1 (inondation)", "La renvoie à PC-A", "Interroge le routeur pour localiser PC-B"], a: 1, exp: "Destination inconnue = inondation sur tous les ports sauf l'entrée." },
      { type: "qcm", q: "Quand PC-B répond, le switch apprend…", opts: ["Rien de plus", "L'association de PC-B (00:11:22:DD:EE:FF ↔ Fa0/2)", "L'adresse IP de PC-A", "L'adresse IP de PC-B"], a: 1, exp: "Il apprend l'adresse source de PC-B et son port Fa0/2." },
      { type: "vf", q: "Aux échanges suivants, le switch enverra la trame pour PC-B uniquement sur Fa0/2.", a: true, exp: "Oui : une fois l'adresse apprise, plus besoin d'inonder." },
      { type: "qcm", q: "Combien de domaines de collision impliquent les ports Fa0/1 et Fa0/2 ?", opts: ["Un seul partagé", "Deux (un par port)", "Zéro", "Trois"], a: 1, exp: "Chaque port est son propre domaine de collision : ici deux." }
    ],
    solution: `<pre class="pseudo"># Deroulement de l'apprentissage :
1. PC-A emet -> switch apprend  MAC-A <-> Fa0/1  (adresse SOURCE)
2. Destination PC-B inconnue -> INONDATION sur tous les ports sauf Fa0/1
3. PC-B repond -> switch apprend  MAC-B <-> Fa0/2
4. Ensuite : trames vers PC-B envoyees UNIQUEMENT sur Fa0/2
# Chaque port = 1 domaine de collision.</pre>
<p>Le switch a construit sa table tout seul. Demain : le routeur et la couche 3.</p>`
  }
};
