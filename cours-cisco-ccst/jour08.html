<script>
var DAY = {
  num: 8,
  title: "Les topologies réseau",
  subtitle: "Étoile, bus, maillée : la forme d'un réseau, physique et logique.",
  theory: `
<h3>1. Qu'est-ce qu'une topologie ?</h3>
<p>La <strong>topologie</strong> d'un réseau décrit sa <strong>forme</strong> : comment les appareils sont reliés entre eux. C'est un peu le « plan » du réseau. Bien connaître les topologies aide à comprendre comment les données circulent et ce qui se passe si un lien tombe en panne. C'est un point classique de la certification CCST.</p>
<div class="tip">On distingue deux façons de voir la forme d'un réseau : la topologie <strong>physique</strong> (comment les câbles sont réellement branchés) et la topologie <strong>logique</strong> (comment les données circulent réellement). Les deux ne coïncident pas toujours.</div>
<h3>2. La topologie en étoile (star)</h3>
<p>Dans la topologie <strong>en étoile</strong>, tous les appareils sont reliés à un <strong>point central</strong>, généralement un <strong>switch</strong>. C'est de loin la topologie la plus utilisée dans les réseaux modernes. Elle est simple à gérer : si un câble d'un appareil casse, seul cet appareil est coupé, les autres continuent.</p>
<pre class="pseudo"># Topologie en etoile (la plus courante)
        PC1
         |
 PC4 -- SWITCH -- PC2
         |
        PC3
# Tout passe par le point central (le switch)</pre>
<div class="warn">Le point faible de l'étoile est son centre : si le switch central tombe en panne, tout le réseau local est coupé. En revanche, la panne d'un seul câble n'affecte qu'un seul appareil.</div>
<h3>3. La topologie en bus</h3>
<p>Dans la topologie <strong>en bus</strong>, tous les appareils partagent un <strong>seul câble commun</strong>, comme des maisons le long d'une même route. C'est une topologie <strong>ancienne</strong>, peu utilisée aujourd'hui. Son défaut majeur : si le câble principal est coupé, <strong>tout le réseau tombe</strong>. De plus, un seul appareil peut parler à la fois.</p>
<pre class="pseudo"># Topologie en bus (ancienne)
PC1 --- PC2 --- PC3 --- PC4
   (un seul cable partage par tous)</pre>
<h3>4. La topologie maillée (mesh)</h3>
<p>Dans la topologie <strong>maillée</strong> (<em>mesh</em>), les appareils sont reliés par <strong>plusieurs chemins</strong> entre eux. Dans un maillage complet, chaque appareil est relié à tous les autres. C'est <strong>très robuste</strong> : si un lien tombe, les données passent par un autre chemin. En contrepartie, c'est <strong>coûteux</strong> en câbles. On la retrouve souvent au cœur des grands réseaux et d'Internet, pour la fiabilité.</p>
<pre class="pseudo"># Topologie maillee (robuste)
R1 === R2
|  \\  / |
|   \\/  |
|   /\\  |
R3 === R4
# Plusieurs chemins : si un lien casse, un autre prend le relais</pre>
<h3>5. Topologie physique contre logique</h3>
<p>Voici un point subtil mais important. La topologie <strong>physique</strong> est le branchement réel des câbles. La topologie <strong>logique</strong> est le trajet réel des données. Exemple : dans beaucoup de réseaux Ethernet modernes, la topologie physique est une <strong>étoile</strong> (tout est câblé vers un switch central), même si logiquement les données peuvent circuler de multiples façons.</p>
<pre class="pseudo"># Deux regards sur un meme reseau
Topologie physique : la disposition reelle des cables
Topologie logique  : le chemin reel suivi par les donnees
Ex : cablage en etoile (physique) autour d'un switch central</pre>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Topologie = la forme du reseau (son plan)
# Etoile : appareils relies a un switch central (la plus courante)
# Bus    : un seul cable commun (ancienne, fragile)
# Maillee: plusieurs chemins, tres robuste mais couteuse
# Physique = cables reels | Logique = trajet des donnees</pre>`,
  exercises: [
    { type: "qcm", q: "Que décrit la topologie d'un réseau ?", opts: ["Sa vitesse maximale", "Sa forme : comment les appareils sont reliés", "La façon dont les adresses IP sont attribuées", "Le système d'exploitation des ordinateurs"], a: 1, exp: "La topologie décrit la forme du réseau : comment les appareils sont reliés." },
    { type: "qcm", q: "Dans la topologie en étoile, à quoi sont reliés tous les appareils ?", opts: ["Un seul câble commun", "Un point central (souvent un switch)", "Directement les uns aux autres, deux par deux", "Un routeur externe uniquement"], a: 1, exp: "En étoile, tous les appareils se connectent à un point central, souvent un switch." },
    { type: "input", q: "Quelle topologie est la plus utilisée dans les réseaux locaux modernes ? (un mot)", a: ["etoile", "étoile", "en etoile", "en étoile", "star"], ph: "un mot", exp: "La topologie en étoile est la plus courante aujourd'hui." },
    { type: "qcm", q: "Dans la topologie en bus, que se passe-t-il si le câble principal est coupé ?", opts: ["Rien, tout continue", "Tout le réseau tombe", "Seul un appareil est coupé", "Le trafic est redirigé automatiquement par un autre chemin"], a: 1, exp: "En bus, couper le câble commun fait tomber tout le réseau." },
    { type: "qcm", q: "Quelle topologie relie les appareils par plusieurs chemins pour plus de robustesse ?", opts: ["En bus", "En étoile", "Maillée (mesh)", "En anneau (token ring)"], a: 2, exp: "La topologie maillée (mesh) offre plusieurs chemins et donc une grande robustesse." },
    { type: "vf", q: "Dans une topologie en étoile, la panne d'un seul câble ne coupe qu'un seul appareil.", a: true, exp: "Vrai : en étoile, un câble cassé n'affecte que l'appareil concerné." },
    { type: "input", q: "Comment appelle-t-on la topologie où tous les appareils partagent un seul câble commun ? (un mot)", a: ["bus", "en bus", "topologie bus"], ph: "un mot", exp: "C'est la topologie en bus (ancienne)." },
    { type: "vf", q: "La topologie maillée est plus coûteuse en câbles que les autres.", a: true, exp: "Vrai : relier plusieurs chemins demande davantage de câbles, donc plus de coût." },
    { type: "qcm", q: "Quel est le principal point faible de la topologie en étoile ?", opts: ["Elle exige un câble direct entre chaque paire d'appareils", "Si le point central (switch) tombe, tout le réseau est coupé", "Elle ne fonctionne pas avec le Wi-Fi", "Elle limite le réseau à deux appareils maximum"], a: 1, exp: "Le point faible de l'étoile est son centre : si le switch tombe, tout est coupé." },
    { type: "input", q: "Quel équipement se trouve typiquement au centre d'une topologie en étoile ?", a: ["switch", "un switch", "le switch", "commutateur", "le commutateur"], ph: "un équipement", exp: "Un switch (commutateur) est généralement au centre de l'étoile." },
    { type: "qcm", q: "Quelle est la différence entre topologie physique et logique ?", opts: ["Aucune, c'est pareil", "La physique décrit le câblage réel, la logique le trajet réel des données", "La physique décrit le trajet des données, la logique le câblage réel", "La logique est toujours en bus"], a: 1, exp: "Physique = câblage réel ; logique = trajet réellement suivi par les données." },
    { type: "vf", q: "La topologie physique et la topologie logique coïncident toujours parfaitement.", a: false, exp: "Faux : elles peuvent différer (ex : câblage en étoile mais circulation logique variée)." },
    { type: "qcm", q: "Pourquoi la topologie maillée est-elle utilisée au cœur des grands réseaux ?", opts: ["Parce qu'elle est la moins chère", "Pour sa robustesse : si un lien tombe, un autre chemin prend le relais", "Parce qu'elle utilise moins de câbles que les autres topologies", "Parce qu'un seul équipement central suffit à tout relier"], a: 1, exp: "La maille assure la fiabilité : plusieurs chemins évitent la coupure totale." },
    { type: "vf", q: "La topologie en bus est aujourd'hui la plus répandue dans les entreprises.", a: false, exp: "Faux : le bus est ancien et peu utilisé ; l'étoile domine aujourd'hui." },
    { type: "input", q: "Quel mot anglais désigne la topologie en étoile ?", a: ["star", "star topology"], ph: "un mot anglais", exp: "En anglais, la topologie en étoile se dit « star »." }
  ],
  final: {
    title: "Exercice final — Choisir et analyser une topologie",
    intro: `<p>Une petite entreprise câble son bureau : chaque poste est relié à un switch central. Au cœur de son infrastructure, plusieurs routeurs sont interconnectés par de multiples liens pour éviter toute coupure. Analysons ces choix.</p>`,
    questions: [
      { type: "qcm", q: "Le câblage des postes vers un switch central est une topologie…", opts: ["En bus", "En étoile", "Maillée", "En anneau"], a: 1, exp: "Postes reliés à un switch central : topologie en étoile." },
      { type: "input", q: "L'équipement au centre de cette étoile est un… (un mot)", a: ["switch", "un switch", "commutateur"], ph: "un mot", exp: "C'est un switch (commutateur)." },
      { type: "qcm", q: "Les routeurs interconnectés par de multiples liens forment une topologie…", opts: ["En bus", "Maillée (mesh)", "En étoile simple", "En anneau"], a: 1, exp: "De multiples liens entre routeurs = topologie maillée." },
      { type: "vf", q: "La topologie maillée entre les routeurs améliore la robustesse en cas de panne d'un lien.", a: true, exp: "Vrai : un autre chemin prend le relais si un lien tombe." },
      { type: "qcm", q: "Si le switch central du bureau tombe en panne, que se passe-t-il ?", opts: ["Rien du tout", "Tout le réseau local du bureau est coupé", "Les postes basculent automatiquement en Wi-Fi", "Seul un poste est coupé"], a: 1, exp: "En étoile, la panne du point central coupe tout le réseau local." }
    ],
    solution: `<pre class="pseudo"># Analyse des choix de l'entreprise :
Postes -> switch central     = topologie en ETOILE (la plus courante)
  Avantage : un cable casse ne coupe qu'un poste
  Risque   : si le switch central tombe, tout le LAN est coupe
Routeurs interconnectes      = topologie MAILLEE (mesh)
  Avantage : plusieurs chemins -> tres robuste
  Cout     : plus de cables, plus cher
# Physique = cablage reel | Logique = trajet des donnees</pre>
<p>Bravo, tu as terminé ce module de fondamentaux réseau pour la CCST ! Tu sais désormais reconnaître les composants, lire les modèles OSI et TCP/IP, suivre l'encapsulation, classer les réseaux et identifier leurs topologies. Bonne préparation à ta première certification Cisco.</p>`
  }
};
