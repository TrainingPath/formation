<script>
var DAY = {
  num: 22,
  title: "Introduction à la ligne de commande Cisco (IOS)",
  subtitle: "Les modes user, privilège et configuration : lire l'invite pour savoir où l'on est.",
  theory: `
<h3>1. IOS, le système des équipements Cisco</h3>
<p>Les routeurs et commutateurs Cisco fonctionnent avec un système d'exploitation nommé <strong>IOS</strong> (« Internetwork Operating System »). On le pilote au clavier, par une <strong>ligne de commande</strong> (CLI). La toute première chose à apprendre, c'est de <strong>lire l'invite</strong> (le prompt) : sa forme t'indique dans quel <strong>mode</strong> tu te trouves, et donc ce que tu as le droit de faire.</p>
<h3>2. Le mode utilisateur : regarder sans toucher</h3>
<p>À la connexion, tu arrives dans le <strong>mode utilisateur</strong> (en anglais <em>user EXEC mode</em>). C'est un mode limité : tu peux consulter quelques informations de base, mais rien de sensible ni aucune modification. On le reconnaît au chevron <strong>&gt;</strong> à la fin de l'invite :</p>
<pre class="pseudo">Router&gt;            # mode utilisateur : consultation limitee seulement</pre>
<div class="tip">Le signe <strong>&gt;</strong> (chevron) = mode utilisateur. Peu de pouvoirs : c'est le mode « visiteur ».</div>
<h3>3. Le mode privilégié : les pleins pouvoirs de lecture</h3>
<p>Pour aller plus loin, on passe en <strong>mode privilégié</strong> (en anglais <em>privileged EXEC mode</em>) avec la commande <strong>enable</strong>. L'invite change : le chevron devient un <strong>dièse #</strong>. Dans ce mode, tu peux tout consulter (toutes les commandes <em>show</em>), sauvegarder la configuration, redémarrer l'appareil. C'est le mode de l'administrateur.</p>
<pre class="pseudo">Router&gt; enable       # on passe en mode privilegie
Router#              # le # (diese) confirme le mode privilegie
Router# disable      # pour revenir en mode utilisateur</pre>
<div class="warn">Ne confonds jamais <strong>&gt;</strong> (utilisateur) et <strong>#</strong> (privilégié). Le dièse # signale que tu as les pleins droits : sois prudent.</div>
<h3>4. Le mode configuration : modifier l'appareil</h3>
<p>Pour <strong>modifier</strong> la configuration (nommer l'appareil, configurer une interface...), on entre dans le <strong>mode de configuration globale</strong> avec la commande <strong>configure terminal</strong> (abrégée <em>conf t</em>). L'invite devient <strong>Router(config)#</strong>. On y quitte avec <strong>exit</strong> (remonte d'un niveau) ou <strong>end</strong> (retour direct au mode privilégié).</p>
<pre class="pseudo">Router# configure terminal    # on entre en mode configuration globale
Router(config)#               # le (config) indique qu'on MODIFIE l'appareil
Router(config)# hostname R1   # exemple : renommer l'equipement
R1(config)# end               # retour direct au mode privilegie
R1#</pre>
<h3>5. Résumé des invites</h3>
<pre class="pseudo"># Lire l'invite = savoir ou l'on est :
Router&gt;            -> mode UTILISATEUR   (consultation limitee)
Router#            -> mode PRIVILEGIE    (toutes les commandes show, admin)
Router(config)#    -> mode CONFIGURATION (on modifie l'appareil)
#
# Passage d'un mode a l'autre :
enable             : utilisateur -> privilegie
configure terminal : privilegie  -> configuration
exit / end         : reviennent en arriere</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># 3 modes, 3 invites :
&gt;  user  |  #  privilege  |  (config)#  configuration
# enable pour monter en privilege, conf t pour configurer.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment s'appelle le système d'exploitation des équipements Cisco ?", opts: ["Windows", "IOS", "Linux", "Android"], a: 1, exp: "IOS = Internetwork Operating System, le système des routeurs/switchs Cisco." },
    { type: "qcm", q: "Quel symbole termine l'invite du mode utilisateur ?", opts: ["#", "&gt;", "$", "%"], a: 1, exp: "Le chevron &gt; indique le mode utilisateur (user EXEC)." },
    { type: "qcm", q: "Quel symbole termine l'invite du mode privilégié ?", opts: ["&gt;", "#", "@", "!"], a: 1, exp: "Le dièse # indique le mode privilégié (privileged EXEC)." },
    { type: "qcm", q: "Quelle commande fait passer du mode utilisateur au mode privilégié ?", opts: ["configure terminal", "enable", "exit", "login"], a: 1, exp: "La commande enable passe en mode privilégié." },
    { type: "qcm", q: "Quelle commande entre en mode de configuration globale ?", opts: ["enable", "configure terminal", "show run", "disable"], a: 1, exp: "configure terminal (conf t) entre en mode configuration globale." },
    { type: "qcm", q: "À quoi ressemble l'invite du mode de configuration globale ?", opts: ["Router&gt;", "Router#", "Router(config)#", "Router(config-if)#"], a: 2, exp: "L'invite Router(config)# indique le mode configuration." },
    { type: "vf", q: "En mode utilisateur (&gt;), on peut modifier la configuration de l'appareil.", a: false, exp: "Non : le mode utilisateur ne permet que la consultation limitée. Il faut le mode configuration pour modifier." },
    { type: "vf", q: "La commande enable fait passer au mode privilégié.", a: true, exp: "Oui : enable ouvre le mode privilégié (invite #)." },
    { type: "vf", q: "L'invite Router# indique le mode privilégié.", a: true, exp: "Oui : le dièse # signale le mode privilégié." },
    { type: "vf", q: "La commande end renvoie directement au mode privilégié depuis la configuration.", a: true, exp: "Oui : end ramène directement au mode privilégié (exit ne remonte que d'un niveau)." },
    { type: "input", q: "Nom (3 lettres) du système d'exploitation des équipements Cisco ?", a: ["ios", "l'ios"], ph: "3 lettres", exp: "IOS = Internetwork Operating System." },
    { type: "input", q: "Quelle commande fait passer en mode privilégié ?", a: ["enable", "en"], ph: "une commande", exp: "enable ouvre le mode privilégié." },
    { type: "input", q: "Quelle commande (2 mots) entre en mode de configuration globale ?", a: ["configure terminal", "conf t", "conf terminal"], ph: "deux mots", exp: "configure terminal (conf t) entre en configuration globale." },
    { type: "input", q: "Quel symbole termine l'invite du mode privilégié ?", a: ["#", "diese", "le diese", "diese #"], ph: "un symbole", exp: "Le dièse # marque le mode privilégié." },
    { type: "input", q: "Quel symbole termine l'invite du mode utilisateur ?", a: ["&gt;", ">", "chevron", "le chevron"], ph: "un symbole", exp: "Le chevron &gt; marque le mode utilisateur." }
  ],
  final: {
    title: "Exercice final — Se repérer dans les modes",
    intro: `<p>Un technicien se connecte à un routeur neuf et veut le renommer « R1 ». Suivons chaque invite pour comprendre où il se trouve à chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "À la connexion, il voit « Router&gt; ». Dans quel mode est-il ?", opts: ["Privilégié", "Utilisateur", "Configuration", "Aucun"], a: 1, exp: "Le chevron &gt; = mode utilisateur (consultation limitée)." },
      { type: "qcm", q: "Il tape « enable ». Que devient l'invite ?", opts: ["Router&gt;", "Router#", "Router(config)#", "R1&gt;"], a: 1, exp: "enable passe en mode privilégié : l'invite devient Router#." },
      { type: "qcm", q: "Il tape « configure terminal ». Quelle invite obtient-il ?", opts: ["Router#", "Router(config)#", "Router&gt;", "R1#"], a: 1, exp: "configure terminal ouvre le mode configuration : Router(config)#." },
      { type: "qcm", q: "Il tape « hostname R1 ». Que se passe-t-il ?", opts: ["Rien", "L'appareil est renommé, l'invite devient R1(config)#", "Il quitte IOS", "L'appareil redémarre"], a: 1, exp: "hostname R1 renomme l'équipement : l'invite reflète le nouveau nom." },
      { type: "vf", q: "En tapant « end », il revient directement au mode privilégié (R1#).", a: true, exp: "Oui : end ramène directement au mode privilégié." }
    ],
    solution: `<pre class="pseudo"># Le parcours du technicien :
Router&gt;                       # mode utilisateur (a la connexion)
Router&gt; enable
Router#                       # mode privilegie
Router# configure terminal
Router(config)#               # mode configuration
Router(config)# hostname R1
R1(config)# end
R1#                           # retour au mode privilegie</pre>
<p>Lire l'invite, c'est toujours savoir où l'on est. Demain : les commandes de diagnostic ping et traceroute.</p>`
  }
};
