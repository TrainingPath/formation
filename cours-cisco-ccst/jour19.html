  title: "Le rôle du routeur",
  subtitle: "Couche 3, interconnexion des réseaux et passerelle : comment on sort du réseau local.",
  theory: `
<h3>1. Le routeur, aiguilleur de la couche 3</h3>
<p>Le <strong>routeur</strong> (en anglais <em>router</em>) travaille au <strong>niveau 3</strong> du modèle OSI, la <strong>couche réseau</strong>. À ce niveau, les données voyagent sous forme de <strong>paquets</strong> (en anglais <em>packets</em>) et l'adresse qui compte est l'<strong>adresse IP</strong>. Alors que le switch relie les machines <em>à l'intérieur</em> d'un réseau, le routeur fait le pont <strong>entre des réseaux différents</strong>.</p>
<p>Reprenons l'image de la ville : le switch distribue le courrier dans un même quartier ; le routeur, lui, est le centre de tri postal qui décide par quelle route envoyer une lettre vers un autre quartier ou une autre ville. Sans routeur, chaque réseau local serait une île sans pont.</p>
<h3>2. Interconnexion : relier des réseaux qui ne se parlent pas</h3>
<p>Deux machines sur des réseaux IP différents (par exemple 192.168.1.0 et 10.0.0.0) ne peuvent pas se parler directement : leurs adresses n'appartiennent pas au même réseau. Le routeur possède <strong>une interface (une patte) dans chaque réseau</strong> et transfère les paquets de l'un vers l'autre. C'est le seul équipement capable de faire dialoguer des réseaux distincts.</p>
<pre class="pseudo"># Le routeur a un pied dans chaque reseau
Reseau A : 192.168.1.0/24  --- [ Routeur ] --- 10.0.0.0/24 : Reseau B
                              192.168.1.1    10.0.0.1
# Un paquet de A vers B passe OBLIGATOIREMENT par le routeur.</pre>
<h3>3. La passerelle par défaut</h3>
<p>Quand ton ordinateur veut joindre une machine <strong>hors de son réseau local</strong>, il ne sait pas comment y aller : il confie le paquet à sa <strong>passerelle par défaut</strong> (en anglais <em>default gateway</em>). Cette passerelle, c'est tout simplement <strong>l'adresse IP du routeur</strong> sur ton réseau. Le routeur prend le relais et se charge d'acheminer le paquet vers sa destination, de proche en proche.</p>
<div class="tip">La <strong>passerelle par défaut</strong> configurée sur un PC est presque toujours l'adresse IP du routeur local. C'est la « porte de sortie » du réseau.</div>
<h3>4. Comment le routeur choisit-il la route ?</h3>
<p>Le routeur possède une <strong>table de routage</strong> : une liste qui dit « pour atteindre tel réseau, envoie par telle interface ou vers tel routeur voisin ». Il compare l'adresse IP de destination du paquet à sa table et choisit le meilleur chemin. Le routeur sépare aussi les <strong>domaines de diffusion</strong> : un broadcast ne traverse jamais un routeur, ce qui limite le bruit et découpe le réseau en zones distinctes.</p>
<div class="warn">Rappel qui tombe souvent : le <strong>switch</strong> sépare les domaines de <em>collision</em> ; le <strong>routeur</strong> sépare les domaines de <em>diffusion</em>. Ne les inverse pas.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Routeur = couche 3 (reseau), travaille avec les ADRESSES IP
# Role : interconnecter des reseaux DIFFERENTS (paquets)
# Passerelle par defaut d'un PC = adresse IP du routeur local
#   -> porte de sortie vers les autres reseaux / Internet
# Table de routage : choisit le meilleur chemin vers un reseau
# Le routeur SEPARE les domaines de diffusion (broadcast)</pre>`,

    { type: "input", q: "Quel type d'adresse (2 lettres) le routeur utilise-t-il pour décider ?", a: ["ip", "adresse ip", "l'adresse ip"], ph: "2 lettres", exp: "L'adresse IP, propre à la couche 3." },
    { type: "input", q: "Comment nomme-t-on la table qui aide le routeur à choisir le chemin ?", a: ["table de routage", "la table de routage", "routing table"], ph: "trois mots", exp: "La table de routage liste les chemins vers chaque réseau." },
    { type: "input", q: "Comment appelle-t-on l'unité de données de la couche 3 ?", a: ["paquet", "un paquet", "le paquet", "paquets", "packet"], ph: "un mot", exp: "En couche 3, l'unité de données est le paquet." },
    { type: "input", q: "Le routeur sépare les domaines de … (un mot) que le switch, lui, ne sépare pas.", a: ["diffusion", "de diffusion", "broadcast", "diffusions"], ph: "un mot", exp: "Le routeur sépare les domaines de diffusion (broadcast)." }
  ],

    intro: `<p>Le PC-A (adresse 192.168.1.10, réseau 192.168.1.0/24) veut consulter un serveur situé sur le réseau 10.0.0.0/24. Le routeur possède les interfaces 192.168.1.1 et 10.0.0.1. Suivons le trajet du paquet.</p>`,
    questions: [

      { type: "vf", q: "Sans ce routeur, PC-A ne pourrait pas joindre le réseau 10.0.0.0/24.", a: true, exp: "Oui : sans routeur, pas de pont entre les deux réseaux différents." },
      { type: "vf", q: "Un broadcast émis par PC-A serait transmis tel quel jusqu'au réseau 10.0.0.0/24 par le routeur.", a: false, exp: "Non : le routeur bloque les broadcasts, il sépare les domaines de diffusion." }
    ],
    solution: `<pre class="pseudo"># Trajet du paquet PC-A -> serveur (reseau different) :
1. PC-A voit que la destination est HORS de son reseau local
2. Il envoie le paquet a sa PASSERELLE PAR DEFAUT = 192.168.1.1 (routeur)
3. Le routeur lit l'IP de destination, consulte sa table de routage
4. Il ressort le paquet par l'interface 10.0.0.1 vers le bon reseau
# Sans routeur : aucun pont entre 192.168.1.0/24 et 10.0.0.0/24.</pre>
<p>Le routeur est la porte de sortie de tout réseau local. Demain : les protocoles qui font tourner Internet (DHCP, DNS, HTTP...).</p>`
