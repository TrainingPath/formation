var DAY = {
  num: 1,
  title: "La certification CCST Networking : présentation",
  subtitle: "Ta toute première certification Cisco, et pourquoi elle ouvre des portes.",
  theory: `
<h3>1. Qu'est-ce que la certification CCST ?</h3>
<p>La <strong>CCST</strong> signifie <em>Cisco Certified Support Technician</em>, en français « technicien de support certifié Cisco ». C'est une certification pensée pour les <strong>grands débutants</strong> : elle ne suppose aucune expérience professionnelle préalable. Cisco l'a créée comme une <strong>porte d'entrée</strong> vers son univers de certifications réseau. Il en existe deux variantes principales : la <strong>CCST Networking</strong> (réseaux) et la <strong>CCST Cybersecurity</strong> (cybersécurité). Dans ce cours, nous nous concentrons sur la <strong>CCST Networking</strong>.</p>
<p>Cisco est l'un des plus grands fabricants mondiaux d'équipements réseau : routeurs, commutateurs (switchs), points d'accès Wi-Fi. Obtenir une certification Cisco, c'est prouver à un employeur que tu maîtrises un vocabulaire et des concepts reconnus dans le monde entier.</p>
<h3>2. Un examen d'entrée, pas un examen d'expert</h3>
<p>La CCST est volontairement <strong>accessible</strong>. Elle valide les <strong>fondamentaux</strong> : savoir ce qu'est un réseau, reconnaître les équipements, comprendre les adresses IP de base, connaître les modèles de référence (OSI et TCP/IP). Elle ne te demande pas de configurer des réseaux complexes ni de connaître des centaines de commandes.</p>
<div class="tip">Pense à la CCST comme au « permis piéton » avant le « permis de conduire ». Elle te prépare naturellement à la certification suivante, la fameuse <strong>CCNA</strong> (<em>Cisco Certified Network Associate</em>), beaucoup plus complète et très recherchée sur le marché de l'emploi.</div>
<h3>3. Le déroulement de l'examen</h3>
<p>L'examen CCST Networking est un questionnaire à choix multiples et interactif. Voici les repères pratiques à connaître :</p>
<pre class="pseudo"># Repères de l'examen CCST Networking
Nom de l'examen   : Cisco Certified Support Technician (CCST) Networking
Niveau            : debutant / entree (entry-level)
Format            : questions a choix multiples + questions interactives
Duree             : environ 50 minutes
Prerequis         : aucun (recommande : bases informatiques)
Validite          : la certification reste valable plusieurs annees</pre>
<p>Tu passes l'examen en ligne ou dans un centre agréé. Le jour J, tu réponds à des questions qui ressemblent beaucoup aux exercices de ce cours : reconnaître un composant, choisir la bonne définition, associer une couche du modèle OSI à sa fonction.</p>
<h3>4. Les domaines couverts par l'examen</h3>
<p>Cisco publie un plan officiel (le « blueprint ») qui liste les grands thèmes. Ils correspondent exactement au programme de ce cours :</p>
<pre class="pseudo"># Grands domaines de la CCST Networking
1. Standards et concepts reseau    (OSI, TCP/IP, encapsulation)
2. Adressage et sous-reseaux        (IPv4, IPv6, notions de base)
3. Composants et modeles            (hotes, switchs, routeurs, cloud)
4. Diagnostic et depannage          (outils simples, ping)
5. Securite reseau                  (notions de base)</pre>
<div class="warn">Ne confonds pas CCST et CCNA. La CCST est le tout premier niveau (débutant). La CCNA vient après et exige beaucoup plus de pratique. Commencer par la CCST est le chemin logique et rassurant.</div>
<h3>5. Débouchés et intérêt pour ta carrière</h3>
<p>Avec une CCST Networking, tu vises des postes d'entrée comme <strong>technicien support (help desk)</strong>, <strong>technicien réseau junior</strong> ou <strong>opérateur de centre d'assistance</strong>. Surtout, tu prouves ta motivation et tu poses une base solide. Beaucoup d'employeurs valorisent une certification Cisco même débutante, car elle atteste d'un socle commun de connaissances.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># CCST = Cisco Certified Support Technician
# Niveau     : debutant (aucun prerequis professionnel)
# Variante   : CCST Networking (reseaux) etudiee ici
# Role        : porte d'entree vers la certification CCNA
# Debouches  : technicien support / reseau junior</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme CCST ?", opts: ["Cisco Certified System Technician", "Cisco Certified Support Technician", "Cisco Central Support Test", "Certified Cisco Security Training"], a: 1, exp: "CCST = Cisco Certified Support Technician (technicien de support certifié Cisco)." },
    { type: "qcm", q: "À quel public s'adresse en priorité la CCST ?", opts: ["Aux experts réseau confirmés", "Aux débutants sans expérience préalable", "Uniquement aux ingénieurs diplômés", "Aux développeurs de logiciels"], a: 1, exp: "La CCST est une certification d'entrée, pensée pour les grands débutants." },
    { type: "input", q: "Quelle certification Cisco, plus complète, vient logiquement APRÈS la CCST ? (donne l'acronyme)", a: ["ccna", "la ccna"], ph: "4 lettres", exp: "La CCNA (Cisco Certified Network Associate) est l'étape suivante, plus poussée." },
    { type: "qcm", q: "Quelles sont les deux grandes variantes de la CCST ?", opts: ["Networking et Cybersecurity", "Hardware et Software", "Débutant et Expert", "Windows et Linux"], a: 0, exp: "Il existe la CCST Networking (réseaux) et la CCST Cybersecurity (cybersécurité)." },
    { type: "vf", q: "La CCST exige plusieurs années d'expérience professionnelle avant de pouvoir la passer.", a: false, exp: "Faux : la CCST n'a aucun prérequis professionnel, c'est une certification d'entrée." },
    { type: "vf", q: "Cisco est un fabricant reconnu d'équipements réseau comme les routeurs et les commutateurs.", a: true, exp: "Vrai : Cisco est l'un des plus grands fabricants mondiaux d'équipements réseau." },
    { type: "input", q: "Quelle variante de la CCST porte sur les réseaux et est étudiée dans ce cours ? (un mot en anglais)", a: ["networking", "ccst networking"], ph: "un mot anglais", exp: "La CCST Networking traite des fondamentaux des réseaux." },
    { type: "qcm", q: "Quel format ont les questions de l'examen CCST ?", opts: ["Uniquement des dissertations écrites", "Choix multiples et questions interactives", "Un entretien oral d'une heure", "Un projet à rendre en un mois"], a: 1, exp: "L'examen combine questions à choix multiples et questions interactives." },
    { type: "qcm", q: "Comment décrire la CCST par rapport à la CCNA ?", opts: ["Elle est plus difficile que la CCNA", "Elle est une porte d'entrée avant la CCNA", "Elle remplace complètement la CCNA", "Elle n'a aucun lien avec Cisco"], a: 1, exp: "La CCST est le niveau débutant qui prépare à la CCNA." },
    { type: "vf", q: "La CCST Networking couvre notamment les modèles OSI et TCP/IP.", a: true, exp: "Vrai : les standards et concepts réseau (OSI, TCP/IP) font partie du programme." },
    { type: "input", q: "Quel poste d'entrée typique peut viser un titulaire de la CCST ? (par ex. technicien ...)", a: ["support", "technicien support", "help desk", "helpdesk", "technicien reseau", "technicien réseau"], ph: "un métier", exp: "Technicien support (help desk) ou technicien réseau junior sont des débouchés classiques." },
    { type: "qcm", q: "Quelle affirmation sur les prérequis de la CCST est correcte ?", opts: ["Il faut déjà avoir la CCNA", "Aucun prérequis obligatoire", "Il faut un diplôme d'ingénieur", "Il faut 5 ans d'expérience"], a: 1, exp: "Aucun prérequis obligatoire ; des bases informatiques sont simplement recommandées." },
    { type: "vf", q: "Une certification Cisco, même débutante, peut être valorisée par un employeur.", a: true, exp: "Vrai : elle atteste d'un socle de connaissances reconnu internationalement." },
    { type: "qcm", q: "Environ combien de temps dure l'examen CCST Networking ?", opts: ["5 minutes", "environ 50 minutes", "4 heures", "2 jours"], a: 1, exp: "L'examen dure environ 50 minutes." },
    { type: "input", q: "Quel mot anglais désigne le plan officiel des thèmes d'un examen Cisco (le « plan de l'examen ») ?", a: ["blueprint", "le blueprint"], ph: "un mot anglais", exp: "Le blueprint est le document officiel listant les domaines de l'examen." }
  ],
  final: {
    title: "Exercice final — Conseiller un futur candidat",
    intro: `<p>Karim veut débuter dans les réseaux mais n'a aucune expérience. Il hésite entre plusieurs certifications Cisco et te demande conseil. Aide-le à choisir un point de départ cohérent.</p>`,
    questions: [
      { type: "qcm", q: "Quelle certification Cisco Karim devrait-il viser EN PREMIER ?", opts: ["La CCNA directement", "La CCST Networking", "Une certification d'expert", "Aucune, ce n'est pas la peine"], a: 1, exp: "La CCST Networking est le niveau débutant, idéal pour commencer." },
      { type: "vf", q: "Karim a besoin de years d'expérience avant de passer la CCST.", a: false, exp: "Faux : la CCST n'a aucun prérequis professionnel." },
      { type: "input", q: "Une fois la CCST obtenue, quelle certification plus avancée pourra-t-il préparer ? (acronyme)", a: ["ccna", "la ccna"], ph: "4 lettres", exp: "La CCNA est l'étape suivante, plus complète." },
      { type: "qcm", q: "Quel type de poste la CCST peut-elle aider Karim à décrocher ?", opts: ["Directeur informatique", "Technicien support ou réseau junior", "Architecte réseau senior", "Chercheur en physique"], a: 1, exp: "La CCST vise des postes d'entrée : technicien support / réseau junior." },
      { type: "qcm", q: "Que valide principalement la CCST Networking ?", opts: ["Des compétences expertes en programmation", "Les fondamentaux des réseaux", "La gestion d'une entreprise", "La maintenance de serveurs Windows uniquement"], a: 1, exp: "Elle valide les fondamentaux des réseaux (concepts, composants, modèles)." }
    ],
    solution: `<pre class="pseudo"># Parcours conseille pour Karim (debutant total) :
1. Commencer par la CCST Networking (aucun prerequis)
2. Elle valide les fondamentaux : reseaux, OSI, TCP/IP, composants
3. Debouche : technicien support / reseau junior
4. Etape suivante : la CCNA, plus avancee et tres recherchee</pre>
<p>La CCST est le bon point de départ : elle rassure, structure les bases et ouvre la voie vers la CCNA. Demain, nous répondrons à la question centrale : qu'est-ce qu'un réseau ?</p>`
  }
};
