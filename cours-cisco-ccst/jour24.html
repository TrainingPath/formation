<script>
var DAY = {
  num: 24,
  title: "Lire une configuration",
  subtitle: "ipconfig et show ip interface brief : savoir déchiffrer l'état d'une machine et d'un routeur.",
  theory: `
<h3>1. Lire avant d'agir</h3>
<p>Avant de modifier quoi que ce soit, un bon technicien <strong>lit</strong> la configuration existante. Deux commandes reviennent tout le temps : <strong>ipconfig</strong> côté ordinateur (Windows), et <strong>show ip interface brief</strong> côté équipement Cisco. Elles répondent à la même question : « quelles sont les adresses et l'état des interfaces ? ».</p>
<h3>2. ipconfig : l'identité réseau d'un PC Windows</h3>
<p>Sur Windows, <strong>ipconfig</strong> affiche la configuration réseau de la machine : son <strong>adresse IP</strong>, son <strong>masque de sous-réseau</strong> et sa <strong>passerelle par défaut</strong>. Pour tout voir (y compris le DNS et l'adresse MAC), on ajoute l'option <strong>/all</strong> : <strong>ipconfig /all</strong>. Sur Linux et macOS, l'équivalent moderne est <strong>ip address</strong> (ou l'ancien <em>ifconfig</em>).</p>
<pre class="pseudo">C:\\&gt; ipconfig
Carte Ethernet :
   Adresse IPv4. . . . . . . . : 192.168.1.20     # l'adresse de ce PC
   Masque de sous-reseau . . . : 255.255.255.0    # taille du reseau local
   Passerelle par defaut . . . : 192.168.1.1      # l'adresse du routeur (sortie)</pre>
<div class="tip">Les trois informations vitales d'ipconfig : <strong>adresse IP</strong> (qui suis-je), <strong>masque</strong> (quel est mon réseau), <strong>passerelle par défaut</strong> (par où je sors). Une passerelle absente = pas d'accès à l'extérieur.</div>
<h3>3. Repérer une machine mal configurée</h3>
<p>ipconfig permet de détecter des pannes en un coup d'oeil. Une adresse qui commence par <strong>169.254.x.x</strong> (adresse dite <em>APIPA</em>) signifie que le PC n'a <strong>pas reçu d'adresse du serveur DHCP</strong> : il s'en est attribué une tout seul, faute de mieux. C'est un signal classique de problème DHCP ou de câble débranché.</p>
<div class="warn">Une adresse en <strong>169.254.x.x</strong> n'est presque jamais bon signe : elle indique que le DHCP n'a pas répondu. Vérifie le câble, le Wi-Fi, puis le serveur DHCP.</div>
<h3>4. show ip interface brief : l'état des interfaces Cisco</h3>
<p>Sur un routeur ou un switch Cisco, la commande <strong>show ip interface brief</strong> (souvent abrégée <strong>show ip int brief</strong>) donne un tableau résumé de toutes les interfaces : leur nom, leur adresse IP, et surtout deux colonnes d'état, <strong>Status</strong> et <strong>Protocol</strong>. Elle se lance depuis le mode privilégié (invite #).</p>
<pre class="pseudo">Router# show ip interface brief
Interface              IP-Address      Status                Protocol
GigabitEthernet0/0     192.168.1.1     up                    up
GigabitEthernet0/1     10.0.0.1        up                    up
GigabitEthernet0/2     unassigned      administratively down down
# up/up      -> interface operationnelle
# admin down -> desactivee manuellement (commande shutdown)</pre>
<h3>5. Lire les colonnes Status et Protocol</h3>
<p>La règle d'or : une interface fonctionne quand elle est <strong>up / up</strong> (Status up ET Protocol up). Si tu lis <strong>administratively down</strong>, c'est qu'un administrateur l'a désactivée (commande <em>shutdown</em>) : il faut la réactiver avec <em>no shutdown</em>. Si Status est <em>up</em> mais Protocol <em>down</em>, le câble ou la couche 2 posent problème.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ipconfig (Windows) -> IP + masque + passerelle par defaut du PC
#   ipconfig /all pour tout voir (DNS, MAC...)
#   169.254.x.x -> pas d'adresse recue du DHCP (probleme !)
#
# show ip interface brief (Cisco, mode #) -> tableau des interfaces
#   up / up               -> interface operationnelle
#   administratively down -> desactivee (relancer avec no shutdown)</pre>`,

    { type: "qcm", q: "Quelles trois informations clés donne ipconfig (sans /all) ?", opts: ["Nom, mot de passe, port", "Adresse IP, masque, passerelle par défaut", "DNS, MAC, TTL", "CPU, RAM, disque"], a: 1, exp: "ipconfig affiche l'adresse IP, le masque et la passerelle par défaut." },

    { type: "qcm", q: "Quelle option d'ipconfig affiche tous les détails (DNS, MAC...) ?", opts: ["/help", "/all", "/full", "/detail"], a: 1, exp: "ipconfig /all affiche l'ensemble des détails réseau." },

    { type: "vf", q: "Une interface Cisco « administratively down » se réactive avec la commande no shutdown.", a: true, exp: "Oui : no shutdown réactive une interface volontairement désactivée." },
    { type: "vf", q: "show ip interface brief se lance depuis le mode privilégié (#).", a: true, exp: "Oui : les commandes show s'exécutent en mode privilégié." },
    { type: "vf", q: "Une adresse en 169.254.x.x est le signe d'une configuration réseau parfaite.", a: false, exp: "Non : c'est le signe que le DHCP n'a pas répondu (problème à corriger)." },
    { type: "input", q: "Quelle commande (un mot) affiche l'IP, le masque et la passerelle sous Windows ?", a: ["ipconfig", "la commande ipconfig"], ph: "un mot", exp: "ipconfig affiche la configuration réseau du PC." },
    { type: "input", q: "Quelle commande Cisco (abrégée aussi) montre l'état de toutes les interfaces ?", a: ["show ip interface brief", "show ip int brief", "sh ip int brief"], ph: "plusieurs mots", exp: "show ip interface brief (ou show ip int brief)." },
    { type: "input", q: "Quel double état indique une interface Cisco opérationnelle ?", a: ["up up", "up/up", "up / up", "up up up", "up et up"], ph: "deux mots", exp: "up / up : Status up et Protocol up." },
    { type: "input", q: "Une adresse commençant par 169.254 signale un problème avec quel service (sigle) ?", a: ["dhcp", "le dhcp"], ph: "un sigle", exp: "169.254.x.x = pas d'adresse reçue du DHCP." }
  ],
  final: {
    title: "Exercice final — Déchiffrer deux sorties",
    intro: `<p>Un technicien récupère deux affichages : l'ipconfig d'un PC qui « n'a pas Internet », et un show ip interface brief sur le routeur. Aidons-le à lire ces informations.</p>`,
    questions: [
      { type: "qcm", q: "L'ipconfig du PC montre l'adresse 169.254.10.5. Que conclut-il ?", opts: ["Tout va bien", "Le PC n'a pas reçu d'adresse du DHCP", "Le PC a deux adresses", "Le DNS est parfait"], a: 1, exp: "169.254.x.x = adresse APIPA, le DHCP n'a pas répondu." },
      { type: "qcm", q: "Sur le PC, la ligne « Passerelle par défaut » est vide. Conséquence ?", opts: ["Aucune", "Le PC ne peut pas sortir vers d'autres réseaux", "Le PC est plus rapide", "Le DNS est désactivé"], a: 1, exp: "Sans passerelle, aucune sortie possible vers l'extérieur." },
      { type: "qcm", q: "Le show ip interface brief indique GigabitEthernet0/0 en « administratively down ». Que faire ?", opts: ["Rien", "La réactiver avec no shutdown", "Débrancher le routeur", "Changer le DNS"], a: 1, exp: "administratively down = désactivée manuellement ; no shutdown la réactive." },
      { type: "vf", q: "Une interface affichée « up / up » sur le routeur est opérationnelle.", a: true, exp: "Oui : up / up signifie que l'interface fonctionne." },
      { type: "vf", q: "Réparer le DHCP pourrait redonner au PC une adresse correcte et un accès réseau.", a: true, exp: "Oui : si le DHCP répond, le PC recevra une vraie adresse au lieu de 169.254.x.x." }
    ],
    solution: `<pre class="pseudo"># Lecture des deux sorties :
# --- Cote PC (ipconfig) ---
Adresse IPv4 : 169.254.10.5   -> APIPA : PAS d'adresse du DHCP (probleme)
Passerelle   : (vide)         -> aucune sortie possible vers l'exterieur
# Piste : verifier cable/Wi-Fi puis le serveur DHCP
#
# --- Cote routeur (show ip interface brief) ---
GigabitEthernet0/0  administratively down -> desactivee : faire "no shutdown"
Une interface saine s'affiche "up / up".</pre>
<p>Savoir lire une configuration, c'est diagnostiquer sans rien casser. C'est la conclusion de ce parcours CCST débutant : bravo !</p>`
  }
};
