  title: "Qu'est-ce qu'un réseau ?",
  subtitle: "Relier des machines pour qu'elles se parlent et partagent.",
  theory: `
<h3>1. La définition d'un réseau</h3>
<p>Un <strong>réseau informatique</strong> (en anglais <em>network</em>) est un ensemble d'appareils <strong>reliés entre eux</strong> afin de <strong>communiquer</strong> et de <strong>partager des ressources</strong>. Ces appareils peuvent être des ordinateurs, des téléphones, des imprimantes, des serveurs, des caméras… Dès que deux appareils échangent des données par un câble ou par les ondes, tu as un réseau.</p>
<p>L'exemple le plus simple : deux ordinateurs reliés par un câble qui s'envoient un fichier. L'exemple le plus grand : <strong>Internet</strong>, un réseau mondial qui relie des milliards d'appareils.</p>
<div class="tip">Retiens l'idée clé : un réseau existe pour <strong>partager</strong>. On partage des données (fichiers, messages), du matériel (une imprimante commune) et des services (un accès à Internet, une application).</div>
<h3>2. Pourquoi construire un réseau ?</h3>
<p>Avant les réseaux, pour donner un fichier à un collègue, il fallait le copier sur une disquette et la lui apporter. Le réseau supprime cette contrainte. Voici les grands bénéfices :</p>
<pre class="pseudo"># A quoi sert un reseau ?
Partage de fichiers      : envoyer/recevoir des documents instantanement
Partage de materiel      : une seule imprimante pour tout le bureau
Communication            : messagerie, appels, visio
Acces a des services     : Internet, applications, bases de donnees
Centralisation           : sauvegardes et donnees au meme endroit</pre>
<h3>3. Client et serveur : les deux rôles de base</h3>
<p>Dans un réseau, une machine joue souvent l'un de deux rôles. Le <strong>client</strong> est celui qui <strong>demande</strong> un service (ton navigateur qui réclame une page web). Le <strong>serveur</strong> est celui qui <strong>fournit</strong> le service (l'ordinateur qui héberge le site et renvoie la page). C'est le modèle <strong>client-serveur</strong>, au cœur du fonctionnement d'Internet.</p>
<p>Il existe aussi le modèle <strong>pair-à-pair</strong> (en anglais <em>peer-to-peer</em>, P2P), où chaque machine peut être à la fois cliente et serveuse, sans hiérarchie centrale.</p>
<h3>4. Comment les appareils se reconnaissent : l'adresse</h3>
<p>Pour communiquer, chaque appareil du réseau a besoin d'une <strong>adresse</strong>, comme une maison a besoin d'une adresse postale. La plus connue est l'<strong>adresse IP</strong> (<em>Internet Protocol</em>). Elle identifie un appareil sur le réseau. Sans adresse, impossible de savoir à qui envoyer les données.</p>
<pre class="pseudo"># Exemple d'adresse IP (version 4)
192.168.1.10     # adresse d'un ordinateur dans un reseau local
# Chaque appareil du reseau possede une adresse unique dans ce reseau</pre>
<div class="warn">Un réseau n'est pas magique : si deux appareils ne partagent pas de <strong>chemin</strong> (câble, Wi-Fi) ni de <strong>règles communes</strong> (protocoles) ni d'<strong>adresses</strong> valides, ils ne peuvent pas communiquer. Ces trois ingrédients reviendront tout au long de la certification CCST.</div>
<h3>5. Des règles communes : les protocoles</h3>
<p>Pour se comprendre, les appareils suivent des <strong>protocoles</strong> : des ensembles de règles précises qui définissent comment formuler et envoyer un message. C'est comme une langue commune. Par exemple, le protocole <strong>HTTP</strong> sert à échanger des pages web. Nous étudierons ces règles en détail avec les modèles OSI et TCP/IP.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Reseau = appareils relies pour communiquer et partager
# Ingredients : un chemin (cable/Wi-Fi) + des adresses + des protocoles
# Roles : client (demande) et serveur (fournit)
# Adresse IP = identifiant d'un appareil sur le reseau
# Internet = le plus grand reseau du monde</pre>`,

    { type: "qcm", q: "Qu'est-ce qu'un protocole réseau ?", opts: ["Un câble spécial", "Un ensemble de règles communes pour communiquer", "Une marque d'ordinateur", "Un type d'écran"], a: 1, exp: "Un protocole est un ensemble de règles qui permettent aux appareils de se comprendre." },
    { type: "vf", q: "Dans le modèle pair-à-pair (peer-to-peer), il y a toujours un serveur central unique.", a: false, exp: "Faux : en pair-à-pair, chaque machine peut être à la fois cliente et serveuse, sans centre." },
    { type: "qcm", q: "Quel protocole sert principalement à échanger des pages web ?", opts: ["HTTP", "IP seul", "USB", "HDMI"], a: 0, exp: "HTTP (HyperText Transfer Protocol) sert à échanger des pages web." },
    { type: "input", q: "Comment nomme-t-on le modèle où une machine demande et une autre fournit le service ? (deux mots reliés)", a: ["client-serveur", "client serveur", "clientserveur"], ph: "deux mots", exp: "C'est le modèle client-serveur, au cœur d'Internet." },
    { type: "vf", q: "Deux appareils peuvent communiquer même sans aucun chemin (ni câble ni Wi-Fi) entre eux.", a: false, exp: "Faux : il faut un chemin (câble ou ondes), des adresses et des protocoles communs." },
    { type: "qcm", q: "Parmi ces trois ingrédients, lequel est nécessaire à toute communication réseau ?", opts: ["Une adresse valide", "Un écran couleur", "Une souris", "Un haut-parleur"], a: 0, exp: "Il faut une adresse, un chemin et des protocoles communs. L'écran n'est pas requis." },
    { type: "qcm", q: "Quel est un exemple de partage de matériel sur un réseau ?", opts: ["Chaque poste a sa propre imprimante isolée", "Une imprimante unique utilisée par tout le bureau", "Débrancher tous les câbles", "Éteindre le serveur"], a: 1, exp: "Partager une imprimante commune est un exemple classique de partage de matériel." },
    { type: "input", q: "Quel réseau mondial permet d'accéder à des sites web depuis presque partout ? (un mot)", a: ["internet", "l'internet"], ph: "un mot", exp: "Internet est le réseau mondial qui relie des milliards d'appareils." }
  ],
  final: {
    title: "Exercice final — Analyser un petit réseau de bureau",
    intro: `<p>Dans un bureau, trois ordinateurs, une imprimante et une box Internet sont reliés. Sur l'un des ordinateurs tourne un site interne consulté par les autres. Analysons ce petit réseau.</p>`,
    questions: [
      { type: "qcm", q: "L'ordinateur qui héberge le site interne joue le rôle de…", opts: ["Client", "Serveur", "Imprimante", "Câble"], a: 1, exp: "Il fournit un service (le site) : c'est un serveur." },
      { type: "qcm", q: "Un ordinateur qui consulte ce site interne joue le rôle de…", opts: ["Serveur", "Client", "Routeur", "Adresse IP"], a: 1, exp: "Il demande le service : c'est un client." },
      { type: "vf", q: "L'imprimante partagée par tout le bureau est un exemple de partage de matériel.", a: true, exp: "Vrai : une imprimante commune illustre le partage de matériel." },
      { type: "input", q: "Pour que ces appareils se repèrent entre eux, chacun a besoin d'une… (deux lettres)", a: ["ip", "adresse ip", "l'adresse ip", "adresse"], ph: "adresse ...", exp: "Chaque appareil a besoin d'une adresse IP pour être identifié." },
      { type: "qcm", q: "Pour se comprendre, tous ces appareils doivent respecter…", opts: ["Le même système d'exploitation", "Des protocoles communs", "La même vitesse de connexion", "Le même fabricant de matériel"], a: 1, exp: "Des protocoles communs (règles) sont indispensables à la communication." }
    ],
    solution: `<pre class="pseudo"># Lecture du petit reseau de bureau :
Serveur   : l'ordinateur qui heberge le site interne (il fournit)
Clients   : les ordinateurs qui consultent le site (ils demandent)
Materiel partage : l'imprimante commune
Chemin    : cables et/ou Wi-Fi via la box
Adresses  : chaque appareil a une adresse IP unique
Regles    : des protocoles communs (ex : HTTP pour le site)</pre>
<p>Un réseau, même petit, combine toujours un chemin, des adresses et des protocoles. Demain, nous détaillerons les composants matériels qui rendent tout cela possible.</p>`
  }
