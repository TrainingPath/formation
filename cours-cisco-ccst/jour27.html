var DAY = {
  num: 27,
  title: "Les bases de la sécurité réseau",
  subtitle: "Connaître les menaces courantes et appliquer le principe de moindre privilège.",
  theory: `
<h3>1. Sécuriser, c'est protéger trois choses</h3>
<p>La <strong>sécurité réseau</strong> ne consiste pas à empiler des outils : elle vise trois objectifs, souvent résumés par le sigle <strong>CIA</strong> (en anglais). La <strong>Confidentialité</strong> (seules les personnes autorisées voient les données), l'<strong>Intégrité</strong> (les données ne sont pas altérées à l'insu de tous), et la <strong>Disponibilité</strong> (le service reste accessible quand on en a besoin). En français, on parle parfois de <strong>DIC</strong>. Chaque menace attaque au moins un de ces trois piliers : les garder en tête aide à classer les risques.</p>
<pre class="pseudo"># La triade de securite (CIA / DIC)
Confidentiality  -&gt; Confidentialite : qui a le droit de voir ?
Integrity        -&gt; Integrite : la donnee est-elle intacte ?
Availability      -&gt; Disponibilite : le service repond-il ?</pre>
<h3>2. Les menaces courantes</h3>
<p>Il faut nommer l'ennemi pour s'en défendre. Les principales menaces d'un débutant à connaître : le <strong>malware</strong> (logiciel malveillant : virus, ver, cheval de Troie), le <strong>rançongiciel</strong> (en anglais <em>ransomware</em>, qui chiffre tes fichiers et réclame une rançon), le <strong>phishing</strong> (hameçonnage : un faux mail qui pousse à donner ses identifiants), l'<strong>ingénierie sociale</strong> (manipuler une personne plutôt qu'une machine), et le <strong>déni de service</strong> (en anglais <em>DoS/DDoS</em>, qui sature un service pour le rendre indisponible).</p>
<pre class="pseudo"># Menaces frequentes et pilier vise
Malware / virus     -&gt; integrite, confidentialite
Ransomware          -&gt; disponibilite (fichiers chiffres) + rancon
Phishing            -&gt; confidentialite (vol d'identifiants)
Ingenierie sociale  -&gt; contourne l'humain, pas la machine
DoS / DDoS          -&gt; disponibilite (saturation du service)</pre>
<div class="warn">La menace la plus efficace n'est souvent pas technique : le <strong>phishing</strong> et l'<strong>ingénierie sociale</strong> visent l'humain. Aucun pare-feu n'arrête un employé qui donne volontairement son mot de passe à un « faux service informatique ». La vigilance des utilisateurs fait partie de la sécurité.</div>
<h3>3. Le principe de moindre privilège</h3>
<p>Voici la règle d'or de la sécurité des accès : le <strong>principe de moindre privilège</strong> (en anglais <em>least privilege</em>). Chaque utilisateur, chaque programme, chaque compte ne reçoit que les <strong>droits strictement nécessaires</strong> à sa tâche — ni plus. Un comptable n'a pas besoin d'être administrateur du serveur ; un site web n'a pas besoin d'accéder à toute la base. Pourquoi ? Parce que si ce compte est piraté, les dégâts sont <strong>limités à ce qu'il pouvait faire</strong>. Donner les droits d'administrateur à tout le monde « pour simplifier » revient à laisser toutes les portes ouvertes.</p>
<div class="tip">Idée voisine : ne pas travailler tous les jours avec un compte administrateur. On utilise un compte normal, et on n'élève ses droits (par exemple avec <code>sudo</code> sous Linux) que ponctuellement, quand une tâche l'exige vraiment.</div>
<h3>4. La défense en profondeur</h3>
<p>Aucune protection n'est parfaite. La bonne stratégie empile plusieurs barrières indépendantes : c'est la <strong>défense en profondeur</strong> (en anglais <em>defense in depth</em>). Un pare-feu, plus des mots de passe forts, plus des mises à jour, plus des sauvegardes, plus des utilisateurs formés. Si une couche cède, les autres tiennent encore. On ne mise jamais tout sur un seul rempart.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Triade : Confidentialite, Integrite, Disponibilite (CIA / DIC)
# Menaces : malware, ransomware, phishing, ingenierie sociale, DoS/DDoS
# Moindre privilege : chaque compte n'a QUE les droits necessaires
# Defense en profondeur : plusieurs barrieres independantes empilees
# Le maillon humain (phishing) compte autant que la technique</pre>`,
  exercises: [
    { type: "qcm", q: "Que représentent les trois lettres de la triade CIA (DIC en français) ?", opts: ["Câble, Internet, Adresse", "Confidentialité, Intégrité, Disponibilité", "Contrôle, Information, Accès", "Client, IP, Connexion"], a: 1, exp: "CIA/DIC = Confidentialité, Intégrité, Disponibilité : les 3 piliers." },
    { type: "input", q: "Comment appelle-t-on un faux courriel qui pousse la victime à livrer ses identifiants ? (terme anglais)", a: ["phishing", "hameconnage", "le phishing"], ph: "un mot", exp: "Le phishing (hameçonnage) imite un expéditeur de confiance pour voler des identifiants." },

    { type: "qcm", q: "Une attaque DoS/DDoS cherche avant tout à…", opts: ["Voler des mots de passe", "Rendre un service indisponible en le saturant", "Chiffrer les fichiers", "Altérer discrètement les données"], a: 1, exp: "Le déni de service sature la cible pour la rendre injoignable (disponibilité)." },
    { type: "vf", q: "L'ingénierie sociale manipule une personne plutôt qu'une machine.", a: true, exp: "Oui : elle exploite la confiance humaine (faux support, urgence, autorité)." },
    { type: "qcm", q: "Pourquoi limiter les droits d'un compte réduit-il le risque ?", opts: ["Ça empêche totalement tout piratage", "Si le compte est piraté, les dégâts sont limités à ses droits", "Ça chiffre les données du compte", "Ça rend le compte invisible aux attaquants"], a: 1, exp: "Moins de droits = moins de portée pour un attaquant qui prend ce compte." },
    { type: "input", q: "Comment appelle-t-on la stratégie qui empile plusieurs barrières indépendantes ? (expression française en trois mots)", a: ["defense en profondeur", "la defense en profondeur", "defense in depth"], ph: "défense en …", exp: "La défense en profondeur : si une couche cède, les autres protègent encore." },
    { type: "vf", q: "Il est recommandé d'utiliser un compte administrateur pour toutes ses tâches quotidiennes.", a: false, exp: "Non : on travaille avec un compte normal et on n'élève ses droits que ponctuellement." },
    { type: "qcm", q: "Quel pilier est visé quand des données sont modifiées à l'insu de tous ?", opts: ["La confidentialité", "L'intégrité", "La disponibilité", "L'authentification"], a: 1, exp: "L'intégrité garantit que la donnée n'est pas altérée sans autorisation." },
    { type: "qcm", q: "Un comptable a besoin d'être administrateur du serveur de fichiers. Vrai selon le moindre privilège ?", opts: ["Oui, plus de droits c'est mieux", "Non : il ne reçoit que les droits liés à sa tâche", "Oui, pour aller plus vite", "Oui, car c'est un employé de confiance"], a: 1, exp: "Le moindre privilège lui donne seulement l'accès nécessaire à son travail." },
    { type: "qcm", q: "Sous Linux, quelle commande permet d'élever ses droits ponctuellement pour une tâche ?", opts: ["ping", "sudo", "ls", "cd"], a: 1, exp: "sudo exécute une commande avec des droits élevés, de façon ponctuelle." },
    { type: "input", q: "Quel type de malware chiffre les fichiers puis réclame une rançon ? (terme anglais)", a: ["ransomware", "rancongiciel", "un ransomware"], ph: "un mot", exp: "Le ransomware (rançongiciel) chiffre les données pour extorquer un paiement." }
  ],
  final: {
    title: "Exercice final — Classer les risques d'une petite entreprise",
    intro: `<p>Dans une PME, tu repères plusieurs situations. Pour chacune, identifie la menace ou le principe en jeu.</p>`,
    questions: [

      { type: "qcm", q: "Tous les employés sont administrateurs « pour aller plus vite ». Quel principe est violé ?", opts: ["La disponibilité", "Le principe de moindre privilège", "Le chiffrement", "La sauvegarde"], a: 1, exp: "Donner trop de droits viole le moindre privilège." },
      { type: "vf", q: "Un site web soudain injoignable car noyé sous des millions de requêtes subit probablement un DoS/DDoS.", a: true, exp: "La saturation volontaire du service est un déni de service." },
      { type: "input", q: "Quelle stratégie recommandes-tu : empiler pare-feu, mots de passe forts, mises à jour et sauvegardes ? (trois mots)", a: ["defense en profondeur", "la defense en profondeur", "defense in depth"], ph: "défense en …", exp: "Plusieurs barrières indépendantes = défense en profondeur." },
      { type: "qcm", q: "Des fichiers deviennent illisibles et un message réclame un paiement en cryptomonnaie. C'est…", opts: ["Du phishing", "Un ransomware", "De l'intégrité", "Une mise à jour"], a: 1, exp: "Chiffrement des fichiers + demande de rançon = ransomware." }
    ],
    solution: `<pre class="pseudo"># Diagnostic securite de la PME :
Mail piege demandant les identifiants   -&gt; PHISHING (vise la confidentialite)
Tous administrateurs "pour aller vite"  -&gt; viole le MOINDRE PRIVILEGE
Site noye sous les requetes             -&gt; DoS/DDoS (vise la disponibilite)
Fichiers chiffres + rancon              -&gt; RANSOMWARE
Solution globale : DEFENSE EN PROFONDEUR (plusieurs barrieres empilees).</pre>
<p>Nommer chaque menace et appliquer le moindre privilège transforme une PME vulnérable en cible bien plus difficile.</p>`
  }
