  theory: `
<h3>1. TCP/IP : le modèle du monde réel</h3>
<p>Le modèle OSI est une belle théorie, mais Internet fonctionne concrètement avec le <strong>modèle TCP/IP</strong>. Son nom vient de ses deux protocoles vedettes : <strong>TCP</strong> (<em>Transmission Control Protocol</em>) et <strong>IP</strong> (<em>Internet Protocol</em>). Contrairement à OSI et ses 7 couches, TCP/IP en compte seulement <strong>4</strong>. C'est le modèle réellement implémenté dans tes appareils.</p>
<div class="tip">Retiens la comparaison chiffrée : <strong>OSI = 7 couches</strong> (modèle théorique de référence), <strong>TCP/IP = 4 couches</strong> (modèle pratique d'Internet). Les deux décrivent la même communication, mais avec un découpage différent.</div>
<h3>2. Les 4 couches du modèle TCP/IP</h3>
<pre class="pseudo"># Modele TCP/IP (de haut en bas)
4  Application       : les services pour l'utilisateur (HTTP, DNS, mail)
3  Transport         : TCP et UDP (segments, fiabilite)
2  Internet          : IP (adressage logique et routage)
1  Acces reseau      : cartes, cables, adresses MAC, signaux</pre>
<p>La couche <strong>Application</strong> regroupe les services haut niveau. La couche <strong>Transport</strong> gère TCP (fiable) et UDP (rapide). La couche <strong>Internet</strong> s'occupe de l'adressage IP et du routage. La couche <strong>Accès réseau</strong> (parfois appelée « liaison » ou « réseau-liaison ») gère tout ce qui touche au matériel local et aux signaux.</p>
<h3>3. Correspondance OSI ↔ TCP/IP</h3>
<p>Voici comment les 4 couches TCP/IP recouvrent les 7 couches OSI. C'est une question fréquente à l'examen CCST :</p>
<pre class="pseudo"># Correspondance OSI (7)          &lt;-&gt;  TCP/IP (4)
7 Application   \\
6 Presentation   >  ==========>   Application
5 Session       /
4 Transport         ==========>   Transport
3 Reseau            ==========>   Internet
2 Liaison       \\
                 >  ==========>   Acces reseau
1 Physique      /</pre>
<p>Trois couches OSI (Application, Présentation, Session) sont <strong>fusionnées</strong> dans la seule couche <strong>Application</strong> de TCP/IP. De même, les couches OSI Liaison et Physique sont regroupées dans la couche <strong>Accès réseau</strong>. Les couches Transport et Réseau/Internet, elles, se correspondent presque directement.</p>
<h3>4. TCP contre UDP à la couche Transport</h3>
<p>À la couche Transport, deux protocoles cohabitent. <strong>TCP</strong> est <strong>fiable</strong> : il vérifie que tout arrive, dans l'ordre, et renvoie ce qui manque (idéal pour un fichier ou une page web). <strong>UDP</strong> (<em>User Datagram Protocol</em>) est <strong>rapide</strong> mais sans garantie (idéal pour la vidéo en direct ou les jeux, où la vitesse prime).</p>
<pre class="pseudo"># TCP vs UDP
TCP : fiable, ordonne, verifie -> web, mail, transfert de fichiers
UDP : rapide, sans garantie     -> streaming video, voix, jeux en ligne</pre>
<div class="warn">Ne confonds pas les protocoles et les couches. TCP et UDP vivent à la couche Transport ; IP vit à la couche Internet (OSI : couche Réseau). L'examen aime tester ces associations.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># TCP/IP = 4 couches (le modele reel d'Internet)

#   Transport        -> Transport
#   Reseau           -> Internet
#   Liaison+Physique -> Acces reseau
# TCP = fiable | UDP = rapide | IP = adressage/routage</pre>`,

    { type: "vf", q: "Le modèle TCP/IP est celui réellement utilisé pour faire fonctionner Internet.", a: true, exp: "Vrai : TCP/IP est le modèle pratique implémenté dans les appareils et sur Internet." },
    { type: "input", q: "À quelle couche du modèle TCP/IP se trouvent HTTP, DNS et la messagerie ? (un mot)", a: ["application", "la couche application", "couche application"], ph: "un mot", exp: "Ces services vivent à la couche Application de TCP/IP." },
    { type: "qcm", q: "La couche Transport de TCP/IP correspond à quelle couche OSI ?", opts: ["Couche 1 Physique", "Couche 4 Transport", "Couche 7 Application", "Couche 2 Liaison"], a: 1, exp: "La couche Transport de TCP/IP correspond à la couche 4 Transport d'OSI." },
    { type: "vf", q: "Le protocole IP se situe à la couche Transport de TCP/IP.", a: false, exp: "Faux : IP est à la couche Internet ; TCP et UDP sont à la couche Transport." },
    { type: "qcm", q: "Pour un fichier important à télécharger sans erreur, quel protocole est le plus adapté ?", opts: ["UDP", "TCP", "Aucun protocole", "MAC"], a: 1, exp: "TCP, fiable, garantit que le fichier arrive complet et dans l'ordre." },
    { type: "input", q: "Quel protocole de transport privilégier pour un appel vidéo en direct, où la vitesse prime ? (trois lettres)", a: ["udp", "le udp", "l'udp"], ph: "3 lettres", exp: "UDP, rapide et sans garantie, convient au direct (streaming, voix, jeux)." }
  ],

    ],
