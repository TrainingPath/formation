  title: "L'encapsulation des données",
  subtitle: "Comment un message s'emballe couche après couche pour voyager.",
  theory: `
<h3>1. L'idée de l'encapsulation</h3>
<p>Quand tu envoies un message, il ne part pas tout nu sur le réseau. À chaque couche qu'il traverse en descendant, on lui <strong>ajoute une enveloppe</strong> avec des informations utiles. Ce processus s'appelle l'<strong>encapsulation</strong>. À l'arrivée, le destinataire retire les enveloppes une à une : c'est la <strong>désencapsulation</strong>.</p>
<div class="tip">Analogie postale : ta lettre (les données) est glissée dans une enveloppe (adresse du destinataire), puis dans un colis (bordereau de transport), puis dans un camion. Chaque niveau ajoute son étiquette. À l'arrivée, on déballe dans l'ordre inverse.</div>
<h3>2. L'en-tête : l'étiquette de chaque couche</h3>
<p>L'information ajoutée par une couche s'appelle un <strong>en-tête</strong> (en anglais <em>header</em>). L'en-tête contient ce dont cette couche a besoin : par exemple l'adresse IP source et destination à la couche Réseau, ou les adresses MAC à la couche Liaison. La couche 2 ajoute aussi parfois une information en fin, appelée <strong>en-queue</strong> (<em>trailer</em>), pour vérifier les erreurs.</p>
<h3>3. Les PDU : un nom différent à chaque couche</h3>
<p>À chaque couche, l'ensemble « données + en-tête » porte un nom spécifique : c'est la <strong>PDU</strong> (<em>Protocol Data Unit</em>, « unité de données de protocole »). Voici les noms à connaître absolument pour la certification CCST :</p>
<pre class="pseudo"># Les PDU couche par couche (modele TCP/IP / OSI)
Couche Application   ->  Donnees (data)
Couche Transport     ->  Segment
Couche Reseau        ->  Paquet (packet)
Couche Liaison       ->  Trame (frame)
Couche Physique      ->  Bits (0 et 1)</pre>
<p>Un moyen de mémoriser l'ordre en descendant : <strong>D</strong>onnées, <strong>S</strong>egment, <strong>P</strong>aquet, <strong>T</strong>rame, <strong>B</strong>its. Le message rétrécit en nom mais grossit en enveloppes au fur et à mesure qu'il descend.</p>
<h3>4. Le trajet complet : descendre puis remonter</h3>
<pre class="pseudo"># Emetteur : on DESCEND les couches (encapsulation)
Donnees  --(+en-tete Transport)-->  Segment
Segment  --(+en-tete Reseau, IP)-->  Paquet
Paquet   --(+en-tete Liaison, MAC)->  Trame
Trame    --(conversion en signaux)->  Bits  ==> sur le cable

# Destinataire : on REMONTE les couches (desencapsulation)
Bits ->  Trame ->  Paquet ->  Segment ->  Donnees</pre>
<p>Chez l'émetteur, les données descendent de la couche Application jusqu'à la couche Physique, gagnant une enveloppe à chaque étage. Sur le média, tout circule sous forme de <strong>bits</strong>. Chez le destinataire, on remonte les couches en retirant les enveloppes, jusqu'à retrouver les données d'origine.</p>
<div class="warn">Attention à l'ordre et aux noms exacts. Un paquet (couche Réseau) n'est pas une trame (couche Liaison). À l'examen CCST, on te demande souvent d'associer une PDU à sa couche : Segment→Transport, Paquet→Réseau, Trame→Liaison.</div>
<h3>5. Pourquoi c'est utile ?</h3>
<p>L'encapsulation permet à chaque couche de faire son travail <strong>sans se soucier des autres</strong>. La couche Réseau lit l'adresse IP dans son en-tête pour router, sans ouvrir le contenu. Cette organisation rend les réseaux modulaires, robustes et faciles à diagnostiquer.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Encapsulation = ajouter un en-tete a chaque couche en descendant
# Desencapsulation = retirer les en-tetes en remontant
# PDU par couche :
#   Donnees (Application) - Segment (Transport) - Paquet (Reseau)
#   Trame (Liaison) - Bits (Physique)
# En-tete (header) = etiquette ajoutee par une couche</pre>`,

    { type: "qcm", q: "Comment appelle-t-on l'information ajoutée par une couche ?", opts: ["Un en-tête (header)", "Une charge utile (payload)", "Un accusé de réception", "Un numéro de port"], a: 0, exp: "L'information ajoutée est un en-tête (header)." },

    { type: "qcm", q: "Dans quel ordre les PDU apparaissent-elles en descendant les couches ?", opts: ["Bits, Trame, Paquet, Segment, Données", "Données, Segment, Paquet, Trame, Bits", "Paquet, Segment, Trame, Données, Bits", "Segment, Données, Bits, Trame, Paquet"], a: 1, exp: "En descendant : Données, Segment, Paquet, Trame, Bits." },
    { type: "input", q: "Quelle PDU correspond à la couche Application ? (un mot)", a: ["donnees", "données", "data", "les donnees", "les données"], ph: "un mot", exp: "À la couche Application, on parle simplement de données (data)." },
    { type: "vf", q: "Un paquet et une trame désignent exactement la même chose.", a: false, exp: "Faux : le paquet est à la couche Réseau, la trame à la couche Liaison." },
    { type: "qcm", q: "Quelle information contient l'en-tête de la couche Réseau ?", opts: ["Les adresses IP source et destination", "Les adresses MAC source et destination", "Les numéros de port source et destination", "Le nom de domaine du destinataire"], a: 0, exp: "L'en-tête de la couche Réseau contient les adresses IP source et destination." },
    { type: "vf", q: "L'encapsulation permet à chaque couche de travailler sans ouvrir le contenu des autres couches.", a: true, exp: "Vrai : chaque couche lit son propre en-tête, ce qui rend le réseau modulaire." },
    { type: "qcm", q: "À la réception, dans quel sens parcourt-on les couches ?", opts: ["On descend, de Application vers Physique", "On remonte, de Physique vers Application", "On reste sur une seule couche", "L'ordre n'a pas d'importance"], a: 1, exp: "À la réception, on remonte : des bits (Physique) jusqu'aux données (Application)." },
    { type: "input", q: "Quelle PDU associe-t-on à la couche Transport ? (un mot)", a: ["segment", "le segment", "un segment"], ph: "un mot", exp: "La couche Transport produit des segments." }
  ],
  final: {

    intro: `<p>Léo envoie un message. Suivons-le pendant qu'il descend les couches chez l'émetteur, puis remonte chez le destinataire. Nomme correctement la PDU à chaque étape.</p>`,
    questions: [
      { type: "input", q: "À la couche Transport, le message devient un… (un mot)", a: ["segment", "le segment"], ph: "un mot", exp: "À la couche Transport : un segment." },

      { type: "input", q: "À la couche Liaison, avec l'adresse MAC, il devient une… (un mot)", a: ["trame", "la trame"], ph: "un mot", exp: "À la couche Liaison : une trame." },
      { type: "qcm", q: "Sur le câble (couche Physique), il circule sous forme de…", opts: ["Paquets", "Bits", "Segments", "Données brutes"], a: 1, exp: "Sur le média, tout circule en bits." },
      { type: "vf", q: "Chez le destinataire, on retire les en-têtes en remontant les couches (désencapsulation).", a: true, exp: "Vrai : la désencapsulation retire les enveloppes couche par couche." }
    ],
    solution: `<pre class="pseudo"># Trajet d'encapsulation du message de Leo :
Application  ->  Donnees
Transport    ->  Segment   (+ en-tete Transport)
Reseau       ->  Paquet    (+ en-tete IP)
Liaison      ->  Trame     (+ en-tete MAC)
Physique     ->  Bits      (signaux sur le cable)
# A la reception : desencapsulation dans l'ordre inverse
Bits -> Trame -> Paquet -> Segment -> Donnees</pre>
<p>Tu maîtrises l'ordre des PDU, une question quasi certaine à l'examen CCST. Demain, nous verrons les différents types de réseaux : LAN, WAN, cloud, PAN, MAN.</p>`
  }
