var DAY = {
  num: 12,
  title: "L'adresse IPv6 : les bases",
  subtitle: "128 bits, l'hexadécimal et le raccourci « :: ».",
  theory: `
<h3>1. Pourquoi l'IPv6 ?</h3>
<p>L'IPv4 offre environ 4,3 milliards d'adresses (2 puissance 32). Avec les milliards de téléphones, ordinateurs et objets connectés, ce stock s'est épuisé. La solution est l'<strong>IPv6</strong> (<em>Internet Protocol version 6</em>), une nouvelle version d'adresse beaucoup plus vaste, conçue pour remplacer progressivement l'IPv4.</p>
<h3>2. Une adresse IPv6 fait 128 bits</h3>
<p>Là où l'IPv4 utilise 32 bits, l'<strong>IPv6 utilise 128 bits</strong>, soit quatre fois plus. Le nombre d'adresses possibles devient astronomique (2 puissance 128), largement de quoi adresser chaque objet de la planète pour très longtemps.</p>
<div class="tip">À mémoriser absolument : IPv4 = 32 bits, IPv6 = 128 bits. C'est la différence la plus fondamentale entre les deux.</div>
<h3>3. La notation hexadécimale</h3>
<p>Écrire 128 bits en binaire serait illisible. L'IPv6 utilise donc la <strong>notation hexadécimale</strong> (base 16), qui emploie les chiffres 0 à 9 et les lettres a à f. Les 128 bits sont découpés en <strong>8 groupes</strong> de 16 bits, chaque groupe s'écrivant avec 4 chiffres hexadécimaux, et les groupes sont séparés par des <strong>deux-points</strong>.</p>
<pre class="pseudo"># Exemple d'adresse IPv6 complete :
2001:0db8:0000:0000:0000:0000:0000:0001
# 8 groupes de 4 chiffres hexadecimaux separes par ":"</pre>
<h3>4. Raccourcir une adresse : les deux règles</h3>
<p>Les adresses IPv6 comportent souvent beaucoup de zéros. Deux règles permettent de les raccourcir :</p>
<p><strong>Règle 1 :</strong> dans chaque groupe, on peut supprimer les zéros de tête. Ainsi <code>0db8</code> devient <code>db8</code> et <code>0001</code> devient <code>1</code>.</p>
<p><strong>Règle 2 :</strong> une seule fois par adresse, une suite de groupes entièrement nuls peut être remplacée par un <strong>double deux-points</strong> <code>::</code>.</p>
<pre class="pseudo"># Adresse complete :
2001:0db8:0000:0000:0000:0000:0000:0001
# Regle 1 (zeros de tete) :
2001:db8:0:0:0:0:0:1
# Regle 2 (:: pour la longue suite de zeros) :
2001:db8::1</pre>
<div class="warn">Le <code>::</code> ne peut apparaître qu'<strong>une seule fois</strong> dans une adresse. Sinon on ne saurait pas combien de groupes de zéros il remplace de chaque côté. <code>2001::db8::1</code> est donc invalide.</div>
<h3>5. Quelques repères utiles</h3>
<p>L'adresse de <strong>bouclage</strong> (loopback) en IPv6 est <code>::1</code> (l'équivalent du 127.0.0.1 en IPv4). Les adresses commençant par <code>fe80::</code> sont des adresses de <strong>lien local</strong> (link-local), utilisées automatiquement sur un même segment réseau.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IPv6 = adresse sur 128 bits (IPv4 = 32 bits)
# Ecriture : 8 groupes de 4 chiffres hexadecimaux (0-9, a-f)
#   separes par ":"
# Regle 1 : supprimer les zeros de tete de chaque groupe
# Regle 2 : "::" remplace UNE suite de groupes nuls (une seule fois)
# Loopback IPv6 : ::1   |   Lien local : fe80::/10</pre>`,
  exercises: [
    { type: "qcm", q: "Sur combien de bits est codée une adresse IPv6 ?", opts: ["32 bits", "64 bits", "128 bits", "256 bits"], a: 2, exp: "IPv6 = 128 bits (quatre fois plus que l'IPv4)." },
    { type: "qcm", q: "Quelle base utilise l'écriture des adresses IPv6 ?", opts: ["Base 2 (binaire)", "Base 10 (décimale)", "Base 16 (hexadécimale)", "Base 8 (octale)"], a: 2, exp: "IPv6 s'écrit en hexadécimal (0-9 et a-f)." },
    { type: "input", q: "En combien de groupes se découpent les 128 bits d'une IPv6 ? (un nombre)", a: ["8", "huit"], ph: "un nombre", exp: "8 groupes de 16 bits." },
    { type: "qcm", q: "Quel séparateur utilise-t-on entre les groupes d'une IPv6 ?", opts: ["Le point", "Le tiret", "Le deux-points", "La barre oblique"], a: 2, exp: "Les groupes IPv6 sont séparés par des deux-points « : »." },
    { type: "qcm", q: "Que permet le symbole « :: » dans une IPv6 ?", opts: ["Séparer deux adresses", "Remplacer une suite de groupes nuls", "Indiquer le masque", "Marquer la fin de l'adresse"], a: 1, exp: "« :: » remplace une suite de groupes entièrement à zéro." },
    { type: "vf", q: "Le symbole « :: » peut apparaître plusieurs fois dans une même adresse IPv6.", a: false, exp: "Non : une seule fois, sinon l'adresse est ambiguë." },
    { type: "input", q: "Quelle est l'adresse de bouclage (loopback) en IPv6 ?", a: ["::1"], ph: "l'adresse", exp: "::1 est le loopback IPv6 (équivalent de 127.0.0.1)." },
    { type: "vf", q: "IPv6 utilise plus de bits qu'IPv4.", a: true, exp: "Oui : 128 bits contre 32." },
    { type: "qcm", q: "Quels caractères sont autorisés en hexadécimal ?", opts: ["0 à 9 seulement", "0 à 9 et a à f", "a à z", "0 et 1 seulement"], a: 1, exp: "Hexadécimal = chiffres 0-9 et lettres a-f." },
    { type: "input", q: "Écris la forme raccourcie de 2001:0db8:0000:0000:0000:0000:0000:0001", a: ["2001:db8::1"], ph: "adresse abrégée", exp: "Zéros de tête retirés + :: pour la suite de zéros." },
    { type: "vf", q: "Chaque groupe d'une IPv6 s'écrit avec au maximum 4 chiffres hexadécimaux.", a: true, exp: "Oui : 16 bits = 4 chiffres hexadécimaux." },
    { type: "qcm", q: "Par quoi commencent les adresses de lien local (link-local) en IPv6 ?", opts: ["2001::", "fe80::", "::1", "127."], a: 1, exp: "Les adresses link-local commencent par fe80::." },
    { type: "input", q: "Sur combien de bits une IPv6 est-elle codée ? (un nombre)", a: ["128"], ph: "un nombre", exp: "128 bits." },
    { type: "qcm", q: "Pourquoi a-t-on créé l'IPv6 ?", opts: ["Pour rendre le réseau plus lent", "Parce que les adresses IPv4 s'épuisaient", "Pour supprimer les câbles", "Pour remplacer le WiFi"], a: 1, exp: "Le stock d'adresses IPv4 est devenu insuffisant." },
    { type: "vf", q: "L'adresse 2001::db8::1 est une IPv6 valide.", a: false, exp: "Non : deux « :: » rendent l'adresse ambiguë donc invalide." }
  ],
  final: {
    title: "Exercice final — Lire et raccourcir une IPv6",
    intro: "<p>Un serveur possède l'adresse IPv6 complète <code>2001:0db8:0000:0000:0000:0000:0000:0001</code>. Tu dois la comprendre et l'écrire proprement.</p>",
    questions: [
      { type: "input", q: "Sur combien de bits est codée cette adresse ? (un nombre)", a: ["128"], ph: "un nombre", exp: "Toute IPv6 fait 128 bits." },
      { type: "input", q: "Combien de groupes hexadécimaux compte la forme complète ? (un nombre)", a: ["8", "huit"], ph: "un nombre", exp: "8 groupes séparés par des deux-points." },
      { type: "input", q: "Écris la forme raccourcie de cette adresse.", a: ["2001:db8::1"], ph: "adresse abrégée", exp: "2001:db8::1 après application des deux règles." },
      { type: "qcm", q: "Combien de fois peut-on utiliser « :: » dans cette adresse ?", opts: ["Autant que voulu", "Deux fois", "Une seule fois", "Jamais"], a: 2, exp: "« :: » n'apparaît qu'une seule fois." },
      { type: "input", q: "Quelle serait l'adresse de bouclage IPv6 de ce serveur ?", a: ["::1"], ph: "loopback", exp: "::1 est le loopback IPv6." }
    ],
    solution: "<pre class=\"pseudo\"># 2001:0db8:0000:0000:0000:0000:0000:0001  (forme complete, 128 bits)\n# Regle 1 (zeros de tete) : 2001:db8:0:0:0:0:0:1\n# Regle 2 (::)            : 2001:db8::1\n# \"::\" : une seule fois par adresse\n# Loopback IPv6 : ::1</pre><p>Tu connais les bases de l'IPv6. Demain : les adresses privées, publiques et spéciales.</p>"
  }
};
