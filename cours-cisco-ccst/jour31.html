<script>
var DAY = {
  num: 31,
  title: "Projet final : dépanner et documenter un réseau",
  subtitle: "La synthèse : diagnostiquer une panne, puis documenter la topologie et la résolution.",
  theory: `
<h3>1. Le projet : rassembler tout ce qu'on a appris</h3>
<p>Ce dernier jour est un <strong>projet de synthèse</strong>. Tu ne découvres rien de neuf : tu combines les compétences des jours précédents pour traiter un cas complet, du symptôme à la documentation. Un professionnel ne fait pas que « réparer » : il <strong>diagnostique méthodiquement</strong>, il <strong>corrige</strong>, puis il <strong>laisse une trace écrite</strong>. Ce sont ces trois temps que le projet fait travailler ensemble.</p>
<pre class="pseudo"># Les trois temps du projet
1. DIAGNOSTIQUER : trouver la panne avec methode (couches, ping, etc.)
2. RESOUDRE      : appliquer la correction, une modif a la fois
3. DOCUMENTER    : topologie + symptome + cause + solution</pre>
<h3>2. Rappel express de la méthode de diagnostic</h3>
<p>On réutilise la démarche ordonnée : vérifier le <strong>câble</strong>, l'<strong>adresse IP</strong> (attention au 169.254.x.x qui trahit un DHCP muet), la <strong>passerelle</strong>, puis le <strong>DNS</strong>. On s'appuie sur le modèle <strong>OSI</strong> et on choisit un sens : <strong>bottom-up</strong> si l'on soupçonne le matériel, <strong>top-down</strong> si une seule application flanche. Les outils restent <code>ping</code>, <code>ipconfig</code> / <code>ip a</code>, <code>tracert</code>, <code>nslookup</code>. Et toujours : <strong>une seule modification à la fois</strong>, puis on vérifie.</p>
<pre class="pseudo"># Boite a outils du diagnostic
ping 127.0.0.1     # ma carte reseau (loopback)
ping 192.168.1.1   # la passerelle (routeur)
ping 8.8.8.8       # une IP publique
ping cisco.com     # un nom (teste le DNS)
ipconfig /all      # config complete (Windows)</pre>
<h3>3. Documenter la topologie</h3>
<p>Documenter, c'est d'abord décrire le réseau tel qu'il est : quels appareils, reliés comment, avec quelles adresses. Un <strong>schéma de topologie</strong> simple et un <strong>tableau d'adressage</strong> valent mieux qu'un long texte. Cette documentation permet à n'importe qui de comprendre le réseau et sert de référence lors de la prochaine panne.</p>
<pre class="pseudo"># Exemple de documentation de topologie
[ PC0 ]---.                       .---[ Routeur 192.168.1.1 ]---&gt; Internet
          +---[ Switch ]---------+
[ PC1 ]---'

Appareil  Adresse IP      Masque           Passerelle
PC0       192.168.1.10    255.255.255.0    192.168.1.1
PC1       192.168.1.11    255.255.255.0    192.168.1.1
Routeur   192.168.1.1     255.255.255.0    -</pre>
<h3>4. Documenter la résolution</h3>
<p>Une fois la panne réglée, on écrit le <strong>compte-rendu</strong> : le <strong>symptôme</strong> observé, la <strong>cause</strong> identifiée, la <strong>solution</strong> appliquée, et éventuellement une <strong>prévention</strong> pour éviter que ça recommence. Ce petit texte est précieux : il transforme une galère ponctuelle en savoir partagé. Une panne bien documentée est à moitié réglée pour la prochaine fois.</p>
<div class="tip">Un bon compte-rendu tient en quatre lignes : <strong>Symptôme</strong>, <strong>Cause</strong>, <strong>Solution</strong>, <strong>Prévention</strong>. Clair, factuel, réutilisable.</div>
<div class="warn">Ne jamais clore un dépannage sans vérifier que le symptôme initial a bien disparu, ni sans écrire ce qui a été fait. Un correctif non documenté sera oublié, et la même panne reviendra hanter l'équipe.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Projet = DIAGNOSTIQUER + RESOUDRE + DOCUMENTER.
# Diagnostic : methode ordonnee (cable, IP, passerelle, DNS) + couches OSI.
# Une modif a la fois, puis on verifie que le symptome a disparu.
# Documentation = schema de topologie + tableau d'adressage
#                + compte-rendu (Symptome / Cause / Solution / Prevention).</pre>`,
  exercises: [
    { type: "qcm", q: "Quels sont les trois temps du projet final ?", opts: ["Câbler, configurer, tester", "Diagnostiquer, résoudre, documenter", "Signaler, patienter, remplacer", "Isoler, corriger, redémarrer"], a: 1, exp: "Diagnostiquer la panne, la résoudre, puis documenter le tout." },
    { type: "qcm", q: "Dans quel ordre vérifie-t-on une panne de connectivité ?", opts: ["DNS, passerelle, IP, câble", "Câble, IP, passerelle, DNS", "DNS, câble, IP, passerelle", "Passerelle puis câble"], a: 1, exp: "Du plus physique au plus abstrait : câble, IP, passerelle, DNS." },
    { type: "input", q: "Que révèle une adresse IP en 169.254.x.x sur une machine ?", a: ["pas de dhcp", "absence de dhcp", "aucun dhcp", "pas de serveur dhcp", "le dhcp ne repond pas"], ph: "pas de …", exp: "169.254.x.x (APIPA) = aucun serveur DHCP n'a répondu." },
    { type: "qcm", q: "Que contient un bon compte-rendu de résolution ?", opts: ["La durée totale de l'intervention", "Symptôme, cause, solution (et prévention)", "L'inventaire complet du matériel", "Uniquement la date de l'intervention"], a: 1, exp: "Symptôme / Cause / Solution / Prévention : factuel et réutilisable." },
    { type: "vf", q: "Pendant le dépannage, on ne modifie qu'une seule chose à la fois.", a: true, exp: "Oui : pour attribuer clairement l'effet à la bonne cause." },
    { type: "input", q: "Quelle commande teste si un nom de domaine se résout, en interrogeant le DNS ?", a: ["nslookup"], ph: "une commande", exp: "nslookup interroge le DNS pour traduire un nom en adresse IP." },
    { type: "qcm", q: "ping 8.8.8.8 réussit mais ping cisco.com échoue. Diagnostic ?", opts: ["Câble débranché", "Problème de DNS", "Passerelle mal configurée", "Adresse IP en double"], a: 1, exp: "L'IP passe mais pas le nom : la résolution DNS est en cause." },
    { type: "qcm", q: "Pour documenter un réseau, quel duo est le plus parlant ?", opts: ["Un long rapport rédigé en prose", "Un schéma de topologie et un tableau d'adressage", "Une photo de la salle serveur", "La liste des logiciels installés"], a: 1, exp: "Schéma + tableau d'adressage rendent le réseau compréhensible en un coup d'oeil." },
    { type: "vf", q: "On peut clore un dépannage sans vérifier que le symptôme initial a disparu.", a: false, exp: "Non : on vérifie toujours que le problème d'origine est bien résolu." },
    { type: "input", q: "Sur quel modèle en couches s'appuie la méthode de diagnostic ? (trois lettres)", a: ["osi", "le modele osi", "modele osi"], ph: "trois lettres", exp: "Le modèle OSI (7 couches) structure l'approche du dépannage." },
    { type: "qcm", q: "Une seule application échoue, le reste marche. Quelle approche est la plus rapide ?", opts: ["Bottom-up", "Top-down (partir de l'application)", "Débrancher le routeur", "Réinstaller le switch"], a: 1, exp: "Top-down part de la couche applicative : idéal pour un souci d'une seule appli." },
    { type: "qcm", q: "Pourquoi documenter une panne récurrente ?", opts: ["Pour justifier l'achat de matériel neuf", "Parce qu'elle cache souvent un problème de fond à traiter", "Pour désigner le responsable de la panne", "Pour gonfler la taille du rapport"], a: 1, exp: "Une panne qui revient signale généralement une cause structurelle." },
    { type: "vf", q: "La passerelle par défaut d'un PC est l'adresse de son routeur.", a: true, exp: "Oui : c'est la porte de sortie du réseau local vers l'extérieur." },
    { type: "input", q: "Quel outil Cisco gratuit permet de simuler ce réseau sans matériel réel ? (deux mots)", a: ["packet tracer", "cisco packet tracer"], ph: "Packet …", exp: "Packet Tracer simule le réseau pour tester la topologie sans équipement." },
    { type: "qcm", q: "La passerelle répond, mais aucun site n'ouvre par son nom. Que documenter comme cause probable ?", opts: ["Le serveur DHCP", "Un problème de DNS", "Le masque de sous-réseau", "Le câble réseau"], a: 1, exp: "LAN OK + noms KO = DNS : c'est la cause à consigner et corriger." }
  ],
  final: {
    title: "Exercice final — Le cas complet de l'agence",
    intro: `<p>À l'agence, PC1 n'accède à rien. <code>ipconfig</code> montre <strong>169.254.5.8</strong>. PC2, lui, a <strong>192.168.1.11</strong> et fonctionne. Mène le projet de bout en bout : diagnostic, résolution, documentation.</p>`,
    questions: [
      { type: "qcm", q: "Que t'indique le 169.254.5.8 de PC1 ?", opts: ["L'adresse a été fixée manuellement", "PC1 n'a pas reçu d'adresse du DHCP", "Le DNS est cassé", "Internet est coupé pour tous"], a: 1, exp: "169.254.x.x = APIPA : pas de réponse du DHCP pour PC1." },
      { type: "vf", q: "Comme PC2 fonctionne, le problème est probablement local à PC1 (câble, port, DHCP côté PC1).", a: true, exp: "Oui : un seul poste touché oriente vers un souci local à ce poste." },
      { type: "input", q: "Après avoir rebranché le câble de PC1, quelle commande Windows redemande une adresse ? (commande complète)", a: ["ipconfig /renew", "ipconfig/renew"], ph: "ipconfig /…", exp: "ipconfig /renew relance une demande d'adresse au DHCP." },
      { type: "qcm", q: "PC1 obtient 192.168.1.12. Quel test valide qu'il rejoint la passerelle ?", opts: ["nslookup", "ping 192.168.1.1", "shutdown", "ipconfig /all seulement"], a: 1, exp: "Un ping vers la passerelle confirme l'accès au routeur." },
      { type: "qcm", q: "Quelle forme doit prendre la documentation finale ?", opts: ["Un message oral rapide à l'équipe", "Schéma de topologie + tableau d'adressage + compte-rendu (symptôme/cause/solution)", "Un simple « c'est réparé »", "Une simple photo du poste réparé"], a: 1, exp: "Topologie, adressage et compte-rendu structuré : la trace réutilisable." }
    ],
    solution: `<pre class="pseudo"># PROJET COMPLET - Cas de l'agence

## 1. DIAGNOSTIC (methode ordonnee, PC1 seul touche)
PC1 = 169.254.5.8 -&gt; pas de DHCP. PC2 = 192.168.1.11 OK -&gt; le reseau fonctionne.
Probleme local a PC1. On verifie le cable/port : cable debranche.

## 2. RESOLUTION (une modif a la fois)
- Rebrancher le cable de PC1, LED du port allumee.
- ipconfig /renew -&gt; PC1 obtient 192.168.1.12 / 255.255.255.0 / passerelle 192.168.1.1
- ping 192.168.1.1 -&gt; Reply ; ping cisco.com -&gt; Reply. Symptome disparu.

## 3. DOCUMENTATION
Topologie : PC1 & PC2 -&gt; Switch -&gt; Routeur (192.168.1.1) -&gt; Internet
Adressage : PC1 192.168.1.12 | PC2 192.168.1.11 | Routeur 192.168.1.1 | /24
Compte-rendu :
  Symptome : PC1 sans acces, adresse 169.254.5.8.
  Cause    : cable reseau de PC1 debranche -&gt; pas de DHCP.
  Solution : rebranchement + ipconfig /renew, connectivite retablie.
  Prevention : fixer le cable, verifier les prises lors des deplacements de poste.</pre>
<p>Diagnostic méthodique, correction prudente, documentation claire : le réflexe complet du technicien réseau. Félicitations, tu as bouclé le parcours !</p>`
  }
};
</script>
