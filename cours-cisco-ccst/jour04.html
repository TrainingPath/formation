<script>
var DAY = {
  num: 4,
  title: "Le modèle OSI (7 couches)",
  subtitle: "Découper la communication réseau en 7 étages pour tout comprendre.",
  theory: `
<h3>1. Pourquoi un modèle en couches ?</h3>
<p>Faire communiquer deux ordinateurs est une tâche énorme : il faut gérer le câble, les adresses, les erreurs, le format des données… Pour ne pas s'y perdre, on <strong>découpe</strong> le problème en étages. C'est le rôle du <strong>modèle OSI</strong> (<em>Open Systems Interconnection</em>), un modèle de référence à <strong>7 couches</strong>. Chaque couche a une mission précise et s'appuie sur celle du dessous.</p>
<div class="tip">Le modèle OSI est <strong>théorique</strong> : c'est une carte mentale pour comprendre et diagnostiquer les réseaux. Il est incontournable pour la certification CCST et pour toutes les certifications Cisco.</div>
<h3>2. Les 7 couches, de haut en bas</h3>
<pre class="pseudo"># Modele OSI (numero 7 en haut, 1 en bas)
7  Application    : l'interface avec l'utilisateur (HTTP, mail)
6  Presentation   : format, chiffrement, compression des donnees
5  Session        : ouverture/suivi/fermeture des dialogues
4  Transport      : decoupe en segments, fiabilite (TCP/UDP)
3  Reseau         : adressage logique et routage (IP)
2  Liaison        : adressage physique local, trames (MAC)
1  Physique       : signaux electriques/lumineux, cables, bits</pre>
<h3>3. Détail des couches hautes (7, 6, 5)</h3>
<p>La <strong>couche 7 Application</strong> est celle que « voit » l'utilisateur : c'est là que travaillent les protocoles comme <strong>HTTP</strong> (web) ou les e-mails. La <strong>couche 6 Présentation</strong> met les données dans un <strong>format</strong> compréhensible : elle gère l'encodage, la <strong>compression</strong> et le <strong>chiffrement</strong>. La <strong>couche 5 Session</strong> ouvre, maintient et ferme les <strong>dialogues</strong> entre deux applications.</p>
<h3>4. Détail des couches basses (4, 3, 2, 1)</h3>
<p>La <strong>couche 4 Transport</strong> découpe les données en morceaux appelés <strong>segments</strong> et assure (avec TCP) leur bonne arrivée. La <strong>couche 3 Réseau</strong> gère l'<strong>adressage logique</strong> (l'adresse <strong>IP</strong>) et le <strong>routage</strong> : trouver le chemin d'un réseau à un autre. La <strong>couche 2 Liaison</strong> gère l'adressage <strong>physique local</strong> (l'adresse <strong>MAC</strong>) et forme les <strong>trames</strong>. La <strong>couche 1 Physique</strong> transmet les <strong>bits</strong> (0 et 1) sous forme de signaux sur le câble ou les ondes.</p>
<pre class="pseudo"># Repere : ou travaillent les equipements ?
Routeur  -> couche 3 (Reseau, adresses IP)
Switch   -> couche 2 (Liaison, adresses MAC)
Cable/Wi-Fi -> couche 1 (Physique, les bits)</pre>
<div class="warn">Piège classique : ne mélange pas la couche 3 (Réseau, IP, routeur) et la couche 2 (Liaison, MAC, switch). Le routeur travaille à la couche 3 ; le switch à la couche 2. Cette distinction tombe souvent à l'examen.</div>
<h3>5. Un moyen mnémotechnique</h3>
<p>Pour retenir l'ordre des couches 7 à 1, une phrase française amusante aide : « <strong>A</strong>lain <strong>P</strong>rend <strong>S</strong>on <strong>T</strong>rain <strong>R</strong>égional <strong>L</strong>e <strong>P</strong>remier » (Application, Présentation, Session, Transport, Réseau, Liaison, Physique).</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># OSI = 7 couches (Open Systems Interconnection)
# 7 Application  6 Presentation  5 Session
# 4 Transport    3 Reseau        2 Liaison   1 Physique
# Routeur = couche 3 (IP) | Switch = couche 2 (MAC) | Cable = couche 1
# Modele theorique de reference pour comprendre les reseaux</pre>`,
  exercises: [
    { type: "qcm", q: "Combien de couches compte le modèle OSI ?", opts: ["4 couches", "5 couches", "7 couches", "12 couches"], a: 2, exp: "Le modèle OSI comporte exactement 7 couches." },
    { type: "qcm", q: "Que signifie l'acronyme OSI ?", opts: ["Open Systems Interconnection", "Online Server Interface", "Operating System Internet", "Optical Signal Input"], a: 0, exp: "OSI = Open Systems Interconnection (interconnexion de systèmes ouverts)." },
    { type: "input", q: "Quel est le numéro de la couche Physique dans le modèle OSI ?", a: ["1", "un", "couche 1"], ph: "un chiffre", exp: "La couche Physique est la couche 1, tout en bas du modèle." },
    { type: "qcm", q: "Quelle couche gère l'adressage IP et le routage ?", opts: ["Couche 1 Physique", "Couche 2 Liaison", "Couche 3 Réseau", "Couche 7 Application"], a: 2, exp: "La couche 3 Réseau gère l'adressage logique (IP) et le routage." },
    { type: "qcm", q: "À quelle couche OSI travaille principalement un routeur ?", opts: ["Couche 1", "Couche 2", "Couche 3", "Couche 5"], a: 2, exp: "Le routeur travaille à la couche 3 (Réseau), avec les adresses IP." },
    { type: "qcm", q: "À quelle couche OSI travaille principalement un switch ?", opts: ["Couche 2 Liaison", "Couche 3 Réseau", "Couche 4 Transport", "Couche 7 Application"], a: 0, exp: "Le switch travaille à la couche 2 (Liaison), avec les adresses MAC." },
    { type: "input", q: "Quelle couche (nom) est la plus proche de l'utilisateur, où travaillent HTTP et les e-mails ?", a: ["application", "couche application", "la couche application", "7"], ph: "un nom", exp: "La couche 7 Application est l'interface avec l'utilisateur." },
    { type: "vf", q: "Le modèle OSI est un modèle théorique de référence pour comprendre les réseaux.", a: true, exp: "Vrai : OSI est un modèle de référence, très utile pour comprendre et diagnostiquer." },
    { type: "qcm", q: "Quelle couche transmet les bits (0 et 1) sous forme de signaux sur le câble ?", opts: ["Couche Physique (1)", "Couche Transport (4)", "Couche Session (5)", "Couche Réseau (3)"], a: 0, exp: "La couche 1 Physique transmet les bits sous forme de signaux." },
    { type: "input", q: "Quel type d'adresse la couche 2 (Liaison) utilise-t-elle ? (trois lettres)", a: ["mac", "adresse mac", "l'adresse mac"], ph: "3 lettres", exp: "La couche 2 utilise l'adresse MAC (adresse physique locale)." },
    { type: "vf", q: "La couche 6 Présentation peut s'occuper du chiffrement et de la compression des données.", a: true, exp: "Vrai : la couche Présentation gère le format, le chiffrement et la compression." },
    { type: "qcm", q: "Dans quel ordre lit-on les couches de haut en bas ?", opts: ["Physique, Liaison, Réseau...", "Application, Présentation, Session, Transport, Réseau, Liaison, Physique", "Réseau, Application, Transport...", "Session, Physique, Application..."], a: 1, exp: "De la couche 7 à la 1 : Application, Présentation, Session, Transport, Réseau, Liaison, Physique." },
    { type: "vf", q: "Le routeur et le switch travaillent tous les deux à la même couche OSI.", a: false, exp: "Faux : le routeur est à la couche 3, le switch à la couche 2." },
    { type: "qcm", q: "Quelle couche découpe les données en segments et assure la fiabilité avec TCP ?", opts: ["Couche 4 Transport", "Couche 1 Physique", "Couche 2 Liaison", "Couche 7 Application"], a: 0, exp: "La couche 4 Transport découpe en segments et gère la fiabilité (TCP)." },
    { type: "input", q: "Quel numéro porte la couche Application (la plus haute) ?", a: ["7", "sept", "couche 7"], ph: "un chiffre", exp: "La couche Application est la couche 7, tout en haut du modèle." }
  ],
  final: {
    title: "Exercice final — Placer chaque élément à sa couche",
    intro: `<p>Un technicien Cisco diagnostique un problème. Il observe : un câble débranché, une adresse IP mal réglée, une adresse MAC apprise par un switch, et un site web inaccessible. Associons chaque symptôme à la bonne couche OSI.</p>`,
    questions: [
      { type: "qcm", q: "Un câble débranché relève de quelle couche ?", opts: ["Couche 1 Physique", "Couche 3 Réseau", "Couche 7 Application", "Couche 5 Session"], a: 0, exp: "Le câble et les signaux relèvent de la couche 1 Physique." },
      { type: "qcm", q: "Une adresse IP mal réglée relève de quelle couche ?", opts: ["Couche 1", "Couche 2", "Couche 3 Réseau", "Couche 6"], a: 2, exp: "L'adressage IP est géré par la couche 3 Réseau." },
      { type: "input", q: "L'adresse apprise par un switch (couche 2) est une adresse… (trois lettres)", a: ["mac", "adresse mac"], ph: "3 lettres", exp: "Le switch (couche 2) travaille avec les adresses MAC." },
      { type: "qcm", q: "Un site web (HTTP) inaccessible touche surtout quelle couche ?", opts: ["Couche 7 Application", "Couche 1 Physique", "Couche 2 Liaison", "Couche 4 Transport"], a: 0, exp: "HTTP et les sites web relèvent de la couche 7 Application." },
      { type: "vf", q: "Un routeur travaille à la couche 3, un switch à la couche 2.", a: true, exp: "Vrai : routeur = couche 3 (IP), switch = couche 2 (MAC)." }
    ],
    solution: `<pre class="pseudo"># Association symptome -> couche OSI :
Cable debranche        -> couche 1  (Physique)
Adresse MAC (switch)   -> couche 2  (Liaison)
Adresse IP mal reglee  -> couche 3  (Reseau)
Site web (HTTP) KO     -> couche 7  (Application)
# Rappel : Routeur = couche 3, Switch = couche 2</pre>
<p>Savoir situer un problème sur la bonne couche est une compétence phare des techniciens Cisco. Demain, nous verrons le modèle TCP/IP et sa correspondance avec OSI.</p>`
  }
};
</script>
