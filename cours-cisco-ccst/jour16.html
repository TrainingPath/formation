<h3>1. Communiquer sans câble</h3>
<p>Le <strong>WiFi</strong> permet de connecter des appareils à un réseau <strong>sans câble</strong>, grâce à des <strong>ondes radio</strong>. À la place d'un fil, l'information voyage dans l'air entre l'appareil (téléphone, PC) et un <strong>point d'accès</strong> (<em>access point</em>, souvent intégré à la box). C'est pratique et mobile, mais partagé : plusieurs appareils se disputent le même « air ».</p>
<h3>2. La norme 802.11</h3>
<p>Le WiFi repose sur une famille de normes techniques appelée <strong>802.11</strong>, définie par l'organisme IEEE. Au fil des années, plusieurs versions se sont succédé, chacune plus rapide :</p>
<pre class="pseudo"># Quelques versions de 802.11 :
802.11n   -> WiFi 4
802.11ac  -> WiFi 5
802.11ax  -> WiFi 6
# Plus la norme est recente, plus le debit possible est eleve.</pre>
<div class="tip">Depuis quelques années, on utilise des noms simplifiés : WiFi 4, WiFi 5, WiFi 6... plus faciles à retenir que 802.11n/ac/ax.</div>
<h3>3. Le SSID : le nom du réseau</h3>
<p>Chaque réseau WiFi porte un <strong>nom</strong> que tu vois dans la liste des réseaux disponibles : c'est le <strong>SSID</strong> (<em>Service Set Identifier</em>). Quand tu choisis « Livebox-1234 » ou « CafeWiFi », tu sélectionnes un SSID. Il peut être visible ou masqué, et plusieurs points d'accès peuvent diffuser le même SSID pour couvrir une grande zone.</p>
<h3>4. Les bandes 2,4 GHz et 5 GHz</h3>
<p>Le WiFi utilise principalement deux <strong>bandes de fréquences</strong>, avec des caractéristiques complémentaires :</p>
<pre class="pseudo"># Deux bandes principales :
2,4 GHz : plus longue portee, traverse mieux les murs,
          mais plus lente et plus encombree (beaucoup d'appareils).
5 GHz   : plus rapide, moins encombree,
          mais portee plus courte (traverse moins bien les murs).</pre>
<p>En clair : la <strong>2,4 GHz</strong> va plus loin mais moins vite ; la <strong>5 GHz</strong> va plus vite mais moins loin. Beaucoup de box gèrent les deux en même temps.</p>
<div class="warn">Le WiFi est un support <strong>partagé</strong> et sensible aux interférences (autres réseaux, four à micro-ondes en 2,4 GHz, murs épais). Le débit réel est souvent inférieur au débit théorique annoncé.</div>
<h3>5. La sécurité du sans-fil</h3>
<p>Comme les ondes se propagent dans l'air, n'importe qui à portée peut les capter. Il faut donc <strong>chiffrer</strong> le WiFi. La protection actuelle recommandée est le <strong>WPA2</strong> ou le <strong>WPA3</strong>, protégés par un mot de passe. Les anciennes protections comme le WEP sont obsolètes et à éviter.</p>
<h3>6. Ce qu'il faut retenir</h3>

# Bandes : 2,4 GHz (portee +, vitesse -) | 5 GHz (vitesse +, portee -)
