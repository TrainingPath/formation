<script>
var DAY = {
  num: 26,
  title: "La méthodologie de dépannage",
  subtitle: "Penser par couches, choisir top-down ou bottom-up, et ne jamais avancer au hasard.",
  theory: `
<h3>1. Pourquoi une méthode plutôt que de l'instinct ?</h3>
<p>Devant une panne, la tentation est de « bidouiller » : redémarrer, débrancher, réinstaller au hasard. On perd du temps et, pire, on peut casser autre chose. Une <strong>méthodologie</strong> (une démarche structurée) transforme le dépannage en enquête reproductible. Les réseaux se prêtent parfaitement à cela car ils sont bâtis en <strong>couches</strong>. On s'appuie sur le modèle <strong>OSI</strong> (Open Systems Interconnection), qui découpe la communication en 7 couches empilées, de la plus concrète (les câbles) à la plus abstraite (l'application vue par l'utilisateur).</p>
<pre class="pseudo"># Les 7 couches OSI (du bas vers le haut)
7. Application    (le logiciel : navigateur, mail)
6. Presentation   (format, chiffrement)
5. Session        (dialogue entre applications)
4. Transport      (TCP/UDP, ports, fiabilite)
3. Reseau         (IP, routage, la passerelle)
2. Liaison        (MAC, le switch, la trame)
1. Physique       (cable, Wi-Fi, signal electrique)</pre>
<h3>2. Deux sens de parcours : bottom-up et top-down</h3>
<p>Puisque les couches sont empilées, on peut les vérifier dans deux sens. L'approche <strong>bottom-up</strong> (« du bas vers le haut ») part de la couche 1 (le câble) et monte : idéale quand on soupçonne un souci matériel, ou pour une machine qui ne voit rien du tout. L'approche <strong>top-down</strong> (« du haut vers le bas ») part de la couche 7 (l'application) et descend : idéale quand une seule application pose problème alors que le reste fonctionne. Il existe aussi le <strong>divide and conquer</strong> (« diviser pour régner ») : on teste directement une couche du milieu (souvent la couche 3, avec un <code>ping</code>) pour savoir dans quelle moitié se trouve la panne, puis on continue dans cette moitié.</p>
<div class="tip">Le choix n'est pas dogmatique : on prend le sens qui atteint la cause probable le plus vite. Un câble suspect ? bottom-up. Un seul site inaccessible alors que tout le reste marche ? top-down. Aucune idée ? divide and conquer avec un ping en couche 3.</div>
<h3>3. Les étapes d'un dépannage propre</h3>
<p>Quelle que soit la direction, une bonne enquête suit toujours les mêmes phases. On <strong>observe</strong> et on <strong>reproduit</strong> le symptôme, on formule une <strong>hypothèse</strong>, on la <strong>teste</strong> en ne changeant <strong>qu'une chose à la fois</strong>, on <strong>vérifie</strong> le résultat, puis on <strong>documente</strong>. Changer plusieurs paramètres d'un coup est le piège numéro un : si ça remarche, on ne sait pas pourquoi, et on ne saura pas le refaire.</p>
<pre class="pseudo"># Le cycle de depannage
Observer  -&gt; reproduire le symptome precis
Hypothese -&gt; quelle couche, quelle cause probable ?
Tester    -&gt; UNE seule modification a la fois
Verifier  -&gt; le symptome a-t-il disparu ?
   oui -&gt; documenter et cloturer
   non -&gt; annuler le changement, nouvelle hypothese</pre>
<div class="warn">Toujours annuler un changement qui n'a rien résolu avant d'en essayer un autre. Sinon on accumule des modifications parasites qui deviennent elles-mêmes des pannes.</div>
<h3>4. Documenter, l'étape qu'on oublie</h3>
<p>Une fois la panne résolue, note ce qui s'est passé : le symptôme, la cause trouvée, la solution appliquée. Cette <strong>documentation</strong> sert la prochaine fois — à toi ou à un collègue — et révèle les pannes récurrentes qui cachent un vrai problème de fond. Un dépannage non documenté est un dépannage à moitié fait.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Modele OSI : 7 couches, du cable (1) a l'application (7)
# Bottom-up : du bas vers le haut  (soupcon materiel)
# Top-down  : du haut vers le bas  (une appli fautive)
# Divide & conquer : tester le milieu (ping, couche 3) pour cibler la moitie
# Toujours : une modif a la fois, verifier, puis DOCUMENTER</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quel modèle en couches s'appuie la méthodologie de dépannage réseau ?", opts: ["Le modèle HTTP", "Le modèle OSI (7 couches)", "Le modèle DNS", "Le modèle USB"], a: 1, exp: "Le modèle OSI découpe la communication en 7 couches empilées." },
    { type: "input", q: "Combien de couches compte le modèle OSI ?", a: ["7", "sept"], ph: "un nombre", exp: "OSI compte 7 couches, de la couche physique (1) à l'application (7)." },
    { type: "qcm", q: "L'approche « bottom-up » part de quelle couche ?", opts: ["De l'application (7)", "Du transport (4)", "Du câble / physique (1)", "De la session (5)"], a: 2, exp: "Bottom-up = du bas (couche 1, physique) vers le haut." },
    { type: "qcm", q: "Quand privilégier une approche « top-down » ?", opts: ["Quand un câble est suspect", "Quand une seule application échoue alors que le reste marche", "Quand le PC ne s'allume pas", "Jamais"], a: 1, exp: "Top-down part de l'application : utile quand le souci semble logiciel/applicatif." },
    { type: "vf", q: "Pendant un test, on ne doit changer qu'une seule chose à la fois.", a: true, exp: "Oui : sinon on ne sait pas quel changement a produit l'effet observé." },
    { type: "qcm", q: "En quelle couche OSI se situe l'adresse IP et le routage ?", opts: ["Couche 1 (physique)", "Couche 2 (liaison)", "Couche 3 (réseau)", "Couche 7 (application)"], a: 2, exp: "IP et routage appartiennent à la couche 3 (réseau)." },
    { type: "input", q: "Comment nomme-t-on l'approche qui teste directement une couche du milieu (souvent avec un ping) pour cibler la moitié fautive ? (expression anglaise en trois mots)", a: ["divide and conquer", "divide et conquer", "diviser pour regner"], ph: "trois mots", exp: "Divide and conquer : on teste le milieu pour isoler la moitié concernée." },
    { type: "qcm", q: "La couche 2 (liaison) est associée à quel équipement et quelle adresse ?", opts: ["Le routeur et l'adresse IP", "Le switch et l'adresse MAC", "Le câble et le signal", "Le navigateur et l'URL"], a: 1, exp: "La couche 2 gère les trames, l'adresse MAC et le switch." },
    { type: "vf", q: "Un changement qui n'a rien résolu doit être annulé avant d'en tenter un autre.", a: true, exp: "Oui : on évite d'empiler des modifications parasites." },
    { type: "qcm", q: "Quelle est la toute première phase d'un dépannage propre ?", opts: ["Documenter", "Observer et reproduire le symptôme", "Redémarrer le routeur", "Changer le DNS"], a: 1, exp: "On commence par observer et reproduire précisément le symptôme." },
    { type: "input", q: "Quelle étape finale, souvent oubliée, consiste à noter symptôme, cause et solution ?", a: ["documenter", "la documentation", "documentation", "documenter le probleme"], ph: "un mot", exp: "La documentation clôture le dépannage et sert la prochaine fois." },
    { type: "vf", q: "La couche 7 du modèle OSI est la couche physique (les câbles).", a: false, exp: "Non : la couche 1 est physique ; la couche 7 est l'application." },
    { type: "qcm", q: "Un câble est fortement soupçonné. Quelle approche est la plus directe ?", opts: ["Top-down", "Bottom-up", "Ignorer le câble", "Réinstaller l'OS"], a: 1, exp: "Bottom-up part de la couche physique : parfait pour un câble suspect." },
    { type: "qcm", q: "Pourquoi documenter les pannes récurrentes ?", opts: ["Pour remplir des pages", "Parce qu'elles révèlent souvent un problème de fond à traiter", "Pour ralentir l'équipe", "Ce n'est pas utile"], a: 1, exp: "Une panne qui revient cache généralement une cause structurelle." },
    { type: "input", q: "Que signifie « bottom-up » en français (deux mots liés par « vers ») ?", a: ["du bas vers le haut", "de bas en haut", "bas vers haut"], ph: "du … vers le …", exp: "Bottom-up = du bas vers le haut, de la couche 1 vers la 7." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne approche",
    intro: `<p>Trois pannes arrivent le même matin. Pour chacune, tu dois choisir l'approche la plus efficace et justifier.</p>`,
    questions: [
      { type: "qcm", q: "Cas A : un PC n'affiche aucune adresse IP et sa LED de port est éteinte. Approche ?", opts: ["Top-down", "Bottom-up (partir du câble)", "Ne rien faire", "Changer de navigateur"], a: 1, exp: "Symptôme physique manifeste : bottom-up depuis la couche 1." },
      { type: "qcm", q: "Cas B : tout marche sauf UN site web précis. Approche ?", opts: ["Bottom-up", "Top-down (partir de l'application)", "Débrancher le switch", "Réinstaller Windows"], a: 1, exp: "Une seule application fautive : top-down est le plus rapide." },
      { type: "vf", q: "Cas C : symptôme flou. Un ping en couche 3 pour savoir dans quelle moitié se situe la panne relève du « divide and conquer ».", a: true, exp: "Oui : tester le milieu pour cibler la moitié concernée." },
      { type: "input", q: "Pendant un test, combien de paramètres modifie-t-on à la fois ?", a: ["un", "1", "un seul", "une seule chose"], ph: "un nombre", exp: "Un seul, pour attribuer l'effet à la bonne cause." },
      { type: "qcm", q: "La panne est réglée. Que reste-t-il à faire ?", opts: ["Rien", "Documenter symptôme, cause et solution", "Tout débrancher", "Recommencer au hasard"], a: 1, exp: "On documente pour capitaliser et repérer les récurrences." }
    ],
    solution: `<pre class="pseudo"># Recap des trois cas :
Cas A (LED eteinte, pas d'IP)  -&gt; BOTTOM-UP : couche 1 d'abord (cable)
Cas B (un seul site KO)        -&gt; TOP-DOWN : couche 7 d'abord (application)
Cas C (symptome flou)          -&gt; DIVIDE & CONQUER : ping couche 3, cibler la moitie
# Toujours : 1 modif a la fois -&gt; verifier -&gt; annuler si inutile -&gt; DOCUMENTER.</pre>
<p>La méthode compte plus que la vitesse : une enquête ordonnée trouve la cause et laisse une trace réutilisable.</p>`
  }
};
