  theory: `
<h3>1. La couche la plus basse</h3>
<p>Dans un réseau, les données finissent toujours par voyager sous forme physique : de l'électricité dans un fil de cuivre, de la lumière dans une fibre, ou des ondes radio dans l'air. C'est le rôle de la <strong>couche physique</strong> (<em>physical layer</em>), la couche 1 du modèle OSI. Elle ne s'occupe pas du sens des données, seulement de leur <strong>transport concret</strong> d'un point à un autre.</p>
<h3>2. Des bits aux signaux</h3>
<p>L'ordinateur ne manipule que des <strong>bits</strong> : des 0 et des 1. Pour les envoyer, il faut les transformer en un <strong>signal</strong> physique. C'est l'<strong>encodage</strong> (<em>encoding</em>). Par exemple, sur un câble cuivre, un 1 peut correspondre à une tension électrique et un 0 à une autre ; sur une fibre, un 1 correspond à une impulsion lumineuse et un 0 à son absence.</p>
<pre class="pseudo"># Idee generale de l'encodage :
Bits :     1     0     1     1     0
Cuivre :  haut  bas   haut  haut  bas   (niveaux de tension)
Fibre  :  ON    OFF   ON    ON    OFF   (lumiere allumee/eteinte)</pre>
<div class="tip">La couche physique se moque de savoir si les bits forment une photo ou un e-mail. Son travail : émettre et recevoir des 0 et des 1 fidèlement, aussi vite et loin que possible.</div>
<h3>3. Débit, bande passante et sens de transmission</h3>
<p>La <strong>bande passante</strong> (<em>bandwidth</em>) mesure la quantité de données par seconde, exprimée en bits par seconde (bit/s), kilobits (kbit/s), mégabits (Mbit/s), gigabits (Gbit/s). On distingue aussi le <strong>sens</strong> de transmission :</p>
<pre class="pseudo"># Modes de transmission :
Simplex      : un seul sens (ex. telecommande TV)
Half-duplex  : les deux sens, mais pas en meme temps (talkie-walkie)
Full-duplex  : les deux sens en meme temps (telephone)</pre>
<h3>4. Les ennemis du signal</h3>
<p>Un signal s'affaiblit avec la distance : c'est l'<strong>atténuation</strong>. Il peut aussi être perturbé par des sources électriques voisines : c'est le <strong>bruit</strong> ou les <strong>interférences</strong>. Ces phénomènes limitent la longueur des câbles et peuvent provoquer des erreurs. C'est pourquoi chaque support a une <strong>longueur maximale</strong> recommandée.</p>
<div class="warn">Dépasser la longueur maximale d'un câble (par exemple 100 m pour de la paire torsadée) dégrade le signal : erreurs, pertes, connexion instable. La couche physique impose des limites concrètes qu'il faut respecter.</div>
<h3>5. Le support : cuivre, fibre, air</h3>
<p>La couche physique regroupe trois grandes familles de <strong>supports</strong> (<em>media</em>) : le <strong>cuivre</strong> (câbles électriques), la <strong>fibre optique</strong> (lumière dans du verre) et le <strong>sans-fil</strong> (ondes radio). Chacun a ses forces : le cuivre est bon marché, la fibre va très loin et très vite, le sans-fil supprime les câbles. Tu les étudieras en détail dans les prochaines leçons.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Couche physique = couche 1 : transporte les bits sous forme de signaux

# Ennemis : attenuation (distance) et bruit (interferences)
