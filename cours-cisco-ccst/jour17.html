<script>
var DAY = {
  num: 17,
  title: "Les équipements : switch, routeur, point d'accès",
  subtitle: "Trois boîtes, trois métiers : qui fait quoi dans un réseau ?",
  theory: `
<h3>1. Trois équipements, trois rôles</h3>
<p>Un réseau, ce ne sont pas seulement des câbles : ce sont des <strong>équipements d'interconnexion</strong> qui décident où envoyer les données. Les trois plus courants sont le <strong>commutateur</strong> (en anglais <em>switch</em>), le <strong>routeur</strong> (<em>router</em>) et le <strong>point d'accès</strong> (<em>access point</em>, souvent abrégé AP). Chacun a un métier précis, et les confondre est l'erreur classique du débutant.</p>
<p>Une image simple : imagine un grand immeuble de bureaux. Le <strong>switch</strong> distribue le courrier <em>à l'intérieur</em> d'un même étage. Le <strong>routeur</strong> est le service postal qui relie ton immeuble <em>aux autres immeubles</em> de la ville. Le <strong>point d'accès</strong> est la porte sans fil par laquelle les visiteurs entrent dans l'immeuble sans avoir à brancher un câble.</p>
<h3>2. Le switch : relier les machines d'un même réseau local</h3>
<p>Le commutateur connecte entre eux les ordinateurs, imprimantes et serveurs d'un <strong>même réseau local</strong> (en anglais <em>LAN</em>, « Local Area Network »). Il possède beaucoup de prises (des <strong>ports</strong>) et il travaille au <strong>niveau 2</strong> du modèle OSI, avec les <strong>adresses MAC</strong>. Quand une machine parle, le switch sait exactement à quel port se trouve le destinataire et envoie la trame uniquement là, sans déranger les autres.</p>
<div class="tip">Retiens : le switch travaille en <strong>couche 2</strong> (liaison de données) et se repère grâce aux <strong>adresses MAC</strong>. Il relie des machines <em>du même réseau</em>.</div>
<h3>3. Le routeur : relier des réseaux différents</h3>
<p>Le routeur, lui, fait communiquer des <strong>réseaux différents</strong> entre eux — par exemple ton réseau maison et Internet. Il travaille au <strong>niveau 3</strong> du modèle OSI, avec les <strong>adresses IP</strong>. C'est lui qui sert de <strong>passerelle</strong> (en anglais <em>gateway</em>) : la porte de sortie par laquelle tes données quittent le réseau local pour aller ailleurs. Sans routeur, ton LAN serait une île isolée.</p>
<pre class="pseudo"># Qui utilise quelle adresse ?
Switch  -> couche 2 -> adresses MAC  -> relie des machines d'un meme reseau
Routeur -> couche 3 -> adresses IP   -> relie des reseaux differents</pre>
<h3>4. Le point d'accès : le réseau sans fil</h3>
<p>Le point d'accès (AP) transforme un réseau filaire en réseau <strong>sans fil</strong> (le <strong>Wi-Fi</strong>). Il ne remplace pas le switch ni le routeur : il ajoute une porte d'entrée radio. Les téléphones et portables se connectent à l'AP par les ondes ; l'AP, lui, est relié au reste du réseau par un câble. Dans une box Internet domestique, ces trois fonctions (switch, routeur, point d'accès) sont souvent réunies dans un <strong>seul boîtier</strong>, ce qui explique la confusion fréquente.</p>
<div class="warn">Piège d'examen : une box « tout-en-un » cumule plusieurs rôles, mais ce sont bien <strong>trois fonctions distinctes</strong>. On te demandera le rôle de chacune séparément, pas celui du boîtier.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Switch (commutateur) : couche 2, adresses MAC
#   -> relie les machines d'UN MEME reseau local (LAN)
# Routeur : couche 3, adresses IP, sert de PASSERELLE
#   -> relie des reseaux DIFFERENTS (ex : LAN <-> Internet)
# Point d'acces (AP) : ajoute le sans-fil (Wi-Fi)
#   -> relie par les ondes, cable vers le reste du reseau</pre>`,
  exercises: [
    { type: "qcm", q: "Quel équipement relie les machines d'un même réseau local ?", opts: ["Le routeur", "Le commutateur (switch)", "Le point d'accès", "Le modem"], a: 1, exp: "Le switch relie les machines d'un même LAN, en couche 2." },
    { type: "qcm", q: "Quel équipement relie des réseaux différents entre eux ?", opts: ["Le switch", "Le routeur", "Le point d'accès", "Le câble Ethernet"], a: 1, exp: "Le routeur interconnecte des réseaux différents, en couche 3." },
    { type: "qcm", q: "À quel niveau (couche OSI) travaille un switch ?", opts: ["Couche 1", "Couche 2", "Couche 3", "Couche 7"], a: 1, exp: "Le switch travaille en couche 2 (liaison), avec les adresses MAC." },
    { type: "qcm", q: "Quel type d'adresse le routeur utilise-t-il pour décider ?", opts: ["L'adresse MAC", "L'adresse IP", "Le numéro de port USB", "Le nom d'hôte"], a: 1, exp: "Le routeur travaille en couche 3 avec les adresses IP." },
    { type: "qcm", q: "Quel équipement ajoute la connexion sans fil (Wi-Fi) ?", opts: ["Le switch", "Le routeur", "Le point d'accès", "Le pare-feu"], a: 2, exp: "Le point d'accès (AP) fournit l'accès sans fil au réseau." },
    { type: "qcm", q: "Comment appelle-t-on la porte de sortie d'un réseau local vers l'extérieur ?", opts: ["Le proxy", "La passerelle (gateway)", "Le hub", "Le DNS"], a: 1, exp: "Le routeur sert de passerelle (gateway) vers les autres réseaux." },
    { type: "vf", q: "Le switch et le routeur font exactement le même travail.", a: false, exp: "Non : le switch relie un même réseau (couche 2), le routeur relie des réseaux différents (couche 3)." },
    { type: "vf", q: "Un point d'accès sert à connecter des appareils sans câble.", a: true, exp: "Oui : l'AP fournit la connexion sans fil (Wi-Fi)." },
    { type: "vf", q: "Une box Internet domestique peut réunir switch, routeur et point d'accès dans un seul boîtier.", a: true, exp: "Oui : ces trois fonctions y sont souvent regroupées." },
    { type: "vf", q: "Le routeur utilise les adresses MAC pour relier des réseaux différents.", a: false, exp: "Non : le routeur utilise les adresses IP (couche 3). Ce sont les MAC qui servent en couche 2." },
    { type: "input", q: "Quel équipement (un mot) utilise les adresses MAC pour relier les machines d'un même LAN ?", a: ["switch", "commutateur", "le switch", "le commutateur"], ph: "un mot", exp: "Le switch (commutateur) travaille en couche 2 avec les adresses MAC." },
    { type: "input", q: "Quel équipement (un mot) relie des réseaux différents en couche 3 ?", a: ["routeur", "le routeur", "router"], ph: "un mot", exp: "Le routeur interconnecte des réseaux différents grâce aux adresses IP." },
    { type: "input", q: "Sigle anglais (3 lettres) désignant un réseau local ?", a: ["lan"], ph: "3 lettres", exp: "LAN = Local Area Network, un réseau local." },
    { type: "input", q: "Comment appelle-t-on (en français) la porte de sortie d'un LAN vers d'autres réseaux ?", a: ["passerelle", "la passerelle", "gateway", "passerelle par defaut"], ph: "un mot", exp: "La passerelle (gateway) est fournie par le routeur." },
    { type: "input", q: "Abréviation anglaise (2 lettres) d'un point d'accès sans fil ?", a: ["ap"], ph: "2 lettres", exp: "AP = Access Point, le point d'accès." }
  ],
  final: {
    title: "Exercice final — Choisir le bon équipement",
    intro: `<p>Dans une petite entreprise, 10 ordinateurs et 2 imprimantes doivent communiquer entre eux, se connecter à Internet, et les employés veulent aussi utiliser leurs téléphones sans câble. Aide le technicien à attribuer le bon rôle à chaque équipement.</p>`,
    questions: [
      { type: "qcm", q: "Pour relier les 10 ordinateurs et les imprimantes du bureau entre eux, il faut…", opts: ["Un routeur", "Un commutateur (switch)", "Un point d'accès seul", "Un modem"], a: 1, exp: "Le switch relie les machines du même réseau local." },
      { type: "qcm", q: "Pour connecter tout ce réseau à Internet, il faut…", opts: ["Un switch", "Un routeur", "Un hub", "Un câble plus long"], a: 1, exp: "Le routeur relie le LAN à Internet et sert de passerelle." },
      { type: "qcm", q: "Pour que les téléphones se connectent sans câble, il faut…", opts: ["Un switch", "Un point d'accès (Wi-Fi)", "Un routeur supplémentaire", "Un pare-feu"], a: 1, exp: "Le point d'accès fournit l'accès sans fil." },
      { type: "vf", q: "Le switch, ici, décide en regardant les adresses MAC des trames.", a: true, exp: "Oui : le switch travaille en couche 2 avec les adresses MAC." },
      { type: "qcm", q: "L'adresse de la passerelle par défaut des ordinateurs correspond à…", opts: ["L'adresse du switch", "L'adresse IP du routeur", "L'adresse MAC de l'imprimante", "L'adresse du point d'accès"], a: 1, exp: "La passerelle par défaut est l'adresse IP du routeur, porte de sortie du LAN." }
    ],
    solution: `<pre class="pseudo"># Attribution des roles :
Switch  -> relie les 10 PC + imprimantes (meme LAN, couche 2, MAC)
Routeur -> relie le LAN a Internet (couche 3, IP) = passerelle
Point d'acces -> ajoute le Wi-Fi pour les telephones
# La passerelle par defaut des PC = l'adresse IP du routeur.</pre>
<p>Chaque équipement a son métier. Demain, on plonge dans le détail du commutateur et de sa fameuse table MAC.</p>`
  }
};
</script>
