<script>
var DAY = {
  num: 18,
  title: "API JSON avec Laravel",
  subtitle: "Servir des données brutes aux applications mobiles et au JavaScript.",
  theory: `
<h3>1. Site web vs API</h3>
<p>Jusqu'ici, Laravel renvoyait du HTML pour un humain. Une <strong>API</strong> (<em>Application Programming Interface</em>, « interface de programmation ») renvoie des <strong>données brutes en JSON</strong> (le format d'échange vu à la leçon 15 de PHP : du texte structuré en <code>{ "clé": "valeur" }</code>) destinées à un programme : application mobile, JavaScript, autre serveur… Même framework, autre type de réponse.</p>
<h3>2. routes/api.php</h3>
<p>Les routes d'API vivent dans <code>routes/api.php</code>, automatiquement préfixées par <code>/api</code>. Grosse différence : pas de session ni de CSRF (les API sont <strong>sans état</strong> — chaque requête se suffit à elle-même, le serveur ne « se souvient » de rien entre deux appels) ; l'authentification passera par des <em>jetons</em>.</p>
<pre class="pseudo">// routes/api.php
Route::get('/signatures', [ApiSignatureController::class, 'index']);   // route d'API : liste des signatures
// accessible sur : http://localhost:8000/api/signatures               // note le prefixe /api ajoute automatiquement</pre>
<h3>3. Renvoyer du JSON : automatique !</h3>
<pre class="pseudo">public function index()
{
    return Signature::all();      // renvoyer une Collection = JSON automatique !
}

public function show(int $id)
{
    return Signature::findOrFail($id);   // renvoyer un modele = JSON automatique (404 JSON si absent)
}</pre>
<p>Renvoyer un modèle ou une Collection = réponse JSON automatique, avec le bon en-tête <code>Content-Type: application/json</code> (l'en-tête qui annonce le format du contenu). Le <code>json_encode</code> de la leçon 15 de PHP travaille en coulisses.</p>
<h3>4. Maîtriser le code de statut</h3>
<pre class="pseudo">public function store(Request $request)
{
    $valides = $request->validate([                       // valide les champs
        'auteur' => 'required|max:100', 'contenu' => 'required|min:5',
    ]);
    $signature = Signature::create($valides);             // cree la signature

    return response()->json($signature, 201);   // renvoie le JSON avec le code 201 (Created = cree)
}

public function destroy(int $id)
{
    Signature::findOrFail($id)->delete();        // supprime (404 si absent)
    return response()->noContent();              // renvoie le code 204 (No Content = rien a renvoyer)
}</pre>
<p>Un <strong>code de statut</strong> HTTP résume le sort de la requête. Les codes à connaître : <strong>200</strong> OK, <strong>201</strong> créé, <strong>204</strong> pas de contenu, <strong>404</strong> introuvable, <strong>422</strong> données invalides, <strong>401</strong>/<strong>403</strong> authentification/droit.</p>
<h3>5. Validation en mode API : le 422</h3>
<p>Bonus élégant : quand la requête demande du JSON (en-tête <code>Accept: application/json</code>), un échec de <code>validate()</code> ne redirige plus — Laravel renvoie un <strong>422 Unprocessable Entity</strong> avec le détail des erreurs en JSON. Le même code de contrôleur sert les deux mondes !</p>
<pre class="pseudo"># Tester avec curl (un client HTTP en ligne de commande, pour appeler l'API sans navigateur) :
# -X POST = methode POST ; -H = ajoute un en-tete ; -d = donnees envoyees ; le \ prolonge la commande sur la ligne suivante
curl -X POST http://localhost:8000/api/signatures \\
     -H "Content-Type: application/json" -H "Accept: application/json" \\
     -d '{"auteur":"Aurélia","contenu":"Via l API !"}'</pre>
<div class="warn">findOrFail dans une route API renvoie bien un 404 JSON (pas une page HTML) si le client envoie l'en-tête Accept: application/json. Toujours inclure cet en-tête dans les tests.</div>
<div class="tip">Convention REST : les URL désignent des RESSOURCES (noms au pluriel : /api/signatures), les verbes HTTP portent l'ACTION (GET lire, POST créer, PUT/PATCH modifier, DELETE supprimer). Jamais /api/getSignatures !</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence fondamentale entre un site web et une API ?", opts: ["L'API est plus rapide", "Le site renvoie du HTML pour un humain ; l'API des données (JSON) pour un programme", "L'API n'utilise pas HTTP", "Le site n'a pas de routes"], a: 1, exp: "Mêmes routes, contrôleurs et modèles — seule la réponse change." },
    { type: "qcm", q: "Où déclare-t-on les routes d'API ?", opts: ["routes/web.php", "routes/api.php, préfixées automatiquement par /api", "app/api.php", "config/api.php"], a: 1, exp: "Route::get('/signatures') dans api.php → /api/signatures." },
    { type: "qcm", q: "Que se passe-t-il quand un contrôleur retourne Signature::all() sur une route API ?", opts: ["Erreur : il faut une vue", "Laravel sérialise automatiquement la Collection en JSON", "Le navigateur télécharge un fichier", "Rien"], a: 1, exp: "Modèles et Collections deviennent du JSON sans effort." },
    { type: "qcm", q: "Quel code HTTP après une création réussie ?", opts: ["200", "201 Created", "204", "301"], a: 1, exp: "201 = « ressource créée » ; on renvoie aussi la ressource." },
    { type: "qcm", q: "Quel code après une suppression réussie sans corps de réponse ?", opts: ["201", "204 No Content", "404", "500"], a: 1, exp: "response()->noContent() : tout est dit dans le code." },
    { type: "qcm", q: "Quel code pour des données invalides envoyées à une API ?", opts: ["404", "422 Unprocessable Entity", "419", "302"], a: 1, exp: "Avec le détail des erreurs de validation en JSON." },
    { type: "qcm", q: "Un client API envoie Accept: application/json et la validation échoue. Que fait Laravel ?", opts: ["Redirige vers le formulaire", "Renvoie un 422 avec les erreurs en JSON — pas de redirection", "Renvoie du HTML", "Ignore l'erreur"], a: 1, exp: "Le même validate() s'adapte au type de client. Élégant." },
    { type: "qcm", q: "Pourquoi les routes API n'ont-elles pas de protection CSRF ?", opts: ["Oubli de Laravel", "Pas de session ni de cookies : le CSRF ne s'applique pas ; l'auth passera par jetons", "Le CSRF est payant", "Elles en ont une"], a: 1, exp: "Le CSRF exploite les cookies de session ; une API sans état n'en a pas." },
    { type: "qcm", q: "Convention REST : quelle URL pour lire la signature n°5 ?", opts: ["GET /api/getSignature?id=5", "GET /api/signatures/5", "POST /api/signature/read/5", "GET /api/signature-cinq"], a: 1, exp: "Ressource au pluriel + id ; le verbe HTTP porte l'action." },
    { type: "qcm", q: "Convention REST : comment supprimer la signature n°5 ?", opts: ["GET /api/signatures/delete/5", "DELETE /api/signatures/5", "POST /api/removeSignature", "PUT /api/signatures?remove=5"], a: 1, exp: "Le verbe DELETE existe pleinement côté API (pas de formulaire HTML à contourner)." },
    { type: "qcm", q: "Que renvoie GET /api/signatures/999 (id inexistant) avec findOrFail et Accept: application/json ?", opts: ["Une page HTML 404", "{\"message\": \"...\"} avec le statut 404", "null avec 200", "Une exception à l'écran"], a: 1, exp: "Le 404 s'exprime en JSON pour les clients API." },
    { type: "qcm", q: "Quel outil en ligne de commande permet de tester une API ?", opts: ["curl (ou des outils comme Postman)", "phpMyAdmin", "Blade", "Git"], a: 0, exp: "curl -X POST ... : indispensable pour tester sans navigateur." },
    { type: "qcm", q: "Quelle fonction PHP (leçon 15 du cours PHP) travaille en coulisses quand Laravel sérialise en JSON ?", opts: ["serialize()", "json_encode()", "var_dump()", "implode()"], a: 1, exp: "Les fondamentaux ne disparaissent pas : ils s'automatisent." },
    { type: "vf", q: "Une API Laravel peut servir à la fois une application mobile et du JavaScript dans le navigateur.", a: true, exp: "C'est même son intérêt principal : un seul back-end, plusieurs clients." },
    { type: "vf", q: "En REST, l'URL /api/signatures/creerNouvelle est une bonne conception.", a: false, exp: "L'action est portée par le verbe (POST /api/signatures), pas par l'URL." }
  ],
  final: {
    title: "Exercice final — L'API du livre d'or en action",
    intro: `<p>Session de test de l'API avec curl. Chaque bloc = une commande envoyee puis la reponse JSON recue :</p>
<pre class="pseudo">$ curl -H "Accept: application/json" http://localhost:8000/api/signatures/2   # GET : on demande la signature n°2 en JSON
{"id":2,"auteur":"Marc","contenu":"Superbe !","created_at":"2026-07-01T10:00:00Z"}   # reponse 200 : la ressource en JSON

# POST : on cree une signature, mais on OUBLIE le champ "contenu" (\ = commande sur plusieurs lignes)
$ curl -X POST http://localhost:8000/api/signatures \\
       -H "Content-Type: application/json" -H "Accept: application/json" \\
       -d '{"auteur":"Léa"}'
{"message":"The contenu field is required.",                    # reponse 422 : echec de validation...
 "errors":{"contenu":["The contenu field is required."]}}       # ...detail des erreurs par champ

# DELETE : on tente de supprimer une signature qui n'existe pas (id 999)
$ curl -X DELETE -H "Accept: application/json" \\
       http://localhost:8000/api/signatures/999
{"message":"No query results for model [App\\\\Models\\\\Signature] 999"}   # reponse 404 : findOrFail n'a rien trouve</pre>`,
    questions: [
      { type: "qcm", q: "Quel statut HTTP accompagne la première réponse ?", opts: ["201", "200 OK : lecture réussie", "204", "404"], a: 1, exp: "GET réussi = 200, avec la ressource en JSON." },
      { type: "qcm", q: "Quel statut accompagne la deuxième réponse (contenu manquant) ?", opts: ["200", "422 : échec de validation, détail dans errors", "419", "500"], a: 1, exp: "Le format d'erreur standard de Laravel : message + errors par champ." },
      { type: "qcm", q: "Et la troisième (id 999) ?", opts: ["404 Not Found, produit par findOrFail", "422", "204", "403"], a: 0, exp: "findOrFail → ModelNotFoundException → 404 JSON." },
      { type: "qcm", q: "Pourquoi la deuxième requête n'a-t-elle PAS créé de signature partielle ?", opts: ["Le réseau a coupé", "validate() interrompt avant le create : aucune donnée invalide n'atteint la base", "La base était pleine", "curl bloque les POST"], a: 1, exp: "La validation est un portail : rien ne passe à moitié." },
      { type: "qcm", q: "Une application mobile Android veut afficher le livre d'or. Que consomme-t-elle ?", opts: ["Les vues Blade", "GET /api/signatures : le JSON, qu'elle met en forme elle-même", "Le fichier .env", "La base directement"], a: 1, exp: "L'API découple les données de leur présentation." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 18 :
// 1. routes/api.php : prefixe /api, pas de session/CSRF.
// 2. return Modele::all()  ->  JSON automatique.
// 3. Codes : 200 lu, 201 cree, 204 supprime, 404 introuvable,
//    422 invalide, 401/403 auth/droits.
// 4. validate() renvoie du 422 JSON aux clients API : meme code, deux mondes.
// 5. REST : ressources au pluriel dans l'URL, action dans le verbe HTTP.</pre>
<p>Reste à peaufiner l'expérience : pagination des longues listes, journaux, et les bonnes pratiques de la maison. Demain !</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Laravel ici…",
  items: [
  { id: "laravel-api-membres", title: "L'API des membres", level: 3,
    statement: "Écris le contrôleur d'API des membres : <code>index()</code> renvoie tous les membres actifs (JSON) ; <code>store(Request $request)</code> valide <code>pseudo</code> (obligatoire, max 50, unique dans membres) et <code>age</code> (obligatoire, entier), crée le membre et le renvoie avec le statut 201 ; <code>destroy(int $id)</code> supprime (404 automatique si absent) et renvoie un 204. Ajoute les trois routes dans <code>routes/api.php</code>.",
    atoi: {cmd: "# serveur demarre :\ncurl -i http://localhost:8000/api/membres\ncurl -i -X POST http://localhost:8000/api/membres \\\n     -H \"Accept: application/json\" -d \"pseudo=Zoe&age=30\"\ncurl -i -X DELETE http://localhost:8000/api/membres/1", expected: "GET /api/membres -> HTTP 200, corps JSON : tableau des membres actifs.\nPOST valide -> HTTP 201 Created, corps JSON du membre cree (avec son id).\nPOST avec pseudo deja pris ou age manquant -> HTTP 422 + erreurs en JSON.\nDELETE d'un id existant -> HTTP 204 No Content (corps vide) ;\nid absent -> HTTP 404 JSON (findOrFail)."},
    checklist: ["index() renvoie-t-il Membre::where('actif', true)->get() (JSON auto) ?", "store() valide-t-il pseudo (max:50, unique:membres,pseudo) et age (integer) ?", "store() renvoie-t-il response()->json($membre, 201) ?", "destroy() fait-il findOrFail($id)->delete() puis response()->noContent() (204) ?"],
    hints: [
      "index : return Membre::where('actif', true)->get(); — le JSON est automatique.",
      "store : response()->json($membre, 201) pour maîtriser le statut.",
      "destroy : findOrFail($id)->delete(); puis return response()->noContent();"
    ],
    solution: "// app/Http/Controllers/Api/MembreController.php\npublic function index()\n{\n    return Membre::where('actif', true)->get();   // → JSON 200 automatique\n}\n\npublic function store(Request $request)\n{\n    $valides = $request->validate([\n        'pseudo' => 'required|string|max:50|unique:membres,pseudo',\n        'age'    => 'required|integer',\n    ]);\n\n    $membre = Membre::create($valides);\n    return response()->json($membre, 201);        // 201 Created + la ressource\n}\n\npublic function destroy(int $id)\n{\n    Membre::findOrFail($id)->delete();             // 404 JSON si absent\n    return response()->noContent();                // 204 : rien à dire de plus\n}\n\n// routes/api.php\nRoute::get('/membres',        [MembreController::class, 'index']);\nRoute::post('/membres',       [MembreController::class, 'store']);\nRoute::delete('/membres/{id}',[MembreController::class, 'destroy']);",
    note: "Compare avec le contrôleur web de la leçon 13 : la logique est identique, seules les réponses changent (JSON/statuts au lieu de redirections/flash)." }
  ]
};
