var DAY = {
  num: 14,
  title: "Configuration : .env et les environnements",
  subtitle: "Le même code partout, une configuration par machine.",
  theory: `
<h3>1. Le principe : code ≠ configuration</h3>
<p>Un <strong>environnement</strong> est le lieu où tourne ton application : ta machine (développement), celle du collègue, le serveur de test, la production (le site réel, en ligne pour les vrais visiteurs). Le CODE est identique partout ; ce qui change (base de données, mots de passe, mode debug), c'est la <strong>configuration</strong>. Elle vit dans le fichier <code>.env</code> (« environment »), propre à chaque machine. Chaque ligne est une paire <code>CLE=valeur</code>.</p>
<pre class="pseudo">APP_NAME="Livre d'or"                    # nom de l'application
APP_ENV=local                            # environnement : local, staging (test) ou production
APP_DEBUG=true                           # true = pages d'erreur detaillees (a mettre false en prod)
APP_URL=http://localhost:8000            # adresse de base du site

DB_CONNECTION=sqlite                     # moteur de base de donnees utilise
MAIL_MAILER=log                          # en dev : les emails vont dans les logs au lieu d'etre envoyes</pre>
<h3>2. .env, .env.example et Git</h3>
<p><strong>Git</strong> est l'outil qui garde l'historique du code et le partage entre développeurs. Un fichier listé dans <code>.gitignore</code> est ignoré par Git (non partagé).</p>
<ul>
<li><code>.env</code> : TA configuration, avec les vrais secrets → <strong>jamais sur Git</strong> (il est dans .gitignore par défaut).</li>
<li><code>.env.example</code> : le modèle SANS secrets, versionné (partagé) → le collègue le copie en .env et le remplit.</li>
</ul>
<h3>3. config() : la bonne façon de lire</h3>
<p>Les fichiers du dossier <code>config/</code> (app.php, database.php…) lisent le .env avec <code>env('CLE', 'défaut')</code> et exposent des valeurs organisées. Dans TON code, on lit la config, pas le .env :</p>
<pre class="pseudo">config('app.name');       // lit la valeur "name" du fichier config/app.php -> « Livre d'or »
config('app.env');        // lit "env" du meme fichier -> « local »
// Regle d'or : env() UNIQUEMENT dans les fichiers config/,
// config() partout ailleurs (controleurs, vues, modeles...).</pre>
<p>Pourquoi ? En production, on lance <code>php artisan config:cache</code> : toute la config est compilée en un fichier ultra-rapide… et <code>env()</code> cesse alors de fonctionner ailleurs que dans <code>config/</code>.</p>
<h3>4. Ta propre configuration</h3>
<pre class="pseudo"># .env
LIVREDOR_MAX_SIGNATURES=100                          # ta cle personnalisee dans le .env

// config/livredor.php
return [                                             // ce fichier renvoie un tableau de config
    'max_signatures' => env('LIVREDOR_MAX_SIGNATURES', 50),   // lit la cle .env ; 50 par defaut si absente
];                                                   // fin du tableau

// Partout dans le code :
config('livredor.max_signatures');   // lit livredor.php -> cle "max_signatures" (ici 100)</pre>
<h3>5. Les caches d'Artisan</h3>
<pre class="pseudo">php artisan config:cache    # compile la config en un fichier rapide (a faire en production)
php artisan config:clear    # vide ce cache (si la config semble "figee" apres modification du .env)
php artisan route:cache     # compile les routes (production)
php artisan cache:clear     # vide le cache applicatif general</pre>
<div class="warn">Symptôme classique : tu modifies .env mais rien ne change. Cause : un config:cache traîne. Remède : <code>php artisan config:clear</code>.</div>
<div class="tip">MAIL_MAILER=log en développement : les emails « envoyés » sont simplement écrits dans le fichier de log. Tu testes tout le circuit d'envoi sans spammer personne.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi séparer code et configuration ?", opts: ["Pour faire joli", "Le même code tourne partout ; seule la config change selon la machine/environnement", "Pour ralentir Git", "C'est une contrainte de PHP"], a: 1, exp: "Dév, test, prod : un seul code, des .env différents." },
    { type: "qcm", q: "Quels environnements typiques une application traverse-t-elle ?", opts: ["local (dev), staging (test), production", "Windows, Mac, Linux", "Chrome, Firefox", "Matin, midi, soir"], a: 0, exp: "APP_ENV les identifie." },
    { type: "qcm", q: "Pourquoi .env est-il exclu de Git ?", opts: ["Il est trop lourd", "Il contient des secrets (mots de passe, clés) et diffère par machine", "Git ne supporte pas les .env", "Pour la vitesse"], a: 1, exp: "Un mot de passe dans Git = un mot de passe public à jamais (l'historique n'oublie pas)." },
    { type: "qcm", q: "À quoi sert .env.example ?", opts: ["Une sauvegarde", "Le modèle versionné SANS secrets : chaque développeur le copie en .env", "Un fichier de test", "L'ancienne config"], a: 1, exp: "Il documente les clés nécessaires sans exposer les valeurs." },
    { type: "qcm", q: "Où a-t-on le droit d'appeler env() ?", opts: ["Partout", "Uniquement dans les fichiers du dossier config/", "Dans les vues", "Dans les contrôleurs seulement"], a: 1, exp: "Ailleurs, config:cache la rendrait silencieusement null en production." },
    { type: "qcm", q: "Comment lire le nom de l'application dans un contrôleur ?", opts: ["env('APP_NAME')", "config('app.name')", "$_ENV directement", "getenv() partout"], a: 1, exp: "config() lit la configuration organisée — compatible avec le cache." },
    { type: "input", q: "Quelle commande compile la configuration pour la production ?", a: ["php artisan config:cache", "artisan config:cache"], ph: "commande", exp: "config:cache — et config:clear pour revenir en arrière." },
    { type: "qcm", q: "Tu modifies .env mais l'application ignore le changement. Diagnostic probable ?", opts: ["PHP est cassé", "Un config:cache est actif : lance php artisan config:clear", "Le .env est en lecture seule", "Il faut redémarrer Windows"], a: 1, exp: "Le cache fige la config : symptôme ultra-classique." },
    { type: "qcm", q: "Que fait MAIL_MAILER=log ?", opts: ["Désactive les emails", "Écrit les emails dans le fichier de log au lieu de les envoyer : idéal en dev", "Envoie les logs par email", "Chiffre les emails"], a: 1, exp: "On teste le circuit complet sans envoyer un seul vrai message." },
    { type: "qcm", q: "Comment créer une config personnalisée max_signatures proprement ?", opts: ["La coder en dur", "Clé dans .env + fichier config/livredor.php avec env() + lecture via config('livredor.max_signatures')", "Une variable globale", "Un cookie"], a: 1, exp: "Le circuit complet .env → config/ → config()." },
    { type: "qcm", q: "Quelles valeurs de APP_ENV et APP_DEBUG pour la production ?", opts: ["production et false", "local et true", "production et true", "debug et on"], a: 0, exp: "Le duo de la mise en ligne sérieuse." },
    { type: "qcm", q: "Un mot de passe a été poussé sur Git par erreur puis retiré au commit suivant. Est-il en sécurité ?", opts: ["Oui, il a été retiré", "Non : l'historique Git le conserve ; il faut CHANGER le mot de passe", "Oui, si le repo est privé", "Oui, Git chiffre tout"], a: 1, exp: "Un secret exposé est un secret grillé : rotation obligatoire." },
    { type: "qcm", q: "Où sont lues les variables DB_* du .env ?", opts: ["Dans routes/web.php", "Dans config/database.php, qui alimente Eloquent", "Dans les vues", "Dans composer.json"], a: 1, exp: "Chaque fichier de config/ organise sa partie du .env." },
    { type: "vf", q: "Le fichier .env.example doit contenir les vrais mots de passe pour aider les collègues.", a: false, exp: "Surtout pas : il liste les CLÉS, avec des valeurs vides ou factices." },
    { type: "vf", q: "Avec config('livredor.max_signatures'), la valeur par défaut définie dans config/livredor.php est utilisée si la clé .env est absente.", a: true, exp: "env('CLE', 50) : le second argument prend le relais." }
  ],
  final: {
    title: "Exercice final — Préparer la mise en production",
    intro: `<p>Le livre d'or part en production. Compare les deux .env (colonne de gauche : dev ; colonne de droite : prod) :</p>
<pre class="pseudo"># --- .env de developpement ---     # --- .env de production ---   (le code est IDENTIQUE, seule la config change)
APP_ENV=local                        APP_ENV=production            # nom de l'environnement
APP_DEBUG=true                       APP_DEBUG=false               # detail des erreurs : ON en dev, OFF en prod
DB_CONNECTION=sqlite                 DB_CONNECTION=mysql           # SQLite (fichier) en dev, MySQL (serveur) en prod
MAIL_MAILER=log                      DB_HOST=10.0.0.5              # dev : emails dans les logs / prod : adresse du serveur BDD
                                     DB_PASSWORD=s3cr3t!           # (prod) mot de passe de la base : un secret !
                                     MAIL_MAILER=smtp              # (prod) vrais envois d'email via SMTP</pre>`,
    questions: [
      { type: "qcm", q: "Le code de l'application diffère-t-il entre les deux machines ?", opts: ["Oui, deux versions", "Non : même code, seule la configuration change", "Oui, la prod est compilée", "Impossible à dire"], a: 1, exp: "C'est tout le principe : le .env absorbe les différences." },
      { type: "qcm", q: "Pourquoi APP_DEBUG=false en production ?", opts: ["Pour la vitesse uniquement", "Les pages d'erreur détaillées révéleraient code et secrets aux visiteurs", "Le debug est payant", "Question de mode"], a: 1, exp: "Détails → logs ; visiteurs → page neutre." },
      { type: "qcm", q: "Le DB_PASSWORD de production doit-il apparaître dans .env.example ?", opts: ["Oui, pour la documentation", "Non : .env.example est versionné, donc public pour l'équipe — clés oui, secrets non", "Oui, chiffré", "Peu importe"], a: 1, exp: "DB_PASSWORD= (vide) dans l'exemple suffit." },
      { type: "qcm", q: "En dev, un email de bienvenue est « envoyé ». Où finit-il ?", opts: ["Dans la boîte du visiteur", "Dans le fichier de log, grâce à MAIL_MAILER=log", "Nulle part", "Dans le spam"], a: 1, exp: "On lit le log pour vérifier contenu et destinataire — zéro envoi réel." },
      { type: "qcm", q: "Après le déploiement, quelle commande accélère la lecture de la config en prod ?", opts: ["php artisan config:cache", "php artisan serve", "composer update", "php artisan migrate:fresh"], a: 0, exp: "Et surtout pas migrate:fresh, qui détruirait les données !" }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 14 :
// 1. Code identique partout ; .env different par machine/environnement.
// 2. .env = secrets, hors Git ; .env.example = modele versionne sans secrets.
// 3. env() SEULEMENT dans config/ ; config('fichier.cle') partout ailleurs.
// 4. Prod : APP_ENV=production, APP_DEBUG=false, config:cache.
// 5. .env modifie sans effet ?  ->  php artisan config:clear.</pre>
<p>Fin de la semaine 2 : tes données sont structurées, validées, configurables. Semaine 3 : prouver que ça marche (tests), protéger (auth), livrer.</p>`
  }
};
