<!DOCTYPE html>
<html lang="fr">
<head>

<title>Leçon 4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 4,
  title: "Blade : les vues et les layouts",
  subtitle: "Fini le HTML mélangé au PHP : place aux templates propres.",
  theory: `
<h3>1. Le problème du PHP mélangé</h3>
<p>Au cours PHP, tes pages mélangeaient logique et HTML : <code>&lt;?php if (...) { ?&gt;&lt;p&gt;...&lt;/p&gt;&lt;?php } ?&gt;</code>. Ça marche, mais c'est illisible. Une <strong>vue</strong> (en anglais <em>view</em>) est le morceau chargé d'<em>afficher</em> les données — la page que verra le visiteur. Un <strong>moteur de templates</strong> est un outil qui remplit des pages « à trous » avec des données. Un <strong>template</strong> est justement ce modèle de page à trous. <strong>Blade</strong>, le moteur de templates de Laravel, sépare proprement les rôles : le contrôleur prépare les données, la vue les affiche. Image : le cuisinier (contrôleur) prépare le plat, le serveur (vue) le présente joliment à table.</p>
<h3>2. Créer et afficher une vue</h3>
<p>Une vue est un fichier rangé dans <code>resources/views/</code>, par exemple <code>accueil.blade.php</code> :</p>
<pre class="pseudo">&lt;h1&gt;Bienvenue sur le livre d'or&lt;/h1&gt;      {{-- titre principal de la page (balise h1) --}}
&lt;p&gt;Laisse un message à la famille !&lt;/p&gt;   {{-- paragraphe d'invitation (balise p) --}}</pre>
<p>Le contrôleur l'affiche avec <code>return view('accueil');</code>. Pour une vue dans un sous-dossier <code>resources/views/messages/index.blade.php</code>, on écrit <code>view('messages.index')</code> — le point remplace la barre oblique, et l'on n'écrit jamais l'extension <code>.blade.php</code>.</p>
<h3>3. Afficher des variables : {{ }}</h3>
<pre class="pseudo">&lt;p&gt;Bonjour {{ $nom }} !&lt;/p&gt;   {{-- {{ $nom }} affiche le contenu de la variable $nom, en toute securite --}}</pre>
<p>Les doubles accolades <code>{{ }}</code> affichent la variable <strong>en échappant automatiquement le HTML</strong> : « échapper » signifie transformer les caractères dangereux comme <code>&lt;</code> ou <code>&gt;</code> en texte inoffensif. C'est l'équivalent du <code>htmlspecialchars()</code> que tu appelais à la main à la leçon 13 de PHP. Cela bloque les attaques <strong>XSS</strong> (<em>Cross-Site Scripting</em> : un visiteur qui glisse du code malveillant dans un champ). Protection gratuite et systématique !</p>
<h3>4. Le layout : hériter d'un squelette commun</h3>
<p>Toutes tes pages partagent le même en-tête, menu et pied de page. Un <strong>layout</strong> (« gabarit », « squelette ») est une page-modèle qu'on écrit UNE seule fois dans <code>resources/views/layout.blade.php</code>. Les mots commençant par <code>@</code> sont des <strong>directives Blade</strong> : des instructions spéciales adressées au moteur.</p>
<pre class="pseudo">&lt;!DOCTYPE html&gt;                               {{-- indique que c'est une page HTML5 --}}
&lt;html&gt;                                        {{-- debut du document HTML --}}
&lt;head&gt;&lt;title&gt;@yield('titre')&lt;/title&gt;&lt;/head&gt;  {{-- @yield('titre') = un TROU nomme "titre", rempli par chaque page --}}
&lt;body&gt;                                        {{-- debut du corps visible de la page --}}
    &lt;nav&gt;… le menu commun …&lt;/nav&gt;              {{-- menu identique sur toutes les pages --}}
    @yield('contenu')                         {{-- @yield('contenu') = le TROU principal du contenu --}}
&lt;/body&gt;                                       {{-- fin du corps --}}
&lt;/html&gt;                                       {{-- fin du document --}}</pre>
<p>Chaque page « remplit les trous » du layout :</p>
<pre class="pseudo">@extends('layout')             {{-- cette page s'insere DANS le squelette "layout" --}}

@section('titre', 'Accueil')   {{-- remplit le trou "titre" avec le texte "Accueil" (forme courte) --}}

@section('contenu')            {{-- debut du bloc qui remplira le trou "contenu" --}}
    &lt;h1&gt;Bienvenue !&lt;/h1&gt;       {{-- contenu propre a cette page --}}
@endsection                    {{-- fin du bloc "contenu" --}}</pre>
<h3>5. Sous le capot</h3>
<p>Blade <strong>compile</strong> (traduit) chaque template en PHP pur, rangé dans <code>storage/framework/views/</code> : par exemple <code>{{ $nom }}</code> devient <code>&lt;?php echo e($nom); ?&gt;</code>. Aucune perte de performance, et ce cache (cette version traduite gardée de côté) est régénéré automatiquement dès que tu modifies le fichier.</p>
<div class="warn">N'utilise <code>{!! $variable !!}</code> (sans échappement) que pour du HTML de confiance que TU as généré. Jamais pour une saisie utilisateur : c'est la porte ouverte aux attaques XSS vues à la leçon 13 de PHP.</div>
<div class="tip">Convention : un dossier de vues par ressource (messages/index.blade.php, messages/show.blade.php…), calqué sur les méthodes du contrôleur.</div>`,
  exercises: [
    { type: "qcm", q: "Où sont rangés les fichiers de vues Blade ?", opts: ["app/views/", "resources/views/", "public/views/", "storage/views/"], a: 1, exp: "resources/views/ — extension .blade.php obligatoire." },
    { type: "input", q: "Quelle est l'extension complète d'un fichier de vue Blade ?", a: [".blade.php", "blade.php"], ph: "extension", exp: ".blade.php : c'est elle qui active le moteur Blade." },
    { type: "qcm", q: "Comment afficher la vue resources/views/messages/index.blade.php depuis un contrôleur ?", opts: ["return view('messages/index.blade.php')", "return view('messages.index')", "include 'messages/index.blade.php'", "echo 'messages.index'"], a: 1, exp: "Le point remplace le / et on omet l'extension." },
    { type: "qcm", q: "Que fait {{ $nom }} dans un template Blade ?", opts: ["Affiche $nom tel quel, HTML compris", "Affiche $nom en échappant le HTML (protection XSS automatique)", "Crée la variable $nom", "Commente la ligne"], a: 1, exp: "Équivalent d'un echo htmlspecialchars($nom) — le réflexe de la leçon 13 de PHP, automatisé." },
    { type: "qcm", q: "Quelle fonction PHP appelais-tu à la main au cours PHP pour obtenir la même protection que {{ }} ?", opts: ["strlen()", "htmlspecialchars()", "trim()", "var_dump()"], a: 1, exp: "Blade échappe pour toi : plus d'oubli possible." },
    { type: "qcm", q: "À quoi sert @yield('contenu') dans un layout ?", opts: ["À supprimer le contenu", "À marquer l'emplacement que chaque page enfant remplira avec @section", "À charger un fichier CSS", "À créer une boucle"], a: 1, exp: "@yield = le trou ; @section = le bouchon fourni par la page." },
    { type: "qcm", q: "Quelle directive place-t-on en haut d'une page pour hériter du layout ?", opts: ["@include('layout')", "@extends('layout')", "@import('layout')", "@layout"], a: 1, exp: "@extends('layout') : la page s'insère dans le squelette commun." },
    { type: "qcm", q: "Quelle est la différence entre {{ $x }} et {!! $x !!} ?", opts: ["Aucune", "{{ }} échappe le HTML, {!! !!} l'affiche brut (dangereux avec une saisie utilisateur)", "{!! !!} est plus rapide", "{{ }} ne marche qu'avec du texte"], a: 1, exp: "{!! !!} = porte ouverte au XSS si la donnée vient d'un visiteur." },
    { type: "qcm", q: "Un visiteur signe le livre d'or avec le message &lt;script&gt;alert('pirate')&lt;/script&gt;. Tu l'affiches avec {{ $message }}. Résultat ?", opts: ["Le script s'exécute chez tous les visiteurs", "Le texte s'affiche inoffensif : les < > sont convertis en entités HTML", "Laravel plante", "Le message est supprimé"], a: 1, exp: "C'est exactement l'attaque XSS de la leçon 13 de PHP — neutralisée par défaut." },
    { type: "qcm", q: "Où Blade stocke-t-il les templates compilés en PHP pur ?", opts: ["resources/views/cache/", "storage/framework/views/", "public/", "vendor/blade/"], a: 1, exp: "Compilation automatique et invisible : tu n'y touches jamais." },
    { type: "qcm", q: "Comment écrire un commentaire Blade qui n'apparaît PAS dans le HTML envoyé au navigateur ?", opts: ["<!-- commentaire -->", "{{-- commentaire --}}", "// commentaire", "# commentaire"], a: 1, exp: "{{-- --}} disparaît à la compilation ; <!-- --> resterait visible dans le code source." },
    { type: "qcm", q: "@section('titre', 'Accueil') : que fait cette forme courte ?", opts: ["Elle crée une page Accueil", "Elle remplit la section titre avec le texte « Accueil », sans bloc @endsection", "Elle affiche une erreur", "Elle importe un fichier"], a: 1, exp: "Forme compacte pour les sections d'une seule valeur." },
    { type: "qcm", q: "Le contrôleur doit-il contenir du HTML ?", opts: ["Oui, c'est son rôle", "Non : il prépare les données et délègue l'affichage à la vue", "Seulement les balises <p>", "Uniquement en production"], a: 1, exp: "Séparation des responsabilités : logique au contrôleur, présentation à la vue." },
    { type: "vf", q: "Blade est plus lent que du PHP pur car il doit interpréter les directives à chaque visite.", a: false, exp: "Faux : compilé une fois en PHP pur, puis mis en cache. Performance identique." },
    { type: "vf", q: "Modifier un fichier .blade.php nécessite de vider le cache à la main pour voir le changement.", a: false, exp: "Blade recompile automatiquement quand le fichier source change." }
  ],
  final: {
    title: "Exercice final — Le layout du livre d'or",
    intro: `<p>Analyse ce layout et cette page, ligne par ligne :</p>
<pre class="pseudo">{{-- resources/views/layout.blade.php : le squelette commun --}}
&lt;!DOCTYPE html&gt;                                              {{-- page HTML5 --}}
&lt;html lang="fr"&gt;                                             {{-- document en francais --}}
&lt;head&gt;&lt;title&gt;Livre d'or — @yield('titre')&lt;/title&gt;&lt;/head&gt;    {{-- titre fixe + trou "titre" variable --}}
&lt;body&gt;                                                       {{-- corps de la page --}}
  &lt;nav&gt;&lt;a href="/"&gt;Accueil&lt;/a&gt; | &lt;a href="/signatures"&gt;Signatures&lt;/a&gt;&lt;/nav&gt;   {{-- menu commun --}}
  @yield('contenu')                                          {{-- trou du contenu de chaque page --}}
  &lt;footer&gt;© Famille Aurélia&lt;/footer&gt;                         {{-- pied de page commun --}}
&lt;/body&gt;                                                      {{-- fin du corps --}}
&lt;/html&gt;                                                      {{-- fin du document --}}

{{-- resources/views/signatures/index.blade.php : une page enfant --}}
@extends('layout')                       {{-- s'insere dans le squelette layout --}}
@section('titre', 'Les signatures')      {{-- remplit le trou "titre" (forme courte) --}}
@section('contenu')                      {{-- debut du bloc "contenu" --}}
  &lt;h1&gt;Toutes les signatures&lt;/h1&gt;         {{-- titre de la page --}}
  &lt;p&gt;Dernier visiteur : {{ $dernier }}&lt;/p&gt;   {{-- affiche $dernier de facon echappee --}}
@endsection                              {{-- fin du bloc "contenu" --}}</pre>`,
    questions: [
      { type: "qcm", q: "Quel titre complet apparaîtra dans l'onglet du navigateur ?", opts: ["« @yield('titre') »", "« Livre d'or — Les signatures »", "« Les signatures »", "« layout »"], a: 1, exp: "Le @yield est remplacé par la valeur de la @section correspondante." },
      { type: "qcm", q: "Le menu et le footer apparaissent sur cette page sans y être écrits. Pourquoi ?", opts: ["Ils sont copiés-collés à la compilation depuis .env", "@extends('layout') insère la page dans le squelette commun", "C'est le navigateur qui les ajoute", "Ils sont dans le contrôleur"], a: 1, exp: "Un seul layout à maintenir : modifier le menu = une seule modification." },
      { type: "qcm", q: "Comment le contrôleur affiche-t-il cette vue ?", opts: ["return view('signatures.index', ...)", "return view('signatures/index.blade.php')", "include 'index'", "return 'signatures.index'"], a: 0, exp: "Sous-dossier signatures → notation à point. Le passage de $dernier : leçon 5 !" },
      { type: "qcm", q: "$dernier vaut « <b>Marc</b> ». Qu'affiche {{ $dernier }} ?", opts: ["Marc en gras", "Le texte littéral &lt;b&gt;Marc&lt;/b&gt;, balises visibles mais inoffensives", "Une erreur", "Rien"], a: 1, exp: "{{ }} échappe : les balises deviennent du texte. Sécurité avant tout." },
      { type: "vf", q: "Le commentaire {{-- resources/views/layout.blade.php --}} sera visible dans le code source de la page reçue par le navigateur.", a: false, exp: "Les commentaires Blade disparaissent à la compilation." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 4 :
// 1. Vue = resources/views/xxx.blade.php ; affichee avec view('xxx').
// 2. {{ $var }} affiche EN ECHAPPANT (htmlspecialchars automatique).
// 3. {!! !!} = brut = reserve au HTML de confiance.
// 4. Layout : @yield definit les trous, @extends + @section les remplissent.
// 5. Blade est compile en PHP pur : elegance sans perte de vitesse.</pre>
<p>Il nous manque une chose : envoyer des données du contrôleur vers la vue. C'est la leçon de demain.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code Blade ici…",
  items: [
  { id: "laravel-blade-page", title: "Une page qui hérite du layout", level: 1,
    statement: "Écris la vue <code>resources/views/apropos.blade.php</code> : elle hérite du layout <code>layout</code>, remplit la section <code>titre</code> avec « À propos » (forme courte) et la section <code>contenu</code> avec un <code>&lt;h1&gt;À propos&lt;/h1&gt;</code> suivi d'un paragraphe affichant la variable <code>$auteur</code> de façon sécurisée.",
    atoi: {cmd: "# une route /apropos rend la vue en passant $auteur, serveur demarre :\ncurl -i http://localhost:8000/apropos", expected: "HTTP 200. Le HTML rendu inclut le layout, avec dans le contenu :\n  <h1>A propos</h1>\n  <p>Site realise par ...la valeur de $auteur, echappee...</p>\nLe <title> de l'onglet vaut A propos. Une valeur $auteur contenant du HTML\nest affichee en texte inoffensif (les < > deviennent des entites) : {{ }} echappe."},
    checklist: ["@extends('layout') est-il en tete de la vue ?", "La section titre utilise-t-elle la forme courte @section('titre', 'A propos') ?", "$auteur est-il affiche avec {{ }} (echappe) et non {!! !!} ?", "Le bloc contenu est-il bien ferme par @endsection ?"],
    hints: [
      "Trois directives suffisent : @extends, @section (forme courte pour le titre), @section…@endsection pour le contenu.",
      "La forme courte : @section('titre', 'À propos') — pas de @endsection.",
      "L'affichage sécurisé d'une variable se fait avec les doubles accolades."
    ],
    solution: "@extends('layout')                {{-- hérite du squelette commun --}}\n\n@section('titre', 'À propos')     {{-- forme courte : une seule valeur --}}\n\n@section('contenu')\n    <h1>À propos</h1>\n    <p>Site réalisé par {{ $auteur }}</p>  {{-- échappé : anti-XSS --}}\n@endsection",
    note: "Réflexe à prendre : TOUJOURS {{ }} pour afficher une donnée. {!! !!} doit te faire lever un sourcil à chaque fois que tu le croises." }
  ]
};
</script>
<script src="engine.js"></script>
<script src="exo-ecriture.js"></script>

<script src="fil-rouge.js"></script>
