  title: "Pagination, logs et bonnes pratiques",
  subtitle: "Les finitions qui séparent un exercice d'un vrai produit.",
  theory: `
<h3>1. La pagination : indispensable et gratuite</h3>
<p>La <strong>pagination</strong>, c'est découper une longue liste en pages (page 1, 2, 3…) au lieu de tout afficher d'un coup. Afficher 10 000 signatures sur une seule page ? Impensable. La pagination Laravel tient en deux lignes :</p>
<pre class="pseudo">// Controleur : remplacer get()/all() par paginate()
$signatures = Signature::latest()->paginate(10);   // paginate(10) = 10 signatures par page

{{-- Vue : la liste, puis les liens de pages --}}
@foreach ($signatures as $s) ... @endforeach       {{-- affiche les 10 elements de la page courante --}}
{{ $signatures->links() }}                          {{-- affiche la barre de navigation « 1 2 3 ... » --}}</pre>
<p><code>paginate(10)</code> lit le paramètre <code>?page=3</code> de l'URL, exécute un LIMIT/OFFSET en base (LIMIT = « au plus N lignes », OFFSET = « en sautant les premières ») et fournit tout : les éléments, le total, et <code>links()</code> génère la barre de navigation « 1 2 3 … ». Côté API, <code>paginate()</code> renvoie un JSON avec <code>data</code>, <code>total</code>, <code>current_page</code>…</p>
<h3>2. Les logs : la boîte noire de l'application</h3>
<p>Un <strong>log</strong> (« journal ») est un fichier texte où l'application note ce qui se passe. En production (APP_DEBUG=false), les erreurs vont dans <code>storage/logs/laravel.log</code>. Tu peux écrire toi-même, par <strong>niveau de gravité</strong> :</p>
<pre class="pseudo">use Illuminate\\Support\\Facades\\Log;                          // importe la facade Log

Log::debug('Détail technique', ['id' => $id]);                 // debug : detail utile en developpement uniquement
Log::info('Nouvelle signature de ' . $auteur);                 // info : evenement normal a tracer
Log::warning('Tentative de connexion échouée', ['email' => $email]);   // warning : situation suspecte a surveiller
Log::error('Échec de génération du PDF', ['exception' => $e]);  // error : quelque chose a casse</pre>
<p>Les niveaux (debug &lt; info &lt; warning &lt; error &lt; critical) permettent de filtrer : en prod, on ignore souvent debug. Le second argument (un tableau) ajoute du <em>contexte</em> (des infos utiles) au message.</p>
<h3>3. Ne jamais logger de secrets</h3>
<p>Un log est un fichier texte lisible par toute l'équipe (et parfois envoyé à des services externes). <strong>Jamais</strong> de mot de passe, de numéro de carte ou de données personnelles sensibles dedans.</p>
<h3>4. Le grand ménage : les bonnes pratiques du cours</h3>
<pre class="pseudo">✔ Controleurs maigres, logique dans les modeles/services   # (leçon 7)
✔ Toute donnee entrante validee                            # (leçon 12)
✔ Tout affichage echappe {{ }}                             # (leçon 4)
✔ Requetes filtrees AVANT get(), with() contre le N+1      # (leçons 10-11)
✔ Routes nommees, jamais d'URL en dur                      # (leçon 2)
✔ Secrets dans .env, APP_DEBUG=false en prod               # (leçon 14)
✔ Tests sur le nominal ET les erreurs                      # (leçon 15)
✔ paginate() des qu'une liste peut grandir                 # (aujourd'hui)</pre>
<h3>5. Avant la mise en ligne</h3>
<pre class="pseudo">php artisan test              # 1) tous les tests passent-ils ?
php artisan config:cache      # 2) compile la configuration (plus rapide)
php artisan route:cache       # 3) compile les routes (plus rapide)
composer install --no-dev     # 4) installe les dependances SANS les outils de dev</pre>
<div class="warn">paginate() et links() vont ensemble : si tu oublies links() dans la vue, les visiteurs ne verront jamais les pages suivantes — bug silencieux classique.</div>
<div class="tip">Astuce debug rapide : <code>tail -f storage/logs/laravel.log</code> dans un terminal pendant que tu testes — les erreurs défilent en direct.</div>`,
  exercises: [
    { type: "qcm", q: "Comment paginer les signatures 10 par 10 ?", opts: ["Signature::all()->slice(10)", "Signature::latest()->paginate(10)", "Signature::limit(10)", "Signature::pages(10)"], a: 1, exp: "paginate remplace get et gère tout, y compris ?page=N." },
    { type: "qcm", q: "Que génère {{ $signatures->links() }} ?", opts: ["Des liens vers les réseaux sociaux", "La barre de navigation entre les pages (1, 2, 3…)", "Un fichier de log", "Le total"], a: 1, exp: "Le duo paginate() + links() est indissociable." },
    { type: "qcm", q: "Comment paginate() sait-il quelle page afficher ?", opts: ["Par la session", "Par le paramètre ?page=N de l'URL", "Par un cookie", "Au hasard"], a: 1, exp: "GET /signatures?page=3 → la 3e page, automatiquement." },
    { type: "qcm", q: "Quel avantage de paginate(10) côté performance ?", opts: ["Aucun", "La base ne renvoie que 10 lignes (LIMIT/OFFSET), pas la table entière", "Le HTML est compressé", "Le CSS est mis en cache"], a: 1, exp: "Comme à la leçon 10 : le filtrage reste dans la base." },
    { type: "qcm", q: "Où vont les erreurs en production ?", opts: ["À l'écran des visiteurs", "Dans storage/logs/laravel.log", "Dans la base", "Nulle part"], a: 1, exp: "APP_DEBUG=false : page neutre pour le visiteur, détails dans le log." },
    { type: "qcm", q: "Classe les niveaux de log du moins au plus grave :", opts: ["error < info < debug", "debug < info < warning < error", "info < debug < error", "warning < debug < error"], a: 1, exp: "debug (détail) → info (événement) → warning (louche) → error (cassé)." },
    { type: "qcm", q: "Quel niveau pour « un utilisateur s'est inscrit » ?", opts: ["error", "info : un événement normal digne d'être noté", "critical", "warning"], a: 1, exp: "info trace la vie normale de l'application." },
    { type: "qcm", q: "Quel niveau pour « 5 échecs de connexion sur le même compte en 1 minute » ?", opts: ["debug", "warning : suspect, à surveiller", "info", "Aucun log"], a: 1, exp: "Pas encore une erreur, mais un signal de possible attaque." },
    { type: "qcm", q: "Peut-on écrire Log::info('Mot de passe choisi : ' . $password) ?", opts: ["Oui, pour le support", "JAMAIS : aucun secret ni donnée sensible dans les logs", "Oui, en dev", "Oui, si chiffré"], a: 1, exp: "Les logs sont lus par des humains, archivés, exportés… Un secret loggé est un secret exposé." },
    { type: "qcm", q: "Que renvoie paginate() sur une route API ?", opts: ["Du HTML", "Un JSON structuré : data, total, current_page, per_page…", "Une erreur", "La première page seulement"], a: 1, exp: "L'application mobile peut afficher « page 2 sur 12 »." },
    { type: "qcm", q: "Quelle commande suit le log en direct pendant les tests ?", opts: ["php artisan log:watch", "tail -f storage/logs/laravel.log", "composer log", "php artisan serve --log"], a: 1, exp: "tail -f : l'outil universel pour regarder un fichier grandir." },
    { type: "qcm", q: "Avant la mise en production, on lance :", opts: ["migrate:fresh", "php artisan test, puis config:cache et route:cache", "rm -rf vendor", "APP_DEBUG=true"], a: 1, exp: "Vérifier, puis compiler pour la vitesse." },
    { type: "qcm", q: "Une liste « ne grandira jamais, 20 éléments max ». Faut-il paginer ?", opts: ["Non, jamais", "Les listes ont l'habitude de mentir : paginate() coûte deux lignes, le crash d'une page à 50 000 lignes coûte cher", "Oui mais à 1000", "Seulement en API"], a: 1, exp: "Réflexe défensif : toute liste alimentée par les utilisateurs finit par grandir." },
    { type: "vf", q: "Log::debug() est le bon endroit pour tracer des détails techniques utiles seulement en développement.", a: true, exp: "En prod, le niveau minimal configuré ignore généralement debug." },
    { type: "vf", q: "Avec paginate(10), $signatures->total() donne le nombre TOTAL de lignes, pas seulement les 10 affichées.", a: true, exp: "paginate exécute aussi un COUNT — d'où « 134 signatures, page 2/14 »." }
  ],
  final: {
    title: "Exercice final — La liste qui tient la charge",
    intro: `<p>Le livre d'or version finale de la liste. Analyse chaque ligne :</p>
<pre class="pseudo">public function index()
{
    Log::info('Consultation de la liste', ['page' => request('page', 1)]);   // note la consultation + la page demandee

    return view('signatures.index', [
        'signatures' => Signature::with('visiteur')    // charge les auteurs d'avance (anti N+1)
                                 ->where('publie', true) // seulement les signatures publiees
                                 ->latest()              // des plus recentes aux plus anciennes
                                 ->paginate(15),         // 15 par page (LIMIT en base)
    ]);
}

{{-- Vue --}}
@forelse ($signatures as $s)                            {{-- pour chaque signature de la page (sinon @empty)... --}}
    &lt;p&gt;{{ $s->contenu }} — {{ $s->visiteur->pseudo }}&lt;/p&gt;   {{-- ...texte + pseudo de l'auteur --}}
@empty                                                  {{-- si la page est vide... --}}
    &lt;p&gt;Aucune signature.&lt;/p&gt;                             {{-- ...ce message --}}
@endforelse                                             {{-- fin du forelse --}}
{{ $signatures->links() }}                              {{-- barre de navigation entre les pages --}}</pre>`,
    questions: [
      { type: "qcm", q: "La table contient 4 500 signatures publiées. Combien de lignes la requête principale transfère-t-elle ?", opts: ["4 500", "15 : LIMIT géré par la base", "100", "1"], a: 1, exp: "paginate(15) = 15 lignes par page, quelle que soit la taille de la table." },
      { type: "qcm", q: "Pourquoi le with('visiteur') reste-t-il important ici ?", opts: ["Pour le style", "Sans lui : 1 + 15 requêtes par page (N+1) ; avec : 2 (+1 count)", "Il est inutile avec paginate", "Pour la pagination"], a: 1, exp: "Les leçons se cumulent : pagination ET eager loading." },
      { type: "qcm", q: "Le visiteur demande /signatures?page=300 alors qu'il n'y a que 300 pages... pardon, 300 signatures (20 pages). Que voit-il ?", opts: ["Une erreur 500", "La page « Aucune signature » : liste vide, gérée par @forelse", "La page 1", "Un crash"], a: 1, exp: "Une page hors bornes renvoie une collection vide — et ta vue la gère déjà." },
      { type: "qcm", q: "Le Log::info écrit ici est-il pertinent ?", opts: ["Non, on ne logge jamais les GET", "Discutable : à ce niveau de détail, le log grossira vite — un debug serait plus adapté, ou rien", "Oui, c'est obligatoire", "Il fait planter la prod"], a: 1, exp: "Bien logger, c'est aussi savoir ne PAS tout logger." },
      { type: "vf", q: "Si on retire {{ $signatures->links() }}, la pagination continue de fonctionner via l'URL, mais les visiteurs n'ont plus de boutons pour naviguer.", a: true, exp: "?page=2 marcherait toujours — mais personne ne le devinera. links() est l'interface." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 19 :
// 1. paginate(n) + {{ $x->links() }} : la pagination complete en 2 lignes.
// 2. La base ne renvoie que la page demandee : performance preservee.
// 3. Log::debug/info/warning/error : la boite noire, par gravite.
// 4. JAMAIS de secrets dans les logs.
// 5. Checklist prod : tests verts, config:cache, route:cache,
//    APP_DEBUG=false.</pre>
<p>Tout est en place. Demain : on assemble TOUT dans le projet guidé — le livre d'or professionnel de A à Z.</p>`
  }
};

    atoi: {cmd: "# serveur demarre, des sujets en base :\ncurl -i \"http://localhost:8000/forum?page=2\"\ntail -n1 storage/logs/laravel.log", expected: "HTTP 200 : la page affiche 20 sujets, epingles d'abord puis du plus recent\nau plus ancien, avec les liens de pagination ($sujets->links()).\nlaravel.log contient une ligne INFO « Consultation du forum » avec le\ncontexte {\"user\":<id>}. Le chargement with('auteur') evite le N+1."},
    checklist: ["La methode logge-t-elle Log::info('Consultation du forum', ['user' => Auth::id()]) ?", "Le tri chaine-t-il orderBy('epingle','desc') puis latest() ?", "Le chargement utilise-t-il with('auteur') avant paginate(20) (anti N+1) ?", "La vue affiche-t-elle la navigation avec {{ $sujets->links() }} ?"],

  ]
