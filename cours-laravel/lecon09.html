<script>
var DAY = {
  num: 9,
  title: "Eloquent : les modèles et le CRUD",
  subtitle: "Parler à la base de données en PHP, sans écrire une ligne de SQL.",
  theory: `
<h3>1. Qu'est-ce qu'un ORM ?</h3>
<p>Au cours PHP, tu écrivais du <strong>SQL</strong> (le langage des bases de données) avec PDO : <code>$pdo-&gt;prepare('INSERT INTO ...')</code>. Un <strong>ORM</strong> (<em>Object-Relational Mapper</em>, « traducteur objets ↔ tables ») fait la traduction pour toi : une <strong>classe</strong> représente une table, un <strong>objet</strong> (une instance de la classe) représente une ligne. Ainsi tu manipules des objets PHP familiers, et l'ORM écrit le SQL à ta place. L'ORM de Laravel s'appelle <strong>Eloquent</strong>. On parle de <strong>CRUD</strong> pour les 4 opérations de base : <em>Create</em> (créer), <em>Read</em> (lire), <em>Update</em> (modifier), <em>Delete</em> (supprimer).</p>
<h3>2. Créer un modèle</h3>
<pre class="pseudo">php artisan make:model Signature      # cree la classe modele App\\Models\\Signature
# ou en une fois avec sa migration :  # le commentaire explique l'option ci-dessous
php artisan make:model Signature -m   # l'option -m cree AUSSI la migration de la table</pre>
<pre class="pseudo">namespace App\\Models;                                  // adresse logique : les modeles vivent dans App\\Models

use Illuminate\\Database\\Eloquent\\Model;              // importe la classe de base Model d'Eloquent

class Signature extends Model                          // notre modele herite de Model : il gagne tous les pouvoirs d'Eloquent
{                                                      // debut de la classe
    protected $fillable = ['auteur', 'email', 'contenu'];   // liste blanche : colonnes remplissables en masse (voir point 4)
}                                                      // fin de la classe</pre>
<p><strong>Convention magique</strong> : le modèle <code>Signature</code> (singulier) est automatiquement lié à la table <code>signatures</code> (pluriel). Zéro configuration si tu respectes la convention d'hier.</p>
<h3>3. Le CRUD complet</h3>
<pre class="pseudo">// CREATE (creer)
$s = Signature::create([                               // cree et enregistre une nouvelle ligne en base
    'auteur' => 'Aurélia', 'contenu' => 'Superbe site !'   // valeurs des colonnes
]);                                                    // $s contient l'objet cree

// READ (lire)
$toutes  = Signature::all();          // recupere TOUTES les lignes de la table
$une     = Signature::find(3);        // recupere la ligne d'id 3 (renvoie null si absente)
$une     = Signature::findOrFail(3);  // idem mais declenche une page 404 si l'id est absent

// UPDATE (modifier)
$s = Signature::find(3);              // on charge la ligne a modifier
$s->contenu = 'Texte corrigé';        // on change la valeur de la colonne "contenu"
$s->save();                           // on enregistre la modification en base

// DELETE (supprimer)
$s->delete();                          // supprime cette ligne  (ou : Signature::destroy(3);)</pre>
<h3>4. $fillable : la protection d'assignement de masse</h3>
<p><code>create([...])</code> remplit plusieurs colonnes d'un coup : c'est l'<strong>assignement de masse</strong> (en anglais <em>mass assignment</em>). Danger : un pirate pourrait ajouter <code>admin=1</code> à ton formulaire pour se donner des droits ! C'est pourquoi Eloquent exige une <strong>liste blanche</strong> (la liste des seules choses autorisées) via <code>$fillable</code> : seules ces colonnes sont assignables en masse. Les autres sont ignorées.</p>
<h3>5. Dans le contrôleur</h3>
<pre class="pseudo">public function index()                                // affiche la liste
{                                                      // debut
    return view('signatures.index', ['signatures' => Signature::all()]);   // envoie toutes les signatures a la vue
}                                                      // fin

public function store(Request $request)                // recoit le formulaire (POST)
{                                                      // debut
    Signature::create([                                // cree une signature en base...
        'auteur'  => $request->input('auteur'),        // ...avec l'auteur saisi
        'contenu' => $request->input('contenu'),       // ...et le contenu saisi
    ]);                                                // fin de create()
    return redirect()->route('signatures.index');      // redirige vers la liste (Post/Redirect/Get)
}                                                      // fin</pre>
<p>Compare avec la leçon 19 de PHP : les requêtes préparées, la connexion, le fetch… tout est devenu invisible. Et sous le capot, Eloquent utilise bien des <strong>requêtes préparées</strong> (des requêtes où les valeurs sont envoyées séparément du SQL) : l'injection SQL est neutralisée.</p>
<div class="warn">find(99) renvoie <code>null</code> si l'id n'existe pas → risque d'« Attempt to read property on null ». Dans un contrôleur, préfère <code>findOrFail()</code> : Laravel renvoie une propre page 404.</div>
<div class="tip">Dans la vue, une ligne Eloquent se lit comme un objet : <code>{{ $s->auteur }}</code>, <code>{{ $s->created_at }}</code>. Les colonnes deviennent des propriétés.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie ORM ?", opts: ["Online Request Manager", "Object-Relational Mapper : traduire objets ↔ tables", "Ordered Row Model", "Open Route Middleware"], a: 1, exp: "Une classe = une table, un objet = une ligne." },
    { type: "input", q: "Quelle commande crée le modèle Livre ET sa migration en une fois ?", a: ["php artisan make:model Livre -m", "php artisan make:model Livre --migration"], ph: "commande", exp: "L'option -m ajoute la migration create_livres_table." },
    { type: "qcm", q: "Le modèle Signature est lié à quelle table, par convention ?", opts: ["signature", "signatures", "Signature", "tbl_signature"], a: 1, exp: "Singulier → pluriel : la convention évite toute configuration." },
    { type: "qcm", q: "Comment récupérer TOUTES les signatures ?", opts: ["Signature::all()", "Signature::get(*)", "SELECT * FROM signatures", "Signature.findAll()"], a: 0, exp: "all() renvoie une Collection de modèles." },
    { type: "qcm", q: "Quelle est la différence entre find(5) et findOrFail(5) ?", opts: ["Aucune", "find renvoie null si absent ; findOrFail déclenche une page 404", "findOrFail est plus lent", "find ne marche qu'avec SQLite"], a: 1, exp: "Dans un contrôleur, findOrFail donne gratuitement le bon comportement HTTP." },
    { type: "qcm", q: "À quoi sert la propriété $fillable ?", opts: ["À lister les colonnes affichables", "À autoriser explicitement les colonnes assignables en masse via create()", "À chiffrer les colonnes", "À trier les résultats"], a: 1, exp: "Liste blanche contre l'injection de champs pirates (ex. admin=1)." },
    { type: "qcm", q: "Pourquoi la protection contre l'assignement de masse existe-t-elle ?", opts: ["Pour la performance", "Un utilisateur malveillant pourrait envoyer des champs supplémentaires (ex. role=admin) dans le formulaire", "Pour économiser la mémoire", "À cause de SQLite"], a: 1, exp: "On ne fait jamais confiance aux données entrantes — principe déjà vu leçon 13 de PHP." },
    { type: "qcm", q: "Comment modifier le contenu de la signature n°3 ?", opts: ["UPDATE signatures SET...", "$s = Signature::find(3); $s->contenu = '...'; $s->save();", "Signature::edit(3)", "$s->update sans find"], a: 1, exp: "On charge l'objet, on modifie ses propriétés, on save()." },
    { type: "qcm", q: "Eloquent protège-t-il contre l'injection SQL ?", opts: ["Non, il faut échapper à la main", "Oui : il génère des requêtes préparées, comme PDO à la leçon 19 de PHP", "Seulement en production", "Seulement avec MySQL"], a: 1, exp: "Le paramétrage automatique neutralise l'injection." },
    { type: "qcm", q: "Dans une vue, comment afficher l'auteur de la signature $s ?", opts: ["{{ $s['auteur'] }} uniquement", "{{ $s->auteur }} : les colonnes deviennent des propriétés d'objet", "{{ auteur }}", "{{ $s.auteur }}"], a: 1, exp: "Un modèle Eloquent se manipule comme un objet PHP." },
    { type: "qcm", q: "Que fait Signature::create(['auteur' => 'Léa', 'contenu' => 'Bravo']) ?", opts: ["Rien sans save()", "INSERT immédiat : l'objet est créé ET enregistré en base", "Une simple validation", "Un UPDATE"], a: 1, exp: "create = new + remplissage + save en un appel (colonnes $fillable uniquement)." },
    { type: "qcm", q: "Qui remplit les colonnes created_at et updated_at ?", opts: ["Toi, à chaque insert", "Eloquent, automatiquement", "Le navigateur", "phpMyAdmin"], a: 1, exp: "Grâce à timestamps() dans la migration + la gestion automatique d'Eloquent." },
    { type: "qcm", q: "Le champ « admin » n'est pas dans $fillable. Un pirate ajoute admin=1 au formulaire et le contrôleur fait Signature::create($request->all()). Résultat ?", opts: ["admin passe à 1 : piraté", "Le champ admin est silencieusement ignoré : la liste blanche protège", "Erreur 500 systématique", "Le site plante"], a: 1, exp: "C'est exactement le scénario que $fillable neutralise." },
    { type: "vf", q: "Avec Eloquent, il faut quand même écrire soi-même les requêtes préparées PDO.", a: false, exp: "Eloquent les écrit pour toi — PDO travaille en coulisses." },
    { type: "vf", q: "delete() sur un modèle chargé supprime la ligne correspondante en base.", a: true, exp: "Ou Signature::destroy(id) sans charger l'objet." }
  ],
  final: {
    title: "Exercice final — Le livre d'or branché sur la base",
    intro: `<p>Le contrôleur du livre d'or utilise désormais Eloquent. Analyse chaque ligne :</p>
<pre class="pseudo">class SignatureController extends Controller            // controleur des signatures
{                                                      // debut de la classe
    public function index()                            // GET /signatures : la liste
    {
        return view('signatures.index', [              // renvoie la vue liste...
            'signatures' => Signature::all(),          // ...avec toutes les signatures
        ]);
    }

    public function show(int $id)                      // GET /signatures/{id} : une signature
    {
        return view('signatures.show', [               // renvoie la vue detail...
            'signature' => Signature::findOrFail($id), // ...avec la signature d'id $id (404 si absente)
        ]);
    }

    public function store(Request $request)            // POST /signatures : enregistrer
    {
        Signature::create([                            // cree la ligne en base...
            'auteur'  => $request->input('auteur'),    // ...auteur saisi
            'contenu' => $request->input('contenu'),   // ...contenu saisi
        ]);
        return redirect()->route('signatures.index');  // redirige vers la liste
    }
}                                                      // fin de la classe</pre>`,
    questions: [
      { type: "qcm", q: "GET /signatures/999 alors que l'id 999 n'existe pas. Que reçoit le visiteur ?", opts: ["Une page blanche", "Une page 404 propre, grâce à findOrFail", "Une erreur « property on null »", "La liste complète"], a: 1, exp: "findOrFail lève une exception que Laravel convertit en 404." },
      { type: "qcm", q: "Pour que store() fonctionne, que doit contenir le modèle Signature ?", opts: ["Une méthode store()", "protected $fillable = ['auteur', 'contenu', ...]", "Un constructeur", "Le mot de passe de la base"], a: 1, exp: "Sans $fillable, create() lève une MassAssignmentException." },
      { type: "qcm", q: "Quelle requête SQL Eloquent génère-t-il (en gros) pour Signature::all() ?", opts: ["SELECT * FROM signatures", "INSERT INTO signatures", "SELECT * FROM signature", "SHOW TABLES"], a: 0, exp: "Table « signatures » déduite du nom du modèle." },
      { type: "qcm", q: "Où est passée la connexion PDO qu'on écrivait au cours PHP ?", opts: ["Elle n'existe plus", "Laravel la gère en coulisses à partir du .env", "Dans chaque contrôleur", "Dans la vue"], a: 1, exp: "Configuration .env + Eloquent : la plomberie est invisible mais bien là." },
      { type: "vf", q: "Ce store() insère aussi created_at et updated_at sans qu'on les mentionne.", a: true, exp: "Eloquent horodate automatiquement chaque création." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 9 :
// 1. Modele Eloquent = classe qui represente une table (Signature <-> signatures).
// 2. CRUD : create() / all(), find(), findOrFail() / save() / delete().
// 3. $fillable = liste blanche obligatoire pour create([...]).
// 4. findOrFail  ->  404 automatique : parfait pour show().
// 5. Requetes preparees automatiques : l'injection SQL est neutralisee.</pre>
<p>all() charge TOUT, tout le temps. Demain : filtrer, trier, limiter — les vraies requêtes Eloquent.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Laravel ici…",
  items: [
  { id: "laravel-eloquent-crud", title: "Le CRUD du modèle Membre", level: 2,
    statement: "Écris (1) le modèle <code>Membre</code> avec les champs assignables <code>pseudo</code>, <code>email</code> et <code>age</code> ; (2) une méthode de contrôleur <code>store(Request $request)</code> qui crée un membre à partir du formulaire puis redirige vers la route <code>membres.index</code> ; (3) une méthode <code>destroy(int $id)</code> qui supprime le membre (404 si inexistant) puis redirige pareil.",
    atoi: {cmd: "php artisan tinker\n>>> $m = Membre::create(['pseudo'=>'Léa','email'=>'lea@ex.com','age'=>20]);\n>>> Membre::find($m->id);\n>>> $m->delete();\n>>> Membre::find($m->id);", expected: "create(...) insere la ligne et renvoie l'objet Membre avec son id.\nMembre::find($id) le retrouve tant qu'il existe ; apres ->delete(), il renvoie null.\nUn champ hors de $fillable (ex. is_admin) est ignore au create (assignement de masse).\nCote route : store puis destroy repondent HTTP 302 vers membres.index ;\ndestroy sur un id absent -> HTTP 404 (findOrFail)."},
    checklist: ["Le modele declare-t-il protected $fillable = ['pseudo','email','age'] ?", "store() cree-t-il via Membre::create([...]) puis redirige-t-il vers membres.index ?", "destroy() utilise-t-il findOrFail($id) (404 si absent) avant ->delete() ?", "Apres l'action, y a-t-il bien une redirection (PRG) et non un affichage de vue ?"],
    hints: [
      "Le modèle : class Membre extends Model + protected $fillable = [...].",
      "store : Membre::create([...]) avec les trois inputs, puis redirect()->route(...).",
      "destroy : charge avec findOrFail($id) puis ->delete()."
    ],
    solution: "// app/Models/Membre.php\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\n\nclass Membre extends Model\n{\n    protected $fillable = ['pseudo', 'email', 'age'];  // liste blanche\n}\n\n// MembreController.php\npublic function store(Request $request)\n{\n    Membre::create([\n        'pseudo' => $request->input('pseudo'),\n        'email'  => $request->input('email'),\n        'age'    => $request->input('age'),\n    ]);\n    return redirect()->route('membres.index');   // Post/Redirect/Get\n}\n\npublic function destroy(int $id)\n{\n    $membre = Membre::findOrFail($id);            // 404 si absent\n    $membre->delete();\n    return redirect()->route('membres.index');\n}",
    note: "Remarque le motif qui se répète : agir avec Eloquent, puis rediriger. Les leçons 12 et 13 ajouteront validation et messages de confirmation." }
  ]
};
