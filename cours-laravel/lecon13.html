<script>
var DAY = {
  num: 13,
  title: "Sessions, messages flash et gestion des erreurs",
  subtitle: "Mémoriser entre deux pages, prévenir l'utilisateur, gérer l'imprévu.",
  theory: `
<h3>1. La session, revisitée</h3>
<p>Une <strong>session</strong> est la mémoire du serveur qui te reconnaît d'une page à l'autre (sinon, chaque requête repartirait de zéro). Leçon 14 de PHP : <code>session_start()</code> + <code>$_SESSION['panier']</code>. Laravel démarre la session automatiquement (via un middleware) et l'expose proprement :</p>
<pre class="pseudo">session(['theme' => 'sombre']);          // ECRIRE : range la valeur 'sombre' sous la cle 'theme'
$theme = session('theme', 'clair');      // LIRE : recupere 'theme' ; 'clair' est la valeur par defaut si absent
$request->session()->forget('theme');    // SUPPRIMER une seule cle de la session
$request->session()->flush();            // TOUT VIDER : efface toute la session</pre>
<h3>2. Les messages flash</h3>
<p>Un message <strong>flash</strong> est une donnée de session éphémère : elle ne vit que jusqu'à la prochaine requête, puis disparaît toute seule. Parfait pour « Signature enregistrée ! » après une redirection (motif Post/Redirect/Get de la leçon 6) :</p>
<pre class="pseudo">// Controleur :
return redirect()->route('signatures.index')             // redirige vers la liste...
                 ->with('succes', 'Signature enregistrée !');   // ...en attachant un message flash 'succes'

{{-- Dans le layout (affiche sur toutes les pages) : --}}
@if (session('succes'))                                  {{-- SI un flash 'succes' existe... --}}
    &lt;div class="alerte-ok"&gt;{{ session('succes') }}&lt;/div&gt; {{-- ...affiche-le dans une banniere --}}
@endif                                                   {{-- fin du if --}}</pre>
<p>Au rechargement suivant, le message a disparu tout seul. C'est exactement ce que tu bricolais à la main avec unset($_SESSION[...]) au cours PHP.</p>
<h3>3. Les pages d'erreur : abort() et 404</h3>
<pre class="pseudo">abort(404);                        // interrompt et renvoie la page "404 non trouve"
abort(403, 'Accès interdit');      // interrompt en "403 interdit" avec un message
// findOrFail() appelle abort(404) pour toi   // rappel : d'ou vient le 404 automatique</pre>
<p>Un <strong>code HTTP</strong> est un nombre qui résume le sort d'une requête (404 = introuvable, 403 = interdit, 500 = erreur serveur). Pour personnaliser la page 404 : crée <code>resources/views/errors/404.blade.php</code> — Laravel l'utilise automatiquement.</p>
<h3>4. try/catch : les exceptions au service du web</h3>
<p>Une <strong>exception</strong> est un objet « erreur » lancé quand quelque chose tourne mal ; <code>try</code> tente un code risqué et <code>catch</code> attrape l'erreur pour la traiter. Dans Laravel, la stratégie est : <strong>laisser remonter</strong> les exceptions standard (le framework les convertit en pages d'erreur propres), et n'attraper que ce qu'on sait traiter :</p>
<pre class="pseudo">try {                                              // on tente une operation qui peut echouer...
    $pdf = $generateur->genererRecu($signature);   // ...generer un recu PDF
} catch (RecuIndisponibleException $e) {           // SI cette exception precise est levee...
    return redirect()->route('signatures.index')   // ...on redirige...
                     ->with('erreur', 'Reçu momentanément indisponible');   // ...avec un message d'erreur
}                                                  // fin du try/catch</pre>
<h3>5. Debug : APP_DEBUG et les deux visages des erreurs</h3>
<p>Dans <code>.env</code> : <code>APP_DEBUG=true</code> affiche la page d'erreur détaillée (la <em>stack trace</em>, c'est-à-dire la liste des appels ayant mené au bug, plus l'extrait de code) — génial en développement, <strong>catastrophique en production</strong> (elle révèle ton code, tes chemins, parfois des secrets). En production : <code>APP_DEBUG=false</code> → page d'erreur neutre, détails dans les <strong>logs</strong> (les fichiers-journaux du serveur, leçon 19).</p>
<div class="warn">Une production avec APP_DEBUG=true est une faille de sécurité classée parmi les plus fréquentes. C'est LE réglage à vérifier avant toute mise en ligne.</div>
<div class="tip">Convention de nommage des messages flash : 'succes' pour le vert, 'erreur' pour le rouge. Gère les deux dans le layout une fois pour toutes.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle différence entre une donnée de session normale et un message flash ?", opts: ["Aucune", "Le flash ne survit que jusqu'à la requête suivante, puis disparaît", "Le flash est chiffré", "La session normale expire en 1 minute"], a: 1, exp: "Parfait pour un message de confirmation après redirection." },
    { type: "qcm", q: "Comment attacher un message flash à une redirection ?", opts: ["redirect()->route('x')->with('succes', 'Fait !')", "session_flash('Fait !')", "echo 'Fait !'", "flash: true"], a: 0, exp: "->with(clé, valeur) flashe la donnée en session." },
    { type: "qcm", q: "Où placer l'affichage des messages flash pour qu'ils apparaissent sur toutes les pages ?", opts: ["Dans chaque vue", "Dans le layout", "Dans le contrôleur", "Dans routes/web.php"], a: 1, exp: "Un seul endroit : le layout dont toutes les pages héritent." },
    { type: "qcm", q: "Que renvoie session('theme', 'clair') si « theme » n'existe pas en session ?", opts: ["null", "'clair' : le second argument est la valeur par défaut", "Une erreur", "false"], a: 1, exp: "Même logique que $request->input(x, défaut)." },
    { type: "qcm", q: "Quel équivalent du cours PHP la session Laravel remplace-t-elle ?", opts: ["$_POST", "session_start() + $_SESSION", "$_COOKIE seul", "les fichiers JSON"], a: 1, exp: "Le démarrage est automatique, l'API est plus propre — le concept est identique." },
    { type: "qcm", q: "Que fait abort(404) ?", opts: ["Ferme le serveur", "Interrompt la requête et affiche la page « non trouvé »", "Supprime une route", "Vide la session"], a: 1, exp: "findOrFail() l'appelle pour toi quand l'id n'existe pas." },
    { type: "qcm", q: "Comment personnaliser la page 404 du site ?", opts: ["Impossible", "Créer resources/views/errors/404.blade.php", "Modifier vendor/", "Un plugin payant"], a: 1, exp: "Convention : errors/<code>.blade.php par code HTTP." },
    { type: "qcm", q: "Quel code HTTP pour « vous n'avez pas le droit d'accéder à ceci » ?", opts: ["404", "403", "419", "500"], a: 1, exp: "403 Forbidden — le 404 c'est « n'existe pas », le 403 « pas le droit »." },
    { type: "qcm", q: "Stratégie recommandée pour les exceptions dans Laravel :", opts: ["try/catch autour de chaque ligne", "Laisser remonter par défaut (Laravel affiche une erreur propre) et n'attraper que ce qu'on sait traiter", "Ignorer les exceptions", "Les convertir en echo"], a: 1, exp: "Attraper sans savoir quoi faire = masquer les bugs." },
    { type: "qcm", q: "Que montre la page d'erreur quand APP_DEBUG=true ?", opts: ["Un simple « Erreur 500 »", "La stack trace, l'extrait de code, les variables : tout pour déboguer", "Rien", "Une publicité"], a: 1, exp: "Trésor en développement, danger en production." },
    { type: "qcm", q: "Pourquoi APP_DEBUG=false est-il OBLIGATOIRE en production ?", opts: ["Pour la vitesse", "La page détaillée révélerait ton code, tes chemins et potentiellement des secrets aux visiteurs", "Pour économiser la RAM", "C'est esthétique"], a: 1, exp: "Les détails vont dans les logs, pas à l'écran des inconnus." },
    { type: "qcm", q: "Après un redirect()->with('succes', ...), le visiteur recharge la page une 2e fois. Que voit-il ?", opts: ["Le message encore affiché", "Plus de message : le flash a été consommé à l'affichage précédent", "Une erreur", "Le message en double"], a: 1, exp: "Un flash s'efface après une requête : c'est sa définition." },
    { type: "input", q: "Quelle valeur doit avoir APP_DEBUG dans le .env de production ?", a: ["false", "APP_DEBUG=false"], ph: "true / false", exp: "false — à vérifier avant CHAQUE mise en ligne." },
    { type: "vf", q: "Avec Laravel, il faut appeler session_start() au début de chaque contrôleur.", a: false, exp: "Le framework démarre la session automatiquement (middleware de session)." },
    { type: "vf", q: "Un message flash est bien adapté pour stocker le panier d'un site e-commerce.", a: false, exp: "Non : le panier doit SURVIVRE aux requêtes → session normale. Flash = messages éphémères." }
  ],
  final: {
    title: "Exercice final — Le circuit de confirmation",
    intro: `<p>Le livre d'or confirme désormais chaque action. Analyse chaque ligne :</p>
<pre class="pseudo">public function store(Request $request)                  // enregistrer une signature
{
    $valides = $request->validate([                      // valide les champs
        'auteur' => 'required|max:100', 'contenu' => 'required|min:5|max:500',
    ]);
    Signature::create($valides);                         // cree la signature
    return redirect()->route('signatures.index')         // redirige vers la liste...
                     ->with('succes', 'Merci pour ta signature !');   // ...avec un flash de succes
}

public function destroy(int $id)                         // supprimer une signature
{
    Signature::findOrFail($id)->delete();                // charge (404 si absent) puis supprime
    return redirect()->route('signatures.index')         // redirige vers la liste...
                     ->with('succes', 'Signature supprimée.');   // ...avec un flash de succes
}

{{-- layout.blade.php --}}
@if (session('succes'))                                  {{-- SI un flash 'succes' existe... --}}
    &lt;div class="ok"&gt;{{ session('succes') }}&lt;/div&gt;       {{-- ...affiche-le --}}
@endif                                                   {{-- fin du if --}}</pre>`,
    questions: [
      { type: "qcm", q: "Après une signature réussie, que voit le visiteur sur la page de liste ?", opts: ["Rien de spécial", "La bannière « Merci pour ta signature ! » — une seule fois", "Une erreur 419", "Le formulaire à nouveau"], a: 1, exp: "Flash + affichage dans le layout : le circuit complet." },
      { type: "qcm", q: "destroy(42) alors que la signature 42 n'existe pas :", opts: ["Message « Signature supprimée » quand même", "Page 404 : findOrFail interrompt avant le delete et le flash", "Erreur silencieuse", "Suppression de la 41"], a: 1, exp: "L'interruption a lieu dès findOrFail : rien d'autre ne s'exécute." },
      { type: "qcm", q: "Pourquoi le @if (session('succes')) est-il dans le layout et non dans signatures/index ?", opts: ["Erreur du développeur", "Pour que TOUTE page puisse afficher une confirmation sans dupliquer le code", "C'est plus rapide", "Le flash ne marche que dans les layouts"], a: 1, exp: "Écrit une fois, hérité partout." },
      { type: "qcm", q: "En production, une exception imprévue survient dans store(). Que voit le visiteur si APP_DEBUG=false ?", opts: ["La stack trace complète", "Une page d'erreur 500 neutre ; les détails vont dans les logs", "Le code source", "Rien du tout"], a: 1, exp: "Les visiteurs voient une page sobre ; toi, tu liras les logs (leçon 19)." },
      { type: "vf", q: "Le message « Merci pour ta signature ! » reste affiché sur toutes les pages jusqu'à déconnexion.", a: false, exp: "C'est un flash : une requête et il s'efface." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 13 :
// 1. session(['k' => v]) / session('k', defaut) : la session sans plomberie.
// 2. redirect()->with('succes', '...') + @if(session('succes')) au layout :
//    le message flash, compagnon du Post/Redirect/Get.
// 3. abort(404/403) + errors/404.blade.php : erreurs HTTP propres.
// 4. Exceptions : laisser remonter par defaut, attraper ce qu'on sait traiter.
// 5. APP_DEBUG : true en dev, false en prod — TOUJOURS.</pre>
<p>Justement, parlons-en, de cette configuration : demain, plongée dans .env et les environnements.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Blade ici…",
  items: [
  { id: "laravel-flash-membre", title: "Confirmation et erreur en un seul layout", level: 2,
    statement: "Écris (1) la méthode <code>update(Request $request, int $id)</code> qui valide <code>pseudo</code> (obligatoire, max 50), met à jour le membre (404 si inexistant) et redirige vers <code>membres.index</code> avec le flash <code>succes</code> « Profil mis à jour » ; (2) le bloc du layout qui affiche les flashs <code>succes</code> (classe CSS <code>ok</code>) et <code>erreur</code> (classe CSS <code>ko</code>) seulement s'ils existent.",
    hints: [
      "update : $membre = Membre::findOrFail($id); puis $membre->update($valides);",
      "La redirection avec flash : return redirect()->route('membres.index')->with('succes', '...');",
      "Dans le layout, deux @if (session('...')) indépendants."
    ],
    solution: "// MembreController.php\npublic function update(Request $request, int $id)\n{\n    $valides = $request->validate([\n        'pseudo' => 'required|string|max:50',\n    ]);\n\n    $membre = Membre::findOrFail($id);       // 404 si absent\n    $membre->update($valides);               // met à jour les champs validés\n\n    return redirect()->route('membres.index')\n                     ->with('succes', 'Profil mis à jour');\n}\n\n{{-- layout.blade.php --}}\n@if (session('succes'))\n    <div class=\"ok\">{{ session('succes') }}</div>\n@endif\n@if (session('erreur'))\n    <div class=\"ko\">{{ session('erreur') }}</div>\n@endif",
    note: "Valider → agir → rediriger avec flash : ce trio est le squelette de 90 % des méthodes store/update/destroy que tu écriras." }
  ]
};
</script>
