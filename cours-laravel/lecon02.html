<script>
var DAY = {
  num: 2,
  title: "Les routes : routes/web.php",
  subtitle: "Une adresse → du code. Le routeur est le standardiste de ton application.",
  theory: `
<h3>1. Le rôle du routeur</h3>
<p>Rappel : une <strong>requête</strong> est une demande envoyée par le navigateur au serveur. L'<strong>adresse</strong> demandée (par exemple <code>/contact</code>) s'appelle une <strong>URI</strong> (<em>Uniform Resource Identifier</em>, « identifiant de ressource »). Hier, tu as vu que toutes les requêtes passent par <code>public/index.php</code>. Mais alors, comment Laravel sait-il quoi afficher pour <code>/contact</code> ou <code>/livredor</code> ? Grâce au <strong>routeur</strong> : le fichier <code>routes/web.php</code> contient un annuaire qui associe chaque URI à du <strong>code</strong> à exécuter. Image : le routeur est le <em>standardiste</em> d'une entreprise ; selon le numéro demandé, il te transfère au bon service.</p>
<pre class="pseudo">use Illuminate\\Support\\Facades\\Route;   // importe la "facade" Route (raccourci vers le routeur de Laravel)

Route::get('/', function () {              // quand on visite l'adresse "/" (l'accueil) en GET...
    return view('welcome');                // ...renvoie la page welcome (fichier resources/views/welcome.blade.php)
});                                         // fin de cette route

Route::get('/bonjour', function () {       // quand on visite "/bonjour" en GET...
    return 'Bonjour tout le monde !';      // ...le texte renvoye par return devient la reponse envoyee au navigateur
});                                         // fin de cette route</pre>
<p>Ici, <code>Route::get(...)</code> reçoit deux choses : l'adresse, et une <strong>fonction anonyme</strong> (une <em>closure</em> — leçon 9 de PHP : une fonction sans nom, écrite sur place) que Laravel appellera quand quelqu'un visitera cette adresse. Ce que la fonction renvoie avec <code>return</code> devient la réponse envoyée au navigateur. Le <code>::</code> après <code>Route</code> veut dire « appelle la méthode <code>get</code> de l'outil <code>Route</code> » ; <code>Route</code> est une <strong>façade</strong> (un nom court, pratique, qui donne accès au vrai routeur — on y reviendra).</p>
<h3>2. GET, POST : les verbes HTTP</h3>
<p>Un <strong>verbe HTTP</strong> (ou « méthode ») précise l'<em>intention</em> de la requête. Souviens-toi des formulaires PHP : <code>$_GET</code> pour lire l'URL, <code>$_POST</code> pour recevoir un formulaire (leçon 12 de PHP). Laravel reprend cette logique avec une méthode par verbe :</p>
<pre class="pseudo">Route::get('/messages', ...);    // GET  = afficher, lire (aucune donnee modifiee)
Route::post('/messages', ...);   // POST = recevoir un formulaire, ecrire (des donnees changent)</pre>
<p>Deux routes peuvent avoir la <strong>même adresse</strong> avec des verbes différents : GET /messages affiche la liste, POST /messages ajoute un message. Laravel choisit la bonne selon le verbe de la requête.</p>
<h3>3. Paramètres de route</h3>
<p>Une adresse peut contenir une partie <strong>variable</strong> (qui change), écrite entre accolades <code>{ }</code> :</p>
<pre class="pseudo">Route::get('/membre/{nom}', function (string $nom) {   // {nom} = partie variable de l'URL, recopiee dans le parametre $nom
    return 'Profil de ' . $nom;                        // le point "." colle deux textes ; on renvoie "Profil de " suivi du nom
});                                                     // fin de la route
// /membre/aurelia  ->  affiche « Profil de aurelia »  (aurelia a ete capture dans $nom)</pre>
<p>Le paramètre peut être optionnel avec <code>?</code> et une valeur par défaut : <code>{nom?}</code>. On peut aussi le contraindre : <code>-&gt;whereNumber('id')</code> n'accepte que des chiffres.</p>
<h3>4. Nommer ses routes</h3>
<pre class="pseudo">Route::get('/livredor', function () { ... })->name('livredor');   // ->name('livredor') donne un surnom a cette route</pre>
<p>Ailleurs dans le code, <code>route('livredor')</code> génère l'adresse complète à partir de ce surnom. Si un jour tu changes l'URL, tous les liens restent corrects : on ne code jamais les adresses « en dur » (écrites à la main).</p>
<h3>5. Voir toutes ses routes</h3>
<pre class="pseudo">php artisan route:list   # commande Artisan : affiche le tableau de TOUTES les routes du projet (adresse, verbe, nom)</pre>
<div class="warn">Si tu visites une adresse qui n'existe dans aucune route, Laravel renvoie une page <strong>404 Not Found</strong>. Ce n'est pas un bug : c'est la réponse correcte pour « cette page n'existe pas ».</div>
<div class="tip">Règle d'or : GET ne doit jamais modifier de données (on peut recharger sans risque), POST sert aux actions qui changent l'état (ajouter, modifier…). C'est exactement la règle vue à la leçon 12 de PHP.</div>`,
  exercises: [
    { type: "qcm", q: "Quel fichier contient les routes web d'un projet Laravel ?", opts: ["app/routes.php", "routes/web.php", "public/routes.php", "config/routes.json"], a: 1, exp: "routes/web.php : le standard téléphonique de l'application." },
    { type: "qcm", q: "Que fait Route::get('/bonjour', function () { return 'Salut'; }); ?", opts: ["Crée un fichier bonjour.php", "Quand on visite /bonjour en GET, le navigateur reçoit « Salut »", "Enregistre la route dans la base de données", "Compile la closure en fichier statique"], a: 1, exp: "La closure est exécutée à la visite, et son return devient la réponse." },
    { type: "qcm", q: "Quel verbe HTTP utilise-t-on pour recevoir la soumission d'un formulaire qui ajoute des données ?", opts: ["GET", "POST", "VIEW", "SEND"], a: 1, exp: "POST pour les actions qui modifient l'état — comme $_POST au cours PHP." },
    { type: "input", q: "Écris la syntaxe du paramètre de route qui capture un identifiant nommé id (avec ses accolades).", a: ["{id}"], ph: "ex : {...}", exp: "Route::get('/message/{id}', ...) — la valeur est passée à la fonction." },
    { type: "qcm", q: "Route::get('/membre/{nom}', function (string $nom) { ... }) : d'où vient la valeur de $nom ?", opts: ["Du fichier .env", "De l'URL visitée : /membre/aurelia → $nom vaut « aurelia »", "D'une base de données", "Elle est toujours vide"], a: 1, exp: "Laravel extrait la partie variable de l'adresse et l'injecte en paramètre." },
    { type: "qcm", q: "Deux routes Route::get('/messages',...) et Route::post('/messages',...) peuvent-elles coexister ?", opts: ["Non, l'adresse doit être unique", "Oui : même adresse, verbes différents = routes différentes", "Oui, mais seulement en production", "Non, la seconde route écrase silencieusement la première"], a: 1, exp: "GET /messages affiche, POST /messages ajoute : c'est un motif très courant." },
    { type: "qcm", q: "À quoi sert ->name('livredor') sur une route ?", opts: ["À afficher le nom dans le navigateur", "À générer l'URL avec route('livredor') sans coder l'adresse en dur", "À protéger la route", "À la rendre plus rapide"], a: 1, exp: "Si l'URL change un jour, tous les liens générés avec route() restent valides." },
    { type: "input", q: "Quelle commande Artisan affiche le tableau de toutes les routes du projet ?", a: ["php artisan route:list", "artisan route:list", "route:list"], ph: "commande", exp: "php artisan route:list — très utile pour déboguer." },
    { type: "qcm", q: "Tu visites /contact mais aucune route ne correspond. Que renvoie Laravel ?", opts: ["Une page blanche", "Une erreur 404 Not Found", "La page d'accueil", "Un téléchargement"], a: 1, exp: "404 = « cette ressource n'existe pas ». C'est la réponse HTTP correcte." },
    { type: "qcm", q: "Comment rendre optionnel le paramètre {page} d'une route ?", opts: ["Route::get('/liste/{page?}', ...) avec une valeur par défaut dans la fonction", "C'est impossible", "En écrivant {page!}", "En ajoutant ->optional() à la route"], a: 0, exp: "{page?} + function ($page = 1) : sans valeur dans l'URL, on prend 1." },
    { type: "qcm", q: "Que fait ->whereNumber('id') ajouté à une route ?", opts: ["Convertit id en texte", "N'accepte la route que si {id} est composé de chiffres", "Compte les visites", "Trie les routes"], a: 1, exp: "/message/12 passe, /message/abc renvoie 404 : validation dès le routeur." },
    { type: "qcm", q: "Pourquoi GET ne doit-il jamais modifier de données ?", opts: ["Parce que c'est plus lent", "Un GET peut être rechargé, mis en favori, préchargé : le rejouer doit être sans danger", "Parce que GET ne peut pas transporter de données", "GET peut modifier des données sans problème"], a: 1, exp: "La règle vue au cours PHP (leçon 12) : lecture = GET, action = POST." },
    { type: "qcm", q: "Dans Route::get('/', function () { return view('welcome'); }), que renvoie view('welcome') ?", opts: ["Le texte « welcome »", "La page HTML construite à partir de resources/views/welcome.blade.php", "Une erreur", "Un fichier JSON"], a: 1, exp: "view() charge un template Blade — on les écrit nous-mêmes dès la leçon 4." },
    { type: "vf", q: "Avec Laravel, pour créer une page /contact, il faut créer un fichier contact.php à la racine du site.", a: false, exp: "Non : on déclare une route Route::get('/contact', ...) — plus aucun fichier par page." },
    { type: "vf", q: "Une closure (fonction anonyme) passée à Route::get n'est exécutée que lorsqu'un visiteur demande cette adresse.", a: true, exp: "Le routeur enregistre la fonction, puis l'appelle à la demande : inversion de contrôle en action." }
  ],
  final: {
    title: "Exercice final — Lire un fichier de routes",
    intro: `<p>Voici le début du fichier <code>routes/web.php</code> du futur livre d'or. Analyse-le ligne par ligne :</p>
<pre class="pseudo">Route::get('/', function () {              // GET sur l'accueil "/"...
    return view('accueil');                // ...renvoie la vue accueil
})->name('accueil');                       // surnom de cette route : "accueil"

Route::get('/messages', function () {      // GET sur "/messages"...
    return 'Liste des messages';           // ...renvoie ce texte (la liste)
})->name('messages.index');                // surnom : "messages.index" (index = la liste)

Route::post('/messages', function () {     // POST sur "/messages" (meme adresse, autre verbe)...
    return 'Message ajouté !';             // ...renvoie ce texte apres l'ajout
})->name('messages.store');                // surnom : "messages.store" (store = enregistrer)

Route::get('/messages/{id}', function (int $id) {   // GET sur "/messages/{id}" ; {id} recopie dans $id (entier)
    return 'Détail du message n°' . $id;            // renvoie "Detail du message n°" suivi du numero
})->whereNumber('id')->name('messages.show');       // {id} doit etre un nombre ; surnom : "messages.show"</pre>`,
    questions: [
      { type: "qcm", q: "Un visiteur tape http://localhost:8000/messages dans son navigateur. Quelle route s'exécute ?", opts: ["messages.store (POST)", "messages.index (GET) : taper une adresse = requête GET", "messages.show", "accueil"], a: 1, exp: "Le navigateur fait toujours du GET quand on tape une adresse." },
      { type: "qcm", q: "Que reçoit le visiteur qui demande GET /messages/7 ?", opts: ["Une erreur 404", "« Détail du message n°7 »", "« Liste des messages »", "La page d'accueil"], a: 1, exp: "{id} capture 7, whereNumber valide (7 est bien un nombre), la closure reçoit $id = 7." },
      { type: "qcm", q: "Et GET /messages/abc ?", opts: ["« Détail du message n°abc »", "Une erreur 404 : whereNumber('id') rejette les non-nombres", "« Liste des messages »", "Une erreur 500"], a: 1, exp: "La contrainte whereNumber filtre dès le routeur." },
      { type: "qcm", q: "Comment générer proprement un lien vers la liste des messages dans le code ?", opts: ["En écrivant « /messages » en dur", "route('messages.index')", "link('/messages')", "get('messages')"], a: 1, exp: "Le nom de route protège tous les liens contre un futur changement d'URL." },
      { type: "qcm", q: "Pourquoi l'ajout de message utilise-t-il POST /messages et non GET /messages/ajouter ?", opts: ["Par hasard", "Parce qu'ajouter modifie les données : c'est une action, donc POST", "Parce que GET est interdit dans Laravel", "Pour économiser une route"], a: 1, exp: "Lecture = GET, écriture = POST : la règle d'or du web." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 2 :
// 1. routes/web.php associe URI + verbe HTTP  ->  code a executer.
// 2. Route::get pour lire, Route::post pour agir (meme regle qu'en PHP pur).
// 3. {param} capture une partie de l'URL et l'injecte dans la fonction ;
//    {param?} le rend optionnel, whereNumber le contraint.
// 4. ->name('xxx') + route('xxx') : plus jamais d'URL en dur.
// 5. php artisan route:list pour tout voir ; adresse inconnue  ->  404.</pre>
<p>Demain, on remplace ces closures par de vraies classes : les contrôleurs.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Laravel ici…",
  items: [
  { id: "laravel-routes-livredor", title: "Les premières routes du livre d'or", level: 1,
    statement: "Écris trois routes pour le livre d'or : <code>GET /</code> qui renvoie la vue <code>accueil</code> (route nommée <code>accueil</code>), <code>GET /signatures/{id}</code> qui renvoie le texte <code>\"Signature n°\" . $id</code> en n'acceptant que des nombres, et <code>POST /signatures</code> qui renvoie le texte <code>\"Signature enregistrée\"</code> (route nommée <code>signatures.store</code>).",
    atoi: {cmd: "php artisan route:list\n# puis, serveur demarre avec  php artisan serve :\ncurl -i http://localhost:8000/signatures/42\ncurl -i http://localhost:8000/signatures/abc", expected: "route:list liste notamment :\n  GET|HEAD   /                -> name: accueil\n  GET|HEAD   signatures/{id}   (contrainte : id numerique)\n  POST       signatures        -> name: signatures.store\n\ncurl /signatures/42  -> HTTP 200, corps : Signature n°42\ncurl /signatures/abc -> HTTP 404 (whereNumber rejette abc)"},
    checklist: ["Les trois routes utilisent-elles le bon verbe (GET, GET, POST) ?", "La contrainte ->whereNumber('id') est-elle bien sur /signatures/{id} ?", "Les noms accueil et signatures.store sont-ils chaines avec ->name(...) ?", "La route GET / renvoie-t-elle view('accueil') et non une chaine ?"],
    hints: [
      "Chaque route s'écrit Route::verbe('adresse', function () { return ...; });",
      "Le paramètre {id} doit apparaître dans l'adresse ET en paramètre de la closure ; la contrainte s'ajoute avec ->whereNumber('id').",
      "Le nom s'ajoute en chaînant ->name('...') après la closure."
    ],
    solution: "Route::get('/', function () {\n    return view('accueil');           // charge resources/views/accueil.blade.php\n})->name('accueil');\n\nRoute::get('/signatures/{id}', function (int $id) {\n    return 'Signature n°' . $id;      // $id vient de l'URL\n})->whereNumber('id');                // /signatures/abc → 404\n\nRoute::post('/signatures', function () {\n    return 'Signature enregistrée';   // POST = action qui modifie les données\n})->name('signatures.store');",
    note: "Le trio adresse + verbe + closure est la base de tout Laravel. Dès demain, la closure sera remplacée par une méthode de contrôleur." }
  ]
};
</script>
