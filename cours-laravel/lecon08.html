<script>
var DAY = {
  num: 8,
  title: "Les migrations : créer les tables",
  subtitle: "La structure de ta base de données, versionnée comme du code.",
  theory: `
<h3>1. Le problème des bases « à la main »</h3>
<p>Rappel : une <strong>base de données</strong> est un classeur électronique organisé en <strong>tables</strong> (des tableaux). Chaque table a des <strong>colonnes</strong> (les champs, ex. auteur, contenu) et des <strong>lignes</strong> (les enregistrements). Au cours PHP (leçon 18), tu créais tes tables à la souris dans phpMyAdmin. Problème en équipe : comment ton collègue obtient-il la même structure ? Comment revenir en arrière après une erreur ? Les <strong>migrations</strong> résolvent ça : la structure de la base est décrite <strong>en code PHP</strong>, <em>versionnée</em> (gardée dans l'historique du projet, comme le code) — on peut donc la rejouer et l'annuler.</p>
<h3>2. Configurer la connexion : .env</h3>
<pre class="pseudo">DB_CONNECTION=sqlite      # choix du moteur de base de donnees : ici "sqlite" (ou "mysql")
# Pour MySQL :            # ces lignes commencent par # : elles sont en commentaire (desactivees)
# DB_HOST=127.0.0.1       # adresse du serveur de base de donnees
# DB_DATABASE=livredor    # nom de la base a utiliser
# DB_USERNAME=root        # nom d'utilisateur de la base
# DB_PASSWORD=            # mot de passe (vide ici)</pre>
<p>Par défaut, Laravel utilise <strong>SQLite</strong> : la base est un simple fichier <code>database/database.sqlite</code> — parfait pour apprendre, zéro installation. <strong>MySQL</strong> est un serveur de base de données plus costaud, utilisé en production.</p>
<h3>3. Créer une migration</h3>
<pre class="pseudo">php artisan make:migration create_signatures_table   # cree un fichier de migration pour creer la table "signatures"</pre>
<p>Artisan génère un fichier horodaté (préfixé par la date) dans <code>database/migrations/</code> avec deux méthodes : <code>up()</code> décrit ce qu'on ajoute, <code>down()</code> décrit comment annuler.</p>
<pre class="pseudo">public function up(): void                            // up() : ce qu'on FAIT quand on applique la migration
{                                                     // debut de up()
    Schema::create('signatures', function (Blueprint $table) {   // cree la table "signatures" ; $table sert a decrire ses colonnes
        $table->id();                                 // cle primaire auto-incrementee nommee "id"
        $table->string('auteur', 100);                // colonne texte "auteur" -> VARCHAR(100)
        $table->text('contenu');                      // colonne texte long "contenu" -> TEXT
        $table->boolean('publie')->default(true);     // colonne vrai/faux "publie", valeur par defaut vrai
        $table->timestamps();                         // ajoute created_at et updated_at (dates auto)
    });                                               // fin de la description de la table
}                                                     // fin de up()

public function down(): void                          // down() : comment ANNULER la migration
{                                                     // debut de down()
    Schema::dropIfExists('signatures');               // supprime la table "signatures" : l'inverse exact de up()
}                                                     // fin de down()</pre>
<h3>4. Exécuter et annuler</h3>
<pre class="pseudo">php artisan migrate            # execute les migrations pas encore appliquees
php artisan migrate:rollback   # annule le dernier lot de migrations (appelle leurs down())
php artisan migrate:fresh      # supprime TOUTES les tables et rejoue tout (developpement UNIQUEMENT !)</pre>
<p>Laravel note dans une table spéciale <code>migrations</code> ce qui a déjà été exécuté : relancer <code>migrate</code> ne rejoue jamais deux fois la même migration.</p>
<h3>5. Les types de colonnes courants</h3>
<pre class="pseudo">$table->string('nom', 50)      // -> VARCHAR(50) : texte court limite a 50 caracteres
$table->text('description')    // -> TEXT : texte long
$table->integer('age')         // -> INT : nombre entier
$table->decimal('prix', 8, 2)  // -> DECIMAL(8,2) : nombre a 2 decimales (ex. prix)
$table->boolean('actif')       // -> BOOLEAN : vrai/faux
$table->date('naissance')      // -> DATE : une date
->nullable()                   // autorise la valeur vide (NULL)
->default(valeur)              // definit une valeur par defaut
->unique()                     // interdit deux fois la meme valeur (contrainte d'unicite)</pre>
<div class="warn">Ne modifie JAMAIS une migration déjà exécutée et partagée : crée une NOUVELLE migration pour changer la table (ex. add_email_to_signatures_table). L'historique doit rester rejouable.</div>
<div class="tip">Convention de nommage : les tables au pluriel (signatures), en anglais si projet international. La convention paie dès demain : Eloquent devine tout seul le nom de la table !</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une migration ?", opts: ["Un transfert de serveur", "Un fichier PHP qui décrit un changement de structure de la base, versionnable", "Une sauvegarde des données", "Un export SQL"], a: 1, exp: "La structure devient du code : partageable, rejouable, annulable." },
    { type: "qcm", q: "Quel avantage principal par rapport à la création manuelle dans phpMyAdmin ?", opts: ["C'est plus joli", "Toute l'équipe reconstruit exactement la même base avec php artisan migrate", "C'est plus rapide à taper", "phpMyAdmin est payant"], a: 1, exp: "Fini le « ça marche chez moi mais pas chez toi »." },
    { type: "input", q: "Quelle commande exécute les migrations en attente ?", a: ["php artisan migrate", "artisan migrate"], ph: "commande", exp: "php artisan migrate — la table migrations mémorise ce qui est fait." },
    { type: "qcm", q: "Que contient la méthode down() d'une migration ?", opts: ["Le code de création", "L'inverse exact de up(), pour pouvoir annuler", "Les données de test", "La configuration"], a: 1, exp: "up construit, down démolit : migrate:rollback appelle down." },
    { type: "qcm", q: "Que fait $table->id() ?", opts: ["Un champ texte nommé id", "Une clé primaire BIGINT auto-incrémentée nommée id", "Un index secondaire", "Rien"], a: 1, exp: "L'équivalent du id INT AUTO_INCREMENT PRIMARY KEY de la leçon 18 de PHP." },
    { type: "qcm", q: "Que crée $table->timestamps() ?", opts: ["Un chronomètre", "Les colonnes created_at et updated_at, gérées automatiquement", "Une colonne date unique", "Un déclencheur SQL"], a: 1, exp: "Eloquent les remplira tout seul à chaque création/modification." },
    { type: "qcm", q: "Quel type de colonne pour un texte court limité à 100 caractères ?", opts: ["$table->text('x')", "$table->string('x', 100)", "$table->char100('x')", "$table->varchar('x')"], a: 1, exp: "string → VARCHAR ; text → TEXT (long, sans limite pratique)." },
    { type: "qcm", q: "Comment autoriser la colonne email à être vide (NULL) ?", opts: ["$table->string('email')->nullable()", "$table->string('email')->empty()", "$table->null('email')", "C'est automatique"], a: 0, exp: "Sans ->nullable(), la colonne est NOT NULL par défaut." },
    { type: "qcm", q: "Quelle base de données Laravel utilise-t-il par défaut, sans aucune installation ?", opts: ["MySQL", "SQLite : un simple fichier database/database.sqlite", "Oracle", "MongoDB"], a: 1, exp: "Idéal pour apprendre ; on passe à MySQL en changeant le .env." },
    { type: "qcm", q: "Où configure-t-on la connexion à la base ?", opts: ["Dans la migration", "Dans le fichier .env (DB_CONNECTION, DB_DATABASE…)", "Dans routes/web.php", "Dans le contrôleur"], a: 1, exp: "La config locale vit dans .env — souviens-toi de la leçon 1." },
    { type: "qcm", q: "php artisan migrate:fresh en PRODUCTION, bonne idée ?", opts: ["Oui, ça nettoie", "Catastrophique : il supprime toutes les tables et leurs DONNÉES", "Oui, si on est vendredi", "C'est la commande de déploiement standard"], a: 1, exp: "fresh = drop all + replay : réservé au développement." },
    { type: "qcm", q: "La table signatures existe, tu veux ajouter une colonne email. Bonne pratique ?", opts: ["Modifier la migration d'origine et refaire migrate", "Créer une NOUVELLE migration add_email_to_signatures_table", "Éditer la base à la main", "Supprimer la table"], a: 1, exp: "Une migration exécutée est figée : l'historique doit rester rejouable par toute l'équipe." },
    { type: "qcm", q: "Pourquoi nommer la table « signatures » (pluriel) plutôt que « signature » ?", opts: ["Pour l'esthétique", "Convention Laravel : Eloquent déduira la table à partir du modèle Signature", "Le singulier est interdit en SQL", "Aucune raison"], a: 1, exp: "Modèle singulier ↔ table plurielle : la convention évite la configuration." },
    { type: "vf", q: "Relancer php artisan migrate rejoue toutes les migrations depuis le début à chaque fois.", a: false, exp: "La table migrations trace ce qui est fait : seules les nouvelles s'exécutent." },
    { type: "vf", q: "Avec ->default(true), la colonne prend automatiquement la valeur true si on ne la fournit pas.", a: true, exp: "Les valeurs par défaut se définissent dès la migration." }
  ],
  final: {
    title: "Exercice final — La table des signatures",
    intro: `<p>Voici la migration du livre d'or. Analyse chaque ligne :</p>
<pre class="pseudo">public function up(): void                            // ce qu'on applique
{
    Schema::create('signatures', function (Blueprint $table) {   // cree la table signatures
        $table->id();                                 // cle primaire "id"
        $table->string('auteur', 100);                // VARCHAR(100)
        $table->string('email')->nullable();          // VARCHAR, NULL autorise
        $table->text('contenu');                      // TEXT
        $table->boolean('publie')->default(true);     // BOOLEAN, vrai par defaut
        $table->timestamps();                         // created_at + updated_at
    });
}

public function down(): void                          // ce qu'on annule
{
    Schema::dropIfExists('signatures');               // supprime la table
}</pre>
<pre class="pseudo">$ php artisan migrate                                 # on lance les migrations
   INFO  Running migrations.                          # Laravel demarre l'execution
  2026_07_04_000001_create_signatures_table ........ DONE   # cette migration est appliquee avec succes (DONE)</pre>`,
    questions: [
      { type: "qcm", q: "Combien de colonnes la table signatures contient-elle au total ?", opts: ["5", "6", "7 : id, auteur, email, contenu, publie, created_at, updated_at", "4"], a: 2, exp: "N'oublie pas que timestamps() en crée DEUX." },
      { type: "qcm", q: "Peut-on insérer une signature sans email ?", opts: ["Non, toutes les colonnes sont obligatoires", "Oui : email est nullable()", "Oui, mais publie devient false", "Seulement en SQLite"], a: 1, exp: "nullable() autorise NULL pour cette colonne uniquement." },
      { type: "qcm", q: "On insère une signature sans préciser « publie ». Quelle valeur prend la colonne ?", opts: ["NULL", "true, grâce à ->default(true)", "false", "0 obligatoirement"], a: 1, exp: "La valeur par défaut s'applique." },
      { type: "qcm", q: "Tu lances php artisan migrate une seconde fois. Résultat ?", opts: ["La table est recréée (données perdues)", "« Nothing to migrate » : la migration est déjà tracée comme exécutée", "Erreur : table exists", "Les colonnes sont dupliquées"], a: 1, exp: "La table migrations évite tout double passage." },
      { type: "qcm", q: "php artisan migrate:rollback maintenant. Que se passe-t-il ?", opts: ["Rien", "down() s'exécute : la table signatures est supprimée", "Seules les données sont vidées", "La migration est éditée"], a: 1, exp: "rollback = annuler le dernier lot en appelant les down()." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 8 :
// 1. Migration = structure de la base EN CODE (up / down).
// 2. make:migration cree, migrate execute, migrate:rollback annule.
// 3. id() + timestamps() : le trio de base de toute table Laravel.
// 4. string/text/integer/boolean + nullable()/default()/unique().
// 5. Migration partagee = figee : on AJOUTE une migration pour modifier.
// 6. Tables au pluriel : Eloquent en depend des demain.</pre>
<p>La table existe, mais elle est vide et on ne sait pas encore lui parler. Demain : Eloquent, l'ORM magique.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ta migration ici…",
  items: [
  { id: "laravel-migration-membres", title: "La migration de la table membres", level: 2,
    statement: "Écris la méthode <code>up()</code> d'une migration créant la table <code>membres</code> : clé primaire, <code>pseudo</code> (chaîne de 50, unique), <code>email</code> (chaîne, nullable), <code>age</code> (entier), <code>actif</code> (booléen, vrai par défaut) et les horodatages automatiques. Écris aussi le <code>down()</code>.",
    hints: [
      "Schema::create('membres', function (Blueprint $table) { ... });",
      "L'unicité se chaîne : ->unique() ; la valeur par défaut : ->default(true).",
      "down() fait l'inverse exact : Schema::dropIfExists('membres');"
    ],
    solution: "public function up(): void\n{\n    Schema::create('membres', function (Blueprint $table) {\n        $table->id();                              // clé primaire auto\n        $table->string('pseudo', 50)->unique();    // VARCHAR(50) UNIQUE\n        $table->string('email')->nullable();       // NULL autorisé\n        $table->integer('age');\n        $table->boolean('actif')->default(true);   // vrai par défaut\n        $table->timestamps();                      // created_at / updated_at\n    });\n}\n\npublic function down(): void\n{\n    Schema::dropIfExists('membres');               // l'inverse de up()\n}",
    note: "Relis ton down() à chaque migration : c'est ta bouée de sauvetage le jour où il faut annuler. Un down() vide est une dette." }
  ]
};
