<body>
<script>
var DAY = {
  num: 20,
  title: "Projet guidé : le livre d'or en Laravel",
  subtitle: "Tout assembler : le projet du cours PHP, version framework professionnel.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>cahier des charges</strong> est la liste de ce que l'application doit faire. Le livre d'or de la leçon 20 de PHP, réécrit en Laravel avec tout ce que tu as appris :</p>
<ul>
<li>Visiteurs : voir les signatures publiées (paginées), signer (validation complète).</li>
<li>Membres connectés : leurs signatures sont rattachées à leur compte.</li>
<li>Admin : dépublier/supprimer n'importe quelle signature.</li>
</ul>
<h3>2. Le plan de construction (l'ordre professionnel)</h3>
<pre class="pseudo">1. Migration        # -> structure de la table signatures (les fondations : les donnees)
2. Modele           # -> Signature ($fillable + relation user)
3. Routes           # -> publiques, protegees (auth), admin
4. Controleur       # -> index, create, store, destroy (l'orchestration)
5. Vues             # -> layout, liste, formulaire (l'affichage)
6. Tests            # -> nominal + erreurs + droits (la preuve que tout marche)</pre>
<p>Toujours des données vers l'affichage : on ne dessine pas les vues d'une table qui n'existe pas.</p>
<h3>3. Les pièces maîtresses</h3>
<pre class="pseudo">// Migration
Schema::create('signatures', function (Blueprint $table) {   // cree la table signatures
    $table->id();                                            // cle primaire
    $table->foreignId('user_id')->nullable()->constrained(); // FK vers users ; nullable = signature anonyme possible
    $table->string('auteur', 100);                           // nom affiche (VARCHAR 100)
    $table->text('contenu');                                 // le message
    $table->boolean('publie')->default(true);                // publiee par defaut
    $table->timestamps();                                    // created_at + updated_at
});

// Modele
class Signature extends Model {                              // modele lie a la table signatures
    protected $fillable = ['auteur', 'contenu', 'user_id'];  // colonnes remplissables en masse
    public function user() { return $this->belongsTo(User::class); }   // une signature appartient a un user
}

// Routes
Route::get('/', [SignatureController::class, 'index'])->name('signatures.index');          // liste (public)
Route::get('/signer', [SignatureController::class, 'create'])->name('signatures.create');  // formulaire (public)
Route::post('/signer', [SignatureController::class, 'store'])->name('signatures.store');   // enregistrement (public)
Route::delete('/signatures/{id}', [SignatureController::class, 'destroy'])                 // suppression...
     ->middleware(['auth', 'admin'])->name('signatures.destroy');                          // ...reservee aux admins connectes</pre>
<h3>4. Le contrôleur, cœur du projet</h3>
<pre class="pseudo">public function index() {                                     // affiche la liste
    return view('signatures.index', [
        'signatures' => Signature::with('user')->where('publie', true)   // avec auteurs (anti N+1), publiees seulement
                                 ->latest()->paginate(10),               // recentes d'abord, 10 par page
    ]);
}

public function store(Request $request) {                     // enregistre une signature
    $valides = $request->validate([                           // valide les champs
        'auteur'  => 'required|string|max:100',
        'contenu' => 'required|string|min:5|max:500',
    ]);
    $valides['user_id'] = Auth::id();          // l'id vient du SERVEUR (null si visiteur anonyme)
    Signature::create($valides);               // cree la signature
    return redirect()->route('signatures.index')              // redirige (Post/Redirect/Get)...
                     ->with('succes', 'Merci pour ta signature !');   // ...avec un flash de confirmation
}</pre>
<h3>5. La check-list finale</h3>
<pre class="pseudo">✔ @csrf dans le formulaire       ✔ {{ }} partout dans les vues        # anti-CSRF et anti-XSS
✔ old() + @error sur les champs  ✔ paginate + links                  # confort de saisie et navigation
✔ with('user') contre le N+1     ✔ route DELETE derriere auth+admin   # performance et securite
✔ php artisan test : tout vert                                        # la preuve finale</pre>
<div class="tip">Compare ce projet avec le livre d'or PHP de la leçon 20 : mêmes fonctionnalités, mais validation, sécurité CSRF/XSS, pagination et tests sont désormais systématiques — c'est ça, l'apport d'un framework.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'ordre de construction professionnel ?", opts: ["Vues → routes → base", "Migration → modèle → routes → contrôleur → vues → tests", "Tests → vues → base", "Au feeling"], a: 1, exp: "Des fondations (données) vers la façade (affichage), puis la preuve (tests)." },
    { type: "qcm", q: "Pourquoi user_id est-il nullable() dans la migration ?", opts: ["Erreur", "Les visiteurs anonymes peuvent signer : pas de compte, pas d'id", "Pour la vitesse", "constrained l'exige"], a: 1, exp: "La règle métier (anonymes autorisés) se lit dans le schéma." },
    { type: "qcm", q: "Que vaut Auth::id() pour un visiteur non connecté ?", opts: ["0", "null — parfait pour notre colonne nullable", "-1", "Une exception"], a: 1, exp: "$valides['user_id'] = Auth::id() gère les deux cas en une ligne." },
    { type: "qcm", q: "Pourquoi la route destroy est-elle en DELETE derrière ['auth', 'admin'] ?", opts: ["Pour le style", "Suppression = action destructive : verbe adapté + réservée aux admins connectés", "DELETE est plus rapide", "Le CSRF l'exige"], a: 1, exp: "Verbe sémantique + protection en profondeur." },
    { type: "qcm", q: "Dans la vue, le formulaire de suppression contient @csrf et quoi d'autre ?", opts: ["@auth", "@method('DELETE') pour simuler le verbe", "@delete", "Rien"], a: 1, exp: "Les formulaires HTML ne connaissent que GET/POST : on simule." },
    { type: "qcm", q: "Un anonyme signe « Bravo ! » (6 caractères, auteur rempli). Verdict ?", opts: ["Refusé : il faut un compte", "Accepté : min:5 passe, user_id sera null", "Refusé : min:5 échoue", "Erreur 500"], a: 1, exp: "6 ≥ 5 : valide. L'anonymat est prévu par le schéma." },
    { type: "qcm", q: "Pourquoi with('user') dans index() ?", opts: ["Pour l'authentification", "La vue affiche le pseudo de l'auteur : sans with, N+1 requêtes", "C'est obligatoire", "Pour le tri"], a: 1, exp: "10 signatures affichées = 2 requêtes au lieu de 11." },
    { type: "qcm", q: "Où s'affiche « Merci pour ta signature ! » ?", opts: ["Dans le formulaire", "Sur la liste après redirection, via le flash et le layout", "Dans les logs", "En popup JavaScript"], a: 1, exp: "Post/Redirect/Get + session('succes') dans le layout." },
    { type: "qcm", q: "Un admin veut dépublier (et non supprimer) une signature. Quelle approche ?", opts: ["DELETE quand même", "Une route PATCH/POST qui passe publie à false : la donnée reste, elle n'est plus affichée", "Modifier la base à la main", "Vider le cache"], a: 1, exp: "index() filtre where('publie', true) : dépublier = invisible mais conservé." },
    { type: "qcm", q: "Quel test prouve que la suppression est bien réservée aux admins ?", opts: ["Un test qui supprime en tant qu'admin", "Un test où un NON-admin tente le DELETE et reçoit 403 (et la ligne existe toujours)", "Un test de la page d'accueil", "Aucun besoin"], a: 1, exp: "Tester le refus est aussi important que tester le succès (leçon 15)." },
    { type: "qcm", q: "Le formulaire de signature doit contenir, pour l'expérience utilisateur :", opts: ["Seulement les champs", "old() sur chaque champ et @error sous chacun", "Un captcha obligatoire", "Du JavaScript"], a: 1, exp: "Erreur affichée + saisie conservée : le duo de la leçon 12." },
    { type: "qcm", q: "Dans quelle vue vit l'affichage du flash succes ?", opts: ["signatures/index", "Le layout : toutes les pages en profitent", "create", "Aucune"], a: 1, exp: "Écrit une fois (leçon 13), utilisé partout." },
    { type: "qcm", q: "Ce projet réutilise le projet du cours PHP (leçon 20). Qu'est-ce qui a le PLUS changé ?", opts: ["Les fonctionnalités", "La robustesse : validation, CSRF, XSS, pagination, tests et droits sont systématiques", "Le langage", "La couleur du site"], a: 1, exp: "Le framework industrialise ce que tu bricolais à la main." },
    { type: "vf", q: "On aurait pu écrire les vues avant la migration.", a: false, exp: "Possible mais déconseillé : on afficherait des données dont la forme n'est pas encore décidée." },
    { type: "vf", q: "Grâce à foreignId('user_id')->constrained(), supprimer un utilisateur qui a des signatures échouera par défaut.", a: true, exp: "L'intégrité référentielle protège ; on peut choisir cascadeOnDelete() ou nullOnDelete() explicitement." }
  ],
  final: {
    title: "Exercice final — La revue de code du projet",
    intro: `<p>Ton collègue propose cette version de store(). Fais la revue, ligne par ligne :</p>
<pre class="pseudo">public function store(Request $request)
{
    $s = new Signature();                          // cree un objet Signature vide
    $s->auteur  = $request->input('auteur');       // remplit l'auteur depuis le formulaire
    $s->contenu = $request->input('contenu');      // remplit le contenu depuis le formulaire
    $s->user_id = $request->input('user_id');      // ← ligne A : DANGER, l'id vient du client !
    $s->save();                                    // enregistre en base
    return view('signatures.index');               // ← ligne B : DANGER, vue apres un POST + sans donnees
}</pre>`,
    questions: [
      { type: "qcm", q: "Problème le plus grave, ligne A ?", opts: ["Faute de frappe", "user_id vient du FORMULAIRE : n'importe qui peut signer au nom de n'importe qui ! Il faut Auth::id()", "input est obsolète", "Il manque un point-virgule"], a: 1, exp: "Une donnée d'identité ne vient JAMAIS du client : toujours du serveur (Auth)." },
      { type: "qcm", q: "Autre manque critique dans cette méthode ?", opts: ["Un commentaire", "Aucune validation : contenu vide ou de 10 000 caractères accepté", "Le nom de la variable", "Le use en haut"], a: 1, exp: "$request->validate([...]) est la première ligne de tout store." },
      { type: "qcm", q: "Problème ligne B ?", opts: ["Rien", "return view() après un POST : le F5 resoumettra le formulaire ; il faut redirect()->route(...)", "view est trop lent", "Il manque le layout"], a: 1, exp: "Post/Redirect/Get, leçon 6 : après une écriture, on redirige." },
      { type: "qcm", q: "De plus, view('signatures.index') est appelée SANS données. Conséquence ?", opts: ["Aucune", "Erreur « Undefined variable $signatures » dans la vue", "La liste s'affiche", "La page est blanche mais valide"], a: 1, exp: "La vue attend des variables que personne ne lui fournit — encore un argument pour la redirection." },
      { type: "qcm", q: "La version corrigée tient en combien d'idées ?", opts: ["Dix", "Trois : validate → create avec Auth::id() → redirect + flash", "Une", "Sept"], a: 1, exp: "Le motif canonique que tu connais par cœur maintenant." }
    ],
    solution: `<pre class="pseudo">// La version corrigee, canonique :
public function store(Request $request)
{
    // 1. Valider (et filtrer) les entrees
    $valides = $request->validate([
        'auteur'  => 'required|string|max:100',
        'contenu' => 'required|string|min:5|max:500',
    ]);

    // 2. L'identite vient du SERVEUR, jamais du formulaire
    $valides['user_id'] = Auth::id();
    Signature::create($valides);

    // 3. Post/Redirect/Get + confirmation
    return redirect()->route('signatures.index')
                     ->with('succes', 'Merci pour ta signature !');
}</pre>
<p>Le projet est complet et robuste. Demain : l'examen final — 21 leçons en une page.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Laravel ici…",
  items: [
  { id: "laravel-projet-depublier", title: "Dépublier une signature (admin)", level: 3,
    statement: "Ajoute la fonctionnalité « dépublier » : (1) la route <code>PATCH /signatures/{id}/depublier</code>, nommée <code>signatures.depublier</code>, protégée par <code>auth</code> et <code>admin</code> ; (2) la méthode <code>depublier(int $id)</code> : passe <code>publie</code> à false (404 si absent) et redirige vers la liste avec le flash « Signature dépubliée. » ; (3) le formulaire Blade du bouton, affiché uniquement si <code>@can('administrer')</code>.",
    atoi: {cmd: "php artisan route:list --path=depublier\n# serveur demarre, connecte en admin, depuis le bouton Depublier de la liste.", expected: "route:list montre : PATCH signatures/{id}/depublier -> name signatures.depublier,\nmiddleware auth, admin. En admin, l'appel PATCH -> HTTP 302 vers signatures.index\navec le flash « Signature depubliee. » et publie passe a false en base.\nUn non-admin -> HTTP 403 (middleware admin). Le bouton n'apparait que si @can('administrer')."},
    checklist: ["La route PATCH est-elle nommee signatures.depublier et protegee par ['auth','admin'] ?", "depublier() fait-il findOrFail($id) puis update(['publie' => false]) ?", "Redirige-t-il vers signatures.index avec ->with('succes', 'Signature depubliee.') ?", "Le formulaire du bouton est-il dans @can('administrer') avec @csrf + @method('PATCH') ?"],
    hints: [
      "Route::patch('/signatures/{id}/depublier', [...])->middleware(['auth','admin'])->name('signatures.depublier');",
      "Dans la méthode : findOrFail, puis $s->update(['publie' => false]);",
      "Le formulaire : method POST + @method('PATCH') + @csrf, dans un bloc @can … @endcan."
    ],
    solution: "// routes/web.php\nRoute::patch('/signatures/{id}/depublier',\n        [SignatureController::class, 'depublier'])\n     ->middleware(['auth', 'admin'])\n     ->name('signatures.depublier');\n\n// SignatureController.php\npublic function depublier(int $id)\n{\n    $signature = Signature::findOrFail($id);      // 404 si absente\n    $signature->update(['publie' => false]);      // la donnée reste en base\n\n    return redirect()->route('signatures.index')\n                     ->with('succes', 'Signature dépubliée.');\n}\n\n{{-- Dans la liste, pour chaque $s : --}}\n@can('administrer')\n    <form method=\"POST\" action=\"{{ route('signatures.depublier', $s->id) }}\">\n        @csrf\n        @method('PATCH')          {{-- simule le verbe PATCH --}}\n        <button>Dépublier</button>\n    </form>\n@endcan",
    note: "Défense en profondeur : le middleware protège la route (vraie sécurité), le @can cache le bouton (confort). Les deux, toujours." },
  { id: "laravel-projet-test-complet", title: "Le test de bout en bout du projet", level: 3,
    statement: "Écris le test Feature <code>test_un_admin_peut_depublier_une_signature</code> : crée un utilisateur admin et une signature publiée avec les factories ; agis en tant que cet admin (<code>actingAs</code>) pour envoyer le PATCH ; vérifie la redirection vers <code>/</code> ET que la base contient bien la signature avec <code>publie</code> à false. Puis écris <code>test_un_membre_ne_peut_pas_depublier</code> : un utilisateur normal reçoit un 403 et la signature reste publiée.",
    atoi: {cmd: "php artisan test --filter=depublier", expected: "Les 2 tests passent :\n  ✓ un admin peut depublier une signature\n  ✓ un membre ne peut pas depublier\nLe 1er : PATCH en actingAs(admin) -> assertRedirect('/') et la signature\npasse a publie=false. Le 2e : actingAs(membre) -> assertStatus(403) et la\nsignature reste publie=true. RefreshDatabase repart d'une base vierge."},
    checklist: ["La classe utilise-t-elle RefreshDatabase et les factories (User, Signature) ?", "Le test admin agit-il en actingAs($admin) puis PATCH, avec assertRedirect + assertDatabaseHas(publie=false) ?", "Le test membre attend-il assertStatus(403), la signature restant publiee ?", "Les deux scenarios (acces autorise / refuse) sont-ils couverts ?"],
    hints: [
      "User::factory()->create(['est_admin' => true]) et Signature::factory()->create(['publie' => true]).",
      "$this->actingAs($admin)->patch('/signatures/' . $s->id . '/depublier').",
      "Les assertions : assertRedirect('/'), assertDatabaseHas('signatures', ['id' => ..., 'publie' => false]) ; pour le refus : assertStatus(403)."
    ],
    solution: "use RefreshDatabase;\n\npublic function test_un_admin_peut_depublier_une_signature(): void\n{\n    // Arrange\n    $admin = User::factory()->create(['est_admin' => true]);\n    $s     = Signature::factory()->create(['publie' => true]);\n\n    // Act : requête PATCH en tant qu'admin\n    $reponse = $this->actingAs($admin)\n                    ->patch('/signatures/' . $s->id . '/depublier');\n\n    // Assert : redirection + état en base\n    $reponse->assertRedirect('/');\n    $this->assertDatabaseHas('signatures', [\n        'id' => $s->id, 'publie' => false,\n    ]);\n}\n\npublic function test_un_membre_ne_peut_pas_depublier(): void\n{\n    $membre = User::factory()->create(['est_admin' => false]);\n    $s      = Signature::factory()->create(['publie' => true]);\n\n    $reponse = $this->actingAs($membre)\n                    ->patch('/signatures/' . $s->id . '/depublier');\n\n    $reponse->assertStatus(403);                       // refusé par le middleware\n    $this->assertDatabaseHas('signatures', [\n        'id' => $s->id, 'publie' => true,              // rien n'a changé\n    ]);\n}",
    note: "actingAs() simule la connexion sans formulaire de login : chaque test reste court et ciblé. Le couple « succès admin / refus membre » documente ta politique de sécurité mieux qu'un commentaire." }
  ]
};
</script>
