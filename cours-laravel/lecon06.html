var DAY = {

  title: "Formulaires, CSRF et requêtes POST",
  subtitle: "Recevoir les données des visiteurs — sans se faire pirater.",
  theory: `
<h3>1. Le formulaire côté Blade</h3>
<p>Un <strong>formulaire</strong> est la zone d'une page où le visiteur saisit des informations (un champ texte, une zone de texte…) puis clique sur un bouton pour les envoyer. L'attribut <code>method</code> indique le verbe HTTP (ici POST, car on va <em>écrire</em> une donnée) et <code>action</code> indique l'adresse qui recevra l'envoi.</p>
<pre class="pseudo">&lt;form method="POST" action="{{ route('signatures.store') }}"&gt;   {{-- formulaire envoye en POST vers la route nommee signatures.store --}}
    @csrf                                                     {{-- insere le jeton anti-CSRF (champ cache secret) --}}
    &lt;input type="text" name="auteur" placeholder="Ton nom"&gt;   {{-- champ texte ; "name" = cle sous laquelle la valeur arrivera --}}
    &lt;textarea name="contenu"&gt;&lt;/textarea&gt;                      {{-- zone de texte multiligne pour le message --}}
    &lt;button&gt;Signer&lt;/button&gt;                                   {{-- bouton qui declenche l'envoi du formulaire --}}
&lt;/form&gt;                                                       {{-- fin du formulaire --}}</pre>
<p>Deux nouveautés par rapport au cours PHP : l'action utilise <code>route(...)</code> (pas d'URL en dur), et la mystérieuse directive <code>@csrf</code>.</p>
<h3>2. @csrf : la protection anti-falsification</h3>
<p>Une attaque <strong>CSRF</strong> (<em>Cross-Site Request Forgery</em>, « falsification de requête entre sites ») consiste à faire soumettre un formulaire à ta place depuis un site pirate : tu es connecté à ta banque, un site malveillant envoie un POST « virement » en ton nom. Parade : Laravel glisse dans chaque formulaire un <strong>jeton secret</strong> (un code aléatoire unique, en anglais <em>token</em>) lié à ta <strong>session</strong> (la mémoire du serveur qui te reconnaît d'une page à l'autre). La directive <code>@csrf</code> génère un champ caché contenant ce jeton ; à la réception, Laravel vérifie qu'il correspond. Pas de jeton valide → erreur <strong>419 Page Expired</strong>. Ce contrôle est fait par un <strong>middleware</strong> (un filtre placé sur le trajet de la requête — leçon détaillée plus loin).</p>
<h3>3. Lire les données : l'objet Request</h3>
<p>Fini <code>$_POST['auteur']</code> ! On demande à Laravel de nous fournir un <strong>objet</strong> <code>Request</code> (un objet représentant la requête entrante, avec toutes ses données) :</p>
<pre class="pseudo">use Illuminate\\Http\\Request;                          // importe la classe Request

public function store(Request $request)                 // en declarant Request $request, Laravel nous le fournit tout seul
{                                                        // debut de la methode
    $auteur  = $request->input('auteur');               // lit le champ "auteur" envoye par le formulaire
    $contenu = $request->input('contenu', 'défaut');    // lit "contenu" ; le 2e argument est la valeur par defaut si absent
    // $request->all() : recupere TOUT le formulaire sous forme de tableau
    ...                                                  // (ici : traitement / enregistrement)
    return redirect()->route('signatures.index');       // redirige vers la liste (voir motif Post/Redirect/Get)
}                                                        // fin de la methode</pre>
<p>Il suffit de déclarer <code>Request $request</code> en paramètre : Laravel le fournit automatiquement. Ce mécanisme s'appelle l'<strong>injection de dépendances</strong> — tu déclares ce dont tu as besoin, le framework te le livre prêt à l'emploi. Retiens le nom, on le retrouvera partout.</p>
<h3>4. Le motif POST → redirection</h3>
<p>Après un POST réussi, on ne renvoie pas une vue : on <strong>redirige</strong> (<code>redirect()-&gt;route(...)</code> renvoie le navigateur vers une autre adresse). Pourquoi ? Si l'utilisateur rafraîchit la page après un POST, le navigateur repropose d'envoyer le formulaire → doublon ! Le motif <strong>Post/Redirect/Get</strong> élimine ce problème : le rechargement ne rejoue qu'un GET inoffensif.</p>
<h3>5. Conserver la saisie : old()</h3>
<p>Si le formulaire est réaffiché après une erreur (leçon 12), <code>value="{{ old('auteur') }}"</code> repeuple le champ avec la saisie précédente (<code>old</code> = « ancienne valeur »). Le visiteur ne retape rien.</p>
<div class="warn">Oublier <code>@csrf</code> est l'erreur n°1 du débutant Laravel : le formulaire semble correct mais chaque envoi renvoie « 419 Page Expired ».</div>
<div class="tip">$request->input('x') lit indifféremment les données POST et les paramètres GET de l'URL : une seule API pour tout, contrairement à $_GET/$_POST.</div>`,
  exercises: [
    { type: "qcm", q: "Que génère la directive @csrf dans un formulaire ?", opts: ["Un bouton d'envoi", "Un champ caché contenant un jeton secret lié à la session", "Une règle CSS", "Un captcha"], a: 1, exp: "Le jeton prouve que le formulaire vient bien de TON site." },
    { type: "qcm", q: "Contre quelle attaque le jeton CSRF protège-t-il ?", opts: ["L'injection SQL", "La soumission de formulaires forgée depuis un site tiers", "Le vol de mot de passe", "Les virus"], a: 1, exp: "Cross-Site Request Forgery : agir à ta place, à ton insu." },
    { type: "input", q: "Quel code d'erreur HTTP Laravel renvoie-t-il quand le jeton CSRF manque ou a expiré ?", a: ["419"], ph: "code à 3 chiffres", exp: "419 Page Expired — le réflexe : vérifier le @csrf." },
    { type: "qcm", q: "Comment lire le champ « auteur » d'un formulaire dans un contrôleur Laravel ?", opts: ["$_POST['auteur']", "$request->input('auteur')", "$auteur", "input('auteur')"], a: 1, exp: "L'objet Request remplace les superglobales du cours PHP." },
    { type: "qcm", q: "Comment obtenir l'objet Request dans une méthode de contrôleur ?", opts: ["new Request()", "En le déclarant en paramètre : store(Request $request) — Laravel l'injecte", "Request::create()", "$_REQUEST"], a: 1, exp: "L'injection de dépendances : tu déclares, le framework fournit." },
    { type: "qcm", q: "Comment s'appelle ce mécanisme où le framework fournit lui-même les objets déclarés en paramètres ?", opts: ["Le polymorphisme", "L'injection de dépendances", "La récursivité", "Le type hinting inversé"], a: 1, exp: "Concept central de tous les frameworks modernes (Spring, ASP.NET Core l'ont aussi)." },
    { type: "qcm", q: "Que renvoie $request->input('ville', 'Bruxelles') si le champ ville est absent ?", opts: ["null", "« Bruxelles » : le second argument est la valeur par défaut", "Une erreur", "false"], a: 1, exp: "Fini les isset($_POST['ville']) ? ... : ... du cours PHP." },
    { type: "qcm", q: "Pourquoi rediriger (redirect) plutôt qu'afficher une vue après un POST réussi ?", opts: ["C'est plus joli", "Pour éviter qu'un rafraîchissement de page ne soumette le formulaire une 2e fois (motif Post/Redirect/Get)", "Les vues sont interdites en POST", "Pour vider le cache"], a: 1, exp: "F5 après redirection = simple GET, aucun doublon possible." },
    { type: "qcm", q: "Comment s'écrit la redirection vers la route nommée signatures.index ?", opts: ["redirect()->route('signatures.index')", "goto('signatures.index')", "header('Location: ...')", "view('redirect')"], a: 0, exp: "header('Location: …') du cours PHP existe toujours dessous, mais Laravel l'enrobe proprement." },
    { type: "qcm", q: "À quoi sert old('auteur') dans un champ de formulaire ?", opts: ["À afficher l'ancien utilisateur", "À repeupler le champ avec la saisie précédente après une erreur de validation", "À vider le champ", "À vérifier l'âge"], a: 1, exp: "Confort essentiel : personne n'aime tout retaper." },
    { type: "qcm", q: "Que contient $request->all() ?", opts: ["Toutes les routes", "Toutes les données envoyées (formulaire + query string) en tableau associatif", "Tous les cookies", "Tout le HTML"], a: 1, exp: "Pratique, mais on préfèrera bientôt validate() qui filtre ET valide." },
    { type: "qcm", q: "Pourquoi écrire action=\"{{ route('signatures.store') }}\" plutôt que action=\"/signatures\" ?", opts: ["C'est obligatoire", "Si l'URL change un jour, le formulaire continue de pointer au bon endroit", "Pour chiffrer l'envoi", "Pour éviter le CSRF"], a: 1, exp: "Toujours la même règle : pas d'URL en dur." },
    { type: "qcm", q: "Un formulaire method=\"POST\" sans @csrf est soumis. Résultat ?", opts: ["Il fonctionne normalement", "Erreur 419 Page Expired", "Erreur 404", "Les données sont perdues silencieusement"], a: 1, exp: "Le middleware CSRF bloque tout POST sans jeton valide." },
    { type: "vf", q: "$request->input('q') peut lire aussi bien un champ POST qu'un paramètre ?q=... de l'URL.", a: true, exp: "Une API unifiée, contrairement à $_GET / $_POST séparés." },
    { type: "vf", q: "Le motif Post/Redirect/Get sert à améliorer le référencement Google.", a: false, exp: "Non : il empêche la double soumission d'un formulaire au rafraîchissement." }
  ],
  final: {
    title: "Exercice final — Signer le livre d'or",
    intro: `<p>Le circuit complet du formulaire de signature, ligne par ligne :</p>
<pre class="pseudo">{{-- signatures/create.blade.php --}}
&lt;form method="POST" action="{{ route('signatures.store') }}"&gt;   {{-- envoi en POST vers signatures.store --}}
    @csrf                                                     {{-- jeton anti-CSRF (obligatoire) --}}
    &lt;input type="text" name="auteur" value="{{ old('auteur') }}"&gt;   {{-- champ nom ; old() restaure la saisie precedente --}}

    &lt;button&gt;Signer&lt;/button&gt;                                   {{-- bouton d'envoi --}}
&lt;/form&gt;                                                       {{-- fin du formulaire --}}

// SignatureController.php
public function store(Request $request)                       // Laravel injecte l'objet Request
{                                                             // debut de store
    $auteur  = $request->input('auteur');                     // lit le champ auteur
    $contenu = $request->input('contenu');                    // lit le champ contenu

    return redirect()->route('signatures.index');             // redirige vers la liste (Post/Redirect/Get)
}                                                             // fin de store</pre>`,
    questions: [
      { type: "qcm", q: "Le visiteur soumet le formulaire. Quel trajet suit la requête ?", opts: ["POST /signatures → route → store() → redirection GET /signatures", "GET /signatures → index()", "POST → vue directement", "Le navigateur appelle store() sans route"], a: 0, exp: "Post/Redirect/Get au complet." },
      { type: "qcm", q: "Après la redirection, le visiteur appuie sur F5. Que se passe-t-il ?", opts: ["Le formulaire est renvoyé : doublon", "Simple rechargement de la liste (GET) : aucun doublon", "Erreur 419", "Le navigateur bloque"], a: 1, exp: "C'est exactement pour ça qu'on redirige après un POST." },
      { type: "qcm", q: "Tu retires la ligne @csrf pour tester. Que constates-tu à l'envoi ?", opts: ["Rien ne change", "419 Page Expired : le POST est rejeté", "404", "Le champ auteur disparaît"], a: 1, exp: "La protection est active par défaut sur toutes les routes web POST." },
      { type: "qcm", q: "À quoi sert value=\"{{ old('auteur') }}\" ici ?", opts: ["À afficher le nom du dernier signataire", "À restaurer la saisie si le formulaire est réaffiché après une erreur de validation", "À définir une valeur obligatoire", "À rien"], a: 1, exp: "Sans erreur, old() est vide ; après une erreur (leçon 12), il restaure tout." },
      { type: "qcm", q: "Où ira la ligne « enregistrement » actuellement en commentaire ?", opts: ["Dans la vue", "Dans le fichier .env", "Dans un modèle Eloquent, dès la semaine 2", "Dans routes/web.php"], a: 2, exp: "La semaine 2 branche la vraie base de données avec Eloquent." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 6 :
// 1. Tout formulaire POST contient @csrf, sinon 419.
// 2. Request $request en parametre  ->  Laravel l'injecte
//    (injection de dependances).
// 3. $request->input('champ', 'defaut') remplace $_POST.
// 4. Apres un POST reussi : redirect()->route(...) — jamais de vue directe
//    (motif Post/Redirect/Get).
// 5. old('champ') restaure la saisie apres une erreur.</pre>
<p>Bilan de semaine demain : l'architecture MVC, ou pourquoi tout ce qu'on a fait s'emboîte si bien.</p>`
  }
