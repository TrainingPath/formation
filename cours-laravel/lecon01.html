<script>
var DAY = {
  num: 1,
  title: "Pourquoi un framework ? Premier projet Laravel",
  subtitle: "Tu sais coder en PHP. Laravel va te faire coder des applications professionnelles.",
  theory: `
<h3>1. C'est quoi, un framework ?</h3>
<p>Dans le cours PHP, tu as tout écrit toi-même : la validation des formulaires, la protection contre les injections SQL, les sessions, la connexion PDO. Un <strong>framework</strong> est un cadre de travail qui fournit tout ce code répétitif : tu écris uniquement la logique propre à TON application, le framework s'occupe du reste (routage, sécurité, base de données…).</p>
<p>Différence clé avec une simple bibliothèque : avec une bibliothèque, <em>ton code appelle</em> la bibliothèque. Avec un framework, <em>c'est le framework qui appelle ton code</em> au bon moment. On appelle ça l'<strong>inversion de contrôle</strong>.</p>
<h3>2. Laravel</h3>
<p><strong>Laravel</strong> est LE framework PHP le plus utilisé au monde (sites e-commerce, intranets, API…). Sa devise : « le framework pour les artisans du web ». Il apporte un routeur élégant, le moteur de templates <strong>Blade</strong>, l'ORM <strong>Eloquent</strong> pour la base de données, et un outil en ligne de commande : <strong>Artisan</strong>.</p>
<h3>3. Composer : le gestionnaire de dépendances</h3>
<p><strong>Composer</strong> est à PHP ce que l'App Store est à ton téléphone : il télécharge et installe les bibliothèques dont ton projet a besoin, listées dans le fichier <code>composer.json</code>. On crée un projet Laravel avec :</p>
<pre class="pseudo">composer create-project laravel/laravel livre-dor
cd livre-dor
php artisan serve      # démarre le serveur sur http://localhost:8000</pre>
<h3>4. La structure du projet</h3>
<pre class="pseudo">livre-dor/
├── app/                ← TON code (contrôleurs, modèles)
│   ├── Http/Controllers/
│   └── Models/
├── routes/web.php      ← les adresses de ton site
├── resources/views/    ← les pages HTML (Blade)
├── database/           ← migrations et seeders
├── public/index.php    ← LE seul point d'entrée
├── .env                ← la configuration locale
└── composer.json       ← les dépendances</pre>
<p>Grande différence avec le cours PHP : il n'y a plus un fichier <code>.php</code> par page ! <strong>Toutes</strong> les requêtes passent par <code>public/index.php</code>, qui laisse Laravel décider quoi exécuter. C'est le principe du <strong>contrôleur frontal</strong>.</p>
<h3>5. php artisan serve</h3>
<p>Plus besoin de configurer Apache ou WAMP : <code>php artisan serve</code> lance le serveur de développement intégré de PHP sur le <strong>port 8000</strong>. Ouvre <code>http://localhost:8000</code> : la page d'accueil de Laravel s'affiche.</p>
<div class="warn">Si le port 8000 est déjà occupé, Artisan bascule automatiquement sur le 8001. Tu peux aussi choisir : <code>php artisan serve --port=8080</code>.</div>
<div class="tip">Artisan sera ton meilleur ami : <code>php artisan list</code> affiche toutes ses commandes. Presque tout ce que tu créeras dans ce cours (contrôleurs, modèles, migrations) sera généré par Artisan.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence fondamentale entre une bibliothèque et un framework ?", opts: ["Aucune, ce sont des synonymes", "Ton code appelle la bibliothèque ; le framework appelle ton code", "Un framework s’écrit toujours en JavaScript", "Une bibliothèque impose sa propre structure de projet"], a: 1, exp: "C'est l'inversion de contrôle : le framework pilote, ton code répond." },
    { type: "qcm", q: "Quel outil télécharge et gère les dépendances d'un projet PHP ?", opts: ["Maven", "npm", "Composer", "Artisan"], a: 2, exp: "Composer lit composer.json et installe les bibliothèques dans le dossier vendor/." },
    { type: "input", q: "Quelle commande complète crée un nouveau projet Laravel nommé blog ?", a: ["composer create-project laravel/laravel blog"], ph: "commande complète", exp: "composer create-project laravel/laravel blog génère le squelette du projet." },
    { type: "qcm", q: "Qu'est-ce qu'Artisan ?", opts: ["Le moteur de templates de Laravel", "L'outil en ligne de commande de Laravel", "La base de données de Laravel", "Un éditeur de code"], a: 1, exp: "php artisan xxx : générer du code, lancer le serveur, migrer la base…" },
    { type: "input", q: "Sur quel port php artisan serve démarre-t-il par défaut ?", a: ["8000"], ph: "numéro de port", exp: "http://localhost:8000 — modifiable avec --port." },
    { type: "qcm", q: "Dans quel dossier écriras-tu l'essentiel de TON code (contrôleurs, modèles) ?", opts: ["vendor/", "app/", "public/", "storage/"], a: 1, exp: "app/ contient Http/Controllers et Models ; vendor/ appartient à Composer, on n'y touche jamais." },
    { type: "qcm", q: "Quel fichier est le point d'entrée UNIQUE de toutes les requêtes ?", opts: ["routes/web.php", "app/index.php", "public/index.php", ".env"], a: 2, exp: "C'est le contrôleur frontal : une seule porte d'entrée, Laravel dirige ensuite." },
    { type: "qcm", q: "Dans le cours PHP, tu avais un fichier .php par page (contact.php, livredor.php…). Avec Laravel :", opts: ["C'est pareil, un fichier par page", "Toutes les requêtes passent par public/index.php et le routeur décide", "Il faut un serveur Apache obligatoirement", "Les pages sont écrites en JavaScript"], a: 1, exp: "Le routeur (routes/web.php) associe chaque adresse à du code — plus de fichiers éparpillés." },
    { type: "qcm", q: "À quoi sert le fichier composer.json ?", opts: ["À styliser les pages", "À décrire le projet : dépendances, version de PHP…", "À stocker les données", "À configurer le navigateur"], a: 1, exp: "C'est la carte d'identité du projet, l'équivalent du pom.xml en Java." },
    { type: "qcm", q: "Où se trouve la configuration locale du projet (base de données, nom de l'app…) ?", opts: ["Dans le fichier .env", "Dans public/index.php", "Dans vendor/config.php", "Dans le navigateur"], a: 0, exp: ".env contient la configuration propre à TA machine ; il n'est jamais partagé sur Git." },
    { type: "qcm", q: "php artisan serve refuse de démarrer sur le port 8000, déjà occupé. Que se passe-t-il ?", opts: ["Le projet est corrompu", "Artisan essaie automatiquement le port suivant (8001), ou tu forces avec --port", "Il faut supprimer et recréer le fichier .env", "Il faut réinstaller entièrement Laravel"], a: 1, exp: "Un port ne peut être écouté que par un seul programme ; Artisan gère ça élégamment." },
    { type: "qcm", q: "Quel dossier contient les pages HTML (templates Blade) ?", opts: ["public/", "resources/views/", "app/Models/", "routes/"], a: 1, exp: "resources/views/ accueillera nos fichiers .blade.php dès la leçon 4." },
    { type: "input", q: "Quelle commande Artisan affiche la liste de toutes les commandes disponibles ?", a: ["php artisan list", "php artisan"], ph: "commande", exp: "php artisan list (ou php artisan tout court) — explore-la !" },
    { type: "vf", q: "Avec Laravel, il faut obligatoirement installer et configurer Apache ou WAMP pour développer.", a: false, exp: "php artisan serve suffit en développement : le serveur est intégré." },
    { type: "vf", q: "On peut modifier les fichiers du dossier vendor/ pour adapter Laravel à ses besoins.", a: false, exp: "Jamais ! vendor/ est géré par Composer et écrasé à chaque mise à jour. Ton code va dans app/." }
  ],
  final: {
    title: "Exercice final — Ton premier projet démarre",
    intro: `<p>Tu viens de créer ton projet et tu le lances. Analyse la situation :</p>
<pre class="pseudo">$ composer create-project laravel/laravel livre-dor
Creating a "laravel/laravel" project at "./livre-dor"
Generating optimized autoload files
$ cd livre-dor
$ php artisan serve

   INFO  Server running on [http://127.0.0.1:8000].

  Press Ctrl+C to stop the server</pre>`,
    questions: [
      { type: "qcm", q: "Que confirme la ligne « Server running on [http://127.0.0.1:8000] » ?", opts: ["Une erreur", "Le serveur de développement écoute : l'application est joignable sur http://localhost:8000", "La base de données est prête", "Le projet est compilé mais arrêté"], a: 1, exp: "127.0.0.1 = localhost : l'application tourne et attend des requêtes." },
      { type: "qcm", q: "Tu ouvres http://localhost:8000 et tu vois la page d'accueil Laravel. Qui a décidé d'afficher cette page ?", opts: ["Apache", "Une route définie dans routes/web.php qui renvoie une vue", "Le fichier accueil.php", "Le navigateur"], a: 1, exp: "Ouvre routes/web.php : une route « / » y renvoie la vue welcome. On crée les nôtres dès demain." },
      { type: "qcm", q: "Tu veux préparer la suite du cours. Où iront tes futurs contrôleurs ?", opts: ["Dans vendor/laravel/", "Dans app/Http/Controllers/", "Dans public/", "Dans .env"], a: 1, exp: "app/ = ton code ; Http/Controllers accueillera les classes générées par Artisan." },
      { type: "qcm", q: "Ton collègue clone ton projet mais n'a pas le dossier vendor/. Que doit-il faire ?", opts: ["Copier vendor/ depuis ta machine", "Lancer composer install pour que Composer télécharge les dépendances", "Réinstaller PHP", "Créer vendor/ à la main"], a: 1, exp: "composer.json décrit tout ; composer install reconstruit vendor/ à l'identique." },
      { type: "qcm", q: "Dans ce projet, quel fichier ne partageras-tu JAMAIS sur Git ?", opts: ["composer.json", ".env : il contient la configuration locale et les mots de passe", "routes/web.php", "app/Models/"], a: 1, exp: "Chaque développeur a son propre .env ; un fichier .env.example sert de modèle." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 1 :
// 1. Un framework appelle TON code (inversion de contrôle).
// 2. Composer gère les dépendances (composer.json → vendor/).
// 3. Toutes les requêtes passent par public/index.php :
//    c'est le routeur qui décide quoi exécuter (fini le fichier par page !).
// 4. php artisan serve → http://localhost:8000
// 5. Ton code : app/ · tes pages : resources/views/ · tes routes : routes/web.php
//    La config locale : .env (jamais sur Git).</pre>
<p>Garde ce projet : c'est lui qui deviendra le livre d'or professionnel au fil des leçons, en réutilisant tout ce que tu as appris au cours PHP (leçons 12 à 20).</p>`
  }
};
