<script>
var DAY = {
  num: 5,
  title: "Paramètres de route et données aux vues",
  subtitle: "Le contrôleur prépare, la vue affiche : le flux complet des données.",
  theory: `
<h3>1. Passer des données à une vue</h3>
<p>Un <strong>tableau associatif</strong> (leçon 8 de PHP) est une liste de paires <em>clé → valeur</em>, comme un dictionnaire où chaque mot (la clé) a sa définition (la valeur). Le deuxième argument de <code>view()</code> est justement un tel tableau : chaque <strong>clé</strong> y devient une <strong>variable</strong> utilisable dans la vue. La flèche <code>=&gt;</code> relie une clé à sa valeur.</p>
<pre class="pseudo">public function index()                                  // methode index du controleur (affiche la liste)
{                                                        // debut de la methode
    $messages = ['Bravo !', 'Superbe site', 'Bonne continuation'];   // un tableau de 3 textes
    return view('messages.index', [                      // renvoie la vue messages/index en lui passant des donnees
        'messages' => $messages,                         // cle "messages"  ->  deviendra la variable $messages dans la vue
        'total'    => count($messages),                  // cle "total" -> $total ; count() compte les elements (ici 3)
    ]);                                                  // fin du tableau et de view()
}                                                        // fin de la methode</pre>
<p>Dans la vue, <code>$messages</code> et <code>$total</code> existent directement. Alternative équivalente : <code>view('messages.index')-&gt;with('total', 3)</code> ou <code>compact('messages', 'total')</code> (une fonction PHP qui construit automatiquement le tableau à partir des noms de variables).</p>
<h3>2. Les directives de contrôle Blade</h3>
<p>Toutes les structures vues au cours PHP existent en version <strong>directive</strong> (une instruction Blade commençant par <code>@</code>), plus lisible :</p>
<pre class="pseudo">@if ($total === 0)                          {{-- SI le total vaut exactement 0... --}}
    &lt;p&gt;Aucun message pour l'instant.&lt;/p&gt;    {{-- ...afficher ce message --}}
@else                                       {{-- SINON (il y a au moins un message)... --}}
    &lt;ul&gt;                                    {{-- ...ouvrir une liste a puces --}}
    @foreach ($messages as $m)              {{-- POUR CHAQUE message, appele $m... --}}
        &lt;li&gt;{{ $m }}&lt;/li&gt;                   {{-- ...afficher une puce contenant le message (echappe) --}}
    @endforeach                             {{-- fin de la boucle --}}
    &lt;/ul&gt;                                   {{-- fermer la liste --}}
@endif                                      {{-- fin du if/else --}}</pre>
<p>Il existe aussi <code>@elseif</code>, <code>@for</code>, <code>@while</code>, et le très pratique <code>@forelse</code> qui gère le cas « liste vide » :</p>
<pre class="pseudo">@forelse ($messages as $m)                  {{-- parcourt $messages ; s'il est vide, saute au @empty --}}
    &lt;li&gt;{{ $m }}&lt;/li&gt;                       {{-- affiche chaque message dans une puce --}}
@empty                                      {{-- bloc execute UNIQUEMENT si la liste est vide --}}
    &lt;p&gt;Aucun message pour l'instant.&lt;/p&gt;    {{-- message affiche quand il n'y a rien --}}
@endforelse                                 {{-- fin du forelse --}}</pre>
<h3>3. La variable magique $loop</h3>
<p>À l'intérieur d'un <code>@foreach</code>, Blade fournit gratuitement une variable spéciale <code>$loop</code> qui renseigne sur la boucle : <code>$loop-&gt;index</code> (position en partant de 0), <code>$loop-&gt;iteration</code> (en partant de 1), <code>$loop-&gt;first</code> (vrai au premier tour), <code>$loop-&gt;last</code> (vrai au dernier), <code>$loop-&gt;count</code> (nombre total d'éléments).</p>
<h3>4. Route + contrôleur + vue : le flux complet</h3>
<pre class="pseudo">// Route :      GET /messages/{id}                       // l'adresse capture un identifiant {id}
// Controleur :
public function show(int $id)                            // show recoit l'id capture dans l'URL
{                                                        // debut de la methode
    $message = "Contenu du message n°" . $id;            // on prepare le texte (bientot : lu dans la base de donnees)
    return view('messages.show', ['message' => $message, 'id' => $id]);   // envoie $message et $id a la vue
}                                                        // fin de la methode
// Vue messages/show.blade.php :
&lt;h1&gt;Message {{ $id }}&lt;/h1&gt;                                {{-- affiche le numero du message --}}
&lt;p&gt;{{ $message }}&lt;/p&gt;                                     {{-- affiche le contenu du message --}}</pre>
<p>Retiens ce trajet, c'est le cœur de Laravel : <strong>URL → route → contrôleur (prépare les données) → vue (affiche)</strong>.</p>
<div class="warn">Si la vue utilise <code>{{ $total }}</code> mais que le contrôleur ne transmet pas <code>total</code>, tu obtiens l'erreur « Undefined variable $total ». Le message indique la vue et la ligne : lis-le !</div>
<div class="tip">La page d'erreur de développement de Laravel est très détaillée (fichier, ligne, extrait de code). Apprendre à la lire te fera gagner des heures.</div>`,
  exercises: [
    { type: "qcm", q: "Comment transmettre la variable $titre à la vue accueil ?", opts: ["view('accueil', ['titre' => $titre])", "view('accueil', $titre)", "echo $titre", "global $titre"], a: 0, exp: "Le tableau associatif : chaque clé devient une variable dans la vue." },
    { type: "qcm", q: "Dans la vue, comment s'appelle la variable transmise avec ['nb' => 12] ?", opts: ["$data['nb']", "$nb", "$_GET['nb']", "nb"], a: 1, exp: "La clé « nb » devient directement la variable $nb." },
    { type: "qcm", q: "Quelle directive Blade parcourt le tableau $messages ?", opts: ["@loop", "@foreach ($messages as $m) … @endforeach", "@repeat", "@each($messages)"], a: 1, exp: "Même syntaxe que le foreach de la leçon 6 de PHP, en version directive." },
    { type: "qcm", q: "Quel est l'avantage de @forelse sur @foreach ?", opts: ["Il est plus rapide", "Le bloc @empty gère élégamment le cas « liste vide »", "Il trie les éléments", "Il évite l'échappement"], a: 1, exp: "Plus besoin d'un @if (count(...) === 0) séparé." },
    { type: "input", q: "Dans un @foreach, quelle propriété de $loop donne le numéro d'itération en partant de 1 ?", a: ["iteration", "$loop->iteration", "loop->iteration"], ph: "propriété", exp: "$loop->iteration (et $loop->index part de 0)." },
    { type: "qcm", q: "Que vaut $loop->first ?", opts: ["Le premier élément du tableau", "true uniquement au premier tour de boucle", "1", "Le nom de la boucle"], a: 1, exp: "Pratique pour styliser différemment la première ligne." },
    { type: "qcm", q: "Erreur « Undefined variable $total » dans une vue. Cause la plus probable ?", opts: ["Blade est mal installé", "Le contrôleur n'a pas transmis « total » dans le tableau de view()", "Il faut écrire {!! $total !!}", "La vue est dans le mauvais dossier"], a: 1, exp: "Toute variable utilisée dans la vue doit être fournie par le contrôleur." },
    { type: "qcm", q: "Quel est le trajet complet d'une requête dans Laravel ?", opts: ["Vue → contrôleur → route", "URL → route → contrôleur → vue → réponse HTML", "URL → vue → base de données", "Contrôleur → route → navigateur"], a: 1, exp: "Le flux fondamental — mémorise-le, tout le cours repose dessus." },
    { type: "qcm", q: "À quoi sert compact('messages', 'total') ?", opts: ["À compresser la page", "À créer ['messages' => $messages, 'total' => $total] automatiquement", "À vider les variables", "À importer une vue"], a: 1, exp: "Raccourci PHP natif très utilisé avec view()." },
    { type: "qcm", q: "Quelle directive écrit un if/sinon en Blade ?", opts: ["@if … @else … @endif", "@si … @sinon", "{{if}} … {{else}}", "@when … @otherwise"], a: 0, exp: "Les directives reprennent les mots-clés PHP : lisibilité maximale." },
    { type: "qcm", q: "Le contrôleur show(int $id) reçoit id=3 et transmet ['id' => $id]. La vue affiche {{ $id }}. Résultat pour /messages/3 ?", opts: ["{{ $id }}", "3", "id", "Erreur"], a: 1, exp: "URL → paramètre de route → contrôleur → vue : le flux complet." },
    { type: "qcm", q: "Peut-on écrire du PHP « brut » dans une vue Blade si nécessaire ?", opts: ["Non, jamais", "Oui avec @php … @endphp, mais à réserver aux cas exceptionnels", "Oui, dans n'importe quelle ligne", "Seulement en production"], a: 1, exp: "Si tu as besoin de beaucoup de @php, c'est que la logique devrait être dans le contrôleur." },
    { type: "qcm", q: "Où doit se trouver la logique métier (calculs, préparation des données) ?", opts: ["Dans la vue, avec @php", "Dans le contrôleur (puis bientôt dans des services/modèles)", "Dans routes/web.php", "Dans le layout"], a: 1, exp: "La vue ne fait qu'afficher : c'est la séparation des responsabilités." },
    { type: "vf", q: "view('x', ['a' => 1]) et view('x')->with('a', 1) sont équivalents.", a: true, exp: "Deux syntaxes pour le même résultat : la variable $a dans la vue." },
    { type: "vf", q: "La variable $loop est disponible partout dans une vue Blade, même hors des boucles.", a: false, exp: "$loop n'existe qu'à l'intérieur d'un @foreach / @forelse." }
  ],
  final: {
    title: "Exercice final — La liste des signatures",
    intro: `<p>Le contrôleur et la vue du livre d'or prennent forme. Analyse chaque ligne :</p>
<pre class="pseudo">// SignatureController.php
public function index()                                  // affiche la liste des signatures
{                                                        // debut de la methode
    $signatures = ['Bravo pour ce site !', 'Superbe famille', 'À bientôt'];   // 3 signatures
    return view('signatures.index', [                    // envoie les donnees a la vue
        'signatures' => $signatures,                     // cle "signatures" -> variable $signatures
        'total'      => count($signatures),              // cle "total" -> $total (vaut 3)
    ]);                                                  // fin de view()
}                                                        // fin de la methode

{{-- signatures/index.blade.php --}}
@extends('layout')                                       {{-- herite du squelette commun --}}
@section('titre', 'Signatures')                          {{-- remplit le trou "titre" --}}
@section('contenu')                                      {{-- debut du contenu --}}
  &lt;h1&gt;{{ $total }} signature(s)&lt;/h1&gt;                     {{-- affiche le nombre total --}}
  @forelse ($signatures as $s)                           {{-- pour chaque signature $s (sinon @empty)... --}}
    &lt;p&gt;{{ $loop->iteration }}. {{ $s }}&lt;/p&gt;              {{-- ...numero (depuis 1) puis texte echappe --}}
  @empty                                                 {{-- si aucune signature... --}}
    &lt;p&gt;Sois le premier à signer !&lt;/p&gt;                    {{-- ...ce message --}}
  @endforelse                                            {{-- fin du forelse --}}
@endsection                                              {{-- fin du contenu --}}</pre>`,
    questions: [
      { type: "qcm", q: "Qu'affiche le <h1> ?", opts: ["{{ $total }} signature(s)", "3 signature(s)", "0 signature(s)", "Erreur"], a: 1, exp: "count() vaut 3, transmis sous la clé total." },
      { type: "qcm", q: "Qu'affiche la première ligne de la liste ?", opts: ["0. Bravo pour ce site !", "1. Bravo pour ce site !", "Bravo pour ce site !", "@forelse"], a: 1, exp: "$loop->iteration commence à 1." },
      { type: "qcm", q: "Si $signatures était un tableau vide, que verrait le visiteur ?", opts: ["Une page blanche", "« Sois le premier à signer ! » grâce au bloc @empty", "Une erreur", "0. "], a: 1, exp: "C'est tout l'intérêt de @forelse." },
      { type: "qcm", q: "Une signature contient &lt;script&gt;hack()&lt;/script&gt;. Danger à l'affichage ?", opts: ["Oui, le script s'exécutera", "Non : {{ $s }} échappe automatiquement le HTML", "Oui, sauf en HTTPS", "Le message disparaît"], a: 1, exp: "L'anti-XSS de Blade protège chaque affichage." },
      { type: "qcm", q: "Demain on branchera un formulaire. Par quel verbe HTTP la nouvelle signature arrivera-t-elle ?", opts: ["GET", "POST", "VIEW", "PUT obligatoirement"], a: 1, exp: "Une action qui modifie les données = POST, reçu par la méthode store()." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 5 :
// 1. view('nom', ['cle' => valeur]) : chaque cle devient une variable de la vue.
// 2. @if/@foreach/@forelse : les structures PHP en version directive.
// 3. @forelse + @empty : le cas « liste vide » gere proprement.
// 4. $loop (iteration, first, last…) disponible dans les boucles.
// 5. Le flux sacre : URL -> route -> controleur -> vue.</pre>
<p>Nos données sont encore codées en dur. Avant la base de données (semaine 2), apprenons à recevoir celles des visiteurs : les formulaires.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code PHP/Blade ici…",
  items: [
  { id: "laravel-vue-membres", title: "Contrôleur + vue : la liste des membres", level: 2,
    statement: "Écris la méthode <code>index()</code> de <code>MembreController</code> qui transmet à la vue <code>membres.index</code> le tableau <code>$membres = ['Aurélia', 'Marc', 'Léa']</code> et leur nombre sous la clé <code>total</code>. Écris ensuite la vue : un titre <code>&lt;h1&gt;</code> affichant le total, puis la liste numérotée des membres avec <code>@forelse</code> (message « Aucun membre » si vide), en utilisant <code>$loop->iteration</code>.",
    hints: [
      "view('membres.index', ['membres' => $membres, 'total' => count($membres)]).",
      "Dans la vue : @forelse ($membres as $m) … @empty … @endforelse.",
      "La numérotation : {{ $loop->iteration }}. {{ $m }}"
    ],
    solution: "// MembreController.php\npublic function index()\n{\n    $membres = ['Aurélia', 'Marc', 'Léa'];\n    return view('membres.index', [\n        'membres' => $membres,           // clé => variable dans la vue\n        'total'   => count($membres),\n    ]);\n}\n\n{{-- resources/views/membres/index.blade.php --}}\n@extends('layout')\n@section('titre', 'Membres')\n@section('contenu')\n    <h1>{{ $total }} membre(s)</h1>\n    @forelse ($membres as $m)\n        <p>{{ $loop->iteration }}. {{ $m }}</p>   {{-- numéro depuis 1 --}}\n    @empty\n        <p>Aucun membre</p>                        {{-- cas liste vide --}}\n    @endforelse\n@endsection",
    note: "Contrôleur = données, vue = affichage. Si tu écris un count() ou un tri dans la vue, arrête-toi : sa place est dans le contrôleur." }
  ]
};
