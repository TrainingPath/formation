var DAY = {
  num: 10,
  title: "Requêtes Eloquent et Query Builder",
  subtitle: "Filtrer, trier, compter : la puissance de SQL, la lisibilité du PHP.",
  theory: `
<h3>1. where : filtrer</h3>
<p><strong>Filtrer</strong>, c'est ne garder que les lignes qui remplissent une condition. La méthode <code>where</code> (« où ») ajoute cette condition. On peut <strong>chaîner</strong> les appels (les écrire à la suite avec <code>-&gt;</code>) : chacun affine la requête.</p>
<pre class="pseudo">// WHERE publie = 1
$publiees = Signature::where('publie', true)->get();   // garde les signatures ou publie vaut vrai, puis get() execute

// WHERE age >= 18 (operateur explicite)
$majeurs = Membre::where('age', '>=', 18)->get();      // 3 arguments : colonne, operateur, valeur

// Plusieurs conditions (ET)
$resultat = Signature::where('publie', true)           // 1ere condition : publie = vrai...
                     ->where('auteur', 'Aurélia')      // ...ET auteur = Aurelia (deux where = ET)
                     ->get();                          // get() lance la requete</pre>
<p>Chaque méthode renvoie le « constructeur de requête » : on chaîne les appels, et <code>-&gt;get()</code> déclenche l'exécution. Rien ne part vers la base avant le get ! On appelle ça l'<strong>exécution différée</strong> (on prépare d'abord, on lance ensuite).</p>
<h3>2. Trier, limiter, compter</h3>
<pre class="pseudo">Signature::orderBy('created_at', 'desc')->get();  // trie par date, 'desc' = decroissant (plus recentes d'abord)
Signature::latest()->get();                        // raccourci equivalent (latest = les plus recentes)
Signature::orderBy('auteur')->limit(10)->get();    // trie par auteur, limit(10) = garde 10 lignes au plus
Signature::where('publie', true)->count();         // count() renvoie un NOMBRE, pas des lignes
Signature::where('auteur', 'Marc')->first();       // first() renvoie UNE seule ligne (ou null si aucune)
Signature::where('auteur', 'like', '%dupont%')->get(); // like = recherche partielle ; % = "n'importe quoi"</pre>
<h3>3. Les Collections : le retour des tableaux enrichis</h3>
<p><code>get()</code> et <code>all()</code> renvoient une <strong>Collection</strong> : un super-tableau muni de dizaines de méthodes inspirées des fonctions vues à la leçon 10 de PHP (array_filter, array_map, usort…) :</p>
<pre class="pseudo">$signatures->count();                       // nombre d'elements dans la collection
$signatures->first();                       // premier element
$signatures->pluck('auteur');               // extrait UNE colonne (ici tous les auteurs)
$signatures->filter(fn($s) => $s->publie);  // ne garde que les elements ou publie est vrai (en memoire)
$signatures->map(fn($s) => strtoupper($s->auteur));   // transforme chaque element (ici auteur en majuscules)
$signatures->sortBy('auteur');              // trie les elements par auteur</pre>
<div class="warn">Attention à ne pas confondre : <code>where()</code> AVANT get() filtre <strong>dans la base</strong> (rapide, peu de mémoire) ; <code>filter()</code> APRÈS get() filtre <strong>en PHP</strong> (tout a déjà été chargé). Sur 100 000 lignes, la différence est énorme : filtre en base autant que possible.</div>
<h3>4. Le Query Builder : pour les tables sans modèle</h3>
<pre class="pseudo">use Illuminate\\Support\\Facades\\DB;               // importe la facade DB (acces direct a la base)

$stats = DB::table('signatures')                   // on part de la table "signatures" (sans modele)
           ->where('publie', true)                 // meme methode where...
           ->orderBy('created_at', 'desc')         // ...meme orderBy...
           ->get();                                // get() execute ; resultats en objets simples</pre>
<p>Même syntaxe chaînée, mais on part de <code>DB::table()</code> : les résultats sont des objets simples (pas des modèles Eloquent). Utile pour des statistiques ou des tables techniques. Dans ce cours, on privilégie Eloquent.</p>
<h3>5. Déboguer ses requêtes</h3>
<pre class="pseudo">Signature::where('publie', true)->toSql();         // toSql() N'EXECUTE PAS : il renvoie le SQL fabrique
// "select * from signatures where publie = ?"     // resultat : le SQL, avec un ? a la place de la valeur</pre>
<div class="tip">Le « ? » dans le SQL généré, tu le reconnais ? C'est le marqueur des requêtes préparées de la leçon 19 de PHP. Eloquent paramètre TOUTES les valeurs : injection SQL impossible.</div>`,
  exercises: [
    { type: "qcm", q: "Comment récupérer les signatures publiées uniquement ?", opts: ["Signature::all('publie')", "Signature::where('publie', true)->get()", "Signature::publie()", "SELECT WHERE publie"], a: 1, exp: "where filtre, get exécute." },
    { type: "qcm", q: "Quel appel déclenche réellement l'exécution de la requête en base ?", opts: ["where()", "orderBy()", "get() (ou first, count…)", "limit()"], a: 2, exp: "Avant get(), on ne fait que construire la requête." },
    { type: "qcm", q: "Comment écrire « WHERE age >= 18 » ?", opts: ["where('age >= 18')", "where('age', '>=', 18)", "where(18, '>=', 'age')", "whereAge(18)"], a: 1, exp: "Trois arguments : colonne, opérateur, valeur." },
    { type: "qcm", q: "Que renvoie Signature::where('publie', true)->count() ?", opts: ["Une Collection", "Un nombre entier", "La première ligne", "true/false"], a: 1, exp: "count() exécute un SELECT COUNT(*) : efficace, rien n'est chargé." },
    { type: "qcm", q: "Comment obtenir les signatures les plus récentes d'abord ?", opts: ["orderBy('created_at', 'desc') ou le raccourci latest()", "sort('desc')", "reverse()", "newest()"], a: 0, exp: "latest() = orderBy('created_at', 'desc')." },
    { type: "qcm", q: "Que renvoie first() si aucune ligne ne correspond ?", opts: ["Une exception", "null", "Un tableau vide", "0"], a: 1, exp: "Comme find() : pense à vérifier, ou utilise firstOrFail()." },
    { type: "qcm", q: "Chaîner deux where() successifs correspond à quel SQL ?", opts: ["OR entre les conditions", "AND entre les conditions", "UNION", "JOIN"], a: 1, exp: "Pour un OU, il existe orWhere()." },
    { type: "qcm", q: "Que renvoie $signatures->pluck('auteur') ?", opts: ["La première signature", "Une collection contenant uniquement les valeurs de la colonne auteur", "Un booléen", "La requête SQL"], a: 1, exp: "Extraire une colonne — très utile pour les listes déroulantes." },
    { type: "qcm", q: "Quelle est la différence clé entre where() (avant get) et filter() (après get) ?", opts: ["Aucune", "where filtre dans la base ; filter charge TOUT puis filtre en PHP", "filter est plus rapide", "where ne marche qu'avec les nombres"], a: 1, exp: "Sur de gros volumes, filtrer en base est infiniment plus efficace." },
    { type: "qcm", q: "Recherche des auteurs contenant « dupont » : quelle syntaxe ?", opts: ["where('auteur', 'like', '%dupont%')", "where('auteur', '=', 'dupont%')", "search('dupont')", "match('auteur', 'dupont')"], a: 0, exp: "L'opérateur like + les jokers % — comme en SQL pur." },
    { type: "qcm", q: "À quoi sert DB::table('logs')->... ?", opts: ["À créer une table", "À interroger une table SANS passer par un modèle Eloquent (Query Builder)", "À supprimer la base", "À migrer"], a: 1, exp: "Même chaînage, résultats en objets simples." },
    { type: "qcm", q: "Que renvoie ->toSql() ?", opts: ["Les résultats", "La chaîne SQL générée, avec des ? pour les valeurs", "Une erreur", "Le schéma de la table"], a: 1, exp: "Parfait pour comprendre/déboguer ce qu'Eloquent fabrique." },
    { type: "qcm", q: "Les « ? » dans le SQL généré indiquent :", opts: ["Des erreurs", "Des requêtes préparées : les valeurs sont paramétrées, anti-injection", "Des colonnes inconnues", "Des commentaires"], a: 1, exp: "Le même mécanisme que PDO prepare/execute (leçon 19 de PHP)." },
    { type: "vf", q: "Signature::where('publie', true) sans get() envoie déjà la requête à la base.", a: false, exp: "Non : la requête ne part qu'au get()/first()/count()… C'est l'exécution différée." },
    { type: "vf", q: "Une Collection Laravel offre des méthodes comme map, filter et sortBy, façon array_map/array_filter/usort.", a: true, exp: "Les fonctions de tableaux de la leçon 10 de PHP, en version objet chaînable." }
  ],
  final: {
    title: "Exercice final — La page d'accueil intelligente",
    intro: `<p>La page d'accueil du livre d'or affiche des statistiques et les dernières signatures. Analyse chaque ligne :</p>
<pre class="pseudo">public function accueil()                                  // prepare les donnees de l'accueil
{
    return view('accueil', [                               // envoie 3 donnees a la vue accueil
        'recentes' => Signature::where('publie', true)     // signatures publiees...
                               ->latest()                  // ...triees des plus recentes...
                               ->limit(3)                  // ...limitees a 3...
                               ->get(),                    // ...execute la requete
        'total'    => Signature::where('publie', true)->count(),   // NOMBRE de signatures publiees (COUNT en base)
        'auteurs'  => Signature::where('publie', true)     // signatures publiees...
                               ->get()                     // ...toutes chargees (a ameliorer !)...
                               ->pluck('auteur'),          // ...puis on extrait la colonne auteur en memoire
    ]);
}</pre>`,
    questions: [
      { type: "qcm", q: "Que contient $recentes ?", opts: ["Toutes les signatures", "Les 3 signatures publiées les plus récentes", "3 signatures au hasard", "Les 3 plus anciennes"], a: 1, exp: "where + latest (tri desc sur created_at) + limit 3." },
      { type: "qcm", q: "Combien de lignes la requête de $total charge-t-elle en mémoire PHP ?", opts: ["Toutes", "Aucune : COUNT s'exécute en base et renvoie juste un nombre", "3", "Une par auteur"], a: 1, exp: "count() avant tout get : le calcul reste dans la base." },
      { type: "qcm", q: "La 3e requête ($auteurs) est améliorable. Pourquoi ?", opts: ["Elle est parfaite", "Elle charge TOUTES les colonnes puis n'en garde qu'une : pluck('auteur') directement sur la requête (avant get) suffirait", "pluck n'existe pas", "Il manque un where"], a: 1, exp: "Signature::where(...)->pluck('auteur') fait extraire la colonne par la base elle-même." },
      { type: "qcm", q: "Une signature a publie = false. Apparaît-elle quelque part sur cette page ?", opts: ["Oui, dans recentes", "Non : les trois requêtes filtrent sur publie = true", "Oui, dans le total", "Oui, dans auteurs"], a: 1, exp: "Le filtre est cohérent sur les trois données." },
      { type: "vf", q: "Si la table contient 50 000 signatures, la requête de $recentes n'en transfère que 3 vers PHP.", a: true, exp: "limit(3) est appliqué PAR LA BASE : c'est tout l'intérêt de filtrer avant get()." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 10 :
// 1. where / orderBy / limit se chainent ; get() (ou count, first) execute.
// 2. latest() = orderBy('created_at', 'desc').
// 3. Filtrer EN BASE (where avant get) > filtrer en PHP (filter apres get).
// 4. Collections : count, first, pluck, map, filter, sortBy…
// 5. DB::table() : le Query Builder sans modele.
// 6. toSql() montre le SQL — toujours parametre (?), donc sur.</pre>
<p>Nos signatures sont isolées. Demain, on les relie à leurs auteurs : les relations entre modèles.</p>`
  }
};

    note: "Relis chaque requête en te demandant « combien de lignes traversent le réseau ? ». Ici : les actifs, zéro, et cinq. C'est ça, penser performance." }
