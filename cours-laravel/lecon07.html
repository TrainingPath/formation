  title: "L'architecture MVC",
  subtitle: "Bilan de semaine : comprendre POURQUOI tout s'emboîte.",
  theory: `
<h3>1. MVC : Modèle - Vue - Contrôleur</h3>
<p>Une <strong>architecture</strong> est la façon d'organiser les grandes pièces d'un programme. Sans le savoir, tu pratiques depuis lundi une architecture célèbre : <strong>MVC</strong>. Elle découpe toute application en trois responsabilités :</p>
<ul>
<li><strong>Modèle</strong> (en anglais <em>Model</em>) : les données et les <strong>règles métier</strong> (les règles propres à ton activité, ex. « une signature fait au plus 500 caractères »). Ce sont les signatures, les membres… et bientôt la base de données avec Eloquent.</li>
<li><strong>Vue</strong> (<em>View</em>) : l'affichage, et rien d'autre (nos fichiers Blade).</li>
<li><strong>Contrôleur</strong> (<em>Controller</em>) : le chef d'orchestre — il reçoit la requête, interroge le modèle, choisit la vue.</li>
</ul>
<pre class="pseudo">Navigateur ── URL ──▶ ROUTEUR ──▶ CONTRÔLEUR ──▶ MODÈLE (données)   # 1) le navigateur envoie une URL ; le routeur la confie au controleur ; le controleur interroge le modele
                                      │              │                #    (le trait relie le controleur au modele)
                                      ◀──────────────┘                # 2) le modele renvoie les donnees demandees au controleur
                                      ▼                                #    puis le controleur descend vers la vue
                                    VUE (Blade) ──▶ HTML ──▶ Navigateur # 3) la vue met les donnees en forme (HTML) et le resultat repart au navigateur</pre>
<h3>2. Pourquoi découper ?</h3>
<p>Compare avec le livre d'or du cours PHP : un seul fichier mélangeait SQL, traitement du POST et HTML. Pour changer l'apparence, tu risquais de casser la requête SQL ! Avec MVC :</p>
<ul>
<li>Le designer travaille dans les vues sans toucher à la logique.</li>
<li>On change de base de données sans toucher aux vues.</li>
<li>Chaque partie se teste séparément (leçon 15).</li>
</ul>
<p>C'est le principe de <strong>séparation des responsabilités</strong> : une classe, un fichier = UN travail.</p>
<h3>3. Où va quel code ? Le guide de survie</h3>
<pre class="pseudo">« Quelle adresse déclenche quoi ? »       # -> routes/web.php            (l'adressage : URL + verbe)
« Que faire de cette requête ? »          # -> app/Http/Controllers/     (l'orchestration)
« À quoi ressemblent les données ? »      # -> app/Models/  (semaine 2)  (les donnees, le modele)
« Comment ça s'affiche ? »                # -> resources/views/          (l'affichage, Blade)
« Quelle est la config de la machine ? »  # -> .env                      (la configuration locale)</pre>
<h3>4. Le contrôleur maigre</h3>
<p>Règle professionnelle : un contrôleur doit rester <strong>maigre</strong> (en anglais <em>thin controller</em>) — quelques lignes qui délèguent. Si une méthode dépasse ~20 lignes de logique métier, cette logique doit descendre dans le modèle ou un service dédié (une classe spécialisée dans une tâche).</p>
<h3>5. MVC est partout</h3>
<p>Ce motif dépasse Laravel : Spring (Java), ASP.NET Core (C#), Django (Python), Ruby on Rails… utilisent tous une variante de MVC. En l'apprenant ici, tu apprends l'architecture de 90 % du web professionnel.</p>
<div class="tip">Test rapide pour savoir si ton code est au bon endroit : « Si je change l'apparence du site, dois-je modifier ce fichier ? » Oui → vue. « Si je change une règle métier ? » → modèle. « Si je change une URL ? » → routes.</div>
<div class="warn">Le piège classique du débutant : écrire des requêtes de base de données directement dans les vues Blade. Techniquement possible… et professionnellement inacceptable.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie MVC ?", opts: ["Multi View Controller", "Modèle - Vue - Contrôleur", "Main Virtual Code", "Model Verified Class"], a: 1, exp: "Les trois responsabilités de toute application web structurée." },
    { type: "qcm", q: "Quel est le rôle du Modèle ?", opts: ["Afficher le HTML", "Gérer les données et les règles métier", "Recevoir les requêtes HTTP", "Définir les URL"], a: 1, exp: "Le modèle représente et manipule les données — Eloquent dès la semaine 2." },
    { type: "qcm", q: "Quel est le rôle de la Vue ?", opts: ["Interroger la base", "Afficher les données, et rien d'autre", "Valider les formulaires", "Rediriger les requêtes"], a: 1, exp: "La vue est « bête » : elle reçoit des données prêtes et les met en forme." },
    { type: "qcm", q: "Quel est le rôle du Contrôleur ?", opts: ["Stocker les données", "Orchestrer : recevoir la requête, interroger le modèle, choisir la vue", "Styliser la page", "Compiler Blade"], a: 1, exp: "Le chef d'orchestre entre le modèle et la vue." },
    { type: "qcm", q: "Dans Laravel, où vivent les vues ?", opts: ["app/Http/", "resources/views/", "routes/", "database/"], a: 1, exp: "Les .blade.php dans resources/views." },

    { type: "qcm", q: "Le livre d'or du cours PHP (un fichier = SQL + POST + HTML) posait quel problème ?", opts: ["Il était trop rapide", "Tout était mélangé : impossible de modifier une partie sans risquer de casser les autres", "Il utilisait trop de fichiers", "PDO était interdit"], a: 1, exp: "C'est ce que MVC résout : chaque responsabilité dans son fichier." },
    { type: "qcm", q: "Que signifie « thin controller » (contrôleur maigre) ?", opts: ["Un contrôleur sans namespace", "Un contrôleur qui délègue : peu de lignes, pas de logique métier lourde", "Un contrôleur compressé", "Un contrôleur sans méthodes"], a: 1, exp: "La logique métier descend dans les modèles/services ; le contrôleur orchestre." },
    { type: "qcm", q: "Le designer veut changer les couleurs et la mise en page. Quels fichiers touche-t-il ?", opts: ["Les contrôleurs", "Les vues (et le CSS) uniquement", "routes/web.php", ".env"], a: 1, exp: "C'est LE bénéfice concret de la séparation." },
    { type: "qcm", q: "Écrire une requête de base de données dans une vue Blade, c'est :", opts: ["Recommandé pour la performance", "Possible techniquement mais contraire à MVC : la vue ne doit qu'afficher", "Impossible", "Obligatoire pour Eloquent"], a: 1, exp: "Le piège classique. Les données se préparent AVANT la vue." },
    { type: "qcm", q: "Quel principe général MVC applique-t-il ?", opts: ["La récursivité", "La séparation des responsabilités", "L'héritage multiple", "La compilation anticipée"], a: 1, exp: "Un fichier = un travail. Déjà vu avec les fonctions (leçon 9 de PHP) !" },
    { type: "qcm", q: "MVC est-il propre à Laravel ?", opts: ["Oui, c'est une invention de Laravel", "Non : Spring, ASP.NET Core, Django, Rails… suivent le même motif", "Oui, mais copié par WordPress", "Non, il n'existe que dans les jeux vidéo"], a: 1, exp: "Apprendre MVC = apprendre l'architecture du web professionnel." },
    { type: "vf", q: "Dans le flux MVC de Laravel, le contrôleur choisit quelle vue afficher.", a: true, exp: "return view('...') : c'est bien le contrôleur qui décide." },
    { type: "vf", q: "Pour changer l'URL d'une page, il faut modifier le contrôleur.", a: false, exp: "Les URL vivent dans routes/web.php — et grâce aux routes nommées, rien d'autre ne bouge." }
  ],
  final: {
    title: "Exercice final — L'audit d'un mauvais code",
    intro: `<p>Un stagiaire a écrit cette vue Blade. Fais l'audit MVC, ligne par ligne :</p>
<pre class="pseudo">{{-- resources/views/signatures/index.blade.php --}}
@php                                                                    {{-- ouvre un bloc de PHP brut DANS la vue (mauvaise idee ici) --}}
    $pdo = new PDO('mysql:host=localhost;dbname=livredor', 'root', 'secret123');   {{-- connexion a la base : n'a rien a faire dans une vue ! --}}
    $signatures = $pdo->query('SELECT * FROM signatures')->fetchAll();  {{-- requete SQL dans la vue : contraire a MVC --}}
    $total = count($signatures);                                        {{-- calcul (logique) dans la vue : a deplacer --}}
@endphp                                                                 {{-- fin du bloc PHP brut --}}
&lt;h1&gt;{{ $total }} signatures&lt;/h1&gt;                                        {{-- ca, c'est bien de l'affichage (correct) --}}
@foreach ($signatures as $s)                                           {{-- boucle sur les signatures --}}
    &lt;p&gt;{!! $s['contenu'] !!}&lt;/p&gt;                                        {{-- {!! !!} = AUCUN echappement : faille XSS ! --}}
@endforeach                                                            {{-- fin de la boucle --}}</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 : la connexion PDO et la requête SQL dans la vue. Où devraient-elles être ?", opts: ["Dans routes/web.php", "Côté modèle (Eloquent, semaine 2), appelé par le contrôleur", "Dans le layout", "C'est correct"], a: 1, exp: "La vue affiche ; les données viennent du modèle via le contrôleur." },
      { type: "qcm", q: "Problème n°2 : le mot de passe « secret123 » codé en dur. Où va la configuration sensible ?", opts: ["Dans le fichier .env", "Dans un commentaire", "Dans le HTML", "Dans le navigateur"], a: 0, exp: "Identifiants → .env, jamais dans le code (et jamais sur Git)." },
      { type: "qcm", q: "Problème n°3 : {!! $s['contenu'] !!} sur du contenu écrit par les visiteurs. Risque ?", opts: ["Aucun", "Faille XSS : un visiteur peut injecter du script exécuté chez les autres", "Erreur 419", "Doublons"], a: 1, exp: "Contenu utilisateur → TOUJOURS {{ }} (échappé)." },
      { type: "qcm", q: "Après correction, que restera-t-il dans cette vue ?", opts: ["La connexion PDO", "Uniquement l'affichage : le h1 et la boucle avec {{ }}", "Le mot de passe", "Le calcul du total"], a: 1, exp: "$signatures et $total arriveront du contrôleur via view()." },
      { type: "vf", q: "Ce code « fonctionne », donc il est acceptable en entreprise.", a: false, exp: "Fonctionner ne suffit pas : maintenabilité et sécurité font la qualité professionnelle." }
    ],
    solution: `<pre class="pseudo">// La version corrigee (esprit MVC) :

// .env                       -> DB_PASSWORD=secret123 (hors du code)
// app/Models/Signature.php   -> le modele Eloquent (semaine 2)

// SignatureController.php
public function index()
{
    $signatures = Signature::all();          // le modele fournit les donnees
    return view('signatures.index', [
        'signatures' => $signatures,
        'total'      => $signatures->count(),
    ]);
}

{{-- la vue ne fait plus QU'afficher --}}
<h1>{{ $total }} signatures</h1>
@foreach ($signatures as $s)
    <p>{{ $s->contenu }}</p>                 {{-- echappe ! --}}
@endforeach</pre>
<p>Semaine 1 terminée ! Tu maîtrises le flux route → contrôleur → vue. Semaine 2 : le M de MVC — les vraies données avec les migrations et Eloquent.</p>`
  }
};
