<script>
var DAY = {
  num: 3,
  title: "Les contrôleurs et Artisan",
  subtitle: "Sortir la logique des routes : place aux classes.",
  theory: `
<h3>1. Pourquoi des contrôleurs ?</h3>
<p>Rappel de POO (programmation orientée objet, leçons 16-17 de PHP) : une <strong>classe</strong> est un plan qui regroupe des <strong>méthodes</strong> (des fonctions rangées dans la classe). Hier, tout le code était dans des <em>closures</em> écrites directement dans <code>routes/web.php</code>. Sur un vrai projet, ce fichier deviendrait un monstre de 2000 lignes, impossible à relire. Un <strong>contrôleur</strong> (en anglais <em>controller</em>) est une classe qui regroupe la logique liée à un même sujet : <code>MessageController</code> pour les messages, <code>MembreController</code> pour les membres… Image : au lieu d'un seul énorme cahier fourre-tout, tu as un classeur par thème. C'est le « C » de l'architecture <strong>MVC</strong> (Modèle-Vue-Contrôleur) que tu découvriras au fil du cours.</p>
<h3>2. Générer un contrôleur avec Artisan</h3>
<pre class="pseudo">php artisan make:controller MessageController   # make:controller = "fabrique un controleur" ; MessageController = son nom (fini par "Controller")</pre>
<p>Artisan crée pour toi le fichier <code>app/Http/Controllers/MessageController.php</code> :</p>
<pre class="pseudo">namespace App\\Http\\Controllers;               // situe la classe : son "adresse logique" suit le chemin du fichier

class MessageController extends Controller     // declare la classe ; "extends Controller" = elle herite du Controller de base de Laravel
{                                              // debut du corps de la classe
    public function index()                    // methode "index" : conventionnellement, affiche la LISTE
    {                                          // debut du corps de la methode
        return 'Liste des messages';           // renvoie ce texte comme reponse au navigateur
    }                                          // fin de la methode index

    public function show(int $id)              // methode "show" : affiche UN element ; $id est un entier recu de l'URL
    {                                          // debut du corps de show
        return 'Message n°' . $id;             // renvoie "Message n°" colle au numero demande
    }                                          // fin de la methode show
}                                              // fin de la classe</pre>
<h3>3. Relier route et contrôleur</h3>
<pre class="pseudo">use App\\Http\\Controllers\\MessageController;              // importe la classe pour pouvoir l'utiliser ici

Route::get('/messages', [MessageController::class, 'index']);        // GET /messages  ->  appelle la methode index()
Route::get('/messages/{id}', [MessageController::class, 'show']);    // GET /messages/{id}  ->  appelle show($id)</pre>
<p>Au lieu d'une closure, on passe un tableau <code>[Classe, 'méthode']</code> : <code>MessageController::class</code> donne le nom complet de la classe, et <code>'index'</code> nomme la méthode à appeler. Quand la route est visitée, Laravel <strong>crée l'objet contrôleur lui-même</strong> et appelle la méthode. Tu n'écris jamais <code>new MessageController()</code> : encore l'inversion de contrôle.</p>
<h3>4. Les conventions de nommage</h3>
<p>Laravel repose sur des <strong>conventions</strong> (des habitudes partagées). Pour un contrôleur de <em>ressource</em> (un type de donnée : messages, membres…), les noms de méthodes standard sont :</p>
<pre class="pseudo">index()   # affiche la liste          -> GET  /messages
show($id) # affiche UN element        -> GET  /messages/{id}
create()  # affiche le formulaire     -> GET  /messages/create
store()   # enregistre le nouveau     -> POST /messages
edit($id) / update($id) / destroy($id) # modifier / mettre a jour / supprimer</pre>
<p>Respecter ces noms n'est pas obligatoire, mais tout développeur Laravel les connaît : ton code devient lisible par toute l'équipe.</p>
<h3>5. Le namespace et l'autoloading</h3>
<p>Remarque la première ligne : <code>namespace App\\Http\\Controllers;</code>. Un <strong>namespace</strong> (« espace de noms ») est comme un dossier logique qui évite que deux classes du même nom se percutent. Ici il correspond au chemin du fichier — grâce à ça, Composer charge automatiquement la bonne classe quand tu l'utilises : c'est l'<strong>autoloading PSR-4</strong> (« chargement automatique »). Plus jamais de <code>require 'MessageController.php'</code> comme au cours PHP !</p>
<div class="warn">Si tu oublies le <code>use App\\Http\\Controllers\\MessageController;</code> en haut de routes/web.php, PHP cherchera la classe au mauvais endroit : erreur « Class not found ».</div>
<div class="tip">Artisan sait générer presque tout : <code>make:controller</code>, <code>make:model</code>, <code>make:migration</code>… Tape <code>php artisan make:</code> puis la touche Tab pour découvrir la liste.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi déplacer la logique des routes vers des contrôleurs ?", opts: ["C'est obligatoire pour que Laravel démarre", "Pour organiser le code par sujet et garder routes/web.php lisible", "Parce que les closures sont interdites en production", "Pour supprimer le fichier routes/web.php"], a: 1, exp: "Un contrôleur par ressource : le code est rangé, testable et lisible." },
    { type: "input", q: "Quelle commande Artisan génère un contrôleur nommé LivreController ?", a: ["php artisan make:controller LivreController"], ph: "commande complète", exp: "php artisan make:controller LivreController → app/Http/Controllers/LivreController.php." },
    { type: "qcm", q: "Dans quel dossier Artisan place-t-il les contrôleurs ?", opts: ["app/Http/Controllers/", "routes/controllers/", "public/controllers/", "vendor/app/"], a: 0, exp: "Convention Laravel : app/Http/Controllers." },
    { type: "qcm", q: "Comment relier GET /messages à la méthode index de MessageController ?", opts: ["Route::get('/messages', 'index')", "Route::get('/messages', [MessageController::class, 'index'])", "Route::controller('/messages')", "index(MessageController)"], a: 1, exp: "Le tableau [Classe::class, 'méthode'] remplace la closure." },
    { type: "qcm", q: "Qui crée l'instance du contrôleur quand une route est visitée ?", opts: ["Toi, avec new MessageController()", "Laravel, automatiquement (inversion de contrôle)", "Le navigateur", "Composer"], a: 1, exp: "Tu n'écris jamais new pour un contrôleur : le framework s'en charge." },
    { type: "qcm", q: "Selon les conventions Laravel, quelle méthode affiche la liste de tous les éléments ?", opts: ["list()", "index()", "all()", "get()"], a: 1, exp: "index = la liste, show = un seul élément." },
    { type: "qcm", q: "Et quelle méthode enregistre un nouvel élément reçu en POST ?", opts: ["save()", "add()", "store()", "insert()"], a: 2, exp: "store() reçoit le POST du formulaire affiché par create()." },
    { type: "qcm", q: "Quelle méthode conventionnelle affiche UN message précis, ex. GET /messages/5 ?", opts: ["show($id)", "index()", "one($id)", "detail($id)"], a: 0, exp: "show reçoit l'identifiant capturé par {id}." },
    { type: "qcm", q: "À quoi sert la ligne namespace App\\Http\\Controllers; en haut du contrôleur ?", opts: ["C'est un commentaire", "Elle situe la classe : le namespace suit le chemin du fichier, permettant l'autoloading", "Elle protège la classe", "Elle importe Laravel"], a: 1, exp: "Namespace = adresse logique de la classe ; Composer s'en sert pour la charger (PSR-4)." },
    { type: "qcm", q: "Grâce à l'autoloading de Composer, que n'écrit-on plus jamais ?", opts: ["class", "return", "require 'MonFichier.php' pour charger ses classes", "function"], a: 2, exp: "Au cours PHP tu faisais des require ; ici use + autoloading suffisent." },
    { type: "qcm", q: "Erreur « Target class [MessageController] does not exist ». Cause probable ?", opts: ["Le use App\\Http\\Controllers\\MessageController; manque dans routes/web.php", "Le port 8000 est occupé", "Le fichier du contrôleur est vide", "Le nom de la méthode est mal orthographié"], a: 0, exp: "Sans le use, Laravel cherche la classe au mauvais endroit." },
    { type: "qcm", q: "Les paramètres de route ({id}) fonctionnent-ils avec les méthodes de contrôleur ?", opts: ["Non, seulement avec les closures", "Oui : public function show(int $id) reçoit la valeur de {id}", "Oui mais uniquement en POST", "Non, il faut $_GET"], a: 1, exp: "Le mécanisme est identique : Laravel injecte les paramètres capturés." },
    { type: "input", q: "Selon la convention, comment s'appelle la méthode qui supprime un élément ?", a: ["destroy", "destroy()"], ph: "nom de méthode", exp: "destroy($id) — appelée via le verbe DELETE (ou un POST simulé, leçon 6)." },
    { type: "vf", q: "Respecter les noms conventionnels (index, show, store…) est techniquement obligatoire.", a: false, exp: "Techniquement non, mais c'est le langage commun de tous les développeurs Laravel." },
    { type: "vf", q: "Un contrôleur généré par Artisan hérite de la classe Controller de Laravel.", a: true, exp: "extends Controller — l'héritage vu à la leçon 17 de PHP, en action." }
  ],
  final: {
    title: "Exercice final — Restructurer le livre d'or",
    intro: `<p>Tu réorganises les routes d'hier avec un contrôleur. Analyse chaque ligne :</p>
<pre class="pseudo">// app/Http/Controllers/SignatureController.php
namespace App\\Http\\Controllers;              // adresse logique de la classe (suit le chemin du fichier)

class SignatureController extends Controller  // classe SignatureController, herite du Controller de Laravel
{                                             // debut de la classe
    public function index()        { return 'Toutes les signatures'; }   // GET /signatures : renvoie la liste
    public function show(int $id)  { return 'Signature n°' . $id; }       // GET /signatures/{id} : renvoie une signature
    public function store()        { return 'Signature enregistrée'; }   // POST /signatures : enregistre puis confirme
}                                             // fin de la classe

// routes/web.php
use App\\Http\\Controllers\\SignatureController;                          // importe la classe du controleur

Route::get('/signatures', [SignatureController::class, 'index']);        // GET /signatures       -> index()
Route::get('/signatures/{id}', [SignatureController::class, 'show']);    // GET /signatures/{id}  -> show($id)
Route::post('/signatures', [SignatureController::class, 'store']);       // POST /signatures      -> store()</pre>`,
    questions: [
      { type: "qcm", q: "Un visiteur demande GET /signatures/12. Quelle méthode s'exécute et que reçoit-il ?", opts: ["index() → « Toutes les signatures »", "show(12) → « Signature n°12 »", "store() → « Signature enregistrée »", "Erreur 404"], a: 1, exp: "La route {id} capture 12 et l'injecte dans show." },
      { type: "qcm", q: "Quelle commande a permis de générer la classe SignatureController ?", opts: ["php artisan make:controller SignatureController", "composer create SignatureController", "php artisan new:class", "make controller"], a: 0, exp: "make:controller crée le fichier au bon endroit avec le bon namespace." },
      { type: "qcm", q: "Un formulaire envoie POST /signatures. Quelle méthode répond ?", opts: ["index()", "show()", "store() : convention pour l'enregistrement", "create()"], a: 2, exp: "POST sur la ressource = store." },
      { type: "qcm", q: "Tu veux ajouter l'affichage d'un formulaire de signature (GET /signatures/create). Quelle méthode conventionnelle ajoutes-tu ?", opts: ["form()", "create()", "new()", "add()"], a: 1, exp: "create() affiche le formulaire ; store() le traitera." },
      { type: "vf", q: "Dans ce code, il a fallu écrire new SignatureController() quelque part pour que ça fonctionne.", a: false, exp: "Jamais : Laravel instancie le contrôleur à chaque requête. C'est lui qui appelle ton code." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 3 :
// 1. Un controleur = une classe qui regroupe la logique d'une ressource.
// 2. php artisan make:controller XxxController le genere au bon endroit.
// 3. Route::get('/x', [XxxController::class, 'methode']) remplace la closure.
// 4. Conventions : index, show, create, store, edit, update, destroy.
// 5. namespace + autoloading Composer : plus de require manuels.</pre>
<p>Nos méthodes renvoient encore du texte brut. Demain : de vraies pages HTML avec Blade.</p>`
  }
};

var ECRITURE = {

    checklist: ["Le controleur declare-t-il namespace App\\Http\\Controllers; et extends Controller ?", "Les routes utilisent-elles la syntaxe [MembreController::class, 'index'] ?", "Le use App\\Http\\Controllers\\MembreController; est-il present dans routes/web.php ?", "show(int $id) recoit-il bien le {id} de l'URL ?"],
    hints: [
      "Le contrôleur commence par namespace App\\Http\\Controllers; puis class MembreController extends Controller.",
      "Chaque route reçoit un tableau : [MembreController::class, 'nomDeMethode'].",
      "N'oublie pas le use App\\Http\\Controllers\\MembreController; dans routes/web.php."
    ],
    solution: "// app/Http/Controllers/MembreController.php\nnamespace App\\Http\\Controllers;\n\nclass MembreController extends Controller\n{\n    public function index()               // GET /membres\n    {\n        return 'Liste des membres';\n    }\n\n    public function show(int $id)         // GET /membres/{id}\n    {\n        return 'Membre n°' . $id;         // $id injecté depuis l'URL\n    }\n}\n\n// routes/web.php\nuse App\\Http\\Controllers\\MembreController;\n\nRoute::get('/membres', [MembreController::class, 'index']);\nRoute::get('/membres/{id}', [MembreController::class, 'show']);",
    note: "Génère toujours tes contrôleurs avec Artisan : le namespace et l'héritage sont écrits pour toi, sans faute de frappe possible." }
  ]
};
