<script>
var DAY = {
  num: 15,
  title: "Tester son application",
  subtitle: "Prouver que ça marche — et que ça marche ENCORE après chaque modification.",
  theory: `
<h3>1. Pourquoi des tests automatisés ?</h3>
<p>Un <strong>test automatisé</strong> est un petit programme qui vérifie tout seul qu'une partie de ton code se comporte comme prévu. Jusqu'ici, tu testais à la main : lancer le serveur, cliquer, vérifier. Sur un vrai projet, chaque modification peut casser une fonctionnalité qui marchait : on appelle ça une <strong>régression</strong> (un retour en arrière non voulu). Les tests automatisés rejouent TOUTES les vérifications en quelques secondes avec la commande <code>php artisan test</code>.</p>
<h3>2. Anatomie d'un test</h3>
<p>Les tests vivent dans <code>tests/Feature</code> (ils traversent toute l'application, comme un vrai visiteur) et <code>tests/Unit</code> (ils isolent une seule classe). On en génère un avec <code>php artisan make:test SignatureTest</code> :</p>
<pre class="pseudo">class SignatureTest extends TestCase                     // classe de test ; herite de TestCase (outillage de test)
{
    use RefreshDatabase;   // "trait" qui remet la base de test a zero avant chaque test

    public function test_la_liste_des_signatures_saffiche(): void   // un test = une methode commencant par "test_"
    {
        $reponse = $this->get('/signatures');            // ACT : simule une requete GET vers /signatures

        $reponse->assertStatus(200);                     // ASSERT : la reponse est-elle un succes (code 200) ?
        $reponse->assertSee('Toutes les signatures');    // ASSERT : la page contient-elle ce texte ?
    }
}</pre>
<p>Le squelette universel d'un test : <strong>Arrange</strong> (préparer les données), <strong>Act</strong> (agir : lancer l'action à tester), <strong>Assert</strong> (vérifier le résultat). Une <strong>assertion</strong> est une vérification qui fait échouer le test si elle est fausse.</p>
<h3>3. Tester un POST de bout en bout</h3>
<pre class="pseudo">public function test_on_peut_signer_le_livre_dor(): void
{
    $reponse = $this->post('/signatures', [              // ACT : simule l'envoi du formulaire (POST)...
        'auteur' => 'Aurélia', 'contenu' => 'Superbe site !',   // ...avec ces donnees
    ]);

    $reponse->assertRedirect('/signatures');             // ASSERT : on est bien redirige vers la liste
    $this->assertDatabaseHas('signatures', ['auteur' => 'Aurélia']);   // ASSERT : la ligne existe bien en base
}

public function test_un_contenu_trop_court_est_refuse(): void
{
    $reponse = $this->post('/signatures', [              // ACT : on envoie un contenu trop court...
        'auteur' => 'Aurélia', 'contenu' => 'ok',        // ..."ok" fait 2 caracteres (< min:5)
    ]);

    $reponse->assertSessionHasErrors('contenu');         // ASSERT : la validation a rejete le champ contenu
    $this->assertDatabaseCount('signatures', 0);         // ASSERT : rien n'a ete cree (table vide)
}</pre>
<p>Remarque : on teste le cas <strong>nominal</strong> (quand tout va bien) ET le cas d'<strong>erreur</strong>. Un bon testeur est un pessimiste organisé.</p>
<h3>4. RefreshDatabase et les factories</h3>
<p><code>RefreshDatabase</code> est un <strong>trait</strong> (un bloc de code réutilisable ajouté à une classe avec <code>use</code>) qui migre une base de test vierge avant chaque test : tes tests n'abîment JAMAIS tes vraies données. Pour peupler rapidement, les <strong>factories</strong> (« usines ») fabriquent des objets réalistes :</p>
<pre class="pseudo">Signature::factory()->create();              // fabrique 1 signature aleatoire et l'enregistre
Signature::factory()->count(10)->create();   // fabrique 10 signatures d'un coup
Signature::factory()->create(['auteur' => 'Marc']);  // fabrique 1 signature en imposant l'auteur "Marc"</pre>
<h3>5. Lancer les tests</h3>
<pre class="pseudo">php artisan test                      # lance TOUS les tests du projet
php artisan test --filter=Signature   # ne lance que la classe/methode contenant "Signature"</pre>
<div class="warn">Un test qui échoue n'est pas un ennemi : il vient de t'éviter de livrer un bug. Le vrai danger, ce sont les fonctionnalités jamais testées.</div>
<div class="tip">Règle d'équipe courante : chaque bug corrigé reçoit un test qui le reproduit. Le même bug ne reviendra jamais deux fois.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une régression ?", opts: ["Un test qui rate", "Une fonctionnalité qui marchait et qu'une modification a cassée", "Une base qui rétrécit", "Un retour de version PHP"], a: 1, exp: "Les tests automatisés sont le filet anti-régression." },
    { type: "input", q: "Quelle commande lance tous les tests du projet ?", a: ["php artisan test", "artisan test"], ph: "commande", exp: "php artisan test — à lancer avant chaque commit." },
    { type: "qcm", q: "Différence entre tests/Feature et tests/Unit ?", opts: ["Aucune", "Feature traverse l'application par HTTP simulé ; Unit isole une classe", "Unit est plus lent", "Feature est optionnel"], a: 1, exp: "Feature : route → contrôleur → base → vue. Unit : une méthode, un calcul." },
    { type: "qcm", q: "Que fait $this->get('/signatures') dans un test ?", opts: ["Ouvre un navigateur", "Simule une requête GET complète à travers l'application", "Lit un fichier", "Appelle l'API GitHub"], a: 1, exp: "Sans serveur ni navigateur : la requête traverse le vrai code." },
    { type: "qcm", q: "Que vérifie assertStatus(200) ?", opts: ["Le nombre de signatures", "Que la réponse HTTP est un succès (code 200)", "Que le test dure 200 ms", "La version de Laravel"], a: 1, exp: "Premier réflexe : la page répond-elle correctement ?" },
    { type: "qcm", q: "Que vérifie assertDatabaseHas('signatures', ['auteur' => 'Aurélia']) ?", opts: ["Que la table existe", "Qu'une ligne avec auteur=Aurélia existe bien dans la table signatures", "Que la base est vide", "Le schéma de la table"], a: 1, exp: "L'assertion de persistance : l'action a-t-elle vraiment écrit en base ?" },
    { type: "qcm", q: "À quoi sert le trait RefreshDatabase ?", opts: ["À sauvegarder la prod", "À donner à chaque test une base vierge fraîchement migrée", "À rafraîchir le navigateur", "À vider le cache de config"], a: 1, exp: "Chaque test part de zéro : indépendance et sécurité des données." },
    { type: "qcm", q: "Quel est le squelette universel d'un test ?", opts: ["Si/Sinon/Fin", "Arrange (préparer), Act (agir), Assert (vérifier)", "Créer/Lire/Supprimer", "Get/Post/Put"], a: 1, exp: "Trois temps, dans cet ordre, dans chaque test du monde." },
    { type: "qcm", q: "Que fabrique Signature::factory()->count(10)->create() ?", opts: ["10 usines", "10 signatures réalistes en base de test", "10 tests", "10 migrations"], a: 1, exp: "Les factories génèrent des données de test crédibles sans effort." },
    { type: "qcm", q: "Pourquoi tester AUSSI le cas d'erreur (contenu trop court) ?", opts: ["Pour le plaisir", "La validation est une fonctionnalité : il faut prouver qu'elle refuse ce qu'elle doit refuser", "C'est inutile", "Pour ralentir la CI"], a: 1, exp: "assertSessionHasErrors + assertDatabaseCount(0) : le refus est vérifié." },
    { type: "qcm", q: "Que vérifie assertSessionHasErrors('contenu') ?", opts: ["Que la session a expiré", "Que la validation a rejeté le champ contenu", "Que le contenu est en session", "Qu'un flash succes existe"], a: 1, exp: "L'échec de validation flashe les erreurs en session : on le détecte ainsi." },
    { type: "qcm", q: "Un test échoue après ta modification. Réaction professionnelle ?", opts: ["Supprimer le test", "Comprendre : soit ton code a un bug, soit le test doit évoluer avec le comportement voulu", "Commenter le test", "Relancer jusqu'à ce que ça passe"], a: 1, exp: "Le test qui échoue est un messager — on ne tire pas sur le messager." },
    { type: "qcm", q: "Comment ne lancer que les tests de la classe SignatureTest ?", opts: ["php artisan test --filter=SignatureTest", "php artisan test:one", "phpunit only", "Impossible"], a: 0, exp: "--filter cible une classe ou une méthode." },
    { type: "vf", q: "Grâce à RefreshDatabase, les tests peuvent s'exécuter sans risque pour les données de développement.", a: true, exp: "La base de test est séparée et remise à zéro — configure-la dans phpunit.xml (SQLite en mémoire souvent)." },
    { type: "vf", q: "Si tous les tests passent, l'application est garantie sans aucun bug.", a: false, exp: "Les tests prouvent ce qu'ils vérifient — rien de plus. Mais chaque test ajouté rétrécit le territoire des bugs." }
  ],
  final: {
    title: "Exercice final — La suite de tests du livre d'or",
    intro: `<p>Analyse cette sortie de <code>php artisan test</code>, ligne par ligne :</p>
<pre class="pseudo">   PASS  Tests\\Feature\\SignatureTest              # la classe de tests concernee
  ✓ la liste des signatures saffiche          0.12s   # test REUSSI (coche verte)
  ✓ on peut signer le livre dor               0.09s   # test REUSSI
  ✗ un contenu trop court est refuse          0.08s   # test ECHOUE (croix)

  FAILED  un contenu trop court est refuse            # detail du test en echec
  Failed asserting that the session has errors for [contenu].   # l'assertion attendue n'est pas verifiee
  ...
  Tests:  1 failed, 2 passed                          # bilan : 1 echec, 2 reussites</pre>
<p>Et le code de validation actuel : <code>'contenu' => 'required|string|max:500'</code></p>`,
    questions: [
      { type: "qcm", q: "Pourquoi le troisième test échoue-t-il ?", opts: ["Le test est mal écrit", "La règle min:5 a disparu de la validation : « ok » (2 caractères) est accepté", "La base est pleine", "RefreshDatabase manque"], a: 1, exp: "Le test attend un refus qui n'arrive plus : il vient de détecter une régression réelle." },
      { type: "qcm", q: "Ce scénario illustre précisément :", opts: ["Un faux positif", "Une régression attrapée par un test : quelqu'un a retiré min:5 sans le vouloir", "Un bug de PHPUnit", "Un problème de cache"], a: 1, exp: "Sans ce test, le bug serait parti en production silencieusement." },
      { type: "qcm", q: "La correction ?", opts: ["Supprimer le test", "Remettre min:5 dans les règles de validation, puis relancer les tests", "Changer assertSessionHasErrors", "Vider la session"], a: 1, exp: "Le code se plie au comportement voulu — que le test documente." },
      { type: "qcm", q: "Les deux premiers tests « passent ». Qu'est-ce que cela prouve ?", opts: ["Que tout le site est parfait", "Que la liste s'affiche (200 + texte) et que la création écrit en base : ce qui est vérifié, exactement", "Rien", "Que la prod est déployée"], a: 1, exp: "Un test prouve son assertion, ni plus ni moins." },
      { type: "vf", q: "Ces trois tests ont nécessité un navigateur et un serveur lancés.", a: false, exp: "Non : les requêtes sont simulées en mémoire. C'est pour ça qu'ils tournent en 0,3 s." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 15 :
// 1. php artisan test rejoue toutes les verifications : filet anti-regression.
// 2. Feature = traversee HTTP simulee ; Unit = classe isolee.
// 3. Arrange / Act / Assert : le squelette de tout test.
// 4. get()/post() + assertStatus/assertSee/assertRedirect/
//    assertDatabaseHas/assertSessionHasErrors.
// 5. RefreshDatabase + factories : base vierge et donnees realistes.
// 6. Tester le cas nominal ET les cas d'erreur.</pre>
<p>L'application est testée. Prochaine étape : savoir QUI est là — l'authentification.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton test ici…",
  items: [
  { id: "laravel-test-membre", title: "Tester l'inscription d'un membre", level: 3,
    statement: "Écris deux tests Feature : (1) <code>test_un_membre_peut_sinscrire</code> : un POST vers <code>/membres</code> avec un pseudo « Aurélia » et un age 25 doit rediriger vers <code>/membres</code> et la ligne doit exister en base ; (2) <code>test_le_pseudo_est_obligatoire</code> : un POST sans pseudo doit provoquer une erreur de validation sur <code>pseudo</code> et la table doit rester vide. N'oublie pas le trait qui protège la base.",
    atoi: {cmd: "php artisan test --filter=MembreTest", expected: "PHPUnit execute les 2 tests :\n  PASS  Tests\\Feature\\MembreTest\n  ✓ un membre peut sinscrire\n  ✓ le pseudo est obligatoire\n  Tests: 2 passed\nSans le trait RefreshDatabase, la base garderait les lignes d'un test a l'autre\net le second test echouerait (assertDatabaseCount('membres', 0))."},
    checklist: ["La classe utilise-t-elle use RefreshDatabase; ?", "Le test 1 enchaine-t-il $this->post('/membres', [...]) puis assertRedirect + assertDatabaseHas ?", "Le test 2 verifie-t-il assertSessionHasErrors('pseudo') et assertDatabaseCount('membres', 0) ?", "Chaque test a-t-il un nom explicite commencant par test_ ?"],
    hints: [
      "use RefreshDatabase; en haut de la classe de test.",
      "Test 1 : $this->post('/membres', [...]) puis assertRedirect et assertDatabaseHas.",
      "Test 2 : assertSessionHasErrors('pseudo') et assertDatabaseCount('membres', 0)."
    ],
    solution: "class MembreTest extends TestCase\n{\n    use RefreshDatabase;                      // base vierge à chaque test\n\n    public function test_un_membre_peut_sinscrire(): void\n    {\n        // Act : POST simulé à travers toute l'application\n        $reponse = $this->post('/membres', [\n            'pseudo' => 'Aurélia',\n            'age'    => 25,\n        ]);\n\n        // Assert : redirection + persistance\n        $reponse->assertRedirect('/membres');\n        $this->assertDatabaseHas('membres', ['pseudo' => 'Aurélia']);\n    }\n\n    public function test_le_pseudo_est_obligatoire(): void\n    {\n        $reponse = $this->post('/membres', ['age' => 25]);\n\n        $reponse->assertSessionHasErrors('pseudo');   // validation déclenchée\n        $this->assertDatabaseCount('membres', 0);     // rien n'a été créé\n    }\n}",
    note: "Deux tests, deux philosophies : le premier prouve que la porte s'ouvre, le second qu'elle reste fermée à qui n'a pas la clé. Toujours les deux." }
  ]
};
