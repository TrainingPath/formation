<script>
var DAY = {
  num: 12,
  title: "Valider les données",
  subtitle: "Ne jamais faire confiance aux données entrantes — mais laisser Laravel s'en charger.",
  theory: `
<h3>1. Le rappel qui sauve</h3>
<p><strong>Valider</strong>, c'est vérifier que les données reçues respectent des règles avant de les utiliser. Leçon 13 de PHP : « toute donnée venant de l'extérieur est suspecte ». Tu écrivais alors des cascades de <code>if (empty(...))</code>, <code>filter_var(..., FILTER_VALIDATE_EMAIL)</code>… Laravel remplace tout ça par une simple déclaration de <strong>règles</strong> (les conditions que chaque champ doit respecter).</p>
<h3>2. $request->validate()</h3>
<pre class="pseudo">public function store(Request $request)                // recoit le formulaire
{
    $valides = $request->validate([                    // valide les champs selon des regles ; renvoie les donnees propres
        'auteur'  => 'required|string|max:100',        // auteur : obligatoire, texte, 100 caracteres max
        'email'   => 'nullable|email',                 // email : facultatif, mais format email si fourni
        'contenu' => 'required|string|min:5|max:500',  // contenu : obligatoire, texte, entre 5 et 500 caracteres
    ]);                                                // le | separe les regles d'un meme champ

    Signature::create($valides);                       // cree la signature avec les seules donnees validees
    return redirect()->route('signatures.index');      // redirige vers la liste (Post/Redirect/Get)
}</pre>
<p>Chaque champ reçoit ses règles, séparées par <code>|</code>. Deux issues :</p>
<ul>
<li><strong>Tout est valide</strong> : <code>$valides</code> contient UNIQUEMENT les champs validés (bonus sécurité : un champ pirate non listé est écarté) et le code continue.</li>
<li><strong>Échec</strong> : Laravel redirige automatiquement vers le formulaire, avec les erreurs ET l'ancienne saisie (le fameux <code>old()</code> de la leçon 6). Ton code après validate() ne s'exécute pas.</li>
</ul>
<h3>3. Les règles incontournables</h3>
<pre class="pseudo">required          # -> champ obligatoire (doit etre present et non vide)
nullable          # -> le champ peut etre vide
string / integer / boolean / date   # -> impose le type de la donnee
email             # -> doit etre un format d'email valide
min:5 / max:500   # -> longueur d'un texte, ou valeur d'un nombre
unique:membres,pseudo   # -> aucune ligne de la table membres n'a deja ce pseudo
confirmed         # -> exige un champ "<nom>_confirmation" identique (mots de passe)
in:oui,non        # -> la valeur doit figurer dans cette liste fermee</pre>
<h3>4. Afficher les erreurs dans la vue</h3>
<pre class="pseudo">{{-- toutes les erreurs d'un coup --}}
@if ($errors->any())                        {{-- SI au moins une erreur existe... --}}
    &lt;ul&gt;                                    {{-- ...ouvre une liste --}}
    @foreach ($errors->all() as $erreur)    {{-- pour chaque message d'erreur... --}}
        &lt;li&gt;{{ $erreur }}&lt;/li&gt;              {{-- ...affiche-le dans une puce --}}
    @endforeach                             {{-- fin de la boucle --}}
    &lt;/ul&gt;                                   {{-- ferme la liste --}}
@endif                                      {{-- fin du if --}}

{{-- ou champ par champ, sous l'input concerne --}}
&lt;input name="auteur" value="{{ old('auteur') }}"&gt;   {{-- champ auteur ; old() restaure la saisie --}}
@error('auteur') &lt;span class="err"&gt;{{ $message }}&lt;/span&gt; @enderror   {{-- affiche l'erreur du champ auteur, si elle existe --}}</pre>
<p>La variable <code>$errors</code> est disponible dans TOUTES les vues, automatiquement.</p>
<h3>5. Valider ne dispense pas d'échapper</h3>
<p>Validation (entrée propre) et échappement <code>{{ }}</code> (sortie sûre) sont deux remparts <strong>complémentaires</strong> : un contenu peut être « valide » (moins de 500 caractères) et contenir quand même du HTML malveillant.</p>
<div class="warn">Ne valide JAMAIS uniquement côté navigateur (attribut required de HTML) : un pirate contourne le navigateur en 5 secondes. La validation côté serveur est la seule qui compte ; celle du navigateur n'est qu'un confort.</div>
<div class="tip">Astuce pro : Signature::create($request->validate([...])) en une ligne — validation, filtrage et création d'un coup.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait $request->validate([...]) si toutes les règles passent ?", opts: ["Rien", "Renvoie un tableau contenant uniquement les champs validés", "Renvoie true", "Redirige vers l'accueil"], a: 1, exp: "Le retour filtré est parfait à passer à create()." },
    { type: "qcm", q: "Et si une règle échoue ?", opts: ["Une exception fatale s'affiche au visiteur", "Laravel redirige vers le formulaire avec les erreurs et l'ancienne saisie ; la suite du code ne s'exécute pas", "Le champ est vidé et on continue", "Le site plante"], a: 1, exp: "Tout le circuit d'erreur est automatique — tu n'écris rien." },
    { type: "qcm", q: "Quelle règle rend un champ obligatoire ?", opts: ["notEmpty", "required", "must", "filled!"], a: 1, exp: "required : la règle la plus utilisée." },
    { type: "qcm", q: "Écris la règle complète pour un email facultatif mais valide s'il est fourni :", opts: ["nullable|email", "required|email", "email|max", "optional"], a: 0, exp: "nullable autorise l'absence ; email valide le format sinon." },
    { type: "input", q: "Quelle règle limite un texte à 500 caractères maximum ?", a: ["max:500"], ph: "règle", exp: "max:500 (min:5 pour un minimum)." },
    { type: "qcm", q: "Que vérifie unique:membres,pseudo ?", opts: ["Que le pseudo est joli", "Qu'aucune ligne de la table membres n'a déjà ce pseudo", "Que le pseudo est unique dans le formulaire", "Que la table existe"], a: 1, exp: "Indispensable pour les inscriptions : pas deux fois le même pseudo." },
    { type: "qcm", q: "À quoi sert la règle confirmed sur le champ password ?", opts: ["À chiffrer le mot de passe", "À exiger un champ password_confirmation identique", "À envoyer un email", "À vérifier la force du mot de passe"], a: 1, exp: "Le classique « confirmez votre mot de passe »." },
    { type: "qcm", q: "Dans la vue, que contient la variable $errors ?", opts: ["Les erreurs PHP", "Les messages d'échec de validation, disponibles dans toutes les vues", "Les logs du serveur", "Rien par défaut"], a: 1, exp: "Fournie automatiquement, même quand elle est vide." },
    { type: "qcm", q: "Quelle directive affiche l'erreur du seul champ auteur ?", opts: ["@error('auteur') {{ $message }} @enderror", "@if($auteur)", "{{ $errors }}", "@validate('auteur')"], a: 0, exp: "@error cible un champ ; $message contient son premier message." },
    { type: "qcm", q: "Pourquoi combiner validate() avec old() dans le formulaire ?", opts: ["Pour la performance", "Après un échec, les champs se repeuplent : le visiteur corrige au lieu de tout retaper", "C'est obligatoire", "Pour éviter le CSRF"], a: 1, exp: "Le duo confort : erreurs affichées + saisie conservée." },
    { type: "qcm", q: "L'attribut HTML required suffit-il à sécuriser un formulaire ?", opts: ["Oui", "Non : il se contourne en 5 secondes ; seule la validation SERVEUR fait foi", "Oui, en HTTPS", "Oui, avec Chrome"], a: 1, exp: "Le navigateur appartient à l'utilisateur — potentiellement hostile." },
    { type: "qcm", q: "Un champ « admin » envoyé par un pirate n'est pas dans les règles de validate(). Que devient-il dans le tableau retourné ?", opts: ["Il y figure", "Il est écarté : validate() ne retourne que les champs listés", "Il provoque une erreur", "Il passe à true"], a: 1, exp: "Double protection avec $fillable — la défense en profondeur." },
    { type: "qcm", q: "Un contenu validé (max:500 OK) peut-il encore être dangereux à l'affichage ?", opts: ["Non, il est validé", "Oui : il peut contenir du HTML/JS → l'échappement {{ }} reste indispensable", "Non, si HTTPS", "Oui, mais seulement en SQLite"], a: 1, exp: "Validation en entrée + échappement en sortie : DEUX remparts." },
    { type: "vf", q: "Après un échec de validation, le code situé après $request->validate() s'exécute quand même.", a: false, exp: "Non : Laravel interrompt et redirige. Ton code ne voit que des données valides." },
    { type: "vf", q: "La règle in:oui,non refuse la valeur « peut-être ».", a: true, exp: "in: définit la liste fermée des valeurs acceptées." }
  ],
  final: {
    title: "Exercice final — Le formulaire blindé",
    intro: `<p>La signature du livre d'or, version complète. Analyse chaque ligne :</p>
<pre class="pseudo">public function store(Request $request)                // recoit le formulaire
{
    $valides = $request->validate([                    // valide et filtre les champs
        'auteur'  => 'required|string|max:100',        // obligatoire, texte, <= 100
        'email'   => 'nullable|email',                 // facultatif, format email si present
        'contenu' => 'required|string|min:5|max:500',  // obligatoire, entre 5 et 500 caracteres
    ]);
    Signature::create($valides);                       // cree la signature (donnees propres)
    return redirect()->route('signatures.index');      // redirige vers la liste
}

{{-- Le formulaire : --}}
&lt;input name="auteur" value="{{ old('auteur') }}"&gt;                 {{-- champ auteur ; old() restaure la saisie --}}
@error('auteur') &lt;span&gt;{{ $message }}&lt;/span&gt; @enderror            {{-- erreur eventuelle du champ auteur --}}
&lt;textarea name="contenu"&gt;{{ old('contenu') }}&lt;/textarea&gt;          {{-- zone contenu ; old() entre les balises --}}
@error('contenu') &lt;span&gt;{{ $message }}&lt;/span&gt; @enderror           {{-- erreur eventuelle du champ contenu --}}</pre>`,
    questions: [
      { type: "qcm", q: "Le visiteur envoie contenu = « ok » (2 caractères). Que se passe-t-il ?", opts: ["La signature est créée", "Échec min:5 : retour au formulaire, erreur affichée sous le textarea, saisie conservée", "Erreur 500", "Le contenu est complété automatiquement"], a: 1, exp: "min:5 échoue → circuit d'erreur automatique complet." },
      { type: "qcm", q: "Le visiteur laisse email vide. Verdict ?", opts: ["Échec : tout champ doit être rempli", "Valide : nullable l'autorise", "Échec : email exige un format", "L'email devient « null@null »"], a: 1, exp: "nullable + email : vide OK, sinon format vérifié." },
      { type: "qcm", q: "Un pirate ajoute un champ caché publie=0 au formulaire. Signature::create($valides) l'enregistre-t-il ?", opts: ["Oui", "Non : « publie » n'est pas dans les règles, donc absent de $valides", "Oui si publie est dans $fillable", "Erreur 419"], a: 1, exp: "validate() agit comme un filtre : seuls les champs listés survivent." },
      { type: "qcm", q: "Après l'échec de la question 1, que contient le champ auteur au réaffichage ?", opts: ["Rien", "La saisie précédente du visiteur, grâce à old('auteur')", "« ERREUR »", "Le dernier auteur en base"], a: 1, exp: "old() lit la saisie flashée en session par la redirection d'erreur." },
      { type: "vf", q: "Grâce à cette validation, on peut afficher {!! $s->contenu !!} sans risque.", a: false, exp: "JAMAIS. La validation ne neutralise pas le HTML : l'échappement {{ }} reste obligatoire." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 12 :
// 1. $request->validate(['champ' => 'regle|regle:param']) :
//    valide, filtre, et gere TOUT le circuit d'erreur.
// 2. Regles cles : required, nullable, string, email, min/max, unique, confirmed, in.
// 3. Vue : @error('champ') + old('champ') = formulaire confortable.
// 4. La validation navigateur n'est qu'un confort : le serveur fait foi.
// 5. Validation (entree) + echappement (sortie) : deux remparts complementaires.</pre>
<p>Et quand tout va bien, comment le dire au visiteur ? Demain : sessions et messages flash.</p>`
  }
};
