  theory: `
<h3>La carte mentale du cours</h3>
<p>Voici, résumé, tout le chemin parcouru. Chaque ligne rappelle un maillon du <strong>flux</strong> (le trajet d'une requête) ou un outil. Les commentaires <code>#</code> te redonnent le sens de chaque étape.</p>
<pre class="pseudo">SEMAINE 1 — Le flux web
  Requête → routes/web.php → Contrôleur → view(données) → Blade   # le trajet complet : URL, route, controleur, vue
  Formulaires : POST + @csrf + Request injecté + redirect (PRG)   # envoyer des donnees en securite (PRG = Post/Redirect/Get)

SEMAINE 2 — Les données
  Migration (structure) → Modele Eloquent (CRUD, $fillable)       # creer les tables, puis les manipuler comme des objets
  → where/orderBy/paginate → relations hasMany/belongsTo + with() # filtrer, trier, paginer, relier les tables (with = anti N+1)
  → validate() → flash/erreurs → .env/config                      # valider les entrees, prevenir l'utilisateur, configurer

SEMAINE 3 — La qualité
  Tests (Arrange/Act/Assert, RefreshDatabase)                     # prouver que tout marche, automatiquement
  Auth (Hash, attempt, @auth) → Middleware/Gates (403)            # savoir qui est la, et qui a le droit de quoi
  API JSON (routes/api.php, 200/201/204/404/422)                  # servir des donnees aux programmes (mobile, JS...)
  Pagination, logs, mise en production                            # les finitions d'un vrai produit</pre>
<h3>Les réflexes professionnels acquis</h3>
<ul>
<li><strong>Sécurité</strong> : {{ }} contre XSS, @csrf contre CSRF, requêtes préparées contre l'injection SQL, Hash contre les fuites, $fillable + validate contre l'assignement pirate, middleware contre les intrusions.</li>
<li><strong>Architecture</strong> : MVC, contrôleurs maigres, conventions de nommage, routes nommées.</li>
<li><strong>Performance</strong> : filtrer en base, with() anti-N+1, paginate, caches de prod.</li>
<li><strong>Fiabilité</strong> : validation systématique, tests du nominal ET des erreurs, logs.</li>
</ul>
<p>L'examen ci-dessous parcourt les 21 leçons. Vise le sans-faute : chaque question correspond à un réflexe que tu utiliseras en entreprise.</p>

<p>🎓 Félicitations ! Tu es passé du PHP artisanal au développement Laravel professionnel. Le meilleur exercice maintenant : un projet à toi, de zéro, sans filet. Tu as tous les outils.</p>`
