<script>
var DAY = {
  num: 15,
  title: "Le cas accusatif (Akkusativ)",
  subtitle: "Le cas de l'objet direct : quand der devient den.",
  theory: `
<h3>1. Qu'est-ce qu'un « cas » ?</h3>
<p>Un <strong>cas</strong> est la fonction d'un mot dans la phrase, marquée sur son article (et parfois sur le nom). L'allemand change la forme de l'article selon la fonction. Deux cas nous intéressent aujourd'hui :</p>
<pre class="pseudo">Nominatif  ->  le SUJET (celui qui fait l'action)     Der Mann schläft. (L'homme dort.)
Akkusativ  ->  l'OBJET direct (celui qui subit)        Ich sehe den Mann. (Je vois l'homme.)</pre>
<p>L'<strong>objet direct</strong> répond à la question « qui ? / quoi ? » après le verbe : « Je vois <em>qui</em> ? → l'homme ». C'est le complément d'objet direct (COD) du français.</p>
<h3>2. La grande règle : seul le MASCULIN change</h3>
<p>Bonne nouvelle : à l'accusatif, <strong>seul le masculin</strong> change de forme. Le féminin, le neutre et le pluriel restent identiques au nominatif :</p>
<pre class="pseudo">              NOMINATIF (sujet)   AKKUSATIV (objet)
masculin :    der / ein           den / einen      <- SEUL CHANGEMENT
feminin  :    die / eine          die / eine       (identique)
neutre   :    das / ein           das / ein        (identique)
pluriel  :    die                 die              (identique)</pre>
<div class="warn">À retenir absolument : <strong>der → den</strong> et <strong>ein → einen</strong> au masculin accusatif. C'est le cœur de la leçon. Tout le reste ne bouge pas.</div>
<h3>3. Exemples</h3>
<pre class="pseudo">Der Hund (masc.)  ->  Ich sehe den Hund.    // Je vois le chien.
Ein Hund          ->  Ich habe einen Hund.  // J'ai un chien.
Die Katze (fem.)  ->  Ich sehe die Katze.   // Je vois le chat. (inchange)
Das Auto (neutre) ->  Ich sehe das Auto.    // Je vois la voiture. (inchange)
Die Kinder (plur.)->  Ich sehe die Kinder.  // Je vois les enfants. (inchange)</pre>
<h3>4. Quels verbes demandent l'accusatif ?</h3>
<p>Beaucoup de verbes courants ont un objet direct à l'accusatif : <strong>haben</strong> (avoir), <strong>sehen</strong> (voir), <strong>kaufen</strong> (acheter), <strong>essen</strong> (manger), <strong>nehmen</strong> (prendre), <strong>brauchen</strong> (avoir besoin de), <strong>suchen</strong> (chercher)…</p>
<pre class="pseudo">Ich kaufe einen Apfel.    // J'achète une pomme. (der Apfel -> einen)
Er nimmt den Bus.         // Il prend le bus. (der Bus -> den)
Wir brauchen einen Tisch. // Nous avons besoin d'une table.</pre>
<h3>5. La négation kein à l'accusatif</h3>
<p><strong>kein</strong> se décline comme <strong>ein</strong>, donc il suit la même règle : au masculin accusatif, il devient <strong>keinen</strong> :</p>
<pre class="pseudo">Ich habe keinen Hund.     // Je n'ai pas de chien. (masc. accusatif)
Ich habe keine Katze.     // Je n'ai pas de chat. (fem., inchange)
Ich habe kein Auto.       // Je n'ai pas de voiture. (neutre, inchange)</pre>
<div class="tip">Résumé express : dès qu'un nom masculin devient objet direct, son article prend un -n / -en. der→den, ein→einen, kein→keinen, mein→meinen. Le reste des genres ne change pas.</div>`,
  exercises: [
    { type: "qcm", q: "Le cas accusatif marque en général…", opts: ["l'objet direct (ce qui subit l'action)", "le sujet", "le lieu", "le possesseur"], a: 0, exp: "Akkusativ = objet direct (COD)." },
    { type: "qcm", q: "À l'accusatif, quel genre change de forme ?", opts: ["le masculin", "le féminin", "le neutre", "le pluriel"], a: 0, exp: "Seul le masculin change : der → den, ein → einen." },
    { type: "qcm", q: "« der » devient … à l'accusatif :", opts: ["den", "dem", "des", "die"], a: 0, exp: "der → den (masculin accusatif)." },
    { type: "qcm", q: "« ein » (masculin) devient … à l'accusatif :", opts: ["einen", "eine", "einem", "eines"], a: 0, exp: "ein → einen (masculin accusatif)." },
    { type: "qcm", q: "Comment dit-on « Je vois le chien » (der Hund) ?", opts: ["Ich sehe den Hund.", "Ich sehe der Hund.", "Ich sehe dem Hund.", "Ich sehe die Hund."], a: 0, exp: "Objet masculin → den Hund." },
    { type: "qcm", q: "« Ich sehe die Katze » (die Katze). L'article change-t-il ?", opts: ["Non, le féminin reste die", "Oui, die → den", "Oui, die → der", "Oui, die → dem"], a: 0, exp: "Le féminin ne change pas à l'accusatif." },
    { type: "vf", q: "À l'accusatif, le féminin, le neutre et le pluriel gardent leur forme du nominatif.", a: true, exp: "Seul le masculin change." },
    { type: "vf", q: "« Ich habe einen Bruder » est correct (masculin accusatif).", a: true, exp: "der Bruder → einen Bruder après haben." },
    { type: "vf", q: "À l'accusatif, « das Auto » devient « den Auto ».", a: false, exp: "Faux : le neutre ne change pas : das Auto reste das Auto." },
    { type: "input", q: "Complète : Ich sehe ___ Hund. (der Hund, accusatif)", a: ["den"], ph: "un article", exp: "der → den : Ich sehe den Hund." },
    { type: "input", q: "Complète : Ich habe ___ Bruder. (ein Bruder, accusatif)", a: ["einen"], ph: "un article", exp: "ein → einen : Ich habe einen Bruder." },
    { type: "input", q: "Complète : Ich sehe ___ Katze. (die Katze, féminin)", a: ["die"], ph: "un article", exp: "Féminin inchangé : die Katze." },
    { type: "input", q: "Complète : Ich kaufe ___ Auto. (ein Auto, neutre)", a: ["ein"], ph: "un article", exp: "Neutre inchangé : ein Auto." },
    { type: "input", q: "Complète (négation) : Ich habe ___ Hund. (« pas de chien », masc.)", a: ["keinen"], ph: "un article", exp: "kein → keinen au masculin accusatif." },
    { type: "input", q: "Complète : Er nimmt ___ Bus. (der Bus, accusatif)", a: ["den"], ph: "un article", exp: "der → den : Er nimmt den Bus." }
  ],
  final: {
    title: "Exercice final — Nominatif ou accusatif ?",
    intro: `<p>Un petit texte, puis des articles à choisir. Repère le sujet (nominatif) et l'objet direct (accusatif). Souviens-toi : seul le masculin change.</p>
<pre class="pseudo">Der Mann kauft einen Apfel. Er sieht den Hund       // L'homme achète une pomme. Il voit le chien
und er nimmt den Bus. Ich habe keinen Bruder.        // et il prend le bus. Je n'ai pas de frère.</pre>`,
    questions: [
      { type: "qcm", q: "Dans « Der Mann kauft einen Apfel », « Der Mann » est…", opts: ["le sujet (nominatif)", "l'objet (accusatif)", "un pluriel", "un féminin"], a: 0, exp: "Der Mann fait l'action → nominatif." },
      { type: "qcm", q: "Pourquoi « einen Apfel » ?", opts: ["Apfel (der Apfel) est l'objet direct masculin → einen", "Apfel est le sujet", "Apfel est féminin", "c'est une faute"], a: 0, exp: "der Apfel comme objet → einen Apfel." },
      { type: "input", q: "Complète : Er sieht ___ Hund. (der Hund, objet)", a: ["den"], ph: "un article", exp: "der → den : den Hund." },
      { type: "input", q: "Complète : Ich habe ___ Bruder. (« pas de frère », masc.)", a: ["keinen"], ph: "un article", exp: "kein → keinen (masculin accusatif)." },
      { type: "qcm", q: "« Ich sehe die Kinder » : l'article « die » (pluriel) à l'accusatif…", opts: ["reste die", "devient den", "devient der", "devient das"], a: 0, exp: "Le pluriel ne change pas : die Kinder." }
    ],
    solution: `<p>L'accusatif est le cas de l'<strong>objet direct</strong> (le COD : qui/quoi subit l'action). La règle tient en une phrase : <strong>seul le masculin change</strong> — der→den, ein→einen, kein→keinen, mein→meinen — tandis que le féminin (die/eine), le neutre (das/ein) et le pluriel (die) restent identiques au nominatif. Les verbes fréquents haben, sehen, kaufen, nehmen, brauchen introduisent un objet à l'accusatif. Maîtriser ce seul changement masculin, c'est franchir la première marche du système des cas allemand.</p>`
  }
};
</script>
