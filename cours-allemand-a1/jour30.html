<script>
var DAY = {
  num: 30,
  title: "Bilan A1 : se présenter et échanger",
  subtitle: "Le grand récapitulatif : tenir une petite conversation en allemand.",
  theory: `
<h3>1. Félicitations : tu es arrivé au bout du A1 !</h3>
<p>En 30 jours, tu as posé toutes les fondations de l'allemand. Ce dernier jour rassemble l'essentiel pour que tu puisses <strong>te présenter</strong> et <strong>échanger</strong> dans une conversation simple.</p>
<h3>2. Un dialogue de rencontre complet</h3>
<pre class="pseudo">A: Hallo! Wie heißt du?
B: Ich heiße Sarah. Und du?
A: Ich bin Tom. Woher kommst du?
B: Ich komme aus Frankreich. Ich wohne jetzt in Hamburg.
A: Wie alt bist du?
B: Ich bin 22 Jahre alt. Was machst du gern?
A: Ich spiele gern Fußball. Und ich mag Musik.
B: Schön! Bis bald!
A: Tschüss!</pre>
<p><em>Traduction : A : Salut ! Comment t'appelles-tu ? B : Je m'appelle Sarah. Et toi ? A : Je suis Tom. D'où viens-tu ? B : Je viens de France. J'habite maintenant à Hambourg. A : Quel âge as-tu ? B : J'ai 22 ans. Qu'aimes-tu faire ? A : J'aime jouer au foot. Et j'aime la musique. B : Super ! À bientôt ! A : Salut !</em></p>
<h3>3. Les cinq questions à toujours savoir</h3>
<pre class="pseudo">Wie heißt du?       → Comment t'appelles-tu ?   → Ich heiße...
Woher kommst du?    → D'où viens-tu ?           → Ich komme aus...
Wo wohnst du?       → Où habites-tu ?           → Ich wohne in...
Wie alt bist du?    → Quel âge as-tu ?          → Ich bin ... Jahre alt.
Was machst du gern? → Qu'aimes-tu faire ?       → Ich ... gern.</pre>
<h3>4. Les formules de politesse</h3>
<pre class="pseudo">Hallo / Guten Tag   → Bonjour        Tschüss     → Salut (au revoir)
Guten Morgen        → Bonjour (matin) Auf Wiedersehen → Au revoir (poli)
Bitte               → S'il te plaît   Danke       → Merci
Bis bald            → À bientôt       Entschuldigung → Pardon / Excusez-moi</pre>
<h3>5. La grammaire A1 en une page</h3>
<pre class="pseudo">Le verbe conjugué est TOUJOURS en 2e position.
sein: ich bin, du bist, er ist...   haben: ich habe, du hast, er hat...
Articles: der/die/das ; accusatif → den (masc.) ; datif → dem/der/dem.
Négation: nicht (verbe/adjectif) ou kein (nom).
Modaux: verbe conjugué 2e, INFINITIF à la fin (Ich will schlafen).
Verbes séparables: la particule saute à la FIN (Ich stehe auf).
Passé simple utile: war (étais), hatte (avais).</pre>
<div class="tip">Le secret pour progresser après le A1 : parle sans peur de te tromper. Une phrase imparfaite mais dite vaut mieux qu'une phrase parfaite gardée pour soi. Viel Erfolg ! (Bon succès !)</div>`,
  exercises: [
    { type: "input", q: "Réponds à « Wie heißt du? » : « Ich ___ Anna. » (je m'appelle)", a: ["heiße", "heisse", "bin"], ph: "verbe", exp: "Ich heiße Anna (ou Ich bin Anna)." },
    { type: "qcm", q: "« Woher kommst du? » se répond par :", opts: ["Ich wohne in Berlin", "Ich komme aus Frankreich", "Ich bin 20 Jahre alt", "Ich heiße Tom"], a: 1, exp: "woher (d'où) → Ich komme aus... (origine)." },
    { type: "input", q: "Réponds à « Wie alt bist du? » : « Ich bin 22 ___ alt. »", a: ["jahre"], ph: "mot", exp: "Ich bin 22 Jahre alt." },
    { type: "qcm", q: "Quelle formule signifie « À bientôt » ?", opts: ["Guten Morgen", "Bis bald", "Danke", "Entschuldigung"], a: 1, exp: "Bis bald = à bientôt." },
    { type: "input", q: "Réponds à « Wo wohnst du? » : « Ich ___ in Hamburg. » (j'habite)", a: ["wohne"], ph: "verbe", exp: "Ich wohne in Hamburg." },
    { type: "qcm", q: "Le verbe conjugué se place toujours en quelle position ?", opts: ["1re", "2e", "dernière", "n'importe où"], a: 1, exp: "Règle d'or de l'allemand : verbe en 2e position." },
    { type: "input", q: "Modal + infinitif à la fin : « Ich will heute ___. » (je veux dormir aujourd'hui)", a: ["schlafen"], ph: "infinitif", exp: "L'infinitif schlafen est rejeté à la fin." },
    { type: "qcm", q: "Quelle formule est polie pour « au revoir » ?", opts: ["Tschüss", "Auf Wiedersehen", "Hallo", "Bitte"], a: 1, exp: "Auf Wiedersehen = au revoir (formel) ; Tschüss est familier." },
    { type: "input", q: "Verbe séparable : « Ich ___ um sieben Uhr auf. » (je me lève)", a: ["stehe"], ph: "verbe", exp: "aufstehen → stehe ... auf." },
    { type: "qcm", q: "Comment dit-on « merci » ?", opts: ["Bitte", "Danke", "Tschüss", "Hallo"], a: 1, exp: "Danke = merci (Bitte = s'il te plaît / de rien)." },
    { type: "vf", q: "« Was machst du gern? » demande ce qu'on aime faire.", a: true, exp: "Réponse : Ich ... gern (spiele gern Fußball...)." },
    { type: "vf", q: "Avec un modal, l'infinitif du second verbe se place à la fin de la phrase.", a: true, exp: "Ich will schlafen : règle des modaux." },
    { type: "vf", q: "En allemand, le verbe conjugué peut être placé n'importe où dans la phrase.", a: false, exp: "FAUX : il est toujours en 2e position dans une phrase déclarative." },
    { type: "input", q: "Formule d'excuse : « ___, wo ist der Bahnhof? » (Pardon, où est la gare ?)", a: ["entschuldigung"], ph: "formule", exp: "Entschuldigung = pardon / excusez-moi." },
    { type: "qcm", q: "Réponse correcte à « Wie geht es dir? » (comment vas-tu ?) :", opts: ["Ich heiße gut", "Es geht mir gut, danke", "Ich komme aus gut", "Danke, tschüss"], a: 1, exp: "Es geht mir gut, danke = je vais bien, merci (datif : mir)." }
  ],
  final: {
    title: "Exercice final — Une rencontre à la gare",
    intro: `<p>Lisez le dialogue, puis répondez.</p>
<pre class="pseudo">Anna: Hallo! Ich heiße Anna. Wie heißt du?
Ben: Ich bin Ben. Woher kommst du?
Anna: Ich komme aus Italien, aber ich wohne in Köln.
Ben: Wie alt bist du?
Anna: Ich bin 28. Was machst du gern?
Ben: Ich lese gern und ich mag Kaffee. Bis bald!</pre>
<p><em>Traduction : Anna : Salut ! Je m'appelle Anna. Comment t'appelles-tu ? Ben : Je suis Ben. D'où viens-tu ? Anna : Je viens d'Italie, mais j'habite à Cologne. Ben : Quel âge as-tu ? Anna : J'ai 28 ans. Qu'aimes-tu faire ? Ben : J'aime lire et j'aime le café. À bientôt !</em></p>`,
    questions: [
      { type: "input", q: "Comment Anna dit-elle son nom ? « Ich ___ Anna. »", a: ["heiße", "heisse", "bin"], ph: "verbe", exp: "Ich heiße Anna (ou Ich bin Anna)." },
      { type: "qcm", q: "D'où vient Anna ?", opts: ["d'Allemagne", "d'Italie (Italien)", "de Cologne", "de France"], a: 1, exp: "Ich komme aus Italien (elle habite Köln mais vient d'Italie)." },
      { type: "input", q: "Quel âge a Anna ? (le nombre, en chiffres)", a: ["28"], ph: "nombre", exp: "Ich bin 28 = j'ai 28 ans." },
      { type: "qcm", q: "Que fait Ben volontiers ?", opts: ["jouer au foot", "lire (lesen) et aimer le café", "cuisiner", "voyager"], a: 1, exp: "Ich lese gern und ich mag Kaffee." },
      { type: "qcm", q: "Comment Ben termine-t-il la conversation ?", opts: ["Guten Morgen", "Bis bald (à bientôt)", "Entschuldigung", "Danke"], a: 1, exp: "Bis bald ! = à bientôt !" }
    ],
    solution: `<p>Ce dialogue rassemble les cinq questions essentielles du A1 :</p>
<pre class="pseudo">Wie heißt du?     → Ich heiße / Ich bin...
Woher kommst du?  → Ich komme aus...
Wo wohnst du?     → Ich wohne in...
Wie alt bist du?  → Ich bin ... (Jahre alt)
Was machst du gern? → Ich ... gern</pre>
<p>Bravo ! Tu sais maintenant te présenter, poser des questions, parler de tes goûts, de ta famille, de ton emploi du temps, faire des courses et évoquer le passé. C'est tout le niveau A1. Weiter so ! (Continue comme ça !)</p>`
  }
};
</script>
