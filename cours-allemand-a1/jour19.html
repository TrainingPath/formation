<script>
var DAY = {
  num: 19,
  title: "L'impératif",
  subtitle: "Donner un ordre, un conseil : Komm! Geht! Warten Sie!",
  theory: `
<h3>1. À quoi sert l'impératif ?</h3>
<p>L'<strong>impératif</strong> sert à donner un ordre, un conseil ou une instruction : « Viens ! », « Écoute ! », « Attendez ! ». En allemand, il existe <strong>trois formes</strong> selon la personne à qui on parle : <strong>du</strong> (une personne qu'on tutoie), <strong>ihr</strong> (plusieurs personnes qu'on tutoie), <strong>Sie</strong> (forme polie).</p>
<h3>2. La forme du (tutoiement singulier)</h3>
<p>On prend le verbe, on enlève la terminaison <strong>-st</strong> du « du », et souvent on retire aussi le <strong>-e</strong> final. Pas de pronom !</p>
<pre class="pseudo">kommen → du kommst → Komm!        → Viens !
gehen  → du gehst  → Geh!         → Va ! / Vas-y !
warten → du wartest→ Warte!       → Attends !
hören  → du hörst  → Hör!         → Écoute !</pre>
<h3>3. La forme ihr (tutoiement pluriel)</h3>
<p>C'est simple : on garde <strong>exactement la forme du « ihr »</strong>, mais sans le pronom.</p>
<pre class="pseudo">kommen → ihr kommt → Kommt!       → Venez ! (à un groupe qu'on tutoie)
gehen  → ihr geht  → Geht!        → Allez !
warten → ihr wartet→ Wartet!      → Attendez !</pre>
<h3>4. La forme Sie (politesse)</h3>
<p>On garde la forme du « Sie » (l'infinitif) mais on <strong>inverse</strong> : le verbe d'abord, puis <strong>Sie</strong>.</p>
<pre class="pseudo">kommen → Kommen Sie!             → Venez ! (poli)
warten → Warten Sie bitte!       → Attendez, s'il vous plaît !
hören  → Hören Sie!              → Écoutez !</pre>
<div class="tip">Le mot <strong>bitte</strong> (« s'il te/vous plaît ») adoucit un ordre : Komm bitte! / Warten Sie bitte!</div>
<h3>5. Le cas de sein (être)</h3>
<p>Le verbe sein est irrégulier à l'impératif, à connaître par cœur :</p>
<pre class="pseudo">du  → Sei ruhig!        → Sois calme !
ihr → Seid ruhig!       → Soyez calmes !
Sie → Seien Sie ruhig!  → Soyez calme ! (poli)</pre>
<div class="warn">Les verbes forts qui changent e → i/ie (jour 11) gardent ce changement à l'impératif du : essen → du isst → <strong>Iss!</strong> (Mange !), sprechen → <strong>Sprich!</strong> (Parle !). Mais ceux en a → ä ne le gardent PAS : fahren → <strong>Fahr!</strong> (et non Fähr).</div>`,
  exercises: [
    { type: "input", q: "Impératif du de kommen (Viens !) : « ___! »", a: ["komm"], ph: "impératif", exp: "du kommst → Komm ! (on enlève -st et souvent le -e)." },
    { type: "input", q: "Impératif du de hören (Écoute !) : « ___! »", a: ["hör", "hoer", "höre", "hoere"], ph: "impératif", exp: "du hörst → Hör ! (Höre est aussi possible)." },
    { type: "qcm", q: "Impératif ihr de gehen (Allez !) :", opts: ["Geh!", "Geht!", "Gehen Sie!", "Gehst!"], a: 1, exp: "On garde la forme du ihr sans pronom : Geht !" },
    { type: "qcm", q: "Impératif poli (Sie) de warten (Attendez !) :", opts: ["Warte!", "Wartet!", "Warten Sie!", "Warten!"], a: 2, exp: "Verbe + Sie : Warten Sie !" },
    { type: "input", q: "Impératif du de warten (Attends !) : « ___! »", a: ["warte"], ph: "impératif", exp: "Après -t, on garde le -e pour la prononciation : Warte !" },
    { type: "qcm", q: "Comment forme-t-on l'impératif poli (Sie) ?", opts: ["On enlève le pronom", "On met le verbe puis Sie (inversion)", "On garde du + verbe", "On ajoute -st"], a: 1, exp: "Kommen Sie ! : le verbe d'abord, puis Sie." },
    { type: "input", q: "Impératif du de sein (Sois calme !) : « ___ ruhig! »", a: ["sei"], ph: "impératif", exp: "sein est irrégulier : Sei ! (du), Seid ! (ihr), Seien Sie ! (poli)." },
    { type: "qcm", q: "Impératif ihr de sein (Soyez calmes !) :", opts: ["Sei!", "Seid!", "Seien Sie!", "Sind!"], a: 1, exp: "ihr → Seid ruhig !" },
    { type: "input", q: "Impératif du de essen (Mange !) — verbe fort e→i : « ___! »", a: ["iss"], ph: "impératif", exp: "essen → du isst → Iss ! Le changement e→i est conservé." },
    { type: "qcm", q: "Impératif du de sprechen (Parle !) :", opts: ["Sprech!", "Sprich!", "Sprechst!", "Spreche!"], a: 1, exp: "Verbe fort e→i : du sprichst → Sprich !" },
    { type: "vf", q: "À l'impératif, on n'écrit pas le pronom (sauf à la forme polie Sie).", a: true, exp: "Komm ! Geht ! mais Kommen Sie ! (Sie reste)." },
    { type: "vf", q: "La forme ihr de l'impératif est identique à la conjugaison du ihr, sans le pronom.", a: true, exp: "ihr kommt → Kommt !" },
    { type: "vf", q: "L'impératif poli de kommen est « Komm Sie! ».", a: false, exp: "FAUX : c'est Kommen Sie ! (verbe à l'infinitif + Sie)." },
    { type: "input", q: "Ajoute la politesse : « Komm ___! » (Viens, s'il te plaît !)", a: ["bitte"], ph: "mot", exp: "bitte = s'il te/vous plaît, adoucit l'ordre." },
    { type: "qcm", q: "Impératif du de fahren (verbe a→ä) — Roule/Va !", opts: ["Fähr!", "Fahr!", "Fahrst!", "Fahren!"], a: 1, exp: "Les verbes a→ä ne gardent PAS le tréma à l'impératif : Fahr !" }
  ],
  final: {
    title: "Exercice final — Les consignes du professeur",
    intro: `<p>Un professeur donne des consignes. Lisez, puis répondez.</p>
<pre class="pseudo">Kommt bitte herein! Setzt euch!
Nehmt eure Bücher! Öffnen Sie die Tür, bitte.
Sei ruhig, Max!</pre>
<p><em>Traduction : Entrez, s'il vous plaît ! Asseyez-vous ! Prenez vos livres ! Ouvrez la porte, s'il vous plaît. Sois calme, Max !</em></p>`,
    questions: [
      { type: "qcm", q: "« Kommt bitte herein! » s'adresse à :", opts: ["Une personne (du)", "Plusieurs personnes (ihr)", "Une forme polie (Sie)", "Personne"], a: 1, exp: "Kommt = forme ihr (groupe qu'on tutoie)." },
      { type: "qcm", q: "« Öffnen Sie die Tür » est à quelle forme ?", opts: ["du", "ihr", "Sie (poli)", "sein"], a: 2, exp: "Verbe + Sie = forme polie." },
      { type: "input", q: "Quelle forme de sein trouve-t-on dans « Sei ruhig, Max! » ? (le mot)", a: ["sei"], ph: "en allemand", exp: "Sei = impératif du de sein (irrégulier)." },
      { type: "qcm", q: "« Nehmt eure Bücher! » : à qui parle-t-on ?", opts: ["À une personne polie", "À un groupe qu'on tutoie (ihr)", "À soi-même", "À une seule personne (du)"], a: 1, exp: "Nehmt = forme ihr." },
      { type: "input", q: "Transforme « Kommt! » (ihr) à la forme du (une seule personne) : « ___! »", a: ["komm"], ph: "impératif", exp: "Forme du : Komm ! (sans -t, sans pronom)." }
    ],
    solution: `<p>Les trois formes de l'impératif dans le texte :</p>
<pre class="pseudo">du       → Sei ruhig!            (une personne, tutoiement)
ihr      → Kommt! Setzt euch! Nehmt!   (un groupe, tutoiement)
Sie      → Öffnen Sie die Tür!    (politesse, verbe + Sie)</pre>
<p>Retiens les trois moules : <strong>du</strong> = radical (Komm!), <strong>ihr</strong> = forme du ihr (Kommt!), <strong>Sie</strong> = verbe + Sie (Kommen Sie!). Et sein est irrégulier : Sei / Seid / Seien Sie.</p>`
  }
};
</script>
