<script>
var DAY = {
  num: 6,
  title: "Les articles définis (der, die, das)",
  subtitle: "Le, la, les en allemand : trois genres à apprendre avec chaque nom.",
  theory: `
<h3>1. Qu'est-ce qu'un article défini ?</h3>
<p>Un <strong>article défini</strong> est le petit mot placé devant un nom pour désigner une chose précise, connue : en français « <strong>le</strong>, <strong>la</strong>, <strong>les</strong> ». L'allemand en a trois au singulier, selon le <strong>genre grammatical</strong> du nom :</p>
<pre class="pseudo">der  ->  masculin   der Mann   (l'homme)
die  ->  feminin    die Frau   (la femme)
das  ->  neutre     das Kind   (l'enfant)</pre>
<h3>2. Le neutre : une nouveauté pour le francophone</h3>
<p>Le français n'a que deux genres (masculin, féminin). L'allemand en ajoute un troisième, le <strong>neutre</strong> (das). Un nom neutre n'est ni « il » ni « elle » par nature : c'est une catégorie grammaticale. Beaucoup de noms de choses et certains êtres vivants sont neutres.</p>
<div class="warn">Le genre allemand ne correspond PAS toujours au genre français. « die Sonne » (le soleil) est féminin en allemand, « der Mond » (la lune) est masculin, « das Mädchen » (la jeune fille) est neutre ! Conclusion : apprends toujours le nom AVEC son article. On mémorise « das Auto », jamais « Auto » tout seul.</div>
<h3>3. Le pluriel : un seul article, die</h3>
<p>Au pluriel, les trois genres se confondent : l'article défini est toujours <strong>die</strong>, quel que soit le genre du nom au singulier.</p>
<pre class="pseudo">Singulier            Pluriel
der Mann  (l'homme)  ->  die Männer  (les hommes)
die Frau  (la femme) ->  die Frauen  (les femmes)
das Kind  (l'enfant) ->  die Kinder  (les enfants)</pre>
<div class="tip">Ne confonds pas les deux « die » : « die Frau » = la femme (féminin singulier) ; « die Kinder » = les enfants (pluriel). C'est le nom et le contexte qui indiquent lequel.</div>
<h3>4. Petit tableau récapitulatif (nominatif)</h3>
<p>Le tableau ci-dessous montre l'article défini au <strong>nominatif</strong> (le cas du sujet, celui de base ; on verra d'autres cas au jour 15) :</p>
<pre class="pseudo">              masculin   feminin   neutre   pluriel
article :     der        die       das      die
exemple  :    der Tisch  die Tür   das Buch die Bücher
traduction:   la table   la porte  le livre les livres</pre>
<h3>5. Quelques indices (non absolus) sur le genre</h3>
<pre class="pseudo">Souvent masculin : jours, mois, saisons  ->  der Montag, der Sommer
Souvent feminin  : mots en -e, -ung, -heit ->  die Lampe, die Zeitung
Souvent neutre   : diminutifs -chen, -lein ->  das Mädchen, das Häuschen</pre>
<p>Ces indices aident, mais comportent des exceptions : l'article reste à mémoriser avec le mot.</p>`,
  exercises: [
    { type: "qcm", q: "Quel article défini est masculin ?", opts: ["der", "die", "das", "den"], a: 0, exp: "der = masculin (der Mann)." },
    { type: "qcm", q: "Quel article défini est neutre ?", opts: ["das", "der", "die", "dem"], a: 0, exp: "das = neutre (das Kind)." },
    { type: "qcm", q: "Quel article défini est féminin ?", opts: ["die", "der", "das", "des"], a: 0, exp: "die = féminin (die Frau)." },
    { type: "qcm", q: "Au pluriel, l'article défini est toujours…", opts: ["die", "der", "das", "den"], a: 0, exp: "Au pluriel, tous les genres → die." },
    { type: "qcm", q: "« die Sonne » (le soleil) est en allemand…", opts: ["féminin", "masculin", "neutre", "pluriel"], a: 0, exp: "Le soleil est féminin en allemand : die Sonne. Le genre ne suit pas le français." },
    { type: "qcm", q: "Pourquoi faut-il apprendre le nom avec son article ?", opts: ["Parce que le genre allemand ne suit pas celui du français", "Pour faire joli", "Parce que l'article change le sens du nom", "Ce n'est pas nécessaire"], a: 0, exp: "Le genre est imprévisible : on mémorise « das Auto », pas « Auto »." },
    { type: "vf", q: "L'allemand a trois genres : masculin, féminin et neutre.", a: true, exp: "der / die / das au singulier." },
    { type: "vf", q: "« das Mädchen » (la jeune fille) est féminin.", a: false, exp: "Faux : Mädchen est neutre (das) à cause du suffixe -chen, malgré le sens." },
    { type: "vf", q: "Au pluriel, « die » s'utilise pour les trois genres.", a: true, exp: "die Männer, die Frauen, die Kinder." },
    { type: "input", q: "Complète : ___ Mann (l'homme, masculin).", a: ["der"], ph: "un article", exp: "der Mann." },
    { type: "input", q: "Complète : ___ Frau (la femme, féminin).", a: ["die"], ph: "un article", exp: "die Frau." },
    { type: "input", q: "Complète : ___ Kind (l'enfant, neutre).", a: ["das"], ph: "un article", exp: "das Kind." },
    { type: "input", q: "Complète : ___ Kinder (les enfants, pluriel).", a: ["die"], ph: "un article", exp: "Au pluriel : die Kinder." },
    { type: "input", q: "Complète : ___ Buch (le livre, neutre).", a: ["das"], ph: "un article", exp: "das Buch." },
    { type: "input", q: "Complète : ___ Lampe (la lampe, mot en -e, féminin).", a: ["die"], ph: "un article", exp: "die Lampe (les mots en -e sont souvent féminins)." }
  ],
  final: {
    title: "Exercice final — Trouver le bon article",
    intro: `<p>Attribue l'article défini correct (der, die ou das). Un indice de genre est donné à chaque fois.</p>`,
    questions: [
      { type: "qcm", q: "___ Tisch (la table, masculin)", opts: ["der", "die", "das", "den"], a: 0, exp: "Masculin → der Tisch." },
      { type: "qcm", q: "___ Tür (la porte, féminin)", opts: ["die", "der", "das", "dem"], a: 0, exp: "Féminin → die Tür." },
      { type: "qcm", q: "___ Auto (la voiture, neutre)", opts: ["das", "der", "die", "den"], a: 0, exp: "Neutre → das Auto." },
      { type: "input", q: "___ Bücher (les livres, pluriel)", a: ["die"], ph: "un article", exp: "Pluriel → die Bücher." },
      { type: "input", q: "___ Zeitung (le journal, mot en -ung, féminin)", a: ["die"], ph: "un article", exp: "Les mots en -ung sont féminins : die Zeitung." }
    ],
    solution: `<p>Trois articles définis au singulier — <strong>der</strong> (masculin), <strong>die</strong> (féminin), <strong>das</strong> (neutre) — et un seul au pluriel : <strong>die</strong> pour tous les genres. Le message essentiel : le genre allemand est arbitraire vis-à-vis du français, donc chaque nouveau nom s'apprend collé à son article (der/die/das). Les suffixes (-e et -ung féminins, -chen neutre…) offrent des indices utiles mais non fiables à 100 %.</p>`
  }
};
</script>
