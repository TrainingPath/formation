<script>
var DAY = {
  num: 23,
  title: "La nourriture ; ich mag, gern",
  subtitle: "Das Essen — dire ce qu'on aime manger et boire.",
  theory: `
<h3>1. Le vocabulaire de la nourriture</h3>
<pre class="pseudo">das Brot     → le pain        der Käse     → le fromage
das Ei       → l'oeuf         der Apfel    → la pomme
das Obst     → les fruits     die Milch    → le lait
das Gemüse   → les légumes    der Kaffee   → le café
das Fleisch  → la viande      der Tee      → le thé
das Wasser   → l'eau          der Saft     → le jus</pre>
<h3>2. Les repas et les verbes</h3>
<pre class="pseudo">das Frühstück → le petit-déjeuner   essen  → manger
das Mittagessen → le déjeuner        trinken→ boire
das Abendessen → le dîner            kochen → cuisiner</pre>
<h3>3. Exprimer ses goûts, méthode 1 : gern</h3>
<p>Le mot <strong>gern</strong> (« volontiers ») se place après le verbe pour dire qu'on aime FAIRE quelque chose. C'est la façon la plus courante.</p>
<pre class="pseudo">Ich esse gern Käse.       → J'aime (manger) le fromage.
Ich trinke gern Kaffee.   → J'aime (boire) le café.
Er isst gern Obst.        → Il aime les fruits.</pre>
<p>Pour dire qu'on n'aime PAS, on ajoute <strong>nicht</strong> : <strong>nicht gern</strong>.</p>
<pre class="pseudo">Ich esse nicht gern Fisch.  → Je n'aime pas le poisson.</pre>
<h3>4. Exprimer ses goûts, méthode 2 : mögen</h3>
<p>Le verbe <strong>mögen</strong> (« aimer ») s'emploie directement devant un nom (une chose). C'est un verbe de modalité (jour 17), mais ici sans second verbe.</p>
<pre class="pseudo">ich mag        wir mögen
du magst       ihr mögt
er/sie/es mag  sie/Sie mögen</pre>
<pre class="pseudo">Ich mag Schokolade.   → J'aime le chocolat.
Ich mag keinen Kaffee.→ Je n'aime pas le café.  (négation avec kein)
Magst du Tee?         → Aimes-tu le thé ?</pre>
<div class="tip">Différence pratique : <strong>gern</strong> accompagne un verbe (Ich esse gern...), <strong>mögen</strong> précède un nom (Ich mag...). Les deux se traduisent par « aimer ».</div>
<h3>5. Avoir faim / soif</h3>
<pre class="pseudo">Ich habe Hunger.   → J'ai faim.   (littéralement « j'ai faim »)
Ich habe Durst.    → J'ai soif.
Was möchtest du?   → Que veux-tu / voudrais-tu ?
Ich möchte einen Kaffee. → Je voudrais un café.  (möchte = forme polie de mögen)</pre>
<div class="warn">Ne confonds pas : <strong>Ich mag Kaffee</strong> = « J'aime le café (en général) », tandis que <strong>Ich möchte einen Kaffee</strong> = « Je voudrais un café (maintenant) ». möchte sert à commander poliment.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le pain » ?", opts: ["der Brot", "das Brot", "die Brot", "das Bier"], a: 1, exp: "das Brot (neutre)." },
    { type: "input", q: "Traduis « boire » : « ich ___ » (je bois)", a: ["trinke"], ph: "verbe", exp: "trinken → ich trinke." },
    { type: "input", q: "Ajoute le mot des goûts : « Ich esse ___ Käse. » (j'aime le fromage — avec un verbe)", a: ["gern"], ph: "mot", exp: "gern après le verbe : Ich esse gern Käse." },
    { type: "qcm", q: "Quelle phrase exprime « j'aime le chocolat » avec mögen ?", opts: ["Ich esse Schokolade.", "Ich mag Schokolade.", "Ich gern Schokolade.", "Ich habe Schokolade."], a: 1, exp: "mögen + nom : Ich mag Schokolade." },
    { type: "input", q: "Conjugue mögen avec du : « ___ du Tee? » (aimes-tu le thé ?)", a: ["magst"], ph: "verbe", exp: "du magst (mögen : ich mag, du magst, er mag)." },
    { type: "qcm", q: "Comment dit-on « Je n'aime pas le poisson » (avec gern) ?", opts: ["Ich esse kein Fisch.", "Ich esse nicht gern Fisch.", "Ich mag gern Fisch.", "Ich esse gern nicht Fisch."], a: 1, exp: "nicht gern = ne pas aimer : Ich esse nicht gern Fisch." },
    { type: "input", q: "Conjugue mögen avec ich : « Ich ___ Kaffee. » (j'aime le café)", a: ["mag"], ph: "verbe", exp: "ich mag." },
    { type: "qcm", q: "Quelle est la différence entre gern et mögen ?", opts: ["Aucune", "gern accompagne un verbe, mögen précède un nom", "gern est un nom", "mögen est une négation"], a: 1, exp: "Ich esse gern... (verbe) / Ich mag... (nom)." },
    { type: "input", q: "Traduis « J'ai faim » : « Ich habe ___. »", a: ["hunger"], ph: "en allemand", exp: "Ich habe Hunger (littéralement « j'ai faim »)." },
    { type: "qcm", q: "« Ich möchte einen Kaffee » sert à :", opts: ["dire un goût général", "commander poliment un café", "refuser un café", "demander l'heure"], a: 1, exp: "möchte = je voudrais : pour commander." },
    { type: "vf", q: "« gern » se place après le verbe conjugué.", a: true, exp: "Ich trinke gern Tee : gern suit le verbe." },
    { type: "vf", q: "« mögen » s'emploie directement devant un nom (Ich mag Käse).", a: true, exp: "mögen + nom = aimer quelque chose." },
    { type: "vf", q: "« Ich mag Kaffee » et « Ich möchte einen Kaffee » veulent dire exactement la même chose.", a: false, exp: "FAUX : mag = goût général ; möchte = commande polie (maintenant)." },
    { type: "input", q: "Complète la négation : « Ich mag ___ Kaffee. » (je n'aime pas le café — avec kein)", a: ["keinen"], ph: "négation", exp: "Kaffee masculin, accusatif → keinen." },
    { type: "qcm", q: "Comment dit-on « J'ai soif » ?", opts: ["Ich habe Hunger.", "Ich habe Durst.", "Ich möchte Wasser.", "Ich trinke."], a: 1, exp: "Ich habe Durst = j'ai soif." }
  ],
  final: {
    title: "Exercice final — Au petit-déjeuner",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Zum Frühstück esse ich gern Brot mit Käse.
Ich trinke gern Kaffee, aber ich mag keinen Tee.
Meine Schwester isst gern Obst. Sie mag Äpfel.</pre>
<p><em>Traduction : Au petit-déjeuner, j'aime le pain avec du fromage. J'aime le café, mais je n'aime pas le thé. Ma soeur aime les fruits. Elle aime les pommes.</em></p>`,
    questions: [
      { type: "input", q: "Quel mot exprime le goût dans « Ich esse gern Brot » ?", a: ["gern"], ph: "en allemand", exp: "gern après le verbe = aimer faire." },
      { type: "qcm", q: "« Ich mag keinen Tee » signifie :", opts: ["J'aime le thé", "Je n'aime pas le thé", "Je voudrais un thé", "Je bois du thé"], a: 1, exp: "mag + keinen = ne pas aimer ; Tee masc. → keinen." },
      { type: "qcm", q: "Pourquoi « mag » et non « esse » avec « Äpfel » et « Tee » ?", opts: ["Par hasard", "mögen précède directement un nom (une chose aimée)", "C'est une faute", "esse est interdit"], a: 1, exp: "mögen + nom : Sie mag Äpfel, ich mag keinen Tee." },
      { type: "input", q: "Comment dit-on « au petit-déjeuner » (début de phrase du texte) ? « ___ Frühstück »", a: ["zum"], ph: "en allemand", exp: "zum Frühstück = au petit-déjeuner." },
      { type: "qcm", q: "Que mange volontiers la soeur ?", opts: ["du fromage", "des fruits (Obst / Äpfel)", "du pain", "de la viande"], a: 1, exp: "Sie isst gern Obst. Sie mag Äpfel." }
    ],
    solution: `<p>Les deux façons d'exprimer les goûts dans le texte :</p>
<pre class="pseudo">gern + verbe : Ich esse gern Brot. / Ich trinke gern Kaffee.
mögen + nom  : Ich mag keinen Tee. / Sie mag Äpfel.
négation     : nicht gern (avec verbe) OU kein (avec mögen)</pre>
<p>Réflexe : pour aimer FAIRE, mets <strong>gern</strong> après le verbe ; pour aimer une CHOSE, emploie <strong>mögen</strong> devant le nom. Et pour commander, passe à <strong>möchte</strong>.</p>`
  }
};
</script>
