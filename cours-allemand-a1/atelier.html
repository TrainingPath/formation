<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — Allemand A1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var ATELIER = {
  prefix: "at-de-a1",
  titre: "🇩🇪 Atelier — Allemand A1",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour ancrer le niveau A1.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Sich vorstellen — Se présenter", perso:"Anna · Ben", lignes:[
      {qui:"A.", txt:"Guten Tag! Ich heiße Anna. Und du?", fr:"Bonjour ! Je m'appelle Anna. Et toi ?"},
      {qui:"B.", txt:"Hallo Anna, ich bin Ben. Freut mich!", fr:"Salut Anna, je suis Ben. Enchanté !"},
      {qui:"A.", txt:"Woher kommst du, Ben?", fr:"D'où viens-tu, Ben ?"},
      {qui:"B.", txt:"Ich komme aus Frankreich, aus Lyon.", fr:"Je viens de France, de Lyon."},
      {qui:"A.", txt:"Und wo wohnst du jetzt?", fr:"Et où habites-tu maintenant ?"},
      {qui:"B.", txt:"Ich wohne in Berlin. Ich lerne Deutsch.", fr:"J'habite à Berlin. J'apprends l'allemand."},
      {qui:"A.", txt:"Wie alt bist du?", fr:"Quel âge as-tu ?"},
      {qui:"B.", txt:"Ich bin zweiundzwanzig Jahre alt. Und du?", fr:"J'ai vingt-deux ans. Et toi ?"},
      {qui:"A.", txt:"Ich bin auch zweiundzwanzig. Was machst du beruflich?", fr:"J'ai aussi vingt-deux ans. Que fais-tu comme métier ?"},
      {qui:"B.", txt:"Ich bin Student. Ich studiere Informatik.", fr:"Je suis étudiant. J'étudie l'informatique."}
    ]},
    { num:"2", titre:"Im Café — Au café", perso:"Kellner · Clara", lignes:[
      {qui:"K.", txt:"Guten Morgen! Was möchten Sie trinken?", fr:"Bonjour ! Que voulez-vous boire ?"},
      {qui:"C.", txt:"Ich möchte einen Kaffee, bitte.", fr:"Je voudrais un café, s'il vous plaît."},
      {qui:"K.", txt:"Mit Milch und Zucker?", fr:"Avec du lait et du sucre ?"},
      {qui:"C.", txt:"Mit Milch, aber ohne Zucker.", fr:"Avec du lait, mais sans sucre."},
      {qui:"K.", txt:"Möchten Sie auch etwas essen?", fr:"Voulez-vous aussi manger quelque chose ?"},
      {qui:"C.", txt:"Ja, ich nehme ein Käsebrötchen.", fr:"Oui, je prends un petit pain au fromage."},
      {qui:"K.", txt:"Gern. Das macht vier Euro fünfzig.", fr:"Volontiers. Cela fait quatre euros cinquante."},
      {qui:"C.", txt:"Hier sind fünf Euro. Stimmt so.", fr:"Voici cinq euros. Gardez la monnaie."},
      {qui:"K.", txt:"Vielen Dank! Guten Appetit!", fr:"Merci beaucoup ! Bon appétit !"},
      {qui:"C.", txt:"Danke schön. Auf Wiedersehen!", fr:"Merci bien. Au revoir !"}
    ]},
    { num:"3", titre:"Nach dem Weg fragen — Demander son chemin", perso:"Tom · Frau Meier", lignes:[
      {qui:"T.", txt:"Entschuldigung, wo ist der Bahnhof?", fr:"Excusez-moi, où est la gare ?"},
      {qui:"M.", txt:"Gehen Sie geradeaus bis zur Ampel.", fr:"Allez tout droit jusqu'au feu."},
      {qui:"T.", txt:"Und dann? Links oder rechts?", fr:"Et ensuite ? À gauche ou à droite ?"},
      {qui:"M.", txt:"Dann gehen Sie links. Der Bahnhof ist da.", fr:"Ensuite vous allez à gauche. La gare est là."},
      {qui:"T.", txt:"Ist es weit von hier?", fr:"Est-ce loin d'ici ?"},
      {qui:"M.", txt:"Nein, zehn Minuten zu Fuß.", fr:"Non, dix minutes à pied."},
      {qui:"T.", txt:"Wie spät ist es bitte?", fr:"Quelle heure est-il, s'il vous plaît ?"},
      {qui:"M.", txt:"Es ist Viertel nach acht.", fr:"Il est huit heures et quart."},
      {qui:"T.", txt:"Danke! Mein Zug fährt um neun Uhr.", fr:"Merci ! Mon train part à neuf heures."},
      {qui:"M.", txt:"Bitte schön. Gute Reise!", fr:"Je vous en prie. Bon voyage !"}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Dis si l'affirmation est vraie ou fausse d'après les dialogues.", exercices:[
      {type:"vf", q:"Anna kommt aus Frankreich.", a:false, exp:"Faux : c'est Ben qui vient de France (aus Lyon). Anna ne dit pas son pays."},
      {type:"vf", q:"Ben wohnt in Berlin.", a:true, exp:"Vrai : « Ich wohne in Berlin. » Le verbe wohnen = habiter."},
      {type:"vf", q:"Ben ist zweiundzwanzig Jahre alt.", a:true, exp:"Vrai : « Ich bin zweiundzwanzig Jahre alt. » On dit l'âge avec sein, pas avec haben."},
      {type:"vf", q:"Ben studiert Medizin.", a:false, exp:"Faux : il étudie l'informatique, die Informatik (féminin)."},
      {type:"vf", q:"Clara möchte einen Tee.", a:false, exp:"Faux : elle commande einen Kaffee (der Kaffee, accusatif einen)."},
      {type:"vf", q:"Clara nimmt Milch, aber keinen Zucker.", a:true, exp:"Vrai : « mit Milch, aber ohne Zucker ». der Zucker = le sucre."},
      {type:"vf", q:"Der Kaffee und das Brötchen kosten vier Euro fünfzig.", a:true, exp:"Vrai : « Das macht vier Euro fünfzig. » das Brötchen = le petit pain (neutre)."},
      {type:"vf", q:"Der Bahnhof ist sehr weit.", a:false, exp:"Faux : « zehn Minuten zu Fuß » = dix minutes à pied. der Bahnhof = la gare."},
      {type:"vf", q:"Es ist Viertel nach acht.", a:true, exp:"Vrai : 8h15. « Viertel nach » = et quart."},
      {type:"vf", q:"Toms Zug fährt um zehn Uhr.", a:false, exp:"Faux : um neun Uhr. der Zug = le train ; fahren est un verbe fort (er fährt)."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisis la bonne réponse d'après les dialogues.", exercices:[
      {type:"qcm", q:"Wie heißt der junge Mann im Dialog 1?", opts:["Anna","Ben","Tom","Clara"], a:1, exp:"Ben : « ich bin Ben ». heißen = s'appeler."},
      {type:"qcm", q:"Woher kommt Ben?", opts:["Aus Deutschland","Aus Frankreich","Aus Italien","Aus Spanien"], a:1, exp:"« Ich komme aus Frankreich. » aus + pays = origine (datif)."},
      {type:"qcm", q:"Was studiert Ben?", opts:["Informatik","Biologie","Musik","Geschichte"], a:0, exp:"die Informatik. studieren = faire des études supérieures."},
      {type:"qcm", q:"Was bestellt Clara zu trinken?", opts:["Einen Tee","Ein Wasser","Einen Kaffee","Eine Cola"], a:2, exp:"der Kaffee → accusatif einen Kaffee."},
      {type:"qcm", q:"Was isst Clara?", opts:["Ein Käsebrötchen","Einen Kuchen","Eine Suppe","Ein Ei"], a:0, exp:"das Brötchen (neutre) → ein Käsebrötchen."},
      {type:"qcm", q:"Wie viel bezahlt Clara?", opts:["Vier Euro","Fünf Euro","Sechs Euro","Zehn Euro"], a:1, exp:"Elle donne cinq euros et laisse la monnaie (« Stimmt so »)."},
      {type:"qcm", q:"Was sucht Tom?", opts:["Die Post","Den Bahnhof","Das Hotel","Die Bank"], a:1, exp:"der Bahnhof → accusatif den Bahnhof."},
      {type:"qcm", q:"Wohin geht Tom nach der Ampel?", opts:["Nach rechts","Geradeaus","Nach links","Zurück"], a:2, exp:"« Dann gehen Sie links. » die Ampel = le feu."},
      {type:"qcm", q:"Wie lange dauert der Weg zu Fuß?", opts:["Fünf Minuten","Zehn Minuten","Zwanzig Minuten","Eine Stunde"], a:1, exp:"« zehn Minuten zu Fuß ». die Minute, pluriel die Minuten."},
      {type:"qcm", q:"Wann fährt der Zug von Tom?", opts:["Um acht Uhr","Um halb neun","Um neun Uhr","Um zehn Uhr"], a:2, exp:"« um neun Uhr ». um + heure = à telle heure."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase est fausse : écris le mot correct.", exercices:[
      {type:"input", q:"Ben kommt aus Italien. → Ben kommt aus ______.", a:["Frankreich"], ph:"pays", exp:"Frankreich (das Land = le pays). aus + nom de pays sans article."},
      {type:"input", q:"Ben wohnt in München. → Ben wohnt in ______.", a:["Berlin"], ph:"ville", exp:"Berlin. in + ville pour dire où l'on habite."},
      {type:"input", q:"Ben ist Lehrer. → Ben ist ______.", a:["Student"], ph:"métier", exp:"der Student. Après sein, le métier s'emploie sans article."},
      {type:"input", q:"Clara trinkt Tee. → Clara trinkt ______.", a:["Kaffee"], ph:"boisson", exp:"der Kaffee. Nom commun : toujours une majuscule."},
      {type:"input", q:"Clara nimmt Zucker. → Clara nimmt keinen ______.", a:["Zucker"], ph:"nom", exp:"der Zucker → négation kein au masculin accusatif : keinen Zucker."},
      {type:"input", q:"Clara isst einen Kuchen. → Clara isst ein ______.", a:["Käsebrötchen","Kaesebroetchen"], ph:"nom", exp:"das Käsebrötchen (neutre, diminutif -chen toujours neutre)."},
      {type:"input", q:"Tom sucht die Post. → Tom sucht den ______.", a:["Bahnhof"], ph:"nom", exp:"der Bahnhof → accusatif den Bahnhof (COD)."},
      {type:"input", q:"Tom geht rechts. → Tom geht ______.", a:["links"], ph:"direction", exp:"links = à gauche ; rechts = à droite."},
      {type:"input", q:"Es ist Viertel vor acht. → Es ist Viertel ______ acht.", a:["nach"], ph:"préposition", exp:"nach = après (8h15) ; vor = avant (7h45)."},
      {type:"input", q:"Der Bahnhof ist weit. → Der Bahnhof ist ______ weit.", a:["nicht"], ph:"négation", exp:"nicht nie un adjectif : nicht weit = pas loin."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lis le petit texte, puis réponds. — « Maria ist dreißig Jahre alt. Sie kommt aus Spanien und wohnt jetzt in Hamburg. Sie arbeitet als Krankenschwester im Krankenhaus. Sie steht um sechs Uhr auf und fährt mit dem Bus zur Arbeit. Am Wochenende liest sie gern Bücher und trinkt Tee mit ihrer Freundin. »", exercices:[
      {type:"qcm", q:"Wie alt ist Maria?", opts:["Zwanzig","Dreizehn","Dreißig","Vierzig"], a:2, exp:"dreißig = 30 (attention : dreizehn = 13)."},
      {type:"qcm", q:"Woher kommt Maria?", opts:["Aus Spanien","Aus Portugal","Aus Polen","Aus Griechenland"], a:0, exp:"aus Spanien. aus + datif pour l'origine."},
      {type:"input", q:"In welcher Stadt wohnt Maria? Sie wohnt in ______.", a:["Hamburg"], ph:"ville", exp:"Hamburg. die Stadt = la ville (pluriel die Städte)."},
      {type:"qcm", q:"Was ist Maria von Beruf?", opts:["Lehrerin","Krankenschwester","Verkäuferin","Ärztin"], a:1, exp:"die Krankenschwester = l'infirmière. der Beruf = le métier."},
      {type:"input", q:"Wann steht sie auf? Um ______ Uhr.", a:["sechs","6"], ph:"chiffre en lettres", exp:"sechs. aufstehen est séparable : sie steht ... auf."},
      {type:"vf", q:"Maria fährt mit dem Auto zur Arbeit.", a:false, exp:"Faux : mit dem Bus (der Bus, datif dem Bus après mit)."},
      {type:"qcm", q:"Was macht sie am Wochenende?", opts:["Sie arbeitet","Sie liest Bücher","Sie fährt nach Spanien","Sie schläft nur"], a:1, exp:"lesen est un verbe fort : sie liest. das Buch → die Bücher."},
      {type:"input", q:"Was trinkt Maria mit ihrer Freundin? ______.", a:["Tee","Sie trinkt Tee"], ph:"boisson", exp:"der Tee. Majuscule obligatoire au nom."},
      {type:"vf", q:"Maria arbeitet im Krankenhaus.", a:true, exp:"Vrai : das Krankenhaus → in dem = im Krankenhaus (datif, lieu)."},
      {type:"qcm", q:"« Sie liest gern Bücher » bedeutet:", opts:["Elle doit lire des livres","Elle aime lire des livres","Elle ne lit pas","Elle vend des livres"], a:1, exp:"gern + verbe = aimer faire quelque chose."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Observe le document et réponds. — PANNEAU / MENU : « CAFÉ SONNE — Öffnungszeiten: Mo–Fr 7:00–19:00, Sa 8:00–18:00, So geschlossen. Kaffee 2,50 € · Tee 2,00 € · Kuchen 3,20 € · WLAN gratis »", exercices:[
      {type:"qcm", q:"Wann öffnet das Café am Montag?", opts:["Um 6 Uhr","Um 7 Uhr","Um 8 Uhr","Um 9 Uhr"], a:1, exp:"Mo–Fr 7:00. der Montag = lundi (tous les jours sont masculins)."},
      {type:"vf", q:"Am Sonntag ist das Café offen.", a:false, exp:"Faux : « So geschlossen » = fermé le dimanche. der Sonntag."},
      {type:"input", q:"Wie viel kostet ein Kaffee? ______ Euro fünfzig.", a:["zwei","2"], ph:"chiffre", exp:"2,50 € = zwei Euro fünfzig. der Kaffee."},
      {type:"qcm", q:"Was ist am teuersten?", opts:["Der Kaffee","Der Tee","Der Kuchen","Das WLAN"], a:2, exp:"der Kuchen 3,20 € = le gâteau, le plus cher."},
      {type:"vf", q:"Das WLAN kostet nichts.", a:true, exp:"Vrai : « gratis ». das WLAN (neutre), prononcé « vé-lan »."},
      {type:"qcm", q:"« Öffnungszeiten » bedeutet:", opts:["Les prix","Les horaires d'ouverture","Le menu","L'adresse"], a:1, exp:"die Zeit = le temps ; die Öffnungszeiten = les heures d'ouverture."},
      {type:"input", q:"Am Samstag schließt das Café um ______ Uhr.", a:["achtzehn","18","sechs"], ph:"heure", exp:"Sa 8:00–18:00 → achtzehn Uhr. der Samstag."},
      {type:"qcm", q:"Sie wollen am Sonntag Kuchen essen. Was tun Sie?", opts:["Sie gehen ins Café","Das Café ist geschlossen","Sie bestellen Tee","Sie warten bis 19 Uhr"], a:1, exp:"geschlossen = fermé (participe de schließen)."},
      {type:"vf", q:"Der Tee kostet mehr als der Kaffee.", a:false, exp:"Faux : Tee 2,00 € < Kaffee 2,50 €. mehr als = plus que."},
      {type:"qcm", q:"« Mo–Fr » bedeutet:", opts:["Montag bis Freitag","Morgen und Freitag","Monat Februar","Montag oder Freitag"], a:0, exp:"bis = jusqu'à. der Freitag = vendredi."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Choisis le mot ou l'expression de sens équivalent.", exercices:[
      {type:"qcm", q:"Guten Tag! =", opts:["Tschüss","Hallo","Danke","Bitte"], a:1, exp:"Hallo est la salutation familière ; Guten Tag est la forme polie."},
      {type:"qcm", q:"Auf Wiedersehen! =", opts:["Tschüss","Guten Morgen","Entschuldigung","Bitte schön"], a:0, exp:"Tschüss = salut (en partant), familier."},
      {type:"qcm", q:"Ich möchte einen Kaffee. =", opts:["Ich habe einen Kaffee","Ich nehme einen Kaffee","Ich koche Kaffee","Ich mag keinen Kaffee"], a:1, exp:"nehmen (verbe fort : ich nehme, du nimmst) sert à commander."},
      {type:"qcm", q:"Vielen Dank! =", opts:["Bitte","Danke schön","Entschuldigung","Gern geschehen"], a:1, exp:"Danke schön = merci bien. schön renforce le remerciement."},
      {type:"qcm", q:"Entschuldigung! =", opts:["Verzeihung","Achtung","Vorsicht","Willkommen"], a:0, exp:"die Verzeihung / die Entschuldigung = le pardon, l'excuse."},
      {type:"qcm", q:"Wie geht es dir? =", opts:["Wer bist du?","Wie alt bist du?","Wie geht's?","Wo bist du?"], a:2, exp:"Wie geht's? est la forme contractée et familière."},
      {type:"qcm", q:"Das Auto =", opts:["Der Wagen","Das Fahrrad","Der Zug","Das Flugzeug"], a:0, exp:"der Wagen = la voiture (synonyme de das Auto)."},
      {type:"qcm", q:"Sprechen =", opts:["Hören","Reden","Lesen","Schreiben"], a:1, exp:"reden = parler, discuter, proche de sprechen (verbe fort : er spricht)."},
      {type:"qcm", q:"Der Ehemann =", opts:["Der Bruder","Der Vater","Der Mann","Der Sohn"], a:2, exp:"der Mann signifie aussi « le mari » selon le contexte."},
      {type:"qcm", q:"Beginnen =", opts:["Anfangen","Aufhören","Warten","Bleiben"], a:0, exp:"anfangen (séparable : ich fange an) = commencer, comme beginnen."}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Choisis le contraire du mot proposé.", exercices:[
      {type:"qcm", q:"groß ↔", opts:["klein","alt","neu","schnell"], a:0, exp:"groß / klein = grand / petit."},
      {type:"qcm", q:"alt ↔", opts:["jung","kalt","teuer","leicht"], a:0, exp:"alt / jung pour les personnes ; alt / neu pour les choses."},
      {type:"qcm", q:"teuer ↔", opts:["billig","reich","voll","warm"], a:0, exp:"billig = bon marché ; teuer = cher."},
      {type:"qcm", q:"kalt ↔", opts:["warm","dunkel","kurz","langsam"], a:0, exp:"warm / kalt. Attention : heiß = brûlant."},
      {type:"qcm", q:"immer ↔", opts:["nie","oft","schon","auch"], a:0, exp:"nie = jamais ; immer = toujours."},
      {type:"qcm", q:"links ↔", opts:["rechts","geradeaus","oben","hinten"], a:0, exp:"rechts = à droite. Utile pour demander son chemin."},
      {type:"qcm", q:"kommen ↔", opts:["gehen","bleiben","stehen","sitzen"], a:0, exp:"gehen = aller, partir ; kommen = venir."},
      {type:"qcm", q:"viel ↔", opts:["wenig","mehr","genug","alles"], a:0, exp:"wenig = peu ; viel = beaucoup."},
      {type:"qcm", q:"der Anfang ↔", opts:["das Ende","die Mitte","die Zeit","der Weg"], a:0, exp:"das Ende (neutre) = la fin ; der Anfang = le début."},
      {type:"qcm", q:"öffnen ↔", opts:["schließen","fragen","kaufen","suchen"], a:0, exp:"schließen = fermer (geschlossen = fermé)."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complète avec le mot qui convient.", exercices:[
      {type:"input", q:"Ich ______ Anna. (s'appeler)", a:["heiße","heisse"], ph:"verbe", exp:"heißen : ich heiße. Le ß se remplace par ss si besoin."},
      {type:"qcm", q:"Ich trinke einen Kaffee ______ Milch.", opts:["mit","für","ohne Milch","zu"], a:0, exp:"mit + datif = avec. die Milch (féminin)."},
      {type:"input", q:"Wie ______ ist es? — Es ist acht Uhr. (tard)", a:["spät","spaet"], ph:"adjectif", exp:"Wie spät ist es? = Quelle heure est-il ?"},
      {type:"qcm", q:"Der Bahnhof ist zehn Minuten ______ Fuß.", opts:["zu","auf","in","mit"], a:0, exp:"zu Fuß = à pied (expression figée). der Fuß = le pied."},
      {type:"input", q:"Ich ______ aus Frankreich. (venir)", a:["komme"], ph:"verbe", exp:"kommen : ich komme, du kommst, er kommt."},
      {type:"qcm", q:"______ Sie geradeaus bis zur Ampel!", opts:["Gehen","Geht","Gehst","Gehe"], a:0, exp:"Impératif de politesse : verbe + Sie."},
      {type:"input", q:"Das ______ vier Euro fünfzig. (faire, coûter)", a:["macht"], ph:"verbe", exp:"machen : das macht = cela fait (au total)."},
      {type:"qcm", q:"Ich bin Student. Ich ______ Informatik.", opts:["studiere","lerne aus","arbeite","lese"], a:0, exp:"studieren = étudier à l'université ; lernen = apprendre."},
      {type:"input", q:"Guten ______! (le matin)", a:["Morgen"], ph:"nom", exp:"der Morgen. Guten Morgen jusqu'à 11h environ."},
      {type:"qcm", q:"Wie ______ kostet das?", opts:["viel","viele","gut","lang"], a:0, exp:"Wie viel = combien (quantité non comptable)."}
    ]}
    ,{ id:"familles", nom:"Familles de mots", consigne:"Trouve le mot de la même famille.", exercices:[
      {type:"qcm", q:"arbeiten (travailler) → le travail =", opts:["die Arbeit","der Arbeiter","das Büro","die Firma"], a:0, exp:"die Arbeit (féminin). Les noms en -eit/-heit sont féminins."},
      {type:"qcm", q:"lehren (enseigner) → l'enseignant =", opts:["der Lehrer","der Schüler","die Schule","das Lernen"], a:0, exp:"der Lehrer ; féminin die Lehrerin (suffixe -in)."},
      {type:"input", q:"der Lehrer → la femme enseignante = die ______", a:["Lehrerin"], ph:"nom", exp:"On ajoute -in au masculin pour former le féminin."},
      {type:"qcm", q:"fahren (rouler) → le conducteur =", opts:["der Fahrer","die Fahrt","das Fahrzeug","der Wagen"], a:0, exp:"der Fahrer. Verbe fort : du fährst, er fährt."},
      {type:"qcm", q:"backen (cuire) → la boulangerie =", opts:["die Bäckerei","der Bäcker","das Brot","der Ofen"], a:0, exp:"die Bäckerei ; les noms en -ei sont féminins. der Bäcker = le boulanger."},
      {type:"input", q:"kochen (cuisiner) → la cuisine (la pièce) = die ______", a:["Küche","Kueche"], ph:"nom", exp:"die Küche (féminin). Ne pas confondre avec der Kuchen = le gâteau."},
      {type:"qcm", q:"wohnen (habiter) → le logement =", opts:["die Wohnung","das Haus","der Wohner","die Miete"], a:0, exp:"die Wohnung ; les noms en -ung sont toujours féminins."},
      {type:"qcm", q:"frei (libre) → la liberté =", opts:["die Freiheit","der Freund","die Freude","das Freie"], a:0, exp:"die Freiheit ; suffixe -heit = féminin."},
      {type:"input", q:"der Freund (l'ami) → l'amie = die ______", a:["Freundin"], ph:"nom", exp:"Freund + in. die Freundin (féminin)."},
      {type:"qcm", q:"krank (malade) → l'hôpital =", opts:["das Krankenhaus","die Krankheit","der Kranke","die Klinik"], a:0, exp:"das Krankenhaus (das Haus est neutre : le dernier mot donne le genre)."}
    ]},
    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux ressemblances trompeuses : choisis la bonne traduction.", exercices:[
      {type:"qcm", q:"« bekommen » signifie:", opts:["devenir","recevoir","aller","commencer"], a:1, exp:"Piège : bekommen = recevoir. Devenir = werden."},
      {type:"qcm", q:"« das Gift » signifie:", opts:["le cadeau","le poison","le talent","la fête"], a:1, exp:"das Gift = le poison. Le cadeau = das Geschenk."},
      {type:"qcm", q:"« der Chef » signifie:", opts:["le cuisinier","le patron","le chef d'orchestre","le militaire"], a:1, exp:"der Chef = le patron. Le cuisinier = der Koch."},
      {type:"qcm", q:"« das Handy » signifie:", opts:["la main","le téléphone portable","pratique","le sac"], a:1, exp:"das Handy = le portable (faux anglicisme). die Hand = la main."},
      {type:"qcm", q:"« die Note » signifie:", opts:["la note (école, musique)","le carnet","la remarque","le prix"], a:0, exp:"die Note = la note scolaire ou de musique. Le mot noté = die Notiz."},
      {type:"qcm", q:"« der Rock » signifie:", opts:["le rocher","la jupe","la musique rock","la roche"], a:1, exp:"der Rock = la jupe. Le rocher = der Felsen."},
      {type:"qcm", q:"« also » signifie:", opts:["aussi","donc","déjà","toujours"], a:1, exp:"also = donc. Aussi = auch."},
      {type:"qcm", q:"« der Konkurs » signifie:", opts:["le concours","la faillite","la course","le concert"], a:1, exp:"der Konkurs = la faillite. Le concours = der Wettbewerb."},
      {type:"qcm", q:"« das Kind » signifie:", opts:["gentil","l'enfant","le genre","la classe"], a:1, exp:"das Kind (neutre), pluriel die Kinder."},

      {type:"input", q:"Das ist mein Vater. ______ arbeitet in Köln.", a:["Er","er"], ph:"pronom", exp:"der Vater → er (il)."},

      {type:"qcm", q:"Kommst du mit? Ja, ich komme mit ______.", opts:["du","dich","dir","dein"], a:2, exp:"mit + datif : dir (à toi)."},
      {type:"qcm", q:"Ich sehe ______ morgen. (te)", opts:["du","dich","dir","dein"], a:1, exp:"sehen + accusatif : dich."},
      {type:"qcm", q:"______ Bruder wohnt in Wien. (mon)", opts:["Mein","Meine","Meinen","Meines"], a:0, exp:"der Bruder masculin → mein (possessif sans terminaison au nominatif)."},
      {type:"qcm", q:"______ Schwester ist Lehrerin. (ma)", opts:["Mein","Meine","Meinen","Meinem"], a:1, exp:"die Schwester féminin → meine."}
    ]}
    ,{ id:"negation", nom:"Négation : nicht et kein", consigne:"Choisis ou écris la bonne négation.", exercices:[
      {type:"qcm", q:"Ich habe ______ Auto.", opts:["nicht","kein","keine","nicht ein"], a:1, exp:"das Auto (neutre) → kein Auto. kein nie devant un nom sans article défini."},
      {type:"qcm", q:"Ich trinke ______ Milch.", opts:["kein","keine","keinen","nicht"], a:1, exp:"die Milch féminin → keine Milch."},
      {type:"qcm", q:"Er hat ______ Bruder.", opts:["kein","keine","keinen","nicht"], a:2, exp:"der Bruder masculin à l'accusatif → keinen."},
      {type:"qcm", q:"Das ist ______ mein Buch.", opts:["kein","keine","nicht","keinen"], a:2, exp:"Devant un possessif ou un article défini, on emploie nicht."},
      {type:"qcm", q:"Ich komme heute ______.", opts:["kein","keine","nicht","nichts"], a:2, exp:"nicht en fin de phrase nie le verbe."},
      {type:"qcm", q:"Der Bahnhof ist ______ weit.", opts:["kein","nicht","keine","nichts"], a:1, exp:"nicht devant un adjectif attribut."},
      {type:"qcm", q:"Ich habe ______ Zeit.", opts:["nicht","keine","kein","keinen"], a:1, exp:"die Zeit féminin → keine Zeit."},
      {type:"qcm", q:"Ich verstehe ______.", opts:["nicht","nichts","kein","keine"], a:1, exp:"nichts = rien (pronom). Ich verstehe nichts = je ne comprends rien."},
      {type:"input", q:"Ich wohne in Berlin. → Négation : Ich wohne ______ in Berlin.", a:["nicht"], ph:"négation", exp:"nicht se place avant le complément de lieu prépositionnel."},
      {type:"input", q:"Ich habe eine Schwester. → Négation : Ich habe ______ Schwester.", a:["keine"], ph:"négation", exp:"eine → keine. die Schwester = la sœur."}
    ]},
    { id:"ordremots", nom:"Ordre des mots (verbe en 2e position)", consigne:"Choisis la phrase correcte ou remets l'ordre.", exercices:[
      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["Heute ich gehe ins Kino.","Heute gehe ich ins Kino.","Ich heute gehe ins Kino.","Gehe heute ich ins Kino."], a:1, exp:"Le verbe conjugué occupe toujours la 2e position → inversion sujet-verbe."},
      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["Morgen fahre ich nach Bonn.","Morgen ich fahre nach Bonn.","Fahre morgen ich nach Bonn.","Ich morgen fahre nach Bonn."], a:0, exp:"Après un complément en tête, inversion obligatoire."},
      {type:"input", q:"Remets en ordre : (Kaffee / trinke / ich / gerne) → ______ gerne Kaffee.", a:["Ich trinke","ich trinke"], ph:"début de phrase", exp:"Sujet + verbe en 2e position : Ich trinke gerne Kaffee."},
      {type:"qcm", q:"Question sans mot interrogatif : ", opts:["Du kommst morgen?","Kommst du morgen?","Morgen du kommst?","Kommen du morgen?"], a:1, exp:"Question fermée : verbe en 1re position."},
      {type:"qcm", q:"Question avec mot interrogatif : ", opts:["Wann du kommst?","Wann kommst du?","Kommst wann du?","Du wann kommst?"], a:1, exp:"W-Frage : mot interrogatif + verbe + sujet."},
      {type:"qcm", q:"Verbe séparable : ", opts:["Ich aufstehe um sechs.","Ich stehe um sechs auf.","Ich stehe auf um sechs.","Auf ich stehe um sechs."], a:1, exp:"aufstehen : la particule auf va en fin de phrase."},
      {type:"qcm", q:"Avec un modal : ", opts:["Ich möchte einen Kaffee trinken.","Ich möchte trinken einen Kaffee.","Ich einen Kaffee möchte trinken.","Trinken ich möchte einen Kaffee."], a:0, exp:"L'infinitif se place à la toute fin (structure en parenthèse)."},
      {type:"qcm", q:"Impératif : ", opts:["Sie gehen geradeaus!","Gehen Sie geradeaus!","Geradeaus Sie gehen!","Gehst Sie geradeaus!"], a:1, exp:"Impératif poli : verbe à l'infinitif + Sie."},
      {type:"input", q:"Am Montag ______ ich nach Wien. (fahren)", a:["fahre"], ph:"verbe", exp:"Complément en 1re position → verbe en 2e, sujet après."},
      {type:"qcm", q:"Quelle phrase est INCORRECTE ?", opts:["Ich lerne Deutsch.","Deutsch lerne ich.","Lerne ich Deutsch heute.","Heute lerne ich Deutsch."], a:2, exp:"Le verbe en 1re position ne convient qu'aux questions fermées et à l'impératif."}
    ]},
    { id:"transfo", nom:"Transformation", consigne:"Transforme la phrase comme indiqué.", exercices:[
      {type:"input", q:"Affirmatif → question fermée : Du kommst aus Wien. → ______ du aus Wien?", a:["Kommst","kommst"], ph:"verbe", exp:"Question fermée : le verbe passe en 1re position."},
      {type:"input", q:"du → Sie (politesse) : Wie heißt du? → Wie ______ Sie?", a:["heißen","heissen"], ph:"verbe", exp:"Sie prend la forme en -en, comme l'infinitif."},
      {type:"input", q:"Singulier → pluriel : Das Kind spielt. → Die Kinder ______.", a:["spielen"], ph:"verbe", exp:"das Kind → die Kinder ; verbe en -en."},
      {type:"input", q:"Présent, 3e pers. : Ich lese ein Buch. → Er ______ ein Buch.", a:["liest"], ph:"verbe", exp:"lesen est fort : e → ie."},
      {type:"input", q:"Négation : Ich habe Zeit. → Ich habe ______ Zeit.", a:["keine"], ph:"négation", exp:"die Zeit féminin → keine."},
      {type:"input", q:"Inversion : Ich gehe heute ins Kino. → Heute ______ ich ins Kino.", a:["gehe"], ph:"verbe", exp:"Verbe toujours en 2e position."},
      {type:"input", q:"Nominatif → accusatif : Der Bahnhof ist dort. → Ich sehe ______ Bahnhof.", a:["den"], ph:"article", exp:"der → den à l'accusatif masculin."},
      {type:"input", q:"Ajoute un modal : Ich trinke Kaffee. → Ich möchte Kaffee ______.", a:["trinken"], ph:"verbe", exp:"L'infinitif se met à la fin après un modal."},
      {type:"input", q:"Séparable : aufstehen, ich → Ich ______ um sieben auf.", a:["stehe"], ph:"verbe", exp:"La particule auf se détache et va en fin de phrase."},
      {type:"input", q:"Impératif poli : Sie gehen links. → ______ Sie links!", a:["Gehen"], ph:"verbe", exp:"Impératif de politesse : infinitif + Sie."}
    ]},
    { id:"tradfr", nom:"Traduction FR → DE", consigne:"Traduis en allemand (attention aux majuscules des noms).", exercices:[
      {type:"input", q:"Je m'appelle Anna. → Ich ______ Anna.", a:["heiße","heisse"], ph:"verbe", exp:"heißen. Variante ASCII : heisse."},
      {type:"input", q:"Je viens d'Allemagne. → Ich komme aus ______.", a:["Deutschland"], ph:"pays", exp:"Deutschland, sans article après aus."},
      {type:"input", q:"J'habite à Berlin. → Ich ______ in Berlin.", a:["wohne"], ph:"verbe", exp:"wohnen = habiter ; in + ville."},
      {type:"input", q:"Je voudrais un café. → Ich möchte einen ______.", a:["Kaffee"], ph:"nom", exp:"der Kaffee, accusatif einen Kaffee. Majuscule obligatoire."},
      {type:"input", q:"Où est la gare ? → Wo ist der ______?", a:["Bahnhof"], ph:"nom", exp:"der Bahnhof (masculin)."},
      {type:"input", q:"Quelle heure est-il ? → Wie ______ ist es?", a:["spät","spaet"], ph:"adjectif", exp:"Wie spät ist es? Formule figée."},
      {type:"input", q:"J'ai vingt ans. → Ich ______ zwanzig Jahre alt.", a:["bin"], ph:"verbe", exp:"L'âge se dit avec sein, pas avec haben."},
      {type:"input", q:"Je n'ai pas de voiture. → Ich habe ______ Auto.", a:["kein"], ph:"négation", exp:"das Auto → kein Auto."},
      {type:"input", q:"Nous allons à Munich. → Wir fahren ______ München.", a:["nach"], ph:"préposition", exp:"nach + ville pour la direction."},
      {type:"input", q:"Merci beaucoup ! → ______ Dank!", a:["Vielen"], ph:"mot", exp:"Vielen Dank ! (der Dank, accusatif figé)."}
    ]},
    { id:"traden", nom:"Traduction DE → FR", consigne:"Choisis la bonne traduction française.", exercices:[
      {type:"qcm", q:"Ich habe Hunger.", opts:["J'ai faim.","J'ai soif.","Je suis fatigué.","Je mange."], a:0, exp:"der Hunger = la faim. Construction avec haben."},
      {type:"qcm", q:"Wir wohnen seit zwei Jahren hier.", opts:["Nous habitons ici depuis deux ans.","Nous habitions ici il y a deux ans.","Nous partons dans deux ans.","Nous cherchons depuis deux ans."], a:0, exp:"seit + datif = depuis. das Jahr → die Jahre."},
      {type:"qcm", q:"Der Zug fährt um neun Uhr ab.", opts:["Le train arrive à neuf heures.","Le train part à neuf heures.","Le train roule neuf heures.","Le train est à neuf heures."], a:1, exp:"abfahren (séparable) = partir. der Zug = le train."},
      {type:"qcm", q:"Kannst du mir helfen?", opts:["Peux-tu m'aider ?","Veux-tu m'écouter ?","Dois-tu m'appeler ?","Sais-tu où je suis ?"], a:0, exp:"helfen + datif : mir. können = pouvoir."},
      {type:"qcm", q:"Das Wetter ist heute schlecht.", opts:["Le temps est mauvais aujourd'hui.","Il fait chaud aujourd'hui.","La journée est longue.","Le temps passe vite."], a:0, exp:"das Wetter = le temps qu'il fait ; schlecht = mauvais."},
      {type:"qcm", q:"Ich stehe jeden Tag um sechs Uhr auf.", opts:["Je me couche à six heures.","Je me lève tous les jours à six heures.","Je travaille six heures par jour.","J'attends six heures."], a:1, exp:"aufstehen = se lever ; jeden Tag = tous les jours (accusatif)."},
      {type:"qcm", q:"Sie spricht sehr gut Deutsch.", opts:["Elle parle très bien allemand.","Ils parlent un peu allemand.","Vous parlez allemand.","Elle apprend l'allemand."], a:0, exp:"sprechen : sie spricht. gut = bien."},
      {type:"qcm", q:"Wo kann ich hier Brot kaufen?", opts:["Où puis-je acheter du pain ici ?","Quand achètes-tu du pain ?","Qui vend du pain ?","Combien coûte le pain ?"], a:0, exp:"das Brot = le pain ; kaufen = acheter."},
      {type:"qcm", q:"Er hat keine Geschwister.", opts:["Il n'a pas de frères et sœurs.","Il a deux sœurs.","Il ne connaît personne.","Il n'a pas d'amis."], a:0, exp:"die Geschwister (toujours pluriel) = les frères et sœurs."},
      {type:"qcm", q:"Entschuldigung, ich verstehe nicht.", opts:["Excusez-moi, je ne comprends pas.","Pardon, je ne sais pas.","Désolé, je ne peux pas.","Excusez-moi, je n'entends rien."], a:0, exp:"verstehen = comprendre ; négation du verbe avec nicht."}
    ]},
    { id:"dictee", nom:"Dictée à trous", consigne:"Écris le mot manquant (orthographe et majuscules exactes).", exercices:[
      {type:"input", q:"Guten Tag, ich ______ Anna.", a:["heiße","heisse"], ph:"mot", exp:"heißen. Le ß peut s'écrire ss."},
      {type:"input", q:"Ich komme ______ Frankreich.", a:["aus"], ph:"mot", exp:"aus + pays."},
      {type:"input", q:"Ich möchte einen ______ mit Milch.", a:["Kaffee"], ph:"nom", exp:"der Kaffee, majuscule au nom."},
      {type:"input", q:"Das ______ vier Euro fünfzig.", a:["macht"], ph:"verbe", exp:"machen ici = faire un total."},
      {type:"input", q:"Wo ist der ______, bitte?", a:["Bahnhof"], ph:"nom", exp:"der Bahnhof, majuscule obligatoire."},
      {type:"input", q:"Gehen Sie ______ bis zur Ampel.", a:["geradeaus"], ph:"adverbe", exp:"geradeaus = tout droit (un seul mot, minuscule)."},
      {type:"input", q:"Es ist Viertel ______ acht.", a:["nach"], ph:"préposition", exp:"nach = après → 8h15."},
      {type:"input", q:"Mein Zug ______ um neun Uhr.", a:["fährt","faehrt"], ph:"verbe", exp:"fahren, verbe fort : er fährt."},
      {type:"input", q:"Ich bin zweiundzwanzig ______ alt.", a:["Jahre"], ph:"nom", exp:"das Jahr → die Jahre. Majuscule."},
      {type:"input", q:"Vielen ______! — Bitte schön.", a:["Dank"], ph:"nom", exp:"der Dank, majuscule au nom."}
    ]},
    { id:"prononciation", nom:"Prononciation et accent tonique", consigne:"Réponds sur les sons et l'accent tonique de l'allemand.", exercices:[
      {type:"qcm", q:"Dans « ich », le son ch se prononce:", opts:["comme un k","doux, proche du « ch » français mouillé","comme un r","muet"], a:1, exp:"Ich-Laut : son doux après i, e, ä, ö, ü, ei, eu."},
      {type:"qcm", q:"Dans « Buch » et « acht », le son ch est:", opts:["doux comme dans ich","guttural, raclé au fond de la gorge","comme sh en anglais","comme k"], a:1, exp:"Ach-Laut : après a, o, u, au."},
      {type:"qcm", q:"« ei » (dans mein, Wein) se prononce:", opts:["[è]","[aï]","[i]","[ei] séparé"], a:1, exp:"ei = [aï]. C'est la deuxième lettre qui donne le son."},
      {type:"qcm", q:"« ie » (dans Liebe, sieben) se prononce:", opts:["[i] long","[ié]","[aï]","[é]"], a:0, exp:"ie = i long. Ne pas confondre avec ei."},
      {type:"qcm", q:"« eu » et « äu » (heute, Häuser) se prononcent:", opts:["[eu] français","[oï]","[é]","[u]"], a:1, exp:"eu / äu = [oï], comme dans « oye »."},
      {type:"qcm", q:"« ü » (dans über, Bücher) ressemble à:", opts:["le u français","le ou français","le i français","le é français"], a:0, exp:"ü = u français (lèvres arrondies, langue en avant)."},
      {type:"qcm", q:"« z » (dans Zucker, zehn) se prononce:", opts:["[z] comme zéro","[ts]","[s]","[dz]"], a:1, exp:"z = [ts] : Zucker se dit « tsoukeu »."},
      {type:"qcm", q:"En début de mot, « sp » (sprechen) se prononce:", opts:["[sp]","[chp]","[zp]","[p]"], a:1, exp:"sp- et st- initiaux = [chp] et [cht]."},
      {type:"qcm", q:"Dans « Straße », le st initial se prononce:", opts:["[st]","[cht]","[zt]","[t]"], a:1, exp:"St- initial = [cht] : « Chtrasse ». Le ß = s sourd, voyelle longue."},
      {type:"qcm", q:"Dans « aufstehen », l'accent tonique porte sur:", opts:["auf","ste","hen","la dernière syllabe"], a:0, exp:"Dans les verbes à particule séparable, l'accent porte sur la particule."}
    ]}
  ]
};
