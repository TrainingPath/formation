  title: "La négation : nicht et kein",
  subtitle: "Dire « ne… pas » et « pas de » : deux outils, deux emplois.",
  theory: `
<h3>1. Deux mots pour nier</h3>
<p>L'allemand a deux façons de dire « non » dans une phrase. Le choix dépend de ce qu'on nie :</p>
<pre class="pseudo">nicht  ->  nie un verbe, un adjectif, un nom PRECIS (avec article defini ou possessif)
kein   ->  nie un nom INDEFINI (avec ein) ou sans article</pre>
<h3>2. kein : nier « un / une / du »</h3>
<p>Quand le nom est introduit par <strong>ein/eine</strong>, ou n'a pas d'article, on le nie avec <strong>kein</strong> (vu au jour 7). kein se décline comme ein :</p>
<pre class="pseudo">Ich habe ein Auto.    ->  Ich habe kein Auto.     // Je n'ai pas de voiture.
Ich habe eine Katze.  ->  Ich habe keine Katze.   // Je n'ai pas de chat.
Ich habe Zeit.        ->  Ich habe keine Zeit.    // Je n'ai pas de temps.
Ich habe Kinder.      ->  Ich habe keine Kinder.  // Je n'ai pas d'enfants. (pluriel)</pre>
<div class="tip">Astuce de choix : si la phrase positive contient « ein » ou aucun article → utilise kein. Sinon → utilise nicht.</div>
<h3>3. nicht : nier le reste</h3>
<p><strong>nicht</strong> sert pour tout le reste : un verbe, un adjectif, ou un nom déjà précisé (der/die/das, mein…) :</p>
<pre class="pseudo">Ich spiele nicht.        // Je ne joue pas.        (nie le verbe)
Er ist nicht müde.       // Il n'est pas fatigué.  (nie l'adjectif)
Ich kenne den Mann nicht.// Je ne connais pas cet homme. (nom precis)
Das ist nicht mein Auto. // Ce n'est pas ma voiture. (possessif)</pre>
<h3>4. Où placer nicht ?</h3>
<p>La position de <strong>nicht</strong> dépend de ce qu'il nie :</p>
<pre class="pseudo">- Devant l'element precis nie :   Er ist nicht müde.  (devant l'adjectif)
                                   Das ist nicht mein Auto. (devant le possessif)
- A la fin, s'il nie tout le verbe : Ich spiele heute nicht. (Je ne joue pas aujourd'hui.)</pre>
<div class="warn">Règle pratique : nicht se place <strong>juste devant</strong> le mot qu'il nie (adjectif, complément précis). S'il nie l'action entière, il va <strong>à la fin</strong> de la phrase. C'est le contraire du français, où « ne… pas » entoure le verbe.</div>
<h3>5. Répondre par oui ou non</h3>
<pre class="pseudo">Ja   = oui                 Bist du müde? — Ja. (Es-tu fatigué ? — Oui.)
Nein = non                 Bist du müde? — Nein. (— Non.)
Doch = si ! (contredit une question negative)
       Bist du nicht müde? — Doch! (N'es-tu pas fatigué ? — Si !)</pre>
<p><strong>Doch</strong> n'a pas d'équivalent simple en anglais : il sert à répondre « si » à une question posée à la forme négative, comme le « si » français.</p>`,

    { type: "vf", q: "« Doch » sert à répondre « si » à une question posée négativement.", a: true, exp: "C'est l'équivalent du « si » français." },

  ],

    intro: `<p>Un petit texte négatif, puis des phrases à nier. Rappel : « ein » ou sans article → kein ; le reste → nicht.</p>
<pre class="pseudo">Ich habe keine Zeit heute. Ich spiele nicht Tennis.   // Je n'ai pas le temps aujourd'hui. Je ne joue pas au tennis.
Das ist nicht mein Auto.                               // Ce n'est pas ma voiture.</pre>`,
    questions: [

      { type: "qcm", q: "Nie « Ich habe einen Hund ». (masculin, accusatif)", opts: ["Ich habe keinen Hund.", "Ich habe nicht Hund.", "Ich habe kein Hund.", "Ich habe nicht einen Hund."], a: 0, exp: "einen → keinen (masculin accusatif)." },
      { type: "qcm", q: "Nie « Sie ist nett ».", opts: ["Sie ist nicht nett.", "Sie ist kein nett.", "Sie ist keine nett.", "Sie nicht ist nett."], a: 0, exp: "Adjectif → nicht : Sie ist nicht nett." },
      { type: "input", q: "Nie l'action : Wir kommen heute ___ . (« nous ne venons pas »)", a: ["nicht"], ph: "un mot", exp: "Wir kommen heute nicht." },
      { type: "input", q: "Nie : Ich habe Kinder. → Ich habe ___ Kinder. (pluriel)", a: ["keine"], ph: "un mot", exp: "keine Kinder (pluriel)." }
    ],
    solution: `<p>La négation allemande se joue en un seul choix : <strong>kein</strong> pour nier un nom introduit par <em>ein</em> ou sans article (kein Auto, keine Zeit, keine Kinder), et <strong>nicht</strong> pour tout le reste — un verbe, un adjectif, ou un nom déjà déterminé (der/die/das, mein…). Côté place : nicht se met <strong>juste devant</strong> le mot qu'il nie, ou <strong>à la fin</strong> s'il nie l'action entière. Enfin, pour répondre, retiens le trio ja / nein / <strong>doch</strong> (« si », contre une question négative).</p>`
  }
