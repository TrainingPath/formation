  title: "L'ordre des mots : le verbe en 2e position",
  subtitle: "La règle V2, colonne vertébrale de la phrase allemande.",
  theory: `
<h3>1. La règle d'or : le verbe en position 2</h3>
<p>Dans une phrase déclarative (qui affirme quelque chose), le <strong>verbe conjugué occupe toujours la deuxième position</strong>. On appelle cela la règle <strong>V2</strong>. « Position 2 » ne veut pas dire « deuxième mot », mais « deuxième <em>élément</em> » (un groupe de mots peut compter pour un élément).</p>
<pre class="pseudo">Position 1        Position 2 (VERBE)   reste
Ich               wohne                in Berlin.     // J'habite à Berlin.
Anna              spielt               Tennis.        // Anna joue au tennis.</pre>
<h3>2. Ce qui change tout : commencer par autre chose que le sujet</h3>
<p>On peut mettre en <strong>position 1</strong> un autre élément que le sujet (un complément de temps, de lieu…) pour le mettre en valeur. Mais alors le verbe <strong>reste en position 2</strong>, et le sujet passe juste après le verbe. C'est l'<strong>inversion</strong> :</p>
<pre class="pseudo">Heute        spiele    ich    Tennis.    // Aujourd'hui, je joue au tennis.
 (pos 1)     (VERBE)  (sujet)
In Berlin    wohnt     sie.              // À Berlin, elle habite.</pre>
<div class="warn">Piège du francophone : en français on dit « Aujourd'hui, je joue ». En allemand, on ne peut PAS garder « Heute ich spiele ». Le verbe doit rester en 2e position : « Heute spiele ich ». Le sujet (ich) recule derrière le verbe.</div>
<h3>3. Le verbe est un pivot fixe</h3>
<p>Quelle que soit la mise en avant choisie, le verbe conjugué ne bouge pas de la 2e case. Compare :</p>
<pre class="pseudo">Ich    trinke   morgens   Kaffee.      // Je bois du café le matin. (ordre neutre)
Morgens trinke   ich       Kaffee.      // Le matin, je bois du café. (temps en avant)
Kaffee  trinke   ich       morgens.     // Du café, j'en bois le matin. (objet en avant)</pre>
<p>Dans les trois cas, <strong>trinke</strong> est en position 2 ; seule change ce qu'on place en position 1.</p>
<h3>4. Les questions et les impératifs (aperçu)</h3>
<p>La règle V2 concerne les phrases déclaratives. Deux exceptions utiles à connaître :</p>
<pre class="pseudo">Question fermée (oui/non) : verbe en position 1     Spielst du Tennis?  (Joues-tu au tennis ?)
Question ouverte (W-Frage) : mot en W + verbe en 2   Wo wohnst du?       (Où habites-tu ?)</pre>
<div class="tip">Retiens : phrase normale → verbe en 2 ; question oui/non → verbe en 1 ; question en wo/was/wie… → le mot interrogatif prend la position 1 et le verbe reste en 2 (jour 14).</div>
<h3>5. Et le second verbe ?</h3>
<p>Quand une phrase a un deuxième verbe (à l'infinitif, avec un verbe comme « können » = pouvoir), ce second verbe part <strong>à la fin</strong> de la phrase. On approfondira plus tard, mais garde l'image : le verbe conjugué en 2, l'autre tout au bout.</p>
<pre class="pseudo">Ich kann       heute    Tennis    spielen.   // Je peux jouer au tennis aujourd'hui.
   (VERBE 2)                       (verbe fin)</pre>`,
  exercises: [
    { type: "qcm", q: "Dans une phrase déclarative allemande, le verbe conjugué est en position…", opts: ["2", "1", "3", "dernière"], a: 0, exp: "Règle V2 : le verbe conjugué occupe toujours la 2e position." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Heute spiele ich Tennis.", "Heute ich spiele Tennis.", "Heute Tennis ich spiele.", "Ich heute spiele Tennis."], a: 0, exp: "Après « Heute » (pos 1), le verbe reste en pos 2 : spiele ich." },
    { type: "qcm", q: "« Position 2 » signifie…", opts: ["le deuxième élément de la phrase", "le deuxième mot exactement", "le milieu de la phrase", "la fin"], a: 0, exp: "Un groupe de mots compte pour un seul élément." },
    { type: "qcm", q: "Quand on commence par un complément, le sujet se place…", opts: ["juste après le verbe", "en première position", "à la fin", "il disparaît"], a: 0, exp: "Inversion : pos1 = complément, pos2 = verbe, puis le sujet." },
    { type: "qcm", q: "Pour une question fermée (oui/non), le verbe se met en position…", opts: ["1", "2", "3", "dernière"], a: 0, exp: "Spielst du Tennis? : verbe en tête." },
    { type: "qcm", q: "Où va un second verbe à l'infinitif (Ich kann … spielen) ?", opts: ["à la fin de la phrase", "en position 1", "juste après le sujet", "il n'y en a jamais"], a: 0, exp: "Le verbe conjugué en 2, l'infinitif rejeté à la fin." },
    { type: "vf", q: "En allemand, on peut dire « Morgens ich trinke Kaffee ».", a: false, exp: "Faux : il faut « Morgens trinke ich Kaffee » (verbe en 2)." },
    { type: "vf", q: "Le verbe conjugué garde la position 2 même si on met un complément en avant.", a: true, exp: "C'est tout le principe de la règle V2." },
    { type: "vf", q: "Dans « Wo wohnst du? », le verbe est en 2e position après le mot interrogatif.", a: true, exp: "Wo (pos1) + wohnst (pos2) + du." },
    { type: "input", q: "Remets dans l'ordre (déclaratif) : « ich / in Berlin / wohne ». Commence par Ich.", a: ["ich wohne in berlin"], ph: "une phrase", exp: "Ich wohne in Berlin (verbe en 2)." },
    { type: "input", q: "Complète : Heute ___ ich Tennis. (spielen)", a: ["spiele"], ph: "un verbe", exp: "Heute spiele ich Tennis : le verbe reste en 2." },
    { type: "input", q: "Complète : Morgens ___ ich Kaffee. (trinken)", a: ["trinke"], ph: "un verbe", exp: "Morgens trinke ich Kaffee." },
    { type: "input", q: "Mets « In Paris » en tête : « ___ wohnt sie. » (le verbe manque, wohnen)", a: ["wohnt"], ph: "un verbe", exp: "In Paris wohnt sie (verbe en 2, sujet après)." },
    { type: "input", q: "Question fermée : mets le verbe en tête. « ___ du Deutsch? » (sprechen)", a: ["sprichst"], ph: "un verbe", exp: "Sprichst du Deutsch? (verbe en position 1)." },
    { type: "input", q: "Complète : Wo ___ du? (« où habites-tu ? », wohnen)", a: ["wohnst"], ph: "un verbe", exp: "Wo wohnst du? (verbe en 2 après le mot en W)." }
  ],
  final: {
    title: "Exercice final — Ranger la phrase",
    intro: `<p>Un petit texte où l'ordre des mots varie, puis des phrases à construire. Le verbe conjugué reste toujours en 2e position (sauf question fermée).</p>
<pre class="pseudo">Anna wohnt in Köln. Am Montag spielt sie Tennis.    // Anna habite à Cologne. Le lundi, elle joue au tennis.
Kaffee trinkt sie gern.                              // Le café, elle en boit volontiers.</pre>`,
    questions: [
      { type: "qcm", q: "Dans « Am Montag spielt sie Tennis », pourquoi « spielt » avant « sie » ?", opts: ["Le complément « Am Montag » est en pos 1, donc le verbe reste en pos 2 et le sujet recule", "C'est une question", "sie est un objet", "faute d'allemand"], a: 0, exp: "Inversion après un complément placé en tête." },
      { type: "qcm", q: "Quelle phrase respecte la règle V2 ?", opts: ["Kaffee trinkt sie gern.", "Kaffee sie trinkt gern.", "Sie Kaffee trinkt gern.", "Trinkt Kaffee sie gern."], a: 0, exp: "Objet en pos1, verbe en pos2 : Kaffee trinkt sie gern." },
      { type: "input", q: "Ordre neutre : « ___ wohnt in Köln. » (sujet Anna)", a: ["anna"], ph: "un mot", exp: "Anna wohnt in Köln (sujet en 1, verbe en 2)." },
      { type: "input", q: "Mets « Heute » en tête : « Heute ___ ich Deutsch. » (lernen)", a: ["lerne"], ph: "un verbe", exp: "Heute lerne ich Deutsch." },
      { type: "qcm", q: "Comment poser « Habites-tu à Berlin ? » (question fermée) ?", opts: ["Wohnst du in Berlin?", "Du wohnst in Berlin?", "In Berlin du wohnst?", "Wohnst in Berlin du?"], a: 0, exp: "Question oui/non : verbe en position 1." }
    ],
    solution: `<p>La règle <strong>V2</strong> est le pilier de la syntaxe allemande : dans une phrase déclarative, le verbe conjugué est toujours le <strong>deuxième élément</strong>. La position 1 est libre (sujet, temps, lieu, objet…), mais dès qu'on y met autre chose que le sujet, celui-ci passe <strong>derrière le verbe</strong> : c'est l'inversion. Exceptions à retenir : question fermée → verbe en position 1 ; W-Frage → mot interrogatif en 1 et verbe en 2. Le verbe est un pivot : place ce que tu veux devant, mais ne le déplace jamais de sa case.</p>`
  }
};
