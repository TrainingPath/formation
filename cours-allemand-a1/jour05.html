<script>
var DAY = {
  num: 5,
  title: "Le verbe haben (avoir)",
  subtitle: "Conjuguer « avoir » et exprimer la possession.",
  theory: `
<h3>1. Le verbe haben</h3>
<p><strong>haben</strong> veut dire « avoir ». C'est, avec sein, le deuxième verbe essentiel. Il est presque régulier, sauf aux formes <strong>du</strong> et <strong>er/sie/es</strong>, où le « b » disparaît :</p>
<pre class="pseudo">ich   habe     // j'ai
du    hast     // tu as        (pas « habst » : le b tombe)
er    hat      // il a         (pas « habt » : le b tombe)
sie   hat      // elle a
es    hat      // il/elle a (neutre)
wir   haben    // nous avons
ihr   habt     // vous avez (pluriel familier)
sie   haben    // ils / elles ont
Sie   haben    // vous avez (politesse)</pre>
<div class="tip">Retiens le trio irrégulier : ich <strong>habe</strong>, du <strong>hast</strong>, er <strong>hat</strong>. Le pluriel est régulier : <strong>haben / habt / haben</strong>.</div>
<h3>2. Exprimer la possession</h3>
<pre class="pseudo">Ich habe ein Auto.        // J'ai une voiture.
Du hast einen Bruder.     // Tu as un frère.
Er hat einen Hund.        // Il a un chien.
Wir haben Zeit.           // Nous avons du temps.
Sie haben zwei Kinder.    // Ils ont deux enfants.</pre>
<div class="warn">Après haben, le complément est à l'<strong>accusatif</strong> (le cas de l'objet, vu en détail au jour 15). C'est pour cela qu'on écrit « einen Bruder » (masculin) et non « ein Bruder ». Pour l'instant, apprends ces expressions comme des blocs tout faits.</div>
<h3>3. Des expressions très fréquentes avec haben</h3>
<p>L'allemand utilise haben là où le français emploie parfois « être ». Ces expressions se mémorisent telles quelles :</p>
<pre class="pseudo">Ich habe Hunger.      // J'ai faim.   (litt. « j'ai faim »)
Ich habe Durst.       // J'ai soif.
Ich habe Zeit.        // J'ai le temps.
Ich habe Angst.       // J'ai peur.
Wie viele Geschwister hast du?  // Combien de frères et sœurs as-tu ?</pre>
<h3>4. haben pour dire l'âge (aperçu)</h3>
<p>Contrairement au français « avoir … ans », l'âge en allemand se dit avec <strong>sein</strong> (jour 9) : « Ich bin 20 Jahre alt » (j'ai 20 ans, litt. « je suis âgé de 20 ans »). Mais haben sert pour beaucoup d'autres choses possédées : un objet, un animal, de la famille.</p>
<h3>5. Comparaison sein / haben</h3>
<pre class="pseudo">SEIN (être) : identite, etat, qualite     Ich bin müde.  (Je suis fatigue.)
HABEN (avoir) : possession, sensations     Ich habe Hunger. (J'ai faim.)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la forme de haben avec « ich » ?", opts: ["habe", "hast", "hat", "habt"], a: 0, exp: "ich habe = j'ai." },
    { type: "qcm", q: "Quelle est la forme de haben avec « du » ?", opts: ["hast", "habst", "hat", "habt"], a: 0, exp: "du hast : le b tombe (pas « habst »)." },
    { type: "qcm", q: "Quelle est la forme de haben avec « er / sie / es » ?", opts: ["hat", "habt", "hast", "hab"], a: 0, exp: "er hat : le b tombe aussi." },
    { type: "qcm", q: "Quelle est la forme de haben avec « ihr » ?", opts: ["habt", "hast", "haben", "hat"], a: 0, exp: "ihr habt = vous avez (familier)." },
    { type: "qcm", q: "Comment dit-on « nous avons » et « ils ont » ?", opts: ["wir haben / sie haben", "wir habt / sie hat", "wir hast / sie habt", "wir hat / sie haben"], a: 0, exp: "Le pluriel est régulier : haben." },
    { type: "qcm", q: "« Ich habe Hunger » signifie…", opts: ["J'ai faim", "Je suis affamé depuis hier", "Je mange", "J'ai un chien"], a: 0, exp: "Hunger = la faim ; l'allemand dit « avoir faim »." },
    { type: "vf", q: "Aux formes du et er, le « b » de haben disparaît (hast, hat).", a: true, exp: "Vrai : du hast, er hat, sans b." },
    { type: "vf", q: "En allemand, l'âge se dit avec haben, comme en français.", a: false, exp: "Faux : l'âge se dit avec sein : « Ich bin 20 Jahre alt »." },
    { type: "vf", q: "haben sert à exprimer la possession (un objet, un animal, de la famille).", a: true, exp: "Ich habe ein Auto, einen Hund, zwei Kinder…" },
    { type: "input", q: "Complète : Ich ___ ein Auto. (« j'ai une voiture »)", a: ["habe"], ph: "un mot", exp: "Ich habe ein Auto." },
    { type: "input", q: "Complète : Du ___ einen Bruder. (« tu as un frère »)", a: ["hast"], ph: "un mot", exp: "Du hast einen Bruder." },
    { type: "input", q: "Complète : Er ___ einen Hund. (« il a un chien »)", a: ["hat"], ph: "un mot", exp: "Er hat einen Hund." },
    { type: "input", q: "Complète : Wir ___ Zeit. (« nous avons du temps »)", a: ["haben"], ph: "un mot", exp: "Wir haben Zeit." },
    { type: "input", q: "Complète : Ihr ___ Hunger. (« vous avez faim », familier)", a: ["habt"], ph: "un mot", exp: "Ihr habt Hunger." },
    { type: "input", q: "Complète l'expression : Ich habe ___ . (« j'ai soif »)", a: ["durst"], ph: "un nom", exp: "Ich habe Durst = j'ai soif (nom avec majuscule : Durst)." }
  ],
  final: {
    title: "Exercice final — Avoir ou être ?",
    intro: `<p>Choisis entre haben (possession, sensations) et sein (identité, état). Puis conjugue correctement.</p>`,
    questions: [
      { type: "qcm", q: "« J'ai un chat » : Ich ___ eine Katze.", opts: ["habe", "bin", "hast", "ist"], a: 0, exp: "Possession → haben : Ich habe eine Katze." },
      { type: "qcm", q: "« Il est fatigué » : Er ___ müde.", opts: ["ist", "hat", "habe", "bist"], a: 0, exp: "État → sein : Er ist müde." },
      { type: "input", q: "« Nous avons deux enfants » : Wir ___ zwei Kinder.", a: ["haben"], ph: "un mot", exp: "Wir haben zwei Kinder." },
      { type: "input", q: "« Tu as faim » : Du ___ Hunger.", a: ["hast"], ph: "un mot", exp: "Du hast Hunger." },
      { type: "qcm", q: "« Vous avez le temps » (politesse) : ___ Sie Zeit?", opts: ["Haben", "Habt", "Hast", "Seid"], a: 0, exp: "Sie → haben ; question = verbe en tête : Haben Sie Zeit?" }
    ],
    solution: `<p>haben se conjugue <strong>ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben</strong> ; le seul piège est la chute du « b » aux formes <strong>hast</strong> et <strong>hat</strong>. Sur le fond, garde le partage clair : <strong>sein</strong> pour ce que l'on <em>est</em> (identité, état, qualité), <strong>haben</strong> pour ce que l'on <em>a</em> (objets, famille, et les sensations « Hunger, Durst, Angst »). Attention : l'âge fait exception et se dit avec sein.</p>`
  }
};
</script>
