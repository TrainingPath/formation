  title: "Les nombres et l'âge",
  subtitle: "Compter de 0 à 100 et dire son âge avec sein.",
  theory: `
<h3>1. Les nombres de 0 à 12</h3>
<p>Ces douze premiers nombres sont à apprendre par cœur : ils ne suivent pas de règle.</p>
<pre class="pseudo">0 null    1 eins   2 zwei   3 drei
4 vier    5 fünf   6 sechs  7 sieben
8 acht    9 neun  10 zehn  11 elf   12 zwölf</pre>
<h3>2. De 13 à 19 : nombre + zehn</h3>
<p>De 13 à 19, on colle le chiffre des unités devant <strong>zehn</strong> (dix), en un seul mot :</p>
<pre class="pseudo">13 dreizehn    14 vierzehn    15 fünfzehn
16 sechzehn    17 siebzehn    18 achtzehn    19 neunzehn</pre>
<div class="warn">Deux formes se raccourcissent : <strong>sechzehn</strong> (16, sans le -s de sechs) et <strong>siebzehn</strong> (17, sans le -en de sieben). À mémoriser.</div>
<h3>3. Les dizaines</h3>
<pre class="pseudo">20 zwanzig    30 dreißig    40 vierzig
50 fünfzig    60 sechzig    70 siebzig
80 achtzig    90 neunzig   100 hundert</pre>
<p>Note l'orthographe de <strong>dreißig</strong> (30) avec un ß, et de <strong>sechzig</strong> / <strong>siebzig</strong> (raccourcis comme leurs cousins de la dizaine 10).</p>
<h3>4. De 21 à 99 : l'ordre inversé (unité + und + dizaine)</h3>
<p>Grande particularité de l'allemand : on dit d'abord l'<strong>unité</strong>, puis <strong>und</strong> (« et »), puis la <strong>dizaine</strong> — le tout en un seul mot. On lit donc « à l'envers » par rapport au français :</p>
<pre class="pseudo">21 = einundzwanzig       // litt. « un-et-vingt »
25 = fünfundzwanzig      // litt. « cinq-et-vingt »
32 = zweiunddreißig      // litt. « deux-et-trente »
99 = neunundneunzig      // litt. « neuf-et-quatre-vingt-dix »</pre>
<div class="tip">Structure : UNITÉ + und + DIZAINE, sans espace. Pour 21, « eins » perd son -s : ein<strong>und</strong>zwanzig. Entraîne-toi à haute voix, c'est le point qui demande le plus de pratique.</div>
<h3>5. Dire son âge : avec sein</h3>
<p>Contrairement au français (« avoir … ans »), l'âge en allemand s'exprime avec le verbe <strong>sein</strong> (être) :</p>
<pre class="pseudo">Wie alt bist du?           // Quel âge as-tu ? (litt. « comme âgé es-tu ? »)
Ich bin zwanzig Jahre alt. // J'ai vingt ans. (litt. « je suis vingt ans âgé »)
Ich bin zwanzig.           // J'ai vingt ans. (forme courte)
Sie ist dreißig Jahre alt. // Elle a trente ans.</pre>
<p>« Jahre alt » (« années âgé ») est souvent sous-entendu : on peut dire simplement « Ich bin 20 ».</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « 7 » en allemand ?", opts: ["sieben", "sechs", "siebien", "siebzehn"], a: 0, exp: "7 = sieben. (17 = siebzehn.)" },
    { type: "qcm", q: "Comment dit-on « 12 » ?", opts: ["zwölf", "zwei", "zwölfzehn", "zwanzig"], a: 0, exp: "12 = zwölf (avec ö)." },
    { type: "qcm", q: "Comment dit-on « 30 » ?", opts: ["dreißig", "dreizig", "dreizehn", "dreihundert"], a: 0, exp: "30 = dreißig (avec ß)." },
    { type: "qcm", q: "Comment se construit « 21 » en allemand ?", opts: ["einundzwanzig (un-et-vingt)", "zwanzigundeins", "zwanzigeins", "zweiundzehn"], a: 0, exp: "Unité + und + dizaine : einundzwanzig." },
    { type: "qcm", q: "Avec quel verbe exprime-t-on l'âge en allemand ?", opts: ["sein (être)", "haben (avoir)", "machen (faire)", "werden (devenir)"], a: 0, exp: "« Ich bin 20 Jahre alt » : on utilise sein." },
    { type: "qcm", q: "« Wie alt bist du? » veut dire…", opts: ["Quel âge as-tu ?", "Comment vas-tu ?", "Comment t'appelles-tu ?", "Où habites-tu ?"], a: 0, exp: "wie alt = quel âge (litt. « comme âgé »)." },
    { type: "vf", q: "En allemand, pour les nombres de 21 à 99, on dit l'unité avant la dizaine.", a: true, exp: "einundzwanzig = « un-et-vingt » : l'unité d'abord." },
    { type: "vf", q: "« Ich habe 20 Jahre » est la bonne façon de dire « j'ai 20 ans ».", a: false, exp: "Faux : on dit « Ich bin 20 Jahre alt » (avec sein)." },
    { type: "vf", q: "« sechzehn » (16) et « siebzehn » (17) sont des formes raccourcies.", a: true, exp: "sechs perd son -s, sieben perd son -en." },
    { type: "input", q: "Écris « 3 » en allemand.", a: ["drei"], ph: "un mot", exp: "3 = drei." },
    { type: "input", q: "Écris « 8 » en allemand.", a: ["acht"], ph: "un mot", exp: "8 = acht." },
    { type: "input", q: "Écris « 20 » en allemand.", a: ["zwanzig"], ph: "un mot", exp: "20 = zwanzig." },
    { type: "input", q: "Écris « 25 » en un seul mot (cinq-et-vingt).", a: ["fünfundzwanzig", "fuenfundzwanzig"], ph: "un mot", exp: "25 = fünfundzwanzig." },
    { type: "input", q: "Complète : Ich ___ 30 Jahre alt. (« j'ai 30 ans »)", a: ["bin"], ph: "un mot", exp: "Ich bin 30 Jahre alt (sein)." },
    { type: "input", q: "Écris « 100 » en allemand.", a: ["hundert", "einhundert"], ph: "un mot", exp: "100 = hundert (ou einhundert)." }
  ],
  final: {
    title: "Exercice final — Âge et nombres",
    intro: `<p>Un petit texte de présentation à comprendre, puis quelques nombres à écrire.</p>
<pre class="pseudo">Ich heiße Lukas. Ich bin einundzwanzig Jahre alt.   // Je m'appelle Lukas. J'ai vingt-et-un ans.
Meine Schwester ist sechzehn.                        // Ma sœur a seize ans.</pre>`,
    questions: [
      { type: "qcm", q: "Quel âge a Lukas ?", opts: ["21 ans", "12 ans", "16 ans", "20 ans"], a: 0, exp: "einundzwanzig = 21." },
      { type: "qcm", q: "Quel âge a sa sœur ?", opts: ["16 ans", "6 ans", "60 ans", "17 ans"], a: 0, exp: "sechzehn = 16." },
      { type: "input", q: "Écris « 42 » en un seul mot (deux-et-quarante).", a: ["zweiundvierzig"], ph: "un mot", exp: "42 = zweiundvierzig." },
      { type: "input", q: "Complète la question : Wie ___ bist du? (« quel âge as-tu ? »)", a: ["alt"], ph: "un mot", exp: "Wie alt bist du?" },
      { type: "input", q: "Réponds en allemand : « J'ai 18 ans. » → Ich bin ___ .", a: ["achtzehn"], ph: "un nombre", exp: "18 = achtzehn : Ich bin achtzehn." }
    ],
    solution: `<p>Les nombres allemands demandent trois choses : mémoriser 0 à 12 (irréguliers), coller le chiffre devant <strong>zehn</strong> pour 13-19, et surtout maîtriser l'<strong>ordre inversé</strong> de 21 à 99 (unité + <em>und</em> + dizaine, en un mot : einundzwanzig). Pour l'âge, on n'utilise pas « avoir » mais <strong>sein</strong> : « Ich bin 20 Jahre alt ». Lis les nombres à voix haute : c'est l'inversion qui exige le plus d'entraînement.</p>`
  }
};
