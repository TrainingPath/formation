  title: "Le présent des verbes réguliers",
  subtitle: "La machine à conjuguer : radical + terminaisons.",
  theory: `
<h3>1. Radical et terminaison</h3>
<p>À l'infinitif (la forme du dictionnaire), presque tous les verbes allemands se terminent par <strong>-en</strong> : <em>wohnen</em> (habiter), <em>spielen</em> (jouer), <em>lernen</em> (apprendre). Pour conjuguer, on enlève le -en : ce qui reste s'appelle le <strong>radical</strong> (la partie stable du verbe). Puis on ajoute une <strong>terminaison</strong> différente pour chaque pronom.</p>
<pre class="pseudo">infinitif : wohnen         // habiter
radical   : wohn           // on enleve -en
+ terminaison selon le pronom</pre>
<h3>2. Les six terminaisons du présent</h3>
<pre class="pseudo">Pronom   Terminaison   Exemple (wohnen)   Traduction
ich      -e            ich wohne          j'habite
du       -st           du wohnst          tu habites
er/sie/es -t           er wohnt           il habite
wir      -en           wir wohnen         nous habitons
ihr      -t            ihr wohnt          vous habitez (familier)
sie/Sie  -en           sie wohnen         ils habitent / vous (poli)</pre>
<div class="tip">Repère simple : <strong>wir</strong> et <strong>sie/Sie</strong> reprennent l'infinitif (terminaison -en) ; <strong>er/sie/es</strong> et <strong>ihr</strong> partagent la terminaison -t. Seuls ich (-e) et du (-st) sont vraiment à part.</div>
<h3>3. Un deuxième exemple : spielen (jouer)</h3>
<pre class="pseudo">ich spiele    du spielst    er spielt
wir spielen   ihr spielt    sie spielen</pre>
<p>Le même moule fonctionne pour des centaines de verbes : lernen (apprendre), machen (faire), kommen (venir), hören (écouter), kaufen (acheter)…</p>
<h3>4. Petit ajustement de prononciation : le -e- d'appui</h3>
<p>Quand le radical finit par <strong>-t</strong> ou <strong>-d</strong> (arbeiten = travailler, finden = trouver), on glisse un <strong>-e-</strong> avant les terminaisons -st et -t, pour pouvoir prononcer :</p>
<pre class="pseudo">arbeiten -> radical arbeit
du arbeitest   (et non « arbeitst »)
er arbeitet    (et non « arbeitt »)
ihr arbeitet</pre>
<div class="warn">Ce -e- d'appui n'apparaît que si le radical se termine par -t ou -d (et quelques cas en -n/-m). Ailleurs, on ajoute directement la terminaison : du wohnst, er wohnt.</div>
<h3>5. Le présent allemand traduit trois présents français</h3>
<p>Une seule forme allemande couvre plusieurs nuances françaises :</p>
<pre class="pseudo">Ich spiele Fußball.
  = Je joue au foot.        (habitude)
  = Je suis en train de jouer au foot.  (action en cours)
  = Je vais jouer au foot.  (futur proche, avec un contexte)</pre>
<p>L'allemand n'a pas de forme spéciale « en train de » : le présent simple suffit.</p>`,

    { type: "qcm", q: "Quelle terminaison va avec « ich » ?", opts: ["-e", "-st", "-t", "-en"], a: 0, exp: "ich wohne : terminaison -e." },
    { type: "qcm", q: "Quelle terminaison va avec « du » ?", opts: ["-st", "-e", "-t", "-en"], a: 0, exp: "du wohnst : terminaison -st." },
    { type: "qcm", q: "Quelle terminaison va avec « er / sie / es » ?", opts: ["-t", "-st", "-e", "-en"], a: 0, exp: "er wohnt : terminaison -t." },

    { type: "vf", q: "« ihr » et « er/sie/es » partagent la même terminaison -t.", a: true, exp: "er wohnt, ihr wohnt : même terminaison -t." },
    { type: "vf", q: "L'allemand a une forme spéciale pour « être en train de », comme l'anglais -ing.", a: false, exp: "Faux : le présent simple couvre l'habitude, l'action en cours et le futur proche." },
    { type: "vf", q: "Le radical de « spielen » est « spiel ».", a: true, exp: "spielen − en = spiel." },
    { type: "input", q: "Conjugue : ich ___ (spielen).", a: ["spiele"], ph: "un verbe", exp: "ich spiele." },

    { type: "input", q: "Conjugue : wir ___ (kommen).", a: ["kommen"], ph: "un verbe", exp: "wir kommen (= infinitif)." },
    { type: "input", q: "Conjugue : ihr ___ (hören).", a: ["hört", "hoert"], ph: "un verbe", exp: "ihr hört (radical hör + t)." },
    { type: "input", q: "Conjugue avec -e- d'appui : er ___ (arbeiten).", a: ["arbeitet"], ph: "un verbe", exp: "er arbeitet (radical en -t → -e- d'appui)." }
  ],
  final: {
    title: "Exercice final — La conjugaison en action",
    intro: `<p>Un petit texte au présent, puis des verbes à conjuguer. Rappelle-toi les six terminaisons : -e, -st, -t, -en, -t, -en.</p>
<pre class="pseudo">Anna wohnt in Berlin. Sie lernt Deutsch und        // Anna habite à Berlin. Elle apprend l'allemand et
sie spielt gern Tennis. Wir kommen aus Frankreich.  // elle aime jouer au tennis. Nous venons de France.</pre>`,
    questions: [

      { type: "input", q: "Conjugue : ich ___ in Paris (wohnen).", a: ["wohne"], ph: "un verbe", exp: "ich wohne in Paris." },
      { type: "input", q: "Conjugue : du ___ Tennis (spielen).", a: ["spielst"], ph: "un verbe", exp: "du spielst Tennis." },
      { type: "input", q: "Conjugue : wir ___ Deutsch (lernen).", a: ["lernen"], ph: "un verbe", exp: "wir lernen Deutsch." },
      { type: "qcm", q: "« Ich spiele Fußball » peut se traduire par…", opts: ["Je joue / je suis en train de jouer au foot", "Uniquement « j'ai joué »", "Uniquement « je jouerai »", "Je dois jouer"], a: 0, exp: "Le présent allemand couvre l'habitude et l'action en cours." }
    ],
    solution: `<p>Conjuguer un verbe régulier, c'est deux gestes : trouver le <strong>radical</strong> (infinitif moins -en) et coller la bonne <strong>terminaison</strong> : <strong>-e / -st / -t / -en / -t / -en</strong>. Deux repères facilitent tout : wir et sie/Sie reprennent l'infinitif ; er/sie/es et ihr partagent le -t. Seul ajustement : un <strong>-e- d'appui</strong> quand le radical finit par -t ou -d (du arbeitest). Ce moule sert pour l'immense majorité des verbes allemands.</p>`
  }
