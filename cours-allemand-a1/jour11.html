var DAY = {

  title: "Les verbes forts (changement de voyelle)",
  subtitle: "Quand la voyelle du radical change aux formes du et er.",
  theory: `
<h3>1. Verbes faibles et verbes forts</h3>
<p>Au jour 10, tu as vu les verbes <strong>réguliers</strong> (dits « faibles ») : leur radical ne bouge pas. Il existe aussi des verbes <strong>forts</strong> (irréguliers) : leur <strong>voyelle</strong> change au présent, mais seulement aux personnes <strong>du</strong> et <strong>er/sie/es</strong>. Les terminaisons, elles, restent les mêmes qu'au jour 10.</p>
<h3>2. Le changement e → i(e)</h3>
<p>Beaucoup de verbes forts transforment le <strong>e</strong> du radical en <strong>i</strong> ou <strong>ie</strong> aux formes du et er :</p>
<pre class="pseudo">sprechen (parler) : e -> i
ich spreche    du sprichst   er spricht      // du/er : e -> i
wir sprechen   ihr sprecht   sie sprechen    // le reste ne change pas

lesen (lire) : e -> ie
ich lese       du liest      er liest        // du/er : e -> ie
wir lesen      ihr lest      sie lesen</pre>
<div class="tip">Le changement ne touche QUE du et er/sie/es. Toutes les autres personnes (ich, wir, ihr, sie/Sie) gardent la voyelle de l'infinitif.</div>
<h3>3. Le changement a → ä</h3>
<p>D'autres verbes forts ajoutent un <strong>Umlaut</strong> : le <strong>a</strong> devient <strong>ä</strong> aux formes du et er :</p>
<pre class="pseudo">fahren (aller en vehicule) : a -> ä
ich fahre      du fährst     er fährt        // du/er : a -> ä
wir fahren     ihr fahrt     sie fahren

schlafen (dormir) : a -> ä
ich schlafe    du schläfst   er schläft
wir schlafen   ihr schlaft   sie schlafen</pre>
<h3>4. Un verbe très fréquent : nehmen (prendre)</h3>
<pre class="pseudo">ich nehme      du nimmst     er nimmt
wir nehmen     ihr nehmt     sie nehmen</pre>
<p>Ici la transformation est plus marquée (nehmen → nimm-), mais le principe reste le même : elle ne touche que du et er.</p>
<h3>5. Un cas à part : essen, geben, sehen…</h3>
<pre class="pseudo">essen (manger) : ich esse,   du isst,   er isst
geben (donner) : ich gebe,   du gibst,  er gibt
sehen (voir)   : ich sehe,   du siehst, er sieht</pre>
<div class="warn">Ces verbes ne s'apprennent pas par déduction : il faut mémoriser lesquels changent et comment. Un bon dictionnaire signale les verbes forts et donne la forme « er » : « sprechen (spricht) ». Retiens la forme du/er en même temps que l'infinitif.</div>`,
  exercises: [
    { type: "qcm", q: "Dans un verbe fort, la voyelle change à quelles personnes ?", opts: ["du et er/sie/es", "toutes les personnes", "ich et wir", "ihr et Sie"], a: 0, exp: "Seulement du et er/sie/es." },
    { type: "qcm", q: "Conjugaison de « sprechen » avec du :", opts: ["du sprichst", "du sprechst", "du spricht", "du spreche"], a: 0, exp: "e → i : du sprichst." },
    { type: "qcm", q: "Conjugaison de « lesen » avec er :", opts: ["er liest", "er lest", "er lieset", "er lese"], a: 0, exp: "e → ie : er liest." },
    { type: "qcm", q: "Conjugaison de « fahren » avec du :", opts: ["du fährst", "du fahrst", "du fahre", "du föhrst"], a: 0, exp: "a → ä : du fährst." },
    { type: "qcm", q: "Conjugaison de « nehmen » avec er :", opts: ["er nimmt", "er nehmt", "er niemt", "er nehme"], a: 0, exp: "er nimmt (radical modifié)." },
    { type: "qcm", q: "Les terminaisons des verbes forts sont…", opts: ["les mêmes que les verbes réguliers", "toutes différentes", "inexistantes", "en -en partout"], a: 0, exp: "Seule la voyelle change ; les terminaisons -e/-st/-t/-en restent." },
    { type: "vf", q: "Avec « wir » et « ihr », la voyelle d'un verbe fort ne change pas.", a: true, exp: "wir sprechen, ihr sprecht : voyelle inchangée." },
    { type: "vf", q: "« ich spreche » subit le changement e → i.", a: false, exp: "Faux : ich garde la voyelle d'origine. Seuls du/er changent (du sprichst)." },
    { type: "vf", q: "« schlafen » fait « er schläft » (a → ä).", a: true, exp: "a → ä aux formes du et er." },
    { type: "input", q: "Conjugue : du ___ (sprechen).", a: ["sprichst"], ph: "un verbe", exp: "e → i : du sprichst." },
    { type: "input", q: "Conjugue : er ___ (lesen).", a: ["liest"], ph: "un verbe", exp: "e → ie : er liest." },
    { type: "input", q: "Conjugue : du ___ (fahren).", a: ["fährst", "faehrst"], ph: "un verbe", exp: "a → ä : du fährst." },
    { type: "input", q: "Conjugue : er ___ (essen).", a: ["isst"], ph: "un verbe", exp: "e → i : er isst." },
    { type: "input", q: "Conjugue : du ___ (nehmen).", a: ["nimmst"], ph: "un verbe", exp: "du nimmst." },
    { type: "input", q: "Conjugue avec wir (aucun changement) : wir ___ (schlafen).", a: ["schlafen"], ph: "un verbe", exp: "wir schlafen (= infinitif, voyelle inchangée)." }
  ],
  final: {
    title: "Exercice final — Verbes forts en contexte",
    intro: `<p>Un petit texte, puis des conjugaisons. Souviens-toi : la voyelle ne change qu'aux formes du et er/sie/es.</p>
<pre class="pseudo">Tom spricht Deutsch. Er liest ein Buch und           // Tom parle allemand. Il lit un livre et
er fährt heute nach Berlin. Ich nehme den Zug.        // il va à Berlin aujourd'hui. Je prends le train.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi « Er liest » et non « Er lest » ?", opts: ["lesen est un verbe fort : e → ie à la forme er", "c'est une faute", "er prend toujours -st", "lesen est régulier"], a: 0, exp: "lesen : e → ie aux formes du/er." },
      { type: "input", q: "Conjugue : du ___ Deutsch (sprechen).", a: ["sprichst"], ph: "un verbe", exp: "du sprichst Deutsch." },
      { type: "input", q: "Conjugue : er ___ nach Berlin (fahren).", a: ["fährt", "faehrt"], ph: "un verbe", exp: "a → ä : er fährt." },
      { type: "input", q: "Conjugue : ich ___ ein Buch (lesen).", a: ["lese"], ph: "un verbe", exp: "ich lese (ich ne change pas)." },
      { type: "qcm", q: "Avec ihr, « geben » (donner) donne…", opts: ["ihr gebt", "ihr gibt", "ihr gibst", "ihr geben"], a: 0, exp: "ihr ne change pas : ihr gebt (terminaison -t sur le radical d'origine)." }
    ],
    solution: `<p>Les verbes forts obéissent à une règle nette : la <strong>voyelle du radical change uniquement aux formes du et er/sie/es</strong> ; partout ailleurs (ich, wir, ihr, sie/Sie), on garde la voyelle de l'infinitif, et les terminaisons sont celles des verbes réguliers. Trois familles de changements dominent : <strong>e → i</strong> (sprechen → spricht), <strong>e → ie</strong> (lesen → liest) et <strong>a → ä</strong> (fahren → fährt). Comme c'est imprévisible, on apprend la forme « er » en même temps que l'infinitif.</p>`
  }
};
