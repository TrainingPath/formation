  theory: `
<h3>1. Les jours de la semaine</h3>
<p>Tous les jours sont <strong>masculins</strong> (der) et s'écrivent avec une majuscule (comme tous les noms allemands).</p>
<pre class="pseudo">Montag     → lundi        Freitag    → vendredi
Dienstag   → mardi        Samstag    → samedi
Mittwoch   → mercredi     Sonntag    → dimanche
Donnerstag → jeudi</pre>
<p>Pour dire « le lundi », on emploie <strong>am</strong> : <strong>am Montag</strong> (lundi / le lundi).</p>
<pre class="pseudo">Am Montag arbeite ich.   → Le lundi, je travaille.
Am Sonntag schlafe ich.  → Le dimanche, je dors.</pre>
<h3>2. Les mois</h3>
<p>Tous les mois sont <strong>masculins</strong> (der). Pour « en janvier », on utilise <strong>im</strong> : im Januar.</p>
<pre class="pseudo">Januar   Februar   März      April
Mai      Juni      Juli      August
September   Oktober   November   Dezember</pre>
<pre class="pseudo">Im Januar ist es kalt.   → En janvier, il fait froid.
Im Juli fahre ich weg.   → En juillet, je pars.</pre>
<div class="tip">Récapitule les prépositions de temps : <strong>am</strong> + jour (am Montag), <strong>im</strong> + mois (im Mai), <strong>um</strong> + heure (um acht Uhr).</div>
<h3>3. La date : les nombres ordinaux</h3>
<p>Pour la date, on utilise les <strong>ordinaux</strong> (premier, deuxième...). Jusqu'à 19, on ajoute <strong>-te</strong> ; à partir de 20, on ajoute <strong>-ste</strong>.</p>
<pre class="pseudo">1er  → der erste   (irrégulier !)     6e  → der sechste
2e   → der zweite                     7e  → der siebte  (irrégulier !)
3e   → der dritte  (irrégulier !)     8e  → der achte
4e   → der vierte                     20e → der zwanzigste
5e   → der fünfte                     21e → der einundzwanzigste</pre>
<div class="warn">Trois ordinaux irréguliers à mémoriser : <strong>erste</strong> (1er), <strong>dritte</strong> (3e), <strong>siebte</strong> (7e). Les autres suivent la règle -te / -ste.</div>
<h3>4. Dire et écrire la date</h3>
<pre class="pseudo">Welcher Tag ist heute?          → Quel jour sommes-nous ?
Heute ist der erste Mai.         → Aujourd'hui, c'est le premier mai.
Heute ist Montag, der 3. Mai.    → Aujourd'hui, lundi 3 mai.</pre>
<p>Le chiffre de la date s'écrit avec un <strong>point</strong> (der 3. = der dritte). Pour « le 3 mai » (situer un événement), on dit <strong>am dritten Mai</strong> (avec -n).</p>
<pre class="pseudo">Am ersten Mai ist ein Feiertag. → Le premier mai est un jour férié.
Ich habe am zwanzigsten Juni Geburtstag. → J'ai mon anniversaire le 20 juin.</pre>`,

    solution: `<p>Les repères de calendrier du texte :</p>
<pre class="pseudo">Montag              → jour (masculin)

im April            → im + mois
