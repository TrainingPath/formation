var DAY = {

  title: "L'heure et les moments de la journée",
  subtitle: "Wie spät ist es? — dire l'heure et situer dans la journée.",
  theory: `
<h3>1. Demander et donner l'heure</h3>
<p>Pour demander l'heure : <strong>Wie spät ist es?</strong> ou <strong>Wie viel Uhr ist es?</strong> (« Quelle heure est-il ? »). Pour répondre, on commence par <strong>Es ist...</strong> (« Il est... »).</p>
<pre class="pseudo">Es ist eins.        → Il est une heure.   (ou : Es ist ein Uhr)
Es ist zwei Uhr.    → Il est deux heures.
Es ist zehn Uhr.    → Il est dix heures.</pre>
<h3>2. Les minutes : nach et vor</h3>
<p>Deux petits mots suffisent pour l'heure courante : <strong>nach</strong> (« après ») et <strong>vor</strong> (« avant »).</p>
<pre class="pseudo">Es ist zehn nach drei.   → Il est trois heures dix.  (10 après 3)
Es ist Viertel nach vier.→ Il est quatre heures et quart.  (Viertel = quart)
Es ist zwanzig vor sechs.→ Il est six heures moins vingt. (20 avant 6)
Es ist Viertel vor acht. → Il est huit heures moins le quart.</pre>
<h3>3. La demie : halb (attention, piège !)</h3>
<p>Pour la demi-heure, l'allemand dit <strong>halb</strong> + l'heure <em>suivante</em>. C'est le grand piège pour un francophone !</p>
<pre class="pseudo">halb drei  → deux heures et demie (2h30) — littéralement « à moitié vers trois »
halb sieben→ six heures et demie (6h30)
halb eins  → midi et demi / minuit et demi (12h30)</pre>
<div class="warn">Piège classique : <strong>halb drei</strong> ne veut PAS dire « trois heures et demie » mais « <strong>deux</strong> heures et demie ». halb annonce qu'on est à mi-chemin VERS l'heure nommée. Retiens : halb X = (X moins une demi-heure).</div>
<h3>4. Les moments de la journée</h3>
<pre class="pseudo">der Morgen    → le matin        am Morgen     → le matin
der Vormittag → la matinée      am Vormittag  → dans la matinée
der Mittag    → midi            am Mittag     → à midi
der Nachmittag→ l'après-midi    am Nachmittag → l'après-midi
der Abend     → le soir         am Abend      → le soir
die Nacht     → la nuit         in der Nacht  → la nuit</pre>
<div class="tip">On dit <strong>am</strong> + moment de la journée (am Morgen, am Abend), mais <strong>in der Nacht</strong> pour la nuit (exception). « Um » sert pour une heure précise : um acht Uhr = à huit heures.</div>
<h3>5. Situer un événement</h3>
<pre class="pseudo">Ich stehe um sieben Uhr auf.   → Je me lève à sept heures.
Am Abend sehe ich fern.        → Le soir, je regarde la télé.
Um halb neun frühstücke ich.   → À huit heures et demie, je prends le petit-déjeuner.</pre>`,
  exercises: [
    { type: "input", q: "Complète la question : « Wie ___ ist es? » (Quelle heure est-il ?)", a: ["spät", "spaet"], ph: "mot", exp: "Wie spät ist es ? = Quelle heure est-il ?" },
    { type: "input", q: "Traduis le début de « Il est... » : « ___ ist zwei Uhr. »", a: ["es"], ph: "mot", exp: "Es ist zwei Uhr = Il est deux heures." },
    { type: "qcm", q: "Que signifie « Es ist zehn nach drei » ?", opts: ["3h10", "2h50", "10h03", "3h30"], a: 0, exp: "nach = après : dix après trois = 3h10." },
    { type: "qcm", q: "Que signifie « Viertel vor acht » ?", opts: ["8h15", "7h45 (huit heures moins le quart)", "8h30", "7h15"], a: 1, exp: "Viertel vor acht = un quart avant huit = 7h45." },
    { type: "qcm", q: "PIÈGE : que signifie « halb sieben » ?", opts: ["7h30", "6h30", "7h00", "5h30"], a: 1, exp: "halb sieben = à moitié vers 7 = 6h30 (six heures et demie)." },
    { type: "qcm", q: "Comment dit-on « 2h30 » en allemand ?", opts: ["halb zwei", "halb drei", "zwei halb", "Viertel zwei"], a: 1, exp: "halb drei = mi-chemin vers trois = 2h30." },
    { type: "input", q: "Complète : « ___ Morgen frühstücke ich. » (le matin, je prends le petit-déj — préposition)", a: ["am"], ph: "préposition", exp: "am Morgen = le matin." },
    { type: "qcm", q: "Comment dit-on « la nuit » (moment) ?", opts: ["am Nacht", "in der Nacht", "um Nacht", "an Nacht"], a: 1, exp: "Exception : in der Nacht (et non am Nacht)." },
    { type: "input", q: "Complète : « Ich stehe ___ sieben Uhr auf. » (à sept heures — préposition d'heure précise)", a: ["um"], ph: "préposition", exp: "um + heure = à... heures : um sieben Uhr." },
    { type: "qcm", q: "Que veut dire « am Nachmittag » ?", opts: ["le matin", "à midi", "l'après-midi", "le soir"], a: 2, exp: "der Nachmittag = l'après-midi." },
    { type: "vf", q: "« halb drei » signifie 2h30, pas 3h30.", a: true, exp: "halb annonce la mi-chemin vers l'heure nommée : halb drei = 2h30." },
    { type: "vf", q: "« vor » veut dire « avant » et « nach » veut dire « après ».", a: true, exp: "zehn vor drei = 2h50 ; zehn nach drei = 3h10." },
    { type: "vf", q: "On dit « am Nacht » pour « la nuit ».", a: false, exp: "FAUX : c'est in der Nacht (exception à retenir)." },
    { type: "input", q: "Traduis « Viertel » (dans Viertel nach vier) :", a: ["quart", "un quart", "le quart"], ph: "en français", exp: "Viertel = quart : Viertel nach vier = 4h15." },
    { type: "qcm", q: "« Um halb neun » correspond à :", opts: ["9h30", "8h30", "9h00", "8h00"], a: 1, exp: "halb neun = mi-chemin vers 9 = 8h30." }
  ],
  final: {
    title: "Exercice final — La journée d'Anna",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Anna steht um halb sieben auf.
Am Vormittag arbeitet sie. Um Viertel nach eins isst sie zu Mittag.
Am Abend, um acht Uhr, sieht sie fern.</pre>
<p><em>Traduction : Anna se lève à six heures et demie. La matinée, elle travaille. À une heure et quart, elle déjeune. Le soir, à huit heures, elle regarde la télé.</em></p>`,
    questions: [
      { type: "qcm", q: "À quelle heure Anna se lève-t-elle (halb sieben) ?", opts: ["7h30", "6h30", "7h00", "6h00"], a: 1, exp: "halb sieben = 6h30 (mi-chemin vers 7)." },
      { type: "qcm", q: "« Um Viertel nach eins » signifie :", opts: ["1h15", "12h45", "1h45", "13h30"], a: 0, exp: "Viertel nach eins = une heure et quart = 1h15." },
      { type: "input", q: "Quelle préposition situe le soir dans « ___ Abend » ?", a: ["am"], ph: "préposition", exp: "am Abend = le soir." },
      { type: "qcm", q: "« Am Vormittag » veut dire :", opts: ["l'après-midi", "dans la matinée", "à midi", "la nuit"], a: 1, exp: "der Vormittag = la matinée (avant midi)." },
      { type: "input", q: "Traduis « à huit heures » (comme dans le texte) : « um ___ Uhr »", a: ["acht"], ph: "en allemand", exp: "um acht Uhr = à huit heures." }
    ],
    solution: `<p>Les indications de temps du texte :</p>
<pre class="pseudo">halb sieben     → 6h30      (halb = mi-chemin vers 7)
Viertel nach eins→ 1h15     (un quart après une heure)
am Vormittag    → la matinée
am Abend        → le soir
um acht Uhr     → à 8h précises</pre>
<p>Deux réflexes essentiels : <strong>halb X = X moins 30 min</strong> (halb sieben = 6h30) et on emploie <strong>um</strong> pour une heure précise, <strong>am</strong> pour un moment de la journée (sauf in der Nacht).</p>`
  }
};
