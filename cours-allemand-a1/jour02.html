<script>
var DAY = {
  num: 2,
  title: "Se présenter : ich heiße, ich bin",
  subtitle: "Dire son nom, saluer et poser les premières questions.",
  theory: `
<h3>1. Dire son nom</h3>
<p>Pour se présenter, l'allemand a deux formules très courantes. La première utilise le verbe <strong>heißen</strong> (« s'appeler ») :</p>
<pre class="pseudo">Ich heiße Anna.        // Je m'appelle Anna.   (« ich HAÏ-sse »)
Wie heißt du?          // Comment t'appelles-tu ?
Ich heiße Thomas.      // Je m'appelle Thomas.</pre>
<p>La seconde utilise <strong>sein</strong> (« être », que nous étudierons en détail au jour 4). Ici on retient juste <strong>ich bin</strong> (« je suis ») :</p>
<pre class="pseudo">Ich bin Anna.          // Je suis Anna.
Ich bin Lehrer.        // Je suis professeur.
Ich bin aus Frankreich.// Je viens de France (litt. « je suis de France »).</pre>
<div class="tip">« heiße » contient un ß : sans clavier allemand, écris « heisse ». Les deux orthographes sont acceptées.</div>
<h3>2. Saluer et prendre congé</h3>
<pre class="pseudo">Hallo!            // Salut !  (à toute heure)
Guten Morgen!     // Bonjour ! (le matin)
Guten Tag!        // Bonjour ! (la journée)
Guten Abend!      // Bonsoir !
Auf Wiedersehen!  // Au revoir ! (formel)
Tschüss!          // Salut ! (informel, en partant)</pre>
<h3>3. Demander et dire comment ça va</h3>
<pre class="pseudo">Wie geht es dir?     // Comment vas-tu ?   (informel)
Wie geht es Ihnen?   // Comment allez-vous ? (poli)
Mir geht es gut.     // Je vais bien.
Danke, gut. Und dir? // Merci, bien. Et toi ?</pre>
<h3>4. Tu ou vous : du / Sie</h3>
<p>L'allemand distingue le tutoiement et le vouvoiement, comme le français :</p>
<pre class="pseudo">du   ->  « tu »  (famille, amis, enfants)
Sie  ->  « vous » de politesse (inconnus, contexte formel)</pre>
<div class="warn">Le <strong>Sie</strong> de politesse s'écrit <strong>toujours avec une majuscule</strong>, même au milieu de la phrase. Ne le confonds pas avec « sie » (elle / ils-elles), écrit en minuscule. La majuscule change le sens !</div>
<h3>5. D'où viens-tu ?</h3>
<pre class="pseudo">Woher kommst du?          // D'où viens-tu ?
Ich komme aus Belgien.    // Je viens de Belgique.
Ich komme aus der Schweiz.// Je viens de Suisse.
Wo wohnst du?             // Où habites-tu ?
Ich wohne in Berlin.      // J'habite à Berlin.</pre>
<p>Une mini-présentation complète ressemble à ceci :</p>
<pre class="pseudo">Hallo! Ich heiße Julia. Ich komme aus Frankreich    // Salut ! Je m'appelle Julia. Je viens de France
und ich wohne in Köln. Wie heißt du?                // et j'habite à Cologne. Comment t'appelles-tu ?</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « Je m'appelle Anna » ?", opts: ["Ich heiße Anna.", "Ich bin heiße Anna.", "Ich Anna heiße.", "Anna ich heiße."], a: 0, exp: "Ich heiße + prénom. Le verbe est en 2e position." },
    { type: "qcm", q: "Que signifie « Wie heißt du? »", opts: ["Comment t'appelles-tu ?", "D'où viens-tu ?", "Comment vas-tu ?", "Où habites-tu ?"], a: 0, exp: "Wie = comment ; heißt du = t'appelles-tu." },
    { type: "qcm", q: "Comment prend-on congé de façon informelle ?", opts: ["Tschüss!", "Guten Morgen!", "Hallo!", "Wie geht es dir?"], a: 0, exp: "Tschüss = salut (en partant). Auf Wiedersehen est le « au revoir » formel." },
    { type: "qcm", q: "Le « vous » de politesse allemand s'écrit…", opts: ["Sie (avec majuscule)", "sie (minuscule)", "du", "Ihr"], a: 0, exp: "Le Sie de politesse garde toujours sa majuscule." },
    { type: "qcm", q: "Que répond-on à « Wie geht es dir? »", opts: ["Mir geht es gut, danke.", "Ich heiße Paul.", "Auf Wiedersehen!", "Ich komme aus Berlin."], a: 0, exp: "« Mir geht es gut » = je vais bien." },
    { type: "qcm", q: "« Woher kommst du? » veut dire…", opts: ["D'où viens-tu ?", "Comment t'appelles-tu ?", "Quel âge as-tu ?", "Où habites-tu ?"], a: 0, exp: "woher = d'où ; kommst du = viens-tu." },
    { type: "vf", q: "« Ich bin Anna » et « Ich heiße Anna » veulent dire à peu près la même chose.", a: true, exp: "Les deux se présentent : « Je suis Anna » / « Je m'appelle Anna »." },
    { type: "vf", q: "« Guten Morgen » se dit le soir.", a: false, exp: "Faux : Guten Morgen = le matin. Le soir, on dit Guten Abend." },
    { type: "vf", q: "Dans « heiße », le ß se prononce comme un « s » dur.", a: true, exp: "ß = son [s] : « HAÏ-sse »." },
    { type: "input", q: "Complète : Ich ___ Thomas. (« je m'appelle »)", a: ["heiße", "heisse"], ph: "un verbe", exp: "Ich heiße Thomas. (variante : heisse)." },
    { type: "input", q: "Complète : Ich ___ Anna. (« je suis », verbe être)", a: ["bin"], ph: "un mot", exp: "Ich bin Anna : bin = suis." },
    { type: "input", q: "Complète : Ich komme ___ Belgien. (« je viens de… »)", a: ["aus"], ph: "un mot", exp: "aus = de (provenance) : Ich komme aus Belgien." },
    { type: "input", q: "Complète : Ich ___ in Berlin. (« j'habite »)", a: ["wohne"], ph: "un verbe", exp: "wohnen = habiter : Ich wohne in Berlin." },
    { type: "input", q: "Écris la question « Comment t'appelles-tu ? » en allemand (3 mots).", a: ["wie heißt du", "wie heisst du"], ph: "trois mots", exp: "Wie heißt du?" },
    { type: "input", q: "Écris la salutation allemande pour le matin (2 mots).", a: ["guten morgen"], ph: "deux mots", exp: "Guten Morgen! = Bonjour (le matin)." }
  ],
  final: {
    title: "Exercice final — Une rencontre",
    intro: `<p>Julia rencontre quelqu'un. Complète et comprends le dialogue. Rappel : le verbe est en 2e position, et le Sie de politesse prend une majuscule.</p>`,
    questions: [
      { type: "qcm", q: "Julia dit : « Hallo! Ich ___ Julia. » Quel mot manque ?", opts: ["heiße", "kommt", "geht", "bist"], a: 0, exp: "Ich heiße Julia : elle donne son nom." },
      { type: "qcm", q: "Elle demande poliment « Comment allez-vous ? ». Que dit-elle ?", opts: ["Wie geht es Ihnen?", "Wie geht es dir?", "Woher kommst du?", "Wie heißt du?"], a: 0, exp: "Forme polie : Wie geht es Ihnen? (Ihnen avec majuscule)." },
      { type: "qcm", q: "L'autre répond « Ich komme aus der Schweiz. » Cela signifie…", opts: ["Je viens de Suisse.", "J'habite en Suisse.", "Je suis suisse depuis 2010.", "Je vais en Suisse."], a: 0, exp: "kommen aus = venir de : de Suisse." },
      { type: "vf", q: "Pour se quitter, Julia peut dire « Auf Wiedersehen! ».", a: true, exp: "Auf Wiedersehen = au revoir (formel). Informel : Tschüss." },
      { type: "input", q: "Complète : « Ich ___ in Köln. » (« j'habite à Cologne »)", a: ["wohne"], ph: "un verbe", exp: "Ich wohne in Köln." }
    ],
    solution: `<p>Une présentation minimale tient en trois briques : <strong>le nom</strong> (Ich heiße… / Ich bin…), <strong>l'origine</strong> (Ich komme aus…) et <strong>le lieu de vie</strong> (Ich wohne in…). Ajoute une salutation adaptée à l'heure et le choix du bon niveau de langue (du pour les proches, Sie de politesse pour les inconnus), et tu peux déjà tenir une petite conversation d'accueil.</p>`
  }
};
</script>
