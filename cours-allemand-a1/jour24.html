<script>
var DAY = {
  num: 24,
  title: "Le cas datif (Dativ)",
  subtitle: "À qui ? — le complément d'objet indirect en allemand.",
  theory: `
<h3>1. Qu'est-ce que le datif ?</h3>
<p>Tu connais déjà le <strong>nominatif</strong> (le sujet, jour 6) et l'<strong>accusatif</strong> (le complément d'objet direct, jour 15). Le <strong>datif</strong> est le cas du <strong>complément d'objet indirect</strong> : il répond à la question <strong>à qui ? / à quoi ?</strong></p>
<pre class="pseudo">Ich gebe dem Kind einen Apfel.
         |         |
         À QUI ?    QUOI ?
         datif      accusatif
→ Je donne une pomme à l'enfant.</pre>
<h3>2. Les articles définis au datif</h3>
<p>Au datif, les articles changent. Retiens surtout : masculin et neutre → <strong>dem</strong>, féminin → <strong>der</strong>, pluriel → <strong>den</strong> (+ -n au nom).</p>
<pre class="pseudo">              nominatif   accusatif   DATIF
masculin      der         den         dem
féminin       die         die         der
neutre        das         das         dem
pluriel       die         die         den (+ -n)</pre>
<pre class="pseudo">der Mann  → dem Mann     (à l'homme)
die Frau  → der Frau     (à la femme)
das Kind  → dem Kind     (à l'enfant)
die Kinder→ den Kindern  (aux enfants, + -n)</pre>
<h3>3. Les articles indéfinis et possessifs au datif</h3>
<pre class="pseudo">ein/kein/mein → einem / keinem / meinem  (masc. et neutre)
              → einer / keiner / meiner  (féminin)
Ich gebe meinem Bruder ein Buch.  → Je donne un livre à mon frère.
Ich helfe meiner Mutter.           → J'aide ma mère.</pre>
<h3>4. Les verbes qui demandent le datif</h3>
<p>Certains verbes très courants imposent le datif à leur complément. À mémoriser :</p>
<pre class="pseudo">helfen  → aider       Ich helfe dem Mann.       → J'aide l'homme.
danken  → remercier   Ich danke der Frau.       → Je remercie la femme.
geben   → donner      Ich gebe dem Kind...      → Je donne à l'enfant...
gehören → appartenir  Das Buch gehört mir.      → Le livre m'appartient.
gefallen→ plaire      Das Bild gefällt mir.     → Le tableau me plaît.</pre>
<div class="warn">Attention : en français, « aider quelqu'un » est direct, mais en allemand <strong>helfen</strong> demande le DATIF : « ich helfe dem Mann » (et non den Mann). Ces verbes sont à apprendre par coeur.</div>
<h3>5. Les pronoms personnels au datif</h3>
<pre class="pseudo">ich → mir     (à moi)      wir → uns    (à nous)
du  → dir     (à toi)      ihr → euch   (à vous)
er  → ihm     (à lui)      sie → ihnen  (à eux)
sie → ihr     (à elle)     Sie → Ihnen  (à vous, poli)
es  → ihm</pre>
<div class="tip">Phrases toutes faites très utiles : <strong>Wie geht es dir?</strong> (Comment vas-tu ?), <strong>Es gefällt mir.</strong> (Ça me plaît.), <strong>Kannst du mir helfen?</strong> (Peux-tu m'aider ?).</div>`,
  exercises: [
    { type: "qcm", q: "À quelle question répond le datif ?", opts: ["qui ? / quoi ?", "à qui ? / à quoi ?", "où ?", "quand ?"], a: 1, exp: "Le datif = complément indirect : à qui ? à quoi ?" },
    { type: "input", q: "Article défini masculin au datif : « Ich helfe ___ Mann. » (der Mann)", a: ["dem"], ph: "article", exp: "Masculin datif → dem : dem Mann." },
    { type: "input", q: "Article défini féminin au datif : « Ich danke ___ Frau. » (die Frau)", a: ["der"], ph: "article", exp: "Féminin datif → der : der Frau." },
    { type: "qcm", q: "Quel est l'article défini neutre au datif (das Kind) ?", opts: ["das", "dem", "der", "den"], a: 1, exp: "Neutre datif → dem : dem Kind." },
    { type: "qcm", q: "Le verbe « helfen » demande quel cas ?", opts: ["nominatif", "accusatif", "datif", "aucun"], a: 2, exp: "helfen + datif : ich helfe dem Mann." },
    { type: "input", q: "Pronom datif de ich : « Kannst du ___ helfen? » (peux-tu m'aider ?)", a: ["mir"], ph: "pronom", exp: "ich → mir (à moi)." },
    { type: "input", q: "Pronom datif de du : « Wie geht es ___? » (comment vas-tu ?)", a: ["dir"], ph: "pronom", exp: "du → dir." },
    { type: "qcm", q: "Pronom datif de er (à lui) :", opts: ["ihn", "ihm", "ihr", "sein"], a: 1, exp: "er → ihm au datif (ihn est l'accusatif)." },
    { type: "input", q: "Possessif datif masculin : « Ich gebe ___ Bruder ein Buch. » (à mon frère)", a: ["meinem"], ph: "possessif", exp: "mein + em (masc. datif) = meinem." },
    { type: "qcm", q: "« den Kindern » : pourquoi le -n final à Kinder ?", opts: ["Erreur", "Au datif pluriel, on ajoute -n au nom", "C'est un accusatif", "Kinder est masculin"], a: 1, exp: "Datif pluriel : article den + nom en -n (den Kindern)." },
    { type: "vf", q: "Le datif répond à la question « à qui ? / à quoi ? ».", a: true, exp: "C'est le cas du complément d'objet indirect." },
    { type: "vf", q: "Le verbe « danken » (remercier) demande le datif.", a: true, exp: "Ich danke der Frau : danken + datif." },
    { type: "vf", q: "Le pronom datif de « ich » est « mich ».", a: false, exp: "FAUX : mich = accusatif ; au datif, c'est mir." },
    { type: "input", q: "Complète : « Das Bild gefällt ___. » (le tableau me plaît)", a: ["mir"], ph: "pronom", exp: "gefallen + datif ; à moi = mir." },
    { type: "qcm", q: "« Ich gebe dem Kind einen Apfel » : quels cas pour « dem Kind » et « einen Apfel » ?", opts: ["accusatif / datif", "datif / accusatif", "nominatif / datif", "datif / datif"], a: 1, exp: "dem Kind = à qui (datif), einen Apfel = quoi (accusatif)." }
  ],
  final: {
    title: "Exercice final — Le cadeau d'anniversaire",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Heute hat mein Bruder Geburtstag.
Ich gebe meinem Bruder ein Buch.
Meine Mutter hilft mir, und ich danke ihr.
Das Buch gefällt ihm sehr.</pre>
<p><em>Traduction : Aujourd'hui, c'est l'anniversaire de mon frère. Je donne un livre à mon frère. Ma mère m'aide, et je la remercie. Le livre lui plaît beaucoup.</em></p>`,
    questions: [
      { type: "qcm", q: "« meinem Bruder » est à quel cas ?", opts: ["nominatif", "accusatif", "datif (à qui je donne)", "aucun"], a: 2, exp: "geben demande : à qui (datif) + quoi (accusatif). Bruder = datif → meinem." },
      { type: "input", q: "Quel pronom datif signifie « me » dans « Meine Mutter hilft ___ » ?", a: ["mir"], ph: "pronom", exp: "helfen + datif ; à moi = mir." },
      { type: "qcm", q: "« ich danke ihr » : ihr désigne :", opts: ["le frère", "la mère (à elle)", "moi", "vous"], a: 1, exp: "ihr = à elle (datif) = la mère qu'on remercie." },
      { type: "input", q: "Dans « Das Buch gefällt ihm », ihm renvoie à qui ? (le membre de la famille)", a: ["bruder", "der bruder", "le frere", "frère", "le frère", "frere"], ph: "membre", exp: "ihm = à lui (datif) = le frère : le livre lui plaît." },
      { type: "qcm", q: "Quels verbes du texte demandent le datif ?", opts: ["haben et sein", "geben, helfen, danken, gefallen", "gehen seulement", "aucun"], a: 1, exp: "Ces quatre verbes régissent le datif." }
    ],
    solution: `<p>Le datif dans le texte :</p>
<pre class="pseudo">Ich gebe meinem Bruder...  → à qui je donne (datif masc. → meinem)
Meine Mutter hilft mir     → helfen + datif (mir)
ich danke ihr              → danken + datif (ihr = à elle)
Das Buch gefällt ihm       → gefallen + datif (ihm = à lui)</pre>
<p>Trois cas maintenant en place : <strong>nominatif</strong> (sujet), <strong>accusatif</strong> (COD, quoi ?), <strong>datif</strong> (COI, à qui ?). Apprends les verbes à datif (helfen, danken, gefallen, gehören) et les pronoms mir/dir/ihm/ihr.</p>`
  }
};
</script>
