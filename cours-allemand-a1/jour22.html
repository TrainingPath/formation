<script>

  num: 22,
  title: "La famille",
  subtitle: "die Familie — parler de ses proches avec les possessifs.",
  theory: `
<h3>1. Le vocabulaire de la famille</h3>
<p>Voici les membres de la famille. Attention au <strong>genre</strong> (der / die / das) : il est indispensable pour choisir le bon article et le bon possessif.</p>
<pre class="pseudo">der Vater    → le père        die Mutter    → la mère
der Bruder   → le frère       die Schwester → la soeur
der Sohn     → le fils        die Tochter   → la fille
der Opa      → le papy        die Oma       → la mamie
der Großvater→ le grand-père  die Großmutter→ la grand-mère
der Onkel    → l'oncle        die Tante     → la tante
das Kind     → l'enfant       die Eltern    → les parents (toujours pluriel)</pre>
<h3>2. Les pluriels utiles</h3>
<pre class="pseudo">die Eltern      → les parents        die Geschwister → les frères et soeurs
die Großeltern  → les grands-parents  die Kinder      → les enfants</pre>
<div class="tip">Astuce mémoire : les mots en <strong>-er</strong> qui désignent des hommes sont souvent masculins (Vater, Bruder), et beaucoup de mots féminins de la famille finissent par -er aussi (Mutter, Schwester, Tochter) : fie-toi au sens plutôt qu'à la finale.</div>
<h3>3. Parler de sa famille avec les possessifs</h3>
<p>On combine le vocabulaire avec les possessifs du jour 16 (mein, dein, sein, ihr...). Le possessif s'accorde au <strong>genre</strong> du membre de la famille.</p>
<pre class="pseudo">mein Vater      → mon père      (masc.)
meine Mutter    → ma mère        (fém. → -e)
mein Bruder     → mon frère      (masc.)
meine Schwester → ma soeur       (fém. → -e)
meine Eltern    → mes parents    (pluriel → -e)</pre>
<h3>4. Décrire les liens : haben et sein</h3>
<pre class="pseudo">Ich habe einen Bruder.       → J'ai un frère.   (accusatif : einen)
Ich habe eine Schwester.     → J'ai une soeur.
Ich habe keine Geschwister.  → Je n'ai pas de frères et soeurs.
Mein Vater ist Arzt.         → Mon père est médecin.
Meine Oma ist alt.           → Ma mamie est âgée.</pre>
<div class="warn">Avec haben, on est à l'<strong>accusatif</strong> (jour 15) : « J'ai UN frère » = Ich habe <strong>einen</strong> Bruder (masculin → einen). « J'ai UNE soeur » = Ich habe <strong>eine</strong> Schwester (féminin inchangé).</div>
<h3>5. Poser des questions sur la famille</h3>
<pre class="pseudo">Hast du Geschwister?         → As-tu des frères et soeurs ?
Wie heißt dein Bruder?       → Comment s'appelle ton frère ?
Wie alt ist deine Mutter?    → Quel âge a ta mère ?</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « la mère » ?", opts: ["der Mutter", "die Mutter", "das Mutter", "die Vater"], a: 1, exp: "die Mutter (féminin)." },
    { type: "input", q: "Traduis « le frère » (avec l'article) : « ___ Bruder »", a: ["der"], ph: "article", exp: "der Bruder (masculin)." },
    { type: "qcm", q: "Que signifie « die Eltern » ?", opts: ["les enfants", "les parents", "les grands-parents", "les oncles"], a: 1, exp: "die Eltern = les parents (toujours au pluriel)." },
    { type: "input", q: "Complète : « ___ Schwester ist nett. » (ma soeur est gentille)", a: ["meine"], ph: "possessif", exp: "Schwester est féminin → meine." },
    { type: "input", q: "Complète : « ___ Vater ist Arzt. » (mon père est médecin)", a: ["mein"], ph: "possessif", exp: "Vater est masculin au nominatif → mein." },
    { type: "qcm", q: "Comment dit-on « la soeur » ?", opts: ["die Tochter", "die Tante", "die Schwester", "die Oma"], a: 2, exp: "die Schwester = la soeur." },
    { type: "input", q: "Accusatif avec haben : « Ich habe ___ Bruder. » (j'ai un frère — masculin)", a: ["einen"], ph: "article", exp: "haben → accusatif ; masculin → einen." },
    { type: "qcm", q: "« Ich habe eine Schwester » : pourquoi « eine » (et non einen) ?", opts: ["Schwester est masculin", "Schwester est féminin (accusatif inchangé)", "C'est une faute", "haben ne compte pas"], a: 1, exp: "Féminin : eine reste eine à l'accusatif." },
    { type: "qcm", q: "Que signifie « die Geschwister » ?", opts: ["les grands-parents", "les frères et soeurs", "les cousins", "les parents"], a: 1, exp: "die Geschwister = les frères et soeurs." },
    { type: "input", q: "Complète : « Wie heißt ___ Bruder? » (comment s'appelle ton frère ?)", a: ["dein"], ph: "possessif", exp: "Bruder masculin → dein." },
    { type: "vf", q: "« die Eltern » est toujours au pluriel.", a: true, exp: "Il n'existe pas de singulier : on dit der Vater ou die Mutter." },
    { type: "vf", q: "Le possessif s'accorde au genre du membre de la famille (mein Vater / meine Mutter).", a: true, exp: "Masculin → mein, féminin → meine." },
    { type: "vf", q: "Avec haben, on emploie le nominatif (Ich habe ein Bruder).", a: false, exp: "FAUX : haben demande l'accusatif → Ich habe einen Bruder." },
    { type: "input", q: "Traduis « la mamie » (avec l'article) : « ___ Oma »", a: ["die"], ph: "article", exp: "die Oma (féminin)." },
    { type: "qcm", q: "« Je n'ai pas de frères et soeurs » se dit :", opts: ["Ich habe keinen Geschwister.", "Ich habe keine Geschwister.", "Ich habe nicht Geschwister.", "Ich habe kein Geschwister."], a: 1, exp: "Pluriel → keine Geschwister." }
  ],
  final: {
    title: "Exercice final — La famille de Sophie",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Ich heiße Sophie. Ich habe einen Bruder und eine Schwester.
Mein Vater ist Lehrer und meine Mutter ist Ärztin.
Meine Oma wohnt bei uns. Ich liebe meine Familie.</pre>
<p><em>Traduction : Je m'appelle Sophie. J'ai un frère et une soeur. Mon père est enseignant et ma mère est médecin. Ma mamie habite chez nous. J'aime ma famille.</em></p>`,
    questions: [
      { type: "qcm", q: "Combien de frères et soeurs a Sophie ?", opts: ["Un frère seulement", "Un frère et une soeur", "Deux soeurs", "Aucun"], a: 1, exp: "einen Bruder und eine Schwester." },
      { type: "input", q: "Pourquoi dit-on « einen Bruder » ? (donne le cas)", a: ["accusatif", "l accusatif", "acc", "l'accusatif"], ph: "le cas", exp: "haben demande l'accusatif ; Bruder masculin → einen." },
      { type: "qcm", q: "« Meine Mutter » : pourquoi -e à mein ?", opts: ["Mutter est masculin", "Mutter est féminin", "C'est un pluriel", "Erreur"], a: 1, exp: "Féminin → meine." },
      { type: "input", q: "Comment dit Sophie « ma mamie » ? « ___ Oma »", a: ["meine"], ph: "possessif", exp: "Oma féminin → meine Oma." },
      { type: "qcm", q: "« Ich liebe meine Familie » : quel cas pour Familie ?", opts: ["Nominatif", "Accusatif (COD de lieben)", "Datif", "Aucun"], a: 1, exp: "Familie est le COD → accusatif (féminin, inchangé)." }
    ],
    solution: `<p>Points clés du texte :</p>
<pre class="pseudo">Ich habe einen Bruder    → haben + accusatif, masc. → einen
Ich habe eine Schwester  → fém. → eine (inchangé)
Mein Vater               → masc. → mein
meine Mutter / meine Oma → fém. → meine
meine Familie (COD)      → accusatif fém. → meine</pre>
<p>Deux réflexes : choisir le possessif selon le genre du proche (mein/meine), et penser à l'accusatif après haben ou lieben (einen au masculin).</p>`
  }
};
