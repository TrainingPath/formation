<script>
var DAY = {
  num: 27,
  title: "Faire des courses, les prix",
  subtitle: "Einkaufen — demander, acheter, payer et comprendre les prix.",
  theory: `
<h3>1. Le vocabulaire des achats</h3>
<pre class="pseudo">der Supermarkt → le supermarché   der Markt   → le marché
das Geschäft   → le magasin        die Kasse   → la caisse
das Geld       → l'argent          der Preis   → le prix
kaufen         → acheter           kosten      → coûter
bezahlen       → payer             brauchen    → avoir besoin de</pre>
<h3>2. Demander le prix</h3>
<p>La question clé est <strong>Was kostet...?</strong> (« Combien coûte...? ») ou <strong>Wie viel kostet...?</strong></p>
<pre class="pseudo">Was kostet das?          → Combien ça coûte ?
Was kostet der Apfel?    → Combien coûte la pomme ?
Wie viel kostet das Brot?→ Combien coûte le pain ?
Das kostet drei Euro.    → Ça coûte trois euros.</pre>
<h3>3. Lire et dire les prix</h3>
<p>La monnaie est l'<strong>Euro</strong> (masculin, invariable au pluriel : zwei Euro) et le <strong>Cent</strong>. Un prix comme 3,50 € se dit souvent simplement <strong>drei Euro fünfzig</strong>.</p>
<pre class="pseudo">1,00 € → ein Euro
2,50 € → zwei Euro fünfzig
0,99 € → neunundneunzig Cent
10,00 € → zehn Euro</pre>
<div class="warn">Attention : en allemand, on écrit la virgule et non le point pour les décimales : <strong>3,50 €</strong> (pas 3.50). Et Euro reste invariable : « zwei <strong>Euro</strong> » (jamais « zwei Euros »).</div>
<h3>4. Les dialogues typiques du magasin</h3>
<pre class="pseudo">Kann ich Ihnen helfen?     → Puis-je vous aider ?  (le vendeur)
Ich möchte ein Kilo Äpfel. → Je voudrais un kilo de pommes.
Ich brauche noch Brot.     → J'ai encore besoin de pain.
Sonst noch etwas?          → Autre chose ?
Nein danke, das ist alles. → Non merci, c'est tout.
Was macht das?             → Ça fait combien ?
Das macht zwölf Euro.      → Ça fait douze euros.</pre>
<h3>5. Les quantités</h3>
<pre class="pseudo">ein Kilo  → un kilo        ein Pfund → une livre (500 g)
ein Liter → un litre       ein Stück → un morceau / une pièce
eine Flasche → une bouteille  eine Packung → un paquet</pre>
<div class="tip">Pour commander poliment, emploie <strong>ich möchte</strong> (« je voudrais », vu au jour 23) plutôt que « ich will ». C'est plus courtois : Ich möchte ein Kilo Tomaten, bitte.</div>`,
  exercises: [
    { type: "input", q: "Complète la question du prix : « Was ___ das? » (combien ça coûte ?)", a: ["kostet"], ph: "verbe", exp: "Was kostet das ? = combien ça coûte ?" },
    { type: "qcm", q: "Comment dit-on « le supermarché » ?", opts: ["das Geschäft", "der Supermarkt", "der Markt", "die Kasse"], a: 1, exp: "der Supermarkt." },
    { type: "input", q: "Traduis « payer » : « ich ___ » (je paie)", a: ["bezahle"], ph: "verbe", exp: "bezahlen → ich bezahle." },
    { type: "qcm", q: "Comment écrit-on « 3,50 € » à l'allemande ?", opts: ["3.50 Euro", "3,50 Euro (avec virgule)", "3-50 Euro", "350 Cent seulement"], a: 1, exp: "L'allemand utilise la virgule décimale : 3,50 €." },
    { type: "qcm", q: "Comment dit-on « 2,50 € » à l'oral ?", opts: ["zwei Euros fünfzig", "zwei Euro fünfzig", "zwei Punkt fünfzig", "zweifünfzig Cent"], a: 1, exp: "zwei Euro fünfzig (Euro invariable, virgule = fünfzig)." },
    { type: "input", q: "Complète : « Ich ___ ein Kilo Äpfel. » (je voudrais un kilo de pommes — forme polie)", a: ["möchte", "moechte"], ph: "verbe", exp: "ich möchte = je voudrais (poli)." },
    { type: "qcm", q: "« Sonst noch etwas? » signifie :", opts: ["C'est combien ?", "Autre chose ?", "Où est la caisse ?", "Puis-je payer ?"], a: 1, exp: "Sonst noch etwas ? = Autre chose ? (le vendeur)." },
    { type: "input", q: "Complète : « Das ___ zwölf Euro. » (ça fait douze euros)", a: ["macht"], ph: "verbe", exp: "Das macht... = ça fait... (pour le total)." },
    { type: "qcm", q: "Que signifie « brauchen » ?", opts: ["payer", "avoir besoin de", "coûter", "vendre"], a: 1, exp: "brauchen = avoir besoin de : Ich brauche Brot." },
    { type: "input", q: "Traduis « un litre » : « ein ___ »", a: ["liter"], ph: "quantité", exp: "ein Liter (Milch) = un litre (de lait)." },
    { type: "vf", q: "En allemand, on écrit les prix avec une virgule : 3,50 €.", a: true, exp: "La virgule décimale est la norme en allemand." },
    { type: "vf", q: "« Euro » prend un -s au pluriel : « zwei Euros ».", a: false, exp: "FAUX : Euro reste invariable → zwei Euro." },
    { type: "vf", q: "« Ich möchte... » est une façon polie de commander.", a: true, exp: "möchte = je voudrais, plus courtois que ich will." },
    { type: "input", q: "Complète : « Was ___ das? » — question pour le total à la caisse (ça fait combien ?)", a: ["macht"], ph: "verbe", exp: "Was macht das ? = ça fait combien ? (total)." },
    { type: "qcm", q: "« Nein danke, das ist alles » veut dire :", opts: ["Oui, autre chose", "Non merci, c'est tout", "Combien ça coûte ?", "Je voudrais payer"], a: 1, exp: "das ist alles = c'est tout." }
  ],
  final: {
    title: "Exercice final — Au marché",
    intro: `<p>Lisez le dialogue, puis répondez.</p>
<pre class="pseudo">Verkäufer: Guten Tag! Kann ich Ihnen helfen?
Kunde: Ja, ich möchte ein Kilo Äpfel. Was kostet das?
Verkäufer: Das kostet zwei Euro fünfzig. Sonst noch etwas?
Kunde: Ich brauche noch Brot. Was macht das zusammen?
Verkäufer: Das macht vier Euro.</pre>
<p><em>Traduction : Vendeur : Bonjour ! Puis-je vous aider ? Client : Oui, je voudrais un kilo de pommes. Combien ça coûte ? Vendeur : Ça coûte deux euros cinquante. Autre chose ? Client : J'ai encore besoin de pain. Ça fait combien en tout ? Vendeur : Ça fait quatre euros.</em></p>`,
    questions: [
      { type: "input", q: "Quelle forme polie le client emploie-t-il pour commander ? (le verbe)", a: ["möchte", "moechte"], ph: "verbe", exp: "ich möchte = je voudrais (poli)." },
      { type: "qcm", q: "Combien coûte le kilo de pommes ?", opts: ["4,00 €", "2,50 €", "2,00 €", "5,00 €"], a: 1, exp: "zwei Euro fünfzig = 2,50 €." },
      { type: "input", q: "Quel verbe exprime « avoir besoin de » dans le dialogue ?", a: ["brauche", "brauchen"], ph: "verbe", exp: "Ich brauche noch Brot." },
      { type: "qcm", q: "« Was macht das zusammen? » demande :", opts: ["le prix d'un article", "le total à payer", "l'heure", "où est la caisse"], a: 1, exp: "zusammen = ensemble : le total." },
      { type: "qcm", q: "Combien le client paie-t-il en tout ?", opts: ["2,50 €", "4,00 €", "6,50 €", "1,50 €"], a: 1, exp: "Das macht vier Euro = 4,00 € au total." }
    ],
    solution: `<p>Les expressions clés du dialogue de courses :</p>
<pre class="pseudo">Kann ich Ihnen helfen?   → le vendeur propose son aide
Ich möchte...            → commander poliment
Was kostet das?          → demander le prix d'un article
Ich brauche...           → dire ce dont on a besoin
Was macht das (zusammen)?→ demander le total
Das macht... Euro.       → annoncer le total</pre>
<p>Retiens la boucle : demander (Was kostet...?), commander (Ich möchte...), puis payer (Was macht das? → Das macht... Euro). Et n'oublie pas : virgule décimale et Euro invariable.</p>`
  }
};
</script>
