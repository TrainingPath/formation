var DAY = {

  title: "La routine quotidienne",
  subtitle: "Mein Tag — raconter sa journée, du réveil au coucher.",
  theory: `
<h3>1. Les verbes de la journée</h3>
<p>La routine quotidienne réunit beaucoup de <strong>verbes séparables</strong> (jour 18). Repère la particule qui saute à la fin !</p>
<pre class="pseudo">aufstehen  → se lever            aufwachen  → se réveiller
frühstücken→ prendre le petit-déj  einkaufen → faire les courses
arbeiten   → travailler          fernsehen  → regarder la télé
schlafen   → dormir              anziehen   → s'habiller</pre>
<h3>2. Les verbes pronominaux (avec sich)</h3>
<p>Certains verbes de la toilette sont <strong>pronominaux</strong> : ils s'emploient avec un pronom réfléchi (mich, dich, sich...), un peu comme « se laver » en français.</p>
<pre class="pseudo">sich waschen → se laver     Ich wasche mich.   → Je me lave.
sich duschen → se doucher    Ich dusche mich.   → Je me douche.
sich anziehen→ s'habiller    Ich ziehe mich an. → Je m'habille.</pre>
<pre class="pseudo">ich wasche mich       wir waschen uns
du wäschst dich       ihr wascht euch
er/sie wäscht sich    sie waschen sich</pre>
<h3>3. Les mots pour organiser le récit</h3>
<p>Pour enchaîner les actions, on utilise des connecteurs de temps. Attention : beaucoup <strong>rejettent le verbe en 2e position</strong> (jour 12) !</p>
<pre class="pseudo">zuerst  → d'abord      dann     → ensuite/puis
danach  → après cela   später   → plus tard
am Morgen → le matin   am Abend → le soir</pre>
<pre class="pseudo">Zuerst stehe ich auf.       → D'abord je me lève.
Dann frühstücke ich.         → Ensuite je prends le petit-déj.
Danach gehe ich zur Arbeit.  → Après, je vais au travail.</pre>
<div class="warn">Quand la phrase commence par un connecteur (Zuerst, Dann, Danach...), le verbe conjugué reste en <strong>2e position</strong> et le sujet passe APRÈS : « Dann <strong>gehe ich</strong>... » (et non « Dann ich gehe »). C'est la règle du verbe en 2e position.</div>
<h3>4. Un exemple de journée</h3>
<pre class="pseudo">Ich stehe um sieben Uhr auf.     → Je me lève à sept heures.
Dann dusche ich mich.             → Puis je me douche.
Ich frühstücke und gehe zur Arbeit. → Je déjeune et vais au travail.
Am Abend sehe ich fern.           → Le soir, je regarde la télé.
Um elf Uhr gehe ich ins Bett.     → À onze heures, je vais au lit.</pre>
<div class="tip">Combine ce que tu as appris : verbes séparables (jour 18), l'heure (jour 20), les prépositions (jour 25). La routine quotidienne est le terrain d'entraînement idéal pour tout relier.</div>`,
  exercises: [
    { type: "input", q: "Sépare aufstehen : « Ich ___ um sieben Uhr auf. » (je me lève)", a: ["stehe"], ph: "verbe", exp: "aufstehen → ich stehe ... auf." },
    { type: "input", q: "Verbe pronominal : « Ich wasche ___. » (je me lave — pronom réfléchi)", a: ["mich"], ph: "pronom", exp: "sich waschen → ich wasche mich." },
    { type: "qcm", q: "Que signifie « zuerst » ?", opts: ["ensuite", "d'abord", "après", "plus tard"], a: 1, exp: "zuerst = d'abord (première action)." },
    { type: "qcm", q: "« Dann ___ ich zur Arbeit. » (puis je vais au travail) — quelle forme ?", opts: ["gehe", "ich gehe geht", "gehen", "gehst"], a: 0, exp: "Dann + verbe (gehe) en 2e position, sujet après : Dann gehe ich." },
    { type: "input", q: "Pronom réfléchi de du : « Du wäschst ___. » (tu te laves)", a: ["dich"], ph: "pronom", exp: "du wäschst dich." },
    { type: "qcm", q: "Pourquoi « Dann gehe ich » et non « Dann ich gehe » ?", opts: ["Erreur du texte", "Le verbe reste en 2e position, le sujet passe après le connecteur", "gehen est séparable", "dann est un verbe"], a: 1, exp: "Règle du verbe en 2e position : après un complément initial, le sujet suit le verbe." },
    { type: "input", q: "Complète : « ___ frühstücke ich. » (ensuite je prends le petit-déj)", a: ["dann", "danach"], ph: "connecteur", exp: "Dann / Danach = ensuite / après." },
    { type: "qcm", q: "Quel verbe signifie « se doucher » ?", opts: ["sich waschen", "sich duschen", "sich anziehen", "aufstehen"], a: 1, exp: "sich duschen = se doucher." },
    { type: "input", q: "Sépare fernsehen : « Am Abend ___ ich fern. » (le soir je regarde la télé)", a: ["sehe"], ph: "verbe", exp: "fernsehen → sehe ... fern." },
    { type: "qcm", q: "Pronom réfléchi de er/sie (3e personne) :", opts: ["mich", "dich", "sich", "uns"], a: 2, exp: "er/sie wäscht sich." },
    { type: "vf", q: "Beaucoup de verbes de la routine sont séparables (aufstehen, einkaufen, fernsehen).", a: true, exp: "La particule saute à la fin : Ich stehe auf." },
    { type: "vf", q: "Après « Dann », le sujet se place après le verbe conjugué.", a: true, exp: "Verbe en 2e position : Dann gehe ich." },
    { type: "vf", q: "« Ich wasche ich » est la forme correcte de « je me lave ».", a: false, exp: "FAUX : le pronom réfléchi est mich → Ich wasche mich." },
    { type: "input", q: "Traduis « ensuite / après cela » (connecteur) :", a: ["danach", "dann"], ph: "en allemand", exp: "danach = après cela ; dann = ensuite." },
    { type: "qcm", q: "« Um elf Uhr gehe ich ins Bett » signifie :", opts: ["Je me lève à 11h", "À 11h, je vais au lit", "Je dors 11 heures", "Il est 11h"], a: 1, exp: "ins Bett gehen = aller au lit ; um elf Uhr = à 11h." }
  ],
  final: {
    title: "Exercice final — La journée de Lena",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Lena steht um halb sieben auf. Zuerst duscht sie sich.
Dann frühstückt sie und geht zur Schule.
Am Nachmittag macht sie Hausaufgaben.
Am Abend sieht sie fern. Um zehn Uhr geht sie ins Bett.</pre>
<p><em>Traduction : Lena se lève à six heures et demie. D'abord, elle se douche. Ensuite, elle prend le petit-déj et va à l'école. L'après-midi, elle fait ses devoirs. Le soir, elle regarde la télé. À dix heures, elle va au lit.</em></p>`,
    questions: [
      { type: "qcm", q: "À quelle heure Lena se lève-t-elle (halb sieben) ?", opts: ["7h30", "6h30", "6h00", "7h00"], a: 1, exp: "halb sieben = 6h30 (rappel du jour 20)." },
      { type: "input", q: "Quel pronom réfléchi dans « Zuerst duscht sie ___ » ?", a: ["sich"], ph: "pronom", exp: "3e personne → sich : sie duscht sich." },
      { type: "qcm", q: "« Dann frühstückt sie » : pourquoi le sujet « sie » après le verbe ?", opts: ["Erreur", "Dann occupe la 1re position, donc le verbe est 2e et le sujet suit", "frühstücken est séparable", "sie est un objet"], a: 1, exp: "Verbe en 2e position après un connecteur initial." },
      { type: "input", q: "Quel verbe séparable trouve-t-on à la fin « ... sieht sie ___ » (regarder la télé) ?", a: ["fern"], ph: "particule", exp: "fernsehen → sieht ... fern." },
      { type: "qcm", q: "Dans quel ordre se déroule la journée de Lena ?", opts: ["école → lever → lit", "lever → douche → petit-déj → école → devoirs → télé → lit", "télé → lever → école", "lit → école → douche"], a: 1, exp: "Les connecteurs zuerst, dann, am Nachmittag, am Abend organisent le récit." }
    ],
    solution: `<p>Structure du récit de Lena :</p>
<pre class="pseudo">Lena steht ... auf.        → verbe séparable (aufstehen)
Zuerst duscht sie sich.    → connecteur + verbe 2e + réfléchi sich
Dann frühstückt sie...     → Dann → verbe 2e, sujet après
Am Abend sieht sie fern.   → moment + verbe séparable (fernsehen)</pre>
<p>La routine réunit tout : verbes séparables, verbes pronominaux (sich), connecteurs (zuerst, dann), et le verbe toujours en 2e position. C'est la synthèse parfaite de tes acquis.</p>`
  }
};
