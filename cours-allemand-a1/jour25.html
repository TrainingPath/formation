<script>
var DAY = {
  num: 25,
  title: "Les prépositions (Akkusativ / Dativ)",
  subtitle: "Chaque préposition impose son cas : accusatif, datif ou les deux.",
  theory: `
<h3>1. Une préposition impose un cas</h3>
<p>En allemand, chaque <strong>préposition</strong> (un petit mot comme « pour », « avec », « dans ») commande le <strong>cas</strong> du nom qui la suit. Il faut donc apprendre les prépositions par groupes.</p>
<h3>2. Les prépositions toujours à l'ACCUSATIF</h3>
<pre class="pseudo">für    → pour      Das ist für dich.        → C'est pour toi.
ohne   → sans      ohne meinen Bruder      → sans mon frère
durch  → à travers durch den Park          → à travers le parc
gegen  → contre    gegen die Wand          → contre le mur
um     → autour de um den Tisch            → autour de la table</pre>
<div class="tip">Moyen mnémotechnique : « FUDGO » = Für, Um, Durch, Gegen, Ohne. Ces cinq-là sont toujours suivies de l'accusatif.</div>
<h3>3. Les prépositions toujours au DATIF</h3>
<pre class="pseudo">mit    → avec       mit dem Bus         → en bus (avec le bus)
nach   → après/vers nach der Schule      → après l'école
aus    → de (origine)aus der Schweiz     → de Suisse
bei    → chez       bei meiner Oma       → chez ma mamie
zu     → à/chez     zu dem (= zum) Arzt  → chez le médecin
von    → de         von meinem Freund    → de mon ami
seit   → depuis     seit einem Jahr      → depuis un an</pre>
<div class="warn">Ces prépositions imposent TOUJOURS le datif, même quand le français dirait « à » ou « de ». Ex. : <strong>mit dem Bus</strong> (masculin datif → dem), <strong>bei meiner Oma</strong> (féminin datif → meiner).</div>
<h3>4. Les prépositions « mixtes » : accusatif OU datif</h3>
<p>Neuf prépositions de lieu peuvent prendre les deux cas. La règle est logique :</p>
<pre class="pseudo">MOUVEMENT (on va vers) → ACCUSATIF   (question : wohin? = où va-t-on ?)
POSITION (on est là)   → DATIF       (question : wo? = où est-on ?)</pre>
<pre class="pseudo">Ich gehe in die Schule.   → Je vais à l'école.   (mouvement → accusatif : die)
Ich bin in der Schule.    → Je suis à l'école.   (position → datif : der)
Ich lege das Buch auf den Tisch. → Je pose le livre sur la table. (mvt → accusatif)
Das Buch liegt auf dem Tisch.    → Le livre est sur la table.     (position → datif)</pre>
<p>Ces prépositions mixtes : <strong>in</strong> (dans), <strong>an</strong> (à/contre), <strong>auf</strong> (sur), <strong>unter</strong> (sous), <strong>über</strong> (au-dessus), <strong>vor</strong> (devant), <strong>hinter</strong> (derrière), <strong>neben</strong> (à côté), <strong>zwischen</strong> (entre).</p>
<div class="tip">Le truc : demande-toi « ça bouge vers un endroit (wohin?) → accusatif » ou « ça reste sur place (wo?) → datif ». C'est la clé des prépositions mixtes.</div>`,
  exercises: [
    { type: "qcm", q: "Quel cas impose la préposition « für » ?", opts: ["nominatif", "accusatif", "datif", "les deux"], a: 1, exp: "für + accusatif (Das ist für dich)." },
    { type: "input", q: "Complète : « Das ist für ___. » (c'est pour toi — pronom accusatif)", a: ["dich"], ph: "pronom", exp: "für + accusatif ; toi = dich." },
    { type: "qcm", q: "Quelle préposition est TOUJOURS au datif ?", opts: ["für", "ohne", "mit", "durch"], a: 2, exp: "mit + datif : mit dem Bus." },
    { type: "input", q: "Complète : « Ich fahre mit ___ Bus. » (en bus — der Bus, datif)", a: ["dem"], ph: "article", exp: "mit + datif ; masculin → dem." },
    { type: "qcm", q: "Que signifie l'astuce « FUDGO » ?", opts: ["5 prépositions au datif", "5 prépositions à l'accusatif (für, um, durch, gegen, ohne)", "les verbes de modalité", "les jours de la semaine"], a: 1, exp: "Für, Um, Durch, Gegen, Ohne → toujours accusatif." },
    { type: "input", q: "Complète : « Ich wohne bei ___ Oma. » (chez ma mamie — datif féminin)", a: ["meiner"], ph: "possessif", exp: "bei + datif ; féminin → meiner." },
    { type: "qcm", q: "Préposition mixte : « Ich gehe in die Schule ». Pourquoi accusatif (die) ?", opts: ["Position immobile", "Mouvement vers un lieu (wohin?)", "C'est une faute", "in est toujours accusatif"], a: 1, exp: "Mouvement (gehen = aller vers) → accusatif." },
    { type: "qcm", q: "« Ich bin in der Schule » : pourquoi datif (der) ?", opts: ["Mouvement", "Position, on est là (wo?)", "Erreur", "in est toujours datif"], a: 1, exp: "Position immobile → datif." },
    { type: "qcm", q: "Quelle question correspond au DATIF avec une préposition mixte ?", opts: ["wohin? (où va-t-on ?)", "wo? (où est-on ?)", "wer? (qui ?)", "wann? (quand ?)"], a: 1, exp: "wo? (position) → datif ; wohin? (mouvement) → accusatif." },
    { type: "input", q: "Complète : « Ich gehe ohne ___ Bruder. » (sans mon frère — accusatif masculin)", a: ["meinen"], ph: "possessif", exp: "ohne + accusatif ; masculin → meinen." },
    { type: "vf", q: "« mit », « nach », « bei », « aus » sont toujours suivies du datif.", a: true, exp: "Ce sont des prépositions à datif fixe." },
    { type: "vf", q: "Les prépositions « für, um, durch, gegen, ohne » demandent l'accusatif.", a: true, exp: "C'est le groupe FUDGO." },
    { type: "vf", q: "Avec une préposition mixte, le MOUVEMENT vers un lieu demande le datif.", a: false, exp: "FAUX : le mouvement (wohin?) demande l'ACCUSATIF ; la position (wo?) demande le datif." },
    { type: "input", q: "Complète : « Das Buch liegt auf ___ Tisch. » (le livre est sur la table — position, der Tisch)", a: ["dem"], ph: "article", exp: "Position (wo?) → datif ; masculin → dem." },
    { type: "qcm", q: "« Ich lege das Buch auf den Tisch » : pourquoi « den » (accusatif) ?", opts: ["Position", "Mouvement : on pose le livre SUR la table (wohin?)", "Erreur", "auf est toujours accusatif"], a: 1, exp: "legen = poser (mouvement) → accusatif : den Tisch." }
  ],
  final: {
    title: "Exercice final — Une journée en ville",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Ich fahre mit dem Bus in die Stadt.
Ich kaufe ein Geschenk für meine Mutter.
Nach dem Einkaufen gehe ich zu meiner Oma.
Das Buch liegt auf dem Tisch.</pre>
<p><em>Traduction : Je vais en ville en bus. J'achète un cadeau pour ma mère. Après les courses, je vais chez ma mamie. Le livre est sur la table.</em></p>`,
    questions: [
      { type: "qcm", q: "« mit dem Bus » : quel cas et pourquoi ?", opts: ["accusatif car mouvement", "datif car mit impose toujours le datif", "nominatif", "aucun"], a: 1, exp: "mit + datif (fixe) → dem Bus." },
      { type: "qcm", q: "« für meine Mutter » : quel cas ?", opts: ["datif", "accusatif (für impose l'accusatif)", "nominatif", "génitif"], a: 1, exp: "für + accusatif ; féminin → meine (inchangé)." },
      { type: "input", q: "« in die Stadt » : mouvement ou position ? (un mot)", a: ["mouvement", "le mouvement", "mvt"], ph: "réponse", exp: "fahren in die Stadt = on va vers → mouvement → accusatif (die)." },
      { type: "qcm", q: "« zu meiner Oma » : pourquoi « meiner » ?", opts: ["zu impose l'accusatif", "zu impose le datif (féminin → meiner)", "erreur", "Oma est masculin"], a: 1, exp: "zu + datif ; féminin → meiner." },
      { type: "qcm", q: "« Das Buch liegt auf dem Tisch » : datif car…", opts: ["mouvement vers la table", "position immobile (wo?) → datif", "auf est toujours datif", "erreur"], a: 1, exp: "liegen = être posé (position) → datif : dem Tisch." }
    ],
    solution: `<p>Les prépositions du texte, classées :</p>
<pre class="pseudo">mit dem Bus       → mit = datif fixe
für meine Mutter  → für = accusatif fixe (FUDGO)
in die Stadt      → mixte, MOUVEMENT (wohin?) → accusatif
zu meiner Oma     → zu = datif fixe
auf dem Tisch     → mixte, POSITION (wo?) → datif</pre>
<p>Trois familles à distinguer : accusatif fixe (FUDGO), datif fixe (mit, nach, aus, bei, zu, von, seit), et mixtes (mouvement = accusatif, position = datif).</p>`
  }
};
</script>
