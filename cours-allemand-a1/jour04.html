<script>
var DAY = {
  num: 4,
  title: "Le verbe sein (être)",
  subtitle: "Conjuguer le verbe le plus important de l'allemand au présent.",
  theory: `
<h3>1. Le verbe sein</h3>
<p><strong>sein</strong> veut dire « être ». C'est un verbe <strong>irrégulier</strong> : ses formes ne se déduisent pas d'une règle, il faut les apprendre par cœur. Le voici conjugué au présent (le temps qui décrit le moment présent) :</p>
<pre class="pseudo">ich   bin      // je suis
du    bist     // tu es
er    ist      // il est
sie   ist      // elle est
es    ist      // il/elle est (neutre)
wir   sind     // nous sommes
ihr   seid     // vous êtes (pluriel familier)
sie   sind     // ils / elles sont
Sie   sind     // vous êtes (politesse)</pre>
<div class="tip">Trois formes suffisent souvent au début : <strong>bin</strong> (ich), <strong>bist</strong> (du), <strong>ist</strong> (er/sie/es). Le pluriel réutilise <strong>sind</strong> partout, sauf « ihr seid ».</div>
<h3>2. À quoi sert sein ?</h3>
<p>Comme « être » en français, il sert à décrire une identité, une qualité, un état, une origine ou une profession :</p>
<pre class="pseudo">Ich bin Anna.            // identité : Je suis Anna.
Du bist nett.            // qualité : Tu es gentil.
Er ist müde.             // état : Il est fatigué.
Wir sind aus Belgien.    // origine : Nous sommes de Belgique.
Sie ist Ärztin.          // profession : Elle est médecin.</pre>
<div class="warn">Attention à « ihr seid » (vous êtes) : il se termine par <strong>-d</strong>, pas par -t. Ne confonds pas <strong>seid</strong> (verbe être, 2e pers. du pluriel) avec <strong>seit</strong> (« depuis »), qui se prononce presque pareil mais s'écrit avec un t.</div>
<h3>3. Quelques adjectifs pour s'entraîner</h3>
<pre class="pseudo">groß = grand      klein = petit     müde = fatigué
gut  = bon/bien   nett  = gentil    krank = malade
glücklich = heureux   traurig = triste   neu = neuf</pre>
<h3>4. Phrase négative et question (aperçu)</h3>
<p>On verra la négation (jour 13) et les questions (jour 14) en détail, mais voici l'idée avec sein :</p>
<pre class="pseudo">Ich bin nicht müde.   // Je ne suis pas fatigué.  (nicht = ne… pas)
Bist du müde?         // Es-tu fatigué ?          (verbe en tête)
Ist er Lehrer?        // Est-il professeur ?</pre>
<p>Remarque : pour poser une question fermée (réponse oui/non), on met simplement le verbe <strong>en première position</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "Quelle est la forme de sein avec « ich » ?", opts: ["bin", "bist", "ist", "sind"], a: 0, exp: "ich bin = je suis." },
    { type: "qcm", q: "Quelle est la forme de sein avec « du » ?", opts: ["bist", "bin", "seid", "ist"], a: 0, exp: "du bist = tu es." },
    { type: "qcm", q: "Quelle est la forme de sein avec « er / sie / es » ?", opts: ["ist", "bist", "sind", "seid"], a: 0, exp: "er ist / sie ist / es ist." },
    { type: "qcm", q: "Quelle est la forme de sein avec « wir » ?", opts: ["sind", "seid", "bin", "ist"], a: 0, exp: "wir sind = nous sommes." },
    { type: "qcm", q: "Quelle est la forme de sein avec « ihr » ?", opts: ["seid", "sind", "bist", "seit"], a: 0, exp: "ihr seid = vous êtes (pluriel familier), avec un -d." },
    { type: "qcm", q: "Comment dit-on « vous êtes » (politesse) ?", opts: ["Sie sind", "ihr seid", "du bist", "Sie seid"], a: 0, exp: "Sie sind (comme wir/sie au pluriel)." },
    { type: "vf", q: "« ihr seid » s'écrit avec un -d à la fin.", a: true, exp: "Vrai : seid (verbe être) ≠ seit (depuis)." },
    { type: "vf", q: "Le verbe sein est régulier et suit une règle simple.", a: false, exp: "Faux : sein est irrégulier, on l'apprend par cœur." },
    { type: "vf", q: "Pour poser « Es-tu fatigué ? », on met le verbe en première position : « Bist du müde? ».", a: true, exp: "Question fermée = verbe en tête." },
    { type: "input", q: "Complète : Ich ___ müde. (« je suis fatigué »)", a: ["bin"], ph: "un mot", exp: "Ich bin müde." },
    { type: "input", q: "Complète : Du ___ nett. (« tu es gentil »)", a: ["bist"], ph: "un mot", exp: "Du bist nett." },
    { type: "input", q: "Complète : Er ___ groß. (« il est grand »)", a: ["ist"], ph: "un mot", exp: "Er ist groß." },
    { type: "input", q: "Complète : Wir ___ aus Belgien. (« nous sommes de Belgique »)", a: ["sind"], ph: "un mot", exp: "Wir sind aus Belgien." },
    { type: "input", q: "Complète : Ihr ___ krank. (« vous êtes malades », pluriel familier)", a: ["seid"], ph: "un mot", exp: "Ihr seid krank (avec -d)." },
    { type: "input", q: "Complète : Sie ___ Lehrerin. (« elle est enseignante »)", a: ["ist"], ph: "un mot", exp: "sie + singulier → ist : Sie ist Lehrerin." }
  ],
  final: {
    title: "Exercice final — Conjuguer sein",
    intro: `<p>On assemble tout. Choisis à chaque fois la bonne forme de sein : bin, bist, ist, sind ou seid.</p>`,
    questions: [
      { type: "input", q: "Ich ___ glücklich. (« je suis heureux »)", a: ["bin"], ph: "un mot", exp: "ich bin." },
      { type: "input", q: "___ du krank? (« es-tu malade ? », verbe en tête)", a: ["bist"], ph: "un mot", exp: "Bist du krank?" },
      { type: "qcm", q: "Wir ___ Studenten. Quelle forme ?", opts: ["sind", "seid", "ist", "bin"], a: 0, exp: "wir sind = nous sommes." },
      { type: "qcm", q: "Ihr ___ sehr nett. Quelle forme ?", opts: ["seid", "sind", "bist", "ist"], a: 0, exp: "ihr seid = vous êtes (familier)." },
      { type: "input", q: "Das Auto ___ neu. (« la voiture est neuve », neutre)", a: ["ist"], ph: "un mot", exp: "das Auto → es → ist : Das Auto ist neu." }
    ],
    solution: `<p>À retenir absolument, c'est le socle de tout : <strong>ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind</strong>. Deux pièges à graver : <strong>ihr seid</strong> se finit par -d (ne pas confondre avec « seit » = depuis), et sein est irrégulier, donc aucune règle n'aide : c'est de la mémorisation pure. Récite cette conjugaison chaque jour jusqu'à ce qu'elle vienne sans réfléchir.</p>`
  }
};
</script>
