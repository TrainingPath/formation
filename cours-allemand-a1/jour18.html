var DAY = {
  num: 18,
  title: "Les verbes à particule séparable",
  subtitle: "aufstehen, einkaufen, fernsehen — la particule saute à la fin.",
  theory: `
<h3>1. Une particule collée au début du verbe</h3>
<p>Beaucoup de verbes allemands sont formés d'un <strong>verbe de base</strong> + une petite <strong>particule</strong> placée devant. Cette particule modifie le sens, un peu comme une préposition en français.</p>
<pre class="pseudo">stehen  → aufstehen   → se lever          (auf = « en haut »)
kaufen  → einkaufen   → faire les courses (ein = « dedans »)
sehen   → fernsehen   → regarder la télé  (fern = « loin »)
rufen   → anrufen     → appeler (au tél.) (an = « à »)
kommen  → mitkommen   → venir avec        (mit = « avec »)</pre>
<h3>2. LE POINT CLÉ : la particule se sépare et part à la fin</h3>
<p>Dans une phrase simple au présent, on <strong>détache la particule</strong> : le verbe de base se conjugue en 2e position, et la <strong>particule saute tout à la fin</strong> de la phrase.</p>
<pre class="pseudo">aufstehen → Ich  stehe  früh  auf.
             |     |            |
             sujet VERBE        PARTICULE rejetée à la fin
→ Je me lève tôt.</pre>
<pre class="pseudo">einkaufen → Ich kaufe im Supermarkt ein.   → Je fais les courses au supermarché.
anrufen   → Ich rufe meine Mutter an.       → J'appelle ma mère.
fernsehen → Wir sehen am Abend fern.        → Nous regardons la télé le soir.</pre>
<div class="warn">Erreur fréquente : « Ich aufstehe früh » est FAUX. Il faut séparer : « Ich <strong>stehe</strong> früh <strong>auf</strong> ». La particule ne reste jamais collée au verbe conjugué.</div>
<h3>3. Comment reconnaître une particule séparable ?</h3>
<p>Les particules séparables sont souvent de petits mots-outils accentués : <strong>auf-, ein-, an-, mit-, aus-, ab-, zu-, vor-, fern-</strong>. Dans le dictionnaire, le verbe est donné en un seul mot (aufstehen), mais à l'usage on le sépare.</p>
<div class="tip">Truc pour l'oral : la particule porte l'accent (AUF-stehen, EIN-kaufen). Si tu entends l'accent sur le début, c'est presque toujours séparable.</div>
<h3>4. Avec un modal : la particule reste collée !</h3>
<p>Si le verbe séparable passe à l'<strong>infinitif</strong> (après un modal, jour 17), il reste <strong>en un seul mot</strong> à la fin de la phrase.</p>
<pre class="pseudo">Ich muss früh aufstehen.   → Je dois me lever tôt.   (infinitif entier à la fin)
Ich stehe früh auf.        → Je me lève tôt.         (séparé au présent simple)</pre>`,
  exercises: [
    { type: "input", q: "Sépare aufstehen : « Ich ___ früh auf. » (je me lève tôt — verbe conjugué)", a: ["stehe"], ph: "verbe", exp: "aufstehen → ich stehe ... auf. Le verbe de base se conjugue : stehe." },
    { type: "input", q: "Complète la particule : « Ich stehe früh ___. » (aufstehen)", a: ["auf"], ph: "particule", exp: "La particule auf est rejetée à la fin." },
    { type: "qcm", q: "Quelle phrase est correcte pour « Je fais les courses » (einkaufen) ?", opts: ["Ich einkaufe.", "Ich kaufe ein.", "Ich ein kaufe.", "Kaufe ich ein."], a: 1, exp: "Séparé : Ich kaufe ... ein." },
    { type: "qcm", q: "Dans « Ich rufe meine Mutter an », que fait la particule an ?", opts: ["Elle reste devant le verbe", "Elle est rejetée à la fin", "Elle disparaît", "Elle devient un nom"], a: 1, exp: "anrufen se sépare : rufe (2e position), an (fin)." },
    { type: "input", q: "Sépare fernsehen : « Wir ___ am Abend fern. » (nous regardons la télé le soir)", a: ["sehen"], ph: "verbe", exp: "fernsehen → wir sehen ... fern." },
    { type: "input", q: "Complète : « Er ___ seinen Freund an. » (il appelle son ami — anrufen, er)", a: ["ruft"], ph: "verbe", exp: "anrufen → er ruft ... an." },
    { type: "qcm", q: "Avec un modal, comment est le verbe séparable ?", opts: ["Séparé en deux", "En un seul mot à l'infinitif, à la fin", "Supprimé", "En 1re position"], a: 1, exp: "Ich muss früh aufstehen : l'infinitif reste entier à la fin." },
    { type: "qcm", q: "Quelle phrase est correcte avec un modal ?", opts: ["Ich muss früh stehe auf.", "Ich muss früh aufstehen.", "Ich muss auf früh stehen.", "Ich aufstehen muss früh."], a: 1, exp: "Après le modal, aufstehen reste entier à la fin." },
    { type: "input", q: "Traduis « nous » de mitkommen : « ___ du mit? » (viens-tu avec ? — question, komm)", a: ["kommst", "kommst"], ph: "verbe", exp: "mitkommen → Kommst du mit ? La particule mit reste à la fin." },
    { type: "qcm", q: "Quelle particule signifie « avec » (comme dans mitkommen) ?", opts: ["auf", "ein", "mit", "fern"], a: 2, exp: "mit = avec : mitkommen = venir avec." },
    { type: "vf", q: "Au présent simple, la particule séparable est rejetée à la fin de la phrase.", a: true, exp: "Ich stehe früh auf : c'est la règle de base." },
    { type: "vf", q: "« Ich aufstehe früh » est une phrase correcte.", a: false, exp: "FAUX : il faut séparer → Ich stehe früh auf." },
    { type: "vf", q: "Après un modal, le verbe séparable reste en un seul mot (Ich muss aufstehen).", a: true, exp: "À l'infinitif, il n'est pas séparé : aufstehen à la fin." },
    { type: "input", q: "Complète la particule : « Ich kaufe im Supermarkt ___. » (einkaufen)", a: ["ein"], ph: "particule", exp: "La particule ein est rejetée à la fin." },
    { type: "qcm", q: "Comment reconnaît-on souvent une particule séparable à l'oral ?", opts: ["Elle est muette", "Elle porte l'accent (AUF-stehen)", "Elle est en fin de phrase seulement", "On ne peut pas"], a: 1, exp: "L'accent tombe sur la particule : AUF-stehen, EIN-kaufen." }
  ],
  final: {
    title: "Exercice final — La matinée de Max",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Max steht um sieben Uhr auf.
Dann kauft er im Supermarkt ein.
Am Abend sieht er fern und ruft seine Oma an.</pre>
<p><em>Traduction : Max se lève à sept heures. Ensuite, il fait les courses au supermarché. Le soir, il regarde la télé et appelle sa grand-mère.</em></p>`,
    questions: [
      { type: "qcm", q: "Dans « Max steht um sieben Uhr auf », quel est le verbe complet ?", opts: ["stehen", "aufstehen", "auf", "Uhr"], a: 1, exp: "steht ... auf = aufstehen (séparé)." },
      { type: "input", q: "Quelle particule est rejetée à la fin dans la 2e phrase (einkaufen) ?", a: ["ein"], ph: "particule", exp: "kauft ... ein → einkaufen." },
      { type: "qcm", q: "« ruft ... an » correspond à quel verbe ?", opts: ["rufen", "anrufen", "ansehen", "mitrufen"], a: 1, exp: "anrufen = appeler au téléphone." },
      { type: "qcm", q: "Pourquoi la particule est-elle à la fin et non collée au verbe ?", opts: ["Par erreur", "Car au présent simple la particule se sépare et part à la fin", "Car c'est un modal", "Car c'est un nom"], a: 1, exp: "Règle des verbes séparables au présent simple." },
      { type: "input", q: "Réécris « aufstehen » séparé avec « er » et « früh » : « Er ___ früh auf. »", a: ["steht"], ph: "verbe", exp: "er steht früh auf." }
    ],
    solution: `<p>Les trois verbes séparables du texte, décomposés :</p>
<pre class="pseudo">aufstehen → Max steht ... auf.      (se lever)
einkaufen → er kauft ... ein.        (faire les courses)
fernsehen → er sieht ... fern.       (regarder la télé)
anrufen   → er ruft ... an.          (appeler)</pre>
<p>Réflexe à retenir : au présent simple, le verbe de base se conjugue en 2e position et la particule saute à la fin ; mais après un modal, le verbe reste entier à l'infinitif (er muss früh aufstehen).</p>`
  }
};
</script>
