<script>

  title: "Le passé : war, hatte",
  subtitle: "Parler d'hier avec le prétérit de sein et haben.",
  theory: `
<h3>1. Un premier pas vers le passé</h3>
<p>Pour raconter le passé, l'allemand a plusieurs temps. Le plus simple pour commencer : le <strong>prétérit</strong> (Präteritum) des deux verbes que tu connais le mieux, <strong>sein</strong> (être) et <strong>haben</strong> (avoir). On les emploie tout le temps pour dire « j'étais », « j'avais ».</p>
<h3>2. war : le passé de sein (être)</h3>
<pre class="pseudo">ich war        → j'étais         wir waren   → nous étions
du warst       → tu étais        ihr wart    → vous étiez
er/sie/es war  → il/elle était   sie/Sie waren → ils étaient</pre>
<pre class="pseudo">Ich war gestern zu Hause.   → J'étais à la maison hier.
Es war kalt.                → Il faisait froid.
Wir waren im Kino.          → Nous étions au cinéma.</pre>
<div class="tip">Comme pour les modaux, <strong>ich</strong> et <strong>er/sie/es</strong> ont la MÊME forme : ich war / er war (pas de terminaison).</div>
<h3>3. hatte : le passé de haben (avoir)</h3>
<pre class="pseudo">ich hatte        → j'avais        wir hatten   → nous avions
du hattest       → tu avais       ihr hattet   → vous aviez
er/sie/es hatte  → il/elle avait  sie/Sie hatten → ils avaient</pre>
<pre class="pseudo">Ich hatte Hunger.         → J'avais faim.
Er hatte keine Zeit.       → Il n'avait pas le temps.
Wir hatten viel Spaß.      → Nous nous sommes bien amusés (avions bcp de plaisir).</pre>
<div class="warn">Ne confonds pas le présent et le passé : <strong>ich habe</strong> = j'ai (présent), <strong>ich hatte</strong> = j'avais (passé). Le double <strong>t</strong> de hatte est le signal du passé.</div>
<h3>4. Les mots du passé</h3>
<pre class="pseudo">gestern     → hier          letzte Woche → la semaine dernière
vorgestern  → avant-hier    letztes Jahr → l'année dernière
früher      → autrefois     am Wochenende → le week-end (dernier)</pre>
<pre class="pseudo">Gestern war ich krank.        → Hier, j'étais malade.
Letzte Woche hatten wir Ferien.→ La semaine dernière, nous avions congé.</pre>
<h3>5. Poser une question au passé</h3>
<pre class="pseudo">Warst du gestern zu Hause?   → Étais-tu à la maison hier ?
Hattest du Angst?            → Avais-tu peur ?
Wo warst du?                 → Où étais-tu ?</pre>
<div class="tip">Bonne nouvelle : war et hatte s'utilisent exactement comme sein et haben au présent (même place dans la phrase, verbe en 2e position). Seule la forme change.</div>`,
  exercises: [
    { type: "input", q: "Passé de sein avec ich : « Ich ___ gestern zu Hause. » (j'étais)", a: ["war"], ph: "verbe", exp: "ich war = j'étais." },
    { type: "input", q: "Passé de sein avec du : « ___ du im Kino? » (étais-tu au cinéma ?)", a: ["warst"], ph: "verbe", exp: "du warst = tu étais." },
    { type: "qcm", q: "Comment dit-on « nous étions » ?", opts: ["wir war", "wir waren", "wir waret", "wir wart"], a: 1, exp: "wir waren = nous étions." },
    { type: "input", q: "Passé de haben avec ich : « Ich ___ Hunger. » (j'avais faim)", a: ["hatte"], ph: "verbe", exp: "ich hatte = j'avais (double t = passé)." },
    { type: "qcm", q: "« Er hatte keine Zeit » signifie :", opts: ["Il a le temps", "Il n'avait pas le temps", "Il aura le temps", "Il veut du temps"], a: 1, exp: "hatte = avait ; keine Zeit = pas de temps." },
    { type: "input", q: "Passé de haben avec du : « ___ du Angst? » (avais-tu peur ?)", a: ["hattest"], ph: "verbe", exp: "du hattest = tu avais." },
    { type: "qcm", q: "Que signifie « gestern » ?", opts: ["demain", "hier", "aujourd'hui", "maintenant"], a: 1, exp: "gestern = hier." },
    { type: "qcm", q: "Quelle forme est au PASSÉ ?", opts: ["ich habe", "ich hatte", "ich bin", "ich mag"], a: 1, exp: "ich hatte (double t) = j'avais, passé." },
    { type: "input", q: "Complète : « Es ___ kalt. » (il faisait froid — sein au passé)", a: ["war"], ph: "verbe", exp: "es war = c'était / il faisait." },
    { type: "qcm", q: "Comment dit-on « ils avaient » ?", opts: ["sie hatte", "sie hatten", "sie haben", "sie hattet"], a: 1, exp: "sie hatten = ils avaient." },
    { type: "vf", q: "« war » est le passé de sein (être) et « hatte » le passé de haben (avoir).", a: true, exp: "ich war = j'étais ; ich hatte = j'avais." },
    { type: "vf", q: "Au passé, « ich » et « er » ont la même forme (ich war / er war).", a: true, exp: "Pas de terminaison au singulier : comme les modaux." },
    { type: "vf", q: "« ich hatte » veut dire « j'ai » (présent).", a: false, exp: "FAUX : ich hatte = j'avais (passé) ; j'ai (présent) = ich habe." },
    { type: "input", q: "Traduis « hier » (mot du passé) :", a: ["gestern"], ph: "en allemand", exp: "gestern = hier." },
    { type: "qcm", q: "« Wo warst du? » demande :", opts: ["Qui es-tu ?", "Où étais-tu ?", "Quand pars-tu ?", "Comment vas-tu ?"], a: 1, exp: "Wo = où ; warst = étais : Où étais-tu ?" }
  ],
  final: {
    title: "Exercice final — Le week-end dernier",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Letztes Wochenende war ich bei meiner Oma.
Das Wetter war schön. Wir hatten viel Spaß.
Am Abend war ich müde und hatte Hunger.
Meine Oma hatte einen Kuchen für mich.</pre>
<p><em>Traduction : Le week-end dernier, j'étais chez ma mamie. Le temps était beau. Nous nous sommes bien amusés. Le soir, j'étais fatigué et j'avais faim. Ma mamie avait un gâteau pour moi.</em></p>`,
    questions: [
      { type: "input", q: "Quelle forme de sein signifie « j'étais » dans le texte ?", a: ["war"], ph: "verbe", exp: "ich war = j'étais." },
      { type: "qcm", q: "« Wir hatten viel Spaß » : à quel temps ?", opts: ["présent", "passé (prétérit)", "futur", "impératif"], a: 1, exp: "hatten = avions : passé de haben." },
      { type: "qcm", q: "« Das Wetter war schön » signifie :", opts: ["Le temps sera beau", "Le temps était beau", "Le temps est beau", "Il fait beau"], a: 1, exp: "war = était : le temps ÉTAIT beau." },
      { type: "input", q: "Quelle forme de haben signifie « avait » (Meine Oma ___ einen Kuchen) ?", a: ["hatte"], ph: "verbe", exp: "sie hatte = elle avait." },
      { type: "qcm", q: "Quel mot situe le récit dans le passé ?", opts: ["morgen", "letztes Wochenende (le week-end dernier)", "jetzt", "heute"], a: 1, exp: "letztes Wochenende = le week-end dernier : marqueur de passé." }
    ],
    solution: `<p>Le prétérit dans le texte :</p>
<pre class="pseudo">ich war / war ich   → sein au passé (j'étais)
Das Wetter war...   → es/das war (c'était)
wir hatten          → haben au passé (nous avions)
Oma hatte           → sie hatte (elle avait)
Marqueur : letztes Wochenende (le week-end dernier)</pre>
<p>Pour l'instant, tu sais raconter le passé avec deux verbes essentiels : <strong>war</strong> (étais) et <strong>hatte</strong> (avais). Ils se placent comme au présent ; seule la forme change. C'est déjà assez pour parler d'hier !</p>`
  }
};
