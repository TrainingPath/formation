var DAY = {

  title: "Le genre et le pluriel des noms",
  subtitle: "Reconnaître le genre et former le pluriel : les grandes tendances.",
  theory: `
<h3>1. Rappel : trois genres</h3>
<p>Chaque nom allemand possède un <strong>genre</strong> fixe : masculin (der), féminin (die) ou neutre (das). Le genre est une donnée du mot, à apprendre avec lui. Mais il existe des <strong>indices</strong> (des tendances) qui aident à deviner. Ils ne sont pas absolus, mais très utiles.</p>
<pre class="pseudo">MASCULIN (der) :
  - jours, mois, saisons        der Montag, der Juli, der Winter
  - la plupart des metiers -er  der Lehrer, der Bäcker
FEMININ (die) :
  - beaucoup de mots en -e       die Lampe, die Blume, die Katze
  - suffixes -ung, -heit, -keit  die Zeitung, die Freiheit
  - metiers feminins en -in      die Lehrerin, die Ärztin
NEUTRE (das) :
  - diminutifs -chen, -lein      das Mädchen, das Häuschen
  - beaucoup de mots d'origine   das Auto, das Hotel, das Kino</pre>
<div class="warn">Ces règles ont des exceptions : « der Käse » (le fromage) finit par -e mais est masculin. En cas de doute, seul l'apprentissage par cœur tranche. Apprends toujours article + nom.</div>
<h3>2. Le pluriel : cinq grandes façons</h3>
<p>Contrairement au français (souvent un simple -s), l'allemand forme le pluriel de plusieurs manières. Au pluriel, l'article défini est toujours <strong>die</strong>. Voici les cinq schémas principaux :</p>
<pre class="pseudo">Type          Singulier        Pluriel          Traduction
1. -e         der Tisch    ->  die Tische       les tables (masc.)
2. -er + Uml. das Kind     ->  die Kinder       les enfants
              das Buch     ->  die Bücher       les livres (u -> ü)
3. -(e)n      die Frau     ->  die Frauen       les femmes
              die Lampe    ->  die Lampen       les lampes
4. -s         das Auto     ->  die Autos        les voitures (mots etrangers)
5. Umlaut     der Vater    ->  die Väter        les peres (a -> ä)
   (parfois seul, sans terminaison ajoutee)</pre>
<h3>3. Le rôle de l'Umlaut au pluriel</h3>
<p>Beaucoup de pluriels ajoutent un <strong>Umlaut</strong> (tréma) sur la voyelle : a→ä, o→ö, u→ü. C'est un signal visuel du pluriel :</p>
<pre class="pseudo">der Apfel  ->  die Äpfel    (les pommes,  a -> ä)
die Mutter ->  die Mütter   (les meres,   u -> ü)
der Sohn   ->  die Söhne    (les fils,    o -> ö)</pre>
<div class="tip">Comme pour le genre, le pluriel s'apprend avec le mot. Les bons dictionnaires notent : « das Buch, -es, Bücher ». Mémorise le trio genre + mot + pluriel.</div>
<h3>4. Féminin des métiers : -in</h3>
<p>Pour féminiser un métier ou un rôle, l'allemand ajoute souvent le suffixe <strong>-in</strong> (et parfois un Umlaut) :</p>
<pre class="pseudo">der Lehrer  ->  die Lehrerin   (l'enseignant -> l'enseignante)
der Arzt    ->  die Ärztin     (le medecin -> la medecin, a -> ä)
der Student ->  die Studentin  (l'etudiant -> l'etudiante)</pre>`,
  exercises: [
    { type: "qcm", q: "Au pluriel, l'article défini est toujours…", opts: ["die", "der", "das", "den"], a: 0, exp: "Pluriel → die pour tous les genres." },
    { type: "qcm", q: "Quel est le pluriel de « das Kind » (l'enfant) ?", opts: ["die Kinder", "die Kinds", "die Kinden", "die Kinder"], a: 0, exp: "das Kind → die Kinder (type -er)." },
    { type: "qcm", q: "Quel est le pluriel de « das Auto » (mot d'origine étrangère) ?", opts: ["die Autos", "die Auten", "die Autoe", "die Auti"], a: 0, exp: "Les mots étrangers font souvent leur pluriel en -s : die Autos." },
    { type: "qcm", q: "Le suffixe -ung (die Zeitung) indique en général un nom…", opts: ["féminin", "masculin", "neutre", "pluriel"], a: 0, exp: "-ung, -heit, -keit → féminin." },
    { type: "qcm", q: "Le diminutif -chen (das Mädchen) indique un nom…", opts: ["neutre", "masculin", "féminin", "pluriel"], a: 0, exp: "-chen et -lein → neutre." },
    { type: "qcm", q: "Comment féminise-t-on « der Lehrer » (l'enseignant) ?", opts: ["die Lehrerin", "die Lehrere", "die Lehrern", "das Lehrer"], a: 0, exp: "On ajoute -in : die Lehrerin." },
    { type: "vf", q: "L'Umlaut (a→ä, o→ö, u→ü) apparaît souvent au pluriel.", a: true, exp: "der Apfel → die Äpfel, die Mutter → die Mütter." },
    { type: "vf", q: "En allemand, le pluriel se forme toujours en ajoutant -s comme en français.", a: false, exp: "Faux : il existe cinq schémas (-e, -er, -(e)n, -s, Umlaut seul)." },
    { type: "vf", q: "Les jours et les mois (der Montag, der Juli) sont masculins.", a: true, exp: "Jours, mois et saisons sont masculins." },
    { type: "input", q: "Pluriel de « die Frau » (la femme) : die ___", a: ["frauen"], ph: "un mot", exp: "die Frau → die Frauen (type -en)." },
    { type: "input", q: "Pluriel de « der Tisch » (la table) : die ___", a: ["tische"], ph: "un mot", exp: "der Tisch → die Tische (type -e)." },
    { type: "input", q: "Pluriel de « das Buch » (le livre, avec Umlaut) : die ___", a: ["bücher", "buecher"], ph: "un mot", exp: "das Buch → die Bücher (u → ü, + er)." },
    { type: "input", q: "Pluriel de « der Apfel » (la pomme, Umlaut seul) : die ___", a: ["äpfel", "aepfel"], ph: "un mot", exp: "der Apfel → die Äpfel (a → ä)." },
    { type: "input", q: "Féminin de « der Student » : die ___", a: ["studentin"], ph: "un mot", exp: "On ajoute -in : die Studentin." },
    { type: "input", q: "Article du nom « Zeitung » (suffixe -ung) : ___ Zeitung", a: ["die"], ph: "un article", exp: "-ung → féminin : die Zeitung." }
  ],
  final: {
    title: "Exercice final — Une petite famille",
    intro: `<p>Lis ce petit texte, puis réponds. Genre et pluriel sont au cœur des questions.</p>
<pre class="pseudo">Das ist meine Familie. Der Vater heißt Peter.       // Voici ma famille. Le père s'appelle Peter.
Die Mutter heißt Anna. Wir haben zwei Kinder.       // La mère s'appelle Anna. Nous avons deux enfants.</pre>`,
    questions: [
      { type: "qcm", q: "Quel est l'article de « Vater » dans le texte ?", opts: ["der (masculin)", "die (féminin)", "das (neutre)", "ein"], a: 0, exp: "der Vater : masculin." },
      { type: "qcm", q: "« Mutter » est du genre…", opts: ["féminin (die)", "masculin (der)", "neutre (das)", "pluriel"], a: 0, exp: "die Mutter : féminin." },
      { type: "qcm", q: "Le pluriel « Kinder » vient de quel singulier ?", opts: ["das Kind", "der Kind", "die Kinde", "das Kinder"], a: 0, exp: "das Kind → die Kinder (type -er)." },
      { type: "input", q: "Pluriel de « der Vater » (avec Umlaut) : die ___", a: ["väter", "vaeter"], ph: "un mot", exp: "der Vater → die Väter (a → ä)." },
      { type: "input", q: "Féminin de « der Lehrer » : die ___", a: ["lehrerin"], ph: "un mot", exp: "die Lehrerin (suffixe -in)." }
    ],
    solution: `<p>Deux données s'apprennent avec chaque nom : son <strong>genre</strong> (der/die/das) et son <strong>pluriel</strong>. Les indices aident — jours/mois masculins, -ung/-heit féminins, -chen neutres — mais restent des tendances. Le pluriel suit cinq schémas (-e, -er, -(e)n, -s, ou Umlaut seul), très souvent accompagnés d'un tréma (a→ä, o→ö, u→ü). Le bon réflexe : mémoriser le trio complet, par exemple « das Buch, die Bücher ».</p>`
  }
};
