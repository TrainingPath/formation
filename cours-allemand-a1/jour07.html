var DAY = {

  title: "Les articles indéfinis (ein, eine)",
  subtitle: "Un, une : parler d'une chose non précise, et sa négation kein.",
  theory: `
<h3>1. Qu'est-ce qu'un article indéfini ?</h3>
<p>L'<strong>article indéfini</strong> désigne une chose <em>non précise</em>, dont on parle pour la première fois : en français « <strong>un</strong>, <strong>une</strong> ». En allemand, il n'a que deux formes au nominatif (le cas du sujet) :</p>
<pre class="pseudo">ein   ->  masculin ET neutre   ein Mann (un homme), ein Kind (un enfant)
eine  ->  feminin              eine Frau (une femme)</pre>
<div class="tip">Astuce : le masculin et le neutre partagent la même forme <strong>ein</strong>. Seul le féminin ajoute un -e : <strong>eine</strong>. C'est plus simple que les articles définis !</div>
<h3>2. Comparaison défini / indéfini</h3>
<pre class="pseudo">              masculin      feminin      neutre
defini   :    der Mann      die Frau     das Kind      (l'homme / la femme / l'enfant)
indefini :    ein Mann      eine Frau    ein Kind      (un homme / une femme / un enfant)</pre>
<p>Remarque : l'article indéfini se calque sur la fin de l'article défini. <strong>d-er → ein-</strong> (masculin), <strong>d-ie → ein-e</strong> (féminin), <strong>d-as → ein-</strong> (neutre).</p>
<h3>3. Pas de pluriel pour ein</h3>
<p>« un / une » n'a pas de pluriel (on ne dit pas « des-un »). Au pluriel, l'allemand n'utilise <strong>aucun article</strong> :</p>
<pre class="pseudo">Singulier : Ich habe ein Buch.     // J'ai un livre.
Pluriel   : Ich habe Bücher.       // J'ai des livres.  (pas d'article !)</pre>
<h3>4. La négation kein (aucun / pas de)</h3>
<p>Pour dire « pas de / aucun », on ne met pas « nicht » devant un nom indéfini : on utilise <strong>kein</strong>, qui se décline exactement comme ein, avec un k- devant :</p>
<pre class="pseudo">kein   ->  masculin/neutre   Ich habe kein Auto. (Je n'ai pas de voiture.)
keine  ->  feminin           Ich habe keine Zeit. (Je n'ai pas de temps.)
keine  ->  pluriel           Ich habe keine Kinder. (Je n'ai pas d'enfants.)</pre>
<div class="warn">Règle clé (revue au jour 13) : pour nier un nom précédé de ein ou sans article, on emploie <strong>kein</strong>, pas nicht. « Ich habe ein Auto » → « Ich habe kein Auto ». Au pluriel, kein devient keine.</div>
<h3>5. Récapitulatif</h3>
<pre class="pseudo">              masculin   feminin   neutre   pluriel
ein  (un) :   ein        eine      ein      —
kein (pas):   kein       keine     kein     keine</pre>`,
  exercises: [
    { type: "qcm", q: "Quel article indéfini va avec un nom masculin (ein/eine Mann) ?", opts: ["ein", "eine", "einen", "der"], a: 0, exp: "ein Mann : masculin → ein." },
    { type: "qcm", q: "Quel article indéfini va avec un nom féminin (Frau) ?", opts: ["eine", "ein", "einer", "die"], a: 0, exp: "eine Frau : féminin → eine." },
    { type: "qcm", q: "Quel article indéfini va avec un nom neutre (Kind) ?", opts: ["ein", "eine", "das", "einem"], a: 0, exp: "ein Kind : neutre → ein (comme le masculin)." },
    { type: "qcm", q: "Comment dit-on « des livres » au pluriel (indéfini) ?", opts: ["Bücher (sans article)", "eine Bücher", "ein Bücher", "die Bücher"], a: 0, exp: "L'indéfini n'a pas de pluriel : on n'utilise aucun article." },
    { type: "qcm", q: "Comment nie-t-on « Ich habe ein Auto » ?", opts: ["Ich habe kein Auto.", "Ich habe nicht ein Auto.", "Ich habe nicht Auto.", "Ich habe keine Auto."], a: 0, exp: "On nie un nom indéfini avec kein : kein Auto (neutre)." },
    { type: "qcm", q: "Comment dit-on « Je n'ai pas de temps » (die Zeit, féminin) ?", opts: ["Ich habe keine Zeit.", "Ich habe kein Zeit.", "Ich habe nicht Zeit.", "Ich habe einen Zeit."], a: 0, exp: "Féminin → keine Zeit." },
    { type: "vf", q: "L'article indéfini masculin et l'article indéfini neutre ont la même forme : ein.", a: true, exp: "ein Mann (masc.), ein Kind (neutre) : même forme." },
    { type: "vf", q: "Pour nier un nom avec ein, on utilise nicht.", a: false, exp: "Faux : on utilise kein (kein Auto), pas nicht." },
    { type: "vf", q: "Au pluriel indéfini, l'allemand n'emploie aucun article.", a: true, exp: "« Ich habe Bücher » = j'ai des livres." },
    { type: "input", q: "Complète : ___ Mann (un homme, masculin).", a: ["ein"], ph: "un article", exp: "ein Mann." },
    { type: "input", q: "Complète : ___ Frau (une femme, féminin).", a: ["eine"], ph: "un article", exp: "eine Frau." },
    { type: "input", q: "Complète : ___ Kind (un enfant, neutre).", a: ["ein"], ph: "un article", exp: "ein Kind (neutre = même forme que le masculin)." },
    { type: "input", q: "Complète : Ich habe ___ Auto. (« je n'ai pas de voiture », neutre)", a: ["kein"], ph: "un article", exp: "kein Auto." },
    { type: "input", q: "Complète : Ich habe ___ Zeit. (« je n'ai pas de temps », féminin)", a: ["keine"], ph: "un article", exp: "keine Zeit." },
    { type: "input", q: "Complète : Ich habe ___ Kinder. (« je n'ai pas d'enfants », pluriel)", a: ["keine"], ph: "un article", exp: "Au pluriel : keine Kinder." }
  ],
  final: {
    title: "Exercice final — ein ou eine, et sa négation",
    intro: `<p>Choisis ein / eine (« un / une ») puis, quand c'est demandé, sa négation kein / keine. Le genre est indiqué.</p>`,
    questions: [
      { type: "qcm", q: "___ Hund (un chien, masculin)", opts: ["ein", "eine", "einen", "kein"], a: 0, exp: "Masculin → ein Hund." },
      { type: "qcm", q: "___ Katze (un chat / une chatte, féminin)", opts: ["eine", "ein", "einer", "keine"], a: 0, exp: "Féminin → eine Katze." },
      { type: "qcm", q: "___ Fenster (une fenêtre, neutre)", opts: ["ein", "eine", "das", "einem"], a: 0, exp: "Neutre → ein Fenster." },
      { type: "input", q: "Nie « J'ai un frère » : Ich habe ___ Bruder. (« pas de frère », masculin)", a: ["keinen"], ph: "un article", exp: "À l'accusatif masculin, kein devient keinen : Ich habe keinen Bruder." },
      { type: "input", q: "« Je n'ai pas de sœur » : Ich habe ___ Schwester. (féminin)", a: ["keine"], ph: "un article", exp: "Féminin → keine Schwester." }
    ],
    solution: `<p>L'article indéfini se résume à deux formes au nominatif : <strong>ein</strong> pour le masculin et le neutre, <strong>eine</strong> pour le féminin ; pas de pluriel (on n'emploie aucun article). Sa négation est <strong>kein / keine</strong>, qui se décline comme ein avec un k- devant, et qui remplace « nicht » quand on nie un nom. Petit aperçu de l'accusatif (jour 15) : au masculin, ein/kein deviennent einen/keinen après un verbe comme haben.</p>`
  }
};
