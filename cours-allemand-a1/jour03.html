<script>
var DAY = {
  num: 3,
  title: "Les pronoms personnels sujets",
  subtitle: "Qui fait l'action : ich, du, er, sie, es, wir, ihr, sie, Sie.",
  theory: `
<h3>1. Qu'est-ce qu'un pronom sujet ?</h3>
<p>Un <strong>pronom personnel sujet</strong> est un petit mot qui remplace la personne (ou la chose) qui fait l'action : « je », « tu », « il »… En allemand, le sujet est presque toujours obligatoire devant le verbe. Voici le tableau complet :</p>
<pre class="pseudo">Singulier                         Pluriel
ich   = je                        wir  = nous
du    = tu (informel)             ihr  = vous (plusieurs personnes qu'on tutoie)
er    = il                        sie  = ils / elles
sie   = elle
es    = il/elle (neutre)          Sie  = vous (politesse, sing. ou pluriel)</pre>
<h3>2. Le piège des trois « sie »</h3>
<p>Trois mots se ressemblent mais ne veulent pas dire la même chose. On les distingue grâce à la <strong>majuscule</strong> et grâce au <strong>verbe</strong> qui suit :</p>
<pre class="pseudo">sie  (minuscule) + verbe au singulier  =  elle      sie ist (elle est)
sie  (minuscule) + verbe au pluriel    =  ils/elles  sie sind (ils sont)
Sie  (MAJUSCULE) + verbe au pluriel    =  vous (poli) Sie sind (vous êtes)</pre>
<div class="warn">La majuscule de <strong>Sie</strong> (vous de politesse) est obligatoire partout dans la phrase. « sie » en minuscule ne veut jamais dire « vous ». Regarde aussi le verbe : « sie ist » = elle est ; « sie sind » = ils sont ou (avec majuscule) vous êtes.</div>
<h3>3. er, sie, es : le genre grammatical</h3>
<p>Pour « il » et « elle », l'allemand choisit le pronom selon le <strong>genre grammatical</strong> du nom, pas selon le sexe réel. Il existe trois genres : masculin (<strong>er</strong>), féminin (<strong>sie</strong>) et neutre (<strong>es</strong>). On approfondira au jour 6, mais retiens le principe :</p>
<pre class="pseudo">der Tisch (la table, masculin)   ->  er ist neu   (il est neuf)
die Lampe (la lampe, feminin)    ->  sie ist neu  (elle est neuve)
das Auto  (la voiture, neutre)   ->  es ist neu   (il/elle est neuf)</pre>
<div class="tip">Ne traduis pas mot à mot : « das Mädchen » (la jeune fille) est neutre → on dit « es ». Le genre est celui du mot allemand, pas du sens.</div>
<h3>4. du, ihr, Sie : trois façons de dire « vous / tu »</h3>
<pre class="pseudo">du   ->  une personne qu'on tutoie          Du bist mein Freund. (Tu es mon ami.)
ihr  ->  plusieurs personnes qu'on tutoie   Ihr seid müde. (Vous êtes fatigués.)
Sie  ->  politesse (1 ou plusieurs)         Sind Sie Herr Klein? (Êtes-vous M. Klein ?)</pre>
<h3>5. Le pronom donne la personne du verbe</h3>
<p>Chaque pronom entraîne une terminaison précise du verbe (jour 4, 5, 10). Le pronom et le verbe forment un couple qu'il faut mémoriser ensemble : ich bin, du bist, er ist…</p>`,
  exercises: [
    { type: "qcm", q: "Quel pronom signifie « nous » ?", opts: ["wir", "ihr", "sie", "uns"], a: 0, exp: "wir = nous." },
    { type: "qcm", q: "Quel pronom signifie « vous » quand on tutoie plusieurs personnes (des amis) ?", opts: ["ihr", "Sie", "du", "wir"], a: 0, exp: "ihr = vous (pluriel familier). Sie = vous de politesse." },
    { type: "qcm", q: "« sie ist » signifie…", opts: ["elle est", "ils sont", "vous êtes", "tu es"], a: 0, exp: "sie + verbe singulier = elle : sie ist = elle est." },
    { type: "qcm", q: "Comment reconnaît-on le « vous » de politesse à l'écrit ?", opts: ["Il s'écrit Sie avec une majuscule", "Il s'écrit toujours en minuscule", "Il n'existe pas à l'écrit", "Il s'écrit Ihr"], a: 0, exp: "Sie de politesse = majuscule obligatoire." },
    { type: "qcm", q: "La table « der Tisch » est masculine. Par quel pronom la remplace-t-on ?", opts: ["er", "sie", "es", "der"], a: 0, exp: "Masculin → er (« il »)." },
    { type: "qcm", q: "« das Auto » (la voiture) est neutre. Quel pronom ?", opts: ["es", "er", "sie", "das"], a: 0, exp: "Neutre → es." },
    { type: "vf", q: "« sie sind » peut vouloir dire « ils sont » ou (avec majuscule, Sie sind) « vous êtes ».", a: true, exp: "Le verbe pluriel « sind » va avec sie (ils) et Sie (vous poli)." },
    { type: "vf", q: "En allemand, on peut normalement supprimer le pronom sujet devant le verbe.", a: false, exp: "Faux : contrairement à l'italien ou l'espagnol, le sujet est presque toujours obligatoire." },
    { type: "vf", q: "Le pronom pour « il » et « elle » dépend du genre grammatical du nom allemand.", a: true, exp: "der → er, die → sie, das → es, indépendamment du sexe réel." },
    { type: "input", q: "Traduis « je » en allemand.", a: ["ich"], ph: "un mot", exp: "ich = je." },
    { type: "input", q: "Traduis « tu » (informel) en allemand.", a: ["du"], ph: "un mot", exp: "du = tu." },
    { type: "input", q: "Traduis « ils / elles » en allemand (pluriel).", a: ["sie"], ph: "un mot", exp: "sie (minuscule) + verbe pluriel = ils/elles." },
    { type: "input", q: "Complète : ___ seid müde. (« vous êtes fatigués », plusieurs amis)", a: ["ihr"], ph: "un pronom", exp: "ihr seid = vous êtes (pluriel familier)." },
    { type: "input", q: "Complète : ___ ist neu. (la lampe = die Lampe, féminine)", a: ["sie"], ph: "un pronom", exp: "die Lampe est féminine → sie ist neu." },
    { type: "input", q: "Complète : ___ kommen aus Berlin. (« nous venons de Berlin »)", a: ["wir"], ph: "un pronom", exp: "wir = nous : Wir kommen aus Berlin." }
  ],
  final: {
    title: "Exercice final — Choisir le bon pronom",
    intro: `<p>Choisis le pronom qui convient. Souviens-toi : le genre du nom décide de er/sie/es, et la majuscule de Sie signale la politesse.</p>`,
    questions: [
      { type: "qcm", q: "Anna parle d'elle-même : « ___ heiße Anna. »", opts: ["Ich", "Du", "Er", "Wir"], a: 0, exp: "Elle parle d'elle-même → ich." },
      { type: "qcm", q: "Tu parles à un enfant : « ___ bist nett. » (tu es gentil)", opts: ["Du", "Sie", "Ihr", "Er"], a: 0, exp: "Un enfant se tutoie → du." },
      { type: "qcm", q: "« der Hund » (le chien, masculin) : « ___ ist groß. »", opts: ["Er", "Sie", "Es", "Ihr"], a: 0, exp: "Masculin → er." },
      { type: "qcm", q: "Tu t'adresses poliment à une inconnue : « Wie heißen ___ ? »", opts: ["Sie", "du", "ihr", "sie"], a: 0, exp: "Politesse → Sie (majuscule)." },
      { type: "input", q: "« das Kind » (l'enfant, neutre) : « ___ ist klein. » Quel pronom ?", a: ["es"], ph: "un pronom", exp: "das Kind est neutre → es ist klein." }
    ],
    solution: `<p>Le système des pronoms allemands se retient en deux temps. D'abord la liste : <strong>ich, du, er, sie, es, wir, ihr, sie, Sie</strong>. Ensuite les deux pièges : le genre grammatical commande <strong>er / sie / es</strong> (le nom allemand décide, pas le sens), et la <strong>majuscule de Sie</strong> distingue le « vous » poli des « sie » (elle / ils). Chaque pronom appelle sa propre forme du verbe : c'est le socle de toute la conjugaison à venir.</p>`
  }
};
</script>
