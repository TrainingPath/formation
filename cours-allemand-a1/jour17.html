<script>
var DAY = {
  num: 17,
  title: "Les verbes de modalité (können, wollen...)",
  subtitle: "Pouvoir, vouloir, devoir — et le rejet de l'infinitif à la fin.",
  theory: `
<h3>1. Que sont les verbes de modalité ?</h3>
<p>Les <strong>verbes de modalité</strong> (ou modaux) expriment une nuance : la capacité, la volonté, l'obligation, la permission. On les emploie presque toujours avec un <strong>second verbe à l'infinitif</strong>. Les six principaux :</p>
<pre class="pseudo">können  → pouvoir (capacité)      Ich kann schwimmen.   → Je sais nager.
wollen  → vouloir                 Ich will schlafen.    → Je veux dormir.
müssen  → devoir (obligation)     Ich muss arbeiten.    → Je dois travailler.
dürfen  → avoir le droit          Ich darf spielen.     → J'ai le droit de jouer.
sollen  → devoir (conseil/ordre)  Du sollst lernen.     → Tu devrais apprendre.
mögen   → aimer (bien)            Ich mag Kaffee.       → J'aime le café.</pre>
<h3>2. Une conjugaison irrégulière au singulier</h3>
<p>Au singulier, les modaux changent souvent de voyelle et le <strong>ich</strong> et le <strong>er/sie/es</strong> ont la <strong>même forme</strong> (sans terminaison). Exemple avec können :</p>
<pre class="pseudo">ich       kann        wir      können
du        kannst      ihr      könnt
er/sie/es kann        sie/Sie  können</pre>
<pre class="pseudo">wollen : ich will, du willst, er will, wir wollen...
müssen : ich muss, du musst, er muss, wir müssen...
dürfen : ich darf, du darfst, er darf, wir dürfen...</pre>
<div class="tip">Astuce : au singulier, le « je » et le « il/elle » sont identiques (ich kann / er kann). C'est le contraire des verbes normaux (ich spiele / er spielt).</div>
<h3>3. LE POINT CLÉ : le rejet de l'infinitif à la fin</h3>
<p>C'est la règle la plus importante du jour. Quand une phrase contient un modal, le verbe modal se conjugue en <strong>2e position</strong>, mais le <strong>second verbe reste à l'infinitif et part TOUT À LA FIN</strong> de la phrase.</p>
<pre class="pseudo">Ich   kann    gut Deutsch   sprechen.
 |     |                       |
 sujet MODAL (2e position)     INFINITIF rejeté à la fin
→ Je sais bien parler allemand.</pre>
<pre class="pseudo">Français : Je veux    manger    une pomme maintenant.
Allemand : Ich will [ ......... ] einen Apfel jetzt essen.
           → l'infinitif « essen » saute à la toute fin !</pre>
<div class="warn">Erreur classique du francophone : « Ich will essen einen Apfel » est FAUX. L'infinitif ne peut jamais rester à côté du modal : il est <strong>rejeté à la fin</strong>. La bonne phrase est « Ich will einen Apfel essen ».</div>
<h3>4. À la forme négative et interrogative</h3>
<pre class="pseudo">Ich kann heute nicht kommen.   → Je ne peux pas venir aujourd'hui.
Kannst du schwimmen?            → Sais-tu nager ? (modal en 1re position, infinitif à la fin)</pre>`,
  exercises: [
    { type: "input", q: "Conjugue können avec ich : « Ich ___ schwimmen. » (je sais nager)", a: ["kann"], ph: "verbe", exp: "ich kann : au singulier, pas de terminaison." },
    { type: "input", q: "Conjugue können avec du : « Du ___ gut singen. » (tu sais bien chanter)", a: ["kannst"], ph: "verbe", exp: "du kannst." },
    { type: "qcm", q: "Quelle phrase respecte le rejet de l'infinitif à la fin ?", opts: ["Ich will essen eine Pizza.", "Ich will eine Pizza essen.", "Ich essen will eine Pizza.", "Essen ich will eine Pizza."], a: 1, exp: "Le modal (will) en 2e position, l'infinitif (essen) tout à la fin." },
    { type: "qcm", q: "Où se place le second verbe (à l'infinitif) dans une phrase avec modal ?", opts: ["Juste après le modal", "À la fin de la phrase", "En 1re position", "Il disparaît"], a: 1, exp: "L'infinitif est rejeté tout à la fin : c'est LA règle des modaux." },
    { type: "input", q: "Complète (müssen, je) : « Ich ___ arbeiten. » (je dois travailler)", a: ["muss", "muß"], ph: "verbe", exp: "ich muss (müssen : ich muss, du musst, er muss)." },
    { type: "input", q: "Complète (wollen, il) : « Er ___ schlafen. » (il veut dormir)", a: ["will"], ph: "verbe", exp: "er will : au singulier ich et er sont identiques (ich will / er will)." },
    { type: "qcm", q: "Que signifie « Ich darf spielen » ?", opts: ["Je dois jouer", "Je veux jouer", "J'ai le droit de jouer", "Je sais jouer"], a: 2, exp: "dürfen = avoir la permission / le droit." },
    { type: "qcm", q: "« Ich muss arbeiten » exprime :", opts: ["une capacité", "une obligation", "une envie", "une permission"], a: 1, exp: "müssen = devoir, obligation." },
    { type: "input", q: "Remets dans l'ordre : « ich / heute / kann / kommen / nicht » → « Ich kann heute nicht ___. » (je ne peux pas venir aujourd'hui)", a: ["kommen"], ph: "infinitif", exp: "L'infinitif kommen est rejeté à la toute fin." },
    { type: "input", q: "Traduis « Sais-tu nager ? » : « ___ du schwimmen? »", a: ["kannst"], ph: "verbe", exp: "Question : modal en 1re position (Kannst du...), infinitif à la fin." },
    { type: "vf", q: "Avec un modal, le second verbe est à l'infinitif et se place à la fin de la phrase.", a: true, exp: "C'est la règle centrale : rejet de l'infinitif à la fin." },
    { type: "vf", q: "Au singulier, « ich » et « er » ont la même forme du modal (ich kann / er kann).", a: true, exp: "Particularité des modaux : pas de -t au er/sie/es." },
    { type: "vf", q: "« Ich will einen Kaffee trinken » est correct.", a: true, exp: "will en 2e position, trinken (infinitif) à la fin : parfait." },
    { type: "qcm", q: "Conjugaison de wollen avec wir :", opts: ["wir will", "wir wollt", "wir wollen", "wir willst"], a: 2, exp: "Au pluriel, on retrouve la forme régulière : wir wollen." },
    { type: "qcm", q: "« Du ___ mehr lernen. » (tu devrais apprendre davantage — conseil)", opts: ["sollst", "kannst", "darfst", "willst"], a: 0, exp: "sollen exprime le conseil/l'ordre ; du sollst." }
  ],
  final: {
    title: "Exercice final — Les projets du week-end",
    intro: `<p>Lisez, puis répondez.</p>
<pre class="pseudo">Am Samstag will ich lange schlafen.
Ich kann Fußball spielen, aber ich muss auch lernen.
Am Sonntag darf ich ins Kino gehen.</pre>
<p><em>Traduction : Samedi, je veux dormir longtemps. Je sais/peux jouer au foot, mais je dois aussi étudier. Dimanche, j'ai le droit d'aller au cinéma.</em></p>`,
    questions: [
      { type: "qcm", q: "Dans « Am Samstag will ich lange schlafen », où est l'infinitif ?", opts: ["Après will", "À la fin (schlafen)", "En 1re position", "Il n'y en a pas"], a: 1, exp: "schlafen est rejeté à la fin ; will occupe la 2e position." },
      { type: "input", q: "Quel modal exprime l'obligation dans le texte ? (forme conjuguée)", a: ["muss", "muß"], ph: "verbe", exp: "ich muss auch lernen = je dois aussi étudier." },
      { type: "qcm", q: "« Ich darf ins Kino gehen » signifie :", opts: ["Je dois aller au cinéma", "J'ai le droit d'aller au cinéma", "Je sais aller au cinéma", "Je veux aller au cinéma"], a: 1, exp: "dürfen = avoir la permission." },
      { type: "qcm", q: "Pourquoi « will » est-il en 2e position ?", opts: ["Par hasard", "Car le verbe conjugué occupe toujours la 2e position en allemand", "Car c'est un nom", "Ce n'est pas correct"], a: 1, exp: "Le verbe conjugué (ici le modal) est en 2e position ; l'infinitif part à la fin." },
      { type: "input", q: "Traduis « Je veux dormir » : « Ich will ___. »", a: ["schlafen"], ph: "infinitif", exp: "L'infinitif schlafen est rejeté à la fin." }
    ],
    solution: `<p>Structure de chaque phrase du texte :</p>
<pre class="pseudo">Am Samstag  will  ich lange   schlafen.   → modal 2e, infinitif à la fin
Ich  kann  Fußball  spielen.              → modal 2e, infinitif à la fin
Ich  muss  auch     lernen.               → modal 2e, infinitif à la fin
Am Sonntag  darf  ich ins Kino  gehen.    → modal 2e, infinitif à la fin</pre>
<p>La règle est toujours la même : verbe conjugué (le modal) en 2e position, verbe à l'infinitif rejeté tout à la fin. C'est le réflexe à automatiser.</p>`
  }
};
</script>
