<script>
var DAY = {
  num: 29,
  title: "Révisions A1 + petit texte",
  subtitle: "Tout relire à travers un texte simple sur une personne.",
  theory: `
<h3>1. Un petit texte pour tout réviser</h3>
<p>Voici un texte simple qui réunit presque tout le niveau A1. Lis-le à voix haute, puis observe la grammaire ligne par ligne.</p>
<pre class="pseudo">Hallo! Ich heiße Julia und ich bin 25 Jahre alt.
Ich komme aus Österreich, aber ich wohne in Berlin.
Ich habe einen Bruder und eine Schwester.
Am Morgen stehe ich um sieben Uhr auf und trinke einen Kaffee.
Ich arbeite gern, aber am Wochenende will ich mich ausruhen.
Ich mag Musik und ich esse gern Pizza.
Gestern war ich im Kino. Der Film war sehr gut.</pre>
<p><em>Traduction : Bonjour ! Je m'appelle Julia et j'ai 25 ans. Je viens d'Autriche, mais j'habite à Berlin. J'ai un frère et une soeur. Le matin, je me lève à sept heures et je bois un café. J'aime travailler, mais le week-end je veux me reposer. J'aime la musique et j'aime manger de la pizza. Hier, j'étais au cinéma. Le film était très bon.</em></p>
<h3>2. Ce que le texte révise</h3>
<pre class="pseudo">Ich heiße / Ich bin        → se présenter (jours 2, 4)
Ich komme aus / wohne in   → origine et lieu (prépositions, jour 25)
Ich habe einen Bruder      → haben + accusatif (jours 5, 15)
stehe ... auf              → verbe séparable (jour 18)
um sieben Uhr / Am Morgen  → l'heure et les moments (jour 20)
will ich mich ausruhen     → modal + rejet de l'infinitif (jour 17)
Ich mag / esse gern        → les goûts (jour 23)
Gestern war ich / war gut  → le passé (jour 28)</pre>
<h3>3. Les questions de base à savoir poser</h3>
<pre class="pseudo">Wie heißt du?          → Comment t'appelles-tu ?
Woher kommst du?       → D'où viens-tu ?
Wo wohnst du?          → Où habites-tu ?
Wie alt bist du?       → Quel âge as-tu ?
Was machst du gern?    → Qu'aimes-tu faire ?</pre>
<h3>4. Les erreurs à ne plus faire</h3>
<div class="warn">Trois pièges classiques à surveiller :<br>
1. <strong>Le verbe en 2e position</strong> : « Am Morgen <strong>stehe ich</strong> auf » (et non « Am Morgen ich stehe »).<br>
2. <strong>Le rejet de l'infinitif</strong> avec un modal : « Ich will mich <strong>ausruhen</strong> » (infinitif à la fin).<br>
3. <strong>La particule séparable à la fin</strong> : « Ich stehe ... <strong>auf</strong> ».</div>
<div class="tip">Relis chaque phrase du texte en te demandant : où est le verbe conjugué ? est-il bien en 2e position ? C'est le réflexe qui fera de toi un vrai débutant A1 solide.</div>`,
  exercises: [
    { type: "input", q: "D'après le texte : « Ich ___ aus Österreich. » (je viens d'Autriche)", a: ["komme"], ph: "verbe", exp: "kommen aus = venir de : Ich komme aus..." },
    { type: "qcm", q: "« Ich wohne in Berlin » : que signifie wohnen ?", opts: ["travailler", "habiter", "venir", "aimer"], a: 1, exp: "wohnen = habiter." },
    { type: "input", q: "Sépare le verbe : « Am Morgen ___ ich um sieben Uhr auf. » (je me lève)", a: ["stehe"], ph: "verbe", exp: "aufstehen → stehe ... auf ; verbe en 2e position après Am Morgen." },
    { type: "qcm", q: "« will ich mich ausruhen » : où est l'infinitif et pourquoi ?", opts: ["Après will, sans raison", "À la fin (ausruhen), rejeté par le modal will", "En 1re position", "Il n'y en a pas"], a: 1, exp: "Modal + infinitif rejeté à la fin (jour 17)." },
    { type: "input", q: "Accusatif : « Ich habe ___ Bruder. » (j'ai un frère — masculin)", a: ["einen"], ph: "article", exp: "haben + accusatif ; masculin → einen." },
    { type: "qcm", q: "« Ich esse gern Pizza » : rôle de « gern » ?", opts: ["c'est un nom", "il exprime le goût (aimer faire)", "c'est une négation", "c'est un article"], a: 1, exp: "gern après le verbe = aimer faire (jour 23)." },
    { type: "input", q: "Passé : « Gestern ___ ich im Kino. » (hier j'étais au cinéma)", a: ["war"], ph: "verbe", exp: "ich war = j'étais (jour 28)." },
    { type: "qcm", q: "« Der Film war sehr gut » : à quel temps ?", opts: ["présent", "passé (war)", "futur", "impératif"], a: 1, exp: "war = était : passé de sein." },
    { type: "input", q: "Question : « Wie ___ du? » (comment t'appelles-tu ?)", a: ["heißt", "heisst"], ph: "verbe", exp: "Wie heißt du ? = comment t'appelles-tu ?" },
    { type: "qcm", q: "« Woher kommst du? » demande :", opts: ["ton âge", "d'où tu viens", "où tu habites", "ton nom"], a: 1, exp: "woher = d'où ; kommen = venir." },
    { type: "vf", q: "Dans « Am Morgen stehe ich auf », le verbe est bien en 2e position.", a: true, exp: "Après un complément initial, le sujet passe après le verbe." },
    { type: "vf", q: "Avec le modal will, l'infinitif « ausruhen » se place à la fin de la phrase.", a: true, exp: "Rejet de l'infinitif à la fin : règle des modaux." },
    { type: "vf", q: "« Am Morgen ich stehe auf » est une phrase correcte.", a: false, exp: "FAUX : le verbe doit être en 2e position → Am Morgen stehe ich auf." },
    { type: "input", q: "Traduis la question « Quel âge as-tu ? » : « Wie alt ___ du? »", a: ["bist"], ph: "verbe", exp: "Wie alt bist du ? (sein : du bist)." },
    { type: "qcm", q: "Quel verbe est un modal dans le texte ?", opts: ["heißen", "wollen (will)", "wohnen", "trinken"], a: 1, exp: "will = wollen (vouloir), verbe de modalité." }
  ],
  final: {
    title: "Exercice final — Comprendre Julia",
    intro: `<p>Relisez le texte de la théorie sur Julia, puis répondez à ces questions de compréhension.</p>
<pre class="pseudo">Julia, 25 Jahre, aus Österreich, wohnt in Berlin,
1 Bruder + 1 Schwester, steht um 7 Uhr auf,
mag Musik, isst gern Pizza, war gestern im Kino.</pre>`,
    questions: [
      { type: "qcm", q: "Quel âge a Julia ?", opts: ["15 ans", "25 ans", "35 ans", "20 ans"], a: 1, exp: "Ich bin 25 Jahre alt." },
      { type: "qcm", q: "D'où vient Julia ?", opts: ["d'Allemagne", "d'Autriche (Österreich)", "de Suisse", "de Berlin"], a: 1, exp: "Ich komme aus Österreich (elle habite Berlin mais vient d'Autriche)." },
      { type: "input", q: "À quelle heure Julia se lève-t-elle ? (le nombre en allemand, comme dans le texte)", a: ["sieben"], ph: "en allemand", exp: "um sieben Uhr = à sept heures." },
      { type: "qcm", q: "Que veut faire Julia le week-end ?", opts: ["travailler", "se reposer (sich ausruhen)", "aller au cinéma", "cuisiner"], a: 1, exp: "am Wochenende will ich mich ausruhen." },
      { type: "input", q: "Où était Julia hier ? « im ___ » (comme dans le texte)", a: ["kino"], ph: "en allemand", exp: "Gestern war ich im Kino = hier j'étais au cinéma." }
    ],
    solution: `<p>Le texte de Julia mobilise l'essentiel du niveau A1 :</p>
<pre class="pseudo">se présenter (heiße, bin, komme aus, wohne in)
la famille + accusatif (habe einen Bruder)
verbe séparable (stehe auf) + l'heure (um sieben)
modal + infinitif rejeté (will ... ausruhen)
les goûts (mag, esse gern)
le passé (war)</pre>
<p>Si tu comprends ce texte et sais en produire un semblable, tu maîtrises le coeur du niveau A1. Demain, le bilan final !</p>`
  }
};
