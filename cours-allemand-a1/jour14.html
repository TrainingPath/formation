<script>
var DAY = {
  num: 14,
  title: "Poser des questions (W-Fragen)",
  subtitle: "Deux types de questions : oui/non et les mots en W.",
  theory: `
<h3>1. Deux grandes familles de questions</h3>
<p>En allemand, il y a deux façons de poser une question :</p>
<pre class="pseudo">1. Question fermée (reponse oui/non)  ->  verbe en 1re position
2. Question ouverte (W-Frage)         ->  mot en W en 1re position, verbe en 2e</pre>
<h3>2. La question fermée : verbe en tête</h3>
<p>Pour une question à laquelle on répond par <strong>ja</strong> ou <strong>nein</strong>, on place le <strong>verbe conjugué en première position</strong>, avant le sujet :</p>
<pre class="pseudo">Declaratif : Du spielst Tennis.   // Tu joues au tennis.
Question   : Spielst du Tennis?   // Joues-tu au tennis ?
             Bist du müde?        // Es-tu fatigué ?
             Hast du Zeit?        // As-tu le temps ?</pre>
<h3>3. Les mots interrogatifs en W</h3>
<p>Pour demander une information précise, on utilise un <strong>mot interrogatif</strong>. En allemand, ils commencent presque tous par la lettre <strong>W</strong> — d'où le nom « W-Fragen » :</p>
<pre class="pseudo">wer    = qui          Wer bist du?          (Qui es-tu ?)
was    = quoi/que     Was machst du?        (Que fais-tu ?)
wo     = ou           Wo wohnst du?         (Où habites-tu ?)
woher  = d'ou         Woher kommst du?      (D'où viens-tu ?)
wohin  = ou (vers)    Wohin gehst du?       (Où vas-tu ?)
wann   = quand        Wann kommst du?       (Quand viens-tu ?)
wie    = comment      Wie heißt du?         (Comment t'appelles-tu ?)
warum  = pourquoi     Warum lernst du das?  (Pourquoi apprends-tu cela ?)
wie viel = combien    Wie viel kostet das?  (Combien ça coûte ?)</pre>
<h3>4. La structure de la W-Frage</h3>
<p>Le mot en W occupe la <strong>position 1</strong>, et le verbe conjugué reste en <strong>position 2</strong> (la règle V2 du jour 12 s'applique). Le sujet vient juste après le verbe :</p>
<pre class="pseudo">Position 1     Position 2 (VERBE)   Sujet     reste
Wo             wohnst               du?
Wann           kommt                der Zug?    // Quand arrive le train ?
Wie            heißt                du?</pre>
<div class="warn">Ne confonds pas <strong>wo</strong> (où, lieu fixe) et <strong>wer</strong> (qui, personne). Attention aussi : <strong>wer</strong> = qui, alors qu'en anglais « where » ressemble à « wo ». Piège classique !</div>
<h3>5. Distinguer wo / woher / wohin</h3>
<pre class="pseudo">wo    = ou ? (position, on ne bouge pas)     Wo bist du?     (Où es-tu ?)
woher = d'ou ? (provenance)                   Woher kommst du? (D'où viens-tu ?)
wohin = ou ? (destination, mouvement vers)    Wohin fährst du? (Où vas-tu ?)</pre>
<div class="tip">Moyen mnémotechnique : woHER = provenance (« her » = vers moi, d'où l'on vient) ; woHIN = destination (« hin » = vers là-bas, où l'on va).</div>`,
  exercises: [
    { type: "qcm", q: "Dans une question fermée (oui/non), le verbe est en position…", opts: ["1", "2", "3", "dernière"], a: 0, exp: "Spielst du Tennis? : verbe en tête." },
    { type: "qcm", q: "Que signifie « wo » ?", opts: ["où (lieu)", "qui", "quoi", "quand"], a: 0, exp: "wo = où. (wer = qui.)" },
    { type: "qcm", q: "Que signifie « wer » ?", opts: ["qui", "où", "comment", "pourquoi"], a: 0, exp: "wer = qui. Ne pas confondre avec l'anglais « where »." },
    { type: "qcm", q: "Dans une W-Frage, le verbe est en position…", opts: ["2 (après le mot en W)", "1", "3", "dernière"], a: 0, exp: "Wo wohnst du? : le verbe reste en 2e position." },
    { type: "qcm", q: "Quelle question demande la provenance (« d'où ? ») ?", opts: ["Woher kommst du?", "Wohin gehst du?", "Wo bist du?", "Wann kommst du?"], a: 0, exp: "woher = d'où (provenance)." },
    { type: "qcm", q: "« Was machst du? » veut dire…", opts: ["Que fais-tu ?", "Qui es-tu ?", "Où vas-tu ?", "Quand pars-tu ?"], a: 0, exp: "was = quoi/que ; machen = faire." },
    { type: "vf", q: "Presque tous les mots interrogatifs allemands commencent par W.", a: true, exp: "wer, was, wo, wann, wie, warum… d'où « W-Fragen »." },
    { type: "vf", q: "« wohin » demande la destination (où l'on va).", a: true, exp: "woHIN = vers là-bas (destination)." },
    { type: "vf", q: "Pour « Habites-tu à Berlin ? », on écrit « Du wohnst in Berlin? » sans changer l'ordre.", a: false, exp: "Faux : question fermée = verbe en tête : « Wohnst du in Berlin? »." },
    { type: "input", q: "Complète : ___ heißt du? (« comment t'appelles-tu ? »)", a: ["wie"], ph: "un mot en W", exp: "Wie heißt du?" },
    { type: "input", q: "Complète : ___ wohnst du? (« où habites-tu ? »)", a: ["wo"], ph: "un mot en W", exp: "Wo wohnst du?" },
    { type: "input", q: "Complète : ___ kommst du? (« d'où viens-tu ? »)", a: ["woher"], ph: "un mot en W", exp: "Woher kommst du?" },
    { type: "input", q: "Complète : ___ kommt der Zug? (« quand arrive le train ? »)", a: ["wann"], ph: "un mot en W", exp: "Wann kommt der Zug?" },
    { type: "input", q: "Transforme en question fermée : « Du hast Zeit. » → « ___ du Zeit? »", a: ["hast"], ph: "un verbe", exp: "Hast du Zeit? (verbe en tête)." },
    { type: "input", q: "Complète : ___ lernst du Deutsch? (« pourquoi apprends-tu l'allemand ? »)", a: ["warum"], ph: "un mot en W", exp: "Warum lernst du Deutsch?" }
  ],
  final: {
    title: "Exercice final — L'interview",
    intro: `<p>Un mini-dialogue de questions, puis des questions à compléter. Rappelle-toi : oui/non → verbe en 1 ; mot en W → verbe en 2.</p>
<pre class="pseudo">— Wie heißt du? — Ich heiße Mia.                 // Comment t'appelles-tu ? — Je m'appelle Mia.
— Woher kommst du? — Ich komme aus Wien.          // D'où viens-tu ? — Je viens de Vienne.
— Wohnst du in Berlin? — Nein, in München.        // Habites-tu à Berlin ? — Non, à Munich.</pre>`,
    questions: [
      { type: "qcm", q: "« Wohnst du in Berlin? » est une question…", opts: ["fermée (oui/non), verbe en 1re position", "ouverte avec un mot en W", "déclarative", "incorrecte"], a: 0, exp: "Pas de mot en W, verbe en tête → question fermée." },
      { type: "qcm", q: "Pour demander l'origine de Mia, on utilise…", opts: ["Woher", "Wohin", "Wann", "Warum"], a: 0, exp: "woher = d'où : Woher kommst du?" },
      { type: "input", q: "Complète : ___ heißt du? (« comment »)", a: ["wie"], ph: "un mot en W", exp: "Wie heißt du?" },
      { type: "input", q: "Transforme en question fermée : « Du sprichst Deutsch. » → « ___ du Deutsch? »", a: ["sprichst"], ph: "un verbe", exp: "Sprichst du Deutsch? (verbe en tête)." },
      { type: "qcm", q: "Quelle question veut dire « Où vas-tu ? » (destination)", opts: ["Wohin gehst du?", "Wo bist du?", "Woher kommst du?", "Wann gehst du?"], a: 0, exp: "wohin = destination : Wohin gehst du?" }
    ],
    solution: `<p>Deux moules à maîtriser. La <strong>question fermée</strong> (réponse ja/nein) place le <strong>verbe en position 1</strong> : « Spielst du Tennis? ». La <strong>W-Frage</strong> place un <strong>mot interrogatif en position 1</strong> et garde le <strong>verbe en position 2</strong> : « Wo wohnst du? ». Apprends la liste des mots en W (wer, was, wo, woher, wohin, wann, wie, warum) et surtout ne confonds pas <strong>wer</strong> (qui) avec l'anglais « where », ni <strong>wo / woher / wohin</strong> (lieu / provenance / destination).</p>`
  }
};
</script>
