<script>
var DAY = {
  num: 16,
  title: "Les adjectifs possessifs",
  subtitle: "Dire à qui appartient une chose : mein, dein, sein...",
  theory: `
<h3>1. À quoi servent-ils ?</h3>
<p>Un adjectif possessif indique <strong>à qui appartient</strong> quelque chose : « <em>mon</em> livre », « <em>ta</em> sœur », « <em>notre</em> maison ». En allemand, chaque pronom personnel (ich, du, er...) possède son propre possessif.</p>
<pre class="pseudo">ich   → mein   (mon, ma)          wir  → unser  (notre)
du    → dein   (ton, ta)          ihr  → euer   (votre, à vous, tutoiement pluriel)
er    → sein   (son, sa — à lui)  sie  → ihr    (leur, à eux)
sie   → ihr    (son, sa — à elle) Sie  → Ihr    (votre, forme polie)
es    → sein   (son, sa — neutre)</pre>
<div class="warn">Attention à ne pas confondre : <strong>ihr</strong> peut vouloir dire « son/sa (à elle) », « leur » OU être le pronom « vous » (tutoiement pluriel). C'est le contexte qui tranche. <strong>Ihr</strong> avec majuscule = « votre » (politesse).</div>
<h3>2. Les terminaisons : comme ein et kein</h3>
<p>Un possessif se termine exactement comme l'article <strong>ein</strong> / <strong>kein</strong> (vu au jour 15). Au <strong>nominatif</strong> (le sujet) :</p>
<pre class="pseudo">masculin (der Vater) → mein Vater     (pas de terminaison)  → mon père
neutre   (das Kind)  → mein Kind      (pas de terminaison)  → mon enfant
féminin  (die Mutter)→ meine Mutter   (terminaison -e)       → ma mère
pluriel  (die Eltern)→ meine Eltern   (terminaison -e)       → mes parents</pre>
<h3>3. À l'accusatif, seul le masculin change</h3>
<p>Comme pour l'article, à l'<strong>accusatif</strong> (le complément d'objet direct, jour 15), on ajoute <strong>-en</strong> uniquement au masculin. Le féminin, le neutre et le pluriel ne bougent pas.</p>
<pre class="pseudo">Ich sehe meinen Vater.      → Je vois mon père.     (masc. → -en)
Ich sehe meine Mutter.      → Je vois ma mère.       (fém. inchangé)
Ich habe mein Buch.         → J'ai mon livre.        (neutre inchangé)
Ich liebe meine Eltern.     → J'aime mes parents.    (pluriel inchangé)</pre>
<div class="tip">Le tableau des terminaisons est identique pour tous les possessifs : mein, dein, sein, ihr, unser, euer, Ihr. Apprends-en un seul, tu les connais tous.</div>
<h3>4. Le cas particulier de euer</h3>
<p>Quand <strong>euer</strong> (votre) reçoit une terminaison, il perd son deuxième <strong>e</strong> : euer + e = <strong>eure</strong>, euer + en = <strong>euren</strong>.</p>
<pre class="pseudo">euer Vater   → votre père        eure Mutter → votre mère
Ich sehe euren Vater. → Je vois votre père.</pre>`,
  exercises: [
    { type: "input", q: "Complète : « ___ Mutter ist nett. » (ma mère est gentille — mère est féminin)", a: ["meine"], ph: "possessif", exp: "Féminin au nominatif → meine Mutter." },
    { type: "input", q: "Complète : « ___ Vater arbeitet. » (mon père travaille — père est masculin, sujet)", a: ["mein"], ph: "possessif", exp: "Masculin au nominatif → pas de terminaison : mein Vater." },
    { type: "input", q: "Accusatif : « Ich sehe ___ Vater. » (je vois mon père — masculin, COD)", a: ["meinen"], ph: "possessif", exp: "Masculin accusatif → -en : meinen Vater." },
    { type: "qcm", q: "Quel possessif correspond à <strong>du</strong> ?", opts: ["mein", "dein", "sein", "ihr"], a: 1, exp: "du → dein (ton, ta)." },
    { type: "qcm", q: "« <em>son</em> chien à <strong>elle</strong> » se dit :", opts: ["sein Hund", "ihr Hund", "dein Hund", "euer Hund"], a: 1, exp: "Pour une possédeuse (sie = elle), on emploie ihr." },
    { type: "qcm", q: "« <em>son</em> chien à <strong>lui</strong> » se dit :", opts: ["ihr Hund", "sein Hund", "unser Hund", "mein Hund"], a: 1, exp: "Pour un possédeur (er = il), on emploie sein." },
    { type: "input", q: "Complète : « ___ Kind spielt. » (notre enfant joue — Kind est neutre, sujet ; possessif « notre »)", a: ["unser"], ph: "possessif", exp: "wir → unser ; neutre nominatif → pas de terminaison : unser Kind." },
    { type: "qcm", q: "« ___ Eltern sind hier. » (vos parents sont là, forme polie Sie)", opts: ["Ihre", "eure", "ihre", "unsere"], a: 0, exp: "Forme polie → Ihr avec majuscule ; pluriel → -e : Ihre Eltern." },
    { type: "input", q: "Complète : « Ich liebe ___ Eltern. » (j'aime mes parents — pluriel, COD)", a: ["meine"], ph: "possessif", exp: "Pluriel accusatif → -e (inchangé) : meine Eltern." },
    { type: "vf", q: "À l'accusatif, on ajoute -en au possessif masculin (ex. : meinen Vater).", a: true, exp: "Exactement comme ein → einen. Seul le masculin change à l'accusatif." },
    { type: "vf", q: "« unsere Mutter » est correct pour « notre mère ».", a: true, exp: "unser + e (féminin) = unsere Mutter." },
    { type: "vf", q: "Le possessif « ihr » peut signifier « son (à elle) », « leur » ou « votre (tutoiement pluriel) ».", a: true, exp: "Trois valeurs possibles ; seul le contexte les distingue." },
    { type: "qcm", q: "Que devient <strong>euer</strong> devant une terminaison (ex. votre mère) ?", opts: ["euere Mutter", "eure Mutter", "euren Mutter", "euer Mutter"], a: 1, exp: "euer perd son 2e e : eure Mutter." },
    { type: "input", q: "Complète : « ___ Buch ist neu. » (ton livre est neuf — Buch est neutre, sujet)", a: ["dein"], ph: "possessif", exp: "du → dein ; neutre nominatif → pas de terminaison : dein Buch." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich sehe meine Vater.", "Ich sehe meinen Vater.", "Ich sehe mein Vaters.", "Ich sehe meiner Vater."], a: 1, exp: "Masculin à l'accusatif → meinen Vater." }
  ],
  final: {
    title: "Exercice final — La famille de Lena",
    intro: `<p>Lisez ce petit texte, puis répondez.</p>
<pre class="pseudo">Das ist meine Familie. Mein Vater heißt Thomas.
Meine Mutter heißt Anna. Ich liebe meine Eltern.
Mein Bruder ist zehn Jahre alt. Sein Hund ist klein.</pre>
<p><em>Traduction : Voici ma famille. Mon père s'appelle Thomas. Ma mère s'appelle Anna. J'aime mes parents. Mon frère a dix ans. Son chien est petit.</em></p>`,
    questions: [
      { type: "qcm", q: "« Mein Vater » : pourquoi pas de terminaison ?", opts: ["Vater est féminin", "Vater est masculin au nominatif", "C'est une faute", "Vater est pluriel"], a: 1, exp: "Masculin nominatif → mein sans terminaison." },
      { type: "input", q: "Comment dit-on « ma mère » dans le texte ?", a: ["meine mutter", "meine"], ph: "en allemand", exp: "Féminin → meine Mutter." },
      { type: "qcm", q: "« Ich liebe meine Eltern » : quel cas pour Eltern ?", opts: ["Nominatif", "Accusatif (COD de lieben)", "Datif", "Aucun"], a: 1, exp: "Eltern est le complément d'objet direct → accusatif (pluriel, inchangé)." },
      { type: "qcm", q: "« Sein Hund » désigne le chien de qui ?", opts: ["De Lena", "Du frère (er)", "De la mère", "Des parents"], a: 1, exp: "sein = possessif d'un possédeur masculin : le frère." },
      { type: "input", q: "Traduis « mon frère » (comme dans le texte).", a: ["mein bruder", "mein"], ph: "en allemand", exp: "Bruder est masculin au nominatif → mein Bruder." }
    ],
    solution: `<p>Récapitulatif des possessifs du texte :</p>
<pre class="pseudo">meine Familie  → fém.    → -e
Mein Vater     → masc.   → rien
Meine Mutter   → fém.    → -e
meine Eltern   → pluriel → -e (accusatif inchangé)
Mein Bruder    → masc.   → rien
Sein Hund      → masc., possédeur « er » → sein</pre>
<p>Retiens la logique : d'abord QUI possède (choisit mein/dein/sein/ihr...), puis le GENRE et le CAS de l'objet possédé (choisit la terminaison).</p>`
  }
};
</script>
