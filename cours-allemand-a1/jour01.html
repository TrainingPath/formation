<script>
var DAY = {
  num: 1,
  title: "L'alphabet et la prononciation",
  subtitle: "Reconnaître les lettres allemandes et lire les sons de base.",
  theory: `
<h3>1. L'alphabet allemand</h3>
<p>L'allemand utilise le même alphabet latin que le français : 26 lettres, de A à Z. Trois signes s'ajoutent : les voyelles « à tréma » <strong>ä</strong>, <strong>ö</strong>, <strong>ü</strong> (appelées <em>Umlaut</em>, « voyelles infléchies ») et la lettre <strong>ß</strong> (appelée <em>Eszett</em> ou <em>scharfes S</em>, « s dur »). Bonne nouvelle : l'allemand se lit presque toujours comme il s'écrit. Une fois les règles connues, tu peux lire n'importe quel mot à voix haute.</p>
<pre class="pseudo">a  b  c  d  e  f  g  h  i  j  k  l  m         // premiere moitie de l'alphabet
n  o  p  q  r  s  t  u  v  w  x  y  z         // seconde moitie
ä  ö  ü  ß                                    // les signes propres a l'allemand</pre>
<h3>2. Les voyelles infléchies : ä, ö, ü</h3>
<p>Le tréma (deux points) modifie le son de la voyelle. Retiens ces équivalences approximatives :</p>
<pre class="pseudo">ä  ->  se prononce comme le « è » francais       Käse (le fromage) = « KÈ-ze »
ö  ->  proche du « eu » de « peur »               schön (beau) = « cheun »
ü  ->  le « u » francais (bouche en rond)         für (pour) = « fur »</pre>
<div class="tip">Astuce clavier : sans touche allemande, on remplace ä par <strong>ae</strong>, ö par <strong>oe</strong>, ü par <strong>ue</strong> et ß par <strong>ss</strong>. Ainsi « schön » peut s'écrire « schoen » et « Straße » s'écrit « Strasse ».</div>
<h3>3. La lettre ß</h3>
<p>Le <strong>ß</strong> se prononce toujours comme un <strong>« s » dur</strong> (le son [s], comme « ss » en français, jamais [z]). On l'écrit après une voyelle longue ou une diphtongue. Il n'existe qu'en minuscule ; en majuscules on écrit SS.</p>
<pre class="pseudo">Straße  (la rue)     = « CHTRA-se »     ->  variante : Strasse
weiß    (blanc)      = « vaïss »        ->  variante : weiss
heißen  (s'appeler)  = « HAÏ-ssen »     ->  variante : heissen</pre>
<h3>4. Les groupes de lettres à connaître</h3>
<p>Certaines combinaisons se prononcent d'une façon fixe. Ce sont les plus utiles :</p>
<pre class="pseudo">ei  ->  « aï »   (comme dans « ail »)     mein (mon) = « maïn »
ie  ->  « i » long                        Liebe (l'amour) = « LII-be »
eu  ->  « oï »                            heute (aujourd'hui) = « HOÏ-te »
äu  ->  « oï » aussi                      Häuser (les maisons) = « HOÏ-zer »
au  ->  « aou »                           Haus (la maison) = « haouss »
sch ->  « ch » de « chat »                Schule (l'ecole) = « CHOU-le »
ch  ->  son guttural (raclé)              ich (je) = « ich » ; Buch (le livre) = « boukh »
sp  ->  « chp » en debut de mot           Sport = « chport »
st  ->  « cht » en debut de mot           Stadt (la ville) = « chtatt »</pre>
<h3>5. Des consonnes qui trompent le francophone</h3>
<pre class="pseudo">w  ->  se prononce « v »        Wasser (l'eau) = « VA-ser »
v  ->  se prononce « f »        Vater (le pere) = « FA-ter »
z  ->  se prononce « ts »       Zeit (le temps) = « tsaït »
j  ->  se prononce « y »        ja (oui) = « ya »
s  ->  « z » devant voyelle     Sonne (le soleil) = « ZO-ne »
h  ->  aspire (souffle), pas muet   Haus, Hallo, haben</pre>
<div class="warn">Règle capitale de l'orthographe allemande : <strong>tous les noms communs prennent une majuscule</strong>, où qu'ils soient dans la phrase. On écrit « der Hund » (le chien), « das Auto » (la voiture), « die Schule » (l'école). C'est le piège numéro un des francophones : ne l'oublie jamais.</div>`,
  exercises: [
    { type: "qcm", q: "Comment se prononce la lettre <strong>ß</strong> (comme dans « Straße ») ?", opts: ["Le son [s] dur, comme « ss »", "Le son [z], comme « rose »", "Le son [b]", "Le son [ch]"], a: 0, exp: "Le ß est toujours un « s » dur : Straße se lit « chtrasse »." },
    { type: "qcm", q: "Le groupe <strong>ei</strong> (comme dans « mein ») se prononce…", opts: ["« aï », comme dans « ail »", "« é »", "« i »", "« an »"], a: 0, exp: "ei = « aï ». Attention à ne pas le confondre avec ie." },
    { type: "qcm", q: "Le groupe <strong>ie</strong> (comme dans « Liebe ») se prononce…", opts: ["Un « i » long", "« ié »", "« yé »", "« iè »"], a: 0, exp: "ie = un « i » allongé : Liebe se lit « liibe »." },
    { type: "qcm", q: "Le <strong>w</strong> allemand (« Wasser ») se prononce comme…", opts: ["Le « v » français (vase)", "Le « w » anglais (water)", "Un « ou »", "Rien, il est muet"], a: 0, exp: "w allemand = « v ». Wasser se dit « vasser »." },
    { type: "qcm", q: "Le <strong>v</strong> allemand (« Vater ») se prononce le plus souvent comme…", opts: ["« f »", "« v »", "« b »", "« w »"], a: 0, exp: "Le v allemand se dit « f » : Vater = « fater »." },
    { type: "qcm", q: "Le groupe <strong>sch</strong> (comme dans « Schule ») se prononce comme…", opts: ["Le « ch » de « chat »", "« sk »", "« s » puis « k »", "« ss »"], a: 0, exp: "sch = « ch » français. Schule = « choule »." },
    { type: "vf", q: "En allemand, tous les noms communs (der Hund, das Auto) prennent une majuscule.", a: true, exp: "C'est une règle absolue de l'allemand, contrairement au français." },
    { type: "vf", q: "Le groupe <strong>eu</strong> (comme dans « heute ») se prononce « oï ».", a: true, exp: "eu = « oï » : heute (aujourd'hui) se lit « hoïte »." },
    { type: "vf", q: "En allemand, la lettre <strong>h</strong> en début de mot est toujours muette.", a: false, exp: "Faux : le h est aspiré (soufflé) : Haus, Hallo, haben se prononcent avec un souffle." },
    { type: "input", q: "Écris le mot allemand pour « merci ».", a: ["danke"], ph: "un mot", exp: "« Danke » = merci. On peut renforcer avec « Danke schön »." },
    { type: "input", q: "Écris la salutation allemande courante qui veut dire « salut / bonjour ».", a: ["hallo"], ph: "un mot", exp: "« Hallo » s'utilise à toute heure, comme « salut »." },
    { type: "input", q: "Écris « oui » en allemand.", a: ["ja"], ph: "deux lettres", exp: "« Ja » (prononcé « ya ») = oui." },
    { type: "input", q: "Écris « non » en allemand.", a: ["nein"], ph: "un mot", exp: "« Nein » (prononcé « naïn ») = non." },
    { type: "input", q: "Par quelles deux lettres peut-on remplacer le <strong>ß</strong> quand on n'a pas la touche ?", a: ["ss"], ph: "deux lettres", exp: "ß = ss : « Straße » peut s'écrire « Strasse »." },
    { type: "input", q: "Écris le mot « Straße » (la rue) dans sa variante <strong>sans ß</strong>.", a: ["strasse"], ph: "un mot", exp: "ß devient ss : Strasse." }
  ],
  final: {
    title: "Exercice final — Lire à voix haute",
    intro: `<p>On teste ta lecture des sons allemands. Rappelle-toi : <strong>w</strong> = « v », <strong>v</strong> = « f », <strong>z</strong> = « ts », <strong>ei</strong> = « aï », <strong>ie</strong> = « i » long, <strong>sch</strong> = « ch », et tous les noms prennent une majuscule.</p>`,
    questions: [
      { type: "qcm", q: "Comment prononce-t-on « Wein » (le vin) ?", opts: ["« vaïn »", "« ouine »", "« wéne »", "« bine »"], a: 0, exp: "w = « v », ei = « aï » : « vaïn »." },
      { type: "qcm", q: "Comment prononce-t-on « Zeit » (le temps) ?", opts: ["« tsaït »", "« zé-it »", "« zite »", "« saït »"], a: 0, exp: "z = « ts », ei = « aï » : « tsaït »." },
      { type: "qcm", q: "Comment prononce-t-on « viel » (beaucoup) ?", opts: ["« fiil »", "« viel »", "« viè-le »", "« ouil »"], a: 0, exp: "v = « f », ie = « i » long : « fiil »." },
      { type: "vf", q: "« Schön » (beau) commence par le son « ch » de « chat ».", a: true, exp: "sch = « ch » ; ö = « eu » : « cheun »." },
      { type: "input", q: "Écris le mot allemand pour « salut / bonjour » (revu aujourd'hui).", a: ["hallo"], ph: "un mot", exp: "« Hallo » : la salutation passe-partout." }
    ],
    solution: `<p>L'allemand est une langue « phonétique » : chaque lettre garde presque toujours le même son. Les seuls réflexes à installer sont les faux amis <strong>w=v</strong>, <strong>v=f</strong>, <strong>z=ts</strong>, <strong>s=z</strong> devant voyelle, et les groupes <strong>ei=aï</strong>, <strong>ie=i</strong>, <strong>eu=oï</strong>, <strong>sch=ch</strong>. Ajoute la règle des majuscules pour les noms, et tu peux déjà lire correctement des centaines de mots.</p>`
  }
};
</script>
