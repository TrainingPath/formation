<script>
var ATELIER = {
  prefix: "at-en-a2",
  titre: "🇬🇧 Atelier — Anglais A2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour consolider le niveau A2.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Checking in at the hotel", perso:"Anna · Ben (receptionist)", lignes:[
      {qui:"Anna", txt:"Good evening. I booked a room last week. My name is Anna Meyer.", fr:"Bonsoir. J'ai réservé une chambre la semaine dernière. Je m'appelle Anna Meyer."},
      {qui:"Ben", txt:"Good evening, madam. Let me check... Yes, a double room for three nights.", fr:"Bonsoir, madame. Laissez-moi vérifier... Oui, une chambre double pour trois nuits."},
      {qui:"Anna", txt:"That's right. Is breakfast included in the price?", fr:"C'est exact. Le petit-déjeuner est-il compris dans le prix ?"},
      {qui:"Ben", txt:"Yes, it is. Breakfast is served from seven to ten in the dining room.", fr:"Oui. Le petit-déjeuner est servi de sept à dix heures dans la salle à manger."},
      {qui:"Anna", txt:"Perfect. Do you have a lift? My suitcase is very heavy.", fr:"Parfait. Avez-vous un ascenseur ? Ma valise est très lourde."},
      {qui:"Ben", txt:"Of course. It is on your left, next to the stairs. Your room is on the fourth floor.", fr:"Bien sûr. Il est sur votre gauche, à côté de l'escalier. Votre chambre est au quatrième étage."},
      {qui:"Anna", txt:"Could I have a room with a view, please? I asked for one when I booked.", fr:"Pourrais-je avoir une chambre avec vue, s'il vous plaît ? J'en ai demandé une en réservant."},
      {qui:"Ben", txt:"I am sorry, but the rooms with a view are all full tonight. I will move you tomorrow.", fr:"Je suis désolé, mais les chambres avec vue sont toutes pleines ce soir. Je vous changerai demain."},
      {qui:"Anna", txt:"That is very kind. What time do I have to leave the room on Friday?", fr:"C'est très aimable. À quelle heure dois-je quitter la chambre vendredi ?"},
      {qui:"Ben", txt:"You must check out before eleven. Here is your key. Enjoy your stay!", fr:"Vous devez libérer la chambre avant onze heures. Voici votre clé. Bon séjour !"}
    ]},
    { num:"2", titre:"At the restaurant", perso:"Anna · Waiter", lignes:[
      {qui:"Waiter", txt:"Good evening. Have you booked a table?", fr:"Bonsoir. Avez-vous réservé une table ?"},
      {qui:"Anna", txt:"No, we haven't. Is there a table for two near the window?", fr:"Non. Y a-t-il une table pour deux près de la fenêtre ?"},
      {qui:"Waiter", txt:"Yes, follow me. Here is the menu. Would you like something to drink?", fr:"Oui, suivez-moi. Voici la carte. Souhaitez-vous quelque chose à boire ?"},
      {qui:"Anna", txt:"A bottle of still water, please. Do you have any vegetarian dishes?", fr:"Une bouteille d'eau plate, s'il vous plaît. Avez-vous des plats végétariens ?"},
      {qui:"Waiter", txt:"We have a mushroom soup and a vegetable pie. The pie is our best dish.", fr:"Nous avons une soupe aux champignons et une tourte aux légumes. La tourte est notre meilleur plat."},
      {qui:"Anna", txt:"Then I will try the pie. Is it spicier than the soup?", fr:"Alors je vais essayer la tourte. Est-elle plus épicée que la soupe ?"},
      {qui:"Waiter", txt:"A little, but it is not too hot. Would you like a starter as well?", fr:"Un peu, mais elle n'est pas trop forte. Souhaitez-vous aussi une entrée ?"},
      {qui:"Anna", txt:"No, thank you. I ate a big lunch and I am not very hungry.", fr:"Non merci. J'ai mangé un gros déjeuner et je n'ai pas très faim."},
      {qui:"Waiter", txt:"Very well. I will bring your water in a moment.", fr:"Très bien. Je vous apporte votre eau dans un instant."},
      {qui:"Anna", txt:"Thank you. Could we have the bill together with the dessert, please?", fr:"Merci. Pourrions-nous avoir l'addition en même temps que le dessert, s'il vous plaît ?"}
    ]},
    { num:"3", titre:"At the doctor's", perso:"Anna · Doctor Price", lignes:[
      {qui:"Doctor", txt:"Good morning. Sit down, please. What is the problem?", fr:"Bonjour. Asseyez-vous, je vous prie. Quel est le problème ?"},
      {qui:"Anna", txt:"I have had a sore throat since Monday and I feel very tired.", fr:"J'ai mal à la gorge depuis lundi et je me sens très fatiguée."},
      {qui:"Doctor", txt:"Did you take your temperature this morning?", fr:"Avez-vous pris votre température ce matin ?"},
      {qui:"Anna", txt:"Yes, I did. It was thirty-eight degrees. I also had a headache yesterday.", fr:"Oui. Elle était de trente-huit degrés. J'ai aussi eu mal à la tête hier."},
      {qui:"Doctor", txt:"Open your mouth, please. Your throat is quite red.", fr:"Ouvrez la bouche, s'il vous plaît. Votre gorge est assez rouge."},
      {qui:"Anna", txt:"Is it serious? I am travelling to Scotland on Saturday.", fr:"Est-ce grave ? Je pars en Écosse samedi."},
      {qui:"Doctor", txt:"No, it isn't. You have a bad cold, but you don't need antibiotics.", fr:"Non. Vous avez un gros rhume, mais vous n'avez pas besoin d'antibiotiques."},
      {qui:"Anna", txt:"What should I do, then?", fr:"Que dois-je faire, alors ?"},
      {qui:"Doctor", txt:"You should rest and drink a lot of water. Take this syrup twice a day.", fr:"Vous devriez vous reposer et boire beaucoup d'eau. Prenez ce sirop deux fois par jour."},
      {qui:"Anna", txt:"Thank you, doctor. If I feel worse, I will come back on Friday.", fr:"Merci, docteur. Si je me sens plus mal, je reviendrai vendredi."}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Lisez les trois dialogues, puis dites si chaque affirmation est vraie ou fausse.", exercices:[
      {type:"vf", q:"Anna booked her hotel room a week before her arrival.", a:true, exp:"Elle dit : I booked a room last week (j'ai réservé la semaine dernière)."},
      {type:"vf", q:"Breakfast is not included in the price of the room.", a:false, exp:"Ben répond Yes, it is : le petit-déjeuner est bien compris."},
      {type:"vf", q:"Anna's room is on the fourth floor.", a:true, exp:"Your room is on the fourth floor."},
      {type:"vf", q:"Anna gets a room with a view on the first night.", a:false, exp:"Les chambres avec vue sont pleines ce soir-là ; on la changera demain."},
      {type:"vf", q:"Anna and her friend booked a table at the restaurant.", a:false, exp:"Elle répond No, we haven't (nous n'avons pas réservé)."},
      {type:"vf", q:"Anna orders sparkling water.", a:false, exp:"Elle demande still water, de l'eau plate."},
      {type:"vf", q:"Anna does not want a starter because she had a big lunch.", a:true, exp:"I ate a big lunch and I am not very hungry."},
      {type:"vf", q:"Anna has had a sore throat since Monday.", a:true, exp:"I have had a sore throat since Monday."},
      {type:"vf", q:"The doctor gives Anna antibiotics.", a:false, exp:"You don't need antibiotics : il conseille repos, eau et sirop."},
      {type:"vf", q:"Anna is going to Scotland on Saturday.", a:true, exp:"I am travelling to Scotland on Saturday."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la bonne réponse d'après les dialogues.", exercices:[
      {type:"qcm", q:"How many nights is Anna staying at the hotel?", opts:["One night","Two nights","Three nights","A week"], a:2, exp:"a double room for three nights."},
      {type:"qcm", q:"When is breakfast served?", opts:["From six to nine","From seven to ten","From eight to eleven","All day"], a:1, exp:"Breakfast is served from seven to ten."},
      {type:"qcm", q:"Where is the lift?", opts:["On the right","Behind the desk","On the left, next to the stairs","On the fourth floor"], a:2, exp:"It is on your left, next to the stairs."},
      {type:"qcm", q:"What time must Anna check out on Friday?", opts:["Before ten","Before eleven","Before twelve","After lunch"], a:1, exp:"You must check out before eleven."},
      {type:"qcm", q:"Which table does Anna ask for?", opts:["A table near the door","A table for two near the window","A table outside","A table for four"], a:1, exp:"Is there a table for two near the window?"},
      {type:"qcm", q:"Which dish does the waiter recommend?", opts:["The mushroom soup","The fish","The vegetable pie","The steak"], a:2, exp:"The pie is our best dish."},
      {type:"qcm", q:"Why does Anna refuse a starter?", opts:["It is too expensive","She had a big lunch","She does not like starters","She is in a hurry"], a:1, exp:"I ate a big lunch and I am not very hungry."},
      {type:"qcm", q:"What was Anna's temperature?", opts:["37 degrees","38 degrees","39 degrees","40 degrees"], a:1, exp:"It was thirty-eight degrees."},
      {type:"qcm", q:"What does the doctor say Anna has?", opts:["Flu","A bad cold","A broken arm","An allergy"], a:1, exp:"You have a bad cold."},
      {type:"qcm", q:"How often must Anna take the syrup?", opts:["Once a day","Twice a day","Three times a day","Every hour"], a:1, exp:"Take this syrup twice a day."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase est fausse. Écrivez le mot correct d'après le dialogue.", exercices:[
      {type:"input", q:"Anna booked a single room. → a ______ room", a:["double"], ph:"un mot", exp:"a double room for three nights."},
      {type:"input", q:"Anna's room is on the second floor. → the ______ floor", a:["fourth","4th"], ph:"un mot", exp:"Your room is on the fourth floor."},
      {type:"input", q:"Breakfast is served until nine. → until ______", a:["ten","10"], ph:"un mot", exp:"from seven to ten."},
      {type:"input", q:"Anna's suitcase is very light. → very ______", a:["heavy"], ph:"un mot", exp:"My suitcase is very heavy."},
      {type:"input", q:"Anna orders a bottle of wine. → a bottle of still ______", a:["water"], ph:"un mot", exp:"A bottle of still water, please."},
      {type:"input", q:"The waiter offers a fish pie. → a ______ pie", a:["vegetable"], ph:"un mot", exp:"a vegetable pie."},
      {type:"input", q:"Anna asks for the bill with the coffee. → with the ______", a:["dessert"], ph:"un mot", exp:"the bill together with the dessert."},
      {type:"input", q:"Anna has had a headache since Monday. → a sore ______", a:["throat"], ph:"un mot", exp:"I have had a sore throat since Monday."},
      {type:"input", q:"Anna is travelling to Ireland. → to ______", a:["scotland"], ph:"un pays", exp:"I am travelling to Scotland on Saturday."},
      {type:"input", q:"The doctor tells Anna to drink a lot of tea. → a lot of ______", a:["water"], ph:"un mot", exp:"drink a lot of water."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lisez le texte, puis répondez. — TEXTE : Last summer Anna went to Edinburgh with her sister. They travelled by train because it was cheaper than the plane. The journey took five hours. They stayed in a small hotel near the castle. It was not expensive, but the rooms were very clean. Every morning they had a big Scottish breakfast. On Tuesday it rained all day, so they visited two museums. On Wednesday the weather was better and they walked up a hill. Anna took more than three hundred photos. She says it was the best holiday of her life, and she is going to go back next year.", exercices:[
      {type:"qcm", q:"Who did Anna travel with?", opts:["Her brother","Her sister","Her friend Ben","Nobody"], a:1, exp:"Anna went to Edinburgh with her sister."},
      {type:"qcm", q:"Why did they travel by train?", opts:["It was faster","It was cheaper","There was no plane","She hates flying"], a:1, exp:"because it was cheaper than the plane."},
      {type:"input", q:"How long did the journey take? It took ______ hours.", a:["five","5"], ph:"un nombre", exp:"The journey took five hours."},
      {type:"vf", q:"The hotel was expensive.", a:false, exp:"It was not expensive, but the rooms were very clean."},
      {type:"qcm", q:"What did they do on Tuesday?", opts:["They walked up a hill","They visited two museums","They stayed in bed","They went shopping"], a:1, exp:"it rained all day, so they visited two museums."},
      {type:"vf", q:"The weather was better on Wednesday.", a:true, exp:"On Wednesday the weather was better."},
      {type:"input", q:"How many photos did Anna take? More than ______ hundred.", a:["three","3"], ph:"un nombre", exp:"more than three hundred photos."},
      {type:"qcm", q:"Where was the hotel?", opts:["Near the station","Near the castle","In the countryside","Near the sea"], a:1, exp:"a small hotel near the castle."},
      {type:"qcm", q:"What is Anna going to do next year?", opts:["Go to London","Go back to Edinburgh","Stay at home","Move to Scotland"], a:1, exp:"she is going to go back next year."},
      {type:"vf", q:"Anna thinks it was her best holiday ever.", a:true, exp:"it was the best holiday of her life."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Lisez le document, puis répondez. — E-MAIL : From: bookings@parkhotel.co.uk / To: a.meyer@mail.com / Subject: Your booking 4471 — Dear Ms Meyer, thank you for your booking. We confirm one double room from 12 to 15 May, breakfast included. The price is 92 pounds per night. Check-in is from 2 p.m., check-out before 11 a.m. Free parking is available behind the hotel. If you want to cancel, please write to us at least 48 hours before your arrival. Kind regards, Park Hotel Reception.", exercices:[
      {type:"input", q:"What is the booking number? ______", a:["4471"], ph:"un nombre", exp:"Subject: Your booking 4471."},
      {type:"qcm", q:"How many nights is the booking for?", opts:["Two","Three","Four","Five"], a:1, exp:"Du 12 au 15 mai = trois nuits."},
      {type:"input", q:"How much does one night cost? ______ pounds.", a:["92","ninety-two","ninety two"], ph:"un nombre", exp:"The price is 92 pounds per night."},
      {type:"vf", q:"Breakfast is included.", a:true, exp:"breakfast included."},
      {type:"qcm", q:"When can guests check in?", opts:["From 11 a.m.","From 12 p.m.","From 2 p.m.","At any time"], a:2, exp:"Check-in is from 2 p.m."},
      {type:"vf", q:"Guests must leave the room before 11 a.m.", a:true, exp:"check-out before 11 a.m."},
      {type:"qcm", q:"Where is the parking?", opts:["In front of the hotel","Behind the hotel","Under the hotel","There is no parking"], a:1, exp:"Free parking is available behind the hotel."},
      {type:"vf", q:"The parking costs extra money.", a:false, exp:"Free parking : le parking est gratuit."},
      {type:"input", q:"How many hours before arrival must you cancel? At least ______ hours.", a:["48","forty-eight","forty eight"], ph:"un nombre", exp:"at least 48 hours before your arrival."},
      {type:"qcm", q:"Who wrote this e-mail?", opts:["Ms Meyer","The Park Hotel reception","A travel agency","The restaurant"], a:1, exp:"Kind regards, Park Hotel Reception."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Choisissez le mot ou l'expression de sens le plus proche.", exercices:[
      {type:"qcm", q:"begin", opts:["stop","start","close","leave"], a:1, exp:"begin = start (commencer)."},
      {type:"qcm", q:"quick", opts:["fast","slow","late","early"], a:0, exp:"quick = fast (rapide)."},
      {type:"qcm", q:"big", opts:["small","large","thin","short"], a:1, exp:"big = large (grand)."},
      {type:"qcm", q:"a trip", opts:["a journey","a job","a house","a meal"], a:0, exp:"a trip = a journey (un voyage)."},
      {type:"qcm", q:"nice", opts:["awful","pleasant","boring","angry"], a:1, exp:"nice = pleasant (agréable)."},
      {type:"qcm", q:"to reply", opts:["to ask","to answer","to shout","to listen"], a:1, exp:"to reply = to answer (répondre)."},
      {type:"qcm", q:"tired", opts:["sleepy","hungry","happy","busy"], a:0, exp:"tired = sleepy, fatigué."},
      {type:"qcm", q:"perhaps", opts:["never","maybe","always","often"], a:1, exp:"perhaps = maybe (peut-être)."},
      {type:"qcm", q:"to buy", opts:["to sell","to purchase","to lend","to lose"], a:1, exp:"to buy = to purchase (acheter)."},
      {type:"qcm", q:"awful", opts:["terrible","lovely","cheap","funny"], a:0, exp:"awful = terrible (affreux)."}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Choisissez le mot de sens contraire.", exercices:[
      {type:"qcm", q:"expensive", opts:["cheap","rich","dear","costly"], a:0, exp:"expensive (cher) ≠ cheap (bon marché)."},
      {type:"qcm", q:"to arrive", opts:["to come","to leave","to stay","to enter"], a:1, exp:"arrive ≠ leave (partir)."},
      {type:"qcm", q:"always", opts:["often","usually","never","sometimes"], a:2, exp:"always ≠ never."},
      {type:"qcm", q:"heavy", opts:["light","hard","strong","full"], a:0, exp:"heavy (lourd) ≠ light (léger)."},
      {type:"qcm", q:"to remember", opts:["to think","to forget","to know","to learn"], a:1, exp:"remember ≠ forget (oublier)."},
      {type:"qcm", q:"empty", opts:["full","clean","open","dry"], a:0, exp:"empty (vide) ≠ full (plein)."},
      {type:"qcm", q:"dangerous", opts:["safe","difficult","noisy","strange"], a:0, exp:"dangerous ≠ safe (sûr)."},
      {type:"qcm", q:"to lend", opts:["to give","to borrow","to buy","to keep"], a:1, exp:"lend (prêter) ≠ borrow (emprunter)."},
      {type:"qcm", q:"early", opts:["soon","late","now","fast"], a:1, exp:"early (tôt) ≠ late (tard)."},
      {type:"qcm", q:"the same", opts:["similar","equal","different","common"], a:2, exp:"the same ≠ different."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complétez avec le mot qui convient.", exercices:[
      {type:"qcm", q:"I would like to ______ a table for two, please.", opts:["book","take","make","give"], a:0, exp:"to book a table = réserver une table."},
      {type:"qcm", q:"Could you ______ me the salt, please?", opts:["bring","pass","carry","put"], a:1, exp:"to pass the salt = passer le sel."},
      {type:"input", q:"We paid the ______ and left the restaurant. (l'addition)", a:["bill"], ph:"un mot", exp:"the bill = l'addition (en américain : the check)."},
      {type:"qcm", q:"The doctor gave me a ______ for the chemist's.", opts:["ticket","receipt","prescription","bill"], a:2, exp:"a prescription = une ordonnance."},
      {type:"input", q:"I took my ______ this morning: it was 38 degrees. (température)", a:["temperature"], ph:"un mot", exp:"to take one's temperature."},
      {type:"qcm", q:"We had to ______ out of the hotel before eleven.", opts:["check","go","take","look"], a:0, exp:"to check out = libérer la chambre."},
      {type:"qcm", q:"The waiter took our ______ very quickly.", opts:["command","order","demand","request"], a:1, exp:"to take an order = prendre la commande. Attention : command est un faux ami."},
      {type:"input", q:"My suitcase was too ______ to carry. (lourde)", a:["heavy"], ph:"un adjectif", exp:"heavy = lourd."},
      {type:"qcm", q:"I have a ______ throat and I cannot speak well.", opts:["hurt","sore","painful","ill"], a:1, exp:"a sore throat = un mal de gorge."},
      {type:"qcm", q:"Take this medicine ______ a day.", opts:["two times","twice","second","double"], a:1, exp:"twice a day = deux fois par jour."}
    ]},
    { id:"familles", nom:"Familles de mots", consigne:"Trouvez le mot de la même famille qui convient.", exercices:[
      {type:"input", q:"to travel → a person who travels is a ______", a:["traveller","traveler"], ph:"un nom", exp:"traveller (GB) / traveler (US) = un voyageur."},
      {type:"input", q:"to teach → the person is a ______", a:["teacher"], ph:"un nom", exp:"verbe + -er = la personne : teach → teacher."},
      {type:"qcm", q:"danger → adjective:", opts:["dangered","dangerous","dangerful","dangery"], a:1, exp:"danger → dangerous (dangereux)."},
      {type:"qcm", q:"happy → noun:", opts:["happyness","happiness","happyment","happion"], a:1, exp:"happy → happiness (y devient i)."},
      {type:"input", q:"to decide → the noun is a ______", a:["decision"], ph:"un nom", exp:"decide → decision (une décision)."},
      {type:"qcm", q:"friend → adjective:", opts:["friendous","friendly","friendish","friending"], a:1, exp:"friend → friendly (amical)."},
      {type:"input", q:"slow → the adverb is ______", a:["slowly"], ph:"un adverbe", exp:"adjectif + -ly = adverbe : slow → slowly."},
      {type:"qcm", q:"to inform → noun:", opts:["informing","information","informment","informance"], a:1, exp:"inform → information (indénombrable, pas de -s)."},
      {type:"input", q:"health → the adjective is ______", a:["healthy"], ph:"un adjectif", exp:"health → healthy (en bonne santé)."},
      {type:"qcm", q:"to cook → the person:", opts:["a cooker","a cook","a cooking","a cookist"], a:1, exp:"a cook = un cuisinier ; a cooker = une cuisinière (l'appareil) !"}
    ]},
    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux faux amis : choisissez la bonne traduction ou le bon mot.", exercices:[
      {type:"qcm", q:"actually signifie :", opts:["actuellement","en fait","activement","récemment"], a:1, exp:"actually = en fait. Actuellement = currently / at the moment."},
      {type:"qcm", q:"a library est :", opts:["une librairie","une bibliothèque","une papeterie","un libraire"], a:1, exp:"a library = une bibliothèque. Une librairie = a bookshop."},
      {type:"qcm", q:"sensible signifie :", opts:["sensible","sensé, raisonnable","sensuel","susceptible"], a:1, exp:"sensible = raisonnable. Sensible (fr) = sensitive."},
      {type:"qcm", q:"Pour dire « je suis passé chez le médecin », on emploie :", opts:["I passed the doctor","I went to the doctor's","I passed by doctor","I am passed doctor"], a:1, exp:"to pass an exam = réussir un examen, pas passer."},
      {type:"qcm", q:"to attend signifie :", opts:["attendre","assister à","atteindre","attendrir"], a:1, exp:"to attend a meeting = assister à. Attendre = to wait."},
      {type:"qcm", q:"a journey est :", opts:["une journée","un voyage","un journal","un journaliste"], a:1, exp:"a journey = un voyage. Une journée = a day."},
      {type:"qcm", q:"Pour « la monnaie » (les pièces), on dit :", opts:["the money","the change","the coin","the currency"], a:1, exp:"change = la monnaie qu'on vous rend."},
      {type:"qcm", q:"a chef est :", opts:["un chef d'entreprise","un cuisinier","un chef de famille","un patron"], a:1, exp:"a chef = un chef cuisinier. Un chef = a boss."},
      {type:"qcm", q:"eventually signifie :", opts:["éventuellement","finalement","évidemment","exceptionnellement"], a:1, exp:"eventually = finalement. Éventuellement = possibly."},
      {type:"qcm", q:"Pour « J'ai mal à la tête », on dit :", opts:["I have bad at the head","I have a headache","I am headache","I make a headache"], a:1, exp:"On dit I have a headache / a stomachache / a toothache."}
    ]},
    { id:"qr", nom:"Question ↔ réponse", consigne:"Associez la réponse qui convient à la question.", exercices:[
      {type:"qcm", q:"How long are you staying?", opts:["For three nights.","At the hotel.","By train.","Twice a day."], a:0, exp:"How long → une durée : for three nights."},
      {type:"qcm", q:"How did you travel?", opts:["Last summer.","By train.","With my sister.","Five hours."], a:1, exp:"How → le moyen : by train."},
      {type:"qcm", q:"Have you booked a table?", opts:["Yes, I do.","No, we haven't.","Yes, I did it.","No, I am not."], a:1, exp:"Question au present perfect → réponse avec have/haven't."},
      {type:"qcm", q:"What is the problem?", opts:["I have a sore throat.","At the doctor's.","On Monday.","Yes, please."], a:0, exp:"What is the problem → on décrit le symptôme."},
      {type:"qcm", q:"Would you like a starter?", opts:["Yes, I would.","Yes, I like.","Yes, I do like.","Yes, I am."], a:0, exp:"Would you like...? → Yes, I would / No, thank you."},
      {type:"qcm", q:"Where is the lift?", opts:["At seven.","On your left.","It is heavy.","Three pounds."], a:1, exp:"Where → un lieu."},
      {type:"qcm", q:"How much is the room?", opts:["Ninety-two pounds a night.","Three nights.","On the fourth floor.","Yes, it is."], a:0, exp:"How much → un prix."},
      {type:"qcm", q:"Did you take your temperature?", opts:["Yes, I have.","Yes, I did.","Yes, I do.","Yes, I am."], a:1, exp:"Question en did → réponse avec did."},
      {type:"qcm", q:"What are you going to do next year?", opts:["I went to Scotland.","I am going to go back.","I have been there.","I do it often."], a:1, exp:"be going to pour un projet futur."},
      {type:"qcm", q:"Whose suitcase is this?", opts:["It is mine.","It is here.","It is heavy.","It is Monday."], a:0, exp:"Whose → à qui ? Réponse avec un possessif : mine."}
    ]},
    { id:"poserq", nom:"Poser la question", consigne:"Écrivez le mot interrogatif ou la question qui correspond à la réponse soulignée.", exercices:[
      {type:"input", q:"______ is your room? — On the fourth floor.", a:["where"], ph:"un mot", exp:"Un lieu → Where."},
      {type:"input", q:"______ nights are you staying? — Three nights.", a:["how many"], ph:"deux mots", exp:"Nom dénombrable → How many."},
      {type:"input", q:"______ is the room? — Ninety-two pounds.", a:["how much"], ph:"deux mots", exp:"Un prix → How much."},

      {type:"qcm", q:"— Could I have a room with a view? — ______", opts:["Yes, breakfast is included.","I am sorry, they are all full tonight.","The lift is on your left.","You must check out at eleven."], a:1, exp:"On refuse poliment la demande."},

    { id:"substitution", nom:"Substitution", consigne:"Refaites la phrase en remplaçant l'élément indiqué. Écrivez la forme correcte du verbe ou du mot.", exercices:[
      {type:"input", q:"I go to work by train. (he) → He ______ to work by train.", a:["goes"], ph:"un verbe", exp:"3e personne du singulier : go → goes."},
      {type:"input", q:"They watched TV. (she) → She ______ TV.", a:["watched"], ph:"un verbe", exp:"Au passé simple, la forme ne change pas selon la personne."},
      {type:"input", q:"We are staying at a hotel. (I) → I ______ staying at a hotel.", a:["am"], ph:"un verbe", exp:"I am, you are, he is."},
      {type:"input", q:"She has a headache. (they) → They ______ a headache.", a:["have"], ph:"un verbe", exp:"they have (pas has)."},
      {type:"input", q:"He must rest. (you) → You ______ rest.", a:["must"], ph:"un modal", exp:"Les modaux ne changent jamais : must reste must."},
      {type:"input", q:"I was tired. (we) → We ______ tired.", a:["were"], ph:"un verbe", exp:"I/he/she/it was ; we/you/they were."},
      {type:"input", q:"This is my suitcase. (their) → This is ______ suitcase.", a:["their"], ph:"un mot", exp:"Adjectif possessif their + nom."},
      {type:"input", q:"She doesn't like fish. (they) → They ______ like fish.", a:["don't","do not","dont"], ph:"deux mots", exp:"they don't, he/she/it doesn't."},
      {type:"input", q:"I will call you. (negative) → I ______ call you.", a:["won't","will not","wont"], ph:"deux mots", exp:"will not = won't."},
      {type:"input", q:"He is going to travel. (we) → We ______ going to travel.", a:["are"], ph:"un verbe", exp:"we are going to + verbe."}
    ]},
    { id:"conj", nom:"Conjugaison", consigne:"Mettez le verbe au temps demandé (surtout le passé simple).", exercices:[
      {type:"input", q:"Last summer we ______ (travel) to Scotland.", a:["travelled","traveled"], ph:"passé simple", exp:"Verbe régulier : travel + -ed (GB : double l)."},
      {type:"input", q:"She ______ (stay) in a small hotel near the castle.", a:["stayed"], ph:"passé simple", exp:"stay → stayed (voyelle + y : on ajoute simplement -ed)."},
      {type:"input", q:"It ______ (rain) all day on Tuesday.", a:["rained"], ph:"passé simple", exp:"rain → rained."},
      {type:"input", q:"They ______ (study) English last year.", a:["studied"], ph:"passé simple", exp:"consonne + y → -ied : study → studied."},
      {type:"input", q:"I ______ (be) very tired yesterday evening.", a:["was"], ph:"passé simple", exp:"I was, you were, he was."},
      {type:"input", q:"The rooms ______ (be) very clean.", a:["were"], ph:"passé simple", exp:"Sujet pluriel → were."},
      {type:"input", q:"He ______ (not / like) the soup.", a:["didn't like","did not like","didnt like"], ph:"passé simple négatif", exp:"Négation au passé : didn't + base verbale."},
      {type:"input", q:"______ you ______ (book) a table? (question)", a:["did book","did / book","did, book"], ph:"did ... book", exp:"Question au passé : Did + sujet + base verbale."},
      {type:"input", q:"Tomorrow I ______ (visit) the museum. (be going to)", a:["am going to visit"], ph:"be going to", exp:"Projet décidé : be going to + base verbale."},
      {type:"input", q:"If it rains, we ______ (stay) at the hotel. (will)", a:["will stay","'ll stay"], ph:"will", exp:"Conditionnel type 1 : if + présent, will + base verbale."}

    { id:"negation", nom:"Négation", consigne:"Mettez la phrase à la forme négative ou choisissez la négation correcte.", exercices:[
      {type:"input", q:"She likes fish. → She ______ fish.", a:["doesn't like","does not like","doesnt like"], ph:"négatif", exp:"Présent simple, 3e personne : doesn't + base verbale."},
      {type:"input", q:"They went to the museum. → They ______ to the museum.", a:["didn't go","did not go","didnt go"], ph:"négatif", exp:"Passé : didn't + base verbale (pas didn't went)."},
      {type:"input", q:"I am hungry. → I ______ hungry.", a:["am not","'m not"], ph:"négatif", exp:"Avec be, on ajoute simplement not."},
      {type:"input", q:"We have booked a table. → We ______ booked a table.", a:["haven't","have not","havent"], ph:"négatif", exp:"Present perfect négatif : haven't + participe passé."},
      {type:"input", q:"He will come back. → He ______ come back.", a:["won't","will not","wont"], ph:"négatif", exp:"will not = won't."},

      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["I don't want nothing.","I don't want anything.","I not want anything.","I don't want no thing."], a:1, exp:"Pas de double négation en anglais : don't ... anything."},
      {type:"qcm", q:"Quelle phrase est correcte ?", opts:["She has not any money.","She hasn't got any money.","She doesn't has money.","She not has money."], a:1, exp:"hasn't got any + indénombrable."},

    ]},

      {type:"qcm", q:"Ordre correct :", opts:["Yesterday we visited two museums.","We visited yesterday two museums.","We visited two museums yesterday.","We yesterday visited two museums."], a:2, exp:"Ordre habituel : sujet + verbe + COD + temps (Yesterday en tête est aussi possible)."},

      {type:"qcm", q:"Ordre correct :", opts:["I have a nice small blue car.","I have a blue small nice car.","I have a small blue nice car.","I have a car nice small blue."], a:0, exp:"Opinion, taille, couleur : nice / small / blue."},
      {type:"qcm", q:"Ordre correct :", opts:["Do you speak well English?","Do you speak English well?","Do you well speak English?","Well do you speak English?"], a:1, exp:"L'adverbe de manière suit le complément d'objet."},
      {type:"qcm", q:"Ordre correct :", opts:["We stayed three days in Edinburgh.","We stayed in Edinburgh three days.","We in Edinburgh stayed three days.","Three days we in Edinburgh stayed."], a:0, exp:"Le lieu suit normalement la durée courte ici ; les deux premiers sont proches mais (a) est le plus naturel."},
      {type:"qcm", q:"Ordre correct :", opts:["Never I have been to Scotland.","I have never been to Scotland.","I have been never to Scotland.","I never have been to Scotland."], a:1, exp:"L'adverbe se place entre l'auxiliaire et le participe."},
      {type:"qcm", q:"Ordre correct :", opts:["Is included breakfast?","Breakfast is included?","Is breakfast included?","Included is breakfast?"], a:2, exp:"Question avec be : be + sujet + reste."}
    ]},
    { id:"transfo", nom:"Transformation", consigne:"Transformez la phrase comme indiqué entre parenthèses.", exercices:[
      {type:"input", q:"I travel by train. (au passé) → I ______ by train.", a:["travelled","traveled"], ph:"passé", exp:"Présent → passé simple : travel → travelled."},
      {type:"input", q:"She eats a big breakfast. (au passé) → She ______ a big breakfast.", a:["ate"], ph:"passé", exp:"eat → ate (irrégulier)."},
      {type:"input", q:"They are tired. (au passé) → They ______ tired.", a:["were"], ph:"passé", exp:"are → were."},
      {type:"input", q:"He likes the soup. (négatif) → He ______ the soup.", a:["doesn't like","does not like","doesnt like"], ph:"négatif", exp:"Présent simple négatif : doesn't + base verbale."},
      {type:"input", q:"We booked a table. (négatif) → We ______ a table.", a:["didn't book","did not book","didnt book"], ph:"négatif", exp:"Passé négatif : didn't + base verbale."},
      {type:"input", q:"I am going to Scotland. (négatif) → I ______ going to Scotland.", a:["am not","'m not"], ph:"négatif", exp:"be + not."},
      {type:"input", q:"You booked a room. (question) → ______ you book a room?", a:["did"], ph:"un mot", exp:"Question au passé : Did + sujet + base verbale."},
      {type:"input", q:"She is a doctor. (question) → ______ she a doctor?", a:["is"], ph:"un mot", exp:"Avec be, on inverse sujet et verbe."},
      {type:"input", q:"They have finished. (question) → ______ they finished?", a:["have"], ph:"un mot", exp:"Present perfect : Have + sujet + participe passé."},
      {type:"input", q:"He can swim. (question) → ______ he swim?", a:["can"], ph:"un mot", exp:"Les modaux s'inversent directement avec le sujet."}
    ]},
    { id:"tradfr", nom:"Traduction FR → EN", consigne:"Traduisez la phrase française en anglais.", exercices:[
      {type:"input", q:"J'ai réservé une chambre.", a:["i booked a room","i have booked a room","i've booked a room"], ph:"en anglais", exp:"to book a room = réserver une chambre."},
      {type:"input", q:"Le petit-déjeuner est-il compris ?", a:["is breakfast included","is breakfast included?","is the breakfast included"], ph:"en anglais", exp:"Question avec be : Is breakfast included?"},
      {type:"input", q:"Nous avons voyagé en train.", a:["we travelled by train","we traveled by train"], ph:"en anglais", exp:"by train, sans article."},
      {type:"input", q:"J'ai mal à la gorge.", a:["i have a sore throat","i've got a sore throat","i have got a sore throat"], ph:"en anglais", exp:"a sore throat = un mal de gorge."},
      {type:"input", q:"Vous devriez vous reposer.", a:["you should rest","you should have a rest"], ph:"en anglais", exp:"should + base verbale pour le conseil."},
      {type:"input", q:"Elle est plus grande que moi.", a:["she is taller than me","she's taller than me","she is taller than i am"], ph:"en anglais", exp:"Comparatif court : taller than."},
      {type:"input", q:"Je vais visiter Édimbourg.", a:["i am going to visit edinburgh","i'm going to visit edinburgh"], ph:"en anglais", exp:"be going to pour un projet."},
      {type:"input", q:"Il ne mange pas de viande.", a:["he doesn't eat meat","he does not eat meat","he doesnt eat meat"], ph:"en anglais", exp:"doesn't + base verbale ; pas d'article devant meat."},
      {type:"input", q:"Avez-vous des plats végétariens ?", a:["do you have any vegetarian dishes","have you got any vegetarian dishes","do you have any vegetarian dishes?"], ph:"en anglais", exp:"any dans les questions."},
      {type:"input", q:"S'il pleut, je resterai à l'hôtel.", a:["if it rains i will stay at the hotel","if it rains, i will stay at the hotel","if it rains i'll stay at the hotel"], ph:"en anglais", exp:"Conditionnel 1 : if + présent, will + base verbale."}
    ]},
    { id:"traden", nom:"Traduction EN → FR", consigne:"Choisissez la bonne traduction française.", exercices:[
      {type:"qcm", q:"You must check out before eleven.", opts:["Vous pouvez partir à onze heures.","Vous devez libérer la chambre avant onze heures.","Vous devriez vérifier onze fois.","Vous partirez à onze heures."], a:1, exp:"must = obligation ; to check out = libérer la chambre."},
      {type:"qcm", q:"I have had a sore throat since Monday.", opts:["J'aurai mal à la gorge lundi.","J'ai eu mal à la gorge un lundi.","J'ai mal à la gorge depuis lundi.","J'avais mal à la gorge le lundi."], a:2, exp:"Present perfect + since = depuis, avec un présent en français."},
      {type:"qcm", q:"The train was cheaper than the plane.", opts:["Le train était moins cher que l'avion.","Le train était plus cher que l'avion.","Le train était aussi cher que l'avion.","Le train était le moins cher."], a:0, exp:"cheaper than = moins cher que."},
      {type:"qcm", q:"She is going to travel next year.", opts:["Elle voyage l'année prochaine.","Elle va voyager l'année prochaine.","Elle voyageait l'année dernière.","Elle voyagerait l'année prochaine."], a:1, exp:"be going to = aller + infinitif."},
      {type:"qcm", q:"You should rest and drink a lot of water.", opts:["Vous devez vous reposer.","Vous pouvez vous reposer.","Vous devriez vous reposer et boire beaucoup d'eau.","Vous vous reposerez."], a:2, exp:"should = devrait (conseil)."},
      {type:"qcm", q:"It was the best holiday of my life.", opts:["C'étaient de meilleures vacances.","C'était les meilleures vacances de ma vie.","C'était de bonnes vacances.","Ce seront les meilleures vacances."], a:1, exp:"the best = superlatif de good."},
      {type:"qcm", q:"We haven't booked a table.", opts:["Nous n'allons pas réserver.","Nous n'avons pas réservé de table.","Nous ne réservons jamais.","Nous ne réserverons pas."], a:1, exp:"Present perfect négatif."},
      {type:"qcm", q:"I don't have to work tomorrow.", opts:["Je ne dois pas travailler demain (interdit).","Je ne suis pas obligé de travailler demain.","Je ne peux pas travailler demain.","Je ne travaillerai pas demain."], a:1, exp:"don't have to = ce n'est pas obligatoire (≠ mustn't)."},
      {type:"qcm", q:"There aren't any rooms with a view tonight.", opts:["Il y a quelques chambres avec vue.","Il n'y a aucune chambre avec vue ce soir.","Il n'y a pas de vue.","Il y a une chambre avec vue."], a:1, exp:"not ... any = aucun."},
      {type:"qcm", q:"How often do you take the syrup?", opts:["Combien de sirop prenez-vous ?","Depuis quand prenez-vous le sirop ?","À quelle fréquence prenez-vous le sirop ?","Quand avez-vous pris le sirop ?"], a:2, exp:"How often = à quelle fréquence."}
    ]},
    { id:"dictee", nom:"Dictée à trous", consigne:"Complétez les phrases des dialogues avec le mot manquant.", exercices:[
      {type:"input", q:"Good evening. I ______ a room last week.", a:["booked"], ph:"un mot", exp:"I booked a room last week."},
      {type:"input", q:"Breakfast is ______ from seven to ten.", a:["served"], ph:"un mot", exp:"Breakfast is served (passif)."},
      {type:"input", q:"Do you have a ______? My suitcase is very heavy.", a:["lift","elevator"], ph:"un mot", exp:"a lift (GB) = un ascenseur."},
      {type:"input", q:"You must ______ out before eleven.", a:["check"], ph:"un mot", exp:"to check out = libérer la chambre."},
      {type:"input", q:"A bottle of ______ water, please.", a:["still"], ph:"un mot", exp:"still water = eau plate ; sparkling = pétillante."},
      {type:"input", q:"The pie is our ______ dish.", a:["best"], ph:"un mot", exp:"our best dish = notre meilleur plat."},
      {type:"input", q:"Could we have the ______ with the dessert?", a:["bill","check"], ph:"un mot", exp:"the bill = l'addition."},
      {type:"input", q:"Did you take your ______ this morning?", a:["temperature"], ph:"un mot", exp:"to take one's temperature."},
      {type:"input", q:"You have a bad cold, but you don't need ______.", a:["antibiotics"], ph:"un mot", exp:"antibiotics = des antibiotiques."},
      {type:"input", q:"If I feel ______, I will come back on Friday.", a:["worse"], ph:"un mot", exp:"worse = comparatif de bad."}
    ]},
    { id:"prononciation", nom:"Prononciation", consigne:"Questions de prononciation et d'accentuation.", exercices:[
      {type:"qcm", q:"Dans quel mot le -ed final se prononce-t-il /ɪd/ ?", opts:["walked","played","wanted","opened"], a:2, exp:"Après t ou d, -ed se prononce /ɪd/ : wanted."},
      {type:"qcm", q:"Dans quel mot le -ed final se prononce-t-il /t/ ?", opts:["arrived","watched","travelled","stayed"], a:1, exp:"Après un son sourd (ch), -ed = /t/ : watched."},
      {type:"qcm", q:"Quel mot ne rime PAS avec les autres ?", opts:["through","blue","two","though"], a:3, exp:"though se prononce /ðəʊ/, les autres en /uː/."},
      {type:"qcm", q:"Comment se prononce le -s de books ?", opts:["/s/","/z/","/ɪz/","muet"], a:0, exp:"Après un son sourd /k/, le -s se prononce /s/."},
      {type:"qcm", q:"Comment se prononce le -s de dishes ?", opts:["/s/","/z/","/ɪz/","muet"], a:2, exp:"Après -sh, -ch, -s, -x : /ɪz/."},
      {type:"qcm", q:"Où se trouve l'accent tonique dans hotel ?", opts:["HO-tel","ho-TEL","les deux","aucun"], a:1, exp:"hoTEL : l'accent est sur la deuxième syllabe."},
      {type:"qcm", q:"Où se trouve l'accent tonique dans breakfast ?", opts:["BREAK-fast","break-FAST","les deux","aucun"], a:0, exp:"BREAKfast : accent sur la première syllabe."},
      {type:"qcm", q:"Dans quel mot la lettre h est-elle muette ?", opts:["hotel","house","hour","happy"], a:2, exp:"hour se prononce /aʊə/, le h ne se prononce pas (an hour)."},
      {type:"qcm", q:"Comment se prononce le premier son de throat ?", opts:["/t/","/θ/","/s/","/f/"], a:1, exp:"th sourd /θ/, langue entre les dents."},
      {type:"qcm", q:"Combien de syllabes entend-on dans comfortable (usage courant) ?", opts:["deux","trois","quatre","cinq"], a:1, exp:"On dit COMF-ter-ble, trois syllabes."}
    ]}
  ]
};
