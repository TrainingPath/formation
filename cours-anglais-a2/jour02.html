<script>
var DAY = {
  num: 2,
  title: "Le passé simple : verbes irréguliers",
  subtitle: "Les verbes qui ne suivent pas la règle du -ed.",
  theory: `
<h3>1. Des verbes à apprendre par coeur</h3>
<p>Beaucoup de verbes très courants ne suivent pas la règle du <strong>-ed</strong> : ce sont les <strong>verbes irréguliers</strong>. Leur passé simple a une forme spéciale qu'il faut <strong>mémoriser</strong>. Bonne nouvelle : comme pour les réguliers, la forme est <strong>la même à toutes les personnes</strong>.</p>
<pre class="pseudo">Base       Passé       Traduction
go         went        aller / je suis allé
have       had         avoir / j'ai eu
do         did         faire / j'ai fait
see        saw         voir / j'ai vu
eat        ate         manger / j'ai mangé</pre>
<h3>2. Les incontournables</h3>
<p>Voici les irréguliers les plus utiles à connaître dès maintenant :</p>
<pre class="pseudo">be    -> was / were   (etre)      buy   -> bought  (acheter)
make  -> made          (faire)     take  -> took    (prendre)
get   -> got           (obtenir)   give  -> gave    (donner)
come  -> came          (venir)     say   -> said    (dire)
know  -> knew           (savoir)    find  -> found   (trouver)</pre>
<div class="warn">Le verbe <strong>be</strong> (être) est le seul qui change selon la personne au passé : <em>I / he / she / it <strong>was</strong></em>, mais <em>you / we / they <strong>were</strong></em>. Exemple : <em>I was tired, they were happy.</em></div>
<h3>3. Comment les reconnaître ?</h3>
<p>Il n'y a pas de règle magique : certains changent leur voyelle (<em>sing -> sang</em>), d'autres deviennent totalement différents (<em>go -> went</em>), d'autres ne changent pas du tout (<em>put -> put, cut -> cut</em>).</p>
<div class="tip">Le meilleur moyen de les apprendre : par petits groupes, et surtout en les <strong>utilisant</strong> dans des phrases. La répétition crée l'automatisme.</div>`,
  exercises: [
    { type: "input", q: "Complète : Yesterday I ___ (go) to the cinema.", a: ["went"], ph: "passé irrégulier", exp: "go -> went." },
    { type: "input", q: "Complète : She ___ (have) a great idea.", a: ["had"], ph: "passé irrégulier", exp: "have -> had." },
    { type: "input", q: "Complète : We ___ (see) a good film last night.", a: ["saw"], ph: "passé irrégulier", exp: "see -> saw." },
    { type: "qcm", q: "Quel est le passé simple de « eat » ?", opts: ["eated", "eat", "ate", "eaten"], a: 2, exp: "eat -> ate (eaten est le participe passé, plus tard)." },
    { type: "input", q: "Complète : They ___ (do) their homework.", a: ["did"], ph: "passé irrégulier", exp: "do -> did." },
    { type: "qcm", q: "Quel est le passé simple de « buy » ?", opts: ["buyed", "bought", "buied", "buys"], a: 1, exp: "buy -> bought." },
    { type: "vf", q: "Le passé simple des verbes irréguliers change selon la personne.", a: false, exp: "Faux, sauf « be ». I went, she went, they went : forme identique." },
    { type: "input", q: "Complète : He ___ (make) a cake for the party.", a: ["made"], ph: "passé irrégulier", exp: "make -> made." },
    { type: "qcm", q: "Complète : I ___ tired yesterday.", opts: ["was", "were", "am", "been"], a: 0, exp: "Avec I, le passé de be est was." },
    { type: "qcm", q: "Complète : They ___ at the park.", opts: ["was", "were", "is", "been"], a: 1, exp: "Avec they, le passé de be est were." },
    { type: "input", q: "Complète : My friend ___ (take) the bus this morning.", a: ["took"], ph: "passé irrégulier", exp: "take -> took." },
    { type: "vf", q: "Le passé simple de « put » est « put » (il ne change pas).", a: true, exp: "Vrai : put -> put, comme cut -> cut." },
    { type: "input", q: "Complète : She ___ (get) a nice present.", a: ["got"], ph: "passé irrégulier", exp: "get -> got." },
    { type: "qcm", q: "Quel est le passé simple de « come » ?", opts: ["comed", "come", "came", "camed"], a: 2, exp: "come -> came." },
    { type: "vf", q: "Le passé simple de « say » est « said ».", a: true, exp: "Vrai : say -> said (prononcé « sed »)." }
  ],
  final: {
    title: "Exercice final — Le voyage de Lucy",
    intro: `<p>Lis ce texte plein de verbes irréguliers, puis réponds :</p>
<pre class="pseudo">Last summer, Lucy went to Italy with her family. They took
a plane to Rome. The weather was hot and sunny. Lucy saw
the Colosseum and ate a lot of pizza. She bought some
presents for her friends. It was a wonderful holiday.</pre>`,
    questions: [
      { type: "qcm", q: "Where did Lucy go? (Où est allée Lucy ?)", opts: ["Spain", "France", "Italy", "Greece"], a: 2, exp: "« Lucy went to Italy » : en Italie." },
      { type: "input", q: "Complète d'après le texte : They ___ (take) a plane to Rome.", a: ["took"], ph: "passé irrégulier", exp: "take -> took." },
      { type: "vf", q: "The weather was cold. (Le temps était froid.)", a: false, exp: "Faux : « The weather was hot and sunny » = chaud et ensoleillé." },
      { type: "qcm", q: "What did Lucy eat? (Qu'a mangé Lucy ?)", opts: ["pasta", "pizza", "bread", "fish"], a: 1, exp: "« ate a lot of pizza »." },
      { type: "input", q: "Complète d'après le texte : She ___ (buy) some presents.", a: ["bought"], ph: "passé irrégulier", exp: "buy -> bought." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">L'ete dernier, Lucy est allee en Italie avec sa famille. Ils
ont pris un avion pour Rome. Le temps etait chaud et
ensoleille. Lucy a vu le Colisee et a mange beaucoup de
pizza. Elle a achete des cadeaux pour ses amis. C'etait des
vacances merveilleuses.</pre>
<p>Verbes irréguliers du texte : went (go), took (take), was (be), saw (see), ate (eat), bought (buy). Ces formes ne s'inventent pas : elles se retiennent. Note que « was » est utilisé pour « The weather » (it) et « It was ».</p>`
  }
};
</script>
