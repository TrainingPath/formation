  subtitle: "Les formules et la structure pour écrire court et juste.",
  theory: `
<h3>1. Deux formats courts très utiles</h3>
<p>Au niveau A2, on demande souvent d'écrire un <strong>message</strong> (SMS, e-mail court) ou une <strong>carte postale</strong> (postcard). Ce sont des textes courts (30 à 50 mots) mais avec une structure précise. On la suit toujours.</p>
<h3>2. Les formules d'appel (début)</h3>
<pre class="pseudo">Hi Tom,          Salut Tom,          (informel, amis)
Hello Emma,      Bonjour Emma,       (neutre)
Dear Grandma,    Chère Mamie,        (plus chaleureux)</pre>
<h3>3. Les formules de fin</h3>
<pre class="pseudo">See you soon,        À bientot,          (informel)
Love,                Bisous,             (famille, amis proches)
Best wishes,         Bien à toi,         (neutre)
Take care,           Prends soin de toi, (amical)</pre>
<div class="tip">La formule de fin doit correspondre au début : à un « Hi Tom » informel répond un « See you soon » ou « Love ». On garde le même niveau de langue du début à la fin.</div>
<h3>4. Modèle de MESSAGE (inviter un ami)</h3>
<pre class="pseudo">Hi Sam,

Are you free on Saturday? There is a great film at the cinema and I
would like to go. We can meet at 7 p.m. in front of the cinema. Let
me know if you can come!

See you soon,
Ben</pre>
<p>Structure du message : appel + raison/proposition + détail pratique (heure, lieu) + demande de réponse + formule de fin.</p>
<h3>5. Modèle de CARTE POSTALE (en vacances)</h3>
<pre class="pseudo">Dear Julie,

Greetings from Rome! I am having a wonderful holiday. The weather is
hot and sunny. Yesterday I visited the Colosseum and ate delicious
pizza. Tomorrow I am going to see the Vatican. I miss you!

Love,
Anna</pre>
<div class="warn">Sur une carte postale, on parle du LIEU, de la MÉTÉO, des ACTIVITÉS (passé et futur proche) et on exprime un SENTIMENT. La formule <em>Greetings from...</em> (Bonjour de...) est typique. Ne l'oublie pas.</div>
<h3>6. Les phrases toutes faites à réutiliser</h3>
<pre class="pseudo">Are you free on...?          Es-tu libre le... ?
Would you like to...?        Voudrais-tu... ?
I am having a great time.    Je passe un super moment.
The weather is lovely.       Le temps est magnifique.
I miss you.                  Tu me manques.
Let me know.                 Tiens-moi au courant.</pre>`,

    { type: "input", q: "Complète : « I am having a great ___ » (je passe un super moment).", a: ["time"], ph: "un mot", exp: "I am having a great time." },

    { type: "input", q: "Complète : « Let me ___ if you can come » (tiens-moi au courant).", a: ["know"], ph: "un verbe", exp: "Let me know = Tiens-moi au courant." },
    { type: "qcm", q: "Sur une carte postale, de quoi parle-t-on typiquement ?", opts: ["Du travail et des factures", "Du lieu, de la météo et des activités", "Des mathématiques", "De rien de précis"], a: 1, exp: "Lieu, météo, activités et sentiment." },
    { type: "input", q: "Traduis « tu me manques » : I ___ you.", a: ["miss"], ph: "un verbe", exp: "I miss you = Tu me manques." },
    { type: "qcm", q: "Quelle formule de fin convient pour la famille proche ?", opts: ["Yours faithfully", "Love,", "Dear Sir", "To whom it may concern"], a: 1, exp: "Love = bisous, pour les proches." },
    { type: "input", q: "Complète : « The weather is ___ » (magnifique / adorable).", a: ["lovely"], ph: "adjectif", exp: "The weather is lovely." },
    { type: "vf", q: "Un message d'invitation contient souvent un détail pratique comme l'heure et le lieu.", a: true, exp: "meet at 7 p.m. in front of the cinema." },

    { type: "qcm", q: "Dans quel ordre écrit-on un message d'invitation ?", opts: ["Fin, appel, corps", "Appel, proposition, détail, demande de réponse, fin", "Corps seulement", "Météo, appel, corps"], a: 1, exp: "Structure : appel + proposition + détail + demande + formule de fin." }
  ],

    title: "Exercice final — Read and reply",
    intro: `<p>Lis cette carte postale reçue de ton amie Kate, puis réponds aux questions. Observe bien la structure.</p>
<pre class="pseudo">Dear Alex,

Greetings from Scotland! I am having a fantastic time here. The
weather is cold but the mountains are beautiful. Yesterday we walked
by a big lake and saw some deer. Tomorrow we are going to visit an old
castle. The food is great, especially the soup! I miss you and I will
tell you everything when I get home.

Love,
Kate</pre>`,

      { type: "qcm", q: "What did Kate do yesterday?", opts: ["Visited a castle", "Walked by a lake and saw deer", "Ate pizza", "Went shopping"], a: 1, exp: "we walked by a big lake and saw some deer." },

      { type: "input", q: "Which closing formula does Kate use? ___", a: ["love"], ph: "un mot", exp: "Love, Kate (formule affectueuse)." }
    ],
    solution: `<p>La carte de Kate respecte la structure type : appel (Dear Alex), Greetings from + lieu, météo, activité passée (walked, saw), activité future (are going to visit), sentiment (I miss you), formule de fin (Love).</p>
<pre class="pseudo">Greetings from Scotland!   -> lieu
The weather is cold        -> météo
Yesterday we walked...     -> activité passée
Tomorrow we are going...   -> activité future
I miss you                 -> sentiment</pre>
<p>Pour écrire une bonne carte postale, coche mentalement ces cinq éléments : lieu, météo, ce que tu as fait, ce que tu vas faire, un sentiment. La structure fait la moitié du travail.</p>`
  }
};
