<script>
var DAY = {
  num: 22,
  title: "Raconter une histoire au passé",
  subtitle: "Enchainer les événements avec le passé simple et les mots de temps.",
  theory: `
<h3>1. Le passé simple, l'outil du récit</h3>
<p>Pour raconter une histoire, on utilise surtout le <strong>past simple</strong> (le passé simple), vu aux jours 1 à 3. Rappel : les verbes réguliers prennent <strong>-ed</strong>, les irréguliers ont une forme spéciale à apprendre.</p>
<pre class="pseudo">walk -> walked      marcher -> marchai
play -> played      jouer -> jouai
go   -> went        aller -> allai (irrégulier)
see  -> saw         voir -> vis (irrégulier)
eat  -> ate         manger -> mangeai (irrégulier)</pre>
<h3>2. Les mots pour ordonner un récit</h3>
<p>Un bon récit enchaine les événements avec des <strong>connecteurs de temps</strong>. Ils se placent souvent en début de phrase.</p>
<pre class="pseudo">First        D'abord
Then         Ensuite
After that   Après cela
Later        Plus tard
Suddenly     Soudain
Finally      Enfin / finalement
In the end   À la fin</pre>
<div class="tip">Commence ton récit par <strong>First</strong> ou par une expression de temps comme <em>Yesterday</em> (hier), <em>Last week</em> (la semaine dernière), <em>One day</em> (un jour). Cela plante le décor immédiatement.</div>
<h3>3. La négation et la question au passé</h3>
<p>Rappel important : au passé, on utilise <strong>did</strong> pour la négation et la question, et le verbe revient à sa base (sans -ed) !</p>
<pre class="pseudo">I did not see him.        Je ne l'ai pas vu.
Did you go to the party?  Es-tu allé à la fête ?
She did not eat.          Elle n'a pas mangé.</pre>
<div class="warn">Erreur classique : <em>I did not saw</em> est FAUX. Après <strong>did</strong>, le verbe reste à la base : <strong>I did not see</strong>. Le passé est déjà porté par <em>did</em>.</div>
<h3>4. Le passé continu pour le décor</h3>
<p>Le <strong>past continuous</strong> (was/were + -ing) décrit une action EN COURS quand un événement soudain arrive. Il pose le décor de l'histoire.</p>
<pre class="pseudo">I was walking in the park when it started to rain.
Je marchais dans le parc quand il a commencé à pleuvoir.
They were sleeping when the phone rang.
Ils dormaient quand le téléphone a sonné.</pre>
<p>Le passé continu = l'action longue (le décor), le passé simple = l'action courte qui l'interrompt.</p>`,
  exercises: [
    { type: "input", q: "Passé de « go » (aller) : ___", a: ["went"], ph: "forme passée", exp: "go -> went (irrégulier)." },
    { type: "qcm", q: "Quel connecteur signifie « soudain » ?", opts: ["First", "Then", "Suddenly", "Finally"], a: 2, exp: "Suddenly = soudain." },
    { type: "input", q: "Passé de « see » (voir) : ___", a: ["saw"], ph: "forme passée", exp: "see -> saw (irrégulier)." },
    { type: "qcm", q: "Quelle phrase est correcte au passé négatif ?", opts: ["I did not saw him.", "I did not see him.", "I not saw him.", "I didn't sees him."], a: 1, exp: "Après did, le verbe reste à la base : see." },
    { type: "vf", q: "Le passé continu se forme avec « was/were + verbe en -ing ».", a: true, exp: "I was walking, they were sleeping." },
    { type: "input", q: "Complète : « ___ you go to the party? » (question au passé).", a: ["did"], ph: "un mot", exp: "Did you go...? : did pour la question au passé." },
    { type: "qcm", q: "Quel connecteur veut dire « ensuite » ?", opts: ["First", "Then", "In the end", "Suddenly"], a: 1, exp: "Then = ensuite." },
    { type: "input", q: "Passé de « eat » (manger) : ___", a: ["ate"], ph: "forme passée", exp: "eat -> ate (irrégulier)." },
    { type: "vf", q: "« I was walking when it started to rain » utilise le passé continu pour l'action longue.", a: true, exp: "was walking = décor ; started = action courte." },
    { type: "qcm", q: "« Finally » se traduit par :", opts: ["D'abord", "Soudain", "Enfin / finalement", "Plus tard"], a: 2, exp: "Finally = enfin, finalement." },
    { type: "input", q: "Passé régulier de « play » : ___", a: ["played"], ph: "forme passée", exp: "play -> played (régulier, -ed)." },
    { type: "qcm", q: "Dans « They were sleeping when the phone rang », quelle action interrompt l'autre ?", opts: ["were sleeping", "the phone rang", "les deux", "aucune"], a: 1, exp: "rang (passé simple) = action courte qui interrompt le sommeil." },
    { type: "input", q: "Complète le début d'un récit : « ___, I woke up early » (D'abord).", a: ["first"], ph: "connecteur", exp: "First = d'abord." },
    { type: "vf", q: "Dans « I did not eat », le verbe « eat » reste à la base car « did » porte déjà le passé.", a: true, exp: "did not + base verbale : did not eat." },
    { type: "qcm", q: "Quelle expression plante le décor au début d'un récit ?", opts: ["Yesterday", "Because", "Very", "Enough"], a: 0, exp: "Yesterday, One day, Last week situent l'histoire dans le temps." }
  ],
  final: {
    title: "Exercice final — A strange day",
    intro: `<p>Lis cette petite histoire au passé, puis réponds aux questions.</p>
<pre class="pseudo">Yesterday was a strange day. First, I woke up late and missed the bus.
Then I walked to work in the rain. I was crossing the street when I
saw an old friend, Sam. We went to a café and talked for an hour.
After that, I felt much better. Suddenly, Sam said: I have a surprise
for you! In the end, he gave me two tickets for a concert. What a day!</pre>`,
    questions: [
      { type: "qcm", q: "Why did the narrator miss the bus?", opts: ["It was raining", "He woke up late", "He was at a café", "He was sleeping at work"], a: 1, exp: "First, I woke up late and missed the bus." },
      { type: "input", q: "Who did the narrator meet in the street? An old friend called ___", a: ["sam"], ph: "un prénom", exp: "I saw an old friend, Sam." },
      { type: "qcm", q: "Where did they go together?", opts: ["To work", "To a concert", "To a café", "To the bus"], a: 2, exp: "We went to a café and talked for an hour." },
      { type: "vf", q: "Sam gave the narrator two concert tickets.", a: true, exp: "he gave me two tickets for a concert." },
      { type: "input", q: "Which word introduces the surprise? ___", a: ["suddenly"], ph: "connecteur", exp: "Suddenly, Sam said: I have a surprise." }
    ],
    solution: `<p>Le narrateur se réveille tard, rate le bus, marche sous la pluie, rencontre son ami Sam, va au café, et reçoit deux billets de concert en surprise.</p>
<pre class="pseudo">First ... Then ... After that ... Suddenly ... In the end
woke up (wake), missed, walked, saw (see), went (go), gave (give)</pre>
<p>Observe comment les connecteurs (First, Then, Suddenly, In the end) structurent le récit, et comment le passé continu (I was crossing) pose le décor avant l'événement (I saw).</p>`
  }
};
</script>
