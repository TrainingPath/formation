<script>
var DAY = {
  num: 8,
  title: "Les adverbes de fréquence",
  subtitle: "Dire à quelle fréquence on fait quelque chose.",
  theory: `
<h3>1. À quoi servent-ils ?</h3>
<p>Les <strong>adverbes de fréquence</strong> disent <strong>combien de fois</strong> on fait une action : toujours, souvent, jamais... On les utilise surtout pour parler d'<strong>habitudes</strong>, donc au présent simple.</p>
<h3>2. L'échelle de fréquence</h3>
<pre class="pseudo">100%  always        toujours
 90%  usually       d'habitude
 70%  often         souvent
 50%  sometimes     parfois
 30%  rarely/seldom rarement
  0%  never         jamais</pre>
<h3>3. LA règle de position</h3>
<p>C'est le point le plus important. L'adverbe se place :</p>
<pre class="pseudo">AVANT le verbe ordinaire :
   I always drink coffee.        (Je bois toujours du café.)
   She never eats meat.          (Elle ne mange jamais de viande.)

APRES le verbe be (am/is/are) :
   He is often late.             (Il est souvent en retard.)
   They are always happy.        (Ils sont toujours heureux.)</pre>
<div class="tip">Astuce mémoire : l'adverbe se glisse <strong>avant</strong> les verbes normaux mais <strong>après</strong> le verbe être. Compare : <em>I <strong>always</strong> work</em> mais <em>I am <strong>always</strong> tired</em>.</div>
<h3>4. never est déjà négatif</h3>
<div class="warn">Attention : <strong>never</strong> signifie déjà « ne... jamais ». On ne met PAS un autre « not » avec. On dit <em>I never smoke</em> (et non « I don't never smoke »).</div>
<h3>5. Poser la question</h3>
<p>Pour demander la fréquence, on utilise <strong>How often...?</strong> (« À quelle fréquence...? ») : <em>How often do you play tennis? -> Twice a week.</em> (deux fois par semaine).</p>`,
  exercises: [
    { type: "qcm", q: "Où placer l'adverbe ? « I ___ drink ___ coffee. » (always)", opts: ["I drink always coffee.", "I always drink coffee.", "Always I drink coffee.", "I drink coffee always."], a: 1, exp: "Avant le verbe ordinaire : I always drink coffee." },
    { type: "qcm", q: "Où placer l'adverbe ? « He ___ is ___ late. » (often)", opts: ["He often is late.", "Often he is late.", "He is often late.", "He is late often."], a: 2, exp: "Après le verbe be : He is often late." },
    { type: "input", q: "Remets dans l'ordre : (never / she / meat / eats). Écris la phrase correcte.", a: ["she never eats meat"], ph: "phrase", exp: "Avant le verbe ordinaire : She never eats meat." },
    { type: "input", q: "Remets dans l'ordre : (are / always / they / happy). Écris la phrase.", a: ["they are always happy"], ph: "phrase", exp: "Après be : They are always happy." },
    { type: "qcm", q: "Que signifie « usually » ?", opts: ["jamais", "d'habitude", "rarement", "parfois"], a: 1, exp: "usually = d'habitude (environ 90%)." },
    { type: "vf", q: "« never » signifie déjà « ne... jamais » : on n'ajoute pas « not ».", a: true, exp: "Vrai : I never smoke (pas « I don't never smoke »)." },
    { type: "input", q: "Complète : She is ___ friendly. (place l'adverbe « always » au bon endroit avec « is »)", a: ["always"], ph: "adverbe", exp: "Après be : She is always friendly." },
    { type: "qcm", q: "Classe du plus fréquent au moins fréquent :", opts: ["never - often - always", "always - often - never", "often - never - always", "sometimes - always - never"], a: 1, exp: "always (100%) > often (70%) > never (0%)." },
    { type: "input", q: "Complète : I ___ go to bed before midnight. (place « rarely » avant le verbe)", a: ["rarely"], ph: "adverbe", exp: "Avant le verbe : I rarely go to bed before midnight." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["They always are late.", "They are always late.", "Always they are late.", "They are late always."], a: 1, exp: "Après be : They are always late." },
    { type: "qcm", q: "Comment demander la fréquence ?", opts: ["How much do you play?", "How many you play?", "How often do you play?", "When often you play?"], a: 2, exp: "How often...? = à quelle fréquence." },
    { type: "input", q: "Remets dans l'ordre : (sometimes / we / to the beach / go). Écris la phrase.", a: ["we sometimes go to the beach"], ph: "phrase", exp: "Avant le verbe : We sometimes go to the beach." },
    { type: "vf", q: "« He always is tired » est correct.", a: false, exp: "Faux : après be il faut « He is always tired »." },
    { type: "qcm", q: "Que signifie « rarely » ?", opts: ["souvent", "toujours", "rarement", "parfois"], a: 2, exp: "rarely = rarement (environ 30% ou moins)." },
    { type: "input", q: "Complète : My father ___ watches football on Sundays. (place « usually »)", a: ["usually"], ph: "adverbe", exp: "Avant le verbe : My father usually watches football." }
  ],
  final: {
    title: "Exercice final — La routine de Julia",
    intro: `<p>Julia décrit ses habitudes. Lis, puis réponds :</p>
<pre class="pseudo">Julia always gets up at seven o'clock. She usually has tea
for breakfast, but she never drinks coffee. She often goes
to work by bike because she is rarely in a hurry. In the
evening she sometimes watches a film, but she is always in
bed before eleven. She is never late for work.</pre>`,
    questions: [
      { type: "qcm", q: "What does Julia never drink? (Que ne boit jamais Julia ?)", opts: ["tea", "water", "coffee", "juice"], a: 2, exp: "« she never drinks coffee »." },
      { type: "vf", q: "Julia often goes to work by bike. (Julia va souvent au travail à vélo.)", a: true, exp: "« She often goes to work by bike »." },
      { type: "input", q: "Complète d'après le texte : Julia ___ gets up at seven. (adverbe utilisé)", a: ["always"], ph: "adverbe", exp: "« Julia always gets up at seven »." },
      { type: "qcm", q: "Is Julia often late for work? (Julia est-elle souvent en retard ?)", opts: ["Yes, always.", "No, she is never late.", "Sometimes.", "Usually."], a: 1, exp: "« She is never late for work »." },
      { type: "input", q: "Complète d'après le texte : She is always ___ eleven. (préposition + heure)", a: ["in bed before"], ph: "mots du texte", exp: "« she is always in bed before eleven »." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Julia se leve toujours a sept heures. Elle prend
d'habitude du the au petit-dejeuner, mais elle ne boit
jamais de cafe. Elle va souvent au travail a velo parce
qu'elle est rarement pressee. Le soir elle regarde parfois
un film, mais elle est toujours au lit avant onze heures.
Elle n'est jamais en retard au travail.</pre>
<p>Observe la position : avec les verbes ordinaires (gets up, has, drinks, goes, watches), l'adverbe est AVANT ; avec be (is rarely, is always, is never), il est APRÈS. C'est la règle essentielle à retenir.</p>`
  }
};
</script>
