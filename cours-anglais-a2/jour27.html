<body>
<script>
var DAY = {
  num: 27,
  title: "Compréhension : un e-mail, un article court",
  subtitle: "Lire et comprendre deux textes courts sans traduire chaque mot.",
  theory: `
<h3>1. Lire sans tout comprendre</h3>
<p>À l'examen A2, on ne te demande pas de comprendre CHAQUE mot, mais de saisir l'essentiel. Deux stratégies :</p>
<pre class="pseudo">Skimming    Lire vite pour l'idée générale (De quoi ça parle ?)
Scanning    Chercher une info précise (un nom, une heure, un prix)</pre>
<div class="tip">Devant un mot inconnu, ne bloque pas : lis la phrase entière, le contexte donne souvent le sens. Cherche aussi les mots « transparents » qui ressemblent au français (restaurant, hotel, information...).</div>
<h3>2. Texte A : un e-mail personnel</h3>
<p>Lis cet e-mail. Il a une structure fixe : formule d'appel (Dear...), corps du message, formule de fin (Best wishes...).</p>
<pre class="pseudo">From: emma@mail.com
To: julie@mail.com
Subject: My new job

Dear Julie,

How are you? I have some great news. Last week I started a new job in
a bookshop in the city centre. I work from Monday to Friday, and the
shop is only ten minutes from my flat. My colleagues are very friendly
and my boss is kind. The best part is that I get a discount on all the
books! I am a bit tired in the evenings, but I am really happy. Why do
not you come and visit me next month? We can have lunch together.

Write back soon!

Best wishes,
Emma</pre>
<h3>3. Texte B : un article court</h3>
<p>Voici un petit article de journal. Les articles répondent souvent aux questions : qui, quoi, où, quand.</p>
<pre class="pseudo">A NEW PARK FOR THE CITY

A big new park opened last Saturday in the north of the city. The park
has a lake, a playground for children, and a small café. More than two
thousand people visited it on the first day. The mayor said the park
is free for everyone and open from 8 a.m. to 9 p.m. Local people are
very happy because there was no green space in this area before.</pre>
<div class="warn">Attention aux détails « pièges » : dans l'e-mail, Emma est <em>a bit tired</em> (un peu fatiguée) MAIS <em>really happy</em> (vraiment heureuse). Il faut lire jusqu'au bout : le petit mot <strong>but</strong> change tout.</div>
<h3>4. Les questions typiques</h3>
<pre class="pseudo">True or false?          Vrai ou faux ? (chercher la preuve dans le texte)
Multiple choice         Choisir la bonne réponse parmi 3 ou 4
Answer the question     Répondre avec une info du texte</pre>`,
  exercises: [
    { type: "qcm", q: "(E-mail) Where does Emma work now?", opts: ["In a café", "In a bookshop", "In a school", "In a hotel"], a: 1, exp: "I started a new job in a bookshop." },
    { type: "vf", q: "(E-mail) Emma works from Monday to Friday.", a: true, exp: "I work from Monday to Friday." },
    { type: "input", q: "(E-mail) How far is the shop from her flat? Only ten ___", a: ["minutes"], ph: "un mot", exp: "only ten minutes from my flat." },
    { type: "qcm", q: "(E-mail) What is the best part of her job, according to Emma?", opts: ["The salary", "A discount on books", "Free lunch", "Short hours"], a: 1, exp: "The best part is a discount on all the books." },
    { type: "vf", q: "(E-mail) Emma is tired in the evenings but really happy.", a: true, exp: "a bit tired... but really happy (le but est important)." },
    { type: "input", q: "(E-mail) Quel mot signale l'opposition entre fatiguée et heureuse ? ___", a: ["but"], ph: "connecteur", exp: "I am a bit tired... but I am really happy." },
    { type: "qcm", q: "(E-mail) What does Emma suggest at the end?", opts: ["To call her", "To visit her next month", "To send books", "To find a job"], a: 1, exp: "Why do not you come and visit me next month ?" },
    { type: "qcm", q: "(Article) When did the new park open?", opts: ["Last Sunday", "Last Saturday", "Yesterday", "Next month"], a: 1, exp: "A new park opened last Saturday." },
    { type: "input", q: "(Article) Where is the park? In the ___ of the city.", a: ["north"], ph: "direction", exp: "in the north of the city." },
    { type: "vf", q: "(Article) The park has a lake, a playground and a café.", a: true, exp: "The park has a lake, a playground for children, and a small café." },
    { type: "input", q: "(Article) How many people visited on the first day? More than two ___", a: ["thousand"], ph: "un mot", exp: "More than two thousand people." },
    { type: "qcm", q: "(Article) How much does it cost to enter the park?", opts: ["Two euros", "It is free", "Ten euros", "Only for children"], a: 1, exp: "the park is free for everyone." },
    { type: "input", q: "(Article) At what time does the park close? At ___ p.m.", a: ["9", "nine"], ph: "heure", exp: "open from 8 a.m. to 9 p.m." },
    { type: "vf", q: "(Article) Local people are happy because there was no green space before.", a: true, exp: "there was no green space in this area before." },
    { type: "qcm", q: "Quelle stratégie sert à chercher une info précise (une heure, un nom) ?", opts: ["Skimming", "Scanning", "Traduire chaque mot", "Deviner"], a: 1, exp: "Scanning = balayer le texte pour une info précise." }
  ],
  final: {
    title: "Exercice final — A short message",
    intro: `<p>Lis ce court message, puis réponds aux questions. Applique le scanning pour retrouver les informations précises.</p>
<pre class="pseudo">Hi Tom,

I cannot come to the football match on Sunday because I am visiting my
grandmother in Leeds. I am really sorry! But I am free next Saturday.
Do you want to play tennis in the morning? Let me know. Also, can you
bring back my blue jacket? I left it at your house last week.

Thanks,
Ben</pre>`,
    questions: [
      { type: "qcm", q: "Why can't Ben come to the football match?", opts: ["He is ill", "He is visiting his grandmother", "He is playing tennis", "He is working"], a: 1, exp: "I am visiting my grandmother in Leeds." },
      { type: "input", q: "Where does Ben's grandmother live? In ___", a: ["leeds"], ph: "ville", exp: "my grandmother in Leeds." },
      { type: "qcm", q: "What does Ben suggest for next Saturday?", opts: ["A football match", "Tennis in the morning", "Lunch", "A visit to Leeds"], a: 1, exp: "Do you want to play tennis in the morning ?" },
      { type: "vf", q: "Ben left his blue jacket at Tom's house.", a: true, exp: "can you bring back my blue jacket ? I left it at your house." },
      { type: "input", q: "What colour is the jacket Ben forgot? ___", a: ["blue"], ph: "couleur", exp: "my blue jacket." }
    ],
    solution: `<p>Ben ne peut pas venir dimanche (il visite sa grand-mère à Leeds), propose du tennis samedi prochain, et demande de récupérer sa veste bleue oubliée chez Tom.</p>
<pre class="pseudo">because I am visiting my grandmother  -> la raison (scanning : "because")
next Saturday... tennis               -> la proposition
my blue jacket... I left it           -> l'objet oublié</pre>
<p>Pour chaque question, repère les mots-clés (grandmother, Saturday, jacket) et lis autour : c'est tout l'art du scanning. Tu n'as pas besoin de comprendre chaque mot pour trouver l'information.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-a2-j27", title: "Answer the e-mail", level: 2,
    statement: "Relis l'e-mail d'Emma (dans la théorie) et écris une réponse de 5 à 6 phrases. Remercie-la pour sa nouvelle, pose-lui une question sur son travail, et dis si tu peux venir lui rendre visite le mois prochain.",
    hints: [
      "Commence par Dear Emma, et termine par Best wishes, + ton prénom.",
      "Réagis à sa nouvelle : Congratulations on your new job!",
      "Réponds à son invitation : Yes, I would love to visit you..."
    ],
    solution: "Dear Emma,\n\nThank you for your e-mail! Congratulations on your new job in the bookshop. It sounds wonderful, especially the discount on books! How many hours do you work each day? I am happy that your colleagues are so friendly. Yes, I would love to visit you next month. I am free on the second weekend. We can have lunch and talk for hours!\n\nWrite back soon.\n\nBest wishes,\nJulie\n\nTraduction:\nChère Emma,\n\nMerci pour ton e-mail ! Félicitations pour ton nouveau travail dans la librairie. Ça a l'air merveilleux, surtout la réduction sur les livres ! Combien d'heures travailles-tu chaque jour ? Je suis contente que tes collègues soient si sympathiques. Oui, j'adorerais te rendre visite le mois prochain. Je suis libre le deuxième week-end. Nous pourrons déjeuner et parler pendant des heures !\n\nÉcris-moi vite.\n\nBien à toi,\nJulie",
    note: "Un e-mail de réponse suit toujours la même structure : appel (Dear...), réaction, questions, réponse à l'invitation, formule de fin. Réutilise les infos du texte de départ." }
  ]
};
</script>
