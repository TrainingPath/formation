  title: "Le temps qu'il fait",
  subtitle: "Parler de la météo, des saisons et faire des prévisions simples.",
  theory: `
<h3>1. Décrire la météo avec « It is »</h3>
<p>En anglais, on parle du temps avec le sujet impersonnel <strong>it</strong> (« il » de « il pleut »). La structure de base est <strong>It is + adjectif</strong>.</p>
<pre class="pseudo">It is sunny.        Il y a du soleil.
It is cloudy.       Il y a des nuages.
It is windy.        Il y a du vent.
It is rainy.        Il pleut / c'est pluvieux.
It is cold.         Il fait froid.
It is hot.          Il fait chaud.
It is warm.         Il fait bon (doux).
It is foggy.        Il y a du brouillard.</pre>
<div class="warn">On ne dit pas <em>The weather is sun</em> mais <strong>It is sunny</strong> (avec l'adjectif). Le nom est <em>sun</em> (soleil), l'adjectif est <em>sunny</em> (ensoleillé).</div>
<h3>2. Les verbes de météo</h3>
<p>Certains temps s'expriment avec un verbe, souvent au présent continu (be + -ing) pour ce qui se passe maintenant :</p>
<pre class="pseudo">It is raining.       Il pleut (en ce moment).
It is snowing.       Il neige.
The sun is shining.  Le soleil brille.</pre>
<h3>3. Demander quel temps il fait</h3>
<pre class="pseudo">What is the weather like?      Quel temps fait-il ?
What is it like outside?       Il fait quel temps dehors ?
It is a lovely day.            C'est une belle journée.
It is a horrible day.          C'est une journée horrible.</pre>
<div class="tip">La question <strong>What is the weather like?</strong> est la formule figée à connaitre. Le mot <em>like</em> ici ne veut pas dire « aimer » mais « comment ». Réponds simplement par <em>It is + adjectif</em>.</div>
<h3>4. Les saisons et la température</h3>
<pre class="pseudo">spring     le printemps
summer     l'été
autumn     l'automne
winter     l'hiver
It is 25 degrees.         Il fait 25 degrés.
The temperature is high.  La température est élevée.</pre>
<h3>5. La météo future : « will » et « going to »</h3>
<p>Pour une prévision, on utilise <strong>will</strong> ou <strong>be going to</strong> (vus aux jours précédents) :</p>
<pre class="pseudo">Tomorrow it will be sunny.        Demain il fera beau.
It is going to rain this evening. Il va pleuvoir ce soir.
It will be cold at the weekend.   Il fera froid ce week-end.</pre>`,

    { type: "input", q: "Traduis « il fait froid » : It is ___", a: ["cold"], ph: "adjectif", exp: "cold = froid." },
    { type: "vf", q: "On dit « It is sunny » et non « The weather is sun ».", a: true, exp: "On emploie l'adjectif sunny, pas le nom sun." },

    { type: "input", q: "Traduis « il fait chaud » : It is ___", a: ["hot"], ph: "adjectif", exp: "hot = chaud." },

    { type: "input", q: "Complète : « It is ___ » pour dire « il neige ».", a: ["snowing"], ph: "verbe en -ing", exp: "It is snowing = il neige." },
    { type: "vf", q: "Dans « What is the weather like? », le mot « like » signifie « comment » et non « aimer ».", a: true, exp: "C'est une expression figée : le temps ressemble à quoi ?" },
    { type: "qcm", q: "Pour une prévision « demain il fera beau », on dit :", opts: ["Tomorrow it is sunny.", "Tomorrow it will be sunny.", "Tomorrow it was sunny.", "Tomorrow it sunny."], a: 1, exp: "will be pour le futur." },
    { type: "input", q: "Traduis « il y a du vent » : It is ___", a: ["windy"], ph: "adjectif", exp: "windy = venteux." },
    { type: "qcm", q: "Quel mot signifie « le printemps » ?", opts: ["spring", "summer", "winter", "autumn"], a: 0, exp: "spring = printemps." },
    { type: "input", q: "Complète : « It is going to ___ this evening » (il va pleuvoir).", a: ["rain"], ph: "un verbe", exp: "going to rain = va pleuvoir." },
    { type: "vf", q: "« It is 25 degrees » veut dire « il fait 25 degrés ».", a: true, exp: "degrees = degrés." },
    { type: "qcm", q: "« It is a lovely day » signifie :", opts: ["C'est une journée horrible", "C'est une belle journée", "Il fait froid", "Il pleut"], a: 1, exp: "lovely = beau, agréable." }
  ],

<pre class="pseudo">Good morning! Here is the weather for today. In the north, it is cold

<pre class="pseudo">It is cold and cloudy.        -> temps present (it is + adjectif)

It is going to be sunny.      -> prevision avec going to</pre>
<p>Retiens la structure <strong>It is + adjectif</strong> pour le présent et <strong>It will be</strong> pour les prévisions.</p>`
