<script>
var DAY = {
  num: 1,
  title: "Le passé simple : verbes réguliers",
  subtitle: "Raconter le passé avec la terminaison -ed.",
  theory: `
<h3>1. À quoi sert le passé simple ?</h3>
<p>Le <strong>passé simple</strong> (en anglais <em>past simple</em>, ou <em>preterit</em>) sert à parler d'une action <strong>terminée</strong> dans le passé. En français, c'est souvent le passé composé ou l'imparfait : « J'ai joué », « Je jouais ». Exemple : <em>Yesterday I played football.</em> (« Hier, j'ai joué au football. »)</p>
<h3>2. La règle de base : verbe + -ed</h3>
<p>Pour les <strong>verbes réguliers</strong>, on ajoute simplement <strong>-ed</strong> à la base du verbe. La forme est <strong>la même pour toutes les personnes</strong> (I, you, he, she, it, we, they) : c'est une bonne nouvelle !</p>
<pre class="pseudo">Base       Passé simple      Traduction
play       played            j'ai joué
work       worked            j'ai travaillé
watch      watched           j'ai regardé
cook       cooked            j'ai cuisiné</pre>
<h3>3. Les petites règles d'orthographe</h3>
<p>Trois cas particuliers changent l'orthographe (mais pas le son -ed) :</p>
<pre class="pseudo">Cas                          Exemple           Passé
verbe finissant par -e       like -> add -d    liked
consonne + y -> i + ed       study -> studi    studied
voyelle courte + consonne    stop -> pp + ed   stopped
(on double la consonne)      travel            travelled</pre>
<div class="tip">Si le verbe finit par <strong>-e</strong>, on ajoute juste <strong>-d</strong> : <em>live -> lived</em>, <em>love -> loved</em>.</div>
<h3>4. Les mots du passé</h3>
<p>Certains mots signalent qu'on parle du passé : <em>yesterday</em> (hier), <em>last week / last year</em> (la semaine dernière / l'an dernier), <em>two days ago</em> (il y a deux jours), <em>in 2010</em> (en 2010).</p>
<div class="warn">Attention : de nombreux verbes très courants sont <strong>irréguliers</strong> (go -> went, have -> had). On les verra au Jour 2 ! Aujourd'hui, on se concentre sur les réguliers en -ed.</div>`,
  exercises: [
    { type: "input", q: "Complète : Yesterday I ___ (play) football.", a: ["played"], ph: "verbe au passé", exp: "play + ed = played." },
    { type: "input", q: "Complète : She ___ (work) hard last week.", a: ["worked"], ph: "verbe au passé", exp: "work + ed = worked, identique à toutes les personnes." },
    { type: "input", q: "Complète : They ___ (watch) TV all evening.", a: ["watched"], ph: "verbe au passé", exp: "watch + ed = watched." },
    { type: "qcm", q: "Quel est le passé simple de « study » ?", opts: ["studyed", "studied", "studed", "studies"], a: 1, exp: "Consonne + y devient i + ed : studied." },
    { type: "qcm", q: "Quel est le passé simple de « stop » ?", opts: ["stoped", "stopd", "stopped", "stopt"], a: 2, exp: "Voyelle courte + consonne : on double le p, stopped." },
    { type: "input", q: "Complète : We ___ (like) the film.", a: ["liked"], ph: "verbe au passé", exp: "Le verbe finit par -e, on ajoute juste -d : liked." },
    { type: "vf", q: "Les verbes réguliers forment leur passé en ajoutant -ed.", a: true, exp: "C'est la règle de base : play -> played." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["He playd tennis.", "He played tennis.", "He plaied tennis.", "He plays tennis yesterday."], a: 1, exp: "played est la forme correcte du passé." },
    { type: "input", q: "Complète : He ___ (live) in London two years ago.", a: ["lived"], ph: "verbe au passé", exp: "live finit par -e : on ajoute -d, lived." },
    { type: "vf", q: "La forme du passé simple change selon le sujet (I, he, they).", a: false, exp: "Faux : la forme est identique pour toutes les personnes. I worked, he worked, they worked." },
    { type: "qcm", q: "Quel mot indique une action au passé ?", opts: ["now", "tomorrow", "yesterday", "every day"], a: 2, exp: "yesterday = hier, un marqueur du passé." },
    { type: "input", q: "Complète : I ___ (carry) the heavy bag.", a: ["carried"], ph: "verbe au passé", exp: "Consonne + y : carry -> carried." },
    { type: "qcm", q: "Quel est le passé simple de « cook » ?", opts: ["cook", "cookd", "cooked", "cookied"], a: 2, exp: "Verbe régulier normal : cook + ed = cooked." },
    { type: "input", q: "Complète : They ___ (travel) to Spain last summer.", a: ["travelled", "traveled"], ph: "verbe au passé", exp: "On double le l en anglais britannique : travelled (ou traveled en anglais américain)." },
    { type: "vf", q: "Le passé simple de « want » est « wanted ».", a: true, exp: "want + ed = wanted, verbe régulier." }
  ],
  final: {
    title: "Exercice final — Le samedi de Tom",
    intro: `<p>Lis ce petit texte, puis réponds aux questions :</p>
<pre class="pseudo">Last Saturday, Tom stayed at home. In the morning he
cleaned his room and washed the dishes. Then he cooked
lunch for his family. In the afternoon he watched a film
and listened to music. He really enjoyed his day.</pre>`,
    questions: [
      { type: "qcm", q: "When did Tom stay at home? (Quand Tom est-il resté à la maison ?)", opts: ["Last Sunday", "Last Saturday", "Yesterday", "This morning"], a: 1, exp: "Le texte dit « Last Saturday » : samedi dernier." },
      { type: "vf", q: "Tom cleaned his room in the morning. (Tom a nettoyé sa chambre le matin.)", a: true, exp: "« In the morning he cleaned his room » : vrai." },
      { type: "qcm", q: "What did Tom cook? (Qu'a cuisiné Tom ?)", opts: ["breakfast", "dinner", "lunch", "a cake"], a: 2, exp: "« he cooked lunch » : le déjeuner." },
      { type: "input", q: "Complète d'après le texte : He ___ (wash) the dishes.", a: ["washed"], ph: "verbe au passé", exp: "wash + ed = washed." },
      { type: "vf", q: "Tom hated his day. (Tom a détesté sa journée.)", a: false, exp: "Faux : « He really enjoyed his day » = il a vraiment aimé sa journée." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Samedi dernier, Tom est resté à la maison. Le matin, il a
nettoye sa chambre et a fait la vaisselle. Puis il a cuisine
le dejeuner pour sa famille. L'apres-midi, il a regarde un
film et ecoute de la musique. Il a vraiment aime sa journee.</pre>
<p>Remarque tous les verbes réguliers en -ed : stayed, cleaned, washed, cooked, watched, listened, enjoyed. La forme ne change jamais selon la personne : c'est la grande simplicité du passé régulier anglais.</p>`
  }
};
</script>

    solution: "Yesterday I worked in the morning. Then I cooked a pizza for lunch. In the evening I watched a film and listened to music.\n\n(Traduction : Hier j'ai travaille le matin. Puis j'ai cuisine une pizza pour le dejeuner. Le soir j'ai regarde un film et ecoute de la musique.)",
    note: "Tous les verbes réguliers prennent -ed sans changer selon la personne. Vérifie juste l'orthographe des verbes en -e, en -y et à voyelle courte." }
  ]
