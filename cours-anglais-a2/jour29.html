<script>
var DAY = {
  num: 29,
  title: "Révisions A2",
  subtitle: "Faire le point sur toute la grammaire et le vocabulaire du niveau.",
  theory: `
<h3>1. Les temps du niveau A2</h3>
<p>Tu as vu plusieurs temps. Voici la carte pour ne plus les confondre :</p>
<pre class="pseudo">Présent simple      habitudes, vérités     I work every day.
Présent continu     action en cours        I am working now.
Passé simple        action terminée        I worked yesterday.
Passé continu       décor du passé         I was working when...
Present perfect     lien passé-présent     I have worked here for years.
Futur (be going to) intention/prévision    I am going to work.
Futur (will)        décision/prédiction    I will work tomorrow.</pre>
<div class="tip">La grande difficulté A2 : passé simple VS present perfect. Passé simple = quand on précise QUAND (yesterday, in 2020). Present perfect = pas de moment précis, on regarde le résultat maintenant (already, ever, never, for, since).</div>
<h3>2. Comparatif et superlatif</h3>
<pre class="pseudo">Court : big -> bigger -> the biggest       (adjectif + er / est)
Long : expensive -> more expensive -> the most expensive
Irrégulier : good -> better -> the best ; bad -> worse -> the worst</pre>
<h3>3. Quantité : dénombrable ou pas</h3>
<pre class="pseudo">Dénombrable (comptable) : how many apples? a few, many
Indénombrable : how much water? a little, much
Les deux : some, any, a lot of</pre>
<div class="warn">Rappel : <strong>some</strong> dans les phrases affirmatives, <strong>any</strong> dans les questions et négations. <em>I have some money. Do you have any money? I do not have any money.</em></div>
<h3>4. Les modaux essentiels</h3>
<pre class="pseudo">can      capacité/permission    I can swim.
must     obligation forte       You must stop.
have to  obligation (règle)     I have to work.
should   conseil                You should rest.</pre>
<h3>5. Les connecteurs et le conditionnel</h3>
<pre class="pseudo">and (addition), but (opposition), because (cause), so (conséquence)
Conditionnel 1 : If + présent, ... will + base
If it rains, I will stay home.</pre>
<h3>6. Le vocabulaire des situations</h3>
<p>Révise les grands thèmes du niveau : les vêtements et le shopping, le voyage (aéroport, hotel), le restaurant, la ville et les directions, la météo, les loisirs et le sport, le corps et la santé. Ce sont les scènes de la vie courante que tu dois pouvoir gérer en anglais.</p>
<div class="tip">Pour réviser efficacement : pour chaque thème, essaie de dire à voix haute 5 mots et 2 phrases utiles. Si tu bloques, retourne au jour concerné.</div>`,
  exercises: [
    { type: "qcm", q: "« I ___ to London in 2019. » Quel temps ?", opts: ["go", "went", "have gone", "am going"], a: 1, exp: "Moment précis (2019) -> passé simple : went." },
    { type: "input", q: "Comparatif de « big » : ___", a: ["bigger"], ph: "comparatif", exp: "big -> bigger (adjectif court + er)." },
    { type: "qcm", q: "Superlatif de « expensive » :", opts: ["expensivest", "the most expensive", "more expensive", "the expensivest"], a: 1, exp: "Adjectif long : the most expensive." },
    { type: "input", q: "Complète : « How ___ water do you drink? » (indénombrable).", a: ["much"], ph: "much/many", exp: "water est indénombrable -> how much." },
    { type: "qcm", q: "Comparatif irrégulier de « good » :", opts: ["gooder", "more good", "better", "the best"], a: 2, exp: "good -> better -> the best." },
    { type: "input", q: "Complète : « Do you have ___ money? » (question -> some ou any ?).", a: ["any"], ph: "some/any", exp: "Dans les questions : any." },
    { type: "qcm", q: "« You ___ rest, you look tired. » Quel modal pour un conseil ?", opts: ["must", "should", "can", "have to"], a: 1, exp: "should = conseil." },
    { type: "input", q: "Complète le conditionnel : « If it ___ , I will stay home » (rain, présent).", a: ["rains"], ph: "présent", exp: "Après if : présent -> rains." },
    { type: "qcm", q: "« I have ___ finished my homework. » Quel mot va avec le present perfect ?", opts: ["yesterday", "already", "in 2020", "last week"], a: 1, exp: "already accompagne le present perfect (pas de moment précis)." },
    { type: "input", q: "Complète : « How ___ apples are there? » (dénombrable).", a: ["many"], ph: "much/many", exp: "apples est dénombrable -> how many." },
    { type: "qcm", q: "Quel connecteur exprime la conséquence ?", opts: ["but", "because", "so", "and"], a: 2, exp: "so = donc, conséquence." },
    { type: "input", q: "Complète : « I ___ swim very well » (capacité, modal).", a: ["can"], ph: "modal", exp: "can = capacité." },
    { type: "vf", q: "On utilise le present perfect avec « for » et « since ».", a: true, exp: "I have lived here for five years / since 2019." },
    { type: "qcm", q: "« She is ___ than her brother. » (tall). Forme correcte ?", opts: ["taller", "more tall", "tallest", "the taller"], a: 0, exp: "Adjectif court : taller than." },
    { type: "input", q: "Complète : « I am going ___ visit my aunt next week » (futur intention).", a: ["to"], ph: "un mot", exp: "be going to + base : going to visit." }
  ],
  final: {
    title: "Exercice final — A little bit of everything",
    intro: `<p>Lis ce texte qui mélange tous les points du niveau, puis réponds aux questions.</p>
<pre class="pseudo">My name is Clara and I live in a small but lovely town. I have worked
in a bakery for three years, and I love it. Yesterday was very busy:
we sold more bread than usual. I am tired today, so I am going to rest
this evening. If the weather is nice tomorrow, I will go cycling with
my friends. I think cycling is the best way to relax. You should try
it!</pre>`,
    questions: [
      { type: "qcm", q: "How long has Clara worked in the bakery?", opts: ["One year", "Three years", "Yesterday", "Next week"], a: 1, exp: "I have worked in a bakery for three years (present perfect + for)." },
      { type: "input", q: "Complète : « We sold ___ bread than usual » (comparatif de many/much).", a: ["more"], ph: "comparatif", exp: "more bread than usual." },
      { type: "qcm", q: "Why is Clara going to rest this evening?", opts: ["Because it is raining", "Because she is tired", "Because she is cycling", "Because it is Sunday"], a: 1, exp: "I am tired today, so I am going to rest." },
      { type: "vf", q: "If the weather is nice tomorrow, Clara will go cycling.", a: true, exp: "conditionnel 1 : If it is nice, I will go cycling." },
      { type: "input", q: "Complète : « Cycling is the ___ way to relax » (superlatif de good).", a: ["best"], ph: "superlatif", exp: "good -> the best." }
    ],
    solution: `<p>Ce texte combine presque tous les points A2 : present perfect (I have worked for three years), passé simple (Yesterday... we sold), comparatif (more bread than), connecteur (so), futur intention (I am going to rest), conditionnel 1 (If... I will go), superlatif (the best) et modal de conseil (You should).</p>
<pre class="pseudo">have worked for three years  -> present perfect + for
Yesterday we sold            -> passé simple (moment précis)
I am going to rest           -> futur intention
If it is nice, I will go     -> conditionnel type 1
the best way / You should    -> superlatif + conseil</pre>
<p>Si tu as reconnu tous ces points, tu maitrises l'essentiel du niveau A2. Sinon, retourne au jour correspondant : c'est le moment de consolider avant le bilan.</p>`
  }
};
</script>
