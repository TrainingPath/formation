<script>
var DAY = {

  title: "Les prépositions de temps",
  subtitle: "IN, ON, AT : dire quand les choses se passent.",
  theory: `
<h3>1. Trois petites prépositions</h3>
<p>Pour situer une action dans le temps, l'anglais utilise surtout <strong>in</strong>, <strong>on</strong> et <strong>at</strong>. Le choix suit des règles assez régulières, qu'il faut mémoriser. En français, on traduit souvent par « en », « à », « le ».</p>
<h3>2. AT : les heures et quelques moments précis</h3>
<pre class="pseudo">at 8 o'clock       a 8 heures
at midnight        a minuit
at noon            a midi
at night           la nuit
at the weekend     le week-end (anglais britannique)
at Christmas       a Noel</pre>
<h3>3. ON : les jours et les dates</h3>
<pre class="pseudo">on Monday          lundi
on Fridays         le vendredi (habitude)
on 25 December     le 25 decembre
on my birthday     le jour de mon anniversaire
on New Year's Day  le jour de l'An</pre>
<h3>4. IN : les longues périodes</h3>
<pre class="pseudo">in the morning     le matin
in April           en avril
in summer          en ete
in 2020            en 2020
in the 21st century  au 21e siecle</pre>
<div class="tip">Astuce visuelle : va du plus large au plus précis. <strong>IN</strong> pour les grandes périodes (mois, saisons, années), <strong>ON</strong> pour un jour précis, <strong>AT</strong> pour un point précis (une heure). Comme un zoom : in April -> on 5 April -> at 3 o'clock.</div>
<div class="warn">Pièges à retenir par coeur : <em>at night</em> (mais <em>in the morning / afternoon / evening</em>), <em>at the weekend</em>, <em>on Monday morning</em> (quand on précise le jour, on garde ON). Et surtout : PAS de préposition avec <em>today, tomorrow, yesterday, next, last, this, every</em> : on dit <em>see you tomorrow</em>, <em>last week</em> (jamais « in tomorrow »).</div>`,
  exercises: [
    { type: "input", q: "Complète : The meeting is ___ 3 o'clock. (in / on / at)", a: ["at"], ph: "in / on / at", exp: "Une heure : at 3 o'clock." },
    { type: "input", q: "Complète : My birthday is ___ Monday. (in / on / at)", a: ["on"], ph: "in / on / at", exp: "Un jour : on Monday." },
    { type: "input", q: "Complète : It's very cold ___ winter. (in / on / at)", a: ["in"], ph: "in / on / at", exp: "Une saison : in winter." },
    { type: "qcm", q: "Complète : I was born ___ 2005.", opts: ["at", "on", "in", "by"], a: 2, exp: "Une année : in 2005." },
    { type: "input", q: "Complète : We have a party ___ 25 December. (in / on / at)", a: ["on"], ph: "in / on / at", exp: "Une date : on 25 December." },
    { type: "qcm", q: "Complète : I don't work ___ night.", opts: ["in", "on", "at", "by"], a: 2, exp: "Piège : at night (mais in the morning)." },
    { type: "input", q: "Complète : She reads ___ the morning. (in / on / at)", a: ["in"], ph: "in / on / at", exp: "in the morning (mais at night)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I'll see you in tomorrow.", "I'll see you tomorrow.", "I'll see you on tomorrow.", "I'll see you at tomorrow."], a: 1, exp: "Pas de préposition avec tomorrow : see you tomorrow." },
    { type: "input", q: "Complète : The train leaves ___ noon. (in / on / at)", a: ["at"], ph: "in / on / at", exp: "at noon (comme at midnight)." },
    { type: "qcm", q: "Complète : It often rains ___ April.", opts: ["at", "on", "in", "by"], a: 2, exp: "Un mois : in April." },
    { type: "input", q: "Complète : Let's meet ___ Friday evening. (in / on / at)", a: ["on"], ph: "in / on / at", exp: "Quand on précise le jour : on Friday evening." },
    { type: "vf", q: "On dit « at the weekend » en anglais britannique.", a: true, exp: "Vrai : at the weekend (BrE)." },
    { type: "input", q: "Complète : I finish school ___ 4 o'clock ___ the afternoon. (heure / période)", a: ["at"], ph: "préposition de l'heure", exp: "at 4 o'clock (l'heure), in the afternoon (la période)." },
    { type: "qcm", q: "Faut-il une préposition ? « I saw him ___ last week. »", opts: ["in", "on", "at", "aucune"], a: 3, exp: "Pas de préposition avec last : I saw him last week." },
    { type: "input", q: "Complète : My grandfather was young ___ the 20th century. (in / on / at)", a: ["in"], ph: "in / on / at", exp: "Un siècle : in the 20th century." }
  ],
  final: {
    title: "Exercice final — L'emploi du temps de Sam",
    intro: `<p>Sam décrit sa semaine. Lis, puis réponds :</p>
<pre class="pseudo">Sam is very busy. He starts work at eight o'clock in the
morning. On Mondays he has a meeting at noon. In the
evening he goes to the gym, but at night he sleeps well.
On Saturday he visits his parents, and in summer they all
go on holiday together. His birthday is on 12 July.</pre>`,
    questions: [
      { type: "input", q: "Complète d'après le texte : He starts work ___ eight o'clock. (préposition)", a: ["at"], ph: "in / on / at", exp: "Une heure : at eight o'clock." },
      { type: "qcm", q: "When does Sam have a meeting? (Quand Sam a-t-il une réunion ?)", opts: ["on Sundays at noon", "on Mondays at noon", "in the evening", "at night"], a: 1, exp: "« On Mondays he has a meeting at noon »." },
      { type: "input", q: "Complète d'après le texte : He visits his parents ___ Saturday. (préposition)", a: ["on"], ph: "in / on / at", exp: "Un jour : on Saturday." },
      { type: "vf", q: "They go on holiday in summer. (Ils partent en vacances en été.)", a: true, exp: "« in summer they all go on holiday »." },
      { type: "input", q: "Complète d'après le texte : His birthday is ___ 12 July. (préposition)", a: ["on"], ph: "in / on / at", exp: "Une date : on 12 July." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Sam est tres occupe. Il commence le travail a huit heures
le matin. Le lundi, il a une reunion a midi. Le soir il va
a la salle de sport, mais la nuit il dort bien. Le samedi
il rend visite a ses parents, et en ete ils partent tous
en vacances ensemble. Son anniversaire est le 12 juillet.</pre>
<p>Repère le système : at (heures : at eight, at noon, at night), on (jours et dates : on Mondays, on Saturday, on 12 July), in (périodes : in the morning, in the evening, in summer). Le zoom du large au précis (in -> on -> at) est un bon guide.</p>`
  }
};
