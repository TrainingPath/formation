<script>
var DAY = {
  num: 5,
  title: "Le futur : will",
  subtitle: "Prédictions, décisions spontanées et promesses.",
  theory: `
<h3>1. Le futur avec « will »</h3>
<p><strong>will</strong> est un auxiliaire de futur. Sa grande force : il est <strong>invariable</strong> ! On écrit <strong>will + verbe à la base</strong> pour toutes les personnes, sans exception. Exemple : <em>I will help you.</em> (« Je vais t'aider / Je t'aiderai. »)</p>
<pre class="pseudo">Sujet             will   verbe    Traduction
I / You / He /    will   travel   je voyagerai, tu voyageras...
She / We / They   will   be       ...il sera, nous serons</pre>
<p>La forme courte est <strong>'ll</strong> : <em>I'll, you'll, he'll, we'll, they'll</em>.</p>
<h3>2. Négation et questions</h3>
<pre class="pseudo">Négatif :   I will not help.   ->   I won't help.
Question :  Will you help me?
Réponse :   Yes, I will. / No, I won't.</pre>
<div class="warn">La forme courte négative est <strong>won't</strong> (et non « willn't ») : <em>She won't come.</em> = elle ne viendra pas.</div>
<h3>3. Quand utiliser « will » ?</h3>
<pre class="pseudo">Emploi                       Exemple
Prédiction (opinion, futur)  I think it will rain tomorrow.
Décision spontanée           The phone is ringing. I'll answer it.
Promesse                     I promise I will call you.
Proposition d'aide           I'll carry your bag.</pre>
<h3>4. will ou be going to ?</h3>
<p>Les deux parlent du futur, mais avec une nuance :</p>
<pre class="pseudo">be going to  ->  projet DEJA decide     (I'm going to visit Rome next month.)
will         ->  decision spontanee,    (OK, I'll visit Rome! / It will be fun.)
                 prediction, promesse</pre>
<div class="tip">Repère utile : si tu décides au moment même de parler, utilise <strong>will</strong>. Si le projet existait déjà avant de parler, utilise <strong>be going to</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la forme correcte du futur avec will ?", opts: ["I will to travel.", "I will travel.", "I will travelling.", "I will travels."], a: 1, exp: "will + verbe à la base : will travel." },
    { type: "vf", q: "« will » change de forme selon la personne (I will, he wills).", a: false, exp: "Faux : will est invariable. I will, he will, they will." },
    { type: "input", q: "Écris la forme courte négative de « will not » :", a: ["won't"], ph: "forme courte", exp: "will not -> won't." },
    { type: "input", q: "Complète : I ___ help you tomorrow. (auxiliaire du futur)", a: ["will", "'ll"], ph: "auxiliaire", exp: "I will help you." },
    { type: "qcm", q: "Complète : She ___ come to the party.", opts: ["will comes", "will to come", "will come", "wills come"], a: 2, exp: "will + base : will come." },
    { type: "qcm", q: "Quelle phrase exprime une décision spontanée ?", opts: ["I am going to buy a house next year.", "The phone is ringing. I'll answer it.", "I visited Rome last week.", "I usually get up at 7."], a: 1, exp: "On décide au moment de parler : I'll answer it." },
    { type: "input", q: "Complète la question : ___ you help me, please? (auxiliaire)", a: ["will"], ph: "auxiliaire", exp: "Will you help me? Will en tête pour la question." },
    { type: "vf", q: "La forme négative courte de « will not » est « won't ».", a: true, exp: "Vrai : won't. (Attention, pas « willn't ».)" },
    { type: "qcm", q: "Complète : They ___ be here at 6 o'clock.", opts: ["will", "are will", "will to", "wills"], a: 0, exp: "They will be here." },
    { type: "input", q: "Complète : It's cloudy. I think it ___ rain. (auxiliaire)", a: ["will", "'ll"], ph: "auxiliaire", exp: "I think it will rain : prédiction avec will." },
    { type: "qcm", q: "Traduis : « Je ne t'oublierai pas. »", opts: ["I won't forget you.", "I don't forget you.", "I not will forget you.", "I willn't forget you."], a: 0, exp: "I won't forget you." },
    { type: "input", q: "Complète : We ___ see you next week. (forme courte)", a: ["'ll", "will"], ph: "forme courte du futur", exp: "We'll see you = We will see you." },
    { type: "qcm", q: "« I'm going to study medicine » plutôt que « I'll study medicine » parce que :", opts: ["c'est une décision prise à l'instant", "c'est un projet déjà décidé", "c'est une action passée", "will est incorrect"], a: 1, exp: "be going to = projet déjà planifié." },
    { type: "input", q: "Complète : He ___ not (won't) be late. (forme courte négative)", a: ["won't"], ph: "forme courte négative", exp: "He won't be late = he will not be late." },
    { type: "vf", q: "« Will you marry me? » est une question correcte au futur.", a: true, exp: "Vrai : Will + sujet + base ? Question au futur." }
  ],
  final: {
    title: "Exercice final — La voyante",
    intro: `<p>Une voyante prédit l'avenir de Léo. Lis, puis réponds :</p>
<pre class="pseudo">Madame Rosa looks into her crystal ball. "You will have a
wonderful life, Leo. You will travel to many countries and
you will meet a lot of interesting people. You won't be
rich, but you will be very happy. One day you will write a
famous book. I promise your dreams will come true!"</pre>`,
    questions: [
      { type: "vf", q: "Leo will travel to many countries. (Léo voyagera dans beaucoup de pays.)", a: true, exp: "« You will travel to many countries »." },
      { type: "qcm", q: "Will Leo be rich? (Léo sera-t-il riche ?)", opts: ["Yes, very rich.", "No, but he will be happy.", "Yes, and unhappy.", "The text doesn't say."], a: 1, exp: "« You won't be rich, but you will be very happy »." },
      { type: "input", q: "Complète d'après le texte : One day you ___ write a famous book. (auxiliaire)", a: ["will", "'ll"], ph: "auxiliaire", exp: "you will write : futur avec will." },
      { type: "qcm", q: "What does Madame Rosa promise? (Que promet Madame Rosa ?)", opts: ["Leo will be rich.", "Leo's dreams will come true.", "Leo will stay home.", "Leo will be sad."], a: 1, exp: "« I promise your dreams will come true! »." },
      { type: "input", q: "Écris la forme courte de « will not » utilisée dans le texte :", a: ["won't"], ph: "forme courte", exp: "« You won't be rich » : won't = will not." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Madame Rosa regarde dans sa boule de cristal. « Tu auras
une vie merveilleuse, Leo. Tu voyageras dans beaucoup de
pays et tu rencontreras plein de gens interessants. Tu ne
seras pas riche, mais tu seras tres heureux. Un jour tu
ecriras un livre celebre. Je promets que tes reves se
realiseront ! »</pre>
<p>Chaque prédiction utilise <strong>will + base</strong> (invariable) : will have, will travel, will meet, will be, will write, will come. La seule négation, won't be, est la contraction de will not. Idéal pour prédictions et promesses.</p>`
  }
};
</script>
