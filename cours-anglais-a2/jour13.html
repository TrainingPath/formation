  title: "Les modaux : must, have to, should",
  subtitle: "Exprimer l'obligation, l'interdiction et le conseil.",
  theory: `
<h3>1. Que sont les modaux ?</h3>
<p>Les <strong>modaux</strong> sont de petits auxiliaires qui ajoutent une nuance au verbe : obligation, conseil, interdiction... Règle commune : ils sont suivis du <strong>verbe à la base</strong> (sans « to », sans -s, sans -ed).</p>
<h3>2. MUST : obligation forte (venue de soi)</h3>
<pre class="pseudo">You must wear a seatbelt.     Tu dois mettre ta ceinture.
I must call my mother.        Je dois appeler ma mere.</pre>
<p><strong>must</strong> exprime une obligation forte, souvent ressentie par la personne elle-même ou une règle importante.</p>
<h3>3. HAVE TO : obligation (venue de l'extérieur)</h3>
<pre class="pseudo">I have to work on Saturday.   Je dois travailler samedi. (regle exterieure)
She has to wear a uniform.    Elle doit porter un uniforme.</pre>
<p><strong>have to</strong> exprime une obligation venue d'une règle extérieure. Il se conjugue (has to à la 3e personne) et utilise <em>do/does</em> pour la négation et les questions : <em>Do you have to go?</em></p>
<div class="warn">Piège de la négation ! <strong>mustn't</strong> = interdiction (« ne pas devoir = il ne faut pas ») ; <strong>don't have to</strong> = absence d'obligation (« ce n'est pas obligatoire »). <em>You mustn't smoke</em> (interdit) n'est PAS <em>You don't have to smoke</em> (tu peux, mais ce n'est pas obligé).</div>
<h3>4. SHOULD : le conseil</h3>
<pre class="pseudo">You should see a doctor.      Tu devrais voir un medecin.
You shouldn't eat so much.    Tu ne devrais pas manger autant.</pre>
<p><strong>should</strong> (= « devrais ») donne un <strong>conseil</strong>, une recommandation. Plus doux qu'une obligation.</p>
<div class="tip">Résumé : <strong>must / have to</strong> = tu es obligé ; <strong>mustn't</strong> = c'est interdit ; <strong>don't have to</strong> = ce n'est pas obligatoire ; <strong>should</strong> = c'est une bonne idée.</div>`,
  exercises: [
    { type: "qcm", q: "Après un modal comme « must », le verbe est :", opts: ["à la base (must go)", "avec to (must to go)", "en -ing (must going)", "au passé (must went)"], a: 0, exp: "Modal + base : you must go." },
    { type: "input", q: "Complète : You ___ wear a seatbelt in the car. (obligation forte)", a: ["must"], ph: "modal", exp: "must wear : obligation forte." },
    { type: "qcm", q: "Complète (obligation extérieure, 3e personne) : She ___ wear a uniform.", opts: ["have to", "has to", "must to", "should to"], a: 1, exp: "3e personne : has to." },

    { type: "qcm", q: "Que signifie « You don't have to come » ?", opts: ["C'est interdit de venir.", "Tu dois venir.", "Ce n'est pas obligatoire de venir.", "Tu devrais venir."], a: 2, exp: "don't have to = absence d'obligation." },
    { type: "input", q: "Complète : You ___ see a doctor. (conseil : tu devrais)", a: ["should"], ph: "modal du conseil", exp: "should see : conseil." },

    { type: "input", q: "Complète : You ___ eat so much sugar. (conseil négatif : tu ne devrais pas)", a: ["shouldn't", "should not"], ph: "conseil négatif", exp: "shouldn't = should not : conseil négatif." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["You should to rest.", "You should rest.", "You should resting.", "You should rests."], a: 1, exp: "Modal + base : you should rest." },

    { type: "input", q: "Complète : I ___ ___ work on Saturday. (obligation extérieure, 1re personne)", a: ["have to"], ph: "have to / has to", exp: "1re personne : have to work." },
    { type: "qcm", q: "Ton ami est fatigué. Quel conseil ?", opts: ["You must go to bed!", "You should go to bed.", "You mustn't go to bed.", "You don't have to sleep."], a: 1, exp: "Conseil doux : You should go to bed." },
    { type: "vf", q: "« should » sert à donner un conseil.", a: true, exp: "Vrai : you should = tu devrais (recommandation)." },
    { type: "input", q: "Complète : Students ___ use their phones during the exam. (interdiction : forme courte)", a: ["mustn't", "must not"], ph: "interdiction", exp: "mustn't = interdiction." },
    { type: "qcm", q: "« It's Sunday, so I ___ get up early. » (pas d'obligation)", opts: ["mustn't", "must", "don't have to", "should"], a: 2, exp: "Dimanche : pas obligatoire de se lever tôt, don't have to." }
  ],
  final: {
    title: "Exercice final — Les règles de l'école",
    intro: `<p>Un professeur explique les règles à un nouvel élève. Lis, puis réponds :</p>
<pre class="pseudo">"Welcome! Here are the rules. You must arrive before nine
o'clock. You have to wear the school uniform every day. You

      { type: "vf", q: "Students have to wear the uniform on Fridays. (Ils doivent porter l'uniforme le vendredi.)", a: false, exp: "Faux : « On Fridays you don't have to wear the uniform »." },
      { type: "qcm", q: "What does « you should do your homework » express? (Qu'exprime cette phrase ?)", opts: ["une interdiction", "un conseil", "une absence d'obligation", "un futur"], a: 1, exp: "should = conseil (« a piece of advice »)." },
      { type: "input", q: "Complète d'après le texte : You ___ ___ wear the uniform every day. (obligation extérieure)", a: ["have to"], ph: "have to / has to", exp: "« You have to wear the school uniform »." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">« Bienvenue ! Voici les regles. Tu dois arriver avant neuf
heures. Tu dois porter l'uniforme de l'ecole chaque jour.
Tu ne dois pas utiliser ton telephone en classe. Le
vendredi, tu n'es pas oblige de porter l'uniforme ; tu peux
mettre des vetements normaux. Et un conseil : tu devrais
faire tes devoirs chaque soir. »</pre>
<p>Distingue bien : must / have to = obligation ; mustn't = interdiction ; don't have to = pas d'obligation ; should = conseil. Ces nuances sont essentielles : confondre mustn't et don't have to change complètement le sens.</p>`
  }
