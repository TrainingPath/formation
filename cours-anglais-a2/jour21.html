<script>
var DAY = {
  num: 21,
  title: "Les loisirs et le sport",
  subtitle: "Parler de ses activités, de ses sports et de ce qu'on aime faire.",
  theory: `
<h3>1. Les loisirs (hobbies)</h3>
<p>Voici des activités courantes. Beaucoup s'expriment avec un verbe en <strong>-ing</strong> (la forme du gérondif).</p>
<pre class="pseudo">reading          la lecture
cooking          la cuisine
dancing          la danse
painting         la peinture
gardening        le jardinage
travelling       les voyages
playing music    jouer de la musique
watching films   regarder des films</pre>
<h3>2. Les trois verbes du sport : play, do, go</h3>
<p>En anglais, chaque sport va avec un verbe précis. C'est une règle très utile :</p>
<pre class="pseudo">play + sports de balle/ballon    play football, play tennis, play basketball
do + sports individuels/arts     do yoga, do judo, do gymnastics
go + activités en -ing           go swimming, go running, go skiing</pre>
<div class="tip">Astuce mémoire : <strong>PLAY</strong> pour ce qui se joue avec une balle ou un ballon, <strong>GO</strong> quand le sport se termine en -ing (go swimming, go cycling), <strong>DO</strong> pour le reste (do yoga, do athletics).</div>
<h3>3. Dire ce qu'on aime : like + -ing</h3>
<p>Après les verbes <strong>like, love, enjoy, hate</strong>, on met le verbe suivant en <strong>-ing</strong> :</p>
<pre class="pseudo">I like swimming.          J'aime nager.
I love playing football.  J'adore jouer au football.
I enjoy reading.          J'aime bien lire.
I hate running.           Je déteste courir.</pre>
<div class="warn">On dit <strong>I like swimming</strong> (avec -ing) et non <em>I like to swim</em> dans l'anglais courant pour parler d'un gout général. La forme en -ing est la plus naturelle après like et love.</div>
<h3>4. La fréquence : how often</h3>
<pre class="pseudo">How often do you play tennis?     Tu joues au tennis à quelle fréquence ?
I play tennis twice a week.       Je joue au tennis deux fois par semaine.
I go swimming every day.          Je vais nager tous les jours.
I never do yoga.                  Je ne fais jamais de yoga.</pre>
<h3>5. Proposer et accepter</h3>
<pre class="pseudo">Would you like to play tennis?    Voudrais-tu jouer au tennis ?
Do you want to go swimming?       Tu veux aller nager ?
Yes, I would love to.             Oui, avec plaisir.
Sorry, I can't.                   Désolé, je ne peux pas.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel verbe va avec « football » ?", opts: ["do", "go", "play", "make"], a: 2, exp: "play football : les sports de ballon prennent play." },
    { type: "input", q: "Complète : « I ___ swimming every weekend » (je vais nager).", a: ["go"], ph: "un verbe", exp: "go swimming : les sports en -ing prennent go." },
    { type: "qcm", q: "Quel verbe va avec « yoga » ?", opts: ["play", "go", "do", "have"], a: 2, exp: "do yoga : sports/arts individuels prennent do." },
    { type: "input", q: "Après « like », le verbe se met en -ing : « I like ___ » (nager).", a: ["swimming"], ph: "verbe en -ing", exp: "I like swimming (like + -ing)." },
    { type: "vf", q: "On dit « go swimming », « go running », « go skiing ».", a: true, exp: "go + activité en -ing." },
    { type: "qcm", q: "« I enjoy reading » veut dire :", opts: ["Je déteste lire", "J'aime bien lire", "Je vais lire", "Je sais lire"], a: 1, exp: "enjoy = apprécier ; reading = la lecture." },
    { type: "input", q: "Complète : « I ___ tennis twice a week » (je joue).", a: ["play"], ph: "un verbe", exp: "play tennis (sport de balle)." },
    { type: "qcm", q: "Comment demande-t-on la fréquence ?", opts: ["How much...?", "How often...?", "How many...?", "How long...?"], a: 1, exp: "How often ? = à quelle fréquence ?" },
    { type: "input", q: "Traduis « je déteste courir » : I hate ___", a: ["running"], ph: "verbe en -ing", exp: "hate + -ing : I hate running." },
    { type: "qcm", q: "Quel verbe va avec « judo » ?", opts: ["play", "do", "go", "take"], a: 1, exp: "do judo (art martial individuel)." },
    { type: "input", q: "Complète : « I go ___ in the mountains in winter » (skier).", a: ["skiing"], ph: "verbe en -ing", exp: "go skiing = faire du ski." },
    { type: "vf", q: "Après « love », on met le verbe suivant en -ing.", a: true, exp: "love + -ing : I love dancing." },
    { type: "qcm", q: "« Would you like to play tennis? » est :", opts: ["une invitation", "un ordre", "une négation", "une question sur le prix"], a: 0, exp: "Would you like to...? = proposition/invitation." },
    { type: "input", q: "Traduis « le jardinage » (loisir) : ___", a: ["gardening"], ph: "en anglais", exp: "gardening = le jardinage." },
    { type: "qcm", q: "Quelle réponse accepte une invitation ?", opts: ["Sorry, I can't.", "Yes, I would love to.", "No, thank you.", "I never do."], a: 1, exp: "Yes, I would love to = Oui, avec plaisir." }
  ],
  final: {
    title: "Exercice final — My free time",
    intro: `<p>Lis ce texte où Léa parle de ses loisirs, puis réponds aux questions.</p>
<pre class="pseudo">In my free time, I love doing sport. I play tennis twice a week with
my sister, and on Saturdays I go swimming at the pool. I do not like
running, but I enjoy cycling in the park. At home, I like reading and
cooking. I hate watching TV. This weekend, my friend asked me: Would
you like to go skiing? I said yes, I would love to!</pre>`,
    questions: [
      { type: "qcm", q: "How often does Léa play tennis?", opts: ["Every day", "Once a week", "Twice a week", "Never"], a: 2, exp: "I play tennis twice a week." },
      { type: "input", q: "What does she do on Saturdays? She goes ___", a: ["swimming"], ph: "verbe en -ing", exp: "on Saturdays I go swimming." },
      { type: "vf", q: "Léa does not like running.", a: true, exp: "I do not like running." },
      { type: "qcm", q: "Which activity does Léa hate?", opts: ["Reading", "Cooking", "Cycling", "Watching TV"], a: 3, exp: "I hate watching TV." },
      { type: "input", q: "What did her friend invite her to do? To go ___", a: ["skiing"], ph: "verbe en -ing", exp: "Would you like to go skiing ?" }
    ],
    solution: `<p>Léa joue au tennis deux fois par semaine, va nager le samedi, aime le vélo, la lecture et la cuisine, mais déteste la télé. Elle accepte une invitation à faire du ski.</p>
<pre class="pseudo">play tennis    -> sport de balle : PLAY
go swimming    -> activite en -ing : GO
I love / hate / enjoy + verbe en -ing</pre>
<p>Retiens les trois verbes du sport (play, do, go) et la règle <strong>like/love/hate + -ing</strong>. Ce sont les erreurs les plus fréquentes à ce niveau.</p>`
  }
};
</script>

    note: "Les trois verbes du sport (play, do, go) et la structure like + -ing sont testés à tous les examens A2. Entraine-toi à les employer sans hésiter." }
