<h3>1. Les parties du corps</h3>
<p>Un vocabulaire de base indispensable, notamment chez le médecin :</p>
<pre class="pseudo">head    tete       arm     bras       hand    main
face    visage     leg     jambe      foot    pied (pieds : feet)
eye     oeil       knee    genou      finger  doigt
ear     oreille    back    dos        tooth   dent (dents : teeth)
nose    nez        stomach ventre     throat  gorge
mouth   bouche     chest   poitrine   heart   coeur</pre>
<div class="warn">Deux pluriels irréguliers utiles : <em>foot -> feet</em> (pied -> pieds) et <em>tooth -> teeth</em> (dent -> dents).</div>
<h3>2. Dire qu'on a mal : « have a(n) ... ache »</h3>
<p>Pour certaines douleurs, l'anglais colle le mot <strong>ache</strong> (« douleur ») à une partie du corps :</p>
<pre class="pseudo">a headache      un mal de tete
a stomachache   un mal de ventre
a toothache     une rage de dents
a backache      un mal de dos
an earache      un mal d'oreille</pre>
<h3>3. Une autre structure : « My ... hurts »</h3>
<p>On peut aussi dire que telle partie « fait mal » avec le verbe <strong>to hurt</strong> ou l'expression <strong>to have a sore...</strong> :</p>
<pre class="pseudo">My leg hurts.          J'ai mal a la jambe.
I have a sore throat.  J'ai mal a la gorge.
I have a temperature.  J'ai de la fievre.
I have a cold.         J'ai un rhume.</pre>
<h3>4. Chez le médecin : questions et conseils</h3>
<pre class="pseudo">What's the matter?      Qu'est-ce qui ne va pas ?
What's wrong?           Qu'est-ce qui ne va pas ?
How do you feel?        Comment te sens-tu ?
I feel ill / sick.      Je me sens malade.
You should rest.        Tu devrais te reposer.
You should take         Tu devrais prendre
this medicine.          ce medicament.</pre>
<div class="tip">On réutilise ici <strong>should</strong> (Jour 13) pour donner des conseils de santé : <em>You should drink water and stay in bed.</em></div>`,

<pre class="pseudo">« Bonjour, Tom. Qu'est-ce qui ne va pas ? » demanda le

et mal a la gorge. J'ai aussi de la fievre. » Le medecin

travailler aujourd'hui. Vous devriez rester au lit, boire

<p>Ce dialogue réunit le vocabulaire du corps et de la santé (headache, sore throat, temperature, cold) avec les conseils en should vus au Jour 13, et une prédiction en will (You'll feel better). C'est ainsi qu'on combine les briques apprises pour tenir une vraie conversation.</p>`
