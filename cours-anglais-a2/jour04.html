  title: "Le futur : be going to",
  subtitle: "Parler de ses projets et de ses intentions.",
  theory: `
<h3>1. À quoi sert « be going to » ?</h3>
<p>La structure <strong>be going to</strong> sert à parler d'un <strong>projet</strong>, d'une <strong>intention</strong>, de quelque chose de <strong>décidé à l'avance</strong>. En français : « je vais... ». Exemple : <em>I am going to visit my grandmother.</em> (« Je vais rendre visite à ma grand-mère. »)</p>
<h3>2. La construction</h3>
<p>La formule est toujours la même : <strong>sujet + be (am/is/are) + going to + verbe à la base</strong>. Le verbe be s'accorde avec le sujet.</p>
<pre class="pseudo">Sujet    be     going to   verbe     Traduction
I        am     going to   travel    je vais voyager
He/She   is     going to   work      il/elle va travailler
You/We/  are    going to   play      tu vas / nous allons
They                                  jouer</pre>
<h3>3. Négation et questions</h3>
<pre class="pseudo">Négatif :   I am not going to work.   (je ne vais pas travailler)
            She isn't going to come.
Question :  Are you going to study?
            Is he going to help?
Réponse :   Yes, I am. / No, I'm not.</pre>
<h3>4. Une prédiction avec des indices visibles</h3>
<p>On utilise aussi <strong>be going to</strong> pour prédire un événement quand on voit <strong>des signes évidents</strong> maintenant :</p>
<pre class="pseudo">Look at the sky! It's going to rain.
Regarde le ciel ! Il va pleuvoir.</pre>
<div class="tip">Le contexte est le présent : les nuages sont là, donc la pluie est presque certaine. Les signes sont visibles au moment où l'on parle.</div>
<div class="warn">Ne confonds pas avec le présent continu de « go » : <em>I am going to the shop</em> (je vais AU magasin, déplacement) n'est pas <em>I am going to buy</em> (je VAIS acheter, intention). Le « to + verbe » indique l'intention future.</div>`,
  exercises: [
    { type: "input", q: "Complète : I ___ going to visit Paris. (be)", a: ["am", "'m"], ph: "am / is / are", exp: "Avec I : am. I am going to visit Paris." },

    { type: "input", q: "Complète : They ___ going to travel next week. (be)", a: ["are", "'re"], ph: "am / is / are", exp: "Avec they : are." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I going to play.", "I am going to play.", "I am going play.", "I am go to play."], a: 1, exp: "sujet + be + going to + base : I am going to play." },
    { type: "qcm", q: "Que signifie « be going to » ?", opts: ["Une action déjà finie", "Une intention ou un projet futur", "Une habitude quotidienne", "Une obligation"], a: 1, exp: "On parle d'un projet ou d'une intention." },
    { type: "input", q: "Complète : We ___ going to have dinner at 8. (be)", a: ["are", "'re"], ph: "am / is / are", exp: "Avec we : are." },
    { type: "vf", q: "Après « going to », le verbe est à la forme de base (sans -ing, sans -ed).", a: true, exp: "Vrai : going to play, going to travel." },
    { type: "qcm", q: "Forme négative correcte de « He is going to come » :", opts: ["He isn't going to come.", "He don't going to come.", "He is going to not come.", "He not going to come."], a: 0, exp: "isn't going to come : le not va sur be." },
    { type: "input", q: "Complète la question : ___ you going to help me? (be)", a: ["are", "'re"], ph: "am / is / are", exp: "Are you going to help me? Be en tête." },
    { type: "qcm", q: "« Look at the sky! It's going to rain. » exprime :", opts: ["une habitude", "une prédiction avec un signe visible", "une action passée", "une obligation"], a: 1, exp: "Les nuages sont un signe : prédiction." },
    { type: "input", q: "Complète : He ___ going to study tonight. (be)", a: ["is", "'s"], ph: "am / is / are", exp: "Avec he : is." },
    { type: "vf", q: "« Are you going to eat? » est une question correcte.", a: true, exp: "Vrai : be + sujet + going to + base." },

    { type: "input", q: "Complète : I ___ not going to watch TV. (be)", a: ["am", "'m"], ph: "am / is / are", exp: "I am not going to watch TV." },
    { type: "vf", q: "« I am going to the beach » et « I am going to swim » ont exactement le même sens.", a: false, exp: "Faux : le premier est un déplacement (aller à la plage), le second une intention (je vais nager)." }

    title: "Exercice final — Les projets de vacances",

      { type: "qcm", q: "Are they going to cook? (Vont-ils cuisiner ?)", opts: ["Yes, every day.", "No, they are going to eat in restaurants.", "Yes, at the hotel.", "No, they are going to travel."], a: 1, exp: "« They are not going to cook; they are going to eat in local restaurants »." },
      { type: "input", q: "Complète d'après le texte : They ___ going to eat in restaurants. (be)", a: ["are", "'re"], ph: "am / is / are", exp: "Avec they : are." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">L'ete prochain, Sophie va voyager en Grece. Elle va loger
dans un petit hotel pres de la mer. Chaque jour elle va
nager et lire des livres sur la plage. Son frere va lui
rendre visite pendant une semaine. Ils ne vont pas
cuisiner ; ils vont manger dans des restaurants locaux.</pre>
<p>Toutes les phrases suivent le schéma <strong>be + going to + base</strong>. Le verbe be (is, are) s'accorde avec le sujet, mais le verbe qui suit going to ne change jamais : swim, read, visit, cook, eat.</p>`
