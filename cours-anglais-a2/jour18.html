  theory: `
<h3>1. Le vocabulaire du restaurant</h3>
<p>Voici les mots essentiels quand tu manges dehors (to eat out).</p>
<pre class="pseudo">a table            une table
the menu           la carte
a starter          une entrée
a main course      un plat principal
a dessert          un dessert
a drink            une boisson
the bill           l'addition
a waiter           un serveur
a waitress         une serveuse</pre>
<div class="tip">Attention : en anglais, <strong>the menu</strong> = la carte (la liste des plats), pas le « menu à prix fixe ». Le menu à prix fixe se dit <strong>the set menu</strong>.</div>
<h3>2. Commander : « I would like » et « Can I have »</h3>
<p>Pour commander poliment, deux structures reviennent sans arrêt :</p>
<pre class="pseudo">I would like the soup, please.     Je voudrais la soupe.
Can I have a coffee, please?       Puis-je avoir un café ?
For me, the chicken.               Pour moi, le poulet.</pre>
<div class="warn">N'oublie jamais <strong>please</strong> à la fin d'une commande : sans lui, la phrase paraît impolie en anglais, même si la grammaire est correcte.</div>
<h3>3. Ce que dit le serveur</h3>
<pre class="pseudo">Are you ready to order?        Vous êtes prêts à commander ?
What would you like to drink?  Que voulez-vous boire ?
Anything else?                 Autre chose ?
Enjoy your meal!               Bon appétit !</pre>
<h3>4. Demander l'addition et payer</h3>
<pre class="pseudo">Could we have the bill, please?    Pourrions-nous avoir l'addition ?
Can I pay by card?                 Je peux payer par carte ?
Is service included?               Le service est-il compris ?</pre>
<h3>5. Aimer, préférer</h3>
<p>Pour donner ton avis sur un plat, utilise ces verbes. Souviens-toi qu'après <strong>like</strong> et <strong>love</strong>, on met souvent la forme en <strong>-ing</strong> ou un nom.</p>
<pre class="pseudo">I like fish.               J'aime le poisson.
I love chocolate.          J'adore le chocolat.
I do not like coffee.      Je n'aime pas le café.
I prefer tea.              Je préfère le thé.</pre>`,
