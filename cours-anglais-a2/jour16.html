  title: "Les vêtements et le shopping",
  subtitle: "Nommer les vêtements, demander un prix et faire ses achats en anglais.",
  theory: `
<h3>1. Le vocabulaire des vêtements</h3>
<p>Voici les vêtements les plus courants. En anglais, on met souvent <strong>a</strong> devant un vêtement au singulier, mais certains mots restent toujours au pluriel (les objets « à deux jambes »).</p>
<pre class="pseudo">a shirt        une chemise
a T-shirt      un tee-shirt
a jumper       un pull
a jacket       une veste
a coat         un manteau
a dress        une robe
a skirt        une jupe
shoes          des chaussures
trousers       un pantalon
jeans          un jean</pre>
<div class="warn">Trousers, jeans, shorts et glasses (lunettes) sont TOUJOURS au pluriel : on ne dit pas <em>a trouser</em>. Pour compter, on dit <strong>a pair of trousers</strong> (une paire = un pantalon).</div>
<h3>2. Les couleurs et les tailles</h3>
<p>On place la couleur AVANT le vêtement, comme tous les adjectifs anglais : <strong>a red dress</strong> (une robe rouge), <strong>black shoes</strong> (des chaussures noires). Les tailles utiles : <strong>small</strong> (petit), <strong>medium</strong> (moyen), <strong>large</strong> (grand).</p>
<h3>3. Faire du shopping : les phrases clés</h3>
<p>Dans un magasin, le vendeur (the shop assistant) et le client échangent des phrases très fixes. Apprends-les par coeur.</p>
<pre class="pseudo">Can I help you?              Je peux vous aider ?
I am looking for a jacket.   Je cherche une veste.
Can I try it on?             Je peux l'essayer ?
How much is it?              Combien ça coute ?
It is twenty euros.          Ça fait vingt euros.
I will take it.              Je le prends.</pre>
<div class="tip">Pour demander le prix d'un seul article : <strong>How much is it?</strong>. Pour plusieurs articles : <strong>How much are they?</strong>. Le mot <em>much</em> sert aux prix car l'argent est indénombrable.</div>
<h3>4. Essayer : trop grand, trop petit</h3>
<p>Après avoir essayé, on décrit avec <strong>too</strong> (trop) et <strong>enough</strong> (assez) :</p>
<pre class="pseudo">It is too big.        C'est trop grand.
It is too small.      C'est trop petit.
It is too expensive.  C'est trop cher.
It fits me well.      Ça me va bien.</pre>
<p>Attention à ne pas confondre <strong>too</strong> (trop, négatif) et <strong>very</strong> (très, neutre) : <em>very big</em> = très grand, <em>too big</em> = trop grand (donc ça ne va pas).</p>`,
  exercises: [
    { type: "input", q: "Traduis « une veste » : a ___", a: ["jacket"], ph: "en anglais", exp: "a jacket = une veste." },
    { type: "input", q: "Complète : « Combien ça coute ? » = How ___ is it?", a: ["much"], ph: "un mot", exp: "How much is it ? car l'argent est indénombrable." },
    { type: "qcm", q: "Comment dit-on « un pantalon » en anglais ?", opts: ["a trouser", "trousers", "a pants", "trouser"], a: 1, exp: "Trousers est toujours au pluriel." },
    { type: "input", q: "Traduis « une robe rouge » : a ___ dress", a: ["red"], ph: "couleur", exp: "La couleur se place avant le nom : a red dress." },
    { type: "qcm", q: "Le client veut essayer un vêtement. Il dit :", opts: ["Can I try it on?", "How much is it?", "I will take it.", "Can I help you?"], a: 0, exp: "Can I try it on ? = Je peux l'essayer ?" },
    { type: "vf", q: "En anglais, on dit « a red dress » et non « a dress red ».", a: true, exp: "L'adjectif de couleur se place TOUJOURS avant le nom." },
    { type: "input", q: "Complète la question du vendeur : « ___ I help you? »", a: ["can"], ph: "un mot", exp: "Can I help you ? = Je peux vous aider ?" },
    { type: "qcm", q: "« It is too expensive » veut dire :", opts: ["C'est très joli", "C'est trop cher", "C'est bon marché", "Ça me va bien"], a: 1, exp: "too = trop, expensive = cher." },
    { type: "input", q: "Traduis « des chaussures » (un seul mot au pluriel) : ___", a: ["shoes"], ph: "en anglais", exp: "shoes = des chaussures." },
    { type: "vf", q: "« How much are they? » sert à demander le prix de plusieurs articles.", a: true, exp: "are they (pluriel) pour plusieurs articles." },
    { type: "qcm", q: "Quelle phrase signifie « Je le prends » ?", opts: ["I am looking for it.", "Can I try it on?", "I will take it.", "It is too small."], a: 2, exp: "I will take it = Je le prends." },
    { type: "input", q: "Complète : « It is too ___ » pour dire « c'est trop petit ».", a: ["small"], ph: "adjectif", exp: "small = petit ; too small = trop petit." },
    { type: "qcm", q: "Quelle est la différence entre « very big » et « too big » ?", opts: ["Aucune", "very big = très grand (neutre), too big = trop grand (ça ne va pas)", "very est plus fort que too", "too big est positif"], a: 1, exp: "too exprime un excès négatif, very est neutre." },
    { type: "input", q: "Traduis « un manteau » : a ___", a: ["coat"], ph: "en anglais", exp: "a coat = un manteau." },
    { type: "qcm", q: "« Ça me va bien » se dit :", opts: ["It fits me well.", "It is too big.", "How much is it?", "I am looking for a coat."], a: 0, exp: "It fits me well = Ça me va bien." }
  ],
  final: {
    title: "Exercice final — In the clothes shop",
    intro: `<p>Lis ce petit dialogue dans un magasin de vêtements, puis réponds aux questions.</p>
<pre class="pseudo">Assistant: Can I help you?
Emma: Yes, I am looking for a coat.
Assistant: What size are you?
Emma: I am a medium. Can I try this blue coat on?
Assistant: Of course. ... How is it?
Emma: It is a bit too big. Do you have a small one?
Assistant: Here you are. It is forty euros.
Emma: It fits me well. I will take it.</pre>`,
    questions: [
      { type: "qcm", q: "What is Emma looking for?", opts: ["A dress", "A coat", "Shoes", "A jumper"], a: 1, exp: "She says: I am looking for a coat." },
      { type: "input", q: "What size is Emma? She is a ___", a: ["medium"], ph: "taille", exp: "I am a medium." },
      { type: "qcm", q: "What colour is the coat she tries on?", opts: ["Red", "Black", "Blue", "Green"], a: 2, exp: "Can I try this blue coat on ?" },
      { type: "vf", q: "The first coat is too big for Emma.", a: true, exp: "It is a bit too big." },
      { type: "input", q: "How much is the small coat? ___ euros", a: ["forty", "40"], ph: "nombre", exp: "It is forty euros." }
    ],
    solution: `<p>Emma cherche un manteau (a coat), elle fait du medium, elle essaie un manteau bleu qui est trop grand, puis elle prend le petit à 40 euros.</p>
<pre class="pseudo">I am looking for a coat.   -> annonce ce qu'elle cherche
Can I try this coat on?    -> demande d'essayer
It is too big.             -> le premier ne va pas
It fits me well.           -> le second est parfait
I will take it.            -> elle achète</pre>
<p>Retiens l'enchainement typique d'un achat : chercher, essayer, comparer les tailles, demander le prix, acheter.</p>`
  }
};
