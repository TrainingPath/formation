var DAY = {
  num: 7,
  title: "Le superlatif des adjectifs",
  subtitle: "Le plus grand, le meilleur, le plus intéressant de tous.",
  theory: `
<h3>1. Le superlatif : le sommet</h3>
<p>Le <strong>superlatif</strong> désigne l'élément qui a le maximum d'une qualité dans un groupe. En français : « le plus... » ou « le moins... ». Exemple : <em>Everest is the highest mountain in the world.</em> (« L'Everest est la plus haute montagne du monde. »)</p>
<div class="warn">Point clé : le superlatif est presque toujours précédé de <strong>the</strong> (« le / la / les »). On dit <em>the tallest</em>, <em>the best</em>.</div>
<h3>2. Adjectifs courts (1 syllabe) : the + -est</h3>
<pre class="pseudo">Adjectif   Superlatif        Exemple
tall       the tallest       Tom is the tallest in the class.
old        the oldest        This is the oldest house in town.
big        the biggest       (on double : biggest)
happy      the happiest      (y -> i : happiest)</pre>
<p>Mêmes règles d'orthographe qu'au comparatif : nice -> nicest, big -> biggest, easy -> easiest.</p>
<h3>3. Adjectifs longs (2 syllabes ou plus) : the most + adjectif</h3>
<pre class="pseudo">Adjectif       Superlatif             Exemple
expensive      the most expensive     the most expensive car
interesting    the most interesting   the most interesting book
beautiful      the most beautiful     the most beautiful city</pre>
<h3>4. Les irréguliers</h3>
<pre class="pseudo">good  -> the best     (bon -> le meilleur)
bad   -> the worst    (mauvais -> le pire)
far   -> the farthest (loin -> le plus loin)</pre>
<h3>5. Comparatif ou superlatif ?</h3>
<pre class="pseudo">Comparatif (2 elements)  ->  -er / more ... than
   Tom is taller THAN Ben.
Superlatif (le groupe)   ->  THE ...-est / THE most ...
   Tom is THE tallest in the class.</pre>
<div class="tip">Après un superlatif, on précise souvent le groupe avec <strong>in</strong> (un lieu, un groupe) : <em>the best student <strong>in</strong> the school</em>, ou <strong>of</strong> (une liste) : <em>the best <strong>of</strong> all</em>.</div>`,
  exercises: [
    { type: "input", q: "Complète : Everest is the ___ (high) mountain in the world.", a: ["highest"], ph: "superlatif", exp: "Adjectif court : high -> the highest." },
    { type: "input", q: "Complète : Tom is the ___ (tall) in the class.", a: ["tallest"], ph: "superlatif", exp: "tall -> the tallest." },
    { type: "qcm", q: "Quel est le superlatif de « big » ?", opts: ["the bigest", "the biggest", "the most big", "the bigger"], a: 1, exp: "On double la consonne : the biggest." },
    { type: "input", q: "Complète : She is the ___ (happy) person I know.", a: ["happiest"], ph: "superlatif", exp: "happy -> the happiest." },
    { type: "qcm", q: "Quel est le superlatif de « expensive » ?", opts: ["the expensivest", "the more expensive", "the most expensive", "the expensiver"], a: 2, exp: "Adjectif long : the most expensive." },
    { type: "vf", q: "Le superlatif est presque toujours précédé de « the ».", a: true, exp: "Vrai : the tallest, the best, the most beautiful." },
    { type: "input", q: "Complète : This is the ___ (good) film of the year. (irrégulier)", a: ["best"], ph: "superlatif irrégulier", exp: "good -> the best." },
    { type: "qcm", q: "Complète : It was the ___ day of my life.", opts: ["worse", "worst", "baddest", "most bad"], a: 1, exp: "bad -> the worst (irrégulier)." },
    { type: "input", q: "Complète : This is the ___ (interesting) book in the library. (adjectif long)", a: ["most interesting"], ph: "the most + adjectif", exp: "interesting est long : the most interesting." },
    { type: "qcm", q: "Comparatif ou superlatif ? « Anna is ___ girl in the team. »", opts: ["taller than (comparatif)", "the tallest (superlatif)", "tall", "more tall"], a: 1, exp: "On désigne la plus grande DU groupe : superlatif the tallest." },
    { type: "input", q: "Complète : July is the ___ (hot) month here.", a: ["hottest"], ph: "superlatif", exp: "hot -> the hottest (on double le t)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["He is the most tall.", "He is the tallest.", "He is tallest.", "He is more tallest."], a: 1, exp: "tall court : the tallest, avec the." },
    { type: "input", q: "Complète : This is the ___ (easy) exercise of all.", a: ["easiest"], ph: "superlatif", exp: "easy -> the easiest." },
    { type: "vf", q: "« the beautifulest » est correct.", a: false, exp: "Faux : beautiful est long, il faut « the most beautiful »." },
    { type: "qcm", q: "Traduis : « C'est le pire jour. »", opts: ["It is the baddest day.", "It is the worst day.", "It is the worse day.", "It is the most bad day."], a: 1, exp: "bad -> the worst." }
  ],
  final: {
    title: "Exercice final — Records du monde",
    intro: `<p>Un livre de records. Lis, puis réponds :</p>
<pre class="pseudo">The Nile is the longest river in the world. The blue whale
is the biggest animal on Earth, and the cheetah is the
fastest land animal. Antarctica is the coldest place on the
planet. Many people say Mount Everest is the most beautiful
mountain, but it is also the most dangerous to climb.</pre>`,
    questions: [
      { type: "qcm", q: "What is the longest river? (Quel est le plus long fleuve ?)", opts: ["The Amazon", "The Nile", "The Thames", "The Seine"], a: 1, exp: "« The Nile is the longest river »." },
      { type: "input", q: "Complète d'après le texte : The blue whale is the ___ (big) animal.", a: ["biggest"], ph: "superlatif", exp: "big -> the biggest." },
      { type: "vf", q: "The cheetah is the slowest land animal. (Le guépard est l'animal terrestre le plus lent.)", a: false, exp: "Faux : « the fastest land animal » = le plus rapide." },
      { type: "qcm", q: "Which is the coldest place? (Quel est l'endroit le plus froid ?)", opts: ["The North Pole", "Siberia", "Antarctica", "Iceland"], a: 2, exp: "« Antarctica is the coldest place »." },
      { type: "input", q: "Complète d'après le texte : Everest is the most ___ mountain to climb. (dangerous)", a: ["dangerous"], ph: "adjectif", exp: "« the most dangerous to climb »." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Le Nil est le plus long fleuve du monde. La baleine bleue
est le plus grand animal de la Terre, et le guepard est
l'animal terrestre le plus rapide. L'Antarctique est
l'endroit le plus froid de la planete. Beaucoup de gens
disent que l'Everest est la plus belle montagne, mais c'est
aussi la plus dangereuse a escalader.</pre>
<p>Adjectifs courts : the longest, the biggest, the fastest, the coldest. Adjectifs longs : the most beautiful, the most dangerous. Le mot the est toujours présent, et le groupe est précisé par in the world, on Earth, on the planet.</p>`
  }
};
