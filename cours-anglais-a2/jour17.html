<script>
var DAY = {
  num: 17,
  title: "Voyager : aéroport et hôtel",
  subtitle: "Le vocabulaire et les phrases pour prendre l'avion et s'installer à l'hôtel.",
  theory: `
<h3>1. À l'aéroport</h3>
<p>Voici les mots que tu verras et entendras dans un aéroport (an airport). Beaucoup ressemblent au français.</p>
<pre class="pseudo">a flight            un vol
a ticket            un billet
a boarding pass     une carte d'embarquement
the gate            la porte (d'embarquement)
luggage / baggage   les bagages
a suitcase          une valise
to check in         enregistrer (ses bagages)
a passport          un passeport</pre>
<div class="tip">Le mot <strong>luggage</strong> est indénombrable : on ne dit jamais <em>luggages</em>. Pour compter, on dit <strong>two pieces of luggage</strong> (deux bagages).</div>
<h3>2. Les phrases utiles à l'aéroport</h3>
<pre class="pseudo">What time is the flight?     À quelle heure est le vol ?
Where is the gate?           Où est la porte ?
Can I see your passport?     Je peux voir votre passeport ?
The flight is delayed.       Le vol est retardé.
Have a good flight!          Bon vol !</pre>
<h3>3. À l'hôtel</h3>
<p>À la réception (the reception), on réserve et on prend possession d'une chambre. Les mots clés :</p>
<pre class="pseudo">a room               une chambre
a single room        une chambre simple
a double room        une chambre double
to book / to reserve  réserver
a key                 une clé
the key card          la carte magnétique
breakfast             le petit-déjeuner
a night               une nuit</pre>
<h3>4. Réserver et demander à l'hôtel</h3>
<pre class="pseudo">I have a reservation.            J'ai une réservation.
I would like a double room.      Je voudrais une chambre double.
For how many nights?             Pour combien de nuits ?
For three nights, please.        Pour trois nuits, s'il vous plait.
Is breakfast included?           Le petit-déjeuner est compris ?</pre>
<div class="warn">Pour être poli, on utilise <strong>I would like</strong> (je voudrais) et non <strong>I want</strong> (je veux), qui sonne trop direct en anglais. C'est une marque de politesse essentielle en voyage.</div>
<h3>5. Demander poliment</h3>
<p>Pour demander un service, commence par <strong>Could I...?</strong> ou <strong>Could you...?</strong> (pourriez-vous ?), plus polis que <em>can</em>.</p>
<pre class="pseudo">Could I have the key, please?      Pourrais-je avoir la clé ?
Could you call a taxi?             Pourriez-vous appeler un taxi ?</pre>`,
  exercises: [
    { type: "input", q: "Traduis « un vol » : a ___", a: ["flight"], ph: "en anglais", exp: "a flight = un vol." },
    { type: "qcm", q: "Comment dit-on « la carte d'embarquement » ?", opts: ["a ticket", "a boarding pass", "a passport", "the gate"], a: 1, exp: "a boarding pass = la carte d'embarquement." },
    { type: "vf", q: "Le mot « luggage » ne prend jamais de -s au pluriel.", a: true, exp: "luggage est indénombrable : on dit pieces of luggage." },
    { type: "input", q: "Pour être poli, on dit « I ___ like a double room » (je voudrais).", a: ["would"], ph: "un mot", exp: "I would like = je voudrais, plus poli que I want." },
    { type: "qcm", q: "« The flight is delayed » signifie :", opts: ["Le vol est annulé", "Le vol est à l'heure", "Le vol est retardé", "Le vol est complet"], a: 2, exp: "delayed = retardé." },
    { type: "input", q: "Complète : « Is breakfast ___ ? » pour demander si le petit-déjeuner est compris.", a: ["included"], ph: "un mot", exp: "Is breakfast included ? = Le petit-déjeuner est-il compris ?" },
    { type: "qcm", q: "À la réception, tu veux réserver. Tu dis :", opts: ["I would like a room.", "Where is the gate?", "Have a good flight!", "The flight is delayed."], a: 0, exp: "I would like a room = Je voudrais une chambre." },
    { type: "input", q: "Traduis « une clé » : a ___", a: ["key"], ph: "en anglais", exp: "a key = une clé." },
    { type: "vf", q: "« Could you call a taxi? » est plus poli que « Can you call a taxi? ».", a: true, exp: "could est la forme la plus polie pour demander un service." },
    { type: "qcm", q: "Que veut dire « For how many nights? »", opts: ["À quelle heure ?", "Pour combien de nuits ?", "Combien ça coute ?", "Où est la chambre ?"], a: 1, exp: "nights = nuits ; on demande la durée du séjour." },
    { type: "input", q: "Traduis « une valise » : a ___", a: ["suitcase"], ph: "en anglais", exp: "a suitcase = une valise." },
    { type: "qcm", q: "Quel verbe signifie « enregistrer ses bagages » ?", opts: ["to book", "to check in", "to reserve", "to fly"], a: 1, exp: "to check in = enregistrer." },
    { type: "input", q: "Complète : « Where is the ___ ? » pour demander où est la porte d'embarquement.", a: ["gate"], ph: "un mot", exp: "the gate = la porte d'embarquement." },
    { type: "vf", q: "« I would like » est plus poli que « I want » en anglais.", a: true, exp: "I want sonne trop direct ; on préfère I would like." },
    { type: "qcm", q: "Une chambre pour une seule personne se dit :", opts: ["a double room", "a single room", "a big room", "a night room"], a: 1, exp: "a single room = chambre simple ; a double room = chambre double." }
  ],
  final: {
    title: "Exercice final — Checking in at the hotel",
    intro: `<p>Lis ce dialogue à la réception d'un hôtel, puis réponds aux questions.</p>
<pre class="pseudo">Receptionist: Good evening. Can I help you?
Tom: Yes, I have a reservation. My name is Tom Smith.
Receptionist: A double room for two nights. Is that right?
Tom: Yes. Is breakfast included?
Receptionist: Yes, breakfast is from seven to ten. Here is your key card, room 210.
Tom: Thank you. Could you call a taxi for tomorrow morning?
Receptionist: Of course. Have a nice stay!</pre>`,
    questions: [
      { type: "qcm", q: "What kind of room did Tom book?", opts: ["A single room", "A double room", "Two rooms", "A large room"], a: 1, exp: "A double room for two nights." },
      { type: "input", q: "For how many nights is the reservation? For ___ nights", a: ["two", "2"], ph: "nombre", exp: "A double room for two nights." },
      { type: "vf", q: "Breakfast is included at the hotel.", a: true, exp: "Yes, breakfast is from seven to ten." },
      { type: "input", q: "What is Tom's room number? Room ___", a: ["210"], ph: "nombre", exp: "Here is your key card, room 210." },
      { type: "qcm", q: "What does Tom ask for at the end?", opts: ["Breakfast", "The key", "A taxi", "The bill"], a: 2, exp: "Could you call a taxi for tomorrow morning ?" }
    ],
    solution: `<p>Tom a réservé une chambre double pour deux nuits. Le petit-déjeuner est compris, sa chambre est la 210, et il demande poliment un taxi pour le lendemain matin.</p>
<pre class="pseudo">I have a reservation.        -> il s'annonce
Is breakfast included?       -> il vérifie le petit-déjeuner
Could you call a taxi?       -> demande polie avec Could you</pre>
<p>Retiens l'usage de <strong>Could you</strong> pour demander un service : c'est la clé de la politesse en voyage.</p>`
  }
};
</script>

<script>

  { id: "en-a2-j17", title: "At the hotel reception", level: 2,

    hints: [
      "Commence par : I have a reservation. My name is...",
      "Utilise : a double room, for two nights, Is breakfast included?",

    ],
    solution: "Receptionist: Good evening. Can I help you?\nMe: Yes, I have a reservation. My name is Julie Martin.\nReceptionist: A single room for three nights?\nMe: That is right. Is breakfast included?\nReceptionist: Yes, from seven to ten. Here is your key.\nMe: Thank you. Could you call a taxi for eight o'clock?\nReceptionist: Of course. Have a nice stay!\n\nTraduction:\nRéceptionniste : Bonsoir. Je peux vous aider ?\nMoi : Oui, j'ai une réservation. Je m'appelle Julie Martin.\nRéceptionniste : Une chambre simple pour trois nuits ?\nMoi : C'est exact. Le petit-déjeuner est compris ?\nRéceptionniste : Oui, de sept à dix heures. Voici votre clé.\nMoi : Merci. Pourriez-vous appeler un taxi pour huit heures ?\nRéceptionniste : Bien sur. Bon séjour !",

  ]
};
</script>
