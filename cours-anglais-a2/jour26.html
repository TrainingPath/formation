<script>
var DAY = {
  num: 26,
  title: "Les adverbes de manière",
  subtitle: "Dire COMMENT une action se fait : quickly, slowly, well...",
  theory: `
<h3>1. Adjectif ou adverbe ?</h3>
<p>Un <strong>adjectif</strong> décrit un nom (a slow car = une voiture lente). Un <strong>adverbe de manière</strong> décrit un verbe : il dit COMMENT l'action se fait (he drives slowly = il conduit lentement). Ils répondent à la question « how? » (comment ?).</p>
<pre class="pseudo">She is a careful driver.   Elle est une conductrice prudente.  (adjectif -> nom)
She drives carefully.      Elle conduit prudemment.            (adverbe -> verbe)</pre>
<h3>2. La règle générale : adjectif + ly</h3>
<p>La plupart des adverbes se forment en ajoutant <strong>-ly</strong> à l'adjectif, comme le « -ment » français.</p>
<pre class="pseudo">quick   -> quickly     rapide -> rapidement
slow    -> slowly      lent -> lentement
quiet   -> quietly     silencieux -> silencieusement
careful -> carefully   prudent -> prudemment
bad     -> badly       mauvais -> mal</pre>
<h3>3. Les petits changements d'orthographe</h3>
<pre class="pseudo">Adjectif en -y  ->  -ily   : happy -> happily, easy -> easily
Adjectif en -le ->  -ly    : simple -> simply, gentle -> gently</pre>
<div class="tip">Pour les adjectifs finissant par -y, on transforme le y en i avant d'ajouter -ly : happy -> happily (heureusement).</div>
<h3>4. Les adverbes irréguliers (à connaitre par coeur)</h3>
<pre class="pseudo">good  ->  well      bon -> bien   (PAS goodly !)
fast  ->  fast      rapide -> vite (identique)
hard  ->  hard      dur -> dur (identique)
early ->  early     tot -> tot (identique)</pre>
<div class="warn">L'adverbe de <strong>good</strong> est <strong>well</strong>, jamais « goodly ». On dit <em>She sings well</em> (elle chante bien) et non <em>she sings good</em>. C'est une erreur très fréquente.</div>
<h3>5. La place de l'adverbe</h3>
<p>L'adverbe de manière se place le plus souvent APRÈS le verbe, ou après le complément.</p>
<pre class="pseudo">He speaks slowly.              Il parle lentement.
She opened the door quietly.   Elle a ouvert la porte doucement.
They played well.              Ils ont bien joué.</pre>
<p>Ne pas confondre avec very (très) et too (trop), qui modifient un adjectif ou un adverbe, pas un verbe : <em>He runs very quickly</em> (il court très vite).</p>`,
  exercises: [
    { type: "input", q: "Forme l'adverbe de « quick » : ___", a: ["quickly"], ph: "adverbe", exp: "quick + ly = quickly." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["She sings good.", "She sings well.", "She sings goodly.", "She sings wellly."], a: 1, exp: "L'adverbe de good est well." },
    { type: "input", q: "Forme l'adverbe de « slow » : ___", a: ["slowly"], ph: "adverbe", exp: "slow + ly = slowly." },
    { type: "qcm", q: "Un adverbe de manière répond à quelle question ?", opts: ["Where? (où)", "When? (quand)", "How? (comment)", "Why? (pourquoi)"], a: 2, exp: "Il dit COMMENT l'action se fait." },
    { type: "input", q: "Forme l'adverbe de « happy » (attention au y) : ___", a: ["happily"], ph: "adverbe", exp: "happy -> happily (y devient i)." },
    { type: "vf", q: "L'adverbe de « fast » est « fast » (identique à l'adjectif).", a: true, exp: "fast est invariable : he runs fast." },
    { type: "input", q: "Complète : « He drives ___ » (careful -> adverbe).", a: ["carefully"], ph: "adverbe", exp: "careful -> carefully." },
    { type: "qcm", q: "Dans « She is a careful driver », « careful » est :", opts: ["un adverbe", "un adjectif", "un verbe", "un nom"], a: 1, exp: "careful décrit le nom driver : adjectif." },
    { type: "input", q: "Forme l'adverbe de « bad » : ___", a: ["badly"], ph: "adverbe", exp: "bad + ly = badly (mal)." },
    { type: "qcm", q: "Où se place généralement l'adverbe de manière ?", opts: ["avant le verbe", "après le verbe ou le complément", "avant le sujet", "à la fin obligatoirement"], a: 1, exp: "He speaks slowly ; she opened the door quietly." },
    { type: "input", q: "Complète : « They played ___ and won » (good -> adverbe).", a: ["well"], ph: "adverbe", exp: "L'adverbe de good est well." },
    { type: "qcm", q: "Quel est l'adverbe de « easy » ?", opts: ["easyly", "easily", "easely", "easy"], a: 1, exp: "easy -> easily (y devient i)." },
    { type: "input", q: "Forme l'adverbe de « quiet » : ___", a: ["quietly"], ph: "adverbe", exp: "quiet + ly = quietly." },
    { type: "vf", q: "Dans « He runs very quickly », « very » modifie l'adverbe « quickly », pas le verbe.", a: true, exp: "very intensifie l'adverbe quickly." },
    { type: "qcm", q: "Quelle phrase utilise correctement un adverbe ?", opts: ["He speaks slow.", "He speaks slowly.", "He speaks a slow.", "He slow speaks."], a: 1, exp: "Le verbe speak est modifié par l'adverbe slowly." }
  ],
  final: {
    title: "Exercice final — Adjective or adverb?",
    intro: `<p>Lis ce court texte où on décrit une matinée, puis réponds aux questions sur les adverbes.</p>
<pre class="pseudo">This morning I woke up early and got ready quickly. I am a careful
person, so I checked my bag carefully before leaving. On the bus, a
man was talking loudly on his phone, but I read my book quietly. At
work, my colleague explained the new project clearly, and I understood
it easily. In the meeting, I spoke slowly because my English is not
perfect. My boss said I did well!</pre>`,
    questions: [
      { type: "input", q: "Complète d'après le texte : « I got ready ___ » (quick -> adverbe).", a: ["quickly"], ph: "adverbe", exp: "quick -> quickly." },
      { type: "qcm", q: "How did the man talk on his phone?", opts: ["quietly", "loudly", "slowly", "carefully"], a: 1, exp: "a man was talking loudly." },
      { type: "input", q: "« I understood it ___ » : forme l'adverbe de « easy ».", a: ["easily"], ph: "adverbe", exp: "easy -> easily." },
      { type: "vf", q: "In « I am a careful person », « careful » is an adjective (it describes a noun).", a: true, exp: "careful décrit person : adjectif." },
      { type: "input", q: "Complète : « My boss said I did ___ » (good -> adverbe irrégulier).", a: ["well"], ph: "adverbe", exp: "good -> well." }
    ],
    solution: `<p>Le texte alterne adjectifs (a careful person) et adverbes (checked carefully, spoke slowly, did well).</p>
<pre class="pseudo">quickly, carefully, quietly, clearly, easily, slowly  -> adjectif + ly
well  -> adverbe irrégulier de good
careful (a careful person) -> adjectif car il décrit un nom</pre>
<p>Retiens la différence : l'adjectif décrit un NOM, l'adverbe décrit un VERBE et se termine souvent en -ly. Et n'oublie pas l'irrégulier good -> well.</p>`
  }
};
</script>

    note: "Rappelle-toi : adjectif décrit un nom, adverbe décrit un verbe. La grande majorité se forme avec -ly, mais well, fast et hard sont irréguliers." }
