<script>
var DAY = {
  num: 30,
  title: "Bilan A2 : conversation et mini-entretien",
  subtitle: "Se présenter, répondre à des questions et tenir une conversation simple.",
  theory: `
<h3>1. Le grand oral du niveau A2</h3>
<p>Pour terminer, le vrai test du niveau : réussir une <strong>conversation</strong> simple. À l'examen oral A2, un examinateur te pose des questions personnelles, puis vous discutez d'un sujet du quotidien. Rien de piège : il faut répondre par des phrases complètes, pas juste « yes » ou « no ».</p>
<div class="tip">La règle d'or de l'oral : ne réponds jamais par un seul mot. À « Do you like sport? », ne dis pas « Yes » mais « Yes, I love sport, especially football. » Ajoute toujours un détail.</div>
<h3>2. Les questions classiques d'un entretien</h3>
<pre class="pseudo">What is your name?              Comment vous appelez-vous ?
Where are you from?             D'où venez-vous ?
What do you do?                 Que faites-vous (dans la vie) ?
Tell me about your family.      Parlez-moi de votre famille.
What are your hobbies?          Quels sont vos loisirs ?
What did you do last weekend?   Qu'avez-vous fait le week-end dernier ?
What are your plans?            Quels sont vos projets ?</pre>
<h3>3. Un mini-entretien modèle</h3>
<p>Lis ce dialogue simple entre un examinateur (E) et un candidat (C). Observe comment le candidat développe chaque réponse.</p>
<pre class="pseudo">E: Good morning. What is your name?
C: Good morning. My name is Paul Dubois.
E: Where are you from, Paul?
C: I am from Nantes, a city in the west of France.
E: What do you do?
C: I am a student. I study computer science at university.
E: Tell me about your hobbies.
C: I love playing football and I often go swimming. In the evening,
   I like reading and watching films.
E: What did you do last weekend?
C: On Saturday I visited my grandparents. On Sunday I played tennis
   with my brother. It was a nice weekend.
E: What are your plans for the future?
C: If I pass my exams, I will look for a job in a big company. I
   would also like to travel to England to improve my English.
E: Thank you, Paul. That is very good.</pre>
<h3>4. Les phrases pour gagner du temps</h3>
<p>Quand tu réfléchis, ne reste pas silencieux : utilise ces expressions naturelles.</p>
<pre class="pseudo">Well, ...                Eh bien, ...
Let me think.            Laissez-moi réfléchir.
That is a good question. C'est une bonne question.
Could you repeat, please? Pourriez-vous répéter ?
Sorry, I do not understand. Désolé, je ne comprends pas.</pre>
<div class="warn">Si tu ne comprends pas une question, ne panique pas et n'invente pas : demande poliment <strong>Could you repeat, please?</strong>. C'est bien mieux que de rester bloqué ou de répondre à coté.</div>
<h3>5. La check-list du candidat A2</h3>
<pre class="pseudo">Je réponds par des phrases complètes.
J'ajoute toujours un détail ou un exemple.
J'utilise des connecteurs (and, but, because, so).
Je varie les temps (présent, passé, futur).
Je reste poli (please, thank you, could you).</pre>`,
  exercises: [
    { type: "input", q: "Réponds à « What is your name? » : « My name ___ Paul » (verbe be).", a: ["is"], ph: "verbe", exp: "My name is Paul." },
    { type: "qcm", q: "« Where are you from? » demande :", opts: ["ton nom", "ton origine / d'où tu viens", "ton age", "tes loisirs"], a: 1, exp: "Where are you from ? = D'où venez-vous ?" },
    { type: "vf", q: "À l'oral, il vaut mieux répondre par une phrase complète que par un seul « yes ».", a: true, exp: "On ajoute toujours un détail." },
    { type: "input", q: "Complète : « I ___ from France » (venir de, verbe be).", a: ["am"], ph: "verbe", exp: "I am from France." },
    { type: "qcm", q: "Que demande « What do you do? »", opts: ["Où tu habites", "Ce que tu fais dans la vie (travail/études)", "Ton age", "Le temps qu'il fait"], a: 1, exp: "What do you do ? = métier ou études." },
    { type: "input", q: "Si tu n'as pas compris, tu dis : « Could you ___ , please? » (répéter).", a: ["repeat"], ph: "un verbe", exp: "Could you repeat, please ?" },
    { type: "qcm", q: "« What did you do last weekend? » attend une réponse :", opts: ["au présent", "au passé", "au futur", "à l'impératif"], a: 1, exp: "did = passé : On Saturday I visited..." },
    { type: "input", q: "Complète une réponse au passé : « On Sunday I ___ tennis » (play, passé).", a: ["played"], ph: "passé", exp: "played (passé régulier)." },
    { type: "vf", q: "« What are your plans? » demande de parler de tes projets (futur).", a: true, exp: "plans = projets, réponse au futur : I will / I am going to." },
    { type: "qcm", q: "Quelle expression permet de gagner du temps pour réfléchir ?", opts: ["Goodbye!", "Well, let me think.", "How much is it?", "Turn left."], a: 1, exp: "Well, let me think = pour réfléchir poliment." },
    { type: "input", q: "Complète une réponse développée : « Yes, I love sport, ___ football » (surtout).", a: ["especially"], ph: "un mot", exp: "especially football = surtout le football." },
    { type: "qcm", q: "Pour parler de tes projets, quel début est correct ?", opts: ["I visited...", "I am going to travel...", "I was playing...", "I have been..."], a: 1, exp: "I am going to travel = intention future." },
    { type: "input", q: "Complète : « I study computer ___ at university » (informatique).", a: ["science"], ph: "un mot", exp: "computer science = informatique." },
    { type: "vf", q: "Utiliser des connecteurs (and, but, because, so) rend ta réponse plus riche à l'oral.", a: true, exp: "Ils relient les idées et montrent ton niveau." },
    { type: "qcm", q: "Quelle est la meilleure réponse à « Do you like music? »", opts: ["Yes.", "No.", "Yes, I love music, especially rock. I play the guitar.", "Music."], a: 2, exp: "On développe : gout + détail + exemple." }
  ],
  final: {
    title: "Exercice final — The interview",
    intro: `<p>Lis ce mini-entretien entre un examinateur (E) et une candidate, Marie (M), puis réponds aux questions.</p>
<pre class="pseudo">E: Hello! Please, tell me your name.
M: Hello. My name is Marie Leroy.
E: Where do you live, Marie?
M: I live in Bordeaux, in the south-west of France.
E: What do you do?
M: I am a nurse. I work in a hospital, and I really like my job.
E: What are your hobbies?
M: I enjoy cooking and I go running twice a week. I also love reading.
E: What are your plans for next year?
M: Next year, I am going to visit Canada. If I save enough money, I
   will stay there for one month.
E: Thank you, Marie!</pre>`,
    questions: [
      { type: "qcm", q: "Where does Marie live?", opts: ["Nantes", "Bordeaux", "Paris", "Canada"], a: 1, exp: "I live in Bordeaux." },
      { type: "input", q: "What is Marie's job? She is a ___", a: ["nurse"], ph: "métier", exp: "I am a nurse." },
      { type: "qcm", q: "How often does Marie go running?", opts: ["Every day", "Once a week", "Twice a week", "Never"], a: 2, exp: "I go running twice a week." },
      { type: "vf", q: "Marie is going to visit Canada next year.", a: true, exp: "Next year, I am going to visit Canada." },
      { type: "input", q: "Complète sa réponse : « If I save enough money, I ___ stay there for one month » (futur).", a: ["will"], ph: "auxiliaire", exp: "conditionnel 1 : I will stay." }
    ],
    solution: `<p>Marie répond à chaque question par une phrase complète et ajoute un détail : son métier + son ressenti (I am a nurse, I really like my job), ses loisirs avec fréquence (running twice a week), et ses projets au futur (I am going to visit Canada / If I save money, I will stay).</p>
<pre class="pseudo">I am a nurse. I work in a hospital.   -> métier + détail
I go running twice a week.            -> loisir + fréquence
I am going to visit Canada.           -> projet (futur intention)
If I save money, I will stay...       -> conditionnel type 1</pre>
<p>C'est exactement ce qu'on attend au niveau A2 : des réponses complètes, des temps variés, des détails. Félicitations, tu as terminé le niveau élémentaire ! Continue à parler, écouter et lire un peu chaque jour : c'est la clé des progrès.</p>`
  }
};
</script>
