  title: "Some, any, a lot of",
  subtitle: "Parler de quantités qu'on ne compte pas exactement.",
  theory: `
<h3>1. Des quantités imprécises</h3>
<p>Quand on ne donne pas un nombre exact, on utilise des mots comme <strong>some</strong>, <strong>any</strong> ou <strong>a lot of</strong>. Ils fonctionnent avec les noms au pluriel (<em>apples</em>) comme avec les noms non comptables (<em>water, money</em>).</p>
<h3>2. SOME : dans les phrases affirmatives</h3>
<p><strong>some</strong> = « du / de la / des », « un peu de », « quelques ». On l'utilise surtout dans les phrases <strong>affirmatives</strong> :</p>
<pre class="pseudo">I have some money.        J'ai de l'argent.
There are some apples.    Il y a des pommes.
She bought some bread.    Elle a achete du pain.</pre>
<h3>3. ANY : dans les négations et les questions</h3>
<p><strong>any</strong> s'emploie surtout dans les phrases <strong>négatives</strong> et les <strong>questions</strong> :</p>
<pre class="pseudo">Negatif :   I don't have any money.       Je n'ai pas d'argent.
            There aren't any apples.      Il n'y a pas de pommes.
Question :  Do you have any money?        As-tu de l'argent ?
            Are there any apples?         Y a-t-il des pommes ?</pre>
<div class="tip">Exception utile : dans une <strong>offre</strong> ou une <strong>demande polie</strong>, on utilise <strong>some</strong> même en question : <em>Would you like some tea?</em> (Voulez-vous du thé ?), <em>Can I have some water?</em></div>
<h3>4. A LOT OF : beaucoup</h3>
<p><strong>a lot of</strong> (ou <em>lots of</em>) = « beaucoup de ». Il marche dans les phrases affirmatives, avec le pluriel comme avec le non comptable :</p>
<pre class="pseudo">I have a lot of friends.       J'ai beaucoup d'amis.
She drinks a lot of water.     Elle boit beaucoup d'eau.</pre>
<div class="warn">Résumé rapide : phrase affirmative -> <strong>some</strong> ou <strong>a lot of</strong> ; phrase négative ou question -> <strong>any</strong> (sauf offre/demande polie -> some).</div>`,
  exercises: [
    { type: "qcm", q: "Complète : I have ___ money in my pocket. (affirmatif)", opts: ["any", "some", "a", "much"], a: 1, exp: "Affirmatif : some." },

    { type: "input", q: "Complète : Do you have ___ questions? (question)", a: ["any"], ph: "some / any", exp: "Question : any." },
    { type: "input", q: "Complète : There are ___ apples on the table. (affirmatif)", a: ["some"], ph: "some / any", exp: "Affirmatif : some apples." },
    { type: "qcm", q: "Complète : She has ___ friends. (beaucoup)", opts: ["some", "any", "a lot of", "a"], a: 2, exp: "beaucoup de = a lot of." },
    { type: "vf", q: "On utilise « any » surtout dans les négations et les questions.", a: true, exp: "Vrai : I don't have any / Do you have any?" },
    { type: "input", q: "Complète : There aren't ___ eggs in the fridge. (négatif)", a: ["any"], ph: "some / any", exp: "Négatif : any." },
    { type: "qcm", q: "Complète (offre polie) : Would you like ___ tea?", opts: ["any", "some", "a lot", "much"], a: 1, exp: "Offre polie : some, même dans une question." },
    { type: "input", q: "Complète : He drinks ___ ___ water every day. (beaucoup de)", a: ["a lot of"], ph: "beaucoup de", exp: "a lot of water." },
    { type: "qcm", q: "Complète : Are there ___ shops near here?", opts: ["some", "any", "a lot", "a"], a: 1, exp: "Question : any." },
    { type: "input", q: "Complète : We bought ___ bread and cheese. (affirmatif)", a: ["some"], ph: "some / any", exp: "Affirmatif : some." },
    { type: "vf", q: "« I have some homework » et « I don't have any homework » sont tous deux corrects.", a: true, exp: "Vrai : some à l'affirmatif, any au négatif." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I don't have some time.", "I don't have any time.", "I have any time.", "Do you have some idea?"], a: 1, exp: "Négatif -> any : I don't have any time." },
    { type: "input", q: "Complète (demande polie) : Can I have ___ water, please?", a: ["some"], ph: "some / any", exp: "Demande polie : some." },
    { type: "qcm", q: "Complète : My grandfather has ___ ___ books. (beaucoup)", opts: ["a lot of", "any", "some of", "much of"], a: 0, exp: "a lot of books = beaucoup de livres." }
  ],
  final: {
    title: "Exercice final — Les courses",
    intro: `<p>Marc rentre du supermarché. Lis, puis réponds :</p>

      { type: "input", q: "Complète d'après le texte : We don't have ___ butter. (some / any)", a: ["any"], ph: "some / any", exp: "Négatif : any butter." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Marc est alle au supermarche. Il a achete du lait, du pain
et beaucoup de fruits. Mais il n'a pas achete de cafe parce
qu'il n'y en avait pas dans le rayon. A la maison, sa soeur

le frigo. « Oui, nous avons des oeufs, mais nous n'avons
pas de beurre. »</pre>
<p>Repère le schéma : affirmatif -> some (some milk, some bread, some eggs) et a lot of (a lot of fruit) ; négatif et question -> any (didn't buy any coffee, Do we have any eggs?, don't have any butter).</p>`
