<script>
var DAY = {
  num: 19,
  title: "Décrire une ville et des lieux",
  subtitle: "Nommer les lieux, dire où ils se trouvent et demander son chemin.",
  theory: `
<h3>1. Les lieux de la ville</h3>
<p>Voici les endroits (places) qu'on trouve dans une ville (a town / a city).</p>
<pre class="pseudo">a station          une gare
a bank             une banque
a park             un parc
a museum           un musée
a church           une église
a bridge           un pont
a square           une place
a shop             un magasin
a supermarket      un supermarché
a street           une rue</pre>
<h3>2. There is / There are : dire ce qu'il y a</h3>
<p>Pour dire « il y a », on utilise <strong>there is</strong> (singulier) et <strong>there are</strong> (pluriel).</p>
<pre class="pseudo">There is a park.           Il y a un parc.
There are two museums.     Il y a deux musées.
Is there a bank?           Y a-t-il une banque ?
There is not a station.    Il n'y a pas de gare.</pre>
<div class="tip">À la forme négative, on emploie souvent <strong>There is no...</strong> ou <strong>There are no...</strong> : <em>There is no cinema in my village</em> (il n'y a pas de cinéma dans mon village).</div>
<h3>3. Les prépositions de lieu</h3>
<p>Pour situer un lieu par rapport à un autre :</p>
<pre class="pseudo">next to        à coté de
opposite       en face de
between        entre
near           près de
behind         derrière
in front of    devant
on the corner  au coin</pre>
<pre class="pseudo">The bank is next to the park.        La banque est à coté du parc.
The shop is opposite the church.     Le magasin est en face de l'église.</pre>
<h3>4. Demander et indiquer le chemin</h3>
<pre class="pseudo">Excuse me, where is the station?   Excusez-moi, où est la gare ?
Go straight on.                    Allez tout droit.
Turn left. / Turn right.           Tournez à gauche / à droite.
Take the first street.             Prenez la première rue.
It is on your left.                C'est sur votre gauche.</pre>
<div class="warn">Ne confonds pas <strong>left</strong> (gauche) et <strong>right</strong> (droite). Astuce : <em>right</em> veut aussi dire « correct » ; garde en tête « la main droite pour écrire ».</div>
<h3>5. Décrire une ville avec des adjectifs</h3>
<pre class="pseudo">It is a big city.          C'est une grande ville.
It is a quiet town.        C'est une ville tranquille.
It is very lively.         C'est très animé.
There is a lot to do.      Il y a beaucoup à faire.</pre>`,
  exercises: [
    { type: "input", q: "Traduis « une gare » : a ___", a: ["station"], ph: "en anglais", exp: "a station = une gare." },
    { type: "qcm", q: "Comment dit-on « il y a deux musées » ?", opts: ["There is two museums.", "There are two museums.", "It is two museums.", "There have two museums."], a: 1, exp: "Pluriel : there are." },
    { type: "input", q: "Complète : « The bank is ___ to the park » (à coté de).", a: ["next"], ph: "un mot", exp: "next to = à coté de." },
    { type: "qcm", q: "Que signifie « opposite » ?", opts: ["à coté de", "en face de", "derrière", "entre"], a: 1, exp: "opposite = en face de." },
    { type: "input", q: "Pour dire « allez tout droit » : Go ___ on.", a: ["straight"], ph: "un mot", exp: "Go straight on = Allez tout droit." },
    { type: "vf", q: "« Turn left » veut dire « tournez à gauche ».", a: true, exp: "left = gauche, right = droite." },
    { type: "qcm", q: "Comment dit-on « il y a un parc » (singulier) ?", opts: ["There are a park.", "There is a park.", "It has a park.", "There a park."], a: 1, exp: "Singulier : there is." },
    { type: "input", q: "Traduis « un pont » : a ___", a: ["bridge"], ph: "en anglais", exp: "a bridge = un pont." },
    { type: "qcm", q: "« The shop is between the bank and the church » signifie que le magasin est :", opts: ["derrière la banque", "entre la banque et l'église", "en face de l'église", "à coté de la gare"], a: 1, exp: "between = entre." },
    { type: "input", q: "Complète la question : « ___ there a bank near here? » (Y a-t-il).", a: ["is"], ph: "un mot", exp: "Is there...? = Y a-t-il...?" },
    { type: "qcm", q: "Quelle préposition signifie « derrière » ?", opts: ["in front of", "behind", "near", "opposite"], a: 1, exp: "behind = derrière ; in front of = devant." },
    { type: "input", q: "Traduis « une place » (dans une ville) : a ___", a: ["square"], ph: "en anglais", exp: "a square = une place." },
    { type: "vf", q: "« There is no cinema » veut dire « il n'y a pas de cinéma ».", a: true, exp: "There is no... = il n'y a pas de..." },
    { type: "qcm", q: "« It is a lively city » veut dire que la ville est :", opts: ["tranquille", "animée", "grande", "vieille"], a: 1, exp: "lively = animé, plein de vie." },
    { type: "input", q: "Pour dire « prenez la première rue » : Take the ___ street.", a: ["first"], ph: "un mot", exp: "the first street = la première rue." }
  ],
  final: {
    title: "Exercice final — Finding the museum",
    intro: `<p>Lis ce texte où un habitant décrit le centre-ville, puis réponds aux questions.</p>
<pre class="pseudo">My town is small but lively. There is a big square in the centre.
Next to the square there is an old church. Opposite the church there
is a bank. The museum is behind the station. To go there, turn right
at the bank and go straight on. Take the first street on your left.
The museum is between a park and a supermarket. There is a lot to do
in my town.</pre>`,
    questions: [
      { type: "qcm", q: "What is in the centre of the town?", opts: ["A church", "A big square", "A museum", "A park"], a: 1, exp: "There is a big square in the centre." },
      { type: "input", q: "What is next to the square? An old ___", a: ["church"], ph: "un mot", exp: "Next to the square there is an old church." },
      { type: "qcm", q: "Where is the museum?", opts: ["Next to the church", "Behind the station", "Opposite the bank", "In the square"], a: 1, exp: "The museum is behind the station." },
      { type: "vf", q: "The museum is between a park and a supermarket.", a: true, exp: "The museum is between a park and a supermarket." },
      { type: "input", q: "At the bank, which way do you turn? Turn ___", a: ["right"], ph: "gauche/droite", exp: "Turn right at the bank." }
    ],
    solution: `<p>La ville est petite mais animée. Au centre il y a une grande place, une église à coté, une banque en face de l'église, et le musée derrière la gare, entre un parc et un supermarché.</p>
<pre class="pseudo">There is a big square.        -> ce qu'il y a
next to / opposite / behind   -> ou se trouvent les lieux
turn right, go straight on    -> l'itinéraire</pre>
<p>Retiens l'association <strong>there is/are</strong> pour lister les lieux, et les prépositions pour les situer. Ce sont les bases pour décrire n'importe quel endroit.</p>`
  }
};
</script>
