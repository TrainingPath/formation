<script>
var DAY = {
  num: 6,
  title: "Le comparatif des adjectifs",
  subtitle: "Comparer deux choses : plus grand, plus intéressant...",
  theory: `
<h3>1. Comparer deux éléments</h3>
<p>Le <strong>comparatif</strong> sert à comparer deux choses ou deux personnes. En français : « plus... que ». La forme dépend de la <strong>longueur de l'adjectif</strong> (le nombre de syllabes).</p>
<h3>2. Adjectifs courts (1 syllabe) : -er + than</h3>
<p>On ajoute <strong>-er</strong> à l'adjectif, puis <strong>than</strong> (« que ») :</p>
<pre class="pseudo">Adjectif   Comparatif        Exemple
tall       taller            Tom is taller than Ben.
old        older             My car is older than yours.
fast       faster            A train is faster than a bike.</pre>
<div class="warn">Petites règles d'orthographe : adjectif finissant par -e -> on ajoute juste -r (nice -> nicer) ; voyelle courte + consonne -> on double la consonne (big -> bigger, hot -> hotter) ; consonne + y -> i + er (happy -> happier, easy -> easier).</div>
<h3>3. Adjectifs longs (2 syllabes ou plus) : more + adjectif + than</h3>
<p>Pour les adjectifs longs, on n'ajoute pas -er : on met <strong>more</strong> devant :</p>
<pre class="pseudo">Adjectif       Comparatif           Exemple
expensive      more expensive       Gold is more expensive than iron.
interesting    more interesting     This book is more interesting than that one.
beautiful      more beautiful       Spring is more beautiful than winter.</pre>
<h3>4. Les irréguliers à connaître</h3>
<pre class="pseudo">good  -> better   (bon -> meilleur)     good -> better than
bad   -> worse    (mauvais -> pire)     bad  -> worse than
far   -> farther  (loin -> plus loin)</pre>
<div class="tip">Pour dire l'égalité, on utilise <strong>as ... as</strong> : <em>He is as tall as his brother</em> (il est aussi grand que son frère).</div>`,
  exercises: [
    { type: "input", q: "Complète : Tom is ___ (tall) than Ben.", a: ["taller"], ph: "comparatif", exp: "Adjectif court : tall -> taller." },
    { type: "input", q: "Complète : A plane is ___ (fast) than a car.", a: ["faster"], ph: "comparatif", exp: "fast -> faster." },
    { type: "qcm", q: "Quel est le comparatif de « big » ?", opts: ["biger", "bigger", "more big", "biggest"], a: 1, exp: "Voyelle courte + consonne : on double, bigger." },
    { type: "input", q: "Complète : This exercise is ___ (easy) than the last one.", a: ["easier"], ph: "comparatif", exp: "Consonne + y : easy -> easier." },
    { type: "qcm", q: "Quel est le comparatif de « expensive » ?", opts: ["expensiver", "expensivest", "more expensive", "most expensive"], a: 2, exp: "Adjectif long : more expensive." },
    { type: "vf", q: "On ajoute -er aux adjectifs courts et « more » devant les adjectifs longs.", a: true, exp: "Vrai : c'est la règle principale du comparatif." },
    { type: "input", q: "Complète : My phone is ___ (good) than yours. (irrégulier)", a: ["better"], ph: "comparatif irrégulier", exp: "good -> better (irrégulier)." },
    { type: "qcm", q: "Complète : This film is ___ than the book.", opts: ["more boring", "boringer", "more bored", "boring"], a: 0, exp: "boring est long : more boring." },
    { type: "input", q: "Complète : Today is ___ (hot) than yesterday.", a: ["hotter"], ph: "comparatif", exp: "Voyelle courte + consonne : hot -> hotter." },
    { type: "qcm", q: "Quel est le comparatif de « bad » ?", opts: ["badder", "more bad", "worse", "worst"], a: 2, exp: "bad -> worse (irrégulier)." },
    { type: "input", q: "Complète : She is ___ (happy) than before.", a: ["happier"], ph: "comparatif", exp: "happy -> happier." },
    { type: "qcm", q: "Quel mot signifie « que » dans une comparaison ?", opts: ["that", "than", "then", "as"], a: 1, exp: "than = que : taller than." },
    { type: "input", q: "Complète : A city is ___ (interesting) than a village. (adjectif long)", a: ["more interesting"], ph: "more + adjectif", exp: "interesting est long : more interesting." },
    { type: "vf", q: "« He is more tall than me » est correct.", a: false, exp: "Faux : tall est court, il faut « taller than me »." },
    { type: "qcm", q: "Traduis : « Ce livre est meilleur que ce film. »", opts: ["This book is gooder than this film.", "This book is more good than this film.", "This book is better than this film.", "This book is best than this film."], a: 2, exp: "good -> better than." }
  ],
  final: {
    title: "Exercice final — Deux villes",
    intro: `<p>Anna compare deux villes. Lis, puis réponds :</p>
<pre class="pseudo">I lived in two cities. London is bigger than Bath, but Bath
is quieter and more beautiful. Life in London is more
expensive: the flats are smaller and the streets are busier.
However, London is more exciting than Bath. For me, Bath is
better for a family, but London is better for young people.</pre>`,
    questions: [
      { type: "qcm", q: "Which city is bigger? (Quelle ville est plus grande ?)", opts: ["Bath", "London", "Both the same", "The text doesn't say."], a: 1, exp: "« London is bigger than Bath »." },
      { type: "input", q: "Complète d'après le texte : Bath is ___ (quiet) than London.", a: ["quieter"], ph: "comparatif", exp: "quiet -> quieter." },
      { type: "vf", q: "Life in London is cheaper than in Bath. (La vie à Londres est moins chère qu'à Bath.)", a: false, exp: "Faux : « Life in London is more expensive »." },
      { type: "qcm", q: "According to Anna, which city is better for young people?", opts: ["Bath", "London", "Neither", "Both"], a: 1, exp: "« London is better for young people »." },
      { type: "input", q: "Complète d'après le texte : The streets in London are ___ (busy) than in Bath.", a: ["busier"], ph: "comparatif", exp: "busy -> busier." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">J'ai vecu dans deux villes. Londres est plus grande que
Bath, mais Bath est plus calme et plus belle. La vie a
Londres est plus chere : les appartements sont plus petits
et les rues plus animees. Cependant, Londres est plus
excitante que Bath. Pour moi, Bath est meilleure pour une
famille, mais Londres est meilleure pour les jeunes.</pre>
<p>Adjectifs courts avec -er : bigger, quieter, smaller, busier. Adjectifs longs avec more : more beautiful, more expensive, more exciting. Et l'irrégulier better (good). Le mot than relie toujours les deux éléments comparés.</p>`
  }
};
</script>

    note: "Le choix -er ou more dépend de la longueur de l'adjectif. Apprends aussi les irréguliers better (good) et worse (bad), très fréquents." }
  ]
};
</script>
