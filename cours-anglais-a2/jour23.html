var DAY = {

  title: "Les connecteurs : and, but, because, so",
  subtitle: "Relier ses idées pour faire des phrases plus longues et plus naturelles.",
  theory: `
<h3>1. Pourquoi des connecteurs ?</h3>
<p>Au niveau A2, on ne se contente plus de phrases courtes. On les <strong>relie</strong> pour exprimer des nuances : addition, opposition, cause, conséquence. Les quatre connecteurs de base sont <strong>and, but, because, so</strong>.</p>
<h3>2. AND : ajouter (et)</h3>
<p><strong>and</strong> relie deux idées de même sens, deux choses qui vont ensemble.</p>
<pre class="pseudo">I like tea and I like coffee.       J'aime le thé et j'aime le café.
She is tall and thin.               Elle est grande et mince.</pre>
<h3>3. BUT : opposer (mais)</h3>
<p><strong>but</strong> introduit une opposition, un contraste, quelque chose d'inattendu.</p>
<pre class="pseudo">I like tea but I do not like coffee.   J'aime le thé mais pas le café.
It is small but comfortable.           C'est petit mais confortable.</pre>
<h3>4. BECAUSE : la cause (parce que)</h3>
<p><strong>because</strong> introduit la <strong>raison</strong>, la cause. On répond à la question « pourquoi ? ».</p>
<pre class="pseudo">I stayed home because I was ill.
Je suis resté à la maison parce que j'étais malade.
She is happy because she passed the exam.
Elle est contente parce qu'elle a réussi l'examen.</pre>
<div class="tip">Astuce : <strong>because</strong> répond à « why? ». Après because vient la CAUSE (ce qui s'est passé avant). Ne confonds pas avec <em>why</em> (pourquoi), qui pose la question.</div>
<h3>5. SO : la conséquence (donc, alors)</h3>
<p><strong>so</strong> introduit le <strong>résultat</strong>, la conséquence. C'est presque l'inverse de because.</p>
<pre class="pseudo">I was ill, so I stayed home.
J'étais malade, donc je suis resté à la maison.
It was raining, so we took an umbrella.
Il pleuvait, alors nous avons pris un parapluie.</pre>
<div class="warn">Attention à la logique ! <em>because</em> = cause AVANT résultat ; <em>so</em> = résultat APRÈS cause. « I was ill BECAUSE I stayed home » n'a aucun sens : c'est la maladie qui cause le fait de rester, pas l'inverse.</div>
<h3>6. Résumé</h3>
<pre class="pseudo">and       addition       A et B vont ensemble
but       opposition     A mais B (contraste)
because   cause          résultat BECAUSE cause
so        conséquence    cause SO résultat</pre>`,

    { type: "qcm", q: "Quel connecteur introduit la cause (répond à « why? ») ?", opts: ["and", "but", "because", "so"], a: 2, exp: "because = parce que (cause)." },
    { type: "input", q: "Complète : « She is happy ___ she passed the exam » (parce que).", a: ["because"], ph: "connecteur", exp: "because = parce que." },
    { type: "qcm", q: "« It is small but comfortable » exprime :", opts: ["une addition", "un contraste", "une cause", "une conséquence"], a: 1, exp: "but = contraste : petit MAIS confortable." },
    { type: "input", q: "Complète : « I like tea ___ coffee » (et).", a: ["and"], ph: "connecteur", exp: "and = et (addition)." },
    { type: "qcm", q: "Quelle phrase est logique ?", opts: ["I was ill because I stayed home.", "I stayed home because I was ill.", "I was ill so I was ill.", "I stayed home but I was ill."], a: 1, exp: "La maladie est la cause : because I was ill." },
    { type: "input", q: "Complète : « It was raining, ___ we took an umbrella » (alors).", a: ["so"], ph: "connecteur", exp: "so = alors (conséquence)." },
    { type: "vf", q: "« because » introduit la cause, « so » introduit la conséquence.", a: true, exp: "cause because / so conséquence." },
    { type: "qcm", q: "« I like tennis ___ I hate football. » Quel connecteur convient (contraste) ?", opts: ["and", "but", "because", "so"], a: 1, exp: "Opposition entre aimer et détester : but." },
    { type: "input", q: "Complète : « He is tall ___ strong » (deux qualités qui s'ajoutent).", a: ["and"], ph: "connecteur", exp: "addition : tall and strong." },
    { type: "qcm", q: "« We were hungry, so we ate. » Que signifie « so » ici ?", opts: ["mais", "parce que", "donc / alors", "et"], a: 2, exp: "so = donc : la faim entraine le fait de manger." },
    { type: "input", q: "Complète : « I did not go out ___ it was cold » (parce que).", a: ["because"], ph: "connecteur", exp: "because introduit la cause : le froid." },
    { type: "vf", q: "On peut dire « I was ill, so I stayed home » et « I stayed home because I was ill » : les deux sont corrects et ont le même sens.", a: true, exp: "so met le résultat après, because met la cause après ; le sens est le même." },
    { type: "qcm", q: "Quel connecteur relie deux idées qui vont ensemble ?", opts: ["but", "because", "and", "so"], a: 2, exp: "and = addition." }
  ],
  final: {
    title: "Exercice final — Choose the right connector",
    intro: `<p>Lis ce court paragraphe où une personne explique sa journée, puis réponds aux questions sur les connecteurs.</p>
<pre class="pseudo">This morning I wanted to go for a run, but it was raining. So I stayed
at home and read a book. I love reading because it relaxes me. At lunch,
I was hungry, so I made a big sandwich. In the afternoon, my friend
called and we went to the cinema. The film was long but very good. I
was tired in the evening, so I went to bed early.</pre>`,
    questions: [

      { type: "input", q: "Complète avec le bon connecteur : « I love reading ___ it relaxes me. »", a: ["because"], ph: "connecteur", exp: "because introduit la cause : ça détend." },
      { type: "qcm", q: "« The film was long but very good. » Quel type de lien exprime « but » ?", opts: ["addition", "opposition", "cause", "conséquence"], a: 1, exp: "Contraste : long MAIS bon." },
      { type: "vf", q: "« I was hungry, so I made a sandwich » : « so » exprime la conséquence.", a: true, exp: "La faim (cause) entraine le sandwich (résultat)." },
      { type: "input", q: "Complète : « I was tired in the evening, ___ I went to bed early. »", a: ["so"], ph: "connecteur", exp: "so = donc : la fatigue entraine le coucher." }
    ],
    solution: `<p>Le paragraphe enchaine cause et conséquence avec but (opposition), so (conséquence) et because (cause).</p>
<pre class="pseudo">but it was raining        -> contraste (envie de courir / pluie)
so I stayed at home       -> consequence (pluie donc maison)
because it relaxes me     -> cause (pourquoi j'aime lire)</pre>
<p>Retiens le sens de chaque connecteur : <strong>and</strong> ajoute, <strong>but</strong> oppose, <strong>because</strong> donne la cause, <strong>so</strong> donne le résultat. Bien les choisir rend ton anglais beaucoup plus fluide.</p>`
  }
};
