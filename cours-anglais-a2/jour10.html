<script>
var DAY = {
  num: 10,
  title: "Dénombrable ou indénombrable : how much / how many",
  subtitle: "Ce qui se compte et ce qui ne se compte pas.",
  theory: `
<h3>1. Deux familles de noms</h3>
<p>En anglais, on distingue deux types de noms :</p>
<pre class="pseudo">DENOMBRABLE (countable)      INDENOMBRABLE (uncountable)
- se compte : 1, 2, 3...     - ne se compte pas (masse, liquide...)
- a un pluriel               - PAS de pluriel
- an apple, two apples       - water, money, rice, bread
- a book, three books        - information, music, time</pre>
<div class="warn">Attention : certains noms indénombrables en anglais sont comptables en français ! On dit <em>information</em> (jamais « informations »), <em>money</em>, <em>advice</em>, <em>furniture</em>, <em>news</em>. On ne dit pas « a money » ni « two informations ».</div>
<h3>2. how many : pour ce qui se compte</h3>
<p><strong>How many</strong> (« combien ») s'utilise avec les noms <strong>dénombrables au pluriel</strong> :</p>
<pre class="pseudo">How many apples do you want?     Combien de pommes veux-tu ?
How many students are there?     Combien d'eleves y a-t-il ?</pre>
<h3>3. how much : pour ce qui ne se compte pas</h3>
<p><strong>How much</strong> (« combien ») s'utilise avec les noms <strong>indénombrables</strong> :</p>
<pre class="pseudo">How much water do you drink?     Combien d'eau bois-tu ?
How much money do you have?      Combien d'argent as-tu ?</pre>
<div class="tip">Astuce : <strong>how many</strong> + nom au pluriel (many = beaucoup en nombre) ; <strong>how much</strong> + nom singulier indénombrable. « How much...? » sert aussi à demander un prix : <em>How much is it?</em> (Combien ça coûte ?)</div>
<h3>4. Compter l'indénombrable</h3>
<p>Pour compter un indénombrable, on ajoute un contenant ou une unité :</p>
<pre class="pseudo">a glass of water     un verre d'eau
a piece of advice    un conseil
a slice of bread     une tranche de pain
a cup of coffee      une tasse de cafe</pre>`,
  exercises: [
    { type: "qcm", q: "Le mot « water » est :", opts: ["dénombrable", "indénombrable", "toujours pluriel", "un verbe"], a: 1, exp: "water ne se compte pas : indénombrable." },
    { type: "qcm", q: "Le mot « apple » est :", opts: ["dénombrable", "indénombrable", "sans pluriel", "un adverbe"], a: 0, exp: "an apple, two apples : dénombrable." },
    { type: "input", q: "Complète : How ___ apples do you want? (many / much)", a: ["many"], ph: "many / much", exp: "apples est dénombrable pluriel : how many." },
    { type: "input", q: "Complète : How ___ water is there? (many / much)", a: ["much"], ph: "many / much", exp: "water est indénombrable : how much." },
    { type: "qcm", q: "Complète : How ___ money do you have?", opts: ["many", "much", "some", "any"], a: 1, exp: "money est indénombrable : how much." },
    { type: "vf", q: "On peut dire « two informations » en anglais.", a: false, exp: "Faux : information est indénombrable, pas de pluriel." },
    { type: "input", q: "Complète : How ___ students are in your class? (many / much)", a: ["many"], ph: "many / much", exp: "students dénombrable pluriel : how many." },
    { type: "qcm", q: "Lequel est indénombrable ?", opts: ["book", "car", "rice", "chair"], a: 2, exp: "rice (le riz) ne se compte pas : indénombrable." },
    { type: "input", q: "Complète : How ___ bread do we need? (many / much)", a: ["much"], ph: "many / much", exp: "bread est indénombrable : how much." },
    { type: "qcm", q: "Comment compter l'eau ?", opts: ["a water", "two waters", "a glass of water", "a piece of water"], a: 2, exp: "On ajoute un contenant : a glass of water." },
    { type: "input", q: "Complète : How ___ chairs are there in the room? (many / much)", a: ["many"], ph: "many / much", exp: "chairs dénombrable : how many." },
    { type: "qcm", q: "« How much is it? » sert à demander :", opts: ["le nombre", "le prix", "l'heure", "le lieu"], a: 1, exp: "How much is it? = Combien ça coûte ?" },
    { type: "input", q: "Complète : Can I have a ___ of coffee? (contenant pour une boisson chaude)", a: ["cup"], ph: "contenant", exp: "a cup of coffee : une tasse de café." },
    { type: "vf", q: "« money » est indénombrable : on dit « how much money », pas « how many money ».", a: true, exp: "Vrai : money est indénombrable." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["How many water do you want?", "How much apples are there?", "How many apples are there?", "How much students are here?"], a: 2, exp: "how many + pluriel dénombrable : How many apples are there?" }
  ],
  final: {
    title: "Exercice final — La recette",
    intro: `<p>Emma prépare un gâteau et parle à sa mère. Lis, puis réponds :</p>
<pre class="pseudo">"How much flour do we need for the cake?" asked Emma.
"We need 200 grams of flour and three eggs," said her mother.
"How many eggs? Only three?" "Yes. And how much sugar do we
have?" Emma looked in the cupboard. "Not much. We have a
little sugar, but we don't have any butter."</pre>`,
    questions: [
      { type: "input", q: "Complète d'après le texte : How ___ flour do we need? (many / much)", a: ["much"], ph: "many / much", exp: "flour (farine) est indénombrable : how much." },
      { type: "qcm", q: "How many eggs do they need? (Combien d'oeufs faut-il ?)", opts: ["two", "three", "four", "200"], a: 1, exp: "« three eggs »." },
      { type: "input", q: "Complète d'après le texte : How ___ eggs? (many / much)", a: ["many"], ph: "many / much", exp: "eggs est dénombrable : how many." },
      { type: "vf", q: "They have a lot of sugar. (Ils ont beaucoup de sucre.)", a: false, exp: "Faux : « Not much... a little sugar » = peu de sucre." },
      { type: "qcm", q: "What don't they have? (Que n'ont-ils pas ?)", opts: ["eggs", "flour", "butter", "sugar"], a: 2, exp: "« we don't have any butter »." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">« Combien de farine nous faut-il pour le gateau ? »
demanda Emma. « Il nous faut 200 grammes de farine et
trois oeufs », dit sa mere. « Combien d'oeufs ? Seulement
trois ? » « Oui. Et combien de sucre avons-nous ? » Emma
regarda dans le placard. « Pas beaucoup. Nous avons un peu
de sucre, mais nous n'avons pas de beurre. »</pre>
<p>flour, sugar, butter sont indénombrables -> how much. eggs est dénombrable -> how many. Retiens que le choix ne dépend pas du sens (« combien » en français) mais de la nature du nom en anglais.</p>`
  }
};
</script>
