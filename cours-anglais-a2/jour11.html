<script>
var DAY = {
  num: 11,
  title: "Le present perfect : découverte",
  subtitle: "Le lien entre le passé et le présent : have + participe passé.",
  theory: `
<h3>1. Un temps qui relie passé et présent</h3>
<p>Le <strong>present perfect</strong> parle d'une action passée qui a un <strong>lien avec le présent</strong>. On l'utilise pour une <strong>expérience de vie</strong> (« as-tu déjà... ? ») ou un résultat encore vrai maintenant. Souvent traduit par le passé composé français. Exemple : <em>I have visited London.</em> (« J'ai visité Londres. » = j'en ai l'expérience.)</p>
<h3>2. La construction : have/has + participe passé</h3>
<pre class="pseudo">Sujet             have/has   participe passé
I / You / We /    have       visited, seen, been...
They
He / She / It     has        visited, seen, been...</pre>
<p>Le <strong>participe passé</strong> : pour les verbes réguliers, c'est la forme en <strong>-ed</strong> (comme le passé simple). Pour les irréguliers, c'est la <strong>3e colonne</strong> à mémoriser :</p>
<pre class="pseudo">Base   Passé   Participe passé
go     went    gone          be     was     been
see    saw     seen          do     did     done
eat    ate     eaten         have   had     had
take   took    taken         make   made    made</pre>
<h3>3. Négation et questions</h3>
<pre class="pseudo">Négatif :   I have not (haven't) seen it.
            She has not (hasn't) arrived.
Question :  Have you seen it?   Has he arrived?
Réponse :   Yes, I have. / No, I haven't.</pre>
<h3>4. Les mots-signaux</h3>
<pre class="pseudo">ever      deja (en question)   Have you ever been to Rome?
never     jamais               I have never eaten sushi.
already   deja (affirmatif)    I have already finished.
yet       encore (nég./quest.) I haven't finished yet.
just      juste (a l'instant)  She has just left.</pre>
<div class="warn">Ne confonds pas le participe passé et le passé simple ! Passé simple : <em>I saw</em> (I saw a film yesterday). Present perfect : <em>I have seen</em> (I have seen this film before). On approfondira la différence au Jour 12.</div>`,
  exercises: [
    { type: "input", q: "Complète : I ___ visited London. (auxiliaire have/has)", a: ["have", "'ve"], ph: "have / has", exp: "Avec I : have visited." },
    { type: "input", q: "Complète : She ___ finished her work. (auxiliaire)", a: ["has", "'s"], ph: "have / has", exp: "Avec she : has finished." },
    { type: "qcm", q: "Quel est le participe passé de « see » ?", opts: ["saw", "seen", "seed", "sawn"], a: 1, exp: "see - saw - seen. Participe passé : seen." },
    { type: "input", q: "Complète : They ___ (go) to Paris. -> They have ___.", a: ["gone"], ph: "participe passé", exp: "go - went - gone. Participe passé : gone." },
    { type: "qcm", q: "Quel est le participe passé de « eat » ?", opts: ["ate", "eated", "eaten", "eat"], a: 2, exp: "eat - ate - eaten." },
    { type: "vf", q: "Le present perfect se forme avec have/has + participe passé.", a: true, exp: "Vrai : I have seen, she has gone." },
    { type: "input", q: "Complète : He ___ (do) his homework. -> He has ___.", a: ["done"], ph: "participe passé", exp: "do - did - done." },
    { type: "qcm", q: "Complète : ___ you ever been to Japan?", opts: ["Do", "Did", "Have", "Are"], a: 2, exp: "present perfect : Have you ever been...?" },
    { type: "input", q: "Complète la forme courte négative : I ___ seen that film. (have not)", a: ["haven't", "have not"], ph: "have not", exp: "I haven't seen : haven't = have not." },
    { type: "qcm", q: "Que signifie « ever » dans une question au present perfect ?", opts: ["jamais", "déjà (une fois dans ta vie)", "encore", "toujours"], a: 1, exp: "Have you ever...? = As-tu déjà (une fois)...?" },
    { type: "input", q: "Complète : She ___ (take) the medicine. -> She has ___.", a: ["taken"], ph: "participe passé", exp: "take - took - taken." },
    { type: "qcm", q: "Complète : I have ___ eaten sushi. (jamais)", opts: ["ever", "never", "yet", "just"], a: 1, exp: "I have never eaten : never = jamais." },
    { type: "input", q: "Complète : We ___ already finished. (auxiliaire)", a: ["have", "'ve"], ph: "have / has", exp: "We have already finished." },
    { type: "vf", q: "Le participe passé de « be » est « been ».", a: true, exp: "Vrai : be - was/were - been. I have been to Rome." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I have saw the film.", "I have seen the film.", "I has seen the film.", "I have see the film."], a: 1, exp: "have + participe passé (seen), et have avec I." }
  ],
  final: {
    title: "Exercice final — Le grand voyageur",
    intro: `<p>Paul parle de ses expériences. Lis, puis réponds :</p>
<pre class="pseudo">Paul loves travelling. He has visited more than thirty
countries. He has seen the pyramids in Egypt and he has
climbed a mountain in Nepal. "Have you ever been to
Australia?" I asked. "No, I haven't been there yet, but I
have already booked a flight for next year!"</pre>`,
    questions: [
      { type: "qcm", q: "How many countries has Paul visited? (Combien de pays a visité Paul ?)", opts: ["thirteen", "more than thirty", "three", "three hundred"], a: 1, exp: "« more than thirty countries »." },
      { type: "input", q: "Complète d'après le texte : He ___ seen the pyramids. (auxiliaire)", a: ["has", "'s"], ph: "have / has", exp: "Avec he : has seen." },
      { type: "vf", q: "Paul has been to Australia. (Paul est allé en Australie.)", a: false, exp: "Faux : « I haven't been there yet »." },
      { type: "qcm", q: "What has Paul already done for next year? (Qu'a déjà fait Paul pour l'an prochain ?)", opts: ["visited Australia", "booked a flight", "climbed a mountain", "nothing"], a: 1, exp: "« I have already booked a flight »." },
      { type: "input", q: "Complète d'après le texte : He has ___ (climb) a mountain in Nepal.", a: ["climbed"], ph: "participe passé", exp: "climb est régulier : climbed." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Paul adore voyager. Il a visite plus de trente pays. Il a
vu les pyramides en Egypte et il a escalade une montagne
au Nepal. « Es-tu deja alle en Australie ? » ai-je
demande. « Non, je n'y suis pas encore alle, mais j'ai
deja reserve un vol pour l'an prochain ! »</pre>
<p>Chaque phrase suit le schéma have/has + participe passé : has visited, has seen, has climbed, haven't been, have booked. Les mots ever, yet et already précisent le sens : expérience, action pas encore faite, action déjà faite.</p>`
  }
};
