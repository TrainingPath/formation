<script>
var DAY = {
  num: 24,
  title: "Les pronoms compléments",
  subtitle: "Remplacer le complément par me, you, him, her, it, us, them.",
  theory: `
<h3>1. Sujet ou complément ?</h3>
<p>Tu connais déjà les <strong>pronoms sujets</strong> (I, you, he, she...), placés AVANT le verbe. Aujourd'hui, on voit les <strong>pronoms compléments</strong> (object pronouns), placés APRÈS le verbe ou après une préposition. Ils remplacent le complément pour éviter de répéter un nom.</p>
<pre class="pseudo">Sujet (avant le verbe)   Complément (après le verbe)
I                        me       (moi, me)
you                      you      (toi, te, vous)
he                       him      (lui, le)
she                      her      (elle, la)
it                       it       (le, la, ça)
we                       us       (nous)
they                     them     (eux, les)</pre>
<div class="tip">Seuls trois changent vraiment de forme : <strong>you</strong> et <strong>it</strong> restent identiques. Concentre-toi sur I -> me, he -> him, she -> her, we -> us, they -> them.</div>
<h3>2. Comment les utiliser</h3>
<p>Le pronom complément remplace le nom qui subit l'action.</p>
<pre class="pseudo">I know Tom.  ->  I know him.        Je connais Tom. -> Je le connais.
She loves the film.  ->  She loves it.  Elle aime le film. -> Elle l'aime.
Call your parents.  ->  Call them.     Appelle tes parents. -> Appelle-les.</pre>
<div class="warn">En anglais, le pronom complément se place APRÈS le verbe, jamais avant : on dit <strong>I love her</strong> et non <em>I her love</em>. C'est différent du français « je l'aime ».</div>
<h3>3. Après une préposition</h3>
<p>Après une préposition (to, for, with, at...), on utilise aussi le pronom complément :</p>
<pre class="pseudo">This present is for you.        Ce cadeau est pour toi.
Come with me.                   Viens avec moi.
I am talking to him.            Je parle à lui / je lui parle.
She is looking at us.           Elle nous regarde.</pre>
<h3>4. Sujet et complément dans la même phrase</h3>
<pre class="pseudo">He called me.          Il m'a appelé.   (he = sujet, me = complément)
I saw them.            Je les ai vus.
They helped us.        Ils nous ont aidés.
We invited her.        Nous l'avons invitée.</pre>
<div class="tip">Test rapide : si le pronom fait l'action, c'est un sujet (I, he, she...). S'il subit l'action ou suit une préposition, c'est un complément (me, him, her...).</div>`,
  exercises: [
    { type: "input", q: "Remplace : « I know Tom » -> « I know ___ ».", a: ["him"], ph: "pronom", exp: "Tom (homme) -> him." },
    { type: "qcm", q: "Quel est le pronom complément de « she » ?", opts: ["she", "her", "hers", "him"], a: 1, exp: "she (sujet) -> her (complément)." },
    { type: "input", q: "Remplace : « She loves the film » -> « She loves ___ ».", a: ["it"], ph: "pronom", exp: "the film (chose) -> it." },
    { type: "qcm", q: "Complète : « This present is for ___ » (pour toi).", opts: ["you", "your", "yours", "yourself"], a: 0, exp: "Après for, pronom complément : for you." },
    { type: "input", q: "Remplace : « Call your parents » -> « Call ___ ».", a: ["them"], ph: "pronom", exp: "parents (pluriel) -> them." },
    { type: "vf", q: "En anglais, on dit « I love her » et non « I her love ».", a: true, exp: "Le pronom complément se place après le verbe." },
    { type: "qcm", q: "Quel est le pronom complément de « we » ?", opts: ["we", "our", "us", "ours"], a: 2, exp: "we (sujet) -> us (complément)." },
    { type: "input", q: "Complète : « Come with ___ » (avec moi).", a: ["me"], ph: "pronom", exp: "Après with, pronom complément : me." },
    { type: "qcm", q: "Dans « He called me », quel mot est le complément ?", opts: ["He", "called", "me", "aucun"], a: 2, exp: "me subit l'action : c'est le complément." },
    { type: "input", q: "Remplace : « We invited Sarah » -> « We invited ___ ».", a: ["her"], ph: "pronom", exp: "Sarah (femme) -> her." },
    { type: "qcm", q: "« I am talking to ___ » (à lui). Quel pronom ?", opts: ["he", "his", "him", "himself"], a: 2, exp: "Après to, pronom complément : him." },
    { type: "input", q: "Remplace : « They helped my friends and me » -> « They helped ___ » (nous).", a: ["us"], ph: "pronom", exp: "mes amis et moi -> us." },
    { type: "vf", q: "« you » et « it » ont la même forme au sujet et au complément.", a: true, exp: "Seuls you et it ne changent pas." },
    { type: "qcm", q: "Complète : « She is looking at ___ » (nous).", opts: ["we", "us", "our", "ours"], a: 1, exp: "Après at, pronom complément : us." },
    { type: "input", q: "Remplace : « I saw the children » -> « I saw ___ ».", a: ["them"], ph: "pronom", exp: "the children (pluriel) -> them." }
  ],
  final: {
    title: "Exercice final — Replace the nouns",
    intro: `<p>Lis ce petit message où Anna parle de son week-end, puis réponds aux questions sur les pronoms.</p>
<pre class="pseudo">Last weekend, I visited my grandparents. I love them very much. My
grandmother made a cake and gave it to me. My grandfather showed me
his garden. I helped him with the flowers. In the evening, they drove
me home. I sent them a message to say thank you. They are always kind
to us.</pre>`,
    questions: [
      { type: "input", q: "« I love ___ very much » : quel pronom remplace « my grandparents » ?", a: ["them"], ph: "pronom", exp: "grandparents (pluriel) -> them." },
      { type: "qcm", q: "Dans « gave it to me », que remplace « it » ?", opts: ["the grandmother", "the cake", "the garden", "the message"], a: 1, exp: "it remplace the cake (le gateau)." },
      { type: "input", q: "« I helped ___ with the flowers » : quel pronom pour « my grandfather » ?", a: ["him"], ph: "pronom", exp: "grandfather (homme) -> him." },
      { type: "vf", q: "Dans « they drove me home », « me » est un pronom complément.", a: true, exp: "me subit l'action de drove." },
      { type: "input", q: "« They are always kind to ___ » : quel pronom (nous) ?", a: ["us"], ph: "pronom", exp: "to us = envers nous." }
    ],
    solution: `<p>Anna remplace les noms par des pronoms compléments pour ne pas se répéter : grandparents -> them, the cake -> it, grandfather -> him.</p>
<pre class="pseudo">I love them        (grandparents -> them)
gave it to me      (the cake -> it ; moi -> me)
I helped him       (grandfather -> him)
drove me home      (moi -> me)</pre>
<p>Retiens : le pronom complément suit le verbe ou une préposition. Il évite les répétitions et rend le texte fluide.</p>`
  }
};
</script>

    note: "Souviens-toi que le pronom complément se place après le verbe en anglais (I like her), contrairement au français (je l'aime). C'est une source d'erreurs fréquente." }
