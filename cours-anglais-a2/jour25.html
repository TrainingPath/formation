  title: "Le conditionnel de type 1",
  subtitle: "Parler de conditions réelles : if + présent, will + base verbale.",
  theory: `
<h3>1. À quoi sert le conditionnel de type 1 ?</h3>
<p>Le <strong>first conditional</strong> (conditionnel de type 1) sert à parler d'une condition <strong>réelle</strong> ou <strong>possible</strong> dans le futur : « SI telle chose arrive, ALORS telle autre arrivera ». C'est une prédiction basée sur une condition.</p>
<pre class="pseudo">If it rains, I will stay at home.
S'il pleut, je resterai à la maison.</pre>
<h3>2. La structure : deux parties</h3>
<p>La phrase a toujours deux morceaux : la <strong>condition</strong> (avec if) et le <strong>résultat</strong> (avec will).</p>
<pre class="pseudo">If + PRÉSENT SIMPLE  ,  WILL + base verbale
If it rains          ,  I will stay at home
condition            ,  résultat</pre>
<div class="warn">Règle d'or : après <strong>if</strong>, on met le PRÉSENT, jamais will ! On dit <strong>If it rains</strong> (et non <em>if it will rain</em>). Le futur (will) est seulement dans la partie résultat.</div>
<h3>3. On peut inverser l'ordre</h3>
<p>Les deux parties peuvent changer de place. Si <strong>if</strong> est au début, on met une virgule ; s'il est au milieu, pas de virgule.</p>
<pre class="pseudo">If you study, you will pass the exam.
you will pass the exam if you study.
(même sens : si tu étudies, tu réussiras)</pre>
<h3>4. Exemples utiles</h3>
<pre class="pseudo">If you help me, I will help you.        Si tu m'aides, je t'aiderai.
If she is late, we will wait.           Si elle est en retard, nous attendrons.
If I have time, I will call you.        Si j'ai le temps, je t'appellerai.
I will be happy if you come.            Je serai heureux si tu viens.</pre>
<h3>5. Variantes du résultat</h3>
<p>Dans la partie résultat, on peut remplacer <strong>will</strong> par un autre modal (can, may) ou un impératif :</p>
<pre class="pseudo">If you are tired, you can rest.        Si tu es fatigué, tu peux te reposer.
If you see Tom, tell him hello.        Si tu vois Tom, dis-lui bonjour.</pre>
<div class="tip">La forme courte de <em>will</em> est <strong>'ll</strong> : I will = I'll, you will = you'll. Et <em>will not</em> = <strong>won't</strong>. Très fréquent à l'oral.</div>`,
  exercises: [
    { type: "qcm", q: "Quel temps met-on après « if » dans le conditionnel de type 1 ?", opts: ["le futur (will)", "le présent simple", "le passé", "le conditionnel"], a: 1, exp: "Après if : présent simple. Le will va dans le résultat." },
    { type: "input", q: "Complète : « If it ___ , I will stay at home » (rain, présent).", a: ["rains"], ph: "verbe au présent", exp: "Après if : présent -> it rains." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["If it will rain, I stay home.", "If it rains, I will stay home.", "If it rains, I stay will home.", "If it rain, I will stayed home."], a: 1, exp: "if + présent, will + base : If it rains, I will stay." },
    { type: "input", q: "Complète : « If you study, you ___ pass the exam » (réussir, futur).", a: ["will"], ph: "auxiliaire", exp: "Le résultat prend will : you will pass." },
    { type: "vf", q: "On ne met jamais « will » juste après « if » dans ce type de phrase.", a: true, exp: "Après if, c'est le présent simple." },
    { type: "input", q: "Complète : « If you help me, I ___ help you » (futur).", a: ["will"], ph: "auxiliaire", exp: "résultat : I will help you." },
    { type: "qcm", q: "Où met-on une virgule ?", opts: ["Jamais", "Quand la phrase commence par le résultat", "Quand la phrase commence par la partie « if »", "Toujours au milieu"], a: 2, exp: "Virgule si if est en tête : If it rains, I will stay." },
    { type: "input", q: "Complète : « If she ___ late, we will wait » (be, présent, 3e personne).", a: ["is"], ph: "verbe au présent", exp: "she is late (présent après if)." },
    { type: "qcm", q: "Quelle est la forme contractée de « I will » ?", opts: ["I'll", "I'd", "I've", "I'm"], a: 0, exp: "I will = I'll." },
    { type: "input", q: "Complète : « I ___ be happy if you come » (futur).", a: ["will"], ph: "auxiliaire", exp: "résultat : I will be happy." },
    { type: "qcm", q: "« If you are tired, you can rest. » Quel mot remplace « will » ici ?", opts: ["may", "can", "must", "should"], a: 1, exp: "can peut remplacer will dans le résultat." },
    { type: "input", q: "Remets dans l'ordre le verbe : « If I ___ time, I will call you » (have, présent).", a: ["have"], ph: "verbe au présent", exp: "If I have time (présent après if)." },
    { type: "vf", q: "« you will pass if you study » a le même sens que « If you study, you will pass ».", a: true, exp: "On peut inverser les deux parties." },
    { type: "qcm", q: "Quelle est la forme contractée de « will not » ?", opts: ["willn't", "won't", "wont't", "will'nt"], a: 1, exp: "will not = won't." },
    { type: "input", q: "Complète : « If it ___ sunny tomorrow, we will go to the beach » (be, présent).", a: ["is"], ph: "verbe au présent", exp: "If it is sunny (présent après if)." }
  ],
  final: {
    title: "Exercice final — Making plans",
    intro: `<p>Lis ce message où deux amis font des projets, puis réponds aux questions.</p>
<pre class="pseudo">Hi Sam! Here is my plan for Saturday. If the weather is nice, we will
go to the park. If it rains, we will watch a film at my house. If you
are hungry, I will make some sandwiches. Please call me if you are
free. If we have time in the evening, we can go to the new pizza
restaurant. It will be a great day if you come!</pre>`,
    questions: [
      { type: "qcm", q: "What will they do if the weather is nice?", opts: ["Watch a film", "Go to the park", "Make sandwiches", "Stay home"], a: 1, exp: "If the weather is nice, we will go to the park." },
      { type: "input", q: "Complète d'après le texte : « If it rains, we ___ watch a film. »", a: ["will"], ph: "auxiliaire", exp: "résultat : we will watch a film." },
      { type: "vf", q: "In « If you are hungry, I will make sandwiches », the verb after « if » is in the present.", a: true, exp: "you are (présent) après if." },
      { type: "qcm", q: "When can they go to the pizza restaurant?", opts: ["In the morning", "If it rains", "If they have time in the evening", "Never"], a: 2, exp: "If we have time in the evening, we can go..." },
      { type: "input", q: "Complète : « It will be a great day ___ you come » (connecteur de condition).", a: ["if"], ph: "un mot", exp: "if introduit la condition : if you come." }
    ],
    solution: `<p>Tout le message est construit sur le conditionnel de type 1 : if + présent, will + base verbale.</p>
<pre class="pseudo">If the weather is nice, we will go to the park.
If it rains, we will watch a film.
If you are hungry, I will make sandwiches.
If we have time, we can go... (can remplace will)</pre>
<p>Retiens la règle absolue : après <strong>if</strong>, le présent ; dans le résultat, <strong>will</strong> (ou can). C'est la structure la plus utile pour parler de projets et de conditions.</p>`
  }
};
