<script>
var DAY = {
  num: 3,
  title: "Le passé simple : négation et questions",
  subtitle: "Dire ce qu'on n'a PAS fait et poser des questions au passé.",
  theory: `
<h3>1. L'auxiliaire magique : DID</h3>
<p>Pour la <strong>négation</strong> et les <strong>questions</strong> au passé simple, l'anglais utilise l'auxiliaire <strong>did</strong> (le passé de <em>do</em>). Point très important : dès que <strong>did</strong> apparaît, le verbe principal <strong>revient à sa forme de base</strong> (sans -ed, sans forme irrégulière) !</p>
<div class="warn">C'est l'erreur numéro 1 des débutants : on écrit <em>I didn't <strong>went</strong></em> au lieu de <em>I didn't <strong>go</strong></em>. Le passé est déjà porté par « did », le verbe reste à la base.</div>
<h3>2. La forme négative : didn't + base</h3>
<pre class="pseudo">Affirmatif              Négatif
I played football.      I did not (didn't) play football.
She went home.          She did not (didn't) go home.
They saw the film.      They did not (didn't) see the film.</pre>
<p><strong>didn't</strong> est la forme courte de <strong>did not</strong>. Traduction : « je n'ai pas... ».</p>
<h3>3. Les questions : Did + sujet + base ?</h3>
<pre class="pseudo">Affirmatif              Question
You worked yesterday.   Did you work yesterday?
He ate the cake.        Did he eat the cake?
They came late.         Did they come late?</pre>
<p>Réponses courtes : <em>Yes, I did.</em> / <em>No, I didn't.</em></p>
<h3>4. Les questions avec un mot interrogatif</h3>
<p>On place le mot interrogatif (<em>what, where, when, why, who...</em>) <strong>avant</strong> did :</p>
<pre class="pseudo">What did you do yesterday?     Qu'as-tu fait hier ?
Where did she go?              Où est-elle allée ?
When did they arrive?          Quand sont-ils arrivés ?</pre>
<div class="tip">Exception : le verbe <strong>be</strong> (was/were) n'utilise PAS did. On inverse simplement : <em>Were you happy?</em>, <em>I was not (wasn't) at home.</em></div>`,
  exercises: [
    { type: "input", q: "Mets à la forme négative : I played tennis. -> I ___ play tennis. (forme courte)", a: ["didn't", "did not"], ph: "did + not", exp: "didn't play : did porte le passé, play reste à la base." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I didn't went to school.", "I didn't go to school.", "I didn't goed to school.", "I not went to school."], a: 1, exp: "Après didn't, le verbe revient à la base : go, pas went." },
    { type: "input", q: "Complète la question : ___ you see the match? (auxiliaire)", a: ["did"], ph: "auxiliaire", exp: "Did you see...? Did + sujet + base." },
    { type: "qcm", q: "Complète : Did she ___ her homework?", opts: ["did", "does", "do", "done"], a: 2, exp: "Après Did, le verbe reste à la base : do." },
    { type: "vf", q: "Après « didn't », le verbe garde sa terminaison -ed.", a: false, exp: "Faux : le verbe revient à la base. I didn't play (pas played)." },
    { type: "input", q: "Complète : He ___ (not / like) the film. (forme courte + verbe)", a: ["didn't like", "did not like"], ph: "did not + verbe", exp: "didn't like : la base like après didn't." },
    { type: "qcm", q: "Comment poser : « Où es-tu allé ? »", opts: ["Where you went?", "Where did you go?", "Where did you went?", "Where you did go?"], a: 1, exp: "Mot interrogatif + did + sujet + base." },
    { type: "input", q: "Complète la question : What ___ they eat? (auxiliaire)", a: ["did"], ph: "auxiliaire", exp: "What did they eat? Le passé est dans did." },
    { type: "qcm", q: "Réponse courte correcte à « Did you work? » (réponse négative)", opts: ["No, I don't.", "No, I didn't.", "No, I not.", "No, I wasn't."], a: 1, exp: "On reprend l'auxiliaire : No, I didn't." },
    { type: "vf", q: "Le verbe « be » (was/were) n'utilise pas « did » pour les questions.", a: true, exp: "Vrai : Were you happy? Was he there? On inverse simplement." },
    { type: "input", q: "Mets à la négative : She was tired. -> She ___ tired. (forme courte)", a: ["wasn't", "was not"], ph: "was + not", exp: "wasn't : be ne prend pas did." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Did they came?", "Did they come?", "Do they came?", "They did come?"], a: 1, exp: "Did they come? Base du verbe après did." },
    { type: "input", q: "Complète : We ___ (not / go) to the party. (forme courte)", a: ["didn't go", "did not go"], ph: "did not + verbe", exp: "didn't go : la base go." },
    { type: "qcm", q: "Complète : ___ your parents like the food?", opts: ["Do", "Does", "Did", "Was"], a: 2, exp: "Contexte passé : Did your parents like...?" },
    { type: "vf", q: "« Did you went home? » est correct.", a: false, exp: "Faux : il faut « Did you go home? », base du verbe après did." }
  ],
  final: {
    title: "Exercice final — L'interview de Max",
    intro: `<p>Max parle de sa journée d'hier. Lis, puis réponds :</p>
<pre class="pseudo">Yesterday was a strange day. Max didn't go to work because
he was ill. He didn't eat breakfast, and he stayed in bed
all morning. He didn't watch TV; he read a book instead.
In the evening he felt better, but he didn't cook dinner.</pre>`,
    questions: [
      { type: "vf", q: "Max went to work yesterday. (Max est allé travailler hier.)", a: false, exp: "Faux : « Max didn't go to work »." },
      { type: "qcm", q: "Why didn't Max go to work? (Pourquoi Max n'est-il pas allé travailler ?)", opts: ["He was tired.", "He was ill.", "He was busy.", "He was late."], a: 1, exp: "« because he was ill » = parce qu'il était malade." },
      { type: "input", q: "Complète d'après le texte : He ___ (not / eat) breakfast. (forme courte)", a: ["didn't eat", "did not eat"], ph: "did not + verbe", exp: "didn't eat : base du verbe après didn't." },
      { type: "vf", q: "Max watched TV in the morning. (Max a regardé la télé le matin.)", a: false, exp: "Faux : « He didn't watch TV; he read a book »." },
      { type: "qcm", q: "What did Max do instead of watching TV? (Qu'a fait Max au lieu de regarder la télé ?)", opts: ["He slept.", "He read a book.", "He cooked.", "He worked."], a: 1, exp: "« he read a book instead »." }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">Hier etait une journee etrange. Max n'est pas alle
travailler parce qu'il etait malade. Il n'a pas pris de
petit-dejeuner, et il est reste au lit toute la matinee.
Il n'a pas regarde la tele ; il a lu un livre a la place.
Le soir il se sentait mieux, mais il n'a pas fait le diner.</pre>
<p>Remarque comme chaque négation utilise <strong>didn't + base</strong> : didn't go, didn't eat, didn't watch, didn't cook. Le seul « was » (be) n'a pas besoin de did. Cette régularité rend la négation au passé très facile une fois la règle comprise.</p>`
  }
};
</script>
