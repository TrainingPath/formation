  title: "Present perfect ou passé simple ?",

  theory: `
<h3>1. Deux temps, deux logiques</h3>
<p>Le <strong>passé simple</strong> et le <strong>present perfect</strong> parlent tous deux du passé, mais pas de la même façon. La différence tient à une question : <em>le moment précis de l'action est-il important ?</em></p>
<pre class="pseudo">PASSE SIMPLE            PRESENT PERFECT
moment PRECIS, fini     lien avec MAINTENANT
(quand ? -> on sait)    (quand ? -> pas important)
I saw him yesterday.    I have seen him. (dans ma vie)</pre>
<h3>2. Le passé simple : un moment terminé et daté</h3>
<p>On l'utilise quand l'action est <strong>finie</strong> et rattachée à un <strong>moment précis du passé</strong> (souvent avec un marqueur de temps) :</p>
<pre class="pseudo">I visited Rome in 2019.       (moment precis : 2019)
She arrived ten minutes ago.  (ten minutes ago)
Did you watch the game last night?</pre>
<h3>3. Le present perfect : sans moment précis</h3>
<p>On l'utilise pour une <strong>expérience</strong> ou un résultat, <strong>sans dire quand</strong> :</p>
<pre class="pseudo">I have visited Rome.          (un jour dans ma vie, peu importe quand)
She has just arrived.         (resultat : elle est la maintenant)
Have you ever watched cricket?</pre>
<h3>4. Le test des marqueurs de temps</h3>
<p>Certains mots imposent le temps à utiliser :</p>
<pre class="pseudo">-> PASSE SIMPLE :  yesterday, last week, in 2019,
                   two days ago, when I was young
-> PRESENT PERFECT : ever, never, already, yet, just,
                     so far, up to now</pre>
<div class="warn">Règle en or : dès qu'il y a un <strong>moment précis daté</strong> dans la phrase (yesterday, last year, at 8 o'clock), on utilise le <strong>passé simple</strong>, jamais le present perfect. On dit <em>I saw him yesterday</em> (et non « I have seen him yesterday »).</div>
<div class="tip">Ordre fréquent dans une conversation : on annonce l'expérience au present perfect, puis on donne les détails au passé simple. <em>I have been to Japan. I went there in 2018 and I visited Tokyo.</em></div>`,

    { type: "input", q: "Passé simple ou present perfect ? « She ___ (arrive) ten minutes ago. »", a: ["arrived"], ph: "verbe", exp: "ten minutes ago = moment précis : passé simple, arrived." },

    { type: "input", q: "Complète : We ___ (watch) a film last night. (moment précis)", a: ["watched"], ph: "verbe", exp: "last night = moment précis : passé simple, watched." },
    { type: "qcm", q: "Complète : She ___ just ___ home.", opts: ["did / arrive", "has / arrived", "have / arrived", "arrived"], a: 1, exp: "just + résultat présent : present perfect, has arrived." },
    { type: "input", q: "Present perfect : I ___ (never / be) to Australia. (have + never + participe)", a: ["have never been", "'ve never been"], ph: "have never + participe", exp: "never : present perfect, have never been." },
    { type: "qcm", q: "Quel marqueur impose le present perfect ?", opts: ["last week", "in 2010", "already", "two days ago"], a: 2, exp: "already : present perfect." },
    { type: "input", q: "Passé simple : They ___ (go) to the beach last Sunday.", a: ["went"], ph: "verbe", exp: "last Sunday = moment précis : went." },
    { type: "qcm", q: "Complète : I ___ my keys! I can't open the door. (résultat maintenant)", opts: ["lost", "have lost", "did lose", "was losing"], a: 1, exp: "Résultat présent (je ne peux pas ouvrir) : have lost." },
    { type: "vf", q: "Avec « in 2015 », on utilise le passé simple.", a: true, exp: "Vrai : date précise = passé simple." },
    { type: "input", q: "Complète : Have you ___ (finish) your homework yet? (participe passé)", a: ["finished"], ph: "participe passé", exp: "yet + present perfect : Have you finished...?" },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I have gone to Paris last year.", "I went to Paris last year.", "I have go to Paris last year.", "I did went to Paris last year."], a: 1, exp: "last year = moment daté : I went to Paris last year." }
  ],

"Yes, I have! I love it," said Ben. "I ate at a Thai

      { type: "input", q: "Complète d'après le texte : Where ___ you go? (auxiliaire du passé)", a: ["did"], ph: "auxiliaire", exp: "Question au passé simple avec lieu précis : Where did you go?" }
    ],
    solution: `<p>Traduction du texte :</p>
<pre class="pseudo">« As-tu deja mange thailandais ? » demanda Lena.
« Oui ! J'adore ca », dit Ben. « J'ai mange dans un
restaurant thai vendredi dernier. C'etait delicieux. »
« Vraiment ? Je n'y ai jamais goute. Ou es-tu alle ? »
« Je suis alle dans un petit endroit pres de la gare.
Nous avons fait un repas merveilleux. »</pre>
<p>Observe l'alternance typique : on lance le sujet au present perfect (Have you ever eaten, I have never tried) pour l'expérience, puis on passe au passé simple dès qu'un moment précis apparaît (ate last Friday, went, had). C'est exactement le mouvement d'une vraie conversation.</p>`
  }
