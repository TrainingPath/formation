<script>
var DAY = {
  num: 7,
  title: "Le comparatif des adjectifs",
  subtitle: "Plus, moins, aussi : comparer deux éléments.",
  theory: `
<h3>1. Les trois comparatifs</h3>
<p>Comparer, c'est mettre deux éléments côte à côte. L'espagnol a trois structures selon qu'on exprime la supériorité, l'infériorité ou l'égalité :</p>
<pre class="pseudo">SUPÉRIORITÉ : más + adjectif + que    -> plus ... que
INFÉRIORITÉ : menos + adjectif + que  -> moins ... que
ÉGALITÉ :     tan + adjectif + como   -> aussi ... que</pre>
<pre class="pseudo">Ana es más alta que Luis.       -> Ana est plus grande que Luis.
Este libro es menos caro que ese. -> Ce livre est moins cher que celui-là.
Soy tan fuerte como tú.         -> Je suis aussi fort que toi.</pre>
<div class="warn">Attention : pour l'égalité on utilise <em>tan ... como</em>, pas « tan ... que ». Le partenaire de <em>tan</em> est toujours <em>como</em>.</div>
<h3>2. L'adjectif s'accorde</h3>
<p>Comme toujours en espagnol, l'adjectif s'accorde en genre et en nombre avec le nom qu'il décrit :</p>
<pre class="pseudo">María es más simpática que Pedro.   (féminin)
Estos coches son más rápidos que esos. (masculin pluriel)</pre>
<h3>3. Les comparatifs irréguliers</h3>
<p>Quatre adjectifs très courants ont une forme comparative spéciale (on ne dit pas « más bueno ») :</p>
<pre class="pseudo">bueno (bon)      -> mejor   (meilleur)
malo (mauvais)   -> peor    (pire)
grande (grand)   -> mayor   (plus grand / plus âgé)
pequeño (petit)  -> menor   (plus petit / plus jeune)</pre>
<pre class="pseudo">Este restaurante es mejor que el otro.  -> meilleur que
Mi hermano mayor tiene 20 años.         -> mon frère aîné
Soy menor que mi prima.                 -> plus jeune que</pre>
<div class="tip">mayor et menor servent surtout pour l'âge (aîné / cadet). Pour la taille physique, on peut dire <em>más grande</em> et <em>más pequeño</em>.</div>
<h3>4. Comparer des quantités</h3>
<p>Avec des noms (pas des adjectifs), on utilise <em>más ... que</em> / <em>menos ... que</em> ; pour l'égalité de quantité, on emploie <em>tanto/tanta/tantos/tantas ... como</em>, qui s'accorde avec le nom.</p>
<pre class="pseudo">Tengo más libros que tú.        -> J'ai plus de livres que toi.
Tengo tantos amigos como ella.  -> J'ai autant d'amis qu'elle.
Bebo tanta agua como tú.        -> Je bois autant d'eau que toi.</pre>
<div class="warn">Devant un nombre, « que » devient <em>de</em> : <em>Tengo más de veinte libros</em> (« plus de vingt livres »), pas « más que veinte ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment exprime-t-on la supériorité ?", opts: ["tan ... como", "menos ... que", "más ... que", "tanto ... que"], a: 2, exp: "más + adjectif + que = plus … que." },
    { type: "input", q: "Égalité : Soy ___ alto ___ mi padre. (aussi grand que)", a: ["tan como"], ph: "tan ... como", exp: "tan alto como : le partenaire de tan est como." },
    { type: "qcm", q: "Quel est le comparatif de « bueno » ?", opts: ["más bueno", "mejor", "buenor", "bueno que"], a: 1, exp: "bueno -> mejor (irrégulier)." },
    { type: "qcm", q: "« Mi hermano mayor » signifie :", opts: ["mon frère cadet", "mon meilleur frère", "mon frère aîné", "mon grand frère par la taille"], a: 2, exp: "mayor exprime l'âge : le frère aîné." },
    { type: "input", q: "Infériorité : Este coche es ___ caro ___ el otro. (moins cher que)", a: ["menos que"], ph: "menos ... que", exp: "menos caro que : infériorité." },
    { type: "qcm", q: "Comment dit-on « pire » ?", opts: ["más malo", "peor", "malor", "menos bueno"], a: 1, exp: "malo -> peor (irrégulier)." },
    { type: "input", q: "Accord : María es más ___ (simpático) que Pedro.", a: ["simpática"], ph: "féminin", exp: "L'adjectif s'accorde : simpática (féminin)." },
    { type: "qcm", q: "« Tengo tantos amigos como ella » exprime :", opts: ["plus d'amis", "moins d'amis", "autant d'amis", "aucun ami"], a: 2, exp: "tanto/tantos ... como = autant … que." },
    { type: "qcm", q: "Quelle phrase est correcte pour « aussi rapide que » ?", opts: ["más rápido que", "tan rápido que", "tan rápido como", "menos rápido como"], a: 2, exp: "Égalité = tan + adjectif + como." },
    { type: "qcm", q: "Devant un nombre, « más ... » se construit avec :", opts: ["que", "de", "como", "tan"], a: 1, exp: "más de veinte (plus de vingt) : avec un nombre, on emploie de." },
    { type: "input", q: "Comparatif de « pequeño » (pour l'âge) : Soy ___ que mi hermano.", a: ["menor"], ph: "irrégulier", exp: "pequeño -> menor (plus jeune / cadet)." },
    { type: "qcm", q: "Quelle forme s'accorde avec le nom dans l'égalité de quantité ?", opts: ["tan", "como", "tanto/tanta/tantos/tantas", "más"], a: 2, exp: "tanta agua, tantos amigos : tanto s'accorde." },
    { type: "vf", q: "Pour l'égalité d'un adjectif, on dit « tan ... como ».", a: true, exp: "Vrai : tan alto como (aussi grand que)." },
    { type: "vf", q: "On peut dire « más bueno que » pour « meilleur que ».", a: false, exp: "Faux : la forme correcte est mejor que." },
    { type: "vf", q: "L'adjectif au comparatif reste toujours invariable.", a: false, exp: "Faux : il s'accorde en genre et en nombre (más altas, más rápidos)." }
  ],
  final: {
    title: "Exercice final — Dos ciudades",
    intro: `<p>On compare deux villes, Solaria et Ventosa :</p>
<pre class="pseudo">Solaria es más grande que Ventosa, pero Ventosa es más tranquila.
En Solaria hay más habitantes y más tráfico. Ventosa tiene tantos
parques como Solaria, aunque son más bonitos. La comida de Ventosa
es mejor, pero es menos barata. Para mí, vivir en Ventosa es mejor
que vivir en Solaria.</pre>`,
    questions: [
      { type: "qcm", q: "¿Cuál es más grande?", opts: ["Ventosa", "Solaria", "Las dos igual", "Ninguna"], a: 1, exp: "« Solaria es más grande que Ventosa »." },
      { type: "input", q: "Complète : Ventosa es más ___ (tranquilo). (accord féminin)", a: ["tranquila"], ph: "féminin", exp: "L'adjectif s'accorde avec Ventosa (féminin) : tranquila." },
      { type: "qcm", q: "« Ventosa tiene tantos parques como Solaria » signifie :", opts: ["plus de parcs", "moins de parcs", "autant de parcs", "aucun parc"], a: 2, exp: "tantos ... como = autant … que." },
      { type: "vf", q: "La comida de Ventosa es peor que la de Solaria.", a: false, exp: "Le texte dit « es mejor » : elle est meilleure." },
      { type: "input", q: "Complète : La comida de Ventosa es ___ barata. (moins)", a: ["menos"], ph: "infériorité", exp: "« menos barata » : moins bon marché." }
    ],
    solution: `<p>Le texte illustre les trois comparatifs :</p>
<pre class="pseudo">supériorité : más grande que, más tranquila, más habitantes
égalité     : tantos parques como
irréguliers : mejor (bueno), menos barata (infériorité)</pre>
<p>Retiens surtout tan ... como (égalité d'adjectif), tanto ... como (égalité de quantité) et les irréguliers mejor / peor / mayor / menor.</p>`
  }
};
</script>
