<script>
var DAY = {
  num: 6,
  title: "Le futur simple",
  subtitle: "Parler de demain : prévisions, promesses et hypothèses.",
  theory: `
<h3>1. À quoi sert le futur</h3>
<p>Le <strong>futuro simple</strong> exprime ce qui arrivera : prévisions, projets, promesses. Il correspond au futur français (« je parlerai », « nous irons »). Marqueurs : <em>mañana</em> (demain), <em>la semana que viene</em> (la semaine prochaine), <em>el año próximo</em> (l'an prochain), <em>algún día</em> (un jour).</p>
<pre class="pseudo">Mañana hablaré con el director.  -> Demain je parlerai au directeur.
El año que viene viajaremos a Japón. -> L'an prochain nous voyagerons au Japon.</pre>
<h3>2. Une formation très simple</h3>
<p>Bonne nouvelle : on part de l'<strong>infinitif entier</strong> (hablar, comer, vivir) et on ajoute les mêmes terminaisons pour les trois groupes. Toutes portent un accent, sauf <em>nosotros</em>.</p>
<pre class="pseudo">infinitif + :   -é, -ás, -á, -emos, -éis, -án

hablar ->  hablaré, hablarás, hablará,
           hablaremos, hablaréis, hablarán
comer  ->  comeré, comerás, comerá,
           comeremos, comeréis, comerán
vivir  ->  viviré, vivirás, vivirá,
           viviremos, viviréis, vivirán</pre>
<div class="tip">Les terminaisons sont identiques pour -ar, -er et -ir. Retiens-les une seule fois : -é, -ás, -á, -emos, -éis, -án.</div>
<h3>3. Les radicaux irréguliers</h3>
<p>Quelques verbes fréquents changent de radical, mais gardent les mêmes terminaisons :</p>
<pre class="pseudo">tener  -> tendr-   (tendré, tendrás...)
poner  -> pondr-   (pondré...)
venir  -> vendr-   (vendré...)
salir  -> saldr-   (saldré...)
poder  -> podr-    (podré...)
saber  -> sabr-    (sabré...)
haber  -> habr-    (habrá...)
hacer  -> har-     (haré...)
decir  -> dir-     (diré...)
querer -> querr-   (querré...)</pre>
<h3>4. Autres façons de parler du futur</h3>
<p>À l'oral, l'espagnol utilise souvent <em>ir a + infinitif</em> (le futur proche) pour un projet immédiat, exactement comme le français « aller + infinitif ».</p>
<pre class="pseudo">Voy a estudiar esta tarde.  -> Je vais étudier cet après-midi.
Vamos a comer fuera.        -> Nous allons manger dehors.</pre>
<div class="warn">Le futuro simple sert aussi à exprimer une <strong>probabilité</strong> au présent : <em>¿Qué hora será?</em> = « Quelle heure peut-il bien être ? » et <em>Serán las diez</em> = « Il doit être dix heures ». Ce n'est pas toujours le futur temporel !</div>`,
  exercises: [
    { type: "input", q: "Mañana yo ___ (hablar) con el jefe.", a: ["hablaré"], ph: "futur", exp: "infinitif + é : hablaré." },
    { type: "input", q: "La semana que viene nosotros ___ (viajar) a Roma.", a: ["viajaremos"], ph: "nosotros", exp: "viajar + emos : viajaremos (seule forme sans accent)." },
    { type: "input", q: "Ellos ___ (comer) en casa esta noche.", a: ["comerán"], ph: "ellos", exp: "comer + án : comerán." },
    { type: "input", q: "Radical irrégulier : Yo ___ (tener) tiempo mañana.", a: ["tendré"], ph: "tendr-", exp: "tener -> tendr- : tendré." },
    { type: "input", q: "Radical irrégulier : ¿Qué ___ (hacer, tú) el sábado?", a: ["harás"], ph: "har-", exp: "hacer -> har- : harás." },
    { type: "input", q: "Radical irrégulier : Ella nos lo ___ (decir) pronto.", a: ["dirá"], ph: "dir-", exp: "decir -> dir- : dirá." },
    { type: "qcm", q: "Sur quelle base se forme le futuro simple des verbes réguliers ?", opts: ["Le radical seul", "L'infinitif entier", "Le participe passé", "Le gérondif"], a: 1, exp: "hablar + é, comer + é… on part de l'infinitif complet." },
    { type: "qcm", q: "Quelle forme du futur ne porte PAS d'accent ?", opts: ["yo (é)", "tú (ás)", "nosotros (emos)", "ellos (án)"], a: 2, exp: "hablaremos : la forme nosotros est la seule sans accent." },
    { type: "qcm", q: "Quel est le radical du futur de « poder » ?", opts: ["poder-", "podr-", "puedr-", "pod-"], a: 1, exp: "poder -> podr- : podré, podrás…" },
    { type: "qcm", q: "Comment dit-on « ils viendront » ?", opts: ["venirán", "vendrán", "vienerán", "vendrémos"], a: 1, exp: "venir -> vendr- : vendrán." },
    { type: "qcm", q: "« Voy a estudiar » exprime :", opts: ["Le passé", "Un futur proche (je vais étudier)", "Une habitude", "Un ordre"], a: 1, exp: "ir a + infinitif = futur proche." },
    { type: "qcm", q: "« Serán las diez » peut signifier :", opts: ["Il sera dix heures demain", "Il doit être environ dix heures (probabilité)", "Il était dix heures", "Il n'est pas dix heures"], a: 1, exp: "Le futur exprime aussi une probabilité au présent." },
    { type: "vf", q: "Les terminaisons du futur sont les mêmes pour les verbes en -ar, -er et -ir.", a: true, exp: "Vrai : -é, -ás, -á, -emos, -éis, -án pour tous." },
    { type: "vf", q: "Le radical du futur de « hacer » est « hacer- ».", a: false, exp: "Faux : c'est har- (haré, harás…)." },
    { type: "vf", q: "« Vendré » est le futur de « venir ».", a: true, exp: "Vrai : venir -> vendr- : vendré." }
  ],
  final: {
    title: "Exercice final — Los planes de verano",
    intro: `<p>Laura décrit ses projets d'été au futur :</p>
<pre class="pseudo">El próximo verano haré un viaje por Europa. Primero iré a París y
después visitaré Italia. Mis amigos vendrán conmigo dos semanas.
Tendremos que ahorrar mucho, pero valdrá la pena. Cuando vuelva,
os contaré todo y os enseñaré mil fotos.</pre>`,
    questions: [
      { type: "input", q: "Complète : El próximo verano yo ___ (hacer) un viaje.", a: ["haré"], ph: "har-", exp: "hacer -> haré." },
      { type: "qcm", q: "¿Adónde irá Laura primero?", opts: ["A Italia", "A París", "A casa", "A España"], a: 1, exp: "« Primero iré a París »." },
      { type: "input", q: "Complète : Mis amigos ___ (venir) conmigo.", a: ["vendrán"], ph: "vendr-", exp: "venir -> vendrán." },
      { type: "vf", q: "Laura no gastará dinero en este viaje.", a: false, exp: "« Tendremos que ahorrar mucho » : il faudra économiser, donc dépenser." },
      { type: "input", q: "Complète : Cuando vuelva, os ___ (contar) todo.", a: ["contaré"], ph: "futur régulier", exp: "contar -> contaré." }
    ],
    solution: `<p>Le récit de projets appelle le futuro simple, avec ses irréguliers fréquents :</p>
<pre class="pseudo">haré (hacer), iré (ir), visitaré, vendrán (venir),
tendremos (tener), valdrá (valer), contaré, enseñaré</pre>
<p>Note que tous partagent les mêmes terminaisons ; seuls les radicaux (har-, vendr-, tendr-, valdr-) sont irréguliers.</p>`
  }
};
</script>
