<script>
var DAY = {
  num: 10,
  title: "Muy, mucho et les quantités",
  subtitle: "Ne plus confondre « très » et « beaucoup ».",
  theory: `
<h3>1. Le piège numéro un des francophones</h3>
<p><em>Muy</em> et <em>mucho</em> se traduisent souvent tous les deux par « très » ou « beaucoup », mais ils ne s'emploient pas au même endroit. La règle est simple une fois comprise :</p>
<pre class="pseudo">MUY   + adjectif ou adverbe   -> « très »   (muy alto, muy bien)
MUCHO (verbe / nom)           -> « beaucoup » (trabaja mucho, mucho dinero)</pre>
<h3>2. MUY : devant un adjectif ou un adverbe</h3>
<p><em>Muy</em> renforce un adjectif ou un adverbe. Il est <strong>invariable</strong> : il ne change jamais de forme.</p>
<pre class="pseudo">Es muy alto.        -> Il est très grand.
Está muy cansada.   -> Elle est très fatiguée.
Habla muy bien.     -> Il parle très bien.
Son muy simpáticos. -> Ils sont très sympathiques. (muy reste invariable)</pre>
<h3>3. MUCHO : avec un verbe ou un nom</h3>
<p>Avec un <strong>verbe</strong>, <em>mucho</em> signifie « beaucoup » et reste invariable :</p>
<pre class="pseudo">Trabaja mucho.   -> Il travaille beaucoup.
Como mucho.      -> Je mange beaucoup.</pre>
<p>Avec un <strong>nom</strong>, <em>mucho</em> devient un adjectif de quantité et <strong>s'accorde</strong> en genre et en nombre :</p>
<pre class="pseudo">mucho dinero    (beaucoup d'argent, masc. sing.)
mucha gente     (beaucoup de monde, fém. sing.)
muchos libros   (beaucoup de livres, masc. plur.)
muchas casas    (beaucoup de maisons, fém. plur.)</pre>
<div class="warn">Erreur classique : « muy mucho ». On ne combine jamais les deux. Pour « vraiment beaucoup », on dit <em>muchísimo</em> (Trabaja muchísimo). Et « très bon » = <em>muy bueno</em>, jamais « mucho bueno ».</div>
<h3>4. Autres quantités utiles</h3>
<pre class="pseudo">poco / poca / pocos / pocas   -> peu de (s'accorde avec le nom)
un poco de                    -> un peu de (+ nom non comptable)
demasiado/a/os/as             -> trop (de)
bastante / bastantes          -> assez (de)
todo / toda / todos / todas   -> tout / tous</pre>
<pre class="pseudo">Hay poca leche.        -> Il y a peu de lait.
Quiero un poco de pan. -> Je veux un peu de pain.
Comes demasiado.       -> Tu manges trop.
Tengo bastantes amigos.-> J'ai assez d'amis.</pre>
<div class="tip">Test rapide : si le mot qui suit est un adjectif ou un adverbe -> <em>muy</em>. Si c'est un verbe ou un nom -> <em>mucho</em> (accordé s'il s'agit d'un nom).</div>`,
  exercises: [
    { type: "qcm", q: "Devant un adjectif, on emploie :", opts: ["mucho", "muy", "muchos", "poco"], a: 1, exp: "muy + adjectif : muy alto, muy cansado." },
    { type: "input", q: "Complète : Ella es ___ inteligente. (très)", a: ["muy"], ph: "muy/mucho", exp: "muy devant l'adjectif inteligente." },
    { type: "input", q: "Complète : Trabaja ___. (beaucoup, avec un verbe)", a: ["mucho"], ph: "muy/mucho", exp: "mucho après un verbe = beaucoup." },
    { type: "input", q: "Complète (accord) : Hay ___ gente en la calle. (beaucoup de)", a: ["mucha"], ph: "accord", exp: "gente est féminin singulier -> mucha gente." },
    { type: "input", q: "Complète (accord) : Tengo ___ libros. (beaucoup de)", a: ["muchos"], ph: "accord", exp: "libros masculin pluriel -> muchos libros." },
    { type: "qcm", q: "Comment dit-on « très bien » ?", opts: ["mucho bien", "muy bien", "muchos bien", "muy mucho"], a: 1, exp: "bien est un adverbe -> muy bien." },
    { type: "qcm", q: "Quelle expression est INCORRECTE ?", opts: ["muy alto", "trabaja mucho", "muy mucho", "muchas casas"], a: 2, exp: "« muy mucho » n'existe pas. On dirait muchísimo." },
    { type: "qcm", q: "« Comes demasiado » signifie :", opts: ["Tu manges peu", "Tu manges trop", "Tu manges assez", "Tu ne manges pas"], a: 1, exp: "demasiado = trop." },
    { type: "input", q: "Complète (un peu de) : Quiero ___ de café.", a: ["un poco"], ph: "quantité", exp: "un poco de café : un peu de." },
    { type: "qcm", q: "Comment dire « vraiment beaucoup » (avec un verbe) ?", opts: ["muy mucho", "muchísimo", "mucho muy", "poco"], a: 1, exp: "muchísimo = énormément (Trabaja muchísimo)." },
    { type: "qcm", q: "Compréhension : « Está muy cansada pero tiene mucho trabajo. » Que comprend-on ?", opts: ["Elle est reposée et n'a rien à faire", "Elle est très fatiguée mais a beaucoup de travail", "Elle travaille peu", "Elle n'est pas fatiguée"], a: 1, exp: "muy cansada (adjectif) + mucho trabajo (nom masc.) : très fatiguée, beaucoup de travail." },
    { type: "qcm", q: "Compréhension : « En la fiesta había poca comida pero mucha música. »", opts: ["Beaucoup de nourriture, peu de musique", "Peu de nourriture, beaucoup de musique", "Ni nourriture ni musique", "Trop de tout"], a: 1, exp: "poca comida (peu) + mucha música (beaucoup)." },
    { type: "vf", q: "« Muy » est invariable et « mucho » s'accorde quand il précède un nom.", a: true, exp: "Vrai : muy alto/altos, mais mucho/mucha/muchos/muchas + nom." },
    { type: "vf", q: "On peut dire « muy mucho » pour insister.", a: false, exp: "Faux : c'est une faute. On dit muchísimo." },
    { type: "vf", q: "« Poca leche » est correct car poco s'accorde avec leche (féminin).", a: true, exp: "Vrai : poca leche (peu de lait, féminin)." }
  ],
  final: {
    title: "Exercice final — El nuevo trabajo",
    intro: `<p>Sofía parle de son nouvel emploi :</p>
<pre class="pseudo">Mi nuevo trabajo es muy interesante, pero también es muy exigente.
Tengo mucho trabajo y muchas reuniones cada día. Mis compañeros son
muy amables y me ayudan mucho. Al principio estaba muy nerviosa, pero
ahora estoy bastante tranquila. Solo tengo un problema: hay poca luz
en mi oficina y demasiado ruido.</pre>`,
    questions: [
      { type: "input", q: "Complète : El trabajo es ___ interesante. (très)", a: ["muy"], ph: "muy/mucho", exp: "muy + adjectif interesante." },
      { type: "input", q: "Complète (accord) : Tengo ___ reuniones. (beaucoup de)", a: ["muchas"], ph: "accord", exp: "reuniones fém. pluriel -> muchas." },
      { type: "qcm", q: "¿Cómo son sus compañeros?", opts: ["Antipáticos", "Muy amables", "Poco amables", "Aburridos"], a: 1, exp: "« Mis compañeros son muy amables »." },
      { type: "qcm", q: "¿Qué problema tiene la oficina?", opts: ["Poca luz y demasiado ruido", "Mucha luz", "Poco trabajo", "Demasiada comida"], a: 0, exp: "« hay poca luz … y demasiado ruido »." },
      { type: "vf", q: "Ahora Sofía está muy nerviosa.", a: false, exp: "« ahora estoy bastante tranquila » : elle est plutôt tranquille maintenant." }
    ],
    solution: `<p>Le texte alterne parfaitement muy et mucho :</p>
<pre class="pseudo">muy + adjectif : muy interesante, muy exigente, muy amables, muy nerviosa
mucho + verbe/nom : mucho trabajo, muchas reuniones, me ayudan mucho
autres quantités : bastante tranquila, poca luz, demasiado ruido</pre>
<p>La clé : regarde le mot qui suit. Adjectif/adverbe -> muy ; verbe/nom -> mucho (accordé devant un nom).</p>`
  }
};
</script>
