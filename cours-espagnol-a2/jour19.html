<script>
var DAY = {
  num: 19,
  title: "Décrire une ville et des lieux",
  subtitle: "Nommer les lieux, situer dans l'espace et décrire une ville en espagnol.",
  theory: `
<h3>1. Les lieux de la ville (lugares)</h3>
<pre class="pseudo">la plaza     = la place        el parque   = le parc
la calle     = la rue          el museo    = le musée
la iglesia   = l'église        el mercado  = le marché
el banco     = la banque       la tienda   = le magasin
la farmacia  = la pharmacie    el hospital = l'hôpital</pre>
<h3>2. Hay : il y a</h3>
<p>Pour dire ce qu'il y a dans une ville, on utilise <strong>hay</strong> (il y a), invariable au singulier comme au pluriel :</p>
<pre class="pseudo">En mi ciudad hay un museo.       = Dans ma ville il y a un musée.
Hay muchas tiendas.              = Il y a beaucoup de magasins.
No hay metro.                    = Il n'y a pas de métro.</pre>
<div class="warn">Ne confonds pas <strong>hay</strong> (il y a) et <strong>está</strong> (il/elle est situé). <em>Hay un banco</em> = il y a une banque ; <em>El banco está en la plaza</em> = la banque est sur la place.</div>
<h3>3. Situer dans l'espace (las preposiciones)</h3>
<pre class="pseudo">al lado de    = à côté de       cerca de   = près de
enfrente de   = en face de       lejos de   = loin de
detrás de     = derrière         entre      = entre
delante de    = devant           en la esquina = au coin</pre>
<p>Exemples : <em>La farmacia está al lado del banco</em> (la pharmacie est à côté de la banque) ; <em>El museo está enfrente de la plaza</em> (le musée est en face de la place).</p>
<div class="tip">Rappel de contraction : <strong>de + el = del</strong> et <strong>a + el = al</strong>. On dit <em>al lado del parque</em>, jamais « de el parque ».</div>
<h3>4. Décrire une ville (adjectifs)</h3>
<pre class="pseudo">grande     = grande            pequeño/a  = petit(e)
bonito/a   = joli(e)            feo/a      = laid(e)
tranquilo/a = calme             ruidoso/a  = bruyant(e)
antiguo/a  = ancien(ne)         moderno/a  = moderne</pre>
<p>Exemple : <em>Sevilla es una ciudad grande y muy bonita</em> (Séville est une grande ville très jolie).</p>`,
  exercises: [
    { type: "qcm", q: "« la iglesia » désigne :", opts: ["le marché", "l'église", "la banque", "le parc"], a: 1, exp: "La iglesia = l'église." },
    { type: "qcm", q: "Pour dire « il y a un musée », on écrit :", opts: ["Está un museo", "Hay un museo", "Es un museo", "Tiene un museo"], a: 1, exp: "Hay = il y a (existence)." },
    { type: "input", q: "Complète : « La farmacia está al lado ___ banco. » (contraction de + el)", a: ["del"], ph: "de + el", exp: "de + el = del." },
    { type: "qcm", q: "« enfrente de » signifie :", opts: ["à côté de", "en face de", "derrière", "loin de"], a: 1, exp: "Enfrente de = en face de." },
    { type: "vf", q: "« cerca de » veut dire « loin de ».", a: false, exp: "Faux : cerca de = près de ; lejos de = loin de." },
    { type: "qcm", q: "Quelle phrase situe correctement un lieu ?", opts: ["Hay el banco en la plaza", "El banco está en la plaza", "El banco hay en la plaza", "Está un banco hay"], a: 1, exp: "Pour situer un lieu précis, on utilise está." },
    { type: "input", q: "Complète : « El museo está ___ de la plaza. » (en face)", a: ["enfrente"], ph: "préposition", exp: "Enfrente de = en face de." },
    { type: "qcm", q: "« tranquilo » décrit une ville :", opts: ["bruyante", "calme", "moderne", "laide"], a: 1, exp: "Tranquilo = calme ; ruidoso = bruyant." },
    { type: "input", q: "Accorde : une petite ville = una ciudad ___ .", a: ["pequeña"], ph: "adjectif", exp: "Ciudad est féminin : pequeña." },
    { type: "qcm", q: "« a + el » se contracte en :", opts: ["ael", "al", "el", "a la"], a: 1, exp: "a + el = al." },
    { type: "vf", q: "« detrás de » signifie « derrière ».", a: true, exp: "Detrás de = derrière ; delante de = devant." },
    { type: "qcm", q: "Comprension : « En mi barrio hay un parque grande y muchas tiendas. » Que dit la personne ?", opts: ["Il n'y a rien", "Il y a un grand parc et beaucoup de magasins", "Il y a un petit musée", "Il y a un hôpital"], a: 1, exp: "Un parque grande y muchas tiendas." },
    { type: "qcm", q: "Comprension : « La farmacia está entre el banco y la iglesia. » Où est la pharmacie ?", opts: ["À côté du parc", "Entre la banque et l'église", "En face de l'école", "Loin du centre"], a: 1, exp: "Entre… y… = entre… et…" },
    { type: "input", q: "Complète : « No ___ metro en mi pueblo. » (il n'y a pas)", a: ["hay"], ph: "verbe", exp: "No hay = il n'y a pas." },
    { type: "qcm", q: "Comprension : « Es una ciudad antigua pero muy tranquila. » Comment est la ville ?", opts: ["Moderne et bruyante", "Ancienne et calme", "Petite et laide", "Grande et moderne"], a: 1, exp: "Antigua = ancienne ; tranquila = calme." }
  ],
  final: {
    title: "Exercice final — Mi ciudad",
    intro: `<p>Lis cette description d'une ville :</p>
<pre class="pseudo">Vivo en Granada, una ciudad muy bonita del sur de España.
En el centro hay una plaza grande con muchos cafés.
Al lado de la plaza está la catedral, que es muy antigua.
Cerca de mi casa hay un mercado y una farmacia.
No hay metro, pero hay muchos autobuses.
Granada es tranquila y me gusta mucho vivir aquí.</pre>`,
    questions: [
      { type: "qcm", q: "Où vit la personne ?", opts: ["À Séville", "À Granada", "À Madrid", "À Barcelone"], a: 1, exp: "Vivo en Granada." },
      { type: "qcm", q: "Qu'y a-t-il sur la grande place du centre ?", opts: ["Un musée", "Beaucoup de cafés", "Un hôpital", "Une gare"], a: 1, exp: "Una plaza grande con muchos cafés." },
      { type: "vf", q: "La cathédrale est ancienne.", a: true, exp: "La catedral es muy antigua." },
      { type: "qcm", q: "Y a-t-il un métro à Granada ?", opts: ["Oui", "Non, mais il y a des bus", "Oui, deux lignes", "On ne sait pas"], a: 1, exp: "No hay metro, pero hay muchos autobuses." },
      { type: "input", q: "Quel adjectif décrit l'ambiance de la ville ? (un mot)", a: ["tranquila", "tranquilo"], ph: "adjectif", exp: "Granada es tranquila = calme." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je vis à Grenade, une très jolie ville du sud de l'Espagne.
Dans le centre il y a une grande place avec beaucoup de cafés.
À côté de la place se trouve la cathédrale, qui est très ancienne.
Près de chez moi il y a un marché et une pharmacie.
Il n'y a pas de métro, mais il y a beaucoup de bus.
Grenade est calme et j'aime beaucoup y vivre.</pre>
<p>Le duo à maîtriser : <strong>hay</strong> (il y a, existence) + <strong>está</strong> (est situé) + les prépositions de lieu (<strong>al lado de, cerca de, enfrente de</strong>).</p>`
  }
};
</script>
