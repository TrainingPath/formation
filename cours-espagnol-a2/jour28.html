<script>
var DAY = {
  num: 28,
  title: "Écrire un message et une carte postale",
  subtitle: "Structurer un message informel et une carte postale en espagnol.",
  theory: `
<h3>1. Les formules pour commencer</h3>
<p>Un message informel (SMS, e-mail à un ami, carte postale) commence par une salutation. Voici les plus courantes :</p>
<pre class="pseudo">¡Hola!               = Salut !
¡Hola, María!        = Salut María !
Querido Juan:        = Cher Juan (masculin)
Querida Ana:         = Chère Ana (féminin)
¿Qué tal?            = Comment ça va ?</pre>
<div class="warn">En espagnol, après la formule d'appel, on met traditionnellement <strong>deux points</strong> (:) et non une virgule : <em>Querido Juan:</em> (et non « Querido Juan, »).</div>
<h3>2. Le corps du message</h3>
<p>Ensuite, on entre dans le vif du sujet avec des formules simples :</p>
<pre class="pseudo">Te escribo desde…       = Je t'écris depuis…
Estoy de vacaciones en… = Je suis en vacances à…
Lo estoy pasando muy bien. = Je passe un très bon moment.
El tiempo es estupendo.  = Le temps est superbe.
Te echo de menos.        = Tu me manques.</pre>
<h3>3. Une carte postale modèle</h3>
<pre class="pseudo">¡Hola, Pablo!

Te escribo desde Barcelona. Estoy de vacaciones aquí con mi
familia. La ciudad es preciosa y hace muy buen tiempo. Ayer
visitamos la Sagrada Familia y hoy vamos a la playa. La comida
está buenísima. Lo estoy pasando genial. ¡Te echo de menos!

Nos vemos pronto.
Un abrazo,
Marta</pre>
<h3>4. Les formules pour terminer</h3>
<pre class="pseudo">Un abrazo         = Une accolade (amical)
Un beso / Besos   = Bisou(s) (proche, familier)
Hasta pronto      = À bientôt
Nos vemos         = On se voit / À plus
Saludos           = Salutations (un peu plus neutre)</pre>
<div class="tip">Adapte la formule au destinataire : pour un ami proche, <strong>un beso</strong> ou <strong>besos</strong> ; pour quelqu'un que tu connais moins, <strong>saludos</strong> ou <strong>hasta pronto</strong>.</div>
<h3>5. Un message court (SMS)</h3>
<pre class="pseudo">¡Hola! ¿Quedamos esta tarde? Podemos ir al cine a las seis.
Avísame. ¡Un beso!
= Salut ! On se voit cet après-midi ? On peut aller au ciné
à 18h. Préviens-moi. Bisou !</pre>`,
  exercises: [
    { type: "qcm", q: "Comment commence-t-on une carte pour un ami masculin ?", opts: ["Querida Juan:", "Querido Juan:", "Estimado Juan,", "Señor Juan:"], a: 1, exp: "Querido (masculin) Juan: avec deux points." },
    { type: "qcm", q: "Après « Querida Ana », on met traditionnellement :", opts: ["une virgule", "deux points (:)", "un point", "rien"], a: 1, exp: "En espagnol, deux points après la formule d'appel." },
    { type: "input", q: "Complète : « Te ___ desde Madrid. » (j'écris)", a: ["escribo"], ph: "verbe", exp: "Te escribo desde… = je t'écris depuis…" },
    { type: "qcm", q: "« Lo estoy pasando muy bien » signifie :", opts: ["Je m'ennuie", "Je passe un très bon moment", "Je suis malade", "Je rentre demain"], a: 1, exp: "Pasarlo bien = passer un bon moment." },
    { type: "vf", q: "« Te echo de menos » veut dire « tu me manques ».", a: true, exp: "Echar de menos = manquer (à quelqu'un)." },
    { type: "qcm", q: "Quelle formule est la plus familière pour terminer ?", opts: ["Saludos", "Un beso", "Atentamente", "Cordialmente"], a: 1, exp: "Un beso est très familier/affectueux." },
    { type: "input", q: "Complète : « Estoy de ___ en Sevilla. » (vacances)", a: ["vacaciones"], ph: "nom", exp: "Estar de vacaciones = être en vacances." },
    { type: "qcm", q: "« Hasta pronto » signifie :", opts: ["Bonjour", "À bientôt", "Merci", "Au revoir définitif"], a: 1, exp: "Hasta pronto = à bientôt." },
    { type: "qcm", q: "Dans une carte postale, quel élément vient en PREMIER ?", opts: ["La signature", "La formule d'appel (¡Hola!)", "L'adresse", "La date de retour"], a: 1, exp: "On commence toujours par saluer." },
    { type: "input", q: "Complète : « El tiempo es ___ » (superbe).", a: ["estupendo"], ph: "adjectif", exp: "Estupendo = superbe, formidable." },
    { type: "vf", q: "« Avísame » veut dire « préviens-moi ».", a: true, exp: "Avísame = préviens-moi (avisar + me à l'impératif)." },
    { type: "qcm", q: "Comprension : « Te escribo desde la playa. Hace sol y lo paso genial. » Où est la personne ?", opts: ["Au travail", "À la plage", "À l'hôpital", "À la maison"], a: 1, exp: "Te escribo desde la playa = depuis la plage." },
    { type: "qcm", q: "Comprension : « ¿Quedamos esta tarde a las seis? » Que propose la personne ?", opts: ["Un rendez-vous cet après-midi à 18h", "Un voyage", "Un dîner demain", "Rien"], a: 0, exp: "Quedar = se donner rendez-vous ; a las seis = à 18h." },
    { type: "input", q: "Complète la clôture : « Un ___ muy fuerte, Marta » (accolade).", a: ["abrazo"], ph: "mot", exp: "Un abrazo (muy fuerte) = une grosse accolade." },
    { type: "qcm", q: "Comprension : « La comida está buenísima y la gente es muy simpática. » Que pense la personne du lieu ?", opts: ["Elle n'aime pas", "Elle trouve la nourriture délicieuse et les gens sympas", "Elle a froid", "Elle veut rentrer"], a: 1, exp: "Buenísima (délicieuse) + gente muy simpática (gens sympas)." }
  ],
  final: {
    title: "Exercice final — Una postal desde el mar",
    intro: `<p>Lis cette carte postale et réponds :</p>
<pre class="pseudo">¡Hola, abuela!

Te escribo desde Málaga. Estoy aquí con mamá y papá desde el
lunes. La playa es enorme y el agua está calentita. Por las
mañanas nadamos y por las tardes comemos helado. Ayer vimos
un castillo muy antiguo. Lo estoy pasando genial, pero te echo
de menos. Volvemos el domingo.

Muchos besos,
Diego</pre>`,
    questions: [
      { type: "qcm", q: "À qui écrit Diego ?", opts: ["À son ami", "À sa grand-mère", "À son professeur", "À son frère"], a: 1, exp: "¡Hola, abuela! = grand-mère." },
      { type: "input", q: "Depuis quelle ville écrit-il ?", a: ["Málaga", "Malaga"], ph: "ville", exp: "Te escribo desde Málaga." },
      { type: "qcm", q: "Depuis quand est-il là-bas ?", opts: ["Depuis dimanche", "Depuis lundi", "Depuis mercredi", "Depuis vendredi"], a: 1, exp: "Estoy aquí… desde el lunes." },
      { type: "qcm", q: "Que font-ils l'après-midi ?", opts: ["Ils nagent", "Ils mangent des glaces", "Ils dorment", "Ils étudient"], a: 1, exp: "Por las tardes comemos helado." },
      { type: "vf", q: "Diego rentre dimanche.", a: true, exp: "Volvemos el domingo = nous rentrons dimanche." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Salut mamie !

Je t'écris depuis Malaga. Je suis ici avec maman et papa depuis
lundi. La plage est immense et l'eau est bien chaude. Le matin nous
nageons et l'après-midi nous mangeons des glaces. Hier nous avons vu
un château très ancien. Je passe un super moment, mais tu me manques.
Nous rentrons dimanche.

Beaucoup de bisous,
Diego</pre>
<p>Structure d'une carte postale : <strong>salutation</strong> → <strong>lieu (Te escribo desde…)</strong> → <strong>activités</strong> → <strong>sentiment (te echo de menos)</strong> → <strong>clôture + signature</strong>.</p>`
  }
};
</script>
