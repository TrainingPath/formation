  title: "Le passé simple (indefinido) réguliers",
  subtitle: "Le temps du récit : des actions passées et terminées.",
  theory: `
<h3>1. À quoi sert l'indefinido</h3>
<p>Le <strong>pretérito indefinido</strong> (souvent appelé « passé simple » en français) raconte des actions <strong>passées et complètement terminées</strong>, coupées du présent. C'est le temps du récit et des faits datés. Là où le français hésite entre passé simple et passé composé, l'espagnol choisit l'indefinido dès que l'action est finie et située dans un passé révolu.</p>
<p>Ses <strong>marqueurs de temps</strong> typiques : <em>ayer</em> (hier), <em>anoche</em> (hier soir), <em>el año pasado</em> (l'an dernier), <em>la semana pasada</em> (la semaine dernière), <em>en 2010</em>, <em>hace dos días</em> (il y a deux jours).</p>
<pre class="pseudo">Ayer comí en casa.        -> Hier j'ai mangé à la maison.
El año pasado viajé a Perú. -> L'an dernier j'ai voyagé au Pérou.</pre>
<h3>2. Les terminaisons des verbes réguliers</h3>
<p>On ajoute les terminaisons au radical (le verbe sans -ar/-er/-ir). Attention : les verbes en <strong>-er</strong> et <strong>-ir</strong> partagent les mêmes terminaisons.</p>
<pre class="pseudo">              -AR (hablar)     -ER / -IR (comer / vivir)
yo            hablé            comí / viví
tú            hablaste         comiste / viviste
él/ella       habló            comió / vivió
nosotros      hablamos         comimos / vivimos
vosotros      hablasteis       comisteis / vivisteis
ellos/ellas   hablaron         comieron / vivieron</pre>
<h3>3. Les accents écrits, essentiels</h3>
<p>Deux formes portent un <strong>accent écrit</strong> obligatoire : la 1re personne du singulier (<em>hablé</em>, <em>comí</em>) et la 3e personne du singulier (<em>habló</em>, <em>comió</em>). L'accent change complètement le sens.</p>
<div class="warn">Sans accent, on change de personne et parfois de temps ! <em>hablo</em> = je parle (présent) mais <em>habló</em> = il/elle a parlé (passé). <em>hable</em> (subjonctif) vs <em>hablé</em> (passé). L'accent n'est pas décoratif.</div>
<h3>4. Petit piège : nosotros</h3>
<p>Pour les verbes en -ar et -ir, la forme <em>nosotros</em> de l'indefinido est <strong>identique au présent</strong> : <em>hablamos</em>, <em>vivimos</em>. C'est le contexte (les marqueurs de temps) qui indique s'il s'agit du présent ou du passé.</p>
<div class="tip">Compare avec le jour 1 : le <strong>perfecto</strong> (he comido) reste dans la sphère du présent ; l'<strong>indefinido</strong> (comí) referme la porte sur un passé daté. « Ayer » appelle l'indefinido, « hoy » le perfecto.</div>`,
  exercises: [
    { type: "input", q: "Ayer yo ___ (hablar) con Marta.", a: ["hablé"], ph: "1re pers.", exp: "hablar -> hablé, avec accent sur le é." },

    { type: "input", q: "Anoche ella ___ (comer) muy tarde.", a: ["comió"], ph: "3e pers. sing.", exp: "comer -> comió, accent obligatoire." },
    { type: "input", q: "La semana pasada tú ___ (vivir) en Sevilla.", a: ["viviste"], ph: "2e pers. sing.", exp: "vivir -> viviste (mêmes terminaisons que -er)." },
    { type: "input", q: "Hace dos días nosotros ___ (trabajar) mucho.", a: ["trabajamos"], ph: "1re pers. pluriel", exp: "trabajamos : identique au présent, c'est le contexte qui tranche." },
    { type: "input", q: "¿Qué ___ (comer, vosotros) ayer?", a: ["comisteis"], ph: "2e pers. pluriel", exp: "vosotros -> comisteis." },
    { type: "qcm", q: "Quel marqueur appelle l'indefinido ?", opts: ["hoy", "esta semana", "ayer", "todavía"], a: 2, exp: "ayer situe l'action dans un passé révolu." },
    { type: "qcm", q: "Comment dit-on « ils ont vécu » (indefinido) ?", opts: ["vivieron", "vivaron", "vivieron", "viviaron"], a: 0, exp: "-ieron pour les verbes en -ir : vivieron." },
    { type: "qcm", q: "Quelle forme signifie « il a parlé » ?", opts: ["hablo", "hablé", "habló", "hable"], a: 2, exp: "habló, avec accent sur le o final (3e personne)." },
    { type: "qcm", q: "Les verbes en -er et -ir à l'indefinido…", opts: ["ont des terminaisons différentes", "partagent les mêmes terminaisons", "n'existent pas", "se conjuguent avec haber"], a: 1, exp: "comí/viví, comiste/viviste… ce sont les mêmes terminaisons." },
    { type: "qcm", q: "« Comí » se traduit par :", opts: ["je mange", "je mangeais", "j'ai mangé / je mangeai", "j'aurai mangé"], a: 2, exp: "1re personne de l'indefinido de comer." },
    { type: "qcm", q: "Pourquoi « habló » et « hablo » sont-ils différents ?", opts: ["Aucune différence", "L'accent : hablo = présent, habló = passé", "Ce sont des synonymes", "habló n'existe pas"], a: 1, exp: "L'accent écrit distingue le présent du passé et la personne." },
    { type: "vf", q: "À l'indefinido, la 1re et la 3e personne du singulier des verbes réguliers portent un accent écrit.", a: true, exp: "Vrai : hablé / habló, comí / comió." },
    { type: "vf", q: "« Nosotros hablamos » peut signifier « nous parlons » OU « nous parlâmes » selon le contexte.", a: true, exp: "Vrai : la forme est identique au présent pour les verbes en -ar." },
    { type: "vf", q: "On emploie l'indefinido pour une action encore reliée à aujourd'hui.", a: false, exp: "Faux : l'indefinido sert aux actions terminées et détachées du présent." }
  ],
  final: {
    title: "Exercice final — Las vacaciones de Pablo",
    intro: `<p>Pablo raconte ses vacances de l'été dernier (indefinido) :</p>
<pre class="pseudo">El verano pasado viajé a Andalucía con mis amigos. Llegamos a Granada
el lunes y visitamos la Alhambra. Comimos tapas cada noche. El jueves
mi amigo Luis perdió su móvil, pero lo encontró al día siguiente.
Volvimos a casa el domingo, cansados pero contentos.</pre>`,
    questions: [

      { type: "input", q: "Complète : Nosotros ___ (visitar) la Alhambra.", a: ["visitamos"], ph: "1re pers. pluriel", exp: "visitamos (forme identique au présent, contexte passé)." },
      { type: "vf", q: "Luis perdió su móvil y no lo encontró.", a: false, exp: "Le texte dit « lo encontró al día siguiente » : il l'a retrouvé." },
      { type: "input", q: "Complète : Ellos ___ (volver, ici régulier -er) a casa el domingo.", a: ["volvieron"], ph: "3e pers. pluriel", exp: "Terminaison -ieron : volvieron." },
      { type: "qcm", q: "Pourquoi tout le récit est-il à l'indefinido ?", opts: ["Parce que ce sont des actions futures", "Parce que ce sont des actions passées, datées et terminées", "Parce qu'on parle du présent", "Par hasard"], a: 1, exp: "Récit d'événements finis situés dans un passé révolu." }
    ],
    solution: `<p>Toutes les actions sont datées (« el verano pasado », « el lunes », « el jueves »…) et achevées : l'indefinido s'impose.</p>
<pre class="pseudo">viajé, llegamos, visitamos, comimos, perdió, encontró, volvimos</pre>
<p>Note les accents des 3e personnes du singulier : <em>perdió</em>, <em>encontró</em>. Ce sont eux qui distinguent le passé du présent.</p>`
  }
};
