<script>

  title: "Révisions A2",

  theory: `
<h3>1. Les temps du passé</h3>
<p>Trois passés à ne pas confondre :</p>
<pre class="pseudo">Indefinido (action finie)  : Ayer comí paella.      = Hier j'ai mangé une paella.
Imperfecto (décor/habitude): Antes vivía en Madrid. = Avant je vivais à Madrid.
Perfecto (passé récent)    : Hoy he comido pronto.  = Aujourd'hui j'ai mangé tôt.</pre>
<div class="tip">Mots déclencheurs : <strong>ayer, el año pasado</strong> → indefinido ; <strong>antes, todos los días</strong> → imperfecto ; <strong>hoy, esta semana, ya</strong> → perfecto.</div>
<h3>2. Le futur et le conditionnel</h3>
<pre class="pseudo">Futur proche : Voy a viajar mañana.   = Je vais voyager demain.
Conditionnel : Me gustaría viajar.    = J'aimerais voyager.</pre>
<h3>3. Ser ou estar ?</h3>
<pre class="pseudo">SER  (identité, caractère, heure) : Soy español. Son las tres.
ESTAR (état, lieu, sentiment)     : Estoy cansado. Madrid está en España.</pre>
<div class="warn">Rappel piège : <em>ser</em> pour ce qui est permanent (nationalité, profession), <em>estar</em> pour l'état passager (fatigué, content) et la localisation.</div>
<h3>4. Gustar et les pronoms</h3>
<pre class="pseudo">Me gusta el café.       = J'aime le café. (singulier)
Me gustan los idiomas.  = J'aime les langues. (pluriel)
Me gusta viajar.        = J'aime voyager. (infinitif → singulier)</pre>
<h3>5. Les connecteurs et l'impératif</h3>
<pre class="pseudo">y (et), pero (mais), porque (parce que), así que (donc)
Impératif tú : habla, come, ven, haz, pon, ve…</pre>
<h3>6. Le vocabulaire des situations</h3>
<p>Souviens-toi des grands thèmes : <strong>le shopping</strong> (¿Cuánto cuesta?), <strong>le voyage</strong> (salir/llegar, reserva), <strong>le restaurant</strong> (de primero, la cuenta), <strong>la ville</strong> (hay, al lado de), <strong>la météo</strong> (hace sol, llueve). Chaque situation a ses phrases-clés : révise-les à voix haute.</p>`,

    { type: "input", q: "Complète (imperfecto, habitude) : « Antes ___ en un pueblo. » (vivir, yo)", a: ["vivía", "vivia"], ph: "verbe", exp: "Imperfecto : vivía (habitude passée)." },
    { type: "qcm", q: "« ___ español, de Madrid. » (ser ou estar ?)", opts: ["Estoy", "Soy", "Está", "Es"], a: 1, exp: "Nationalité/origine → ser : Soy español." },
    { type: "qcm", q: "« ___ cansado hoy. » (ser ou estar ?)", opts: ["Soy", "Estoy", "Es", "Está"], a: 1, exp: "État passager → estar : Estoy cansado." },

    { type: "qcm", q: "« Hoy he comido pronto. » Quel temps ?", opts: ["Indefinido", "Imperfecto", "Perfecto (passé récent, hoy)", "Futur"], a: 2, exp: "Hoy + he comido → pretérito perfecto." },
    { type: "vf", q: "Devant un infinitif, gustar reste au singulier (me gusta bailar).", a: true, exp: "Toujours singulier devant un verbe." },
    { type: "qcm", q: "Comprension : « Cuando era niño, jugaba al fútbol todos los días. » Quel sens ?", opts: ["Une action unique", "Une habitude dans l'enfance", "Le futur", "Un ordre"], a: 1, exp: "Era + jugaba (imperfecto) + todos los días = habitude." },
    { type: "qcm", q: "Comprension : « ¿Cuánto cuesta esta camiseta? — Quince euros. » De quelle situation s'agit-il ?", opts: ["Au restaurant", "Dans un magasin", "À la gare", "À l'hôtel"], a: 1, exp: "¿Cuánto cuesta? + camiseta = shopping." },
    { type: "input", q: "Complète : « El museo está ___ de la plaza. » (à côté)", a: ["al lado"], ph: "préposition", exp: "Al lado de = à côté de." },
    { type: "qcm", q: "Comprension : « Normalmente me levanto temprano, pero hoy me he levantado tarde. » Que s'est-il passé aujourd'hui ?", opts: ["Elle s'est levée tôt", "Elle s'est levée tard", "Elle n'a pas dormi", "Elle a travaillé"], a: 1, exp: "Hoy me he levantado tarde = aujourd'hui, réveil tardif (perfecto)." }

      { type: "qcm", q: "« El año pasado fui a Londres » est à quel temps ?", opts: ["Imperfecto", "Indefinido (action finie)", "Perfecto", "Futur"], a: 1, exp: "El año pasado + fui = indefinido." },
      { type: "input", q: "Où vivait-elle quand elle était étudiante ?", a: ["Madrid", "en Madrid"], ph: "ville", exp: "Cuando era estudiante, vivía en Madrid (imperfecto)." },
      { type: "qcm", q: "Que va-t-elle faire ce week-end ?", opts: ["Travailler", "Visiter sa famille", "Voyager à Londres", "Étudier"], a: 1, exp: "Voy a visitar a mi familia (futur proche)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je m'appelle Elena et je suis professeure. Je vis à Séville, une
ville magnifique du sud de l'Espagne. D'habitude je travaille le
matin et l'après-midi j'étudie l'anglais parce que j'aime voyager.
L'année dernière je suis allée à Londres et j'ai passé un super
moment. Quand j'étais étudiante, je vivais à Madrid, mais maintenant
je préfère le sud. Ce week-end je vais rendre visite à ma famille.
J'aimerais me reposer un peu.</pre>
<p>Ce texte réunit tout l'A2 : <strong>ser/estar</strong>, les <strong>trois passés</strong> (fui, vivía, pasé), le <strong>futur proche</strong> (voy a visitar), le <strong>conditionnel</strong> (me gustaría), <strong>gustar</strong> et les <strong>connecteurs</strong> (porque, pero). Relis-le en repérant chaque point de grammaire.</p>`
  }
