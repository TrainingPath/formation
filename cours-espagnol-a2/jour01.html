<script>
var DAY = {
  num: 1,
  title: "Le passé composé (pretérito perfecto)",
  subtitle: "Parler d'un passé récent, encore relié au présent.",
  theory: `
<h3>1. À quoi sert le pretérito perfecto</h3>
<p>Le <strong>pretérito perfecto</strong> est le passé le plus proche du présent. On l'emploie pour une action passée dont le résultat ou le lien avec « maintenant » est encore sensible. Il correspond très souvent au <strong>passé composé</strong> français (« j'ai mangé », « nous avons vu »). On le reconnaît à ses <strong>marqueurs de temps</strong> (les mots qui situent l'action) : <em>hoy</em> (aujourd'hui), <em>esta mañana</em> (ce matin), <em>esta semana</em> (cette semaine), <em>este año</em> (cette année), <em>ya</em> (déjà), <em>todavía no</em> (pas encore), <em>alguna vez</em> (une fois, déjà), <em>nunca</em> (jamais).</p>
<pre class="pseudo">Hoy he comido paella.          -> Aujourd'hui j'ai mangé de la paella.
¿Alguna vez has estado en Madrid?  -> As-tu déjà été à Madrid ?
Todavía no hemos terminado.    -> Nous n'avons pas encore fini.</pre>
<h3>2. Formation : haber + participe passé</h3>
<p>On assemble deux morceaux : l'<strong>auxiliaire</strong> <em>haber</em> conjugué au présent, suivi du <strong>participe passé</strong> (participio) du verbe.</p>
<pre class="pseudo">haber (présent)     traduction
he                  j'ai
has                 tu as
ha                  il / elle a
hemos               nous avons
habéis              vous avez
han                 ils / elles ont</pre>
<h3>3. Le participe passé régulier</h3>
<p>Le participe se forme sur le radical du verbe selon sa terminaison :</p>
<pre class="pseudo">verbes en -ar  ->  -ado    hablar  -> hablado (parlé)
verbes en -er  ->  -ido    comer   -> comido  (mangé)
verbes en -ir  ->  -ido    vivir   -> vivido  (vécu)</pre>
<h3>4. Participes irréguliers à connaître</h3>
<pre class="pseudo">hacer     -> hecho     (fait)
decir     -> dicho     (dit)
ver       -> visto     (vu)
escribir  -> escrito   (écrit)
poner     -> puesto    (mis)
volver    -> vuelto    (revenu)
abrir     -> abierto   (ouvert)
romper    -> roto      (cassé)
morir     -> muerto    (mort)</pre>
<div class="tip">Après <em>haber</em>, le participe est <strong>toujours invariable</strong> : il ne s'accorde jamais. On dit <em>ella ha comido</em>, <em>ellas han comido</em> : le participe reste <em>comido</em>. C'est plus simple qu'en français.</div>
<div class="warn">Ne confonds pas <em>haber</em> et <em>tener</em>. Pour dire « avoir » au sens de posséder, on utilise <em>tener</em> (<em>tengo un coche</em>). <em>Haber</em> sert uniquement à construire les temps composés.</div>`,
  exercises: [
    { type: "input", q: "Hoy yo ___ (hablar) con mi jefe.", a: ["he hablado"], ph: "he + participe", exp: "he (auxiliaire) + hablado (participe régulier de hablar)." },
    { type: "input", q: "¿___ (comer, tú) ya?", a: ["Has comido", "has comido"], ph: "has + participe", exp: "has + comido : le participe de comer est comido." },
    { type: "input", q: "Nosotros ___ (ver) esa película.", a: ["hemos visto"], ph: "hemos + participe", exp: "ver a un participe irrégulier : visto." },
    { type: "input", q: "Ella ___ (escribir) una carta.", a: ["ha escrito"], ph: "ha + participe", exp: "escribir -> escrito (irrégulier)." },
    { type: "input", q: "Ellos ___ (volver) a casa.", a: ["han vuelto"], ph: "han + participe", exp: "volver -> vuelto (irrégulier)." },
    { type: "input", q: "Le participe passé du verbe « hacer » est ___.", a: ["hecho"], ph: "participe", exp: "hacer -> hecho, l'un des irréguliers les plus fréquents." },
    { type: "qcm", q: "Quel auxiliaire sert à former le pretérito perfecto ?", opts: ["tener", "haber", "ser", "estar"], a: 1, exp: "Toujours haber conjugué au présent + participe." },
    { type: "qcm", q: "Quel marqueur de temps annonce typiquement le pretérito perfecto ?", opts: ["ayer", "el año pasado", "esta semana", "en 1990"], a: 2, exp: "esta semana relie l'action au présent ; les autres renvoient à un passé révolu (indefinido)." },
    { type: "qcm", q: "Comment dit-on « nous avons parlé » ?", opts: ["hemos hablado", "habéis hablado", "han hablado", "hemos hablar"], a: 0, exp: "hemos (nous avons) + hablado." },
    { type: "qcm", q: "Quel est le participe passé de « poner » ?", opts: ["ponido", "ponado", "puesto", "ponido"], a: 2, exp: "poner -> puesto (irrégulier)." },
    { type: "qcm", q: "Que signifie « Todavía no he terminado » ?", opts: ["Je n'ai jamais fini", "Je n'ai pas encore fini", "J'ai déjà fini", "Je finirai"], a: 1, exp: "todavía no = pas encore." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ella ha comida", "Ellas han comidas", "Ella ha comido", "Ella tiene comido"], a: 2, exp: "Le participe est invariable après haber : comido." },
    { type: "vf", q: "Après « haber », le participe passé s'accorde en genre et en nombre avec le sujet.", a: false, exp: "Faux : il reste invariable (han comido, pas « han comidos »)." },
    { type: "vf", q: "« Hoy » est un marqueur qui appelle le pretérito perfecto.", a: true, exp: "Vrai : aujourd'hui appartient à la période encore en cours." },
    { type: "vf", q: "Pour dire « j'ai une voiture » (possession), on utilise « he ».", a: false, exp: "Faux : possession = tener (tengo un coche). Haber sert seulement aux temps composés." }
  ],
  final: {
    title: "Exercice final — El día de Ana",
    intro: `<p>Lis ce petit récit au pretérito perfecto, puis réponds :</p>
<pre class="pseudo">Hoy Ana ha tenido un día muy activo. Esta mañana ha ido al gimnasio
y ha corrido media hora. Después ha escrito tres correos a sus clientes.
Al mediodía ha comido con una amiga en un restaurante nuevo.
Todavía no ha llamado a su madre, pero ya ha comprado el regalo.</pre>`,
    questions: [
      { type: "qcm", q: "¿Qué ha hecho Ana esta mañana?", opts: ["Ha dormido", "Ha ido al gimnasio", "Ha viajado", "Ha cocinado"], a: 1, exp: "« Esta mañana ha ido al gimnasio »." },
      { type: "input", q: "Complète : Ana ___ (escribir) tres correos.", a: ["ha escrito"], ph: "ha + participe", exp: "escribir -> escrito." },
      { type: "vf", q: "Ana ya ha llamado a su madre.", a: false, exp: "Le texte dit « todavía no ha llamado » : pas encore." },
      { type: "qcm", q: "¿Con quién ha comido Ana?", opts: ["Con su jefe", "Sola", "Con una amiga", "Con su madre"], a: 2, exp: "« ha comido con una amiga »." },
      { type: "input", q: "Complète : Ana ya ___ (comprar) el regalo.", a: ["ha comprado"], ph: "ha + participe", exp: "comprar -> comprado (régulier)." }
    ],
    solution: `<p>Le récit enchaîne des actions du jour même, toutes reliées au présent : c'est pourquoi tout est au pretérito perfecto (<em>hoy</em>, <em>esta mañana</em>, <em>ya</em>, <em>todavía no</em>).</p>
<pre class="pseudo">ha tenido, ha ido, ha corrido, ha escrito, ha comido, ha llamado, ha comprado</pre>
<p>Remarque les participes irréguliers <em>hecho</em> et <em>escrito</em>, et l'invariabilité totale du participe après <em>haber</em>.</p>`
  }
};
</script>
