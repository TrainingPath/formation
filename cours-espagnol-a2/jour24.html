<script>
var DAY = {
  num: 24,
  title: "L'impératif affirmatif",
  subtitle: "Donner un ordre, un conseil ou une instruction en espagnol.",
  theory: `
<h3>1. À quoi sert l'impératif ?</h3>
<p>L'<strong>impératif</strong> sert à donner un ordre, un conseil, une consigne ou une invitation : <em>¡Habla!</em> (Parle !), <em>¡Escuchad!</em> (Écoutez !). Aujourd'hui on voit l'impératif <strong>affirmatif</strong> (dire de faire quelque chose).</p>
<h3>2. L'impératif avec tú (tu)</h3>
<p>Pour les verbes réguliers, l'impératif « tú » est identique à la 3e personne du singulier du présent : on enlève le -s du « tú » présent.</p>
<pre class="pseudo">HABLAR → habla   = Parle !     (tú hablas → habla)
COMER  → come    = Mange !     (tú comes → come)
ESCRIBIR → escribe = Écris !   (tú escribes → escribe)</pre>
<h3>3. Impératifs irréguliers courants (tú)</h3>
<p>Huit verbes très fréquents sont irréguliers à l'impératif tú. À apprendre par cœur :</p>
<pre class="pseudo">decir → di      (dis)        salir → sal   (sors)
hacer → haz     (fais)       tener → ten   (aie / tiens)
ir    → ve      (va)         venir → ven   (viens)
poner → pon     (mets)       ser   → sé    (sois)</pre>
<div class="warn">Ne confonds pas <strong>ve</strong> (va !, de ir) et <strong>ven</strong> (viens !, de venir). Exemple : <em>¡Ven aquí!</em> (Viens ici !) contre <em>¡Ve a casa!</em> (Va à la maison !).</div>
<h3>4. L'impératif avec usted (vous de politesse)</h3>
<p>Pour vouvoyer, on prend la base du présent et on inverse la voyelle finale (les verbes en -ar prennent -e, ceux en -er/-ir prennent -a) :</p>
<pre class="pseudo">HABLAR → hable (usted)   = Parlez.
COMER  → coma (usted)    = Mangez.
ESCRIBIR → escriba (usted) = Écrivez.</pre>
<h3>5. La place des pronoms</h3>
<p>À l'impératif affirmatif, le pronom se <strong>colle à la fin</strong> du verbe (un seul mot) :</p>
<pre class="pseudo">Dime la verdad.    = Dis-moi la vérité.  (di + me)
Levántate.         = Lève-toi.          (levanta + te)
Escúchame.         = Écoute-moi.        (escucha + me)</pre>
<div class="tip">Quand on colle un pronom, un accent écrit apparaît souvent pour garder l'accent tonique : escucha → escúchame, levanta → levántate.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'impératif « tú » de HABLAR ?", opts: ["hablas", "habla", "hable", "hablad"], a: 1, exp: "Habla = parle (tú)." },
    { type: "input", q: "Impératif « tú » de COMER : ¡___! (mange)", a: ["come"], ph: "verbe", exp: "Come = mange." },
    { type: "qcm", q: "L'impératif « tú » de HACER est :", opts: ["hace", "haces", "haz", "hazte"], a: 2, exp: "Hacer → haz (irrégulier)." },
    { type: "input", q: "Impératif « tú » de DECIR : ¡___! (dis)", a: ["di"], ph: "verbe", exp: "Decir → di." },
    { type: "qcm", q: "« ¡Ven aquí! » vient de quel verbe ?", opts: ["ir", "venir", "ver", "tener"], a: 1, exp: "Ven = viens (venir)." },
    { type: "qcm", q: "L'impératif « tú » de IR est :", opts: ["ve", "ven", "va", "ir"], a: 0, exp: "Ir → ve (va !)." },
    { type: "vf", q: "« sé » est l'impératif « tú » de SER (sois !).", a: true, exp: "Ser → sé : ¡Sé amable! (Sois aimable !)." },
    { type: "input", q: "Impératif « usted » de HABLAR : ___ (parlez).", a: ["hable"], ph: "verbe", exp: "Usted → hable." },
    { type: "qcm", q: "Où se place le pronom à l'impératif affirmatif ?", opts: ["avant le verbe", "collé à la fin du verbe", "au début de la phrase", "il disparaît"], a: 1, exp: "Il se colle à la fin : dime, escúchame." },
    { type: "input", q: "Colle le pronom : « escucha » + « me » = ___ (écoute-moi).", a: ["escúchame", "escuchame"], ph: "un mot", exp: "Escúchame (accent pour garder l'accent tonique)." },
    { type: "qcm", q: "« Levántate » signifie :", opts: ["Assieds-toi", "Lève-toi", "Couche-toi", "Repose-toi"], a: 1, exp: "Levántate = lève-toi (levantar + te)." },
    { type: "qcm", q: "Comprension : Une recette dit « Pon el agua a hervir y añade la pasta. » Que faut-il faire ?", opts: ["Boire l'eau", "Mettre l'eau à bouillir et ajouter les pâtes", "Éteindre le feu", "Attendre"], a: 1, exp: "Pon = mets (poner) ; añade = ajoute (añadir)." },
    { type: "input", q: "Impératif « tú » de SALIR : ¡___! (sors)", a: ["sal"], ph: "verbe", exp: "Salir → sal." },
    { type: "qcm", q: "Comprension : « Ven a mi casa y trae el libro. » Que demande-t-on ?", opts: ["De partir et laisser le livre", "De venir chez moi et apporter le livre", "De lire le livre", "De rester à la maison"], a: 1, exp: "Ven (viens) + trae (apporte)." },
    { type: "vf", q: "L'impératif « tú » de PONER est « pon ».", a: true, exp: "Poner → pon : ¡Pon la mesa! (Mets la table !)." }
  ],
  final: {
    title: "Exercice final — Instrucciones",
    intro: `<p>Lis ces instructions données à un ami (tú) pour aller à la gare :</p>
<pre class="pseudo">Escucha bien: sal de casa y ve todo recto.
Gira a la derecha en la segunda calle.
Cruza la plaza y sigue hasta el semáforo.
La estación está a la izquierda. No es difícil.
Si tienes dudas, llámame por teléfono.</pre>`,
    questions: [
      { type: "qcm", q: "Par quoi commencent les instructions ?", opts: ["Reste à la maison", "Sors de chez toi et va tout droit", "Prends le bus", "Attends"], a: 1, exp: "Sal de casa y ve todo recto." },
      { type: "input", q: "Quel impératif signifie « tourne » ? (un mot du texte)", a: ["gira"], ph: "verbe", exp: "Gira a la derecha = tourne à droite." },
      { type: "qcm", q: "Où se trouve la gare ?", opts: ["À droite", "À gauche", "Tout droit", "En face"], a: 1, exp: "La estación está a la izquierda." },
      { type: "qcm", q: "Que faire en cas de doute ?", opts: ["Rentrer", "Appeler par téléphone", "Attendre", "Demander à un policier"], a: 1, exp: "Llámame por teléfono = appelle-moi." },
      { type: "vf", q: "« ve » ici est l'impératif de « ir » (va).", a: true, exp: "Ve todo recto = va tout droit (ir → ve)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Écoute bien : sors de chez toi et va tout droit.
Tourne à droite dans la deuxième rue.
Traverse la place et continue jusqu'au feu.
La gare est à gauche. Ce n'est pas difficile.
Si tu as des doutes, appelle-moi au téléphone.</pre>
<p>Repère les impératifs : <strong>escucha, sal, ve, gira, cruza, sigue, llámame</strong>. Souviens-toi des huit irréguliers (di, haz, ve, pon, sal, ten, ven, sé) et de la règle des pronoms collés (llámame).</p>`
  }
};
</script>
