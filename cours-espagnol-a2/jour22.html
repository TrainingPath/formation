<script>
var DAY = {
  num: 22,
  title: "Raconter une histoire au passé",
  subtitle: "Utiliser le passé simple et l'imparfait pour raconter des événements.",
  theory: `
<h3>1. Deux passés pour raconter</h3>
<p>Pour raconter, l'espagnol utilise surtout deux temps du passé : le <strong>pretérito indefinido</strong> (passé simple, pour les actions terminées) et le <strong>pretérito imperfecto</strong> (imparfait, pour les descriptions et habitudes). C'est un peu comme en français.</p>
<h3>2. Le pretérito indefinido (actions terminées)</h3>
<p>Il exprime une action ponctuelle et achevée dans le passé. Terminaisons des verbes réguliers :</p>
<pre class="pseudo">HABLAR (parler)        COMER (manger)       VIVIR (vivre)
hablé   = je parlai    comí    = je mangeai  viví   = je vécus
hablaste               comiste              viviste
habló                  comió                vivió
hablamos               comimos              vivimos
hablasteis             comisteis            vivisteis
hablaron               comieron             vivieron</pre>
<p>Exemple : <em>Ayer comí en un restaurante</em> (Hier j'ai mangé au restaurant).</p>
<div class="warn">Verbes irréguliers fréquents : <strong>ir/ser</strong> → fui, fuiste, fue… ; <strong>tener</strong> → tuve, tuviste, tuvo… ; <strong>hacer</strong> → hice, hiciste, hizo… ; <strong>estar</strong> → estuve, estuviste, estuvo…</div>
<h3>3. Le pretérito imperfecto (description, habitude)</h3>
<p>Il décrit le décor, une habitude ou une action en cours dans le passé. Terminaisons :</p>
<pre class="pseudo">HABLAR                 COMER / VIVIR
hablaba  = je parlais  comía  = je mangeais
hablabas               comías
hablaba                comía
hablábamos             comíamos
hablabais              comíais
hablaban               comían</pre>
<p>Trois irréguliers seulement : <strong>ser</strong> → era, eras, era… ; <strong>ir</strong> → iba, ibas, iba… ; <strong>ver</strong> → veía, veías, veía…</p>
<h3>4. Quand choisir l'un ou l'autre ?</h3>
<pre class="pseudo">Imperfecto (le décor)          Indefinido (l'action)
Era de noche y llovía.         De repente, sonó el teléfono.
= C'était la nuit, il pleuvait. = Soudain, le téléphone sonna.</pre>
<div class="tip">Astuce : l'imparfait pose le décor (« il faisait, il y avait, c'était »), le passé simple fait avancer l'histoire (« puis, soudain, ce jour-là »). Mots typiques : <strong>ayer, de repente, un día</strong> → indefinido ; <strong>siempre, antes, todos los días</strong> → imperfecto.</div>`,
  exercises: [
    { type: "qcm", q: "Quel temps exprime une action terminée et ponctuelle ?", opts: ["el imperfecto", "el indefinido", "el presente", "el futuro"], a: 1, exp: "Le pretérito indefinido = passé simple, action achevée." },
    { type: "input", q: "Conjugue HABLAR au indefinido, yo : ___ (je parlai).", a: ["hablé"], ph: "verbe", exp: "Yo hablé." },
    { type: "qcm", q: "Quelle phrase décrit le décor (imperfecto) ?", opts: ["Ayer comí paella", "Era de noche y llovía", "De repente sonó el teléfono", "Un día fui a Madrid"], a: 1, exp: "Era de noche y llovía = description → imperfecto." },
    { type: "input", q: "Conjugue COMER au indefinido, yo : ___ (je mangeai).", a: ["comí"], ph: "verbe", exp: "Yo comí." },
    { type: "qcm", q: "Le verbe IR/SER au indefinido (yo) donne :", opts: ["iba", "fui", "era", "voy"], a: 1, exp: "Fui (indefinido de ir et ser)." },
    { type: "vf", q: "L'imperfecto sert à décrire une habitude passée (« todos los días »).", a: true, exp: "Vrai : habitude et description → imperfecto." },
    { type: "input", q: "Conjugue HABLAR au imperfecto, yo : ___ (je parlais).", a: ["hablaba"], ph: "verbe", exp: "Yo hablaba." },
    { type: "qcm", q: "« De repente » (soudain) annonce plutôt :", opts: ["un imperfecto", "un indefinido", "un présent", "un futur"], a: 1, exp: "De repente introduit une action ponctuelle → indefinido." },
    { type: "input", q: "Conjugue SER au imperfecto, yo : ___ (j'étais).", a: ["era"], ph: "verbe", exp: "Era (irrégulier)." },
    { type: "qcm", q: "« Todos los días iba al colegio. » Quel temps et quel sens ?", opts: ["Indefinido, action unique", "Imperfecto, habitude passée", "Présent", "Futur"], a: 1, exp: "Iba (imperfecto) + todos los días = habitude." },
    { type: "vf", q: "« Tener » au indefinido (yo) est « tuve ».", a: true, exp: "Tener → tuve, tuviste, tuvo…" },
    { type: "qcm", q: "Comprension : « Cuando era pequeño, vivía en un pueblo. » Que raconte cette phrase ?", opts: ["Une action unique hier", "Une situation habituelle du passé", "Le futur", "Le présent"], a: 1, exp: "Era + vivía (imperfecto) = situation durable dans l'enfance." },
    { type: "qcm", q: "Comprension : « Ayer fui al cine y vi una película. » Quand cela s'est-il passé ?", opts: ["Tous les jours", "Hier (action ponctuelle)", "Demain", "Maintenant"], a: 1, exp: "Ayer fui / vi = indefinido, action terminée hier." },
    { type: "input", q: "Complète au bon passé : « Cuando ___ niño, jugaba mucho. » (SER, yo)", a: ["era"], ph: "verbe", exp: "Era niño (description) → imperfecto." },
    { type: "qcm", q: "Comprension : « Hacía sol cuando llegamos a la playa. » Analyse :", opts: ["Deux actions ponctuelles", "Décor (hacía sol) + action (llegamos)", "Deux descriptions", "Le futur"], a: 1, exp: "Hacía sol = décor (imperfecto) ; llegamos = action (indefinido)." }
  ],
  final: {
    title: "Exercice final — Un día en la playa",
    intro: `<p>Lis ce petit récit au passé :</p>
<pre class="pseudo">El verano pasado fui a la playa con mi familia.
Hacía mucho calor y el cielo estaba azul.
Por la mañana nadamos y jugamos en la arena.
Mi hermano comió un helado enorme.
De repente, empezó a llover y volvimos a casa.
Fue un día muy divertido.</pre>`,
    questions: [
      { type: "qcm", q: "Quand la personne est-elle allée à la plage ?", opts: ["Hier", "L'été dernier", "Demain", "Ce matin"], a: 1, exp: "El verano pasado = l'été dernier." },
      { type: "qcm", q: "« Hacía mucho calor » est à quel temps et pourquoi ?", opts: ["Indefinido, action", "Imperfecto, description du décor", "Présent", "Futur"], a: 1, exp: "Description du temps → imperfecto." },
      { type: "input", q: "Que mangea le frère ? (un mot)", a: ["helado", "un helado"], ph: "aliment", exp: "Comió un helado = il mangea une glace." },
      { type: "qcm", q: "Que s'est-il passé soudainement ?", opts: ["Il a fait beau", "Il a commencé à pleuvoir", "Ils ont mangé", "Ils ont dormi"], a: 1, exp: "De repente, empezó a llover." },
      { type: "vf", q: "La journée a été agréable.", a: true, exp: "Fue un día muy divertido = une journée très amusante." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">L'été dernier je suis allé(e) à la plage avec ma famille.
Il faisait très chaud et le ciel était bleu.
Le matin nous avons nagé et joué dans le sable.
Mon frère a mangé une énorme glace.
Soudain, il a commencé à pleuvoir et nous sommes rentrés à la maison.
Ce fut une journée très amusante.</pre>
<p>Observe l'alternance : <strong>imperfecto</strong> pour le décor (hacía calor, estaba azul) et <strong>indefinido</strong> pour les actions qui font avancer le récit (fui, nadamos, empezó, volvimos).</p>`
  }
};
</script>
