  title: "Le conditionnel simple",
  subtitle: "Exprimer un souhait, une hypothèse ou une demande polie en espagnol.",
  theory: `
<h3>1. À quoi sert le conditionnel ?</h3>
<p>Le <strong>conditionnel</strong> (el condicional) exprime : un <strong>souhait</strong> (<em>Me gustaría viajar</em> = j'aimerais voyager), une <strong>demande polie</strong> (<em>¿Podrías ayudarme?</em> = pourrais-tu m'aider ?), ou une <strong>hypothèse</strong> (<em>Yo, en tu lugar, estudiaría</em> = moi, à ta place, j'étudierais).</p>
<h3>2. La formation (très régulière !)</h3>
<p>Bonne nouvelle : on part de l'<strong>infinitif complet</strong> et on ajoute les mêmes terminaisons pour TOUS les verbes (-ar, -er, -ir) :</p>
<pre class="pseudo">infinitif + -ía, -ías, -ía, -íamos, -íais, -ían

HABLAR                COMER                 VIVIR
hablaría  = je parlerais   comería   = je mangerais   viviría
hablarías             comerías              vivirías
hablaría              comería               viviría
hablaríamos           comeríamos            viviríamos
hablaríais            comeríais             viviríais
hablarían             comerían              vivirían</pre>
<div class="tip">Astuce : les terminaisons du conditionnel sont exactement celles de l'imperfecto de -er/-ir (-ía, -ías…), mais ajoutées à l'infinitif entier, pas à un radical raccourci.</div>
<h3>3. Les irréguliers (radical modifié)</h3>
<p>Quelques verbes changent leur radical (le même qu'au futur), mais gardent les terminaisons -ía :</p>
<pre class="pseudo">tener  → tendría   (j'aurais)
poder  → podría    (je pourrais)
hacer  → haría     (je ferais)
decir  → diría     (je dirais)
poner  → pondría   (je mettrais)
salir  → saldría   (je sortirais)
venir  → vendría   (je viendrais)
querer → querría   (je voudrais)</pre>
<div class="warn">Attention à <strong>haría</strong> (hacer) et <strong>diría</strong> (decir) : le radical est raccourci (har-, dir-), mais la terminaison reste -ía.</div>
<h3>4. Formules polies très utiles</h3>
<pre class="pseudo">Me gustaría un café.        = J'aimerais un café.
¿Podrías pasarme la sal?    = Pourrais-tu me passer le sel ?
¿Podría usted ayudarme?     = Pourriez-vous m'aider ?
Yo que tú, descansaría.     = À ta place, je me reposerais.</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quelle base forme-t-on le conditionnel régulier ?", opts: ["le radical seul", "l'infinitif complet", "le participe", "la 1re personne"], a: 1, exp: "Infinitif complet + -ía, -ías…" },
    { type: "input", q: "Conditionnel de HABLAR, yo : ___ (je parlerais).", a: ["hablaría", "hablaria"], ph: "verbe", exp: "Hablar + ía = hablaría." },
    { type: "qcm", q: "Quelles terminaisons prend le conditionnel ?", opts: ["-é, -ás, -á…", "-ía, -ías, -ía…", "-aba, -abas…", "-o, -es, -e…"], a: 1, exp: "-ía, -ías, -ía, -íamos, -íais, -ían." },
    { type: "input", q: "Conditionnel de COMER, yo : ___ (je mangerais).", a: ["comería", "comeria"], ph: "verbe", exp: "Comer + ía = comería." },
    { type: "qcm", q: "Le conditionnel de TENER (yo) est :", opts: ["tenería", "tendría", "tendaría", "tenía"], a: 1, exp: "Radical irrégulier tendr- + ía = tendría." },
    { type: "input", q: "Conditionnel de PODER, yo : ___ (je pourrais).", a: ["podría", "podria"], ph: "verbe", exp: "Podr- + ía = podría." },
    { type: "qcm", q: "« Me gustaría » exprime :", opts: ["un ordre", "un souhait (j'aimerais)", "le passé", "une obligation"], a: 1, exp: "Me gustaría = j'aimerais (souhait)." },
    { type: "input", q: "Conditionnel de HACER, yo : ___ (je ferais).", a: ["haría", "haria"], ph: "verbe", exp: "Radical har- + ía = haría." },
    { type: "qcm", q: "« ¿Podrías pasarme la sal? » est :", opts: ["un ordre brutal", "une demande polie", "une question au passé", "une hypothèse impossible"], a: 1, exp: "Le conditionnel adoucit la demande." },
    { type: "vf", q: "Le conditionnel de DECIR (yo) est « diría ».", a: true, exp: "Radical dir- + ía = diría." },
    { type: "input", q: "Conditionnel de VIVIR, nosotros : ___ (nous vivrions).", a: ["viviríamos", "viviriamos"], ph: "verbe", exp: "Vivir + íamos = viviríamos." },
    { type: "qcm", q: "Comprension : « Me gustaría vivir en España algún día. » Qu'exprime la personne ?", opts: ["Un souvenir", "Un souhait futur", "Une obligation", "Un ordre"], a: 1, exp: "Me gustaría = souhait ; algún día = un jour." },
    { type: "qcm", q: "Comprension : « ¿Podría usted decirme la hora? » Quel registre ?", opts: ["Familier et direct", "Poli (vouvoiement)", "Passé", "Impératif"], a: 1, exp: "Podría usted = formule polie de politesse." },
    { type: "input", q: "Complète poliment : « ¿___ ayudarme, por favor? » (pourrais-tu, tú)", a: ["podrías", "podrias"], ph: "verbe", exp: "Podrías = pourrais-tu." },
    { type: "qcm", q: "Comprension : « Yo que tú, estudiaría más. » Que fait la personne ?", opts: ["Elle raconte le passé", "Elle donne un conseil hypothétique", "Elle pose une question", "Elle donne un ordre"], a: 1, exp: "Yo que tú… = à ta place… (conseil au conditionnel)." }
  ],
  final: {
    title: "Exercice final — Mis sueños",
    intro: `<p>Lis ce texte où une personne parle de ses rêves :</p>
<pre class="pseudo">Si tuviera tiempo, viajaría por todo el mundo.
Me gustaría visitar Japón y aprender japonés.
Viviría cerca del mar y tendría un perro.
Por las mañanas, correría en la playa.
¿Podrías imaginar una vida así? Sería perfecta.</pre>`,
    questions: [
      { type: "qcm", q: "Que ferait la personne si elle avait le temps ?", opts: ["Travailler plus", "Voyager dans le monde entier", "Dormir", "Étudier"], a: 1, exp: "Viajaría por todo el mundo." },
      { type: "qcm", q: "Quel pays aimerait-elle visiter ?", opts: ["La Chine", "Le Japon", "Le Brésil", "L'Italie"], a: 1, exp: "Me gustaría visitar Japón." },
      { type: "input", q: "Quel animal aurait-elle ? (un mot)", a: ["perro", "un perro"], ph: "animal", exp: "Tendría un perro = elle aurait un chien." },
      { type: "qcm", q: "« correría en la playa » signifie :", opts: ["elle court sur la plage", "elle courrait sur la plage", "elle a couru", "elle veut courir"], a: 1, exp: "Correría = elle courrait (conditionnel)." },
      { type: "vf", q: "Cette vie serait parfaite selon la personne.", a: true, exp: "Sería perfecta = elle serait parfaite." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Si j'avais le temps, je voyagerais dans le monde entier.
J'aimerais visiter le Japon et apprendre le japonais.
Je vivrais près de la mer et j'aurais un chien.
Le matin, je courrais sur la plage.
Pourrais-tu imaginer une vie comme ça ? Elle serait parfaite.</pre>
<p>Repère les conditionnels : <strong>viajaría, gustaría, viviría, tendría, correría, podrías, sería</strong>. La recette : infinitif (ou radical irrégulier) + terminaisons -ía.</p>`
  }
};
