<script>
var DAY = {
  num: 30,
  title: "Bilan A2 : conversation et mini-entretien",
  subtitle: "Mettre en pratique tout le niveau A2 dans une vraie conversation.",
  theory: `
<h3>1. Bravo, tu arrives au bout !</h3>
<p>Ce dernier jour rassemble tes acquis dans une situation concrète : une <strong>conversation</strong> et un <strong>mini-entretien</strong>. À l'A2, tu peux te présenter, parler de ton quotidien, de ton passé et de tes projets. Voyons comment enchaîner tout cela naturellement.</p>
<h3>2. Les questions d'un entretien simple (una entrevista)</h3>
<pre class="pseudo">¿Cómo te llamas?              = Comment t'appelles-tu ?
¿De dónde eres?               = D'où viens-tu ?
¿A qué te dedicas?            = Que fais-tu dans la vie ?
¿Qué te gusta hacer?          = Qu'aimes-tu faire ?
¿Por qué estudias español?    = Pourquoi étudies-tu l'espagnol ?
¿Qué hiciste el fin de semana? = Qu'as-tu fait le week-end ?
¿Qué vas a hacer este verano? = Que vas-tu faire cet été ?</pre>
<h3>3. Un mini-entretien modèle</h3>
<pre class="pseudo">— ¡Hola! ¿Cómo te llamas?
— Me llamo Laura, encantada.
— ¿De dónde eres, Laura?
— Soy de Francia, pero ahora vivo en Barcelona.
— ¿A qué te dedicas?
— Soy enfermera. Trabajo en un hospital.
— ¿Y por qué estudias español?
— Porque me gusta mucho y quiero trabajar aquí.
— ¿Qué vas a hacer este verano?
— Voy a viajar por Andalucía. ¡Me encanta viajar!</pre>
<div class="tip">Astuce pour bien répondre : reprends une partie de la question dans ta réponse. À « ¿De dónde eres? », réponds « Soy de… ». Cela structure ton discours et te laisse le temps de réfléchir.</div>
<h3>4. Les petits mots qui aident à parler</h3>
<pre class="pseudo">Bueno…        = Bon… / Eh bien…    (pour commencer)
Pues…         = Alors… / Ben…      (pour gagner du temps)
A ver…        = Voyons…            (pour réfléchir)
Es que…       = C'est que…         (pour expliquer)
Por ejemplo…  = Par exemple…       (pour illustrer)</pre>
<div class="warn">Si tu ne comprends pas, ne bloque pas ! Dis simplement : <em>¿Puede repetir, por favor?</em> (Pouvez-vous répéter ?) ou <em>¿Qué significa…?</em> (Que signifie… ?). Demander est une compétence, pas une faiblesse.</div>
<h3>5. Rester poli et naturel</h3>
<p>Termine toujours une conversation poliment : <strong>Ha sido un placer</strong> (ce fut un plaisir), <strong>Encantado/a de conocerte</strong> (ravi de te connaître), <strong>Hasta pronto</strong> (à bientôt). Avec ces outils, tu es prêt(e) pour de vraies conversations en espagnol !</p>`,
  exercises: [
    { type: "qcm", q: "« ¿A qué te dedicas? » demande :", opts: ["ton âge", "ta profession / ce que tu fais dans la vie", "ton adresse", "ton nom"], a: 1, exp: "Dedicarse a = s'occuper de, ici la profession." },
    { type: "input", q: "Réponds : « ¿De dónde eres? — ___ de Francia. » (je suis)", a: ["Soy"], ph: "verbe", exp: "Soy de Francia (ser + origine)." },
    { type: "qcm", q: "Pour dire « ravi(e) de te connaître » :", opts: ["Hasta luego", "Encantado de conocerte", "Buenos días", "Lo siento"], a: 1, exp: "Encantado/a de conocerte = ravi(e) de te connaître." },
    { type: "qcm", q: "Que dire si tu n'as pas compris ?", opts: ["Adiós", "¿Puede repetir, por favor?", "De nada", "Vale"], a: 1, exp: "¿Puede repetir? = pouvez-vous répéter ?" },
    { type: "input", q: "Complète : « ¿Cómo te ___? — Me llamo Ana. » (appeler)", a: ["llamas"], ph: "verbe", exp: "¿Cómo te llamas? = comment t'appelles-tu ?" },
    { type: "qcm", q: "« ¿Qué vas a hacer este verano? » porte sur :", opts: ["le passé", "le présent", "un projet futur", "une habitude"], a: 2, exp: "Vas a hacer = futur proche → projet." },
    { type: "vf", q: "« Pues… » et « A ver… » servent à gagner du temps pour réfléchir.", a: true, exp: "Ce sont des mots de remplissage utiles à l'oral." },
    { type: "input", q: "Réponds à « ¿A qué te dedicas? » : « ___ enfermera. » (je suis)", a: ["Soy"], ph: "verbe", exp: "Soy enfermera (ser + profession)." },
    { type: "qcm", q: "« ¿Qué hiciste el fin de semana? » demande une réponse au :", opts: ["présent", "passé (indefinido)", "futur", "conditionnel"], a: 1, exp: "Hiciste (indefinido) → réponse au passé." },
    { type: "qcm", q: "Pour terminer poliment une conversation :", opts: ["Ha sido un placer", "¿Cuánto cuesta?", "Tengo hambre", "No sé"], a: 0, exp: "Ha sido un placer = ce fut un plaisir." },
    { type: "vf", q: "Reprendre une partie de la question dans sa réponse aide à structurer son discours.", a: true, exp: "À « ¿De dónde eres? » → « Soy de… » : technique très efficace." },
    { type: "qcm", q: "Comprension : « Soy de Francia, pero ahora vivo en Barcelona. » Que sait-on de Laura ?", opts: ["Elle est espagnole", "Elle est française et vit à Barcelone", "Elle habite en France", "Elle est en vacances"], a: 1, exp: "Origine (Francia) + résidence actuelle (Barcelona)." },
    { type: "qcm", q: "Comprension : « ¿Por qué estudias español? — Porque quiero trabajar aquí. » Quelle est la raison ?", opts: ["Pour voyager", "Pour travailler ici", "Pour ses études", "Pour ses amis"], a: 1, exp: "Porque quiero trabajar aquí = pour travailler ici." },
    { type: "input", q: "Complète : « ¿Puede ___, por favor? » (répéter)", a: ["repetir"], ph: "verbe", exp: "¿Puede repetir? = pouvez-vous répéter ?" },
    { type: "qcm", q: "Comprension : « Voy a viajar por Andalucía. ¡Me encanta viajar! » Qu'exprime la personne ?", opts: ["Un souvenir", "Un projet et un goût", "Une obligation", "Un regret"], a: 1, exp: "Voy a viajar (projet) + me encanta viajar (goût)." }
  ],
  final: {
    title: "Exercice final — La entrevista",
    intro: `<p>Lis ce mini-entretien complet et réponds aux questions :</p>
<pre class="pseudo">— Buenos días. ¿Cómo te llamas?
— Me llamo Marco, encantado.
— ¿De dónde eres, Marco?
— Soy de Italia, pero vivo en Madrid desde hace dos años.
— ¿A qué te dedicas?
— Soy cocinero en un restaurante italiano.
— ¿Qué te gusta hacer en tu tiempo libre?
— Me gusta leer y jugar al fútbol con mis amigos.
— ¿Qué vas a hacer este verano?
— Voy a volver a Italia para visitar a mi familia.
— Muchas gracias, Marco. Ha sido un placer.</pre>`,
    questions: [
      { type: "qcm", q: "D'où vient Marco ?", opts: ["D'Espagne", "d'Italie", "de France", "du Portugal"], a: 1, exp: "Soy de Italia." },
      { type: "input", q: "Depuis combien d'années vit-il à Madrid ?", a: ["2", "dos", "dos años"], ph: "nombre", exp: "Vivo en Madrid desde hace dos años." },
      { type: "qcm", q: "Quelle est sa profession ?", opts: ["Serveur", "Cuisinier", "Professeur", "Médecin"], a: 1, exp: "Soy cocinero (cuisinier)." },
      { type: "qcm", q: "Que fait-il pendant son temps libre ?", opts: ["Il cuisine", "Il lit et joue au football", "Il voyage", "Il dort"], a: 1, exp: "Me gusta leer y jugar al fútbol." },
      { type: "vf", q: "Cet été, Marco va retourner en Italie voir sa famille.", a: true, exp: "Voy a volver a Italia para visitar a mi familia." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">— Bonjour. Comment t'appelles-tu ?
— Je m'appelle Marco, enchanté.
— D'où viens-tu, Marco ?
— Je suis italien, mais je vis à Madrid depuis deux ans.
— Que fais-tu dans la vie ?
— Je suis cuisinier dans un restaurant italien.
— Qu'aimes-tu faire pendant ton temps libre ?
— J'aime lire et jouer au football avec mes amis.
— Que vas-tu faire cet été ?
— Je vais retourner en Italie pour rendre visite à ma famille.
— Merci beaucoup, Marco. Ce fut un plaisir.</pre>
<p>Tu maîtrises maintenant l'entretien A2 : te présenter (<strong>ser, vivir</strong>), parler de ta vie (<strong>gustar, trabajar</strong>), du passé et de tes projets (<strong>voy a…</strong>), et rester poli. ¡Enhorabuena, has terminado el nivel A2! (Félicitations, tu as terminé le niveau A2 !)</p>`
  }
};
</script>
