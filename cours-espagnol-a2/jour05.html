<script>
var DAY = {
  num: 5,
  title: "Indefinido ou imperfecto ?",
  subtitle: "Le choix qui fait la différence entre raconter et décrire.",
  theory: `
<h3>1. Deux passés, deux rôles</h3>
<p>C'est LE point délicat de l'espagnol. Les deux temps parlent du passé, mais ils ne font pas le même travail :</p>
<pre class="pseudo">INDEFINIDO (comí, fui, hizo)      IMPERFECTO (comía, iba, hacía)
= l'action, ce qui S'EST PASSÉ    = le décor, comment C'ÉTAIT
= ponctuel, terminé, daté          = habitude, description, en cours
= fait avancer le récit            = arrête le temps pour décrire</pre>
<p>Image utile : dans un film, l'<strong>indefinido</strong> ce sont les <em>actions</em> qui font avancer l'histoire ; l'<strong>imperfecto</strong> c'est le <em>décor</em> figé à l'arrière-plan.</p>
<h3>2. Les emplois de chacun</h3>
<pre class="pseudo">IMPERFECTO pour :
- décrire (lieux, personnes, temps) : La casa era grande.
- habitudes passées : Todos los días iba al parque.
- l'heure, l'âge, la météo : Eran las cinco. Tenía 8 años.
- action en cours (arrière-plan) : Yo dormía cuando...

INDEFINIDO pour :
- action ponctuelle et terminée : Ayer comí paella.
- succession d'actions : Entré, saludé y me senté.
- action datée : En 2010 me mudé a Madrid.</pre>
<h3>3. Quand les deux se rencontrent</h3>
<p>Très souvent, une phrase mélange les deux : l'<strong>imperfecto pose le décor</strong> (une action longue, en cours) et l'<strong>indefinido apporte l'événement</strong> qui survient (l'action courte qui interrompt).</p>
<pre class="pseudo">Yo dormía cuando sonó el teléfono.
   imperfecto (décor)      indefinido (interruption)
-> Je dormais quand le téléphone sonna.

Mientras cocinaba, se cortó el dedo.
   imperfecto (en cours)  indefinido (événement soudain)
-> Pendant qu'il cuisinait, il se coupa le doigt.</pre>
<div class="tip">Repère les mots-clés : <em>mientras</em> (pendant que) et <em>cuando era…</em> annoncent souvent l'imperfecto ; <em>de repente</em> (soudain), <em>ayer</em>, <em>en ese momento</em> annoncent l'indefinido.</div>
<h3>4. Le sens change parfois</h3>
<p>Certains verbes changent de nuance selon le temps choisi :</p>
<pre class="pseudo">Sabía la respuesta.  -> Je savais la réponse. (état)
Supe la verdad.      -> J'appris la vérité. (moment précis)

Conocía a Ana.       -> Je connaissais Ana. (état)
Conocí a Ana.        -> Je fis la connaissance d'Ana. (rencontre)

No quería ir.        -> Je ne voulais pas y aller. (attitude)
No quise ir.         -> Je refusai d'y aller. (décision ponctuelle)</pre>
<div class="warn">Piège fréquent des francophones : traduire mécaniquement. « Il faisait beau quand je suis sorti » = <em>Hacía</em> (décor, imperfecto) <em>buen tiempo cuando salí</em> (action, indefinido). Ne mets pas tout au même temps !</div>`,
  exercises: [
    { type: "qcm", q: "« Il était trois heures » se dit :", opts: ["Fueron las tres", "Eran las tres", "Fue las tres", "Era las tres"], a: 1, exp: "L'heure dans le passé est toujours à l'imperfecto : Eran las tres." },
    { type: "input", q: "Décor : Cuando yo ___ (ser) joven, viajaba mucho.", a: ["era"], ph: "imperfecto", exp: "Description d'une période : era (imperfecto)." },
    { type: "input", q: "Événement soudain : Yo dormía cuando ___ (sonar) el despertador.", a: ["sonó"], ph: "indefinido", exp: "Action ponctuelle qui interrompt : sonó (indefinido)." },
    { type: "qcm", q: "« Todos los días iba al gimnasio » exprime :", opts: ["Une action unique", "Une habitude passée", "Le futur", "Un ordre"], a: 1, exp: "iba + todos los días = habitude -> imperfecto." },
    { type: "input", q: "Habitude : De niña, ella ___ (comer) mucho chocolate.", a: ["comía"], ph: "imperfecto", exp: "Habitude d'enfance : comía." },
    { type: "input", q: "Action datée : En 2015 nosotros ___ (mudarse : nos ___) a Madrid.", a: ["nos mudamos", "mudamos"], ph: "indefinido", exp: "Action ponctuelle datée : nos mudamos." },
    { type: "qcm", q: "Dans « Mientras cocinaba, se cortó el dedo », quel temps est « cocinaba » ?", opts: ["Indefinido (l'événement)", "Imperfecto (le décor, action en cours)", "Présent", "Futur"], a: 1, exp: "Action longue en arrière-plan : imperfecto." },
    { type: "qcm", q: "« Conocí a Ana en 2019 » signifie :", opts: ["Je connaissais Ana", "Je fis la connaissance d'Ana", "Je connais Ana", "Je connaîtrai Ana"], a: 1, exp: "conocer à l'indefinido = rencontrer pour la première fois." },
    { type: "qcm", q: "Complète : « ___ frío y ___ » (il faisait froid et il pleuvait, décor).", opts: ["Hizo / llovió", "Hacía / llovía", "Hace / llueve", "Hará / lloverá"], a: 1, exp: "Description météo dans le passé : imperfecto (hacía, llovía)." },
    { type: "qcm", q: "Quelle phrase mélange correctement décor + événement ?", opts: ["Dormí cuando sonaba el teléfono", "Dormía cuando sonó el teléfono", "Dormía cuando sonaba el teléfono", "Dormí cuando sonó el teléfono"], a: 1, exp: "Décor (dormía, imperfecto) + interruption (sonó, indefinido)." },
    { type: "qcm", q: "« Sabía la respuesta » veut dire :", opts: ["J'appris la réponse", "Je savais la réponse (état)", "Je saurai la réponse", "Je demandai la réponse"], a: 1, exp: "saber à l'imperfecto = état de connaissance (je savais)." },
    { type: "input", q: "Description physique : Mi abuelo ___ (tener) una barba blanca.", a: ["tenía"], ph: "imperfecto", exp: "Description : tenía (imperfecto)." },
    { type: "vf", q: "L'imperfecto sert à poser le décor, l'indefinido à raconter l'action qui survient.", a: true, exp: "Vrai : décor vs événement." },
    { type: "vf", q: "« Ayer estudié tres horas » doit être à l'imperfecto.", a: false, exp: "Faux : action datée et terminée -> indefinido (estudié)." },
    { type: "vf", q: "« Conocía » et « conocí » ont exactement le même sens.", a: false, exp: "Faux : conocía = je connaissais (état) ; conocí = je rencontrai (moment)." }
  ],
  final: {
    title: "Exercice final — El accidente",
    intro: `<p>Repère le décor (imperfecto) et les événements (indefinido) :</p>
<pre class="pseudo">Era una tarde de invierno y hacía mucho frío. Yo caminaba por la calle
y pensaba en mis cosas. De repente, un coche frenó bruscamente y
un ciclista se cayó. La gente corrió a ayudarlo. Por suerte, no fue nada grave.</pre>`,
    questions: [
      { type: "qcm", q: "¿Por qué « era » y « hacía » están en imperfecto?", opts: ["Son acciones puntuales", "Describen el decorado (momento y tiempo)", "Son órdenes", "Son futuros"], a: 1, exp: "Décor : moment (era una tarde) et météo (hacía frío)." },
      { type: "input", q: "Événement soudain : De repente un coche ___ (frenar).", a: ["frenó"], ph: "indefinido", exp: "Action ponctuelle -> frenó." },
      { type: "qcm", q: "« Yo caminaba y pensaba » exprime :", opts: ["Deux actions ponctuelles", "Le décor : ce que je faisais à ce moment", "Le futur", "Une habitude quotidienne"], a: 1, exp: "Actions en cours servant d'arrière-plan : imperfecto." },
      { type: "input", q: "Réaction : La gente ___ (correr) a ayudarlo.", a: ["corrió"], ph: "indefinido", exp: "Événement ponctuel -> corrió." },
      { type: "vf", q: "« No fue nada grave » está en indefinido porque es un hecho concreto y cerrado.", a: true, exp: "Vrai : bilan ponctuel de l'événement -> indefinido." }
    ],
    solution: `<p>La structure du récit est limpide :</p>
<pre class="pseudo">DÉCOR (imperfecto) : era, hacía, caminaba, pensaba
ÉVÉNEMENTS (indefinido) : frenó, se cayó, corrió, fue</pre>
<p>L'imperfecto plante l'arrière-plan immobile, puis l'indefinido déclenche l'action. Maîtriser cette alternance, c'est raconter comme un hispanophone.</p>`
  }
};
</script>
