<script>
var DAY = {
  num: 14,
  title: "Por et para",
  subtitle: "Deux mots pour « pour » : la cause et le but.",
  theory: `
<h3>1. Le grand casse-tête</h3>
<p><em>Por</em> et <em>para</em> se traduisent souvent tous les deux par « pour » en français, mais ils ne veulent pas dire la même chose. L'idée générale à retenir :</p>
<pre class="pseudo">POR  = la CAUSE, l'origine, le passage, l'échange   (« à cause de », « par »)
PARA = le BUT, la destination, le but final          (« afin de », « destiné à »)</pre>
<p>Image mentale : <strong>por</strong> regarde en arrière (pourquoi ? d'où vient l'action) ; <strong>para</strong> regarde en avant (vers quel objectif ?).</p>
<h3>2. Les emplois de PARA (le but)</h3>
<pre class="pseudo">BUT / OBJECTIF   : Estudio para aprender.      (j'étudie pour apprendre)
DESTINATAIRE     : Este regalo es para ti.     (ce cadeau est pour toi)
DESTINATION      : Salgo para Madrid.          (je pars pour Madrid)
ÉCHÉANCE / DÉLAI : La tarea es para el lunes.  (le devoir est pour lundi)
OPINION          : Para mí, es una buena idea. (pour moi / selon moi)</pre>
<div class="tip">Repère clé : <em>para + infinitif</em> = « pour + infinitif » (dans le but de). <em>Vengo para hablar contigo</em> = je viens pour te parler.</div>
<h3>3. Les emplois de POR (la cause, le moyen…)</h3>
<pre class="pseudo">CAUSE / MOTIF    : Lo hago por amor.           (je le fais par amour)
                   Gracias por tu ayuda.       (merci pour ton aide)
LIEU DE PASSAGE  : Paseo por el parque.        (je me promène dans/à travers le parc)
DURÉE            : Estudié por dos horas.      (j'ai étudié pendant deux heures)
ÉCHANGE / PRIX   : Lo compré por diez euros.   (je l'ai acheté pour dix euros)
MOYEN            : Hablamos por teléfono.      (on parle par téléphone)
« par » (fréquence): dos veces por semana.     (deux fois par semaine)</pre>
<div class="warn">Piège fréquent : « merci pour » = <em>gracias POR</em> (jamais para). Et « pour + infinitif but » = <em>para</em> : <em>Estudio para aprobar</em> (pour réussir), pas « por aprobar ».</div>
<h3>4. Le test rapide</h3>
<p>Pose-toi la question : est-ce une <strong>raison / cause</strong> (pourquoi ? à cause de quoi ?) ou un <strong>but / objectif</strong> (pour quoi faire ? dans quel but ?) ?</p>
<pre class="pseudo">Lo hago por ti.    -> à cause de toi / en ta faveur (motif)   = POR
Lo hago para ti.   -> destiné à toi (le résultat est pour toi) = PARA
Estudio por mi futuro.  -> motivé par mon avenir     = POR
Estudio para mi futuro. -> dans le but d'un avenir    = PARA</pre>
<h3>5. Expressions figées à mémoriser</h3>
<pre class="pseudo">por favor       -> s'il vous plaît
por eso         -> c'est pourquoi
por ejemplo     -> par exemple
por fin         -> enfin
por supuesto    -> bien sûr
para siempre    -> pour toujours
estar para      -> être sur le point de</pre>`,
  exercises: [
    { type: "qcm", q: "« J'étudie pour apprendre » (but) se dit :", opts: ["Estudio por aprender", "Estudio para aprender", "Estudio a aprender", "Estudio de aprender"], a: 1, exp: "But + infinitif = para : para aprender." },
    { type: "input", q: "Complète (merci pour) : Gracias ___ tu ayuda.", a: ["por"], ph: "por/para", exp: "« Gracias por » : toujours por (motif/cause)." },
    { type: "input", q: "Complète (destinataire) : Este regalo es ___ ti.", a: ["para"], ph: "por/para", exp: "Destinataire = para : para ti." },
    { type: "qcm", q: "« Paseo por el parque » exprime :", opts: ["le but", "un lieu de passage (à travers le parc)", "le destinataire", "le prix"], a: 1, exp: "por = à travers / dans (lieu de passage)." },
    { type: "input", q: "Complète (par téléphone) : Hablamos ___ teléfono.", a: ["por"], ph: "por/para", exp: "Moyen = por : por teléfono." },
    { type: "input", q: "Complète (échéance) : La tarea es ___ el lunes.", a: ["para"], ph: "por/para", exp: "Délai / échéance = para : para el lunes." },
    { type: "qcm", q: "« Lo compré por diez euros » exprime :", opts: ["le but", "un échange / prix", "le destinataire", "l'échéance"], a: 1, exp: "por = échange, prix : pour dix euros." },
    { type: "input", q: "Complète (opinion) : ___ mí, es una buena idea.", a: ["Para", "para"], ph: "por/para", exp: "Opinion (« selon moi ») = para mí." },
    { type: "qcm", q: "« Salgo para Madrid » exprime :", opts: ["la cause", "la destination", "la durée", "le moyen"], a: 1, exp: "Destination = para : je pars vers Madrid." },
    { type: "input", q: "Complète (durée) : Estudié ___ dos horas.", a: ["por"], ph: "por/para", exp: "Durée = por : pendant deux heures." },
    { type: "qcm", q: "Compréhension : « Lo hago por ti » signifie plutôt :", opts: ["C'est un cadeau destiné à toi", "Je le fais à cause de toi / en ta faveur", "Je pars pour toi", "Je viens pour te parler"], a: 1, exp: "por ti = par toi, à cause de toi (motif)." },
    { type: "qcm", q: "Compréhension : « Necesito el informe para mañana » veut dire :", opts: ["J'ai le rapport depuis hier", "J'ai besoin du rapport pour demain (échéance)", "Je passe par le bureau demain", "Le rapport coûte demain"], a: 1, exp: "para + date = échéance." },
    { type: "vf", q: "« Gracias para tu ayuda » est correct.", a: false, exp: "Faux : on dit « gracias por tu ayuda »." },
    { type: "vf", q: "Pour exprimer un but avec un infinitif, on utilise « para » : para aprender.", a: true, exp: "Vrai : para + infinitif = dans le but de." },
    { type: "vf", q: "« Por » peut exprimer la durée, le moyen, la cause et le prix.", a: true, exp: "Vrai : por dos horas, por teléfono, por amor, por diez euros." }
  ],
  final: {
    title: "Exercice final — El viaje de negocios",
    intro: `<p>Un court texte qui mélange por et para :</p>
<pre class="pseudo">Mañana salgo para Barcelona por trabajo. Voy a viajar por avión y
estaré allí por tres días. Necesito preparar una presentación para el
jueves. La hago para mis clientes y, para mí, es muy importante.
Gracias por escucharme; te llamaré por teléfono cuando llegue.</pre>`,
    questions: [
      { type: "input", q: "Complète (destination) : Salgo ___ Barcelona.", a: ["para"], ph: "por/para", exp: "Destination = para." },
      { type: "input", q: "Complète (motif) : Salgo para Barcelona ___ trabajo.", a: ["por"], ph: "por/para", exp: "Cause/motif = por trabajo." },
      { type: "qcm", q: "« estaré allí por tres días » exprime :", opts: ["l'échéance", "la durée", "la destination", "le but"], a: 1, exp: "por + durée : pendant trois jours." },
      { type: "input", q: "Complète (échéance) : Necesito la presentación ___ el jueves.", a: ["para"], ph: "por/para", exp: "para + date = échéance." },
      { type: "qcm", q: "« La hago para mis clientes » signifie :", opts: ["à cause de mes clients", "destinée à mes clients", "par mes clients", "pendant mes clients"], a: 1, exp: "para + destinataire : pour (destinée à) mes clients." }
    ],
    solution: `<p>Le texte oppose systématiquement les deux prépositions :</p>
<pre class="pseudo">PARA (but/destination/échéance) : para Barcelona, para el jueves, para mis clientes, para mí
POR (cause/moyen/durée)         : por trabajo, por avión, por tres días, por teléfono, gracias por</pre>
<p>La règle d'or : por regarde la cause et le moyen (en arrière) ; para regarde le but et la destination (en avant).</p>`
  }
};
</script>
