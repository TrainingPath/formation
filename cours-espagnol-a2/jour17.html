<script>
var DAY = {
  num: 17,
  title: "Voyager : gare, aéroport, hôtel",
  subtitle: "Le vocabulaire et les phrases utiles pour se déplacer et se loger.",
  theory: `
<h3>1. À la gare et à l'aéroport</h3>
<p>Le vocabulaire de base du voyage :</p>
<pre class="pseudo">el tren        = le train          el avión     = l'avion
la estación    = la gare           el aeropuerto = l'aéroport
el billete     = le billet         la maleta    = la valise
el andén       = le quai           la puerta    = la porte (embarquement)
el vuelo       = le vol            el equipaje  = les bagages</pre>
<p>Un <strong>billete de ida</strong> = un aller simple ; un <strong>billete de ida y vuelta</strong> = un aller-retour.</p>
<h3>2. Acheter un billet et demander un horaire</h3>
<pre class="pseudo">Quería un billete para Madrid.   = Je voudrais un billet pour Madrid.
¿A qué hora sale el tren?        = À quelle heure part le train ?
¿A qué hora llega?               = À quelle heure arrive-t-il ?
¿De qué andén sale?             = De quel quai part-il ?
El tren sale a las nueve.        = Le train part à neuf heures.</pre>
<div class="tip">Deux verbes essentiels : <strong>salir</strong> (partir, sortir) et <strong>llegar</strong> (arriver). <em>El avión llega a las diez</em> = l'avion arrive à dix heures.</div>
<h3>3. À l'hôtel</h3>
<pre class="pseudo">la habitación       = la chambre
una habitación doble = une chambre double
una habitación individual = une chambre simple
la reserva          = la réservation
la llave            = la clé
el desayuno         = le petit-déjeuner</pre>
<p>Phrases utiles à la réception (la recepción) :</p>
<pre class="pseudo">Tengo una reserva a nombre de García.  = J'ai une réservation au nom de García.
¿Tiene una habitación libre?           = Avez-vous une chambre libre ?
¿El desayuno está incluido?            = Le petit-déjeuner est-il inclus ?
¿A qué hora es el check-out?           = À quelle heure est le départ ?</pre>
<div class="warn">Ne confonds pas <strong>salir</strong> (partir) et <strong>llegar</strong> (arriver). Le panneau <em>salidas</em> = départs ; <em>llegadas</em> = arrivées.</div>
<h3>4. Demander son chemin</h3>
<pre class="pseudo">¿Dónde está la estación?     = Où est la gare ?
Está a la derecha.           = C'est à droite.
Está a la izquierda.         = C'est à gauche.
Siga todo recto.             = Continuez tout droit.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « la gare » ?", opts: ["el aeropuerto", "la estación", "el andén", "la maleta"], a: 1, exp: "La estación = la gare. El aeropuerto = l'aéroport." },
    { type: "qcm", q: "Un « billete de ida y vuelta » est :", opts: ["un aller simple", "un aller-retour", "un billet gratuit", "un billet de bus"], a: 1, exp: "Ida y vuelta = aller-retour ; ida seul = aller simple." },
    { type: "input", q: "Complète : « ¿A qué hora ___ el tren? » (partir)", a: ["sale"], ph: "verbe", exp: "Salir → sale : à quelle heure part le train." },
    { type: "qcm", q: "Le verbe « llegar » signifie :", opts: ["partir", "arriver", "acheter", "réserver"], a: 1, exp: "Llegar = arriver ; salir = partir." },
    { type: "vf", q: "« la habitación doble » est une chambre pour deux personnes.", a: true, exp: "Doble = double, pour deux personnes." },
    { type: "qcm", q: "À l'hôtel, comment demande-t-on la clé ?", opts: ["la maleta", "la llave", "la puerta", "el billete"], a: 1, exp: "La llave = la clé." },
    { type: "input", q: "Complète : « Tengo una ___ a nombre de García. » (réservation)", a: ["reserva"], ph: "nom", exp: "La reserva = la réservation." },
    { type: "qcm", q: "« ¿El desayuno está incluido? » demande si :", opts: ["la chambre est libre", "le petit-déjeuner est inclus", "il y a le wifi", "on peut payer par carte"], a: 1, exp: "El desayuno = le petit-déjeuner ; incluido = inclus." },
    { type: "qcm", q: "Sur un panneau d'aéroport, « llegadas » signifie :", opts: ["départs", "arrivées", "bagages", "sorties"], a: 1, exp: "Llegadas = arrivées ; salidas = départs." },
    { type: "input", q: "Complète : « Siga todo ___ » (tout droit)", a: ["recto"], ph: "direction", exp: "Todo recto = tout droit." },
    { type: "qcm", q: "« Está a la izquierda » veut dire :", opts: ["c'est à droite", "c'est à gauche", "c'est tout droit", "c'est loin"], a: 1, exp: "A la izquierda = à gauche ; a la derecha = à droite." },
    { type: "qcm", q: "Comprension : « El vuelo a Barcelona sale de la puerta 12. » Où faut-il aller ?", opts: ["Au quai 12", "À la porte 12", "À la chambre 12", "Au guichet 12"], a: 1, exp: "La puerta 12 = la porte d'embarquement 12 (avion)." },
    { type: "vf", q: "Comprension : « El tren sale a las nueve y llega a las once. » Le voyage dure deux heures.", a: true, exp: "De 9h (nueve) à 11h (once) = deux heures." },
    { type: "qcm", q: "Comprension : « Quería una habitación individual para dos noches. » Que réserve la personne ?", opts: ["Une chambre double, une nuit", "Une chambre simple, deux nuits", "Une chambre double, deux nuits", "Un billet de train"], a: 1, exp: "Individual = simple ; dos noches = deux nuits." },
    { type: "input", q: "Complète : « ¿De qué ___ sale el tren? » (quai)", a: ["andén"], ph: "lieu", exp: "El andén = le quai." }
  ],
  final: {
    title: "Exercice final — En la recepción del hotel",
    intro: `<p>Lis ce dialogue à la réception d'un hôtel :</p>
<pre class="pseudo">Recepcionista: Buenas tardes. ¿En qué puedo ayudarle?
Turista: Hola, tengo una reserva a nombre de López.
Recepcionista: Sí, una habitación doble para tres noches.
Turista: ¿El desayuno está incluido?
Recepcionista: Sí, de siete a diez. Aquí tiene la llave, habitación 204.
Turista: Gracias. ¿A qué hora es el check-out?
Recepcionista: A las doce del mediodía.</pre>`,
    questions: [
      { type: "qcm", q: "Au nom de qui est la réservation ?", opts: ["García", "López", "Martín", "Ruiz"], a: 1, exp: "A nombre de López." },
      { type: "qcm", q: "Quel type de chambre est réservé ?", opts: ["Simple, deux nuits", "Double, trois nuits", "Double, une nuit", "Simple, trois nuits"], a: 1, exp: "Una habitación doble para tres noches." },
      { type: "vf", q: "Le petit-déjeuner est inclus.", a: true, exp: "Sí, de siete a diez : oui, de 7h à 10h." },
      { type: "input", q: "Quel est le numéro de la chambre ?", a: ["204"], ph: "numéro", exp: "Habitación 204." },
      { type: "qcm", q: "À quelle heure est le check-out ?", opts: ["À 10h", "À 11h", "À midi (12h)", "À 7h"], a: 2, exp: "A las doce del mediodía = à midi." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Réceptionniste : Bonsoir. Que puis-je faire pour vous ?
Touriste : Bonjour, j'ai une réservation au nom de López.
Réceptionniste : Oui, une chambre double pour trois nuits.
Touriste : Le petit-déjeuner est-il inclus ?
Réceptionniste : Oui, de 7h à 10h. Voici la clé, chambre 204.
Touriste : Merci. À quelle heure est le départ ?
Réceptionniste : À midi.</pre>
<p>Les mots-clés du voyage : <strong>reserva</strong>, <strong>habitación</strong>, <strong>llave</strong>, et les verbes <strong>salir</strong> / <strong>llegar</strong>.</p>`
  }
};
</script>
