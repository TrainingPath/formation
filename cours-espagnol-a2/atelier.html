<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — Espagnol A2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var ATELIER = {
  prefix: "at-es-a2",
  titre: "🇪🇸 Atelier — Espagnol A2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour consolider le niveau A2.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"En la recepción del hotel", perso:"Claire (turista francesa) y Manuel (recepcionista)", lignes:[
      {qui:"Claire", txt:"Buenas tardes. Tengo una reserva a nombre de Claire Dubois.", fr:"Bonjour. J'ai une réservation au nom de Claire Dubois."},
      {qui:"Manuel", txt:"Buenas tardes, señora. Un momento, por favor... Sí, aquí está: una habitación doble para tres noches.", fr:"Bonjour, madame. Un instant, s'il vous plaît... Oui, la voici : une chambre double pour trois nuits."},
      {qui:"Claire", txt:"Exacto. Reservé por internet la semana pasada.", fr:"Exactement. J'ai réservé sur internet la semaine dernière."},
      {qui:"Manuel", txt:"Perfecto. ¿Me deja su pasaporte, por favor? Es para rellenar la ficha.", fr:"Parfait. Vous me laissez votre passeport, s'il vous plaît ? C'est pour remplir la fiche."},
      {qui:"Claire", txt:"Aquí lo tiene. ¿El desayuno está incluido?", fr:"Le voici. Le petit-déjeuner est-il compris ?"},
      {qui:"Manuel", txt:"Sí, se sirve de siete a diez en el comedor de la planta baja.", fr:"Oui, il est servi de sept à dix heures dans la salle à manger du rez-de-chaussée."},
      {qui:"Claire", txt:"Muy bien. ¿Y hay wifi en las habitaciones?", fr:"Très bien. Et y a-t-il du wifi dans les chambres ?"},
      {qui:"Manuel", txt:"Claro. La contraseña está escrita en esta tarjeta. Se la doy ahora mismo.", fr:"Bien sûr. Le mot de passe est écrit sur cette carte. Je vous la donne tout de suite."},
      {qui:"Claire", txt:"Gracias. ¿Puede subir la maleta a la habitación? Pesa mucho.", fr:"Merci. Pouvez-vous monter la valise à la chambre ? Elle est très lourde."},
      {qui:"Manuel", txt:"Por supuesto. Suba usted en el ascensor, es la habitación 304. ¡Que disfrute de su estancia!", fr:"Bien sûr. Montez dans l'ascenseur, c'est la chambre 304. Profitez bien de votre séjour !"}
    ]},
    { num:"2", titre:"En el restaurante", perso:"Claire, Thomas (su marido) y el camarero", lignes:[
      {qui:"Camarero", txt:"Buenas noches. ¿Han reservado mesa?", fr:"Bonsoir. Avez-vous réservé une table ?"},
      {qui:"Thomas", txt:"No, no hemos reservado. ¿Tiene una mesa para dos?", fr:"Non, nous n'avons pas réservé. Avez-vous une table pour deux ?"},
      {qui:"Camarero", txt:"Sí, síganme. Esta mesa junto a la ventana está libre. Aquí tienen la carta.", fr:"Oui, suivez-moi. Cette table près de la fenêtre est libre. Voici la carte."},
      {qui:"Claire", txt:"Gracias. ¿Cuál es el plato del día?", fr:"Merci. Quel est le plat du jour ?"},
      {qui:"Camarero", txt:"Hoy tenemos paella de marisco y cordero asado. Los dos están muy buenos.", fr:"Aujourd'hui nous avons une paella aux fruits de mer et de l'agneau rôti. Les deux sont très bons."},
      {qui:"Claire", txt:"Para mí la paella, por favor. Pero soy alérgica a los cacahuetes.", fr:"Pour moi la paella, s'il vous plaît. Mais je suis allergique aux cacahuètes."},
      {qui:"Camarero", txt:"No se preocupe, la paella no lleva. ¿Y para el señor?", fr:"Ne vous inquiétez pas, la paella n'en contient pas. Et pour monsieur ?"},
      {qui:"Thomas", txt:"Yo quisiera el cordero, poco hecho. Y una botella de vino tinto de la casa.", fr:"Je voudrais l'agneau, saignant. Et une bouteille de vin rouge maison."},
      {qui:"Camarero", txt:"Muy bien. ¿Van a tomar postre después?", fr:"Très bien. Prendrez-vous un dessert ensuite ?"},
      {qui:"Thomas", txt:"Ya veremos. Tráiganos primero el agua, por favor. Y luego la cuenta, todo junto.", fr:"On verra. Apportez-nous d'abord l'eau, s'il vous plaît. Et ensuite l'addition, tout ensemble."}
    ]},
    { num:"3", titre:"En el consultorio del médico", perso:"Claire y la doctora Ramos", lignes:[
      {qui:"Doctora", txt:"Buenos días, siéntese. ¿Qué le pasa?", fr:"Bonjour, asseyez-vous. Qu'est-ce qui vous arrive ?"},
      {qui:"Claire", txt:"Buenos días, doctora. Me duele mucho la garganta desde hace dos días.", fr:"Bonjour, docteur. J'ai très mal à la gorge depuis deux jours."},
      {qui:"Doctora", txt:"¿Ha tenido fiebre?", fr:"Avez-vous eu de la fièvre ?"},
      {qui:"Claire", txt:"Sí, anoche tenía treinta y ocho y medio. Además tosía sin parar.", fr:"Oui, hier soir j'avais trente-huit et demi. En plus je toussais sans arrêt."},
      {qui:"Doctora", txt:"Abra la boca, por favor. Diga aaah... Tiene la garganta muy roja.", fr:"Ouvrez la bouche, s'il vous plaît. Dites aaah... Vous avez la gorge très rouge."},
      {qui:"Claire", txt:"¿Es grave, doctora?", fr:"Est-ce grave, docteur ?"},
      {qui:"Doctora", txt:"No, es una faringitis. No es nada grave, pero debe descansar.", fr:"Non, c'est une pharyngite. Ce n'est pas grave, mais vous devez vous reposer."},
      {qui:"Claire", txt:"¿Me va a recetar antibióticos?", fr:"Allez-vous me prescrire des antibiotiques ?"},
      {qui:"Doctora", txt:"No hace falta. Le receto un jarabe. Tómelo tres veces al día después de las comidas.", fr:"Ce n'est pas nécessaire. Je vous prescris un sirop. Prenez-le trois fois par jour après les repas."},
      {qui:"Claire", txt:"De acuerdo. Muchas gracias, doctora. ¿Cuánto le debo?", fr:"D'accord. Merci beaucoup, docteur. Combien je vous dois ?"}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Lisez les dialogues, puis dites si chaque affirmation est vraie ou fausse.", exercices:[
      {type:"vf", q:"Claire tiene una reserva para tres noches.", a:true, exp:"Manuel confirme : une chambre double pour trois nuits."},
      {type:"vf", q:"Claire reservó la habitación por teléfono.", a:false, exp:"Faux : elle dit « Reservé por internet la semana pasada »."},
      {type:"vf", q:"El desayuno se sirve de siete a diez.", a:true, exp:"Manuel le précise : « de siete a diez en el comedor »."},
      {type:"vf", q:"La habitación de Claire es la 403.", a:false, exp:"Faux : c'est la chambre 304."},
      {type:"vf", q:"Thomas y Claire han reservado mesa en el restaurante.", a:false, exp:"Faux : « No, no hemos reservado »."},
      {type:"vf", q:"Claire es alérgica a los cacahuetes.", a:true, exp:"Elle le dit au serveur avant de commander."},
      {type:"vf", q:"Thomas pide el cordero poco hecho.", a:true, exp:"« Yo quisiera el cordero, poco hecho »."},
      {type:"vf", q:"A Claire le duele la cabeza.", a:false, exp:"Faux : c'est la gorge (« me duele la garganta »)."},
      {type:"vf", q:"La doctora le receta antibióticos a Claire.", a:false, exp:"Faux : elle prescrit un sirop, pas d'antibiotiques."},
      {type:"vf", q:"Claire tuvo fiebre la noche anterior.", a:true, exp:"Elle avait 38,5 la veille au soir."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la bonne réponse selon les dialogues.", exercices:[
      {type:"qcm", q:"¿Qué tipo de habitación ha reservado Claire?", opts:["Una individual","Una doble","Una suite","Una triple"], a:1, exp:"« una habitación doble para tres noches »."},
      {type:"qcm", q:"¿Qué pide Manuel para rellenar la ficha?", opts:["La tarjeta de crédito","El pasaporte","El carné de conducir","Un justificante"], a:1, exp:"« ¿Me deja su pasaporte? Es para rellenar la ficha »."},
      {type:"qcm", q:"¿Dónde se sirve el desayuno?", opts:["En la habitación","En la terraza","En el comedor de la planta baja","En la cafetería de al lado"], a:2, exp:"Manuel indique la salle à manger du rez-de-chaussée."},
      {type:"qcm", q:"¿Dónde está la contraseña del wifi?", opts:["En la puerta","En una tarjeta","En el televisor","En el ascensor"], a:1, exp:"« La contraseña está escrita en esta tarjeta »."},
      {type:"qcm", q:"¿Dónde se sientan Claire y Thomas en el restaurante?", opts:["En la terraza","Junto a la ventana","En la barra","Al fondo"], a:1, exp:"« Esta mesa junto a la ventana está libre »."},
      {type:"qcm", q:"¿Cuáles son los platos del día?", opts:["Paella y cordero","Tortilla y gazpacho","Pescado y ensalada","Sopa y pollo"], a:0, exp:"« paella de marisco y cordero asado »."},
      {type:"qcm", q:"¿Qué bebida pide Thomas?", opts:["Cerveza","Vino blanco","Vino tinto de la casa","Agua con gas"], a:2, exp:"« una botella de vino tinto de la casa »."},
      {type:"qcm", q:"¿Desde cuándo le duele la garganta a Claire?", opts:["Desde ayer","Desde hace dos días","Desde hace una semana","Desde esta mañana"], a:1, exp:"« desde hace dos días »."},
      {type:"qcm", q:"¿Qué diagnostica la doctora?", opts:["Una gripe","Una faringitis","Una bronquitis","Una alergia"], a:1, exp:"« es una faringitis »."},
      {type:"qcm", q:"¿Cuándo debe tomar el jarabe?", opts:["Antes de dormir","En ayunas","Después de las comidas","Solo por la mañana"], a:2, exp:"« tres veces al día después de las comidas »."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase contient une erreur. Écrivez le mot correct d'après les dialogues.", exercices:[
      {type:"input", q:"Claire reservó por teléfono. → Reservó por ______.", a:["internet"], ph:"un mot", exp:"« Reservé por internet la semana pasada »."},
      {type:"input", q:"El desayuno se sirve de ocho a diez. → De ______ a diez.", a:["siete","las siete"], ph:"une heure", exp:"Le petit-déjeuner est servi de sept à dix heures."},
      {type:"input", q:"La habitación es la 403. → Es la habitación ______.", a:["304"], ph:"un numéro", exp:"Manuel dit : « es la habitación 304 »."},
      {type:"input", q:"Claire pide el cordero. → Claire pide la ______.", a:["paella"], ph:"un plat", exp:"« Para mí la paella, por favor »."},
      {type:"input", q:"Thomas pide vino blanco. → Pide vino ______.", a:["tinto"], ph:"une couleur", exp:"« una botella de vino tinto de la casa »."},
      {type:"input", q:"A Claire le duele el estómago. → Le duele la ______.", a:["garganta"], ph:"partie du corps", exp:"« Me duele mucho la garganta »."},
      {type:"input", q:"La doctora receta antibióticos. → Receta un ______.", a:["jarabe"], ph:"un médicament", exp:"« Le receto un jarabe »."},
      {type:"input", q:"Claire es alérgica a la leche. → Es alérgica a los ______.", a:["cacahuetes"], ph:"un aliment", exp:"« soy alérgica a los cacahuetes »."},
      {type:"input", q:"Claire sube la maleta sola. → ______ sube la maleta.", a:["Manuel","el recepcionista"], ph:"un prénom", exp:"C'est le réceptionniste qui monte la valise."},
      {type:"input", q:"Anoche Claire tenía treinta y siete. → Tenía treinta y ______ y medio.", a:["ocho"], ph:"un chiffre", exp:"« anoche tenía treinta y ocho y medio »."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lisez le texte, puis répondez aux questions.", exercices:[
      {type:"qcm", q:"TEXTE : « El verano pasado Marta y su hermano fueron a Granada en tren. Salieron muy temprano porque el viaje duraba cinco horas. Cuando llegaron, hacía mucho calor y las calles estaban llenas de turistas. Se alojaron en una pensión pequeña cerca de la Alhambra. » — ¿Cómo viajaron a Granada?", opts:["En coche","En tren","En avión","En autobús"], a:1, exp:"« fueron a Granada en tren »."},
      {type:"qcm", q:"¿Cuánto duraba el viaje?", opts:["Dos horas","Tres horas","Cinco horas","Ocho horas"], a:2, exp:"« el viaje duraba cinco horas »."},
      {type:"qcm", q:"¿Qué tiempo hacía cuando llegaron?", opts:["Llovía","Hacía frío","Hacía mucho calor","Nevaba"], a:2, exp:"« hacía mucho calor »."},
      {type:"vf", q:"Marta y su hermano se alojaron en un hotel de lujo.", a:false, exp:"Faux : dans une petite pension près de l'Alhambra."},
      {type:"input", q:"¿Con quién viajó Marta? Con su ______.", a:["hermano"], ph:"un mot", exp:"Elle a voyagé avec son frère."},
      {type:"qcm", q:"TEXTE 2 : « Cuando era niño, Pablo vivía en un pueblo de la costa. Todos los veranos su familia abría un pequeño chiringuito en la playa. Un día, un cliente le dejó una propina enorme y Pablo se compró su primera bicicleta. » — ¿Dónde vivía Pablo de niño?", opts:["En Madrid","En un pueblo de la costa","En la montaña","En el extranjero"], a:1, exp:"« vivía en un pueblo de la costa »."},
      {type:"qcm", q:"¿Qué abría su familia todos los veranos?", opts:["Una tienda de ropa","Un restaurante de lujo","Un chiringuito en la playa","Un hotel"], a:2, exp:"« abría un pequeño chiringuito en la playa »."},
      {type:"qcm", q:"¿Qué se compró Pablo con la propina?", opts:["Una moto","Una bicicleta","Un balón","Un helado"], a:1, exp:"« se compró su primera bicicleta »."},
      {type:"vf", q:"En el texto 2, « vivía » y « abría » describen costumbres del pasado.", a:true, exp:"L'imparfait décrit des habitudes ; « dejó » et « compró » sont des actions ponctuelles."},
      {type:"input", q:"Dans le texte 2, quel verbe est au pretérito indefinido ? Écrivez-en un : ______", a:["dejo","dejó","compro","compró","se compró","se compro"], ph:"un verbe", exp:"« dejó » et « (se) compró » sont à l'indefinido."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Observez le document, puis répondez.", exercices:[
      {type:"qcm", q:"MENÚ DEL DÍA — Primero: ensalada o sopa · Segundo: pollo asado o merluza · Postre: flan o fruta · Pan y bebida incluidos · 13 € — ¿Cuántos platos incluye el menú?", opts:["Uno","Dos","Dos y postre","Cuatro"], a:2, exp:"Un premier, un second et un dessert."},
      {type:"vf", q:"MENÚ DEL DÍA : la bebida se paga aparte.", a:false, exp:"Faux : « Pan y bebida incluidos »."},
      {type:"qcm", q:"HOTEL SOL — Recepción 24 h · Desayuno 7:00-10:30 · Salida antes de las 12:00 · Parking 8 €/día — ¿A qué hora hay que dejar la habitación?", opts:["Antes de las 10:00","Antes de las 11:00","Antes de las 12:00","A las 14:00"], a:2, exp:"« Salida antes de las 12:00 »."},
      {type:"input", q:"HOTEL SOL : ¿cuánto cuesta el parking por día? ______ euros.", a:["8","ocho"], ph:"un chiffre", exp:"Le parking coûte 8 € par jour."},
      {type:"qcm", q:"FARMACIA — Jarabe para la tos. Adultos: 1 cucharada 3 veces al día después de las comidas. No superar 5 días. — ¿Cuántas veces al día?", opts:["Una","Dos","Tres","Cinco"], a:2, exp:"« 3 veces al día »."},
      {type:"vf", q:"FARMACIA : se puede tomar el jarabe durante dos semanas.", a:false, exp:"Faux : « No superar 5 días »."},
      {type:"qcm", q:"BILLETE DE TREN — Madrid → Sevilla · Salida 08:15 · Llegada 10:50 · Coche 5, asiento 12A — ¿Cuánto dura el viaje?", opts:["1 h 35","2 h 35","3 h 05","2 h 50"], a:1, exp:"De 8h15 à 10h50, soit 2 h 35."},
      {type:"input", q:"BILLETE DE TREN : ¿cuál es el número del asiento? ______", a:["12A","12 A","12a"], ph:"ex. 4B", exp:"Le siège est le 12A, voiture 5."},
      {type:"qcm", q:"ANUNCIO — Se alquila piso céntrico, dos habitaciones, amueblado, 650 €/mes, gastos no incluidos. — ¿Qué NO está incluido?", opts:["Los muebles","Las habitaciones","Los gastos","El centro"], a:2, exp:"« gastos no incluidos » : les charges sont en plus."},
      {type:"vf", q:"ANUNCIO : el piso se vende.", a:false, exp:"Faux : « Se alquila » signifie qu'il est à louer."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Choisissez le mot ou l'expression de sens équivalent.", exercices:[
      {type:"qcm", q:"empezar =", opts:["terminar","comenzar","seguir","parar"], a:1, exp:"empezar et comenzar signifient tous deux « commencer »."},
      {type:"qcm", q:"la habitación (en un hotel) =", opts:["el cuarto","la cocina","el pasillo","la escalera"], a:0, exp:"« el cuarto » est un synonyme courant de « habitación »."},
      {type:"qcm", q:"rápido =", opts:["lento","veloz","tranquilo","pesado"], a:1, exp:"veloz = rapide."},
      {type:"qcm", q:"bonito =", opts:["feo","hermoso","sucio","caro"], a:1, exp:"hermoso = beau, joli."},
      {type:"qcm", q:"quizá =", opts:["nunca","tal vez","siempre","también"], a:1, exp:"quizá et tal vez signifient « peut-être »."},
      {type:"qcm", q:"enfadarse =", opts:["enojarse","alegrarse","dormirse","reírse"], a:0, exp:"enfadarse / enojarse = se fâcher."},
      {type:"qcm", q:"contestar =", opts:["preguntar","responder","callar","gritar"], a:1, exp:"contestar = responder = répondre."},
      {type:"qcm", q:"el trabajo =", opts:["el empleo","el descanso","el paro","el viaje"], a:0, exp:"trabajo et empleo désignent l'emploi, le travail."},
      {type:"qcm", q:"barato =", opts:["caro","económico","gratuito","raro"], a:1, exp:"barato = económico = bon marché."},
      {type:"input", q:"Donnez un synonyme de « guapo » : ______", a:["bonito","hermoso","atractivo","bello"], ph:"un adjectif", exp:"guapo ≈ bonito / hermoso / atractivo."}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Choisissez ou écrivez le contraire.", exercices:[
      {type:"qcm", q:"El contrario de « caro » es...", opts:["barato","costoso","nuevo","grande"], a:0, exp:"caro (cher) ↔ barato (bon marché)."},
      {type:"qcm", q:"El contrario de « subir » es...", opts:["salir","bajar","entrar","volver"], a:1, exp:"subir (monter) ↔ bajar (descendre)."},
      {type:"qcm", q:"El contrario de « lleno » es...", opts:["vacío","limpio","abierto","corto"], a:0, exp:"lleno (plein) ↔ vacío (vide)."},
      {type:"qcm", q:"El contrario de « siempre » es...", opts:["a veces","nunca","a menudo","todavía"], a:1, exp:"siempre (toujours) ↔ nunca (jamais)."},
      {type:"qcm", q:"El contrario de « recordar » es...", opts:["olvidar","aprender","estudiar","pensar"], a:0, exp:"recordar (se souvenir) ↔ olvidar (oublier)."},
      {type:"qcm", q:"El contrario de « encender » es...", opts:["apagar","romper","cerrar","tirar"], a:0, exp:"encender (allumer) ↔ apagar (éteindre)."},
      {type:"qcm", q:"El contrario de « delante » es...", opts:["encima","detrás","dentro","cerca"], a:1, exp:"delante (devant) ↔ detrás (derrière)."},
      {type:"input", q:"El contrario de « antes » es ______.", a:["despues","después"], ph:"un adverbe", exp:"antes (avant) ↔ después (après)."},
      {type:"input", q:"El contrario de « ruidoso » es ______.", a:["silencioso","tranquilo"], ph:"un adjectif", exp:"ruidoso (bruyant) ↔ silencioso / tranquilo."},
      {type:"input", q:"El contrario de « ganar » (un partido) es ______.", a:["perder"], ph:"un verbe", exp:"ganar (gagner) ↔ perder (perdre)."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complétez avec le mot qui convient.", exercices:[
      {type:"qcm", q:"Voy a la ______ a comprar aspirinas.", opts:["panadería","farmacia","librería","carnicería"], a:1, exp:"Les médicaments s'achètent à la farmacia."},
      {type:"qcm", q:"Para pagar la cuenta pedimos la ______ al camarero.", opts:["carta","propina","cuenta","receta"], a:2, exp:"« la cuenta » = l'addition."},
      {type:"qcm", q:"El médico me dio una ______ para la farmacia.", opts:["factura","receta","tarjeta","entrada"], a:1, exp:"« receta » = ordonnance."},
      {type:"qcm", q:"Subimos a la quinta planta en el ______.", opts:["ascensor","asiento","armario","andén"], a:0, exp:"ascensor = ascenseur."},
      {type:"qcm", q:"He perdido la ______ de la habitación.", opts:["llave","puerta","ventana","cama"], a:0, exp:"llave = clé."},
      {type:"qcm", q:"El tren sale del ______ número tres.", opts:["asiento","andén","billete","horario"], a:1, exp:"andén = quai."},
      {type:"input", q:"Complétez : « Me duele la ______ » (partie du corps qui fait mal quand on avale).", a:["garganta"], ph:"un nom", exp:"la garganta = la gorge."},
      {type:"input", q:"Complétez : « Quiero ______ una mesa para dos » (verbe : réserver).", a:["reservar"], ph:"un verbe", exp:"reservar una mesa = réserver une table."},
      {type:"qcm", q:"El desayuno está ______ en el precio.", opts:["incluido","cerrado","abierto","perdido"], a:0, exp:"incluido = compris."},
      {type:"qcm", q:"No me gusta la carne muy hecha, la prefiero ______ hecha.", opts:["mucho","poco","bien","tan"], a:1, exp:"« poco hecha » = saignante."}
    ]}
    ,{ id:"familles", nom:"Familles de mots", consigne:"Trouvez le mot de la même famille.", exercices:[
      {type:"qcm", q:"trabajar → la persona que trabaja es el/la...", opts:["trabajo","trabajador","trabajoso","trabajado"], a:1, exp:"trabajador(a) = travailleur/travailleuse."},
      {type:"qcm", q:"cocinar → el lugar donde se cocina es la...", opts:["cocinera","cocina","cocido","cocinado"], a:1, exp:"la cocina = la cuisine (pièce)."},
      {type:"qcm", q:"enseñar → la acción de enseñar es la...", opts:["enseñanza","enseñado","enseñador","enseñante"], a:0, exp:"la enseñanza = l'enseignement."},
      {type:"qcm", q:"viajar → la persona que viaja es el...", opts:["viaje","viajero","viajado","viajante"], a:1, exp:"el viajero = le voyageur."},
      {type:"qcm", q:"pan → la tienda donde se vende pan es la...", opts:["panadero","panadería","panecillo","pantalla"], a:1, exp:"la panadería = la boulangerie."},
      {type:"input", q:"comer → el sustantivo (le repas) es « la ______ ».", a:["comida"], ph:"un nom", exp:"la comida = le repas / la nourriture."},
      {type:"input", q:"dormir → el sustantivo (la chambre à coucher) es « el ______ ».", a:["dormitorio"], ph:"un nom", exp:"el dormitorio = la chambre à coucher."},
      {type:"input", q:"enfermo → el sustantivo (la maladie) es « la ______ ».", a:["enfermedad"], ph:"un nom", exp:"la enfermedad = la maladie."},
      {type:"qcm", q:"libro → la tienda es la...", opts:["librería","biblioteca","libreta","libertad"], a:0, exp:"librería = librairie (biblioteca = bibliothèque)."},
      {type:"input", q:"llover → el sustantivo (la pluie) es « la ______ ».", a:["lluvia"], ph:"un nom", exp:"la lluvia = la pluie."}
    ]},
