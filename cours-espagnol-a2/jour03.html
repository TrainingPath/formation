<script>
var DAY = {
  num: 3,
  title: "Le passé simple irréguliers",
  subtitle: "Les indefinidos qui ne suivent pas la règle : à mémoriser.",
  theory: `
<h3>1. Pourquoi des irréguliers</h3>
<p>Beaucoup de verbes très courants ont un <strong>indefinido irrégulier</strong> : leur radical change et leurs terminaisons ne portent pas d'accent écrit. Comme ils reviennent tout le temps (aller, faire, avoir, pouvoir, être…), il faut les mémoriser. Bonne nouvelle : ils partagent presque tous le même jeu de terminaisons.</p>
<h3>2. Le groupe des radicaux forts</h3>
<p>Ces verbes changent de radical, puis ajoutent des terminaisons <strong>sans accent</strong> : <em>-e, -iste, -o, -imos, -isteis, -ieron</em>.</p>
<pre class="pseudo">infinitif   radical    yo      él/ella   ellos
tener       tuv-       tuve    tuvo      tuvieron
estar       estuv-     estuve  estuvo    estuvieron
poder       pud-       pude    pudo      pudieron
poner       pus-       puse    puso      pusieron
saber       sup-       supe    supo      supieron
venir       vin-       vine    vino      vinieron
hacer       hic-       hice    hizo      hicieron
querer      quis-      quise   quiso     quisieron</pre>
<div class="warn">Attention à <em>hacer</em> : à la 3e personne du singulier, c'est <strong>hizo</strong> (avec un z) pour garder le son, pas « hico ».</div>
<h3>3. Ser et ir : identiques !</h3>
<p>Les verbes <em>ser</em> (être) et <em>ir</em> (aller) ont exactement la <strong>même</strong> conjugaison à l'indefinido. Seul le contexte les distingue.</p>
<pre class="pseudo">yo fui        tú fuiste     él/ella fue
nosotros fuimos   vosotros fuisteis   ellos fueron
Fui médico.   -> Je fus médecin. (ser)
Fui a Roma.   -> Je suis allé à Rome. (ir)</pre>
<h3>4. Dar : irrégulier isolé</h3>
<pre class="pseudo">di   diste   dio   dimos   disteis   dieron
Me dio un regalo. -> Il/elle m'a donné un cadeau.</pre>
<h3>5. Verbes en -ir avec changement de voyelle</h3>
<p>Certains verbes en -ir changent leur voyelle à la 3e personne (singulier et pluriel) : <em>e</em> devient <em>i</em>, <em>o</em> devient <em>u</em>.</p>
<pre class="pseudo">pedir   -> pidió, pidieron     (mais : pedí, pediste…)
dormir  -> durmió, durmieron   (mais : dormí, dormiste…)
sentir  -> sintió, sintieron</pre>
<div class="tip">Un moyen simple de réviser : apprends d'abord la forme <em>yo</em> (tuve, hice, fui, di…). Le reste suit presque toujours le même moule.</div>`,
  exercises: [
    { type: "input", q: "Ayer yo ___ (tener) mucho trabajo.", a: ["tuve"], ph: "radical fort", exp: "tener -> tuv- : tuve, sans accent." },
    { type: "input", q: "Ella ___ (hacer) la cena.", a: ["hizo"], ph: "3e pers. sing.", exp: "hacer -> hizo (avec un z à la 3e personne)." },
    { type: "input", q: "Ellos ___ (venir) a la fiesta.", a: ["vinieron"], ph: "3e pers. pluriel", exp: "venir -> vin- : vinieron." },
    { type: "input", q: "Yo ___ (ir) al cine anoche.", a: ["fui"], ph: "ser/ir", exp: "ir -> fui (identique à ser)." },
    { type: "input", q: "Él me ___ (dar) las llaves.", a: ["dio"], ph: "3e pers. sing.", exp: "dar -> dio, sans accent." },
    { type: "input", q: "Ella ___ (dormir) diez horas.", a: ["durmió"], ph: "o -> u", exp: "dormir : o devient u à la 3e personne (durmió)." },
    { type: "qcm", q: "Quelle est la forme « yo » de « poder » à l'indefinido ?", opts: ["podí", "pude", "puedo", "pudí"], a: 1, exp: "poder -> pud- : pude." },
    { type: "qcm", q: "« Fue » peut vouloir dire…", opts: ["seulement « il fut »", "seulement « il alla »", "« il fut » OU « il alla »", "« il fera »"], a: 2, exp: "ser et ir ont la même conjugaison : le contexte tranche." },
    { type: "qcm", q: "Comment dit-on « ils firent / ils ont fait » ?", opts: ["hacieron", "hicieron", "hizieron", "hiceron"], a: 1, exp: "hacer -> hic- : hicieron." },
    { type: "qcm", q: "Quel verbe a le radical « estuv- » ?", opts: ["ser", "estar", "tener", "saber"], a: 1, exp: "estar -> estuve, estuvo, estuvieron." },
    { type: "qcm", q: "Quelle forme est correcte pour « elle demanda » (pedir) ?", opts: ["pedió", "pidió", "pedó", "pídio"], a: 1, exp: "pedir : e -> i à la 3e personne : pidió." },
    { type: "qcm", q: "Les terminaisons des radicaux forts (tuve, hice…) portent-elles un accent écrit ?", opts: ["Oui, toujours", "Non, elles n'en portent pas", "Seulement au pluriel", "Seulement à tú"], a: 1, exp: "tuve/tuvo, hice/hizo : pas d'accent, contrairement aux réguliers." },
    { type: "vf", q: "« Ser » et « ir » se conjuguent de façon identique à l'indefinido.", a: true, exp: "Vrai : fui, fuiste, fue, fuimos, fuisteis, fueron." },
    { type: "vf", q: "À l'indefinido, « hacer » à la 3e personne du singulier s'écrit « hició ».", a: false, exp: "Faux : c'est hizo, avec un z et sans accent." },
    { type: "vf", q: "Pour « dormir », la 3e personne du pluriel est « durmieron ».", a: true, exp: "Vrai : o -> u aux 3es personnes (durmió, durmieron)." }
  ],
  final: {
    title: "Exercice final — El concierto",
    intro: `<p>María raconte une soirée mémorable, pleine de verbes irréguliers :</p>
<pre class="pseudo">El sábado fui a un concierto increíble. Mis amigos vinieron conmigo
y tuvimos que esperar una hora en la puerta. El cantante hizo un
espectáculo genial y nos dio dos horas de música. No pude dormir
después: estuve pensando en el concierto toda la noche.</pre>`,
    questions: [
      { type: "input", q: "Complète : El sábado yo ___ (ir) a un concierto.", a: ["fui"], ph: "ser/ir", exp: "ir -> fui." },
      { type: "qcm", q: "¿Quiénes vinieron con María?", opts: ["Sus padres", "Sus amigos", "Nadie", "Sus vecinos"], a: 1, exp: "« Mis amigos vinieron conmigo »." },
      { type: "input", q: "Complète : El cantante ___ (hacer) un espectáculo genial.", a: ["hizo"], ph: "3e pers. sing.", exp: "hacer -> hizo." },
      { type: "vf", q: "María durmió muy bien después del concierto.", a: false, exp: "« No pude dormir » : elle n'a pas pu dormir." },
      { type: "qcm", q: "¿Qué significa « nos dio dos horas de música » ?", opts: ["Il nous a demandé deux heures", "Il nous a donné deux heures de musique", "Il a duré deux minutes", "Il est parti après deux heures"], a: 1, exp: "dar -> dio : il nous a donné." }
    ],
    solution: `<p>Le récit accumule les irréguliers de l'indefinido :</p>
<pre class="pseudo">fui (ir), vinieron (venir), tuvimos (tener), hizo (hacer),
dio (dar), pude (poder), estuve (estar)</pre>
<p>Remarque les radicaux forts (vin-, tuv-, pud-, estuv-) et l'absence d'accent sur leurs terminaisons. Ces verbes, très fréquents, méritent d'être sus par cœur.</p>`
  }
};
</script>
