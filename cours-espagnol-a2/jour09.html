  theory: `
<h3>1. Qu'est-ce qu'un adverbe de fréquence</h3>
<p>Un <strong>adverbe de fréquence</strong> indique combien de fois une action se répète. Voici l'échelle, du plus fréquent au plus rare :</p>
<pre class="pseudo">siempre          -> toujours
casi siempre     -> presque toujours
a menudo         -> souvent
a veces          -> parfois
de vez en cuando -> de temps en temps
casi nunca       -> presque jamais
nunca / jamás    -> jamais</pre>
<pre class="pseudo">Siempre desayuno café.        -> Je prends toujours un café au petit-déjeuner.
A veces voy al cine.          -> Parfois je vais au cinéma.
Nunca como carne.            -> Je ne mange jamais de viande.</pre>
<h3>2. La double négation avec « nunca »</h3>
<p>Point clé de l'espagnol : si <em>nunca</em> (ou <em>jamás</em>) est placé <strong>après</strong> le verbe, il faut ajouter <em>no</em> devant le verbe. Placé <strong>avant</strong> le verbe, on n'en met pas.</p>
<pre class="pseudo">Nunca como carne.       -> Je ne mange jamais de viande. (nunca avant : pas de no)
No como carne nunca.    -> Je ne mange jamais de viande. (nunca après : no obligatoire)</pre>
<div class="warn">La double négation est correcte et obligatoire en espagnol : <em>No viene nunca</em>, <em>No hay nadie</em>. Ce qui serait une faute en français est ici la norme.</div>
<h3>3. Où placer l'adverbe</h3>
<p>Les adverbes et expressions de fréquence sont assez souples. Ils se mettent souvent en début de phrase ou juste avant/après le verbe :</p>
<pre class="pseudo">A menudo llego tarde.          -> Souvent j'arrive en retard.
Voy al gimnasio a menudo.      -> Je vais souvent à la salle.
Normalmente ceno a las nueve.  -> D'habitude je dîne à neuf heures.</pre>
<h3>4. Exprimer combien de fois</h3>
<p>Pour préciser un nombre de fois par période, on utilise <em>vez / veces</em> (fois) + <em>a la / al</em> :</p>
<pre class="pseudo">una vez a la semana     -> une fois par semaine
dos veces al día        -> deux fois par jour
tres veces al mes       -> trois fois par mois
todos los días          -> tous les jours
cada dos días           -> tous les deux jours</pre>
<div class="tip">« Fois » = <em>vez</em> au singulier, <em>veces</em> au pluriel. « Par » se rend par <em>a la</em> (semana) ou <em>al</em> (día, mes, año).</div>
<h3>5. Poser la question de la fréquence</h3>
<pre class="pseudo">¿Con qué frecuencia haces deporte?  -> À quelle fréquence fais-tu du sport ?
¿Cuántas veces al mes vas al cine?  -> Combien de fois par mois vas-tu au cinéma ?</pre>`,

    solution: `<p>La routine mobilise toute l'échelle de fréquence :</p>
<pre class="pseudo">siempre > a menudo > tres veces a la semana > a veces > casi nunca > nunca</pre>
