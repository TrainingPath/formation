  title: "Les connecteurs : y, pero, porque, así que",
  subtitle: "Relier ses idées pour construire des phrases plus riches en espagnol.",
  theory: `
<h3>1. Pourquoi des connecteurs ?</h3>
<p>Un <strong>connecteur</strong> (un mot de liaison) relie deux idées pour former une phrase plus longue et plus naturelle. Au lieu de dire deux phrases courtes, on les relie : <em>Estudio español. Es útil.</em> devient <em>Estudio español porque es útil.</em></p>
<h3>2. Y (et) — ajouter</h3>
<pre class="pseudo">Como pan y bebo agua.   = Je mange du pain et je bois de l'eau.</pre>
<div class="warn">Devant un mot commençant par le son « i » (i- ou hi-), <strong>y</strong> devient <strong>e</strong> pour l'euphonie : <em>madre e hija</em> (mère et fille), <em>español e inglés</em> (espagnol et anglais).</div>
<h3>3. Pero (mais) — opposer</h3>
<pre class="pseudo">Quiero salir, pero llueve.   = Je veux sortir, mais il pleut.</pre>
<p><strong>Pero</strong> introduit une opposition ou une restriction. On met souvent une virgule avant.</p>
<h3>4. Porque (parce que) — la cause</h3>
<pre class="pseudo">No voy a la fiesta porque estoy cansado.
= Je ne vais pas à la fête parce que je suis fatigué.</pre>
<div class="tip">Ne confonds pas : <strong>porque</strong> (en un mot) = parce que (cause) ; <strong>¿por qué?</strong> (en deux mots, avec accent) = pourquoi ? (question). Réponse : <em>¿Por qué estudias? — Porque me gusta.</em></div>
<h3>5. Así que (donc, alors) — la conséquence</h3>
<pre class="pseudo">Llueve, así que me quedo en casa.
= Il pleut, donc je reste à la maison.</pre>
<p><strong>Así que</strong> introduit la conséquence, le résultat. Attention à la logique : la cause vient avant, la conséquence après.</p>
<h3>6. Comparer porque et así que</h3>
<pre class="pseudo">Me quedo en casa porque llueve.   = cause : je reste PARCE QU'il pleut.
Llueve, así que me quedo en casa. = conséquence : il pleut, DONC je reste.</pre>
<p>Ce sont deux façons de relier les mêmes idées, mais dans l'ordre inverse. Autres connecteurs utiles : <strong>también</strong> (aussi), <strong>o</strong> (ou), <strong>cuando</strong> (quand).</p>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur exprime la cause (« parce que ») ?", opts: ["pero", "porque", "así que", "y"], a: 1, exp: "Porque = parce que (cause)." },

    { type: "input", q: "Complète : « Quiero salir, ___ llueve. » (mais)", a: ["pero"], ph: "connecteur", exp: "Pero introduit l'opposition." },
    { type: "qcm", q: "Devant « hijo », le « et » devient :", opts: ["y", "e", "o", "u"], a: 1, exp: "Devant le son i (hijo), y devient e : padre e hijo." },
    { type: "input", q: "Complète : « Llueve, ___ me quedo en casa. » (donc)", a: ["así que"], ph: "connecteur", exp: "Así que = donc (conséquence)." },
    { type: "qcm", q: "« ¿Por qué? » (deux mots, accent) veut dire :", opts: ["parce que", "pourquoi ?", "donc", "mais"], a: 1, exp: "¿Por qué? = pourquoi (question) ; porque = parce que." },
    { type: "vf", q: "« Así que » introduit la conséquence.", a: true, exp: "Así que = donc, alors → résultat." },
    { type: "input", q: "Complète : « Estudio ___ es útil. » (parce que)", a: ["porque"], ph: "connecteur", exp: "Porque = parce que (cause)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["No como carne porqué soy vegetariano", "No como carne porque soy vegetariano", "No como carne por que soy vegetariano", "No como carne ¿por qué? soy vegetariano"], a: 1, exp: "Porque (un seul mot, sans accent) pour la cause." },
    { type: "qcm", q: "« Hablo español y francés. » Le « y » sert à :", opts: ["opposer", "ajouter (et)", "expliquer", "conclure"], a: 1, exp: "Y = et (addition)." },
    { type: "vf", q: "Dans « español e inglés », on écrit « e » à cause du son i de inglés.", a: true, exp: "Devant i-/hi-, y devient e." },
    { type: "qcm", q: "Comprension : « Estoy cansado, así que voy a dormir. » Quelle est la conséquence ?", opts: ["Je suis fatigué", "Je vais dormir", "Il est tard", "Je travaille"], a: 1, exp: "Así que voy a dormir = donc je vais dormir (conséquence)." },
    { type: "qcm", q: "Comprension : « No salgo porque hace mal tiempo. » Pourquoi la personne ne sort-elle pas ?", opts: ["Elle est malade", "Parce qu'il fait mauvais", "Elle n'a pas d'argent", "Elle est fatiguée"], a: 1, exp: "Porque hace mal tiempo = parce qu'il fait mauvais." },
    { type: "input", q: "Choisis le bon mot : « ___ estudias español? — Porque me gusta. » (question)", a: ["Por qué", "¿Por qué"], ph: "deux mots", exp: "La question s'écrit ¿Por qué? ; la réponse commence par Porque." },

    title: "Exercice final — Relier les idées",
    intro: `<p>Lis ce petit texte où les connecteurs sont soulignés par le contexte :</p>
<pre class="pseudo">Me llamo Luis y vivo en Valencia.
Estudio inglés porque quiero trabajar en el extranjero.
Me gusta mucho la ciudad, pero en verano hace demasiado calor.
El sábado quería ir a la playa, pero llovía, así que me quedé en casa.
Leí un libro y descansé. Fue un día tranquilo.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi Luis étudie-t-il l'anglais ?", opts: ["Parce que c'est facile", "Parce qu'il veut travailler à l'étranger", "Parce que ses amis le font", "Pour voyager en été"], a: 1, exp: "Porque quiero trabajar en el extranjero." },

      { type: "qcm", q: "Pourquoi Luis n'est-il pas allé à la plage samedi ?", opts: ["Il était malade", "Il pleuvait, donc il est resté chez lui", "Il travaillait", "La plage était fermée"], a: 1, exp: "Llovía, así que me quedé en casa." },
      { type: "input", q: "Quel connecteur relie « llovía » et « me quedé en casa » ? (deux mots)", a: ["así que", "asi que"], ph: "connecteur", exp: "Así que = donc (conséquence)." },
      { type: "vf", q: "Luis a passé une journée tranquille.", a: true, exp: "Fue un día tranquilo." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je m'appelle Luis et je vis à Valence.
J'étudie l'anglais parce que je veux travailler à l'étranger.
J'aime beaucoup la ville, mais en été il fait trop chaud.
Samedi je voulais aller à la plage, mais il pleuvait, donc je suis resté chez moi.
J'ai lu un livre et je me suis reposé. Ce fut une journée tranquille.</pre>
<p>Les quatre connecteurs de base : <strong>y</strong> (ajouter), <strong>pero</strong> (opposer), <strong>porque</strong> (la cause), <strong>así que</strong> (la conséquence). Ils transforment des phrases courtes en un vrai récit.</p>`
  }
};
