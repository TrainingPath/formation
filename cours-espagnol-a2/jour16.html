<script>
var DAY = {
  num: 16,
  title: "Les vêtements et le shopping",
  subtitle: "Nommer les vêtements, demander les prix et faire ses achats en espagnol.",
  theory: `
<h3>1. Le vocabulaire des vêtements (la ropa)</h3>
<p>Voici les vêtements les plus courants. Chaque mot est donné avec son article, car il faut retenir le genre :</p>
<pre class="pseudo">la camiseta   = le tee-shirt        el pantalón  = le pantalon
la camisa     = la chemise           los zapatos  = les chaussures
el vestido    = la robe              la falda     = la jupe
la chaqueta   = la veste             el abrigo    = le manteau
el jersey     = le pull              los calcetines = les chaussettes</pre>
<p>Le verbe « porter (un vêtement) » se dit <strong>llevar</strong> : <em>Hoy llevo una camiseta azul</em> (Aujourd'hui je porte un tee-shirt bleu).</p>
<h3>2. Dans le magasin (en la tienda)</h3>
<p>Pour faire ses achats, quelques phrases reviennent tout le temps :</p>
<pre class="pseudo">¿Qué desea?            = Vous désirez ?
Quería una camisa.     = Je voudrais une chemise.
¿Cuánto cuesta?        = Combien ça coûte ?
¿Cuánto cuestan?       = Combien coûtent-ils/elles ? (pluriel)
Me lo llevo.           = Je le prends.
¿Puedo probármelo?     = Puis-je l'essayer ?</pre>
<div class="tip">Pour être poli, on utilise souvent <strong>quería</strong> (je voudrais) au lieu de <em>quiero</em> (je veux). C'est plus courtois, comme en français.</div>
<h3>3. Les tailles et les couleurs</h3>
<p>On demande la taille avec <strong>la talla</strong> (vêtements) et <strong>el número</strong> (chaussures) :</p>
<pre class="pseudo">¿Qué talla usa?        = Quelle taille faites-vous ?
Uso la talla M.        = Je fais du M.
Es demasiado grande.   = C'est trop grand.
Es demasiado pequeño.  = C'est trop petit.</pre>
<p>Rappel : l'adjectif de couleur s'accorde. <em>Un jersey rojo</em>, <em>una falda roja</em>, <em>unos zapatos rojos</em>.</p>
<h3>4. Payer</h3>
<p>À la caisse (la caja) :</p>
<pre class="pseudo">¿Cómo va a pagar?          = Comment allez-vous payer ?
En efectivo.               = En espèces.
Con tarjeta.               = Par carte.
Aquí tiene.                = Voici / Tenez.</pre>
<div class="warn">Attention : <strong>barato</strong> = bon marché, et <strong>caro</strong> = cher. Ne les confonds pas ! <em>Es muy caro</em> = C'est très cher.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le tee-shirt » en espagnol ?", opts: ["la camisa", "la camiseta", "el vestido", "la chaqueta"], a: 1, exp: "La camiseta = le tee-shirt. La camisa (avec un s) = la chemise." },
    { type: "qcm", q: "Quel verbe signifie « porter (un vêtement) » ?", opts: ["tomar", "traer", "llevar", "poner"], a: 2, exp: "Llevar una camiseta = porter un tee-shirt." },
    { type: "qcm", q: "« ¿Cuánto cuesta? » veut dire :", opts: ["Quelle taille ?", "Combien ça coûte ?", "Où est-ce ?", "Comment payez-vous ?"], a: 1, exp: "Cuánto cuesta = combien ça coûte (singulier)." },
    { type: "input", q: "Complète : « ¿Puedo ___ la falda? » (essayer)", a: ["probarme"], ph: "verbe", exp: "Probarme la falda = essayer la jupe. On dit aussi probármela." },
    { type: "qcm", q: "Pour dire poliment « je voudrais », on emploie :", opts: ["quiero", "quería", "quisiera aussi mais moins", "querré"], a: 1, exp: "Quería (une chemise) est la formule polie usuelle en magasin." },
    { type: "vf", q: "« barato » signifie « cher ».", a: false, exp: "Faux : barato = bon marché. Caro = cher." },
    { type: "qcm", q: "Comment demande-t-on la taille d'un vêtement ?", opts: ["¿Qué número usa?", "¿Qué talla usa?", "¿Cuánto mide?", "¿Qué color?"], a: 1, exp: "La talla = la taille des vêtements ; el número = la pointure des chaussures." },
    { type: "input", q: "Accorde : une jupe rouge = una falda ___ .", a: ["roja"], ph: "couleur", exp: "Falda est féminin, donc roja." },
    { type: "qcm", q: "« Me lo llevo » veut dire :", opts: ["Je l'emporte / je le prends", "Je le porte", "Je le paie demain", "Je l'essaie"], a: 0, exp: "Me lo llevo = je le prends (je l'achète)." },
    { type: "vf", q: "Pour payer par carte, on dit « con tarjeta ».", a: true, exp: "Con tarjeta = par carte ; en efectivo = en espèces." },
    { type: "input", q: "Complète : « Es demasiado ___ » pour dire « c'est trop grand ».", a: ["grande"], ph: "adjectif", exp: "Demasiado grande = trop grand." },
    { type: "qcm", q: "Comprension : un client dit « Uso la talla M, pero esta camisa es demasiado pequeña. » Que se passe-t-il ?", opts: ["La chemise est trop grande", "La chemise est trop petite pour lui", "Il fait du L", "Il ne veut pas de chemise"], a: 1, exp: "Pequeña = petite : la chemise est trop petite." },
    { type: "qcm", q: "Comprension : « ¿Cómo va a pagar? — En efectivo. » Comment paie le client ?", opts: ["Par carte", "En espèces", "Par chèque", "Il ne paie pas"], a: 1, exp: "En efectivo = en espèces (liquide)." },
    { type: "input", q: "Complète le pluriel : « ¿Cuánto ___ los zapatos? » (coûter)", a: ["cuestan"], ph: "verbe", exp: "Au pluriel : cuestan (los zapatos, pluriel)." },
    { type: "qcm", q: "Comprension : « Quería un abrigo negro, por favor. » Que demande la personne ?", opts: ["Une veste blanche", "Un manteau noir", "Un pull rouge", "Des chaussures"], a: 1, exp: "Un abrigo negro = un manteau noir." }
  ],
  final: {
    title: "Exercice final — En la tienda de ropa",
    intro: `<p>Lis ce petit dialogue dans un magasin de vêtements :</p>
<pre class="pseudo">Dependienta: ¡Hola! ¿Qué desea?
Cliente: Buenos días. Quería una chaqueta azul.
Dependienta: ¿Qué talla usa?
Cliente: Uso la talla M. ¿Cuánto cuesta?
Cliente: Cuarenta euros. ¿Puedo probármela?
Dependienta: Sí, claro. El probador está allí.</pre>`,
    questions: [
      { type: "qcm", q: "Que veut acheter le client ?", opts: ["Une chemise", "Une veste bleue", "Un pantalon", "Des chaussures"], a: 1, exp: "Una chaqueta azul = une veste bleue." },
      { type: "qcm", q: "Quelle taille fait le client ?", opts: ["S", "M", "L", "XL"], a: 1, exp: "Uso la talla M." },
      { type: "input", q: "Combien coûte la veste (en chiffres) ?", a: ["40", "40 euros", "cuarenta"], ph: "prix", exp: "Cuarenta euros = 40 euros." },
      { type: "qcm", q: "Que demande le client à la fin ?", opts: ["Payer par carte", "L'essayer", "Un autre couleur", "Une réduction"], a: 1, exp: "¿Puedo probármela? = puis-je l'essayer ?" },
      { type: "vf", q: "« El probador » désigne la cabine d'essayage.", a: true, exp: "El probador = la cabine d'essayage." }
    ],
    solution: `<p>Traduction du dialogue :</p>
<pre class="pseudo">Vendeuse : Bonjour ! Vous désirez ?
Client : Bonjour. Je voudrais une veste bleue.
Vendeuse : Quelle taille faites-vous ?
Client : Je fais du M. Combien ça coûte ?
Vendeuse : Quarante euros. Puis-je l'essayer ?
Vendeuse : Oui, bien sûr. La cabine est là-bas.</pre>
<p>Retiens le trio gagnant du shopping : <strong>Quería…</strong> (je voudrais), <strong>¿Cuánto cuesta?</strong> (combien) et <strong>¿Puedo probármelo/la?</strong> (puis-je l'essayer).</p>`
  }
};
</script>
