<script>
var DAY = {
  num: 27,
  title: "Compréhension : un e-mail, un article court",
  subtitle: "Lire et comprendre un texte authentique en espagnol.",
  theory: `
<h3>1. Lire sans tout comprendre</h3>
<p>Pour comprendre un texte, tu n'as pas besoin de connaître chaque mot. Repère d'abord le <strong>sujet général</strong>, puis les <strong>mots-clés</strong> (dates, lieux, noms), et devine le reste grâce au contexte. C'est ce qu'on appelle la <strong>lecture globale</strong>.</p>
<h3>2. Un e-mail d'invitation (léelo con atención)</h3>
<div class="tip">Lis cet e-mail deux fois : une fois pour l'idée générale, une fois pour les détails.</div>
<pre class="pseudo">De: Carmen
Para: Lucía
Asunto: ¡Fiesta de cumpleaños!

Hola Lucía:

¿Qué tal? Te escribo porque el próximo sábado hago una fiesta
en mi casa para celebrar mi cumpleaños. Empieza a las ocho de
la tarde. Vamos a cenar, escuchar música y bailar.

Mi dirección es calle Mayor, número 15, segundo piso. Está
cerca de la estación, así que puedes venir en tren.

Si quieres, puedes traer a tu hermano. No traigas nada de
comer, ya preparo yo la cena. ¡Solo trae buen humor!

Por favor, contéstame antes del jueves para saber si vienes.

Un abrazo muy fuerte,
Carmen</pre>
<h3>3. Le vocabulaire utile de l'e-mail</h3>
<pre class="pseudo">Asunto        = Objet (du message)
Te escribo porque = Je t'écris parce que
cumpleaños    = anniversaire
la dirección  = l'adresse
contéstame    = réponds-moi
Un abrazo     = Bises / Amitiés (formule d'au revoir)</pre>
<h3>4. Repérer l'essentiel</h3>
<p>Dans un e-mail, cherche toujours ces informations : <strong>qui écrit ?</strong> (Carmen), <strong>à qui ?</strong> (Lucía), <strong>pourquoi ?</strong> (une invitation), <strong>quand ?</strong> (samedi à 20h), <strong>où ?</strong> (calle Mayor, 15). Ces cinq questions suffisent pour comprendre presque n'importe quel message.</p>
<div class="warn">Attention aux détails qui changent le sens : « No traigas nada de comer » veut dire « n'apporte rien à manger » (avec la négation), pas « apporte quelque chose ». Un petit mot comme <em>no</em> inverse tout !</div>`,
  exercises: [
    { type: "qcm", q: "Qui écrit cet e-mail ?", opts: ["Lucía", "Carmen", "Le frère", "La mère"], a: 1, exp: "Le message est signé Carmen (De: Carmen)." },
    { type: "qcm", q: "Quel est le sujet (asunto) du message ?", opts: ["Un voyage", "Une fête d'anniversaire", "Un travail", "Un examen"], a: 1, exp: "Asunto: ¡Fiesta de cumpleaños!" },
    { type: "input", q: "Quel jour a lieu la fête ? (un mot)", a: ["sábado", "sabado", "el sábado"], ph: "jour", exp: "El próximo sábado = samedi prochain." },
    { type: "qcm", q: "À quelle heure commence la fête ?", opts: ["À 18h", "À 20h", "À 22h", "À midi"], a: 1, exp: "Empieza a las ocho de la tarde = à 20h." },
    { type: "input", q: "Dans quelle rue habite Carmen ? Calle ___ .", a: ["Mayor"], ph: "rue", exp: "Calle Mayor, número 15." },
    { type: "qcm", q: "Comment Lucía peut-elle venir facilement ?", opts: ["En avion", "En train", "À pied depuis loin", "En bateau"], a: 1, exp: "Está cerca de la estación, así que puedes venir en tren." },
    { type: "vf", q: "Lucía peut amener son frère.", a: true, exp: "Puedes traer a tu hermano = tu peux amener ton frère." },
    { type: "qcm", q: "Que demande Carmen à propos de la nourriture ?", opts: ["Apporter un dessert", "Apporter à boire", "Ne rien apporter à manger", "Cuisiner ensemble"], a: 2, exp: "No traigas nada de comer, ya preparo yo la cena." },
    { type: "input", q: "Que doit apporter Lucía, d'après la fin ? Buen ___ .", a: ["humor"], ph: "mot", exp: "¡Solo trae buen humor! = apporte juste de la bonne humeur." },
    { type: "qcm", q: "Avant quand Lucía doit-elle répondre ?", opts: ["Avant lundi", "Avant jeudi", "Avant samedi", "Avant dimanche"], a: 1, exp: "Contéstame antes del jueves = avant jeudi." },
    { type: "vf", q: "« Un abrazo » est une formule pour terminer un message amical.", a: true, exp: "Un abrazo = bises/amitiés (clôture amicale)." },
    { type: "qcm", q: "Que signifie « Te escribo porque… » ?", opts: ["Je t'appelle parce que…", "Je t'écris parce que…", "Je te vois parce que…", "Je te réponds parce que…"], a: 1, exp: "Te escribo = je t'écris." },
    { type: "qcm", q: "Que vont-ils faire à la fête ?", opts: ["Étudier", "Dîner, écouter de la musique et danser", "Regarder un film", "Faire du sport"], a: 1, exp: "Vamos a cenar, escuchar música y bailar." },
    { type: "input", q: "Complète : « Mi ___ es calle Mayor, número 15. » (adresse)", a: ["dirección", "direccion"], ph: "nom", exp: "La dirección = l'adresse." },
    { type: "qcm", q: "Pourquoi Carmen organise-t-elle cette fête ?", opts: ["Pour un mariage", "Pour célébrer son anniversaire", "Pour un déménagement", "Pour Noël"], a: 1, exp: "Para celebrar mi cumpleaños." }
  ],
  final: {
    title: "Exercice final — Un artículo corto",
    intro: `<p>Lis ce court article et réponds aux questions :</p>
<pre class="pseudo">La Tomatina: la fiesta más divertida de España

Cada año, en agosto, el pueblo de Buñol celebra la Tomatina.
Es una fiesta muy especial: miles de personas se lanzan tomates
en la calle durante una hora. Vienen turistas de todo el mundo.
La fiesta empieza a las once de la mañana. Después, todos se
lavan en el río y comen juntos. Es una tradición muy antigua
y muy alegre. Si visitas España en verano, no te la pierdas.</pre>`,
    questions: [
      { type: "qcm", q: "Où se déroule la Tomatina ?", opts: ["À Madrid", "À Buñol", "À Barcelone", "À Séville"], a: 1, exp: "El pueblo de Buñol celebra la Tomatina." },
      { type: "qcm", q: "En quel mois a lieu la fête ?", opts: ["En juin", "En juillet", "En août", "En septembre"], a: 2, exp: "En agosto = en août." },
      { type: "qcm", q: "Que font les gens pendant la fête ?", opts: ["Ils dansent", "Ils se lancent des tomates", "Ils chantent", "Ils cuisinent"], a: 1, exp: "Se lanzan tomates en la calle." },
      { type: "input", q: "À quelle heure commence la fête ?", a: ["11", "once", "a las once", "11h"], ph: "heure", exp: "Empieza a las once de la mañana = à 11h." },
      { type: "vf", q: "Des touristes viennent du monde entier pour cette fête.", a: true, exp: "Vienen turistas de todo el mundo." }
    ],
    solution: `<p>Traduction de l'article :</p>
<pre class="pseudo">La Tomatina : la fête la plus amusante d'Espagne

Chaque année, en août, le village de Buñol célèbre la Tomatina.
C'est une fête très spéciale : des milliers de personnes se lancent
des tomates dans la rue pendant une heure. Des touristes viennent
du monde entier. La fête commence à onze heures du matin. Ensuite,
tout le monde se lave dans la rivière et mange ensemble. C'est une
tradition très ancienne et très joyeuse. Si tu visites l'Espagne
en été, ne la rate pas.</pre>
<p>Méthode : d'abord le titre et le thème (une fête), puis les 5 questions clés (quoi, où, quand, qui, comment). Tu n'as pas besoin de comprendre chaque mot pour saisir l'essentiel.</p>`
  }
};
</script>
