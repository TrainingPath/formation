<script>
var DAY = {
  num: 12,
  title: "Le gérondif et les périphrases",
  subtitle: "Exprimer une action en cours : estar + gérondif, seguir, llevar…",
  theory: `
<h3>1. Le gérondif (gerundio)</h3>
<p>Le <strong>gérondif</strong> exprime une action en train de se dérouler. Il correspond à la forme française « en -ant » ou « en train de ». On le forme ainsi :</p>
<pre class="pseudo">verbes en -ar  ->  -ando    hablar -> hablando (parlant)
verbes en -er  ->  -iendo   comer  -> comiendo (mangeant)
verbes en -ir  ->  -iendo   vivir  -> viviendo (vivant)</pre>
<h3>2. Gérondifs irréguliers</h3>
<p>Quelques verbes changent leur voyelle ou leur orthographe :</p>
<pre class="pseudo">leer   -> leyendo      (i devient y entre voyelles)
oír    -> oyendo
ir     -> yendo
dormir -> durmiendo    (o devient u)
pedir  -> pidiendo     (e devient i)
decir  -> diciendo</pre>
<h3>3. La périphrase estar + gérondif</h3>
<p>C'est la structure la plus courante : <em>estar</em> conjugué + gérondif. Elle insiste sur une action <strong>en cours au moment où on parle</strong> (équivalent de « être en train de »).</p>
<pre class="pseudo">Estoy comiendo.        -> Je suis en train de manger.
¿Qué estás haciendo?   -> Qu'est-ce que tu es en train de faire ?
Estaban durmiendo.     -> Ils étaient en train de dormir.</pre>
<div class="warn">Ne confonds pas avec le français : pour une action habituelle ou future, l'espagnol utilise le présent simple, PAS estar + gérondif. « Mañana trabajo » (demain je travaille), et non « estoy trabajando mañana ».</div>
<h3>4. D'autres périphrases utiles</h3>
<p>Une <strong>périphrase</strong> est un verbe + un autre verbe qui, ensemble, ajoutent une nuance :</p>
<pre class="pseudo">seguir + gérondif   -> continuer à   : Sigo estudiando. (je continue d'étudier)
llevar + gérondif   -> ça fait ... que : Llevo dos horas esperando. (j'attends depuis 2 h)
ir + gérondif       -> progression    : Voy entendiendo. (je commence à comprendre peu à peu)
acabar de + infinitif -> venir de     : Acabo de llegar. (je viens d'arriver)
volver a + infinitif  -> refaire      : Vuelvo a leerlo. (je le relis)
empezar a + infinitif -> commencer à  : Empiezo a trabajar. (je commence à travailler)</pre>
<h3>5. La place des pronoms</h3>
<p>Avec le gérondif, le pronom complément peut se coller à la fin (attention à l'accent écrit) ou se placer avant l'auxiliaire :</p>
<pre class="pseudo">Estoy leyéndolo.  =  Lo estoy leyendo.   -> Je suis en train de le lire.
Sigo esperándote. =  Te sigo esperando.  -> Je continue de t'attendre.</pre>
<div class="tip">Retiens la plus utile de toutes : <em>acabar de + infinitif</em> = « venir de ». <em>Acabo de comer</em> = je viens de manger.</div>`,
  exercises: [
    { type: "input", q: "Gérondif de « hablar » : Estoy ___.", a: ["hablando"], ph: "-ando", exp: "hablar -> hablando." },
    { type: "input", q: "Gérondif de « comer » : Estamos ___.", a: ["comiendo"], ph: "-iendo", exp: "comer -> comiendo." },
    { type: "input", q: "Gérondif irrégulier de « leer » : Está ___ un libro.", a: ["leyendo"], ph: "irrégulier", exp: "leer -> leyendo (i -> y)." },
    { type: "input", q: "Gérondif irrégulier de « dormir » : Los niños están ___.", a: ["durmiendo"], ph: "o -> u", exp: "dormir -> durmiendo." },
    { type: "qcm", q: "« Estoy comiendo » signifie :", opts: ["Je mangerai", "Je suis en train de manger", "Je mangeais", "J'ai mangé"], a: 1, exp: "estar + gérondif = action en cours." },
    { type: "qcm", q: "Comment forme-t-on le gérondif des verbes en -ar ?", opts: ["-iendo", "-ando", "-ado", "-endo"], a: 1, exp: "-ar -> -ando : hablando, cantando." },
    { type: "input", q: "Périphrase « venir de » : ___ de llegar. (je viens d'arriver)", a: ["Acabo", "acabo"], ph: "acabar de", exp: "acabar de + infinitif : Acabo de llegar." },
    { type: "qcm", q: "« Sigo estudiando » veut dire :", opts: ["J'ai fini d'étudier", "Je continue d'étudier", "Je vais étudier", "Je n'étudie pas"], a: 1, exp: "seguir + gérondif = continuer à." },
    { type: "qcm", q: "« Llevo dos horas esperando » signifie :", opts: ["Je vais attendre deux heures", "J'attends depuis deux heures", "J'ai attendu hier", "Je porte deux sacs"], a: 1, exp: "llevar + durée + gérondif = ça fait X que…" },
    { type: "qcm", q: "Pour « demain je travaille », on dit :", opts: ["Estoy trabajando mañana", "Mañana trabajo", "Mañana estoy trabajar", "Trabajando mañana"], a: 1, exp: "Action future/habituelle -> présent simple, pas estar + gérondif." },
    { type: "input", q: "Périphrase « recommencer à » : ___ a leerlo. (je le relis)", a: ["Vuelvo", "vuelvo"], ph: "volver a", exp: "volver a + infinitif : Vuelvo a leerlo." },
    { type: "qcm", q: "Compréhension : « ¿Qué estás haciendo? — Estoy cocinando la cena. »", opts: ["Il a déjà dîné", "Il prépare le dîner en ce moment", "Il va cuisiner demain", "Il ne cuisine pas"], a: 1, exp: "estar cocinando = en train de cuisiner maintenant." },
    { type: "vf", q: "Le gérondif de « comer » est « comiendo ».", a: true, exp: "Vrai : -er -> -iendo." },
    { type: "vf", q: "« Acabo de comer » signifie « je vais manger ».", a: false, exp: "Faux : acabar de = venir de. « Je viens de manger »." },
    { type: "vf", q: "Avec le gérondif, le pronom peut se coller à la fin : « leyéndolo ».", a: true, exp: "Vrai : leyéndolo = lo estoy leyendo (avec accent écrit)." }
  ],
  final: {
    title: "Exercice final — Una tarde en casa",
    intro: `<p>Que font les membres de la famille en ce moment ?</p>
<pre class="pseudo">Son las seis de la tarde y todos están ocupados. Mamá está preparando
la cena y papá está leyendo el periódico. Mi hermana lleva dos horas
estudiando para un examen. Yo acabo de terminar mis deberes y sigo
escuchando música. El perro está durmiendo en el sofá.</pre>`,
    questions: [
      { type: "input", q: "Complète : Mamá está ___ (preparar) la cena.", a: ["preparando"], ph: "gérondif", exp: "preparar -> preparando." },
      { type: "qcm", q: "¿Qué está haciendo papá?", opts: ["Cocinando", "Leyendo el periódico", "Durmiendo", "Estudiando"], a: 1, exp: "« papá está leyendo el periódico »." },
      { type: "qcm", q: "« Lleva dos horas estudiando » veut dire :", opts: ["Elle va étudier deux heures", "Elle étudie depuis deux heures", "Elle a fini d'étudier", "Elle n'étudie pas"], a: 1, exp: "llevar + durée + gérondif : depuis deux heures." },
      { type: "input", q: "Complète : Yo ___ de terminar mis deberes. (venir de)", a: ["acabo"], ph: "acabar de", exp: "acabar de + infinitif : acabo de terminar." },
      { type: "vf", q: "El perro está jugando en el jardín.", a: false, exp: "« El perro está durmiendo en el sofá » : il dort sur le canapé." }
    ],
    solution: `<p>La scène est entièrement construite sur le gérondif et les périphrases :</p>
<pre class="pseudo">estar + gérondif : está preparando, está leyendo, está durmiendo
llevar + gérondif : lleva dos horas estudiando
acabar de + inf. : acabo de terminar
seguir + gérondif : sigo escuchando</pre>
<p>Ces structures donnent une photographie de l'instant présent, plus vivante que le simple présent.</p>`
  }
};
</script>
