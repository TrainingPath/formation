  theory: `
<h3>1. Les parties du corps</h3>
<p>Voici le vocabulaire de base. En espagnol, on utilise l'article défini (el, la) et non le possessif pour les parties du corps : <em>Me duele la cabeza</em> (« j'ai mal à la tête », littéralement « la tête »).</p>
<pre class="pseudo">la cabeza    -> la tête        el brazo     -> le bras
el pelo      -> les cheveux    la mano      -> la main
los ojos     -> les yeux       el dedo      -> le doigt
la nariz     -> le nez         la pierna    -> la jambe
la boca      -> la bouche      el pie       -> le pied
los dientes  -> les dents      la espalda   -> le dos
la oreja     -> l'oreille      el estómago  -> l'estomac / le ventre
el cuello    -> le cou         el corazón   -> le cœur
la garganta  -> la gorge       la rodilla   -> le genou</pre>
<h3>2. Exprimer la douleur : doler</h3>
<p>Le verbe <em>doler</em> (avoir mal) fonctionne comme <em>gustar</em> : il s'accorde avec la partie du corps (le sujet réel) et s'emploie avec un pronom COI (me, te, le…).</p>
<pre class="pseudo">Me duele la cabeza.       -> J'ai mal à la tête. (une partie -> duele)
Me duelen las piernas.    -> J'ai mal aux jambes. (plusieurs -> duelen)
¿Te duele algo?           -> Tu as mal quelque part ?
A Juan le duele la muela. -> Juan a mal à la dent.</pre>
<div class="warn">doler s'accorde avec la partie du corps, pas avec la personne : <em>me duele</em> (singulier) / <em>me duelen</em> (pluriel). C'est exactement la mécanique de gustar.</div>
<h3>3. Dire qu'on est malade</h3>
<pre class="pseudo">Estoy enfermo/a.        -> Je suis malade.
Tengo fiebre.           -> J'ai de la fièvre.
Tengo tos.              -> J'ai de la toux.
Tengo dolor de cabeza.  -> J'ai mal à la tête. (autre façon)
Estoy resfriado/a.      -> Je suis enrhumé(e).
Tengo gripe.            -> J'ai la grippe.
Me encuentro mal.       -> Je me sens mal.</pre>
<div class="tip">Deux façons de dire « j'ai mal à la tête » : <em>Me duele la cabeza</em> (avec doler) ou <em>Tengo dolor de cabeza</em> (avec tener + dolor de). Les deux sont courantes.</div>
<h3>4. Chez le médecin</h3>
<pre class="pseudo">el médico / la médica  -> le médecin
el/la dentista         -> le/la dentiste
la farmacia            -> la pharmacie
la receta              -> l'ordonnance
la pastilla            -> le comprimé
el jarabe              -> le sirop
la cita                -> le rendez-vous
¿Qué le pasa?          -> Qu'est-ce qui vous arrive ?
Tiene que descansar.   -> Vous devez vous reposer.</pre>
<h3>5. Conseils : tener que et deber</h3>
<p>Pour donner un conseil ou une obligation, on utilise <em>tener que + infinitif</em> (devoir) ou <em>deber + infinitif</em> :</p>
<pre class="pseudo">Tienes que beber mucha agua.  -> Tu dois boire beaucoup d'eau.
Debes descansar.              -> Tu dois te reposer.
Hay que tomar la pastilla.    -> Il faut prendre le comprimé.</pre>`,
  exercises: [
    { type: "input", q: "Complète : Me ___ la cabeza. (une seule partie -> doler)", a: ["duele"], ph: "duele/duelen", exp: "Une partie (la cabeza) -> me duele." },
    { type: "input", q: "Complète : Me ___ los pies. (plusieurs parties)", a: ["duelen"], ph: "duele/duelen", exp: "Pluriel (los pies) -> me duelen." },

    { type: "input", q: "Complète : Tengo ___ de cabeza. (mal / douleur)", a: ["dolor"], ph: "mot", exp: "Tengo dolor de cabeza = j'ai mal à la tête." },

    { type: "input", q: "Complète : A Juan le ___ las muelas. (doler, pluriel)", a: ["duelen"], ph: "duele/duelen", exp: "las muelas (pluriel) -> le duelen." },

    { type: "input", q: "Conseil : Tienes ___ descansar. (tu dois)", a: ["que"], ph: "tener que", exp: "tener que + infinitif : tienes que descansar." },

    { type: "qcm", q: "Compréhension : « El médico me dio una receta para el jarabe. »", opts: ["Il m'a vendu du sirop", "Il m'a donné une ordonnance pour le sirop", "Il m'a demandé un rendez-vous", "Il m'a examiné les yeux"], a: 1, exp: "la receta = l'ordonnance, el jarabe = le sirop." },
    { type: "vf", q: "Pour les parties du corps, l'espagnol utilise l'article (la cabeza), pas le possessif.", a: true, exp: "Vrai : Me duele la cabeza, pas « mi cabeza »." },
    { type: "vf", q: "« Me duelen » s'emploie quand plusieurs parties du corps font mal.", a: true, exp: "Vrai : me duelen las piernas (pluriel)." },

  ],

    ],
    solution: `<p>Le dialogue réunit tout le vocabulaire de la santé :</p>
<pre class="pseudo">doler : me duele la garganta, me duelen los músculos

<p>Souviens-toi de l'accord de doler (duele / duelen) et des deux façons d'exprimer la douleur. Avec ce jour, tu peux décrire ton état de santé et comprendre un médecin. ¡Enhorabuena por completar el nivel A2!</p>`
  }
