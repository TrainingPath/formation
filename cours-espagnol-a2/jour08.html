<script>
var DAY = {
  num: 8,
  title: "Le superlatif des adjectifs",
  subtitle: "Le plus, le moins, et le fameux -ísimo.",
  theory: `
<h3>1. Le superlatif relatif</h3>
<p>Le <strong>superlatif relatif</strong> désigne le sommet d'un groupe : « le plus… », « le moins… ». On le construit avec l'article défini + <em>más</em> ou <em>menos</em> :</p>
<pre class="pseudo">el / la / los / las + más (ou menos) + adjectif + de

Es el chico más alto de la clase.  -> C'est le garçon le plus grand de la classe.
Es la película menos interesante del año. -> C'est le film le moins intéressant de l'année.</pre>
<div class="warn">Après un superlatif, « de » traduit le « de » français mais aussi souvent « du monde », « de tous » : <em>la más bonita del mundo</em> (la plus belle du monde). On n'emploie pas « en » ici.</div>
<h3>2. L'article s'accorde</h3>
<p>L'article et l'adjectif s'accordent avec le nom :</p>
<pre class="pseudo">el más rápido       (masc. sing.)
la más rápida       (fém. sing.)
los más rápidos     (masc. plur.)
las más rápidas     (fém. plur.)</pre>
<h3>3. Les superlatifs irréguliers</h3>
<p>Les mêmes quatre adjectifs qu'au comparatif gardent leur forme spéciale :</p>
<pre class="pseudo">bueno   -> el mejor    (le meilleur)
malo    -> el peor     (le pire)
grande  -> el mayor    (le plus âgé / l'aîné)
pequeño -> el menor    (le plus jeune / le cadet)</pre>
<pre class="pseudo">Es el mejor restaurante de la ciudad.  -> le meilleur restaurant de la ville.
Es la peor idea del mundo.             -> la pire idée du monde.</pre>
<h3>4. Le superlatif absolu : -ísimo</h3>
<p>Le <strong>superlatif absolu</strong> exprime un degré extrême sans comparer à un groupe : « très, extrêmement… ». On le forme avec le suffixe <em>-ísimo</em> (qui s'accorde : -ísima, -ísimos, -ísimas). On retire d'abord la voyelle finale de l'adjectif.</p>
<pre class="pseudo">alto    -> altísimo     (très grand)
guapa   -> guapísima    (très belle)
fácil   -> facilísimo   (très facile)
grande  -> grandísimo   (énorme)</pre>
<pre class="pseudo">La paella está buenísima.  -> La paella est délicieuse (super bonne).
Estoy cansadísimo.         -> Je suis épuisé (très fatigué).</pre>
<div class="tip">-ísimo = « muy + adjectif » en plus expressif. <em>Es muy caro</em> et <em>Es carísimo</em> veulent dire la même chose, mais -ísimo sonne plus fort.</div>
<div class="warn">Petits changements orthographiques : les adjectifs en -co, -go, -z changent pour garder le son : rico -> riquísimo, largo -> larguísimo, feliz -> felicísimo.</div>`,
  exercises: [
    { type: "qcm", q: "Comment se forme le superlatif relatif de supériorité ?", opts: ["más + adjectif + que", "el/la + más + adjectif + de", "tan + adjectif + como", "muy + adjectif"], a: 1, exp: "Article + más + adjectif + de : el más alto de la clase." },
    { type: "input", q: "Complète : Es ___ chico más alto ___ la clase. (le … de)", a: ["el de"], ph: "el ... de", exp: "el más alto de la clase : article el + de." },
    { type: "qcm", q: "Quel est le superlatif irrégulier de « bueno » ?", opts: ["el más bueno", "el mejor", "el buenísimo", "el bueno"], a: 1, exp: "bueno -> el mejor." },
    { type: "input", q: "Superlatif absolu de « alto » : Es ___.", a: ["altísimo"], ph: "-ísimo", exp: "On enlève la voyelle finale : alt- + ísimo = altísimo." },
    { type: "input", q: "Superlatif absolu de « guapa » : Es ___.", a: ["guapísima"], ph: "-ísima", exp: "guap- + ísima (accord féminin) = guapísima." },
    { type: "qcm", q: "« Es el peor día de mi vida » signifie :", opts: ["le meilleur jour", "le pire jour", "un jour normal", "le dernier jour"], a: 1, exp: "peor = pire ; malo -> el peor." },
    { type: "qcm", q: "Après un superlatif relatif, quelle préposition emploie-t-on ?", opts: ["en", "de", "que", "con"], a: 1, exp: "el más alto DE la clase (jamais « en »)." },
    { type: "input", q: "Superlatif absolu de « cansado » : Estoy ___.", a: ["cansadísimo"], ph: "-ísimo", exp: "cansad- + ísimo = cansadísimo (très fatigué)." },
    { type: "qcm", q: "Que signifie « La sopa está buenísima » ?", opts: ["La soupe est mauvaise", "La soupe est très bonne", "La soupe est froide", "La soupe est chère"], a: 1, exp: "buenísima = extrêmement bonne (superlatif absolu de bueno)." },
    { type: "qcm", q: "Quelle est la forme correcte du superlatif absolu de « rico » ?", opts: ["ricísimo", "riquísimo", "ricoísimo", "richísimo"], a: 1, exp: "-co -> -qu- pour garder le son : riquísimo." },
    { type: "input", q: "Accord : Son las montañas más ___ (alto) del país. (fém. plur.)", a: ["altas"], ph: "fém. pluriel", exp: "las más altas : accord féminin pluriel." },
    { type: "qcm", q: "« Es la mayor de las hermanas » veut dire :", opts: ["la plus petite", "l'aînée des sœurs", "la plus belle", "la cadette"], a: 1, exp: "mayor = la plus âgée / l'aînée." },
    { type: "vf", q: "Le suffixe -ísimo exprime un degré extrême, proche de « muy + adjectif ».", a: true, exp: "Vrai : carísimo = muy caro (très cher)." },
    { type: "vf", q: "Après un superlatif, on emploie « en » pour dire « de la classe ».", a: false, exp: "Faux : on emploie « de » : el más alto de la clase." },
    { type: "vf", q: "Le superlatif absolu -ísimo s'accorde en genre et en nombre.", a: true, exp: "Vrai : altísimo, altísima, altísimos, altísimas." }
  ],
  final: {
    title: "Exercice final — El concurso",
    intro: `<p>Un présentateur annonce les résultats d'un concours :</p>
<pre class="pseudo">¡Bienvenidos al concurso más importante del año! Hoy tenemos a los
mejores participantes del país. Marta ha preparado el plato más
original de todos: una tarta buenísima. Su rival, Juan, es el cocinero
más experimentado, pero hoy ha tenido el peor día de su carrera.
La decisión será dificilísima.</pre>`,
    questions: [
      { type: "qcm", q: "¿Cómo es el concurso?", opts: ["El menos importante", "El más importante del año", "Un concurso normal", "El más aburrido"], a: 1, exp: "« el concurso más importante del año »." },
      { type: "input", q: "Complète : Marta ha preparado el plato más ___ (original) de todos.", a: ["original"], ph: "adjectif", exp: "el más original : original est invariable au singulier ici." },
      { type: "qcm", q: "« una tarta buenísima » signifie :", opts: ["une tarte moyenne", "une tarte très bonne", "la meilleure tarte", "une mauvaise tarte"], a: 1, exp: "buenísima = superlatif absolu (extrêmement bonne)." },
      { type: "vf", q: "Juan ha tenido un día excelente.", a: false, exp: "« el peor día de su carrera » : le pire jour, pas excellent." },
      { type: "input", q: "Superlatif absolu : La decisión será ___ (difícil).", a: ["dificilísima"], ph: "-ísima", exp: "difícil -> dificilísima (très difficile, accord féminin)." }
    ],
    solution: `<p>Le texte combine les deux superlatifs :</p>
<pre class="pseudo">RELATIF : el más importante, los mejores, el más original, el más experimentado, el peor
ABSOLU  : buenísima, dificilísima</pre>
<p>Retiens la formule du relatif (article + más/menos + adjectif + de) et le suffixe -ísimo de l'absolu, avec ses petits ajustements orthographiques.</p>`
  }
};
</script>
