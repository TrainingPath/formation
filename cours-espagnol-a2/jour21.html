<script>
var DAY = {
  num: 21,
  title: "Les loisirs et le sport",
  subtitle: "Parler de ses passe-temps, du sport et de ses préférences en espagnol.",
  theory: `
<h3>1. Les loisirs (el tiempo libre)</h3>
<pre class="pseudo">leer         = lire            ver la tele  = regarder la télé
escuchar música = écouter de la musique
cocinar      = cuisiner         viajar       = voyager
bailar       = danser           pintar       = peindre
salir con amigos = sortir avec des amis</pre>
<h3>2. Le sport (el deporte)</h3>
<p>Deux verbes sont importants avec le sport : <strong>jugar a</strong> (jouer à, pour les sports de ballon/équipe) et <strong>hacer</strong> (faire, pour les autres) :</p>
<pre class="pseudo">jugar al fútbol      = jouer au football
jugar al tenis       = jouer au tennis
jugar al baloncesto  = jouer au basket
hacer deporte        = faire du sport
hacer natación       = faire de la natation
montar en bici       = faire du vélo
correr               = courir</pre>
<div class="warn">Avec les sports de balle, on emploie <strong>jugar a</strong> + article : jugar al fútbol (a + el = al). Pour la natation ou la gym, on utilise <strong>hacer</strong> : hacer natación.</div>
<h3>3. Exprimer ses goûts (gustar, encantar)</h3>
<p>Rappel du verbe <strong>gustar</strong> : <em>Me gusta el fútbol</em> (j'aime le football), <em>Me gustan los deportes</em> (j'aime les sports). Pour dire « j'adore », on emploie <strong>encantar</strong> :</p>
<pre class="pseudo">Me encanta bailar.      = J'adore danser.
Me encantan las series. = J'adore les séries.
No me gusta correr.     = Je n'aime pas courir.</pre>
<div class="tip">Quand un verbe suit (bailar, leer…), gustar/encantar reste au singulier : <em>Me gusta leer</em>, <em>Me encanta viajar</em>.</div>
<h3>4. La fréquence (¿con qué frecuencia?)</h3>
<pre class="pseudo">siempre        = toujours
a menudo       = souvent
a veces        = parfois
una vez a la semana = une fois par semaine
nunca          = jamais</pre>
<p>Exemple : <em>Juego al tenis dos veces a la semana</em> (Je joue au tennis deux fois par semaine).</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « jouer au football » ?", opts: ["hacer fútbol", "jugar al fútbol", "jugar fútbol", "jugar el fútbol"], a: 1, exp: "Jugar a + el = jugar al fútbol." },
    { type: "qcm", q: "Quel verbe utilise-t-on pour la natation ?", opts: ["jugar", "hacer", "ver", "leer"], a: 1, exp: "Hacer natación = faire de la natation." },
    { type: "input", q: "Complète : « Me ___ bailar. » (j'adore)", a: ["encanta"], ph: "verbe", exp: "Me encanta + infinitif (singulier)." },
    { type: "qcm", q: "« a veces » signifie :", opts: ["toujours", "jamais", "parfois", "souvent"], a: 2, exp: "A veces = parfois." },
    { type: "vf", q: "« Me encantan las series » est correct (encantan au pluriel avec un nom pluriel).", a: true, exp: "Las series est pluriel, donc encantan." },
    { type: "qcm", q: "« montar en bici » veut dire :", opts: ["courir", "faire du vélo", "danser", "nager"], a: 1, exp: "Montar en bici = faire du vélo." },
    { type: "input", q: "Complète : « Me gusta ___ música. » (écouter)", a: ["escuchar"], ph: "verbe", exp: "Escuchar música = écouter de la musique." },
    { type: "qcm", q: "Pour dire « jamais », on utilise :", opts: ["siempre", "nunca", "a menudo", "a veces"], a: 1, exp: "Nunca = jamais." },
    { type: "qcm", q: "« hacer deporte » signifie :", opts: ["regarder le sport", "faire du sport", "aimer le sport", "gagner"], a: 1, exp: "Hacer deporte = faire du sport." },
    { type: "input", q: "Complète : « Juego ___ tenis. » (a + el)", a: ["al"], ph: "préposition", exp: "Jugar a + el tenis = jugar al tenis." },
    { type: "vf", q: "Avec un verbe à l'infinitif, on dit « Me gustan viajar ».", a: false, exp: "Faux : devant un infinitif, gustar reste au singulier : me gusta viajar." },
    { type: "qcm", q: "Comprension : « Los fines de semana me encanta salir con amigos y bailar. » Que fait cette personne le week-end ?", opts: ["Elle travaille", "Elle sort avec des amis et danse", "Elle lit", "Elle fait du sport"], a: 1, exp: "Salir con amigos y bailar = sortir avec des amis et danser." },
    { type: "qcm", q: "Comprension : « Juego al baloncesto dos veces a la semana. » À quelle fréquence ?", opts: ["Tous les jours", "Une fois par mois", "Deux fois par semaine", "Jamais"], a: 2, exp: "Dos veces a la semana = deux fois par semaine." },
    { type: "input", q: "Complète : « No me ___ correr. » (je n'aime pas)", a: ["gusta"], ph: "verbe", exp: "No me gusta correr (infinitif → singulier)." },
    { type: "qcm", q: "Comprension : « Nunca hago natación, pero me encanta montar en bici. » Que fait cette personne ?", opts: ["De la natation souvent", "Jamais de natation, mais elle adore le vélo", "Ni natation ni vélo", "Elle déteste le vélo"], a: 1, exp: "Nunca hago natación (jamais) + me encanta montar en bici." }
  ],
  final: {
    title: "Exercice final — Mi tiempo libre",
    intro: `<p>Lis ce texte sur les loisirs de Marta :</p>
<pre class="pseudo">Me llamo Marta y me encanta el deporte.
Juego al tenis tres veces a la semana con mi hermana.
También hago natación los sábados por la mañana.
En mi tiempo libre me gusta leer y escuchar música.
Nunca veo la tele, prefiero salir con amigos.
Los domingos me encanta cocinar para mi familia.</pre>`,
    questions: [
      { type: "qcm", q: "Quel sport Marta pratique-t-elle avec sa sœur ?", opts: ["Le basket", "Le tennis", "La natation", "Le football"], a: 1, exp: "Juego al tenis… con mi hermana." },
      { type: "input", q: "Combien de fois par semaine joue-t-elle au tennis ?", a: ["3", "tres", "tres veces"], ph: "nombre", exp: "Tres veces a la semana = trois fois par semaine." },
      { type: "qcm", q: "Que fait-elle le samedi matin ?", opts: ["Elle lit", "De la natation", "Elle cuisine", "Elle regarde la télé"], a: 1, exp: "Hago natación los sábados por la mañana." },
      { type: "vf", q: "Marta regarde souvent la télé.", a: false, exp: "Faux : nunca veo la tele = elle ne regarde jamais la télé." },
      { type: "qcm", q: "Que fait-elle le dimanche ?", opts: ["Du sport", "Elle cuisine pour sa famille", "Elle voyage", "Elle danse"], a: 1, exp: "Los domingos me encanta cocinar para mi familia." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je m'appelle Marta et j'adore le sport.
Je joue au tennis trois fois par semaine avec ma sœur.
Je fais aussi de la natation le samedi matin.
Pendant mon temps libre j'aime lire et écouter de la musique.
Je ne regarde jamais la télé, je préfère sortir avec des amis.
Le dimanche j'adore cuisiner pour ma famille.</pre>
<p>À retenir : <strong>jugar a</strong> (sports de balle) contre <strong>hacer</strong> (natation, sport en général), et l'échelle de fréquence de <strong>siempre</strong> à <strong>nunca</strong>.</p>`
  }
};
</script>
