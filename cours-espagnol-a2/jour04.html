<script>
var DAY = {
  num: 4,
  title: "L'imparfait (imperfecto)",
  subtitle: "Décrire, raconter des habitudes et planter le décor du passé.",
  theory: `
<h3>1. À quoi sert l'imperfecto</h3>
<p>Le <strong>pretérito imperfecto</strong> correspond à l'imparfait français. Il ne raconte pas une action ponctuelle terminée, il <strong>décrit</strong> : il pose le décor, exprime des <strong>habitudes</strong> passées (« avant, je faisais… »), l'âge, l'heure, la météo, les émotions et les descriptions dans le passé.</p>
<pre class="pseudo">Cuando era niño, jugaba en la calle.  -> Quand j'étais enfant, je jouais dans la rue.
Hacía frío y llovía.                  -> Il faisait froid et il pleuvait.</pre>
<p>Marqueurs typiques : <em>antes</em> (avant), <em>siempre</em> (toujours), <em>a menudo</em> (souvent), <em>todos los días</em> (tous les jours), <em>mientras</em> (pendant que), <em>cuando era pequeño</em> (quand j'étais petit).</p>
<h3>2. Les terminaisons (très régulières)</h3>
<pre class="pseudo">              -AR (hablar)     -ER / -IR (comer / vivir)
yo            hablaba          comía / vivía
tú            hablabas         comías / vivías
él/ella       hablaba          comía / vivía
nosotros      hablábamos       comíamos / vivíamos
vosotros      hablabais        comíais / vivíais
ellos/ellas   hablaban         comían / vivían</pre>
<p>Les verbes en -er et -ir prennent tous un accent sur le <em>í</em> (comía, vivía). Les verbes en -ar prennent -aba, -abas…</p>
<h3>3. Seulement trois irréguliers !</h3>
<p>L'imperfecto est le temps le plus régulier de l'espagnol. Il n'a que <strong>trois</strong> verbes irréguliers :</p>
<pre class="pseudo">ser   -> era, eras, era, éramos, erais, eran
ir    -> iba, ibas, iba, íbamos, ibais, iban
ver   -> veía, veías, veía, veíamos, veíais, veían</pre>
<div class="tip">Astuce mémoire : à l'imperfecto il n'y a que <strong>ser, ir, ver</strong> d'irréguliers. Tout le reste suit la règle sans exception.</div>
<div class="warn">Ne confonds pas <em>iba</em> (imperfecto de ir : « j'allais ») et <em>fui</em> (indefinido de ir : « je suis allé »). Le premier décrit une habitude, le second une action ponctuelle.</div>
<h3>4. Comment le reconnaître</h3>
<p>Si tu peux ajouter « d'habitude », « en train de » ou « c'était comme ça », c'est l'imperfecto. Il répond à « comment c'était ? » et non à « qu'est-il arrivé ? ».</p>
<pre class="pseudo">Todos los veranos íbamos a la playa.  -> Chaque été nous allions à la plage. (habitude)
Ella era alta y tenía el pelo largo.  -> Elle était grande et avait les cheveux longs. (description)</pre>`,
  exercises: [
    { type: "input", q: "Cuando era niño, yo ___ (jugar) al fútbol.", a: ["jugaba"], ph: "-aba", exp: "jugar -> jugaba (habitude passée)." },
    { type: "input", q: "Antes nosotros ___ (comer) juntos cada día.", a: ["comíamos"], ph: "-íamos", exp: "comer -> comíamos, accent sur le í." },
    { type: "input", q: "De pequeña, ella ___ (ser) muy tímida.", a: ["era"], ph: "irrégulier", exp: "ser -> era (l'un des trois irréguliers)." },
    { type: "input", q: "Todos los días ellos ___ (ir) a la escuela a pie.", a: ["iban"], ph: "irrégulier", exp: "ir -> iban." },
    { type: "input", q: "Mientras tú ___ (ver) la tele, yo cocinaba.", a: ["veías"], ph: "irrégulier", exp: "ver -> veías (irrégulier)." },
    { type: "input", q: "Antes yo ___ (vivir) en un pueblo pequeño.", a: ["vivía"], ph: "-ía", exp: "vivir -> vivía." },
    { type: "qcm", q: "À quoi sert principalement l'imperfecto ?", opts: ["À dater une action ponctuelle", "À décrire et exprimer des habitudes passées", "À parler du futur", "À donner un ordre"], a: 1, exp: "Description, décor, habitudes : « comment c'était »." },
    { type: "qcm", q: "Combien de verbes irréguliers a l'imperfecto ?", opts: ["Aucun", "Trois : ser, ir, ver", "Dix", "Tous les verbes en -ir"], a: 1, exp: "Seulement ser (era), ir (iba), ver (veía)." },
    { type: "qcm", q: "Quelle est la forme « nous » de l'imperfecto de « hablar » ?", opts: ["hablabamos", "hablábamos", "hablamos", "hablaríamos"], a: 1, exp: "hablábamos, avec accent sur le á." },
    { type: "qcm", q: "Quel marqueur appelle l'imperfecto ?", opts: ["ayer", "anoche", "todos los días", "hace una hora"], a: 2, exp: "todos los días exprime une habitude répétée." },
    { type: "qcm", q: "« Iba » est l'imparfait de quel verbe ?", opts: ["ser", "ver", "ir", "haber"], a: 2, exp: "ir -> iba, ibas, iba…" },
    { type: "qcm", q: "Quelle phrase décrit une habitude passée ?", opts: ["Ayer fui al médico", "Todos los veranos íbamos a la playa", "He comido paella", "Iré mañana"], a: 1, exp: "« íbamos » + « todos los veranos » = habitude." },
    { type: "vf", q: "Les verbes en -er et -ir à l'imperfecto prennent un accent sur le í (comía, vivía).", a: true, exp: "Vrai : comía, vivías, veíamos…" },
    { type: "vf", q: "« Era » est l'imparfait du verbe « estar ».", a: false, exp: "Faux : era vient de ser. estar donne estaba (régulier)." },
    { type: "vf", q: "L'imperfecto peut exprimer l'heure ou l'âge dans le passé.", a: true, exp: "Vrai : « Eran las tres », « Tenía diez años »." }
  ],
  final: {
    title: "Exercice final — La casa de la abuela",
    intro: `<p>Un souvenir d'enfance, tout à l'imperfecto :</p>
<pre class="pseudo">Cuando era pequeño, pasaba los veranos en casa de mi abuela.
La casa era grande y tenía un jardín enorme. Todas las mañanas
mi abuela hacía pan y olía muy bien. Mis primos y yo jugábamos
en el jardín mientras los adultos hablaban. Éramos muy felices.</pre>`,
    questions: [
      { type: "input", q: "Complète : La casa ___ (ser) grande.", a: ["era"], ph: "irrégulier", exp: "ser -> era." },
      { type: "qcm", q: "¿Qué hacía la abuela todas las mañanas?", opts: ["Dormía", "Hacía pan", "Iba al trabajo", "Veía la tele"], a: 1, exp: "« mi abuela hacía pan »." },
      { type: "input", q: "Complète : Mis primos y yo ___ (jugar) en el jardín.", a: ["jugábamos"], ph: "-ábamos", exp: "jugar -> jugábamos." },
      { type: "vf", q: "Estas frases describen una acción única y terminada.", a: false, exp: "Ce sont des descriptions et des habitudes : l'imperfecto." },
      { type: "qcm", q: "¿Por qué se usa el imperfecto en todo el texto?", opts: ["Porque son acciones futuras", "Porque describe y cuenta costumbres del pasado", "Porque son órdenes", "Por error"], a: 1, exp: "Décor + habitudes répétées d'enfance." }
    ],
    solution: `<p>Rien n'est daté ni ponctuel : on décrit un cadre et des habitudes. D'où l'imperfecto partout.</p>
<pre class="pseudo">era, pasaba, tenía, hacía, olía, jugábamos, hablaban, éramos</pre>
<p>On y trouve deux des trois irréguliers : <em>era</em> et <em>éramos</em> (ser). L'imperfecto est le pinceau qui peint l'arrière-plan du passé.</p>`
  }
};
</script>
