  theory: `
<h3>1. ¿Qué tiempo hace? (Quel temps fait-il ?)</h3>
<p>En espagnol, la plupart des expressions météo utilisent le verbe <strong>hacer</strong> (faire) avec « hace » :</p>
<pre class="pseudo">Hace sol.       = Il y a du soleil.
Hace calor.     = Il fait chaud.
Hace frío.      = Il fait froid.
Hace viento.    = Il y a du vent.
Hace buen tiempo. = Il fait beau.
Hace mal tiempo.  = Il fait mauvais.</pre>
<div class="warn">On ne dit jamais « es calor » ni « está calor ». La météo avec hacer utilise TOUJOURS <strong>hace</strong> : hace calor, hace frío, hace sol.</div>
<h3>2. D'autres verbes météo</h3>
<p>Certaines expressions utilisent d'autres verbes :</p>
<pre class="pseudo">Llueve.        = Il pleut.        (verbe llover)
Nieva.         = Il neige.        (verbe nevar)
Está nublado.  = C'est nuageux.   (avec estar)
Hay niebla.    = Il y a du brouillard. (avec hay)</pre>
<div class="tip">Retiens la répartition : <strong>hace</strong> (sol, calor, frío, viento), <strong>hay</strong> (niebla, tormenta), <strong>está</strong> (nublado), et les verbes propres <strong>llueve / nieva</strong>.</div>
<h3>3. Les saisons (las estaciones)</h3>
<pre class="pseudo">la primavera = le printemps
el verano    = l'été
el otoño     = l'automne
el invierno  = l'hiver</pre>
<p>Exemple : <em>En verano hace mucho calor en España</em> (En été il fait très chaud en Espagne).</p>
<h3>4. La température</h3>
<pre class="pseudo">¿A cuántos grados estamos?   = Il fait combien de degrés ?
Estamos a treinta grados.    = Il fait trente degrés.
Hace veinte grados.          = Il fait vingt degrés.</pre>
<p>Pour nuancer, on ajoute <strong>mucho</strong> (beaucoup) ou <strong>un poco</strong> (un peu) : <em>Hace mucho frío</em> (il fait très froid), <em>Hace un poco de viento</em> (il y a un peu de vent).</p>`,

<pre class="pseudo">Hoy en el norte de España está nublado y llueve.
Hace bastante frío, estamos a diez grados.
En el centro hace buen tiempo y hace sol.
En el sur hace mucho calor, a treinta y cinco grados.
Mañana va a hacer viento en la costa.
Es un día típico de otoño.</pre>`,

    solution: `<p>Traduction :</p>
<pre class="pseudo">Aujourd'hui dans le nord de l'Espagne c'est nuageux et il pleut.
Il fait assez froid, il fait dix degrés.
Dans le centre il fait beau et il y a du soleil.
Dans le sud il fait très chaud, trente-cinq degrés.
Demain il y aura du vent sur la côte.
C'est un jour typique d'automne.</pre>
<p>La clé de la météo espagnole : bien choisir le verbe. <strong>hace</strong> (sol/calor/frío/viento), <strong>está</strong> (nublado), <strong>hay</strong> (niebla), et <strong>llueve / nieva</strong>.</p>`
  }
