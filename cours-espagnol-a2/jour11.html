<script>
var DAY = {
  num: 11,
  title: "Les pronoms compléments (COD/COI)",
  subtitle: "Remplacer un nom pour ne pas se répéter : lo, la, le, les…",
  theory: `
<h3>1. Pourquoi des pronoms compléments</h3>
<p>Un <strong>pronom complément</strong> remplace un nom déjà connu pour éviter la répétition. « Tu vois Marie ? — Oui, je la vois. » Le <em>la</em> remplace « Marie ». En espagnol on distingue deux sortes de compléments : le COD (objet direct) et le COI (objet indirect).</p>
<h3>2. Les pronoms COD (complément d'objet direct)</h3>
<p>Le <strong>COD</strong> répond à « qui ? / quoi ? » sans préposition. Ses pronoms :</p>
<pre class="pseudo">me   -> me            nos  -> nous
te   -> te            os   -> vous
lo   -> le (masc.)    los  -> les (masc.)
la   -> la (fém.)     las  -> les (fém.)</pre>
<pre class="pseudo">¿Ves la película? -> Sí, la veo.        (la = la película)
¿Compras el pan?  -> Sí, lo compro.     (lo = el pan)
¿Conoces a mis amigos? -> Sí, los conozco.</pre>
<h3>3. Les pronoms COI (complément d'objet indirect)</h3>
<p>Le <strong>COI</strong> répond à « à qui ? » (souvent introduit par « à »). Ses pronoms :</p>
<pre class="pseudo">me   -> à moi         nos  -> à nous
te   -> à toi         os   -> à vous
le   -> à lui/elle    les  -> à eux/elles</pre>
<pre class="pseudo">Doy el libro a Ana.  -> Le doy el libro.   (le = a Ana)
Escribo a mis padres. -> Les escribo.       (les = a mis padres)</pre>
<div class="tip">Astuce : aux 3es personnes, le COD est <em>lo/la/los/las</em> et le COI est <em>le/les</em>. Aux 1res et 2es personnes (me, te, nos, os), la forme est la même pour les deux.</div>
<h3>4. La place du pronom</h3>
<p>Le pronom se place <strong>avant le verbe conjugué</strong>. Mais avec un infinitif ou un gérondif, il peut se coller à la fin du verbe.</p>
<pre class="pseudo">La veo.                    -> Je la vois. (avant le verbe)
Quiero verla. / La quiero ver. -> Je veux la voir. (les deux sont corrects)
Estoy leyéndolo. / Lo estoy leyendo. -> Je suis en train de le lire.</pre>
<h3>5. Deux pronoms ensemble : le devient SE</h3>
<p>Quand un COI de 3e personne (le/les) précède un COD (lo/la/los/las), <em>le/les</em> se transforme en <strong>se</strong> (pour éviter « le lo »). L'ordre est : COI puis COD.</p>
<pre class="pseudo">Doy el libro a Ana.
-> Se lo doy.   (se = a Ana, lo = el libro)
NON : « le lo doy »</pre>
<div class="warn">Ne confonds pas le COD <em>lo/la</em> (le/la) et le COI <em>le</em> (à lui / à elle). « Lo veo » = je le vois ; « Le hablo » = je lui parle.</div>`,
  exercises: [
    { type: "input", q: "¿Ves la televisión? Sí, ___ veo. (COD)", a: ["la"], ph: "pronom COD", exp: "la película/televisión (fém.) -> la veo." },
    { type: "input", q: "¿Compras el periódico? Sí, ___ compro. (COD)", a: ["lo"], ph: "pronom COD", exp: "el periódico (masc.) -> lo compro." },
    { type: "qcm", q: "Quel pronom COD remplace « a mis amigos » (masc. plur.) ?", opts: ["les", "los", "las", "le"], a: 1, exp: "COD masculin pluriel -> los conozco." },
    { type: "input", q: "COI : Escribo un mensaje a mi madre. -> ___ escribo un mensaje.", a: ["Le", "le"], ph: "pronom COI", exp: "a mi madre (3e pers. sing.) -> le escribo." },
    { type: "qcm", q: "« Le hablo » signifie :", opts: ["Je le vois", "Je lui parle", "Je le mange", "Je les vois"], a: 1, exp: "le = COI : je lui parle (à lui/elle)." },
    { type: "input", q: "COI pluriel : Doy las gracias a mis padres. -> ___ doy las gracias.", a: ["Les", "les"], ph: "pronom COI", exp: "a mis padres -> les doy las gracias." },
    { type: "qcm", q: "Où se place normalement le pronom avec un verbe conjugué ?", opts: ["après le verbe", "avant le verbe", "au début de phrase seulement", "à la fin de phrase"], a: 1, exp: "La veo, lo compro : avant le verbe conjugué." },
    { type: "qcm", q: "Avec un infinitif, « je veux le voir » se dit :", opts: ["Quiero lo ver", "Lo quiero ver / Quiero verlo", "Quiero ver lo", "Le quiero ver lo"], a: 1, exp: "Les deux positions sont correctes : Lo quiero ver ou Quiero verlo." },
    { type: "qcm", q: "Quand « le » précède « lo », il devient :", opts: ["les", "se", "la", "lo"], a: 1, exp: "le/les + lo/la -> se : Se lo doy." },
    { type: "input", q: "Doy el regalo a Juan. Remplace les deux : ___ ___ doy.", a: ["Se lo", "se lo"], ph: "COI + COD", exp: "a Juan = se, el regalo = lo -> Se lo doy." },
    { type: "qcm", q: "Compréhension : « ¿Me das el libro? — Sí, te lo doy. » Que se passe-t-il ?", opts: ["Il refuse le livre", "Il donne le livre à l'autre personne", "Il garde le livre", "Il vend le livre"], a: 1, exp: "te (à toi) + lo (le livre) : oui, je te le donne." },
    { type: "qcm", q: "Compréhension : « ¿Conoces a María? — No, no la conozco. »", opts: ["Il connaît María", "Il ne connaît pas María", "Il connaît son frère", "Il l'a rencontrée hier"], a: 1, exp: "no la conozco : il ne la connaît pas (la = María)." },
    { type: "vf", q: "Aux 3es personnes, le COD est lo/la/los/las et le COI est le/les.", a: true, exp: "Vrai : lo veo (COD), le hablo (COI)." },
    { type: "vf", q: "« Se lo doy » est correct pour « Le lo doy ».", a: true, exp: "Vrai : le/les devient se devant lo/la : Se lo doy." },
    { type: "vf", q: "Le pronom complément peut se coller à la fin d'un infinitif.", a: true, exp: "Vrai : verla, dárselo, comprarlo." }
  ],
  final: {
    title: "Exercice final — El regalo de cumpleaños",
    intro: `<p>Un petit dialogue autour d'un cadeau :</p>
<pre class="pseudo">— ¿Compraste el regalo para Ana?
— Sí, lo compré ayer. Es un libro precioso.
— ¿Se lo vas a dar hoy?
— Sí, se lo doy esta tarde en la fiesta. También le escribí una tarjeta.
— ¡Qué detalle! Seguro que le va a encantar.</pre>`,
    questions: [
      { type: "qcm", q: "En « lo compré ayer », ¿qué reemplaza « lo »?", opts: ["a Ana", "el regalo (el libro)", "la tarjeta", "la fiesta"], a: 1, exp: "lo = el regalo (masculin)." },
      { type: "input", q: "Complète : ¿ ___ ___ vas a dar hoy? (le regalo à Ana : COI + COD)", a: ["se lo", "Se lo"], ph: "se + lo", exp: "a Ana = se, el regalo = lo -> se lo." },
      { type: "qcm", q: "En « le escribí una tarjeta », ¿qué es « le »?", opts: ["COD (le)", "COI (à elle, a Ana)", "un article", "un adverbe"], a: 1, exp: "le = COI : à elle (a Ana)." },
      { type: "vf", q: "El regalo es una tarjeta.", a: false, exp: "Le cadeau est un livre ; la carte est en plus." },
      { type: "input", q: "Complète : Sí, ___ compré ayer. (le regalo, COD masc.)", a: ["lo"], ph: "COD", exp: "el regalo -> lo compré." }
    ],
    solution: `<p>Le dialogue enchaîne COD, COI et la combinaison des deux :</p>
<pre class="pseudo">lo compré         -> lo = el regalo (COD)
se lo doy         -> se = a Ana (COI), lo = el regalo (COD)
le escribí        -> le = a Ana (COI)</pre>
<p>Souviens-toi de la transformation le -> se devant lo/la, et de l'ordre COI puis COD.</p>`
  }
};
</script>
