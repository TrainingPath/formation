  theory: `
<h3>1. Qu'est-ce qu'un adverbe de manière ?</h3>
<p>Un <strong>adverbe de manière</strong> dit COMMENT se fait une action. En français, beaucoup se terminent par <em>-ment</em> (lentement, rapidement). En espagnol, l'équivalent est <strong>-mente</strong> : <em>lentamente</em> (lentement), <em>rápidamente</em> (rapidement).</p>
<h3>2. La règle de formation</h3>
<p>On part de l'adjectif au <strong>féminin singulier</strong> et on ajoute <strong>-mente</strong> :</p>
<pre class="pseudo">adjectif féminin + mente

lento   → lenta   → lentamente    (lentement)
rápido  → rápida  → rápidamente   (rapidement)
tranquilo → tranquila → tranquilamente (tranquillement)</pre>
<div class="warn">Si l'adjectif n'a pas de forme féminine différente (il finit par -e ou par une consonne), on ajoute -mente directement : <em>fácil → fácilmente</em> (facilement), <em>feliz → felizmente</em> (heureusement), <em>amable → amablemente</em> (aimablement).</div>
<h3>3. Les accents restent</h3>
<p>L'adjectif garde son accent écrit d'origine dans l'adverbe : <em>rápido → rápidamente</em>, <em>fácil → fácilmente</em>. L'adverbe a donc parfois deux syllabes accentuées à l'oral.</p>
<h3>4. Deux adverbes qui se suivent</h3>
<p>Quand deux adverbes en -mente se suivent, seul le <strong>dernier</strong> garde -mente ; le premier reste au féminin simple :</p>
<pre class="pseudo">Habla lenta y claramente.  = Il parle lentement et clairement.
(et non : lentamente y claramente)</pre>
<h3>5. Des adverbes très fréquents</h3>
<pre class="pseudo">normalmente    = normalement / d'habitude
generalmente   = généralement
finalmente     = finalement
solamente      = seulement
perfectamente  = parfaitement
probablemente  = probablement</pre>
<div class="tip">Alternative courante : au lieu de l'adverbe long, l'espagnol dit souvent <strong>de forma / de manera + adjectif</strong> : <em>de forma rápida</em> = rapidement. Et pour « d'habitude », on utilise beaucoup <em>normalmente</em> ou <em>por lo general</em>.</div>`,

<pre class="pseudo">D'habitude je me réveille tôt et je prends mon petit-déjeuner tranquillement.
Je vais au travail rapidement à vélo.

Finalement, le soir, je lis lentement avant de dormir.</pre>
<p>La règle en une ligne : <strong>adjectif au féminin + mente</strong>, en gardant l'accent écrit d'origine. Ces adverbes enrichissent immédiatement l'expression.</p>`
  }
