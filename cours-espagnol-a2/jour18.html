  title: "Au restaurant : commander",
  subtitle: "Lire un menu, commander un plat et demander l'addition en espagnol.",
  theory: `
<h3>1. Les repas et les plats</h3>
<p>Un repas espagnol se compose souvent de plusieurs parties :</p>
<pre class="pseudo">el primer plato   = l'entrée (premier plat)
el segundo plato  = le plat principal (deuxième plat)
el postre         = le dessert
la bebida         = la boisson
el menú del día   = le menu du jour</pre>
<p>Quelques plats et aliments courants :</p>
<pre class="pseudo">la sopa   = la soupe        el pescado = le poisson
la carne  = la viande        la ensalada = la salade
el pollo  = le poulet        el pan     = le pain
el agua   = l'eau            el vino    = le vin</pre>
<h3>2. Commander (pedir)</h3>
<p>Le verbe important est <strong>pedir</strong> (commander, demander). Voici les phrases clés :</p>
<pre class="pseudo">De primero, quería una sopa.   = En entrée, je voudrais une soupe.
De segundo, para mí el pollo.  = Comme plat, pour moi le poulet.
Para beber, agua, por favor.   = Comme boisson, de l'eau, s'il vous plaît.
¿Qué me recomienda?            = Que me recommandez-vous ?</pre>
<div class="tip">La formule <strong>para mí</strong> (pour moi) est très pratique pour commander sans conjuguer de verbe : <em>Para mí, una ensalada</em>.</div>
<h3>3. Ce que dit le serveur (el camarero)</h3>
<pre class="pseudo">¿Qué van a tomar?      = Que allez-vous prendre ?
¿Y para beber?         = Et comme boisson ?
¿Algo más?             = Autre chose ?
Enseguida.             = Tout de suite.</pre>
<h3>4. Demander l'addition</h3>
<pre class="pseudo">La cuenta, por favor.        = L'addition, s'il vous plaît.
¿Está incluido el servicio?  = Le service est-il compris ?
¿Se puede pagar con tarjeta? = Peut-on payer par carte ?</pre>
<div class="warn">Ne confonds pas <strong>la cuenta</strong> (l'addition) et <strong>el cuento</strong> (le conte, l'histoire) ! Au restaurant, on demande toujours <em>la cuenta</em>.</div>
<h3>5. Exprimer un goût à table</h3>
<p>Souviens-toi du verbe <strong>gustar</strong> : <em>Me gusta el pescado</em> (j'aime le poisson), <em>No me gustan las verduras</em> (je n'aime pas les légumes). À table, on dit aussi <strong>¡Está buenísimo!</strong> (c'est délicieux !).</p>`,

    { type: "qcm", q: "Quel verbe signifie « commander » ?", opts: ["pagar", "pedir", "comer", "beber"], a: 1, exp: "Pedir = commander/demander." },
    { type: "input", q: "Complète : « La ___, por favor. » (l'addition)", a: ["cuenta"], ph: "nom", exp: "La cuenta = l'addition." },
    { type: "qcm", q: "Le serveur demande « ¿Y para beber? ». Il veut savoir :", opts: ["le plat principal", "la boisson", "le dessert", "le mode de paiement"], a: 1, exp: "Para beber = pour boire, la boisson." },
    { type: "vf", q: "« el postre » est le dessert.", a: true, exp: "El postre = le dessert." },

    { type: "qcm", q: "« la carne » veut dire :", opts: ["le poisson", "la viande", "le pain", "la salade"], a: 1, exp: "La carne = la viande ; el pescado = le poisson." },
    { type: "input", q: "Complète : « Para beber, ___, por favor. » (de l'eau)", a: ["agua"], ph: "boisson", exp: "El agua = l'eau." },
    { type: "vf", q: "Pour dire « c'est délicieux », on dit « ¡Está buenísimo! ».", a: true, exp: "Buenísimo = très bon, délicieux." },
    { type: "qcm", q: "Comprension : « De primero una ensalada y de segundo pescado. » Que commande la personne ?", opts: ["Soupe puis poulet", "Salade puis poisson", "Poisson puis dessert", "Pain puis viande"], a: 1, exp: "Ensalada (entrée) puis pescado (plat)." },
    { type: "qcm", q: "Comprension : « No me gustan las verduras, para mí carne. » Cette personne :", opts: ["adore les légumes", "n'aime pas les légumes et prend de la viande", "est végétarienne", "ne veut rien"], a: 1, exp: "No me gustan las verduras = elle n'aime pas les légumes." },
    { type: "input", q: "Complète la réponse du serveur : « ¿Algo ___? » (autre chose)", a: ["más"], ph: "mot", exp: "¿Algo más? = autre chose ?" },

<pre class="pseudo">Camarero: Buenas noches. ¿Qué van a tomar?
Cliente: De primero, una sopa. De segundo, pollo con patatas.
Camarero: Muy bien. ¿Y para beber?

      { type: "vf", q: "À la fin, le client demande l'addition.", a: true, exp: "La cuenta, por favor = l'addition." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Serveur : Bonsoir. Que allez-vous prendre ?
Client : En entrée, une soupe. Comme plat, du poulet avec des frites.
Serveur : Très bien. Et comme boisson ?
Client : De l'eau, s'il vous plaît. Que me recommandez-vous comme dessert ?
Serveur : Le flan est délicieux.
Client : Parfait, un flan. Et ensuite l'addition, s'il vous plaît.</pre>
<p>Structure gagnante : <strong>De primero… de segundo… para beber…</strong> puis <strong>la cuenta, por favor</strong>.</p>`
  }
