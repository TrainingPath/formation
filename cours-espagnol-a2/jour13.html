  title: "Les verbes pronominaux",
  subtitle: "Se lever, se laver, s'appeler : les verbes avec pronom réfléchi.",
  theory: `
<h3>1. Qu'est-ce qu'un verbe pronominal</h3>
<p>Un <strong>verbe pronominal</strong> (ou réfléchi) se conjugue avec un <strong>pronom réfléchi</strong> qui renvoie au sujet : l'action « retombe » sur celui qui la fait. À l'infinitif, on les reconnaît au <em>-se</em> collé à la fin : <em>levantarse</em> (se lever), <em>lavarse</em> (se laver), <em>llamarse</em> (s'appeler).</p>
<h3>2. Les pronoms réfléchis</h3>
<pre class="pseudo">yo          me     me lavo        (je me lave)
tú          te     te lavas       (tu te laves)
él/ella     se     se lava        (il/elle se lave)
nosotros    nos    nos lavamos    (nous nous lavons)
vosotros    os     os laváis      (vous vous lavez)
ellos/ellas se     se lavan       (ils/elles se lavent)</pre>
<div class="tip">Le pronom change avec la personne : me, te, se, nos, os, se. Il ne reste jamais « se » pour tout le monde !</div>
<h3>3. La place du pronom</h3>
<p>Avec un verbe conjugué, le pronom se met <strong>avant</strong> le verbe. Avec un infinitif ou un gérondif, il se colle à la fin.</p>
<pre class="pseudo">Me levanto a las siete.        -> Je me lève à sept heures.
Quiero levantarme temprano.    -> Je veux me lever tôt. (collé à l'infinitif)
Voy a ducharme.                -> Je vais me doucher.
Estoy duchándome.              -> Je suis en train de me doucher.</pre>
<div class="warn">Attention à l'accord du pronom avec le sujet, même à l'infinitif : « Quiero levantar<strong>me</strong> » (moi), mais « Juan quiere levantar<strong>se</strong> » (lui). Ne laisse pas « se » partout.</div>
<h3>4. Verbes du quotidien très fréquents</h3>
<pre class="pseudo">despertarse   -> se réveiller
levantarse    -> se lever
ducharse      -> se doucher
vestirse      -> s'habiller
peinarse      -> se coiffer
acostarse     -> se coucher
llamarse      -> s'appeler
sentirse      -> se sentir
irse          -> s'en aller, partir</pre>
<h3>5. Le sens change parfois</h3>
<p>Certains verbes existent avec et sans pronom, avec un sens différent :</p>
<pre class="pseudo">ir (aller)        vs  irse (s'en aller)     : Me voy. (je m'en vais)
dormir (dormir)   vs  dormirse (s'endormir): Me dormí en el sofá.
llamar (appeler)  vs  llamarse (s'appeler) : Me llamo Ana.
poner (mettre)    vs  ponerse (devenir/mettre sur soi) : Se puso triste.</pre>
<div class="warn">Le sens « réciproque » existe aussi : <em>Nos escribimos</em> peut vouloir dire « nous nous écrivons l'un à l'autre ». Le contexte tranche.</div>`,
  exercises: [

    { type: "qcm", q: "Où se place le pronom avec un verbe conjugué ?", opts: ["après le verbe", "avant le verbe", "à la fin de la phrase", "il disparaît"], a: 1, exp: "Me levanto, te lavas : avant le verbe conjugué." },
    { type: "qcm", q: "Comment dit-on « je veux me lever tôt » ?", opts: ["Quiero me levantar", "Me quiero levantar / Quiero levantarme", "Quiero levantar", "Quiero levantarse"], a: 1, exp: "Le pronom (me) se colle à l'infinitif ou précède quiero." },
    { type: "qcm", q: "Quelle forme est correcte pour « Juan veut se lever » ?", opts: ["Juan quiere levantarme", "Juan quiere levantarse", "Juan quiere me levantar", "Juan quiere levantar"], a: 1, exp: "Le pronom s'accorde avec le sujet : Juan -> se." },
    { type: "input", q: "Complète : Vosotros ___ vestís rápido. (vous vous habillez)", a: ["os"], ph: "pronom", exp: "vosotros -> os vestís." },
    { type: "qcm", q: "« Me voy » signifie :", opts: ["Je vais bien", "Je m'en vais", "Je vois", "Je me lave"], a: 1, exp: "irse = s'en aller : Me voy." },
    { type: "qcm", q: "Quelle est la différence entre « dormir » et « dormirse » ?", opts: ["Aucune", "dormir = dormir ; dormirse = s'endormir", "dormirse = ne pas dormir", "dormir = se réveiller"], a: 1, exp: "dormirse insiste sur le moment où l'on s'endort." },
    { type: "input", q: "Avec gérondif : Estoy ___ (peinarse : peinándo___).", a: ["me"], ph: "pronom collé", exp: "peinándome (le pronom se colle au gérondif)." },
    { type: "qcm", q: "Compréhension : « Se despertó, se duchó y se fue al trabajo. »", opts: ["Il est resté au lit", "Il s'est réveillé, douché puis parti travailler", "Il a dormi toute la journée", "Il n'est pas allé travailler"], a: 1, exp: "Suite d'actions réfléchies à l'indefinido." },
    { type: "vf", q: "Le pronom réfléchi change selon la personne (me, te, se, nos, os, se).", a: true, exp: "Vrai : il n'est pas toujours « se »." },
    { type: "vf", q: "« Llamarse » signifie « appeler quelqu'un au téléphone ».", a: false, exp: "Faux : llamarse = s'appeler (nom). Téléphoner = llamar." },
    { type: "vf", q: "Avec un infinitif, le pronom se colle à la fin : « ducharme ».", a: true, exp: "Vrai : voy a ducharme, quiero levantarme." }
  ],
  final: {
    title: "Exercice final — La rutina de la mañana",
    intro: `<p>La matinée de Lucía, pleine de verbes pronominaux :</p>

    questions: [

      { type: "input", q: "Complète : Después se viste y ___ peina. (pronom)", a: ["se"], ph: "pronom", exp: "se peina (3e personne)." },
      { type: "qcm", q: "« se siente lista » veut dire :", opts: ["elle s'assied", "elle se sent prête", "elle s'endort", "elle s'en va"], a: 1, exp: "sentirse = se sentir : elle se sent prête." },
      { type: "vf", q: "Lucía se levanta inmediatamente al despertarse.", a: false, exp: "« no se levanta enseguida » : elle ne se lève pas tout de suite." }
    ],
    solution: `<p>La routine matinale est un festival de verbes pronominaux à la 3e personne :</p>
<pre class="pseudo">se despierta, se levanta, se estira, se ducha, se viste,
se peina, se maquilla, se toma, se siente</pre>
<p>Remarque le pronom « se » qui accompagne chaque verbe, et le sens de sentirse (se sentir). Les routines quotidiennes sont le terrain naturel de ces verbes.</p>`
  }
