  title: "Configurer le projet sous NetBeans",
  subtitle: "Ajouter le driver .jar et préparer un fichier de configuration.",
  theory: `
<h3>1. Intégrer le driver au projet</h3>
<p>Le driver <code>.jar</code> téléchargé hier ne sert à rien tant que le projet ne le « connaît » pas. Sous NetBeans, on l'ajoute aux <strong>bibliothèques</strong> (Libraries) du projet. Marche à suivre du support :</p>
<pre class="pseudo">1. Lancer NetBeans et ouvrir le projet
2. Sur le disque, dans le dossier du projet, creer un sous-dossier "Librairies"
3. Y recopier le fichier mysql-connector-j (extension .jar)
4. Revenir dans NetBeans
5. Clic droit sur le projet -> Proprietes (Properties)
6. Selectionner la categorie "Libraries"
7. Ajouter le .jar, en conservant le CHEMIN RELATIF (option "Referencer comme")
8. Ouvrir (Open) puis OK</pre>
<div class="tip">Conserver le <strong>chemin relatif</strong> rend le projet <strong>portable</strong> : si vous le copiez sur une autre machine, le driver reste trouvable car il voyage dans le dossier du projet.</div>

<h3>2. Pourquoi ne pas coder les identifiants « en dur »</h3>
<p>Écrire l'URL, l'utilisateur et le mot de passe directement dans le code Java est une mauvaise pratique : c'est une <strong>faille de sécurité</strong> (les identifiants traînent dans le code) et un cauchemar à maintenir (il faut recompiler pour changer un mot de passe).</p>
<div class="warn">Ne jamais mettre un mot de passe de base de données « en dur » dans le code source. On l'externalise dans un fichier de configuration, tenu hors du code.</div>

<h3>3. Le fichier config.properties</h3>
<p>La bonne pratique est d'utiliser un fichier <strong>.properties</strong> : un simple fichier texte de paires <code>cle=valeur</code>. On y place les paramètres de connexion à la bibliothèque :</p>
<pre class="pseudo"># config.properties -- parametres de connexion a library_db
db.url=jdbc:mysql://localhost:3306/library_db
db.user=root
db.password=motdepasse</pre>
<p>Sous NetBeans (projet Ant), on crée ce fichier à la racine des sources : clic droit sur <strong>Source Packages</strong> puis <em>New &gt; Other... &gt; Other &gt; Properties File</em>, nommé <code>config</code> (ce qui donne <code>config.properties</code>).</p>

<h3>4. Charger la config avec un bloc static</h3>
<p>Une classe <code>DatabaseConfig</code> lira ce fichier <strong>une seule fois</strong>. On utilise un <strong>bloc static</strong> : un morceau de code exécuté automatiquement au moment où la classe est chargée en mémoire par la JVM (la machine virtuelle Java).</p>
<pre class="pseudo">public class DatabaseConfig {                          // classe de configuration
    private static Properties props = new Properties(); // stocke les cles/valeurs
    static {                                            // bloc static : execute une seule fois au chargement
        try (InputStream in =                           // ouvre le fichier
                DatabaseConfig.class.getResourceAsStream("/config.properties")) {
            props.load(in);                             // charge toutes les paires cle=valeur
        } catch (Exception e) {                         // en cas d'echec de lecture
            throw new RuntimeException("Config illisible", e);
        }
    }
    public static String getUrl()  { return props.getProperty("db.url"); }       // renvoie l'URL
    public static String getUser() { return props.getProperty("db.user"); }      // l'utilisateur
    public static String getPassword() { return props.getProperty("db.password"); } // le mot de passe
}</pre>

<h3>5. Pourquoi un bloc static ?</h3>
<p>Le support insiste sur trois raisons :</p>
<pre class="pseudo">Execution automatique -- le bloc part des que la classe est sollicitee, sans appel manuel
Efficacite            -- le fichier disque est lu UNE fois ; ensuite tout vient de la RAM (rapide)
Partage               -- il remplit les variables static partagees par toute l'application</pre>
<div class="tip">Charger la config une seule fois au démarrage est la base d'un <strong>Singleton</strong> (une instance unique de configuration) : le fichier n'est jamais relu inutilement. On approfondira ce patron demain avec la connexion.</div>`,

  ],

      { type: "input", q: "Méthode de Properties qui lit le fichier :", a: ["load", "load()"], ph: "méthode", exp: "load()." }
    ],
    solution: `<pre class="pseudo"># 1) config.properties (a la racine des Source Packages)
db.url=jdbc:mysql://localhost:3306/library_db
db.user=root
db.password=motdepasse

// 2) DatabaseConfig charge le fichier une fois via un bloc static
public class DatabaseConfig {                          // classe de configuration
    private static Properties props = new Properties(); // stockage des paires
    static {                                            // execute une seule fois
        try (InputStream in = DatabaseConfig.class
                .getResourceAsStream("/config.properties")) {
            props.load(in);                             // lecture du fichier
        } catch (Exception e) { throw new RuntimeException(e); }
    }
    public static String getUrl()  { return props.getProperty("db.url"); }
    public static String getUser() { return props.getProperty("db.user"); }
    public static String getPassword() { return props.getProperty("db.password"); }
}</pre>
<p>Le projet est configuré. Demain : établir et fermer réellement la connexion.</p>`
