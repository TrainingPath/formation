<h3>1. Le Statement</h3>
<p>Un <strong>Statement</strong> est l'objet JDBC qui envoie une requête SQL <strong>fixe</strong> à la base. On l'obtient depuis la connexion. Pour une lecture, on appelle <code>executeQuery(...)</code>, qui renvoie un <strong>ResultSet</strong>.</p>
<pre class="pseudo">Connection conn = DatabaseConnection.getInstance();   // connexion partagee (Singleton)
Statement st = conn.createStatement();                // cree un Statement
ResultSet rs = st.executeQuery("SELECT * FROM livres"); // executeQuery pour un SELECT</pre>
<div class="tip"><code>executeQuery</code> sert aux lectures (SELECT) et renvoie un ResultSet. Pour modifier des données (INSERT, UPDATE, DELETE), on utilisera <code>executeUpdate</code> (jour 15).</p>
</div>

<h3>2. Le ResultSet : un curseur sur les lignes</h3>
<p>Un <strong>ResultSet</strong> est le tableau de résultats renvoyé par un SELECT. Il agit comme un <strong>curseur</strong> qui pointe sur les lignes. Au départ, il est placé <em>avant</em> la première ligne. La méthode <code>next()</code> avance d'une ligne et renvoie <code>false</code> quand il n'y en a plus.</p>
<pre class="pseudo">while (rs.next()) {                                    // avance ligne par ligne tant qu'il y en a
    // ici, rs pointe sur une ligne : on peut lire ses colonnes
}</pre>

<h3>3. Extraire les colonnes avec le bon type</h3>
<p>On lit chaque colonne avec la méthode <code>getXxx</code> correspondant à son type SQL, par nom de colonne :</p>
<pre class="pseudo">rs.getInt("livre_id")         // colonne INT  -> int Java
rs.getString("titre")         // colonne VARCHAR -> String
rs.getDouble("prix_unitaire") // colonne DECIMAL -> double
rs.getBoolean("est_disponible") // colonne BOOLEAN/TINYINT(1) -> boolean (0=false, 1=true)</pre>
<div class="warn">Utilisez la méthode qui correspond au type SQL de la colonne. Un TINYINT(1) se lit avec <code>getBoolean</code> ; un DECIMAL avec <code>getDouble</code>. Se tromper de type provoque des erreurs de lecture.</div>

<h3>4. Un exemple complet de lecture</h3>
<p>Lisons tous les livres de la bibliothèque et affichons-les :</p>
<pre class="pseudo">try (Statement st = conn.createStatement();            // Statement auto-ferme (try-with-resources)
     ResultSet rs = st.executeQuery(                   // ResultSet auto-ferme aussi
         "SELECT livre_id, titre, prix_unitaire FROM livres")) {
    while (rs.next()) {                                 // parcourt chaque ligne
        int id = rs.getInt("livre_id");                // lit l'identifiant
        String titre = rs.getString("titre");          // lit le titre
        double prix = rs.getDouble("prix_unitaire");   // lit le prix
        System.out.println(id + " - " + titre + " : " + prix + " EUR");   // affiche la ligne
    }
} catch (SQLException e) {                              // erreur de lecture
    System.out.println("Erreur : " + e.getMessage());
}</pre>

<h3>5. Fermer les outils, pas la connexion</h3>
<p>Le <strong>Statement</strong> et le <strong>ResultSet</strong> sont des « outils » : on les ferme après usage pour éviter les <strong>fuites de mémoire</strong>. Le try-with-resources s'en charge. Mais on ne ferme <strong>pas</strong> la Connection (Singleton partagé).</p>
<pre class="pseudo">// try-with-resources ferme Statement ET ResultSet automatiquement
// la Connection (Singleton) reste ouverte pour la suite de l'application</pre>
<div class="tip">Pour une simple lecture totale (SELECT * sans filtre saisi par l'utilisateur), un Statement suffit. Dès qu'un filtre vient d'une saisie (WHERE ... = valeur_utilisateur), il faudra un <strong>PreparedStatement</strong> — c'est le sujet de demain.</div>`,
