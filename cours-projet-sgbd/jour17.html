  theory: `
<h3>1. Rappel : l'architecture MVC</h3>
<p>Le <strong>MVC</strong> (Modèle-Vue-Contrôleur) est une <em>architecture logicielle</em> : elle découpe l'application en trois responsabilités séparées, pour faciliter la maintenance et l'évolution.</p>
<ul>
<li><strong>M — Modèle</strong> : gère les données et la logique d'accès à la base (le SQL).</li>
<li><strong>V — Vue</strong> : gère l'interface. En mode console, ce sont les <code>System.out.println()</code> et les saisies <code>Scanner</code>.</li>
<li><strong>C — Contrôleur</strong> : fait le lien entre la Vue et le Modèle. Il reçoit les ordres de la Vue et pilote le Modèle.</li>
</ul>
<p>Aujourd'hui, nous commençons par le <strong>Modèle</strong>, appliqué à notre fil rouge : la base <code>library_db</code> (livres, auteurs, ventes, commissions).</p>

<h3>2. La classe entité (POJO) « intelligente »</h3>
<p>Un <strong>POJO</strong> (<em>Plain Old Java Object</em>, « bon vieil objet Java tout simple ») est une classe ordinaire : des attributs privés, un constructeur, des getters et setters. Une <strong>entité</strong> est un POJO qui représente une <em>ligne d'une table</em> de la base.</p>
<p>Dans ce cours, notre entité est <strong>intelligente</strong> : contrairement à un simple objet de données, elle <em>connaît sa table SQL</em> et porte ses propres méthodes CRUD. Ce style s'appelle <strong>Active Record</strong> : l'objet sait se lire, se sauvegarder et se supprimer tout seul. La Vue et le Contrôleur n'écrivent jamais de SQL.</p>
<div class="tip">CRUD = les quatre opérations de base sur des données : <strong>C</strong>reate (créer), <strong>R</strong>ead (lire), <strong>U</strong>pdate (mettre à jour), <strong>D</strong>elete (supprimer).</div>

<h3>3. Attributs et constructeur : l'entité Section</h3>
<p>Commençons par la table la plus simple, <code>sections</code> (colonnes <code>section_id</code>, <code>nom_section</code>). Chaque colonne devient un attribut privé.</p>
<pre class="pseudo">public class Section {                                  // entité : représente la table sections
    private int sectionId;                              // colonne section_id (clé primaire)
    private String nomSection;                          // colonne nom_section

    public Section() { }                                // constructeur vide : utile pour la lecture
    public Section(String nomSection) {                 // constructeur de création
        this.nomSection = nomSection;                   // on mémorise le nom reçu
    }
    public int getSectionId() { return sectionId; }     // getter : lu par la Vue
    public String getNomSection() { return nomSection; }
    public void setNomSection(String n) { this.nomSection = n; }   // setter : renseigné par le Contrôleur
}</pre>

<h3>4. Les quatre méthodes CRUD</h3>
<p>L'entité encapsule les requêtes SQL. Voici la création et la lecture. La connexion est obtenue par le <strong>Singleton</strong> <code>DatabaseConnection</code> (une instance unique, partagée par toute l'application).</p>
<pre class="pseudo">public boolean creer() {                                // insère l'objet courant dans la base
    String sql = "INSERT INTO sections (nom_section) VALUES (?)";   // requête paramétrée
    try {
        Connection conn = DatabaseConnection.getInstance().getConnection();   // connexion unique
        PreparedStatement pstmt = conn.prepareStatement(sql);   // requête préparée (sécurisée)
        pstmt.setString(1, this.nomSection);            // on injecte le nom à la place du ?
        int lignes = pstmt.executeUpdate();             // exécute l'INSERT ; renvoie le nb de lignes
        pstmt.close();                                  // on ferme l'outil, PAS la connexion
        return lignes &gt; 0;                              // vrai si une ligne a bien été insérée
    } catch (SQLException e) {                           // en cas d'erreur SQL
        return false;                                   // on signale l'échec au contrôleur
    }
}

public List&lt;Section&gt; lireTout() {                       // renvoie toutes les sections
    List&lt;Section&gt; liste = new ArrayList&lt;&gt;();             // liste résultat (vide au départ)
    String sql = "SELECT * FROM sections";              // on lit toute la table
    try {
        Connection conn = DatabaseConnection.getInstance().getConnection();
        Statement stmt = conn.createStatement();        // Statement simple (aucun paramètre)
        ResultSet rs = stmt.executeQuery(sql);          // exécute le SELECT ; renvoie les lignes
        while (rs.next()) {                             // pour chaque ligne du résultat
            Section s = new Section();                  // on crée un objet vide
            s.sectionId = rs.getInt("section_id");      // on remplit depuis la colonne
            s.nomSection = rs.getString("nom_section");
            liste.add(s);                               // on ajoute l'objet à la liste
        }
        rs.close(); stmt.close();                       // on ferme ResultSet et Statement
    } catch (SQLException e) { }
    return liste;                                       // on renvoie la liste d'objets Java
}</pre>
<p><code>mettreAJour()</code> (UPDATE … SET … WHERE section_id = ?) et <code>supprimer()</code> (DELETE … WHERE section_id = ?) suivent le même schéma : un <code>PreparedStatement</code>, puis <code>executeUpdate()</code>.</p>

<h3>5. Le Singleton : ne pas fermer la connexion</h3>
<p>Puisque la connexion est un <strong>Singleton</strong> (instance unique), la « porte » de la base doit rester ouverte tant que l'application tourne. On ne ferme que les <em>outils</em> de travail (<code>Statement</code>, <code>ResultSet</code>) à chaque opération, mais jamais la <code>Connection</code>.</p>
<div class="warn">Si on ferme la <code>Connection</code> dans une méthode CRUD, l'application se bloque après la première opération : la lecture fermerait la porte et empêcherait l'ajout suivant. On ferme les outils, on garde la connexion.</div>
<div class="tip">Le grand avantage : la Vue et le Contrôleur ignorent totalement le SQL. Si demain on passe de la console à JavaFX, seule la Vue change — le Modèle reste identique.</div>`,
