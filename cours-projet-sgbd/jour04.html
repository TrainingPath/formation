<script>
var DAY = {
  num: 4,
  title: "Peupler la base et vérifier l'intégrité",
  subtitle: "Insérer des données, respecter les clés étrangères, contrôler la cohérence.",
  theory: `
<h3>1. Insérer des lignes avec INSERT INTO</h3>
<p><strong>Peupler</strong> une base, c'est y insérer des données de départ. On utilise <code>INSERT INTO</code> :</p>
<pre class="pseudo">INSERT INTO sections (nom_section) VALUES     -- on precise la colonne a remplir
('Informatique'),                             -- premiere ligne
('Roman'),                                     -- deuxieme ligne
('Biographie'),
('Science-Fiction');                           -- plusieurs lignes en une seule commande</pre>
<p>On ne fournit pas <code>section_id</code> : il est <code>AUTO_INCREMENT</code>, donc le SGBD le calcule (1, 2, 3, 4...).</p>

<h3>2. Respecter l'ordre des dépendances</h3>
<p>Comme pour la création, on peuple les tables <strong>parents avant les enfants</strong>. Impossible d'ajouter une collection rattachée à l'éditeur n°1 si cet éditeur n'existe pas encore.</p>
<pre class="pseudo">INSERT INTO editions (nom_editeur) VALUES
('Dunod'), ('Gallimard'), ('Eyrolles');       -- editeurs 1, 2, 3

INSERT INTO collections (nom_collection, edition_id) VALUES
('InfoPro', 1),        -- collection rattachee a l'editeur 1 (Dunod)
('Folio', 2),          -- rattachee a Gallimard
('Design Web', 3);     -- rattachee a Eyrolles</pre>
<div class="warn">Si vous insérez une collection avec <code>edition_id = 99</code> alors qu'aucun éditeur n°99 n'existe, la clé étrangère rejette la ligne : c'est l'<strong>intégrité référentielle</strong> qui vous protège.</div>

<h3>3. L'apostrophe dans les chaînes SQL</h3>
<p>En SQL, une chaîne est encadrée par des apostrophes <code>' '</code>. Pour insérer un titre qui contient lui-même une apostrophe, on la <strong>double</strong> :</p>
<pre class="pseudo">INSERT INTO livres (titre, annee, nb_pages, prix_unitaire, section_id, collection_id) VALUES
('Apprendre le SQL', 2023, 350, 29.00, 1, 1),       -- livre 1
('L''etranger', 1942, 160, 12.50, 2, 2),            -- l'apostrophe est doublee : L''etranger
('CSS Avance', 2024, 420, 35.00, 1, 3);             -- livre 3</pre>
<div class="tip">Retenez ce détail : il annonce le jour 6. Un utilisateur mal intentionné pourra abuser de cette apostrophe pour « casser » une requête. C'est le début des injections SQL.</div>

<h3>4. Le déclencheur remplit les commissions</h3>
<p>Un <strong>déclencheur</strong> (TRIGGER) est un bloc de code que le SGBD exécute automatiquement lors d'un événement. Dans <code>library_db</code>, à chaque vente insérée, un déclencheur calcule et enregistre les commissions des auteurs :</p>
<pre class="pseudo">INSERT INTO ventes (client_id, livre_id, prix_final) VALUES
(1, 1, 29.00);    -- Alice achete 'Apprendre le SQL'
-- Le trigger trg_apres_vente_commission s'execute tout seul :
-- il calcule prix_final * (pourcentage_commission / 100) pour chaque auteur du livre
-- puis insere le resultat dans commissions_historique.</pre>
<p>On n'écrit donc jamais à la main dans <code>commissions_historique</code> : c'est le déclencheur qui la remplit. C'est une donnée <strong>dérivée</strong>, calculée à partir des ventes.</p>

<h3>5. Vérifier l'intégrité des données</h3>
<p><strong>Vérifier l'intégrité</strong>, c'est contrôler que les données sont cohérentes. On lit les tables et on croise les informations avec des <strong>jointures</strong> (JOIN) qui relient des lignes selon leurs clés :</p>
<pre class="pseudo">SELECT c.commission_id, a.nom AS Auteur, l.titre AS Livre,   -- colonnes voulues
       c.montant_du, c.statut_paiement
FROM commissions_historique c                                 -- table de depart
JOIN auteurs a ON c.auteur_id = a.auteur_id                   -- on relie l'auteur
JOIN ventes v ON c.vente_id = v.vente_id                      -- on relie la vente
JOIN livres l ON v.livre_id = l.livre_id;                     -- puis le livre vendu</pre>
<p>Si le déclencheur a bien travaillé, chaque vente d'un livre ayant des auteurs produit une ligne de commission cohérente. Vous venez de vérifier l'intégrité par le résultat.</p>`,
  exercises: [
    { type: "input", q: "Quelle commande SQL ajoute des lignes dans une table ? (deux mots)", a: ["insert into"], ph: "XXXXXX XXXX", exp: "INSERT INTO ajoute des lignes." },
    { type: "qcm", q: "Pourquoi n'insère-t-on pas soi-même la valeur de section_id ?", opts: ["C'est interdit par la loi", "Elle est AUTO_INCREMENT, le SGBD la génère", "Elle est toujours nulle", "Elle est chiffrée"], a: 1, exp: "AUTO_INCREMENT laisse le SGBD numéroter automatiquement." },
    { type: "vf", q: "On doit peupler les tables parents avant les tables enfants.", a: true, exp: "Sinon une clé étrangère pointerait vers une ligne inexistante." },
    { type: "qcm", q: "Comment insérer le titre L'étranger qui contient une apostrophe ?", opts: ["'L'etranger'", "'L''etranger' (apostrophe doublée)", "\"L'etranger\"", "L_etranger"], a: 1, exp: "On double l'apostrophe : 'L''etranger'." },
    { type: "input", q: "Comment appelle-t-on la règle qui empêche une clé étrangère de pointer vers une ligne inexistante ? (deux mots)", a: ["integrite referentielle", "intégrité référentielle"], ph: "XXX XXX", exp: "L'intégrité référentielle." },
    { type: "qcm", q: "Qu'est-ce qu'un déclencheur (TRIGGER) ?", opts: ["Un bouton de l'IDE", "Un code exécuté automatiquement par le SGBD lors d'un événement", "Une clé primaire", "Un type de données"], a: 1, exp: "Un trigger s'exécute tout seul lors d'un INSERT, UPDATE ou DELETE." },
    { type: "vf", q: "On remplit la table commissions_historique manuellement avec des INSERT.", a: false, exp: "C'est le déclencheur qui la remplit automatiquement après chaque vente." },
    { type: "qcm", q: "Dans library_db, quel événement déclenche le calcul des commissions ?", opts: ["Une lecture SELECT", "Un INSERT dans ventes", "La création d'une table", "Une connexion"], a: 1, exp: "AFTER INSERT ON ventes déclenche trg_apres_vente_commission." },
    { type: "input", q: "Quel mot-clé SQL relie des lignes de deux tables selon leurs clés ?", a: ["join"], ph: "MOT_CLE", exp: "JOIN réalise une jointure entre tables." },
    { type: "vf", q: "Le montant d'une commission est une donnée dérivée, calculée à partir de la vente.", a: true, exp: "montant_du = prix_final * pourcentage_commission / 100." },
    { type: "qcm", q: "On peut insérer plusieurs lignes en une seule commande INSERT.", opts: ["Non, jamais", "Oui, en séparant les groupes VALUES par des virgules", "Seulement avec un trigger", "Seulement dans clients"], a: 1, exp: "VALUES (...), (...), (...) insère plusieurs lignes d'un coup." },
    { type: "qcm", q: "Insérer une collection avec edition_id = 99 (inexistant) provoque…", opts: ["Rien", "Un rejet par la clé étrangère", "La création de l'éditeur 99", "Un doublon"], a: 1, exp: "L'intégrité référentielle rejette la ligne orpheline." },
    { type: "input", q: "Quel mot-clé, dans une jointure, exprime la condition de liaison (ex. c.auteur_id = a.auteur_id) ?", a: ["on"], ph: "MOT_CLE", exp: "JOIN ... ON condition." },
    { type: "vf", q: "Peupler une base signifie y insérer des données de départ.", a: true, exp: "C'est le rôle des INSERT initiaux." },
    { type: "qcm", q: "AS Auteur dans un SELECT sert à…", opts: ["Créer une table", "Renommer une colonne dans le résultat (alias)", "Supprimer une colonne", "Trier"], a: 1, exp: "AS donne un alias lisible à la colonne affichée." }
  ],
  final: {
    title: "Exercice final — Peupler proprement",
    intro: `<p>On insère des données et on contrôle qu'elles respectent les contraintes.</p>`,
    questions: [
      { type: "input", q: "Commande pour ajouter des lignes :", a: ["insert into"], ph: "XXXXXX XXXX", exp: "INSERT INTO." },
      { type: "qcm", q: "Pour insérer d'abord, on choisit :", opts: ["les ventes", "les tables parents (sections, editions)", "commissions_historique", "peu importe l'ordre"], a: 1, exp: "Parents d'abord, sinon clés étrangères orphelines." },
      { type: "vf", q: "Une apostrophe dans une chaîne SQL se double : 'L''etranger'.", a: true, exp: "Doublage de l'apostrophe." },
      { type: "qcm", q: "commissions_historique est remplie par :", opts: ["l'utilisateur", "un déclencheur après chaque vente", "un SELECT", "une clé étrangère"], a: 1, exp: "Le trigger AFTER INSERT ON ventes." },
      { type: "vf", q: "Une jointure JOIN sert à croiser les données de plusieurs tables pour vérifier leur cohérence.", a: true, exp: "JOIN relie les tables via leurs clés." }
    ],
    solution: `<pre class="pseudo">-- 1) Parents d'abord
INSERT INTO clients (nom, email) VALUES
('Alice Dubois', 'alice@email.com'),
('Bob Smith', 'bob@email.com');

-- 2) Une vente : le trigger calcule la commission tout seul
INSERT INTO ventes (client_id, livre_id, prix_final) VALUES
(1, 1, 29.00);    -- Alice achete 'Apprendre le SQL' (auteur : Jean Dupont, 15%)

-- 3) Verifier l'integrite par jointure
SELECT a.nom AS Auteur, l.titre AS Livre, c.montant_du
FROM commissions_historique c
JOIN auteurs a ON c.auteur_id = a.auteur_id
JOIN ventes  v ON c.vente_id  = v.vente_id
JOIN livres  l ON v.livre_id  = l.livre_id;
-- Resultat attendu : Dupont | Apprendre le SQL | 4.35  (29.00 * 15 / 100)</pre>
<p>La base vit et reste cohérente. Demain, on change de sujet : la sécurité et les injections SQL.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton script SQL ici…",
  items: [
  { id: "projsgbd-j04", title: "Insérer un livre et vérifier la commission", level: 2,
    statement: "Écris l'INSERT qui ajoute le livre 'Fondation' (année 1951, 255 pages, prix 18.00, section 4, collection 2) dans library_db. Explique en commentaire ce que fera le déclencheur si ce livre est ensuite vendu.",
    hints: [
      "INSERT INTO livres (titre, annee, nb_pages, prix_unitaire, section_id, collection_id) VALUES (...).",
      "Ne fournis pas livre_id : il est AUTO_INCREMENT.",
      "Après un INSERT dans ventes sur ce livre, le trigger insère une ligne dans commissions_historique."
    ],
    solution: "INSERT INTO livres (titre, annee, nb_pages, prix_unitaire, section_id, collection_id) VALUES\n('Fondation', 1951, 255, 18.00, 4, 2);   -- section 4 (Science-Fiction), collection 2 (Folio)\n\n-- Si on vend ensuite ce livre :\n-- INSERT INTO ventes (client_id, livre_id, prix_final) VALUES (3, <id_fondation>, 18.00);\n-- Le trigger trg_apres_vente_commission calcule 18.00 * (12 / 100) = 2.16\n-- (Asimov touche 12% sur Fondation) et l'insere dans commissions_historique.",
    note: "On ne renseigne jamais l'identifiant AUTO_INCREMENT ni la table commissions_historique à la main. Laisser le SGBD gérer les valeurs générées et les données dérivées évite les incohérences et respecte l'intégrité de la base." }
  ]
};
</script>
