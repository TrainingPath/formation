  title: "Les expressions régulières (regex) pour valider",
  subtitle: "Pattern, Matcher, matches, find : le langage des motifs.",
  theory: `
<h3>1. Qu'est-ce qu'une regex ?</h3>
<p>Une <strong>expression régulière</strong> (regex) est un <strong>motif</strong> (pattern) qui décrit une forme de texte. Au lieu de dire « lettres puis chiffres », on l'écrit avec des symboles. C'est l'outil idéal pour valider une saisie : email, code, date, montant.</p>

<h3>2. La syntaxe de base</h3>
<p>Quelques briques essentielles pour composer un motif :</p>
<pre class="pseudo">\\d    -- un chiffre (0-9)
\\D    -- tout sauf un chiffre
\\w    -- un caractere de mot (lettre, chiffre, underscore)
\\s    -- un espace blanc ; \\S : tout sauf un espace
.     -- n'importe quel caractere
[a-z] -- une lettre minuscule ; [A-Z0-9] : majuscule ou chiffre
[^..] -- negation : tout SAUF ce qui est entre crochets
^     -- debut de chaine ; $ : fin de chaine
+     -- 1 fois ou plus ; * : 0 fois ou plus ; ? : 0 ou 1 fois
{n}   -- exactement n fois ; {n,} : au moins n ; {n,m} : entre n et m</pre>

<h3>3. Le double antislash en Java</h3>
<p>Spécificité majeure de Java : le <code>\\</code> est déjà un caractère d'échappement dans les chaînes. Pour envoyer <code>\\d</code> au moteur de regex, on écrit <code>"\\\\d"</code> (double antislash).</p>
<pre class="pseudo">// Pour que le moteur recoive  \\d  on tape en Java :
String motif = "\\\\d+";     // \\d+ = un ou plusieurs chiffres</pre>
<div class="warn">Oublier le double antislash est l'erreur la plus fréquente : <code>"\\d"</code> ne compile pas comme prévu. Retenez : en Java, on double toujours l'antislash des regex.</div>

<h3>4. Les classes Pattern et Matcher</h3>
<p>En Java, deux classes portent les regex. <strong>Pattern</strong> représente le motif compilé ; <strong>Matcher</strong> confronte ce motif à une chaîne :</p>
<pre class="pseudo">import java.util.regex.*;                              // Pattern et Matcher
Pattern p = Pattern.compile("\\\\d+");                 // on compile le motif une fois
Matcher m = p.matcher("commande 2024");               // on l'applique a une chaine
if (m.find()) {                                        // find() : le motif apparait-il quelque part ?
    System.out.println("Trouve : " + m.group());       // group() : la portion trouvee (ici 2024)
}</pre>

<h3>5. matches() vs find()</h3>
<p>Deux usages à ne pas confondre :</p>
<pre class="pseudo">"abc123".matches("^[a-z]+\\\\d+$");   // matches : TOUTE la chaine doit correspondre -> validation
m.find();                            // find : le motif apparait QUELQUE PART -> extraction</pre>
<p>Pour <strong>valider</strong> une saisie, on utilise <code>matches</code> (avec <code>^</code> et <code>$</code>). Pour <strong>extraire</strong> des morceaux d'un long texte, on utilise <code>find</code> dans une boucle. Autre méthode utile de String : <code>replaceAll</code>, qui remplace via regex :</p>
<pre class="pseudo">String phrase = "L'annee 2024 sera 2024 fois mieux.";   // texte de depart
String r = phrase.replaceAll("\\\\d+", "2025");          // remplace chaque nombre par 2025</pre>
<div class="tip">Bonne pratique : si vous validez des milliers de chaînes dans une boucle, compilez le <code>Pattern</code> une seule fois <em>en dehors</em> de la boucle. C'est plus performant.</div>`,
  exercises: [
    { type: "input", q: "Quel symbole regex représente un chiffre ? (notation à taper telle quelle)", a: ["\\d"], ph: "symbole", exp: "\\d correspond à un chiffre 0-9." },
    { type: "qcm", q: "En Java, comment écrit-on \\d dans une chaîne ?", opts: ["\"\\d\"", "\"\\\\d\" (double antislash)", "\"d\"", "\"/d/\""], a: 1, exp: "On double l'antislash : \"\\\\d\"." },
    { type: "qcm", q: "Quelle classe Java représente le motif compilé ?", opts: ["Matcher", "Pattern", "String", "Scanner"], a: 1, exp: "Pattern.compile(...) compile le motif." },
    { type: "input", q: "Quelle méthode de String valide que TOUTE la chaîne correspond au motif ?", a: ["matches", "matches()"], ph: "méthode", exp: "matches vérifie la chaîne entière." },
    { type: "vf", q: "find() cherche si le motif apparaît quelque part dans la chaîne.", a: true, exp: "find() sert à l'extraction, pas à la validation complète." },
    { type: "input", q: "Quel symbole marque le début d'une chaîne dans une regex ?", a: ["^"], ph: "symbole", exp: "^ = début de chaîne." },
    { type: "qcm", q: "Que signifie [^0-9] ?", opts: ["Un chiffre", "Tout SAUF un chiffre", "Un espace", "Une majuscule"], a: 1, exp: "[^...] est une classe de négation." },
    { type: "input", q: "Quel symbole marque la fin d'une chaîne dans une regex ?", a: ["$"], ph: "symbole", exp: "$ = fin de chaîne." },
    { type: "qcm", q: "Le quantificateur + signifie…", opts: ["0 ou 1 fois", "1 fois ou plus", "exactement 1 fois", "0 fois ou plus"], a: 1, exp: "+ = une ou plusieurs occurrences." },
    { type: "input", q: "Quelle méthode de String remplace via une regex ?", a: ["replaceall", "replaceall()"], ph: "méthode", exp: "replaceAll(regex, remplacement)." },
    { type: "vf", q: "Pour valider une saisie, on encadre le motif de ^ et $ avec matches.", a: true, exp: "^...$ impose que toute la chaîne corresponde." },
    { type: "qcm", q: "Que renvoie m.group() après un find() réussi ?", opts: ["Le motif", "La portion de texte trouvée", "La longueur", "Un booléen"], a: 1, exp: "group() renvoie le texte capturé." },
    { type: "input", q: "Quelle notation regex signifie « exactement 4 chiffres » ?", a: ["\\d{4}"], ph: "\\d{...}", exp: "\\d{4} = quatre chiffres." },
    { type: "vf", q: "Compiler le Pattern hors d'une boucle améliore les performances.", a: true, exp: "On évite de recompiler le motif à chaque tour." },
    { type: "qcm", q: "Que fait matches(\"^[a-z]+\\\\d+$\") sur \"abc123\" ?", opts: ["Renvoie false", "Renvoie true (lettres puis chiffres)", "Lève une erreur", "Supprime les chiffres"], a: 1, exp: "Des minuscules suivies de chiffres : correspond." }
  ],
  final: {
    title: "Exercice final — Manier Pattern et Matcher",
    intro: `<p>On distingue validation et extraction.</p>`,
    questions: [
      { type: "input", q: "Symbole regex d'un chiffre :", a: ["\\d"], ph: "symbole", exp: "\\d." },
      { type: "qcm", q: "Pour valider toute la chaîne :", opts: ["find()", "matches() avec ^ et $", "group()", "replace()"], a: 1, exp: "matches encadré de ^ et $." },
      { type: "input", q: "En Java, écriture de \\d dans une chaîne :", a: ["\\\\d"], ph: "à taper", exp: "\\\\d (double antislash)." },
      { type: "vf", q: "Pattern.compile compile le motif ; Matcher l'applique à une chaîne.", a: true, exp: "Séparation motif / confrontation." },
      { type: "qcm", q: "Extraire tous les nombres d'un texte :", opts: ["matches()", "boucle sur find()", "trim()", "toUpperCase()"], a: 1, exp: "find() en boucle extrait chaque occurrence." }
    ],
    solution: `<pre class="pseudo">import java.util.regex.*;                                // Pattern, Matcher
// 1) VALIDER : le code d'inventaire ne contient que majuscules, chiffres, tirets
boolean ok = "SQL-001".matches("^[A-Z0-9-]+$");          // true

// 2) EXTRAIRE : tous les nombres d'un texte
Pattern p = Pattern.compile("\\\\d+");                    // motif compile une fois
Matcher m = p.matcher("Vente 3 du livre 5 pour 29 euros");
while (m.find()) {                                       // parcourt chaque occurrence
    System.out.println(m.group());                       // affiche 3, puis 5, puis 29
}</pre>
<p>Les bases sont posées. Demain : des regex concrètes pour emails, dates et montants de la bibliothèque.</p>`
