var DAY = {
  num: 5,
  title: "Penser sécurité : qu'est-ce qu'une injection SQL ?",
  subtitle: "Comprendre comment une saisie peut détourner la logique d'une requête.",
  theory: `
<h3>1. Penser sécurité avant tout</h3>
<p>Avant même de connecter Java à la base, il faut apprendre à <strong>penser sécurité</strong>. Une idée est capitale : la validation des données est de la responsabilité du <strong>code applicatif</strong> (Java), pas seulement de la couche base de données. Autrement dit, c'est votre programme qui doit se méfier de l'utilisateur.</p>

<h3>2. Qu'est-ce qu'une injection SQL ?</h3>
<p>Une <strong>injection SQL</strong> est une attaque où un utilisateur saisit, dans un simple champ de formulaire, des caractères spéciaux qui <strong>détournent la logique</strong> de la requête SQL. La saisie, au lieu d'être une simple donnée, devient du <strong>code</strong> exécuté par la base.</p>
<div class="warn">La cause profonde : on a construit la requête en <strong>concaténant</strong> (collant bout à bout) du texte fixe et la saisie de l'utilisateur. Si la saisie contient des apostrophes ou des mots-clés SQL, elle modifie le sens de la commande.</div>

<h3>3. La « requête fantôme » : un simulateur</h3>
<p>Pour comprendre sans base de données, on simule en Java. On demande un <code>username</code> et un <code>password</code>, et le programme affiche seulement la requête SQL <strong>brute</strong> qu'il aurait envoyée. C'est le simulateur de connexion, la « requête fantôme ».</p>
<pre class="pseudo">// Code VULNERABLE : la requete est construite par concatenation de chaines
String username = scanner.nextLine();               // saisie de l'utilisateur
String password = scanner.nextLine();               // saisie du mot de passe
String requete =                                    // on colle du texte fixe et la saisie
    "SELECT * FROM clients WHERE nom = '" + username // apostrophe ouvrante + saisie
    + "' AND motdepasse = '" + password + "';";      // fermeture + fin de requete
System.out.println(requete);                        // on affiche la requete fantome</pre>
<p>Pour une saisie normale <code>Alice</code> / <code>secret</code>, la requête devient :</p>
<pre class="pseudo">SELECT * FROM clients WHERE nom = 'Alice' AND motdepasse = 'secret';   -- logique normale</pre>

<h3>4. L'attaque : entrer sans mot de passe</h3>
<p>Le défi de l'attaquant : se connecter <strong>sans connaître le mot de passe</strong>. L'arme est une simple chaîne conçue pour manipuler la logique booléenne. Il tape dans le champ mot de passe :</p>
<pre class="pseudo">' OR '1'='1</pre>
<p>La requête fantôme devient alors :</p>
<pre class="pseudo">SELECT * FROM clients WHERE nom = 'Alice' AND motdepasse = '' OR '1'='1';
-- L'apostrophe ferme la chaine ''  puis  OR '1'='1'  est TOUJOURS vrai
-- Resultat : la condition entiere devient vraie, la porte s'ouvre</pre>
<div class="tip">Pourquoi la porte s'ouvre-t-elle ? Parce que <code>'1'='1'</code> est une comparaison toujours vraie. Reliée par <code>OR</code>, elle rend toute la condition <code>WHERE</code> vraie, quel que soit le mot de passe. Le filtre de sécurité est contourné.</div>

<h3>5. Le symbole -- : commenter la suite</h3>
<p>Autre arme classique : le commentaire SQL <code>--</code>. Tout ce qui suit <code>--</code> sur la ligne est ignoré par la base. L'attaquant tape dans le champ nom :</p>
<pre class="pseudo">Alice' --</pre>
<pre class="pseudo">SELECT * FROM clients WHERE nom = 'Alice' -- ' AND motdepasse = 'peu importe';
-- Tout ce qui suit -- est neutralise : la verification du mot de passe disparait</pre>
<p>La leçon d'aujourd'hui est conceptuelle : comprendre <strong>comment</strong> une saisie détourne une requête. Demain, on codera concrètement ce simulateur d'attaque en Java. La règle d'or, déjà : <strong>ne jamais faire confiance à l'utilisateur</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une injection SQL ?", opts: ["Une coupure de connexion au serveur SQL", "Une saisie qui détourne la logique d'une requête SQL", "Une sauvegarde de la base", "Un type de clé primaire"], a: 1, exp: "L'attaquant fait passer sa saisie pour du code SQL." },
    { type: "qcm", q: "Quelle pratique rend une requête vulnérable aux injections ?", opts: ["Utiliser des clés étrangères", "Concaténer la saisie utilisateur dans le texte SQL", "Créer un index", "Nommer les contraintes"], a: 1, exp: "La concaténation de chaînes mélange code et données." },
    { type: "input", q: "Quelle chaîne classique force la condition WHERE à être toujours vraie ? (tape-la)", a: ["' or '1'='1", "' or '1'='1'"], ph: "saisie malveillante", exp: "' OR '1'='1 rend la condition toujours vraie." },
    { type: "vf", q: "La validation des données est la responsabilité du code applicatif, pas seulement de la base.", a: true, exp: "C'est le principe de « penser sécurité »." },
    { type: "qcm", q: "Pourquoi '1'='1' ouvre-t-il la porte ?", opts: ["C'est une erreur de syntaxe ignorée par la base", "C'est une comparaison toujours vraie reliée par OR", "Ça supprime la table clients ciblée", "Ça compare le mot de passe chiffré stocké"], a: 1, exp: "Toujours vraie + OR = condition entière vraie." },
    { type: "input", q: "Quel symbole SQL met en commentaire la fin d'une ligne ?", a: ["--"], ph: "symbole", exp: "-- neutralise le reste de la ligne." },
    { type: "vf", q: "Avec ' OR '1'='1, l'attaquant peut se connecter sans connaître le mot de passe.", a: true, exp: "La condition devient toujours vraie, la vérification est contournée." },
    { type: "qcm", q: "Dans le simulateur (requête fantôme), le programme…", opts: ["Se connecte vraiment à MySQL", "Affiche seulement la requête SQL qu'il aurait envoyée", "Supprime la base après chaque test", "Chiffre la saisie avant de l'envoyer"], a: 1, exp: "Il n'y a pas de base : on affiche la requête brute pour comprendre." },
    { type: "input", q: "Quel opérateur booléen utilise l'attaque ' OR '1'='1 ?", a: ["or"], ph: "opérateur", exp: "OR relie la fausse condition à une condition toujours vraie." },
    { type: "vf", q: "Le symbole -- permet d'ignorer la vérification du mot de passe en commentant la suite.", a: true, exp: "Tout ce qui suit -- est ignoré par la base." },
    { type: "qcm", q: "La cause profonde de l'injection est…", opts: ["Un mot de passe trop court", "Le mélange entre code SQL et données saisies", "Un index manquant", "Une clé primaire composite"], a: 1, exp: "Données et code ne sont pas séparés lors de la concaténation." },
    { type: "qcm", q: "Quelle règle d'or résume la sécurité applicative ?", opts: ["Faire confiance à l'utilisateur", "Ne jamais faire confiance à l'utilisateur", "Désactiver les contraintes", "Tout stocker en clair"], a: 1, exp: "Ne jamais faire confiance à l'utilisateur." },
    { type: "input", q: "Dans la requête vulnérable, quel caractère la saisie ferme-t-elle pour sortir de la chaîne ?", a: ["'", "apostrophe", "l'apostrophe"], ph: "un caractère", exp: "L'apostrophe ' ferme la chaîne de caractères SQL." },
    { type: "vf", q: "Une injection SQL exploite le fait que la saisie est traitée comme du code.", a: true, exp: "La saisie devient exécutable au lieu de rester une simple donnée." },
    { type: "qcm", q: "Le simulateur « requête fantôme » sert surtout à…", opts: ["Accélérer la base", "Comprendre comment une saisie détourne une requête", "Créer des index", "Sauvegarder les données"], a: 1, exp: "C'est un outil pédagogique pour visualiser l'attaque." }
  ],
  final: {
    title: "Exercice final — Anatomie d'une injection",
    intro: `<p>On décortique une attaque étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "La requête de base : SELECT * FROM clients WHERE nom = '\" + saisie + \"'. Le danger vient de :", opts: ["Le SELECT", "La concaténation de la saisie", "Le nom de la table", "L'étoile *"], a: 1, exp: "La concaténation ouvre la porte à l'injection." },
      { type: "input", q: "Saisie qui contourne l'authentification :", a: ["' or '1'='1", "' or '1'='1'"], ph: "chaîne", exp: "' OR '1'='1." },
      { type: "vf", q: "'1'='1' est une comparaison toujours vraie.", a: true, exp: "Elle rend la condition entière vraie via OR." },
      { type: "qcm", q: "Le symbole -- sert à :", opts: ["Décrémenter une valeur de deux unités", "Mettre la fin de requête en commentaire", "Fermer la connexion", "Créer une table"], a: 1, exp: "Commentaire SQL de fin de ligne." },
      { type: "vf", q: "Ce cours prépare la défense : PreparedStatement et validation regex (jours suivants).", a: true, exp: "Comprendre l'attaque motive les défenses à venir." }
    ],
    solution: `<pre class="pseudo">// Requete construite par concatenation (VULNERABLE)
String req = "SELECT * FROM clients WHERE nom = '" + nom
           + "' AND motdepasse = '" + mdp + "';";

// Saisie honnete : nom = Alice, mdp = secret
// -> SELECT * FROM clients WHERE nom = 'Alice' AND motdepasse = 'secret';

// Saisie malveillante dans mdp : ' OR '1'='1
// -> SELECT * FROM clients WHERE nom = 'Alice' AND motdepasse = '' OR '1'='1';
//    '1'='1' est TOUJOURS vrai -> condition entiere vraie -> connexion forcee

// Saisie malveillante dans nom : Alice' --
// -> SELECT * FROM clients WHERE nom = 'Alice' -- ' AND motdepasse = '...';
//    le -- commente la verification du mot de passe.</pre>
<p>Vous comprenez le mécanisme. Demain, on code ce simulateur pour le voir « en vrai ».</p>`
  }
};
</script>
