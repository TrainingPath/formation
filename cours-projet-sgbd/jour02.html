<script>
var DAY = {
  num: 2,
  title: "Analyser le besoin et lire le modèle de données",
  subtitle: "Comprendre les tables, les colonnes et les relations avant de coder.",
  theory: `
<h3>1. Analyser le besoin</h3>
<p><strong>Analyser le besoin</strong>, c'est traduire une situation réelle en tables et en relations. Pour notre bibliothèque : on range des <strong>livres</strong> dans des <strong>sections</strong>, publiés par des <strong>éditeurs</strong> dans des <strong>collections</strong> ; des <strong>auteurs</strong> écrivent ces livres et touchent une <strong>commission</strong> à chaque vente à un <strong>client</strong>. Chaque phrase du besoin devient une table ou une relation.</p>

<h3>2. Colonne, clé primaire, clé étrangère</h3>
<p>Une <strong>colonne</strong> décrit un attribut (un titre, un prix). Deux notions structurent tout modèle :</p>
<pre class="pseudo">Cle primaire (PK)    -- colonne qui identifie de facon unique chaque ligne d'une table
Cle etrangere (FK)   -- colonne qui pointe vers la cle primaire d'une autre table</pre>
<p>La <strong>clé primaire</strong> (PRIMARY KEY) garantit qu'aucune ligne ne se répète. La <strong>clé étrangère</strong> (FOREIGN KEY) crée un lien entre deux tables : par exemple, un livre pointe vers sa section.</p>

<h3>3. Lire la table livres</h3>
<p>Voici la table centrale du catalogue, telle qu'elle est définie dans <code>library_db</code> :</p>
<pre class="pseudo">CREATE TABLE livres (
    livre_id INT AUTO_INCREMENT,          -- identifiant unique, genere automatiquement
    titre VARCHAR(255) NOT NULL,          -- titre du livre, obligatoire (NOT NULL)
    annee YEAR,                           -- annee de publication
    nb_pages INT,                         -- nombre de pages
    prix_unitaire DECIMAL(10, 2) NOT NULL,-- prix, avec 2 decimales, obligatoire
    section_id INT,                       -- vers quelle section (cle etrangere)
    collection_id INT,                    -- vers quelle collection (cle etrangere)
    CONSTRAINT pk_livres PRIMARY KEY (livre_id),   -- livre_id est la cle primaire
    CONSTRAINT fk_livres_section FOREIGN KEY (section_id) REFERENCES sections(section_id)
);</pre>
<p><code>VARCHAR(255)</code> est une chaîne de texte d'au plus 255 caractères ; <code>DECIMAL(10,2)</code> est un nombre à 2 décimales (idéal pour un prix) ; <code>INT</code> est un entier ; <code>AUTO_INCREMENT</code> demande au SGBD de numéroter tout seul.</p>
<div class="tip"><code>NOT NULL</code> signifie « valeur obligatoire » : impossible d'enregistrer un livre sans titre ni sans prix.</div>

<h3>4. Les relations de library_db</h3>
<p>Les clés étrangères tissent la toile des relations. Lisez-les comme des phrases :</p>
<pre class="pseudo">collections.edition_id  -> editions      -- une collection appartient a un editeur
livres.section_id       -> sections      -- un livre est range dans une section
livres.collection_id    -> collections   -- un livre appartient a une collection
exemplaires.livre_id    -> livres        -- un exemplaire est une copie d'un livre
livre_auteur.livre_id   -> livres        -- liaison : un livre...
livre_auteur.auteur_id  -> auteurs       -- ...ecrit par un auteur
ventes.client_id        -> clients       -- une vente concerne un client
ventes.livre_id         -> livres        -- une vente porte sur un livre</pre>

<h3>5. La relation « plusieurs-à-plusieurs »</h3>
<p>Un livre peut avoir plusieurs auteurs, et un auteur écrit plusieurs livres : c'est une relation <strong>plusieurs-à-plusieurs</strong>. On la représente par une <strong>table de liaison</strong>, ici <code>livre_auteur</code>, qui porte en plus une donnée propre à chaque paire : le pourcentage de commission.</p>
<pre class="pseudo">CREATE TABLE livre_auteur (
    livre_id INT NOT NULL,                        -- vers quel livre
    auteur_id INT NOT NULL,                       -- vers quel auteur
    pourcentage_commission DECIMAL(5, 2) DEFAULT 10.00,  -- part de l'auteur (10% par defaut)
    CONSTRAINT pk_livre_auteur PRIMARY KEY (livre_id, auteur_id)   -- cle primaire composite
);</pre>
<p>Ici la clé primaire est <strong>composite</strong> : elle combine <code>livre_id</code> et <code>auteur_id</code>. Un même auteur ne peut donc être associé qu'une seule fois à un même livre.</p>
<div class="warn">Ne pas confondre un livre (une œuvre, table <code>livres</code>) et un exemplaire (une copie physique en rayon, table <code>exemplaires</code>). Un livre peut avoir plusieurs exemplaires.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une clé primaire ?", opts: ["Un mot de passe protégeant l'accès à la table", "Une colonne qui identifie chaque ligne de façon unique", "Une colonne qui stocke le prix d'un livre", "Un lien hypertexte vers une page externe"], a: 1, exp: "La clé primaire (PRIMARY KEY) identifie chaque ligne de manière unique." },
    { type: "qcm", q: "À quoi sert une clé étrangère ?", opts: ["À chiffrer les données sensibles d'une table", "À relier une table à la clé primaire d'une autre table", "À trier automatiquement les lignes d'une table", "À supprimer une table devenue inutile"], a: 1, exp: "La clé étrangère (FOREIGN KEY) crée un lien entre deux tables." },
    { type: "input", q: "Quel type SQL utilise-t-on pour un prix à deux décimales ? (avec ses paramètres)", a: ["decimal(10,2)", "decimal(10, 2)"], ph: "TYPE(x,y)", exp: "prix_unitaire est un DECIMAL(10,2)." },
    { type: "vf", q: "NOT NULL signifie que la colonne doit obligatoirement contenir une valeur.", a: true, exp: "NOT NULL interdit l'absence de valeur." },
    { type: "qcm", q: "La colonne livres.section_id est…", opts: ["Une clé primaire", "Une clé étrangère vers sections", "Une colonne de texte libre", "Une colonne de type booléen"], a: 1, exp: "section_id pointe vers la clé primaire de la table sections." },
    { type: "input", q: "Quel mot-clé demande au SGBD de numéroter automatiquement une clé primaire ?", a: ["auto_increment"], ph: "MOT_CLE", exp: "AUTO_INCREMENT génère l'identifiant." },
    { type: "vf", q: "Un livre et un exemplaire sont exactement la même chose.", a: false, exp: "Un livre est une œuvre ; un exemplaire est une copie physique de ce livre." },
    { type: "qcm", q: "Pourquoi la table livre_auteur existe-t-elle ?", opts: ["Pour stocker le prix unitaire des livres", "Pour gérer la relation plusieurs-à-plusieurs entre livres et auteurs", "Pour enregistrer les emails des clients", "Pour classer les livres par section"], a: 1, exp: "C'est la table de liaison de la relation N-N livres/auteurs." },
    { type: "qcm", q: "La clé primaire de livre_auteur est…", opts: ["livre_id seul", "auteur_id seul", "composite : (livre_id, auteur_id)", "pourcentage_commission"], a: 2, exp: "Clé primaire composite sur (livre_id, auteur_id)." },
    { type: "input", q: "Quel type SQL représente un texte court (ex. un titre) de longueur maximale ?", a: ["varchar", "varchar(255)"], ph: "TYPE", exp: "VARCHAR stocke une chaîne de longueur limitée." },
    { type: "vf", q: "Une clé étrangère peut pointer vers la clé primaire d'une autre table.", a: true, exp: "C'est précisément son rôle : référencer une autre table." },
    { type: "qcm", q: "collections.edition_id relie une collection à…", opts: ["un client", "un éditeur (editions)", "une vente", "un exemplaire"], a: 1, exp: "Une collection appartient à un éditeur via edition_id." },
    { type: "input", q: "Quel type SQL représente un entier ?", a: ["int", "integer"], ph: "TYPE", exp: "INT (ou INTEGER) pour un entier." },
    { type: "qcm", q: "ventes.livre_id et ventes.client_id sont…", opts: ["Deux clés primaires", "Deux clés étrangères", "Deux textes", "Deux dates"], a: 1, exp: "Une vente référence un livre et un client via deux clés étrangères." },
    { type: "vf", q: "Analyser le besoin, c'est traduire une situation réelle en tables et relations.", a: true, exp: "C'est l'étape de modélisation, avant toute création de base." }
  ],
  final: {
    title: "Exercice final — Lire le modèle",
    intro: `<p>On vérifie que vous savez lire une définition de table et ses relations.</p>`,
    questions: [
      { type: "qcm", q: "Dans la table livres, la clé primaire est :", opts: ["titre", "livre_id", "prix_unitaire", "section_id"], a: 1, exp: "livre_id, en AUTO_INCREMENT." },
      { type: "input", q: "Colonne de livre_auteur qui porte la part de l'auteur :", a: ["pourcentage_commission"], ph: "nom_colonne", exp: "pourcentage_commission (DECIMAL(5,2))." },
      { type: "vf", q: "exemplaires.livre_id est une clé étrangère vers livres.", a: true, exp: "Chaque exemplaire référence son livre." },
      { type: "qcm", q: "Une relation plusieurs-à-plusieurs se représente par :", opts: ["une seule colonne", "une table de liaison", "un déclencheur", "un index"], a: 1, exp: "Une table de liaison (ici livre_auteur)." },
      { type: "vf", q: "Une clé primaire peut être composite (plusieurs colonnes).", a: true, exp: "Ex. (livre_id, auteur_id) dans livre_auteur." }
    ],
    solution: `<pre class="pseudo">-- Lecture guidee de la table livres
-- livre_id       PK, AUTO_INCREMENT   -> identifie chaque livre
-- titre          VARCHAR(255) NOT NULL-> obligatoire
-- prix_unitaire  DECIMAL(10,2) NOT NULL
-- section_id     FK -> sections       -> le rayon du livre
-- collection_id  FK -> collections    -> la collection du livre
--
-- Relation N-N livres/auteurs geree par livre_auteur :
--   PK composite (livre_id, auteur_id)
--   colonne propre : pourcentage_commission</pre>
<p>Le modèle est clair. Demain, on écrit le script CREATE TABLE pour construire cette base.</p>`
  }
};
</script>
