  theory: `
<h3>1. Vue d'ensemble : ce que l'on a construit</h3>
<p>En 31 jours, on a bâti une application de gestion de bibliothèque de bout en bout. Le projet final consiste à <strong>tout assembler</strong> et à vérifier que chaque couche communique proprement avec les autres.</p>
<pre class="pseudo">Base de données  →  library_db (tables, contraintes, trigger, procédure, vue)
Connexion        →  DatabaseConnection (Singleton) + config.properties (JDBC)
Modèle           →  Beans (Livre, Auteur, Client…) + DAO (LivreDAO, AuteurDAO…)
Contrôleur       →  logique métier, gestion des erreurs (Alert), validation
Vue              →  JavaFX (TableView, TextField, Button, VBox/HBox)</pre>

<h3>2. L'architecture en couches</h3>
<p>Chaque couche ne connaît que sa voisine directe. La Vue parle au Contrôleur ; le Contrôleur parle au DAO ; le DAO parle à la base via le Singleton. Ce <strong>découplage</strong> est ce qui a permis de passer de la console à JavaFX en ne changeant quasiment que la Vue.</p>
<div class="tip">Le fil conducteur de tout le cours : <em>séparation des responsabilités</em>. Une classe = un rôle. C'est ce qui rend l'application testable, maintenable et évolutive.</div>

<h3>3. Le scénario métier complet</h3>
<p>Un parcours utilisateur type, qui traverse toutes les couches :</p>
<pre class="pseudo">1. Créer un Livre (choisir sa section/collection existantes)   -- CRUD + FK
2. Créer un Auteur                                             -- CRUD
3. Lier livre ↔ auteur avec un pourcentage de commission       -- relation N:M
4. Enregistrer une Vente (dans une transaction)                -- le trigger crée la commission
5. Consulter l'état des commissions                            -- vue v_etat_commissions
6. Régler un auteur                                            -- procédure sp_regler_commissions_auteur</pre>
<div class="warn">Ordre des dépendances : on ne peut vendre un livre qui n'existe pas, ni lier un auteur absent. L'intégrité référentielle (FK) impose cet enchaînement — et la base le fait respecter.</div>

<h3>4. La checklist de qualité</h3>
<ul>
<li><strong>Sécurité</strong> : partout des <code>PreparedStatement</code> (anti-injection), identifiants dans <code>config.properties</code>.</li>
<li><strong>Robustesse</strong> : le DAO propage (<code>throws SQLException</code>), le Contrôleur affiche des <code>Alert</code>, la saisie est validée (regex).</li>
<li><strong>Cohérence</strong> : transactions (<code>commit</code>/<code>rollback</code>) pour les opérations multi-étapes ; connexion Singleton non fermée dans les DAO.</li>
<li><strong>Découplage</strong> : aucun SQL dans la Vue ni le Contrôleur ; aucune logique d'affichage dans le DAO.</li>
</ul>

<h3>5. L'énoncé du projet final</h3>
<p>Objectif : livrer une application JavaFX qui gère <strong>livres</strong>, <strong>auteurs</strong> et <strong>ventes</strong>, et affiche l'<strong>état des commissions</strong>.</p>
<pre class="pseudo">Écrans attendus :
  • Onglet Livres   : TableView + formulaire (Ajouter / Modifier / Supprimer), validation
  • Onglet Auteurs  : TableView + formulaire CRUD
  • Onglet Ventes   : sélection client + livre, bouton « Enregistrer » (transaction)
  • Onglet Commissions : TableView (lecture de v_etat_commissions) + bouton « Régler »
Contraintes :
  • MVC + DAO strict (aucun SQL hors DAO)
  • PreparedStatement partout, CallableStatement pour la procédure
  • Gestion d'erreurs par Alert, validation regex des saisies</pre>
<div class="tip">Ce n'est pas un exercice « de plus » : c'est la synthèse de tout le cours. Prends le temps de relire les jours 17 à 30 comme autant de briques à emboîter. Les deux exercices d'écriture ci-dessous te guident sur les deux morceaux les plus intégrateurs : le scénario de vente complet et l'onglet de reporting.</div>`,

  ],

    questions: [
      { type: "qcm", q: "L'ordre correct pour tester le métier :", opts: ["Vente → Livre → Auteur", "Livre → Auteur → Lier → Vente → Régler", "Régler → Vente → Livre", "Auteur → Vente → Livre"], a: 1, exp: "On respecte les dépendances FK." },

    ],
    solution: `<pre class="pseudo">// PLAN DE CORRIGÉ — Application bibliothèque complète

// 1. Connexion (déjà en place)

// 2. Modèle : un Bean + un DAO par table

btnEnregistrerVente.setOnAction(e -&gt; {
    if (!venteValide()) return;                         // validation
    try {

// 6. Reporting + règlement
//    tableCommissions.setItems(commDao.etatCommissions());   // vue SQL

<p>Félicitations : tu as parcouru toute la chaîne, de la table SQL à l'écran JavaFX. Tu sais désormais concevoir, sécuriser et faire évoluer une vraie application connectée à une base de données.</p>`

    solution: "public void enregistrerVente() {                        // scenario de vente complet\n    Client client = tableClients.getSelectionModel().getSelectedItem();\n    Livre livre = tableLivres.getSelectionModel().getSelectedItem();\n    if (client == null || livre == null) {              // selections obligatoires\n        alerte(\"Choisis un client ET un livre.\", Alert.AlertType.WARNING);\n        return;                                         // on arrete l'action\n    }\n    double prix;\n    try {\n        prix = Double.parseDouble(champPrix.getText()); // texte -> double\n    } catch (NumberFormatException ex) {                // prix non numerique\n        alerte(\"Prix invalide (ex : 18.50).\", Alert.AlertType.ERROR);\n        return;\n    }\n    try {\n        // la methode DAO ouvre une transaction ; le trigger cree les commissions\n        venteDao.enregistrerVente(client.getClientId(), livre.getId(), prix);\n        rafraichirCommissions();                        // relit v_etat_commissions\n        alerte(\"Vente enregistree, commissions calculees.\", Alert.AlertType.INFORMATION);\n    } catch (SQLException ex) {                          // erreur base (FK, transaction...)\n        alerte(\"Erreur base : \" + ex.getMessage(), Alert.AlertType.ERROR);\n    }\n}\n\nprivate void alerte(String message, Alert.AlertType type) {   // helper d'affichage\n    Alert a = new Alert(type);\n    a.setContentText(message);\n    a.showAndWait();\n}",
    note: "Cette méthode est le point de convergence du cours : elle mobilise la sélection JavaFX (getSelectedItem), la conversion et la validation (parseDouble + catch), la transaction du DAO (enregistrerVente), le trigger SQL (qui remplit commissions_historique tout seul), et le reporting (rafraichirCommissions lit la vue). Chaque couche joue son rôle sans empiéter sur les autres : la Vue sélectionne, le Contrôleur orchestre et affiche, le DAO transige, la base calcule." },
  { id: "projsgbd-j31b", title: "L'onglet Commissions : reporting + règlement", level: 3,

    solution: "private ObservableList<EtatCommission> donneesComm = FXCollections.observableArrayList();\nprivate CommissionDAO commDao = new CommissionDAO();\n\npublic void rafraichirCommissions() {                   // lecture du reporting (vue SQL)\n    try {\n        donneesComm.setAll(commDao.etatCommissions());  // SELECT * FROM v_etat_commissions\n    } catch (SQLException e) {                           // base coupee ?\n        Alert a = new Alert(Alert.AlertType.ERROR);\n        a.setContentText(\"Impossible de charger l'etat des commissions : \" + e.getMessage());\n        a.showAndWait();\n    }\n}\n\n// bouton \"Regler les commissions\" de l'auteur selectionne\nbtnRegler.setOnAction(e -> {\n    Auteur sel = tableAuteurs.getSelectionModel().getSelectedItem();  // auteur choisi\n    if (sel == null) {                                  // aucune selection\n        Alert w = new Alert(Alert.AlertType.WARNING);\n        w.setContentText(\"Selectionne un auteur a regler.\");\n        w.showAndWait();\n        return;\n    }\n    try {\n        String rapport = commDao.reglerCommissions(sel.getAuteurId());  // procedure stockee\n        Alert ok = new Alert(Alert.AlertType.INFORMATION);\n        ok.setContentText(rapport);                     // affiche le rapport de paiement\n        ok.showAndWait();\n        rafraichirCommissions();                        // l'etat se met a jour (EN_ATTENTE -> PAYE)\n    } catch (SQLException ex) {\n        Alert err = new Alert(Alert.AlertType.ERROR);\n        err.setContentText(\"Erreur lors du reglement : \" + ex.getMessage());\n        err.showAndWait();\n    }\n});",
    note: "L'onglet Commissions illustre la distinction consulter / agir : rafraichirCommissions() LIT la vue v_etat_commissions (synthese en lecture seule), tandis que le bouton Regler AGIT via la procedure sp_regler_commissions_auteur (elle bascule les statuts en PAYE cote base). Apres le reglement, on relit la vue pour refleter le nouvel etat. Ni la Vue ni le Controleur ne connaissent le detail des jointures ou du calcul : tout est encapsule dans le SQL. C'est l'aboutissement de l'architecture construite pendant 31 jours." }
