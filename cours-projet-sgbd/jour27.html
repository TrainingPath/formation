<script>
var DAY = {
  num: 27,
  title: "CRUD graphique : afficher et ajouter",
  subtitle: "Un formulaire de saisie, un bouton Ajouter, un tableau qui se rafraîchit.",
  theory: `
<h3>1. L'écran de gestion</h3>
<p>On assemble l'écran complet : en haut un <strong>formulaire</strong> (des <code>TextField</code> + un bouton <em>Ajouter</em>), en dessous le <strong>TableView</strong> qui liste les livres. Au démarrage, on appelle <code>rafraichirListe()</code> pour afficher l'existant.</p>
<pre class="pseudo">TextField champTitre = new TextField();  champTitre.setPromptText("Titre");
TextField champAnnee = new TextField();  champAnnee.setPromptText("Année");
TextField champPrix  = new TextField();  champPrix.setPromptText("Prix");
Button btnAjouter = new Button("Ajouter");
HBox form = new HBox(10, champTitre, champAnnee, champPrix, btnAjouter);
VBox racine = new VBox(10, form, table);               // formulaire au-dessus du tableau</pre>

<h3>2. Lire les TextField et convertir</h3>
<p>Les <code>TextField</code> renvoient toujours du <strong>texte</strong> (<code>getText()</code>). Pour l'année et le prix, il faut <strong>convertir</strong> : <code>Integer.parseInt(...)</code> et <code>Double.parseDouble(...)</code>.</p>
<pre class="pseudo">String titre = champTitre.getText();                    // texte brut
int annee = Integer.parseInt(champAnnee.getText());     // texte → entier
double prix = Double.parseDouble(champPrix.getText());  // texte → double</pre>
<div class="warn">Si l'utilisateur tape « abc » dans le champ Prix, <code>parseDouble</code> lève une <code>NumberFormatException</code>. On l'entoure d'un <code>try-catch</code> pour afficher une Alert plutôt que de planter (validation approfondie au jour 29).</div>

<h3>3. Le clic Ajouter : du champ au DAO</h3>
<p>Au clic, le contrôleur construit un <code>Livre</code>, appelle <code>dao.creer(livre)</code>, puis rafraîchit le tableau et vide les champs.</p>
<pre class="pseudo">btnAjouter.setOnAction(e -&gt; {                           // au clic sur « Ajouter »
    try {
        Livre l = new Livre();                          // on construit le Bean
        l.setTitre(champTitre.getText());
        l.setAnnee(Integer.parseInt(champAnnee.getText()));
        l.setPrix(Double.parseDouble(champPrix.getText()));
        dao.creer(l);                                   // on insère via le DAO
        rafraichirListe();                              // le tableau se met à jour
        viderChamps();                                  // on nettoie le formulaire
    } catch (NumberFormatException ex) {                // saisie non numérique
        alerte("Année et prix doivent être des nombres.");
    } catch (SQLException ex) {                          // erreur base (ex : FK invalide)
        alerte("Erreur base : " + ex.getMessage());
    }
});</pre>

<h3>4. Rafraîchir et vider</h3>
<p>Après un ajout réussi, on recharge l'<code>ObservableList</code> (le nouveau livre apparaît) et on remet les champs à vide avec <code>setText("")</code>.</p>
<pre class="pseudo">private void viderChamps() {                            // remet le formulaire à zéro
    champTitre.setText(""); champAnnee.setText(""); champPrix.setText("");
}</pre>

<h3>5. Un feedback clair</h3>
<p>On informe toujours l'utilisateur : Alert d'<strong>information</strong> en cas de succès, Alert d'<strong>erreur</strong> sinon. Une méthode utilitaire évite de répéter le code.</p>
<pre class="pseudo">private void alerte(String message) {                   // helper d'affichage
    Alert a = new Alert(Alert.AlertType.INFORMATION);
    a.setContentText(message);
    a.showAndWait();
}</pre>
<div class="tip">Rappel : une FK invalide (section_id inexistant) déclenche une <code>SQLException</code> à l'INSERT. Grâce au <code>throws</code> du DAO, le contrôleur l'attrape et affiche un message plutôt que de laisser un clic sans effet.</div>`,

    { type: "qcm", q: "setOnAction sert à…", opts: ["Créer un nouveau bouton", "Associer une action au clic du bouton", "Définir le texte du bouton", "Fermer la fenêtre"], a: 1, exp: "Événement du Button." },
    { type: "vf", q: "On peut entourer la conversion + l'INSERT d'un même try-catch.", a: true, exp: "On attrape NumberFormatException et SQLException." },
    { type: "qcm", q: "En cas de succès, on affiche…", opts: ["Rien", "Une Alert d'information", "Une Alert d'erreur", "Un println console"], a: 1, exp: "Feedback positif." },
    { type: "input", q: "Conteneur horizontal pour aligner champs + bouton : _____", a: ["HBox", "hbox"], exp: "HBox pour le formulaire." },
    { type: "vf", q: "Le contrôleur construit un Livre puis appelle dao.creer(livre).", a: true, exp: "Le DAO fait l'INSERT." },
    { type: "qcm", q: "Pourquoi une méthode utilitaire alerte(String) ?", opts: ["Pour valider les saisies utilisateur", "Pour éviter de répéter le code d'Alert", "Pour fermer la connexion à la base", "Pour rafraîchir le TableView"], a: 1, exp: "Factorisation." },
    { type: "vf", q: "Le TableView affiche l'existant dès le démarrage via rafraichirListe().", a: true, exp: "Chargement initial." }
  ],
  final: {
    title: "Exercice final — Le bouton Ajouter",
    intro: `<p>On câble le formulaire de saisie et le bouton Ajouter d'un livre.</p>`,
    questions: [
      { type: "qcm", q: "Pour lire l'année saisie, on écrit…", opts: ["champAnnee.getText()", "Integer.parseInt(champAnnee.getText())", "champAnnee.getInt()", "Integer.valueOf(champAnnee)"], a: 1, exp: "Texte converti en entier." },
      { type: "qcm", q: "Après dao.creer(l), on appelle…", opts: ["rollback()", "rafraichirListe() puis viderChamps()", "fermer la connexion", "vider le TableView"], a: 1, exp: "Mise à jour + nettoyage." },
      { type: "qcm", q: "Une saisie non numérique est attrapée par…", opts: ["catch(SQLException)", "catch(NumberFormatException)", "catch(IOException)", "catch(NullPointerException)"], a: 1, exp: "Conversion invalide." },
      { type: "vf", q: "Le bouton réagit via setOnAction(e -> ...).", a: true, exp: "Événementiel." },
      { type: "vf", q: "Une FK invalide est attrapée par catch(SQLException).", a: true, exp: "Erreur base à l'INSERT." }
    ],
    solution: `<pre class="pseudo">btnAjouter.setOnAction(e -&gt; {                           // clic « Ajouter »
    try {
        Livre l = new Livre();                          // construit le Bean
        l.setTitre(champTitre.getText());               // texte brut
        l.setAnnee(Integer.parseInt(champAnnee.getText()));   // texte → int
        l.setPrix(Double.parseDouble(champPrix.getText()));   // texte → double
        l.setSectionId(Integer.parseInt(champSection.getText()));
        dao.creer(l);                                   // INSERT via le DAO
        rafraichirListe();                              // la nouvelle ligne apparaît
        viderChamps();                                  // formulaire remis à zéro
        alerte("Livre ajouté.", Alert.AlertType.INFORMATION);
    } catch (NumberFormatException ex) {                // saisie non numérique
        alerte("Année, prix et section doivent être des nombres.", Alert.AlertType.ERROR);
    } catch (SQLException ex) {                          // ex : FK section invalide
        alerte("Erreur base : " + ex.getMessage(), Alert.AlertType.ERROR);
    }
});

private void viderChamps() {
    champTitre.setText(""); champAnnee.setText("");
    champPrix.setText(""); champSection.setText("");
}</pre>
<p>Ajouter fonctionne en graphique. Demain : modifier et supprimer une ligne sélectionnée.</p>`
  }
};
</script>
