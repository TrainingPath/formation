  theory: `
<h3>1. Pourquoi valider dans l'IHM ?</h3>
<p>La base a ses contraintes (<code>CHECK</code>, <code>NOT NULL</code>, FK), mais mieux vaut <strong>prévenir</strong> que guérir : valider côté application donne un <em>retour immédiat</em> à l'utilisateur, évite des allers-retours réseau inutiles et des messages d'erreur techniques. On vérifie donc chaque <code>TextField</code> <em>avant</em> d'appeler le DAO.</p>
<div class="tip">Deux barrières complémentaires : la validation applicative (rapide, conviviale) et les contraintes SQL (dernière garantie d'intégrité). Les deux se renforcent.</div>

<h3>2. Les expressions régulières (regex)</h3>
<p>Une <strong>expression régulière</strong> (regex) est un <em>motif</em> qui décrit la forme attendue d'un texte. Symboles de base : <code>\\d</code> (un chiffre), <code>[A-Z]</code> (une majuscule), <code>+</code> (un ou plusieurs), <code>{2,}</code> (au moins 2), <code>^</code> (début), <code>$</code> (fin).</p>
<div class="warn">En Java, l'antislash se double : on écrit <code>"\\d"</code> dans le code pour représenter <code>\\d</code>. C'est une source d'erreurs fréquente.</div>

<h3>3. Pattern et Matcher</h3>
<p>Deux classes gèrent les regex en Java : <strong>Pattern</strong> (le motif compilé) et <strong>Matcher</strong> (le vérificateur). Pour valider une chaîne entière, le plus simple est <code>String.matches(motif)</code>.</p>
<pre class="pseudo">String email = champEmail.getText();
String motif = "^[\\w.-]+@[\\w.-]+\\.[a-z]{2,}$";       // motif d'un e-mail simple
if (!email.matches(motif)) {                            // la chaîne ne correspond pas
    alerte("E-mail invalide.");                         // on prévient
    return;                                             // et on stoppe l'insertion
}</pre>
<div class="tip">Décodage du motif e-mail : des caractères, un <code>@</code>, un domaine, un point, puis au moins deux lettres. <code>matches()</code> exige que <em>toute</em> la chaîne colle au motif.</div>

<h3>4. Valider avant d'insérer</h3>
<p>On regroupe les vérifications dans une méthode qui renvoie <code>true</code> si tout est correct. Le bouton n'appelle le DAO que si la validation passe.</p>
<pre class="pseudo">private boolean saisieValide() {                        // renvoie true si tout est bon
    if (champTitre.getText().isBlank()) {               // titre obligatoire
        alerte("Le titre est obligatoire."); return false;
    }
    if (!champPrix.getText().matches("^\\d+(\\.\\d{1,2})?$")) {   // prix : nombre, 2 décimales max
        alerte("Prix invalide (ex : 18.50)."); return false;
    }
    return true;                                         // toutes les règles respectées
}
// btnAjouter : if (!saisieValide()) return;  puis dao.creer(...)</pre>

<h3>5. Cas classiques et bonnes pratiques</h3>
<ul>
<li><strong>Champ obligatoire</strong> : <code>getText().isBlank()</code> détecte un champ vide.</li>
<li><strong>Nombre positif</strong> : motif <code>^\\d+(\\.\\d{1,2})?$</code> pour un prix.</li>
<li><strong>Année</strong> : <code>^\\d{4}$</code> pour exactement quatre chiffres.</li>
</ul>
<div class="tip">Bonnes pratiques : pré-compiler un <code>Pattern</code> réutilisé dans une boucle ; tester ses motifs sur un outil comme Regex101 ; se méfier du <code>.*</code> « gourmand » (préférer <code>.*?</code> « paresseux » au besoin).</div>`,

    { type: "qcm", q: "getText().isBlank() détecte…", opts: ["Un nombre", "Un champ vide (ou espaces)", "Une erreur SQL", "Une majuscule"], a: 1, exp: "Champ obligatoire non rempli." },

  ],

    if (champTitre.getText().isBlank()) {               // titre obligatoire

        alerte("Prix invalide (ex : 18.50)."); return false;

    return true;                                         // tout est correct
}

btnAjouter.setOnAction(e -&gt; {
    if (!saisieValide()) return;                        // on stoppe si une règle échoue
    try {

        dao.creer(l); rafraichirListe(); viderChamps();
    } catch (SQLException ex) { alerte("Erreur : " + ex.getMessage()); }
});</pre>
<p>Les données sales sont arrêtées à la porte. Demain : les requêtes métier (commissions) qui donnent tout son sens au projet.</p>`
