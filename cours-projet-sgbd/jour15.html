  theory: `
<h3>1. Les trois étapes du PreparedStatement</h3>
<p>Toute modification de données suit le même rituel en trois temps :</p>
<pre class="pseudo">A. Pre-compilation -- on envoie la requete avec des ?  (la base prepare le plan)
B. Liage (binding) -- on remplit chaque ?  avec setInt, setString, setDouble...
C. Execution       -- on lance executeUpdate() (ou executeQuery pour un SELECT)</pre>
<div class="tip">Le <strong>liage</strong> (binding) associe chaque marqueur <code>?</code> à une valeur. Les <code>?</code> sont numérotés à partir de <strong>1</strong> (et non 0), de gauche à droite.</div>

<h3>2. executeUpdate pour INSERT, UPDATE, DELETE</h3>
<p>On distingue deux méthodes d'exécution :</p>
<pre class="pseudo">executeQuery()  -- pour un SELECT  -> renvoie un ResultSet
executeUpdate() -- pour INSERT / UPDATE / DELETE -> renvoie un int (nb de lignes affectees)</pre>
<p>Le nombre renvoyé par <code>executeUpdate()</code> permet de vérifier que l'opération a eu lieu : si <code>nbLignes == 0</code>, c'est que rien n'a été modifié (par ex. le code cherché n'existait pas).</p>

<h3>3. Insérer un client (CREATE)</h3>
<pre class="pseudo">String sql = "INSERT INTO clients (nom, email) VALUES (?, ?)";   // squelette avec 2 parametres
try (PreparedStatement ps = conn.prepareStatement(sql)) {        // A. pre-compilation
    ps.setString(1, nom);        // B. liage : le 1er ? recoit le nom
    ps.setString(2, email);      // B. liage : le 2e ? recoit l'email
    int n = ps.executeUpdate();  // C. execution ; n = nombre de lignes inserees
    System.out.println(n + " client(s) ajoute(s).");            // vaut 1 si succes
}
// Si le nom est O'BRIEN, aucun probleme : l'apostrophe est geree automatiquement.</pre>

<h3>4. Modifier et supprimer (UPDATE, DELETE)</h3>
<p>Même mécanique. Pour une mise à jour du prix d'un livre :</p>
<pre class="pseudo">String sql = "UPDATE livres SET prix_unitaire = ? WHERE livre_id = ?";   // 2 parametres
try (PreparedStatement ps = conn.prepareStatement(sql)) {
    ps.setDouble(1, nouveauPrix);   // le 1er ? : nouveau prix (DECIMAL -> setDouble)
    ps.setInt(2, idLivre);          // le 2e ? : identifiant du livre (INT -> setInt)
    int n = ps.executeUpdate();     // nombre de livres modifies
    if (n == 0) System.out.println("Aucun livre avec cet id.");   // rien modifie
}</pre>
<div class="warn">La suppression est sensible : une erreur dans un Statement concaténé (ex. <code>1 OR 1=1</code>) pourrait vider toute la table. Le PreparedStatement empêche cela : le paramètre reste une simple valeur.</div>
<pre class="pseudo">String sql = "DELETE FROM clients WHERE client_id = ?";   // suppression ciblee
try (PreparedStatement ps = conn.prepareStatement(sql)) {
    ps.setInt(1, idClient);        // liage de l'identifiant
    int n = ps.executeUpdate();    // n = 1 si un client a ete supprime, 0 sinon
}</pre>

<h3>5. Bien choisir la méthode setXxx</h3>
<p>Chaque <code>?</code> se remplit avec la méthode <code>setXxx</code> correspondant au type SQL de la colonne. JDBC fait la conversion :</p>
<pre class="pseudo">setInt(i, valeur)     -- pour une colonne INT (ex. livre_id)
setString(i, valeur)  -- pour un VARCHAR (ex. titre, email)
setDouble(i, valeur)  -- pour un DECIMAL (ex. prix_unitaire)
setBoolean(i, valeur) -- pour un BOOLEAN / TINYINT(1) (ex. est_disponible)</pre>
<div class="tip">Récapitulatif des actions JDBC : lecture = <code>executeQuery()</code> (renvoie un ResultSet) ; insertion / mise à jour / suppression = <code>executeUpdate()</code> (renvoie le nombre de lignes affectées). Avec ces briques, votre application maîtrise le CRUD complet en toute sécurité.</p>
</div>`,

    { type: "qcm", q: "Dans UPDATE livres SET prix_unitaire = ? WHERE livre_id = ?, le 2e ? correspond à…", opts: ["au prix", "à l'identifiant du livre", "au titre", "à la date"], a: 1, exp: "Le 2e paramètre est livre_id (WHERE)." },
    { type: "input", q: "Quelle méthode setXxx lie un booléen (est_disponible) ?", a: ["setboolean", "setboolean()"], ph: "méthode", exp: "setBoolean pour un BOOLEAN/TINYINT(1)." },
    { type: "vf", q: "Le liage (binding) associe chaque ? à une valeur avant l'exécution.", a: true, exp: "C'est l'étape B du rituel." },
    { type: "qcm", q: "Pourquoi préférer le PreparedStatement pour un DELETE ?", opts: ["Il est plus joli", "Il évite qu'une saisie détourne la condition et supprime trop", "Il est obligatoire pour SELECT", "Il ferme la connexion"], a: 1, exp: "Sécurité : la valeur ne peut pas modifier la structure de la requête." }

    ],
    solution: `<pre class="pseudo">// INSERT securise d'un client
String sql = "INSERT INTO clients (nom, email) VALUES (?, ?)";   // A. squelette
try (PreparedStatement ps = conn.prepareStatement(sql)) {        // pre-compilation

}

String u = "UPDATE livres SET prix_unitaire = ? WHERE livre_id = ?";
try (PreparedStatement ps = conn.prepareStatement(u)) {

    ps.setInt(2, 1);                // livre concerne
    ps.executeUpdate();
}</pre>
<p>Le CRUD est complet et sécurisé. Demain : organiser tout ce code avec le patron MVC.</p>`
