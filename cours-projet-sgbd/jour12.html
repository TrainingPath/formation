var DAY = {
  num: 12,
  title: "Établir et fermer une connexion (DriverManager)",
  subtitle: "Ouvrir un tunnel vers MySQL, le fermer proprement, mutualiser avec un Singleton.",
  theory: `
<h3>1. DriverManager : l'ouvreur de connexion</h3>
<p><strong>DriverManager</strong> est la classe JDBC qui fabrique les connexions. On lui donne l'URL, l'utilisateur et le mot de passe ; il repère le bon driver et renvoie un objet <strong>Connection</strong> — le « tunnel » ouvert vers la base.</p>
<pre class="pseudo">import java.sql.*;                                     // Connection, DriverManager, SQLException
Connection conn = DriverManager.getConnection(        // demande une connexion
    "jdbc:mysql://localhost:3306/library_db",         // URL de la base
    "root",                                            // utilisateur
    "motdepasse");                                     // mot de passe
System.out.println("Connexion etablie !");            // si on arrive ici, tout va bien</pre>
<div class="tip"><strong>Connection</strong> est une interface JDBC : elle représente une session active avec la base. Tout passe par elle : requêtes de lecture, d'écriture, transactions.</div>

<h3>2. Utiliser la config plutôt que des valeurs en dur</h3>
<p>On ne réécrit pas l'URL partout : on interroge la classe <code>DatabaseConfig</code> d'hier.</p>
<pre class="pseudo">Connection conn = DriverManager.getConnection(        // connexion sans identifiants "en dur"
    DatabaseConfig.getUrl(),                          // URL lue depuis config.properties
    DatabaseConfig.getUser(),                         // utilisateur lu depuis le fichier
    DatabaseConfig.getPassword());                    // mot de passe lu depuis le fichier</pre>

<h3>3. Toujours fermer la connexion (SQLException)</h3>
<p>Une connexion non fermée est une ressource gaspillée : elle épuise le SGBD. On la ferme avec <code>close()</code>. Comme une connexion peut échouer, on gère l'exception <strong>SQLException</strong> (l'erreur propre à JDBC). La syntaxe moderne est le <strong>try-with-resources</strong> : la ressource déclarée entre parenthèses est fermée automatiquement, même en cas d'erreur.</p>
<pre class="pseudo">// try-with-resources : la connexion est fermee automatiquement a la fin
try (Connection conn = DriverManager.getConnection(   // ressource "auto-fermante"
        DatabaseConfig.getUrl(),
        DatabaseConfig.getUser(),
        DatabaseConfig.getPassword())) {
    System.out.println("Connecte a library_db.");     // travail avec la base ici
} catch (SQLException e) {                             // en cas d'echec de connexion
    System.out.println("Erreur : " + e.getMessage()); // message d'erreur JDBC
}
// pas besoin de conn.close() : le try-with-resources s'en charge</pre>

<h3>4. Le patron Singleton pour la connexion</h3>
<p>Ouvrir 50 connexions identiques vers MySQL est un gaspillage. Le <strong>Singleton</strong> garantit qu'une <strong>seule instance</strong> de connexion existe dans toute l'application, partagée par tous.</p>
<pre class="pseudo">public class DatabaseConnection {                     // gestionnaire de connexion unique
    private static Connection instance;               // l'unique connexion partagee
    private DatabaseConnection() { }                  // constructeur prive : on interdit le new externe
    public static Connection getInstance() throws SQLException {   // point d'acces unique
        if (instance == null || instance.isClosed()) {            // pas encore creee ou fermee ?
            instance = DriverManager.getConnection(               // on (re)cree la connexion
                DatabaseConfig.getUrl(),
                DatabaseConfig.getUser(),
                DatabaseConfig.getPassword());
        }
        return instance;                              // on renvoie toujours la meme connexion
    }
}</pre>
<div class="tip">Le test <code>isClosed()</code> rend le Singleton robuste : si la base a coupé la connexion, il en recrée une automatiquement. On appelle ensuite partout <code>DatabaseConnection.getInstance()</code>.</div>

<h3>5. Attention : on ne ferme pas la connexion partagée</h3>
<p>Avec un Singleton, la connexion doit rester <strong>ouverte</strong> tant que l'application tourne. On ne ferme donc que les « outils » de travail (Statement, ResultSet, vus demain), <strong>jamais</strong> la Connection elle-même à l'intérieur des méthodes.</p>
<div class="warn">Erreur classique : fermer la connexion partagée après une opération. La suivante échouerait faute de connexion. On garde la « porte » ouverte ; on ne referme que les outils.</div>`,

    { type: "vf", q: "Une connexion non fermée gaspille les ressources du SGBD.", a: true, exp: "Il faut la fermer (ou laisser le try-with-resources le faire)." },

    { type: "qcm", q: "Pourquoi passer par DatabaseConfig pour l'URL et le mot de passe ?", opts: ["Pour aller plus lentement", "Pour éviter les valeurs en dur et centraliser la config", "Pour chiffrer la base", "Pour créer des tables"], a: 1, exp: "Les identifiants viennent de config.properties." },
    { type: "qcm", q: "Le point d'accès unique du Singleton s'appelle par convention…", opts: ["main()", "getInstance()", "open()", "connect()"], a: 1, exp: "getInstance() renvoie l'instance unique." },
    { type: "input", q: "Quelle méthode de getConnection reçoit l'URL en premier argument ? (classe appelante)", a: ["drivermanager"], ph: "classe", exp: "DriverManager.getConnection(url, user, password)." },
    { type: "vf", q: "isClosed() permet au Singleton de recréer une connexion coupée.", a: true, exp: "Il vérifie et reconnecte si nécessaire." },
    { type: "qcm", q: "Dans getConnection(url, user, password), le 3e argument est…", opts: ["la table", "le mot de passe", "le port", "le driver"], a: 1, exp: "URL, utilisateur, puis mot de passe." }
  ],
  final: {
    title: "Exercice final — Connexion robuste",
    intro: `<p>DriverManager, try-with-resources et Singleton.</p>`,
    questions: [
      { type: "input", q: "Classe qui ouvre une connexion :", a: ["drivermanager"], ph: "classe", exp: "DriverManager." },
      { type: "input", q: "Exception à capturer :", a: ["sqlexception"], ph: "classe", exp: "SQLException." },
      { type: "vf", q: "Le try-with-resources ferme la connexion automatiquement.", a: true, exp: "Fermeture garantie, même en cas d'erreur." },
      { type: "qcm", q: "Le Singleton assure :", opts: ["une connexion par requête", "une instance de connexion unique et partagée", "aucune connexion", "deux connexions"], a: 1, exp: "Instance unique." },
      { type: "vf", q: "On ne ferme jamais la connexion partagée d'un Singleton dans les méthodes du modèle.", a: true, exp: "On garde la porte ouverte ; on ferme les outils." }
    ],
    solution: `<pre class="pseudo">public class DatabaseConnection {                     // Singleton de connexion
    private static Connection instance;               // unique connexion partagee
    private DatabaseConnection() { }                  // constructeur prive
    public static Connection getInstance() throws SQLException {
        if (instance == null || instance.isClosed()) {// absente ou fermee ?
            instance = DriverManager.getConnection(   // (re)creation
                DatabaseConfig.getUrl(),
                DatabaseConfig.getUser(),
                DatabaseConfig.getPassword());
        }
        return instance;                              // toujours la meme connexion
    }
}
// Usage : Connection c = DatabaseConnection.getInstance();
// On ne fait PAS c.close() ici : la connexion reste ouverte pour l'appli.</pre>
<p>La connexion est prête et mutualisée. Demain : lire des données avec Statement et ResultSet.</p>`
