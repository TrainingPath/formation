<h3>1. Le problème des ID « nus »</h3>
<p>Afficher <em>« Section : 1 »</em> n'a aucun sens pour l'utilisateur. On préfère <em>« Section : Informatique »</em>. Or le nom vit dans une <strong>autre table</strong> (<code>sections</code>), reliée à <code>livres</code> par la clé étrangère <code>section_id</code>. La solution : une <strong>jointure</strong> (<code>JOIN</code>) dans le DAO.</p>
<div class="tip">C'est la force du Modèle : masquer la complexité SQL. La Vue appelle une méthode simple et reçoit un objet déjà « augmenté » des libellés.</div>

<h3>2. Enrichir le Bean : attributs de confort</h3>

<h3>3. La jointure dans le DAO : LEFT JOIN</h3>
<p>Une <strong>jointure</strong> combine des lignes de plusieurs tables selon une condition. Deux variantes utiles :</p>
<ul>
<li><strong>INNER JOIN</strong> : n'affiche que les livres qui ont bien une section ET une collection valides (plus rigoureux).</li>
<li><strong>LEFT JOIN</strong> : affiche <em>tous</em> les livres, même « orphelins » (section ou collection nulle). Plus permissif — on le privilégie ici.</li>
</ul>
<pre class="pseudo">public List&lt;Livre&gt; listeLivreAvecDetails() {            // livres + libellés
    String sql = "SELECT l.*, s.nom_section, c.nom_collection "
               + "FROM livres l "
               + "LEFT JOIN sections s ON l.section_id = s.section_id "        // relie la section
               + "LEFT JOIN collections c ON l.collection_id = c.collection_id"; // relie la collection
    try {
        Connection cx = DatabaseConnection.getInstance().getConnection();
        Statement st = cx.createStatement();
        ResultSet rs = st.executeQuery(sql);
        List&lt;Livre&gt; liste = new ArrayList&lt;&gt;();
        while (rs.next()) {
            Livre l = new Livre();
            l.setId(rs.getInt("livre_id"));
            l.setTitre(rs.getString("titre"));
            l.setNomSection(rs.getString("nom_section"));     // le libellé, pas l'ID
            liste.add(l);
        }
        rs.close(); st.close();
        return liste;
    } catch (SQLException e) { return new ArrayList&lt;&gt;(); }
}</pre>

<h3>4. La relation N:M : la table de jointure</h3>
<p>Un livre peut avoir plusieurs auteurs, et un auteur plusieurs livres : c'est une relation <strong>N:M</strong> (plusieurs-à-plusieurs). Elle est portée par la table <code>livre_auteur</code>, dont la <strong>clé primaire composée</strong> est le couple <code>(livre_id, auteur_id)</code>. Cette table porte aussi une donnée propre : <code>pourcentage_commission</code>.</p>
<pre class="pseudo">public boolean lier(int livreId, int auteurId, double pct) {   // crée l'association
    String sql = "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) "
               + "VALUES (?, ?, ?)";
    // setInt(1, livreId); setInt(2, auteurId); setDouble(3, pct);
}</pre>
<div class="warn">La commission n'appartient ni au livre seul ni à l'auteur seul, mais à leur <em>relation</em> : c'est pourquoi elle est stockée dans la table de jointure (un auteur peut toucher 10 % sur un livre et 15 % sur un autre).</div>

<h3>5. Agréger les auteurs d'un livre</h3>

// LivreAuteurDAO : associer un auteur à un livre (N:M)
public boolean lier(int livreId, int auteurId, double pct) {
    String sql = "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) VALUES (?, ?, ?)";
    try {
        Connection c = DatabaseConnection.getInstance().getConnection();
        PreparedStatement p = c.prepareStatement(sql);
        p.setInt(1, livreId); p.setInt(2, auteurId); p.setDouble(3, pct);
        int n = p.executeUpdate(); p.close();
        return n &gt; 0;
    } catch (SQLException e) { return false; }
