  theory: `
<h3>1. Du « tout-en-un » au DAO</h3>
<p>Jusqu'ici, notre entité était <em>intelligente</em> : elle portait à la fois ses données ET son SQL (style Active Record). Le pattern <strong>DAO</strong> (<em>Data Access Object</em>, « objet d'accès aux données ») pousse la séparation plus loin en découpant le Modèle en <strong>deux classes</strong> :</p>
<ul>
<li>Le <strong>POJO / Bean</strong> : un objet <em>purement de données</em> (attributs + getters/setters). Il ne contient plus aucun SQL.</li>
<li>Le <strong>DAO</strong> : la <em>seule</em> classe qui « parle » SQL. Elle contient les méthodes d'accès (lire, créer, modifier, supprimer).</li>
</ul>
<div class="tip">Le Modèle du MVC devient donc : <strong>Bean</strong> (les données) + <strong>DAO</strong> (l'accès). La Vue et le Contrôleur restent inchangés dans leur rôle.</div>

<h3>2. Le Bean : Livre.java (données pures)</h3>
<p>Un <strong>Bean</strong> est un POJO qui suit une convention simple : attributs privés, constructeur, et un getter/setter par attribut. Il représente une ligne de la table <code>livres</code>, sans savoir qu'une base existe.</p>
<pre class="pseudo">public class Livre {                                    // Bean : données d'un livre
    private int id;                                     // livre_id
    private String titre;                               // titre
    private double prix;                                // prix_unitaire

    public Livre() { }                                  // constructeur vide
    public Livre(String titre, double prix) {           // constructeur pratique
        this.titre = titre; this.prix = prix;
    }
    public int getId() { return id; }                   // getters / setters…
    public void setId(int id) { this.id = id; }
    public String getTitre() { return titre; }
    public void setTitre(String t) { this.titre = t; }
    public double getPrix() { return prix; }
    public void setPrix(double p) { this.prix = p; }
}</pre>

<h3>3. Le DAO : LivreDAO.java (le seul à parler SQL)</h3>
<p>Le DAO utilise le Singleton <code>DatabaseConnection</code>. C'est ici — et nulle part ailleurs — que vit le SQL.</p>
<pre class="pseudo">public class LivreDAO {                                 // objet d'accès aux données
    public List&lt;Livre&gt; lireTout() {                     // renvoie tous les livres
        List&lt;Livre&gt; liste = new ArrayList&lt;&gt;();
        String sql = "SELECT * FROM livres";
        try {
            Connection c = DatabaseConnection.getInstance().getConnection();
            Statement st = c.createStatement();
            ResultSet rs = st.executeQuery(sql);
            while (rs.next()) {                         // mapping ligne → objet
                Livre l = new Livre();                  // on crée un Bean vide
                l.setId(rs.getInt("livre_id"));         // on le remplit
                l.setTitre(rs.getString("titre"));
                l.setPrix(rs.getDouble("prix_unitaire"));
                liste.add(l);                           // on l'ajoute à la liste
            }
            rs.close(); st.close();                     // outils fermés, connexion gardée
        } catch (SQLException e) { }
        return liste;
    }
}</pre>
<p>Le passage du <code>ResultSet</code> vers des objets <code>Livre</code> s'appelle le <strong>mapping</strong> : on transforme des lignes SQL en objets Java.</p>

<h3>4. Vue et Contrôleur : inchangés dans leur esprit</h3>
<p>La <strong>Vue</strong> affiche ce qu'on lui donne (elle ne connaît pas la base). Le <strong>Contrôleur</strong> demande les données au DAO et les transmet à la Vue.</p>
<pre class="pseudo">public class LivreController {                          // chef d'orchestre
    private LivreDAO dao = new LivreDAO();              // il connaît le DAO
    public List&lt;Livre&gt; getLivres() {                    // fournit les données
        return dao.lireTout();                          // délègue au DAO
    }
}</pre>

<h3>5. Pourquoi le DAO est-il si flexible ?</h3>
<ul>
<li><strong>Indépendance</strong> : si le nom de la table change, on ne modifie que le DAO.</li>
<li><strong>Flexibilité</strong> : si l'on passe de la console à JavaFX, on ne modifie que la Vue.</li>
<li><strong>Logique</strong> : le Contrôleur porte les règles métier (« si la liste est vide, afficher un message »).</li>
</ul>
<div class="warn">Différence clé avec l'Active Record : ici un <code>Livre</code> ne sait plus se sauvegarder. C'est <code>livreDao.creer(livre)</code> qui l'enregistre. Les données et l'accès sont deux responsabilités distinctes.</div>`,

}</pre>
<p>Bean et DAO, chacun son rôle. Demain : on complète LivreDAO avec un CRUD entier.</p>`
