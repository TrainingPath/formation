<h3>1. Le Contrôleur : le médiateur</h3>
<p>Le <strong>Contrôleur</strong> fait le pont entre la Vue et le Modèle. Sa règle d'or : <em>il ne contient aucune ligne de SQL</em>. Son rôle est de <strong>piloter le Modèle</strong>.</p>
<p>Concrètement : si la Vue lui transmet un nom de section, le contrôleur crée un objet <code>Section</code>, lui affecte le nom, appelle <code>creer()</code> sur le modèle, puis récupère le résultat (souvent un <code>boolean</code> ou une <code>List</code>) et le prépare pour la Vue.</p>
<pre class="pseudo">public class SectionController {                        // le médiateur (aucun SQL ici)
    private Section modele = new Section();             // objet « pivot » pour appeler le CRUD

    public boolean ajouterSection(String nom) {         // reçoit une saisie de la Vue
        Section s = new Section(nom);                   // configure une entité
        return s.creer();                               // demande au Modèle de s'enregistrer
    }
    public List&lt;Section&gt; getListeSections() {           // fournit les données à la Vue
        return modele.lireTout();                       // délègue la lecture au Modèle
    }
}</pre>
<div class="tip">Le contrôleur est un <em>traducteur d'intentions</em> : il transforme les souhaits de l'utilisateur (« ajouter cette section ») en actions concrètes sur le Modèle.</div>

<h3>2. La Vue console : l'interface texte</h3>
<p>La <strong>Vue</strong> est la seule classe qui utilise <code>Scanner</code> (pour lire le clavier) et <code>System.out.println()</code> (pour afficher). Elle est <em>« muette »</em> vis-à-vis de la base : elle ne connaît que le Contrôleur.</p>
<pre class="pseudo">public class SectionView {                              // interface console
    private Scanner sc = new Scanner(System.in);        // lit les saisies clavier
    private SectionController ctrl = new SectionController();   // la Vue ne connaît que le contrôleur

    public void menuSections() {                        // affiche le menu et réagit
        System.out.println("1. Lister   2. Ajouter");   // options proposées
        int choix = sc.nextInt();                       // lit le choix (un entier)
        sc.nextLine();                                  // NETTOIE le tampon (voir plus bas)
        if (choix == 1) afficher();                     // route vers l'action
        else if (choix == 2) formulaireAjout();
    }
}</pre>

<h3>3. Afficher : boucler sur les objets</h3>
<p>Pour lister, la Vue demande la liste au Contrôleur, puis boucle et affiche chaque objet grâce à sa méthode <code>toString()</code> formatée.</p>
<pre class="pseudo">private void afficher() {                               // liste les sections
    List&lt;Section&gt; liste = ctrl.getListeSections();      // demande au contrôleur
    for (Section s : liste) {                           // pour chaque objet reçu
        System.out.println(s.getSectionId() + " - " + s.getNomSection());  // formate l'affichage
    }
}</pre>

<h3>4. Saisir : le formulaire</h3>
<p>Le formulaire collecte les données au clavier, puis les transmet au Contrôleur — jamais directement au Modèle.</p>
<pre class="pseudo">private void formulaireAjout() {                        // saisie d'une nouvelle section
    System.out.print("Nom de la section : ");           // invite
    String nom = sc.nextLine();                         // lit la ligne saisie
    boolean ok = ctrl.ajouterSection(nom);              // transmet au contrôleur
    if (ok) System.out.println("Section ajoutée.");     // feedback à l'utilisateur
    else System.out.println("Échec de l'ajout.");
}</pre>

<h3>5. Le piège du tampon Scanner</h3>
<p>Après un <code>nextInt()</code> ou <code>nextDouble()</code>, le caractère « Entrée » (<code>\\n</code>) reste dans le <strong>tampon</strong> (la mémoire d'attente du clavier). Sans nettoyage, la saisie de texte suivante serait <em>ignorée</em>.</p>
<div class="warn">Réflexe systématique : appeler <code>sc.nextLine()</code> juste après chaque <code>nextInt()</code>/<code>nextDouble()</code> pour vider le tampon. C'est l'une des erreurs les plus fréquentes en mode console.</div>
<div class="tip">Découplage : si l'on remplaçait la console par une interface graphique, seule la Vue changerait. Le Contrôleur et le Modèle resteraient intacts.</div>`,

public class SectionView {                              // interface console

}</pre>
<p>Trois couches, trois responsabilités. Demain : on assemble tout dans un CRUD complet avec un main.</p>`
