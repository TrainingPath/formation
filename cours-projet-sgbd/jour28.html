<script>
var DAY = {
  num: 28,
  title: "CRUD graphique : modifier et supprimer",
  subtitle: "Sélectionner une ligne, la modifier ou la retirer en toute sécurité.",
  theory: `
<h3>1. Récupérer la ligne sélectionnée</h3>
<p>Modifier ou supprimer suppose de savoir <em>quelle</em> ligne. En JavaFX, on lit la sélection du <code>TableView</code> via son <strong>modèle de sélection</strong> :</p>
<pre class="pseudo">Livre selection = table.getSelectionModel().getSelectedItem();   // le livre cliqué (ou null)
if (selection == null) {                                // aucune ligne choisie
    alerte("Sélectionne d'abord un livre.");            // on prévient l'utilisateur
    return;                                             // et on arrête l'action
}</pre>
<div class="warn">Toujours tester <code>== null</code> : si l'utilisateur clique « Modifier » sans avoir sélectionné de ligne, <code>getSelectedItem()</code> renvoie <code>null</code> et on éviterait une <code>NullPointerException</code>.</div>

<h3>2. Pré-remplir le formulaire</h3>
<p>Pour modifier, on recopie d'abord les valeurs de la ligne sélectionnée dans les <code>TextField</code>, grâce aux getters du Bean. L'utilisateur voit l'existant, puis corrige.</p>
<pre class="pseudo">champTitre.setText(selection.getTitre());               // affiche le titre actuel
champAnnee.setText(String.valueOf(selection.getAnnee())); // int → texte
champPrix.setText(String.valueOf(selection.getPrix()));   // double → texte</pre>
<div class="tip"><code>String.valueOf(x)</code> convertit un nombre en texte : l'opération inverse de <code>parseInt</code>/<code>parseDouble</code>.</div>

<h3>3. Le bouton Modifier</h3>
<p>Au clic, on reporte les nouvelles saisies dans l'objet, on force son <code>id</code> (pour cibler le <code>WHERE</code>), puis on appelle <code>dao.update(livre)</code>.</p>
<pre class="pseudo">btnModifier.setOnAction(e -&gt; {
    Livre sel = table.getSelectionModel().getSelectedItem();
    if (sel == null) { alerte("Sélectionne un livre."); return; }
    try {
        sel.setTitre(champTitre.getText());             // nouvelles valeurs
        sel.setAnnee(Integer.parseInt(champAnnee.getText()));
        sel.setPrix(Double.parseDouble(champPrix.getText()));
        dao.update(sel);                                // UPDATE ... WHERE livre_id = sel.getId()
        rafraichirListe();                              // le tableau reflète le changement
    } catch (NumberFormatException ex) { alerte("Année/prix invalides."); }
      catch (SQLException ex) { alerte("Erreur base : " + ex.getMessage()); }
});</pre>

<h3>4. Le bouton Supprimer + confirmation</h3>
<p>La suppression est irréversible : on demande d'abord <strong>confirmation</strong> avec une Alert de type <code>CONFIRMATION</code>, puis on appelle <code>dao.supprimer(id)</code>.</p>
<pre class="pseudo">btnSupprimer.setOnAction(e -&gt; {
    Livre sel = table.getSelectionModel().getSelectedItem();
    if (sel == null) { alerte("Sélectionne un livre."); return; }
    Alert conf = new Alert(Alert.AlertType.CONFIRMATION, "Supprimer « " + sel.getTitre() + " » ?");
    Optional&lt;ButtonType&gt; rep = conf.showAndWait();       // attend le choix de l'utilisateur
    if (rep.isPresent() && rep.get() == ButtonType.OK) {// l'utilisateur a confirmé
        try {
            dao.supprimer(sel.getId());                 // DELETE ... WHERE livre_id = ?
            rafraichirListe();                          // la ligne disparaît
        } catch (SQLException ex) { alerte("Erreur : " + ex.getMessage()); }
    }
});</pre>

<h3>5. Attention aux dépendances</h3>
<p>Supprimer un livre lié à des ventes peut être refusé par la base (clé étrangère). Selon la contrainte (<code>ON DELETE CASCADE</code> ou non), l'opération réussit ou lève une <code>SQLException</code>. Le contrôleur affiche alors un message clair.</p>
<div class="tip">Bilan du CRUD graphique : <em>afficher</em> (rafraîchir), <em>ajouter</em> (formulaire + creer), <em>modifier</em> (sélection + pré-remplissage + update), <em>supprimer</em> (sélection + confirmation + supprimer). Le DAO reste inchangé : tout se joue dans la Vue et le Contrôleur.</div>`,
  exercises: [
    { type: "qcm", q: "Pour obtenir la ligne cliquée du tableau, on écrit…", opts: ["table.getSelectedRow()", "table.getSelectionModel().getSelectedItem()", "table.getItems()", "table.getFocusedCell()"], a: 1, exp: "Modèle de sélection." },
    { type: "qcm", q: "getSelectedItem() renvoie null quand…", opts: ["La base est vide", "Aucune ligne n'est sélectionnée", "La colonne est masquée", "Le DAO échoue"], a: 1, exp: "D'où le test == null." },
    { type: "vf", q: "Il faut tester la sélection contre null avant de modifier/supprimer.", a: true, exp: "Évite une NullPointerException." },
    { type: "input", q: "Méthode qui convertit un nombre en texte pour l'afficher : String.value_____()", a: ["Of", "valueOf"], exp: "String.valueOf(x)." },
    { type: "qcm", q: "Avant de modifier, on pré-remplit les champs pour…", opts: ["générer un nouvel identifiant", "montrer les valeurs actuelles à l'utilisateur", "verrouiller la ligne sélectionnée", "trier automatiquement le tableau"], a: 1, exp: "L'utilisateur corrige l'existant." },
    { type: "qcm", q: "update(sel) cible la bonne ligne grâce à…", opts: ["Le titre", "sel.getId() dans le WHERE", "Le prix", "La sélection visuelle uniquement"], a: 1, exp: "La clé primaire." },
    { type: "qcm", q: "Avant de supprimer, on affiche une Alert de type…", opts: ["ERROR", "INFORMATION", "CONFIRMATION", "WARNING seul"], a: 2, exp: "On demande confirmation." },
    { type: "input", q: "Type qui enveloppe le résultat de showAndWait() d'une confirmation : _____", a: ["Optional", "Optional<ButtonType>"], exp: "Optional<ButtonType>." },
    { type: "qcm", q: "On agit seulement si rep.get() vaut…", opts: ["ButtonType.CANCEL", "ButtonType.OK", "null", "ButtonType.CLOSE"], a: 1, exp: "L'utilisateur a confirmé." },
    { type: "vf", q: "Supprimer un livre lié à des ventes peut être refusé par une contrainte FK.", a: true, exp: "Selon ON DELETE CASCADE ou non." },
    { type: "input", q: "Méthode du DAO appelée à la suppression : _____(id)", a: ["supprimer", "supprimer()"], exp: "dao.supprimer(id) → DELETE." },
    { type: "vf", q: "Après un update ou un delete, on appelle rafraichirListe().", a: true, exp: "Le tableau reflète le changement." },
    { type: "qcm", q: "Le DAO, pour le CRUD graphique…", opts: ["Doit être réécrit", "Reste inchangé", "Perd ses méthodes", "Devient une Vue"], a: 1, exp: "Tout se joue dans Vue + Contrôleur." },
    { type: "qcm", q: "String.valueOf(selection.getAnnee()) sert à…", opts: ["Convertir l'année (int) en texte pour le TextField", "Convertir le texte en entier", "Arrondir l'année à l'entier", "Comparer deux années"], a: 0, exp: "int → String." },
    { type: "vf", q: "La suppression est irréversible, d'où la demande de confirmation.", a: true, exp: "Sécurité utilisateur." }
  ],
  final: {
    title: "Exercice final — Modifier et supprimer",
    intro: `<p>On câble les boutons Modifier et Supprimer d'un livre sélectionné.</p>`,
    questions: [
      { type: "qcm", q: "La ligne sélectionnée s'obtient par…", opts: ["getSelectedItem()", "getSelectedIndex()", "getItems()", "getColumns()"], a: 0, exp: "Via le SelectionModel." },
      { type: "qcm", q: "Si aucune ligne n'est sélectionnée, on…", opts: ["insère quand même", "affiche une Alert et return", "supprime la 1re ligne", "sélectionne la dernière ligne"], a: 1, exp: "On arrête l'action proprement." },
      { type: "qcm", q: "update(sel) modifie la ligne dont l'id est…", opts: ["toujours 1", "sel.getId()", "le titre", "l'index de la ligne affichée"], a: 1, exp: "Ciblage par clé primaire." },
      { type: "vf", q: "On demande confirmation avant un DELETE.", a: true, exp: "Alert CONFIRMATION." },
      { type: "vf", q: "Après suppression confirmée, la ligne disparaît via rafraichirListe().", a: true, exp: "Mise à jour du TableView." }
    ],
    solution: `<pre class="pseudo">// --- Modifier ---
btnModifier.setOnAction(e -&gt; {
    Livre sel = table.getSelectionModel().getSelectedItem();
    if (sel == null) { alerte("Sélectionne un livre."); return; }
    try {
        sel.setTitre(champTitre.getText());
        sel.setAnnee(Integer.parseInt(champAnnee.getText()));
        sel.setPrix(Double.parseDouble(champPrix.getText()));
        dao.update(sel);                                // WHERE livre_id = sel.getId()
        rafraichirListe();
    } catch (NumberFormatException ex) { alerte("Année/prix invalides."); }
      catch (SQLException ex) { alerte("Erreur : " + ex.getMessage()); }
});

// --- Supprimer avec confirmation ---
btnSupprimer.setOnAction(e -&gt; {
    Livre sel = table.getSelectionModel().getSelectedItem();
    if (sel == null) { alerte("Sélectionne un livre."); return; }
    Alert conf = new Alert(Alert.AlertType.CONFIRMATION, "Supprimer « " + sel.getTitre() + " » ?");
    Optional&lt;ButtonType&gt; rep = conf.showAndWait();
    if (rep.isPresent() && rep.get() == ButtonType.OK) {
        try { dao.supprimer(sel.getId()); rafraichirListe(); }
        catch (SQLException ex) { alerte("Erreur : " + ex.getMessage()); }
    }
});</pre>
<p>Le CRUD graphique est complet. Demain : valider les saisies avant même d'atteindre la base.</p>`
  }
};
</script>
