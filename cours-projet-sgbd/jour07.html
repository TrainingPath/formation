var DAY = {
  num: 7,
  title: "La validation des données côté application",
  subtitle: "Normaliser, filtrer, rejeter : bâtir un vrai garde-barrière.",
  theory: `
<h3>1. Valider côté application</h3>
<p><strong>Valider côté application</strong>, c'est vérifier chaque donnée dans le code Java <strong>avant</strong> qu'elle n'atteigne la base. La base a ses propres contraintes (NOT NULL, CHECK...), mais elles arrivent trop tard et donnent des erreurs peu claires. La première ligne de défense, c'est votre programme.</p>
<div class="tip">Deux protections complémentaires : la <strong>validation applicative</strong> (Java, aujourd'hui) et le <strong>PreparedStatement</strong> (base, plus tard). Les deux ensemble forment une défense solide.</div>

<h3>2. Normaliser la saisie</h3>
<p><strong>Normaliser</strong>, c'est mettre la saisie dans une forme standard avant de la contrôler. Trois gestes classiques du TP « Garde-Barrière » :</p>
<pre class="pseudo">String s = saisie.trim();          // trim() : enleve les espaces en debut et fin
s = s.toLowerCase();               // toLowerCase() : passe tout en minuscules
// (parfois toUpperCase() selon le champ, ex. un code d'inventaire)</pre>
<p>La normalisation évite qu'une même valeur (« Alice », «  alice  », « ALICE ») soit traitée de trois façons différentes.</p>

<h3>3. Détecter et alerter</h3>
<p>On repère les signatures évidentes d'injection et on affiche une <strong>alerte</strong> :</p>
<pre class="pseudo">if (s.contains(";") || s.contains("--")) {                       // caracteres SQL suspects
    System.out.println("ALERTE : tentative d'injection detectee !");   // message d'alerte
    return false;                                                // on rejette la saisie
}</pre>

<h3>4. Filtrer par whitelist et lever une exception</h3>
<p>Le cœur de la validation : n'accepter que ce qui correspond à une <strong>liste autorisée</strong>. Si un caractère spécial arrive, on lève une <strong>exception</strong> (un objet qui signale une erreur et interrompt le traitement) :</p>
<pre class="pseudo">public static String valider(String nom) {                       // valide un nom de produit/livre
    String s = nom.trim();                                       // normalisation
    if (!s.matches("^[a-zA-Z0-9 ]+$")) {                         // whitelist : lettres, chiffres, espace
        throw new IllegalArgumentException("Caractere non autorise dans : " + nom);   // on lance une exception
    }
    return s;                                                    // saisie validee
}</pre>
<p>Lever une exception force l'appelant à gérer le cas d'erreur : la donnée invalide n'ira jamais jusqu'à la base.</p>

<h3>5. Choisir la bonne technique</h3>
<p>Le support résume trois approches et leur efficacité :</p>
<pre class="pseudo">Echappement   : replace("'", "''")     // neutralise l'apostrophe
Nettoyage     : replace(";", "")       // retire un caractere dangereux
Validation    : matches("^[a-z]+$")    // n'accepte que le connu-bon (whitelist) -- le plus sur</pre>
<div class="warn">La règle d'or, répétée : <strong>ne faites jamais confiance à l'utilisateur</strong>. Pour un champ « nom de produit », autorisez uniquement <code>[a-zA-Z0-9 ]</code> ; si un caractère spécial arrive, lancez une exception. La validation applicative complète, mais ne remplace pas, le <code>PreparedStatement</code>.</p>
</div>
<p>Aujourd'hui, on structure ce garde-barrière avec du texte fixe (<code>contains</code>, <code>trim</code>, <code>matches</code>). Demain, on remplace ces vérifications approximatives par de vraies <strong>expressions régulières</strong>, bien plus précises.</p>`,

    { type: "input", q: "Quelle méthode String enlève les espaces en début et fin de saisie ?", a: ["trim", "trim()"], ph: "méthode Java", exp: "trim() supprime les espaces de bordure." },
    { type: "qcm", q: "Pourquoi valider côté application et pas seulement côté base ?", opts: ["Pour aller plus lentement", "Pour arrêter les données invalides au plus tôt, avec des messages clairs", "Pour éviter d'écrire du SQL", "Pour chiffrer la base"], a: 1, exp: "La validation applicative est la première ligne de défense." },
    { type: "vf", q: "Normaliser une saisie, c'est la mettre dans une forme standard avant de la contrôler.", a: true, exp: "Ex. trim + toLowerCase pour uniformiser." },
    { type: "input", q: "Quelle méthode passe une chaîne entièrement en minuscules ?", a: ["tolowercase", "tolowercase()"], ph: "méthode Java", exp: "toLowerCase()." },
    { type: "qcm", q: "Que fait throw new IllegalArgumentException(...) ?", opts: ["Affiche un menu", "Lève une exception pour signaler une donnée invalide", "Ferme la base", "Crée une table"], a: 1, exp: "Elle signale l'erreur et interrompt le traitement." },
    { type: "vf", q: "La validation par whitelist est considérée comme la plus sûre.", a: true, exp: "On n'accepte que le connu-bon ; tout le reste est rejeté." },
    { type: "input", q: "Quelle méthode teste si une chaîne contient une sous-chaîne (ex. \";\") ?", a: ["contains", "contains()"], ph: "méthode Java", exp: "contains(...) renvoie true si la sous-chaîne est présente." },
    { type: "qcm", q: "Une exception sert à…", opts: ["Accélérer la base", "Signaler une erreur et interrompre le traitement", "Trier des données", "Chiffrer un mot de passe"], a: 1, exp: "L'exception force la prise en charge de l'erreur." },
    { type: "input", q: "Écris la regex qui n'autorise que lettres, chiffres et espaces (au moins un caractère).", a: ["^[a-za-z0-9 ]+$", "^[a-z0-9 ]+$", "^[a-za-z0-9 ]+$"], ph: "^[...]+$", exp: "^[a-zA-Z0-9 ]+$." },
    { type: "vf", q: "La validation applicative remplace totalement le PreparedStatement.", a: false, exp: "Elle le complète ; le PreparedStatement reste indispensable." },
    { type: "qcm", q: "L'approche « nettoyage » correspond à…", opts: ["matches(...)", "replace(\";\", \"\")", "trim()", "toUpperCase()"], a: 1, exp: "Le nettoyage retire des caractères dangereux." },
    { type: "qcm", q: "Pourquoi normaliser avant de valider ?", opts: ["Pour rendre le code plus long", "Pour qu'une même valeur écrite différemment soit traitée pareil", "Pour supprimer la base", "Pour créer un index"], a: 1, exp: "Uniformiser évite les incohérences (espaces, casse)." },
    { type: "input", q: "L'approche « échappement » double les apostrophes : replace(\"'\", \"??\"). Complète les deux caractères.", a: ["''"], ph: "deux caractères", exp: "replace(\"'\", \"''\") double l'apostrophe." },
    { type: "vf", q: "Un message d'alerte doit prévenir en cas de caractères SQL suspects (; ou --).", a: true, exp: "Détecter et alerter fait partie du garde-barrière." },
    { type: "qcm", q: "La règle d'or de la validation :", opts: ["Faire confiance à l'utilisateur", "Ne jamais faire confiance à l'utilisateur", "Tout autoriser", "Désactiver les contraintes"], a: 1, exp: "Ne jamais faire confiance à l'utilisateur." }
  ],
  final: {
    title: "Exercice final — Structurer la validation",
    intro: `<p>On assemble normalisation, alerte et whitelist.</p>`,
    questions: [
      { type: "input", q: "Méthode qui enlève les espaces de bordure :", a: ["trim", "trim()"], ph: "méthode", exp: "trim()." },
      { type: "qcm", q: "Le filtre le plus sûr est :", opts: ["l'échappement", "le nettoyage", "la validation par whitelist", "aucun"], a: 2, exp: "La whitelist n'accepte que le connu-bon." },
      { type: "input", q: "Instruction Java qui signale une donnée invalide :", a: ["throw", "throw new illegalargumentexception"], ph: "mot-clé", exp: "throw (lève une exception)." },
      { type: "vf", q: "On normalise (trim, casse) avant de contrôler la saisie.", a: true, exp: "Normaliser d'abord, valider ensuite." },
      { type: "vf", q: "Validation applicative et PreparedStatement sont complémentaires.", a: true, exp: "Deux couches de défense qui se renforcent." }
    ],
    solution: `<pre class="pseudo">public static String validerNomClient(String saisie) {   // valide un nom de client
    if (saisie == null) throw new IllegalArgumentException("Saisie vide.");  // garde-fou null
    String s = saisie.trim();                             // 1) normaliser : espaces de bordure
    if (s.contains(";") || s.contains("--")) {            // 2) alerter : caracteres SQL suspects
        throw new IllegalArgumentException("Alerte injection : " + saisie);
    }
    if (!s.matches("^[a-zA-Z '-]+$")) {                   // 3) whitelist : lettres, espace, apostrophe, tiret
        throw new IllegalArgumentException("Caractere non autorise.");
    }
    return s;                                             // saisie propre, prete a etre traitee
}</pre>
<p>Le garde-barrière est structuré. Demain : les expressions régulières, l'outil de précision pour ces validations.</p>`
  }
};
