<h3>1. L'entité Livre et ses clés étrangères</h3>
<p>La table <code>livres</code> est reliée à <code>sections</code> et <code>collections</code> par des <strong>clés étrangères</strong> (<code>section_id</code>, <code>collection_id</code>). L'entité stocke donc aussi ces identifiants techniques.</p>
<pre class="pseudo">public class Livre {                                    // entité de la table livres
    private int livreId;                                // livre_id (clé primaire)
    private String titre;                               // titre
    private int annee;                                  // annee
    private double prixUnitaire;                        // prix_unitaire
    private int sectionId;                              // section_id (clé étrangère)
    private int collectionId;                           // collection_id (clé étrangère)
    // constructeur complet + getters/setters + CRUD…
}</pre>

<h3>2. Le CRUD complet : les 4 méthodes</h3>
<p>On complète le patron d'hier avec la mise à jour et la suppression.</p>
<pre class="pseudo">public boolean creer() {                                // CREATE
    String sql = "INSERT INTO livres (titre, annee, prix_unitaire, section_id, collection_id) "
               + "VALUES (?, ?, ?, ?, ?)";              // 5 paramètres
    // pstmt.setString(1, titre); setInt(2, annee); setDouble(3, prix);
    // setInt(4, sectionId); setInt(5, collectionId); return executeUpdate() &gt; 0;
}
public boolean modifier() {                             // UPDATE (nécessite l'id)
    String sql = "UPDATE livres SET titre=?, annee=?, prix_unitaire=? WHERE livre_id=?";
    // … WHERE livre_id = this.livreId
}
public boolean supprimer() {                            // DELETE (seul l'id suffit)
    String sql = "DELETE FROM livres WHERE livre_id = ?";
    // pstmt.setInt(1, this.livreId);
}</pre>
<div class="warn">Ne jamais oublier la clause <code>WHERE</code> dans un UPDATE ou un DELETE : sans elle, l'opération s'applique à <em>toutes</em> les lignes de la table.</div>
<div class="tip">Pour UPDATE et DELETE, l'objet doit porter le bon <code>livreId</code> (récupéré depuis la base) : c'est lui qui cible la ligne dans le <code>WHERE</code>.</div>

<h3>3. L'intégrité référentielle</h3>
<p>Si l'utilisateur saisit un <code>section_id</code> qui n'existe pas, la contrainte <code>FOREIGN KEY</code> de la base fait échouer <code>creer()</code> (qui renvoie <code>false</code>). Le Contrôleur intercepte et affiche un message clair : « Vérifiez les ID de section/collection ».</p>

<h3>4. La classe principale : le main</h3>
<p>La classe <code>BD_PROJET</code> est le <strong>point d'entrée unique</strong> (méthode <code>main</code>). Elle instancie les Vues et fait tourner une <strong>boucle <code>do-while</code></strong> qui maintient l'application active jusqu'à la sortie.</p>
<pre class="pseudo">public static void main(String[] args) {                // point d'entrée
    Scanner sc = new Scanner(System.in);
    LivreView livreView = new LivreView();              // instancie la couche Vue
    int choix;
    do {                                                // boucle du menu principal
        System.out.println("=== SYSTÈME DE GESTION BIBLIOTHÈQUE ===");
        System.out.println("1. Livres   3. Quitter");
        try {                                           // robustesse : saisie non numérique
            choix = sc.nextInt(); sc.nextLine();        // lit + vide le tampon
            switch (choix) {                            // aiguille vers le module
                case 1: livreView.menuLivres(); break;
                case 3: System.out.println("Au revoir."); break;
            }
        } catch (Exception e) {                         // texte au lieu d'un nombre
            System.out.println("Saisie invalide.");
            sc.nextLine();                              // vide le tampon fautif
            choix = -1;
        }
    } while (choix != 3);                               // continue tant que ≠ 3
}</pre>

<h3>5. Robustesse : le bloc try-catch</h3>
<p>Un <code>try-catch</code> autour de la lecture intercepte les <strong>mauvaises saisies</strong> (du texte au lieu d'un nombre) et évite un <em>plantage brutal</em> de la console. On vide ensuite le tampon avec <code>nextLine()</code> pour repartir proprement.</p>
<div class="tip">Bilan des points forts : (1) <strong>Active Record</strong> — aucun SQL dans le contrôleur ; (2) <strong>intégrité référentielle</strong> — erreurs FK interceptées proprement ; (3) <strong>connexion Singleton</strong> — gardée ouverte entre les appels.</div>`,

    solution: `<pre class="pseudo">public boolean modifier() {                             // UPDATE d'un livre existant
    String sql = "UPDATE livres SET titre=?, annee=?, prix_unitaire=? WHERE livre_id=?";
    try {
        Connection c = DatabaseConnection.getInstance().getConnection();
        PreparedStatement p = c.prepareStatement(sql);
        p.setString(1, titre); p.setInt(2, annee);      // nouvelles valeurs
        p.setDouble(3, prixUnitaire);
        p.setInt(4, livreId);                           // cible : la clé primaire
        int n = p.executeUpdate(); p.close();
        return n &gt; 0;                                   // vrai si 1 ligne modifiée
    } catch (SQLException e) { return false; }
}

public boolean supprimer() {                            // DELETE (id seul)
    String sql = "DELETE FROM livres WHERE livre_id = ?";
    try {
        Connection c = DatabaseConnection.getInstance().getConnection();
        PreparedStatement p = c.prepareStatement(sql);
        p.setInt(1, livreId);                           // cible la ligne
        int n = p.executeUpdate(); p.close();
        return n &gt; 0;
    } catch (SQLException e) { return false; }
}
