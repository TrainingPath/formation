<h3>1. TableView : le tableau de données</h3>
<p>Le <strong>TableView</strong> affiche une liste d'objets sous forme de tableau. Il est paramétré par le type d'objet affiché : <code>TableView&lt;Livre&gt;</code>. Chaque colonne est un <strong>TableColumn</strong>.</p>
<pre class="pseudo">TableView&lt;Livre&gt; table = new TableView&lt;&gt;();            // tableau de livres
TableColumn&lt;Livre, String&gt; colTitre = new TableColumn&lt;&gt;("Titre");   // une colonne « Titre »
colTitre.setCellValueFactory(new PropertyValueFactory&lt;&gt;("titre"));  // remplie via getTitre()
table.getColumns().add(colTitre);                     // on ajoute la colonne au tableau</pre>

<h3>2. PropertyValueFactory et l'introspection</h3>
<p><code>PropertyValueFactory("titre")</code> indique à la colonne d'aller chercher la valeur par <strong>introspection</strong> (la réflexion) : JavaFX appelle automatiquement la méthode <code>getTitre()</code> du Bean.</p>
<div class="warn">Conséquence directe : si le Bean n'a pas de getter pour un champ affiché, la colonne reste <strong>vide</strong> (ou lève une erreur). Chaque colonne du TableView exige son getter dans le POJO.</div>

<h3>3. ObservableList : la liste « surveillée »</h3>
<p>Un TableView ne se remplit pas avec une <code>List</code> ordinaire mais avec une <strong>ObservableList</strong> : une liste <em>observable</em> qui prévient automatiquement le tableau dès qu'elle change (ajout, suppression). L'affichage se met alors à jour tout seul.</p>
<pre class="pseudo">ObservableList&lt;Livre&gt; donnees = FXCollections.observableArrayList();   // liste observable
donnees.addAll(dao.lireTout());                       // on la remplit depuis le DAO
table.setItems(donnees);                              // on la lie au tableau (auto-refresh)</pre>
<div class="tip"><code>FXCollections.observableArrayList()</code> crée la liste observable. Modifier cette liste met à jour l'affichage sans code supplémentaire.</div>

<h3>4. TextField et Label : la saisie</h3>
<p>Le <strong>TextField</strong> est un champ de saisie d'une ligne ; sa valeur se lit avec <code>getText()</code>. Le <strong>Label</strong> affiche un texte fixe (souvent une étiquette devant un champ).</p>
<pre class="pseudo">TextField champTitre = new TextField();                // champ de saisie
champTitre.setPromptText("Titre du livre");            // texte d'invite (grisé)
String saisie = champTitre.getText();                  // récupère ce que l'utilisateur a tapé</pre>

<h3>5. Button et disposition (VBox / HBox)</h3>
<p>Le <strong>Button</strong> déclenche une action au clic (nous relierons l'événement demain). Pour organiser les composants, on utilise des <strong>conteneurs de disposition</strong> : <code>VBox</code> (empile verticalement), <code>HBox</code> (aligne horizontalement).</p>
<pre class="pseudo">Button btnAjouter = new Button("Ajouter");             // un bouton d'action
HBox formulaire = new HBox(10, champTitre, btnAjouter);// ligne : champ + bouton (espacement 10)
VBox racine = new VBox(10, formulaire, table);         // colonne : formulaire au-dessus du tableau
Scene scene = new Scene(racine, 800, 600);             // la disposition devient le contenu</pre>
<div class="tip">Assemblage typique d'un écran de gestion : en haut un <code>HBox</code> de saisie (champs + boutons), en dessous un <code>TableView</code> qui liste les données, le tout empilé dans un <code>VBox</code>.</div>`,
