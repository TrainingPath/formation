<h3>1. Ce qui change… et ce qui ne change pas</h3>
<p>En passant à JavaFX, la logique SQL du DAO reste <strong>strictement identique</strong> (mêmes SELECT, INSERT, UPDATE). Ce qui change, c'est la <strong>gestion des erreurs</strong> et le <strong>déclenchement</strong> des actions (par événement, plus par saisie clavier).</p>
<ul>
<li>Inchangé : la logique SQL, la structure des tables, <code>DatabaseConnection</code>.</li>
<li>Modifié : le DAO <em>propage</em> les erreurs, le Contrôleur <em>réagit</em> aux clics et <em>affiche</em> des Alert.</li>
</ul>

<h3>2. Le DAO propage : throws SQLException</h3>
<p>En console, un <code>e.printStackTrace()</code> dans le terminal était visible. En JavaFX, une erreur avalée en silence donnerait un clic « sans effet » — l'utilisateur ne verrait rien. On supprime donc les <code>System.out</code>/<code>printStackTrace</code> du DAO et on ajoute <code>throws SQLException</code> à ses méthodes.</p>
<pre class="pseudo">public List&lt;Livre&gt; listeLivreAvecDetails() throws SQLException {   // l'erreur remonte au contrôleur
    // … même SQL qu'avant, mais SANS try-catch silencieux …
}</pre>
<div class="tip">Le DAO ne décide plus comment afficher l'erreur : il dit seulement « je n'ai pas réussi, voici l'exception ». C'est au Contrôleur de choisir l'affichage.</div>

<h3>3. Le POJO : rien à changer</h3>
<p>Le Bean <code>Livre</code> n'a <strong>aucune modification</strong> à subir : ses getters, écrits pour la version console, sont exactement ce dont le <code>TableView</code> a besoin (introspection via <code>PropertyValueFactory</code>). Le DAO non plus n'a pas de nouvelle requête à écrire.</p>

<h3>4. Le contrôleur réagit : Alert et rafraîchissement</h3>
<p>Le Contrôleur intercepte l'exception avec un <code>try-catch</code> et affiche une <strong>Alert</strong> (boîte de dialogue JavaFX) en cas de problème. La méthode <code>rafraichirListe()</code> recharge l'<code>ObservableList</code> depuis le DAO.</p>
<pre class="pseudo">public void rafraichirListe() {                         // recharge le tableau
    try {
        donnees.setAll(dao.listeLivreAvecDetails());    // remplace le contenu de l'ObservableList
    } catch (SQLException e) {                           // la base est coupée ? contrainte violée ?
        Alert a = new Alert(Alert.AlertType.ERROR);     // boîte d'erreur graphique
        a.setTitle("Erreur base de données");
        a.setContentText(e.getMessage());               // message technique lisible
        a.showAndWait();                                // bloque jusqu'à ce que l'utilisateur ferme
    }
}</pre>
<div class="warn">Sans ce <code>throws</code> + <code>catch</code>, si la base est éteinte, l'utilisateur cliquerait « Rafraîchir » et… rien. Avec, une Alert rouge s'ouvre et explique le problème.</div>

<h3>5. Réagir à un clic : setOnAction</h3>
<p>En JavaFX, on associe une action à un bouton avec <code>setOnAction</code>. Le contrôleur devient <strong>réactif</strong> : il attend l'événement (le clic) plutôt qu'une saisie <code>Scanner</code>.</p>
<pre class="pseudo">btnRafraichir.setOnAction(e -&gt; rafraichirListe());      // au clic → recharge la liste</pre>
<div class="tip">Bilan : le modèle <code>LivreDAO</code> fournit la donnée brute (ou l'exception), et le contrôleur — lui seul — gère l'affichage des messages et le rafraîchissement du <code>TableView</code>. Séparation stricte des responsabilités.</div>`,

    solution: `<pre class="pseudo">// DAO : propage l'erreur
public List&lt;Livre&gt; listeLivreAvecDetails() throws SQLException {
    List&lt;Livre&gt; liste = new ArrayList&lt;&gt;();
    Connection c = DatabaseConnection.getInstance().getConnection();
    Statement st = c.createStatement();
    ResultSet rs = st.executeQuery("SELECT * FROM livres");
    while (rs.next()) { /* mapping … */ liste.add(/* livre */ new Livre()); }
    rs.close(); st.close();
    return liste;                                       // pas de catch silencieux ici
}

// Contrôleur : réagit et affiche
private ObservableList&lt;Livre&gt; donnees = FXCollections.observableArrayList();
private LivreDAO dao = new LivreDAO();

public void rafraichirListe() {
    try {
        donnees.setAll(dao.listeLivreAvecDetails());    // recharge le tableau
    } catch (SQLException e) {

        a.setTitle("Erreur base de données");
        a.setContentText(e.getMessage());
        a.showAndWait();
    }
}
// btnRafraichir.setOnAction(e -&gt; rafraichirListe());</pre>
