  title: "Transactions applicatives et gestion des erreurs",
  subtitle: "Tout ou rien : garantir la cohérence quand plusieurs requêtes s'enchaînent.",
  theory: `
<h3>1. Le problème : une opération en deux étapes</h3>
<p>Modifier les auteurs d'un livre se fait souvent en deux temps : <strong>supprimer</strong> les anciennes associations, puis <strong>insérer</strong> les nouvelles. Si le programme s'arrête <em>entre</em> les deux, le livre se retrouve <strong>sans aucun auteur</strong>. Il faut donc que les deux requêtes forment un bloc indivisible.</p>

<h3>2. La transaction et l'ACID</h3>
<p>Une <strong>transaction</strong> est un groupe d'opérations traitées comme une seule : soit toutes réussissent, soit aucune n'est appliquée. Elle respecte les propriétés <strong>ACID</strong> :</p>
<ul>
<li><strong>Atomicité</strong> : « tout ou rien ». On ne veut pas de suppression sans l'ajout qui suit.</li>
<li><strong>Cohérence</strong> : la base passe d'un état valide à un autre, en respectant les contraintes (clés étrangères).</li>
<li><strong>Isolation</strong> : les autres utilisateurs ne voient pas l'état intermédiaire.</li>
<li><strong>Durabilité</strong> : une fois validé (<code>commit</code>), les données sont sauvées définitivement.</li>
</ul>

<h3>3. En JDBC : désactiver l'auto-commit</h3>
<p>Par défaut, JDBC valide chaque requête aussitôt (<em>auto-commit</em>). Pour grouper, on le désactive, puis on valide manuellement avec <code>commit()</code> ou on annule avec <code>rollback()</code>.</p>
<pre class="pseudo">Connection c = DatabaseConnection.getInstance().getConnection();
try {
    c.setAutoCommit(false);                             // début de transaction (on ne valide plus auto)
    supprimerAnciensAuteurs(livreId);                   // étape 1 : DELETE
    ajouterNouvelAuteur(livreId, auteurId, pct);        // étape 2 : INSERT
    c.commit();                                         // les DEUX étapes sont validées ensemble
} catch (SQLException e) {
    c.rollback();                                       // une erreur : on annule TOUT
} finally {
    c.setAutoCommit(true);                              // on rétablit le mode normal (crucial !)
}</pre>
<div class="warn">Avec un Singleton, remettre <code>setAutoCommit(true)</code> dans le <code>finally</code> est <strong>vital</strong> : sinon toutes les futures requêtes de l'application resteraient « en attente » d'un commit et ne seraient jamais visibles.</div>

<h3>4. commit et rollback</h3>
<ul>
<li><code>commit()</code> : valide définitivement toutes les opérations depuis le début de la transaction.</li>
<li><code>rollback()</code> : annule toutes les opérations et ramène la base à son état d'avant la transaction.</li>
</ul>
<div class="tip">Le <code>rollback()</code> se place dans le <code>catch</code> : dès qu'une requête échoue, on annule le lot entier plutôt que de laisser la base à moitié modifiée.</div>

<h3>5. Gérer les erreurs : laisser remonter l'exception</h3>
<p>En vue d'une future interface graphique, le DAO ne doit <em>pas</em> avaler les erreurs en silence (pas de <code>e.printStackTrace()</code> muet). On préfère qu'il <strong>propage</strong> l'exception (<code>throws SQLException</code>) : ainsi le Contrôleur peut décider comment l'afficher (message clair, boîte de dialogue…).</p>
<pre class="pseudo">public void modifierAuteurs(int livreId, int auteurId, double pct) throws SQLException {
    // le DAO propage l'erreur : c'est le contrôleur qui décidera de l'affichage
}</pre>
<div class="tip">Une SQLException fréquente : violer une contrainte (clé étrangère, CHECK). Bien gérée, elle devient un message utile pour l'utilisateur plutôt qu'un plantage.</div>`,

  ],

      { type: "vf", q: "Sans transaction, un plantage entre DELETE et INSERT laisse le livre sans auteur.", a: true, exp: "C'est le risque évité." }
    ],
    solution: `<pre class="pseudo">public void modifierAuteurs(int livreId, int nouvelAuteurId, double pct) throws SQLException {
    Connection c = DatabaseConnection.getInstance().getConnection();
    try {
        c.setAutoCommit(false);                         // ouverture de la transaction
        // étape 1 : DELETE des anciennes associations
        PreparedStatement d = c.prepareStatement("DELETE FROM livre_auteur WHERE livre_id = ?");
        d.setInt(1, livreId); d.executeUpdate(); d.close();
        // étape 2 : INSERT de la nouvelle association
        PreparedStatement i = c.prepareStatement(
            "INSERT INTO livre_auteur (livre_id, auteur_id, pourcentage_commission) VALUES (?, ?, ?)");
        i.setInt(1, livreId); i.setInt(2, nouvelAuteurId); i.setDouble(3, pct);
        i.executeUpdate(); i.close();
        c.commit();                                     // tout réussit → on valide le lot
    } catch (SQLException e) {
        c.rollback();                                   // une erreur → on annule tout
        throw e;                                        // on propage pour l'affichage
    } finally {
        c.setAutoCommit(true);                          // on rétablit le mode normal (crucial)
    }
}</pre>
<p>Atomicité garantie : le livre n'est jamais laissé sans auteur. Demain : on quitte la console pour JavaFX.</p>`
  }
