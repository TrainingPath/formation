<h3>1. Qu'est-ce que le patron MVC ?</h3>
<p><strong>MVC</strong> (Modèle-Vue-Contrôleur) est une <strong>architecture logicielle</strong> qui sépare l'application en trois composants distincts, pour faciliter la maintenance et l'évolution. Chaque partie a un rôle précis et ne déborde pas sur les autres.</p>
<pre class="pseudo">M (Modele)      -- gere les donnees et l'acces SQL a la base
V (Vue)         -- gere l'interface : affichage et saisies (Scanner, System.out)
C (Controleur)  -- fait le lien entre la Vue et le Modele</pre>

<h3>2. Le Modèle : l'entité « intelligente »</h3>
<p>Le <strong>Modèle</strong> gère les données et la logique d'accès à la base. Ici, chaque <strong>classe entité</strong> représente une table de <code>library_db</code> et encapsule ses propres méthodes CRUD. La Vue et le Contrôleur n'écrivent jamais de SQL.</p>
<pre class="pseudo">public class Section {                                 // entite = table sections
    private int sectionId;                             // colonne section_id
    private String nomSection;                         // colonne nom_section
    // Methodes CRUD : creer(), lireTout(), mettreAJour(), supprimer()
    public boolean creer() {                           // le modele encapsule le SQL
        String sql = "INSERT INTO sections (nom_section) VALUES (?)";   // requete parametree
        // ... prepareStatement + setString + executeUpdate ...
        return true;                                   // succes
    }
}</pre>
<div class="tip">L'entité connaît sa table SQL et utilise le Singleton <code>DatabaseConnection</code> pour parler à MariaDB. On ne ferme que le Statement et le ResultSet, jamais la Connection partagée.</div>

<h3>3. Le Contrôleur : le médiateur</h3>
<p>Le <strong>Contrôleur</strong> ne contient <strong>pas de SQL</strong>. Il reçoit les ordres de la Vue et pilote le Modèle : il crée un objet, lui affecte des valeurs, appelle sa méthode, puis renvoie le résultat (un booléen, une liste) à la Vue.</p>
<pre class="pseudo">public class SectionController {                       // le mediateur
    public boolean ajouter(String nom) {               // recoit un nom depuis la Vue
        Section s = new Section();                      // cree l'entite
        s.setNomSection(nom);                           // affecte la donnee
        return s.creer();                               // demande au Modele d'agir
    }
    public List&lt;Section&gt; getListe() {                   // renvoie les donnees a la Vue
        return Section.lireTout();                       // delegue la lecture au Modele
    }
}</pre>

<h3>4. La Vue : l'interface console</h3>
<p>La <strong>Vue</strong> gère l'interface. En mode console, elle s'occupe des <code>System.out.println()</code> et des saisies <code>Scanner</code>. Elle est « muette » concernant la base : elle ne connaît que le Contrôleur, jamais le SQL.</p>
<pre class="pseudo">public class SectionView {                             // la seule classe avec Scanner et println
    private SectionController ctrl = new SectionController();   // elle connait le controleur
    public void menuAjouter() {
        Scanner sc = new Scanner(System.in);            // saisie utilisateur
        System.out.print("Nom de la section : ");       // affichage
        String nom = sc.nextLine();                     // lecture
        if (ctrl.ajouter(nom)) {                         // appel du controleur
            System.out.println("Section ajoutee.");      // retour a l'utilisateur
        }
    }
}</pre>
<div class="warn">La Vue ne doit jamais écrire de SQL ni ouvrir de connexion. Si l'on passait de la console à une interface graphique (Swing), seule la Vue changerait : c'est tout l'intérêt de MVC.</div>

<h3>5. Le flux de travail</h3>
<p>Une action de l'utilisateur traverse les trois couches, dans un sens puis dans l'autre :</p>
<pre class="pseudo">1. Vue        -- l'utilisateur choisit "Afficher les livres"
2. Controleur -- la Vue appelle getListeLivres() du controleur
3. Modele     -- le controleur demande a l'entite Livre d'executer SELECT * FROM livres
4. Modele     -- l'entite recupere la connexion via le Singleton DatabaseConnection
5. Modele     -- transforme les lignes SQL en objets Java, les renvoie au controleur
6. Controleur -- recoit la liste et demande a la Vue de l'afficher
7. Vue        -- parcourt la liste et affiche les titres</pre>
<div class="tip">Bilan des 16 jours : d'une base de données (library_db) jusqu'à une application Java structurée, sécurisée (validation regex, PreparedStatement) et bien organisée (MVC). Vous tenez tous les maillons de la chaîne. Bravo !</p>
</div>`,

    solution: "import java.sql.*;                                          // Connection, PreparedStatement, SQLException\n\npublic class Section {                                     // MODELE : entite de la table sections\n    private int sectionId;                                 // colonne section_id\n    private String nomSection;                             // colonne nom_section\n\n    public void setNomSection(String n) { this.nomSection = n; }   // affectation depuis le controleur\n    public int getSectionId() { return sectionId; }\n\n    public boolean creer() {                               // encapsule l'INSERT (aucun SQL ailleurs)\n        String sql = \"INSERT INTO sections (nom_section) VALUES (?)\";   // requete parametree\n        try {\n            Connection conn = DatabaseConnection.getInstance();        // connexion partagee (Singleton)\n            try (PreparedStatement ps = conn.prepareStatement(sql)) {  // on ferme l'outil, pas la connexion\n                ps.setString(1, nomSection);               // liage du parametre\n                return ps.executeUpdate() == 1;            // true si une ligne inseree\n            }\n        } catch (SQLException e) {                         // erreur d'acces\n            System.out.println(\"Erreur : \" + e.getMessage());\n            return false;\n        }\n    }\n}\n// Resultat attendu :\n//   Section s = new Section(); s.setNomSection(\"Histoire\"); s.creer(); -> true\n//   Le Controleur et la Vue n'ecrivent jamais de SQL : tout est dans le Modele.",
