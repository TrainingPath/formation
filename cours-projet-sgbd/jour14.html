  title: "Statement ou PreparedStatement ?",
  subtitle: "Sécurité, performance, lisibilité : pourquoi le PreparedStatement gagne.",
  theory: `
<h3>1. La différence fondamentale</h3>
<p>Le choix entre <strong>Statement</strong> et <strong>PreparedStatement</strong> impacte la sécurité et la performance. Tout se joue au <strong>moment où la requête est analysée</strong> par la base :</p>
<pre class="pseudo">Statement         -- la requete est envoyee telle quelle ; la base la compile a CHAQUE execution ("one-shot")
PreparedStatement -- la requete est PRE-COMPILEE avec des parametres fictifs (les ?), puis reutilisee</pre>
<p>Avec un <strong>PreparedStatement</strong>, on écrit une requête <strong>paramétrée</strong> : des points d'interrogation <code>?</code> marquent les emplacements des futures valeurs. La base reçoit d'abord le « plan » de la requête, le compile, puis attend les données pour « remplir les trous ».</p>

<h3>2. Sécurité : l'argument numéro un</h3>
<p>C'est l'argument décisif. Avec un <strong>Statement</strong> construit par concaténation, une saisie malveillante peut modifier la structure de la commande :</p>
<pre class="pseudo">// DANGEREUX : concatenation
"SELECT * FROM clients WHERE nom = '" + saisie + "'"
// si saisie = ' OR '1'='1  ->  la condition devient toujours vraie -> injection SQL</pre>
<p>Le <strong>PreparedStatement</strong> traite la saisie comme une <strong>valeur littérale</strong>, jamais comme du code. Même si l'utilisateur tape <code>'; DROP TABLE clients; --</code>, JDBC l'échappe automatiquement : ce texte est cherché tel quel comme un nom, il n'est pas exécuté.</p>
<div class="warn">Le Statement garde les apostrophes de l'attaquant et les exécute. Le PreparedStatement les neutralise seul. C'est pourquoi il est <strong>impossible</strong> d'injecter du SQL au travers d'un paramètre <code>?</code>.</div>

<h3>3. Performance : compiler une fois</h3>
<p>Si vous insérez 1000 lignes, un Statement fait compiler la requête 1000 fois. Un PreparedStatement la compile <strong>une seule fois</strong> et réutilise le plan d'exécution : la charge CPU du serveur SQL chute.</p>
<pre class="pseudo">Boucle de 1000 INSERT
  Statement         -> 1000 compilations   (lent)
  PreparedStatement -> 1 compilation        (rapide)</pre>

<h3>4. Lisibilité : la fin de « l'enfer des guillemets »</h3>
<p>Avec un Statement et plusieurs variables, la concaténation devient illisible (le fameux « enfer des guillemets »). Le PreparedStatement reste propre quel que soit le nombre de paramètres. Et le typage est automatique : on passe des objets Java (int, String) sans se soucier des <code>' '</code> autour des valeurs.</p>
<pre class="pseudo">// Statement : enfer des guillemets
"INSERT INTO clients (nom, email) VALUES ('" + nom + "', '" + email + "')"
// PreparedStatement : squelette clair
"INSERT INTO clients (nom, email) VALUES (?, ?)"</pre>

<h3>5. Le tableau de synthèse</h3>
<pre class="pseudo">Caracteristique    Statement                    PreparedStatement
Pre-compilation    Non                          Oui
Parametres         Concatenation (difficile)    Marqueurs ? (propre)
Performance        Moins bon en boucle          Excellent en repetition
Securite           Vulnerable aux injections    Securise contre les injections
Lisibilite         Illisible avec des variables Tres propre et maintenable</pre>
<div class="tip">Règle à retenir : <strong>Statement</strong> uniquement pour des requêtes fixes, sans variable, exécutées rarement (ex. un SELECT * global). <strong>PreparedStatement</strong> dès qu'il y a une valeur venant de l'utilisateur : c'est le <strong>standard moderne</strong>. Demain, on l'utilise pour insérer, modifier et supprimer.</p>
</div>`,

    { type: "vf", q: "Une saisie ' OR '1'='1 dans un Statement concaténé peut provoquer une injection.", a: true, exp: "La concaténation mélange code et données." },
    { type: "input", q: "Comment appelle-t-on la difficulté d'écrire des guillemets dans un Statement à plusieurs variables ?", a: ["enfer des guillemets", "l'enfer des guillemets"], ph: "expression du cours", exp: "L'« enfer des guillemets »." },

    { type: "vf", q: "Le PreparedStatement gère automatiquement le typage (int, String).", a: true, exp: "On passe des objets Java, sans gérer les ' ' manuellement." },
    { type: "qcm", q: "Quand un simple Statement suffit-il ?", opts: ["Toujours", "Pour une requête fixe sans variable, exécutée rarement", "Pour toute saisie utilisateur", "Jamais"], a: 1, exp: "Requêtes fixes et occasionnelles uniquement." },
    { type: "input", q: "Quel objet JDBC est « pré-compilé » avec des paramètres fictifs ?", a: ["preparedstatement"], ph: "classe JDBC", exp: "Le PreparedStatement est pré-compilé." },
    { type: "vf", q: "Le PreparedStatement est le standard moderne dès qu'il y a une valeur utilisateur.", a: true, exp: "Plus sûr, plus propre, plus performant." },
    { type: "qcm", q: "Face à '; DROP TABLE clients; -- dans un PreparedStatement, le résultat est…", opts: ["La table est supprimée", "Le texte est cherché tel quel comme un nom, sans être exécuté", "Une injection réussie", "Un plantage garanti"], a: 1, exp: "Le paramètre est une donnée, pas une commande." },
    { type: "qcm", q: "Le PreparedStatement rend le code…", opts: ["plus illisible", "plus propre et maintenable", "impossible à compiler", "plus lent en boucle"], a: 1, exp: "Le squelette avec ? reste lisible." },
    { type: "vf", q: "Un nom contenant une apostrophe (O'BRIEN) casse un Statement concaténé, mais pas un PreparedStatement.", a: true, exp: "L'apostrophe ferme prématurément la chaîne dans le Statement." }
  ],
  final: {

      { type: "input", q: "Symbole du paramètre :", a: ["?"], ph: "caractère", exp: "?." },
      { type: "vf", q: "Le PreparedStatement rend l'injection SQL impossible via ses paramètres.", a: true, exp: "Données échappées automatiquement." },
      { type: "vf", q: "En boucle d'insertions, le PreparedStatement est plus performant.", a: true, exp: "Une seule compilation réutilisée." }
    ],
    solution: `<pre class="pseudo">// Requete FIXE, sans variable -> Statement
Statement st = conn.createStatement();
ResultSet rs = st.executeQuery("SELECT * FROM livres");

// Requete avec une SAISIE utilisateur -> PreparedStatement

// Bilan : Statement pour le fixe et rare ; PreparedStatement partout ailleurs.</pre>
<p>Le choix est clair. Demain : insérer, modifier et supprimer avec le PreparedStatement.</p>`
