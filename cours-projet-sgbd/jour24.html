<h3>1. Pourquoi JavaFX ?</h3>
<p><strong>JavaFX</strong> est la boîte à outils graphique de Java. Au lieu de <code>Scanner</code> et <code>System.out.println()</code>, on manipule des <strong>composants</strong> : <code>TableView</code> (tableau), <code>TextField</code> (champ de saisie), <code>Button</code> (bouton). L'architecture MVC + DAO reste identique : <em>seule la Vue change</em>.</p>
<div class="tip">Grâce au découpage des semaines précédentes, le Modèle (Bean + DAO) et le Contrôleur ne bougent presque pas. On récolte ici les fruits de la séparation des responsabilités.</div>

<h3>2. Installer le SDK JavaFX</h3>
<p>JavaFX n'est plus inclus dans le JDK. On télécharge le <strong>SDK JavaFX</strong> (site Gluon), on décompresse l'archive, puis, dans NetBeans (projet Ant) :</p>
<ul>
<li>créer un dossier <code>Librairies</code> à la racine du projet ;</li>
<li>y copier les <code>.jar</code> du dossier <code>lib/</code> et les <code>.dll</code> du dossier <code>bin/</code> du SDK ;</li>
<li>clic droit sur le projet → <em>Properties → Libraries → Compile</em> → ajouter tous les <code>.jar</code>.</li>
</ul>

<h3>3. La classe Application et son cycle de vie</h3>
<p>Une application JavaFX hérite de <code>javafx.application.Application</code> et redéfinit la méthode <strong><code>start(Stage stage)</code></strong>, appelée automatiquement au démarrage. Le <code>Stage</code> est la <strong>fenêtre</strong> ; la <code>Scene</code> est son <strong>contenu</strong>.</p>
<pre class="pseudo">public class Main extends Application {                 // notre appli hérite d'Application
    @Override
    public void start(Stage stage) {                    // appelée au lancement (le Stage = la fenêtre)
        Label titre = new Label("Bibliothèque");        // un composant simple
        Scene scene = new Scene(titre, 800, 600);       // la Scene (contenu) : 800x600 px
        stage.setTitle("Gestion de la bibliothèque");   // titre de la fenêtre
        stage.setScene(scene);                          // on place la scène dans la fenêtre
        stage.show();                                   // on affiche la fenêtre
    }
}</pre>
<div class="tip">Résumé du vocabulaire : <strong>Stage</strong> = la fenêtre (le cadre), <strong>Scene</strong> = ce qu'elle contient, <strong>composants</strong> = les éléments (boutons, tableaux…) placés dans la scène.</div>

<h3>4. La classe Lanceur (contourner Ant)</h3>
<p>Depuis Java 9+, lancer JavaFX sans configurer les modules complexes demande une astuce : une classe <strong>Lanceur</strong> ordinaire (qui n'hérite pas d'<code>Application</code>) sert de point d'entrée et appelle la classe JavaFX.</p>
<pre class="pseudo">public class Lanceur {                                  // point d'entrée « classique »
    public static void main(String[] args) {            // le vrai main
        Main.main(args);                                // délègue au lancement JavaFX
    }
}
// et dans Main : public static void main(String[] a) { launch(a); }   // launch() démarre JavaFX</pre>

<h3>5. Configurer l'exécution (VM Options)</h3>
<p>Comme on utilise Ant, il faut indiquer à la JVM où trouver les bibliothèques natives (<code>.dll</code>) :</p>
<ul>
<li>clic droit sur le projet → <em>Properties → Run</em> ;</li>
<li><em>Main Class</em> : <code>bd_projet.Lanceur</code> ;</li>
<li><em>VM Options</em> : <code>-Djava.library.path="Librairies"</code>.</li>
</ul>
