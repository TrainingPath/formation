  theory: `
<h3>1. JDBC, la passerelle standard</h3>
<p><strong>JDBC</strong> (Java Database Connectivity) est l'outil standard qui permet à une application Java de « parler » à une base de données. C'est une <strong>API</strong> : un ensemble de classes et d'interfaces. Que vous utilisiez MySQL, PostgreSQL, Oracle ou SQL Server, le code Java reste quasiment le même.</p>
<div class="tip">Une <strong>API</strong> (Application Programming Interface) est un contrat : un ensemble de méthodes qu'on appelle sans connaître les détails internes. JDBC définit <em>comment</em> demander une connexion, exécuter une requête, lire un résultat.</div>

<h3>2. Pourquoi JDBC est-il important ?</h3>
<pre class="pseudo">Abstraction     -- pas besoin de savoir comment MySQL gere ses fichiers reseau
Standardisation -- changer de SGBD = changer le driver et l'URL, pas tout le code metier
Fondation       -- meme Hibernate ou Spring Data utilisent JDBC "sous le capot"</pre>
<p>Grâce à cette abstraction, votre logique métier (vendre un livre, calculer une commission) ne dépend pas de la marque du SGBD.</p>

<h3>3. Le driver JDBC (Connector/J)</h3>
<p>Un <strong>driver</strong> (pilote) est le composant qui traduit les appels JDBC génériques en dialecte propre à un SGBD. Pour MySQL, il s'appelle <strong>Connector/J</strong>. Sans lui, Java ne sait pas parler à MySQL.</p>
<pre class="pseudo">JDBC (API generique)  ->  Driver Connector/J  ->  MySQL / MariaDB
// Java parle "JDBC", le driver traduit en "MySQL"</pre>

<h3>4. Télécharger le bon driver</h3>
<p>On télécharge le connecteur officiel <strong>Connector/J</strong> sur le site d'Oracle (<code>dev.mysql.com/downloads/connector/j</code>). Deux points du support :</p>
<pre class="pseudo">Action 1 : choisir "Platform Independent"   -- pour une compatibilite maximale (tout OS)
Action 2 : telecharger la version ZIP        -- l'archive compressee</pre>
<p>Le dossier décompressé contient un fichier <strong>.jar</strong> (une bibliothèque Java empaquetée) : c'est <code>mysql-connector-j-x.x.x.jar</code>, le pilote qu'on ajoutera au projet demain.</p>
<div class="warn">Un fichier <strong>.jar</strong> (Java ARchive) est une archive contenant des classes Java compilées. Le driver est livré sous cette forme : on l'ajoutera aux bibliothèques du projet, jamais dans le code source.</div>

<h3>5. Anatomie d'une connexion JDBC</h3>
<p>Une fois le driver en place, se connecter tient en trois informations : une <strong>URL de connexion</strong>, un <strong>utilisateur</strong> et un <strong>mot de passe</strong>.</p>
<pre class="pseudo">// URL JDBC vers notre base fil rouge :
jdbc:mysql://localhost:3306/library_db
// jdbc:mysql   -> protocole + type de SGBD (gere par le driver)
// localhost    -> serveur (ici la machine locale)
// 3306         -> port par defaut de MySQL/MariaDB
// library_db   -> nom de la base a ouvrir</pre>
<p>Aujourd'hui, on comprend les pièces du puzzle : API JDBC, driver Connector/J, fichier .jar, URL de connexion. Demain, on intègre concrètement ce .jar dans un projet NetBeans.</p>`,
