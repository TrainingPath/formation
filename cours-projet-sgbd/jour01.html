<script>
var DAY = {
  num: 1,
  title: "Présentation du projet : une bibliothèque à développer",
  subtitle: "Le fil rouge : une base library_db à connecter à une application Java.",
  theory: `
<h3>1. De quoi parle ce cours ?</h3>
<p>Pendant seize jours, vous allez construire une petite <strong>application de gestion</strong> pour une <strong>bibliothèque</strong>. Le cœur du projet est une base de données réelle nommée <code>library_db</code> : elle gère des sections, des éditeurs, des collections, des livres, des exemplaires en rayon, des auteurs, des clients, des ventes et le calcul automatique des <strong>commissions</strong> versées aux auteurs.</p>
<p>Un <strong>SGBD</strong> (Système de Gestion de Base de Données) est le logiciel qui stocke et organise les données : ici ce sera <strong>MySQL</strong> ou <strong>MariaDB</strong> (deux SGBD très proches, MariaDB étant un dérivé libre de MySQL). Votre application, elle, sera écrite en <strong>Java</strong> et communiquera avec ce SGBD grâce à <strong>JDBC</strong>.</p>

<h3>2. Les technologies du projet</h3>
<p>Voici les quatre briques que vous allez assembler :</p>
<pre class="pseudo">Java        // le langage de programmation de l'application
JDBC        // la passerelle standard entre Java et une base de donnees
NetBeans    // l'IDE (environnement de developpement) ou l'on ecrit et lance le code
MySQL/MariaDB   // le SGBD qui stocke reellement les donnees</pre>
<p>Un <strong>IDE</strong> (Integrated Development Environment) est un atelier logiciel : éditeur de code, compilateur, lanceur de programme et gestion des bibliothèques au même endroit. Nous utiliserons <strong>NetBeans</strong>.</p>

<h3>3. Le fil rouge : la base library_db</h3>
<p>Toute cette formation tourne autour d'une seule base : <code>library_db</code>. Elle contient une dizaine de <strong>tables</strong> (une table = un tableau de données, avec des colonnes et des lignes) :</p>
<pre class="pseudo">sections                -- les rayons de la bibliotheque (Informatique, Roman...)
editions                -- les maisons d'edition (Dunod, Gallimard...)
collections             -- les collections rattachees a un editeur
livres                  -- les livres (titre, annee, nb_pages, prix_unitaire...)
exemplaires             -- les copies physiques d'un livre, avec code d'inventaire
auteurs                 -- les auteurs (nom, prenom)
livre_auteur            -- qui a ecrit quoi, et son pourcentage de commission
clients                 -- les acheteurs (nom, email)
ventes                  -- les ventes de livres a des clients
commissions_historique  -- les commissions calculees automatiquement</pre>
<div class="tip">Le mot <strong>fil rouge</strong> signifie que chaque leçon s'appuie sur cette même base. Vous n'apprenez pas des exemples abstraits : vous développez, jour après jour, la vraie application de la bibliothèque.</div>

<h3>4. Ce que vous saurez faire à la fin</h3>
<p>Le parcours suit une progression logique, du modèle de données jusqu'au code Java :</p>
<pre class="pseudo">Jours 1-4   // comprendre, creer et peupler la base library_db
Jours 5-7   // penser securite : les injections SQL et la validation
Jours 8-9   // valider les saisies avec les expressions regulieres (regex)
Jours 10-12 // connecter Java a MySQL avec JDBC sous NetBeans
Jours 13-15 // lire et modifier les donnees (Statement, PreparedStatement)
Jour 16     // organiser le code avec le patron MVC</pre>
<div class="warn">Un principe reviendra sans cesse à partir du jour 5 : <strong>ne jamais faire confiance à l'utilisateur</strong>. Toute donnée saisie doit être validée avant d'atteindre la base. C'est la règle d'or de la sécurité des applications.</div>

<h3>5. Une donnée, un long voyage</h3>
<p>Quand un employé vendra un livre, la donnée traversera toute la chaîne que vous allez construire :</p>
<pre class="pseudo">Utilisateur   // saisit le client et le livre dans l'application
Java          // valide la saisie (regex) puis prepare la requete
JDBC          // transmet la requete au SGBD, de facon securisee
MySQL         // enregistre la vente et declenche le calcul des commissions
Java          // recupere le resultat et l'affiche a l'utilisateur</pre>
<p>Chaque jour de ce cours ajoute un maillon à cette chaîne. Aujourd'hui, l'objectif est simple : bien comprendre où l'on va.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie SGBD ?", opts: ["Système de Gestion de Base de Données", "Serveur Général de Bases Distribuées", "Structure Générique Basée sur Données", "Système Graphique de Bureautique Dynamique"], a: 0, exp: "SGBD = Système de Gestion de Base de Données (MySQL, MariaDB...)." },
    { type: "qcm", q: "Dans ce projet, quel est le rôle de JDBC ?", opts: ["Dessiner l'interface", "Faire communiquer Java avec la base de données", "Compiler le code Java", "Sauvegarder les fichiers"], a: 1, exp: "JDBC est la passerelle standard entre une application Java et un SGBD." },
    { type: "qcm", q: "Quelle table stocke les copies physiques d'un livre en rayon ?", opts: ["livres", "collections", "exemplaires", "sections"], a: 2, exp: "La table exemplaires contient les copies physiques avec leur code d'inventaire." },
    { type: "input", q: "Quel est le nom exact de la base fil rouge du projet ?", a: ["library_db"], ph: "nom_de_la_base", exp: "La base s'appelle library_db." },
    { type: "vf", q: "MariaDB est un dérivé libre très proche de MySQL.", a: true, exp: "MariaDB est un fork libre de MySQL, d'où une compatibilité quasi totale." },
    { type: "qcm", q: "Qu'est-ce qu'un IDE comme NetBeans ?", opts: ["Un SGBD", "Un atelier de développement (éditeur, compilateur, exécution)", "Un langage de programmation", "Un pilote de base de données"], a: 1, exp: "Un IDE regroupe éditeur, compilateur et exécution du code." },
    { type: "input", q: "Quel langage de programmation sert à écrire l'application ?", a: ["java"], ph: "langage", exp: "L'application est écrite en Java." },
    { type: "vf", q: "La table commissions_historique enregistre les commissions dues aux auteurs.", a: true, exp: "Elle stocke le montant dû à chaque auteur pour chaque vente." },
    { type: "qcm", q: "La table livre_auteur sert notamment à connaître…", opts: ["Le prix d'un exemplaire", "Le pourcentage de commission d'un auteur sur un livre", "L'adresse d'un client", "Le nombre de pages"], a: 1, exp: "livre_auteur relie livres et auteurs et porte le pourcentage_commission." },
    { type: "input", q: "Quelle technologie relie Java à MySQL ? (sigle de 4 lettres)", a: ["jdbc"], ph: "sigle", exp: "JDBC = Java Database Connectivity." },
    { type: "qcm", q: "Que signifie l'expression « fil rouge » dans ce cours ?", opts: ["Un exercice noté", "Une base unique réutilisée dans toutes les leçons", "Un message d'erreur", "Une commande SQL"], a: 1, exp: "Le fil rouge est la base library_db, présente d'un bout à l'autre." },
    { type: "vf", q: "Dans ce projet, on peut faire aveuglément confiance aux données saisies par l'utilisateur.", a: false, exp: "Règle d'or : ne jamais faire confiance à l'utilisateur. On valide toujours." },
    { type: "qcm", q: "Quelles tables gèrent le classement des livres ?", opts: ["clients et ventes", "sections, editions et collections", "auteurs seulement", "commissions_historique"], a: 1, exp: "sections, editions et collections organisent le catalogue des livres." },
    { type: "input", q: "Comment appelle-t-on un tableau de données (colonnes et lignes) dans une base ?", a: ["table", "une table"], ph: "un mot", exp: "On parle d'une table." },
    { type: "qcm", q: "Dans quel ordre progresse le cours ?", opts: ["MVC puis création de la base", "Base, sécurité/regex, JDBC, CRUD, MVC", "JDBC en premier, base en dernier", "Regex uniquement"], a: 1, exp: "On part du modèle de données pour finir par l'architecture MVC." }
  ],
  final: {
    title: "Exercice final — Cartographier le projet",
    intro: `<p>Vérifions que le plan général et le vocabulaire sont clairs.</p>`,
    questions: [
      { type: "qcm", q: "Le SGBD utilisé dans le projet :", opts: ["Oracle", "MySQL/MariaDB", "SQLite", "MongoDB"], a: 1, exp: "MySQL ou son dérivé MariaDB." },
      { type: "qcm", q: "L'IDE utilisé :", opts: ["Eclipse", "IntelliJ", "NetBeans", "VS Code"], a: 2, exp: "NetBeans." },
      { type: "input", q: "Sigle de la passerelle Java–base de données :", a: ["jdbc"], ph: "4 lettres", exp: "JDBC." },
      { type: "vf", q: "commissions_historique est calculée automatiquement à partir des ventes.", a: true, exp: "Un déclencheur (trigger) la remplit après chaque vente." },
      { type: "qcm", q: "La dernière étape du parcours (jour 16) :", opts: ["Créer la base", "Le patron MVC", "Installer MySQL", "Écrire une regex"], a: 1, exp: "Le jour 16 introduit l'architecture MVC." }
    ],
    solution: `<pre class="pseudo">// Carte du projet library_db
// SGBD      : MySQL / MariaDB
// Langage   : Java
// Passerelle: JDBC
// IDE       : NetBeans
//
// Tables du catalogue : sections, editions, collections, livres, exemplaires
// Tables des acteurs  : auteurs, clients
// Table de liaison    : livre_auteur (porte le pourcentage_commission)
// Tables d'activite   : ventes, commissions_historique
//
// Regle d'or : ne jamais faire confiance a l'utilisateur -> toujours valider.</pre>
<p>Vous avez la vue d'ensemble. Demain, on lit le modèle de données en détail.</p>`
  }
};
</script>
