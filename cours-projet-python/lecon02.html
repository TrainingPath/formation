<script>
var DAY = {
  num: 2,
  title: "Mise en place : Django + connexion MySQL",
  subtitle: "Créer le projet et le brancher sur la base de la Ludothèque.",
  theory: `
<h3>1. Créer le projet et l'app</h3>
<pre class="pseudo">python -m venv .venv && source .venv/bin/activate    # crée un dossier isolé .venv, puis l'active
pip install django mysqlclient djangorestframework   # installe Django, le connecteur MySQL et DRF
django-admin startproject ludotheque .               # génère le projet "ludotheque" dans le dossier courant
python manage.py startapp catalogue                  # crée l'app "catalogue" à l'intérieur du projet</pre>
<p>Un <strong>environnement virtuel</strong> (souvent abrégé <em>venv</em>) est une bulle isolée, propre à ce projet, où l'on installe les outils dont il a besoin sans polluer le reste de l'ordinateur — comme une trousse réservée à un seul cours. <code>pip</code> est l'outil qui <strong>installe</strong> les <strong>dépendances</strong> (des bibliothèques de code écrites par d'autres et que l'on réutilise). <code>mysqlclient</code> est le <strong>connecteur</strong> qui permettra à l'ORM de parler à MySQL (l'ORM, vu en leçon 5, traduit du Python en SQL). <strong>DRF</strong> (Django REST Framework) servira à construire l'API JSON (leçon 7). La commande <code>startproject</code> crée le projet ; <code>startapp</code> crée une « app » (un module fonctionnel à l'intérieur du projet, ici le catalogue de jeux).</p>

<h3>2. Enregistrer l'app</h3>
<pre class="pseudo"># settings.py
INSTALLED_APPS = [                                       # la liste des applications activées
    "django.contrib.admin", "django.contrib.auth", ...,  # des apps fournies d'office par Django
    "rest_framework",                                    # la boîte à outils pour l'API JSON
    "catalogue",                                         # notre app ; sans ça, pas de migrations pour nos modèles
]</pre>
<p>Le fichier <code>settings.py</code> rassemble tous les <strong>réglages</strong>. <code>INSTALLED_APPS</code> est la liste des applications actives : tant que <code>catalogue</code> n'y figure pas, Django l'ignore et ne génère aucune <strong>migration</strong> (un fichier qui décrit une évolution de la base) pour nos modèles.</p>

<h3>3. Brancher MySQL</h3>
<pre class="pseudo"># settings.py
import os                                               # module standard pour lire les variables d'environnement

DATABASES = {                                           # dictionnaire décrivant les bases de données du projet
    "default": {                                        # la base principale
        "ENGINE": "django.db.backends.mysql",           # le "moteur" : on parle à MySQL
        "NAME": "ludotheque",                           # nom de la base créée au cours MySQL
        "USER": "ludo_app",                             # utilisateur dédié (surtout pas root)
        "PASSWORD": os.environ["DB_PASSWORD"],          # mot de passe lu dans l'environnement, jamais en clair !
        "HOST": os.environ.get("DB_HOST", "localhost"), # serveur ; "localhost" par défaut si non défini
        "PORT": "3306",                                 # port réseau standard de MySQL
    }
}</pre>
<p>La base <code>ludotheque</code> et l'utilisateur <code>ludo_app</code> viennent du cours MySQL (commandes <code>CREATE DATABASE</code>, <code>CREATE USER</code>, <code>GRANT</code>). Une <strong>variable d'environnement</strong> est une valeur rangée <em>en dehors</em> du code, dans le système, et lue au démarrage : c'est là qu'on cache les secrets comme le mot de passe. Point crucial : l'application ne se connecte <strong>pas en root</strong> (le compte tout-puissant), mais avec un utilisateur aux droits limités.</p>

<h3>4. Vérifier</h3>
<pre class="pseudo">python manage.py check      # diagnostic de la config : "System check identified no issues"
python manage.py migrate    # applique les migrations intégrées (auth, sessions…) : crée leurs tables
python manage.py runserver  # démarre le serveur de test → http://127.0.0.1:8000</pre>
<p><code>check</code> fait un diagnostic rapide de la configuration. <code>migrate</code> exécute les migrations et crée déjà les tables de <code>django.contrib.auth</code> (la gestion des comptes utilisateurs) : elles serviront aux leçons 9-11. <code>runserver</code> lance un petit serveur web local pour tester dans le navigateur à l'adresse indiquée.</p>

<h3>5. requirements.txt</h3>
<pre class="pseudo">pip freeze &gt; requirements.txt   # écrit la liste exacte des versions installées → installation rejouable</pre>
<p><code>pip freeze</code> liste les versions exactes de tout ce qui est installé ; les figer dans <code>requirements.txt</code> permet de recréer à l'identique le même environnement sur une autre machine (installation « rejouable »).</p>
<div class="warn">Le mot de passe de la base vit dans une <strong>variable d'environnement</strong> dès le premier jour. <strong>Git</strong> (l'outil qui enregistre l'historique du code) n'oublie rien : un secret <em>commité</em> (enregistré dans l'historique) y reste pour toujours, même effacé ensuite.</div>
<div class="tip">Fais ton premier <strong>commit</strong> (un instantané sauvegardé du code) maintenant : projet vierge + connexion qui marche. Chaque leçon de ce capstone se terminera par un commit — c'est l'histoire du projet qui s'écrit.</div>`,
  exercises: [
    { type: "qcm", q: "Créer le projet Django :", opts: ["django-admin startproject ludotheque .", "pip install projet", "python new django", "npm create django"], a: 0, exp: "Puis startapp pour l'app." },
    { type: "qcm", q: "L'environnement virtuel sert à…", opts: ["Accélérer Python", "Isoler les dépendances du projet", "Chiffrer la base", "Compiler"], a: 1, exp: "Chaque projet ses versions." },
    { type: "qcm", q: "Le connecteur MySQL de l'ORM :", opts: ["mysqlclient", "sqlite3", "psycopg2", "mongo"], a: 0, exp: "pip install mysqlclient." },
    { type: "qcm", q: "Oublier catalogue dans INSTALLED_APPS →", opts: ["Rien", "Ses modèles n'auront pas de migrations", "MySQL plante", "Le CSS casse"], a: 1, exp: "L'app doit être enregistrée." },
    { type: "qcm", q: "ENGINE pour MySQL :", opts: ["django.db.backends.mysql", "django.mysql", "mysql://", "backends.sql"], a: 0, exp: "Le backend de l'ORM." },
    { type: "qcm", q: "Le mot de passe de la base vient…", opts: ["En clair dans settings.py", "De os.environ (variable d'environnement)", "Du template", "De Git"], a: 1, exp: "Secret hors du code." },
    { type: "vf", q: "L'application se connecte à MySQL en root.", a: false, exp: "Un utilisateur dédié aux droits limités (cours MySQL)." },
    { type: "qcm", q: "La base ludotheque et l'utilisateur ludo_app ont été créés…", opts: ["Par Django", "Au cours MySQL (CREATE DATABASE, CREATE USER, GRANT)", "Automatiquement", "Par le navigateur"], a: 1, exp: "Les briques convergent." },
    { type: "qcm", q: "python manage.py check sert à…", opts: ["Vérifier la configuration du projet", "Lancer les tests", "Déployer", "Créer un modèle"], a: 0, exp: "Diagnostic rapide." },
    { type: "qcm", q: "Le premier migrate crée…", opts: ["Nos tables métier", "Les tables intégrées (auth, sessions…)", "Rien", "La base elle-même"], a: 1, exp: "Elles serviront aux leçons 9-11." },
    { type: "qcm", q: "os.environ.get(\"DB_HOST\", \"localhost\") signifie…", opts: ["Toujours localhost", "La variable si présente, sinon localhost", "Une erreur", "Un mot de passe"], a: 1, exp: "Valeur par défaut." },
    { type: "qcm", q: "requirements.txt sert à…", opts: ["Documenter le CSS", "Figer les versions pour une installation rejouable", "Lister les tables", "Compiler"], a: 1, exp: "pip install -r requirements.txt ailleurs." },
    { type: "vf", q: "Un secret retiré de Git au commit suivant est en sécurité.", a: false, exp: "L'historique le garde pour toujours." },
    { type: "qcm", q: "djangorestframework est installé pour…", opts: ["Le CSS", "L'API JSON de la leçon 7", "Les migrations", "MySQL"], a: 1, exp: "DRF, plus tard." },
    { type: "vf", q: "On committe le projet dès que la connexion fonctionne.", a: true, exp: "Chaque étape = un commit." }
  ],
  final: {
    title: "Exercice final — Le projet branché",
    intro: `<p>On vérifie la mise en place complète.</p>`,
    questions: [
      { type: "qcm", q: "L'ordre de création :", opts: ["venv → install → startproject → startapp", "startapp → venv", "MySQL d'abord, pas de venv", "npm install"], a: 0, exp: "Isolation puis projet." },
      { type: "qcm", q: "Dans DATABASES, NAME vaut :", opts: ["ludotheque", "root", "django", "test"], a: 0, exp: "La base du cours MySQL." },
      { type: "qcm", q: "PASSWORD vaut :", opts: ["os.environ[\"DB_PASSWORD\"]", "\"motdepasse123\"", "\"\"", "le nom de la base"], a: 0, exp: "Jamais en clair." },
      { type: "qcm", q: "Vérifier que tout va bien :", opts: ["manage.py check puis migrate", "supprimer la base", "redémarrer le PC", "rien"], a: 0, exp: "Diagnostic puis tables intégrées." },
      { type: "vf", q: "catalogue et rest_framework figurent dans INSTALLED_APPS.", a: true, exp: "Sinon invisibles pour Django." }
    ],
    solution: `<pre class="pseudo">python -m venv .venv && source .venv/bin/activate    # crée et active l'environnement isolé
pip install django mysqlclient djangorestframework   # installe les dépendances du projet
django-admin startproject ludotheque .               # crée le projet Django
python manage.py startapp catalogue                  # crée l'app catalogue

# settings.py : INSTALLED_APPS += ["rest_framework", "catalogue"]      (enregistrer les deux apps)
# DATABASES : ENGINE mysql, NAME ludotheque, PASSWORD via os.environ   (brancher MySQL sans secret en dur)

python manage.py check     # ✅ la configuration est valide
python manage.py migrate   # crée les tables intégrées (auth/sessions)
git init && git add . && git commit -m "Projet Ludothèque : Django + MySQL"   # premier commit du projet</pre>
<p>Le projet vit et parle à MySQL. Demain : traduire le MCD Merise en migrations.</p>`
  }
};
