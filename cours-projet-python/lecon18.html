<script>
var DAY = {
  num: 18,
  title: "Tests d'intégration (Client de test)",
  subtitle: "Vérifier l'assemblage réel : de la requête HTTP jusqu'à MySQL.",
  theory: `
<h3>1. Unitaire vs intégration</h3>
<p>Le test unitaire isole une seule brique (leçon 17). Le test d'<strong>intégration</strong> vérifie au contraire que les briques <strong>fonctionnent ensemble</strong> : il parcourt la <strong>chaîne complète</strong> — URL → middleware → vue → service → ORM → base — au moyen de vraies requêtes HTTP <em>simulées</em> (jouées en mémoire, sans démarrer de serveur ni de navigateur).</p>

<h3>2. self.client : le navigateur de test</h3>
<pre class="pseudo">class VuesTests(TestCase):                   # groupe de tests des vues (tests d'intégration)
    def test_catalogue_public(self):         # test : le catalogue est accessible sans connexion
        reponse = self.client.get("/catalogue/")   # simule un GET sur /catalogue/
        self.assertEqual(reponse.status_code, 200)   # la page doit répondre 200 (OK)
        self.assertContains(reponse, "Catan")      # et contenir le texte « Catan » (le jeu s'affiche)

    def test_api_catalogue_json(self):       # test : l'API renvoie bien du JSON
        reponse = self.client.get("/api/jeux/")   # simule un GET sur l'API
        self.assertEqual(reponse.status_code, 200)   # doit répondre 200
        self.assertEqual(reponse["Content-Type"], "application/json")   # et annoncer du JSON</pre>
<p><code>self.client</code> est un « navigateur de test » : il envoie des requêtes qui traversent le vrai routage, les vrais décorateurs et la vraie vue, sans lancer de serveur. Le <code>status_code</code> est le code HTTP renvoyé (200 = OK, 302 = redirection…). <code>assertEqual</code> vérifie une égalité, <code>assertContains</code> qu'un texte figure dans la page : dès qu'une <strong>assertion</strong> (une vérification) est fausse, le test échoue.</p>

<h3>3. Tester la sécurité</h3>
<pre class="pseudo">def test_louer_exige_connexion(self):        # test : louer sans être connecté est refusé
    reponse = self.client.post(f"/louer/{self.jeu.id}/")   # POST sur /louer/… sans connexion
    self.assertEqual(reponse.status_code, 302)          # 302 = redirection (vers la connexion)
    self.assertIn("/connexion/", reponse["Location"])   # l'adresse de redirection contient /connexion/

def test_gestion_refusee_au_client(self):    # test : un simple client ne peut pas ouvrir /gestion/
    self.client.login(username="c@ludo.fr", password="Mdp8carac!")   # on connecte un client
    reponse = self.client.get("/gestion/")   # il tente d'accéder à l'espace admin
    self.assertEqual(reponse.status_code, 302)          # refusé : il est redirigé (pas admin)</pre>

<h3>4. Tester l'effet réel d'une location</h3>
<pre class="pseudo">def test_louer_decremente_le_stock(self):    # test : une location baisse bien le stock
    self.client.login(username="c@ludo.fr", password="Mdp8carac!")   # on connecte le client
    reponse = self.client.post(f"/louer/{self.jeu.id}/")   # il loue le jeu (POST)
    self.assertEqual(reponse.status_code, 302)          # 302 = Post-Redirect-Get après l'écriture
    self.jeu.refresh_from_db()                          # on relit le jeu depuis la base
    self.assertEqual(self.jeu.stock_location, 2)        # le stock est passé de 3 à 2
    self.assertEqual(Location.objects.de_client(self.client_u).count(), 1)   # une location a bien été créée</pre>
<p>On vérifie <strong>l'état de la base</strong> après l'appel HTTP : les deux écritures de la transaction ont bien eu lieu.</p>

<h3>5. La pyramide des tests</h3>
<pre class="pseudo">        /  intégration  \     moins nombreux, plus lents, réalistes
       /    unitaires     \    nombreux, rapides, précis</pre>
<div class="warn">Le client de test gère le CSRF pour toi et <code>login()</code> ouvre une vraie session — mais les données de chaque test restent isolées (transaction annulée). Un test qui dépend d'un autre test est un test cassé.</div>
<div class="tip">Ces tests verrouillent les décorateurs : si quelqu'un retire <code>@login_required</code> de la location, <code>test_louer_exige_connexion</code> devient rouge immédiatement.</div>`,
  exercises: [
    { type: "qcm", q: "Un test d'intégration vérifie…", opts: ["Une fonction isolée", "La chaîne complète (HTTP → base)", "Une méthode privée", "Les fichiers de migration"], a: 1, exp: "L'assemblage réel." },
    { type: "qcm", q: "L'outil pour simuler les requêtes :", opts: ["self.client (client de test Django)", "curl obligatoire", "le navigateur", "Postman"], a: 0, exp: "Sans serveur à lancer." },
    { type: "qcm", q: "self.client.get(\"/catalogue/\") traverse…", opts: ["Seulement la vue", "Routage, middlewares, décorateurs, vue, service, base", "Rien", "Seulement le template"], a: 1, exp: "Le vrai pipeline." },
    { type: "qcm", q: "assertContains(reponse, \"Catan\") vérifie…", opts: ["Le code 200 ET la présence du texte dans la page", "le JSON", "la base", "les en-têtes HTTP"], a: 0, exp: "Le rendu réel." },
    { type: "qcm", q: "POST /louer/ sans connexion →", opts: ["200", "302 vers la connexion", "500", "201"], a: 1, exp: "@login_required redirige." },
    { type: "qcm", q: "Se connecter dans un test :", opts: ["self.client.login(username=..., password=...)", "un cookie manuel", "un JWT", "impossible"], a: 0, exp: "Vraie session de test." },
    { type: "qcm", q: "Un client (non admin) sur /gestion/ :", opts: ["Accède", "Est refusé (redirection)", "500", "Devient admin"], a: 1, exp: "user_passes_test le renvoie." },
    { type: "qcm", q: "Vérifier que la location a décrémenté le stock :", opts: ["refresh_from_db puis assertEqual(stock, 2)", "croire la vue", "un print", "un sleep"], a: 0, exp: "L'état réel de la base." },
    { type: "qcm", q: "Le 302 après le POST réussi confirme…", opts: ["Une erreur", "Le motif Post-Redirect-Get", "Un timeout", "Le cache"], a: 1, exp: "Leçon 12." },
    { type: "vf", q: "Le client de test exige de gérer le CSRF à la main.", a: false, exp: "Il le gère pour toi." },
    { type: "qcm", q: "La pyramide des tests recommande…", opts: ["Que de l'intégration", "Beaucoup d'unitaires, moins d'intégration", "Aucun test", "Que du manuel"], a: 1, exp: "Vitesse + réalisme." },
    { type: "qcm", q: "Les tests d'intégration sont plus lents car…", opts: ["Python est lent", "Ils traversent toutes les couches et la base", "TestCase est lent", "Ils sont mal écrits"], a: 1, exp: "Le prix du réalisme." },
    { type: "vf", q: "Un test peut compter sur les données créées par le test précédent.", a: false, exp: "Chaque test est isolé — et doit l'être." },
    { type: "qcm", q: "Si quelqu'un retire @login_required de louer…", opts: ["Rien", "test_louer_exige_connexion devient rouge", "MySQL plante", "Le test du stock devient rouge"], a: 1, exp: "La sécurité est testée." },
    { type: "vf", q: "Ces tests remplacent les tests unitaires.", a: false, exp: "Complémentaires : règles vs assemblage." }
  ],
  final: {
    title: "Exercice final — L'application testée de bout en bout",
    intro: `<p>On vérifie le catalogue, la sécurité et l'effet d'une location.</p>`,
    questions: [
      { type: "qcm", q: "Le catalogue public doit renvoyer :", opts: ["200", "302", "403", "404"], a: 0, exp: "Lecture ouverte." },
      { type: "qcm", q: "L'API doit renvoyer :", opts: ["Content-Type application/json", "du HTML", "un PDF", "rien"], a: 0, exp: "Contrat de l'API." },
      { type: "qcm", q: "Louer sans connexion :", opts: ["302 vers /connexion/", "200", "201", "500"], a: 0, exp: "Protégé." },
      { type: "qcm", q: "Après une location connectée, on vérifie :", opts: ["Le stock en base ET la ligne Location créée", "juste le code HTTP", "le message affiché", "rien"], a: 0, exp: "Les deux écritures." },
      { type: "vf", q: "Ce test échouerait si la transaction n'écrivait que la moitié.", a: true, exp: "L'atomicité est observable." }
    ],
    solution: `<pre class="pseudo">def test_louer_decremente_le_stock(self):    # une location baisse le stock
    self.client.login(username="c@ludo.fr", password="Mdp8carac!")   # connecte le client
    reponse = self.client.post(f"/louer/{self.jeu.id}/")   # loue le jeu (POST)
    self.assertEqual(reponse.status_code, 302)   # redirection après écriture
    self.jeu.refresh_from_db()                   # relit le jeu
    self.assertEqual(self.jeu.stock_location, 2)   # 3 - 1 = 2
    self.assertEqual(Location.objects.de_client(self.client_u).count(), 1)   # une location créée

def test_louer_exige_connexion(self):        # louer exige d'être connecté
    reponse = self.client.post(f"/louer/{self.jeu.id}/")   # POST sans connexion
    self.assertIn("/connexion/", reponse["Location"])   # redirigé vers la connexion</pre>
<p>L'assemblage est prouvé. Demain : les derniers réflexes de qualité avant la mise en ligne.</p>`
  }
};

var ECRITURE = {

  items: [
  { id: "projpython-l18", title: "Le stock épuisé de bout en bout", level: 3,
    statement: "Écris test_louer_stock_epuise_affiche_l_erreur : un jeu à stock_location=0, un client connecté qui POST sur /louer/<id>/ ; vérifie le 302 (on redirige toujours), suis la redirection (follow=True) et vérifie que la page affiche le message d'erreur « Plus de stock », que le stock est resté à 0 et qu'aucune Location n'a été créée.",
    hints: [
      "reponse = self.client.post(f\"/louer/{jeu.id}/\", follow=True)",

      "self.assertEqual(Location.objects.count(), 0) et jeu.refresh_from_db()."
    ],
    solution: "def test_louer_stock_epuise_affiche_l_erreur(self):   # test : louer un jeu épuisé affiche l'erreur\n    jeu = Jeu.objects.create(   # crée un jeu…\n        titre=\"Root\", prix_achat=50, prix_location=6,   # …titre et prix…\n        stock_location=0, categorie=self.cat)   # …avec 0 en stock de location\n    self.client.login(username=\"c@ludo.fr\", password=\"Mdp8carac!\")   # connecte un client\n\n    reponse = self.client.post(f\"/louer/{jeu.id}/\", follow=True)   # loue (follow=True suit la redirection)\n\n    self.assertEqual(reponse.status_code, 200)      # page après redirection\n    self.assertContains(reponse, \"Plus de stock\")   # le message métier s'affiche\n\n    jeu.refresh_from_db()   # on relit le jeu\n    self.assertEqual(jeu.stock_location, 0)          # rien n'a bougé\n    self.assertEqual(Location.objects.count(), 0)    # aucune location fantôme",
    note: "follow=True suit la redirection Post-Redirect-Get et rend la page finale : on teste ce que l'UTILISATEUR voit (le message posé par messages.error) ET ce que la BASE contient (rien). Ce seul test traverse la vue, le service, l'exception StockInsuffisant, le rollback et le framework messages — cinq leçons vérifiées en dix lignes." }
  ]
};
