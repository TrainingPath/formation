<script>
var DAY = {
  num: 1,
  title: "Du cahier des charges à l'architecture MVT",
  subtitle: "Avant d'écrire une ligne, on décide comment l'application est organisée.",
  theory: `
<h3>1. Le cahier des charges de la Ludothèque</h3>
<p>Une <strong>application</strong> (ou « appli ») est un programme informatique qui rend un service à des utilisateurs ; la nôtre sera un site web. Le <strong>cahier des charges</strong> est le document qui décrit précisément ce que l'application doit faire, un peu comme le plan d'un architecte avant de bâtir une maison. Le nôtre : une <strong>ludothèque</strong> (une bibliothèque de jeux) où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux de société, avec trois profils d'utilisateurs — <strong>client</strong>, <strong>vendeur</strong>, <strong>administrateur</strong>. Chaque jeu possède <strong>deux stocks</strong> distincts : un pour la vente, un pour la location. Jusqu'ici, chaque cours de la formation en a construit un morceau ; ce projet final (un <em>capstone</em>, la « pierre de couronnement » qui achève un édifice) assemble le tout.</p>

<h3>2. MVT + services : qui fait quoi</h3>
<pre class="pseudo">Flux d'une requête :
URL (urls.py) &rarr; Vue (views.py) &rarr; Service (services.py)
             &rarr; Modèle (models.py, ORM) &rarr; MySQL
puis la vue rend un Template (DTL) ou du JSON</pre>
<p>Un <strong>framework</strong> est une « boîte à outils » toute prête qui fournit le squelette d'une application pour éviter de tout réécrire soi-même, comme un kit de meuble livré avec ses gabarits. <strong>Django</strong> est le framework web que nous utilisons ; il est écrit dans le langage <strong>Python</strong>. Il organise le code selon le patron <strong>MVT</strong> (<em>Model-View-Template</em>, soit Modèle-Vue-Gabarit). Une <strong>requête</strong> est une demande envoyée par le navigateur (le logiciel qui affiche les pages web) au <strong>serveur</strong> (l'ordinateur qui héberge le site) : « montre-moi cette page ». Le schéma ci-dessus se lit ainsi : l'<strong>URL</strong> (l'adresse tapée, comme <code>/louer/12/</code>) est aiguillée vers une <strong>Vue</strong>, qui appelle un <strong>Service</strong>, qui interroge le <strong>Modèle</strong>, lequel parle à la base <strong>MySQL</strong> ; puis la vue renvoie une page HTML (le <strong>Template</strong>) ou des données brutes. Nous ajoutons à ce trio une couche <strong>services</strong> : les vues reçoivent et répondent, mais ne <em>décident</em> jamais — les règles <strong>métier</strong> (la logique propre à l'activité : gérer les stocks, calculer les tarifs, refuser une opération impossible) vivent dans le fichier <code>services.py</code>.</p>

<h3>3. L'arborescence du projet</h3>
<pre class="pseudo">ludotheque/            le projet (settings.py, urls.py)
catalogue/             l'app principale
├── models.py          les modèles ORM (Jeu, Categorie…)
├── views.py           les vues (HTTP entrant/sortant)
├── services.py        la logique métier ← notre ajout
├── forms.py           formulaires et validation
├── migrations/        le schéma versionné
templates/             les vues HTML (DTL)</pre>
<p>Une <strong>arborescence</strong> est la carte des dossiers et fichiers du projet, organisés en branches comme un arbre généalogique. Un <strong>fichier</strong> est un document qui contient du code ; un <strong>dossier</strong> (les noms suivis d'un <code>/</code>) regroupe plusieurs fichiers. <code>settings.py</code> est le fichier de <strong>réglages</strong> (la configuration : quelle base de données, quels mots de passe…). <code>urls.py</code> est le « standard téléphonique » qui associe chaque adresse à la bonne vue. Le dossier <code>migrations/</code> conserve l'<strong>historique du schéma</strong> de la base de données (on y revient plus loin). L'idée clé : chaque fichier a un rôle unique et bien délimité.</p>

<h3>4. Pourquoi une couche service ?</h3>
<p>Trois raisons. D'abord, la règle « stock nul &rarr; refus » doit exister <strong>une seule fois</strong>, au même endroit, plutôt que recopiée dans chaque vue (sinon, corriger un oubli obligerait à la modifier partout à la fois). Ensuite, le métier devient <strong>testable</strong> : on peut vérifier automatiquement qu'il fonctionne sans passer par le web, c'est-à-dire sans <strong>HTTP</strong> (le langage par lequel le navigateur et le serveur dialoguent). Enfin, l'<strong>API</strong> (une porte d'entrée qui permet à d'autres programmes de dialoguer avec le nôtre) qui renvoie du <strong>JSON</strong> (un format de texte structuré que les programmes s'échangent facilement) et les pages HTML <strong>réutilisent</strong> exactement le même code.</p>

<h3>5. D'où viennent les briques ?</h3>
<p>Le schéma des données vient du cours <strong>Merise</strong> (une méthode de conception de bases de données ; son <strong>MCD</strong>, ou Modèle Conceptuel de Données, est le plan des informations à stocker). Le <strong>SQL</strong> (le langage standard pour interroger une base de données) vient du cours <strong>MySQL</strong> (le logiciel qui stocke et gère nos données — ce qu'on appelle une « base de données »). Le langage vient du cours <strong>Python</strong>, le framework du cours <strong>Django</strong>. Rien de neuf n'est inventé ici : tout ce que tu as appris converge.</p>
<div class="warn">Une vue qui contient un calcul de tarif ou un contrôle de stock est un <strong>défaut d'architecture</strong> (l'<em>architecture</em>, c'est la manière de répartir le code en morceaux aux rôles bien séparés) : le jour où l'API et la page web calculent différemment, la base ment à quelqu'un.</div>
<div class="tip">Dessine ce flux (URL → vue → service → modèle → MySQL) et garde-le sous les yeux : chacune des 20 prochaines leçons en remplit une case.</div>`,
  exercises: [
    { type: "qcm", q: "MVT signifie…", opts: ["Model-View-Template", "Most-Valuable-Table", "Model-Validation-Transaction", "Middleware-View-Test"], a: 0, exp: "L'architecture de Django." },
    { type: "qcm", q: "La Ludothèque propose…", opts: ["Seulement l'achat", "L'achat ET la location de jeux", "Seulement la location", "Le prêt gratuit de jeux"], a: 1, exp: "Les deux opérations, deux stocks." },
    { type: "qcm", q: "Les trois profils sont…", opts: ["Client, Vendeur, Administrateur", "Dev, test, prod", "Lecteur, auteur, éditeur", "Root, invité, anonyme"], a: 0, exp: "Définis dès le MCD Merise." },
    { type: "qcm", q: "L'ordre du flux d'une requête :", opts: ["URL → vue → service → modèle → MySQL", "Modèle → URL → vue", "Service → URL → template", "MySQL → vue → URL"], a: 0, exp: "Chaque couche appelle la suivante." },
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["views.py", "services.py", "urls.py", "les templates"], a: 1, exp: "Notre couche ajoutée." },
    { type: "qcm", q: "Le rôle d'une vue :", opts: ["Décider des règles", "Recevoir la requête et répondre, en déléguant", "Écrire du SQL", "Créer les tables"], a: 1, exp: "Traduction HTTP, pas décision." },
    { type: "qcm", q: "Le schéma de la base vient…", opts: ["Du fichier settings.py", "Du MCD Merise conçu en début de formation", "Du frontend", "De l'admin Django"], a: 1, exp: "La conception précède le code." },
    { type: "vf", q: "Chaque jeu a deux stocks distincts : vente et location.", a: true, exp: "Une décision du modèle, structurante." },
    { type: "qcm", q: "models.py contient…", opts: ["Les modèles ORM reliés aux tables MySQL", "La configuration du projet", "Les routes", "Les tests"], a: 0, exp: "La couche données." },
    { type: "qcm", q: "Pourquoi une couche service ? (raison fausse)", opts: ["Règle écrite une seule fois", "Métier testable sans HTTP", "API et pages partagent le code", "Ça fait plus de fichiers, donc c'est mieux"], a: 3, exp: "Le nombre de fichiers n'est pas un but." },
    { type: "vf", q: "Un contrôle de stock dans une vue est un bon réflexe.", a: false, exp: "Défaut d'architecture : il appartient au service." },
    { type: "qcm", q: "Le dossier migrations/ contient…", opts: ["Les sauvegardes", "L'histoire versionnée du schéma", "Les logs", "Les données des tables"], a: 1, exp: "Rejouable partout." },
    { type: "qcm", q: "Les templates DTL servent à…", opts: ["Rendre le HTML", "Stocker les données", "Router", "Tester"], a: 0, exp: "La couche présentation." },
    { type: "qcm", q: "L'API JSON et les pages HTML utiliseront…", opts: ["Deux logiques métier différentes", "Le même service", "Deux bases", "Deux langages"], a: 1, exp: "Une logique, deux présentations." },
    { type: "vf", q: "Ce capstone réutilise Merise, MySQL, Python et Django, sans réapprendre chaque brique.", a: true, exp: "Le but : les faire travailler ensemble." }
  ],
  final: {
    title: "Exercice final — L'architecture sur le papier",
    intro: `<p>On vérifie que la carte du projet est claire avant de coder.</p>`,
    questions: [
      { type: "qcm", q: "Une requête « louer le jeu 12 » traverse :", opts: ["URL → vue → service → modèle → MySQL", "MySQL → modèle → vue", "template → service", "URL → modèle direct"], a: 0, exp: "Le flux complet." },
      { type: "qcm", q: "Le contrôle « stock nul → refus » vit dans :", opts: ["services.py", "views.py", "le template", "urls.py"], a: 0, exp: "Règle métier." },
      { type: "qcm", q: "Le schéma des tables descend :", opts: ["Du MCD Merise via les migrations", "Des requêtes SQL écrites à la main", "Du code des templates", "Des vues"], a: 0, exp: "Conception → code." },
      { type: "qcm", q: "La vue « louer » fait :", opts: ["Le moins possible : identifier, déléguer, répondre", "Le calcul du tarif", "Le SQL", "La création de table"], a: 0, exp: "Traduction HTTP." },
      { type: "vf", q: "L'API et les pages web partageront la même couche service.", a: true, exp: "C'est tout l'intérêt." }
    ],
    solution: `<pre class="pseudo">URL /louer/12/ (urls.py)
  → vue louer (views.py)        : identifie l'utilisateur, délègue
  → services.louer (services.py): vérifie le stock, décide
  → modèle Location (models.py) : ORM
  → MySQL                       : INSERT + UPDATE (transaction)
  → la vue répond (redirection ou JSON)</pre>
<p>La carte est posée. Demain : créer le vrai projet et le brancher sur MySQL.</p>`
  }
};
</script>
