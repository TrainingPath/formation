<h3>1. Les règles de la Ludothèque</h3>
<p>Relisons le cahier des charges : <strong>deux stocks étanches</strong> (vente / location), refus si le stock est nul, location standard de <strong>7 jours</strong> avec prolongation à <strong>0,50 €/jour</strong>. Ces décisions n'appartiennent ni aux vues ni aux templates : elles vivent dans <code>services.py</code>.</p>

<h3>2. L'exception métier</h3>
<pre class="pseudo"># catalogue/services.py                                       # ce code vit dans le fichier services.py de l'app catalogue
class StockInsuffisant(Exception):                            # on crée notre propre type d'erreur (une « exception »)
    """Levée quand une opération demande plus que le stock disponible."""   # texte d'aide décrivant l'erreur</pre>
<p>Une <strong>exception</strong> est un signal d'erreur qu'une fonction « lève » (<em>raise</em>) pour interrompre le cours normal et prévenir l'appelant qu'un problème l'empêche de continuer — comme tirer la sonnette d'alarme. En lui donnant un <strong>nom</strong> métier (<code>StockInsuffisant</code>) plutôt qu'une erreur générique, le service dit <em>précisément</em> ce qui ne va pas ; la couche web traduira ensuite ce signal en réponse <strong>HTTP</strong> (le protocole par lequel navigateur et serveur dialoguent) appropriée (leçon 8).</p>

<h3>3. Les fonctions du service</h3>
<pre class="pseudo">from decimal import Decimal                    # Decimal = type nombre décimal EXACT (pour l'argent)

def jeux_louables():                           # fonction : renvoie les jeux qu'on peut louer
    return Jeu.objects.louables().order_by("titre")   # réutilise le QuerySet louables(), trié par titre

def verifier_stock_location(jeu):              # fonction : contrôle qu'il reste du stock de location
    if jeu.stock_location &lt;= 0:                # si le stock de location est à 0 (ou moins)…
        raise StockInsuffisant(f"Plus de stock de location pour {jeu.titre}")   # …lève l'exception métier

def prix_location(jeu, nb_jours=7):            # fonction : calcule le prix ; 7 jours par défaut
    base = jeu.prix_location                   # le tarif de base du jeu
    if nb_jours &lt;= 7:                          # jusqu'à 7 jours inclus…
        return base                            # …on renvoie le tarif de base, sans supplément
    return base + (nb_jours - 7) * Decimal("0.50")   # au-delà : +0,50 € par jour supplémentaire</pre>
<p>Une <strong>fonction</strong> est un bloc de code nommé qui reçoit des <strong>paramètres</strong> (les valeurs entre parenthèses, comme <code>jeu</code> et <code>nb_jours</code>) et renvoie un résultat avec <code>return</code>. <code>nb_jours=7</code> donne une valeur <strong>par défaut</strong> : si l'appelant ne précise rien, ce sera 7. Tout ceci est du <strong>Python pur</strong> : aucune <code>request</code> (l'objet qui représente la requête web), aucun template. C'est justement ce qui rend le métier testable en millisecondes (leçon 17) et réutilisable à l'identique par l'API et par les pages.</p>

<h3>4. Decimal, encore et toujours</h3>
<pre class="pseudo">0.1 + 0.2 == 0.3                      # False ! (flottants)
Decimal("0.1") + Decimal("0.2")       # Decimal('0.3') ✓</pre>
<p>Le tarif utilise <code>Decimal("0.50")</code> — la chaîne, pas le flottant : l'argent ne s'arrondit pas au hasard.</p>

<h3>5. La vue déléguera</h3>
<pre class="pseudo">def louer(request, jeu_id):          # aperçu de la leçon 12 : la vue « louer »
    jeu = get_object_or_404(Jeu, pk=jeu_id)   # charge le jeu, ou renvoie une page 404 s'il n'existe pas
    services.verifier_stock_location(jeu)   # la DÉCISION est déléguée au service
    ...                              # ... = la suite (créer la location) viendra plus tard</pre>
<div class="warn">Si demain le tarif passe à 0,60 €/jour, on modifie <strong>une ligne</strong> de <code>services.py</code> — pas trois vues, deux templates et l'API. C'est le test décisif d'une bonne architecture.</div>
<div class="tip">Le service dépend des modèles, jamais l'inverse. Sens unique : vues → services → modèles. Un modèle qui importerait <code>services</code> créerait un cycle — signal d'alarme immédiat.</div>`,

    ],
    solution: `<pre class="pseudo">from decimal import Decimal                    # type décimal exact (pour l'argent)

class StockInsuffisant(Exception):             # exception métier « il n'y a plus de stock »
    pass                                       # pass = corps vide ; le nom suffit

def jeux_louables():                           # les jeux louables, triés par titre
    return Jeu.objects.louables().order_by("titre")

def verifier_stock_location(jeu):              # contrôle du stock de location
    if jeu.stock_location &lt;= 0:                # plus de stock disponible ?
        raise StockInsuffisant(f"Plus de stock de location pour {jeu.titre}")   # on refuse en levant l'exception

def prix_location(jeu, nb_jours=7):            # calcul du tarif (7 jours par défaut)
    base = jeu.prix_location                   # tarif de base

    return base + (nb_jours - 7) * Decimal("0.50")   # sinon +0,50 € par jour au-delà de 7</pre>
<p>Les décisions ont leur maison. Demain : ouvrir le catalogue au monde avec l'API REST.</p>`
