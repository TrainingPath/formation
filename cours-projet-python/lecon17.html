<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test</strong> est un petit programme qui appelle ton code avec des valeurs connues et vérifie que le résultat est bien celui attendu. Un test <strong>unitaire</strong> se concentre sur une seule fonction, isolée. Automatisé, il se relance à chaque modification : il documente les règles et attrape les <strong>régressions</strong> (un ancien comportement cassé par un nouveau changement) <em>avant</em> les utilisateurs. <code>python manage.py test</code> exécute toute la suite d'un coup.</p>

<h3>2. TestCase : une base de test isolée</h3>
<pre class="pseudo">from django.test import TestCase            # TestCase = classe de base pour écrire des tests Django

class ServicesTests(TestCase):              # un groupe de tests (les tests des services)
    def setUp(self):                        # setUp : exécuté AVANT chaque test, prépare des données communes
        self.cat = Categorie.objects.create(nom="Stratégie")   # crée une catégorie de test
        self.client_u = User.objects.create_user(   # crée un utilisateur de test…
            "c@ludo.fr", "c@ludo.fr", "Mdp8carac!")   # …(username, email, mot de passe)</pre>
<p>Django crée une <strong>base de test</strong> dédiée, séparée de la vraie (jamais tes vraies données !), puis enveloppe <strong>chaque test dans une transaction annulée</strong> à la fin. Résultat : chaque test repart d'une base propre et ne voit pas ce qu'un autre a écrit — on dit qu'ils sont <strong>isolés</strong>.</p>

<h3>3. Tester les règles de la Ludothèque</h3>
<pre class="pseudo">def test_location_stock_nul_refusee(self):   # test : louer un jeu sans stock doit être refusé
    jeu = Jeu.objects.create(titre="Catan", prix_achat=30, prix_location=5,   # crée un jeu…
                             stock_location=0, categorie=self.cat)   # …avec 0 en stock de location
    with self.assertRaises(StockInsuffisant):   # on s'attend à ce que l'exception soit levée…
        services.louer(self.client_u, jeu.id)   # …en tentant de louer (sinon le test échoue)

def test_achat_fige_le_prix(self):           # test : le montant d'un achat ne bouge plus après coup
    jeu = Jeu.objects.create(titre="Dixit", prix_achat=Decimal("29.99"),   # crée un jeu à 29,99 €…
                             prix_location=4, stock_vente=3, categorie=self.cat)   # …avec 3 en stock de vente
    achat = services.acheter(self.client_u, jeu.id)   # on achète (montant figé à 29,99)
    jeu.prix_achat = Decimal("39.99"); jeu.save()   # le vendeur change le prix (39,99)
    achat.refresh_from_db()                  # on relit l'achat depuis la base
    self.assertEqual(achat.montant, Decimal("29.99"))  # le montant doit valoir 29,99 (figé ✓)

def test_prolongation_tarifee(self):         # test : le tarif de prolongation
    jeu = Jeu(prix_location=Decimal("5.00"))   # un jeu à 5 € (pas besoin de l'enregistrer)
    self.assertEqual(services.prix_location(jeu, 10),   # prix pour 10 jours…
                     Decimal("6.50"))               # …doit valoir 5 + 3 × 0,50 = 6,50</pre>

<h3>4. Mocker une dépendance externe</h3>
<pre class="pseudo">from unittest.mock import patch             # patch = remplacer temporairement une fonction (un « mock »)

@patch("catalogue.services.envoyer_email")     # remplace envoyer_email : pas de vrai email en test
def test_location_envoie_confirmation(self, mock_email):   # le mock est reçu en argument
    services.louer(self.client_u, self.jeu.id)   # on loue…
    mock_email.assert_called_once()          # …et on vérifie que l'email a été demandé une seule fois</pre>
<p>Un <strong>mock</strong> (« objet factice ») est un remplaçant qui imite une fonction sans faire son vrai travail, tout en notant comment on l'a appelée. <code>patch</code> installe ce faux le temps du test : on évite ainsi un <strong>effet de bord</strong> (une conséquence extérieure, comme envoyer un vrai email ou appeler un service payant) et le test reste rapide. C'est l'équivalent de Moq en C#.</p>
<div class="warn">Un bon test est <strong>rapide</strong>, <strong>isolé</strong> et <strong>déterministe</strong> (même résultat à chaque exécution). Un test qui passe « parfois » est pire que pas de test : on apprend à l'ignorer.</div>
<div class="tip">On teste en priorité les <strong>règles métier</strong> : stock nul refusé, prix figé, double-rendu interdit, tarif de prolongation. C'est là que les bugs coûtent cher — et services.py, en Python pur, se teste en millisecondes.</div>`,

    { type: "qcm", q: "@patch(\"catalogue.services.envoyer_email\") :", opts: ["Envoie un vrai email", "Remplace la fonction par un mock le temps du test", "Supprime la fonction", "La teste"], a: 1, exp: "Pas d'effet de bord." },

    { type: "qcm", q: "L'équivalent C# de patch/mock vu dans l'autre capstone :", opts: ["Moq", "xUnit", "LINQ", "Kestrel"], a: 0, exp: "Mêmes idées, autre langage." },

    { type: "qcm", q: "On teste en priorité…", opts: ["Les getters", "Les règles métier (stock, prix figé, double-rendu)", "Le CSS", "Les imports"], a: 1, exp: "Là où les bugs coûtent." },
    { type: "vf", q: "services.py en Python pur se teste vite car il ne dépend ni de HTTP ni des templates.", a: true, exp: "L'architecture de la leçon 1 paie." }
  ],

    ],
    solution: `<pre class="pseudo">class ServicesTests(TestCase):              # groupe de tests des services
    def setUp(self):                        # préparation avant chaque test

        self.client_u = User.objects.create_user("c@ludo.fr", "c@ludo.fr", "Mdp8carac!")   # utilisateur de test

    def test_location_stock_nul_refusee(self):   # louer sans stock = refus
        jeu = Jeu.objects.create(titre="Catan", prix_achat=30, prix_location=5,   # jeu…

        with self.assertRaises(StockInsuffisant):   # on attend l'exception…

        jeu = Jeu.objects.create(titre="Dixit", prix_achat=Decimal("29.99"),   # jeu à 29,99…

<p>Les règles sont verrouillées. Demain : tester l'assemblage complet, en HTTP.</p>`
