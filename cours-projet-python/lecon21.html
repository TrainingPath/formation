<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque assemblée (examen)",
  subtitle: "Tout le projet en une épreuve : de l'architecture au déploiement.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, une application complète. Le langage (Python), le framework (Django) et la base (MySQL) ne sont plus des cours séparés : ils forment un seul logiciel. Récapitulons avant les 20 questions.</p>

<h3>1. Architecture et données</h3>
<p>Une architecture <strong>MVT + services</strong>, un schéma issu de <strong>Merise</strong> et appliqué par des <strong>migrations</strong>, des <strong>modèles</strong> reflétant les tables avec leurs relations (<code>on_delete</code> raisonnés), et des <strong>QuerySets métier</strong> pour interroger sans SQL manuel.</p>

<h3>2. Métier et sécurité</h3>
<p>Les règles vivent dans <strong>services.py</strong> : deux stocks étanches, location et achat dans <code>transaction.atomic</code> + <code>select_for_update</code>, prix figé à l'achat. Les <strong>groupes</strong> portent les trois rôles, la <strong>session</strong> transporte l'identité, <code>@login_required</code> et <code>@user_passes_test</code> appliquent la matrice des droits.</p>

<h3>3. Interface, qualité, production</h3>
<p>Les <strong>templates DTL</strong> rendent le catalogue et les trois espaces ; la recherche est paginée (<code>Paginator</code> → LIMIT/OFFSET). Les <strong>tests</strong> TestCase verrouillent les règles, le <strong>client de test</strong> prouve l'assemblage. Logs structurés, <code>select_related</code> contre le N+1, index par migration, secrets en environnement — puis <code>migrate</code>, <code>collectstatic</code>, gunicorn et tag Git.</p>

<h3>Le trajet d'une location</h3>
<pre class="pseudo">POST /louer/12/  (session, {% csrf_token %})
  → middleware session : request.user identifié
  → @login_required : accès autorisé
  → vue louer : identifie, délègue, répond
  → services.louer : atomic + select_for_update
      stock ? → Location créée + stock_location--
  → COMMIT MySQL — et un log structuré
  → redirect("mes_locations")  (Post-Redirect-Get)</pre>
<div class="tip">Ce trajet traverse TOUTE la formation : HTTP, Python, l'architecture en couches, l'ORM, la transaction MySQL née du modèle Merise. Bonne épreuve !</div>`,
  exercises: [
    { type: "qcm", q: "L'ordre des couches traversées par une requête :", opts: ["URL → vue → service → modèle → MySQL", "Service → URL → base", "Template → base → vue", "Modèle → vue → URL"], a: 0, exp: "L'architecture de la leçon 1." },
    { type: "qcm", q: "Le schéma de la base vient…", opts: ["D'une improvisation", "Du MCD Merise traduit en migrations", "Du frontend", "Du hasard"], a: 1, exp: "Conception → migrations → MySQL." },
    { type: "qcm", q: "Une migration Django est…", opts: ["Un script jetable", "Une étape versionnée du schéma, rejouable partout", "Un backup", "Un test"], a: 1, exp: "dev, test, prod : même histoire." },
    { type: "qcm", q: "Pour l'argent, on utilise…", opts: ["FloatField", "DecimalField", "IntegerField", "CharField"], a: 1, exp: "Les flottants arrondissent faux." },
    { type: "qcm", q: "on_delete=PROTECT sur Jeu.categorie signifie…", opts: ["Suppression en cascade", "Refus de supprimer une catégorie encore utilisée", "FK à NULL", "Rien"], a: 1, exp: "Une décision de conception." },
    { type: "qcm", q: "Jeu.objects.louables() est possible grâce…", opts: ["À un QuerySet personnalisé (as_manager)", "Au CSS", "À l'admin", "Au hasard"], a: 0, exp: "Vocabulaire métier chaînable." },
    { type: "qcm", q: "Les règles métier (stocks, tarifs) vivent dans…", opts: ["Les vues", "services.py", "Les templates", "urls.py"], a: 1, exp: "Testables, réutilisées par API et pages." },
    { type: "qcm", q: "Louer = 2 écritures indissociables grâce à…", opts: ["Un if", "transaction.atomic (rollback sinon)", "Un log", "Un form"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "select_for_update() empêche…", opts: ["Le XSS", "Deux clients d'obtenir le dernier exemplaire", "Les migrations", "Le cache"], a: 1, exp: "Verrou jusqu'au commit." },
    { type: "qcm", q: "Le montant d'un achat…", opts: ["Est relu depuis le jeu à chaque affichage", "Est copié (figé) au moment de l'achat", "Vient du client", "Est nul"], a: 1, exp: "Une facture ne change pas." },
    { type: "qcm", q: "Les mots de passe sont stockés…", opts: ["En clair", "Hachés (create_user / PBKDF2)", "Dans la session", "Dans un cookie"], a: 1, exp: "Irréversible." },
    { type: "qcm", q: "Les trois rôles sont portés par…", opts: ["Une colonne texte", "Les groupes (django.contrib.auth)", "Le CSS", "Un fichier"], a: 1, exp: "Semés par migration de données." },
    { type: "qcm", q: "« Mes locations » filtre par…", opts: ["?client= dans l'URL", "request.user (session)", "Un champ caché", "L'IP"], a: 1, exp: "Jamais confiance à la requête." },
    { type: "qcm", q: "La gestion des comptes est protégée par…", opts: ["Le menu masqué", "@user_passes_test(est_admin) côté serveur", "Un commentaire", "Rien"], a: 1, exp: "La barrière serveur." },
    { type: "qcm", q: "Dans un template, {{ jeu.titre }}…", opts: ["Exécute le HTML", "Affiche en échappant (protection XSS)", "Plante", "Est ignoré"], a: 1, exp: "Échappement par défaut." },
    { type: "qcm", q: "Après un POST réussi :", opts: ["render direct", "redirect (Post-Redirect-Get)", "un throw", "rien"], a: 1, exp: "F5 ne rejoue pas l'action." },
    { type: "qcm", q: "Les tests TestCase s'exécutent…", opts: ["Sur la prod", "Sur une base de test jetable, chaque test isolé", "Sans base", "À la main"], a: 1, exp: "Transaction annulée par test." },
    { type: "qcm", q: "La parade au N+1 pour une FK :", opts: ["Plus de RAM", "select_related → JOIN unique", "un for", "supprimer la relation"], a: 1, exp: "Et assertNumQueries pour verrouiller." },
    { type: "qcm", q: "SECRET_KEY et DB_PASSWORD vivent…", opts: ["Dans settings.py commité", "Dans des variables d'environnement", "Dans le template", "Dans Git"], a: 1, exp: "Hors dépôt, toujours." },
    { type: "qcm", q: "Avant la mise en ligne :", opts: ["On supprime les tests", "test vert, check --deploy, migrate, collectstatic, gunicorn, tag Git", "On copie la base de dev", "On active DEBUG"], a: 1, exp: "La check-list de la leçon 20." }
  ],
  final: {
    title: "Épreuve de synthèse — Le trajet complet",
    intro: `<p>Un client connecté clique « Louer » sur le dernier exemplaire de Catan. Déroulez ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "La requête est :", opts: ["Un POST avec csrf_token, session au cookie", "un GET", "un PUT anonyme", "un email"], a: 0, exp: "Écriture protégée, identité en session." },
      { type: "qcm", q: "Avant la vue :", opts: ["Le middleware pose request.user, @login_required vérifie", "MySQL décide", "le template filtre", "rien"], a: 0, exp: "Qui, puis quel droit." },
      { type: "qcm", q: "Le service, dans transaction.atomic :", opts: ["Verrouille le jeu, vérifie le stock, crée la Location, décrémente", "Décrémente sans vérifier", "Envoie un email", "Modifie le prix"], a: 0, exp: "Le cœur métier." },
      { type: "qcm", q: "Si un 2e client louait au même instant :", opts: ["Les deux réussissent", "select_for_update fait qu'un seul obtient le dernier exemplaire", "Le stock devient -1", "MySQL plante"], a: 1, exp: "La course est gagnée par un seul." },
      { type: "vf", q: "Ce trajet réutilise Merise, MySQL, Python, Django et les tests écrits cette semaine.", a: true, exp: "Toute la formation dans un clic. 🎓" }
    ],
    solution: `<pre class="pseudo">POST /louer/12/ (session + csrf)
  → request.user identifié → @login_required ok
  → vue louer : délègue à services.louer
  → transaction.atomic :
        SELECT ... FOR UPDATE  (ligne verrouillée)
        stock = 1 → Location créée, stock_location = 0
        COMMIT MySQL
  → logger.info("Location jeu=12 client=7")
  → redirect("mes_locations")</pre>
<p>🎓 <strong>Félicitations !</strong> Tu as construit la Ludothèque de bout en bout : conçue en Merise, stockée dans MySQL, écrite en Python, servie par Django, testée et déployée. C'est un projet full-stack complet — le couronnement de la pile Python.</p>`
  }
};
</script>
