  subtitle: "Le cœur métier : deux écritures indissociables dans MySQL.",
  theory: `
<h3>1. Que se passe-t-il quand on loue ?</h3>
<p>Louer un jeu, c'est <strong>deux écritures</strong> en base : créer la ligne <code>Location</code> ET diminuer <code>stock_location</code> de 1. Si l'une réussit sans l'autre, la base <em>ment</em> (un stock faux, ou une location fantôme). D'où la <strong>transaction</strong> : un groupe d'opérations traité comme un bloc <em>indivisible</em> — soit tout réussit, soit rien n'est enregistré. C'est la garantie « tout ou rien ».</p>

<h3>2. transaction.atomic + select_for_update</h3>
<pre class="pseudo">from django.db import transaction        # pour transaction.atomic (le « tout ou rien »)
from django.utils import timezone        # pour l'heure actuelle (avec fuseau)

def louer(client, jeu_id, nb_jours=7):   # service : loue le jeu jeu_id au client, pour nb_jours
    with transaction.atomic():           # début du bloc transactionnel : tout ou rien
        jeu = Jeu.objects.select_for_update().get(pk=jeu_id)   # charge le jeu ET verrouille sa ligne
        if jeu.stock_location &lt;= 0:       # plus de stock disponible ?
            raise StockInsuffisant(f"Plus de stock de location pour {jeu.titre}")   # refus → annule tout
        location = Location.objects.create(   # 1re écriture : crée la location…
            client=client, jeu=jeu,           # …pour ce client et ce jeu…
            date_debut=timezone.now(), nb_jours=nb_jours)   # …à partir de maintenant, pour nb_jours
        jeu.stock_location -= 1          # 2e écriture : on retire 1 au stock
        jeu.save(update_fields=["stock_location"])   # enregistre le nouveau stock (UPDATE ciblé)
        return location                  # succès : à la sortie du bloc, MySQL valide (commit)</pre>
<p>À la fin du bloc, si tout s'est bien passé, MySQL <strong>valide</strong> (<em>commit</em> : les écritures deviennent définitives). Mais toute exception levée dans le bloc <code>atomic</code> déclenche un <strong>rollback</strong> (« retour arrière ») : la base revient à son état d'avant, comme si rien n'avait eu lieu. <code>select_for_update</code> pose un <strong>verrou</strong> sur la ligne du jeu jusqu'au commit : un second client doit attendre que le premier ait fini. Ainsi, deux clients qui visent le dernier exemplaire ne peuvent pas réussir tous les deux.</p>

<h3>3. La course au dernier exemplaire</h3>
<pre class="pseudo">Client A                    Client B
SELECT ... FOR UPDATE ✔     SELECT ... FOR UPDATE (attend le verrou)
stock = 1 → OK
INSERT + UPDATE, COMMIT
                            (verrou levé) relit : stock = 0
                            → StockInsuffisant ✔</pre>
<p>Sans verrou, les deux clients liraient en même temps « stock = 1 », chacun se croirait autorisé, et le stock finirait à -1 : c'est une <strong>situation de compétition</strong> (<em>race condition</em>), un bug où le résultat dépend de qui arrive en premier. Le verrou l'élimine. C'est la transaction MySQL vue au cours SQL, pilotée ici par Django.</p>

<h3>4. La vue traduit en HTTP</h3>
<pre class="pseudo">@login_required                          # il faut être connecté pour louer
def louer_vue(request, jeu_id):          # vue web : traite la demande de location
    if request.method != "POST":         # on n'accepte QUE le POST (une écriture)…
        return redirect("catalogue")     # …tout GET est renvoyé au catalogue
    try:                                 # on tente la location
        services.louer(request.user, jeu_id)   # délègue au service (identité = request.user)
        messages.success(request, "Jeu loué pour 7 jours !")   # message de succès
    except Jeu.DoesNotExist:             # le jeu n'existe pas…
        raise Http404                    # …renvoie une page 404
    except StockInsuffisant as e:        # plus de stock…
        messages.error(request, str(e))  # …affiche le message d'erreur métier
    return redirect("mes_locations")     # Post-Redirect-Get : on redirige après le POST</pre>
<div class="warn">La location se fait en <strong>POST</strong> (avec <code>{% csrf_token %}</code>) : un GET serait déclenché par un simple lien, un préchargement de navigateur… et le stock fondrait tout seul.</div>
<div class="tip">La règle vit dans <code>services.louer</code> : la vue ne fait qu'identifier (session), déléguer et rediriger. L'API DRF appellera exactement la même fonction.</div>`,

    { type: "qcm", q: "La vue traduit StockInsuffisant en…", opts: ["Stack trace", "Message d'erreur + redirection", "500", "Rien"], a: 1, exp: "messages.error." },

    { type: "qcm", q: "Après le POST réussi, la vue fait…", opts: ["render direct", "redirect (Post-Redirect-Get)", "un print", "un sleep"], a: 1, exp: "F5 ne reloue pas." },

      { type: "vf", q: "À la sortie du bloc atomic sans exception, MySQL committe.", a: true, exp: "Tout est écrit, le verrou tombe." }
    ],
    solution: `<pre class="pseudo">def louer(client, jeu_id, nb_jours=7):   # service de location
    with transaction.atomic():           # tout ou rien

<p>Le cœur de la Ludothèque bat. Demain : l'achat, sur l'autre stock.</p>`

    solution: "class DejaRendue(Exception):   # exception métier : la location a déjà été rendue\n    pass   # corps vide ; le nom suffit\n\ndef rendre(location_id):   # service : enregistre le retour d'une location\n    with transaction.atomic():   # tout ou rien\n        location = (Location.objects   # charge la location…\n                    .select_for_update()   # …en verrouillant sa ligne\n                    .select_related(\"jeu\")   # …et son jeu (chargé par JOIN)\n                    .get(pk=location_id))   # …par son identifiant\n        if location.date_retour is not None:   # a-t-elle déjà une date de retour ?\n            raise DejaRendue(\"Cette location a déjà été rendue\")   # oui : on refuse (rollback)\n\n        location.date_retour = timezone.now()   # sinon : on pose la date de retour (maintenant)\n        location.save(update_fields=[\"date_retour\"])   # enregistre le retour\n\n        jeu = location.jeu   # le jeu concerné\n        jeu.stock_location += 1   # le jeu revient : +1 au stock\n        jeu.save(update_fields=[\"stock_location\"])   # enregistre le nouveau stock\n        return location   # commit à la sortie du bloc",
    note: "Le retour est le miroir de la location : mêmes garanties transactionnelles, dans l'autre sens (le stock remonte). Le double-rendu est refusé par une exception métier explicite — sans elle, rendre deux fois gonflerait le stock. Le verrou empêche deux guichets de rendre la même location au même instant." }
