<script>
var DAY = {
  num: 4,
  title: "Le catalogue : modèles Jeu, Categorie, Fournisseur",
  subtitle: "Compléter les modèles et leur donner du vocabulaire.",
  theory: `
<h3>1. Le fournisseur</h3>
<pre class="pseudo">class Fournisseur(models.Model):                    # modèle Fournisseur = une table FOURNISSEUR
    nom = models.CharField(max_length=150)          # nom de l'entreprise (texte, 150 max)
    email = models.EmailField(unique=True)          # email : format vérifié + unique (pas de doublon)

    def __str__(self):                              # texte lisible représentant l'objet
        return self.nom                             # renvoie le nom du fournisseur

class Jeu(models.Model):                            # (on complète le modèle Jeu déjà créé)
    ...                                             # ... = les champs déjà écrits en leçon 3
    fournisseur = models.ForeignKey(                # nouveau lien : chaque jeu a un fournisseur
        Fournisseur, null=True, blank=True, on_delete=models.SET_NULL)   # optionnel ; si supprimé, la FK passe à NULL</pre>
<p>Une <strong>classe</strong> est un modèle-type qui décrit une sorte d'objet (ici un fournisseur) : ses <strong>données</strong> (nom, email) et ses <strong>méthodes</strong> (des fonctions attachées à l'objet). Le mot <code>self</code> désigne « l'objet courant », celui dont on parle — comme dire « moi-même ». <code>on_delete</code> décide de ce qui arrive aux jeux quand on supprime le fournisseur lié. <code>SET_NULL</code> : si un fournisseur disparaît, ses jeux <strong>restent</strong> au catalogue et leur clé étrangère passe à <code>NULL</code> (une valeur spéciale signifiant « vide / inconnu »). À comparer avec <code>PROTECT</code> de la catégorie, qui interdit la suppression : chaque <code>on_delete</code> est une décision <strong>métier</strong> (une règle propre à l'activité) différente.</p>

<h3>2. __str__ : le nom lisible</h3>
<pre class="pseudo">def __str__(self):        # méthode appelée quand Django veut afficher l'objet en texte
    return self.titre     # renvoie le titre, ex. "Catan" au lieu de "Jeu object (3)"</pre>
<p>Partout où un objet s'affiche — dans l'<strong>admin</strong> (l'interface de gestion fournie automatiquement par Django), le <strong>shell</strong> (la console où l'on tape des commandes Python à la main) ou les <strong>logs</strong> (le journal texte des événements du programme) — c'est <code>__str__</code> qui décide du texte affiché.</p>

<h3>3. Les propriétés calculées</h3>
<pre class="pseudo">class Jeu(models.Model):                    # (toujours le même modèle Jeu)
    ...                                     # ... = les champs déjà définis
    @property                               # @property : on lit la méthode comme un attribut (sans parenthèses)
    def est_louable(self):                  # « ce jeu est-il louable ? »
        return self.stock_location &gt; 0     # vrai si le stock de location est supérieur à 0

    @property                               # idem : encore une propriété calculée
    def est_achetable(self):                # « ce jeu est-il achetable ? »
        return self.stock_vente &gt; 0        # vrai si le stock de vente est supérieur à 0</pre>
<p>Une <strong>propriété calculée</strong> est une valeur <em>recalculée à chaque lecture</em> à partir d'autres données, au lieu d'être stockée en base. Grâce à <code>@property</code>, on l'écrit comme une méthode mais on la lit comme un simple <strong>attribut</strong> (une caractéristique de l'objet) : <code>jeu.est_louable</code>, sans parenthèses. La règle « louable = stock &gt; 0 » est ainsi écrite <strong>une seule fois</strong> : les <strong>templates</strong> (les pages HTML), les services et les tests diront tous <code>jeu.est_louable</code>. Si la règle change (ex. un jeu retiré du catalogue), un seul endroit est à modifier.</p>

<h3>4. Meta : ordre et noms</h3>
<pre class="pseudo">class Jeu(models.Model):                        # (le modèle Jeu, encore)
    ...                                         # ... = les champs déjà définis
    class Meta:                                 # Meta = réglages du modèle (pas de nouvelles colonnes)
        ordering = ["titre"]                    # trie les résultats par titre par défaut
        verbose_name = "jeu"                    # nom lisible au singulier (dans l'admin)
        verbose_name_plural = "jeux"            # pluriel correct « jeux » (et non « jeus »)</pre>

<h3>5. La navigation inverse</h3>
<pre class="pseudo">categorie.jeu_set.all()       # tous les jeux d'une catégorie
fournisseur.jeu_set.count()   # combien de jeux fournis</pre>
<div class="warn"><code>null=True</code> (la base accepte NULL) et <code>blank=True</code> (le formulaire accepte vide) sont <strong>deux choses différentes</strong> : une FK optionnelle a besoin des deux.</div>
<div class="tip">Ces modèles enrichis alimentent déjà l'admin Django (<code>admin.site.register</code>) : en deux lignes, le vendeur a une interface de gestion — en attendant son espace dédié (leçon 16).</div>`,
  exercises: [
    { type: "qcm", q: "Si un fournisseur est supprimé, ses jeux…", opts: ["Disparaissent", "Restent, FK à NULL (SET_NULL)", "Bloquent la suppression", "Prennent un fournisseur par défaut"], a: 1, exp: "Décision métier : le catalogue survit." },
    { type: "qcm", q: "SET_NULL exige…", opts: ["null=True", "unique=True", "default=0", "rien"], a: 0, exp: "La colonne doit accepter NULL." },
    { type: "qcm", q: "Catégorie en PROTECT mais fournisseur en SET_NULL :", opts: ["Une incohérence", "Deux décisions métier différentes et assumées", "Un bug Django", "Un réglage imposé par MySQL"], a: 1, exp: "Chaque relation a sa règle." },
    { type: "qcm", q: "__str__ sert à…", opts: ["Trier", "L'affichage lisible (admin, shell, logs)", "Migrer", "Sécuriser"], a: 1, exp: "\"Catan\" au lieu de \"Jeu object (3)\"." },
    { type: "qcm", q: "@property est_louable renvoie…", opts: ["stock_location > 0", "le prix", "le titre", "un QuerySet"], a: 0, exp: "Règle écrite une fois." },
    { type: "qcm", q: "L'intérêt d'une propriété calculée :", opts: ["La vitesse", "La règle vit à un seul endroit", "Moins de RAM", "Un gain de place en base"], a: 1, exp: "Un seul point de vérité." },
    { type: "vf", q: "Si la règle « louable » change, on modifie chaque template.", a: false, exp: "Un seul endroit : la propriété." },
    { type: "qcm", q: "null=True vs blank=True :", opts: ["Identiques", "Base accepte NULL vs formulaire accepte vide", "L'inverse", "Aucun sens"], a: 1, exp: "Deux couches différentes." },
    { type: "qcm", q: "Meta.ordering = [\"titre\"] fait que…", opts: ["Les requêtes sont triées par titre par défaut", "Le titre est unique", "Le titre est indexé", "Rien"], a: 0, exp: "Ordre par défaut." },
    { type: "qcm", q: "Tous les jeux d'une catégorie :", opts: ["categorie.jeu_set.all()", "Jeu.all(categorie)", "categorie.jeux()", "SELECT manuel"], a: 0, exp: "Navigation inverse." },
    { type: "qcm", q: "EmailField(unique=True) garantit…", opts: ["Un format d'email validé ET l'unicité en base", "Rien", "Le chiffrement", "La rapidité"], a: 0, exp: "Validation + contrainte UNIQUE." },
    { type: "vf", q: "est_achetable regarde stock_vente, pas stock_location.", a: true, exp: "Deux stocks, deux propriétés." },
    { type: "qcm", q: "L'admin Django s'active pour un modèle par…", opts: ["admin.site.register(Jeu)", "un template", "une migration", "un service"], a: 0, exp: "Interface de gestion immédiate." },
    { type: "qcm", q: "verbose_name_plural = \"jeux\" évite…", opts: ["Un bug", "L'affichage « jeus » dans l'admin", "Une migration", "Un index"], a: 1, exp: "Pluriel français correct." },
    { type: "vf", q: "Une propriété Python (@property) crée une colonne en base.", a: false, exp: "Calculée à la volée, pas stockée." }
  ],
  final: {
    title: "Exercice final — Le catalogue complet",
    intro: `<p>On enrichit les modèles du catalogue.</p>`,
    questions: [
      { type: "qcm", q: "La FK fournisseur s'écrit :", opts: ["ForeignKey(Fournisseur, null=True, blank=True, on_delete=SET_NULL)", "ForeignKey(Fournisseur, on_delete=CASCADE)", "CharField", "ManyToMany"], a: 0, exp: "Optionnelle, survivante." },
      { type: "qcm", q: "jeu.est_louable est :", opts: ["Une propriété calculée (stock_location > 0)", "Une colonne", "Un template", "Un service"], a: 0, exp: "@property." },
      { type: "qcm", q: "__str__ de Jeu renvoie :", opts: ["self.titre", "self.pk", "\"Jeu\"", "None"], a: 0, exp: "Lisible partout." },
      { type: "qcm", q: "Après modification des modèles :", opts: ["makemigrations + migrate", "rien", "recréer la base", "éditer 0001"], a: 0, exp: "Nouvelle migration." },
      { type: "vf", q: "La navigation inverse permet categorie.jeu_set.count().", a: true, exp: "Offerte par la FK." }
    ],
    solution: `<pre class="pseudo">class Fournisseur(models.Model):                    # modèle Fournisseur (table FOURNISSEUR)
    nom = models.CharField(max_length=150)          # nom (texte, 150 max)
    email = models.EmailField(unique=True)          # email validé et unique
    def __str__(self): return self.nom              # affichage lisible : le nom

class Jeu(models.Model):                            # modèle Jeu enrichi
    ...                                             # ... = les champs de la leçon 3
    fournisseur = models.ForeignKey(Fournisseur, null=True, blank=True,   # FK optionnelle vers le fournisseur
                                    on_delete=models.SET_NULL)             # si supprimé : la FK passe à NULL
    @property                                       # propriété calculée (lue sans parenthèses)
    def est_louable(self): return self.stock_location &gt; 0    # vrai si stock de location > 0
    @property                                       # autre propriété calculée
    def est_achetable(self): return self.stock_vente &gt; 0     # vrai si stock de vente > 0
    def __str__(self): return self.titre            # affichage lisible : le titre
    class Meta: ordering = ["titre"]                # tri par titre par défaut</pre>
<p>Le catalogue a tout son vocabulaire. Demain : l'interroger avec l'ORM.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris tes modèles enrichis…",
  items: [
  { id: "projpython-l4", title: "La propriété en_retard", level: 2,
    statement: "Ajoute au modèle Location une propriété en_retard : la location est en retard si elle n'a pas de date_retour ET si date_debut + nb_jours est dépassé. Ajoute aussi __str__ (« Catan loué par marie@ludo.fr ») et Meta.ordering par date_debut décroissante.",
    hints: [
      "from datetime import timedelta ; from django.utils import timezone",
      "fin = self.date_debut + timedelta(days=self.nb_jours)",
      "return self.date_retour is None and timezone.now() > fin"
    ],
    solution: "from datetime import timedelta   # timedelta = une durée (ex. 7 jours) à ajouter à une date\nfrom django.utils import timezone   # timezone.now() = la date et l'heure actuelles (avec fuseau)\n\nclass Location(models.Model):   # (on complète le modèle Location)\n    ...   # ... = les champs déjà définis (client, jeu, date_debut, nb_jours, date_retour)\n    @property   # propriété calculée : lue comme un attribut, sans parenthèses\n    def en_retard(self):   # « cette location est-elle en retard ? »\n        fin = self.date_debut + timedelta(days=self.nb_jours)   # date limite = début + nombre de jours\n        return self.date_retour is None and timezone.now() > fin   # vrai si pas rendue ET délai dépassé\n\n    def __str__(self):   # texte lisible de la location\n        return f\"{self.jeu.titre} loué par {self.client.email}\"   # ex. Catan loué par marie@ludo.fr\n\n    class Meta:   # réglages du modèle\n        ordering = [\"-date_debut\"]   # tri par date de début décroissante (le - = ordre inverse)",
    note: "en_retard combine deux conditions : pas encore rendue ET délai dépassé — une location rendue en retard hier n'est plus « en retard » aujourd'hui. La règle vit dans le modèle : l'espace client (leçon 16) et un futur rappel automatique afficheront la même vérité. timezone.now() respecte les fuseaux, comme UTC côté C#." }
  ]
};
