<script>
var DAY = {
  num: 14,
  title: "Le frontend : les templates du catalogue",
  subtitle: "Donner un visage à l'application avec des pages rendues côté serveur.",
  theory: `
<h3>1. API JSON ou pages HTML ?</h3>
<p>Un <strong>template</strong> (« gabarit ») est un fichier HTML à trous : on y insère les données pour produire la page finale. Le <strong>DTL</strong> (<em>Django Template Language</em>) est le mini-langage de ces trous : des balises <code>{% %}</code> pour la logique (boucles, conditions) et <code>{{ }}</code> pour afficher une valeur. L'API (leçon 7) sert les machines (du JSON) ; pour les humains, on <strong>rend le HTML côté serveur</strong> (le serveur fabrique la page complète avant de l'envoyer). Et le même service alimente les deux.</p>

<h3>2. La vue du catalogue</h3>
<pre class="pseudo">def catalogue(request):                      # vue de la page catalogue
    return render(request, "catalogue.html",   # rend le template catalogue.html…
                  {"jeux": services.jeux_louables()})   # …avec la liste des jeux louables (service)</pre>

<h3>3. Le layout et la page</h3>
<pre class="pseudo">{# templates/base.html : le squelette commun à toutes les pages #}
&lt;body&gt;
  &lt;nav&gt;…menu commun…&lt;/nav&gt;                {# barre de navigation présente sur chaque page #}
  {% block contenu %}{% endblock %}          {# emplacement que chaque page viendra remplir #}
&lt;/body&gt;

{# templates/catalogue.html : la page qui liste les jeux #}
{% extends "base.html" %}                    {# hérite du squelette base.html #}
{% block contenu %}                          {# on remplit le bloc « contenu » défini plus haut #}
{% for jeu in jeux %}                        {# pour chaque jeu de la liste transmise par la vue… #}
  &lt;tr&gt;                                    {# …une ligne de tableau #}
    &lt;td&gt;{{ jeu.titre }}&lt;/td&gt;             {# cellule : le titre (affiché en échappant le HTML) #}
    &lt;td&gt;{{ jeu.prix_location }} €&lt;/td&gt;   {# cellule : le prix de location #}
    &lt;td&gt;                                    {# cellule : le bouton d'action #}
      &lt;form method="post" action="{% url 'louer' jeu.id %}"&gt;   {# formulaire POST vers la vue « louer » #}
        {% csrf_token %}                     {# jeton anti-CSRF, obligatoire sur un POST #}
        &lt;button&gt;Louer&lt;/button&gt;              {# le bouton qui envoie le formulaire #}
      &lt;/form&gt;                                {# fin du formulaire #}
    &lt;/td&gt;                                    {# fin de la cellule #}
  &lt;/tr&gt;                                      {# fin de la ligne #}
{% endfor %}                                  {# fin de la boucle #}
{% endblock %}                                {# fin du bloc « contenu » #}</pre>
<p><code>{% extends %}</code> et <code>{% block %}</code> mettent en place un <strong>layout</strong> : une page mère (<code>base.html</code>) contient le décor commun (menu, pied de page) et laisse des <em>blocs</em> vides que chaque page remplit — on n'écrit le menu qu'une seule fois. <code>{{ }}</code> affiche une valeur en <strong>échappant le HTML</strong> (voir l'encadré), <code>{% for %}</code> boucle, <code>{% url 'nom' %}</code> fabrique l'adresse à partir du <em>nom</em> de la route (si l'URL change, le template n'a pas à bouger), et <code>{% csrf_token %}</code> ajoute un jeton anti-<strong>CSRF</strong> (une protection contre les requêtes forgées par un autre site) obligatoire sur chaque POST.</p>

<h3>4. Afficher les messages</h3>
<pre class="pseudo">{% for message in messages %}                {# pour chaque message laissé par une vue… #}
  &lt;p class="{{ message.tags }}"&gt;{{ message }}&lt;/p&gt;   {# …l'afficher ; message.tags = success/error (pour le style) #}
{% endfor %}                                 {# fin de la boucle #}</pre>
<p>Les <code>messages.success/error</code> posés par les vues (leçons 12-13) apparaissent ici, après la redirection Post-Redirect-Get.</p>

<h3>5. Adapter le menu</h3>
<pre class="pseudo">{% if user.is_authenticated %}               {# si l'utilisateur est connecté… #}
  &lt;a href="{% url 'mes_locations' %}"&gt;Mes locations&lt;/a&gt;   {# lien vers ses locations #}
  &lt;a href="{% url 'deconnexion' %}"&gt;Se déconnecter&lt;/a&gt;    {# lien de déconnexion #}
{% else %}                                   {# sinon (visiteur anonyme)… #}
  &lt;a href="{% url 'connexion' %}"&gt;Se connecter&lt;/a&gt;        {# lien de connexion #}
{% endif %}                                   {# fin du if #}</pre>
<div class="warn">Les doubles accolades <strong>échappent</strong> automatiquement : un titre de jeu malicieux (<code>&lt;script&gt;…</code>) s'affiche en texte, sans s'exécuter (protection XSS). Le filtre <code>|safe</code> ne se justifie que sur du contenu de confiance.</div>
<div class="tip">Le bouton « Louer » n'apparaît que si <code>jeu.est_louable</code> — la propriété de la leçon 4. Une règle, écrite une fois, visible partout.</div>`,
  exercises: [
    { type: "qcm", q: "Pour les pages humaines, on rend le HTML…", opts: ["Côté client uniquement", "Côté serveur avec les templates DTL", "En PDF", "Dans l'API"], a: 1, exp: "render(request, template, contexte)." },
    { type: "qcm", q: "Afficher le titre :", opts: ["{{ jeu.titre }}", "<%= titre %>", "@jeu.Titre", "${titre}"], a: 0, exp: "Syntaxe DTL." },
    { type: "qcm", q: "{{ }} protège de…", opts: ["La lenteur", "L'injection de script (XSS) via l'échappement", "Les doublons", "Le N+1"], a: 1, exp: "Échappement par défaut." },
    { type: "qcm", q: "Boucler sur les jeux :", opts: ["{% for jeu in jeux %}", "@foreach", "for(...)", "map()"], a: 0, exp: "Balise DTL." },
    { type: "qcm", q: "{% url 'louer' jeu.id %} génère…", opts: ["Du CSS", "L'URL depuis le nom de la route", "Un id", "Un token"], a: 1, exp: "On peut changer l'URL sans toucher au template." },
    { type: "qcm", q: "Le formulaire « Louer » contient obligatoirement…", opts: ["{% csrf_token %}", "|safe", "un GET", "un iframe"], a: 0, exp: "Anti-CSRF sur les POST." },
    { type: "qcm", q: "Le layout commun s'écrit avec…", opts: ["{% extends %} / {% block %}", "un copier-coller", "un iframe", "du JS"], a: 0, exp: "base.html + blocs." },
    { type: "qcm", q: "Les messages des vues s'affichent via…", opts: ["{% for message in messages %}", "alert()", "console.log", "un mail"], a: 0, exp: "Framework messages." },
    { type: "vf", q: "Les messages survivent à la redirection Post-Redirect-Get.", a: true, exp: "Stockés en session le temps d'une requête." },
    { type: "qcm", q: "user.is_authenticated dans le template sert à…", opts: ["Sécuriser la vue", "Adapter le menu (confort)", "Chiffrer", "Rien"], a: 1, exp: "La sécurité reste le décorateur." },
    { type: "qcm", q: "Un titre contenant <script> s'affiche…", opts: ["En exécutant le script", "En texte inoffensif (échappé)", "Pas du tout", "En erreur 500"], a: 1, exp: "XSS neutralisé." },
    { type: "qcm", q: "Le filtre |safe…", opts: ["Sécurise", "Désactive l'échappement (contenu de confiance uniquement)", "Traduit", "Met en cache"], a: 1, exp: "À manier avec précaution." },
    { type: "qcm", q: "Le bouton « Louer » s'affiche si…", opts: ["jeu.est_louable (propriété de la leçon 4)", "toujours", "le CSS le permet", "l'admin le dit"], a: 0, exp: "Une règle, un endroit." },
    { type: "vf", q: "Il faut réécrire la logique métier pour les pages HTML.", a: false, exp: "Le même service sert API et pages." },
    { type: "qcm", q: "Les templates vivent dans…", opts: ["templates/", "models.py", "urls.py", "la base"], a: 0, exp: "Réglé par TEMPLATES/APP_DIRS." }
  ],
  final: {
    title: "Exercice final — Afficher le catalogue",
    intro: `<p>On rend la page qui liste les jeux louables.</p>`,
    questions: [
      { type: "qcm", q: "La vue renvoie :", opts: ["render(request, 'catalogue.html', {'jeux': ...})", "un JSON", "un print", "un fichier"], a: 0, exp: "Template + contexte." },
      { type: "qcm", q: "Boucler dans le template :", opts: ["{% for jeu in jeux %}", "for jeu:", "@foreach", "map"], a: 0, exp: "DTL." },
      { type: "qcm", q: "Afficher le prix :", opts: ["{{ jeu.prix_location }}", "<%= prix %>", "@prix", "$prix"], a: 0, exp: "Échappé." },
      { type: "qcm", q: "Le form « Louer » a besoin de :", opts: ["{% csrf_token %} et method=\"post\"", "rien", "un GET", "|safe"], a: 0, exp: "Écriture protégée." },
      { type: "vf", q: "DTL échappe le HTML pour éviter les injections de script.", a: true, exp: "Protection XSS par défaut." }
    ],
    solution: `<pre class="pseudo">def catalogue(request):                      # vue de la page catalogue
    return render(request, "catalogue.html",   # rend le template…
                  {"jeux": services.jeux_louables()})   # …avec les jeux louables

{% extends "base.html" %}                    {# hérite du squelette commun #}
{% block contenu %}                          {# remplit le bloc contenu #}
{% for jeu in jeux %}                        {# pour chaque jeu… #}
  &lt;tr&gt;&lt;td&gt;{{ jeu.titre }}&lt;/td&gt;&lt;td&gt;{{ jeu.prix_location }} €&lt;/td&gt;   {# titre et prix (échappés) #}
  &lt;td&gt;&lt;form method="post" action="{% url 'louer' jeu.id %}"&gt;   {# formulaire POST « louer » #}
      {% csrf_token %}&lt;button&gt;Louer&lt;/button&gt;&lt;/form&gt;&lt;/td&gt;&lt;/tr&gt;   {# jeton CSRF + bouton #}
{% endfor %}                                  {# fin de la boucle #}
{% endblock %}                                {# fin du bloc #}</pre>
<p>L'utilisateur voit la Ludothèque. Fin de la semaine 2 ! Demain : recherche et pagination.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta vue et ton template…",
  items: [
  { id: "projpython-l14", title: "Page de détail d'un jeu", level: 2,
    statement: "Écris la vue detail_jeu(request, jeu_id) (get_object_or_404) et le template detail.html : titre, prix de location, prix d'achat, et deux formulaires POST « Louer » et « Acheter » — chacun affiché seulement si la propriété correspondante (est_louable / est_achetable) est vraie, sinon un message « épuisé ».",
    hints: [
      "jeu = get_object_or_404(Jeu, pk=jeu_id) ; render(request, \"detail.html\", {\"jeu\": jeu})",
      "{% if jeu.est_louable %} … formulaire … {% else %}<p>Location épuisée</p>{% endif %}",
      "Deux actions : {% url 'louer' jeu.id %} et {% url 'acheter' jeu.id %}, chacune avec {% csrf_token %}."
    ],
    solution: "def detail_jeu(request, jeu_id):   # vue de la page de détail d'un jeu\n    jeu = get_object_or_404(Jeu, pk=jeu_id)   # charge le jeu, ou 404 s'il n'existe pas\n    return render(request, \"detail.html\", {\"jeu\": jeu})   # rend le template avec ce jeu\n\n{# templates/detail.html #}\n{% extends \"base.html\" %}   {# hérite du squelette commun #}\n{% block contenu %}   {# remplit le bloc contenu #}\n<h1>{{ jeu.titre }}</h1>   {# titre du jeu (échappé) #}\n<p>Location : {{ jeu.prix_location }} € / 7 jours — Achat : {{ jeu.prix_achat }} €</p>   {# les deux prix #}\n\n{% if jeu.est_louable %}   {# si le jeu est encore louable… #}\n  <form method=\"post\" action=\"{% url 'louer' jeu.id %}\">   {# formulaire POST « louer » #}\n    {% csrf_token %}<button>Louer</button>   {# jeton CSRF + bouton #}\n  </form>\n{% else %}   {# sinon (stock de location épuisé)… #}\n  <p>Location épuisée</p>   {# message à la place du bouton #}\n{% endif %}\n\n{% if jeu.est_achetable %}   {# si le jeu est encore achetable… #}\n  <form method=\"post\" action=\"{% url 'acheter' jeu.id %}\">   {# formulaire POST « acheter » #}\n    {% csrf_token %}<button>Acheter ({{ jeu.prix_achat }} €)</button>   {# jeton CSRF + bouton avec le prix #}\n  </form>\n{% else %}   {# sinon (stock de vente épuisé)… #}\n  <p>Vente épuisée</p>   {# message à la place du bouton #}\n{% endif %}\n{% endblock %}",
    note: "Les deux propriétés de la leçon 4 pilotent l'affichage : le template ne recalcule rien, il interroge le modèle. Et même si un petit malin soumettait le formulaire d'un jeu épuisé (page restée ouverte), le service lèverait StockInsuffisant — l'affichage est du confort, la barrière est en dessous." }
  ]
};
</script>
