<h3>1. Pourquoi une API ?</h3>
<p>Une <strong>API</strong> (<em>Application Programming Interface</em>, « interface de programmation ») est une porte d'entrée par laquelle d'autres programmes dialoguent avec le nôtre. Une appli mobile, un site partenaire ou un <strong>frontend</strong> JavaScript (la partie d'une application qui s'exécute dans le navigateur) ne lisent pas nos templates : ils consomment du <strong>JSON</strong> (un format texte structuré que les programmes s'échangent facilement). <strong>REST</strong> est un style d'API très répandu où l'on demande des ressources par leur adresse. <strong>Django REST Framework</strong> (DRF) est l'outil qui structure cette porte : <code>GET /api/jeux/</code> renvoie la liste, <code>GET /api/jeux/12/</code> le détail du jeu 12 — <code>GET</code> étant le verbe HTTP qui signifie « donne-moi ».</p>

<h3>2. Le serializer : notre DTO</h3>
<pre class="pseudo"># catalogue/serializers.py                                    # ce code vit dans le fichier serializers.py
class JeuSerializer(serializers.ModelSerializer):             # un serializer construit à partir du modèle Jeu
    categorie = serializers.CharField(source="categorie.nom") # la catégorie sortira comme texte (son nom)
    est_louable = serializers.BooleanField(read_only=True)    # champ vrai/faux, en lecture seule (vient de la @property)

    class Meta:                                               # réglages du serializer
        model = Jeu                                           # le modèle source : Jeu
        fields = ["id", "titre", "prix_location", "est_louable", "categorie"]   # LISTE EXPLICITE des champs exposés</pre>
<p>Un <strong>serializer</strong> (« sérialiseur ») transforme un objet Python en données simples (texte, nombres) prêtes à envoyer en JSON, et inversement — <em>sérialiser</em>, c'est mettre en forme un objet pour le transporter. Ici il joue le rôle d'un <strong>DTO</strong> (<em>Data Transfer Object</em>, « objet de transfert de données ») : il <strong>choisit ce qui sort</strong>. Ni le fournisseur, ni <code>stock_vente</code> ne figurent dans <code>fields</code> — les détails internes restent internes. <code>source="categorie.nom"</code> aplatit la relation : au lieu d'un objet catégorie imbriqué, on renvoie directement son nom, une chaîne lisible.</p>

<h3>3. Le ViewSet en lecture seule</h3>
<pre class="pseudo"># catalogue/views.py                                          # ce code vit dans le fichier views.py
class JeuViewSet(viewsets.ReadOnlyModelViewSet):              # un ViewSet en lecture seule (liste + détail)
    queryset = Jeu.objects.select_related("categorie").order_by("titre")   # les jeux, catégorie chargée par JOIN, triés
    serializer_class = JeuSerializer                          # indique quel serializer utiliser</pre>
<p>Un <strong>ViewSet</strong> regroupe en une seule classe les vues d'une même ressource (lister, voir le détail…). <code>ReadOnlyModelViewSet</code> n'offre que la <strong>lecture</strong> — liste + détail, rien d'autre : personne n'écrira dans le catalogue par cette porte. <code>select_related("categorie")</code> demande de charger la catégorie <em>en même temps</em> que les jeux, par un <strong>JOIN</strong> (une jointure SQL). Cela évite le problème <strong>N+1</strong> : sans cela, afficher N jeux déclencherait 1 requête pour la liste plus 1 requête par jeu pour sa catégorie (soit N+1 requêtes) ; ici, une seule suffit.</p>

<h3>4. Le routeur</h3>
<pre class="pseudo"># ludotheque/urls.py                                          # ce code vit dans le fichier urls.py du projet
router = DefaultRouter()                                      # crée un routeur : il fabrique les URLs automatiquement
router.register("jeux", JeuViewSet)                          # branche le ViewSet sous /jeux/ (liste et détail)

urlpatterns = [                                               # la liste des routes de l'application
    path("admin/", admin.site.urls),                         # /admin/ → l'interface d'administration de Django
    path("api/", include(router.urls)),                      # /api/... → toutes les URLs créées par le routeur
]</pre>

<h3>5. Tester au navigateur et en ligne de commande</h3>

    solution: "from django.db.models import Count   # Count = compter des lignes (agrégat SQL)\n\nclass CategorieSerializer(serializers.ModelSerializer):   # serializer du modèle Categorie\n    nb_jeux = serializers.IntegerField(read_only=True)   # nombre de jeux, lecture seule (vient de l'annotation)\n\n    class Meta:   # réglages du serializer\n        model = Categorie   # modèle source : Categorie\n        fields = [\"id\", \"nom\", \"nb_jeux\"]   # champs exposés\n\nclass CategorieViewSet(viewsets.ReadOnlyModelViewSet):   # ViewSet en lecture seule\n    queryset = (Categorie.objects   # les catégories…\n                .annotate(nb_jeux=Count(\"jeu\"))   # …avec un compteur nb_jeux calculé par MySQL (GROUP BY)\n                .order_by(\"nom\"))   # …triées par nom\n    serializer_class = CategorieSerializer   # serializer à utiliser\n\n# urls.py\nrouter.register(\"categories\", CategorieViewSet)   # branche le ViewSet sous /categories/\n\n# GET /api/categories/ ->\n# [{\"id\": 2, \"nom\": \"Stratégie\", \"nb_jeux\": 14}, ...]",
    note: "L'annotation Count génère un GROUP BY : le comptage se fait dans MySQL, pas en Python — une requête, quel que soit le nombre de catégories. Le serializer déclare nb_jeux read_only : le champ n'existe pas en base, il naît de la requête. Le frontend (leçon 15) utilisera cette liste pour son filtre par catégorie." }
