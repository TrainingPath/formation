var DAY = {
  num: 15,
  title: "Recherche, filtres et pagination",
  subtitle: "Rendre un grand catalogue navigable et rapide.",
  theory: `
<h3>1. Le besoin</h3>
<p>Un catalogue de centaines de jeux ne s'affiche pas d'un seul bloc. On ajoute trois choses. Une <strong>recherche</strong> par titre et un <strong>filtre</strong> par catégorie, transmis dans la <strong>query string</strong> — la partie de l'URL après le <code>?</code>, faite de paires <code>clé=valeur</code> (ici <code>?q=catan&amp;cat=2</code>). Et une <strong>pagination</strong> : découper les résultats en pages de taille fixe pour n'aller chercher en base que ce qu'on affiche.</p>

<h3>2. Composer le QuerySet</h3>
<pre class="pseudo">def catalogue(request):                      # vue du catalogue avec recherche/filtre/pagination
    jeux = Jeu.objects.louables().select_related("categorie")   # base : jeux louables, catégorie préchargée (JOIN)
    q = request.GET.get("q", "")             # texte recherché (vide si absent)
    cat = request.GET.get("cat")             # id de catégorie choisie (None si absent)
    if q:                                    # si une recherche est saisie…
        jeux = jeux.filter(titre__icontains=q)   # …garder les titres qui contiennent q (LIKE)
    if cat:                                  # si une catégorie est choisie…
        jeux = jeux.filter(categorie_id=cat)     # …garder les jeux de cette catégorie

    paginator = Paginator(jeux.order_by("titre"), 10)   # découpe en pages de 10, après tri par titre
    page = paginator.get_page(request.GET.get("page"))   # récupère la page demandée (?page=…)
    return render(request, "catalogue.html",   # rend le template…
                  {"page": page, "q": q, "cat": cat,   # …avec la page, la recherche, le filtre…
                   "categories": Categorie.objects.order_by("nom")})   # …et la liste des catégories (pour le menu)</pre>
<p>Les filtres s'ajoutent <strong>conditionnellement</strong> (un <code>if</code> par filtre présent). Grâce au QuerySet paresseux (leçon 5), on peut les empiler sans rien envoyer : la requête ne part vers MySQL qu'au moment d'afficher la page, traduite en <code>LIMIT/OFFSET</code> — les mots SQL qui disent « donne 10 lignes en sautant les N premières ».</p>

<h3>3. Toujours trier avant de paginer</h3>
<div class="warn">Sans <code>order_by</code>, l'ordre n'est pas garanti : la page 2 pourrait recontenir des jeux de la page 1. Trier d'abord, paginer ensuite — toujours.</div>

<h3>4. Le template de navigation</h3>
<pre class="pseudo">{% for jeu in page %}                        {# pour chaque jeu de la page courante… #}
  ... la ligne du jeu ...                    {# (le HTML de la ligne, comme en leçon 14) #}
{% endfor %}                                 {# fin de la boucle #}

&lt;p&gt;Page {{ page.number }} sur {{ page.paginator.num_pages }}&lt;/p&gt;   {# « Page 2 sur 7 » #}
{% if page.has_previous %}                   {# s'il existe une page précédente… #}
  &lt;a href="?q={{ q }}&cat={{ cat }}&page={{ page.previous_page_number }}"&gt;← Précédent&lt;/a&gt;   {# lien conservant q et cat #}
{% endif %}                                  {# fin du if #}
{% if page.has_next %}                       {# s'il existe une page suivante… #}
  &lt;a href="?q={{ q }}&cat={{ cat }}&page={{ page.next_page_number }}"&gt;Suivant →&lt;/a&gt;   {# lien conservant q et cat #}
{% endif %}                                  {# fin du if #}</pre>
<p>Les liens <strong>conservent</strong> <code>q</code> et <code>cat</code> : changer de page ne perd pas la recherche. Tout l'état est dans l'URL — partageable.</p>

<h3>5. Paginer aussi l'API</h3>
<pre class="pseudo"># settings.py                                # dans le fichier de réglages du projet…
REST_FRAMEWORK = {                           # configuration de Django REST Framework
    "DEFAULT_PAGINATION_CLASS": "rest_framework.pagination.PageNumberPagination",   # pagination par numéro de page
    "PAGE_SIZE": 10,                         # 10 résultats par page
}
# GET /api/jeux/?page=2 → {"count": 134, "next": "...", "results": [...]}   # réponse : total, page suivante, résultats</pre>
<div class="tip"><code>get_page()</code> encaisse les valeurs absurdes (<code>?page=abc</code>, <code>?page=9999</code>) : première ou dernière page au lieu d'une erreur. Robuste par défaut.</div>`,
  exercises: [
    { type: "qcm", q: "Paginer sert à…", opts: ["Trier", "Ne charger que la page affichée", "Sécuriser", "Valider"], a: 1, exp: "Performance et lisibilité." },
    { type: "qcm", q: "L'outil de pagination de Django :", opts: ["Paginator", "Skip/Take", "LIMIT manuel", "un for"], a: 0, exp: "django.core.paginator." },
    { type: "qcm", q: "Paginator(jeux, 10) puis get_page(n) donne…", opts: ["Toute la table", "La page n de 10 éléments", "10 tables", "Un JSON"], a: 1, exp: "L'objet page, itérable." },
    { type: "qcm", q: "En SQL MySQL, la pagination devient…", opts: ["OFFSET/FETCH", "LIMIT … OFFSET …", "TOP", "HAVING"], a: 1, exp: "Le dialecte MySQL du cours SQL." },
    { type: "vf", q: "On peut paginer sans order_by.", a: false, exp: "Ordre instable = pages incohérentes." },
    { type: "qcm", q: "Ajouter un filtre seulement s'il est fourni :", opts: ["if q: jeux = jeux.filter(...)", "toujours filter", "deux vues", "du SQL brut"], a: 0, exp: "Composition conditionnelle." },
    { type: "qcm", q: "La composition de 2 filtres + pagination envoie…", opts: ["3 requêtes", "1 requête de page (+1 count)", "N requêtes", "0"], a: 1, exp: "QuerySet paresseux." },
    { type: "qcm", q: "titre__icontains=q devient…", opts: ["= q", "LIKE '%q%' insensible à la casse", "> q", "IS NULL"], a: 1, exp: "Recherche partielle." },
    { type: "qcm", q: "Les paramètres de recherche arrivent par…", opts: ["request.GET (query string)", "request.POST", "la session", "un cookie"], a: 0, exp: "GET → URL partageable." },
    { type: "qcm", q: "Les liens Précédent/Suivant conservent q et cat pour…", opts: ["Le style", "Ne pas perdre la recherche en changeant de page", "Le cache", "Rien"], a: 1, exp: "L'état vit dans l'URL." },
    { type: "qcm", q: "?page=abc avec get_page() :", opts: ["500", "Première page (robuste)", "Page vide", "Crash MySQL"], a: 1, exp: "Valeurs absurdes encaissées." },
    { type: "qcm", q: "page.paginator.num_pages donne…", opts: ["Le nombre total de pages", "La taille", "Le SQL", "L'index"], a: 0, exp: "Pour « page 2 sur 7 »." },
    { type: "qcm", q: "Paginer l'API DRF :", opts: ["DEFAULT_PAGINATION_CLASS + PAGE_SIZE", "un for en JS", "impossible", "un template"], a: 0, exp: "count/next/results." },
    { type: "qcm", q: "select_related(\"categorie\") dans cette vue évite…", opts: ["Le tri", "Le N+1 à l'affichage de la catégorie", "Le CSRF", "Le cache"], a: 1, exp: "JOIN unique." },
    { type: "vf", q: "L'URL /catalogue/?q=catan&page=2 peut être partagée et rejouée.", a: true, exp: "Tout l'état est dedans." }
  ],
  final: {
    title: "Exercice final — Le catalogue navigable",
    intro: `<p>On assemble recherche, filtre et pagination.</p>`,
    questions: [
      { type: "qcm", q: "L'ordre des opérations :", opts: ["filter (si fournis) → order_by → Paginator", "Paginator → filter", "order_by seul", "aucun ordre"], a: 0, exp: "Filtrer, trier, paginer." },
      { type: "qcm", q: "Le filtre catégorie s'ajoute :", opts: ["Seulement si ?cat= est présent", "toujours", "dans le template", "en JS"], a: 0, exp: "Conditionnel." },
      { type: "qcm", q: "10 jeux par page :", opts: ["Paginator(jeux.order_by(\"titre\"), 10)", "jeux[:10] partout", "LIMIT écrit à la main", "un slice en JS"], a: 0, exp: "Le Paginator gère." },
      { type: "qcm", q: "Le lien « Suivant » :", opts: ["?q={{ q }}&cat={{ cat }}&page={{ page.next_page_number }}", "?page=next", "un POST", "un script"], a: 0, exp: "État conservé." },
      { type: "vf", q: "L'API DRF se pagine par configuration, sans code dans le ViewSet.", a: true, exp: "settings.py suffit." }
    ],
    solution: `<pre class="pseudo">jeux = Jeu.objects.louables().select_related("categorie")   # jeux louables, catégorie préchargée
if q:   jeux = jeux.filter(titre__icontains=q)   # filtre recherche (si q fourni)
if cat: jeux = jeux.filter(categorie_id=cat)     # filtre catégorie (si cat fourni)

paginator = Paginator(jeux.order_by("titre"), 10)   # pages de 10, triées par titre
page = paginator.get_page(request.GET.get("page"))   # la page demandée

{# navigation #}
{% if page.has_next %}                       {# s'il reste une page suivante… #}
  &lt;a href="?q={{ q }}&cat={{ cat }}&page={{ page.next_page_number }}"&gt;Suivant&lt;/a&gt;   {# lien qui conserve q et cat #}
{% endif %}                                  {# fin du if #}</pre>
<p>Le catalogue est navigable. Demain : un espace pour chacun des trois profils.</p>`
  }
};
