<script>
var DAY = {
  num: 20,
  title: "Déploiement : migrations, statiques, mise en ligne",
  subtitle: "Transformer le projet en application en ligne.",
  theory: `
<h3>1. La configuration de production</h3>
<pre class="pseudo">export DJANGO_SECRET_KEY="cle-longue-aleatoire"   # pose la clé secrète dans l'environnement du serveur
export DJANGO_DEBUG=0                              # DEBUG désactivé en production
export DB_PASSWORD="..."                           # mot de passe MySQL, hors du code

# settings.py                                      # dans le fichier de réglages…
DEBUG = os.environ.get("DJANGO_DEBUG", "0") == "1"   # DEBUG vrai seulement si la variable vaut "1"
ALLOWED_HOSTS = ["ludotheque.example.com"]         # seuls ces noms d'hôte sont acceptés</pre>
<p><strong>Déployer</strong>, c'est installer et faire tourner l'application sur un serveur accessible au public — la mettre « en <strong>production</strong> ». La configuration y diffère du développement. <code>DEBUG=0</code> fait disparaître les pages d'erreur détaillées (code, variables, chemins internes), qui renseigneraient un attaquant. <code>ALLOWED_HOSTS</code> est la liste des <strong>noms d'hôte</strong> (les adresses du site, comme <code>ludotheque.example.com</code>) que le serveur accepte : toute requête adressée à un autre nom est refusée.</p>

<h3>2. La base de production</h3>
<pre class="pseudo">python manage.py migrate          # rejoue toutes les migrations : crée le schéma dans le MySQL de prod
python manage.py createsuperuser  # crée le premier compte administrateur (interactif)</pre>
<p>Les migrations écrites depuis la leçon 3 rejouent <strong>exactement</strong> le même schéma sur le MySQL de production — rôles compris (migration de données de la leçon 9).</p>

<h3>3. Les fichiers statiques</h3>
<pre class="pseudo">python manage.py collectstatic --noinput   # rassemble tous les fichiers statiques ; --noinput = sans confirmation
# → rassemble CSS/JS/images dans STATIC_ROOT, servis par nginx   # (dossier unique lu par le serveur web)</pre>
<p>Les <strong>fichiers statiques</strong> sont les fichiers qui ne changent pas à chaque requête : feuilles de style CSS, scripts JavaScript, images. En production, Django ne les sert pas lui-même : le <strong>serveur web</strong> (comme <strong>nginx</strong>, un logiciel spécialisé dans la distribution de fichiers) s'en charge, bien plus vite. <code>collectstatic</code> les rassemble d'abord dans un dossier unique.</p>

<h3>4. Servir avec gunicorn</h3>
<pre class="pseudo">pip install gunicorn              # installe gunicorn (le serveur d'application de production)
gunicorn ludotheque.wsgi:application --bind 0.0.0.0:$PORT --workers 3   # lance l'appli : écoute sur $PORT, 3 processus</pre>
<p><code>runserver</code> est un serveur de <strong>développement</strong>, trop lent et fragile pour de vrais utilisateurs. En production on utilise <strong>gunicorn</strong>, un serveur <strong>WSGI</strong> (l'interface standard entre un serveur web et une application Python) qui lance plusieurs <strong>workers</strong> (des processus qui traitent les requêtes en parallèle). Il tourne derrière un <strong>reverse proxy</strong> (un intermédiaire placé devant, comme nginx) qui reçoit les visiteurs et gère le <strong>HTTPS</strong> (la version chiffrée et sécurisée de HTTP).</p>

<h3>5. La check-list de mise en ligne</h3>
<pre class="pseudo">✔ python manage.py test        → tout est vert
✔ pip freeze == requirements.txt (installation rejouable)
✔ variables d'environnement posées (SECRET_KEY, DB, DEBUG=0)
✔ python manage.py check --deploy   (audit des réglages de prod)
✔ migrate + collectstatic sur la prod
✔ gunicorn derrière le proxy
✔ tag Git de la version : git tag v1.0.0 && git push --tags</pre>
<div class="warn">On ne déploie jamais ce qui n'est pas commité : le <strong>tag Git</strong> dit exactement quel code tourne en production — et permet d'y revenir si la v1.0.1 se passe mal.</div>
<div class="tip"><code>check --deploy</code> liste les oublis classiques (cookies non sécurisés, DEBUG, HSTS…). Le déploiement réunit toute la formation : le code (Python), le schéma (migrations Merise → MySQL), la configuration (secrets) et Git.</div>`,
  exercises: [
    { type: "qcm", q: "En production, DEBUG vaut…", opts: ["1", "0", "peu importe", "true"], a: 1, exp: "Jamais de stack trace publique." },
    { type: "qcm", q: "DEBUG=1 en prod divulguerait…", opts: ["Rien", "Code, variables, chemins internes", "Les mots de passe des utilisateurs", "Le contenu de la base de données"], a: 1, exp: "Pages d'erreur détaillées." },
    { type: "qcm", q: "ALLOWED_HOSTS sert à…", opts: ["Lister les admins", "Refuser les requêtes d'un autre nom d'hôte", "Bloquer des IP", "Rien"], a: 1, exp: "Anti host-header injection." },
    { type: "qcm", q: "Mettre la base de prod au niveau du code :", opts: ["Recréer les tables à la main", "python manage.py migrate", "Copier la base de dev", "Rien"], a: 1, exp: "Les migrations rejouent tout." },
    { type: "vf", q: "Les migrations de prod sont les mêmes fichiers que celles de dev depuis la leçon 3.", a: true, exp: "Même histoire, même schéma." },
    { type: "qcm", q: "Les rôles existent en prod grâce…", opts: ["À un clic manuel", "À la migration de données de la leçon 9", "À un INSERT manuel", "Au fichier settings.py"], a: 1, exp: "RunPython versionné." },
    { type: "qcm", q: "collectstatic sert à…", opts: ["Compiler Python", "Rassembler CSS/JS/images dans STATIC_ROOT", "Migrer", "Tester"], a: 1, exp: "Servis ensuite par nginx." },
    { type: "qcm", q: "En production, les statiques sont servis par…", opts: ["Django", "nginx (le serveur web)", "MySQL", "le navigateur seul"], a: 1, exp: "Plus rapide, cache correct." },
    { type: "qcm", q: "Le serveur d'application de production :", opts: ["runserver", "gunicorn (WSGI, multi-workers)", "python -m http.server", "le shell"], a: 1, exp: "runserver = dev seulement." },
    { type: "qcm", q: "Le reverse proxy gère typiquement…", opts: ["Les migrations", "HTTPS et la répartition", "Les tests", "Les modèles"], a: 1, exp: "Devant gunicorn." },
    { type: "qcm", q: "Avant de déployer, on vérifie que…", opts: ["python manage.py test est vert", "la base de dev est copiée", "les logs sont vidés", "rien"], a: 0, exp: "Jamais de déploiement rouge." },
    { type: "qcm", q: "check --deploy sert à…", opts: ["Déployer", "Auditer les réglages de production (cookies, HSTS…)", "Migrer", "Créer un super-utilisateur"], a: 1, exp: "Les oublis classiques." },
    { type: "qcm", q: "Le tag Git v1.0.0 sert à…", opts: ["Fusionner deux branches", "Savoir exactement quel code tourne (et y revenir)", "Compiler", "Chiffrer"], a: 1, exp: "Traçabilité." },
    { type: "vf", q: "On peut déployer du code non commité si on est pressé.", a: false, exp: "Introuvable et irréproductible." },
    { type: "qcm", q: "requirements.txt permet…", opts: ["Une installation identique sur le serveur (pip install -r)", "De tester", "De documenter le projet", "Rien"], a: 0, exp: "Versions figées (leçon 2)." }
  ],
  final: {
    title: "Exercice final — La mise en ligne",
    intro: `<p>On déroule la check-list de déploiement de la Ludothèque.</p>`,
    questions: [
      { type: "qcm", q: "Première étape :", opts: ["python manage.py test (tout vert)", "supprimer les tests", "copier la base de dev", "désactiver le pare-feu"], a: 0, exp: "On ne déploie pas du rouge." },
      { type: "qcm", q: "La configuration sensible arrive par :", opts: ["Variables d'environnement", "settings.py commité", "un champ caché du formulaire", "un fichier texte versionné"], a: 0, exp: "SECRET_KEY, DB, DEBUG." },
      { type: "qcm", q: "Le schéma et les rôles de prod viennent de :", opts: ["manage.py migrate", "CREATE TABLE manuels", "une copie de dev", "rien"], a: 0, exp: "Migrations + RunPython." },
      { type: "qcm", q: "L'application est servie par :", opts: ["gunicorn derrière un reverse proxy", "runserver", "un fichier", "MySQL"], a: 0, exp: "WSGI de production." },
      { type: "vf", q: "On pose un tag Git sur le commit déployé.", a: true, exp: "v1.0.0 : traçabilité et retour arrière." }
    ],
    solution: `<pre class="pseudo">python manage.py test                     # tout vert
python manage.py check --deploy           # audit de prod

export DJANGO_SECRET_KEY="cle-longue-aleatoire"   # clé secrète dans l'environnement
export DJANGO_DEBUG=0                              # DEBUG désactivé
export DB_PASSWORD="..."                           # mot de passe MySQL, hors du code

python manage.py migrate                  # schéma + rôles
python manage.py collectstatic --noinput  # statiques pour nginx

gunicorn ludotheque.wsgi:application --bind 0.0.0.0:$PORT --workers 3   # lance l'appli en production
git tag v1.0.0 && git push --tags         # tag Git : trace la version déployée</pre>
<p>La Ludothèque est en ligne. Demain : l'examen final — toute l'application en 20 questions.</p>`
  }
};
</script>

  ]
