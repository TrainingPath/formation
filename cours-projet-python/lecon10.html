var DAY = {
  num: 10,
  title: "Authentification : connexion et sessions",
  subtitle: "Prouver qui l'on est — et le rester de page en page.",
  theory: `
<h3>1. Authentification vs autorisation</h3>
<p><strong>Authentifier</strong> = vérifier <em>qui</em> parle (le sujet d'aujourd'hui). <strong>Autoriser</strong> = décider ce qu'il a le <em>droit</em> de faire (leçon 11). Le web étant « sans mémoire » (chaque requête est indépendante), il faut un moyen de se souvenir de l'utilisateur d'une page à l'autre : la <strong>session</strong>, un petit dossier gardé côté serveur. Elle est reliée au navigateur par un <strong>cookie</strong> (une petite info que le navigateur renvoie à chaque requête) <strong>signé</strong>, pour qu'on ne puisse pas le falsifier.</p>

<h3>2. La vue de connexion</h3>
<pre class="pseudo">from django.contrib.auth import authenticate, login, logout   # outils d'authentification fournis par Django

def connexion(request):                          # vue appelée par la page de connexion
    if request.method == "POST":                 # si le formulaire a été SOUMIS (méthode POST)…
        user = authenticate(request,             # …on vérifie les identifiants…
                            username=request.POST["email"],        # l'email saisi dans le formulaire
                            password=request.POST["mot_de_passe"]) # le mot de passe saisi
        if user is None:                         # aucun compte ne correspond (email OU mot de passe faux)
            messages.error(request, "Identifiants invalides")   # message volontairement vague
            return redirect("connexion")         # on renvoie vers la page de connexion
        login(request, user)                    # la session s'ouvre ici (l'utilisateur est mémorisé)
        return redirect("catalogue")             # succès : on l'envoie vers le catalogue
    return render(request, "connexion.html")     # simple affichage (GET) : on montre le formulaire</pre>
<p><code>request.method</code> dit comment la page est appelée : <code>GET</code> pour l'afficher, <code>POST</code> pour envoyer un formulaire. <code>authenticate</code> compare le mot de passe reçu au <strong>hachage</strong> stocké ; <code>login</code> enregistre l'utilisateur dans la session. <code>redirect</code> renvoie le navigateur vers une autre page ; <code>render</code> fabrique une page HTML à partir d'un template. Aux requêtes suivantes, le <strong>middleware</strong> (un intermédiaire qui traite chaque requête au passage) reconnaît la session et remplit <code>request.user</code> : les vues savent alors qui est connecté.</p>

<h3>3. Pourquoi un message vague ?</h3>
<p>Un message trop précis (« email inconnu » plutôt que « mauvais mot de passe ») aiderait un attaquant à <strong>énumérer les comptes</strong> : en testant des emails, il découvrirait lesquels existent. Les deux échecs affichent donc <em>le même</em> message vague, pour ne rien révéler.</p>

<h3>4. Protéger une vue</h3>
<pre class="pseudo">from django.contrib.auth.decorators import login_required   # le décorateur qui exige une connexion

@login_required                       # décorateur : si l'utilisateur n'est pas connecté → redirection vers LOGIN_URL
def louer(request, jeu_id):           # cette vue n'est accessible qu'aux connectés
    ...                               # ici, request.user est fiable (forcément un utilisateur connecté)

# settings.py                         # dans le fichier de réglages…
LOGIN_URL = "connexion"               # …on indique vers quelle page rediriger les anonymes</pre>
<p>Un <strong>décorateur</strong> (le <code>@</code> posé juste au-dessus d'une fonction) enveloppe cette fonction pour lui ajouter un comportement sans toucher à son code : ici, <code>@login_required</code> vérifie la connexion avant de laisser entrer. Le catalogue reste <strong>public</strong> en lecture ; louer, acheter et les espaces personnels, eux, exigent d'être connecté.</p>

<h3>5. Déconnexion et session</h3>
<pre class="pseudo">def deconnexion(request):             # vue de déconnexion
    logout(request)                   # vide la session (l'utilisateur n'est plus reconnu)
    return redirect("catalogue")      # puis retour au catalogue</pre>
<p>Le cookie de session est <strong>signé</strong> à l'aide de la <code>SECRET_KEY</code> du projet (une clé secrète connue du seul serveur) : si le client modifie le cookie, la signature ne correspond plus et Django rejette l'identité falsifiée. Impossible donc de se fabriquer un compte en éditant le cookie.</p>
<div class="warn">Le formulaire de connexion est un POST avec <code>{% csrf_token %}</code> — jamais un GET : les identifiants n'ont rien à faire dans une URL (historique, logs de proxy…).</div>
<div class="tip">Session (site web, cookie) aujourd'hui — c'est l'équivalent du JWT utilisé dans le capstone C# pour une API : deux façons de transporter la même identité. DRF peut d'ailleurs accepter la session pour l'API interne.</div>`,
  exercises: [
    { type: "qcm", q: "Authentifier, c'est…", opts: ["Donner des droits", "Vérifier l'identité", "Chiffrer la base", "Paginer"], a: 1, exp: "Le QUI ; les droits, c'est demain." },
    { type: "qcm", q: "L'identité persiste de page en page grâce…", opts: ["À l'URL", "À la session (cookie signé)", "À une variable globale du serveur", "À la RAM du client"], a: 1, exp: "Middleware sessions." },
    { type: "qcm", q: "authenticate(...) compare le mot de passe…", opts: ["En clair", "Au hachage stocké", "À l'email", "Au cookie"], a: 1, exp: "check_password en interne." },

    { type: "qcm", q: "Échec de connexion : le message dit…", opts: ["« Email inconnu »", "« Identifiants invalides » (vague, exprès)", "« Mauvais mot de passe »", "La stack"], a: 1, exp: "Pas d'énumération de comptes." },
    { type: "vf", q: "Distinguer « email inconnu » de « mauvais mot de passe » est plus ergonomique donc recommandé.", a: false, exp: "Ça renseigne l'attaquant." },
    { type: "qcm", q: "Protéger une vue :", opts: ["@login_required", "un if dans le template", "le décorateur @csrf_exempt", "rien"], a: 0, exp: "Redirige vers LOGIN_URL sinon." },
    { type: "qcm", q: "Un anonyme sur une vue @login_required est…", opts: ["Bloqué 500", "Redirigé vers la page de connexion", "Servi", "Renvoyé en 403 Forbidden"], a: 1, exp: "302 vers LOGIN_URL." },
    { type: "qcm", q: "Le catalogue en lecture est…", opts: ["Public", "Réservé aux connectés", "Réservé à l'admin", "Caché"], a: 0, exp: "Consulter n'exige pas de compte." },
    { type: "qcm", q: "logout(request) :", opts: ["Supprime le compte", "Vide la session", "Change le mot de passe", "Rien"], a: 1, exp: "Déconnexion propre." },
    { type: "qcm", q: "Le cookie de session ne peut pas être forgé car…", opts: ["Il est signé avec SECRET_KEY", "Il est long", "Il est en HTTPS seulement", "Il est caché"], a: 0, exp: "Falsification détectée." },
    { type: "qcm", q: "Le formulaire de connexion est…", opts: ["Un GET", "Un POST avec {% csrf_token %}", "Un PUT", "Un lien"], a: 1, exp: "Jamais d'identifiants en URL." },
    { type: "vf", q: "La session Django joue le rôle que jouait le JWT dans le capstone C#.", a: true, exp: "Deux transports d'identité." },
    { type: "qcm", q: "LOGIN_URL configure…", opts: ["Où @login_required redirige les anonymes", "Le mot de passe", "La base", "Le port"], a: 0, exp: "settings.py." }
  ],
  final: {
    title: "Exercice final — La connexion",
    intro: `<p>On ouvre la porte de la Ludothèque, sans l'ouvrir trop grand.</p>`,
    questions: [
      { type: "qcm", q: "La vérification des identifiants :", opts: ["authenticate(request, username=..., password=...)", "un == en clair", "un SELECT du mot de passe", "un cookie"], a: 0, exp: "Contre le hachage." },
      { type: "qcm", q: "user is None →", opts: ["Message vague + redirection", "détail de l'erreur", "500", "création du compte"], a: 0, exp: "Les deux échecs, même message." },
      { type: "qcm", q: "La session s'ouvre par :", opts: ["login(request, user)", "session.start()", "un JWT", "un GET"], a: 0, exp: "Puis cookie signé." },
      { type: "qcm", q: "louer est protégée par :", opts: ["@login_required", "rien", "un middleware global", "un commentaire"], a: 0, exp: "Connecté obligatoire." },
      { type: "vf", q: "Le mot de passe est vérifié une fois à la connexion, pas à chaque page.", a: true, exp: "La session porte ensuite l'identité." }
    ],
    solution: `<pre class="pseudo">def connexion(request):                          # vue de connexion
    if request.method == "POST":                 # formulaire soumis ?
        user = authenticate(request,             # vérifie les identifiants…
                            username=request.POST["email"],        # email saisi

@login_required                                  # accès réservé aux connectés

<p>On sait QUI est là. Demain : décider de ses DROITS, rôle par rôle.</p>`

    solution: "def connexion(request):   # vue de connexion\n    next_url = request.POST.get(\"next\") or request.GET.get(\"next\") or \"catalogue\"   # page où revenir après connexion\n    if request.method == \"POST\":   # formulaire soumis ?\n        user = authenticate(request,   # vérifie les identifiants…\n                            username=request.POST[\"email\"],   # email saisi\n                            password=request.POST[\"mot_de_passe\"])   # mot de passe saisi\n        if user is None:   # identifiants faux…\n            messages.error(request, \"Identifiants invalides\")   # message vague\n            return redirect(\"connexion\")   # retour à la connexion\n        login(request, user)   # ouvre la session\n        return redirect(next_url)   # succès → page next (ou catalogue)\n    return render(request, \"connexion.html\", {\"next\": next_url})   # GET : affiche le formulaire (en gardant next)\n\ndef deconnexion(request):   # vue de déconnexion\n    logout(request)   # vide la session\n    return redirect(\"catalogue\")   # retour au catalogue\n\n# settings.py\nLOGIN_URL = \"connexion\"   # page vers laquelle rediriger les anonymes\n\n# urls.py\npath(\"connexion/\", views.connexion, name=\"connexion\"),   # route /connexion/\npath(\"deconnexion/\", views.deconnexion, name=\"deconnexion\"),   # route /deconnexion/",
