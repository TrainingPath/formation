  title: "Comprendre un article de fond",
  subtitle: "Lire un article argumentatif, repérer la thèse et les arguments.",
  theory: `
<h3>1. Qu'est-ce qu'un article de fond ?</h3>
<p>Un <strong>article de fond</strong> (ein Hintergrundartikel) ne se contente pas de rapporter un fait : il l'analyse, le met en perspective et défend souvent une position. Pour le comprendre au B2, on repère trois choses : la <strong>thèse</strong> (die These, l'idée principale défendue), les <strong>arguments</strong> (die Argumente) et les <strong>exemples/chiffres</strong> (die Beispiele, die Zahlen).</p>
<div class="tip">Méthode de lecture : (1) lis le <strong>titre</strong> et le <strong>chapeau</strong> pour l'idée globale ; (2) repère les <strong>connecteurs logiques</strong> (deshalb, jedoch, außerdem) qui structurent le raisonnement ; (3) ne bloque pas sur chaque mot inconnu — devine par le contexte.</p></div>
<h3>2. Les connecteurs du raisonnement</h3>
<pre class="pseudo">deshalb / daher      c'est pourquoi
außerdem             de plus
jedoch / allerdings  cependant
folglich             par conséquent
zum Beispiel         par exemple
im Gegensatz dazu    au contraire (de cela)
laut (+ datif)       selon</pre>
<div class="warn">Après <strong>deshalb</strong>, <strong>außerdem</strong>, <strong>folglich</strong> en tête de phrase, il y a <strong>inversion</strong> : « Deshalb <strong>steigt</strong> die Nachfrage. » (verbe en 2e position). C'est une constante de l'allemand.</p></div>
<h3>3. Le vocabulaire de l'analyse</h3>
<pre class="pseudo">die Ursache          la cause
die Folge            la conséquence
die Entwicklung      l'évolution
die Herausforderung  le défi
zunehmen / abnehmen  augmenter / diminuer
steigen / sinken     monter / baisser
betreffen            concerner
sich auswirken auf   avoir des répercussions sur</pre>
<h3>4. L'article à lire</h3>
<p>Voici un article de fond sur le télétravail et les villes. Lis-le lentement, en repérant la thèse et les arguments (le vocabulaire d'aide est donné après).</p>
<p><strong>Leere Büros, lebendige Dörfer? Wie das Homeoffice unsere Städte verändert.</strong></p>
<p>Seit der Pandemie hat sich die Arbeitswelt tiefgreifend gewandelt. Millionen Menschen arbeiten heute zumindest teilweise von zu Hause. Laut einer aktuellen Studie möchten über 60 Prozent der Beschäftigten das Homeoffice beibehalten. Diese Entwicklung hat jedoch Folgen, die weit über den einzelnen Arbeitsplatz hinausgehen.</p>
<p>In vielen Großstädten stehen ganze Bürogebäude teilweise leer. Die Nachfrage nach Büroflächen ist deutlich gesunken. Deshalb überlegen einige Stadtplaner, leere Büros in Wohnungen umzuwandeln. Das könnte helfen, die Wohnungsnot zu lindern, die viele Zentren seit Jahren belastet.</p>
<p>Gleichzeitig profitieren kleinere Städte und Dörfer. Wer nicht mehr täglich pendeln muss, kann weiter draußen wohnen, wo die Mieten günstiger und die Wohnungen größer sind. Manche Gemeinden auf dem Land verzeichnen zum ersten Mal seit Jahrzehnten wieder Zuwachs. Allerdings warnen Kritiker: Ohne schnelles Internet und gute Verkehrsanbindung bleibt dieser Traum eine Illusion.</p>
<p>Auch die Innenstädte verändern sich. Weniger Pendler bedeuten weniger Kundschaft für Cafés, Läden und Restaurants im Zentrum. Manche Geschäfte mussten bereits schließen. Andererseits entstehen in den Wohnvierteln neue kleine Betriebe, die von den Menschen leben, die nun tagsüber zu Hause sind.</p>
<p>Zusammenfassend lässt sich sagen: Das Homeoffice ist nicht nur eine Frage der Arbeitsorganisation. Es formt langfristig, wie und wo wir leben. Die Städte der Zukunft werden anders aussehen als die von heute.</p>
<pre class="pseudo">tiefgreifend        profond(ément)      sich wandeln    évoluer
die Beschäftigten   les salariés        beibehalten     conserver
hinausgehen über    dépasser            leer stehen     rester vide
die Nachfrage       la demande          umwandeln       transformer
die Wohnungsnot     la crise du logement  lindern       atténuer
pendeln             faire la navette    die Miete       le loyer
der Zuwachs         la croissance/hausse  die Anbindung transport, liaison
die Kundschaft      la clientèle        der Betrieb     l'entreprise, le commerce
zusammenfassend     en résumé           langfristig     à long terme</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une « These » dans un article de fond ?", opts: ["un exemple", "l'idée principale défendue", "un chiffre", "un titre"], a: 1, exp: "die These = la thèse, l'idée centrale que l'article défend." },
    { type: "qcm", q: "Que signifie le connecteur « deshalb » ?", opts: ["cependant", "c'est pourquoi", "par exemple", "selon"], a: 1, exp: "deshalb / daher = c'est pourquoi (conséquence), avec inversion." },

    { type: "input", q: "Complète : « Die Nachfrage nach Büroflächen ist deutlich ___. » (participe de sinken = baisser)", a: ["gesunken"], ph: "participe passé", exp: "sinken → gesunken (baisser) ; auxiliaire sein." },
    { type: "qcm", q: "Quel avantage les petites villes tirent-elles du télétravail ?", opts: ["plus de touristes", "des habitants qui n'ont plus à faire la navette y vivent", "des impôts plus bas", "de nouveaux stades"], a: 1, exp: "« Wer nicht mehr pendeln muss, kann weiter draußen wohnen »." },
    { type: "qcm", q: "Que craignent les critiques concernant l'exode vers la campagne ?", opts: ["trop de bruit", "sans internet rapide ni bons transports, le rêve reste une illusion", "trop de nouveaux habitants", "la hausse des impôts"], a: 1, exp: "« Ohne schnelles Internet und gute Verkehrsanbindung bleibt dieser Traum eine Illusion »." },
    { type: "input", q: "Complète : « Weniger Pendler bedeuten weniger ___ für Cafés. » (clientèle)", a: ["Kundschaft"], ph: "nom", exp: "die Kundschaft = la clientèle." },
    { type: "qcm", q: "Que signifie « die Folge » ?", opts: ["la cause", "la conséquence", "le défi", "le loyer"], a: 1, exp: "die Folge = la conséquence ; die Ursache = la cause." },
    { type: "qcm", q: "Que veut dire « pendeln » ?", opts: ["travailler à domicile", "faire la navette (domicile-travail)", "déménager", "démissionner"], a: 1, exp: "pendeln = faire la navette ; der Pendler = le navetteur." },
    { type: "vf", q: "L'article conclut que le télétravail n'est qu'une simple question d'organisation du travail.", a: false, exp: "Au contraire : « nicht nur eine Frage der Arbeitsorganisation » — il façonne aussi où et comment on vit." },
    { type: "qcm", q: "Quelle est la THÈSE globale de l'article ?", opts: ["Le télétravail doit être interdit", "Le télétravail transforme durablement nos villes et nos modes de vie", "Les bureaux vont bientôt être pleins", "La campagne va se vider"], a: 1, exp: "L'article défend l'idée que le Homeoffice « formt langfristig, wie und wo wir leben »." },
    { type: "input", q: "Quel mot allemand du texte signifie « en résumé » (marque la conclusion) ?", a: ["zusammenfassend"], ph: "un mot", exp: "« Zusammenfassend lässt sich sagen... » introduit la conclusion." }
  ],
  final: {
    title: "Exercice final — Die Kernaussage erkennen",
    intro: `<p>Relis le dernier paragraphe de l'article, qui contient la conclusion, puis réponds.</p>
<pre class="pseudo">Zusammenfassend lässt sich sagen: Das Homeoffice ist nicht nur
eine Frage der Arbeitsorganisation. Es formt langfristig, wie und
wo wir leben. Die Städte der Zukunft werden anders aussehen als
die von heute. Die Politik muss sich deshalb frühzeitig auf diese
Veränderungen einstellen, statt ihnen nur hinterherzulaufen.</pre>
<p>(die Kernaussage = le message clé · sich einstellen auf = s'adapter à · frühzeitig = à temps · hinterherlaufen = courir après)</p>`,
    questions: [
      { type: "qcm", q: "Selon la conclusion, le télétravail est…", opts: ["une simple question technique", "bien plus qu'une question d'organisation du travail", "un phénomène temporaire", "une mode passagère"], a: 1, exp: "« nicht nur eine Frage der Arbeitsorganisation »." },
      { type: "vf", q: "L'auteur pense que les villes du futur ressembleront à celles d'aujourd'hui.", a: false, exp: "« werden anders aussehen als die von heute » — elles seront différentes." },
      { type: "qcm", q: "Que devrait faire la politique selon l'auteur ?", opts: ["ignorer le phénomène", "s'adapter à temps à ces changements", "interdire le télétravail", "attendre dix ans"], a: 1, exp: "« Die Politik muss sich deshalb frühzeitig ... einstellen »." },
      { type: "input", q: "Quel connecteur logique justifie l'action de la politique dans ce paragraphe ?", a: ["deshalb", "Deshalb"], ph: "un mot", exp: "« muss sich deshalb ... einstellen » : deshalb = c'est pourquoi." },
      { type: "qcm", q: "L'expression « statt ihnen nur hinterherzulaufen » critique quelle attitude ?", opts: ["anticiper", "subir passivement les changements au lieu de les devancer", "investir", "consulter les citoyens"], a: 1, exp: "hinterherlaufen = courir après ; il faut anticiper plutôt que subir." }
    ],
    solution: `<p>La conclusion résume la thèse : le télétravail n'est <strong>pas seulement</strong> une question d'organisation du travail (« nicht nur eine Frage der Arbeitsorganisation ») ; il façonne durablement <em>où</em> et <em>comment</em> nous vivons. Les villes de demain seront <strong>différentes</strong> de celles d'aujourd'hui, et la politique doit s'y adapter à temps (« frühzeitig einstellen ») plutôt que de subir les changements (« statt ihnen nur hinterherzulaufen »).</p>
<p>Pour saisir la Kernaussage d'un article, concentre-toi sur le paragraphe de conclusion et les connecteurs comme <strong>zusammenfassend</strong> (en résumé) et <strong>deshalb</strong> (c'est pourquoi).</p>`
  }
};
