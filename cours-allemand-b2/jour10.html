<script>
var DAY = {
  num: 10,
  title: "Collocations et nuances de vocabulaire",
  subtitle: "Ces mots qui vont ensemble : parler comme un natif, pas comme un dictionnaire.",
  theory: `
<h3>1. Qu'est-ce qu'une collocation ?</h3>
<p>Une <strong>collocation</strong> (Kollokation) est une association de mots qui « sonne juste » en allemand, même si une autre combinaison serait grammaticalement correcte. On dit <em>eine Entscheidung <strong>treffen</strong></em> (prendre une décision), pas <em>machen</em>. Connaître ces associations distingue un B2 solide d'un débutant qui traduit mot à mot.</p>
<pre class="pseudo">eine Entscheidung treffen        prendre une décision
eine Frage stellen               poser une question
einen Fehler machen              faire une erreur
Maßnahmen ergreifen              prendre des mesures
Rücksicht nehmen (auf + Akk.)    tenir compte de / ménager
Kritik üben (an + Dativ)         formuler une critique</pre>
<div class="warn">Le piège du francophone : traduire « faire » par machen partout. Or on <strong>trifft</strong> une décision, on <strong>stellt</strong> une question, on <strong>ergreift</strong> des mesures. Le verbe change selon le nom.</p></div>
<h3>2. Les Funktionsverbgefüge (verbes supports)</h3>
<p>Ce sont des locutions où un verbe « vide » (bringen, kommen, stellen, geraten...) porte un nom qui contient le vrai sens. Très fréquent à l'écrit soigné :</p>
<pre class="pseudo">in Frage stellen        remettre en question   (= bezweifeln)
zur Verfügung stellen   mettre à disposition
in Betracht ziehen      prendre en considération
Berücksichtigung finden être pris en compte
zum Ausdruck bringen    exprimer               (= ausdrücken)
in Kraft treten         entrer en vigueur</pre>
<h3>3. Nuances : des synonymes qui ne sont pas interchangeables</h3>
<pre class="pseudo">bekommen / erhalten / kriegen  = recevoir
   bekommen (neutre), erhalten (soutenu), kriegen (familier)
sagen / erzählen / mitteilen  = dire / raconter / communiquer
   erzählen (une histoire), mitteilen (une information officielle)
ändern / verändern / wechseln = changer
   ändern (modifier), verändern (transformer), wechseln (échanger, remplacer)
sehen / schauen / gucken      = voir / regarder / mater (familier)</pre>
<div class="tip">Le registre est décisif : <em>kriegen</em> et <em>gucken</em> sont familiers, <em>erhalten</em> et <em>betrachten</em> sont soutenus. Choisir le bon synonyme selon la situation, c'est la marque du B2.</div>
<h3>4. Les nuances de sens proches</h3>
<pre class="pseudo">kennen (connaître qqn/qqch par expérience) vs wissen (savoir un fait)
   Ich kenne ihn.  Je le connais.   Ich weiß es.  Je le sais.
legen / stellen / setzen (poser) selon la position finale de l'objet
   legen (à plat), stellen (debout), setzen (assis/placer)
merken (remarquer) vs bemerken (faire une remarque, constater)</pre>
<h3>5. Enrichir : adjectif + nom qui vont ensemble</h3>
<pre class="pseudo">ein triftiger Grund       une raison valable
ein herber Verlust        une perte cuisante
strenge Maßnahmen         des mesures sévères
eine rege Diskussion      une discussion animée
tiefe Trauer              un profond chagrin
großes Aufsehen erregen   faire grand bruit / sensation</pre>
<div class="tip">Apprends le vocabulaire par <strong>blocs</strong>, pas mot à mot : mémorise <em>eine Entscheidung treffen</em> d'un seul tenant. Ton allemand gagnera aussitôt en naturel et en précision.</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « prendre une décision » en allemand ?", opts: ["eine Entscheidung machen", "eine Entscheidung treffen", "eine Entscheidung nehmen", "eine Entscheidung tun"], a: 1, exp: "La collocation correcte est eine Entscheidung treffen." },
    { type: "input", q: "Complète la collocation : « eine Frage ___ » (poser une question)", a: ["stellen"], ph: "verbe", exp: "eine Frage stellen = poser une question." },
    { type: "qcm", q: "« prendre des mesures » se dit…", opts: ["Maßnahmen machen", "Maßnahmen ergreifen", "Maßnahmen geben", "Maßnahmen setzen"], a: 1, exp: "Maßnahmen ergreifen / treffen = prendre des mesures." },
    { type: "input", q: "Complète : « einen Fehler ___ » (faire une erreur)", a: ["machen"], ph: "verbe", exp: "Ici c'est bien machen : einen Fehler machen." },
    { type: "qcm", q: "Que signifie « etwas in Frage stellen » ?", opts: ["poser une question", "remettre en question", "répondre", "oublier"], a: 1, exp: "in Frage stellen = remettre en question (= bezweifeln)." },
    { type: "input", q: "Complète le Funktionsverbgefüge : « zur Verfügung ___ » (mettre à disposition)", a: ["stellen"], ph: "verbe", exp: "zur Verfügung stellen = mettre à disposition." },
    { type: "qcm", q: "Parmi bekommen / erhalten / kriegen, lequel est FAMILIER ?", opts: ["bekommen", "erhalten", "kriegen", "aucun"], a: 2, exp: "kriegen est familier ; erhalten est soutenu ; bekommen neutre." },
    { type: "qcm", q: "Quelle différence entre « kennen » et « wissen » ?", opts: ["aucune", "kennen = connaître (qqn/qqch), wissen = savoir (un fait)", "kennen = savoir un fait", "wissen = connaître une personne"], a: 1, exp: "Ich kenne ihn (je le connais) ; Ich weiß es (je le sais)." },
    { type: "input", q: "Complète : « in Kraft ___ » (entrer en vigueur, pour une loi)", a: ["treten"], ph: "verbe", exp: "in Kraft treten = entrer en vigueur." },
    { type: "qcm", q: "Pour « poser un objet debout » (une bouteille sur la table), quel verbe ?", opts: ["legen", "stellen", "setzen", "hängen"], a: 1, exp: "stellen = poser debout ; legen = à plat ; setzen = asseoir/placer." },
    { type: "input", q: "Complète : « Kritik ___ (an + Dativ) » (formuler une critique)", a: ["üben"], ph: "verbe", exp: "Kritik üben an + Dativ = critiquer." },
    { type: "qcm", q: "Lequel emploierais-tu à l'écrit soutenu pour « recevoir » ?", opts: ["kriegen", "erhalten", "abkriegen", "wegkriegen"], a: 1, exp: "erhalten est le registre soutenu de « recevoir »." },
    { type: "vf", q: "« eine Entscheidung machen » est la formulation correcte en allemand.", a: false, exp: "Non : on dit eine Entscheidung TREFFEN. machen serait une traduction fautive du français." },
    { type: "qcm", q: "« ein triftiger Grund » signifie…", opts: ["une raison fausse", "une raison valable / solide", "une raison secrète", "une raison drôle"], a: 1, exp: "triftig se colloque avec Grund : une raison valable." },
    { type: "input", q: "Complète le Funktionsverbgefüge : « etwas in Betracht ___ » (prendre en considération)", a: ["ziehen"], ph: "verbe", exp: "in Betracht ziehen = prendre en considération." }
  ],
  final: {
    title: "Exercice final — Ein Sitzungsprotokoll",
    intro: `<p>Voici un extrait de compte rendu de réunion, riche en collocations. Analyse-les.</p>
<pre class="pseudo">In der heutigen Sitzung wurden mehrere wichtige Entscheidungen getroffen. Zunächst
stellte die Leiterin die neue Strategie vor und beantwortete zahlreiche Fragen.
Mehrere Teilnehmer übten Kritik an dem knappen Zeitplan. Daraufhin wurde beschlossen,
zusätzliche Maßnahmen zu ergreifen. Die Geschäftsführung stellte weitere Mittel zur
Verfügung. Ein Vorschlag zur Digitalisierung fand große Zustimmung und wird in Betracht
gezogen. Die neuen Regeln treten im nächsten Monat in Kraft. Zum Schluss brachte der
Betriebsrat seine Bedenken zum Ausdruck.</pre>
<p>(die Sitzung = la réunion · die Zustimmung = l'approbation · die Bedenken = les réserves)</p>`,
    questions: [
      { type: "input", q: "Relève le verbe de la collocation « Entscheidungen ___ » (participe : ...wurden getroffen).", a: ["getroffen"], ph: "participe", exp: "eine Entscheidung treffen → wurden Entscheidungen getroffen." },
      { type: "qcm", q: "« Mehrere Teilnehmer übten Kritik an dem Zeitplan » signifie…", opts: ["ils ont approuvé le calendrier", "ils ont critiqué le calendrier", "ils ont ignoré le calendrier", "ils ont fixé le calendrier"], a: 1, exp: "Kritik üben an + Dativ = critiquer." },
      { type: "input", q: "Relève le verbe : « zusätzliche Maßnahmen zu ___ » (prendre des mesures).", a: ["ergreifen"], ph: "verbe", exp: "Maßnahmen ergreifen = prendre des mesures." },
      { type: "qcm", q: "« Die neuen Regeln treten im nächsten Monat in Kraft » signifie…", opts: ["les règles sont annulées", "les règles entrent en vigueur le mois prochain", "les règles sont critiquées", "les règles sont discutées"], a: 1, exp: "in Kraft treten = entrer en vigueur." },
      { type: "vf", q: "« brachte seine Bedenken zum Ausdruck » est un Funktionsverbgefüge signifiant « exprima ses réserves ».", a: true, exp: "zum Ausdruck bringen = exprimer ; ici avec Bedenken (réserves)." }
    ],
    solution: `<p>Ce compte rendu est un florilège de collocations et de Funktionsverbgefüge, marques du style administratif soigné : <strong>Entscheidungen treffen</strong>, <strong>Fragen beantworten</strong>, <strong>Kritik üben an</strong>, <strong>Maßnahmen ergreifen</strong>, <strong>Mittel zur Verfügung stellen</strong>, <strong>Zustimmung finden</strong>, <strong>in Betracht ziehen</strong>, <strong>in Kraft treten</strong>, <strong>zum Ausdruck bringen</strong>.</p>
<p>Aucune de ces expressions ne se traduit mot à mot depuis le français. Le réflexe B2 : apprendre le nom AVEC son verbe support, comme un bloc indissociable.</p>`
  }
};
</script>
