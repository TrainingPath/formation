<script>
var DAY = {
  num: 21,
  title: "Le vocabulaire de l'actualité et de la société",
  subtitle: "Parler de politique, d'économie, d'environnement et de société en allemand.",
  theory: `
<h3>1. Les grands domaines de l'actualité</h3>
<p>Pour comprendre les journaux et en discuter au B2, il faut maîtriser le lexique des grands thèmes. Voici les mots-clés par domaine.</p>
<pre class="pseudo">POLITIK (politique)
die Regierung        le gouvernement    die Wahl        l'élection
der Abgeordnete      le député          die Partei      le parti
das Gesetz           la loi             die Mehrheit    la majorité
abstimmen            voter (sur un texte)  wählen       élire</pre>
<pre class="pseudo">WIRTSCHAFT (économie)
die Wirtschaft       l'économie         die Steuer      l'impôt
die Arbeitslosigkeit le chômage         das Wachstum    la croissance
die Inflation        l'inflation        der Verbraucher le consommateur
das Unternehmen      l'entreprise       der Markt       le marché</pre>
<pre class="pseudo">UMWELT (environnement)
der Klimawandel      le changement climatique  die Umwelt   l'environnement
die Erderwärmung     le réchauffement          der CO2-Ausstoß  les émissions de CO2
erneuerbare Energien les énergies renouvelables  nachhaltig  durable
der Umweltschutz     la protection de l'env.   verschmutzen  polluer</pre>
<pre class="pseudo">GESELLSCHAFT (société)
die Gesellschaft     la société         die Gleichheit   l'égalité
die Bildung          l'éducation        die Integration  l'intégration
die Migration        la migration       die Armut        la pauvreté
die Ungleichheit     l'inégalité        die Vielfalt     la diversité</pre>
<h3>2. Les verbes de l'actualité</h3>
<pre class="pseudo">fordern           exiger, réclamer    beschließen    décider (une loi)
kritisieren       critiquer           unterstützen   soutenir
sich engagieren   s'engager           protestieren   manifester
diskutieren über  débattre de         verhandeln     négocier
sich verschärfen  s'aggraver          sich verbessern s'améliorer</pre>
<div class="tip">Beaucoup de noms de l'actualité sont des <strong>mots composés</strong> (Komposita) : <em>Klima</em> + <em>Wandel</em> = Klimawandel. Décompose-les pour deviner le sens : <em>Arbeit</em> (travail) + <em>Losigkeit</em> (absence) = chômage. C'est la logique de l'allemand !</p></div>
<h3>3. Nuancer un chiffre ou une tendance</h3>
<pre class="pseudo">Die Zahl steigt / sinkt.        Le chiffre monte / baisse.
Die Arbeitslosigkeit nimmt zu.  Le chômage augmente.
Der Anteil beträgt 30 Prozent.  La part s'élève à 30 %.
Im Vergleich zum Vorjahr ...     Par rapport à l'année précédente ...
Tendenz steigend.               Tendance à la hausse.</pre>
<h3>4. Débattre d'un enjeu de société</h3>
<pre class="pseudo">Das ist ein wichtiges Thema.       C'est un sujet important.
Die Meinungen gehen auseinander.   Les avis divergent.
Man muss Maßnahmen ergreifen.      Il faut prendre des mesures.
Es besteht Handlungsbedarf.        Il y a besoin d'agir.
Das betrifft uns alle.             Cela nous concerne tous.</pre>
<div class="warn">« Maßnahmen ergreifen » (prendre des mesures) et « Handlungsbedarf » (besoin d'agir) sont des expressions de presse très fréquentes. Retiens-les telles quelles : elles font tout de suite « niveau avancé ».</p></div>
<h3>5. Un court texte d'actualité</h3>
<pre class="pseudo">Laut dem neuen Bericht hat sich der CO2-Ausstoß im Verkehr
kaum verringert. Umweltverbände fordern deshalb strengere Gesetze
und mehr Investitionen in erneuerbare Energien. Die Regierung
verspricht Maßnahmen, doch die Opposition kritisiert, dass diese
zu spät kommen. „Es besteht dringender Handlungsbedarf", so ein
Sprecher. Die Meinungen darüber, wie schnell man handeln soll,
gehen jedoch weit auseinander.</pre>
<p>(der Bericht = le rapport · sich verringern = diminuer · der Verband = l'association/le syndicat · streng = strict · versprechen = promettre · der Sprecher = le porte-parole · dringend = urgent)</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « die Regierung » ?", opts: ["l'élection", "le gouvernement", "le parti", "la loi"], a: 1, exp: "die Regierung = le gouvernement ; die Wahl = l'élection." },
    { type: "qcm", q: "« die Arbeitslosigkeit » désigne…", opts: ["le marché du travail", "le chômage", "la croissance", "l'impôt"], a: 1, exp: "Arbeit + los + igkeit = état sans travail = le chômage." },
    { type: "input", q: "Décompose et traduis : « der Klimawandel » = le ___ climatique.", a: ["changement", "changement climatique"], ph: "un mot", exp: "Klima + Wandel = changement climatique." },
    { type: "qcm", q: "Que veut dire « nachhaltig » ?", opts: ["rapide", "durable", "cher", "dangereux"], a: 1, exp: "nachhaltig = durable, soutenable (Nachhaltigkeit = durabilité)." },
    { type: "qcm", q: "« erneuerbare Energien » se traduit par…", opts: ["énergies fossiles", "énergies renouvelables", "énergie nucléaire", "économies d'énergie"], a: 1, exp: "erneuerbar = renouvelable." },
    { type: "input", q: "Complète : « Umweltverbände ___ strengere Gesetze. » (exiger, réclamer)", a: ["fordern"], ph: "verbe", exp: "fordern = exiger, réclamer." },
    { type: "qcm", q: "Que signifie « die Steuer » ?", opts: ["la loi", "l'impôt / la taxe", "la croissance", "le marché"], a: 1, exp: "die Steuer = l'impôt ; Steuern zahlen = payer des impôts." },
    { type: "qcm", q: "« Die Meinungen gehen auseinander » signifie…", opts: ["tout le monde est d'accord", "les avis divergent", "personne ne parle", "le débat est clos"], a: 1, exp: "auseinandergehen = diverger ; les opinions se séparent." },
    { type: "input", q: "Complète : « Man muss Maßnahmen ___. » (prendre — verbe figé)", a: ["ergreifen"], ph: "verbe", exp: "Maßnahmen ergreifen = prendre des mesures." },
    { type: "qcm", q: "Que veut dire « der Verbraucher » ?", opts: ["le producteur", "le consommateur", "le vendeur", "l'employeur"], a: 1, exp: "der Verbraucher = le consommateur ; verbrauchen = consommer." },
    { type: "qcm", q: "« Im Vergleich zum Vorjahr » veut dire…", opts: ["dans dix ans", "par rapport à l'année précédente", "chaque année", "l'an prochain"], a: 1, exp: "der Vergleich = la comparaison ; das Vorjahr = l'année précédente." },
    { type: "vf", q: "« Es besteht Handlungsbedarf » signifie qu'il y a un besoin d'agir.", a: true, exp: "der Handlungsbedarf = le besoin d'action/d'agir." },
    { type: "qcm", q: "Que signifie « sich verschärfen » (ex. : die Krise verschärft sich) ?", opts: ["s'améliorer", "s'aggraver", "disparaître", "se stabiliser"], a: 1, exp: "sich verschärfen = s'aggraver, s'intensifier ; contraire : sich verbessern." },
    { type: "qcm", q: "Dans le texte, que reproche l'opposition au gouvernement ?", opts: ["d'agir trop vite", "que ses mesures arrivent trop tard", "de ne rien promettre", "de baisser les impôts"], a: 1, exp: "« kritisiert, dass diese zu spät kommen »." },
    { type: "input", q: "Quel mot du texte signifie « urgent » ?", a: ["dringend", "dringenden", "dringender"], ph: "un adjectif", exp: "« dringender Handlungsbedarf » = besoin urgent d'agir." }
  ],
  final: {
    title: "Exercice final — Ein Nachrichtentext",
    intro: `<p>Lis cet extrait d'actualité, puis réponds.</p>
<pre class="pseudo">Die Zahl der Menschen, die von Armut betroffen sind, ist im
vergangenen Jahr leicht gestiegen. Laut einem Bericht der Regierung
lebt inzwischen jeder sechste Bürger an der Armutsgrenze.
Sozialverbände fordern höhere Löhne und mehr Unterstützung für
Familien. Die Regierung verweist auf das Wirtschaftswachstum und
verspricht, dass sich die Lage bald verbessern werde. Kritiker
bezweifeln das jedoch. „Wachstum allein löst das Problem nicht",
sagte eine Expertin. Die Debatte über soziale Gerechtigkeit dürfte
in den kommenden Monaten weitergehen.</pre>
<p>(betroffen sein von = être touché par · die Armutsgrenze = le seuil de pauvreté · der Lohn = le salaire · verweisen auf = renvoyer à, invoquer · bezweifeln = mettre en doute · die Gerechtigkeit = la justice)</p>`,
    questions: [
      { type: "qcm", q: "Comment a évolué le nombre de personnes touchées par la pauvreté ?", opts: ["il a fortement baissé", "il a légèrement augmenté", "il est resté stable", "il a disparu"], a: 1, exp: "« ist im vergangenen Jahr leicht gestiegen »." },
      { type: "input", q: "Quelle proportion de citoyens vit au seuil de pauvreté ?", a: ["jeder sechste", "jeder sechste Bürger", "un sur six", "1 sur 6"], ph: "proportion", exp: "« jeder sechste Bürger an der Armutsgrenze »." },
      { type: "qcm", q: "Que réclament les associations sociales ?", opts: ["moins d'impôts", "des salaires plus élevés et plus d'aide aux familles", "la fin des aides", "plus de croissance uniquement"], a: 1, exp: "« fordern höhere Löhne und mehr Unterstützung für Familien »." },
      { type: "vf", q: "L'experte pense que la croissance seule suffit à résoudre le problème.", a: false, exp: "« Wachstum allein löst das Problem nicht »." },
      { type: "qcm", q: "Que prévoit l'auteur pour les mois à venir ?", opts: ["la fin du débat", "que le débat sur la justice sociale va continuer", "une baisse de la pauvreté certaine", "de nouvelles élections"], a: 1, exp: "« Die Debatte ... dürfte ... weitergehen »." }
    ],
    solution: `<p>Le texte annonce une <strong>légère hausse</strong> de la pauvreté : un citoyen sur six vit au seuil de pauvreté (an der Armutsgrenze). Les associations sociales <strong>réclament</strong> (fordern) des salaires plus élevés et plus d'aide aux familles. Le gouvernement <strong>invoque</strong> (verweist auf) la croissance et promet une amélioration, mais des critiques en doutent : « Wachstum allein löst das Problem nicht ». L'auteur pense que le débat sur la <strong>justice sociale</strong> (soziale Gerechtigkeit) va se poursuivre.</p>
<p>Repère le lexique clé de l'actualité sociale : <em>Armut, fordern, Unterstützung, Wachstum, Gerechtigkeit</em>. Note aussi le <strong>Konjunktiv I</strong> du discours rapporté (« verbessern werde ») et « dürfte » qui exprime une probabilité — deux marques du registre journalistique.</p>`
  }
};
</script>

    hints: [
      "Introduis le thème : « Ein wichtiges Thema unserer Zeit ist ... ».",

    solution: "Ein wichtiges Thema unserer Zeit ist der Klimawandel. Laut mehreren Berichten hat sich der CO2-Ausstoß im Verkehr in den letzten Jahren kaum verringert. Im Vergleich zum Vorjahr sind die Temperaturen erneut gestiegen; Tendenz steigend. Meiner Meinung nach besteht dringender Handlungsbedarf, denn dieses Problem betrifft uns alle. Die Regierung sollte deshalb mehr in erneuerbare Energien investieren und strengere Gesetze beschließen. Außerdem muss man die Verbraucher unterstützen, damit nachhaltiges Verhalten günstiger wird. Zwar kritisieren manche die Kosten solcher Maßnahmen, aber langfristig ist Nichtstun viel teurer. Zum Glück engagieren sich immer mehr Menschen für den Umweltschutz. Wenn Politik und Gesellschaft zusammenarbeiten, können wir die Erderwärmung noch bremsen.\n\n(Traduction : Un sujet important de notre époque est le changement climatique. Selon plusieurs rapports, les émissions de CO2 dans les transports n'ont guère diminué ces dernières années. Par rapport à l'année précédente, les températures ont de nouveau augmenté ; tendance à la hausse. À mon avis, il y a un besoin urgent d'agir, car ce problème nous concerne tous. Le gouvernement devrait donc investir davantage dans les énergies renouvelables et adopter des lois plus strictes. De plus, il faut soutenir les consommateurs pour que les comportements durables deviennent moins chers. Certes, certains critiquent le coût de telles mesures, mais à long terme ne rien faire coûte bien plus cher. Heureusement, de plus en plus de gens s'engagent pour la protection de l'environnement. Si la politique et la société coopèrent, nous pouvons encore freiner le réchauffement.)",
    note: "Réutilise consciemment le lexique de l'actualité (Handlungsbedarf, Maßnahmen ergreifen, erneuerbare Energien, betreffen). Les mots composés te font gagner en précision : décompose-les si tu hésites sur le sens." }
  ]
};
</script>
