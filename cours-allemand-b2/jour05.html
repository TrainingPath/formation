var DAY = {

  title: "Les constructions participiales",
  subtitle: "Condenser une relative en un participe placé devant le nom : le style écrit soigné.",
  theory: `
<h3>1. Deux participes, deux sens</h3>
<p>L'allemand a deux participes, exactement comme le français :</p>
<pre class="pseudo">Partizip I (présent) : infinitif + d      → lachend (en riant / riant)
Partizip II (passé)  : ge...t / ge...en   → gekocht (cuit), gelesen (lu)</pre>
<p>Le <strong>Partizip I</strong> exprime une action <strong>simultanée et active</strong> (« qui fait »). Le <strong>Partizip II</strong> exprime une action <strong>accomplie ou passive</strong> (« qui a été fait »).</p>
<pre class="pseudo">das lachende Kind        l'enfant qui rit (Partizip I, actif)
das gekochte Ei          l'oeuf cuit (Partizip II, passif/accompli)</pre>
<h3>2. Le participe comme adjectif épithète</h3>
<p>Placé devant le nom, le participe se <strong>décline comme un adjectif</strong> :</p>
<pre class="pseudo">der schlafende Hund        le chien qui dort
ein weinendes Kind         un enfant qui pleure
die verlorene Zeit         le temps perdu
ein gut geschriebener Text un texte bien écrit</pre>
<div class="tip">Retiens : Partizip I = « en train de » (aktiv), Partizip II = « déjà fait / subi » (passiv). Le choix change complètement le sens : <em>die kochende Suppe</em> (la soupe qui bout) vs <em>die gekochte Suppe</em> (la soupe cuite).</div>
<h3>3. Le groupe participial étendu (erweitertes Partizip)</h3>
<p>C'est la vraie signature du style écrit allemand : on insère tout un complément <strong>entre l'article et le participe</strong>, condensant une relative entière.</p>
<pre class="pseudo">Relative :   der Mann, der in Berlin wohnt
Participe :  der in Berlin wohnende Mann        l'homme habitant à Berlin

Relative :   das Buch, das gestern veröffentlicht wurde
Participe :  das gestern veröffentlichte Buch   le livre publié hier</pre>
<div class="warn">Ordre à respecter : <strong>article + [compléments] + participe + nom</strong>. Le participe se colle toujours juste devant le nom. C'est déroutant à lire au début : cherche d'abord le nom, puis remonte vers le participe.</div>
<h3>4. Transformer une relative en groupe participial</h3>
<pre class="pseudo">1. Repère le verbe de la relative : wohnt, veröffentlicht wurde.
2. Actif → Partizip I (wohnend) ; passif → Partizip II (veröffentlicht).
3. Place tous les compléments entre l'article et le participe.
4. Décline le participe selon le cas du nom.</pre>
<p>Exemple : « die Kinder, die im Garten spielen » → « die im Garten spielenden Kinder » (les enfants jouant dans le jardin).</p>
<h3>5. Le participe comme complément détaché</h3>
<p>Comme en français, un participe peut ouvrir la phrase pour exprimer une circonstance :</p>
<pre class="pseudo">Im Sessel sitzend, las er die Zeitung.   Assis dans le fauteuil, il lisait le journal.
Vom Regen überrascht, liefen wir nach Hause.  Surpris par la pluie, nous avons couru chez nous.</pre>
<div class="tip">Ces constructions rendent l'écrit dense et élégant, mais restent rares à l'oral. Au B2, l'essentiel est de les <strong>comprendre</strong> en lecture et d'en produire quelques-unes à l'écrit soigné.</div>`,
  exercises: [
    { type: "qcm", q: "Le Partizip I (présent) se forme…", opts: ["ge- + radical + -t", "infinitif + d (lachen → lachend)", "avec sein", "avec würde"], a: 1, exp: "Partizip I = infinitif + d : lachend, spielend, wohnend." },
    { type: "qcm", q: "« das lachende Kind » : quel sens le Partizip I donne-t-il ?", opts: ["l'enfant qui a été fait rire", "l'enfant qui rit (action simultanée, active)", "l'enfant à faire rire", "l'enfant triste"], a: 1, exp: "Partizip I = action simultanée et active : qui rit." },
    { type: "qcm", q: "« das gekochte Ei » : quel sens le Partizip II donne-t-il ?", opts: ["l'oeuf qui cuit", "l'oeuf cuit (action accomplie / passive)", "l'oeuf à cuire", "l'oeuf cru"], a: 1, exp: "Partizip II = accompli/passif : cuit." },
    { type: "input", q: "Partizip I de schlafen dans « der ___ Hund » (le chien qui dort, décliné)", a: ["schlafende"], ph: "participe décliné", exp: "schlafen → schlafend + -e (masculin nominatif après der) = schlafende." },
    { type: "qcm", q: "Transforme « der Mann, der in Berlin wohnt » en groupe participial :", opts: ["der wohnende in Berlin Mann", "der in Berlin wohnende Mann", "der Mann in Berlin wohnend", "der in Berlin wohnend Mann"], a: 1, exp: "article + compléments + participe (décliné) + nom : der in Berlin wohnende Mann." },
    { type: "input", q: "Complète : « das gestern ___ Buch » (le livre publié hier ; Partizip II de veröffentlichen, décliné)", a: ["veröffentlichte","veroeffentlichte"], ph: "participe décliné", exp: "Passif → Partizip II veröffentlicht + -e = veröffentlichte." },
    { type: "vf", q: "Dans un groupe participial étendu, le participe se place juste devant le nom.", a: true, exp: "Ordre : article + compléments + participe + nom." },
    { type: "qcm", q: "« die kochende Suppe » et « die gekochte Suppe » : quelle différence ?", opts: ["aucune", "la première bout (en train de), la seconde est cuite (accomplie)", "la première est froide", "la seconde bout"], a: 1, exp: "Partizip I (kochend) = en train de bouillir ; Partizip II (gekocht) = déjà cuite." },
    { type: "input", q: "Transforme la relative : « die Kinder, die im Garten spielen » → « die im Garten ___ Kinder » (Partizip I décliné)", a: ["spielenden"], ph: "participe décliné", exp: "spielen → spielend + -en (pluriel) = spielenden Kinder." },
    { type: "qcm", q: "Le participe placé devant le nom se comporte comme…", opts: ["un verbe conjugué", "un adjectif épithète (il se décline)", "un adverbe", "une conjonction"], a: 1, exp: "Il prend les terminaisons de l'adjectif selon le cas et le genre." },
    { type: "qcm", q: "« Vom Regen überrascht, liefen wir nach Hause » : que signifie ce début ?", opts: ["Nous avons surpris la pluie", "Surpris par la pluie (participe détaché, circonstance)", "La pluie nous plaît", "Nous attendons la pluie"], a: 1, exp: "Participe passé détaché exprimant une circonstance : surpris par la pluie." },
    { type: "input", q: "Partizip II de verlieren dans « die ___ Zeit » (le temps perdu, décliné)", a: ["verlorene"], ph: "participe décliné", exp: "verlieren → verloren + -e = verlorene Zeit." },
    { type: "vf", q: "Les groupes participiaux étendus sont surtout un trait de l'écrit soigné, rares à l'oral courant.", a: true, exp: "On les rencontre en presse, en littérature et en langue administrative." },
    { type: "qcm", q: "Pour lire un long groupe participial, la meilleure stratégie est…", opts: ["de lire mot à mot dans l'ordre", "de repérer d'abord le nom (à la fin), puis de remonter vers le participe et ses compléments", "de l'ignorer", "de le traduire en anglais"], a: 1, exp: "Le nom vient en dernier ; on remonte ensuite vers le participe qui le qualifie." },
    { type: "input", q: "Complète : « ein gut ___ Text » (un texte bien écrit ; Partizip II de schreiben, décliné)", a: ["geschriebener"], ph: "participe décliné", exp: "schreiben → geschrieben + -er (masculin nominatif après ein) = geschriebener." }
  ],

    title: "Exercice final — Ein Zeitungsartikel",
    intro: `<p>Cet extrait de presse regorge de constructions participiales. Décode-les.</p>
<pre class="pseudo">Das am Montag veröffentlichte Gutachten sorgt für Aufsehen. Die von unabhängigen
Experten durchgeführte Untersuchung zeigt, dass die seit Jahren steigenden Kosten
kaum noch tragbar sind. Der von der Regierung vorgelegte Plan wird von vielen
kritisiert. Betroffen sind vor allem die in ländlichen Regionen lebenden Familien.
Die gestern begonnenen Verhandlungen sollen eine Lösung bringen. In einer Pressekonferenz
sagte die Ministerin, sie sei zuversichtlich.</pre>
<p>(das Gutachten = l'expertise · tragbar = supportable · die Verhandlung = la négociation)</p>`,
    questions: [
      { type: "qcm", q: "« Das am Montag veröffentlichte Gutachten » équivaut à quelle relative ?", opts: ["das Gutachten, das am Montag veröffentlicht", "das Gutachten, das am Montag veröffentlicht wurde", "das Gutachten, das am Montag veröffentlicht", "das Gutachten veröffentlicht am Montag"], a: 1, exp: "Partizip II passif : « das am Montag veröffentlicht wurde » (qui a été publié lundi)." },
      { type: "input", q: "Relève le participe décliné dans « die seit Jahren ___ Kosten » (Partizip I de steigen).", a: ["steigenden"], ph: "participe", exp: "steigen → steigend + -en = steigenden : les coûts qui augmentent." },
      { type: "qcm", q: "« die in ländlichen Regionen lebenden Familien » signifie…", opts: ["les familles qui vivaient à la ville", "les familles vivant dans les régions rurales", "les familles à faire vivre", "les régions rurales des familles"], a: 1, exp: "Partizip I lebend : les familles qui vivent en zone rurale." },
      { type: "input", q: "Relève le participe : « Die gestern ___ Verhandlungen » (Partizip II de beginnen, décliné).", a: ["begonnenen"], ph: "participe", exp: "beginnen → begonnen + -en = begonnenen : les négociations commencées hier." },
      { type: "vf", q: "Le groupe « Der von der Regierung vorgelegte Plan » condense une relative passive : « le plan qui a été présenté par le gouvernement ».", a: true, exp: "von + agent + Partizip II = passif condensé : présenté par le gouvernement." }
    ],
    solution: `<p>Chaque groupe participial remplace une relative entière : <strong>das am Montag veröffentlichte Gutachten</strong> (= das am Montag veröffentlicht wurde), <strong>die von Experten durchgeführte Untersuchung</strong> (= die durchgeführt wurde), <strong>die seit Jahren steigenden Kosten</strong> (= die steigen), <strong>der von der Regierung vorgelegte Plan</strong>, <strong>die in ländlichen Regionen lebenden Familien</strong>, <strong>die gestern begonnenen Verhandlungen</strong>.</p>
<p>Deux repères : Partizip I (steigend, lebend) = action active en cours ; Partizip II (veröffentlicht, durchgeführt, vorgelegt, begonnen) = action accomplie ou passive, souvent avec un agent introduit par <em>von</em>.</p>`
  }
};
