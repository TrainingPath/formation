  title: "Le registre : formel ou informel",
  subtitle: "Choisir le bon ton : du tutoiement amical au vouvoiement administratif.",
  theory: `
<h3>1. Deux mondes : du et Sie</h3>
<p>Le choix du registre commence par le pronom. <strong>du</strong> (tutoiement) marque la proximité ; <strong>Sie</strong> (vouvoiement, toujours avec majuscule) marque la distance et le respect. Mais le registre va bien au-delà du pronom : il touche le vocabulaire, les formules et la structure des phrases.</p>
<pre class="pseudo">Informel : Hey, kannst du mir kurz helfen?
Formel :   Könnten Sie mir bitte behilflich sein?
           Pourriez-vous m'aider, s'il vous plaît ?</pre>
<div class="warn">Passer trop vite au <em>du</em> avec un supérieur ou un inconnu adulte est perçu comme impoli en Allemagne. Attends que l'autre propose le tutoiement (« Wollen wir uns duzen? »).</p></div>
<h3>2. Les marqueurs du registre formel</h3>
<pre class="pseudo">- Konjunktiv II de politesse : Ich hätte gern... / Könnten Sie...
- Vocabulaire soutenu : erhalten (bekommen), benötigen (brauchen), erwerben (kaufen)
- Formules figées : Sehr geehrte Damen und Herren, Mit freundlichen Grüßen
- Style nominal et phrases complètes, pas d'abréviations
- Tournures impersonnelles : Es wäre wünschenswert, dass...</pre>
<h3>3. Les marqueurs du registre informel</h3>
<pre class="pseudo">- Particules modales : mal, halt, eben, ja, doch (Komm mal her! / Das ist halt so.)
- Vocabulaire familier : kriegen (bekommen), gucken (schauen), krass, cool
- Formules relâchées : Hi, Hallo, Tschüss, Liebe Grüße (LG), Bis dann
- Phrases courtes, ellipses : Alles klar? Passt.
- Abréviations : usw. (etc.), z.B. (par ex.)</pre>
<h3>4. Le même message, deux registres</h3>
<pre class="pseudo">Demander un délai —
Informel : Hey Tom, schaffst du das bis morgen? Sonst kein Stress.
Formel :   Sehr geehrter Herr Weber, wäre es möglich, die Frist bis morgen zu verlängern?

Refuser une invitation —
Informel : Sorry, ich kann leider nicht, hab schon was vor.
Formel :   Leider muss ich Ihre Einladung absagen, da ich bereits einen Termin habe.</pre>
<div class="tip">Le registre formel privilégie le Konjunktiv II (könnten, wäre, hätte), les questions indirectes (wäre es möglich, dass...) et l'absence de contractions ou d'anglicismes familiers. C'est la clé des e-mails professionnels et des lettres officielles.</div>
<h3>5. Les formules de correspondance</h3>
<pre class="pseudo">Ouverture formelle : Sehr geehrte Frau Müller, / Sehr geehrte Damen und Herren,
Ouverture informelle : Liebe Anna, / Hallo Tom,
Clôture formelle : Mit freundlichen Grüßen
Clôture informelle : Liebe Grüße / Viele Grüße / Bis bald
Corps formel : Ich wende mich an Sie, weil... / Ich würde mich freuen, wenn...
Corps informel : Ich schreib dir, weil... / Meld dich mal!</pre>
<div class="warn">Dans une lettre formelle, après « Sehr geehrte Frau Müller, » on met une <strong>virgule</strong> et on continue avec une <strong>minuscule</strong> à la ligne suivante : « Sehr geehrte Frau Müller, / ich schreibe Ihnen... ». Détail que les correcteurs remarquent.</p></div>`,
  exercises: [

    { type: "qcm", q: "Quelle formulation est la plus formelle pour demander de l'aide ?", opts: ["Hilf mir mal!", "Kannst du mir helfen?", "Könnten Sie mir bitte behilflich sein?", "Hilfe!"], a: 2, exp: "Konjunktiv II + Sie + bitte + vocabulaire soutenu = registre formel." },

    { type: "qcm", q: "Après « Sehr geehrte Frau Müller, » la ligne suivante commence par…", opts: ["une majuscule", "une minuscule (ich schreibe Ihnen...)", "un point", "un tiret"], a: 1, exp: "Virgule après l'appellation, puis minuscule à la ligne suivante." },
    { type: "input", q: "Donne l'abréviation familière de « Liebe Grüße » : « ___ »", a: ["LG"], ph: "sigle", exp: "LG = Liebe Grüße, clôture informelle courante (mails, SMS)." },
    { type: "qcm", q: "« Ich hätte gern eine Auskunft » plutôt que « Ich will eine Auskunft » : pourquoi ?", opts: ["c'est faux", "le Konjunktiv II adoucit et rend la demande polie/formelle", "c'est du passé", "c'est familier"], a: 1, exp: "Le Konjunktiv II de politesse est un marqueur clé du registre soutenu." },
    { type: "vf", q: "Le registre ne concerne que le choix entre du et Sie.", a: false, exp: "Il touche aussi le vocabulaire, les formules, la syntaxe et les particules." },
    { type: "input", q: "Complète la formule de politesse : « ___ Sie mir bitte helfen? » (Konjunktiv II de können)", a: ["Könnten","Koennten"], ph: "verbe", exp: "Könnten Sie... = pourriez-vous... (formel et poli)." }
  ],

    intro: `<p>La même demande (obtenir un rendez-vous) est écrite deux fois. Compare les registres.</p>
<pre class="pseudo">A) Hallo Lisa,
   sag mal, hast du nächste Woche kurz Zeit? Würd gern mal mit dir quatschen,
   wegen dem Projekt. Meld dich einfach! LG, Max

B) Sehr geehrte Frau Berger,
   ich wende mich an Sie, um einen Termin für ein persönliches Gespräch zu vereinbaren.
   Es geht um das laufende Projekt, das ich gerne mit Ihnen besprechen würde.
   Wäre Ihnen der kommende Dienstag möglich? Über eine kurze Rückmeldung würde ich

   Mit freundlichen Grüßen
   Max Schneider</pre>
<p>(vereinbaren = convenir de · die Rückmeldung = la réponse, le retour)</p>`,

      { type: "qcm", q: "Pourquoi B écrit « Wäre Ihnen der Dienstag möglich? » plutôt que « Geht Dienstag? »", opts: ["par erreur", "le Konjunktiv II (wäre) + Sie rend la demande polie et formelle", "c'est du passé", "c'est familier"], a: 1, exp: "wäre möglich + vouvoiement = politesse formelle." },
      { type: "qcm", q: "« quatschen » (message A) signifie et appartient à quel registre ?", opts: ["discuter, familier", "négocier, formel", "écrire, soutenu", "réfléchir, neutre"], a: 0, exp: "quatschen = bavarder/papoter, nettement familier." },
      { type: "vf", q: "Le message B emploie la clôture « Mit freundlichen Grüßen », adaptée à une lettre formelle.", a: true, exp: "C'est la formule de clôture soutenue standard ; A utilise « LG », informel." }
    ],
    solution: `<p>Les deux messages portent le même contenu mais tout les oppose. A est <strong>informel</strong> : tutoiement (du), verbe familier (quatschen), formules relâchées (Sag mal, Meld dich einfach), clôture LG. B est <strong>formel</strong> : vouvoiement (Sie/Ihnen), ouverture Sehr geehrte Frau Berger, Konjunktiv II de politesse (würde besprechen, wäre möglich, würde mich freuen), vocabulaire soutenu (vereinbaren, Rückmeldung), clôture Mit freundlichen Grüßen.</p>
<p>Retiens que le registre ne se limite pas au pronom : c'est un ensemble cohérent de choix (vocabulaire, formules, mode verbal) qu'il faut aligner du début à la fin du message.</p>`
  }
};
