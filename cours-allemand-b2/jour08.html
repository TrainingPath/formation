<script>
var DAY = {
  num: 8,
  title: "Les modaux au passé (hätte müssen...)",
  subtitle: "Le double infinitif : exprimer l'obligation, la possibilité et le regret au passé.",
  theory: `
<h3>1. Les verbes de modalité au Perfekt</h3>
<p>Les verbes de modalité (können, müssen, dürfen, sollen, wollen, mögen) forment leur passé de deux façons selon qu'ils sont seuls ou accompagnés d'un autre verbe.</p>
<pre class="pseudo">Modal SEUL (participe normal) :
Ich habe das gekonnt.        J'ai su faire ça / j'en ai été capable.
Ich habe das gewollt.        Je l'ai voulu.

Modal + AUTRE verbe (double infinitif) :
Ich habe das machen können.  J'ai pu faire ça.
Ich habe arbeiten müssen.    J'ai dû travailler.</pre>
<div class="warn">Quand le modal accompagne un autre verbe, on n'emploie PAS le participe (gekonnt) mais l'<strong>infinitif du modal</strong> : « machen <strong>können</strong> », « arbeiten <strong>müssen</strong> ». C'est le fameux <strong>double infinitif</strong> (Ersatzinfinitiv).</p></div>
<h3>2. Le double infinitif : structure</h3>
<pre class="pseudo">haben + [infinitif du verbe principal] + [infinitif du modal]
Ich habe    lange     warten           müssen.
            J'ai dû attendre longtemps.</pre>
<p>Les deux infinitifs vont ensemble <strong>à la fin</strong>, dans l'ordre : verbe principal, puis modal. En pratique, on préfère souvent le <strong>Präteritum</strong> des modaux, plus simple : « Ich musste lange warten. »</p>
<h3>3. Le Konjunktiv II passé des modaux : le regret et le reproche</h3>
<p>C'est l'emploi le plus utile au B2. On combine <strong>hätte + infinitif principal + infinitif du modal</strong> pour exprimer ce qu'on <strong>aurait dû / pu / voulu</strong> faire :</p>
<pre class="pseudo">Ich hätte das machen sollen.     J'aurais dû faire ça. (regret)
Ich hätte kommen können.         J'aurais pu venir. (possibilité manquée)
Du hättest fragen müssen.        Tu aurais dû demander. (reproche)
Er hätte es wissen müssen.       Il aurait dû le savoir.</pre>
<div class="tip">Nuances : <strong>sollen</strong> = « aurait dû » (conseil/morale), <strong>müssen</strong> = « aurait fallu » (nécessité), <strong>können</strong> = « aurait pu » (possibilité), <strong>dürfen</strong> = « aurait eu le droit ». À maîtriser pour exprimer regrets et reproches avec précision.</div>
<h3>4. La négation nuance le sens</h3>
<pre class="pseudo">Ich hätte das nicht sagen sollen.    Je n'aurais pas dû dire ça.
Du hättest nicht gehen dürfen.       Tu n'aurais pas eu le droit de partir.
Das hätte nicht passieren dürfen.    Ça n'aurait pas dû arriver.</pre>
<p>Attention à <strong>nicht müssen</strong> (ne pas être obligé) ≠ <strong>nicht dürfen</strong> (ne pas avoir le droit / interdiction). « Du hättest nicht kommen müssen » = tu n'étais pas obligé de venir (mais c'est gentil) ; « Du hättest nicht kommen dürfen » = tu n'aurais pas dû / eu le droit de venir.</p>
<h3>5. Place du double infinitif en subordonnée</h3>
<p>Cas particulier : en subordonnée, l'auxiliaire hätte ne va PAS à la toute fin mais se place <strong>avant</strong> le double infinitif :</p>
<pre class="pseudo">... , weil ich das hätte machen müssen.
... parce que j'aurais dû faire ça.</pre>
<div class="warn">C'est une exception : normalement le verbe conjugué termine la subordonnée, mais avec un double infinitif, <strong>hätte remonte devant les deux infinitifs</strong>. À reconnaître absolument en lecture.</p></div>`,
  exercises: [
    { type: "qcm", q: "Quand un modal accompagne un autre verbe au Perfekt, on emploie…", opts: ["le participe du modal (gekonnt)", "l'infinitif du modal (double infinitif : machen können)", "le prétérit", "le Konjunktiv I"], a: 1, exp: "Modal + autre verbe = double infinitif : ...machen können, ...arbeiten müssen." },
    { type: "qcm", q: "« J'ai dû travailler » (Perfekt avec double infinitif) :", opts: ["Ich habe arbeiten gemusst", "Ich habe arbeiten müssen", "Ich habe gearbeitet müssen", "Ich musste arbeiten gemusst"], a: 1, exp: "arbeiten (infinitif principal) + müssen (infinitif du modal) à la fin." },
    { type: "input", q: "Modal seul au Perfekt : « Ich habe das ___. » (participe de können, sans autre verbe)", a: ["gekonnt"], ph: "participe", exp: "können employé seul → participe gekonnt : Ich habe das gekonnt." },
    { type: "input", q: "Regret : « Ich ___ das machen sollen. » (auxiliaire, Konjunktiv II passé)", a: ["hätte","haette"], ph: "auxiliaire", exp: "hätte + machen + sollen = j'aurais dû faire ça." },
    { type: "qcm", q: "« Du hättest fragen müssen » exprime…", opts: ["un ordre futur", "un reproche : tu aurais dû demander", "une permission", "une certitude"], a: 1, exp: "hättest ... müssen = reproche/regret au passé." },
    { type: "qcm", q: "Quelle nuance apporte « sollen » dans « Ich hätte das machen sollen » ?", opts: ["j'aurais pu", "j'aurais dû (conseil/morale)", "j'aurais eu le droit", "j'aurais voulu"], a: 1, exp: "sollen = obligation morale : « aurais dû »." },
    { type: "input", q: "Possibilité manquée : « Ich hätte kommen ___. » (infinitif du modal « pouvoir »)", a: ["können","koennen"], ph: "modal", exp: "hätte kommen können = j'aurais pu venir." },
    { type: "vf", q: "« Du hättest nicht kommen müssen » signifie « tu n'étais pas obligé de venir ».", a: true, exp: "nicht müssen = absence d'obligation (mais l'action a eu lieu, souvent par gentillesse)." },
    { type: "qcm", q: "Différence entre « nicht müssen » et « nicht dürfen » au passé ?", opts: ["aucune", "nicht müssen = pas obligé ; nicht dürfen = interdit / pas le droit", "les deux signifient interdit", "les deux signifient obligé"], a: 1, exp: "nicht müssen = pas d'obligation ; nicht dürfen = interdiction." },
    { type: "input", q: "Reproche à soi : « Ich hätte das nicht sagen ___. » (infinitif du modal « devoir/falloir »)", a: ["sollen"], ph: "modal", exp: "Ich hätte das nicht sagen sollen = je n'aurais pas dû dire ça." },
    { type: "qcm", q: "En subordonnée avec double infinitif, où se place « hätte » ?", opts: ["à la toute fin, après les deux infinitifs", "avant les deux infinitifs (... weil ich das hätte machen müssen)", "en position 2", "il disparaît"], a: 1, exp: "Exception : hätte remonte devant le double infinitif en subordonnée." },
    { type: "input", q: "Complète : « Das hätte nicht passieren ___. » (ça n'aurait pas dû arriver ; modal « avoir le droit »)", a: ["dürfen","duerfen"], ph: "modal", exp: "hätte nicht passieren dürfen = n'aurait pas dû se produire." },
    { type: "qcm", q: "Dans le double infinitif, quel est l'ordre à la fin de phrase ?", opts: ["modal puis verbe principal", "verbe principal puis modal (warten müssen)", "les deux au participe", "peu importe"], a: 1, exp: "D'abord l'infinitif principal, puis l'infinitif du modal : warten müssen." },
    { type: "vf", q: "À l'oral, on préfère souvent le Präteritum des modaux (Ich musste warten) plutôt que le double infinitif au Perfekt.", a: true, exp: "Le Präteritum (musste, konnte, wollte) est plus simple et courant." },
    { type: "input", q: "« Il aurait dû le savoir » : « Er hätte es wissen ___. » (modal exprimant la nécessité)", a: ["müssen","muessen"], ph: "modal", exp: "hätte es wissen müssen = aurait dû le savoir (nécessité)." }
  ],
  final: {
    title: "Exercice final — Nach dem Streit",
    intro: `<p>Deux amis analysent une dispute passée. Repère les modaux au passé.</p>
<pre class="pseudo">Im Nachhinein sehe ich vieles klarer. Ich hätte ruhiger bleiben sollen, statt sofort
zu schreien. Du hättest mir zuhören müssen, bevor du geurteilt hast. Wir hätten das
Problem gemeinsam lösen können, wenn wir nicht so stur gewesen wären. Ich hätte dich
nicht so hart kritisieren dürfen. Andererseits hättest du früher etwas sagen müssen.
Vielleicht hätten wir den ganzen Streit vermeiden können. Jetzt ist es zu spät,
aber wir haben beide daraus lernen müssen.</pre>
<p>(im Nachhinein = avec le recul · stur = têtu · urteilen = juger · vermeiden = éviter)</p>`,
    questions: [
      { type: "qcm", q: "« Ich hätte ruhiger bleiben sollen » exprime…", opts: ["une permission", "un regret : j'aurais dû rester plus calme", "une obligation future", "une possibilité présente"], a: 1, exp: "hätte ... sollen = regret sur son propre comportement passé." },
      { type: "input", q: "Relève l'infinitif modal : « Du hättest mir zuhören ___ » (reproche, nécessité).", a: ["müssen","muessen"], ph: "modal", exp: "hättest ... müssen = tu aurais dû m'écouter." },
      { type: "qcm", q: "« Ich hätte dich nicht so hart kritisieren dürfen » signifie…", opts: ["j'ai eu le droit de te critiquer", "je n'aurais pas dû te critiquer si durement", "je devais te critiquer", "je peux te critiquer"], a: 1, exp: "hätte nicht ... dürfen = n'aurait pas dû / eu le droit." },
      { type: "qcm", q: "« Wir hätten das Problem gemeinsam lösen können » exprime…", opts: ["une obligation", "une possibilité manquée : nous aurions pu le résoudre ensemble", "une interdiction", "une certitude présente"], a: 1, exp: "hätten ... können = possibilité qui ne s'est pas réalisée." },
      { type: "vf", q: "« wir haben beide daraus lernen müssen » est un double infinitif au Perfekt (indicatif), signifiant « nous avons tous deux dû en tirer une leçon ».", a: true, exp: "haben + lernen + müssen = double infinitif réel (pas irréel), donc obligation qui a bien eu lieu." }
    ],
    solution: `<p>Le dialogue illustre toute la palette des modaux au passé. À l'irréel (Konjunktiv II), ils expriment regret et reproche : <strong>hätte bleiben sollen</strong> (regret), <strong>hättest zuhören müssen</strong> (reproche), <strong>hätten lösen können</strong> (possibilité manquée), <strong>hätte nicht kritisieren dürfen</strong> (« je n'aurais pas dû »).</p>
<p>À l'indicatif, le double infinitif exprime une obligation réelle : <strong>haben ... lernen müssen</strong> (« nous avons dû apprendre »). Retiens la structure invariable : hätte/haben + infinitif principal + infinitif du modal, tout à la fin.</p>`
  }
};
</script>
