  theory: `
<h3>Le projet final : lire une histoire complète</h3>
<p>Voici ton premier projet final. Pendant deux jours, tu vas lire un <strong>fait divers original</strong> d'environ deux pages, écrit spécialement pour toi en allemand authentique de niveau B2. Aujourd'hui, tu lis la <strong>première moitié</strong> : le décor, le crime et le début de l'enquête. Demain (jour 28), tu liras la suite et la résolution, puis tu analyseras l'histoire en profondeur.</p>
<div class="tip">Méthode : lis d'abord le texte en entier <strong>sans</strong> t'arrêter, pour saisir l'ensemble. Relis-le ensuite lentement en t'aidant du lexique. Ne cherche pas à tout traduire : devine par le contexte. Repère bien les <strong>détails</strong> — dans un bon fait divers, un détail apparemment anodin peut tout changer.</p></div>
<h3>Der Wein, der zu viel verriet — Teil 1</h3>
<p>In dem kleinen Weinort Rüdesheim am Rhein kennt jeder den Namen Doktor Albrecht. Der pensionierte Arzt gilt weit über die Region hinaus als einer der bedeutendsten Weinsammler Deutschlands. In seinem alten Fachwerkhaus, unter dicken Steinmauern, verbirgt sich ein Weinkeller, von dem Kenner in ganz Europa träumen.</p>
<p>Über vierzig Jahre lang hatte Albrecht Flasche für Flasche zusammengetragen. Manche seiner Weine waren so selten, dass es sie kein zweites Mal auf der Welt gab. Das Herzstück seiner Sammlung war ein Dutzend Flaschen eines legendären Jahrgangs von 1921, deren Etiketten der Winzer damals noch von Hand beschriftet hatte. Auf jedes dieser Etiketten hatte Albrecht selbst, vor vielen Jahren, mit feiner Tinte einen winzigen Stern gemalt — ein persönliches Eigentumszeichen, das kaum jemand kannte.</p>
<p>„Diese Flaschen sind für mich wie meine Kinder“, pflegte der alte Mann zu sagen. „Verkaufen würde ich sie niemals.“ Ihr Wert wurde auf mehrere Hunderttausend Euro geschätzt.</p>
<p>An einem nebligen Morgen im November begann jedoch der schlimmste Tag in Albrechts Leben. Als er wie jeden Tag in seinen Keller hinabstieg, um nach seinen Weinen zu sehen, blieb er auf der letzten Stufe wie versteinert stehen. Ganze Regale waren leer. Dort, wo am Vortag noch die wertvollsten Flaschen gelegen hatten, klaffte nun eine gähnende Lücke.</p>
<p>Mit zitternden Händen zählte er nach: Über vierzig Flaschen fehlten, darunter das gesamte Dutzend des Jahrgangs 1921. Der Dieb hatte offenbar genau gewusst, was er suchte. Er hatte nicht wahllos zugegriffen, sondern ausschließlich die teuersten und seltensten Weine mitgenommen. Billige Flaschen, die direkt daneben standen, hatte er unberührt gelassen.</p>
<p>Albrecht rief sofort die Polizei. Kurz darauf durchsuchten zwei Beamte den Keller und das ganze Haus. Doch je länger sie suchten, desto ratloser wurden sie. Es gab keine Spuren eines gewaltsamen Einbruchs. Weder ein Fenster war zerbrochen noch ein Schloss aufgebrochen. Die teure Alarmanlage, auf die Albrecht so stolz gewesen war, hatte in jener Nacht einfach nicht ausgelöst.</p>
<p>„Das ergibt keinen Sinn“, murmelte der ältere der beiden Polizisten. „Wer immer das war, er kannte sich hier bestens aus. Er wusste, wo die wertvollen Flaschen lagen, er kannte den Weg durch das Haus, und er kannte offenbar auch den Code der Alarmanlage.“ Handschuhe hatte der Täter zweifellos getragen, denn nirgends fanden sich brauchbare Fingerabdrücke.</p>
<p>In den folgenden Tagen konzentrierten sich die Ermittlungen auf das nähere Umfeld des Sammlers. Wer hatte Zugang zum Keller gehabt? Wer kannte den Code? Die Polizei befragte die Haushälterin, die seit zwanzig Jahren für Albrecht arbeitete, den Gärtner und sogar den befreundeten Sommelier, der ihn manchmal beriet. Alle wirkten ehrlich erschüttert. Niemand schien ein Motiv zu haben, und jeder hatte ein Alibi.</p>
<p>Die Wochen vergingen, und die Spur wurde immer kälter. Albrecht wurde still und traurig. Er hatte die Hoffnung fast aufgegeben, seine geliebten Weine — und vor allem den Jahrgang 1921 — jemals wiederzusehen. Was er damals noch nicht ahnte: Ausgerechnet der Dieb selbst würde bald einen entscheidenden Fehler begehen. Doch das ist der zweite Teil der Geschichte.</p>
<pre class="pseudo">der Weinort         le village viticole   der Sammler     le collectionneur
das Fachwerkhaus    la maison à colombages  verbergen     dissimuler

ahnen               se douter             einen Fehler begehen  commettre une erreur</pre>`,
  exercises: [
    { type: "qcm", q: "Qui est le personnage principal du fait divers ?", opts: ["un vigneron", "le docteur Albrecht, un célèbre collectionneur de vins", "un policier", "un sommelier voleur"], a: 1, exp: "« Doktor Albrecht ... einer der bedeutendsten Weinsammler Deutschlands »." },

    { type: "qcm", q: "Pourquoi n'a-t-on trouvé aucune empreinte digitale ?", opts: ["le voleur a tout nettoyé", "le voleur portait des gants", "la police n'a pas cherché", "il n'y avait pas de surfaces"], a: 1, exp: "« Handschuhe hatte der Täter zweifellos getragen »." },
    { type: "qcm", q: "Sur qui se concentre d'abord l'enquête ?", opts: ["des inconnus", "l'entourage proche du collectionneur (personnes ayant accès au cave/code)", "des touristes", "d'autres collectionneurs à l'étranger"], a: 1, exp: "« auf das nähere Umfeld des Sammlers ... Wer kannte den Code? »." },
    { type: "vf", q: "La gouvernante, le jardinier et le sommelier avaient tous un alibi et semblaient sincères.", a: true, exp: "« Alle wirkten ehrlich erschüttert ... jeder hatte ein Alibi »." },
    { type: "qcm", q: "Comment évolue l'enquête au fil des semaines ?", opts: ["elle est vite résolue", "la piste devient de plus en plus froide (aucun résultat)", "un suspect avoue", "le vin est retrouvé"], a: 1, exp: "« die Spur wurde immer kälter »." },
    { type: "input", q: "Complète : « Ausgerechnet der Dieb selbst würde bald einen entscheidenden ___ begehen. » (erreur)", a: ["Fehler"], ph: "un nom", exp: "einen Fehler begehen = commettre une erreur ; annonce la suite." },

    title: "Exercice final — Die Fakten von Teil 1 sichern",
    intro: `<p>Avant de découvrir la suite, assure-toi d'avoir bien compris les faits essentiels de la première partie.</p>
<pre class="pseudo">Rüdesheim am Rhein. Doktor Albrecht, ein berühmter Weinsammler,
entdeckt eines Morgens, dass über vierzig seiner wertvollsten Flaschen
gestohlen wurden — darunter zwölf einzigartige Flaschen von 1921.

von 1921 hatte Albrecht einen winzigen Stern gemalt.</pre>`,
    questions: [
      { type: "qcm", q: "Quel élément prouve que le voleur connaissait très bien les lieux ?", opts: ["il a cassé une fenêtre", "il n'a pris QUE les vins les plus chers et connaissait le code de l'alarme", "il a laissé une lettre", "il a été filmé"], a: 1, exp: "Sélection ciblée + code de l'alarme + pas d'effraction = quelqu'un d'informé." },
      { type: "vf", q: "L'alarme s'est déclenchée mais personne n'a réagi.", a: false, exp: "« hatte ... einfach nicht ausgelöst » — elle NE s'est PAS déclenchée." },

      { type: "qcm", q: "Pourquoi la police soupçonne-t-elle d'abord l'entourage ?", opts: ["par hasard", "parce que le voleur connaissait le code, les lieux et les bouteilles : ça suggère un proche", "parce qu'ils l'ont avoué", "parce qu'ils étaient absents"], a: 1, exp: "Connaissance intime des lieux et du code → suspicion d'un proche ou d'un initié." },
      { type: "qcm", q: "Quelle est l'ambiance à la fin de la partie 1 ?", opts: ["joyeuse, l'affaire est résolue", "sombre : la piste est froide, mais un retournement est annoncé", "comique", "neutre et sans enjeu"], a: 1, exp: "Piste froide, Albrecht abattu, mais « der Dieb selbst würde bald einen Fehler begehen »." }
    ],
    solution: `<p>Résumé des faits de la partie 1 : à Rüdesheim, le collectionneur <strong>Albrecht</strong> se fait voler <strong>plus de quarante bouteilles</strong>, dont les <strong>douze de 1921</strong>. Le vol est mystérieux : <strong>pas d'effraction</strong>, <strong>alarme non déclenchée</strong>, <strong>gants</strong>, et une sélection <strong>ciblée</strong> des vins les plus chers. Tout indique un <strong>initié</strong> connaissant les lieux et le code. L'enquête sur l'entourage ne donne rien ; la piste se refroidit.</p>
<p>Un <strong>détail</strong> est planté discrètement : chaque étiquette de 1921 porte un <strong>petit étoile à l'encre</strong>, marque de propriété secrète d'Albrecht. Garde-le en tête : dans un fait divers bien construit, un tel détail n'est jamais là par hasard. Rendez-vous au jour 28 pour la résolution.</p>`
