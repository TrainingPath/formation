  theory: `
<h3>La résolution, puis l'analyse</h3>
<p>Voici la <strong>seconde moitié</strong> de l'histoire commencée au jour 27. Lis d'abord la suite, puis nous analyserons l'ensemble en profondeur : sens global, implicite, chronologie et opinion. Rappelle-toi le détail planté hier — le minuscule <strong>étoile</strong> dessinée à l'encre sur chaque étiquette de 1921.</p>
<h3>Der Wein, der zu viel verriet — Teil 2</h3>
<p>Fast drei Monate nach dem Diebstahl saß eine ältere Dame namens Frau Vogel in ihrem Wohnzimmer und blätterte am Bildschirm durch eine Internet-Auktion für seltene Weine. Frau Vogel war früher Sommelière in einem berühmten Restaurant gewesen und kannte sich mit alten Jahrgängen besser aus als fast jeder andere im Land. Aus reiner Neugier klickte sie sich durch die Angebote.</p>
<p>Plötzlich stockte ihr der Atem. Ein anonymer Verkäufer bot dort ein Dutzend Flaschen des sagenhaften Jahrgangs 1921 an — jenes Jahrgangs, von dem sie wusste, dass es ihn fast nirgendwo mehr gab. Um die Echtheit zu beweisen, hatte der Verkäufer gestochen scharfe Fotos der Etiketten hochgeladen. Und genau das wurde ihm zum Verhängnis.</p>
<p>Denn auf jedem Etikett, klein und unscheinbar in der rechten Ecke, entdeckte Frau Vogel einen winzigen, von Hand gemalten Stern. Ihr Herz begann zu rasen. Vor vielen Jahren hatte ihr der alte Doktor Albrecht bei einem Abendessen stolz sein geheimes Eigentumszeichen gezeigt. „Daran“, hatte er damals gelacht, „würde ich meine Flaschen unter tausend anderen wiedererkennen.“ Es konnte kein Zufall sein.</p>
<p>Ohne zu zögern, rief Frau Vogel die Polizei an. Zunächst reagierten die Beamten zurückhaltend — schon oft hatten falsche Hinweise sie auf die falsche Fährte gelockt. Doch als sie die Fotos mit den Sternen sahen und Albrecht das Zeichen zweifelsfrei bestätigte, war klar: Das waren seine Weine.</p>
<p>Nun ging alles sehr schnell. Über die Auktionsplattform gelang es der Polizei, den anonymen Verkäufer zu identifizieren. Es handelte sich um einen gewissen Herrn Reinhardt, einen angesehenen Weinexperten aus einer Nachbarstadt. Und tatsächlich war Reinhardt kein Unbekannter: Vor Jahren war er mehrmals bei Albrecht zu Gast gewesen. Bei einem dieser Besuche, so stellte sich später heraus, hatte er heimlich beobachtet, wie der Sammler den Code seiner Alarmanlage eintippte.</p>
<p>Als die Polizei vor seiner Tür stand, brach Reinhardt schnell zusammen und gestand. Geldnot und Gier hätten ihn zu der Tat getrieben, erklärte er. Er habe geglaubt, mit seinem Fachwissen die Flaschen unauffällig verkaufen zu können. Dass ausgerechnet dieses Fachwissen — die perfekten Beweisfotos — ihn überführen würde, hatte er nicht bedacht.</p>
<p>Die gute Nachricht: Fast alle Flaschen konnten sichergestellt werden, darunter das vollständige Dutzend des Jahrgangs 1921. Wenige Tage später standen sie wieder an ihrem Platz im Keller von Doktor Albrecht. Der alte Mann hatte Tränen in den Augen, als er sie zurückbekam.</p>
<p>Reinhardt muss sich nun wegen schweren Diebstahls vor Gericht verantworten. Und Frau Vogel? Zum Dank lud Albrecht sie zu einem Abendessen ein und öffnete für sie — man mag es kaum glauben — eine der geretteten Flaschen von 1921. „Ohne Ihren scharfen Blick“, sagte er lächelnd, „wären sie für immer verloren gewesen. Manchmal entscheidet eben ein winziges Detail über alles.“</p>
<pre class="pseudo">blättern durch      feuilleter, parcourir   die Auktion    la vente aux enchères

überführen          confondre (prouver la culpabilité)  bedenken  prendre en compte

<div class="tip">Analyse : remarque la construction en <strong>boomerang</strong>. Le détail présenté au jour 27 comme une simple coquetterie du collectionneur (le petit étoile) devient au jour 28 la clé de la résolution. Et l'ironie finale est double : c'est le <strong>savoir-faire</strong> du voleur (des photos parfaites pour prouver l'authenticité) qui le trahit. Ce qui devait le protéger le condamne.</p></div>`,
  exercises: [

    solution: `<p>Chronologie : <strong>b</strong> (Reinhardt observe le code des années avant) → <strong>d</strong> (le vol) → <strong>a</strong> (mise en vente anonyme) → <strong>c</strong> (Frau Vogel reconnaît l'étoile) → <strong>e</strong> (identification, arrestation, aveux) → <strong>f</strong> (restitution et remerciements).</p>
<p><strong>Sens global :</strong> un vol quasi parfait, commis par un initié expert, est déjoué par un détail infime. <strong>Implicite et ironie :</strong> le petit étoile, présenté d'abord comme une lubie de collectionneur, devient la preuve décisive ; surtout, c'est le <em>Fachwissen</em> du voleur — les photos ultra-nettes destinées à prouver l'authenticité — qui le confond. Ce qui devait le protéger le perd (« zum Verhängnis werden »). La chute d'Albrecht le résume : « Manchmal entscheidet ein winziges Detail über alles. »</p>
<p><strong>Opinion :</strong> il n'y a pas de bonne réponse unique — l'essentiel est de justifier ton point de vue en allemand, par exemple : « Ich finde das Ende gerecht, weil der Dieb durch seine eigene Gier und Selbstsicherheit überführt wird. »</p>`
