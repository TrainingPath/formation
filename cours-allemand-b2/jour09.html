  title: "Articuler un argumentaire",
  subtitle: "Les connecteurs logiques pour enchaîner idées, causes, conséquences et oppositions.",
  theory: `
<h3>1. Pourquoi les connecteurs comptent</h3>
<p>Au B2, un discours n'est plus une suite de phrases isolées : c'est un <strong>raisonnement articulé</strong>. Les connecteurs logiques (Konnektoren) sont les charnières qui relient les idées. Bien les choisir, c'est rendre son propos clair et convaincant.</p>
<p>Un piège majeur en allemand : la <strong>position du verbe change</strong> selon le type de connecteur. Il faut donc les classer.</p>
<h3>2. Les trois familles de connecteurs</h3>
<pre class="pseudo">A. Coordonnants (verbe en position 2, pas d'inversion) :
   und, aber, oder, denn, sondern
   Ich bleibe zu Hause, denn ich bin müde.   Je reste, car je suis fatigué.

B. Adverbiaux (en tête → inversion, verbe en position 2) :
   deshalb, deswegen, trotzdem, dennoch, außerdem, jedoch, also
   Ich bin müde, deshalb bleibe ich zu Hause.

C. Subordonnants (verbe à la FIN de la subordonnée) :
   weil, da, obwohl, damit, sodass, wenn, während, indem
   Ich bleibe zu Hause, weil ich müde bin.</pre>
<div class="warn">Ne confonds pas <strong>weil</strong> (subordonnant, verbe à la fin) et <strong>denn</strong> (coordonnant, verbe en position 2) : tous deux signifient « car/parce que », mais la construction diffère radicalement.</p></div>
<h3>3. Exprimer la cause et la conséquence</h3>
<pre class="pseudo">Cause :        weil, da, denn, aufgrund + Genitiv
Conséquence :  deshalb, deswegen, daher, also, folglich, sodass
Es hat geregnet, deshalb ist das Spiel ausgefallen.
Es hat so stark geregnet, dass das Spiel ausfiel. (sodass / so ... dass)</pre>
<h3>4. Opposition et concession</h3>
<pre class="pseudo">Opposition :  aber, jedoch, sondern, während
Concession :  obwohl (+ verbe fin), trotzdem (+ inversion), dennoch, zwar ... aber
Obwohl es regnete, gingen wir spazieren.       Bien qu'il pleuve, nous nous promenâmes.
Es regnete; trotzdem gingen wir spazieren.     Il pleuvait ; malgré tout, nous sortîmes.</pre>
<div class="tip">Distingue <strong>obwohl</strong> (subordonnant : verbe à la fin) et <strong>trotzdem</strong> (adverbial : inversion). Ils expriment la même concession mais gouvernent des ordres de mots opposés.</div>
<h3>5. Structurer un argumentaire complet</h3>
<p>Pour bâtir un argumentaire, on enchaîne des connecteurs de fonction :</p>
<pre class="pseudo">Introduire :   Zunächst, Erstens, Einerseits
Ajouter :      Außerdem, Darüber hinaus, Zudem, Ferner
Nuancer :      Allerdings, Zwar ... aber, Einerseits ... andererseits
Illustrer :    Zum Beispiel, Etwa, So
Conclure :     Schließlich, Zusammenfassend, Alles in allem, Letztlich</pre>
<div class="tip">Modèle d'enchaînement B2 : « Einerseits ... , andererseits ... . Zwar ..., aber ... . Deshalb bin ich der Meinung, dass ... . Zusammenfassend lässt sich sagen, dass ... . » Ce squelette, appris par coeur, structure n'importe quelle prise de position.</div>`,
  exercises: [
    { type: "qcm", q: "Avec « denn » (car), où se place le verbe ?", opts: ["à la fin", "en position 2 (comme dans une principale)", "en position 1", "avant le sujet"], a: 1, exp: "denn est un coordonnant : pas d'inversion, verbe en position 2." },
    { type: "qcm", q: "Avec « weil » (parce que), où se place le verbe conjugué ?", opts: ["en position 2", "à la fin de la subordonnée", "en position 1", "au début"], a: 1, exp: "weil est un subordonnant : le verbe part à la fin." },
    { type: "input", q: "Complète (weil, verbe à la fin) : « Ich bleibe zu Hause, weil ich müde ___. »", a: ["bin"], ph: "verbe", exp: "Subordonnée en weil : ... müde bin." },

    { type: "qcm", q: "À quelle famille appartient « obwohl » ?", opts: ["coordonnant", "adverbial", "subordonnant (verbe à la fin)", "préposition"], a: 2, exp: "obwohl est un subordonnant : verbe conjugué à la fin." },
    { type: "input", q: "Complète (obwohl, verbe à la fin) : « Obwohl es ___, gingen wir spazieren. » (verbe regnen au prétérit)", a: ["regnete"], ph: "verbe", exp: "Subordonnée : Obwohl es regnete, ..." },

    { type: "qcm", q: "Quel connecteur exprime la conséquence ?", opts: ["obwohl", "deshalb", "weil", "während"], a: 1, exp: "deshalb/deswegen/daher/folglich = conséquence." },
    { type: "input", q: "Conséquence forte : « Es hat so stark geregnet, ___ das Spiel ausfiel. » (subordonnant so ... dass)", a: ["dass"], ph: "conjonction", exp: "so + adjectif ... dass = conséquence : ... dass das Spiel ausfiel." },
    { type: "qcm", q: "Quel groupe sert à AJOUTER un argument ?", opts: ["trotzdem, dennoch", "außerdem, darüber hinaus, zudem", "weil, da", "zum Beispiel"], a: 1, exp: "außerdem, darüber hinaus, zudem, ferner = ajouter." },
    { type: "qcm", q: "Pour CONCLURE un argumentaire, on emploie…", opts: ["zunächst, erstens", "zusammenfassend, alles in allem, letztlich", "zum Beispiel", "einerseits"], a: 1, exp: "zusammenfassend, alles in allem, schließlich, letztlich = conclusion." },
    { type: "input", q: "Complète la paire de nuance : « Einerseits ist es teuer, ___ ist es sehr praktisch. » (l'autre membre)", a: ["andererseits"], ph: "connecteur", exp: "einerseits ... andererseits = d'une part ... d'autre part." },
    { type: "vf", q: "« obwohl » et « trotzdem » expriment la même concession mais gouvernent des ordres de mots opposés.", a: true, exp: "obwohl = verbe à la fin ; trotzdem = inversion." },
    { type: "input", q: "Complète (denn, coordonnant, verbe position 2) : « Ich bleibe zu Hause, denn ich ___ müde. » (verbe sein)", a: ["bin"], ph: "verbe", exp: "denn ne provoque pas d'inversion : denn ich bin müde." }
  ],

    title: "Exercice final — Pro und Kontra: das Homeoffice",
    intro: `<p>Voici une prise de position argumentée sur le télétravail. Analyse les connecteurs.</p>
<pre class="pseudo">Das Homeoffice hat in den letzten Jahren stark zugenommen. Einerseits bietet es
mehr Flexibilität, andererseits fehlt oft der persönliche Kontakt. Viele Menschen
arbeiten zu Hause produktiver, weil sie weniger abgelenkt werden. Außerdem sparen

Arbeit und Freizeit. Obwohl das Homeoffice viele Vorteile hat, klagen einige über
Einsamkeit. Deshalb setzen viele Firmen auf ein Hybridmodell. Zusammenfassend lässt
sich sagen, dass eine Mischung aus Büro und Homeoffice am sinnvollsten erscheint.</pre>
<p>(abgelenkt = distrait · entfallen = disparaître, être supprimé · verschwimmen = s'estomper)</p>`,
    questions: [
      { type: "input", q: "Relève le connecteur d'ajout : « ___ sparen sie Zeit ». (verbe en 2e position après lui)", a: ["Außerdem","außerdem","Ausserdem","ausserdem"], ph: "connecteur", exp: "außerdem (adverbial) ajoute un argument et provoque l'inversion." },
      { type: "qcm", q: "Pourquoi « weil sie weniger abgelenkt werden » place-t-il le verbe à la fin ?", opts: ["par erreur", "parce que weil est un subordonnant", "parce que c'est une question", "parce que c'est du passé"], a: 1, exp: "weil = subordonnant → verbe conjugué (werden) à la fin." },
      { type: "qcm", q: "« Obwohl das Homeoffice viele Vorteile hat, klagen einige... » : quelle relation exprime « obwohl » ?", opts: ["la cause", "la concession (bien que)", "la conséquence", "le but"], a: 1, exp: "obwohl = concession ; la principale qui suit fait l'inversion (klagen einige)." },
      { type: "input", q: "Relève le connecteur de conséquence : « ___ setzen viele Firmen auf ein Hybridmodell. »", a: ["Deshalb","deshalb"], ph: "connecteur", exp: "deshalb = conséquence, adverbial → inversion." },
      { type: "vf", q: "« Zusammenfassend lässt sich sagen, dass ... » est une formule de conclusion typique d'un argumentaire.", a: true, exp: "zusammenfassend introduit la synthèse finale." }
    ],
    solution: `<p>Le texte est structuré comme un argumentaire modèle. Il ouvre par une balance <strong>einerseits ... andererseits</strong>, développe avec des causes (<strong>weil, da</strong>, verbe à la fin), ajoute des arguments (<strong>außerdem</strong>, inversion), nuance (<strong>allerdings</strong>), concède (<strong>obwohl</strong>, verbe à la fin), tire une conséquence (<strong>deshalb</strong>, inversion) et conclut (<strong>zusammenfassend</strong>).</p>
<p>Observe comment chaque famille de connecteurs impose sa syntaxe : subordonnants (weil, da, obwohl) → verbe à la fin ; adverbiaux (außerdem, deshalb) → inversion. Maîtriser ce jeu, c'est écrire un allemand argumentatif solide.</p>`
  }
};
