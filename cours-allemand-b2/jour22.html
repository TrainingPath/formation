<script>
var DAY = {
  num: 22,
  title: "L'implicite, l'humour, l'ironie",
  subtitle: "Comprendre ce qui n'est pas dit : sous-entendus, humour et ironie en allemand.",
  theory: `
<h3>1. Comprendre l'implicite (das Implizite)</h3>
<p>Au B2, comprendre un texte ne suffit plus : il faut saisir ce qu'il <strong>suggère</strong> sans le dire. L'<strong>implicite</strong> se cache dans les sous-entendus (die Andeutung), les non-dits et le contexte. On l'infère (erschließen) à partir d'indices.</p>
<pre class="pseudo">Explicite : „Es ist kalt hier.“          Il fait froid ici.
Implicite : (= « Ferme la fenêtre ! » selon le contexte)
Explicite : „Schon wieder zu spät?“       Encore en retard ?
Implicite : (= reproche : « Tu es toujours en retard »)</pre>
<div class="tip">Pour décoder l'implicite, demande-toi : <em>pourquoi</em> la personne dit-elle cela <em>maintenant</em> ? Qu'attend-elle en réalité ? Le sens dépasse souvent les mots.</p></div>
<h3>2. L'ironie (die Ironie)</h3>
<p>L'<strong>ironie</strong> consiste à dire le <strong>contraire</strong> de ce qu'on pense, pour critiquer ou plaisanter. Le ton (à l'oral) ou le contexte (à l'écrit) fait comprendre qu'il ne faut pas prendre la phrase au premier degré.</p>
<pre class="pseudo">„Na toll, jetzt regnet es auch noch!“
   « Génial, et en plus il pleut maintenant ! » (= c'est agaçant)
„Du bist ja ein echter Experte.“
   « Tu es un vrai expert. » (dit après une erreur = tu n'y connais rien)
„Das hast du ja super gemacht.“
   « Bravo, beau travail. » (ironique si c'est raté)</pre>
<div class="warn">Des mots signalent souvent l'ironie : <strong>na toll</strong>, <strong>ja</strong> (particule), <strong>echt</strong>, <strong>wirklich</strong>, <strong>ausgerechnet</strong> (justement, comme par hasard). Le contexte tranche : une louange après un échec est presque toujours ironique.</p></div>
<h3>3. Les particules modales (die Modalpartikeln)</h3>
<p>Petits mots intraduisibles qui colorent le ton : ils sont essentiels pour saisir les nuances de l'oral allemand.</p>
<pre class="pseudo">ja    (évidence, insistance)  „Das ist ja klar!“  = mais c'est évident !
doch  (contradiction, insistance)  „Komm doch!“   = allez, viens donc !
mal   (atténue, familier)     „Warte mal.“        = attends voir.
eben  (résignation)           „Das ist eben so.“   = c'est comme ça, point.
halt  (idem, sud)             „Ich bin halt müde.“ = je suis fatigué, c'est tout.
wohl  (probabilité)           „Er ist wohl krank.“ = il est sans doute malade.</pre>
<h3>4. L'humour et les jeux de mots</h3>
<p>L'humour allemand joue souvent sur les <strong>mots composés</strong>, les doubles sens et l'understatement (dire moins pour signifier plus). Le <strong>Wortspiel</strong> (jeu de mots) exploite deux sens d'un même mot.</p>
<pre class="pseudo">„Ich stehe morgens nicht gern auf – außer, es gibt Frühstück.“
   Je n'aime pas me lever le matin – sauf s'il y a un petit-déjeuner.
Understatement : „Nicht schlecht“ (= très bien, en fait).</pre>
<h3>5. Un dialogue à décoder</h3>
<pre class="pseudo">Chef:      Sie sind schon wieder zu spät, Herr Weber.
Weber:     Der Zug hatte Verspätung.
Chef:      Ach, natürlich. Der Zug. Wie originell.
Weber:     Diesmal stimmt es wirklich!
Chef:      Ja, sicher. Und morgen war es der Stau, nehme ich an.</pre>
<p>Ici, le chef ne croit pas Weber : « Wie originell » (comme c'est original) et « Ja, sicher » (mais bien sûr) sont <strong>ironiques</strong>. La dernière phrase sous-entend que Weber invente toujours une excuse. Rien n'est dit directement, mais tout est compris.</p>
<p>(die Verspätung = le retard · der Stau = l'embouteillage · annehmen = supposer)</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que « l'implicite » dans un texte ?", opts: ["ce qui est écrit noir sur blanc", "ce qui est suggéré sans être dit", "le titre", "la ponctuation"], a: 1, exp: "L'implicite = le sens sous-entendu, à inférer du contexte." },
    { type: "qcm", q: "« Es ist kalt hier » peut implicitement signifier…", opts: ["j'ai chaud", "ferme la fenêtre / mets le chauffage", "il fait beau", "je pars"], a: 1, exp: "Selon le contexte, c'est une demande indirecte." },
    { type: "qcm", q: "En quoi consiste l'ironie ?", opts: ["répéter une phrase", "dire le contraire de ce qu'on pense", "parler fort", "poser une question"], a: 1, exp: "L'ironie dit l'inverse de sa pensée pour critiquer ou plaisanter." },
    { type: "qcm", q: "« Du bist ja ein echter Experte », dit après une grosse erreur, signifie…", opts: ["un vrai compliment", "tu n'y connais rien du tout (ironie)", "tu es diplômé", "merci beaucoup"], a: 1, exp: "Louange après une erreur = ironie : tu n'es pas un expert." },
    { type: "input", q: "Quel mot, en tête de « ___ toll, jetzt regnet es auch noch! », signale l'ironie/agacement ?", a: ["Na", "na"], ph: "deux lettres", exp: "« Na toll » = « génial » ironique, exprime l'agacement." },
    { type: "qcm", q: "La particule « doch » dans « Komm doch! » sert à…", opts: ["poser une question", "insister/encourager", "nier", "compter"], a: 1, exp: "doch encourage ou contredit : « allez, viens donc ! »." },
    { type: "qcm", q: "Que nuance la particule « wohl » dans « Er ist wohl krank » ?", opts: ["la certitude", "la probabilité (il est sans doute malade)", "l'ordre", "le passé"], a: 1, exp: "wohl = sans doute, probablement." },
    { type: "vf", q: "Les particules modales (ja, doch, mal, eben) colorent le ton et sont souvent intraduisibles mot à mot.", a: true, exp: "Elles nuancent l'attitude du locuteur ; on les rend par le ton en français." },
    { type: "qcm", q: "L'understatement « Nicht schlecht » signifie en réalité…", opts: ["c'est mauvais", "c'est très bien", "c'est moyen sans plus", "je ne sais pas"], a: 1, exp: "Understatement : dire moins (« pas mal ») pour signifier « très bien »." },
    { type: "qcm", q: "Dans le dialogue, « Wie originell » du chef est…", opts: ["un compliment sincère", "une remarque ironique (il ne croit pas l'excuse)", "une question", "un ordre"], a: 1, exp: "Le chef trouve l'excuse banale : ironie." },
    { type: "input", q: "Complète la particule (résignation) : « Das ist ___ so. » (c'est comme ça, point)", a: ["eben", "halt"], ph: "une particule", exp: "eben (ou halt) exprime la résignation : c'est ainsi, un point c'est tout." },
    { type: "qcm", q: "Que sous-entend le chef par « Und morgen war es der Stau, nehme ich an » ?", opts: ["il propose de l'aide", "Weber invente une nouvelle excuse chaque jour", "il annonce un embouteillage", "il félicite Weber"], a: 1, exp: "Sous-entendu : Weber a toujours une excuse différente." },
    { type: "qcm", q: "Que signifie « ausgerechnet » (souvent ironique) ?", opts: ["par hasard", "justement/comme par hasard (avec agacement)", "jamais", "bientôt"], a: 1, exp: "ausgerechnet heute = justement aujourd'hui (et ça tombe mal)." },
    { type: "vf", q: "Pour décoder l'ironie à l'écrit, le contexte remplace le ton de la voix.", a: true, exp: "À l'écrit, c'est le contexte (échec, exagération) qui révèle l'ironie." },
    { type: "qcm", q: "« Ich bin halt müde » : que traduit « halt » ?", opts: ["une question", "une résignation familière (je suis fatigué, c'est tout)", "un ordre", "le futur"], a: 1, exp: "halt = résignation, surtout dans le sud : « c'est comme ça »." }
  ],
  final: {
    title: "Exercice final — Ironie erkennen",
    intro: `<p>Lis ce petit texte et repère l'ironie et l'implicite.</p>
<pre class="pseudo">Mein Nachbar hat sich ein neues, riesiges Auto gekauft.
„Ganz umweltfreundlich“, sagt er stolz, „nur zwölf Liter auf
hundert Kilometer." Jeden Morgen fährt er damit die dreihundert
Meter zum Bäcker. „Sport ist nichts für mich“, erklärt er und
klopft zufrieden auf das Lenkrad. „Aber die Umwelt liegt mir
sehr am Herzen." Na dann.</pre>
<p>(umweltfreundlich = écologique · stolz = fier · das Lenkrad = le volant · am Herzen liegen = tenir à cœur)</p>`,
    questions: [
      { type: "qcm", q: "Le voisin qualifie sa grosse voiture de « ganz umweltfreundlich ». Est-ce sincère ?", opts: ["Oui, c'est une voiture écologique", "Non, c'est ironique : 12 L/100 km n'est pas du tout écologique", "On ne peut pas savoir", "C'est une question"], a: 1, exp: "Douze litres aux 100 km est très polluant : l'auteur se moque." },
      { type: "vf", q: "Le fait qu'il prenne la voiture pour 300 mètres renforce l'ironie.", a: true, exp: "Prendre un gros 4x4 pour 300 m contredit son discours écolo." },
      { type: "qcm", q: "Que révèle le contraste « Sport ist nichts für mich » / « die Umwelt liegt mir am Herzen » ?", opts: ["une cohérence parfaite", "une contradiction : il prétend aimer l'environnement mais agit à l'inverse", "un goût pour le sport", "rien de particulier"], a: 1, exp: "Ses paroles et ses actes se contredisent : c'est le cœur de l'ironie." },
      { type: "qcm", q: "La chute « Na dann. » exprime…", opts: ["un accord enthousiaste", "un scepticisme ironique de l'auteur", "une question", "une félicitation"], a: 1, exp: "« Na dann » (« ben voyons ») marque l'ironie et le scepticisme." },
      { type: "input", q: "Quel chiffre du texte prouve que la voiture n'est PAS écologique ?", a: ["zwölf", "zwölf Liter", "12", "12 Liter"], ph: "un nombre", exp: "« nur zwölf Liter auf hundert Kilometer » : consommation élevée." }
    ],
    solution: `<p>Le texte est entièrement <strong>ironique</strong>. Le voisin se dit écologiste (« umweltfreundlich », « die Umwelt liegt mir am Herzen ») mais ses actes disent l'inverse : une voiture énorme consommant <strong>12 L/100 km</strong>, utilisée pour parcourir <strong>300 mètres</strong> jusqu'au boulanger. L'auteur ne le juge jamais directement ; il laisse les <strong>contradictions</strong> parler et referme par un « Na dann. » (« ben voyons ») lourd de scepticisme.</p>
<p>Pour repérer l'ironie : cherche le <strong>décalage</strong> entre ce qui est dit et ce qui est montré. Ici, aucun mot n'est explicitement critique, mais l'accumulation de contradictions rend le sens réel évident. C'est tout l'art de l'implicite.</p>`
  }
};
</script>
