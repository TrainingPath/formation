<h3>1. Verbe ou nom : deux styles</h3>
<p>Le <strong>style verbal</strong> (Verbalstil) est vivant et concret ; le <strong>style nominal</strong> (Nominalstil) est abstrait, dense et impersonnel. La <strong>Nominalisierung</strong> consiste à transformer une action exprimée par un verbe en un nom.</p>
<pre class="pseudo">Verbalstil : Weil die Preise steigen, protestieren die Bürger.
Nominalstil : Wegen des Steigens der Preise protestieren die Bürger.
             En raison de la hausse des prix, les citoyens protestent.</pre>
<div class="tip">Le style nominal domine dans l'administration, le droit, la science et la presse sérieuse. Le comprendre est indispensable au B2 pour lire des textes de fond ; le produire donne à ton écrit un ton formel.</div>
<h3>2. Comment nominaliser un verbe</h3>
<p>Plusieurs procédés existent :</p>
<pre class="pseudo">1. Infinitif substantivé (neutre) : lesen → das Lesen (la lecture / le fait de lire)
2. Suffixe -ung : untersuchen → die Untersuchung (l'examen, l'enquête)
3. Radical nu : beginnen → der Beginn ; schlafen → der Schlaf
4. Suffixe -tion (mots savants) : produzieren → die Produktion</pre>
<p>Le suffixe <strong>-ung</strong> est le plus productif : il donne toujours un nom <strong>féminin</strong> (die Lösung, die Entscheidung, die Entwicklung).</p>
<h3>3. Les prépositions du style nominal</h3>
<p>Les subordonnées deviennent des groupes prépositionnels. Voici les correspondances clés :</p>
<pre class="pseudo">weil (parce que)      → wegen + Genitiv / aufgrund + Genitiv
als/wenn (quand)      → bei + Dativ           bei der Ankunft = à l'arrivée
nachdem (après que)   → nach + Dativ          nach dem Essen = après le repas
bevor (avant que)     → vor + Dativ           vor der Abreise = avant le départ
um zu (pour)          → zu / zwecks + Genitiv  zur Verbesserung = pour l'amélioration
obwohl (bien que)     → trotz + Genitiv        trotz des Regens = malgré la pluie</pre>
<h3>4. Comparer les deux styles</h3>
<pre class="pseudo">Verbal : Nachdem man das Gebäude renoviert hatte, eröffnete man es neu.
Nominal : Nach der Renovierung des Gebäudes erfolgte die Neueröffnung.
          Après la rénovation du bâtiment eut lieu la réouverture.

Verbal : Weil das Wetter schlecht war, fiel das Spiel aus.
Nominal : Wegen des schlechten Wetters fiel das Spiel aus.
          En raison du mauvais temps, le match a été annulé.</pre>
<div class="warn">Attention au <strong>génitif</strong> : le style nominal en abuse (die Renovierung <strong>des Gebäudes</strong>, das Steigen <strong>der Preise</strong>). Maîtriser le génitif est donc la condition du style nominal.</div>
<h3>5. Ne pas en abuser</h3>
<p>Le style nominal alourdit vite le texte. Un bon rédacteur <strong>alterne</strong> : nominal pour condenser et donner un ton formel, verbal pour rester clair et vivant. À l'oral, on reste largement verbal.</p>
<div class="tip">Verbe emblématique du style nominal : <strong>erfolgen</strong> (avoir lieu, s'effectuer), qui remplace un verbe d'action par une formule neutre : « Die Bezahlung erfolgt bar. » (Le paiement s'effectue en espèces.)</div>`,

    solution: `<p>L'avis est un modèle de <strong>Nominalstil</strong>. Les subordonnées ont disparu au profit de groupes prépositionnels : <strong>wegen der Sanierung</strong> (cause), <strong>zur Vermeidung</strong> (but), <strong>nach Abschluss</strong> (temps), <strong>trotz sorgfältiger Planung</strong> (concession), <strong>bei Fragen</strong> (condition). Les actions sont portées par des noms en -ung (Sanierung, Vermeidung, Benutzung, Planung, Durchführung) et le verbe passe-partout <strong>erfolgen</strong>.</p>
<p>Ce style est dense et impersonnel : idéal pour un texte officiel, mais à doser dans une prose vivante.</p>`
