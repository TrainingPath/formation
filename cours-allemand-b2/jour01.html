<script>
var DAY = {
  num: 1,
  title: "Réviser les temps et les cas",
  subtitle: "Remettre à plat les quatre cas et le système des temps avant d'entrer dans le B2.",
  theory: `
<h3>1. Les quatre cas : à quoi ils servent</h3>
<p>En allemand, la fonction d'un mot dans la phrase ne se lit pas à sa place, mais à sa <strong>déclinaison</strong>. Quatre cas se partagent le travail :</p>
<pre class="pseudo">Nominativ   sujet (qui fait l'action)        Der Mann schläft.      L'homme dort.
Akkusativ   complément d'objet direct        Ich sehe den Mann.     Je vois l'homme.
Dativ       complément d'objet indirect      Ich helfe dem Mann.    J'aide l'homme.
Genitiv     complément de nom (appartenance) das Auto des Mannes.   la voiture de l'homme.</pre>
<p>Le masculin est le seul genre dont l'article change entre nominatif et accusatif (<strong>der → den</strong>). C'est la première chose à surveiller.</p>
<div class="tip">Un bon réflexe B2 : avant d'écrire un groupe nominal, demande-toi sa <strong>fonction</strong> (sujet ? objet direct ? indirect ?), puis décline en conséquence. La grammaire allemande récompense cette rigueur.</div>
<h3>2. La déclinaison de l'article défini et indéfini</h3>
<pre class="pseudo">           masculin     féminin     neutre      pluriel
Nominativ  der / ein    die / eine  das / ein   die / ---
Akkusativ  den / einen  die / eine  das / ein   die / ---
Dativ      dem / einem  der / einer dem / einem den / --- (+n au nom)
Genitiv    des / eines  der / einer des / eines der / ---</pre>
<p>Au datif pluriel, le nom lui-même prend un <strong>-n</strong> : mit den Kinder<strong>n</strong> (avec les enfants), aus den Länder<strong>n</strong> (des pays).</p>
<h3>3. Les prépositions imposent le cas</h3>
<p>Certaines prépositions commandent toujours le même cas :</p>
<pre class="pseudo">+ Akkusativ : durch, für, gegen, ohne, um
+ Dativ     : aus, bei, mit, nach, seit, von, zu
+ Genitiv   : wegen, trotz, während, statt</pre>
<p>Les prépositions dites « mixtes » (Wechselpräpositionen : in, an, auf, über, unter, vor, hinter, neben, zwischen) demandent l'<strong>accusatif quand il y a mouvement vers un but</strong>, le <strong>datif quand il y a position</strong> :</p>
<pre class="pseudo">Ich gehe in die Schule.   (mouvement → Akkusativ)   Je vais à l'école.
Ich bin in der Schule.    (position → Dativ)         Je suis à l'école.</pre>
<div class="warn">Ne confonds pas <em>wo?</em> (où, position → Dativ) et <em>wohin?</em> (vers où, mouvement → Akkusativ). C'est l'erreur la plus fréquente, même à un niveau avancé.</div>
<h3>4. Le système des temps</h3>
<pre class="pseudo">Präsens        Ich lerne Deutsch.              J'apprends l'allemand. (présent + futur proche)
Perfekt        Ich habe Deutsch gelernt.       J'ai appris l'allemand. (passé de l'oral)
Präteritum     Ich lernte Deutsch.             J'apprenais / j'appris. (passé de l'écrit)
Plusquamperfekt Ich hatte Deutsch gelernt.     J'avais appris l'allemand. (antériorité)
Futur I        Ich werde Deutsch lernen.       J'apprendrai l'allemand. (futur, projet)</pre>
<p>Le <strong>Plusquamperfekt</strong> (hatte/war + participe) exprime une action antérieure à une autre action passée : « Nachdem ich gegessen hatte, ging ich schlafen. » (Après avoir mangé, je suis allé dormir.)</p>
<h3>5. haben ou sein au passé composé ?</h3>
<p>On emploie <strong>sein</strong> avec les verbes de déplacement (gehen, fahren, kommen) et de changement d'état (aufstehen, sterben, werden), ainsi qu'avec sein et bleiben. Partout ailleurs : <strong>haben</strong>.</p>
<pre class="pseudo">Ich bin nach Berlin gefahren.   Je suis allé à Berlin.
Ich habe ein Buch gelesen.      J'ai lu un livre.
Er ist alt geworden.            Il est devenu vieux.</pre>
<div class="tip">Au B2, on attend de toi que tu jongles avec ces temps sans hésiter. La suite du cours (Konjunktiv, passif, participes) repose entièrement sur cette base : assure-toi qu'elle est solide.</div>`,
  exercises: [
    { type: "qcm", q: "Dans « Ich sehe ___ Mann », quel article masculin faut-il ? (complément d'objet direct)", opts: ["der", "den", "dem", "des"], a: 1, exp: "Objet direct = Akkusativ ; masculin der → den." },
    { type: "qcm", q: "Dans « Ich helfe ___ Mann », quel article ? (helfen régit le datif)", opts: ["der", "den", "dem", "des"], a: 2, exp: "helfen + Dativ ; masculin datif = dem." },
    { type: "input", q: "Complète au datif pluriel : « Ich spiele mit ___ Kindern. » (article défini pluriel)", a: ["den"], ph: "article", exp: "Datif pluriel : den + nom en -n (Kindern)." },
    { type: "qcm", q: "Quelle préposition régit TOUJOURS le datif ?", opts: ["für", "durch", "mit", "ohne"], a: 2, exp: "mit, aus, bei, nach, seit, von, zu + Dativ. für/durch/ohne + Akkusativ." },
    { type: "qcm", q: "« Ich gehe ___ die Schule. » Pourquoi l'accusatif ?", opts: ["Parce que Schule est féminin", "Parce qu'il y a un mouvement vers un but (wohin?)", "Parce que gehen régit l'accusatif", "C'est une erreur, il faut le datif"], a: 1, exp: "Wechselpräposition + mouvement (wohin?) → Akkusativ." },
    { type: "input", q: "Position, pas mouvement : « Ich bin ___ der Schule. » (préposition in + article féminin datif)", a: ["in"], ph: "préposition", exp: "wo? position → Dativ : in der Schule." },
    { type: "vf", q: "Au masculin, l'article défini change entre le nominatif (der) et l'accusatif (den).", a: true, exp: "C'est le seul genre où nominatif et accusatif diffèrent." },
    { type: "input", q: "Mets au Perfekt : « Ich ___ nach Berlin gefahren. » (auxiliaire)", a: ["bin"], ph: "auxiliaire", exp: "fahren = déplacement → sein : ich bin gefahren." },
    { type: "input", q: "Mets au Perfekt : « Ich ___ ein Buch gelesen. » (auxiliaire)", a: ["habe"], ph: "auxiliaire", exp: "lesen n'est ni déplacement ni changement d'état → haben." },
    { type: "qcm", q: "Quel temps exprime une action antérieure à une autre action passée ?", opts: ["le Perfekt", "le Präteritum", "le Plusquamperfekt", "le Futur I"], a: 2, exp: "Plusquamperfekt = hatte/war + participe (antériorité)." },
    { type: "qcm", q: "Le Präteritum s'emploie surtout…", opts: ["à l'oral courant", "à l'écrit et dans les récits littéraires", "seulement au futur", "jamais"], a: 1, exp: "À l'oral on préfère le Perfekt ; le Präteritum domine à l'écrit (et avec sein/haben/modaux)." },
    { type: "input", q: "Complète le Plusquamperfekt : « Nachdem ich gegessen ___, ging ich schlafen. » (auxiliaire de essen)", a: ["hatte"], ph: "auxiliaire au passé", exp: "essen + haben ; Plusquamperfekt = hatte + gegessen." },
    { type: "qcm", q: "Quelle préposition régit le génitif ?", opts: ["mit", "während", "für", "bei"], a: 1, exp: "während, wegen, trotz, statt + Genitiv." },
    { type: "vf", q: "« Er ist alt geworden » est correct : werden se conjugue avec sein au Perfekt.", a: true, exp: "werden = changement d'état → sein." },
    { type: "input", q: "Génitif masculin : « das Auto ___ Mannes » (article défini masculin génitif)", a: ["des"], ph: "article", exp: "Génitif masculin/neutre : des (+ -s ou -es au nom : des Mannes)." }
  ],
  final: {
    title: "Exercice final — Ein Tag in Wien",
    intro: `<p>Lis ce court récit, puis réponds aux questions sur les cas et les temps.</p>
<pre class="pseudo">Letztes Jahr bin ich mit meiner Familie nach Wien gefahren.
Wir hatten das Hotel schon im Frühling gebucht, deshalb war alles gut organisiert.
Am ersten Tag besuchten wir das Schloss Schönbrunn; der Garten hat mir besonders gefallen.
Während des Nachmittags gingen wir durch die Altstadt und tranken Kaffee in einem alten Café.
Meiner Mutter gefiel die Stadt so sehr, dass sie unbedingt wiederkommen möchte.
Am Abend, nachdem wir gegessen hatten, spazierten wir noch am Ufer der Donau.</pre>
<p>(buchen = réserver · das Schloss = le château · das Ufer = la rive · die Donau = le Danube)</p>`,
    questions: [
      { type: "input", q: "Quel auxiliaire ouvre le récit : « ___ ich mit meiner Familie nach Wien gefahren » ?", a: ["bin"], ph: "auxiliaire", exp: "fahren = déplacement → sein : bin gefahren." },
      { type: "qcm", q: "« Wir hatten das Hotel schon gebucht » : quel temps est-ce, et pourquoi ?", opts: ["Perfekt, action récente", "Plusquamperfekt, action antérieure au voyage", "Präteritum simple", "Futur I"], a: 1, exp: "hatten + gebucht = Plusquamperfekt : la réservation précède le voyage." },
      { type: "qcm", q: "Dans « Meiner Mutter gefiel die Stadt », pourquoi « meiner Mutter » est-il au datif ?", opts: ["C'est le sujet", "gefallen (plaire à qqn) régit le datif", "C'est un génitif", "À cause de la préposition"], a: 1, exp: "gefallen + Dativ : la chose qui plaît est au nominatif (die Stadt), la personne au datif." },
      { type: "input", q: "Relève l'article génitif dans « Während ___ Nachmittags ». (masculin génitif)", a: ["des"], ph: "article", exp: "während + Genitiv ; masculin : des Nachmittags." },
      { type: "vf", q: "« nachdem wir gegessen hatten » est un Plusquamperfekt qui marque l'antériorité par rapport à « spazierten ».", a: true, exp: "D'abord manger (gegessen hatten), ensuite se promener (spazierten) : l'antériorité justifie le Plusquamperfekt." }
    ],
    solution: `<p>Analyse : le récit combine plusieurs temps. Le <strong>Perfekt</strong> (bin gefahren, hat gefallen) donne le fil du récit oral ; le <strong>Präteritum</strong> (besuchten, gingen, tranken, gefiel, spazierten) apparaît naturellement à l'écrit ; le <strong>Plusquamperfekt</strong> (hatten gebucht, gegessen hatten) marque ce qui s'est passé <em>avant</em>.</p>
<p>Côté cas : <strong>meiner Familie</strong> et <strong>meiner Mutter</strong> sont au datif (mit + Dativ ; gefallen + Dativ), <strong>des Nachmittags</strong> et <strong>des Mannes</strong>-type sont au génitif (während + Genitiv), et les objets directs (das Hotel, das Schloss, Kaffee) sont à l'accusatif.</p>`
  }
};
</script>
