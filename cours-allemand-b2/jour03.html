<script>
var DAY = {
  num: 3,
  title: "Le Konjunktiv I et le discours rapporté",
  subtitle: "Rapporter les propos d'autrui avec la distance du journaliste : indirekte Rede.",
  theory: `
<h3>1. À quoi sert le Konjunktiv I ?</h3>
<p>Le Konjunktiv I est le mode du <strong>discours rapporté</strong> (indirekte Rede). En allemand soigné, surtout dans la presse et les comptes rendus, on l'emploie pour signaler que l'on <strong>rapporte les paroles de quelqu'un sans les prendre à son compte</strong>. C'est une marque de distance et d'objectivité.</p>
<pre class="pseudo">Discours direct :   Der Minister sagt: „Ich habe keine Zeit.“
Discours rapporté : Der Minister sagt, er habe keine Zeit.
                    Le ministre dit qu'il n'a pas le temps.</pre>
<div class="tip">Là où le français utilise « que » + indicatif ou subjonctif, l'allemand soutenu emploie le Konjunktiv I. Il traduit une nuance : « selon ses dires », sans que le locuteur garantisse la vérité du propos.</div>
<h3>2. Former le Konjunktiv I</h3>
<p>On part du radical de l'infinitif + terminaisons -e, -est, -e, -en, -et, -en. La forme la plus utile est la <strong>3e personne du singulier</strong>, très reconnaissable car elle se termine par <strong>-e</strong> (et non -t comme l'indicatif) :</p>
<pre class="pseudo">           indicatif      Konjunktiv I
er machen    er macht    → er mache
er haben     er hat      → er habe
er kommen    er kommt    → er komme
er sein      er ist      → er sei   (irrégulier, à connaître)</pre>
<p>Le verbe <strong>sein</strong> est irrégulier et essentiel : ich sei, du sei(e)st, er sei, wir seien, ihr seiet, sie seien.</p>
<h3>3. Quand la forme se confond avec l'indicatif</h3>
<p>Problème : à beaucoup de personnes (surtout au pluriel), le Konjunktiv I est <strong>identique à l'indicatif</strong> (sie machen = sie machen). Pour rester clair, on bascule alors sur le <strong>Konjunktiv II</strong> ou sur <strong>würde + infinitif</strong> :</p>
<pre class="pseudo">Sie sagen, sie machen das.  →  ambigu !
Sie sagen, sie würden das machen.   (clair : discours rapporté)
Er sagt, die Leute hätten kein Geld.   (Konj. II au lieu de « haben » ambigu)</pre>
<div class="warn">Règle pratique : si le Konjunktiv I ressemble à l'indicatif, remplace-le par le Konjunktiv II. On ne mélange pas les deux au hasard : on choisit la forme la plus <strong>distincte</strong>.</div>
<h3>4. Le passé et le futur au discours rapporté</h3>
<p>Le discours rapporté n'a qu'<strong>un seul passé</strong> : hätte/habe/sei + participe. Peu importe le temps du discours direct (Perfekt, Präteritum, Plusquamperfekt), il devient ce passé unique.</p>
<pre class="pseudo">Direct : „Ich war krank.“ / „Ich bin krank gewesen.“
Rapporté : Er sagt, er sei krank gewesen.   Il dit qu'il a été malade.
Direct : „Ich werde kommen.“
Rapporté : Er sagt, er werde kommen.         Il dit qu'il viendra.</pre>
<h3>5. Adapter les pronoms et les repères</h3>
<p>Comme en français, on adapte les pronoms et les indications de temps/lieu :</p>
<pre class="pseudo">Direct : „Ich treffe dich morgen hier.“
Rapporté : Er sagte, er treffe mich am nächsten Tag dort.
           Il a dit qu'il me rencontrerait le lendemain là-bas.</pre>
<div class="tip">Le Konjunktiv I est surtout un outil de <strong>compréhension</strong> : tu le croiseras dans tout article de presse allemand sérieux. Savoir le reconnaître, c'est comprendre qui parle et qui rapporte. Le produire correctement, même partiellement, est un vrai signe de niveau B2/C1.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert principalement le Konjunktiv I ?", opts: ["à donner un ordre", "au discours rapporté (indirekte Rede)", "à exprimer l'irréel", "au futur"], a: 1, exp: "Le Konjunktiv I marque qu'on rapporte les propos d'autrui, avec distance." },
    { type: "qcm", q: "Discours direct : « Ich habe keine Zeit. » Au discours rapporté, cela devient…", opts: ["er hat keine Zeit", "er habe keine Zeit", "er hätte keine Zeit gehabt", "er wird keine Zeit haben"], a: 1, exp: "3e pers. sing. de haben au Konjunktiv I = habe." },
    { type: "input", q: "Konjunktiv I de « er kommt » : « Er sagt, er ___. »", a: ["komme"], ph: "verbe", exp: "Radical komm- + e = komme (distinct de l'indicatif kommt)." },
    { type: "input", q: "Konjunktiv I irrégulier de sein (3e pers. sing.) : « Er sagt, er ___ krank. »", a: ["sei"], ph: "verbe", exp: "sein → er sei (forme irrégulière essentielle)." },
    { type: "qcm", q: "Comment reconnaît-on souvent le Konjunktiv I à la 3e pers. du singulier ?", opts: ["il se termine par -t", "il se termine par -e (er mache, er habe)", "il se termine par -en", "il n'a pas de terminaison"], a: 1, exp: "er macht (indicatif) → er mache (Konjunktiv I) : la terminaison -e le distingue." },
    { type: "qcm", q: "Pourquoi remplace-t-on parfois le Konjunktiv I par le Konjunktiv II ?", opts: ["par simple préférence", "quand la forme du Konjunktiv I est identique à l'indicatif et donc ambiguë", "au pluriel uniquement pour faire joli", "jamais"], a: 1, exp: "Si Konjunktiv I = indicatif (ex. sie machen), on prend le Konjunktiv II pour rester clair." },
    { type: "input", q: "Rends clair le discours rapporté : « Sie sagen, sie ___ kein Geld. » (Konjunktiv II de haben, 3e pers. pluriel)", a: ["hätten","haetten"], ph: "verbe", exp: "haben au Konjunktiv I pluriel = haben (= indicatif) → on préfère hätten." },
    { type: "vf", q: "Le discours rapporté possède un seul passé (habe/sei + participe), quel que soit le temps du discours direct.", a: true, exp: "Perfekt, Präteritum et Plusquamperfekt convergent vers ce passé unique." },
    { type: "input", q: "Passé rapporté : « Er sagt, er ___ krank gewesen. » (auxiliaire, sein)", a: ["sei"], ph: "auxiliaire", exp: "sein au Konjunktiv I = sei : sei krank gewesen." },
    { type: "qcm", q: "Discours direct : « Ich werde kommen. » Au discours rapporté (futur) : « Er sagt, er ___ kommen. »", opts: ["wird", "werde", "würde", "wurde"], a: 1, exp: "werden au Konjunktiv I 3e pers. sing. = werde." },
    { type: "qcm", q: "Direct : « Ich treffe dich morgen hier. » Rapporté correct ?", opts: ["Er sagt, er treffe mich morgen hier.", "Er sagt, er treffe mich am nächsten Tag dort.", "Er sagt, ich treffe dich hier.", "Er sagt, er trifft dich morgen hier."], a: 1, exp: "On adapte pronoms (dich→mich) et repères (morgen→am nächsten Tag, hier→dort)." },
    { type: "input", q: "Konjunktiv I de « er hat » : « Der Minister sagt, er ___ recht. »", a: ["habe"], ph: "verbe", exp: "haben → er habe (Konjunktiv I)." },
    { type: "vf", q: "Le Konjunktiv I est surtout fréquent dans la presse et les comptes rendus soignés.", a: true, exp: "C'est le mode journalistique du discours rapporté." },
    { type: "qcm", q: "« Der Minister sagt, er habe keine Zeit » suggère que…", opts: ["le locuteur garantit que c'est vrai", "le locuteur rapporte les propos sans les prendre à son compte", "le ministre a menti", "c'est une question"], a: 1, exp: "Le Konjunktiv I introduit une distance : « selon ses dires »." },
    { type: "input", q: "Konjunktiv I 3e pers. sing. de « machen » : « Sie behauptet, er ___ das absichtlich. »", a: ["mache"], ph: "verbe", exp: "machen → er mache (terminaison -e)." }
  ],
  final: {
    title: "Exercice final — Ein Pressebericht",
    intro: `<p>Voici un extrait de compte rendu de presse. Repère le discours rapporté.</p>
<pre class="pseudo">Die Bürgermeisterin erklärte gestern, die Stadt stehe vor großen Herausforderungen.
Sie sagte, das Budget sei in diesem Jahr besonders knapp, doch man werde trotzdem
in Schulen investieren. Mehrere Bürger hätten sich beschwert, die Straßen seien in
schlechtem Zustand. Die Bürgermeisterin versprach, die Reparaturen würden bald
beginnen. Ein Sprecher fügte hinzu, man habe bereits einen Plan ausgearbeitet und
die Arbeiten seien für den Sommer geplant.</pre>
<p>(die Herausforderung = le défi · knapp = serré, juste · sich beschweren = se plaindre)</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi le texte emploie-t-il « stehe », « sei », « werde » plutôt que « steht », « ist », « wird » ?", opts: ["par erreur", "parce que ce sont des formes de Konjunktiv I marquant le discours rapporté", "parce que c'est le futur", "parce que c'est de l'irréel"], a: 1, exp: "Le journaliste rapporte les propos de la maire : Konjunktiv I." },
      { type: "input", q: "Relève le Konjunktiv I de sein : « das Budget ___ knapp ».", a: ["sei"], ph: "verbe", exp: "sein → sei (Konjunktiv I)." },
      { type: "qcm", q: "Pourquoi « Mehrere Bürger hätten sich beschwert » utilise-t-il hätten (Konj. II) et non haben ?", opts: ["par style", "parce que haben au pluriel serait identique à l'indicatif (ambigu)", "parce que c'est un ordre", "parce que c'est faux"], a: 1, exp: "haben (Konj. I pluriel) = haben (indicatif) → on prend hätten pour rester clair." },
      { type: "input", q: "Relève le passé rapporté : « man ___ bereits einen Plan ausgearbeitet ». (auxiliaire, haben)", a: ["habe"], ph: "auxiliaire", exp: "haben au Konjunktiv I = habe : habe ausgearbeitet." },
      { type: "vf", q: "L'emploi du Konjunktiv I montre que le journaliste rapporte les propos sans en garantir personnellement la vérité.", a: true, exp: "C'est précisément la fonction de distance du discours rapporté." }
    ],
    solution: `<p>Tout le texte est au <strong>discours rapporté</strong>. Les formes de Konjunktiv I (<strong>stehe, sei, werde, habe, seien</strong>) signalent que le journaliste restitue les paroles de la maire et du porte-parole sans se les approprier.</p>
<p>Deux mécanismes B2 à retenir : (1) quand la forme du Konjunktiv I est distincte (sei, habe, werde), on l'emploie ; (2) quand elle se confondrait avec l'indicatif au pluriel (haben, würden), on bascule sur le <strong>Konjunktiv II</strong> (hätten, würden) pour préserver la clarté.</p>`
  }
};
</script>

  ]
};
