<script>
var DAY = {

  title: "Analyser un fait divers en détail",
  subtitle: "Chronologie, causes, conséquences et point de vue dans un fait divers.",
  theory: `
<h3>1. Passer de la compréhension à l'analyse</h3>
<p>Hier, tu as extrait les <em>faits</em> d'un fait divers. Aujourd'hui, tu vas plus loin : reconstituer la <strong>chronologie</strong> exacte, distinguer <strong>causes</strong> et <strong>conséquences</strong>, repérer le <strong>point de vue</strong> et l'<strong>implicite</strong>. C'est une compétence clé du B2.</p>
<div class="tip">Quatre axes d'analyse : (1) <strong>Chronologie</strong> — quel événement précède quel autre ? (2) <strong>Causalité</strong> — pourquoi cela s'est-il produit ? (3) <strong>Point de vue</strong> — qui parle, avec quel ton ? (4) <strong>Implicite</strong> — que suggère le texte sans le dire ?</p></div>
<h3>2. Exprimer la chronologie</h3>
<pre class="pseudo">bevor (+ verbe fin)   avant que / avant de
nachdem (+ verbe fin) après que
während               pendant que
sobald                dès que
zuvor / davor         auparavant
kurz darauf           peu après</pre>
<div class="warn">Après <strong>nachdem</strong>, on emploie un temps « en avance » : Plusquamperfekt dans la subordonnée + Präteritum dans la principale. « <strong>Nachdem</strong> er gegessen <strong>hatte</strong>, <strong>ging</strong> er. » = Après qu'il eut mangé, il partit.</p></div>
<h3>3. Causes et conséquences</h3>
<pre class="pseudo">Cause :        weil / da (parce que), wegen (+ génitif),
               aufgrund (+ génitif), aus diesem Grund
Conséquence :  deshalb, sodass (de sorte que),
               infolgedessen (en conséquence), daher</pre>
<pre class="pseudo">Weil es geregnet hatte, war die Straße glatt.
   Parce qu'il avait plu, la route était glissante.
Die Straße war glatt, sodass das Auto rutschte.
   La route était glissante, de sorte que la voiture glissa.</pre>
<h3>4. Le point de vue et le ton</h3>
<p>Un fait divers n'est pas toujours neutre. Repère les mots qui trahissent une évaluation : <em>erstaunlich</em> (étonnant), <em>tragisch</em> (tragique), <em>zum Glück</em> (heureusement), <em>leider</em> (malheureusement), <em>skandalös</em> (scandaleux). Les guillemets encadrent une <strong>citation</strong> (die Aussage) qui donne un point de vue subjectif.</p>
<h3>5. Le fait divers à analyser</h3>
<p>Lis cette brève, puis nous l'analyserons.</p>
<p><strong>Vermisste Katze nach drei Jahren am anderen Ende des Landes gefunden</strong></p>
<p>Eine Familie aus Kiel erlebte vergangene Woche eine große Überraschung. Ihre Katze Minka, die vor drei Jahren spurlos verschwunden war, wurde plötzlich in München wiedergefunden, mehr als achthundert Kilometer entfernt.</p>
<p>Nachdem das Tier damals verschwunden war, hatte die Familie wochenlang gesucht, Plakate aufgehängt und schließlich die Hoffnung aufgegeben. Niemand konnte sich erklären, wie die Katze so weit gekommen war.</p>
<p>Die Lösung des Rätsels lieferte ein winziger Mikrochip. Als eine Münchnerin die magere Katze in ihrem Garten fand, brachte sie das Tier zum Tierarzt. Dieser las den Chip aus und entdeckte die Daten der ursprünglichen Besitzer. „Wir konnten es zuerst gar nicht glauben", sagte die Tochter der Familie den Reportern.</p>
<p>Wie Minka nach München gelangte, bleibt ein Rätsel. Tierexperten vermuten, dass sie sich vor drei Jahren in einem Lieferwagen versteckt hatte, der in den Süden fuhr. Zum Glück war der Chip noch aktuell, denn die Familie hatte ihre Adresse nie aus dem Register löschen lassen.</p>
<p>Inzwischen ist Minka wieder zu Hause in Kiel. „Sie hat sich kaum verändert", freute sich die Mutter. Der Fall zeigt einmal mehr, wie wichtig ein Mikrochip für Haustiere sein kann.</p>
<pre class="pseudo">vermisst           disparu(e)         spurlos      sans laisser de trace
die Überraschung   la surprise        das Plakat   l'affiche
die Hoffnung aufgeben  perdre espoir  das Rätsel   l'énigme
winzig             minuscule          mager        maigre
der Tierarzt       le vétérinaire     auslesen     lire (les données)
ursprünglich       d'origine          gelangen     parvenir
vermuten           supposer           der Lieferwagen  la camionnette
sich verstecken    se cacher          löschen      effacer
inzwischen         entre-temps        sich freuen  se réjouir</pre>`,
  exercises: [
    { type: "qcm", q: "D'où vient la famille et où la chatte a-t-elle été retrouvée ?", opts: ["de Munich, retrouvée à Kiel", "de Kiel, retrouvée à Munich", "de Berlin, retrouvée à Kiel", "de Hambourg, retrouvée à Munich"], a: 1, exp: "« Eine Familie aus Kiel ... in München wiedergefunden »." },
    { type: "input", q: "Depuis combien d'années la chatte avait-elle disparu ?", a: ["drei", "drei Jahre", "3", "3 ans", "trois"], ph: "un nombre", exp: "« die vor drei Jahren spurlos verschwunden war »." },

    { type: "input", q: "Complète : « ___ das Tier verschwunden war, hatte die Familie wochenlang gesucht. » (Après que)", a: ["Nachdem"], ph: "conjonction", exp: "nachdem = après que ; suivi du Plusquamperfekt." },
    { type: "qcm", q: "Pourquoi la puce a-t-elle fonctionné après trois ans ?", opts: ["elle avait été changée", "la famille n'avait jamais fait effacer son adresse du registre", "le vétérinaire l'avait reprogrammée", "par chance elle était neuve"], a: 1, exp: "« die Familie hatte ihre Adresse nie aus dem Register löschen lassen »." },
    { type: "qcm", q: "Quelle expression du texte marque un jugement (« heureusement ») ?", opts: ["inzwischen", "zum Glück", "spurlos", "ursprünglich"], a: 1, exp: "zum Glück = heureusement, marque le point de vue." },
    { type: "input", q: "Complète le prétérit : « Als eine Münchnerin die Katze fand, ___ sie das Tier zum Tierarzt. » (bringen = amener)", a: ["brachte"], ph: "prétérit", exp: "bringen → brachte (verbe mixte)." },
    { type: "qcm", q: "Quelle est la CAUSE du fait que la puce était encore valable ?", opts: ["le vétérinaire l'a réparée", "l'adresse n'avait jamais été effacée du registre", "la chatte était jeune", "la famille avait déménagé"], a: 1, exp: "« denn die Familie hatte ihre Adresse nie ... löschen lassen » (denn introduit la cause)." },
    { type: "qcm", q: "Quel est le message final (implicite) de l'article ?", opts: ["les chats voyagent souvent", "un Mikrochip peut être très important pour les animaux domestiques", "il faut interdire les camionnettes", "Munich est loin de Kiel"], a: 1, exp: "« wie wichtig ein Mikrochip für Haustiere sein kann »." },
    { type: "vf", q: "Selon la mère, la chatte avait énormément changé après trois ans.", a: false, exp: "« Sie hat sich kaum verändert » = elle n'a presque pas changé." },
    { type: "qcm", q: "Dans quel ordre chronologique ? A) puce lue  B) disparition  C) retrouvée à Munich", opts: ["A puis B puis C", "B puis C puis A", "C puis B puis A", "B puis A puis C"], a: 1, exp: "Disparition (B) → retrouvée à Munich (C) → puce lue par le vétérinaire (A)." },
    { type: "input", q: "Quel mot allemand du texte signifie « énigme / mystère » ?", a: ["Rätsel", "das Rätsel", "Raetsel"], ph: "un nom", exp: "das Rätsel = l'énigme ; « bleibt ein Rätsel » = reste un mystère." },
    { type: "qcm", q: "Le ton général de ce fait divers est plutôt…", opts: ["dramatique et tragique", "positif et attendrissant", "polémique et accusateur", "technique et froid"], a: 1, exp: "Retrouvailles heureuses, « zum Glück », « freute sich » : ton positif." }
  ],

<p>(Reconstitue l'ordre logique avant de répondre.)</p>`,

    solution: `<p>Ordre chronologique : <strong>e</strong> (disparition à Kiel) → <strong>b</strong> (elle se cache dans une camionnette vers Munich) → <strong>d</strong> (la famille cherche puis renonce) → <strong>c</strong> (une Munichoise la trouve dans son jardin) → <strong>a</strong> (le vétérinaire lit la puce et identifie les propriétaires) → <strong>f</strong> (Minka rentre à Kiel).</p>
<p>La <strong>cause</strong> décisive de la résolution est le <strong>Mikrochip</strong> resté valable, parce que l'adresse n'avait jamais été effacée du registre. La <strong>conséquence</strong> heureuse est le retour de la chatte. Pour analyser un fait divers, sépare toujours la <em>chronologie des faits</em> (souvent racontée dans le désordre avec des retours en arrière au Plusquamperfekt) de la <em>chaîne de causalité</em> qui les relie.</p>`
  }
