<script>
var DAY = {
  num: 17,
  title: "Débattre : nuancer et concéder",
  subtitle: "Exprimer une opinion nuancée, concéder un point et rebondir en allemand.",
  theory: `
<h3>1. Donner son opinion avec nuance</h3>
<p>Au B2, on ne se contente plus de « Ich denke, dass... ». On module son propos. Voici des formules pour introduire une opinion <strong>nuancée</strong> :</p>
<pre class="pseudo">Meiner Meinung nach ...        À mon avis ...
Ich bin der Ansicht, dass ...  Je suis d'avis que ...
Es scheint mir, dass ...       Il me semble que ...
Einerseits ... andererseits ... D'une part ... d'autre part ...
Es kommt darauf an.            Ça dépend.</pre>
<div class="tip">« Meiner Meinung nach » est suivi directement du verbe conjugué en 2e position : « Meiner Meinung nach <strong>ist</strong> das Problem komplex. » Pas de « dass » ici.</div>
<h3>2. Concéder : donner raison en partie</h3>
<p><strong>Concéder</strong>, c'est reconnaître qu'une partie de l'argument adverse est juste, avant de rebondir. C'est la marque d'un débat mature. Les connecteurs de la concession :</p>
<pre class="pseudo">zwar ... aber ...      certes ... mais ...
obwohl / obgleich      bien que (+ verbe à la fin)
trotzdem / dennoch     malgré tout / néanmoins
zugegeben, ...         il faut l'admettre, ...
das mag stimmen, aber  c'est peut-être vrai, mais</pre>
<pre class="pseudo">Zwar ist das teuer, aber es lohnt sich.
   Certes c'est cher, mais ça vaut la peine.
Obwohl er müde war, hat er weitergearbeitet.
   Bien qu'il fût fatigué, il a continué à travailler.
Das mag stimmen, aber wir müssen die Kosten bedenken.
   C'est peut-être vrai, mais il faut penser aux coûts.</pre>
<div class="warn">Après <strong>obwohl</strong> (bien que), le verbe conjugué part <strong>à la fin</strong> de la subordonnée : « Obwohl es regnet<strong>e</strong>... ». Après <strong>trotzdem</strong> en tête de phrase, il y a <strong>inversion</strong> (verbe en 2e position) : « Trotzdem <strong>gehen</strong> wir spazieren. »</p></div>
<h3>3. S'opposer poliment</h3>
<pre class="pseudo">Da bin ich anderer Meinung.       Là, je ne suis pas d'accord.
Das sehe ich anders.              Je vois ça autrement.
Ich verstehe Ihren Punkt, aber ...  Je comprends votre point, mais ...
Das ist ein guter Einwand, jedoch ...  C'est une bonne objection, cependant ...</pre>
<p>(der Einwand = l'objection · jedoch = cependant, synonyme soutenu de « aber »)</p>
<h3>4. Renforcer ou relativiser un argument</h3>
<pre class="pseudo">Renforcer :   vor allem (surtout), besonders (particulièrement),
              tatsächlich (effectivement), ohne Zweifel (sans doute)
Relativiser : eher (plutôt), teilweise (en partie),
              in gewisser Weise (dans une certaine mesure),
              nicht unbedingt (pas forcément)</pre>
<h3>5. Un échange modèle</h3>
<pre class="pseudo">A: Meiner Meinung nach sollte man das Auto in der Stadt verbieten.
B: Zwar verstehe ich das Argument, aber viele Menschen brauchen
   ihr Auto für die Arbeit.
A: Das mag stimmen. Trotzdem müssen wir die Luftverschmutzung
   reduzieren.
B: Da haben Sie recht. Vielleicht wäre ein Kompromiss besser.</pre>
<p>(verbieten = interdire · die Luftverschmutzung = la pollution de l'air · der Kompromiss = le compromis · recht haben = avoir raison)</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « Meiner Meinung nach » ?", opts: ["Selon la loi", "À mon avis", "Malgré tout", "Bien sûr"], a: 1, exp: "Meiner Meinung nach = à mon avis ; suivi du verbe en 2e position." },
    { type: "vf", q: "Après « Meiner Meinung nach », le verbe conjugué se met en 2e position (sans « dass »).", a: true, exp: "« Meiner Meinung nach ist das komplex » — inversion, pas de subordonnée." },
    { type: "input", q: "Complète : « ___ ist das teuer, aber es lohnt sich. » (certes)", a: ["Zwar", "zwar"], ph: "certes", exp: "zwar ... aber = certes ... mais (structure de concession)." },
    { type: "qcm", q: "Où se place le verbe conjugué après « obwohl » ?", opts: ["En 2e position", "À la fin de la subordonnée", "En 1re position", "Il disparaît"], a: 1, exp: "obwohl est une conjonction de subordination : verbe à la fin." },
    { type: "qcm", q: "Que signifie « der Einwand » ?", opts: ["l'accord", "l'objection", "l'exemple", "la conclusion"], a: 1, exp: "der Einwand = l'objection ; « ein guter Einwand » = une bonne objection." },
    { type: "input", q: "Complète : « Obwohl er müde war, hat er ___. » (participe de weiterarbeiten = continuer à travailler)", a: ["weitergearbeitet"], ph: "participe passé", exp: "weiterarbeiten → weitergearbeitet (particule séparable)." },
    { type: "qcm", q: "« Das sehe ich anders » exprime…", opts: ["un accord total", "un désaccord poli", "une question", "une excuse"], a: 1, exp: "Das sehe ich anders = je vois ça autrement (désaccord poli)." },
    { type: "qcm", q: "Quel connecteur signifie « néanmoins / malgré tout » ?", opts: ["zwar", "trotzdem", "vor allem", "eher"], a: 1, exp: "trotzdem / dennoch = néanmoins ; provoque l'inversion en tête." },
    { type: "vf", q: "« Trotzdem gehen wir spazieren » est correct (inversion après trotzdem en tête).", a: true, exp: "trotzdem en 1re position → verbe en 2e : gehen wir." },
    { type: "input", q: "Complète : « Ich verstehe Ihren Punkt, ___ ich sehe das anders. » (mais)", a: ["aber"], ph: "connecteur", exp: "aber = mais ; jedoch est le synonyme plus soutenu." },
    { type: "qcm", q: "Que signifie « eher » dans un débat ?", opts: ["absolument", "plutôt (relativisation)", "jamais", "surtout"], a: 1, exp: "eher = plutôt ; sert à relativiser une affirmation." },
    { type: "qcm", q: "Quelle expression sert à RENFORCER un argument ?", opts: ["teilweise", "nicht unbedingt", "ohne Zweifel", "in gewisser Weise"], a: 2, exp: "ohne Zweifel = sans aucun doute (renforcement)." },
    { type: "qcm", q: "« Das mag stimmen, aber... » signifie…", opts: ["C'est faux, donc...", "C'est peut-être vrai, mais...", "Je ne sais pas si...", "C'est certain que..."], a: 1, exp: "Das mag stimmen = c'est possiblement vrai (concession) ; aber introduit le rebond." },
    { type: "qcm", q: "Compréhension : « Zwar verstehe ich das Argument, aber viele brauchen ihr Auto. » Quelle est l'attitude du locuteur ?", opts: ["Il rejette totalement l'argument", "Il concède un point puis objecte", "Il change de sujet", "Il pose une question"], a: 1, exp: "zwar ... aber : il reconnaît l'argument (concession) puis apporte une objection." },
    { type: "input", q: "Complète : « Da haben Sie ___. » (raison — expression figée : avoir raison)", a: ["recht", "Recht"], ph: "avoir ___", exp: "recht haben = avoir raison." }
  ],
  final: {
    title: "Exercice final — Eine Debatte über das Homeoffice",
    intro: `<p>Lis ce court débat sur le télétravail, puis réponds.</p>
<pre class="pseudo">A: Meiner Meinung nach ist das Homeoffice die Zukunft der Arbeit.
   Man spart Zeit und ist oft produktiver zu Hause.
B: Zwar sehe ich die Vorteile, aber ich glaube, dass der Kontakt
   im Team darunter leidet. Man fühlt sich schnell isoliert.
A: Das mag stimmen. Trotzdem sollte jeder selbst entscheiden dürfen.
   Nicht jeder braucht ein Büro.
B: Da haben Sie recht. Vielleicht wäre eine Mischung aus Büro und
   Homeoffice der beste Kompromiss.</pre>
<p>(die Zukunft = l'avenir · sparen = économiser · darunter leiden = en souffrir · sich isoliert fühlen = se sentir isolé · die Mischung = le mélange)</p>`,
    questions: [
      { type: "qcm", q: "Quelle est l'opinion de A sur le télétravail ?", opts: ["C'est dépassé", "C'est l'avenir du travail", "C'est interdit", "C'est trop cher"], a: 1, exp: "« das Homeoffice ist die Zukunft der Arbeit »." },
      { type: "qcm", q: "Quel inconvénient B soulève-t-il ?", opts: ["Le coût élevé", "Le contact dans l'équipe en souffre", "La lenteur d'internet", "Le bruit"], a: 1, exp: "« der Kontakt im Team leidet darunter »." },
      { type: "vf", q: "A concède le point de B avec « Das mag stimmen ».", a: true, exp: "« Das mag stimmen. Trotzdem... » : concession puis rebond." },
      { type: "qcm", q: "Quel compromis B propose-t-il à la fin ?", opts: ["Tout en présentiel", "Tout en télétravail", "Un mélange bureau et télétravail", "Supprimer le télétravail"], a: 2, exp: "« eine Mischung aus Büro und Homeoffice »." },
      { type: "input", q: "Quel mot allemand du texte signifie « certes » (concession) ?", a: ["Zwar", "zwar"], ph: "un mot", exp: "« Zwar sehe ich die Vorteile, aber... »." }
    ],
    solution: `<p>A pense que le télétravail (das Homeoffice) est l'avenir du travail : on gagne du temps et on est souvent plus productif. B concède les avantages (« Zwar sehe ich die Vorteile ») mais objecte que le contact dans l'équipe en souffre et qu'on se sent vite isolé. A concède à son tour (« Das mag stimmen ») puis rebondit (« Trotzdem... ») : chacun devrait pouvoir décider. Finalement, B propose un compromis : un mélange de bureau et de télétravail.</p>
<p>C'est un débat B2 typique : chaque intervenant <strong>concède</strong> (zwar/aber, das mag stimmen) avant de <strong>rebondir</strong> (trotzdem), et l'on aboutit à un <strong>Kompromiss</strong>. Repère la structure « zwar ... aber ... » et l'inversion après « trotzdem ».</p>`
  }
};
</script>
