<script>
var DAY = {
  num: 4,
  title: "Le passif d'état (Zustandspassiv)",
  subtitle: "Distinguer l'action qui se déroule (werden) du résultat qui dure (sein).",
  theory: `
<h3>1. Deux passifs, deux perspectives</h3>
<p>L'allemand distingue nettement deux passifs. Le <strong>Vorgangspassiv</strong> (passif de processus, avec <em>werden</em>) décrit une <strong>action en train de se faire</strong>. Le <strong>Zustandspassiv</strong> (passif d'état, avec <em>sein</em>) décrit le <strong>résultat</strong> de cette action, un état qui dure.</p>
<pre class="pseudo">Vorgangspassiv : Die Tür wird geschlossen.   La porte est en train d'être fermée. (action)
Zustandspassiv : Die Tür ist geschlossen.    La porte est fermée. (état, résultat)</pre>
<div class="tip">Astuce : remplace mentalement par le français. « est fermée = on la ferme (action) » → werden. « est fermée = elle est close (état) » → sein. Le contexte tranche.</div>
<h3>2. Former le Zustandspassiv</h3>
<p>C'est simple : <strong>sein (conjugué) + participe passé</strong>. Le participe fonctionne presque comme un adjectif décrivant l'état du sujet.</p>
<pre class="pseudo">Das Fenster ist geöffnet.         La fenêtre est ouverte.
Die Rechnung ist bezahlt.         La facture est payée.
Die Aufgaben sind erledigt.       Les tâches sont accomplies.
Der Brief war schon geschrieben.  La lettre était déjà écrite. (Präteritum)</pre>
<div class="warn">Ne confonds pas avec le Perfekt actif ! « Die Tür ist geschlossen » (état : elle est fermée) ≠ « Die Tür hat sich geschlossen » (action réfléchie). Le Zustandspassiv décrit le <strong>résultat</strong>, sans se soucier de qui a agi.</div>
<h3>3. Comparer les deux passifs au fil du temps</h3>
<pre class="pseudo">1. Man repariert das Auto.          On répare la voiture. (actif)
2. Das Auto wird repariert.         La voiture est (en train d'être) réparée. (Vorgangspassiv)
3. Das Auto ist repariert.          La voiture est réparée. (Zustandspassiv : c'est fini)</pre>
<p>Le Vorgangspassiv (étape 2) filme l'action ; le Zustandspassiv (étape 3) photographie le résultat une fois l'action terminée.</p>
<h3>4. Les temps du Zustandspassiv</h3>
<pre class="pseudo">Présent :     Das Geschäft ist geschlossen.       Le magasin est fermé.
Prétérit :    Das Geschäft war geschlossen.        Le magasin était fermé.
Perfekt :     Das Geschäft ist geschlossen gewesen. (rare)</pre>
<p>En pratique, on reste surtout au <strong>présent</strong> (ist + participe) et au <strong>prétérit</strong> (war + participe).</p>
<h3>5. Quand employer quoi ?</h3>
<p>On choisit le Zustandspassiv quand ce qui compte est l'<strong>état résultant</strong>, pas l'agent ni le déroulement :</p>
<pre class="pseudo">Vorsicht, der Boden ist frisch gewischt!   Attention, le sol vient d'être lavé !
Alle Vorbereitungen sind getroffen.        Tous les préparatifs sont pris.
Das Problem ist gelöst.                    Le problème est résolu.</pre>
<div class="tip">Petit test infaillible : si tu peux ajouter « gerade » (juste maintenant, en ce moment) → c'est l'action → werden. Si tu décris un état stable → sein. « Das Auto wird <strong>gerade</strong> repariert » vs « Das Auto <strong>ist</strong> repariert ».</div>`,
  exercises: [
    { type: "qcm", q: "Le Zustandspassiv (passif d'état) se forme avec…", opts: ["werden + participe", "sein + participe", "haben + participe", "würde + infinitif"], a: 1, exp: "sein + participe passé décrit l'état résultant." },
    { type: "qcm", q: "« Die Tür wird geschlossen » décrit…", opts: ["un état durable", "une action en train de se faire", "un ordre", "le passé"], a: 1, exp: "werden = Vorgangspassiv = action en cours (la porte est en train d'être fermée)." },
    { type: "qcm", q: "« Die Tür ist geschlossen » décrit…", opts: ["une action en cours", "l'état résultant : la porte est fermée", "un futur", "une hypothèse"], a: 1, exp: "sein + participe = Zustandspassiv = résultat/état." },
    { type: "input", q: "Complète le passif d'état : « Die Rechnung ___ bezahlt. » (auxiliaire, présent)", a: ["ist"], ph: "auxiliaire", exp: "Zustandspassiv présent : ist + bezahlt." },
    { type: "input", q: "Complète le passif d'état au prétérit : « Der Brief ___ schon geschrieben. »", a: ["war"], ph: "auxiliaire", exp: "Zustandspassiv passé : war + geschrieben." },
    { type: "qcm", q: "Étape finale du processus : « Das Auto ___ repariert » (c'est terminé, résultat).", opts: ["wird", "ist", "hat", "würde"], a: 1, exp: "Résultat achevé → sein : Das Auto ist repariert." },
    { type: "vf", q: "Le Vorgangspassiv filme l'action, le Zustandspassiv photographie le résultat.", a: true, exp: "werden = déroulement ; sein = état résultant." },
    { type: "input", q: "Passif d'état pluriel : « Alle Aufgaben ___ erledigt. » (auxiliaire, présent)", a: ["sind"], ph: "auxiliaire", exp: "Sujet pluriel : sind + erledigt." },
    { type: "qcm", q: "Quel mot révèle qu'on a affaire à une action (werden) et non à un état ?", opts: ["schon", "gerade", "immer", "nie"], a: 1, exp: "gerade (en ce moment) accompagne l'action en cours : wird gerade repariert." },
    { type: "input", q: "État résultant : « Das Problem ___ gelöst. » (le problème est résolu)", a: ["ist"], ph: "auxiliaire", exp: "Résultat → sein : ist gelöst." },
    { type: "qcm", q: "« Vorsicht, der Boden ist frisch gewischt! » exprime…", opts: ["qu'on lave le sol en ce moment", "l'état résultant : le sol vient d'être lavé (il est mouillé)", "qu'on va laver le sol", "qu'on ne doit pas laver le sol"], a: 1, exp: "Zustandspassiv : on décrit l'état du sol maintenant." },
    { type: "vf", q: "« Das Auto wird gerade repariert » et « Das Auto ist repariert » disent exactement la même chose.", a: false, exp: "Le premier = action en cours (werden), le second = résultat terminé (sein). Sens différents." },
    { type: "qcm", q: "Traduis « Le magasin était fermé » (état passé) :", opts: ["Das Geschäft wird geschlossen", "Das Geschäft war geschlossen", "Das Geschäft hat geschlossen", "Das Geschäft wurde schließen"], a: 1, exp: "État passé → war + participe : war geschlossen." },
    { type: "input", q: "Complète : « Alle Vorbereitungen ___ getroffen. » (tous les préparatifs sont pris ; auxiliaire pluriel)", a: ["sind"], ph: "auxiliaire", exp: "Zustandspassiv pluriel : sind getroffen." },
    { type: "qcm", q: "Actif : « Man öffnet das Fenster. » Zustandspassiv correspondant ?", opts: ["Das Fenster wird geöffnet.", "Das Fenster ist geöffnet.", "Das Fenster hat geöffnet.", "Das Fenster öffnet sich."], a: 1, exp: "État résultant : Das Fenster ist geöffnet." }
  ],
  final: {
    title: "Exercice final — Im Büro nach Feierabend",
    intro: `<p>Un employé fait le tour du bureau en fin de journée. Distingue action et état.</p>
<pre class="pseudo">Es ist 18 Uhr. Die meiste Arbeit ist getan. Die E-Mails sind beantwortet und
die wichtigen Dokumente sind bereits gedruckt. Im Nebenraum wird noch ein Bericht
geschrieben, aber das ist die Ausnahme. Die Fenster sind geschlossen, die Computer
sind heruntergefahren. Nur die Kaffeemaschine wird gerade gereinigt. Als der letzte
Kollege geht, ist das Licht schon ausgeschaltet und die Tür ist abgeschlossen.</pre>
<p>(der Bericht = le rapport · herunterfahren = éteindre (un ordinateur) · abschließen = fermer à clé)</p>`,
    questions: [
      { type: "qcm", q: "« Die E-Mails sind beantwortet » est un…", opts: ["Vorgangspassiv (action)", "Zustandspassiv (état résultant : elles sont répondues)", "actif", "impératif"], a: 1, exp: "sein + participe = état : le travail de réponse est terminé." },
      { type: "qcm", q: "« Im Nebenraum wird noch ein Bericht geschrieben » indique…", opts: ["que le rapport est fini", "qu'un rapport est en train d'être écrit (action en cours)", "qu'on ne l'écrira pas", "un état durable"], a: 1, exp: "werden = Vorgangspassiv = action en train de se dérouler." },
      { type: "input", q: "Relève l'auxiliaire du passif d'état : « die Tür ___ abgeschlossen ».", a: ["ist"], ph: "auxiliaire", exp: "État résultant : ist + abgeschlossen." },
      { type: "qcm", q: "Pourquoi « Nur die Kaffeemaschine wird gerade gereinigt » emploie-t-il werden ?", opts: ["parce que c'est un état", "parce que gerade signale une action en cours", "par erreur", "parce que c'est le futur"], a: 1, exp: "gerade + werden = action en train de se faire, contrastant avec les états environnants." },
      { type: "vf", q: "Dans ce texte, sein + participe (getan, beantwortet, geschlossen) décrit des résultats acquis, tandis que werden + participe décrit ce qui se fait encore.", a: true, exp: "C'est exactement la distinction Zustandspassiv / Vorgangspassiv." }
    ],
    solution: `<p>Le texte oppose systématiquement les deux passifs. Les <strong>états acquis</strong> emploient sein + participe : ist getan, sind beantwortet, sind gedruckt, sind geschlossen, sind heruntergefahren, ist ausgeschaltet, ist abgeschlossen. Les <strong>actions encore en cours</strong> emploient werden : wird geschrieben, wird gerade gereinigt.</p>
<p>Retiens le réflexe : décris-tu un <em>résultat</em> (photo) ou un <em>déroulement</em> (film) ? Le mot <strong>gerade</strong> est un excellent révélateur du Vorgangspassiv.</p>`
  }
};
</script>

    solution: "Es ist fast sieben Uhr, und alles ist für die Feier vorbereitet. Der große Tisch ist bereits gedeckt, die Gläser sind poliert und die Kerzen sind angezündet. Die Einladungen waren schon vor einer Woche verschickt worden, deshalb kommen viele Gäste. Die Musik ist ausgewählt und die Playlist ist gespeichert. In der Küche wird allerdings noch gekocht, denn der Nachtisch ist nicht ganz fertig. Die Fenster sind geöffnet, damit frische Luft hereinkommt. Als der erste Gast klingelt, ist das ganze Haus geschmückt und die Stimmung ist perfekt.\n\n(Traduction : Il est presque sept heures, et tout est préparé pour la fête. La grande table est déjà mise, les verres sont astiqués et les bougies sont allumées. Les invitations avaient déjà été envoyées il y a une semaine, c'est pourquoi beaucoup d'invités viennent. La musique est choisie et la playlist est enregistrée. Dans la cuisine, on cuisine cependant encore, car le dessert n'est pas tout à fait prêt. Les fenêtres sont ouvertes pour que de l'air frais entre. Quand le premier invité sonne, toute la maison est décorée et l'ambiance est parfaite.)",
