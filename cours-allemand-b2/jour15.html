<script>
var DAY = {
  num: 15,
  title: "L'entretien d'embauche approfondi (méthode STAR)",
  subtitle: "Structurer ses réponses en entretien : Situation, Tâche, Action, Résultat.",
  theory: `
<h3>1. Le Vorstellungsgespräch : ce qu'on attend de vous</h3>
<p>Dans un entretien d'embauche allemand (Vorstellungsgespräch), on attend des réponses <strong>structurées, concrètes et honnêtes</strong>. Les recruteurs posent souvent des questions comportementales (« Erzählen Sie von einer Situation, in der ... »). Pour y répondre sans se perdre, une méthode s'impose : la <strong>méthode STAR</strong>.</p>
<h3>2. La méthode STAR</h3>
<pre class="pseudo">S — Situation : décrire le contexte    (Die Situation war ...)
T — Tâche (Aufgabe) : quel était le défi (Meine Aufgabe war es, ...)
A — Action (Handlung) : ce que J'AI fait (Deshalb habe ich ...)
R — Résultat (Ergebnis) : le bilan chiffré/concret (Das Ergebnis war, dass ...)</pre>
<div class="tip">STAR force à raconter une histoire complète en 4 étapes, en insistant sur <strong>ce que TU as fait</strong> (« ich », pas « wir ») et sur un <strong>résultat mesurable</strong>. C'est la trame idéale pour toute question du type « Donnez un exemple de... ».</div>
<h3>3. Un exemple de réponse STAR</h3>
<p>Question : « Erzählen Sie von einer Herausforderung, die Sie gemeistert haben. »</p>
<pre class="pseudo">Situation : In meinem letzten Job hatten wir einen wichtigen Kunden, der mit der
            Lieferzeit sehr unzufrieden war.
Aufgabe :   Meine Aufgabe war es, sein Vertrauen zurückzugewinnen und die Verzögerung
            zu erklären.
Handlung :  Deshalb habe ich sofort ein persönliches Gespräch vereinbart, den Fehler
            offen zugegeben und einen neuen, realistischen Zeitplan vorgeschlagen.
Ergebnis :  Das Ergebnis war, dass der Kunde blieb und im nächsten Jahr sogar mehr
            bestellte. Ich habe daraus gelernt, wie wichtig offene Kommunikation ist.</pre>
<h3>4. Les questions classiques et comment y répondre</h3>
<pre class="pseudo">Erzählen Sie etwas über sich.        → parcours + motivation, bref et ciblé
Was sind Ihre Stärken?               → 2-3 forces + un exemple concret (STAR)
Was sind Ihre Schwächen?             → une vraie faiblesse + comment on y travaille
Warum möchten Sie bei uns arbeiten?  → montrer qu'on connaît l'entreprise
Wo sehen Sie sich in fünf Jahren?    → ambition réaliste, alignée sur le poste
Haben Sie Fragen an uns?             → TOUJOURS en avoir une (sur l'équipe, les tâches)</pre>
<div class="warn">Pour les faiblesses (Schwächen), évite la fausse modestie (« Ich bin zu perfektionistisch »). Nomme une vraie faiblesse et surtout <strong>montre ce que tu fais pour progresser</strong> : c'est cela qui rassure le recruteur.</div>
<h3>5. Le vocabulaire et les formules de l'entretien</h3>
<pre class="pseudo">Se présenter :  Ich habe eine Ausbildung als ... / Ich bringe Erfahrung in ... mit.
Ses qualités :  Ich bin belastbar / teamfähig / zuverlässig / lösungsorientiert.
Motiver :       Ihr Unternehmen reizt mich, weil ... / Ich schätze besonders, dass ...
Poser question : Wie sieht ein typischer Arbeitstag aus?
                Welche Entwicklungsmöglichkeiten bietet die Stelle?
Clôturer :      Vielen Dank für das Gespräch. Ich habe einen sehr guten Eindruck.</pre>
<div class="tip">Prépare 2 ou 3 histoires STAR à l'avance (un succès, un conflit résolu, une erreur dont tu as tiré une leçon). Bien rodées, elles répondent à la plupart des questions comportementales. C'est le meilleur entraînement possible avant un Vorstellungsgespräch.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme STAR ?", opts: ["Stärke, Talent, Arbeit, Rolle", "Situation, Tâche (Aufgabe), Action (Handlung), Résultat (Ergebnis)", "Start, Termin, Antwort, Rede", "Situation, Team, Antwort, Rückblick"], a: 1, exp: "Situation - Aufgabe - Handlung - Ergebnis : la trame d'une réponse structurée." },
    { type: "qcm", q: "Dans la méthode STAR, sur quoi faut-il surtout insister à l'étape « Action » ?", opts: ["ce que l'équipe a fait (wir)", "ce que TU as fait personnellement (ich)", "le contexte général", "les erreurs des autres"], a: 1, exp: "L'étape Handlung met en avant ton action personnelle (ich)." },
    { type: "input", q: "Complète l'étape Situation : « Die ___ war, dass ein Kunde unzufrieden war. » (nom : situation)", a: ["Situation"], ph: "nom", exp: "On plante d'abord le décor : die Situation war ..." },
    { type: "input", q: "Complète l'étape Tâche : « Meine ___ war es, sein Vertrauen zurückzugewinnen. » (nom : mission/tâche)", a: ["Aufgabe"], ph: "nom", exp: "die Aufgabe = la tâche/mission (le T de STAR)." },
    { type: "qcm", q: "Comment doit idéalement se terminer une réponse STAR ?", opts: ["par une excuse", "par un résultat concret / mesurable et une leçon apprise", "par une question", "sans conclusion"], a: 1, exp: "L'étape Ergebnis donne un résultat concret, idéalement chiffré, + un apprentissage." },
    { type: "input", q: "Complète l'étape Action : « ___ habe ich sofort ein Gespräch vereinbart. » (connecteur : c'est pourquoi)", a: ["Deshalb"], ph: "connecteur", exp: "Deshalb introduit l'action entreprise (avec inversion)." },
    { type: "vf", q: "Il vaut mieux préparer à l'avance 2 ou 3 histoires STAR pour répondre aux questions comportementales.", a: true, exp: "Des exemples bien rodés couvrent la plupart des questions « Erzählen Sie von... »." },
    { type: "qcm", q: "Pour la question sur les faiblesses (Schwächen), la meilleure stratégie est…", opts: ["dire qu'on n'en a pas", "citer une fausse faiblesse flatteuse (« zu perfektionistisch »)", "nommer une vraie faiblesse et montrer comment on y travaille", "changer de sujet"], a: 2, exp: "Honnêteté + démarche de progrès : c'est ce qui rassure le recruteur." },
    { type: "qcm", q: "À la question « Haben Sie Fragen an uns? », il faut…", opts: ["toujours répondre non", "toujours avoir une question préparée (équipe, tâches, évolution)", "poser une question sur le salaire uniquement", "quitter la pièce"], a: 1, exp: "Ne pas avoir de question donne l'impression d'un manque d'intérêt." },
    { type: "input", q: "Complète : « Ich bin ___ und arbeite gern im Team. » (adjectif : apte au travail d'équipe)", a: ["teamfähig","teamfaehig"], ph: "adjectif", exp: "teamfähig = capable de travailler en équipe." },
    { type: "qcm", q: "« Ich bin belastbar » signifie…", opts: ["je suis fatigué", "je résiste bien au stress / à la pression", "je suis lent", "je suis riche"], a: 1, exp: "belastbar = résistant au stress, endurant." },
    { type: "input", q: "Complète la motivation : « Ihr Unternehmen ___ mich, weil ... » (verbe : attirer)", a: ["reizt"], ph: "verbe", exp: "reizen = attirer, séduire : Ihr Unternehmen reizt mich = votre entreprise m'attire." },
    { type: "qcm", q: "Quelle question POSER au recruteur est pertinente ?", opts: ["Wann kann ich Urlaub nehmen?", "Wie sieht ein typischer Arbeitstag aus?", "Muss ich wirklich pünktlich sein?", "Ist der Chef nett?"], a: 1, exp: "Une question sur le poste (journée type, tâches, évolution) montre l'intérêt." },
    { type: "vf", q: "Dans la méthode STAR, l'étape « Ergebnis » (résultat) peut inclure ce qu'on a appris de l'expérience.", a: true, exp: "Ajouter la leçon tirée renforce la réponse et montre une capacité de recul." },
    { type: "input", q: "Complète la clôture : « Vielen Dank für das ___. » (nom : entretien)", a: ["Gespräch","Gespraech"], ph: "nom", exp: "das Gespräch = l'entretien/la conversation : Danke für das Gespräch." }
  ],
  final: {
    title: "Exercice final — Eine STAR-Antwort analysieren",
    intro: `<p>Un candidat répond à la question « Erzählen Sie von einem Konflikt, den Sie gelöst haben. » Repère les quatre étapes STAR.</p>
<pre class="pseudo">In meinem vorherigen Team gab es einen Streit zwischen zwei Kollegen, der die
Zusammenarbeit stark beeinträchtigte. Als Teamleiter war es meine Aufgabe, wieder eine
gute Arbeitsatmosphäre herzustellen. Deshalb habe ich zunächst mit beiden einzeln
gesprochen, um ihre Sichtweisen zu verstehen. Anschließend habe ich ein gemeinsames
Gespräch moderiert und klare Regeln für die Zusammenarbeit vereinbart. Das Ergebnis
war, dass sich die Stimmung innerhalb weniger Wochen deutlich verbesserte und das
Projekt pünktlich abgeschlossen wurde. Ich habe daraus gelernt, dass frühes Eingreifen
und offene Gespräche die besten Mittel gegen Konflikte sind.</pre>
<p>(beeinträchtigen = nuire à · die Sichtweise = le point de vue · eingreifen = intervenir)</p>`,
    questions: [
      { type: "qcm", q: "Quelle phrase correspond à l'étape « Situation » ?", opts: ["Meine Aufgabe war es, ...", "In meinem Team gab es einen Streit ..., der die Zusammenarbeit beeinträchtigte", "Deshalb habe ich ... gesprochen", "Das Ergebnis war ..."], a: 1, exp: "La Situation pose le contexte : un conflit qui nuisait à la collaboration." },
      { type: "input", q: "Relève le mot qui ouvre l'étape « Tâche » : « Meine ___ war es, eine gute Atmosphäre herzustellen. »", a: ["Aufgabe"], ph: "nom", exp: "Meine Aufgabe war es... = étape T (Tâche)." },
      { type: "qcm", q: "L'étape « Action » (Handlung) est marquée par quelles démarches ?", opts: ["ne rien faire", "parler d'abord à chacun séparément puis modérer un entretien commun avec des règles claires", "renvoyer les deux collègues", "attendre que ça passe"], a: 1, exp: "Deshalb habe ich ... : les actions personnelles concrètes du candidat." },
      { type: "input", q: "Relève le mot qui ouvre l'étape « Résultat » : « Das ___ war, dass sich die Stimmung verbesserte. »", a: ["Ergebnis"], ph: "nom", exp: "Das Ergebnis war... = étape R (Résultat)." },
      { type: "vf", q: "La réponse se termine par une leçon tirée de l'expérience, ce qui renforce l'impression de maturité professionnelle.", a: true, exp: "« Ich habe daraus gelernt, dass... » ajoute une prise de recul appréciée en entretien." }
    ],
    solution: `<p>La réponse suit parfaitement la méthode STAR. <strong>Situation</strong> : un conflit entre deux collègues nuisant à la collaboration. <strong>Aufgabe</strong> : rétablir une bonne ambiance (Meine Aufgabe war es, ...). <strong>Handlung</strong> : parler à chacun séparément, puis modérer un entretien commun et fixer des règles (Deshalb habe ich ...). <strong>Ergebnis</strong> : l'ambiance s'améliore en quelques semaines et le projet est livré à temps (Das Ergebnis war, dass ...), complété par une leçon (Ich habe daraus gelernt, dass ...).</p>
<p>Remarque l'emploi de « ich » à l'étape Action (c'est TON action qui compte) et le résultat concret et daté. Prépare 2 ou 3 histoires de ce type : elles te serviront pour la majorité des questions d'un Vorstellungsgespräch.</p>`
  }
};
</script>
