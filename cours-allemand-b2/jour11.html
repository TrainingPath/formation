  theory: `
<h3>1. Pourquoi apprendre les Redewendungen ?</h3>
<p>Une <strong>Redewendung</strong> (expression idiomatique) a un sens figuré qui ne se déduit pas des mots. « Ich verstehe nur Bahnhof » ne parle pas de gare : ça veut dire « je n'y comprends rien ». Les natifs en usent constamment ; les reconnaître est indispensable pour comprendre films, articles et conversations réelles.</p>
<div class="tip">Ne cherche jamais à traduire une Redewendung mot à mot vers le français : cherche l'<strong>équivalent</strong> français. « Da liegt der Hund begraben » (là est enterré le chien) = « c'est là que le bât blesse ».</div>
<h3>2. Redewendungen du quotidien</h3>
<pre class="pseudo">Ich verstehe nur Bahnhof.        Je n'y comprends rien.
Das ist mir Wurst.               Ça m'est égal. (fam.)
Die Daumen drücken.              Croiser les doigts (pour qqn).
Tomaten auf den Augen haben.     Ne pas voir l'évidence.
Ins Fettnäpfchen treten.         Faire une gaffe.
Jemandem die Daumen drücken.     Souhaiter bonne chance à qqn.
Alles in Butter.                 Tout va bien. (fam.)</pre>
<h3>3. Redewendungen avec des animaux</h3>
<pre class="pseudo">Da liegt der Hund begraben.      C'est là le noeud du problème.
Die Katze im Sack kaufen.        Acheter chat en poche (sans vérifier).
Schwein haben.                   Avoir de la chance / du bol.
Einen Bären aufbinden.           Faire gober une histoire, mener en bateau.
Aus einer Mücke einen Elefanten machen.  Faire une montagne d'un rien.</pre>
<h3>4. Redewendungen imagées plus soutenues</h3>
<pre class="pseudo">den Nagel auf den Kopf treffen.   Taper dans le mille, voir juste.
das Kind mit dem Bade ausschütten. Jeter le bébé avec l'eau du bain.
etwas auf die lange Bank schieben. Remettre aux calendes grecques.
die Flinte ins Korn werfen.        Baisser les bras, jeter l'éponge.
mit dem Feuer spielen.             Jouer avec le feu.
das A und O.                       L'essentiel, l'alpha et l'oméga.</pre>
<div class="warn">Beaucoup de Redewendungen sont <strong>figées</strong> : on ne change ni le nombre ni l'article. On dit « die Flinte ins Korn werfen », pas « eine Flinte ». Apprends-les telles quelles.</p></div>
<h3>5. Reconnaître le registre</h3>
<p>Certaines sont familières (Das ist mir Wurst, Alles in Butter), d'autres neutres ou soutenues (den Nagel auf den Kopf treffen, das A und O). Employer une expression familière dans un contexte formel fait mauvais effet, comme en français.</p>
<pre class="pseudo">Familier :  Das ist mir Wurst. / Ich hab Schwein gehabt.
Neutre :    Du hast den Nagel auf den Kopf getroffen.
Soutenu :   Das ist das A und O jeder guten Planung.</pre>
<div class="tip">Stratégie B2 : vise d'abord la <strong>compréhension passive</strong> des Redewendungen (les reconnaître à l'écoute et à la lecture), puis introduis-en quelques-unes, bien maîtrisées, dans ta production. Une expression bien placée impressionne ; une expression déformée trahit.</div>`,
  exercises: [

    intro: `<p>Deux collègues discutent d'un projet difficile. Décrypte les Redewendungen.</p>
<pre class="pseudo">— Ehrlich gesagt, bei diesem Projekt verstehe ich nur Bahnhof.

<p>(ehrlich gesagt = à vrai dire · aufgeben = abandonner · schaffen = réussir, y arriver)</p>`,

    ],
    solution: `<p>Le dialogue enchaîne cinq Redewendungen très courantes : <strong>nur Bahnhof verstehen</strong> (ne rien comprendre), <strong>da liegt der Hund begraben</strong> (voilà le noeud du problème), <strong>den Nagel auf den Kopf treffen</strong> (voir parfaitement juste), <strong>die Flinte ins Korn werfen</strong> (baisser les bras), <strong>auf die lange Bank schieben</strong> (repousser), <strong>mit dem Feuer spielen</strong> (prendre un gros risque) et <strong>jemandem die Daumen drücken</strong> (souhaiter bonne chance).</p>
<p>Aucune ne se traduit littéralement : le sens est entièrement figuré et figé. En reconnaître le sens à la volée, c'est comprendre l'allemand vivant tel qu'on le parle vraiment.</p>`
