<script>
var DAY = {
  num: 30,
  title: "Projet final (4) : conversation fluide de 15 minutes",
  subtitle: "Tenir une conversation naturelle en allemand : trame, relances et fluidité.",
  theory: `
<h3>Le projet final : parler 15 minutes sans blocage</h3>
<p>Dernier jour, dernier projet : tenir une <strong>conversation fluide de quinze minutes</strong> en allemand. Le secret n'est pas de tout savoir, mais de <strong>rebondir</strong>, <strong>gagner du temps</strong> et <strong>relancer</strong>. Voici la trame et les outils. Félicitations d'être arrivé jusqu'ici !</p>
<h3>1. La trame d'une conversation (der Gesprächsverlauf)</h3>
<pre class="pseudo">1. Small talk        Wie geht's? Schönes Wetter heute, oder?
2. Einstieg          Introduire un sujet : Sag mal, ...
3. Themen vertiefen  Approfondir : Und was denkst du über ...?
4. Meinungen         Opinions : Ich finde ..., weil ...
5. Erfahrungen teilen  Anecdotes : Das erinnert mich an ...
6. Abschluss         Clôturer : Es war schön, mit dir zu reden.</pre>
<h3>2. Les « gap-fillers » : gagner du temps</h3>
<p>Ces petits mots comblent les silences pendant que tu réfléchis. Ils te font paraître fluide et naturel, comme un locuteur natif.</p>
<pre class="pseudo">also ...           alors / eh bien ...      eigentlich ...   en fait ...
ich meine ...      je veux dire ...         na ja ...        eh bien ...
weißt du, ...      tu sais, ...             wie soll ich sagen  comment dire
sagen wir mal ...  disons ...               genau            exactement
lass mich überlegen  laisse-moi réfléchir   im Grunde        au fond</pre>
<div class="tip">Un natif ne parle pas sans hésiter : il dit « also... », « ähm... », « na ja... ». Utiliser ces gap-fillers est un signe de fluidité, pas de faiblesse ! Ils t'évitent les blancs stressants.</p></div>
<h3>3. Les relances : faire rebondir l'échange</h3>
<pre class="pseudo">Und du?                        Et toi ?
Was meinst du dazu?            Qu'en penses-tu ?
Wie war das bei dir?          Comment ça s'est passé pour toi ?
Kannst du das genauer erklären?  Peux-tu préciser ?
Echt? Erzähl mal!             Vraiment ? Raconte !
Wie kommst du darauf?         Qu'est-ce qui te fait dire ça ?</pre>
<h3>4. Réagir et montrer qu'on écoute (Rückmeldungen)</h3>
<pre class="pseudo">Ach so!         Ah d'accord !     Interessant!    Intéressant !
Verstehe.       Je vois.          Genau!         Exactement !
Das stimmt.     C'est vrai.       Oh, wirklich?  Oh, vraiment ?
Das kann ich gut verstehen.  Je comprends très bien.</pre>
<div class="warn">Écouter activement, c'est aussi parler : glisse un « mhm », « ach so », « genau » régulièrement. Sans ces signaux, ton interlocuteur croit que tu ne suis pas.</p></div>
<h3>5. Gérer une panne : ne jamais rester bloqué</h3>
<pre class="pseudo">Wie sagt man das noch mal?        Comment dit-on déjà ?
Mir fällt das Wort gerade nicht ein.  Le mot ne me revient pas.
Ich meine so etwas wie ...        Je veux dire quelque chose comme ...
Können Sie das anders sagen?      Pouvez-vous le dire autrement ?
Entschuldigung, wie bitte?        Pardon, comment ?</pre>
<p>La <strong>paraphrase</strong> est ton arme : si tu ne connais pas « der Regenschirm » (le parapluie), dis « das Ding gegen den Regen » (la chose contre la pluie). On te comprendra, et la conversation continue.</p>
<h3>6. Un extrait de conversation fluide</h3>
<pre class="pseudo">A: Sag mal, warst du eigentlich schon mal in Deutschland?
B: Ja, also, letztes Jahr war ich in Berlin. Wie soll ich sagen —
   die Stadt hat mich total begeistert.
A: Echt? Erzähl mal! Was hat dir am besten gefallen?
B: Na ja, im Grunde die Mischung aus Geschichte und modernem Leben.
   Ich meine, an jeder Ecke spürt man die Vergangenheit. Und du?
   Kennst du Berlin?
A: Nur vom Durchreisen, ehrlich gesagt. Aber ich würde gern mal
   länger bleiben. Was meinst du, lohnt sich ein Winterbesuch?
B: Also, ehrlich? Im Winter ist es ziemlich kalt, aber die
   Weihnachtsmärkte sind wunderschön. Das kann ich echt empfehlen.</pre>
<p>(begeistern = enthousiasmer · die Vergangenheit = le passé · vom Durchreisen = en passant · sich lohnen = valoir la peine · empfehlen = recommander)</p>
<h3>7. Ton auto-bilan B2</h3>
<pre class="pseudo">□ Je peux me présenter et parler de mon parcours (jour 16).
□ Je sais donner une opinion nuancée et concéder (jours 17, 25).
□ Je comprends un article de fond et un fait divers (jours 18-20, 27-28).
□ J'emploie le Konjunktiv II et le passif correctement (jours 24, 26).
□ Je réagis avec des gap-fillers et des relances (jour 30).
□ Quand un mot me manque, je paraphrase au lieu de me bloquer.</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi servent les « gap-fillers » (also, na ja, eigentlich) ?", opts: ["à corriger la grammaire", "à gagner du temps et paraître fluide", "à conclure la conversation", "à poser une question"], a: 1, exp: "Ils comblent les silences pendant qu'on réfléchit : signe de fluidité." },
    { type: "qcm", q: "Que signifie « eigentlich » comme gap-filler ?", opts: ["jamais", "en fait", "bien sûr", "tout de suite"], a: 1, exp: "eigentlich = en fait, à vrai dire." },
    { type: "input", q: "Complète un gap-filler : « ___ meine, das ist kompliziert. » (je veux dire : Ich ___)", a: ["Ich"], ph: "pronom", exp: "« Ich meine, ... » = je veux dire ..." },
    { type: "qcm", q: "Quelle expression relance l'échange vers l'interlocuteur ?", opts: ["Genau.", "Und du? / Was meinst du dazu?", "Ach so.", "Also ..."], a: 1, exp: "« Und du? », « Was meinst du dazu? » renvoient la parole." },
    { type: "qcm", q: "« Echt? Erzähl mal! » sert à…", opts: ["clôturer poliment", "montrer de l'intérêt et inviter à développer", "corriger l'autre", "changer de sujet brutalement"], a: 1, exp: "Marque l'intérêt et encourage l'autre à raconter." },
    { type: "vf", q: "Glisser des « ach so », « genau », « mhm » montre qu'on écoute activement.", a: true, exp: "Ces Rückmeldungen signalent qu'on suit la conversation." },
    { type: "qcm", q: "Tu ne connais pas le mot « Regenschirm ». Quelle est la bonne stratégie ?", opts: ["te taire", "paraphraser : « das Ding gegen den Regen »", "changer de langue", "abandonner la conversation"], a: 1, exp: "La paraphrase permet de continuer sans blocage." },
    { type: "input", q: "Complète : « Mir fällt das Wort gerade nicht ___. » (revenir en mémoire — einfallen)", a: ["ein"], ph: "particule", exp: "einfallen → « fällt mir nicht ein » = ne me revient pas ; particule ein à la fin." },
    { type: "qcm", q: "« Wie soll ich sagen » exprime…", opts: ["un ordre", "une hésitation pendant qu'on cherche ses mots", "un refus", "une félicitation"], a: 1, exp: "« Comment dire » : on gagne du temps pour formuler." },
    { type: "qcm", q: "Quelle phrase clôture poliment une conversation ?", opts: ["Es war schön, mit dir zu reden.", "Wie kommst du darauf?", "Erzähl mal!", "Und du?"], a: 0, exp: "« Es war schön, mit dir zu reden » = c'était agréable de parler avec toi." },
    { type: "qcm", q: "Dans l'extrait, qu'est-ce qui a enthousiasmé B à Berlin ?", opts: ["la nourriture", "le mélange d'histoire et de vie moderne", "le climat", "les prix bas"], a: 1, exp: "« die Mischung aus Geschichte und modernem Leben »." },
    { type: "qcm", q: "Que recommande B pour une visite hivernale de Berlin ?", opts: ["d'éviter la ville", "les marchés de Noël, malgré le froid", "seulement les musées", "de venir en été uniquement"], a: 1, exp: "« im Winter ... kalt, aber die Weihnachtsmärkte sind wunderschön »." },
    { type: "input", q: "Complète la relance : « Kannst du das genauer ___? » (expliquer)", a: ["erklären"], ph: "verbe", exp: "« Kannst du das genauer erklären? » = peux-tu préciser ?" },
    { type: "vf", q: "Un bon locuteur B2 ne fait jamais aucune hésitation quand il parle.", a: false, exp: "Même les natifs hésitent ; l'important est de gérer l'hésitation avec des gap-fillers, pas de l'éviter." },
    { type: "qcm", q: "Quelle est la première phase d'une conversation typique ?", opts: ["l'opinion", "le small talk (accueil, banalités)", "la clôture", "l'anecdote"], a: 1, exp: "On commence par le small talk (Wie geht's? etc.)." }
  ],
  final: {
    title: "Exercice final — Flüssigkeit erkennen",
    intro: `<p>Voici deux réponses possibles à la question « Was machst du gern in deiner Freizeit? ». Compare-les.</p>
<pre class="pseudo">Antwort A: Ich lese. Ich koche. Ich mache Sport.

Antwort B: Also, in meiner Freizeit lese ich eigentlich sehr gern —
   ich meine, vor allem Krimis. Und dann koche ich auch leidenschaftlich,
   weißt du, am liebsten italienisch. Ach ja, und Sport mache ich
   natürlich auch, sagen wir mal, dreimal pro Woche. Und du, was
   machst du so?</pre>
<p>(leidenschaftlich = avec passion · der Krimi = le polar · am liebsten = de préférence)</p>`,
    questions: [
      { type: "qcm", q: "Quelle réponse est la plus fluide et naturelle ?", opts: ["Antwort A", "Antwort B", "les deux pareilles", "aucune"], a: 1, exp: "B enchaîne, précise, utilise des gap-fillers et relance : bien plus vivant." },
      { type: "input", q: "Cite un gap-filler utilisé dans la réponse B.", a: ["also", "eigentlich", "ich meine", "weißt du", "sagen wir mal", "ach ja", "na ja"], ph: "un petit mot", exp: "also, eigentlich, ich meine, weißt du, sagen wir mal... : ils fluidifient le discours." },
      { type: "vf", q: "La réponse B se termine par une relance qui renvoie la parole à l'interlocuteur.", a: true, exp: "« Und du, was machst du so? » relance l'échange." },
      { type: "qcm", q: "Pourquoi B ajoute-t-il des détails (Krimis, italienisch, dreimal pro Woche) ?", opts: ["pour meubler inutilement", "pour rendre la conversation concrète, vivante et donner matière à rebondir", "par erreur", "pour compliquer"], a: 1, exp: "Les détails concrets nourrissent l'échange et invitent l'autre à réagir." },
      { type: "qcm", q: "Quelle leçon retenir pour parler 15 minutes sans blocage ?", opts: ["parler vite et sans pause", "enchaîner par des gap-fillers, préciser avec des détails et relancer l'autre", "n'utiliser que des phrases courtes", "éviter de poser des questions"], a: 1, exp: "Gap-fillers + détails + relances = fluidité et durée." }
    ],
    solution: `<p>La réponse <strong>B</strong> est nettement plus <strong>fluide</strong> et « B2 ». Elle diffère de A sur trois points :</p>
<pre class="pseudo">1. Gap-fillers : also, eigentlich, ich meine, weißt du, sagen wir mal.
2. Détails concrets : Krimis, italienisch, dreimal pro Woche.
3. Relance finale : „Und du, was machst du so?“</pre>
<p>La réponse A n'est pas fausse, mais elle est <strong>hachée</strong> et ferme l'échange. La B <strong>enchaîne</strong>, <strong>précise</strong> et <strong>relance</strong> : c'est exactement ce qui permet de tenir une conversation de quinze minutes. Bravo, tu as terminé le niveau B2 : tu as désormais tous les outils pour comprendre, argumenter, analyser et converser en allemand. Weiter so!</p>`
  }
};
</script>

  { id: "de-b2-j30", title: "Prépare ton monologue de présentation", level: 3,

</script>
