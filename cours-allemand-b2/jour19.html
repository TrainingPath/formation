  theory: `
<h3>1. Qu'est-ce qu'un fait divers (die Meldung / der Vorfall) ?</h3>
<p>Un <strong>fait divers</strong> raconte un événement isolé : un accident, un vol, une disparition, un sauvetage. En allemand, on parle de <strong>eine Meldung</strong> (une brève), <strong>ein Vorfall</strong> (un incident) ou, pour la rubrique, <strong>die Vermischtes</strong>. Le style est factuel : qui, quoi, où, quand, comment, pourquoi.</p>
<div class="tip">Les cinq questions du journaliste (die W-Fragen) : <strong>Wer?</strong> (qui) · <strong>Was?</strong> (quoi) · <strong>Wo?</strong> (où) · <strong>Wann?</strong> (quand) · <strong>Warum?</strong> (pourquoi). En les gardant en tête, tu extrais l'essentiel d'un fait divers, même avec des mots inconnus.</p></div>
<h3>2. Le vocabulaire du fait divers</h3>
<pre class="pseudo">der Dieb            le voleur         der Zeuge      le témoin
der Täter           l'auteur (du délit)  das Opfer    la victime
die Polizei         la police         festnehmen     arrêter
stehlen             voler             verschwinden   disparaître
die Ermittlung      l'enquête         verdächtig     suspect
der Einbruch        le cambriolage    entdecken      découvrir
gestehen            avouer            der Beweis     la preuve
melden             signaler           die Wache      le commissariat</pre>
<h3>3. Les temps du fait divers</h3>
<p>Dans la presse allemande, le récit d'un fait divers se fait souvent au <strong>Präteritum</strong> (prétérit), le temps du récit écrit : <em>stahl</em> (vola), <em>fand</em> (trouva), <em>kam</em> (vint). Le <strong>Perfekt</strong> apparaît dans les citations orales. Le <strong>Plusquamperfekt</strong> (plus-que-parfait : hatte + participe) sert à raconter ce qui s'était passé <em>avant</em>.</p>
<pre class="pseudo">Der Dieb stahl das Fahrrad.        Le voleur vola le vélo.  (Präteritum)
Er hatte den Schlüssel vergessen.  Il avait oublié la clé.  (Plusquamperfekt)</pre>
<div class="warn">Reconnaître le Präteritum des verbes forts est essentiel pour lire la presse : gehen→ging, kommen→kam, finden→fand, nehmen→nahm, sehen→sah, rufen→rief. Apprends-les par cœur peu à peu.</p></div>
<h3>4. Le fait divers à lire</h3>
<p>Lis attentivement cette brève (environ une page). Le lexique d'aide est donné à la fin.</p>
<p><strong>Der Dieb, den sein eigener Hund verriet</strong></p>
<p>In der Kleinstadt Lindau am Bodensee ereignete sich vergangene Woche ein ungewöhnlicher Diebstahl. In der Nacht zum Dienstag drang ein unbekannter Mann in eine Bäckerei ein und stahl die Tageseinnahmen aus der Kasse, insgesamt etwa achthundert Euro.</p>
<p>Der Täter ging offenbar sehr geschickt vor. Er hatte die Alarmanlage ausgeschaltet und trug Handschuhe, um keine Fingerabdrücke zu hinterlassen. Als die Besitzerin am Morgen die leere Kasse entdeckte, rief sie sofort die Polizei. Die Beamten fanden zunächst keine brauchbaren Spuren.</p>
<p>Doch der Dieb hatte einen entscheidenden Fehler gemacht. Während des Einbruchs hatte ihn sein kleiner Hund begleitet. Das Tier hatte in der Bäckerei sein Halsband mit einer Marke verloren. Auf dieser Marke standen der Name des Hundes und die Telefonnummer des Besitzers.</p>
<p>Die Polizei rief die Nummer an und bat den Mann höflich, sein verlorenes Halsband abzuholen. Ahnungslos erschien der Verdächtige am nächsten Tag auf der Wache. Dort erwarteten ihn bereits zwei Beamte. Nach kurzer Befragung gestand der 34-jährige Mann die Tat.</p>
<p>Das gestohlene Geld konnte fast vollständig sichergestellt werden. Der Mann muss sich nun wegen Einbruchdiebstahls vor Gericht verantworten. Die Bäckerin nahm den Vorfall mit Humor: „Vielleicht sollte ich dem Hund einen Keks schenken", sagte sie einem Lokalreporter.</p>
<pre class="pseudo">sich ereignen       se produire        ungewöhnlich   inhabituel
eindringen in       s'introduire dans  die Einnahmen  les recettes
geschickt vorgehen  agir habilement    die Alarmanlage l'alarme
der Handschuh       le gant            der Fingerabdruck l'empreinte
hinterlassen        laisser (derrière) die Spur       la trace/l'indice
entscheidend        décisif            begleiten      accompagner
das Halsband        le collier         die Marke      la médaille
ahnungslos          sans se douter     die Befragung  l'interrogatoire
sicherstellen       récupérer/saisir   vor Gericht    devant le tribunal
der Keks            le biscuit</pre>`,

    solution: `<p>Le voleur avait pris toutes les précautions rationnelles : gants (pas d'empreintes), alarme désactivée, agissant de nuit. Mais il avait emmené son chien, qui a perdu son <strong>collier avec une médaille</strong> portant le nom de l'animal et le <strong>numéro du propriétaire</strong>. La police n'a eu qu'à téléphoner et l'inviter poliment à venir récupérer le collier. Il est arrivé <strong>ahnungslos</strong> (sans se douter de rien) et a avoué.</p>
<p>La force du texte tient à cette <strong>ironie</strong> : un détail minuscule et involontaire fait tomber un plan soigné. C'est un ressort classique du fait divers. Note aussi l'emploi du <strong>Plusquamperfekt</strong> (« hatte ... verloren ») pour raconter l'antériorité.</p>`
