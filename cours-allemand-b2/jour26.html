<script>
var DAY = {
  num: 26,
  title: "Révisions de grammaire B2",
  subtitle: "Passif, subordonnées, déclinaison de l'adjectif, Konjunktiv : tout revoir.",
  theory: `
<h3>1. Le passif (das Passiv)</h3>
<p>Le passif met l'accent sur l'action, pas sur l'auteur. On le forme avec <strong>werden + participe passé</strong>. L'agent, s'il est mentionné, est introduit par <strong>von</strong> (+ datif).</p>
<pre class="pseudo">Actif :  Die Polizei verhaftet den Dieb.   La police arrête le voleur.
Passif : Der Dieb wird (von der Polizei) verhaftet.  Le voleur est arrêté.
Passé :  Der Dieb wurde verhaftet.        Le voleur fut arrêté.
Parfait: Der Dieb ist verhaftet worden.   Le voleur a été arrêté.</pre>
<div class="warn">Au passif parfait, le participe de werden est <strong>worden</strong> (et non « geworden ») : « ist ... worden ». C'est une erreur classique à éviter.</p></div>
<h3>2. Les subordonnées : verbe à la fin</h3>
<p>Après une conjonction de subordination, le <strong>verbe conjugué part à la fin</strong>. Les plus fréquentes :</p>
<pre class="pseudo">dass     que          weil     parce que
obwohl   bien que     wenn     si / quand
als      quand (passé, unique)  während  pendant que
damit    afin que     ob       si (interrogation indirecte)</pre>
<pre class="pseudo">Ich weiß, dass er morgen kommt.
Er bleibt zu Hause, weil er krank ist.
Als ich jung war, wohnte ich in Berlin.  (als = quand, ponctuel passé)</pre>
<div class="tip">Ne confonds pas <strong>wenn</strong> (si / quand répété) et <strong>als</strong> (quand, un événement unique au passé) : « <em>Als</em> ich ankam... » (une fois) vs « <em>Wenn</em> ich ankomme... » (chaque fois / à l'avenir).</p></div>
<h3>3. Les relatives (Relativsätze)</h3>
<p>Le pronom relatif s'accorde en genre et nombre avec l'antécédent, et prend le <strong>cas</strong> de sa fonction dans la relative. Le verbe va à la fin.</p>
<pre class="pseudo">Der Mann, der dort steht, ist mein Chef.   (der = sujet, nominatif)
Das Buch, das ich lese, ist spannend.      (das = COD, accusatif)
Die Frau, mit der ich spreche, ...          (der = datif après mit)</pre>
<h3>4. La déclinaison de l'adjectif</h3>
<p>L'adjectif épithète prend une terminaison selon l'article qui le précède. Retiens les trois cas au nominatif/accusatif masculin, féminin, neutre.</p>
<pre class="pseudo">Article défini :   der gute Wein, die gute Idee, das gute Buch
Article indéfini : ein guter Wein, eine gute Idee, ein gutes Buch
Sans article :     guter Wein, gute Idee, gutes Buch (prend la marque du cas)</pre>
<div class="warn">Règle d'or : quand l'article porte déjà la marque du genre/cas (der, die, das, den...), l'adjectif prend juste <strong>-e</strong> ou <strong>-en</strong> (déclinaison « faible »). Sinon, l'adjectif porte la marque forte (guter, gutes...).</p></div>
<h3>5. Konjunktiv I et II : récapitulatif</h3>
<pre class="pseudo">Konjunktiv I (discours indirect) : er sei, er habe, er komme
Konjunktiv II (irréel, politesse) : er wäre, er hätte, er käme, würde
Irréel du passé : Wenn ich das gewusst hätte, wäre ich geblieben.</pre>
<h3>6. Verbes à prépositions (Verben mit Präposition)</h3>
<pre class="pseudo">warten auf (+ Akk)     attendre        denken an (+ Akk)   penser à
sich freuen auf        se réjouir de    teilnehmen an (+ Dat) participer à
sich interessieren für s'intéresser à   abhängen von (+ Dat)  dépendre de
sich kümmern um        s'occuper de     bestehen aus         se composer de</pre>
<div class="tip">Ces couples verbe+préposition se mémorisent en bloc. La préposition fixe le cas : « warten <strong>auf</strong> den Bus » (accusatif), « teilnehmen <strong>an</strong> dem Kurs » (datif).</p></div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on le passif en allemand ?", opts: ["sein + participe", "werden + participe passé", "haben + infinitif", "würde + infinitif"], a: 1, exp: "Passif = werden + participe passé (Der Dieb wird verhaftet)." },
    { type: "input", q: "Mets au passif présent : « Man repariert das Auto. » → « Das Auto ___ repariert. »", a: ["wird"], ph: "auxiliaire du passif", exp: "werden au présent 3e sing. : wird repariert." },
    { type: "qcm", q: "Passif parfait : « Der Brief ist gestern geschrieben ___. »", opts: ["geworden", "worden", "gewesen", "werden"], a: 1, exp: "Au passif parfait, le participe de werden est « worden »." },
    { type: "input", q: "Subordonnée : « Ich glaube, dass er recht ___. » (avoir, verbe à la fin)", a: ["hat"], ph: "verbe conjugué", exp: "Après dass, le verbe va à la fin : ...dass er recht hat." },
    { type: "qcm", q: "Quelle conjonction signifie « quand » pour UN événement unique au passé ?", opts: ["wenn", "als", "ob", "damit"], a: 1, exp: "als = quand (ponctuel, passé) ; wenn = si / quand (répété/futur)." },
    { type: "qcm", q: "« Das Buch, ___ ich lese, ist spannend. » Quel pronom relatif ?", opts: ["der", "das", "dem", "den"], a: 1, exp: "Antécédent neutre (das Buch), fonction COD → accusatif neutre : das." },
    { type: "input", q: "Relatif au datif : « Die Frau, mit ___ ich spreche, ist Ärztin. »", a: ["der"], ph: "pronom relatif", exp: "Antécédent féminin + mit (datif) → der." },
    { type: "qcm", q: "Déclinaison : « Ich trinke ___ Wein. » (bon, masculin accusatif, article indéfini einen)", opts: ["einen guten Wein", "einen guter Wein", "ein gutes Wein", "einen gut Wein"], a: 0, exp: "einen (accusatif masc.) porte la marque → adjectif faible : guten." },
    { type: "qcm", q: "« ___ Wein ist teuer. » (bon, masc. nominatif, sans article)", opts: ["Gute", "Guter", "Guten", "Gutes"], a: 1, exp: "Sans article, l'adjectif porte la marque forte du nominatif masc. : guter." },
    { type: "input", q: "Verbe à préposition : « Ich warte ___ den Bus. » (attendre + préposition)", a: ["auf"], ph: "préposition", exp: "warten auf + accusatif = attendre." },
    { type: "qcm", q: "« sich interessieren ___ » (s'intéresser à) : quelle préposition ?", opts: ["an", "für", "auf", "von"], a: 1, exp: "sich interessieren für + accusatif = s'intéresser à." },
    { type: "input", q: "Konjunktiv I (discours indirect) : « Er sagt, er ___ krank. » (sein)", a: ["sei"], ph: "sein au K.I", exp: "sein → sei (3e pers. Konjunktiv I)." },
    { type: "qcm", q: "Irréel du passé : « Wenn ich das gewusst hätte, ___ ich geblieben. »", opts: ["würde", "wäre", "hätte", "bin"], a: 1, exp: "bleiben → sein comme auxiliaire : wäre ich geblieben." },
    { type: "qcm", q: "« teilnehmen ___ » (participer à) régit quel cas/préposition ?", opts: ["an + datif", "für + accusatif", "auf + accusatif", "von + datif"], a: 0, exp: "teilnehmen an + datif : an dem Kurs teilnehmen." },
    { type: "vf", q: "Dans une subordonnée introduite par « weil », le verbe conjugué se place à la fin.", a: true, exp: "weil est une conjonction de subordination : verbe à la fin." }
  ],
  final: {
    title: "Exercice final — Fehler finden und die Regel nennen",
    intro: `<p>Voici cinq phrases. Pour chacune, identifie si la structure grammaticale ciblée est correcte, en t'appuyant sur les règles révisées.</p>
<pre class="pseudo">1. Passif :        „Der Täter ist gestern festgenommen worden.“
2. Subordonnée :  „Ich weiß, dass er morgen kommt.“
3. Relative :     „Der Mann, den ich gesehen habe, war groß.“
4. Als/Wenn :     „Als ich ein Kind war, spielte ich viel.“
5. Adjectif :     „Sie trägt ein rotes Kleid.“</pre>
<p>(festnehmen = arrêter · tragen = porter · das Kleid = la robe)</p>`,
    questions: [
      { type: "vf", q: "Phrase 1 est correcte : au passif parfait on emploie bien « ist ... worden ».", a: true, exp: "Passif parfait : sein + participe + worden. Correct." },
      { type: "qcm", q: "Dans la phrase 2, pourquoi « kommt » est-il en fin ?", opts: ["c'est une faute", "parce que « dass » place le verbe à la fin de la subordonnée", "pour la rime", "c'est un passif"], a: 1, exp: "dass = subordination → verbe conjugué à la fin." },
      { type: "qcm", q: "Phrase 3 : pourquoi le relatif est-il « den » ?", opts: ["antécédent féminin", "masculin + fonction COD (accusatif) dans la relative", "datif", "nominatif"], a: 1, exp: "der Mann (masc.) est COD de « gesehen » → accusatif : den." },
      { type: "vf", q: "Phrase 4 emploie correctement « als » pour un souvenir d'enfance unique/révolu.", a: true, exp: "als = quand (passé, cadre unique). Correct." },
      { type: "qcm", q: "Phrase 5 : « ein rotes Kleid » — pourquoi « rotes » ?", opts: ["das Kleid est neutre et « ein » ne porte pas la marque → adjectif fort -es", "c'est masculin", "c'est un pluriel", "c'est une faute, il faut rote"], a: 0, exp: "Neutre accusatif, article « ein » sans marque → adjectif porte -es : rotes." }
    ],
    solution: `<p>Les cinq phrases sont <strong>correctes</strong> et illustrent chacune une règle B2 clé :</p>
<pre class="pseudo">1. Passif parfait : ist + participe + WORDEN (jamais « geworden »).
2. dass → verbe conjugué à la FIN de la subordonnée.
3. Relatif « den » : masculin (der Mann) + COD → accusatif.
4. « als » = quand, cadre passé unique (# wenn = répété/futur).
5. « ein rotes Kleid » : « ein » ne marque pas le neutre,
   donc l'adjectif prend la marque forte -es.</pre>
<p>Ces automatismes — place du verbe, cas du relatif, worden au passif, terminaison de l'adjectif — sont exactement ce qu'un jury B2 vérifie. Relis-les avant les projets finaux !</p>`
  }
};
</script>
