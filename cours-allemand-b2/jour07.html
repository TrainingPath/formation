<script>
var DAY = {
  num: 7,
  title: "La mise en relief et l'ordre des mots",
  subtitle: "Jouer avec la première position et le champ intérieur pour souligner ce qui compte.",
  theory: `
<h3>1. Le principe : la position 2 est fixe, le reste bouge</h3>
<p>En allemand, dans une principale, le <strong>verbe conjugué occupe toujours la position 2</strong>. Mais la <strong>position 1</strong> (le Vorfeld, « champ initial ») est libre : on y met l'élément qu'on veut <strong>mettre en relief</strong>. Ce choix change l'accent de la phrase, pas son sens de base.</p>
<pre class="pseudo">Ich fahre morgen mit dem Zug nach Köln.        (neutre : sujet en tête)
Morgen fahre ich mit dem Zug nach Köln.        (accent sur DEMAIN)
Mit dem Zug fahre ich morgen nach Köln.        (accent sur EN TRAIN)
Nach Köln fahre ich morgen mit dem Zug.        (accent sur À COLOGNE)</pre>
<div class="tip">Le Vorfeld répond souvent implicitement à une question : « Quand ? » → Morgen en tête. « Comment ? » → Mit dem Zug en tête. Placer un élément en position 1, c'est le thématiser.</div>
<h3>2. Le champ intérieur : l'ordre TeKaMoLo</h3>
<p>Entre le verbe et la fin de phrase (le Mittelfeld), les compléments suivent un ordre par défaut, résumé par <strong>TeKaMoLo</strong> :</p>
<pre class="pseudo">Te = temporal (quand ?)      Ka = kausal (pourquoi ?)
Mo = modal (comment ?)       Lo = lokal (où ?)

Ich fahre [morgen] [wegen der Arbeit] [mit dem Zug] [nach Köln].
          temporal   kausal              modal         lokal</pre>
<p>C'est un ordre <strong>par défaut</strong>, souple : on peut le rompre pour mettre en relief, mais le respecter donne un allemand naturel.</p>
<h3>3. La place des pronoms et de la négation</h3>
<pre class="pseudo">Les pronoms personnels remontent tôt, juste après le verbe :
Ich habe [ihm] [gestern] [das Buch] gegeben.   (pronom avant le complément de temps)

nicht se place en général tard, devant l'élément nié ou en fin de champ :
Ich kenne den Mann nicht.        Je ne connais pas l'homme.
Ich fahre morgen nicht nach Köln. Je ne vais pas à Cologne demain.</pre>
<h3>4. Mettre en relief autrement</h3>
<p>Outre le Vorfeld, l'allemand dispose d'autres procédés de mise en relief :</p>
<pre class="pseudo">Particules modales : Das ist ja toll! (accent affectif)
Es-Spaltsatz (phrase clivée) : Es war Anna, die angerufen hat. C'est Anna qui a appelé.
Accent sur zwar ... aber : Er ist zwar müde, aber glücklich. Certes fatigué, mais heureux.
selbst / sogar / gerade : Sogar der Chef war überrascht. Même le chef fut surpris.</pre>
<div class="warn">Ne surcharge pas la position 1 : on n'y met qu'<strong>UN seul</strong> élément (un groupe), suivi immédiatement du verbe. « Morgen ich fahre » est faux : ce doit être « Morgen fahre ich ».</div>
<h3>5. L'ordre dans la subordonnée</h3>
<p>Rappel essentiel : dans une <strong>subordonnée</strong> (introduite par weil, dass, wenn, obwohl...), le verbe conjugué part <strong>à la fin</strong>.</p>
<pre class="pseudo">Ich bleibe zu Hause, weil ich krank bin.       ... parce que je suis malade.
Er sagt, dass er morgen kommt.                 ... qu'il vient demain.</pre>
<div class="tip">Au B2, savoir déplacer un élément en tête pour souligner l'information clé rend ton discours plus vivant et plus précis. C'est un outil rhétorique, pas seulement grammatical.</div>`,
  exercises: [
    { type: "qcm", q: "Dans une principale allemande, le verbe conjugué occupe…", opts: ["toujours la position 1", "toujours la position 2", "toujours la fin", "n'importe quelle position"], a: 1, exp: "Le verbe conjugué est en position 2, quel que soit l'élément placé en tête." },
    { type: "qcm", q: "« Morgen fahre ich nach Köln » met l'accent sur…", opts: ["le sujet", "le moment (demain)", "la destination", "le verbe"], a: 1, exp: "L'élément en position 1 (Morgen) est mis en relief." },
    { type: "qcm", q: "Que signifie l'ordre TeKaMoLo dans le champ intérieur ?", opts: ["temps-cause-manière-lieu", "temps-lieu-manière-cause", "cause-temps-lieu-manière", "manière-lieu-temps-cause"], a: 0, exp: "Te(mporal)-Ka(usal)-Mo(dal)-Lo(kal) : quand, pourquoi, comment, où." },
    { type: "input", q: "Corrige l'ordre : « Morgen ___ ich nach Köln. » (verbe fahren en position 2)", a: ["fahre"], ph: "verbe", exp: "Après l'élément en tête, le verbe est en position 2 : Morgen fahre ich." },
    { type: "vf", q: "On peut placer plusieurs groupes différents ensemble en position 1, avant le verbe.", a: false, exp: "Un seul groupe occupe le Vorfeld ; le verbe suit immédiatement." },
    { type: "qcm", q: "Ordre TeKaMoLo correct : « Ich fahre ... nach Köln. »", opts: ["mit dem Zug morgen wegen der Arbeit", "morgen wegen der Arbeit mit dem Zug", "wegen der Arbeit mit dem Zug morgen", "nach Köln morgen mit dem Zug"], a: 1, exp: "temps (morgen) - cause (wegen der Arbeit) - manière (mit dem Zug) - lieu (nach Köln)." },
    { type: "input", q: "Place la négation : « Ich kenne den Mann ___. » (je ne connais pas cet homme)", a: ["nicht"], ph: "négation", exp: "nicht se place en fin : Ich kenne den Mann nicht." },
    { type: "qcm", q: "Dans « Ich habe ihm gestern das Buch gegeben », où se place le pronom « ihm » ?", opts: ["à la fin", "tôt, juste après le verbe, avant le complément de temps", "en position 1", "il est optionnel"], a: 1, exp: "Les pronoms personnels remontent tôt dans le champ intérieur." },
    { type: "qcm", q: "« Es war Anna, die angerufen hat » est…", opts: ["une subordonnée relative simple", "une phrase clivée (Es-Spaltsatz) mettant Anna en relief", "une question", "une erreur"], a: 1, exp: "La structure « Es war X, die/der ... » clive la phrase pour souligner X (« c'est Anna qui... »)." },
    { type: "input", q: "Complète la subordonnée (verbe à la fin) : « Ich bleibe zu Hause, weil ich krank ___. »", a: ["bin"], ph: "verbe", exp: "Dans une subordonnée en weil, le verbe conjugué part à la fin : ... krank bin." },
    { type: "qcm", q: "Quel mot met « le chef » lui-même en relief : « ___ der Chef war überrascht » ?", opts: ["nur", "sogar (même)", "kaum", "fast"], a: 1, exp: "sogar / selbst = même : Sogar der Chef war überrascht." },
    { type: "vf", q: "Dans une subordonnée (weil, dass, wenn...), le verbe conjugué se place à la fin.", a: true, exp: "C'est la règle de la Verbendstellung en subordonnée." },
    { type: "qcm", q: "« Er ist zwar müde, aber glücklich » : quel effet produit « zwar ... aber » ?", opts: ["une négation", "une concession qui met en balance deux aspects (certes... mais)", "une cause", "un ordre"], a: 1, exp: "zwar ... aber concède un point pour mieux souligner le contraste." },
    { type: "input", q: "Mets « mit dem Zug » en relief (en tête) : « ___ ___ ___ fahre ich morgen nach Köln. » (3 mots)", a: ["Mit dem Zug","mit dem zug","Mit dem zug"], ph: "3 mots en tête", exp: "En plaçant Mit dem Zug en position 1, on souligne le moyen de transport." },
    { type: "qcm", q: "Placer un élément en position 1, c'est…", opts: ["changer le sens de la phrase", "le thématiser / le mettre en relief sans changer le sens de base", "le supprimer", "une faute"], a: 1, exp: "Le Vorfeld thématise l'information ; le sens fondamental reste le même." }
  ],
  final: {
    title: "Exercice final — Eine überzeugende Rede",
    intro: `<p>Un orateur joue sur l'ordre des mots pour convaincre. Observe ses mises en relief.</p>
<pre class="pseudo">Heute stehen wir vor einer wichtigen Entscheidung. Nicht die Kosten sind das
größte Problem, sondern unsere Gleichgültigkeit. Gerade jetzt müssen wir handeln.
Zwar ist der Weg lang, aber er lohnt sich. Es sind die kleinen Schritte, die am
Ende den Unterschied machen. Sogar die Skeptiker geben inzwischen zu, dass sich
etwas ändern muss. Nur gemeinsam können wir dieses Ziel erreichen.</pre>
<p>(die Gleichgültigkeit = l'indifférence · sich lohnen = valoir la peine · zugeben = admettre)</p>`,
    questions: [
      { type: "qcm", q: "« Gerade jetzt müssen wir handeln » : quel effet a « gerade jetzt » en tête ?", opts: ["il nie l'action", "il met fortement en relief le moment : c'est MAINTENANT qu'il faut agir", "il indique le passé", "il pose une question"], a: 1, exp: "L'élément en position 1 (gerade jetzt) est souligné ; le verbe müssen suit en position 2." },
      { type: "qcm", q: "« Nicht die Kosten sind das Problem, sondern unsere Gleichgültigkeit » utilise…", opts: ["une simple négation", "la structure de correction nicht ... sondern pour mettre en relief le vrai problème", "une question", "un ordre"], a: 1, exp: "nicht X, sondern Y rectifie et met Y en relief." },
      { type: "qcm", q: "« Es sind die kleinen Schritte, die den Unterschied machen » est…", opts: ["une phrase clivée mettant « les petits pas » en relief", "une subordonnée temporelle", "une négation", "un impératif"], a: 0, exp: "Es sind X, die ... = clivée soulignant X (« ce sont les petits pas qui... »)." },
      { type: "input", q: "Relève le mot qui met « les sceptiques » eux-mêmes en relief : « ___ die Skeptiker geben zu ... ».", a: ["Sogar","sogar"], ph: "mot", exp: "sogar = même : Sogar die Skeptiker (même les sceptiques)." },
      { type: "vf", q: "En plaçant « Nur gemeinsam » en tête, l'orateur souligne que c'est SEULEMENT ensemble qu'on atteindra le but.", a: true, exp: "Le Vorfeld met en relief la condition « nur gemeinsam » ; le verbe können suit en position 2." }
    ],
    solution: `<p>Le discours multiplie les procédés de mise en relief : le <strong>Vorfeld</strong> chargé d'un élément fort (Heute, Gerade jetzt, Nur gemeinsam), la structure corrective <strong>nicht ... sondern</strong>, la <strong>phrase clivée</strong> (Es sind die kleinen Schritte, die ...), la concession <strong>zwar ... aber</strong>, et la particule <strong>sogar</strong>.</p>
<p>Dans chaque phrase, remarque que le verbe conjugué reste en <strong>position 2</strong> (stehen, sind, müssen, ist, können) : c'est l'élément placé devant lui qui varie et qui porte l'emphase. Voilà comment l'ordre des mots devient un outil rhétorique.</p>`
  }
};
</script>
