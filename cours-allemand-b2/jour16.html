<script>
var DAY = {
  num: 16,
  title: "Parler de son parcours professionnel",
  subtitle: "Raconter sa formation, ses expériences et ses compétences en allemand.",
  theory: `
<h3>1. Le vocabulaire du parcours (der Werdegang)</h3>
<p>Au niveau B2, tu dois pouvoir raconter ton <strong>parcours professionnel</strong> (der berufliche Werdegang) de façon fluide : formation, postes occupés, compétences. Voici le lexique de base, avec l'article et la traduction.</p>
<pre class="pseudo">die Ausbildung        la formation (professionnelle)
das Studium           les études (universitaires)
der Abschluss         le diplôme, l'obtention du diplôme
die Erfahrung         l'expérience
die Stelle / der Job  le poste / l'emploi
der Arbeitgeber       l'employeur
die Kenntnisse (pl.)  les connaissances, les compétences
die Fähigkeit         la capacité, l'aptitude
sich bewerben (um)    postuler (à)
einstellen            embaucher
kündigen              démissionner / licencier</pre>
<h3>2. Les temps du récit professionnel</h3>
<p>Pour parler d'un parcours passé, on utilise le <strong>Perfekt</strong> à l'oral (« ich habe studiert ») et souvent le <strong>Präteritum</strong> à l'écrit d'un CV ou d'une lettre. Pour la situation actuelle, on emploie le présent.</p>
<pre class="pseudo">Ich habe in Lyon Betriebswirtschaft studiert.
   J'ai étudié la gestion d'entreprise à Lyon.
Nach dem Studium habe ich als Praktikant gearbeitet.
   Après mes études, j'ai travaillé comme stagiaire.
Seit 2021 arbeite ich als Projektleiter.
   Depuis 2021, je travaille comme chef de projet.</pre>
<div class="tip">Avec <strong>seit</strong> (depuis), l'allemand utilise le <strong>présent</strong> quand la situation dure encore : « Seit drei Jahren wohne ich hier » = J'habite ici depuis trois ans. Ne traduis pas par un passé !</div>
<h3>3. Décrire ses compétences (die Kompetenzen)</h3>
<p>Pour mettre en valeur ce que tu sais faire, ces structures sont précieuses :</p>
<pre class="pseudo">Ich bin gut in ...            Je suis bon(ne) en ...
Ich verfüge über ...          Je dispose de ...
Zu meinen Stärken gehört ...  Parmi mes points forts figure ...
Ich kann gut im Team arbeiten.  Je sais bien travailler en équipe.
Ich habe Erfahrung mit ...    J'ai de l'expérience avec ...</pre>
<div class="warn">Attention à la préposition : on dit « Erfahrung <strong>mit</strong> etwas » (avec qqch) mais « sich bewerben <strong>um</strong> eine Stelle » (postuler à un poste). Ces prépositions se mémorisent avec le verbe.</div>
<h3>4. Enchaîner les étapes</h3>
<p>Structure ton récit avec des connecteurs temporels : <em>zunächst</em> (d'abord), <em>anschließend</em> (ensuite), <em>danach</em> (après), <em>schließlich</em> (finalement), <em>heute</em> (aujourd'hui).</p>
<pre class="pseudo">Zunächst habe ich Abitur gemacht.
Anschließend habe ich ein Studium begonnen.
Danach bin ich ins Berufsleben eingestiegen.
Heute bin ich für ein ganzes Team verantwortlich.</pre>
<p>(das Abitur = le bac · das Berufsleben = la vie professionnelle · verantwortlich für = responsable de)</p>
<h3>5. Un modèle de présentation</h3>
<pre class="pseudo">Mein Name ist Clara Martin. Ich komme aus Frankreich.
Ich habe an der Universität Bordeaux Informatik studiert
und 2019 meinen Master abgeschlossen.
Nach dem Studium habe ich zwei Jahre bei einer kleinen
Firma als Entwicklerin gearbeitet.
Seit 2022 bin ich bei einem großen Konzern angestellt.
Zu meinen Stärken gehören Teamarbeit und Organisation.</pre>
<p>(die Informatik = l'informatique · abschließen = terminer, valider · der Konzern = le grand groupe · angestellt sein = être salarié)</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « die Ausbildung » ?", opts: ["l'employeur", "la formation professionnelle", "le diplôme", "l'expérience"], a: 1, exp: "die Ausbildung = la formation, souvent en alternance." },
    { type: "qcm", q: "Comment traduit-on « postuler à un poste » ?", opts: ["kündigen", "einstellen", "sich um eine Stelle bewerben", "arbeiten"], a: 2, exp: "sich bewerben um = postuler à ; einstellen = embaucher." },
    { type: "input", q: "Complète : « Seit 2021 ___ ich als Projektleiter. » (travailler, présent car ça dure)", a: ["arbeite"], ph: "verbe au présent", exp: "Avec seit et une situation qui dure, on emploie le présent : arbeite." },
    { type: "vf", q: "En allemand, avec « seit » (depuis) et une action qui continue, on utilise le présent.", a: true, exp: "« Seit drei Jahren wohne ich hier » = j'habite ici depuis trois ans." },
    { type: "qcm", q: "Que veut dire « der Abschluss » ?", opts: ["le début", "le diplôme / l'obtention du diplôme", "le stage", "l'entretien"], a: 1, exp: "der Abschluss = le diplôme obtenu ; abschließen = valider ses études." },
    { type: "input", q: "Complète : « Ich habe Erfahrung ___ Datenbanken. » (préposition : avec)", a: ["mit"], ph: "préposition", exp: "Erfahrung mit etwas = de l'expérience avec qqch." },
    { type: "qcm", q: "« Zu meinen Stärken gehört Teamarbeit » signifie…", opts: ["Je déteste le travail d'équipe", "Le travail d'équipe fait partie de mes points forts", "Je cherche une équipe", "Mon équipe est forte"], a: 1, exp: "Zu meinen Stärken gehört = parmi mes points forts figure." },
    { type: "input", q: "Complète : « Nach dem Studium habe ich als Praktikant ___. » (participe de arbeiten)", a: ["gearbeitet"], ph: "participe passé", exp: "arbeiten → gearbeitet (participe régulier)." },
    { type: "qcm", q: "Que signifie « der Arbeitgeber » ?", opts: ["le collègue", "l'employé", "l'employeur", "le syndicat"], a: 2, exp: "Arbeit + geber (celui qui donne le travail) = l'employeur ; Arbeitnehmer = l'employé." },
    { type: "qcm", q: "Quel connecteur signifie « ensuite / à la suite » ?", opts: ["zunächst", "anschließend", "schließlich", "heute"], a: 1, exp: "anschließend = ensuite ; zunächst = d'abord ; schließlich = finalement." },
    { type: "input", q: "Complète : « Ich habe 2019 meinen Master ___. » (participe de abschließen = valider)", a: ["abgeschlossen"], ph: "participe passé", exp: "abschließen → abgeschlossen (verbe à particule séparable, participe irrégulier)." },
    { type: "vf", q: "« kündigen » peut signifier aussi bien démissionner que licencier selon le contexte.", a: true, exp: "Der Chef kündigt (licencie) / Der Angestellte kündigt (démissionne)." },
    { type: "qcm", q: "« Ich verfüge über gute Deutschkenntnisse » veut dire…", opts: ["Je cherche des cours d'allemand", "Je dispose de bonnes connaissances en allemand", "Je ne parle pas allemand", "J'enseigne l'allemand"], a: 1, exp: "verfügen über = disposer de ; Deutschkenntnisse = connaissances en allemand." },
    { type: "qcm", q: "Compréhension : « Seit 2022 bin ich bei einem großen Konzern angestellt. » Que comprend-on ?", opts: ["La personne a quitté un grand groupe en 2022", "La personne est salariée d'un grand groupe depuis 2022", "La personne fonde une entreprise", "La personne est au chômage"], a: 1, exp: "angestellt sein = être salarié ; seit 2022 = depuis 2022 (ça dure)." },
    { type: "input", q: "Complète le connecteur : « ___ habe ich Abitur gemacht, anschließend ein Studium begonnen. » (d'abord)", a: ["Zunächst", "zunächst"], ph: "d'abord", exp: "zunächst = d'abord ; puis anschließend = ensuite." }
  ],
  final: {
    title: "Exercice final — Ein beruflicher Werdegang",
    intro: `<p>Lis cette présentation puis réponds aux questions.</p>
<pre class="pseudo">Ich heiße Thomas Bauer und komme aus Straßburg.
Nach dem Abitur habe ich in Freiburg Maschinenbau studiert.
2018 habe ich mein Studium mit einem Master abgeschlossen.
Danach habe ich drei Jahre bei einem Autohersteller als
Ingenieur gearbeitet. 2021 habe ich gekündigt, weil ich
eine neue Herausforderung suchte.
Seit 2022 leite ich ein kleines Team von fünf Personen.
Zu meinen Stärken gehören technisches Wissen und Geduld.</pre>
<p>(der Maschinenbau = le génie mécanique · der Autohersteller = le constructeur automobile · die Herausforderung = le défi · leiten = diriger · die Geduld = la patience)</p>`,
    questions: [
      { type: "qcm", q: "Qu'a étudié Thomas ?", opts: ["L'informatique", "Le génie mécanique (Maschinenbau)", "Le droit", "La médecine"], a: 1, exp: "« habe ich in Freiburg Maschinenbau studiert »." },
      { type: "input", q: "En quelle année a-t-il obtenu son Master ?", a: ["2018"], ph: "année", exp: "« 2018 habe ich mein Studium ... abgeschlossen »." },
      { type: "qcm", q: "Pourquoi a-t-il démissionné en 2021 ?", opts: ["Il était fatigué", "Il cherchait un nouveau défi", "Il a été licencié", "Il a déménagé"], a: 1, exp: "« weil ich eine neue Herausforderung suchte »." },
      { type: "qcm", q: "Que fait-il depuis 2022 ?", opts: ["Il étudie encore", "Il dirige une équipe de cinq personnes", "Il est au chômage", "Il travaille chez le constructeur auto"], a: 1, exp: "« Seit 2022 leite ich ein kleines Team von fünf Personen »." },
      { type: "vf", q: "Parmi ses points forts, il cite le savoir technique et la patience.", a: true, exp: "« Zu meinen Stärken gehören technisches Wissen und Geduld »." }
    ],
    solution: `<p>Thomas Bauer vient de Strasbourg. Après le bac, il a étudié le génie mécanique à Fribourg et a obtenu son Master en 2018. Il a ensuite travaillé trois ans comme ingénieur chez un constructeur automobile, puis a démissionné en 2021 pour chercher un nouveau défi (eine neue Herausforderung). Depuis 2022, il dirige une équipe de cinq personnes. Ses points forts : le savoir technique et la patience.</p>
<p>Observe l'alternance des temps : <strong>Perfekt</strong> pour les étapes passées (habe studiert, habe gearbeitet, habe gekündigt), <strong>Präteritum</strong> pour l'état passé (suchte), et <strong>présent</strong> avec <em>seit</em> pour la situation actuelle (leite).</p>`
  }
};
</script>
