<script>
var DAY = {
  num: 24,
  title: "Exprimer hypothèses et probabilités",
  subtitle: "Le Konjunktiv II, les conditionnelles et le degré de certitude en allemand.",
  theory: `
<h3>1. Le Konjunktiv II : l'irréel et l'hypothèse</h3>
<p>Le <strong>Konjunktiv II</strong> exprime l'irréel, le souhait, l'hypothèse et la politesse. On le forme le plus souvent avec <strong>würde + infinitif</strong>, mais certains verbes ont une forme propre très courante.</p>
<pre class="pseudo">würde + infinitif :  Ich würde gern kommen.  Je viendrais volontiers.
Formes propres fréquentes :
sein  → wäre     Ich wäre froh.        Je serais content.
haben → hätte    Ich hätte Zeit.       J'aurais le temps.
können → könnte  Er könnte recht haben. Il pourrait avoir raison.
werden → würde   Es würde regnen.       Il pleuvrait.
müssen → müsste  Du müsstest gehen.     Tu devrais partir.</pre>
<div class="tip">Pour <em>sein, haben</em> et les modaux, utilise la <strong>forme propre</strong> (wäre, hätte, könnte...), plus élégante que « würde sein ». Pour les autres verbes, « würde + infinitif » est parfait.</p></div>
<h3>2. Les phrases conditionnelles (Konditionalsätze)</h3>
<p>La conditionnelle irréelle (« si..., alors... ») met le <strong>Konjunktiv II dans les deux membres</strong>. La subordonnée avec <strong>wenn</strong> a son verbe à la fin.</p>
<pre class="pseudo">Wenn ich Zeit hätte, würde ich dir helfen.
   Si j'avais le temps, je t'aiderais.
Wenn er mehr lernte, könnte er die Prüfung bestehen.
   S'il travaillait plus, il pourrait réussir l'examen.</pre>
<div class="warn">Ordre : « <strong>Wenn</strong> ich Zeit <strong>hätte</strong>, <strong>würde</strong> ich... » — après la virgule, la principale commence par le verbe (inversion), car la subordonnée occupe la 1re position. On peut aussi omettre wenn : « <strong>Hätte</strong> ich Zeit, würde ich... ».</p></div>
<h3>3. L'irréel du passé</h3>
<p>Pour un regret ou une hypothèse sur le passé : <strong>hätte/wäre + participe passé</strong>.</p>
<pre class="pseudo">Wenn ich das gewusst hätte, wäre ich nicht gekommen.
   Si j'avais su cela, je ne serais pas venu.
Du hättest anrufen sollen.
   Tu aurais dû appeler.</pre>
<h3>4. Exprimer le degré de probabilité</h3>
<p>Pour nuancer la certitude, l'allemand dispose d'adverbes et du <strong>futur de supposition</strong> (werden + infinitif = « il doit être en train de... »).</p>
<pre class="pseudo">sicher / bestimmt      certainement       vielleicht     peut-être
wahrscheinlich         probablement       vermutlich     vraisemblablement
möglicherweise         éventuellement     kaum           à peine, peu probable
auf keinen Fall        en aucun cas       zweifellos     sans aucun doute</pre>
<pre class="pseudo">Er wird wohl im Stau stehen.     Il doit être coincé dans les bouchons.
Sie dürfte schon zu Hause sein.  Elle est probablement déjà chez elle.
Das kann nicht stimmen.          Ça ne peut pas être vrai.</pre>
<div class="warn">Les modaux servent aussi à la probabilité : <strong>müssen</strong> (forte certitude : « es muss so sein » = ça doit forcément être ainsi), <strong>dürfte</strong> (probable), <strong>könnte</strong> (possible), <strong>kann nicht</strong> (impossible).</p></div>
<h3>5. Un court texte d'hypothèses</h3>
<pre class="pseudo">Wenn die Preise weiter steigen würden, könnten sich viele Familien
den Urlaub bald nicht mehr leisten. Wahrscheinlich würden sie dann
näher zu Hause bleiben. Manche Experten meinen sogar, der Tourismus
würde sich völlig verändern. Sicher ist das jedoch nicht: Vielleicht
finden die Menschen einfach neue, günstigere Reiseformen.</pre>
<p>(sich etwas leisten = se permettre qqch · sich verändern = changer · günstig = bon marché · die Reiseform = la forme de voyage)</p>`,
  exercises: [
    { type: "qcm", q: "Le Konjunktiv II sert surtout à exprimer…", opts: ["un fait certain au passé", "l'irréel, l'hypothèse, le souhait, la politesse", "un ordre", "une date"], a: 1, exp: "C'est le mode de l'irréel et de l'hypothèse." },
    { type: "input", q: "Konjunktiv II de « sein » (3e pers.) : « Er ___ froh. » (serait)", a: ["wäre"], ph: "sein au K.II", exp: "sein → wäre." },
    { type: "input", q: "Konjunktiv II de « haben » : « Ich ___ Zeit. » (aurais)", a: ["hätte"], ph: "haben au K.II", exp: "haben → hätte." },
    { type: "qcm", q: "Quelle forme est préférable à « würde sein » ?", opts: ["wäre", "sein würde", "war", "gewesen"], a: 0, exp: "Pour sein, on emploie la forme propre wäre." },
    { type: "input", q: "Complète : « Wenn ich Zeit ___, würde ich dir helfen. » (haben au K.II)", a: ["hätte"], ph: "K.II", exp: "Wenn ich Zeit hätte = si j'avais le temps ; verbe à la fin de la subordonnée." },
    { type: "qcm", q: "Dans « Wenn ich Zeit hätte, ___ ich dir. », que met-on après la virgule ?", opts: ["würde helfe", "würde ich helfen (inversion)", "ich würde", "helfe ich"], a: 1, exp: "La subordonnée occupe la position 1 → principale commence par le verbe : würde ich." },
    { type: "vf", q: "On peut dire « Hätte ich Zeit, würde ich helfen » en omettant « wenn ».", a: true, exp: "Sans wenn, le verbe conjugué ouvre la subordonnée : Hätte ich..." },
    { type: "qcm", q: "Comment exprime-t-on l'irréel du PASSÉ ?", opts: ["würde + infinitif", "hätte/wäre + participe passé", "présent", "impératif"], a: 1, exp: "« Wenn ich das gewusst hätte... » = si j'avais su." },
    { type: "input", q: "Complète le regret : « Du ___ anrufen sollen. » (aurais dû — hätte)", a: ["hättest"], ph: "K.II passé", exp: "Du hättest anrufen sollen = tu aurais dû appeler." },
    { type: "qcm", q: "Que signifie « vermutlich » ?", opts: ["certainement", "vraisemblablement/probablement", "jamais", "à peine"], a: 1, exp: "vermutlich = vraisemblablement (proche de wahrscheinlich)." },
    { type: "qcm", q: "« Er wird wohl im Stau stehen » exprime…", opts: ["un futur certain", "une supposition (il doit être dans les bouchons)", "un ordre", "un regret"], a: 1, exp: "werden + wohl = supposition sur le présent." },
    { type: "qcm", q: "« Sie dürfte schon zu Hause sein » signifie…", opts: ["elle a le droit d'être chez elle", "elle est probablement déjà chez elle", "elle doit rentrer", "elle ne peut pas être chez elle"], a: 1, exp: "dürfte = probabilité (elle est sans doute déjà rentrée)." },
    { type: "qcm", q: "Quel modal exprime la plus FORTE certitude ?", opts: ["könnte", "dürfte", "muss (es muss so sein)", "kann nicht"], a: 2, exp: "müssen = certitude logique forte : ça doit forcément être ainsi." },
    { type: "qcm", q: "« Das kann nicht stimmen » veut dire…", opts: ["c'est sûrement vrai", "ça ne peut pas être vrai (impossible)", "peut-être vrai", "c'est probable"], a: 1, exp: "kann nicht = impossibilité." },
    { type: "input", q: "Complète : « Wenn die Preise weiter steigen ___, könnten viele nicht mehr reisen. » (würden)", a: ["würden"], ph: "K.II", exp: "Konjunktiv II : würden steigen (hypothèse)." }
  ],
  final: {
    title: "Exercice final — Was wäre, wenn?",
    intro: `<p>Lis ces réflexions hypothétiques sur la vie sans smartphone, puis réponds.</p>
<pre class="pseudo">Was wäre, wenn wir plötzlich keine Smartphones mehr hätten?
Wahrscheinlich würden wir uns anfangs verloren fühlen. Viele
müssten wieder lernen, sich einen Weg ohne Navigation zu merken.
Vielleicht würden wir aber auch mehr miteinander reden. Manche
Experten meinen, wir wären sogar entspannter und würden besser
schlafen. Sicher ist das nicht. Wenn ich es mir aussuchen könnte,
würde ich mein Handy wohl trotzdem behalten – aber es öfter
ausschalten.</pre>
<p>(sich verloren fühlen = se sentir perdu · sich merken = retenir · entspannt = détendu · sich aussuchen = choisir · ausschalten = éteindre)</p>`,
    questions: [
      { type: "qcm", q: "Comment se sentirait-on d'abord sans smartphone, selon le texte ?", opts: ["heureux", "perdu (verloren)", "riche", "malade"], a: 1, exp: "« würden wir uns anfangs verloren fühlen »." },
      { type: "input", q: "Complète le Konjunktiv II : « Vielleicht ___ wir mehr miteinander reden. » (würde)", a: ["würden"], ph: "K.II", exp: "würden reden = parlerions (hypothèse)." },
      { type: "qcm", q: "Que pensent certains experts ?", opts: ["on serait plus stressé", "on serait plus détendu et on dormirait mieux", "rien ne changerait", "on gagnerait de l'argent"], a: 1, exp: "« wir wären sogar entspannter und würden besser schlafen »." },
      { type: "vf", q: "L'auteur est totalement certain que la vie serait meilleure sans smartphone.", a: false, exp: "« Sicher ist das nicht » — il nuance." },
      { type: "qcm", q: "Que ferait finalement l'auteur s'il pouvait choisir ?", opts: ["jeter son téléphone", "garder son téléphone mais l'éteindre plus souvent", "acheter deux téléphones", "ne rien changer"], a: 1, exp: "« würde ich mein Handy wohl trotzdem behalten – aber es öfter ausschalten »." }
    ],
    solution: `<p>Le texte est une réflexion <strong>hypothétique</strong> (« Was wäre, wenn... ») entièrement au <strong>Konjunktiv II</strong> : würden fühlen, müssten lernen, würden reden, wären entspannter, würden schlafen. L'auteur imagine qu'on se sentirait d'abord perdu, puis peut-être qu'on communiquerait davantage et dormirait mieux — mais il <strong>nuance</strong> aussitôt (« Sicher ist das nicht »). Sa conclusion personnelle : il garderait son téléphone, tout en l'éteignant plus souvent.</p>
<p>Observe l'alternance entre <strong>formes propres</strong> (wäre, hätte, müsste, könnte) et <strong>würde + infinitif</strong>, ainsi que les adverbes de probabilité (wahrscheinlich, vielleicht, wohl) qui dosent la certitude.</p>`
  }
};
</script>
