  title: "Synthétiser un texte",
  subtitle: "Dégager l'essentiel et reformuler avec ses propres mots en allemand.",
  theory: `
<h3>1. Synthétiser, ce n'est pas recopier</h3>
<p><strong>Synthétiser</strong> (zusammenfassen), c'est réduire un texte à ses idées essentielles et les <strong>reformuler</strong> (umformulieren) avec ses propres mots. On garde la thèse et les arguments principaux, on supprime les exemples et les détails.</p>
<div class="tip">Trois étapes : (1) <strong>lire</strong> et repérer l'idée de chaque paragraphe ; (2) <strong>sélectionner</strong> l'essentiel (thèse + arguments majeurs) ; (3) <strong>reformuler</strong> de façon cohérente, sans recopier des phrases entières.</p></div>
<h3>2. Reformuler : les outils</h3>
<p>Pour ne pas répéter les mots du texte, on utilise des synonymes, la nominalisation et le discours indirect.</p>
<pre class="pseudo">Texte : „Die Firma hat 200 Mitarbeiter entlassen.“
Reformulé : Das Unternehmen hat 200 Angestellte gekündigt.
   (Firma → Unternehmen ; Mitarbeiter → Angestellte ; entlassen → kündigen)</pre>
<pre class="pseudo">Der Autor betont, dass ...      L'auteur souligne que ...
Laut dem Text ...               Selon le texte ...
Der Artikel handelt von ...     L'article traite de ...
Es wird darauf hingewiesen, dass ...  On souligne que ...</pre>
<h3>3. Le discours indirect (die indirekte Rede)</h3>
<p>Pour rapporter ce qu'un texte affirme, l'allemand soigné utilise le <strong>Konjunktiv I</strong>. Au B2, il faut au moins le reconnaître et savoir le former pour la 3e personne.</p>
<pre class="pseudo">Direct :   Er sagt: „Ich bin müde.“
Indirect : Er sagt, er sei müde.        (sein → sei)
Direct :   Sie sagt: „Ich habe keine Zeit.“
Indirect : Sie sagt, sie habe keine Zeit.  (haben → habe)</pre>
<div class="warn">Formes utiles du Konjunktiv I (3e pers. sing.) : sein → <strong>sei</strong>, haben → <strong>habe</strong>, werden → <strong>werde</strong>, können → <strong>könne</strong>, müssen → <strong>müsse</strong>. Quand la forme se confond avec l'indicatif (au pluriel surtout), on bascule sur le <strong>Konjunktiv II</strong> (würde, hätte...).</p></div>
<h3>4. Nominaliser pour condenser</h3>
<p>La <strong>nominalisation</strong> transforme un verbe en nom pour gagner de la place, ce qui est très allemand.</p>
<pre class="pseudo">Die Preise steigen.   →  der Anstieg der Preise (la hausse des prix)
Man baut ein Werk.    →  der Bau eines Werks (la construction d'une usine)
Die Firma wächst.     →  das Wachstum der Firma (la croissance de l'entreprise)</pre>
<h3>5. Un texte à synthétiser</h3>
<p>Voici un texte source ; observe ensuite sa synthèse.</p>
<pre class="pseudo">SOURCE :
Immer mehr junge Menschen in Deutschland ziehen es vor, kein
eigenes Auto mehr zu besitzen. Sie nutzen stattdessen Carsharing,
Fahrräder und öffentliche Verkehrsmittel. Der Grund ist nicht nur
das Geld: Viele wollen auch die Umwelt schützen und den Stress des
Autofahrens vermeiden. Experten sagen, dass sich dieser Trend in
den Großstädten weiter verstärken wird. Auf dem Land jedoch bleibt
das Auto oft unverzichtbar, weil es kaum Alternativen gibt.

SYNTHÈSE (3 phrases) :
Laut dem Text verzichten immer mehr junge Deutsche in den Städten
auf ein eigenes Auto und nutzen lieber Carsharing, Rad und Bus.
Die Gründe seien finanzieller, ökologischer und praktischer Art.
Auf dem Land bleibe das Auto dagegen unverzichtbar.</pre>
<p>(verzichten auf = renoncer à · stattdessen = à la place · vermeiden = éviter · unverzichtbar = indispensable · dagegen = en revanche)</p>`,
  exercises: [

    { type: "qcm", q: "Dans une synthèse, que supprime-t-on en priorité ?", opts: ["la thèse", "les exemples et détails secondaires", "les arguments principaux", "le sujet"], a: 1, exp: "On coupe les exemples et détails, on garde thèse + arguments majeurs." },
    { type: "qcm", q: "Reformuler « die Firma » sans le répéter, on peut dire…", opts: ["das Auto", "das Unternehmen", "der Mitarbeiter", "die Steuer"], a: 1, exp: "das Unternehmen = synonyme de die Firma (l'entreprise)." },

    { type: "qcm", q: "À quoi sert le Konjunktiv I dans une synthèse ?", opts: ["à donner un ordre", "à rapporter ce que le texte affirme (discours indirect)", "à poser une question", "à exprimer le passé"], a: 1, exp: "Il marque le discours rapporté : « der Autor sagt, es sei... »." },
    { type: "qcm", q: "Nominalise « Die Preise steigen ».", opts: ["der Anstieg der Preise", "die Preise gestiegen", "steigende Preisen", "preislich steigen"], a: 0, exp: "steigen → der Anstieg : la hausse des prix." },

    { type: "qcm", q: "Quelle formule introduit correctement une synthèse ?", opts: ["Ich glaube fest, dass...", "Laut dem Text / Der Artikel handelt von...", "Zum Glück...", "Na toll..."], a: 1, exp: "« Laut dem Text... », « Der Artikel handelt von... » situent le propos rapporté." },
    { type: "vf", q: "Une bonne synthèse peut recopier des phrases entières du texte source.", a: false, exp: "Il faut reformuler ; recopier n'est pas synthétiser." },
    { type: "qcm", q: "Selon le texte source, pourquoi des jeunes renoncent-ils à la voiture ?", opts: ["seulement pour l'argent", "pour l'argent, l'environnement et éviter le stress", "parce que c'est interdit", "pour aucune raison"], a: 1, exp: "« nicht nur das Geld ... die Umwelt schützen ... Stress vermeiden »." },
    { type: "qcm", q: "Où la voiture reste-t-elle indispensable selon le texte ?", opts: ["dans les grandes villes", "à la campagne (auf dem Land)", "partout", "nulle part"], a: 1, exp: "« Auf dem Land bleibt das Auto oft unverzichtbar »." },
    { type: "input", q: "Complète : « immer mehr junge Deutsche ___ auf ein eigenes Auto. » (renoncent à)", a: ["verzichten"], ph: "verbe", exp: "verzichten auf = renoncer à." },
    { type: "qcm", q: "Dans la synthèse modèle, pourquoi lit-on « seien » et « bleibe » ?", opts: ["ce sont des fautes", "c'est le Konjunktiv I du discours indirect (on rapporte le texte)", "c'est le passé", "c'est l'impératif"], a: 1, exp: "seien/bleibe = Konjunktiv I : on rapporte ce que le texte affirme." },
    { type: "qcm", q: "Combien de phrases fait la synthèse modèle par rapport à la source ?", opts: ["plus longue", "à peu près la même longueur", "beaucoup plus courte (3 phrases)", "une seule phrase"], a: 2, exp: "La synthèse condense un paragraphe en trois phrases." }
  ],
  final: {
    title: "Exercice final — Eine Synthese beurteilen",
    intro: `<p>Lis ce texte source, puis évalue une proposition de synthèse.</p>
<pre class="pseudo">SOURCE :
Viele Städte führen zurzeit ein Tempolimit von 30 km/h ein.
Befürworter argumentieren, dass langsameres Fahren die Zahl der
Unfälle senkt und die Luft sauberer macht. Außerdem werde es in
den Straßen leiser. Gegner dagegen befürchten längere Fahrzeiten
und mehr Staus. Studien aus mehreren Städten zeigen jedoch, dass
der Verkehr insgesamt kaum langsamer wird, die Sicherheit aber
deutlich zunimmt.

SYNTHÈSE PROPOSÉE :
Der Text berichtet, dass viele Städte Tempo 30 einführen.
Befürworter sähen darin mehr Sicherheit, weniger Lärm und sauberere
Luft, während Gegner längere Fahrzeiten fürchteten. Studien zeigten
aber, dass die Sicherheit steige, ohne dass der Verkehr wirklich
langsamer werde.</pre>
<p>(einführen = instaurer · der Befürworter = le partisan · der Gegner = l'opposant · befürchten = redouter · zunehmen = augmenter)</p>`,
    questions: [
      { type: "vf", q: "La synthèse proposée reformule le texte au lieu de le recopier mot à mot.", a: true, exp: "Elle condense et reformule (sähen, fürchteten, steige)." },
      { type: "qcm", q: "Quel argument des partisans la synthèse retient-elle ?", opts: ["moins d'impôts", "plus de sécurité, moins de bruit, air plus propre", "des routes plus larges", "des voitures gratuites"], a: 1, exp: "« mehr Sicherheit, weniger Lärm und sauberere Luft »." },
      { type: "qcm", q: "Quel argument des opposants est mentionné ?", opts: ["la peur des accidents", "les temps de trajet plus longs", "la pollution accrue", "le coût des panneaux"], a: 1, exp: "« Gegner ... längere Fahrzeiten fürchteten »." },
      { type: "qcm", q: "Que révèlent les études selon la synthèse ?", opts: ["le trafic devient beaucoup plus lent", "la sécurité augmente sans vrai ralentissement du trafic", "rien ne change", "les accidents augmentent"], a: 1, exp: "« die Sicherheit steige, ohne dass der Verkehr wirklich langsamer werde »." },
      { type: "input", q: "Cite une forme de Konjunktiv I utilisée dans la synthèse (discours indirect).", a: ["steige", "werde", "sähen", "fürchteten", "einführe"], ph: "un verbe", exp: "steige, werde, sähen... : le Konjunktiv marque le propos rapporté." }
    ],
    solution: `<p>La synthèse proposée est <strong>réussie</strong> : elle est nettement plus courte que la source, <strong>reformule</strong> sans recopier, garde l'équilibre entre partisans et opposants, et conserve le résultat clé des études (plus de sécurité, sans vrai ralentissement). Elle emploie correctement le <strong>Konjunktiv I / II</strong> du discours indirect (sähen, fürchteten, steige, werde) pour signaler qu'elle rapporte les propos du texte.</p>
<p>Retiens la méthode : idée par paragraphe → sélection thèse+arguments → reformulation avec synonymes, nominalisation et discours indirect. Ne jamais donner son propre avis dans une synthèse.</p>`
  }
};
