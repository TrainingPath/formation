        { qui: "Dr. Ostermann", txt: "Frau Karim, schön, dass Sie es einrichten konnten. Ihre Unterlagen haben uns überzeugt — allerdings hätte ich gern gewusst, warum Sie sich gerade jetzt verändern möchten.", fr: "Madame Karim, ravie que vous ayez pu vous libérer. Votre dossier nous a convaincus — cela dit, j'aimerais savoir pourquoi vous souhaitez changer justement maintenant." },

        { qui: "Dr. Ostermann", txt: "Eine ehrliche Antwort, die ich zu schätzen weiß. Zum Gehalt: Welche Vorstellung haben Sie?", fr: "Une réponse honnête, que j'apprécie. Concernant le salaire : quelles sont vos prétentions ?" },

        { type: "qcm", q: "TEXT: Seit dem 1. März gilt in der Stadtverwaltung Ravensbrunn eine neue Dienstvereinbarung zum mobilen Arbeiten. Bis zu drei Tage pro Woche dürfen die rund 900 Beschäftigten von zu Hause aus arbeiten. Der Personalrat hatte jahrelang darauf gedrängt. Die Verwaltungsspitze zeigte sich lange zurückhaltend; man befürchtete Kontrollverlust. Ausschlaggebend war schließlich eine interne Erhebung: 71 Prozent der Befragten gaben an, sie seien im Homeoffice konzentrierter. Bürgermeisterin Hartl erklärte, die Vereinbarung sei ein Kompromiss, mit dem beide Seiten leben könnten. Kritik kommt aus dem Bürgerservice. Dort ist Präsenz unvermeidlich, weil der Schalter geöffnet sein muss. Eine Sachbearbeiterin, die anonym bleiben möchte, spricht von einer Zweiklassengesellschaft. Die Verwaltung verweist auf einen Ausgleich in Form zusätzlicher freier Tage. Ob dieser Ausgleich als gleichwertig empfunden wird, ist offen. Fest steht: Die Vereinbarung ist zunächst auf zwei Jahre befristet. Danach wird neu verhandelt. Beobachter halten eine Ausweitung für wahrscheinlich, sofern die Krankenstände nicht steigen. — Wie viele Tage Homeoffice sind maximal erlaubt?", opts: ["Zwei", "Drei", "Vier", "Fünf"], a: 1, exp: "Bis zu drei Tage pro Woche. Bis zu marque un plafond : trois est un maximum, pas un droit acquis chaque semaine." },

        { type: "vf", q: "Der Text sagt ausdrücklich, dass die Erhebung wissenschaftlich zuverlässig ist.", a: false, exp: "Faux, et c'est le point d'implicite : gaben an + Konjunktiv I marque une distance. Le texte rapporte des déclarations, il ne les valide pas." },
        { type: "qcm", q: "Warum ist im Bürgerservice Präsenz unvermeidlich?", opts: ["Weil dort keine Computer stehen", "Weil der Schalter geöffnet sein muss", "Weil das Gesetz es verlangt", "Weil der Personalrat es fordert"], a: 1, exp: "Der Schalter muss geöffnet sein : Zustandspassiv (résultat, état) et non wird geöffnet, qui désignerait l'action d'ouvrir." },
        { type: "qcm", q: "Was meint die Sachbearbeiterin mit Zweiklassengesellschaft?", opts: ["Dass es zwei Gehaltsstufen gibt", "Dass manche Beschäftigte bevorzugt werden", "Dass die Stadt zwei Standorte hat", "Dass es zwei Gewerkschaften gibt"], a: 1, exp: "Le mot dénonce une inégalité de traitement entre ceux qui peuvent télétravailler et les autres. Le terme est fortement connoté." },
        { type: "vf", q: "Der Text bewertet den Ausgleich durch freie Tage als eindeutig gerecht.", a: false, exp: "Faux. Ob dieser Ausgleich als gleichwertig empfunden wird, ist offen : la formule ist offen suspend explicitement tout jugement." },
        { type: "qcm", q: "Wie lange gilt die Vereinbarung zunächst?", opts: ["Ein Jahr", "Zwei Jahre", "Drei Jahre", "Unbefristet"], a: 1, exp: "Auf zwei Jahre befristet. Befristet s'oppose à unbefristet — distinction essentielle dans le vocabulaire du travail." },
        { type: "qcm", q: "Unter welcher Bedingung halten Beobachter eine Ausweitung für wahrscheinlich?", opts: ["Wenn die Kosten sinken", "Wenn die Krankenstände nicht steigen", "Wenn der Personalrat zustimmt", "Wenn die Bürgermeisterin wiedergewählt wird"], a: 1, exp: "Sofern die Krankenstände nicht steigen. Sofern introduit une condition restrictive, plus formelle que wenn." }
      ]
    },
    {
      id: "doc",
      nom: "Document authentique",
      consigne: "Étudiez cette lettre de motivation (Bewerbungsschreiben) et répondez.",
      exercices: [
        { type: "qcm", q: "DOKUMENT: Sehr geehrte Frau Dr. Ostermann, mit großem Interesse habe ich Ihre Stellenausschreibung für die Position der Projektleiterin gelesen, die am 12. April auf Ihrer Website veröffentlicht wurde. Nach fünf Jahren in der Projektsteuerung eines mittelständischen Unternehmens suche ich eine Aufgabe mit mehr Gestaltungsspielraum. In meiner jetzigen Position verantworte ich ein Team von acht Mitarbeitenden sowie ein Jahresbudget von 1,2 Millionen Euro. Die von mir geleitete Umstrukturierung wurde termingerecht abgeschlossen; die dabei gewonnenen Erkenntnisse würde ich gern bei Ihnen einbringen. Besonders reizt mich, dass die Strukturen der neuen Abteilung noch nicht festgelegt sind. Über die Gelegenheit zu einem persönlichen Gespräch würde ich mich sehr freuen. Mit freundlichen Grüßen, Leila Karim. — Woher kennt die Bewerberin die Stelle?", opts: ["Von einem Bekannten", "Aus der Zeitung", "Von der Website des Unternehmens", "Von der Agentur für Arbeit"], a: 2, exp: "Auf Ihrer Website veröffentlicht wurde : Vorgangspassiv au prétérit, car on décrit l'acte de publication." },
        { type: "qcm", q: "Welche Anrede ist im Deutschen korrekt, wenn der Name bekannt ist?", opts: ["Hallo Frau Ostermann", "Sehr geehrte Frau Dr. Ostermann", "Liebe Frau Ostermann", "Guten Tag Ostermann"], a: 1, exp: "Sehr geehrte + titre est la formule standard écrite. Liebe suppose une relation établie ; Hallo est trop familier à l'écrit formel." },
        { type: "input", q: "Ergänzen Sie die Schlussformel: Mit freundlichen …", a: ["Grüßen", "Grüssen", "Gruessen", "Grussen", "Grüße", "Grusse"], ph: "ein Wort", exp: "Mit freundlichen Grüßen — datif pluriel après mit. Écriture ASCII acceptée : Gruessen." },
        { type: "vf", q: "Die Formulierung die von mir geleitete Umstrukturierung ist eine Partizipialkonstruktion.", a: true, exp: "Vrai. Elle condense die Umstrukturierung, die ich geleitet habe. Le participe II antéposé est la marque du style écrit soigné." },
        { type: "qcm", q: "Wofür steht würde ich gern einbringen?", opts: ["Für eine Vergangenheit", "Für eine höfliche Absichtserklärung", "Für einen Befehl", "Für eine Vermutung"], a: 1, exp: "Le Konjunktiv II sert ici de politesse et de prudence : l'embauche n'étant pas acquise, l'indicatif werde einbringen serait présomptueux." },
        { type: "qcm", q: "Welches Budget verantwortet die Bewerberin?", opts: ["1,2 Millionen Euro", "2,1 Millionen Euro", "1,2 Milliarden Euro", "120.000 Euro"], a: 0, exp: "1,2 Millionen Euro. Rappel : en allemand la virgule est le séparateur décimal, le point le séparateur des milliers." },
        { type: "vf", q: "Der Satz Die Umstrukturierung wurde termingerecht abgeschlossen steht im Zustandspassiv.", a: false, exp: "Faux : c'est un Vorgangspassiv (wurde + participe), qui décrit le déroulement. Le Zustandspassiv serait ist abgeschlossen, l'état résultant." },
        { type: "input", q: "Wie viele Mitarbeitende führt die Bewerberin? (Zahl in Ziffern)", a: ["8", "acht"], ph: "Zahl", exp: "Acht. Mitarbeitende est un participe substantivé, forme épicène de plus en plus courante à l'écrit administratif." },
        { type: "qcm", q: "Was reizt die Bewerberin besonders?", opts: ["Das höhere Gehalt", "Die offenen Strukturen der neuen Abteilung", "Der kurze Arbeitsweg", "Die Firmenwagenregelung"], a: 1, exp: "Dass die Strukturen noch nicht festgelegt sind. Mentionner le salaire dans une lettre de motivation est un faux pas en Allemagne." },
        { type: "qcm", q: "Welche Formulierung ist am Ende eines Bewerbungsschreibens am angemessensten?", opts: ["Ich erwarte Ihre Antwort", "Rufen Sie mich an", "Über die Gelegenheit zu einem Gespräch würde ich mich sehr freuen", "Melden Sie sich schnell"], a: 2, exp: "La formule au Konjunktiv II est la norme : elle exprime un souhait sans exiger, là où erwarte ou l'impératif seraient perçus comme présomptueux." }
      ]
    },
    {
      id: "syn",
      nom: "Synonymes et nuances",
      consigne: "Choisissez le synonyme ou l'équivalent le plus proche dans le contexte.",
      exercices: [
        { type: "qcm", q: "einräumen (einen Fehler) bedeutet hier etwa …", opts: ["bestreiten", "zugeben", "verschweigen", "übertreiben"], a: 1, exp: "Zugeben. Einräumen est plus formel et implique qu'on cède sur un point discuté ; zugeben peut être purement factuel." },
        { type: "qcm", q: "vertretbar bedeutet …", opts: ["unvermeidlich", "verantwortbar, zu rechtfertigen", "verboten", "unklar"], a: 1, exp: "Vertretbar = qu'on peut défendre devant autrui. À distinguer de vertretend (remplaçant) et de verträglich (supportable)." },
        { type: "qcm", q: "nachvollziehbar bedeutet …", opts: ["wiederholbar", "verständlich, einleuchtend", "verhandelbar", "vermeidbar"], a: 1, exp: "Verständlich. Nachvollziehen = refaire mentalement le chemin de quelqu'un, d'où compréhensible du point de vue de l'autre." },
        { type: "qcm", q: "Welcher Ausdruck ersetzt allerdings am besten?", opts: ["deswegen", "jedoch", "also", "somit"], a: 1, exp: "Jedoch. Allerdings introduit une restriction après un accord partiel ; deswegen, also et somit sont consécutifs." },
        { type: "qcm", q: "sich bewähren bedeutet …", opts: ["sich beschweren", "sich als geeignet erweisen", "sich bewerben", "sich bedanken"], a: 1, exp: "Sich als geeignet erweisen. Piège phonétique avec sich bewerben (postuler) et sich beschweren (se plaindre)." },
        { type: "qcm", q: "Was bedeutet auf jemandes Konto gehen?", opts: ["Geld überweisen", "jemandem zuzuschreiben sein", "ein Konto eröffnen", "Schulden machen"], a: 1, exp: "Être imputable à quelqu'un. Redewendung du registre professionnel, tournure imagée mais parfaitement courante en réunion." },
        { type: "qcm", q: "tragfähig (eine tragfähige Lösung) bedeutet …", opts: ["schwer", "belastbar, dauerhaft brauchbar", "vorläufig", "kostenlos"], a: 1, exp: "Belastbar. L'image est celle d'une structure qui porte la charge : une solution qui tiendra dans la durée." },
        { type: "qcm", q: "ausschlaggebend bedeutet …", opts: ["nebensächlich", "entscheidend", "zweifelhaft", "vorläufig"], a: 1, exp: "Entscheidend. L'image vient de la balance dont l'aiguille penche (Ausschlag). Registre nettement plus soutenu que wichtig." },
        { type: "qcm", q: "Welches Verb passt am besten: einen Vorschlag …?", opts: ["unterbreiten", "unterhalten", "unternehmen", "unterschreiben"], a: 0, exp: "Einen Vorschlag unterbreiten est la collocation formelle. Machen est correct mais neutre ; les trois autres verbes sont hors sens." },
        { type: "qcm", q: "Was bedeutet etwas gelten lassen?", opts: ["etwas ablehnen", "etwas als berechtigt anerkennen", "etwas bezahlen", "etwas vergessen"], a: 1, exp: "Reconnaître la validité d'un argument sans forcément l'adopter — nuance que zustimmen ne rend pas." }
      ]
    },
    {
      id: "ant",
      nom: "Antonymes",
      consigne: "Donnez ou choisissez le contraire du mot proposé.",
      exercices: [
        { type: "qcm", q: "Das Gegenteil von befristet ist …", opts: ["begrenzt", "unbefristet", "beendet", "verlängert"], a: 1, exp: "Unbefristet. En allemand le préfixe un- suffit ; ne pas confondre avec entfristet, qui désigne l'acte de rendre un contrat permanent." },
        { type: "input", q: "Das Gegenteil von die Obergrenze ist die …", a: ["Untergrenze", "untergrenze"], ph: "Nomen", exp: "Untergrenze. Le couple ober-/unter- structure tout ce champ lexical : Obergeschoss/Untergeschoss, Oberarm/Unterarm." },
        { type: "qcm", q: "Das Gegenteil von zurückhaltend ist …", opts: ["vorsichtig", "aufgeschlossen", "still", "bescheiden"], a: 1, exp: "Aufgeschlossen (ouvert). Vorsichtig et bescheiden sont au contraire proches de zurückhaltend." },
        { type: "input", q: "Das Gegenteil von der Erfolg ist der …", a: ["Misserfolg", "misserfolg", "Missachtung"], ph: "Nomen", exp: "Misserfolg. Le préfixe miss- exprime l'échec ou le raté : Missverständnis, Misstrauen, missglücken." },
        { type: "qcm", q: "Das Gegenteil von einräumen (zugeben) ist …", opts: ["bestreiten", "erklären", "erlauben", "berichten"], a: 0, exp: "Bestreiten (contester). On rencontre les deux dans le dialogue 2 : Die Zahlen bestreite ich nicht face à das räume ich ein." },
        { type: "qcm", q: "Das Gegenteil von vermeidbar ist …", opts: ["unvermeidlich", "vermeidend", "vermittelbar", "vermeintlich"], a: 0, exp: "Unvermeidlich. Attention à vermeintlich (prétendu, supposé), faux ami graphique très proche." },
        { type: "input", q: "Das Gegenteil von die Mehrkosten sind die …", a: ["Einsparungen", "einsparungen", "Ersparnisse"], ph: "Nomen im Plural", exp: "Einsparungen. Le verbe einsparen (économiser en réduisant) se distingue de sparen (mettre de côté)." },
        { type: "qcm", q: "Das Gegenteil von der Vorgesetzte ist …", opts: ["der Kollege", "der Untergebene", "der Kunde", "der Bewerber"], a: 1, exp: "Der Untergebene, forme hiérarchique ancienne. Le monde du travail actuel préfère Mitarbeitende, jugé moins vertical." },
        { type: "qcm", q: "Das Gegenteil von die Zustimmung ist …", opts: ["die Ablehnung", "die Abstimmung", "die Bestimmung", "die Anpassung"], a: 0, exp: "Die Ablehnung. Attention à Abstimmung (le vote), quasi homographe mais de sens tout autre." },
        { type: "input", q: "Das Gegenteil von der Anstieg ist der …", a: ["Rückgang", "Ruckgang", "rückgang", "ruckgang"], ph: "Nomen", exp: "Rückgang. Couple standard des commentaires de graphiques : ein Anstieg um / ein Rückgang um + accusatif." }
      ]
    },
    {
      id: "motjuste",
      nom: "Le mot juste",
      consigne: "Complétez avec le mot qui convient exactement.",
      exercices: [
        { type: "input", q: "Ich sehe Ihrer Rückmeldung mit Interesse … (Verb am Satzende)", a: ["entgegen"], ph: "Verbzusatz", exp: "Entgegensehen + datif : formule figée de clôture de lettre, nettement plus élégante que ich warte auf." },
        { type: "qcm", q: "Die Kosten sind doppelt so hoch … geplant.", opts: ["als", "wie", "denn", "so"], a: 1, exp: "Wie s'emploie avec so … wie (égalité). Als ne s'utilise qu'avec un comparatif : höher als geplant." },
        { type: "input", q: "Nach … des Antrags fällt die Entscheidung. (Nominalisierung von prüfen)", a: ["Prüfung", "der Prüfung", "Prufung", "der Prufung"], ph: "Nomen", exp: "Der Prüfung, datif après nach. Le style nominal condense nachdem der Antrag geprüft worden ist." },
        { type: "qcm", q: "Er hat angekündigt, er … im Herbst liefern.", opts: ["wird", "werde", "würde", "wäre"], a: 1, exp: "Werde = Konjunktiv I, marque du discours rapporté neutre. Würde signalerait un doute, wird une prise en charge par le locuteur." },
        { type: "input", q: "Das ist bei dieser Marktlage schlicht nicht zu … (versprechen)", a: ["versprechen"], ph: "Infinitiv", exp: "Sein + zu + infinitif = passif de possibilité : kann nicht versprochen werden, en plus concis et plus formel." },
        { type: "qcm", q: "… der Zusammenarbeit bewährt sie sich, folgt die Beförderung.", opts: ["Sofern sich", "Obwohl sich", "Damit sich", "Indem sich"], a: 0, exp: "Sofern = à condition que. Obwohl serait concessif, damit final, indem modal : le sens du lien change du tout au tout." },
        { type: "input", q: "Ich lege bis Monatsende einen überarbeiteten Zeitplan … (Verb)", a: ["vor"], ph: "Verbzusatz", exp: "Vorlegen = présenter officiellement un document. Zeigen serait trop faible dans un contexte de réunion." },
        { type: "qcm", q: "Die Verzögerungen … auf unser Konto.", opts: ["kommen", "gehen", "fallen", "stehen"], a: 1, exp: "Gehen auf jemandes Konto : le verbe est figé dans l'expression, aucun autre ne fonctionne ici." },
        { type: "input", q: "Wir müssen … berücksichtigen, dass die Preise gestiegen sind. (Adverb der Einschränkung)", a: ["allerdings", "jedoch", "dennoch"], ph: "Konnektor", exp: "Allerdings, jedoch ou dennoch conviennent : tous marquent une restriction après une concession." },
        { type: "qcm", q: "Damit … beiden Seiten gedient.", opts: ["ist", "wird", "hat", "sei"], a: 0, exp: "Ist gedient : Zustandspassiv, l'état de satisfaction obtenu. Wird gedient décrirait un processus en cours, absurde ici." }
      ]
    },
    {
      id: "familles",
      nom: "Familles de mots et dérivation",
      consigne: "Formez le mot dérivé demandé.",
      exercices: [
        { type: "input", q: "prüfen → die … (Nomen)", a: ["Prüfung", "Prufung", "prüfung", "prufung"], ph: "Nomen", exp: "Die Prüfung. Le suffixe -ung nominalise l'action ; il donne toujours un féminin." },
        { type: "input", q: "verantworten → die … (Nomen)", a: ["Verantwortung", "verantwortung"], ph: "Nomen", exp: "Die Verantwortung. Noter le doublet Verantwortung (responsabilité) / Verantwortlichkeit (le fait d'être responsable, plus juridique)." },
        { type: "input", q: "die Frist → … (Adjektiv: zeitlich begrenzt)", a: ["befristet", "fristgerecht"], ph: "Adjektiv", exp: "Befristet. Le préfixe be- transforme le nom en verbe befristen, dont le participe II sert d'adjectif." },
        { type: "input", q: "verhandeln → … (Adjektiv: was man verhandeln kann)", a: ["verhandelbar"], ph: "Adjektiv", exp: "Verhandelbar. Le suffixe -bar exprime la possibilité passive, exactement comme -able en français." },
        { type: "input", q: "der Wettbewerb → der … (Person)", a: ["Wettbewerber", "Wettbewerbe"], ph: "Nomen", exp: "Der Wettbewerber. -er dérive le nom d'agent. Attention : Konkurrent est plus courant à l'oral." },
        { type: "input", q: "tragen → … (Adjektiv: belastbar, dauerhaft)", a: ["tragfähig", "tragfahig", "tragbar"], ph: "Adjektiv", exp: "Tragfähig. Le suffixe -fähig indique une capacité active (leistungsfähig, zahlungsfähig), là où -bar est passif." },
        { type: "input", q: "entscheiden → die … (Nomen)", a: ["Entscheidung", "entscheidung"], ph: "Nomen", exp: "Die Entscheidung. Ne pas confondre avec Entscheidungsfindung, le processus qui y mène." },
        { type: "input", q: "die Struktur → … (Verb: neu ordnen, mit Präfix um-)", a: ["umstrukturieren"], ph: "Verb", exp: "Umstrukturieren. Um- exprime ici la réorganisation ; le verbe est inséparable car l'accent porte sur -struk-." },
        { type: "input", q: "das Gehalt → die … (Verhandlung darüber)", a: ["Gehaltsverhandlung", "gehaltsverhandlung"], ph: "Kompositum", exp: "Die Gehaltsverhandlung, avec le -s- de liaison (Fugen-s) fréquent après un radical en -alt." },
        { type: "input", q: "arbeiten → der … (Person, die Arbeit gibt)", a: ["Arbeitgeber", "arbeitgeber"], ph: "Kompositum", exp: "Der Arbeitgeber, et son pendant der Arbeitnehmer. Logique inverse du français employeur/employé : celui qui donne le travail." }
      ]
    },
    {
      id: "fauxamis",
      nom: "Faux amis et pièges",
      consigne: "Attention aux mots trompeurs pour un francophone.",
      exercices: [
        { type: "qcm", q: "Was bedeutet eventuell?", opts: ["éventuellement / peut-être", "finalement", "sicher", "sofort"], a: 0, exp: "Eventuell = peut-être, possiblement. Le faux ami est en sens inverse : l'anglais eventually signifie finalement, pas l'allemand." },
        { type: "qcm", q: "Was bedeutet sensibel?", opts: ["vernünftig", "empfindlich", "sichtbar", "wichtig"], a: 1, exp: "Empfindlich (sensible au sens émotionnel). Le français sensé se dit vernünftig — piège via l'anglais sensible." },
        { type: "qcm", q: "Was bedeutet die Rente?", opts: ["das Einkommen aus Kapital", "die Altersversorgung", "die Miete", "der Gewinn"], a: 1, exp: "Die Rente = la retraite. Une rente au sens financier français se dit eher Kapitalertrag." },
        { type: "qcm", q: "Was bedeutet der Chef in der Standardsprache?", opts: ["der Koch", "der Vorgesetzte", "der Kellner", "der Besitzer"], a: 1, exp: "Der Vorgesetzte. Le cuisinier est der Koch : le sens culinaire du français chef n'existe pas en allemand." },
        { type: "qcm", q: "Was bedeutet die Konkurrenz?", opts: ["die Zusammenarbeit", "der Wettbewerb / die Rivalen", "die Konferenz", "der Vertrag"], a: 1, exp: "La concurrence. Attention à Konferenz, très proche à l'oreille mais sans rapport." },
        { type: "vf", q: "bekommen bedeutet werden.", a: false, exp: "Faux : bekommen = recevoir, obtenir. Faux ami majeur avec l'anglais to become (= werden)." },
        { type: "qcm", q: "Was bedeutet der Termin?", opts: ["das Ende", "die Verabredung / der Zeitpunkt", "der Begriff", "die Frist"], a: 1, exp: "Le rendez-vous ou la date fixée. Le terme au sens de mot se dit der Begriff, l'échéance die Frist." },
        { type: "qcm", q: "Was bedeutet die Direktion in der Firmensprache?", opts: ["die Richtung", "die Unternehmensleitung", "die Abteilung", "die Anweisung"], a: 1, exp: "La direction au sens de l'instance dirigeante. La direction spatiale, c'est die Richtung : les deux sens du français sont distincts en allemand." },
        { type: "qcm", q: "Was bedeutet demonstrieren meistens?", opts: ["zeigen", "an einer Kundgebung teilnehmen", "beweisen", "erklären"], a: 1, exp: "Manifester dans la rue est le sens le plus courant. Pour démontrer, on dira plutôt nachweisen ou beweisen." },
        { type: "qcm", q: "Was bedeutet die Note im Arbeitszeugnis?", opts: ["die Rechnung", "die Bewertung", "die Notiz", "die Mitteilung"], a: 1, exp: "La note d'évaluation. La note écrite se dit die Notiz, la facture die Rechnung : trois faux amis d'un coup." }
      ]
    },
    {
      id: "qr",
      nom: "Question ↔ réponse",
      consigne: "Associez à chaque question la réponse qui convient.",
      exercices: [
        { type: "qcm", q: "Welche Vorstellung haben Sie beim Gehalt?", opts: ["Seit fünf Jahren.", "Ein Rahmen von 68.000 bis 74.000 Euro wäre angemessen.", "Ja, sehr gern.", "Im dritten Stock."], a: 1, exp: "Vorstellung désigne ici les prétentions salariales ; seule une fourchette chiffrée répond à la question." },
        { type: "qcm", q: "Wäre eine Staffelung denkbar?", opts: ["Grundsätzlich ja, bei längerer Vertragsbindung.", "Um acht Uhr.", "Das war letztes Jahr.", "Mit dem Zug."], a: 0, exp: "Question fermée au Konjunktiv II : la réponse reprend le même registre prudent avec grundsätzlich ja." },
        { type: "qcm", q: "Was ist Ihnen dabei misslungen?", opts: ["Ich habe zu spät kommuniziert.", "Vielen Dank.", "Nächste Woche.", "In Hamburg."], a: 0, exp: "Misslingen se construit avec le datif de la personne (mir ist etwas misslungen) et appelle le récit d'un échec." },
        { type: "qcm", q: "Verstehe ich Sie richtig, dass die Überschreitung extern verursacht ist?", opts: ["Nicht ausschließlich.", "Sehr gern.", "Bis Freitag.", "Etwa zwölf Prozent."], a: 0, exp: "Formule de reformulation vérificatrice ; la réponse nuance au lieu de dire simplement nein, plus diplomatique." },
        { type: "qcm", q: "Wie lange schwebt Ihnen vor?", opts: ["Drei Jahre wären die Obergrenze.", "Ganz in der Nähe.", "Weil es günstiger ist.", "Mit Herrn Tanaka."], a: 0, exp: "Vorschweben + datif = avoir en tête, envisager. La question porte sur une durée, d'où une réponse temporelle." },
        { type: "qcm", q: "Ist das für alle tragbar?", opts: ["Ja, ich lege einen Zeitplan vor.", "Im Erdgeschoss.", "Seit acht Monaten.", "Etwa 900 Personen."], a: 0, exp: "Tragbar = acceptable, supportable. La réponse valide l'accord et engage une action concrète." },
        { type: "qcm", q: "Dürfte ich einen Vorschlag machen?", opts: ["Ja, bitte sehr.", "Es regnet.", "Er ist Ingenieur.", "Vor drei Jahren."], a: 0, exp: "Dürfte ich au Konjunktiv II est une demande d'autorisation très polie ; on répond par une autorisation." },
        { type: "qcm", q: "Was ginge uns verloren?", opts: ["Der gesamte Vorsprung.", "Bis Donnerstag.", "Nur zwölf Prozent.", "Im Bürgerservice."], a: 0, exp: "Ginge verloren = Konjunktiv II hypothétique de verloren gehen ; la réponse nomme la perte redoutée." },
        { type: "qcm", q: "Ist die Stelle mit Personalverantwortung verbunden?", opts: ["Sie ist vorgesehen, sofern sich die Zusammenarbeit bewährt.", "Danke, gleichfalls.", "Etwa 42 Prozent.", "Auf der Website."], a: 0, exp: "Verbunden sein mit = être assorti de. La réponse conditionne l'engagement plutôt que de dire oui sèchement." },

        { type: "input", q: "Cela ne peut pas se promettre. (Das …)", a: ["lässt sich nicht versprechen", "ist nicht zu versprechen", "lasst sich nicht versprechen"], ph: "Passiversatz", exp: "Deux alternatives au passif : sich lassen ou sein + zu. Toutes deux évitent le lourd kann nicht versprochen werden." },

        { type: "input", q: "Après examen de la demande… (Nach … des Antrags)", a: ["Prüfung", "der Prüfung", "Prufung", "der Prufung"], ph: "Nominalstil", exp: "Nach der Prüfung des Antrags : deux génitifs enchaînés, marque du style administratif allemand." },
        { type: "input", q: "Si nous avions été informés, nous aurions calculé autrement. (Wären wir informiert …, hätten wir anders kalkuliert.)", a: ["worden"], ph: "ein Wort", exp: "Worden. Le passif irréel du passé combine wären + participe + worden — structure lourde mais très fréquente à l'écrit." },
        { type: "input", q: "Puis-je faire une proposition ? (… ich einen Vorschlag machen?)", a: ["Dürfte", "dürfte", "Durfte", "durfte", "Darf", "darf"], ph: "Modalverb", exp: "Dürfte est plus poli que darf : le Konjunktiv II crée une distance qui adoucit la demande." },
        { type: "input", q: "Le livre récemment paru coûte 30 euros. (Das kürzlich … Buch kostet 30 Euro.)", a: ["erschienene"], ph: "Partizip", exp: "Erschienene. Le participe antéposé est plus dense que la relative, et typique de l'écrit journalistique." }
      ]
    },
    {
      id: "traden",
      nom: "Traduction DE → FR",
      consigne: "Traduisez ou choisissez la meilleure traduction française.",

        { type: "qcm", q: "Ich hätte früher kommen müssen.", opts: ["J'ai dû venir plus tôt.", "J'aurais dû venir plus tôt.", "Je devrais venir plus tôt.", "Je dois venir plus tôt."], a: 1, exp: "Konjunktiv II du passé + modal = regret sur un acte non accompli, donc le conditionnel passé français." },
        { type: "qcm", q: "Das räume ich ein.", opts: ["Je le range.", "Je le conteste.", "Je le concède.", "Je l'ignore."], a: 2, exp: "Einräumen a un sens concret (ranger) et un sens abstrait (concéder) : ici le contexte argumentatif tranche." },
        { type: "qcm", q: "Die Vereinbarung ist auf zwei Jahre befristet.", opts: ["L'accord est limité à deux ans.", "L'accord dure depuis deux ans.", "L'accord est annulé depuis deux ans.", "L'accord commence dans deux ans."], a: 0, exp: "Befristet auf = limité dans le temps à. Auf + accusatif marque la durée prévue." },
        { type: "qcm", q: "Das lässt sich nicht rechtfertigen.", opts: ["Cela ne se justifie pas.", "Cela ne veut pas se justifier.", "Il ne se justifie pas.", "Cela n'a pas été justifié."], a: 0, exp: "Sich lassen = tour de possibilité passive, que le français rend par un pronominal à valeur passive." },
        { type: "qcm", q: "Er sei im Urlaub, sagte sie.", opts: ["Il est en vacances, dit-elle (elle rapporte).", "Il soit en vacances.", "Il serait parti en vacances hier.", "Il était en vacances."], a: 0, exp: "Le Konjunktiv I marque le discours rapporté ; le français utilise l'indicatif plus un verbe de parole." },
        { type: "qcm", q: "Der Schalter ist geöffnet.", opts: ["Le guichet est en train d'être ouvert.", "Le guichet est ouvert.", "Le guichet a ouvert quelqu'un.", "Le guichet ouvrira."], a: 1, exp: "Zustandspassiv = état. Wird geöffnet donnerait on est en train d'ouvrir le guichet." },
        { type: "qcm", q: "Die Verzögerungen gehen auf unser Konto.", opts: ["Les retards sont payés par nous.", "Les retards nous sont imputables.", "Les retards vont sur notre compte bancaire.", "Les retards nous rapportent."], a: 1, exp: "Locution imagée : la traduction littérale bancaire serait un contresens en contexte de réunion." },
        { type: "qcm", q: "Sofern sich die Zusammenarbeit bewährt …", opts: ["Bien que la collaboration soit bonne", "À condition que la collaboration fasse ses preuves", "Depuis que la collaboration fonctionne", "Afin que la collaboration réussisse"], a: 1, exp: "Sofern = à condition que. Sich bewähren, c'est faire ses preuves à l'épreuve du temps." },
        { type: "qcm", q: "Damit wäre beiden Seiten gedient.", opts: ["Cela servirait les deux parties.", "Les deux parties ont été servies.", "Les deux parties servent.", "On sert deux fois."], a: 0, exp: "Jemandem ist gedient = quelqu'un y trouve son compte. Datif impersonnel, sans sujet grammatical apparent." },
        { type: "qcm", q: "Nach Prüfung des Antrags komme ich zu dem Schluss …", opts: ["Après examen de la demande, j'en conclus…", "Avant d'examiner la demande, je conclus…", "Pendant l'examen, je viens à l'école…", "Sans examen, je conclus…"], a: 0, exp: "Style nominal administratif. Zu dem Schluss kommen = parvenir à la conclusion, locution figée." }
      ]
    },
    {
      id: "dictee",

        { type: "input", q: "Ich sehe Ihrer … mit Interesse entgegen. (réponse, retour)", a: ["Rückmeldung", "Ruckmeldung", "rückmeldung", "ruckmeldung"], ph: "Nomen", exp: "Rückmeldung, féminin, datif après entgegensehen. Plus professionnel que Antwort." },
        { type: "input", q: "Die Kosten sind doppelt so hoch … wie geplant. (verbe: se révéler)", a: ["ausgefallen"], ph: "Partizip II", exp: "Ausgefallen. Le verbe ausfallen au sens de s'avérer est très fréquent dans les bilans chiffrés." },
        { type: "input", q: "Ich bestehe auf einer monatlichen … . (obligation de compte rendu)", a: ["Berichtspflicht", "berichtspflicht"], ph: "Kompositum", exp: "Berichtspflicht, avec Fugen-s. Le composé condense die Pflicht, Bericht zu erstatten." },
        { type: "input", q: "Der Hinweis ist … . (fondé, légitime)", a: ["berechtigt"], ph: "Adjektiv", exp: "Berechtigt = fondé en droit ou en raison. Richtig serait plus plat et moins concessif." },
        { type: "input", q: "Das halte ich für eine … Lösung. (viable)", a: ["tragfähige", "tragfahige"], ph: "Adjektiv", exp: "Tragfähige. Halten für + accusatif : la construction impose la déclinaison de l'adjectif épithète." },
        { type: "input", q: "Die Strukturen sind noch nicht … . (fixées, arrêtées)", a: ["festgelegt"], ph: "Partizip II", exp: "Festgelegt, ici en Zustandspassiv (sind) : c'est l'état actuel qui compte, non l'acte de fixer." },
        { type: "input", q: "… war schließlich eine interne Erhebung. (décisif)", a: ["Ausschlaggebend", "ausschlaggebend"], ph: "Adjektiv", exp: "Ausschlaggebend. Placé en tête, il déclenche l'inversion : ausschlaggebend war…" },
        { type: "input", q: "Wir kommen zu dem … , dass eine Verlängerung nötig ist. (conclusion)", a: ["Schluss", "Schluß", "schluss"], ph: "Nomen", exp: "Schluss, datif après zu. Ergebnis serait un résultat, Schluss une conclusion tirée d'un raisonnement." },
        { type: "input", q: "Dann formulieren wir eine … statt einer festen Zahl. (fourchette)", a: ["Bandbreite", "bandbreite", "Spanne"], ph: "Nomen", exp: "Bandbreite (ou Spanne). L'image de la largeur de bande permet de sortir du blocage sur un chiffre unique." },
        { type: "input", q: "Ich lege bis Monatsende einen … Zeitplan vor. (révisé)", a: ["überarbeiteten", "uberarbeiteten", "ueberarbeiteten"], ph: "Adjektiv", exp: "Überarbeiteten : participe II employé comme adjectif, accusatif masculin après einen, d'où -en." }
      ]
    },

      id: "prononciation",

        { type: "qcm", q: "Wo liegt die Betonung bei umstrukturieren?", opts: ["UM-strukturieren", "um-struk-tu-RIE-ren", "um-STRUK-turieren", "umstruktu-RIE-ren mit Trennung"], a: 1, exp: "L'accent tombe sur -rie- : les verbes en -ieren sont toujours accentués sur cette syllabe, et donc inséparables." },
        { type: "qcm", q: "Wie klingt das ü in Prüfung?", opts: ["wie u", "wie i mit gerundeten Lippen", "wie ou", "wie e"], a: 1, exp: "C'est un i avec arrondissement labial, comme le u français de lune. Un francophone part donc d'un son qu'il possède déjà." },
        { type: "qcm", q: "Wie wird ß ausgesprochen?", opts: ["wie ein stimmhaftes s", "wie ein stimmloses s", "wie sch", "wie z"], a: 1, exp: "Toujours sourd, et il signale que la voyelle précédente est longue : Maße (long) face à Masse (bref)." },
        { type: "qcm", q: "Welche Silbe ist bei Verantwortung betont?", opts: ["VER", "ant", "WORT", "ung"], a: 2, exp: "Ver-ANT-wor-tung : l'accent porte sur le radical wort, jamais sur le préfixe inaccentué ver-." },
        { type: "qcm", q: "Wie spricht man das v in verhandeln?", opts: ["wie f", "wie w", "stumm", "wie b"], a: 0, exp: "Comme f dans les mots germaniques. Il se prononce w dans les emprunts : Vase, Verb, Vision." },
        { type: "qcm", q: "Bei Nicht ausschließlich extern — welches Wort trägt den Kontrastakzent?", opts: ["nicht", "ausschließlich", "extern", "kein Wort"], a: 1, exp: "L'accent porte sur ausschließlich : c'est l'exclusivité qui est niée, non la cause externe elle-même." },
        { type: "qcm", q: "Wie endet die Intonation bei einer Entscheidungsfrage (Ist das tragbar?)?", opts: ["fallend", "steigend", "gleichbleibend", "abgebrochen"], a: 1, exp: "Montante, comme en français. Les questions en w- (Wann kommen Sie?) sont au contraire descendantes." },
        { type: "qcm", q: "Wie klingt das ch in Bericht?", opts: ["wie k", "wie sch", "als Ich-Laut, weich", "als Ach-Laut, hart"], a: 2, exp: "Ich-Laut, palatal, après i, e, ä, ö, ü et consonne. L'Ach-Laut vélaire suit a, o, u, au." },
        { type: "qcm", q: "Wie spricht man die Endung -ig in wichtig standardsprachlich?", opts: ["wie -ik", "wie -ich", "wie -ig mit hartem g", "wie -isch"], a: 1, exp: "Comme -ich dans la norme scénique. La prononciation -ik est régionale, surtout dans le sud." },
        { type: "qcm", q: "In Das ist DURCHAUS vertretbar — was signalisiert der Akzent auf durchaus?", opts: ["Zweifel", "Nachdruck und Zustimmung", "Ablehnung", "eine Frage"], a: 1, exp: "L'accent sur l'intensifieur renforce l'adhésion : il balaie une objection anticipée, contrairement à un accent sur vertretbar." }
