<script>
var DAY = {
  num: 25,
  title: "Négocier et convaincre",
  subtitle: "Argumenter, proposer, faire des concessions et trouver un accord en allemand.",
  theory: `
<h3>1. Poser ses attentes</h3>
<p><strong>Négocier</strong> (verhandeln), c'est chercher un accord (eine Einigung) entre des intérêts différents. On commence par exposer clairement ce qu'on veut, poliment mais fermement.</p>
<pre class="pseudo">Ich hätte gern ...             J'aimerais avoir ...
Mir ist wichtig, dass ...      Il est important pour moi que ...
Ich schlage vor, dass ...      Je propose que ...
Wäre es möglich, ...?          Serait-il possible de ... ?
Ich stelle mir vor, dass ...   J'imagine que ... / Je vois ça ainsi ...</pre>
<div class="tip">Le Konjunktiv II (hätte gern, wäre möglich, würde vorschlagen) rend une demande <strong>polie</strong> et négociable. « Ich will » (je veux) est trop direct dans une négociation.</p></div>
<h3>2. Argumenter pour convaincre</h3>
<pre class="pseudo">Der Vorteil dabei ist, dass ...   L'avantage, c'est que ...
Das lohnt sich, weil ...          Ça vaut la peine, parce que ...
Bedenken Sie, dass ...            Considérez que ...
Ein weiteres Argument ist ...     Un autre argument est ...
Davon profitieren beide Seiten.   Les deux parties en profitent.</pre>
<h3>3. Faire des concessions et des contre-propositions</h3>
<p><strong>Concéder</strong> pour avancer : on lâche du lest sur un point pour en gagner un autre. C'est le cœur de la négociation.</p>
<pre class="pseudo">Ich könnte Ihnen entgegenkommen, wenn ...
   Je pourrais faire un geste vers vous, si ...
Einverstanden, aber unter einer Bedingung: ...
   D'accord, mais à une condition : ...
Wie wäre es, wenn wir ...?
   Et si nous ... ? (proposition)
Lassen Sie uns einen Kompromiss finden.
   Trouvons un compromis.</pre>
<div class="warn">« jemandem entgegenkommen » (aller vers qqn, faire un geste) et « unter der Bedingung, dass... » (à condition que...) sont des tournures clés. La concession se marque souvent par « zwar ..., aber ... » vu au jour 17.</p></div>
<h3>4. Refuser poliment et tenir sa position</h3>
<pre class="pseudo">Das kann ich leider nicht akzeptieren.  Je ne peux hélas pas accepter cela.
Da muss ich Sie enttäuschen.            Je dois vous décevoir sur ce point.
Das geht leider zu weit.                Cela va hélas trop loin.
Mein letztes Angebot ist ...            Ma dernière offre est ...</pre>
<h3>5. Conclure l'accord</h3>
<pre class="pseudo">Abgemacht!                    Marché conclu !
Dann sind wir uns einig.      Alors nous sommes d'accord.
Das klingt fair.              Cela semble équitable.
Ich denke, wir haben eine Lösung gefunden.  Nous avons trouvé une solution.</pre>
<h3>6. Un dialogue de négociation</h3>
<pre class="pseudo">Verkäufer: Das Fahrrad kostet 300 Euro. Es ist fast neu.
Käufer:    Das ist mir ehrlich gesagt zu teuer. Ich hätte an 220
           gedacht.
Verkäufer: 220 ist zu wenig. Aber ich könnte Ihnen entgegenkommen:
           270, und ich gebe ein gutes Schloss dazu.
Käufer:    Wie wäre es mit 250 inklusive Schloss? Dann sind wir uns
           einig.
Verkäufer: Einverstanden, aber unter einer Bedingung: Sie zahlen bar.
Käufer:    Abgemacht!</pre>
<p>(das Schloss = l'antivol/le cadenas · bar zahlen = payer en espèces · inklusive = y compris)</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « verhandeln » ?", opts: ["refuser", "négocier", "acheter", "vendre"], a: 1, exp: "verhandeln = négocier ; die Verhandlung = la négociation." },
    { type: "qcm", q: "Quelle formule est la PLUS polie pour exprimer un souhait en négociation ?", opts: ["Ich will das.", "Ich hätte gern ...", "Geben Sie mir das!", "Das ist meins."], a: 1, exp: "Le Konjunktiv II (hätte gern) adoucit la demande." },
    { type: "input", q: "Complète : « Mir ist ___, dass der Preis fair bleibt. » (important)", a: ["wichtig"], ph: "adjectif", exp: "Mir ist wichtig, dass ... = il est important pour moi que ..." },
    { type: "qcm", q: "« jemandem entgegenkommen » signifie…", opts: ["refuser qqn", "faire un geste / venir à la rencontre de qqn", "ignorer qqn", "critiquer qqn"], a: 1, exp: "entgegenkommen = faire un pas vers l'autre (concession)." },
    { type: "input", q: "Complète : « Einverstanden, aber unter einer ___: Sie zahlen bar. » (condition)", a: ["Bedingung"], ph: "un nom", exp: "unter einer Bedingung = à une condition." },
    { type: "qcm", q: "« Wie wäre es, wenn wir uns in der Mitte treffen? » exprime…", opts: ["un refus", "une contre-proposition / compromis", "une menace", "une question sur l'heure"], a: 1, exp: "« Wie wäre es, wenn... » introduit une proposition." },
    { type: "qcm", q: "Comment refuser poliment une offre ?", opts: ["Das ist mir egal.", "Das kann ich leider nicht akzeptieren.", "Nein!", "Sie haben unrecht."], a: 1, exp: "« leider nicht akzeptieren » = refus poli et argumentable." },
    { type: "vf", q: "Le Konjunktiv II (könnte, wäre, hätte) rend les demandes plus négociables et polies.", a: true, exp: "Il ouvre la discussion au lieu de l'imposer." },
    { type: "qcm", q: "« Davon profitieren beide Seiten » est un argument qui met en avant…", opts: ["un inconvénient", "un bénéfice mutuel (gagnant-gagnant)", "un refus", "une menace"], a: 1, exp: "Les deux parties y gagnent : argument fort en négociation." },
    { type: "input", q: "Complète la conclusion : « Dann sind wir uns ___. » (d'accord)", a: ["einig"], ph: "adjectif", exp: "sich einig sein = être d'accord ; « wir sind uns einig »." },
    { type: "qcm", q: "Dans le dialogue, quelle est la première contre-offre du vendeur ?", opts: ["220 Euro", "250 Euro", "270 Euro avec un antivol", "300 Euro"], a: 2, exp: "« 270, und ich gebe ein gutes Schloss dazu »." },
    { type: "qcm", q: "Sur quel prix final se mettent-ils d'accord ?", opts: ["220 Euro", "250 Euro antivol inclus", "270 Euro", "300 Euro"], a: 1, exp: "« Wie wäre es mit 250 inklusive Schloss? ... Einverstanden »." },
    { type: "qcm", q: "Quelle condition le vendeur pose-t-il pour accepter ?", opts: ["une livraison", "un paiement en espèces (bar)", "un acompte", "une garantie"], a: 1, exp: "« unter einer Bedingung: Sie zahlen bar »." },
    { type: "qcm", q: "« Abgemacht! » signifie…", opts: ["c'est refusé", "marché conclu !", "trop cher", "réfléchissons"], a: 1, exp: "Abgemacht = marché conclu, affaire faite." },
    { type: "input", q: "Complète : « Ich ___ Ihnen entgegenkommen, wenn Sie sofort zahlen. » (kön+K.II : pourrais)", a: ["könnte"], ph: "K.II de können", exp: "könnte = pourrais (offre conditionnelle de concession)." }
  ],
  final: {
    title: "Exercice final — Eine Gehaltsverhandlung",
    intro: `<p>Lis cette négociation salariale, puis réponds.</p>
<pre class="pseudo">Mitarbeiterin: Ich arbeite seit drei Jahren hier und übernehme immer
   mehr Verantwortung. Deshalb hätte ich gern eine Gehaltserhöhung
   von zehn Prozent.
Chef: Zehn Prozent sind im Moment schwierig. Bedenken Sie die
   wirtschaftliche Lage.
Mitarbeiterin: Das verstehe ich. Wäre denn eine Erhöhung von fünf
   Prozent möglich, dazu zwei zusätzliche Urlaubstage?
Chef: Fünf Prozent könnte ich vertreten. Bei den Urlaubstagen muss
   ich Sie aber enttäuschen – einen Tag kann ich anbieten.
Mitarbeiterin: Einverstanden, unter einer Bedingung: Wir überprüfen
   mein Gehalt in sechs Monaten erneut.
Chef: Das klingt fair. Abgemacht.</pre>
<p>(die Gehaltserhöhung = l'augmentation de salaire · die Verantwortung = la responsabilité · vertreten = défendre/assumer · überprüfen = réexaminer)</p>`,
    questions: [
      { type: "input", q: "Quelle augmentation la salariée demande-t-elle au départ ? (en %)", a: ["zehn", "zehn Prozent", "10", "10 %", "10 Prozent"], ph: "pourcentage", exp: "« eine Gehaltserhöhung von zehn Prozent »." },
      { type: "qcm", q: "Quel argument la salariée avance-t-elle ?", opts: ["elle est la plus âgée", "elle est là depuis 3 ans et prend plus de responsabilités", "elle veut démissionner", "ses collègues gagnent plus"], a: 1, exp: "« seit drei Jahren ... immer mehr Verantwortung »." },
      { type: "qcm", q: "Que propose-t-elle comme compromis après le refus des 10 % ?", opts: ["rien", "5 % plus deux jours de congés supplémentaires", "20 %", "un départ"], a: 1, exp: "« eine Erhöhung von fünf Prozent ... dazu zwei zusätzliche Urlaubstage »." },
      { type: "qcm", q: "Sur quoi le chef fait-il une concession, et sur quoi refuse-t-il ?", opts: ["accepte 10 %, refuse les congés", "accepte 5 % et un jour de congé, refuse deux jours", "refuse tout", "accepte deux jours, refuse le salaire"], a: 1, exp: "5 % OK, un seul jour de congé au lieu de deux." },
      { type: "vf", q: "L'accord final inclut un réexamen du salaire dans six mois.", a: true, exp: "« unter einer Bedingung: Wir überprüfen mein Gehalt in sechs Monaten erneut. » — « Abgemacht. »" }
    ],
    solution: `<p>La négociation est un modèle : la salariée <strong>expose ses attentes</strong> avec un argument solide (ancienneté + responsabilités) et une demande polie (« hätte ich gern »). Face au refus des 10 %, elle propose un <strong>compromis</strong> (5 % + deux jours de congé). Le chef <strong>concède</strong> les 5 %, refuse un point (« muss ich Sie enttäuschen ») mais fait un geste (un jour). Elle accepte <strong>sous condition</strong> (réexamen dans six mois). Conclusion : « Das klingt fair. Abgemacht. »</p>
<p>Retiens la mécanique : demande argumentée → contre-proposition → concessions réciproques → accord conditionnel. Le <strong>Konjunktiv II</strong> (hätte, wäre, könnte) maintient tout le dialogue dans un registre poli et ouvert.</p>`
  }
};
