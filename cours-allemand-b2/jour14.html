<script>
var DAY = {
  num: 14,
  title: "Rédiger une lettre de motivation (Bewerbung)",
  subtitle: "Le Bewerbungsschreiben : structure, formules et ton d'une candidature convaincante.",
  theory: `
<h3>1. La Bewerbung : de quoi parle-t-on ?</h3>
<p>Une <strong>Bewerbung</strong> (candidature) complète comprend le <strong>Bewerbungsschreiben</strong> (la lettre de motivation), le <strong>Lebenslauf</strong> (le CV) et les <strong>Zeugnisse</strong> (attestations/diplômes). Aujourd'hui nous nous concentrons sur la lettre, exercice écrit exigeant, très formel, où chaque phrase compte.</p>
<div class="tip">La lettre allemande est <strong>sobre et factuelle</strong> : on met en avant ses compétences avec des exemples concrets, sans exagération ni familiarité. On y démontre qu'on a lu l'annonce et compris le poste.</div>
<h3>2. La structure du Bewerbungsschreiben</h3>
<pre class="pseudo">1. Kopf : coordonnées (expéditeur en haut, destinataire dessous), lieu et date
2. Betreff : objet, en gras (« Bewerbung als ... »)
3. Anrede : appellation (« Sehr geehrte Frau ..., » ou « Sehr geehrte Damen und Herren, »)
4. Einleitung : pourquoi j'écris, comment j'ai trouvé l'annonce
5. Hauptteil : mes compétences, mon expérience, ce que j'apporte
6. Schluss : disponibilité, entretien, formule de politesse
7. Grußformel + Unterschrift : « Mit freundlichen Grüßen » + nom</pre>
<h3>3. Modèle de Bewerbungsschreiben</h3>
<pre class="pseudo">Anna Berger                                    Musterstadt, den 19. Juli 2026
Beispielstraße 12, 12345 Musterstadt

Firma Technik GmbH
Personalabteilung
Hauptstraße 1, 54321 Beispielstadt

Bewerbung als Projektassistentin

Sehr geehrte Frau Schmidt,

mit großem Interesse habe ich Ihre Stellenanzeige auf Ihrer Webseite gelesen.
Die ausgeschriebene Position als Projektassistentin entspricht genau meinen
beruflichen Vorstellungen, weshalb ich mich hiermit bei Ihnen bewerbe.

Nach meinem Studium der Betriebswirtschaft habe ich zwei Jahre in einem
internationalen Unternehmen gearbeitet. Dabei konnte ich meine organisatorischen
Fähigkeiten unter Beweis stellen und lernte, mehrere Projekte gleichzeitig zu
koordinieren. Meine sehr guten Deutsch- und Englischkenntnisse sowie mein sicherer
Umgang mit gängiger Software wären für Ihr Team von Vorteil.

Ich bin teamfähig, zuverlässig und arbeite gern lösungsorientiert. Gerne würde ich
diese Eigenschaften in Ihrem Unternehmen einbringen.

Über die Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.

Mit freundlichen Grüßen
Anna Berger</pre>
<h3>4. Les formules clés à réutiliser</h3>
<pre class="pseudo">Ouvrir :   Mit großem Interesse habe ich Ihre Stellenanzeige gelesen.
           Hiermit bewerbe ich mich um die Stelle als ...
Se vendre : Ich verfüge über mehrjährige Erfahrung in ...
           Zu meinen Stärken zählen ... / Ich bringe ... mit.
           ... konnte ich meine Fähigkeiten unter Beweis stellen.
Motiver :   Die Position reizt mich besonders, weil ...
           Ich möchte meine Kenntnisse in Ihr Team einbringen.
Conclure :  Über eine Einladung zu einem Vorstellungsgespräch würde ich mich freuen.
           Für Rückfragen stehe ich Ihnen gerne zur Verfügung.</pre>
<div class="warn">Évite les banalités (« Ich bin motiviert und fleißig ») sans preuve. Chaque qualité annoncée doit être <strong>illustrée</strong> par une expérience concrète. Et adapte toujours la lettre à l'annonce précise : une lettre passe-partout se repère aussitôt.</div>
<h3>5. Le ton juste</h3>
<p>Ni arrogant, ni servile : <strong>assuré et factuel</strong>. On emploie le Konjunktiv II de politesse (würde mich freuen, wären von Vorteil), le vouvoiement (Sie/Ihnen/Ihr), et un vocabulaire précis (verfügen über, einbringen, unter Beweis stellen).</p>
<div class="tip">Signature écrite : la lettre allemande se termine par « Mit freundlichen Grüßen », un saut de ligne, puis le nom. Dans une version papier, on signe à la main entre les deux.</div>`,
  exercises: [
    { type: "qcm", q: "Que désigne le mot « Bewerbungsschreiben » ?", opts: ["le CV", "la lettre de motivation", "le diplôme", "l'entretien"], a: 1, exp: "Das Bewerbungsschreiben = la lettre de motivation (le CV est der Lebenslauf)." },
    { type: "qcm", q: "Comment s'appelle le CV en allemand ?", opts: ["das Zeugnis", "der Lebenslauf", "der Betreff", "die Anrede"], a: 1, exp: "Der Lebenslauf = le curriculum vitae." },
    { type: "input", q: "Complète l'objet de la lettre : « ___ als Projektassistentin » (mot signifiant candidature)", a: ["Bewerbung"], ph: "nom", exp: "Betreff : Bewerbung als ... = Candidature au poste de..." },
    { type: "qcm", q: "Quelle appellation (Anrede) utiliser si on ne connaît pas le nom du destinataire ?", opts: ["Liebe Firma,", "Hallo,", "Sehr geehrte Damen und Herren,", "Guten Tag alle,"], a: 2, exp: "Sehr geehrte Damen und Herren = Madame, Monsieur (destinataire inconnu)." },
    { type: "input", q: "Complète l'ouverture : « Mit großem Interesse habe ich Ihre ___ gelesen. » (nom : offre d'emploi)", a: ["Stellenanzeige"], ph: "nom", exp: "die Stellenanzeige = l'annonce/offre d'emploi." },
    { type: "qcm", q: "« Ich verfüge über mehrjährige Erfahrung in ... » signifie…", opts: ["je cherche de l'expérience", "je dispose de plusieurs années d'expérience en...", "je n'ai pas d'expérience", "je vais acquérir de l'expérience"], a: 1, exp: "verfügen über = disposer de : une formule clé pour se présenter." },
    { type: "input", q: "Complète : « ... konnte ich meine Fähigkeiten unter ___ stellen. » (locution : faire ses preuves)", a: ["Beweis"], ph: "nom", exp: "unter Beweis stellen = faire ses preuves, démontrer." },
    { type: "vf", q: "Dans une lettre de motivation allemande, il vaut mieux illustrer chaque qualité par une expérience concrète.", a: true, exp: "Les affirmations non prouvées (« ich bin motiviert ») sonnent creux." },
    { type: "qcm", q: "Quelle formule conclut poliment en évoquant l'entretien ?", opts: ["Tschüss!", "Über eine Einladung zu einem Vorstellungsgespräch würde ich mich freuen.", "Ruf mich an!", "Bis bald."], a: 1, exp: "C'est la formule de clôture standard avant la Grußformel." },
    { type: "input", q: "Complète la formule de clôture (Grußformel) : « Mit freundlichen ___ » ", a: ["Grüßen","Grüssen","Gruessen"], ph: "nom", exp: "Mit freundlichen Grüßen = formule de politesse finale standard." },
    { type: "qcm", q: "Comment appelle-t-on l'entretien d'embauche en allemand ?", opts: ["das Vorstellungsgespräch", "der Lebenslauf", "die Anrede", "das Zeugnis"], a: 0, exp: "Das Vorstellungsgespräch = l'entretien d'embauche." },
    { type: "qcm", q: "Quel ton convient à une lettre de motivation allemande ?", opts: ["familier et drôle", "arrogant", "assuré et factuel, avec vouvoiement et Konjunktiv II de politesse", "servile et hésitant"], a: 2, exp: "Ni arrogant ni servile : factuel, poli, précis." },
    { type: "input", q: "Complète : « Für Rückfragen stehe ich Ihnen gerne zur ___. » (nom : disposition)", a: ["Verfügung"], ph: "nom", exp: "zur Verfügung stehen = être à disposition." },
    { type: "vf", q: "Une même lettre passe-partout, non adaptée à l'annonce, est un bon choix pour gagner du temps.", a: false, exp: "Au contraire : une lettre générique se repère et nuit à la candidature. On adapte toujours." },
    { type: "input", q: "Complète : « Zu meinen ___ zählen Teamfähigkeit und Zuverlässigkeit. » (nom : points forts, pluriel)", a: ["Stärken","Staerken"], ph: "nom", exp: "Zu meinen Stärken zählen ... = parmi mes points forts figurent..." }
  ],
  final: {
    title: "Exercice final — Un Bewerbungsschreiben à décoder",
    intro: `<p>Lis cet extrait de lettre de motivation et analyse ses procédés.</p>
<pre class="pseudo">Sehr geehrter Herr Wagner,

mit großem Interesse habe ich Ihre Stellenanzeige für die Position als Kundenberaterin
gelesen und bewerbe mich hiermit um diese Stelle.

Nach meiner Ausbildung im Einzelhandel habe ich drei Jahre in einem Kundenservice
gearbeitet. Dabei konnte ich meine kommunikativen Fähigkeiten unter Beweis stellen
und lernte, auch in schwierigen Situationen ruhig und lösungsorientiert zu bleiben.
Zu meinen Stärken zählen Geduld, Empathie und ein sicherer Umgang mit Kunden.

Die ausgeschriebene Position reizt mich besonders, weil ich meine Erfahrung in einem
zukunftsorientierten Unternehmen wie dem Ihren einbringen möchte.

Über die Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.

Mit freundlichen Grüßen
Laura Fischer</pre>
<p>(die Ausbildung = la formation · der Einzelhandel = le commerce de détail · Empathie = l'empathie)</p>`,
    questions: [
      { type: "input", q: "Relève l'appellation complète du destinataire connu : « Sehr geehrter ___ Wagner, »", a: ["Herr"], ph: "mot", exp: "Sehr geehrter Herr Wagner (destinataire masculin nommé)." },
      { type: "qcm", q: "Comment la candidate prouve-t-elle ses compétences plutôt que de simplement les affirmer ?", opts: ["elle ne les prouve pas", "elle cite son expérience (trois ans en service client) où elle a fait ses preuves", "elle promet de les acquérir", "elle cite un diplôme uniquement"], a: 1, exp: "Elle relie chaque qualité à une expérience concrète (unter Beweis stellen)." },
      { type: "qcm", q: "« Die Position reizt mich besonders, weil ... » sert à…", opts: ["se plaindre", "exprimer sa motivation pour le poste", "décrire le salaire", "refuser l'offre"], a: 1, exp: "reizen = attirer ; la candidate justifie sa motivation." },
      { type: "input", q: "Relève la formule de clôture polie : « Mit freundlichen ___ ».", a: ["Grüßen","Grüssen","Gruessen"], ph: "nom", exp: "Mit freundlichen Grüßen : clôture formelle standard." },
      { type: "vf", q: "La lettre emploie le Konjunktiv II de politesse (« würde ich mich freuen ») et le vouvoiement, comme il convient à une candidature formelle.", a: true, exp: "Sie/Ihren + würde mich freuen : registre formel et poli attendu." }
    ],
    solution: `<p>Cette lettre est un modèle de Bewerbungsschreiben. Elle respecte la structure : <strong>Anrede</strong> personnalisée (Sehr geehrter Herr Wagner), <strong>Einleitung</strong> (interêt pour l'annonce + candidature), <strong>Hauptteil</strong> (formation, expérience, qualités PROUVÉES par le vécu : unter Beweis stellen, Zu meinen Stärken zählen), <strong>Motivation</strong> (Die Position reizt mich, weil...), <strong>Schluss</strong> (souhait d'entretien) et <strong>Grußformel</strong> (Mit freundlichen Grüßen).</p>
<p>Le ton est assuré et factuel, avec vouvoiement systématique et Konjunktiv II de politesse (würde mich freuen). Chaque qualité s'appuie sur une expérience : c'est la clé d'une candidature convaincante.</p>`
  }
};
</script>
