<script>
var DAY = {
  num: 13,
  title: "Rédiger un texte argumentatif",
  subtitle: "Bâtir une Erörterung : introduction, thèse, arguments, conclusion.",
  theory: `
<h3>1. Qu'est-ce qu'une Erörterung ?</h3>
<p>La <strong>Erörterung</strong> est le texte argumentatif type de l'école et des examens allemands (comme la dissertation en France). On y prend position sur une question (Streitfrage) en développant des arguments organisés et en concluant. C'est un exercice de rigueur autant que de langue.</p>
<div class="tip">Deux grands modèles : la <strong>lineare Erörterung</strong> (on défend une seule thèse, arguments du plus faible au plus fort) et la <strong>dialektische Erörterung</strong> (pour et contre : Pro / Kontra, puis synthèse). Au B2, on attend surtout la version dialectique.</div>
<h3>2. La structure en trois parties</h3>
<pre class="pseudo">EINLEITUNG (introduction)
  - amener le sujet (actualité, constat, définition)
  - poser la question centrale (Streitfrage)

HAUPTTEIL (développement)
  - Pro-Argumente : arguments favorables (chacun : thèse + justification + exemple)
  - Kontra-Argumente : arguments opposés
  - ordre croissant : le plus fort à la fin

SCHLUSS (conclusion)
  - synthèse des arguments
  - prise de position personnelle claire (eigene Meinung)</pre>
<h3>3. L'argument bien construit : le schéma B-B-B</h3>
<p>Un bon argument se déploie en trois temps :</p>
<pre class="pseudo">Behauptung (thèse)   : Ein Vorteil ist, dass...
Begründung (raison)  : denn / weil...
Beispiel (exemple)   : Zum Beispiel... / Ein gutes Beispiel dafür ist...</pre>
<pre class="pseudo">Ein wichtiger Vorteil des Fahrrads ist, dass es umweltfreundlich ist.
Denn es verursacht keine Abgase und keinen Lärm.
Zum Beispiel könnten Städte mit mehr Radwegen ihre Luftqualität deutlich verbessern.</pre>
<h3>4. Les formules charnières par section</h3>
<pre class="pseudo">Introduire :   In letzter Zeit wird viel über ... diskutiert.
               Die Frage, ob ..., beschäftigt viele Menschen.
Pro :          Ein erstes Argument dafür ist ... / Zunächst spricht dafür, dass ...
Kontra :       Auf der anderen Seite / Gegen ... spricht jedoch, dass ...
Nuancer :      Zwar ..., aber ... / Es ist zwar richtig, dass ..., dennoch ...
Conclure :     Abschließend / Alles in allem / Meiner Meinung nach ...
               Aus diesen Gründen bin ich der Ansicht, dass ...</pre>
<div class="warn">Ne mélange pas Pro et Kontra dans un même paragraphe : traite d'abord tous les arguments d'un camp, puis ceux de l'autre. La clarté de la structure compte autant que la qualité des idées.</div>
<h3>5. Modèle complet miniature</h3>
<pre class="pseudo">In vielen Städten wird über ein Verbot von Autos in den Zentren diskutiert.
Die Frage ist: Sollten Innenstädte autofrei werden?
Dafür spricht, dass die Luft sauberer würde. Denn weniger Autos bedeuten weniger
Abgase. In Kopenhagen etwa hat sich die Luftqualität deutlich verbessert.
Dagegen spricht jedoch, dass ältere und kranke Menschen auf das Auto angewiesen sind.
Zwar ist der Umweltschutz wichtig, dennoch darf man diese Gruppen nicht vergessen.
Alles in allem bin ich der Ansicht, dass autofreie Zentren mit gutem Nahverkehr
die beste Lösung sind.</pre>
<div class="tip">Apprends ce squelette par coeur : introduction (sujet + question) → Pro → Kontra → nuance → conclusion personnelle. Il te permet de rédiger n'importe quelle Erörterung sous pression.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une Erörterung ?", opts: ["un poème", "un texte argumentatif structuré (type dissertation)", "une lettre amicale", "un résumé"], a: 1, exp: "C'est le texte argumentatif type des examens allemands." },
    { type: "qcm", q: "Une dialektische Erörterung présente…", opts: ["une seule thèse", "les arguments pour (Pro) et contre (Kontra), puis une synthèse", "seulement des exemples", "un récit"], a: 1, exp: "Le modèle dialectique oppose Pro et Kontra avant de conclure." },
    { type: "qcm", q: "Quelles sont les trois grandes parties dans l'ordre ?", opts: ["Schluss, Hauptteil, Einleitung", "Einleitung, Hauptteil, Schluss", "Hauptteil, Einleitung, Schluss", "Einleitung, Schluss, Hauptteil"], a: 1, exp: "Introduction (Einleitung) → développement (Hauptteil) → conclusion (Schluss)." },
    { type: "input", q: "Dans l'introduction, on pose la question centrale, appelée en allemand la « ___ » (question controversée).", a: ["Streitfrage"], ph: "nom", exp: "die Streitfrage = la question centrale/controversée de l'Erörterung." },
    { type: "qcm", q: "Le schéma B-B-B d'un argument, c'est…", opts: ["Beispiel, Behauptung, Begründung", "Behauptung (thèse), Begründung (raison), Beispiel (exemple)", "Begründung, Beispiel, Behauptung", "trois exemples"], a: 1, exp: "thèse → justification → exemple : un argument complet." },
    { type: "input", q: "Complète l'introduction : « In letzter Zeit wird viel über ... ___. » (verbe : discuter, au passif)", a: ["diskutiert"], ph: "verbe", exp: "wird viel über ... diskutiert = on discute beaucoup de..." },
    { type: "qcm", q: "Dans quel ordre placer les arguments d'un même camp ?", opts: ["du plus fort au plus faible", "du plus faible au plus fort (le meilleur à la fin)", "au hasard", "par ordre alphabétique"], a: 1, exp: "On garde l'argument le plus fort pour la fin, où il marque le plus." },
    { type: "input", q: "Complète la charnière Pro : « Ein erstes Argument ___ ist... » (préposition : en faveur de)", a: ["dafür","dafuer"], ph: "mot", exp: "dafür = en faveur de cela ; dagegen = contre." },
    { type: "qcm", q: "Quelle formule introduit un argument CONTRE ?", opts: ["Dafür spricht, dass...", "Dagegen spricht jedoch, dass...", "Zum Beispiel...", "Abschließend..."], a: 1, exp: "Dagegen spricht (jedoch), dass... introduit le camp opposé." },
    { type: "vf", q: "Il vaut mieux traiter tous les arguments Pro d'abord, puis tous les Kontra, plutôt que de les mélanger.", a: true, exp: "La séparation claire des deux camps rend le texte lisible et structuré." },
    { type: "qcm", q: "« Zwar ..., dennoch ... » sert à…", opts: ["donner un exemple", "nuancer / concéder un point tout en maintenant sa position", "conclure", "introduire le sujet"], a: 1, exp: "zwar ... dennoch = certes ... néanmoins : une concession nuancée." },
    { type: "input", q: "Complète la conclusion : « Alles in allem bin ich der ___, dass... » (nom : avis/opinion)", a: ["Ansicht","Meinung"], ph: "nom", exp: "der Ansicht/Meinung sein, dass... = être d'avis que..." },
    { type: "qcm", q: "Où doit apparaître clairement la prise de position personnelle ?", opts: ["dans l'introduction seulement", "dans la conclusion (Schluss)", "dans chaque phrase", "nulle part"], a: 1, exp: "La conclusion synthétise et affirme l'opinion personnelle." },
    { type: "vf", q: "Dans une Erörterung, un argument gagne à être accompagné d'un exemple concret.", a: true, exp: "Behauptung + Begründung + Beispiel : l'exemple ancre l'argument." },
    { type: "input", q: "Complète : « Aus diesen ___ bin ich der Ansicht, dass... » (nom : raisons, au datif pluriel)", a: ["Gründen","Gruenden"], ph: "nom", exp: "Aus diesen Gründen = pour ces raisons (Grund → Gründen au datif pluriel)." }
  ],
  final: {
    title: "Exercice final — Analyse d'une Erörterung",
    intro: `<p>Voici une Erörterung sur les uniformes scolaires. Repère sa structure.</p>
<pre class="pseudo">In vielen Ländern tragen Schüler eine Schuluniform. In Deutschland wird nun ebenfalls
darüber diskutiert, ob Uniformen sinnvoll wären.
Dafür spricht zunächst, dass Uniformen soziale Unterschiede verringern. Denn wenn alle
das Gleiche tragen, spielt teure Markenkleidung keine Rolle mehr. In britischen Schulen
etwa berichten Lehrer von weniger Mobbing.
Ein weiteres Argument ist, dass Uniformen ein Gemeinschaftsgefühl schaffen.
Dagegen spricht jedoch, dass Uniformen die Individualität einschränken. Gerade
Jugendliche möchten ihre Persönlichkeit über Kleidung ausdrücken.
Zwar ist der Wunsch nach Gleichheit verständlich, dennoch sollte man die Freiheit
der Schüler respektieren.
Alles in allem bin ich der Ansicht, dass eine lockere Kleiderordnung besser wäre
als eine strenge Uniformpflicht.</pre>
<p>(verringern = réduire · das Mobbing = le harcèlement · einschränken = limiter)</p>`,
    questions: [
      { type: "qcm", q: "Comment fonctionne l'introduction de ce texte ?", opts: ["elle donne déjà la conclusion", "elle amène le sujet (uniformes ailleurs) puis pose la question (sinnvoll?)", "elle liste les arguments", "elle raconte une histoire"], a: 1, exp: "L'Einleitung amène le thème puis formule la Streitfrage." },
      { type: "input", q: "Relève la charnière qui introduit le premier argument favorable : « ___ spricht zunächst, dass... »", a: ["Dafür","dafür","Dafuer","dafuer"], ph: "mot", exp: "Dafür spricht = argument en faveur (Pro)." },
      { type: "qcm", q: "Quel est l'exemple (Beispiel) donné pour l'argument sur les différences sociales ?", opts: ["les écoles allemandes", "les enseignants britanniques rapportant moins de harcèlement", "les vêtements de marque", "aucun"], a: 1, exp: "In britischen Schulen ... weniger Mobbing : c'est l'exemple concret." },
      { type: "qcm", q: "« Dagegen spricht jedoch, dass Uniformen die Individualität einschränken » ouvre quelle partie ?", opts: ["l'introduction", "les arguments Kontra (contre)", "la conclusion", "un exemple"], a: 1, exp: "Dagegen spricht = passage aux arguments opposés." },
      { type: "vf", q: "La dernière phrase exprime une prise de position personnelle claire, typique de la conclusion.", a: true, exp: "« Alles in allem bin ich der Ansicht, dass... » affirme l'opinion de l'auteur." }
    ],
    solution: `<p>Le texte suit exactement la structure dialectique. <strong>Einleitung</strong> : constat (uniformes ailleurs) + Streitfrage (sont-ils sensés ?). <strong>Hauptteil</strong> : deux arguments Pro (réduction des différences sociales, avec exemple britannique ; sentiment communautaire) puis un argument Kontra (atteinte à l'individualité), nuancé par <em>zwar ... dennoch</em>. <strong>Schluss</strong> : synthèse et opinion personnelle (une tenue souple plutôt qu'une obligation stricte).</p>
<p>Repère les charnières : <strong>Dafür spricht</strong> (Pro), <strong>Ein weiteres Argument</strong> (ajout), <strong>Dagegen spricht jedoch</strong> (Kontra), <strong>Zwar ... dennoch</strong> (nuance), <strong>Alles in allem bin ich der Ansicht</strong> (conclusion). C'est le squelette à reproduire.</p>`
  }
};
</script>

    solution: "In vielen Schulen wird darüber gestritten, ob Handys im Unterricht verboten werden sollten. Die Frage beschäftigt Lehrer, Eltern und Schüler gleichermaßen.\nDafür spricht zunächst, dass Handys stark vom Lernen ablenken. Denn viele Schüler schauen heimlich auf soziale Medien, statt zuzuhören. Zum Beispiel zeigen Studien, dass die Konzentration ohne Handy deutlich steigt.\nEin weiteres Argument ist, dass ein Verbot das Mobbing über Chats während der Schulzeit reduziert.\nDagegen spricht jedoch, dass Handys auch nützliche Lernwerkzeuge sein können. Man kann damit recherchieren oder Vokabeln üben. Außerdem sind Schüler im Notfall schneller erreichbar.\nZwar sind diese Vorteile real, dennoch überwiegen im Unterricht die Nachteile.\nAlles in allem bin ich der Ansicht, dass Handys während des Unterrichts verboten, in den Pausen aber erlaubt sein sollten. So verbindet man Konzentration und Freiheit.\n\n(Traduction : Dans beaucoup d'écoles, on débat de savoir si les portables devraient être interdits en cours. La question préoccupe autant les enseignants que les parents et les élèves. En faveur, d'abord, le fait que les portables distraient fortement de l'apprentissage. Car beaucoup d'élèves regardent en cachette les réseaux sociaux au lieu d'écouter. Par exemple, des études montrent que la concentration augmente nettement sans portable. Un autre argument est qu'une interdiction réduit le harcèlement par chat pendant le temps scolaire. Contre, cependant, le fait que les portables peuvent aussi être des outils utiles. On peut faire des recherches ou réviser du vocabulaire. De plus, les élèves sont plus rapidement joignables en cas d'urgence. Certes ces avantages sont réels, néanmoins en cours les inconvénients l'emportent. Tout compte fait, je suis d'avis que les portables devraient être interdits pendant les cours, mais autorisés pendant les pauses. Ainsi on concilie concentration et liberté.)",
