<script>
var DAY = {
  num: 29,
  title: "Projet final (3) : l'entretien d'embauche complet",
  subtitle: "Réussir un Vorstellungsgespräch en allemand : questions, réponses et méthode STAR.",
  theory: `
<h3>Le projet : maîtriser l'entretien d'embauche</h3>
<p>Troisième projet final : l'<strong>entretien d'embauche</strong> (das Vorstellungsgespräch). Tu vas apprendre à te présenter, répondre aux questions classiques, valoriser tes points forts et poser tes propres questions — le tout en allemand B2. C'est l'aboutissement du jour 16 (parcours) et du jour 25 (convaincre).</p>
<h3>1. Les phases d'un entretien</h3>
<pre class="pseudo">1. Small talk / Begrüßung   accueil, salutations
2. Selbstvorstellung        présentation de soi
3. Fragen zur Person und Erfahrung   questions sur le profil
4. Fragen zur Motivation    motivation pour le poste
5. Eigene Fragen des Bewerbers   questions du candidat
6. Abschluss                clôture</pre>
<h3>2. La méthode STAR pour raconter une expérience</h3>
<p>Quand on te demande un exemple concret (« Erzählen Sie von einer Herausforderung »), structure ta réponse avec la méthode <strong>STAR</strong> :</p>
<pre class="pseudo">S — Situation   Décris le contexte.       „Die Situation war ...“
T — Task        Quelle était ta tâche ?   „Meine Aufgabe war es, ...“
A — Aktion      Qu'as-tu fait ?           „Deshalb habe ich ...“
R — Resultat    Quel résultat ?           „Das Ergebnis war ...“</pre>
<div class="tip">La méthode STAR évite les réponses vagues. Au lieu de « Je travaille bien en équipe », raconte une situation précise, ta tâche, ton action et le résultat mesurable. C'est bien plus convaincant.</p></div>
<h3>3. Les questions classiques du recruteur</h3>
<pre class="pseudo">Erzählen Sie etwas über sich.       Parlez-moi de vous.
Warum haben Sie sich beworben?      Pourquoi avez-vous postulé ?
Was sind Ihre Stärken und Schwächen?  Vos forces et faiblesses ?
Wo sehen Sie sich in fünf Jahren?   Où vous voyez-vous dans 5 ans ?
Warum sollten wir Sie einstellen?   Pourquoi vous embaucher ?
Wie gehen Sie mit Stress um?        Comment gérez-vous le stress ?
Was wissen Sie über unser Unternehmen?  Que savez-vous de l'entreprise ?</pre>
<h3>4. De bonnes réponses (Formulierungshilfen)</h3>
<pre class="pseudo">Zu meinen Stärken zählt ...          Parmi mes points forts, il y a ...
Ich bringe Erfahrung in ... mit.     J'apporte de l'expérience en ...
An dieser Stelle reizt mich ...      Ce qui m'attire dans ce poste, c'est ...
Ich arbeite strukturiert und zuverlässig.  Je travaille de façon structurée et fiable.
Als Schwäche würde ich nennen, dass ..., aber ich arbeite daran.
   Comme faiblesse, je citerais que ..., mais j'y travaille.</pre>
<div class="warn">Pour la question sur les <strong>faiblesses</strong>, ne dis jamais « Ich habe keine Schwächen ». Cite une vraie faiblesse mineure et montre comment tu la corriges (« ..., aber daran arbeite ich »). C'est la réponse attendue.</p></div>
<h3>5. Les questions à poser au recruteur</h3>
<pre class="pseudo">Wie sieht ein typischer Arbeitstag aus?   Une journée type ?
Wie ist das Team organisiert?             Comment l'équipe est-elle organisée ?
Welche Entwicklungsmöglichkeiten gibt es?  Quelles perspectives d'évolution ?
Was sind die nächsten Schritte im Bewerbungsprozess?  Prochaines étapes ?</pre>
<h3>6. Un entretien modèle</h3>
<pre class="pseudo">Recruteur: Schön, dass Sie da sind. Erzählen Sie doch etwas über sich.
Candidat:  Gern. Mein Name ist Léa Dubois. Ich habe in Lyon
           Betriebswirtschaft studiert und arbeite seit drei Jahren
           im Marketing. Besonders reizt mich an dieser Stelle die
           internationale Ausrichtung Ihres Unternehmens.
Recruteur: Was würden Sie als Ihre größte Stärke bezeichnen?
Candidat:  Zu meinen Stärken zählt meine Organisationsfähigkeit.
           Zum Beispiel habe ich in meinem letzten Projekt — die
           Situation war eine sehr knappe Frist — die Aufgabe
           übernommen, ein Team von fünf Personen zu koordinieren.
           Ich habe klare Zwischenziele gesetzt, und das Ergebnis
           war, dass wir zwei Tage früher fertig wurden.
Recruteur: Und Ihre Schwächen?
Candidat:  Früher fiel es mir schwer, Aufgaben abzugeben. Inzwischen
           habe ich gelernt, mehr zu delegieren, und arbeite bewusst
           daran.
Recruteur: Haben Sie noch Fragen an uns?
Candidat:  Ja, gern. Wie sieht ein typischer Arbeitstag in diesem
           Team aus? Und welche Entwicklungsmöglichkeiten bieten Sie?
Recruteur: Sehr gute Fragen. Ich erkläre es Ihnen gern.</pre>
<p>(die Ausrichtung = l'orientation · die Frist = le délai · das Zwischenziel = l'objectif intermédiaire · abgeben/delegieren = déléguer · bewusst = consciemment)</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « entretien d'embauche » en allemand ?", opts: ["die Bewerbung", "das Vorstellungsgespräch", "der Lebenslauf", "die Kündigung"], a: 1, exp: "das Vorstellungsgespräch = l'entretien d'embauche." },
    { type: "qcm", q: "Que structure la méthode STAR ?", opts: ["la lettre de motivation", "le récit d'une expérience concrète (Situation, Task, Aktion, Resultat)", "le salaire", "l'organigramme"], a: 1, exp: "STAR = Situation, Aufgabe, Aktion, Resultat." },
    { type: "input", q: "Dans STAR, le « T » (Task) se dit : « Meine ___ war es, ... » (tâche)", a: ["Aufgabe"], ph: "un nom", exp: "die Aufgabe = la tâche : « Meine Aufgabe war es, ... »." },
    { type: "qcm", q: "« Warum haben Sie sich beworben? » signifie…", opts: ["Quel est votre salaire ?", "Pourquoi avez-vous postulé ?", "Quand pouvez-vous commencer ?", "Où habitez-vous ?"], a: 1, exp: "sich bewerben = postuler ; question sur la motivation." },
    { type: "qcm", q: "Que faut-il ÉVITER pour la question sur les faiblesses ?", opts: ["citer une faiblesse et dire qu'on y travaille", "répondre « Ich habe keine Schwächen »", "donner un exemple concret", "rester honnête"], a: 1, exp: "« Je n'ai aucune faiblesse » sonne faux ; cite-en une mineure + solution." },
    { type: "input", q: "Complète : « Zu meinen Stärken ___ meine Organisationsfähigkeit. » (compter/figurer)", a: ["zählt", "gehört"], ph: "verbe", exp: "Zu meinen Stärken zählt/gehört ... = parmi mes points forts figure ..." },
    { type: "qcm", q: "« An dieser Stelle reizt mich ... » exprime…", opts: ["ce qui m'ennuie dans ce poste", "ce qui m'attire dans ce poste", "mon ancien salaire", "une plainte"], a: 1, exp: "reizen = attirer, séduire ; motivation pour le poste." },
    { type: "qcm", q: "« Wo sehen Sie sich in fünf Jahren? » interroge sur…", opts: ["votre adresse", "vos projets/ambitions à moyen terme", "vos vacances", "votre famille"], a: 1, exp: "Question classique sur les perspectives à cinq ans." },
    { type: "vf", q: "Poser soi-même des questions au recruteur montre de l'intérêt et est recommandé.", a: true, exp: "« Haben Sie noch Fragen? » : préparer 2-3 questions est attendu." },
    { type: "qcm", q: "Dans l'entretien modèle, quel résultat (R de STAR) la candidate cite-t-elle ?", opts: ["le projet a échoué", "l'équipe a fini deux jours plus tôt que prévu", "elle a été licenciée", "rien de mesurable"], a: 1, exp: "« das Ergebnis war, dass wir zwei Tage früher fertig wurden »." },
    { type: "qcm", q: "Quelle faiblesse la candidate avoue-t-elle (et corrige) ?", opts: ["elle arrive en retard", "elle avait du mal à déléguer, mais y travaille", "elle ne parle pas allemand", "elle déteste le travail d'équipe"], a: 1, exp: "« fiel es mir schwer, Aufgaben abzugeben ... arbeite bewusst daran »." },
    { type: "input", q: "Complète une bonne question du candidat : « Welche ___ bieten Sie? » (perspectives d'évolution)", a: ["Entwicklungsmöglichkeiten"], ph: "un nom composé", exp: "die Entwicklungsmöglichkeiten = les possibilités d'évolution." },
    { type: "qcm", q: "« Ich arbeite strukturiert und zuverlässig » met en avant…", opts: ["un défaut", "des qualités professionnelles (méthode, fiabilité)", "un loisir", "un diplôme"], a: 1, exp: "strukturiert = structuré ; zuverlässig = fiable." },
    { type: "qcm", q: "Pourquoi la méthode STAR est-elle plus convaincante qu'une phrase générale ?", opts: ["elle est plus courte", "elle donne un exemple concret et un résultat mesurable", "elle évite de parler de soi", "elle flatte le recruteur"], a: 1, exp: "Le concret + le résultat mesurable rendent la compétence crédible." },
    { type: "input", q: "Complète l'accueil : « Schön, dass Sie da ___. » (être — 2e pers. pluriel/vouvoiement)", a: ["sind"], ph: "verbe", exp: "« Schön, dass Sie da sind » = ravi que vous soyez là." }
  ],
  final: {
    title: "Exercice final — Ein Gesprächsausschnitt analysieren",
    intro: `<p>Lis cet extrait d'entretien et évalue la réponse du candidat.</p>
<pre class="pseudo">Recruteur: Warum sollten wir gerade Sie einstellen?
Candidat:  Ich glaube, dass ich gut zu dieser Stelle passe. Ich bringe
   fünf Jahre Erfahrung im Kundenservice mit und spreche drei Sprachen.
   In meiner letzten Position — die Situation war ein starker Anstieg
   von Beschwerden — bekam ich die Aufgabe, den Kundendienst neu zu
   organisieren. Ich führte ein neues Ticketsystem ein und schulte das
   Team. Das Ergebnis war, dass sich die Bearbeitungszeit halbierte und
   die Kundenzufriedenheit deutlich stieg. Diese Erfahrung würde ich
   gern bei Ihnen einbringen.</pre>
<p>(die Beschwerde = la réclamation · einführen = introduire · schulen = former · die Bearbeitungszeit = le temps de traitement · die Zufriedenheit = la satisfaction · einbringen = apporter)</p>`,
    questions: [
      { type: "vf", q: "Le candidat utilise clairement la méthode STAR (situation, tâche, action, résultat).", a: true, exp: "Situation (hausse de réclamations), Aufgabe (réorganiser), Aktion (ticketing + formation), Resultat (temps divisé par deux)." },
      { type: "qcm", q: "Quelle était la SITUATION décrite ?", opts: ["un manque de personnel", "une forte hausse des réclamations clients", "un déménagement", "une baisse des ventes"], a: 1, exp: "« ein starker Anstieg von Beschwerden »." },
      { type: "qcm", q: "Quelle ACTION concrète le candidat a-t-il menée ?", opts: ["il a démissionné", "il a introduit un système de tickets et formé l'équipe", "il a embauché dix personnes", "il n'a rien changé"], a: 1, exp: "« führte ein neues Ticketsystem ein und schulte das Team »." },
      { type: "qcm", q: "Quel RÉSULTAT mesurable est donné ?", opts: ["aucun", "le temps de traitement a été divisé par deux et la satisfaction a augmenté", "le budget a doublé", "l'équipe a été dissoute"], a: 1, exp: "« die Bearbeitungszeit halbierte sich und die Kundenzufriedenheit stieg »." },
      { type: "input", q: "Cite un argument de valorisation utilisé au début de la réponse. (ex : nombre de langues)", a: ["drei Sprachen", "fünf Jahre Erfahrung", "Erfahrung im Kundenservice", "drei", "fünf Jahre"], ph: "un atout", exp: "« fünf Jahre Erfahrung ... spreche drei Sprachen » : des atouts concrets." }
    ],
    solution: `<p>La réponse est <strong>excellente</strong> car elle applique parfaitement la méthode <strong>STAR</strong> : <em>Situation</em> (forte hausse des réclamations) → <em>Aufgabe</em> (réorganiser le service client) → <em>Aktion</em> (système de tickets + formation de l'équipe) → <em>Resultat</em> (temps de traitement divisé par deux, satisfaction en hausse). Le candidat commence par des <strong>atouts concrets</strong> (5 ans d'expérience, trois langues) et termine en projetant cette expérience sur le poste visé (« würde ich gern bei Ihnen einbringen »).</p>
<p>Retiens la recette d'une bonne réponse d'entretien : atouts chiffrés + un exemple STAR avec résultat mesurable + lien explicite avec le poste. C'est exactement ce que tu vas t'entraîner à écrire.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en allemand…",
  items: [
  { id: "de-b2-j29", title: "Prépare tes propres réponses d'entretien", level: 3,
    statement: "Rédige TES réponses personnelles (10 à 14 phrases au total) à quatre questions d'entretien : (1) Erzählen Sie etwas über sich. (2) Was sind Ihre Stärken? (avec un exemple STAR) (3) Was ist eine Schwäche von Ihnen? (4) Warum sollten wir Sie einstellen? Puis note une question à poser au recruteur.",
    hints: [
      "Présentation : formation + expérience + ce qui t'attire dans le poste (« An dieser Stelle reizt mich ... »).",
      "Pour la force, déroule un vrai exemple STAR : Situation → Aufgabe → Aktion → Resultat.",
      "Pour la faiblesse : une vraie faiblesse mineure + « ..., aber daran arbeite ich ». Termine par ta question au recruteur."
    ],
    solution: "1. Über mich: Mein Name ist Paul Girard. Ich habe Informatik studiert und arbeite seit vier Jahren als Softwareentwickler. An dieser Stelle reizt mich besonders, dass Ihr Unternehmen an nachhaltigen Technologien arbeitet.\n2. Meine Stärke: Zu meinen Stärken zählt mein Problemlösungsdenken. Die Situation in meinem letzten Projekt war ein kritischer Serverausfall kurz vor einem wichtigen Launch. Meine Aufgabe war es, den Fehler schnell zu finden. Deshalb analysierte ich systematisch die Logs und arbeitete eng mit dem Team zusammen. Das Ergebnis war, dass wir das System in zwei Stunden wiederherstellten und der Launch pünktlich stattfand.\n3. Meine Schwäche: Früher habe ich dazu geneigt, zu viele Details selbst kontrollieren zu wollen. Inzwischen vertraue ich meinem Team mehr und delegiere bewusster, aber daran arbeite ich weiter.\n4. Warum ich? Ich bringe technische Erfahrung, Teamgeist und eine strukturierte Arbeitsweise mit. Ich bin überzeugt, dass ich Ihr Team schnell unterstützen kann.\nMeine Frage an Sie: Wie sieht die Zusammenarbeit zwischen den Teams in Ihrem Unternehmen aus?\n\n(Traduction : 1. À propos de moi : Je m'appelle Paul Girard. J'ai étudié l'informatique et je travaille depuis quatre ans comme développeur logiciel. Ce qui m'attire particulièrement dans ce poste, c'est que votre entreprise travaille sur des technologies durables. 2. Ma force : Parmi mes points forts figure mon esprit de résolution de problèmes. La situation, dans mon dernier projet, était une panne serveur critique juste avant un lancement important. Ma tâche était de trouver rapidement l'erreur. J'ai donc analysé les logs de façon systématique et travaillé étroitement avec l'équipe. Le résultat : nous avons rétabli le système en deux heures et le lancement a eu lieu à l'heure. 3. Ma faiblesse : Avant, j'avais tendance à vouloir contrôler moi-même trop de détails. Maintenant je fais davantage confiance à mon équipe et je délègue plus consciemment, mais j'y travaille encore. 4. Pourquoi moi ? J'apporte de l'expérience technique, l'esprit d'équipe et une méthode de travail structurée. Je suis convaincu de pouvoir soutenir rapidement votre équipe. Ma question : Comment se passe la collaboration entre les équipes dans votre entreprise ?)",
    note: "Personnalise vraiment ces réponses avec ton propre parcours : un entretien réussi sonne authentique. Vérifie la structure STAR pour la force (chaque étape présente) et n'oublie jamais de préparer au moins une question à poser — cela fait la différence." }
  ]
};
</script>
