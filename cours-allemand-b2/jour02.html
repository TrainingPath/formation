<script>
var DAY = {
  num: 2,
  title: "Le Konjunktiv II du passé (hätte, wäre)",
  subtitle: "Exprimer l'irréel du passé : ce qui aurait pu être et n'a pas été.",
  theory: `
<h3>1. Rappel : le Konjunktiv II du présent</h3>
<p>Le Konjunktiv II sert à exprimer l'irréel, l'hypothèse et la politesse. Au présent, on le forme surtout avec <strong>würde + infinitif</strong>, sauf pour quelques verbes fréquents qui ont une forme propre :</p>
<pre class="pseudo">sein  → wäre        haben → hätte       werden → würde
können → könnte     müssen → müsste     wollen → wollte (rare)
Ich würde gern nach Rom fahren.   J'irais volontiers à Rome.
Wenn ich Zeit hätte, käme ich.    Si j'avais le temps, je viendrais.</pre>
<h3>2. Former le Konjunktiv II du passé</h3>
<p>Pour parler d'un <strong>irréel du passé</strong> (ce qui aurait pu arriver mais n'est pas arrivé), on combine :</p>
<pre class="pseudo">hätte / wäre  +  participe passé  (à la fin de la phrase)</pre>
<p>Le choix hätte / wäre suit exactement la règle haben / sein du Perfekt :</p>
<pre class="pseudo">Ich hätte das gemacht.        Je l'aurais fait.
Ich wäre gekommen.            Je serais venu.
Wir hätten mehr gelernt.      Nous aurions appris davantage.
Sie wäre fast gefallen.       Elle serait presque tombée.</pre>
<div class="tip">Règle mnémotechnique : <strong>hätte + participe</strong> = « j'aurais fait », <strong>wäre + participe</strong> = « je serais venu ». C'est le pendant irréel du Perfekt.</div>
<h3>3. La phrase hypothétique irréelle du passé</h3>
<p>Structure typique : une subordonnée en <em>wenn</em> (si) + une principale, les deux au Konjunktiv II du passé.</p>
<pre class="pseudo">Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.
Si j'avais appris davantage, j'aurais réussi l'examen.

Wenn du früher gekommen wärst, hättest du ihn noch getroffen.
Si tu étais venu plus tôt, tu l'aurais encore rencontré.</pre>
<div class="warn">Dans la subordonnée en <em>wenn</em>, hätte/wäre part <strong>à la toute fin</strong> : « Wenn ich Zeit gehabt hätte, ... ». Dans la principale placée après la virgule, hätte/wäre vient en <strong>tête</strong> (position du verbe conjugué après une subordonnée initiale).</p></div>
<h3>4. Le regret et le reproche</h3>
<p>Le Konjunktiv II du passé sert à exprimer le <strong>regret</strong> (avec <em>fast/beinahe</em> = presque) et le <strong>reproche</strong> :</p>
<pre class="pseudo">Ich hätte das nicht sagen sollen.     Je n'aurais pas dû dire ça.
Beinahe wäre ich zu spät gekommen.    J'ai failli arriver en retard.
Du hättest mich anrufen können!       Tu aurais pu m'appeler !</pre>
<p>Avec un verbe de modalité (sollen, können, müssen), on obtient une structure à <strong>double infinitif</strong> que nous verrons en détail au jour 8 : « hätte ... sagen sollen ».</p>
<h3>5. La politesse au passé</h3>
<p>On peut adoucir une remarque en la formulant au passé irréel : « Ich hätte eine Frage gehabt. » (J'aurais eu une question — plus poli et distancé que « Ich habe eine Frage »).</p>
<div class="tip">Au B2, le Konjunktiv II du passé est un marqueur de maîtrise : il permet de nuancer, de regretter, de reprocher et de rester poli. Entraîne-toi à l'employer spontanément.</div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on le Konjunktiv II du passé ?", opts: ["würde + infinitif", "hätte/wäre + participe passé", "hatte/war + infinitif", "werden + participe"], a: 1, exp: "hätte ou wäre + participe passé, à la fin de la phrase." },
    { type: "qcm", q: "« Je serais venu » se dit…", opts: ["Ich hätte gekommen", "Ich wäre gekommen", "Ich würde kommen", "Ich war gekommen"], a: 1, exp: "kommen = déplacement → wäre : Ich wäre gekommen." },
    { type: "input", q: "Complète : « Ich ___ das gemacht. » (j'aurais fait ; auxiliaire du Konjunktiv II passé)", a: ["hätte","haette"], ph: "auxiliaire", exp: "machen + haben → hätte gemacht." },
    { type: "input", q: "Complète : « Sie ___ fast gefallen. » (elle serait presque tombée)", a: ["wäre","waere"], ph: "auxiliaire", exp: "fallen = changement d'état → wäre gefallen." },
    { type: "qcm", q: "Dans « Wenn ich Zeit gehabt hätte, ... », où se place « hätte » ?", opts: ["en tête de la subordonnée", "en 2e position", "à la toute fin de la subordonnée", "n'importe où"], a: 2, exp: "Dans une subordonnée en wenn, le verbe conjugué (hätte) va à la fin." },
    { type: "input", q: "Complète la principale : « Wenn du früher gekommen wärst, ___ du ihn getroffen. » (auxiliaire en tête)", a: ["hättest","haettest"], ph: "auxiliaire", exp: "treffen + haben ; 2e personne du singulier : hättest." },
    { type: "vf", q: "Le choix entre hätte et wäre suit la même règle que haben/sein au Perfekt.", a: true, exp: "Verbes de déplacement/changement d'état → wäre, sinon hätte." },
    { type: "qcm", q: "« Ich hätte das nicht sagen sollen » exprime…", opts: ["un projet futur", "un regret / reproche envers soi-même", "une certitude", "une question polie"], a: 1, exp: "hätte ... sollen = « je n'aurais pas dû », un regret." },
    { type: "input", q: "Exprime le regret : « Du ___ mich anrufen können! » (tu aurais pu ; 2e pers. sing.)", a: ["hättest","haettest"], ph: "auxiliaire", exp: "Reproche : Du hättest mich anrufen können !" },
    { type: "qcm", q: "Que signifie « Beinahe wäre ich zu spät gekommen » ?", opts: ["Je suis arrivé en retard", "J'ai failli arriver en retard (mais non)", "Je viendrai en retard", "Je ne viendrai pas"], a: 1, exp: "beinahe/fast + Konjunktiv II passé = « j'ai failli » : l'événement ne s'est finalement pas produit." },
    { type: "vf", q: "« Ich hätte eine Frage gehabt » est une formulation plus polie et distancée que « Ich habe eine Frage ».", a: true, exp: "Le passé irréel adoucit et distancie la demande." },
    { type: "input", q: "Complète : « Wenn ich mehr gelernt ___, hätte ich bestanden. » (subordonnée, verbe à la fin)", a: ["hätte","haette"], ph: "auxiliaire", exp: "lernen + haben → gelernt hätte (à la fin de la subordonnée)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich wäre das gemacht.", "Ich hätte das gemacht.", "Ich würde das gemacht.", "Ich war das gemacht."], a: 1, exp: "machen → haben → hätte gemacht." },
    { type: "qcm", q: "« Wir ___ mehr gelernt » — quel auxiliaire pour « nous aurions appris » ?", opts: ["wären", "hätten", "würden", "waren"], a: 1, exp: "lernen + haben, 1re pers. pluriel → hätten." },
    { type: "input", q: "Traduis l'auxiliaire de « Nous serions restés » : « Wir ___ geblieben. »", a: ["wären","waeren"], ph: "auxiliaire", exp: "bleiben se conjugue avec sein → wären geblieben." }
  ],
  final: {
    title: "Exercice final — Die verpasste Gelegenheit",
    intro: `<p>Un homme repense à une occasion manquée. Lis, puis réponds.</p>
<pre class="pseudo">Heute denke ich oft an jenen Sommer zurück. Wenn ich damals mutiger gewesen wäre,
hätte ich das Stellenangebot in Hamburg angenommen. Ich hätte eine neue Sprache gelernt
und viele interessante Menschen kennengelernt. Beinahe hätte ich schon zugesagt,
aber im letzten Moment bekam ich Angst. Meine Freunde sagten damals: Du hättest es
wenigstens versuchen sollen! Heute weiß ich, dass sie recht hatten. Wäre ich gegangen,
wäre mein Leben vielleicht ganz anders verlaufen. Trotzdem bereue ich nicht alles:
ohne diese Entscheidung hätte ich meine Frau nie getroffen.</pre>
<p>(das Stellenangebot = l'offre d'emploi · zusagen = accepter · bereuen = regretter)</p>`,
    questions: [
      { type: "input", q: "Complète d'après le texte : « Wenn ich mutiger gewesen ___, hätte ich das Angebot angenommen. »", a: ["wäre","waere"], ph: "auxiliaire", exp: "sein → wäre ; gewesen wäre à la fin de la subordonnée." },
      { type: "qcm", q: "« Du hättest es versuchen sollen! » exprime…", opts: ["un ordre poli", "un reproche : tu aurais dû essayer", "un projet futur", "une certitude"], a: 1, exp: "hättest ... sollen = reproche au passé (double infinitif)." },
      { type: "qcm", q: "Que signifie « Beinahe hätte ich schon zugesagt » ?", opts: ["Il a accepté", "Il a failli accepter mais ne l'a pas fait", "Il acceptera bientôt", "Il refuse toujours"], a: 1, exp: "beinahe + Konjunktiv II passé : l'action n'a finalement pas eu lieu." },
      { type: "input", q: "Relève l'auxiliaire : « ___ ich gegangen, wäre mein Leben anders verlaufen. » (subordonnée sans wenn, verbe en tête)", a: ["wäre","waere"], ph: "auxiliaire", exp: "gehen → wäre ; ici wenn est omis et le verbe passe en tête." },
      { type: "vf", q: "« ohne diese Entscheidung hätte ich meine Frau nie getroffen » signifie que, sans cette décision, il n'aurait jamais rencontré sa femme.", a: true, exp: "Irréel du passé : la conséquence (rencontrer sa femme) n'aurait pas eu lieu sans la décision." }
    ],
    solution: `<p>Le texte accumule les formes du Konjunktiv II passé pour exprimer regret et hypothèse : <strong>gewesen wäre</strong>, <strong>hätte angenommen</strong>, <strong>hätte gelernt</strong>, <strong>hätte versuchen sollen</strong> (reproche à double infinitif), <strong>wäre verlaufen</strong>, <strong>hätte getroffen</strong>.</p>
<p>Remarque la construction sans <em>wenn</em> : « <strong>Wäre ich gegangen</strong>, wäre mein Leben anders verlaufen » — on peut supprimer <em>wenn</em> et mettre le verbe conjugué en tête, comme en français « Serais-je parti, ... ». C'est élégant et typiquement B2.</p>`
  }
};
</script>
