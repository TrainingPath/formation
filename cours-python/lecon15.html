<h3>1. Qu'est-ce qu'un module ?</h3>
<p>Un <strong>module</strong> est un fichier Python contenant des fonctions et des classes réutilisables. Python est livré avec une immense <strong>bibliothèque standard</strong> (« batteries incluses ») : des centaines de modules prêts à l'emploi. Pour utiliser un module, on l'<strong>importe</strong>.</p>

<h3>2. Les façons d'importer</h3>
<pre class="pseudo">import math                  # importe tout le module ; on écrit math.sqrt(...)
math.sqrt(16)                # → 4.0
math.pi                      # → 3.14159...

from math import sqrt, pi    # importe SEULEMENT sqrt et pi ; on écrit sqrt(...) directement
sqrt(16)                     # → 4.0 (sans le préfixe math.)

import math as m             # renomme le module (alias) ; on écrit m.sqrt(...)
m.sqrt(16)</pre>
<div class="tip">Trois styles : <code>import module</code> (tout, avec préfixe), <code>from module import nom</code> (juste ce qu'il faut, sans préfixe), et l'alias <code>import module as x</code>. Les imports se placent tout en haut du fichier.</div>

<h3>3. Les modules incontournables</h3>
<pre class="pseudo">import math                  # racine, arrondis, pi, trigonométrie…
import random                # nombres et choix aléatoires
import datetime              # dates et heures
import os                    # fichiers, dossiers, système d'exploitation
import json                  # lire/écrire du JSON (leçon 17)
import statistics            # moyenne, médiane, écart-type</pre>

<h3>4. random : le hasard</h3>
<pre class="pseudo">import random
random.randint(1, 6)         # un entier de 1 à 6 INCLUS (les deux bornes !) → un dé

random.shuffle(ma_liste)     # mélange la liste sur place</pre>
<div class="warn">Attention à la différence avec les autres langages : <code>random.randint(1, 6)</code> inclut LES DEUX bornes (1 et 6). Pas besoin du « +1 » de Java ! En revanche, <code>range(1, 6)</code> (leçon 6), lui, exclut la borne haute. Deux règles à ne pas confondre.</div>

<h3>5. datetime : les dates</h3>
<pre class="pseudo">from datetime import date, datetime

examen = date(2026, 9, 15)   # une date précise : année, mois, jour
examen.year                  # → 2026
(examen - date.today()).days # nombre de jours entre deux dates</pre>
