  title: "Le constructeur __init__ et l'encapsulation",
  subtitle: "Garantir des objets valides et bien protégés.",
  theory: `
<h3>1. Le constructeur qui valide</h3>
<p>Le rôle du <code>__init__</code> (le constructeur, appelé à la création de l'objet) n'est pas seulement de ranger les paramètres : c'est aussi de <strong>garantir</strong> que l'objet naît dans un état cohérent.</p>
<pre class="pseudo">class Compte:                            # déclare la classe Compte
    def __init__(self, titulaire, solde=0):   # constructeur ; solde vaut 0 par défaut
        self.titulaire = titulaire       # range le titulaire dans un attribut
        self.solde = max(0, solde)      # validation : max(0, solde) empêche un solde négatif

c = Compte("Ana", -100)                 # on tente de créer un compte avec -100
print(c.solde)                          # affiche 0 : le constructeur a corrigé la valeur</pre>

<h3>2. L'encapsulation par convention</h3>
<p>L'<strong>encapsulation</strong> consiste à protéger les données internes d'un objet pour qu'on ne puisse les modifier que par des méthodes contrôlées. Python n'a pas de mot-clé <code>private</code> comme Java. On signale qu'un attribut est « interne » par un <strong>underscore</strong> (un tiret bas) devant son nom.</p>
<pre class="pseudo">class Compte:                            # déclare la classe
    def __init__(self, solde=0):         # constructeur, solde par défaut 0
        self._solde = solde             # _solde : « usage interne, ne pas toucher directement »

    def deposer(self, montant):          # méthode publique pour ajouter de l'argent
        if montant &gt; 0:                  # on n'accepte qu'un montant positif…
            self._solde += montant      # …et on passe par cette MÉTHODE, qui valide</pre>
<div class="warn">Le simple underscore <code>_solde</code> est une <strong>convention</strong> : « privé par politesse ». Python ne l'empêche pas techniquement, mais tout développeur sait qu'il ne doit pas y toucher de l'extérieur. Un double underscore <code>__solde</code> va plus loin (name mangling) et rend l'accès direct vraiment difficile.</div>

<h3>3. Les propriétés : @property</h3>
<p>Un <strong>décorateur</strong> est un mot précédé de <code>@</code>, écrit juste au-dessus d'une méthode pour modifier son comportement. Pour offrir une lecture contrôlée d'un attribut interne, on utilise le décorateur <code>@property</code> : la méthode s'utilise alors comme un attribut (sans parenthèses).</p>
<pre class="pseudo">class Compte:                            # déclare la classe
    def __init__(self, solde=0):         # constructeur
        self._solde = solde             # attribut interne

    @property                           # transforme la méthode suivante en propriété (lecture)
    def solde(self):                    # se lit comme un attribut, mais reste contrôlé
        return self._solde              # renvoie la valeur interne

c = Compte(100)                         # crée un compte de solde 100
print(c.solde)                          # affiche 100 : on lit la propriété SANS parenthèses
# c.solde = 50                         # interdit : aucun setter défini → lecture seule</pre>

<h3>4. Validation dans le setter</h3>
<pre class="pseudo">class Personne:                          # déclare la classe
    def __init__(self, age):             # constructeur recevant un âge
        self._age = age                 # attribut interne _age

    @property                           # propriété de LECTURE de l'âge
    def age(self):                      # méthode getter
        return self._age                # renvoie l'âge interne

    @age.setter                         # associe un setter à la propriété age
    def age(self, valeur):              # appelé quand on écrit p.age = ...
        if valeur &gt;= 0:                 # on n'accepte que les âges positifs ou nuls…
            self._age = valeur          # …sinon on refuse (l'âge reste inchangé)

p = Personne(20)                        # crée une personne de 20 ans
p.age = -5                              # tentative refusée : l'invariant « âge >= 0 » tient
print(p.age)                            # affiche 20 (la valeur invalide a été ignorée)</pre>
<p>Le <code>@property</code> + <code>@age.setter</code> donne la simplicité d'un attribut (<code>p.age</code>) AVEC le contrôle d'une méthode : le meilleur des deux mondes, plus léger que les getX/setX de Java.</p>

<h3>5. __str__ : l'affichage lisible</h3>
<pre class="pseudo">class Compte:                            # déclare la classe
    def __init__(self, titulaire, solde):   # constructeur
        self.titulaire = titulaire       # attribut titulaire
        self.solde = solde              # attribut solde

    def __str__(self):                  # __str__ définit comment l'objet s'affiche en texte
        return f"{self.titulaire} : {self.solde} €"   # renvoie la chaîne à afficher

c = Compte("Ana", 130)                  # crée un compte
print(c)                                # affiche « Ana : 130 € » (print appelle __str__ tout seul)</pre>
<p>Sans <code>__str__</code>, afficher un objet donne quelque chose comme <code>&lt;__main__.Compte object at 0x7f...&gt;</code> : illisible. Le définir rend tes objets présentables.</p>

<h3>6. Attributs de classe vs attributs d'instance</h3>
<pre class="pseudo">class Compte:                            # déclare la classe
    TAUX = 0.02                         # attribut de CLASSE : une valeur partagée par TOUS les comptes
    def __init__(self, solde):           # constructeur
        self.solde = solde             # attribut d'INSTANCE : propre à chaque objet</pre>
<div class="tip">Un attribut défini directement dans la classe (comme <code>TAUX</code>) est partagé par tous les objets — pratique pour une constante commune. Un attribut défini dans <code>__init__</code> avec <code>self.</code> est propre à chaque instance.</div>`,

    { type: "qcm", q: "<code>TAUX = 0.02</code> défini dans la classe (hors __init__) est…", opts: ["Un attribut d'instance", "Un attribut de CLASSE : partagé par TOUS les objets", "Une méthode de la classe", "Une variable locale au fichier"], a: 1, exp: "Idéal pour une constante commune à toutes les instances." },
    { type: "qcm", q: "<code>self.solde = solde</code> dans __init__ crée…", opts: ["Un attribut de classe", "Un attribut d'INSTANCE : propre à chaque objet", "Une variable locale", "Une constante"], a: 1, exp: "self. = attribut de l'exemplaire courant." },

<pre class="pseudo">class Thermostat:                    # déclare la classe
    def __init__(self):              # constructeur sans paramètre externe

    @property                        # propriété de LECTURE
    def temp(self):                  # getter

    def temp(self, valeur):          # appelé quand on écrit t.temp = ...
