<script>
var DAY = {
  num: 18,
  title: "Dictionnaires et ensembles",
  subtitle: "Associer des clés à des valeurs, et gérer l'unicité.",
  theory: `
<h3>1. Le dictionnaire : associer clé → valeur</h3>
<p>Un <strong>dictionnaire</strong> (dict) range des valeurs sous des <strong>clés</strong> de ton choix (au lieu d'indices numériques). Comme un vrai dictionnaire papier : un mot (la clé) mène à sa définition (la valeur). C'est la structure « clé → valeur », équivalente à la HashMap de Java.</p>
<pre class="pseudo">notes = {"Ana": 14, "Bob": 9, "Zoé": 16}   # crée un dict : accolades, paires « clé: valeur »
notes["Ana"]                 # → 14 : accès DIRECT à la valeur, via sa clé "Ana"
notes["Max"] = 12            # ajoute une nouvelle paire (clé "Max" → valeur 12)
notes["Bob"] = 11            # la clé "Bob" existe déjà → on modifie sa valeur
len(notes)                   # → 4 : le nombre de paires dans le dictionnaire
"Zoé" in notes               # → True : l'opérateur « in » teste si la clé existe
del notes["Bob"]             # supprime complètement la paire dont la clé est "Bob"</pre>

<h3>2. L'accès sûr : get</h3>
<pre class="pseudo">notes["Fantôme"]             # → KeyError ! plantage : la clé n'existe pas
notes.get("Fantôme")         # → None : pas d'erreur, get renvoie None si la clé est absente
notes.get("Fantôme", 0)      # → 0 : on fournit une valeur par DÉFAUT en cas de clé absente</pre>
<div class="warn">Accéder à une clé inexistante avec les crochets lève une <code>KeyError</code>. Pour éviter le plantage, utilise <code>notes.get(cle)</code> (renvoie <code>None</code> si absent) ou <code>notes.get(cle, defaut)</code> pour fournir une valeur de repli.</div>

<h3>3. Parcourir un dictionnaire</h3>
<pre class="pseudo">for cle in notes:                    # parcourt les CLÉS du dictionnaire (comportement par défaut)
    print(cle, notes[cle])           # affiche la clé et sa valeur (obtenue par notes[cle])
for cle, valeur in notes.items():    # items() donne les PAIRES (clé, valeur) directement
    print(f"{cle} → {valeur}")       # affiche « clé → valeur »
notes.keys()                         # renvoie les clés ; notes.values() renvoie les valeurs</pre>

<h3>4. Le motif star : compter les occurrences</h3>
<pre class="pseudo">mots = ["chat", "chien", "chat", "oiseau", "chat"]   # une liste avec des répétitions
compteur = {}                        # dict vide : il associera chaque mot → son nombre d'apparitions
for mot in mots:                     # pour chaque mot de la liste…
    compteur[mot] = compteur.get(mot, 0) + 1   # lit le compte actuel (0 si nouveau) et ajoute 1
# compteur vaut maintenant {"chat": 3, "chien": 1, "oiseau": 1}</pre>
<p>Le <code>get(mot, 0)</code> gère élégamment la première apparition d'une clé : c'est le motif compteur (leçon 6), un par clé. Idéal pour des votes, des fréquences, un inventaire.</p>

<h3>5. Dictionnaires de dictionnaires (enregistrements)</h3>
<pre class="pseudo">classe = [                   # une LISTE de dictionnaires (chaque dict = une fiche élève)
    {"nom": "Ana", "note": 14},   # premier élève
    {"nom": "Bob", "note": 9}     # deuxième élève
]
classe[0]["nom"]             # → "Ana" : élément d'indice 0, puis champ "nom" de ce dictionnaire
for eleve in classe:         # parcourt chaque fiche élève de la liste…
    print(eleve["nom"], eleve["note"])   # …et affiche son nom et sa note</pre>
<p>Une liste de dictionnaires est LA structure des données du web : chaque « ligne » (d'une base ou d'une API) arrive sous cette forme. On la retrouvera partout dans Django.</p>

<h3>6. Les ensembles (set) : l'unicité</h3>
<pre class="pseudo">participants = {"Ana", "Bob", "Ana"}   # un set : accolades, mais des valeurs seules (PAS de « clé: valeur »)
print(participants)                    # affiche {"Ana", "Bob"} : les doublons DISPARAISSENT
participants.add("Zoé")                # add() ajoute un élément au set
"Ana" in participants                  # teste la présence (très rapide dans un set)
# Opérations d'ensembles :
a = {1, 2, 3}; b = {2, 3, 4}           # deux ensembles
a &amp; b                                   # → {2, 3} : intersection (les éléments communs)
a | b                                   # → {1, 2, 3, 4} : union (tous les éléments)
liste_sans_doublons = list(set([1, 2, 2, 3]))   # astuce : passer par un set dédoublonne la liste → [1, 2, 3]</pre>
<div class="tip">Un <strong>set</strong> ne garde que des valeurs UNIQUES (les doublons sont éliminés) et teste la présence très vite. Astuce fréquente : <code>list(set(ma_liste))</code> supprime les doublons d'une liste en une ligne.</div>`,
  exercises: [
    { type: "qcm", q: "Un dictionnaire associe…", opts: ["Des indices à des valeurs", "Des CLÉS choisies à des VALEURS", "Des nombres à des positions", "Deux listes entre elles"], a: 1, exp: "{\"Ana\": 14} : la clé « Ana » → la valeur 14." },
    { type: "qcm", q: "Créer un dict nom → âge :", opts: ["[\"Ana\": 20]", "{\"Ana\": 20}", "(\"Ana\", 20)", "{\"Ana\", 20}"], a: 1, exp: "Accolades avec des paires clé: valeur." },
    { type: "input", q: "<code>d = {\"a\": 1, \"b\": 2}</code>. Que vaut <code>d[\"b\"]</code> ?", a: "2", ph: "nombre", exp: "Accès par la clé « b »." },
    { type: "qcm", q: "<code>notes[\"Fantôme\"]</code> sur une clé absente…", opts: ["Retourne None", "Lève une KeyError", "Retourne 0", "Retourne une chaîne vide"], a: 1, exp: "Les crochets exigent que la clé existe." },
    { type: "qcm", q: "L'accès SÛR à une valeur, sans plantage :", opts: ["notes[\"x\"]", "notes.get(\"x\", defaut)", "notes.find", "notes ?? 0"], a: 1, exp: "get renvoie None (ou une valeur par défaut) si la clé est absente." },
    { type: "qcm", q: "<code>\"Zoé\" in notes</code> teste…", opts: ["La valeur", "Si la CLÉ existe : True/False", "La position dans le dictionnaire", "Le nombre de valeurs stockées"], a: 1, exp: "in sur un dict teste les clés." },
    { type: "qcm", q: "Parcourir les PAIRES (clé, valeur) :", opts: ["for c in notes", "for c, v in notes.items():", "for v in notes.values()", "for i in range(len(notes))"], a: 1, exp: "items() donne les couples (clé, valeur)." },
    { type: "qcm", q: "Dans le compteur, <code>compteur.get(mot, 0) + 1</code> fait…", opts: ["Supprime le mot", "Lit le compte actuel (0 si nouveau) et l'incrémente : un compteur PAR clé", "Trie les clés du compteur", "Compte les clés"], a: 1, exp: "Le motif compteur, distribué par clé." },
    { type: "input", q: "Votes [\"A\",\"B\",\"A\",\"A\",\"C\"] passés au compteur. Que vaut compteur[\"A\"] ?", a: "3", ph: "nombre", exp: "Trois A." },
    { type: "input", q: "<code>c = [{\"nom\": \"Ana\"}, {\"nom\": \"Bob\"}]</code>. Que vaut <code>c[1][\"nom\"]</code> ?", a: ["Bob"], ph: "un mot", exp: "Élément 1 (le 2e), champ « nom »." },
    { type: "qcm", q: "Un set (ensemble) garantit…", opts: ["L'ordre", "L'UNICITÉ : les doublons sont éliminés", "Des paires clé-valeur", "Un accès par indice"], a: 1, exp: "{\"Ana\", \"Bob\", \"Ana\"} → {\"Ana\", \"Bob\"}." },
    { type: "qcm", q: "Supprimer les doublons d'une liste en une ligne :", opts: ["list.sort()", "list(set(ma_liste))", "ma_liste.unique()", "del doublons"], a: 1, exp: "set élimine les doublons, list() reconvertit en liste." },
    { type: "qcm", q: "<code>{1, 2, 3} &amp; {2, 3, 4}</code> vaut…", opts: ["{1, 2, 3, 4}", "{2, 3} : l'intersection (éléments communs)", "{1, 4}", "Une erreur"], a: 1, exp: "& = intersection ; | = union." },
    { type: "qcm", q: "À quelle structure Java correspond le dictionnaire ?", opts: ["int[]", "La HashMap : clé → valeur", "ArrayList", "String"], a: 1, exp: "Même concept, syntaxe intégrée au langage." },
    { type: "vf", q: "Une liste de dictionnaires est la forme typique des données venant d'une base ou d'une API web.", a: true, exp: "Chaque enregistrement = un dict ; la collection = une liste. On la retrouvera dans Django." }
  ],
  final: {
    title: "Exercice final — L'inventaire du magasin",
    intro: `<p>On gère un stock avec un dictionnaire :</p>
<pre class="pseudo">stock = {"pomme": 30, "poire": 12, "kiwi": 8}   # dict produit → quantité
stock["banane"] = 20          # ajoute une nouvelle paire (banane → 20)
stock["pomme"] += 5           # la clé pomme existe : on augmente sa quantité
print(stock.get("mangue", 0)) # accès sûr : 0 si "mangue" est absent (pas de KeyError)
print(len(stock))             # affiche le nombre de produits différents</pre>`,
    questions: [
      { type: "input", q: "Après <code>stock[\"pomme\"] += 5</code>, que vaut <code>stock[\"pomme\"]</code> ?", a: "35", ph: "nombre", exp: "30 + 5 = 35." },
      { type: "input", q: "Qu'affiche <code>stock.get(\"mangue\", 0)</code> ?", a: "0", ph: "nombre", exp: "« mangue » absent → la valeur par défaut 0 (pas de KeyError)." },
      { type: "input", q: "Qu'affiche <code>len(stock)</code> à la fin ?", a: "4", ph: "nombre", exp: "pomme, poire, kiwi, banane = 4 clés." },
      { type: "qcm", q: "Pour parcourir et afficher « produit : quantité » :", opts: ["for p in stock: print(p)", "for p, q in stock.items(): print(f\"{p} : {q}\")", "for i in range(len)", "stock.print()"], a: 1, exp: "items() donne les paires (produit, quantité)." },
      { type: "qcm", q: "Pour lister les produits en rupture (quantité 0), on filtrerait avec…", opts: ["stock.get(0)", "une compréhension : [p for p, q in stock.items() if q == 0]", "del stock", "set(stock)"], a: 1, exp: "Compréhension + items() + condition : le filtre sur un dict." }
    ],
    solution: `<pre class="pseudo">stock = {"pomme": 30, "poire": 12, "kiwi": 8}   # dict de départ
stock["banane"] = 20          # ajout d'une nouvelle paire
stock["pomme"] += 5           # modification → 35
print(stock.get("mangue", 0)) # 0 (absent, valeur par défaut)
print(len(stock))             # 4 produits

for produit, qte in stock.items():   # parcourt les paires (produit, quantité)
    print(f"{produit} : {qte}")      # affiche chaque produit et sa quantité

# Total du stock :
print(sum(stock.values()))    # additionne toutes les quantités : 35+12+8+20 = 75</pre>
<p>dict, get, items, compteur d'occurrences, set : les structures clé-valeur de Python. Demain : dates, random et compréhensions avancées.</p>`
  }
};
</script>
