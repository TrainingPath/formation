var DAY = {
  num: 8,
  title: "Les fonctions",
  subtitle: "Nommer un bloc réutilisable et le rappeler à volonté.",
  theory: `
<h3>1. Définir et appeler : def</h3>
<p>Une <strong>fonction</strong> regroupe des instructions sous un nom, avec d'éventuels <strong>paramètres</strong> et une valeur de <strong>retour</strong>. On la définit avec <code>def</code>.</p>
<pre class="pseudo">def carre(x):                # def + nom + paramètres entre parenthèses + :
    return x * x             # return RENVOIE le résultat (bloc indenté)

resultat = carre(4)          # APPEL : on passe 4, la fonction renvoie 16
print(resultat)              # 16</pre>
<ul>
<li><code>def</code> introduit la fonction ; le <code>:</code> ouvre son corps (indenté).</li>
<li><code>return</code> renvoie une valeur ET termine la fonction.</li>
<li>Pas de type à déclarer (typage dynamique), même si on peut l'indiquer (section 6).</li>
</ul>

<h3>2. Paramètres et arguments</h3>
<pre class="pseudo">def additionner(a, b):       # deux paramètres
    return a + b

additionner(3, 5)            # → 8 : 3 et 5 sont les ARGUMENTS
additionner(b=5, a=3)        # → 8 : arguments NOMMÉS (l'ordre n'importe plus)</pre>
<p>Python permet de passer les arguments par leur nom (<code>b=5, a=3</code>), ce qui clarifie les appels et libère de l'ordre.</p>

<h3>3. Fonction sans return : elle renvoie None</h3>
<pre class="pseudo">def afficher_ligne(n):       # cette fonction AGIT (affiche), ne renvoie rien d'utile
    print("-" * n)           # "-" * n répète le tiret n fois

x = afficher_ligne(5)        # affiche ----- ; mais x vaut None (pas de return)</pre>
<p>Une fonction sans <code>return</code> renvoie automatiquement <code>None</code> (« rien »). C'est l'équivalent des « procédures » : elle fait quelque chose sans produire de valeur à récupérer.</p>

<h3>4. Paramètres par défaut</h3>
<pre class="pseudo">def saluer(nom, politesse="Bonjour"):   # politesse a une valeur PAR DÉFAUT
    return f"{politesse} {nom} !"

saluer("Ana")            # → "Bonjour Ana !" (politesse prend le défaut)
saluer("Ana", "Salut")   # → "Salut Ana !"</pre>

<h3>5. La portée : les variables locales</h3>
<pre class="pseudo">def calcul():
    x = 5                    # x est LOCALE : elle n'existe que dans la fonction
    return x
calcul()
print(x)                     # ERREUR : x n'existe pas ici (NameError)</pre>
<div class="warn">Une variable créée dans une fonction est <strong>locale</strong> : elle disparaît à la fin de l'appel et reste invisible à l'extérieur. Pour faire sortir un résultat, on utilise <code>return</code> — pas de variable « globale » (déconseillée). C'est la bonne pratique : entrées via les paramètres, sortie via le return.</div>

<h3>6. Bonus : les annotations de type et la docstring</h3>
<pre class="pseudo">def moyenne(notes: list) -&gt; float:       # : list = type attendu, -&gt; float = type de retour
    """Renvoie la moyenne d'une liste de nombres."""   # docstring : documentation de la fonction
    return sum(notes) / len(notes)</pre>
<div class="tip">Les <strong>annotations de type</strong> (<code>notes: list</code>, <code>-&gt; float</code>) sont optionnelles et n'imposent rien à l'exécution, mais documentent l'intention et aident les éditeurs. La <strong>docstring</strong> (la chaîne entre triples guillemets juste sous le <code>def</code>) explique ce que fait la fonction : un réflexe de code propre.</div>`,
  exercises: [
    { type: "qcm", q: "Quel mot-clé définit une fonction en Python ?", opts: ["function", "def", "func", "fn"], a: 1, exp: "def nom(paramètres): puis le corps indenté." },
    { type: "qcm", q: "<code>return</code> sert à…", opts: ["Afficher une valeur", "Renvoyer une valeur ET terminer la fonction", "Recommencer", "Déclarer une variable"], a: 1, exp: "RETOURNER, comme dans les autres langages." },
    { type: "input", q: "<code>def f(x): return x * x + 1</code>. Que vaut <code>f(f(2))</code> ?", a: "26", ph: "nombre", exp: "f(2) = 5, f(5) = 26 : composition." },
    { type: "qcm", q: "Une fonction sans <code>return</code> renvoie…", opts: ["0", "None (« rien »)", "false", "une erreur"], a: 1, exp: "Automatiquement None : le « procédure » de Python." },
    { type: "qcm", q: "<code>saluer(\"Ana\")</code> avec <code>politesse=\"Bonjour\"</code> par défaut donne…", opts: ["Une erreur (argument manquant)", "« Bonjour Ana ! » : le défaut comble l'absence", "« Ana »", "None"], a: 1, exp: "Le paramètre par défaut rend l'argument optionnel." },
    { type: "qcm", q: "<code>additionner(b=5, a=3)</code> est…", opts: ["Une erreur", "Valide : arguments NOMMÉS, l'ordre n'importe plus", "Toujours 0", "Une soustraction"], a: 1, exp: "Passer par nom clarifie et libère de l'ordre." },
    { type: "qcm", q: "Une variable créée dans une fonction est…", opts: ["Visible partout", "LOCALE : elle disparaît à la fin de l'appel", "Une constante", "Globale par défaut"], a: 1, exp: "Portée locale : on fait sortir le résultat via return." },
    { type: "qcm", q: "Après une fonction qui fait <code>x = 5</code> en interne, <code>print(x)</code> à l'extérieur…", opts: ["Affiche 5", "Provoque une NameError : x n'existe pas hors de la fonction", "Affiche None", "Affiche 0"], a: 1, exp: "La variable locale est invisible dehors." },
    { type: "qcm", q: "Comment faire « sortir » un résultat d'une fonction ?", opts: ["Une variable globale", "Le return : entrées par les paramètres, sortie par return", "print seulement", "Impossible"], a: 1, exp: "La bonne pratique : paramètres + return." },
    { type: "qcm", q: "<code>\"-\" * 5</code> vaut…", opts: ["-5", "\"-----\" : Python répète la chaîne", "Une erreur", "0"], a: 1, exp: "Multiplier une chaîne par un entier la répète." },
    { type: "qcm", q: "La docstring d'une fonction est…", opts: ["Un commentaire //", "Une chaîne entre triples guillemets sous le def, qui documente la fonction", "Un paramètre", "Le return"], a: 1, exp: "\"\"\"...\"\"\" juste après def : la doc intégrée." },
    { type: "qcm", q: "Dans <code>def moyenne(notes: list) -&gt; float:</code>, que signifie <code>-&gt; float</code> ?", opts: ["Une flèche décorative", "Le type de RETOUR annoncé (optionnel, non imposé)", "Une division", "Une erreur"], a: 1, exp: "Annotation de type : documente sans contraindre l'exécution." },
    { type: "input", q: "<code>def mystere(a, b): return a * 10 + b</code>. Que vaut <code>mystere(mystere(1, 2), 3)</code> ?", a: "123", ph: "nombre", exp: "mystere(1,2)=12, puis 12*10+3=123." },
    { type: "qcm", q: "« Afficher un menu » : quelle fonction ?", opts: ["def menu(): return ...", "def menu(): print(...) — une action, pas de return utile", "menu = list", "def menu -> int"], a: 1, exp: "Besoin d'un résultat ? Non → une fonction qui affiche, renvoie None." },
    { type: "vf", q: "Les annotations de type (x: int) sont obligatoires en Python.", a: false, exp: "Elles sont optionnelles : Python reste dynamiquement typé. Elles documentent seulement." }
  ],
  final: {
    title: "Exercice final — La fonction est_pair",
    intro: `<p>On écrit et on utilise une fonction-test :</p>
<pre class="pseudo">def est_pair(n):
    return n % 2 == 0

print(est_pair(4))       # ?
print(est_pair(7))       # ?
if est_pair(10):
    print("10 est pair")</pre>`,
    questions: [
      { type: "qcm", q: "Que renvoie <code>est_pair(4)</code> ?", opts: ["4", "True : 4 % 2 == 0 est vrai", "False", "None"], a: 1, exp: "La fonction renvoie directement le booléen de la comparaison." },
      { type: "qcm", q: "Que renvoie <code>est_pair(7)</code> ?", opts: ["True", "False : 7 % 2 vaut 1, donc == 0 est faux", "7", "None"], a: 1, exp: "7 est impair." },
      { type: "qcm", q: "Pourquoi <code>if est_pair(10):</code> fonctionne-t-il sans <code>== True</code> ?", opts: ["Chance", "est_pair renvoie déjà un booléen, consommé directement par le if", "Il manque quelque chose", "Erreur"], a: 1, exp: "Une fonction-test se lit comme une phrase : « si 10 est pair »." },
      { type: "input", q: "Écris la ligne qui définit une fonction triple qui renvoie n × 3 : def triple(n): …", a: ["return n * 3", "return n*3"], ph: "return …", exp: "def triple(n): return n * 3." },
      { type: "vf", q: "Une fonction bien nommée (est_pair, triple) rend le code lisible comme une phrase.", a: true, exp: "Le bon nommage est au cœur d'un code clair." }
    ],
    solution: `<pre class="pseudo">def est_pair(n):
    return n % 2 == 0        # renvoie directement le booléen

print(est_pair(4))           # True
print(est_pair(7))           # False
if est_pair(10):             # se lit « si 10 est pair »
    print("10 est pair")</pre>
<p>def, paramètres, return, portée locale, valeurs par défaut : les fonctions structurent ton code. Demain : les chaînes de caractères.</p>`
  }
};
