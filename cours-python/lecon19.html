<h3>1. Les dates : datetime en pratique</h3>
<pre class="pseudo">from datetime import date, timedelta   # importe l'outil « date » et l'outil « timedelta » (une durée)

aujourd = date.today()               # récupère la date du jour
examen = date(2026, 9, 15)           # construit une date précise : année, mois, jour
examen.year                          # → 2026 ; examen.month → 9 ; examen.day → 15 (on lit les champs)
demain = aujourd + timedelta(days=1) # ajoute une durée de 1 jour à aujourd → demain
reste = (examen - aujourd).days      # soustrait deux dates, .days = le nombre de jours d'écart
examen.strftime("%d/%m/%Y")          # → "15/09/2026" : FORMATE la date en texte selon un motif</pre>
<div class="tip">Un <code>timedelta</code> représente une DURÉE : on l'ajoute ou on le soustrait à une date. <code>strftime</code> (« string format time ») transforme une date en texte selon un motif : <code>%d</code> le jour, <code>%m</code> le mois, <code>%Y</code> l'année.</div>

<h3>2. random : plus que le dé</h3>
<pre class="pseudo">import random                         # charge le module du hasard
random.randint(1, 6)                  # entier de 1 à 6 (les deux bornes incluses)
random.choice(liste)                  # renvoie UN élément au hasard de la liste
random.sample(liste, 3)              # renvoie 3 éléments DISTINCTS au hasard (tirage sans remise)
random.shuffle(liste)                # mélange les éléments de la liste sur place
random.uniform(0, 10)                # renvoie un FLOAT (nombre à virgule) au hasard entre 0 et 10
random.seed(42)                      # fixe le hasard → mêmes tirages à chaque exécution (utile pour tester)</pre>

<h3>3. La compréhension de liste (rappel + filtres)</h3>
<pre class="pseudo">[x * x for x in range(1, 6)]         # → [1, 4, 9, 16, 25] : TRANSFORME chaque valeur (le carré)
[x for x in nombres if x &gt; 0]        # FILTRE : ne garde que les nombres positifs
[x if x &gt; 0 else 0 for x in nombres] # transformation conditionnelle (le if...else vient AVANT le for)</pre>

<h3>4. Compréhensions de dictionnaire et d'ensemble</h3>
<pre class="pseudo">{n: n * n for n in range(1, 4)}      # → {1: 1, 2: 4, 3: 9} : compréhension de DICT (avec « clé: valeur »)
{mot.lower() for mot in mots}        # → un SET (valeurs uniques), chaque mot en minuscules
carres_dict = {mot: len(mot) for mot in ["a", "bb", "ccc"]}   # construit {mot → sa longueur}</pre>
<p>La même syntaxe qu'une compréhension de liste, mais avec des accolades : <code>{cle: valeur for ...}</code> construit un dictionnaire, <code>{expr for ...}</code> construit un ensemble.</p>

<h3>5. lambda : les mini-fonctions anonymes</h3>
<pre class="pseudo">carre = lambda x: x * x              # une fonction ANONYME (sans nom propre) rangée dans une variable
carre(5)                             # → 25 : on l'appelle comme une fonction normale

# Surtout utile en argument d'autres fonctions :
sorted(eleves, key=lambda e: e["note"])          # trie une liste de dicts PAR la note de chacun
sorted(mots, key=len)                            # trie des mots par leur longueur (key=len)
sorted(mots, key=len, reverse=True)              # même tri, mais en ordre décroissant</pre>
<div class="tip">Une <code>lambda</code> est une fonction courte définie en une ligne, sans <code>def</code> ni <code>return</code>. Elle brille comme argument <code>key=</code> de <code>sorted</code>, <code>max</code> ou <code>min</code> : on dit « trie/compare SELON tel critère ».</div>

<h3>6. map et filter (l'alternative aux compréhensions)</h3>
<pre class="pseudo">list(map(lambda x: x * 2, [1, 2, 3]))        # → [2, 4, 6] : map APPLIQUE la fonction à chaque élément
list(filter(lambda x: x &gt; 0, [-1, 2, -3]))    # → [2] : filter GARDE ceux qui passent le test
# Équivalents en compréhension (souvent plus lisibles) :
[x * 2 for x in [1, 2, 3]]                    # même résultat que le map ci-dessus
[x for x in [-1, 2, -3] if x &gt; 0]             # même résultat que le filter ci-dessus</pre>
<p><code>map</code> (transformer) et <code>filter</code> (garder sous condition) font le même travail que les compréhensions. En Python, on préfère souvent la compréhension, plus lisible — mais il faut savoir lire les deux.</p>`,

]

    solution: "# Grille des concerts : calendrier, tirage reproductible, deux vues\nfrom datetime import date, timedelta\nimport random\n\nOUVERTURE = date(2026, 9, 15)\nPLAYLIST = [\n    (\"Nuit blanche\", 214),\n    (\"Sillage\", 305),\n    (\"Ressac\", 178),\n    (\"Talus\", 262),\n    (\"Zenith\", 401),\n    (\"Bleu Klein\", 236),\n]\n\n# a) une DUREE s'ajoute a une date. Le calendrier — 30 jours en septembre,\n#    31 en octobre, les annees bissextiles — est gere par l'objet, pas par moi.\ndates = [(OUVERTURE + timedelta(days=7 * k)).strftime(\"%d/%m/%Y\") for k in range(6)]\nfor d in dates:\n    print(d)\n\n# b) meme point de depart => memes tirages. Le hasard reste imprevisible,\n#    mais il devient REJOUABLE : c'est ce qui rend un test possible.\nrandom.seed(2026)\nselection = random.sample(PLAYLIST, 3)   # sans remise : 3 titres DISTINCTS\nfor titre, duree in selection:\n    print(f\"selection : {titre}\")\n\n# c) key= designe la valeur a comparer ; reverse=True renverse le classement\nclassement = sorted(PLAYLIST, key=lambda morceau: morceau[1], reverse=True)\nfor titre, duree in classement:\n    print(f\"{titre} — {duree} s\")\n\n# filter GARDE ce qui passe le test ; il rend un objet paresseux, d'ou list()\nlongs = list(filter(lambda morceau: morceau[1] > 240, PLAYLIST))\nnoms_longs = [titre for titre, duree in longs]\nprint(f\"titres de plus de 4 minutes : {noms_longs}\")",

      { ref: "Réflexion", texte: "<strong>a)</strong> Le programme n'a pas eu à connaître la longueur de septembre parce qu'il n'a jamais manipulé de numéro de jour : il a ajouté une <em>durée</em> à une <em>date</em>, et c'est l'objet date qui sait que le 29 septembre plus sept jours donne le 6 octobre. En ajoutant 7 au numéro du jour, j'aurais obtenu un 36 septembre — soit une erreur immédiate si l'objet refuse de le construire, soit, si je m'étais contenté d'entiers, une date fausse qui s'affiche très bien et décale toute la fin de la saison. C'est la raison d'être des types de date : ils portent les règles du calendrier pour que je n'aie pas à les réécrire, et à les réécrire mal. <strong>b)</strong> C'est encore du hasard au sens où la suite produite n'a aucune régularité exploitable et ne favorise aucun titre ; ce n'en est plus au sens où elle n'est pas imprévisible pour qui connaît le point de départ. La propriété est indispensable partout où il faut pouvoir <em>rejouer</em> : un test qui porte sur un tirage passerait un jour et échouerait le lendemain sans elle ; une simulation scientifique qu'on ne peut pas reproduire ne prouve rien ; et ici, la conductrice imprimée doit correspondre à ce que la machine jouera. Elle serait une faute grave partout où l'imprévisibilité est ce qu'on achète : un tirage au sort officiel dont la graine est connue est truqué, et un mot de passe ou une clé de chiffrement engendrés à partir d'une graine fixe sont devinables par quiconque connaît cette graine. <strong>c)</strong> Ici je préfère la compréhension : elle se lit de gauche à droite comme une phrase, et je n'ai pas à écrire de fonction anonyme pour exprimer une comparaison triviale. <code>filter</code> devient meilleur quand le test est <em>déjà</em> une fonction nommée qui existe pour d'autres raisons — écrire <code>filter(est_disponible, titres)</code> se lit mieux que la compréhension équivalente, parce qu'il n'y a plus de variable intermédiaire inventée pour la circonstance et que le nom de la fonction dit le critère." }
    ],
    pourquoi: "Le résultat de <code>filter</code> est enveloppé dans <code>list</code>. Sans cela, la variable contiendrait un objet paresseux qui ne calcule rien tant qu'on ne le parcourt pas — et qui, une fois parcouru, est <em>épuisé</em> : un second parcours ne rend plus rien. L'afficher donnerait d'ailleurs une mention technique au lieu des titres attendus. C'est un piège classique du passage aux outils paresseux : le programme ne plante pas, il rend simplement du vide la deuxième fois qu'on le lit.",

    solution: "# Budget du festival — jour 1 : dates, ordre de passage, premier etat\nfrom datetime import date, timedelta\nimport random\n\nOUVERTURE = date(2027, 7, 3)\nGROUPES = [\n    (\"Les Alizes\", 3200),\n    (\"Cinabre\", 5400),\n    (\"Maree Basse\", 2100),\n    (\"Otarie\", 8600),\n    (\"Vent d'Est\", 4300),\n]\n\n# a) trois journees consecutives, obtenues par ajout d'une DUREE\njournees = [(OUVERTURE + timedelta(days=k)).strftime(\"%d/%m/%Y\") for k in range(3)]\nfor jour in journees:\n    print(jour)\n\n# b) graine fixe : l'affiche partie chez l'imprimeur restera valable demain\nrandom.seed(7)\nordre = [nom for nom, cachet in GROUPES]   # on isole les noms AVANT de melanger\nrandom.shuffle(ordre)                      # melange SUR PLACE : ne rend rien\nfor rang, nom in enumerate(ordre, start=1):\n    print(f\"{rang}. {nom}\")\n\n# c) premier etat du budget\ntotal = sum(cachet for nom, cachet in GROUPES)\nmoyenne = total / len(GROUPES)\nprint(f\"total des cachets : {total} EUR\")\nprint(f\"cachet moyen : {moyenne} EUR\")\n\nchers = [(nom, cachet) for nom, cachet in GROUPES if cachet > moyenne]\nchers = sorted(chers, key=lambda groupe: groupe[1], reverse=True)\nfor nom, cachet in chers:\n    print(f\"{nom} : {cachet} EUR (+{cachet - moyenne} par rapport a la moyenne)\")",
