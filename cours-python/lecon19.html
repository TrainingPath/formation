<script>
var DAY = {
  num: 19,
  title: "Dates, random et compréhensions",
  subtitle: "Les outils du quotidien et les raccourcis élégants.",
  theory: `
<h3>1. Les dates : datetime en pratique</h3>
<pre class="pseudo">from datetime import date, timedelta   # importe l'outil « date » et l'outil « timedelta » (une durée)

aujourd = date.today()               # récupère la date du jour
examen = date(2026, 9, 15)           # construit une date précise : année, mois, jour
examen.year                          # → 2026 ; examen.month → 9 ; examen.day → 15 (on lit les champs)
demain = aujourd + timedelta(days=1) # ajoute une durée de 1 jour à aujourd → demain
reste = (examen - aujourd).days      # soustrait deux dates, .days = le nombre de jours d'écart
examen.strftime("%d/%m/%Y")          # → "15/09/2026" : FORMATE la date en texte selon un motif</pre>
<div class="tip">Un <code>timedelta</code> représente une DURÉE : on l'ajoute ou on le soustrait à une date. <code>strftime</code> (« string format time ») transforme une date en texte selon un motif : <code>%d</code> le jour, <code>%m</code> le mois, <code>%Y</code> l'année.</div>

<h3>2. random : plus que le dé</h3>
<pre class="pseudo">import random                         # charge le module du hasard
random.randint(1, 6)                  # entier de 1 à 6 (les deux bornes incluses)
random.choice(liste)                  # renvoie UN élément au hasard de la liste
random.sample(liste, 3)              # renvoie 3 éléments DISTINCTS au hasard (tirage sans remise)
random.shuffle(liste)                # mélange les éléments de la liste sur place
random.uniform(0, 10)                # renvoie un FLOAT (nombre à virgule) au hasard entre 0 et 10
random.seed(42)                      # fixe le hasard → mêmes tirages à chaque exécution (utile pour tester)</pre>

<h3>3. La compréhension de liste (rappel + filtres)</h3>
<pre class="pseudo">[x * x for x in range(1, 6)]         # → [1, 4, 9, 16, 25] : TRANSFORME chaque valeur (le carré)
[x for x in nombres if x &gt; 0]        # FILTRE : ne garde que les nombres positifs
[x if x &gt; 0 else 0 for x in nombres] # transformation conditionnelle (le if...else vient AVANT le for)</pre>

<h3>4. Compréhensions de dictionnaire et d'ensemble</h3>
<pre class="pseudo">{n: n * n for n in range(1, 4)}      # → {1: 1, 2: 4, 3: 9} : compréhension de DICT (avec « clé: valeur »)
{mot.lower() for mot in mots}        # → un SET (valeurs uniques), chaque mot en minuscules
carres_dict = {mot: len(mot) for mot in ["a", "bb", "ccc"]}   # construit {mot → sa longueur}</pre>
<p>La même syntaxe qu'une compréhension de liste, mais avec des accolades : <code>{cle: valeur for ...}</code> construit un dictionnaire, <code>{expr for ...}</code> construit un ensemble.</p>

<h3>5. lambda : les mini-fonctions anonymes</h3>
<pre class="pseudo">carre = lambda x: x * x              # une fonction ANONYME (sans nom propre) rangée dans une variable
carre(5)                             # → 25 : on l'appelle comme une fonction normale

# Surtout utile en argument d'autres fonctions :
sorted(eleves, key=lambda e: e["note"])          # trie une liste de dicts PAR la note de chacun
sorted(mots, key=len)                            # trie des mots par leur longueur (key=len)
sorted(mots, key=len, reverse=True)              # même tri, mais en ordre décroissant</pre>
<div class="tip">Une <code>lambda</code> est une fonction courte définie en une ligne, sans <code>def</code> ni <code>return</code>. Elle brille comme argument <code>key=</code> de <code>sorted</code>, <code>max</code> ou <code>min</code> : on dit « trie/compare SELON tel critère ».</div>

<h3>6. map et filter (l'alternative aux compréhensions)</h3>
<pre class="pseudo">list(map(lambda x: x * 2, [1, 2, 3]))        # → [2, 4, 6] : map APPLIQUE la fonction à chaque élément
list(filter(lambda x: x &gt; 0, [-1, 2, -3]))    # → [2] : filter GARDE ceux qui passent le test
# Équivalents en compréhension (souvent plus lisibles) :
[x * 2 for x in [1, 2, 3]]                    # même résultat que le map ci-dessus
[x for x in [-1, 2, -3] if x &gt; 0]             # même résultat que le filter ci-dessus</pre>
<p><code>map</code> (transformer) et <code>filter</code> (garder sous condition) font le même travail que les compréhensions. En Python, on préfère souvent la compréhension, plus lisible — mais il faut savoir lire les deux.</p>`,
  exercises: [
    { type: "qcm", q: "Un <code>timedelta</code> représente…", opts: ["Une date", "Une DURÉE, qu'on ajoute/soustrait à une date", "Une heure fixe", "Un fuseau horaire précis"], a: 1, exp: "date + timedelta(days=7) = une semaine plus tard." },
    { type: "qcm", q: "<code>date.today() + timedelta(days=1)</code> donne…", opts: ["Hier", "Demain", "Aujourd'hui", "Une erreur"], a: 1, exp: "On avance d'un jour." },
    { type: "qcm", q: "<code>examen.strftime(\"%d/%m/%Y\")</code> produit…", opts: ["Un objet datetime", "La date formatée en texte, ex. « 15/09/2026 »", "Une durée", "Le nombre de jours"], a: 1, exp: "strftime formate une date selon un motif." },
    { type: "qcm", q: "<code>(examen - aujourd).days</code> donne…", opts: ["Une date", "Le NOMBRE de jours entre les deux dates", "Une heure", "Une erreur"], a: 1, exp: "La soustraction donne un timedelta, dont on lit .days." },
    { type: "qcm", q: "<code>random.sample(liste, 3)</code> retourne…", opts: ["Un élément", "3 éléments DISTINCTS au hasard (sans remise)", "La liste triée", "3 éléments, doublons possibles"], a: 1, exp: "sample tire plusieurs éléments différents ; choice n'en tire qu'un." },
    { type: "qcm", q: "<code>random.seed(42)</code> sert à…", opts: ["Rendre les tirages plus rapides", "Rendre le hasard REPRODUCTIBLE (mêmes tirages) — pratique pour tester", "Empêcher les doublons", "Réinitialiser la liste tirée"], a: 1, exp: "Fixer la graine : les mêmes nombres à chaque exécution." },
    { type: "qcm", q: "<code>{n: n * n for n in range(1, 4)}</code> vaut…", opts: ["[1, 4, 9]", "{1: 1, 2: 4, 3: 9} : une compréhension de DICT", "{1, 4, 9}", "Une erreur"], a: 1, exp: "{cle: valeur for ...} construit un dictionnaire." },
    { type: "qcm", q: "<code>{mot.lower() for mot in mots}</code> construit…", opts: ["Une liste", "Un SET (valeurs uniques) en minuscules", "Un dict", "Une chaîne"], a: 1, exp: "{expr for ...} (sans « : ») construit un ensemble." },
    { type: "qcm", q: "Une <code>lambda</code> est…", opts: ["Une classe", "Une petite fonction ANONYME définie en une ligne", "Un module", "Une boucle"], a: 1, exp: "lambda x: x * x — sans def ni return." },
    { type: "qcm", q: "<code>sorted(eleves, key=lambda e: e[\"note\"])</code> fait…", opts: ["Trie par nom", "Trie la liste de dicts SELON la note (le critère key)", "Compte les élèves", "Filtre les élèves reçus"], a: 1, exp: "key= indique le critère de tri." },
    { type: "qcm", q: "<code>sorted(mots, key=len)</code> trie les mots…", opts: ["Par ordre alphabétique", "Par LONGUEUR croissante", "Par ordre inverse", "Par première lettre"], a: 1, exp: "key=len : le critère est la longueur de chaque mot." },
    { type: "qcm", q: "<code>list(map(lambda x: x * 2, [1, 2, 3]))</code> vaut…", opts: ["[1, 2, 3]", "[2, 4, 6] : map applique la fonction à chaque élément", "6", "[2]"], a: 1, exp: "map = transformer chaque élément." },
    { type: "qcm", q: "<code>filter(lambda x: x &gt; 0, [-1, 2, -3])</code> garde…", opts: ["Toute la liste inchangée", "Les éléments qui PASSENT le test (x > 0) → [2]", "Le premier", "Les éléments négatifs"], a: 1, exp: "filter = garder sous condition." },
    { type: "qcm", q: "En Python, entre map/filter et une compréhension, on préfère souvent…", opts: ["map/filter toujours", "La compréhension, plus lisible (mais savoir lire les deux)", "Ni l'un ni l'autre", "map seulement"], a: 1, exp: "[x*2 for x in liste] est jugé plus clair que map." },
    { type: "vf", q: "Une lambda est surtout utile comme argument key= de sorted/max/min.", a: true, exp: "sorted(liste, key=lambda e: e[\"note\"]) : trier selon un critère." }
  ],
  final: {
    title: "Exercice final — Le classement des élèves",
    intro: `<p>On trie une liste d'élèves par note :</p>
<pre class="pseudo">eleves = [                       # une liste de dictionnaires (une fiche par élève)
    {"nom": "Ana", "note": 14},  # premier élève
    {"nom": "Bob", "note": 9},   # deuxième élève
    {"nom": "Zoé", "note": 18}   # troisième élève
]
classement = sorted(eleves, key=lambda e: e["note"], reverse=True)   # trie par note, du plus grand au plus petit
for e in classement:             # parcourt les élèves déjà classés…
    print(e["nom"], e["note"])   # …affiche le nom et la note de chacun</pre>`,
    questions: [
      { type: "qcm", q: "Selon quel critère la liste est-elle triée ?", opts: ["Par nom", "Par note (key=lambda e: e[\"note\"])", "Par ordre d'ajout", "Par longueur"], a: 1, exp: "La lambda extrait la note comme critère de tri." },
      { type: "qcm", q: "Que fait <code>reverse=True</code> ?", opts: ["Ne change pas le tri", "Trie de la plus GRANDE note à la plus petite (décroissant)", "Inverse les noms", "Supprime le dernier élément"], a: 1, exp: "reverse=True : ordre décroissant." },
      { type: "qcm", q: "Qui apparaît en premier dans le classement ?", opts: ["Ana", "Zoé (18, la meilleure note)", "Bob", "L'ordre initial"], a: 1, exp: "Décroissant : la note 18 en tête." },
      { type: "qcm", q: "Pour ne garder que les élèves reçus (≥ 10) :", opts: ["sorted", "[e for e in eleves if e[\"note\"] &gt;= 10] (compréhension avec filtre)", "map", "reverse"], a: 1, exp: "Une compréhension de liste avec condition." },
      { type: "input", q: "Écris la compréhension de dict {nom: note} à partir de la liste : {… for e in eleves}", a: ["e[\"nom\"]: e[\"note\"]", "e['nom']: e['note']"], ph: "cle: valeur", exp: "{e[\"nom\"]: e[\"note\"] for e in eleves}." }
    ],
    solution: `<pre class="pseudo">classement = sorted(eleves, key=lambda e: e["note"], reverse=True)   # tri par note décroissant
for e in classement:             # parcourt le classement…
    print(e["nom"], e["note"])   # …affiche : Zoé 18, Ana 14, Bob 9

recus = [e for e in eleves if e["note"] &gt;= 10]        # compréhension avec filtre : élèves reçus
par_nom = {e["nom"]: e["note"] for e in eleves}      # compréhension de dict : nom → note

import random                    # module du hasard
gagnant = random.choice(eleves)  # tire un élève au hasard dans la liste</pre>
<p>datetime, random, compréhensions (liste/dict/set), lambda, map/filter : l'expressivité complète de Python. Demain : le projet gestionnaire de tâches.</p>`
  }
};
