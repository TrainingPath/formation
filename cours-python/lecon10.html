<h3>1. Les tuples : des listes immuables</h3>
<p>Un <strong>tuple</strong> ressemble à une liste, mais avec des parenthèses et une différence majeure : il est <strong>immuable</strong> (une fois créé, on ne peut ni ajouter, ni modifier, ni retirer ses éléments).</p>
<pre class="pseudo">point = (3, 5)               # crée un tuple : parenthèses au lieu de crochets
point[0]                     # → 3 : accès par indice, exactement comme une liste
# point[0] = 9              # ERREUR si on l'exécutait : un tuple ne se modifie pas
couleurs = ("rouge", "vert", "bleu")   # un tuple de 3 textes, utile pour des données fixes</pre>
<p>On utilise un tuple pour des données qui ne doivent pas changer : des coordonnées, une date (jour, mois, an), une paire (clé, valeur)…</p>

<h3>2. Le déballage (unpacking)</h3>
<p>Le <strong>déballage</strong> range chaque élément d'un tuple ou d'une liste dans une variable distincte, en une seule ligne.</p>
<pre class="pseudo">x, y = (3, 5)                # x reçoit 3, y reçoit 5 : les deux valeurs sont « déballées »
a, b = b, a                  # ÉCHANGE de deux variables en UNE ligne, sans variable temporaire
premier, *reste = [1, 2, 3, 4]   # premier = 1 ; l'étoile * met tout le reste dans une liste [2, 3, 4]</pre>
<div class="tip">Le déballage rend l'échange de variables trivial : <code>a, b = b, a</code>. Là où Java/C# avaient besoin d'une variable temporaire, Python permute directement — une des élégances les plus appréciées du langage.</div>

<h3>3. enumerate et zip : parcourir intelligemment</h3>
<pre class="pseudo">for i, valeur in enumerate(["a", "b", "c"]):   # enumerate fournit l'INDICE i ET la valeur à chaque tour
    print(i, valeur)                            # affiche 0 a, puis 1 b, puis 2 c

noms = ["Ana", "Bob"]                          # une première liste
ages = [20, 17]                                # une seconde liste, alignée sur la première
for nom, age in zip(noms, ages):               # zip parcourt DEUX listes en parallèle, par paires
    print(f"{nom} a {age} ans")                # affiche « Ana a 20 ans », puis « Bob a 17 ans »</pre>

<h3>4. La compréhension de liste : le motif star de Python</h3>
<p>Une <strong>compréhension</strong> construit une liste en une seule ligne, à partir d'une boucle. C'est LA signature de Python.</p>
<pre class="pseudo"># Boucle classique :
carres = []                                # on part d'une liste vide
for x in range(1, 6):                      # pour x de 1 à 5…
    carres.append(x * x)                   # …on ajoute le carré de x
# Compréhension équivalente (même résultat en une ligne) :
carres = [x * x for x in range(1, 6)]      # → [1, 4, 9, 16, 25]</pre>
<pre class="pseudo">[x for x in nombres if x &gt; 0]      # avec un FILTRE : ne garde que les nombres positifs
[mot.upper() for mot in mots]      # TRANSFORME chaque élément (ici en majuscules)
[x * 2 for x in range(5)]          # → [0, 2, 4, 6, 8] : double chaque valeur de 0 à 4</pre>
<p>La forme générale : <code>[expression for element in sequence if condition]</code>. L'<code>if</code> final (facultatif) filtre ; l'expression de gauche transforme.</p>

<h3>5. Listes de listes (tableaux 2D)</h3>
<pre class="pseudo">grille = [                   # une liste DE listes = un tableau à deux dimensions (une grille)
    [1, 2, 3],               # ligne 0 : trois cases
    [4, 5, 6]                # ligne 1 : trois cases
]
grille[1][2]                 # → 6 : d'abord la ligne 1, puis la colonne 2 de cette ligne
for ligne in grille:         # parcourt chaque ligne (qui est elle-même une liste)…
    for case in ligne:       # …puis chaque case de cette ligne
        print(case, end=" ") # affiche la case suivie d'une espace (end=" " évite le saut de ligne)</pre>

<h3>6. Copier une liste (attention au piège)</h3>
<pre class="pseudo">a = [1, 2, 3]                # une liste
b = a                        # PIÈGE : b et a désignent la MÊME liste en mémoire (pas une copie !)
b.append(4)                  # on modifie via b… donc a change AUSSI → a vaut [1, 2, 3, 4]
c = a.copy()                 # copy() crée une copie INDÉPENDANTE (a[:] fonctionne aussi)</pre>
<div class="warn">Affecter <code>b = a</code> ne copie pas la liste : les deux noms pointent vers le même objet en mémoire. Modifier l'un modifie l'autre ! Pour une vraie copie, utilise <code>a.copy()</code> ou <code>a[:]</code>. Ce piège des « références partagées » est classique.</div>`,

print(recues, len(recues))               # affiche [12, 15, 18] 3</pre>
