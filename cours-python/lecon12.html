  title: "POO : classes et objets",
  subtitle: "Regrouper données et comportements dans un moule.",
  theory: `
<h3>1. Pourquoi la POO ?</h3>
<p>Pour gérer 50 étudiants avec des listes parallèles (noms, âges, notes), on doit tout garder synchronisé — fragile. La <strong>Programmation Orientée Objet</strong> (POO) regroupe les données ET les comportements d'une même « chose » dans une <strong>classe</strong>. Une <strong>classe</strong> est un moule (un plan) ; un <strong>objet</strong> est un exemplaire fabriqué à partir de ce moule.</p>

<h3>2. Définir une classe</h3>
<pre class="pseudo">class Etudiant:                         # déclare le moule « Etudiant » (le : ouvre le bloc de la classe)
    def __init__(self, nom, age):       # __init__ = le CONSTRUCTEUR, appelé automatiquement à la création
        self.nom = nom                  # self.nom = un ATTRIBUT de l'objet, rempli avec le paramètre nom
        self.age = age                  # de même pour l'âge
        self.moyenne = 0                # attribut avec une valeur de départ (0)

    def se_presenter(self):             # une MÉTHODE (fonction de la classe) ; self = l'objet appelant
        print(f"Je suis {self.nom}, {self.age} ans")   # utilise les attributs de cet objet

    def est_en_reussite(self):          # une autre méthode, qui renvoie un résultat
        return self.moyenne &gt;= 10       # True si la moyenne de cet objet atteint 10</pre>
<ul>
<li><code>class Etudiant:</code> déclare le moule ; le bloc indenté contient ses membres.</li>
<li><code>__init__</code> est le <strong>constructeur</strong> : il initialise l'objet à sa création.</li>
<li><code>self</code> représente l'objet lui-même ; c'est TOUJOURS le premier paramètre des méthodes.</li>
<li><code>self.nom = nom</code> crée un attribut propre à chaque objet.</li>
</ul>

<h3>3. Créer et utiliser des objets</h3>
<pre class="pseudo">e1 = Etudiant("Ana", 20)        # crée un objet : __init__ reçoit nom="Ana", age=20
e1.nom                          # → "Ana" : accès à un attribut avec le POINT
e1.moyenne = 14.5               # on modifie l'attribut moyenne de e1

e2 = Etudiant("Bob", 17)        # crée un second objet, totalement INDÉPENDANT du premier

e1.se_presenter()               # affiche « Je suis Ana, 20 ans » (ici self vaut e1)
print(e2.est_en_reussite())     # False (la moyenne de Bob est restée à 0)</pre>
<div class="tip">On n'écrit jamais <code>self</code> lors de l'appel : <code>e1.se_presenter()</code> passe automatiquement <code>e1</code> comme <code>self</code>. Et pas de <code>new</code> comme en Java/C# : on appelle simplement la classe comme une fonction, <code>Etudiant(...)</code>.</div>

<h3>4. Chaque objet a SES valeurs</h3>
<p>Modifier <code>e1.moyenne</code> ne touche pas <code>e2.moyenne</code> : les attributs sont propres à chaque objet. Les méthodes, elles, sont écrites une seule fois dans la classe et partagées — mais à l'appel, <code>self</code> désigne l'objet concerné. Un moule, des exemplaires distincts au comportement commun : c'est toute la puissance de la POO.</p>

<h3>5. self : le fil conducteur</h3>
<pre class="pseudo">class Compteur:                    # un moule pour un compteur
    def __init__(self):            # constructeur sans autre paramètre que self
        self.valeur = 0             # attribut « valeur », initialisé à 0

    def incrementer(self):         # méthode qui augmente le compteur
        self.valeur += 1            # self.valeur = l'attribut de CET objet (le += 1 l'augmente)

c = Compteur()                     # crée un objet Compteur (valeur = 0)
c.incrementer()                    # appelle la méthode : valeur passe à 1
c.incrementer()                    # encore : valeur passe à 2
print(c.valeur)                    # affiche 2</pre>
<div class="warn">Oublier <code>self</code> est l'erreur n°1 en POO Python : chaque méthode DOIT avoir <code>self</code> en premier paramètre, et chaque attribut se lit/écrit avec <code>self.</code>. Écrire <code>valeur += 1</code> (sans <code>self.</code>) créerait une variable locale, pas l'attribut de l'objet.</div>

<h3>6. Tu utilises des objets depuis le début !</h3>
<pre class="pseudo">ma_liste = [1, 2, 3]        # une liste est un OBJET
ma_liste.append(4)          # .append est une MÉTHODE de l'objet liste
mot = "chat"                # une str est aussi un objet
mot.upper()                 # .upper est une méthode de l'objet chaîne</pre>
<p>Depuis la leçon 7, chaque <code>.methode()</code> appelée sur une variable est de la POO. Créer tes propres classes ne fait que prolonger ce que tu pratiques déjà.</p>`,

    { type: "qcm", q: "Une méthode <code>est_en_reussite</code> qui fait <code>return self.moyenne &gt;= 10</code> renvoie…", opts: ["La moyenne", "Un booléen : True si la moyenne de CET objet atteint 10", "None", "Le nombre 10, le seuil de réussite"], a: 1, exp: "Une méthode peut renvoyer un résultat calculé sur ses attributs." },
    { type: "vf", q: "En Python, on n'utilise pas le mot-clé new pour créer un objet.", a: true, exp: "On appelle la classe directement : Etudiant(\"Ana\", 20)." },

<pre class="pseudo">class Chien:                     # déclare le moule « Chien »
    def __init__(self, nom):     # constructeur : reçoit le nom du chien

rex.caresser()                   # une caresse : contentement passe à 1
