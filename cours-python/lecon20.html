  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>gestionnaire de tâches</strong> en console : ajouter une tâche, lister les tâches, marquer comme faite, supprimer, sauvegarder en JSON, quitter. On applique la méthode éprouvée : comprendre → découper → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours (et prépare le projet Django !).</p>

<h3>2. Le découpage</h3>
<pre class="pseudo">Classe Tache      : texte, faite (bool)  + __str__          # représente UNE tâche
Classe Gestionnaire : la liste des tâches + les opérations   # gère la COLLECTION de tâches
Le programme      : le menu (boucle + choix) + la persistance JSON   # relie le tout et parle à l'utilisateur</pre>
<p>Chaque partie a un rôle unique : plus clair et plus facile à tester que tout mettre en vrac.</p>

<h3>3. La classe Tache (leçons 12-13)</h3>
<pre class="pseudo">class Tache:                           # déclare la classe représentant une seule tâche
    def __init__(self, texte, faite=False):   # constructeur ; « faite » vaut False par défaut
        self.texte = texte                 # attribut : le libellé de la tâche
        self.faite = faite                 # attribut : True/False ; une tâche naît « à faire »

    def __str__(self):                     # définit l'affichage texte de la tâche
        coche = "✅" if self.faite else "⬜"   # ternaire : coche pleine si faite, vide sinon
        return f"{coche} {self.texte}"     # renvoie « coche + libellé »</pre>

<h3>4. La classe Gestionnaire (leçons 7-16-17)</h3>
<pre class="pseudo">import json                            # module pour sauvegarder/charger en JSON

class Gestionnaire:                    # déclare la classe qui gère la collection de tâches
    def __init__(self):                # constructeur
        self.taches = []                   # attribut : la liste (vide au départ) d'objets Tache

    def ajouter(self, texte):          # ajoute une tâche à partir de son libellé
        self.taches.append(Tache(texte))   # crée un objet Tache et l'ajoute à la liste

    def lister(self):                  # affiche toutes les tâches
        if not self.taches:                # cas limite : liste vide (une liste vide est falsy)…
            print("(aucune tâche)")        # …message et…
            return                         # …on quitte la méthode tout de suite
        for i, t in enumerate(self.taches):   # sinon : enumerate donne l'indice i ET la tâche t
            print(f"{i} : {t}")               # affiche l'indice et la tâche ({t} déclenche __str__)

    def marquer_faite(self, i):        # marque la tâche d'indice i comme faite
        if 0 &lt;= i &lt; len(self.taches):       # on vérifie que l'indice est valide AVANT (anti-débordement)
            self.taches[i].faite = True    # passe l'attribut faite de cette tâche à True

    def supprimer(self, i):            # supprime la tâche d'indice i
        if 0 &lt;= i &lt; len(self.taches):       # même garde-fou sur l'indice
            del self.taches[i]             # retire l'élément de la liste

    def sauver(self, fichier):         # écrit la liste des tâches dans un fichier JSON
        data = [{"texte": t.texte, "fait": t.faite} for t in self.taches]  # objets Tache → dicts (compréhension)
        with open(fichier, "w") as f:      # ouvre le fichier en écriture
            json.dump(data, f)             # sérialise la liste de dicts en JSON

    def charger(self, fichier):        # recharge les tâches depuis un fichier JSON
        import os                          # module pour tester l'existence du fichier
        if os.path.exists(fichier):        # cas limite : au premier lancement, le fichier n'existe pas
            with open(fichier, "r") as f:  # s'il existe, on l'ouvre en lecture
                data = json.load(f)        # désérialise le JSON → liste de dicts
                self.taches = [Tache(d["texte"], d["fait"]) for d in data]  # dicts → objets Tache</pre>

<h3>5. Le menu (leçons 4-5-6-16)</h3>
<pre class="pseudo">g = Gestionnaire()                     # crée le gestionnaire
g.charger("taches.json")                   # au démarrage : recharge l'état sauvegardé précédemment

while True:                                # boucle du menu : tourne jusqu'au choix « Quitter »
    print("1.Ajouter 2.Lister 3.Faite 4.Supprimer 5.Quitter")   # affiche les options
    choix = input("Choix : ")              # lit le choix de l'utilisateur (une chaîne)
    if choix == "1":                       # option 1 : ajouter…
        g.ajouter(input("Texte : "))       # …lit un libellé et l'ajoute
    elif choix == "2":                     # option 2 : lister…
        g.lister()                         # …affiche toutes les tâches
    elif choix == "3":                     # option 3 : marquer faite…
        try:                               # on surveille la conversion de l'indice
            g.marquer_faite(int(input("Indice : ")))   # lit un indice, le convertit, marque la tâche
        except ValueError:                 # si la saisie n'est pas un nombre…
            print("Indice invalide")       # …message d'erreur
    elif choix == "4":                     # option 4 : supprimer…
        try:                               # même surveillance
            g.supprimer(int(input("Indice : ")))       # lit un indice et supprime la tâche
        except ValueError:                 # saisie non numérique…
            print("Indice invalide")       # …message d'erreur
    elif choix == "5":                     # option 5 : quitter…
        break                              # …on sort de la boucle while

g.sauver("taches.json")                    # à la sortie : sauvegarde l'état sur le disque</pre>
<div class="tip">Repère la carte du cours : classes + __init__ + __str__ (12-13), liste d'objets et enumerate (7-10), compréhensions pour convertir objets ⇄ dicts (10-18), JSON + with + os.path.exists (17), boucle while + input + try/except (4-6-16). Le projet EST la révision : chaque brique, vue isolément, collabore ici.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi séparer Tache et Gestionnaire en deux classes ?", opts: ["Pour écrire moins de code", "Une responsabilité par classe : Tache = une tâche, Gestionnaire = la collection — plus clair et testable", "C'est une contrainte du langage", "Pour accélérer le programme"], a: 1, exp: "Le découpage en responsabilités distinctes." },
    { type: "qcm", q: "Pourquoi <code>faite=False</code> par défaut dans __init__ ?", opts: ["Pour éviter une erreur de syntaxe", "Une tâche neuve est forcément « à faire » : l'objet naît cohérent", "False est plus rapide", "Parce que __str__ l'impose"], a: 1, exp: "L'état initial cohérent, garanti à la création." },
    { type: "qcm", q: "<code>if not self.taches:</code> teste…", opts: ["Si la liste contient une erreur", "Si la liste est VIDE (une liste vide est falsy)", "Le premier élément", "La taille exacte"], a: 1, exp: "not [] vaut True : le cas limite « aucune tâche »." },
    { type: "qcm", q: "<code>enumerate(self.taches)</code> fournit…", opts: ["Les tâches seules", "L'indice ET la tâche à chaque tour", "Le nombre de tâches", "Les tâches déjà triées"], a: 1, exp: "for i, t in enumerate(...) : position + valeur." },
    { type: "qcm", q: "<code>if 0 &lt;= i &lt; len(self.taches):</code> sert à…", opts: ["Trier les tâches par indice", "Vérifier que l'indice est valide AVANT d'y accéder (anti-IndexError)", "Compter les tâches faites", "Accélérer l'accès"], a: 1, exp: "L'encadrement protège contre les indices hors limites." },
    { type: "qcm", q: "La compréhension <code>[{\"texte\": t.texte, \"fait\": t.faite} for t in self.taches]</code> convertit…", opts: ["Des dicts en objets", "Les OBJETS Tache en dictionnaires (pour le JSON)", "Les objets Tache en chaînes", "Une liste en chaîne"], a: 1, exp: "json.dump a besoin de structures simples : on transforme les objets en dicts." },
    { type: "qcm", q: "<code>json.load</code> puis <code>[Tache(d[\"texte\"], d[\"fait\"]) for d in data]</code> fait…", opts: ["Sauvegarde les objets", "Reconstruit des OBJETS Tache à partir des dicts chargés", "Trie les tâches chargées", "Supprime les doublons"], a: 1, exp: "L'inverse : dicts du JSON → objets Tache." },
    { type: "qcm", q: "Pourquoi <code>os.path.exists</code> dans charger() ?", opts: ["Pour accélérer le chargement", "Au premier lancement, le fichier n'existe pas : on évite FileNotFoundError", "Pour ouvrir en écriture", "Pour compter les tâches"], a: 1, exp: "Toute application a un premier démarrage." },
    { type: "qcm", q: "Le menu utilise <code>while True</code> + <code>break</code> car…", opts: ["while est plus rapide ici", "On répète le menu jusqu'au choix « Quitter » (break)", "On connaît déjà le nombre de tours", "for ne gère pas les menus"], a: 1, exp: "Le motif « boucle jusqu'à sortie » (pas de do-while en Python)." },
    { type: "qcm", q: "Le try/except autour de <code>int(input(...))</code> gère…", opts: ["Une division par zéro", "Une saisie non numérique (ValueError) sans planter", "Un fichier introuvable", "Un mauvais format JSON"], a: 1, exp: "L'utilisateur peut taper « abc » : on l'attrape." },
    { type: "qcm", q: "<code>{t}</code> dans une f-string (t étant une Tache) affiche…", opts: ["L'adresse mémoire de l'objet", "Le résultat de __str__ (ex. « ⬜ Réviser »)", "Le nom de la classe", "Une erreur"], a: 1, exp: "f-string appelle __str__ automatiquement." },
    { type: "qcm", q: "Quand charge-t-on et sauve-t-on l'état ?", opts: ["À chaque touche", "charger AU DÉMARRAGE, sauver À LA SORTIE (après la boucle)", "Après chaque affichage", "Seulement à l'ajout"], a: 1, exp: "Le cycle disque → mémoire → disque." },
    { type: "qcm", q: "Ce projet console prépare le projet Django parce que…", opts: ["Django n'utilise pas d'objets", "Django gérera aussi des « tâches » (todo-liste) : mêmes concepts (objets, persistance, CRUD)", "Django est en Java", "Django n'a pas de persistance"], a: 1, exp: "La todo-liste sera justement le fil rouge du cours Django." },
    { type: "vf", q: "Ce projet réutilise classes, listes, compréhensions, JSON, boucles et exceptions.", a: true, exp: "Presque tout le cours collabore : c'est la révision incarnée." },

# 0 : ✅ Réviser
# 1 : ⬜ Coder
g.sauver("taches.json")     # persistance : écrit l'état en JSON

    reflexion: "Trois questions. D'abord : pourquoi la sauvegarde transforme-t-elle les médicaments en dictionnaires avant d'écrire, au lieu de confier les objets eux-mêmes au JSON ? Ensuite : le retrait vérifie l'indice avant d'y toucher, alors que la conversion de la saisie, elle, est protégée par un rattrapage d'exception. Deux problèmes voisins, deux traitements opposés — qu'est-ce qui les distingue ? Enfin : qu'est-ce qui serait perdu si l'on fondait les deux classes en une seule qui contiendrait à la fois les renseignements d'un médicament et la liste de tous les autres ?",
    indices: [
      "Quatre couches se superposent, et chacune ignore la suivante : ce qui représente un médicament, ce qui gère la collection, ce qui la fait persister, ce qui parle à l'utilisateur. Écris-les dans cet ordre et vérifie chacune avant d'attaquer la suivante — un menu bâti sur une collection non testée est indébogable.",
      "Le plan : la collection expose des opérations qui ne demandent jamais rien à l'utilisateur et n'affichent que ce qu'on lui demande d'afficher. La persistance traduit dans les deux sens entre les objets et des structures simples. Le menu, lui, ne fait que lire des saisies, les convertir, et appeler les opérations — il ne contient aucune logique d'inventaire.",
      "En pseudocode, pour la persistance : <code>sauver : données ← [un dictionnaire par médicament] ; sérialiser</code> · <code>charger : SI le fichier manque, ne rien faire ; SINON désérialiser puis reconstruire un objet par dictionnaire</code>. Pour le menu : <code>TANT QUE vrai : afficher les options ; lire ; SELON le choix appeler l'opération ; sur « quitter » ou saisie vide, sortir</code>.",
      "Le point dur est la traduction dans les deux sens. Le format JSON ne connaît que des nombres, des textes, des booléens, des listes et des associations : il ne sait rien de tes classes. À l'aller, chaque objet doit devenir une association de champs simples ; au retour, chaque association doit être repassée au constructeur. C'est cette symétrie qu'il faut réussir — une clé écrite à l'aller sous un nom et relue sous un autre passe la sauvegarde et se voit au rechargement, jamais avant.",

    stdin: ["1", "Paracetamol", "3", "1", "Ibuprofene", "2", "2", "3", "0", "2", "4"],
    solution: "# Armoire a pharmacie : entite, collection, persistance, menu\nimport os\nimport json\n\n\nclass Medicament:\n    def __init__(self, nom, quantite, ordonnance=False):\n        self.nom = nom\n        self.quantite = quantite\n        self.ordonnance = ordonnance\n\n    def __str__(self):\n        mention = \"sur ordonnance\" if self.ordonnance else \"delivrance libre\"\n        return f\"{self.nom} x{self.quantite} ({mention})\"\n\n\nclass Armoire:\n    def __init__(self):\n        self.medicaments = []\n\n    def ajouter(self, nom, quantite, ordonnance=False):\n        self.medicaments.append(Medicament(nom, quantite, ordonnance))\n\n    def lister(self):\n        if not self.medicaments:\n            print(\"(armoire vide)\")\n            return\n        for i, m in enumerate(self.medicaments):\n            print(f\"{i} : {m}\")\n\n    def retirer(self, i):\n        # garde-fou AVANT l'acces : un indice hors bornes n'est pas une anomalie,\n        # c'est une saisie ordinaire d'un utilisateur qui s'est trompe\n        if 0 <= i < len(self.medicaments):\n            del self.medicaments[i]\n        else:\n            print(\"Indice inconnu\")\n\n    def total_boites(self):\n        return sum(m.quantite for m in self.medicaments)\n\n    def sauver(self, fichier):\n        # le JSON ne connait pas mes classes : je traduis en structures simples\n        data = [{\"nom\": m.nom, \"quantite\": m.quantite, \"ordonnance\": m.ordonnance}\n                for m in self.medicaments]\n        with open(fichier, \"w\") as f:\n            json.dump(data, f)\n\n    def charger(self, fichier):\n        if not os.path.exists(fichier):   # premier lancement : rien a recharger\n            return\n        with open(fichier, \"r\") as f:\n            data = json.load(f)\n        # traduction retour, symetrique de l'aller : memes cles, meme ordre\n        self.medicaments = [Medicament(d[\"nom\"], d[\"quantite\"], d[\"ordonnance\"])\n                            for d in data]\n\n\nFICHIER = \"armoire.json\"\narmoire = Armoire()\narmoire.charger(FICHIER)\n\nwhile True:\n    print(\"1.Ajouter 2.Lister 3.Retirer 4.Quitter\")\n    choix = input(\"Choix : \")\n    if choix == \"1\":\n        nom = input(\"Nom : \")\n        try:\n            armoire.ajouter(nom, int(input(\"Quantite : \")))\n        except ValueError:\n            print(\"Quantite invalide\")\n    elif choix == \"2\":\n        armoire.lister()\n    elif choix == \"3\":\n        try:\n            armoire.retirer(int(input(\"Indice : \")))\n        except ValueError:\n            print(\"Indice invalide\")\n    elif choix == \"4\" or choix == \"\":\n        # \"\" : l'entree est epuisee. Sans ce cas, l'application alimentee par un\n        # fichier de commandes tournerait indefiniment sur une saisie vide.\n        break\n\narmoire.sauver(FICHIER)\nprint(f\"{len(armoire.medicaments)} reference(s), {armoire.total_boites()} boite(s)\")",
    reponses: [
      { ref: "Réflexion", texte: "<strong>La traduction en dictionnaires</strong> est nécessaire parce que le JSON est un format d'échange, pas un format Python : il connaît les nombres, les textes, les booléens, les listes et les associations, et rien d'autre. Il n'a aucune idée de ce qu'est ma classe <code>Medicament</code>, et il ne le peut pas — un fichier JSON doit rester lisible par un programme écrit dans un autre langage, qui ne dispose évidemment pas de ma classe. Traduire à l'écriture, reconstruire à la lecture, c'est le prix de cette portabilité, et c'est peu cher payé : la traduction tient en une ligne dans chaque sens. <strong>La différence entre le garde-fou et le rattrapage</strong> tient à ce que chacun protège. L'indice hors bornes est une <em>situation attendue</em> : l'utilisateur tape 7 dans une armoire qui n'a que trois cases, cela arrivera tous les jours, et le programme doit y répondre normalement — donc on teste avant, et on répond. La saisie non numérique est un <em>échec de conversion</em> : elle est signalée par Python lui-même, au moment où elle se produit, et je ne peux pas la prévoir sans essayer — tester à l'avance si un texte est convertible reviendrait à réécrire la conversion. On teste ce qu'on peut tester ; on rattrape ce qui ne se laisse constater qu'en échouant. <strong>Fondre les deux classes</strong> ferait perdre l'essentiel. Chaque médicament porterait alors la liste de tous les autres — donc autant de copies de l'inventaire que de références, sans qu'aucune ne soit la bonne. On ne saurait plus quel objet interroger pour connaître le total, ni lequel sauvegarder. Et le jour où l'officine gérerait aussi du matériel, il faudrait dupliquer toute la gestion de collection dans la nouvelle classe. Un objet représente une chose ; une collection en représente plusieurs. Les confondre, c'est perdre le droit de parler de l'une sans parler de l'autre." }

    pourquoi: "Les méthodes de l'armoire ne lisent aucune saisie : c'est le menu qui lit, convertit, et leur passe des valeurs déjà propres. Cela paraît un détour — <code>retirer</code> pourrait très bien demander l'indice elle-même — mais une méthode qui interroge le clavier est inutilisable ailleurs : impossible de la tester, impossible de l'appeler depuis une interface graphique, impossible de la réutiliser dans un traitement automatique. La frontière entre « ce qui calcule » et « ce qui dialogue » est ce qui rend la moitié basse du programme réutilisable.",

    reflexion: "Hier les groupes étaient des couples, aujourd'hui ce sont des objets, et le budget calcule exactement les mêmes chiffres. Qu'a-t-on gagné concrètement — cite deux choses qu'on ne pouvait pas faire hier — et qu'a-t-on payé pour cela ? Puis : la méthode de rechargement <em>remplace</em> la liste des groupes au lieu de l'étendre. Que se passerait-il si elle l'étendait, et à quel moment précis t'en apercevrais-tu ? Enfin : la moyenne d'un budget vide vaut zéro par convention. Est-ce mathématiquement correct, et pourquoi avoir choisi cette convention plutôt que de laisser la division échouer ?",

    indices: [
      "Reprends la structure d'hier et demande-toi, pour chacun de ses calculs, à qui il appartient désormais : au groupe, qui ne connaît que lui-même, ou au budget, qui connaît tout le monde. Un calcul qui a besoin de plusieurs groupes ne peut pas vivre dans la classe du groupe.",
      "Le plan : la classe du groupe se limite à trois attributs et à sa description. La classe du budget détient la liste et expose une opération par question de l'énoncé. Le programme principal, lui, ne fait que mettre en scène : il remplit, retire, sauvegarde, recharge ailleurs, et compare.",
      "En pseudocode : <code>CLASSE Budget</code> · <code>total : somme des cachets</code> · <code>moyenne : SI vide RETOURNER 0 SINON total / effectif</code> · <code>au_dessus : les groupes dont le cachet dépasse la moyenne</code> · <code>retirer(rang) : SI le rang est dans les bornes, supprimer</code> · <code>sauver / charger</code> symétriques.",
      "Le point dur de d) est de recharger dans un budget <em>neuf</em>. Recharger dans le budget courant ne prouverait rien : il contient déjà les bons groupes, et un rechargement qui ne ferait rien du tout passerait la vérification sans qu'on s'en aperçoive. C'est en repartant d'une collection vide que la comparaison des totaux devient une preuve.",

    ],
    solution: "# Budget du festival — jour 2 : les couples deviennent des objets\nimport os\nimport json\n\n\nclass Groupe:\n    def __init__(self, nom, cachet, style):\n        self.nom = nom\n        self.cachet = cachet\n        self.style = style\n\n    def __str__(self):\n        return f\"{self.nom} — {self.style} — {self.cachet} EUR\"\n\n\nclass Budget:\n    def __init__(self):\n        self.groupes = []\n\n    def ajouter(self, nom, cachet, style):\n        self.groupes.append(Groupe(nom, cachet, style))\n\n    def lister(self):\n        if not self.groupes:\n            print(\"(aucun groupe engage)\")\n            return\n        for i, g in enumerate(self.groupes):\n            print(f\"{i} : {g}\")\n\n    def total(self):\n        return sum(g.cachet for g in self.groupes)\n\n    def moyenne(self):\n        # convention assumee : un budget vide a une moyenne de 0, il n'echoue pas\n        if not self.groupes:\n            return 0\n        return self.total() / len(self.groupes)\n\n    def au_dessus_de_la_moyenne(self):\n        m = self.moyenne()\n        return [g for g in self.groupes if g.cachet > m]\n\n    def retirer(self, rang):\n        if 0 <= rang < len(self.groupes):\n            del self.groupes[rang]\n        else:\n            print(\"Rang inconnu\")\n\n    def sauver(self, fichier):\n        data = [{\"nom\": g.nom, \"cachet\": g.cachet, \"style\": g.style}\n                for g in self.groupes]\n        with open(fichier, \"w\") as f:\n            json.dump(data, f)\n\n    def charger(self, fichier):\n        if not os.path.exists(fichier):\n            return\n        with open(fichier, \"r\") as f:\n            data = json.load(f)\n        # REMPLACE : le fichier decrit l'etat complet, pas un supplement\n        self.groupes = [Groupe(d[\"nom\"], d[\"cachet\"], d[\"style\"]) for d in data]\n\n\nFICHIER = \"festival.json\"\nENGAGEMENTS = [\n    (\"Les Alizes\", 3200, \"chanson\"),\n    (\"Cinabre\", 5400, \"rock\"),\n    (\"Maree Basse\", 2100, \"folk\"),\n    (\"Otarie\", 8600, \"electro\"),\n    (\"Vent d'Est\", 4300, \"jazz\"),\n]\n\nbudget = Budget()\nprint(f\"moyenne a l'ouverture : {budget.moyenne()}\")   # budget vide : 0, pas d'echec\nfor nom, cachet, style in ENGAGEMENTS:\n    budget.ajouter(nom, cachet, style)\nbudget.lister()\n\nprint(f\"total : {budget.total()} EUR\")\nprint(f\"moyenne : {budget.moyenne()} EUR\")\nfor g in budget.au_dessus_de_la_moyenne():\n    print(f\"au-dessus de la moyenne : {g.nom}\")\n\nbudget.retirer(2)                 # Maree Basse, le moins cher, est au rang 2\nbudget.sauver(FICHIER)\n\n# d) on recharge dans un budget NEUF : c'est la seule preuve qui vaille\nautre = Budget()\nautre.charger(FICHIER)\nprint(f\"total sauvegarde : {budget.total()} EUR\")\nprint(f\"total recharge   : {autre.total()} EUR\")",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Ce qu'on a gagné.</strong> D'abord, les données ont des <em>noms</em> : hier il fallait savoir que le cachet était « le deuxième élément du couple », et cette convention vivait dans ma tête plutôt que dans le code — aujourd'hui <code>g.cachet</code> se relit sans effort et le style a pu être ajouté sans casser une seule ligne existante, alors qu'en couples, passer de deux à trois éléments aurait cassé tous les déballages du programme. Ensuite, les opérations sont <em>attachées</em> aux données : la moyenne n'est plus un calcul flottant quelque part dans le programme principal, elle est une chose que le budget sait faire, et le rechargement dans un budget neuf en hérite gratuitement. <strong>Ce qu'on a payé :</strong> une trentaine de lignes de plus, une indirection supplémentaire à lire, et l'obligation de traduire dans les deux sens pour la persistance — un couple, le JSON l'écrit tel quel ; un objet, non. Sur un programme de dix lignes, ce prix ne se justifie pas ; à partir du moment où l'on sauvegarde, recharge et fait évoluer, il est déjà remboursé. <strong>Si le rechargement étendait</strong> la liste au lieu de la remplacer, le budget contiendrait après chargement les groupes qu'il avait déjà <em>plus</em> ceux du fichier. Dans mon programme de démonstration, le budget neuf est vide et l'anomalie ne se verrait pas du tout : les totaux coïncideraient, le test passerait. Elle se révélerait le jour où l'application recharge un budget déjà rempli — au deuxième appel de chargement, typiquement quand on ajoute un bouton « recharger » — et le total aurait alors doublé sans qu'aucune erreur ne soit signalée. C'est exactement la faute que la mini-série a déjà rencontrée avec les modes d'ouverture de fichier : ajouter là où il fallait remplacer ne provoque jamais d'erreur, seulement des chiffres faux. <strong>La moyenne de zéro</strong> n'est pas mathématiquement correcte : la moyenne d'un ensemble vide n'existe pas, elle n'est pas nulle. C'est une convention d'affichage, et je l'assume comme telle parce que l'alternative est pire ici : laisser la division échouer ferait planter l'application à l'ouverture d'un festival dont on n'a encore engagé personne, c'est-à-dire dans son cas d'usage le plus normal. La bonne pratique, si ce budget devenait une bibliothèque utilisée par d'autres, serait de renvoyer « pas de valeur » plutôt que zéro — pour que l'appelant distingue « moyenne nulle » de « pas de moyenne », deux choses que le zéro confond." }
