var DAY = {
  num: 20,
  title: "Projet guidé : le gestionnaire de tâches",
  subtitle: "Assembler toutes les briques du cours.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>gestionnaire de tâches</strong> en console : ajouter une tâche, lister les tâches, marquer comme faite, supprimer, sauvegarder en JSON, quitter. On applique la méthode éprouvée : comprendre → découper → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours (et prépare le projet Django !).</p>

<h3>2. Le découpage</h3>
<pre class="pseudo">Classe Tache      : texte, faite (bool)  + __str__          # représente UNE tâche
Classe Gestionnaire : la liste des tâches + les opérations   # gère la COLLECTION de tâches
Le programme      : le menu (boucle + choix) + la persistance JSON   # relie le tout et parle à l'utilisateur</pre>
<p>Chaque partie a un rôle unique : plus clair et plus facile à tester que tout mettre en vrac.</p>

<h3>3. La classe Tache (leçons 12-13)</h3>
<pre class="pseudo">class Tache:                           # déclare la classe représentant une seule tâche
    def __init__(self, texte, faite=False):   # constructeur ; « faite » vaut False par défaut
        self.texte = texte                 # attribut : le libellé de la tâche
        self.faite = faite                 # attribut : True/False ; une tâche naît « à faire »

    def __str__(self):                     # définit l'affichage texte de la tâche
        coche = "✅" if self.faite else "⬜"   # ternaire : coche pleine si faite, vide sinon
        return f"{coche} {self.texte}"     # renvoie « coche + libellé »</pre>

<h3>4. La classe Gestionnaire (leçons 7-16-17)</h3>
<pre class="pseudo">import json                            # module pour sauvegarder/charger en JSON

class Gestionnaire:                    # déclare la classe qui gère la collection de tâches
    def __init__(self):                # constructeur
        self.taches = []                   # attribut : la liste (vide au départ) d'objets Tache

    def ajouter(self, texte):          # ajoute une tâche à partir de son libellé
        self.taches.append(Tache(texte))   # crée un objet Tache et l'ajoute à la liste

    def lister(self):                  # affiche toutes les tâches
        if not self.taches:                # cas limite : liste vide (une liste vide est falsy)…
            print("(aucune tâche)")        # …message et…
            return                         # …on quitte la méthode tout de suite
        for i, t in enumerate(self.taches):   # sinon : enumerate donne l'indice i ET la tâche t
            print(f"{i} : {t}")               # affiche l'indice et la tâche ({t} déclenche __str__)

    def marquer_faite(self, i):        # marque la tâche d'indice i comme faite
        if 0 &lt;= i &lt; len(self.taches):       # on vérifie que l'indice est valide AVANT (anti-débordement)
            self.taches[i].faite = True    # passe l'attribut faite de cette tâche à True

    def supprimer(self, i):            # supprime la tâche d'indice i
        if 0 &lt;= i &lt; len(self.taches):       # même garde-fou sur l'indice
            del self.taches[i]             # retire l'élément de la liste

    def sauver(self, fichier):         # écrit la liste des tâches dans un fichier JSON
        data = [{"texte": t.texte, "fait": t.faite} for t in self.taches]  # objets Tache → dicts (compréhension)
        with open(fichier, "w") as f:      # ouvre le fichier en écriture
            json.dump(data, f)             # sérialise la liste de dicts en JSON

    def charger(self, fichier):        # recharge les tâches depuis un fichier JSON
        import os                          # module pour tester l'existence du fichier
        if os.path.exists(fichier):        # cas limite : au premier lancement, le fichier n'existe pas
            with open(fichier, "r") as f:  # s'il existe, on l'ouvre en lecture
                data = json.load(f)        # désérialise le JSON → liste de dicts
                self.taches = [Tache(d["texte"], d["fait"]) for d in data]  # dicts → objets Tache</pre>

<h3>5. Le menu (leçons 4-5-6-16)</h3>
<pre class="pseudo">g = Gestionnaire()                     # crée le gestionnaire
g.charger("taches.json")                   # au démarrage : recharge l'état sauvegardé précédemment

while True:                                # boucle du menu : tourne jusqu'au choix « Quitter »
    print("1.Ajouter 2.Lister 3.Faite 4.Supprimer 5.Quitter")   # affiche les options
    choix = input("Choix : ")              # lit le choix de l'utilisateur (une chaîne)
    if choix == "1":                       # option 1 : ajouter…
        g.ajouter(input("Texte : "))       # …lit un libellé et l'ajoute
    elif choix == "2":                     # option 2 : lister…
        g.lister()                         # …affiche toutes les tâches
    elif choix == "3":                     # option 3 : marquer faite…
        try:                               # on surveille la conversion de l'indice
            g.marquer_faite(int(input("Indice : ")))   # lit un indice, le convertit, marque la tâche
        except ValueError:                 # si la saisie n'est pas un nombre…
            print("Indice invalide")       # …message d'erreur
    elif choix == "4":                     # option 4 : supprimer…
        try:                               # même surveillance
            g.supprimer(int(input("Indice : ")))       # lit un indice et supprime la tâche
        except ValueError:                 # saisie non numérique…
            print("Indice invalide")       # …message d'erreur
    elif choix == "5":                     # option 5 : quitter…
        break                              # …on sort de la boucle while

g.sauver("taches.json")                    # à la sortie : sauvegarde l'état sur le disque</pre>
<div class="tip">Repère la carte du cours : classes + __init__ + __str__ (12-13), liste d'objets et enumerate (7-10), compréhensions pour convertir objets ⇄ dicts (10-18), JSON + with + os.path.exists (17), boucle while + input + try/except (4-6-16). Le projet EST la révision : chaque brique, vue isolément, collabore ici.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi séparer Tache et Gestionnaire en deux classes ?", opts: ["Pour faire long", "Une responsabilité par classe : Tache = une tâche, Gestionnaire = la collection — plus clair et testable", "Python l'exige", "Pour les imports"], a: 1, exp: "Le découpage en responsabilités distinctes." },
    { type: "qcm", q: "Pourquoi <code>faite=False</code> par défaut dans __init__ ?", opts: ["Au hasard", "Une tâche neuve est forcément « à faire » : l'objet naît cohérent", "False est plus rapide", "Pour __str__"], a: 1, exp: "L'état initial cohérent, garanti à la création." },
    { type: "qcm", q: "<code>if not self.taches:</code> teste…", opts: ["Une erreur", "Si la liste est VIDE (une liste vide est falsy)", "Le premier élément", "La taille exacte"], a: 1, exp: "not [] vaut True : le cas limite « aucune tâche »." },
    { type: "qcm", q: "<code>enumerate(self.taches)</code> fournit…", opts: ["Les tâches seules", "L'indice ET la tâche à chaque tour", "La taille", "Un tri"], a: 1, exp: "for i, t in enumerate(...) : position + valeur." },
    { type: "qcm", q: "<code>if 0 &lt;= i &lt; len(self.taches):</code> sert à…", opts: ["Trier", "Vérifier que l'indice est valide AVANT d'y accéder (anti-IndexError)", "Compter", "Rien"], a: 1, exp: "L'encadrement protège contre les indices hors limites." },
    { type: "qcm", q: "La compréhension <code>[{\"texte\": t.texte, \"fait\": t.faite} for t in self.taches]</code> convertit…", opts: ["Des dicts en objets", "Les OBJETS Tache en dictionnaires (pour le JSON)", "Rien", "Une liste en chaîne"], a: 1, exp: "json.dump a besoin de structures simples : on transforme les objets en dicts." },
    { type: "qcm", q: "<code>json.load</code> puis <code>[Tache(d[\"texte\"], d[\"fait\"]) for d in data]</code> fait…", opts: ["Sauvegarde", "Reconstruit des OBJETS Tache à partir des dicts chargés", "Trie", "Supprime"], a: 1, exp: "L'inverse : dicts du JSON → objets Tache." },
    { type: "qcm", q: "Pourquoi <code>os.path.exists</code> dans charger() ?", opts: ["Beauté", "Au premier lancement, le fichier n'existe pas : on évite FileNotFoundError", "Vitesse", "Inutile"], a: 1, exp: "Toute application a un premier démarrage." },
    { type: "qcm", q: "Le menu utilise <code>while True</code> + <code>break</code> car…", opts: ["while est interdit", "On répète le menu jusqu'au choix « Quitter » (break)", "C'est plus court", "for ne marche pas"], a: 1, exp: "Le motif « boucle jusqu'à sortie » (pas de do-while en Python)." },
    { type: "qcm", q: "Le try/except autour de <code>int(input(...))</code> gère…", opts: ["Le tri", "Une saisie non numérique (ValueError) sans planter", "Le fichier", "Le JSON"], a: 1, exp: "L'utilisateur peut taper « abc » : on l'attrape." },
    { type: "qcm", q: "<code>{t}</code> dans une f-string (t étant une Tache) affiche…", opts: ["L'adresse", "Le résultat de __str__ (ex. « ⬜ Réviser »)", "None", "Une erreur"], a: 1, exp: "f-string appelle __str__ automatiquement." },
    { type: "qcm", q: "Quand charge-t-on et sauve-t-on l'état ?", opts: ["À chaque touche", "charger AU DÉMARRAGE, sauver À LA SORTIE (après la boucle)", "Jamais", "Seulement à l'ajout"], a: 1, exp: "Le cycle disque → mémoire → disque." },
    { type: "qcm", q: "Ce projet console prépare le projet Django parce que…", opts: ["Aucun rapport", "Django gérera aussi des « tâches » (todo-liste) : mêmes concepts (objets, persistance, CRUD)", "Django est en Java", "C'est un hasard"], a: 1, exp: "La todo-liste sera justement le fil rouge du cours Django." },
    { type: "vf", q: "Ce projet réutilise classes, listes, compréhensions, JSON, boucles et exceptions.", a: true, exp: "Presque tout le cours collabore : c'est la révision incarnée." },
    { type: "qcm", q: "Marquer la tâche d'indice 10 alors qu'il n'y en a que 3 :", opts: ["Plante avec IndexError", "Ne fait rien : la garde 0 <= i < len(...) empêche l'accès", "Ajoute une tâche", "Supprime tout"], a: 1, exp: "L'encadrement protège : rien ne se passe si l'indice est invalide." }
  ],
  final: {
    title: "Exercice final — Comprendre l'assemblage",
    intro: `<p>On trace l'exécution du gestionnaire :</p>
<pre class="pseudo">g = Gestionnaire()          # crée le gestionnaire (liste de tâches vide)
g.ajouter("Réviser")        # ajoute une 1re tâche
g.ajouter("Coder")          # ajoute une 2e tâche
g.marquer_faite(0)          # marque la tâche d'indice 0 comme faite
g.lister()                  # affiche toutes les tâches avec leur indice</pre>`,
    questions: [
      { type: "input", q: "Combien de tâches contient <code>g.taches</code> après les deux ajouter ?", a: "2", ph: "nombre", exp: "Deux append : « Réviser » et « Coder »." },
      { type: "qcm", q: "Après <code>g.marquer_faite(0)</code>, quelle tâche est cochée ?", opts: ["Aucune", "« Réviser » (indice 0)", "« Coder »", "Les deux"], a: 1, exp: "L'indice 0 = la première tâche ajoutée." },
      { type: "qcm", q: "Qu'affiche <code>g.lister()</code> pour la tâche 0 ?", opts: ["⬜ Réviser", "✅ Réviser : elle est marquée faite", "Réviser", "0"], a: 1, exp: "faite=True → la coche ✅ via __str__." },
      { type: "qcm", q: "Pour rendre l'état persistant entre deux exécutions, il faut…", opts: ["Rien", "Appeler g.sauver(...) à la fin et g.charger(...) au début", "Un cookie", "Une base"], a: 1, exp: "JSON : sauver à la sortie, charger au démarrage." },
      { type: "vf", q: "Sans g.sauver(), les tâches seraient perdues à la fermeture du programme.", a: true, exp: "La mémoire s'efface ; seul le fichier JSON fait persister l'état." }
    ],
    solution: `<pre class="pseudo">g = Gestionnaire()          # crée le gestionnaire
g.ajouter("Réviser")        # taches = [⬜ Réviser]
g.ajouter("Coder")          # taches = [⬜ Réviser, ⬜ Coder]
g.marquer_faite(0)          # taches = [✅ Réviser, ⬜ Coder]
g.lister()                  # affiche la liste :
# 0 : ✅ Réviser
# 1 : ⬜ Coder
g.sauver("taches.json")     # persistance : écrit l'état en JSON

# Carte du cours : classes (12-13), listes/enumerate (7-10),
# compréhensions (10-18), JSON/fichiers (17), boucle/input/except (4-6-16).</pre>
<p>Un vrai programme, tout en Python de base. Demain : l'examen final. Et ensuite, Django reprendra ces idées côté web !</p>`
  }
};
</script>
