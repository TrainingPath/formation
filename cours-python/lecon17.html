  theory: `
<h3>1. Pourquoi des fichiers ?</h3>
<p>À la fin du programme, la mémoire est libérée : toutes tes variables et listes disparaissent. Pour que les données <strong>persistent</strong> (scores, tâches, configuration), on les écrit dans un <strong>fichier</strong> sur le disque dur. Lire un fichier, c'est l'opération inverse : recharger en mémoire ce qui avait été sauvegardé.</p>

<h3>2. Ouvrir un fichier : open() et with</h3>
<pre class="pseudo">with open("notes.txt", "w") as f:      # ouvre "notes.txt" en écriture ("w") ; f est le fichier ouvert
    f.write("Ana;14\\n")                # écrit une ligne dans le fichier (le \\n = saut de ligne)
    f.write("Bob;9\\n")                 # écrit une deuxième ligne
# à la sortie du bloc « with », le fichier est FERMÉ automatiquement</pre>
<div class="tip">Le mot-clé <code>with</code> est la façon recommandée d'ouvrir un fichier : il garantit que le fichier sera <strong>fermé</strong> à la fin du bloc, même en cas d'erreur. Sans <code>with</code>, il faudrait penser à appeler <code>f.close()</code> soi-même — et l'oubli laisse des données non écrites.</div>

<h3>3. Les modes d'ouverture</h3>
<pre class="pseudo">open("f.txt", "r")     # "r" = READ (lecture) — le mode par défaut
open("f.txt", "w")     # "w" = WRITE (écriture) — ÉCRASE tout le contenu existant !
open("f.txt", "a")     # "a" = APPEND (ajout) — ajoute à la fin sans rien effacer</pre>
<div class="warn">Piège : le mode <code>"w"</code> ÉCRASE le fichier existant (comme une réaffectation de variable). Pour compléter un fichier (un journal), utilise le mode <code>"a"</code> (append).</div>

<h3>4. Lire un fichier</h3>
<pre class="pseudo">with open("notes.txt", "r") as f:      # ouvre le fichier en lecture ("r")
    contenu = f.read()                 # read() lit TOUT le fichier dans une seule chaîne

with open("notes.txt", "r") as f:      # on rouvre en lecture
    for ligne in f:                    # parcourt le fichier LIGNE PAR LIGNE (efficace, sans tout charger)
        print(ligne.strip())           # strip() enlève le \\n de fin de chaque ligne

with open("notes.txt", "r") as f:      # on rouvre encore en lecture
    lignes = f.readlines()             # readlines() renvoie une LISTE de toutes les lignes</pre>
<p>Le parcours <code>for ligne in f</code> est le plus courant : il lit le fichier ligne par ligne sans tout charger en mémoire d'un coup. C'est l'équivalent Python du StreamReader (C#), BufferedReader (Java) ou fgets (PHP).</p>

<h3>5. Découper un CSV et gérer l'absence du fichier</h3>
<pre class="pseudo">import os                             # module pour interroger le système de fichiers

if os.path.exists("classe.txt"):      # le fichier existe-t-il ? (au 1er lancement : non)
    with open("classe.txt", "r") as f:  # s'il existe, on l'ouvre en lecture
        for ligne in f:                 # pour chaque ligne du fichier…
            nom, note = ligne.strip().split(";")   # nettoie puis découpe « Ana;14 » → nom="Ana", note="14"
            print(f"{nom} a eu {int(note)}")       # int(note) convertit le texte "14" en nombre
else:                                 # sinon (le fichier n'existe pas encore)…
    print("Fichier introuvable, on démarre à vide")   # …message et démarrage à vide</pre>

<h3>6. Le JSON : sauvegarder des structures entières</h3>
<pre class="pseudo">import json                           # module pour lire/écrire du JSON

taches = [{"texte": "Réviser", "fait": False}, {"texte": "Coder", "fait": True}]   # une structure Python

with open("taches.json", "w") as f:   # ouvre le fichier en écriture
    json.dump(taches, f)               # SÉRIALISE la structure Python en texte JSON dans le fichier

with open("taches.json", "r") as f:   # rouvre en lecture
    restaurees = json.load(f)          # DÉSÉRIALISE le JSON → structure Python (liste de dictionnaires)</pre>
<div class="tip">Énorme atout de Python : <code>json.dump</code> / <code>json.load</code> transforment une structure entière (listes, dictionnaires imbriqués) en JSON et inversement, en une ligne. Le cycle sauvegarder/charger d'une application tient en quelques lignes — on l'utilisera pour le projet de la leçon 20 et partout dans Django.</div>`,

    solution: "# Bulletin de la classe : constitution, relecture, resume JSON\nimport os\nimport json\n\nCLASSE = \"classe.txt\"\nDEPART = [(\"Ana\", 14), (\"Bob\", 9), (\"Zoe\", 16), (\"Max\", 11), (\"Lou\", 7)]\n\n# a) on ne fabrique la source QUE si elle manque : sinon on ecraserait les\n#    corrections du professeur, et l'application perdrait des donnees en silence\nif not os.path.exists(CLASSE):\n    with open(CLASSE, \"w\") as f:\n        for nom, note in DEPART:\n            f.write(f\"{nom};{note}\\n\")\n\n# b) tout ce qui sort d'un fichier texte est du TEXTE : on convertit ici,\n#    une fois pour toutes, et plus jamais ensuite\neleves = []\nwith open(CLASSE, \"r\") as f:\n    for ligne in f:\n        nom, note = ligne.strip().split(\";\")\n        eleves.append((nom, int(note)))\n\nsomme = sum(note for nom, note in eleves)\nmoyenne = round(somme / len(eleves), 1)\nadmis = [nom for nom, note in eleves if note >= 10]\n\nprint(f\"Moyenne de la classe : {moyenne}\")\nprint(f\"{len(admis)} eleve(s) ont la moyenne\")\n\n# c) le JSON conserve la STRUCTURE et les TYPES : la liste revient une liste,\n#    la moyenne revient un nombre. Le format a points-virgules, lui, ne rend\n#    que des caracteres qu'il faudrait reconvertir a la main.\nresume = {\"moyenne\": moyenne, \"effectif\": len(eleves), \"admis\": admis}\nwith open(\"bulletin.json\", \"w\") as f:\n    json.dump(resume, f)\n\nwith open(\"bulletin.json\", \"r\") as f:\n    relu = json.load(f)\n\nprint(f\"Effectif relu : {relu['effectif']}\")",
    reponses: [
      { ref: "Réflexion", texte: "Le test préalable devient faux dès que quelque chose peut se produire <strong>entre</strong> la question et l'ouverture. Le système répond « oui, il existe », et dans l'intervalle — quelques microsecondes — un autre programme, une sauvegarde automatique ou l'utilisateur lui-même supprime ou renomme le fichier. Ton ouverture échoue alors sur un fichier que tu venais pourtant de constater présent, et comme tu avais « vérifié », tu n'as prévu aucun rattrapage : le programme s'arrête. La version qui ouvre et rattrape ne souffre pas de ce trou, parce qu'elle ne se fie à aucune information périmée : elle constate l'échec au moment exact où il se produit. C'est une règle générale bien au-delà des fichiers — demander l'autorisation puis agir n'est jamais équivalent à agir puis assumer l'échec, dès que le monde peut changer entre les deux. Sur le second point : <code>classe.txt</code> ne contient que des couples plats, et le format à points-virgules lui suffit. Le résumé, lui, contient une valeur décimale, un entier et <em>une liste</em> de longueur variable. Pour l'écrire à points-virgules, il faudrait inventer un séparateur de second niveau pour la liste, puis écrire le code qui le défait, puis reconvertir chaque champ dans son type — soit reconstruire à la main ce que <code>json.load</code> fait en une ligne, et se tromper en chemin. Le format texte plat convient aux données plates ; dès qu'il y a imbrication ou plusieurs types, le JSON n'est pas un luxe, c'est ce qui empêche d'écrire un analyseur maison." }

  { num: "17.3", titre: "Le journal d'observation — 3 / 4", niveau: 3, domaine: "astronomie",

    hier: "lecon16.html",
    enonce: "Reprends le journal d'hier : il sait lire un catalogue brut, écarter les lignes abîmées et compter ses rejets — mais tout ce travail s'évapore à la fin du programme. Aujourd'hui il apprend le disque. Après le tri du catalogue, il enregistre les objets retenus dans <code>journal.txt</code>, une ligne par objet, et il sait relire ce fichier pour repartir d'une séance précédente, y compris le tout premier soir où il n'existe pas encore. Il conserve enfin dans <code>journal.json</code> un résumé complet de la séance — les objets retenus et le nombre de rejets — que l'on doit pouvoir recharger tel quel.",
    sousQuestions: [
      { ref: "a", texte: "Écris <code>enregistrer(objets, fichier)</code> : chaque objet, un couple nom-magnitude, s'inscrit sur sa propre ligne au format <code>nom;magnitude</code>. Le fichier décrit l'état de la séance et non son historique : il est réécrit entièrement à chaque fois." },

    reflexion: "L'énoncé impose ici le mode qui réécrit tout, alors que le carnet de pêche du premier exercice exigeait celui qui complète. Qu'est-ce qui distingue les deux situations, et qu'obtiendrait-on en échangeant les deux modes ? Puis, plus subtil : après un aller-retour par <code>journal.txt</code>, les magnitudes sont de nouveau des nombres — mais c'est <code>lire_ligne</code> qui a fait tout le travail. Après un aller-retour par <code>journal.json</code>, tu n'as rien écrit pour les reconstruire et elles sont pourtant numériques. D'où vient la différence, et qu'est-ce que le JSON n'a malgré tout <em>pas</em> su restituer à l'identique ?",

    ],
    solution: "# Journal d'observation — jour 3 : la seance survit a la fin du programme\nimport os\nimport json\n\nBRUT = [\"M31;3.4\", \"M42;4.0\", \"M13;abc\", \"M51;8.4\", \"NGC7000\", \"M57;8.8\", \"M104;\"]\n\ndef lire_ligne(ligne):\n    # inchangee depuis hier : elle CONSTATE, elle ne decide pas\n    champs = ligne.split(\";\")\n    if len(champs) != 2:\n        raise ValueError(\"format attendu nom;magnitude\")\n    return champs[0], float(champs[1])\n\ndef enregistrer(objets, fichier):\n    # \"w\" : ce fichier decrit l'ETAT de la seance. En mode \"a\", chaque soiree\n    # reempilerait les memes objets et le journal doublerait de taille.\n    with open(fichier, \"w\") as f:\n        for nom, magnitude in objets:\n            f.write(f\"{nom};{magnitude}\\n\")\n\ndef charger(fichier):\n    # le premier soir, le fichier n'existe pas : ce n'est pas une anomalie\n    if not os.path.exists(fichier):\n        return []\n    objets = []\n    with open(fichier, \"r\") as f:\n        for ligne in f:\n            # strip() AVANT lire_ligne : la fonction n'a pas a savoir que la\n            # ligne vient d'un fichier et traine un \\n\n            objets.append(lire_ligne(ligne.strip()))\n    return objets\n\nobjets = []\nrejets = 0\nfor ligne in BRUT:\n    try:\n        objets.append(lire_ligne(ligne))\n    except ValueError as e:\n        rejets = rejets + 1\n        print(f\"ligne rejetee : {ligne!r} — {e}\")\n\nenregistrer(objets, \"journal.txt\")\nrelus = charger(\"journal.txt\")\nprint(f\"{len(relus)} objet(s) relus du journal\")\n\nresume = {\"objets\": objets, \"rejets\": rejets}\nwith open(\"journal.json\", \"w\") as f:\n    json.dump(resume, f)\n\nwith open(\"journal.json\", \"r\") as f:\n    memoire = json.load(f)\n\nprint(f\"{len(memoire['objets'])} objet(s), {memoire['rejets']} rejet(s) en memoire\")\nprint(charger(\"catalogue-jamais-ecrit.txt\"))",
    reponses: [
      { ref: "Réflexion", texte: "La distinction tient à ce que le fichier <em>représente</em>. Le carnet de pêche est un <strong>historique</strong> : chaque prise s'ajoute aux précédentes et rien ne doit disparaître, donc on complète. Le journal d'observation est un <strong>état</strong> : il dit quels objets sont retenus <em>maintenant</em>, et la séance suivante remplace la précédente, donc on réécrit. Échanger les deux modes donne deux catastrophes symétriques et également silencieuses : le carnet en mode écrasement ne contiendrait plus qu'une seule prise, celle du jour, et le pêcheur ne s'en apercevrait qu'en cherchant un souvenir de l'an dernier ; le journal en mode ajout accumulerait les mêmes objets soir après soir, et son décompte gonflerait sans que rien ne signale la duplication. Ni l'un ni l'autre ne provoque d'erreur : c'est exactement ce qui les rend dangereux. Sur la seconde question : un fichier texte ne contient que des <strong>caractères</strong>. La magnitude 3.4 y devient trois signes, et c'est <code>float</code>, appelé dans <code>lire_ligne</code>, qui la retransforme en nombre — sans cet appel écrit à la main, tu récupérerais du texte et les additions donneraient n'importe quoi. Le JSON, lui, note le <strong>type</strong> en même temps que la valeur : un nombre y est écrit comme un nombre, une chaîne entre guillemets, et <code>json.load</code> reconstruit chacun dans son type sans que tu aies rien à dire. Ce qu'il n'a pas su restituer, en revanche, ce sont les couples : le JSON ne connaît pas les tuples, il ne connaît que les tableaux. Mes objets sont repartis en tuples et sont revenus en listes. Sans conséquence ici, parce que je ne fais que les compter — mais fatal le jour où j'en ferais des clés de dictionnaire, ce qu'une liste ne peut pas être." }
