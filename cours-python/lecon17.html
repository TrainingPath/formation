  title: "Lire et écrire des fichiers",
  subtitle: "Faire survivre les données à la fin du programme.",
  theory: `
<h3>1. Pourquoi des fichiers ?</h3>
<p>À la fin du programme, la mémoire est libérée : toutes tes variables et listes disparaissent. Pour que les données <strong>persistent</strong> (scores, tâches, configuration), on les écrit dans un <strong>fichier</strong> sur le disque dur. Lire un fichier, c'est l'opération inverse : recharger en mémoire ce qui avait été sauvegardé.</p>

<h3>2. Ouvrir un fichier : open() et with</h3>
<pre class="pseudo">with open("notes.txt", "w") as f:      # ouvre "notes.txt" en écriture ("w") ; f est le fichier ouvert
    f.write("Ana;14\\n")                # écrit une ligne dans le fichier (le \\n = saut de ligne)
    f.write("Bob;9\\n")                 # écrit une deuxième ligne
# à la sortie du bloc « with », le fichier est FERMÉ automatiquement</pre>
<div class="tip">Le mot-clé <code>with</code> est la façon recommandée d'ouvrir un fichier : il garantit que le fichier sera <strong>fermé</strong> à la fin du bloc, même en cas d'erreur. Sans <code>with</code>, il faudrait penser à appeler <code>f.close()</code> soi-même — et l'oubli laisse des données non écrites.</div>

<h3>3. Les modes d'ouverture</h3>
<pre class="pseudo">open("f.txt", "r")     # "r" = READ (lecture) — le mode par défaut
open("f.txt", "w")     # "w" = WRITE (écriture) — ÉCRASE tout le contenu existant !
open("f.txt", "a")     # "a" = APPEND (ajout) — ajoute à la fin sans rien effacer</pre>
<div class="warn">Piège : le mode <code>"w"</code> ÉCRASE le fichier existant (comme une réaffectation de variable). Pour compléter un fichier (un journal), utilise le mode <code>"a"</code> (append).</div>

<h3>4. Lire un fichier</h3>
<pre class="pseudo">with open("notes.txt", "r") as f:      # ouvre le fichier en lecture ("r")
    contenu = f.read()                 # read() lit TOUT le fichier dans une seule chaîne

with open("notes.txt", "r") as f:      # on rouvre en lecture
    for ligne in f:                    # parcourt le fichier LIGNE PAR LIGNE (efficace, sans tout charger)
        print(ligne.strip())           # strip() enlève le \\n de fin de chaque ligne

with open("notes.txt", "r") as f:      # on rouvre encore en lecture
    lignes = f.readlines()             # readlines() renvoie une LISTE de toutes les lignes</pre>
<p>Le parcours <code>for ligne in f</code> est le plus courant : il lit le fichier ligne par ligne sans tout charger en mémoire d'un coup. C'est l'équivalent Python du StreamReader (C#), BufferedReader (Java) ou fgets (PHP).</p>

<h3>5. Découper un CSV et gérer l'absence du fichier</h3>
<pre class="pseudo">import os                             # module pour interroger le système de fichiers

if os.path.exists("classe.txt"):      # le fichier existe-t-il ? (au 1er lancement : non)
    with open("classe.txt", "r") as f:  # s'il existe, on l'ouvre en lecture
        for ligne in f:                 # pour chaque ligne du fichier…
            nom, note = ligne.strip().split(";")   # nettoie puis découpe « Ana;14 » → nom="Ana", note="14"
            print(f"{nom} a eu {int(note)}")       # int(note) convertit le texte "14" en nombre
else:                                 # sinon (le fichier n'existe pas encore)…
    print("Fichier introuvable, on démarre à vide")   # …message et démarrage à vide</pre>

<h3>6. Le JSON : sauvegarder des structures entières</h3>
<pre class="pseudo">import json                           # module pour lire/écrire du JSON

taches = [{"texte": "Réviser", "fait": False}, {"texte": "Coder", "fait": True}]   # une structure Python

with open("taches.json", "w") as f:   # ouvre le fichier en écriture
    json.dump(taches, f)               # SÉRIALISE la structure Python en texte JSON dans le fichier

with open("taches.json", "r") as f:   # rouvre en lecture
    restaurees = json.load(f)          # DÉSÉRIALISE le JSON → structure Python (liste de dictionnaires)</pre>
<div class="tip">Énorme atout de Python : <code>json.dump</code> / <code>json.load</code> transforment une structure entière (listes, dictionnaires imbriqués) en JSON et inversement, en une ligne. Le cycle sauvegarder/charger d'une application tient en quelques lignes — on l'utilisera pour le projet de la leçon 20 et partout dans Django.</div>`,

    { type: "qcm", q: "Ouvrir un fichier inexistant en mode \"r\" lève…", opts: ["Rien (créé)", "FileNotFoundError", "ValueError", "KeyError"], a: 1, exp: "En lecture, le fichier doit exister (d'où os.path.exists)." },
    { type: "qcm", q: "L'équivalent Python du StreamReader/BufferedReader/fgets, pour lire ligne à ligne :", opts: ["f.read()", "for ligne in f: (ou f.readline())", "json.load", "open seul"], a: 1, exp: "Le parcours ligne par ligne du fichier ouvert." },
    { type: "vf", q: "Avec <code>with open(...)</code>, il n'est pas nécessaire d'appeler f.close().", a: true, exp: "with ferme le fichier automatiquement à la sortie du bloc." },

# Version JSON pour une structure :
