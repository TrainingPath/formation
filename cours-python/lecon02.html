<script>
var DAY = {
  num: 2,
  title: "Variables et types",
  subtitle: "Nommer et stocker des valeurs, sans déclarer de type.",
  theory: `
<h3>1. Une variable : un nom pour une valeur</h3>
<p>Une <strong>variable</strong> est une boîte étiquetée dans la mémoire de l'ordinateur : l'étiquette est le <em>nom</em>, et à l'intérieur on range une <em>valeur</em>. En Python, on crée une variable simplement en lui <strong>affectant</strong> une valeur avec le signe <code>=</code>. Pas de type à écrire : Python le déduit tout seul d'après la valeur.</p>
<pre class="pseudo">age = 15              # crée la variable « age » et range l'entier 15 dedans (aucun "int" à écrire !)
prix = 19.99          # « prix » reçoit un nombre à virgule (un float)
prenom = "Léa"        # « prenom » reçoit du texte (str), entre guillemets ou apostrophes
est_majeur = False    # « est_majeur » reçoit un booléen : True ou False (avec une MAJUSCULE !)</pre>
<p>Le <code>=</code> n'est pas « égal » au sens mathématique : il <strong>affecte</strong>, c'est-à-dire qu'il range la valeur de droite dans la variable de gauche (imagine une flèche <em>valeur → boîte</em>). Convention Python : les noms de variables s'écrivent en <code>snake_case</code> (tout en minuscules, mots séparés par des underscores) → <code>prix_total</code>, <code>nb_eleves</code>.</p>

<h3>2. Le typage DYNAMIQUE</h3>
<p>Le <strong>type</strong> d'une variable, c'est la nature de ce qu'elle contient (un entier, du texte…). « <strong>Dynamique</strong> » veut dire que ce type n'est pas figé : la même boîte peut recevoir successivement des valeurs de natures différentes.</p>
<pre class="pseudo">x = 15          # ici x contient un entier (type int)
x = "quinze"    # on remplace : x contient maintenant du texte (type str) — Python l'accepte !
x = 3.14        # puis un nombre à virgule (float)… la même variable a changé de type trois fois</pre>
<div class="warn">Contrairement à Java ou C# (typage fort), Python laisse une variable changer de type en cours de route. C'est souple, mais reste rigoureux : mélanger les types par accident est une source de bugs. La fonction <code>type(x)</code> révèle le type actuel : <code>type(15)</code> donne <code>&lt;class 'int'&gt;</code>.</div>

<h3>3. Les types de base</h3>
<pre class="pseudo">int      42            # nombres entiers (sans virgule)
float    3.14          # nombres à virgule (attention : le point décimal, jamais la virgule)
str      "Léa"         # chaînes de caractères (du texte entre guillemets)
bool     True / False  # booléens : vrai ou faux (majuscule initiale obligatoire !)
NoneType None          # « rien » : l'absence de valeur</pre>
<p>Note importante : les booléens s'écrivent <code>True</code> et <code>False</code> avec une majuscule (différence avec Java/PHP). Et il n'y a pas de type « caractère » séparé : un caractère est juste une chaîne de longueur 1.</p>

<h3>4. Afficher les variables : les f-strings</h3>
<pre class="pseudo">prenom = "Léa"                          # une variable texte
age = 15                                # une variable entière
print(f"Bonjour {prenom}, {age} ans")   # f"..." : les {variables} sont remplacées → « Bonjour Léa, 15 ans »
print("Total : " + str(age))            # concaténation (coller) avec + : les DEUX doivent être des str
print(prenom, "a", age, "ans")          # print sépare ses arguments par une espace (sans coller ni convertir)</pre>
<div class="tip">Le <code>f"..."</code> (f-string) est la façon moderne et lisible d'insérer des variables dans du texte : le <code>f</code> collé devant les guillemets active le remplacement de tout ce qui est entre <code>{...}</code> par sa valeur. Privilégie-le à la concaténation avec <code>+</code>, qui exige que tout soit du texte.</div>

<h3>5. Conversions de types</h3>
<pre class="pseudo">int("42")       # convertit la chaîne "42" en entier 42 (erreur si le texte n'est pas un nombre)
float("3.14")   # convertit "3.14" en nombre à virgule 3.14
str(42)         # convertit l'entier 42 en chaîne de texte "42"
int(3.9)        # convertit un float en int en TRONQUANT (on coupe la virgule) → 3, pas d'arrondi</pre>
<p>Une <strong>conversion</strong> (ou « cast ») transforme une valeur d'un type vers un autre. Elles sont indispensables dès qu'on lit une saisie de l'utilisateur (toujours du texte) pour en faire un nombre — on le verra à la leçon 4.</p>

<h3>6. Constantes (par convention)</h3>
<pre class="pseudo">TVA = 0.21            # une « constante » = une valeur qui ne doit pas changer
                      # Python n'a pas de vraies constantes : on écrit le nom en MAJUSCULES pour dire « ne pas modifier »</pre>
<div class="warn">Python n'empêche pas techniquement de modifier une « constante » : la convention MAJUSCULES est un accord entre développeurs. Respecte-la : un nom en majuscules dit « cette valeur ne doit pas changer ».</div>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>age ← 15</code> en Python :", opts: ["int age = 15;", "age = 15", "var age := 15", "ENTIER age = 15"], a: 1, exp: "Juste nom = valeur : aucun type à écrire." },
    { type: "qcm", q: "Le typage dynamique signifie…", opts: ["Les variables sont rapides", "Le type suit la valeur et peut CHANGER en cours de route", "Il n'y a pas de types", "Les types sont déclarés"], a: 1, exp: "Le type existe (type() le montre) mais n'est pas figé." },
    { type: "qcm", q: "<code>x = 15</code> puis <code>x = \"quinze\"</code> :", opts: ["Erreur comme en Java", "Légal : x change de type, souple mais à surveiller", "Interdit", "Crée un tableau"], a: 1, exp: "La grande différence avec le typage fort de Java/C#." },
    { type: "qcm", q: "Comment s'écrit « vrai » en Python ?", opts: ["true", "True (avec une majuscule)", "TRUE", "1 seulement"], a: 1, exp: "True et False prennent une majuscule initiale (≠ Java/PHP)." },
    { type: "qcm", q: "Quel type pour un prix de 19.99 ?", opts: ["int", "float", "str", "bool"], a: 1, exp: "Un nombre à virgule = float (avec un point décimal)." },
    { type: "qcm", q: "Y a-t-il un type « caractère » séparé en Python ?", opts: ["Oui, char", "Non : un caractère est une str de longueur 1", "Oui, character", "Oui, byte"], a: 1, exp: "Pas de char : \"a\" est simplement une chaîne d'un caractère." },
    { type: "qcm", q: "Que révèle <code>type(x)</code> ?", opts: ["La valeur de x", "Le TYPE actuel de x (ex. <class 'int'>)", "La taille", "Le nom"], a: 1, exp: "L'outil pour vérifier de quel type est une variable." },
    { type: "qcm", q: "<code>f\"Bonjour {prenom}\"</code> s'appelle…", opts: ["Une concaténation", "Une f-string : le f active le remplacement des {variables}", "Un commentaire", "Une conversion"], a: 1, exp: "Sans le f, {prenom} resterait du texte littéral." },
    { type: "input", q: "Que vaut <code>int(\"42\")</code> ?", a: "42", ph: "nombre", exp: "La chaîne \"42\" convertie en entier 42." },
    { type: "input", q: "Que vaut <code>int(3.9)</code> ?", a: "3", ph: "nombre", exp: "int() tronque (coupe la virgule), il n'arrondit pas : 3." },
    { type: "qcm", q: "Pour concaténer avec + un texte et un nombre :", opts: ["\"Age : \" + age fonctionne", "Il faut convertir : \"Age : \" + str(age) — sinon TypeError", "Python convertit tout seul", "Utiliser une virgule seulement"], a: 1, exp: "+ exige deux str : d'où str(age). Ou mieux : une f-string." },
    { type: "qcm", q: "Convention de nommage des variables en Python :", opts: ["camelCase", "snake_case (prix_total, nb_eleves)", "PascalCase", "MAJUSCULES"], a: 1, exp: "snake_case pour les variables et fonctions." },
    { type: "input", q: "Trace : <code>a = 4; b = a + 3; a = b * 2</code>. Que vaut a ?", a: "14", ph: "nombre", exp: "b = 7, puis a = 14 (b copié dans les calculs)." },
    { type: "qcm", q: "Comment signale-t-on une « constante » en Python ?", opts: ["const TVA", "final TVA", "TVA en MAJUSCULES (convention, non imposée)", "Impossible"], a: 2, exp: "Python n'a pas de vraie constante : les majuscules sont un accord entre développeurs." },
    { type: "qcm", q: "<code>None</code> représente…", opts: ["Zéro", "L'ABSENCE de valeur (« rien »)", "false", "Une chaîne vide"], a: 1, exp: "None = pas de valeur, à distinguer de 0 ou de \"\"." }
  ],
  final: {
    title: "Exercice final — La fiche membre (version Python)",
    intro: `<p>On remplit la fiche d'un membre du club. Choisis les bons types :</p>
<pre class="pseudo">nom = "Martin"          # du texte → str
age = 15                # un entier → int
cotisation = 25.50      # un montant à virgule → float
a_paye = True           # vrai/faux → bool
code_postal = "07500"   # un identifiant qui commence par 0 → str (surtout pas int !)</pre>`,
    questions: [
      { type: "qcm", q: "Le type de <code>age</code> :", opts: ["str", "int", "float", "bool"], a: 1, exp: "Un entier : int." },
      { type: "qcm", q: "Le type de <code>cotisation</code> :", opts: ["int", "float (nombre à virgule)", "str", "bool"], a: 1, exp: "25.50 a une partie décimale → float." },
      { type: "qcm", q: "Le type de <code>a_paye</code> :", opts: ["str \"True\"", "bool (True / False)", "int", "None"], a: 1, exp: "Un booléen, avec sa majuscule." },
      { type: "qcm", q: "Pourquoi <code>code_postal</code> est-il une str et non un int ?", opts: ["Au hasard", "Le 0 initial compte et on ne calcule jamais avec : c'est un identifiant → str", "Les codes postaux sont interdits en int", "Pour la vitesse"], a: 1, exp: "int(\"07500\") vaudrait 7500 : on perdrait le 0. Identifiant → texte." },
      { type: "qcm", q: "Afficher « Martin a payé 25.5 € » proprement :", opts: ["print(nom + a payé)", "print(f\"{nom} a payé {cotisation} €\")", "print(nom, cotisation);", "echo"], a: 1, exp: "La f-string insère nom et cotisation sans conversion manuelle." }
    ],
    solution: `<pre class="pseudo">nom = "Martin"          # str (du texte)
age = 15                # int (entier)
cotisation = 25.50      # float (nombre à virgule)
a_paye = True           # bool (vrai/faux)
code_postal = "07500"   # str (le 0 initial doit être conservé !)
print(f"{nom} a payé {cotisation} €")   # f-string : insère nom et cotisation dans le texte</pre>
<p>Choisir le bon type, c'est éviter des bugs : un identifiant est une str, un montant un float. Demain : les opérateurs et le module math.</p>`
  }
};
