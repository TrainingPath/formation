<h3>1. Python, c'est quoi ?</h3>
<p>Un <strong>langage de programmation</strong> est une manière d'écrire des <strong>instructions</strong> (des ordres précis) que l'ordinateur va exécuter, une par une, de haut en bas. <strong>Python</strong> est l'un de ces langages, réputé pour être le plus <strong>lisible</strong> : son code ressemble presque à de l'anglais courant. Créé en 1991, il sert à tout : sites web (avec Django), science des données, intelligence artificielle, petits scripts d'automatisation, jeux…</p>
<p>Python est <strong>interprété</strong>. Imagine un <em>traducteur en direct</em> qui lit ta phrase et la traduit à voix haute immédiatement, une ligne après l'autre : c'est exactement le rôle de l'<strong>interpréteur</strong>, le programme qui lit ton code et l'exécute aussitôt. Il n'y a donc pas d'étape de <em>compilation</em> (la traduction complète du programme en langage machine faite d'avance, comme dans d'autres langages). On écrit, on lance, on voit le résultat.</p>
<p>Python est aussi à <strong>typage dynamique</strong>. Une <strong>variable</strong> est comme une boîte étiquetée qui range une valeur (un nombre, un texte…). Le <strong>type</strong>, c'est la nature de cette valeur (nombre entier, texte, etc.). « Dynamique » signifie qu'on n'a pas besoin d'annoncer le type à l'avance : Python le devine tout seul d'après la valeur qu'on range dedans (on verra tout ça en leçon 2).</p>
<p>Pour pratiquer : installe <strong>Python</strong> depuis le site python.org, avec un éditeur de texte pour programmeurs comme VS Code, PyCharm ou l'éditeur IDLE (fourni avec Python).</p>

<h3>2. Le programme minimal (pas de classe, pas de main !)</h3>
<p>Dans beaucoup de langages, afficher une simple phrase oblige à écrire une dizaine de lignes autour. En Python, une seule suffit :</p>
<pre class="pseudo">print("Bonjour le monde !")    # print AFFICHE à l'écran le texte entre parenthèses, puis passe à la ligne</pre>
<p>Décortiquons cette ligne. <code>print</code> est une <strong>fonction</strong> : une commande toute prête, fournie par Python, qui fait un travail précis — ici, <em>afficher à l'écran</em>. Les <strong>parenthèses</strong> <code>( )</code> contiennent ce qu'on donne à la fonction (on appelle ça ses « arguments »). Les <strong>guillemets</strong> <code>"..."</code> délimitent un <strong>texte</strong> (une « chaîne de caractères ») : tout ce qui est entre guillemets est pris tel quel, lettre pour lettre. Contrairement à Java ou C#, pas besoin de classe englobante, ni de fonction <code>main</code>, ni de point-virgule : le code s'exécute directement, de haut en bas.</p>

<h3>3. L'indentation : la grande spécificité de Python</h3>
<p>Là où Java et C# délimitent les blocs de code avec des accolades <code>{ }</code>, Python utilise l'<strong>indentation</strong> : le décalage vers la droite en début de ligne (des espaces). Un <strong>bloc</strong> est un groupe d'instructions qui vont ensemble. Décaler vers la droite ouvre un bloc ; revenir à gauche le referme. C'est comme les sous-points d'un plan : ce qui est en retrait appartient au point du dessus.</p>
<pre class="pseudo">if 5 &gt; 3:                    # le deux-points « : » annonce qu'un bloc va suivre en dessous
    print("Cinq est plus grand")   # cette ligne est DANS le if (décalée de 4 espaces vers la droite)
    print("Toujours dans le if")   # même décalage (4 espaces) → même bloc que la ligne précédente
print("En dehors du if")           # revenu tout à gauche → cette ligne n'est PLUS dans le if</pre>
<div class="warn">L'indentation n'est pas décorative en Python : elle EST la syntaxe. Un mauvais alignement provoque une <code>IndentationError</code> (le programme refuse de démarrer). Convention : 4 espaces par niveau, sans jamais mélanger espaces et tabulations. C'est déroutant au début, mais ça force un code toujours bien présenté.</div>

<h3>4. print, commentaires et affichage</h3>
<pre class="pseudo">print("A")            # affiche la lettre A, puis passe automatiquement à la ligne
print("B", "C")       # deux valeurs séparées par une virgule → affiché « B C » (une espace entre les deux)
print("X", end="")    # end="" : ne PAS passer à la ligne après (le saut de ligne final est remplacé par du vide)
# Tout ce qui suit le symbole # sur une ligne est un commentaire : Python l'ignore complètement
# Pour un commentaire sur plusieurs lignes, on emploie souvent une chaîne entre triple guillemets :
"""
Ceci est une chaîne écrite sur plusieurs lignes.
Comme on ne la range nulle part, elle ne sert à rien pour la machine et fait office de commentaire de bloc.
"""</pre>

<h3>5. La table de traduction (à compléter tout le cours)</h3>
<pre class="pseudo">PSEUDOCODE            PYTHON
Écrire(x)             print(x)             # afficher une valeur à l'écran
DEBUT...FIN           (l'indentation)      # les blocs se délimitent par l'indentation, pas par des mots-clés
commentaire //        #                    # le symbole # introduit un commentaire en Python</pre>
