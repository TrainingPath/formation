  title: "Héritage et polymorphisme",
  subtitle: "Réutiliser, spécialiser, et laisser chaque objet agir à sa façon.",
  theory: `
<h3>1. L'héritage : Fille(Mere)</h3>
<p>L'<strong>héritage</strong> permet à une classe <em>fille</em> de reprendre gratuitement les attributs et méthodes d'une classe <em>mère</em>, puis d'en ajouter ou d'en redéfinir. On indique la mère entre parenthèses après le nom de la fille.</p>
<pre class="pseudo">class Animal:                        # la classe MÈRE
    def __init__(self, nom):         # constructeur commun à tous les animaux
        self.nom = nom               # attribut nom
    def manger(self):                # méthode commune
        print(f"{self.nom} mange")   # affiche que l'animal mange
    def crier(self):                 # cri générique par défaut
        print("...")                 # un animal quelconque ne fait que « ... »

class Chien(Animal):                 # Chien HÉRITE d'Animal (la mère est entre parenthèses)
    def crier(self):                 # REDÉFINITION : Chien remplace la méthode crier héritée
        print(f"{self.nom} : Wouf !") # le cri propre au chien
    def rapporter(self):             # méthode PROPRE au chien (Animal ne l'a pas)
        print(f"{self.nom} rapporte la balle")  # comportement spécifique</pre>
<p><code>Chien</code> reçoit gratuitement <code>__init__</code> et <code>manger</code> d'<code>Animal</code> ; il redéfinit <code>crier</code> et ajoute <code>rapporter</code>.</p>

<h3>2. super() : appeler la mère</h3>
<pre class="pseudo">class Chiot(Chien):                  # Chiot hérite de Chien (donc aussi d'Animal)
    def __init__(self, nom, mois):   # constructeur avec un paramètre en plus (mois)
        super().__init__(nom)        # appelle le __init__ de la MÈRE pour initialiser la partie héritée
        self.mois = mois             # puis ajoute son propre attribut (l'âge en mois)
    def crier(self):                 # redéfinition qui COMPLÈTE le cri hérité
        super().crier()              # d'abord le cri du parent (Chien)…
        print("(petit wouf)")        # …puis un ajout propre au chiot</pre>
<div class="tip"><code>super()</code> désigne la classe parente. On l'utilise surtout dans <code>__init__</code> pour initialiser la partie héritée (<code>super().__init__(...)</code>), et pour <em>compléter</em> une méthode héritée plutôt que la remplacer entièrement.</div>

<h3>3. Le polymorphisme</h3>
<pre class="pseudo">animaux = [Chien("Rex"), Chat("Mia"), Chien("Fido")]   # une liste d'objets de classes différentes
for a in animaux:                    # pour chaque animal de la liste…
    a.crier()                        # …chacun crie À SA FAÇON, sans aucun if sur le type !</pre>
<p>Même appel <code>a.crier()</code>, comportements différents selon l'objet réel : c'est le <strong>polymorphisme</strong>. Python choisit la bonne méthode selon le type de l'objet, à l'exécution. Ajouter une nouvelle espèce ne change pas cette boucle.</p>

<h3>4. Le duck typing : « si ça cancane… »</h3>
<pre class="pseudo">def faire_crier(x):                  # fonction qui reçoit un objet quelconque x
    x.crier()                        # marche pour TOUT objet qui possède une méthode crier()

faire_crier(Chien("Rex"))            # OK : un Chien a bien une méthode crier()
faire_crier(Chat("Mia"))             # OK aussi : un Chat aussi</pre>
<div class="tip">Python pratique le <strong>duck typing</strong> : « si ça marche comme un canard et cancane comme un canard, c'est un canard ». Peu importe la classe exacte : si l'objet possède la méthode <code>crier()</code>, le code fonctionne. C'est une forme de polymorphisme plus souple que l'héritage strict.</div>

<h3>5. isinstance : tester le type</h3>
<pre class="pseudo">a = Chien("Rex")                     # crée un objet Chien
isinstance(a, Chien)                 # → True : « a est-il un Chien ? »
isinstance(a, Animal)                # → True aussi : un Chien EST aussi un Animal (héritage)
if isinstance(a, Chien):             # si a est bien un Chien…
    a.rapporter()                    # …on peut appeler rapporter() (méthode propre au Chien)</pre>

<h3>6. Quand hériter ?</h3>
<p>Le test de la phrase : « X <strong>est un</strong> Y » doit sonner juste. Un Chien EST UN Animal ✓ → héritage. Une Voiture N'EST PAS un Moteur, mais elle EN A un → on préfère la <strong>composition</strong> (un attribut <code>moteur</code> dans <code>Voiture</code>). Bien distinguer « est un » et « a un » évite des hiérarchies bancales.</p>`,
  exercises: [
    { type: "qcm", q: "Comment déclare-t-on que Chien hérite d'Animal ?", opts: ["class Chien extends Animal", "class Chien(Animal):", "class Chien : Animal", "Chien inherits Animal"], a: 1, exp: "La classe mère entre parenthèses." },
    { type: "qcm", q: "La classe fille hérite…", opts: ["Rien du tout de la classe mère", "Des attributs et méthodes de la mère (manger existe sans le réécrire)", "Seulement le nom de la classe mère", "Uniquement les attributs, pas les méthodes"], a: 1, exp: "L'héritage évite de recopier le code commun." },
    { type: "qcm", q: "À quoi sert <code>super().__init__(nom)</code> ?", opts: ["À créer un nouvel objet de la classe mère", "À appeler le constructeur de la classe MÈRE pour initialiser la partie héritée", "À copier les attributs de la mère un par un", "À remplacer entièrement la classe mère"], a: 1, exp: "super() = la classe parente." },
    { type: "qcm", q: "Redéfinir <code>crier</code> dans Chien signifie…", opts: ["La supprimer", "La RÉÉCRIRE dans la fille pour remplacer le comportement hérité", "La rendre privée", "La dupliquer"], a: 1, exp: "Même nom que dans la mère → la version de la fille est utilisée." },
    { type: "qcm", q: "Dans la boucle <code>for a in animaux: a.crier()</code>, chaque animal crie à sa façon car…", opts: ["Grâce à l'ordre des objets dans la liste", "Polymorphisme : Python choisit la méthode selon le type RÉEL de l'objet", "La variable a mémorise le bon cri", "Tous crient de la même façon par défaut"], a: 1, exp: "Le même appel, des comportements différents." },
    { type: "qcm", q: "Le duck typing signifie…", opts: ["Que tous les objets sont des canards", "Si l'objet a la méthode attendue (crier), le code marche, peu importe sa classe exacte", "Qu'il faut hériter d'Animal pour crier", "Que Python vérifie le type avant chaque appel"], a: 1, exp: "« Si ça cancane… » : la souplesse de Python." },
    { type: "qcm", q: "<code>isinstance(a, Animal)</code> pour un Chien a…", opts: ["False", "True : un Chien EST aussi un Animal (héritage)", "True seulement pour un objet Animal direct", "False, un Chien n'est pas un Animal"], a: 1, exp: "isinstance reconnaît la classe ET ses parentes." },
    { type: "qcm", q: "Dans <code>super().crier()</code> (dans Chiot.crier), on…", opts: ["Supprime la méthode crier héritée", "Exécute d'abord la version du PARENT, avant d'ajouter la sienne", "Crée un nouvel objet parent", "Rappelle la méthode à l'infini"], a: 1, exp: "super() permet de compléter une méthode héritée." },
    { type: "qcm", q: "« Voiture a un Moteur » suggère…", opts: ["Un héritage Voiture(Moteur)", "La COMPOSITION : un attribut moteur dans Voiture", "Une interface commune Moteur", "Une simple ressemblance de noms"], a: 1, exp: "« a un » → composition ; « est un » → héritage." },
    { type: "qcm", q: "Ajouter une nouvelle classe Oiseau avec sa méthode crier() à la liste d'animaux exige…", opts: ["Un if de plus dans la boucle", "RIEN dans la boucle : le polymorphisme s'en charge", "De tout réécrire", "Un import"], a: 1, exp: "Le code ouvert à l'extension : la vertu du polymorphisme." },
    { type: "qcm", q: "Une méthode <code>rapporter</code> définie SEULEMENT dans Chien…", opts: ["Existe aussi dans Animal", "N'existe PAS sur un Animal générique : c'est une méthode propre au Chien", "Est héritée par tous", "Est privée"], a: 1, exp: "Les filles peuvent ajouter des méthodes spécifiques." },
    { type: "qcm", q: "Le 1er paramètre de <code>super().__init__(nom)</code> est passé à…", opts: ["Chien", "Au __init__ de la classe mère (Animal)", "isinstance", "self"], a: 1, exp: "On délègue à la mère l'initialisation de la partie commune." },
    { type: "vf", q: "En Python, un même appel de méthode peut produire des comportements différents selon l'objet.", a: true, exp: "C'est la définition du polymorphisme." },
    { type: "qcm", q: "Combien de classes mères une classe Python peut-elle avoir ?", opts: ["Une seule", "Plusieurs (héritage multiple existe), mais on s'en tient souvent à une pour rester simple", "Zéro", "Deux max"], a: 1, exp: "Python autorise l'héritage multiple, à manier avec prudence." },
    { type: "qcm", q: "Le test pour décider d'un héritage :", opts: ["« X ressemble à Y »", "« X EST UN Y » doit sonner juste", "« X a un Y »", "« X utilise un Y »"], a: 1, exp: "« est un » = héritage ; « a un » = composition." }
  ],
  final: {
    title: "Exercice final — La hiérarchie des formes",
    intro: `<p>On modélise des formes qui savent calculer leur aire :</p>
<pre class="pseudo">class Forme:                     # classe mère générique
    def aire(self):              # aire par défaut
        return 0                 # une forme inconnue a une aire de 0

class Carre(Forme):              # Carre hérite de Forme
    def __init__(self, cote):    # constructeur : reçoit le côté
        self.cote = cote         # attribut cote
    def aire(self):              # redéfinit aire pour le carré
        return self.cote * self.cote   # côté × côté

class Cercle(Forme):             # Cercle hérite de Forme
    def __init__(self, rayon):   # constructeur : reçoit le rayon
        self.rayon = rayon       # attribut rayon
    def aire(self):              # redéfinit aire pour le cercle
        return 3.14 * self.rayon * self.rayon   # π × r²

formes = [Carre(4), Cercle(2)]   # une liste mélangeant carrés et cercles
for f in formes:                 # pour chaque forme…
    print(f.aire())              # …affiche son aire (chacune calcule à sa façon)</pre>`,
    questions: [
      { type: "input", q: "Qu'affiche <code>Carre(4).aire()</code> ?", a: "16", ph: "nombre", exp: "4 × 4 = 16." },
      { type: "input", q: "Qu'affiche <code>Cercle(2).aire()</code> ? (3.14 × 2 × 2)", a: ["12.56"], ph: "nombre", exp: "3.14 × 4 = 12.56." },
      { type: "qcm", q: "Dans la boucle, pourquoi chaque forme calcule-t-elle son aire correctement ?", opts: ["Grâce à l'ordre des formes dans la liste", "Polymorphisme : chaque classe redéfinit aire() à sa façon", "La classe Forme calcule l'aire pour toutes", "Un même calcul sert pour toutes les formes"], a: 1, exp: "Carre et Cercle redéfinissent aire() ; le bon code s'exécute pour chacun." },
      { type: "qcm", q: "Ajouter une classe Triangle(Forme) avec sa propre aire() dans la liste exige…", opts: ["De modifier la boucle", "RIEN dans la boucle : elle appelle aire() sur chaque forme", "Un if", "De tout réécrire"], a: 1, exp: "Le code reste ouvert à de nouvelles formes." },
      { type: "vf", q: "Carre et Cercle héritent de Forme et redéfinissent sa méthode aire().", a: true, exp: "Héritage (Forme) + redéfinition (aire) = polymorphisme." }
    ],
    solution: `<pre class="pseudo">class Forme:                     # classe mère
    def aire(self):
        return 0                 # aire par défaut

class Carre(Forme):              # hérite de Forme
    def __init__(self, cote):
        self.cote = cote         # attribut cote
    def aire(self):              # redéfinition
        return self.cote * self.cote   # côté²

class Cercle(Forme):             # hérite de Forme
    def __init__(self, rayon):
        self.rayon = rayon       # attribut rayon
    def aire(self):              # redéfinition
        return 3.14 * self.rayon * self.rayon   # π × r²

for f in [Carre(4), Cercle(2)]:  # parcourt les deux formes
    print(f.aire())              # affiche 16 puis 12.56</pre>
<p>Héritage, super(), redéfinition, polymorphisme, duck typing : la POO Python est complète. Demain : les modules et la bibliothèque standard.</p>`
  }
};
