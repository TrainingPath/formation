    solution: "# Releve de la ligne de bus : constitution, tri des lignes, charge a bord\nBRUT = [\n    \"Gare;18;0\",\n    \"Place Verte;7;3\",\n    \"Hopital;abc;2\",       # montees illisibles\n    \"Universite;5;9\",\n    \"Piscine;2;6\",\n    \"Terminus\",             # champs manquants\n    \"Zoning;0;14\",\n]\nFICHIER = \"course.txt\"\n\n# a) le fichier decrit UNE course : mode \"w\", il est reecrit entierement\nwith open(FICHIER, \"w\") as f:\n    for ligne in BRUT:\n        f.write(ligne + \"\\n\")\n\n# b) lecture : on tente, et on ecarte ce qui echoue. Les deux causes de rejet\n#    aboutissent a la meme exception, donc au meme traitement.\nreleve = []\nrejets = 0\nwith open(FICHIER, \"r\") as f:\n    for ligne in f:\n        ligne = ligne.strip()\n        try:\n            champs = ligne.split(\";\")\n            if len(champs) != 3:\n                raise ValueError(\"trois champs attendus\")\n            releve.append((champs[0], int(champs[1]), int(champs[2])))\n        except ValueError as e:\n            rejets = rejets + 1\n            print(f\"ligne ecartee : {ligne!r} — {e}\")\n\nprint(f\"{rejets} ligne(s) ecartee(s), {len(releve)} arret(s) exploitables\")\n\n# c) la charge se cumule ; le maximum se retient au passage\ncharge = 0\nmaximum = 0\nfor arret, montees, descentes in releve:\n    charge = charge + montees - descentes\n    if charge > maximum:\n        maximum = charge\n    print(f\"{arret} : {charge} a bord\")\n\nfrequentation = {arret: montees + descentes for arret, montees, descentes in releve}\nplus_frequente = \"\"\nrecord = 0\nfor arret, passage in frequentation.items():\n    if passage > record:\n        record = passage\n        plus_frequente = arret\n\nprint(f\"charge maximale : {maximum}\")\nprint(f\"arret le plus frequente : {plus_frequente} ({record} mouvements)\")\nprint(f\"charge a l'arrivee : {charge}\")",

      { ref: "Réflexion", texte: "La charge finale vaut bien zéro : 32 montées, 32 descentes. <strong>Une charge finale négative</strong> signifierait que plus de gens sont descendus qu'il n'en est monté — matériellement impossible. La cause est donc toujours dans les données : le plus souvent une ligne de montées écartée par le tri, dont les descentes correspondantes, elles, ont bien été comptées plus loin. C'est exactement ce qui arriverait ici si l'arrêt de l'hôpital avait été relevé avec un nombre de descentes valide : ses cinq montées illisibles manqueraient au cumul sans que rien ne le signale. <strong>Une charge finale positive</strong> signifierait que des passagers sont restés à bord au terminus. C'est matériellement possible — un conducteur qui oublie de noter la dernière descente, ou une course interrompue — mais l'explication la plus fréquente est symétrique de la précédente : une ligne de descentes perdue. Les deux anomalies ont donc <em>la même cause probable</em>, une ligne écartée, et se distinguent seulement par ce que cette ligne contenait de plus lourd. C'est pourquoi le nombre de rejets doit toujours être affiché à côté du bilan : sans lui, on chercherait l'erreur dans le calcul alors qu'elle est dans les données. Sur la seconde question : la vérification préalable s'écrirait « la ligne doit contenir exactement trois champs, le deuxième et le troisième ne devant être composés que de chiffres ». Elle est plus fragile pour deux raisons. D'abord elle <em>duplique</em> la règle de conversion : le jour où le relevé accepterait un signe ou un espace, il faudrait corriger la vérification <em>et</em> la conversion, et l'une des deux serait oubliée. Ensuite elle est presque toujours incomplète — un texte fait de chiffres peut malgré tout dépasser ce qu'on attend, et la liste des formes acceptables est plus longue qu'on ne croit. Le rattrapage, lui, pose la seule question qui compte, celle à laquelle la conversion elle-même répond : est-ce que ça marche ?" }
    ],
    pourquoi: "Le contrôle du nombre de champs lève volontairement le <em>même</em> type d'exception que celui produit spontanément par la conversion. Ce n'est pas de la paresse : les deux situations appellent la même réponse — écarter la ligne et le dire — et leur donner deux traitements séparés obligerait à écrire deux fois ce même traitement. Le message porté par l'exception suffit à distinguer les causes dans l'affichage, sans dupliquer la moindre logique.",
    tests: [
      { code: "assert rejets == 2", label: "b) les deux lignes abîmées sont écartées" },
      { code: "assert len(releve) == 5", label: "b) cinq arrêts restent exploitables" },
      { code: "assert releve[0] == ('Gare', 18, 0)", label: "b) les nombres sont convertis, pas laissés en texte" },

      { code: "assert plus_frequente == 'Gare' and record == 18", label: "c) l'arrêt le plus fréquenté est identifié" },

    solution: "# Budget du festival — jour 3 : le bilan de l'edition\nimport os\nimport json\nimport math\n\n\nclass Groupe:\n    def __init__(self, nom, cachet, style):\n        self.nom = nom\n        self.cachet = cachet\n        self.style = style\n\n    def __str__(self):\n        return f\"{self.nom} — {self.style} — {self.cachet} EUR\"\n\n\nclass Budget:\n    def __init__(self):\n        self.groupes = []\n\n    def ajouter(self, nom, cachet, style):\n        self.groupes.append(Groupe(nom, cachet, style))\n\n    def total(self):\n        return sum(g.cachet for g in self.groupes)\n\n    def charger(self, fichier):\n        if not os.path.exists(fichier):\n            return\n        with open(fichier, \"r\") as f:\n            data = json.load(f)\n        self.groupes = [Groupe(d[\"nom\"], d[\"cachet\"], d[\"style\"]) for d in data]\n\n\nclass Bilan:\n    def __init__(self, budget, charges, prix_entree):\n        self.budget = budget          # on GARDE le budget, on ne copie pas son total\n        self.charges = charges\n        self.prix_entree = prix_entree\n        self.entrees = {}             # une journee -> le nombre d'entrees vendues\n\n    def enregistrer_journee(self, journee, entrees):\n        self.entrees[journee] = entrees\n\n    def depenses(self):\n        return self.budget.total() + sum(self.charges.values())\n\n    def recettes(self):\n        return sum(self.entrees.values()) * self.prix_entree\n\n    def resultat(self):\n        return self.recettes() - self.depenses()\n\n    def seuil(self):\n        # ceil, PAS round : 1888,9 entrees necessaires => il en faut 1889\n        return math.ceil(self.depenses() / self.prix_entree)\n\n    def meilleure_journee(self):\n        meilleure = \"\"\n        record = 0\n        for journee, entrees in self.entrees.items():\n            if entrees > record:\n                record = entrees\n                meilleure = journee\n        return meilleure, record * self.prix_entree\n\n    def sauver(self, fichier):\n        data = {\"depenses\": self.depenses(), \"recettes\": self.recettes(),\n                \"resultat\": self.resultat(), \"seuil\": self.seuil(),\n                \"entrees\": self.entrees}\n        with open(fichier, \"w\") as f:\n            json.dump(data, f)\n\n\n# a) le fichier d'hier s'il existe, la reconstitution sinon\nENGAGEMENTS = [\n    (\"Les Alizes\", 3200, \"chanson\"),\n    (\"Cinabre\", 5400, \"rock\"),\n    (\"Otarie\", 8600, \"electro\"),\n    (\"Vent d'Est\", 4300, \"jazz\"),\n]\nbudget = Budget()\nbudget.charger(\"festival.json\")\nif not budget.groupes:\n    for nom, cachet, style in ENGAGEMENTS:\n        budget.ajouter(nom, cachet, style)\n\nCHARGES = {\"scene\": 6500, \"securite\": 4200, \"sanitaires\": 1800}\nbilan = Bilan(budget, CHARGES, 18)\n\n# c) les trois journees du festival\nbilan.enregistrer_journee(\"03/07/2027\", 620)\nbilan.enregistrer_journee(\"04/07/2027\", 940)\nbilan.enregistrer_journee(\"05/07/2027\", 730)\n\nmention = \"benefice\" if bilan.resultat() >= 0 else \"deficit\"\nprint(f\"depenses : {bilan.depenses()} EUR\")\nprint(f\"recettes : {bilan.recettes()} EUR\")\nprint(f\"resultat : {bilan.resultat()} EUR ({mention})\")\nprint(f\"seuil de rentabilite : {bilan.seuil()} entrees\")\n\njournee, recette = bilan.meilleure_journee()\nprint(f\"meilleure journee : {journee} ({recette} EUR)\")\n\n# d) sauvegarde puis relecture dans une structure NEUVE\nbilan.sauver(\"bilan.json\")\nwith open(\"bilan.json\", \"r\") as f:\n    relu = json.load(f)\nprint(f\"resultat calcule : {bilan.resultat()} EUR\")\nprint(f\"resultat relu    : {relu['resultat']} EUR\")",
    reponses: [
      { ref: "Réflexion", texte: "<strong>Garder le budget plutôt que son total</strong> change tout dès qu'un engagement arrive après coup. Avec un total recopié à la construction, le bilan afficherait éternellement l'ancien chiffre : ajouter un groupe à 4 000 € ne bougerait ni les dépenses, ni le résultat, ni le seuil — et rien ne signalerait l'incohérence, puisque les deux objets seraient chacun cohérent de leur côté. En gardant le budget, le bilan pose la question au moment où il en a besoin, et sa réponse est toujours à jour. C'est le même principe que l'index de la leçon d'avant-hier : une valeur recopiée est une valeur qui va se périmer, et le seul moyen sûr de ne pas se tromper est de ne pas la recopier. <strong>L'arrondi.</strong> Prenons 30 000 € de dépenses et 25 € l'entrée : le calcul donne exactement 1 200, les deux arrondis coïncident. Prenons maintenant 30 010 € : le calcul donne 1 200,4. L'arrondi ordinaire répond 1 200, l'arrondi supérieur 1 201. Avec 1 200 entrées vendues, la recette est de 30 000 € pour 30 010 € de dépenses : le festival annonce fièrement qu'il a atteint son seuil et termine à 10 € de déficit. Le coût est faible en euros, considérable en confiance — c'est un tableau de bord qui affiche vert alors qu'on est dans le rouge, et personne ne relit un chiffre qui dit ce qu'on espérait. Chaque fois qu'un seuil compte un objet indivisible — billets, cartons, camions, serveurs —, l'arrondi va vers le haut. <strong>Les quatre structures.</strong> Les <em>objets</em> pour les groupes, parce qu'un groupe porte plusieurs renseignements de natures différentes qui doivent voyager ensemble et qui gagnent à porter des noms plutôt que des rangs. Le <em>dictionnaire</em> pour les charges et les entrées, parce qu'on y accède par un libellé — « securite », « 04/07/2027 » — et jamais par une position : personne ne veut savoir que la sécurité est le deuxième poste. La <em>liste</em> pour les groupes du budget, parce qu'ils forment une suite ordonnée où deux entrées pourraient légitimement se ressembler, et qu'on les parcourt toujours en entier plutôt que d'en désigner un. Le <em>fichier</em>, enfin, parce que c'est la seule des quatre qui survive à la fin du programme — les trois autres disparaissent avec la mémoire, et un bilan qu'on ne peut pas relire l'an prochain n'est pas un bilan." }
