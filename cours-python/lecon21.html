<p>Cette dernière leçon est un <strong>examen de synthèse</strong> : chaque question porte un repère [L1], [L2]… qui renvoie à la leçon d'origine. Avant de te lancer, voici la carte complète du cours (dans le tableau ci-dessous, chaque commentaire <code>#</code> résume à quoi sert la ligne).</p>
<h3>Le cours en une carte</h3>
<pre class="pseudo">SEMAINE 1 — LES BASES
  print · indentation · variables & typage dynamique · f-strings         # afficher, structurer, typer
  ** and/or/not · input() (str !) · if/elif/else · while/for/range        # calculer, lire, décider, répéter
  listes (indices négatifs, slicing, append/sort)                        # la structure reine

SEMAINE 2 — STRUCTURER & OBJETS
  def/return/portée · str (méthodes, slicing) · tuples & compréhensions  # fonctions, texte, expressivité
  algorithmes traduits · POO (class, __init__, self)                     # recherche/tri, objets
  encapsulation (@property) · héritage/polymorphisme (super, duck typing) # protéger, spécialiser

SEMAINE 3 — VERS LE RÉEL
  modules (import, random, datetime) · exceptions (try/except/raise)      # réutiliser, fiabiliser
  fichiers (with, open) & JSON · dict & set · lambda/map/filter · PROJET  # persister, indexer, assembler</pre>
<h3>Les réflexes Python à vie</h3>
<ul>
<li>L'<strong>indentation</strong> délimite les blocs (le <code>:</code> les ouvre) : pas d'accolades.</li>
<li><code>/</code> rend un float ; <code>//</code> est la division entière ; <code>**</code> la puissance.</li>
<li>Opérateurs logiques : des MOTS (<code>and</code>, <code>or</code>, <code>not</code>).</li>
<li><code>input()</code> rend TOUJOURS une str → convertir avec <code>int()</code>/<code>float()</code>.</li>
<li>Chaînes et tuples immuables ; listes et dicts modifiables (attention aux références partagées).</li>
<li>POO : <code>self</code> partout, <code>__init__</code> le constructeur, <code>@property</code> pour encapsuler.</li>
<li>Les compréhensions <code>[expr for x in seq if cond]</code> remplacent bien des boucles.</li>
<li><code>try/except</code> pour l'imprévisible, <code>with open(...)</code> pour les fichiers.</li>
</ul>
<div class="tip">L'examen pioche dans les 20 leçons précédentes. Chaque erreur te renvoie, grâce à son repère [L…], à la leçon exacte à revoir : c'est ton mode d'emploi de révision ciblée. Ensuite, place au web avec Django !</div>`,

<pre class="pseudo">notes = [12, 8, 15, 9, 18]                    # une liste de 5 notes

      { type: "qcm", q: "La ligne <code>[n for n in notes if n &gt;= 10]</code> est…", opts: ["Une boucle infinie", "Une compréhension de liste avec filtre", "Un dictionnaire", "Une erreur"], a: 1, exp: "[expr for x in seq if cond] : le motif star de Python." },

    ],
    solution: `<pre class="pseudo">notes = [12, 8, 15, 9, 18]                   # la liste de départ

moyenne = sum(notes) / len(notes)           # 62 / 5 = 12.4 (un float)

d = {"Ana": 14, "Bob": 9}                   # dictionnaire nom → note
