  title: "Les chaînes de caractères",
  subtitle: "Manipuler du texte : la matière première du web et des données.",
  theory: `
<h3>1. Une chaîne se comporte comme une séquence</h3>
<p>Une <strong>chaîne de caractères</strong> (type <code>str</code>) est simplement du texte : une suite de caractères. Comme une liste, elle est <strong>indexée</strong> à partir de 0 (chaque caractère a un numéro de position) : on y accède avec les crochets et le slicing.</p>
<pre class="pseudo">mot = "BONJOUR"   # range le texte "BONJOUR" dans la variable mot
mot[0]          # → "B" : lit le caractère d'indice 0 (le 1er)
mot[-1]         # → "R" : l'indice -1 désigne le dernier caractère
len(mot)        # → 7 : len() compte le nombre de caractères
mot[0:3]        # → "BON" : slicing, de l'indice 0 INCLUS à 3 EXCLU
mot[::-1]       # → "RUOJNOB" : un pas de -1 renvoie la chaîne inversée</pre>

<h3>2. Les méthodes essentielles</h3>
<p>Une <strong>méthode</strong> est une fonction attachée à la chaîne, appelée avec un point (<code>texte.methode()</code>).</p>
<pre class="pseudo">"bonjour".upper()             # → "BONJOUR" : renvoie le texte tout en majuscules
"BONJOUR".lower()             # → "bonjour" : renvoie le texte tout en minuscules
"  hey  ".strip()             # → "hey" : retire les espaces au début et à la fin
"bonjour".replace("o", "0")   # → "b0nj0ur" : remplace TOUTES les occurrences de "o" par "0"
"bonjour".find("j")           # → 3 : renvoie la position de "j" (ou -1 s'il est absent)
"bonjour".count("o")          # → 2 : compte le nombre de fois où "o" apparaît
"bonjour".startswith("bon")   # → True : le texte commence-t-il par "bon" ?
"a-b-c".split("-")            # → ["a", "b", "c"] : découpe le texte sur "-" → une LISTE
", ".join(["a", "b", "c"])    # → "a, b, c" : recolle une liste en une chaîne, séparée par ", "
"42".isdigit()                # → True : le texte ne contient-il QUE des chiffres ?
"Ana".capitalize()            # → "Ana" : met la 1re lettre en majuscule, le reste en minuscule</pre>

<h3>3. Une chaîne est IMMUABLE</h3>
<p><strong>Immuable</strong> signifie « qu'on ne peut pas modifier après création » : toute méthode renvoie une NOUVELLE chaîne au lieu de changer l'ancienne.</p>
<pre class="pseudo">s = "chat"              # crée la chaîne "chat"
s.upper()               # calcule "CHAT" mais NE modifie PAS s (le résultat est jeté ici)
print(s)                # affiche "chat" (toujours inchangé !)
s = s.upper()           # il faut RÉAFFECTER le résultat dans s pour le garder
print(s)                # affiche "CHAT"</pre>
<div class="warn">Comme dans les autres langages, une chaîne Python est <strong>immuable</strong> : aucune méthode ne la modifie, toutes en renvoient une nouvelle. <code>s[0] = "X"</code> provoque même une <code>TypeError</code>. Oublier la réaffectation (<code>s = s.upper()</code>) est l'erreur classique.</div>

<h3>4. Rechercher et parcourir</h3>
<pre class="pseudo">"@" in "ana@mail.be"         # → True : l'opérateur « in » teste si "@" est présent dans le texte
for c in "abc":              # parcourt la chaîne caractère par caractère (c prend a, puis b, puis c)
    print(c)                 # affiche a, puis b, puis c

# Compter les 'a' à la main (le motif compteur)
nb = 0                       # le compteur, à zéro au départ
for c in mot:                # pour chaque caractère c du mot…
    if c == "a":             # …si c'est un "a"…
        nb += 1              # …on incrémente le compteur</pre>

<h3>5. f-strings et formats (rappel)</h3>
<pre class="pseudo">prenom = "Léa"                      # une variable texte
age = 15                            # une variable entière
print(f"{prenom} a {age} ans")      # insère les variables dans le texte (f-string)
print(f"{3.14159:.2f}")             # → "3.14" : « :.2f » = deux chiffres après la virgule
print(f"{prenom:&gt;10}")              # « :&gt;10 » : aligne le texte à droite sur 10 caractères
prix = 20                           # une valeur numérique
print(f"Total : {prix} €")          # mélange texte fixe et valeur de variable</pre>

<h3>6. Palindrome (comparer les extrémités)</h3>
<pre class="pseudo">mot = "radar"                       # un mot à tester
est_palindrome = mot == mot[::-1]   # compare le mot à son inverse : sont-ils identiques ?
print(est_palindrome)                # affiche True (radar se lit pareil à l'envers)</pre>
<div class="tip">Le slicing rend Python particulièrement élégant : tester un palindrome tient en une ligne grâce à <code>mot[::-1]</code> (la chaîne inversée). Là où d'autres langages écrivent une boucle avec un indice miroir, Python compare simplement la chaîne à son renversement.</div>`,

    { type: "input", q: "Que vaut <code>\"  hey  \".strip()</code> ? (sans les guillemets)", a: ["hey"], ph: "texte", exp: "strip() enlève les espaces au début et à la fin." },

    { type: "qcm", q: "Qu'affiche <code>f\"{3.14159:.2f}\"</code> ?", opts: ["3.14159", "3.14 : deux décimales", "3", "3.1"], a: 1, exp: "Le format .2f arrondit à deux chiffres après la virgule." }

print(len(mdp))          # 10
print(mdp.lower())       # python2026

print("2026" in mdp)     # True
