  title: "Lire au clavier avec input()",
  subtitle: "Rendre un programme interactif.",
  theory: `
<h3>1. input() : lire une saisie</h3>
<p>Jusqu'ici le programme parlait tout seul. <code>input()</code> est une fonction qui lui permet d'<strong>écouter</strong> : elle met le programme en <strong>pause</strong>, attend que l'utilisateur tape quelque chose au clavier et appuie sur Entrée, puis renvoie ce qui a été tapé… en <strong>str</strong> (du texte), toujours. Même si l'utilisateur tape « 42 », tu reçois le TEXTE "42", jamais le nombre.</p>
<pre class="pseudo">prenom = input("Quel est ton prénom ? ")   # affiche l'invite, attend la saisie, la range dans « prenom »
print(f"Bonjour {prenom}")                 # réutilise la saisie dans un message personnalisé</pre>
<p>Pratique : <code>input()</code> prend en argument le texte de l'<strong>invite</strong> (le message qui explique quoi taper), affiché juste avant d'attendre la saisie. Pas besoin d'un print séparé.</p>

<h3>2. Convertir la saisie en nombre</h3>
<pre class="pseudo">age = input("Ton âge ? ")        # age est une STR, par exemple "15" (avec les guillemets : du texte)
age = int(age)                   # on convertit ce texte en entier avec int()
print(f"Dans 10 ans : {age + 10}")   # maintenant age est un nombre : on peut l'additionner</pre>
<pre class="pseudo"># Plus court, en une seule ligne : on emboîte int() autour de input()
age = int(input("Ton âge ? "))     # lire la saisie PUIS la convertir en entier, d'un coup
prix = float(input("Montant ? "))  # même idée avec float() pour un nombre à virgule</pre>
<div class="warn">Piège classique : oublier la conversion. <code>input()</code> rend TOUJOURS une str. <code>"15" + 10</code> provoque une <code>TypeError</code> (on ne peut pas ajouter un nombre à du texte). Convertis avec <code>int()</code> ou <code>float()</code> avant tout calcul.</div>

<h3>3. Le schéma universel : invite → lecture → traitement → affichage</h3>
<pre class="pseudo">euros = float(input("Montant en euros ? "))   # étapes 1+2 : INVITE + LECTURE + conversion en float
dollars = euros * 1.08                        # étape 3 : TRAITEMENT (le calcul de conversion)
print(f"Cela fait {dollars} dollars")         # étape 4 : AFFICHAGE du résultat</pre>
<p>Ce déroulé en quatre temps est le squelette de tout programme interactif. L'invite est intégrée à <code>input()</code>, ce qui rend le code particulièrement compact en Python.</p>

<h3>4. Lire plusieurs valeurs</h3>
<pre class="pseudo">n1 = int(input("Première note ? "))    # premier appel : lit et convertit la 1re note
n2 = int(input("Deuxième note ? "))    # deuxième appel : lit et convertit la 2e note
moyenne = (n1 + n2) / 2                 # additionne puis divise ; / rend un float (pas de troncature ≠ Java)
print(f"Moyenne : {moyenne}")          # affiche la moyenne calculée</pre>
<p>Chaque appel à <code>input()</code> lit une saisie. Bon réflexe hérité de Python : la division <code>/</code> donnant déjà un float, la moyenne est correcte sans astuce (contrairement à Java où il fallait <code>/2.0</code>).</p>

<h3>5. Se protéger d'une mauvaise saisie</h3>
<pre class="pseudo">reponse = input("Ton âge ? ")          # on lit d'abord SANS convertir (on garde le texte)
if reponse.isdigit():                  # isdigit() : la chaîne ne contient-elle QUE des chiffres ?
    age = int(reponse)                 # si oui : la conversion est sûre, on l'exécute
    print(f"Dans 10 ans : {age + 10}") # et on peut calculer sans risque
else:                                  # sinon (la saisie contenait autre chose que des chiffres)…
    print("Ce n'est pas un nombre !")  # …message clair au lieu d'un plantage du programme</pre>
<p>Un humain se trompe : il peut taper « abc » quand on attend un nombre. <code>reponse.isdigit()</code> vérifie que la saisie est bien composée de chiffres avant de la convertir — le réflexe prudent (on verra une autre approche avec <code>try/except</code> à la leçon 16).</p>

<h3>6. Formater l'affichage</h3>
<pre class="pseudo">prix = 19.999               # un nombre à virgule un peu long
print(f"{prix:.2f}")        # 20.00 : « :.2f » = deux chiffres après la virgule (arrondi)
print(f"{prix:.0f}")        # 20    : « :.0f » = zéro décimale (arrondi à l'entier)
print(f"{42:05d}")          # 00042 : « :05d » = entier complété avec des zéros sur 5 chiffres</pre>
<p>La syntaxe <code>{valeur:format}</code> dans une f-string contrôle l'affichage sans changer la valeur : très utile pour les prix ou les numéros à longueur fixe.</p>`,

    { type: "vf", q: "L'invite d'input() peut être écrite directement dans l'appel : input(\"Nom ? \").", a: true, exp: "L'argument de input() est le texte affiché avant la saisie." },

    { type: "qcm", q: "Le schéma universel d'un programme interactif :", opts: ["lire → afficher → calculer", "invite → lecture (+ conversion) → traitement → affichage", "tout en une ligne", "afficher → lire"], a: 1, exp: "L'ordre logique, avec l'invite d'abord." }

print(f"Tu as environ {age} ans")                 # affichage du résultat
