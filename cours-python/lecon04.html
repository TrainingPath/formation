<script>
var DAY = {
  num: 4,
  title: "Lire au clavier avec input()",
  subtitle: "Rendre un programme interactif.",
  theory: `
<h3>1. input() : lire une saisie</h3>
<p>Jusqu'ici le programme parlait tout seul. <code>input()</code> est une fonction qui lui permet d'<strong>écouter</strong> : elle met le programme en <strong>pause</strong>, attend que l'utilisateur tape quelque chose au clavier et appuie sur Entrée, puis renvoie ce qui a été tapé… en <strong>str</strong> (du texte), toujours. Même si l'utilisateur tape « 42 », tu reçois le TEXTE "42", jamais le nombre.</p>
<pre class="pseudo">prenom = input("Quel est ton prénom ? ")   # affiche l'invite, attend la saisie, la range dans « prenom »
print(f"Bonjour {prenom}")                 # réutilise la saisie dans un message personnalisé</pre>
<p>Pratique : <code>input()</code> prend en argument le texte de l'<strong>invite</strong> (le message qui explique quoi taper), affiché juste avant d'attendre la saisie. Pas besoin d'un print séparé.</p>

<h3>2. Convertir la saisie en nombre</h3>
<pre class="pseudo">age = input("Ton âge ? ")        # age est une STR, par exemple "15" (avec les guillemets : du texte)
age = int(age)                   # on convertit ce texte en entier avec int()
print(f"Dans 10 ans : {age + 10}")   # maintenant age est un nombre : on peut l'additionner</pre>
<pre class="pseudo"># Plus court, en une seule ligne : on emboîte int() autour de input()
age = int(input("Ton âge ? "))     # lire la saisie PUIS la convertir en entier, d'un coup
prix = float(input("Montant ? "))  # même idée avec float() pour un nombre à virgule</pre>
<div class="warn">Piège classique : oublier la conversion. <code>input()</code> rend TOUJOURS une str. <code>"15" + 10</code> provoque une <code>TypeError</code> (on ne peut pas ajouter un nombre à du texte). Convertis avec <code>int()</code> ou <code>float()</code> avant tout calcul.</div>

<h3>3. Le schéma universel : invite → lecture → traitement → affichage</h3>
<pre class="pseudo">euros = float(input("Montant en euros ? "))   # étapes 1+2 : INVITE + LECTURE + conversion en float
dollars = euros * 1.08                        # étape 3 : TRAITEMENT (le calcul de conversion)
print(f"Cela fait {dollars} dollars")         # étape 4 : AFFICHAGE du résultat</pre>
<p>Ce déroulé en quatre temps est le squelette de tout programme interactif. L'invite est intégrée à <code>input()</code>, ce qui rend le code particulièrement compact en Python.</p>

<h3>4. Lire plusieurs valeurs</h3>
<pre class="pseudo">n1 = int(input("Première note ? "))    # premier appel : lit et convertit la 1re note
n2 = int(input("Deuxième note ? "))    # deuxième appel : lit et convertit la 2e note
moyenne = (n1 + n2) / 2                 # additionne puis divise ; / rend un float (pas de troncature ≠ Java)
print(f"Moyenne : {moyenne}")          # affiche la moyenne calculée</pre>
<p>Chaque appel à <code>input()</code> lit une saisie. Bon réflexe hérité de Python : la division <code>/</code> donnant déjà un float, la moyenne est correcte sans astuce (contrairement à Java où il fallait <code>/2.0</code>).</p>

<h3>5. Se protéger d'une mauvaise saisie</h3>
<pre class="pseudo">reponse = input("Ton âge ? ")          # on lit d'abord SANS convertir (on garde le texte)
if reponse.isdigit():                  # isdigit() : la chaîne ne contient-elle QUE des chiffres ?
    age = int(reponse)                 # si oui : la conversion est sûre, on l'exécute
    print(f"Dans 10 ans : {age + 10}") # et on peut calculer sans risque
else:                                  # sinon (la saisie contenait autre chose que des chiffres)…
    print("Ce n'est pas un nombre !")  # …message clair au lieu d'un plantage du programme</pre>
<p>Un humain se trompe : il peut taper « abc » quand on attend un nombre. <code>reponse.isdigit()</code> vérifie que la saisie est bien composée de chiffres avant de la convertir — le réflexe prudent (on verra une autre approche avec <code>try/except</code> à la leçon 16).</p>

<h3>6. Formater l'affichage</h3>
<pre class="pseudo">prix = 19.999               # un nombre à virgule un peu long
print(f"{prix:.2f}")        # 20.00 : « :.2f » = deux chiffres après la virgule (arrondi)
print(f"{prix:.0f}")        # 20    : « :.0f » = zéro décimale (arrondi à l'entier)
print(f"{42:05d}")          # 00042 : « :05d » = entier complété avec des zéros sur 5 chiffres</pre>
<p>La syntaxe <code>{valeur:format}</code> dans une f-string contrôle l'affichage sans changer la valeur : très utile pour les prix ou les numéros à longueur fixe.</p>`,
  exercises: [
    { type: "qcm", q: "<code>input()</code> retourne…", opts: ["Un int", "Une str, TOUJOURS (à convertir pour calculer)", "Un float", "Un bool"], a: 1, exp: "Le clavier ne transporte que du texte." },
    { type: "qcm", q: "Lire un entier au clavier :", opts: ["age = input()", "age = int(input(\"...\"))", "age = readInt()", "input(int)"], a: 1, exp: "input() puis int() : la conversion obligatoire." },
    { type: "qcm", q: "Que peut-on passer en argument à <code>input()</code> ?", opts: ["Rien", "Le texte de l'invite, affiché avant d'attendre la saisie", "Le type attendu", "Un nombre max"], a: 1, exp: "input(\"Ton âge ? \") affiche l'invite, pas besoin d'un print." },
    { type: "qcm", q: "<code>\"15\" + 10</code> provoque…", opts: ["25", "\"1510\"", "Une TypeError : on ne mélange pas str et int avec +", "150"], a: 2, exp: "En Python, + refuse d'additionner un texte et un nombre : convertis d'abord." },
    { type: "qcm", q: "Lire un nombre à virgule :", opts: ["int(input())", "float(input(\"...\"))", "double(input())", "input().float"], a: 1, exp: "float() pour les décimales." },
    { type: "qcm", q: "Faut-il toujours afficher une invite AVANT de lire ?", opts: ["Non", "Oui : l'utilisateur doit savoir quoi taper (ici, via l'argument d'input)", "Seulement pour les nombres", "Jamais"], a: 1, exp: "Invite → lecture → traitement → affichage." },
    { type: "qcm", q: "L'utilisateur tape 8 puis 5. <code>a = int(input()); b = int(input())</code>. Que vaut a - b ?", opts: ["3", "-3", "85", "0"], a: 0, exp: "a=8, b=5 : lectures dans l'ordre." },
    { type: "qcm", q: "La moyenne de deux int avec <code>(n1 + n2) / 2</code> en Python…", opts: ["Tronque comme en Java", "Est correcte : / rend un float, donc 6.5 et non 6", "Provoque une erreur", "Est toujours un int"], a: 1, exp: "Avantage Python : pas besoin de /2.0, la division rend déjà un float." },
    { type: "qcm", q: "<code>reponse.isdigit()</code> teste…", opts: ["La longueur", "Si la chaîne ne contient QUE des chiffres (utile avant int())", "Le type", "La casse"], a: 1, exp: "Un garde-fou avant la conversion : évite le plantage sur « abc »." },
    { type: "qcm", q: "Qu'affiche <code>f\"{19.999:.2f}\"</code> ?", opts: ["19.999", "20.00 : deux décimales, arrondies", "19.99", "20"], a: 1, exp: "Le format .2f : deux chiffres après la virgule." },
    { type: "qcm", q: "Qu'affiche <code>f\"{42:05d}\"</code> ?", opts: ["42", "00042 : entier sur 5 chiffres, complété de zéros", "42000", "5"], a: 1, exp: "Parfait pour les numéros de facture." },
    { type: "qcm", q: "Pourquoi la conversion int() est-elle nécessaire après input() ?", opts: ["Pour la vitesse", "Parce que input() rend du TEXTE, et on ne calcule pas avec du texte", "Par convention", "Ce n'est pas nécessaire"], a: 1, exp: "\"42\" (str) n'est pas 42 (int) tant qu'on ne l'a pas converti." },
    { type: "vf", q: "L'invite d'input() peut être écrite directement dans l'appel : input(\"Nom ? \").", a: true, exp: "L'argument de input() est le texte affiché avant la saisie." },
    { type: "qcm", q: "L'utilisateur tape « 3.5 » et on fait <code>int(input())</code>. Résultat ?", opts: ["3", "Une ValueError : int() n'accepte pas « 3.5 » (c'est un float, pas un entier)", "3.5", "4"], a: 1, exp: "Pour un décimal saisi, il faut float(), pas int()." },
    { type: "qcm", q: "Le schéma universel d'un programme interactif :", opts: ["lire → afficher → calculer", "invite → lecture (+ conversion) → traitement → affichage", "tout en une ligne", "afficher → lire"], a: 1, exp: "L'ordre logique, avec l'invite d'abord." }
  ],
  final: {
    title: "Exercice final — Le convertisseur d'âge",
    intro: `<p>On écrit un petit programme interactif :</p>
<pre class="pseudo">annee = int(input("Ton année de naissance ? "))   # lit l'année tapée et la convertit en entier
age = 2026 - annee                                # calcule l'âge par soustraction
print(f"Tu as environ {age} ans")                 # affiche le résultat</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi <code>int(input(...))</code> et non <code>input(...)</code> seul ?", opts: ["Style", "input() rend une str ; on la convertit en int pour la soustraction", "int est plus rapide", "Inutile"], a: 1, exp: "Sans int(), 2026 - \"2000\" serait une TypeError." },
      { type: "input", q: "Si l'utilisateur tape 2006, que vaut <code>age</code> ?", a: "20", ph: "nombre", exp: "2026 - 2006 = 20." },
      { type: "qcm", q: "L'utilisateur tape « deux mille » : que se passe-t-il ?", opts: ["age = 0", "Une ValueError : int() ne convertit pas ce texte", "age prend la valeur 2000", "age prend la valeur None"], a: 1, exp: "D'où l'intérêt de vérifier (isdigit) ou d'attraper l'erreur (leçon 16)." },
      { type: "qcm", q: "Afficher l'âge sur exactement 3 chiffres (ex. 020) :", opts: ["f\"{age:3d}\"", "f\"{age:03d}\"", "f\"{age:.3f}\"", "str(age)"], a: 1, exp: "03d : complété à 3 chiffres avec des zéros." },
      { type: "vf", q: "En Python, l'invite peut être intégrée à input(), rendant le code plus court qu'en Java (Scanner).", a: true, exp: "input(\"...\") combine invite et lecture en une expression." }
    ],
    solution: `<pre class="pseudo">annee = int(input("Ton année de naissance ? "))   # lire la saisie + convertir en entier
age = 2026 - annee                                # traitement : calcul de l'âge
print(f"Tu as environ {age} ans")                 # affichage du résultat

# Version robuste : on vérifie AVANT de convertir
reponse = input("Année ? ")            # on lit sans convertir (on garde le texte)
if reponse.isdigit():                  # la saisie ne contient-elle que des chiffres ?
    age = 2026 - int(reponse)          # si oui : conversion sûre, puis calcul
    print(f"Environ {age} ans")        # affichage du résultat
else:                                  # sinon (saisie invalide)…
    print("Année invalide")            # …message clair au lieu d'un plantage</pre>
<p>input() + conversion + f-string : le trio interactif de Python. Demain : les conditions.</p>`
  }
};
</script>
