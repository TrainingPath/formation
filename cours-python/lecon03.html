var DAY = {
  num: 3,
  title: "Opérateurs, conversions et math",
  subtitle: "Calculer, comparer, combiner — la logique en Python.",
  theory: `
<h3>1. Arithmétique</h3>
<p>Un <strong>opérateur</strong> est un symbole qui combine des valeurs pour en produire une nouvelle (comme <code>+</code> qui additionne). Voici les opérateurs de calcul de Python :</p>
<pre class="pseudo">PSEUDOCODE    PYTHON
+ - *         + - *                  # addition, soustraction, multiplication (comme en maths)
/             /       # 7 / 2 → 3.5  # la division rend TOUJOURS un float (même 4/2 → 2.0)
DIV           //      # 7 // 2 → 3    # division ENTIÈRE : le // garde le quotient, arrondi vers le bas
MOD           %       # 7 % 2 → 1     # modulo : le RESTE de la division (7 = 3×2 + 1, reste 1)
puissance     **      # 2 ** 10 → 1024 # ** élève à la puissance (2 multiplié par lui-même 10 fois)</pre>
<div class="tip">Contrairement à Java et C#, <code>/</code> ne fait PAS de division entière : <code>7 / 2</code> vaut <code>3.5</code>, et même <code>4 / 2</code> vaut <code>2.0</code> (un float). Pour un quotient entier, utilise <code>//</code>. Un piège en moins par rapport à Java, mais une différence à connaître.</div>

<h3>2. Les raccourcis d'affectation</h3>
<p>Un <strong>raccourci d'affectation</strong> combine un calcul et un rangement dans la même variable. Au lieu d'écrire <code>n = n + 1</code>, on écrit <code>n += 1</code> : lis-le « ajoute 1 à n ».</p>
<pre class="pseudo">n = n + 1     ⇔  n += 1       # les deux font pareil : augmenter n de 1
n = n - 1     ⇔  n -= 1       # diminuer n de 1
total += prix                # ajouter prix à total (accumuler, très fréquent dans les boucles)
# Note : Python n'a PAS de n++ ni de n-- (comme en Java) → on utilise n += 1</pre>

<h3>3. Comparaisons : produire un booléen</h3>
<p>Une <strong>comparaison</strong> pose une question dont la réponse est un <strong>booléen</strong> : <code>True</code> (vrai) ou <code>False</code> (faux).</p>
<pre class="pseudo">==  !=  &lt;  &gt;  &lt;=  &gt;=        # == égal, != différent, < inférieur, > supérieur, <= et >= inclus
3 &lt; 5           # → True   # « 3 est-il plus petit que 5 ? » oui
"a" == "a"      # → True   # compare le CONTENU des chaînes, caractère par caractère
5 == 5.0        # → True   # Python compare les valeurs numériques (5 entier = 5.0 à virgule)</pre>
<p>Bon à savoir : en Python, <code>==</code> compare directement le contenu, y compris pour les chaînes (pas de piège <code>.equals</code> comme en Java). On peut même enchaîner : <code>12 &lt;= age &lt;= 17</code> teste « age entre 12 et 17 » en une seule expression.</p>

<h3>4. Les opérateurs logiques : des MOTS</h3>
<p>Les <strong>opérateurs logiques</strong> combinent plusieurs conditions (plusieurs booléens) en une seule.</p>
<pre class="pseudo">PSEUDOCODE    PYTHON
ET            and                    # vrai seulement si les DEUX conditions sont vraies
OU            or                     # vrai si AU MOINS UNE des conditions est vraie
NON           not                    # inverse le résultat : not True → False</pre>
<pre class="pseudo">ok = age &gt;= 18 and a_permis          # vrai si age ≥ 18 ET a_permis est vrai (and, pas && !)
gratuit = age &lt; 6 or age &gt;= 65       # vrai si age < 6 OU age ≥ 65 (au moins une des deux)
ferme = not ouvert                   # ferme est l'inverse de ouvert (not renverse le booléen)</pre>
<div class="warn">Différence notable avec Java/C#/PHP : les opérateurs logiques s'écrivent en toutes lettres — <code>and</code>, <code>or</code>, <code>not</code> — et non <code>&amp;&amp;</code>, <code>||</code>, <code>!</code>. Plus lisible, mais dépaysant au début.</div>

<h3>5. Le module math</h3>
<p>Un <strong>module</strong> est une boîte à outils fournie avec Python, remplie de fonctions prêtes à l'emploi. Pour l'utiliser, on l'<strong>importe</strong> une fois avec <code>import</code>.</p>
<pre class="pseudo">import math                          # charge la boîte à outils « math » (à écrire une fois, en haut du fichier)

abs(-5)          # → 5      # valeur absolue : distance à zéro (fonction intégrée, pas besoin de math)
max(3, 8)        # → 8      # renvoie le plus GRAND des arguments (intégrée)
min(3, 8)        # → 3      # renvoie le plus PETIT des arguments (intégrée)
round(5.7)       # → 6      # arrondit au nombre entier le plus proche (intégrée)
math.sqrt(16)    # → 4.0    # racine carrée (sqrt = square root) ; le « math. » désigne le module
math.floor(5.9)  # → 5      # arrondit vers le BAS (floor = plancher)
math.ceil(5.1)   # → 6      # arrondit vers le HAUT (ceil = plafond)
math.pi          # → 3.14159...  # la constante Pi, rangée dans le module math</pre>
<p><code>abs</code>, <code>max</code>, <code>min</code>, <code>round</code> sont des fonctions <strong>intégrées</strong> (disponibles sans import) ; les fonctions plus mathématiques (<code>sqrt</code>, <code>floor</code>, <code>ceil</code>, <code>pi</code>) sont dans le <strong>module</strong> <code>math</code>, qu'il faut importer et préfixer par <code>math.</code>.</p>

<h3>6. Priorités des opérateurs</h3>
<p>La <strong>priorité</strong> décide quels calculs se font en premier. Comme en mathématiques : d'abord les <strong>parenthèses</strong>, puis <code>**</code>, puis <code>* / // %</code>, puis <code>+ -</code>, puis les comparaisons, puis <code>not</code>, <code>and</code>, <code>or</code>. Dans le doute, mets des parenthèses : elles clarifient l'intention.</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste écrire <code>not</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » : il inverse chaque morceau ET échange <code>and</code> (ET) avec <code>or</code> (OU).</p>
<pre class="pseudo">not (a and b)             # NON (A ET B)...
  == (not a) or (not b)   # ...devient (NON A) OU (NON B)
not (a or b)              # NON (A OU B)...
  == (not a) and (not b)  # ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 and note &lt;= 20</code> n'est PAS <code>note &gt;= 0 or note &lt;= 20</code>, mais <code>note &lt; 0 or note &gt; 20</code>. Chaque comparaison s'inverse, et le <code>and</code> devient <code>or</code>.</p>`,
  exercises: [
    { type: "input", q: "Que vaut <code>17 % 5</code> ?", a: "2", ph: "nombre", exp: "% = le reste : 2." },

    { type: "input", q: "Que vaut <code>7 // 2</code> ?", a: "3", ph: "nombre", exp: "// = division entière (arrondi vers le bas)." },
    { type: "input", q: "Que vaut <code>2 ** 10</code> ?", a: "1024", ph: "nombre", exp: "** = puissance : 2 exposant 10." },
    { type: "qcm", q: "Comment s'écrit « ET » (logique) en Python ?", opts: ["&&", "and", "AND", "&"], a: 1, exp: "and, or, not : des mots, pas des symboles." },
    { type: "qcm", q: "Comment s'écrit « NON » en Python ?", opts: ["!", "not", "NOT", "~"], a: 1, exp: "not True → False." },
    { type: "qcm", q: "Python a-t-il l'opérateur <code>n++</code> ?", opts: ["Oui", "Non : on écrit n += 1", "Oui mais déconseillé", "Seulement pour les floats"], a: 1, exp: "Pas de ++ ni -- en Python : += 1 et -= 1." },
    { type: "qcm", q: "Comparer deux chaînes en Python :", opts: ["Il faut .equals comme Java", "== compare directement le contenu : \"a\" == \"a\" → True", "Il faut la méthode compareTo()", "Il faut utiliser is pour le contenu"], a: 1, exp: "Pas de piège equals : == compare le contenu." },
    { type: "qcm", q: "<code>12 &lt;= age &lt;= 17</code> est…", opts: ["Une erreur", "Un encadrement valide : Python permet d'enchaîner les comparaisons", "Deux instructions", "Toujours True"], a: 1, exp: "Python autorise a < b < c en une expression lisible." },
    { type: "qcm", q: "Pour utiliser <code>math.sqrt</code>, il faut d'abord…", opts: ["Rien", "import math en haut du fichier", "installer math", "déclarer sqrt"], a: 1, exp: "sqrt est dans le module math, à importer." },
    { type: "input", q: "Que vaut <code>abs(-9)</code> ?", a: "9", ph: "nombre", exp: "Valeur absolue : fonction intégrée, sans import." },
    { type: "input", q: "Que vaut <code>round(8.9)</code> ?", a: "9", ph: "nombre", exp: "round arrondit au plus proche : 9 (≠ int(8.9) qui tronque à 8)." },
    { type: "qcm", q: "<code>n % 2 == 0</code> teste…", opts: ["n positif", "n PAIR : le reste de la division par 2 est nul", "n vaut 2", "n premier"], a: 1, exp: "Le test de parité, universel." },
    { type: "input", q: "x = 5; x += 3; x *= 2. Que vaut x ?", a: "16", ph: "nombre", exp: "8 puis 16." },
    { type: "input", q: "Que vaut <code>5 + 2 * 3 ** 2</code> ? (** avant *, avant +)", a: "23", ph: "nombre", exp: "3**2=9, 2*9=18, 5+18=23 : priorités." }
  ],
  final: {
    title: "Exercice final — Le calcul de la moyenne",
    intro: `<p>On calcule une moyenne à partir de trois notes :</p>
<pre class="pseudo">n1 = 14                          # première note (entier)
n2 = 9                           # deuxième note
n3 = 16                          # troisième note
moyenne = (n1 + n2 + n3) / 3     # somme des notes divisée par 3 → un float
print(f"Moyenne : {moyenne}")    # affiche « Moyenne : 13.0 »</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>(14 + 9 + 16) / 3</code> ?", a: "13", ph: "nombre", exp: "39 / 3 = 13.0 (la division rend un float)." },
      { type: "qcm", q: "Le résultat est de type…", opts: ["int", "float : la division / rend toujours un float", "str", "bool"], a: 1, exp: "13.0 : un float, même si le résultat est « rond »." },
      { type: "qcm", q: "Pour obtenir un quotient ENTIER (partie entière de la moyenne) :", opts: ["/", "// (division entière) ou int(...)", "%", "**"], a: 1, exp: "39 // 3 = 13 (int). Ou int(moyenne) pour tronquer un float." },
      { type: "qcm", q: "Afficher la moyenne arrondie à l'entier le plus proche :", opts: ["int(moyenne)", "round(moyenne)", "floor sans import", "abs(moyenne)"], a: 1, exp: "round arrondit ; int tronquerait (12.7 → 12 au lieu de 13)." },
      { type: "input", q: "Combien de notes ≥ 10 parmi 14, 9, 16 ? (compteur mental)", a: "2", ph: "nombre", exp: "14 et 16 (le motif compteur de la leçon 6)." }
    ],
    solution: `<pre class="pseudo">moyenne = (14 + 9 + 16) / 3   # → 13.0 (un float, car / rend toujours un float)
print(round(moyenne))          # 13 : arrondi à l'entier le plus proche
print((14 + 9 + 16) // 3)      # 13 : quotient entier (division //)
# Résumé : / rend un float, // un entier, round arrondit, int tronque</pre>
<p>Quatre façons de traiter un nombre, quatre résultats parfois différents : connais-les. Demain : lire une saisie au clavier.</p>`
  }
};
</script>
