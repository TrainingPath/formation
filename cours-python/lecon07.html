<h3>1. Créer et accéder</h3>
<p>Une <strong>liste</strong> range plusieurs valeurs à la suite, dans des cases numérotées. Le numéro d'une case s'appelle son <strong>indice</strong> et commence à <strong>0</strong> (la 1re case a l'indice 0, pas 1). Contrairement aux tableaux de Java/C#, une liste Python est de taille variable ET peut mélanger les types.</p>
<pre class="pseudo">notes = [12, 8, 15, 10, 14]   # crée une liste de 5 nombres (les valeurs sont entre crochets [ ])
vide = []                     # crée une liste vide (aucun élément pour l'instant)
notes[0]                      # → 12 : lit la 1re case (indice 0)
notes[4]                      # → 14 : lit la dernière case (indice = taille - 1)
len(notes)                    # → 5 : len() donne le nombre d'éléments de la liste</pre>

<h3>2. Les indices négatifs : compter depuis la fin</h3>
<pre class="pseudo">notes[-1]                     # → 14 : l'indice -1 désigne le DERNIER élément (spécificité Python !)
notes[-2]                     # → 10 : -2 désigne l'avant-dernier, et ainsi de suite</pre>
<div class="tip">Grande commodité de Python : les indices négatifs comptent depuis la fin. <code>notes[-1]</code> donne le dernier élément sans avoir à écrire <code>notes[len(notes) - 1]</code>. Très pratique et très « pythonique ».</div>

<h3>3. Modifier une liste (elle grandit toute seule)</h3>
<p>Une <strong>méthode</strong> est une fonction attachée à un objet, qu'on appelle avec un point : <code>panier.append(...)</code> se lit « applique append à panier ».</p>
<pre class="pseudo">panier = []                   # on démarre avec une liste vide
panier.append("pomme")        # append AJOUTE à la FIN → ["pomme"]
panier.append("poire")        # ajoute encore à la fin → ["pomme", "poire"]
panier[0] = "kiwi"            # remplace l'élément d'indice 0 → ["kiwi", "poire"]
panier.insert(1, "banane")    # insère "banane" à l'indice 1 → ["kiwi", "banane", "poire"]
panier.remove("poire")        # retire la 1re occurrence de la VALEUR "poire"
dernier = panier.pop()        # retire le dernier élément ET le RENVOIE (rangé ici dans « dernier »)
"kiwi" in panier              # → True/False : l'opérateur « in » teste si la valeur est présente
panier.index("banane")        # → renvoie l'indice de la valeur "banane" (erreur si elle est absente)</pre>

<h3>4. Le découpage (slicing)</h3>
<pre class="pseudo">notes = [12, 8, 15, 10, 14]   # la liste de départ
notes[1:3]                    # → [8, 15] : les éléments de l'indice 1 INCLUS à 3 EXCLU
notes[:2]                     # → [12, 8] : du début jusqu'à l'indice 2 exclu (début omis = 0)
notes[2:]                     # → [15, 10, 14] : de l'indice 2 jusqu'à la fin (fin omise)
notes[::-1]                   # → [14, 10, 15, 8, 12] : un pas de -1 renvoie la liste INVERSÉE</pre>
<p>Le <strong>slicing</strong> (« découpage ») <code>liste[début:fin]</code> extrait une sous-liste (la borne de fin est exclue). C'est un outil très puissant pour découper, copier ou inverser une liste.</p>

<h3>5. Parcourir et les motifs classiques</h3>
<pre class="pseudo">for note in notes:            # parcourt les VALEURS de la liste, une par une (le plus simple)
    print(note)               # affiche chaque note à son tour

# SOMME (accumulateur)
total = 0                     # on part de 0
for n in notes:               # pour chaque note n…
    total += n                # …on l'ajoute au total

# MAXIMUM (« champion » provisoire)
maxi = notes[0]               # on suppose au départ que le 1er élément est le plus grand
for n in notes:               # on compare chaque note au champion actuel…
    if n &gt; maxi:              # …si n est plus grand que le champion…
        maxi = n              # …n devient le nouveau champion
# Mais Python offre aussi tout prêt : sum(notes), max(notes), min(notes), len(notes) !</pre>

<h3>6. Trier et outils natifs</h3>
<pre class="pseudo">notes.sort()                  # trie la liste SUR PLACE, en ordre croissant : notes est modifiée
notes.sort(reverse=True)      # trie sur place en ordre décroissant (reverse=True inverse le sens)
triee = sorted(notes)         # renvoie une COPIE triée, sans toucher à l'original
notes.reverse()               # inverse l'ordre des éléments sur place (sans trier)
sum(notes)                    # somme des éléments ; max(notes)/min(notes) donnent les extrêmes</pre>
