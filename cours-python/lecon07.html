var DAY = {
  num: 7,
  title: "Les listes",
  subtitle: "La structure reine de Python : souple et puissante.",
  theory: `
<h3>1. Créer et accéder</h3>
<p>Une <strong>liste</strong> range plusieurs valeurs à la suite, dans des cases numérotées. Le numéro d'une case s'appelle son <strong>indice</strong> et commence à <strong>0</strong> (la 1re case a l'indice 0, pas 1). Contrairement aux tableaux de Java/C#, une liste Python est de taille variable ET peut mélanger les types.</p>
<pre class="pseudo">notes = [12, 8, 15, 10, 14]   # crée une liste de 5 nombres (les valeurs sont entre crochets [ ])
vide = []                     # crée une liste vide (aucun élément pour l'instant)
notes[0]                      # → 12 : lit la 1re case (indice 0)
notes[4]                      # → 14 : lit la dernière case (indice = taille - 1)
len(notes)                    # → 5 : len() donne le nombre d'éléments de la liste</pre>

<h3>2. Les indices négatifs : compter depuis la fin</h3>
<pre class="pseudo">notes[-1]                     # → 14 : l'indice -1 désigne le DERNIER élément (spécificité Python !)
notes[-2]                     # → 10 : -2 désigne l'avant-dernier, et ainsi de suite</pre>
<div class="tip">Grande commodité de Python : les indices négatifs comptent depuis la fin. <code>notes[-1]</code> donne le dernier élément sans avoir à écrire <code>notes[len(notes) - 1]</code>. Très pratique et très « pythonique ».</div>

<h3>3. Modifier une liste (elle grandit toute seule)</h3>
<p>Une <strong>méthode</strong> est une fonction attachée à un objet, qu'on appelle avec un point : <code>panier.append(...)</code> se lit « applique append à panier ».</p>
<pre class="pseudo">panier = []                   # on démarre avec une liste vide
panier.append("pomme")        # append AJOUTE à la FIN → ["pomme"]
panier.append("poire")        # ajoute encore à la fin → ["pomme", "poire"]
panier[0] = "kiwi"            # remplace l'élément d'indice 0 → ["kiwi", "poire"]
panier.insert(1, "banane")    # insère "banane" à l'indice 1 → ["kiwi", "banane", "poire"]
panier.remove("poire")        # retire la 1re occurrence de la VALEUR "poire"
dernier = panier.pop()        # retire le dernier élément ET le RENVOIE (rangé ici dans « dernier »)
"kiwi" in panier              # → True/False : l'opérateur « in » teste si la valeur est présente
panier.index("banane")        # → renvoie l'indice de la valeur "banane" (erreur si elle est absente)</pre>

<h3>4. Le découpage (slicing)</h3>
<pre class="pseudo">notes = [12, 8, 15, 10, 14]   # la liste de départ
notes[1:3]                    # → [8, 15] : les éléments de l'indice 1 INCLUS à 3 EXCLU
notes[:2]                     # → [12, 8] : du début jusqu'à l'indice 2 exclu (début omis = 0)
notes[2:]                     # → [15, 10, 14] : de l'indice 2 jusqu'à la fin (fin omise)
notes[::-1]                   # → [14, 10, 15, 8, 12] : un pas de -1 renvoie la liste INVERSÉE</pre>
<p>Le <strong>slicing</strong> (« découpage ») <code>liste[début:fin]</code> extrait une sous-liste (la borne de fin est exclue). C'est un outil très puissant pour découper, copier ou inverser une liste.</p>

<h3>5. Parcourir et les motifs classiques</h3>
<pre class="pseudo">for note in notes:            # parcourt les VALEURS de la liste, une par une (le plus simple)
    print(note)               # affiche chaque note à son tour

# SOMME (accumulateur)
total = 0                     # on part de 0
for n in notes:               # pour chaque note n…
    total += n                # …on l'ajoute au total

# MAXIMUM (« champion » provisoire)
maxi = notes[0]               # on suppose au départ que le 1er élément est le plus grand
for n in notes:               # on compare chaque note au champion actuel…
    if n &gt; maxi:              # …si n est plus grand que le champion…
        maxi = n              # …n devient le nouveau champion
# Mais Python offre aussi tout prêt : sum(notes), max(notes), min(notes), len(notes) !</pre>

<h3>6. Trier et outils natifs</h3>
<pre class="pseudo">notes.sort()                  # trie la liste SUR PLACE, en ordre croissant : notes est modifiée
notes.sort(reverse=True)      # trie sur place en ordre décroissant (reverse=True inverse le sens)
triee = sorted(notes)         # renvoie une COPIE triée, sans toucher à l'original
notes.reverse()               # inverse l'ordre des éléments sur place (sans trier)
sum(notes)                    # somme des éléments ; max(notes)/min(notes) donnent les extrêmes</pre>
<div class="warn">Accéder à un indice inexistant (<code>notes[99]</code>) lève une <code>IndexError</code>. Vérifie avec <code>len()</code>, ou utilise le parcours <code>for</code> qui ne déborde jamais.</div>`,
  exercises: [
    { type: "qcm", q: "Créer une liste de trois entiers :", opts: ["notes = (5, 2, 8)", "notes = [5, 2, 8]", "int[] notes", "notes = {5, 2, 8}"], a: 1, exp: "Les crochets [ ] : la syntaxe des listes." },
    { type: "input", q: "<code>t = [7, 3, 9, 1]</code>. Que vaut <code>t[2]</code> ?", a: "9", ph: "nombre", exp: "Indices 0,1,2,3 : t[2] = 9." },
    { type: "input", q: "Que vaut <code>t[-1]</code> pour <code>t = [7, 3, 9, 1]</code> ?", a: "1", ph: "nombre", exp: "Indice négatif : -1 = le dernier élément." },
    { type: "qcm", q: "La taille d'une liste :", opts: ["t.length", "len(t)", "t.size()", "count(t)"], a: 1, exp: "len() : la fonction de longueur, valable aussi pour les chaînes." },
    { type: "qcm", q: "Ajouter un élément à la fin :", opts: ["t.add(x)", "t.append(x)", "t.push(x)", "t + x"], a: 1, exp: "append : la méthode d'ajout des listes Python." },
    { type: "input", q: "<code>p = []; p.append(5); p.append(9); p[0] = 7</code>. Que vaut <code>p[0] + p[1]</code> ?", a: "16", ph: "nombre", exp: "[7, 9] → 16." },
    { type: "qcm", q: "<code>notes[1:3]</code> retourne…", opts: ["Les indices 1, 2 et 3", "[notes[1], notes[2]] : de 1 INCLUS à 3 EXCLU", "Toute la liste", "Une erreur"], a: 1, exp: "Le slicing : fin exclue." },
    { type: "qcm", q: "<code>notes[::-1]</code> donne…", opts: ["La liste triée", "La liste INVERSÉE", "Une erreur", "Le dernier élément"], a: 1, exp: "Un pas de -1 parcourt à l'envers : la liste renversée." },
    { type: "input", q: "Que vaut <code>sum([5, 2, 8, 3])</code> ?", a: "18", ph: "nombre", exp: "sum() additionne : 18. L'accumulateur, en une fonction." },
    { type: "input", q: "Que vaut <code>max([3, 11, 7])</code> ?", a: "11", ph: "nombre", exp: "max() : le plus grand, natif." },
    { type: "qcm", q: "<code>\"pomme\" in panier</code> teste…", opts: ["La taille", "Si la valeur est PRÉSENTE dans la liste (True/False)", "L'indice", "Le type"], a: 1, exp: "L'opérateur in : la recherche, en un mot." },
    { type: "qcm", q: "Différence entre <code>notes.sort()</code> et <code>sorted(notes)</code> :", opts: ["Aucune", "sort() trie SUR PLACE (modifie notes) ; sorted() renvoie une COPIE triée", "sorted est plus lent", "sort ne trie pas"], a: 1, exp: "Sur place vs copie : à choisir selon qu'on veut garder l'original." },
    { type: "qcm", q: "<code>notes[99]</code> sur une liste de 5 éléments…", opts: ["Renvoie None", "Lève une IndexError (débordement)", "Renvoie 0", "Renvoie le dernier"], a: 1, exp: "Accès hors limites : exception. Le for, lui, ne déborde pas." },
    { type: "vf", q: "Une liste Python peut contenir des éléments de types différents (ex. [1, \"deux\", 3.0]).", a: true, exp: "Contrairement aux tableaux typés de Java/C#, une liste peut mélanger les types." },
    { type: "input", q: "<code>t = [3, 6, 9]</code>. Après <code>t.append(12)</code>, que vaut <code>len(t)</code> ?", a: "4", ph: "nombre", exp: "Un élément de plus : la liste passe de 3 à 4 cases." }
  ],
  final: {
    title: "Exercice final — La liste de courses",
    intro: `<p>On manipule une liste de courses :</p>
<pre class="pseudo">courses = ["pain", "lait", "oeufs"]   # une liste de 3 chaînes
courses.append("beurre")              # ajoute "beurre" à la fin
courses.remove("lait")                # retire la valeur "lait"
print(courses)                        # affiche la liste modifiée
print(len(courses))                   # affiche le nombre d'éléments</pre>`,
    questions: [
      { type: "qcm", q: "Après les deux opérations, que contient <code>courses</code> ?", opts: ["[pain, lait, oeufs, beurre]", "[pain, oeufs, beurre]", "[lait, oeufs]", "vide"], a: 1, exp: "append ajoute beurre, remove retire lait." },
      { type: "input", q: "Qu'affiche <code>len(courses)</code> à la fin ?", a: "3", ph: "nombre", exp: "3 éléments : pain, oeufs, beurre." },
      { type: "input", q: "Que vaut <code>courses[0]</code> à la fin ?", a: ["pain"], ph: "un mot", exp: "Le 1er élément reste « pain » (remove n'a touché que « lait »)." },
      { type: "input", q: "Que vaut <code>courses[-1]</code> à la fin ?", a: ["beurre"], ph: "un mot", exp: "Le dernier élément ajouté : « beurre »." },
      { type: "qcm", q: "Trier la liste par ordre alphabétique, sans créer de copie :", opts: ["sorted(courses)", "courses.sort()", "courses.reverse()", "courses[::-1]"], a: 1, exp: "sort() trie sur place ; sorted() créerait une copie." }
    ],
    solution: `<pre class="pseudo">courses = ["pain", "lait", "oeufs"]   # liste de départ
courses.append("beurre")        # → [pain, lait, oeufs, beurre]
courses.remove("lait")          # → [pain, oeufs, beurre]
print(courses)                  # affiche [pain, oeufs, beurre]
print(len(courses))             # affiche 3
courses.sort()                  # tri sur place (alphabétique) → [beurre, oeufs, pain]
print(courses[-1])              # affiche « pain » (le dernier après tri)</pre>
<p>append, remove, len, sort, indices négatifs : la liste est ta boîte à outils quotidienne. Demain : les fonctions.</p>`
  }
};
