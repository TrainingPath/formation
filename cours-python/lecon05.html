  title: "Conditions : if, elif, else",
  subtitle: "Faire réagir le programme selon les situations.",
  theory: `
<h3>1. if / else : le deux-points et l'indentation</h3>
<p>Une <strong>condition</strong> permet au programme de <strong>choisir</strong> quoi faire selon la situation : « si… alors… sinon… ». Un <code>if</code> (« si ») évalue une question qui vaut vrai ou faux. Si elle est vraie, le bloc <strong>indenté</strong> en dessous s'exécute ; sinon, on passe au <code>else</code> (« sinon »). Pas d'accolades : le <code>:</code> ouvre le bloc, l'indentation le délimite.</p>
<pre class="pseudo">if note &gt;= 10:                    # SI la note est supérieure ou égale à 10 (le : annonce le bloc)
    print("Réussi")              # exécuté seulement si la condition est vraie (ligne DANS le if, indentée)
else:                            # SINON (la condition était fausse)…
    print("Échoué")              # …exécuté seulement dans ce cas (ligne DANS le else)</pre>

<h3>2. La cascade : elif</h3>
<pre class="pseudo">if note &gt;= 16:                    # premier test : la note est-elle ≥ 16 ?
    print("Très bien")           # si oui : affiche « Très bien » et on saute tout le reste
elif note &gt;= 14:                 # sinon, deuxième test : ≥ 14 ? (elif = « sinon si »)
    print("Bien")                # si ce test est vrai : « Bien »
elif note &gt;= 10:                 # sinon, troisième test : ≥ 10 ?
    print("Passable")            # si vrai : « Passable »
else:                            # sinon (aucun seuil atteint)…
    print("Échoué")              # …« Échoué »</pre>
<p>Dès qu'une condition est vraie, sa branche s'exécute et les suivantes sont ignorées. L'ordre des seuils compte : on va du plus haut au plus bas. Une note de 15 échoue au test <code>&gt;= 16</code> mais réussit <code>&gt;= 14</code> → « Bien ». Noter le mot-clé <strong>elif</strong> (et non « else if » en deux mots).</p>

<h3>3. Comparaisons et logique</h3>
<pre class="pseudo">if age &gt;= 18 and a_permis:        # deux conditions reliées par « and » : les DEUX doivent être vraies
    print("Peut conduire")       # exécuté si age ≥ 18 ET a_permis est vrai
if 12 &lt;= age &lt;= 17:               # encadrement en une seule expression : age est-il entre 12 et 17 ?
    print("Adolescent")          # exécuté si age est dans l'intervalle
if reponse == "oui":              # == compare le CONTENU de la chaîne, directement
    print("D'accord")            # exécuté si reponse vaut exactement "oui"</pre>

<h3>4. Le « truthy / falsy »</h3>
<p>Dans un <code>if</code>, Python convertit toute valeur en booléen. Sont considérés comme FAUX (« falsy ») : <code>False</code>, <code>0</code>, <code>0.0</code>, <code>""</code> (chaîne vide), <code>[]</code> (liste vide), <code>{}</code> (dict vide), <code>None</code>. Tout le reste est VRAI (« truthy »).</p>
<pre class="pseudo">nom = input("Ton nom ? ")        # lit ce que tape l'utilisateur (une chaîne, éventuellement vide)
if nom:                          # vrai si nom n'est PAS vide (plus court que : if nom != "")
    print(f"Bonjour {nom}")      # exécuté quand un nom a bien été saisi
else:                            # sinon (nom était une chaîne vide, donc falsy)…
    print("Nom obligatoire")     # …on réclame une saisie</pre>

<h3>5. L'expression conditionnelle (ternaire)</h3>
<pre class="pseudo">statut = "majeur" if age &gt;= 18 else "mineur"   # range "majeur" si age ≥ 18, sinon "mineur"</pre>
<p>Le ternaire de Python se lit comme une phrase : « majeur, si age ≥ 18, sinon mineur » — c'est un raccourci pour choisir <strong>une valeur</strong> en une ligne, au lieu d'un if/else de quatre lignes.</p>

<h3>6. match (Python 3.10+) : l'alternative au switch</h3>
<pre class="pseudo">match jour:                      # examine la valeur de la variable « jour »
    case 1:                      # CAS où jour vaut 1…
        print("Lundi")           # …affiche « Lundi »
    case 2:                      # CAS où jour vaut 2…
        print("Mardi")           # …affiche « Mardi »
    case 6 | 7:                  # CAS où jour vaut 6 OU 7 (le | = « ou », regroupe des valeurs)
        print("Week-end")        # …affiche « Week-end »
    case _:                      # cas par défaut : le _ attrape TOUT le reste
        print("Jour inconnu")    # …affiché si aucune valeur ci-dessus ne correspond</pre>
<div class="tip">Python n'a pas de <code>switch</code> classique : longtemps, on utilisait des <code>if/elif</code>. Depuis Python 3.10, <code>match ... case</code> offre une alternative lisible, avec <code>|</code> pour regrouper des valeurs et <code>_</code> comme cas par défaut.</div>
<div class="warn">L'oubli du <code>:</code> après un <code>if</code>, <code>elif</code>, <code>else</code> (ou une indentation incohérente du bloc) est l'erreur n°1 : Python répond « SyntaxError » ou « IndentationError ». Le <code>:</code> et l'alignement sont la syntaxe.</div>`,

    { type: "input", q: "Écris le mot-clé qui introduit le cas par défaut d'un match : case …", a: "_", ph: "un symbole", exp: "case _ : attrape tous les cas restants." },
    { type: "qcm", q: "Dans un match, <code>case 6 | 7:</code> signifie…", opts: ["6 et 7 obligatoires", "6 OU 7 (le | regroupe des valeurs)", "une erreur", "6.7"], a: 1, exp: "Le | permet plusieurs valeurs dans un même cas." },
    { type: "qcm", q: "Qu'est-ce qui provoque l'erreur la plus fréquente sur un if ?", opts: ["Trop de conditions", "Oublier le : ou mal indenter le bloc", "Utiliser and", "Comparer des str"], a: 1, exp: "Le : et l'indentation SONT la syntaxe : leur oubli plante." },
    { type: "qcm", q: "<code>12 &lt;= age &lt;= 17</code> est…", opts: ["Une erreur", "Un encadrement valide en une expression", "Deux if", "Toujours vrai"], a: 1, exp: "Python permet d'enchaîner les comparaisons naturellement." },
    { type: "qcm", q: "age = 0. <code>if age &gt; 0: A / elif age &lt; 0: B / else: C</code> → ?", opts: ["A", "B", "C : zéro n'est ni positif ni négatif", "aucun"], a: 2, exp: "Le else final attrape le cas restant." },
    { type: "qcm", q: "« age entre 12 et 17 inclus » :", opts: ["age &gt;= 12 and age &lt;= 17", "age &gt;= 12 or age &lt;= 17", "12 &lt; age &lt; 17 seulement", "age == 12..17"], a: 0, exp: "Deux comparaisons reliées par and (ou l'encadrement 12 <= age <= 17)." },
    { type: "qcm", q: "Combien de mots pour « sinon si » en Python ?", opts: ["Deux : else if", "Un : elif", "Trois", "Zéro"], a: 1, exp: "elif, en un seul mot : différence avec Java/C#." },
    { type: "vf", q: "Depuis Python 3.10, match/case offre une alternative au switch avec _ comme défaut.", a: true, exp: "match jour: case 1: ... case _: ... — lisible et moderne." }
  ],
  final: {

<pre class="pseudo">note = int(input("Ta note sur 20 ? "))   # lit la note et la convertit en entier

      { type: "input", q: "Réécris la 2e branche pour « Admis » avec elif : elif note … 10:", a: [">= 10", ">=10"], ph: "l'opérateur", exp: "elif note >= 10: (supérieur ou égal à 10)." },
      { type: "qcm", q: "Erreur si on oublie le <code>:</code> après <code>if note &gt;= 16</code> ?", opts: ["Aucune", "Une SyntaxError : le : est obligatoire pour ouvrir le bloc", "Le programme ralentit", "Un avertissement"], a: 1, exp: "Le deux-points fait partie de la syntaxe du if." }
    ],
    solution: `<pre class="pseudo">note = int(input("Ta note sur 20 ? "))   # lecture + conversion en entier
if note &gt;= 16:                            # seuil le plus haut d'abord

elif note &gt;= 10:                          # sinon si (un seul mot) : ≥ 10

# Ordre des seuils : du plus haut au plus bas. Toujours le : et l'indentation.</pre>
<p>if / elif / else + le : + l'indentation : les fondations des décisions en Python. Demain : les boucles.</p>`
