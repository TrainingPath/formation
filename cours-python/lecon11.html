  title: "Traduire ses algorithmes en Python",
  subtitle: "Les grands classiques, en version Python.",
  theory: `
<p>Aucune nouveauté aujourd'hui : on traduit en Python les algorithmes vus en pseudocode. Un <strong>algorithme</strong> est une suite d'étapes précises pour résoudre un problème. Les motifs de raisonnement sont identiques ; la syntaxe est juste plus légère.</p>

<h3>1. Recherche séquentielle : parcourir jusqu'à trouver</h3>
<pre class="pseudo">def chercher(liste, cible):              # définit la fonction : « liste » où chercher, « cible » à trouver
    for i in range(len(liste)):          # on parcourt chaque indice i de 0 à len-1
        if liste[i] == cible:            # si l'élément à cet indice est égal à la cible…
            return i                     # …trouvé ! on renvoie l'indice tout de suite (et on sort)
    return -1                            # boucle finie sans trouver : convention -1 = « absent »</pre>
<p>Le <code>return</code> dans la boucle interrompt dès qu'on trouve. En Python, on écrit souvent plus court : <code>if cible in liste: ...</code> teste la présence, et <code>liste.index(cible)</code> donne l'indice (mais lève une erreur si absent — d'où l'intérêt de savoir écrire sa propre version).</p>

<h3>2. Position du maximum</h3>
<pre class="pseudo">def pos_max(liste):                      # renvoie l'indice du plus grand élément
    pos = 0                              # on suppose au départ que le max est en case 0
    for i in range(1, len(liste)):       # on compare à partir de la case 1
        if liste[i] &gt; liste[pos]:        # si l'élément i dépasse le champion actuel…
            pos = i                      # …nouveau champion → on retient sa position
    return pos                           # on renvoie l'INDICE du plus grand</pre>

<h3>3. Tri à bulles</h3>
<pre class="pseudo">def tri_bulles(liste):                             # trie la liste en ordre croissant
    n = len(liste)                                 # n = nombre d'éléments
    for passage in range(1, n):                    # on fait plusieurs passages sur la liste
        for i in range(n - passage):               # à chaque passage, la zone à trier rétrécit
            if liste[i] &gt; liste[i + 1]:            # si deux voisins sont dans le désordre…
                liste[i], liste[i + 1] = liste[i + 1], liste[i]   # …on les ÉCHANGE en une ligne !
    return liste                                   # renvoie la liste triée</pre>
<div class="tip">L'échange <code>liste[i], liste[i + 1] = liste[i + 1], liste[i]</code> profite du déballage de la leçon 10 : pas besoin de variable temporaire. C'est un des raccourcis les plus « pythoniques ». Rappel : une liste passée à une fonction est <strong>modifiable</strong> (elle est partagée), donc le tri agit sur l'original.</div>

<h3>4. Dichotomie (liste TRIÉE)</h3>
<pre class="pseudo">def dichotomie(liste, cible):                      # recherche rapide dans une liste TRIÉE
    gauche = 0                                     # borne gauche de la zone de recherche
    droite = len(liste) - 1                        # borne droite (dernier indice)
    while gauche &lt;= droite:                         # tant que la zone de recherche n'est pas vide
        milieu = (gauche + droite) // 2            # indice du milieu ; // = division ENTIÈRE
        if liste[milieu] == cible:                 # si l'élément du milieu est la cible…
            return milieu                          # …trouvé, on renvoie son indice
        elif liste[milieu] &lt; cible:                # sinon, si le milieu est plus petit que la cible…
            gauche = milieu + 1                    # …la cible est à DROITE : on avance la borne gauche
        else:                                      # sinon (le milieu est plus grand)…
            droite = milieu - 1                    # …la cible est à GAUCHE : on recule la borne droite
    return -1                                      # zone épuisée sans trouver : -1 = absent</pre>
<div class="warn">Le milieu doit être un entier : on utilise <code>//</code> (division entière), pas <code>/</code> (qui rendrait un float, invalide comme indice). La dichotomie n'a de sens que sur une liste <strong>triée</strong>.</div>

<h3>5. Les versions toutes faites</h3>
<pre class="pseudo">liste.sort()                 # trie sur place (algorithme optimisé fourni par Python)
triee = sorted(liste)        # renvoie une COPIE triée, sans toucher l'original
liste.index(42)              # recherche séquentielle native : renvoie l'indice (erreur si absent)
42 in liste                  # teste la présence : renvoie True/False
max(liste)  min(liste)  sum(liste)  len(liste)   # les motifs classiques, tout prêts
import bisect                # charge le module bisect (outils de dichotomie)
bisect.bisect_left(triee, 42)  # dichotomie native sur une liste déjà triée</pre>
<p>En vrai projet, on utilise <code>sorted</code>, <code>in</code>, <code>max</code>… Mais savoir ÉCRIRE ces algorithmes reste la clé pour comprendre, déboguer et réussir les examens : les outils viennent après la compréhension.</p>`,
  exercises: [
    { type: "input", q: "<code>chercher([8, 3, 15, 6], 15)</code> retourne… ?", a: "2", ph: "nombre", exp: "15 est à l'indice 2 (0-indexé)." },
    { type: "input", q: "<code>chercher([8, 3, 15, 6], 7)</code> retourne… ?", a: "-1", ph: "nombre", exp: "Absent → -1 par convention." },
    { type: "qcm", q: "Pourquoi renvoyer -1 (et pas 0) pour « absent » ?", opts: ["Par simple habitude, sans vraie raison", "0 est un indice VALIDE (le 1er élément) : -1 est le seul code impossible", "Pour que la fonction déclenche une exception", "Parce que 0 est déjà réservé aux erreurs"], a: 1, exp: "-1 n'est jamais un indice réel de la liste." },
    { type: "input", q: "<code>pos_max([14, 9, 17, 11])</code> retourne… ?", a: "2", ph: "nombre", exp: "Le max 17 est à l'indice 2." },
    { type: "qcm", q: "L'échange <code>liste[i], liste[i+1] = liste[i+1], liste[i]</code> utilise…", opts: ["Une variable temporaire cachée", "Le DÉBALLAGE de tuple : échange sans variable temporaire", "Une copie temporaire de la liste", "La fonction sorted() en coulisses"], a: 1, exp: "L'élégance Python (leçon 10) appliquée au tri." },
    { type: "qcm", q: "Le tri à bulles modifie-t-il la liste passée à la fonction ?", opts: ["Non, il travaille sur une copie", "Oui : une liste est partagée (mutable), le tri agit sur l'original", "Seulement si la liste est déjà presque triée", "Non, il renvoie toujours une nouvelle liste"], a: 1, exp: "Les listes sont mutables : la fonction travaille sur le même objet." },
    { type: "qcm", q: "Dans la dichotomie, pourquoi <code>//</code> pour le milieu ?", opts: ["Par pur choix d'écriture", "Un indice doit être un ENTIER : / rendrait un float, invalide", "Parce que // est plus rapide que /", "Pour arrondir le milieu vers le haut"], a: 1, exp: "(g + d) / 2 donnerait 2.5 ; il faut // pour un indice." },
    { type: "qcm", q: "La dichotomie exige…", opts: ["N'importe quelle liste, triée ou non", "Une liste TRIÉE", "Une liste sans aucun doublon", "Une liste de nombres uniquement"], a: 1, exp: "Elle divise l'intervalle en deux : ne marche que si trié." },
    { type: "qcm", q: "Équivalent natif de <code>chercher</code> :", opts: ["liste.find()", "liste.index(x) — ou « x in liste » pour un booléen", "sorted(x)", "max(x)"], a: 1, exp: "index() donne l'indice ; in teste la présence." },
    { type: "qcm", q: "Différence entre <code>liste.sort()</code> et <code>sorted(liste)</code> :", opts: ["Les deux modifient la liste d'origine", "sort() trie SUR PLACE ; sorted() renvoie une COPIE triée", "sort() renvoie une copie, sorted() trie sur place", "sorted() n'existe pas en Python"], a: 1, exp: "Sur place vs copie : selon qu'on veut garder l'original." },
    { type: "input", q: "<code>dichotomie([2, 5, 8, 11, 14], 11)</code> retourne… ?", a: "3", ph: "nombre", exp: "11 est à l'indice 3 (liste triée)." },
    { type: "qcm", q: "Pourquoi savoir écrire ces algos si <code>sorted</code>/<code>in</code> existent ?", opts: ["Pour se compliquer la vie inutilement", "Comprendre le coût, déboguer, réussir les examens, et les cas non couverts", "Parce que les fonctions natives sont souvent buguées", "Parce que sorted et in sont plus lents à l'usage"], a: 1, exp: "Les outils viennent APRÈS la compréhension." },
    { type: "input", q: "Que vaut <code>sum([5, 2, 8, 3])</code> ?", a: "18", ph: "nombre", exp: "L'accumulateur, en une fonction native." },
    { type: "qcm", q: "<code>42 in liste</code> retourne…", opts: ["L'indice de 42", "True ou False (présence)", "42", "-1"], a: 1, exp: "in donne un booléen ; index() donne l'indice." },
    { type: "vf", q: "En Python, on peut échanger deux éléments d'une liste sans variable temporaire.", a: true, exp: "a, b = b, a grâce au déballage de tuple." }
  ],
  final: {
    title: "Exercice final — Chercher et trier",
    intro: `<p>On travaille sur une liste de scores :</p>
<pre class="pseudo">scores = [42, 17, 88, 30, 65]   # une liste de 5 scores, dans le désordre
print(max(scores))              # affiche le plus grand score
scores.sort()                   # trie la liste sur place (ordre croissant)
print(scores)                   # affiche la liste triée
print(88 in scores)             # affiche True/False : 88 est-il présent ?</pre>`,
    questions: [
      { type: "input", q: "Qu'affiche <code>max(scores)</code> ?", a: "88", ph: "nombre", exp: "Le plus grand score." },
      { type: "qcm", q: "Après <code>scores.sort()</code>, que contient la liste ?", opts: ["[42, 17, 88, 30, 65] : la liste reste inchangée", "[17, 30, 42, 65, 88] : triée croissant, sur place", "[88, 65, 42, 30, 17] : triée en ordre décroissant", "une copie triée, l'originale restant en désordre"], a: 1, exp: "sort() modifie la liste elle-même." },
      { type: "qcm", q: "Qu'affiche <code>88 in scores</code> ?", opts: ["True", "False", "4", "88"], a: 0, exp: "88 est présent : True." },
      { type: "qcm", q: "Pour la position de 88 dans la liste triée :", opts: ["scores.find(88)", "scores.index(88)", "88 in scores", "max(scores)"], a: 1, exp: "index(88) donne l'indice ; ici 4 (le dernier)." },
      { type: "input", q: "Après le tri, que vaut <code>scores[-1]</code> ?", a: "88", ph: "nombre", exp: "Le dernier élément d'une liste triée croissant = le maximum." }
    ],
    solution: `<pre class="pseudo">scores = [42, 17, 88, 30, 65]   # liste de départ
print(max(scores))           # 88 (le plus grand)
scores.sort()                # trie sur place → [17, 30, 42, 65, 88]

print(88 in scores)          # True (88 est présent)
print(scores.index(88))      # 4 (position de 88 après tri)
print(scores[-1])            # 88 (le dernier = le max après tri)</pre>
<p>Les algorithmes, en Python, tiennent en quelques lignes ; les natifs (sort, in, max) en une seule. Demain : la POO.</p>`
  }
};
