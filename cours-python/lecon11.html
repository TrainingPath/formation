  theory: `
<p>Aucune nouveauté aujourd'hui : on traduit en Python les algorithmes vus en pseudocode. Un <strong>algorithme</strong> est une suite d'étapes précises pour résoudre un problème. Les motifs de raisonnement sont identiques ; la syntaxe est juste plus légère.</p>

<h3>1. Recherche séquentielle : parcourir jusqu'à trouver</h3>
<pre class="pseudo">def chercher(liste, cible):              # définit la fonction : « liste » où chercher, « cible » à trouver
    for i in range(len(liste)):          # on parcourt chaque indice i de 0 à len-1
        if liste[i] == cible:            # si l'élément à cet indice est égal à la cible…
            return i                     # …trouvé ! on renvoie l'indice tout de suite (et on sort)
    return -1                            # boucle finie sans trouver : convention -1 = « absent »</pre>
<p>Le <code>return</code> dans la boucle interrompt dès qu'on trouve. En Python, on écrit souvent plus court : <code>if cible in liste: ...</code> teste la présence, et <code>liste.index(cible)</code> donne l'indice (mais lève une erreur si absent — d'où l'intérêt de savoir écrire sa propre version).</p>

<h3>2. Position du maximum</h3>
<pre class="pseudo">def pos_max(liste):                      # renvoie l'indice du plus grand élément
    pos = 0                              # on suppose au départ que le max est en case 0
    for i in range(1, len(liste)):       # on compare à partir de la case 1
        if liste[i] &gt; liste[pos]:        # si l'élément i dépasse le champion actuel…
            pos = i                      # …nouveau champion → on retient sa position
    return pos                           # on renvoie l'INDICE du plus grand</pre>

<h3>3. Tri à bulles</h3>
<pre class="pseudo">def tri_bulles(liste):                             # trie la liste en ordre croissant
    n = len(liste)                                 # n = nombre d'éléments
    for passage in range(1, n):                    # on fait plusieurs passages sur la liste
        for i in range(n - passage):               # à chaque passage, la zone à trier rétrécit
            if liste[i] &gt; liste[i + 1]:            # si deux voisins sont dans le désordre…
                liste[i], liste[i + 1] = liste[i + 1], liste[i]   # …on les ÉCHANGE en une ligne !
    return liste                                   # renvoie la liste triée</pre>
<div class="tip">L'échange <code>liste[i], liste[i + 1] = liste[i + 1], liste[i]</code> profite du déballage de la leçon 10 : pas besoin de variable temporaire. C'est un des raccourcis les plus « pythoniques ». Rappel : une liste passée à une fonction est <strong>modifiable</strong> (elle est partagée), donc le tri agit sur l'original.</div>

<h3>4. Dichotomie (liste TRIÉE)</h3>
<pre class="pseudo">def dichotomie(liste, cible):                      # recherche rapide dans une liste TRIÉE
    gauche = 0                                     # borne gauche de la zone de recherche
    droite = len(liste) - 1                        # borne droite (dernier indice)
    while gauche &lt;= droite:                         # tant que la zone de recherche n'est pas vide
        milieu = (gauche + droite) // 2            # indice du milieu ; // = division ENTIÈRE
        if liste[milieu] == cible:                 # si l'élément du milieu est la cible…
            return milieu                          # …trouvé, on renvoie son indice
        elif liste[milieu] &lt; cible:                # sinon, si le milieu est plus petit que la cible…
            gauche = milieu + 1                    # …la cible est à DROITE : on avance la borne gauche
        else:                                      # sinon (le milieu est plus grand)…
            droite = milieu - 1                    # …la cible est à GAUCHE : on recule la borne droite
    return -1                                      # zone épuisée sans trouver : -1 = absent</pre>
<div class="warn">Le milieu doit être un entier : on utilise <code>//</code> (division entière), pas <code>/</code> (qui rendrait un float, invalide comme indice). La dichotomie n'a de sens que sur une liste <strong>triée</strong>.</div>

<h3>5. Les versions toutes faites</h3>
<pre class="pseudo">liste.sort()                 # trie sur place (algorithme optimisé fourni par Python)
triee = sorted(liste)        # renvoie une COPIE triée, sans toucher l'original
liste.index(42)              # recherche séquentielle native : renvoie l'indice (erreur si absent)
42 in liste                  # teste la présence : renvoie True/False
max(liste)  min(liste)  sum(liste)  len(liste)   # les motifs classiques, tout prêts
import bisect                # charge le module bisect (outils de dichotomie)
bisect.bisect_left(triee, 42)  # dichotomie native sur une liste déjà triée</pre>
<p>En vrai projet, on utilise <code>sorted</code>, <code>in</code>, <code>max</code>… Mais savoir ÉCRIRE ces algorithmes reste la clé pour comprendre, déboguer et réussir les examens : les outils viennent après la compréhension.</p>`,
