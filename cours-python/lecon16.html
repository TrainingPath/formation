  title: "Les exceptions",
  subtitle: "Gérer l'imprévu sans faire planter le programme.",
  theory: `
<h3>1. Qu'est-ce qu'une exception ?</h3>
<p>Tu en as déjà croisé : <code>ValueError</code> (int("abc")), <code>IndexError</code> (liste[99]), <code>ZeroDivisionError</code>… Une <strong>exception</strong> est un signal d'alarme lancé par Python quand une opération rencontre une situation anormale. Non traitée, elle interrompt brutalement le programme avec un message d'erreur (le <em>traceback</em>, la trace de l'erreur).</p>

<h3>2. try / except : attraper l'erreur</h3>
<pre class="pseudo">try:                                   # « essaie » : bloc de code RISQUÉ à surveiller
    n = int(input("Un nombre ? "))     # peut lancer ValueError si l'utilisateur tape « abc »
    print(100 / n)                     # peut lancer ZeroDivisionError si n vaut 0
except ValueError:                     # « en cas de » ValueError : ce bloc s'exécute alors
    print("Ce n'est pas un nombre !")  # message adapté à cette erreur précise
except ZeroDivisionError:              # autre filet, pour la division par zéro
    print("Division par zéro !")       # message adapté à cette autre erreur
print("La vie continue")               # après avoir géré l'erreur, le programme SURVIT et continue</pre>
<p>Si une ligne du <code>try</code> lève une exception, le reste du <code>try</code> est abandonné et Python saute au <code>except</code> du bon type, puis continue après le bloc.</p>

<h3>3. else et finally</h3>
<pre class="pseudo">try:                                   # bloc surveillé
    n = int(input("Nombre ? "))        # tentative de lecture + conversion
except ValueError:                     # si la conversion échoue…
    print("Saisie invalide")           # …message d'erreur
else:                                  # else : exécuté SEULEMENT si aucune exception n'a eu lieu
    print(f"Merci, {n}")               # affiché quand tout s'est bien passé
finally:                               # finally : exécuté DANS TOUS LES CAS (erreur ou non)
    print("Fin de la tentative")       # utile pour un nettoyage garanti</pre>
<p>Le <code>else</code> s'exécute quand le <code>try</code> a réussi sans erreur. Le <code>finally</code> s'exécute toujours (erreur ou non) : idéal pour libérer une ressource (fermer un fichier).</p>

<h3>4. Attraper le message</h3>
<pre class="pseudo">try:                                   # bloc surveillé
    resultat = 10 / 0                  # provoque une ZeroDivisionError
except ZeroDivisionError as e:         # « as e » range l'objet exception dans la variable e
    print(f"Erreur : {e}")             # affiche le message de e : « division by zero »</pre>

<h3>5. Lancer soi-même : raise</h3>
<pre class="pseudo">def retirer(solde, montant):           # fonction de retrait d'argent
    if montant &gt; solde:                # si on demande plus que le solde disponible…
        raise ValueError("Solde insuffisant")   # …on LANCE nous-même une exception
    return solde - montant             # sinon : on renvoie le nouveau solde

# L'appelant décide : attraper l'erreur ou la laisser remonter
try:                                   # on surveille l'appel risqué
    retirer(100, 200)                  # 200 > 100 → déclenche le raise ci-dessus
except ValueError as e:                # on attrape l'exception lancée
    print(e)                           # affiche « Solde insuffisant »</pre>

<h3>6. Le grand classique : sécuriser une saisie</h3>
<pre class="pseudo">while True:                            # on répète indéfiniment jusqu'à obtenir un nombre valide
    try:                               # bloc surveillé
        age = int(input("Ton âge ? "))  # tentative de lecture + conversion
        break                          # atteint SEULEMENT si int() a réussi → on quitte la boucle
    except ValueError:                 # si int() a échoué (saisie non numérique)…
        print("Entre un nombre entier, s'il te plaît.")  # …on redemande poliment</pre>
<div class="tip">Le placement du <code>break</code> est la clé : il est APRÈS <code>int(input(...))</code>. Si la conversion échoue, l'exception saute le <code>break</code> et la boucle recommence. L'utilisateur peut se tromper, le programme redemande poliment.</div>
<div class="warn">Exceptions courantes : <code>ValueError</code> (conversion ratée), <code>ZeroDivisionError</code> (÷0), <code>IndexError</code> (indice de liste hors limites), <code>KeyError</code> (clé de dictionnaire absente), <code>TypeError</code> (types incompatibles), <code>FileNotFoundError</code> (fichier absent). Ne mets jamais un <code>except:</code> nu et vide qui avalerait tout en silence.</div>`,
  exercises: [
    { type: "qcm", q: "Une exception non attrapée…", opts: ["Affiche un simple avertissement", "Interrompt le programme avec un message d'erreur (traceback)", "Est ignorée silencieusement", "Redémarre le programme au début"], a: 1, exp: "Le traceback indique le type et la ligne fautive : lis-le." },
    { type: "qcm", q: "Le bloc <code>try</code> contient…", opts: ["La réaction", "Le code RISQUÉ à surveiller", "La fermeture des fichiers", "Les imports"], a: 1, exp: "try = essaie ; except = si ça éclate, réagis." },
    { type: "qcm", q: "<code>int(\"abc\")</code> lance…", opts: ["ZeroDivisionError", "ValueError", "IndexError", "TypeError"], a: 1, exp: "Le texte→nombre impossible : ValueError." },
    { type: "qcm", q: "<code>10 / 0</code> lance…", opts: ["ValueError", "ZeroDivisionError", "TypeError", "OverflowError"], a: 1, exp: "Division par zéro." },

    { type: "qcm", q: "Le bloc <code>else</code> d'un try/except s'exécute…", opts: ["Toujours, comme finally", "SI le try a réussi sans exception", "Seulement en cas d'erreur", "Seulement si le bloc except est absent"], a: 1, exp: "else = « tout s'est bien passé »." },
    { type: "qcm", q: "<code>except ValueError as e:</code> — à quoi sert <code>as e</code> ?", opts: ["À rien, c'est décoratif", "À récupérer l'objet exception (son message via {e})", "À relancer automatiquement l'erreur", "À renommer le type d'exception"], a: 1, exp: "e contient les détails de l'erreur." },
    { type: "qcm", q: "<code>raise ValueError(\"...\")</code> sert à…", opts: ["Attraper", "LANCER soi-même une exception quand une règle est violée", "Ignorer", "Créer un objet normal"], a: 1, exp: "raise signale activement une erreur à l'appelant." },
    { type: "qcm", q: "Dans la boucle de saisie sécurisée, le <code>break</code> est APRÈS <code>int(input())</code> car…", opts: ["Style", "Si int() échoue, l'exception saute le break : on reste dans la boucle et on redemande", "Le break devrait plutôt être avant int()", "Le placement du break n'a aucun effet"], a: 1, exp: "Le placement fait toute la logique." },
    { type: "qcm", q: "Accéder à une clé absente d'un dictionnaire lève…", opts: ["ValueError", "KeyError", "IndexError", "AttributeError"], a: 1, exp: "KeyError : la clé n'existe pas (leçon 18)." },
    { type: "qcm", q: "Pourquoi éviter un <code>except:</code> nu et vide ?", opts: ["Il ralentit", "Il AVALE toutes les erreurs en silence : un bug devient introuvable", "Il ne compile pas", "Il double l'erreur"], a: 1, exp: "Toujours cibler un type et au moins afficher/gérer." },
    { type: "qcm", q: "L'utilisateur tape « 0 » et on calcule 100/n. Quel except se déclenche ?", opts: ["ValueError", "ZeroDivisionError : « 0 » se convertit bien, c'est la division qui échoue", "Les deux", "Aucun"], a: 1, exp: "Chaque except attrape SON type d'erreur." },
    { type: "vf", q: "En Python, try/except permet de continuer le programme après une erreur gérée.", a: true, exp: "Le programme survit : il reprend après le bloc try/except." },
    { type: "qcm", q: "Alternative à try/except pour une saisie : vérifier avant avec…", opts: ["reponse.isdigit() (leçon 4)", "int() directement, sans vérifier", "type(reponse) == int", "float() à la place de int()"], a: 0, exp: "isdigit() vérifie avant de convertir ; try/except gère l'imprévisible." }
  ],
  final: {
    title: "Exercice final — La division sécurisée",
    intro: `<p>On protège un petit calcul :</p>
<pre class="pseudo">try:                                   # bloc surveillé
    a = int(input("Numérateur ? "))    # lecture + conversion du numérateur

except ValueError:                     # si une conversion échoue…
    print("Entre des nombres entiers.")  # …message d'erreur de saisie
except ZeroDivisionError:              # si on divise par zéro…
    print("On ne divise pas par zéro !") # …message adapté</pre>`,
    questions: [
      { type: "qcm", q: "L'utilisateur tape « dix » pour le numérateur. Que se passe-t-il ?", opts: ["a = 10", "ValueError → « Entre des nombres entiers. »", "Le programme plante", "Résultat : 0"], a: 1, exp: "int(\"dix\") échoue : le except ValueError gère." },
      { type: "qcm", q: "L'utilisateur tape 10 puis 0. Quel message ?", opts: ["Résultat : 0", "« On ne divise pas par zéro ! » (ZeroDivisionError)", "ValueError sur la saisie", "Résultat : infini"], a: 1, exp: "« 0 » se convertit bien ; c'est 10/0 qui lève l'erreur." },
      { type: "qcm", q: "L'utilisateur tape 10 puis 2. Qu'affiche-t-on ?", opts: ["Un message d'erreur", "« Résultat : 5.0 »", "« Résultat : 5 » (division entière)", "« Résultat : 20 » (10 × 2)"], a: 1, exp: "Aucune exception : le try réussit, / rend un float (5.0)." },
      { type: "qcm", q: "Pour afficher le MESSAGE de l'erreur, on écrirait :", opts: ["except ZeroDivisionError:", "except ZeroDivisionError as e: print(e)", "except: print", "raise"], a: 1, exp: "« as e » puis print(e) donne le détail de l'exception." },
      { type: "vf", q: "Sans le try/except, taper « dix » ferait planter tout le programme.", a: true, exp: "Une exception non gérée interrompt l'exécution." }
    ],
    solution: `<pre class="pseudo">try:                                   # bloc surveillé
    a = int(input("Numérateur ? "))    # lecture + conversion
    b = int(input("Dénominateur ? "))  # lecture + conversion
    print(f"Résultat : {a / b}")       # division
except ValueError:                     # saisie non numérique
    print("Entre des nombres entiers.")
except ZeroDivisionError as e:         # division par zéro (on récupère le message)
    print(f"Erreur : {e}")             # affiche « division by zero »

# Saisie robuste en boucle :
while True:                            # répète jusqu'à une saisie valide
    try:                               # bloc surveillé
        age = int(input("Âge ? "))     # lecture + conversion
        break                          # sort si la conversion a réussi
    except ValueError:                 # sinon…
        print("Nombre invalide, réessaie.")  # …on redemande</pre>
<p>try/except/else/finally, raise, saisie sécurisée : ton code résiste à l'imprévu. Demain : lire et écrire des fichiers.</p>`
  }
