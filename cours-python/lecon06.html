<h3>1. while : tant que la condition tient</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois sans le recopier. Le <code>while</code> (« tant que ») teste sa condition AVANT chaque tour : si elle est fausse dès le départ, le corps n'est jamais exécuté.</p>
<pre class="pseudo">i = 1                        # INITIALISATION : on crée le compteur i AVANT la boucle
while i &lt;= 5:                # TANT QUE i est ≤ 5 : le : ouvre le bloc indenté qui suit
    print(i)                 # affiche la valeur actuelle de i (1, puis 2, … jusqu'à 5)
    i += 1                   # PROGRESSION : ajoute 1 à i (sans cette ligne, i reste 1 → boucle infinie !)</pre>
<div class="warn">Python n'a pas de <code>do...while</code>. Pour « au moins un tour », on utilise une boucle <code>while True</code> avec un <code>break</code> à l'intérieur (voir section 5).</div>

<h3>2. for : parcourir une séquence</h3>
<p>Le <code>for</code> de Python ne compte pas : il <strong>parcourt</strong> directement les éléments d'une séquence (liste, chaîne, plage…). Une <strong>séquence</strong> est une suite ordonnée de valeurs. C'est le for-each des autres langages, en version universelle.</p>
<pre class="pseudo">for note in [12, 8, 15]:     # POUR CHAQUE valeur de la liste, rangée tour à tour dans « note »…
    print(note)              # …affiche note : d'abord 12, puis 8, puis 15

for lettre in "abc":         # une chaîne est aussi une séquence : elle se parcourt caractère par caractère
    print(lettre)            # affiche a, puis b, puis c</pre>

<h3>3. range : générer une plage de nombres</h3>
<p><code>range</code> fabrique une <strong>plage</strong> de nombres à parcourir, sans avoir à écrire la liste à la main.</p>
<pre class="pseudo">for i in range(5):           # range(5) fournit 0, 1, 2, 3, 4 (le 5 est EXCLU !)
    print(i)                 # affiche successivement 0, 1, 2, 3, 4
for i in range(1, 6):        # range(début, fin) → 1, 2, 3, 4, 5 (la fin, 6, est exclue)
    print(i)                 # affiche 1, 2, 3, 4, 5
for i in range(0, 101, 5):   # range(début, fin, pas) → 0, 5, 10, … 100 (avance de 5 en 5)
    print(i)                 # affiche 0, 5, 10, …, 100
for i in range(10, 0, -1):   # pas négatif (-1) → compte à REBOURS : 10, 9, … 1
    print(i)                 # affiche 10, 9, 8, …, 1</pre>
<div class="warn">Piège capital : <code>range(n)</code> s'arrête à <code>n - 1</code> (la borne haute est EXCLUE). <code>range(1, 6)</code> donne 1 à 5, pas 1 à 6. Le même « ±1 » qu'ailleurs : compte bien tes bornes.</div>

<h3>4. Les motifs classiques (accumulateur, compteur)</h3>
<p>Un <strong>accumulateur</strong> est une variable qui grandit à chaque tour ; un <strong>compteur</strong> compte les tours où une condition est vraie.</p>
<pre class="pseudo"># ACCUMULATEUR : somme des entiers de 1 à n
total = 0                                # on part de 0 (l'accumulateur, avant la boucle)
for i in range(1, n + 1):                # 1 à n inclus → n+1 car la borne haute est exclue !
    total += i                           # on ajoute i au total à chaque tour

# COMPTEUR CONDITIONNEL : combien de pairs de 1 à 100 ?
nb_pairs = 0                             # le compteur, à zéro au départ
for i in range(1, 101):                  # parcourt 1 à 100 (101 exclu)
    if i % 2 == 0:                       # si i est pair (reste nul dans la division par 2)…
        nb_pairs += 1                    # …on incrémente le compteur de 1</pre>
<p>Remarque le <code>n + 1</code> dans <code>range(1, n + 1)</code> : puisque la borne haute est exclue, il faut aller « un cran plus loin » pour inclure <code>n</code>.</p>

<h3>5. break, continue et le while True</h3>
<pre class="pseudo">for x in valeurs:                        # parcourt chaque valeur x de la séquence « valeurs »
    if x &lt; 0:                            # si x est négatif…
        continue                         # …passe directement au tour SUIVANT (ignore ce x)
    if x == 99:                          # si x vaut 99…
        break                            # …SORT complètement de la boucle
    print(x)                             # sinon : affiche x

# « au moins un tour » (remplace le do-while absent) :
while True:                              # boucle « infinie » : la condition est toujours vraie…
    reponse = input("Mot de passe ? ")   # on lit une saisie à chaque tour
    if reponse == "secret":              # si le mot de passe est correct…
        break                            # …on sort de la boucle avec break</pre>

<h3>6. Choisir sa boucle</h3>
<pre class="pseudo">Parcourir une liste/chaîne         → for x in sequence
Répéter un nombre connu de fois    → for i in range(n)
Nombre de tours inconnu            → while condition
« Au moins un tour »               → while True + break</pre>
