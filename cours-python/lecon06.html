  subtitle: "Répéter une action sans se répéter.",
  theory: `
<h3>1. while : tant que la condition tient</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois sans le recopier. Le <code>while</code> (« tant que ») teste sa condition AVANT chaque tour : si elle est fausse dès le départ, le corps n'est jamais exécuté.</p>
<pre class="pseudo">i = 1                        # INITIALISATION : on crée le compteur i AVANT la boucle
while i &lt;= 5:                # TANT QUE i est ≤ 5 : le : ouvre le bloc indenté qui suit
    print(i)                 # affiche la valeur actuelle de i (1, puis 2, … jusqu'à 5)
    i += 1                   # PROGRESSION : ajoute 1 à i (sans cette ligne, i reste 1 → boucle infinie !)</pre>
<div class="warn">Python n'a pas de <code>do...while</code>. Pour « au moins un tour », on utilise une boucle <code>while True</code> avec un <code>break</code> à l'intérieur (voir section 5).</div>

<h3>2. for : parcourir une séquence</h3>
<p>Le <code>for</code> de Python ne compte pas : il <strong>parcourt</strong> directement les éléments d'une séquence (liste, chaîne, plage…). Une <strong>séquence</strong> est une suite ordonnée de valeurs. C'est le for-each des autres langages, en version universelle.</p>
<pre class="pseudo">for note in [12, 8, 15]:     # POUR CHAQUE valeur de la liste, rangée tour à tour dans « note »…
    print(note)              # …affiche note : d'abord 12, puis 8, puis 15

for lettre in "abc":         # une chaîne est aussi une séquence : elle se parcourt caractère par caractère
    print(lettre)            # affiche a, puis b, puis c</pre>

<h3>3. range : générer une plage de nombres</h3>
<p><code>range</code> fabrique une <strong>plage</strong> de nombres à parcourir, sans avoir à écrire la liste à la main.</p>
<pre class="pseudo">for i in range(5):           # range(5) fournit 0, 1, 2, 3, 4 (le 5 est EXCLU !)
    print(i)                 # affiche successivement 0, 1, 2, 3, 4
for i in range(1, 6):        # range(début, fin) → 1, 2, 3, 4, 5 (la fin, 6, est exclue)
    print(i)                 # affiche 1, 2, 3, 4, 5
for i in range(0, 101, 5):   # range(début, fin, pas) → 0, 5, 10, … 100 (avance de 5 en 5)
    print(i)                 # affiche 0, 5, 10, …, 100
for i in range(10, 0, -1):   # pas négatif (-1) → compte à REBOURS : 10, 9, … 1
    print(i)                 # affiche 10, 9, 8, …, 1</pre>
<div class="warn">Piège capital : <code>range(n)</code> s'arrête à <code>n - 1</code> (la borne haute est EXCLUE). <code>range(1, 6)</code> donne 1 à 5, pas 1 à 6. Le même « ±1 » qu'ailleurs : compte bien tes bornes.</div>

<h3>4. Les motifs classiques (accumulateur, compteur)</h3>
<p>Un <strong>accumulateur</strong> est une variable qui grandit à chaque tour ; un <strong>compteur</strong> compte les tours où une condition est vraie.</p>
<pre class="pseudo"># ACCUMULATEUR : somme des entiers de 1 à n
total = 0                                # on part de 0 (l'accumulateur, avant la boucle)
for i in range(1, n + 1):                # 1 à n inclus → n+1 car la borne haute est exclue !
    total += i                           # on ajoute i au total à chaque tour

# COMPTEUR CONDITIONNEL : combien de pairs de 1 à 100 ?
nb_pairs = 0                             # le compteur, à zéro au départ
for i in range(1, 101):                  # parcourt 1 à 100 (101 exclu)
    if i % 2 == 0:                       # si i est pair (reste nul dans la division par 2)…
        nb_pairs += 1                    # …on incrémente le compteur de 1</pre>
<p>Remarque le <code>n + 1</code> dans <code>range(1, n + 1)</code> : puisque la borne haute est exclue, il faut aller « un cran plus loin » pour inclure <code>n</code>.</p>

<h3>5. break, continue et le while True</h3>
<pre class="pseudo">for x in valeurs:                        # parcourt chaque valeur x de la séquence « valeurs »
    if x &lt; 0:                            # si x est négatif…
        continue                         # …passe directement au tour SUIVANT (ignore ce x)
    if x == 99:                          # si x vaut 99…
        break                            # …SORT complètement de la boucle
    print(x)                             # sinon : affiche x

# « au moins un tour » (remplace le do-while absent) :
while True:                              # boucle « infinie » : la condition est toujours vraie…
    reponse = input("Mot de passe ? ")   # on lit une saisie à chaque tour
    if reponse == "secret":              # si le mot de passe est correct…
        break                            # …on sort de la boucle avec break</pre>

<h3>6. Choisir sa boucle</h3>
<pre class="pseudo">Parcourir une liste/chaîne         → for x in sequence
Répéter un nombre connu de fois    → for i in range(n)
Nombre de tours inconnu            → while condition
« Au moins un tour »               → while True + break</pre>
<div class="tip">Astuce : pour parcourir une liste AVEC l'indice, utilise <code>enumerate</code> : <code>for i, valeur in enumerate(liste):</code> te donne la position <code>i</code> ET la valeur à chaque tour.</div>`,

    { type: "qcm", q: "Python possède-t-il une boucle <code>do...while</code> ?", opts: ["Oui, avec un bloc do ... while", "Non : on utilise while True + break pour « au moins un tour »", "Oui, avec repeat ... until", "Seulement depuis la version 3.10"], a: 1, exp: "Pas de do-while ; le motif while True + break le remplace." },
    { type: "input", q: "Que vaut s ?<pre class=\"pseudo\">s = 0\nfor i in range(1, 5):\n    s += i</pre>", a: "10", ph: "nombre", exp: "range(1,5) = 1,2,3,4 → 1+2+3+4 = 10." },
    { type: "qcm", q: "<code>continue</code> dans une boucle…", opts: ["Sort de la boucle", "Passe immédiatement au tour SUIVANT", "Termine le programme", "Répète le tour"], a: 1, exp: "continue saute le reste du corps pour ce tour." },
    { type: "qcm", q: "<code>break</code> dans une boucle…", opts: ["Passe au tour suivant", "SORT complètement de la boucle", "Relance la boucle depuis le premier tour", "Interrompt seulement l'instruction en cours"], a: 1, exp: "break interrompt et quitte la boucle." },
    { type: "qcm", q: "Quel est le bug ?<pre class=\"pseudo\">i = 1\nwhile i &lt;= 5:\n    print(i)</pre>", opts: ["i devrait être initialisé à 0", "Boucle infinie : il manque i += 1 (rien ne progresse)", "La condition i &lt;= 5 est mal écrite", "Il faudrait un for au lieu d'un while"], a: 1, exp: "Initialiser, tester, PROGRESSER : la règle universelle." },
    { type: "qcm", q: "<code>range(10, 0, -1)</code> produit…", opts: ["1, 2, 3, … 10 (ordre croissant)", "10, 9, 8, … 1 : un compte à rebours (pas négatif)", "0 à 10", "10, 9, 8, … 0 (0 inclus)"], a: 1, exp: "Le 3e argument est le pas ; -1 fait décroître." },
    { type: "input", q: "Combien de multiples de 7 entre 1 et 30 ? (7, 14, 21, 28)", a: "4", ph: "nombre", exp: "Le compteur conditionnel : i % 7 == 0 est vrai 4 fois." },
    { type: "qcm", q: "Parcourir « bonjour » caractère par caractère :", opts: ["for c in range(\"bonjour\")", "for c in \"bonjour\":", "for i in range(len(\"bonjour\")): c = i", "for c in \"bonjour\".chars()"], a: 1, exp: "Une chaîne est une séquence : le for la parcourt directement." },
    { type: "qcm", q: "<code>enumerate(liste)</code> sert à…", opts: ["Trier la liste avant de la parcourir", "Obtenir l'INDICE et la valeur à chaque tour : for i, v in enumerate(liste)", "Compter le nombre d'éléments de la liste", "Parcourir la liste à l'envers"], a: 1, exp: "Le for-each avec la position, quand on en a besoin." },
    { type: "vf", q: "« Redemander un mot de passe jusqu'à ce qu'il soit correct » se fait bien avec while True + break.", a: true, exp: "Au moins un essai, sortie sur succès : le motif du do-while absent." }
  ],
  final: {

    intro: `<p>On affiche la table de 7 :</p>
<pre class="pseudo">for i in range(1, 11):              # i prend les valeurs 1 à 10 (11 exclu)
    print(f"7 x {i} = {7 * i}")     # affiche « 7 x i = résultat » à chaque tour</pre>`,

      { type: "qcm", q: "Pourquoi <code>range(1, 11)</code> et non <code>range(1, 10)</code> ?", opts: ["Pour commencer le compte à 1 plutôt qu'à 0", "La borne haute est EXCLUE : pour aller jusqu'à 10, il faut 11", "Parce que range compte toujours un cran de moins", "Pour que la boucle s'arrête après 11 tours"], a: 1, exp: "Le piège du ±1 : range(1,10) s'arrêterait à 9." },
      { type: "input", q: "Qu'affiche la dernière ligne ?", a: ["7 x 10 = 70", "7x10=70"], ph: "le texte", exp: "Pour i = 10 : « 7 x 10 = 70 »." },
      { type: "qcm", q: "Pour une table complète de 1 à 10 (dix tables), il faudrait…", opts: ["Un seul for suffirait", "Deux boucles for imbriquées : une pour la table, une pour les lignes", "Un while avec un seul compteur", "Une seule compréhension de liste"], a: 1, exp: "for t in range(1,11): for i in range(1,11): ... — des boucles imbriquées." },
      { type: "input", q: "Somme de tous les résultats de la table de 7 (7×1 + … + 7×10) ? (7 × 55)", a: "385", ph: "nombre", exp: "7 × (1+2+…+10) = 7 × 55 = 385 : l'accumulateur." }
    ],
    solution: `<pre class="pseudo">for i in range(1, 11):          # i de 1 à 10 (11 exclu)
    print(f"7 x {i} = {7 * i}")  # affiche chaque ligne de la table de 7

# Avec accumulateur de la somme :
total = 0                        # l'accumulateur, avant la boucle
for i in range(1, 11):           # parcourt 1 à 10
    total += 7 * i               # ajoute chaque produit au total
print(f"Somme : {total}")        # affiche 385</pre>
<p>for + range + f-string : le trio des répétitions en Python. Demain : les listes, la structure reine.</p>`
