<script>
var DAY = {
  num: 9,
  title: "La pile (push, pop)",
  subtitle: "Une zone mémoire en LIFO pour sauvegarder des registres, passer des arguments et stocker le local.",
  theory: `
<h3>1. Qu'est-ce que la pile ?</h3>
<p>Rappel : un <strong>registre</strong> est une case ultra-rapide dans le processeur, mais il y en a très peu. La <strong>mémoire</strong> (la RAM) est bien plus grande mais un peu plus lente ; on y accède par une <strong>adresse</strong> (un numéro qui désigne un emplacement).</p>
<p>Les registres sont peu nombreux. La <strong>pile</strong> (<em>stack</em>) est une zone de mémoire où l'on met des valeurs « de côté » temporairement. Elle fonctionne en <strong>LIFO</strong> (<em>Last In, First Out</em> = dernier entré, premier sorti), comme une pile d'assiettes : on ne peut retirer que celle du dessus. Le registre <code>rsp</code> (<em>stack pointer</em>, pointeur de pile) contient toujours l'adresse du <strong>sommet</strong> de la pile.</p>

<h3>2. push et pop</h3>
<p><strong>Empiler</strong> (<code>push</code>) = poser une valeur sur le sommet. <strong>Dépiler</strong> (<code>pop</code>) = retirer la valeur du sommet et la mettre dans un registre.</p>
<pre class="pseudo">push rax           ; empile rax : rsp -= 8 (on descend), puis [rsp] = rax (on ecrit au sommet)
pop rbx            ; depile dans rbx : rbx = [rsp] (on lit le sommet), puis rsp += 8 (on remonte)</pre>
<div class="warn">La pile <strong>croît vers le bas</strong> : <code>push</code> <em>diminue</em> <code>rsp</code> de 8 (un quad word = 8 octets = 64 bits). L'ordre des <code>pop</code> est l'<strong>inverse</strong> de celui des <code>push</code>.</div>
<p>Notation : <code>[rsp]</code> signifie « la valeur en mémoire à l'adresse contenue dans rsp ». Un <strong>octet</strong> est un paquet de 8 bits ; un <strong>quad word</strong> (mot quadruple) fait 8 octets, la taille d'un registre 64 bits — d'où le pas de 8.</p>

<h3>3. Sauvegarder un registre</h3>
<pre class="pseudo">    mov rax, 44         ; place une valeur precieuse (44) dans rax
    push rax            ; la mettre a l'abri sur la pile
    mov rax, 999        ; on reutilise rax pour autre chose (44 serait perdu sans le push)
    ; ...               ; ... du travail qui se sert de rax ...
    pop rax             ; on recupere 44 depuis la pile (rax vaut de nouveau 44)</pre>
<p>Usage typique : préserver une valeur pendant qu'on a besoin du registre pour autre chose.</p>

<h3>4. À quoi sert la pile ?</h3>
<pre class="pseudo">1. sauvegarder des registres (comme ci-dessus)
2. passer des arguments (au-delà des 6 registres, ou par convention)
3. stocker les variables LOCALES d'une fonction
4. mémoriser l'adresse de RETOUR d'un call (leçon 10)</pre>
<p>Une <strong>fonction</strong> est un petit sous-programme réutilisable ; ses <strong>variables locales</strong> n'existent que pendant son exécution. L'<strong>adresse de retour</strong> est l'endroit où reprendre le programme une fois la fonction terminée.</p>

<h3>5. Les trois cibles</h3>
<p>Le principe de la pile existe partout, mais les instructions changent selon l'<strong>architecture</strong> (la famille de processeur).</p>
<pre class="pseudo">NASM   push rax ; pop rbx                    ; instructions dediees push/pop (x86)
AT&amp;T   pushq %rax ; popq %rbx                ; meme chose, syntaxe AT&amp;T (suffixe q = 64 bits)
ARM64  str x0, [sp, -16]! ; ldr x1, [sp], 16  ; pas de push/pop : on ajuste sp a la main avec str/ldr</pre>
<div class="warn">L'ARM64 n'a <strong>pas</strong> d'instructions <code>push</code>/<code>pop</code> : on ajuste manuellement le pointeur de pile (<code>sp</code>) et on utilise <code>str</code>/<code>ldr</code> (souvent <code>stp</code>/<code>ldp</code> par paires). Autre contrainte ARM64 : <code>sp</code> doit rester aligné sur 16 octets.</div>
<div class="tip">La pile est au cœur du fonctionnement des fonctions : chaque appel y réserve son espace et y range son adresse de retour. Comprendre <code>push</code>/<code>pop</code> et <code>rsp</code>, c'est comprendre comment les programmes s'organisent en mémoire.</div>`,
  exercises: [
    { type: "qcm", q: "La pile fonctionne en…", opts: ["FIFO", "LIFO (dernier entré, premier sorti)", "au hasard", "tri croissant"], a: 1, exp: "Comme une pile d'assiettes." },
    { type: "qcm", q: "Quel registre pointe le sommet de la pile ?", opts: ["rax", "rsp", "rbp", "rdi"], a: 1, exp: "Stack pointer." },
    { type: "qcm", q: "<code>push rax</code> fait…", opts: ["rsp += 8 puis lit", "rsp -= 8 puis [rsp] = rax", "rax = 0", "rien"], a: 1, exp: "La pile croît vers le bas." },
    { type: "qcm", q: "<code>pop rbx</code> fait…", opts: ["empile rbx", "rbx = [rsp] puis rsp += 8", "rbx = 0", "efface la pile"], a: 1, exp: "Dépile." },
    { type: "qcm", q: "La pile croît…", opts: ["vers le haut", "vers le bas (rsp diminue)", "sur les côtés", "elle ne bouge pas"], a: 1, exp: "push diminue rsp." },
    { type: "qcm", q: "L'ordre des pop par rapport aux push est…", opts: ["identique", "inversé (LIFO)", "aléatoire", "trié"], a: 1, exp: "Dernier entré, premier sorti." },
    { type: "qcm", q: "Un push/pop déplace rsp de…", opts: ["1 octet", "8 octets (un quad word)", "4 octets", "16 octets"], a: 1, exp: "64 bits." },
    { type: "qcm", q: "La pile sert notamment à…", opts: ["afficher", "sauvegarder des registres, passer des arguments, le local, l'adresse de retour", "additionner", "comparer"], a: 1, exp: "Rôle central." },
    { type: "qcm", q: "L'adresse de retour d'un call est stockée…", opts: ["dans rax", "sur la pile", "dans un fichier", "nulle part"], a: 1, exp: "Leçon 10." },
    { type: "qcm", q: "L'ARM64 a-t-il des instructions push/pop dédiées ?", opts: ["oui", "non : on ajuste sp et on utilise str/ldp", "seulement push", "seulement pop"], a: 1, exp: "Différence d'architecture." },
    { type: "vf", q: "En ARM64, sp doit rester aligné sur 16 octets.", a: true, exp: "Contrainte d'alignement." },
    { type: "qcm", q: "Pourquoi sauvegarder un registre avant de le réutiliser ?", opts: ["esthétique", "pour ne pas perdre sa valeur précieuse", "accélérer", "aucune raison"], a: 1, exp: "push puis pop." },
    { type: "qcm", q: "Après <code>push 44 ; mov rax,999 ; pop rax</code>, rax vaut…", opts: ["999", "44", "0", "l'adresse"], a: 1, exp: "On récupère la valeur empilée." },
    { type: "qcm", q: "stp / ldp en ARM64 manipulent…", opts: ["un octet", "des paires de registres sur la pile", "des flottants seulement", "l'écran"], a: 1, exp: "Store/Load Pair." },
    { type: "qcm", q: "Comprendre la pile aide à comprendre…", opts: ["l'affichage", "le fonctionnement des fonctions (appels)", "les templates", "le réseau"], a: 1, exp: "Chaque appel y réserve son espace." }
  ],
  final: {
    title: "Exercice final — Échanger via la pile",
    intro: `<p>On veut échanger rax et rbx en passant par la pile. Analyse :</p>
<pre class="pseudo">    push rax           ; empile rax : pile = [rax]
    push rbx           ; empile rbx : pile = [rax][rbx] (rbx au sommet)
    pop rax            ; depile le sommet (rbx) dans rax : rax = ancien rbx
    pop rbx            ; depile le suivant (rax) dans rbx : rbx = ancien rax</pre>`,
    questions: [
      { type: "qcm", q: "Après les deux push, l'ordre au sommet (du haut) est…", opts: ["rax puis rbx", "rbx (dernier poussé) au sommet", "vide", "trié"], a: 1, exp: "LIFO : rbx en haut." },
      { type: "qcm", q: "Le premier pop (pop rax) récupère…", opts: ["l'ancien rax", "l'ancien rbx (dernier poussé)", "0", "l'adresse"], a: 1, exp: "Sommet = rbx." },
      { type: "qcm", q: "Ce code réalise-t-il l'échange voulu ?", opts: ["oui, correctement", "oui : rax reçoit l'ancien rbx, rbx l'ancien rax", "non, il duplique", "non, il plante"], a: 1, exp: "L'inversion LIFO fait l'échange." },
      { type: "qcm", q: "La pile revient-elle à son état initial (rsp) ?", opts: ["non", "oui : 2 push puis 2 pop équilibrent rsp", "elle déborde", "elle fuit"], a: 1, exp: "Autant de pop que de push." },
      { type: "qcm", q: "Une alternative sans pile :", opts: ["push seul", "xchg rax, rbx (instruction d'échange)", "add", "cmp"], a: 1, exp: "xchg échange deux opérandes." }
    ],
    solution: `<pre class="pseudo">; échanger rax et rbx via la pile (LIFO) :
    push rax            ; empile rax -> pile : [rax]
    push rbx            ; empile rbx -> pile : [rax][rbx] (rbx au sommet)
    pop  rax            ; depile le sommet dans rax -> rax = ancien rbx
    pop  rbx            ; depile le suivant dans rbx -> rbx = ancien rax
; l'inversion LIFO realise bien l'echange, et rsp est retabli (2 push, 2 pop).
; Plus direct : xchg rax, rbx   ; instruction qui echange deux operandes en une fois</pre>
<p>Deux <code>push</code> puis deux <code>pop</code> inversent l'ordre (LIFO) : c'est un échange, et la pile est équilibrée. Demain : les fonctions et la convention d'appel.</p>`
  }
};
</script>
