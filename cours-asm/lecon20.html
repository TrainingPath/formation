<script>
var DAY = {
  num: 20,
  title: "Projet guidé : un utilitaire complet",
  subtitle: "Assembler les briques : un programme qui lit, calcule et affiche — entièrement en assembleur.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>utilitaire</strong> est un petit programme qui rend un service précis. Le nôtre s'utilise <strong>en ligne de commande</strong> (dans un terminal) : il affiche une <strong>bannière</strong> (une ligne de titre), additionne les prix d'un catalogue rangé en mémoire, puis affiche le total. On mobilise <code>write</code> (ou <code>printf</code>), une boucle avec <strong>adressage indexé</strong> (parcourir un tableau), et l'affichage d'un nombre (via <code>printf</code>, plus simple). <code>printf</code> est une fonction de la <strong>libc</strong> (la bibliothèque standard du C) qui affiche du texte formaté.</p>

<h3>2. Structure du programme</h3>
<p>Un programme assembleur se découpe en <strong>sections</strong> : <code>.data</code> contient les données initialisées (textes, nombres), <code>.text</code> contient le code. <code>db</code> = « define byte » (réserve des octets, ici du texte) ; <code>dq</code> = « define quad » (réserve des mots de 8 octets). <code>global main</code> rend l'étiquette <code>main</code> visible pour l'<strong>éditeur de liens</strong> (le programme qui assemble les morceaux en exécutable) ; <code>extern printf</code> annonce que <code>printf</code> vient d'ailleurs (la libc).</p>
<pre class="pseudo">section .data                                   ; section des donnees initialisees
    banniere db "=== La Ludotheque ===", 10, 0   ; texte du titre ; 10 = saut de ligne, 0 = fin de chaine
    fmt      db "Total du catalogue : %d", 10, 0  ; format pour printf (%d = un entier a afficher)
    prix     dq 44, 12, 39, 20                    ; tableau de 4 prix, chacun sur 8 octets (dq)
section .text                                    ; section du code executable
    global main                                  ; rendre main visible pour l'editeur de liens (gcc)
    extern printf                                ; declarer printf, fournie par la libc</pre>

<h3>3. La bannière et la somme</h3>
<p><code>lea rdi, [banniere]</code> charge l'<strong>adresse</strong> de la bannière (pas son contenu) dans <code>rdi</code>, le 1er argument attendu par <code>printf</code>. <code>xor eax, eax</code> met <code>eax</code> à 0 : astuce rapide pour dire à <code>printf</code> (fonction <strong>variadique</strong>, à nombre d'arguments variable) qu'aucun argument flottant n'est passé.</p>
<pre class="pseudo">main:
    push rbp            ; prologue : sauver rbp et aligner la pile sur 16 octets (requis avant call)
    ; 1) afficher la bannière avec printf (%s implicite via la chaîne)   ; etape 1 : le titre
    lea rdi, [banniere] ; 1er argument de printf : adresse de la banniere
    xor eax, eax        ; 0 registre vectoriel (printf est variadique)
    call printf         ; appeler printf pour afficher la banniere
    ; 2) sommer le catalogue                                            ; etape 2 : additionner les prix
    xor r12, r12        ; total = 0 (r12 est callee-saved : il survivra a l'appel de printf)
    xor rbx, rbx        ; index = 0 (position dans le tableau)
    mov rcx, 4          ; compteur de boucle : 4 elements a parcourir
.som:
    add r12, [prix + rbx*8]   ; total += prix[index] (adressage indexe, *8 car chaque dq fait 8 octets)
    inc rbx             ; index++ (element suivant)
    dec rcx             ; compteur-- (un element de moins)
    jnz .som            ; si compteur != 0, revenir a .som (boucler)</pre>

<h3>4. Afficher le total</h3>
<pre class="pseudo">    lea rdi, [fmt]      ; 1er argument : adresse du format "Total : %d\\n"
    mov rsi, r12        ; 2e argument : la valeur a afficher (le total accumule)
    xor eax, eax        ; 0 registre vectoriel (printf variadique)
    call printf         ; appeler printf pour afficher le total
    pop rbp             ; epilogue : restaurer rbp
    xor eax, eax        ; return 0 : code de sortie du programme
    ret                 ; revenir (fin de main), rend la main au systeme
# nasm -f elf64 u.asm -o u.o && gcc u.o -o u -no-pie && ./u   # assembler, lier avec la libc, executer</pre>
<div class="warn">On accumule le total dans <code>r12</code> (registre <strong>callee-saved</strong>, c'est-à-dire préservé par les fonctions appelées) : ainsi il survit à l'appel de <code>printf</code>, qui pourrait écraser les registres <strong>caller-saved</strong> comme <code>rax</code>, <code>rcx</code>, <code>rsi</code> (registres que l'appelant doit sauver lui-même s'il y tient). Choisir le bon registre selon la convention évite des bugs subtils.</div>

<h3>5. Ce qu'on a mobilisé</h3>
<div class="tip">Sections données/code, appel de la libc (printf), boucle avec adressage indexé, gestion des registres selon la convention, alignement de la pile (l'ABI exige que la pile soit alignée sur 16 octets au moment d'un <code>call</code>). Ce petit programme fait, en assembleur, ce qu'un <code>printf</code> + une boucle <code>for</code> feraient en trois lignes de C — et te montre exactement le travail que le compilateur fait pour toi.</div>`,
  exercises: [
    { type: "qcm", q: "L'utilitaire mobilise notamment…", opts: ["uniquement exit", "affichage, boucle indexée, appel libc", "un seul mov", "aucune boucle"], a: 1, exp: "Synthèse du cours." },
    { type: "qcm", q: "Pourquoi accumuler le total dans r12 ?", opts: ["au hasard", "r12 est callee-saved : il survit à l'appel de printf", "il est plus rapide", "obligatoire"], a: 1, exp: "printf peut écraser les caller-saved." },
    { type: "qcm", q: "printf pourrait écraser…", opts: ["r12", "les registres caller-saved (rax, rcx, rsi…)", "rien", "la pile entière"], a: 1, exp: "D'où le choix de r12." },
    { type: "qcm", q: "La bannière s'affiche avec…", opts: ["exit", "printf (ou write)", "add", "cmp"], a: 1, exp: "Sortie texte." },
    { type: "qcm", q: "La somme utilise l'adressage…", opts: ["direct", "indexé [prix + rbx*8]", "aléatoire", "aucun"], a: 1, exp: "Parcours de tableau." },
    { type: "qcm", q: "Avant call printf, on met eax à 0 car…", opts: ["retour 0", "printf est variadique (0 registre vectoriel)", "vider", "aucune raison"], a: 1, exp: "Convention." },
    { type: "qcm", q: "La valeur à afficher (%d) va dans…", opts: ["rdi", "rsi", "rax", "r12 seulement"], a: 1, exp: "2e argument de printf." },
    { type: "qcm", q: "Le point d'entrée avec la libc est…", opts: ["_start", "main (lié avec gcc)", "printf", "start"], a: 1, exp: "gcc fournit _start." },
    { type: "qcm", q: "push rbp au début sert à…", opts: ["afficher", "aligner la pile sur 16 octets", "trier", "additionner"], a: 1, exp: "Avant les call." },
    { type: "qcm", q: "Ce programme équivaut, en C, à…", opts: ["100 lignes", "un printf + une boucle for (3 lignes)", "une classe", "un fichier"], a: 1, exp: "Le compilateur fait tout ça." },
    { type: "vf", q: "Choisir un registre callee-saved protège une valeur d'un appel de fonction.", a: true, exp: "r12 survit à printf." },
    { type: "qcm", q: "La somme de {44,12,39,20} affichée est…", opts: ["100", "115", "95", "44"], a: 1, exp: "115." },
    { type: "qcm", q: "On lie ce programme avec…", opts: ["ld seul", "gcc (car on utilise printf)", "nasm seul", "make"], a: 1, exp: "libc." },
    { type: "qcm", q: "La boucle .som s'arrête après…", opts: ["1 tour", "4 tours (rcx=4)", "115 tours", "jamais"], a: 1, exp: "4 éléments." },
    { type: "qcm", q: "Ce projet montre concrètement…", opts: ["rien", "le travail qu'un compilateur fait pour toi", "comment trier", "le réseau"], a: 1, exp: "Sous le capot du C." }
  ],
  final: {
    title: "Exercice final — Corriger l'utilitaire",
    intro: `<p>On accumule le total dans rbx (caller-saved) au lieu de r12. Analyse :</p>
<pre class="pseudo">    xor rbx, rbx        ; total = 0 (mais rbx est-il le bon choix ?)
.som:
    add rbx, [prix + rcx*8]   ; total += prix[index] (adressage indexe)
    ; ...                      ; suite de la boucle (index++, compteur--, jnz)
    lea rdi, [fmt]      ; 1er argument de printf : le format
    mov rsi, rbx        ; 2e argument : le total accumule
    call printf         ; printf écrase-t-il rbx ? (question a se poser)</pre>`,
    questions: [
      { type: "qcm", q: "rbx est-il caller-saved ou callee-saved ?", opts: ["caller-saved", "callee-saved (préservé par les fonctions appelées)", "ni l'un ni l'autre", "d'écran"], a: 1, exp: "rbx est callee-saved : printf le préservera." },
      { type: "qcm", q: "Du coup, utiliser rbx pour le total est…", opts: ["dangereux", "correct : printf le préserve (mais il faut le sauver dans le prologue si on le modifie)", "impossible", "interdit"], a: 1, exp: "rbx survit à printf." },
      { type: "qcm", q: "Un registre à ÉVITER pour survivre à printf :", opts: ["r12", "rax/rcx/rsi (caller-saved, écrasables)", "rbx", "r13"], a: 1, exp: "Non préservés." },
      { type: "qcm", q: "Si on utilise rbx (callee-saved), la fonction doit…", opts: ["rien", "le sauver au prologue (push rbx) et le restaurer (pop rbx)", "l'ignorer", "l'afficher"], a: 1, exp: "Ne pas voler l'appelant." },
      { type: "qcm", q: "La leçon générale :", opts: ["peu importe le registre", "choisir le registre selon la convention (survie aux appels)", "tout mettre sur la pile", "éviter printf"], a: 1, exp: "caller/callee-saved." }
    ],
    solution: `<pre class="pseudo">main:
    push rbp            ; prologue : sauver rbp, aligner la pile
    push r12            ; on va utiliser r12 (callee-saved) : le preserver avant de l'ecraser
    ; ... bannière ...   ; ici on afficherait la banniere
    xor r12, r12        ; total = 0 (survivra a printf)
    xor rbx, rbx        ; index = 0
    mov rcx, 4          ; compteur : 4 elements
.som:
    add r12, [prix + rbx*8]   ; total += prix[index] (adressage indexe *8)
    inc rbx             ; index++
    dec rcx             ; compteur--
    jnz .som            ; reboucler tant que compteur != 0
    lea rdi, [fmt]      ; 1er argument printf : le format
    mov rsi, r12        ; total intact malgre l'appel precedent (r12 est callee-saved)
    xor eax, eax        ; 0 registre vectoriel (printf variadique)
    call printf         ; afficher le total
    pop r12             ; restaurer r12 (rendu a l'appelant)
    pop rbp             ; restaurer rbp
    xor eax, eax        ; code de sortie 0
    ret                 ; fin de main</pre>
<p>On accumule dans un registre <strong>callee-saved</strong> (r12, sauvé au prologue) pour qu'il survive à <code>printf</code>. Choisir le bon registre selon la convention est essentiel. Demain : l'examen final.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l20", title: "Afficher la moyenne du catalogue", level: 3,
    statement: "Écris un programme qui somme un tableau de 4 prix (dq 44,12,39,20), divise par 4 pour la moyenne, et l'affiche avec printf (« Moyenne : %d\\n »). Accumule dans un registre callee-saved. Donne la commande de liaison.",
    hints: [
      "Somme dans r12 (callee-saved) via une boucle indexée.",
      "Moyenne : mov rax, r12 ; xor rdx, rdx ; mov rbx, 4 ; idiv rbx.",
      "printf : lea rdi,[fmt] ; mov rsi, rax ; xor eax,eax ; call printf. Lier avec gcc -no-pie."
    ],
    solution: "section .data\n    fmt  db \"Moyenne : %d\", 10, 0   ; format printf (%d = entier, 10 = saut de ligne, 0 = fin de chaine)\n    prix dq 44, 12, 39, 20           ; tableau de 4 prix, 8 octets chacun (dq)\nsection .text\n    global main                      ; rendre main visible pour l'editeur de liens (gcc)\n    extern printf                    ; declarer printf (libc)\nmain:\n    push rbp                         ; prologue : sauver rbp, aligner la pile\n    push r12                         ; sauver r12 (callee-saved) car on va l'utiliser\n    xor r12, r12        ; total = 0 (r12 survit aux appels de fonction)\n    xor rbx, rbx                     ; index = 0\n    mov rcx, 4                       ; compteur : 4 elements\n.som:\n    add r12, [prix + rbx*8]          ; total += prix[index] (adressage indexe *8)\n    inc rbx                          ; index++\n    dec rcx                          ; compteur--\n    jnz .som                         ; reboucler tant que compteur != 0\n    mov rax, r12        ; mettre le total (115) dans rax pour la division\n    xor rdx, rdx        ; rdx = 0 : partie haute du dividende (obligatoire avant idiv)\n    mov rbx, 4                       ; diviseur = 4\n    idiv rbx            ; rax = 115 / 4 = 28 (moyenne entiere)\n    lea rdi, [fmt]                   ; 1er argument printf : adresse du format\n    mov rsi, rax        ; 2e argument : la valeur pour %d (la moyenne)\n    xor eax, eax                     ; 0 registre vectoriel (printf variadique)\n    call printf                      ; afficher la moyenne\n    pop r12                          ; restaurer r12\n    pop rbp                          ; restaurer rbp\n    xor eax, eax                     ; code de sortie 0\n    ret                              ; fin de main\n# nasm -f elf64 m.asm -o m.o && gcc m.o -o m -no-pie && ./m   # assembler, lier (libc), executer\n#  ->  Moyenne : 28   # sortie attendue",
    note: "Ce programme réunit tout le cours : boucle indexée, accumulation dans un registre callee-saved (préservé pour survivre à printf), division avec préparation de rdx, et appel de la libc avec alignement de pile. C'est un vrai utilitaire, entièrement en assembleur." }
  ]
};
</script>
