<script>
var DAY = {
  num: 19,
  title: "Optimisation et code généré",
  subtitle: "Comparer -O0 et -O2 : ce que fait un compilateur optimiseur, et pourquoi rarement le battre.",
  theory: `
<h3>1. -O0 vs -O2</h3>
<p>Le <strong>compilateur</strong> (l'outil qui traduit le C en code machine, ici <code>gcc</code>) accepte des niveaux d'<strong>optimisation</strong> : « optimiser » veut dire produire un code qui fait la même chose, mais plus vite ou plus court. On les choisit avec l'option <code>-O</code> suivie d'un chiffre. Ces lignes sont des commandes du terminal (commentaire shell avec <code>#</code>) :</p>
<pre class="pseudo">gcc -S -O0 f.c     # -O0 : traduction littérale, verbeuse (chaque variable posée sur la pile)
gcc -S -O2 f.c     # -O2 : optimisé (valeurs gardées en registres, calculs simplifiés, code réduit)</pre>
<p>En <strong>-O0</strong>, le compilateur traduit fidèlement, sans chercher l'efficacité (idéal pour apprendre et déboguer). En <strong>-O2</strong>, il <strong>optimise</strong> : garder les valeurs dans les <strong>registres</strong> (bien plus rapides que la mémoire), éliminer le code inutile, simplifier les calculs.</p>

<h3>2. Un exemple frappant</h3>
<p>Voici la même fonction compilée aux deux niveaux, côte à côte. À gauche le -O0 (long), à droite le -O2 (compact) :</p>
<pre class="pseudo">/* C */  int f(int p, int j) { return p * j; }   // renvoie le produit p × j

; -O0 (extrait, verbeux)          ; -O2 (optimisé)
    push rbp                      mov eax, edi     ; -O0 installe un cadre de pile ; -O2 met p (edi) dans eax
    mov  rbp, rsp                 imul eax, esi    ; -O0 finit le prologue ; -O2 multiplie eax par j (esi)
    mov  [rbp-4], edi             ret              ; -O0 range p sur la pile ; -O2 a fini (résultat dans eax)
    mov  [rbp-8], esi                              ; -O0 range j sur la pile
    mov  eax, [rbp-4]                              ; -O0 recharge p dans eax
    imul eax, [rbp-8]                              ; -O0 multiplie eax par j
    pop  rbp                                       ; -O0 défait le cadre de pile
    ret                                            ; -O0 renvoie (résultat dans eax)</pre>
<p>La version <strong>-O2</strong> tient en 3 instructions (tout en registres, aucune pile), contre une dizaine en -O0. Même résultat, beaucoup moins de travail.</p>

<h3>3. Des optimisations classiques</h3>
<p>Voici quelques transformations que l'optimiseur applique automatiquement :</p>
<pre class="pseudo">- garder les variables en registres (pas d'aller-retour en mémoire)   ; registres = plus rapides que la pile
- remplacer x*2 par x&lt;&lt;1, x*8 par x&lt;&lt;3 (décalages de bits)             ; un décalage remplace une multiplication
- calculer à la compilation ce qui est constant (2+3 → 5)             ; « constant folding »
- supprimer le code mort (jamais atteint ou sans effet)               ; « dead code elimination »
- « inliner » de petites fonctions (les insérer directement)          ; évite le coût d'un appel</pre>

<h3>4. Peut-on battre le compilateur ?</h3>
<div class="warn">Rarement. Les compilateurs modernes optimisent extrêmement bien le code courant. Écrire de l'assembleur à la main n'a d'intérêt que sur des <strong>points très précis</strong> : instructions <strong>vectorielles</strong> (SIMD, qui traitent plusieurs données d'un coup), code cryptographique à temps constant, cœurs de boucles ultra-critiques. Pour 99 % du code, <code>-O2</code> fait mieux qu'un humain.</div>

<h3>5. À quoi sert alors l'assembleur ?</h3>
<div class="tip">À <strong>comprendre</strong> (ce que fait ton programme), <strong>déboguer</strong> (au plus bas niveau), <strong>lire</strong> le code généré ou du code hérité, travailler sur des <strong>systèmes contraints</strong> (embarqué, noyaux, pilotes), et écrire les rares fragments où l'humain apporte quelque chose. Savoir lire l'assembleur optimisé est une compétence précieuse ; en écrire beaucoup, un besoin rare.</div>`,
  exercises: [
    { type: "qcm", q: "-O0 produit un code…", opts: ["optimisé", "littéral et verbeux (variables sur la pile)", "vide", "en binaire"], a: 1, exp: "Traduction fidèle." },
    { type: "qcm", q: "-O2 produit un code…", opts: ["plus long", "optimisé (registres, code réduit)", "identique à -O0", "faux"], a: 1, exp: "Efficace." },
    { type: "qcm", q: "Une optimisation classique :", opts: ["tout mettre sur la pile", "garder les valeurs en registres", "ajouter du code mort", "ralentir"], a: 1, exp: "Éviter la mémoire." },
    { type: "qcm", q: "x*8 peut être optimisé en…", opts: ["x+8", "x << 3 (décalage)", "x-8", "x/8"], a: 1, exp: "Décalage rapide." },
    { type: "qcm", q: "2+3 dans le code peut être…", opts: ["calculé à l'exécution", "calculé à la compilation (→ 5)", "ignoré", "erreur"], a: 1, exp: "Constant folding." },
    { type: "qcm", q: "Le « code mort » est…", opts: ["gardé", "supprimé par l'optimiseur", "exécuté deux fois", "affiché"], a: 1, exp: "Jamais atteint / sans effet." },
    { type: "qcm", q: "« Inliner » une fonction, c'est…", opts: ["la supprimer", "l'insérer directement à l'appel (éviter le call)", "l'afficher", "la trier"], a: 1, exp: "Optimisation." },
    { type: "qcm", q: "Peut-on souvent battre le compilateur à la main ?", opts: ["oui, facilement", "rarement (les compilateurs optimisent très bien)", "toujours", "jamais possible de lire"], a: 1, exp: "-O2 fait mieux dans 99 % des cas." },
    { type: "qcm", q: "L'assembleur manuel a du sens surtout pour…", opts: ["tout le code", "des points très précis (SIMD, crypto, cœurs critiques)", "les sites web", "les bases de données"], a: 1, exp: "Cas rares." },
    { type: "qcm", q: "La version -O2 de <code>p*j</code> tient en…", opts: ["une dizaine d'instructions", "environ 3 instructions (tout en registres)", "0", "100"], a: 1, exp: "Bien plus court." },
    { type: "vf", q: "Savoir LIRE l'assembleur optimisé est plus utile que d'en écrire beaucoup.", a: true, exp: "Compréhension > écriture massive." },
    { type: "qcm", q: "Pourquoi -O0 garde les variables en mémoire ?", opts: ["pour la vitesse", "pour une traduction fidèle et débogable, sans optimiser", "par erreur", "pour trier"], a: 1, exp: "Lisible pour apprendre/déboguer." },
    { type: "qcm", q: "L'assembleur reste utile pour…", opts: ["écrire des applis web", "comprendre, déboguer, embarqué, noyaux", "remplacer le C partout", "les bases de données"], a: 1, exp: "Bas niveau." },
    { type: "qcm", q: "Le code cryptographique à temps constant se fait parfois en asm car…", opts: ["c'est joli", "on contrôle exactement les instructions (pas de fuite temporelle)", "c'est plus lent", "aucune raison"], a: 1, exp: "Contrôle précis." },
    { type: "qcm", q: "Comparer -O0 et -O2 apprend…", opts: ["rien", "ce que fait un optimiseur et comment le C devient efficace", "à trier", "à afficher"], a: 1, exp: "Comprendre les perfs." }
  ],
  final: {
    title: "Exercice final — Lire l'optimisation",
    intro: `<p>On donne le -O2 d'une fonction C. Que faisait le C ?</p>
<pre class="pseudo">f:                            ; étiquette : début de la fonction
    lea eax, [rdi + rdi*4]     ; (indice) calcule rdi + rdi×4 = rdi×5, sans multiplieur, résultat dans eax
    ret                        ; renvoie (résultat dans eax)</pre>`,
    questions: [
      { type: "qcm", q: "<code>lea eax, [rdi + rdi*4]</code> calcule…", opts: ["rdi + 4", "rdi + rdi*4 = rdi*5", "rdi*4", "rdi/5"], a: 1, exp: "1 + 4 = 5 fois rdi." },
      { type: "qcm", q: "Le C d'origine était probablement…", opts: ["return x + 4;", "return x * 5;", "return x / 5;", "return x - 5;"], a: 1, exp: "×5 via lea." },
      { type: "qcm", q: "Pourquoi lea au lieu d'imul ?", opts: ["lea est faux", "lea calcule x*5 en une instruction rapide, sans multiplieur", "imul n'existe pas", "hasard"], a: 1, exp: "Optimisation astucieuse." },
      { type: "qcm", q: "L'argument x est dans…", opts: ["rax", "rdi (1er argument)", "rsp", "rbx"], a: 1, exp: "System V." },
      { type: "qcm", q: "Le résultat est renvoyé dans…", opts: ["rdi", "eax (rax)", "rsp", "la pile"], a: 1, exp: "Valeur de retour." }
    ],
    solution: `<pre class="pseudo">/* Le C : */  int f(int x) { return x * 5; }   // la fonction multipliait par 5

; -O2 : le compilateur remplace x*5 par lea eax, [rdi + rdi*4]
;   (rdi*1 + rdi*4 = rdi*5) — une seule instruction rapide,
;   sans utiliser le multiplieur. Résultat dans eax, puis ret.
; C'est le genre d'astuce qu'un optimiseur trouve automatiquement —
; difficile à battre à la main.</pre>
<p>Le compilateur transforme <code>x*5</code> en un <code>lea</code> malin : lire l'assembleur optimisé révèle son ingéniosité. Demain : le projet guidé.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse ici…",
  items: [
  { id: "asm-l19", title: "Optimiser une multiplication", level: 2,
    statement: "La fonction C int g(int x) { return x * 8; } peut être optimisée sans imul. Écris (en pseudo-assembleur commenté) la version optimisée que produirait le compilateur, et explique pourquoi elle est plus rapide.",
    hints: [
      "×8 = décalage de 3 bits à gauche (2^3 = 8).",
      "shl eax, 3 après avoir mis x dans eax.",
      "Un décalage est plus rapide qu'une multiplication générale."
    ],
    solution: "; int g(int x) { return x * 8; }  --  version optimisee (Intel)\ng:                      ; etiquette : debut de la fonction\n    mov eax, edi        ; x (1er argument, dans edi) copie dans eax\n    shl eax, 3          ; x << 3 = x * 8 (decalage de 3 bits vers la gauche)\n    ret                 ; renvoie (resultat dans eax)\n;\n; Pourquoi plus rapide : multiplier par une puissance de 2 se fait par un\n; simple DECALAGE de bits (shl), bien moins couteux qu'une instruction imul\n; generale. Le compilateur applique cette transformation automatiquement en -O2.",
    note: "Multiplier par 8 revient à décaler de 3 bits (2³ = 8) : shl eax, 3 remplace imul par une instruction beaucoup plus rapide. C'est une optimisation classique que le compilateur fait tout seul — illustration de pourquoi -O2 bat presque toujours l'humain." }
  ]
};
