<script>
var DAY = {
  num: 12,
  title: "Tableaux et adressage indexé",
  subtitle: "Accéder à l'élément i d'un tableau en une instruction : l'adressage [base + index*taille].",
  theory: `
<h3>1. Un tableau en mémoire</h3>
<p>Un <strong>tableau</strong> est une suite de valeurs de même type rangées les unes à la suite des autres en <strong>mémoire</strong> (la RAM), sans trou entre elles — on dit qu'elles sont <strong>contiguës</strong>. C'est comme une rangée de casiers numérotés, tous de la même taille.</p>
<pre class="pseudo">section .data
    prix dq 44, 12, 39, 20     ; 4 entiers de 8 octets (dq = quad word), rangés côte à côte</pre>
<p>Les éléments se suivent. Si chaque <code>dq</code> occupe 8 octets, l'élément numéro <code>i</code> se trouve à l'<strong>adresse</strong> <code>prix + i*8</code> : on part de l'adresse du tableau et on avance de i fois la taille d'un élément. (Les indices commencent à 0 : le premier élément est à <code>prix + 0</code>.)</p>

<h3>2. L'adressage indexé</h3>
<p>Le x86 sait calculer cette adresse tout seul, en une seule instruction, grâce à un mode d'adressage puissant.</p>
<pre class="pseudo">mov rax, [prix + rbx*8]    ; charge prix[rbx] en UNE instruction (rbx = l'indice)
;              base + index*taille   ; le processeur calcule prix + rbx×8 puis lit à cette adresse</pre>
<p>La forme complète est <code>[base + index*échelle + déplacement]</code>. La <strong>base</strong> est l'adresse de départ (le tableau), l'<strong>index</strong> est le numéro d'élément (dans un registre), l'<strong>échelle</strong> (1, 2, 4 ou 8) correspond à la taille d'un élément, et le <strong>déplacement</strong> est un décalage fixe optionnel. C'est exactement ce que le langage C écrit <code>prix[i]</code>.</p>

<h3>3. Parcourir un tableau</h3>
<p>Pour additionner tous les éléments, on répète : lire l'élément courant, avancer l'index, recommencer tant qu'il en reste. <code>xor reg, reg</code> est l'astuce standard pour mettre un registre à 0 (un nombre XOR lui-même donne toujours 0).</p>
<pre class="pseudo">    xor rax, rax        ; met rax à 0 (total = 0) — xor d'un registre avec lui-même = 0
    xor rbx, rbx        ; met rbx à 0 (index = 0)
    mov rcx, 4          ; rcx = nombre d'éléments = compteur de tours restants
boucle:                 ; étiquette : début du corps de la boucle
    add rax, [prix + rbx*8]   ; total += prix[index]  (adressage indexé base + index×8)
    inc rbx                   ; index++ : passe à l'élément suivant
    dec rcx                   ; un tour de moins : rcx = rcx - 1
    jnz boucle                ; « jump if not zero » : tant que rcx ≠ 0, retourne à boucle</pre>

<h3>4. La taille de l'élément détermine l'échelle</h3>
<p>L'échelle doit correspondre à la taille d'un élément, sinon on lit à côté :</p>
<pre class="pseudo">octets (db)      → [base + index*1]   (ou juste [base + index])   ; 1 octet par élément
mots (dw, 2)     → [base + index*2]                                ; 2 octets par élément
double (dd, 4)   → [base + index*4]                                ; 4 octets par élément
quad (dq, 8)     → [base + index*8]                                ; 8 octets par élément</pre>
<div class="warn">Se tromper d'échelle lit à côté des éléments (de mauvaises valeurs). Et comme toujours en assembleur, <strong>aucune vérification de bornes</strong> : parcourir au-delà de la taille du tableau lit de la mémoire quelconque, sans avertissement.</div>

<h3>5. Les trois cibles</h3>
<p>Le même accès indexé s'écrit différemment selon la cible :</p>
<pre class="pseudo">NASM   mov rax, [prix + rbx*8]                              ; base prix + index rbx × échelle 8
AT&amp;T   mov prix(,%rbx,8), %rax        (dép(base, index, échelle))   ; même accès, autre écriture
ARM64  ldr x0, [x1, x2, lsl 3]        (lsl 3 = ×8, décalage de 3 bits) ; x0 = mémoire[x1 + x2×8]</pre>
<div class="tip">L'adressage indexé est l'une des grandes forces du x86 : accéder à <code>tableau[i]</code>, avancer un pointeur, tout se fait en une instruction. L'ARM64 exprime l'échelle par un décalage (<code>lsl 3</code> = décaler de 3 bits vers la gauche = multiplier par 2³ = 8). Même idée, notation différente.</div>`,
  exercises: [
    { type: "qcm", q: "Dans <code>prix dq 44,12,39,20</code>, chaque élément fait…", opts: ["1 octet", "8 octets", "2 octets", "4 octets"], a: 1, exp: "dq = quad word." },
    { type: "qcm", q: "L'élément i est à l'adresse…", opts: ["prix + i", "prix + i*8 (pour des dq)", "prix - i", "prix*i"], a: 1, exp: "Taille × index." },
    { type: "qcm", q: "<code>[prix + rbx*8]</code> accède à…", opts: ["l'adresse de prix", "prix[rbx] (élément indexé)", "0", "un octet"], a: 1, exp: "Adressage indexé." },
    { type: "qcm", q: "L'échelle (1,2,4,8) correspond à…", opts: ["l'index", "la taille d'un élément", "l'adresse", "rien"], a: 1, exp: "8 pour des dq." },
    { type: "qcm", q: "L'adressage indexé fait <code>tableau[i]</code> en…", opts: ["plusieurs instructions", "une instruction", "zéro", "un fichier"], a: 1, exp: "Force du x86." },
    { type: "qcm", q: "Pour un tableau d'octets (db), l'échelle est…", opts: ["8", "1", "4", "16"], a: 1, exp: "1 octet par élément." },
    { type: "qcm", q: "Se tromper d'échelle…", opts: ["est sans effet", "lit à côté des éléments (mauvaises valeurs)", "trie le tableau au passage", "aligne automatiquement le tableau"], a: 1, exp: "Alignement faux." },
    { type: "qcm", q: "Les bornes d'un tableau sont-elles vérifiées ?", opts: ["oui", "non (comme tout en assembleur)", "parfois", "seulement en .data"], a: 1, exp: "À toi d'y veiller." },
    { type: "qcm", q: "Pour parcourir, on incrémente…", opts: ["l'échelle", "l'index (inc rbx)", "l'adresse de base", "rax"], a: 1, exp: "index++." },
    { type: "qcm", q: "L'ARM64 exprime ×8 par…", opts: ["*8 littéral", "lsl 3 (décalage de 3 bits)", "mul", "rien"], a: 1, exp: "2³ = 8." },
    { type: "vf", q: "L'adressage [base + index*échelle] est ce que le C écrit tableau[i].", a: true, exp: "Une instruction." },
    { type: "qcm", q: "Somme de {44,12,39,20} =", opts: ["100", "115", "95", "44"], a: 1, exp: "115." },
    { type: "qcm", q: "En AT&T, l'adressage indexé s'écrit…", opts: ["[prix + rbx*8]", "prix(,%rbx,8)", "prix[rbx]", "rbx*8"], a: 1, exp: "dép(base, index, échelle)." },
    { type: "qcm", q: "Le mode d'adressage complet x86 est…", opts: ["[base]", "[base + index*échelle + déplacement]", "[index]", "[écran]"], a: 1, exp: "Très flexible." },
    { type: "qcm", q: "Avancer d'un élément dans un tableau de dq =", opts: ["index + 1 (l'échelle gère le ×8)", "index + 8", "adresse + 1", "rien"], a: 0, exp: "L'échelle applique la taille." }
  ],
  final: {
    title: "Exercice final — Somme du catalogue",
    intro: `<p>On somme 4 prix. Analyse :</p>
<pre class="pseudo">    xor rax, rax        ; total = 0
    xor rbx, rbx        ; index = 0
    mov rcx, 4          ; 4 éléments à parcourir
boucle:                 ; début de la boucle
    add rax, [prix + rbx]     ; BUG : échelle manquante — des dq font 8 octets, il faut rbx*8
    inc rbx                   ; index++
    dec rcx                   ; un tour de moins
    jnz boucle                ; tant que rcx ≠ 0, on recommence</pre>`,
    questions: [
      { type: "qcm", q: "Le bug — <code>[prix + rbx]</code> :", opts: ["correct", "échelle manquante : des dq font 8 octets, il faut [prix + rbx*8]", "il faut rbx*4", "rien"], a: 1, exp: "On lit à côté." },
      { type: "qcm", q: "L'échelle correcte pour des dq :", opts: ["1", "8", "4", "2"], a: 1, exp: "8 octets par élément." },
      { type: "qcm", q: "inc rbx avance l'index de…", opts: ["8", "1 (l'échelle *8 fait le reste)", "0", "l'adresse"], a: 1, exp: "index++, l'échelle gère la taille." },
      { type: "qcm", q: "Après correction, rax =", opts: ["100", "115", "44", "0"], a: 1, exp: "44+12+39+20." },
      { type: "qcm", q: "Les bornes sont-elles surveillées ?", opts: ["oui", "non : rester dans les 4 éléments est ta responsabilité", "parfois", "toujours"], a: 1, exp: "Aucune vérif." }
    ],
    solution: `<pre class="pseudo">section .data
    prix dq 44, 12, 39, 20    ; tableau de 4 quad words (8 octets chacun)
section .text
    global _start             ; point d'entrée visible du lieur
_start:                       ; l'exécution commence ici
    xor rax, rax        ; met rax à 0 → total = 0
    xor rbx, rbx        ; met rbx à 0 → index = 0
    mov rcx, 4          ; rcx = 4 éléments à parcourir (compteur)
boucle:                 ; début du corps de la boucle
    add rax, [prix + rbx*8]   ; total += prix[index] ; échelle *8 pour des dq
    inc rbx                   ; index++ : élément suivant
    dec rcx                   ; un tour de moins
    jnz boucle                ; tant que rcx ≠ 0, retourne à boucle
    mov rdi, rax        ; copie la somme (115) dans rdi = code de retour
    mov rax, 60         ; numéro du syscall exit (terminer)
    syscall             ; termine le programme en renvoyant rdi
; echo $?  -> 115       ; dans le terminal, echo $? affiche 115
; ARM64 : ldr x3, [x0, x1, lsl 3]   ; même accès indexé (lsl 3 = ×8)</pre>
<p>L'échelle <code>*8</code> est indispensable pour des <code>dq</code> : sans elle, on lit à côté. L'adressage indexé fait <code>tableau[i]</code> en une instruction. Demain : les chaînes de caractères.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l12", title: "Le plus grand prix", level: 3,
    statement: "Déclare un tableau de 4 prix (dq 44,12,39,20). Parcours-le pour trouver le plus grand et renvoie-le (44) comme code de sortie. Utilise l'adressage indexé et un cmp/saut pour le maximum.",
    hints: [
      "Initialise le max avec le premier : mov rax, [prix].",
      "Boucle sur les indices 1..3 : compare [prix+rbx*8] à rax, mets à jour si plus grand.",
      "Renvoie rax via rdi + exit."
    ],
    atoi: { cmd: "nasm -felf64 prog.asm -o prog.o && ld prog.o -o prog && ./prog ; echo $?", expected: "44" },
    checklist: ["Initialises-tu le max avec le premier element (mov rax,[prix]) ?", "Utilises-tu l'adressage indexe [prix + rbx*8] pour l'element courant ?", "Mets-tu a jour le max avec cmp + saut conditionnel ?", "echo $? affiche-t-il 44 ?"],
    solution: "section .data\n    prix dq 44, 12, 39, 20    ; tableau de 4 quad words\nsection .text\n    global _start             ; point d'entree visible du lieur\n_start:                       ; l'execution commence ici\n    mov rax, [prix]     ; max = prix[0] (premier element)\n    mov rbx, 1          ; index = 1 (on part du 2e element)\n    mov rcx, 3          ; 3 elements restants a examiner\nboucle:                 ; debut de la boucle\n    mov rdx, [prix + rbx*8]   ; charge l'element courant (echelle *8)\n    cmp rdx, rax              ; compare element courant et max actuel\n    jle .suite                ; si element <= max, on garde rax\n    mov rax, rdx              ; sinon, nouveau max = element courant\n.suite:                 ; suite du tour\n    inc rbx             ; index++\n    dec rcx             ; un tour de moins\n    jnz boucle          ; tant que rcx != 0, on continue\n    mov rdi, rax        ; copie le max (44) dans rdi = code de retour\n    mov rax, 60         ; numero du syscall exit\n    syscall             ; termine en renvoyant rdi\n; echo $?  -> 44         ; echo $? affiche 44",
    note: "On initialise le max avec le premier élément, puis on parcourt le reste avec l'adressage indexé [prix + rbx*8]. À chaque tour, un cmp + saut conditionnel met à jour le max. C'est la recherche de maximum, en langage machine." }
  ]
};
