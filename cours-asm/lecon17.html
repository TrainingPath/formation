<script>
var DAY = {
  num: 17,
  title: "Les trois syntaxes en profondeur",
  subtitle: "Récapituler et approfondir : NASM/Intel, GAS/AT&T (même machine), ARM64 (autre machine).",
  theory: `
<h3>1. Deux syntaxes pour x86-64 : Intel vs AT&amp;T</h3>
<p>Rappel important : une <strong>architecture</strong> est une famille de processeurs (son jeu d'instructions), tandis qu'une <strong>syntaxe</strong> est seulement une <em>façon d'écrire</em> ces instructions. Sur la même machine x86-64, il existe deux syntaxes concurrentes — <strong>Intel</strong> (celle de NASM) et <strong>AT&amp;T</strong> (celle de l'assembleur GNU, dit GAS). Voici les mêmes instructions écrites dans les deux :</p>
<pre class="pseudo">                 NASM / Intel        GAS / AT&amp;T
copier immédiat  mov rax, 5          movq $5, %rax        ; mettre la valeur 5 dans rax
copier registre  mov rax, rbx        movq %rbx, %rax      ; copier rbx dans rax
lire mémoire     mov rax, [prix]     movq prix(%rip), %rax ; charger la valeur à l'adresse prix
ordre            dest, src           src, dest            ; l'ordre des opérandes est INVERSÉ
préfixes         aucun               % (registres), $ (immédiats) ; AT&amp;T marque le type d'opérande
taille           implicite/suffixe   suffixe q/l/w/b      ; movq=8, movl=4, movw=2, movb=1 octet</pre>
<div class="warn">Trois différences majeures en AT&amp;T : l'<strong>ordre inversé</strong> (destination à droite), les <strong>préfixes</strong> <code>%</code> (devant un registre) et <code>$</code> (devant une valeur immédiate), et les <strong>suffixes de taille</strong> (<code>q</code>=8 octets, <code>l</code>=4, <code>w</code>=2, <code>b</code>=1). C'est la syntaxe que produit <code>gcc -S</code> et que lit <code>gdb</code> (le débogueur) par défaut.</div>

<h3>2. L'adressage, côte à côte</h3>
<p>Accéder à l'élément d'un tableau s'écrit aussi différemment, mais désigne le même calcul <em>base + index×échelle + déplacement</em> :</p>
<pre class="pseudo">Intel   [base + index*échelle + dép]   ex. [prix + rbx*8]   ; lisible : tout entre crochets
AT&amp;T    dép(base, index, échelle)      ex. prix(,%rbx,8)    ; même adresse, notation compacte</pre>

<h3>3. ARM64 : une autre architecture</h3>
<p>ARM64 n'est pas une autre syntaxe mais une autre <strong>machine</strong> (mobiles, Raspberry Pi, Mac Apple Silicon), avec ses propres registres et règles :</p>
<pre class="pseudo">- Instructions à TROIS opérandes : add x0, x1, x2 (x0 = x1 + x2, sans écraser x1)
- 31 registres généraux : x0..x30 (w0..w30 pour la moitié 32 bits)
- Architecture LOAD/STORE : on ne calcule jamais directement en mémoire
      ldr x0, [x1]   ; charger (load) : lit la mémoire à l'adresse x1 dans x0
      str x0, [x1]   ; stocker (store) : écrit x0 en mémoire à l'adresse x1
- Instructions de taille FIXE (4 octets) ; jeu très régulier
- Appels : bl (branch-with-link, « saute et retiens l'adresse de retour ») ; retour dans x30 (lr)</pre>

<h3>4. Ce qui est universel</h3>
<p>Malgré ces différences d'écriture, toutes les cibles partagent le même modèle de machine et les mêmes idées :</p>
<pre class="pseudo">registres, mémoire, pile         ; le modèle de la machine (mêmes briques partout)
copier, additionner, comparer    ; les opérations de base
comparer puis sauter             ; la logique conditionnelle (if, boucles)
appeler / revenir                ; les fonctions
demander un service au noyau     ; les appels système (syscall)</pre>
<p>Toutes les cibles partagent ces idées ; seuls changent les <strong>noms</strong> des instructions, l'<strong>ordre des opérandes</strong> et les <strong>numéros</strong> (de registres, de syscalls).</p>

<h3>5. Choisir une cible</h3>
<div class="tip">On apprend en <strong>NASM/Intel</strong> (lisible, sans préfixes) ; on lit du <strong>AT&amp;T</strong> quand on regarde la sortie de <code>gcc -S</code> ou de <code>gdb</code> ; et on écrit du <strong>ARM64</strong> pour le mobile, le Raspberry Pi ou un Mac Apple Silicon. Savoir passer de l'une à l'autre, c'est comprendre que la syntaxe n'est qu'un habillage du même modèle de machine.</div>`,
  exercises: [
    { type: "qcm", q: "NASM/Intel et GAS/AT&T sont…", opts: ["deux architectures", "deux syntaxes pour le même x86-64", "deux processeurs", "deux OS"], a: 1, exp: "Même machine." },
    { type: "qcm", q: "En AT&T, l'ordre des opérandes est…", opts: ["dest, src", "src, dest (inversé)", "identique à Intel", "aléatoire"], a: 1, exp: "Destination à droite." },
    { type: "qcm", q: "En AT&T, un registre s'écrit…", opts: ["rax", "%rax", "$rax", "[rax]"], a: 1, exp: "Préfixe %." },
    { type: "qcm", q: "En AT&T, un immédiat s'écrit…", opts: ["5", "$5", "%5", "[5]"], a: 1, exp: "Préfixe $." },
    { type: "qcm", q: "Le suffixe q en AT&T (movq) signifie…", opts: ["1 octet", "8 octets (quad)", "4 octets", "2 octets"], a: 1, exp: "Taille explicite." },
    { type: "qcm", q: "gcc -S produit de l'assembleur en syntaxe…", opts: ["Intel", "AT&T (par défaut)", "ARM64", "NASM"], a: 1, exp: "GAS/AT&T." },
    { type: "qcm", q: "ARM64 a des instructions à…", opts: ["deux opérandes", "trois opérandes", "une opérande", "quatre"], a: 1, exp: "add x0, x1, x2." },
    { type: "qcm", q: "ARM64 est une architecture…", opts: ["CISC pure", "load/store (calculs en registres seulement)", "sans registres", "identique au x86"], a: 1, exp: "ldr/str pour la mémoire." },
    { type: "qcm", q: "Les instructions ARM64 ont une taille…", opts: ["variable", "fixe (4 octets)", "de 1 octet", "illimitée"], a: 1, exp: "Jeu régulier." },
    { type: "qcm", q: "Ce qui est universel entre les cibles :", opts: ["les noms d'instructions", "le modèle (registres, mémoire, pile) et les opérations", "les numéros de syscalls", "les préfixes"], a: 1, exp: "Le concept." },
    { type: "vf", q: "La syntaxe n'est qu'un habillage du même modèle de machine.", a: true, exp: "Concept partagé." },
    { type: "qcm", q: "L'adressage indexé en AT&T s'écrit…", opts: ["[prix+rbx*8]", "prix(,%rbx,8)", "prix[rbx]", "rbx*8"], a: 1, exp: "dép(base,index,échelle)." },
    { type: "qcm", q: "Pour lire du code désassemblé dans gdb, quelle syntaxe par défaut ?", opts: ["Intel", "AT&T", "NASM", "ARM"], a: 1, exp: "AT&T (configurable)." },
    { type: "qcm", q: "On écrit de l'ARM64 pour…", opts: ["les vieux PC", "mobile, Raspberry Pi, Mac Apple Silicon", "les serveurs Intel uniquement", "les anciennes consoles de jeu"], a: 1, exp: "Plateformes ARM." },
    { type: "qcm", q: "Le registre de retour d'appel ARM64 est…", opts: ["la pile", "x30 (lr)", "x0", "rax"], a: 1, exp: "Branch-with-link." }
  ],
  final: {
    title: "Exercice final — Traduire d'une syntaxe à l'autre",
    intro: `<p>On donne du NASM. Traduis mentalement en AT&T et ARM64 :</p>
<pre class="pseudo">    mov rax, 10        ; (1) met la valeur immédiate 10 dans rax
    add rax, rbx       ; (2) rax = rax + rbx (additionne rbx à rax)
    mov rcx, [prix]    ; (3) charge dans rcx la valeur en mémoire à l'adresse prix</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>mov rax, 10</code> en AT&T :", opts: ["mov %rax, $10", "movq $10, %rax", "mov 10, rax", "movq %rax, 10"], a: 1, exp: "Immédiat $, dest à droite, suffixe q." },
      { type: "qcm", q: "(2) <code>add rax, rbx</code> en AT&T :", opts: ["addq %rax, %rbx", "addq %rbx, %rax", "add rbx, rax", "addq $rbx, %rax"], a: 1, exp: "src, dest." },
      { type: "qcm", q: "(1) en ARM64 :", opts: ["mov rax, 10", "mov x0, 10", "movq $10", "ldr x0, 10"], a: 1, exp: "Registres x0.." },
      { type: "qcm", q: "(3) <code>mov rcx, [prix]</code> en ARM64 (load/store) :", opts: ["mov x2, prix", "ldr x2, =prix ; ldr x2, [x2]", "add x2, prix", "str x2, [prix]"], a: 1, exp: "Charger l'adresse puis déréférencer." },
      { type: "qcm", q: "Le concept commun aux trois (2) :", opts: ["comparer", "additionner deux valeurs", "sauter", "afficher"], a: 1, exp: "add, quelle que soit la forme." }
    ],
    solution: `<pre class="pseudo">           NASM (Intel)      AT&amp;T (GAS)           ARM64
(1) copier mov rax, 10       movq $10, %rax       mov x0, 10           ; mettre 10 dans le registre
(2) add    add rax, rbx      addq %rbx, %rax      add x0, x0, x1       ; additionner deux valeurs
(3) lire   mov rcx, [prix]   movq prix(%rip),%rcx ldr x2, =prix        ; ARM64 : charger l'adresse…
                                                  ldr x2, [x2]         ; …puis lire la valeur (load/store)</pre>
<p>Même sens partout : copier, additionner, lire la mémoire. AT&amp;T inverse l'ordre et ajoute des préfixes/suffixes ; ARM64 change de registres et impose load/store. Demain : traduire du C en assembleur avec <code>gcc -S</code>.</p>`
  }
};
</script>

var ECRITURE = {

  items: [
  { id: "asm-l17", title: "Le même calcul, trois cibles", level: 3,
    statement: "Écris « rax/x0 = 7 + 3 » dans les trois formes (NASM Intel, AT&T GAS, ARM64), avec un commentaire notant la particularité principale de chacune (ordre inversé, préfixes, trois opérandes…).",
    hints: [
      "NASM : mov rax, 7 ; add rax, 3 (dest à gauche).",
      "AT&T : movq $7, %rax ; addq $3, %rax (src, dest ; % et $).",
      "ARM64 : mov x0, 7 ; add x0, x0, 3 (trois opérandes)."
    ],
    checklist: ["Ta version NASM/Intel met-elle la destination a GAUCHE, sans prefixe ?", "Ta version AT&T inverse-t-elle l'ordre (src, dest) avec les prefixes % et $ et un suffixe de taille ?", "Ta version ARM64 utilise-t-elle TROIS operandes (add x0, x0, 3) ?", "As-tu commente la particularite principale de chaque cible ?"],
    solution: "; --- NASM / Intel : destination a GAUCHE, pas de prefixe ---\n    mov rax, 7          ; met 7 dans rax (immediat, dest a gauche)\n    add rax, 3          ; rax = rax + 3\n\n; --- GAS / AT&T : destination a DROITE, prefixes % et $, suffixe de taille ---\n    movq $7, %rax       ; met 7 dans rax ($ = immediat, % = registre, dest a droite)\n    addq $3, %rax       ; meme effet que add rax,3 ; ordre inverse\n\n; --- ARM64 : TROIS operandes, registres x0.., architecture load/store ---\n    mov x0, 7           ; met 7 dans x0\n    add x0, x0, 3       ; x0 = x0 + 3 (trois operandes, x0 non ecrase par une source distincte)",
    note: "Trois écritures, une seule idée (additionner). Les particularités : Intel met la destination à gauche sans préfixe ; AT&T l'inverse et préfixe registres (%) et immédiats ($) avec des suffixes de taille ; ARM64 utilise trois opérandes et d'autres registres. Le concept est universel, la forme non." }
  ]
};
