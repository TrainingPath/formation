<script>
var DAY = {
  num: 2,
  title: "Registres et premier programme",
  subtitle: "Les « variables » du processeur, et un programme qui se lance et se termine proprement.",
  theory: `
<h3>1. Les registres</h3>
<p>Un <strong>registre</strong> est une minuscule case de stockage <em>dans</em> le processeur — le plus rapide qui soit, comme une case mémoire ultra-rapide à portée de main. Contrairement à la <strong>mémoire</strong> (la RAM, immense mais plus lente), il n'y en a qu'une poignée : le processeur y garde les valeurs sur lesquelles il travaille en ce moment même. En x86-64, chacun fait 64 <strong>bits</strong> (un bit = un 0 ou un 1 ; 64 bits permettent de coder un nombre entier gigantesque). Ce sont un peu les « variables » du processeur, sauf qu'elles sont en nombre fixe et portent des noms imposés :</p>
<pre class="pseudo">rax rbx rcx rdx    (usage général — rax souvent pour les résultats)
rsi rdi            (souvent des arguments / index)
rbp rsp            (base et sommet de la PILE)
r8 r9 r10 … r15    (registres supplémentaires)</pre>
<p>La <strong>pile</strong> (mentionnée ci-dessus avec <code>rbp</code>/<code>rsp</code>) est une zone de mémoire organisée « en pile d'assiettes » : on empile et on dépile des valeurs ; on la verra en détail plus tard. Les moitiés 32 bits des registres s'appellent <code>eax</code>, <code>ebx</code>… : ce sont les mêmes registres mais on n'en utilise que la moitié basse (héritage des anciens processeurs 32 bits, d'où « compatibilité historique »).</p>

<h3>2. mov : copier une valeur</h3>
<p>Une <strong>instruction</strong> est un ordre élémentaire donné au processeur. <code>mov</code> (de l'anglais <em>move</em>) est la plus fréquente : elle <em>copie</em> une valeur d'un endroit à un autre.</p>
<pre class="pseudo">mov rax, 44        ; met la valeur 44 (une valeur « immédiate », écrite en dur) dans le registre rax
mov rbx, rax       ; copie le contenu de rax dans rbx (rax garde sa valeur)</pre>
<p><code>mov dest, src</code> copie <code>src</code> dans <code>dest</code> (la source n'est pas modifiée). Retiens l'ordre : en NASM, la <strong>destination</strong> vient toujours en premier. C'est l'instruction la plus fréquente.</p>

<h3>3. Le squelette d'un programme (NASM x86-64)</h3>
<p>Une <strong>section</strong> est une zone du programme regroupant un même type de contenu ; <code>.text</code> contient le code. <code>_start</code> est une <strong>étiquette</strong> (un nom qui repère un endroit du code) : c'est le <strong>point d'entrée</strong>, là où l'exécution commence. Le <strong>syscall</strong> (appel système) est une demande de service adressée au <strong>noyau</strong> (le cœur du système d'exploitation) : seul le noyau peut, par exemple, terminer un programme ou écrire à l'écran.</p>
<pre class="pseudo">section .text          ; ouvre la section du code (les instructions)
    global _start      ; rend l'étiquette _start visible du lieur (l'éditeur de liens) comme point d'entrée
_start:                ; étiquette : ici commence l'exécution du programme
    mov rax, 60        ; met 60 dans rax = numéro du syscall « exit » (terminer le programme)
    mov rdi, 0         ; met 0 dans rdi = code de retour renvoyé au système (0 = tout s'est bien passé)
    syscall            ; déclenche l'appel système : on rend la main au noyau, le programme s'arrête</pre>
<div class="warn">Un programme assembleur ne « retourne » pas comme une fonction C : il doit demander explicitement au système de se terminer, via l'appel système <strong>exit</strong> (numéro 60 en x86-64). Sans lui, l'exécution continue au-delà du code et plante.</div>

<h3>4. Renvoyer un résultat</h3>
<pre class="pseudo">mov rax, 44         ; met 44 dans rax (notre résultat à renvoyer)
mov rdi, rax        ; copie 44 dans rdi : le code de retour est le 1er argument de exit (il va dans rdi)
mov rax, 60         ; met 60 dans rax = numéro du syscall exit
syscall             ; déclenche exit : le programme se termine en renvoyant 44
; ./prog ; echo $?  -> 44   # après exécution, echo $? affiche 44 (le code de sortie)</pre>
<p>Tant qu'on ne sait pas afficher, on « voit » un résultat via le <strong>code de sortie</strong> (un nombre de 0 à 255 que tout programme renvoie en se terminant), lu avec <code>echo $?</code> dans le terminal.</p>

<h3>5. Les trois cibles</h3>
<pre class="pseudo">NASM (Intel)   mov rax, 60   ; mov rdi, 0   ; syscall
AT&amp;T (GAS)     movq $60, %rax; movq $0, %rdi; syscall
ARM64          mov x8, 93    ; mov x0, 0    ; svc 0   (exit = 93, x8 = n° syscall)</pre>
<div class="tip">Le concept est identique : mettre le numéro de l'appel système et ses arguments dans des registres, puis déclencher l'appel. Seuls changent les noms de registres (<code>rax</code>/<code>x8</code>), les numéros (60/93) et l'instruction de trappe (<code>syscall</code>/<code>svc 0</code>).</div>`,
  exercises: [
    { type: "qcm", q: "Un registre est…", opts: ["une zone de disque", "une case de stockage rapide dans le processeur", "une adresse en mémoire vive", "une instruction du processeur"], a: 1, exp: "Le stockage le plus rapide." },
    { type: "qcm", q: "Combien de registres généraux y a-t-il (ordre de grandeur) ?", opts: ["des milliers", "une poignée (une quinzaine)", "exactement 64", "plusieurs centaines"], a: 1, exp: "Ressource rare." },
    { type: "qcm", q: "Un registre x86-64 fait…", opts: ["8 bits", "64 bits", "1 bit", "1024 bits"], a: 1, exp: "eax = sa moitié 32 bits." },
    { type: "qcm", q: "Que fait <code>mov rax, 44</code> ?", opts: ["additionne", "copie 44 dans rax", "compare", "saute"], a: 1, exp: "mov dest, src." },
    { type: "qcm", q: "Dans <code>mov rbx, rax</code>, qui est modifié ?", opts: ["rax", "rbx (la destination)", "les deux", "aucun"], a: 1, exp: "La source reste intacte." },
    { type: "qcm", q: "Le point d'entrée d'un programme NASM s'appelle…", opts: ["main", "_start", "begin", "run"], a: 1, exp: "global _start." },
    { type: "qcm", q: "Comment un programme assembleur se termine-t-il ?", opts: ["il retourne comme en C", "via le syscall exit (60 en x86-64)", "tout seul", "avec ret"], a: 1, exp: "Sinon plantage." },
    { type: "qcm", q: "Le numéro du syscall va dans…", opts: ["rdi", "rax", "rsi", "rsp"], a: 1, exp: "rax en x86-64." },
    { type: "qcm", q: "Le code de retour de exit se met dans…", opts: ["rax", "rdi (1er argument)", "rsi", "rbp"], a: 1, exp: "rdi = 1er argument." },
    { type: "qcm", q: "Comment lire le code de sortie ?", opts: ["cat", "echo $?", "ls", "printf"], a: 1, exp: "Valeur 0 à 255." },
    { type: "vf", q: "mov ne modifie que la destination, pas la source.", a: true, exp: "Copie simple." },
    { type: "qcm", q: "eax est…", opts: ["un autre registre", "la moitié 32 bits de rax", "une instruction", "la pile"], a: 1, exp: "Compatibilité historique." },
    { type: "qcm", q: "L'exit en ARM64 utilise…", opts: ["rax=60", "x8=93 puis svc 0", "x0=93 puis syscall", "l'appel libc exit()"], a: 1, exp: "Numéros et registres différents." },
    { type: "qcm", q: "section .text contient…", opts: ["les données", "le code", "la pile", "les tampons non initialisés"], a: 1, exp: "La zone des instructions." },
    { type: "qcm", q: "syscall (x86-64) sert à…", opts: ["additionner", "demander un service au noyau", "copier", "comparer"], a: 1, exp: "Trappe vers le système." }
  ],
  final: {
    title: "Exercice final — Un programme qui renvoie 7",
    intro: `<p>On veut un programme qui se termine avec le code 7. Analyse cette tentative :</p>
<pre class="pseudo">section .text          ; section du code
    global _start      ; point d'entrée visible du lieur
_start:                ; début de l'exécution
    mov rdi, 7         ; met 7 dans rdi (le futur code de retour)
    mov rax, 60        ; met 60 dans rax (numéro de exit)
                       ; … mais il manque le syscall pour déclencher l'appel !</pre>`,
    questions: [
      { type: "qcm", q: "Que manque-t-il pour déclencher exit ?", opts: ["rien", "l'instruction syscall après avoir rempli rax et rdi", "un ret", "un mov de plus"], a: 1, exp: "syscall déclenche l'appel." },
      { type: "qcm", q: "rax = 60 signifie…", opts: ["retour 60", "syscall exit", "additionner 60", "comparer"], a: 1, exp: "Numéro de l'appel." },
      { type: "qcm", q: "rdi = 7 signifie ici…", opts: ["numéro de syscall", "le code de retour (1er argument de exit)", "un index", "rien"], a: 1, exp: "rdi = 1er argument." },
      { type: "qcm", q: "Sans syscall, à la fin de _start…", opts: ["le programme se ferme proprement", "l'exécution continue et plante", "rien", "retour 0"], a: 1, exp: "Pas de terminaison implicite." },
      { type: "qcm", q: "Après correction, echo $? donne…", opts: ["0", "7", "60", "erreur"], a: 1, exp: "Le code renvoyé." }
    ],
    solution: `<pre class="pseudo">section .text          ; section du code (les instructions)
    global _start      ; rend _start visible du lieur comme point d'entrée
_start:                ; ici commence l'exécution
    mov rdi, 7         ; met 7 dans rdi = code de retour (1er argument de exit)
    mov rax, 60        ; met 60 dans rax = numéro du syscall exit
    syscall            ; déclenche l'appel : le programme se termine en renvoyant 7
; nasm -f elf64 p.asm -o p.o && ld p.o -o p ; ./p ; echo $?  -> 7   # assemble, lie, exécute, affiche 7</pre>
<p>Il manquait <code>syscall</code>. Un programme assembleur doit explicitement se terminer. Demain : afficher du texte avec le syscall <code>write</code>.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l02", title: "Renvoyer la somme de deux nombres", level: 2,
    statement: "Écris un programme NASM x86-64 qui met 12 dans rax, 30 dans rbx, les additionne, et renvoie le total (42) comme code de sortie via exit. Donne aussi, en commentaire, l'équivalent ARM64 de l'exit.",
    hints: [
      "mov rax, 12 ; mov rbx, 30 ; add rax, rbx.",
      "mov rdi, rax ; mov rax, 60 ; syscall.",
      "ARM64 exit : mov x8, 93 ; mov x0, 0 ; svc 0."
    ],
    atoi: { cmd: "nasm -felf64 prog.asm -o prog.o && ld prog.o -o prog && ./prog ; echo $?", expected: "42" },
    checklist: ["Le point d'entree est-il global _start puis l'etiquette _start: ?", "Charges-tu 12 dans rax et 30 dans rbx avant l'add ?", "Copies-tu le resultat dans rdi avant l'exit (rax=60, syscall) ?", "echo $? affiche-t-il bien 42 ?"],
    solution: "section .text\n    global _start\n_start:\n    mov rax, 12         ; met la valeur 12 dans rax\n    mov rbx, 30         ; met la valeur 30 dans rbx\n    add rax, rbx        ; rax = rax + rbx = 42 (add ecrase la destination rax)\n    mov rdi, rax        ; copie 42 dans rdi = code de retour de exit\n    mov rax, 60         ; met 60 dans rax = numero du syscall exit\n    syscall             ; declenche exit : le programme se termine en renvoyant 42\n; ./prog ; echo $?  -> 42   # execute puis affiche 42\n;\n; Equivalent ARM64 de l'exit :\n;   mov x8, 93   ; met 93 dans x8 = numero du syscall exit en ARM64\n;   mov x0, 0    ; met 0 dans x0 = code de retour\n;   svc 0        ; instruction de trappe systeme (equivalent ARM de syscall)",
    note: "On charge deux valeurs dans des registres, on les additionne (add écrase la destination), et on renvoie le résultat via le code de sortie. L'exit ARM64 illustre que le concept est le même — seuls le registre du numéro (x8) et l'instruction (svc 0) changent." }
  ]
};
