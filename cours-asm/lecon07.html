<script>
var DAY = {
  num: 7,
  title: "Comparaisons et sauts conditionnels",
  subtitle: "Le if de l'assembleur : comparer, puis sauter selon les drapeaux.",
  theory: `
<h3>1. cmp : comparer sans stocker</h3>
<p>Petit rappel : un <strong>registre</strong> est une case ultra-rapide dans le processeur (comme <code>rax</code>), une <strong>instruction</strong> est un ordre donné au processeur, et un <strong>drapeau</strong> (<em>flag</em>) est un bit (0 ou 1) rangé dans un registre spécial (RFLAGS) qui décrit le résultat de la dernière opération.</p>
<pre class="pseudo">cmp rax, 5         ; calcule rax - 5 « pour voir » et positionne les drapeaux
                   ; (rax n'est PAS modifie : on garde juste le resultat de la comparaison)</pre>
<p><code>cmp</code> fait une soustraction fictive : elle ne range pas le résultat, mais met à jour les drapeaux (ZF, SF…) qui décrivent la relation entre les deux valeurs. « Fictive » veut dire que le calcul est fait uniquement pour observer le résultat (est-il nul ? négatif ?), sans écrire nulle part.</p>

<h3>2. Les sauts conditionnels</h3>
<p>Un <strong>saut</strong> (ou <strong>branchement</strong>) déplace l'exécution vers une <strong>étiquette</strong> — un simple nom qui marque une ligne du programme. Un saut <em>conditionnel</em> ne part que si une condition (lue dans les drapeaux) est vraie.</p>
<pre class="pseudo">je   étiquette   ; jump if equal      (==)   saute si ZF=1 (les deux valeurs sont egales)
jne  étiquette   ; jump if not equal  (!=)   saute si elles sont differentes
jl   étiquette   ; jump if less       (<, signe)   saute si la 1re est plus petite
jg   étiquette   ; jump if greater    (>, signe)   saute si la 1re est plus grande
jle  étiquette   ; <=        jge  ; >=            versions "ou egal"
jmp  étiquette   ; saut INCONDITIONNEL (part toujours, sans condition)</pre>
<p>Après un <code>cmp a, b</code>, <code>jl</code> saute si <code>a &lt; b</code>. Ces instructions lisent les drapeaux positionnés par <code>cmp</code>.</p>

<h3>3. Traduire un if</h3>
<pre class="pseudo">; if (stock == 0) rupture(); else ok();
    cmp rax, 0         ; compare stock (dans rax) a 0
    jne .sinon         ; si stock != 0, sauter au bloc "sinon" (ok)
    ; ... rupture ...  ; sinon on est ici : stock vaut 0 -> rupture
    jmp .fin           ; sauter la fin pour NE PAS executer aussi le bloc sinon
.sinon:                ; etiquette du bloc "else"
    ; ... ok ...       ; stock different de 0 -> tout va bien
.fin:                  ; etiquette de fin : les deux chemins se rejoignent ici</pre>
<div class="warn">Un <code>if</code> se construit toujours ainsi : <strong>cmp</strong> pour comparer, <strong>saut conditionnel</strong> vers l'autre branche, <strong>étiquettes</strong> pour marquer les blocs, et un <code>jmp</code> pour ne pas exécuter les deux branches. Il n'y a pas de <code>{ }</code> : la logique repose entièrement sur les sauts.</div>

<h3>4. Signé vs non signé</h3>
<p>Un même paquet de bits se lit de deux façons : <strong>signé</strong> (le nombre peut être négatif) ou <strong>non signé</strong> (toujours positif ou nul). Le processeur a donc deux familles de sauts.</p>
<pre class="pseudo">jl / jg / jle / jge   → comparaison SIGNEE (nombres avec signe, éventuellement négatifs)
jb / ja / jbe / jae   → comparaison NON SIGNEE (below/above = en-dessous/au-dessus)</pre>
<p>Choisir le bon selon que les valeurs sont signées ou non : un même motif de bits se compare différemment.</p>

<h3>5. Les trois cibles</h3>
<p>Le principe est le même partout, seuls les noms changent selon l'<strong>assembleur</strong> (le langage bas niveau) et l'<strong>architecture</strong> (la famille de processeur).</p>
<pre class="pseudo">NASM   cmp rax, 5   ; jl faible   ; syntaxe Intel : compare rax a 5, saute si rax < 5
AT&amp;T   cmp $5, %rax ; jl faible   ; syntaxe AT&amp;T : cmp $5,%rax compare rax a 5 (opérandes inversés)
ARM64  cmp x0, 5    ; b.lt faible ; ARM64 : sauts prefixes b. (b.eq, b.ne, b.lt, b.gt…)</pre>
<div class="tip">Le mécanisme est universel : une instruction de comparaison positionne des drapeaux, un branchement conditionnel les lit. Seuls changent les noms (<code>jl</code> vs <code>b.lt</code>). L'ARM64 préfixe ses branchements par <code>b.</code> suivi de la condition.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>cmp rax, 5</code> ?", opts: ["met 5 dans rax", "compare rax à 5 (positionne les drapeaux), sans modifier rax", "additionne", "saute"], a: 1, exp: "Soustraction fictive." },
    { type: "qcm", q: "cmp modifie-t-il rax ?", opts: ["oui", "non : il ne fait que positionner les drapeaux", "parfois", "toujours"], a: 1, exp: "Non-destructif." },
    { type: "qcm", q: "<code>je</code> saute si…", opts: ["a < b", "a == b (equal)", "a > b", "toujours"], a: 1, exp: "ZF=1." },
    { type: "qcm", q: "<code>jl</code> (signé) après cmp a, b saute si…", opts: ["a == b", "a < b", "a > b", "a != b"], a: 1, exp: "Jump if less." },
    { type: "qcm", q: "<code>jmp</code> est un saut…", opts: ["conditionnel", "inconditionnel (toujours)", "vers la mémoire", "vers un registre seulement"], a: 1, exp: "Sans condition." },
    { type: "qcm", q: "Les sauts conditionnels lisent…", opts: ["la mémoire", "les drapeaux positionnés par cmp", "un tableau", "l'écran"], a: 1, exp: "ZF, SF…" },
    { type: "qcm", q: "Un if se construit avec…", opts: ["des accolades", "cmp + saut conditionnel + étiquettes", "un mov seul", "write"], a: 1, exp: "Pas de { } en asm." },
    { type: "qcm", q: "Pourquoi un jmp après la 1re branche d'un if/else ?", opts: ["décoration", "pour ne pas exécuter aussi la branche else", "accélérer", "aucune raison"], a: 1, exp: "Sauter par-dessus l'autre branche." },
    { type: "qcm", q: "jl/jg sont pour…", opts: ["le non signé", "le signé", "les chaînes", "les flottants"], a: 1, exp: "jb/ja pour le non signé." },
    { type: "qcm", q: "jne saute si…", opts: ["a == b", "a != b", "a > b", "jamais"], a: 1, exp: "Not equal." },
    { type: "vf", q: "En assembleur, la logique conditionnelle repose entièrement sur les sauts.", a: true, exp: "Aucun bloc structuré." },
    { type: "qcm", q: "L'ARM64 écrit un saut « si inférieur »…", opts: ["jl", "b.lt", "jle", "cmp"], a: 1, exp: "b. + condition." },
    { type: "qcm", q: "Une étiquette (label) sert à…", opts: ["stocker une valeur", "marquer une position pour y sauter", "additionner", "afficher"], a: 1, exp: "Cible d'un saut." },
    { type: "qcm", q: "jge signifie…", opts: ["<", ">=", "==", "!="], a: 1, exp: "Greater or equal." },
    { type: "qcm", q: "Comparer un même motif de bits signé/non signé…", opts: ["donne le même résultat", "peut différer (d'où jl vs jb)", "est interdit", "plante"], a: 1, exp: "Choisir le bon saut." }
  ],
  final: {
    title: "Exercice final — Classer un stock",
    intro: `<p>On veut : si stock (3) < 5, renvoyer 1, sinon 0. Analyse :</p>
<pre class="pseudo">    mov rax, 3         ; place le stock (3) dans rax
    cmp rax, 5         ; compare le stock a 5 (positionne les drapeaux)
    jl faible          ; si stock < 5, sauter a l'etiquette faible
    mov rdi, 0         ; sinon : resultat 0 (mais on va TOMBER dans faible : bug !)
faible:                ; etiquette
    mov rdi, 1         ; resultat 1
fin:                   ; etiquette de fin
    mov rax, 60        ; numero de l'appel systeme exit
    syscall            ; termine le programme</pre>`,
    questions: [
      { type: "qcm", q: "Le bug de flux :", opts: ["aucun", "après mov rdi,0, il faut jmp fin, sinon on tombe dans faible", "cmp est faux", "jl est faux"], a: 1, exp: "Les deux branches s'exécutent." },
      { type: "qcm", q: "cmp rax, 5 puis jl saute si…", opts: ["rax == 5", "rax < 5", "rax > 5", "toujours"], a: 1, exp: "3 < 5 : on saute." },
      { type: "qcm", q: "Que faut-il ajouter après <code>mov rdi, 0</code> ?", opts: ["rien", "jmp fin (sauter la branche faible)", "un cmp", "un ret"], a: 1, exp: "Éviter la chute." },
      { type: "qcm", q: "Avec stock=3, le résultat correct est…", opts: ["0", "1 (faible)", "5", "erreur"], a: 1, exp: "3 < 5." },
      { type: "qcm", q: "En ARM64, le saut « si inférieur » s'écrit…", opts: ["jl", "b.lt", "jle", "less"], a: 1, exp: "Préfixe b." }
    ],
    solution: `<pre class="pseudo">section .text          ; debut de la section du code executable
    global _start      ; rend _start visible pour l'editeur de liens (point d'entree)
_start:                ; le programme demarre ici
    mov rax, 3         ; place le stock (3) dans rax
    cmp rax, 5         ; compare le stock a 5 (met a jour les drapeaux)
    jl faible          ; si stock < 5, sauter a l'etiquette faible
    mov rdi, 0         ; sinon : ok -> resultat 0
    jmp fin            ; NE PAS tomber dans faible : sauter directement a fin
faible:                ; etiquette : cas stock < 5
    mov rdi, 1         ; resultat 1 (stock faible)
fin:                   ; etiquette : les deux chemins se rejoignent
    mov rax, 60        ; numero de l'appel systeme exit
    syscall            ; le noyau termine le programme
; echo $?  -> 1        # dans le terminal, echo $? affiche le code de sortie : 1
; ARM64 : cmp x0, 5 ; b.lt faible   ; meme logique avec la syntaxe ARM64</pre>
<p>Il manquait le <code>jmp fin</code> : sans lui, la branche « sinon » enchaînait sur « faible ». En assembleur, chaque chemin doit être explicitement guidé. Demain : les boucles.</p>`
  }
};
</script>
