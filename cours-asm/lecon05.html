<script>
var DAY = {
  num: 5,
  title: "Mémoire et sections (.data, .bss, .text)",
  subtitle: "Où vivent le code et les données, et comment réserver de la mémoire.",
  theory: `
<h3>1. Les sections d'un programme</h3>
<p>Un programme range son contenu dans des <strong>sections</strong> : une section est une zone qui regroupe un même type de contenu, un peu comme les rayons d'un magasin (un rayon pour le code, un rayon pour les données). Cela aide le système à savoir ce qu'il peut lire, écrire ou exécuter.</p>
<pre class="pseudo">section .text   ; le CODE (les instructions à exécuter) — en lecture seule
section .data   ; les données INITIALISÉES (textes, constantes, valeurs de départ)
section .bss    ; les données NON initialisées (tampons réservés, mis à zéro au lancement)</pre>
<p>On sépare toujours le code des données. <code>.data</code> contient ce qui possède une valeur de départ ; <code>.bss</code> réserve de la place <em>sans</em> valeur initiale — cette zone est automatiquement remplie de zéros quand le programme démarre. « Initialiser » veut dire « donner une valeur de départ ».</p>

<h3>2. Déclarer des données (.data)</h3>
<p>Rappel : un <strong>bit</strong> vaut 0 ou 1, et 8 bits forment un <strong>octet</strong> (une valeur de 0 à 255). Pour ranger une donnée, on choisit sa <strong>taille</strong> en octets. NASM propose des directives (des ordres pour l'assembleur, pas pour le processeur) qui réservent et remplissent la mémoire :</p>
<pre class="pseudo">section .data
    car   db 65              ; db = 1 octet  (byte)         → range la valeur 65
    court dw 300             ; dw = 2 octets (word)         → un entier jusqu'à 65535
    moyen dd 70000           ; dd = 4 octets (double word)  → un entier plus grand
    prix  dq 44              ; dq = 8 octets (quad word)    → un entier 64 bits
    liste dq 44, 12, 39      ; un tableau (suite) de 3 quad words rangés côte à côte</pre>
<p>La taille compte : un octet (<code>db</code>) va de 0 à 255, un quad word (<code>dq</code>) contient un entier 64 bits (énorme). On choisit la directive selon les valeurs à stocker. Le mot à gauche (<code>car</code>, <code>prix</code>…) est une <strong>étiquette</strong> : un nom qui repère l'<strong>adresse</strong> (l'emplacement) de la donnée en mémoire.</p>

<h3>3. Réserver sans initialiser (.bss)</h3>
<p>Parfois on veut juste de la place vide, à remplir plus tard (par exemple pour y lire ce que tape l'utilisateur). Les directives <code>resb</code>/<code>resq</code> (« reserve byte / quad ») réservent cette place sans lui donner de valeur.</p>
<pre class="pseudo">section .bss
    buf    resb 64           ; resb = réserve 64 octets vides (un « tampon »)
    tampon resq 10           ; resq = réserve 10 quad words (10 × 8 = 80 octets)</pre>
<p>Un <strong>tampon</strong> (en anglais <em>buffer</em>) est une zone de mémoire temporaire où l'on dépose des données en transit — idéal pour un tampon de lecture (leçon 14) : on réserve la place ici, on la remplira à l'exécution.</p>

<h3>4. Lire et écrire en mémoire</h3>
<p>Pour travailler sur une donnée en mémoire, on la déplace avec <code>mov</code>. Attention à la présence ou l'absence de crochets, qui change tout.</p>
<pre class="pseudo">mov rax, [prix]     ; LIT la valeur en mémoire : charge dans rax le contenu à l'adresse prix (déréférencement)
mov [prix], rax     ; ÉCRIT en mémoire : range le contenu de rax à l'adresse prix
mov rax, prix       ; charge l'ADRESSE de prix (le numéro de case), PAS la valeur qui s'y trouve</pre>
<div class="warn">Distinction cruciale : <code>[prix]</code> = <em>le contenu</em> rangé à l'adresse (déréférencer = « suivre l'adresse pour lire ce qu'elle pointe ») ; <code>prix</code> (sans crochets) = <em>l'adresse</em> elle-même. Confondre les deux est l'erreur n°1 du débutant.</div>

<h3>5. Les trois cibles</h3>
<p>Déclarer une donnée et la charger se dit un peu différemment selon la cible :</p>
<pre class="pseudo">NASM   prix dq 44          →  mov rax, [prix]              ; déclare puis lit la valeur
AT&amp;T   prix: .quad 44      →  mov prix(%rip), %rax         ; même machine, autre écriture
ARM64  prix: .quad 44      →  ldr x0, =prix ; ldr x0, [x0] ; charger l'adresse, puis lire à cette adresse</pre>
<div class="tip">L'ARM64 est une architecture <strong>load/store</strong> : on ne calcule jamais directement sur la mémoire, il faut d'abord <strong>charger</strong> (<code>ldr</code>, « load register ») une valeur dans un registre, puis <strong>stocker</strong> (<code>str</code>, « store register ») le résultat. Le x86 permet quelques opérations directement en mémoire, mais le principe reste : les registres pour calculer, la mémoire pour conserver.</div>`,
  exercises: [
    { type: "qcm", q: "La section .text contient…", opts: ["les données", "le code (instructions)", "la pile", "les fichiers"], a: 1, exp: "Les instructions." },
    { type: "qcm", q: "La section .data contient…", opts: ["le code", "les données initialisées (textes, constantes)", "les tampons vides", "rien"], a: 1, exp: "Valeurs de départ." },
    { type: "qcm", q: "La section .bss contient…", opts: ["le code", "les données non initialisées (place réservée)", "les textes", "la pile"], a: 1, exp: "Mise à zéro au lancement." },
    { type: "qcm", q: "<code>db</code> réserve…", opts: ["8 octets", "1 octet", "4 octets", "2 octets"], a: 1, exp: "define byte." },
    { type: "qcm", q: "<code>dq</code> réserve…", opts: ["1 octet", "8 octets (quad word)", "2 octets", "4 octets"], a: 1, exp: "Entier 64 bits." },
    { type: "qcm", q: "Un octet (db) va de…", opts: ["0 à 65535", "0 à 255", "0 à 9", "sans limite"], a: 1, exp: "8 bits." },
    { type: "qcm", q: "<code>resb 64</code> (dans .bss) fait…", opts: ["exécuter", "réserver 64 octets non initialisés", "afficher", "additionner"], a: 1, exp: "Un tampon." },
    { type: "qcm", q: "<code>[prix]</code> désigne…", opts: ["l'adresse de prix", "le contenu à l'adresse prix", "un registre", "une section"], a: 1, exp: "Déréférencement." },
    { type: "qcm", q: "<code>prix</code> (sans crochets) désigne…", opts: ["le contenu", "l'adresse", "0", "un octet"], a: 1, exp: "L'adresse elle-même." },
    { type: "qcm", q: "Confondre [prix] et prix est…", opts: ["sans effet", "l'erreur n°1 du débutant", "impossible", "recommandé"], a: 1, exp: "Contenu vs adresse." },
    { type: "vf", q: "L'ARM64 est une architecture load/store : on charge/stocke via des registres.", a: true, exp: "Pas de calcul direct en mémoire." },
    { type: "qcm", q: "Un tampon de lecture se réserve dans…", opts: [".text", ".bss", ".data", "un registre"], a: 1, exp: "resb dans .bss." },
    { type: "qcm", q: "<code>liste dq 44, 12, 39</code> déclare…", opts: ["une chaîne", "un tableau de 3 quad words", "un octet", "une fonction"], a: 1, exp: "3 entiers 64 bits." },
    { type: "qcm", q: "<code>mov [prix], rax</code> fait…", opts: ["lire prix", "écrire rax en mémoire à l'adresse prix", "additionner", "l'adresse"], a: 1, exp: "Registre → mémoire." },
    { type: "qcm", q: "On calcule dans les registres et on conserve dans…", opts: ["le code", "la mémoire", "la pile seulement", "l'écran"], a: 1, exp: "Registres = travail, mémoire = stockage." }
  ],
  final: {
    title: "Exercice final — Contenu vs adresse",
    intro: `<p>On veut charger la valeur d'un prix. Analyse :</p>
<pre class="pseudo">section .data
    prix dq 44          ; déclare un quad word (8 octets) valant 44, nommé « prix »
section .text
    global _start       ; point d'entrée visible du lieur
_start:                 ; l'exécution commence ici
    mov rax, prix       ; ATTENTION : sans crochets → charge l'ADRESSE de prix, pas la valeur 44
    mov rdi, rax        ; copie cette adresse dans rdi (au lieu de la valeur voulue)</pre>`,
    questions: [
      { type: "qcm", q: "<code>mov rax, prix</code> charge…", opts: ["44 (la valeur)", "l'adresse de prix (pas la valeur)", "0", "un octet"], a: 1, exp: "Sans crochets = adresse." },
      { type: "qcm", q: "Pour charger la valeur 44, il faut…", opts: ["mov rax, prix", "mov rax, [prix]", "mov [rax], prix", "add rax, prix"], a: 1, exp: "Les crochets déréférencent." },
      { type: "qcm", q: "prix est déclaré avec dq : il fait…", opts: ["1 octet", "8 octets", "2 octets", "4 octets"], a: 1, exp: "Quad word." },
      { type: "qcm", q: "Que manque-t-il au programme ?", opts: ["rien", "l'exit (rax=60)", "un add", "un ret"], a: 1, exp: "Terminer." },
      { type: "qcm", q: "En ARM64, charger la valeur demande…", opts: ["un seul mov", "ldr x0, =prix puis ldr x0, [x0] (load/store)", "add", "rien"], a: 1, exp: "Charger l'adresse puis déréférencer." }
    ],
    solution: `<pre class="pseudo">section .data
    prix dq 44          ; déclare un quad word (8 octets) valant 44
section .text
    global _start       ; rend _start visible du lieur : point d'entrée
_start:                 ; l'exécution commence ici
    mov rax, [prix]     ; charge la VALEUR 44 (crochets = contenu à l'adresse) dans rax
    mov rdi, rax        ; copie 44 dans rdi = code de retour du programme
    mov rax, 60         ; met 60 dans rax = numéro du syscall exit (terminer)
    syscall             ; déclenche l'appel système : le programme se termine en renvoyant rdi
; echo $?  -> 44        ; dans le terminal, echo $? affiche 44
; ARM64 : ldr x0, =prix ; ldr x0, [x0]   ; charger l'adresse puis la valeur (architecture load/store)</pre>
<p>Les crochets font toute la différence : <code>[prix]</code> lit la valeur, <code>prix</code> donne l'adresse. Demain : la multiplication, la division et les drapeaux.</p>`
  }
};
</script>
