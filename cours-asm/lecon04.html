<script>
var DAY = {
  num: 4,
  title: "mov, add, sub : les instructions de base",
  subtitle: "Copier et calculer : les briques arithmétiques qui écrasent leur destination.",
  theory: `
<h3>1. mov : copier une valeur</h3>
<p>Avant tout, rappelons trois mots-clés. Un <strong>registre</strong> est une minuscule case de stockage ultra-rapide située <em>à l'intérieur</em> du <strong>processeur</strong> (le « cerveau » de l'ordinateur qui exécute les calculs) ; en x86-64, les principaux s'appellent <code>rax</code>, <code>rbx</code>, <code>rcx</code>… La <strong>mémoire</strong> (la RAM) est une grande étagère de cases numérotées, bien plus vaste que les registres mais aussi plus lente. Une <strong>instruction</strong> est un ordre élémentaire donné au processeur. Celle qu'on rencontre le plus souvent, <code>mov</code> (de l'anglais <em>move</em>, « déplacer »), <em>copie</em> une valeur d'un endroit vers un autre.</p>
<pre class="pseudo">mov rax, 44        ; copie la valeur immédiate 44 dans le registre rax (destination à GAUCHE en NASM)
mov rbx, rax       ; copie le contenu de rax vers rbx ; rax garde sa valeur (registre → registre)
mov rax, [prix]    ; LIT la mémoire : charge dans rax la valeur rangée à l'adresse « prix » ([ ] = « contenu de »)
mov [prix], rax    ; ÉCRIT en mémoire : range le contenu de rax à l'adresse « prix » (registre → mémoire)</pre>
<p>La règle NASM à retenir : <code>mov destination, source</code> — la <strong>destination</strong> (là où l'on range) est toujours à gauche, la <strong>source</strong> (ce qu'on copie) à droite ; la source n'est jamais modifiée. Une <strong>valeur immédiate</strong> est un nombre écrit directement dans l'instruction (comme <code>44</code>). Les <strong>crochets</strong> <code>[ ]</code> se lisent « le contenu à l'adresse » : <code>[prix]</code> désigne la valeur rangée en mémoire à l'endroit nommé <code>prix</code>.</p>
<p>Contrainte importante : une seule des deux <strong>opérandes</strong> peut être en mémoire à la fois (pas de copie mémoire → mémoire directe). Une opérande est simplement un « ingrédient » de l'instruction : ici la destination et la source.</p>

<h3>2. add et sub : additionner et soustraire</h3>
<p><code>add</code> (addition) et <code>sub</code> (soustraction, de l'anglais <em>subtract</em>) réalisent le calcul et rangent le résultat dans la première opérande, la destination.</p>
<pre class="pseudo">add rax, rbx       ; additionne rbx à rax, résultat dans rax   (rax = rax + rbx)
add rax, 5         ; ajoute la valeur immédiate 5 à rax         (rax = rax + 5)
sub rax, rbx       ; soustrait rbx de rax, résultat dans rax    (rax = rax - rbx)
sub rax, 3         ; retire 3 à rax                             (rax = rax - 3)</pre>
<div class="warn">Ces instructions <strong>écrasent la première opérande</strong> (la destination) : <code>add rax, rbx</code> range le résultat dans <code>rax</code>, tandis que <code>rbx</code> ne change pas. Il n'existe pas de « rax = rbx + rcx » en une seule instruction sur x86 — il faut d'abord copier une valeur, puis additionner l'autre.</div>

<h3>3. inc, dec, neg : les raccourcis</h3>
<p>Trois instructions très courtes qui reviennent tout le temps, notamment pour faire avancer un <strong>compteur</strong> (une valeur qu'on augmente ou diminue à chaque tour d'une boucle).</p>
<pre class="pseudo">inc rax            ; incrémente rax : lui ajoute 1   (rax = rax + 1)
dec rax            ; décrémente rax : lui retire 1   (rax = rax - 1)
neg rax            ; remplace rax par son opposé     (rax = -rax)</pre>
<p><code>inc</code> et <code>dec</code> sont des versions abrégées de <code>add …, 1</code> et <code>sub …, 1</code>. <code>neg</code> change le signe (transforme 6 en -6 et inversement).</p>

<h3>4. Un calcul complet</h3>
<p>Enchaînons plusieurs instructions : chacune met à jour <code>rax</code> à tour de rôle, comme une caisse enregistreuse dont on ajuste le total au fil des opérations.</p>
<pre class="pseudo">mov rax, 3          ; on part d'un stock de 3 unités (on met 3 dans rax)
add rax, 5          ; arrivage de 5 : rax passe à 8   (rax = rax + 5)
sub rax, 2          ; 2 unités vendues : rax passe à 6 (rax = rax - 2)
; rax vaut 6        ; commentaire : à ce stade, rax contient le résultat final 6</pre>

<h3>5. Les trois cibles</h3>
<p>Le même calcul s'écrit un peu différemment selon la <strong>cible</strong> (la machine et la façon de l'écrire). Chaque ligne ci-dessous fait exactement la même chose ; seule la notation change :</p>
<pre class="pseudo">NASM   mov rax, 3   ; add rax, 5   ; sub rax, 2      ; x86 NASM : destination à gauche, deux opérandes
AT&amp;T   movq $3,%rax ; addq $5,%rax ; subq $2,%rax    ; même machine, autre écriture : dest à droite, préfixes % (registre) et $ (immédiat)
ARM64  mov x0, 3    ; add x0, x0, 5 ; sub x0, x0, 2   ; autre machine : trois opérandes, registres x0..x30</pre>
<div class="tip">Différence de philosophie : le x86 est à <strong>deux opérandes</strong> (la destination est aussi une source, donc elle est écrasée) ; l'ARM64 est à <strong>trois opérandes</strong> (<code>add x0, x1, x2</code> : x0 reçoit x1+x2, sans écraser x1). L'ARM est plus régulier, le x86 plus compact.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>mov rbx, rax</code> ?", opts: ["additionne", "copie rax dans rbx", "compare", "échange"], a: 1, exp: "Copie simple." },
    { type: "qcm", q: "Que signifient les crochets dans <code>mov rax, [prix]</code> ?", opts: ["l'adresse de prix", "le contenu à l'adresse prix (mémoire)", "un tableau", "rien"], a: 1, exp: "Déréférencement." },
    { type: "qcm", q: "Peut-on faire mov de mémoire à mémoire directement ?", opts: ["oui", "non : une seule opérande en mémoire à la fois", "toujours", "jamais aucun mov"], a: 1, exp: "Passer par un registre." },
    { type: "qcm", q: "<code>add rax, rbx</code> range le résultat dans…", opts: ["rbx", "rax (la destination)", "un nouveau registre", "la mémoire"], a: 1, exp: "La 1re opérande est écrasée." },
    { type: "qcm", q: "Après <code>add rax, rbx</code>, rbx est…", opts: ["modifié", "inchangé", "à zéro", "l'adresse"], a: 1, exp: "Seule la destination change." },
    { type: "qcm", q: "Que fait <code>sub rax, 3</code> ?", opts: ["rax = 3", "rax = rax - 3", "rax = 3 - rax", "compare"], a: 1, exp: "Soustraction en place." },
    { type: "qcm", q: "<code>inc rax</code> équivaut à…", opts: ["rax = 1", "rax = rax + 1", "rax = rax - 1", "rax = -rax"], a: 1, exp: "+1." },
    { type: "qcm", q: "<code>neg rax</code> fait…", opts: ["rax = rax + 1", "rax = -rax", "rax = 0", "rien"], a: 1, exp: "Opposé." },
    { type: "qcm", q: "Le x86 est un jeu d'instructions à…", opts: ["trois opérandes", "deux opérandes (destination = source écrasée)", "une opérande", "zéro"], a: 1, exp: "add dest, src." },
    { type: "qcm", q: "L'ARM64 est à…", opts: ["deux opérandes", "trois opérandes (add x0, x1, x2)", "une opérande", "quatre"], a: 1, exp: "Plus régulier." },
    { type: "vf", q: "En x86, « rax = rbx + rcx » nécessite plusieurs instructions.", a: true, exp: "Copier rbx puis add rcx." },
    { type: "qcm", q: "En AT&T, <code>addq $5, %rax</code> :", opts: ["rax = 5", "rax = rax + 5 (dest à droite)", "rax = 5 - rax", "erreur"], a: 1, exp: "Ordre inversé, préfixes." },
    { type: "qcm", q: "<code>mov [prix], rax</code> fait…", opts: ["lit la mémoire", "écrit rax en mémoire à l'adresse prix", "additionne", "compare"], a: 1, exp: "Registre → mémoire." },
    { type: "qcm", q: "Après <code>mov rax,3 ; add rax,5 ; sub rax,2</code>, rax =", opts: ["10", "6", "8", "0"], a: 1, exp: "3+5-2 = 6." },
    { type: "qcm", q: "En ARM64, <code>add x0, x1, x2</code> laisse x1…", opts: ["écrasé", "inchangé (x0 reçoit x1+x2)", "à zéro", "négatif"], a: 1, exp: "Trois opérandes distinctes." }
  ],
  final: {
    title: "Exercice final — Le compte du stock",
    intro: `<p>On veut : stock 3, +5 arrivage, -2 vendus, résultat renvoyé. Analyse :</p>
<pre class="pseudo">mov rax, 3          ; on met 3 dans rax (le stock de départ)
add 5, rax          ; ERREUR : en NASM la destination vient en premier ; ici l'ordre est inversé
sub rax, 2          ; retire 2 à rax (rax = rax - 2)
mov rdi, rax        ; copie le résultat dans rdi (le 1er argument du syscall exit)</pre>`,
    questions: [
      { type: "qcm", q: "Erreur — <code>add 5, rax</code> :", opts: ["correct", "l'ordre NASM est add dest, src : add rax, 5", "il faut sub", "rien"], a: 1, exp: "Destination en premier." },
      { type: "qcm", q: "add écrase…", opts: ["la source", "la destination (1re opérande)", "les deux", "aucune"], a: 1, exp: "rax = rax + 5." },
      { type: "qcm", q: "Après correction, rax vaut…", opts: ["10", "6", "8", "0"], a: 1, exp: "3+5-2." },
      { type: "qcm", q: "Que manque-t-il pour renvoyer le résultat ?", opts: ["rien", "l'exit (rax=60) après mov rdi, rax", "un add", "un ret"], a: 1, exp: "Terminer le programme." },
      { type: "qcm", q: "En ARM64, l'ajout de 5 s'écrirait…", opts: ["add 5, x0", "add x0, x0, 5", "add x0, 5", "5 + x0"], a: 1, exp: "Trois opérandes." }
    ],
    solution: `<pre class="pseudo">section .text          ; section du CODE (les instructions à exécuter)
    global _start      ; rend l'étiquette _start visible du lieur : c'est le point d'entrée du programme
_start:                ; étiquette : l'exécution commence ici
    mov rax, 3          ; met 3 dans rax : le stock de départ
    add rax, 5          ; ajoute l'arrivage de 5 → rax = 8   (destination en premier !)
    sub rax, 2          ; retire les 2 unités vendues → rax = 6
    mov rdi, rax        ; copie le résultat (6) dans rdi = code de retour du programme
    mov rax, 60         ; met 60 dans rax = numéro du syscall exit (terminer le programme)
    syscall             ; déclenche l'appel système : le programme se termine en renvoyant rdi
; echo $?  -> 6         ; dans le terminal, echo $? affiche le code de sortie : 6
; ARM64 : mov x0,3 ; add x0,x0,5 ; sub x0,x0,2   ; même calcul sur ARM64 (trois opérandes)</pre>
<p>En NASM, la destination vient en premier et l'opération l'écrase. Demain : la mémoire et les sections.</p>`
  }
};
</script>

  items: [
  { id: "asm-l04", title: "Un petit calcul de caisse", level: 2,
    statement: "Écris un programme NASM qui calcule (10 + 5 - 3) × 1 dans rax en utilisant mov, add et sub (sans imul), et renvoie le résultat (12) comme code de sortie. Montre en commentaire l'équivalent ARM64 de l'addition.",

      "mov rax, 10 ; add rax, 5 ; sub rax, 3.",

      "ARM64 : add x0, x0, 5 (trois opérandes)."
    ],
    solution: "section .text            ; section du code (les instructions)\n    global _start        ; point d'entree visible du lieur\n_start:                  ; l'execution commence ici\n    mov rax, 10          ; met 10 dans rax\n    add rax, 5           ; rax = rax + 5 = 15\n    sub rax, 3           ; rax = rax - 3 = 12\n    mov rdi, rax         ; copie 12 dans rdi = code de retour\n    mov rax, 60          ; numero du syscall exit (terminer)\n    syscall              ; termine le programme en renvoyant rdi (12)\n; echo $?  -> 12         ; dans le terminal, echo $? affiche 12\n;\n; Equivalent ARM64 de l'addition :\n;   add x0, x0, 5   ; x0 = x0 + 5 (trois operandes, x0 non ecrase par une source distincte)",
    note: "add et sub écrasent la destination (1re opérande en NASM). Le résultat 12 se lit via echo $?. L'ARM64 à trois opérandes n'écrase pas ses sources : c'est la différence de philosophie entre les deux architectures." }
  ]
};
