<script>
var DAY = {
  num: 10,
  title: "Fonctions et convention d'appel",
  subtitle: "call et ret, et la règle qui dit où passent les arguments : la convention System V.",
  theory: `
<h3>1. call et ret</h3>
<p>Quelques mots de vocabulaire avant de commencer, pour un débutant total :</p>
<p>Une <strong>instruction</strong> est un ordre élémentaire que le processeur sait exécuter (additionner, comparer, sauter…) ; ton programme n'est qu'une longue liste d'instructions. Un <strong>registre</strong> est une minuscule case de mémoire ultra-rapide située <em>dans</em> le processeur (par exemple <code>rax</code>, <code>rdi</code>) : c'est là que le processeur pose les nombres sur lesquels il travaille. La <strong>mémoire</strong> est la grande réserve de cases (la RAM) où sont rangés le programme et ses données ; une <strong>adresse</strong> est le « numéro » qui désigne une case précise. La <strong>pile</strong> (<em>stack</em> en anglais) est une zone de mémoire organisée comme une pile d'assiettes : on <em>empile</em> (push) une valeur sur le dessus, et on <em>dépile</em> (pop) toujours celle du dessus en premier. Une <strong>fonction</strong> est un petit bout de programme réutilisable (comme une recette) qu'on peut <em>appeler</em> plusieurs fois. Une <strong>étiquette</strong> (label) est un nom donné à un endroit du code, comme un signet.</p>
<pre class="pseudo">    call tarif          ; appelle la fonction tarif : empile l'adresse de l'instruction suivante (le retour) puis saute à l'étiquette tarif
    ; ... la suite s'exécute au retour ...   ; ligne de commentaire : le code reprend ici quand tarif exécutera ret

tarif:                  ; étiquette : marque le début de la fonction tarif (juste une adresse nommée)
    ; ... corps ...      ; ici se trouverait le travail (les instructions) de la fonction
    ret                 ; retour : dépile l'adresse de retour rangée par call et saute à cette adresse</pre>
<p><code>call</code> fait deux choses : il <strong>empile</strong> l'adresse de l'instruction suivante (pour savoir où revenir), puis saute à l'étiquette. <code>ret</code> dépile cette adresse et y retourne. La pile mémorise donc le « chemin du retour ».</p>

<h3>2. La convention d'appel (System V AMD64)</h3>
<p>Un <strong>argument</strong> est une valeur qu'on donne à une fonction pour qu'elle travaille avec (comme les ingrédients qu'on donne à une recette). Un <strong>opérande</strong> est l'une des valeurs sur lesquelles une instruction agit (dans <code>mov rdi, 5</code>, <code>rdi</code> et <code>5</code> sont les opérandes). L'<strong>appelant</strong> est le code qui déclenche la fonction ; la fonction est l'<em>appelée</em>. Une <strong>convention d'appel</strong> est un accord sur <em>où</em> mettre les arguments et le résultat, pour que fonctions et appelants se comprennent, même écrits séparément. Sous Linux x86-64, cet accord s'appelle System V AMD64 :</p>
<pre class="pseudo">Arguments (entiers) : rdi, rsi, rdx, rcx, r8, r9   ; les 6 premiers arguments entiers passent dans ces 6 registres, dans cet ordre exact
Argument suivants   : sur la pile                   ; à partir du 7e argument, l'appelant les dépose sur la pile
Valeur de retour    : rax                            ; la fonction rend son résultat dans le registre rax</pre>

<h3>3. Une fonction complète</h3>
<pre class="pseudo">_start:                 ; point d'entrée du programme (là où l'exécution commence)
    mov rdi, 5          ; met la valeur 5 dans rdi : ce sera le 1er argument
    mov rsi, 4          ; met la valeur 4 dans rsi : ce sera le 2e argument
    call tarif          ; appelle tarif ; à la fin, le résultat sera dans rax
    ; ...               ; suite du programme (utiliser rax, puis sortir…)

tarif:                  ; début de la fonction tarif : elle calcule rax = rdi * rsi
    mov rax, rdi        ; copie le 1er argument (rdi) dans rax
    imul rax, rsi       ; multiplie rax par le 2e argument (rsi) : rax = rdi * rsi
    ret                 ; renvoie à l'appelant (le résultat est déjà dans rax)</pre>

<h3>4. Registres préservés ou non</h3>
<div class="warn">La convention précise aussi quels registres une fonction peut écraser librement (<em>caller-saved</em> : rax, rcx, rdx, rsi, rdi, r8–r11) et lesquels elle doit restaurer si elle les modifie (<em>callee-saved</em> : rbx, rbp, r12–r15). Respecter cela évite que ta fonction n'abîme les registres de l'appelant. (« caller-saved » = c'est à l'appelant de sauvegarder ces registres s'il y tient ; « callee-saved » = c'est à la fonction appelée de les rendre intacts.)</div>

<h3>5. Les trois cibles</h3>
<p>Un <strong>assembleur</strong> est un programme qui traduit ton code en langage machine (ici NASM pour le x86, la syntaxe AT&amp;T étant une autre écriture du même processeur). ARM64 est une autre famille de processeurs (téléphones, Mac récents) avec sa propre convention (AAPCS). Voici comment appeler une fonction sur chaque cible :</p>
<pre class="pseudo">NASM/AT&amp;T (x86-64) : call f / ret ; args rdi, rsi… ; retour rax   ; sur x86-64 : on appelle avec call, on revient avec ret, arguments dans rdi/rsi…, résultat dans rax
ARM64 (AAPCS)      : bl f / ret   ; args x0..x7    ; retour x0     ; sur ARM64 : on appelle avec bl, arguments dans x0..x7, résultat dans x0
                     (bl = branch with link : sauve le retour dans x30/lr)   ; bl range l'adresse de retour dans le registre x30 (alias lr) au lieu de la pile</pre>
<div class="tip">L'ARM64 met l'adresse de retour dans un registre dédié (<code>x30</code>, alias <code>lr</code>) plutôt que sur la pile — <code>bl</code> l'y place, <code>ret</code> y retourne. Le concept est identique : appeler, exécuter, revenir. Chaque plateforme a sa convention (System V sous Linux, une autre sous Windows).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>call tarif</code> ?", opts: ["saute seulement", "empile l'adresse de retour puis saute à tarif", "additionne", "termine"], a: 1, exp: "Mémorise le retour." },
    { type: "qcm", q: "Que fait <code>ret</code> ?", opts: ["appelle une fonction", "dépile l'adresse de retour et y revient", "additionne", "compare"], a: 1, exp: "Retour à l'appelant." },
    { type: "qcm", q: "Une convention d'appel définit…", opts: ["la vitesse", "où passent les arguments et le résultat", "l'affichage", "les sections"], a: 1, exp: "Accord appelant/fonction." },
    { type: "qcm", q: "Le 1er argument entier (System V) va dans…", opts: ["rax", "rdi", "rsp", "rbx"], a: 1, exp: "rdi." },
    { type: "qcm", q: "Le 2e argument va dans…", opts: ["rax", "rsi", "rdx", "rbp"], a: 1, exp: "rdi, rsi, rdx…" },
    { type: "qcm", q: "La valeur de retour est dans…", opts: ["rdi", "rax", "rsp", "rsi"], a: 1, exp: "rax." },
    { type: "qcm", q: "Au-delà de 6 arguments entiers, on passe par…", opts: ["l'écran", "la pile", "un fichier", "rax"], a: 1, exp: "Les suivants sur la pile." },
    { type: "qcm", q: "L'adresse de retour d'un call est stockée…", opts: ["dans rax", "sur la pile (x86) / dans lr (ARM)", "dans un fichier", "nulle part"], a: 1, exp: "Pour savoir où revenir." },
    { type: "qcm", q: "Un registre callee-saved (rbx…) doit être…", opts: ["écrasé librement", "restauré si la fonction le modifie", "ignoré", "affiché"], a: 1, exp: "Ne pas abîmer l'appelant." },
    { type: "qcm", q: "En ARM64, on appelle avec…", opts: ["call", "bl (branch with link)", "jmp", "ret"], a: 1, exp: "bl sauve le retour dans lr." },
    { type: "vf", q: "La convention d'appel permet à des fonctions écrites séparément de coopérer.", a: true, exp: "Accord partagé." },
    { type: "qcm", q: "En ARM64, l'adresse de retour est dans…", opts: ["la pile obligatoirement", "x30 (lr)", "x0", "rax"], a: 1, exp: "Registre de lien." },
    { type: "qcm", q: "Les arguments ARM64 vont dans…", opts: ["rdi, rsi", "x0..x7", "x30", "sp"], a: 1, exp: "AAPCS." },
    { type: "qcm", q: "Respecter la convention évite…", opts: ["l'affichage", "d'abîmer les registres de l'appelant", "les boucles", "les sections"], a: 1, exp: "Coopération correcte." },
    { type: "qcm", q: "call + ret utilisent la pile pour…", opts: ["afficher", "mémoriser le chemin de retour (x86)", "additionner", "trier"], a: 1, exp: "Adresse de retour." }
  ],
  final: {
    title: "Exercice final — Une fonction double",
    intro: `<p>On veut une fonction qui double son argument. Analyse :</p>
<pre class="pseudo">_start:                 ; point d'entrée du programme
    mov rax, 21         ; met 21 dans rax (ATTENTION : rax n'est pas le registre d'argument attendu)
    call doubler        ; appelle doubler (mais l'argument n'est pas dans rdi…)
    mov rdi, rax        ; récupère rax comme code de sortie
    ; exit ...          ; puis on quitterait le programme
doubler:                ; fonction censée doubler son argument
    add rdi, rdi        ; double rdi (mais rdi n'a pas reçu la valeur !) et laisse le résultat dans rdi, pas dans rax
    ret                 ; retour à l'appelant</pre>`,
    questions: [
      { type: "qcm", q: "Le problème :", opts: ["aucun", "l'argument doit être dans rdi (pas rax) et le retour dans rax", "call est faux", "ret est faux"], a: 1, exp: "Convention non respectée." },
      { type: "qcm", q: "Où mettre l'argument avant call ?", opts: ["rax", "rdi (1er argument)", "rsi", "rsp"], a: 1, exp: "System V." },
      { type: "qcm", q: "Où doubler doit-il placer son résultat ?", opts: ["rdi", "rax (valeur de retour)", "rsp", "rbx"], a: 1, exp: "rax." },
      { type: "qcm", q: "call doubler mémorise…", opts: ["rien", "l'adresse de retour sur la pile", "l'argument", "le résultat"], a: 1, exp: "Pour ret." },
      { type: "qcm", q: "En ARM64, l'appel se ferait avec…", opts: ["call", "bl doubler", "jmp doubler", "ret"], a: 1, exp: "bl." }
    ],
    solution: `<pre class="pseudo">section .text           ; début de la section du code exécutable
    global _start       ; rend l'étiquette _start visible pour l'éditeur de liens (point d'entrée)
_start:                 ; point d'entrée du programme
    mov rdi, 21         ; met 21 dans rdi : le 1er argument (respect de la convention)
    call doubler        ; appelle doubler ; le résultat reviendra dans rax
    mov rdi, rax        ; place le résultat (rax) dans rdi : ce sera le code de retour du programme
    mov rax, 60         ; numéro du syscall exit (60) dans rax
    syscall             ; demande au noyau de terminer le programme

doubler:                ; fonction : calcule rax = rdi + rdi
    mov rax, rdi        ; copie l'argument (rdi) dans rax
    add rax, rax        ; ajoute rax à lui-même : rax = 2 * argument
    ret                 ; renvoie à l'appelant (résultat dans rax)
; echo $?  -> 42        # affiche le code de sortie du dernier programme : 42
; ARM64 : bl doubler ; arg dans x0, retour dans x0   ; version ARM64 : appel avec bl, argument et résultat dans x0</pre>
<p>Argument dans <code>rdi</code>, résultat dans <code>rax</code> : la convention System V permet aux fonctions de coopérer. Demain : passer plusieurs arguments et récupérer la valeur de retour.</p>`
  }
};
</script>

    ],

  ]
};
