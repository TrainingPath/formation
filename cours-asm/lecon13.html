<script>
var DAY = {
  num: 13,
  title: "Les chaînes de caractères",
  subtitle: "Un texte = des octets ; le parcourir jusqu'au zéro final, comme strlen.",
  theory: `
<h3>1. Une chaîne = une suite d'octets</h3>
<p>Une <strong>chaîne de caractères</strong> est simplement un texte. En mémoire, ce texte est stocké comme une suite d'<strong>octets</strong> (un octet = 8 bits, une valeur de 0 à 255) : un octet par caractère. Chaque caractère a un numéro, son <strong>code ASCII</strong> — une table qui associe une lettre à un nombre ('A' vaut 65, 'a' vaut 97, '0' vaut 48…).</p>
<pre class="pseudo">section .data
    nom db "Catan", 0        ; 6 octets : 'C','a','t','a','n', puis un octet 0 (fin de chaîne)</pre>
<p>Comme en C, la chaîne se termine par un <strong>octet 0</strong> : c'est le <strong>marqueur de fin</strong> (le « \\0 »). Il ne s'affiche pas ; il sert de panneau « stop » pour dire où le texte s'arrête. C'est indispensable, car rien d'autre n'indique la longueur.</p>

<h3>2. Charger un octet</h3>
<p>Un registre fait 64 bits, mais un caractère n'occupe qu'un octet (8 bits). Il faut donc préciser qu'on ne veut qu'un octet, et dire comment remplir les 56 bits restants.</p>
<pre class="pseudo">movzx rax, byte [nom + rbx]    ; charge 1 octet et complète le reste par des ZÉROS (zero-extend) → 64 bits
movsx rax, byte [nom + rbx]    ; charge 1 octet et complète par le bit de SIGNE (sign-extend)</pre>
<div class="warn">Un octet ne remplit pas un registre 64 bits : <code>movzx</code> (zero-extend, « étendre par des zéros ») le complète par des zéros, <code>movsx</code> (sign-extend) par le bit de signe. Pour des caractères (toujours positifs), on utilise <code>movzx</code>. Le mot <code>byte</code> précise qu'on lit un seul octet.</div>

<h3>3. Calculer la longueur (strlen à la main)</h3>
<p>Pour connaître la longueur, on n'a pas de fonction toute faite : on parcourt octet par octet et on compte jusqu'à rencontrer le 0. C'est exactement ce que fait <code>strlen</code> en C.</p>
<pre class="pseudo">    xor rbx, rbx        ; met rbx à 0 → index = 0 (position du caractère courant)
boucle:                 ; étiquette : début de la boucle
    movzx rax, byte [nom + rbx]   ; charge le caractère courant (1 octet, étendu par des zéros)
    cmp rax, 0                    ; ce caractère est-il le 0 final (fin de chaîne) ?
    je fin                        ; « jump if equal » : si oui, sauter à fin
    inc rbx                       ; sinon longueur++ : passe au caractère suivant
    jmp boucle                    ; saut inconditionnel : recommence le tour
fin:                    ; étiquette de sortie de la boucle
    ; rbx = longueur    ; à ce stade, rbx contient le nombre de caractères (0 non compté)</pre>

<h3>4. Transformer un caractère</h3>
<p>Puisqu'un caractère n'est qu'un nombre (son code ASCII), on le modifie avec de l'arithmétique. Exemple : dans la table ASCII, une minuscule vaut exactement 32 de plus que sa majuscule.</p>
<pre class="pseudo">; passer une minuscule en majuscule : soustraire 32
    movzx rax, byte [nom]   ; charge le 1er caractère (1 octet, étendu par des zéros)
    sub rax, 32             ; 'a' (97) → 'A' (65) : on retire l'écart ASCII de 32</pre>
<p>C'est ainsi que fonctionnent les conversions de casse (minuscule/majuscule), les comparaisons de lettres, etc. : de simples calculs sur des nombres.</p>

<h3>5. Les trois cibles</h3>
<p>Charger un octet se dit un peu différemment selon la cible :</p>
<pre class="pseudo">NASM   movzx rax, byte [nom + rbx]     ; charge 1 octet, étendu par des zéros
AT&amp;T   movzbq nom(,%rbx,1), %rax       ; même chose (z=zero, b→q : octet étendu vers quad)
ARM64  ldrb w0, [x1, x2]               ; ldrb = « load byte » : charge un octet dans w0</pre>
<div class="tip">Manipuler des chaînes en assembleur, c'est boucler octet par octet jusqu'au 0 : aucune fonction magique, juste des <code>ldrb</code>/<code>movzx</code> et des comparaisons. C'est exactement ce que <code>strlen</code>, <code>strcmp</code>, <code>strcpy</code> font — que tu peux maintenant réécrire toi-même.</div>`,
  exercises: [
    { type: "qcm", q: "Une chaîne en mémoire est…", opts: ["un entier", "une suite d'octets terminée par 0", "un flottant", "un registre"], a: 1, exp: "Comme en C." },
    { type: "qcm", q: "Chaque caractère occupe…", opts: ["8 octets", "1 octet (son code ASCII)", "2 octets", "4 octets"], a: 1, exp: "'A' = 65." },
    { type: "qcm", q: "Le marqueur de fin de chaîne est…", opts: ["un espace", "l'octet 0", "un saut de ligne", "le dernier caractère"], a: 1, exp: "Comme le '\\0'." },
    { type: "qcm", q: "<code>movzx</code> sert à…", opts: ["multiplier", "charger un octet en l'étendant par des zéros (64 bits)", "comparer", "sauter"], a: 1, exp: "Zero-extend." },
    { type: "qcm", q: "Pour un caractère (positif), on utilise…", opts: ["movsx", "movzx", "neg", "shl"], a: 1, exp: "Extension par zéros." },
    { type: "qcm", q: "La longueur d'une chaîne se calcule en…", opts: ["une instruction", "parcourant les octets jusqu'au 0", "lisant sa taille", "impossible"], a: 1, exp: "Comme strlen." },
    { type: "qcm", q: "byte [nom + rbx] lit…", opts: ["8 octets", "1 octet à l'index rbx", "l'adresse", "0"], a: 1, exp: "Un caractère." },
    { type: "qcm", q: "Passer 'a' (97) en 'A' (65) :", opts: ["add 32", "sub 32", "add 65", "shr 1"], a: 1, exp: "Décalage ASCII." },
    { type: "qcm", q: "Un caractère se manipule comme…", opts: ["une chaîne", "un nombre (son code ASCII)", "un flottant", "un pointeur"], a: 1, exp: "Arithmétique." },
    { type: "qcm", q: "cmp rax, 0 après avoir chargé un octet teste…", opts: ["la longueur", "si c'est le caractère de fin (0)", "le signe", "rien"], a: 1, exp: "Fin de chaîne." },
    { type: "vf", q: "strlen/strcmp/strcpy sont des boucles octet par octet.", a: true, exp: "Réécrivables en asm." },
    { type: "qcm", q: "En ARM64, charger un octet se fait avec…", opts: ["ldr", "ldrb", "movzx", "str"], a: 1, exp: "Load byte." },
    { type: "qcm", q: "movsx (au lieu de movzx) étend…", opts: ["par des zéros", "par le bit de signe", "par des 1 toujours", "rien"], a: 1, exp: "Pour les valeurs signées." },
    { type: "qcm", q: "Le code ASCII de 'A' est…", opts: ["1", "65", "97", "0"], a: 1, exp: "'a' = 97." },
    { type: "qcm", q: "Aucune fonction magique pour les chaînes : on…", opts: ["appelle strlen automatiquement", "boucle octet par octet à la main (ou via la libc)", "utilise un registre spécial", "rien"], a: 1, exp: "Contrôle total." }
  ],
  final: {
    title: "Exercice final — Longueur d'un nom",
    intro: `<p>On compte les caractères de « Catan ». Analyse :</p>
<pre class="pseudo">    xor rbx, rbx        ; index = 0
boucle:                 ; début de la boucle
    mov rax, [nom + rbx]      ; BUG : lit 8 octets d'un coup ; il faut UN octet (movzx byte)
    cmp rax, 0                ; est-ce la fin de chaîne (0) ?
    je fin                    ; si oui, sortir
    inc rbx                   ; longueur++
    jmp boucle                ; recommence
fin:                    ; sortie de la boucle</pre>`,
    questions: [
      { type: "qcm", q: "Le bug — <code>mov rax, [nom + rbx]</code> :", opts: ["correct", "lit 8 octets d'un coup : il faut movzx rax, byte [nom+rbx]", "il faut rbx*8", "rien"], a: 1, exp: "On veut UN octet." },
      { type: "qcm", q: "Pour charger un seul caractère :", opts: ["mov rax, [nom+rbx]", "movzx rax, byte [nom+rbx]", "mov rax, nom", "add rax, rbx"], a: 1, exp: "byte + movzx." },
      { type: "qcm", q: "La boucle s'arrête quand l'octet vaut…", opts: ["un espace", "0 (marqueur de fin)", "255", "'a'"], a: 1, exp: "je fin." },
      { type: "qcm", q: "rbx à la fin contient…", opts: ["l'adresse", "la longueur de la chaîne", "0", "le dernier caractère"], a: 1, exp: "Nombre de caractères." },
      { type: "qcm", q: "Pour « Catan », la longueur est…", opts: ["4", "5", "6", "0"], a: 1, exp: "5 lettres (le 0 non compté)." }
    ],
    solution: `<pre class="pseudo">section .data
    nom db "Catan", 0    ; 5 lettres + l'octet 0 de fin
section .text
    global _start        ; point d'entrée visible du lieur
_start:                  ; l'exécution commence ici
    xor rbx, rbx        ; met rbx à 0 → index = 0
boucle:                 ; début de la boucle
    movzx rax, byte [nom + rbx]   ; charge UN octet (le caractère courant), étendu par des zéros
    cmp rax, 0                    ; est-ce le 0 de fin de chaîne ?
    je fin                        ; si oui, sauter à fin
    inc rbx                       ; sinon longueur++ : caractère suivant
    jmp boucle                    ; recommence le tour
fin:                    ; sortie de la boucle
    mov rdi, rbx        ; copie la longueur (5) dans rdi = code de retour
    mov rax, 60         ; numéro du syscall exit (terminer)
    syscall             ; termine le programme en renvoyant rdi
; echo $?  -> 5         ; dans le terminal, echo $? affiche 5
; ARM64 : ldrb w0, [x1, x2]   ; même idée : charger un octet</pre>
<p><code>movzx ... byte</code> charge un seul caractère : sans <code>byte</code>, on lisait 8 octets d'un coup. Boucler jusqu'au 0 = <code>strlen</code>. Demain : lire au clavier avec le syscall read.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l13", title: "Compter une lettre", level: 3,
    statement: "Écris un programme qui compte combien de fois la lettre 'a' (code 97) apparaît dans la chaîne « Catan », 0, et renvoie ce nombre (2) comme code de sortie. Parcours octet par octet jusqu'au 0.",
    hints: [
      "Charge chaque octet avec movzx rax, byte [nom + rbx].",
      "cmp rax, 0 → je fin ; cmp rax, 97 → je incremente le compteur.",
      "Garde le compteur dans un registre (ex. rdx)."
    ],
    atoi: { cmd: "nasm -felf64 prog.asm -o prog.o && ld prog.o -o prog && ./prog ; echo $?", expected: "2" },
    checklist: ["Charges-tu chaque octet avec movzx rax, byte [nom + rbx] ?", "Testes-tu la fin de chaine (cmp rax,0 puis je fin) ?", "Comptes-tu uniquement quand l'octet vaut 97 (le code de 'a') ?", "echo $? affiche-t-il 2 ?"],
    solution: "section .data\n    nom db \"Catan\", 0    ; 5 lettres + l'octet 0 de fin\nsection .text\n    global _start        ; point d'entree visible du lieur\n_start:                  ; l'execution commence ici\n    xor rbx, rbx        ; met rbx a 0 -> index = 0\n    xor rdx, rdx        ; met rdx a 0 -> compteur de 'a'\nboucle:                 ; debut de la boucle\n    movzx rax, byte [nom + rbx]   ; charge un octet (le caractere courant)\n    cmp rax, 0          ; fin de chaine ?\n    je fin              ; si oui, sortir\n    cmp rax, 97         ; ce caractere est-il 'a' (code 97) ?\n    jne .suite          ; si non, ne pas compter\n    inc rdx             ; si oui, compteur++\n.suite:                 ; suite du tour\n    inc rbx             ; index++ : caractere suivant\n    jmp boucle          ; recommence\nfin:                    ; sortie de la boucle\n    mov rdi, rdx        ; copie le compteur (2) dans rdi = code de retour\n    mov rax, 60         ; numero du syscall exit\n    syscall             ; termine en renvoyant rdi (2)\n; echo $?  -> 2          ; echo $? affiche 2 (les deux 'a' de Catan)",
    note: "On parcourt la chaîne octet par octet (movzx byte) jusqu'au 0, en comparant chaque caractère à 97 ('a'). Un caractère n'est qu'un nombre : on le teste avec cmp comme n'importe quel entier. C'est le principe de tout traitement de texte en assembleur." }
  ]
};
