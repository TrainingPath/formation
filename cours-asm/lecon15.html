<script>
var DAY = {
  num: 15,
  title: "Adressage et pointeurs",
  subtitle: "Un registre qui contient une adresse — le pointeur du C, mis à nu.",
  theory: `
<h3>1. Un registre peut contenir une adresse</h3>
<p>Rappels de vocabulaire : la <strong>mémoire</strong> est une immense rangée de cases numérotées ; le numéro d'une case s'appelle son <strong>adresse</strong> (comme un numéro de maison dans une rue). Un <strong>registre</strong> est une petite case ultra-rapide à l'intérieur du processeur. Un registre peut contenir n'importe quel nombre — y compris une adresse. Quand on décide qu'un registre contient une adresse, on l'appelle un <strong>pointeur</strong>.</p>
<pre class="pseudo">    lea rbx, [prix]     ; rbx = ADRESSE de prix (un pointeur) ; lea = "charge l'adresse", sans lire la mémoire
    mov rax, [rbx]      ; rax = valeur À cette adresse ; les crochets = "lis ce qui est rangé là" (déréférencement)</pre>
<p>Rien ne distingue un « pointeur » d'un autre registre : c'est simplement un registre dont on a décidé qu'il contient une <strong>adresse</strong>. <code>[rbx]</code> lit alors ce qui est à cette adresse. Ce geste — « aller voir ce qu'il y a à l'adresse contenue dans un pointeur » — s'appelle le <strong>déréférencement</strong>.</p>

<h3>2. lea : calculer une adresse</h3>
<pre class="pseudo">lea rax, [prix]              ; rax = adresse de prix (juste l'adresse, on ne lit rien)
lea rax, [prix + rbx*8]      ; rax = adresse de prix[rbx] : base "prix" + index "rbx" fois taille 8
lea rax, [rbx + rcx*2 + 4]   ; calcul d'adresse arbitraire (base + index*échelle + décalage), SANS lire la mémoire</pre>
<div class="warn"><code>lea</code> (load effective address) calcule une adresse et la range dans un registre, <strong>sans accéder à la mémoire</strong>. Contraste avec <code>mov rax, [prix]</code> qui, lui, <em>lit</em> la valeur. On l'utilise aussi pour de petits calculs arithmétiques rapides.</div>

<h3>3. Avancer un pointeur</h3>
<p>Un <strong>tableau</strong> est une suite d'éléments rangés côte à côte en mémoire. Ici <code>dq</code> (« define quad-word ») déclare des nombres de 8 octets chacun. Pour passer d'un élément au suivant, on ajoute la taille d'un élément (8) à l'adresse.</p>
<pre class="pseudo">    lea rbx, [prix]     ; rbx pointe sur prix[0] (le tout premier élément)
    add rbx, 8          ; rbx pointe sur prix[1] : on avance de 8 octets = un élément dq plus loin
    mov rax, [rbx]      ; lit prix[1] (la valeur à la nouvelle adresse pointée)</pre>
<p>Faire <code>+8</code> sur un pointeur de <code>dq</code> avance d'un élément : c'est l'arithmétique de pointeurs, sans le sucre du C (qui gère la taille tout seul).</p>

<h3>4. Pointeur vers pointeur, indirection</h3>
<pre class="pseudo">    mov rbx, [ptr]      ; rbx = ce que contient ptr (ptr rangeait une autre adresse)
    mov rax, [rbx]      ; rax = valeur à cette seconde adresse (on déréférence deux fois : double indirection)</pre>

<h3>5. Les trois cibles</h3>
<pre class="pseudo">NASM   lea rax, [prix]         ; mov rbx, [rax]      ; Intel : lea prend l'adresse, [rax] déréférence
AT&amp;T   lea prix(%rip), %rax    ; mov (%rax), %rbx    ; même chose en syntaxe AT&amp;T (préfixes % , adresse relative à rip)
ARM64  adr x0, prix (ou ldr x0,=prix) ; ldr x1, [x0]  ; ARM64 : adr/ldr= charge l'adresse, puis ldr [x0] déréférence</pre>
<div class="tip">Le pointeur n'a rien de mystérieux en assembleur : c'est une adresse dans un registre, et <code>[reg]</code> la déréférence. Tout le concept de pointeur du C (et les <code>*</code>/<code>&amp;</code>) se ramène à ces deux idées : calculer une adresse (<code>lea</code>) et lire/écrire à une adresse (<code>[reg]</code>).</div>`,
  exercises: [
    { type: "qcm", q: "Un pointeur, en assembleur, est…", opts: ["un type spécial", "un registre qui contient une adresse", "une section", "une instruction"], a: 1, exp: "Rien de particulier." },
    { type: "qcm", q: "<code>[rbx]</code> quand rbx est un pointeur…", opts: ["donne l'adresse", "lit la valeur à cette adresse (déréférencement)", "additionne", "saute"], a: 1, exp: "Contenu à l'adresse." },
    { type: "qcm", q: "<code>lea</code> sert à…", opts: ["lire la mémoire", "calculer une adresse SANS lire la mémoire", "additionner et stocker", "afficher"], a: 1, exp: "Load effective address." },
    { type: "qcm", q: "Différence entre <code>lea rax,[prix]</code> et <code>mov rax,[prix]</code> :", opts: ["aucune", "lea donne l'ADRESSE, mov lit la VALEUR", "lea est plus lent", "mov donne l'adresse"], a: 1, exp: "Adresse vs contenu." },
    { type: "qcm", q: "Avancer un pointeur de dq d'un élément :", opts: ["+1", "+8 (taille de l'élément)", "-8", "×8"], a: 1, exp: "Arithmétique de pointeurs." },
    { type: "qcm", q: "La double indirection charge…", opts: ["une valeur directe", "l'adresse dans un pointeur, puis la valeur à cette adresse", "rien", "un octet"], a: 1, exp: "Pointeur vers pointeur." },
    { type: "qcm", q: "lea peut aussi servir à…", opts: ["lire un octet en mémoire", "de petits calculs arithmétiques rapides", "réserver de la mémoire", "comparer"], a: 1, exp: "base + index*échelle + dép." },
    { type: "qcm", q: "En C, le pointeur correspond à…", opts: ["une adresse dans un registre + déréférencement", "une classe", "un flottant", "une section"], a: 0, exp: "* et & = lire/prendre une adresse." },
    { type: "qcm", q: "<code>mov [rbx], rax</code> quand rbx est un pointeur…", opts: ["lit", "écrit rax à l'adresse pointée", "additionne", "compare"], a: 1, exp: "Écriture via pointeur." },
    { type: "qcm", q: "L'ARM64 obtient une adresse avec…", opts: ["mov seul", "adr / ldr =label", "lea", "cmp"], a: 1, exp: "Puis ldr pour déréférencer." },
    { type: "vf", q: "Tout le concept de pointeur du C se ramène à « calculer une adresse » et « lire/écrire à une adresse ».", a: true, exp: "lea et [reg]." },
    { type: "qcm", q: "add rbx, 8 sur un pointeur de dq fait…", opts: ["+8 valeurs", "avancer d'un élément", "reculer", "rien"], a: 1, exp: "8 octets = 1 dq." },
    { type: "qcm", q: "lea n'accède pas à…", opts: ["un registre", "la mémoire (il calcule juste l'adresse)", "l'index", "l'échelle"], a: 1, exp: "Pas de lecture." },
    { type: "qcm", q: "Le & du C (adresse de) correspond à…", opts: ["mov [reg]", "lea (charger l'adresse)", "add", "cmp"], a: 1, exp: "Prendre une adresse." },
    { type: "qcm", q: "Le * du C (déréférencer) correspond à…", opts: ["lea", "[reg] (lire à l'adresse)", "neg", "shl"], a: 1, exp: "Accès mémoire." }
  ],
  final: {
    title: "Exercice final — Lire via un pointeur",
    intro: `<p>On veut lire la valeur d'un prix via un pointeur. Analyse :</p>
<pre class="pseudo">    mov rbx, [prix]     ; charge la VALEUR rangée à prix (crochets = contenu, pas adresse)
    mov rax, rbx        ; recopie cette valeur dans rax
    mov rdi, rax        ; place la valeur dans rdi (par ex. pour la renvoyer)</pre>`,
    questions: [
      { type: "qcm", q: "<code>mov rbx, [prix]</code> charge…", opts: ["l'adresse de prix", "la VALEUR de prix (44)", "0", "un octet"], a: 1, exp: "Crochets = contenu." },
      { type: "qcm", q: "Si on voulait un POINTEUR vers prix, on écrirait…", opts: ["mov rbx, [prix]", "lea rbx, [prix]", "add rbx, prix", "mov [rbx], prix"], a: 1, exp: "lea donne l'adresse." },
      { type: "qcm", q: "Puis pour lire la valeur via ce pointeur :", opts: ["mov rax, rbx", "mov rax, [rbx]", "lea rax, rbx", "add rax, rbx"], a: 1, exp: "Déréférencer." },
      { type: "qcm", q: "<code>[rbx]</code> équivaut au … du C", opts: ["&", "* (déréférencement)", "+", "=="], a: 1, exp: "Lire à l'adresse." },
      { type: "qcm", q: "Que manque-t-il au programme ?", opts: ["rien", "l'exit (rax=60)", "un add", "un ret"], a: 1, exp: "Terminer." }
    ],
    solution: `<pre class="pseudo">section .data          ; section des données initialisées (valeurs connues d'avance)
    prix dq 44          ; déclare "prix" : un nombre de 8 octets (dq) valant 44
section .text          ; section du code exécutable
    global _start       ; point d'entrée visible pour le lieur
_start:                 ; début de l'exécution
    lea rbx, [prix]     ; rbx = ADRESSE de prix (pointeur)  ← comme &prix en C
    mov rax, [rbx]      ; rax = valeur pointée = 44          ← comme *rbx en C
    mov rdi, rax        ; place 44 dans rdi = code de sortie
    mov rax, 60         ; syscall exit (numéro 60)
    syscall             ; termine le programme, code de sortie = rdi
# echo $?  -> 44        # après ./prog, $? affiche le code de sortie (44)
# ARM64 : ldr x1, =prix ; ldr x0, [x1]   # équivalent ARM : charger l'adresse puis déréférencer</pre>
<p><code>lea</code> = « prendre l'adresse » (le <code>&amp;</code> du C), <code>[rbx]</code> = « lire à l'adresse » (le <code>*</code>). Le pointeur démystifié. Demain : appeler la libc (printf).</p>`
  }
};
</script>
