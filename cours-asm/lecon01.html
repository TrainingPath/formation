  title: "L'assembleur et les trois cibles",
  subtitle: "Le langage le plus proche de la machine — et pourquoi on va en voir trois variantes.",
  theory: `
<h3>1. Qu'est-ce que l'assembleur ?</h3>
<p>Le <strong>processeur</strong> (aussi appelé CPU, le « cerveau » de l'ordinateur qui exécute les calculs) ne comprend qu'une seule chose : le <strong>code machine</strong>. Le code machine, ce sont des suites de <strong>bits</strong> — un bit est la plus petite information possible, il vaut soit 0 soit 1 (comme un interrupteur éteint/allumé). Regroupés par paquets de 8, les bits forment un <strong>octet</strong> (par exemple <code>01000001</code>). Tout, dans un ordinateur, finit sous cette forme de 0 et de 1.</p>
<p>Le problème : lire et écrire directement des suites de 0 et de 1 est illisible pour un humain. L'<strong>assembleur</strong> est une représentation <em>lisible</em> de ce code machine : chaque instruction assembleur (un petit mot comme <code>mov</code> ou <code>add</code>) correspond (presque) à une instruction du processeur. Un programme, l'<em>assembleur</em> (l'outil, ex. NASM), traduit ton code en binaire exécutable.</p>
<p>Attention au double sens du mot : « l'assembleur » désigne à la fois <strong>le langage</strong> (ce que tu écris) et <strong>l'outil</strong> (le logiciel qui traduit ton texte en code machine). On dira parfois « assembler » (le verbe) pour l'action de traduire.</p>
<p>C'est le langage le plus <strong>bas niveau</strong> : « bas niveau » veut dire « très proche du matériel », au contraire d'un langage « haut niveau » comme Python qui cache les détails de la machine. Ici, pas de variables typées, pas de <code>if</code> tout faits, pas de fonctions gratuites. On manipule directement des <strong>registres</strong> (de minuscules cases de stockage ultra-rapides <em>à l'intérieur</em> du processeur), la <strong>mémoire</strong> (la RAM, une grande étagère de cases numérotées où l'on range données et programme) et des <strong>instructions</strong> élémentaires (des ordres minuscules : copier une valeur, additionner, comparer…). En échange : un contrôle total et la compréhension exacte de ce que fait la machine.</p>

<h3>2. Pourquoi apprendre l'assembleur aujourd'hui ?</h3>
<p>On n'écrit plus d'applications entières en assembleur (trop long, trop spécifique à chaque processeur). Mais le connaître permet de : <strong>comprendre</strong> ce que le C, le C++, etc. deviennent une fois <strong>compilés</strong> (compiler = traduire un langage de haut niveau en code machine) ; <strong>déboguer</strong> au plus bas niveau (déboguer = chercher et corriger les erreurs) ; <strong>optimiser</strong> des points critiques (rendre plus rapide un morceau essentiel) ; et travailler sur des <strong>systèmes embarqués</strong> (les mini-ordinateurs cachés dans les objets : voiture, four, montre), des <strong>noyaux</strong> (le noyau = le cœur du système d'exploitation, ex. Linux, qui commande directement le matériel) et des <strong>pilotes</strong> (les programmes qui font dialoguer l'OS avec un périphérique : carte graphique, imprimante…).</p>

<h3>3. Deux architectures, deux syntaxes</h3>
<p>Une <strong>architecture</strong> définit les instructions et registres d'une famille de processeurs — c'est en quelque sorte le « vocabulaire » que comprend cette famille de puces. Ce cours en couvre deux :</p>
<pre class="pseudo">x86-64  : les PC et serveurs (Intel/AMD). Registres rax, rbx…
ARM64   : mobiles, Raspberry Pi, Mac Apple Silicon. Registres x0..x30</pre>
<p>Et pour le x86-64, il existe <strong>deux syntaxes</strong> — une syntaxe, c'est la <em>façon d'écrire</em> le code, pas la machine elle-même. Deux syntaxes différentes peuvent décrire exactement la même instruction pour le même processeur :</p>
<pre class="pseudo">NASM / Intel : mov rax, 3     (destination à GAUCHE)
GAS / AT&amp;T   : movq $3, %rax  (destination à DROITE, préfixes % et $)</pre>
<p>Ci-dessus, les deux lignes font <em>exactement la même chose</em> (mettre la valeur 3 dans le registre rax) sur le même processeur : seule l'écriture change. En AT&amp;T, un <code>%</code> précède les registres et un <code>$</code> précède les valeurs immédiates (les nombres écrits en dur), et l'ordre des opérandes est inversé. Une <strong>opérande</strong> est simplement un « ingrédient » de l'instruction : dans <code>mov rax, 3</code>, les opérandes sont <code>rax</code> (la destination) et <code>3</code> (la source).</p>

<h3>4. Notre plan : NASM comme fil principal</h3>
<div class="warn">On enseigne chaque notion en <strong>x86-64 NASM</strong> (la plus lisible pour débuter), et on montre systématiquement l'équivalent en <strong>AT&amp;T</strong> (même machine, autre écriture) et en <strong>ARM64</strong> (autre machine). Ainsi tu distingues ce qui est <em>universel</em> (le concept : additionner, comparer, sauter) de ce qui est <em>propre à une cible</em> (les noms d'instructions, l'ordre des opérandes).</p></div>

<h3>5. Outillage</h3>
<p>Pour transformer ton fichier texte <code>.asm</code> en programme qui s'exécute, il faut deux étapes : <strong>assembler</strong> (traduire le texte en un « fichier objet » <code>.o</code>, du code machine pas encore fini) puis <strong>lier</strong> avec l'<strong>éditeur de liens</strong> ou <em>lieur</em> (l'outil <code>ld</code> qui assemble les morceaux et fixe les adresses définitives pour produire l'exécutable final). Les lignes ci-dessous sont des commandes tapées dans le <strong>terminal</strong> (la fenêtre où l'on tape des commandes) — en shell, un commentaire commence par <code>#</code> :</p>
<pre class="pseudo">nasm -f elf64 prog.asm -o prog.o    # assemble le code NASM en fichier objet (.o) au format ELF 64 bits (le format des exécutables Linux)
ld prog.o -o prog                   # l'éditeur de liens (ld) transforme le fichier objet en programme exécutable nommé « prog »
./prog ; echo $?                    # lance le programme (./prog), puis affiche son code de sortie (echo $? = le nombre 0 à 255 renvoyé)</pre>
<div class="tip">L'assembleur récompense la patience : chaque instruction fait une chose minuscule, et il n'y a aucun filet. Mais c'est le seul endroit où l'on voit vraiment l'ordinateur. Va lentement, assemble souvent, et compare toujours les trois cibles.</div>`,
  exercises: [

    { type: "qcm", q: "En syntaxe NASM/Intel, la destination est…", opts: ["à droite", "à gauche (mov rax, 3)", "au milieu", "absente"], a: 1, exp: "mov dest, src." },
    { type: "qcm", q: "En syntaxe AT&T, la destination est…", opts: ["à gauche", "à droite (movq $3, %rax)", "au milieu", "absente"], a: 1, exp: "Ordre inversé, préfixes % $." },
    { type: "qcm", q: "Les registres x86-64 s'appellent…", opts: ["x0, x1…", "rax, rbx, rcx…", "eax seul", "R1"], a: 1, exp: "rax… (et x0..x30 en ARM64)." },
    { type: "qcm", q: "Pourquoi apprendre l'assembleur aujourd'hui ?", opts: ["écrire des sites web", "comprendre le code compilé, déboguer, embarqué", "remplacer Python", "concevoir des interfaces graphiques"], a: 1, exp: "Comprendre la machine." },
    { type: "qcm", q: "Le fil principal du cours est…", opts: ["ARM64", "x86-64 NASM", "AT&T", "le langage C"], a: 1, exp: "NASM, le plus lisible pour débuter." },
    { type: "vf", q: "Le concept d'additionner est universel ; le nom de l'instruction dépend de la cible.", a: true, exp: "On distingue concept et syntaxe." },
    { type: "qcm", q: "Quel outil assemble du NASM x86-64 ?", opts: ["gcc seul", "nasm", "python", "make"], a: 1, exp: "nasm -f elf64." },
    { type: "qcm", q: "ARM64 équipe notamment…", opts: ["les vieux PC uniquement", "mobiles, Raspberry Pi, Mac Apple Silicon", "les serveurs Intel", "rien"], a: 1, exp: "Architecture répandue." },
    { type: "qcm", q: "Écrit-on des applications entières en assembleur aujourd'hui ?", opts: ["oui, couramment", "rarement (trop long, spécifique) ; on l'utilise ponctuellement", "jamais possible", "toujours"], a: 1, exp: "Cas ciblés." },
    { type: "qcm", q: "echo $? après ./prog affiche…", opts: ["le texte", "le code de sortie du programme", "les registres", "rien"], a: 1, exp: "Utile pour vérifier un résultat renvoyé." }
  ],
  final: {
    title: "Exercice final — Situer l'assembleur",
    intro: `<p>On classe des affirmations. Réponds :</p>`,
    questions: [
      { type: "qcm", q: "« mov rax, 3 » et « movq $3, %rax » :", opts: ["deux architectures différentes", "le même effet, deux syntaxes du x86-64", "du C", "du ARM64"], a: 1, exp: "Intel vs AT&T." },
      { type: "qcm", q: "« add x0, x1, x2 » est de la famille…", opts: ["x86-64 NASM", "x86-64 AT&T", "ARM64 (trois opérandes)", "C"], a: 2, exp: "Registres x0.. et 3 opérandes." },
      { type: "qcm", q: "Le C, une fois compilé, devient…", opts: ["du bytecode Java", "du code machine (qu'on peut lire en assembleur)", "un script shell", "un fichier source non traduit"], a: 1, exp: "gcc -S le montre (leçon 18)." },
      { type: "qcm", q: "L'atout majeur de l'assembleur :", opts: ["la rapidité d'écriture", "le contrôle total et la compréhension exacte de la machine", "les frameworks", "la portabilité"], a: 1, exp: "Au plus près du matériel." },
      { type: "qcm", q: "Sa principale contrainte :", opts: ["aucune", "verbeux et spécifique à chaque processeur (peu portable)", "trop de types", "trop d'abstractions"], a: 1, exp: "Chaque instruction fait très peu." }
    ],
    solution: `<pre class="pseudo">Universel (le CONCEPT)          | Propre à la cible (la SYNTAXE/l'archi)
--------------------------------|--------------------------------------
additionner, comparer, sauter   | add / addq / add  (noms, opérandes)
un registre = stockage rapide   | rax (x86) vs x0 (ARM)
un appel système au noyau       | rax=1 (x86) vs x8=64 (ARM) pour write
ordre des opérandes             | dest à gauche (Intel) / droite (AT&T)</pre>
<p>L'idée est la même partout ; l'écriture change. Garde ce fil : concept d'abord, syntaxe ensuite. Demain : les registres et ton premier programme.</p>`
  }
};
