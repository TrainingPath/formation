<script>
var DAY = {
  num: 6,
  title: "Multiplication, division et les flags",
  subtitle: "Multiplier, diviser (le piège de rdx:rax), et les drapeaux positionnés par les opérations.",
  theory: `
<h3>1. La multiplication (imul)</h3>
<p>Rappel express pour un débutant total : un <strong>registre</strong> est une minuscule case de stockage située <em>dans</em> le processeur (la puce qui calcule) — c'est la mémoire la plus rapide qui soit. <code>rax</code>, <code>rbx</code>… sont des noms de registres de 64 bits. Une <strong>instruction</strong> est un ordre donné au processeur (comme <code>mov</code> qui déplace une valeur, ou <code>imul</code> qui multiplie), et ses <strong>opérandes</strong> sont les valeurs ou les registres sur lesquels elle agit.</p>
<pre class="pseudo">mov rax, 5         ; place la valeur 5 dans le registre rax
mov rbx, 4         ; place la valeur 4 dans le registre rbx
imul rax, rbx      ; rax = rax * rbx = 20 (multiplication signee ; le produit revient dans rax)</pre>
<p><code>imul</code> = multiplication <strong>signée</strong> (<code>mul</code> = non signée). La forme à deux opérandes (<code>imul dest, src</code>) est la plus simple : elle range le produit dans la destination.</p>
<p>« <strong>Signé</strong> » signifie que le nombre peut être négatif (un bit sert à indiquer le signe) ; « <strong>non signé</strong> » signifie toujours positif ou nul. <code>imul</code> respecte les nombres négatifs, <code>mul</code> les traite comme s'ils étaient positifs. La <strong>destination</strong> est simplement l'endroit (ici <code>rax</code>) où le résultat est écrit.</p>

<h3>2. La division (idiv) et son piège</h3>
<p>Diviser, c'est répondre à « combien de fois ? ». Le <strong>dividende</strong> est le nombre qu'on partage, le <strong>diviseur</strong> ce par quoi on partage, le <strong>quotient</strong> le résultat entier, et le <strong>reste</strong> ce qui dépasse (le modulo, noté <code>%</code>).</p>
<pre class="pseudo">mov rax, 20         ; place 20 dans rax = dividende (la partie basse du nombre a diviser)
xor rdx, rdx        ; met rdx a 0 = partie HAUTE du dividende (obligatoire avant idiv !)
mov rbx, 6          ; place 6 dans rbx = le diviseur (ce par quoi on divise)
idiv rbx            ; divise rdx:rax par rbx -> rax = 20 / 6 = 3 (quotient)
                    ; ...et rdx = 20 % 6 = 2 (le reste de la division)</pre>
<div class="warn"><code>idiv</code> divise le couple 128 bits <strong>rdx:rax</strong> par l'opérande. Il faut donc <strong>préparer rdx</strong> avant : <code>xor rdx, rdx</code> pour un positif, ou <code>cqo</code> pour étendre le signe. Le quotient va dans <code>rax</code>, le <strong>reste</strong> dans <code>rdx</code>. Oublier de préparer rdx est un bug (voire une exception).</div>
<p>Sur x86-64, la division travaille sur un très grand nombre formé de deux registres collés bout à bout : <code>rdx</code> (les 64 bits du haut) et <code>rax</code> (les 64 bits du bas), qu'on note <code>rdx:rax</code>. Si tu ne remets pas <code>rdx</code> à zéro, il garde de vieilles données qui faussent tout le calcul. L'astuce <code>xor rdx, rdx</code> est la façon habituelle d'écrire « rdx = 0 » (un nombre passé au XOR avec lui-même donne toujours 0), et <code>cqo</code> recopie le signe de rax dans rdx pour les nombres négatifs.</p>

<h3>3. Les drapeaux (flags)</h3>
<p>Un <strong>bit</strong> est la plus petite information possible : 0 ou 1. Un <strong>drapeau</strong> (<em>flag</em>) est un bit spécial rangé dans un registre à part appelé <code>RFLAGS</code> ; il se lève (1) ou s'abaisse (0) tout seul après une opération pour en décrire le résultat.</p>
<p>Beaucoup d'instructions positionnent des <strong>drapeaux</strong> dans ce registre spécial (RFLAGS), qui décrivent le résultat :</p>
<pre class="pseudo">ZF (zero)      = 1 si le résultat est nul
SF (sign)      = 1 si le résultat est négatif
CF (carry)     = retenue (débordement non signé)
OF (overflow)  = débordement signé</pre>
<p>Ces drapeaux sont lus par les <strong>sauts conditionnels</strong> (leçon 7). Un <strong>saut conditionnel</strong> (ou <strong>branchement</strong>) est une instruction qui reprend le programme à un autre endroit seulement si une condition est vraie : c'est ainsi que la machine « prend des décisions » et réalise des « si… alors ».</p>

<h3>4. Multiplier par une puissance de 2 : les décalages</h3>
<p>Dans la mémoire, un nombre est une suite de bits. Les <strong>décaler</strong>, c'est glisser tous ces bits d'un ou plusieurs crans vers la gauche ou la droite ; chaque cran vers la gauche multiplie par 2, chaque cran vers la droite divise par 2.</p>
<pre class="pseudo">shl rax, 1         ; decale les bits de rax d'un cran vers la gauche = multiplier par 2
shl rax, 3         ; decale de 3 crans a gauche = multiplier par 8 (2^3)
shr rax, 1         ; decale d'un cran vers la droite = diviser par 2 (non signe)</pre>
<p>Décaler les bits est bien plus rapide que <code>imul</code>/<code>idiv</code> : les compilateurs l'utilisent pour multiplier/diviser par une puissance de 2. Un <strong>compilateur</strong> est le programme qui traduit un langage de haut niveau (comme le C) en instructions machine.</p>

<h3>5. Les trois cibles</h3>
<p>Le même calcul s'écrit un peu différemment selon l'<strong>assembleur</strong> (le langage/outil de bas niveau) et l'<strong>architecture</strong> (la famille de processeur). <strong>NASM</strong> et <strong>AT&amp;T</strong> sont deux syntaxes pour les processeurs x86 (les PC) ; <strong>ARM64</strong> est l'architecture des téléphones et des Mac récents.</p>
<pre class="pseudo">NASM   imul rax, rbx  ; xor rdx,rdx ; idiv rbx     ; syntaxe Intel : la destination vient en premier
AT&amp;T   imul %rbx,%rax ; xorq %rdx,%rdx ; idiv %rbx ; syntaxe AT&amp;T : la source d'abord, registres prefixes par %
ARM64  mul x0, x1, x2 ; sdiv x0, x1, x2            ; ARM64 : division en UNE instruction, sans rdx</pre>
<div class="tip">La division ARM64 est bien plus simple : <code>sdiv x0, x1, x2</code> (signée) ou <code>udiv</code> (non signée), sans registre de reste à préparer — le reste s'obtient par <code>msub</code>. Le x86 traîne l'héritage du couple <code>rdx:rax</code>, plus délicat.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle instruction multiplie (signé) ?", opts: ["add", "imul", "shl", "cmp"], a: 1, exp: "imul (mul = non signé)." },
    { type: "qcm", q: "idiv divise…", opts: ["deux registres simples", "le couple rdx:rax par l'opérande", "rax par 2", "rax par rbx, sans calculer de reste"], a: 1, exp: "128 bits / opérande." },
    { type: "qcm", q: "Avant idiv d'un positif, il faut…", opts: ["rien", "mettre rdx à 0 (xor rdx, rdx)", "add rdx", "shl"], a: 1, exp: "Préparer la partie haute." },
    { type: "qcm", q: "Après idiv, le quotient est dans…", opts: ["rdx", "rax", "rbx", "rsi"], a: 1, exp: "rax = quotient." },
    { type: "qcm", q: "Après idiv, le reste est dans…", opts: ["rax", "rdx", "rbx", "rsp"], a: 1, exp: "rdx = reste (modulo)." },
    { type: "qcm", q: "Le drapeau ZF vaut 1 quand…", opts: ["le résultat est négatif", "le résultat est nul", "il y a une retenue", "jamais"], a: 1, exp: "Zero Flag." },
    { type: "qcm", q: "Le drapeau SF indique…", opts: ["un résultat nul", "un résultat négatif (signe)", "une multiplication", "rien"], a: 1, exp: "Sign Flag." },
    { type: "qcm", q: "Les drapeaux sont lus par…", opts: ["mov", "les sauts conditionnels", "add seul", "write"], a: 1, exp: "Pour décider (leçon 7)." },
    { type: "qcm", q: "<code>shl rax, 1</code> fait…", opts: ["÷2", "×2 (décalage à gauche)", "+1", "-1"], a: 1, exp: "Décalage de bits." },
    { type: "qcm", q: "<code>shr rax, 3</code> fait (non signé)…", opts: ["×8", "÷8 (2^3)", "×3", "-3"], a: 1, exp: "Décalage à droite." },
    { type: "vf", q: "Décaler les bits est plus rapide qu'imul/idiv pour les puissances de 2.", a: true, exp: "Les compilateurs l'exploitent." },
    { type: "qcm", q: "La division ARM64 (sdiv) nécessite-t-elle rdx ?", opts: ["oui", "non : une seule instruction, pas de rdx", "parfois", "toujours"], a: 1, exp: "Plus simple que x86." },
    { type: "qcm", q: "imul rax, rbx range le produit dans…", opts: ["rbx", "rax (la destination)", "rdx", "la mémoire"], a: 1, exp: "Forme à deux opérandes." },
    { type: "qcm", q: "Oublier de préparer rdx avant idiv…", opts: ["est sans effet", "donne un résultat faux ou une exception", "accélère", "trie"], a: 1, exp: "Bug classique." },
    { type: "qcm", q: "Le reste (modulo) en x86 s'obtient…", opts: ["avec imul", "dans rdx après idiv", "avec shl", "impossible"], a: 1, exp: "rdx contient le reste." }
  ],
  final: {
    title: "Exercice final — Prix moyen",
    intro: `<p>On veut la moyenne de deux prix (44 + 12) / 2. Analyse :</p>
<pre class="pseudo">mov rax, 44        ; place 44 dans rax (premier prix)
add rax, 12        ; ajoute 12 -> rax vaut maintenant 56
mov rbx, 2         ; place le diviseur 2 dans rbx
idiv rbx           ; divise rdx:rax par 2 ... mais rdx n'a pas ete prepare : BUG !</pre>`,
    questions: [
      { type: "qcm", q: "Le bug principal :", opts: ["aucun", "rdx n'est pas préparé avant idiv", "add est faux", "rbx=2 est faux"], a: 1, exp: "xor rdx, rdx manque." },
      { type: "qcm", q: "Que faut-il ajouter avant idiv ?", opts: ["rien", "xor rdx, rdx (mettre la partie haute à 0)", "un shl", "un cmp"], a: 1, exp: "Préparer le dividende." },
      { type: "qcm", q: "Le quotient (28) ira dans…", opts: ["rdx", "rax", "rbx", "rsi"], a: 1, exp: "rax = quotient." },
      { type: "qcm", q: "Le reste ira dans…", opts: ["rax", "rdx", "rbx", "rsp"], a: 1, exp: "rdx = reste (ici 0)." },
      { type: "qcm", q: "Une division par 2 pourrait aussi se faire avec…", opts: ["imul", "shr rax, 1 (décalage à droite)", "add", "neg"], a: 1, exp: "Plus rapide pour /2." }
    ],
    solution: `<pre class="pseudo">section .text          ; debut de la section du code executable
    global _start      ; rend l'etiquette _start visible pour l'editeur de liens (point d'entree)
_start:                ; etiquette : le programme commence ici
    mov rax, 44        ; place 44 dans rax (premier prix)
    add rax, 12        ; ajoute 12 -> rax = 56
    xor rdx, rdx       ; met rdx a 0 = partie HAUTE du dividende (obligatoire !)
    mov rbx, 2         ; place le diviseur 2 dans rbx
    idiv rbx           ; divise rdx:rax par 2 -> rax = 28 (quotient), rdx = 0 (reste)
    mov rdi, rax       ; copie le resultat 28 dans rdi = futur code de sortie
    mov rax, 60        ; numero de l'appel systeme "exit" (terminer le programme)
    syscall            ; demande au noyau d'executer l'appel systeme
; echo $?  -> 28       # dans le terminal, echo $? affiche le code de sortie : 28
; (ou plus rapide pour /2 : shr rax, 1)   # un decalage a droite divise par 2</pre>
<p>Toujours préparer <code>rdx</code> avant <code>idiv</code> : c'est le piège n°1 de la division x86. Demain : les comparaisons et les sauts conditionnels.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l06", title: "Tarif avec multiplication", level: 2,
    statement: "Écris un programme NASM qui calcule 5 (prix/jour) × 6 (jours) avec imul, renvoie le total (30). Ajoute en commentaire comment ferait l'ARM64 (mul) et pourquoi sa division est plus simple.",
    hints: [
      "mov rax, 5 ; mov rbx, 6 ; imul rax, rbx.",
      "mov rdi, rax ; exit.",
      "ARM64 : mul x0, x1, x2 ; sdiv x0, x1, x2 (pas de rdx)."
    ],
    atoi: { cmd: "nasm -felf64 prog.asm -o prog.o && ld prog.o -o prog && ./prog ; echo $?", expected: "30" },
    checklist: ["Charges-tu 5 et 6 dans deux registres avant imul ?", "imul range-t-il bien le produit dans la destination (rax) ?", "Renvoies-tu le total par rdi avant exit ?", "echo $? affiche-t-il 30 ?"],
    solution: "section .text\n    global _start       ; point d'entree visible pour l'editeur de liens\n_start:\n    mov rax, 5          ; place 5 (prix par jour) dans rax\n    mov rbx, 6          ; place 6 (nombre de jours) dans rbx\n    imul rax, rbx       ; rax = rax * rbx = 30 (multiplication signee)\n    mov rdi, rax        ; copie 30 dans rdi = code de sortie\n    mov rax, 60         ; numero de l'appel systeme exit\n    syscall             ; le noyau termine le programme\n; echo $?  -> 30\n;\n; ARM64 :\n;   mul  x0, x1, x2   ; multiplication en une instruction\n;   sdiv x0, x1, x2   ; division signee SANS preparer de registre de reste\n; (le x86 traine l'heritage du couple rdx:rax pour idiv, plus delicat)",
    note: "imul à deux opérandes range le produit dans la destination. La comparaison avec l'ARM64 est instructive : sa division (sdiv) tient en une instruction, là où le x86 impose de préparer rdx (xor rdx, rdx) avant idiv." }
  ]
};
