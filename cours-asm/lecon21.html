<script>
var DAY = {
  num: 21,
  title: "Examen final assembleur",
  subtitle: "Tout le cours en une épreuve : registres, mémoire, sauts, pile, appels, syscalls, trois cibles.",
  theory: `
<h3>Récapitulatif du parcours</h3>
<p>Avant l'épreuve, quelques rappels de vocabulaire. Le <strong>processeur</strong> exécute des <strong>instructions</strong> élémentaires. Un <strong>registre</strong> est une case ultra-rapide du processeur ; la <strong>mémoire</strong> est la grande réserve de rangement. La <strong>pile</strong> est une zone mémoire en mode <strong>LIFO</strong> (Last In, First Out : le dernier rangé est le premier repris). Un <strong>syscall</strong> (appel système) est une demande de service au <strong>noyau</strong> (le cœur du système d'exploitation, qui gère l'écran, les fichiers, la mémoire…). Le tableau ci-dessous liste les 21 leçons.</p>
<pre class="pseudo">Semaine 1 — Les bases de la machine
  1 les 3 cibles     2 registres, exit    3 write
  4 mov/add/sub      5 mémoire, sections  6 imul/idiv, flags
  7 cmp + sauts

Semaine 2 — Pile, fonctions, données
  8 boucles          9 pile (push/pop)    10 call/ret, convention
  11 arguments, cadre  12 tableaux (indexé)  13 chaînes (octets)
  14 read

Semaine 3 — Interfaces, comparaison, vrais programmes
  15 pointeurs       16 libc (printf)     17 les 3 syntaxes
  18 gcc -S          19 optimisation      20 utilitaire complet</pre>
<div class="tip">Le modèle mental : le processeur ne sait faire que des choses minuscules — copier (<code>mov</code>), calculer (<code>add</code>, <code>imul</code>), comparer (<code>cmp</code>), sauter (<code>jl</code>, <code>jmp</code>), empiler/dépiler (<code>push</code>/<code>pop</code>), appeler/revenir (<code>call</code>/<code>ret</code>), et demander un service au noyau (<code>syscall</code>). Tout le reste — les langages, les programmes, les systèmes d'exploitation — est bâti là-dessus.</div>
<div class="warn">Les trois cibles (x86-64, ARM64, et la syntaxe AT&amp;T) partagent ce modèle ; seuls changent les noms des registres (<code>rax</code> côté x86 / <code>x0</code> côté ARM), l'ordre des opérandes (Intel met la destination à gauche, AT&amp;T à droite) et les numéros de syscalls. Tu peux désormais lire l'assembleur qu'un compilateur produit — la compétence la plus utile de ce parcours.</div>`,
  exercises: [
    { type: "qcm", q: "Le numéro d'un syscall (x86-64) va dans…", opts: ["rdi", "rax", "rsi", "rsp"], a: 1, exp: "rax." },
    { type: "qcm", q: "Le 1er argument d'une fonction (System V) va dans…", opts: ["rax", "rdi", "rsp", "rbx"], a: 1, exp: "Convention." },
    { type: "qcm", q: "La valeur de retour d'une fonction est dans…", opts: ["rdi", "rax", "rsp", "rsi"], a: 1, exp: "rax." },
    { type: "qcm", q: "<code>cmp rax, 5</code> puis <code>jl</code> saute si…", opts: ["rax == 5", "rax < 5", "rax > 5", "toujours"], a: 1, exp: "Jump if less." },
    { type: "qcm", q: "<code>[prix + rbx*8]</code> est…", opts: ["l'adresse de prix", "l'accès à l'élément d'un tableau (adressage indexé)", "0", "un octet"], a: 1, exp: "base + index*échelle." },
    { type: "qcm", q: "La pile fonctionne en…", opts: ["FIFO", "LIFO", "aléatoire", "trié"], a: 1, exp: "push/pop." },
    { type: "qcm", q: "write a besoin de… (x86-64)", opts: ["rax=0", "rax=1, rdi=fd, rsi=adresse, rdx=longueur", "seulement rdi", "rien"], a: 1, exp: "Syscall 1." },
    { type: "qcm", q: "Une chaîne est terminée par…", opts: ["un espace", "l'octet 0", "un saut de ligne", "rien"], a: 1, exp: "Comme en C." },
    { type: "qcm", q: "En AT&T, la destination est…", opts: ["à gauche", "à droite (movq $5, %rax)", "au milieu", "absente"], a: 1, exp: "Ordre inversé." },
    { type: "qcm", q: "ARM64 est une architecture…", opts: ["à deux opérandes", "load/store, trois opérandes", "sans registres", "identique au x86"], a: 1, exp: "ldr/str, add x0,x1,x2." },
    { type: "vf", q: "Savoir lire l'assembleur généré par un compilateur est très utile.", a: true, exp: "Comprendre, déboguer." },
    { type: "qcm", q: "Avant idiv, il faut préparer…", opts: ["rax seul", "rdx (partie haute du dividende)", "rsi", "rbp"], a: 1, exp: "xor rdx, rdx." },
    { type: "qcm", q: "call empile…", opts: ["l'argument", "l'adresse de retour", "le résultat", "rien"], a: 1, exp: "Pour ret." },
    { type: "qcm", q: "gcc -S produit…", opts: ["un binaire", "l'assembleur d'un programme C", "du Python", "un fichier objet"], a: 1, exp: "Traduction." },
    { type: "qcm", q: "Peut-on souvent battre l'optimiseur à la main ?", opts: ["oui", "rarement", "toujours", "jamais lire"], a: 1, exp: "-O2 est très bon." }
  ],
  final: {
    title: "Épreuve finale — Lire et comprendre",
    intro: `<p>Analyse ce programme NASM x86-64 :</p>
<pre class="pseudo">section .data                 ; section des donnees initialisees
    tab dq 10, 20, 30         ; tableau de 3 quad words (8 octets chacun)
section .text                 ; section du code
    global _start             ; point d'entree du programme (sans libc)
_start:
    xor rax, rax              ; rax = 0 : servira d'accumulateur (le total)
    xor rbx, rbx              ; rbx = 0 : index dans le tableau
    mov rcx, 3                ; rcx = 3 : compteur (3 elements)
.b:
    add rax, [tab + rbx*8]    ; total += tab[index] (adressage indexe, *8 car dq)
    inc rbx                   ; index++
    dec rcx                   ; compteur--
    jnz .b                    ; si compteur != 0, reboucler vers .b
    mov rdi, rax              ; code de sortie = total (1er argument du syscall exit)
    mov rax, 60               ; numero du syscall exit
    syscall                   ; appeler le noyau : terminer le programme</pre>`,
    questions: [
      { type: "qcm", q: "Que fait la boucle .b ?", opts: ["affiche le tableau", "additionne les 3 éléments (adressage indexé)", "trie", "lit le clavier"], a: 1, exp: "Somme." },
      { type: "qcm", q: "L'échelle *8 est utilisée car…", opts: ["au hasard", "les éléments sont des dq (8 octets)", "il faut *4", "sans raison"], a: 1, exp: "Taille d'un élément." },
      { type: "qcm", q: "rcx sert de…", opts: ["accumulateur", "compteur de boucle (dec/jnz)", "index", "adresse"], a: 1, exp: "3 tours." },
      { type: "qcm", q: "Le code de sortie renvoyé est…", opts: ["0", "60 (10+20+30)", "3", "10"], a: 1, exp: "La somme dans rdi." },
      { type: "qcm", q: "Le programme se termine via…", opts: ["ret", "le syscall exit (rax=60)", "jmp", "rien"], a: 1, exp: "Terminaison explicite." }
    ],
    solution: `<pre class="pseudo">; Ce programme SOMME un tableau de 3 quad words {10, 20, 30} :
;   rax = total (0), rbx = index (0), rcx = compteur (3)            ; les 3 registres de travail
;   .b : total += tab[index] (adressage indexe *8), index++, compteur--, reboucler   ; le coeur de la boucle
;   puis renvoie le total (60) via le syscall exit (rax=60, rdi=total).              ; terminaison
; echo $?  ->  60          # afficher le code de sortie dans le terminal donne 60
;
; On y reconnait TOUT le cours : registres, memoire (.data), boucle,
; adressage indexe, code de sortie. C'est le langage machine dans sa purete.</pre>
<p>Une boucle qui somme un tableau, en langage machine : registres, mémoire, adressage indexé, terminaison. Tu comprends maintenant ce que tous les autres langages compilent en dessous. Félicitations — tu as touché le fond de la pile logicielle, là où il n'y a plus que des 0 et des 1. Bravo d'être arrivée au bout du parcours !</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur (NASM) ici…",
  items: [
  { id: "asm-l21", title: "Synthèse — compter les éléments > seuil", level: 3,
    statement: "Écris un programme NASM qui parcourt un tableau de 5 prix (dq 44,12,39,5,20) et compte combien dépassent 20, puis renvoie ce nombre (2 : 44 et 39) comme code de sortie. Utilise adressage indexé, cmp et un saut conditionnel dans la boucle.",
    hints: [
      "Compteur du résultat dans rdx, index rbx, boucle rcx=5.",
      "Charge [prix + rbx*8], cmp à 20, jle .suite sinon inc rdx.",
      "Renvoie rdx via rdi + exit."
    ],
    solution: "section .data\n    prix dq 44, 12, 39, 5, 20   ; tableau de 5 prix, 8 octets chacun (dq)\nsection .text\n    global _start                ; point d'entree (sans libc)\n_start:\n    xor rdx, rdx        ; compteur du resultat = 0 (elements > 20)\n    xor rbx, rbx        ; index = 0\n    mov rcx, 5          ; compteur de boucle : 5 elements\nboucle:\n    mov rax, [prix + rbx*8]   ; charger l'element courant prix[index] (adressage indexe *8)\n    cmp rax, 20               ; comparer l'element avec le seuil 20\n    jle .suite                ; si <= 20, ne pas compter (sauter l'increment)\n    inc rdx                   ; sinon (> 20), incrementer le compteur du resultat\n.suite:\n    inc rbx             ; index++ (element suivant)\n    dec rcx             ; compteur de boucle--\n    jnz boucle          ; tant que rcx != 0, reboucler\n    mov rdi, rdx        ; code de sortie = nombre trouve (2 : 44 et 39)\n    mov rax, 60         ; numero du syscall exit\n    syscall             ; appeler le noyau : terminer le programme\n# echo $?  -> 2   # le code de sortie affiche dans le terminal vaut 2",
    note: "Cette synthèse réunit l'essentiel : parcours de tableau (adressage indexé *8), test conditionnel (cmp + jle) dans la boucle, accumulation d'un compteur, et code de sortie. C'est un filtrage complet, écrit en langage machine — exactement ce qu'une boucle for + if produit une fois compilée. Bravo d'avoir bouclé le parcours !" }
  ]
};
