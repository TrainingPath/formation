<script>
var DAY = {
  num: 11,
  title: "Arguments et valeur de retour",
  subtitle: "Passer plusieurs valeurs, préserver les registres avec un cadre de pile propre.",
  theory: `
<h3>1. Plusieurs arguments</h3>
<p>Rappel de vocabulaire : un <strong>registre</strong> est une petite case ultra-rapide dans le processeur ; un <strong>argument</strong> est une valeur qu'on donne à une fonction ; la <strong>convention d'appel</strong> est l'accord qui fixe <em>quel</em> registre reçoit <em>quel</em> argument. Sous Linux x86-64, les 6 premiers arguments entiers vont dans <code>rdi, rsi, rdx, rcx, r8, r9</code> (dans cet ordre), et le résultat revient dans <code>rax</code>.</p>
<pre class="pseudo">    mov rdi, 5          ; arg1 = prix : met 5 dans rdi (1er registre d'argument)
    mov rsi, 4          ; arg2 = jours : met 4 dans rsi (2e registre d'argument)
    mov rdx, 2          ; arg3 = quantité : met 2 dans rdx (3e registre d'argument)
    call calcul         ; appelle calcul ; les 6 premiers args passent par rdi, rsi, rdx, rcx, r8, r9</pre>
<p>On remplit les registres d'arguments dans l'ordre imposé par la convention. La valeur de retour revient dans <code>rax</code>.</p>

<h3>2. Le prologue et l'épilogue</h3>
<p>Le <strong>pointeur de pile</strong> <code>rsp</code> désigne toujours le sommet de la pile ; <code>rbp</code> (base pointer) sert de repère fixe pendant l'exécution d'une fonction. Un <strong>cadre de pile</strong> (<em>stack frame</em>) est la petite zone de pile que chaque fonction se réserve pour ses variables locales. Le <strong>prologue</strong> est le rituel d'ouverture d'une fonction, l'<strong>épilogue</strong> son rituel de fermeture.</p>
<pre class="pseudo">fonction:               ; début de la fonction
    push rbp            ; PROLOGUE : empile l'ancien rbp (sauvegarde le repère de l'appelant)
    mov rbp, rsp        ; rbp = rsp : rbp devient la base stable du cadre courant
    ; ... corps, variables locales à [rbp - 8], [rbp - 16]... ...   ; le corps accède aux locales par rapport à rbp
    pop rbp             ; ÉPILOGUE : dépile et restaure l'ancien rbp de l'appelant
    ret                 ; retour à l'appelant</pre>
<p>Beaucoup de fonctions ouvrent par un <strong>prologue</strong> (sauvegarde de <code>rbp</code>, mise en place d'un cadre) et ferment par un <strong>épilogue</strong>. <code>rbp</code> sert de repère stable pour accéder aux arguments et variables locales.</p>

<h3>3. Préserver les registres callee-saved</h3>
<p>Un registre <strong>callee-saved</strong> (« sauvegardé par l'appelée ») est un registre que la fonction doit rendre exactement comme elle l'a reçu. Si elle veut l'utiliser, elle l'empile au début (<code>push</code>) et le dépile à la fin (<code>pop</code>).</p>
<pre class="pseudo">fonction:               ; début de la fonction
    push rbx            ; si on va utiliser rbx (callee-saved), on l'empile pour le sauvegarder
    ; ... utiliser rbx ...   ; la fonction peut maintenant se servir de rbx librement
    pop rbx             ; on restaure la valeur d'origine de rbx avant de rendre la main
    ret                 ; retour à l'appelant, rbx intact</pre>
<div class="warn">Si ta fonction modifie un registre <strong>callee-saved</strong> (rbx, rbp, r12–r15), elle doit le remettre comme elle l'a trouvé (push au début, pop à la fin). Sinon elle « vole » un registre à l'appelant — bug très difficile à traquer.</div>

<h3>4. Réserver de la place locale</h3>
<p>La pile croît vers les adresses <em>basses</em> : pour se réserver de la place, on <em>soustrait</em> à <code>rsp</code> ; pour la rendre, on <em>ajoute</em>. Un <strong>octet</strong> vaut 8 bits ; ici on réserve 16 octets.</p>
<pre class="pseudo">    sub rsp, 16         ; réserver 16 octets de variables locales (on descend le sommet de pile)
    ; ... [rsp] et [rsp+8] disponibles ...   ; ces 16 octets sont maintenant utilisables comme mémoire locale
    add rsp, 16         ; libérer ces 16 octets avant ret (on remonte le sommet de pile)</pre>
<p>On agrandit la pile en soustrayant à <code>rsp</code>, puis on la restaure. La pile doit rester <strong>alignée sur 16 octets</strong> au moment d'un <code>call</code>.</p>

<h3>5. Les trois cibles</h3>
<pre class="pseudo">x86-64  args rdi, rsi, rdx, rcx, r8, r9 ; retour rax ; cadre rbp/rsp   ; sur x86-64 : arguments dans ces 6 registres, résultat dans rax, cadre géré par rbp/rsp
ARM64   args x0..x7 ; retour x0 ; cadre x29 (fp) / sp ; retour dans x30 (lr)   ; sur ARM64 : arguments dans x0..x7, résultat dans x0, cadre via x29 (frame pointer), adresse de retour dans x30</pre>
<div class="tip">Même structure partout : des registres d'arguments, un registre de retour, un cadre de pile (frame) délimité par un pointeur de base. Les noms diffèrent (<code>rbp</code> vs <code>x29</code>), l'idée est la même. Le prologue/épilogue est ce que <code>gcc -S</code> te montrera pour chaque fonction (leçon 18).</div>`,
  exercises: [
    { type: "qcm", q: "Le 3e argument entier (System V) va dans…", opts: ["rax", "rdx", "rbp", "rsp"], a: 1, exp: "rdi, rsi, rdx…" },
    { type: "qcm", q: "La valeur de retour revient dans…", opts: ["rdi", "rax", "rbp", "rsi"], a: 1, exp: "Toujours rax." },
    { type: "qcm", q: "Le prologue d'une fonction…", opts: ["affiche", "sauvegarde rbp et met en place le cadre", "additionne", "termine"], a: 1, exp: "push rbp ; mov rbp, rsp." },
    { type: "qcm", q: "rbp sert de…", opts: ["compteur", "repère stable pour les arguments et variables locales", "pointeur d'écran", "rien"], a: 1, exp: "Base du cadre." },
    { type: "qcm", q: "Un registre callee-saved modifié doit être…", opts: ["ignoré", "restauré avant le ret (push/pop)", "affiché", "mis à 0"], a: 1, exp: "Ne pas voler l'appelant." },
    { type: "qcm", q: "Réserver 16 octets de local se fait par…", opts: ["add rsp, 16", "sub rsp, 16", "push 16", "mov rsp, 16"], a: 1, exp: "La pile croît vers le bas." },
    { type: "qcm", q: "Avant un call, la pile doit être alignée sur…", opts: ["4 octets", "16 octets", "1 octet", "64 octets"], a: 1, exp: "Contrainte d'ABI." },
    { type: "qcm", q: "L'épilogue…", opts: ["ouvre le cadre", "restaure le cadre (pop rbp) avant ret", "additionne", "affiche"], a: 1, exp: "Symétrique du prologue." },
    { type: "qcm", q: "Modifier rbx sans le restaurer…", opts: ["est sûr", "peut casser l'appelant (bug difficile)", "accélère", "trie"], a: 1, exp: "callee-saved." },
    { type: "qcm", q: "En ARM64, le pointeur de cadre est…", opts: ["rbp", "x29 (fp)", "x0", "sp seul"], a: 1, exp: "Frame pointer." },
    { type: "vf", q: "Le prologue/épilogue est ce que gcc -S montre pour chaque fonction.", a: true, exp: "Structure standard." },
    { type: "qcm", q: "Après sub rsp, 16, il faut penser à…", opts: ["rien", "add rsp, 16 pour libérer avant ret", "un imul", "un cmp"], a: 1, exp: "Équilibrer la pile." },
    { type: "qcm", q: "Les variables locales d'une fonction vivent…", opts: ["dans .data", "sur la pile (cadre)", "dans l'écran", "nulle part"], a: 1, exp: "[rbp - n]." },
    { type: "qcm", q: "Le retour ARM64 (adresse) est dans…", opts: ["la pile", "x30 (lr)", "x0", "rax"], a: 1, exp: "Registre de lien." },
    { type: "qcm", q: "La structure fonction est-elle universelle ?", opts: ["non", "oui : args, retour, cadre — seuls les noms changent", "seulement x86", "seulement ARM"], a: 1, exp: "Concept partagé." }
  ],
  final: {
    title: "Exercice final — Une fonction propre",
    intro: `<p>Une fonction qui utilise rbx sans le préserver. Analyse :</p>
<pre class="pseudo">somme3:                 ; fonction censée calculer rax = rdi + rsi + rdx
    mov rbx, rdi        ; copie le 1er argument dans rbx (PROBLÈME : rbx est callee-saved !)
    add rbx, rsi        ; ajoute le 2e argument : rbx = rdi + rsi
    add rbx, rdx        ; ajoute le 3e argument : rbx = rdi + rsi + rdx
    mov rax, rbx        ; place la somme dans rax (valeur de retour)
    ret                 ; retour, mais rbx a été écrasé sans avoir été restauré</pre>`,
    questions: [
      { type: "qcm", q: "Le problème :", opts: ["aucun", "rbx (callee-saved) est écrasé sans être restauré", "add est faux", "ret est faux"], a: 1, exp: "On vole rbx à l'appelant." },
      { type: "qcm", q: "La correction :", opts: ["ignorer", "push rbx au début, pop rbx avant ret", "supprimer ret", "utiliser rax"], a: 1, exp: "Préserver rbx." },
      { type: "qcm", q: "Une alternative sans rbx :", opts: ["impossible", "utiliser rax directement (caller-saved) : mov rax, rdi ; add…", "un fichier", "une globale"], a: 1, exp: "rax est libre d'usage." },
      { type: "qcm", q: "rax est un registre…", opts: ["callee-saved", "caller-saved (librement utilisable)", "réservé", "d'écran"], a: 1, exp: "Pas à préserver." },
      { type: "qcm", q: "Le retour de la fonction est dans…", opts: ["rbx", "rax", "rdi", "rsp"], a: 1, exp: "Convention." }
    ],
    solution: `<pre class="pseudo">; option A : utiliser rax (caller-saved, aucun souci)   ; rax est librement utilisable : pas besoin de le sauvegarder
somme3:                 ; fonction : rax = rdi + rsi + rdx
    mov rax, rdi        ; copie le 1er argument dans rax
    add rax, rsi        ; ajoute le 2e argument : rax = rdi + rsi
    add rax, rdx        ; ajoute le 3e argument : rax = rdi + rsi + rdx
    ret                 ; retour (résultat déjà dans rax)

; option B : si on tient à rbx (callee-saved), le préserver   ; il faut alors le sauvegarder et le restaurer
somme3b:                ; même calcul, mais en passant par rbx
    push rbx            ; sauvegarde l'ancien rbx sur la pile (car rbx est callee-saved)
    mov rbx, rdi        ; copie le 1er argument dans rbx
    add rbx, rsi        ; ajoute le 2e argument
    add rbx, rdx        ; ajoute le 3e argument
    mov rax, rbx        ; place la somme dans rax (valeur de retour)
    pop rbx             ; restaure l'ancienne valeur de rbx avant de rendre la main
    ret                 ; retour, rbx intact pour l'appelant</pre>
<p>Soit on calcule dans un registre libre (<code>rax</code>), soit on sauvegarde/restaure le registre callee-saved. Respecter la convention garde les fonctions composables. Demain : les tableaux et l'adressage indexé.</p>`
  }
};
</script>

    statement: "Écris une fonction tarif(rdi=prix, rsi=jours) qui renvoie prix×jours, mais applique -10 % si jours >= 3 (retirer total/10). Renvoie 18 pour (5, 4). Pense à préparer rdx avant idiv.",
    hints: [
      "total = rdi*rsi dans rax ; cmp rsi, 3 ; jl .fin.",
      "Copier total, xor rdx,rdx, mov rbx,10, idiv rbx → rax = total/10.",
      "Soustraire total/10 du total, mettre le résultat dans rax, .fin: ret."
    ],
    solution: "section .text          ; section du code executable\n    global _start      ; rend _start visible pour l'editeur de liens\n_start:                 ; point d'entree\n    mov rdi, 5          ; prix (1er argument)\n    mov rsi, 4          ; jours (2e argument)\n    call tarif          ; appel : resultat dans rax\n    mov rdi, rax        ; code de sortie = resultat\n    mov rax, 60         ; syscall exit\n    syscall             ; termine le programme\n\ntarif:                  ; fonction : total avec remise eventuelle\n    mov rax, rdi        ; copie prix dans rax\n    imul rax, rsi       ; total = prix*jours = 20\n    cmp rsi, 3          ; compare jours a 3\n    jl .fin             ; jours < 3 : pas de remise, on garde total\n    mov rcx, rax        ; garder total dans rcx\n    xor rdx, rdx        ; met rdx a 0 : preparer idiv (dividende sur rdx:rax)\n    mov rbx, 10         ; diviseur = 10\n    idiv rbx            ; rax = total/10 = 2\n    sub rcx, rax        ; total - total/10 = 18\n    mov rax, rcx        ; resultat final dans rax\n.fin:                   ; point de sortie commun\n    ret                 ; retour a l'appelant\n; echo $?  -> 18        # affiche le code de sortie : 18",
    note: "La fonction combine multiplication, comparaison, saut conditionnel et division (avec la préparation de rdx). L'étiquette locale .fin sert de point de sortie commun. C'est un vrai petit if... dans une fonction respectant la convention d'appel." }
  ]
};
