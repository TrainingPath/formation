<script>
var DAY = {
  num: 8,
  title: "Les boucles",
  subtitle: "Répéter avec une étiquette et un saut en arrière — le for et le while de l'assembleur.",
  theory: `
<h3>1. Une boucle = étiquette + saut en arrière</h3>
<p>Rappels : un <strong>registre</strong> est une case ultra-rapide dans le processeur (ici <code>rcx</code>, souvent utilisé comme compteur), une <strong>étiquette</strong> est un nom qui marque une ligne du programme, et un <strong>saut</strong> (branchement) renvoie l'exécution vers une étiquette. Un <strong>compteur</strong> est simplement un nombre qu'on fait diminuer (ou augmenter) pour savoir combien de tours il reste.</p>
<pre class="pseudo">    mov rcx, 4          ; place 4 dans rcx = compteur (nombre de tours a faire)
boucle:                 ; etiquette : debut du corps de la boucle
    ; ... corps ...      ; le travail repete a chaque tour
    dec rcx             ; decremente le compteur : rcx = rcx - 1
    jnz boucle          ; si rcx != 0, sauter EN ARRIERE a "boucle" (recommencer)</pre>
<p>Une boucle est simplement un bloc marqué d'une <strong>étiquette</strong>, terminé par un <strong>saut conditionnel en arrière</strong>. Ici : décrémenter le compteur et reboucler tant qu'il n'est pas nul (<code>jnz</code> = jump if not zero, « saute si ce n'est pas zéro »). <code>dec</code> veut dire « décrémenter » (enlever 1).</p>

<h3>2. Accumuler dans une boucle</h3>
<p><strong>Accumuler</strong> veut dire additionner petit à petit dans un registre qui garde le total.</p>
<pre class="pseudo">    mov rcx, 4          ; compteur : repeter 4 fois
    mov rax, 0          ; rax = 0 = total de depart (accumulateur)
boucle:                 ; debut du corps
    add rax, 5          ; ajoute 5 au total a chaque tour
    dec rcx             ; compteur = compteur - 1
    jnz boucle          ; recommencer tant que rcx != 0 -> rax finit a 20 (5x4)</pre>

<h3>3. Boucle « pour i de 0 à n »</h3>
<pre class="pseudo">    mov rbx, 0          ; i = 0 (l'index de depart)
    mov rcx, 10         ; n = 10 (la borne)
boucle:                 ; debut du corps
    cmp rbx, rcx        ; compare i a n : est-ce que i < n ?
    jge fin             ; si i >= n, sortir de la boucle (aller a fin)
    ; ... corps utilisant rbx ...   ; le travail, qui peut se servir de i
    inc rbx             ; i = i + 1 (avancer l'index)
    jmp boucle          ; revenir tester la condition (saut inconditionnel)
fin:                    ; etiquette de sortie</pre>
<p>Deux styles : compter <strong>vers le bas</strong> (dec/jnz, plus court) ou <strong>vers le haut</strong> avec un test explicite (cmp/jge), utile quand l'index sert dans le corps. <code>inc</code> veut dire « incrémenter » (ajouter 1).</p>

<h3>4. L'instruction loop (x86)</h3>
<pre class="pseudo">    mov rcx, 4          ; compteur (loop utilise TOUJOURS rcx)
boucle:                 ; debut du corps
    ; ... corps ...      ; le travail repete
    loop boucle         ; decremente rcx ET saute a boucle si rcx != 0 (2 en 1)</pre>
<div class="warn"><code>loop</code> combine <code>dec rcx</code> + <code>jnz</code> en une instruction, mais utilise obligatoirement <code>rcx</code> et est souvent plus lente que <code>dec/jnz</code>. On la mentionne, mais on préfère généralement le couple explicite.</div>

<h3>5. Les trois cibles</h3>
<p>Le mécanisme d'une boucle est le même partout ; seuls les noms d'instructions changent selon l'<strong>architecture</strong> (la famille de processeur).</p>
<pre class="pseudo">NASM   dec rcx ; jnz boucle          ; decremente rcx puis saute si non nul
AT&amp;T   dec %rcx ; jnz boucle         ; meme chose, syntaxe AT&amp;T (registres en %)
ARM64  subs x1, x1, 1 ; b.ne boucle   ; subs soustrait 1 ET met a jour les drapeaux, b.ne reboucle</pre>
<div class="tip">En ARM64, <code>subs</code> (avec un <em>s</em>) soustrait <strong>et</strong> positionne les drapeaux d'un coup ; <code>b.ne</code> reboucle. Le principe est identique partout : un compteur, un corps, un test, un saut en arrière. Attention à toujours faire progresser le compteur — sinon boucle infinie.</div>`,
  exercises: [
    { type: "qcm", q: "Une boucle en assembleur, c'est…", opts: ["un mot-clé for", "une étiquette + un saut en arrière", "une accolade", "un write"], a: 1, exp: "Pas de for structuré." },
    { type: "qcm", q: "<code>jnz boucle</code> saute si…", opts: ["rcx == 0", "le résultat précédent n'est pas nul (rcx != 0)", "toujours", "jamais"], a: 1, exp: "Jump if not zero." },
    { type: "qcm", q: "<code>dec rcx</code> fait…", opts: ["rcx + 1", "rcx - 1", "rcx = 0", "rien"], a: 1, exp: "Décrément." },
    { type: "qcm", q: "Compter vers le bas utilise…", opts: ["cmp/jge", "dec/jnz (plus court)", "add seul", "jmp seul"], a: 1, exp: "Décrémenter jusqu'à 0." },
    { type: "qcm", q: "Compter vers le haut (pour i de 0 à n) utilise…", opts: ["dec/jnz", "cmp i, n + jge + inc", "loop seul", "neg"], a: 1, exp: "Test explicite." },
    { type: "qcm", q: "L'instruction <code>loop</code> combine…", opts: ["mov + add", "dec rcx + jnz", "cmp + je", "write + exit"], a: 1, exp: "Mais utilise rcx et est parfois plus lente." },
    { type: "qcm", q: "Oublier de faire progresser le compteur…", opts: ["accélère", "crée une boucle infinie", "trie", "affiche"], a: 1, exp: "Le test ne devient jamais faux." },
    { type: "qcm", q: "Après 4 tours de <code>add rax, 5</code> (rax=0 au départ), rax =", opts: ["5", "20", "9", "4"], a: 1, exp: "5×4." },
    { type: "qcm", q: "<code>inc rbx</code> dans une boucle « vers le haut » sert à…", opts: ["décrémenter", "avancer l'index (i++)", "comparer", "sauter"], a: 1, exp: "Progression." },
    { type: "qcm", q: "L'étiquette de boucle est la cible…", opts: ["d'un mov", "du saut en arrière", "d'un write", "de rien"], a: 1, exp: "On y revient." },
    { type: "vf", q: "En ARM64, subs soustrait ET positionne les drapeaux.", a: true, exp: "Le s final." },
    { type: "qcm", q: "Le principe universel d'une boucle :", opts: ["accolades", "compteur, corps, test, saut en arrière", "un seul mov", "write"], a: 1, exp: "Même partout." },
    { type: "qcm", q: "cmp rbx, rcx ; jge fin sort de la boucle quand…", opts: ["rbx < rcx", "rbx >= rcx", "toujours", "jamais"], a: 1, exp: "Condition de fin." },
    { type: "qcm", q: "Pourquoi préférer dec/jnz à loop ?", opts: ["loop n'existe pas", "dec/jnz est souvent plus rapide et n'impose pas rcx", "aucune raison", "loop est plus sûr"], a: 1, exp: "Plus flexible." },
    { type: "qcm", q: "b.ne (ARM64) reboucle si…", opts: ["résultat nul", "résultat non nul", "toujours", "jamais"], a: 1, exp: "Not equal (à 0)." }
  ],
  final: {
    title: "Exercice final — Somme de 1 à 5",
    intro: `<p>On veut 1+2+3+4+5 = 15. Analyse :</p>
<pre class="pseudo">    mov rcx, 5          ; compteur de depart = 5
    mov rax, 0          ; total = 0
boucle:                 ; debut du corps
    add rax, rcx        ; ajoute la valeur du compteur au total
    jnz boucle          ; reboucle si non nul... mais rcx ne change JAMAIS : boucle infinie !</pre>`,
    questions: [
      { type: "qcm", q: "Le bug :", opts: ["aucun", "rcx n'est jamais décrémenté : boucle infinie", "add est faux", "rax mal init"], a: 1, exp: "dec rcx manque." },
      { type: "qcm", q: "Que faut-il ajouter avant jnz ?", opts: ["rien", "dec rcx", "inc rax", "un cmp"], a: 1, exp: "Faire progresser le compteur." },
      { type: "qcm", q: "add rax, rcx additionne…", opts: ["toujours 5", "la valeur courante du compteur (5,4,3,2,1)", "0", "l'adresse"], a: 1, exp: "rcx change à chaque tour (après dec)." },
      { type: "qcm", q: "Après correction, rax vaut…", opts: ["10", "15", "25", "5"], a: 1, exp: "5+4+3+2+1." },
      { type: "qcm", q: "jnz sort de la boucle quand…", opts: ["rcx > 0", "rcx atteint 0", "jamais", "au premier tour"], a: 1, exp: "Zero flag." }
    ],
    solution: `<pre class="pseudo">section .text          ; debut de la section du code executable
    global _start      ; rend _start visible pour l'editeur de liens (point d'entree)
_start:                ; le programme demarre ici
    mov rcx, 5         ; compteur de depart = 5
    mov rax, 0         ; total = 0 (accumulateur)
boucle:                ; etiquette : debut du corps
    add rax, rcx       ; ajoute le compteur au total (+5, puis 4, 3, 2, 1)
    dec rcx            ; faire progresser le compteur vers 0
    jnz boucle         ; reboucler tant que rcx != 0
    mov rdi, rax       ; copie le total (15) dans rdi = code de sortie
    mov rax, 60        ; numero de l'appel systeme exit
    syscall            ; le noyau termine le programme
; echo $?  -> 15       # dans le terminal, echo $? affiche 15
; ARM64 : subs x1, x1, 1 ; b.ne boucle   ; meme boucle en syntaxe ARM64</pre>
<p>Il manquait <code>dec rcx</code> : sans progression, la boucle tourne sans fin. Toujours vérifier que le compteur avance vers la sortie. Demain : la pile.</p>`
  }
};
</script>
